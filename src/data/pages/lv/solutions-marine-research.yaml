content_challenge:
  tagline: Izaicinājums
  title: Jūras pētniecības prasības<br />Stabilas, instrumentāli gatavas platformas
  subtitle: Zinātniskajām darba laivām jānodrošina stabila platforma jutīgai instrumentācijai, klusa darbība, lai netraucētu savvaļas dzīvniekiem, un elastīgi izkārtojumi dažādam pētniecības aprīkojumam.
  paragraphs:
    - Jūras pētniecība un vides monitorings prasa darba laivas, kas kalpo kā mobilās laboratorijas. Atšķirībā no komerciālajiem vai atpūtas kuģiem, pētījumiem RIBs jāietver jutīga elektroniskā aparatūra, ūdens un nogulumu paraugu ņemšanas aprīkojums, kā arī dažkārt dzīvu paraugu transportēšana — vienlaikus saglabājot stabilu platformu precīzai datu vākšanai.
    - '**Platformas stabilitāte ir kritiska** — Sonārs, atbalss zondētāji un CTD (vadītspēja, temperatūra, dziļums) profilētāji prasa stabilu korpusu miera stāvoklī un lēnā ātrumā. Pārmērīga viļņu vai korpusa kustība ievieš troksni zinātniskajos datos. Dziļā V tipa korpuss ar labām stabilitātes īpašībām ir būtisks.'
    - '**Instrumentu integrācija** — Pētniecības kuģiem nepieciešami stiprinājuma punkti GPS antenām, sonāra pārveidotājiem, paraugu ņemšanas rokām un datu reģistrēšanas iekārtām. Konsoles telpā jāspēj izvietot vairākus displejus, instrumentu enerģijas sadali un drošu uzglabāšanu jutīgai elektronikai.'
    - '**Klusa darbība** — Jūras bioloģijas apsekojumiem un vides monitoringam dzinēju troksnis un korpusa vibrācijas var biedēt jūras dzīvi un traucēt uzvedības novērojumus. Klusas ārējās konfigurācijas un samazinātas vibrācijas korpusa dizaini ir svarīgi pētniecības pielietojumos.'
    - Paddle Board Overstock RIBs Pētījumi tiek izstrādāti ar stabilām korpusa platformām, integrētām aprīkojuma stiprinājuma sistēmām un klusām ārējām konfigurācijām zinātniskām un vides monitoringa vajadzībām.
content_solution:
  tagline: Mūsu risinājums
  title: Speciāli būvēti pētījumi RIBs<br />Zinātnes un vides darbam
  subtitle: Katrs Paddle Board Overstock pētījums RIB ir konfigurēts kā stabila, pielāgojama platforma zinātniskajai instrumentācijai un lauka paraugu ņemšanas aprīkojumam.
  list:
    - Deep-V stikla šķiedras korpuss ar izcilu stabilitāti miera stāvoklī un lēnā izpētes ātrumā
    - Plakana klāja izkārtojums ar aprīkojuma stiprinājuma plāksnēm sonāram, GPS un paraugu ņemšanas aprīkojumam
    - Konsole konfigurēta vairākiem displejiem — plotteris, skaņotājs, datu reģistrators
    - 12V un 24V piederumu jaudas sadalījums zinātniskajiem instrumentiem
    - Kluss četrtaktu ārējais dzinējs — minimāla vibrācija un troksnis savvaļas dzīvnieku novērojumos
    - Izvēles zema viļņa korpusa dizains minimāliem traucējumiem datu vākšanas laikā
    - Pielāgotas cauruļu krāsas pētniecības institūta zīmolam un autoparka identifikācijai
content_segments:
  tagline: Pētniecības profili
  title: Jūras zinātnes risinājumi<br />Pēc lietojumprogrammas veida
  subtitle: Dažādām pētniecības jomām ir unikālas kuģu prasības — sākot no universitāšu mācību platformām līdz vides izpētes kuģiem un ūdens kvalitātes monitoringamRIBs.
  items:
    - title: Universitāšu jūras zinātnes programmas
      subtitle: Mācību platformas, studentu ekskursijas, piekrastes pētījumi
      description: Jūras zinātnes universitātēm un okeanogrāfijas nodaļām ir nepieciešamas uzticamas, daudzpusīgas darba laivas lauka kursu, studentu pētniecības projektu un pasniedzēju vadītu piekrastes apsekojumu veikšanai. Laivai jābūt viegli vadāmai studentiem uzraudzībā, pietiekami stabilai praktiskai instrumentu izvietošanai un pietiekami izturīgai, lai to bieži izmantotu vairāki lietotāji akadēmiskajos semestros. Budžeta ierobežojumi akadēmiskajās vidēs padara izmaksu efektivitāti un zemu uzturēšanas līmeni par svarīgiem apsvērumiem.
      features:
        - Stabila platforma studentu instrumentu izvietošanai un atgūšanas praksei
        - Vienkārša darbība — stūres vai vienas konsoles konfigurācija uzraudzītai studentu lietošanai
        - Izturīgas Hypalon caurules biežām izkāpšanām krastā un studentu apkalpošanai
        - Aprīkojuma stiprināšana mācību klases sonāram, secchi diskam un paraugu ņemšanas aprīkojumam
        - Izmaksu ziņā efektīva PVC iespēja budžeta ierobežotām akadēmiskajām programmām
    - title: Jūras pētniecības institūti
      subtitle: Aptauja RIBs ar instrumentu integrāciju, GPS, paraugu ņemšanas aprīkojumu
      description: Speciālas jūras pētniecības organizācijas, kas veic piekrastes un jūras apsekojumus, prasa profesionāli konfigurētu izpēti RIBs ar integrētu instrumentāciju. Šie kuģi ir aprīkoti ar sonāra sistēmām batimetriskās kartēšanas veikšanai, CTD profilētājiem ūdens kolonnas analīzei, nogulumu paraugu ņemšanas iekārtām un bioloģiskās savākšanas iekārtām. Laivai jānodrošina stabila platforma lēnā apsekojuma ātrumā, pietiekami plaša klāja vieta iekārtu izvietošanai un jānodrošina tīra 12V/24V elektroapgāde elektronikai.
      features:
        - Integrētais sonāra transduktora stiprinājums — caur korpusu vai transoma konfigurācija
        - GPS antenas stiprināšana un konsoles integrācija mērījumu līmeņa navigācijai
        - CTD un ūdens paraugu ņemšanas izvietošanas zona ar drošām piesiešanas vietām
        - 12V/24V palīgbarošanas sadalījums instrumentiem un datu reģistratoriem
        - Stabils lēnā ātrumā (3-6 mezgli) mērījumu līnijas precizitātei
        - Papildu A-rāmis vai dāvinātājs smagāku paraugu ņemšanas iekārtu izvietošanai
    - title: Vides monitorings un aizsardzība
      subtitle: Ekoloģiskie pētījumi, savvaļas dzīvnieku novērošana, biotopu novērtējums
      description: Vides NVO, valsts iestādes un dabas aizsardzības organizācijas veic jūras ekoloģiskos pētījumus, savvaļas dzīvnieku populācijas monitoringu un dzīvotņu novērtējumus. Šīm operācijām nepieciešami klusi, zemas ietekmes kuģi, kas var piekļūt jutīgām dzīvotnēm, netraucējot savvaļas dzīvniekiem. Laivām jābūt aprīkotām ar kameru aprīkojumu, GPS transektu kartēšanai un paraugu ņemšanas aprīkojumu ūdens un nogulumu savākšanai. Zems vilnis un minimāls dzinēja troksnis ir kritiski uzvedības novērojumu pētījumos.
      features:
        - Kluss četrtaktu dzinējs ārbordā — minimāli traucējumi jūras dzīvniekiem
        - Stabila novērošanas platforma fotogrāfijai un video dokumentācijai
        - Aprīkojuma montāža kameru komplektiem, GPS izsekotājiem un lauka datoriem
        - Sekls grimšanas dziļums piekļuvei piekrastes mitrājiem, mangroviem un estuāriem
        - Viegli tīrāmi klāja un cauruļu virsmas dezinficēšanai starp vietām
    - title: Ūdens kvalitātes uzraudzība un testēšana
      subtitle: Regulāri paraugu ņemšanas posmi, piesārņotāju izsekošana, atbilstības uzraudzība
      description: Ūdens kvalitātes uzraudzības organizācijas regulāri veic paraugņemšanas izbraucienus piekrastes zonās, ostās un iekšējos ūdeņos, lai sekotu piesārņojuma līmeņiem, aļģu uzplaukumiem un vides reglamenta ievērošanai. Šīm operācijām nepieciešamas efektīvas, uzticamas laivas atkārtotiem apmeklējumiem fiksētajās paraugņemšanas stacijās. Kuģim jāspēj pārvadāt paraugņemšanas aprīkojumu, ledusskapjus paraugu saglabāšanai un lauka testēšanas ierīces — ar vieglu klāja mazgāšanu starp paraugņemšanas vietām, lai novērstu krustenisko piesārņojumu.
      features:
        - Īpaša paraugu ņemšanas stacija ar dzesētāju un aprīkojuma uzglabāšanu
        - Viegli tīrāmas klāja un cauruļu virsmas starp vietnēm dezinficēšanai
        - GPS integrācija precīzai atgriešanai pie fiksētajām paraugu ņemšanas koordinātēm
        - Kompakts izmērs piekļuvei ierobežotām ūdensceļiem un šauriem kanāliem
        - Degvielu taupoša ārbordā dzinējs izmaksu efektīvām regulārām paraugu ņemšanas braucieniem
