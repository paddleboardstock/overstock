hero:
  tagline: Mūsu stāsts
  title: Aquafarer — Brīvības inženierija uz ūdens
  subtitle: 'No piekrastes darbnīcas līdz globālam jūras ražotājam — mūsu ceļš balstās uz spītīgu pārliecību: ūdens transportlīdzekļiem jābūt projektētiem tā, it kā tie būtu svarīgi, jo tie patiešām ir svarīgi.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer rūpnīca un jūras ražošanas objekts Cjindao
