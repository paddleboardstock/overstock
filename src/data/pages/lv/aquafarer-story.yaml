timeline:
  - year: '2012'
    title: Jūras ražošanas fonds
    body: sākotnēji Aquafarer tā bija specializēta piepūšamo ūdens transportlīdzekļu darbnīca Cjindao, Ķīnā, kas bija veltīta jūras amatniecībai un piepūšamo laivu ražošanai. Sākotnējais uzsvars bija uz uzticamu piepūšamo produktu izstrādi, izmantojot praktisku inženierijas pieredzi un ražošanas disciplīnu.
  - year: '2015'
    title: Pirmais eksports un CE sertifikācija
    body: Sākotnējie eksporta pasūtījumi sasniedza Japānu un Koreju.CE Sertifikācija tika iegūta galvenajām produktu līnijām, Aquafareriezīmējot tās ieiešanu starptautiskajos tirgos. Uzņēmums sāka apkalpot komerciālos un atpūtas lietotājus ārpus Ķīnas.
  - year: '2018'
    title: Rūpnīcas paplašināšana
    body: Pārvietots uz 12 000 m² ražošanas telpu. Pievienotas RF metināšanas līnijas un drop-stitch ražošanas jauda, kas ļāva veikt lielāka mēroga ražošanu un uzlabotas kvalitātes kontroles sistēmas.
  - year: '2020'
    title: Izveidots pētniecības un attīstības centrs
    body: Tika atvērts īpašs pētniecības un attīstības centrs ar PVC auduma laboratoriju, hidrodinamisko testu tvertni un CAD/FEA simulācijas studiju. Produktu izstrāde tika paplašināta, koncentrējoties uz vieglu konstrukciju, uzlabotu izturību un lietotājam orientētu dizainu.
  - year: '2022'
    title: Sertifikācija un globālā izaugsme
    body: Iegūta ISO 9001 sertifikācija. Paplašināta līdz 14 pētniecības un attīstības inženieriem un 200+ darbiniekiem. Produkti sasniedza klientus visā Eiropā, Amerikā un Āzijas un Klusā okeāna reģionā caur izplatītājiem un OEM partnerībām.
  - year: '2024'
    title: Inovāciju un dizaina studija
    body: Uzsāka pilna servisa dizaina un inovāciju studiju pielāgotiem ODM projektiem, sākot no koncepcijas līdz ražošanai. Stiprināja profesionālās jūras lietojumprogrammas, tostarp glābšanas, komerciālos un valdības iepirkumus.
  - year: '2026'
    title: Ūdens izpētes nākotnes veidošana
    body: Šodien Aquafarer turpina attīstīt piepūšamās laivas, SUP sistēmas un pielāgotus jūras risinājumus — savienojot cilvēkus un organizācijas ar pasaules ūdeņiem.+ Apkalpotas 50 valstis, gada kapacitāte 15 000 vienību.
content_founding:
  tagline: Sākums
  title: Dzimis pie krastmalas
  subtitle: 'Aquafarer sākās piekrastes darbnīcā Cjindao ar vienu laivu un vīziju: uzbūvēt piepūšamus ūdens transportlīdzekļus, kas spētu izturēt reālus jūras apstākļus.'
  paragraphs:
    - 2012. gadā mūsu dibinātāji saskatīja tirgus nišu — lielākā daļa piepūšamo laivu bija vai nu pieejamas, bet neuzticamas, vai arī augstas kvalitātes, bet pārāk dārgas. Viņi uzskatīja, ka ir vieta ražotājam, kas nodrošina gan kvalitāti, gan vērtību.
    - Pirmais korpuss tika būvēts ar rokām, testēts vietējos ūdeņos un pilnveidots, balstoties uz reālu zvejnieku un mazo komerciālo operatoru atsauksmēm. Šī atgriezeniskā saite — būvēt, testēt, klausīties, uzlabot — joprojām ir mūsu inženierijas filozofijas pamatā.
    - Līdz 2015. gadam ziņas izplatījās ārpus Čingdao. Starptautiskie izplatītāji sāka pieprasīt paraugus. Tas, kas sākās kā vietēja darbnīca, kļuva par globālu piegādātāju.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Agrīnā ražošanas darbnīca un ražošana
content_growth:
  tagline: Izaugsme un inovācijas
  title: No darbnīcas līdz 12 000 m² lielai ēkai
  subtitle: Nepārtrauktas investīcijas cilvēkos, aprīkojumā un procesos ir pārvērtušās Aquafarer par modernu jūras ražošanas uzņēmumu.
  paragraphs:
    - Pieprasījumam pieaugot, pieauga arī mūsu ražotne. Mēs paplašinājāmies no nelielas darbnīcas līdz 12 000 m² rūpnīcai ar speciālām ražošanas līnijām RIB laivām, piepūšamām laivām SUP , dēļiem un aksesuāriem.
    - Mēs ieguldījām CNC griešanas iekārtās, augstas frekvences metināšanas iekārtās, drop stitch ražošanas līnijās un visaptverošās testēšanas platformās — ļaujot mums kontrolēt katru ražošanas kvalitātes aspektu.
    - Mūsdienās mūsu 200–300 cilvēku komandā ir jūras inženieri, materiālu zinātnieki, kvalitātes kontroles speciālisti un prasmīgi amatnieki — daudzi no viņiem strādā Aquafarer jau kopš pašiem pirmsākumiem.
founder:
  tagline: Iepazīstieties ar dibinātāju
  title: Uzbūvēja ūdensvīrs
  subtitle: Dibinātājs Deivids Čens apvieno ražošanas pieredzi un mūža aizraušanos ar ūdens sportu — kombināciju, kas definē pieeju Aquafarer produktu izstrādei.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: Deivids Čens — Uzņēmuma Aquafarerdibinātājs
  story:
    - Deivids Čens uzauga Cjindao piekrastē, kur jūra nebija atpūtas galamērķis, bet dzīvesveids. Viņš jaunību pavadīja, laivojot, burājot un makšķerējot Dzeltenajā jūrā — pieredzes, kas viņam deva intuitīvu izpratni par to, kas ūdenstransportam jāiztur.
    - Pirms dibināšanas AquafarerDeivids desmit gadus strādāja jūras ražošanā, strādājot ražošanas, kvalitātes un starptautiskās tirdzniecības jomās. Viņš OEM vadīja programmas Eiropas un Ziemeļamerikas zīmoliem, personīgi apgūstot globālo tirgu standartus un gaidas.
    - '2012. gadā viņš dibināja Aquafarer uzņēmumu ar vienkāršu misiju: uzbūvēt piepūšamus ūdens transportlīdzekļus, kurus uzticētu savai ģimenei uz ūdens. Šis personīgais standarts — vai es to izmantotu? — joprojām ir pēdējais tests katram produktam, kas iziet no rūpnīcas.'
    - Šodien Deivids vada produktu stratēģiju un uzrauga pētniecības un attīstības komandu, personīgi pārskatot jaunus dizainus un testējot prototipus pie Čingdao ūdeņiem. Viņš uzskata, ka lieliski produkti rodas, izprotot gan inženieriju, gan pieredzi.
philosophy:
  tagline: Zīmola filozofija
  title: Inženierijas brīvība ūdenī
  body: Brīvība uz ūdens nav tikai par kustību. Tā nozīmē jaunu vietu atklāšanu, āra pieredzes radīšanu, cilvēku savienošanu ar dabu un profesionālo misiju īstenošanu. Inženierija padara šo brīvību iespējamu.
  pillars:
    - title: Uzticamība pirmajā vietā
      body: Ūdens vide prasa uzticību.Aquafarer Produkti ir veidoti ap stabilitāti, izturību, drošību un konsekventu veiktspēju.
    - title: Cilvēkcentrēts dizains
      body: Produktiem jākalpo cilvēkiem, nevis tehnoloģijām. Katrs dizaina lēmums sākas ar izpratni par to, kā cilvēki izmanto ūdens transportu, kur viņi pēta un ar kādiem izaicinājumiem saskaras.
    - title: Pieejama izpēte
      body: Ūdens nedrīkst piederēt tikai ekspertiem.Aquafarer Izveido aprīkojumu, kas ļauj vairāk cilvēkiem droši izbaudīt upes, ezerus, okeānus un piekrastes vidi.
    - title: Nepārtraukta inovācija
      body: Inovācija nav tikai jaunu produktu radīšana. Tā uzlabo katru detaļu — materiālus, konstrukcijas, ražošanu un lietotāja pieredzi.
engineeringDna:
  tagline: DNS inženierija
  title: Kā Aquafarer tiek radīti produkti
  areas:
    - title: Materiālu zinātne
      body: Aquafarer koncentrējas uz piemērotu materiālu izvēli dažādām jūras vidēm. Galvenie apsvērumi ietver izturību pret berzi, UV izturību, spiediena stabilitāti un ilgtermiņa izturību.
      items:
        - Nodilumizturība
        - UV Izturība
        - Spiediena stabilitāte
        - Ilgtermiņa izturība
    - title: Būvniecības inženierija
      body: Piepūšamajiem ūdens transportlīdzekļiem nepieciešama precīza stingrības, svara, pārnēsājamības un stabilitātes līdzsvars. Aquafarer inženierija koncentrējas uz šo faktoru optimizēšanu, izmantojot drop-stitch pamattehnoloģiju un progresīvu šuvju konstrukciju.
      items:
        - Stingrība
        - Svara optimizācija
        - Pārnesamība
        - Stabilitāte
    - title: Ražošanas precizitāte
      body: 'Katrs produkts iziet kontrolētas procesus: materiālu sagatavošana, precīza griešana, metināšana un līmēšana, montāža, kvalitātes pārbaude un darbības pārbaude.'
      items:
        - Materiālu sagatavošana
        - Precīza griešana
        - Metināšana un līmēšana
        - Montāža un kvalitātes kontrole
    - title: Lietotāja scenāriju inženierija
      body: Produkti tiek veidoti, balstoties uz reālām pielietojuma situācijām — atpūtu, piedzīvojumiem un profesionālu lietošanu — nodrošinot, ka katrs dizains atbilst tā paredzētās vides specifiskajām prasībām.
      items:
        - Atpūta
        - Piedzīvojumi
        - Professional
        - Komerciāls
trustSignals:
  tagline: Uzticības signāli
  title: Kāpēc Aquafarer ir uzticams partneris
  manufacturing:
    title: Ražošanas jauda
    body: 12 000 m² ražošanas platība ar 200–300 kvalificētiem darbiniekiem un 14+ pētniecības un attīstības inženieriem. ISO 9001 sertificēta kvalitātes vadības sistēma. Gada izlaide 15 000 piepūšamu ūdens transportlīdzekļu vienību, apkalpojot 50+ valstis.
    stats:
      - label: Iekārtu lielums
        value: 12,000 m²
      - label: Darbinieku skaits
        value: 200-300
      - label: R&D inženieri
        value: 14+
      - label: Gada kapacitāte
        value: 15,000
  quality:
    title: Kvalitātes apņemšanās
    body: No materiālu pārbaudes līdz galīgajai testēšanai, Aquafarer uztur sistemātiskus kvalitātes procesus, lai piegādātu uzticamus jūras produktus. Katrs vienums tiek pakļauts spiediena testam, šuvju pārbaudei un veiktspējas pārbaudei pirms nosūtīšanas.
    items:
      - CE Sertificēts — 64 modeļi atbilst Eiropas drošības standartiem
      - ISO 9001:2015 — Kvalitātes vadības sistēma sertificēta
      - UKCA Apzīmēts — Lielbritānijas tirgus atbilstība
  global:
    title: Globālā klātbūtne
    body: Aquafarer apkalpo klientus vairākos pasaules tirgos, atbalstot izplatītājus, āra zīmolus un profesionālus jūrniecības lietotājus 50+ valstīs visā Eiropā, Āzijas un Klusā okeāna reģionā, Amerikā, Tuvajos Austrumos un Āfrikā.
comparison:
  tagline: Zīmola pozicionēšana
  title: Aquafarer tirgū
  position: Inženierzinātnēm orientēts jūras ražotājs, kas apvieno piepūšamo ūdens transportlīdzekļu pieredzi ar pilnu OEM/ODM kapacitāti, pielāgotus risinājumus un dziļu ražošanas pieredzi.
  strengths:
    - Piepūšamo ūdens transportlīdzekļu inženierijas pieredze
    - Pilna OEM/ODM ražošanas jauda
    - Pielāgotu produktu izstrāde un dizains
    - 12 000 m² ISO 9001 sertificēta ražošanas telpa
  bestFor:
    - Āra atpūtas lietotāji, kuri meklē uzticamus piepūšamos ūdens transportlīdzekļus
    - Jūras operatori, kuriem nepieciešama komerciālas klases iekārta
    - Zīmola partneri, kuriem nepieciešama OEM/ODM ražošana
    - Profesionālas glābšanas un patrulēšanas organizācijas
