material_traceability:
  tagline: Izsekojamība
  title: Materiālu izsekošana un partiju kontrole
  description: Katras izejvielu partijas tiek piešķirts unikāls lota numurs mūsu ERP sistēmā. No saņemšanas brīža līdz ražošanai un līdz gatavam produktam, katras laivas materiālu saraksts sasaista atpakaļ uz oriģinālo piegādātāja partiju. Tas ļauj pilnīgu augšupejošu izsekojamību jebkuram kvalitātes vai atbilstības jautājumam.
  system: Pielāgota ERP (iekšējā sistēma) + fiziskās partiju birkas katrā darba uzdevumā
  coverage: 100% ražošanas materiālu — PVC, Hypalon, drop-stitch audums, līmes, vārsti, aparatūra, iepakojums
  records_retained: 10 gadi (saskaņā ar CE 2013/53/ES prasību)
  suppliers:
    - material: Jūras klases PVC
      source: Ķīniešu un korejiešu piegādātāji
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch audums
      source: Iekšējā aušana + ārējais partneris
      certified: Iekšējā QC + piegādātājam ISO 9001
    - material: Vārsti un aparatūra
      source: Chinese OEM suppliers
      certified: ISO 9001, materiālu sertifikāti pēc katras partijas
