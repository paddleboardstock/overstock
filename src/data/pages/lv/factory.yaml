hero:
  tagline: Rūpnīca
  title: Rūpnīca un ražošana
  subtitle: 12 000 m² integrētas ražošanas — no izejvielām līdz gatavam laivam
intro:
  - Kā **Paddle Board Overstock Qingdao ražošanas centra** rūpnīcas zīmols, Paddle Board Overstock kontrolē katru ražošanas posmu — no izejvielu PVC un stikla šķiedras materiālu saņemšanas līdz gala laivas piegādes pārbaudei. Mūsu ražošanas uzņēmums Qingdao Ekonomiskās attīstības zonā aizņem 12 000 kvadrātmetru un ietver specializētas darbnīcas PVC griešanai, cauruļu siltuma zīmogošanai, stikla šķiedras RIB korpusu ražošanai, SUP digitālai drukai, galīgajai montāžai un kvalitātes pārbaudei.
  - Integrējot dizainu, inženieriju, prototipēšanu, ražošanu un testēšanu vienā vietā, mēs novēršam līgumražošanas neefektivitāti un saglabājam tiešu kontroli pār būvniecības kvalitāti, materiālu izvēli un piegādes termiņiem. Katra laiva, kas iziet no mūsu darbnīcas, tiek uzbūvēta mūsu darbinieku, ar mūsu iekārtām un pēc mūsu standartiem.
