workshops_section:
  tagline: Darbnīcas
  title: Ražošanas darbnīcas
  workshops:
    - title: PVC Griešana un materiālu sagatavošana
      description: Automātiskās CNC PVCHypalongriešanas iekārtas apstrādā , , un drop-stitch audumus ar submilimetru precizitāti. Datorizēta ligzdošana minimizē materiālu zudumus un nodrošina, ka katrs panelis atbilst tā izmēru specifikācijām pirms metināšanas.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Cauruļu metināšana un siltuma hermetizācija
      description: Speciāla metināšanas darbnīca ar siltuma blīvēšanas iekārtām un RF dielektriskajām presēm. Karstā gaisa siltuma hermetēzes salīmē un aizdedzina PVC cauruļu kameras, savukārt RF metinājumi rada augstas stiprības, hermētiskas šuves, kas pārsniedz ISO 9001 prasības.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: RIB Korpusa ražošana — stiklašķiedra
      description: RIB Laivu korpusi tiek ražoti, izmantojot roku uzklātu stiklašķiedras veidni ar poliestera un vinilestera sveķu sistēmām. Katrs slānis tiek roku rullēts un vakuumā iepakots, nodrošinot vienmērīgu kvalitāti. Gelcoat smidzināšanas kabīne nodrošina augstu spīdumu, UVizturīgu jūras apdari.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: SUP Drukāšana un dekorēšana
      description: SUP Kartoni tiek dekorēti ar digitālo druku pilnkrāsu grafikai un sietspiedei logotipiem un atkārtotiem rakstiem. Digitālie printeri veido fotokvalitātes terases dizainus, savukārt sietspiede nodrošina izturīgas, spilgtas zīmola zīmes.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Galīgā montāža un aprīkojums
      description: Montāžas līnija, kur tiek savienoti stiklašķiedras korpusi un PVC caurules, uzstādīti dzinēji, stūrēšana un vadības ierīces, kā arī elektroinstalācijas. Katra laiva seko 100 punktu montāžas kontrolsarakstam, ko apstiprina komandas vadītājs.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Kvalitātes testēšana un inspekcija
      description: Katra pabeigtā laiva tiek pakļauta obligātai gaisa noturības testēšanai, šuvju noņemšanas pārbaudei un pilnai sistēmu pārbaudei pirms nosūtīšanas. Mūsu kvalitātes laboratorija darbojas neatkarīgi no ražošanas un tieši ziņo vadībai.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
