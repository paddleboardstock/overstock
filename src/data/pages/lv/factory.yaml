qc_section:
  tagline: Kvalitātes kontrole
  title: Testēšanas un kvalitātes nodrošināšanas process
  subtitle: Katra laiva pirms nosūtīšanas tiek pakļauta obligātai testēšanai. Mūsu kvalitātes laboratorija darbojas neatkarīgi no ražošanas un tieši ziņo vadībai.
  steps:
    - step: '1'
      title: Izejvielu inspekcija
      desc: PVC, Hypalon, un drop-stitch audumi tiek pakļauti stiepes testēšanai (ASTM D751), plīsumu izplatībai un UV izturības pārbaudei pirms jebkuras partijas nonākšanas ražošanā.
    - step: '2'
      title: 48 stundu gaisa noturības tests
      desc: Katra caurules kamera tiek uzpūsta līdz 125% no nominālā spiediena un noturēta 48 stundas. Spiediena kritums, kas pārsniedz 5%, izraisa automātisku atgrūšanu un šuves atkārtotu pārbaudi.
    - step: '3'
      title: Slodzes un līdzsvara testēšana
      desc: Pabeigtās laivas tiek iekrautas līdz maksimālajai nominālajai kapacitātei un pārbaudītas stabilitātes, brīvā borta un vadāmības ziņā. Katrs kuģis tiek testēts ūdenī pirms galīgās pārbaudes.
oem_section:
  tagline: OEM Projekti
  title: Zīmola un OEM partnerības gadījumu izpētes
  subtitle: No koncepcijas līdz konteineram — kā mēs palīdzam globāliem zīmoliem uzsākt un paplašināt piepūšamo ūdens transportlīdzekļu līnijas.
  cases:
    - challenge: Eiropas āra preču mazumtirgotājam bija nepieciešama privātā zīmola SUP līnija ar unikālu terases grafiku, videi draudzīgu PVCun mazumtirdzniecībai gatavu iepakojumu — viss piegādāts 60 dienu laikā.
      solution: Izstrādājām pielāgotus digitālos drukas failus, ieguvām REACHatbilstošus PVCun saspiestus paraugus no 3 kārtām līdz 1, kopīgi izvietojot dizaina komandu mūsu Qingdao rūpnīcā.
      result: 55 dienas no parakstītā pasūtījuma līdz FOB2 400 vienībām 4 SKU. Atkārtots pasūtījums veikts pirms pirmā konteinera ierašanās.
    - challenge: ASV ūdenssporta jaunuzņēmumam bija nepieciešams augstas veiktspējas drop-stitch kajaks ar pielāgotu korpusa formu, kopzīmola iepakojumu un BSCI sertifikāciju mazumtirdzniecības izvietošanai.
      solution: Pielāgoja esošo drop-stitch kajaka veidni ar modificētu šūpojošo profilu, izstrādāja kopzīmola iepakojuma mākslu un sniedza pilnu BSCI audita dokumentāciju.
      result: Veiksmīgi iekļauts trīs lielākajās ASV āra tirdzniecības ķēdēs. 5 000+ vienību pirmajā gadā ar 98% pārdošanas rādītāju.
    - challenge: Austrālijas izplatītājs prasīja CEsertificētu RIB klāstu ar pielāgotām lampu krāsām Hypalon , uzlabojumu iespēju un atbilstību Austrālijas standartam AS 1799.
      solution: Ražoja pirmsražošanas paraugus ar 4 cauruļu krāsu variantiem, kas iegūti CSM Hypalon no Japānas piegādātāja, un koordinēja trešās puses AS 1799 atbilstības testus.
      result: 3 modeļu RIB klāsts tika laists klajā Austrālijas/Jaunzēlandes tirgū. Tam sekoja valdības konkursa uzvara 12 patrulēšanas RIBslokomotīvēm.
faq_section:
  tagline: BUJ
  title: B2B & OEM Biežāk uzdotie jautājumi
  questions:
    - q: Kāds ir minimālais pasūtījuma daudzums (MOQ) OEM piepūšamajām SUP dēļiem?
      a: MOQ standarta modeļiem sākas ar 5–10 vienībām OEM . Pielāgotām veidnēm un privāto zīmolu projektiem nepieciešamas vismaz 200 vienības atkarībā no sarežģītības. Jaunu zīmolu izlaišanai ir pieejami izmēģinājuma pasūtījumi un paraugu sērijas.
    - q: Paddle Board Overstock Vai viņam ir BSCI sertifikāts?
      a: Jā. Mūsu rūpnīca uztur derīgu BSCI sociālās atbilstības sertifikāciju (audita ziņojums pieejams pēc pieprasījuma). Mums ir arī ISO 9001:2015 kvalitātes vadībai, un 64 mūsu produktu modeļiem CE ir sertifikācija (TÜVRheinland).REACH un RoHS atbilstības dokumentācija tiek nodrošināta ar katru OEM sūtījumu.
    - q: Kāds ir tipiskais pasūtījuma izpildes laiks OEM ?
      a: Standarta izpildes laiks ir 30–45 dienas no apstiprināta pasūtījuma un depozīta saņemšanas. Pielāgotu veidņu izstrāde pievieno 15–20 dienas instrumentu izgatavošanai. Mēs piedāvājam paātrinātu ražošanu steidzamiem pasūtījumiem un sezonas intensīvajiem periodiem pirms vasaras (janvāris–marts).
    - q: Vai jūs varat kuģot FOB no Ķingdao vai CIF uz mūsu ostu?
      a: Jā. Mēs piegādājam uz FOB Qingdao, CIF lielākajām pasaules ostām un DDP kvalificētiem partneriem. Mūsu loģistikas komanda pārvalda konteineru rezervēšanu, eksporta dokumentāciju un muitas formalitātes. Mēs piegādājam uz 50+ valstīm visā ES, ASV, Austrālijas un Āzijas tirgos.
b2b_moq: 'Standarta MOQ: 5–10 vienības katram modelim (SUP/kajaks/drop-stitch). RIB MOQ: 2–5 vienības. Jauniem partnerībām tiek gaidīti izmēģinājuma pasūtījumi.'
production_flow:
  tagline: Ražošanas plūsma
  title: No materiāla līdz gatavam laivam
  subtitle: Katrs kuģis iziet cauri 6 ražošanas posmiem ar kvalitātes kontroles punktiem katrā solī. Nav īsceļu, nav izlaistu pārbaudījumu.
  stages:
    - stage: '01'
      title: Materiālu saņemšana un ienākošā kvalitātes kontrole
      description: Visi ienākošie materiāli tiek reģistrēti pēc partijas/seres numura mūsu ERP sistēmā. PVC auduma ruļļi, drop-stitch kodoli, vārsti, līmes un aparatūra tiek karantīnā līdz QC apstiprinājumam.
      qc_check: Stiepes izturība (ASTM D751), plīsuma izturība (ISO 4674), biezuma mērītājs, līmvielas viskozitāte, vizuālā defektu pārbaude
      qc_threshold: 100% no partijām testētas. Nērt, ja stiepes izturība < 90% no specifikācijas, plīsums < specifikācijas minimuma vai ja ir kāda vizuāla defekta
      responsibility: Ienākošā QC komanda (3 inspektori)
    - stage: '02'
      title: CNC Griešana un materiāla sagatavošana
      description: Datorā optimizēta izkārtojuma plānošana novieto paneļus uz PVC materiāla, lai samazinātu atkritumus. Automātiskās CNC griešanas mašīnas uztur 0,1 mm pozicionēšanas precizitāti.
      qc_check: Dimensiju pārbaude pret CAD DXF failiem, malu kvalitātes pārbaude, paneļu skaita verificēšana
      qc_threshold: Katru 20. paneli mēra. Tolerance ±0,5 mm. Noraidīt partiju, ja >2% pārsniedz toleranci
      responsibility: Griešanas darbnīcas vadītājs
    - stage: '03'
      title: Metināšana un Drop-Stitch Līmēšana
      description: Drop-stitch kodoli ir saistīti ar ārējām PVC laminātēm, izmantojot karstās laminēšanas metodi. Cauruļu kameras tiek RF-metinātas vai karstās gaisa metinātas. Sliežu joslas ir trīsslāņu sapludinātas.
      qc_check: Atsekošanas tests ik pēc 50 vienībām (ASTM D751), metinājuma platuma mērījums, karstā gaisa temperatūras žurnāla pārskatīšana, vizuāla šuvju pārbaude zem aizmugures apgaismojuma
      qc_threshold: Atdalīšanās izturība min 8 N/cm. Metinājuma platuma tolerance ±1 mm. Jebkura redzama kanālošanās = noraidīt
      responsibility: Metināšanas kvalitātes kontrole (2 inspektori katrā maiņā)
    - stage: '04'
      title: Montāža un aprīkošana
      description: 'Laivas pārvietojas uz gala montāžu, kur tiek sapāroti visi komponenti: korpusa + caurules, uzstādīti vārsti, D-gredzeni, rokturi, spuras kastes un pārvadājamās somas stiprinājums. Katrs eksemplārs tiek pārbaudīts pēc 100 punktu montāžas kontrolsaraksta.'
      qc_check: 100 punktu kontrolsaraksta apstiprinājums katrai vienībai, vārsta funkcijas tests (10 atvēršanas/aizvēršanas cikli), aparatūras griezes momenta pārbaude, vizuālā inspekcija
      qc_threshold: 'Nulles defektu politika drošībai kritiskām detaļām (vārsti, D gredzeni, rokturi). Nelieli kosmētiski trūkumi: AQL 2,5 (ISO 2859)'
      responsibility: Montāžas komandas vadītājs + līnijas QC
    - stage: '05'
      title: Spiediena testēšana un kvalitātes turēšana
      description: Katrs nodalījums tiek uzpūsts līdz 1,25× nominālajam spiedienam (parasti 20–25 PSI) un turēts 24–48 stundas. Spiediena sensori nepārtraukti reģistrē datus. Nodalījumi, kuru spiediens samazinās vairāk nekā par 5%, tiek noraidīti un nosūtīti šuvju pārbaulei.
      qc_check: 24 stundu spiediena uzturēšanas žurnāls, sensora kalibrācija katru dienu pārbaudīta, temperatūras kompensēta spiediena nolasīšana, šuves atkārtota pārbaude pēc remonta
      qc_threshold: Maksimālais spiediena kritums 24 stundu laikā pie stabilas temperatūras – 5%. Jebkura kamera, kas pārsniedz šo robežu = 100% atkārtota visa ražošanas partijas pārbaude
      responsibility: Kvalitātes laboratorija (neatkarīga no ražošanas, ziņo vadībai)
    - stage: '06'
      title: Beigu pārbaude un iepakošana
      description: Galīgā vizuālā un funkcionālā pārbaude. Virsmas defekti, krāsas konsekvence, etiķetes/BIĻEŠU pārbaude, iepakojuma integritāte un piederumu pilnība. Ierīces tiek vakuumā iepakotas, iesaiņotas kastēs un ievietotas paletēs konteineru iekrāvēšanai.
      qc_check: Pilnīga vizuālā pārbaude, piederumu kontrolsaraksts saskaņā ar SKU, iepakojuma kritiena tests (1 m, nejaušs paraugs), etiķetes/ISBN pārbaudes skenēšana
      qc_threshold: AQL 2,5 par lieliem defektiem, AQL 4,0 par nelieliem. Drošības defektu nulles tolerance. 100% vienību vizuālā pārbaude
      responsibility: Galīgā QC komanda (4 inspektori) + Iepakošanas komandas vadītājs
