hero:
  tagline: Par mums
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer rūpnīca un darbnīca
  title: |
    Jūras inženierija,<br />
    izveidoja<span class="text-accent dark:text-white">Aquafarer</span>ceļu
  subtitle: 'Mēs sākām nelielā piekrastes darbnīcā ar vienu laivu un stingru pārliecību: jūras produktiem jābūt inženieriskiem tā, it kā tie būtu svarīgi, jo tie tiešām tādi ir. Šodien mēs piegādājam vairāk nekā 50 valstīm, bet katrs korpuss joprojām tiek pārbaudes caur tām pašām rokām, kas uzsāka uzņēmumu.'
stats:
