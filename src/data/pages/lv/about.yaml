      amount: '24'
features3_what_we_build:
  title: Ko mēs būvējam
  subtitle: Koncentrēta produktu līnija, ko mēs pazīstam pilnībā — bez nepabeigtiem ekspermentiem, bez stila🧔️ inženierijas.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB laivas
      description: Alumīnija korpusa RIBs no 3,3 m līdz 7,5 m. Paredzētas patrulēšanai, niršanai, makšķerēšanai un ģimenes lietošanai.
      icon: tabler:ship
    - title: Priekšpēdējās laivas
      description: PVC un Hypalon piepūšamie laivtiņas no 2,4 m līdz 4,2 m. Vieglas, izturīgas un viegli uzglabājamas.
      icon: tabler:speedboat
    - title: Superjahtu tenderi
      description: Kompakti, augstas specifikācijas RIBs pēc pasūtījuma izgatavoti, lai atbilstu jūsu galvenās kuģa izskatam.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Piederumi
      description: Airu sloti, sūknis, pārsegi, sausi maisi, degvielas tvertnes un elektronika. Visi saskaņoti ar mūsu laivām.
      icon: tabler:package
    - title: Pārskatīšana un remonts
      description: Iekšējā cauruļu nomaiņa, elektronikas uzstādīšana un dzinēju uzlabojumi.
      icon: tabler:tool
    - title: Pielāgotas būves
      description: Projektu dizains komerciāliem, zinātniskiem un militāriem klientiem.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Laivu dizains un inženierijas diskusija
steps2_values:
  title: Mūsu vērtības
  subtitle: Trīs principi, kas veidojuši katru produktu kopš pirmās dienas.
  items:
    - title: Būvēt kā tas nes jūsu ģimeni
      description: Katrs korpuss, metinājums un stiprinājums tiek apstrādāts tā, it kā to izmantotu mūsu pašu ģimenes.
      icon: tabler:heart
    - title: Inženieris pirms pārdošanas
      description: Ja specifikācija ir nepareiza, mēs mainām specifikāciju — nekad klients.
      icon: tabler:settings
    - title: Atbalsts, kas pārdzīvo garantiju
      description: Divdesmit gadus veci korpusi joprojām zvana pēc rezerves daļām, un mēs joprojām tās paņemam.
      icon: tabler:headset
steps2_milestones:
  title: Sasniegumi
  subtitle: Īsa Aquafarer stāsta versija.
  isReversed: true
  items:
    - title: Dibināta piekrastes darbnīcā
      description: To sāka divi kuģu arhitekti ar CNC dzirnavām un spītīgu ideju.
      icon: tabler:building-factory
    - title: Pirmie 1 000 piegādātie korpusi
      description: Sasniedzams jau septītajā gadā, galvenokārt pateicoties mutvārdu reklāmai un atkārtotiem klientiem.
      icon: tabler:circle-check
    - title: Starptautiskā eksporta programma
      description: Tagad tiek piegādāts uz 50+ valstīm ar lokalizētiem atbalsta partneriem piecos kontinentos.
      icon: tabler:world
    - title: Jauna globāla darbības struktūra
      description: 2026. gada septembrī zīmola darbība pārcēlās no Qingdao Vatrad Group uz Aquafarer LLC (Ņūmeksika, ASV); Qingdao ražošanas centrs turpina pētniecību un attīstību, ražošanu un rūpnīcas tiešo eksportu.
      icon: tabler:building-skyscraper
features2_locations:
  title: Mūsu atrašanās vietas
  tagline: Atrodi mūs
  columns: 3
  items:
    - title: Galvenā mītne un darbnīca
      description: Piekrastes rūpniecības parks, ēka 4 — atvērta no pirmdienas līdz piektdienai apmeklējumiem pēc iepriekšējas vienošanās.
    - title: ES pakalpojumu centrs
      description: Vidusjūras osta — pārbūve, remonts un garantijas atbalsts Eiropas klientiem.
    - title: APAC partneru tīkls
      description: Pilnvaroti pakalpojumu partneri Austrālijā, Japānā, Singapūrā un Honkongā.
brand_hub_tagline: Zīmols
brand_hub_title: Izpētiet mūsu zīmolu
brand_hub_subtitle: Iedziļinieties mūsu jūras inženierijas kompetencē, globālajā klātbūtnē un principos, kas mūs virza.
brand_hub_cards:
  - title: Jūras ekspertīze
    desc: Gadu desmitiem materiālzinātnes, precīzās ražošanas un reālās pasaules testēšanas — no PVCHypalon / ražošanas līdz dziļā V korpusa dizainam un drop-stitch tehnoloģijai.
    link: /brand-marine-expertise
    link_label: Uzziniet vairāk →
  - title: Globālā klātbūtne
    desc: Piegāde uz 50+ valstīm no mūsu Qingdao ražotnes ar pilnvarotajiem servisa partneriem visā Eiropā, Āzijas un Klusā okeāna reģionā un Amerikā.
    link: /brand-global-presence
    link_label: Uzziniet vairāk →
  - title: Kāpēc Aquafarer
    desc: Vertikālā integrācija, dubultā sertifikācija (ISO 9001 + BSCI), CE atbilstība un zema MOQs — izveidots zīmoliem, izplatītājiem un valsts iestādēm.
    link: /brand-why-aquafarer
    link_label: Uzziniet vairāk →
production_section:
  tagline: Ražošanas izcilība
  title: Nodrošinot izcilo meistarību
  description: Aquafarer ražošanas līnija ir veltīta augstas kvalitātes, izturīgu un augstas veiktspējas piepūšamo laivu produktu ražošanai.
  cards:
    - title: Pieredzējusi tehniskā komanda
      items:
        - Profesionālas zināšanas par PVC, Hypalon un jūras materiāliem
        - Precīza meistarība griešanā, līmēšanā un aksesuāru uzstādīšanā
        - Nepārtraukta apmācība, lai apgūtu jaunākās ražošanas tehnoloģijas
    - title: Modernas ražošanas iekārtas
      items:
        - CNC griešanas iekārtas precīzai audumu griešanai ar minimālām kļūdām
        - Augstas precizitātes karstās/aukstās līmēšanas iekārtas hermētiskiem, izturīgiem šuvumiem
        - Profesionāla hermētiskuma un stiepes testēšanas iekārta
    - title: Nobriedusi vadības sistēma
      items:
        - Standartizēti ražošanas procesi ar skaidriem kvalitātes standartiem
        - Plānas ražošanas filozofija, kas samazina atkritumus un uzlabo efektivitāti
        - Efektīva piegādes ķēdes pārvaldība ar uzticamiem piegādātāju partneriem
    - title: Stingra kvalitātes kontrole
      items:
        - sertificēta kvalitātes vadības sistēma
        - 'Vairāku posmu pārbaude: izejmateriāls, procesā, galīgā iziešana'
        - Stingra hermētiskuma un izturības testēšana pirms piegādes
global_ops_section:
  tagline: Globālā operāciju arhitektūra
  title_html: Viens zīmols,<span class="text-white/90">divi centri</span>
  description_html: Kopš 2026. gada septembra Aquafarer tiek pārvaldīts<strong class="text-white">Aquafarer LLC</strong>(Ņūmeksika, ASV) — globālais uzņēmums distribūcijas, komerciālo B2B pārdošanas, līgumu, norēķinu un pēcpārdošanas jomā. Pētniecība un attīstība, ražošana un kvalitātes kontrole paliek<strong class="text-white">Aquafarer Qingdao ražošanas centrā</strong>, kas piegādā katru pasūtījumu tieši no rūpnīcas, FOB Qingdao. Pāreja mainīja to, kas paraksta jūsu līgumu — nevis to, kas būvē jūsu laivu.
  stats:
    - value: 2,400+
      label: Apvalks piegādāts visā pasaulē
    - value: 50+
      label: Eksportētās valstis
    - value: 10+
      label: Ražošanas gadi
