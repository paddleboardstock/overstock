content_customer_types:
  tagline: Kam mēs sniedzam pakalpojumus
  title: Veidots B2B pircējiem<br />— Ne mazumtirdzniecības pircēji
  subtitle: Paddle Board Overstock ražo četriem klientu tipiem. Katram ir atšķirīgas prioritātes, un mēs nodrošinām to apmierināšanu visiem.
  items:
    - title: Zīmolu īpašnieki / Privātās preces
      description: Pielāgota produkta dizains, privātā preču zīmes grafika, atbilstības dokumentācija jūsu zīmola vārdā un speciāla inženiertehniskā atbalsta nodrošināšana no koncepcijas līdz konteineram.
      icon: tabler:palette
      cta: Pieprasījums OEM/ODM Piedāvājums
      cta_href: /request-quotation
    - title: Izplatītāji / vairumtirgotāji
      description: Teritorijas aizsardzība, konkurētspējīgas vairumtirdzniecības cenas, mārketinga atbalsta komplekti, produktu apmācības un pilnīga atbilstības dokumentācija jūsu tirgum.
      icon: tabler:world
      cta: Piesakieties dīlerim
      cta_href: /dealers-distributors
    - title: Kūrorti / nomas operatori
      description: Komerciālas klases izturība, ieteikumi par autoparka izmēru, jaukta modeļa konteineru pasūtījumi, rezerves daļu stratēģija un kūrorta zīmola aprīkojuma komplekti.
      icon: tabler:beach
      cta: Iegūstiet komerciālu paketi
      cta_href: /solutions/resorts
    - title: Glābšana / Valdība / Profesionālais
      description: Hypalon/CSM būvniecība, SOLAS atbilstības iespējas, projekta specifiska sertifikācija, konkursa dokumentācijas atbalsts un NDA-aizsargāta inženierija.
      icon: tabler:shield
      cta: Apspriediet projektu
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM Spēja
  title: Ko tu saņem<br />ar Paddle Board Overstock
  subtitle: Tieša piekļuve rūpnīcai ar pilnu inženierijas, kvalitātes un atbilstības atbalstu — nevis tirdzniecības uzņēmums.
  columns: 2
  items:
    - title: OEM/ODM Pielāgošana
      description: Pielāgots korpusa dizains, cauruļu materiāls (PVC vai Hypalon/CSM), konsoles izkārtojums, sēdvietas, zīmols, krāsas un iepakojums. No nelielām modifikācijām līdz pilnībā pielāgotai inženierijai.
      icon: tabler:adjustments
    - title: Zema, MOQātra paraugu ņemšana
      description: 'RIB: 2-5 vienības (esoša forma). SUP: 5-10 vienības uz SKU. Pielāgotas veidnes: 200+ vienības. Pirmsražošanas paraugi ar jūsu zīmolu 7-14 dienu laikā.'
      icon: tabler:rocket
    - title: Ražošanai gatava kvalitāte
      description: Katra vienība tika pārbaudīta ar spiedienu 1,25x, PSI vērtēta 24–48 stundas. 99,3% defektu brīvs rādītājs uz AQL 2,5 / ISO 2859. 100 punktu kvalitātes kontrolsaraksts katram korpusam.
      icon: tabler:certificate
    - title: Pilnīga atbilstības dokumentācija
      description: CE uz 2013/53/ES (RCD), ISO 9001:2015 (SGS), BSCI sociālo auditu, REACH atbilstību, UKCA marķēšanu. Iekļauti modeļa specifiskie DoC un būvnieka plāksnīšu dati.
      icon: tabler:file-certificate
    - title: 30–45 dienu sagatavošanās laiks
      description: Standarta ražošana 30-45 dienas FOB Qingdao. Prototipi 7-14 dienas. Steidzama ražošana pieejama. Konteineru iekraušanas plāni un ISPM-15 kastes iekļautas.
      icon: tabler:truck-delivery
    - title: Pēcpārdošana un rezerves daļas
      description: 5 gadu garantija laivām/kajakiemRIBs, 2 gadi SUP/piederumiem. Rezerves daļu piegāde ar prioritāru piegādi. Garantijas prasību apstrādes atbalsts.
      icon: tabler:lifebuoy
content_categories:
  tagline: Produktu kategorijas
  title: 5 kategorijas,<br />64 CEsertificēti modeļi
  subtitle: No 2,4 m RIB tenderiem līdz 15 pēdu SUP dēļiem — visi ražoti mūsu ISO Qingdao 9001 rūpnīcā.
  items:
    - title: RIB Laivas
      description: 2,4 m līdz 7,0 m ar alumīnija vai GRP korpusiem.PVC vai Hypalon/CSM caurulēm.CE 2013/53/ES. Patruļas, niršanas, glābšanas un komerciālās konfigurācijas.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Piepūšamās laivas
      description: 2,0m līdz 5,0m ar alumīnija grīdu, saplākšņa grīdu vai gaisa klāja opcijām. Makšķerēšanas, atpūtas un tendera modeļi.
      icon: tabler:sailboat
      link: /products
    - title: SUP Valdes
      description: 9 līdz 15 pēdas 4 collu un 6 collu garumāDrop-Stitch. Vispusīgi, tūres, jogas un makšķerēšanas modeļi. Pieejams komerciāls līmenis.
      icon: tabler:swimming
      link: /products
    - title: Kajaki
      description: 1 līdz 3 cilvēku piepūšamie kajaki. Atpūtas un tūrisma modeļi ar Drop-Stitch grīdas iespējām.
      icon: tabler:kayak
      link: /products
    - title: Drošības piederumi
      description: CE- sertificētas glābšanas vestes, metamās virves, remonta komplekti, sūkņi un navigācijas gaismas.USCG III/V tipa apstiprinātas glābšanas vestes.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Rūpnīcas jauda
  title: Auditam gatava ražošana<br />Cjindao
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12 000 m² ISO 9001 rūpnīca — īsts ražotājs, nevis tirdzniecības uzņēmums</h3>
  items:
    - title: 6 speciālas ražošanas līnijas
      description: Atsevišķa RIBpiepūšamā laiva, SUPkajaks, drošības aprīkojums un OEM/ODM līnijas. Katram ir īpaši kvalitātes kontroles kontrolpunkti un ražošanas plānošana.
    - title: 100% spiediena tests
      description: Katra piepūšamā kamera tika spiesta līdz 1,25x, PSI novērtēta un turēta 24–48 stundas. Testa rezultāti saistīti ar korpusa sērijas numuru (HIN).
    - title: Izsekojamība katram korpusam
      description: 'HIN līmeņa ražošanas ieraksti ar 21+ datu lauku katrā korpusā: materiāla partija, metinātāja ID, spiediena testa rezultāts, galīgā konfigurācija un piegādes galamērķis.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12 000 m² ISO 9001 ražotne Cjindao ar RIB ražošanas līnijām
content_compliance:
  tagline: Atbilstība un kvalitātes pierādījums
  title: Dokumentētie pierādījumi,<br />Ne tikai apgalvojumi
  subtitle: Katrs atbilstības apgalvojums ir pamatots ar modeļa specifisku dokumentāciju, kas pieejama jūsu pārbaudei.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Kvalitātes vadības sistēma, ko sertificējis TÜV Rheinland/SGS. Gada uzraudzības auditi. Dokumentēti kvalitātes kontroles procesi no ienākošajiem materiāliem līdz piegādes izlaidei.
      icon: tabler:certificate
    - title: CE uz 2013/53/ES (RCD)
      description: 64 modeļi ar modeļa specifiskām atbilstības deklarācijām. Atbilstības novērtējums atbilstoši attiecīgajiem moduļiem. HIN reģistrācijas un būvētāja plāksnes dati katram korpusam.
      icon: tabler:file-certificate
    - title: BSCI Sociālā atbilstība
      description: Gada BSCI audits, ko veic SGS. Pārbaudīta ētiska darba prakse, darba vietas drošība un vides pārvaldība visā mūsu uzņēmumā.
      icon: tabler:users
    - title: REACH & UKCA
      description: Visi PVC un līmējošie materiāli atbilst ES REACH regulējumam. UKCA marķējums pieejams Lielbritānijas tirgum. Materiālu drošības datu lapas pēc pieprasījuma.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Procesa — No īsveida līdz konteineram
  items:
    - title: 1. solis:<span class="font-medium">Prasības</span>
      description: Dalieties ar saviem produkta specifikācijām, mērķa tirgu, daudzumu un atbilstības prasībām. Mūsu inženiertehniskā komanda tos pārskata 48 stundu laikā.
      icon: tabler:file-text
    - title: 2. solis:<span class="font-medium">Priekšlikums</span>
      description: Saņemiet detalizētu priekšlikumu ar specifikācijām, materiālu izvēli, MOQ, cenu, izpildes laiku un atbilstības jomu jūsu tirgum.
      icon: tabler:clipboard-list
    - title: 3. solis:<span class="font-medium">Prototips</span>
      description: Pirmsražošanas paraugs ar jūsu zīmolu 7-14 dienu laikā. Pilna kvalitātes pārbaude pie 1,25 reizes nominālā spiediena. Parauga izmaksa tiek ieskaitīta ražošanā.
      icon: tabler:settings
    - title: 4. solis:<span class="font-medium">Ražošana</span>
      description: 30-45 dienu ražošana FOB Cingdao pēc parauga apstiprināšanas. Procesa kvalitātes kontroles kontrolpunkti, spiediena testi un 100 punktu galīgā pārbaude katrai vienībai.
      icon: tabler:building-factory
    - title: 5. solis:<span class="font-medium">Piegāde</span>
      description: Konteineru iekraušanas plāns, ISPM-15 koka iepakošana, atbilstības dokumentācijas pakete un FOB Qingdao sūtījums ar pilnu eksporta dokumentāciju.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock OEM/ODM piepūšamo laivu ražošanas process no dizaina līdz konteineru nosūtīšanai
blog_latest:
  title: Nozaru un tehniskie ieskati
  information: |
    RCD atbilstības ceļveži, OEM/ODM procesa raksti, materiālu salīdzinājumi,
    un rūpnīcu inspekcijas resursus no Paddle Board Overstock inženieru komandas.
faqs:
  title: B2B Iepirkumu biežāk uzdotie jautājumi
  subtitle: Bieži uzdotie jautājumi no zīmoliem, izplatītājiem un komerciālajiem operatoriem par OEM/ODM ražošanu ar Paddle Board Overstock.
  columns: 2
  items:
    - title: Vai jūs esat ražotājs vai tirdzniecības uzņēmums?
      description: Mēs esam vertikāli integrēta rūpnīca ar pilnīgu kontroli pār kvalitāti, materiāliem un izpildes termiņiem. Uzņēmējdarbības licence un ražošanas apjoms ir pārbaudāmi rūpnīcas audita laikā.
      icon: tabler:building-factory
      category: all
    - title: Kāds ir jūsu OEM/ODM process?
      description: Prasību pārskats (48 stundas) līdz priekšlikumam prototipam (7-14 dienas) līdz ražošanai (30-45 dienas FOB Qingdao). Pilns inženiertehniskais atbalsts, atbilstības dokumentācija un izsekojamība pa katru korpusu visā procesā.
      icon: tabler:route
      category: all
    - title: Kādi ir jūsu MOQ prasības?
      description: 'RIB Laivas: 2-5 vienības uz modeli (esoša veidne), 200+ pielāgotām veidnēm.SUP Dēļi: 5-10 vienības uz SKUvienību. Pieejami jaukta modeļa konteineru pasūtījumi. Paraugu pasūtījumi 2-5 vienībām novērtēšanai.'
      icon: tabler:sort-ascending
      category: all
    - title: Kādas pielāgošanas iespējas ir pieejamas?
      description: Korpusa dizains, cauruļu materiāls (PVC vai Hypalon/CSM), cauruļu diametrs, konsoles izkārtojums, sēdvietas, stūrēšana, degvielas sistēma, klāja izkārtojums, zīmola krāsas, logotipa grafika, EVA platformas dizains, mazumtirdzniecības iepakojums un lietotāja rokasgrāmatas zīmols.
      icon: tabler:adjustments
      category: all
    - title: Kādus atbilstības dokumentus jūs varat nodrošināt manam tirgum?
      description: CE DoC saskaņā ar 2013/53/ES, UKCA marķēšana, ISO 9001 sertifikāts (SGS), BSCI audita ziņojums, REACH atbilstība, materiālu testēšanas ziņojumi, spiediena testu žurnāli un modeļa specifiski ražotāja plākšņu dati. Tirgus specifiska dokumentācija pēc pieprasījuma.
      icon: tabler:file-certificate
      category: all
    - title: Kāds ir paraugu ņemšanas un ražošanas izpildes laiks?
      description: 'Pirmsražošanas paraugi: 7-14 darba dienas. Standarta ražošana: 30-45 dienas FOB Qingdao. Steidzamā ražošana pieejama par papildu izmaksām. Maksimālā sezona (marts-jūnijs) var pagarināt izpildes termiņus.'
      icon: tabler:clock
      category: all
    - title: Vai es varu noorganizēt rūpnīcas auditu vai tiešraides video tūri?
      description: Jā. Rūpnīcas auditi uz vietas mūsu Cjindao rūpnīcā tiek gaidīti ar 3–5 dienu brīdinājumu. Tiešraides video ekskursijas WhatsApp/Zoom platformā pieejamas nekavējoties. Trešo pušu inspekcijas (SGS, BV, TÜV) ir pielāgotas.
      icon: tabler:video
      category: all
    - title: Kādas kvalitātes pārbaudes tiek veiktas pirms nosūtīšanas?
      description: 1,25x nominālais spiediena turēšanas tests (24-48h), šuves pīlinga tests, 100 punktu galīgā pārbaudes kontrolsaraksts, izmēru pārbaude, kosmētiskā pārbaude, atbilstības dokumentācijas pārbaude un iepakojuma integritātes pārbaude. Visas saskaņā ar ISO 9001 procedūrām.
      icon: tabler:clipboard-check
      category: all
