features:
  id: features
  tagline: Kāpēc pirkt no Paddle Board Overstock
  title: Real Factory,<br />Reālie ietaupījumi
  subtitle: Rūpnīcas tiešie pārpalikumi un izpārdošanas SUP paketes — sertificēta kvalitāte bez mazumtirdzniecības uzcenojuma.
  columns: 2
  items:
    - title: Līdz pat 60% atlaide mazumtirdzniecībai
      description: Mēs pārdodam rūpnīcas pārpalikumu un izpārdošanas partijas tieši — bez starpniekiem, bez mazumtirdzniecības uzcenojuma. Tās pašas plates, kas citur tiek pārdotas par pilnu cenu, šeit par izpārdošanas cenām.
      icon: tabler:rocket
    - title: Pilni komplekti
      description: 'Katrs SUP komplekts ir pilns komplekts: dēlis, ceļojumu mugursoma, rokas sūknis, regulējama lāpstiņa, noņemama spura, spoles pavada un remonta komplekts.'
      icon: tabler:clipboard-list
    - title: Sertificēta kvalitāte
      description: 13 CEsertificēti SUP modeļi saskaņā ar piemērojamām ES direktīvām. Katra plate tiek 100% spiediena testēta ar 1,25x nominālo vērtējumu PSI pirms piegādes. 99,3% defektu brīva likme uz AQL 2,5.
      icon: tabler:certificate
    - title: Nē MOQ — Order One Board
      description: Pārpalikuma izpārdošana nozīmē, ka vienas vienības pasūtījumi ir laipni gaidīti. Pievieno dēli grozam, norēķināšanās, gatavs. Nav minimālā pasūtījuma, nav piedāvājuma procesa.
      icon: tabler:adjustments
    - title: Ātra piegāde visā pasaulē
      description: Noliktavā esošie pasūtījumi no Weihai tiek nosūtīti 2-3 darba dienu laikā. Izsekoja piegādi 50+ valstīm ES, Ziemeļamerikā, Āzijas un Klusā okeāna reģionā un citur.
      icon: tabler:truck-delivery
    - title: 2 gadu SUP garantija
      description: Katrs SUP dēlis un aksesuārs tiek segts 2 gadus — drop-stitch šuves, uzpūšanas vārsti un piederumi iekļauti. Prasības tiek atrisinātas dienās, nevis nedēļās.
      icon: tabler:lifebuoy
