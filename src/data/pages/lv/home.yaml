    - title: Bērni SUPs
      description: Vieglāki, īsāki dēļi, piemēroti bērniem — tāda pati drop-stitch kvalitāte bērniem draudzīgā iepakojumā.
      icon: tabler:lifebuoy
      link: /products
    - title: Piederumi
      description: Sūkņi, airi, glābšanas vestes, pavadas, remonta komplekti un rezerves daļas katram dēlim, ko pārdodam.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Rūpnīcas jauda
  title: Kāpēc mūsu izpārdošanas cenas<br />Ir īsti
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Īsta rūpnīca, īsti ietaupījumi — katrs dēlis tiek piegādāts no mūsu Weihai rūpnīcas</h3>
  items:
    - title: Tās pašas ražošanas līnijas kā lielajiem zīmoliem
      description: Mūsu 12 000 m² Weihai rūpnīca ražo plates starptautiskiem zīmoliem un mūsu pašu pārpalikumu partijām uz tām pašām līnijām un tiem pašiem materiāliem.
    - title: 100% spiediena tests
      description: Katrs dēlis tiek spiedināts ar 1,25x nominālo jaudu PSI un tiek turēts pirms nosūtīšanas. 99,3% bez defektiem rādītājs uz AQL 2,5 / ISO 2859.
    - title: Nav starpnieku
      description: Plāksnes tiek piegādātas tieši no rūpnīcas līdz jūsu durvīm. Nav izplatītāja uzcenojuma, nav mazumtirdzniecības uzcenojuma — tā izpārdošanas cenas paliek līdz pat 60% zemākas par mazumtirdzniecību.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12 000 m² Weihai rūpnīca ar piepūšamām SUP ražošanas līnijām
content_compliance:
  tagline: Atbilstība un kvalitātes pierādījums
  title: Sertificēta kvalitāte,<br />Dokumentēts
  subtitle: Katrs atbilstības apgalvojums ir pamatots ar sertifikātiem un modeļa specifiskiem dokumentiem, kas pieejami jūsu pārbaudei.
  items:
    - title: ISO 9001:2015
      description: Kvalitātes vadības sistēma, ko sertificējis TÜV Rheinland/SGS. Gada uzraudzības auditi. Dokumentēti kvalitātes kontroles procesi no ienākošajiem materiāliem līdz piegādes izlaidei.
      icon: tabler:certificate
    - title: CE Sertificēts
      description: 13 CE sertificēti SUP modeļi saskaņā ar piemērojamajām ES direktīvām, katram ar modeļa specifisku atbilstības deklarāciju un ražotāja plāksnes datiem.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Visi PVC un līmējošie materiāli atbilst ES REACH noteikumiem.UKCA marķējums pieejams Apvienotās Karalistes tirgum. Materiālu drošības datu lapas pēc pieprasījuma.
      icon: tabler:shield-check
    - title: 2 gadu SUP garantija
      description: Katrs SUP dēlis un aksesuārs tika segts 2 gadus — ar drop-stitch šuvēm, piepūšamajiem vārstiem un piederumiem. Prasības tika atrisinātas ātri.
      icon: tabler:lifebuoy
steps:
  title: No kases līdz ūdenim — Kā tiek nosūtīts jūsu pasūtījums
  items:
    - title: 1. solis:<span class="font-medium">Izvēlies savu dēli</span>
      description: Izvēlieties no universāliem, tūristu, jogas un bērnu modeļiem. Mūsu iepirkumu ceļveži palīdzēs jums pielāgot dēļa izmēru un stilu jūsu airēšanai.
      icon: tabler:clipboard-list
    - title: 2. solis:<span class="font-medium">Droša norēķināšanās</span>
      description: Maksājiet droši ar Stripe vai PayPal. Visas galvenās kredītkartes un debetkartes ir atļautas. Konts nav nepieciešams — pasūtījuma apstiprinājums nonāk jūsu e-pastā.
      icon: tabler:file-text
    - title: 3. solis:<span class="font-medium">Kvalitātes pārbaude</span>
      description: Katrs dēlis tiek 100% spiediena testēts ar 1,25x nominālo PSI jaudu un pārbaudīts pēc pilnas kvalitātes pārbaudes saraksta pirms iepakošanas.
      icon: tabler:settings
    - title: 4. solis:<span class="font-medium">Fast Dispatch</span>
      description: Noliktavā esošie pasūtījumi no mūsu Weihai rūpnīcas tiek nosūtīti 2-3 darba dienu laikā. Steidzamiem pasūtījumiem ir pieejama steidzama apstrāde.
      icon: tabler:building-factory
    - title: 5. solis:<span class="font-medium">Izsekošanas piegāde</span>
      description: Izsekota piegāde visā pasaulē uz 50+ valstīm. Jūsu 2 gadu garantija un atsaucīgais pēcpārdošanas atbalsts sākas brīdī, kad jūsu plate ierodas.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Pasūtījuma process no drošas norēķināšanās līdz izsekošanai visā pasaulē
blog_latest:
  title: SUP Ceļveži un tehniskie ieskati
  information: |
    Ceļvežu iegāde, airēšanas tehnika, drošības pamatlietas un būvniecība
    komandas pētījumu Paddle Board Overstock .
faqs:
  title: SUP Pasūtīšanas un produktu biežāk uzdotie jautājumi
  subtitle: Biežāk uzdotie jautājumi par mūsu izpārdošanas SUP dēļiem, pasūtīšanu, apmaksu, piegādi un garantiju.
  columns: 2
  items:
    - title: Vai SUP ir grūti iemācīties?
      description: Nemaz ne. Lielākā daļa iesācēju pieceļas un airē jau pirmajā nodarbībā. Mūsu universālie SUP dēļi ir aprīkoti ar īpaši platām, stabilām platformām, kas īpaši izstrādātas pirmreizējiem airētājiem. Sāciet uz mierīga ūdens, un jūs jau pēc dažām minūtēm varēsiet braukt.
      icon: tabler:swimming
      category: sup
    - title: Kāds ir svara ierobežojums?
      description: Mūsu universālais atbalsts līdz SUPs 220 mārciņām, bet tūrisma un jogas platformas atbalsta līdz 250 mārciņām. Katra produkta lapa norāda precīzu braucēja svara kapacitāti, lai varētu pielāgot dēli savām vajadzībām.
      icon: tabler:adjustments
      category: sup
    - title: Vai es varu ceļot ar piepūšamo SUP?
      description: Pilnīgi noteikti. Katrs Paddle Board Overstock dēlis tiek iepakots mugursomas izmēra somā. Ar tikai 18–22 mārciņām to ir viegli nest līdz pludmalei, ezeram vai caur lidostas termināliem. Pirms ceļojuma pārbaudiet savu aviokompānijas bagāžas politiku.
      icon: tabler:truck-delivery
      category: sup
    - title: Kas nāk kastē?
      description: Katrs Paddle Board Overstock SUP komplekts ietver dēli, ceļojumu mugursomu, rokas sūkni, regulējamu lāpstiņu, noņemamu spuru, spoles pavadu un remonta komplektu.
      icon: tabler:clipboard-list
      category: sup
    - title: Kāpēc jūsu cenas ir zemākas nekā mazumtirdzniecībā?
      description: Mēs pārdodam rūpnīcas pārpalikumus un izpārdošanas partijas tieši no mūsu pašu ražošanas uzņēmuma Veihajā, Ķīnā — bez starpniekiem, bez mazumtirdzniecības uzcenojuma. Tas nozīmē pilnīgas SUP pakas ar līdz pat 60% atlaidi parastajām mazumtirdzniecības cenām, saglabājot to pašu CE sertificēto kvalitāti.
      icon: tabler:certificate
      category: orders
    - title: Kā es varu veikt pasūtījumu un samaksāt?
      description: Pievienojiet savu SUP paketi grozam un droši noformējiet pasūtījumu, izmantojot Stripe vai PayPal. Mēs pieņemam visas galvenās kredītkartes un debetkartes. Katrs pasūtījums tiek apstiprināts pa e-pastu ar pilnu rēķinu.
      icon: tabler:file-text
      category: orders
    - title: Vai jūs piegādājat visā pasaulē?
      description: Jā. Mēs piegādājam uz 50+ valstīm visā ES, Ziemeļamerikā, Āzijas un Klusā okeāna reģionā, Tuvajos Austrumos un Āfrikā. Pasūtījumi, kas ir noliktavā, parasti tiek nosūtīti 2-3 darba dienu laikā, un katram sūtījumam tiek nodrošināta sūtījuma izsekošana.
      icon: tabler:route
      category: orders
    - title: Kādu garantiju ietver SUP plates?
      description: 'Katrs SUP dēlis un piederums ir segts ar 2 gadu garantiju — ieskaitot pašu dēli, drop-stitch šuves un piepūšanas vārstus. Prasības tiek atrisinātas dienās, ne nedēļās: iesniedziet tās tiešsaistē, un mēs labo vai nomainām.'
      icon: tabler:lifebuoy
      category: orders
