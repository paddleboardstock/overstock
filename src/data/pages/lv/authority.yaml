hero:
  tagline: Autoritātes centrs
  title: Kāpēc Aquafarer?<br />Uzticība, kas veidojusies gadu desmitiem
  subtitle: Katrs laiva, ko mēs būvējam, nes sev līdzi 10+ gadu jūras inženierijas, sertificētu kvalitātes sistēmu un tūkstošiem veiksmīgu operāciju visā pasaulē pieredzi. Tāpēc nozares profesionāļi izvēlas Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer jūras ražošanas līnija un inženieru komanda
stats:
