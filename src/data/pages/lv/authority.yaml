features3_brand:
  tagline: Kas mēs esam
  title: Zīmola pamats<br />un mantojums
  subtitle: Stāsts, ekspertīze un globālais sasniedzamības tīkls, kas definē Aquafarer kā uzticamu jūras aprīkojuma ražotāju.
  isBeforeContent: false
  columns: 3
  items:
    - title: Par Aquafarer
      description: Dibināts 2012. gadā Ķīnas Kuindao. No piekrastes darbnīcas līdz 12 000 m² lielam objektam — pilnīgs stāsts par Aquafarer.
      icon: tabler:building-factory
      link: /about
    - title: Zīmola stāsts
      description: Kā komanda jūras inženieru devās, lai profesionāla kategorijas piepūšamie kuģi kļūtu pieejami visā pasaulē.
      icon: tabler:book
      link: /brand-story
    - title: Jūras nozares pieredze
      description: Padziļināta materiālu zinātne, precīza ražošana un reālās pasaules testi — desmitiem gadu jūras inženierijas katrā korpusā.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globālā klātbūtne
      description: Apkalpojam 50+ valstis katrā kontinentā. Reģionālā ekspertīze vietējiem regulatoru prasībām un tirgus vēlmēm.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Kāpēc Aquafarer
      description: Tas, kas mūs atšķir — kvalitāte, pielāgošana, tiešās rūpnīcas cenas un visaptveroša atbalsta nodrošināšana komerciālajiem operatoriem.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Mūsu komanda
      description: Iepazīstieties ar vadību — jūras inženieri, materiālu zinātnieki un ražošanas eksperti, kas virza Aquafarer uz priekšu.
      icon: tabler:users
      link: /brand/team
    - title: Inženieru komanda
      description: 78+ apvienotie pētniecības un attīstības gadi, 40+ platformas, 12 sertifikāti, 1200+ OEM projekti. Tehniskā komanda aiz katra produkta.
      icon: tabler:engine
      link: /engineering-team
    - title: R&D centrs
      description: Korpusa inženierija, RF metināšana, PVC laboratorija, prototipēšana, testa tvertne un kvalitātes laboratorija — mūsu pilnīga pētniecības un attīstības infrastruktūra.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Uzticība un kvalitāte
  title: Sertifikāti, kvalitāte<br />& pierādījumi
  subtitle: Neatkarīgi sertifikāti, stingras pārbaudes un reāli pierādījumi, kas apliecina mūsu apņēmību nodrošināt kvalitāti.
  isBeforeContent: false
  columns: 3
  items:
    - title: Sertifikāti
      description: CE, ISO 9001, UKCA, BSCI, REACH — pilna sertifikācijas dokumentācija un atbilstība globālajiem tirgiem.
      icon: tabler:shield-check
      link: /certifications
    - title: Kvalitāte un pārbaude
      description: Katrs produkts pirms nosūtīšanas tiek pārbaudīts spiedienam. Šuvju izturība, UV pretestība, peldspēja — apliecināta katrā posmā.
      icon: tabler:clipboard-check
      link: /quality
    - title: Pierādījumi & apliecinājumi
      description: Testu rezultāti, izvietošanas fotogrāfijas, trešās puses inspekcijas ziņojumi un gadījumu izpētes, kas apliecina Aquafarer kvalitāti.
      icon: tabler:file-check
      link: /evidence
    - title: Zināšanu grafiks
      description: Izpētiet Aquafarer entītiju grafiku — produkti, tehnoloģijas, sertifikāti un attiecības savienotā zināšanu bāzē.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Vadība
  title: Iepazīstieties ar komandu<br />Aiz Aquafarer
  subtitle: Nozares pieredze, kas aptver jūras inženieriju, materiālu zinātni, kvalitātes vadību un globālo B2B tirdzniecību.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — dibinātājs un izpilddirektors
      description: 15+ gadi jūras ražošanā. Iepriekš vadīja pētniecību un attīstību lielā ķīniešu laivu ražotājā. Vairāki patenti piepūšamo laivu dizainā.
      icon: tabler:crown
    - title: Zhang Wei — galvenais inženieris
      description: 20+ gadi PVC/Hypalon ražošanā un dziļās V formas korpusa dizainā. Bijušais tehniskais direktors Eiropas jūras inženierijas firmā.
      icon: tabler:engine
    - title: Chen Ming — pētniecības un attīstības vadītājs
      description: Materiālzinātnes doktors. Specializējas drop-stitch tehnoloģijā un augstfrekvences metināšanā. 10+ gadi tekstila kompozītā materiālos.
      icon: tabler:flask
    - title: Liu Qiang — ražošanas direktors
      description: 18+ gadi lean ražošanā. Six Sigma Melna josta. Ieviesti ISO 9001 kvalitātes sistēmas visās ražošanas līnijās.
      icon: tabler:settings
    - title: Wang Fang — kvalitātes vadītājs
      description: 12+ gadi jūras kvalitātes kontrolē. Sertificēts CE un ISO auditors. Uzrauga testēšanu katrā ražošanas partijā.
      icon: tabler:shield-check
    - title: Helen Lee — pārdošanas direktore
      description: 15+ gadi starptautiskajā B2B tirdzniecībā. Pārvaldīja OEM/ODM partnerattiecības 30+ valstīs. Brīvi runā 4 valodās.
      icon: tabler:briefcase
cta:
  title: Vai vēlaties pārbaudīt mūsu kvalifikāciju?
  subtitle: Sazinieties ar mums, lai saņemtu sertifikātu kopijas, trešo personu inspekcijas ziņojumus vai lai ieplānotu rūpnīcas apmeklējumu.
  actions:
    - variant: primary
      text: Pieprasīt akreditācijas datus
      href: /contact
    - text: Skatīt sertifikācijas detaļas
      href: /certifications
