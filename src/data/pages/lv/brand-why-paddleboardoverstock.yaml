features3_reasons:
  tagline: Kāpēc izvēlēties Paddle Board Overstock
  title: Septiņi iemesli sadarboties ar mums
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Reāla ražošana, nevis tirdzniecība
      description: Mums pieder un mēs vadām 12 000 m² lielu rūpnīcu. Kad jūs sadarbojaties ar Paddle Board Overstock, jūs strādājat tieši ar cilvēkiem, kuri projektē, inženierē un ražo jūsu produktus — bez starpniekiem.
      icon: tabler:building-factory
    - title: 2. Inženiertehniska pieeja
      description: Mūsu dizaina process sākas ar lietošanas gadījumu, nevis ar produkta kategoriju. Mēs optimizējam korpusa formu, materiālu izvēli un konfigurāciju atbilstoši tam, kā laivu faktiski izmantos.
      icon: tabler:engine
    - title: 3. Sertificēta kvalitāte
      description: CE sertificēts, ISO kvalitātes sistēma, BSCI atbilstošs, REACH atbilstošs, USCG apstiprināts. Mūsu 64 CE sertificētie modeļi atbilst starptautiskajiem standartiem — ne tikai apgalvojumiem.
      icon: tabler:certificate
    - title: 4. Elastīgs OEM/ODM
      description: Cauruļu krāsas, konsoles izkārtojums, zīmola identitāte, iepakojums — mēs pielāgojam jūsu specifikācijām. Nav minimālā pasūtījuma spiediena. Sāciet ar prototipu, attīstiet ar pārliecību.
      icon: tabler:adjustments
    - title: 5. Globālā loģistika
      description: ASV noliktava Kalifornijā, tiešā piegāde no Qingdao, gaisa krava steidzamiem pasūtījumiem. Mēs nodrošinām muitas dokumentāciju un papīru kārtošanu.
      icon: tabler:truck-delivery
    - title: 6. Mūža atbalsts
      description: Mēs atbalstām laivas, kuras esam uzbūvējuši pirms 20 gadiem. Oriģinālās rezerves daļas, tehniskie padomi, remonta norādījumi — mūsu komanda ir pieejama, kad jums tas nepieciešams.
      icon: tabler:lifebuoy
    - title: 7. Godīgas specifikācijas
      description: Reālie slodzes rādītāji, reālie izmēri, reālais svars. Bez mārketinga pārspīlējumiem. Tas, ko mēs publicējam, ir tas, ko jūs saņemat — pārbaudīts ar neatkarīgu testēšanu.
      icon: tabler:ruler-measure
testimonials:
  tagline: Pasaules zīmolu uzticība
  title: Ko mūsu partneri saka
  items:
    - content: Mēs esam strādājuši ar vairākām ražotnēm Ķīnā, bet Paddle Board Overstock izceļas ar savu inženiertehnisko atbalstu un konsekventu kvalitāti. Viņi izturas pret mūsu zīmolu kā pret savu.
      name: — OEM Partneris, Eiropas ūdenssporta zīmols
    - content: Viņu Hypalon RIBs mūsu flotē ir bijuši vairāk nekā 5 gadus. Minimāla apkope, izcila UV izturība. Piecu gadu garantija uz caurulēm dod mums pārliecību.
      name: — Flotes operators, Tuvāko Austrumu kūrortu grupa
    - content: Paddle Board Overstock komanda palīdzēja mums izstrādāt pielāgotu SUP dēļa dizainu no koncepcijas līdz ražošanai 90 dienu laikā. Kvalitāte pārsniedza mūsu cerības.
      name: — Izplatītājs, Austrālijas ūdenssporta joma
