testimonial:
  quote: Aquafarer Kas izceļas, ir viņu materiālzinātne. Viņi ne tikai montē komponentus — viņi paši izstrādā PVC savienojumus, metinājuma parametrus un konstrukciju izvietojumu. Šī vertikālā integrācija ir redzama gala produktā.
  author: Deivids Parks
  title: Produktu izstrādes vadītājs
  company: Bluewater sporta inventārs
  location: Austrālija
sections:
  - title: Drop-Stitch Kodols
    standard: 12-15 PSI darba spiediens
    description: Tūkstošiem iekšējo poliestera vītņu savieno augšējos un apakšējos slāņus, veidojot stingru struktūru pie 12-15PSI. Šī ir tā pati tehnoloģija, ko izmanto profesionālos airēšanas dēļos un piepūšamajās sacīkšu laivās. Mūsu drop-stitch blīvums ir optimizēts katram modelim, lai panāktu ideālu stingrības un svara līdzsvaru.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: DS kodola diagramma
  - title: Jūras Klases PVC
    standard: Sintēzes metināts |UV / sālsūdens / nodiluma tests
    description: Daudzslāņu laminēts PVC audums, kas paredzēts jūras videi. Katrs slānis ir saplūstoši metināts, nevis līmēts, novēršot delaminācijas riskus. Testēts UV izturībai (ASTM G154, 1 000+ stundas), sālsūdens korozijai (ISO9227) un nodilumam (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC Slānis
  - title: Hypalon Lampas
    standard: CSM gumija |UV / ķīmisks / ekstrēmas temperatūras izturīgs
    description: RIB Modeļiem Hypalon izmantotā CSMgumija nodrošina augstāku UV un ķīmisku izturību salīdzinājumā ar standarta PVC.Hypalon Caurules saglabā elastību ekstremālās temperatūrās un iztur bojāšanos degvielas un eļļas iedarbības dēļ. Visas šuves roku darbs veic sertificēti tehniķi.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Gaisa klāja grīda
    standard: Augstspiediena piepūšamais | Aizstāj saplāksni/alumīniju
    description: Augstspiediena piepūšamā grīdas sistēma, kas aizstāj tradicionālās saplāksņa vai alumīnija dēļiņgrīdas. Samazina uzstādīšanas laiku, kopējo svaru un uzglabāšanas tilpumu, nodrošinot pietiekamu stingrību, lai stāvētu, makšķerētu un staigātu. Testēts, lai izturētu 200 kg sadalītu slodzi.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Gaisa grīda
