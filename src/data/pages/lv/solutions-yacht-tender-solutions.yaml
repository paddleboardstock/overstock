content_challenge:
  tagline: Izaicinājums
  title: Jahtu tenderi prasa<br />Veiktspēju un izskatu
  subtitle: Jahtu tenderis nav vienkārši neliela laiva — tas ir mātes kuģa pagarinājums un kvalitātes apliecinājums.
  paragraphs:
    - Jahtu īpašniekiem un kapteiņiem ir nepieciešami tenderi, kuri labi veiktspējīgi, uzturas kompaktā vietā un izskatās eleganti. Tenderim vajadzētu papildināt jahtas estētiku, nodrošinot uzticamu transportu viesiem un apkalpei.
    - '**Glabāšana ir kritiska** — Tenderim jāiekļaujas uz klāja, garāžā vai uz davitiem. Svars ir svarīgs palaišanas un pacelšanas sistēmām. Paddle Board Overstock RIBs piedāvā izcilu jaudas un svara attiecību ar kompaktu uzglabāšanas profilu.'
    - '**Veiktspējas prasības ir augstas** — Viesi sagaida gludu, sausu braucienu, pārvietojoties uz krastu. Dzinēja izvēlei jānodrošina līdzsvars starp ātrumu, nobraukumu un trokšņa līmeni, lai nodrošinātu premium pieredzi. Čartera darbībai tenderis darbojas ikdienā un tam jāiztur bieža lietošana.'
    - '**Izskats ir svarīgs** — Tenderis, kas neatbilst vai ir nolietojies, mazinās kopējo jahtas prezentāciju. Pielāgotas caurulīšu krāsas, apdare un zīmols nodrošina, ka tenderis izskatās kā piederīgs kuģim.'
content_solution:
  tagline: Mūsu risinājums
  title: Tenderu konfigurācijas<br />Katram jahtas pielietojumam
  subtitle: Paddle Board Overstock RIB tenderi var tikt pielāgoti, lai atbilstu jūsu kuģim, darbības tipam un glabāšanas prasībām — no superjahtu ražotāja specifikācijām līdz čartera flotes programmām.
  list:
    - Pielāgotas caurulīšu krāsas, lai atbilstu vai papildinātu mātes kuģi — jebkura RAL krāsa pieejama Hypalon vai PVC caurulītēm
    - Pielāgota apdare un šūšana — premium jūras klases vinils ar krāsas saskaņošanu un logotipa izšuvumu
    - Konsoles vai stūres stienis — izvēlieties atkarībā no lietošanas modeļa un operatora vēlmēm
    - Fiberglasa deep-V korpuss gludam, sausu braucienam dažādos jūras apstākļos
    - Kompakta uzglabāšana — izplūdušas vai ligzdas terases garāžas, skapīša vai dāvita glabāšanai
    - Hypalon Caurules UV izturībai un ilgtermiņa izskata saglabāšanai
    - Pacelšanas punkti un vilkšanas gredzeni ir standarta aprīkojumā visos modeļos
    - Papildus loka pārsegs, pilns segums un aizsargājoši berzes aizsargi
    - 'Dzinēja diapazons: 15 HP līdz 60 HP — ārējās vai stūres konfigurācijas'
    - OEM/privātā marķēšana pieejama jahtu būvētājiem un jūras tirgotājiem
content_segments:
  tagline: Klientu profili
  title: Jahtu tendervieglās risinājumi<br />Pēc klienta tipa
  subtitle: Dažādiem jahtu nozares segmentiem ir unikālas prasības.Paddle Board Overstock Konfigurē tenderus, lai tie atbilstu katrai lietojumprogrammai.
  items:
    - title: Superjahtu būvētāji
      subtitle: OEM Tendera integrācija — pielāgoti izmēri, krāsas un materiāli
      description: 'Jahtu būvētāji saskaras ar atkārtotu izaicinājumu: katram jaunam kuģim ir unikāli izmēru, svara ierobežojumi un estētiskās gaidas. Tenderim jāintegrējas perfekti ar mātes kuģa dāvita sistēmu, jāiekļaujas precīzos garāžas izmēros un jāatbilst vairāku miljonu eiro jahtas dizaina valodai. Jebkura neatbilstība — nepareiza caurules krāsa, nepareizs pacelšanas punkta novietojums, nesaderīgs svars — aizkavē piegādi un slikti ietekmē būvētāju.Paddle Board Overstock Tieši sadarbojas ar būvētāju iepirkumu un dizaina komandām, lai piegādātu piedāvājumus ar pielāgotām RAL cauruļu krāsām, saskaņotu apdari, zīmola konsoles paneļiem un pilnu OEM dokumentācijas komplektu.'
      features:
        - Pielāgotas izmēru specifikācijas, kas atbilst garāžas un dāvinājuma ierobežojumiem
        - Jebkura RAL caurules krāsa un atbilstoša apdare — dizaina apstiprinājuma paraugi
        - OEM Zīmols uz konsolēm, kamerām un sēdekļu atzveltnēm
        - Pacelšanas punkta un dāvita piemērotības validācija katram modelim
        - Korpusa svars optimizēts noteiktām palaišanas un atgūšanas sistēmām
        - Lielapjoma piegādes grafiks saskaņots ar ražošanas termiņiem
    - title: Jahtu pārvaldības uzņēmumi
      subtitle: Flotes standartizētie iepirkumi — globāls atbalsts, minimāls dīkstāves laiks
      description: Vadības uzņēmumi pārrauga vairākas jahtas, kas darbojas Vidusjūrā, Karību jūrā, Dienvidu Klusajā okeānā un tālāk. Viņu galvenā vajadzība ir uzticamība — salauzts tenderis attālā ostā nozīmē apkalpes virsstundas, viesu sūdzības un dārgas pēdējā brīža nomaiņas. Standartizētas flotes specifikācijas samazina apkalpes apmācības laiku visos kuģos un vienkāršo rezerves daļu pārvaldību.Paddle Board Overstock Piedāvā daudzkuģu flotes cenas, konsekventas specifikācijas visos pasūtījumos un globālu rezerves daļu atbalstu pārvaldības uzņēmumiem ar kuģiem vairākos reģionos.
      features:
        - Standartizētas specifikācijas visā pārvaldītajā autoparkā
        - Maināmas rezerves daļas visos flotes apkalpes kuģos
        - Autoparka cenas un apjoma atlaides vairāku vienību pasūtījumiem
        - Globāla rezerves daļu pieejamība — ātra piegāde uz jebkuru ostu
        - Konsekventa apkalpes apkalpošanas un apkopes dokumentācija
        - Daudzvienību piegādes koordinācija dažādām kuģu atrašanās vietām
    - title: Jahtu nomas operatori
      subtitle: Augstas frekvences ikdienas darbības — izturība, nekaitējot izskatam
      description: 'Čartera tenderi saskaras ar visintensīvāko darbības grafiku jahtu nozarē: ikdienas viesu pārvadājumi, krasta braucieni, ūdens sporta atbalsts un ostas apkalpošana — bieži vien 200+ operācijas čartera sezonā. Tenderim jāizskatās nevainojami pēc katras viesu nodošanas, izturot nepārtrauktu iekāpšanu, sālsūdens iedarbību un dzinēja stundas. Izskata pasliktināšanās ir tieša biznesa problēma — nolietots tenders ietekmē viesu atsauksmes un čartera cenas.Paddle Board Overstock Čartera tenderi tiek konfigurēti ar uzlabotu apdari, smagām Hypalon kamerām un pastiprinātām apstrādes zonām ilgtermiņa izturībai, saglabājot prezentācijas kvalitāti.'
      features:
        - Smagās Hypalon kravas caurules — 5–8 gadu kalpošanas laiks ikdienas čartera reisos
        - Pastiprinātas kāpšanas kāpnes un roktura troses biežai lietošanai
        - Premium traipiem izturīga vinila apdare — viegla tīrīšana starp čarteriem
        - Viegli tīrāmas neslīdošas terases virsmas
        - Uzticami ārējie komplekti ar ērtu piekļuvi servisam ātrai apkalpošanai
        - Kosmētiskas kvalitātes materiāli, kas saglabā izskatu visā čartera sezonā
    - title: Jahtu tirgotāji un brokeri
      subtitle: Uzticama tendera piegāde kuģa pabeigšanai un tālākpārdošanas vērtībai
      description: Dīleriem un brokeriem ir nepieciešams stabils kvalitatīvu tenderu piedāvājums, kas papildina pārdotos kuģus — saskaņojot zīmola pozicionēšanu un uzlabojot pircēja pieredzi. Nekonsekvents piedāvājums vai piegādes kavēšanās var aizkavēt jahtas nodošanu vai samazināt sludinājuma prezentāciju. Dīleriem nepieciešama konsekventa kvalitāte visos apjomos, uzticami piegādes termiņi un konkurētspējīgas cenas, lai saglabātu peļņas normas.Paddle Board Overstock Piedāvā dīleru krājumu programmas ar sezonālu piegādes grafiku, kopzīmola iespējām izstāžu zāles izstādēm un prioritāru sadalījumu sezonas maksimuma laikā.
      features:
        - Krājumu uzpildes programmas ar pieejamiem modeļiem pēc pieprasījuma
        - Sezonas piegādes grafiks, kas saskaņots ar nodošanas kalendāru
        - Dīleru kopzīmolu izmantošana konsolēs un lampās izstāžu zāles displejam
        - Vienmērīga kvalitāte un specifikācija visos partijas pasūtījumos
        - Konkurētspējīgas dīleru cenas ar apjoma balstītu līmeni
