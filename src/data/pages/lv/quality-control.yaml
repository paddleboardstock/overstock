  subtitle: Daudzpakāpju pārbaudes process, kas aptver ienākošos materiālus, ražošanas procesu, spiediena pārbaudi, galīgo montāžu un pirmsnosūtīšanas pārbaudi. Katras partijas izsekojamība ir nodrošināta, katra testa rezultāti tiek dokumentēti.
