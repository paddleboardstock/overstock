benefits:
  - title: Izveidots ikdienas mācībām
    description: Biezāki PVC un pastiprināti sliedes iztur ikdienas studentu lietošanu, kritienus uz smiltīm un akmeņainu nolaidšanos.
    icon: tabler:shield
  - title: Stabili mācību platformas
    description: Plates kuģi un plakanāki rocker nodrošina iesācējiem pārliecību. Instruktori var koncentrēties uz mācīšanu, nevis uz aprīkojumu.
    icon: tabler:scale
  - title: Viegla glabāšana un transportēšana
    description: Piepūšamais dizains ļauj uzglabāt mazās telpās. Nolocītas dēļi ietilpst standarta automašīnas bagāžniekā mobilajām mācībām.
    icon: tabler:box-seam
  - title: Pielāgota zīmola veidošana
    description: Skolas logotipi un krāsas uz katra dēļa. Jūsu zīmols, jūsu identitāte — nevis vispārējs nomas aprīkojums.
    icon: tabler:brush
content_segments:
  tagline: Skolas profili
  title: Ūdenssporta izglītības risinājumi<br />Pēc programmas veida
  subtitle: Airu skolas, sērfošanas akadēmijas, universitātes programmas un franšīzes operatori saskaras ar dažādām darbības problēmām — no mācību plānu integrācijas līdz daudzvietu flotes standartizācijai. Mēs konfigurējam aprīkojuma paketes, lai tās atbilstu izglītības modelim.
  items:
    - title: Neatkarīgas SUP un kajaku skolas
      subtitle: Īpašnieka vadītie apmācību centri
      description: Mazas līdz vidējas skolas, ko vada īpašnieki-instruktori, piedāvājot SUP nodarbības, kajaku apmācību un sertifikācijas kursus. Aprīkojumam jābūt pietiekami izturīgam ikdienas mācību lietošanai, pieejamam neliela uzņēmuma budžetam un pietiekami daudzveidīgam, lai vienā flotē apkalpotu gan iesācējus, gan vidējā līmeņa studentus.
      features:
        - Stabilas universālas SUP dēļi un atpūtas kajaki iesācēju nodarbībām
        - Instruktoriem paredzēti dēļi ar papildu stabilitāti, lai vadītu nodarbības ūdenī
        - Iekļauti nodarbību plānu veidnes un prasmju progresijas ceļveži
        - Gada aprīkojuma atjaunošanas programma ar atlaidi iepriekšējā inventāra nodošanai
    - title: Universitāšu un koledžu atpūtas programmas
      subtitle: Lieli studentu atpūtas flotes
      description: Universitāšu atpūtas nodaļas, kas vada airēšanas klubus, nomas programmas un instruktāžas kursus kā daļu no kampusa atpūtas piedāvājumiem. Aprīkojums tiek izmantots intensīvi semestru laikā, nepieciešamas vienkāršas reģistrēšanās/izsniegšanas sistēmas, un tam jāpacieš dažādi prasmju līmeņi no pirmreizējiem studentiem līdz pieredzējušiem airētājiem.
      features:
        - Augstas izturības PVC konstrukcija, novērtēta institucionālai lietošanai
        - Flotes krāsu kodēšana pēc prasmju līmeņa ērtai vadībai
        - Saderība ar RFID vai uzlīmju inventāra izsekošanas sistēmām
        - Daudzapjoma cenas ar pasūtīšanu un apmaksu semestru bāzē
    - title: Sērfošanas skolas un akadēmijas
      subtitle: Piekrastes sērfošanas instruktāžas programmas
      description: Sērfošanas skolas māca SUP sērfošanas, guļus airēšanas un sērfošanas kajaku prasmes okeāna vidē. Aprīkojumam jāiztur sērfošanas zonas apstākļi — triecienizturība, izturība pret smiltīm un sālsūdeni, kā arī viegla izskalojamība un atgriešana starp stundu nodarbībām.
      features:
        - Sērfošanai specifiski dizaini ar pastiprinātām malām un triecienizturīgu konstrukciju
        - Mīkstas spuras un sarullējami ķēdes siksnas studentu drošībai
        - Ātri izskalojams audums, kas izžūst starp nodarbību rotācijām
        - Flotes aizvietošanas programma ar sezonas beigās veikto pārbaudi un atjaunošanu
    - title: Franšīzes un vairāku atrašanās vietu ķēdes
      subtitle: Standardizēts aprīkojums visās lokācijās
      description: Daudzvietu operatori, kas vada standartizētas apmācības programmas vairākās pilsētās vai reģionos. Flotes vienotība visās lokācijās ir augstākā prioritāte — katram studentam jāsaņem vienāda aprīkojuma pieredze neatkarīgi no franšīzes atrašanās vietas. Būtiska ir centralizēta pasūtīšana, zīmola vienotība un mērogošanas atbalsts.
      features:
        - Vienādas flotes specifikācijas visās franšīzes lokācijās
        - Centralizēta apvienota pasūtīšana ar apjoma cenām
        - 'Kopzīmola iespējas: franšīzes zīmols + Paddle Board Overstock kopzīmols'
        - 'Jaunas lokācijas uzstādīšanas komplekts: aprīkojums, zīmes un sākotnējais inventārs'
