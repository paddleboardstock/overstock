section_testing:
  title: Testēšanas un drošības protokoli
  subtitle: Aquafarer kvalitātes nodrošināšanas sistēma katram ražošanas partijai
  protocols:
    - title: 1,25x nominālā spiediena noturības tests
      description: Katrs saliktais trauks tiek uzpūsts līdz 1,25x tā nominālajam darba spiedienam un turēts 24–48 stundas. Jebkura spiediena kritums, kas pārsniedz 2%, izraisa atlaišanu un pārstrādi.
      standard: ISO 6185
    - title: Šuvju atdalīšanās stiprības tests
      description: Metināto un līmēto šuvju paraugi no katras ražošanas partijas tiek testēti atdalīšanās stiprībai, izmantojot kalibrētas vilkšanas iekārtas. Nepieciešama minimālā 4 kN/m atdalīšanās izturība.
      standard: ISO 2411
    - title: Auduma stiepes testa
      description: Ienākošie auduma ruļļi tiek testēti stiepes stiprībā un pagarinājumā gan šķiedru, gan šķērsvirzienā. Atlaišanas slieksnis zem 3 000 N/5 cm PVC.
      standard: ISO 1421
    - title: UV Paātrināta laika iedarbība
      description: Materiālu paraugus pakļauj 1 000+ stundu paātrinātai UV iedarbībai QUV testu kamerās. Atļauts maksimālais 15% stiepes stiprības zudums.
      standard: ASTM G154
    - title: Vārstu un savienojumu integritāte
      description: Katram vārsta komplektam tiek testēta blīvuma integritāte pie 1,25x nominālā spiediena. Atpakaļ caurlaidīgie vārsti tiek testēti viena virziena blīvuma veiktspējai.
      standard: ISO 12402
section_manufacturing:
  title: Ražošanas standarti un kvalitātes sertifikāti
  subtitle: Nozares standartu atbilstība globālajam tirgum
  standards:
    - name: ISO 9001:2015
      body: SGS Sertificēts
      scope: Kvalitātes vadības sistēma dizainā, ražošanā un piegādē
    - name: CE 2013/53/ES
      body: ES Paziņotā institūcija
      scope: Atpūtas kuģu direktīva — korpusa dizains, stabilitāte, flotācija, emisijas
    - name: BSCI
      body: Amfori
      scope: Sociālā atbilstība — darbinieku drošība, godīga darba aizsardzība, vides pārvaldība
    - name: ISO 6185
      body: Starptautiskais standarts
      scope: Piepūšamās laivas — konstrukcija, stabilitāte, peldēšana, spiediena testēšana
    - name: REACH
      body: ES regulējums
      scope: Ķīmiskā drošība — ierobežotas vielas materiālos un pārklājumos
section_faq:
  title: Tehniskie biežāk uzdotie jautājumi
  questions:
    - q: Kā tas drop-stitch salīdzinās ar tradicionālo cietā apvalka konstrukciju?
      a: Mūsdienu drop-stitch kodoli ar 20 mm PSI sasniedz 85–90% no salīdzināmas EPS putu/stikla šķiedras cieto korpusu stingrības, vienlaikus pilnībā atpūšoties transportēšanai. Kompromiss ir nedaudz lielāks svars un zemāka galīgā stingrība — taču lielākajai daļai atpūtas un komerciālo pielietojumu šī atšķirība ir nenozīmīga.
    - q: Kāds vītņu blīvums tiek uzskatīts par augstākās kvalitātes?
      a: Premium drop-stitch audumi izmanto 2 diegus uz kvadrātcollu (aptuveni 3 100 diegi uz m²), kas austi no 1 680 DTEX poliestera dzijas. Sākuma līmeņa audumi izmanto 1 diegu uz kvadrātcollu ar 1 100 DTEX dzijām.
    - q: Vai to var Hypalon metināt šādiPVC?
      a: Nē. Hypalon/CSM nevar tikt metināts ar RF. To jāmontē, izmantojot ar roku uzklātu kontaktlīmi, kas padara ražošanu darbietilpīgāku un padara šuves atkarīgas no operatora prasmēm.PVC Var būt RF metināts vai ar karsto gaisu, lai nodrošinātu vienmērīgu, automatizētu šuvju kvalitāti.
    - q: Kāds ir maksimālais drošais spiediens piepūšamajām laivām?
      a: Standarta piepūšamās laivu caurules darbojas pie 8–12 PSI.Drop-stitch grīdas darbojas pie 12–20 PSI. Augsta spiediena drop-stitch serdeņi (SUPs) var darboties pie 20–25PSI. Katrs produkts ietver spiediena atvieglošanas vārstus, kas kalibrēti, lai novērstu pārmērīgu uzpūšanos.
    - q: Cik ilgs laiks nepieciešams, lai izgatavotu pielāgotu piepūšamo laivu?
      a: Standarta OEM ražošana ilgst 30–45 dienas no pasūtījuma apstiprināšanas līdz FOB Čingdao. Pielāgotu veidņu izstrāde pievieno 15–20 dienas prototipa ražošanai un testēšanai.
