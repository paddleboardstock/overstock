hero:
  tagline: Inženierzinātņu baltā grāmata
  title: Drop-Stitch Tehnoloģijas un materiālzinātne:<br />Mūsdienu piepūšamo ūdens transportlīdzekļu inženierija
  subtitle: Autoritatīva tehniskā atsauce, kas aptver drop-stitch kodola konstrukciju, PVC Hypalon materiālu salīdzinājumu, augsta spiediena kuģa stingrības testēšanu un ūdens transportlīdzekļu ražošanas standartus.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-design-discussion-lab.webp
    alt: Aquafarer Pētniecības un attīstības laboratorija — materiālu testēšana un inženierija
direct_answer: Drop-stitch Tehnoloģija izmanto tūkstošiem iekšējo poliestera vītņu, kas savieno piepūšamā kodola augšējos un apakšējos auduma slāņus. Uzpūšot līdz 15–20, PSIšie vītņi darbojas kā sprieguma elementi, novēršot izspiešanos un radot stingru konstrukciju, kas līdzinās cietā apvalka konstrukcijai. Apvienojumā ar moderniem PVC Hypalon auduma pārklājumiem un RF metināšanu tas ļauj izmantot pārnēsājamus, augstas veiktspējas piepūšamus ūdens transportlīdzekļus, kas piemēroti profesionālai, komerciālai un atpūtas lietošanai.
section_drop_stitch:
  title: Drop-Stitch Būvinženierija
  subtitle: Kā tūkstošiem pavedienu pārvērš elastīgu audumu stingrā struktūrā
  content: |
    Drop-stitch (zināms arī kā "drop-stitchaudums" vai "drop-stitchkodols") ir izrāviens piepūšamo konstrukciju inženierijā. Princips ir maldinoši vienkāršs: tūkstošiem atsevišķu poliestera pavedienu vienlaikus tiek ieausti divās atsevišķās pamatauduma kārtās, savienojot augšējo un apakšējo paneli 90 grādu leņķī.

    Kad noslēgtā kamera tiek saspiesta, iekšējais gaisa spiediens izdala spēku vienmērīgi visos virzienos — cenšoties atdalīt augšējos un apakšējos paneļus cilindriskā formā. Tūkstošiem drop-stitch vītņu pretojas šai atdalīšanai, pārnesot slodzi spriegumā pa vītnes asi. Rezultātā ir plakans, stingrs panelis, kas spēj izturēt 15–20 iekšējo PSI spiedienu.

    Pie 20 , PSI1 m² drop-stitch panelis piedzīvo aptuveni 14 000 kg kopējā iekšējā spēka — tomēr vītņu matrica to notur pilnīgi plakanu. Tas drop-stitch nodrošina konstrukcijām izturības un svara attiecību, kas sacenšas ar tradicionālajiem stingrajiem materiāliem.
