tests:
  - title: Spiediena Pārbaude
    standard: ISO 6185-1 | Iekšējā specifikācija AF-PT-001
    description: Uzpūšamās kameras tiek spiestas līdz 1,25 reizēm virs ieteicamā darba ierobežojuma un tiek turētas 30 minūtes. Spiediena samazināšanās tiek mērīta, lai pārbaudītu materiālu un šuvju gaisa necaurlaidību un konstrukcijas integritāti.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
  - title: Ietekmes testēšana
    standard: Iekšējā specifikācija AF-IT-002
    description: Produkti tiek pakļauti kontrolētiem triecieniem ar standartizētiem kritiena svariem un pendula iekārtām. Tas novērtē caurduršanas izturību, plīsumu izplatīšanos un konstrukcijas noturību pret sadursmēm ar šķēršļiem, piestātnēm un gruvešiem.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
  - title: UV Pretestības testēšana
    standard: ASTM G154 |ISO 4892-3
    description: Materiālu paraugi tiek pakļauti UVA-340 lampām paātrinātās novecošanās kamerās 1 000+ stundas. Mēs mēram krāsas maiņu (Delta E), spīduma noturību un stiepes stiprības zudumu, lai validētu UV stabilizatoru paketes.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
  - title: Nodiluma izturības testēšana
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: Materiālu paraugi tiek pakļauti CS-10 abrazīviem riteņiem ar 500g/1 000g slodzi 1 000 ciklu garumā. Masas zudums un vizuālā nodiluma pakāpe nosaka pārklājuma izturību pret smiltīm, granti un atkārtotu palaišanu.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pvc-material-testing.webp
  - title: Zemas temperatūras veiktspējas testēšana
    standard: Iekšējā specifikācija AF-LT-003 | MIL-STD-810G
    description: Saliktie produkti un materiālu kuponi tiek kondicionēti -20°C, -10°C un 0°C temperatūrā 24 stundas, pēc tam elastīgi testēti. Mēs to pārbaudām PVC un Hypalon saglabājam elastību bez plaisām vai delaminācijas.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-exterior.webp
  - title: Peldspējas un slodzes kapacitātes testēšana
    standard: ISO 6185-1 |ISO 12402
    description: Produkti tiek pakāpeniski ielādēti līdz 1,25x nominālajai kapacitātei kontrolētā baseinā. Tiek reģistrēta brīva kāpuma pakāpe, stabilitāte un pašiztukšošanās veiktspēja. Katram modelim nominālā kapacitāte tiek matemātiski un empīriski pārbaudīta.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-stock-boat-inventory.webp
  - title: Manevrētspējas testēšana
    standard: Iekšējā specifikācija AF-MT-004
    description: Izmēģinājumi uz ūdens mēra pagrieziena rādiusu, paātrinājumu, planēšanas laiku un airu/motora reakciju dažādos slodzes apstākļos. Reālās pasaules vadāmības īpašības tiek pārbaudītas, salīdzinot ar projektētajiem mērķiem.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-dolphin-wave-1.webp
  - title: Ūdensnecaurlaidības testēšana
    standard: ISO 6185-1 §7.3 | Iekšējā specifikācija AF-WT-005
    description: Katrs saliktais produkts tiek izsmidzināts ar 0,5 bar spiedienu uz visām šuvēm, vārstiem un savienojumiem. 5 minūšu spiediena iegremdēšanas tests apstiprina kameras un vārstu ūdensnecaurlaidību. Nulles noplūdes standarts pirms piegādes.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department-2.webp
