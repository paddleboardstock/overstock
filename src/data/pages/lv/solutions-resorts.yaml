testimonial:
  content: Aquafarer izstrādāja un aprīkoja visu mūsu pludmales aktivitāšu programmu trīs kūrorta īpašumos. 80 SUPs, 40 kajaki, drošības infrastruktūra un personāla apmācība — viss piegādāts vienā sūtījumā. Pirmās sezonas laikā viesu dalība ūdens aktivitātēs palielinājās par 60%.
  name: Sophie Laurent
  title: Viesu pieredzes direktore, Azure Bay Resorts — Puketa, Taizeme
content_segments:
  tagline: Kūrorta profili
  title: Ūdens piekrastes viesmīlības risinājumi<br />Pēc īpašuma veida
  subtitle: Katram kūrorta īpašumam ir unikāls viesu profils, aktivitāšu maisījums un darbības ritms — no boutique ekoloģiskajiem namiņiem līdz plašiem luksusa pludmales kūrortiem. Mēs izstrādājam ūdens sporta programmas, kas atbilst īpašuma klasei un viesu gaidām.
  items:
    - title: Luksusa pludmales kūrorti
      subtitle: VIP transfēri, ūdens aktivitātes, premium viesu pieredze
      description: Augstas klases pludmales īpašumi — Four Seasons, Aman un līdzīgas luksusa grupas — kur ūdens sporta aktivitātes ir galvenā viesu ērtība, kas veicina apmierinātības rādītājus un papildus ieņēmumus. Flotei jāizskatās premium, jānodrošina dažādība dažāda vecuma grupām un prasmju līmeņiem, kā arī tā jāintegrē ar kūrorta esošajām konsjerža un rezervācijas sistēmām. Viesu augstās gaidas parādās ļoti skaidri — aprīkojuma stāvoklis un prezentācija tieši ietekmē 5 zvaigžņu atsauksmes.
      features:
        - 'Premium zīmolu flote: SUPs, kajaki, pedalboāti un mazie RIB laivas'
        - 'Viesiem gatava prezentācija: saskaņotas kūrorta krāsas, logotipa zīmols, izvietota aprīkojuma demonstrācija'
        - Mazs luksusa RIB VIP viesu transfēriem ar pielāgotu apdari un krāsu saskaņošanu
        - 'Integrēta drošības infrastruktūra: bojas, glābšanas stacijas, AED'
        - 'Ieņēmumu vadība: dinamisko cenu veidnes, pārdošanas apmācība, pakotņu komplektēšana'
    - title: Privāti salu kūrorti
      subtitle: Visu laika apstākļu viesu transports — nulle dīkstāves, absolūta uzticamība
      description: Privātie salu kūrorti darbojas attālos reģionos, kur laiva ir vienīgais savienojums ar kontinenta daļu. Ikdienas viesu pārvadājumi, piegādes un neatliekamā medicīniskā evakuācija ir atkarīga no viena kuģa — jebkurš dīkstāves laiks tieši ietekmē viesu pieredzi un kūrorta darbību. Šiem operatoriem nepieciešama laiva, kas darbojas uzticami jebkuros laika apstākļos, prasa minimālu apkopi un ir aprīkota ar rezerves sistēmām misijai kritiskai uzticamībai. Laivai arī jāizskatās skaisti, kad viesi ierodas salā.
      features:
        - Visu laika apstākļu RIB konfigurācija ar pilnu laikapstākļu korpusu un izturīgām caurulēm
        - Divu dzinēju vai rezerves dzinēju nodrošinājums darbībai bez dīkstāves
        - Komerciālās klases Hypalon būvniecība uz 5–8 gadu kalpošanas laiku attālinātā ekspluatācijā
        - Viegli uzturams dizains ar pieejamām komponentēm vietējai apkopei
        - Pielāgots kūrorta zīmols un augstākās klases apdare, kas atbilst salas estētikai
    - title: Ezera krasta un ekoloģiskie kūrorti
      subtitle: Dabas integrētas viesu pieredzes
      description: Ezera krasta īpašumi, ekoviesnīcas un dabas atpūtas vietas piedāvā klusas, zemas ietekmes ūdens aktivitātes, kas papildina dabisko vidi. Aprīkojumam, kur iespējams, jābūt nemotorizētam, viegli uzglabājamam ierobežotas vietas laivu mājiņās un klusam lietošanā, lai saglabātu apkārtējo vidi visiem viesiem.
      features:
        - 'Nemotorizētā flote: SUPskajaki, kanoe un airu laivas'
        - Klusās elektriskās sūkņu uzpūšanas stacijas viesu lietošanai pēc pieprasījuma
        - Videi draudzīgi materiāli un iepakojums, kas atbilst ilgtspējas zīmolam
        - Tika iekļauti uzglabāšanas plaukti un laivu māju organizācijas sistēmas
    - title: Pludmales klubi
      subtitle: Viesu pārejas, izklaide, neliels luksuss RIBs
      description: Pludmales klubi darbojas enerģiskā, vizuāli orientētā vidē, kur aprīkojums ir daļa no atmosfēras. Tiem nepieciešama neliela greznība RIBs viesu pārvadāšanai no tuvējām viesnīcām vai piestātnēm, kā arī ūdens rotaļlietas viesu izklaidei — ūdensmotociklu vilkšana, piepūšamās slidkalniņi un airēšanas dēļi. Flotei jāizskatās stilīgi, jābūt viegli lietojamai un jāiztur ikdienas lietošana viesiem ar dažādu prasmju līmeni. Uzglabāšana un ātra izvietošana ir kritiski svarīga pīķa stundās.
      features:
        - Kompakts luksusa RIB modelis (3,3-4,3 m) viesu pārvadāšanai un apkalpošanai ar tenderi
        - 'Ūdens rotaļlietas: piepūšamās rotaļlietas, SUP dēļi, kajaki viesu izklaidei'
        - Pielāgota krāsa un zīmols, kas atbilst pludmales kluba vizuālajai identitātei
        - Ātrās palaišanas un atgūšanas sistēmas augstas apgrozījuma operācijām
        - Izturīga Hypalon konstrukcija ikdienas sālsūdens iedarbībai un UV
    - title: Privātie biedru klubi un jahtklubi
      subtitle: Ostas transports, biedru konkursi, ekskluzīvi ūdens sporta veidi
      description: Privātie klubi, kur ūdens sporta veidi un laivu transports ir biedru labums, nevis ieņēmumu avots. Aprīkojumam jāatbilst augstākiem estētiskiem standartiem, jābūt pieejamam pēc pieprasījuma biedriem un nepieciešama minimāla personāla uzraudzība. Ostas jahtu klubiem īpaši nepieciešami tenderi ostas transportam — biedru pārvietošanai starp piestātni, piestātni un krastu. Uzglabāšana un uzturēšana biedriem jābūt neredzamai.
      features:
        - Augstas klases RIB iepirkumi ostas transportam un biedru pārvietošanas pakalpojumiem
        - 'Premium aprīkojums: EVA terases, pielāgotas biedru krāsas, zīmola apdare'
        - Pašapkalpošanās izrakstīšanās sistēma dalībnieku piekļuvei bez personāla
        - Ārpus sezonas uzglabāšana un ikgadējā atjaunošanas programma
    - title: Piedzīvojumu un aktivitāšu orientētas viesnīcas
      subtitle: Ekskursijas ar gidu, SUP joga, snorkelēšanas izbraucieni, grupu aktivitātes
      description: Īpašumi, kas sevi pozicionē kā piedzīvojumu galamērķus — piedāvājot ekskursijas ar gidu, SUP jogu, saulrieta braucienus ar airi, snorkelēšanas izbraucienus un grupu aktivitātes. Flotei jāatbalsta gan bezmaksas nomas, gan vadītu programmu modeļi, ar aprīkojumu, kas vienmērīgi pielāgojas gan viesu pašizmantošanai, gan instruktoru vadītajām ekskursijām. Šiem īpašumiem nepieciešams izturīgs aprīkojums augstas frekvences nomaiņai, ar viegli tīrāmu aprīkojumu starp viesu grupām.
      features:
        - Daudzfunkcionāla jauktā flote, kas atbalsta nomas + vadīto ekskursiju modeļus
        - Tandēma kajaki un ekstra stabilas SUP platformas grupu aktivitātēm
        - 'Instruktora aprīkojums: instruktoru dēļi, sausās kastes, ūdensnecaurlaidīgās komunikācijas'
        - 'Sezonāla aprīkojuma rotācija: vasaras flote → ziemas krātuves programma'
        - Izturīga konstrukcija, paredzēta ikdienas viesu lietošanai ar minimālu apkopi
