testimonial:
  content: Mēs sākām ar Kluba Startera komplektu mūsu sērfošanas skolai Portugālē. 20 dēļi, airi, vestes — viss ieradās 3 nedēļu laikā. Pēc diviem gadiem mēs pārgājām uz Pro komplektu. Pielāgotais zīmols ar mūsu logotipu būtiski uzlaboja mūsu profesionālo tēlu.
  name: Ricardo Santos
  title: Īpašnieks, Algarve Surf Academy — Lagos, Portugāle
content_segments:
  tagline: Kluba profili
  title: Ūdens sporta klubu risinājumi<br />Pēc kluba veida
  subtitle: No universitāšu airēšanas klubiem līdz ekskluzīviem privātiem jahtu klubiem — katram klubu veidam ir unikālas aprīkojuma vajadzības, lietošanas paradumi un budžeta struktūras. Mēs pielāgojam katru komplektu, lai tas atbilstu konkrētā kluba modelim.
  items:
    - title: Universitāšu un koledžu airēšanas klubi
      subtitle: Lielas noslogotas studentu flotiles
      description: Ar studentiem vadīti vai iestāžu atbalstīti airēšanas klubi, kas darbojas SUP un kajaku programmās universitāšu atpūtas nodaļām. Aprīkojums tiek izmantots bieži un lielā apjomā, dažādu prasmju līmeņu studentu vidū katru semestri. Ilgmūžība un viegla remontējamība ir kritiski svarīgas, kā arī budžetam draudzīgas cenas studentu organizācijām.
      features:
        - Īpaši izturīga PVC konstrukcija, paredzēta studentu cikliem
        - Krāsām kodētas dēļu līnijas pēc prasmju līmeņa vienkāršai flotiles pārvaldībai
        - Remonta komplekts + ar video atbalstu tiek iekļauts katrā pasūtījumā
        - Atlaides studentu organizācijām un semestrā balstītas maksājumu termiņi
    - title: Kopienas airēšana un sociālie klubi
      subtitle: Biedru vadīti atpūtas klubi
      description: Kopienas bāzēti klubi, kas SUPbiedriem piedāvā kajaku un sociālās airēšanas pieredzes. Aprīkojumam jālīdzsvaro veiktspēja un komforts plašam vecuma diapazonam, ar zīmolu, kas veicina kluba identitāti un biedru lepnumu. Uzglabāšanas efektivitāte ir būtiska klubiem, kas darbojas no ierobežotas piekļuves pie ūdens.
      features:
        - 'Jauktā flote: visapkārt, tūrisma SUPsdēļi un atpūtas kajaki'
        - 'Pilns kluba zīmols: pielāgotas krāsas, logotipa druka, zīmola pamatnes'
        - Kompaktie uzglabāšanas risinājumi piepūšamām iekārtām
        - 'Biedru izaugsmes sākuma komplekts: ieteikumu kartītes, zīmola fotogrāfijas'
    - title: Sērfošanas skolas un sērfošanas kajaku akadēmijas
      subtitle: Piekrastes sniegums un trenera darbs
      description: Sērfošanas orientētas SUP skolas, kas māca sērfošanu, sērfošanas kajakošanu un viļņu braukšanu. Aprīkojumam jādarbojas sērfošanas apstākļos — manevrējamam, atsaucīgam un pietiekami izturīgam, lai izturētu atkārtotus kritienus, smilšu nodilumu un sālsūdens iedarbību bez straujas degradācijas.
      features:
        - Īsākas, platākas SUP formas, optimizētas viļņu manevrēšanai
        - Pastiprināta sliežu konstrukcija viļņu triecienu izturībai
        - 'Sērfošanas specifisks drošības aprīkojums: saritinātas pavadas, mīkstās spuras opcijas'
        - Autoparka nomaiņas programma ar sezonālām atlaidēm par iemainīšanu
    - title: Korporatīvie un privātie jahtu klubi
      subtitle: Premium biedru pieredze
      description: Ekskluzīvi privāti klubi, kas piedāvā ūdens sportu kā premium ērtību biedriem. Aprīkojuma standarti ir augsti — estētika, zīmola saskaņotība un viesu gatavības prezentācija ir tikpat svarīga kā sniegums. Servisa prasības ietver baltu cimdu piegādi, pielāgotus uzglabāšanas risinājumus un konsjerža līmeņa atbalstu.
      features:
        - Premium apdares dēļi ar koka šķiedru EVA un metāliskiem akcentiem
        - Individuāla krāsu saskaņošana ar kluba zīmola vadlīnijām
        - 'Konsjerža piegāde: iepriekš uzpūsta, noformēta un marķēta katrai sezonai'
        - Speciāla kontu pārvaldība ar prioritāro atbildes SLA
