content_challenge:
  tagline: Izaicinājums
  title: Glābšanas operācijas pieprasa<br />Nesamierināmu uzticamību
  subtitle: Meklēšanas un glābšanas organizācijas darbojas ar maksimālu drošības atbildību — katra laivas kļūme nes nepieņemamas sekas.
  paragraphs:
    - Glābšanas operācijās robeža starp panākumiem un neveiksmi tiek mērīta minūtēs. Laivai jābūt gatavai tūlītējai palaišanai, jāstrādā raupjos apstākļos un droši jāatgriežas ar pasažieriem. Drošības atbildība ir absolūta — mehāniska kļūme glābšanas misijas laikā nav remonta izmaksas, tas ir zaudēts dzīvība.
    - GLābšanas laivām nepieciešama liela ātruma, lai ātri sasniegtu upurus, apvienojumā ar izcilu stabilitāti drošām atgūšanas operācijām. Tām jānes glābšanas aprīkojums, medicīnas preces un sakaru iekārtas — bieži ierobežotā klāja telpā. Valsts pakalpojumā esošām laivām nepieciešama arī ilga kalpošanas mūža (10-15+ gadi), lai pamatotu publiskās iepirkuma budžetus.
    - Redzamība gan operatoram, gan meklēšanai, ir kritiski svarīga. Konsoles dizainam jānodrošina 360 grādu redzamība, un laiva jābūt labi redzamai lidmašīnām un citiem kuģiem.
    - Paddle Board Overstock glābšanas RIBs tiek izstrādātas no prāmja līdz kānai šo prasību nodrošināšanai — ar pašnoteces klājiem, pastiprinātiem korpusiem, navigācijas iekārtām un stieņu bāzēm, kas standarta aprīkojumā patrulējošiem modeļiem.
content_solution:
  tagline: Mūsu risinājums
  title: Speciāli izstrādāta glābšanas RIBs
  subtitle: Katru Paddle Board Overstock glābšanas laivu izstrādā, lai tā atbilstu vai pārsniegtu SOLAS un valsts SAR standartus.
  list:
    - Pašnoteces klājs — ūdens novadās automātiski stabilitātei atgūšanas operācijās
    - Pastiprināts deep-V korpuss — iespēja darbībai raupjos ūdeņos ar paredzamu vadāmību ātrumā
    - Pilns navigācijas gaismu komplekts — darbspējīga dienā un naktī visos laikapstākļos
    - Stieņu bāze un vilkšanas aukla — gatava kuģa vilkšanai vai glābšanas ragavas operācijām
    - Aprīkojuma stiprinājuma plāksnes — radio, meklēšanas gaisma, sirēna un medicīniskās iekārtas
    - Vairāku dzinēju konfigurācijas — viena ārējā vai divu dzinēju rezerves
    - Augstas redzamības caurules krāsas — oranža, dzeltena vai sarkana maksimālai redzamībai
content_segments:
  tagline: Glābšanas profili
  title: Meklēšanas un glābšanas ūdens transportlīdzekļu risinājumi<br />Pēc organizācijas veida
  subtitle: Dažādas glābšanas organizācijas darbojas ar atšķirīgiem uzdevumiem, budžeta cikliem un darbības vidi — sākot no piekrastes brīvprātīgo apkalpēm līdz nacionālajām krasta apsardzes flotēm. Mēs konfigurējam katru glābšanu, RIB lai tā atbilstu misijas profilam.
  items:
    - title: Krasta apsardze un valdības meklēšanas un glābšanas aģentūras
      subtitle: Absolūta drošības atbildība — misijai kritiski svarīgi flotes standarti
      description: Valsts meklēšanas un glābšanas aģentūras uzņemas visaugstāko drošības atbildību jūras operācijās. Katram kuģim jādarbojas nevainojami ekstremālos apstākļos — aprīkojuma bojājums glābšanas misijas laikā nav pieļaujams. Iepirkumu lēmumus nosaka kopējās īpašumtiesību izmaksas 10–15 gadu kalpošanas laikā, nevis sākotnējās izmaksas. Aģentūrām ir nepieciešami kuģi, kas iztur vairākus piekrastes patrulēšanas gadus, atbilst stingriem nacionālajiem standartiem un nodrošina konsekventu veiktspēju visās izkliedētajās stacijās. Visaptveroša atbilstības dokumentācija un vairāku gadu pakalpojumu līgumi ir obligāti.
      features:
        - SOLAS un nacionālo SAR standartu atbilstības dokumentācijas paketi
        - Flotes mēroga komponentu kopīgums — samazināt stacijas līmeņa inventāra sarežģītību
        - Divu dzinēju konfigurācija misijas kritiskai redundancei
        - 10–15 gadu kalpošanas laika dizains ar plānotās apkopes programmām
        - Visu laika apstākļu spēja — pastiprināts dziļā V formas korpuss nemierīgiem jūras apstākļiem
    - title: Glābēji un pludmales glābšanas dienesti
      subtitle: Ātrās palaišanas, seklūdens operācijas
      description: Pašvaldību un pludmales glābēju pakalpojumi, kuriem nepieciešami ātrās reaģēšanas kuģi, kas var startēt caur sērfošanas zonām, darboties seklos piekrastes ūdeņos un dažu minūšu laikā sasniegt peldētājus vai nelaimē nonākušus kuģus. Aprīkojumam jābūt pietiekami vieglam, lai to varētu vilkt pludmalē ar mazu transportlīdzekli vai manuāli.
      features:
        - Seklā iegrimes RIB korpuss sērfošanas zonas un piekrastes operācijām
        - Pludmales palaišanas spējīga ar priekšgala pacelšanas rokturi un ķīļa aizsargu
        - Integrēta glābšanas kamanas vai glābšanas peldētāju platforma
        - Standarta oranžas vai dzeltenas caurules ar augstu redzamību
    - title: Ugunsdzēsības un glābšanas dienesti
      subtitle: Ugunsdzēsības sūkņa integrācija, aprīkojuma uzstādīšana, ātra reaģēšana
      description: Ugunsdzēsības glābšanas jūras vienības reaģē uz krastmalas ēku ugunsgrēkiem, kuģu ugunsgrēkiem un glābšanas gadījumiem uz ūdens. Šīm laivām jānes ugunsdzēsības sūkņi, monitori, šļūteņu uzglabāšanas iekārtas un elpošanas aparāti — viss integrēts stabilā, ātras reaģēšanas platformā. Departamenti šos kuģus izmanto arī plūdu reaģēšanai un savstarpējās palīdzības operācijām. Konsoles izkārtojumiem jānodrošina sūkņu vadība, radio sistēmas un avārijas apgaismojums, nezaudējot klāja vietu apkalpes pārvietošanai.
      features:
        - Priekšgala uguns monitors ar sūkņa integrācijas paketi
        - Speciāls aprīkojuma stiprinājums ugunsdzēsības sūkņiem, šļūteņu uzglabāšanai un BA komplektiem
        - Konsoles izkārtojums konfigurējams sūkņu vadībai, radio un avārijas apgaismojumam
        - Pašizsūknējošais klājs ugunsdzēsības ūdens notecei un stabilitātei
        - 'Nakts operāciju komplekts: meklēšanas gaisma, ainavas apgaismojums, zilās/sarkanās gaismas josla'
    - title: Jūras policija un ostas drošība
      subtitle: Pārtveršanas, patruļas, iebrukuma operācijas
      description: Jūras kājnieku tiesībaizsardzības vienībām nepieciešami kuģi, kas spēj veikt ātru vajāšanu, aizdomīgu kuģu iekāpšanu un ostas drošības patrulēšanu. Šīm laivām jābūt drošai glabāšanas vietai izpildes ekipējumam un ieročiem, sakaru integrācijai ar krasta komandu un pietiekamai klāja telpai iekāpšanas komandu operācijām. Nakts operāciju spēja un zema profila pieeja ir būtiska traucēšanas misijām.
      features:
        - Ātrgaitas vajāšanas spēja — planējošs korpuss ar+ maksimālo ātrumu 40 mezgli
        - Nodrošiniet ieroču skapju un aizsardzības aprīkojuma glabāšanas nodalījumus
        - Konsoles integrācija policijas radio, MDT un sakaru sistēmām
        - 'Nakts operāciju komplekts: infrasarkanais prožektors, FLIR stiprinājums, slepenais apgaismojums'
        - Pastiprināta iekāpšanas platforma ar neslīdošu virsmu
        - Zilā/sarkanā avārijas apgaismojuma un sirēnu sistēma
    - title: Brīvprātīgā meklēšanas un glābšanas un bezpeļņas organizācijas
      subtitle: Grantu finansētas, kopienā balstītas piekrastes un ezeru operācijas
      description: Kopienas glābšanas grupas darbojas ezeros, upēs un piekrastes zonās, kur valdības SAR pārklājums ir ierobežots. Bieži vien finansētas no ziedojumiem vai valdības grantiem, šīm organizācijām ir nepieciešama maksimāla spēja par dolāru — uzticams, zemas uzturēšanas kuģis, ko brīvprātīgie var droši vadīt ar minimālu speciālu apmācību. Grantu piešķiršanas cikli nozīmē, ka laivām jāatbilst atbilstības prasībām, vienlaikus ievērojot fiksētus budžetus.
      features:
        - Vienkāršā ārējā konfigurācija, optimizēta zemākām iegādes un ekspluatācijas izmaksām
        - PVC Būvniecība zemākai uzturēšanai un vienkāršai lauka remontam
        - Daudzfunkcionāla konsole, kas samazina elektronisko sarežģītību brīvprātīgajiem operatoriem
        - Grantu atbilstības dokumentācijas pakete finansējuma pieteikumiem
        - Viegls dizains pludmales palaišanai bez speciālas piekabes vai celtņa
    - title: Plūdu glābšana un katastrofu reaģēšana
      subtitle: Iekšzemes plūdi, sekls ūdens, gružu pilnas vides
      description: Plūdu glābšana ir atšķirīgs operacionālais profils — laivas darbojas applūdušās pilsētu teritorijās, gruvešu pilnās straumēs un ļoti seklā ūdenī, kur zemūdens šķēršļi ir neredzami. Operatoriem nepieciešami kuģi, kas spēj pārvietoties pa applūdušām ielām, izlauzties cauri gruvešiem un izvilkt upurus no ēkām un transportlīdzekļiem. Seklā iegrimes spēja ir kritiska, tāpat kā spēja darboties straumē ar aizķeršanās riskiem. Šīs laivas bieži izmanto ugunsdzēsēju dienesti, civilās aizsardzības un katastrofu seku likvidēšanas NVO.
      features:
        - Ļoti sekla iegrimes korpuss — darbojas 30-50 cm dziļumā ūdenī
        - Gruvešu atvairīšanas priekšgals un pastiprināta cauruļu aizsardzība zemūdens šķēršļiem
        - Pašizsūknējošais klājs plūdu ūdens notecei un upuru atgūšanai
        - Augstas redzamības oranžas vai dzeltenas caurules gaisa izlūkošanas redzamībai
        - Viegls dizains helikopteru transportam un ceļu izvietošanai
        - Pastiprināti pacelšanas punkti pacēlāju un virvju glābšanas operācijām
