hero:
  tagline: Sertifikāti un standarti
  title: Kvalitātes sertifikāti<br />un atbilstības standarti
  subtitle: Paddle Board Overstock produkti tiek ražoti atbilstoši starptautiskajiem jūras drošības standartiem, kvalitātes vadības sistēmām un vides normatīviem.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock kvalitātes sertifikāti un atbilstības dokumentācija
content_certifications:
  tagline: Mūsu sertifikāti
  title: Sertificēta kvalitāte,<br />Pasaulē atzīta
  subtitle: 64 CE-sertificēti modeļi un rūpnīcas sertifikāti pierāda mūsu apņemšanos kvalitātes, drošības un vides atbildības jomā.
  items:
    - title: CE Sertificēts
      description: 64 CE-sertificēti modeļi atbilst Eiropas CE marķēšanas prasībām atpūtas ūdens transportlīdzekļiem, nodrošinot drošības, veselības un vides aizsardzības standartu izpildi.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Mūsu kvalitātes vadības sistēma ir ISO 9001:2015 sertificēta, aptverot piepūšamo ūdens transportlīdzekļu un jūras aprīkojuma projektēšanu, ražošanu un izplatīšanu.
      icon: tabler:clipboard-check
    - title: UKCA Atzīmēts
      description: Lielbritānijas tirgū pārdotajiem produktiem ir UKCA marķējums, kas apliecina atbilstību Lielbritānijas noteikumiem par jūras aprīkojumu un personīgajiem ūdens transportlīdzekļiem.
      icon: tabler:shield
    - title: BSCI Atbilstība
      description: Paddle Board Overstock ir BSCI (Biznesa Sociālās Atbilstības Iniciatīva) auditēts, pierādot ētiskas ražošanas prakses, godīgas darba apstākļu nodrošināšanu un atbildību piegādes ķēdē.
      icon: tabler:heart-handshake
    - title: REACH Atbilstošs
      description: Visi materiāli, kas izmantoti Paddle Board Overstock produktos, atbilst ES REACH ķīmiskās drošības normatīviem, nodrošinot, ka mūsu PVC, Hypalon vai komponentēs nav aizliegto vielu.
      icon: tabler:flask
    - title: Materiālu testēšana
      description: Audums tiek testēts uz stiepšanas izturību, plīsuma izturību, UV degradāciju un aukstuma plaisāšanas veiktspēju. Katrs ražošanas partijas gabals tiek ņemts paraugs un pārbaudīts.
      icon: tabler:test-pipe
content_factory:
  tagline: Rūpnīcas standarti
  title: Ražošanas izcilība<br />— Izgatavots pēc specifikācijas
  subtitle: Mūsu 12 000 m² lielā ražotne darbojas stingru kvalitātes kontroles protokolu ietvaros katrā ražošanas posmā.
  list:
    - 'Ienākošo materiālu pārbaude: visi izejmateriāli — PVC audums, Hypalon, alumīnijs, finieris, līmes — tiek pārbaudīti atbilstoši specifikācijām pirms iekļūšanas ražošanā.'
    - 'Ražošanas procesa kvalitātes kontrole: katrā ražošanas posmā ir dokumentēti QC kontroles punkti. Līmeņa stiprību, šuvju izlīdzinājumu, vārstu uzstādīšanu un stiprinājumu griezes momentu pārbauda tiešsaistē.'
    - 'Spiediena testēšana: katra piepūšamā kamera tiek spiediena pārbaudes testā pārbaudīta pie 1,25× nominālā spiediena 24–48 stundas. Noplūdes līmenim jābūt pieņemams atbilstoši ISO 6185.'
    - 'Galīgā pārbaude: pabeigtie produkti tiek pārbaudīti pēc izmēru precizitātes, vizuālā apdares, piederumu pilnības un iepakojuma integritātes pirms nosūtīšanas.'
    - 'Partijas izsekojamība: katram produktam ir sērijas numurs, kas saistīts ar ražošanas partijas ierakstiem, ļaujot pilnīgu izsekojamību no izejmateriāliem līdz gatavajam produktam.'
content_safety:
  tagline: Jūras drošības standarti
  title: Drošība pirmajā vietā<br />— Izstrādāti uzticamai darbībai
  subtitle: Paddle Board Overstock produkti ir izstrādāti un testēti, lai atbilstu starptautiskajiem jūras drošības standartiem komerciālai un atpūtas lietošanai.
  items:
    - title: ISO 6185
      description: Piepūšamās laivas atbilst ISO 6185 standartiem būvniecībā, stabilitātē, peldošumā un kravnesībā.
      icon: tabler:sailboat
    - title: ABYC standarti
      description: Elektriskās sistēmas un degvielas sistēmas atbilst ABYC (American Boat & Yacht Council) standartiem drošai uzstādīšanai un darbībai.
      icon: tabler:bolt
    - title: SOLAS Atbilstība
      description: Drošības aprīkojums un glābšanas līdzekļi atbilst SOLAS (Safety of Life at Sea) prasībām, ja piemērojams.
      icon: tabler:lifebuoy
