why_us:
  - title: Vertikālā integrācija
    description: Mums pieder mūsu rūpnīca, veidnes un piegādes ķēde — bez starpniekiem, bez apakšuzņēmējiem. Tas mums dod kontroli pār kvalitāti, izmaksām un piegādi.
  - title: Dubultā sertifikācija
    description: ISO 9001 kvalitātes vadības un BSCI sociālās atbilstības sertifikācija. Rūpnīcas revīzijas ziņojumi pieejami pēc pieprasījuma.
  - title: CE Atbilstība
    description: Visiem standarta modeļiem ir CE 2013/53/EU sertifikācija. Pielāgotos modeļus var CE sertificēt, izmantojot mūsu izveidoto procesu.
  - title: Zems MOQ
    description: Sāciet ar tikai 5 vienībām standarta modeļiem. Mēs palīdzam jaunajām zīmolu palaišanai, nepārsniedzot krājumu apjomu.
