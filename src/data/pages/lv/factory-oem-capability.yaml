hero:
  tagline: OEM/ODM Ražošana
  title: OEM & Privātā zīmola ražošana
  subtitle: No koncepcijas līdz konteineram — pielāgojiet katru detaļu savā piepūšamo ūdens transportlīdzekļu līnijā
intro: Paddle Board Overstock piedāvā visaptverošus OEM un ODM pakalpojumus zīmoliem, izplatītājiem un valdības aģentūrām visā pasaulē. Ar 10+ gadu pieredzi eksportā un 12 000 m² ISO 9001 & BSCI sertificētu rūpnīcu, mēs nodrošinām visu — no produktu dizaina un veidņu izstrādes līdz pilna mēroga ražošanai, iepakošanai un loģistikai.
