services:
  - title: Produktu dizains un inženierija
    description: Mūsu iekšējā P&amp;D komanda strādā ar jūsu koncepciju vai specifikāciju, lai izstrādātu CAD rasējumus, 3D modeļus un prototipus. Piedāvājam veidņu dizainu, korpusa formas optimizāciju un materiālu izvēles vadlīnijas.
  - title: Pielāgota zīmola un grafikas izstrāde
    description: Pilnkrāsu digitālā druka, sietspiede, reljefs un etiķešu iespējas. Mēs izstrādājam zīmola specifiskus klāja grafikus, cauruļu zīmolus un mazumtirdzniecībai gatavu iepakojumu.
  - title: Materiālu un specifikāciju pielāgošana
    description: Izvēlieties no PVC (standarta, videi draudzīgs, ugunsizturīgs), Hypalon/CSM, drop-stitch un hibrīda konstrukcijām. Pielāgotas cauruļu krāsas, auduma biezumi un pastiprinājumu iespējas.
  - title: Iepakošana un loģistika
    description: Pielāgots mazumtirdzniecības iepakojums, privātā zīmola kastes, vakuuma iepakojums, paletēšana un konteineru iekraušana. Pieejami FOB Qingdao, CIF vai DDP piegādes noteikumi.
