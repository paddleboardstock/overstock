articles:
  sup:
    - title: SUP Pamati — Iesācēja ceļvedis
      desc: Viss, kas iesācējam jāzina — dēļu veidi, airu izmēri, stāja un padomi pirmajai dienai.
    - title: SUP Izmēru rokasgrāmata
      desc: Atrodi pareizo dēļa garumu, platumu un tilpumu atbilstoši savam svaram, prasmju līmenim un airēšanas stilam.
    - title: Piepūšamais vs cietais dēlis
      desc: Kas jums ir piemērots? Salīdzinātas pārnēsājamība, veiktspēja, izturība un izmaksas.
    - title: Vidēja līmeņa paņēmieni
      desc: Uzlabojiet savu airēšanu ar uzlabotām airēšanas tehnikām, pagrieziena paņēmieniem un rupja ūdens apstrādi.
    - title: Kā izvēlēties piepūšamo SUP
      desc: Pārvietojies pa galvenajiem faktoriem — konstrukcija, biezums, spuru izvietojums un iekļautie piederumi.
    - title: Ūdens drošība
      desc: Svarīgas drošības zināšanas, ieskaitot laika apstākļu novērtēšanu, PFD izvēli, pašglābšanos un grupas airēšanu.
  inflatable-boat:
    - title: Materiālu atsauce
      desc: PVC, Hypalon, drop-stitch, denjē vērtējumi — saprotiet, no kā izgatavota jūsu piepūšamā aprīkojuma materiāls.
    - title: PVC pret Hypalon
      desc: Noteicošā PVC un Hypalon audumu salīdzinājums piepūšamajām laivām — izturība, UV pretestība un izmaksas.
    - title: Drop-Stitch Kodols izskaidrots
      desc: Kā tūkstošiem iekšējo diegu rada stingru platformu pie 12-15 PSI augstas veiktspējas piepūšamajām SUPs.
    - title: Piepūšamās tehnoloģijas pārskats
      desc: Kā tiek būvētas piepūšamās laivas un SUPs — no materiālu slāņošanas līdz vārstu sistēmām un šuvju metināšanai.
    - title: Cietā korpusa piepūšamā laiva (RIB) ceļvedis
      desc: Viss par RIB konstrukciju, korpusa tipiem, cauruļu materiāliem un pareizas RIB izvēli jūsu vajadzībām.
    - title: Piepūšamā laiva pret RIB
      desc: Galvenās atšķirības starp tradicionālajām piepūšamajām laivām un cietā korpusa piepūšamajām laivām dažādiem lietojumiem.
  water-safety:
    - title: Ūdens drošības ceļvedis
      desc: Svarīgas drošības zināšanas katram airētājam — laikapstākļi, PFDs, pašglābšanās un grupas airēšanas protokoli.
    - title: Glābšanas veste un PFD ceļvedis
      desc: Kā izvēlēties pareizo personisko plūstošo ierīci SUP, kajakošanai, laivošanai un profesionālai lietošanai.
    - title: SUP drošības kontrolsaraksts
      desc: Iepriekšējas drošības pārbaudes kontrolsaraksts, ko katram stenda airēšanas dēļa lietotājam jāievēro pirms došanās uz ūdeni.
    - title: Drošība airēšanai aukstā ūdenī
      desc: Svarīgākie piesardzības pasākumi, aprīkojums un tehnikas, lai airētu aukstā ūdens apstākļos.
    - title: Bieži pieļautas kļūdas iesācējiem airētājiem
      desc: Biežas kļūdas, ko pieļauj pirmo reizi airētāji, un kā no tām izvairīties drošākai un patīkamākai pieredzei.
    - title: CE Sertifikācijas skaidrojums
      desc: Ko CE sertifikācija nozīmē piepūšamām ūdens transporta līdzekļiem — standarti, testēšana un kāpēc tas ir svarīgi drošībai.
ui:
  read_guide: Izlasiet rokasgrāmatu →
  card_tech: Jūras drošības inženierija un materiālu testēšana
  card_products: Izpētiet pilnu Paddle Board Overstock produktu katalogu
  card_trust: CE, ISO un BSCI atbilstība
materials:
  intro_p1: Piepūšamu ūdens transporta līdzekļu veiktspēja, izturība un drošība gandrīz pilnībā ir atkarīga no izmantotajiem materiāliem. No auduma, kas veido caurules, līdz diegiem, kas piešķir SUP dēlim stingrību, katra materiālu izvēle ietekmē to, kā produkts darbojas uz ūdens un cik ilgi tas kalpo.
  intro_p2: 'Šajā ceļvedī aplūkoti četri galvenie materiāli, ko izmanto mūsdienu piepūšamos ūdens transporta līdzekļos: PVC audums, Hypalon CSM gumija, drop-stitch kodola konstrukcija un EVA putu klājums. Šo materiālu izpratne palīdzēs jums izvēlēties pareizo produktu savām vajadzībām un uzturēt to maksimālai kalpošanas ilgumam.'
  labels:
    advantages: Priekšrocības
    limitations: Ierobežojumi
    best_for: 'Vispiemērotākais priekš:'
  items:
    - name: PVC (polivinilhlorīds)
      summary: Nozares standarts atpūtas piepūšamām laivām un SUPs. Daudzslāņu laminēts audums piedāvā izcilu stipruma un svara attiecību pie pieejama cenu līmeņa.
      pros:
        - Pieejams — par 30–50% lētāks nekā Hypalon
        - Viegls un viegli manevrējams
        - Labs UV izturība ar pareizu pārklājumu
        - Plaša krāsu un apdaru izvēle
        - Viegls remonts ar PVC pleķiem un šķīdinātāju līmi
      cons:
        - Īsāks kalpošanas laiks nekā Hypalon (7–10 gadi)
        - Mazāk elastīgs aukstā temperatūrā
        - Zemāka ķīmiskā izturība
        - Laika gaitā var rasties plastifikatora migrācija
      best_for: Atpūtas SUPs, budžeta laivas, īres flotes, sezonāla lietošana, saldūdens un piekrastes apkārtne.
    - name: Hypalon (CSM gumija)
      summary: Premium sintētiska gumijas materiāls, kas pazīstams ar izcilu izturību, UV izturību un ilgmūžību. Zelta standarts komerciālām un militāras klases piepūšamām laivām.
      pros:
        - Izcila UV un ozona izturība
        - Dzīves ilgums 15–20 gadi ar pienācīgu aprūpi
        - Lieliska elastība aukstā laikā
        - Izcila ķīmisko vielu un eļļu izturība
        - Saglabā krāsu ilgāk nekā PVC
      cons:
        - Būtiski dārgāks nekā PVC
        - Smagāks auduma svars
        - Mazāk krāsu izvēles iespēju
        - Remonts prasa specializētas līmes
        - Mazāk ražošanas iespēju visā pasaulē
      best_for: Komerc RIBs, meklēšanas un glābšanas operācijas, militāras pielietojuma jomas, tropiskas klimata zonas, ilgtermiņa flotes īpašums.
    - name: Drop-Stitch Kodols
      summary: Tehnoloģija, kas revolucionēja piepūšamos SUPs. Tūkstošiem poliestera pavedienu savieno augšējo un apakšējo auduma slāni, ļaujot augsta spiediena piepūšanai, nodrošinot stingru, cietas struktūras sniegumu.
      pros:
        - Ļoti stingrs pie 12–20 PSI
        - Viegls — 18–30 lb pilna izmēra dēļiem
        - Salokāms glabāšanai un ceļošanai
        - Izcila triecienizturība
        - Stabilas darbības iespējas dažādos temperatūras diapazonos
      cons:
        - Prasa augsta spiediena sūkni
        - Caurumu remonts sarežģītāks nekā vienslāņa dēļiem
        - Augstākas ražošanas izmaksas nekā standarta piepūšamajiem
        - Laika gaitā spiediena zudums prasa periodisku papildināšanu
      best_for: Stāvam uz ūdens laivošanas dēļi, kajaki, piepūšamie laivu klājieni, jebkura lietojuma joma, kas prasa stingru sniegumu ar piepūšamību.
    - name: EVA Putu virsma
      summary: Slēgtu šūnu EVA (etilēna-vinilacetāta) putas, ko izmanto saķeres spilventiņiem SUP dēļiem un laivu klājiem. Nodrošina amortizāciju, saķeri un siltumizolāciju.
      pros:
        - Izcila neslīdēšanas saķere slapjā vai sausā vidē
        - Amortizācija samazina nogurumu garos airēšanas laikos
        - Siltumizolācija pret aukstu klāja virsmu
        - UV un izturīgas pret sālsūdeni
        - Pieejamas daudzkārt krāsotu bloku un lāzergravētas dizainos
      cons:
        - Var nodilst smagas lietošanas gadījumā 2–3 gadu laikā
        - Jābūt pareizi saistītam, lai novērstu delamināciju
        - Nav strukturāls — neietekmē stingrību
        - Pievieno nelielu svaru (200–400 g uz dēļa)
      best_for: SUP klāja saķere, laivas klāja polsterējums, kajaka sēdekļa komforts, jebkura virsma, kur nepieciešama neslīdoša staigāšana.
  selection:
    title: Materiālu izvēles ceļvedis
    subtitle: 'Izvēlieties pareizo materiālu, pamatojoties uz galveno lietošanas mērķi:'
    headers:
      - Lietošanas gadījums
      - Ieteicamais materiāls
      - Kāpēc
    rows:
      - - Rekreācijas SUP airēšana
        - Drop-stitch PVC
        - Viegls, stingrs, pieejams — ideāla līdzsvars ikdienas airētājiem
      - - Ģimenes laiva / ezeru laiva
        - PVC (1100 denjēri)
        - Izmaksu efektīvs, viegli labojams, pietiekama izturība rekreācijas lietošanai
      - - Komerc RIB / patrulējoša laiva
        - Hypalon CSM
        - Maksimāla UV izturība, 15–20 gadu kalpošanas laiks, ķīmiskā / eļļas izturība
      - - Nomājamās flotes SUP dēļi
        - Drop-stitch PVC + EVA klājs
        - Izturīgs, labojams, laba vērtība augsta apgrozījuma lietošanai
      - - Meklēšanas un glābšanas operācijas
        - Hypalon CSM
        - Uzticamība ekstremālos apstākļos, elastīgums aukstumā, ķīmiskā izturība
      - - Tūrisma / ekspedīciju kajaks
        - Drop-stitch PVC
        - Stingrs sniegums ar pārnēsājamu portabilitāti ceļošanai
  deep_dive:
    title: Padziļināti ceļveži
    topics:
      - title: Jūras Klases PVC
        desc: Vielu vairākslāņu laminēts PVC audums — izturība UV, berzes testēšana un denjēru vērtējumi.
      - title: PVC pret Hypalon
        desc: Divu dominējošo piepūšamo laivu materiālu galīgā salīdzināšana — izmaksas, kalpošanas laiks, izturība UV.
      - title: Drop-Stitch Kodols
        desc: Kā tūkstošiem iekšējo pavedienu rada stingras, augsta spiediena piepūšamās struktūras pie 12–15 PSI.
      - title: RF metināšanas tehnoloģija
        desc: Augstfrekvences metināšana rada stipras, vienmērīgas šuves — kā tas darbojas un kāpēc tas ir svarīgi.
      - title: PSI & Veiktspēja
        desc: Kāpēc gaisa spiediens ir svarīgs piepūšamajiem SUPs un laivām — stingrība, svara kapacitāte un braukšanas kvalitāte.
      - title: Kvalitātes testēšana
        desc: Spiediena testēšana, peldošības testi, UV novecošana un destruktīvie testi — mūsu kvalitātes process.
      - title: EVA Putu klāji
        desc: Slēgtās šūnu EVA putu klājlapiņas — saķere, komforts un izturība SUP un laivu klājiem.
      - title: Materiālu kopšana
        desc: Tīrīšana, UV aizsardzība, pelējuma novēršana un pareiza uzglabāšana piepūšamiem produktiem.
