hero:
  tagline: Partneri un izplatīšana
  title: Kļūsti par Paddle Board Overstock partneri<br />— Globālā izplatīšanas tīkla
  subtitle: Pievienojies Paddle Board Overstock globālajam partneru tīklam. Mēs sadarbojamies ar jūras izplatītājiem, laivu tirgotājiem, aprīkojuma mazumtirgotājiem un zīmola partneriem 50+ valstīs.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sales-office.webp
    alt: Paddle Board Overstock globālais partneru un izplatītāju tīkls
content_programs:
  tagline: Partneru programmas
  title: Partneru programmas<br />Izveidotas izaugsmei
  subtitle: Neatkarīgi no tā, vai jūs esat izplatītājs, tirgotājs vai zīmola partneris, Paddle Board Overstock piedāvā programmas, kas paredzētas jūsu uzņēmējdarbības atbalstam.
  columns: 3
  items:
    - title: Izplatītāja programma
      description: Ekskluzīva teritorijas izplatīšana ar apjoma cenām, mārketinga atbalstu un tiešu piekļuvi ražotnei. Nepieciešams minimālais saistību apjoms atkarībā no teritorijas lieluma.
      icon: tabler:world
    - title: Tirgotāja programma
      description: Tiešas tirgotāja cenas, produktu apmācība, mārketinga materiāli un garantijas atbalsts mazumtirdzniecības vietām un interneta veikaliem.
      icon: tabler:building-store
    - title: OEM/ODM partnerība
      description: Pilna servisa OEM un ODM ražošana ar pielāgotu zīmolu, iepakojumu un produkta specifikācijām. No koncepcijas līdz konteineram.
      icon: tabler:certificate
    - title: Zīmolu partnerība
      description: Kopzīmološana, privātās etiķetes un ekskluzīvas modeļu programmas jau izveidotiem zīmoliem jūras un āra atpūtas nozarē.
      icon: tabler:stars
    - title: Valdības un institucionālie klienti
      description: Ieteiktās piegādātāju programmas valsts aģentūrām, krasta apsardzei, militārajiem un humanitārajiem organizācijām. Dokumentācija gatava iepirkumiem.
      icon: tabler:building-community
    - title: Atpūtas un nomas partneris
      description: Flotes cenas, konsekventa kvalitāte un pielāgots zīmols kūrortiem, niršanas centriem un nomas uzņēmumiem visā pasaulē.
      icon: tabler:sun
content_benefits:
  tagline: Kāpēc sadarboties ar mums
  title: Kāpēc partneri izvēlas Paddle Board Overstock
  subtitle: Mūsu partneri gūst labumu no reālām ražošanas iespējām, konsekventas kvalitātes un atsaucīga atbalsta.
  list:
    - 'Tieša piekļuve ražotnei: strādājiet tieši ar mūsu ražošanas komandu — bez starpniekiem. Saņemiet ātrākas atbildes, labākas cenas un pilnīgu ražošanas pārredzamību.'
    - 'Pielāgošanas iespējas: zīmējiet savus produktus ar pielāgotām krāsām, logotipiem, iepakojumu un specifikācijām. Minimālie pasūtījumu apjomi pielāgoti jūsu tirgum.'
    - 'Kvalitātes garantija: ISO 9001 sertificēta ražošana ar CE, UKCA un BSCI atbilstību. Katrs produkts tiek testēts pirms nosūtīšanas.'
    - 'Globālā loģistika: piegāde no Qingdao, Ķīnas ar FOB, CIF un DDP opcijām. ASV noliktava Montclair, CA, Ziemeļamerikas izplatīšanai.'
    - 'Mārketinga atbalsts: produktu katalogi, fotogrāfija, tehniskā dokumentācija un digitālie materiāli, lai atbalstītu jūsu pārdošanas centienus.'
    - 'Apmācība un atbalsts: produktu apmācība jūsu pārdošanas komandai, tehniska palīdzība jūsu klientiem un garantijas servisa koordinācija.'
content_process:
  tagline: Kā kļūt par partneri
  title: Vienkāršs Partnerības Process
  subtitle: Mūsu partnerības process ir vienkāršs — izveidots, lai jūs ātri sāktu pārdot Paddle Board Overstock produktus.
  items:
    - title: '1. solis: Pieteikuma iesniegšana'
      description: Aizpildiet mūsu partnerības pieteikuma veidlapu ar jūsu uzņēmuma profilu, mērķa tirgu un produktu interesēm.
    - title: '2. solis: Kvalifikācijas pārbaude'
      description: Mūsu partnerības komanda pārskata jūsu pieteikumu un sazināsies ar jums 3 darba dienu laikā, lai apspriestu iespējas.
    - title: '3. solis: Līgums un iestatīšana'
      description: Parakstiet partnerības līgumu, izveidojiet savu kontu un saņemiet partneru cenas, mārketinga materiālus un produktu paraugus.
    - title: '4. solis: Apmācība un uzsākšana'
      description: Tiek nodrošināta produktu apmācība, pārdošanas atbalsts un mārketinga materiāli. Jūs esat gatavs sākt pārdot.
cta:
  title: Vai esat gatavs kļūt par Paddle Board Overstock partneri?
  subtitle: Pieteikties partnerībai, un mūsu komanda atbildēs 3 darba dienu laikā.
  actions:
    - variant: primary
      text: Pieteikties partnerībai
      href: /contact
    - text: Skatīt mūsu produktus
      href: /products
