features3_cases:
  tagline: Izcelti gadījumi
  title: Pielāgoti risinājumi<br />Īstiem izaicinājumiem
  isBeforeContent: false
  columns: 3
  items:
    - title: Bali niršanas centra ikdienas operāciju modernizācija
      customer: Zilā okeāna niršanas centrs
      country: Indonēzija
      industry: Komerciālais niršanas centrs
      challenge: Blue Ocean Diving Center Bali darbināja vecāku stiklašķiedras niršanas laivu ar ierobežotu klāja platību, sarežģītu nirēju iebraukšanu un augstu apkopi tropu sālsūdens apstākļos. Aprīkojuma iekraušana bija pārpildīta, sagatavošanās laiks ilgs, un nestabilā platforma radīja drošības bažas starptautiskajiem tūristiem — tostarp pirmreizējiem nirējiem un vecākiem ceļotājiem. Centrs organizē 3–5 niršanas braucienus dienā, 200+ dienas gadā.
      solution: Aquafarer piegādāja pielāgotu 6,8 m Professional Diving ar RIB paplašinātu klāja izkārtojumu, optimizētu niršanas aprīkojuma uzglabāšanai, platu nerūsējošā tērauda niršanas kāpni, izturīgas Hypalon caurules UV un sālsūdens izturību, neslīdošu klāja virsmu un tvertnes uzglabāšanas risinājumus. Konfigurācija tika izstrādāta atbilstoši niršanas centra ikdienas darba plūsmai — nevis balstīta uz standarta atpūtas laivas izkārtojumu.
      product: 6,8 m profesionālā lēkšana RIBūdenī
      results: Lielāka darba zona uzlaboja aprīkojuma sagatavošanas efektivitāti. Nirēji piedzīvoja drošāku un vieglāku iekāpšanu. Uzturēšanas prasības būtiski samazinājās. Centrs ieguva kapacitāti, lai ar lielāku pārliecību apkalpotu vairāk klientu sezonas laikā. Tas RIB kļuva par ikdienas niršanas operāciju pamatu.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Mūsu niršanas laiva nav tikai transports. Tā ir mūsu ikdienas darbības pamats.Aquafarer RIB Dod mūsu komandai lielāku pārliecību, veicot vairākus niršanas braucienus katru dienu.
      icon: tabler:lifebuoy
    - title: Phuket niršanas centra profesionālais RIB uzlabojums
      customer: Ocean Explorer niršanas centrs
      country: Taizeme
      industry: Komerciālais niršanas centrs
      challenge: Ocean Explorer niršanas centram Puketā, Taizemē, bija nepieciešams modernizēt tradicionālo stiklašķiedras niršanas laivu, kas nespēja apmierināt pieaugošo klientu pieprasījumu. Ierobežotā klāja vieta padarīja aprīkojuma sagatavošanu neefektīvu. Grūta iekāpšana radīja drošības izaicinājumus starptautiskajiem tūristiem. Augstas uzturēšanas prasības tropu sālsūdens apstākļos palielināja ekspluatācijas izmaksas. Centrs veic vairākus ikdienas braucienus, 200+ dienas gadā.
      solution: Aquafarer piegādāja pielāgotu 6,8 m komerciālo niršanu RIB ar optimizētu darba klāja izkārtojumu akvalanga tvertnes uzglabāšanai, aprīkojuma sagatavošanai un nirēju kustībai. Iezīmes ietvēra platu niršanas kāpņu ar nerūsējošā tērauda rokturiem, izturīgu cauruļu konstrukciju ar UVizturīgiem materiāliem, neslīdošu grīdu, tvertnes uzglabāšanas risinājumu, profesionālu konsoli un pasažieru sēdvietas — viss konfigurēts komerciālai niršanas operācijai.
      product: 6,8 m komerciālā niršana RIB
      results: Lielāka klāja platība ļāva ātrāk organizēt aprīkojumu un efektīvāk veikt ikdienas darba plūsmu. Klientu iekāpšanas komforts un drošība ievērojami uzlabojās. Apkopes dīkstāve samazinājās ar jūras līmeņa būvniecību. Niršanas centrs varēja apkalpot vairāk klientu sezonas laikā un ar pārliecību paplašināt profesionālos niršanas pakalpojumus.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Niršanas centram laiva nav tikai transports. Tā ir svarīga mūsu ikdienas darbības sastāvdaļa. TasAquafarer RIB dod mūsu komandai pārliecību katru dienu veikt vairākus niršanas braucienus ar labāku drošību un efektivitāti.
      icon: tabler:lifebuoy
    - title: Eiropas Niršanas centra flote
      customer: BlueMed niršanas centri
      country: Grieķija
      industry: Niršana un jūras tūrisms
      challenge: Bija nepieciešamas 12 niršanas konfigurācijas RIBs niršanas centru ķēdei vairākās Grieķijas salās. Katrai laivai bija nepieciešama pielāgota niršanas kāpnes, tvertnes 8 tvertnēm un stabila platforma atklātā ūdens nirēju ieiešanai. Flotei bija jāierodas 60 dienu laikā, lai sāktos tūrisma sezona.
      solution: Tika saražoti 12 RIB 520 niršanas modeļi ar integrētiem tanku plauktiem, niršanas kāpnēm un īpaši platām Hypalon caurulēm iekāpšanas stabilitātei. Katra laiva tika marķēta ar klientu flotes krāsojumu. Visas 12 laivas tika pārbaudītas spiediena testos un nosūtītas no Čingdao 55 dienu laikā.
      product: RIB 520 niršana
      results: Visas 12 laivas tika piegādātas laikā tūrisma sezonai. Flote darbojas ikdienā jau 18+ mēnešus bez nevienas materiālu kļūmes. Otrajā gadā klients pasūtīja vēl 6 vienības.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: RIB 520 Niršana ir bijusi mūsu ikdienas niršanas operāciju mugurkauls. Stabilitāte miera stāvoklī ir lieliska, un tvertnes uzglabāšanas izkārtojums uztur klāju tīru un drošu mūsu viesiem.
      icon: tabler:lifebuoy
    - title: Austrālijas izplatītāju OEM programma
      customer: Pacific Watersports Pty Ltd
      country: Austrālija
      industry: OEM/ODM Ražošana
      challenge: Austrālijas izplatītājam bija nepieciešams privātās etiķetes SUP plates klāsts par konkurētspējīgu cenu, lai konkurētu ar Ķīnas tiešās tirdzniecības zīmoliem. Bija nepieciešami 8 unikāli modeļi, kas aptver gan iesācējus, gan pieredzējušus modeļus, pielāgotu grafiku, pielāgotu iepakojumu un piegādes tiešraidi mazumtirdzniecības veikaliem.
      solution: Izstrādāti 8 SUP modeļi (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) ar ekskluzīvu Austrālijas grafikas paketi. Pielāgots mazumtirdzniecības iepakojums ar QR kodiem, kas savieno ar uzstādīšanas video. Piegādes loģistika konfigurēta no Qingdao tieši uz Austrālijas mazumtirdzniecības veikaliem.
      product: Custom SUP Line (8 modeļi)
      results: Koncepcija līdz pirmajai piegādei 90 dienu laikā. Mazumtirdzniecības pārdošanas rādītājs pirmajā sezonā 85%. Izplatītājs paplašināja partnerību, iekļaujot piepūšamo laivu līniju otrajā gadā.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Aquafarer Pilnu līniju piegādāja SUP 90 dienās — no sākotnējā dizaina līdz mazumtirdzniecības zālei. Kvalitāte atbilst zīmoliem, kas pārdod par divreiz lielāku cenu.
      icon: tabler:arrows-exchange
    - title: Tuvāko Austrumu glābšanas laivu piegāde
      customer: Nacionālā civilās aizsardzības pārvalde
      country: Apvienotie Arābu Emirāti
      industry: Meklēšana un glābšana
      challenge: Civilās aizsardzības organizācijai bija nepieciešami 20 patrulējoši kuģi RIBs piekrastes meklēšanai un glābšanai, ostas drošībai un plūdu reaģēšanai. Bija nepieciešami pašizsūknēšanas klāji, pilnas navigācijas iekārtas (GPS, radars, VHF), oranžas redzamības caurules un atbilstība vietējiem jūras noteikumiem.
      solution: Piegādāti 20 RIB 450 Patrol modeļi ar pašizsūknēšanas klājiem, Garmin navigācijas komplektiem, LED prožektoriem, SOLAS atstarojošu lenti un augstas redzamības oranžām Hypalon caurulēm. Katra laiva tika CEsertificēta un testēta atbilstoši ISO 6185 standartiem. Dokumentācijas komplektā bija atbilstības sertifikāti vietējai reģistrācijai.
      product: RIB 450. patruļa
      results: Flote izvietota piecās piekrastes stacijās. Laivas darbojas ekstremālā karstumā (45°C+) bez cauruļu degradācijas. Patrulēšanas rādiuss un degvielas efektivitāte pārsniedza specifikācijas par 12%.
      image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp
      quote: RIB 450. patruļa pārsniedza mūsu operacionālās prasības. Ekstremālos karstuma apstākļos Hypalon caurules UV pēc 24 mēnešiem ikdienas lietošanas nerāda bojājuma pazīmes.
      icon: tabler:alert-triangle
    - title: Eiropas OEM zīmolu partnerība
      customer: Ziemeļjūras jūras aprīkojums BV
      country: Nīderlande
      industry: OEM/ODM Ražošana
      challenge: Nostiprināts Eiropas jūras zīmols vēlējās paplašināties tirgū, RIB neieguldot ražošanas infrastruktūrā. Bija nepieciešams baltas etiķetes partneris, kas spētu ražot 5 RIB modeļus (3,9 līdz 6,2 miljoni) ar privāto zīmolu, CE sertifikāciju un ekskluzīvām izplatīšanas tiesībām ES.
      solution: Noslēgta baltās etiķetes ražošanas vienošanās 5 RIB modeļiem. Katram modelim ir klientu logotipi un krāsu shēma.CE Katram modelim sagatavota sertifikācijas dokumentācija. Piešķirtas ekskluzīvas ES izplatīšanas tiesības ar minimālām pasūtījuma saistībām. Tehniskā dokumentācija un rezerves daļu katalogs nodrošināts vietējam servisa tīklam.
      product: Custom RIB Line (5 modeļi)
      results: Parakstīts vairāku gadu līgums. Pirmais 50 vienību ražošanas apjoms nosūtīts 75 dienu laikā. Zīmols tika prezentēts METSTRADE ar pozitīvu dīleru atsaucību.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Sadarbība ar Aquafarer viņiem ļāva mums ienākt RIB tirgū, neuzbūvējot rūpnīcu — viņi nodrošināja pilnībā izstrādātu risinājumu ar CE sertifikāciju un dīleru atbalsta dokumentāciju.
      icon: tabler:building
    - title: Karību kūrorta flote
      customer: Paradise Island Resorts Ltd
      country: Bahamu salas
      industry: Jūras tūrisms un viesmīlība
      challenge: 'Luksusa kūrortam bija nepieciešams pilns ūdens sporta aprīkojuma parks viesu aktivitātēm: 40 SUP dēļi gida vadītām ekskursijām, 20 kajaki lagūnas izpētei, 10 piepūšamās laivas viesu pārvadāšanai un makšķerēšanas ekskursijām, kā arī aksesuāri. Visam aprīkojumam bija nepieciešams īpašs kūrorta zīmols, un tas bija jānogādā pirms tūrisma sezonas.'
      solution: 'Izstrādāts pilns ūdens sporta komplekts: 40 SUP Voyager dēļi (universāls modelis), 20 Explorer kajaki, 10 AirDeck 360 piepūšamās laivas, kā arī PFD, airi, sūkņi un remonta komplekti. Visa aprīkojuma druka ar kūrorta logotipu un tropisko krāsojumu. Konteineru sūtījums ar pilnu inventāra sarakstu.'
      product: Pilns ūdens sporta komplekts (70+ vienības)
      results: Flote ieradās 6 nedēļas pirms sezonas maksimuma. Viesu apmierinātības rādītāji ūdens sporta aktivitātēs gada griezumā pieauga par 40%. Aprīkojums kalpoja 3 sezonas ar tikai regulāru apkopi.
      image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
      quote: Pilnīgā paketes pieeja nozīmēja, ka mēs saņēmām visu nepieciešamo vienā sūtījumā — dēļus, kajakus, laivas un piederumus, kas visi bija zīmola un gatavi viesu lietošanai. Mūsu viesiem ļoti patīk aprīkojuma kvalitāte.
      icon: tabler:beach
    - title: Kvīnslendas komerciālā niršanas centra RIB modernizācija
      customer: Komerciālais niršanas centrs
      country: Austrālija
      industry: Komerciālā niršana un jūras pakalpojumi
      challenge: Kvīnslendā bāzēts komerciāls niršanas centrs, kas specializējās jūras infrastruktūras inspekcijā, ostas uzturēšanā un zemūdens remonta projektos, darbināja novecojušu darba laivu. Pieaugot projektu pieprasījumam, vecais kuģis kļuva par apgrūtinājumu — bieža apkope izraisīja grafiku traucējumus, izkārtojums nebija paredzēts mūsdienīgām niršanas operācijām (ierobežota vieta cilindriem, instrumentiem un aprīkojumam), un apkalpes komforts ilgstošas ekspluatācijas laikā bija zems. Uzņēmumam bija nepieciešams kuģis, kas varētu atbalstīt viņu profesionālo darbību katru darba dienu.
      solution: Aquafarer veica detalizētu klienta niršanas darba plūsmas operacionālo analīzi, tipisko projekta ilgumu, apkalpes lielumu un aprīkojuma prasības. Balstoties uz šo analīzi, Aquafarer tika piegādāts pielāgots profesionālis RIB ar funkcionālu klāja izkārtojumu, kas optimizēts aprīkojuma sagatavošanai un nirēju pārvietošanai, profesionālām sēdvietām ilgākiem transportēšanas periodiem, uzlabotu stabilitāti drošākai nirēju ieiešanai un iziešanai, kā arī niršanas atbalsta funkcijām, kas integrētas dizainā.
      product: Pielāgota profesionāla niršana RIB
      results: Jaunais kļuva RIB par uzticamu ikdienas darba platformu. Aprīkojuma sagatavošana kļuva ātrāka, pateicoties optimizētajam izkārtojumam. Apkalpe ziņoja par uzlabotu komfortu un drošību ilgstošu operāciju laikā. Kuģa profesionālais izskats stiprināja klientu uzticību, sadarbojoties ar ostas operatoriem un jūras līgumslēdzējiem. Niršanas centrs ieguva kuģi, kas atbilda viņu pakalpojuma profesionalitātei.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Mums bija nepieciešama laiva, kas katru dienu varētu atbalstīt mūsu biznesu, ne tikai transports. Aquafarer strādāja ar mums, lai saprastu mūsu operacionālās prasības, un piegādāja RIB risinājumu, kas atbilst mūsu komerciālās niršanas darba plūsmām.
      icon: tabler:lifebuoy
    - title: ASV piekrastes patruļas līgums
      customer: Atlantijas piekrastes drošības aģentūra
      country: Amerikas Savienotās Valstis
      industry: Jūras drošība un tiesībaizsardzība
      challenge: ASV piekrastes drošības aģentūra bija nepieciešamas smagās patruļas RIBs darbībām atklātajā ūdenī. Bija nepieciešama divu dzinēju konfigurācija dublēšanai, bruņots konsoles nodrošinājums apkalpes aizsardzībai, militārā specifikācijas elektronika (šifrēta sakaru sistēma, FLIR, radars) un atbilstība ASV Krasta apsardzes noteikumiem.
      solution: Inženierizēta RIB 600 Patruļa ar diviem 115 HP laivu ārborddzinējiem, bruņota konsole ar ballistisko aizsardzību, FLIR termālā attēlošana, šifrēti VHF/UHF sakari un integrēti ieroču stiprinājumi. Korpuss nostiprināts ātras ierašanās manevriem. Visa elektronika integrēta un pārbaudīta rūpnīcā. Sniedza USCG atbilstības dokumentāciju.
      product: RIB 600 Patruļa (divi dzinēji)
      results: Laivas sasniedza 52 mezglu maksimālo ātrumu pieņemšanas testos. Aģentūra ziņoja par 95% misijas gatavību pirmajos 12 mēnešos. Papildu pasūtījums veikts 8 vienībām.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Divu dzinēju RIB 600 nodrošina mūsu apkalpei ātrumu un dublēšanos, kas nepieciešama darbībām atklātajos ūdeņos. Bruņotā konsole sniedz būtisku aizsardzību, nekropļojot veiktspēju.
      icon: tabler:shield
