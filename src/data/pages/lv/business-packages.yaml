faq:
  title: Paketes Biežāk uzdotie jautājumi
  questions:
    - q: Kāds ir minimālais pasūtījuma daudzums paketēm?
      a: Kluba sākuma paketei ir minimālais daudzums 10 vienības. Kūrorta un zīmola paketes tiek pielāgotas jūsu vajadzībām ar elastīgu MOQs.
    - q: Cik ilgi ilgst piegāde?
      a: Standarta ražošana ir 30–45 dienas no pasūtījuma apstiprināšanas. Ātrāka ražošana ir pieejama par papildu maksu.
    - q: Vai es varu pielāgot aprīkojuma krāsas un zīmolu?
      a: Jā. Visas paketes ietver pilnu pielāgošanu — dēļu krāsas, logotipu druku un iepakojuma dizainu.
    - q: Vai jūs nodrošināt pēc-pārdošanas atbalstu?
      a: Jā. Katru paketi papildina piekļuve mūsu tiešsaistes uzturēšanas ceļvežiem, video pamācībām un rezerves daļu pasūtīšanas sistēmai.
