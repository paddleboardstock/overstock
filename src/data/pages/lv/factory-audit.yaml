hero:
  tagline: Fabrikas audits un pierādījumi
  title: Rūpnīcas audita sagatavošana<br />& Kvalitatīvi pierādījumi
  subtitle: Viss, ko B2B pircēji pārbauda rūpnīcas apmeklējuma laikā — no ražošanas autentiskuma un atbilstības dokumentācijas līdz ražošanas izsekojamībai un kvalitātes kontroles sistēmām. Gatavs revīzijai katru dienu.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock rūpnīcas audita sagatavošana un kvalitātes pierādījumi
direct_answer: Paddle Board Overstock uztur 12 000 m² lielu Qingdao rūpnīcu, kas ir gatava auditam, ar dokumentētiem QC procesiem, materiālu izsekojamību, HIN līmeņa ražošanas ierakstiem un atbilstības dokumentāciju katram korpusam. Vietējās un virtuālās rūpnīcas apskates iespējas ir pieejamas kvalificētiem pircējiem.
stats:
  - value: 12,000 m²
    label: ISO 9001 Iekārta
    detail: Qingdao ražošanas campus
  - value: 6
    label: Ražošanas līnijas
    detail: Dedicatētas RIB, SIB, SUP līnijas
  - value: 100%
    label: Spiediena pārbaudi izturējis
    detail: Katru vienību, 1,25x / 24-48h
  - value: HIN
    label: Pārredzamība katrā korpusā
    detail: Pilni partijas līdz piegādes ieraksti
content_priorities:
  tagline: Ko klienti pārbauda
  title: 8 lietas, ko pircēji pārbauda<br />katrā rūpnīcas apmeklējumā
  subtitle: Balstoties uz atsauksmēm no 50+ valstu pircējiem, šie ir astoņi prioritārie aspekti, ko klienti vērtē pirms B2B pasūtījuma veikšanas.
  items:
    - title: Īsts ražotājs
      description: 'Vai jūs esat īsta rūpnīca, nevis tirdzniecības uzņēmums? Pircēji pārbauda: uzņēmuma statusu, reālu ražošanas aprīkojumu, darbiniekus, kas darbojas ar iekārtām, pašreizējos ražošanas pasūtījumus uz grīdas, un tīmekļa vietnes un darbnīcas atbilstību.'
      icon: tabler:building-factory
    - title: Produkta piemērotība lietojumam
      description: Vai RIB atbilst viņu konkrētajam lietošanas gadījumam? Atpūtas, glābšanas, niršanas, makšķerēšanas un patrulēšanas operatoriem ir būtiski atšķirīgas prasības. Pircēji vērtē klāja izkārtojumu, cauruļu materiālu un aprīkojuma iespējas uz demonstrētās laivas.
      icon: tabler:target
    - title: Kvalitātes stabilitāte un reproducējamība
      description: Vai 50. vienība ir tikpat laba kā 1. vienība? Pircēji izpēta kvalitātes kontroles sistēmas, pārbaudes punktus ražošanas procesā, neatbilstību apstrādi un lūdz redzēt ierakstus no vairākām ražošanas partijām, lai pārbaudītu konsekvenci.
      icon: tabler:repeat
    - title: Atbilstības dokumenta autentiskums
      description: Vai CE sertifikāti ir specifiski konkrētam modelim? Vai DoC ir parakstījusi īsta persona? Vai atbilstība var tikt verificēta pēc korpusa numura? Pircēji pārbauda vispārējos apgalvojumus pret specifisku dokumentāciju attiecībā uz modeli.
      icon: tabler:file-certificate
    - title: Pielāgošanas izpilde
      description: Vai rūpnīca patiešām spēj piegādāt pielāgotas konfigurācijas? Pircēji meklē pierādījumus par iepriekšējiem pielāgotiem projektiem, prototipu paraugus izstādē, inženierijas rasējumus un spēju uz vietas apspriest tehniskās izmaiņas.
      icon: tabler:adjustments
    - title: Izpildes laiks un jauda
      description: 'Vai norādītie termiņi ir reālistiski? Pircēji novērtē: pašreizējo ražošanas apjomu, pieejamo jaudu, darbaspēka apjomu, materiālu krājumu līmeni un to, vai rūpnīcā ir ražošanas plānošanas sistēma.'
      icon: tabler:clock
    - title: Cena un tirdzniecības noteikumi
      description: 'Vai cenas ir caurspīdīgas? Vai cenas ir FOB skaidras? Pircēji pārbauda: vienības cenu sadalījumu, instrumentu izmaksas, iepakojuma izmaksas un vai rūpnīca spēj apstrādāt DDP vai CIF apstrādāt nosacījumus ar atbilstošu eksporta dokumentāciju.'
      icon: tabler:currency-dollar
    - title: Pēcpārdošana un rezerves daļas
      description: 'Kas notiek pēc piegādes? Pircēji izvērtē: rezerves daļu pieejamību, garantijas procesu, cauruļu nomaiņas sekcijas, vārstu nomaiņu un vai rūpnīcai ir dokumentēta pēcpārdošanas procedūra.'
      icon: tabler:headset
content_tour:
  tagline: Rūpnīcas ekskursijas maršruts
  title: Audita tūre —<br />Ko jūs redzēsiet
  subtitle: Mūsu standarta rūpnīcas ekskursija seko noteiktam maršrutam, kas paredzēts, lai atbildētu uz pircēju jautājumiem katrā stacijā.
  items:
    - title: 1. Sapulču telpa — Uzņēmuma ievads
      description: Uzņēmuma licence, ISO 9001 un BSCI sertifikāti, eksporta licences un uzņēmuma vēsture. Īss pārskats par ražošanas iespējām un atbilstības apjomu.
      icon: tabler:users
    - title: 2. Izejvielu noliktava — IQC stacija
      description: Ienākošo materiālu inspekcijas ieraksti, auduma partiju sertifikāti, līmes un aparatūras paraugi. Pārbaudiet, kā materiāli tiek testēti pirms ražošanas uzsākšanas.
      icon: tabler:building-warehouse
    - title: 3. Cauruļu izgatavošana — RF metināšana un roku līmēšana
      description: Dzīvo cauruļu metināšanas vai līmēšanas process, šuves stiprības testu demonstrācijas un vārstu uzstādīšana. Novērojiet kameru pa kamerai būvniecību un kvalitātes kontrolpunktus.
      icon: tabler:flame
    - title: 4. Korpusa laminēšana — GRP darbnīca
      description: Stiklašķiedras uzklāšanas process, gelcoat uzklāšana un korpusa sacietēšana. Skatiet laminēšanas grafiku un konstrukciju pastiprināšanu dažādiem RIB modeļiem.
      icon: tabler:layers-subtract
    - title: 5. Montāža un integrācija
      description: Korpusa cauruļu savienošana, konsoles un sēdekļu uzstādīšana, elektrisko un degvielas sistēmu integrācija, kā arī aprīkojuma uzstādīšana. Novērojiet ražošanas līniju darbībā.
      icon: tabler:tool
    - title: 6. Spiediena testēšanas stacija
      description: 24-48 stundu spiediena turēšanas tests pie nominālā spiediena 1,25x. Skatiet testa ierakstus, spiediena mērītājus un nokārtošanas/neizturēšanas kritērijus. Skatiet, kā testa rezultāti ir saistīti ar korpusa sērijas numuriem.
      icon: tabler:gauge
    - title: 7. Galīgā pārbaude un kvalitātes kontrole
      description: 100 punktu kvalitātes kontrolsaraksts uz vienību, izmēru pārbaude, kosmētiskā pārbaude un iepakojuma integritātes pārbaude. Pārskatiet neatbilstības žurnālus un korektīvo darbību ierakstus.
      icon: tabler:clipboard-check
    - title: 8. Dokumentu pārskatīšanas telpa
      description: Atbilstības dokumentācija katram modelim (DoC, ražotāja plāksne, lietotāja rokasgrāmata), ražošanas izsekojamības ieraksti, HIN reģistrs un materiālu partijas izsekošanas datubāzes demonstrācija.
      icon: tabler:folder
content_qc_chain:
  tagline: Kvalitātes pierādījumi
  title: 8 posmu QC ķēde<br />— Pārbaudāms katrā solī
  subtitle: Mūsu kvalitātes kontroles ķēde aptver no ienākošajiem materiāliem līdz galīgajai piegādei, ar dokumentētiem pierādījumiem katrā posmā.
  items:
    - title: '1. posms: Ienākošo materiālu pārbaude'
      description: Katra PVC, Hypalon, stiklašķiedras, alumīnija, līmju un aparatūras partija tiek testēta atbilstoši specifikācijām pirms ražošanas uzsākšanas. Stiepes izturība, pārklājuma saķere un izmēru pārbaudes uz AQL 2,5/ISO2859.
      icon: tabler:package
    - title: '2. posms: Cauruļu metināšana / līmēšanas kvalitātes kontrole'
      description: Šuves lobīšanās izturības testi katrai ražošanas partijai. RF metinājuma parametri tiek uzraudzīti un reģistrēti. Ar rokām līmētas šuves pārbaudītas vienmērīgas līmes pārklājuma un sacietēšanas laika.
      icon: tabler:flame
    - title: '3. posms: Korpusa laminācijas kvalitātes kontrole'
      description: Gelcoat biezuma mērīšana, stiklašķiedras pārklājuma pārbaude pēc lamināta grafika un sacietēšanas laika uzraudzība. Strukturālo pastiprinājumu pozīcijas pārbaudītas pret inženiertehniskajiem rasējumiem.
      icon: tabler:layers-subtract
    - title: '4. posms: Montāžas un integrācijas kvalitātes kontrole'
      description: Korpusa cauruļu savienojuma integritāte, konsoles un sēdekļa stiprinājuma griezes moments, elektriskā nepārtrauktība un degvielas sistēmas noplūdes tests. Katrs uzstādīšanas punkts tika pārbaudīts atbilstoši modeļa specifiskajam montāžas kontrolsarakstam.
      icon: tabler:tool
    - title: '5. posms: Spiediena turēšanas tests'
      description: Katra piepūšamā kamera ir spiediena ziņā 1,25x, PSI novērtēta un turēta 24-48 stundas. Spiediens kritums reģistrēts katrā kamerā. Izturēšanas/neizturēšanas slieksnis dokumentēts. Saistīts ar korpusa sērijas numuru.
      icon: tabler:gauge
    - title: '6. posms: Galīgā pārbaude'
      description: 100 punktu kvalitātes kontrolsaraksts, kas aptver izmēru precizitāti, kosmētisko apdari, piederumu pilnību, dokumentācijas paketi un iepakojuma integritāti. Neatkarīgs no ražošanas komandas.
      icon: tabler:clipboard-check
    - title: '7. posms: Atbilstības dokumentācija'
      description: Modelim specifisks DoC, ražotāja numura zīmju pārbaude, lietotāja rokasgrāmatas pilnīgums un HIN reģistra ievade. Visi atbilstības dokumenti sagatavoti un pārbaudīti pirms nosūtīšanas izlaišanas.
      icon: tabler:file-certificate
    - title: '8. posms: Piegādes atbrīvošana un izsekojamība'
      description: Galīgais atbrīvojums prasa iziet visus kvalitātes kontroles posmus, pabeigt atbilstības dokumentāciju un apstiprināt nosūtīšanas dokumentāciju. Korpusa ieraksts slēgts un arhivēts uz 10+ gadiem.
      icon: tabler:truck
content_traceability:
  tagline: Ražošanas izsekojamība
  title: HIN → galvenais fails →<br />Korpusa rekorda → piegāde
  subtitle: Katrai RIB laivai ir unikāls korpusa identifikācijas numurs, kas saistīts ar pilnu ražošanas un atbilstības uzskaites ķēdi.
  items:
    - title: Korpusa identifikācijas numurs (HIN)
      description: 14 rakstzīmju unikāls identifikators, kas pastāvīgi atzīmēts katrā laivā. Kodē ražotāja kodu (MIC), modeļa apzīmējumu, ražošanas gadu un sērijas numuru. Atslēga, kas atslēdz pilnu izsekojamības ķēdi.
      icon: tabler:hash
    - title: Galvenais tehniskais fails
      description: Atbilstības un inženiertehniskā dokumentācija modeļu saimei. Satur vispārējās aviācijas rasējumus, riska novērtējumu, stabilitātes aprēķinus, materiālu specifikācijas un piemērojamos standartus. Saistīts ar visiem šī modeļa korpusiem.
      icon: tabler:folder
    - title: Individuālais korpusa rekords
      description: 'Ražošanas ieraksts uz korpusu: HIN, ražošanas datums, cauruļu partija, materiālu sertifikāti, spiediena testa rezultāts, galīgā konfigurācija, dzinēja specifikācija, kvalitātes kontrolsaraksta rezultāti un piegādes galamērķis. 21+ datu lauks uz korpusa.'
      icon: tabler:file-description
    - title: Klientu atbilstības pakete
      description: Katram korpusa piegādes komplektam, ieskaitot DoC, ražotāja plāksnes foto, lietotāja rokasgrāmatu, atbilstības kontrolsarakstu un galīgo konfigurācijas lapu. Nosūtīts kopā ar laivu un arhivēts rūpnīcā 10+ gadus.
      icon: tabler:package
content_red_flags:
  tagline: Audita kļūdas
  title: Sarkanie karogi pircēji<br />Viegli pamanāms
  subtitle: Bieži sastopamas problēmas, kas rūpnīcu auditu laikā grauj pircēju uzticību. Mēs proaktīvi risinām katru no tām.
  items:
    - title: Vispārīgi CE apgalvojumi bez modeļa darbības jomas
      description: '"Visi produkti CE sertificēti", nenorādot, kura direktīva, kuri modeļi un kurš atbilstības modulis. Sarkanais karogs: norāda, ka atbilstība ir virspusēja, nevis katra modeļa vai konfigurācijas līmenī.'
      icon: tabler:alert-triangle
    - title: Nav fizisku testu pierādījumu
      description: 'Spiediena testu apgalvojumi bez testa ierakstiem, mērinstrumentiem vai testēšanas stacijas, kas redzamas rūpnīcas grīdā. Brīdinājuma signāls: kvalitātes apgalvojumus vizītes laikā pārbaudīt nevar.'
      icon: tabler:alert-triangle
    - title: Pazudušo materiālu izsekojamība
      description: 'Nav partiju ierakstu, nav ienākošas inspekcijas vai nav saiknes starp materiālu sertifikātiem un gataviem produktiem. Sarkanais karogs: nav iespējams izsekot kvalitātes problēmas līdz avotam.'
      icon: tabler:alert-triangle
    - title: Vispārīgā dokumentācija
      description: 'Viens DoC, kas aptver visus modeļus, nav HIN specifisku ierakstu vai "veidnes" atbilstības dokumentu. Sarkanais karogs: atbilstība nav saistīta ar atsevišķām ražošanas vienībām.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Piegāde un iepakošana
  title: RIB Laivas konteiners<br />Iekraušana un iepakošana
  subtitle: Mūsu piegādes risinājumi aizsargā jūsu ieguldījumu no Čingdao līdz galamērķa ostai. Konteineru iekraušanas plāni un kastes specifikācijas pieejamas katram modelim.
  items:
    - title: 20 pēdu konteineru konfigurācijas
      description: 'Standarta 20 pēdu konteiners: 1-2 RIB laivas (4,0-5,5 m), kas ievietotas ar atdalītu klāju un caurulēm, vai 8-12 SUP dēļi. RIB + SUP Pieejamas dažādas konfigurācijas. Detalizēts iekraušanas plāns sniegts katram pasūtījumam.'
      icon: tabler:box
    - title: 40 pēdu konteineru konfigurācijas
      description: 'Standarta 40 pēdu konteiners: 2-4 RIB laivas (līdz 7,0 m) ar korpusiem ligzdojošiem un caurulēm sakrautām, vai 20-30 SUP dēļi. 40 pēdu štābs pieejams augstākiem RIB modeļiem. Tilpuma optimizēta iepakošana samazina vienības piegādes izmaksas.'
      icon: tabler:container
    - title: Koka kaste RIB korpusiem
      description: Alumīnija un GRP korpusi iepakoti pielāgotās koka kastēs ar putu polsterējumu, mitruma barjeru un tērauda joslām. Kastes izmēri un svars uz modeli pieejami loģistikas plānošanai. ISPM-15 ir iekļauta termiski apstrādātas koksnes sertifikācija.
      icon: tabler:wood
    - title: Cauruļu un klāja atdalīšanas iepakošana
      description: Caurules tika izlaistas un salocītas atsevišķi no korpusa, lai nodrošinātu telpas efektivitāti. Klāja plāksnes, konsoles un sēdekļi iepakoti aizsargapvalkā ar stiprinājuma aparatūras komplektiem. Komplekta instrukcijas bija iekļautas katrā sūtījumā.
      icon: tabler:package
    - title: Mitruma un korozijas aizsardzība
      description: VCI pretkorozijas papīrs alumīnija komponentēm, silīcija gela desikantu iepakojumiem un vakuumā noslēgtām metāla maisiņiem. Novērš kondensāta bojājumus 30–45 dienu okeāna pārvietošanās laikā.
      icon: tabler:droplet-off
    - title: FOB Qingdao dokumentācija
      description: Kravas pavadzīme, komerciālais rēķins, iepakojuma saraksts, izcelsmes apliecība un atbilstības dokumentācija katram sūtījumam. Pieejama FCL un LCL konsolidācija. Muitas dokumentācijas atbalsts ES, ASV un Tuvo Austrumu tirgiem.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Verifikācijas pierādījumi
  title: Revīzijas pierādījumi<br />To var pārbaudīt uz vietas
  subtitle: Rūpnīcu apmeklējumu laikā klienti var pārbaudīt konkrētus pierādījumus katrā ražošanas zonā. Šeit ir, kam jāpievērš uzmanība — un ko mēs sagatavojam katram auditam.
  areas:
    - area: Izejvielu noliktava
      what_to_verify: Vai materiāli ir stabilizēti? Vai notiek partiju sajaukšana?
      evidence: Ienākošās pārbaudes reģistri, partiju etiķetes, FIFO uzglabāšana, piegādātāju apstiprinājumu saraksts, materiālu sertifikāti (PVC, Hypalon, stikla šķiedra, alumīnijs, līmes, aparatūra)
      icon: tabler:building-warehouse
    - area: Caurules ražošana
      what_to_verify: Kā tiek garantēta šuve un gaisa necaurlaidība?
      evidence: Procesa kartes, pirmās vienības apstiprinājums, spiediena testa reģistri pa kamerām, remontu un atkārtotu testu žurnāli, vārstu uzstādīšanas reģistri
      icon: tabler:flame
    - area: Korpusa ražošana
      what_to_verify: Kā tiek kontrolēta struktūras konsekvence?
      evidence: Kontrolētie procesa dokumenti, kvalitātes pārbaudes punkti, pusfabrikātu numerācija, gelcoat biezuma mērījumi, laminēšanas grafika pārbaude
      icon: tabler:layers-subtract
    - area: Montāžas zona
      what_to_verify: Kā tiek novērsta izvēles daļu nepareiza montāža?
      evidence: BOM, darba rīkojumi, konfigurācijas kontrolsaraksti, darba vietas pārbaudes kartes, griezes momenta un funkcionālās pārbaudes katram modelim
      icon: tabler:tool
    - area: Testēšanas stacija
      what_to_verify: Kā tiek pārbaudīts, vai laiva ir labā stāvoklī pirms piegādes?
      evidence: Testēšanas procedūras, instrumentu saraksts, kalibrēšanas reģistri, spiediena testa žurnāli (1,25x / 24-48h), funkcionālo testu kontrolsaraksti, dokumentēti caurlaides/necaurlaides kritēriji
      icon: tabler:gauge
    - area: Nepareizību zona
      what_to_verify: Kā tiek apstrādāti defekti?
      evidence: Izolācijas etiķetes, NCR žurnāli, saknes cēloņu analīze, pārstrādes apstiprināšanas reģistri, CAPA (korektīvās un preventīvās darbības) izsekošana
      icon: tabler:alert-triangle
    - area: Gatavo izstrādājumu noliktava
      what_to_verify: Kā tiek novērsta nepareiza sūtīšana un bojājumi?
      evidence: Gatavo izstrādājumu etiķetes, pasūtījumu salīdzināšanas reģistri, iepakojuma standarti, pirms sūtīšanas pārbaudes reģistri
      icon: tabler:box
    - area: Rezerves daļas un pēcpārdošanas serviss
      what_to_verify: Vai varat atbalstīt ilgtermiņa pēcpārdošanu?
      evidence: Bieži lietoto rezerves daļu saraksts, inventāra stratēģija, daļu numerācijas sistēma, garantijas procesa dokumentācija, uzturēšanas apmācības
      icon: tabler:headset
content_closing_script:
  tagline: Audits pēc pasūtījuma
  title: No rūpnīcas vizītes<br />līdz apstiprinātajam projektam
  subtitle: Veiksmīgs audits neriskē beigties tikai ar foto un roku spiedienu. Pirms aiziešanas tiek nodrošināts, ka dokumentēti trīs komerciāli rezultāti.
  items:
    - title: Apstiprināt tehnisko konfigurāciju
      description: Vienoties par modeli, pielietojumu, galvenajām iespējām, mērķtirgu, aplēsto daudzumu un piegādes grafiku — viss dokumentēts pirms došanās prom.
      icon: tabler:checklist
    - title: Apstiprināt nākamā soļa dokumentus
      description: 'Definējiet, kas Paddle Board Overstock ir nākamais: pārskatīts GA, konfigurācijas saraksts, piedāvājums, dokumenta kontrolsaraksts, paraugplāns vai NDA — ar konkrētiem termiņiem.'
      icon: tabler:file-plus
    - title: Apstiprināt savstarpējo laika grafiku
      description: Pārskatīta konfigurācija un sākotnējais piedāvājums 3 darba dienu laikā. Parauga vai izskata apstiprinājums 7 dienu laikā. Inženiertehniskā pārbaude vai trešās puses pārbaude 14 dienu laikā. Nākamās sanāksmes datums un atbildīgās puses bloķētas.
      icon: tabler:calendar
faq:
  title: Rūpnīcas audits — biežāk uzdotie jautājumi
  questions:
    - q: Vai es varu apmeklēt rūpnīcu personīgi?
      a: Jā. Mēs laipni gaidām rūpnīcas auditus mūsu 12 000 m² lielajā Čingdao objektā. Mūsu standarta ekskursija aptver 8 stacijas no izejvielu noliktavas līdz dokumentu pārskatīšanas telpai. Sākotnējai kvalifikācijai ir pieejamas arī virtuālas rūpnīcas ekskursijas videozvana formātā.
    - q: Vai jūs pieņemat trešo pušu auditus (BSCI, SMETA)? SGS
      a: Jā. Mēs uzturam BSCI sertifikāciju (Intertek) un atbalstām klientam specifiskus audita protokolus. Mēs varam arī organizēt SGS TÜV inspekcijas pēc pieprasījuma. Revīzijas ziņojumi ir pieejami NDAsadaļā .
    - q: Vai vizītes laikā varu redzēt spiediena testus?
      a: Mūsu spiediena testēšanas stacija ir daļa no standarta ekskursijas maršruta. Atkarībā no ražošanas grafika jūs varat novērot aktīvos spiediena testus ar mērītāju rādījumiem un testu ierakstiem. Spiediena testu žurnāli katram korpusam vienmēr ir pieejami pārskatīšanai.
    - q: Kā jūs rīkojaties ar neatbilstošiem produktiem?
      a: Neatbilstošās vienības tiek atdalītas, dokumentētas un pārskatītas saskaņā ar mūsu ISO 9001 korektīvo rīcību procesu. Tiek veikta pamatcēloņu analīze, tiek īstenotas korektīvās darbības un uzturēti ieraksti. Pircēji var pārskatīt mūsu NCR žurnālu audita laikā.
    - q: Kāda atbilstības dokumentācija ir pieejama pārskatīšanai?
      a: 'Audita laikā jūs varat pārskatīt: modeļa specifiskos DoC paraugus, ražotāja plākšņu specifikācijas, HIN reģistru, īpašnieka rokasgrāmatas melnrakstus, piemērojamos standartu sarakstus un atbilstības novērtējuma ierakstus katrai modeļu saimei.'
    - q: Kā rezervēt virtuālu rūpnīcas ekskursiju?
      a: Sazinieties ar mūsu pārdošanas komandu, lai ieplānotu tiešraides video ekskursiju, izmantojot WhatsApp, Zoom vai Teams. Mēs sekojam vienam un tam pašam 8 staciju maršrutam un varam koncentrēties uz konkrētām vietām atbilstoši jūsu interesēm. Tipiska virtuālā ekskursija ilgst 45–60 minūtes.
    - q: Vai rūpnīca ir īstais ražotājs vai tirdzniecības uzņēmums?
      a: Paddle Board Overstock ir īstais ražotājs. Mēs darbinām rūpnīcu Laixi, Qingdao. Uzņēmuma licence, ražošanas apjoms un fiziskā ražošana ir pārbaudāmi audita laikā.
    - q: Kādus kvalitatīvus ierakstus es varu pārskatīt?
      a: Ienākošo materiālu inspekciju ieraksti, procesa kvalitātes kontroles kontrolpunkti, spiediena testu žurnāli, 100 punktu galīgās pārbaudes kontrolsaraksti, neatbilstības ziņojumi, korektīvo darbību ieraksti un katra korpusa izsekojamības ieraksti. Visi tiek uzturēti saskaņā ar ISO 9001 prasībām.
