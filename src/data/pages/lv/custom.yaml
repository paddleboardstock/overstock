hero:
  tagline: Paddle Board Overstock Pielāgotā laboratorija
  title: Izveido savu<br />Ūdenslīdēju
  subtitle: OEM, ODM, privātā etiķete un pielāgotas zīmola pakalpojumi uzņēmumiem visā pasaulē. No viena prototipa līdz pilnai ražošanai.
  cta: Sāciet savu projektu
  footer_link: /contact
steps_section:
  tagline: Kā tas darbojas
  title: No koncepcijas līdz ražošanai
  subtitle: Četri soļi no jūsu idejas līdz gatavam, uz jūru gatavam produktam.
  steps:
    - num: '01'
      title: Izvēlieties savu dēli
      desc: Izvēlieties no mūsu pamatmodeļiem — SUP, kajaks, laiviņa vai RIB. Izvēlieties izmēru, materiālu un krāsu.
    - num: '02'
      title: Augšupielādējiet savu dizainu
      desc: Nosūtiet mums savu logotipu, mākslas darbu vai zīmola vadlīnijas. Mūsu dizaina komanda sagatavo digitālu paraugu.
    - num: '03'
      title: AI maketa pārskats
      desc: Apskatiet fotoreālistisku AI radītu jūsu pielāgotās dēļa maketu pirms ražošanas sākuma.
    - num: '04'
      title: Ražošana un piegāde
      desc: Pēc apstiprināšanas jūsu pasūtījums tiek nodots mūsu ISO sertificētajā ražošanas līnijā. Piegādes laiki no 30 dienām.
services_section:
  tagline: Pakalpojumi
  title: Ražošanas pakalpojumi globālajiem zīmoliem
  subtitle: Elastīgi sadarbības modeļi — no līgumražošanas līdz pilnām zīmola veidošanas pakalpojumiem.
  items:
    - title: OEM ražošana
      desc: Mēs ražojam jūsu dizainus pēc specifikācijas — jūsu IP, jūsu zīmējumi, jūsu kvalitātes standarti. Pilna NDA aizsardzība.
      icon: ⚙️
    - title: ODM risinājumi
      desc: Izvēlieties no 50+ uzticamiem modeļiem un pielāgojiet izmēru, krāsu, grafiku un iepakojumu.
      icon: 🎨
    - title: Privātais zīmols
      desc: Jūsu zīmols mūsu produktos — logotips, iepakojums, karodziņi, rokasgrāmatas. Gatavs tirdzniecībai tieši no kastes.
      icon: 🏷️
    - title: Pielāgota zīmola veidošana
      desc: Virsmas spilventiņa druka, korpusa grafika, cauruļu uzlīmes un pielāgotas etiķetes — pilnīga zīmola integrācija.
      icon: ✨
capabilities_section:
  tagline: Spējas
  title: Ražošanas un pielāgošanas iespējas
  subtitle: Viss, kas jums jāzina pirms pasūtījuma veikšanas.
  capabilities:
    - label: Pasūtījuma apjoms
      value: MOQ 5–10 vienības (SUP/kajaks), 2–5 vienības (RIB)
    - label: Izpildes laiks
      value: 30–45 dienas standarta; 15–20 dienas prototipiem
    - label: Pielāgošana
      value: Izmērs, forma, krāsa, grafika, iepakojums, aparatūra
    - label: Materiāli
      value: PVC, Hypalon, drop-stitch, stikla šķiedra, alumīnijs
    - label: Drukāšana
      value: Digitālā (CMYK), sietspiede, karstās pārsūtīšanas, sublimācija
    - label: Sertifikācija
      value: CE, ISO 9001, BSCI, UKCA (atbalsts starptautiskajai atbilstībai)
why_section:
  tagline: Kāpēc Paddle Board Overstock
  title: Viena rūpnīca. Viens standarts. Nulles kompromisi.
  points:
    - text: 12 000 m² integrēta ražošanas noliktava
      highlight: 12 000 m²
    - text: 200–300 kvalificētu strādnieku un inženieru
      highlight: 200-300
    - text: 15 000 laivu gadā
      highlight: 15,000
    - text: ISO 9001 sertificēta kvalitātes vadība
      highlight: ISO 9001
    - text: CE sertificēti produkti ES tirgum
      highlight: CE
  cta: Skatīt rūpnīcas detaļas
  cta_link: /factory
  contact:
    title: Gatavs apspriest savu projektu?
    desc: Mūsu komanda atbild 24 stundu laikā ar priekšlikuma cenu.
