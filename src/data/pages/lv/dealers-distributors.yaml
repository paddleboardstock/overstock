hero:
  tagline: Dīleru programma
  title: Kļūsti par Paddle Board Overstock<br />Izplatītājs
  subtitle: Sadarbojieties ar CE sertificētu RIB un piepūšamo ūdens transportlīdzekļu ražotāju, kas darbojas 50+ valstīs. Teritorijas aizsardzība, mārketinga atbalsts un konkurētspējīgas cenas jau esošiem jūras produktu izplatītājiem.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock dīleru un izplatītāju programma
direct_answer: Paddle Board Overstock piedāvā dīlera un izplatīšanas sadarbības iespējas ar teritorijas aizsardzību, konkurētspējīgām vairumtirdzniecības cenām, mārketinga atbalsta komplektiem un pilnu atbilstības dokumentāciju (CE, ISO 9001, BSCI). MOQ sākas no 10-20 vienībām pasūtījumā ar īpašu konta pārvaldību.
stats:
  - value: 50+
    label: Apkalpotās valstis
    detail: Globālā izplatīšanas tīkla
  - value: 64
    label: CE-sertificētie modeļi
    detail: RIB, piepūšams, SUP, drošība
  - value: 30-45
    label: Dienu piegādes laiks
    detail: FOB Ķīngdao
  - value: 10-20
    label: Izplatītājs MOQ
    detail: Pēc pasūtījuma, jaukti modeļi
content_benefits:
  tagline: Partnerības priekšrocības
  title: Kāpēc izplatītāji<br />Izvēlieties Paddle Board Overstock
  subtitle: Partnerība, kas izveidota jūras izplatītājiem, kuriem nepieciešama uzticama piegāde, konkurētspējīga peļņa un profesionāla atbalsts.
  items:
    - title: Teritorijas aizsardzība
      description: Ekskluzīvas vai daļēji ekskluzīvas teritorijas tiesības kvalificētiem izplatītājiem. Tirgus kartēšana un kanālu konfliktu pārvaldība, lai aizsargātu jūsu ieguldījumu Paddle Board Overstock zīmola veidošanā jūsu reģionā.
      icon: tabler:map-pin
    - title: Konkurētspējīgas vairumtirdzniecības cenas
      description: Pakāpju cenu noteikšana, pamatojoties uz gada apjoma saistībām. Peļņu aizsargājoša cenu struktūra ar iepriekšējām cenu garantijām un caurspīdīgām izmaksu sadalēm (FOB Qingdao bāze).
      icon: tabler:currency-dollar
    - title: Mārketinga atbalsta komplekts
      description: Profesionāla produktu fotografēšana, specifikāciju lapas, atbilstības dokumentācijas veidnes, sociālo mediju saturs un kopzīmolu mārketinga materiāli. Atjaunināts katru gadu ar jaunajiem produktu izlaišanām.
      icon: tabler:photo
    - title: Tehniskā apmācība
      description: Produktu apmācība jūsu pārdošanas komandai (virtuāli vai klātienē), apkope un remonta apmācība jūsu servisa tehniķiem, kā arī biežāk uzdoto jautājumu un problēmu novēršanas ceļveži klientiem.
      icon: tabler:school
    - title: Rezerves daļas un pēcpārdošanas serviss
      description: Speciāla rezerves daļu piegāde ar prioritāru sūtīšanu. Pieejami nomaiņas cauruļu segmenti, vārsti, spuras un remonta komplekti ātrai pasūtījumu izpildei. Atbalsts garantijas prasību apstrādē.
      icon: tabler:tool
    - title: Atbilstības dokumentācija
      description: 'Pilnīga atbilstības dokumentācijas pakete jūsu tirgum: CE atbilstības deklarācija (DoC), ražotāja plāksnītes dati, lietotāja rokasgrāmatas un regulatīvās reģistrācijas atbalsts. Novērš jūsu atbilstības slogu.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Ko mēs meklējam
  title: Izplatītājs<br />Prasības
  subtitle: Mēs meklējam partnerus, kas profesionāli varētu pārstāvēt un atbalstīt Paddle Board Overstock produktus viņu teritorijā.
  items:
    - title: Teritorijas un tirgus izpratne
      description: Ierasta klātbūtne jūras, ūdens sporta vai brīvā laika pavadīšanas tirgū. Izpratne par vietējiem noteikumiem, patērētāju vēlmēm un sadales kanāliem ūdens transportlīdzekļu produktiem.
      icon: tabler:target
    - title: Nozares pieredze
      description: Vismaz 2 gadu pieredze jūras, āra vai sporta aprīkojuma izplatīšanā. Pierādīta pieredze darbā ar starptautiskajiem zīmoliem un B2B vairumtirdzniecības operācijām.
      icon: tabler:briefcase
    - title: Izstāžu zāle vai noliktava
      description: Fiziska telpa produktu demonstrēšanai, krājumu glabāšanai un klientu apkalpošanai. Spēja uzturēt demonstrācijas vienības un rezerves daļu krājumu savā teritorijā.
      icon: tabler:building-store
    - title: Apmierinājums ar zīmola standartiem
      description: Gatavība uzturēt Paddle Board Overstock zīmola prezentācijas standartus, nodrošināt klientu atbalstu saskaņā ar mūsu pakalpojumu protokoliem un piedalīties ikgadējās produktu apmācību atjaunināšanās sesijās.
      icon: tabler:star
content_process:
  tagline: Pieteikšanās process
  title: 4 soļu dīleris<br />Pieteikšanās process
  subtitle: No sākotnējā vaicājuma līdz pirmajai sūtījuma nosūtīšanai — vienkāršs iepazīšanās process.
  steps:
    - number: '01'
      title: Sākotnējā pieprasījuma un kvalifikācijas pārbaude
      description: Iesniedziet savu izplatītāja pieteikumu ar uzņēmuma informāciju, interesējošo teritoriju, pašreizējām produktu līnijām un gada apjomu aplēsēm. Mēs to izskatīsim 5 darba dienu laikā.
      timeline: 5 dienas
    - number: '02'
      title: Uzņēmējdarbības pārskats un noteikumi
      description: Virtuālā sapulce, lai apspriestu teritorijas stratēģiju, cenu līmeņus un partnerības nosacījumus. Pārskatīt atbilstības dokumentācijas prasības jūsu tirgum. NDA parakstīšana, ja nepieciešams.
      timeline: 1-2 nedēļas
    - number: '03'
      title: Parauga pasūtījums un novērtējums
      description: Veiciet sākotnējo parauga pasūtījumu (2-5 vienības) pie izplatītāja cenām tirgus novērtēšanai un komandas apmācībai. Iekļauta pilnīga atbilstības dokumentācija un demonstrācijas sagatavošana.
      timeline: 30-45 dienas
    - number: '04'
      title: Partnerības uzsākšana un atbalsts
      description: Pirmais konteineru pasūtījums ar aktivizētu teritorijas aizsardzību. Piegādāta mārketinga komplekts, apmācīta tirdzniecības komanda un piešķirts īpašs kontu vadītājs. Turpinās ceturkšņa biznesa pārskati.
      timeline: Turpinās
content_application_docs:
  tagline: Pieteikuma dokumenti
  title: Nepieciešamie dokumenti<br />dīlera pieteikumam
  subtitle: Lai pieteiktos Paddle Board Overstock dīleru līguma noslēgšanai, lūdzu, sagatavojiet sekojošos dokumentus un informāciju mūsu izvērtēšanas komandai.
  items:
    - title: Uzņēmuma reģistrācijas sertifikāts
      description: Derīgs uzņēmuma reģistrācijas dokuments ar juridiskās personas nosaukumu, reģistrēto adresi un darbības jomu, kas aptver jūras, sporta vai āra aprīkojuma izplatīšanu.
      icon: tabler:file-text
    - title: Teritorijas pārklājuma plāns
      description: Interesējošā ģeogrāfiskā teritorija, esošais mazumtirdzniecības vai izplatīšanas tīkls, mērķa klientu segmenti un piedāvātais gada apjoms pēc produktu kategorijām (RIB, SUP, kajaks).
      icon: tabler:map
    - title: Izstāžu zāles vai noliktavas iespējas
      description: Fiziska telpa produktu izstādīšanai, krājumu uzglabāšanai un klientu apkalpošanai. Fotogrāfijas vai plāni, kas parāda demonstrācijas zonu un rezerves daļu uzglabāšanas ietilpību.
      icon: tabler:building
    - title: Finanšu spēju pārskats
      description: 'Bankas atsauce vai finanšu pārskats, kas apstiprina iespēju veikt sākotnējo konteineru pasūtījumu un uzturēt krājumus. Minimālais sākotnējais pasūtījums: viens 20 pēdu konteiners (10-20 vienības jaukti modeļi).'
      icon: tabler:coin
    - title: Pēcpārdošanas atbalsta kapacitāte
      description: Servisa tehniķi, kas apmācīti vai apmācāmi piepūšamo laivu apkopei un remontam. Garantijas prasību apstrādes iespējas un rezerves daļu krājumu apņemšanās.
      icon: tabler:tool
    - title: Iepriekšējās zīmola atsauces
      description: Pašreizējo vai iepriekšējo jūras/sporta inventāra zīmolu saraksts, kas tiek izplatīti. Kontaktu atsauces pieejamas pēc savstarpējas vienošanās. Jaunuzņēmumi bez iepriekšējas izplatīšanas pieredzes var kvalificēties ar spēcīgāku finansiālu saistību.
      icon: tabler:users
faq:
  title: Dīleru programma — biežāk uzdotie jautājumi
  questions:
    - q: Kāds ir minimālais pasūtījuma daudzums izplatītājiem?
      a: Izplatītājs MOQ sāk ar 10–20 vienībām uz pasūtījumu, ar elastību jauktiem modeļiem (RIB, piepūšamiem, SUP). Sākotnējie 2–5 vienību parauga pasūtījumi ir pieejami pēc izplatītāja cenām tirgus novērtēšanai.
    - q: Vai jūs piedāvājat ekskluzīvas teritorijas tiesības?
      a: Ekskluzīvas teritorijas tiesības ir pieejamas kvalificētiem izplatītājiem, kuri izpilda gada apjoma saistības un uztur zīmola standartus. Daļēji ekskluzīvas un neekskluzīvas vienošanās ir pieejamas arī jaunajiem tirgiem.
    - q: Kādu mārketinga atbalstu jūs sniedzat?
      a: Mēs nodrošinām visaptverošu mārketinga komplektu, kas ietver profesionālu produktu fotogrāfiju, specifikāciju lapas, atbilstības dokumentācijas veidnes, sociālo mediju satura bibliotēku un kopzīmola materiālus. Katru gadu atjaunināts ar jaunu produktu izlaišanu.
    - q: Kā tiek izskatītas garantijas prasības?
      a: 'Izplatītāji ir pirmais kontaktpunkts garantijas prasību gadījumā. Mēs nodrošinām skaidrus garantijas kritērijus, foto dokumentācijas protokolus un ātru nomaiņu vai kredīta apstrādi. Garantijas nosacījumi: 5 gadu ierobežojums laivu cauruļu audumam/šuvēm/korpusam; 2 gadi SUP un piederumi.'
    - q: Vai es drīkstu privāti marķēt Paddle Board Overstock produktus ar savu zīmolu?
      a: Jā, caur mūsu OEMODM / programmu. Privātās etiķetes iespējas ietver pielāgotu lampu grafiku, konsoles zīmolu, mazumtirdzniecības iepakojumu un atbilstības dokumentāciju zem jūsu zīmola nosaukuma. OEMSkatiet mūsu /ODM pakalpojumu lapu, lai iegūtu sīkāku informāciju.
    - q: Kāda atbilstības dokumentācija ir iekļauta izplatītājiem?
      a: Katrs sūtījums ietver modeļa specifisku CE DoC, būvnieka numura zīmju datus, īpašnieku rokasgrāmatas un piegādes dokumentāciju. Mēs arī nodrošinām regulatīvās reģistrācijas atbalstu jūsu teritorijā un palīdzam ar vietējām atbilstības prasībām.
