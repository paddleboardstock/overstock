content_founding:
  tagline: Sākums
  title: Dzimis pie krastmalas
  subtitle: 'Paddle Board Overstock sākās piekrastes darbnīcā Cjindao ar vienu laivu un vīziju: uzbūvēt piepūšamus ūdens transportlīdzekļus, kas spētu izturēt reālus jūras apstākļus.'
  paragraphs:
    - 2012. gadā mūsu dibinātāji saskatīja tirgus nišu — lielākā daļa piepūšamo laivu bija vai nu pieejamas, bet neuzticamas, vai arī augstas kvalitātes, bet pārāk dārgas. Viņi uzskatīja, ka ir vieta ražotājam, kas nodrošina gan kvalitāti, gan vērtību.
    - Pirmais korpuss tika būvēts ar rokām, testēts vietējos ūdeņos un pilnveidots, balstoties uz reālu zvejnieku un mazo komerciālo operatoru atsauksmēm. Šī atgriezeniskā saite — būvēt, testēt, klausīties, uzlabot — joprojām ir mūsu inženierijas filozofijas pamatā.
    - Līdz 2015. gadam ziņas izplatījās ārpus Čingdao. Starptautiskie izplatītāji sāka pieprasīt paraugus. Tas, kas sākās kā vietēja darbnīca, kļuva par globālu piegādātāju.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Agrīnā ražošanas darbnīca un ražošana
content_growth:
  tagline: Izaugsme un inovācijas
  title: No darbnīcas līdz 12 000 m² lielai ēkai
  subtitle: Nepārtrauktas investīcijas cilvēkos, aprīkojumā un procesos ir pārvērtušās Paddle Board Overstock par modernu jūras ražošanas uzņēmumu.
  paragraphs:
    - Pieprasījumam pieaugot, pieauga arī mūsu ražotne. Mēs paplašinājāmies no nelielas darbnīcas līdz 12 000 m² rūpnīcai ar speciālām ražošanas līnijām RIB laivām, piepūšamām laivām SUP , dēļiem un aksesuāriem.
    - Mēs ieguldījām CNC griešanas iekārtās, augstas frekvences metināšanas iekārtās, drop stitch ražošanas līnijās un visaptverošās testēšanas platformās — ļaujot mums kontrolēt katru ražošanas kvalitātes aspektu.
    - Mūsdienās mūsu 200–300 cilvēku komandā ir jūras inženieri, materiālu zinātnieki, kvalitātes kontroles speciālisti un prasmīgi amatnieki — daudzi no viņiem strādā Paddle Board Overstock jau kopš pašiem pirmsākumiem.
content_mission:
  tagline: Mūsu misija
  title: Inženierijas brīvība ūdenī
  subtitle: Katrs Paddle Board Overstock produkts ir izstrādāts, lai palīdzētu cilvēkiem izpētīt, strādāt un uzplaukt uz ūdens — uzticami, droši un par pieņemamu cenu.
  list:
    - Izstrādāt ūdens transportlīdzekļus, kas darbojas reālos jūras apstākļos — ne tikai uz papīra
    - Veidojiet ilgstošas partnerattiecības ar izplatītājiem un zīmoliem, nodrošinot uzticamu OEM/ODM servisu
    - Nepārtraukti uzlabojiet mūsu ražošanas procesus, lai nodrošinātu labāku vērtību
    - Atbalstiet katru produktu ar oriģinālām rezerves daļām un tehnisko ekspertīzi
