content_segments:
  tagline: Partneru profili
  title: Izplatīšanas partnerības modeļi<br />Pēc partnera veida
  subtitle: Dažādi izplatītāji piedāvā dažādas eksporta-pieejas stiprās puses — reģionālo infrastruktūru, e-komercijas sasniedzamību, specializētus mazumtirdzniecības kanālus vai daudzzīmolu portfeļus. Mēs strukturējam partnerības nosacījumus, cenu līmeņus un atbalsta līmeņus, lai atbilstu katra partnera profilam.
  items:
    - title: Reģionālie jūras izplatītāji
      subtitle: Teritorijas ekskluzīva B2B izplatīšana
      description: Izveidoti izplatītāji ar noliktavu infrastruktūru, izplatītāju tīkliem un loģistikas iespējām, kas apkalpo jūras izplatītājus, ūdenssporta mazumtirgotājus un nomas operatorus noteiktā ģeogrāfiskā teritorijā. Jums ir nepieciešama pilna produktu līnija, aizsargātas cenas un spēja apkalpot izplatītāju kontus ar vietējiem krājumiem un atbalstu.
      features:
        - Ekskluzīva teritorijas aizsardzība ar minimāliem saistību nosacījumiem
        - Pilna kataloga vairumtirdzniecības cenas ar ceturkšņa apjoma atlaidēm
        - Vietējā krājumu nosūtīšanas programma ātri pārvietojamiem SKU
        - Dīleru tīkla apmācības un kopzīmolu mārketinga programmas
    - title: E-komercija un tiešsaistes mazumtirgotāji
      subtitle: Digitāli orientētie izplatīšanas kanāli
      description: Tiešsaistes mazumtirgotāji, kas pārdod ūdens sporta inventāru caur Amazon, eBay vai savām e-komercijas platformām. Ātra nonākšana tirgū, konkurētspējīgas cenas un tiešā loģistika patērētājiem ir ļoti svarīgas. Jums nepieciešams partneris, kurš var ātri piegādāt individuālus pasūtījumus jūsu zīmola ietvaros un bez krājumu riska.
      features:
        - 'Drop-ship programma: rūpnīcas tiešā apmierināšana ar jūsu zīmolu'
        - Reāllaika krājumu API plūsma jūsu e-komercijas platformai
        - Amazon Seller Central integrācija ar EAN/UPC atbalsts
        - Iekļauta atgriešanas loģistika un garantijas prasību apstrāde
    - title: Specializētie ūdens sporta mazumtirgotāji
      subtitle: Fizisko veikalu izstāžu zāļu partneri
      description: Fiziskie mazumtirdzniecības veikali, kas specializējas ūdens sporta inventārā — apkalpo vietējos airētājus, makšķerniekus un laivotājus ar klātienes pārdošanu, demonstrācijām un pēcpārdošanas servisu. Jums nepieciešams mazumtirdzniecībai optimizēts iepakojums, demonstrācijas vienību programmas un kases vietas materiāli, kas pārvērš klientus bez pieraksta.
      features:
        - 'Demonstrācijas vienības programma: atlaides izstāžu zāļu displeju stendiem'
        - Mazumtirdzniecībai gatavs iepakojums ar plauktiem optimizētu kastes dizainu
        - Tirdzniecības vietu displeji, salīdzināšanas diagrammas un pircēju ceļveži
        - Veikala darbinieku apmācības un sertifikācijas programma
    - title: Daudzzīmolu un universālveikalu izplatītāji
      subtitle: Plaša līnijas sporta preču izplatīšana
      description: Lieli izplatītāji, kas apkalpo universālveikalus, lielveikalus un sporta preču ķēdes ar daudzzīmolu katalogiem. Konsekvence, atbilstības dokumentācija un piegādātāju atbilstība ir ārkārtīgi svarīgas — katram SKU jāizpilda mazumtirgotājam specifiski iepakojuma, marķējuma un kvalitātes standarti.
      features:
        - 'Mazumtirgotāja atbilstības dokumentācija: iepakojuma specifikācija, svītrkods, marķējums'
        - EDI/ASN integrācija lielo mazumtirgotāju pasūtījumu sistēmām
        - Piegādātāja pārvaldītas krājumu un automātiskās papildināšanas programmas
        - Īpaša kontu pārvaldība ar 24 stundu atbildes SLA
