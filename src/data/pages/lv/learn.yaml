hero:
  tagline: Ūdens izpētes zināšanas
  title: Uzziniet
  subtitle: |
    Ceļveži, pamācības un padziļinātas apskates — viss, kas nepieciešams izpētei<br />
    uz ūdens ar pārliecību. No pirmā SUP izvēles līdz progresīvu tehniku apguvei.
  taglineSection: Zināšanas katram airētājam. No iesācēja līdz profesionālim.
featured:
  tagline: Izcelti temati
  title: Sāc savu mācību ceļojumu
  subtitle: Neatkarīgi no tā, vai jūs esat jauns ūdenssportā vai vēlaties pacelt savas prasmes jaunā līmenī, mūsu ceļveži jums palīdzēs.
  items:
    - title: SUP Pamatinformācija
      description: Viss, kas iesācējam jāzina — dēļu veidi, airu izmēri, stāja un padomi pirmajai dienai.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Piepūšamais vs cietais dēlis
      description: Kurš ir piemērots tieši jums? Mēs salīdzinām pārnēsājamību, veiktspēju, izturību un cenu blakus.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Ūdens drošība
      description: Būtiskas drošības zināšanas, kas katram airētājam jāzina — laika apstākļi, glābšanas vestes, pašpalīdzība un vēl citi.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Materiālu ceļvedis
      description: PVC pret Hypalon, drop-stitch tehnoloģija, noliedzēju vērtējumi — saproti, no kā tava ierīce ir izgatavota.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Izmēru rokasgrāmata
      description: Atrodi pareizo dēļa garumu, platumu un tilpumu atbilstoši savam svaram, prasmju līmenim un airēšanas stilam.
      icon: tabler:ruler
      href: /size-guide
    - title: Vidēja līmeņa paņēmieni
      description: Uzlabojiet savu airēšanu ar uzlabotām airēšanas tehnikām, pagrieziena paņēmieniem un rupja ūdens apstrādi.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
