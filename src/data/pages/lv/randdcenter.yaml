rd_services:
  tagline: Pielāgota pētniecība un attīstība
  title: Pētniecības un attīstības pakalpojumi partneriem
  services:
    - title: Pielāgota materiālu izstrāde
      desc: Mēs izstrādājam pielāgotas audumu formulācijas, laminātu slāņus un līmes sistēmas, kas pielāgotas jūsu darbības videi un darbības mērķiem.
    - title: OEM / ODM Produktu inženierija
      desc: No koncepcijas skicēm līdz ražošanai gataviem inženierijas paketiem — mūsu komanda var projektēt, prototipēt un validēt laivas jūsu zīmolā.
    - title: Trešās puses testēšana un sertifikācija
      desc: Izmantojiet mūsu ISO atbilstīgās testēšanas iekārtas neatkarīgai materiālu testēšanai, produkta validācijai un sertifikācijas atbalstam.
  cta: Pārrunājiet savas pētniecības un attīstības prasības →
  cta_link: /contact
vision:
  tagline: Mūsu vīzija
  title: Veidojot ūdens sporta nākotni
  body: Aquafarer cenšas vadīt piepūšamo laivu un SUP nozari, pateicoties nepārtrauktai inovācijai, nemainīgai kvalitātei un stingrai apņemšanās nodrošināt drošību un ilgtspējību — galu galā bagātinot ūdens sporta entuziastu pieredzi visā pasaulē. Aquafarer izpētes un attīstības centrs ir vieta, kur kaisle satiek inovāciju, nosakot jaunus standartus ūdens sporta nozarē.
labs_section:
  tagline: Labs
  title: Mūsu laboratorijas
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC Audumu Laboratorija
      description: Nepārtraukta PVC un Hypalon cauruļu audumu izpēte un testēšana sprieguma izturībai, UV izturībai, nodilumizturībai un zemas temperatūras elastībai, lai nodrošinātu ilgtermiņa uzticamību jūras vidē.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Hull Inženierijas Studija
      description: CAD vadīta dizaina un galīgo elementu analīze HDPE, alumīnija un stiklašķiedras korpusiem. Katrs korpuss tiek digitāli simulēts sprieguma sadalījumam un trieciena izturībai pirms pirmā prototipa izgatavošanas.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: RF metināšanas centrs
      description: Specializēta radiofrekvences metināšanas iekārta ar precīzu temperatūras un spiediena kontroli, ražojot augstas stiprības, gaisa hermētiskas šuves, kas atbilst jūras nozares standartiem piepūšamajiem kuģiem.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Hidrodinamiskā testa tvertne
      description: Mēroga modeļu testēšana mūsu iekšējā testa tvertnē, lai optimizētu korpusa formu, planēšanas veiktspēju, stabilitāti un degvielas ekonomiju dažādos kravas un jūras apstākļos.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototipu darbnīca
      description: Pilna mēroga prototipēšanas un montāžas centrs, kur tiek būvēti, aprīkoti un jūras izmēģinātie jauni modeļi. Katrai prototipam pirms ražošanas apstiprināšanas tiek veikta vismaz 20 stundu ūdens testa programma.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Kvalitātes un inspekcijas laboratorija
      description: Specializēta kvalitātes nodrošināšanas laboratorija, kas veic stiepšanās testus, gaisa noturības ciklus, šuvju plēšanas testus un materiālu sertifikāciju, lai nodrošinātu, ka katra laiva, kas atstāj darbnīcu, atbilst mūsu publicētajām specifikācijām.
      href: /randdcenter/quality-inspection-lab
