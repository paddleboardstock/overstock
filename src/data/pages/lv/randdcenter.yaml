hero:
  tagline: R&D centrs
  title: Pētniecības un attīstības centrs
  subtitle: Koncentrēts uz progresu
intro:
  - Aquafarer Pētniecības un izstrādes (R&D) centrs ir dzinējspēks mūsu misijai revolūcijas veikšanai ūdenssporta ekipējuma jomā. Mēs sniedzam ūdenssporta entuziastiem visā pasaulē iespēju izmantot drošākus, ērtākus un patīkamākus produktus, pateicoties nepārtrauktai inovācijai piepūšamo stāvus airējamo dēļļu (SUPs) un laivu jomā. Mūsu uzticīgā inženieru, dizaineru un aizrautīgu ūdenssporta ekspertu komanda veido nozares nākotni, pastāvīgi paaugstinot kvalitātes, veiktspējas un ilgtspējības standartus.
  - Mūsu pētniecības un attīstības centrs vienuviet apvieno materiālu zinātniekus, kuģu arhitektus un ražošanas inženierus. No auduma formulēšanas un korpusa simulācijas līdz metināšanas procesu izstrādei un pilnmēroga jūras izmēģinājumiem, katrs produkta izstrādes posms tiek vadīts pēc datiem un pārbaudīts ar testiem.
mission:
  tagline: Mūsu misija
  title: Inovējot ūdens sporta nākotni
  pillars:
    - icon: lightning
      title: Tehnoloģiskā attīstība
      desc: Jaunu materiālu, dizainu un ražošanas metožu pionieris, nodrošinot izcilu produkta veiktspēju un ilgmūžību.
    - icon: design
      title: Lietotājam orientēts dizains
      desc: Dziļi izprast un pārsniegt lietotāju vajadzības, izmantojot ergonomisku un intuitīvu produktu dizainu.
    - icon: globe
      title: Ilgtspējīgas prakses
      desc: Mēs samazinām savu ietekmi uz vidi, izmantojot videi draudzīgas materiālus un procesus.
    - icon: shield
      title: Nesamierināma drošība
      desc: Nodrošinot augstākos drošības standartus, izmantojot stingru testēšanu un sertifikāciju.
pillars:
  - title: Tehnoloģiskā attīstība
    desc: Jaunu materiālu, dizainu un ražošanas procesu izstrāde, lai nodrošinātu izcilu produkta veiktspēju un ilgmūžību.
    icon: tech
  - title: Modernas materiāli
    desc: Izpēta jaunākās PVC, Hypalon, kompozītus un ilgtspējīgas alternatīvas uzlabotām produkta īpašībām.
    icon: materials
  - title: Ilgtspējība
    desc: 'Pamata saistība: Mēs esam uzticīgi vides aizsardzībai caur ilgtspējīgu ražošanu un pārstrādājamiem materiāliem.'
    icon: sustainability
capabilities:
  tagline: Spējas
  title: Pētniecības un attīstības spējas
  subtitle: Četras pamatdisciplinas, kas mums nodrošina pilnīgu kontroli pār produktu izstrādi — no izejvielu izpētes līdz galīgajai sertifikācijai.
  groups:
    - title: Materiālu zinātne un audumu tehnoloģija
      items:
        - PVC un Hypalon formulējuma analīze un optimizācija
        - UV stabilizācija, liesmas necaurlaidība un pretmikrobu piedevu izstrāde
        - Daudzslāņu audumu laminēšana un saķeres inženierija
        - Ātrā novecošanās testēšana (UV, termiskā, mitruma, sāls miglas)
    - title: Korpusa inženierija un hidrodinamika
      items:
        - Parametriska 3D korpusa projektēšana un CFD optimizācija
        - Beigu elementu analīze strukturālām un triecienu slodzēm
        - Mēroga modeļu vilkšanas baseina testēšana un darbības efektivitātes pārbaude
        - Pielāgotu korpusu izstrāde īpašiem misijas profiliem
    - title: Metināšanas un savienošanas tehnoloģija
      items:
        - RF dielektriskās metināšanas procesa izstrāde un optimizācija
        - Karstā gaisa, karstā ķīļa un ultraskaņas metināšanas metodes
        - Līmēšanas un šuvju lentes kvalifikācija
        - Metinājuma stiprības modelēšana un ekspluatācijas ilguma prognozēšana
    - title: Testēšana, sertifikācija un atbilstība
      items:
        - Kvalitātes vadība un CE atbilstības testēšana
        - Neatkarīga trešās puses testēšana un sertifikācijas atbalsts
        - Pielāgotu testu protokolu izstrāde iepirkuma kvalifikācijai
        - Ekspluatācijā radušos defektu analīze un pamatcēloņu izmeklēšana
