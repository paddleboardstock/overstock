process_steps:
  title: 6 soļu OEM/ODM process
  subtitle: No dizaina īsziņas līdz FOB Qingdao — vienkāršots darba plūsmas process
  steps:
    - number: '01'
      title: Dizaina īsziņa un 3D CAD modelēšana
      description: Dalieties ar savu mērķa specifikāciju, atsauces produktu vai koncepciju. Mūsu inženieru komanda izstrādā detalizētus CAD zīmējumus un 3D vizualizācijas jūsu apstiprinājumam.
      timeline: 3–5 dienas
    - number: '02'
      title: Materiālu izvēle un audumu testēšana
      description: Izvēlieties no militārās pakāpes PVC (0,9–1,2 mm), Hypalon CSM vai drop-stitch pamatmateriāliem. Mēs veicam stiepes stiprības, pārklājuma saķeres un UV stabilitātes testus.
      timeline: 2–3 dienas
    - number: '03'
      title: Ātra prototipēšana un paraugu ražošana
      description: Mēs CNC mašīnam pielāgotas formas un ražojam pirmsražošanas paraugus ar jūsu zīmola krāsām, logotipu un norādītajiem materiāliem. Paraugi tiek nosūtīti jūsu apstiprinājumam.
      timeline: 7–14 dienas
    - number: '04'
      title: 24–48 stundu augsta spiediena aizturēšanas tests
      description: Katrs prototips tiek pakļauts rūpīgai spiediena noturības pārbaudei pie 1,25x nominālā spiediena. Veic šuvju nolupinājuma testus un izmēru pārbaudi.
      timeline: 1–2 dienas
    - number: '05'
      title: CE/ISO Kvalitātes pārbaude un iepakošana
      description: 100 punktu kvalitātes kontrolsaraksts. Katrs vienums tiek pārbaudīts pirms iepakošanas gatavības pārdošanai. CE atbilstības deklarācija un BSCI atbilstības ziņojums iekļauti.
      timeline: 2–3 dienas
    - number: '06'
      title: FOB Qingdao Piegāde un loģistika
      description: Gatavais produkts uz paletēm, iesaiņots saraušanās plēvē un iekrauts konteinerā Qingdao ostā. Pilna eksporta dokumentācija, muitas formalitātes un reāllaika izsekošana.
      timeline: 7–14 dienas
