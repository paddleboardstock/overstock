faq:
  title: OEM/ODM — Biežāk uzdotie jautājumi
  questions:
    - q: Kāds ir minimālais pasūtījuma daudzums (MOQ) pielāgotiem piepūšamajiem SUPs?
      a: Standarta modeļiem ar esošām veidnēm MOQ sākas ar 5–10 vienībām katrā dizainā. Pilnībā pielāgotām veidnēm un instrumentiem MOQ parasti ir 200+ vienības. Mēs sadarbojamies ar jaunuzņēmumiem un jaunajiem zīmoliem, lai atrastu reālus ieejas punktus.
    - q: Cik ilgi OEM aizņem paraugu ņemšanas process?
      a: Standarta prototipa paraugi tiek pabeigti 7–14 darba dienu laikā pēc dizaina apstiprināšanas. Steidzamos pasūtījumus var prioritizēt 5–7 dienu laikā par papildu maksu.
    - q: Kāda ir atšķirība starp PVC un Hypalon piepūšamajām laivām?
      a: PVC ir vieglāka, pieejamāka un piedāvā izcilu elastību aukstā laika apstākļos.Hypalon (CSM) nodrošina izcilu UV un ozona izturību ar ilgāku kalpošanas laiku (10–15 gadi pret 5–8 gadiem). Mēs iesakām PVC lielākajai daļai atpūtas pielietojumu un Hypalon komerciālai/profesionālai lietošanai.
    - q: Vai vari pielāgot piepūšamās ierīces formu un dizainu?
      a: Jā. Mūsu pētniecības un attīstības komanda var izstrādāt pielāgotas veidnes jebkurai korpusa formai, dēļa kontūrai vai cauruļu konfigurācijai. Mēs izmantojam CNCapstrādātas alumīnija veidnes precizitātei un konsekvencei.
    - q: Vai jūs sniedzat rūpnīcu audita pakalpojumus?
      a: Mēs priecājamies par klātienes un trešo pušu rūpnīcu auditiem mūsu 12 000 m² lielajā Čingdao rūpnīcā. Mēs uzturam ISO 9001 un BSCI sertifikātus un varam dalīties ar audita ziņojumiem NDApar .
    - q: Kādus piegādes nosacījumus jūs piedāvājat?
      a: Mēs piedāvājam FOB Qingdao (standarta), CIF, un DDP piegādes noteikumus. Visos pasūtījumos ir iekļauta konteineru iekraušana un pilna eksporta dokumentācija OEM .
content_profiles:
  tagline: Zīmolu profili
  title: OEM / Privāto zīmolu ražošana<br />Pēc klienta tipa
  subtitle: Dažādiem zīmolu profiliem ir atšķirīgas prasības — mēs pielāgojam savus OEMODM / pakalpojumus, lai tie atbilstu jūsu biznesa modelim, mērogam un tirgus stratēģijai.
  items:
    - title: Jaunuzņēmumu ūdens transportlīdzekļu zīmoli
      subtitle: ZemsMOQ, ātrs pacelšanās
      description: Uzņēmēji un dibinātāji, kuri uzsāk savu pirmo SUPs, kajaku vai piepūšamo laivu līniju. Jums nepieciešams ražošanas partneris, kurš izturas pret jūsu zīmolu kā pret savu — ar zemām ieejas prasībām, elastīgiem partiju lielumiem un praktisku dizaina vadību katrā solī.
      features:
        - MOQ no 50–100 vienībām uz SKU, ne tūkstošiem
        - Jau esoša veidņu bibliotēka, lai izvairītos no instrumentu izmaksām
        - 'Pilns zīmola komplekts: logotips, caurules grafika, iepakojums, piekarināmās birkas'
        - Parauga darba plūsma — apstiprināt pirms ražošanas
    - title: Izveidotie jūras zīmoli
      subtitle: OEM Mērogs CEar /ISO Atbilstība
      description: Esošie laivu, PWC vai jūras piederumu zīmoli pievieno piepūšamus ūdens transportlīdzekļus savam portfelim. Nepieciešama konsekventa kvalitāte ražošanas sērijās, atbilstība globālajiem tirgiem un spēja kopīgi izstrādāt pielāgotus korpusus vai cauruļu formas.
      features:
        - Pielāgota 3D veidņu inženierija patentētiem dizainiem
        - CE 2013/53/ES, UKCAUSCG , atbilstības dokumentācija
        - BSCI Sociālo auditu pārskati mazumtirgotāju atbilstībai
        - Dedikēta konta pārvaldība + prioritārie ražošanas laiki
    - title: DTC & e-komercijas zīmoli
      subtitle: Mazumtirdzniecībai gatavs iepakojums lielos apjomos
      description: Tiešsaistes pirmie zīmoli, kas pārdod caur Amazon, Shopify vai savām interneta veikaliem. Iepakojums, iepakojuma atvēršanas pieredze un konsekventa vienību kvalitāte ir kritiski svarīgas. Jums nepieciešama rūpnīca, kas saprot e-komercijas ātruma un atdeves dinamiku.
      features:
        - Mazumtirdzniecībai gatava kastu dizaina + ievietojamās kartītes drukāšana
        - Vakuuma iepakošana / palešu iepakošana izmaksu efektīvai nosūtīšanai
        - EAN / UPC svītrkodu un muitas dokumentācija
        - Jauktu konteineru konsolidācija, lai optimizētu ieviestās cenas
    - title: Dzīvesstila un āra zīmoli
      subtitle: Baltās birkas dizains + kategorijas paplašinājums
      description: Apģērbu, āra aprīkojuma vai ceļojumu zīmoli, kas ieiet ūdens sporta kategorijā zem sava zīmola. Jums var nebūt jūras inženierijas ekspertīzes iekšēji — tāpēc jums nepieciešams partneris, kurš var vadīt jūs no koncepcijas līdz konteineram ar minimālu berzi.
      features:
        - Tendenču pētījumi un koncepcijas noskaņas dēļi
        - Kop-zīmolu ierobežotās kolekcijas un sezonas krāsu varianti
        - Dizaina līdz paraugam cikls 10–14 darba dienās
        - 'Pilnīga loģistika: fabrika → noliktava → patērētājs'
