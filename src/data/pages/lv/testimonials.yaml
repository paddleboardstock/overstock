testimonials:
  - category: clubs
    name: Rikardo Santos
    title: Īpašnieks, Algarve sērfošanas akadēmija
    location: Lagošs, Portugāle
    content: Mēs sākām ar Kluba Sākuma Komplektu mūsu sērfošanas skolai. 20 dēļi, airi, vestes — viss ieradās 3 nedēļu laikā. Pēc diviem sezonām mēs pārgājām uz Pro Komplektu. Pielāgotais zīmols ar mūsu logo bija spēles pārveidotājs mūsu profesionālajam tēlam.
    rating: 5
    product: Kluba sākuma komplekts
    source: solutions/clubs
  - category: clubs
    name: Kluba īpašnieks
    title: Ūdens sporta klubs
    location: Puketa, Taizeme
    content: Kluba Sākuma Komplekts bija ideāls sākumpunkts. Kad mūsu bizness auga, Paddle Board Overstock auga kopā ar mums — tāda pati kvalitāte, tāda pati cena, bez pārsteigumiem. Mēs paplašinājāmies no 10 līdz 80 dēļiem 18 mēnešu laikā.
    rating: 5
    product: Kluba Sākuma + Premium Komplekt
    source: success-stories
  - category: resorts
    name: Kūrorta ģenerāldirektors
    title: 5 zvaigžņu pludmales kūrorts
    location: Grieķija
    content: Paddle Board Overstock ne tikai piegādāja dēļus — viņi palīdzēja mums izveidot pilnīgu viesu pieredzi. Mūsu ūdenssporta programma no nulles kļuva par kūrorta galveno atrakciju vienā sezonā. 300+ nedēļas rezervācijas un 180 tūkstoši dolāru gada ieņēmumos.
    rating: 5
    product: Atpūtas kompleksa Premium pakete
    source: success-stories
  - category: resorts
    name: Sofi Lorēna
    title: Viesu pieredzes direktors, Azure Bay kūrorti
    location: Puketa, Taizeme
    content: Paddle Board Overstock izstrādāja un aprīkoja visu mūsu pludmales aktivitāšu programmu trīs kūrortu īpašumos. 80 SUPs, 40 kajaki, drošības infrastruktūra un personāla apmācība — viss piegādāts vienā sūtījumā. Apmeklētāju līdzdalība pirmajā sezonā palielinājās par 60%.
    rating: 5
    product: Atpūtas kompleksa Premium pakete
    source: solutions/resorts
  - category: entrepreneurs
    name: Maikls Parks
    title: Dibinātājs, Shoreline Paddle Co.
    location: Kalifornija, ASV
    content: Es izveidoju savu SUP zīmolu bez jebkādas pieredzes nozarē. Paddle Board Overstock komanda vadīja mani no produkta izvēles līdz pielāgotas logotipa dizainam un iepakojumam. Mans pirmais konteiners ieradās 11 nedēļu laikā, un es izpārdevu visu 3 mēnešos Amazon.
    rating: 5
    product: Sākuma zīmola uzsākšana
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Dibinātājs
    title: Austrālijas SUP zīmols
    location: Austrālija
    content: Man bija zīmola ideja, bet nebija nekādu ražošanas zināšanu.Paddle Board Overstock Burtiski vadīju mani aiz rokas visā procesā — no pareizā plates dizaina izvēles līdz pirmās sūtījuma izpakošanai. 90 dienas no sapņa līdz piegādei.
    rating: 5
    product: Zīmola palaišanas pakete
    source: success-stories
  - category: rental
    name: Daniels Okonkvo
    title: Īpašnieks, Lakeland SUP Nomā
    location: Ontario, Kanāda
    content: Es īrēju 5 dēļus no vietējā veikala un zaudēju viņiem 60% no saviem ienākumiem. Paddle Board Overstock palīdzēja man izveidot savu 15 SUPs floti. ROI kalkulators parādīja, ka atmaksāsies 4 mēnešos — tā bija vajadzīga 3. Tagad es paplašinos līdz 30 dēļiem.
    rating: 5
    product: Flotes sākuma komplekts
    source: solutions/rental-business
  - category: rental
    name: Marko Valenti
    title: Darbību direktors, Adrijas piedzīvojumu ekskursijas
    location: Dubrovnika, Horvātija
    content: Mēs aprīkojām visu mūsu nomas flotili ar Paddle Board Overstock RIBs — 12 laivām trīs vietās. Pēc divām sezonām nav bijušu bojājumu. CE sertifikācijas dokumentācija padarīja apdrošināšanas apstiprināšanu vienkāršu. Viņu inženieru komanda pat pielāgoja trubu krāsas.
    rating: 5
    product: Flotes paplašināšanas komplekts
    source: trust
  - category: rental
    name: Lt. komandieris Andres Rejes
    title: Jūras iepirkumu virsnieks, Filipīnu Krasta apsardzes palīgdienests
    location: Manila, Filipīnas
    content: Mēs darbojamies 24 Paddle Board Overstock RIBs visā mūsu piekrastes patrulēšanas flotē. Viņu QC process ir konsekvents katrā partijā — vienāda šuvju kvalitāte, vienāda vārstu izvietošana, vienāds spiediena vērtējums katru reizi. Šī atkārtojamība ir svarīga, kad dzīvības ir atkarīgas no aprīkojuma.
    rating: 5
    product: RIB Patruļkuģu flote
    source: trust
  - category: consumers
    name: Sāra K.
    title: Pirmreizējais SUP īpašnieks
    location: Leik Tahoe, ASV
    content: Stabils pat pilnīgam iesācējam. Pirmo dienu paņēmu to uz ezera un nekad nekrītu. Pilnais komplekts ar sūkni un airi nozīmēja, ka ūdenī biju jau 20 minūtes pēc kastes atvēršanas.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: Džeimss Torntons
    title: SUP Explorer 11 īpašnieks
    location: Vankūvera, Kanāda
    content: Kā pirmreizējais pircējs biju nervozs par kvalitāti, pasūtot no ārzemēm. ISO dokumentācija un trešo personu testu atskaites, ko viņi man sniedza pat pirms es jautāju, deva pilnīgu pārliecību. Dēļe ieradās 6 dienu laikā un pārsniedza manas cerības.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Maiks R.
    title: Brīvā laika kajakists
    location: Florida, ASV
    content: Stipra izgatavošanas kvalitāte. Iztur piekrastes viļņus daudz labāk nekā gaidīju no piepūšamā. Iepriekš saliku automašīnas bagāžniekā nedēļas nogales braucienam — uzbērt to pie rampa aizņēma mazāk nekā 4 minūtes.
    rating: 5
    product: Piepūšamais kajaks
