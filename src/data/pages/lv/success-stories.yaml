hero:
  tagline: Veiksmes stāsti
  title: Reālie rezultāti no<br />Ūdens biznesa veidotāji
  subtitle: Uzziniet, kā klubi, kūrorti un uzņēmēji visā pasaulē izveidoja ienesīgas ūdens sporta operācijas ar Aquafarer aprīkojumu un atbalstu.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer Klientu panākumu stāsti
stories:
  - title: Kā Vidusjūras kūrorts izveidoja ienesīgu SUP nomas biznesu
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5 zvaigžņu pludmales kūrorts — Grieķija
    problem: Kūrortam bija nepieciešamas augstas kvalitātes viesu ūdens aktivitātes, lai paaugstinātu apmierinātības rādītājus un radītu jaunu ieņēmumu plūsmu, taču trūka aprīkojuma, drošības infrastruktūras un personāla pieredzes.
    solution: Aquafarer piegādāja 50 individuāli marķētas SUP dēļus ar kūrorta krāsām un logotipu, pilnu drošības sistēmu, tostarp glābšanas stacijas un boju līnijas, kā arī 3 dienu personāla apmācību programmu, kas aptvēra aprīkojuma apstrādi, viesu apmācību un drošības protokolus.
    result:
      - 300+ nedēļas viesu aktivitātes rezervētas pirmajā mēnesī
      - 'Apmeklētāju apmierinātības rādītāji ūdens aktivitātēs: 4,8/5'
      - 'Jauni gada papildu ieņēmumi: $180K'
      - Pirmajā darbības sezonā nebija neviena drošības incidenta
      - Iekārtu nomaiņas izmaksas samazinātas par 40% salīdzinājumā ar iepriekšējo piegādātāju
    quote:
      text: Aquafarer Ne tikai piegādāja dēļus — viņi palīdzēja mums izveidot pilnīgu viesu pieredzi. Mūsu ūdens sporta programma no nulles kļuva par kūrorta galveno notikumu vienā sezonā.
      author: Kūrorta ģenerāldirektors
    cta_text: Izveidojiet savu kūrorta risinājumu
    cta_href: /solutions/resorts
  - title: Kā Austrālijas jaunuzņēmums 90 dienās izveidoja ūdens zīmolu
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Pirmreizējs uzņēmējs — Austrālija
    problem: Āra entuziasts vēlējās izveidot savu SUP zīmolu Austrālijas tirgum, taču viņam nebija ražošanas pieredzes, nebija piegādātāju attiecību un bija ierobežots kapitāls.
    solution: AquafarerZīmola palaišanas pakete nodrošināja produktu izvēles konsultācijas, pielāgotu logotipu un krāsu dizainu, zīmola mazumtirdzniecības iepakojumu ar piekaramām birkām, CE sertifikācijas dokumentāciju un FOB piegādi uz Sidneju.
    result:
      - Pirmais 200 dēļu sūtījums piegādāts 75 dienu laikā no pirmā kontakta
      - Zīmols tika palaists Shopify + Amazon AU divu nedēļu laikā pēc ierašanās
      - Sākotnējais krājums tika izpārdots 45 dienu laikā
      - 'Vidējā peļņas marža: 55% mazumtirdzniecības cenās'
      - 'Otrais pasūtījums: 500 vienības ievietotas 60 dienu laikā pēc palaišanas'
    quote:
      text: Man bija zīmola ideja, bet nebija nekādu ražošanas zināšanu.Aquafarer Burtiski vadīju mani aiz rokas visā procesā — no pareizā plates dizaina izvēles līdz pirmās sūtījuma izpakošanai. 90 dienas no sapņa līdz piegādei.
      author: Austrālijas zīmola dibinātājs SUP
    cta_text: Palaidiet savu zīmolu
    cta_href: /solutions/entrepreneurs
  - title: Kā Taizemes pludmales klubs izauga no 10 līdz 80 dēļiem
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Ūdens sporta klubs — Taizeme
    problem: Maza pludmales kluba SUP Phuketas salā vajadzēja pāriet no hobija līmeņa darbības uz profesionālu nomas biznesu tūristiem, taču nebija iespējams atrast uzticamu aprīkojuma piegādātāju ar vienmērīgu kvalitāti un cenām.
    solution: Sākot ar Aquafarer Kluba Sākuma Komplektu (10 dēļi, airi, drošības aprīkojums, zīmola materiāli), klubs 18 mēnešos attīstījās, izmantojot Premium Komplektu programmu.
    result:
      - Palielināja no 10 līdz 80 dēļiem 18 mēnešos ar vienmērīgu kvalitāti un cenām
      - Pievienoja kajaku un pedāļu laivu nomu, izmantojot to pašu piegādātāju
      - Pielāgota kluba zīmola identitāte palielināja tūristu zīmola atpazīstamību
      - Uzturēšanas izmaksas samazinājās par 60% salīdzinājumā ar iepriekšējā budžeta aprīkojumu
      - Tagad sezonas laikā dienā tiek apkalpoti 150+ nomas gadījumi
    quote:
      text: Kluba Sākuma Komplekts bija ideāls sākumpunkts. Kad mūsu bizness attīstījās, arī Aquafarer attīstījās kopā ar mums — tāda pati kvalitāte, tādas pašas cenas, bez pārsteigumiem.
      author: Kluba īpašnieks, Phuketa
    cta_text: Sāciet savu Kluba Komplektu
    cta_href: /solutions/clubs
  - title: Kā Karību kūrortu ķēde standartizēja ūdens sporta pakalpojumus piecās īpašumos
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Kūrortu ķēde — Karību jūras reģions
    problem: Luksusa kūrortu ķēdei ar pieciem īpašumiem vajadzēja nodrošināt vienmērīgu ūdens sporta aprīkojuma kvalitāti un zīmolu visās vietās, ar centralizētu iepirkumu un sezonālo nomaiņas plānošanu.
    solution: Aquafarer piegādāja 300 SUPs un 100 kajaku daudzīpašuma flotili ar vienotu zīmola identitāti, kopīgu rezerves daļu inventāru un gada nomaiņas grafiku ar apjoma cenām.
    result:
      - Standartizēta viesu pieredze visos piecos īpašumos
      - 30% izmaksu samazinājums, apvienojot iepirkumus un izmantojot apjoma cenas
      - Centralizētais rezerves daļu inventārs samazināja dīkstāves laiku par 80%
      - Gada aprīkojuma atjaunošanas programma novērsa sezona beigās radušās steigas
      - Viesu iesaistīšanās ūdens sportā pieauga par 45% gadā pār gadā
    cta_text: Izveido savu Kūrorta Programmu
    cta_href: /solutions/resorts
