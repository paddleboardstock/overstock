content_capability:
  tagline: Inženierijas spēja
  title: Kas ir mūsu inženierija<br />Komanda piegādā
  subtitle: Paddle Board Overstock inženierija aptver visu produkta dzīvības ciklu — no tirgus izpētes un koncepcijas dizaina līdz prototipu izstrādei, testēšanai un masveida ražošanai.
  items:
    - title: Industriālais dizains
      description: Mūsu rūpnieciskā dizaina komanda strādā, balstoties uz klientu prasībām, tirgus izpēti un konkurences analīzi, lai izstrādātu produktu koncepcijas, kas līdzsvaro estētiku, funkcionalitāti un ražošanas iespējas. Mēs sagatavojam 2D skices, 3D renderējumus un specifikāciju dokumentus klienta pārskatīšanai pirms apņemšanās veikt instrumentu izgatavošanu.
      features:
        - Koncepta izstrāde un dzīvotspējas pētījumi
        - 2D dizaina zīmējumi un 3D renderējumi
        - Materiālu izvēle un specifikācija
        - Dizains ražošanai (DFM) analīze
        - Ergonomikas un drošības novērtējums
    - title: Būvniecības inženierija
      description: Mūsu konstrukciju inženieri specializējas piepūšamo laivu arhitektūrā — korpusa projektēšanā, cauruļu nodalījumu konfigurācijā, drop-stitch kodola inženierijā un slodzes sadalījumā. Katrs projekts tiek analizēts pēc strukturālās integritātes, svara optimizācijas un atbilstības attiecīgajiem standartiem (CE, ISO, AS).
      features:
        - Dziļās V formas stikla šķiedras korpusa dizains ar aprēķinātām deadrīza leņķiem
        - Daudzkameru cauruļu konfigurācija drošībai un peldošībai
        - Drop-stitch kodola specifikācija un blīvuma optimizācija
        - Beigu elementu analīze slodzi nesošām sastāvdaļām
        - Svara sadalījuma un stabilitātes aprēķini
    - title: 3D modelēšana un CAD
      description: Visi produktu dizaini tiek izstrādāti 3D CAD, pirms tiek uzsākta prototipu ražošana. Mūsu inženieri izmanto SolidWorks un Rhino 3D produktu modelēšanai, ļaujot klientiem pārskatīt katru detaļu — no cauruļu profila līdz konsoles izkārtojumam — pirms tiek uzsākta ražošana.
      features:
        - Pilna 3D CAD modelēšana SolidWorks un Rhino 3D
        - Foto-reālistiska vizualizācija klientu prezentācijām
        - Tehnisko zīmējumu paketes ražošanai
        - Veidņu un instrumentu dizains no 3D modeļiem
        - Datu tiešā pārsūtīšana no CAD uz CNC precīzai griešanai
    - title: Prototipēšana un testēšana
      description: Pirms masu ražošanas katrs jauns produkts iziet prototipa posmu. Mēs izgatavojam funkcionālus prototipus klienta vērtēšanai un pēc tam pakļaujam tos mūsu pilnam testēšanas protokolam — spiediena testi, stabilitātes testi, slodzes testi un ūdens izmēģinājumi. Dizaina iterācijas prototipa posmā ir ātras un izmaksu ziņā efektīvas.
      features:
        - Ātra prototipu izgatavošana (15-20 dienu izpilde)
        - Funkcionāls prototips reālai novērtēšanai
        - Pilns testēšanas protokols pirms ražošanas apstiprināšanas
        - Iteratīva dizaina uzlabošana, pamatojoties uz testu rezultātiem
        - Klienta apstiprinājuma posms pirms ražošanas instrumentu izgatavošanas
    - title: Pielāgotu piederumu integrācija
      description: Daudzi OEM projekti prasa klienta piegādāto vai trešo personu piederumu integrāciju — pielāgotas konsoles, specializētas sēdvietas, elektroniskās sistēmas, niršanas aprīkojuma stiprinājumi vai zīmolu elementi. Mūsu inženieru komanda pārvalda integrācijas dizainu, strukturālo pielāgošanu un visu piederumu kvalitātes pārbaudi.
      features:
        - Konsoles dizains un instrumentu paneļa izkārtojums
        - Pielāgotu sēdvietu un apdares integrācija
        - Elektronisko sistēmu dizains un vadu izkārtojums
        - Niršanas un glābšanas aprīkojuma stiprināšanas sistēmas
        - Zīmolu un grafisko pielietojumu specifikācijas
content_process:
  tagline: Izstrādes process
  title: No koncepcijas<br />līdz ražošanai
  subtitle: Mūsu produktu izstrādes process seko strukturētai 6 posmu darba plūsmai, kas paredzēta riska samazināšanai, termiņu saīsināšanai un ražošanas gatavības nodrošināšanai no pirmās dienas.
  stages:
    - stage: '01'
      title: Prasības un izpēte
      duration: 1-2 nedēļas
      description: Mēs strādājam kopā ar klientu, lai definētu produkta specifikācijas, mērķa tirgus prasības, normatīvo atbilstību un komerciālos mērķus. Šajā posmā tiek sagatavots Produkta prasību dokuments (PRD), kas vada visu turpmāko darbu.
      deliverables: PRD, tirgus analīze, konkurences salīdzinošā analīze, sākotnējais izmaksu novērtējums
    - stage: '02'
      title: Koncepcijas dizains
      duration: 2-3 nedēļas
      description: Rūpnieciskā dizaina komanda izstrādā produktu koncepcijas, balstoties uz PRD. Tiek piedāvātas vairākas dizaina iespējas ar 3D vizualizācijām, materiālu ieteikumiem un sākotnējiem inženiertehniskajiem novērtējumiem. Klients izvēlas virzienu detalizētai izstrādei.
      deliverables: 3D koncepcijas attēlojumi, materiālu specifikācijas, projektēšanas pamatojums, sākotnējais BOM
    - stage: '03'
      title: Detalizēta inženierija
      duration: 2-4 nedēļas
      description: Izvēlētais koncepts ir pilnībā izstrādāts — 3D CAD modelēšana, strukturālā analīze, cauruļu konfigurācija, korpusa dizains, piederumu integrācija un ražošanas dokumentācija. Instrumentiem ir norādīti visi izmēri, materiāli un procesi.
      deliverables: Pilns 3D CAD modelis, inženiertehniskie rasējumi, galīgais BOM, instrumentu specifikācijas, kvalitātes kontroles plāns
    - stage: '04'
      title: Prototipēšana
      duration: 2-3 nedēļas
      description: Tiek izstrādāti prototipa instrumenti un izgatavoti funkcionālie paraugi. Klients pārskata prototipu atbilstoši PRD specifikācijām. Testēšana tiek veikta saskaņā ar saskaņoto protokolu. Dizaina pielāgojumi tiek veikti, balstoties uz atsauksmēm pirms ražošanas instrumentu izstrādes.
      deliverables: Funkcionālais prototips, testa ziņojums, dizaina pārskatīšanas žurnāls, klienta apstiprinājuma dokuments
    - stage: '05'
      title: Ražošanas instrumenti
      duration: 2-3 nedēļas
      description: Kad prototips ir apstiprināts, tiek nodoti ekspluatācijā ražošanas instrumenti — veidnes, metināšanas šabloni, griešanas programmas, montāžas detaļas. Kvalitātes kontroles dokumentācija un inspekcijas kritēriji tiek pabeigti. Tiek veikts izmēģinājums procesa validācijai.
      deliverables: Ražošanas rīki, procesa dokumentācija, kvalitātes kontroles inspekcijas plāns, izmēģinājuma ziņojums
    - stage: '06'
      title: Masveida ražošana un kvalitātes kontrole
      duration: Turpinās
      description: Pilna ražošana sākas ar kvalitātes kontroli procesa laikā katrā posmā. Pirmie priekšmeti tiek pārbaudīti un apstiprināti pirms partijas izlaišanas. Nepārtraukta kvalitātes uzraudzība, defektu izsekošana un nepārtraukta uzlabošana visā ražošanas dzīves ciklā.
      deliverables: Ražošanas grafiks, kvalitātes kontroles ziņojumi, partiju izsekojamības ieraksti, piegādes dokumentācija
content_customization:
  tagline: Pielāgošanas opcijas
  title: Kas var būt<br />Pielāgots
  subtitle: Gandrīz katru mūsu produktu aspektu var pielāgot klientu prasībām. Zemāk ir visizplatītākās pielāgošanas kategorijas.
  columns: 3
  items:
    - title: Korpuss un struktūra
      description: Pielāgots korpusa garums, platuma platums, deadrise leņķis, caurules diametrs, kameras konfigurācija un materiāla kvalitāte.
      icon: tabler:sailboat
    - title: Krāsas un grafika
      description: Caurules krāsa (PVC/Hypalon), korpusa gelcoat krāsa, konsoles krāsa, klāja grafika, logotipa izvietojums un iepakojuma dizains.
      icon: tabler:palette
    - title: Konsole un vadība
      description: Centrālās konsoles, sānu konsoles vai stūres stūre. Pielāgots instrumentu paneļa izkārtojums, slēdžu izvietojums un stūres pozīcija.
      icon: tabler:steering-wheel
    - title: Sēdvietas un apdare
      description: Jātnieku sēdekļi, soliņi, luksusa apdare, krāsai saskaņota šuve, salokāmas vai noņemamas konfigurācijas.
      icon: tabler:armchair
    - title: Piederumi un aprīkojums
      description: Niršanas kāpnes, tvertņu turētāji, vilkšanas balsti, T-topi, Bimini jumti, skaņas sistēmas, navigācijas elektronika un drošības aprīkojums.
      icon: tabler:backpack
    - title: Iepakojums un zīmolvedība
      description: Pasūtījuma mazumtirdzniecības iepakojums, privātās preču kastes, sūtījumu kartoni ar zīmolu marķējumiem, karodziņi un lietotāja rokasgrāmatas klienta valodā.
      icon: tabler:box
content_industries:
  tagline: Nozares lietojumprogrammas
  title: Inženierijas risinājumi<br />pēc nozares
  subtitle: Mūsu inženieru komanda ir izstrādājusi produktus plašam jūras lietojumu klāstam — katram ar atšķirīgām prasībām un darbības kritērijiem.
  columns: 3
  items:
    - title: Niršanas operācijas
      description: Pastiprinātas klāja konstrukcijas, niršanas kāpnīšu integrācija, tvertnes uzglabāšanas sistēmas un stabilas platformas komerciāliem niršanas centriem visā pasaulē.
      icon: tabler:lifebuoy
    - title: Glābšana un ārkārtas situācijas
      description: Ātrgaitas korpusu dizaini, pašatvadoši klāji, aprīkojuma montāžas sistēmas un vairāku kameru drošības konfigurācijas SAR operācijām.
      icon: tabler:alert-triangle
    - title: Jūras tūrisms
      description: Pasažieru komforta izkārtojumi, saulessargu integrācija, iekāpšanas sistēmas un degvielu taupošas konfigurācijas salu pārvadājumiem.
      icon: tabler:beach
    - title: Jahtu palīgi
      description: Kompakti dizaini davitu uzglabāšanai, luksusa apdares iespējas, atbilstošas galvenās kuģa krāsas un augstas veiktspējas vilkšanas īpašības.
      icon: tabler:sailboat
    - title: Makšķerēšana un akvakultūra
      description: Plakanā klāja konfigurācijas, dzīvās tvertnes integrācija, makšķerauklu turētāju izkārtojums, pretkorozijas aparatūra nepārtrauktai saskarē ar sālsūdeni.
      icon: tabler:fish
    - title: Osta un rūpniecība
      description: Pastiprināts korpuss smagai ekspluatācijai, darba kuģu izkārtojumi, personāla transporta konfigurācijas un aprīkojuma integrācija jūrniecības darbībām.
      icon: tabler:ship
