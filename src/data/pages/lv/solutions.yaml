features3_solutions:
  tagline: Risinājumi
  title: Jūsu ūdens piedzīvojums<br />Biznesa partneris
  isBeforeContent: false
  columns: 3
  items:
    - title: Ūdens sporta klubi
      description: Pilna aprīkojuma pakas, pielāgota zīmola veidošana un apkalpošanas programmas SUP klubiem, kajaku klubiem, sērfošanas skolām un apmācību centriem.
      icon: tabler:users
      link: /solutions/clubs
    - title: Ūdens sporta RIBs
      description: Mērķtiecīgi RIBs burāšanas skolām, ūdens sporta centriem un pasākumu organizācijām. Treneru laivas, vilkšanas laivas un maršala kuģi profesionāliem ūdens sporta veidiem.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Kūrorti un viesnīcas
      description: Premium ūdens sporta programmas ar flotes aprīkojumu, drošības sistēmām, personāla apmācību un ieņēmumu pārvaldību viesnīcu īpašumiem.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Ūdens zīmolu uzņēmēji
      description: Privātā zīmola OEM/ODM ražošana ar zemu MOQs, pielāgotu produktu dizainu, iepakošanu un globālu piegādi jauniem zīmolu īpašniekiem.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Niršanas centra laivas
      description: Stabilas RIB platformas ar vieglu iekāpšanu/izkāpšanu, aprīkojuma glabāšanu un dzinēju konfigurācijām, optimizētām niršanas operācijām.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Glābšanas un ārkārtas ūdens kuģi
      description: Ātrgaitas RIBs un piepūšamās laivas, paredzētas meklēšanas un glābšanas, ārkārtas reaģēšanas un krasta apsardzes operācijām.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Jahtu tendervieglās risinājumi
      description: Kompakti, stilīgi RIB tenderi, kas papildina superjahtas un atpūtas kuģus. Viegla uzglabāšana, jaudīga veiktspēja.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Zvejas laivu risinājumi
      description: Stabilas, izturīgas piepūšamās laivas un RIBs, konfigurētas komerciālai un atpūtas zvejai.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Jūras tūrisma aprīkojums
      description: Flotē gatavas piepūšamās laivas, SUP dēļi un kajaki kūrortiem, tūrisma operatoriem un ūdens sporta nomas uzņēmumiem.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Jūras enerģija RIBs
      description: Smagās RIBs naftas un gāzes platformu atbalstam, vēja parku apkalpes pārvedumiem, jūras kabeļu pārbaudēm un jūras būvniecībai.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Akvakultūras darba laivas
      description: Korozijizturīgas RIBs zivju audzēšanai, pērļu kultivēšanai un okeāna saimniecībām. Hypalon caurules, nerūsējošā tērauda piederumi, ikdienas lietošanai izturīgas.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Jūras pētniecība un aptauja
      description: Stabilas instrumentiem gatavas RIBs okeanogrāfiskajiem pētījumiem, vides uzraudzībai, ūdens kvalitātes paraugu ņemšanai un universitāšu mācību programmai.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Komerciālās darba laivas
      description: Smagās RIBs patrulēšanai, aptaujai, transportēšanai un jūras loģistikai. Veidotas komerciālo operāciju prasīgajām vajadzībām.
      icon: tabler:ship
      link: /commercial-workboats
