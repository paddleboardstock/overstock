content_customization:
  tagline: Ko var pielāgot
  title: RIB Pielāgošana<br />Opcijas
  subtitle: Katru RIB laivas elementu var pielāgot jūsu pielietojumam, tirgum un zīmola prasībām.
  items:
    - title: Korpuss un konstrukcijas
      description: Korpusa garums (2,5–8,5 m), korpusa materiāls (GRP stiklašķiedras vai jūras klases alumīnijs), korpusa krāsa (gelcoat vai krāsots), ķīļa profils (dziļš V, vidēji V, plakans), pakaļgala tips (slēgts pakaļgals ar kronšteinu vai urbumu) un konstrukcijas pastiprinājums komerciālām slodzes prasībām.
      icon: tabler:sailboat
    - title: Caurule un apkakle
      description: Cauruļu materiāls (0,9–1,2 mm PVC jeb 1,4–1,7 mm Hypalon/CSM), caurules diametrs (40–55 cm), kameru skaits (3–7), vārsta tips (Halkey-Roberts, Leafield D7 vai Boston), caurules krāsa (standarta vai pielāgota) un apkakles konusa/konusa konfigurācija.
      icon: tabler:circle
    - title: Klāja un konsoles izkārtojums
      description: Centrālā konsole, sānu konsole vai stūres stūre. Sēdvietu izkārtojums (jātnieku sēdekļi, sola sēdekļi, balsta sēdekļi). Klāja pārklājums (EVAputuplasta tīkkoka izskats, neslīdoša krāsa vai tīrs GRP). Aprīkojuma stiprinājuma punkti, roktura sliedes un D veida pozīcijas.
      icon: tabler:layout-dashboard
    - title: Elektrība un navigācija
      description: Navigācijas gaismas (LED), ūdens sūkņu sistēma, akumulatoru pārvaldība, VHF radio uzstādīšana, GPS/karšu plotera uzstādīšana, USB uzlādes porti un slēdžu paneļa konfigurācija.
      icon: tabler:bolt
    - title: Zīmolvedība un grafika
      description: Korpusa un cauruļu grafika (sietspiede, siltuma pārnese, UV digitālā druka), logotipu izvietojums, individuālas krāsu shēmas, identifikācijas marķējumi un pielāgota īpašnieka dokumentācija ar jūsu zīmolu.
      icon: tabler:palette
    - title: Drošība un atbilstība
      description: Dizaina kategorijas vērtējums (A/B/C/D katramRCD), ugunsdzēsības sistēma, degvielas sistēmas specifikācija (pārnēsājama tvertne, fiksēta tvertne, zem klāja) un atbilstības dokumentācijas pakete jūsu mērķa tirgum.
      icon: tabler:shield
content_applications:
  tagline: Lietojumprogrammu konfigurācijas
  title: RIB Konfigurācijas<br />Pēc pielietojuma
  subtitle: Dažādām misijām nepieciešamas dažādas konfigurācijas. Šeit ir pārbaudītas konfigurācijas visizplatītākajām RIB lietojumprogrammām.
  items:
    - title: Glābšana un patrulēšana
      description: Dziļas V formas korpuss, Hypalon caurules, pašizsūknējošs klājs, balsta sēdekļi, rokturi, navigācijas lukturi un smagās D-veida gredzeni.RCD Dizaina kategorija B vai C. Ugunsizturīga degvielas sistēma un komerciālas klases elektroinstalācija.
      icon: tabler:lifebuoy
    - title: Niršanas atbalsts
      description: Plats platuma platums, aizmugurējās iekāpšanas kāpnes, tanku statīvu pozīcijas, papildu D veida gredzeni, niršanas karoga stiprinājums, pastiprināts aizmugures nodalījums diviem ārējiem dzinējiem un neslīdošs pilna klāja EVA pārklājums.
      icon: tabler:mask
    - title: Tūrisms un komerciālā darbība
      description: Pasažieru sertificēts izkārtojums ar soliņu, saulessargu/Bimini, rokturiem, sausās uzglabāšanas sistēmu un dubulto bateriju sistēmu.RCD C kategorija. Paredzēts kūrorta un čartera flotes ekspluatācijai.
      icon: tabler:beach
    - title: Makšķerēšana
      description: Atvērta klāja izkārtojums, makšķeres turētāja pozīcijas, dzīvas ēsmas bedre, zivju meklētāja stiprinājums, troļļu motora stiprinājums, pastiprināts pakaļgala stiprinājums un pārnēsājama degvielas sistēma. Centrālās vai sānu konsoles opcijas.
      icon: tabler:fish
    - title: Atpūtas un jahtas piepūšamais laiva
      description: Viegls korpuss, PVC caurules, ērta sēdvieta, teleskopisks stūres rokturis vai kompakts konsole, pacelšanas punkti davitu uzstādīšanai un noņemams degvielas tvertne. RCD Kategorija C vai D.
      icon: tabler:sailboat
    - title: Profesionāla darba laiva
      description: Alumīnija korpusa opcija, izturīga pastiprināšana, hidrauliskā stūres sistēma, komerciālas pakāpes elektriskā sistēma, radara arka un misijai specifisku aprīkojuma integrācijas punkti. Pielāgota atbilstība pēc projekta.
      icon: tabler:anchor
process_steps:
  title: 7 soļu RIB OEM/ODM izstrādes process
  subtitle: No projekta kopsavilkuma līdz pēcpārdošanas atbalstam — definēts darba plūsmas process ar skaidriem posmiem un rezultātiem
  steps:
    - number: '01'
      title: Projekta kopsavilkums un prasības
      description: Definējiet mērķa pielietojumu, korpusa izmēru, cauruļu materiālu, atbilstības prasības un zīmola vajadzības. Mēs izvērtējam iespējamību un apstiprinām sadarbības modeli (OEM/ODM/daļēji pielāgots/pilnībā pielāgots).
      timeline: 3–5 dienas
    - number: '02'
      title: Tehniskā pārbaude un iespējamība
      description: Inženieru komanda pārskata strukturālo iespējamību, stabilitātes un peldošuma aprēķinus, atbilstības ceļu un materiālu pieejamību. Mēs identificējam esošās veidnes vai pielāgotas veidnes prasības.
      timeline: 5–7 dienas
    - number: '03'
      title: Piedāvājums un cena
      description: Saņemiet detalizētu piedāvājumu, tajā ietvertas specifikācijas, 3D renderējumi vai GA zīmējumi, atbilstības apjoms, laika grafiks un vienības cena, pamatojoties uz apjoma līmeņiem un MOQ.
      timeline: 5–7 dienas
    - number: '04'
      title: Dizaina apstiprināšana un paraugu izgatavošana
      description: Apstipriniet galīgo GA, klāja izkārtojumu un cauruļu konfigurāciju. Mēs izgatavojam pirmsražošanas paraugu ar jūsu zīmola krāsām, logo un norādītajiem materiāliem jūsu fiziskai pārbaudei.
      timeline: 15–20 dienas
    - number: '05'
      title: Parauga apstiprināšana un QC protokols
      description: 'Pārbaudiet un apstipriniet paraugu. Definējiet ražošanas QC protokolu: spiediena tests (1,25x / 24–48h), dimensiju pārbaudes un atbilstības dokumentācijas kontrolsaraksts katram korpusam.'
      timeline: 3–5 dienas
    - number: '06'
      title: Masveida ražošana un kvalitātes kontrole
      description: Pilna ražošanas partija ar 100 punktu QC kontrolsarakstu katrai vienībai. Procesa laikā veicam pārbaudes, spiediena testus un sērijas līmeņa izsekojamību. CE/ISO dokumentācija sagatavota paralēli.
      timeline: 30–45 dienas
    - number: '07'
      title: Iepakošana, piegāde un pēcpārdošanas atbalsts
      description: Pielāgota iepakošana (standarta, mazumtirdzniecībai gatava vai paletēta), eksporta dokumentācija, konteineru iekraušana un loģistika. Iekļauti rezerves daļu komplekti un apkalpošanas dokumentācija.
      timeline: 7–14 dienas
certifications:
  title: Atbilstība un sertifikāti RIB laivām
  subtitle: Katrs pielāgots RIB pasūtījums tiek piegādāts ar modeļa specifisku atbilstības dokumentāciju
  items:
    - name: CE 2013/53/ES
      description: RCD atbilstība katram modelim un dizaina kategorijai — DoC, ražotāja plāksnīte, īpašnieka rokasgrāmata iekļauta
      badge: CE
    - name: ISO 9001:2015
      description: Kvalitātes vadības sistēma, ko sertificējis SGS, aptverot projektēšanu, ražošanu un izplatīšanu
      badge: ISO
    - name: LV ISO 6185
      description: Piepūšamās laivas būvniecības standarts — stabilitāte, peldspēja un cilvēka izcelšana pār bortu
      badge: 6185
    - name: LV ISO 14945
      description: Celtnieka plāksnes standarts — pastāvīgi atzīmēta identifikācijas un kapacitātes informācija
      badge: 14945
    - name: BSCI
      description: Sociālās atbilstības audits ētiskai ražošanai — nepieciešams ES mazumtirgotājiem
      badge: BSCI
    - name: REACH
      description: ES ķīmisko vielu drošības atbilstība PVC, Hypalon, līmvielām un pārklājumiem
      badge: REACH
content_service_modules:
  tagline: Servisa moduļi
  title: OEM/ODM pakalpojums<br />Moduļi
  subtitle: Katrs projekts apvieno pareizos pakalpojumu moduļus. Ne katram projektam ir nepieciešams katrs modulis — mēs ieskatu tikai to, kas nepieciešams jūsu projektam.
  items:
    - title: Inženierijas pārskats un dzīvotspēja
      description: 'Klāja platformas novērtējums, struktūras dzīvotspējas pārbaude, stabilitātes un peldošības verifikācija, atbilstības ceļa noteikšana un materiālu pieejamības apstiprinājums. Rezultāts: dzīvotspējas ziņojums ar turpināšanas/nestartēšanas ieteikumu.'
      icon: tabler:math-function
    - title: Dizains un konfigurācija
      description: 'GA zīmējums, klāja izkārtojums, cauruļu konfigurācija, konsoles un sēdvietu pozīcijas, aprīkojuma uzstādīšanas plāns un krāsu/materiālu izvēle. Rezultāts: apstiprināts GA un konfigurācijas specifikācija.'
      icon: tabler:ruler
    - title: Paraugs un prototips
      description: Priekšražošanas paraugs ar apstiprinātām krāsām, logotipu un norādītajiem materiāliem fiziskai pārbaudei. Ietver parauga apstiprināšanas protokolu, pārbaudes kontrolsarakstu un izmaiņu pieprasījuma procesu.
      icon: tabler:3d-cube-sphere
    - title: Ražošana un kvalitātes kontrole
      description: Masveida ražošana ar 100 punktu kvalitātes kontroles sarakstu katrai vienībai, procesā veiktas pārbaudes, spiediena tests (1,25x / 24-48 stundas) un seriāla līmeņa izsekojamība. CE/ISO dokumentācija sagatavota paralēli.
      icon: tabler:clipboard-check
    - title: Zīmols un Iepakojums
      description: Privātā zīmola logotipa pielietojums, pielāgoti korpusa un cauruļu grafikas dizaini, zīmola īpašnieka dokumentācija, mazumtirdzniecībai gatava vai paletēta iepakošana un rezerves daļu komplekta sagatavošana.
      icon: tabler:palette
    - title: Eksports un dokumentācija
      description: Eksporta iepakošana, konteineru iekraušanas plāns, FOB/CIF/DDP dokumentācija, atbilstības dokumentācija atbilstoši galamērķa tirgum un saziņas protokols pēc piegādes.
      icon: tabler:world
content_risk_control:
  tagline: Risks un piegādes kontrole
  title: Projekta risks &<br />Piegādes pārvaldība
  subtitle: Profesionāli OEM/ODM pircēji tikpat daudz rūpējas par riska kontroli kā par produkta kvalitāti. Šeit ir tas, kā mēs to pārvaldām.
  items:
    - title: Apjoma un īpašumtiesību definīcija
      description: 'Pirms izstrādes sākuma mēs rakstiski definējam: pielāgošanas apjomu, instrumentu prasības, paraugu apstiprināšanas kritērijus, rasējumu un veidņu īpašumtiesības, kā arī dokumentācijas pienākumus. Nav nekādu neskaidrību par to, kam pieder kas.'
      icon: tabler:file-text
    - title: Izmaiņu kontroles process
      description: Visas specifikācijas izmaiņas pēc dizaina apstiprināšanas seko dokumentētam izmaiņu pieprasījuma procesam ar ietekmes novērtējumu (izmaksas, termiņš, atbilstība). Nevienas neapstiprinātas izmaiņas nenonāk ražošanā.
      icon: tabler:arrows-diff
    - title: Partiju konsekvences garantija
      description: 50. vienība atbilst pirmajam apstiprinātajam paraugam. Apstiprinātās specifikācijas tiek iesaldētas, materiālu un procesa parametri fiksēti, un procesā esošie kontrolpunkti pārbauda konsekvenci visā ražošanas posmā.
      icon: tabler:repeat
    - title: Piegāde un kapacitātes caurspīdīgums
      description: Izpildes laiki tiek norādīti, balstoties uz faktisko ražošanas jaudu, materiālu krājumu līmeni un pašreizējo pasūtījumu apjomu — nevis uz ambicioziem mērķiem. Ražošanas grafiks ar posmiem katram pasūtījumam tiek norādīts.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Biežāk uzdotie jautājumi
  questions:
    - q: Kāda ir atšķirība starp OEM un ODM RIB laivām?
      a: 'OEM (Oriģinālā aprīkojuma ražošana): jūs sniedzat detalizētas specifikācijas, un mēs izstrādājam jūsu dizainu.ODM (Oriģinālā dizaina ražošana): jūs izvēlaties pārbaudītu Aquafarer RIB platformu, un mēs to pielāgojam ar jūsu vēlamajām funkcijām un zīmolu.ODM ir ātrāka un lētāka;OEM nodrošina maksimālu dizaina kontroli.'
    - q: Vai es varu pielāgot RIB korpusa formu un izmēru?
      a: Jā. Mēs piedāvājam daļēji pielāgotas modifikācijas esošajām korpusa veidnēm (dažādi klāja izkārtojumi, cauruļu konfigurācijas) un pilnu pielāgotu korpusa izstrādi ar jaunāmCNC, apstrādātām veidnēm. Daļēji pielāgoti projekti var sākties ar 2-5 vienībām; pilnībā pielāgoti parasti prasa lielāku apņemšanos.
    - q: Kādi cauruļu materiāli ir pieejami individuāli izgatavošanaiRIBs?
      a: Mēs piedāvājam 0,9–1,2 mm PVC rekreācijai un vieglai komerciālai lietošanai, kā arī 1,4–1,7 mm Hypalon/CSM profesionālām, glābšanas un komerciālām vajadzībām, kurām nepieciešama izcila UV un ozona izturība (10–15 gadi pret 5–8 gadiemPVC).
    - q: Vai vari konfigurēt RIBs specifiskām lietojumprogrammām, piemēram, glābšanai, niršanai vai makšķerēšanai?
      a: Jā. Mēs uzturam pārbaudītas konfigurācijas veidnes glābšanas/patrulēšanas, niršanas atbalsta, tūrisma/čartera, makšķerēšanas, jahtu apkalpes un profesionālu darba laivu pielietojumiem. Katra veidne ietver ieteicamo korpusa veidu, cauruļu materiālu, klāja izkārtojumu un aprīkojumu — ko mēs pēc tam pielāgojam tieši jūsu prasībām.
    - q: Kādu informāciju jums vajag, lai saņemtu RIB OEMpiedāvājumu / piedāvājumuODM?
      a: Mērķa pielietojums, vēlamais korpusa garums, cauruļu materiāla izvēle (PVCvai), Hypalonaptuvenais daudzums un piegādes grafiks, mērķa tirgus atbilstības prasības un jebkuri atsauces produkti vai specifikācijas. Jo vairāk detaļu sniegsiet, jo ātrāks un precīzāks būs mūsu piedāvājums.
    - q: Kas ir MOQ paredzēts pielāgotām RIB laivām?
      a: Esošajām korpusa veidnēm ar standarta modifikācijām MOQ sākas ar 2-5 vienībām katrā dizainā. Pielāgotām veidnēm un pilnībā pielāgotai izstrādei MOQ tas atkarīgs no projekta sarežģītības — parasti 10-20 vienības puspielāgotām un 30 pilnībā+ pielāgotām ar jauniem instrumentiem.
    - q: Kam pieder pielāgotās veidnes un rasējumi?
      a: Veidnes, kas izstrādātas, izmantojot Aquafarer bāzes dizainus Aquafarer , paliek īpašums. Pilnībā pielāgotas veidnes, ko pasūtījis un apmaksājis klients, var nodot klienta īpašumtiesībām saskaņā ar līguma noteikumiem. Visi veidņu īpašumtiesību noteikumi tiek dokumentēti pirms projekta uzsākšanas.
    - q: Kā tiek RIBs iepakotas pielāgotas eksportam?
      a: 'Standarts: pielāgota šūpuļa + stiepšanās plēve konteineru iekraušanai. Premium: mazumtirdzniecībai gatavs iepakojums, vakuuma iepakojums vai paletes iepakojums. Mēs piedāvājam FOB Qingdao, CIF, un DDP piegādi. Iekļauta pilna eksporta dokumentācija un muitas norēķini.'
