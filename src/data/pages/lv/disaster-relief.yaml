  description: Paddle Board Overstock Ražo piepūšamās laivas, kas izstrādātas katastrofu seku likvidēšanai un humānās palīdzības operācijām. Plūdu glābšana, MEDEVAC, palīdzības piegāde un personāla transports.CE Sertificēts. Pielāgotas konfigurācijas palīdzības aģentūrām un valsts ārkārtas dienestiem.
