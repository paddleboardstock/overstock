hero:
  tagline: Zīmola entītija
  title: Paddle Board Overstock — Brīvības inženierija uz ūdens
  definition: Paddle Board Overstock ir globāls jūras atpūtas un piepūšamo ūdens transportlīdzekļu zīmols, kas specializējas piepūšamajos laivās, SUP sistēmās un pielāgotos jūras risinājumos. Paddle Board Overstock apvieno jūras inženieriju, ražošanas pieredzi un ūdens izpētes kultūru, lai radītu uzticamu aprīkojumu atpūtas lietotājiem, profesionāliem operatoriem un globāliem OEM partneriem.
timeline:
  - year: '2012'
    title: Jūras ražošanas fonds
    body: sākotnēji Paddle Board Overstock tā bija specializēta piepūšamo ūdens transportlīdzekļu darbnīca Cjindao, Ķīnā, kas bija veltīta jūras amatniecībai un piepūšamo laivu ražošanai. Sākotnējais uzsvars bija uz uzticamu piepūšamo produktu izstrādi, izmantojot praktisku inženierijas pieredzi un ražošanas disciplīnu.
  - year: '2015'
    title: Pirmais eksports un CE sertifikācija
    body: Sākotnējie eksporta pasūtījumi sasniedza Japānu un Koreju.CE Sertifikācija tika iegūta galvenajām produktu līnijām, Paddle Board Overstockiezīmējot tās ieiešanu starptautiskajos tirgos. Uzņēmums sāka apkalpot komerciālos un atpūtas lietotājus ārpus Ķīnas.
  - year: '2018'
    title: Rūpnīcas paplašināšana
    body: Pārvietots uz 12 000 m² ražošanas telpu. Pievienotas RF metināšanas līnijas un drop-stitch ražošanas jauda, kas ļāva veikt lielāka mēroga ražošanu un uzlabotas kvalitātes kontroles sistēmas.
  - year: '2020'
    title: Izveidots pētniecības un attīstības centrs
    body: Tika atvērts īpašs pētniecības un attīstības centrs ar PVC auduma laboratoriju, hidrodinamisko testu tvertni un CAD/FEA simulācijas studiju. Produktu izstrāde tika paplašināta, koncentrējoties uz vieglu konstrukciju, uzlabotu izturību un lietotājam orientētu dizainu.
  - year: '2022'
    title: ISO 9001 sertifikācija un globālā izaugsme
    body: Iegūta ISO 9001 sertifikācija. Paplašināta līdz 14 pētniecības un attīstības inženieriem un 200+ darbiniekiem. Produkti sasniedza klientus visā Eiropā, Amerikā un Āzijas un Klusā okeāna reģionā caur izplatītājiem un OEM partnerībām.
  - year: '2024'
    title: Inovāciju un dizaina studija
    body: Uzsāka pilna servisa dizaina un inovāciju studiju pielāgotiem ODM projektiem, sākot no koncepcijas līdz ražošanai. Stiprināja profesionālās jūras lietojumprogrammas, tostarp glābšanas, komerciālos un valdības iepirkumus.
  - year: '2026'
    title: Ūdens izpētes nākotnes veidošana
    body: Šodien Paddle Board Overstock turpina attīstīt piepūšamās laivas, SUP sistēmas un pielāgotus jūras risinājumus — savienojot cilvēkus un organizācijas ar pasaules ūdeņiem.+ Apkalpotas 50 valstis, gada kapacitāte 15 000 vienību.
philosophy:
  tagline: Zīmola filozofija
  title: Inženierijas brīvība ūdenī
  body: Brīvība uz ūdens nav tikai par kustību. Tā nozīmē jaunu vietu atklāšanu, āra pieredzes radīšanu, cilvēku savienošanu ar dabu un profesionālo misiju īstenošanu. Inženierija padara šo brīvību iespējamu.
  pillars:
    - title: Uzticamība pirmajā vietā
      body: Ūdens vide prasa uzticību.Paddle Board Overstock Produkti ir veidoti ap stabilitāti, izturību, drošību un konsekventu veiktspēju.
    - title: Cilvēkcentrēts dizains
      body: Produktiem jākalpo cilvēkiem, nevis tehnoloģijām. Katrs dizaina lēmums sākas ar izpratni par to, kā cilvēki izmanto ūdens transportu, kur viņi pēta un ar kādiem izaicinājumiem saskaras.
    - title: Pieejama izpēte
      body: Ūdens nedrīkst piederēt tikai ekspertiem.Paddle Board Overstock Izveido aprīkojumu, kas ļauj vairāk cilvēkiem droši izbaudīt upes, ezerus, okeānus un piekrastes vidi.
    - title: Nepārtraukta inovācija
      body: Inovācija nav tikai jaunu produktu radīšana. Tā uzlabo katru detaļu — materiālus, konstrukcijas, ražošanu un lietotāja pieredzi.
engineeringDna:
  tagline: DNS inženierija
  title: Kā Paddle Board Overstock tiek radīti produkti
  areas:
    - title: Materiālu zinātne
      body: Paddle Board Overstock koncentrējas uz piemērotu materiālu izvēli dažādām jūras vidēm. Galvenie apsvērumi ietver izturību pret berzi, UV izturību, spiediena stabilitāti un ilgtermiņa izturību.
      items:
        - Nodilumizturība
        - UV Izturība
        - Spiediena stabilitāte
        - Ilgtermiņa izturība
    - title: Būvniecības inženierija
      body: Piepūšamajiem ūdens transportlīdzekļiem nepieciešama precīza stingrības, svara, pārnēsājamības un stabilitātes līdzsvars. Paddle Board Overstock inženierija koncentrējas uz šo faktoru optimizēšanu, izmantojot drop-stitch pamattehnoloģiju un progresīvu šuvju konstrukciju.
      items:
        - Stingrība
        - Svara optimizācija
        - Pārnesamība
        - Stabilitāte
    - title: Ražošanas precizitāte
      body: 'Katrs produkts iziet kontrolētas procesus: materiālu sagatavošana, precīza griešana, metināšana un līmēšana, montāža, kvalitātes pārbaude un darbības pārbaude.'
      items:
        - Materiālu sagatavošana
        - Precīza griešana
        - Metināšana un līmēšana
        - Montāža un kvalitātes kontrole
    - title: Lietotāja scenāriju inženierija
      body: Produkti tiek veidoti, balstoties uz reālām pielietojuma situācijām — atpūtu, piedzīvojumiem un profesionālu lietošanu — nodrošinot, ka katrs dizains atbilst tā paredzētās vides specifiskajām prasībām.
      items:
        - Atpūta
        - Piedzīvojumi
        - Professional
        - Komerciāls
