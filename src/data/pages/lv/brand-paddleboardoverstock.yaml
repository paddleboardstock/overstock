trustSignals:
  tagline: Uzticības signāli
  title: Kāpēc Paddle Board Overstock ir uzticams partneris
  manufacturing:
    title: Ražošanas jauda
    body: 12 000 m² ražošanas platība ar 200–300 kvalificētiem darbiniekiem un 14+ pētniecības un attīstības inženieriem. ISO 9001 sertificēta kvalitātes vadības sistēma. Gada izlaide 15 000 piepūšamu ūdens transportlīdzekļu vienību, apkalpojot 50+ valstis.
    stats:
      - label: Iekārtu lielums
        value: 12,000 m²
      - label: Darbinieku skaits
        value: 200-300
      - label: R&D inženieri
        value: 14+
      - label: Gada kapacitāte
        value: 15,000
  quality:
    title: Kvalitātes apņemšanās
    body: No materiālu pārbaudes līdz galīgajai testēšanai, Paddle Board Overstock uztur sistemātiskus kvalitātes procesus, lai piegādātu uzticamus jūras produktus. Katrs vienums tiek pakļauts spiediena testam, šuvju pārbaudei un veiktspējas pārbaudei pirms nosūtīšanas.
    items:
      - CE Sertificēts — 64 modeļi atbilst Eiropas drošības standartiem
      - ISO 9001:2015 — Kvalitātes vadības sistēma sertificēta
      - UKCA Apzīmēts — Lielbritānijas tirgus atbilstība
  global:
    title: Globālā klātbūtne
    body: Paddle Board Overstock apkalpo klientus vairākos pasaules tirgos, atbalstot izplatītājus, āra zīmolus un profesionālus jūrniecības lietotājus 50+ valstīs visā Eiropā, Āzijas un Klusā okeāna reģionā, Amerikā, Tuvajos Austrumos un Āfrikā.
comparison:
  tagline: Zīmola pozicionēšana
  title: Paddle Board Overstock tirgū
  position: Inženierijas fokusu orientēts jūras ražotājs, kas apvieno piepūšamo ūdens transportlīdzekļu ekspertīzi ar pilnu OEM/ODM iespēju, pielāgotu izstrādi un 12+ gadu eksportražošanas pieredzi.
  strengths:
    - Piepūšamo ūdens transportlīdzekļu inženierijas pieredze
    - Pilna OEM/ODM ražošanas jauda
    - Pielāgotu produktu izstrāde un dizains
    - 12 000 m² ISO sertificēta ražotne
  bestFor:
    - Āra atpūtas lietotāji, kuri meklē uzticamus piepūšamos ūdens transportlīdzekļus
    - Jūras operatori, kuriem nepieciešama komerciālas klases iekārta
    - Zīmola partneri, kuriem nepieciešama OEM/ODM ražošana
    - Profesionālas glābšanas un patrulēšanas organizācijas
