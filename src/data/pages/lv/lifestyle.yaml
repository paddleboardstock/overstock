hero:
  tagline: Dzīvesveids
  title: The Paddle Board Overstock<br />Dzīvesveids
  subtitle: Būvēts tiem, kas dzīvo uz ūdens — no nedēļas nogales pētniekiem līdz komerciāliem operatoriem, kuri paļaujas uz savu aprīkojumu katru dienu.
values:
  - icon: 🌊
    title: Dzimis uz ūdens
    desc: Katrs dizains sākas ar izpratni par to, kā ūdens uzvedas. Mēs projektējam, sākot no apstākļu robežām uz iekšpusi — jo okeāns ir mūsu skolotājs, nevis darba vieta.
  - icon: 🔧
    title: Veidots izturībai
    desc: Ilgtspējīgākais produkts ir tas, ko nav nepieciešams aizstāt. Jūras līmeņa materiāli, drop-stitch kodoli ar vērtējumu līdz 15 PSI un šuves, kas iztur sezonu.
  - icon: 🏆
    title: Piekļūstams pēc dizaina
    desc: Ūdens sports nedrīkst būt luksuss. Profesionāla līmeņa veiktspēja par cenu, kas ir saprātīga ģimenēm, gidiem un maziem operatoriem — ne tikai komerciālajām flotēm.
  - icon: 🌍
    title: Globālā kopiena
    desc: 'No Qingdao krasta līdz ezeriem Eiropā, upēm Dienvidaustrumu Āzijā un līčiem Amerikās — mūsu klientiem ir viena kopīga lieta: mīlestība būt uz ūdens.'
  - icon: ♻️
    title: Atbildīga ražošana
    desc: CNC optimizētā līdzināšana samazina materiālu atkritumus līdz zem 5%. Izturīga konstrukcija samazina nomaiņas ciklus. Mēs būvējam ilgvērtīgumam, jo tas ir visilgtspējīgākais risinājums.
  - icon: 🤝
    title: Atbalsts, kas ilgst
    desc: Divdesmit gadus veci korpusi joprojām zvana mums pēc rezerves daļām. Mūsu garantijas atbildes vidējais laiks ir 24 stundas. Mēs nepazūdam pēc pārdošanas — mēs esam šeit produkta mūža garumā.
