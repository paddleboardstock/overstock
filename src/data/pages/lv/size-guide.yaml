hero:
  title: Izmēru un specifikāciju ceļvedis
  subtitle: Izmēri, ietilpība un ieteicamie lietojumi katram Paddle Board Overstock produktam.
categories:
  inflatable: Piepūšamie SUPs un kajaki, kas izstrādāti pārnēsāšanai, nezaudējot veiktspēju. Saskaņojiet pareizo izmēru ar savu svaru un airēšanas stilu.
  rib: Cietas korpusa piepūšamās laivas piekrastes navigācijai, patrulēšanai un profesionālām jūras operācijām. Izvēlieties pēc garuma un dzinēja jaudas.
  accessory: Aksesuāri un drošības aprīkojums, kas papildina jūsu ūdens transportlīdzekli. Universālas izmēru iespējas ar vairākiem variantiem.
table:
  headers:
    product: Produkts
    length: Garums
    width: Platums
    weight: Svars
    max_load: Maksimālā slodze
    best_for: Labākais priekš
how_to_choose:
  title: Kā izvēlēties pareizo izmēru
  cards:
    - title: SUP Dēļi
      description: Izvēlieties garumu, balstoties uz savu svaru un paredzēto lietojumu. Platākas dēļi (32"+) nodrošina lielāku stabilitāti. Garāki dēļi (11-12 pēdas) labāk seko kursam tūrisma braucieniem. Smagākiem airētājiem nepieciešami dēļi ar lielāku tilpumu.
    - title: Kajaki
      description: Vienvietīgie kajaki (9 pēdas) ir vispiemērotākie solo ceļojumiem un upēm. Tandēma kajaki (12 pēdas) piemēroti diviem airētājiem vai vienam pieaugušajam ar ekipējumu. Pārbaudiet svara ietilpību kopējai slodzei, ieskaitot ekipējumu.
    - title: Laivas & RIBs
      description: Izvēlieties laivas garumu pēc pasažieru skaita un paredzētā lietojuma. Lielākas RIBs (4,5 m+) piemērotas atklātām jūrām un glābšanas operācijām. Mazākas laivas (2,7 m) der kā palīglaivas un makšķerēšanas platformas.
