  - label: Objekta izmērs
    value: 12 000 m² (130 000 ft²) integrētais kampuss Čingdao ekonomiskās attīstības zonā
  - label: Gada kapacitāte
    value: 15 000 laivu, tostarp SUPskajaki, švertlaivas RIBsun drošības aprīkojums
  - label: R&D komanda
    value: 25+ inženieri produktu dizainā, materiālzinātnē un kvalitātes inženierijā
  - label: Galvenais aprīkojums
    value: CNC griešanas galdi, RF dielektriskie metinātāji, karstā gaisa hermetētāji, digitālie printeri, stiklašķiedras veidnes, gaisa noturības testēšanas iekārtas
  - label: Ražošanas līnijas
    value: '6 speciālas līnijas: PVC griešana, cauruļu metināšana, stiklašķiedras korpusa kārtošana, SUP montāža, RIB montāža, galīgā kvalitātes kontrole'
  - label: Gada eksporta apjoms
    value: 8 miljoni ASV dolāru+ eksportēti uz 50+ valstīm Eiropā, Amerikā, Āzijas un Klusā okeāna reģionā un Tuvajos Austrumos
