  subtitle: Mūsu 64 CE-sertificētie modeļi atbilst starptautiskajiem drošības un kvalitātes standartiem.
values:
  - title: Kvalitāte pirmajā vietā
    desc: Katrs laiva, kas pamet mūsu rūpnīcu, pirms nosūtīšanas iziet obligāto gaisa noturības, šuvju plēšanas un sistēmu testēšanu.
  - title: Vertikālā integrācija
    desc: Mēs kontrolējam katru posmu — no PVC griešanas līdz galīgajai montāžai — novēršot līgumslēdzēju neefektivitāti un nodrošinot konsekventu kvalitāti.
  - title: Drošība kā standarts
    desc: CE sertifikācija ir būtiska tam, ko mēs būvējam. Mūsu 64 CE-sertificētie modeļi atbilst ES drošības standartiem atpūtas un komerciālai izmantošanai.
  - title: Partnerorientēts
    desc: Mēs veidojam ilgtermiņa attiecības ar OEM, ODM un privātā zīmola partneriem, balstoties uz caurskatāmību, uzticamību un kopīgu izaugsmi.
services:
  - title: OEM ražošana
    desc: Mēs ražojam pēc jūsu specifikācijām. Kopīgojiet savus zīmējumus, un mūsu inženieru komanda nodrošinās prototipu, instrumentu un ražošanas izstrādi.
  - title: ODM risinājumi
    desc: Sāciet no mūsu pārbaudītajiem platformu dizainiem. Pielāgojiet izmēru, krāsu, grafiku un iepakojumu, lai izveidotu savu unikālo produktu līniju.
  - title: Privātais zīmols
    desc: Jūsu zīmola nosaukums, jūsu logotips, jūsu iepakojums. Produkti tiek piegādāti gatavi mazumtirdzniecībai ar pilnīgu zīmola integrāciju.
  - title: Pielāgota zīmola veidošana
    desc: Virsmas pad drukāšana, korpusa grafikas, caurules uzlīmes un pielāgotas etiķetes — konsekventa zīmola klātbūtne uz katras virsmas.
certifications:
  - name: CE sertifikācija
    desc: Mūsu laivas un ūdens transportlīdzekļi atbilst ES Atpūtas kuģu direktīvai (2013/53/ES) un attiecīgajiem harmonizētajiem standartiem.
    scope: Laivas un ūdens transportlīdzekļi
  - name: null
    desc: Kvalitātes vadības sistēma sertificēta piepūšamo ūdens transportlīdzekļu dizainam, ražošanai un izplatīšanai.
    scope: Visa rūpnīca
  - name: null
    desc: Piepūšamās laivas — drošības un veiktspējas prasības pastiprinātām un stingrās korpusa piepūšamajām laivām.
    scope: RIB & piepūšamās līnijas
