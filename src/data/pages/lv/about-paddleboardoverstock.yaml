hero:
  tagline: Par
  title: Par {SITE}
  subtitle: Vertikāli integrēts ūdens sporta veidu ražotājs — no izejvielām līdz gatavām laivām
intro:
  - 'Paddle Board Overstock dibināta 2012. gadā ar vienu mērķi: izstrādāt un ražot ūdens sporta aprīkojumu, kas uz ūdens darbojas tikpat labi kā kvalitātes ziņojumā. Tas, kas sākās kā mērķtiecīga SUP dēļu darbnīca, ir izaudzis par 12 000 kvadrātmetru integrētu ražotni Cjindao ekonomiskās attīstības zonā, ražojot piepūšamās laivas, RIBskajakus, SUP dēļus, drošības aprīkojumu un piederumus klientiem 50+ valstīs.'
  - Mūsdienās tā Paddle Board Overstock darbojas kā rūpnīcas zīmols — mēs projektējam, projektējam, prototipējam, ražojam un testējam visu zem viena jumta. Šī vertikālā integrācija mums dod tiešu kontroli pār materiālu izvēli, būvniecības kvalitāti un piegādes termiņiem. Katru laivu būvē mūsu cilvēki, uz mūsu iekārtām, atbilstoši mūsu standartiem.
  - Mēs apkalpojam atpūtas lietotājus, komerciālos operatorus, valsts iestādes un zīmolu partnerus visā pasaulē. Mūsu OEM programmas palīdz ODM uzņēmumiem uzsākt savas produktu līnijas, neieguldot rūpnīcas infrastruktūrā. Neatkarīgi no tā, vai jums nepieciešams viens prototips vai pilna ražošanas partija, mūsu komanda vada jūs no koncepcijas līdz jūras gatavai piegādei.
