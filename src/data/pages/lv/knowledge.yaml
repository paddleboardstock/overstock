hero:
  tagline: Zināšanu grafiks
  title: Ūdens izpētes zināšanas
  subtitle: |
    Strukturēta zināšanu bāze par uzpūšamās SUP tehnoloģiju,<br />
    ūdens drošība, laivu inženierija un piedzīvojumu plānošana.
  taglineSection: Izpēti. Mācies. Dari droši.
clusters:
  tagline: Zināšanu klasteri
  title: Izpētiet pēc tēmas
  subtitle: Dziļas iegrimes tehnoloģijā, drošībā un prasmēs aiz katra Paddle Board Overstock produkta.
  items:
    - title: SUP Zināšanas
      description: No pirmā dēļa izvēles līdz progresīvām tūrisma tehnikām — viss par stāvošās airēšanas dēli.
      icon: tabler:lifebuoy
      topics:
        - Kā izvēlēties savu pirmo uzpūšamo SUP
        - Labākais SUP izmērs iesācējiem
        - Cik grūti ir airēšanas dēlis?
        - 'Salīdzinājums: piepūšamā pret cieto dēli'
        - SUP drošības kontrolsaraksts
    - title: Laivu zināšanas
      description: Tehniskie ceļveži par piepūšamajām laivām, RIBs, laiviņām un kajakiem — inženierija, materiāli un ekspluatācija.
      icon: tabler:sailboat
      topics:
        - Piepūšamo laivu veidi izskaidroti
        - PVC pret Hypalon salīdzinājums
        - RIB pret Dinghy salīdzinājums
        - Drop-stitch tehnoloģiju padziļināta izpēte
        - Jūras materiālzinātnes rokasgrāmata
    - title: Drošības zināšanas
      description: Būtiskas drošības zināšanas katram airētājam — no PFD izvēles līdz laikapstākļu izpratnei un patstāvīgas glābšanas tehnikām.
      icon: tabler:shield
      topics:
        - SUP drošības kontrolsaraksts
        - Vai jums nepieciešams glābšanas vesti?
        - Okeāna airēšanas drošības ceļvedis
        - Upes drošība piepūšamajām kajakiem
        - Laika apstākļu un ūdens stāvokļa izpratne
    - title: Tehnoloģija
      description: Inženierija aiz Paddle Board Overstock produktiem — materiāli, būvniecības metodes un kvalitātes pārbaude.
      icon: tabler:microscope
      topics:
        - Jūras līmeņa PVC tehnoloģija
        - Drop-stitch Kodola skaidrojums
        - Kāpēc PSI tas ir svarīgi piepūšamajām ierīcēm SUPs
        - RF metināšana pret līmēšanu
        - Kvalitātes testēšana un sertifikācija
    - title: Biznesa zināšanas
      description: Komerciālie ceļveži, kā veidot un paplašināt savu ūdens sporta biznesu — no nomas operācijām līdz privātā zīmola zīmola veidošanai.
      icon: tabler:briefcase
      topics:
        - Kā uzsākt SUP nomas biznesu
        - Kūrorta ūdens sporta centra būvniecība
        - SUP dēļu flotes izmēri klubiem
        - Piepūšamie pret cietajiem SUP komerciālai lietošanai
        - Labākais kajaku materiāls nomas autoparkiem
        - Privātā zīmola ūdens zīmola izveide
        - Kūrorta ūdens sporta ieņēmumu stratēģijas
        - Komerciālo iekārtu apkopes ceļvedis
