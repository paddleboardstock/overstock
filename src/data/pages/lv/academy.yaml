cta:
  title: Nezini, ar ko sākt?
  desc: Izpildi mūsu prasmju novērtēšanas testu, lai atrastu pareizos ceļvežus un aprīkojumu savam līmenim.
  label: Sazinies ar mums →
  link: /contact
