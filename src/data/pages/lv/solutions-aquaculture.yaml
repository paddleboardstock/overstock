content_challenge:
  tagline: Izaicinājums
  title: Akvakultūras prasības<br />Aprīkojums, kas iztur sālsūdeni
  subtitle: Zivju audzētavas, pērļu fermas un jūras fermas darbojas visspēcīgāk agresīvā jūras vidē — ilgstoša iedarbība uz sālsūdeni, degvielas un barības atlikumi un nepārtraukta ikdienas lietošana.
  paragraphs:
    - Akvakultūras darbības notiek 365 dienas gadā atklātās piekrastes un jūras zonās. Darba laivas, ko izmanto būru pārbaudei, barības transportēšanai, pērļu līniju uzturēšanai un aprīkojuma apkalpošanai, pastāvīgi saskaras ar sālsūdens iedarbību, UV ekspozīciju un ķīmisku kontaktu no degvielas, zivju barības un anti-novecošanās līdzekļiem.
    - '**Korozija ir galvenais ienaidnieks** — Standarta jūras aprīkojums šādos apstākļos strauji nolietojas. Ārējie motori, piekabju rāmji un korpusa stiprinājumi pastāvīgi jāaizstāj. Operatoriem ir nepieciešamas laivas, kas izgatavotas no korozijizturīgiem materiāliem, kas spēj izturēt gadus šajā vidē, nesabojājoties.'
    - '**Ikdienas uzticamība ir kritiska** — Salauzta darba laiva nozīmē nokavēt barošanas grafikus, aizkavēt ražu un radīt dārgus ražošanas zaudējumus. Pērļu fermām viena nokavēta pārbaudes diena var radīt būtiskus ražas bojājumus. Zivju fermām kavēta barošana ietekmē izaugsmi un rentabilitāti.'
    - Paddle Board Overstock akvakultūras RIBs laivas ir izstrādātas ar korozijizturīgu aparatūru, izturīgiem Hypalon caurulēm un pastiprinātu korpusu, speciāli paredzētiem prasīgajiem zivju audzēšanas, pērļu kultivēšanas un jūras fermu darbības apstākļiem.
content_solution:
  tagline: Mūsu risinājums
  title: Mērķim veidots RIBs<br />Akvakultūras nozarei
  subtitle: Katra Paddle Board Overstock akvakultūras darba laiva ir izstrādāta, lai izturētu agresīvu sālsūdens vidi, nodrošinot uzticamu ikdienas darbību.
  list:
    - Jūras klases Hypalon caurules — izcila izturība pret UV, sālsūdeni, degvielu un zivju barības ķīmiskām vielām
    - 316 nerūsējošā tērauda aparatūra visā laivā — bez rūsas ilgstošas sālsūdens iedarbības laikā
    - Pastiprināti berzes strīpējumi un ķīļa aizsargs biežai kontaktēšanai ar piestātni un būriem
    - Pašiztukšojošs klājs ērtai mazgāšanai un drenāžai pēc barības transportēšanas un ražas darbībām
    - Plakana klāja konfigurācija barības maisu, ražas tvertņu un aprīkojuma pārvadāšanai
    - Ārējās konfigurācijas no 15 HP līdz 60 HP — optimizētas attiecībā uz kravas un degvielas efektivitāti
    - Augstas redzamības cauruļu krāsu opcijas vieglai novērošanai lielās lauksaimniecības teritorijās
content_segments:
  tagline: Akvakultūras profili
  title: Darba laivu risinājumi<br />Pēc akvakultūras tipa
  subtitle: Dažādām akvakultūras operācijām ir atšķirīgas darba laivu prasības — no mazām elastīgām zivju RIBs būru pārbaudei līdz stabilām transporta platformām pērļu audzēšanai un smagām darba laivām okeāna lopkopībai.
  items:
    - title: Zivju audzēšanas operācijas
      subtitle: Būra pārbaude, barības transportēšana, ražas atbalsts
      description: Jūras zivju fermas darbojas būros atklātās piekrastes un jūras vietās. Darba laivas tiek izmantotas ikdienā būru tīklu pārbaudei, barošanas operācijām, zvejas atbalstam un aprīkojuma apkopei. Galvenais izaicinājums ir korozija — laivas pastāvīgi ir pakļautas sālsūdenim, zivju barības atliekām un degvielai. Uzticama darba laiva ir būtiska, jo nokavēta barošana vai aizkavēta nozveja tieši ietekmē ražošanas apjomu un rentabilitāti.
      features:
        - 'Agresīvās vides komplekts: 316 nerūsējošā tērauda furnitūra, jūras klases sakausējuma komponenti'
        - Plakana klāja izkārtojums barības maisu un ražas tvertņu transportēšanai
        - Pašizsūknējošs klājs ērtai mazgāšanai pēc operācijām
        - Hypalon caurules ar ķīmiskām vielām izturīgu pārklājumu padeves un degvielas iedarbībai
        - Pastiprinātas berzes dēļi biežai saskarei ar būri un piestātni
    - title: Pērļu audzēšanas operācijas
      subtitle: Stabils transports pērļu līniju pārbaudei un novākšanai
      description: Pērļu fermām nepieciešamas stabilas, uzticamas darba laivas ikdienas pārvadāšanai starp pērļu līnijām, austeru tīklu pārbaudei un ražas novākšanai. Šīs operācijas notiek attālās piekrastes vietās ar ierobežotu apkopes infrastruktūru. Laivai jābūt pietiekami stabilai, lai apkalpe varētu strādāt, pārbaudot pērļu auklas, ar vieglu iekāpšanu un plašu klāja platību novākto austeru, tīklu un krājumu pārvadāšanai. Uzticamība un viegla apkope ir kritiski svarīga attālās saimniecībās.
      features:
        - Stabila korpusa konstrukcija pastāvīgajai apkalpei pērļu līnijas inspekcijas laikā
        - Plakans klājs ar neslīdošu virsmu drošai apkalpes pārvietošanai
        - Zems brīvborts ērtai piekļuvei austeru tīklam un ražas novākšanai
        - Vienkārša ārējā konfigurācija ērtai apkalpošanai uz vietas
        - Izturīga caurule un aparatūras komplekts nepārtrauktai sālsūdens iedarbībai
    - title: Okeāna lopkopība un jūras uzlabošana
      subtitle: Jauniešu transports, būru apkope, uzraudzība, atbalsts
      description: Okeāna lopkopības operācijas ietver jauno dzīvnieku atbrīvošanu pārvaldītās jūras vidēs, augšanas uzraudzību un uzlabošanas struktūru apkalpošanu. Darba laivām jātransportē dzīvi jaunie dzīvnieki aerētos konteineros, jānes monitoringa aprīkojums un jāpiekļūst seklām piekrastes atbrīvošanas vietām. Korpusa projektēšanai jālīdzsvaro kravnesība ar seklu iegrimi pludmales un estuārija piekļuvei.
      features:
        - Klāja telpa aerētiem jauniešu transporta konteineriem un uzraudzības aprīkojumam
        - Sekla iegrime pludmales un estuāra atbrīvošanas vietu piekļuvei
        - Viegla izsēšanās pludmalē — pastiprināta ķīlis un priekšgala aizsardzība
        - Iekārtu stiprinājuma punkti elektronikas un paraugu ņemšanas aprīkojuma uzraudzībai
        - Smagās Hypalon caurules izturībai jauktos smilšu un jūras ūdens apstākļos
