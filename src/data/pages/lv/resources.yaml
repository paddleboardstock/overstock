hero_text:
  tagline: Resursi
  title: Lejupielāžu centrs un pircēju ceļveži
  subtitle: Piekļūstiet produktu katalogiem, OEM ceļvežiem, pircēju kontrolsarakstiem un tehniskajai dokumentācijai, lai palīdzētu pieņemt informētus iepirkumu lēmumus.
features3_downloads:
  tagline: Lejupielādes
  title: Produktu dokumentācija<br />un pircēju resursi
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026. gada jūras produktu katalogs
      description: Pilns produktu klāsts, ieskaitot RIB laivas, piepūšamās laivas, SUP dēļus, kajakus un aksesuārus. Tehniskie parametri, konfigurācijas un iespējas. PDF formātā.
      icon: tabler:file-text
    - title: OEM ražošanas ceļvedis
      description: 'Viss, kas jums jāzina par OEM/ODM partnerattiecībām: procesa pārskats, minimālā pasūtījuma daudzums, pielāgošanas iespējas, kvalitātes kontrole un piegāde.'
      icon: tabler:building-factory
    - title: RIB laivu pircēju ceļvedis
      description: 'Kā izvēlēties pareizo RIB: korpusa materiāli, cauruļu materiāli, dzinēju izvēle, izmēra apsvērumi un konfigurācijas iespējas dažādiem pielietojumiem.'
      icon: tabler:file-description
    - title: SUP piegādātāja kontrolsaraksts
      description: 'Svarīgākie apsvērumi, izvēloties SUP dēļu ražotāju: kvalitātes rādītāji, sertifikācijas prasības, MOQ apsvērumi un kam pievērst uzmanību rūpnīcas audita laikā.'
      icon: tabler:clipboard-check
    - title: Piepūšamo laivu materiālu ceļvedis
      description: 'PVC vs Hypalon: izturības, UV izturības, kalpošanas ilguma, remonta iespēju un izmaksu salīdzinājums dažādiem jūras pielietojumiem.'
      icon: tabler:files
    - title: Pielāgotās ražošanas īss apraksta veidne
      description: Lejupielādējiet mūsu produktu īss apraksta veidni. Aizpildiet savas prasības un nosūtiet to mums, lai saņemtu piedāvājumu un iespējamības novērtējumu tajā pašā nedēļā.
      icon: tabler:template
faqs:
  title: Biežāk uzdotie jautājumi
  subtitle: Biežāk uzdotie jautājumi par mūsu produktiem, ražošanas procesu un partnerības modeli.
  columns: 2
  items:
    - title: Kāda ir minimālā pasūtījuma summa?
      description: MOQ atšķiras atkarībā no produktu kategorijas. RIB laivas parasti sākas no 10 vienībām katram modelim. SUP dēļi no 50 vienībām. Sazinieties ar mūsu pārdošanas komandu, lai saņemtu produkta specifisku MOQ informāciju.
      icon: tabler:help-circle
    - title: Vai es varu saņemt paraugus pirms pasūtījuma veikšanas?
      description: Jā. Paddle Board Overstock nodrošina paraugu ražošanu izvērtēšanai pirms masveida ražošanas. Paraugu izmaksas ir pārrunājamas un bieži tiek ieskaitītas pirmajā ražošanas pasūtījumā.
      icon: tabler:package
    - title: Kādi maksājumu noteikumi ir pieejami?
      description: 'Standarta noteikumi: 30% avansa maksājums ar pasūtījumu, 70% pirms piegādes. LC noteikumi pieejami kvalificētiem klientiem. Sazinieties ar mūsu finanšu komandu, lai apspriestu kārtību.'
      icon: tabler:currency-dollar
    - title: Cik ilgi ilgst ražošana?
      description: 'Tipiskie piegādes termiņi: RIB laivas 30-45 dienas, SUP dēļi 20-30 dienas, piepūšamās laivas 25-35 dienas. Pielāgota izstrāde pievieno 15-30 dienas prototipu izstrādei.'
      icon: tabler:calendar-clock
    - title: Kādi sertifikāti ir jūsu produktiem?
      description: CE sertifikācija ES tirgiem, ASV Pārvadātāju krasta apsardzes apstiprināta ražošana, ISO kvalitātes sistēma, BSCI atbilstība un REACH materiālu atbilstība.
      icon: tabler:certificate
    - title: Vai jūs piedāvājat pielāgotu iepakojumu un zīmolu?
      description: Jā. Mēs nodrošinām pielāgotu iepakojumu ar jūsu logotipu, krāsām un zīmola identitāti. MOQ pielāgotam iepakojumam ir atkarīgs no produkta kategorijas.
      icon: tabler:color-swatch
