label: Garantija
headline: Paddle Board Overstock Ražotāja ierobežotā garantija
subtitle: Paddle Board Overstock Stāv aiz katra piepūšamā jūras produkta kvalitātes, ko mēs ražojam. Šī ierobežotā garantija nosaka jūsu produkta noteikumus un segumu Paddle Board Overstock .
seo:
  headline: Paddle Board Overstock Piepūšamās laivas garantija — 5 gadu ierobežota garantija | Paddle Board Overstock
  description: Paddle Board Overstock Piedāvā 5 gadu ierobežotu garantiju primārā cauruļu auduma, šuvju un stiklašķiedras korpusa konstrukcijas integritātei. Tāpat tiek segti piepūšamie vārsti un rūpnīcā uzstādītie piederumi. Paddle Board Overstock Pilni piepūšamo laivu garantijas noteikumi un nosacījumi.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Šī ierobežotā garantija attiecas uz jauniem Paddle Board Overstock zīmola piepūšamajiem jūras produktiem, kas iegādāti tieši no Paddle Board Overstock vai no pilnvarota Paddle Board Overstock dīlera vai mazumtirgotāja. Spēkā stāšanās datums ir pārbaudāms sākotnējās mazumtirdzniecības iegādes datums.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garantijas segums un ilgums</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 gadi</h3>
        <p class="text-sm text-gray-600 mt-1">Primārā cauruļu auduma integritāte (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 gadi</h3>
        <p class="text-sm text-gray-600 mt-1">Stiklašķiedras korpusa konstrukcijas integritāte</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 gadi</h3>
        <p class="text-sm text-gray-600 mt-1">Piepūšamo cauruļu šuves gaisa noturēšanas spēja</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 gadi</h3>
        <p class="text-sm text-gray-600 mt-1">Inflācijas vārsta funkcionalitāte</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 gads</h3>
        <p class="text-sm text-gray-600 mt-1">Rūpnīcā uzstādītie piederumi un palīgstiprinājumi</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 gads*</h3>
        <p class="text-sm text-gray-600 mt-1">Komerciāls, nomas vai autoparka lietojums — visi komponenti</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komerciālai, valsts, čartera, nomas vai mācību lietošanai garantija tiek samazināta līdz 1 gadam. Sacīkšu vai sacensību izmantošana pilnībā anulē garantiju.</p>
  </div>

  <h2>Kas tiek aptverts</h2>
  <h3>Primārais cauruļu audums (5 gadi)</h3>
  <p>Paddle Board Overstock nodrošina galvenā cauruļu auduma aizsardzību pret porainības bojāšanos, kas būtiski apdraud produkta spēju uzturēt darbības uzpūšanos. Tas attiecas uz CSM (Hypalon) pārklātu audumu un visiem citiem ražošanā izmantotajiem cauruļu audumiem.</p>

  <h3>Stikla šķiedras korpusa konstrukcijas integritāte (5 gadi)</h3>
  <p>Produktiem ar stikla šķiedras pastiprinātu plastmasas FRP() korpusu pamata kompozītmateriālu konstrukcija ir aizsargāta pret konstrukcijas bojājumiem materiālu vai izgatavošanas defektu dēļ.</p>

  <h3>Piepūšamo cauruļu šuves gaisa noturēšanas spēja (5 gadi)</h3>
  <p>Piepūšamo cauruļu šuves, ja tās tiek savienotas ražošanas laikā, ir aizsargātas pret ražošanas defektiem, kas izraisa būtisku gaisa noplūdi caur šuvi. Periodiska pārbaude un atbilstošu piepūšanas spiedienu uzturēšana ir seguma nosacījumi.</p>

  <h3>Inflācijas vārstu funkcionalitāte (5 gadi)</h3>
  <p>Gaisa piepūšanas vārsti, kas sākotnēji uzstādīti, Paddle Board Overstock ir garantēti pret ražošanas defektiem materiālos vai izpildījumā, kas traucē vārstam noturēt gaisu kā paredzēts.</p>

  <h3>Rūpnīcā uzstādītie piederumi (1 gads)</h3>
  <p>Komponentes un stiprinājumi, kas ražoti Paddle Board Overstock un sākotnēji uzstādīti rūpnīcā, ir garantēti pret materiāla un izgatavošanas defektiem vienu gadu. Tas neattiecas uz trešo pušu precēm, kuras sedz tikai to ražotāja garantijas.</p>

  <h2>Kas nav iekļauts</h2>
  <ul>
    <li>Kosmētiskas nepilnības, tostarp krāsas izmaiņas, traipi, izbalēšana, krīta veidošanās vai jebkādas izskata izmaiņas</li>
    <li>Dūrieni, griezumi, plīsumi, plīsumi vai citi fiziski bojājumi</li>
    <li>Plaisāšana, plaisāšana, nodilums, skrāpējumi vai bojājumi berzes vai kontakta dēļ</li>
    <li>Degradācija UV no gaismas iedarbības, laikapstākļu ietekmes vai atmosfēras apstākļiem</li>
    <li>Bojājumi no saskares ar degvielām, šķīdinātājiem, skābēm, sārmiem vai ķīmiskām vielām</li>
    <li>Bojājumi no nolaidības, nepareizas lietošanas, ļaunprātīgas izmantošanas, negadījuma vai parasta nolietojuma</li>
    <li>Gelcoat vai krāsas virsmas problēmas (pūslīši, plaisāšana, krāsas maiņa, izbalēšana)</li>
    <li>Bojājumi no trieciena, stresa, nepareiza atbalsta vai piekabes</li>
    <li>Bojājumi no nepareizas inflācijas/deflācijas vai neapstiprinātu inflācijas ierīču izmantošanas</li>
    <li>Trešo pušu iekārtas, komponentes vai sistēmas (ko sedz attiecīgie ražotāji)</li>
  </ul>

  <h2>Ražotāja pienākums un tiesiskā aizsardzība</h2>
  <p>Paddle Board Overstock's vienīgais un ekskluzīvais pienākums ir remonts vai nomaiņa pēc Paddle Board Overstock's izvēles) jebkurai detaļai, kas tiek konstatēta kā bojāta materiālos vai izpildījumā un uz kuru attiecas šī garantija. Remontu vai nomaiņu veic vai Paddle Board Overstock tās norādītā pilnvarotā servisa iestāde. Remontētie vai nomainītie komponenti ir garantēti tikai uz nebeigušos oriģinālās garantijas perioda daļu.</p>

  <h2>Garantijas nosacījumi</h2>
  <ul>
    <li><strong>Reģistrācija:</strong>Produktam jābūt pareizi reģistrētam, kā noteikts garantijas noteikumos.</li>
    <li><strong>Uzturēšana:</strong>Produkts jāuztur saskaņā ar Paddle Board Overstockpublicētajām vadlīnijām, tostarp periodisku pārbaudi un atbilstošu inflācijas spiedienu uzturēšanu.</li>
    <li><strong>Sadarbība:</strong>Pircējam pilnībā un ātri jāsadarbojas Paddle Board Overstock visos jautājumos, kas saistīti ar garantijas prasībām.</li>
    <li><strong>Sākotnējais pircējs:</strong>Šī garantija tiek piešķirta tikai sākotnējam gala lietotājam un nav pārnesama.</li>
  </ul>

  <h2>Komerciālā izmantošana</h2>
  <p>Ja produkts tiek izmantots komerciāliem, valsts, bezpeļņas, čartera, nomas, mācību nolūkiem vai jebkuram citam mērķim, izņemot privātu atpūtas nodarbi, garantijas periods visām sastāvdaļām tiek samazināts līdz vienam (1) gadam no sākotnējā mazumtirdzniecības iegādes datuma. Lietošana sacīkšu, ātruma vai izturības sacensībās nekavējoties un neatgriezeniski pilnībā anulē garantiju.</p>

  <h2>Kā iesniegt garantijas prasību</h2>
  <p>Sazinieties Paddle Board Overstock ar savu pilnvaroto dīleri ar pirkuma apliecinājumu un detalizētu problēmas aprakstu.Paddle Board Overstock Pārskatīsim prasību un sniegsim instrukcijas par pārbaudi un servisu.</p>
  <p>Garantijas servisa jautājumu gadījumā, lūdzu, sazinieties ar mums, izmantojot mūsu<a href="/contact" class="text-sky-600 underline">Kontaktu lapa</a>Ar pasūtījuma numuru un produkta detaļām.</p>

  <h2>Trešo pušu preces</h2>
  <p>Iekārtas, komponentes vai sistēmas, ko ražo trešās puses (pat ja tās ir uzstādījušas Paddle Board Overstock), ir ekskluzīvi aizsargātas ar jebkuru garantiju, ko piedāvā attiecīgais ražotājs.Paddle Board Overstock Skaidri atsakās no jebkādas garantijas atbildības par šādiem trešo pušu priekšmetiem.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Šis garantijas paziņojums ir pilnīgas Paddle Board Overstock ražotāja ierobežotās garantijas kopsavilkums. Pilns juridiskais garantijas dokuments nosaka visus garantijas noteikumus un nosacījumus. Specifikācijas var tikt mainītas bez iepriekšēja brīdinājuma.Paddle Board Overstock ir Paddle Board Overstock Qingdao Manufacturing Hub rūpnīcas zīmols.
  </p>
