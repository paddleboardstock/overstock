features3_certifications:
  title: Sertifikāti un atbilstība
  subtitle: Katrs produkts tiek neatkarīgi testēts; 64 modeļi ir CE sertificēti atbilstoši starptautiskajiem standartiem.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE sertifikācija
      description: 64 CE sertificēti modeļi visā SUPs, kajakos, laivās un RIBs atbilst Eiropas CE drošības standartam atpūtas ūdens transportlīdzekļiem. Katrs produkts pirms izlaišanas no rūpnīcas tiek pārbaudīts spiediena, peldspējas un slodzes testos.
      icon: tabler:certificate
    - title: ''
      description: Mūsu 12 000 m² liela Qingdao ražotne darbojas saskaņā ar ISO 9001 kvalitātes vadības sistēmu. Katru ražošanas partiju var izsekot, dokumentēt un pārbaudīt.
      icon: tabler:clipboard-check
    - title: BSCI Sociālā atbilstība
      description: Mēs esam BSCI sertificēti, nodrošinot ētisku darba praksi, drošus darba apstākļus un vides atbildību visā mūsu piegādes ķēdē.
      icon: tabler:users
    - title: REACH & RoHS
      description: Visi materiāli — PVC, Hypalon, EVA putas, līmes — atbilst ES REACH un RoHS noteikumiem. Nav ierobežotu vielu, nav kompromisu.
      icon: tabler:flask
    - title: Materiālu testēšanas laboratorija
      description: Iekšējā materiālu laboratorija pārbauda katras audumu partijas stiepes izturību, UV izturību, šuvju integritāti un nodilumu pirms ražošanas.
      icon: tabler:microscope
    - title: 5 gadu laivas garantija
      description: Paddle Board Overstock laivas ir segtas ar 5 gadu ierobežotu garantiju uz caurules audumu, šuvēm un korpusu. SUP dēļi un piederumi tiek nodrošināti ar 2 gadu garantiju. Mēs stāvam aiz tā, ko mēs izgatavojam.
      icon: tabler:shield-check
testimonials:
  tagline: Klientu uzticība
  title: Ko mūsu klienti saka
  subtitle: No pirmreizējiem airētājiem līdz profesionāliem flotes operatoriem — skatiet, kāpēc viņi uzticas Paddle Board Overstock.
  items:
    - content: Mēs aprīkojām visu mūsu nomas floti ar Paddle Board Overstock RIBs — 12 laivām trīs vietās. Divu sezonu laikā nav bijušu bojājumu. CE sertifikācijas dokumentācija nodrošināja vienkāršu apdrošināšanas apstiprināšanu. Viņu inženieru komanda pat pielāgoja cauruļu krāsas, lai tās atbilstu mūsu zīmolam.
      name: Marko Valenti
      title: Operāciju direktors, Adriatic Adventure Tours — Dubrovnika, Horvātija
    - content: Kā pirmreizējais pircējs biju nervozs par kvalitāti, pasūtot no ārzemēm. ISO dokumentācija un trešo personu testu atskaites, ko viņi man sniedza pat pirms es jautāju, deva pilnīgu pārliecību. Dēļe ieradās 6 dienu laikā un pārsniedza manas cerības.
      name: Džeimss Torntons
      title: SUP Explorer 11 īpašnieks — Vankūvera, Kanāda
    - content: Mēs darbojamies 24 Paddle Board Overstock RIBs visā mūsu piekrastes patrulēšanas flotē. Viņu QC process ir konsekvents katrā partijā — vienāda šuvju kvalitāte, vienāda vārstu izvietošana, vienāds spiediena vērtējums katru reizi. Šī atkārtojamība ir svarīga, kad dzīvības ir atkarīgas no aprīkojuma.
      name: Lt. komandieris Andres Rejes
      title: Jūras iepirkumu virsnieks, Filipīnu krasta apsardzes palīgsdienests — Manila, Filipīnas
features3_lab:
  title: Iekšējā testēšana un kvalitātes laboratorija
  subtitle: Katrs materiāla partija un gatavais produkts tiek pārbaudīts mūsu vietējā testēšanas laboratorijā pirms nosūtīšanas.
  columns: 3
  isBeforeContent: true
  items:
    - title: Stiepes izturības testēšana
      description: 'Katrs PVC auduma ruļlis tiek testēts saskaņā ar ASTM D751 standartiem. Minimālā prasība: 350 N/cm virzienā un šķērsām. Noraidītās partijas tiek atgrieztas piegādātājam — mēs noraidām aptuveni 3% no ienākošajiem materiāliem.'
      icon: tabler:scale
    - title: UV Paātrināta novecošana
      description: Auduma paraugi tiek pakļauti 1 000 stundu QUV paātrinātai laika pārbaudei (ASTM G154). Stiepes izturības saglabāšanai pēc UV iedarbības jābūt virs 80%. Produkti ir novērtēti 3+ gadu āras lietošanai.
      icon: tabler:sun
    - title: Šuves nolobīšanās stiprība
      description: RF metinātās šuves pārbaudītas ar minimālo lobīšanās stiprību 5 N/mm (ASTM D751). Rokām līmētās Hypalon šuves pārbaudītas ar 3,5 N/mm. Katram ražošanas partijai tiek destruktīvi testēti un arhivēti šuves paraugi.
      icon: tabler:stack
    - title: 24–48 stundu spiediena turēšana
      description: 'Katrs piepūšamais produkts tiek piepūsts līdz 1,25 reizes lielākam nekā nominālais PSI un tiek uzraudzīts 24–48 stundas. Maksimāli pieļaujamais spiediena kritums: 5%. Produkti, kas neiztur šo testu, tiek laboti un atkārtoti testēti pirms nosūtīšanas.'
      icon: tabler:wind
    - title: Vārstu cikla testēšana
      description: Katrs vārsta dizains mūsu laboratorijā iziet 10 000 atvēršanas-aizvēršanas ciklus. Vārstiem pēc ciklu veikšanas jāspēj saglabāt gaisa necaurlaidīgu blīvējumu pie 1,25 reizes lielākas nominālās spiediena vērtības. Visi Paddle Board Overstock vārsti ir paredzēti 5+ gadu regulārai lietošanai.
      icon: tabler:rotate
    - title: Aukstuma plaisāšanas izturība
      description: Materiāli testēti pie -30°C 4 stundas saskaņā ar ISO 4646. Nav pieļaujamas plaisas vai trauslums. Produkti novērtēti ziemas uzglabāšanai un izmantošanai aukstā ūdenī līdz -10°C apkārtējās temperatūras.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Kā mēs nodrošinām kvalitāti
  subtitle: No izejvielu pārbaudes līdz galīgajai spiediena pārbaudei — katrs produkts iet cauri stingrai kvalitātes ķēdei.
  items:
    - title: Izejvielu inspekcija
      description: Katrs PVC auduma rullis tiek pārbaudīts pēc biezuma, stiepjamības izturības un UV izturības pirms nonākšanas ražošanā.
      icon: tabler:search
    - title: Procesa kvalitātes kontrole
      description: Metinājuma šuves, vārsta uzstādījumi un kameru savienojumi tiek pārbaudīti katrā stacijā uzstādīšanas laikā.
      icon: tabler:eye
    - title: Spiediena Pārbaude
      description: Katrs piepūšamais produkts tiek piepumpēts līdz 1,25x nominālajai PSI vērtībai un turēts 24–48 stundas, lai pārbaudītu gaisa noturību un šuves integritāti.
      icon: tabler:wind
    - title: Galīgā pārbaude
      description: Katra vienība tiek pārbaudīta apdarei, aparatūrai un iepakojumam pirms apstiprināšanas nosūtīšanai. Partijas paraugi tiek nosūtīti uz mūsu laboratoriju destruktīvām testēšanām.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Biežāk uzdotie jautājumi par laivām
  subtitle: Biežāk uzdotie jautājumi par mūsu stingrā korpusa piepūšamajām laivām.
  columns: 2
  items:
    - title: Kādus RIB laivu izmērus Paddle Board Overstock piedāvā?
      description: Mēs piedāvājam 35 RIB modeļus no 2,5 m līdz 7,6 m, aptverot visu no kompaktajiem tenderiem līdz smagās klases komerciālajiem un patrulēšanas kuģiem. Katrs modelis ir pieejams ar vairākām konfigurācijas iespējām.
    - title: Kāda ir atšķirība starp RIB A un tradicionālo piepūšamo laivu?
      description: RIB A (Rigid-Hull Inflatable Boat) apvieno cietu stiklašķiedras vai alumīnija dziļā V formas korpusu ar piepūšamu Hypalon vai PVC caurulēm. Tas nodrošina cietas laivas stabilitāti un kravnesību, kā arī piepūšamās laivas triecienu absorbciju un peldošumu.
    - title: Ar kuriem dzinējiem ir savietojamība Paddle Board Overstock RIBs?
      description: Mēs RIBs atbalstām ārējos dzinējus no 3 HP līdz 250 atkarībā HP no modeļa. Katra produkta lapa norāda maksimālo dzinēja jaudu. Mēs iesakām konsultēties ar savu dīleri, lai atrastu ideālo risinājumu.
    - title: Vai esi Paddle Board Overstock RIBs CE sertificēts?
      description: Jā. Visi atpūtas RIB modeļi ir CE sertificēti atbilstoši piemērojamiem Eiropas standartiem atpūtas ūdens transportlīdzekļiem. Komerciālie un patrulēšanas modeļi atbilst papildu stabilitātes un slodzes prasībām.
    - title: Kāda ir RIB garantija laivām?
      description: Visiem Paddle Board Overstock RIBs ir 5 gadu ierobežota garantija cauruļu audumam, šuvēm un korpusam; piepūšamie vārsti tiek segti 5 gadus; rūpnīcā uzstādītie piederumi tiek segti 1 gadu.
    - title: Cik daudz gaisa kameru Paddle Board Overstock RIBs ir?
      description: Mūsu RIBs modelī ir 3 līdz 7 neatkarīgas gaisa kameras atkarībā no modeļa garuma. Šis daudzkameru dizains nodrošina, ka laiva paliek virs ūdens pat tad, ja viens nodalījums ir bojāts.
faqs_inflatable:
  title: Piepūšamo laivu biežāk uzdotie jautājumi
  subtitle: Biežāk uzdotie jautājumi par mūsu piepūšamajām laivām, kajakiem un laivām.
  columns: 2
  items:
    - title: Kādi materiāli tiek izmantoti Paddle Board Overstock piepūšamajās laivās?
      description: Mēs izmantojam militāras klases PVC (1100 denier) un premium Hypalon/CSM gumijas, atkarībā no modeļa. Abi materiāli ir UVstabilizēti, izturīgi pret nodilumu un atbilst ES REACH un RoHS regulējumiem.
    - title: Cik ilgi kalpo piepūšamās laivas?
      description: Ar pienācīgu kopšanu kvalitatīva PVC piepūšamā laiva kalpo 7–10 gadus, bet Hypalon modeļi var kalpot 15–20 gadus. Regulāra tīrīšana, UV aizsardzība un pareiza uzglabāšana būtiski pagarina kalpošanas laiku.
    - title: Kāda apkope nepieciešama piepūšamajai laivai?
      description: Pamatapkope ietver skalošanu ar svaigu ūdeni pēc katras lietošanas reizes (īpaši sālsūdenī), žāvēšanu pirms uzglabāšanas, vārstu blīvju pārbaudi reizi gadā un aizsarglīdzekļa uzklāšanu UV caurulēm. Izvairieties no ilgstošas saules iedarbības, kad netiek lietots.
    - title: Vai piepūšamās laivas var izmantot sālsūdenī?
      description: Jā. Visas Paddle Board Overstock piepūšamās laivas ir paredzētas gan saldūdens, gan sālsūdens lietošanai. Mēs iesakām skalot ar svaigu ūdeni un rūpīgi izžāvēt pēc saskares ar sālsūdeni, lai novērstu pielipšanas koroziju un auduma sāls kristalizāciju.
    - title: Kā es varu uzglabāt piepūšamo laivu?
      description: Pirms uzglabāšanas laivu pilnībā iztukšojiet, iztīriet un izžāvējiet. Veltiet brīvi (izvairieties no ciešām locīšanām), glabājiet vēsā, sausā vietā, prom no tiešiem saules stariem, un nelietojiet betona grīdas, lai novērstu mitruma uzgrūšanos.
    - title: Kāda ir Paddle Board Overstock piepūšamo laivu svara ietilpība?
      description: Svara kapacitātes svārstās no 290 kg mūsu mazākajiem modeļiem līdz pat vairāk nekā 2000 kg lielākiem komerciāliem kuģiem. Katra produkta lapā ir uzskaitīta maksimālā slodzes jauda konkrētajam modelim.
faqs_sup:
  title: SUP Dēļi – biežāk uzdotie jautājumi
  subtitle: Bieži uzdotie jautājumi par mūsu stāvēšanas airēšanas dēļiem.
  columns: 2
  items:
    - title: Kādi SUP dēļu izmēri ir pieejami?
      description: Mēs piedāvājam SUP dēļus no 9 ft līdz 12 ft, ieskaitot vispārējās, tūrisma, jogas un speciālos dizainus. Mūsu vislabāk pārdotie modeļi ir Tropical Breeze (10 ft) un Ocean Voyager (11 ft).
    - title: Kas ir drop-stitch konstrukcija?
      description: Drop-stitch konstrukcija izmanto tūkstošiem poliestera pavedienu, kas savieno dēļa augšējo un apakšējo slāni, ļaujot tam izturēt augstu gaisa spiedienu (15–20 PSI) un sasniegt stingru, stabilu platformu. Tas ir industrijas standarts premium piepūšamajiem SUPs.
    - title: Kāda ir SUP dēļu svara limita maksimālā vērtība?
      description: Mūsu SUP dēļi atbalsta līdz 150 kg atkarībā no modeļa un tilpuma. Leviathan Wake dēlis ir mūsu augstākās kapacitātes modelis, paredzēts lielākiem braucējiem un jogas nodarbībām.
    - title: Vai jūs piedāvājat pilnus SUP komplektus?
      description: Jā. Katrs SUP dēlis tiek piegādāts ar pilnu komplektu, ieskaitot 3 daļu alumīnija airi, augsta spiediena roku sūkni, spirāles pavadu, ceļojumu mugursomu un remonta komplektu. Daži modeļi ietver arī noņemamu spuras komplektu.
    - title: Kāda ir garantija SUP dēļiem?
      description: Visiem Paddle Board Overstock SUP dēļiem ir 2 gadu garantija pret ražošanas defektiem, ieskaitot šuvju bojājumus, vārsta defektus un materiālu lēkšanu normālas lietošanas laikā.
    - title: Cik ilgs laiks nepieciešams SUP dēļa uzpūšanai?
      description: Izmantojot iekļauto roku sūkni, pilna uzpilde līdz 15 PSI aizņem aptuveni 8–12 minūtes. Ātrākai uzpildei mēs rekomendējam mūsu Paddle Board Overstock 12V elektrisko sūkni, kas uzpūš dēli mazāk nekā 4 minūtēs.
cta:
  title: Vai vēlaties redzēt sertifikātus pašam?
  subtitle: Pieprasiet mūsu sertifikātu portfeli, rūpnīcas audita atskaites vai materiālu atbilstības dokumentāciju. Nav nepieciešama NDA.
  actions:
    - variant: primary
      text: Pieprasīt sertifikācijas dokumentus
      href: /contact
    - text: Apmeklējiet mūsu rūpnīcas lapu
      href: /factory
