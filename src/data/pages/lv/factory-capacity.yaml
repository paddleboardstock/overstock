hero:
  tagline: Ražošanas jauda
  title: Ražošanas jauda un gada izlaide
  subtitle: 12 000 m² ražotne, kas ražo 15 000 laivu gadā ar iespēju paplašināties
intro: Paddle Board Overstock pārvalda vienu no lielākajām speciālajām piepūšamo laivu ražotnēm Qingdao, Ķīnā. Mūsu 12 000 m² fabriku veido sešas specializētas darbnīcas, kas darbojas paralēli, dodot mums iespēju ražot 15 000 laivu gadā SUP, kajaku, laivu, RIB un drošības aprīkojuma līnijās.
highlights:
  - value: 12,000 m²
    label: Kopējā ražošanas platība
    detail: Sešās specializētajās darbnīcās
  - value: 15,000
    label: Katru gadu ražotas laivas
    detail: SUPs, kajaki, RIBs, laivas, drošības aprīkojums
  - value: 200-300
    label: Prasmīga darbaspēka komanda
    detail: 25+ inženieri, 2 maiņas/dienā
  - value: 50+
    label: Eksporta valstis
    detail: ES, ASV, AU, Tuvie Austrumi, Āzija
  - value: 30–45
    label: Standarta piegādes laiks (dienas)
    detail: No PO apstiprināšanas līdz FOB
  - value: 10+
    label: Eksporta pieredzes gadi
    detail: Kopš 2012. gada
workshops:
  - title: SUP Dēļu ražošana
    description: '4 paralēlas montāžas līnijas piepūšamajiem SUP dēļiem. Katru līniju var ražot 50–80 dēļus maiņā. Digitālās drukas un sitrdrukas stacijas darbojas vienlaikus. Gada SUP jauda: 8,000+ dēļi.'
    output: 8,000+ SUPs/gadā
  - title: RIB Laivu ražošana
    description: 'Speciāla stikla šķiedras ķermeņa darbnīca ar 6 veidņu stacijām RIB korpusiem līdz 7,6 m. Cauruļu metināšanas un montāžas zona apstrādā 3–5 RIBs vienlaikus. Gada RIB jauda: 2,000+ laivas.'
    output: 2,000+ RIBs/gadā
  - title: Piepūšamās laivas un laiviņas
    description: 'Daudzfunkcionālas ražošanas līnijas piepūšamajām laivām, kajakiem un laiviņām. Karstā gaisa metināšanas stacijas, RF dielektriskās preses un montāžas darbavietas tiek pārkārtotas atkarībā no pasūtījumu sastāva. Gada jauda: 5,000+ vienības.'
    output: 5,000+ vienības/gadā
  - title: Drošības aprīkojums
    description: 'Atsevišķa tīrā telpa glābšanas vestēm un drošības aprīkojumam. Speciālas šūšanas, putu ievietošanas un testēšanas stacijas. Gada glābšanas vesti jauda: 50,000+ vienības.'
    output: 50,000+ glābšanas vestes/gadā
oem_capacity:
  moq: 'SUP: 5–10 vienības | RIB: 2–5 vienības | Kajaks/Laiva: 10–20 vienības | Pielāgotas veidnes: 200+ vienības'
  lead_time: Standarta 30–45 dienas. Paraugs 15–20 dienas. Ātra piegāde pieejama.
  payment: T/T 30% depozīts + 70% pirms nosūtīšanas. Pieņem L/C, Western Union.
