features3_markets:
  tagline: Galvenie tirgi
  title: Reģionālā pieredze<br />vietējām prasībām
  subtitle: Mēs saprotam, ka dažādiem tirgiem ir dažādas regulatīvās prasības, preferences un lietošanas gadījumi.
  isBeforeContent: false
  columns: 4
  items:
    - title: Eiropa un Lielbritānija
      description: CE sertificēti produkti, kas atbilst EN ISO 6185 standartiem. Liela pieprasījuma pēc RIBs, piepūšamajām laivām un SUP dēļiem ES tirgos. Lielbritānijas izplatītāji novērtē mūsu ātro izpildi.
      icon: tabler:map-pin
    - title: Ziemeļamerika
      description: ASV Krasta apsardzes apstiprināta ražošana. ASV noliktava Montclair, CA ātrai piegādei Rietumkrastā. Pieaugošs pieprasījums pēc zvejas laivām, glābšanas kuģiem un atpūtas SUPs.
      icon: tabler:map-pin
    - title: Austrālija un Okeānija
      description: Spēcīgs tirgus RIB laivām un piepūšamajiem tenderiem. Austrālijas izplatītāji novērtē mūsu Hypalon laivas par UV izturību skarbos saules apstākļos. Ātra piegāde no mūsu Āzijas ražotnes.
      icon: tabler:map-pin
    - title: Tuvo Austrumu reģions
      description: Pieaug pieprasījums pēc patruļas un glābšanas laivām. Mūsu alumīnija korpusa RIBs ir populāri piekrastes apsardzes un drošības operatoru vidū. Pielāgotas konfigurācijas augstas temperatūras vidēs.
      icon: tabler:map-pin
features3_distribution:
  tagline: Izplatīšanas tīkls
  title: Sadarbība ar izplatītājiem<br />Visā pasaulē
  subtitle: Mēs strādājam ar izveidotajiem jūras aprīkojuma izplatītājiem, OEM zīmoliem un valdības iepirkuma aģentūrām.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM partnerības
      description: Privātā preču zīmola ražošana globāliem ūdens sporta zīmoliem. Mēs nodrošinām visu — no dizaina līdz ražošanai un tiešajai piegādei.
      icon: tabler:building
    - title: Izplatītāju tīkls
      description: 20+ valstīs esošie pilnvarotie izplatītāji tur krājumus un sniedz vietējo atbalstu. Jaunas izplatītāju pieprasījumu iesniegšana ir laipni gaidīta.
      icon: tabler:users
    - title: Valdības un institucionālie klienti
      description: Tieša piegāde piekrastes aizsardzības dienestiem, meklēšanas un glābšanas organizācijām un militārajiem iepirkumu programmu dalībniekiem. Atbilstība institucionālajām iepirkumu prasībām.
      icon: tabler:building-community
steps2_logistics:
  title: Globālā loģistika un atbalsts
  subtitle: No rūpnīcas līdz galamērķim — mēs pārvaldām visu piegādes ķēdi.
  items:
    - title: Piegādes iespējas
      description: Jūras transports (FOB Ķīngdao), gaisa transports steidzamiem pasūtījumiem un ekspress kurjers paraugiem un rezerves daļām.
      icon: tabler:truck-delivery
    - title: ASV noliktava
      description: 'Krājumi glabājas Montclair, Kalifornijā, lai nodrošinātu ātru piegādi visā Ziemeļamerikā. Rietumu krasts: 2-3 dienas, Centrālais: 3-4 dienas, Austrumu krasts: 4-5 dienas.'
      icon: tabler:building-warehouse
    - title: Rezerves daļas
      description: Oriģinālās Paddle Board Overstock rezerves daļas un patēriņa materiāli ir pieejami visu gadu. Parastās daļas tiek nosūtītas 24 stundu laikā.
      icon: tabler:package
    - title: Tehniskais atbalsts
      description: Tieša saziņa ar mūsu inženieru komandu tehniskiem jautājumiem, remontu padomiem un pārbūves atbalstam. Mēs atbalstām laivas, ko esam uzbūvējuši pirms 20 gadiem.
      icon: tabler:headset
cta:
  title: Vai vēlaties kļūt par izplatītāju?
  subtitle: Mēs aktīvi paplašinām mūsu izplatītāju tīklu. Sazinieties ar mūsu eksporta komandu, lai apspriestu sadarbības iespējas.
  actions:
    - variant: primary
      text: Sadarbības pieprasījums
      href: /contact
    - text: Apskatiet mūsu produktu klāstu
      href: /products
