hero:
  tagline: Globālā klātbūtne
  title: Aptverot 50+ valstis<br />Visos kontinentos
  subtitle: No Eiropas piekrastes patruļas operatoriem līdz Austrālijas ūdens sporta izplatītājiem un Tuvo Austrumu glābšanas komandām — Paddle Board Overstock laivas ir uz ūdens visā pasaulē.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock globālā jūras aprīkojuma ražošana un izplatīšana
