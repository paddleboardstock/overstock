breadcrumb: OEM/ODM Ražotājs
tldr:
  summary: Paddle Board Overstock ir tieši no rūpnīcas OEM/ODM ražotājs. 12 000 m² ISO 9001:2015 ražotne, 15 000 vienību gada ražošana, CEBSCIREACH///UKCA atbilstība, zems MOQs no 2 līdz 10 vienībām.
  points:
    - 12 000 m² ISO 9001:2015 sertificēta Cjindao iekārta
    - 15 000 vienību gada jauda ar 200–300 kvalificētiem darbiniekiem
    - CE 2013/53/ES, UKCA, BSCIREACH , atbilstība
    - 'ZemsMOQs: 2-5 vienības (RIB), 5-10 vienības (SUP) standarta modeļiem'
    - 50+ eksporta valstis ar FOB Qingdao kuģošanu
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015 Sertificēts
      desc: SGS- auditēta kvalitātes vadības sistēma visās ražošanas līnijās.
      variant: cert
    - icon: ⭐
      title: CE & UKCA Atbilstoša
      desc: Pilnīga atbilstība ES 2013/53/ES un Apvienotās Karalistes marķēšanas prasībām.
      variant: cert
    - icon: ⭐
      title: BSCI Sociālais audits
      desc: Pārbaudītas ētiskas darba prakses un darba vietas standarti.
      variant: standard
    - icon: ⭐
      title: Zems MOQ līmenis no 2 vienībām
      desc: 'Standarta RIB modeļi no 2 līdz 5 vienībām, SUP no 5 līdz 10 vienībām. Pielāgota veidne: 200+.'
      variant: standard
process_section:
  eyebrow: Mūsu process
  title: Pilns process OEM/ODM Darba plūsma
  subtitle: No dizaina uzdevuma līdz konteineru iekraušanai — seši soļi līdz jūsu privātā zīmola piepūšamajam ūdens transportlīdzeklim.
  steps:
    - step: '01'
      title: Specifikācijas un dizaina uzdevums
      desc: Dalieties ar savām mērķa specifikācijām, CAD rasējumiem vai atsauces produktu. Mūsu inženieru komanda pārskata materiālus, izmērus un atbilstības prasības (CE, BSCI) pirms piedāvājuma sniegšanas.
    - step: '02'
      title: 3D veidņu prototipēšana
      desc: Mēs projektējam un CNCapstrādājam pielāgotas veidnes SUP dēļiem, kajaku korpusiem un RIB komponentēm. Prototipa paraugi tiek ražoti 15–20 darba dienu laikā jūsu apstiprināšanai.
    - step: '03'
      title: Materiālu izvēle un paraugu ražošana
      desc: Izvēlieties militāras klases PVC (0,9mm–1,2mm), Hypalon CSM, vai drop-stitch kodola audumus. Mēs ražojam pirmsražošanas paraugus ar jūsu zīmola krāsām, logotipu un iepakojumu apstiprināšanai.
    - step: '04'
      title: CE Rūpnīcu audits un atbilstība
      desc: Katrs OEM rīkojums ietver atbilstības dokumentāciju — atbilstības CE deklarāciju, ISO 9001 izsekojamības ierakstus, BSCI sociālās atbilstības ziņojumu un REACH būtiskas deklarācijas.
    - step: '05'
      title: Lielapjoma ražošana un Inline kvalitātes kontrole
      desc: Ražošanas braucieni seko mūsu 100 punktu kvalitātes kontrolsarakstam. Katra vienība tiek pakļauta 24 stundu spiediena noturēšanas testēšanai, šuvju noņemšanas testam un vizuālai pārbaudei pirms iepakošanas.
    - step: '06'
      title: FOB Qingdao loģistika un kuģniecība
      desc: Gatavās preces Qingdao ostā tiek paletizētas, sarautas un iekrautas konteineros. Mēs apstrādājam visu eksporta dokumentāciju, muitas formalitātes un nodrošinām reāllaika sūtījumu izsekošanu.
capabilities_section:
  eyebrow: Ražošanas Iespējas
  title: Ko mēs veidojam
  subtitle: Sešas galvenās ražošanas iespējas globālajiem B2B partneriem.
  items:
    - title: Drop-Stitch SUP Plākšņu ražošana
      desc: Pilna garuma drop-stitch kodola laminēšana stingriem, augsta spiediena (15–20PSI) stāvošajiem airēšanas dēļiem. Pielāgots garums, platums, biezums, šūpojošā profila un grafiskais dizains.
    - title: PVC Piepūšamo laivu ražošana
      desc: Augstas frekvences metinātas PVC švertlaivas, tenderes un sporta laivas. Vairāku kameru konfigurācijas, grīdas iespējas (līstes, gaisa klājs, uzrullējams) un piederumu integrācija.
    - title: Hypalon RIB Laivu izgatavošana
      desc: Komerciālās klases Hypalon CSM caurules, kas savienotas ar stikla šķiedras vai alumīnija dziļā V veida korpusiem. 3,3 m līdz 6,0 m gari patrulēšanai, glābšanai, tūrēm un niršanas operācijām.
    - title: Privātā etiķete un pielāgota zīmola veidošana
      desc: 'Pilns privātās etiķetes pakalpojums: pielāgota logotipa siltuma pārnese vai sietspiede, zīmola iepakojums (mazumtirdzniecības kastes, pārvadāšanas maisiņi), lietotāja rokasgrāmatas jūsu valodā un svītrkodi/UPCreģistrācija.'
    - title: Pielāgotu veidņu un instrumentu dizains
      desc: Iekšējā 3D CAD/CAM inženieru komanda. Mēs projektējam un izgatavojam pielāgotas alumīnija un kompozītmateriālu veidnes unikālām korpusa formām, klāja konfigurācijām un piederumu stiprinājuma punktiem.
    - title: OEM Piederumi un aprīkojums
      desc: Glābšanas vestes (CE12402), divu darbību sūkņi, oglekļa/neilona lāpstiņas, remonta komplekti, pārnēsāšanas somas un pavadas komplekti. Pilns komplekts un iepakojums mazumtirdzniecībai gatavai prezentācijai.
experience_section:
  eyebrow: Reālās dzīves pieredze
  title: Partnerības, kas veidoja zīmolus
  subtitle: Patiesi stāsti no zīmoliem un organizācijām, kas sadarbojās ar ražošanu Paddle Board Overstock OEMODM .
  stories:
    - quote: Mēs nonācām Paddle Board Overstock ar skici uz salvetes un prasību sarakstu. Astoņus mēnešus vēlāk mums bija ražošanai gatavs produkts, kas pirmajā mēģinājumā izgāja CE sertifikāciju.
      narrative: Eiropas jaunuzņēmums ar jaunu dizainu, kas SUP tika izstrādāts Paddle Board Overstock ODM ražošanai. Paddle Board Overstock R&D komanda īstenoja koncepciju caur CAD dizainu, FEA strukturālo analīzi, hidrodinamisko simulāciju, veidņu izveidi, prototipa izgatavošanu un ražošanas instrumentiem. Jaunuzņēmuma dibinātājs procesa laikā trīs reizes apmeklēja Čingdao. Galaprodukts izgāja CE sertifikāciju bez jebkādām izmaiņām — rezultāts, ko dibinātājs skaidro ar Paddle Board Overstockinženieru komandas izpratni par Eiropas regulatīvajām prasībām jau no paša sākuma.
      context: Eiropas SUP zīmola ieviešana, 2023–2024
      source: Brand Founder
    - quote: NDA Aizsardzības un intelektuālā īpašuma drošības līmenis Paddle Board Overstock dod mums pārliecību dalīties ar mūsu patentētajiem dizainiem. Viņi izturas pret mūsu IP kā pret savu.
      narrative: ASV bāzēts jūras aprīkojuma uzņēmums ar patentētu vārstu tehnoloģiju bija nepieciešams ražošanas partneris, kurš varētu aizsargāt viņu intelektuālo īpašumu, ražojot lielā apjomā. Pēc piecu Ķīnas ražotāju audita viņi izvēlējās pēc Paddle Board Overstock rūpnīcas intelektuālā īpašuma aizsardzības protokoliem, drošas projektēšanas failu apstrādes un gatavības parakstīt stingrus konfidencialitātes līgumus. Partnerība četru gadu laikā ir radījusi trīs produktu līnijas bez IP incidentiem.
      context: ASV jūras aprīkojuma uzņēmums, OEM partnerība kopš 2021. gada
      source: Darbības viceprezidents
