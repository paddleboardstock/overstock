hero:
  tagline: Ceļveži
  title: Vai esat jauns SUP?
  subtitle: Praktiskas rokasgrāmatas, kas palīdzēs izvēlēties, lietot un izbaudīt piepūšamo ūdens sporta aprīkojumu.
size_guide:
  tagline: Izmēri un specifikācijas
  title: Atrodiet pareizo izmēru savām vajadzībām
  desc: Salīdziniet produkta izmērus, svara kapacitāti un ieteicamo lietošanu. Vai jums nepieciešams tūrisma SUP, kompakts kajaks vai komerciāls RIB — mūsu izmēru ceļvedis palīdz izvēlēties piemērotāko.
  link_label: Pilns izmēru ceļvedis ar produkta specifikācijām →
  link: /size-guide
  cards:
    - title: SUP Dēļi
      desc: Izvēlieties garumu atkarībā no svara un paredzamās lietošanas. Platākas dēļi (32"+) nodrošina lielāku stabilitāti. Garāki dēļi (11–12 ft) labāk seko maršrutam tūrisma laikā.
    - title: Kajaki
      desc: Vieniši kajaki (9 ft) solo braucieniem un upēm. Tandēma kajaki (12 ft) diviem airētājiem vai vienam ar ekipējumu. Vienmēr pārbaudiet svara kapacitāti.
    - title: Laivas & RIBs
      desc: Izvēlieties garumu pēc pasažieru skaita un lietošanas. Lielākas RIBs (4.5 m+) jūras braucieniem un glābšanas operācijām. Mazākas laivas (2.7 m) kā piegādes un makšķerēšanas platformas.
