hero:
  tagline: Tehniskie zīmējumi un CAD
  title: RIB un piepūšamā laiva<br />Tehnisko zīmējumu un CAD lejupielādes
  subtitle: Plānošanas līmeņa GA zīmējumi, dimensiju lapas un klāja izkārtojumi projektu novērtēšanai un specifikāciju sagatavošanai. Piekļūstiet tehniskajiem zīmējumiem atbilstošajā līmenī — no publisko PDF līdz projektu līmeņa STEP failiem.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB laivu tehniskie zīmējumi un CAD lejupielādes
direct_answer: Aquafarer nodrošina iepirkuma līmeņa tehniskos zīmējumus RIB laivām un piepūšamajiem ūdens transportlīdzekļiem — tostarp vispārējas izkārtojuma (GA) PDF, dimensiju lapas un klāja izkārtojuma zīmējumus. Detalizētāki formāti (DXF/DWG, STEP/IGES) pieejami pēc kvalificētas pieprasījuma vai projekta pieteikuma.
