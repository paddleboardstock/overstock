content_version_control:
  tagline: Versiju kontrole
  title: Zīmējuma versija<br />Vadība
  subtitle: Katrs zīmējums seko kontrolētai labojumu sistēmai. Vienmēr pārbaudiet, vai jums ir aktuālā versija, pirms izmantojat zīmējumus projekta plānošanā.
  items:
    - title: Versiju izsekošana
      description: Katram zīmējumam ir versijas kods (Rev-A, Rev-B, Rev-C), izdošanas datums, pēdējās pārskatīšanas datums, attiecīgais modelis/konfigurācija, vienības, faila izmērs un formāts. Lejupielādei ir pieejama tikai "Current" versija.
      icon: tabler:git-branch
    - title: Zīmēšanas statusa paziņojums
      description: Visi publiskie rasējumi ir atzīmēti ar "Tikai sākotnējais izkārtojums — nav paredzēts būvniecībai, sertifikācijai vai ražošanas lietošanai. Izmēri ir atkarīgi no galīgās specifikācijas un pasūtījuma apstiprināšanas." Tas aizsargā abas puses no nepareizas piemērošanas.
      icon: tabler:alert-circle
    - title: Atjauninājumu paziņojumi
      description: Kad modeļa specifikācija mainās, rasējuma versija tiek atjaunināta un iepriekšējās versijas tiek atzīmētas kā "Aizstātas." Reģistrētie lietotāji, kas lejupielādējuši DXF/DWG komplektus, tiek informēti par būtiskiem atjauninājumiem pa e-pastu.
      icon: tabler:bell
faq:
  title: Tehniskie zīmējumi — Biežāk uzdotie jautājumi
  questions:
    - q: Vai GA PDF tiešām ir bez maksas?
      a: Jā. Mūsu galveno modeļu vispārējās izkārtojuma PDF faili ir pieejami bez maksas — aizpildiet zemāk esošo īso kvalifikācijas formu, un lejupielādes saite tiks nosūtīta pa e-pastu 1 darba dienas laikā. Tie satur plānošanas līmeņa informāciju, kas ir pietiekama projekta novērtēšanai, telpu sadalei un sākotnējai specifikāciju pārskatīšanai.
    - q: Kā piekļūt DXF/DWG failiem?
      a: Aizpildiet īso kvalifikācijas veidlapu lejupielādes lapā ar sava uzņēmuma nosaukumu, projekta veidu un paredzēto izmantošanu. Apstiprinātie pieprasījumi saņem lejupielādes saiti pa e-pastu 1 darba dienas laikā.
    - q: Vai es varu iegūt STEP/IGES 3D modeļus?
      a: STEP vai IGES 3D modeļu faili ir pieejami caur mūsu projektu pieteikšanās procesu. Norādiet sava projekta apjomu, integrācijas prasības, termiņu un pirkuma nodomu. Ar nosacījumu, ka tas tiks apstiprināts — parasti 3-5 darba dienu laikā.
    - q: Kāpēc jūs ierobežojat piekļuvi detalizētākiem failiem?
      a: Korpusa ģeometrija, veidņu dati un konstrukciju aprēķini atspoguļo daudzu gadu pētniecības un attīstības investīcijas un ir ražošanas pamatīpašums. Mēs nodrošinām visu nepieciešamo iepirkumu plānošanai un projektu integrācijai, vienlaikus aizsargājot mūsu spēju turpināt ieguldīt jaunu produktu izstrādē.
    - q: Vai rasējumos ir iekļautas ražošanas detaļas?
      a: Nē. Publiskie un vieglās formas rasējumi satur iepirkuma līmeņa informāciju plānošanai un specifikācijai. Ražošanas līmeņa detaļas (laminēšanas grafiki, instrumentu ceļi, griešanas paplašinājumi) tiek kopīgotas tikai NDA ar apstiprinātiem pasūtījumiem.
    - q: Vai ir pieejami rasējumi pielāgotām vai daļēji pielāgotām RIB konfigurācijām?
      a: Pielāgoti projekta rasējumi tiek sagatavoti kā daļa no OEM/ODM izstrādes procesa. Ja vērtējat pielāgotu RIB projektu, sazinieties ar mums, lai sniegtu savas prasības, un mēs piedāvāsim projektam specifiskus GA rasējumus kā daļu no piedāvājuma.
