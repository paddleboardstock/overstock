content_tiers:
  tagline: Lejupielādes līmeņi
  title: Četri piekļuves līmeņi<br />— Pareizā detaļa pareizajā posmā
  subtitle: Mēs nodrošinām iepirkuma līmeņa zīmējumus, nevis ražošanas līmeņa failus. Katrs līmenis atbilst citam projekta posmam.
  items:
    - title: 1. līmenis — Publiskais PDF
      description: Vispārējais izkārtojums (GA), 4 skatījumu dimensiju zīmējums un klāja izkārtojums PDF formātā. Pieejams bezmaksas lejupielādei. Pietiekams projektu plānošanai, vietas sadalei un sākotnējai specifikācijas pārbaudei.
      icon: tabler:file-type-pdf
    - title: 2. līmenis — Vieglā formāta DXF/DWG
      description: 2D CAD faili (DXF vai DWG) plānošanas līmeņa izkārtojuma integrācijai. Prasa īsu kvalifikācijas veidlapu (uzņēmuma nosaukums, projekta veids, paredzētais lietojums). Nav iekļauti strukturālie vai ražošanas dati.
      icon: tabler:file-code
    - title: 3. līmenis — Projektu pieteikuma STEP/IGES
      description: 3D modeļu faili (STEP vai IGES) sistēmu integrācijai, aprīkojuma dizainam vai kuģu arhitektūras koordinācijai. Prasa projektu pieteikumu ar apjomu, laika grafiku un pirkuma nodomu. Pakļauts apstiprināšanai.
      icon: tabler:cube
    - title: 4. līmenis — NDA Inženierija
      description: Korpusa strukturālie zīmējumi, laminēšanas grafiki, cauruļu griešanas paplašinājumi un veidņu dati. Pieejami tikai NDA ar apstiprinātiem pasūtījumiem. Šie ir ražošanas līmeņa faili — neparedzēti publiskai distribūcijai.
      icon: tabler:lock
content_included:
  tagline: Kas ir iekļauts
  title: Zīmējuma saturs<br />Pēc modeļa
  subtitle: Katram modelim ir standarta rasējumu pakete, kas ietver būtisko plānošanas informāciju B2B pircējiem un projektu inženieriem.
  items:
    - title: Vispārīgā izvietojuma shēma (GA)
      description: Sānskats, skats no augšas un šķērsgriezums, kas parāda korpusa formu, cauruļu izvietojumu, konsoles atrašanās vietu, sēdvietas, degvielas sistēmu un galvenos izmērus (LOA, platumu, cauruļu diametru, deadrise leņķi). Pārskatīšanas statuss un autortiesības norādītas virsrakstu blokā.
      icon: tabler:layout
    - title: 4 skatījumu dimensiju zīmējums
      description: Sānu, priekšējs, aizmugures un augšējais skats ar kopējām dimensijām transporta plānošanai (augstums uz piekabes, platums konteineram, svars pacelšanai). Ietver operacionālos un transporta konfigurācijas.
      icon: tabler:ruler-2
    - title: Klāja izkārtojuma un aprīkojuma plāns
      description: No augšas skatāms klāja attēls, rādot konsoles pamatni, sēdekļu pozīcijas, D-gredzenu atrašanās vietas, navigācijas gaismu pozīcijas, dzenskrūves sūkņa piekļuvi, akumulatora/degvielas nodalījumu un aprīkojuma stiprinājumu punktus. Ierobežota precizitāte attiecībā uz patentētajām saskarnēm.
      icon: tabler:map
    - title: Transporta un iepakojuma zīmējums
      description: Konteinera iekrāvēja plāns, gultiņas izmēri, svara sadalījums un pacelšanas punktu pozīcijas loģistikas plānošanai. Iekļautas standarta un pielāgotas iepakojuma opcijas.
      icon: tabler:truck
content_protection:
  tagline: IP aizsardzība
  title: Ko mēs nesakām<br />& Kāpēc
  subtitle: Mūsu inženierijas IP aizsardzība nodrošina, ka mēs varam turpināt ieguldīt pētniecībā un attīstībā, vienlaikus sniedzot visu, kas pircējiem nepieciešams projektu plānošanai.
  items:
    - title: Apvalka veidnes serdes dati
      description: Spraudņa un veidnes ģeometrija, CNC instrumentu ceļi un laminēšanas šabloni ir patentētas ražošanas aktīvi. Tie netiek kopīgoti nevienā piekļuves līmenī ārpus apstiprinātiem NDA līgumiem.
      icon: tabler:ban
    - title: Cauruļu griešanas paplašinājumi
      description: Cauruļu auduma plakanā modeļa griešanas faili ir ražošanas līmeņa dati. Pieejami tikai NDA ar apstiprinātiem ražošanas pasūtījumiem un tiek kopīgoti tikai ar līgumslēdzēju pusi.
      icon: tabler:ban
    - title: Strukturālie aprēķini
      description: Detalizēta sprieguma analīze, FEA rezultāti un laminātu grafiki ir atbilstības jutīgi dokumenti, kas tiek kopīgoti tikai ar Norādītajām iestādēm un ar NDA saistītiem klientiem atbilstības novērtēšanas procesā.
      icon: tabler:ban
    - title: Konkurentu pārbaude
      description: Mēs paturam tiesības noraidīt CAD piekļuves pieprasījumus, kas šķiet nākuši no konkurentiem, studentiem bez projekta konteksta vai pusēm bez leģitīmas iepirkuma nodoma.
      icon: tabler:shield
content_models:
  tagline: Pieejamie modeļi
  title: Tehniskā zīmēšana<br />Pieejamība pēc modeļa
  subtitle: GA PDF lejupielādes ir pieejamas mūsu galvenajiem RIB un piepūšamo laivu modeļiem. Sazinieties ar mums, lai iegūtu konkrētu modeļu rasējumus, kas nav uzskaitīti.
  items:
    - title: AF580 RIB
      description: 5,8 m RIB, GRP deep-V korpuss, Hypalon vai PVC caurules, centrālā konsole. Pieejami GA, izmēri, klāja izkārtojums un transporta plāns. Dizaina kategorija C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, GRP vidējas izturības-V korpuss, Hypalon vai PVC caurules, sānu vai centrālā konsole. Pieejama vispārējā shēma un izmēri. Dizaina kategorija C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, GRP korpuss, PVC caurules, stūresrats vai konsoles. Pieejami GA un izmēri. Dizaina kategorija C/D.
      icon: tabler:sailboat
    - title: AF380 piepūšamā laiva
      description: 3,8 m piepūšamā laiva, alumīnija grīda, PVC caurules. Pieejami GA un iepakojuma izmēri. Atbilst EN ISO 6185 standartam.
      icon: tabler:sailboat
    - title: AF320 piepūšamā laiva
      description: 3,2 m piepūšamā laiva, gaisa klāja grīda, PVC caurules. Pieejami GA un iepakojuma izmēri. Atbilst EN ISO 6185.
      icon: tabler:sailboat
