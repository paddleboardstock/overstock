  title: RIB Laivu CE Atbilstība<br />un tehniskā dokumentācija
  subtitle: Aquafarer RIB Laivas un piepūšamie ūdens transportlīdzekļi ir projektēti un dokumentēti atbilstībai ES tirgum saskaņā ar Rekreācijas kuģu direktīvu 2013/53/ES. No riska novērtējuma līdz Atbilstības deklarācijai mēs nodrošinām modeli specifisku atbilstības dokumentāciju katram korpusam.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
