content_scope:
  tagline: Atbilstības joma
  title: Kuri produkti prasa<br />RCD atbilstību?
  subtitle: Rekreācijas kuģu direktīva 2013/53/ES attiecas uz rekreācijas kuģiem ar korpusa garumu no 2,5 m līdz 24 m. Saprast jomu ir pirmais solis ceļā uz atbilstību.
  items:
    - title: RIB Laivas (2,5–24 m)
      description: Cietie piepūšamie laivas ar korpusa garumiem no 2,5 m līdz 24 m ietilpst RCD. Dizaina kategorijas A līdz D tiek piemērotas atkarībā no paredzētajiem jūras apstākļiem un maksimālās vēja spēka ietekmes.
      icon: tabler:sailboat
    - title: Piepūšamās laivas (zem 2,5 m)
      description: Mazās piepūšamās laivas un burkās zem 2,5 m var būt daļēji atbrīvotas no RCD, bet joprojām prasa CE marķējumu saskaņā ar citām piemērojamām direktīvām un EN ISO 6185 konstrukcijas standartiem.
      icon: tabler:sailboat
    - title: SUP Dēļi un aksesuāri
      description: Stāvot airēšanas dēļi atrodas ārpus RCD jomas. Tomēr saistītie personīgie glābšanas līdzekļi (PFD) prasa CE marķējumu saskaņā ar PPE Regulu (ES) 2016/425 ar USCG Tipu III/V apstiprinājumu, ja tas ir piemērojams.
      icon: tabler:swimming
    - title: Daļēji pabeigtas laivas
      description: Laivas, kas tiek piegādātas bez motora vai specifiskām uzstādēm, prasa Būvētāja deklarāciju par daļēji pabeigtu kuģi, ar pilnu RCD atbilstību, ko veic galīgais būvētājs vai importētājs.
      icon: tabler:tool
content_trust_layers:
  tagline: Trīsslāņu uzticības sistēma
  title: Atbilstības informācija<br />— Kopīgots pareizajā līmenī
  subtitle: Ne visi atbilstības dati atrodas publiskā tīmekļa vietnē. Mēs ievērojam trīsslāņu pieeju, kas aizsargā intelektuālo īpašumu, vienlaikus veicinot pircēju uzticību.
  items:
    - title: 1. slānis — Publiskā mājaslapa
      description: Atsauces uz standartiem, izskaidroti atbilstības ceļi, uzskaitīti dokumentu veidi, sertifikācijas apjoms katrai modeļu saimei. Nav faktisku sertifikātu, testēšanas datu vai patentētu inženiertehnisku detaļu.
      icon: tabler:world
    - title: 2. slānis — Pēcizmeklēšanas koplietošana
      description: 'Pēc kvalificētas pārbaudes: rediģēts DoC paraugs, būvnieka plāksnes foto, piemērojamo standartu saraksts, atbilstības kontrolsaraksts un materiālu sertifikācijas kopsavilkumi — koplietoti saskaņā ar godīgas lietošanas noteikumiem.'
      icon: tabler:mail
    - title: 3. slānis — NDA / Pasūtījuma posms
      description: Pilns tehniskais fails, riska novērtējumi, stabilitātes aprēķini, testu ziņojumi, materiālu partiju ieraksti un ražošanas izsekojamības dokumentācija — kopīgoti tikai NDA ar apstiprinātajiem pircējiem.
      icon: tabler:lock
content_standards:
  tagline: Piemērojamie standarti
  title: ISO & EN Standards<br />Mēs būvējam, lai
  subtitle: Mūsu produkti tiek izstrādāti un testēti atbilstoši harmonizētajiem standartiem RCDsaskaņā ar . Standarta numuri un nosaukumi ir norādīti; pilni standarta teksti joprojām ir ISO autortiesības.
  items:
    - title: EN ISO 6185-3
      description: 'Piepūšamās laivas — 3. daļa: Laivas ar maksimālo motora jaudu 15 kW vai vairāk. Konstrukcijas, stabilitātes, peldošuma un cilvēka izkrišanas atgūšanas prasības RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Piepūšamās laivas — 4. daļa: Laivas ar maksimālo motora jaudu 15 kW un vienādu vai lielāku par 4,5 kW. Papildu konstrukcijas un stabilitātes prasības.'
      icon: tabler:file-text
    - title: ISO 12215 sērija
      description: Mazie kuģi — korpusa konstrukcija un skantlingi. Korpusa, klāja un starpsienu konstrukcijas dizains stikla šķiedras un alumīnija RIB korpusiem.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Mazie kuģi — Īpašnieka rokasgrāmata. Nepieciešamais saturs un formāts lietotāja rokasgrāmatai, kas pievienota katrai RIB laivai, kas piegādāta ES.
      icon: tabler:book
    - title: EN ISO 14945
      description: Mazs kuģis — Būvnieka plāksne. Informācija jāatzīmē uz būvētāja plāksnes, kas pastāvīgi piestiprināta pie katra kuģa.
      icon: tabler:badge
    - title: ISO 8666
      description: Mazie kuģi — galvenie dati. Standartizēti mērījumi un parametri konsekventai specifikācijai visā produktu dokumentācijā.
      icon: tabler:dimensions
content_process:
  tagline: Atbilstības process
  title: 6 soļu CE atbilstība<br />Darba plūsma
  subtitle: No projekta apjoma līdz sērijveida līmeņa izsekojamībai — katrs RIB modelis seko noteiktam atbilstības ceļam.
  steps:
    - number: '01'
      title: Projekta apjoms un klasifikācija
      description: Definēt RIB modeli, dizaina kategoriju (A/B/C/D), maksimālo personu skaitu, kravnesību, dzinēja jaudu un mērķa tirgu. Noskaidrojiet, vai RCD tas attiecas un kurš atbilstības novērtēšanas modulis ir nepieciešams.
      timeline: 2–3 dienas
    - number: '02'
      title: Piemērojamās prasību identifikācija
      description: Identificēt visas piemērojamās būtiskās drošības prasības no RCD I pielikuma, attiecīgajiem harmonizētajiem standartiem (EN ISO 6185, 12215, 10240, 14945) un jebkādas papildu nacionālās prasības mērķa tirgum.
      timeline: 3–5 dienas
    - number: '03'
      title: Dizains un tehniskā dokumentācija
      description: 'Izveidojiet galveno tehnisko failu: vispārējie izkārtojuma rasējumi, stabilitātes un peldspējas aprēķini, riska novērtējums, materiālu specifikācijas un sistēmu drošības analīze (degviela, elektrība, stūrēšana).'
      timeline: 10–15 dienas
    - number: '04'
      title: Produktu verifikācija un testēšana
      description: Veikt fizisko pārbaudi — spiediena testēšanu pie nominālā spiediena 1,25x 24–48 stundas, stabilitātes un peldspējas testus, slodzes testus un sistēmu nodošanu ekspluatācijā. Reģistrēt visus testu rezultātus katram korpusam.
      timeline: 5–7 dienas
    - number: '05'
      title: Marķēšanas un piegādes dokumentācija
      description: Afiksa CE marķējums, būvnieka plāksne (EN ISO 14945) un HIN/CIN (korpusa identifikācijas numurs). Sagatavot ES atbilstības deklarāciju, īpašnieka rokasgrāmatu (EN ISO 10240) un atbilstības kontrolsarakstu.
      timeline: 2–3 dienas
    - number: '06'
      title: Sērijas līmeņa izsekojamība
      description: Katrs korpuss saņem unikālu korpusa ierakstu, kas to saista ar galveno tehnisko failu, ražošanas partiju, materiālu sertifikātiem, testu rezultātiem un galīgo konfigurāciju. Ieraksti tiek glabāti 10+ gadus par RCD.
      timeline: Turpinās
content_document_cards:
  tagline: Dokumentu veidi
  title: Atbilstības dokuments<br />Kārtis
  subtitle: Šie ir dokumentu veidi, ko mēs sagatavojam un uzturam katram CEsertificētam RIB modelim. Paraugi ir pieejami pēc kvalificētas pieprasījuma.
  items:
    - title: CE / RCD Atbilstības sertifikāts
      description: Modelim specifisks sertifikāts, kas apliecina, ka kuģis atbilst visām piemērojamajām būtiskajām drošības prasībām RCD 2013/53/ES, ko izsniedz ražotājs ar informētās institūcijas iesaisti, ja tas nepieciešams.
      icon: tabler:certificate
    - title: ES Atbilstības deklarācija (DoC)
      description: Ražotāja vai pilnvarotā pārstāvja parakstīta deklarācija, kurā uzskaitītas piemērojamās direktīvas, standarti, atbilstības modulis un paziņotās institūcijas dati. Nepieciešams katram modelim, kas tiek iekļauts ES tirgū.
      icon: tabler:file-check
    - title: Ražotāja plāksne (EN ISO 14945)
      description: Pastāvīgi piestiprināta plāksnīte ar maksimālo personu skaitu, maksimālo dzinēja jaudu, dizaina kategoriju un ražotāja identifikāciju. Jāpaliek salasāmai visu kuģa mūžu.
      icon: tabler:badge
    - title: Lietotāja rokasgrāmata (EN ISO 10240)
      description: Visaptveroša rokasgrāmata, kas aptver drošu darbību, ārkārtas procedūras, apkopes grafikus un drošības brīdinājumus. Obligāta visiem RIB , kas piegādāti ES.
      icon: tabler:book
    - title: ISO Testēšanas un inspekcijas ziņojumi
      description: Spiediena testu ieraksti (1,25x / 24–48h), stabilitātes un peldspējas testu rezultāti, materiālu testu sertifikāti un izmēru pārbaudes ziņojumi — visi saistīti ar konkrētiem korpusa numuriem.
      icon: tabler:test-pipe
    - title: Materiālu izsekojamības ieraksti
      description: Partijas līmeņa izsekojamība cauruļu audumiem, līmvielām, stiklašķiedrai un aparatūrai. Sasaista katru ražošanas vienību ar ienākošo materiālu sertifikātiem un IQC pārbaudes rezultātiem.
      icon: tabler:link
    - title: Kvalitātes pārbaudes un QC ieraksti
      description: 100 punktu kvalitātes kontrolsaraksts katrai vienībai, procesa laikā veikto QC ieraksti, neatbilstības ziņojumi un koriģējošie pasākumi. Daļa no ražošanas izsekojamības ķēdes.
      icon: tabler:clipboard-check
    - title: Projekta dokumentu pakete
      description: Katram korpusam paredzēta dokumentācijas pakete, ieskaitot gala konfigurācijas ierakstu, dzinēja un aprīkojuma uzstādīšanas detaļas, nodošanas pārbaudes sarakstu un piegādes dokumentāciju.
      icon: tabler:package
content_design_categories:
  tagline: RCD dizaina kategorijas
  title: Dizaina kategorijas A–D<br />— Ko tās nozīmē
  subtitle: RCD piešķir dizaina kategorijas, pamatojoties uz maksimālo vēja spēku un nozīmīgo viļņu augstumu, ko kuģis paredzēts izturēt.
  items:
    - title: Kategorija A — Okeāns
      description: Paredzēts ilgiem braucieniem, kur vēja spēks var pārsniegt Beauforta 8 (>40 mezgli) un nozīmīgais viļņu augstums var pārsniegt 4 m. Prasa visstringentāko konstrukcijas un stabilitātes pārbaudi.
      icon: tabler:ripple
    - title: Kategorija B — Jūrniecisks
      description: Paredzēts braucieniem jūrā ar vēja spēku līdz Beauforta 8 (≤40 mezgli) un nozīmīgo viļņu augstumu līdz 4 m. Piemērots piekrastes un daļēji atklātiem ūdeņiem.
      icon: tabler:anchor
    - title: Kategorija C — Piekrastes
      description: Paredzēts piekrastes braucieniem ar vēja spēku līdz Beauforta 6 (≤27 mezgli) un nozīmīgo viļņu augstumu līdz 2 m. Lielākā daļa brīvā laika RIBs ietilpst šajā kategorijā.
      icon: tabler:sun
    - title: Kategorija D — Aizsargāta
      description: Paredzēts aizsargātiem ūdeņiem ar vēja spēku līdz Beauforta 4 (≤16 mezgli) un nozīmīgo viļņu augstumu līdz 0,3 m. Ezeri, upes un aizsargāti ostu rajoni.
      icon: tabler:pool
content_hin:
  tagline: Kuģa identifikācija
  title: HIN / CIN un būvētāja plāksne
  subtitle: Katram RIB laivai nepieciešams korpusa identifikācijas numurs (HIN) vai kuģa identifikācijas numurs (CIN) un būvētāja plāksne atbilstoši EN ISO 14945 un RCD prasībām.
  items:
    - title: Korpusa identifikācijas numurs (HIN)
      description: Unikāls 14 rakstzīmju kods, kas pastāvīgi norādīts uz labā bortā uz transom, kodējot ražotāja kodu (MIC), modeļa gadu, ražošanas gadu un sērijas numuru. Nepieciešams ES tirgus ieiešanai.
      icon: tabler:hash
    - title: Kuģa identifikācijas numurs (CIN)
      description: Saskaņā ar EN ISO 10087, slepens sekundārais identifikācijas numurs, novietots apslēgtā vietā, lai novērstu zādzības un veicinātu izsekojamību.
      icon: tabler:eye-off
    - title: Būvētāja plāksnes saturs
      description: Maksimālais personu skaits, maksimālā dzinēja jauda (kW), maksimālā slodze (kg), dizaina kategorija, ražotāja nosaukums un CE marķējums — viss pastāvīgi norādīts uz korozijizturīgas plāksnes.
      icon: tabler:badge
content_tech_file:
  tagline: Tehniskā faila struktūra
  title: Galvenais tehniskais fails<br />& Korpusa ieraksts
  subtitle: 'Mūsu dokumentācijas sistēma balstās uz divpakāpju struktūru: katras modeļu ģimenes galvenais tehniskais fails un individuālie korpusa ieraksti katrai saražotajai jahtai.'
  items:
    - title: Galvenais tehniskais fails
      description: 'Satur pilnu atbilstības dokumentāciju modeļu saimei: vispārējo izkārtojumu, riska novērtējumu, stabilitātes/peldspējas aprēķinus, materiālu specifikācijas, piemērojamos standartus un atbilstības novērtējuma ierakstus. Saglabāts 10+ gadus.'
      icon: tabler:folder
    - title: Korpusa ieraksts (izsekojamība uz katru laivu)
      description: 'Katram korpusam ir unikāls ieraksts, kas to saista ar galveno tehnisko failu: HIN, ražošanas datums, caurules partija, materiālu sertifikāti, spiediena testa rezultāts, galīgā konfigurācija, dzinēja uzstādīšana un piegādes galamērķis.'
      icon: tabler:file-description
    - title: Klientu atbilstības pakete
      description: Katram korpusam piegādes pakete, ieskaitot DoC, būvētāja plāksnes foto, lietotāja rokasgrāmatu, testa kopsavilkumu un galīgo konfigurācijas lapu — nodrošināta ar katru RIB nosūtīto uz ES.
      icon: tabler:package
content_material_cert:
  tagline: Materiālu sertifikācija
  title: Materiālu izsekojamība &<br />Sertifikācijas pierādījumi
  subtitle: Kvalitatīvas RIB laivas sākas ar kontrolētiem materiāliem un dokumentētiem procesiem. Zemāk ir norādīts, kā mēs organizējam materiālu sertifikāciju katrai kritiskajai komponentu grupai.
  items:
    - title: Piepūšamo cauruļu materiāla izsekojamība
      description: PVC unCSM/cauruļuHypalon materiāli tiek izvēlēti atbilstoši paredzētajam lietojumam, klimatiskajiem apstākļiem un mērķa tirgum. Piegādātāju tehniskie dati (TDS), materiālu partiju informācija, auduma partiju izsekojamība, UV laikapstākļu testu ziņojumi un REACH/SVHC deklarācijas ir pieejamas vienošanās projekta dokumentācijas ietvaros.
      icon: tabler:circle
    - title: Jūras alumīnija izsekojamība
      description: Alumīnija korpusa RIB projektiem sakausējuma kvalitāte, biezums un materiālu partijas tiek kontrolētas saskaņā ar apstiprināto specifikāciju. Materiālu testēšanas sertifikāti (MTC/MTR), EN 10204 3.1 dokumentācija, ķīmiskā sastāva un mehānisko īpašību ziņojumi, kā arī siltuma/partijas izsekojamība tiek nodrošināti, ja ir panākta vienošanās.
      icon: tabler:rectangle
    - title: GRP korpusa materiālu un procesu vadība
      description: Stikla šķiedras korpusa RIBsgadījumā, gelcoat, sveķi, stikla šķiedras pastiprinājums un kodola materiāli tiek pārvaldīti ar kontrolētām specifikācijām. Materiālu TDS/SDS, partijas ieraksti, lamināta specifikācijas, kā arī sacietēšanas un darbnīcas kontroles ieraksti ir pieejami pēc projekta vienošanās.
      icon: tabler:layers-subtract
    - title: Komponentu dokumentācijas atbalsts
      description: Izvēlētām sastāvdaļām — tostarp EVA klāja materiāliem, sēdvietām, nerūsējošā tērauda furnitūrai, degvielas sistēmām, elektroiekārtām un jūras piederumiem — piemērojamā piegādātāju dokumentācija tiek koordinēta, balstoties uz galīgo konfigurāciju un galamērķa tirgus prasībām.
      icon: tabler:package
    - title: Atbilstības apjoma paziņojums
      description: Sertifikāti, testēšanas ziņojumi un atbilstības dokumenti attiecas tikai uz konkrēto produkta modeli, materiālu, komponenti, ražošanas partiju vai projekta apjomu, kas norādīts attiecīgajā dokumentā. Sazinieties ar mums, norādot savu mērķa tirgu, paredzēto lietojumu un tehniskās prasības, lai piemērojamā dokumentācijas pakete tiktu apstiprināta pirms pasūtījuma veikšanas.
      icon: tabler:info-circle
faq:
  title: CE Atbilstība — biežāk uzdotie jautājumi
  questions:
    - q: Vai visas laivas ir Aquafarer RIB CE sertificētas ES tirgum?
      a: RIB mūsu katalogā iekļautās laivas ir projektētas un dokumentētas atbilstoši RCD 2013./53./ES atbilstībai saskaņā ar piemērojamajām ES direktīvām.CE Marķējums attiecas uz modeli un konfigurāciju. Sazinieties ar mums, lai iegūtu modeļa specifisku atbilstības apjoma dokumentu.
    - q: Kāda ir atšķirība starp RCD atbilstību un CE marķēšanu?
      a: RCD (Rekreācijas amatniecības direktīvā 2013/53/ES) ir ES tiesību akts, kas nosaka būtiskās drošības prasības.CE Marķējums ir vizuāls simbols, kas tiek uzlikts uz produkta un ir novērtēts un apstiprināts kā atbilstošs šīm prasībām. Produktam jāatbilst prasībām, RCD lai tas varētu nēsāt CE zīmi.
    - q: Vai jūs sniedzat atbilstības deklarācijas katrai laivai?
      a: Jā. Katrs RIB kuģis, kas piegādāts ES tirgum, ietver modeļa specifisku ES atbilstības deklarāciju, kurā uzskaitītas piemērojamās direktīvas, saskaņotie standarti, atbilstības novērtēšanas modulis un paziņotās institūcijas dati.
    - q: Kādu atbilstības novērtēšanas moduli Aquafarer izmanto?
      a: Modulis ir atkarīgs no dizaina kategorijas un laivas tipa. Lielākā daļa RIB dizaina kategorijas C modeļu izmanto A moduli (iekšējā ražošanas kontrole). Dizaina kategorijas A/B laivām vai specifiskām konfigurācijām+var piemērot moduli B, C vai B+D ar informētās institūcijas iesaisti. Mēs konsultējam par atbilstošo moduli katram projektam.
    - q: Vai varat dalīties ar atbilstības dokumentāciju pirms pasūtījuma veikšanas?
      a: Pēc kvalificētas pārbaudes mēs koplietojam atbilstības apjoma dokumentu, kurā uzskaitīti piemērojamie standarti, atbilstības ceļš un dokumentu veidi, kas pieejami jūsu vērtējamajam modelim. Pilni tehniskie faili tiek kopīgoti NDA sadaļā pēc pasūtījuma apstiprināšanas.
    - q: Kas ir korpusa identifikācijas numurs (HIN) un vai tas ir iekļauts?
      a: HIN ir 14 rakstzīmju unikāls identifikators, kas pastāvīgi atzīmēts uz katras laivas, kodējot ražotāja kodu (MIC), modeļa apzīmējumu, ražošanas gadu un sērijas numuru. Tas ir obligāts visām RIB laivām, kas iekļautas ES tirgū, un ir iekļauts katrā Aquafarer RIB.
    - q: Cik ilgi tiek glabāti tehniskie faili?
      a: Saskaņā ar RCD 2013./53./ES prasībām ražotājam tehniskais fails jāglabā vismaz 10 gadus no pēdējā produkta nonākšanas tirgū.Aquafarer Uztur pilnu tehnisko dokumentāciju visiem ražotajiem modeļiem.
    - q: Vai jūs palīdzat ar importētāja saistībām saskaņā ar RCD?
      a: 'Jā. Mēs nodrošinām dokumentācijas paketi, kas nepieciešama ES importētājiem, lai izpildītu savas saistības: tehnisko failu piekļuvi, DoC, ražotāja numura zīmi, īpašnieka rokasgrāmatu un produkta izsekojamības ierakstus. Importētāju atbildības saskaņā ar tām RCD ir skaidri dokumentētas mūsu atbilstības ceļvedī.'
