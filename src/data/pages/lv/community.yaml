stories:
  tagline: Izpētnieku stāsti
  title: Īstas piedzīvojumi no īstiem cilvēkiem
  subtitle: Uzklausiet airētājus, ģimenes un profesionāļus, kuri izmanto Aquafarer aprīkojumu uz ūdens.
  items:
    - name: Sara un Maiks
      title: SUP Explorer 11 īpašnieki, Kanāda
      content: Mēs ņēmām savus Explorer 11 uz nedēļas ilgu ceļojumu pa Algonquinas parku. Tie skaisti spēja tikt galā ar pārvietošanās gabaliem un ezeru šķērsošanu. drop-stitch konstrukcija nozīmēja, ka mēs varējām uzpūst līdz 15 PSI un iegūt stingras dēļa veiktspēju no saliekama dēļa.
      image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
      location: Algonkina parks, Kanāda
    - name: Karloss R.
      title: Geparda Ātruma braucējs, Spānija
      content: Cheetah Surge ir mans iecienātais pludmales kruīzam. Dzīvīgais dizains piesaista uzmanību pludmalē, un stabilitāte dod man pārliecību vieglā viļņošanā. Tas lieliski tiek galā gan, ja es ceļoju, gan vienkārši baudot saulrietu.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
      location: Kosta Brava, Spānija
    - name: Lina un ģimene
      title: Plūstošie Lotoslapu airētāji, Zviedrija
      content: Brīvdienu ģimenes piedzīvojumi arhipelāgā. Plūstošais lotoss ir pietiekami stabils, lai mana meita varētu stāvēt, kamēr es airēju. Uzpūšas mazāk nekā 10 minūtēs — nav nepieciešams piekabe, tikai tīra ģimenes jautrība uz ūdens.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-flowing-lotus-1.webp
      location: Stokholmas arhipelāgs, Zviedrija
    - name: Lt. Cmdr. Andres
      title: Okeāna ceļotājs pētnieks, Filipīnas
      content: Es izmantoju savu Ocean Voyager tālu attālumu piekrastes tūriem ap Palavanu. Pēc mēnešiem ilgas ikdienas lietošanas tropiskos apstākļos dēlis joprojām darbojas kā jauns. Tūrisma forma griežas cauri viļņiem, kas apturētu vājākos dēļus.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      location: Palavana, Filipīnas
    - name: Emma T.
      title: Tropical Breeze pirmreiznieks, Austrālija
      content: Es nekad nebiju bijis uz SUP iepriekš. Tropical Breeze ir tik stabils, ka es jutos pārliecināts jau pirmajā reizē. Tagad es airēju katru nedēļas nogali. Mācīšanās process praktiski ir nulle — un dēlis izskatās lieliski uz ūdens.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-tropical-breeze-1.webp
      location: Zelta Krasts, Austrālija
