hero:
  tagline: Aprīkojums
  title: Ražošanas iekārtas un mašīnas
  subtitle: Rūpnieciskās klases iekārtas griešanai, metināšanai, drukāšanai un montāžai
  back_label: Atpakaļ uz rūpnīcu
  back_link: /factory
categories:
  - title: Griešana un materiālu sagatavošana
    items:
      - name: Automātiskā PVC griešanas mašīna
        spec: CNC vadīta, 6,5 m × 2,5 m, 0,1 mm precizitāte
        desc: Datorvadāma automātiskā griešanas mašīna PVC, Hypalon un drop-stitch audumiem. Programmatūra optimizē materiāla izmantošanu līdz mazāk nekā 5% atkritumiem.
      - name: Audumu izkliedētājs
        spec: Maks. platums 3 m, barošana ar stresa kontroli
        desc: Izklāj audumu vienā vai vairākās kārtās ar kontrolētu spriegumu, lai novērstu deformāciju pirms griešanas.
  - title: Cauruļu metināšana un savienošana
    items:
      - name: Siltuma noslēgšanas mašīna
        spec: Karstā gaisa metināšana, mainīga 200–600 °C, 0,5–5 m/min
        desc: Karstā gaisa siltuma blīvēšanas mašīna PVC un Hypalon cauruļu šuvju savienošanai un metināšanai. Izmantojam cauruļu kameru un peldošo šuvju piesiešanai, blīvēšanai un sapludināšanai.
      - name: Dielektriskais RF prese
        spec: 15 kW, plātens 2000 × 600 mm
        desc: Radiofrekvences metināšanas prese galvenajām gareniskajām šuvēm, pārejas vietu savienojumiem un lielu kameru ražošanai.
      - name: CNC vadīts RF metinātājs
        spec: 8 kW, XY galds 2500 × 1200 mm
        desc: Programmējama izliekta šuves metināšana sarežģītām ģeometrijām, logotipu iespiešanai un precīzai šuvju apstrādei.
  - title: RIB korpusa ražošana
    items:
      - name: Stiklašķiedras roku kārtošanas veidnes
        spec: Vairāki veidņi RIB korpusiem līdz 6 m LOA
        desc: Tradicionāla roku slāņošana ar stiklašķiedru, poliesteru un vinilestera sveķu sistēmām. Katrs slānis tiek ruļļots ar rokām un vakuumā iepakots vienmērīgas lamināta kvalitātes un izturības nodrošināšanai.
      - name: Gelcoat smidzināšanas kabīne
        spec: Temperatūras kontrolēta, filtrēta ventilācija
        desc: Gelcoat uzklāšana RIB korpusiem. Nodrošina augsti spīdīgu, UV izturīgu apdari ar precīzu biezuma kontroli.
      - name: CNC maršrutētājs (5 ass)
        spec: 3 m × 2 m × 1 m darba laukums, dzesējams spindelis
        desc: Apstrāde korpusa ievietojumiem, konsoles veidnēm, sēdekļu pamatnēm un pielāgotām kronšteiniem.
  - title: SUP Drukāšana un dekorēšana
    items:
      - name: Digitālais printeris
        spec: Augstas izšķirtspējas tintes strūklas druka, līdz 2 m drukas platums
        desc: Tiešā druka uz auduma pilnkrāsas SUP klāja grafikai. Drukā pielāgotus rakstus, gradientus un foto kvalitātes attēlus ar UV-izturīgām ūdens bāzes tintēm.
      - name: Sietspiedes mašīna
        spec: Rokas un pusautomātiskā, daudzkrāsu reģistrācija
        desc: Sietspiede SUP dēļu logotipiem, zīmolu zīmēm un atkārtojošiem rakstiem. Nodrošina izturīgas, necaurspīdīgas drukas ar dzīvu krāsas piesātinājumu.
  - title: Montāža un aprīkošana
    items:
      - name: Motora pacēlājs
        spec: 500 kg ietilpība, regulējama stieņbalka
        desc: Droša ārējo dzinēju, no 2,5 līdz 60 zs, uzstādīšana.
      - name: Konsoles maketa rāmjs
        spec: Regulējams augstums un slīpums
        desc: Stūres, droseles un instrumentu paneļu sagatavošana pirms uzstādīšanas.
      - name: Hidrauliskā šļauku knaibles
        spec: Līdz 1" iekšdiametrs, digitālais spiediena mērītājs
        desc: Hidrauliskās stūres šļauku komplekti ar pielāgotu garumu un piespiestām savienojumu galvām.
      - name: Elektrības vadu panelis
        spec: 3 m × 1,5 m, iepriekš drukāti shēmas diagrammas
        desc: Pilnu elektrības vadu komplektu montāža un testēšana ārpus laivas.
  - title: Testēšana un kvalitātes kontrole
    items:
      - name: Universālais stiepes testeris
        spec: 50 kN, / ASTM D751
        desc: Plīsuma spēka, plīsuma pagarinājuma un plīsuma izplatīšanās testēšana auduma partijām.
      - name: Gaisa noturības testa iekārta
        spec: Programmējama, 30 minūšu spiediena turēšana
        desc: Automatizēts spiediena turēšanas tests katrai caurules kamerai pirms montāžas.
      - name: Šuvju atdalīšanas testeris
        spec: Motorēts 180° atdalījums 100 mm/min
        desc: Metināšanas un līmju šuvju spiediena noturības testēšana saskaņā ar ISO 6185.
      - name: Ksenona loka laika apstākļu kameru
        spec: 2000 stundu ekspozīcija
        desc: UV izturības testēšana krāsas maiņai un izturības saglabāšanai.
