hero:
  tagline: Process
  title: Ražošanas process
  subtitle: No izejvielām līdz jūrai gatavām laivām — katrs solis mūsu kontrolē
  back_label: Atpakaļ uz rūpnīcu
  back_link: /factory
intro: Atšķirībā no zīmoliem, kas ražošanu ārpakalpojumā nodod trešo pušu rūpnīcām, Paddle Board Overstock paši pieder un pārvalda visu ražošanas ķēdi. Šī vertikālā integrācija ļauj mums uzturēt stingru kvalitātes kontroli katrā posmā, ātri reaģēt uz pielāgotām prasībām un nodrošināt konsekventu produkta kvalitāti partiju pēc partijas. Lūk, kā mūsu objektā tiek būvēta laiva.
steps:
  - step: '01'
    title: Materiālu saņemšana un pārbaude
    description: Katra ienākošā PVC auduma, stiklašķiedras paklāja, sveķu un aparatūras partija tiek pārbaudīta atbilstoši specifikācijām. Auduma paraugi tiek testēti pēc stiepes izturības, biezuma vienmērīguma un UV izturības pirms nodošanas ražošanai. Neatbilstošie materiāli tiek izolēti un atgriezti.
    duration: 1–2 dienas
  - step: '02'
    title: Automātiskā PVC griešana
    description: Apstiprinātie audumi tiek uzklāti uz automātiskās CNC griešanas mašīnas un griezti ar precizitāti zem milimetriem. Datorizēta ligzdošana izvieto paneļus, lai samazinātu atkritumus — parasti zem 5%. Grieztie paneļi tiek marķēti pēc laivas modeļa un kameras, pēc tam sakrauti pārsūtīšanai uz metināšanas darbnīcu.
    duration: 2–4 stundas katram laivas komplektam
  - step: '03'
    title: Cauruļu siltuma hermetizācija un metināšana
    description: Paneļi tiek piestiprināti un salīmēti, izmantojot siltuma hermetizācijas iekārtas ar karstā gaisa metināšanu kontrolētā temperatūrā 200–600 °C. Galvenās šuves tiek pastiprinātas ar RF dielektrisko metināšanu, lai nodrošinātu hermētiskus, augstas stiprības savienojumus. Pabeigtās kameras tiek uzpūstas līdz 1,25× darba spiedienam, nodrošinot 30 minūšu gaisa noturības pārbaudi.
    duration: 1–2 dienas katrai laivai
  - step: '04'
    title: Stiklašķiedras RIB korpusa veidne
    description: RIB Laivu korpusi tiek ražoti, izmantojot ar rokām uzklātu stiklašķiedras veidni. Stiklašķiedras paklāja slāņi un austas šķiedras tiek ar rokām velmēti ar poliestera vai vinilestera sveķiem precīzās formās. Katrs slānis tiek vakuumā iepakots, lai nodrošinātu vienmērīgu lamināta kvalitāti. Korpuss tiek pabeigts ar gelcoat, lai nodrošinātu augsti spīdīgu, UVizturīgu jūras virsmu.
    duration: 2–4 dienas katram korpusam
  - step: '05'
    title: SUP Drukāšana un dekorēšana
    description: SUP Kartona plāksnes grafika tiek uzklāta, izmantojot digitālo drukāšanu pilnkrāsu fotokvalitātes dizainiem, kā arī sietspiedi izturīgiem logotipiem un atkārtotiem rakstiem. Izdrukas tiek sacietētas un noslēgtas, lai UV nodrošinātu nodiluma izturību.
    duration: 1–2 dienas
  - step: '06'
    title: Galīgā montāža un aprīkojums
    description: Stikla šķiedras korpusi un PVC cauruļu komplekti tiek savienoti konveijera līnijā. Dzinējs ir uzstādīts, stūres un droseles vadība ir savienota, degvielas sistēma uzstādīta, un pilns elektriskais vads ir pieslēgts. Katra laiva ievēro 100 punktu montāžas kontrolsarakstu ar obligātu apstiprinājumu katrā posmā.
    duration: 2–3 dienas
  - step: '07'
    title: Kvalitātes testēšana un inspekcija
    description: 'Katram pabeigtajam kuģim tiek veikta obligāta kvalitātes pārbaude: kameras gaisa noturēšanas tests, sistēmu darbības pārbaude, stiprinājumu griezes momenta pārbaude un kosmētiskā pārbaude. Pielāgotas un prototipu konstrukcijas arī saņem jūras izmēģinājumus ūdenī, kas aptver ātrumu, vadāmību, stabilitāti un izturību.'
    duration: 1–2 dienas
  - step: '08'
    title: Iepakošana un piegāde
    description: Laivas tiek izlaistas, salocītas pēc procedūras, iepakotas smagās austās maisiņos vai saplākšņa kastēs un iekrautas nosūtīšanai. Katra paka ir marķēta ar modeli, sērijas numuru un galamērķi. Mēs koordinējam ar kravu ekspeditoriem FCL un LCL konteineru sūtījumiem visā pasaulē.
    duration: 1 diena
