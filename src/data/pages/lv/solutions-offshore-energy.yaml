content_challenge:
  tagline: Izaicinājums
  title: Jūras enerģijas prasības<br />Uzticamība ekstremālos apstākļos
  subtitle: Jūras enerģijas darbības liek aprīkojumam sasniegt maksimumu — ekstēmi laikapstākļi, izolētas vietas, nepārtraukti darba cikli un nulle tolerances kļūdām.
  paragraphs:
    - Jūras enerģijas nozare darbojas vissarežģītākajās jūras vidēs zemeslodes eksistencē. Darba laivas atbalsta naftas un gāzes platformas, vēja turbīnu uzstādījumus, jūras kabeļu darbības un jūrniecības būvniecības projektus — bieži atklātās okeāna apstākļos ar ierobežotām laikapstākļu logiem. Aprīkojuma bojājums nav tikai dārgs, tas ir bīstams.
    - '**Drošība ir augstākā prioritāte** — apkalpes pārvadāšanas kuģiem jādarbojas droši jūras stāvokļos, kas apturētu citas darbības. Stabilitāte pārvadāšanas brīdī, uzticama dzinēja darbība visos laikapstākļos un izturīga konstrukcija atkārtotai dokēšanai pie jūras struktūrām ir obligātas prasības.'
    - '**Visu laikapstākļu spēja ir būtiska** — Jūras vēja parki un naftas platformas darbojas visu gadu. Darba laivām jāspēj darboties lielos viļņos, stipros vējos un ierobežotā redzamībā. Dienas un nakts operācijas prasa pilnu navigācijas aprīkojumu un uzticamus apgaismojuma sistēmas.'
    - '**Jūras vēja sektors strauji aug** — Tūkstošiem jaunu turbīnu tiek uzstādītas visā pasaulē, katra prasa regulāru apkalpes pārvadāšanu, instrumentu transportēšanu un uzturēšanas atbalstu. Tas rada pastāvīgu pieprasījumu pēc speciāli projektētām apkalpes pārvadāšanas laivām (CTV) un atbalsta RIBs.'
    - Aquafarer jūras enerģijas RIBs ir izstrādātas ar pastiprinātiem deep-V korpusiem, smagajām Hypalon caurulēm, pilnu navigācijas aprīkojumu un drošības sistēmām, kas paredzētas jūras enerģijas darbību ekstremālajiem apstākļiem.
content_solution:
  tagline: Mūsu risinājums
  title: Speciāli projektētas jūras RIBs<br />Enerģijas nozarei
  subtitle: Katrs Aquafarer jūras enerģijas RIB ir izstrādāts drošai, uzticamai darbībai ekstremālos jūras apstākļos — no Ziemeļjūras līdz Dienvidaustrumu Āzijai.
  list:
    - Pastiprināts deep-V korpuss raupjos ūdeņos un paredzama vadāmība
    - Smagās Hypalon caurules ar UV un ķīmisko izturību ilgstošam jūras darbam
    - 316 nerūsējošā tērauda aprīkojums — bez korozijas nepārtrauktā sālsūdens ekspozīcijā
    - 'Pilna navigācijas sistēma: GPS, radars, VHF, nakts navigācijas gaismas — standarts jūras modeļos'
    - Pašizliešana klājam drošai darbībai apkalpes ienākšanas jūras apstākļos
    - Vairāku dzinēju konfigurācijas — viens vai divi ārējie risinājumi misijas rezerves nodrošināšanai
    - Vilkšanas stabs un smagās naglu stiprinājumi platformu un boju apstrādei
    - Augstas redzamības cauruļu krāsas identifikācijai jūras darba vietās
content_segments:
  tagline: Enerģijas profili
  title: Jūras enerģijas risinājumi<br />Pēc lietojumprogrammas veida
  subtitle: Dažādām jūras enerģijas nozarēm ir unikālas darba laivu prasības — sākot no platformu atbalsta RIBs līdz vēja parku CTV un zemūdens inspekcijas kuģiem.
  items:
    - title: Jūras naftas un gāzes platformu atbalsts
      subtitle: Apkalpes pārvietošana, aprīkojuma piegāde, platformas drošības gaidīšana
      description: Naftas un gāzes platformām nepieciešama ikdienas apkalpes maiņa, aprīkojuma un piegāžu transports, kā arī drošības rezerves nodrošināšana. Darba laivām jādarbojas droši ap platformu konstrukcijām, stiprās straumēs un mainīgos jūras stāvokļos, kā arī jānodrošina precīza stacijas uzturēšana personāla pārvietošanas laikā, izmantojot kāpnes vai ejas. Ekstrēmā vide — ogļūdeņraži, ķīmiskās vielas, pastāvīga sāls migla — prasa korozijizturīgu konstrukciju un uzticamu veiktspēju.
      features:
        - Apkalpes pārvietošanas konfigurācija ar drošu iekāpšanas piekļuvi un margām
        - Pret koroziju Hypalon izturīgas caurules un 316 nerūsējošā tērauda furnitūra
        - Pastiprinātas berzes strēles biežai platformas spārnu saskarei
        - Pašizsūknējošs klājs eļļainam ūdenim un ķīmiskai mazgāšanai
        - Augstas ietilpības degvielas tvertne ilgstošai darbībai jūrā
        - Divu dzinēju opcija misijai kritiskai redundancei
    - title: Jūras vēja elektrostaciju darbība
      subtitle: Apkalpes pārvietošana, turbīnas apkope, instrumentu transportēšana
      description: Jūras vēja enerģija ir visstraujāk augošais sektors jūras enerģijā. Operatoriem ir nepieciešami apkalpes pārvietošanas kuģi (CTV), kas droši var pārvietot tehniķus uz turbīnu piekļuves platformām jūras stāvokļos līdz 1,5 m nozīmīgam viļņu augstumam. Stabilitāte pārvietošanas laikā, spēja darboties jebkuros laika apstākļos un uzticama ikdienas darbība ir kritiski svarīga. Vēja parku apkalpošanas kuģi darbojas pēc saspringtiem grafikiem — jebkādi dīkstāves kavē turbīnu nodošanu ekspluatācijā vai uzturēšanu, tieši ietekmējot enerģijas ražošanas ieņēmumus.
      features:
        - Optimizēta korpusa forma stabilai apkalpes pārvietošanai turbīnas bāzē
        - Deep-V ieeja ērtai braukšanai jūrā viļņos un viļņos
        - Pilna aizsardzība pret laikapstākļiem — slēgta konsole vai stūres telpa apkalpes komfortam
        - Klāja vieta instrumentiem, rezerves daļām un servisa aprīkojumam
        - Nakts operāciju pakete pagarinātām dienas ierobežotām ziemas maiņām
        - Klusa ārborda darbība ar minimālu trokšņa ietekmi uz jūras vidi
    - title: Zemūdens kabeļu un cauruļvadu atbalsts
      subtitle: Inspekcija, apkope, ROV atbalsts, izpēte
      description: Zemūdens kabeļu un cauruļvadu operatoriem ir nepieciešamas darba laivas maršrutu pārbaudei, apkopes atbalstam, ROV operācijām un izpētes uzdevumiem. Šiem kuģiem nepieciešamas stabilas platformas zemūdens aprīkojuma izvietošanai un atgūšanai, precīza zema ātruma manevrēšana kabeļu izsekošanai un uzticama darbība piekrastes un jūras vidē. Laivas stabilitāte ir kritiski svarīga sonāra un izpētes iekārtu precizitātei.
      features:
        - Stabila platforma ar lēnu ātrumu kabeļu izsekošanai un mērījumu operācijām
        - Atvērtā klāja izkārtojums ROV izvietošanai, kabeļu spoles un mērīšanas aprīkojums
        - Iekārtu stiprinājuma plātnes sonāram, GPS un izpētes instrumentiem
        - Zema vilkmes korpusa dizains, lai minimizētu jūras gultnes traucējumus inspekcijas laikā
        - Precīza lēnas ātruma manevrēšana ar atsaucīgu ārbordu stūrēšanu
    - title: Jūras inženiertehnika un būvniecības atbalsts
      subtitle: Personāla transports, materiālu piegāde, niršanas atbalsts
      description: Jūras inženierijas darba veicēji, kas strādā ostu būvniecībā, piekrastes aizsardzībā un jūras platformu uzstādīšanas projektos, nepieciešamas daudzfunkcionālas darba laivas personāla pārvadāšanai starp būvniecības kuģiem un krastu, materiālu un instrumentu piegādei, niršanas atbalstam un vietu izpētei. Šīs laivas darbojas aktīvās būvniecības zonās ar vairākiem kuģiem, ierobežotu manevrēšanas vietu un mainīgiem jūras apstākļiem. Ilgmūžība un daudzpusība ir vissvarīgākās.
      features:
        - Daudzfunkcionāla klāja izkārtojuma iespēja personālam, materiāliem un niršanas aprīkojumam
        - Niršanas kāpnes un aprīkojuma stiprinājumi niršanas atbalsta operācijām
        - Smagās slodzes krāni un vilkšanas statņi būvniecības vietas manevrēšanai
        - Izturīgs Hypalon konstrukcija būvgruži un nodilumizturībai
        - Elastīgi sēdvietu konfigurējumi — personāla transports vai kravas režīms
