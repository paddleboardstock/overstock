hero:
  tagline: Matrix för industrilösningar
  title: Scenariobaserade marina lösningar<br />För professionell verksamhet
  subtitle: Specialkonstruerade uppblåsbara vattenskotrar och RIB:er konfigurerade för räddnings-, uthyrningsflotta, yachttender och kommersiella fisketillämpningar – var och en med tekniska specifikationer och anpassningsmöjligheter.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer professionella marina lösningar för olika industrier
direct_answer: 'Aquafarer levererar scenariekonstruerade uppblåsbara vattenfarkoster och RIB-lösningar för kommersiella marina operationer: räddnings- och patrullbåtar med förstärkta Hypalon-rör och flerkammarsäkerhet, hyrflotta SUP:er och kajaker med 1,2 mm PVC och varmluftssvetsade sömmar för hållbarhet med lågt underhåll, lyxig deepacht och IB, lyxig deepacht och IB. kraftiga fiskekonfigurationer med spöhållare och livbrunnssystem.'
solution_a:
  tagline: Lösning A
  title: Marine Rescue &<br />Kommersiell patrull
  subtitle: Höghastighets-RIB:er med flera kammare för räddningstjänst och brottsbekämpande verksamhet.
  badge: Heavy-Duty Series
  description: Våra marina räddnings- och patrull-RIB:er är konstruerade med förstärkta Hypalon/PVC-luftrör med hög densitet med flerkammaroberoende flytande design. Varje fartyg är utrustat med reflekterande tejp av professionell kvalitet, räddningslinor och snabbuppblåsningsventiler för att vara redo att användas. Deep-V glasfiberskrov ger exceptionell stabilitet vid höga hastigheter och under tuffa sjöförhållanden.
  features:
    - title: Flerkammarsäkerhet
      description: 4–6 oberoende luftkammare — varje enkammarpunktion upprätthåller en positiv flytning
    - title: Förstärkt rörtyg
      description: 1,2 mm Hypalon CSM eller 1 680 DTEX PVC med dubbellagers varmluftssvetsade sömmar
    - title: Professionellt betyg
      description: SOLAS reflekterande tejp, räddningslinor, dragklossar, målarlinje med snabb släppning
    - title: Höghastighetsskrov
      description: Deep-V glasfiber eller aluminium skrov klassad för 25–45 knop beroende på konfiguration
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Skrovmaterial
      value: Glasfiber / Marine-grade aluminium
    - label: Rörtyg
      value: 1,2 mm Hypalon CSM / 1 680 DTEX PVC
    - label: Max hastighet
      value: 25–45 knop
    - label: Kapacitet
      value: 6–12 personer
    - label: Motorområde
      value: 40–200 hk
    - label: Certifiering
      value: CE / ISO 9001
solution_b:
  tagline: Lösning B
  title: Uthyrning av vattensporter &<br />utrustning för resortflotta
  subtitle: Ultrahållbara uppblåsbara SUP:ar, kajaker och båtar med lågt underhåll, byggda för daglig uthyrning på resorter, klubbar och turnéverksamheter.
  badge: Rental-Grade
  description: Vår utrustning för hyrflotta är konstruerad för högsta hållbarhet och lägsta underhållskostnad. Vi använder 1,2 mm förstärkt PVC med trelagers varmluftssvetsad sömteknik som motstår UV-nedbrytning och frekventa kollisionsskador. Drop-stitch-konstruktion säkerställer att brädor behåller styvheten även efter hundratals hyrcykler. Alla modeller har förstärkta D-ringar, nötningsbeständiga rälsband och ventiler av kommersiell kvalitet.
  features:
    - title: PVC av kommersiell kvalitet
      description: 1,2 mm förstärkt PVC med UV-stabilisatorer — 3 gånger tjockare än material av konsumentkvalitet
    - title: Varmluftssvetsade sömmar
      description: Smältsvetsning i tre lager — starkare än limning, motstår delaminering
    - title: Drop-Stitch-styvhet
      description: 1 680 DTEX-kärna med 2 gängor/sq in — klassad till 20 PSI för hårdpappliknande styvhet
    - title: Fleet-Read Design
      description: Förstärkta D-ringar, kommersiella Halkey-Roberts ventiler, nötningsbeständiga rälsband
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Rörmaterial
      value: 1,0–1,2 mm Förstärkt PVC
    - label: Sömteknik
      value: Trelagers varmluftssvetsning
    - label: Max tryck
      value: 15–20 PSI (modeller med droppstygn)
    - label: UV-beständighet
      value: 1 000+ timmars accelererad testning
    - label: Garanti
      value: 2–5 år beroende på modell
    - label: Underhåll
      value: Minimal — skölj och förvara
solution_c:
  tagline: Lösning C
  title: Yacht Tender &<br />Lyxvattenskotrar
  subtitle: Lättvikts, högpresterande RIB-tender designade för superyachtförvaring och gästtransport med lyxig passform och finish.
  badge: Premium Series
  description: Våra yacht tender RIBs kombinerar lätt konstruktion med lyxig estetik. Deep-V aluminium- eller glasfiberskrov ger exceptionell åkkvalitet och lätta davitlyft. tillgänglig med färgmatchad rörgrafik, premiumklädsel och anpassade konsollayouter. Kompakta förvaringsmått gör dem idealiska för superyachtgarage och däcksförvaring.
  features:
    - title: Lättviktskonstruktion
      description: Skrov av marint aluminium minskar vikten med 30 % jämfört med glasfiber för enkla lyft
    - title: Deep-V-prestanda
      description: 18–22 graders deadrise skrov för smidig gång i hack och utmärkt spårning
    - title: Lyxig passform och finish
      description: Anpassad klädsel, färgmatchade rör, förstklassig styrkonsol, rostfritt paket
    - title: Kompakt förvaring
      description: Designad för superyachtgarage — uppblåsbara rör för kompakt förvaring
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Skrovtyp
      value: Deep-V Aluminium / Glasfiber
    - label: Deadrise
      value: 18–22 grader
    - label: Max hastighet
      value: 30–40 knop
    - label: Torrvikt
      value: 120–350 kg (aluminiumskrov)
    - label: Davit Lift redo
      value: Ja — lyftpunkter standard
    - label: Lagring
      value: Uppblåsbara rör, stapelbara
