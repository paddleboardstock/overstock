hero:
  tagline: Om företaget
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock-verkstad
  title: |
    Marin ingenjörskonst <br />
    i <span class="text-accent dark:text-white">Paddle Board Overstock</span>-stil
  subtitle: 'Vi började i en kustverkstad med en båt och en orubblig övertygelse: marina produkter bör vara designade som om livet hängde på dem – för det gör det. Idag levererar vi till 40+ länder, men varje skrov går fortfarande genom samma händer som grundade företaget.'

stats:
  title: I siffror
  columns: 4
  stats:
    - title: Levererade skrov
      amount: '2,400+'
    - title: Leveransländer
      amount: '50+'
    - title: Total erfarenhet (år)
      amount: '60'
    - title: Genomsnittlig svarstid (h)
      amount: '24'

features3_what_we_build:
  title: Vad vi bygger
  subtitle: En fokuserad produktlinje vi kan utan och innan – inga genvägar eller badge engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB-båtar
      description: RIB med aluminiumskrov från 3,3 m till 7,5 m. Designade för patrullering, dykning, fiske och familjebruk.
      icon: tabler:ship
    - title: Gummibåtar
      description: PVC- och Hypalon-gummibåtar från 2,4 m till 4,2 m. Lätta, hållbara och lätta att förvara.
      icon: tabler:speedboat
    - title: Superyacht-tender
      description: Kompakta RIB med höga specifikationer, anpassade till värdytans design.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Tillbehör
      description: Selar, pumpar, skydd, vattentäta väskor, bränsletankar och elektronik. Allt kompatibelt med våra båtar.
      icon: tabler:package
    - title: Modifieringar och reparationer
      description: Reparation av luftkammare, elektronikuppgraderingar och motorbyten.
      icon: tabler:tool
    - title: Skräddarsydda produkter
      description: Design för kommersiella, vetenskapliga och militära kunder.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Skräddarsydd båt

steps2_values:
  title: Våra värderingar
  subtitle: Tre principer som format varje produkt från dag ett.
  items:
    - title: Bygg som om din familj var i båten
      description: Varje skrov, varje svets och varje komponent behandlas som om de skulle användas av våra egna familjer.
      icon: tabler:heart
    - title: Ingenjörskonst före försäljning
      description: Om specifikationen är fel ändrar vi specifikationen – aldrig kunden.
      icon: tabler:settings
    - title: Support efter garantin
      description: Tjugo år gamla skrov ringer fortfarande efter delar – och vi svarar fortfarande.
      icon: tabler:headset

steps2_milestones:
  title: Milstolpar
  subtitle: Den korta versionen av Paddle Board Overstocks historia.
  isReversed: true
  items:
    - title: Grundad i en kustverkstad
      description: Två mariningenjörer med en CNC-fräs och en orubblig idé.
      icon: tabler:building-factory
    - title: Första 1 000 levererade skroven
      description: Uppnått under det sjunde året, främst genom mun-mot-mun-metoden och återkommande kunder.
      icon: tabler:circle-check
    - title: Internationellt exportprogram
      description: Leveranser till 40+ länder med lokala servicepartners på fem kontinenter.
      icon: tabler:world

features2_locations:
  title: Våra platser
  tagline: Var du hittar oss
  columns: 3
  items:
    - title: Huvudkontor och verkstad
      description: Kustnära industripark, byggnad 4 – öppet mån–fre för besök efter överenskommelse.
    - title: EU-servicecenter
      description: Medelhavshamn – modifieringar, reparationer och garantisupport för europeiska kunder.
    - title: APAC-partnernätverk
      description: Auktoriserade servicepartners i Australien, Japan, Singapore och Hongkong.
brand_hub_tagline: 'Varumärke'
brand_hub_title: 'Utforska vårt varumärke'
brand_hub_subtitle: 'Fördjupa dig i vår marina ingenjörskompetens, globala närvaro och de principer som driver oss.'

brand_hub_cards:
  - title: 'Marin expertis'
    desc: 'Decennier av materialvetenskap, precisionstillverkning och tester i verkliga förhållanden — från PVC/Hypalon-tillverkning till konstruktion av djupa V-skrov och drop-stitch-teknik.'
    link: /brand-marine-expertise
    link_label: 'Läs mer →'
  - title: 'Global närvaro'
    desc: 'Leverans till 50+ länder från vår anläggning i Qingdao med auktoriserade servicepartners i Europa, Asien-Stillahavsområdet och Amerika.'
    link: /brand-global-presence
    link_label: 'Läs mer →'
  - title: 'Varför Paddle Board Overstock'
    desc: 'Vertikal integration, dubbel certifiering (ISO 9001 + BSCI), CE-efterlevnad och låga MOQ — byggt för varumärken, distributörer och myndigheter.'
    link: /brand-why-paddleboardoverstock
    link_label: 'Läs mer →'

production_section:
  tagline: 'Produktionsexcellens'
  title: 'Garanterar förfinat hantverk'
  description: 'Paddle Board Overstocks produktionslinje är dedikerad till att tillverka högkvalitativa, hållbara och högpresterande uppblåsbara produkter.'
  cards:
    - title: 'Erfaret teknikerteam'
      items:
        - 'Professionell kunskap om PVC, Hypalon och marina material'
        - 'Precisionshantverk vid skärning, limning och montering av tillbehör'
        - 'Kontinuerlig utbildning i de senaste produktionsteknikerna'
    - title: 'Avancerad produktionsutrustning'
      items:
        - 'CNC-skärmaskiner för exakt tygskärning med minimalt fel'
        - 'Högprecisions varm-/kallimning för lufttäta, hållbara sömmar'
        - 'Professionell utrustning för lufttäthets- och dragprovning'
    - title: 'Mogent ledningssystem'
      items:
        - 'Standardiserade produktionsprocesser med tydliga kvalitetskrav'
        - 'Lean produktionsfilosofi som minskar spill och förbättrar effektiviteten'
        - 'Effektiv leveranskedjehantering med pålitliga leverantörspartnerskap'
    - title: 'Strikt kvalitetskontroll'
      items:
        - 'Certifierat ledningssystem för kvalitet'
        - 'Flerstegsinspektion: råmaterial, under produktion, slutkontroll'
        - 'Strikta lufttäthets- och hållbarhetstester före leverans'

global_ops_section:
  tagline: 'Global driftsarkitektur'
  title_html: 'Ett varumärke, <span class="text-white/90">två centra</span>'
  description_html: 'Sedan september 2026 drivs Paddle Board Overstock av <strong class="text-white">Weihai Dongjilian Co., Ltd.</strong> (New Mexico, USA) — den globala enheten för distribution, kommersiell B2B-försäljning, avtal, fakturering och eftermarknad. FoU, produktion och kvalitetskontroll finns kvar hos <strong class="text-white">Paddle Board Overstocks tillverkningsnav i Qingdao</strong>, som levererar varje order direkt från fabrik, FOB Qingdao. Övergången ändrade vem som signerar ditt avtal — inte vem som bygger din båt.'
  stats:
    - value: '2,400+'
      label: 'Skrov levererade globalt'
    - value: '50+'
      label: 'Exportländer'
    - value: '10+'
      label: 'Års tillverkningserfarenhet'
