hero:
  tagline: Marin expertis
  title: 'Årtionden av marin teknik<br />i varje skrov'
  subtitle: 'Paddle Board Overstock kombinerar djup materialvetenskap, precisionstillverkning och tester i verkligheten för att bygga vattenfarkoster som presterar när det verkligen gäller.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstocks marin- och utvecklingsteam i arbete
expertise_materials:
  tagline: Materialvetenskap
  title: 'Rätt material<br />för varje användningsområde'
  subtitle: 'Vi arbetar med tre kärnmaterial — vart och ett valt för specifika användningsfall och prestationskrav.'
  columns: 3
  items:
    - title: Marint PVC
      description: '1100 denier PVC-tyg — vårt mest mångsidiga material. UV-stabiliserat, slagtåligt och REACH-godkänt. Idealiskt för fritidsbåtar, SUP-brädor och kajaker där vikt och kostnadseffektivitet spelar roll.'
      icon: tabler:droplet
    - title: Hypalon/CSM i premiumklass
      description: 'Överlägsen kemikalieresistens och UV-stabilitet. Hypalon-båtar kan hålla 15-20 år med rätt skötsel. Rekommenderas för kommersiella, räddnings- och militära tillämpningar där långsiktig hållbarhet är avgörande.'
      icon: tabler:shield
    - title: Glasfiber och aluminium
      description: 'Djup-V glasfiberskrov för RIB:ar och patrullbåtar — vågskärande prestanda i tuffa förhållanden. Aluminiumskrov för tunga kommersiella arbetsbåtar som kräver maximal styrka och lastkapacitet.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Tillverkningskapacitet
  title: 'Precisionstillverkning<br />i varje steg'
  subtitle: 'Vår anläggning på 12 000 m² är utrustad med specialiserade maskiner för varje produktionssteg.'
  columns: 2
  items:
    - title: CNC-skärning
      description: 'Datorstyrd skärning säkerställer exakta, repeterbara tygpaneler med minimalt svinn. Varje detalj passar exakt som designad.'
      icon: tabler:cpu
    - title: Högfrekvenssvetsning
      description: 'Industriell HF-svetsning skapar sömmar starkare än basmaterialet. Konsekvent temperatur- och tryckstyrning garanterar lufttäta fogar i varje produktionsserie.'
      icon: tabler:bolt
    - title: Drop-stitch-kärnmontage
      description: 'Tusentals polyestertrådar binder samman tygets över- och underskikt och möjliggör högtrycksuppumpning (15-20 PSI) för styva, stabila SUP-brädor och golv.'
      icon: tabler:building-arch
    - title: Trycktestning
      description: 'Varje uppblåsbar produkt trycktestas före leverans. RIB-slangar testas vid 1,25x angivet tryck — håller de där, presterar de på vattnet.'
      icon: tabler:wind
    - title: Sömhållfasthetstest
      description: 'Slumpmässiga prov från varje produktionsserie genomgår destruktiva sömhållfasthetstester. Resultaten loggas och kan spåras till specifika produktionsserier.'
      icon: tabler:files
    - title: Vattentestning
      description: 'Varje RIB-modell genomgår sjötester före certifiering. Tester i verkliga kustförhållanden validerar prestanda, köregenskaper och stabilitet.'
      icon: tabler:ripple
expertise_design:
  tagline: Design & teknik
  title: 'Konstruerat för verkliga förhållanden'
  subtitle: 'Vår designfilosofi börjar med hur båten ska användas — sedan bygger vi upp tekniken kring det användningsfallet.'
  items:
    - title: Djup-V skrovdesign
      description: "Våra glasfiberskrov har beräknade V-vinklar, optimerade för varje modells längd och avsedda användning. Brantare V för prestanda i grov sjö, flackare för stabilitet."
    - title: Flerkammarssäkerhet
      description: 'Varje båt har 3-7 oberoende luftkamrar. Om ett fack skadas håller de övriga kamrarna båten flytande och operabel.'
    - title: Ergonomisk layout
      description: 'Konsolposition, slanghöjd och sätesplacering är utformade för förarens komfort vid längre användning — oavsett om det är patrullering, fiske eller transport.'
    - title: Skräddarsydd konfiguration
      description: 'Slangfärger, konsolkonfiguration, bränslekapacitet, tillbehörsfästen — varje modell kan anpassas efter specifika driftskrav.'
cta:
  title: 'Har du en specifik tillämpning i åtanke?'
  subtitle: 'Vårt engineeringteam kan ge råd om materialval, design och tillverkning för ditt projekt.'
  actions:
    - variant: primary
      text: Fråga våra ingenjörer
      href: /contact
    - text: Se produktutbudet
      href: /products
