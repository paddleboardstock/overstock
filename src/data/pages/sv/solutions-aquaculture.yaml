content_challenge:
  tagline: Utmaningen
  title: Vattenbruket kräver<br />Saltvattentuff utrustning
  subtitle: Fiskodlingar, pärlormar och havsrancher verkar i den mest kemiskt aggressiva marina miljön - långvarig exponering för saltvatten, bränsle- och foderrester och kontinuerlig daglig användning.
  paragraphs:
    - Vattenbruksverksamheter driver 365 dagar om året i utsatta kust- och havsmiljöer. Arbetsbåtarna som används för burinspektion, fodertransport, underhåll av pärllinjer och service av utrustning utsätts för konstant nedsänkning i saltvatten, UV-exponering och kemisk kontakt från bränslen, fiskfoder och antifoulingbehandlingar.
    - '**Korrosion är huvudfienden** — Standardmässig marin utrustning försämras snabbt under dessa förhållanden. Utombordsmotorer, släpramar och skrovbeslag måste ständigt bytas ut. Operatorer behöver båtar byggda i korrosionsbeständiga material som klarar år i denna miljö utan att försämras.'
    - '**Daglig pålitlighet är avgörande** — Ett havererat arbetsfartyg innebär missade utfodringsscheman, försenade skördar och kostsamma produktionsförluster. För pärlodlingar kan en enda missad inspektionsdag innebära betydande skador på skörden. För fiskodlingar påverkar försenad utfodring tillväxthastigheter och lönsamhet.'
    - Aquafarers vattenbruks-RIB:er är konstruerade med korrosionsbeständigt beslag, extra slitstarka Hypalon-tuber och förstärkta skrov, specialbyggda för de krävande förhållanden som råder inom fiskodling, pärlodling och havsranching.
content_solution:
  tagline: Vår lösning
  title: Specialbyggda RIB:er<br />För vattenbruksindustrin
  subtitle: Varje Aquafarer vattenbruksarbetsbåt är designad för att motstå aggressiva saltvattenmiljöer samtidigt som den levererar pålitlig daglig prestanda.
  list:
    - Hypalon-tuber i marin kvalitet — överlägsen motståndskraft mot UV, saltvatten, bränslen och kemikalier från fiskfoder
    - Beslag i rostfritt stål 316 i hela båten — ingen rost vid långvarig exponering för saltvatten
    - Förstärkta slidlistor och kölskydd för upprepad kontakt med bryggor och burar
    - Självtömmande däck för enkel tvätt och dränering efter fodertransport och skördeoperationer
    - Platt däckskonfiguration för transport av fodersäckar, skördelådor och utrustning
    - Utombordskonfigurationer från 15 till 60 hk — optimerade för förhållandet mellan lastkapacitet och bränsleeffektivitet
    - Färgalternativ för tuber med hög synlighet för enkel upptäckt över stora odlingsområden
content_segments:
  tagline: Vattenbruksprofiler
  title: Arbetsbåtslösningar<br />Efter vattenbrukstyp
  subtitle: Olika vattenbruksverksamheter har olika krav på arbetsbåtar — från små smidiga RIB:er för inspektion av fiskburar till stabila transportplattformar för pärludling och tunga arbetsbåtar för havsuppfödning.
  items:
    - title: Fiskodlingsverksamhet
      subtitle: Burinspektion, fodertransport, skördestöd
      description: Marina fiskodlingar driver burar i utsatta kust- och havsområden. Arbetsbåtar används dagligen för inspektion av burnät, utfodring, skördestöd och underhåll av utrustning. Den primära utmaningen är korrosion – båtar utsätts ständigt för saltvatten, fiskfoderrester och bränsle. En pålitlig arbetsbåt är avgörande eftersom utebliven utfodring eller försenad skörd direkt påverkar produktionsresultatet och lönsamheten.
      features:
        - 'Paket för aggressiva miljöer: beslag i rostfritt stål 316, komponenter i marinlegering'
        - Platt däckslayout för transport av fodersäckar och skördelådor
        - Självtömmande däck för enkel sköljning efter insatserna
        - Hypalon-tuber med kemikaliebeständig beläggning för exponering för foder och bränslen
        - Förstärkta slidlistor för frekvent kontakt med burar och bryggor
    - title: Pärlodlingsverksamhet
      subtitle: Stabil transport för pärllinjebesiktning och skörd
      description: Pärlfarm kräver stabila, pålitliga arbetsbåtar för daglig transport mellan pärllinjer, inspektion av ostronnät och skördinsamling. Dessa verksamheter bedrivs på avlägsna kustnära platser med begränsad underhållsinfrastruktur. Båten måste vara stabil nog för besättningen att arbeta från medan de inspekterar pärllinjer, med enkel ombordstigning och gott om däcksutrymme för att bära skördade ostron, nät och förnödenheter. Tillförlitlighet och enkelt underhåll är avgörande på avlägsna gårdsplatser.
      features:
        - Stabil skrovkonstruktion för stående besättning vid inspektion av pärllinjer
        - Platt däck med halkfritt ytskikt för säkra rörelser för besättningen
        - Lågt fribord för enkel åtkomst till oströnät och skörd
        - Enkel utombordskonfiguration för enkel service på plats
        - Korrosionsbeständigt tub- och beslagpaket för kontinuerlig saltvattenexponering
    - title: Havsranching och marin förbättring
      subtitle: Yngeltransport, burservice, övervakningsstöd
      description: Havsuppfödningsverksamhet innebär att släppa ut ungbestånd i hanterade marina miljöer, övervaka tillväxten och serva strukturer för förbättring. Arbetsbåtar måste transportera levande ungbestånd i luftade containrar, bära övervakningsutrustning och komma åt grunda utsättningsplatser vid kusten. Skrovdesign måste balansera bärförmåga med grunt djupgående för tillgång till strand och mynning.
      features:
        - Däcksutrymme för luftade transportbehållare för yngel och övervakningsutrustning
        - Litet djupgående för åtkomst till utplanteringsplatser vid stränder och mynningar
        - Enkel landstigning på strand — förstärkt köl och bogskydd
        - Fästpunkter för montering av övervakningselektronik och provtagningsutrustning
        - Extra slitstarka Hypalon-tuber för hållbarhet i förhållanden med blandad sand och saltvatten
