hero:
  tagline: Certifieringar & Standarder
  title: 'Kvalitetscertifieringar<br />& Efterlevnadsstandarder'
  subtitle: 'Paddle Board Overstock-produkter tillverkas i enlighet med internationella standarder för maritim säkerhet, kvalitetsledningssystem och miljöföreskrifter.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstocks kvalitetscertifieringar och efterlevnadsdokumentation
content_certifications:
  tagline: Våra certifieringar
  title: 'Certifierad kvalitet,<br />globalt erkänd'
  subtitle: '64 CE-certifierade modeller och fabriksvida certifieringar visar vårt engagemang för kvalitet, säkerhet och miljöansvar.'
  items:
    - title: 'CE-certifierad'
      description: '64 CE-certifierade modeller uppfyller europeiska CE-märkningskrav för fritidsfartyg, vilket säkerställer att krav på säkerhet, hälsa och miljöskydd uppfylls.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Vårt kvalitetsledningssystem är certifierat enligt ISO 9001:2015 och omfattar design, tillverkning och distribution av uppblåsbara fartyg och maritim utrustning.'
      icon: tabler:clipboard-check
    - title: 'UKCA-märkning'
      description: 'Produkter som säljs på den brittiska marknaden har UKCA-märkning, vilket bekräftar överensstämmelse med brittiska föreskrifter för maritim utrustning och fritidsfartyg.'
      icon: tabler:shield
    - title: 'BSCI-konform'
      description: 'Paddle Board Overstock granskas enligt BSCI (Business Social Compliance Initiative), vilket visar etiska tillverkningsmetoder, rättvisa arbetsvillkor och ansvar i leveranskedjan.'
      icon: tabler:heart-handshake
    - title: 'REACH-konform'
      description: 'Alla material i Paddle Board Overstock-produkter uppfyller EU:s REACH-förordning för kemikaliesäkerhet, vilket säkerställer att vår PVC, Hypalon och komponenter inte innehåller begränsade ämnen.'
      icon: tabler:flask
    - title: 'Materialprovning'
      description: 'Tyger testas för draghållfasthet, rivstyrka, UV-nedbrytning och prestanda vid kallsprickning. Varje produktionssats provtas och verifieras.'
      icon: tabler:test-pipe
content_factory:
  tagline: Fabriksstandarder
  title: 'Tillverkning i toppklass<br />— byggd enligt specifikation'
  subtitle: 'Vår anläggning på 12,000 m² drivs enligt strikta kvalitetskontrollprotokoll i varje skede av produktionen.'
  list:
    - 'Ingående materialkontroll: alla råvaror — PVC-tyg, Hypalon, aluminium, plywood, lim — testas mot specifikationer innan de går in i produktionen.'
    - 'Kvalitetskontroll i processen: varje produktionsskede har dokumenterade QC-kontrollpunkter. Svetsstyrka, sömjustering, ventilinstallation och dragmoment verifieras inline.'
    - 'Trycktestning: Varje uppblåsbar kammare trycktestas vid 1,25× nominellt tryck i 24-48 timmar. Läckagegraden måste vara noll för godkänt betyg.'
    - 'Slutbesiktning: färdiga produkter inspekteras för dimensionell noggrannhet, kosmetisk finish, tillbehörskomplettering och förpackningsintegritet före leverans.'
    - 'Partispårbarhet: varje produkt har ett serienummer kopplat till produktionspartiuppgifter, vilket möjliggör fullständig spårbarhet från råvara till färdig vara.'
content_safety:
  tagline: Standarder för maritim säkerhet
  title: 'Säkerhet först<br />— konstruerad för pålitlig drift'
  subtitle: 'Paddle Board Overstock-produkter är konstruerade och testade för att uppfylla internationella standarder för maritim säkerhet för kommersiellt och fritidsanvändning.'
  items:
    - title: 'ISO 6185'
      description: 'Uppblåsbara båtar uppfyller ISO 6185-standarderna för konstruktion, stabilitet, flytförmåga och lastkapacitet.'
      icon: tabler:sailboat
    - title: 'ABYC-standarder'
      description: 'Elektriska system och bränslesystem följer ABYC-standarderna (American Boat & Yacht Council) för säker installation och drift.'
      icon: tabler:bolt
    - title: 'SOLAS-efterlevnad'
      description: 'Säkerhetsutrustning och livräddningsutrustning uppfyller SOLAS-kraven (Safety of Life at Sea) där så är tillämpligt.'
      icon: tabler:lifebuoy
cta:
  title: 'Behöver du certifierade produkter för ditt projekt?'
  subtitle: 'Kontakta vårt team för att diskutera certifieringskrav, dokumentation och efterlevnad för din marknad.'
  actions:
    - variant: primary
      text: Begär certifieringsdokument
      href: /contact
    - text: Se vår kvalitetssida
      href: /quality
