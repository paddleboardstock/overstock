hero:
  tagline: Myndighetscentrum
  title: Varför Aquafarer?<br />Förtroende byggt under ett decennium
  subtitle: Varje båt vi bygger bär vikten av 10+ års marinteknik, certifierade kvalitetssystem och tusentals framgångsrika verksamheter över hela världen. Det är därför branschfolk väljer Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer marin tillverkningsanläggning och ingenjörsteam
stats:
  title: Aquafarer i siffror
  stats:
    - title: År i drift
      amount: Since 2012
    - title: FoU-ingenjörer
      amount: 50+
    - title: Betjänade länder
      amount: 50+
    - title: Utrustning levererad
      amount: 15,000+
features3_brand:
  tagline: Vilka vi är
  title: Varumärkesgrund <br />och -arv
  subtitle: Historien, expertis och globala räckvidd som definierar Aquafarer som en pålitlig tillverkare av marinutrustning.
  isBeforeContent: false
  columns: 3
  items:
    - title: Om Aquafarer
      description: Grundades 2012 i Qingdao, Kina. Från en kustnära verkstad till en anläggning på 12 000 m² – hela Aquafarer-historien.
      icon: tabler:building-factory
      link: /about
    - title: varumärkesberättelse
      description: Hur ett team av mariningenjörer satte sig för att göra uppblåsbara vattenskotrar av professionell kvalitet tillgängliga över hela världen.
      icon: tabler:book
      link: /brand-story
    - title: Expertis inom marin industri
      description: Djup materialvetenskap, precisionstillverkning och tester i verkligheten — årtionden av marin ingenjörskonst i varje skrov.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Global närvaro
      description: Betjänar 50+ länder på alla kontinenter. Regional expertis för lokala regulatoriska krav och marknadspreferenser.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Varför Aquafarer
      description: Det som skiljer oss – kvalitet, anpassning, direkt fabriksprissättning och komplett support för kommersiella operatörer.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Vårt team
      description: Möt ledarskapet – mariningenjörer, materialvetare och tillverkningsexperter driver Aquafarer framåt.
      icon: tabler:users
      link: /brand/team
    - title: Ingenjörsteam
      description: 78+ kombinerade FoU-år, 40+ plattformar, 12 certifieringar, 1200+ OEM-projekt. Det tekniska teamet bakom varje produkt.
      icon: tabler:engine
      link: /engineering-team
    - title: FoU-center
      description: Skrovteknik, RF-svetsning, PVC-labb, prototypframställning, testtank och kvalitetslabb – vår fullständiga forsknings- och utvecklingsanläggning.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Förtroende & kvalitet
  title: Certifieringar, kvalitet<br />& bevis
  subtitle: Oberoende certifieringar, rigorösa tester och verkliga bevis som visar vårt engagemang för kvalitet.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certifieringar
      description: CE, ISO 9001, UKCA, BSCI, REACH — fullständig certifieringsdokumentation och överensstämmelse för globala marknader.
      icon: tabler:shield-check
      link: /certifications
    - title: Kvalitet & Testning
      description: Varje produkt trycktestas före leverans. Sömstyrka, UV-beständighet, flytkraft – verifierad i varje steg.
      icon: tabler:clipboard-check
      link: /quality
    - title: Bevis och bevis
      description: Testresultat, implementeringsfoton, inspektionsrapporter från tredje part och fallstudier som validerar Aquafarers kvalitet.
      icon: tabler:file-check
      link: /evidence
    - title: Kunskapsdiagram
      description: Utforska Aquafarers enhetsdiagram – produkter, teknologier, certifieringar och relationer i en uppkopplad kunskapsbas.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Ledarskap
  title: Möt teamet<br />Bakom Aquafarer
  subtitle: Branschexpertis som spänner över marinteknik, materialvetenskap, kvalitetsledning och global B2B-handel.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Grundare och VD
      description: 15+ år inom marin tillverkning. Ledde tidigare forskning och utveckling hos en stor kinesisk båttillverkare. Innehar flera patent inom uppblåsbar båtdesign.
      icon: tabler:crown
    - title: Zhang Wei — chefsingenjör
      description: 20+ år i PVC/Hypalon-tillverkning och djup-V-skrovdesign. Tidigare teknisk direktör på en europeisk marin ingenjörsfirma.
      icon: tabler:engine
    - title: Chen Ming — Chef för FoU
      description: doktor i materialvetenskap. Specialiserat på drop-stitch-teknik och högfrekvent svetsning. 10+ år i textilkompositer.
      icon: tabler:flask
    - title: Liu Qiang — Produktionschef
      description: 18+ år inom lean manufacturing. Six Sigma svart bälte. Implementerade ISO 9001 kvalitetssystem över alla produktionslinjer.
      icon: tabler:settings
    - title: Wang Fang — Kvalitetschef
      description: 12+ år inom marin kvalitetskontroll. Certifierad CE och ISO revisor. Övervakar testning för varje produktionsbatch.
      icon: tabler:shield-check
    - title: Helen Lee - Försäljningsdirektör
      description: 15+ år i internationell B2B-handel. Hanterade OEM/ODM-partnerskap i över 30 länder. Behärskar 4 språk flytande.
      icon: tabler:briefcase
cta:
  title: Vill du verifiera våra referenser?
  subtitle: Kontakta oss för certifieringskopior, inspektionsrapporter från tredje part eller för att boka ett fabriksbesök.
  actions:
    - variant: primary
      text: Begär inloggningsuppgifter
      href: /contact
    - text: Visa certifieringsdetaljer
      href: /certifications
