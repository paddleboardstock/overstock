hero:
  tagline: Global närvaro
  title: 'Verksamma i 50+ länder<br />på alla kontinenter'
  subtitle: 'Från europeiska kustpatrulloperatörer till australiska vattensportsdistributörer och räddningsteam i Mellanöstern — Aquafarer-båtar är på vattnet världen över.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarers globala marina tillverkning och distribution
stats:
  title: Global räckvidd
  stats:
    - title: Länder
      amount: '50+'
    - title: Exportmarknader
      amount: Europa, Amerika, Asien, Mellanöstern, Oceanien
    - title: Produktion
      amount: Qingdao, China
    - title: Lager i USA
      amount: Montclair, CA
features3_markets:
  tagline: Nyckelmarknader
  title: 'Regional expertis<br />för lokala krav'
  subtitle: 'Vi förstår att olika marknader har olika regulatoriska krav, preferenser och användningsområden.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa och Storbritannien
      description: 'CE-certifierade produkter som uppfyller EN ISO 6185-standarderna. Stark efterfrågan på RIB-båtar, uppblåsbara båtar och SUP-brädor på EU-marknaderna. Brittiska distributörer uppskattar vår snabba leverans.'
      icon: tabler:map-pin
    - title: Nordamerika
      description: 'Tillverkning godkänd av US Coast Guard. USA-lager i Montclair, Kalifornien för snabb leverans till västkusten. Växande efterfrågan på fiskebåtar, räddningsfarkoster och fritids-SUP:ar.'
      icon: tabler:map-pin
    - title: Australien och Oceanien
      description: 'Stark marknad för RIB-båtar och uppblåsbara tenders. Australiska distributörer uppskattar våra Hypalon-båtar för UV-tålighet under skarp sol. Snabb leverans från vår anläggning i Asien.'
      icon: tabler:map-pin
    - title: Mellanöstern
      description: 'Växande efterfrågan på patrull- och räddningsbåtar. Våra RIB:ar med aluminiumskrov är populära hos kustbevaknings- och säkerhetsoperatörer. Skräddarsydda konfigurationer för miljöer med höga temperaturer.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Distributionsnätverk
  title: 'Partnerskap med distributörer<br />världen över'
  subtitle: 'Vi samarbetar med etablerade distributörer av marin utrustning, OEM-varumärken och offentliga upphandlingsorgan.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM-partnerskap
      description: 'Tillverkning under eget varumärke (private label) för globala vattensportsvarumärken. Vi sköter allt från design till produktion till dropshipping.'
      icon: tabler:building
    - title: Distributörsnätverk
      description: 'Auktoriserade distributörer i över 20 länder håller lager och erbjuder lokalt stöd. Nya distributörsförfrågningar är välkomna.'
      icon: tabler:users
    - title: Myndigheter och institutioner
      description: 'Direkt leverans till kustbevakningar, sjöräddningsorganisationer och militära upphandlingsprogram. Efterlevnad av institutionella upphandlingskrav.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Global logistik och support'
  subtitle: 'Från fabrik till destination — vi hanterar hela leveranskedjan.'
  items:
    - title: Fraktalternativ
      description: 'Sjöfrakt (FOB Qingdao), flygfrakt för brådskande order och expresskurir för prover och reservdelar.'
      icon: tabler:truck-delivery
    - title: Lager i USA
      description: 'Lager i Montclair, Kalifornien för snabb leverans i hela Nordamerika. Västkusten: 2-3 dagar, centrala delarna: 3-4 dagar, östkusten: 4-5 dagar.'
      icon: tabler:building-warehouse
    - title: Reservdelar
      description: 'Äkta Aquafarer-reservdelar och förbrukningsmaterial i lager året runt. Vanliga delar skickas inom 24 timmar.'
      icon: tabler:package
    - title: Teknisk support
      description: 'Direkt linje till vårt ingenjörsteam för tekniska frågor, reparationsrådgivning och stöd vid ombyggnad. Vi ger stöd åt båtar som vi byggde för 20 år sedan.'
      icon: tabler:headset
cta:
  title: 'Vill du bli distributör?'
  subtitle: 'Vi expanderar aktivt vårt distributionsnätverk. Kontakta vårt exportteam för att diskutera partnerskapsmöjligheter.'
  actions:
    - variant: primary
      text: Partnerskapsförfrågan
      href: /contact
    - text: Se vårt produktsortiment
      href: /products
