  - value: 12,000 m²
    label: Total tillverkningsyta
    detail: Fördelat på 6 specialiserade verkstäder
  - value: 15,000
    label: Båtar producerade per år
    detail: SUP:ar, kajaker, RIB:ar, jollar, säkerhetsutrustning
  - value: 200-300
