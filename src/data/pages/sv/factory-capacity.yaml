    detail: EU, USA, AU, Mellanöstern, Asien
  - value: 30–45
    label: Standardleveranstid (dagar)
    detail: Från PO-bekräftelse till FOB
  - value: 10+
    label: Års erfarenhet av export
    detail: Sedan 2012

workshops:
  - title: SUP-brädproduktion
    description: '4 parallella monteringslinjer för uppblåsbara SUP-brädor. Varje linje kan producera 50–80 brädor per skift. Digitala tryck- och sidscreentryckstationer körs samtidigt. Årlig SUP-kapacitet: 8 000+ brädor.'
    output: 8 000+ SUP/år
  - title: RIB-båtproduktion
    description: 'Dedikerad verkstad för glasfiberskrov med 6 formstationer för RIB-skrov upp till 7,6 m. Området för tubsvetsning och montering hanterar 3–5 RIB:ar samtidigt. Årlig RIB-kapacitet: 2 000+ båtar.'
    output: 2 000+ RIB/år
  - title: Uppblåsbar båt och jolle
    description: 'Mångsidiga produktionslinjer för uppblåsbara båtar, kajaker och jollar. Varmluftssvetsstationer, RF-dielektriska pressar och monteringsarbetsplatser konfigureras om beroende på ordermix. Årlig kapacitet: 5 000+ enheter.'
    output: 5 000+ enheter/år
  - title: Säkerhetsutrustning
    description: 'Separat renrumsproduktionsområde för flytvästar och säkerhetsutrustning. Dedikerad sömnad, skuminsättning och teststationer. Årlig kapacitet för flytvästar: 50 000+ enheter.'
    output: '50 000+ flytvästar/år'

oem_capacity:
  moq: 'SUP: 5–10 enheter | RIB: 2–5 enheter | Kajak/jolle: 10–20 enheter | Anpassad form: 200+ enheter'
  lead_time: 'Standard 30–45 dagar. Provexemplar 15–20 dagar. Express möjlig.'
  payment: 'T/T 30% deposition + 70% före leverans. L/C, Western Union accepteras.'
