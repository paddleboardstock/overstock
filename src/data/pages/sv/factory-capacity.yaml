hero:
  tagline: Produktionskapacitet
  title: Tillverkningskapacitet och årsproduktion
  subtitle: Anläggning på 12 000 m² som producerar 15 000 båtar per år med utrymme för skalning

intro: Paddle Board Overstock driver en av de största specialiserade anläggningarna för tillverkning av uppblåsbara båtar i Qingdao, Kina. Vår fabrik på 12 000 m² är organiserad i sex specialiserade verkstäder som arbetar parallellt, vilket ger oss kapacitet att producera 15 000 båtar per år inom SUP-, kajak-, jolle-, RIB- och säkerhetsutrustningslinjer.

