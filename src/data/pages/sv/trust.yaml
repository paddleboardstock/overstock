      icon: tabler:clipboard-check
faqs_rib:
  title: RIB-båtar FAQ
  subtitle: Vanliga frågor om våra uppblåsbara båtar med stelt skrov.
  columns: 2
  items:
    - title: Vilka storlekar på RIB-båtar erbjuder Aquafarer?
      description: Vi erbjuder 35 RIB-modeller från 2,5 m till 7,6 m, allt från kompakta tendrar till tunga kommersiella och patrullfarkoster. Varje modell finns med flera konfigurationsalternativ.
    - title: Vad är skillnaden mellan en RIB och en traditionell uppblåsbar båt?
      description: En RIB (uppblåsbar båt med stelt skrov) kombinerar ett fast glasfiber- eller aluminiumskrov i djup V-form med uppblåsbara Hypalon- eller PVC-slangar. Detta ger dig stabiliteten och lastkapaciteten från en hård båt med stötdämpningen och flytförmågan från en uppblåsbar.
    - title: Vilka motorer är kompatibla med Aquafarer RIB?
      description: Våra RIB stödjer utombordsmotorer från 3 HK till 250 HK beroende på modell. Varje produktsida listar maximal motoreffekt. Vi rekommenderar att rådgöra med din återförsäljare för idealisk matchning.
    - title: Är Aquafarer RIB CE-certifierade?
      description: Ja. Alla rekreationsmodeller är CE-certifierade enligt tillämpliga europeiska standarder för rekreationsfarkoster. Kommersiella och patrullmodeller uppfyller ytterligare stabilitets- och lastkrav.
    - title: Vad är garantin på RIB-båtar?
      description: Alla Aquafarer RIB levereras med standard ett års garanti mot tillverkningsfel, som täcker skrovdelaminering, slangssömsfel, ventilfel och maskinvaruproblem.
    - title: Hur många luftkammare har Aquafarer RIB?
      description: Våra RIB har 3 till 7 oberoende luftkammare beroende på modellens längd. Denna flerkammardesign säkerställer att båten förblir flytande även om en avdelning komprometteras.
faqs_inflatable:
  title: Uppblåsbara båtar FAQ
  subtitle: Vanliga frågor om våra uppblåsbara jollar, kajaker och båtar.
  columns: 2
  items:
    - title: Vilka material används i Aquafarer uppblåsbara båtar?
      description: Vi använder militär-grade PVC (1100 denier) och premium Hypalon/CSM-gummi, beroende på modell. Båda materialen är UV-stabiliserade, nötningsbeständiga och uppfyller EU:s REACH- och RoHS-föreskrifter.
    - title: Hur länge håller uppblåsbara båtar?
      description: Med rätt skötsel håller en kvalitets-PVC uppblåsbar båt 7–10 år, medan Hypalon-modeller kan hålla 15–20 år. Regelbunden rengöring, UV-skydd och korrekt förvaring förlänger livslängden avsevärt.
    - title: Vilket underhåll krävs för en uppblåsbar båt?
      description: Grundläggande underhåll inkluderar sköljning med sötvatten efter varje användning (särskilt i saltvatten), torkning före förvaring, årlig kontroll av ventiltätningar och applicering av UV-skydd på slangar. Undvik långvarig solexponering när den inte används.
    - title: Kan uppblåsbara båtar användas i saltvatten?
      description: Ja. Alla Aquafarer uppblåsbara båtar är designade för både söt- och saltvattenanvändning. Vi rekommenderar sköljning med sötvatten och grundlig torkning efter saltvattenexponering för att förhindra korrosion av beslag och saltkristallisation i tyget.
    - title: Hur förvarar jag en uppblåsbar båt?
      description: Töm luften, rengör och torka båten helt före förvaring. Rulla löst (undvik skarva veck), förvara på en sval, torr plats borta från direkt solljus och håll borta från betonggolv för att förhindra fuktuppsugning.
    - title: Vad är viktkapaciteten för Aquafarer uppblåsbara båtar?
      description: Viktkapaciteter sträcker sig från 290 kg för våra minsta modeller till över 2000 kg för större kommersiella farkoster. Varje produktsida listar maxlasten för din specifika modell.
faqs_sup:
  title: SUP-brädor FAQ
  subtitle: Vanliga frågor om våra paddleboard.
  columns: 2
  items:
    - title: Vilka SUP-brädstorlekar finns tillgängliga?
      description: Vi erbjuder SUP-brädor från 9 ft till 12 ft, inklusive all-round, touring, yoga och specialdesigner. Våra bästsäljande modeller inkluderar Tropical Breeze (10 ft) och Ocean Voyager (11 ft).
    - title: Vad är drop-stitch-konstruktion?
      description: Drop-stitch-konstruktion använder tusentals polyestertrådar som ansluter brädets topp- och bottenlager, vilket gör att det kan hålla högt lufttryck (15–20 PSI) och uppnå en styv, stabil plattform. Detta är industristandarden för premium uppblåsbara SUP.
    - title: Vad är viktgränsen för SUP-brädor?
      description: Våra SUP-brädor stödjer upp till 150 kg beroende på modell och volym. Leviathan Wake är vår modell med högst kapacitet, designad för större användare och yogabruk.
    - title: Erbjuder du kompletta SUP-paket?
      description: Ja. Varje SUP-bräde levereras med ett komplett paket inklusive 3-delad aluminiumpaddel, högtrycks handpump, spiralkoppel, reseryggsäck och reparationssats. Vissa modeller inkluderar även ett avtagbart fen-set.
    - title: Vad är garantin på SUP-brädor?
      description: Alla Aquafarer SUP-brädor har ett års garanti mot tillverkningsfel, inklusive sömfel, ventilfel och materialdelaminering under normal användning.
    - title: Hur lång tid tar det att pumpa upp ett SUP-bräde?
      description: Med den medföljande handpumpen tar full uppumpning till 15 PSI cirka 8–12 minuter. För snabbare uppumpning rekommenderar vi vår Aquafarer 12V elektriska pump, som pumpar upp ett bräde på under 4 minuter.
