features3_lab:
  title: Internt test- och kvalitetslabb
  subtitle: Varje materialbatch och färdig produkt går igenom vårt testlaboratorium på plats innan den skickas.
  columns: 3
  isBeforeContent: true
  items:
    - title: Draghållfasthetsprovning
      description: 'Varje PVC tygrulle testas enligt ASTM D751-standarder. Minimikrav: 350 N/cm varp och inslag. Avvisade partier returneras till leverantören – vi avvisar cirka 3 % av inkommande material.'
      icon: tabler:scale
    - title: UV-accelererat åldrande
      description: Tygprover genomgår 1 000 timmars QUV accelererad vittring (ASTM G154). Behållningen av draghållfastheten måste överstiga 80 % efter UV-exponering. Produkter klassade för 3+ års användning utomhus.
      icon: tabler:sun
    - title: Skalstyrka i sömmar
      description: RF-svetsade sömmar testade vid minsta skalhållfasthet på 5 N/mm (ASTM D751). Handlimmade Hypalon sömmar testade vid 3,5 N/mm. Varje produktionsbatch har sömprover destruktivt testade och arkiverade.
      icon: tabler:stack
    - title: 24–48 timmars tryckhållning
      description: 'Varje uppblåsbar produkt blåstes upp till 1,25x märkt PSI och övervakades i 24–48 timmar. Maximalt tillåtet tryckfall: 5 %. Produkter som inte klarar detta test omarbetas och testas igen före leverans.'
      icon: tabler:wind
    - title: Cykeltestning av ventiler
      description: Varje ventildesign genomgår 10 000 öppna-stäng-cykler i vårt labb. Ventiler måste hålla en lufttät tätning vid 1,25x märktryck efter cykling. Alla Aquafarer ventiler klassade för 5+ års regelbunden användning.
      icon: tabler:rotate
    - title: Beständighet mot kallsprickor
      description: Material testade vid -30°C i 4 timmar per ISO 4646. Inga sprickor eller sprödhet tillåts. Produkter klassade för vinterförvaring och kallvattenanvändning ner till -10°C omgivningstemperatur.
      icon: tabler:snowflake

