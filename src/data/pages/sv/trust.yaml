features3_certifications:
  title: Certifieringar och efterlevnad
  subtitle: Varje produkt är oberoende testad; 64 modeller är CE-certifierade enligt internationella standarder.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE-certifiering
      description: 64 CE-certifierade modeller inom SUP, kajaker, jollar och RIB uppfyller den europeiska CE-säkerhetsstandarden för rekreationsfarkoster. Varje produkt genomgår tryck-, flyt- och lasttestning innan den lämnar fabriken.
      icon: tabler:certificate
    - title: ISO 9001
      description: Vår 12.000 m² Qingdao-anläggning arbetar under ett ISO 9001-certifierat kvalitetsledningssystem. Varje produktionsbatch är spårbar, dokumenterad och inspekterad.
      icon: tabler:clipboard-check
    - title: BSCI social efterlevnad
      description: Vi är BSCI-certifierade, vilket säkerställer etiska arbetsmetoder, säkra arbetsförhållanden och miljöansvar i hela vår leveranskedja.
      icon: tabler:users
    - title: REACH och RoHS
      description: Alla material — PVC, Hypalon, EVA-skum, lim — uppfyller EU:s REACH- och RoHS-föreskrifter. Inga begränsade ämnen, inga kompromisser.
      icon: tabler:flask
    - title: Materialtestningslaboratorium
      description: Internt materiallaboratorium testar dragstyrka, UV-beständighet, sömintegritet och nötning för varje tygbatch före produktion.
      icon: tabler:microscope
    - title: 2 års garanti
      description: Varje Aquafarer-produkt levereras med två års garanti mot tillverkningsfel. Vi står för det vi bygger.
      icon: tabler:shield-check
