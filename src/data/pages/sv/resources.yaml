hero_text:
  tagline: Resurser
  title: 'Nedladdningscenter & inköpsguider'
  subtitle: 'Få tillgång till produktkataloger, OEM-guider, inköpschecklistor och teknisk dokumentation som hjälper dig att fatta välgrundade inköpsbeslut.'
features3_downloads:
  tagline: Nedladdningar
  title: 'Produktdokumentation<br />& resurser för köpare'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Marin produktkatalog 2026'
      description: 'Hela produktsortimentet inklusive RIB-båtar, gummibåtar, SUP-brädor, kajaker och tillbehör. Specifikationer, konfigurationer och alternativ. PDF-format.'
      icon: tabler:file-text
    - title: 'OEM-tillverkningsguide'
      description: 'Allt du behöver veta om OEM/ODM-partnerskap: översikt över processen, minsta orderkvantiteter, anpassningsalternativ, kvalitetskontroll och frakt.'
      icon: tabler:building-factory
    - title: 'Köpguide för RIB-båtar'
      description: 'Så väljer du rätt RIB: skrovmaterial, tubmaterial, motorval, storleksaspekter och konfigurationsalternativ för olika användningsområden.'
      icon: tabler:file-description
    - title: 'Checklista för SUP-leverantörer'
      description: 'Viktiga faktorer när du väljer tillverkare av SUP-brädor: kvalitetsindikatorer, certifieringskrav, MOQ-aspekter och vad du ska leta efter i en fabriksgranskning.'
      icon: tabler:clipboard-check
    - title: 'Materialguide för gummibåtar'
      description: 'PVC mot Hypalon: jämförelse av hållbarhet, UV-beständighet, livslängd, reparationsalternativ och kostnadsaspekter för olika marina användningsområden.'
      icon: tabler:files
    - title: 'Mall för kravspecifikation vid skräddarsydd tillverkning'
      description: 'Ladda ner vår mall för produktkrav. Fyll i dina krav och skicka tillbaka den till oss för en offert inom samma vecka och en bedömning av genomförbarheten.'
      icon: tabler:template
faqs:
  title: Vanliga frågor
  subtitle: 'Vanliga frågor om våra produkter, tillverkningsprocessen och vår partnerskapsmodell.'
  columns: 2
  items:
    - title: Vad är minsta orderkvantitet?
      description: 'MOQ varierar beroende på produktkategori. RIB-båtar börjar vanligtvis vid 10 enheter per modell. SUP-brädor från 50 enheter. Kontakta vårt säljteam för produktspecifik MOQ-information.'
      icon: tabler:help-circle
    - title: Kan jag få prover innan jag lägger en order?
      description: 'Ja. Paddle Board Overstock erbjuder provproduktion för utvärdering före serieproduktion. Provkostnader är förhandlingsbara och krediteras ofta mot den första produktionsordern.'
      icon: tabler:package
    - title: Vilka betalningsvillkor finns?
      description: 'Standardvillkor: 30% deposition vid order, 70% före leverans. LC-villkor finns för kvalificerade kunder. Kontakta vårt ekonomiteam för att diskutera upplägg.'
      icon: tabler:currency-dollar
    - title: Hur lång tid tar produktionen?
      description: 'Typiska ledtider: RIB-båtar 30-45 dagar, SUP-brädor 20-30 dagar, gummibåtar 25-35 dagar. Skräddarsydd utveckling lägger till 15-30 dagar för prototypframställning.'
      icon: tabler:calendar-clock
    - title: Vilka certifieringar har era produkter?
      description: 'CE-certifiering för EU-marknader, tillverkning godkänd av amerikanska kustbevakningen, ISO-kvalitetssystem, BSCI-efterlevnad och REACH-materialefterlevnad.'
      icon: tabler:certificate
    - title: Erbjuder ni skräddarsydd förpackning och varumärkesprofil?
      description: 'Ja. Vi erbjuder skräddarsydd förpackning med er logotyp, era färger och er varumärkesidentitet. MOQ för skräddarsydd förpackning beror på produktkategorin.'
      icon: tabler:color-swatch
cta:
  title: 'Behöver du hjälp att hitta rätt resurs?'
  subtitle: 'Kontakta vårt team för personlig vägledning om produktval, OEM-partnerskap eller tekniska specifikationer.'
  actions:
    - variant: primary
      text: Kontakta vårt team
      href: /contact
