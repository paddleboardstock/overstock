faq:
  title: Tekniska ritningar — Vanliga frågor
  questions:
    - q: Är GA PDF-filerna verkligen gratis att ladda ner?
      a: Ja. Allmänt arrangemang PDF-filer för våra huvudmodeller är tillgängliga utan kostnad. De innehåller information på planeringsnivå som är tillräcklig för projektutvärdering, utrymmesallokering och preliminär specifikationsgranskning.
    - q: Hur kommer jag åt DXF/DWG-filer?
      a: Fyll i det korta kvalificeringsformuläret på nedladdningssidan med ditt företagsnamn, projekttyp och avsedd användning. Godkända förfrågningar får en nedladdningslänk via e-post inom 1 arbetsdag.
    - q: Kan jag få STEP/IGES 3D-modeller?
      a: STEP- eller IGES 3D-modellfiler är tillgängliga genom vår projektansökningsprocess. Ange ditt projektomfattning, integrationskrav, tidslinje och köpavsikt. Förutsatt godkännande - vanligtvis inom 3-5 arbetsdagar.
    - q: Varför begränsar du åtkomsten till mer detaljerade filer?
      a: Skrovgeometri, formdata och strukturella beräkningar representerar år av FoU-investeringar och är kärntillverknings-IP. Vi tillhandahåller allt som behövs för inköpsplanering och projektintegration samtidigt som vi skyddar vår förmåga att fortsätta investera i ny produktutveckling.
    - q: Innehåller ritningarna tillverkningsdetaljer?
      a: Nej. Offentliga ritningar och ritningar i ljusform innehåller information på upphandlingsnivå för planering och specifikation. Detaljer på tillverkningsnivå (lamineringsscheman, verktygsbanor, skärexpansion) delas endast under NDA med bekräftade beställningar.
    - q: Finns ritningar tillgängliga för anpassade eller halvanpassade RIB-konfigurationer?
      a: Anpassade projektritningar förbereds som en del av OEM/ODM-utvecklingsprocessen. Om du utvärderar ett anpassat RIB-projekt, kontakta oss med dina krav så tillhandahåller vi projektspecifika GA-ritningar som en del av förslaget.
