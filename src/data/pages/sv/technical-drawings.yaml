hero:
  tagline: Tekniska ritningar & CAD
  title: RIB & uppblåsbar båt<br />Tekniska ritningar & CAD-nedladdningar
  subtitle: GA-ritningar på planeringsnivå, dimensionsblad och däcklayouter för projektutvärdering och specifikation. Få tillgång till tekniska ritningar på rätt nivå — från offentliga PDF-filer till STEP-filer på projektnivå.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB båt tekniska ritningar och CAD nedladdningar
direct_answer: Aquafarer tillhandahåller tekniska ritningar på inköpsnivå för RIB-båtar och uppblåsbara vattenskotrar – inklusive PDF-filer för allmänna arrangemang (GA), dimensionsblad och däckslayoutritningar. Mer detaljerade format (DXF/DWG, STEP/IGES) är tillgängliga vid kvalificerad förfrågan eller projektansökan.
