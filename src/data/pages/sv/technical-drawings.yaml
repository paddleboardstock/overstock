content_tiers:
  tagline: Ladda ner Tiers
  title: Fyra åtkomstnivåer<br />— Rätt detalj för rätt scen
  subtitle: Vi tillhandahåller ritningar på upphandlingsnivå, inte filer på tillverkningsnivå. Varje nivå matchar ett annat projektstadium.
  items:
    - title: Nivå 1 — Offentlig PDF
      description: Allmänt arrangemang (GA), dimensionsritning med 4 vyer och däcklayout i PDF-format. Tillgänglig för gratis nedladdning. Tillräckligt för projektering, utrymmesallokering och preliminär specifikationsgranskning.
      icon: tabler:file-type-pdf
    - title: Nivå 2 — Ljusform DXF/DWG
      description: 2D CAD-filer (DXF eller DWG) för layoutintegration på planeringsnivå. Kräver en kort kvalifikationsblankett (företagsnamn, projekttyp, avsedd användning). Inga strukturella eller tillverkningsdata ingår.
      icon: tabler:file-code
    - title: Nivå 3 — Projektansökan STEP/IGES
      description: 3D-modellfiler (STEP eller IGES) för systemintegration, utrustningsdesign eller koordinering av marinarkitektur. Kräver projektansökan med omfattning, tidslinje och inköpsavsikt. Förutsatt godkännande.
      icon: tabler:cube
    - title: Nivå 4 – NDA Engineering
      description: Skrovstrukturritningar, lamineringsscheman, rörskärningsexpansion och formdata. Endast tillgängligt under NDA med bekräftade beställningar. Dessa är filer på tillverkningsnivå – inte för offentlig distribution.
      icon: tabler:lock
content_included:
  tagline: Vad ingår
  title: Ritningsinnehåll<br />Per modell
  subtitle: Varje modell har ett standardritningspaket som täcker den väsentliga planeringsinformationen för B2B-köpare och projektingenjörer.
  items:
    - title: Allmän ordning (GA)
      description: Sidoprofil, toppvy och tvärsnitt som visar skrovform, rörposition, konsolplacering, säte, bränslesystem och nyckeldimensioner (LOA, balk, rördiameter, deadrise-vinkel). Revisionsstatus och upphovsrätt anges i rubrikblocket.
      icon: tabler:layout
    - title: 4-vy dimensionsritning
      description: Sido-, fram-, bak- och toppvyer med övergripande mått för transportplanering (höjd på trailer, balk för container, vikt för lyft). Inkluderar drifts- och transportkonfigurationer.
      icon: tabler:ruler-2
    - title: Däckslayout och utrustningsplan
      description: Däckvy uppifrån som visar konsolbas, sätespositioner, D-ringplatser, navigeringsljuspositioner, länspumpsåtkomst, batteri/bränslefack och utrustningsmonteringspunkter. Begränsad precision på proprietära gränssnitt.
      icon: tabler:map
    - title: Transport & Packaging Ritning
      description: Containerlastningsplan, vaggans dimensioner, viktfördelning och lyftpunkter för logistikplanering. Inkluderar standard och anpassade förpackningsalternativ.
      icon: tabler:truck
content_protection:
  tagline: IP-skydd
  title: Vad vi inte delar<br />och varför
  subtitle: Att skydda vår tekniska IP säkerställer att vi kan fortsätta att investera i FoU samtidigt som vi tillhandahåller allt köpare behöver för projektplanering.
  items:
    - title: Hull Mould Core Data
      description: Plugg- och formgeometri, CNC-verktygsbanor och lamineringsmallar är egentillverkade tillverkningstillgångar. De delas inte på någon åtkomstnivå utanför bekräftade NDA-kontrakt.
      icon: tabler:ban
    - title: Utvidgning av rörskärning
      description: Skärfiler med platt mönster för tubväv är data på tillverkningsnivå. Endast tillgängligt under NDA med bekräftade produktionsordrar och delas endast med avtalsparten.
      icon: tabler:ban
    - title: Strukturella beräkningar
      description: Detaljerad spänningsanalys, FEA-resultat och laminatscheman är efterlevnadskänsliga dokument som endast delas med anmälda organ och NDA-bundna klienter under bedömningen av överensstämmelse.
      icon: tabler:ban
    - title: Konkurrentscreening
      description: Vi förbehåller oss rätten att avslå CAD-åtkomstförfrågningar som verkar komma från konkurrenter, studenter utan projektkontext eller parter utan legitim upphandlingsavsikt.
      icon: tabler:shield
