content_version_control:
  tagline: Versionshantering
  title: Ritningsversion<br />Hantering
  subtitle: Varje ritning följer ett kontrollerat revisionssystem. Kontrollera alltid att du har den aktuella revisionen innan du använder ritningar för projektering.
  items:
    - title: Revisionsspårning
      description: Varje ritning har en revisionskod (Rev-A, Rev-B, Rev-C), utfärdandedatum, senast granskad datum, tillämplig modell/konfiguration, enheter, filstorlek och format. Endast den "nuvarande" versionen är tillgänglig för nedladdning.
      icon: tabler:git-branch
    - title: Ritningsstatusmeddelande
      description: Alla offentliga ritningar är märkta "Endast preliminär layout - inte för konstruktion, certifiering eller produktionsanvändning. Mått är föremål för slutlig specifikation och orderbekräftelse." Detta skyddar båda parter från felaktig tillämpning.
      icon: tabler:alert-circle
    - title: Uppdatera aviseringar
      description: När en modellspecifikation ändras uppdateras ritningsrevisionen och tidigare versioner är märkta "Ersatt". Registrerade användare som laddat ner DXF/DWG-paket meddelas om betydande uppdateringar via e-post.
      icon: tabler:bell

