hero:
  tagline: FoU-center
  title: FoU-center
  subtitle: Fokuserade på framsteg

intro:
  - Aquafarer forsknings- och utvecklingscenter (FoU) är drivkraften bakom vårt uppdrag att revolutionera vattensportutrustning. Vi stärker vattensportentusiaster över hela världen med säkrare, bekvämare och roligare produkter genom ständig innovation inom uppblåsbara SUP-brädor och båtar. Vårt dedikerade team av ingenjörer, designers och lidelsefulla vattensportexperter formar branschens framtid genom att ständigt höja ribban för kvalitet, prestanda och hållbarhet.
  - Vår FoU-anläggning samlar materialvetare, marinarkitekter och produktionstekniker under ett tak. Från vävformulering och skrovsimulering till utveckling av svetsprocesser och fullskaliga sjötester — varje steg i produktutvecklingen är datadrivet och validerat genom tester.

mission:
  tagline: Vårt uppdrag
  title: Innovation för vattensportens framtid
  pillars:
    - icon: lightning
      title: Teknologiska framsteg
      desc: Införande av nya material, designer och produktionsprocesser för bättre prestanda och hållbarhet.
    - icon: design
      title: Användarorienterad design
      desc: Djupgående förståelse och övertäffande av användarbehov genom ergonomisk och intuitiv produktdesign.
    - icon: globe
      title: Hållbara metoder
      desc: Minimering av vår miljöpåverkan genom användning av miljövänliga material och processer.
    - icon: shield
      title: Orubblig säkerhet
      desc: Säkerställande av högsta säkerhetsstandarder genom rigorösa tester och certifiering.

pillars:
  - title: Teknologiska framsteg
    desc: Införande av nya material, designer och produktionsprocesser för bättre prestanda och hållbarhet.
    icon: tech
  - title: Avancerade material
    desc: Forskning om banbrytande PVC, Hypalon, kompositer och hållbara alternativ för förbättrade produktegenskaper.
    icon: materials
  - title: Hållbarhet
    desc: 'Grundläggande åtagande: Vi är dedikerade till miljöansvar genom hållbar tillverkning och återvinningsbara material.'
    icon: sustainability

capabilities:
  tagline: Kapaciteter
  title: FoU-kapaciteter
  subtitle: Fyra grundläggande discipliner som ger oss full kontroll över produktutvecklingen — från råmaterialforskning till slutlig certifiering.
  groups:
    - title: Materialvetenskap och vävteknologi
      items:
        - Analys och optimering av PVC- och Hypalonformuleringar
        - Utveckling av UV-stabilisering, flamskyddsmedel och antibakteriella tillsatser
        - Laminerings- och vidhäftningsteknik för flerskiktade vävar
        - Accelererade åldringstester (UV, termisk, fukt, saltspray)
    - title: Skrovteknik och hydrodynamik
      items:
        - Parametrisk 3D-skrovdesign och CFD-optimering
        - Finita elementanalys för strukturella och stötbelastningar
        - Släptankstester på skalmodeller och prestandavalidering
        - Utveckling av anpassade skrov för speciella uppdragsprofiler
    - title: Svets- och sammanfogningsteknik
      items:
        - Utveckling och optimering av RF-dielektrisk svetsprocess
        - Varmluftssvetsning, varmkilssvetsning och ultraljudsmetoder
        - Kvalificering av limning och sömtejp
        - Hållfasthetsmodellering av svetsar och livslängdsprognoser
    - title: Testning, certifiering och efterlevnad
      items:
        - Kvalitetsledning och CE-efterlevnadstestning
        - Oberoende tredjepartstestning och certifieringsstöd
        - Utveckling av anpassade testprotokoll för inköpskvalificering
        - Feltillbudsanalys och grundorsaksutredning

