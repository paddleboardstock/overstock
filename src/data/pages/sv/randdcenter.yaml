rd_services:
  tagline: Anpassad FoU
  title: FoU-tjänster för partners
  services:
    - title: Utveckling av anpassade material
      desc: Vi utvecklar anpassade vävformuleringar, laminatstackar och limsystem skräddarsydda för din driftsmiljö och prestandamål.
    - title: OEM / ODM produktteknik
      desc: Från konceptskisser till produktionsfärdiga tekniska paket — vårt team kan designa, prototypa och testa båtar under ditt varumärke.
    - title: Tredjepartstestning och certifiering
      desc: Använd våra ISO-kompatibla testanläggningar för oberoende materialtestning, produktvalidering och certifieringsstöd.
  cta: Diskutera dina FoU-krav →
  cta_link: /contact

vision:
  tagline: Vår vision
  title: Forma framtiden för vattensporter
  body: Aquafarer strävar efter att leda branschen för gummibåtar och SUP genom kontinuerlig innovation, orubblig kvalitet och ett starkt engagemang för säkerhet och hållbarhet — och därigenom berika upplevelsen för vattensportentusiaster över hela världen. Aquafarer FoU-center är platsen där passion möter innovation, vilket sätter nya standarder för vattensportindustrin.

labs_section:
  tagline: Laboratorier
  title: Våra laboratorier
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC-vävlaboratorium
      description: Kontinuerlig forskning och testning av PVC- och Hypalonrörvävar för draghållfasthet, UV-beständighet, nötning och lågtemperaturflexibilitet för att säkerställa långsiktig tillförlitlighet i marina miljöer.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Skrovteknikstudio
      description: CAD-stödd design och finita elementanalys av HDPE-, aluminium- och glasfiberskrov. Varje skrov simuleras digitalt för spänningsfördelning och slagmotstånd innan den första prototypen byggs.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: RF-svetscenter
      description: Dedikerad högfrekvenssvetsanläggning med precisionstemperatur- och tryckkontroll, som producerar högmotståndskraftiga, lufttäta sömmar som övertäffar industristandarder för uppblåsbara farkoster.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Hydrodynamisk testbassäng
      description: Testning på skalmodeller i vår interna testbassäng för att optimera skrovform, planingsprestanda, stabilitet och bränsleeffektivitet över olika laster och sjöförhållanden.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypverkstad
      description: Anläggning för fullskalig prototypframställning och utrustning där nya modeller byggs, monteras och testas. Varje prototyp genomgår minst 20 timmars vattentestprogram innan produktionsgodkännande.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Kvalitets- och inspektionslaboratorium
      description: Dedikerat kvalitetssäkringslaboratorium som utför dragprovning, luftkvarhållningscykler, sömnötningsprovning och materialcertifiering för att säkerställa att varje båt som lämnar verkstaden uppfyller våra publicerade specifikationer.
      href: /randdcenter/quality-inspection-lab
