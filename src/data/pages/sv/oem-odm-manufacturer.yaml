breadcrumb: OEM/ODM-tillverkare
tldr:
  summary: Paddle Board Overstock är en OEM/ODM-tillverkare som levererar direkt från fabrik. Anläggning på 12 000 m² med ISO 9001:2015-certifiering, årlig produktion på 15 000 enheter, CE/BSCI/REACH/UKCA-efterlevnad, låga MOQ från 2-10 enheter.
  points:
    - Fabrik i Qingdao på 12 000 m², ISO 9001:2015-certifierad
    - Årlig kapacitet på 15 000 enheter med 200-300 skickliga arbetare
    - Efterlevnad av CE 2013/53/EU, UKCA, BSCI, REACH
    - 'Låga MOQ: 2-5 enheter (RIB), 5-10 enheter (SUP) för standardmodeller'
    - Export till 50+ länder med FOB Qingdao-frakt
