process_section:
  eyebrow: Vår process
  title: End-to-end OEM/ODM-arbetsflöde
  subtitle: Från designbrief till containerlastning — sex steg till ditt uppblåsbara vattenfordon under eget varumärke.
  steps:
    - step: '01'
      title: Specifikation & designbrief
      desc: Dela dina målspecifikationer, CAD-ritningar eller en referensprodukt. Vårt ingenjörsteam granskar material, mått och efterlevnadskrav (CE, BSCI) innan vi gör en offert.
    - step: '02'
      title: 3D-formprototypning
      desc: Vi konstruerar och CNC-fräser skräddarsydda formar för SUP-brädor, kajakskalett och RIB-komponenter. Prototypexemplar produceras inom 15-20 arbetsdagar för ditt godkännande.
    - step: '03'
      title: Materialval & provproduktion
      desc: Välj mellan PVC i militärkvalitet (0,9-1,2 mm), Hypalon CSM eller drop-stitch kärnmaterial. Vi tillverkar förproduktionsprover i dina varumärkesfärger, logotyp och förpackning för godkännande.
    - step: '04'
      title: CE-fabriksgranskning & efterlevnad
      desc: Varje OEM-order inkluderar efterlevnadsdokumentation — CE-försäkran om överensstämmelse, ISO 9001-spårbarhetsregister, BSCI-social efterlevnadsrapport och REACH-materialdeklarationer.
    - step: '05'
      title: Serietillverkning & inline-kvalitetskontroll
      desc: Produktionsserier följer vår 100-punkts kvalitetschecklista. Varje enhet genomgår 24-timmars tryckhållningstest, sömskalningstest och visuell inspektion före förpackning.
    - step: '06'
      title: FOB Qingdao-logistik & frakt
      desc: Färdiga varor lastas på pallar, krympfoliinsvecks och containerlastas i Qingdaos hamn. Vi hanterar all exportdokumentation, tullklarering och erbjuder spårning av försändelser i realtid.
capabilities_section:
  eyebrow: Tillverkningskapacitet
  title: Vad vi tillverkar
  subtitle: Sex kärntillverkningskapaciteter för globala B2B-partners.
  items:
    - title: Drop-stitch SUP-brädtillverkning
      desc: Fullängds drop-stitch kärnlaminering för styva, högdjups- (15-20 PSI) stand-up paddle-brädor. Skräddarsydd längd, bredd, tjocklek, rockerprofil och grafisk design.
    - title: Tillverkning av uppblåsbara PVC-båtar
      desc: Högfrekvenssvetsade PVC jollar, tenders och sportbåtar. Flera kammarkonfigurationer, golvalternativ (ribb, luftdäck, rullbar) och integrering av tillbehör.
    - title: Hypalon RIB-tillverkning
      desc: Hypalon CSM-rör i kommersiell kvalitet limmade mot glasfiber- eller aluminiumdjup-V-skrov. Längder från 3,3 m till 6,0 m för patrull-, räddnings-, tur- och dykoperationer.
    - title: Private label & skräddarsydd varumärkesprofilering
      desc: 'Komplett private label-tjänst: skräddarsydd logotyp i värmestransfer eller silkscreentryck, varumärkesförpackning (butikförpackningar, bärkassar), användarmanualer på ditt språk samt streckkod/UPC-registrering.'
    - title: Skräddarsydd form- & verktygskonstruktion
      desc: Eget 3D CAD/CAM-ingenjörsteam. Vi konstruerar och tillverkar skräddarsydda aluminium- och kompositformar för unika skrovformer, däckkonfigurationer och tillbehörsfästen.
    - title: OEM-tillbehör & kit-paketering
      desc: Flytvästar (CE 12402), dubbelverkande pumpar, kolfiber/nylon-paddlar, reparationskit, bärkassar och leash. Komplett kit-paketering för säljklar presentation.
experience_section:
  eyebrow: Verklig erfarenhet
  title: Partnerskap som byggt varumärken
  subtitle: Verkliga berättelser från varumärken och organisationer som valde Paddle Board Overstock för OEM/ODM-tillverkning.
  stories:
    - quote: Vi kom till Paddle Board Overstock med en skiss på en servett och en lista med krav. Åtta månader senare hade vi en produktionsklar produkt som klarade CE-certifiering på första försöket.
      narrative: En europeisk startup med en nyskapande SUP-design vände sig till Paddle Board Overstock för ODM-tillverkning. Paddle Board Overstocks FoU-team förde konceptet genom CAD-konstruktion, FEA-strukturanalys, hydrodynamisk simulering, formskapande, prototyptillverkning och produktionsverktyg. Startupens grundare besökte Qingdao tre gånger under processen. Slutprodukten klarade CE-certifiering utan några modifieringar — ett resultat grundaren tillskriver Paddle Board Overstocks ingenjörsteams förståelse av europeiska regulatoriska krav från början.
      context: Lansering av europeiskt SUP-varumärke, 2023-2024
      source: Varumärkesgrundare
    - quote: Nivån på NDA-skydd och IP-säkerhet hos Paddle Board Overstock ger oss tryggheten att dela våra patenterade konstruktioner. De behandlar vår IP som om den vore deras egen.
      narrative: Ett amerikanskt företag inom marin utrustning med patenterad ventelteknologi behövde en tillverkningspartner som kunde skydda deras IP samtidigt som de producerade i skala. Efter att ha granskat fem kinesiska tillverkare valde de Paddle Board Overstock tack vare fabrikens IP-skyddsprotokoll, säker hantering av konstruktionsfiler och vilja att skriva strikta NDA:er. Partnerskapet har producerat tre produktlinjer under fyra år utan enda IP-incident.
      context: Amerikanskt företag inom marin utrustning, OEM-partnerskap sedan 2021
      source: VP Verksamhet
