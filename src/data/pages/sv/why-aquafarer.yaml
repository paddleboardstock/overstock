hero:
  tagline: Varför Aquafarer
  title: Byggd annorlunda. Byggd för affärer.<br />Partnern bakom vattenäventyr över hela världen
  subtitle: Inte bara en tillverkare — en affärspartner som designar, konstruerar och levererar utrustning av kommersiell kvalitet för klubbar, resorter, uthyrningsföretag och framväxande vattenmärken.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer tillverkningskvalitet och expertis
pillars:
  tagline: Tre pelare av partnerskap
  title: Varför världens vattenföretag väljer Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Designad för kommersiellt bruk
      description: Vår utrustning är konstruerad för daglig uthyrning, inte helgnöjen. Kommersiell kvalitet PVC, förstärkta drop-stitch kärnor, UV-stabila Hypalon alternativ och fälttestad hårdvara innebär lägre underhåll, längre livslängd och högre ROI för din verksamhet.
      icon: tabler:building-factory
      callToAction:
        text: Se kommersiell produktlinje
        href: /products
    - title: Från idé till marknad
      description: 'Lansera ditt vattensportmärke på 90 dagar. Vi guidar dig genom varje steg: konceptvalidering, produktval, prototyp, produktion, förpackningsdesign och global frakt. Ingen press på minimibeställning — börja smått, väx med självförtroende.'
      icon: tabler:rocket
      callToAction:
        text: Starta din varumärkesresa
        href: /oem-odm-blueprint
    - title: Byggd för globala förhållanden
      description: 'Produkter optimerade för varje klimat: formuleringar för kallt vatten PVC för Europa, UV-resistenta material för Mellanöstern och Australien, anti-fuktbehandlingar för Sydostasien. Varje leverans är kalibrerad för sin destinationsmiljö.'
      icon: tabler:world
stats:
  title: Förtroende för siffror
  stats:
    - title: År i verksamheten
      amount: Sedan 2012
    - title: Byggda båtar
      amount: 15,000+
    - title: Återkommande kunder
      amount: 85%
    - title: Garantianspråk
      amount: <2%
reasons:
  tagline: Aquafarer skillnaden
  title: Vad som skiljer oss åt
  isBeforeContent: false
  columns: 3
  items:
    - title: Verklig tillverkning, inte handel
      description: Vi äger och driver en fabrik på 12 000 m². När du samarbetar med Aquafarer arbetar du direkt med de personer som designar, konstruerar och bygger dina produkter — utan mellanhänder.
      icon: tabler:building-factory
    - title: Ingenjörsledd strategi
      description: Vår designprocess börjar med användningsfallet, inte produktkategorin. Vi optimerar skrovform, materialval och konfiguration för hur utrustningen faktiskt kommer att användas i kommersiella miljöer.
      icon: tabler:engine
    - title: Certifierad kvalitet
      description: CE certifierad, ISO kvalitetsystem, BSCI överensstämmande, REACH överensstämmande, USCG Typ III/V godkända flytvästar; alla produkter uppfyller tillämpliga internationella standarder.
      icon: tabler:certificate
    - title: Flexibel OEM/ODM
      description: Färger på tuber, konsollayout, varumärke, förpackning — vi anpassar efter dina specifikationer. Ingen press på minimibeställning. Börja med en prototyp, skala upp med självförtroende.
      icon: tabler:adjustments
    - title: Global logistik
      description: US-lager i Kalifornien, direktleverans från Qingdao, flygfrakt för brådskande beställningar. Vi hanterar tullpapper och dokumentation över hela världen.
      icon: tabler:truck-delivery
    - title: Livstidssupport
      description: Vi stöder båtar som vi byggde för 20 år sedan. Äkta reservdelar, teknisk rådgivning, reparationsvägledning — vårt team finns tillgängligt när du behöver oss, var du än är.
      icon: tabler:lifebuoy
testimonials:
  tagline: Betrodd av varumärken över hela världen
  title: Vad våra partners säger
  items:
    - content: Vi har arbetat med flera tillverkare i Kina, men Aquafarer utmärker sig för sitt tekniska stöd och konsekventa kvalitet. De behandlar vårt varumärke som sitt eget.
      name: — OEM Partner, europeiskt vattensportmärke
    - content: Deras Hypalon RIBs har varit i tjänst med vår flotta i över 5 år. Minimal underhåll, utmärkt UV resistens. 5-årsgarantin på rör ger oss förtroende.
      name: — Flottoperatör, Mellanösternresortgruppen
    - content: Teamet Aquafarer hjälpte oss att utveckla en anpassad SUP-kortdesign från koncept till produktion på 90 dagar. Kvaliteten överträffade våra förväntningar.
      name: — Distributör, Australian Watersports
    - content: Som småföretagare var jag orolig för minimibeställningar (MOQs). Aquafarer arbetade med min budget och hjälpte mig att lansera mitt varumärke med bara 50 brädor. Nu beställer jag 500.
      name: — Varumärkesgrundare, USA SUP Uthyrningsföretag
cta:
  title: Redo att bygga ditt vattenföretag?
  subtitle: Kontakta vårt team för en gratis konsultation. Ingen bindning — bara ärliga råd om utrustning och tillverkning.
  actions:
    - variant: primary
      text: Prata med vårt team
      href: /contact
    - text: Ladda ner produktkatalog
      href: /resources
