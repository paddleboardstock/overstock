features3_reasons:
  tagline: Varför välja Aquafarer
  title: 'Sju skäl att bli vår partner'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Riktig tillverkning, inte handel'
      description: 'Vi äger och driver en fabrik på 12 000 m². När du samarbetar med Aquafarer arbetar du direkt med människorna som designar, konstruerar och bygger dina produkter — utan mellanhänder.'
      icon: tabler:building-factory
    - title: '2. Ingenjörsdrivet arbetssätt'
      description: 'Vår designprocess börjar med användningsfallet, inte produktkategorin. Vi optimerar skrovform, materialval och konfiguration utifrån hur båten faktiskt kommer att användas.'
      icon: tabler:engine
    - title: '3. Certifierad kvalitet'
      description: 'CE-certifierat, ISO-kvalitetssystem, BSCI-compliant, REACH-compliant, USCG-godkänd. Våra 64 CE-certifierade modeller uppfyller internationella standarder — inte bara påståenden.'
      icon: tabler:certificate
    - title: '4. Flexibelt OEM/ODM'
      description: 'Tube-färger, konsollayout, varumärkesprofilering, förpackning — vi anpassar efter dina specifikationer. Ingen press om minimiorder. Börja med en prototyp och skala med självförtroende.'
      icon: tabler:adjustments
    - title: '5. Global logistik'
      description: 'USA-lager i Kalifornien, direktleverans från Qingdao, flygfrakt för brådskande order. Vi sköter tullpapper och dokumentation.'
      icon: tabler:truck-delivery
    - title: '6. Livstidsstöd'
      description: 'Vi stöttar båtar som vi byggde för 20 år sedan. Äkta reservdelar, teknisk rådgivning, reparationsvägledning — vårt team finns tillgängligt när du behöver oss.'
      icon: tabler:lifebuoy
    - title: '7. Ärliga specifikationer'
      description: 'Riktiga lastklasser, riktiga mått, riktig vikt. Ingen marknadsföringsuppblåsning. Det vi publicerar är det du får — verifierat av oberoende tester.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Betrodda av varumärken världen över
  title: Vad våra partners säger
  items:
    - content: 'Vi har arbetat med flera tillverkare i Kina, men Aquafarer utmärker sig genom sitt ingenjörsstöd och konsekventa kvalitet. De behandlar vårt varumärke som sitt eget.'
      name: '— OEM-partner, europeiskt vattensportsvarumärke'
    - content: 'Deras Hypalon-RIB:ar har varit i tjänst i vår flott i över 5 år. Minimalt underhåll, utmärkt UV-beständighet. 5-årig garanti på tuberna ger oss trygghet.'
      name: '— Flottoperatör, resortgrupp i Mellanöstern'
    - content: 'Aquafarer-teamet hjälpte oss att utveckla en skräddarsydd SUP-boarddesign från koncept till produktion på 90 dagar. Kvaliteten överträffade våra förväntningar.'
      name: '— Distributör, australisk vattensport'
cta:
  title: 'Redo att uppleva skillnaden?'
