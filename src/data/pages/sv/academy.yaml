hero:
  tagline: Paddle Board Overstock Akademin
  title: Lärcentrum
  subtitle: Guider och handledningar för alla färdighetsnivåer — från SUP grunderna till avancerade räddningstekniker
categories:
  - level: Nybörjare
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Grunderna
        desc: Lär dig grunderna i stand-up paddleboarding - hållning, slagteknik och balans.
        slug: beginner-sup-guide
      - title: Paddla tekniker
        desc: Slag framåt, svepslag, dragslag och lågt stag – bemästra de viktiga paddelrörelserna.
        slug: sup-paddle-guide
      - title: Säkerheten först
        desc: Viktiga säkerhetsrutiner inklusive väderkontroller, PFD-användning, koppelregler och självräddning.
        slug: sup-safety-guide
  - level: Mellanliggande
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Grundutrustning för turer
        desc: Planera flertimmarspaddlar — navigering, hydrering, pacing och läsning av vindprognoser.
        slug: touring-sup-guide
      - title: Väderläsning
        desc: Tolka havsprognoser, identifiera molnmönster och förstå vindeffekter på vatten.
        slug: weather-planning-water-sports
      - title: Grundläggande navigering
        desc: Sjökortsavläsning, kompassanvändning, GPS-waypoints och ruttplanering för kustpaddling.
        slug: sup-navigation-guide
      - title: Tidvattenmedvetenhet
        desc: Förstå tidvattnets cykler, strömmar och hur de påverkar lanseringstid och rutt.
        slug: understanding-tides
  - level: Avancerad
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planering av flerdagarsutflykter
        desc: Expeditionslogistik — utrustningsval, livsmedelsplanering, säkerhetsprotokoll och nödkontakter.
        slug: sup-travel-guide
      - title: Räddningstekniker
        desc: Självräddning, T-räddning, eskimåräddning för kajaker och bogseringsprotokoll för öppet vatten.
        slug: sup-self-rescue
      - title: Nattpaddling
        desc: Navigering efter mörkrets inbrott — belysningskrav, ruttminne, gruppkommunikation och medvetenhet om faror.
        slug: sup-navigation-guide
  - level: Underhåll
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Städning & Skötsel
        desc: Sötvattenspolning, UV-skydd, mögelförebyggande och korrekta torkningstekniker efter varje session.
        slug: inflatable-sup-maintenance
      - title: Förvaringsguide
        desc: Bästa metoder för förvaring av uppblåsbara brädor och båtar - tömning, fällning, temperaturkontroll och hållbarhet.
        slug: inflatable-sup-storage
      - title: Grunderna för reparation
        desc: Åtgärda små punkteringar, sömläckor och ventilproblem med PVC reparationssatser och lapptekniker.
        slug: inflatable-sup-repair
      - title: Ventilunderhåll
        desc: Identifiera ventiltyper (Halkey-Roberts, Boston, Leafield), rengör skräp och byt ut defekta skaft.
        slug: inflatable-sup-repair
knowledge_center_tagline: Kunskapscenter
knowledge_center_title: Guider för marin utrustning och industri
knowledge_center_subtitle: Expertkunskap och köpguider för marinproffs, flottoperatörer och vattensportentusiaster.
knowledge_sections:
  - title: RIB Båtkunskap
    tagline: Styva uppblåsbara båtguider
    desc: Allt om RIB båtar — skrovdesign, material, motorval, underhåll och köpråd för kommersiellt och rekreationsbruk.
    guides:
      - title: Hur man väljer rätt RIB båt
        desc: Komplett guide för att välja en RIB — storlek, motoreffekt, rörmaterial, skrovtyp och avsedd användning.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB vs uppblåsbar båt
        desc: Styv uppblåsbar båt kontra traditionell uppblåsbar jolle - skrovdesign, prestanda, hållbarhet och kapacitet jämfört.
        href: /compare/rib-vs-dinghy
      - title: Kommersiell RIB vs rekreation RIB
        desc: Båtar av kommersiell kvalitet kontra fritidsbåtar RIB – konstruktionsstandarder, material, livslängd, kostnad och certifieringar.
        href: /compare/commercial-vs-recreational-rib
      - title: Aluminium vs glasfiberskrov
        desc: Jämför aluminium- och glasfiberskrov för RIB båtar med avseende på vikt, kostnad, hållbarhet och korrosionsbeständighet.
        href: /compare/aluminum-vs-fiberglass
  - title: Guide för uppblåsbar båt
    tagline: Kunskap om uppblåsbara vattenskotrar
    desc: Omfattande guider om uppblåsbara båtar — PVC vs Hypalon, konstruktionsmetoder, säkerhetsstandarder och bästa praxis för underhåll.
    guides:
      - title: PVC vs Hypalon Materialguide
        desc: Definitiv jämförelse mellan PVC och Hypalon CSM för uppblåsbar båtkonstruktion.
        href: /compare/pvc-vs-hypalon
      - title: Hur uppblåsbara båtar tillverkas
        desc: Tillverkningsprocess — materialskärning, HF-svetsning, sömkonstruktion, tryckprovning och kvalitetskontroll.
        href: /learn/inflatable-technology
      - title: Säkerhetsguide för uppblåsbar båt
        desc: Säkerhetsstandarder, lastkapacitet, korrekt uppblåsning, kontroller före avgång och nödprocedurer.
        href: /learn/water-safety
      - title: Underhåll av uppblåsbar båt
        desc: Rengöring, förvaring, UV-skydd, vinterisering och reparation av gummibåtar och RIB.
        href: /v2/inflatable-boat-maintenance
  - title: Båtkunskap
    tagline: Gummibåt & RIB nav
    desc: Tekniska guider som täcker typer av uppblåsbara båtar, material, konstruktionsmetoder, underhåll och säkerhet – från jollar till RIB.
    guides:
      - title: Uppblåsbara båttyper
        desc: Jollar, RIB, kajaker och tenders — lär dig skillnaderna och välj rätt.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch-teknik
        desc: Hur tusentals invändiga gängor skapar styva, högtrycksuppblåsbara strukturer.
        href: /learn/drop-stitch-core
      - title: Materialreferens
        desc: PVC deniervärden, tygvikter, UV-beständighet och material av marint kvalitet förklaras.
        href: /learn/materials
      - title: RIB mot jolle
        desc: Jämför styva uppblåsbara båtar med traditionella uppblåsbara jollar för olika användningsfall.
        href: /compare/rib-vs-dinghy
  - title: SUP Kunskap
    tagline: Stand-Up Paddleboard Guider
    desc: Allt om SUP brädor — uppblåsbara vs styva, bräddimensioner, materialteknik och expertråd för alla kunskapsnivåer.
    guides:
      - title: Uppblåsbar vs hård SUP
        desc: Jämför iSUP:er och hårda epoxikort över bärbarhet, hållbarhet, prestanda och värde.
        href: /learn/sup
      - title: SUP Styrelsens måttguide
        desc: Hur längd, bredd och tjocklek påverkar stabilitet, hastighet och manövrerbarhet.
        href: /learn/sup
      - title: SUP Underhåll och skötsel
        desc: Rengöring, förvaring, UV-skydd och reparationstips för uppblåsbara SUP brädor.
        href: /v2/inflatable-sup-maintenance
      - title: Att välja din första SUP
        desc: Nybörjarguide för att välja rätt stand-up paddleboard för din vikt, skicklighetsnivå och avsedda användning.
        href: /learn/sup
  - title: Guide för dykutrustning
    tagline: Kommersiell dykbåtskunskap
    desc: Specialiserade guider om dykbåtar, dyk-RIB:er och utrustning för dykcenter, dykoperatörer och kommersiella dykteam.
    guides:
      - title: Bästa RIB båt för dykcenter
        desc: Hur man väljer rätt dyk RIB för ditt dykcenter — kapacitet, konfiguration och budgetöverväganden.
        href: /solutions-diving-center-boats
      - title: Dyk RIB Konfigurationsguide
        desc: Viktiga funktioner för dyk-RIB:er — tankställ, stegsystem, dykplattform och förvaring av utrustning.
        href: /solutions-diving-center-boats
  - title: Guide om tendrar till yacht
    tagline: Lösningar för superyachter och marina tenderbåtar
    desc: Guider för att välja den perfekta yachttendern — uppblåsbara tenderar, RIB tenders, förvaringslösningar och mjuka tillbehör.
    guides:
      - title: Hur man väljer en yachttender
        desc: Faktorer att tänka på när du väljer ett anbud för din yacht - storlek, material, motor och lagring.
        href: /solutions-yacht-tender-solutions
      - title: Uppblåsbar vs RIB Anbud
        desc: Jämför uppblåsbara gummibåtar med stela gummibåtar för prestanda, hållbarhet och stuvbarhet.
        href: /compare/rib-vs-dinghy
  - title: Guide för räddningsutrustning
    tagline: Sök & räddning vattenskotrar kunskap
    desc: Professionella guider om räddningsbåtar, SAR vattenskotrar och räddningsutrustning för kustbevakning, livräddare och katastrofhjälp.
    guides:
      - title: SAR Båtvalsguide
        desc: Hur man väljer rätt sök- och räddningsbåt — hastighet, kapacitet, hållbarhet och krav på specialutrustning.
        href: /solutions-rescue-watercraft
      - title: Kommersiell RIB för räddningsinsatser
        desc: Varför RIB:er av kommersiell kvalitet är det föredragna valet för professionella sök- och räddningsteam över hela världen.
        href: /use-cases/search-and-rescue
