timeline:
  - year: '2012'
    title: Grunden för maritim tillverkning
    body: Paddle Board Overstock började som en specialiserad verkstad för uppblåsbara vattenskotrar i Qingdao, Kina, engagerad i marint hantverk och tillverkning av uppblåsbara båtar. Det tidiga fokuset var att bygga pålitliga uppblåsbara produkter genom praktisk ingenjörserfarenhet och tillverkningsdisciplin.
  - year: '2015'
    title: Första exporten & CE-certifiering
    body: De första exportbeställningarna nådde Japan och Korea. CE-certifiering uppnåddes för kärnproduktlinjer, vilket markerar Paddle Board Overstocks inträde på internationella marknader. Företaget började betjäna kommersiella och fritidsanvändare utanför Kina.
  - year: '2018'
    title: Fabriksexpansion
    body: Flyttad till en 12 000 m² produktionsanläggning. Lade till RF-svetslinjer och produktionskapacitet för droppstygn, vilket möjliggör storskalig tillverkning och förbättrade kvalitetskontrollsystem.
  - year: '2020'
    title: FoU-center etablerat
    body: Öppnade ett dedikerat FoU-center med PVC tyglabb, hydrodynamisk testtank och CAD/FEA-simuleringsstudio. Produktutvecklingen utökades till att fokusera på lättviktskonstruktion, förbättrad hållbarhet och användarcentrerad design.
  - year: '2022'
    title: Certifiering och global tillväxt
    body: Uppnådde ISO 9001-certifiering. Utökat till 14 FoU-ingenjörer och 200+ arbetare. Produkter nådde kunder över hela Europa, Amerika och Asien-Stillahavsområdet genom distributörs- och OEM-partnerskap.
  - year: '2024'
    title: Innovations- och designstudio
    body: Lanserade fullservice design- och innovationsstudio för skräddarsydda ODM-projekt, från idé till produktion. Förstärkta professionella marina applikationer inklusive räddnings-, kommersiella och statliga anbud.
  - year: '2026'
    title: Bygga framtiden för vattenutforskning
    body: Idag fortsätter Paddle Board Overstock att utveckla uppblåsbara båtar, SUP-system och skräddarsydda marina lösningar – som förbinder människor och organisationer med världens vatten. 50+ länder betjänas, 15 000 enheter årlig kapacitet.
content_founding:
  tagline: Början
  title: Född vid vattnet
  subtitle: 'Paddle Board Overstock började i en kustnära verkstad i Qingdao med en båt och en vision: att bygga uppblåsbara vattenskotrar som kunde hantera verkliga marina förhållanden.'
  paragraphs:
    - Under 2012 såg våra grundare en lucka på marknaden – de flesta gummibåtar var antingen prisvärda men opålitliga eller högkvalitativa men oöverkomligt dyra. De trodde att det fanns plats för en tillverkare som levererade både kvalitet och värde.
    - Det första skrovet byggdes för hand, testades i lokala vatten och förfinades baserat på verklig feedback från fiskare och små kommersiella operatörer. Den feedbackloopen – bygg, testa, lyssna, förbättra – är fortfarande kärnan i vår ingenjörsfilosofi idag.
    - År 2015 hade ordet spridit sig bortom Qingdao. Internationella distributörer började begära prover. Det som började som en lokal verkstad var att bli en global leverantör.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstocks tidiga produktionsverkstad och tillverkning
content_growth:
  tagline: Tillväxt & innovation
  title: Från verkstad till 12 000 m² anläggning
  subtitle: Kontinuerliga investeringar i människor, utrustning och processer har förvandlat Paddle Board Overstock till en modern marin tillverkningsanläggning.
  paragraphs:
    - I takt med att efterfrågan ökade, ökade också vår anläggning. Vi expanderade från en liten verkstad till en fabrik på 12 000 m² med dedikerade produktionslinjer för RIB båtar, uppblåsbara båtar, SUP brädor och tillbehör.
    - Vi investerade i CNC-skärmaskiner, högfrekvent svetsutrustning, drop stitch produktionslinjer och omfattande testriggar – vilket gör att vi kan kontrollera varje aspekt av produktionskvalitet.
    - Idag inkluderar vårt team på 200-300 mariningenjörer, materialvetare, kvalitetskontrollspecialister och skickliga hantverkare – av vilka många har varit med Paddle Board Overstock sedan de första dagarna.
founder:
  tagline: Möt grundaren
  title: Byggd av en vattenman
  subtitle: Grundaren David Chen sammanför tillverkningsexpertis och en livslång passion för vattensporter – en kombination som definierar hur Paddle Board Overstock närmar sig produktutveckling.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — grundare av Paddle Board Overstock
  story:
    - David Chen växte upp vid kusten av Qingdao, där havet inte var ett semestermål utan ett sätt att leva. Han tillbringade sin ungdom på att paddla kajak, segla och fiska i Gula havet - upplevelser som gav honom en intuitiv förståelse för vad vattenskotrar måste utstå.
    - Innan han grundade Paddle Board Overstock, tillbringade David ett decennium i marin tillverkning och arbetade med produktion, kvalitet och internationell handel. Han ledde OEM-program för europeiska och nordamerikanska varumärken och lärde sig standarderna och förväntningarna på globala marknader från första hand.
    - '2012 grundade han Paddle Board Overstock med ett enkelt uppdrag: bygga uppblåsbara vattenfarkoster som han skulle lita på med sin egen familj på vattnet. Den personliga standarden – skulle jag använda den här? — förblir det sista testet för varje produkt som lämnar fabriken.'
    - Idag leder David produktstrategin och övervakar FoU-teamet, personligen granskar nya konstruktioner och testar prototyper på vattnet utanför Qingdao. Han tror att bra produkter kommer av att förstå både ingenjörskonsten och upplevelsen.
philosophy:
  tagline: Märkesfilosofi
  title: Ingenjörsfrihet på vatten
  body: Frihet på vatten handlar inte bara om rörelse. Det representerar att upptäcka nya platser, skapa utomhusupplevelser, koppla samman människor med naturen och möjliggöra professionella uppdrag. Teknik gör den friheten möjlig.
  pillars:
    - title: Tillförlitlighet först
      body: Vattenmiljöer kräver tillit. Paddle Board Overstock produkter är designade kring stabilitet, hållbarhet, säkerhet och konsekvent prestanda.
    - title: Människocentrerad design
      body: Produkter ska tjäna människor, inte teknik. Varje designbeslut börjar med att förstå hur människor använder vattenskotrar, var de utforskar och vilka utmaningar de står inför.
    - title: Tillgänglig utforskning
      body: Vatten ska inte bara tillhöra experter. Paddle Board Overstock skapar utrustning som gör att fler människor säkert kan uppleva floder, sjöar, hav och kustmiljöer.
    - title: Kontinuerlig innovation
      body: Innovation är inte bara att skapa nya produkter. Det förbättrar varje detalj - material, strukturer, tillverkning och användarupplevelse.
engineeringDna:
  tagline: Ingenjörs-DNA
  title: Hur Paddle Board Overstock skapar produkter
  areas:
    - title: Materialvetenskap
      body: Paddle Board Overstock fokuserar på att välja lämpliga material för olika marina miljöer. Viktiga överväganden inkluderar nötningsbeständighet, UV-beständighet, tryckstabilitet och långvarig hållbarhet.
      items:
        - Nötningsbeständighet
        - UV-beständighet
        - Tryckstabilitet
        - Långsiktig hållbarhet
    - title: Konstruktionsteknik
      body: Uppblåsbara vattenskotrar kräver exakt balans mellan styvhet, vikt, bärbarhet och stabilitet. Paddle Board Overstock ingenjörskonst fokuserar på att optimera dessa faktorer genom drop-stitch kärnteknik och avancerad sömkonstruktion.
      items:
        - Stelhet
        - Viktoptimering
        - Bärbarhet
        - Stabilitet
    - title: Tillverkningsprecision
      body: 'Varje produkt går igenom kontrollerade processer: materialberedning, precisionsskärning, svetsning och limning, montering, kvalitetskontroll och prestandaverifiering.'
      items:
        - Materialberedning
        - Precisionsskärning
        - Svetsning & limning
        - Montering & QC
    - title: Användarscenarioteknik
      body: Produkterna utvecklas kring verkliga applikationer - rekreation, äventyr och professionell användning - vilket säkerställer att varje design uppfyller de specifika kraven i den avsedda miljön.
      items:
        - Rekreation
        - Äventyr
        - Professionell
        - Kommersiell
