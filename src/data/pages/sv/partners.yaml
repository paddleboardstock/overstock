hero:
  tagline: Partnerskap och distribution
  title: 'Bli en Paddle Board Overstock-partner<br />— globalt distributionsnätverk'
  subtitle: "Gå med i Paddle Board Overstocks globala partnernätverk. Vi samarbetar med marinadistributörer, båtåterförsäljare, utrustningsbutiker och varumärkespartners i över 50 länder."
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sales-office.webp
    alt: Paddle Board Overstocks globala partner- och distributörsnätverk
content_programs:
  tagline: Partnerprogram
  title: 'Partnerprogram<br />byggda för tillväxt'
  subtitle: 'Oavsett om du är distributör, återförsäljare eller varumärkespartner erbjuder Paddle Board Overstock program utformade för att stödja ditt företag.'
  columns: 3
  items:
    - title: Distributörsprogram
      description: 'Exklusiv territoriell distribution med volympriser, marknadsstöd och direkt tillgång till fabriken. Minstaåtagande krävs baserat på territoriets storlek.'
      icon: tabler:world
    - title: Återförsäljarprogram
      description: 'Direkta återförsäljarpriser, produktutbildning, marknadsmaterial och garantistöd för fysiska butiker och näthandlar.'
      icon: tabler:building-store
    - title: OEM/ODM-partnerskap
      description: 'Komplett OEM- och ODM-tillverkning med eget varumärke, förpackning och produktspecifikationer. Från koncept till container.'
      icon: tabler:certificate
    - title: Varumärkespartnerskap
      description: 'Program för samvarumärken, egna märken och exklusiva modeller för etablerade varumärken inom marin- och friluftssektorn.'
      icon: tabler:stars
    - title: 'Myndigheter och institutioner'
      description: 'Leverantörsprogram för myndigheter, kustbevakningar, militären och humanitära organisationer. Anbudsklar dokumentation.'
      icon: tabler:building-community
    - title: 'Partner för anläggningar och uthyrning'
      description: 'Flottiljpriser, konsekvent kvalitet och eget varumärke för anläggningar, dykcentra och uthyrningsverksamheter världen över.'
      icon: tabler:sun
content_benefits:
  tagline: Varför bli partner med oss
  title: 'Därför väljer partners Paddle Board Overstock'
  subtitle: 'Våra partners får verklig tillverkningskapacitet, konsekvent kvalitet och responsiv support.'
  list:
    - 'Direkt tillgång till fabriken: Arbeta direkt med vårt tillverkningsteam — utan mellanhänder. Få snabbare svar, bättre priser och full insyn i produktionen.'
    - 'Klar för anpassning: Profilera dina produkter med egna färger, logotyper, förpackningar och specifikationer. Minstaorderkvantiteter anpassade efter din marknad.'
    - 'Garanterad kvalitet: ISO 9001-certifierad tillverkning med CE-, UKCA- och BSCI-efterlevnad. Varje produkt testas före leverans.'
    - 'Global logistik: Frakt från Qingdao, Kina med FOB-, CIF- och DDP-alternativ. Lager i USA i Montclair, Kalifornien för distribution i Nordamerika.'
    - 'Marknadsstöd: Produktkataloger, fotografi, teknisk dokumentation och digitala tillgångar som stödjer din försäljning.'
    - 'Utbildning och support: Produktutbildning för ditt säljteam, teknisk support för dina kunder och samordning av garantitjänster.'
content_process:
  tagline: Så blir du partner
  title: 'Enkel partnerskapsprocess'
  subtitle: 'Vår partnerskapsprocess är okomplicerad — utformad för att du snabbt ska börja sälja Paddle Board Overstock-produkter.'
  items:
    - title: 'Steg 1: Skicka in ansökan'
      description: 'Fyll i vårt partneransökningsformulär med din företagsprofil, målmarknad och produktintressen.'
    - title: 'Steg 2: Kvalificeringsgranskning'
      description: 'Vårt partnerteam granskar din ansökan och kontaktar dig inom 3 arbetsdagar för att diskutera möjligheter.'
    - title: 'Steg 3: Avtal och uppsättning'
      description: 'Teckna ett partnerskapsavtal, konfigurera ditt konto och ta emot partnerpriser, marknadsmaterial och produktprover.'
    - title: 'Steg 4: Utbildning och lansering'
      description: 'Produktutbildning, säljstöd och marknadsmaterial tillhandahålls. Du är redo att börja sälja.'
cta:
  title: 'Redo att bli en Paddle Board Overstock-partner?'
  subtitle: 'Ansök om partnerskap så svarar vårt team inom 3 arbetsdagar.'
  actions:
    - variant: primary
      text: Ansök om partnerskap
      href: /contact
    - text: Se våra produkter
      href: /products
