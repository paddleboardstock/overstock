testimonial:
  content: Vi började med Club Starter Package för vår surfskola i Portugal. 20 brädor, paddlar, västar — allt kom inom 3 veckor. Efter två säsonger uppgraderade vi till Pro-paketet. Det anpassade varumärket med vår logotyp förändrade vår professionella image.
  name: Ricardo Santos
  title: Ägare, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Klubbprofiler
  title: Vattensportklubblösningar<br />Efter klubbtyp
  subtitle: Från universitetspaddelklubbar till exklusiva privata yachtklubbar – varje typ av klubb har unika utrustningsbehov, användningsmönster och budgetstrukturer. Vi skräddarsyr varje paket för att matcha klubbmodellen.
  items:
    - title: Paddelklubbar för universitet och högskolor
      subtitle: Studentflottor med hög användning
      description: Studentdrivna eller institutionsstödda padelklubbar som driver SUP- och kajakprogram för universitetets rekreationsavdelningar. Utrustning står inför högfrekvent användning med hög omsättning på flera nivåer varje termin. Hållbarhet och enkel reparation är avgörande, tillsammans med budgetvänliga priser för studentorganisationer.
      features:
        - 'Extra hållbar PVC-konstruktion dimensionerad för studentanvändning'
        - 'Färgkodade brädserier efter nivå för enkel flottförvaltning'
        - 'Reparationskit + videosupport på anrop ingår i varje beställning'
        - 'Rabatterade priser för studentorganisationer och terminsbaserad betalning'
    - title: Gemenskapspaddlar & sociala klubbar
      subtitle: Medlemsdrivna fritidsklubbar
      description: Gemenskapsbaserade klubbar som erbjuder SUP, kajak och sociala paddlingsupplevelser till medlemmarna. Utrustningen måste balansera prestanda och komfort för ett brett åldersintervall, med varumärke som främjar klubbens identitet och medlemsstolthet. Förvaringseffektivitet är nyckeln för klubbar som verkar från begränsad tillgång till vattnet.
      features:
        - 'Blandad flotta: allround-SUP:ar, touringbrädor och fritidskajaker'
        - 'Full klubbprofil: egna färger, logotypstryck, profilflytvästar'
        - 'Kompakta förvaringslösningar för uppblåsbart material'
        - 'Startpaket för medlemsökning: remisskort, fotografering i klubbprofil'
    - title: Surfskolor och surfkajakakademier
      subtitle: Kustprestationer och coachning
      description: Surffokuserade skolor lär ut SUP-surfing, surfkajakpaddling och vågridning. Utrustningen måste fungera under surfförhållanden - manövrerbar, lyhörd och tillräckligt hållbar för att hantera upprepade utplåningar, sandnötning och exponering för saltvatten utan snabb nedbrytning.
      features:
        - 'Kortare, bredare SUP-formar optimerade för manövrering i surf'
        - 'Förstärkt rails-konstruktion för stötmotstånd i vågor'
        - 'Surfspecifik säkerhetsutrustning: spiralleds, mjuka fenor som alternativ'
        - 'Flottbytesprogram med säsongsrabatter vid inbyte'
    - title: Företags- och privata yachtklubbar
      subtitle: Premiummedlemsupplevelser
      description: Exklusiva privata klubbar som erbjuder vattensporter som en förstklassig bekvämlighet för medlemmar. Utrustningsstandarden är hög - estetik, varumärkesanpassning och gästklar presentation är lika viktigt som prestanda. Serviceförväntningarna inkluderar leverans av vita handskar, anpassade lagringslösningar och support på conciergenivå.
      features:
        - 'Brädor med premiumfinish i träfibermönstrat EVA och metalliska detaljer'
        - 'Egen färgmatchning enligt klubbens varumärkesriktlinjer'
        - 'Concierge-leverans: uppblåsta, upplagda och märkta för varje säsong'
        - 'Dedikerad kontoansvarig med prioriterad respons-SLA'
