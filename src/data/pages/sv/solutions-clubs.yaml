hero:
  tagline: Vattensportklubbar
  title: Utrustning och lösningar<br />För padelklubbar och träningscenter
  subtitle: Kompletta utrustningspaket, instruktörsutrustning, varumärke och underhållsstöd för SUP-klubbar, kajakklubbar, surfskolor och träningscenter för vattensporter av alla storlekar.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP-brädor för vattensportklubbar och uthyrningsflottor
direct_answer: Aquafarer tillhandahåller end-to-end utrustningslösningar för vattensportklubbar och träningscenter över hela världen. Våra klubbpaket inkluderar SUP-brädor, kajaker, paddlar, pumpar, reparationssatser och säkerhetsutrustning till konkurrenskraftiga grossistpriser med låga MOQ. Varje paket kan anpassas med klubblogotyper, märkesfärger och personliga förpackningar. Vi tillhandahåller även underhållsutbildning, reservdelssupport och utrustningsrotationsprogram för att maximera livslängden på din flotta.
solution_offerings:
  - title: Klubbstartpaket
    subtitle: För nya klubbar med 10–30 medlemmar
    badge: Best Seller
    features:
      - title: Kärnutrustning
        description: 10–30 SUP-brädor eller kajaker med matchande paddlar, pumpar och reparationssatser
      - title: Säkerhetsutrustning
        description: Flytvästar, visselpipa i klubbfärger för varje bräda
      - title: Instruktörsutrustning
        description: Coachspecifika brädor med halkfria däck och extra stabilitet
      - title: Varumärkespaket
        description: Anpassad logotyptryck på brädor, paddlar och förpackningar
      - title: Utbildningsmaterial
        description: Lektionsguider för nybörjare, säkerhetsprotokoll och checklistor för underhåll
    cta_text: 'Bygg mitt klubbpaket'
    cta_href: /contact
  - title: Club Premium-paket
    subtitle: För etablerade klubbar och operatörer på flera platser
    badge: Professional
    features:
      - title: Hela flottan
        description: 30–100 blandade flottor av SUP, kajaker och tillbehör
      - title: Avancerat säkerhetssystem
        description: Spårning av RFID-utrustning, skaderapporteringsapp, säkerhetsskyltning
      - title: Personalutbildning
        description: Verkstad för instruktörscertifiering och utrustningsunderhåll på plats
      - title: Marknadsföringsstöd
        description: Professionell fotografering, broschyrer och mallar för sociala medier
      - title: Ersättningsprogram
        description: Årlig utrustningsuppdatering till rabatterade priser med inbytesalternativ
    cta_text: 'Skala upp min klubb'
    cta_href: /contact
benefits:
  - icon: gear
    title: Grossistpriser
