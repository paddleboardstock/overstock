certifications:
  - title: CE-certifiering (EU 2016/425)
    standard: PPE-förordning (EU) 2016/425 | EN ISO 12402
    description: All Aquafarer-säkerhetsutrustning uppfyller CE-märkningskraven enligt EU:s förordning om personlig skyddsutrustning. Varje produkt testas oberoende av TÜV Rheinland, ett europeiskt anmält organ. Våra gummibåtar och RIB:ar uppfyller kraven för kategori C och D enligt direktivet om fritidsbåtar 2013/53/EU (RCD).
    body: CE-certifiering omfattar väsentliga hälso- och säkerhetskrav för personliga flytmedel och uppblåsbara vattenfarkoster. TÜV Rheinland granskar vår produktionsanläggning årligen för att verifiera löpande efterlevnad.
  - title: SOLAS — säkerhet för människoliv till sjöss
    standard: SOLAS kapitel III | LSA-koden
    description: Life Vest Pro uppfyller SOLAS-bestämmelserna för offshore- och kommersiella marina operationer. Testad för 24 timmars flytförmåga, automatisk uppblåsning vid nedsänkning och prestanda vid sjögång upp till styrka 5. Uppfyller kraven i kapitel III för flytvästar på kommersiella fartyg.
    body: SOLAS-godkännande kräver oberoende tester av ett anmält organ avseende flytförmåga, styrka, synlighet och automatisk aktivering. Vår Life Vest Pro har fullständigt SOLAS-typgodkännande med MED-certifiering.
  - title: USCG Typ III / Typ V
    standard: 46 CFR Del 160 | USCG-godkännande
    description: Utvalda Aquafarer-flytvästar uppfyller klassificeringen från United States Coast Guard för typ III (flythjälp) och typ V (specialanvändning). Lämpliga för skyddade vatten, kustsegling och kommersiella verksamheter som kräver USCG-godkända flytvästar (PFD).
    body: USCG-godkännande kräver tester av ett oberoende laboratorium som erkänns av kustbevakningen. Typ V-godkännande omfattar hybriduppblåsbara konstruktioner som kräver manuell eller automatisk aktivering.
  - title: BSCI social efterlevnad
    standard: amfori BSCI uppförandekod
    description: Vår fabrik granskas årligen enligt amforis Business Social Compliance Initiative (BSCI). Detta verifierar etiska arbetsmetoder, arbetssäkerhet, rättvisa arbetstider och miljöledning i vår produktionsanläggning på 12 000 m².
    body: BSCI-efterlevnad är ett krav för europeiska detaljister och importörer. Vårt nuvarande BSCI-betyg är "C" (Bra), granskat av SGS.
  - title: REACH- och RoHS-efterlevnad
    standard: EU-förordning REACH (EG) 1907/2006 | RoHS-direktiv 2011/65/EU
    description: Alla PVC-föreningar, lim och beläggningar som används i Aquafarer-produkter uppfyller EU:s kemikaliesäkerhetsföreskrifter REACH och RoHS-begränsningar för farliga ämnen. Säkerhetsdatablad (MSDS) finns tillgängliga för varje produktlinje.
    body: REACH-efterlevnad säkerställer att inga begränsade SVHC-ämnen överskrider tröskelvärdena. Regelbundna tester av oberoende laboratorier verifierar löpande efterlevnad för varje produktionsbatch.
  - title: ISO 9001:2015 kvalitetsledning
    standard: ISO 9001:2015 | Certifierad av TÜV Rheinland
    description: Vårt kvalitetsledningssystem är ISO 9001:2015-certifierat av TÜV Rheinland och omfattar design, produktion, testning och eftermarknadsservice. Årliga övervakningsrevisioner säkerställer kontinuerlig förbättring och processtyrning.
    body: ISO 9001-certifiering kräver dokumenterad kvalitetspolicy, interna revisioner, ledningsgranskningar, korrigerande åtgärdsprocedurer och spårbara produktionsregister.
testimonial:
  quote: Vi har köpt in säkerhetsutrustning från flera leverantörer i Asien. Aquafarer är den enda tillverkaren som lämnade fullständig CE-dokumentation, SOLAS-certifikat och oberoende testrapporter i förväg — utan att vi bad om det.
  author: Erik Lindström
  title: Säkerhetsansvarig
  company: Baltic Marine Supply
  location: Finland
content_overpressure:
  tagline: Säkerhet vid övertryck
  title: Hantering av RIB-rörtryck<br />i heta klimat
  subtitle: Trycket i uppblåsbara rör stiger med temperaturen. Att förstå och hantera övertryck förhindrar skador och säkerställer säker drift i tropiska och ökenmiljöer.
  items:
    - title: Boyle övertrycksventiler
      description: Aquafarer RIB-rör är utrustade med övertrycksventiler som automatiskt släpper ut överskottstryck över det nominella maximivärdet. Förhindrar sömnadsspänningar och potentiella rörbrister orsakade av soluppvärmning.
      icon: tabler:gauge
    - title: Tryckförändring från morgon till middag
      description: Ett rör uppblåst till 3,5 PSI vid 20 °C kan nå 4,5+ PSI vid solexponering i 40 °C. Blås alltid upp till den undre gränsen av det rekommenderade området i heta klimat och låt övertrycksventilen hantera överskottstrycket.
      icon: tabler:sun
    - title: Rekommenderade arbetstryck
      description: 'PVC-rör: 3,0-3,5 PSI drift, 4,5 PSI max. Hypalon-rör: 3,5-4,0 PSI drift, 5,0 PSI max. Testa alltid vid 1,25x nominellt tryck (4,4 PSI för PVC, 5,0 PSI för Hypalon) enligt Aquafarers QC-standarder.'
      icon: tabler:chart-bar
    - title: Best practices för solexponering
      description: Förvara RIB:ar i skuggiga områden när de inte används. Använd UV-skyddande överdrag vid längre förtöjning. Kontrollera och justera rörtrycket före och efter solens peaktimmar. Överskrid aldrig det maximala nominella trycket.
      icon: tabler:umbrella
    - title: Tryckavlastning i nödsituationer
      description: Om röret känns för hårt eller övertrycksventilen släpper ut luft, släpp ut luft via Halkey-Roberts- eller militärventilen tills trycket återgår till driftsområdet. Ha alltid en tryckmätare med dig för exakta avläsningar.
      icon: tabler:alert-circle
