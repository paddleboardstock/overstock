  title: Säkerhetsstandarder och certifiering
  subtitle: Varje Aquafarer-produkt genomgår rigorösa tester, och 64 CE-certifierade modeller uppfyller internationella säkerhetsstandarder för fritids- och professionellt bruk. ISO 9001-certifierad fabrik.
