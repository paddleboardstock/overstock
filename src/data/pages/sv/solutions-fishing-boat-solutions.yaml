content_challenge:
  tagline: Utmaningen
  title: Fiskebåtar behöver<br />stabilitet, räckvidd och hållbarhet
  subtitle: Oavsett om du driver kommersiella fiskefartyg, hanterar en kooperativ flotta eller driver fiskecharter – din båt måste fungera tillförlitligt varje dag.
  paragraphs:
    - Fiskebåtar behöver stabila plattformar för att arbeta med linor, hantera fångst och röra sig säkert på däck. Flätbåtar och RIB:ar erbjuder inbyggd stabilitet genom sin tubkonstruktion — ett betydande fördel jämfört med styva skrov av liknande längd.
    - Bränsleeffektivitet är viktigt för fiskeverksamheten där driftskostnaderna direkt påverkar lönsamheten. RIB:er och uppblåsbara båtar är lättare än motsvarande stela båtar, kräver mindre kraft och förbränner mindre bränsle - avgörande för kommersiella operatörer som dagligen kör båtar och kooperativ som hanterar flottans budgetar.
    - Hållbarhet i marina miljöer är avgörande. Saltvatten, UV-exponering och konstant användning kräver material som tål tuffa förhållanden utan nedbrytning. För kommersiella och kooperativa operatörer påverkar tillförlitlighet direkt inkomsten — en trasig båt innebär förlorade fiskedagar.
    - Aquafarer fiskekonfigurationer inkluderar spöhållare, fishfinders, betesbrunnar, livewells och lasthanteringslösningar utformade för seriösa fisketillämpningar inom kommersiella, kooperativa och fritidsaktiviteter.
content_solution:
  tagline: Vår lösning
  title: Fiskeklara konfigurationer
  subtitle: Varje fiskebåt från Aquafarer kan konfigureras för ditt specifika fisketillämpning.
  list:
    - Montage av spöhållare — fabriksmonterat eller klart för eftermontering
    - Monteringsplatta för ekolod/GPS vid konsolpositionen
    - Alternativ för agnbrunn eller livbrunn för charter- och kommersiella operatörer
    - Kylbox/förvaringskonfigurationer för hantering av fångst
    - Deep-V-skrov för offshoreförmåga — stabilt i vila, mjukt i fart
    - Alternativ med PVC- eller Hypalon-tuber — Hypalon för längre UV-exponering
    - Utomboordsområde från 15 HP till 115 HP beroende på modell och tillämpning
content_segments:
  tagline: Fiskeprofiler
  title: Lösningar för uppblåsbara fiskebåtar<br />Efter operatörstyp
  subtitle: Från kustsportfiske till kommersiellt långlinsfiske – olika fiskeoperationer kräver olika skrovkonfigurationer, effektområden och inställningar på däck. Vi skräddarsyr varje båt för att matcha fisket, vattnet och arbetsstilen.
  items:
    - title: Kommersiella fiskeföretag
      subtitle: Flotta arbetsbåtar för daglig fiskeverksamhet, näthantering, fångsttransport
      description: Kommersiella fiskeföretag driver arbetsbåtar för utsättning och hämtning av nät, fällservice, långrev och fångsttransport. Dessa båtar arbetar varje dag i saltvattenmiljöer och måste tåla tunga belastningar, konstant däckshantering och långa drifttider. Bränsleeffektivitet och lågt underhåll är avgörande för flottans lönsamhet. Fartyget måste tillhandahålla stabila arbetsplattformar för besättningshantering av redskap och fångst under varierande sjöförhållanden.
      features:
        - Platt däckslayout för näthantering, fällstapling och fiskförvaring
        - Bränsleeffektiv 40-115 HP utombordare för låga dagliga driftskostnader
        - Kraftiga Hypalon-rör för nötningsbeständighet vid dagligt bruk
        - Förstärkta gnidningslister för frekvent kontakt med brygga och fartyg
        - Självlåsande däck för enkel tvättning efter operationer
        - Prissättning och konsekventa specifikationer för operatörer med flera fartyg
    - title: Charterfiskeoperatörer
      subtitle: Flerpassagerarkomfort, fångsthantering, säkerhetscertifierad
      description: Operatörer som kör halv- och heldags fiskecharter — från kustrevfiske till bottenfiske till havs. Din båt behöver passagerarsäten med säkerhetscertifieringar, gott om däcksutrymme för flera sportfiskare och integrerade hålrum för att hålla bete och fångst fräscht under hela resan. Gästkomfort påverkar direkt reseomdömen, upprepade bokningar och onlinebetyg.
      features:
        - Konsolstyrning med stötdämpande skopsäten
        - Fabriksinstallerade spöhållare (4–8 positioner)
        - 60–115 HP utombordsräckvidd för marschfarter till havs
        - CE Kategori C eller B-certifiering för kommersiell passagerartrafik
        - Bimini eller T-top solskydd för gästkomfort på längre resor
    - title: Hantverksfiskare och småskaliga yrkesfiskare
      subtitle: Pålitliga arbetsbåtar för daglig försörjning
      description: Oberoende fiskare som förlitar sig på sin båt som sin primära inkomstkälla – sätter ut nät, sköter fiskfällor eller handlinar nära stranden. Din prioritet är bränsleekonomi, enkelt underhåll du kan utföra själv och en båt som hanterar måttliga laster av fångst och redskap utan att ge avkall på stabiliteten.
      features:
        - Bränsleeffektiv 15–40 HP utombordare för låga driftskostnader
        - Hypalon CSM rör för utökad UV- och nötningsbeständighet
        - Platt däck för näthantering och fiskförvaring
        - Enkel strandlandningsförmåga med uppblåsbart kölskydd
    - title: Fiskekooperativ
      subtitle: Fångsthämtning, medlemstransport, förrådsdistribution
      description: Fiskekooperativ driver lokalt baserade flottor för att samla in fångster från medlemsfiskare, transportera förnödenheter till avlägsna fiskesamhällen och distribuera skörden till marknader. Dessa arbetsbåtar behöver hög nyttolastkapacitet, tillförlitlig daglig drift och enkelt underhåll på avlägsna platser. Kooperativ är ofta verksamma i utvecklingsregioner där tillgången till reservdelar och service är begränsad, vilket gör enkla utombordares konfigurationer och hållbar konstruktion väsentliga.
      features:
        - Hög nyttolastkapacitet för att dra fångst och förnödenheter
        - Enkel utombordskonfiguration för enkel service på plats
        - Kraftig PVC eller Hypalon konstruktion för budgetflexibilitet
        - Platt däck med fästpunkter för lastsäkring
        - Bränsleeffektiv drift som minimerar de kooperativa driftskostnaderna
    - title: Sport- och viltfiskeentusiaster
      subtitle: Prestanda och stil för seriösa sportfiskare
      description: Erfarna sportfiskare som letar efter en kapabel fiskeplattform som levererar fart till avlägsna marker, stabila stående stridspositioner och förstklassig passform och finish. Båten måste känna sig hemma oavsett om den springer två miles offshore till ett rev eller utforskar avlägsna flodmynningar.
      features:
        - Deep-V RIB skrov för smidig gång i hack
        - Fishfinder/GPS-monteringsplatta förkopplad på konsolen
        - Baitwell och kylare integrerade i baksätesmodulen
        - Anpassade EVA däcksfärgalternativ som matchar båt-/rörgrafik
    - title: Fiskeguide och ekotursarrangörer
      subtitle: Guidade fiskeupplevelser för besökande sportfiskare
      description: Guider som tar små grupper av besökande sportfiskare till produktiva fiskeplatser – ofta kombinerar fiske med ekoturism som fågelskådning eller mangroveutforskning. Båten måste åka torr och bekväm för gäster som inte är vana vid små båtar, med lätt ombordstigning och skugga.
      features:
        - Bimini topp eller T-top monteringspunkter fabriksinstallerade
        - Smidig instegsstege för enkel ombordstigning
        - Tyst 4-takts utombordare för att minimera störningar
        - Torra förvaringsfack för gästtelefoner, plånböcker, kameror
