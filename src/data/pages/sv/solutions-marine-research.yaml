content_challenge:
  tagline: Utmaningen
  title: Havsforskningskrav<br />Stabla, instrumentfärdiga plattformar
  subtitle: Vetenskapliga arbetsbåtar måste tillhandahålla en stabil plattform för känslig instrumentering, tyst drift för att undvika att störa vilda djur och flexibla layouter för olika forskningsutrustning.
  paragraphs:
    - Marinforskning och miljöövervakning kräver arbetsbåtar som fungerar som mobila laboratorier. Till skillnad från kommersiella eller fritidsfartyg måste forsknings-RIB:ar rymma känslig elektronisk instrumentering, utrustning för vatten- och sedimentprovtagning och ibland transport av levande prover — samtidigt som en stabil plattform upprätthålls för exakt datainsamling.
    - '**Plattformstabilitet är avgörande** — Sonar, ekolod och CTD-profiler (konduktivitet, temperatur, djup) kräver ett stabilt skrov i stillastående läge och vid låg fart. Överdrivet kölvatten eller skrovrörelser ger brus i vetenskapliga data. Ett djup-V-skrov med goda stabilitetsegenskaper är avgörande.'
    - '**Instrumentintegration** — Forskningsfartyg behöver infästningspunkter för GPS-antenner, sonartransduktorer, provtagningsarmar och dataloggare. Konsolutrymmet måste rymma flera skärmar, kraftfördelning för instrument och säker förvaring av känslig elektronik.'
    - '**Tyst drift** — Vid marinbiologiska undersökningar och miljöövervakning kan motorbuller och skrovvibrationer skrämma marint liv och störa beteendeobservationer. Tysta utombordskonfigurationer och skrovkonstruktioner med reducerade vibrationer är viktiga för forskningstillämpningar.'
    - Paddle Board Overstocks forsknings-RIB:ar är konstruerade med stabila skrovplattformar, integrerade infästningssystem för utrustning och tysta utombordskonfigurationer för vetenskapliga och miljöövervakande tillämpningar.
content_solution:
  tagline: Vår lösning
  title: Specialbyggda forsknings-RIB<br />För vetenskap och miljöarbete
  subtitle: Varje Paddle Board Overstock forsknings-RIB är konfigurerad som en stabil, anpassningsbar plattform för vetenskaplig instrumentering och utrustning för fältprovtagning.
  list:
    - Djup-V-skrov i glasfiber med utmärkt stabilitet i stillastående läge och vid låga undersökningsfarter
    - Platt däckslayout med infästningsplattor för utrustning för sonar, GPS och provtagningsgear
    - Konsol konfigurerad för flera skärmar — plotter, ekolod, datalogger
    - 12V- och 24V-tillbehörsfördelning för vetenskapliga instrument
    - Tyst 4-takts utombordare — minimal vibration och buller för faunainventeringar
    - Valfri skrovdesign med lågt kölvatten för minimal störning under datainsamling
    - Anpassade tubfärger för forskningsinstituts varumärkesprofil och flottidentifiering
content_segments:
  tagline: Forskningsprofiler
  title: Marine Science Solutions<br />Efter applikationstyp
  subtitle: Olika forskningsapplikationer har unika krav på fartyg — från universitetsundervisningsplattformar till miljöundersökningsfartyg till vattenkvalitetsövervaknings-RIB.
  items:
    - title: Universitetets marinvetenskapsprogram
      subtitle: Undervisningsplattformar, studiebesök, kustforskning
      description: Marinvetenskapliga universitet och oceanografiavdelningar behöver pålitliga, mångsidiga arbetsbåtar för att undervisa i fältkurser, studentforskningsprojekt och fakultetsledda kustundersökningar. Båten måste vara lätt att använda för studenter under övervakning, stabil nog för praktisk instrumentinstallation och hållbar nog för frekvent användning av flera användare över akademiska termer. Budgetbegränsningar i akademiska miljöer gör kostnadseffektivitet och lågt underhåll viktiga överväganden.
      features:
        - Stabil plattform för studenters övning i utplacering och återtagning av instrument
        - Enkel hantering — rorkults- eller enkelkonsolskonfiguration för övervakad studentanvändning
        - Hållbara Hypalon-tuber för frekventa landningar på stranden och hantering av studenter
        - Utrustningsfäste för pedagogiskt sonar, secchiskiva och provtagningsgear
        - Kostnadseffektiv PVC-option för akademiska program med knapp budget
    - title: Havsforskningsinstitut
      subtitle: Undersök RIB:er med instrumentintegration, GPS, provtagningsutrustning
      description: Dedikerade marinforskningsorganisationer som utför kust- och havsundersökningar behöver professionellt konfigurerade undersöknings-RIB med integrerad instrumentering. Dessa kärl bär ekolodssystem för batymetrisk kartläggning, CTD-profiler för vattenpelaranalys, sedimentprovtagare och biologisk uppsamlingsutrustning. Båten måste tillhandahålla en stabil plattform vid låga mäthastigheter, ha gott om däcksutrymme för utplacering av utrustning och erbjuda ren 12V/24V ström för elektronik.
      features:
        - Integrerat sonartransduktorfäste — genom skrovet eller på akterspegeln
        - GPS-antennfäste och konsolintegration för navigering i undersökningsklass
        - Utplaceringsområde för CTD och vattenprovtagare med säkra fastgörningspunkter
        - 12V/24V-extrafördelning för instrument och dataloggare
        - Stabil vid låg fart (3–6 knop) för noggrannhet i undersökningslinjer
        - Valfri A-frame eller dävert för utplacering av tyngre provtagningsutrustning
    - title: Miljöövervakning och bevarande
      subtitle: Ekologiska undersökningar, viltobservation, livsmiljöbedömning
      description: Miljö-NGOs, statliga myndigheter och naturvårdsorganisationer genomför marina ekologiska undersökningar, övervakning av vilda djur och habitatbedömningar. Dessa operationer kräver tysta fartyg med låg påverkan som kan närma sig känsliga livsmiljöer utan att störa vilda djur. Båtar behöver ha kamerautrustning, GPS för transektkartering och provtagningsutrustning för vatten- och sedimentuppsamling. Låg vakenhet och minimalt motorljud är avgörande för beteendeobservationsstudier.
      features:
        - Tyst 4-takts utombordare — minimal störning av marint liv
        - Stabil observationsplattform för foto- och videodokumentation
        - Utrustningsfäste för kamerarigg, GPS-trackers och fältdatorer
        - Grund djupgående för åtkomst av kustvåtmarker, mangrove och estuariier
        - Lättrengjorda däcks- och tubytor för dekontaminering mellan platser
    - title: Övervakning och testning av vattenkvalitet
      subtitle: Regelbundna provtagningar, spårning av föroreningar, övervakning av efterlevnad
      description: Vattenkvalitetsövervakningsorganisationer utför regelbundna provtagningar över kustzoner, hamnar och inre vattenvägar för att spåra föroreningsnivåer, algblomning och efterlevnad av miljöbestämmelser. Dessa verksamheter kräver effektiva, pålitliga båtar för upprepade besök på fasta provtagningsstationer. Fartyget måste ha provtagningsutrustning, kylare för provkonservering och fälttestutrustning – med enkel däckstvätt mellan provtagningsplatserna för att förhindra korskontaminering.
      features:
        - Dedikerat provtagningsstationsområde med kylbox och utrustningsförvaring
        - Däck och tubytor som är lätta att rengöra för dekontaminering mellan platser
        - GPS-integration för precis återkomst till fasta provtagningskoordinater
        - Kompakt storlek för åtkomst till begränsade farleder och smala kanaler
        - Bränslesnål utombordare för kostnadseffektiva regelbundna provtagningsturer
