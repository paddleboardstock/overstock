content_customization:
  tagline: Vad kan anpassas
  title: RIB-anpassning<br />Alternativ
  subtitle: Varje del av en RIB-båt kan skräddarsys för din applikation, marknad och varumärkeskrav.
  items:
    - title: Skrov & strukturell
      description: Skrovlängd (2,5–8,5 m), skrovmaterial (GRP glasfiber eller marinkvalitet aluminium), skrovfärg (gelcoat eller målad), kölprofil (djup-V, måttlig-V, platt), akterspegelstyp (sluten akterspegel med fäste eller brunn) och strukturell förstärkning för kommersiella belastningskrav.
      icon: tabler:sailboat
    - title: Rör & krage
      description: Rörmaterial (0,9–1,2 mm PVC eller 1,4–1,7 mm Hypalon/CSM), rördiameter (40–55 cm), antal kamrar (3–7), ventiltyp (Halkey-Roberts, Leafield D7 eller Boston), tubfärg (standard eller anpassad) och kragkon-/konfiguration.
      icon: tabler:circle
    - title: Layout för däck och konsol
      description: Mittkonsol, sidokonsol eller rorkultsstyrning. Sittlayout (jockeysäten, bänkar, bolsterstolar). Däckbeläggning (EVA-skum i teak-look, halkfri färg eller blank glasfiber). Utrustningsmonteringspunkter, greppstänger och D-ringspositioner.
      icon: tabler:layout-dashboard
    - title: El & Navigation
      description: Navigationsljus (LED), länspumpsystem, batterihantering, VHF-radioinstallation, GPS/plottermontering, USB-laddningsportar och kopplingspanelkonfiguration.
      icon: tabler:bolt
    - title: Varumärke & grafik
      description: Skrov- och rörgrafik (screentryck, värmeöverföring, digital UV-utskrift), logotypplacering, skräddarsydda färgscheman, identifieringsmarkeringar och anpassad ägardokumentation med ditt varumärke.
      icon: tabler:palette
    - title: Säkerhet och efterlevnad
      description: Designkategoriklassificering (A/B/C/D per RCD), brandsläckningssystem, bränslesystemspecifikation (bärbar tank, fast tank, under däck) och dokumentationspaket för överensstämmelse för din målmarknad.
      icon: tabler:shield
content_applications:
  tagline: Applikationskonfigurationer
  title: RIB-konfigurationer<br />Per applikation
  subtitle: Olika uppdrag kräver olika konfigurationer. Här är beprövade inställningar för de vanligaste RIB-applikationerna.
  items:
    - title: Räddning & Patrull
      description: Deep-V-skrov, Hypalon-rör, självlåsande däck, bolsterstolar, grepphandtag, navigationsljus och kraftiga D-ringar. RCD Design Kategori B eller C. Brandsäkert bränslesystem och elektrisk elektrisk.
      icon: tabler:lifebuoy
    - title: Dykstöd
      description: Bred balk, bakre ombordstigningsstege, tankställspositioner, extra D-ringar, dykflaggafäste, förstärkt akterspegel för dubbla utombordare och halkfri heldäck EVA-beklädnad.
      icon: tabler:mask
    - title: Turism & Kommersiellt
      description: Passagerarcertifierad layout med bänkar, parasoll/Bimini, handtag, torrförvaring och dubbla batterisystem. RCD Kategori C. Designad för resort- och charterflottans verksamhet.
      icon: tabler:beach
    - title: Fiske
      description: Öppna däckslayout, spöhållarpositioner, levande betesbrunn, ekolodsfäste, trollingmotorfäste, förstärkt akterspegel och bärbart bränslesystem. Alternativ för mittkonsol eller sidokonsol.
      icon: tabler:fish
    - title: Fritid & Yacht Tender
      description: Lättviktsskrov, PVC-rör, bekväma sittplatser, teleskopisk rorkult eller kompakt konsol, lyftpunkter för davit och avtagbar bränsletank. RCD kategori C eller D.
      icon: tabler:sailboat
    - title: Professionell arbetsbåt
      description: Aluminiumskrovalternativ, kraftig förstärkning, hydraulisk styrning, elektriska apparater av kommersiell kvalitet, radarbåge och integreringspunkter för uppdragsspecifik utrustning. Anpassad efterlevnad per projekt.
      icon: tabler:anchor
process_steps:
  title: 7-stegs RIB OEM/ODM-utvecklingsprocess
  subtitle: Från projektöversikt till efterförsäljning — ett definierat arbetsflöde med tydliga milstolpar och leveranser
  steps:
    - number: '01'
      title: Projektkort och krav
      description: Definiera målapplikationen, skrovstorlek, rörmaterial, överensstämmelsekrav och varumärkesbehov. Vi bedömer genomförbarheten och bekräftar samarbetsmodellen (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 dagar
    - number: '02'
      title: Teknisk granskning och genomförbarhet
      description: Ingenjörsteamet granskar strukturell genomförbarhet, stabilitets- och flytkraftsberäkningar, efterlevnadsväg och materialtillgänglighet. Vi identifierar befintliga formar eller anpassade formkrav.
      timeline: 5–7 dagar
    - number: '03'
      title: Förslag & offert
      description: Få ett detaljerat förslag inklusive specifikationer, 3D-renderingar eller GA-ritningar, efterlevnadsomfång, tidslinje och enhetspriser baserat på volymnivåer och MOQ.
      timeline: 5–7 dagar
    - number: '04'
      title: Designbekräftelse & provtagning
      description: Godkänn slutlig GA, däckslayout och rörkonfiguration. Vi tar fram ett förproduktionsprov med ditt varumärkes färger, logotyp och specificerat material för din fysiska inspektion.
      timeline: 15–20 dagar
    - number: '05'
      title: Provgodkännande och QC-protokoll
      description: 'Inspektera och godkänn provet. Definiera produktions-QC-protokollet: trycktest (1,25x / 24–48h), dimensionskontroller och checklista för överensstämmelsedokumentation per skrov.'
      timeline: 3–5 dagar
    - number: '06'
      title: Massproduktion och kvalitetskontroll
      description: Full produktionskörning med 100-punkters QC-checklista per enhet. Inspektioner under process, trycktestning och spårbarhet på seriell nivå. CE/ISO dokumentation upprättad parallellt.
      timeline: 30–45 dagar
    - number: '07'
      title: Packning, frakt & efterförsäljning
      description: Anpassad förpackning (standard, detaljhandelsfärdig eller pallad), exportdokumentation, containerlastning och logistik. Reservdelssatser och underhållsdokumentation ingår.
      timeline: 7–14 dagar
