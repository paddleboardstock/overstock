faq:
  title: RIB OEM/ODM — Vanliga frågor
  questions:
    - q: Vad är skillnaden mellan OEM och ODM för RIB-båtar?
      a: 'OEM (Original Equipment Manufacturing): du tillhandahåller detaljerade specifikationer och vi bygger din design. ODM (Original Design Manufacturing): du väljer en beprövad Aquafarer RIB-plattform och vi anpassar den med dina önskade funktioner och varumärke. ODM är snabbare och lägre kostnad; OEM erbjuder maximal designkontroll.'
    - q: Kan jag anpassa RIB-skrovets form och storlek?
      a: Ja. Vi erbjuder semi-anpassade modifieringar av befintliga skrovformar (olika däckslayouter, rörkonfigurationer) och fullständig anpassad skrovutveckling med nya CNC-bearbetade formar. Semi-anpassade projekt kan börja på 2-5 enheter; full anpassad kräver vanligtvis högre åtaganden.
    - q: Vilka rörmaterial finns tillgängliga för anpassade RIB:er?
      a: Vi erbjuder 0,9-1,2 mm PVC för rekreation och lätt kommersiell användning, och 1,4-1,7 mm Hypalon/CSM för professionella, räddnings- och kommersiella tillämpningar som kräver överlägsen UV- och ozonbeständighet (10-15 års livslängd jämfört med 5-8 år för PVC).
    - q: Kan du konfigurera RIB:er för specifika applikationer som räddning, dykning eller fiske?
      a: Ja. Vi upprätthåller beprövade konfigurationsmallar för räddning/patrullering, dykstöd, turism/charter, fiske, yachtanbud och professionella arbetsbåtsapplikationer. Varje mall innehåller rekommenderad skrovtyp, rörmaterial, däckslayout och utrustning - som vi sedan anpassar efter dina exakta krav.
    - q: Vilken information behöver du för en RIB OEM/ODM offert?
      a: Målapplikation, önskad skrovlängd, preferens för rörmaterial (PVC eller Hypalon), ungefärlig kvantitet och leveransschema, målmarknadsefterlevnadskrav och eventuella referensprodukter eller specifikationer. Ju mer detaljer du anger, desto snabbare och mer exakt är vår offert.
    - q: Vad är MOQ för anpassade RIB-båtar?
      a: För befintliga skrovformar med standardmodifieringar börjar MOQ på 2-5 enheter per design. För anpassade formar och fullständig anpassad utveckling beror MOQ på projektets komplexitet - vanligtvis 10-20 enheter för semi-custom och 30+ för full custom med nya verktyg.
    - q: Vem äger de anpassade formarna och ritningarna?
      a: Formar som utvecklats med Aquafarers basdesign förblir Aquafarers egendom. Helt anpassade formar som beställs och betalas av kunden kan överlåtas till kundägande enligt avtalsvillkor. Alla formägarvillkor är dokumenterade innan projektstart.
    - q: Hur förpackas anpassade RIB:er för export?
      a: 'Standard: anpassad vagga + stretch-omslag för containerlastning. Premium: färdig förpackning, vakuumförpackning eller pall. Vi erbjuder FOB Qingdao, CIF och DDP frakt. Fullständig exportdokumentation och tullklarering ingår.'
