content_service_modules:
  tagline: Servicemoduler
  title: OEM/ODM Service<br />Moduler
  subtitle: Varje projekt kombinerar rätt servicemoduler. Alla projekt behöver inte varje modul – vi omfångar bara vad ditt projekt kräver.
  items:
    - title: Teknisk granskning och genomförbarhet
      description: 'Utvärdering av skrovplattform, kontroll av strukturell genomförbarhet, verifiering av stabilitet och flytkraft, identifiering av efterlevnadsväg och bekräftelse av materialtillgänglighet. Utdata: genomförbarhetsrapport med go/no-go-rekommendation.'
      icon: tabler:math-function
    - title: Design & konfiguration
      description: 'GA-ritning, däcklayout, rörkonfiguration, konsol- och sittplatser, monteringsplan för utrustning och val av färg/material. Utgång: godkänd GA och konfigurationsspecifikation.'
      icon: tabler:ruler
    - title: Provexemplar & prototyp
      description: Förproduktionsprov med godkända färger, logotyp och specificerat material för fysisk inspektion. Inkluderar exempel på godkännandeprotokoll, inspektionschecklista och process för ändringsförfrågan.
      icon: tabler:3d-cube-sphere
    - title: Produktion & kvalitetskontroll
      description: Massproduktion med 100-punkters QC-checklista per enhet, inspektioner under processen, trycktestning (1,25x / 24-48h) och spårbarhet på seriell nivå. CE/ISO dokumentation utarbetad parallellt.
      icon: tabler:clipboard-check
    - title: Varumärke & förpackning
      description: Logotypapplikation med privata märken, anpassad skrov- och rörgrafik, ägardokumentation för märket, förpackning som är färdig för försäljning eller pallförpackning och förberedelse av reservdelssatser.
      icon: tabler:palette
    - title: Export & Dokumentation
      description: Exportförpackning, containerlastningsplan, FOB/CIF/DDP dokumentation, efterlevnadspapper per destinationsmarknad och kommunikationsprotokoll efter leverans.
      icon: tabler:world
content_risk_control:
  tagline: Risk & Leveranskontroll
  title: Projektrisk &<br />Leveranshantering
  subtitle: Professionella OEM/ODM köpare bryr sig lika mycket om riskkontroll som produktkvalitet. Så här hanterar vi det.
  items:
    - title: Definition av omfattning och ägande
      description: 'Innan utvecklingen påbörjas definierar vi skriftligt: ​​anpassningsomfattning, verktygskrav, provgodkännandekriterier, ägande av ritningar och formar samt dokumentationsansvar. Ingen tvetydighet om vem som äger vad.'
      icon: tabler:file-text
    - title: Ändringskontrollprocess
      description: Alla specifikationsändringar efter designbekräftelse följer en dokumenterad process för ändringsförfrågan med konsekvensbedömning (kostnad, tidslinje, efterlevnad). Inga ogodkända ändringar kommer in i produktion.
      icon: tabler:arrows-diff
    - title: Batchkonsistensgaranti
      description: Den 50:e enheten matchar det 1:a godkända provet. Godkända specifikationer fryses, material- och processparametrar är låsta och kontrollpunkter under processen verifierar överensstämmelse över hela produktionskörningen.
      icon: tabler:repeat
    - title: Leverans & Kapacitetstransparens
      description: Ledtiderna anges baserat på faktisk produktionskapacitet, materiallagernivåer och aktuell orderbelastning – inte ambitiösa mål. Produktionsschema med milstolpsdatum per beställning.
      icon: tabler:calendar-stats

