content_priorities:
  tagline: Vad kunder verifierar
  title: 8 saker som köpare verifierar<br />vid varje fabriksbesök
  subtitle: Baserat på feedback från 50+ köpare i länder är dessa åtta prioriteringar som kunder bedömer innan de gör en B2B-beställning.
  items:
    - title: Verklig tillverkare
      description: 'Är du den faktiska fabriken, inte ett handelsföretag? Köpare kontrollerar: affärsenhet, verklig produktionsutrustning, anställda som använder maskiner, aktuella produktionsorder på golvet och samstämmighet mellan webbplats och verkstad.'
      icon: tabler:building-factory
    - title: Produkt lämplig för applikation
      description: Matchar RIB deras specifika användningsfall? Orter, räddning, dykning, fiske och patrulloperatörer har fundamentalt olika krav. Köpare utvärderar däckslayout, rörmaterial och utrustningsalternativ på den visade båten.
      icon: tabler:target
    - title: Kvalitet Stabilitet & Reproducerbarhet
      description: Är den 50:e enheten lika bra som den 1:a? Köpare undersöker QC-system, kontrollpunkter under processen, hantering av avvikelser och ber att få se poster från flera produktionskörningar för att verifiera överensstämmelse.
      icon: tabler:repeat
    - title: Överensstämmelsedokumentets äkthet
      description: Är CE-certifikat modellspecifika? Är DoC undertecknat av en verklig person? Kan överensstämmelse verifieras per skrovnummer? Köpare letar efter generella anspråk kontra modellspecifik dokumentation.
      icon: tabler:file-certificate
    - title: Anpassningsutförande
      description: Kan fabriken verkligen leverera anpassade konfigurationer? Köpare letar efter bevis på tidigare anpassade projekt, prototypprover som visas, tekniska ritningar och möjligheten att diskutera tekniska ändringar på plats.
      icon: tabler:adjustments
    - title: Ledtid och kapacitet
      description: 'Är citerade tidslinjer realistiska? Köpare bedömer: aktuell produktionsvolym, tillgänglig kapacitet, personalstyrka, materiallagernivåer och om fabriken har ett produktionsplaneringssystem.'
      icon: tabler:clock
    - title: Pris & Handelsvillkor
      description: 'Är priserna transparenta? Är FOB-prissättningen tydlig? Köpare verifierar: enhetsprisuppdelning, verktygskostnader, förpackningskostnader och om fabriken kan hantera DDP- eller CIF-villkor med korrekt exportdokumentation.'
      icon: tabler:currency-dollar
    - title: Efterförsäljning & reservdelar
      description: 'Vad händer efter leverans? Köpare utvärderar: reservdelstillgänglighet, garantiprocess, utbytesrörsektioner, ventilbyte och om fabriken har ett dokumenterat efterförsäljningsprotokoll.'
      icon: tabler:headset
content_tour:
  tagline: Fabriksrundtur
  title: Revisionstur —<br />Vad du kommer att se
  subtitle: Vår standard fabriksrundtur följer en definierad rutt utformad för att svara på köparens frågor vid varje station.
  items:
    - title: 1. Mötesrum — Företagsintroduktion
      description: Företagslicens, ISO 9001 och BSCI-certifikat, exportlicenser och företagets historia. Snabb översikt över produktionskapacitet och efterlevnadsomfång.
      icon: tabler:users
    - title: 2. Råvarulager — IQC Station
      description: Inkommande materialinspektionsprotokoll, tygbatchcertifikat, lim och hårdvaruprover. Se hur material testas innan du går i produktion.
      icon: tabler:building-warehouse
    - title: 3. Rörtillverkning — RF-svetsning och handlimning
      description: Spännande rörsvetsning eller limningsprocess, demonstrationer av sömhållfasthetstest och ventilinstallation. Observera kammar-för-kammare konstruktion och kvalitetskontrollpunkter.
      icon: tabler:flame
    - title: 4. Skrovlaminering — GRP-verkstad
      description: Glasfiberuppläggningsprocess, gelcoatapplicering och skrovhärdning. Se lamineringsschemat och strukturell förstärkning för olika RIB-modeller.
      icon: tabler:layers-subtract
    - title: 5. Montering & integration
      description: Skrov-rörskarvning, installation av konsol och säte, integration av el- och bränslesystem och montering av utrustning. Observera produktionslinjen i drift.
      icon: tabler:tool
    - title: 6. Tryckprovningsstation
      description: 24-48 timmars tryckhållningstest vid 1,25x nominellt tryck. Visa testposter, tryckmätare och kriterier för godkänd/underkänd. Se hur testresultat är kopplade till skrovets serienummer.
      icon: tabler:gauge
    - title: 7. Slutlig inspektion & QC
      description: 100-punkters kvalitetschecklista per enhet, dimensionskontroll, kosmetisk inspektion och förpackningsintegritetskontroll. Granska avvikelseloggar och korrigerande åtgärder.
      icon: tabler:clipboard-check
    - title: 8. Dokumentgranskningsrum
      description: Överensstämmelsedokumentation per modell (DoC, byggskylt, användarmanual), produktionsspårbarhetsregister, HIN-register och demonstration av databas för spårning av materialbatch.
      icon: tabler:folder
content_qc_chain:
  tagline: Kvalitetsbevis
  title: 8-stegs QC-kedja<br />— Verifierbar vid varje steg
  subtitle: Vår kvalitetskontrollkedja sträcker sig från inkommande material till slutlig leverans, med dokumenterade bevis i varje steg.
  items:
    - title: 'Steg 1: Inkommande materialinspektion'
      description: Varje parti av PVC, Hypalon, glasfiber, aluminium, lim och hårdvara testas mot specifikationerna innan de sätts i produktion. Draghållfasthet, beläggningsvidhäftning och dimensionskontroller enligt AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Steg 2: Rörsvetsning / limning QC'
      description: Sömmens skalhållfasthetstestning per produktionssats. RF-svetsparametrar övervakas och registreras. Handlimmade sömmar kontrollerade för konsekvent limtäckning och härdningstid.
      icon: tabler:flame
    - title: 'Steg 3: Skrovlaminering QC'
      description: Mätning av gelcoattjocklek, verifiering av glasfiberuppläggning enligt laminatschema och övervakning av härdningstiden. Strukturella förstärkningspositioner verifierade mot tekniska ritningar.
      icon: tabler:layers-subtract
    - title: 'Steg 4: Montering och integration QC'
      description: Skrov-rörskarvsintegritet, vridmoment för konsol och säte, elektrisk kontinuitet och läckagetest av bränslesystemet. Varje installationspunkt verifierad mot den modellspecifika monteringschecklistan.
      icon: tabler:tool
    - title: 'Steg 5: Tryckhållningstest'
      description: Varje uppblåsbar kammare trycksattes till 1,25x märkt PSI och hölls i 24-48 timmar. Tryckfall registrerat per kammare. Godkänd/underkänd tröskel dokumenterad. Kopplad till skrovets serienummer.
      icon: tabler:gauge
    - title: 'Steg 6: Slutinspektion'
      description: 100-punkters kvalitetschecklista som täcker dimensionell noggrannhet, kosmetisk finish, tillbehörens fullständighet, dokumentationspaket och förpackningsintegritet. Oberoende från produktionsteamet.
      icon: tabler:clipboard-check
    - title: 'Steg 7: Överensstämmelsedokumentation'
      description: Modellspecifika DoC, byggplåtsverifiering, fullständighet i ägarhandboken och HIN-registret. Alla överensstämmelsedokument förberedda och verifierade innan leveransen släpps.
      icon: tabler:file-certificate
    - title: 'Steg 8: Frisläppande av försändelser och spårbarhet'
      description: Den slutliga versionen kräver att alla kvalitetskontrollstadier har godkänts, att dokumentationen är komplett och att fraktdokumentationen verifieras. Skrovposten stängd och arkiverad för lagring i 10+ år.
      icon: tabler:truck
content_traceability:
  tagline: Produktionsspårbarhet
  title: HIN → Master File →<br />Hull Record → Leverans
  subtitle: Varje RIB-båt har ett unikt skrovidentifikationsnummer kopplat till en komplett produktions- och efterlevnadskedja.
  items:
    - title: Skrovidentifikationsnummer (HIN)
      description: 14-teckens unik identifierare permanent markerad på varje båt. Kodar tillverkarkod (MIC), modellbeteckning, tillverkningsår och serienummer. Nyckeln som låser upp hela spårbarhetskedjan.
      icon: tabler:hash
    - title: Master teknisk fil
      description: Överensstämmelse och teknisk dokumentation för modellfamiljen. Innehåller GA-ritningar, riskbedömning, stabilitetsberäkningar, materialspecifikationer och tillämpliga standarder. Kopplad till alla skrov av den modellen.
      icon: tabler:folder
    - title: Individuellt skrovrekord
      description: 'Produktionsrekord per skrov: HIN, produktionsdatum, rörsats, materialcertifikat, trycktestresultat, slutlig konfiguration, motorspecifikation, resultat av kvalitetschecklistan och leveransdestination. 21+ datafält per skrov.'
      icon: tabler:file-description
    - title: Kundefterlevnadspaket
      description: Leveranspaket per skrov inklusive DoC, byggskyltfoto, ägarmanual, checklista för överensstämmelse och slutlig konfigurationsblad. Skickas med båten och arkiveras på fabriken i 10+ år.
      icon: tabler:package
content_red_flags:
  tagline: Revision fallgropar
  title: Köpare med röda flaggor<br />Lätt att hitta
  subtitle: Vanliga problem som undergräver köparens förtroende under fabriksrevisioner. Vi vänder oss proaktivt till var och en.
  items:
    - title: Filt CE-anspråk utan modellomfattning
      description: '"Alla produkter CE-certifierade" utan att specificera vilket direktiv, vilka modeller och vilken överensstämmelsemodul. Röd flagga: föreslår att efterlevnad är ytlig snarare än per modell, per konfiguration.'
      icon: tabler:alert-triangle
    - title: Inga fysiska testbevis
      description: 'Påståenden om trycktest utan testprotokoll, mätare eller teststation synliga på fabriksgolvet. Röd flagga: kvalitetspåståenden kan inte verifieras under besöket.'
      icon: tabler:alert-triangle
    - title: Spårbarhet för material saknas
      description: 'Inga partiregister, ingen inkommande inspektion eller ingen koppling mellan materialcertifikat och färdiga produkter. Röd flagga: inget sätt att spåra kvalitetsproblem till källan.'
      icon: tabler:alert-triangle
    - title: Generisk dokumentation
      description: 'En DoC som täcker alla modeller, inga HIN-specifika poster eller "mall"-dokument. Röd flagga: efterlevnaden är inte kopplad till enskilda produktionsenheter.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Frakt och förpackning
  title: Containerlastning och inpackning i trälådor<br />av RIB-båtar
  subtitle: Våra fraktlösningar skyddar din investering från Qingdao till destinationshamnen. Containerlastningsplaner och förpackningsspecifikationer tillgängliga för varje modell.
  items:
    - title: 20-fots containerkonfigurationer
      description: 'Standard 20-fots container: 1-2 RIB-båtar (4,0-5,5 m) nästlade med däck och tuber separerade, eller 8-12 SUP-brädor. Blandade RIB + SUP-konfigurationer tillgängliga. Detaljerad lastningsplan medföljer varje order.'
      icon: tabler:box
    - title: 40-fots containerkonfigurationer
      description: 'Standard 40-fots container: 2-4 RIB-båtar (upp till 7,0 m) med nästlade skrov och staplade tuber, eller 20-30 SUP-brädor. 40-fots HQ tillgänglig för högre RIB-modeller. Volymoptimerad förpackning minskar fraktkostnaden per enhet.'
      icon: tabler:container
    - title: Trälådor för RIB-skrov
      description: Aluminium- och GRP-skrov packade i specialtillverkade trälådor med skumdynor, fuktspärr och stålbandning. Lådmått och vikt per modell tillgängliga för logistisk planering. ISPM-15-certifiering av värmebehandlat trä ingår.
      icon: tabler:wood
    - title: Förpackning med separerade tuber och däck
      description: Tuber tömda och vikta separat från skroven för platsbesparing. Däcksplattor, konsoler och säten förpackade i skyddsfolie med monteringsbeslagskit. Monteringsinstruktioner medföljer varje leverans.
      icon: tabler:package
    - title: Skydd mot fukt och korrosion
      description: VCI-korrosionsskyddspapper för aluminiumkomponenter, kiseldioxid-torkpåsar och vakuumförseglade beslagspåsar. Förhindrar kondensskador under 30-45 dagars sjötransport.
      icon: tabler:droplet-off
    - title: FOB Qingdao-dokumentation
      description: Konossement, kommersiell faktura, packlista, ursprungsintyg och efterlevnadsdokumentation per leverans. FCL- och LCL-konsolidering tillgänglig. Stöd med tulldokumentation för EU-, USA- och Mellanösternmarknader.
      icon: tabler:file-text
faq:
  title: Fabriksrevision — Vanliga frågor
  questions:
    - q: Kan jag besöka fabriken personligen?
      a: Ja. Vi välkomnar fabriksrevisioner på plats på vår 12 000 m² stora anläggning i Qingdao. Vår standardtur omfattar 8 stationer från råvarulager till dokumentgranskningsrum. Virtuella fabriksrundturer via videosamtal är också tillgängliga för inledande kvalificering.
    - q: Accepterar du tredjepartsrevisioner (BSCI, SMETA, SGS)?
      a: Ja. Vi upprätthåller BSCI-certifiering (Intertek) och välkomnar kundspecifika revisionsprotokoll. Vi kan även ordna SGS- eller TÜV-besiktningar på begäran. Revisionsrapporter finns tillgängliga under NDA.
    - q: Kan jag se trycktestning under besöket?
      a: Vår tryckprovningsstation är en del av standardturen. Beroende på produktionsschemat kan du observera aktiva trycktester med mätaravläsningar och testprotokoll. Trycktestloggar per skrov finns alltid tillgängliga för granskning.
    - q: Hur hanterar du produkter som inte uppfyller kraven?
      a: Enheter som inte uppfyller kraven är åtskilda, dokumenterade och granskade enligt vår process för korrigerande åtgärder enligt ISO 9001. Grundorsaksanalys utförs, korrigerande åtgärder implementeras och register upprätthålls. Köpare kan granska vår NCR-logg under revisioner.
    - q: Vilken efterlevnadsdokumentation finns tillgänglig för granskning?
      a: 'Under revisionen kan du granska: modellspecifika DoC-prover, byggplåtsspecifikationer, HIN-register, utkast till ägarmanualer, tillämpliga standardlistor och överensstämmelsebedömningsposter per modellfamilj.'
    - q: Hur bokar jag en virtuell fabriksvisning?
      a: Kontakta vårt säljteam för att boka en livevideoturné via WhatsApp, Zoom eller Teams. Vi följer samma 8-stationsväg och kan fokusera på specifika områden utifrån dina intressen. En typisk virtuell rundtur är 45-60 minuter.
    - q: Är fabriken den faktiska tillverkaren eller ett handelsföretag?
      a: Aquafarer är den faktiska tillverkaren. Vi driver fabriken i Laixi, Qingdao. Affärslicens, tillverkningsomfattning och fysisk produktion är alla verifierbara under revisionen.
    - q: Vilka kvalitetsdokument kan jag granska?
      a: Inkommande materialinspektionsprotokoll, QC-kontrollpunkter pågående, trycktestloggar, 100-punkters slutinspektionschecklistor, avvikelserapporter, korrigerande åtgärder och spårbarhetsposter per skrov. Allt underhålls enligt ISO 9001-kraven.
cta:
