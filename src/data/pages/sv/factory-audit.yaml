      href: /contact
content_audit_evidence:
  tagline: Verifieringsbevis
  title: Granskningsbevis<br />Du kan verifiera på plats
  subtitle: Under fabriksbesök kan kunder verifiera specifika bevis vid varje produktionsområde. Här är vad du ska leta efter - och vad vi förbereder för varje revision.
  areas:
    - area: Råvarulager
      what_to_verify: Är materialen stabila? Finns det satsblandning?
      evidence: Inkommande inspektionsprotokoll, batchetiketter, FIFO-lagring, leverantörsgodkännandelista, materialcertifikat (PVC, Hypalon, glasfiber, aluminium, lim, hårdvara)
      icon: tabler:building-warehouse
    - area: Tubproduktion
      what_to_verify: Hur garanteras sömstyrka och lufttäthet?
      evidence: Processkort, första artikelbekräftelse, trycktestprotokoll per kammare, reparations- och omtestningsloggar, ventilinstallationsprotokoll
      icon: tabler:flame
    - area: Skrovproduktion
      what_to_verify: Hur kontrolleras strukturell konsekvens?
      evidence: Kontrollerade processdokument, kvalitetskontroller, numrering av halvfabrikat, gelcoattjockleksmätningar, verifiering av lamineringsschema
      icon: tabler:layers-subtract
    - area: Monteringsområde
      what_to_verify: Hur förhindras tillvalsdelar från felmontering?
      evidence: BOM, arbetsorder, konfigurationschecklistor, arbetsstationsinspektionskort, vridmoment och funktionskontroller per modell
      icon: tabler:tool
    - area: Teststation
      what_to_verify: Hur bekräftar du att båten är bra innan leverans?
      evidence: Testprocedurer, instrumentlista, kalibreringsprotokoll, trycktestloggar (1,25x / 24-48h), checklistor för funktionstest, dokumenterade kriterier för godkänt/underkänd
      icon: tabler:gauge
    - area: Avvikelseområde
      what_to_verify: Hur hanteras defekter?
      evidence: Isoleringsetiketter, NCR-loggar, rotorsaksanalys, omarbetningsgodkännandeposter, CAPA-spårning (Corrective and Preventive Action)
      icon: tabler:alert-triangle
    - area: Färdigvarulager
      what_to_verify: Hur förhindrar du felleveranser och skador?
      evidence: Färdiga produktetiketter, ordermatchningsregister, förpackningsstandarder, inspektionsprotokoll före leverans
      icon: tabler:box
    - area: Reservdelar och efterförsäljning
      what_to_verify: Kan du stödja långsiktig efterförsäljning?
      evidence: Gemensam reservdelslista, lagerstrategi, artikelnummersystem, garantiprocessdokumentation, underhållshandledningar
      icon: tabler:headset
content_closing_script:
  tagline: Revision att beställa
  title: Från fabriksbesök<br />till bekräftat projekt
  subtitle: En lyckad revision bör inte sluta med foton och ett handslag. Innan vi lämnar ser vi till att tre kommersiella resultat dokumenteras.
  items:
    - title: Bekräfta teknisk konfiguration
      description: Kom överens om modell, applikation, nyckelalternativ, målmarknad, beräknad kvantitet och leveransschema - allt dokumenterat före avresa.
      icon: tabler:checklist
    - title: Bekräfta dokument i nästa steg
      description: 'Definiera vad Aquafarer tillhandahåller härnäst: reviderad GA, konfigurationslista, offert, dokumentchecklista, exempelplan eller NDA – med specifika tidslinjer.'
      icon: tabler:file-plus
    - title: Bekräfta ömsesidig tidslinje
      description: Reviderad konfiguration och preliminär offert inom 3 arbetsdagar. Prov eller utseendebekräftelse inom 7 dagar. Teknisk granskning eller tredjepartsinspektion inom 14 dagar. Nästa mötesdatum och ansvariga parter låsta.
      icon: tabler:calendar

