faq:
  title: Vanliga frågor om paket
  questions:
    - q: Vad är den minsta beställningskvantiteten för paket?
      a: Klubbstartpaketet har minst 10 enheter. Resort- och varumärkespaket är anpassade efter dina behov med flexibla MOQs.
    - q: Hur lång tid tar leveransen?
      a: Standardproduktion är 30–45 dagar från orderbekräftelse. Snabbproduktion är tillgänglig mot en extra avgift.
    - q: Kan jag anpassa utrustningens färger och varumärke?
      a: Ja. Alla paket inkluderar fullständig anpassning – färger på kartonger, logotyper och förpackningsdesign.
    - q: Ger du support efter försäljning?
      a: Ja. Varje paket inkluderar tillgång till våra online underhållsguider, videohandledningar och reservdelsbeställningssystem.
