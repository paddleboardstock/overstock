content_benefits:
  tagline: Viktiga fördelar
  title: Varför Paddle Board Overstock för<br />Dykoperationer
  subtitle: Specialbyggda dyk-RIB:er som är betrodda av kommersiella dykcenter i 30+ länder — byggda för daglig drift, inte tillfällig användning.
  list:
    - Byggd för 200-300 driftdagar per år — inte en helgbåt, utan en daglig arbetsplattform
    - Hypalon eller militärklassade PVC rör — maximal hållbarhet i tropiska saltvattenmiljöer med UV-beständighet
    - Bred rördesign ger en stabil ombordstigningsplattform för dykare som är utrustade med - säkrare in- och utstigning för alla erfarenhetsnivåer
    - Däckslayout optimerad för utrustningens arbetsflöde - tankar, utrustning och passagerare har vart och ett dedikerat utrymme
