hero:
  tagline: Guider
  title: Ny på SUP?
  subtitle: Praktiska guider som hjälper dig att välja, använda och njuta av uppblåsbar vattensportutrustning.
size_guide:
  tagline: Storlek & Specifikationer
  title: Hitta rätt storlek för dina behov
  desc: Jämför produktdimensioner, viktkapacitet och rekommenderade användningsområden. Oavsett om du behöver en touring-SUP, en kompakt kajak eller en kommersiell RIB - vår storleksguide hjälper dig att välja rätt passform.
  link_label: Full storleksguide med produktspecifikationer →
  link: /size-guide
  cards:
    - title: SUP-brädor
      desc: Välj längd baserat på din vikt och avsedd användning. Bredare brädor (32"+) ger mer stabilitet. Längre brädor (11–12 fot) spår bättre för touring.
    - title: Kajaker
      desc: Enkelkajaker (9 fot) för soloresor och floder. Tandemkajaker (12 fot) för två paddlare eller en med redskap. Kontrollera alltid viktkapaciteten.
    - title: Jollar och RIB
      desc: Välj längd efter antal passagerare och användning. Större RIB (4,5 m+) för offshore och räddning. Mindre jollar (2,7 m) som tenderar och fiskeplattformar.
