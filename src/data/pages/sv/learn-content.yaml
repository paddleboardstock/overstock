materials:
  intro_p1: Prestanda, hållbarhet och säkerhet hos en uppblåsbar farkost beror nästan helt på materialen som används i dess tillverkning. Från tyget som formar tuberna till trådarna som ger en SUP-bräda dess styvhet — varje materialval påverkar hur produkten fungerar på vattnet och hur länge den håller.
  intro_p2: 'Den här guiden går igenom de fyra kärnmaterial som används i moderna uppblåsbara farkoster: PVC-tyg, Hypalon CSM-gummi, drop-stitch-kärnkonstruktion och EVA-skumdäck. Om du förstår dessa material kan du välja rätt produkt för dina behov och underhålla den för maximal livslängd.'
  labels:
    advantages: Fördelar
    limitations: Begränsningar
    best_for: 'Bäst för:'
  items:
    - name: PVC (polyvinylklorid)
      summary: Industristandarden för fritidsgummibåtar och SUP. Flerlagrat laminerat tyg erbjuder utmärkt förhållande mellan styrka och vikt till ett överkomligt pris.
      pros:
        - Prisvärt — 30-50 % billigare än Hypalon
        - Lätt och lätt att hantera
        - God UV-beständighet med riktiga beläggningar
        - Brett urval av färger och finish
        - Lätt att laga med PVC-lappar och lösningsmedelslim
      cons:
        - Kortare livslängd än Hypalon (7-10 år)
        - Mindre flexibel i kyla
        - Lägre kemikaliebeständighet
        - Kan utveckla mjukgörarmigration över tid
      best_for: Fritids-SUP, prisvärda båtar, hyrflottor, säsongsanvändning, sötvatten och kustmiljöer.
    - name: Hypalon (CSM-gummi)
      summary: Premiumgummi av syntetiskt material känt för exceptionell hållbarhet, UV-beständighet och lång livslängd. Guldstandarden för kommersiella och militära gummibåtar.
      pros:
        - Exceptionell UV- och ozonbeständighet
        - Livslängd på 15-20 år med rätt skötsel
        - Utmärkt flexibilitet i kallt väder
        - Överlägsen beständighet mot kemikalier och olja
        - Behåller färgen längre än PVC
      cons:
        - Väsentligt dyrare än PVC
        - Tyngre tygvikt
        - Färre färgalternativ
        - Reparationer kräver speciallim
        - Färre tillverkningsanläggningar i världen
      best_for: Kommersiella RIB, sök- och räddning, militära tillämpningar, tropiska klimat, långsiktig flottägande.
    - name: Drop-stitch-kärna
      summary: Tekniken som revolutionerade uppblåsbara SUP. Tusentals polyestertrådar förbinder tygets övre och undre lager, vilket möjliggör uppblåsning vid högt tryck för prestanda i nivå med en hård bräda.
      pros:
        - Extremt styv vid 12-20 PSI
        - Lätt — 18-30 lbs för en bräda i full storlek
        - Viks platt för förvaring och resor
        - Utmärkt stötmotstånd
        - Jämn prestanda över alla temperaturer
      cons:
        - Kräver högtryckspump
        - Lagning av punkteringar mer komplicerad än enkelväggig konstruktion
        - Högre tillverkningskostnad än standarduppblåsbara produkter
        - Tryckförlust över tid kräver periodisk påfyllning
      best_for: Stand-up paddle-brädor, kajaker, luftdäck till gummibåtar — alla tillämpningar som kräver styvhet med uppblåsbar portabilitet.
    - name: EVA-skumdäck
      summary: Slutencells-EVA-skum (eten-vinylacetat) som används för greppmattor på SUP-brädor och båtdäck. Ger dämpning, grepp och värmeisolering.
      pros:
        - Utmärkt halkfritt grepp vått som torrt
        - Dämpning minskar trötthet vid långa paddelturer
        - Värmeisolering mot kalla däckytor
        - UV- och saltvattenbeständig
        - Finns i flerfärgade kompositioner och lasergraverade mönster
      cons:
        - Kan slitas vid hård användning efter 2-3 år
        - Måste limmas korrekt för att undvika delaminering
        - Inte bärande — påverkar inte styvheten
        - Tillsätter lite vikt (200-400 g per bräda)
      best_for: SUP-däcksgrepp, båtdäckspolstring, kajaksitskomfort — alla ytor som kräver halkfritt stöd.
  selection:
    title: Guide för materialval
    subtitle: 'Välj rätt material utifrån ditt primära användningsområde:'
    headers:
      - Användningsområde
      - Rekommenderat material
      - Varför
    rows:
      - - Fritids-SUP-paddling
        - Drop-stitch PVC
        - Lätt, styv, prisvärd — idealisk balans för fritidspaddlare
      - - Familjebåt / sjöbåt
        - PVC (1100 denier)
        - Kostnadseffektiv, lätt att laga, tillräcklig hållbarhet för fritidsbruk
      - - Kommersiell RIB / patrullbåt
        - Hypalon CSM
        - Maximal UV-beständighet, livslängd på 15-20 år, kemikalie-/oljebeständighet
      - - Hyrflotta av SUP-brädor
        - Drop-stitch PVC + EVA-däck
        - Hållbar, lagbar, bra värde för användning med hög omsättning
      - - Sök- och räddningsinsatser
        - Hypalon CSM
        - Tillförlitlighet i extrema förhållanden, flexibilitet i kyla, kemikaliebeständighet
      - - Tur-/expeditionsfarkost
        - Drop-stitch PVC
        - Styv prestanda med packbar portabilitet för resor
  deep_dive:
    title: Fördjupningsguider
    topics:
      - title: Marin PVC
        desc: Flerlagrat lamineral PVC-tyg — UV-beständighet, slitageprovning och denier-värden förklarade.
      - title: PVC vs. Hypalon
        desc: Den definitiva jämförelsen av de två dominerande materialen för gummibåtar — kostnad, livslängd, UV-beständighet.
      - title: Drop-stitch-kärna
        desc: Hur tusentals interna trådar skapar styva högtrycksstrukturer vid 12-15 PSI.
      - title: HF-svetsningsteknik
        desc: Högfrekvenssvetsning skapar starka, jämna sömmar — hur det fungerar och varför det spelar roll.
      - title: PSI och prestanda
        desc: Varför lufttryck spelar roll för uppblåsbara SUP och båtar — styvhet, lastkapacitet och komfort.
      - title: Kvalitetstestning
        desc: Trycktester, flytkraftstester, UV-åldrande och destruktiva tester — vår kvalitetsprocess.
      - title: EVA-skumdäck
        desc: Däckmattor av slutencells-EVA-skum — grepp, komfort och hållbarhet för SUP- och båtdäck.
      - title: Materialvård
        desc: Rengöring, UV-skydd, mögelförebyggande och bästa praxis för förvaring av uppblåsbara produkter.
