articles:
  sup:
    - title: SUP-grunderna — nybörjarguide
      desc: 'Allt en nybörjare behöver veta: brädtyper, paddelstorlek, ställning och tips för första dagen.'
    - title: SUP-storleksguide
      desc: Hitta rätt längd, bredd och volym för din vikt, din nivå och din paddelstil.
    - title: Uppblåsbar eller hård bräda
      desc: Vilken passar dig? Portabilitet, prestanda, hållbarhet och kostnad i jämförelse.
    - title: Avancerade tekniker
      desc: Förbättra din paddling med avancerade paddeltag, svängtekniker och hantering på grovt vatten.
    - title: Så väljer du en uppblåsbar SUP
      desc: De viktigaste faktorerna — konstruktion, tjocklek, fenauppsättning och medföljande tillbehör.
    - title: Vattensäkerhet
      desc: 'Viktig säkerhetskunskap: väderläsning, val av flytväst (PFD), självräddning och paddling i grupp.'
  inflatable-boat:
    - title: Materialreferens
      desc: PVC, Hypalon, drop-stitch, denier-värden — förstå vad din uppblåsbara utrustning är gjord av.
    - title: PVC vs. Hypalon
      desc: Den definitiva jämförelsen av PVC- och Hypalon-tyger för gummibåtar — hållbarhet, UV-beständighet och kostnad.
    - title: Drop-stitch-kärnan förklarad
      desc: Hur tusentals interna trådar skapar en styv plattform vid 12-15 PSI för högpresterande uppblåsbara SUP.
    - title: Översikt över uppblåsbar teknik
      desc: Hur gummibåtar och SUP byggs — från materialuppbyggnad till ventsystem och svetsning av sömmar.
    - title: Guide för rigid inflatable boats (RIB)
      desc: Allt om RIB-konstruktion, skrovtyper, tubmaterial och val av rätt RIB för dina behov.
    - title: Gummibåt vs RIB
      desc: De viktigaste skillnaderna mellan traditionella gummibåtar och båtar med styvt skrov för olika användningsområden.
  water-safety:
    - title: Vattensäkerhetsguide
      desc: Viktig säkerhetskunskap för varje paddlare — väder, flytvästar (PFD), självräddning och protokoll för gruppaddling.
    - title: Flytvästs- och PFD-guide
      desc: Så väljer du rätt flythjälp för SUP, kajak, båt och professionellt bruk.
    - title: SUP-säkerhetschecklista
      desc: Säkerhetschecklistan före sjösättning som alla stand-up paddleboardare bör följa.
    - title: Säker paddling i kallt vatten
      desc: Viktiga försiktighetsåtgärder, utrustning och tekniker för paddling i kallt vatten.
    - title: Nybörjarmisstag vid paddling
      desc: Vanliga misstag bland förstagångspaddlare och hur du undviker dem för en säkrare och trevligare upplevelse.
    - title: CE-certifiering förklarad
      desc: Vad CE-certifiering innebär för uppblåsbara vattenfarkoster — standarder, tester och varför det spelar roll för säkerheten.
