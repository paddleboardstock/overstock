  tagline: Om oss
  title: 'Om {SITE}'
  subtitle: Vertikalt integrerad tillverkare av vattenutrustning — från råmaterial till färdig båt

intro:
  - 'Aquafarer grundades 2012 med ett enda uppdrag: att designa och tillverka vattenutrustning som fungerar lika bra på vattnet som i kvalitetsrapporten. Det som började som en verkstad inriktad på SUP-brädor har vuxit till en 12 000 kvm integrerad produktionsanläggning i Qingdags ekonomiska utvecklingszon, som tillverkar gummibåtar, RIB-båtar, kajaker, SUP-brädor, säkerhetsutrustning och tillbehör för kunder i över 50 länder.'
  - Idag verkar Aquafarer som ett fabriksmärke — vi designar, konstruerar, prototypar, producerar och testar allt under ett tak. Denna vertikala integration ger oss direkt kontroll över materialval, utförandekvalitet och leveranstider. Varje båt byggs av vårt folk, på vår utrustning, enligt våra standarder.
  - Vi betjänar fritidsanvändare, kommersiella operatörer, statliga myndigheter och varumärkespartners världen över. Våra OEM- och ODM-program hjälper företag att lansera egna produktlinjer utan att investera i fabriksinfrastruktur. Oavsett om du behöver en enstaka prototyp eller en full produktionsserie, guidad vårt team dig från koncept till sjöfärdig leverans.

