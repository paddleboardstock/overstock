values:
  - title: Kvalitet först
    desc: Varje båt som lämnar vår fabrik genomgår obligatoriska tester av lufttäthet, sömmens hållfasthet och system före leverans.
  - title: Vertikal integration
    desc: Vi kontrollerar varje steg — från PVC-skärning till slutmontering — vilket eliminerar underleverantörers ineffektivitet och säkerställer jämn kvalitet.
  - title: Säkerhet som standard
    desc: 'CE-certifiering är kärnan i det vi bygger. Våra 64 CE-certifierade modeller uppfyller EU:s säkerhetsnormer för fritids- och kommersiellt bruk.'
  - title: Partnerfokuserad
    desc: Vi bygger långsiktiga relationer med OEM-, ODM- och private label-partner genom transparens, tillförlitlighet och gemensam utveckling.

services:
  - title: OEM-produktion
    desc: Vi tillverkar enligt dina specifikationer. Dela dina ritningar så hanterar vårt ingenjörsteam prototyper, verktyg och produktion.
  - title: ODM-lösningar
    desc: Börja med våra beprövade designplattformar. Anpassa storlek, färg, grafik och förpackning för att skapa en unik produktlinje.
  - title: Private Label
    desc: Ditt varumärke, din logotyp, din förpackning. Produkterna anländer redo för försäljning med full varumärkesintegration.
  - title: Anpassad branding
    desc: Däcktryck, skrovgrafik, tubdekaler och anpassade etiketter — en enhetlig varumärkesnärvaro på varje yta.

certifications:
  - name: CE-certifikat
    desc: Våra båtar och vattenfarkoster uppfyller EU-direktivet för fritidsbåtar (2013/53/EU) och relevanta harmoniserade standarder.
    scope: Båtar och vattenfarkoster
  - name: ISO 9001
    desc: Kvalitetsledningssystem certifierat för design, produktion och distribution av uppblåsbara fartyg.
    scope: Hela anläggningen
  - name: ISO 6185
    desc: Gummibåtar — säkerhets- och prestandakrav för förstärkta och stela gummibåtar.
    scope: RIB- och gummibåtslinjer

