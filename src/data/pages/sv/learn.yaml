      href: '/learn/sup'
    - title: 'Uppblåsbart vs hårt bräde'
      description: 'Vilket är rätt för dig? Vi jämför bärbarhet, prestanda, hållbarhet och kostnad sida vid sida.'
      icon: 'tabler:arrows-left-right'
      href: '/compare/inflatable-vs-hardboard'
    - title: 'Vattensäkerhet'
      description: 'Viktig säkerhetskunskap varje paddlare bör ha — väder, flytvästar, självräddning och mer.'
      icon: 'tabler:shield'
      href: '/learn/water-safety'
    - title: 'Materialguide'
      description: 'PVC vs Hypalon, drop-stitch-teknik, denier-klassificeringar — förstå vad din utrustning är gjord av.'
      icon: 'tabler:hexagons'
      href: '/learn/materials'
    - title: 'SUP-storleksguide'
      description: 'Hitta rätt brädlängd, -bredd och -volym för din vikt, skicklighet och paddelstil.'
      icon: 'tabler:ruler'
      href: '/size-guide'
