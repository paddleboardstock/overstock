hero:
  tagline: 'Vattenutforskningskunskap'
  title: 'Lär dig'
  subtitle: |
    Guider, handledningar och djupdyk — allt du behöver för att utforska<br />
    vatten med förtroende. Från att välja ditt första SUP till att bemästra avancerade tekniker.
  taglineSection: 'Kunskap för varje paddlare. Från nybörjare till professionell.'

featured:
  tagline: 'Utvalda ämnen'
  title: 'Börja din inlärningsresa'
  subtitle: 'Oavsett om du är ny inom vattensport eller vill ta dig till nästa nivå, våra guider täcker dig.'
  items:
    - title: 'SUP-grunderna'
      description: 'Allt en nybörjare behöver veta — brädtyper, paddelstorlek, hållning och första dagens tips.'
