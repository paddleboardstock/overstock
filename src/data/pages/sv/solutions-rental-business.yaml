      - title: Lagringslösningar
        description: Uppblåsbar utrustning packas platt — ingen båtbrygga eller trailer krävs för förvaring
      - title: Säkerhetsöverensstämmelse
        description: All utrustning CE-certifierad med kommersiell konstruktion för daglig uthyrning
      - title: Nybörjarmarknadsföring
        description: Märkesfotografitillgångar och mallar för hyrmeny som hjälper dig att lansera din tjänst
    cta_text: Start Rental Fleet
    cta_href: /contact
  - title: Expansionskit för fordonsflotta
    subtitle: För odlingsverksamhet som ökar kapacitet och variation
    badge: Premium
    features:
      - title: Design för blandad flotta
        description: Kombination av SUPs, kajaker, uppblåsbara båtar och RIB:s för att tjäna olika gästpreferenser
      - title: Volymprissättning
        description: Delad grossistprissättning för flottor på 20+ enheter med förmånliga logistikpriser
      - title: Anpassad marknadsföring
        description: Logotyptryck på utrustning, märkesvaror flytvästar och anpassade färgalternativ för din hyrflotta
      - title: Underhållsprogram
        description: Reservdelssats, reparationsutbildning för personal och direkt tillgång till teknisk support
      - title: Intäktsoptimering
        description: Datadrivna rekommendationer om prissättning, utrustningsrotation och säsongsanpassningar av flottan
    cta_text: Scale My Fleet
    cta_href: /contact
