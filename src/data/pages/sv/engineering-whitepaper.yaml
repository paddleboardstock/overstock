        pvc: 5–8 år
        hypalon: 10–15 år
      - property: Färgomfång
        pvc: Brett (fullt färgspektrum)
        hypalon: Begränsad (grundfärger)
      - property: Kemisk beständighet
        pvc: Bra (bränsle-/oljebeständiga kvaliteter)
