section_faq:
  title: Tekniska vanliga frågor
  questions:
    - q: Hur jämförs drop-stitch med traditionell hårdskalkonstruktion?
      a: Moderna drop-stitch-kärnor vid 20 PSI uppnår 85–90 % av styvheten hos jämförbara EPS-skum/glasfiberhårda skal, samtidigt som de är helt tömbara för transport. Avvägningen är något högre vikt och lägre ultimat styvhet - men för de flesta rekreations- och kommersiella tillämpningar är skillnaden försumbar.
    - q: Vilken trådtäthet anses vara premiumkvalitet?
      a: Premiumtyger med droppstygn använder 2 trådar per kvadrattum (cirka 3 100 trådar per m²) vävda av 1 680 DTEX polyestergarn. Tyger för nybörjare använder 1 tråd per kvm med 1 100 DTEX-garn.
    - q: Kan Hypalon svetsas som PVC?
      a: Nej. Hypalon/CSM kan inte RF-svetsas. Den måste monteras med handapplicerat kontaktcement, vilket gör produktionen mer arbetsintensiv och sömmarna beroende av operatörens skicklighet. PVC kan RF-svetsas eller varmluftssvetsas för konsekvent, automatiserad sömkvalitet.
    - q: Vilket är det maximala säkra trycket för gummibåtar?
      a: Standard uppblåsbara båtrör fungerar vid 8–12 PSI. Drop-stitch-golv arbetar med 12–20 PSI. Högtryckssömskärnor (SUP) kan arbeta vid 20–25 PSI. Varje produkt inkluderar tryckavlastningsventiler som är kalibrerade för att förhindra överuppblåsning.
    - q: Hur lång tid tar det att tillverka en anpassad uppblåsbar båt?
      a: Standard OEM-produktion pågår 30–45 dagar från orderbekräftelse till FOB Qingdao. Anpassad formutveckling lägger till 15–20 dagar för prototypproduktion och testning.
