        pvc: Bra
        hypalon: Mycket bra
      - property: Draghållfasthet
        pvc: 3 000–5 000 N/5 cm
        hypalon: 2 500–4 000 N/5 cm
      - property: Vikt per m²
        pvc: 850–1 200 g
        hypalon: 1 100–1 500 g
      - property: Kall Flex
        pvc: -30 °C
        hypalon: -20 °C
      - property: Sammanfogningsmetod
        pvc: RF-svetsning / Varmluftssvetsning
        hypalon: Handlimning (kontaktcement)
