section_testing:
  title: Test- och säkerhetsprotokoll
  subtitle: Paddle Board Overstocks kvalitetssäkringsramverk för varje produktionsbatch
  protocols:
    - title: 1,25x nominellt tryckhållningstest
      description: Varje sammansatt kärl blåses upp till 1,25x dess nominella arbetstryck och hålls i 24–48 timmar. Varje tryckfall som överstiger 2 % utlöser avstötning och omarbetning.
      standard: ISO 6185
    - title: Sömmens skalhållfasthetstest
      description: Svets- och limsömprover från varje produktionssats testas med avseende på fläkhållfasthet med hjälp av kalibrerad spänningsutrustning. Minst 4 kN/m skalningsmotstånd krävs.
      standard: ISO 2411
    - title: Tygets dragprov
      description: Inkommande tygrullar genomgår draghållfasthets- och töjningstest i både varp- och väftriktningar. Avslagströskel under 3 000 N/5cm för PVC.
      standard: ISO 1421
    - title: UV-accelererad vittring
      description: Materialprover utsätts för 1 000+ timmars accelererad UV-exponering i QUV-testkammare. Max 15 % draghållfasthetsförlust tillåten.
      standard: ASTM G154
    - title: Ventil- och passningsintegritet
      description: Varje ventilenhet testas för tätningsintegritet vid 1,25x märktryck. Återläckageventiler är testade för envägstätningsprestanda.
      standard: ISO 12402
