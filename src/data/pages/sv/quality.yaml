tests:
  - title: Tryckprovning
    standard: ISO 6185-1 | Intern spec AF-PT-001
    description: Uppblåsbara kammare trycksätts till 1,25x den rekommenderade driftsgränsen och hålls i 30 minuter. Tryckavfallet mäts för att validera lufttäthet och strukturell integritet hos material och sömmar.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
  - title: Slagprovning
    standard: Intern Spec AF-IT-002
    description: Produkterna utsätts för kontrollerade stötar från standardiserade fallvikter och pendelapparater. Detta bedömer punkteringsmotstånd, rivutbredning och strukturell motståndskraft mot kollisioner med hinder, bryggor och skräp.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
  - title: UV-beständighetstestning
    standard: ASTM G154 | ISO 4892-3
    description: Materialprover exponeras för UVA-340-lampor i accelererade väderkammare i 1 000+ timmar. Vi mäter färgförändring (Delta E), glansretention och draghållfasthetsförlust för att validera UV-stabilisatorpaket.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
  - title: Test av nötningsbeständighet
    standard: ASTM D751 (Taber) | ISO 5470-1
    description: Materialprover utsätts för CS-10 slipskivor under 500 g/1 000 g belastningar under 1 000 cykler. Massförlust och visuell slitagegradering bestämmer beläggningens hållbarhet mot sand, grus och upprepad sjösättning.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pvc-material-testing.webp
  - title: Prestandatestning vid låg temperatur
    standard: Intern Spec AF-LT-003 | MIL-STD-810G
    description: Sammansatta produkter och materialkuponger konditioneras vid -20°C, -10°C och 0°C i 24 timmar och flextestas sedan. Vi verifierar att PVC och Hypalon förblir flexibla utan att spricka eller delaminera.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-exterior.webp
  - title: Flytkrafts- och lastkapacitetstestning
    standard: ISO 6185-1 | ISO 12402
    description: Produkter laddas stegvis till 1,25x nominell kapacitet i en kontrollerad pool. Fribord, stabilitet och självdränerande prestanda registreras. Varje modells nominella kapacitet är matematiskt och empiriskt verifierad.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-stock-boat-inventory.webp
  - title: Manövrerbarhetstestning
    standard: Intern spec AF-MT-004
    description: Försök på vatten mäter svängradie, acceleration, hyvlingstid och paddel/motorrespons över en rad belastningsförhållanden. Verkliga hanteringsegenskaper valideras mot designmål.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-dolphin-wave-1.webp
  - title: Vattentäthetsprovning
    standard: ISO 6185-1 §7.3 | Intern spec AF-WT-005
    description: Varje sammansatt produkt är spraytestad vid 0,5 bar på alla sömmar, ventiler och kopplingar. Ett 5 minuters trycksatt nedsänkningstest validerar kammarens och ventilens vattentäthet. Nollläckagestandard före frakt.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department-2.webp
