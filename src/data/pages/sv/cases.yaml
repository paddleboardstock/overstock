features3_cases:
  tagline: Utvalda fall
  title: Anpassade lösningar<br />För riktiga utmaningar
  isBeforeContent: false
  columns: 3
  items:
    - title: Bali Diving Center Uppgradering av daglig drift
      customer: Blue Ocean Diving Center
      country: Indonesien
      industry: Kommersiellt dykcenter
      challenge: Blue Ocean Diving Centre på Bali drev en äldre dykbåt av glasfiber med begränsat däcksutrymme, svår ombordstigning och högt underhåll i tropiska saltvattenförhållanden. Utrustningslastningen var trång, förberedelsetiden var lång och den instabila plattformen skapade säkerhetsproblem för internationella turister - inklusive förstagångsdykare och äldre resenärer. Centret kör 3-5 dykturer dagligen, 200+ dagar per år.
      solution: Paddle Board Overstock levererade en anpassad 6,8 ​​m Professional Diving RIB med utökad däckslayout optimerad för förvaring av dykutrustning, bred dykstege i rostfritt stål, kraftiga Hypalon-rör för UV- och saltvattenbeständighet, halkfri däckyta och tankförvaringslösning. Konfigurationen utformades kring dykcentrets dagliga arbetsflöde — inte baserad på en standardlayout för fritidsbåtar.
      product: 6,8 m professionell dykning RIB
      results: Större arbetsområde förbättrade utrustningens förberedelseeffektivitet. Dykare upplevde säkrare och enklare ombordstigning. Underhållskraven minskade avsevärt. Centret fick kapacitet att hantera fler kunder under högsäsong med större förtroende. RIB blev grunden för daglig dykning.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Vår dykbåt är inte bara transport. Det är grunden för vår dagliga verksamhet. Paddle Board Overstock RIB ger vårt team mer självförtroende när vi kör flera dykturer varje dag.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center Professional RIB Uppgradering
      customer: Ocean Explorer dykcenter
      country: Thailand
      industry: Kommersiellt dykcenter
      challenge: Ocean Explorer Diving Center i Phuket, Thailand, behövde uppgradera från en traditionell dykbåt i glasfiber som inte kunde hålla jämna steg med kundernas växande efterfrågan. Begränsat däcksutrymme gjorde utrustningsförberedelser ineffektiva. Svår ombordstigning skapade säkerhetsutmaningar för internationella turister. Höga underhållskrav i tropiska saltvattenförhållanden ökade driftskostnaderna. Centret driver flera dagliga resor, 200+ dagar per år.
      solution: Paddle Board Overstock levererade en skräddarsydd 6,8 ​​m kommersiell dykning RIB med optimerad arbetsdäckslayout för förvaring av dyktankar, förberedelse av utrustning och dykarrörelse. Funktionerna inkluderar bred dykstege med ledstänger i rostfritt stål, kraftig rörkonstruktion med UV-beständiga material, halkfria golv, tankförvaringslösning, professionell konsol och passagerarsäten – allt konfigurerat för kommersiella dykoperationer.
      product: 6,8 m kommersiell dykning RIB
      results: Större däcksyta möjliggjorde snabbare utrustningsorganisation och effektivare dagliga arbetsflöden. Kundernas ombordstigningskomfort och säkerhet förbättrades avsevärt. Underhållsavbrottstiden minskade med konstruktion av marinkvalitet. Dykcentret skulle kunna betjäna fler kunder under högsäsong och utöka professionella dyktjänster med tillförsikt.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: För ett dykcenter är båten inte bara transport. Det är en viktig del av vår dagliga verksamhet. Paddle Board Overstock RIB ger vårt team förtroende att köra flera dykturer varje dag med bättre säkerhet och effektivitet.
      icon: tabler:lifebuoy
    - title: Flotta för European Diving Center
      customer: BlueMed dykcenter
      country: Grekland
      industry: Dykning & marin turism
      challenge: Kräver 12 dykkonfigurerade RIB:er för en kedja av dykcenter över flera grekiska öar. Varje båt behövde anpassad dykstege, tankförvaring för 8 tankar och stabil plattform för dykarinträde i öppet vatten. Flottan behövde anlända inom 60 dagar för att starta turistsäsongen.
      solution: Tillverkade 12 RIB 520 dykmodeller med integrerade tankställ, dykstegar och extra breda Hypalon-rör för stabilitet vid ombordstigning. Varje båt var märkt med kundflottans färg. Alla 12 båtar trycktestade och skickades från Qingdao inom 55 dagar.
      product: RIB 520 Dyk
      results: Alla 12 båtar levererade i tid för turistsäsongen. Flottan har varit i daglig drift i 18+ månader med noll materialfel. Kunden beställde ytterligare 6 enheter under år två.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB 520 Dive har varit ryggraden i vår dagliga dykning. Stabiliteten i vila är utmärkt, och tankförvaringslayouten håller däcket rent och säkert för våra gäster.
      icon: tabler:lifebuoy
    - title: OEM-program för australisk distributör
      customer: Pacific Watersports Pty Ltd
      country: Australien
      industry: OEM/ODM Tillverkning
      challenge: Den australiensiska distributören behövde ett sortiment av privata märken SUP till konkurrenskraftiga priser för att konkurrera med kinesiska direkt-till-konsumentmärken. Krävs 8 unika modeller som täcker nybörjare till avancerade, med anpassad grafik, anpassad förpackning och leverans till återförsäljare.
      solution: Utvecklade 8 SUP-modeller (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) med exklusivt australiensiskt grafikpaket. Anpassad detaljhandelsförpackning med QR-koder som länkar till installationsvideor. Drop-ship logistik konfigurerad från Qingdao direkt till australiska butiker.
      product: Custom SUP Line (8 modeller)
      results: Koncept till första leverans på 90 dagar. Återförsäljningsgrad på 85 % under första säsongen. Distributören utökade partnerskapet till att omfatta en uppblåsbar båtlinje under år två.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock levererade en komplett SUP-linje på 90 dagar — från första design till butiksgolv. Kvaliteten matchar märken som säljer till dubbelt så mycket pris.
      icon: tabler:arrows-exchange
    - title: Mellanöstern Rescue Boat Supply
      customer: Nationella civilförsvarsmyndigheten
      country: Förenade Arabemiraten
      industry: Sök & räddning
      challenge: Civilförsvarsorganisationen behövde 20 patrullklara RIB:er för kustsökning och räddning, hamnsäkerhet och översvämningsbekämpning. Nödvändiga självräddande däck, kompletta navigeringssviter (GPS, radar, VHF), orangea rör med hög synlighet och överensstämmelse med lokala sjöfartsregler.
      solution: Levereras 20 RIB 450 Patrol-modeller med självlåsande däck, Garmin-navigationssviter, LED-strålkastare, SOLAS reflekterande tejp och orange Hypalon-rör med hög synlighet. Varje båt var CE-certifierad och testad enligt ISO 6185 standarder. Dokumentationspaketet inkluderade överensstämmelsecertifikat för lokal registrering.
      product: RIB 450 Patrull
      results: Flotta utplacerad över 5 kuststationer. Båtar har varit i drift i extrem värme (45°C+) utan nedbrytning av röret. Patrullräckvidden och bränsleeffektiviteten överskred specifikationerna med 12 %.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: RIB 450 Patrol överträffade våra operativa krav. Under extrema värmeförhållanden visar Hypalon-rören inga tecken på UV-nedbrytning efter 24 månaders daglig användning.
      icon: tabler:alert-triangle
    - title: Europeiskt OEM varumärkespartnerskap
      customer: North Sea Marine Equipment BV
      country: Nederländerna
      industry: OEM/ODM Tillverkning
      challenge: Etablerat europeiskt marint varumärke ville expandera till RIB-marknaden utan att investera i tillverkningsanläggningar. Behövde en white-label-partner som kan producera 5 RIB-modeller (3,9 till 6,2 m) med privat varumärke, CE-certifiering och exklusiva EU-distributionsrättigheter.
      solution: Etablerat white-label tillverkningsavtal för 5 RIB modeller. Varje modell märkes med kundlogotyper och färgschema. CE certifieringsdokumentation utarbetad för varje modell. Exklusiva EU-distributionsrättigheter beviljade med minimiorderåtaganden. Teknisk dokumentation och reservdelskatalog tillhandahålls för lokalt servicenätverk.
      product: Custom RIB Line (5 modeller)
      results: Flerårigt avtal undertecknat. Första produktionskörningen på 50 enheter skickas inom 75 dagar. Varumärke lanserat på METSTRADE med positivt återförsäljarmottagande.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Att arbeta med Paddle Board Overstock gjorde det möjligt för oss att komma in på RIB-marknaden utan att bygga en fabrik – de levererade en komplett nyckelfärdig lösning med CE-certifiering och återförsäljarsupportdokumentation.
      icon: tabler:building
    - title: Karibisk resortflotta
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Marin turism och gästfrihet
      challenge: 'Lyxresort behövde en komplett flotta av vattensportutrustning för gästaktiviteter: 40 SUP brädor för guidade turer, 20 kajaker för lagunutforskning, 10 uppblåsbara båtar för gästtransfer och fiskeutflykter, plus tillbehör. All utrustning behövde anpassad resort-märke och måste levereras före högsäsong.'
      solution: 'Producerat komplett vattensportpaket: 40 SUP Voyager-brädor (All-Around-modell), 20 Explorer-kajaker, 10 AirDeck 360 uppblåsbara båtar, plus PFD, paddlar, pumpar och reparationssatser. All utrustning tryckt med resortlogotyp och tropiskt färgschema. Containerförsändelse med fullständigt lagermanifest.'
      product: Komplett vattensportpaket (70+ enheter)
      results: Flottan anlände 6 veckor före högsäsong. Betygen för gästtillfredsställelse för vattensportaktiviteter ökade med 40 % jämfört med föregående år. Utrustningen har hållit i 3 säsonger med endast rutinunderhåll.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Den kompletta paketlösningen innebar att vi fick allt vi behövde i en och samma försändelse – brädor, kajaker, båtar och tillbehör, alla märkta och redo för gästanvändning. Våra gäster älskar utrustningens kvalitet.
      icon: tabler:beach
    - title: Queensland Commercial Diving Center RIB Uppgradering
      customer: Kommersiellt dykcenter
      country: Australien
      industry: Kommersiell dykning och marina tjänster
      challenge: Ett kommersiellt dykcenter i Queensland som specialiserat sig på inspektion av marin infrastruktur, hamnunderhåll och undervattensreparationsprojekt drev en åldrande arbetsbåt. När efterfrågan på projekt växte blev det gamla fartyget en skyldighet - frekvent underhåll orsakade schemaläggningsstörningar, layouten var inte designad för modern dykning (begränsat utrymme för cylindrar, verktyg och utrustning), och besättningens komfort under långa operationer var dålig. Företaget behövde ett fartyg som kunde stödja deras professionella verksamhet varje arbetsdag.
      solution: Paddle Board Overstock genomförde en detaljerad operativ analys av kundens dykningsarbetsflöde, typiska projektlängd, besättningsstorlek och utrustningskrav. Baserat på denna analys, levererade Paddle Board Overstock en skräddarsydd professionell RIB med en funktionell däckslayout optimerad för utrustningsförberedelser och dykarrörelser, professionella sittplatser för längre transportperioder, förbättrad stabilitet för säkrare in- och urstigning för dykare och dykstödsfunktioner integrerade i designen.
      product: Anpassad professionell dykning RIB
      results: Den nya RIB blev en pålitlig daglig arbetsplattform. Utrustningsförberedelserna blev snabbare med den optimerade layouten. Besättningen rapporterade förbättrad komfort och säkerhet under långa operationer. Båtens professionella utseende stärkte kundernas förtroende när de arbetade med hamnoperatörer och marina entreprenörer. Dykcentret fick ett fartyg som matchade professionalismen i deras tjänst.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Vi behövde en båt som kunde stödja vår verksamhet varje dag, inte bara ett fartyg för transport. Paddle Board Overstock arbetade med oss ​​för att förstå våra operativa krav och levererade en RIB-lösning som passar vårt arbetsflöde för kommersiell dykning.
      icon: tabler:lifebuoy
    - title: USA:s kustpatrullkontrakt
      customer: Atlantens kustsäkerhetsbyrå
      country: USA
      industry: Sjösäkerhet och brottsbekämpning
      challenge: Den amerikanska kustsäkerhetsmyndigheten krävde tunga patrull-RIB:er för avlyssningsoperationer på öppet vatten. Behövs tvåmotorskonfiguration för redundans, pansarkonsol för besättningsskydd, militärspecifik elektronik (krypterad kommunikation, FLIR, radar) och överensstämmelse med US Coast Guards regler.
      solution: Konstruerad RIB 600 Patrol med dubbla 115 HP utombordare, pansarkonsol med ballistiskt skydd, FLIR-värmebilder, krypterad VHF/UHF-kommunikation och integrerade vapenmonteringspunkter. Skrov förstärkt för höghastighetsavlyssningsmanövrar. All elektronik integrerad och testad på fabrik. USCG dokumentation om överensstämmelse tillhandahålls.
      product: RIB 600 Patrull (tvåmotorig)
      results: Båtar uppnådde 52 knops toppfart under acceptansförsök. Byrån rapporterade 95 % missionsberedskap under de första 12 månaderna. Ytterligare beställning för 8 enheter.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Den tvåmotoriga RIB 600 ger våra besättningar den hastighet och redundans som krävs för avlyssningsoperationer i öppet vatten. Den bepansrade konsolen ger kritiskt skydd utan att kompromissa med prestanda.
      icon: tabler:shield
