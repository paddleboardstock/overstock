hero:
  tagline: Kunskapsgraf
  title: Vattenutforskningskunskap
  subtitle: |
    En strukturerad kunskapsbas som täcker uppblåsbar SUP-teknik,<br />
    vattensäkerhet, båtteknik och äventyrsplanering.
  taglineSection: Utforska. Lär dig. Gå med förtroende.
clusters:
  tagline: Kunskapskluster
  title: Utforska efter ämne
  subtitle: Djupdyk i tekniken, säkerheten och färdigheterna bakom varje Aquafarer-produkt.
  items:
    - title: SUP-kunskap
      description: Från att välja ditt första bräde till avancerade turtekniker — allt om paddleboarding.
      icon: tabler:lifebuoy
      topics:
        - Hur du väljer ditt första uppblåsbara SUP
        - Bästa SUP-storleken för nybörjare
        - Hur svårt är paddleboarding?
        - Jämförelse uppblåsbart vs hårt bräde
        - SUP-säkerhetschecklista
    - title: Båtkunskap
      description: Tekniska guider om uppblåsbara båtar, RIB, jollar och kajaker — teknik, material och drift.
      icon: tabler:sailboat
      topics:
        - Uppblåsbara båttyper förklarade
        - PVC vs Hypalon jämförelse
        - RIB vs Jolle jämförelse
        - Drop-stitch-teknik djupdyk
        - Marin materialvetenskapsguide
    - title: Säkerhetskunskap
      description: Viktig säkerhetskunskap för varje paddlare — från PFD-val till väderavläsning till självräddningstekniker.
      icon: tabler:shield
      topics:
        - SUP-säkerhetschecklista
        - Behöver du en flytväst?
        - Säkerhetsguide för havspaddling
        - Flodsäkerhet för uppblåsbara kajaker
        - Medvetenhet om väder och vattenförhållanden
    - title: Teknologi
      description: Ingenjörskonsten bakom Aquafarer-produkter — material, konstruktionsmetoder och kvalitetstestning.
      icon: tabler:microscope
      topics:
        - Marin-grade PVC-teknik
        - Drop-stitch-kärna förklarad
        - Varför PSI spelar roll för uppblåsbara SUP
        - RF-svetsning vs limbindning
        - Kvalitetstestning och certifiering
    - title: Business Knowledge
      description: Kommersiella guider för att bygga och skala din vattensportverksamhet — från uthyrningsverksamhet till egna märkesvaror.
      icon: tabler:briefcase
      topics:
        - Hur man startar en SUP uthyrningsverksamhet
        - Att bygga ett vattensportcenter
        - Paddelbrädes flottstorlek för klubbar
        - Uppblåsbar vs hård SUP för kommersiellt bruk
        - Bästa kajakmaterialet för uthyrningsflottor
        - Startar ett eget varumärke för vatten
        - Intäktsstrategier för resortvattensporter
        - Underhållsguide för kommersiell utrustning
