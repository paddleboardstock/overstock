testimonial:
  content: Aquafarer designade och utrustade hela vårt strandaktivitetsprogram i tre resortfastigheter. 80 SUP, 40 kajaker, säkerhetsinfrastruktur och personalutbildning – allt levererat i en försändelse. Vårt gästdeltagande i vattenaktiviteter ökade med 60 % under den första säsongen.
  name: Sophie Laurent
  title: Direktör för gästupplevelse, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Resort profiler
  title: Waterfront Hospitality Solutions<br />Efter fastighetstyp
  subtitle: Varje resortfastighet har en unik gästprofil, aktivitetsmix och operativ rytm – från ekologer i boutiquestil till vidsträckta lyxresorter vid stranden. Vi designar vattensportprogram som matchar fastighetsklassen och gästernas förväntningar.
  items:
    - title: Lyxiga resorter vid stranden
      subtitle: VIP-transfer, vattenaktiviteter, premium gästupplevelse
      description: High-end strandfastigheter – Four Seasons, Aman och liknande lyxgrupper – där vattensporter är en tältgästbekvämlighet som driver tillfredsställelseresultat och tillhörande intäkter. Flottan måste se premium ut, erbjuda variation över åldersgrupper och förmågasnivåer och integreras sömlöst med resortens befintliga concierge- och bokningssystem. Förväntningarna på gästens utseende är extremt höga - utrustningens skick och presentation påverkar direkt 5-stjärniga recensioner.
      features:
        - 'Premiummärkt flotta: SUP:ar, kajaker, trampbåtar och små RIB-tenders'
        - 'Gästklar presentation: resortanpassade färger, logobranding, iscenesatt utrustningsvisning'
        - Liten lyx-RIB för VIP-gästtransporter med skräddarsydd klädsel och färgmatchning
        - 'Integrerad säkerhetsinfrastruktur: bojlinor, badvaktsstationer, AED'
        - 'Intäktsförvaltning: mallar för dynamisk prissättning, merförsäljningsutbildning, paketering'
    - title: Resorter på privata öar
      subtitle: Gästtransport i alla väder — noll stilleståndstid, absolut tillförlitlighet
      description: Privata ö-resorter verkar på avlägsna platser där båten är den enda förbindelsen till fastlandet. Dagliga gästöverföringar, leveranser och akuta medicinska evakueringar beror på ett enskilt fartyg – alla stilleståndstider påverkar direkt gästupplevelsen och resortens verksamhet. Dessa operatörer behöver en båt som går tillförlitligt i alla väderförhållanden, kräver minimalt underhåll och har backupsystem för verksamhetskritisk tillförlitlighet. Båten måste också presentera sig vackert när gästerna anländer till ön.
      features:
        - RIB-konfiguration för alla väderförhållanden med fullt väderskydd och extra kraftiga flytkroppar
        - Tvillingmotor eller reservmotor för verksamhet utan driftavbrott
        - Hypalon-konstruktion i kommersiell kvalitet för 5-8 års livslängd i drift på avlägsna orter
        - Lättskött design med åtkomliga komponenter för service på plats
        - Skräddarsydd resortprofilering och premiumklädsel anpassad efter öns estetik
    - title: Resorter vid sjön och ekoresorter
      subtitle: Naturintegrerade gästupplevelser
      description: Egenskaper vid sjön, ekologiska stugor och naturtillflyktsorter som erbjuder tysta vattenaktiviteter med låg påverkan som kompletterar den naturliga miljön. Utrustningen bör vara icke-motoriserad där det är möjligt, lätt att förvara i sjöbodar med begränsat utrymme och tyst i användning för att bevara den omgivande upplevelsen för alla gäster.
      features:
        - 'Icke-motoriserad flotta: SUP:ar, kajaker, kanadensare och trampbåtar'
        - Tysta uppblåsningsstationer med elpump för gästanvändning på begäran
        - Miljövänliga material och förpackningar anpassade efter hållbarhetsprofileringen
        - Förvaringsställ och organisationssystem för sjöbodar ingår
    - title: Strandklubbar
      subtitle: Gästtransfer, underhållning, små lyxiga RIB
      description: Strandklubbar driver en högenergi, visuellt fokuserad miljö där utrustning är en del av atmosfären. De behöver små lyxiga RIB:s för gästtransfer från närliggande hotell eller bryggor, och vattenleksaker för gästunderhållning - bogsering av vattenskoter, uppblåsbara rutschbanor och paddelbrädor. Flottan måste se stilig ut, vara lätt att använda och tåla daglig användning av gäster med varierande kompetensnivåer. Lagring och snabb implementering är avgörande under rusningstid.
      features:
        - Kompakt lyx-RIB (3,3-4,3 m) för gästtransporter och tenderservice
        - 'Vattenleksaker: bogsertuber, SUP-brädor, kajaker för gästunderhållning'
        - Egen färg och profilering anpassad till strandklubbens visuella identitet
        - System för snabb sjösättning och upptagning för verksamhet med hög omsättning
        - Hållbar Hypalon-konstruktion för daglig exponering för saltvatten och UV
    - title: Privata medlemsklubbar och yachtklubbar
      subtitle: Hamntransport, medlemsanbud, exklusiva vattensporter
      description: Privata klubbar där vattensporter och båttransporter är en medlemsförmån snarare än en intäktsdrivande. Utrustning måste uppfylla högre estetiska standarder, vara tillgänglig på begäran för medlemmar och kräva minimal personalövervakning. Marina yachtklubbar behöver specifikt anbud för hamntransporter - flytta medlemmar mellan kaj, förtöjning och strand. Förvaring och underhåll ska vara osynligt för medlemmarna.
      features:
        - Exklusiva RIB-tenders för hamntransport och medlemstransfer
        - 'Premiumutrustning: EVA-däck, anpassade medlemsfärger, märkesklädsel'
        - Självbetjäningsutlåningssystem för medlemsåtkomst utan personal
        - Lågsäsongsförvaring och årligt förnyelseprogram
    - title: Äventyrs- och aktivitetsfokuserade hotell
      subtitle: Guidade turer, SUP-yoga, snorklingsutflykter, gruppaktiviteter
      description: Fastigheter som positionerar sig som äventyrsdestinationer – erbjuder guidade turer, SUP-yoga, solnedgångspaddlar, snorklingsutflykter och gruppaktiviteter. Flottan behöver stödja både gratis uthyrning och guidade programmodeller, med utrustning som sömlöst växlar mellan självanvändning av gäster och instruktörsledda turer. Dessa fastigheter behöver hållbar utrustning för högfrekvent omsättning, med enkel rengöring mellan gästgrupper.
      features:
        - Mångsidig blandad flotta som stödjer hyr- + guidade turmodeller
        - Tandemkajaker och extra stabila SUP-plattformar för gruppaktiviteter
        - 'Guideutrustning: instruktörsbrädor, torrboxar, vattentät kommunikationsutrustning'
        - 'Säsongsbunden utrustningsrotation: sommarflotta → vinterförvaringsprogram'
        - Hållbar konstruktion dimensionerad för daglig gästanvändning med minimalt underhåll
