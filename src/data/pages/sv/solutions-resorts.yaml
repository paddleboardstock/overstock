hero:
  tagline: Hotell, resorter och gästfrihet
  title: Premium-upplevelser vid vattnet<br />För hotell, resorter och yachtklubbar
  subtitle: Nyckelfärdiga vattensportprogram för strandhotell, privata öresorter, strandklubbar och yachtklubbar – från gästutrustning och RIB-anbud till säkerhetssystem och personalutbildning.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer uppblåsbara båtar för semesteraktiviteter vid vattnet
direct_answer: Aquafarer samarbetar med hotell, resorter, privata öar, strandklubbar och yachtklubbar över hela världen för att skapa förstklassiga upplevelser vid vattnet. Våra lösningar inkluderar SUP-uthyrningsflottor, guidade turkajaker, mjuka RIB:ar för gästtransporter, små lyxiga RIB:ar för transfer till strandklubbar och kompletta säkerhetssystem. Varje utrustning kan märkas med din fastighets logotyp och färgschema. Vi tillhandahåller också personalutbildning, konsultation med programdesign och planering av byte av flottan för att säkerställa konsekvent kvalitet över säsonger.
