testimonials:
  - category: klubbar
    name: Ricardo Santos
    title: Ägare, Algarve Surf Academy
    location: Lagos, Portugal
    content: Vi började med Club Starter Package för vår surfskola. 20 brädor, paddlar, västar — allt kom inom 3 veckor. Efter två säsonger uppgraderade vi till Pro-paketet. Det anpassade varumärket med vår logotyp förändrade vår professionella image.
    rating: 5
    product: Klubbstartpaket
    source: solutions/clubs
  - category: klubbar
    name: Klubbägare
    title: Vattensportklubb
    location: Phuket, Thailand
    content: Klubbstartpaketet var den perfekta startpunkten. När vår verksamhet växte växte Paddle Board Overstock med oss – samma kvalitet, samma prissättning, inga överraskningar. Vi skalade från 10 till 80 brädor på 18 månader.
    rating: 5
    product: Klubbstarter + Premiumpaket
    source: success-stories
  - category: orter
    name: Resortchef
    title: 5-stjärnig strandresort
    location: Grekland
    content: Paddle Board Overstock levererade inte bara brädor – de hjälpte oss att bygga en komplett gästupplevelse. Vårt vattensportprogram gick från noll till resorthöjdpunkt på en säsong. 300+ veckobokningar och 180 000 USD i årlig intäkt.
    rating: 5
    product: Resort Premium-paket
    source: success-stories
  - category: orter
    name: Sophie Laurent
    title: Direktör för Guest Experience, Azure Bay Resorts
    location: Phuket, Thailand
    content: Paddle Board Overstock designade och utrustade hela vårt strandaktivitetsprogram i tre resortfastigheter. 80 SUP, 40 kajaker, säkerhetsinfrastruktur och personalutbildning – allt levererat i en försändelse. Gästdeltagandet ökade med 60 % under den första säsongen.
    rating: 5
    product: Resort Premium-paket
    source: solutions/resorts
  - category: företagare
    name: Michael Park
    title: Grundare, Shoreline Paddle Co.
    location: Kalifornien, USA
    content: Jag lanserade mitt SUP-varumärke utan branscherfarenhet. Paddle Board Overstocks team guidade mig från produktval till anpassad logotypdesign och förpackning. Min första container kom på 11 veckor, och jag sålde slut på 3 månader på Amazon.
    rating: 5
    product: Nybörjarmärkeslansering
    source: solutions/entrepreneurs
  - category: företagare
    name: Grundare
    title: Australiskt SUP-märke
    location: Australien
    content: Jag hade varumärkesidén men ingen tillverkningskunskap. Paddle Board Overstock höll bokstavligen min hand genom hela processen – från att välja rätt bräddesign till att packa upp min första försändelse. 90 dagar från dröm till leverans.
    rating: 5
    product: Varumärkeslanseringspaket
    source: success-stories
  - category: uthyrning
    name: Daniel Okonkwo
    title: Ägare, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Jag hyrde 5 brädor från en lokal butik och förlorade 60 % av mina intäkter till dem. Paddle Board Overstock hjälpte mig att bygga min egen flotta med 15 SUP. ROI-kalkylatorn visade break-even på 4 månader — det tog 3. Nu utökar jag till 30 brädor.
    rating: 5
    product: Startkit för fordonsflotta
    source: solutions/rental-business
  - category: uthyrning
    name: Marco Valenti
    title: Driftschef, Adriatic Adventure Tours
    location: Dubrovnik, Kroatien
    content: Vi utrustade hela vår hyrflotta med Paddle Board Overstock RIB:s – 12 båtar på tre platser. Två säsonger in, noll misslyckanden. CE-certifieringsdokumentationen gjorde försäkringsgodkännandet sömlöst. Deras ingenjörsteam anpassade till och med rörfärgerna.
    rating: 5
    product: Expansionskit för fordonsflotta
    source: trust
  - category: uthyrning
    name: Befälhavare Andres Reyes
    title: Sjöfartsinköpsofficer, filippinska kustbevakningsassistenten
    location: Manila, Filippinerna
    content: Vi driver 24 Paddle Board Overstock RIB:ar över vår kustpatrullflotta. Deras QC-process är konsekvent över varje batch - samma sömkvalitet, samma ventilplacering, samma tryckklassificering varje gång. Den repeterbarheten spelar roll när liv beror på utrustningen.
    rating: 5
    product: RIB patrullflotta
    source: trust
  - category: konsumenter
    name: Sarah K.
    title: Första gången SUP-ägare
    location: Lake Tahoe, USA
    content: Stabil även för en nybörjare. Tog den ut på sjön min första dag och föll aldrig. Det kompletta paketet med pump och paddel innebar att jag var på vattnet 20 minuter efter att jag öppnat lådan.
    rating: 5
    product: SUP Explorer 11
  - category: konsumenter
    name: James Thornton
    title: Ägare av SUP Explorer 11
    location: Vancouver, Kanada
    content: Som förstagångsköpare var jag nervös för kvalitetsbeställningar från utlandet. ISO-dokumentationen och testrapporterna från tredje part som de delade innan jag ens frågade gav mig fullständigt förtroende. Styrelsen kom på 6 dagar och överträffade mina förväntningar.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: konsumenter
    name: Mike R.
    title: Fritidskajakpaddlare
    location: Florida, USA
    content: Gedigen byggkvalitet. Klarar kustchop mycket bättre än jag förväntade mig av en gummibåt. Packade in den i min bilbagage för en weekendresa — uppblåst vid rampen på under 4 minuter.
    rating: 5
    product: Uppblåsbar kajak
