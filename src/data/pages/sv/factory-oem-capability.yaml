why_us:
  - title: Vertikal integration
    description: Vi äger vår fabrik, former och leveranskedja — inga mellanhänder, inga underleverantörer. Det ger oss kontroll över kvalitet, kostnad och leverans.
  - title: Dubbel certifiering
    description: ISO 9001-kvalitetsledning och BSCI-certifiering för socialt ansvar. Fabriksgranskningsrapporter tillgängliga på begäran.
  - title: CE-efterlevnad
    description: Alla standardmodeller bär CE 2013/53/EU-certifiering. Skräddarsydda modeller kan CE-certifieras genom vår etablerade process.
  - title: Lågt MOQ
    description: Börja med så få som 5 enheter för standardmodeller. Vi hjälper växande varumärken att lansera utan att binda för mycket lager.
