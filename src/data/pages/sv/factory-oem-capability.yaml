services:
  - title: Produktdesign och ingenjörskonst
    description: Vårt interna R&D-team arbetar med din idé eller specifikation för att utveckla CAD-ritningar, 3D-modeller och prototyper. Vi erbjuder formdesign, optimering av skrovformer och vägledning vid materialval.
  - title: Skräddarsytt varumärke och grafik
    description: Fullfärgs digitaltryck, sidscreentryck, präglning och etikettalternativ. Vi utvecklar varumärkesspecifik däckgrafik, tub-branding och förpackning redo för detaljhandel.
  - title: Anpassning av material och specifikationer
    description: Välj mellan PVC (standard, miljövänlig, flamhämmande), Hypalon/CSM, drop-stitch och hybridkonstruktioner. Skräddarsydda tubfärger, tygvikter och förstärkningsalternativ.
  - title: Förpackning och logistik
    description: Skräddarsydde detaljhandelsförpackningar, private label-lådor, vakuumpackning, pallning och containerlastning. Leveransvillkor FOB Qingdao, CIF eller DDP tillgängliga.

