hero:
  tagline: Vattensportskolor och träningscenter
  title: Utrustningslösningar<br />För SUP- och kajakskolor
  subtitle: Pålitlig, kommersiell utrustning för paddelskolor, surfinstruktioner, kajakträning och utbildningsprogram för vattensporter i alla skala.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP-brädor för skolor och träningscenter
direct_answer: Paddle Board Overstock förser SUP- och kajakskolor över hela världen med brädor av kommersiell klass, säkerhetsutrustning och instruktörspaket. Vår utrustning är byggd för dagligt instruktionsbruk – tjockare PVC, förstärkta kärnor med droppstygn och stabila skrovdesigner som ger nybörjare självförtroende och instruktörer tillförlitlighet. Paketen inkluderar anpassat varumärke, reservdelsprogram och utbildningsresurser.
solution_offerings:
  - title: Skolstartpaket
    subtitle: För nya program och små träningscenter
    badge: Popular
    features:
      - title: Elevbrädor
        description: 10–25 all-around SUP-brädor eller fritidskajaker med stabila plattformar för nybörjarlektioner
      - title: Instruktörsbrädor
        description: Bredare, längre brädor med extra stabilitet och halkfria EVA-däck för coachning
      - title: Säkerhetsutrustning
        description: Flytvästar, koppel, visselpipor och kastväskor i matchande färger
      - title: Förvaring & Transport
        description: Stapelbara brädställ, vadderade kajakvaggor och transportdockor
      - title: Läroplansstöd
        description: Lektionsmallar, säkerhetschecklistor och färdighetsguider
    cta_text: Kom igång med mitt skolpaket
    cta_href: /contact
  - title: Skol Premium-paket
    subtitle: För etablerade skolor och multiprogramoperatörer
    badge: Best Value
    features:
      - title: Hela flottan
        description: 25–50 brädor eller kajaker med blandad flotta (allround, touring, ungdomsstorlekar)
      - title: Instruktörsflotta
        description: 3–5 specialiserade instruktörstavlor med inbyggda ljudsystemfästen
      - title: Säkerhetsstation
        description: Centraliserad säkerhetsutrustningsstation med PFD:er, radioapparater, första hjälpen och skyltar
      - title: Varumärkespaket
        description: Full logotyptryck på brädor, paddlar, PFD:er och uniformer
      - title: Underhållsprogram
        description: Kvartalsvis underhållssatser, reservdelsbuntar och reparationsutbildning
    cta_text: Sätt ihop mitt Premium-paket
    cta_href: /contact
  - title: Skolfranchisepaket
    subtitle: För kedjor på flera platser och franchiseoperatörer
    badge: Enterprise
    features:
      - title: Flottans standardisering
        description: Identisk utrustning på alla platser för konsekvent studentupplevelse
      - title: Central beställning
        description: Konsoliderad beställning, bulkprissättning och centraliserad reservdelshantering
      - title: Instruktörsutbildning
        description: Utrustningshantering och underhållscertifiering för alla instruktörer
      - title: Gemensam marknadsföring
        description: Gemensamt varumärkesbyggande med franchise + Paddle Board Overstock co-branding-alternativ
      - title: Expansionsstöd
        description: Skalningsrådgivning, utrustningsprognoser och ny platsinställning
    cta_text: Diskutera franchiseplanen
    cta_href: /contact
benefits:
  - title: Byggd för daglig undervisning
    description: Tjockare PVC och förstärkta skenor tål daglig studentanvändning, fall på sand och steniga landningar.
    icon: tabler:shield
  - title: Stabila lärplattformar
    description: Bredare skrov och plattare rockers ger nybörjare självförtroende. Instruktörer fokuserar på undervisning, inte utrustning.
    icon: tabler:scale
  - title: Enkel förvaring och transport
    description: Uppblåsbara designbutiker i små utrymmen. Tömda brädor passar i standardbilar för mobil undervisning.
    icon: tabler:box-seam
  - title: Anpassad marknadsföring
    description: Skolans logotyper och färger på varje tavla. Your brand, your identity — not generic rental gear.
    icon: tabler:brush
content_segments:
  tagline: Skolprofiler
  title: Utbildningslösningar för vattensport<br />Efter programtyp
  subtitle: Paddelskolor, surfakademier, universitetsprogram och franchiseoperatörer står alla inför olika operativa utmaningar – från läroplansintegration till standardisering av flotta på flera platser. Vi konfigurerar utrustningspaket för att matcha utbildningsmodellen.
  items:
    - title: Fristående SUP & Kajakskolor
      subtitle: Ägardrivna utbildningscenter
      description: Små till medelstora skolor som drivs av ägare-instruktörer som erbjuder SUP-lektioner, kajakträning och certifieringskurser. Utrustningen måste vara tillräckligt hållbar för daglig undervisning, prisvärd för ett litet företags budget och mångsidig nog för att betjäna nybörjare till mellanliggande studenter i en enda flotta.
      features:
        - Stabila allround-SUP-brädor och fritidskajaker för nybörjarlektioner
        - Brädor avsedda för instruktörer med extra stabilitet för coachning från vattnet
        - Lektionsplansmallar och guider för färdighetsutveckling ingår
        - Årligt förnyelseprogram för utrustning med inbytesrabatter
    - title: Universitets- och högskoleprogram för rekreation
      subtitle: Storskaliga fritidsflottor för studenter
      description: Universitetets rekreationsavdelningar som driver paddelklubbar, uthyrningsprogram och instruktionskurser som en del av campus rekreationserbjudanden. Utrustning utsätts för hög användning under terminer, kräver enkla in-/utcheckningssystem och måste tåla varierande kunskapsnivåer från förstagångsstudenter till avancerade paddlare.
      features:
        - Högoutslitlig PVC-konstruktion klassad för institutionella användningscykler
        - Färgkodade flottor efter färdighetsnivå för enkel hantering
        - Kompatibilitet med lagerspårningssystem baserade på RFID eller klistermärken
        - Partipriser med terminsbaserade beställningar och betalningsvillkor
    - title: Surfskolor och surfakademier
      subtitle: Instruktionsprogram för kustnära surf
      description: Surfskolor som lär ut SUP-surfing, benägen paddling och surfkajak i havsmiljöer. Utrustningen måste hantera surfzonens förhållanden - slagtålighet, sand- och saltvattentolerans och enkel sköljning och återgång mellan timlektioner.
      features:
        - Surfspecifika former med förstärkta rails och slagtålig konstruktion
        - Mjuka fenalternativ och spirallinor för elevernas säkerhet
        - Snabbsköljt tyg som torkar mellan lektionspassen
        - Flottbytesprogram med besiktning och förnyelse i slutet av säsongen
    - title: Franchise & Multi-Location-kedjor
      subtitle: Standardiserad utrustning på olika platser
      description: Operatörer på flera platser som kör standardiserade utbildningsprogram i flera städer eller regioner. Konsistens i flottan på olika platser är av största vikt – alla elever bör ha samma utrustningsupplevelse oavsett vilken franchiseplats de besöker. Centraliserad beställning, enhetlighet i varumärket och skalningsstöd är avgörande.
      features:
        - Identiska flottspecifikationer på alla franchiselokationer
        - Centraliserade konsoliderade beställningar med volympriser
        - 'Co-branding-alternativ: franchisemärke + Paddle Board Overstock co-branding'
        - 'Uppstartspaket för ny plats: utrustning, skyltning och öppningslager'
