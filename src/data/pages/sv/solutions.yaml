features3_solutions:
  tagline: Lösningar
  title: Ditt vattenäventyr<br />Affärspartner
  isBeforeContent: false
  columns: 3
  items:
    - title: Vattensportklubbar
      description: Kompletta utrustningspaket, anpassade varumärken och underhållsprogram för SUP-klubbar, kajakklubbar, surfskolor och träningscenter.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vattensport RIB
      description: Specialbyggda RIB:er för seglarskolor, vattensportcenter och evenemangsorganisationer. Coachbåtar, bogserbåtar och marskalkbåtar för professionella vattensporter.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resorts & Hotell
      description: Premiumvattensportprogram med flottans utrustning, säkerhetssystem, personalutbildning och intäktshantering för hotellfastigheter.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Vattenmärkesentreprenörer
      description: Private label OEM/ODM tillverkning med låga MOQ, anpassad produktdesign, förpackning och global frakt för nya varumärkesägare.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Dykcenter båtar
      description: Stabila RIB-plattformar med enkel in-/uthopning, utrustningsförvaring och motorlösningar optimerade för dykoperationer.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Räddnings- och Nödfarkoster
      description: Höghastighets-RIB:ar och flätbåtar konstruerade för sök och räddning, beredskap och kustbevakningsoperationer.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Tenderlösningar för Yachter
      description: Kompakta, stilrena RIB-tenders som kompletterar superyachter och fritidsbåtar. Enkel förvaring, kraftfull prestanda.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Fiskebåtslösningar
      description: Stabila, hållbara flätbåtar och RIB:ar konfigurerade för kommersiellt och fritidsfiske.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Utrustning för Marin Turism
      description: Flottklara flätbåtar, SUP-brädor och kajaker för resorter, turarrangörer och vattensportuthyrning.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: RIB-båtar för offshoreenergi
      description: Kraftiga RIB:er för olje- och gasplattformsstöd, vindkraftsöverföring av besättningar, inspektion av undervattenskablar och marin konstruktion.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Vattenbruk arbetsbåtar
      description: Korrosionsbeständiga RIB:er för fiskodling, pärlodling och havsuppfödning. Hypalon rör, hårdvara i rostfritt stål, hållbarhet för daglig användning.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Havsforskning och undersökning
      description: Stabila instrumentfärdiga RIB:er för oceanografisk forskning, miljöövervakning, vattenkvalitetsprovtagning och universitetsundervisningsprogram.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Kommersiella Arbetsbåtar
      description: Tunga RIB:ar för patrullering, mätning, transport och offshore-logistik. Byggda för de krävande behoven i kommersiell drift.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Inte säker på vilken väg som passar ditt företag?
  subtitle: Berätta för oss om din verksamhet – vi kommer att rekommendera rätt utrustningspaket, varumärkesprogram eller anpassad lösning.
  actions:
    - variant: primary
      text: Få en kostnadsfri konsultation
      href: /contact

