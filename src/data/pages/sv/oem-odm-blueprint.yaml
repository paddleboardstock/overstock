process_steps:
  title: 6-stegs OEM/ODM-process
  subtitle: Från designbrief till FOB Qingdao — ett strömlinjeformat arbetsflöde
  steps:
    - number: '01'
      title: Designbrief & 3D CAD-modellering
      description: Dela dina målspecifikationer, referensprodukt eller koncept. Vårt ingenjörsteam utvecklar detaljerade CAD-ritningar och 3D-renderingar för ditt godkännande.
      timeline: 3–5 dagar
    - number: '02'
      title: Materialval och tygprovning
      description: Välj mellan militärklassade PVC (0,9–1,2 mm), Hypalon CSM eller drop-stitch kärnvävar. Vi utför draghållfasthet, beläggningsvidhäftning och UV stabilitetstester.
      timeline: 2–3 dagar
    - number: '03'
      title: Snabb prototypframställning och provproduktion
      description: Vi CNC-maskintillverkar specialformar och producerar förproduktionsexemplar med dina varumärkesfärger, logotyp och specificerade material. Exempel skickas för ditt godkännande.
      timeline: 7–14 dagar
    - number: '04'
      title: 24–48 timmars högtryckstest
      description: Varje prototyp genomgår rigorösa tester för tryckhållning vid 1,25 gånger det angivna trycket. Sömskalningstester och dimensionell verifiering utförs.
      timeline: 1–2 dagar
    - number: '05'
      title: CE/ISO Kvalitetskontroll & Förpackning
      description: 100-punkts kvalitetschecklista. Varje enhet inspekteras innan försäljningsklar förpackning. CE intyg om överensstämmelse och BSCI efterlevnadsrapport ingår.
      timeline: 2–3 dagar
    - number: '06'
      title: FOB Qingdao Frakt & Logistik
      description: Färdiga varor pallade, sträckfilmade och containerlastade vid Qingdao hamn. Fullständig exportdokumentation, tullklarering och realtidsuppföljning.
      timeline: 7–14 dagar
