faq:
  title: OEM/ODM — Vanliga frågor
  questions:
    - q: Vad är minimibeställningskvantiteten (MOQ) för anpassade uppblåsbara SUPs?
      a: För standardmodeller med befintliga formar börjar MOQ på 5–10 enheter per design. För helt anpassade formar och verktyg är MOQ vanligtvis 200 enheter. Vi arbetar med startups och framväxande varumärken för att hitta genomförbara ingångspunkter.
    - q: Hur lång tid tar OEM-provprocessen?
      a: Standardprototypsprov slutförs inom 7–14 arbetsdagar efter designgodkännande. Snabbbeställningar kan prioriteras till 5–7 dagar mot en extra avgift.
    - q: Vad är skillnaden mellan PVC och Hypalon för uppblåsbara båtar?
      a: PVC är lättare, mer prisvärt och erbjuder utmärkt flexibilitet vid kalla temperaturer. Hypalon (CSM) ger överlägsen UV och ozonresistens med längre livslängd (10–15 år jämfört med 5–8 år). Vi rekommenderar PVC för de flesta fritidsapplikationer och Hypalon för kommersiellt/professionellt bruk.
    - q: Kan du anpassa formen och designen på uppblåsbara objektet?
      a: Ja. Vårt FoU-team kan utveckla specialformar för vilken skrovform, brädform eller rörkonfiguration som helst. Vi använder CNC-bearbetade aluminiumformar för precision och konsekvens.
    - q: Tillhandahåller ni fabriksgransknings tjänster?
      a: Vi välkomnar platsbesök och externa fabriksrevisioner på vår 12 000 m² stora anläggning i Qingdao. Vi upprätthåller ISO 9001- och BSCI-certifieringar och kan dela revisionsrapporter vid NDA.
    - q: Vilka fraktvillkor erbjuder ni?
      a: Vi erbjuder FOB Qingdao (standard), CIF och DDP leveransvillkor. Containerlastning och fullständig exportdokumentation ingår i alla OEM beställningar.
content_profiles:
  tagline: Varumärkesprofiler
  title: OEM / Privatmärkesproduktion<br />Efter kundtyp
  subtitle: Olika varumärkesprofiler har olika krav — vi anpassar våra OEM/ODM-tjänster för att matcha din affärsmodell, skala och go-to-market-strategi.
  items:
    - title: Nystartade vattenskotermärken
      subtitle: Låg MOQ, snabb upptrappning
      description: Entreprenörer och grundare som lanserar sin första linje av SUPs, kajaker eller uppblåsbara båtar. Du behöver en tillverkningspartner som behandlar ditt varumärke som sitt eget — med låga inträdeströsklar, flexibla batchstorlekar och praktisk designvägledning i varje steg av vägen.
      features:
        - MOQ så lågt som 50–100 enheter per SKU, inte tusentals
        - Förinstallerat formbibliotek för att undvika verktygskostnader
        - 'Fullt varumärkespaket: logotyp, tubgrafik, förpackning, hängetiketter'
        - Först exempel-arbetsflöde — godkänn innan produktion
    - title: Etablerade maritima varumärken
      subtitle: OEM skala med CE/ISO efterlevnad
      description: Existerande båt-, PWC- eller marinaccessoarmärken lägger till uppblåsbara vattenfarkoster till sin portfölj. Du behöver konsekvent kvalitet över produktionsserier, efterlevnad av regler för globala marknader och möjligheten att sam-engineera anpassade skrov eller tubformer.
      features:
        - Anpassad 3D-formsteknik för egna designer
        - CE 2013/53/EU, UKCA, USCG överensstämmelsedokumentation
        - BSCI sociala revisionsrapporter för återförsäljares efterlevnad
        - Dedikerad kontohantering + prioriterade produktionsplatser
    - title: DTC- och e-handelsmärken
      subtitle: Butiksfärdig förpackning i stor skala
      description: Online-först varumärken som säljer via Amazon, Shopify eller sina egna webbshoppar. Förpackning, uppackningsupplevelse och enhetens konsekventa kvalitet är avgörande. Du behöver en fabrik som förstår e-handels hastighet och returgradsdynamik.
      features:
        - Detaljhandelsklar boxdesign + insättningskorttryck
        - Vakuumförpackning / pallning för kostnadseffektiv frakt
        - EAN / UPC-streckkod och tullklar dokumentation
        - Konsolidering av blandade containrar för att optimera landad kostnad
    - title: Livsstil & Utomhusmärken
      subtitle: White-label-design kategoriutvidgning
      description: Kläder, friluftsutrustning eller resevarumärken som går in i vattensportkategorin under sitt eget märke. Du kanske inte har mariningenjörskompetens internt — så du behöver en partner som kan vägleda dig från koncept till container med minimal friktion.
      features:
        - Trendforskning och koncept moodboards
        - Samarbetsmärka begränsade upplagor och säsongsfärger
        - Design-till-prov-cykel på 10–14 arbetsdagar
        - 'End-to-end logistik: fabrik → lager → konsument'
