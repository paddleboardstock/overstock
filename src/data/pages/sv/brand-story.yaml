content_founding:
  tagline: Början
  title: 'Född vid vattnet'
  subtitle: 'Paddle Board Overstock började i en kustverkstad i Qingdao med en båt och en vision: att bygga uppblåsbara vattenfarkoster som klarar verkliga marina förhållanden.'
  paragraphs:
    - '2012 såg våra grundare en lucka på marknaden — de flesta uppblåsbara båtar var antingen prisvärda men opålitliga, eller högkvalitativa men orimligt dyra. De trodde att det fanns utrymme för en tillverkare som levererade både kvalitet och värde.'
    - 'Det första skrovet byggdes för hand, testades i lokala vatten och förfinades utifrån verklig återkoppling från fiskare och små kommersiella operatörer. Den återkopplingskretsen — bygga, testa, lyssna, förbättra — står fortfarande i centrum för vår ingenjörsfilosofi.'
    - 'Inom 2015 hade ryktet spridits utanför Qingdao. Internationella distributörer började begära provexemplar. Det som började som en lokal verkstad höll på att bli en global leverantör.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstocks tidiga produktionsverkstad och tillverkning
content_growth:
  tagline: Tillväxt & innovation
  title: 'Från verkstad till en anläggning på 12 000 m²'
  subtitle: 'Kontinuerliga investeringar i människor, utrustning och processer har förvandlat Paddle Board Overstock till en modern marin tillverkningsanläggning.'
  paragraphs:
    - 'I takt med att efterfrågan växte växte också vår anläggning. Vi expanderade från en liten verkstad till en fabrik på 12 000 m² med dedikerade produktionslinjer för RIB-båtar, uppblåsbara båtar, SUP-brädor och tillbehör.'
    - 'Vi investerade i CNC-skärmaskiner, högfrekvenssvetsutrustning, drop stitch-produktionslinjer och omfattande testutrustning — vilket låter oss kontrollera varje aspekt av produktkvaliteten.'
    - 'I dag består vårt team på 200–300 personer av mariningenjörer, materialforskare, kvalitetskontrollspecialister och skickliga hantverkare — många av dem har varit med hos Paddle Board Overstock sedan de tidiga åren.'
content_mission:
  tagline: Vårt uppdrag
  title: 'Frihet På Vattnet, Ingenjörsmässigt Byggd'
  subtitle: 'Varje Paddle Board Overstock-produkt är designad för att hjälpa människor att utforska, arbeta och trivas på vattnet — pålitligt, säkert och prisvärt.'
  list:
    - 'Konstruera vattenfarkoster som presterar i verkliga marina förhållanden — inte bara på papperet'
    - 'Bygg långsiktiga partnerskap med distributörer och varumärken genom pålitlig OEM/ODM-service'
    - 'Förbättra våra tillverkningsprocesser kontinuerligt för att leverera bättre värde'
    - 'Stöd varje produkt med äkta reservdelar och teknisk expertis'
cta:
  title: 'Redo att samarbeta med en tillverkare<br />som bryr sig om kvalitet?'
  subtitle: 'Kontakta vårt team för att diskutera ditt OEM/ODM-projekt — inget tryck på minimiorder, bara ärliga råd.'
