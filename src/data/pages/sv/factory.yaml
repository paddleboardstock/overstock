material_traceability:
  tagline: Spårbarhet
  title: Materialspårning & batchkontroll
  description: Varje batch av råmaterial tilldelas ett unikt lotnummer i vårt affärssystem. Från ankomst via produktion till färdig produkt länkar varje båts materialförteckning tillbaka till den ursprungliga leverantörsbatchen. Detta möjliggör full uppströmsspårbarhet för alla kvalitets- eller efterlevnadsförfrågningar.
  system: Anpassad ERP (internt system) + fysiska batchtaggar på varje arbetsorder
  coverage: 100 % av produktionsmaterialet — PVC, Hypalon, tyg med sömmar, lim, ventiler, hårdvara, förpackningar
  records_retained: 10 år (enligt CE 2013/53/EU-krav)
  suppliers:
    - material: Marin PVC
      source: Kinesiska och koreanska leverantörer
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japansk leverantör
      certified: ISO 9001, REACH
    - material: Drop-stitch-väv
      source: Eget väveri + extern partner
      certified: Intern kvalitetskontroll + leverantör ISO 9001
    - material: Ventiler & beslag
      source: Kinesiska OEM-leverantörer
      certified: ISO 9001, materialcertifikat per parti
