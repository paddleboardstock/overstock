production_flow:
  tagline: Produktionsflöde
  title: Från material till färdig båt
  subtitle: Varje båt passerar genom 6 produktionssteg med QC-kontrollpunkter vid varje steg. Inga genvägar, inga överhoppade inspektioner.
  stages:
    - stage: '01'
      title: Materialmottagning och inkommande kvalitetskontroll
      description: Allt inkommande material loggas per batch-/lotnummer i vårt affärssystem. PVC tygrullar, fällsömskärnor, ventiler, lim och hårdvara sätts i karantän tills QC sign-off.
      qc_check: Draghållfasthet (ASTM D751), rivhållfasthet (ISO 4674), tjockleksmätare, vidhäftningsviskositet, skanning av visuella defekter
      qc_threshold: 100 % av satserna testade. Avvisa om dragstyrka < 90 % av spec, rivning < spec min, eller någon visuell defekt
      responsibility: Inkommande QC-team (3 inspektörer)
    - stage: '02'
      title: CNC-skärning och materialförberedelse
      description: Datoroptimerad kapsling lägger ut paneler på PVC lager för att minimera avfall. Automatiska CNC-skärmaskiner bibehåller 0,1 mm positionsnoggrannhet.
      qc_check: Dimensionell kontroll mot CAD DXF-filer, kantkvalitetsinspektion, verifiering av panelantal
      qc_threshold: Var 20:e panel mäts. Tolerans ±0,5 mm. Avvisa batch om >2 % utanför toleransen
      responsibility: Ledning av skärverkstad
    - stage: '03'
      title: Svetsning & Drop-Stitch Bonding
      description: Drop-stitch-kärnor är bundna till yttre PVC-laminat med värmelaminering. Rörkammare är RF-svetsade eller varmluftssvetsade. Rälsband är fusionsbundna i tre lager.
      qc_check: Avdragningstest var 50:e enhet (ASTM D751), mätning av svetsbredd, granskning av varmluftstemperaturlogg, visuell söminspektion under bakgrundsbelysning
      qc_threshold: Skalhållfasthet min 8 N/cm. Svetsbreddstolerans ±1 mm. All synlig kanalisering = avvisa
      responsibility: Svets-QC (2 inspektörer per skift)
    - stage: '04'
      title: Montering & riggning
      description: 'Båtar flyttas till slutmontering där alla komponenter är ihopkopplade: skrov + rör, ventiler installerade, D-ringar, handtag, fenlådor och bärväska. Varje enhet följer en 100-punkters monteringschecklista.'
      qc_check: 100-punkts checklista avskrivning per enhet, ventilfunktionstest (10 öppna/stäng-cykler), verifiering av hårdvarumoment, visuell inspektion
      qc_threshold: 'Noll-defektpolicy på säkerhetskritiska föremål (ventiler, D-ringar, handtag). Smärre kosmetika: AQL 2,5 (ISO 2859)'
      responsibility: Monteringsteamledare + linje QC
    - stage: '05'
      title: Trycktestning och kvalitetshållning
      description: Varje kammare blåses upp till 1,25× nominellt tryck (vanligtvis 20–25 PSI) och hålls i 24–48 timmar. Trycksensorer loggar kontinuerligt. Kammare som överstiger 5 % tryckfall avvisas och skickas för ny söminspektion.
      qc_check: 24h tryckhållningslogg, sensorkalibrering verifierad dagligen, temperaturkompenserad tryckavläsning, sömomtest efter reparation
      qc_threshold: Max 5% tryckfall under 24h vid stabil temp. Varje kammare som överskrider detta = 100 % omtest av hela produktionssatsen
      responsibility: Kvalitetslabb (oberoende av produktion, rapporterar till ledningen)
    - stage: '06'
      title: Slutbesiktning och packning
      description: Slutlig visuell och funktionsbesiktning. Ytdefekter, färgkonsistens, etikett/BIN-verifiering, förpackningsintegritet och tillbehörets fullständighet. Enheterna vakuumförpackas, förpackas och pallas för containerlastning.
      qc_check: Fullständig visuell inspektion, checklista för tillbehör per SKU, förpackningsfalltest (1 m, slumpmässigt prov), verifiering av skanning av etikett/streckkod
      qc_threshold: AQL 2,5 för större defekter, AQL 4,0 för mindre. Nolltolerans för säkerhetsbrister. 100 % av enheterna visuellt inspekterade
      responsibility: Sista QC-teamet (4 inspektörer) + ledare för packningsteamet
