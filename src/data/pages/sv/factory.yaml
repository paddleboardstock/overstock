qc_section:
  tagline: Kvalitetskontroll
  title: Testning och kvalitetssäkringsprocess
  subtitle: Varje båt genomgår obligatoriska tester före frakt. Vårt kvalitetslaboratorium arbetar oberoende av produktionen och rapporterar direkt till ledningen.
  steps:
    - step: '1'
      title: Inspektion av råmaterial
      desc: PVC-, Hypalon- och drop-stitch-tyger genomgår draghållfasthetstestning, rivspridningstest och UV-beständighetsverifiering innan någon batch släpps till produktion.
    - step: '2'
      title: 48-timmars lufttäthetstest
      desc: Varje rörkammare blåses upp till 125 % av nominellt tryck och hålls i 48 timmar. Tryckfall under 5 % leder till automatisk underkännande och fönyad söminspektion.
    - step: '3'
      title: Belastnings- och balanstest
      desc: Färdiga båtar belastas till maximal kapacitet och testas för stabilitet, fribord och manövrering. Varje enhet testas på vatten före slutinspektion.
oem_section:
  tagline: OEM-projekt
  title: Varumärkes- och OEM-partnerskapsfallstudier
  subtitle: Från koncept till container — hur vi hjälper globala varumärken att lansera och skala upp linjer med uppblåsbara båtar.
  cases:
    - challenge: En europeisk utomhusåterförsäljare behövde en private label SUP-linje med unik däckgrafik, miljövänlig PVC och detaljhandelsfärdig förpackning — allt levererat på 60 dagar.
      solution: Vi utvecklade anpassade digitaltrycksfiler, anskaffade REACH-kompatibel PVC och komprimerade provtagningen från 3 omgångar till 1 genom att placera designteamet på vår fabrik i Qingdao.
      result: 55 dagar från PO till FOB. 2 400 enheter i 4 SKU. Återbeställning lades innan första containern anlände.
    - challenge: En amerikansk vattenstartup behövde en högpresterande drop-stitch-kajak med anpassad skrovform, gemensam varumärkesförpackning och BSCI-certifiering för detaljhandelsplacering.
      solution: Vi anpassade en befintlig drop-stitch-kajakform med modifierad rockerprofil, utvecklade gemensam varumärkesförpackning och levererade fullständig BSCI-revisionsdokumentation.
      result: Framgångsrikt lanserad i 3 stora amerikanska utomhuskedjor. Över 5 000 enheter första året med 98 % försäljningsgrad.
    - challenge: En australisk distributör behövde en CE-certifierad RIB-serie med anpassade rörfärger, alternativ för uppgradering till Hypalon och överensstämmelse med australisk standard AS 1799.
      solution: Vi tillverkade förproduktionsprover med 4 rörfärgsvarianter, anskaffade CSM Hypalon från japansk leverantör och samordnade tredjeparts AS 1799-efterlevnadstester.
      result: Serie med 3 RIB-modeller lanserad på AU/NZ-marknaden. Därefter vunnen statlig upphandling för 12 patrull-RIB:ar.
faq_section:
  tagline: FAQ
  title: Vanliga B2B- och OEM-frågor
  questions:
    - q: Vad är minsta beställningskvantitet (MOQ) för OEM av uppblåsbara SUP-brädor?
      a: MOQ börjar från 5–10 enheter för standard OEM-modeller. Anpassade formar och private label-projekt kräver minimum 200 enheter, beroende på komplexitet. Provbeställningar och testserier finns tillgängliga för nya varumärken.
    - q: Är Paddle Board Overstock BSCI-certifierat?
      a: Ja. Vår fabrik har ett giltigt BSCI-intyg om social regelefterlevnad (revisionsrapport tillgänglig på begäran). Vi är även ISO 9001:2015-certifierade för kvalitetsledning, och 64 av våra modeller är CE-certifierade (TÜV Rheinland). REACH- och RoHS-efterlevnadsdokumentation medföljer varje OEM-leverans.
    - q: Vad är typisk ledtid för en OEM-beställning?
      a: Standard ledtid är 30–45 dagar från bekräftad PO och förskottsbetalning. Anpassad formutveckling lägger till 15–20 dagar för verktyg. Vi erbjuder expressproduktion för brådskande beställningar och säsongstoppar under försäsongen (januari–mars).
    - q: Kan ni skicka FOB Qingdao eller CIF till vår hamn?
      a: Ja. Vi skickar FOB Qingdao, CIF till större världshamnar och DDP för kvalificerade partners. Vårt logistikteam hanterar containerbokning, exportdokumentation och tullklarering. Vi skeppar till över 50 länder på EU-, USA-, AU- och Asienmarknaderna.
b2b_moq: 'Standard MOQ: 5–10 enheter per modell (SUP/kajak/drop-stitch). RIB MOQ: 2–5 enheter. Provbeställningar välkomna för nya partnerskap.'
