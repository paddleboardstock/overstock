workshops_section:
  tagline: Verkstäder
  title: Produktionsverkstäder
  workshops:
    - title: PVC-skärning och materialförberedelse
      description: Automatiska CNC-skärmaskiner bearbetar PVC-, Hypalon- och drop-stitch-tyger med submillimeterprecision. Datoroptimerad placering minimerar materialsvinn och säkerställer att varje panel uppfyller sina dimensionsspecifikationer före svetsning.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Rörsvetsning och värmegeförsegling
      description: Dedikerad svetsverkstad med varmluftsförseglingsmaskiner och dielektriska RF-pressar. Varmluftssvetsar fogar samman och smälter PVC-rörkammare, medan RF-förseglare skapar höghållfasta, lufttäta sömmar som överträffar kraven.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: RIB-skrovtillverkning — glasfiber
      description: RIB-båtars skrov tillverkas med handuppläggning av glasfiber med polyester- och vinylesterhartser. Varje lager handrullas och vakuumpackas för jämn kvalitet. Gelcoat-sprutbox ger en högglansig, UV-beständig marin yta.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: SUP-tryck och dekor
      description: SUP-brädor dekoreras med digitaltryck för helfärgsgrafik och screentryck för logotyper och återkommande mönster. Digitala skrivare skapar fotokvalitets däckdesign, medan screentryck levererar hållbara, livfulla varumärkesmärken.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
    - title: Slutmontering och utrustning
      description: Monteringslinje där glasfiberskrov sammanfogas med PVC-rör, motorer monteras, styr- och kontrollsystem ansluts och elsystem kopplas. Varje båt genomgår en 100-punkts monteringskontroll som godkänns av teamledaren.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Kvalitetstestning och inspektion
      description: Varje färdig båt genomgår obligatoriska lufttäthetstester, sömhållfasthetsverifiering och full systemkontroll före frakt. Vårt kvalitetslaboratorium arbetar oberoende av produktionen och rapporterar direkt till ledningen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
