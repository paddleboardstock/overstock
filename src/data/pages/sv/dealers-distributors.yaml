content_benefits:
  tagline: Partnerskapsfördelar
  title: Varför distributörer<br />Välj Paddle Board Overstock
  subtitle: Ett partnerskap utformat för marina distributörer som behöver pålitlig leverans, konkurrenskraftiga marginaler och professionellt stöd.
  items:
    - title: Territoriskydd
      description: Exklusiva eller semi-exklusiva territoriumrättigheter för kvalificerade distributörer. Marknadskartläggning och kanalkonflikthantering för att skydda din investering i att bygga varumärket Paddle Board Overstock i din region.
      icon: tabler:map-pin
    - title: Konkurrenskraftiga grossistpriser
      description: Delad prissättning baserad på årliga volymåtaganden. Marginalskyddande prisstruktur med förhandsprisgarantier och transparenta kostnadsfördelningar (FOB Qingdao-basis).
      icon: tabler:currency-dollar
    - title: Marknadsföringsstödkit
      description: Professionell produktfotografering, specifikationsblad, mallar för efterlevnadsdokumentation, innehåll i sociala medier och marknadsföringsmaterial med gemensamt varumärke. Uppdateras årligen med nya produktlanseringar.
      icon: tabler:photo
    - title: Teknisk utbildning
      description: Produktutbildning för ditt säljteam (virtuell eller på plats), utbildning i underhåll och reparation för dina servicetekniker, och kundinriktade FAQ och felsökningsguider.
      icon: tabler:school
    - title: Reservdelar och efterförsäljning
      description: Dedikerad reservdelsförsörjning med prioriterad frakt. Ersättningsrörsektioner, ventiler, fenor och reparationssatser tillgängliga för snabb orderuppfyllelse. Support för behandling av garantianspråk.
      icon: tabler:tool
    - title: Överensstämmelsedokumentation
      description: 'Komplett dokumentationspaket för överensstämmelse för din marknad: CE DoC, byggskyltdata, ägarmanualer och regulatorisk registreringssupport. Eliminerar din efterlevnadsbörda.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Vad vi letar efter
  title: Distributör<br />Krav
  subtitle: Vi söker partners som professionellt kan representera och stödja Paddle Board Overstocks produkter i deras territorium.
  items:
    - title: Territorium och marknadskunskap
      description: Etablerad närvaro på marknaden för marina, vattensporter eller friluftsliv. Förståelse för lokala bestämmelser, konsumentpreferenser och distributionskanaler för vattenskoterprodukter.
      icon: tabler:target
    - title: Branscherfarenhet
      description: Minst 2 års erfarenhet av distribution av marin-, utomhus- eller sportutrustning. Beprövad meritlista med internationella varumärken och B2B-grossistverksamhet.
      icon: tabler:briefcase
    - title: Showroom eller lager
      description: Fysisk anläggning för produktvisning, lagerlagring och kundservice. Möjlighet att upprätthålla demoenheter och reservdelslager för ditt territorium.
      icon: tabler:building-store
    - title: Engagemang för varumärkesstandarder
      description: Villighet att upprätthålla Paddle Board Overstocks varumärkespresentationsstandarder, tillhandahålla kundsupport enligt våra serviceprotokoll och delta i årliga produktutbildningsuppdateringar.
      icon: tabler:star
content_process:
  tagline: Ansökningsprocess
  title: 4-stegs återförsäljare<br />Ansökningsprocess
  subtitle: Från första förfrågan till första leverans – en enkel onboardingprocess.
  steps:
    - number: '01'
      title: Inledande förfrågan & kvalifikation
      description: Skicka in din distributörsansökan med företagsinformation, område av intresse, aktuella produktlinjer och årliga volymuppskattningar. Vi granskar inom 5 arbetsdagar.
      timeline: 5 dagar
    - number: '02'
      title: Affärsrecension och villkor
      description: Virtuellt möte för att diskutera territoriumstrategi, prisnivåer och partnerskapsvillkor. Granska kraven på överensstämmelsedokumentation för din marknad. NDA-signering vid behov.
      timeline: 1-2 veckor
    - number: '03'
      title: Provbeställning & utvärdering
      description: Lägg en första provbeställning (2-5 enheter) till distributörspriser för marknadsutvärdering och teamutbildning. Fullständig överensstämmelsedokumentation och demoförberedelser ingår.
      timeline: 30-45 dagar
    - number: '04'
      title: Partnerskapslansering och support
      description: Första containerordern med territoriumskydd aktiverat. Marknadsföringskit levererat, säljteam utbildat och dedikerad kundansvarig utsedd. Löpande kvartalsvisa verksamhetsgenomgångar.
      timeline: Pågående
content_application_docs:
  tagline: Ansökningshandlingar
  title: Dokument som krävs<br />för återförsäljaransökan
  subtitle: För att ansöka om ett Paddle Board Overstock-återförsäljarskap, förbered följande dokument och information till vårt granskningsteam.
  items:
    - title: Registreringsbevis för företag
      description: Giltig företagsregistrering som visar juridiskt namn, registrerad adress och verksamhetsomfattning som omfattar distribution av marin-, sport- eller friluftsutrustning.
      icon: tabler:file-text
    - title: Täckningsplan för territorium
      description: Geografiskt intressentterritorium, befintligt detaljhandels- eller distributionsnätverk, mål kundsegment och föreslagen årsvolym per produktkategori (RIB, SUP, kajak).
      icon: tabler:map
    - title: Showroom- eller lagerkapacitet
      description: Fysisk lokal för produktvisning, lagerhållning och kundservice. Foton eller planritningar som visar demoarea och lagerkapacitet för reservdelar.
      icon: tabler:building
    - title: Intyg om finansiell kapacitet
      description: 'Bankreferens eller finansiell rapport som bekräftar förmågan att lägga en initial containerorder och bibehålla lager. Minsta initialorder: en 20-fots container (10–20 enheter, blandade modeller).'
      icon: tabler:coin
    - title: Kapacitet för eftermarknadsstöd
      description: Servicetekniker som är utbildade eller kan utbildas för underhåll och reparation av gummibåtar. Förmåga att hantera garantianspråk och åtagande om reservdelslager.
      icon: tabler:tool
    - title: Referenser från tidigare varumärken
      description: Lista över marin- eller sportvarumärken som nu eller tidigare distribueras. Kontaktreferenser tillgängliga efter ömsesidig överenskommelse. Startups utan tidigare distributionserfarenhet kan kvalificera sig med ett starkare finansiellt åtagande.
      icon: tabler:users
faq:
  title: Återförsäljarprogram — Vanliga frågor
  questions:
    - q: Vad är den minsta beställningskvantiteten för distributörer?
      a: Distributör MOQ börjar på 10-20 enheter per beställning, med flexibilitet för blandade modeller (RIB, uppblåsbar, SUP). Inledande provbeställningar på 2-5 enheter är tillgängliga till distributörspriser för marknadsutvärdering.
    - q: Erbjuder ni exklusiva territoriumrättigheter?
      a: Exklusiva territoriumrättigheter är tillgängliga för kvalificerade distributörer som uppfyller årliga volymåtaganden och upprätthåller varumärkesstandarder. Semi-exklusiva och icke-exklusiva arrangemang är också tillgängliga för tillväxtmarknader.
    - q: Vilket marknadsföringsstöd ger du?
      a: Vi tillhandahåller ett omfattande marknadsföringspaket inklusive professionell produktfotografering, specifikationsblad, mallar för överensstämmelsedokumentation, innehållsbibliotek för sociala medier och material med gemensamt varumärke. Uppdateras årligen med nya produktlanseringar.
    - q: Hur hanteras garantianspråk?
      a: 'Distributörer fungerar som den första kontaktpunkten för garantianspråk. Vi tillhandahåller tydliga garantikriterier, fotodokumentationsprotokoll och snabb ersättnings- eller kredithantering. Garantivillkor: 5-års begränsad på tyg/sömmar/skrov för båtrör; 2-år på SUP och tillbehör.'
    - q: Kan jag privatmärka Paddle Board Overstock-produkter under mitt eget varumärke?
      a: Ja, genom vårt OEM/ODM-program. Alternativen för privata etiketter inkluderar anpassad rörgrafik, konsolmärke, detaljhandelsförpackning och överensstämmelsedokumentation under ditt varumärke. Se vår OEM/ODM-tjänstsida för detaljer.
    - q: Vilken överensstämmelsedokumentation ingår för distributörer?
      a: Varje försändelse inkluderar modellspecifik CE DoC, byggskyltdata, ägarmanualer och fraktdokumentation. Vi tillhandahåller även myndighetsregistreringsstöd för ditt territorium och hjälper till med eventuella lokala efterlevnadskrav.
