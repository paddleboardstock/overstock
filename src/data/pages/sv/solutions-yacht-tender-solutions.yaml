content_challenge:
  tagline: Utmaningen
  title: Yachttenders kräver<br />prestanda och presentation
  subtitle: En yachttender är mer än en jolle — den är en förlängning av moderskeppet och ett kvalitetsstatement.
  paragraphs:
    - Yachtägare och kaptener behöver anbud som fungerar bra, lagras kompakt och presenterar vackert. Anbudet ska komplettera yachtens estetik samtidigt som det tillhandahåller tillförlitlig transport för gäster och besättning.
    - '**Förvaring är avgörande** — Anbudet måste passa på däck, i ett garage eller på daviter. Vikten spelar roll för uppskjutnings- och återställningssystem. Aquafarer RIBs erbjuder utmärkta kraft-till-vikt-förhållanden med kompakta förvaringsprofiler.'
    - '**Prestandaförväntningarna är höga** — Gästerna förväntar sig en mjuk, torr åktur när de förflyttas till land. Motoralternativ måste balansera hastighet, räckvidd och ljudnivåer för en premiumupplevelse. För charterverksamhet löper anbudet dagligen och måste tåla frekvent användning.'
    - '**Utseendet spelar roll** — Ett felmatchat eller slitet anbud försämrar den övergripande yachtpresentationen. Anpassade tubfärger, klädsel och varumärke ser till att anbudet ser ut som det hör hemma.'
content_solution:
  tagline: Vår lösning
  title: Anbudskonfigurationer<br />För varje yachtapplikation
  subtitle: Aquafarer RIB anbud kan anpassas för att matcha ditt fartyg, drifttyp och lagringskrav - från superyachtbyggares specifikationer till charterflottaprogram.
  list:
    - Anpassade rörfärger för att matcha eller komplettera moderkärlet — valfri RAL-färg tillgänglig för Hypalon eller PVC rör
    - Anpassad klädsel och sömmar — förstklassig vinyl av marina kvalitet med färgmatchning och logotypbroderi
    - Styrning av konsol eller rorkult — välj baserat på användningsmönster och förarens preferenser
    - Skrov av glasfiber deep-V för smidig, torr körning i varierande sjöförhållanden
    - Kompakt förvaring — töms eller hopar sig för däcksgarage, skåp eller davitförvaring
    - Hypalon rör för UV-beständighet och långsiktigt bevarande av utseende
    - Lyftpunkter och dragringar standard på alla modeller
    - Valfritt rosettskydd, helskydd och skyddande skavskydd
    - 'Motorområde: 15 HP till 60 HP — utombordare eller rorkultskonfigurationer'
    - OEM/privat märkning tillgänglig för yachtbyggare och marina återförsäljare
content_segments:
  tagline: Kundprofiler
  title: Yacht Tender Solutions<br />Efter kundtyp
  subtitle: Olika yachtindustrisegment har unika krav. Aquafarer konfigurerar anbud för att matcha varje applikation.
  items:
    - title: Superyachtbyggare
      subtitle: OEM anbudsintegration — anpassade mått, färger och material
      description: 'Yachtbyggare står inför en återkommande utmaning: varje nytt fartyg har unika dimensionsbegränsningar, viktbegränsningar och estetiska förväntningar. Anbudet måste integreras perfekt med moderfartygets davit-system, passa inom exakta garagedimensioner och matcha formspråket för en yacht för flera miljoner euro. Eventuella felmatchningar – fel rörfärg, felaktig placering av lyftpunkten, inkompatibel vikt – försenar leveransen och reflekterar dåligt på byggaren. Aquafarer arbetar direkt med byggarinköp och designteam för att leverera anbud med anpassade RAL-rörfärger, matchande klädsel, märkeskonsolpaneler och kompletta OEM dokumentationspaket.'
      features:
        - Anpassade dimensionella specifikationer som matchar garage- och davitbegränsningar
        - Alla RAL-rörfärger och matchande klädsel — prover för designgodkännande tillhandahålls
        - OEM varumärke på konsol, rör och ryggstöd
        - Lyftpunkts- och davitpassningsvalidering för varje modell
        - Skrovvikt optimerad för specificerade start- och återställningssystem
        - Schemaläggning för bulkleverans i linje med produktionstidslinjer
    - title: Yacht Management företag
      subtitle: Flottans standardiserade anbud — global support, minimal stilleståndstid
      description: Förvaltningsbolag övervakar flera yachter som verkar över Medelhavet, Karibien, södra Stilla havet och utanför. Deras kärnbehov är tillförlitlighet - ett trasigt anbud i en avlägsen hamn innebär övertid av besättningen, gästklagomål och dyra ersättningar i sista minuten. Standardiserade specifikationer för flottan minskar utbildningstiden för besättningen över fartyg och förenklar reservdelshanteringen. Aquafarer erbjuder prissättning för flera fartygsflotta, konsekventa specifikationer över beställningar och globalt reservdelsstöd för managementföretag med fartyg i flera regioner.
      features:
        - Standardiserade specifikationer för hela den hanterade flottan
        - Utbytbara reservdelar för alla flottanbud
        - Flygplanspriser och volymrabatter för beställningar med flera enheter
        - Global reservdelstillgänglighet — snabb leverans till vilken hamn som helst
        - Konsekvent service- och underhållsdokumentation för besättningen
        - Leveranskoordinering med flera enheter till olika fartygsplatser
    - title: Yachtcharteroperatörer
      subtitle: Högfrekvent daglig verksamhet — hållbarhet utan att kompromissa med utseendet
      description: 'Charteranbud står inför det mest straffande operativa schemat i yachtbranschen: dagliga gästtransfer, landresor, stöd för vattensporter och hamnupphandlingar - ofta över 200 operationer per chartersäsong. Anbudet måste se perfekt ut för varje gästöverlämning samtidigt som det tål kontinuerlig ombordstigning, saltvattenexponering och motortimmar. Utseendeförsämring är ett direkt affärsproblem - ett slitet anbud påverkar gästrecensioner och charterpriser. Aquafarer konfigurerar charteranbud med uppgraderad klädsel, kraftiga Hypalon-rör och förstärkta hanteringsområden för långvarig hållbarhet som bibehåller presentationskvaliteten.'
      features:
        - Kraftiga Hypalon-rör — 5-8 års livslängd i daglig charterservice
        - Förstärkta trappsteg och grepplinor för frekvent användning
        - Premium fläckbeständig vinylklädsel — enkel rengöring mellan charter
        - Lätt att rengöra halkfria däckytor
        - Pålitliga utombordspaket med enkel serviceåtkomst för snäv vändning
        - Material av kosmetisk kvalitet som bibehåller utseendet under chartersäsongerna
    - title: Yachthandlare och mäklare
      subtitle: Tillförlitlig anbudsförsörjning för färdigställande av fartyg och andrahandsvärde
      description: Återförsäljare och mäklare behöver ett stabilt utbud av kvalitetsanbud som kompletterar de fartyg de säljer – matchande varumärkespositionering och förbättrar köparupplevelsen. Ett inkonsekvent anbud eller leveransförsening kan försena en överlämning av en yacht eller försämra en presentation. Återförsäljare kräver konsekvent kvalitet över batcher, pålitliga ledtider och konkurrenskraftiga priser för att bibehålla marginalerna. Aquafarer erbjuder återförsäljarinventeringsprogram med säsongsbetonad leveransplanering, co-branding-alternativ för showroom-visning och prioritetstilldelning under högsäsong.
      features:
        - Lagerlagerprogram med tillgängliga-on-demand-modeller
        - Säsongsbetonad leveransplanering i linje med överlämnandekalendern
        - Återförsäljare co-branding på konsol och rör för showroom display
        - Konsekvent kvalitet och specifikation för alla batchordrar
        - Konkurrenskraftiga återförsäljarpriser med volymbaserad nivå
