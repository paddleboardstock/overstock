content_capability:
  tagline: Ingenjörsförmåga
  title: Vad vår teknik<br />Team levererar
  subtitle: Aquafarers teknik täcker hela produktens livscykel — från marknadsundersökningar och konceptdesign till prototypframställning, testning och massproduktion.
  items:
    - title: Industriell formgivning
      description: Vårt industridesignteam arbetar utifrån kundkrav, marknadsundersökningar och konkurrensanalyser för att utveckla produktkoncept som balanserar estetik, funktionalitet och tillverkningsbarhet. Vi producerar 2D-skisser, 3D-renderingar och specifikationsdokument för kundgranskning innan vi bestämmer oss för verktyg.
      features:
        - Konceptutveckling och förstudier
        - 2D-konstruktionsteckningar och 3D-renderingar
        - Materialval och specifikation
        - Tillverkningsoptimerad konstruktion (DFM-analys)
        - Ergonomisk och säkerhetsmässig utvärdering
    - title: Konstruktionsteknik
      description: Våra konstruktionsingenjörer är specialiserade på uppblåsbar båtarkitektur - skrovdesign, rörkammarkonfiguration, drop-stitch kärnteknik och lastfördelning. Varje design analyseras för strukturell integritet, viktoptimering och överensstämmelse med relevanta standarder (CE, ISO, AS).
      features:
        - Deep-V glasfiberskrovskonstruktion med beräknade V-vinklar
        - Flerkammar tubkonfiguration för säkerhet och flytförmåga
        - Drop-stitch-kärnspecifikation och densitetsoptimering
        - Finita element-analys för belastningsbärande komponenter
        - Viktfördelnings- och stabilitetsberäkningar
    - title: 3D-modellering & CAD
      description: Alla produktdesigner utvecklas i 3D CAD innan prototypverktyget börjar. Våra ingenjörer använder SolidWorks och Rhino 3D för produktmodellering, så att kunderna kan granska varje detalj – från rörprofil till konsollayout – innan de börjar producera.
      features:
        - Fullständig 3D-CAD-modellering i SolidWorks och Rhino 3D
        - Fotorealistiska renderingar för kundpresentationer
        - Tekniska ritningspaket för produktion
        - Form- och verktygskonstruktion utifrån 3D-modeller
        - Direkt CAD-till-CNC-dataöverföring för precisionskapning
    - title: Prototyping & testning
      description: Före massproduktion går varje ny produkt igenom prototypstadiet. Vi bygger funktionella prototyper för klientutvärdering och utsätter dem sedan för vårt fullständiga testprotokoll - trycktestning, stabilitetstestning, belastningstestning och vattenförsök. Designiterationer på prototypstadiet är snabba och kostnadseffektiva.
      features:
        - Snabba prototypverktyg (genomloppstid 15-20 dagar)
        - Funktionell prototyp för utvärdering i verkliga förhållanden
        - Fullständigt testprotokoll före produktionsgodkännande
        - Iterativ förfining av konstruktionen baserat på testresultat
        - Milstolpe för kundgodkännande före produktionsverktyg
    - title: Anpassad tillbehörsintegration
      description: Många OEM-projekt kräver integrering av tillbehör från klienten eller från tredje part – anpassade konsoler, specialiserade sittplatser, elektroniska system, fästen för dykutrustning eller märkeselement. Vårt ingenjörsteam hanterar integrationsdesign, strukturanpassning och kvalitetsvalidering av alla tillbehör.
      features:
        - Konsoldesign och layout av instrumentpanelen
        - Integration av skräddarsydda sittplatser och klädsel
        - Design och kabeldragning av elektroniska system
        - Monteringssystem för dyk- och räddningsutrustning
        - Specifikationer för applicering av varumärke och grafik
content_process:
  tagline: Utvecklingsprocess
  title: Från koncept<br />till produktion
  subtitle: Vår produktutvecklingsprocess följer ett strukturerat 6-stegs arbetsflöde utformat för att minimera risker, komprimera tidslinjer och säkerställa tillverkningsberedskap från dag ett.
  stages:
    - stage: '01'
      title: Krav & Forskning
      duration: 1-2 veckor
      description: Vi arbetar med kunden för att definiera produktspecifikationer, målmarknadskrav, krav på regelefterlevnad och kommersiella mål. Detta steg producerar ett produktkravsdokument (PRD) som vägleder allt efterföljande arbete.
      deliverables: PRD, marknadsanalys, konkurrensriktmärke, preliminär kostnadsberäkning
    - stage: '02'
      title: Konceptdesign
      duration: 2-3 veckor
      description: Industriell designteam utvecklar produktkoncept baserat på PRD. Flera designalternativ presenteras med 3D-renderingar, materialrekommendationer och inledande tekniska bedömningar. Kunden väljer riktning för detaljerad utveckling.
      deliverables: 3D-konceptrenderingar, materialspecifikationer, designmotiv, preliminär BOM
    - stage: '03'
      title: Detaljerad teknik
      duration: 2-4 veckor
      description: Det valda konceptet är helt konstruerat - 3D CAD-modellering, strukturanalys, rörkonfiguration, skrovdesign, tillbehörsintegration och produktionsdokumentation. Alla dimensioner, material och processer är specificerade för verktyg.
      deliverables: Fullständig 3D CAD-modell, tekniska ritningar, slutlig stycklista, verktygsspecifikationer, QC-plan
    - stage: '04'
      title: Prototyptillverkning
      duration: 2-3 veckor
      description: Prototypverktyg produceras och funktionella prover byggs. Kunden granskar prototyp mot PRD-specifikationer. Testning utförs enligt överenskommet protokoll. Designjusteringar görs baserat på feedback innan produktionsverktyg.
      deliverables: Funktionell prototyp, testrapport, designrevisionslogg, klientavskrivningsdokument
    - stage: '05'
      title: Produktionsverktyg
      duration: 2-3 veckor
      description: När prototypen är godkänd tas produktionsverktyg i drift - formar, svetsjiggar, skärprogram, monteringsfixturer. QC-dokumentation och inspektionskriterier är slutförda. Provkörning utförd för processvalidering.
      deliverables: Produktionsverktyg, processdokumentation, QC-inspektionsplan, testkörningsrapport
    - stage: '06'
      title: Massproduktion & QC
      duration: Pågående
      description: Full produktion börjar med QC under processen i varje steg. De första artiklarna inspekteras och godkänns innan batchsläpps. Löpande kvalitetsövervakning, felspårning och kontinuerliga förbättringar under hela produktionslivscykeln.
      deliverables: Produktionsschema, QC-rapporter, batchspårbarhetsregister, fraktdokumentation
content_customization:
  tagline: Anpassningsalternativ
  title: Vad kan <br />anpassas
  subtitle: Nästan varje aspekt av våra produkter kan anpassas för att möta kundens krav. Nedan finns de vanligaste anpassningskategorierna.
  columns: 3
  items:
    - title: Skrov & struktur
      description: Anpassad skrovlängd, strålbredd, deadrise-vinkel, rördiameter, kammarkonfiguration och materialkvalitet.
      icon: tabler:sailboat
    - title: Färger & grafik
      description: Rörfärg (PVC/Hypalon), skrovgelcoatfärg, konsolfärg, däcksgrafik, logotypplacering och förpackningsdesign.
      icon: tabler:palette
    - title: Konsol och kontroller
      description: Mittkonsol, sidokonsol eller rorkultsstyrning. Anpassad instrumentpanelslayout, brytarplacering och rodrets position.
      icon: tabler:steering-wheel
    - title: Sittplatser & klädsel
      description: Jockeysäten, bänkar, lyxklädsel, färgmatchade sömmar, hopfällbara eller avtagbara konfigurationer.
      icon: tabler:armchair
    - title: Tillbehör & Utrustning
      description: Dykstegar, tankställ, dragpyloner, T-toppar, Bimini-toppar, ljudsystem, navigationselektronik och säkerhetsutrustning.
      icon: tabler:backpack
    - title: Förpackning och varumärke
      description: Anpassade detaljhandelsförpackningar, lådor med privata etiketter, fraktkartonger med varumärken, hängetiketter och användarmanualer på kundspråk.
      icon: tabler:box
content_industries:
  tagline: Industriapplikationer
  title: Tekniska lösningar<br />efter industri
  subtitle: Vårt ingenjörsteam har utvecklat produkter för ett brett utbud av marina applikationer - var och en med distinkta krav och prestandakriterier.
  columns: 3
  items:
    - title: Dykverksamhet
      description: Förstärkta däck, integration av dykstege, tanklagringssystem och stabila plattformar för kommersiella dykcenter över hela världen.
      icon: tabler:lifebuoy
    - title: Räddning & nödsituation
      description: Höghastighetsskrovkonstruktioner, självlåsande däck, utrustningsmonteringssystem och flerkammarsäkerhetskonfigurationer för SAR-operationer.
      icon: tabler:alert-triangle
    - title: Marin turism
      description: Passagerarkomfortlayouter, solskyddsintegration, boardingsystem och bränsleeffektiva konfigurationer för ötransfer.
      icon: tabler:beach
    - title: Yachttendrar
      description: Kompakt design för davitförvaring, lyxiga finishalternativ, matchande moderskeppsfärger och högpresterande dragegenskaper.
      icon: tabler:sailboat
    - title: Fiske & Vattenbruk
      description: Plattdäckskonfigurationer, borrhålsintegration, spöhållarlayouter, korrosionsbeständig hårdvara för kontinuerlig exponering av saltvatten.
      icon: tabler:fish
    - title: Hamn & Industri
      description: Kraftig skrovförstärkning, arbetsbåtslayouter, personaltransportkonfigurationer och utrustningsintegration för offshoreverksamhet.
      icon: tabler:ship
