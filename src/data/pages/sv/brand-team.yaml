hero:
  tagline: Vårt team
  title: 'Människorna bakom Paddle Board Overstock<br />— ingenjörskonst för frihet på vattnet'
  subtitle: 'Grundat 2012 i Qingdao, Kina, byggdes Paddle Board Overstock upp av mariningenjörer, materialvetare och vattensportsentusiaster som trodde på att göra professionella uppblåsbara vattensportfarkoster tillgängliga världen över.'
  image:
    src: /images/team-all.webp
    alt: Gruppfoto av hela Paddle Board Overstock-teamet — konstruktion, produktion och ledning
founding:
  tagline: Vår grund
  title: 'Från en kustverkstad<br />till en anläggning på 12,000 m²'
  subtitle: 'Paddle Board Overstock grundades av ett team mariningenjörer med årtionden av samlad erfarenhet av konstruktion av uppblåsbara båtar, PVC/Hypalon-tillverkning och global tillverkning av marin utrustning.'
  items:
    - title: "Grundat: 2012"
      description: 'Etablerat i Qingdao, Kina — ett viktigt maritimt nav med djup fartygsbyggnadstradition.'
      icon: tabler:calendar
    - title: 200-300 anställda
      description: 'Inklusive 50+ FoU-ingenjörer, kvalitetsspecialister och produktionstekniker.'
      icon: tabler:users
    - title: Anläggning på 12,000 m²
      description: 'Dedikerad fabrik med 6 produktionslinjer för RIB-båtar, uppblåsbara båtar och SUP-brädor.'
      icon: tabler:building-factory
    - title: '50+ betjänade länder'
      description: 'Export till Europa, Amerika, Mellanöstern, Asien-Stillahavsregionen och Afrika.'
      icon: tabler:globe
