philosophy:
  tagline: Designfilosofi
  title: 'Ingenjörsdriven design<br />— varje detalj spelar roll'
  subtitle: 'Vår ingenjörsfilosofi kretsar kring tre principer som styr varje produkt vi bygger.'
  list:
    - 'Tillförlitlighet i första hand: Varje Paddle Board Overstock-produkt testas för att klara verkliga förhållanden — från räddningsinsatser i kallt vatten till uthyrning på tropiska resorter. Vi överdimensionerar där det spelar störst roll.'
    - 'Tillverkningsprecision: Våra anläggningar använder CNC-skärning, högfrekvenssvetsning och automatiserade trycktester. Varje söm, varje ventil, varje koppling uppfyller dokumenterade specifikationer.'
    - 'Kontinuerlig innovation: Vårt FoU-team utvärderar kontinuerligt nya material, produktionsmetoder och designförbättringar. Vi väntar inte på problem — vi förutser dem.'
cta:
  title: 'Vill du diskutera ett projekt med vårt team?'
  subtitle: 'Våra ingenjörer står redo att ge råd om produktval, anpassning och OEM/ODM-partnerskap.'
