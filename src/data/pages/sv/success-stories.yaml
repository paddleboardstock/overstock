hero:
  tagline: Framgångsberättelser
  title: Verkliga resultat från<br />Water Business Builders
  subtitle: Se hur klubbar, resorter och entreprenörer runt om i världen byggde upp lönsamma vattensportverksamheter med Aquafarer-utrustning och support.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer kundframgångshistorier
stories:
  - title: Hur en medelhavsresort byggde en lönsam SUP-uthyrningsverksamhet
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5-stjärnig badort — Grekland
    problem: Anläggningen behövde förstklassiga gästvattenaktiviteter för att öka nöjdhetspoängen och skapa en ny intäktsström, men saknade utrustning, säkerhetsinfrastruktur och personalexpertis.
    solution: Aquafarer levererade 50 skräddarsydda SUP-brädor med resortfärger och logotyp, komplett säkerhetssystem inklusive livräddningsstation och bojlinjer, och ett 3-dagars personalutbildningsprogram som täcker utrustningshantering, gästinstruktioner och säkerhetsprotokoll.
    result:
      - Över 300 gästaktiviteter bokade per vecka redan första månaden
      - 'Gästnöjdhet för vattenaktiviteter: 4,8/5'
      - 'Ny årlig sidointäkt: 180 000 $'
      - Noll säkerhetsincidenter under första säsongen
      - Kostnad för utrustningsersättning minskad med 40 % jämfört med tidigare leverantör
    quote:
      text: Aquafarer levererade inte bara brädor – de hjälpte oss att bygga en komplett gästupplevelse. Vårt vattensportprogram gick från noll till resorthöjdpunkt på en säsong.
      author: Resortchef
    cta_text: Bygg din resortlösning
    cta_href: /solutions/resorts
  - title: Hur en australisk startup byggde ett vattenmärke på 90 dagar
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Förstagångsentreprenör - Australien
    problem: En friluftsentusiast ville lansera sitt eget SUP-märke för den australiensiska marknaden men hade ingen tillverkningserfarenhet, inga leverantörsrelationer och begränsat kapital.
    solution: Aquafarers Brand Launch Package gav rådgivning om produktval, anpassad logotyp och färgdesign, märkesförpackning med hängetiketter, CE-certifieringsdokumentation och FOB-frakt till Sydney.
    result:
      - Första leveransen om 200 brädor levererad på 75 dagar från första kontakt
      - Varumärke lanserat på Shopify + Amazon AU inom 2 veckor efter ankomst
      - Första lagret utsålt på 45 dagar
      - 'Genomsnittlig marginal: 55 % på detaljhandelspriset'
      - 'Andra ordern: 500 enheter lagda inom 60 dagar efter lanseringen'
    quote:
      text: Jag hade varumärkesidén men ingen tillverkningskunskap. Aquafarer höll bokstavligen min hand genom hela processen – från att välja rätt bräddesign till att packa upp min första försändelse. 90 dagar från dröm till leverans.
      author: Grundare, australiensiskt SUP-märke
    cta_text: Lansera ditt varumärke
    cta_href: /solutions/entrepreneurs
  - title: Hur en thailändsk strandklubb skalade från 10 till 80 brädor
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Vattensportklubb — Thailand
    problem: En liten SUP-klubb vid stranden i Phuket behövde skala från en hobbyverksamhet till ett professionellt uthyrningsföretag som betjänar turister, men kunde inte hitta en pålitlig utrustningsleverantör med jämn kvalitet och prissättning.
    solution: Från och med Aquafarers Club Starter Package (10 brädor, paddlar, säkerhetsutrustning, varumärke), växte klubben genom Premium Package-programmet under 18 månader.
    result:
      - Växt från 10 till 80 brädor på 18 månader med konsekvent kvalitet och prissättning
      - La till hyra av kajaker och pedalbåtar hos samma leverantör
      - Klubbens skräddarsydda profilering ökade varumärkeskännedomen bland turister
      - Underhållskostnader minskade med 60 % jämfört med tidigare budgetutrustning
      - Nu över 150 uthyrningar per dag under högsäsong
    quote:
      text: Klubbstartpaketet var den perfekta startpunkten. När vår verksamhet växte växte Aquafarer med oss – samma kvalitet, samma prissättning, inga överraskningar.
      author: Klubbägare, Phuket
    cta_text: Starta ditt klubbpaket
    cta_href: /solutions/clubs
  - title: Hur en karibisk resortkedja standardiserade vattensporter i 5 fastigheter
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Resortkedja — Karibien
    problem: En lyxresortskedja med 5 fastigheter behövde konsekvent vattensportutrustningskvalitet och varumärke på alla platser, med centraliserad upphandling och säsongsmässig ersättningsplanering.
    solution: Aquafarer levererade en flotta med flera fastigheter på 300 SUP:er och 100 kajaker med enhetligt varumärke, delat reservdelslager och årligt ersättningsschema med volympriser.
    result:
      - Standardiserad gästupplevelse i alla 5 anläggningar
      - 30 % lägre kostnader genom samlade inköp och volympriser
      - Centraliserad reservdelslagring minskade driftstoppet med 80 %
      - Det årliga programmet för utrustningsförnyelse eliminerade stressen vid säsongsslutet
      - Gästernas deltagande i vattensporter ökade med 45 % år för år
    cta_text: Designa ditt resortprogram
    cta_href: /solutions/resorts
