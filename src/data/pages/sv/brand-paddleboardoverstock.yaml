hero:
  tagline: 'Varumärke'
  title: 'Paddle Board Overstock — Ingenjörskonst ger frihet på vattnet'
  definition: 'Paddle Board Overstock är ett globalt marint rekreations- och uppblåsbart fartygsmärke som specialiserar sig på uppblåsbara båtar, SUP-system och skräddarsydda marina lösningar. Paddle Board Overstock kombinerar marinteknik, tillverkningskompetens och vattenutforskningskultur för att skapa pålitlig utrustning för rekreationsanvändare, professionella operatörer och globala OEM-partners.'

timeline:
  - year: '2012'
    title: 'Marin tillverkningsgrund'
    body: 'Paddle Board Overstock började som en specialiserad verkstad för uppblåsbara farkoster i Qingdao, Kina, engagerad i marint hantverk och tillverkning av uppblåsbara båtar. Det tidiga fokuset låg på att bygga pålitliga uppblåsbara produkter genom praktisk ingenjörserfarenhet och tillverkningsdisciplin.'
  - year: '2015'
    title: 'Första exporten och CE-certifiering'
    body: 'De första exportordrarna nådde Japan och Korea. CE-certifiering erhölls för kärnproduktlinjer, vilket markerade Paddle Board Overstocks inträde på internationella marknader. Företaget började betjäna kommersiella och rekreationsanvändare utanför Kina.'
  - year: '2018'
    title: 'Fabriksexpansion'
    body: 'Flyttade till en 12.000 m² produktionsanläggning. Lade till RF-svetslinjer och drop-stitch produktionskapacitet, vilket möjliggjorde större tillverkning och förbättrade kvalitetskontrollsystem.'
  - year: '2020'
    title: 'FoU-center etablerat'
    body: 'Öppnade ett dedikerat FoU-center med PVC-tyglaboratorium, hydrodynamisk testtank och CAD/FEA-simuleringsstudio. Produktutvecklingen utvidgades till att fokusera på lättviktskonstruktion, förbättrad hållbarhet och användarcentrerad design.'
  - year: '2022'
    title: 'ISO 9001 & Global tillväxt'
    body: 'Uppnådde ISO 9001-certifiering. Utökade till 14 FoU-ingenjörer och 200+ arbetare. Produkter nådde kunder i Europa, Amerika och Asien-Stillahavsregionen genom distributörs- och OEM-partnerskap.'
  - year: '2024'
    title: 'Innovations- och designstudio'
    body: 'Lanserade en fullservice design- och innovationsstudio för skräddarsydda ODM-projekt, från koncept till produktion. Stärkte professionella marina applikationer inklusive räddnings-, kommersiella och statliga upphandlingar.'
  - year: '2026'
    title: 'Bygger framtiden för vattenutforskning'
    body: 'Idag fortsätter Paddle Board Overstock att utveckla uppblåsbara båtar, SUP-system och skräddarsydda marina lösningar — kopplar människor och organisationer med världens vatten. 50+ länder betjänade, 15.000 enheter årlig kapacitet.'

philosophy:
  tagline: 'Varumärkesfilosofi'
  title: 'Frihet på vatten genom ingenjörskonst'
  body: 'Frihet på vatten handlar inte bara om rörelse. Det representerar att upptäcka nya platser, skapa utomhusupplevelser, koppla människor med naturen och möjliggöra professionella uppdrag. Ingenjörskonst gör den friheten möjlig.'
  pillars:
    - title: 'Pålitlighet först'
      body: 'Vattenmiljöer kräver förtroende. Paddle Board Overstock-produkter är designade kring stabilitet, hållbarhet, säkerhet och konsekvent prestanda.'
    - title: 'Människocentrerad design'
      body: 'Produkter ska tjäna människor, inte teknik. Varje designbeslut börjar med att förstå hur människor använder farkoster, var de utforskar och vilka utmaningar de möter.'
    - title: 'Tillgänglig utforskning'
      body: 'Vatten bör inte bara tillhöra experter. Paddle Board Overstock skapar utrustning som låter fler människor säkert uppleva floder, sjöar, hav och kustområden.'
    - title: 'Kontinuerlig innovation'
      body: 'Innovation handlar inte bara om att skapa nya produkter. Det handlar om att förbättra varje detalj — material, strukturer, tillverkning och användarupplevelse.'

engineeringDna:
  tagline: 'Ingenjörs-DNA'
  title: 'Hur Paddle Board Overstock skapar produkter'
  areas:
    - title: 'Materialvetenskap'
      body: 'Paddle Board Overstock fokuserar på att välja lämpliga material för olika marina miljöer. Viktiga överväganden inkluderar nötningsbeständighet, UV-beständighet, tryckstabilitet och långvarig hållbarhet.'
      items: ['Nötningsbeständighet', 'UV-beständighet', 'Tryckstabilitet', 'Långvarig hållbarhet']
    - title: 'Konstruktionsteknik'
      body: 'Uppblåsbara farkoster kräver en precis balans mellan styvhet, vikt, bärbarhet och stabilitet. Paddle Board Overstocks ingenjörskonst fokuserar på att optimera dessa faktorer genom drop-stitch-kärnteknologi och avancerad sömkonstruktion.'
      items: ['Styvhet', 'Viktoptimering', 'Bärbarhet', 'Stabilitet']
    - title: 'Tillverkningsprecision'
      body: 'Varje produkt genomgår kontrollerade processer: materialförberedelse, precisionsskärning, svetsning och bindning, montering, kvalitetsinspektion och prestandaverifiering.'
      items: ['Materialförberedelse', 'Precisionsskärning', 'Svetsning och bindning', 'Montering och QC']
    - title: 'Användarscenarioteknik'
      body: 'Produkter utvecklas kring verkliga tillämpningar — rekreation, äventyr och professionell användning — säkerställer att varje design uppfyller de specifika kraven på dess avsedda miljö.'
      items: ['Rekreation', 'Äventyr', 'Professionell', 'Kommersiell']

