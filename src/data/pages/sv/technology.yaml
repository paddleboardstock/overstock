testimonial:
  quote: Det som skiljer Aquafarer åt är deras materialvetenskap. De monterar inte bara komponenter – de konstruerar PVC sammansättningar, svetsparametrar och strukturella upplägg internt. Den vertikala integrationen visar sig i slutprodukten.
  author: David Park
  title: Produktutvecklingschef
  company: Bluewater Sports Equipment
  location: Australien
sections:
  - title: Drop-stitch-kärna
    standard: 12-15 PSI arbetstryck
    description: Tusentals interna polyestertrådar förbinder topp- och bottenskikten, vilket skapar en styv struktur vid 12-15 PSI. Detta är samma teknik som används i professionella paddelbrädor och uppblåsbara racerbåtar. Vår droppstygnstäthet är optimerad per modell för den perfekta balansen mellan styvhet och vikt.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: Diagram över drop-stitch-kärnan
  - title: Marin PVC
    standard: Fusion-svetsad | UV/saltvatten/nötningstestad
    description: Flerlagers laminerat PVC tyg klassat för marina miljöer. Varje lager smältsvetsas snarare än limmas, vilket eliminerar risken för delaminering. Testad för UV-beständighet (ASTM G154, 1 000+ timmar), saltvattenkorrosion (ISO 9227) och nötning (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC-skikt
  - title: Hypalon Rör
    standard: CSM gummi | UV/kemisk/extrema temperaturbeständig
    description: Används på RIB-modeller, Hypalon (CSM) gummi ger överlägsen UV- och kemikaliebeständighet jämfört med standard PVC. Hypalon rör bibehåller flexibilitet i extrema temperaturer och motstår nedbrytning från bränsle- och oljeexponering. Alla sömmar är handlagda av certifierade tekniker.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Air Deck Golv
    standard: Högtrycksuppblåsbar | Ersätter plywood/aluminium
    description: Uppblåsbart högtrycksgolvsystem som ersätter traditionella lamellgolv av plywood eller aluminium. Minskar inställningstid, totalvikt och lagringsvolym samtidigt som den ger tillräcklig styvhet för att stå, fiska och gå. Testad för att klara 200+ kg fördelad last.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Luftgolv (Air Deck)
