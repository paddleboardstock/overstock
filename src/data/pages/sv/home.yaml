faqs:
  title: Vanliga frågor om B2B-inköp
  subtitle: 'Vanliga frågor från varumärken, distributörer och kommersiella aktörer om OEM/ODM-tillverkning med Paddle Board Overstock.'
  columns: 2
  items:
    - title: Är ni tillverkare eller handelsbolag?
      description: 'Vi är en vertikalt integrerad fabrik med full kontroll över kvalitet, material och leveranstider. Företagslicens och produktionsomfattning kan verifieras vid en fabriksrevision.'
      icon: tabler:building-factory
      category: all
    - title: Hur fungerar er OEM/ODM-process?
      description: 'Från kravgranskning (48 h) till förslag, prototyp (7–14 dagar) och produktion (30–45 dagar FOB Qingdao). Fullt ingenjörsstöd, efterlevnadsdokumentation och spårbarhet per skrov under hela processen.'
      icon: tabler:route
      category: all
    - title: Vilka MOQ-krav har ni?
      description: 'RIB-båtar: 2–5 enheter per modell (befintlig form), 200+ för egna formar. SUP-brädor: 5–10 enheter per SKU. Containerorder med blandade modeller är möjliga. Testorder från 2–5 enheter för utvärdering.'
      icon: tabler:sort-ascending
      category: all
    - title: Vilka anpassningsalternativ finns?
      description: 'Skrovdesign, tubmaterial (PVC eller Hypalon/CSM), tubdiameter, konsolplacering, sittplatser, styrning, bränslesystem, däcklayout, varumärkesfärger, logografik, EVA-mattdesign, detaljhandelsförpackning och varumärkesprofilering av instruktionsboken.'
      icon: tabler:adjustments
      category: all
    - title: Vilka efterlevnadsdokument kan ni tillhandahålla för min marknad?
      description: 'CE-försäkran om överensstämmelse enligt 2013/53/EU, UKCA-märkning, ISO 9001-certifikat (SGS), BSCI-revisionsrapport, REACH-efterlevnad, materialtestrapporter, trycktestloggar och modellspecifika tillverkarplåtsuppgifter. Marknadsspecifik dokumentation på begäran.'
      icon: tabler:file-certificate
      category: all
    - title: Hur långa är prov- och produktionstider?
      description: 'Förserieprov: 7–14 arbetsdagar. Standardproduktion: 30–45 dagar FOB Qingdao. Expressproduktion mot tillägg är möjlig. Under högsäsong (mars–juni) kan leveranstiderna förlängas.'
      icon: tabler:clock
      category: all
    - title: Kan jag ordna en fabriksrevision eller en live-videovisning?
      description: 'Ja. Revisioner på plats i vår anläggning i Qingdao är välkomna med 3–5 dagars förvarning. Live-videovisningar via WhatsApp/Zoom kan ordnas direkt. Inspektioner av tredje part (SGS, BV, TÜV) välkomnas.'
      icon: tabler:video
      category: all
    - title: Vilka kvalitetsinspektioner görs före leverans?
      description: 'Tryckhållningstest vid 1,25× nominellt tryck (24–48 h), skaltest av sömmar, 100-punkts checklista för slutkontroll, dimensionell verifiering, kosmetisk inspektion, kontroll av efterlevnadsdokumentation och kontroll av förpackningens integritet. Allt enligt ISO 9001-procedurer.'
      icon: tabler:clipboard-check
      category: all

