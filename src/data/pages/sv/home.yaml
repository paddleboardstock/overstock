content_workshop:
  isReversed: true
  tagline: Fabriksstyrka
  title: Varför våra utförsäljningspriser<br />Är verkliga
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Riktig fabrik, verkliga besparingar — varje bord skickas från vår anläggning i Weihai</h3>
  items:
    - title: Samma produktionslinjer som stora varumärken
      description: Vår 12 000 m² stora fabrik i Weihai bygger brädor för internationella varumärken och våra egna överskottsbatcher på samma linjer med samma material.
    - title: 100% trycktestat
      description: Varje bräda är trycksatt till 1,25x klassad PSI och hålls innan den levereras. 99,3 % felfri hastighet per AQL 2,5 / ISO 2859.
    - title: Inga mellanhänder
      description: Styrelser levererar fabriksmässigt direkt till din dörr. Ingen distributörspåslag, ingen detaljhandelspåslag – det är så utförsäljningspriset håller sig upp till 60 % under detaljhandeln.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12 000 m² stor fabrik i Weihai med uppblåsbara SUP produktionslinjer
content_compliance:
  tagline: Efterlevnad och kvalitetskontroll
  title: Certifierad kvalitet,<br />Dokumenterat
  subtitle: Varje efterlevnadsanspråk stöds av certifikat och modellspecifik dokumentation som finns tillgänglig för din verifiering.
  items:
    - title: ISO 9001:2015
      description: Kvalitetsledningssystem certifierat av TÜV Rheinland/SGS. Årliga övervakningsrevisioner. Dokumenterade kvalitetskontrollprocesser från inkommande material till leverans.
      icon: tabler:certificate
    - title: CE Certifierad
      description: 13 CEcertifierade SUP modeller enligt tillämpliga EU-direktiv, var och en med en modellspecifik konformitetsdeklaration och tillverkningsplåtsdata.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Alla PVC och limmaterial följer REACH EU-regleringar.UKCA Märkning finns tillgänglig för den brittiska marknaden. Säkerhetsdatablad på begäran.
      icon: tabler:shield-check
    - title: 2 års SUP garanti
      description: Varje SUP bräda och tillbehör täcktes i 2 år — drop-stitch sömmar, inflationsventiler och tillbehör ingår. Skadeanmälningar löstes snabbt.
      icon: tabler:lifebuoy
