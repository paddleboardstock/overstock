content_customer_types:
  tagline: Vem vi betjänar
  title: 'Byggd för B2B-köpare<br />— inte för slutkonsumenter'
  subtitle: 'Paddle Board Overstock tillverkar för fyra kundtyper. Var och en har olika prioriteringar — och vi bemöter dem alla.'
  items:
    - title: Varumärkesägare / Private Label
      description: 'Skräddarsydd produktdesign, private label-grafik, efterlevnadsdokumentation under ert varumärke och dedikerat ingenjörsstöd från koncept till container.'
      icon: tabler:palette
      cta: Begär en OEM/ODM-offert
      cta_href: /request-quotation
    - title: Distributörer / Grossister
      description: 'Territorialskydd, konkurrenskraftiga grossistpriser, marknadsföringspaket, produktutbildning och komplett efterlevnadsdokumentation för er marknad.'
      icon: tabler:world
      cta: Ansök om återförsäljarskap
      cta_href: /dealers-distributors
    - title: Resorter / Uthyrningsaktörer
      description: 'Hållbarhet i kommersiell klass, rådgivning om flottstorlek, containerorder med blandade modeller, reservdelsstrategi och utrustningspaket med resortbranding.'
      icon: tabler:beach
      cta: Begär ett kommersiellt paket
      cta_href: /solutions/resorts
    - title: Räddning / Offentlig sektor / Professionellt
      description: 'Hypalon/CSM-konstruktion, SOLAS-efterlevnadsalternativ, projektspecifik certifiering, stöd vid upphandlingsdokumentation och ingenjörsarbete under NDA.'
      icon: tabler:shield
      cta: Diskutera ett projekt
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: OEM/ODM-kapacitet
  title: 'Vad ni får<br />med Paddle Board Overstock'
  subtitle: 'Direkt tillgång till fabriken med fullt stöd inom konstruktion, kvalitet och efterlevnad — inte ett handelsbolag.'
  columns: 2
  items:
    - title: OEM/ODM-anpassning
      description: 'Skräddarsydd skrovdesign, tubmaterial (PVC eller Hypalon/CSM), konsolplacering, sittplatser, varumärkesprofilering, färger och förpackning. Från mindre modifieringar till fullt anpassad konstruktion.'
      icon: tabler:adjustments
    - title: Låg MOQ, snabba prover
      description: 'RIB: 2–5 enheter (befintlig form). SUP: 5–10 enheter per SKU. Egna formar: 200+ enheter. Förserieprov med er varumärkesprofilering inom 7–14 dagar.'
      icon: tabler:rocket
    - title: Produktionsklar kvalitet
      description: 'Varje enhet trycktestas vid 1,25× nominellt tryck (PSI) under 24–48 timmar. 99,3 % felfria enligt AQL 2,5 / ISO 2859. 100-punkts kvalitetschecklista per skrov.'
      icon: tabler:certificate
    - title: Komplett efterlevnadsdokumentation
      description: 'CE enligt 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI-socialrevision, REACH-efterlevnad, UKCA-märkning. Modellspecifik försäkran om överensstämmelse och uppgifter för tillverkarplåten ingår.'
      icon: tabler:file-certificate
    - title: Leveranstid 30–45 dagar
      description: 'Standardproduktion 30–45 dagar FOB Qingdao. Prototyper på 7–14 dagar. Expressproduktion erbjuds. Containerlastplaner och ISPM-15-emballage ingår.'
      icon: tabler:truck-delivery
    - title: After-sales & reservdelar
      description: '5 års garanti på båtar/kajaker/RIB, 2 års garanti på SUP/tillbehör. Reservdelsförsörjning med prioriterad frakt. Stöd vid garantianspråk.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Produktkategorier
  title: '5 kategorier,<br />64 CE-certifierade modeller'
  subtitle: 'Från 2,4 m RIB-tendrar till 15 fots SUP-brädor — alla tillverkade i vår ISO 9001-anläggning i Qingdao.'
  items:
    - title: RIB-båtar
      description: '2,4 m till 7,0 m med aluminium- eller GRP-skrov. PVC- eller Hypalon/CSM-tuber. CE enligt 2013/53/EU. Konfigurationer för patrull, dykning, räddning och kommersiellt bruk.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Uppblåsbara båtar
      description: '2,0 m till 5,0 m med aluminiumgolv, plywoodgolv eller luftdäck. Fiske-, fritids- och tendermodeller.'
      icon: tabler:sailboat
      link: /products
    - title: SUP-brädor
      description: '9 till 15 fot i 4-tums och 6-tums Drop-Stitch. Allround-, touring-, yoga- och fiskemodeller. Finns även i kommersiell klass.'
      icon: tabler:swimming
      link: /products
    - title: Kajaker
      description: 'Uppblåsbara kajaker för 1 till 3 personer. Fritids- och touringmodeller med Drop-Stitch-golv.'
      icon: tabler:kayak
      link: /products
    - title: Säkerhetstillbehör
      description: 'CE-certifierade flytvästar, kastlinor, reparationskit, pumpar och navigationsljus. Flytvästar godkända enligt USCG typ III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Fabriksstyrka
  title: 'Revisionsklar tillverkning<br />i Qingdao'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12 000 m² ISO 9001-anläggning — verklig tillverkare, inte ett handelsbolag</h3>
  items:
    - title: 6 dedikerade produktionslinjer
      description: 'Separata linjer för RIB, uppblåsbara båtar, SUP, kajaker, säkerhetsutrustning och OEM/ODM. Varje linje med egna QC-kontrollpunkter och produktionsplanering.'
    - title: 100 % trycktestade
      description: 'Varje uppblåsbar kammare trycksätts till 1,25× nominellt tryck (PSI) och hålls i 24–48 timmar. Testresultaten kopplas till skrovets serienummer (HIN).'
    - title: Spårbarhet per skrov
      description: 'Produktionsregister på HIN-nivå med 21+ datafält per skrov: materialbatch, svetsar-ID, trycktestresultat, slutkonfiguration och leveransdestination.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstocks 12 000 m² stora ISO 9001-tillverkningsanläggning i Qingdao med RIB-produktionslinjer

content_compliance:
  tagline: Efterlevnad & kvalitetsbevis
  title: 'Dokumenterade bevis,<br />inte bara påståenden'
  subtitle: 'Varje efterlevnadsanspråk backas upp av modellspecifik dokumentation som ni kan verifiera.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Kvalitetshanteringssystem certifierat av TÜV Rheinland/SGS. Årliga övervakningsrevisioner. Dokumenterade QC-processer från materialmottagning till utleverans.'
      icon: tabler:certificate
    - title: CE enligt 2013/53/EU (RCD)
      description: '64 modeller med modellspecifik försäkran om överensstämmelse. Överensstämmelsebedömning enligt tillämpliga moduler. HIN-registrering och tillverkarplåtsuppgifter för varje skrov.'
      icon: tabler:file-certificate
    - title: BSCI-socialrevision
      description: 'Årlig BSCI-revision utförd av SGS. Verifierade etiska arbetsvillkor, arbetssäkerhet och miljöledning i hela anläggningen.'
      icon: tabler:users
    - title: REACH & UKCA
      description: 'Alla PVC- och limmaterial uppfyller EU:s REACH-förordning. UKCA-märkning finns för den brittiska marknaden. Säkerhetsdatablad på begäran.'
      icon: tabler:shield-check

steps:
  title: OEM/ODM-processen — från förfrågan till container
  items:
    - title: 'Steg 1: <span class="font-medium">Krav</span>'
      description: 'Dela era produktspecifikationer, målmarknad, kvantitet och efterlevnadskrav. Vårt konstruktionsteam granskar inom 48 timmar.'
      icon: tabler:file-text
    - title: 'Steg 2: <span class="font-medium">Förslag</span>'
      description: 'Ni får ett detaljerat förslag med specifikationer, materialval, MOQ, priser, leveranstid och efterlevnadsomfattning för er marknad.'
      icon: tabler:clipboard-list
    - title: 'Steg 3: <span class="font-medium">Prototyp</span>'
      description: 'Förserieprov med er varumärkesprofilering inom 7–14 dagar. Fullständig kvalitetstestning vid 1,25× nominellt tryck. Provkostnaden räknas av på produktionen.'
      icon: tabler:settings
    - title: 'Steg 4: <span class="font-medium">Produktion</span>'
      description: '30–45 dagars produktion FOB Qingdao efter godkänt prov. QC-kontrollpunkter under tillverkningen, trycktester och 100-punkts slutkontroll av varje enhet.'
      icon: tabler:building-factory
    - title: 'Steg 5: <span class="font-medium">Leverans</span>'
      description: 'Containerlastplan, ISPM-15-emballage av trä, paket med efterlevnadsdokumentation och FOB Qingdao-skeppning med komplett exportdokumentation.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstocks OEM/ODM-tillverkningsprocess för uppblåsbara båtar — från konstruktion till containerleverans

