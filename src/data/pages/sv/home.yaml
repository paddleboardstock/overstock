features:
  id: features
  tagline: Varför köpa från Paddle Board Overstock
  title: Äkta fabrik,<br />Äkta besparingar
  subtitle: Fabrikens överlager och outlet SUP-paket — certifierad kvalitet utan detaljhandelsmarginal.
  columns: 2
  items:
    - title: Upp till 60% rabatt på detaljhandeln
      description: Vi säljer fabrikens överlager och outletpartier direkt — inga mellanhänder, ingen detaljhandelsmarginal. Samma brädor som säljs för fullpris på andra ställen, till outletpriser här.
      icon: tabler:rocket
    - title: Kompletta paket
      description: 'Varje SUP levereras som ett komplett paket: bräda, rese-ryggsäck, handpump, justerbar paddel, avtagbar fen, spiral-lina och reparationskit.'
      icon: tabler:clipboard-list
    - title: Certifierad kvalitet
      description: 13 CE-certifierade SUP modeller enligt tillämpliga EU-direktiv. Varje bräda trycktestas 100% vid 1,25x angiven PSI innan den skickas. 99,3% felfri enligt AQL 2.5.
      icon: tabler:certificate
    - title: Inga MOQ — Beställ en bräda
      description: Överlagerutförsäljning innebär att enstaka enheter tas emot. Lägg en bräda i kundvagnen, slutför köpet, klart. Inga minimiorder, ingen offertprocess.
      icon: tabler:adjustments
    - title: Snabb global leverans
      description: Beställningar i lager skickas från Weihai inom 2–3 arbetsdagar. Spårbar leverans till 50+ länder i EU, Nordamerika, Asien-Stillahavsområdet och fler.
      icon: tabler:truck-delivery
    - title: 2 års SUP garanti
      description: Varje SUP bräda och tillbehör omfattas av 2 års garanti — drop-stitch sömmar, pumpventiler och tillbehör ingår. Reklamationer hanteras på dagar, inte veckor.
      icon: tabler:lifebuoy
