faqs:
  title: SUP Beställning och produkt-FAQ
  subtitle: Vanliga frågor om våra SUP utförsäljningsbrädor, beställning, betalning, frakt och garanti.
  columns: 2
  items:
    - title: Är SUP det svårt att lära sig?
      description: Inte alls. De flesta nybörjare står upp och paddlar redan under sitt första pass. Våra SUP allroundbrädor har extra breda, stabila plattformar designade speciellt för förstagångspaddlare. Börja på lugnt vatten så kommer du att kryssa på några minuter.
      icon: tabler:swimming
      category: sup
    - title: Vad är viktgränsen?
      description: Vår allround-plattform SUPs stödjer upp till 100 kg och touring- och yogaplattformarna tar upp till 113 kg. Varje produktsida listar den exakta viktkapaciteten för åkaren så att du kan anpassa brädan efter dina behov.
      icon: tabler:adjustments
      category: sup
    - title: Kan jag resa med en uppblåsbar SUP?
      description: Absolut. Varje Paddle Board Overstock bräda packas i en ryggsäcksstor bärväska. Med bara 8–10 kg är den lätt att bära till stranden, sjön eller genom flygplatsterminaler. Kontrollera din flygbolags bagagepolicy innan resa.
      icon: tabler:truck-delivery
      category: sup
    - title: Vad kommer i lådan?
      description: Alla Paddle Board Overstock SUP inkluderar bräda, reseryggsäck, handpump, justerbar paddel, avtagbar fena, spiralkoppel och reparationskit.
      icon: tabler:clipboard-list
      category: sup
    - title: Varför är era priser lägre än detaljhandelspriserna?
      description: Vi säljer fabriksöverskott och utförsäljningspartier direkt från vår egen produktionsanläggning i Weihai, Kina — inga mellanhänder, ingen detaljhandelsmarginal. Det innebär kompletta SUP-paket med upp till 60 % rabatt på typiska detaljhandelspriser, med samma CE-certifierade kvalitet.
      icon: tabler:certificate
      category: orders
    - title: Hur gör jag en beställning och betalar?
      description: Lägg till ditt SUP-paket i kundvagnen och betala säkert med Stripe eller PayPal. Vi accepterar alla större kredit- och betalkort. Varje beställning bekräftas via e-post med en fullständig faktura.
      icon: tabler:file-text
      category: orders
    - title: Skeppar ni över hela världen?
      description: Ja. Vi skickar till 50+ länder inom EU, Nordamerika, Asien-Stillahavsområdet, Mellanöstern och Afrika. Beställningar som finns i lager skickas vanligtvis inom 2-3 arbetsdagar med spårning för varje paket.
      icon: tabler:route
      category: orders
    - title: Vilken garanti ingår för SUP-kort?
      description: 'Varje SUP-bräda och tillbehör omfattas av 2 års garanti — inklusive själva brädan, drop-stitch-sömmar och uppblåsningsventiler. Reklamationer hanteras på dagar, inte veckor: lämna in online så reparerar eller byter vi ut.'
      icon: tabler:lifebuoy
      category: orders
