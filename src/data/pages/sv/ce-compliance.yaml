hero:
  tagline: CE & RCD-överensstämmelse
  title: RIB Boat CE-överensstämmelse<br />& teknisk dokumentation
  subtitle: Aquafarer RIB-båtar och uppblåsbara vattenskotrar är designade och dokumenterade för att uppfylla EU-marknaden enligt direktivet för fritidsbåtar 2013/53/EU. Från riskbedömning till försäkran om överensstämmelse, vi tillhandahåller modellspecifik överensstämmelsedokumentation för varje skrov.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: RIB-båt CE-överensstämmelse dokumentation och certifiering
direct_answer: Aquafarer tillhandahåller modellspecifik RCD 2013/53/EU-överensstämmelsedokumentation för RIB-båtar och uppblåsbara vattenskotrar, inklusive tekniska filer, deklarationer om överensstämmelse, byggskyltar och ägarmanualer – allt i linje med EN ISO 6185, ISO 12217 och tillämpliga harmoniserade standarder.
