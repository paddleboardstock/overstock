content_scope:
  tagline: Efterlevnadsomfång
  title: Vilka produkter behöver<br />RCD-överensstämmelse?
  subtitle: Fritidsbåtsdirektivet 2013/53/EU gäller för fritidsbåtar med en skrovlängd mellan 2,5 m och 24 m. Att förstå omfattningen är det första steget till efterlevnad.
  items:
    - title: RIB-båtar (2,5–24 m)
      description: Stela uppblåsbara båtar med skrovlängder från 2,5 m till 24 m faller under RCD. Designkategori A till D gäller beroende på avsedda sjöförhållanden och maximal vindstyrka.
      icon: tabler:sailboat
    - title: Uppblåsbara båtar (under 2,5 m)
      description: Små uppblåsbara båtar och jollar under 2,5 m kan vara delvis undantagna från RCD men kräver fortfarande CE-märkning enligt andra tillämpliga direktiv och EN ISO 6185 konstruktionsstandarder.
      icon: tabler:sailboat
    - title: SUP-brädor & tillbehör
      description: Stand-up paddelbrädor är utanför RCD-räckvidden. Däremot kräver tillhörande personliga flytanordningar (PFD) CE-märkning enligt PPE-förordningen (EU) 2016/425 med USCG typ III/V-godkännande där så är tillämpligt.
      icon: tabler:swimming
    - title: Delvis färdigställda båtar
      description: Båtar som levereras utan motor eller specifika installationer kräver en byggardeklaration för delvis färdigbyggda båtar, med full RCD-överensstämmelse ifylld av den slutliga byggaren eller importören.
      icon: tabler:tool
content_trust_layers:
  tagline: Tre-lagers Trust System
  title: Efterlevnadsinformation<br />— Delas på rätt nivå
  subtitle: Inte all efterlevnadsdata hör hemma på en offentlig webbplats. Vi följer en metod i tre lager som skyddar IP samtidigt som vi bygger upp köparens förtroende.
  items:
    - title: Lager 1 — Offentlig webbplats
      description: Refererade standarder, överensstämmelsevägar förklarade, dokumenttyper listade, certifieringsomfång per modellfamilj. Inga faktiska certifikat, testdata eller patentskyddade tekniska detaljer.
      icon: tabler:world
    - title: Lager 2 — Delning efter förfrågan
      description: 'Efter en kvalificerad förfrågan: redigerat DoC-exempel, foto av byggplåt, lista över tillämpliga standarder, checklista för överensstämmelse och sammanfattningar av materialcertifiering – delas enligt villkoren för tillåten användning.'
      icon: tabler:mail
    - title: Lager 3 — NDA / Order Stage
      description: Fullständig teknisk fil, riskbedömningar, stabilitetsberäkningar, testrapporter, materialbatchregister och produktionsspårbarhetsdokumentation – delas endast under NDA med bekräftade köpare.
      icon: tabler:lock
content_standards:
  tagline: Tillämpliga standarder
  title: ISO & EN-standarder<br />Vi bygger till
  subtitle: Våra produkter är designade och testade mot de harmoniserade standarderna under RCD. Standardnummer och namn refereras; fullständiga standardtexter förblir ISO-upphovsrätt.
  items:
    - title: EN ISO 6185-3
      description: 'Uppblåsbara båtar — Del 3: Båtar med en maximal motoreffekt på 15 kW eller mer. Krav på konstruktion, stabilitet, flytkraft och återhämtning man överbord för RIB:er.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Uppblåsbara båtar – Del 4: Båtar med en maximal motoreffekt på 15 kW och större än eller lika med 4,5 kW. Ytterligare krav på struktur och stabilitet.'
      icon: tabler:file-text
    - title: ISO 12215-serien
      description: Små farkoster — Skrovkonstruktion och scantlings. Strukturell design av skrov, däck och skott för RIB-skrov av glasfiber och aluminium.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Små farkoster — Ägarmanual. Nödvändigt innehåll och format för instruktionsboken som medföljer varje RIB-båt som levereras inom EU.
      icon: tabler:book
    - title: EN ISO 14945
      description: Litet hantverk — Byggartallrik. Information som ska märkas på byggskylten permanent fäst på varje farkost.
      icon: tabler:badge
    - title: ISO 8666
      description: Små farkoster — Huvuddata. Standardiserade mått och parametrar för konsekventa specifikationer i all produktdokumentation.
      icon: tabler:dimensions
content_process:
  tagline: Efterlevnadsprocess
  title: 6-stegs CE-efterlevnad<br />Arbetsflöde
  subtitle: Från projektomfattning till spårbarhet på seriell nivå – varje RIB-modell följer en definierad efterlevnadsväg.
  steps:
    - number: '01'
      title: Projektets omfattning och klassificering
      description: Definiera RIB-modell, designkategori (A/B/C/D), maximalt antal personer, nyttolast, motoreffekt och målmarknad. Bestäm om RCD gäller och vilken modul för bedömning av överensstämmelse som krävs.
      timeline: 2–3 dagar
    - number: '02'
      title: Identifiering av tillämpliga krav
      description: Identifiera alla tillämpliga väsentliga säkerhetskrav från RCD Annex I, relevanta harmoniserade standarder (EN ISO 6185, 12215, 10240, 14945) och eventuella ytterligare nationella krav för målmarknaden.
      timeline: 3–5 dagar
    - number: '03'
      title: Design & teknisk dokumentation
      description: 'Skapa Master Technical File: allmänna arrangemangsritningar, stabilitets- och flytkraftsberäkningar, riskbedömning, materialspecifikationer och systemsäkerhetsanalys (bränsle, el, styrning).'
      timeline: 10–15 dagar
    - number: '04'
      title: Produktverifiering och testning
      description: Genomför fysisk verifiering – trycktestning vid 1,25x nominellt tryck under 24–48 timmar, stabilitets- och flyttester, belastningstester och systemdriftsättning. Registrera alla testresultat per skrov.
      timeline: 5–7 dagar
    - number: '05'
      title: Märkning & Leveransdokumentation
      description: Fäst CE-märkning, byggskylt (EN ISO 14945) och HIN/CIN (skrovets identifieringsnummer). Förbered EU-försäkran om överensstämmelse, användarmanual (EN ISO 10240) och checklista för överensstämmelse.
      timeline: 2–3 dagar
    - number: '06'
      title: Spårbarhet på seriell nivå
      description: Varje skrov får ett unikt skrovregister som länkar det till Master Technical File, produktionsbatch, materialcertifikat, testresultat och slutlig konfiguration. Register bevaras i 10+ år per RCD.
      timeline: Pågående
content_document_cards:
  tagline: Dokumenttyper
  title: Överensstämmelsedokument<br />Kort
  subtitle: Det är de dokumenttyper vi förbereder och underhåller för varje CE-certifierad RIB-modell. Prover är tillgängliga vid kvalificerad förfrågan.
  items:
    - title: CE / RCD-överensstämmelsecertifikat
      description: Modellspecifikt certifikat som bekräftar att farkosten uppfyller alla tillämpliga väsentliga säkerhetskrav i RCD 2013/53/EU, utfärdat av tillverkaren med anmält organ där så krävs.
      icon: tabler:certificate
    - title: EU-försäkran om överensstämmelse (DoC)
      description: Undertecknad deklaration av tillverkaren eller auktoriserad representant, som listar tillämpliga direktiv, standarder, överensstämmelsemodul och information om anmält organ. Krävs för varje modell som släpps ut på EU-marknaden.
      icon: tabler:file-check
    - title: Byggplåt (EN ISO 14945)
      description: Permanent anbringad skylt som visar maximalt antal personer, maximal motoreffekt, designkategori och tillverkaridentifikation. Måste förbli läsbar under farkostens liv.
      icon: tabler:badge
    - title: Ägarmanual (EN ISO 10240)
      description: Omfattande manual som täcker säker drift, nödprocedurer, underhållsscheman och säkerhetsvarningar. Obligatorisk för varje RIB som levereras inom EU.
      icon: tabler:book
    - title: ISO test- och inspektionsrapporter
      description: Trycktestningsrekord (1,25x / 24–48h), stabilitets- och flyttestresultat, materialtestcertifikat och dimensionsverifieringsrapporter – allt kopplat till specifika skrovnummer.
      icon: tabler:test-pipe
    - title: Materialspårbarhetsregister
      description: Spårbarhet på batchnivå för tubväv, lim, glasfiber och hårdvara. Kopplar varje produktionsenhet till inkommande materialcertifikat och IQC-inspektionsresultat.
      icon: tabler:link
    - title: Kvalitetsinspektion & QC Records
      description: 100-punkters kvalitetschecklista per enhet, pågående QC-poster, rapporter om bristande överensstämmelse och korrigerande åtgärder. En del av produktionskedjan för spårbarhet.
      icon: tabler:clipboard-check
    - title: Projektdokumentpaket
      description: Dokumentationspaket per skrov inklusive slutlig konfigurationsprotokoll, detaljer om motor- och utrustningsinstallation, checklista för idrifttagning och leveransdokumentation.
      icon: tabler:package
content_design_categories:
  tagline: RCD-designkategorier
  title: Designkategori A–D<br />— Vad de betyder
  subtitle: RCD tilldelar designkategorier baserade på maximal vindkraft och signifikant våghöjd som farkosten är designad för att motstå.
  items:
    - title: Kategori A — Hav
      description: Designad för långa resor där vindstyrkan kan överstiga Beaufort 8 (>40 knop) och signifikant våghöjd kan överstiga 4 m. Kräver den mest rigorösa struktur- och stabilitetsverifieringen.
      icon: tabler:ripple
    - title: Kategori B — Offshore
      description: Designad för havsresor med vindstyrka upp till Beaufort 8 (≤40 knop) och signifikant våghöjd upp till 4 m. Lämplig för kustnära och halvexponerade vatten.
      icon: tabler:anchor
    - title: Kategori C — Inshore
      description: Designad för kustresor med vindstyrka upp till Beaufort 6 (≤27 knop) och signifikant våghöjd upp till 2 m. De flesta fritids-RIB faller i denna kategori.
      icon: tabler:sun
    - title: Kategori D — Skyddat
      description: Designad för skyddade vatten med vindstyrka upp till Beaufort 4 (≤16 knop) och signifikant våghöjd upp till 0,3 m. Sjöar, floder och skyddade hamnar.
      icon: tabler:pool
content_hin:
  tagline: Identifiering av hantverk
  title: HIN / CIN & byggplåt
  subtitle: Varje RIB-båt kräver ett skrovidentifikationsnummer (HIN) eller Craft Identification Number (CIN) och en byggskylt enligt EN ISO 14945 och RCD-krav.
  items:
    - title: Skrovidentifikationsnummer (HIN)
      description: En unik 14-teckens kod permanent markerad på styrbords sida av akterspegeln, kodande tillverkarkod (MIC), modellår, tillverkningsår och serienummer. Krävs för inträde på EU-marknaden.
      icon: tabler:hash
    - title: Hantverksidentifikationsnummer (CIN)
      description: Enligt EN ISO 10087, ett dolt sekundärt identifikationsnummer placerat på en dold plats för stöld- och spårbarhetssyften.
      icon: tabler:eye-off
    - title: Builder's Plate-innehåll
      description: Maximalt antal personer, maximal motoreffekt (kW), maximal belastning (kg), konstruktionskategori, tillverkarens namn och CE-märkning – allt permanent uppsatt på en korrosionsbeständig skylt.
      icon: tabler:badge
content_tech_file:
  tagline: Teknisk filstruktur
  title: Huvudteknisk fil<br />och skrovpost
  subtitle: 'Vårt dokumentationssystem följer en struktur i två nivåer: Master Technical File för varje modellfamilj och individuella Hull Records för varje producerad båt.'
  items:
    - title: Master teknisk fil
      description: 'Innehåller den fullständiga överensstämmelsedokumentationen för en modellfamilj: allmänt arrangemang, riskbedömning, stabilitets-/flytkraftsberäkningar, materialspecifikationer, tillämpliga standarder och överensstämmelsebedömningar. Sparad i 10+ år.'
      icon: tabler:folder
    - title: Skrovrekord (spårbarhet per båt)
      description: 'Varje skrov har ett unikt register som länkar det till Master Technical File: HIN, produktionsdatum, tubbatch, materialcertifikat, trycktestresultat, slutlig konfiguration, motorinstallation och leveransdestination.'
      icon: tabler:file-description
    - title: Kundefterlevnadspaket
      description: Leveranspaket per skrov inklusive DoC, byggskyltfoto, användarmanual, testsammanfattning och slutkonfigurationsblad — medföljer varje RIB som skickas till EU.
      icon: tabler:package
faq:
  title: CE-överensstämmelse — Vanliga frågor
  questions:
    - q: Är alla Aquafarer RIB-båtar CE-certifierade för EU-marknaden?
      a: RIB-båtar i vår katalog är designade och dokumenterade för RCD 2013/53/EU-överensstämmelse enligt tillämpliga EU-direktiv. CE-märkning gäller per modell, per konfiguration. Kontakta oss för ett modellspecifikt överensstämmelsedokument.
    - q: Vad är skillnaden mellan RCD-överensstämmelse och CE-märkning?
      a: RCD (Recreational Craft Directive 2013/53/EU) är EU-lagstiftningen som ställer grundläggande säkerhetskrav. CE-märkning är den visuella symbolen på en produkt som har bedömts och bekräftats uppfylla dessa krav. En produkt måste överensstämma med RCD innan den kan bära CE-märkningen.
    - q: Tillhandahåller ni överensstämmelsedeklarationer med varje båt?
      a: Ja. Varje RIB-båt som levereras till EU-marknaden inkluderar en modellspecifik EU-försäkran om överensstämmelse som listar tillämpliga direktiv, harmoniserade standarder, modul för bedömning av överensstämmelse och information om anmält organ.
    - q: Vilken modul för bedömning av överensstämmelse använder Aquafarer?
      a: Modulen beror på designkategori och båttyp. De flesta RIB-modeller i designkategori C använder Modul A (intern produktionskontroll). För konstruktionskategori A/B-båtar eller specifika konfigurationer kan modul B+C eller B+D tillämpas med anmält organ. Vi ger råd om lämplig modul per projekt.
    - q: Kan du dela efterlevnadsdokumentation innan vi gör en beställning?
      a: Efter en kvalificerad förfrågan delar vi ett dokument om överensstämmelse som visar tillämpliga standarder, överensstämmelseväg och tillgängliga dokumenttyper för modellen du utvärderar. Fullständiga tekniska filer delas under NDA efter orderbekräftelse.
    - q: Vad är ett skrovidentifikationsnummer (HIN) och ingår det?
      a: HIN är en 14-teckens unik identifierare som är permanent märkt på varje båt, som kodar tillverkarkoden (MIC), modellbeteckning, tillverkningsår och serienummer. Det är obligatoriskt för alla RIB-båtar som släpps ut på EU-marknaden och ingår i varje Aquafarer RIB.
    - q: Hur länge sparas tekniska filer?
      a: Enligt RCD 2013/53/EU-kraven måste tillverkaren bevara den tekniska filen i minst 10 år från det senaste datumet då produkten släpptes ut på marknaden. Aquafarer upprätthåller fullständig teknisk dokumentation för alla tillverkade modeller.
    - q: Hjälper du till med importörens skyldigheter enligt RCD?
      a: 'Ja. Vi tillhandahåller det dokumentationspaket som EU-importörer behöver för att uppfylla sina skyldigheter: åtkomst till tekniska filer, DoC, byggskylt, användarmanual och produktspårbarhetsregister. Importörens ansvar enligt RCD är tydligt dokumenterat i vår efterlevnadsguide.'
