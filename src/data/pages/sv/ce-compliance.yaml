content_material_cert:
  tagline: Materialcertifiering
  title: Materialspårbarhet &<br />Certifieringsbevis
  subtitle: Kvalitet RIB båtar börjar med kontrollerat material och dokumenterade processer. Nedan är hur vi organiserar materialcertifiering för varje kritisk komponentgrupp.
  items:
    - title: Uppblåsbart rörmaterial Spårbarhet
      description: PVC och CSM/Hypalon rörmaterial väljs efter avsedd användning, klimatförhållanden och målmarknad. Leverantörs tekniska data (TDS), materialbatchinformation, tygsatsspårbarhet, UV- och vädertestrapporter och REACH/SVHC-deklarationer är tillgängliga inom det överenskomna projektdokumentationens omfattning.
      icon: tabler:circle
    - title: Spårbarhet i marin aluminium
      description: För aluminiumskrov RIB-projekt kontrolleras legeringskvalitet, tjocklek och materialpartier enligt godkänd specifikation. Materialprovningscertifikat (MTC/MTR), EN 10204 3.1 dokumentation, rapporter om kemisk sammansättning och mekaniska egenskaper samt spårbarhet för värme/parti tillhandahålls där överenskommet.
      icon: tabler:rectangle
    - title: GRP Skrovmaterial & processkontroll
      description: För RIB:er av glasfiberskrov, hanteras gelcoat, harts, glasfiberarmering och kärnmaterial genom kontrollerade specifikationer. Material TDS/SDS, batchregister, laminatspecifikationer och härdnings- och verkstadskontroller finns tillgängliga efter projektöverenskommelse.
      icon: tabler:layers-subtract
    - title: Komponentdokumentation Support
      description: För utvalda komponenter – inklusive EVA däcksmaterial, säten, hårdvara i rostfritt stål, bränslesystem, elektrisk utrustning och marina tillbehör – samordnas tillämplig leverantörsdokumentation baserat på slutlig konfiguration och destinationsmarknadskrav.
      icon: tabler:package
    - title: Meddelande om efterlevnadsomfattning
      description: Certifikat, testrapporter och överensstämmelsedokument gäller endast för den specifika produktmodell, material, komponent, produktionssats eller projektomfattning som anges i det relevanta dokumentet. Kontakta oss med din målmarknad, avsedd användning och tekniska krav så att tillämpligt dokumentationspaket kan bekräftas innan beställningen görs.
      icon: tabler:info-circle

