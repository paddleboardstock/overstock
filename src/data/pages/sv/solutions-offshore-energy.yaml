content_challenge:
  tagline: Utmaningen
  title: Offshore energikrav<br />Extrem miljöpålitlighet
  subtitle: Offshore-energiverksamhet pressar utrustning till det yttersta - extremt väder, avlägsna platser, kontinuerliga arbetscykler och nolltolerans för fel.
  paragraphs:
    - Offshoreenergiindustrin verkar i planetens mest krävande marina miljöer. Arbetsbåtar stödjer olje- och gasplattformar, installationer av havsbaserade vindkraftverk, undervattenskabeloperationer och marina byggprojekt — ofta på öppet hav med begränsade väderfönster. Utrustningsfel är inte bara kostsamma, de är farliga.
    - '**Säkerheten är högsta prioritet** — Personaltransportfartyg måste kunna operera säkert i sjötillstånd som skulle stoppa alla andra operationer. Stabilitet vid överföringspunkten, pålitliga motorprestanda i allt väder och robust konstruktion för upprepad förtöjning mot offshorekonstruktioner är obligatoriska krav.'
    - '**Allvädersförmåga är avgörande** — Havsbaserade vindparker och oljeplattformar opererar året runt. Arbetsbåtar måste prestera i hård sjö, stark vind och begränsad sikt. Dygnet runt-operationer kräver fullständig navigationsutrustning och pålitliga belysningssystem.'
    - '**Den havsbaserade vindkraftssektorn växer snabbt** — Tusentals nya turbiner installeras globalt, och var och en kräver regelbunden personaltransport, verktygstransport och underhållsstöd. Detta skapar en varaktig efterfrågan på specialbyggda personaltransportfartyg (CTV) och stödjande RIB:ar.'
    - Paddle Board Overstocks offshoreenergi-RIB:ar är konstruerade med förstärkta deep-V-skrov, tungt belastbara Hypalon-tuber, fullständig navigationsutrustning och säkerhetssystem utformade för de extrema förhållandena vid offshoreenergioperationer.
content_solution:
  tagline: Vår lösning
  title: Specialbyggda offshore RIB:er<br />För energiindustrin
  subtitle: Varje Paddle Board Overstock offshore energi RIB är designad för säker, pålitlig drift under extrema marina förhållanden - från Nordsjön till Sydostasien.
  list:
    - Förstärkt deep-V-skrov för prestanda i grov sjö och förutsägbara köregenskaper
    - Tungt belastbara Hypalon-tuber med UV- och kemikaliebeständighet för förlängd offshore-tjänst
    - Beslag i rostfritt stål 316 — ingen korrosion vid kontinuerlig exponering för saltvatten
    - 'Fullständig navigationsutrustning: GPS, radar, VHF, nattlig navigationsbelysning — standard på offshore-modeller'
    - Självlänsande däck för säker drift när sjön spolar in över däck
    - Flera motorkonfigurationer — enkel eller dubbel utombordsmotor för uppdragsredundans
    - Dragmast och tunga knapar för hantering av plattformar och bojar
    - Tubfärger med hög synlighet för identifiering på offshore-arbetsplatser
content_segments:
  tagline: Energiprofiler
  title: Offshore energilösningar<br />Efter applikationstyp
  subtitle: Olika offshore-energisektorer har unika krav på arbetsbåtar – från RIB:er för plattformsstöd till CTV:er för vindkraftsparker till undervattensinspektionsfartyg.
  items:
    - title: Offshore-stöd för olje- & gasplattformer
      subtitle: Besättningsöverföring, utrustningsförsörjning, plattformssäkerhet standby
      description: Olje- och gasplattformar kräver daglig besättningsbyte, transport av utrustning och försörjning samt säkerhetsberedskapstäckning. Arbetsbåtar måste fungera säkert runt plattformskonstruktioner, i starka strömmar och varierande sjötillstånd, och upprätthålla exakt stationshållning under personalöverföring via stege eller landgång. Den extrema miljön – kolväten, kemikalier, konstant saltspray – kräver korrosionsbeständig konstruktion och pålitlig prestanda.
      features:
        - Personalöverföringskonfiguration med säker instigningsgång och räcken
        - Korrosionsbeständiga Hypalon-tuber och beslag i rostfritt stål 316
        - Förstärkta slidlistor för frekvent kontakt med plattformens fenders
        - Självlänsande däck för oljigt vatten och kemisk spolning
        - Bränsletank med hög kapacitet för utökad operationell räckvidd offshore
        - Alternativ med dubbla motorer för uppdragkritisk redundans
    - title: Vindkraftverk till havs
      subtitle: Besättningsöverföring, turbinunderhåll, verktygstransport
      description: Offshorevind är den snabbast växande sektorn inom marin energi. Operatörer behöver besättningsöverföringsfartyg (CTVs) som säkert kan överföra tekniker till turbinaccessplattformar i sjöstater upp till 1,5 m signifikant våghöjd. Stabilitet under överföring, kapacitet i alla väder och tillförlitlig daglig drift är avgörande. Servicefartyg för vindkraftsparker fungerar enligt snäva scheman - eventuella stillestånd försenar idrifttagning eller underhåll av turbiner, vilket direkt påverkar energiproduktionsintäkterna.
      features:
        - Optimerad skrovform för stabil personalöverföring vid turbinbasen
        - Deep-V-ingång för bekväm färd i kort, vinddriven sjö och offshore-dyning
        - Fullständigt väderskydd — sluten konsol eller styrhytt för besättningens komfort
        - Däcksutrymme för verktyg, reservdelar och serviceutrustning
        - Nattoperationspaket för vinterpass med begränsat dagsljus
        - Tyst utombordsdrift för minimal bullerpåverkan på den marina miljön
    - title: Undervattenskabel & rörledningsstöd
      subtitle: Besiktning, underhåll, ROV-stöd, besiktning
      description: Undervattenskabel- och rörledningsoperatörer behöver arbetsbåtar för ruttinspektion, underhållsstöd, ROV-operationer och undersökningsuppgifter. Dessa fartyg kräver stabila plattformar för utplacering och återhämtning av undervattensutrustning, exakt manövrering för kabelspårning och tillförlitlig drift i kust- och offshoremiljöer. Båtstabilitet är avgörande för ekolods- och mätutrustningens noggrannhet.
      features:
        - Stabil plattform vid låg fart för kabelspårning och mätoperationer
        - Öppen däcklayout för utplacering av ROV:er, kabelspolar och mätutrustning
        - Monteringsplattor för utrustning för sonar, GPS och mätinstrumentation
        - Skrovdesign med lågt kölvatten för minimal påverkan på havsbotten vid inspektion
        - Precisionsmanövrering vid låg fart med responsiv utombordsstyrning
    - title: Marint ingenjörs- & byggnadsstöd
      subtitle: Personaltransport, materialförsörjning, dykstöd
      description: Marinteknikentreprenörer som arbetar med hamnkonstruktion, kustskydd och offshoreinstallationsprojekt behöver mångsidiga arbetsbåtar för personaltransport mellan byggfartyg och land, material- och verktygsförsörjning, dykstöd och platsundersökningar. Dessa båtar opererar i aktiva konstruktionszoner med flera fartyg, begränsat manöverutrymme och varierande sjöförhållanden. Hållbarhet och mångsidighet är av största vikt.
      features:
        - Multifunktionell däcklayout för personal, material och dykutrustning
        - Dykstege och fästen för utrustning vid dykoperationer
        - Tunga knapar och dragmast för manövrering på byggarbetsplatser
        - Robust Hypalon-konstruktion med motståndskraft mot byggavfall och nötning
        - Flexibla sittkonfigurationer — personalläge eller lastläge
