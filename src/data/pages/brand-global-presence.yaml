hero:
  tagline: Global Presence
  title: 'Serving 50+ Countries<br />Across Every Continent'
  subtitle: 'From European coastal patrol operators to Australian water sports distributors to Middle East rescue teams — Aquafarer boats are on the water worldwide.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer global marine manufacturing and distribution
stats:
  title: Global Reach
  stats:
    - title: Countries
      amount: '50+'
    - title: Export Markets
      amount: Europe, Americas, Asia, Middle East, Oceania
    - title: Production
      amount: Qingdao, China
    - title: US Warehouse
      amount: Montclair, CA
features3_markets:
  tagline: Key Markets
  title: 'Regional Expertise<br />for Local Requirements'
  subtitle: 'We understand that different markets have different regulatory requirements, preferences, and use cases.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europe & UK
      description: 'CE-certified products meeting EN ISO 6185 standards. Strong demand for RIBs, inflatable boats, and SUP boards across EU markets. UK distributors appreciate our quick turnaround.'
      icon: tabler:map-pin
    - title: North America
      description: 'US Coast Guard approved manufacturing. US warehouse in Montclair, CA for fast West Coast delivery. Growing demand for fishing boats, rescue craft, and recreational SUPs.'
      icon: tabler:map-pin
    - title: Australia & Oceania
      description: 'Strong market for RIB boats and inflatable tenders. Australian distributors value our Hypalon boats for UV resistance in harsh sun conditions. Quick shipping from our Asia facility.'
      icon: tabler:map-pin
    - title: Middle East
      description: 'Growing demand for patrol and rescue boats. Our aluminum-hull RIBs are popular with coast guard and security operators. Custom configurations for high-temperature environments.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribution Network
  title: 'Partnering with Distributors<br />Worldwide'
  subtitle: 'We work with established marine equipment distributors, OEM brands, and government procurement agencies.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerships
      description: 'Private label manufacturing for global water sports brands. We handle everything from design to production to drop-shipping.'
      icon: tabler:building
    - title: Distributor Network
      description: 'Authorized distributors in 20+ countries carry stock and provide local support. New distributor inquiries welcome.'
      icon: tabler:users
    - title: Government & Institutional
      description: 'Direct supply to coast guards, search and rescue organizations, and military procurement programs. Compliance with institutional procurement requirements.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Global Logistics & Support'
  subtitle: 'From factory to destination — we manage the entire supply chain.'
  items:
    - title: Shipping Options
      description: 'Sea freight (FOB Qingdao), air freight for urgent orders, and express courier for samples and spare parts.'
      icon: tabler:truck-delivery
    - title: US Warehouse
      description: 'Stock held in Montclair, CA for fast delivery across North America. West Coast: 2-3 days, Central: 3-4 days, East Coast: 4-5 days.'
      icon: tabler:building-warehouse
    - title: Spare Parts
      description: 'Genuine Aquafarer spare parts and consumables stocked year-round. Common parts ship within 24 hours.'
      icon: tabler:package
    - title: Technical Support
      description: 'Direct line to our engineering team for technical questions, repair advice, and refit support. We support boats we built 20 years ago.'
      icon: tabler:headset
cta:
  title: 'Want to become a distributor?'
  subtitle: 'We are actively expanding our distribution network. Contact our export team to discuss partnership opportunities.'
  actions:
    - variant: primary
      text: Partnership inquiry
      href: /contact
    - text: View our product range
      href: /products
