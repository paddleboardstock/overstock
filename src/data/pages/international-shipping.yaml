process_section:
  tagline: How Shipping Works
  title: From Our Warehouse to Your Door
  steps:
    - title: Quote With Freight Options
      description: Every quote itemizes the freight options for your destination — express and sea — with estimated transit times, so nothing is decided for you.
    - title: Quality Check and Pack
      description: Boards are 100% pressure-tested, then packed with pump, paddle, leash, fin, backpack, and repair kit — the same complete package we retail.
    - title: Dispatch From Weihai
      description: Your shipment leaves our logistics base with the freight method you chose and door-to-door tracking is shared with you the same day.
    - title: Customs Clearance
      description: We provide the commercial invoice and packing list you need for import. Import duties and taxes in your country are the importer's responsibility — see the customs section below.
    - title: Delivery and Inspection
      description: Inspect your delivery on arrival. If anything is damaged or missing, contact us with photos and your order number — see our lost and damaged policy below.
customs_section:
  tagline: Customs & Duties
  title: Customs Duties and Import Taxes
  subtitle: We keep freight responsibilities explicit rather than making vague promises. Here is exactly who is responsible for what.
  items:
    - title: What We Cover
      description: Your quote includes the freight cost to your destination, and we prepare and provide all export documents — commercial invoice, packing list, and shipment tracking.
    - title: What the Importer Covers
      description: Import duties, VAT/GST, and any destination-country taxes are payable by the importer (you or your business) according to your country's rules. We do not bundle vague tax promises into our freight quotes.
    - title: Customs Clearance Support
      description: Our paperwork is complete and consistent — correct HS codes, declared values, and board specifications — which is what keeps clearance smooth. If your broker or customs office needs extra documentation, we provide it.
    - title: Check Your Local Rates Before Ordering
      description: Duty rates on inflatable water sports equipment vary by country. Check your country's import rules or ask in your inquiry — our regional market guides include customs notes for key markets.
lost_damaged:
  title: Lost or Damaged Shipments
  description: Inspect your delivery when it arrives. In the rare case a board arrives damaged or a package is missing, contact us as soon as possible with your order number and clear photos of the packaging and the board. We assess every case individually — depending on the case that means a replacement part, a replacement board, or a refund for the affected item. Manufacturing defects are covered separately by our 2-Year SUP Warranty.
destinations_section:
  tagline: Where We Ship
  title: 50+ Countries and Counting
  description: We ship worldwide, with detailed guides for our key regional markets. Each market guide covers local customer types, shipping notes, and customs tips for that region.
  regions_label: Regional Guides
  countries_label: Country Guides
faq_section:
  title: Shipping FAQ
  items:
    - q: How long does express shipping take?
      a: Express transit time depends on the destination — we quote the estimated transit time for your country with every inquiry, before you commit to anything.
    - q: How long does sea freight take?
      a: Sea freight transit varies by destination port and sailing schedules. We quote an estimated window for your destination with your order, and you receive tracking once the shipment departs.
    - q: Which shipping method should I choose?
      a: Express for 1–3 boards, samples, or urgent restocks. Sea freight for 5–20 board wholesale orders where per-board cost matters more than speed. We quote both so you can compare.
    - q: Are import duties and taxes included in the shipping cost?
      a: No. Freight is quoted separately and import duties, VAT/GST, and destination taxes are the importer's responsibility under your country's rules. We provide complete, accurate paperwork to keep clearance smooth.
    - q: Do you ship to my country?
      a: We ship to 50+ countries. Check our regional and country guides below, or simply ask in your inquiry — we will confirm current service to your address.
    - q: Can I track my order?
      a: Yes. Every shipment — express or sea — includes door-to-door tracking that we share with you on the day of dispatch.
