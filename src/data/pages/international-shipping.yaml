hero:
  tagline: International Shipping
  title: International Shipping —<br />Express & Sea Freight to 50+ Countries
  subtitle: Every order ships from our Weihai, China logistics base. Choose express air freight for samples and urgent restocks, or consolidated sea freight for small-business wholesale orders.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP boards packed for international shipping
direct_answer: Paddle Board Overstock ships to more than 50 countries from Weihai, China. Express air freight carries 1–3 boards, sample orders, and urgent restocks; consolidated sea freight is the economical option for 5–20 board wholesale orders. Every shipment includes door-to-door tracking, and every board is 100% pressure-tested and packed with its full accessory kit before dispatch.
tldr_points:
  - "Express air freight: 1–3 boards, samples, urgent restocks — fastest option"
  - "Sea freight: 5–20 board wholesale orders — lowest per-board freight cost"
  - "Door-to-door tracking on every shipment to 50+ countries"
  - "Freight, insurance, customs clearance, and import duties are itemized in your quote — no vague all-in promises"
from_china:
  tagline: Shipping From China
  title: Where Orders Ship From
  description: All orders dispatch from our logistics base in Weihai, China — the heart of our production and warehousing operation. Weihai is a major coastal port city in Shandong province with direct sea and air freight connections, which keeps transit times and freight costs competitive to destinations across Asia, the Americas, Africa, Europe, and the Middle East.
modes_section:
  tagline: Two Options
  title: Express Shipping or Sea Freight
  subtitle: The right freight method depends on how fast you need the boards and how many you are ordering. Both options are quoted with every inquiry.
  express:
    name: Option A — Express Shipping
    best_for: Best for 1–3 boards, samples, and urgent restocks
    description: Air express gets small orders and sample boards to your door in days, not weeks. Ideal when you are testing a model before a bigger order, or restocking a best-seller mid-season.
    features:
      - 1–3 boards, single models, or mixed model samples
      - Fastest transit of the two options — quoted per destination
      - Door-to-door tracking with a major express carrier
      - 'Typical use: samples, urgent restocks, small first orders'
  sea:
    name: Option B — Sea Freight
    best_for: Best for 5–20 board wholesale and retailer orders
    description: Consolidated sea freight is the economical choice for small-business wholesale orders. Boards are packed together in one consolidated shipment from Weihai, keeping the per-board freight cost low.
    features:
      - 5–20 board retailer and wholesale orders
      - Lowest per-board freight cost of the two options
      - Consolidated packing — one shipment, one clearance
      - 'Typical use: seasonal restocks, mixed model wholesale orders'
