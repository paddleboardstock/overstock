hero:
  tagline: Partners & Distribution
  title: 'Become an Aquafarer Partner<br />— Global Distribution Network'
  subtitle: "Join Aquafarer's global partner network. We work with marine distributors, boat dealers, equipment retailers, and brand partners in 50+ countries."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer global partner and distributor network
content_programs:
  tagline: Partner Programs
  title: 'Partner Programs<br />Built for Growth'
  subtitle: 'Whether you are a distributor, dealer, or brand partner, Aquafarer offers programs designed to support your business.'
  columns: 3
  items:
    - title: 'Distributor Program'
      description: 'Exclusive territory distribution with volume pricing, marketing support, and direct factory access. Minimum commitment required based on territory size.'
      icon: tabler:world
    - title: 'Dealer Program'
      description: 'Direct dealer pricing, product training, marketing materials, and warranty support for retail locations and online stores.'
      icon: tabler:building-store
    - title: 'OEM/ODM Partnership'
      description: 'Full-service OEM and ODM manufacturing with custom branding, packaging, and product specifications. From concept to container.'
      icon: tabler:certificate
    - title: 'Brand Partnership'
      description: 'Co-branding, private label, and exclusive model programs for established brands in the marine and outdoor recreation space.'
      icon: tabler:stars
    - title: 'Government & Institutional'
      description: 'Preferred supplier programs for government agencies, coast guards, military, and humanitarian organizations. Tender-ready documentation.'
      icon: tabler:building-community
    - title: 'Resort & Rental Partner'
      description: 'Fleet pricing, consistent quality, and custom branding for resorts, diving centers, and rental operations worldwide.'
      icon: tabler:sun
content_benefits:
  tagline: Why Partner With Us
  title: 'Why Partners Choose Aquafarer'
  subtitle: 'Our partners benefit from real manufacturing capability, consistent quality, and responsive support.'
  list:
    - 'Direct Factory Access: Work directly with our manufacturing team — no middlemen. Get faster responses, better pricing, and full visibility into production.'
    - 'Customization Ready: Brand your products with custom colors, logos, packaging, and specifications. Minimum order quantities tailored to your market.'
    - 'Quality Guaranteed: ISO 9001 certified production with CE, UKCA, and BSCI compliance. Every product tested before shipping.'
    - 'Global Logistics: Shipping from Qingdao, China with FOB, CIF, and DDP options. US warehouse in Montclair, CA for North American distribution.'
    - 'Marketing Support: Product catalogs, photography, technical documentation, and digital assets to support your sales efforts.'
    - 'Training & Support: Product training for your sales team, technical support for your customers, and warranty service coordination.'
content_process:
  tagline: How to Become a Partner
  title: 'Simple Partnership Process'
  subtitle: 'Our partnership process is straightforward — designed to get you selling Aquafarer products quickly.'
  items:
    - title: 'Step 1: Submit Application'
      description: 'Complete our partner application form with your company profile, target market, and product interests.'
    - title: 'Step 2: Qualification Review'
      description: 'Our partnership team reviews your application and contacts you within 3 business days to discuss opportunities.'
    - title: 'Step 3: Agreement & Setup'
      description: 'Sign a partnership agreement, set up your account, and receive partner pricing, marketing materials, and product samples.'
    - title: 'Step 4: Training & Launch'
      description: 'Product training, sales support, and marketing collateral provided. You are ready to start selling.'
cta:
  title: 'Ready to become an Aquafarer partner?'
  subtitle: 'Apply for partnership and our team will respond within 3 business days.'
  actions:
    - variant: primary
      text: Apply for partnership
      href: /contact
    - text: View our products
      href: /products
