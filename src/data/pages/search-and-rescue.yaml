faqs:
  - question: What makes an inflatable boat suitable for search and rescue operations?
    answer: 'SAR inflatable boats must offer exceptional durability, stability, maneuverability in confined spaces, shallow-water capability, rapid deployment, and reliability in extreme conditions. Critical features include multiple independent air chambers for redundancy, high-visibility colors, reinforced rubbing strakes, and heavy-duty D-rings for equipment attachment.'
  - question: What materials does Paddle Board Overstock use for SAR inflatable boats?
    answer: 'We offer both Hypalon (CSM/Neoprene) and high-tensile PVC constructions. Hypalon is preferred for extreme-use SAR applications due to its superior UV resistance, chemical resistance (fuels, oils), abrasion resistance, and service life exceeding 20 years. All materials are marine-grade with multi-layer coatings.'
  - question: Can Paddle Board Overstock customize boats for specific SAR mission profiles?
    answer: 'Yes. We offer full OEM/ODM customization including high-visibility color schemes, console configurations, equipment mounting systems, stretcher provisions, dive ladder integration, communications system mounts, and fleet branding. Our engineering team works directly with rescue agencies.'
  - question: Are Paddle Board Overstock SAR boats US Coast Guard approved?
    answer: 'Yes, Paddle Board Overstock inflatable boats are US Coast Guard approved for manufacturing. Our factory holds relevant certification, and all standard models carry CE certification for EU market access.'
  - question: What is the typical lead time for SAR boat orders?
    answer: 'Standard production lead time is 30–45 days from order confirmation. Rush orders available for government and emergency service agencies. MOQ from 10 units for SAR specifications, with trial orders welcome for new agency partnerships.'
body: |
  <h2>A Commitment to Excellence in Life-Saving Missions</h2>
  <p>In search and rescue operations, there is no margin for error. The equipment deployed must be nothing short of exceptional, offering unwavering reliability, superior performance, and absolute safety in environments that are often perilous and unpredictable.</p>
  <p>Paddle Board Overstock was founded on the principle of producing perfect products — a philosophy that permeates every facet of our operations, from initial design concept to final delivery. Our inflatable boats, crafted up to 16 feet, are the culmination of rigorous engineering, premium-grade materials, and a manufacturing process governed by the strictest quality requirements at every critical juncture.</p>

  <h2>The Paddle Board Overstock Standard in Advanced Materials for SAR</h2>
  <p>The foundation of any reliable SAR inflatable boat lies in the quality of its construction materials. Extreme rescue conditions — abrasive shorelines, submerged debris, intense UV radiation, and chemical exposure — demand materials that offer uncompromising durability and longevity.</p>

  <h3>Hypalon (CSM/Neoprene): The Benchmark for Robustness</h3>
  <p>Hypalon has long been revered for its exceptional durability. Its superior resistance to UV rays, extreme temperatures, and a broad spectrum of chemicals makes it a traditional choice for commercial and military-grade applications. A properly maintained Hypalon boat can deliver an impressive service life often exceeding 20 years. At Paddle Board Overstock, we ensure only the highest-grade Hypalon is utilized, with rigorous quality control extending to coating consistency and base fabric integrity.</p>

  <h3>High-Tensile PVC: Engineered for Excellence</h3>
  <p>For applications prioritizing weight savings, Paddle Board Overstock utilizes marine-grade, high-tensile strength PVC with multiple layers of specially formulated coating. Our PVC fabrics offer extended UV protection guarantees exceeding 10 years. A cornerstone of our quality is the exclusive use of thermo-welded (RF) seams — eliminating the bond degradation risks associated with glued seams common in lesser constructions.</p>

  <h2>Design Philosophy for SAR Operations</h2>
  <p>SAR operations place unique demands on inflatable boat design. Paddle Board Overstock addresses these requirements through mission-specific engineering:</p>
  <ul>
    <li><strong>Multi-Chamber Redundancy:</strong> Multiple independent air chambers ensure the boat remains operational even if one chamber is compromised.</li>
    <li><strong>High-Visibility Configurations:</strong> International orange, yellow, or custom high-visibility color schemes for aerial and surface identification.</li>
    <li><strong>Reinforced Construction:</strong> Heavy-duty rubbing strakes, reinforced floor panels, and strengthened attachment points for towing and lifting.</li>
    <li><strong>Rapid Deployment Design:</strong> Optimized for quick inflation and launch — critical when every minute counts.</li>
    <li><strong>Stability at Rest:</strong> Wide beam designs provide exceptional stability for casualty recovery operations.</li>
  </ul>

  <h2>Essential Equipment Integration</h2>
  <p>SAR inflatable boats require integration of mission-critical equipment. Paddle Board Overstock designs our boats with dedicated mounting systems for:</p>
  <ul>
    <li>Outboard motors with sufficient power for planing speeds</li>
    <li>Navigation and communications equipment</li>
    <li>Search lights and emergency lighting systems</li>
    <li>Stretcher and medical equipment securing systems</li>
    <li>Dive ladders and recovery platforms</li>
    <li>Towing systems for disabled vessels</li>
  </ul>

  <h2>Quality Control & Testing for SAR-Grade Reliability</h2>
  <p>Every Paddle Board Overstock SAR boat undergoes rigorous testing before delivery, including 100% air-retention testing at pressures exceeding operating limits, seam peel verification, UV resistance validation, abrasion testing, and full systems inspection. Our quality lab operates independently from production and reports directly to management.</p>

  <h2>OEM/ODM for Rescue Agencies</h2>
  <p>Paddle Board Overstock works directly with government rescue agencies, fire departments, coast guard units, and maritime police to develop custom SAR boat solutions. Our OEM/ODM services include:</p>
  <ul>
    <li>Mission-specific design and engineering</li>
    <li>Custom color schemes and agency branding</li>
    <li>Specialized equipment integration</li>
    <li>Fleet standardization programmes</li>
    <li>Technical documentation and training materials</li>
    <li>Ongoing spare parts and warranty support</li>
  </ul>
