workshops:
  - title: SUP Board Production
    description: '4 parallel assembly lines for inflatable SUP boards. Each line can produce 50–80 boards per shift. Digital printing and screen printing stations run concurrently. Annual SUP capacity: 8,000+ boards.'
    output: '8,000+ SUPs/year'
  - title: RIB Boat Production
    description: 'Dedicated fiberglass hull workshop with 6 mould stations for RIB hulls up to 7.6 m. Tube welding and assembly area handles 3–5 RIBs simultaneously. Annual RIB capacity: 2,000+ boats.'
    output: '2,000+ RIBs/year'
  - title: Inflatable Boat & Dinghy
    description: 'Multi-purpose production lines for inflatable boats, kayaks, and dinghies. Hot-air welding stations, RF dielectric presses, and assembly workstations are reconfigured based on order mix. Annual capacity: 5,000+ units.'
    output: '5,000+ units/year'
  - title: Safety Equipment
    description: 'Separate clean-room production area for life vests and safety equipment. Dedicated sewing, foam insertion, and testing stations. Annual life vest capacity: 50,000+ units.'
    output: '50,000+ life vests/year'

oem_capacity:
  moq: 'SUP: 5–10 units | RIB: 2–5 units | Kayak/Dinghy: 10–20 units | Custom mould: 200+ units'
  lead_time: 'Standard 30–45 days. Sample 15–20 days. Rush available.'
  payment: 'T/T 30% deposit + 70% before shipment. L/C, Western Union accepted.'
