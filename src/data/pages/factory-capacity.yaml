hero:
  tagline: Production Capacity
  title: Manufacturing Capacity & Annual Output
  subtitle: 12,000 m² facility producing 15,000 boats per year with room to scale

intro: Aquafarer operates one of the largest dedicated inflatable boat manufacturing facilities in Qingdao, China. Our 12,000 m² factory is organized into six specialized workshops operating in parallel, giving us the capacity to produce 15,000 boats annually across SUP, kayak, dinghy, RIB, and safety equipment lines.

