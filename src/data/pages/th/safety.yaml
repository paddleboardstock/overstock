hero:
  tagline: ความปลอดภัย
  title: ความปลอดภัยและการทดสอบผลิตภัณฑ์
  subtitle: ผลิตภัณฑ์ทุก Paddle Board Overstock ชิ้นผ่านการทดสอบจากโรงงาน — ทดสอบด้วยแรงดัน 100% ที่แรงดันที่กําหนด 1.25 เท่า ปราศจากข้อบกพร่อง 99.3% — สําหรับการใช้งานเพื่อสันทนาการและมืออาชีพ
trust_bar:
  items:
    - value: 100%
      label: ชิ้นส่วนทดสอบแรงดัน
      sub: การสุ่มศูนย์ — ทุกหน่วย
    - value: 1.25x
      label: แรงดันเกิน
      sub: เก็บแรงดันไว้ 24-48 ชั่วโมง
    - value: 99.3%
      label: อัตราค่าขนส่งปราศจากข้อบกพร่อง
      sub: การจัดส่งย้อนหลัง 12 เดือน
    - value: -10°C
      label: กันน้ําเย็น
      sub: ตู้เก็บรักษาในฤดูหนาว
testimonial:
  quote: ผมตรวจสอบบันทึกการทดสอบแรงดันที่มากับบอร์ดและส่งอีเมลถึงฝ่ายสนับสนุนสองคําถามเกี่ยวกับการพองตัวในความร้อนของฤดูร้อนพวกเขาตอบด้วยตัวเลขจริงในวันเดียวกันนั่นมากกว่าที่ร้านไหนเคยทําให้ผมเสียอีก
  author: โซเฟีย มาร์เค็ตติ
  title: ผู้ซื้อที่ยืนยันแล้ว
  company: นักพายเรือชายฝั่ง
  location: อิตาลี
content_overpressure:
  tagline: ความปลอดภัยของแรงดัน
  title: แรงดันของแผ่นไม้<br />การจัดการในภูมิอากาศร้อน
  subtitle: แรงดันบอร์ดเป่าลมจะเพิ่มขึ้นตามอุณหภูมิการเข้าใจและจัดการแรงดันเกินจะช่วยปกป้องบอร์ดของคุณและรักษาความปลอดภัยในทุกเซสชัน
  items:
    - title: ทําไมความดันจึงเพิ่มขึ้น
      description: อากาศขยายตัวเมื่อมีความร้อนกระดานที่เป่าลมถึง 15 องศาที่ PSI 20°C สามารถไต่ระดับ 1-2 PSI องศาในแสงแดด 40°C — ฟิสิกส์เดียวกับที่ทําให้กระดานเย็นตอนเช้าแข็งตัวตอนเที่ยง
      icon: tabler:gauge
    - title: แรงดันใช้งานที่แนะนํา
      description: เติมลมที่ 12-15 PSI ตามที่พิมพ์ใกล้วาล์วช่วงที่มีน้ําหนักนี้สมดุลระหว่างความแข็งแรง ความปลอดภัย และอายุการใช้งานของรอยต่อ — มากกว่าไม่ดีกว่า
      icon: tabler:chart-bar
    - title: แนวปฏิบัติที่ดีที่สุดสําหรับสภาพอากาศร้อน
      description: เป่าลมให้ถึงปลายล่างของช่วงในวันที่อากาศร้อนปล่อยอากาศเล็กน้อยก่อนโดนแดดนาน และอย่าปล่อยให้กระดานที่เป่าลมเต็มที่ร้อนบนชายหาด
      icon: tabler:sun
    - title: การสัมผัสแสงแดดและการเก็บรักษา
      description: เก็บแผ่นไม้ให้มีร่มเงาและปล่อยตัวบางส่วนเมื่อไม่ได้ใช้งานใช้ถุงเก็บแผ่นไม้เพื่อป้องกัน UV ล้างและเช็ดให้แห้งก่อนม้วนเก็บรักษา
      icon: tabler:umbrella
    - title: ถ้ากระดานรู้สึกแข็งเหมือนหิน
      description: ปล่อยอากาศผ่านวาล์วจนกว่าแผ่นจะกลับสู่ช่วงที่กําหนดพกเกจไว้กับปั๊มเพื่ออ่านค่าที่แม่นยํา — แผ่นที่เป่าลมเกินไปจะทําให้รอยต่อเครียดโดยไม่จําเป็น
      icon: tabler:alert-circle
