hero:
  tagline: ความปลอดภัย
  title: มาตรฐานความปลอดภัยและการรับรอง
  subtitle: Paddle Board Overstock ทุกผลิตภัณฑ์ผ่านการทดสอบอย่างเข้มงวด และมีรุ่นที่ได้รับการรับรอง 64 CEรุ่นผ่านมาตรฐานความปลอดภัยสากลสําหรับการใช้งานเพื่อการพักผ่อนและมืออาชีพISOโรงงานที่ได้รับการรับรอง 9001
trust_bar:
  items:
    - value: CE 6185
      label: เรือเพื่อการพักผ่อนที่ได้รับการรับรอง
      sub: TÜV Rheinland ได้รับการทดสอบ
    - value: SOLAS
      label: ปฏิบัติตามมาตรฐานความปลอดภัยนอกชายฝั่ง
      sub: ยืนยันความลอยตัว 24 ชั่วโมง
    - value: ISO 9001
      label: การจัดการคุณภาพ
      sub: TÜV ไรน์แลนด์ผ่านการตรวจสอบ
    - value: 99.3%
      label: อัตราค่าขนส่งปราศจากข้อบกพร่อง
      sub: AQL 2.5 ต่อ ISO 2859
certifications:
  - title: CE การรับรอง (EU 2016/425)
    standard: ข้อบังคับ PPE (สหภาพยุโรป) 2016/425 |EN ISO 12402
    description: Paddle Board Overstock อุปกรณ์ความปลอดภัยทั้งหมดเป็นไปตามCEข้อกําหนดการทําเครื่องหมายภายใต้ข้อบังคับอุปกรณ์ป้องกันส่วนบุคคลของยุโรปผลิตภัณฑ์ทุกชิ้นได้รับการทดสอบอย่างอิสระโดย TÜV Rheinland ซึ่งเป็นหน่วยงานที่ได้รับแจ้งจากยุโรปเรือยางของเราและRIBsเป็นไปตามข้อกําหนดของข้อกําหนดเรือพักผ่อน 2013/53/EU (RCD) ประเภท C และ D
    body: CE การรับรองครอบคลุมข้อกําหนดด้านสุขภาพและความปลอดภัยที่จําเป็นสําหรับอุปกรณ์ลอยตัวส่วนบุคคลและเรือเป่าลมTÜV Rheinland ตรวจสอบโรงงานผลิตของเราทุกปีเพื่อยืนยันการปฏิบัติตามข้อกําหนดอย่างต่อเนื่อง
  - title: SOLAS — ความปลอดภัยของชีวิตในทะเล
    standard: SOLAS บทที่ III |รหัส LSA
    description: Life Vest Pro เป็นไปตามSOLASข้อกําหนดสําหรับปฏิบัติการทางทะเลและเชิงพาณิชย์ผ่านการทดสอบการลอยตัวตลอด 24 ชั่วโมง การเติมลมอัตโนมัติเมื่อจมน้ํา และประสิทธิภาพในสภาพทะเลถึงระดับ 5 ผ่านข้อกําหนดบทที่ 3 สําหรับเสื้อชูชีพบนเรือพาณิชย์
    body: การSOLASอนุมัติต้องผ่านการทดสอบอิสระโดยหน่วยงานที่ได้รับแจ้งเพื่อความลอยตัว ความแข็งแรง การมองเห็น และการเปิดใช้งานอัตโนมัติ Life Vest Pro ของเราได้รับSOLASการรับรองประเภทเต็มรูปแบบพร้อมการรับรอง MED
  - title: USCG ประเภท III / ประเภท V
    standard: 46 CFR ส่วนที่ 160 |USCGการอนุมัติ
    description: เสื้อชูชีพที่คัดเลือกผ่านPaddle Board Overstockมาตรฐานของหน่วยยามฝั่งสหรัฐฯ สําหรับอุปกรณ์ประเภท III (อุปกรณ์ช่วยลอยตัว) และประเภท V (ใช้พิเศษ)เหมาะสําหรับน่านน้ําที่มีที่กําบัง การล่องเรือชายฝั่ง และปฏิบัติการเชิงพาณิชย์ที่ต้องการ USCGPFD ที่ได้รับอนุมัติ
    body: การUSCGอนุมัติต้องผ่านการทดสอบโดยห้องปฏิบัติการอิสระที่ได้รับการรับรองจาก CG การอนุมัติประเภท V รวมถึงการออกแบบเป่าลมแบบไฮบริดที่ต้องเปิดใช้งานด้วยตนเองหรืออัตโนมัติ
  - title: BSCI การปฏิบัติตามกฎหมายทางสังคม
    standard: BSCI จรรยาบรรณของ amfori
    description: โรงงานของเราได้รับการตรวจสอบประจําปีภายใต้โครงการ Business Social Compliance Initiative BSCI() ของ amfori สิ่งนี้ตรวจสอบการปฏิบัติด้านแรงงานอย่างมีจริยธรรม ความปลอดภัยในที่ทํางาน ชั่วโมงการทํางานที่เป็นธรรม และการจัดการสิ่งแวดล้อมทั่วทั้งโรงงานผลิตขนาด 12,000 ตารางเมตรของเรา
    body: BSCI การปฏิบัติตามข้อกําหนดเป็นข้อกําหนดเบื้องต้นสําหรับผู้ค้าปลีกและผู้นําเข้าในยุโรปคะแนนปัจจุบันของเราBSCIคือ "C" (ดี) ซึ่งได้รับการตรวจสอบโดยSGS
  - title: REACH & RoHS การปฏิบัติตามข้อกําหนด
    standard: ข้อบังคับของสหภาพยุโรป REACH (EC) 1907/2006 |RoHSคําสั่ง 2011/65/EU
    description: PVC สารประกอบ กาว และการเคลือบที่ใช้ในPaddle Board Overstockผลิตภัณฑ์ทั้งหมดREACHเป็นไปตามข้อกําหนดด้านความปลอดภัยทางเคมีของสหภาพยุโรปและRoHSข้อจํากัดเกี่ยวกับสารอันตรายแผ่นข้อมูลความปลอดภัยของวัสดุ (MSDS) มีให้สําหรับแต่ละสายผลิตภัณฑ์
    body: REACH การปฏิบัติตามข้อกําหนดช่วยให้มั่นใจว่าไม่มีสาร SVHC ที่ถูกจํากัดเกินขีดจํากัดที่กําหนดการทดสอบในห้องปฏิบัติการของบุคคลที่สามอย่างสม่ําเสมอช่วยยืนยันความสอดคล้องอย่างต่อเนื่องสําหรับทุกล็อตการผลิต
  - title: ISO 9001:2015 การจัดการคุณภาพ
    standard: ISO 9001:2015 |ได้รับTÜVการรับรองจาก Rheinland
    description: ระบบการจัดการคุณภาพของเราได้รับISOการรับรอง 9001:2015 โดย TÜV Rheinland ครอบคลุมการออกแบบ การผลิต การทดสอบ และบริการหลังการขายการตรวจสอบการเฝ้าระวังประจําปีช่วยให้มั่นใจในการปรับปรุงและควบคุมกระบวนการอย่างต่อเนื่อง
    body: ISO การรับรอง 9001 ต้องมีนโยบายคุณภาพที่มีเอกสาร การตรวจสอบภายใน การทบทวนฝ่ายบริหาร ขั้นตอนการแก้ไข และบันทึกการผลิตที่สามารถตรวจสอบย้อนกลับได้
testimonial:
  quote: เราได้จัดหาอุปกรณ์ความปลอดภัยจากซัพพลายเออร์หลายรายทั่วเอเชียPaddle Board Overstockเป็นผู้ผลิตรายเดียวที่จัดเตรียมเอกสารครบถ้วน CE SOLAS ใบรับรอง และรายงานการทดสอบจากบุคคลที่สามล่วงหน้า — โดยไม่ต้องขออนุญาต
  author: เอริก ลินด์สตรอม
  title: เจ้าหน้าที่ความปลอดภัย
  company: การจัดหาทางทะเลบอลติก
  location: ฟินแลนด์
content_overpressure:
  tagline: ความปลอดภัยของแรงดันเกิน
  title: RIB แรงดันท่อ<br />การจัดการในภูมิอากาศร้อน
  subtitle: แรงดันท่อเป่าลมจะเพิ่มขึ้นตามอุณหภูมิการเข้าใจและจัดการแรงดันเกินช่วยป้องกันความเสียหายและรับประกันความปลอดภัยในการใช้งานในสภาพแวดล้อมเขตร้อนและทะเลทราย
  items:
    - title: วาล์วระบายแรงดัน Boyle
      description: Paddle Board Overstock RIB ท่อติดตั้งวาล์วระบายแรงดันเกินที่ระบายแรงดันเกินโดยอัตโนมัติเกินค่าสูงสุดที่กําหนดป้องกันความเครียดของรอยต่อและความเป็นไปได้ของท่อแตกจากการให้ความร้อนด้วยแสงอาทิตย์
      icon: tabler:gauge
    - title: การเปลี่ยนแปลงความดันตั้งแต่เช้าถึงเที่ยง
      description: ท่อที่เติมลมถึง 3.5 องศาเซลเซียสPSIที่ 20C อาจสูงถึง 4.5+ PSI องศาเซลเซียสที่ 40 องศาเซลเซียสควรเติมลมให้ถึงปลายล่างของช่วงที่แนะนําในสภาพอากาศร้อน และปล่อยให้วาล์วระบายแรงดันจัดการแรงดันส่วนเกิน
      icon: tabler:sun
    - title: แรงดันการใช้งานที่แนะนํา
      description: 'PVC หลอด: 3.0-3.5 PSI ขณะใช้งาน, 4.5 PSI Hypalon สูงสุด หลอด: 3.5-4.0 PSI ขณะใช้งาน, 5.0 สูงสุด PSI ทดสอบที่ระดับ 1.25x (4.4 PSI สําหรับPVC, 5.0 PSI สําหรับ) HypalonตามPaddle Board Overstockมาตรฐาน QC'
      icon: tabler:chart-bar
    - title: แนวทางปฏิบัติที่ดีที่สุดในการสัมผัสแสงแดด
      description: เก็บRIBsไว้ในที่ร่มเมื่อไม่ได้ใช้งานใช้UVฝาครอบป้องกันเพื่อการผูกเรือนานขึ้นตรวจสอบและปรับแรงดันท่อก่อนและหลังชั่วโมงแดดจัดห้ามเกินแรงดันสูงสุดที่กําหนด
      icon: tabler:umbrella
    - title: การลดความดันฉุกเฉิน
      description: หากท่อรู้สึกแน่นเกินไปหรือวาล์วระบายกําลังรั่ว ให้ปล่อยอากาศผ่านวาล์ว Halkey-Roberts หรือวาล์วทหารจนกว่าความดันจะกลับสู่ช่วงการทํางานพกเกจวัดแรงดันเพื่อการอ่านค่าที่แม่นยํา
      icon: tabler:alert-circle
