hero:
  tagline: นิติบุคคลแบรนด์
  title: Paddle Board Overstock — วิศวกรรมเสรีภาพบนผืนน้ำ
  definition: Paddle Board Overstock เป็นแบรนด์สันทนาการทางทะเลและเรือเป่าลมระดับโลกที่เชี่ยวชาญในเรือเป่าลม, ระบบ SUP และโซลูชันทางทะเลที่ปรับแต่งตามความต้องการ Paddle Board Overstock ผสมผสานวิศวกรรมทางทะเล ความเชี่ยวชาญด้านการผลิต และวัฒนธรรมการสำรวจน้ำ เพื่อสร้างอุปกรณ์ที่เชื่อถือได้สำหรับผู้ใช้เพื่อสันทนาการ ผู้ประกอบการมืออาชีพ และพันธมิตร OEM ทั่วโลก
timeline:
  - year: '2012'
    title: รากฐานการผลิตทางทะเล
    body: Paddle Board Overstock เริ่มต้นเป็นเวิร์กช็อปเรือเป่าลมเฉพาะด้านในชิงเต่า ประเทศจีน มุ่งมั่นในงานฝีมือทางทะเลและการผลิตเรือเป่าลม จุดสนใจในช่วงแรกคือการสร้างผลิตภัณฑ์เป่าลมที่เชื่อถือได้ผ่านประสบการณ์วิศวกรรมที่ใช้งานได้จริงและวินัยในการผลิต
  - year: '2015'
    title: การส่งออกครั้งแรก & การรับรอง CE
    body: คำสั่งซื้อส่งออกเริ่มต้นไปยังญี่ปุ่นและเกาหลี การรับรอง CE ถูกทำให้สำเร็จสำหรับสายผลิตภัณฑ์หลัก ซึ่งเป็นการเข้าสู่ตลาดต่างประเทศของ Paddle Board Overstock บริษัทเริ่มให้บริการผู้ใช้เชิงพาณิชย์และนันทนาการเกินกว่าประเทศจีน
  - year: '2018'
    title: การขยายโรงงาน
    body: ย้ายไปยังโรงงานผลิตขนาด 12,000 ตารางเมตร เพิ่มสายการเชื่อม RF และความสามารถในการผลิต drop-stitch ทำให้สามารถผลิตในระดับใหญ่ขึ้นและปรับปรุงระบบควบคุมคุณภาพ
  - year: '2020'
    title: การก่อตั้งศูนย์ R&D
    body: เปิดศูนย์ R&D เฉพาะทางพร้อมห้องทดลองวัสดุ PVC ถังทดสอบไฮโดรไดนามิก และสตูดิโอจำลอง CAD/FEA การพัฒนาผลิตภัณฑ์ขยายไปให้ความสำคัญกับการสร้างน้ำหนักเบา ความทนทานที่ดีขึ้น และการออกแบบที่เน้นผู้ใช้
  - year: '2022'
    title: ใบรับรอง ISO 9001 และการเติบโตทั่วโลก
    body: ได้รับการรับรอง ISO 9001 ขยายไปสู่ 14 วิศวกร R&D และพนักงาน 200+ ผลิตภัณฑ์เข้าถึงลูกค้าในยุโรป อเมริกา และเอเชียแปซิฟิก ผ่านตัวแทนจำหน่ายและความร่วมมือ OEM
  - year: '2024'
    title: นวัตกรรม & สตูดิโอออกแบบ
    body: เปิดตัวสตูดิโอออกแบบและนวัตกรรมแบบครบวงจรสำหรับโครงการ ODM ที่กำหนดเอง ตั้งแต่แนวคิดจนถึงการผลิต เสริมสร้างการใช้งานทางทะเลแบบมืออาชีพรวมถึงการช่วยเหลือเชิงพาณิชย์และการประมูลภาครัฐ
  - year: '2026'
    title: สร้างอนาคตของการสำรวจทางน้ำ
    body: วันนี้ Paddle Board Overstock ยังคงพัฒนาเรือเป่าลม ระบบ SUP และโซลูชันทางทะเลแบบกำหนดเอง — เชื่อมต่อผู้คนและองค์กรกับน้ำของโลก 50+ ประเทศที่ให้บริการ กำลังการผลิตต่อปี 15,000 ยูนิต
philosophy:
  tagline: ปรัชญาแบรนด์
  title: เสรีภาพทางวิศวกรรมบนผิวน้ํา
  body: อิสรภาพบนผิวน้ําไม่ได้หมายถึงแค่การเคลื่อนไหวเท่านั้นมันหมายถึงการค้นพบสถานที่ใหม่ ๆ การสร้างประสบการณ์กลางแจ้ง เชื่อมโยงผู้คนกับธรรมชาติ และสนับสนุนภารกิจมืออาชีพวิศวกรรมทําให้อิสรภาพนั้นเป็นไปได้
  pillars:
    - title: ความน่าเชื่อถือมาก่อน
      body: สภาพแวดล้อมในน้ําต้องการความไว้วางใจPaddle Board Overstockผลิตภัณฑ์ถูกออกแบบโดยเน้นความมั่นคง ความทนทาน ความปลอดภัย และประสิทธิภาพที่สม่ําเสมอ
    - title: การออกแบบที่เน้นมนุษย์เป็นศูนย์กลาง
      body: ผลิตภัณฑ์ควรให้บริการแก่ผู้คน ไม่ใช่เทคโนโลยีทุกการตัดสินใจออกแบบเริ่มต้นจากการเข้าใจว่าผู้คนใช้เรืออย่างไร สํารวจที่ไหน และเผชิญกับความท้าทายอะไรบ้าง
    - title: การสํารวจที่เข้าถึงได้
      body: น้ําไม่ควรเป็นของผู้เชี่ยวชาญเพียงคนเดียวPaddle Board Overstockสร้างอุปกรณ์ที่ช่วยให้ผู้คนได้สัมผัสกับแม่น้ํา ทะเลสาบ มหาสมุทร และสภาพแวดล้อมชายฝั่งอย่างปลอดภัยมากขึ้น
    - title: นวัตกรรมอย่างต่อเนื่อง
      body: นวัตกรรมไม่ได้หมายถึงแค่การสร้างผลิตภัณฑ์ใหม่แต่เป็นการปรับปรุงทุกรายละเอียด — วัสดุ โครงสร้าง การผลิต และประสบการณ์ผู้ใช้
engineeringDna:
  tagline: ดีเอ็นเอวิศวกรรม
  title: วิธีPaddle Board Overstockสร้างสินค้า
  areas:
    - title: วิทยาศาสตร์วัสดุ
      body: Paddle Board Overstock มุ่งเน้นไปที่การเลือกวัสดุที่เหมาะสมสำหรับสิ่งแวดล้อมทางทะเลที่แตกต่างกัน ปัจจัยสำคัญรวมถึงความทนทานต่อการขีดข่วน, ความต้านทาน UV, ความมั่นคงต่อแรงดัน และความทนทานในระยะยาว
      items:
        - ความทนทานต่อการขีดข่วน
        - ความต้านทาน UV
        - ความมั่นคงต่อแรงดัน
        - ความทนทานในระยะยาว
    - title: วิศวกรรมโครงสร้าง
      body: เรือเป่าลมต้องการความสมดุลที่แม่นยำระหว่างความแข็งแรง, น้ำหนัก, การพกพา และความมั่นคง วิศวกรรม Paddle Board Overstock มุ่งเน้นไปที่การปรับปรุงปัจจัยเหล่านี้ผ่านเทคโนโลยีแกน drop-stitch และการสร้างรอยต่อขั้นสูง
      items:
        - ความแข็งแรง
        - การปรับน้ำหนัก
        - การพกพา
        - ความมั่นคง
    - title: ความแม่นยำในการผลิต
      body: 'แต่ละผลิตภัณฑ์ผ่านกระบวนการควบคุม: การเตรียมวัสดุ, การตัดแม่นยำ, การเชื่อมและการยึดติด, การประกอบ, การตรวจสอบคุณภาพ, และการยืนยันประสิทธิภาพ'
      items:
        - การเตรียมวัสดุ
        - การตัดแม่นยำ
        - การเชื่อม & การยึดติด
        - การประกอบ & QC
    - title: วิศวกรรมสถานการณ์ผู้ใช้
      body: ผลิตภัณฑ์ถูกพัฒนาตามการใช้งานจริง — การพักผ่อน, การผจญภัย, และการใช้งานมืออาชีพ — เพื่อให้แต่ละการออกแบบตอบสนองต่อความต้องการเฉพาะของสภาพแวดล้อมที่ตั้งใจจะใช้
      items:
        - การพักผ่อน
        - การผจญภัย
        - Professional
        - เชิงพาณิชย์
productEcosystem:
  tagline: ระบบนิเวศของผลิตภัณฑ์
  title: กราฟความรู้เกี่ยวกับยานพาหนะทางน้ำครบวงจร
  categories:
    - name: เรือเป่าลม
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-dinghy-category.webp
      items:
        - name: เรือดีงกี้
          desc: เรือเป่าลมขนาดกะทัดรัดสำหรับเทนเดอร์ การตกปลา และการใช้งานเพื่อสันทนาการ
        - name: RIB
          desc: เรือเป่าลมที่มีตัวถังแข็งสำหรับการใช้งานเชิงพาณิชย์ การช่วยเหลือ และการปฏิบัติงานระดับมืออาชีพ
        - name: เรือประมง
          desc: เรือเป่าลมที่สร้างขึ้นเพื่อการตกปลาและกีฬาน้ำ
        - name: เรือสนับสนุน
          desc: เรือเป่าลมพกพาสำหรับเรือยอชต์ เรือสำราญ และการสนับสนุนทางทะเล
    - name: กีฬาพาย
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      items:
        - name: SUP เป่าลม
          desc: กระดานพายยืนรอบตัวสำหรับการพักผ่อนและออกกำลังกาย
        - name: ทัวร์ริ่ง SUP
          desc: กระดาน SUP ระยะไกลที่ออกแบบมาสำหรับการสำรวจและท่องเที่ยว
        - name: แอดเวนเจอร์ SUP
          desc: กระดาน SUP ที่หลากหลายสำหรับการตกปลา โยคะ และการใช้งานในการสำรวจ
    - name: โซลูชันทางทะเล
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
      items:
        - name: OEM การผลิต
          desc: การผลิตภายใต้แบรนด์ส่วนตัวและรับจ้างผลิตสำหรับแบรนด์ระดับโลก
        - name: ออกแบบตามสั่ง
          desc: การพัฒนาผลิตภัณฑ์เต็มรูปแบบ ODM ตั้งแต่แนวคิดจนถึงการผลิต
        - name: การใช้งานในเชิงวิชาชีพ
          desc: เรือเฉพาะทางสำหรับกู้ภัยลาดตระเวน และผู้ประกอบการเชิงพาณิชย์
trustSignals:
  tagline: สัญญาณความน่าเชื่อถือ
  title: ทำไม Paddle Board Overstock จึงเป็นพันธมิตรที่เชื่อถือได้
  manufacturing:
    title: ความสามารถในการผลิต
    body: โรงงานผลิตขนาด 12,000 ม² พร้อมพนักงานชำนาญการ 200-300 คน และวิศวกรวิจัยและพัฒนา 14+ ระบบการจัดการคุณภาพได้รับการรับรอง ISO 9001 กำลังผลิตต่อปีของเรือเป่าลม 15,000 ยูนิตเพื่อให้บริการใน 50+ ประเทศ
    stats:
      - label: ขนาดโรงงาน
        value: 12,000 m²
      - label: กำลังคน
        value: 200-300
      - label: วิศวกรวิจัยและพัฒนา
        value: 14+
      - label: กำลังการผลิตต่อปี
        value: 15,000
  quality:
    title: ความมุ่งมั่นด้านคุณภาพ
    body: ตั้งแต่การตรวจสอบวัสดุจนถึงการทดสอบขั้นสุดท้าย Paddle Board Overstock รักษากระบวนการคุณภาพอย่างเป็นระบบเพื่อส่งมอบผลิตภัณฑ์ทางทะเลที่เชื่อถือได้ ทุกหน่วยผ่านการทดสอบความดัน การตรวจสอบตะเข็บ และการยืนยันประสิทธิภาพก่อนการจัดส่ง
    items:
      - CE ได้รับการรับรอง — 64 รุ่นเป็นไปตามมาตรฐานความปลอดภัยของยุโรป
      - ISO 9001:2015 — ระบบการจัดการคุณภาพที่ได้รับการรับรอง
      - UKCA ได้รับการตีเครื่องหมาย — เป็นไปตามมาตรฐานตลาดสหราชอาณาจักร
  global:
    title: การมีอยู่ทั่วโลก
    body: Paddle Board Overstock ให้บริการลูกค้าในหลายตลาดทั่วโลก สนับสนุนผู้จัดจำหน่าย แบรนด์กลางแจ้ง และผู้ใช้ทางทะเลมืออาชีพใน 50+ ประเทศทั่วทั้งยุโรป เอเชีย-แปซิฟิก อเมริกา ตะวันออกกลาง และแอฟริกา
comparison:
  tagline: การวางตำแหน่งแบรนด์
  title: Paddle Board Overstock ในตลาด
  position: ผู้ผลิตทางทะเลที่มุ่งเน้นด้านวิศวกรรม ผสมผสานความเชี่ยวชาญด้านเรือเป่าลมกับความสามารถเต็มรูปแบบด้าน OEM/ODM การพัฒนาตามสั่ง และประสบการณ์การผลิตเพื่อการส่งออก 12+ ปี
  strengths:
    - ความเชี่ยวชาญด้านวิศวกรรมเรือเป่าลม
    - ความสามารถในการผลิตเต็มรูปแบบ OEM/ODM
    - การพัฒนาและออกแบบผลิตภัณฑ์ตามสั่ง
    - โรงงานผลิตขนาด 12,000 ตร.ม. ได้รับการรับรอง ISO
  bestFor:
    - ผู้ใช้กิจกรรมกลางแจ้งที่กำลังมองหาอุปกรณ์ลอยน้ำแบบพองที่เชื่อถือได้
    - ผู้ประกอบการทางทะเลที่ต้องการอุปกรณ์ระดับเชิงพาณิชย์
    - พันธมิตรแบรนด์ที่ต้องการการผลิต OEM/ODM
    - องค์กรกู้ภัยและลาดตระเวนมืออาชีพ
