hero:
  tagline: เมทริกซ์โซลูชันอุตสาหกรรม
  title: โซลูชันทางทะเลตามสถานการณ์<br />สำหรับการปฏิบัติการระดับมืออาชีพ
  subtitle: เรือบรรทุกน้ำแบบพองตัวที่ออกแบบมาอย่างมีจุดประสงค์และ RIBs ที่จัดเตรียมสำหรับการกู้ภัย การให้เช่า ฝูงเรือยอชท์ และการประมงเชิงพาณิชย์ — แต่ละลำมีข้อมูลทางเทคนิคและตัวเลือกการปรับแต่งรองรับ
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer โซลูชันทางทะเลขั้นมืออาชีพสำหรับอุตสาหกรรมที่หลากหลาย
direct_answer: 'Aquafarer จัดส่งยานน้ำเป่าลมที่ออกแบบตามสถานการณ์และโซลูชัน RIB สำหรับการปฏิบัติการทางทะเลเชิงพาณิชย์: เรือกู้ภัยและลาดตระเวนที่มีท่อ Hypalon เสริมแรงและระบบความปลอดภัยหลายห้อง, เรือเช่าและคายัค SUPs ที่มีวัสดุ PVC หนา 1.2 มม. และรอยต่อเชื่อมด้วยอากาศร้อนเพื่อความทนทานและบำรุงรักษาต่ำ, เรือเทนเดอร์ยอร์ชหรูหราที่มีตัวเรืออลูมิเนียมแบบ Deep-V RIBs, และการจัดเตรียมเรือตกปลาที่มีความทนทานสูงพร้อมที่ยึดเบ็ดและระบบถังเก็บปลา.'
solution_a:
  tagline: โซลูชัน A
  title: กู้ภัยทางทะเล &<br />ลาดตระเวนเชิงพาณิชย์
  subtitle: ความปลอดภัยหลายช่องความเร็วสูง RIBs สำหรับการตอบสนองฉุกเฉินและการบังคับใช้กฎหมายระดับมืออาชีพ
  badge: Heavy-Duty Series
  description: เรือกู้ภัยและลาดตระเวนทางทะเลของเราที่ RIBs ถูกสร้างด้วยท่ออากาศ Hypalon/PVC ความหนาแน่นสูงเสริมแรงที่มีการออกแบบลอยตัวแบบหลายห้องแยกอิสระ เรือแต่ละลำติดตั้งเทปสะท้อนแสงเกรดมืออาชีพ เส้นเชือกจับกู้ภัย และวาล์วเติมลมเร็วเพื่อพร้อมใช้งาน โครงไฟเบอร์กลาสแบบ Deep-V ให้ความมั่นคงเป็นพิเศษเมื่อเคลื่อนที่ด้วยความเร็วสูงและในทะเลที่มีคลื่นสูง
  features:
    - title: ความปลอดภัยหลายห้อง
      description: 4–6 ห้องอากาศอิสระ — การเจาะเพียงห้องเดียวทำให้ลอยตัวได้
    - title: ผ้าท่อเสริมแรง
      description: 1.2 มม. Hypalon CSM หรือ 1,680 DTEX PVC พร้อมตะเข็บเชื่อมด้วยอากาศร้อนสองชั้น
    - title: ระดับมืออาชีพ
      description: เทปสะท้อนแสง, เชือกช่วยชีวิต, ตะขอสำหรับลากเรือ, เชือกปล่อยเร็วสำหรับจิตรกร
    - title: ตัวเรือความเร็วสูง
      description: เรือที่มีตัวถังคาร์บอนไฟเบอร์หรืออลูมิเนียมแบบ Deep-V มีความเร็วสูงสุด 25–45 นอต ขึ้นอยู่กับการปรับแต่ง
  recommended_models:
    - RIB 450 ตรวจการณ์
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: วัสดุตัวเรือ
      value: ไฟเบอร์กลาส / อะลูมิเนียมเกรดทางทะเล
    - label: ผ้าท่อ
      value: 1.2 มม. Hypalon CSM / 1,680 DTEX PVC
    - label: ความเร็วสูงสุด
      value: 25–45 นอต
    - label: ความจุ
      value: 6–12 คน
    - label: ช่วงเครื่องยนต์
      value: 40–200 HP
    - label: การรับรอง
      value: CE / ISO 9001
solution_b:
  tagline: ทางออก B
  title: เช่าและกิจกรรมกีฬาทางน้ำ<br />อุปกรณ์กองเรือรีสอร์ท
  subtitle: ทนทานมาก ดูแลรักษาง่าย SUPs เป่าลม, เรือคายัค และเรือ ที่สร้างขึ้นเพื่อการให้เช่ารายวันในรีสอร์ต สโมสร และกิจกรรมท่องเที่ยว
  badge: Rental-Grade
  description: อุปกรณ์ในกองเรือให้เช่าของเราออกแบบมาเพื่อความทนทานสูงสุดและต้นทุนการบำรุงรักษาต่ำที่สุด เราใช้ PVC เสริมความหนา 1.2 มม. พร้อมเทคโนโลยีรอยต่อเชื่อมด้วยความร้อนสามชั้นที่ต้านทานการเสื่อมสภาพจาก UV และความเสียหายจากการชนบ่อย การก่อสร้าง Drop-stitch ช่วยให้บอร์ดคงความแข็งแรงแม้หลังจากรอบการให้เช่านับร้อย แบบทั้งหมดมาพร้อมกับ D-ring เสริม แถบรางทนต่อการสึกหรอ และวาล์วเกรดพาณิชย์
  features:
    - title: เกรดเชิงพาณิชย์ PVC
      description: 1.2 มม. เสริม PVC ด้วย UV ตัวปรับเสถียร — หนาถึง 3 เท่าของวัสดุระดับผู้บริโภค
    - title: รอยต่อที่เชื่อมด้วยลมร้อน
      description: การเชื่อมฟิวชันสามชั้น — แข็งแรงกว่าการเชื่อมด้วยกาว ทนต่อการลอกออก
    - title: Drop-Stitch ความแข็ง
      description: 1,680 DTEX แกน พร้อม 2 เธรด/ตารางนิ้ว — ระบุไว้ที่ 20 PSI สำหรับความแข็งเหมือนฮาร์ดบอร์ด
    - title: การออกแบบพร้อมสำหรับกองยาน
      description: ห่วง D แบบเสริมความแข็งแรง วาล์ว Halkey-Roberts สำหรับเชิงพาณิชย์ แถบรางทนต่อการเสียดสี
  recommended_models:
    - SUP ชีตาห์ ชาร์จ
    - SUP นักเดินเรือมหาสมุทร
    - AirDeck 360
    - RIB 330
  specifications:
    - label: วัสดุท่อ
      value: 1.0–1.2 มม. เสริม PVC
    - label: เทคโนโลยีรอยต่อ
      value: การเชื่อมด้วยอากาศร้อนสามชั้น
    - label: แรงดันสูงสุด
      value: 15–20 PSI (รุ่น drop-stitch)
    - label: UV การต้านทาน
      value: การทดสอบเร่งรัด 1,000+ ชั่วโมง
    - label: การรับประกัน
      value: 2–5 ปี ขึ้นอยู่กับรุ่น
    - label: การบำรุงรักษา
      value: น้อย — ล้างและเก็บ
solution_c:
  tagline: สารละลาย C
  title: เรือยอชต์เล็ก & เรือหรู<br />เรือเล็ก RIB ที่ออกแบบน้ำหนักเบาและมีประสิทธิภาพสูง สำหรับเก็บในซูเปอร์ยอชต์และขนส่งผู้โดยสารด้วยการตกแต่งและการออกแบบหรูหรา
  subtitle: เรือเล็กยอชต์ของเรา RIBs ผสมผสานการก่อสร้างน้ำหนักเบากับความงดงามหรูหรา ตัวเรืออลูมิเนียมหรือไฟเบอร์กลาสแบบ Deep-V ให้ประสบการณ์การขับขี่ที่ยอดเยี่ยมและง่ายต่อการยกด้วยเครน พร้อมทั้งสามารถเลือกกราฟิกท่อสีที่ตรงกัน เบาะหนังคุณภาพสูง และรูปแบบคอนโซลที่สั่งทำได้ ขนาดเก็บที่กะทัดรัดทำให้เหมาะกับโรงเก็บและพื้นที่บนดาดฟ้าในซูเปอร์ยอชต์
  badge: Premium Series
  description: การก่อสร้างน้ำหนักเบา
  features:
    - title: ตัวเรืออลูมิเนียมเกรดทางทะเล ลดน้ำหนักลง 30% เมื่อเทียบกับไฟเบอร์กลาส เพื่อความสะดวกในการยก
      description: สมรรถนะ Deep-V
    - title: ตัวเรือมีมุม Deadrise 18–22 องศา เพื่อการขับขี่ที่ราบรื่นในคลื่นและการติดตามที่ดี
      description: การตกแต่งหรูหรา
    - title: เบาะหนังสั่งทำ ท่อสีตรงกัน คอนโซลพวงมาลัยคุณภาพสูง ชุดสแตนเลส
      description: การเก็บแบบกะทัดรัด
    - title: ออกแบบสำหรับโรงเก็บซูเปอร์ยอชต์ — ท่อแบบพองลดขนาดสำหรับเก็บในพื้นที่จำกัด
      description: ประเภทตัวเรือ
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: อลูมิเนียม / ไฟเบอร์กลาสแบบ Deep-V
      value: มุม Deadrise
    - label: 18–22 องศา
      value: ความเร็วสูงสุด
    - label: ความเร็วสูงสุด
      value: 30–40 นอต
    - label: น้ำหนักแห้ง
      value: 120–350 กก. (ตัวเรืออลูมิเนียม)
    - label: พร้อมยกด้วยเครน
      value: ใช่ — จุดยกมาตรฐาน
    - label: การเก็บ
      value: ท่อแบบพองซ้อนกันได้
cta:
  title: ไม่แน่ใจว่าวิธีแก้ปัญหาแบบไหนเหมาะกับการดำเนินงานของคุณ?
  subtitle: อธิบายการใช้งานของคุณ สภาพแวดล้อมการทำงาน และความต้องการปริมาณ ทีมงานของเราจะแนะนำการกำหนดค่าที่เหมาะสมภายใน 48 ชั่วโมง
