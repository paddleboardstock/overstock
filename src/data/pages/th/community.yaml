stories:
  tagline: เรื่องราวนักสํารวจ
  title: การผจญภัยจริงจากคนจริง
  subtitle: ฟังประสบการณ์จากนักพายเรือ ครอบครัว และมืออาชีพที่ใช้Aquafarerเครื่องมือบนผิวน้ํา
  items:
    - name: ซาร่าห์ & ไมค์
      title: SUP เจ้าของ Explorer 11, แคนาดา
      content: เรานํา Explorer 11 ของเราไปเที่ยวหนึ่งสัปดาห์ผ่านอุทยาน Algonquin มันจัดการกับการขนของและข้ามทะเลสาบได้อย่างยอดเยี่ยมdrop-stitchโครงสร้างทําให้เราสามารถเติมลมได้ถึง 15 ปอนด์PSIและได้ประสิทธิภาพบนฮาร์ดบอร์ดจากบอร์ดที่บรรจุได้
      image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
      location: สวนอัลกอนควิน, แคนาดา
    - name: คาร์ลอส อาร์.
      title: Cheetah Surge rider, สเปน
      content: Cheetah Surge คือตัวเลือกหลักของผมสําหรับการล่องเรือชายฝั่งดีไซน์สดใสดึงดูดสายตาบนชายหาด และความมั่นคงทําให้ผมมั่นใจในคลื่นลมเบา ๆมันควบคุมได้อย่างสวยงามไม่ว่าจะเป็นทัวร์หรือแค่ชมพระอาทิตย์ตก
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
      location: คอสตา บราวา, สเปน
    - name: ลีน่า & ครอบครัว
      title: นักพาย Flowing Lotus, สวีเดน
      content: ผจญภัยกับครอบครัวในวันหยุดสุดสัปดาห์บนหมู่เกาะ Flowing Lotus มั่นคงพอให้ลูกสาวของฉันยืนได้ขณะที่ฉันพายเรือพองตัวได้ภายใน 10 นาที — ไม่ต้องใช้รถเทรลเลอร์ แค่ความสนุกของครอบครัวบนผิวน้ํา
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-flowing-lotus-1.webp
      location: หมู่เกาะสตอกโฮล์ม ประเทศสวีเดน
    - name: ร้อยโทผู้บังคับการอันเดรส
      title: Ocean Voyager explorer, ฟิลิปปินส์
      content: ผมใช้ Ocean Voyager สําหรับทัวร์ชายฝั่งระยะไกลรอบปาลาวันหลังจากใช้งานทุกวันในสภาพอากาศเขตร้อนมาหลายเดือน บอร์ดก็ยังทํางานได้เหมือนใหม่รูปทรงทัวร์ตัดผ่านคลื่นที่ขัดขวางบอร์ดที่ต่ํากว่าได้
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      location: ปาลาวัน, ฟิลิปปินส์
    - name: เอ็มม่า ที.
      title: นักท่องเที่ยว Tropical Breeze ครั้งแรก, ออสเตรเลีย
      content: ฉันไม่เคยขึ้น SUP มาก่อนเลย Tropical Breeze มีความมั่นคงมากจนฉันรู้สึกมั่นใจตั้งแต่ครั้งแรกที่ลอง ตอนนี้ฉันพายทุกวันสุดสัปดาห์ เส้นโค้งการเรียนรู้แทบจะเป็นศูนย์ — และกระดานดูก็ดูยอดเยี่ยมบนผิวน้ำ
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-tropical-breeze-1.webp
      location: โกลด์โคสต์, ออสเตรเลีย
