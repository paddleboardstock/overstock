features3_reasons:
  tagline: ทำไมต้องเลือก Paddle Board Overstock
  title: เจ็ดเหตุผลในการร่วมเป็นพันธมิตรกับเรา
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. การผลิตจริง ไม่ใช่การค้า
      description: เราครอบครองและดำเนินการโรงงานขนาด 12,000 ตารางเมตร เมื่อคุณเป็นพันธมิตรกับ Paddle Board Overstock คุณจะทำงานโดยตรงกับผู้ที่ออกแบบ วิศวกรรม และสร้างผลิตภัณฑ์ของคุณ — ไม่มีคนกลาง
      icon: tabler:building-factory
    - title: 2. แนวทางที่ขับเคลื่อนโดยวิศวกรรม
      description: กระบวนการออกแบบของเราเริ่มต้นจากกรณีการใช้งาน ไม่ใช่จากประเภทของผลิตภัณฑ์ เราปรับแต่งรูปทรงของตัวเรือ การเลือกวัสดุ และรูปแบบการจัดวางให้เหมาะสมกับวิธีการใช้งานเรือจริง ๆ
      icon: tabler:engine
    - title: 3. คุณภาพที่ได้รับการรับรอง
      description: CE ได้รับการรับรอง, ระบบคุณภาพ ISO, เป็นไปตามข้อกำหนด BSCI, เป็นไปตามข้อกำหนด REACH, ได้รับอนุมัติ USCG. รุ่นที่ได้รับการรับรอง CE ทั้ง 64 รุ่นของเราตรงตามมาตรฐานสากล — ไม่ใช่แค่คำกล่าวอ้าง
      icon: tabler:certificate
    - title: 4. ยืดหยุ่น OEM/ODM
      description: สีของท่อ, การจัดวางคอนโซล, การสร้างแบรนด์, บรรจุภัณฑ์ — เราปรับแต่งตามข้อกำหนดของคุณ ไม่มีแรงกดดันขั้นต่ำ เริ่มต้นด้วยต้นแบบ ขยายได้ด้วยความมั่นใจ
      icon: tabler:adjustments
    - title: 5. โลจิสติกส์ระดับโลก
      description: คลังสินค้าที่สหรัฐอเมริกาในแคลิฟอร์เนีย จัดส่งตรงจากชิงเต่า ขนส่งทางอากาศสำหรับคำสั่งซื้อด่วน เราดูแลเอกสารศุลกากรและเอกสารการจัดส่ง
      icon: tabler:truck-delivery
    - title: 6. การสนับสนุนตลอดชีพ
      description: เราสนับสนุนเรือที่เราสร้างขึ้นเมื่อ 20 ปีก่อน อะไหล่แท้ คำแนะนำด้านเทคนิค คู่มือการซ่อม — ทีมงานของเราพร้อมให้บริการเมื่อคุณต้องการ
      icon: tabler:lifebuoy
    - title: 7. ข้อกำหนดที่ซื่อสัตย์
      description: ค่ารับน้ำหนักจริง ขนาดจริง น้ำหนักจริง ไม่มีการโฆษณาเกินจริง สิ่งที่เราประกาศคือสิ่งที่คุณได้รับ — ผ่านการตรวจสอบโดยการทดสอบอิสระ
      icon: tabler:ruler-measure
testimonials:
  tagline: ได้รับความไว้วางใจจากแบรนด์ทั่วโลก
  title: สิ่งที่พันธมิตรของเราพูด
  items:
    - content: เราได้ทำงานกับผู้ผลิตหลายรายในประเทศจีน แต่ Paddle Board Overstock โดดเด่นในด้านการสนับสนุนทางวิศวกรรมและคุณภาพที่สม่ำเสมอ พวกเขาปฏิบัติต่อแบรนด์ของเราเสมือนเป็นของตนเอง
      name: — OEM พันธมิตร แบรนด์กีฬาทางน้ำยุโรป
    - content: เรือ Hypalon RIBs ของเขาให้บริการในกองเรือของเรามากกว่า 5 ปี การบำรุงรักษาน้อย ทนต่อ UV ได้อย่างยอดเยี่ยม การรับประกัน 5 ปีสำหรับท่อทำให้เรามั่นใจ
      name: — ผู้ให้บริการกองเรือ กลุ่มรีสอร์ทตะวันออกกลาง
    - content: ทีม Paddle Board Overstock ช่วยเราพัฒนาแบบกระดาน SUP ตามสั่งตั้งแต่แนวคิดจนถึงการผลิตภายใน 90 วัน คุณภาพเกินความคาดหมายของเรา
      name: — ผู้จัดจำหน่าย กีฬาทางน้ำออสเตรเลีย
cta:
  title: พร้อมสัมผัสความแตกต่างหรือยัง?
  subtitle: ติดต่อทีมงานของเราเพื่อพูดคุยเกี่ยวกับโครงการของคุณ ไม่จำเป็นต้องมีข้อผูกมัด — เพียงคำแนะนำที่ตรงไปตรงมาเกี่ยวกับการผลิต
  actions:
    - variant: primary
      text: พูดคุยกับทีมงานของเรา
      href: /contact
    - text: ดาวน์โหลดแคตตาล็อกสินค้า
      href: /resources
