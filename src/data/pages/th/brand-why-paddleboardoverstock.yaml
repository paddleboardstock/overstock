features3_reasons:
  tagline: ทำไมต้องเลือก Paddle Board Overstock
  title: เจ็ดเหตุผลในการร่วมเป็นพันธมิตรกับเรา
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. การผลิตจริง ไม่ใช่การค้า
      description: เราเป็นเจ้าของและดําเนินงานโรงงานขนาด 12,000 ตารางเมตรเมื่อคุณซื้อจาก Paddle Board Overstock คุณซื้อโดยตรงจากคนที่ออกแบบ วิศวกรรม และสร้างบอร์ดของคุณ — ไม่มีคนกลาง ไม่มีการบวกราคาขายปลีก
      icon: tabler:building-factory
    - title: 2. แนวทางที่ขับเคลื่อนโดยวิศวกรรม
      description: กระบวนการออกแบบของเราเริ่มต้นจากกรณีการใช้งาน ไม่ใช่หมวดหมู่สินค้าเราปรับแต่งรูปทรงตัวถัง การเลือกวัสดุ และการกําหนดค่าให้เหมาะสมกับการใช้งานจริงของบอร์ด
      icon: tabler:engine
    - title: 3. คุณภาพที่พิสูจน์แล้ว
      description: ทุกแผ่นไม้ผ่านการทดสอบแรงดัน 100% ที่ค่า 1.25x PSI ก่อนจัดส่งอัตราปราศจากข้อบกพร่อง 99.3% — วัดในทุกล็อต ไม่ใช่แค่การเคลม
      icon: tabler:shield-check
    - title: 4. การออกแบบให้คนพายเป็นอันดับแรก
      description: 'งานศิลปะบนดาดฟ้า ชุดสี ฐานอุปกรณ์เสริม และแพ็กเกจครบชุด — บอร์ดที่ออกแบบมาเพื่อการพายเรือจริง: ทัวร์ริ่ง โยคะ ตกปลา ฟิตเนส และความสนุกกับครอบครัว'
      icon: tabler:swimming
    - title: 5. โลจิสติกส์ระดับโลก
      description: จัดส่งตรงจากโรงงานของเราที่เว่ยไห่ไปยังผู้พายใน 50+ ประเทศ พร้อมการติดตามและดําเนินการศุลกากรอย่างครบถ้วน
      icon: tabler:truck-delivery
    - title: 6. การสนับสนุนตลอดชีพ
      description: เราสนับสนุนบอร์ดที่สร้างขึ้นเมื่อหลายปีก่อนอะไหล่แท้ คําแนะนําทางเทคนิค คําแนะนําการซ่อมแซม — ทีมงานของเราพร้อมให้บริการเมื่อคุณต้องการ
      icon: tabler:lifebuoy
    - title: 7. ข้อกำหนดที่ซื่อสัตย์
      description: ค่ารับน้ำหนักจริง ขนาดจริง น้ำหนักจริง ไม่มีการโฆษณาเกินจริง สิ่งที่เราประกาศคือสิ่งที่คุณได้รับ — ผ่านการตรวจสอบโดยการทดสอบอิสระ
      icon: tabler:ruler-measure
testimonials:
  tagline: ได้รับความไว้วางใจจากแบรนด์ทั่วโลก
  title: ความเห็นจากพันธมิตรของเรา
  items:
    - content: บอร์ดของผมมาถึงใหม่จากโรงงานพร้อมทุกอย่างในกล่องพายเรือสัปดาห์ละสองฤดูกาล และยังคงเก็บลมได้อย่างสมบูรณ์แบบ
      name: — ซาราห์ เอ็ม., นักพายเรือสุดสัปดาห์, ฟลอริดา
    - content: ผมเปรียบเทียบสเปกกันเป็นสัปดาห์ก่อนซื้อ Paddle Board Overstock เป็นแบรนด์เดียวที่เผยแพร่น้ําหนักจริงและแรงกดจริงสิ่งที่พวกเขาระบุคือสิ่งที่แสดงออกมา
      name: — Tomasz K., นักพายเรือทัวร์ริ่ง, โปแลนด์
    - content: ตอนนี้ทั้งครอบครัวพายกันหมดแล้วเราเริ่มจากบอร์ดเดียวและจบลงด้วยสี่บอร์ด — คุณภาพทําให้ตัดสินใจง่าย
      name: — แองเจลา อาร์., นักพายเรือครอบครัว, ออสเตรเลีย
cta:
  title: พร้อมสัมผัสความแตกต่างหรือยัง?
  subtitle: มีคําถามเกี่ยวกับขนาด สเปก หรือการจัดส่งไหม?ทีมพายของเราให้คําตอบอย่างตรงไปตรงมา — ไม่มีแรงกดดันในการขาย
