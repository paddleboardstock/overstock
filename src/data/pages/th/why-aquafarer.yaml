hero:
  tagline: ทำไม Aquafarer
  title: สร้างต่างอย่างสร้างสรรค์ สร้างเพื่อธุรกิจ<br />พันธมิตรเบื้องหลังการผจญภัยทางน้ำทั่วโลก
  subtitle: ไม่ใช่แค่ผู้ผลิต — แต่เป็นพันธมิตรทางธุรกิจที่ออกแบบ วิศวกรรม และส่งมอบอุปกรณ์ระดับการค้าให้กับคลับ รีสอร์ต ผู้ให้เช่า และแบรนด์น้ำที่กำลังเติบโต
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer คุณภาพและความเชี่ยวชาญด้านการผลิต
pillars:
  tagline: สามเสาหลักของความร่วมมือ
  title: ทำไมธุรกิจน้ำทั่วโลกถึงเลือก Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: ออกแบบเพื่อการใช้งานเชิงพาณิชย์
      description: อุปกรณ์ของเราได้รับการวิศวกรรมสำหรับการให้เช่าทุกวัน ไม่ใช่เพื่อสันทนาการในวันหยุดสุดสัปดาห์ PVC ระดับพาณิชย์ แกน drop-stitch เสริมแรง ตัวเลือก Hypalon ที่มั่นคง และฮาร์ดแวร์ที่ทดสอบในสนาม หมายถึงการบำรุงรักษาต่ำ อายุการใช้งานยาวนานขึ้น และประสิทธิภาพสูงกว่าในการดำเนินงานของคุณ
      icon: tabler:building-factory
      callToAction:
        text: ดูสายผลิตภัณฑ์เชิงพาณิชย์
        href: /products
    - title: จากแนวคิดสู่ตลาด
      description: 'เปิดตัวแบรนด์กีฬาทางน้ำของคุณใน 90 วัน เรานำคุณผ่านทุกขั้นตอน: การตรวจสอบแนวคิด การเลือกผลิตภัณฑ์ แบบจำลองต้นแบบ การผลิต การออกแบบบรรจุภัณฑ์ และการจัดส่งทั่วโลก ไม่มีแรงกดดันเรื่องการสั่งซื้อขั้นต่ำ — เริ่มเล็ก ขยายด้วยความมั่นใจ'
      icon: tabler:rocket
      callToAction:
        text: เริ่มต้นการเดินทางแบรนด์ของคุณ
        href: /oem-odm-blueprint
    - title: สร้างเพื่อสภาพแวดล้อมทั่วโลก
      description: 'ผลิตภัณฑ์ถูกปรับให้เหมาะกับทุกสภาพภูมิอากาศ: สูตร PVC สำหรับน้ำเย็นในยุโรป วัสดุกัน UV สำหรับตะวันออกกลางและออสเตรเลีย การรักษาต่อต้านความชื้นสำหรับเอเชียตะวันออกเฉียงใต้ การจัดส่งแต่ละครั้งถูกปรับให้เหมาะสมกับสภาพแวดล้อมปลายทาง'
      icon: tabler:world
stats:
  title: วางใจจากตัวเลข
  stats:
    - title: ปีในการประกอบธุรกิจ
      amount: ตั้งแต่ปี 2012
    - title: เรือที่สร้าง
      amount: 15,000+
    - title: ลูกค้ากลับมาใช้ซ้ำ
      amount: 85%
    - title: การเรียกร้องประกัน
      amount: <2%
reasons:
  tagline: ความแตกต่างของ Aquafarer
  title: สิ่งที่ทำให้เราต่าง
  isBeforeContent: false
  columns: 3
  items:
    - title: การผลิตจริง ไม่ใช่การค้า
      description: เรามีและดำเนินงานโรงงาน 12,000 ตร.ม. เมื่อคุณร่วมมือกับ Aquafarer คุณทำงานโดยตรงกับผู้ที่ออกแบบ วิศวกรรม และสร้างผลิตภัณฑ์ของคุณ — ไม่มีคนกลาง
      icon: tabler:building-factory
    - title: แนวทางการออกแบบที่มุ่งเน้นวิศวกรรม
      description: กระบวนการออกแบบของเราเริ่มจากกรณีการใช้งาน ไม่ใช่ประเภทผลิตภัณฑ์ เราปรับรูปทรงลำเรือ การเลือกวัสดุ และการจัดวางให้เหมาะสมกับการใช้งานในสภาพแวดล้อมเชิงพาณิชย์
      icon: tabler:engine
    - title: คุณภาพที่ได้รับการรับรอง
      description: ได้รับการรับรอง CE ระบบคุณภาพ ISO เป็นไปตาม BSCI เป็นไปตาม REACH เสื้อชูชีพ Type III/V ที่อนุมัติ USCG ผลิตภัณฑ์ทั้งหมดเป็นไปตามมาตรฐานสากลที่เกี่ยวข้อง
      icon: tabler:certificate
    - title: ความยืดหยุ่น OEM/ODM
      description: สีของท่อ, การจัดวางคอนโซล, การสร้างแบรนด์, การบรรจุภัณฑ์ — เราปรับแต่งตามข้อกำหนดของคุณ ไม่มีแรงกดดันให้สั่งขั้นต่ำ เริ่มต้นด้วยต้นแบบ แล้วขยายการผลิตด้วยความมั่นใจ
      icon: tabler:adjustments
    - title: โลจิสติกส์ทั่วโลก
      description: คลังสินค้าที่สหรัฐฯ ในแคลิฟอร์เนีย จัดส่งตรงจากชิงเต่า ขนส่งทางอากาศสำหรับคำสั่งด่วน เราจัดการเอกสารศุลกากรและเอกสารทั่วโลก
      icon: tabler:truck-delivery
    - title: การสนับสนุนตลอดอายุการใช้งาน
      description: เราสนับสนุนเรือที่เราสร้างเมื่อ 20 ปีก่อน อะไหล่แท้ คำแนะนำทางเทคนิค และแนวทางการซ่อม ทีมของเราพร้อมให้บริการเมื่อคุณต้องการ ไม่ว่าคุณจะอยู่ที่ไหน
      icon: tabler:lifebuoy
testimonials:
  tagline: ได้รับความไว้วางใจจากแบรนด์ทั่วโลก
  title: ความเห็นจากพันธมิตรของเรา
  items:
    - content: เราเคยทำงานกับผู้ผลิตหลายรายในจีน แต่ Aquafarer โดดเด่นด้วยการสนับสนุนด้านวิศวกรรมและคุณภาพที่สม่ำเสมอ พวกเขาปฏิบัติต่อแบรนด์ของเราเหมือนเป็นของตัวเอง
      name: — OEM พันธมิตร, แบรนด์กีฬาในน้ำยุโรป
    - content: Hypalon RIBs ของพวกเขาได้ให้บริการกับกองเรือของเรามากกว่า 5 ปี การบำรุงรักษาน้อย ความต้านทาน UV ดีเยี่ยม การรับประกันท่อ 5 ปีทำให้เรามีความมั่นใจ
      name: — ผู้ดำเนินกองเรือ, กลุ่มรีสอร์ตตะวันออกกลาง
    - content: ทีม Aquafarer ช่วยเราพัฒนาการออกแบบบอร์ด SUP แบบกำหนดเองจากแนวคิดจนถึงการผลิตภายใน 90 วัน คุณภาพเกินความคาดหมายของเรา
      name: — ผู้จัดจำหน่าย, กีฬาในน้ำออสเตรเลีย
    - content: ในฐานะเจ้าของธุรกิจขนาดเล็ก ฉันกังวลเกี่ยวกับ MOQs Aquafarer ทำงานร่วมกับงบประมาณของฉันและช่วยฉันเปิดตัวแบรนด์ด้วยเพียง 50 บอร์ด ตอนนี้ฉันสั่ง 500
      name: — ผู้ก่อตั้งแบรนด์, บริษัทให้เช่า SUP สหรัฐฯ
cta:
  title: พร้อมสร้างธุรกิจน้ำของคุณหรือยัง?
  subtitle: ติดต่อทีมของเราเพื่อปรึกษาฟรี ไม่มีข้อผูกมัด — เพียงคำแนะนำที่ซื่อสัตย์เกี่ยวกับอุปกรณ์และการผลิต
  actions:
    - variant: primary
      text: พูดคุยกับทีมของเรา
      href: /contact
    - text: ดาวน์โหลดแคตตาล็อกสินค้า
      href: /resources
