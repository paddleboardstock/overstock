hero:
  tagline: กระบวนการ
  title: กระบวนการผลิต
  subtitle: ตั้งแต่วัตถุดิบจนถึงกระดานพร้อมเดินทะเล — ทุกขั้นตอนอยู่ภายใต้การควบคุมของเรา
  back_label: กลับไปที่โรงงาน
  back_link: /factory
intro: แตกต่างจากแบรนด์ที่จ้างโรงงานภายนอกผลิต เป็น Paddle Board Overstock เจ้าของและดําเนินงานห่วงโซ่การผลิตทั้งหมดการบูรณาการในแนวตั้งนี้ช่วยให้เราสามารถควบคุมคุณภาพอย่างเข้มงวดในทุกขั้นตอน และส่งมอบผลิตภัณฑ์ที่มีคุณภาพสม่ําเสมอในแต่ละล็อตนี่คือวิธีการผลิตบอร์ดในโรงงานของเรา
steps:
  - step: '01'
    title: การรับและตรวจสอบวัสดุ
    description: ทุกล็อตผ้า PVC drop-stitch แกน EVA โฟม และฮาร์ดแวร์ที่เข้ามาจะถูกตรวจสอบตามข้อกําหนดตัวอย่างผ้าจะถูกทดสอบความแข็งแรง ความหนาสม่ําเสมอ และ UV ความต้านทานก่อนปล่อยสู่การผลิตวัสดุที่ไม่เป็นไปตามมาตรฐานจะถูกกักกันและส่งคืน
    duration: 1–2 วัน
  - step: '02'
    title: การตัดอัตโนมัติPVC
    description: ผ้าที่ได้รับอนุมัติจะถูกวางบน CNC เครื่องตัดอัตโนมัติและตัดด้วยความแม่นยําต่ํากว่ามิลลิเมตรการจัดเรียงที่ปรับแต่งด้วยคอมพิวเตอร์ช่วยจัดแผงให้ลดขยะ — โดยทั่วไปต่ํากว่า 5%แผงที่ตัดจะถูกติดป้ายตามรุ่นและห้อง จากนั้นจะมัดเพื่อส่งไปยังเวิร์กช็อปเชื่อม
    duration: 2–4 ชั่วโมงต่อชุดบอร์ด
  - step: '03'
    title: การซีลและเชื่อมด้วยความร้อนของท่อ
    description: แผงจะถูกตึงและยึดติดด้วยเครื่องซีลความร้อน พร้อมการเชื่อมด้วยอากาศร้อนที่อุณหภูมิควบคุมได้ 200–600 °C รอยต่อหลักถูกเสริมด้วยการเชื่อมต่อไดอิเล็กทริก RF เพื่อรอยต่อที่แน่นหนาและแข็งแรงห้องที่เสร็จสมบูรณ์จะถูกเป่าลมให้มีแรงดันทํางาน 1.25× เพื่อการตรวจสอบการกักเก็บอากาศภายใน 30 นาที
    duration: 1–2 วันต่อบอร์ด
  - step: '04'
    title: ศิลปะบนสำรับ & การตกแต่ง EVA
    description: 'แผ่นไม้ Art-series จะปรากฏตัวที่นี่: EVA แผ่นโฟมที่ตัดอย่างแม่นยําถูกวางเป็นลวดลายเต็มแผ่น ยึดติด และตกแต่งด้วยมือยึดเกาะ สบาย และทนทาน — ลักษณะเด่นของแผ่นไม้ Art-series ทุกตัว'
    duration: 1–2 วัน
  - step: '05'
    title: SUP การพิมพ์และการตกแต่ง
    description: SUP กราฟิกบนกระดานถูกนําไปใช้ด้วยการพิมพ์ดิจิทัลเพื่อออกแบบภาพสีเต็มรูปแบบ และการพิมพ์สกรีนสําหรับโลโก้ที่ทนทานและลวดลายซ้ําภาพพิมพ์ผ่านการบ่มและซีลเพื่อป้องกันการUVขีดข่วน
    duration: 1–2 วัน
  - step: '06'
    title: การประกอบขั้นสุดท้ายและการติดตั้งอุปกรณ์
    description: 'บอร์ดจะได้รับชิ้นส่วนสุดท้าย: วาล์วถูกขันและทดสอบการทํางาน, ติดตั้ง D-ring, มือจับ และกล่องครีบ และยึดสายจูงให้แน่นหนาบอร์ดแต่ละชุดจะปฏิบัติตามรายการตรวจสอบประกอบ 100 ข้อ พร้อมการอนุมัติที่จําเป็นในแต่ละขั้นตอน'
    duration: 2–3 วัน
  - step: '07'
    title: การทดสอบและตรวจสอบคุณภาพ
    description: 'บอร์ดที่เสร็จสมบูรณ์ทุกแผ่นจะต้องผ่านการทดสอบคุณภาพที่จําเป็น: การทดสอบการเก็บอากาศในห้อง การตรวจสอบการทํางานของระบบ การตรวจสอบแรงบิดของตัวยึด และการตรวจสอบรูปลักษณ์การสร้างแบบสั่งทําและต้นแบบยังได้รับการทดสอบในน้ําในทะเลเกี่ยวกับความเร็ว การควบคุม ความมั่นคง และความทนทาน'
    duration: 1–2 วัน
  - step: '08'
    title: บรรจุภัณฑ์ & การจัดส่ง
    description: แผ่นไม้จะถูกปล่อยลม ม้วน และบรรจุในกระเป๋าเป้เดินทางพร้อมปั๊ม ไม้พาย ครีบ สายจูง และชุดซ่อม จากนั้นบรรจุกล่องสําหรับจัดส่งโดยบริษัทขนส่งและขนส่งสินค้าแต่ละแพ็กเกจจะมีป้ายชื่อรุ่น หมายเลขซีเรียล และปลายทางเราจัดส่งไปยัง 50+ ประเทศทั่วโลก
    duration: 1 วัน
cta:
  title: ดูอุปกรณ์และเครื่องจักรของเรา
  desc: สํารวจอุปกรณ์ระดับอุตสาหกรรมที่อยู่เบื้องหลัง Paddle Board Overstock ทุกแผ่นบอร์ด
  label: ดูอุปกรณ์→
  link: /factory/equipment
tldr:
  summary: Paddle Board Overstock ใช้กระบวนการผลิตหลายขั้นตอนอย่างเข้มงวดตั้งแต่การตรวจสอบวัตถุดิบผ่านขั้นตอนการตัด การเชื่อม การประดับลวดลายบนพื้นเรือ และการตกแต่ง EVA การประกอบ การทดสอบแรงดันที่กำหนด 1.25 เท่า และการตรวจสอบคุณภาพขั้นสุดท้าย กระดานทุกชิ้นผ่านการทดสอบแรงดัน 100% และมีข้อบกพร่องเพียง 0.7%
  points:
    - 'การตรวจสอบวัตถุดิบ: การทดสอบแรงดึง ฉีกขาด UV'
    - การตัดอัตโนมัติ CNC และการเชื่อมด้วยคลื่นความถี่สูง RF
    - การประกอบด้วยมือ ลวดลายพื้นเรือ EVA โดยใช้บล็อกที่ไม่ซีดจาง
    - เก็บแรงดัน 1.25 เท่าเป็นเวลา 24-48 ชั่วโมงในแต่ละชิ้น
    - การตรวจสอบขั้นสุดท้าย 100 จุดในทุกกระดาน
