hero:
  tagline: กระบวนการ
  title: กระบวนการผลิต
  subtitle: ตั้งแต่วัตถุดิบจนถึงเรือพร้อมเดินทะเล — ทุกขั้นตอนอยู่ภายใต้การควบคุมของเรา
  back_label: กลับไปที่โรงงาน
  back_link: /factory
intro: แตกต่างจากแบรนด์ที่จ้างโรงงานภายนอกผลิต Aquafarer เป็นเจ้าของและดําเนินงานห่วงโซ่การผลิตทั้งหมดการบูรณาการในแนวดิ่งนี้ช่วยให้เราสามารถควบคุมคุณภาพอย่างเข้มงวดในทุกขั้นตอน ตอบสนองความต้องการเฉพาะได้อย่างรวดเร็ว และส่งมอบสินค้าคุณภาพสม่ําเสมอในแต่ละชุดนี่คือวิธีการสร้างเรือในโรงงานของเรา
steps:
  - step: '01'
    title: การรับและตรวจสอบวัสดุ
    description: ทุกล็อตPVCผ้า แผ่นไฟเบอร์กลาส เรซิน และฮาร์ดแวร์ที่เข้ามาจะถูกตรวจสอบตามข้อกําหนดตัวอย่างผ้าจะถูกทดสอบความแข็งแรงของแรงดึง ความหนาสม่ําเสมอ และUVความต้านทานก่อนปล่อยสู่การผลิตวัสดุที่ไม่เป็นไปตามมาตรฐานจะถูกกักกันและส่งคืน
    duration: 1–2 วัน
  - step: '02'
    title: การตัดอัตโนมัติPVC
    description: ผ้าที่ได้รับอนุมัติจะถูกวางบนCNCเครื่องตัดอัตโนมัติและตัดด้วยความแม่นยําระดับมิลลิเมตรการจัดเรียงที่ปรับแต่งด้วยคอมพิวเตอร์ช่วยจัดแผงให้ลดขยะ — โดยทั่วไปต่ํากว่า 5%แผงที่ตัดจะถูกติดป้ายตามรุ่นเรือและห้อง จากนั้นจะนําไปรวมเพื่อส่งต่อไปยังเวิร์กช็อปเชื่อม
    duration: 2–4 ชั่วโมงต่อชุดเรือ
  - step: '03'
    title: การซีลและเชื่อมด้วยความร้อนของท่อ
    description: แผงจะถูกตึงและยึดติดด้วยเครื่องซีลความร้อน พร้อมการเชื่อมด้วยอากาศร้อนที่อุณหภูมิควบคุมได้ 200–600 °C รอยต่อหลักถูกเสริมด้วยการเชื่อมต่อไดอิเล็กทริก RF เพื่อรอยต่อที่แน่นหนาและแข็งแรงห้องที่เสร็จสมบูรณ์จะถูกเป่าลมให้มีแรงดันทํางาน 1.25× เพื่อการตรวจสอบการกักเก็บอากาศภายใน 30 นาที
    duration: 1–2 วันต่อเรือ
  - step: '04'
    title: RIB การขึ้นรูปตัวเรือไฟเบอร์กลาส
    description: RIB ตัวเรือผลิตโดยใช้การขึ้นรูปไฟเบอร์กลาสด้วยมือชั้นของแผ่นไฟเบอร์กลาสและผ้าทอแบบโรวิงจะถูกรีดด้วยมือด้วยเรซินโพลีเอสเตอร์หรือไวนิลเอสเตอร์ในแม่พิมพ์ความแม่นยําแต่ละชั้นถูกบรรจุในถุงสุญญากาศเพื่อคุณภาพลามิเนตที่สม่ําเสมอตัวเรือเคลือบด้วยเจลโค้ทเพื่อให้ผิวเรือเงางามUVและทนต่อการรั่วไหลทางทะเล
    duration: 2–4 วันต่อลําเรือ
  - step: '05'
    title: SUP การพิมพ์และการตกแต่ง
    description: SUP กราฟิกบนกระดานถูกนําไปใช้ด้วยการพิมพ์ดิจิทัลเพื่อออกแบบภาพสีเต็มรูปแบบ และการพิมพ์สกรีนสําหรับโลโก้ที่ทนทานและลวดลายซ้ําภาพพิมพ์ผ่านการบ่มและซีลเพื่อป้องกันการUVขีดข่วน
    duration: 1–2 วัน
  - step: '06'
    title: การประกอบขั้นสุดท้ายและการติดตั้งอุปกรณ์
    description: ตัวเรือไฟเบอร์กลาสและPVCชุดท่อถูกประกอบบนสายการผลิตเครื่องยนต์ถูกติดตั้ง ระบบควบคุมพวงมาลัยและคันเร่งเชื่อมต่อกัน ระบบเชื้อเพลิงติดตั้ง และสายไฟไฟฟ้าทั้งหมดถูกเดินสายเรือแต่ละลําปฏิบัติตามรายการตรวจสอบการประกอบ 100 ข้อ พร้อมการอนุมัติที่จําเป็นในแต่ละขั้นตอน
    duration: 2–3 วัน
  - step: '07'
    title: การทดสอบและตรวจสอบคุณภาพ
    description: เรือทุกลําที่เสร็จสมบูรณ์จะต้องผ่านการทดสอบคุณภาพที่บังคับ ได้แก่ การทดสอบการเก็บอากาศในห้อง การตรวจสอบการทํางานของระบบ การตรวจสอบแรงบิดของตัวยึด และการตรวจสอบรูปลักษณ์ภายนอกเรือที่สร้างแบบสั่งทําและต้นแบบยังได้รับการทดสอบในทะเลเกี่ยวกับความเร็ว การควบคุม ความมั่นคง และความทนทาน
    duration: 1–2 วัน
  - step: '08'
    title: บรรจุภัณฑ์ & การจัดส่ง
    description: เรือจะถูกลดลม พับตามขั้นตอน บรรจุในถุงทอหรือลังไม้อัดขนาดใหญ่ และบรรจุขึ้นเพื่อจัดส่งแต่ละแพ็กเกจจะมีป้ายชื่อรุ่น หมายเลขซีเรียล และปลายทางเราประสานงานกับผู้รับสินค้าสําหรับการขนส่งตู้คอนเทนเนอร์ FCL และ LCL ทั่วโลก
    duration: 1 วัน
