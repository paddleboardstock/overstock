hero_text:
  tagline: ติดต่อ
  title: ติดต่อเรา
contact_form:
  id: form
  title: ส่งข้อความถึงเรา
  subtitle: สำหรับคำถามเกี่ยวกับการสั่งซื้อ คำแนะนำเรื่องขนาด หรือการสนับสนุนผลิตภัณฑ์ ส่งข้อความถึงเรา เรายินดีตอบกลับภายในหนึ่งวันทำการ
  email_to: info@paddleboardoverstock.com
  submit_button: ส่งคำถาม → ขอใบเสนอราคา
  success_message: ขอบคุณ! ข้อความของคุณได้ถูกส่งเข้ากล่องจดหมายของเราแล้ว เราจะตอบกลับภายในหนึ่งวันทำการ
  error_message: เกิดข้อผิดพลาดในการส่งข้อความของคุณ โปรดลองอีกครั้งหรือส่งอีเมลถึงเราโดยตรง
  default_country_code: '+1'
  captcha:
    label: 'ป้องกันสแปม: กรุณาแก้ปัญหาต่อไปนี้'
  fields:
    - name: ชื่อจริง
      label: ชื่อ
      row: 1
    - name: นามสกุล
      label: นามสกุล
      row: 1
    - name: ชื่อบริษัท
      label: ชื่อบริษัท
      row: 2
    - name: address
      label: ที่อยู่
      row: 3
    - name: zip
      label: รหัสไปรษณีย์ / รหัสโพสต์
      row: 4
    - name: country
      label: ประเทศ
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: อีเมล
      row: 5
      type: email
    - name: tel
      label: โทรศัพท์
      row: 5
      type: tel
      withCountryCode: true
    - name: ปริมาณการสั่งซื้อ
      label: ประมาณปริมาณการสั่งซื้อ
      row: 6
      type: select
      options:
        - value: ''
          label: คุณกำลังเลือกซื้อบอร์ดจำนวนกี่บอร์ด?...
        - value: one
          label: เพียง 1 บอร์ด
        - value: 2-4
          label: 2–4 บอร์ด
        - value: 5-plus
          label: 5+ บอร์ด (สำหรับครอบครัว, สโมสร, หรือให้เช่า)
    - name: customization
      label: เราสามารถช่วยอะไรคุณได้บ้าง?
      row: 7
      type: select
      options:
        - value: ''
          label: เลือกหัวข้อ...
        - value: none
          label: คำถามทั่วไปเกี่ยวกับผลิตภัณฑ์
        - value: sizing
          label: ช่วยเลือกบอร์ดที่เหมาะสม
        - value: order
          label: การสั่งซื้อ การชำระเงิน หรือการจัดส่ง
        - value: warranty
          label: การรับประกันหรือการสนับสนุนการซ่อม
    - name: ความสนใจของผลิตภัณฑ์
      label: หมวดหมู่ผลิตภัณฑ์ที่สนใจ
      row: 8
      type: select
      options:
        - value: ''
          label: เลือกหมวดหมู่ผลิตภัณฑ์...
        - value: all
          label: สินค้าทั้งหมด / แคตตาล็อกเต็ม
        - value: sup
          label: SUP กระดาน / กระดานพาย
        - value: packages
          label: แพ็กเกจ SUP ครบถ้วน
        - value: accessory
          label: อุปกรณ์เสริม (ปั๊ม, ไม้พาย, กระเป๋า)
    - name: subject
      label: เรื่อง
      row: 9
    - name: message
      label: ข้อความ
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: วิธีการติดต่อเราแบบอื่น
  columns: 3
  items:
    - title: ความช่วยเหลือในการสั่งซื้อ
      description: คำถามเกี่ยวกับผลิตภัณฑ์ คำแนะนำเรื่องขนาด และการสนับสนุนการสั่งซื้อ
      icon: tabler:shopping-bag
    - title: การสนับสนุนทางเทคนิค
      description: การรับประกัน, การซ่อม, ชิ้นส่วนอะไหล่ และคำถามเกี่ยวกับการใช้งาน
      icon: tabler:tool
    - title: สื่อและความร่วมมือ
      description: ชุดสื่อ, การสนับสนุน และความร่วมมือในอุตสาหกรรม
      icon: tabler:news
    - title: โทรศัพท์
      description: +1 279 732 3333 (สำนักงานใหญ่สหรัฐอเมริกา) · +86 13305324192 (โรงงาน)
      icon: tabler:headset
    - title: อีเมล
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: สำนักงานใหญ่ระดับโลก & การเรียกเก็บเงิน
      description: เว่ยไห่ ดงจี้เหลียน จำกัด
      icon: tabler:map-pin
map:
  title: ที่ตั้งของเรา
  subtitle: เยี่ยมชมศูนย์การผลิตของเราในเว่ยไห่
  address: เว่ยไห่ มณฑลซานตง ประเทศจีน
  zoom: 15
