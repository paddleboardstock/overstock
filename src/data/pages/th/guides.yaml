hero:
  tagline: คู่มือ
  title: ใหม่กับ SUP?
  subtitle: คู่มือปฏิบัติที่ช่วยคุณเลือก ใช้ และเพลิดเพลินกับอุปกรณ์กีฬาทางน้ำแบบเป่าลม
size_guide:
  tagline: ขนาดและสเปค
  title: หาขนาดที่เหมาะสมกับความต้องการของคุณ
  desc: เปรียบเทียบขนาดสินค้า ความจุน้ำหนัก และการใช้งานที่แนะนำ ไม่ว่าคุณจะต้องการ SUP สำหรับท่องเที่ยว คายัคขนาดกะทัดรัด หรือ RIB สำหรับธุรกิจ — คู่มือขนาดของเราช่วยคุณเลือกขนาดที่เหมาะสม
  link_label: คู่มือขนาดเต็มพร้อมสเปคสินค้า →
  link: /size-guide
  cards:
    - title: SUP กระดาน
      desc: เลือกความยาวตามน้ำหนักและการใช้งานที่ตั้งใจ บอร์ดกว้างขึ้น (32"+) ให้ความมั่นคงมากขึ้น บอร์ดยาวขึ้น (11–12 ฟุต) ติดตามเส้นทางได้ดีกว่าสำหรับการท่องเที่ยว
    - title: คายัค
      desc: คายัคเดี่ยว (9 ฟุต) สำหรับการเดินทางคนเดียวและแม่น้ำ คายัคคู่ (12 ฟุต) สำหรับผู้พายสองคนหรือหนึ่งคนพร้อมอุปกรณ์ ตรวจสอบความจุน้ำหนักเสมอ
    - title: เรือคายัคเล็ก & RIBs
      desc: เลือกความยาวตามจำนวนผู้โดยสารและการใช้งาน RIBs ขนาดใหญ่ (4.5 ม.+) สำหรับกลางทะเลและการกู้ภัย เรือคายัคเล็กขนาดเล็ก (2.7 ม.) สำหรับเรือสนับสนุนและแพตกปลา
