hero:
  tagline: คำแนะนำ
  title: ใหม่กับ SUP?
  subtitle: คู่มือปฏิบัติที่ช่วยคุณเลือก ใช้ และเพลิดเพลินกับอุปกรณ์กีฬาทางน้ำแบบเป่าลม
size_guide:
  tagline: ขนาดและสเปค
  title: หาขนาดที่เหมาะสมกับความต้องการของคุณ
  desc: เปรียบเทียบมิติของบอร์ด ความจุน้ำหนัก และการใช้งานที่แนะนำ ไม่ว่าคุณจะต้องการบอร์ดที่มั่นคงสำหรับทุกสถานการณ์หรือบอร์ดรูปทรงสำหรับการท่องเที่ยวที่เร็วขึ้น — คู่มือขนาดของเราช่วยให้คุณเลือกขนาดที่เหมาะสม
  link_label: คู่มือขนาดเต็มพร้อมสเปคสินค้า →
  link: /size-guide
  cards:
    - title: กระดานอเนกประสงค์ SUP
      desc: บอร์ดของเรายาวประมาณ 11 ฟุต (กว้าง 32 นิ้ว) มีความสมดุลระหว่างความมั่นคง ความเร็ว และความจุ แกนขนาด 6 นิ้ว drop-stitch ที่ 15 PSI ทำให้ดาดฟ้าแข็งแรงสำหรับนักพายทุกระดับ
    - title: ความกว้างและความมั่นคง
      desc: บอร์ดที่กว้างขึ้น (32") ให้ความมั่นคงมากขึ้นสำหรับผู้เริ่มต้น โยคะ และตกปลา ความหนา 6 นิ้ว เพิ่มความแข็งแรงและความสามารถในการรองรับน้ำหนักสำหรับผู้ขับขี่และอุปกรณ์
    - title: แพ็กเกจและอุปกรณ์เสริม
      desc: บอร์ดแต่ละชิ้นจัดส่งเป็นชุดสมบูรณ์ — บอร์ด, กระเป๋าเป้เดินทาง, ปั๊วมืือ, ไม้พายปรับได้, ครีบที่ถอดออกได้, สายคล้องขด และชุดซ่อม ตรวจสอบน้ำหนักสูงสุดสำหรับผู้ขี่รวมถึงอุปกรณ์
