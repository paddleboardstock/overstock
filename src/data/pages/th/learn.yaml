hero:
  tagline: ความรู้เกี่ยวกับการสำรวจน้ำ
  title: เรียน
  subtitle: |
    คู่มือ บทเรียน และการเจาะลึก — ทุกสิ่งที่คุณต้องการเพื่อสำรวจ<br />
    ว่ายน้ำด้วยความมั่นใจ ตั้งแต่การเลือก SUP ครั้งแรกของคุณไปจนถึงการเชี่ยวชาญเทคนิคขั้นสูง
  taglineSection: ความรู้สำหรับนักพายทุกคน ตั้งแต่ผู้เริ่มต้นจนถึงมืออาชีพ
featured:
  tagline: หัวข้อเด่น
  title: เริ่มการเดินทางแห่งการเรียนรู้ของคุณ
  subtitle: ไม่ว่าคุณจะเป็นมือใหม่ในกีฬาทางน้ำหรือกำลังมองหาวิธีพัฒนาฝีมือ คู่มือของเราพร้อมช่วยคุณ
  items:
    - title: SUP พื้นฐาน
      description: ทุกสิ่งที่ผู้เริ่มต้นจำเป็นต้องรู้ — ประเภทของกระดาน ขนาดไม้ตีท่า ยืน และเคล็ดลับวันแรก
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: กระดานเป่าลม vs กระดานแข็ง
      description: อันไหนเหมาะกับคุณ? เราเปรียบเทียบด้านความสะดวกในการพกพา ประสิทธิภาพ ความทนทาน และค่าใช้จ่ายแบบต่อเนื่อง
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: ความปลอดภัยทางน้ำ
      description: ความรู้ด้านความปลอดภัยที่จำเป็นซึ่งผู้พายเรือทุกคนควรมี — สภาพอากาศ เสื้อชูชีพ การช่วยเหลือตนเอง และอื่นๆ
      icon: tabler:shield
      href: /learn/water-safety
    - title: คู่มือวัสดุ
      description: PVC vs Hypalon, เทคโนโลยี drop-stitch, อัตราการปฏิเสธ — เข้าใจว่าอุปกรณ์ของคุณทำมาจากอะไร
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP คู่มือขนาด
      description: หาความยาว ความกว้าง และปริมาตรของบอร์ดที่เหมาะสมกับน้ำหนัก ความสามารถ และสไตล์การพายของคุณ
      icon: tabler:ruler
      href: /size-guide
    - title: เทคนิคระดับกลาง
      description: พัฒนาการพายของคุณด้วยท่าพายขั้นสูง เทคนิคการเลี้ยว และการรับมือกับน้ำที่ขรุขระ
      icon: tabler:ripple
      href: /learn/intermediate-techniques
