content_challenge:
  tagline: ความท้าทาย
  title: เรือซ่อมเรือยอชต์ต้องการ<br />การแสดงและการนําเสนอ
  subtitle: เรือยอชต์เทนเดอร์ไม่ใช่แค่เรือเล็ก — มันคือการขยายของเรือแม่และเป็นการแสดงถึงคุณภาพ
  paragraphs:
    - เจ้าของและกัปตันเรือยอชต์ต้องการเรือเทนเดอร์ที่มีประสิทธิภาพ เก็บของได้กะทัดรัด และนําเสนออย่างสวยงามเรือเทนเดอร์ควรเสริมความสวยงามของเรือยอชต์ พร้อมทั้งให้บริการขนส่งที่เชื่อถือได้สําหรับแขกและลูกเรือ
    - '**การเก็บของเป็นสิ่งสําคัญ** — รถเทนเดอร์ต้องวางบนดาดฟ้า ในโรงรถ หรือบนเครนน้ําหนักมีความสําคัญสําหรับระบบปล่อยและกู้คืนAquafarer RIBs ให้อัตราส่วนกําลังต่อน้ําหนักที่ยอดเยี่ยมด้วยโปรไฟล์เก็บของกะทัดรัด'
    - '**ความคาดหวังด้านสมรรถนะสูง** — ผู้โดยสารคาดหวังการขับขี่ที่นุ่มนวลและแห้งเมื่อถูกย้ายขึ้นฝั่งตัวเลือกเครื่องยนต์ต้องสมดุลระหว่างความเร็ว ระยะทาง และระดับเสียง เพื่อประสบการณ์ระดับพรีเมียมสําหรับการดําเนินงานเช่า เรือเทนเดอร์จะวิ่งทุกวันและต้องทนต่อการใช้งานบ่อยครั้ง'
    - '**รูปลักษณ์มีความสําคัญ** — เรือเทนเดอร์ที่ไม่เข้าชุดหรือสึกหรอจะลดทอนความสวยงามโดยรวมของเรือยอชต์สีท่อที่ปรับแต่ง เบาะ และแบรนด์ต่าง ๆ ทําให้เรือดูเหมาะสมกับตัวเอง'
content_solution:
  tagline: โซลูชันของเรา
  title: รูปแบบการประกวดราคา<br />สําหรับการใช้งานเรือยอชต์ทุกประเภท
  subtitle: Aquafarer RIB การยื่นมือสามารถปรับแต่งให้เหมาะสมกับเรือ ประเภทการปฏิบัติงาน และความต้องการจัดเก็บของคุณ — ตั้งแต่สเปกผู้สร้างซูเปอร์ยอชต์ไปจนถึงโปรแกรมกองเรือเช่า
  list:
    - สีท่อแบบกําหนดเองเพื่อให้เข้ากับหรือเสริมกับท่อแม่ — สี RAL ใดก็ได้ที่มีให้เลือกสําหรับHypalon PVC ท่อ
    - เบาะและเย็บแบบสั่งทํา — ไวนิลเกรดเรือพรีเมียมพร้อมการจับคู่สีและปักโลโก้
    - การควบคุมด้วยคอนโซลหรือพวงมาลัย — เลือกตามรูปแบบการใช้งานและความชอบของผู้ปฏิบัติงาน
    - ตัวเรือไฟเบอร์กลาสรูปตัววีลึก เพื่อการขับขี่ที่นุ่มนวลและแห้งในสภาพทะเลที่หลากหลาย
    - พื้นที่เก็บของขนาดกะทัดรัด — ช่องเก็บของแบบยุบหรือวางเป็นรูสําหรับโรงรถบนดาดฟ้า ตู้ล็อกเกอร์ หรือที่เก็บของบนเดวิท
    - Hypalon ท่อเพื่อUVความทนทานและรักษารูปลักษณ์ในระยะยาว
    - จุดยกและแหวนลากเป็นมาตรฐานในทุกรุ่น
    - มีฝาครอบโบว์ ฝาครอบเต็ม และที่ป้องกันการเสียดสี
    - 'ช่วงเครื่องยนต์: 15 HP ถึง 60 HP — แบบติดตั้งนอกเรือหรือแบบคันดิน'
    - OEM/ฉลากส่วนตัวมีให้สําหรับผู้สร้างเรือยอชต์และตัวแทนจําหน่ายทางทะเล
content_segments:
  tagline: โปรไฟล์ลูกค้า
  title: โซลูชันเรือยอชต์เทนเดอร์<br />แยกตามประเภทลูกค้า
  subtitle: อุตสาหกรรมเรือยอชต์แต่ละกลุ่มมีข้อกําหนดเฉพาะตัวAquafarerตั้งค่าการประกวดราคาให้เหมาะสมกับแต่ละการใช้งาน
  items:
    - title: ผู้สร้างซูเปอร์ยอชต์
      subtitle: การOEMประกวดราคา — ขนาด สี และวัสดุแบบกําหนดเอง
      description: 'ผู้สร้างเรือยอชต์ต้องเผชิญกับความท้าทายซ้ํา ๆ: เรือใหม่แต่ละลํามีข้อจํากัดด้านขนาด น้ําหนัก และความคาดหวังด้านความสวยงามที่แตกต่างกันเรือเทนเดอร์ต้องผสานเข้ากับระบบเครนเรือแม่อย่างสมบูรณ์แบบ ให้เข้ากับขนาดโรงรถที่แม่นยํา และสอดคล้องกับภาษาการออกแบบของเรือยอชต์มูลค่าหลายล้านยูโรความไม่ตรงกันใด ๆ — สีท่อผิด ตําแหน่งจุดยกผิด น้ําหนักไม่เข้ากัน — จะทําให้การส่งมอบล่าช้าและส่งผลเสียต่อผู้สร้างAquafarerทํางานโดยตรงกับทีมจัดซื้อและออกแบบของผู้สร้างเพื่อส่งมอบข้อเสนอที่มีสีท่อ RAL แบบกําหนดเอง เบาะที่เข้าชุด แผงคอนโซลที่มีแบรนด์ และOEMชุดเอกสารครบถ้วน'
      features:
        - ข้อกําหนดขนาดที่กําหนดเองให้ตรงกับข้อจํากัดของโรงรถและเดวิต
        - ปลอก RAL ทุกสีและเบาะที่เข้ากัน — มีตัวอย่างอนุมัติการออกแบบให้
        - OEM โลโก้บนคอนโซล ท่อ และพนักพิงเบาะ
        - การตรวจสอบจุดยกและค่ายลอยสําหรับแต่ละรุ่น
        - น้ําหนักตัวเรือที่ปรับแต่งให้เหมาะกับระบบการปล่อยและกู้คืนที่กําหนด
        - การจัดตารางการจัดส่งจํานวนมากสอดคล้องกับกําหนดเวลาการผลิต
    - title: บริษัทบริหารจัดการเรือยอชต์
      subtitle: การประกวดราคามาตรฐานตามกองเรือ — การสนับสนุนทั่วโลก เวลาหยุดทํางานน้อยที่สุด
      description: บริษัทบริหารจัดการดูแลเรือยอชต์หลายลําที่ให้บริการทั่วทะเลเมดิเตอร์เรเนียน แคริบเบียน แปซิฟิกใต้ และพื้นที่อื่น ๆความต้องการหลักของพวกเขาคือความน่าเชื่อถือ — หากเรือซ่อมเสียในท่าเรือห่างไกล ลูกเรือต้องทํางานล่วงเวลา มีแขกร้องเรียน และต้องเปลี่ยนอะไหล่ในนาทีสุดท้ายที่มีค่าใช้จ่ายสูงข้อกําหนดกองเรือมาตรฐานช่วยลดเวลาฝึกอบรมลูกเรือข้ามเรือและทําให้การจัดการอะไหล่ง่ายขึ้นAquafarerเสนอราคากองเรือหลายลํา ข้อกําหนดที่สอดคล้องกันในแต่ละคําสั่งซื้อ และการสนับสนุนอะไหล่ทั่วโลกสําหรับบริษัทบริหารจัดการที่มีเรือในหลายภูมิภาค
      features:
        - ข้อกําหนดมาตรฐานทั่วทั้งกลุ่มรถที่จัดการทั้งหมด
        - อะไหล่ที่สามารถเปลี่ยนได้ในทุกคันขนส่งของกองเรือ
        - ราคากลุ่มรถและส่วนลดปริมาณสําหรับคําสั่งซื้อหลายหน่วย
        - อะไหล่พร้อมให้บริการทั่วโลก — จัดส่งรวดเร็วไปยังทุกท่าเรือ
        - เอกสารบริการและบํารุงรักษาที่สม่ําเสมอสําหรับทีมงาน
        - การประสานงานการส่งมอบหลายหน่วยไปยังสถานที่ต่าง ๆ ของเรือ
    - title: ผู้ประกอบการเช่าเรือยอชต์
      subtitle: การใช้งานประจําวันความถี่สูง — ความทนทานโดยไม่ทําลายรูปลักษณ์
      description: 'เรือเช่าเรือต้องเผชิญกับตารางปฏิบัติการที่หนักหน่วงที่สุดในวงการเรือยอชต์: การโอนย้ายแขกทุกวัน การเดินทางขึ้นฝั่ง การสนับสนุนกีฬาทางน้ํา และการประมูลท่าเรือ — มักจะมีการดําเนินงานถึง 200+ ครั้งต่อฤดูกาลเช่าเรือเรือเช่าเหมาลําต้องดูสะอาดเอี่ยมในทุกการส่งมอบแขก พร้อมทั้งทนต่อการขึ้นเรืออย่างต่อเนื่อง การเผชิญน้ําเค็ม และชั่วโมงการทํางานของเครื่องยนต์การเสื่อมสภาพของรูปลักษณ์เป็นปัญหาทางธุรกิจโดยตรง — เรือซ่อมที่สึกหรอส่งผลต่อรีวิวของแขกและอัตราค่าเช่าเรือAquafarerออกแบบเรือเช่าเรือด้วยเบาะที่อัปเกรด Hypalon ท่อขนาดใหญ่ และพื้นที่จัดการที่เสริมความแข็งแรงเพื่อความทนทานระยะยาวที่รักษาคุณภาพการนําเสนอ'
      features:
        - Hypalon ท่อขนาดใหญ่ — อายุการใช้งาน 5-8 ปีในบริการเช่าเหมาลําประจําวัน
        - ขั้นบันไดขึ้นเรือและสายจับจับที่เสริมความแข็งแรงสําหรับการใช้งานบ่อยครั้ง
        - เบาะไวนิลกันคราบคุณภาพสูง — ทําความสะอาดง่ายระหว่างการเช่าเรือ
        - พื้นผิวดาดฟ้าที่ทําความสะอาดง่าย ไม่ลื่นไถล
        - แพ็กเกจนอกเรือที่เชื่อถือได้พร้อมการเข้าถึงบริการที่ง่าย เพื่อการส่งมอบที่รวดเร็ว
        - วัสดุเกรดความงามที่รักษารูปลักษณ์ได้ตลอดฤดูกาลเช่าเหมาลํา
    - title: ตัวแทนจําหน่ายและนายหน้าเรือยอชต์
      subtitle: การจัดหางานประกวดราคาที่เชื่อถือได้สําหรับการสร้างเรือและมูลค่าการขายต่อ
      description: ตัวแทนจําหน่ายและนายหน้าต้องการการประมูลคุณภาพที่มั่นคงซึ่งเสริมกับเรือที่ขาย — สอดคล้องกับตําแหน่งแบรนด์และยกระดับประสบการณ์ของผู้ซื้อการประมูลที่ไม่สม่ําเสมอหรือการล่าช้าในการจัดหาอาจทําให้การส่งมอบเรือล่าช้าหรือลดคุณภาพการนําเสนอในรายการตัวแทนจําหน่ายต้องการคุณภาพที่สม่ําเสมอในทุกล็อต ระยะเวลาส่งมอบที่เชื่อถือได้ และราคาที่แข่งขันได้เพื่อรักษากําไรAquafarerมีโปรแกรมสินค้าคงคลังสําหรับตัวแทนจําหน่าย พร้อมตารางการจัดส่งตามฤดูกาล ตัวเลือกการร่วมแบรนด์สําหรับการจัดแสดงในโชว์รูม และการจัดสรรลําดับความสําคัญในช่วงฤดูท่องเที่ยว
      features:
        - โปรแกรมการจัดเก็บสินค้าคงคลังพร้อมโมเดลพร้อมให้บริการตามความต้องการ
        - การจัดตารางการจัดส่งตามฤดูกาลสอดคล้องกับปฏิทินการส่งมอบ
        - การร่วมแบรนด์ตัวแทนจําหน่ายบนคอนโซลและหลอดสําหรับโชว์รูม
        - คุณภาพและข้อกําหนดที่สม่ําเสมอในทุกคําสั่งซื้อล็อต
        - ราคาตัวแทนจําหน่ายที่แข่งขันได้ด้วยระดับตามปริมาณ
content_benefits:
  tagline: ประโยชน์หลัก
  title: ทําไมAquafarerต้องเป็น<br />เรือซ่อมเรือยอชต์ของคุณ
  subtitle: ผู้ดูแลเรือยอชต์ระดับพรีเมียมที่ได้รับการคัดเลือกโดยเจ้าของซูเปอร์ยอชต์ ผู้สร้าง ผู้ประกอบการเช่าเรือ และตัวแทนจําหน่ายทั่วโลก
  list:
    - น้ําหนักเบาและกะทัดรัดเมื่อปล่อยลม — เก็บรักษาได้ง่ายในโรงรถ ล็อกเกอร์ หรือแท่นวางบนดาดฟ้า
    - Hypalon โครงสร้าง — UV ทนทานต่อการเก็บรักษาในมารีน่าในแสงแดดเขตร้อน
    - การนั่งรถที่มั่นคงและสะดวกสบายสําหรับการรับส่งของแขกในสภาพทะเลที่แตกต่างกัน
    - เบาะที่สั่งทํา สีท่อ และแบรนด์ที่ออกแบบมาให้เข้ากับเรือยอชต์ของคุณอย่างสมบูรณ์แบบ
    - 'ช่วงเครื่องยนต์นอกเรือ: 15 HP ถึง 60 HP สําหรับเรือเทนเดอร์และเรือเล็ก'
    - 'ระยะเวลาจัดส่งรวดเร็ว: 25-45 วันตั้งแต่สั่งซื้อจนถึงจัดส่งสําหรับการตั้งค่าการประกวดราคามาตรฐาน'
    - มีราคาสําหรับกองเรือสําหรับโปรแกรมบริษัทสร้างและบริหารจัดการเรือยอชต์หลายยูนิต
cta:
  title: ระบุข้อเสนอของคุณ
  subtitle: แจ้งให้เราทราบเกี่ยวกับเรือ การจัดจัดเก็บ และความต้องการรับส่งแขกของคุณ — เราจะแนะนําการจัดวางเรือเทนเดอร์ที่เหมาะสมที่สุดสําหรับการดําเนินงานของคุณ
  actions:
    - variant: primary
      text: กําหนดค่าการประกวดราคาของคุณ
      href: /contact
