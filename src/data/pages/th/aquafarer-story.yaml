timeline:
  - year: '2012'
    title: รากฐานการผลิตทางทะเล
    body: Aquafarer เริ่มต้นเป็นเวิร์กช็อปเรือเป่าลมเฉพาะด้านในชิงเต่า ประเทศจีน มุ่งมั่นในงานฝีมือทางทะเลและการผลิตเรือเป่าลม จุดสนใจในช่วงแรกคือการสร้างผลิตภัณฑ์เป่าลมที่เชื่อถือได้ผ่านประสบการณ์วิศวกรรมที่ใช้งานได้จริงและวินัยในการผลิต
  - year: '2015'
    title: การส่งออกครั้งแรก & การรับรอง CE
    body: คำสั่งซื้อส่งออกเริ่มต้นไปยังญี่ปุ่นและเกาหลี การรับรอง CE ถูกทำให้สำเร็จสำหรับสายผลิตภัณฑ์หลัก ซึ่งเป็นการเข้าสู่ตลาดต่างประเทศของ Aquafarer บริษัทเริ่มให้บริการผู้ใช้เชิงพาณิชย์และนันทนาการเกินกว่าประเทศจีน
  - year: '2018'
    title: การขยายโรงงาน
    body: ย้ายไปยังโรงงานผลิตขนาด 12,000 ตารางเมตร เพิ่มสายการเชื่อม RF และความสามารถในการผลิต drop-stitch ทำให้สามารถผลิตในระดับใหญ่ขึ้นและปรับปรุงระบบควบคุมคุณภาพ
  - year: '2020'
    title: การก่อตั้งศูนย์ R&D
    body: เปิดศูนย์ R&D เฉพาะทางพร้อมห้องทดลองวัสดุ PVC ถังทดสอบไฮโดรไดนามิก และสตูดิโอจำลอง CAD/FEA การพัฒนาผลิตภัณฑ์ขยายไปให้ความสำคัญกับการสร้างน้ำหนักเบา ความทนทานที่ดีขึ้น และการออกแบบที่เน้นผู้ใช้
  - year: '2022'
    title: การรับรอง & การเติบโตทั่วโลก
    body: ได้รับการรับรอง ISO 9001 ขยายไปสู่ 14 วิศวกร R&D และพนักงาน 200+ ผลิตภัณฑ์เข้าถึงลูกค้าในยุโรป อเมริกา และเอเชียแปซิฟิก ผ่านตัวแทนจำหน่ายและความร่วมมือ OEM
  - year: '2024'
    title: นวัตกรรม & สตูดิโอออกแบบ
    body: เปิดตัวสตูดิโอออกแบบและนวัตกรรมแบบครบวงจรสำหรับโครงการ ODM ที่กำหนดเอง ตั้งแต่แนวคิดจนถึงการผลิต เสริมสร้างการใช้งานทางทะเลแบบมืออาชีพรวมถึงการช่วยเหลือเชิงพาณิชย์และการประมูลภาครัฐ
  - year: '2026'
    title: สร้างอนาคตของการสำรวจทางน้ำ
    body: วันนี้ Aquafarer ยังคงพัฒนาเรือเป่าลม ระบบ SUP และโซลูชันทางทะเลแบบกำหนดเอง — เชื่อมต่อผู้คนและองค์กรกับน้ำของโลก 50+ ประเทศที่ให้บริการ กำลังการผลิตต่อปี 15,000 ยูนิต
content_founding:
  tagline: จุดเริ่มต้น
  title: เกิดในชายฝั่งน้ำ
  subtitle: 'Aquafarer เริ่มต้นในเวิร์กช็อปริมชายฝั่งในชิงเต่าด้วยเรือลำเดียวและวิสัยทัศน์: สร้างเรือเป่าลมที่สามารถรับมือกับสภาพทะเลจริงได้'
  paragraphs:
    - ในปี 2012 ผู้ก่อตั้งของเราเห็นช่องว่างในตลาด — เรือเป่าลมส่วนใหญ่จะถูกแต่เชื่อถือไม่ได้ หรือคุณภาพสูงแต่ราคาสูงเกินไป พวกเขาเชื่อว่ามีที่สำหรับผู้ผลิตที่มอบทั้งคุณภาพและคุณค่า
    - ตัวเรือลําแรกถูกสร้างด้วยมือ ทดสอบในน่านน้ําท้องถิ่น และปรับปรุงตามข้อเสนอแนะจริงจากชาวประมงและผู้ประกอบการเชิงพาณิชย์ขนาดเล็กวงจรป้อนกลับนี้ — สร้าง ทดสอบ ฟัง ปรับปรุง — ยังคงเป็นหัวใจของปรัชญาวิศวกรรมของเราจนถึงทุกวันนี้
    - ภายในปี 2015 ข่าวได้แพร่กระจายออกไปนอกชิงเต่าผู้จัดจําหน่ายระหว่างประเทศเริ่มขอตัวอย่างสินค้าสิ่งที่เริ่มต้นจากเวิร์กช็อปท้องถิ่น กําลังกลายเป็นผู้จัดหาระดับโลก
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer เวิร์กช็อปการผลิตและการผลิตในยุคแรก
content_growth:
  tagline: การเติบโตและนวัตกรรม
  title: จากเวิร์กช็อปสู่พื้นที่ 12,000 ตารางเมตร
  subtitle: การลงทุนอย่างต่อเนื่องในบุคลากร อุปกรณ์ และกระบวนการได้เปลี่ยนAquafarerเป็นโรงงานผลิตทางทะเลสมัยใหม่
  paragraphs:
    - เมื่อความต้องการเพิ่มขึ้น โรงงานของเราก็เพิ่มขึ้นตามไปด้วยเราขยายจากเวิร์กช็อปขนาดเล็กเป็นโรงงานขนาด 12,000 ตารางเมตร ที่มีสายการผลิตเฉพาะสําหรับRIBเรือ เรือเป่าลม SUP กระดาน และอุปกรณ์เสริม
    - เราลงทุนในCNCเครื่องตัด อุปกรณ์เชื่อมความถี่สูง สายการผลิตแบบดรอปสติช และแท่นทดสอบที่ครอบคลุม — ทําให้เราสามารถควบคุมทุกด้านของคุณภาพการผลิตได้
    - ปัจจุบัน ทีมงานของเราจํานวน 200-300 คนประกอบด้วยวิศวกรทางทะเล นักวิทยาศาสตร์วัสดุ ผู้เชี่ยวชาญด้านการควบคุมคุณภาพ และช่างฝีมือที่มีฝีมือ ซึ่งหลายคนทํางานมาAquafarerตั้งแต่ยุคแรกเริ่ม
founder:
  tagline: พบกับผู้ก่อตั้ง
  title: สร้างโดยคนงานน้ํา
  subtitle: ผู้ก่อตั้ง เดวิด เฉิน ผสมผสานความเชี่ยวชาญด้านการผลิตและความหลงใหลในกีฬาทางน้ําตลอดชีวิต — การผสมผสานนี้กําหนดแนวทางAquafarerการพัฒนาผลิตภัณฑ์
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: เดวิด เฉิน — ผู้ก่อตั้งAquafarer
  story:
    - เดวิด เฉิน เติบโตขึ้นที่ชายฝั่งชิงเต่า ซึ่งทะเลไม่ใช่จุดหมายปลายทางสําหรับวันหยุดแต่เป็นวิถีชีวิตเขาใช้ชีวิตวัยเยาว์พายเรือคายัค แล่นเรือใบ และตกปลาในทะเลเหลือง — ประสบการณ์ที่ทําให้เขาเข้าใจโดยสัญชาตญาณว่าเรือต้องอดทนต่ออะไร
    - ก่อนก่อตั้ง Aquafarerเดวิดใช้เวลาทศวรรษในสายการผลิตทางทะเล ทํางานด้านการผลิต คุณภาพ และการค้าระหว่างประเทศเขาบริหารOEMโปรแกรมสําหรับแบรนด์ยุโรปและอเมริกาเหนือ เรียนรู้มาตรฐานและความคาดหวังของตลาดโลกด้วยตนเอง
    - 'ในปี 2012 เขาก่อตั้งAquafarerด้วยภารกิจง่าย ๆ: สร้างเรือเป่าลมที่เขาไว้วางใจให้ครอบครัวของเขาลงเล่นน้ํามาตรฐานส่วนตัวนั้น — ผมจะใช้สิ่งนี้ไหม?— ยังคงเป็นการทดสอบขั้นสุดท้ายสําหรับทุกผลิตภัณฑ์ที่ออกจากโรงงาน'
    - ปัจจุบัน เดวิดเป็นผู้นําด้านกลยุทธ์ผลิตภัณฑ์และดูแลทีมวิจัยและพัฒนา โดยตรวจสอบการออกแบบใหม่และทดสอบต้นแบบในน่านน้ําใกล้ชิงเต่าด้วยตนเองเขาเชื่อว่าผลิตภัณฑ์ที่ยอดเยี่ยมเกิดจากการเข้าใจทั้งด้านวิศวกรรมและประสบการณ์
philosophy:
  tagline: ปรัชญาแบรนด์
  title: เสรีภาพทางวิศวกรรมบนผิวน้ํา
  body: อิสรภาพบนผิวน้ําไม่ได้หมายถึงแค่การเคลื่อนไหวเท่านั้นมันหมายถึงการค้นพบสถานที่ใหม่ ๆ การสร้างประสบการณ์กลางแจ้ง เชื่อมโยงผู้คนกับธรรมชาติ และสนับสนุนภารกิจมืออาชีพวิศวกรรมทําให้อิสรภาพนั้นเป็นไปได้
  pillars:
    - title: ความน่าเชื่อถือมาก่อน
      body: สภาพแวดล้อมในน้ําต้องการความไว้วางใจAquafarerผลิตภัณฑ์ถูกออกแบบโดยเน้นความมั่นคง ความทนทาน ความปลอดภัย และประสิทธิภาพที่สม่ําเสมอ
    - title: การออกแบบที่เน้นมนุษย์เป็นศูนย์กลาง
      body: ผลิตภัณฑ์ควรให้บริการแก่ผู้คน ไม่ใช่เทคโนโลยีทุกการตัดสินใจออกแบบเริ่มต้นจากการเข้าใจว่าผู้คนใช้เรืออย่างไร สํารวจที่ไหน และเผชิญกับความท้าทายอะไรบ้าง
    - title: การสํารวจที่เข้าถึงได้
      body: น้ําไม่ควรเป็นของผู้เชี่ยวชาญเพียงคนเดียวAquafarerสร้างอุปกรณ์ที่ช่วยให้ผู้คนได้สัมผัสกับแม่น้ํา ทะเลสาบ มหาสมุทร และสภาพแวดล้อมชายฝั่งอย่างปลอดภัยมากขึ้น
    - title: นวัตกรรมอย่างต่อเนื่อง
      body: นวัตกรรมไม่ได้หมายถึงแค่การสร้างผลิตภัณฑ์ใหม่แต่เป็นการปรับปรุงทุกรายละเอียด — วัสดุ โครงสร้าง การผลิต และประสบการณ์ผู้ใช้
engineeringDna:
  tagline: ดีเอ็นเอวิศวกรรม
  title: วิธีAquafarerสร้างสินค้า
  areas:
    - title: วิทยาศาสตร์วัสดุ
      body: Aquafarer มุ่งเน้นไปที่การเลือกวัสดุที่เหมาะสมสำหรับสิ่งแวดล้อมทางทะเลที่แตกต่างกัน ปัจจัยสำคัญรวมถึงความทนทานต่อการขีดข่วน, ความต้านทาน UV, ความมั่นคงต่อแรงดัน และความทนทานในระยะยาว
      items:
        - ความทนทานต่อการขีดข่วน
        - ความต้านทาน UV
        - ความมั่นคงต่อแรงดัน
        - ความทนทานในระยะยาว
    - title: วิศวกรรมโครงสร้าง
      body: เรือเป่าลมต้องการความสมดุลที่แม่นยำระหว่างความแข็งแรง, น้ำหนัก, การพกพา และความมั่นคง วิศวกรรม Aquafarer มุ่งเน้นไปที่การปรับปรุงปัจจัยเหล่านี้ผ่านเทคโนโลยีแกน drop-stitch และการสร้างรอยต่อขั้นสูง
      items:
        - ความแข็งแรง
        - การปรับน้ำหนัก
        - การพกพา
        - ความมั่นคง
    - title: ความแม่นยำในการผลิต
      body: 'แต่ละผลิตภัณฑ์ผ่านกระบวนการควบคุม: การเตรียมวัสดุ, การตัดแม่นยำ, การเชื่อมและการยึดติด, การประกอบ, การตรวจสอบคุณภาพ, และการยืนยันประสิทธิภาพ'
      items:
        - การเตรียมวัสดุ
        - การตัดแม่นยำ
        - การเชื่อม & การยึดติด
        - การประกอบ & QC
    - title: วิศวกรรมสถานการณ์ผู้ใช้
      body: ผลิตภัณฑ์ถูกพัฒนาตามการใช้งานจริง — การพักผ่อน, การผจญภัย, และการใช้งานมืออาชีพ — เพื่อให้แต่ละการออกแบบตอบสนองต่อความต้องการเฉพาะของสภาพแวดล้อมที่ตั้งใจจะใช้
      items:
        - การพักผ่อน
        - การผจญภัย
        - Professional
        - เชิงพาณิชย์
trustSignals:
  tagline: สัญญาณความน่าเชื่อถือ
  title: ทำไม Aquafarer จึงเป็นพันธมิตรที่เชื่อถือได้
  manufacturing:
    title: ความสามารถในการผลิต
    body: โรงงานผลิตขนาด 12,000 ม² พร้อมพนักงานชำนาญการ 200-300 คน และวิศวกรวิจัยและพัฒนา 14+ ระบบการจัดการคุณภาพได้รับการรับรอง ISO 9001 กำลังผลิตต่อปีของเรือเป่าลม 15,000 ยูนิตเพื่อให้บริการใน 50+ ประเทศ
    stats:
      - label: ขนาดโรงงาน
        value: 12,000 m²
      - label: กำลังคน
        value: 200-300
      - label: วิศวกรวิจัยและพัฒนา
        value: 14+
      - label: กำลังการผลิตต่อปี
        value: 15,000
  quality:
    title: ความมุ่งมั่นด้านคุณภาพ
    body: ตั้งแต่การตรวจสอบวัสดุจนถึงการทดสอบขั้นสุดท้าย Aquafarer รักษากระบวนการคุณภาพอย่างเป็นระบบเพื่อส่งมอบผลิตภัณฑ์ทางทะเลที่เชื่อถือได้ ทุกหน่วยผ่านการทดสอบความดัน การตรวจสอบตะเข็บ และการยืนยันประสิทธิภาพก่อนการจัดส่ง
    items:
      - CE ได้รับการรับรอง — 64 รุ่นเป็นไปตามมาตรฐานความปลอดภัยของยุโรป
      - ISO 9001:2015 — ระบบการจัดการคุณภาพที่ได้รับการรับรอง
      - UKCA ได้รับการตีเครื่องหมาย — เป็นไปตามมาตรฐานตลาดสหราชอาณาจักร
  global:
    title: การมีอยู่ทั่วโลก
    body: Aquafarer ให้บริการลูกค้าในหลายตลาดทั่วโลก สนับสนุนผู้จัดจำหน่าย แบรนด์กลางแจ้ง และผู้ใช้ทางทะเลมืออาชีพใน 50+ ประเทศทั่วทั้งยุโรป เอเชีย-แปซิฟิก อเมริกา ตะวันออกกลาง และแอฟริกา
comparison:
  tagline: การวางตำแหน่งแบรนด์
  title: Aquafarer ในตลาด
  position: ผู้ผลิตทางทะเลที่เน้นด้านวิศวกรรม ผสมผสานความเชี่ยวชาญด้านเรือเป่าลมกับความสามารถเต็มรูปแบบ OEM/ODM โซลูชันแบบกำหนดเอง และประสบการณ์การผลิตอย่างลึกซึ้ง
  strengths:
    - ความเชี่ยวชาญด้านวิศวกรรมเรือเป่าลม
    - ความสามารถในการผลิตเต็มรูปแบบ OEM/ODM
    - การพัฒนาและออกแบบผลิตภัณฑ์ตามสั่ง
    - 12,000 ตร.ม. ISO โรงงานผลิตที่ได้รับการรับรองมาตรฐาน ISO 9001
  bestFor:
    - ผู้ใช้กิจกรรมกลางแจ้งที่กำลังมองหาอุปกรณ์ลอยน้ำแบบพองที่เชื่อถือได้
    - ผู้ประกอบการทางทะเลที่ต้องการอุปกรณ์ระดับเชิงพาณิชย์
    - พันธมิตรแบรนด์ที่ต้องการการผลิต OEM/ODM
    - องค์กรกู้ภัยและลาดตระเวนมืออาชีพ
cta:
  title: พร้อมที่จะร่วมมือกับผู้ผลิต<br />ที่ใส่ใจในคุณภาพ?
  subtitle: ติดต่อทีมงานของเราเพื่อปรึกษาโครงการ OEM/ODM ของคุณ — ไม่มีแรงกดดันเรื่องการสั่งซื้อขั้นต่ำ แค่คำแนะนำที่ตรงไปตรงมา
  actions:
    - variant: primary
      text: เริ่มต้นการสนทนา
      href: /contact
    - text: สำรวจสินค้าของเรา
      href: /products
