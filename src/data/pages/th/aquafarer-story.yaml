hero:
  tagline: เรื่องราวของเรา
  title: Aquafarer — วิศวกรรมเสรีภาพบนผืนน้ำ
  subtitle: 'จากเวิร์กช็อปริมชายฝั่งสู่ผู้ผลิตเรือทั่วโลก — การเดินทางของเราสร้างขึ้นจากความเชื่อมั่นที่ไม่ยอมแพ้: เรือควรถูกออกแบบเหมือนกับว่ามีความสำคัญ เพราะพวกมันมีความสำคัญจริง ๆ'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer โรงงานและโรงงานผลิตเรือในชิงเต่า
