content_challenge:
  tagline: ความท้าทาย
  title: ความต้องการการวิจัยทางทะเล<br />แพลตฟอร์มที่เสถียรและพร้อมสําหรับเครื่องมือวัด
  subtitle: เรือทํางานทางวิทยาศาสตร์ต้องมีฐานที่มั่นคงสําหรับเครื่องมือที่ไวต่อแสง การทํางานเงียบเพื่อหลีกเลี่ยงการรบกวนสัตว์ป่า และการจัดวางที่ยืดหยุ่นสําหรับอุปกรณ์วิจัยที่หลากหลาย
  paragraphs:
    - การวิจัยทางทะเลและการติดตามสิ่งแวดล้อมต้องการเรือทํางานที่ทําหน้าที่เป็นห้องปฏิบัติการเคลื่อนที่แตกต่างจากเรือพาณิชย์หรือเรือพักผ่อน การวิจัยRIBsต้องรองรับเครื่องมืออิเล็กทรอนิกส์ที่มีความไว อุปกรณ์เก็บตัวอย่างน้ําและตะกอน และบางครั้งต้องมีการขนส่งตัวอย่างจริง — ทั้งหมดนี้ในขณะที่ต้องรักษาแพลตฟอร์มที่มั่นคงสําหรับการเก็บข้อมูลอย่างแม่นยํา
    - '**เสถียรภาพของแพลตฟอร์มเป็นสิ่งสําคัญ** — โซนาร์ เครื่องวัดเสียงสะท้อน และเครื่องวิเคราะห์ CTD (การนําไฟฟ้า อุณหภูมิ ความลึก) ต้องการตัวเรือที่มั่นคงทั้งขณะหยุดนิ่งและความเร็วต่ําการเคลื่อนตัวของเรือหรือการเคลื่อนตัวของเรือมากเกินไปจะทําให้เกิดเสียงรบกวนในข้อมูลทางวิทยาศาสตร์ตัวเรือ Deep-V ที่มีลักษณะความมั่นคงดีเป็นสิ่งจําเป็น'
    - '**การบูรณาการเครื่องมือ** — เรือวิจัยต้องมีจุดติดตั้งเสาอากาศ GPS, ทรานสดิวเซอร์โซนาร์, แขนเก็บตัวอย่าง และอุปกรณ์บันทึกข้อมูลพื้นที่คอนโซลต้องรองรับจอแสดงผลหลายจอ การกระจายพลังงานสําหรับเครื่องมือ และการจัดเก็บอุปกรณ์อิเล็กทรอนิกส์ที่มีความอ่อนไหวอย่างปลอดภัย'
    - '**การปฏิบัติงานที่เงียบ** — สําหรับการสํารวจชีววิทยาทางทะเลและการตรวจสอบสิ่งแวดล้อม เสียงเครื่องยนต์และการสั่นสะเทือนของตัวเรืออาจทําให้สิ่งมีชีวิตทางทะเลตกใจและส่งผลกระทบต่อการสังเกตพฤติกรรมการออกแบบตัวเรือที่เงียบและการออกแบบตัวเรือที่ลดการสั่นสะเทือนมีความสําคัญต่อการวิจัย'
    - Paddle Board Overstock การวิจัยRIBsถูกออกแบบด้วยแพลตฟอร์มตัวเรือที่มั่นคง ระบบติดตั้งอุปกรณ์ในตัว และการออกแบบนอกเรือที่เงียบสําหรับการใช้งานด้านวิทยาศาสตร์และการตรวจสอบสิ่งแวดล้อม
content_solution:
  tagline: โซลูชันของเรา
  title: งานวิจัยRIBsที่สร้างขึ้นเพื่อวัตถุประสงค์เฉพาะ<br />สําหรับงานด้านวิทยาศาสตร์และสิ่งแวดล้อม
  subtitle: Paddle Board Overstock งานวิจัยทุกชิ้นRIBถูกออกแบบให้เป็นแพลตฟอร์มที่เสถียรและปรับแต่งได้สําหรับเครื่องมือวิทยาศาสตร์และอุปกรณ์เก็บตัวอย่างภาคสนาม
  list:
    - ตัวเรือไฟเบอร์กลาสดีพวี มีความมั่นคงยอดเยี่ยมทั้งขณะพักและขณะสํารวจช้า
    - การจัดวางดาดฟ้าเรียบพร้อมแผ่นยึดอุปกรณ์สําหรับโซนาร์, GPS และอุปกรณ์เก็บตัวอย่าง
    - คอนโซลที่ตั้งค่าสําหรับหลายหน้าจอ — เครื่องพล็อตเตอร์, เครื่องวัดเสียง, เครื่องบันทึกข้อมูล
    - การจ่ายไฟอุปกรณ์เสริม 12V และ 24V สําหรับเครื่องมือวิทยาศาสตร์
    - เครื่องยนต์นอกบอร์ด 4 จังหวะเงียบ — ลดแรงสั่นสะเทือนและเสียงรบกวนสําหรับการสํารวจสัตว์ป่า
    - ออกแบบตัวเรือแบบ low-wake เป็นอุปกรณ์เสริมเพื่อลดการรบกวนระหว่างการเก็บข้อมูล
    - สีหลอดแบบกําหนดเองสําหรับการสร้างแบรนด์สถาบันวิจัยและการระบุกลุ่มรถ
content_segments:
  tagline: โปรไฟล์การวิจัย
  title: โซลูชันวิทยาศาสตร์ทางทะเล<br />ตามประเภทแอปพลิเคชัน
  subtitle: แอปพลิเคชันวิจัยแต่ละประเภทมีความต้องการเรือที่แตกต่างกัน — ตั้งแต่แพลตฟอร์มการสอนในมหาวิทยาลัย เรือสํารวจสิ่งแวดล้อม RIBsไปจนถึงการตรวจสอบคุณภาพน้ํา
  items:
    - title: หลักสูตรวิทยาศาสตร์ทางทะเลของมหาวิทยาลัย
      subtitle: แพลตฟอร์มการสอน ทัศนศึกษาของนักศึกษา การวิจัยชายฝั่ง
      description: มหาวิทยาลัยวิทยาศาสตร์ทางทะเลและภาควิชาสมุทรศาสตร์ต้องการเรือทํางานที่เชื่อถือได้และหลากหลายสําหรับการสอนหลักสูตรภาคสนาม โครงการวิจัยของนักศึกษา และการสํารวจชายฝั่งที่นําโดยคณาจารย์เรือต้องใช้งานง่ายสําหรับนักศึกษาภายใต้การดูแล มีความมั่นคงพอสําหรับการใช้งานเครื่องมือด้วยตนเอง และทนทานพอสําหรับการใช้งานบ่อยครั้งโดยผู้ใช้หลายคนตลอดภาคการศึกษาข้อจํากัดด้านงบประมาณในสภาพแวดล้อมทางวิชาการทําให้ความคุ้มค่าและการบํารุงรักษาต่ําเป็นเรื่องสําคัญ
      features:
        - แพลตฟอร์มที่มั่นคงสําหรับการฝึกซ้อมการปฏิบัติการและกู้คืนเครื่องมือของนักเรียน
        - การใช้งานง่าย — มีการติดตั้งแบบไถพรวนหรือคอนโซลเดียวสําหรับนักเรียนที่มีการดูแล
        - Hypalon ท่อที่ทนทานสําหรับการลงจอดบนชายหาดบ่อยครั้งและการดูแลนักเรียน
        - การติดตั้งอุปกรณ์สําหรับโซนาร์ระดับการสอน ดิสก์เซคคิ และอุปกรณ์เก็บตัวอย่าง
        - ทางเลือกที่คุ้มค่าPVCสําหรับโปรแกรมการศึกษาที่มีงบประมาณจํากัด
    - title: สถาบันวิจัยทางทะเล
      subtitle: การสํารวจRIBsพร้อมการบูรณาการเครื่องมือ, GPS, อุปกรณ์เก็บตัวอย่าง
      description: องค์กรวิจัยทางทะเลที่ดําเนินการสํารวจชายฝั่งและนอกชายฝั่งโดยเฉพาะจําเป็นต้องมีระบบสํารวจที่ตั้งค่าอย่างมืออาชีพRIBsพร้อมเครื่องมือในตัวเรือเหล่านี้ติดตั้งระบบโซนาร์สําหรับการทําแผนที่ความลึก เครื่องวิเคราะห์ CTD สําหรับวิเคราะห์ชั้นน้ํา เครื่องเก็บตะกอน และอุปกรณ์เก็บรวบรวมทางชีวภาพเรือต้องมีแพลตฟอร์มที่มั่นคงในความเร็วสํารวจช้า มีพื้นที่ดาดฟ้าเพียงพอสําหรับการติดตั้งอุปกรณ์ และมีแหล่งจ่ายไฟ 12V/24V ที่สะอาดสําหรับอิเล็กทรอนิกส์
      features:
        - ติดตั้งทรานสดิวเซอร์โซนาร์ในตัว — ทั้งแบบทะลุตัวเรือหรือแบบท้ายเรือ
        - การติดตั้งเสาอากาศ GPS และการรวมคอนโซลสําหรับการนําทางระดับสํารวจ
        - พื้นที่ติดตั้ง CTD และเครื่องเก็บตัวอย่างน้ําพร้อมจุดผูกที่ปลอดภัย
        - การจ่ายไฟเสริม 12V/24V สําหรับเครื่องมือและเครื่องบันทึกข้อมูล
        - เสถียรที่ความเร็วต่ํา (3-6 นอต) เพื่อความแม่นยําของเส้นทางสํารวจ
        - มีอุปกรณ์เสริม A-frame หรือ davit สําหรับติดตั้งอุปกรณ์เก็บตัวอย่างที่หนักกว่า
    - title: การติดตามและอนุรักษ์สิ่งแวดล้อม
      subtitle: การสํารวจทางนิเวศวิทยา การสังเกตสัตว์ป่า การประเมินถิ่นที่อยู่อาศัย
      description: องค์กรสิ่งแวดล้อม หน่วยงานรัฐบาล และองค์กรอนุรักษ์ดําเนินการสํารวจนิเวศทางทะเล การติดตามประชากรสัตว์ป่า และการประเมินถิ่นที่อยู่อาศัยปฏิบัติการเหล่านี้ต้องการเรือที่เงียบและมีผลกระทบต่ํา ซึ่งสามารถเข้าใกล้ถิ่นที่อยู่อาศัยที่อ่อนไหวโดยไม่รบกวนสัตว์ป่าเรือจําเป็นต้องติดตั้งอุปกรณ์กล้อง GPS สําหรับแผนที่แนวขวาง และอุปกรณ์เก็บตัวอย่างน้ําและตะกอนเสียงลมต่ําและเสียงเครื่องยนต์น้อยเป็นสิ่งสําคัญสําหรับการศึกษาพฤติกรรม
      features:
        - เครื่องยนต์นอกเรือ 4 จังหวะเงียบ — รบกวนสัตว์ทะเลน้อยที่สุด
        - แพลตฟอร์มสังเกตการณ์ที่เสถียรสําหรับการถ่ายภาพและบันทึกวิดีโอ
        - การติดตั้งอุปกรณ์สำหรับกล้อง, ตัวติดตาม GPS และคอมพิวเตอร์ภาคสนาม
        - ระวีน้ำตื้นเพื่อเข้าถึงพื้นที่ชุ่มน้ำชายฝั่ง, ป่าชายเลน, และปากแม่น้ำ
        - พื้นเรือและท่อที่ทำความสะอาดง่ายเพื่อกำจัดสารปนเปื้อนระหว่างพื้นที่
    - title: การตรวจสอบและทดสอบคุณภาพน้ำ
      subtitle: การเก็บตัวอย่างเป็นประจำ, การติดตามมลพิษ, การตรวจสอบการปฏิบัติตาม
      description: องค์กรตรวจสอบคุณภาพน้ำทำการเก็บตัวอย่างอย่างสม่ำเสมอทั่วเขตชายฝั่ง, ท่าเรือ, และเส้นทางน้ำภายในประเทศเพื่อติดตามระดับมลพิษ, การระบาดของสาหร่าย, และการปฏิบัติตามข้อกำหนดด้านสิ่งแวดล้อม การดำเนินงานเหล่านี้ต้องการเรือที่มีประสิทธิภาพและเชื่อถือได้สำหรับการเข้าชมซ้ำไปยังจุดเก็บตัวอย่างที่กำหนด เรือจะต้องสามารถบรรทุกอุปกรณ์เก็บตัวอย่าง, ตู้เย็นสำหรับรักษาตัวอย่าง, และอุปกรณ์ทดสอบภาคสนาม — พร้อมพื้นเรือที่ทำความสะอาดง่ายระหว่างจุดเก็บตัวอย่างเพื่อป้องกันการปนเปื้อนข้าม
      features:
        - พื้นที่สถานีเก็บตัวอย่างเฉพาะพร้อมตู้เย็นและที่เก็บอุปกรณ์
        - พื้นเรือและท่อที่ทำความสะอาดง่ายระหว่างจุดเพื่อกำจัดสารปนเปื้อน
        - การรวม GPS เพื่อกลับไปยังพิกัดการเก็บตัวอย่างที่กำหนดได้แม่นยำ
        - ขนาดกะทัดรัดเพื่อเข้าถึงเส้นทางน้ำจำกัดและช่องแคบ
        - เครื่องยนต์นอกเรือที่ประหยัดน้ำมันสำหรับการเก็บตัวอย่างที่มีค่าใช้จ่ายคุ้มค่า
cta:
  title: กำหนดค่า RIB สำหรับงานวิจัยของคุณ
  subtitle: บอกเราถึงการประยุกต์ใช้การวิจัยของคุณ, ความต้องการอุปกรณ์, และพื้นที่การทำงาน — เราจะแนะนำการกำหนดค่าที่เหมาะสมที่สุดสำหรับโปรแกรมวิทยาศาสตร์ทางทะเลของคุณ
  actions:
    - variant: primary
      text: ขอราคาอุปกรณ์วิจัย
      href: /contact
    - text: ดูรุ่น RIB
      href: /products
