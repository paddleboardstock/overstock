testimonial:
  content: Paddle Board Overstock ออกแบบและจัดอุปกรณ์โปรแกรมกิจกรรมชายหาดทั้งหมดของเราที่รีสอร์ทสามแห่ง 120 SUPs โครงสร้างความปลอดภัย และการฝึกอบรมพนักงาน — ทั้งหมดจัดส่งในครั้งเดียว การเข้าร่วมกิจกรรมทางน้ำของแขกเพิ่มขึ้น 60% ในฤดูกาลแรก
  name: โซฟี โลรองต์
  title: ผู้อำนวยการฝ่ายประสบการณ์แขก, Azure Bay Resorts — ภูเก็ต, ประเทศไทย
content_segments:
  tagline: โปรไฟล์รีสอร์ท
  title: โซลูชันด้านการบริการริมทะเล<br />ตามประเภททรัพย์สิน
  subtitle: รีสอร์ทแต่ละแห่งมีโปรไฟล์แขก, กิจกรรมที่แตกต่างกัน และจังหวะการดำเนินงานเฉพาะตัว — ตั้งแต่บูติกอีโค-ลอดจ์จนถึงรีสอร์ทหรูชายหาดขนาดใหญ่ เราออกแบบโปรแกรมกีฬาทางน้ำให้สอดคล้องกับระดับรีสอร์ทและความคาดหวังของแขก
  items:
    - title: รีสอร์ทหรูชายหาด
      subtitle: การรับส่ง VIP, กิจกรรมน้ำ, ประสบการณ์แขกพรีเมียม
      description: ที่พักริมชายหาดระดับสูง — Four Seasons, Aman และกลุ่มหรูอื่น ๆ — กีฬาทางน้ำเป็นหนึ่งในสิ่งอำนวยความสะดวกที่โดดเด่นสำหรับแขกช่วยผลคะแนนความพึงพอใจและรายได้เสริม กองยานพาหนะต้องดูพรีเมียม มีความหลากหลายสำหรับกลุ่มอายุและระดับความสามารถที่แตกต่างกัน และผสานรวมได้อย่างราบรื่นกับระบบคอนเซียร์จและการจองของรีสอร์ท ความคาดหวังเกี่ยวกับรูปลักษณ์ของแขกสูงมาก — สภาพและการนำเสนออุปกรณ์มีผลโดยตรงต่อรีวิว 5 ดาว
      features:
        - ฝูงยานพาหนะพรีเมียมแบรนด์ SUPs ในสีรีสอร์ทที่เข้ากัน
        - 'การนำเสนอพร้อมสำหรับแขก: สีรีสอร์ทที่เข้ากัน, โลโก้, การจัดแสดงอุปกรณ์อย่างมืออาชีพ'
        - กระดานชุดศิลปะลายเซ็นสำหรับประสบการณ์พรีเมียมของแขกและช่วงเวลาถ่ายภาพ
        - 'โครงสร้างพื้นฐานด้านความปลอดภัยแบบบูรณาการ: เส้นทุ่น, จุดสแตนบายของเจ้าหน้าที่รักษาความปลอดภัยทางน้ำ, AED'
        - 'การบริหารจัดการรายได้: แบบฟอร์มกำหนดราคาแบบไดนามิก, การฝึกอบรมการขายเสริม, การรวมแพ็กเกจ'
    - title: รีสอร์ทเกาะส่วนตัว
      subtitle: กิจกรรมทางน้ำสำหรับแขกที่เงียบสงบและพึ่งพาตนเอง
      description: 'รีสอร์ทบนเกาะส่วนตัวดำเนินการในสถานที่ห่างไกลที่การขนส่งซับซ้อนและทุกการจัดส่งมีความสำคัญ กิจกรรมทางน้ำสำหรับแขกต้องสามารถพึ่งพาตนเองได้: อุปกรณ์ที่เก็บได้อย่างประหยัด พองตัวเมื่อใช้ ต้องการการบำรุงรักษาน้อยที่สุด และมีรูปลักษณ์ที่สวยงามเมื่อแขกมาถึง เราวางแผนโปรแกรมเรือรอบเวลาของเครื่องบินน้ำและการขนส่งทางเรือ และโครงสร้างทนทานของเราเก็บรักษาอุปกรณ์ให้พร้อมสำหรับแขกตลอดฤดูกาลยาวโดยไม่ต้องพึ่งแหล่งสนับสนุนจากฝั่ง'
      features:
        - กองเรือแบบพองตัวขนาดกะทัดรัด — ขนส่งและเก็บบนเกาะห่างไกลอย่างมีประสิทธิภาพ
        - โครงสร้างระดับพาณิชย์ PVC สำหรับการใช้งานแขกหลายฤดูกาล
        - การบำรุงรักษาในสถานที่ง่ายพร้อมชุดซ่อมและคำแนะนำผ่านวิดีโอ
        - การสร้างแบรนด์รีสอร์ทแบบกำหนดเองให้สอดคล้องกับความงดงามของเกาะ
    - title: รีสอร์ทริมทะเลสาบและอีโค
      subtitle: ประสบการณ์แขกที่ผสมผสานธรรมชาติ
      description: อสังหาริมทรัพย์ริมทะเลสาบ, โรงแรมเชิงนิเวศ, และสถานที่พักผ่อนธรรมชาติเสนอการเล่นน้ำที่เงียบสงบและมีผลกระทบต่ำ ซึ่งเข้ากับสิ่งแวดล้อมตามธรรมชาติ อุปกรณ์ควรไม่ใช้เครื่องยนต์เมื่อเป็นไปได้ เก็บสะดวกในพื้นที่จำกัด และทำงานเงียบเพื่อรักษาประสบการณ์บรรยากาศสำหรับแขกทุกคน
      features:
        - กองเรือ SUP ไม่ใช้เครื่องยนต์ ในชุดศิลปะที่ได้แรงบันดาลใจจากธรรมชาติ
        - สถานีเติมลมไฟฟ้าแบบเงียบสําหรับลูกค้าตามต้องการ
        - วัสดุและบรรจุภัณฑ์ที่เป็นมิตรกับสิ่งแวดล้อม สอดคล้องกับแบรนด์ความยั่งยืน
        - รวมชั้นวางและระบบจัดระเบียบที่ท่าเรือ
    - title: คลับชายหาด
      subtitle: ความบันเทิงของแขกและบรรยากาศริมน้ำ
      description: คลับชายหาดดำเนินกิจกรรมที่มีพลังสูงและเน้นภาพซึ่งอุปกรณ์เป็นส่วนหนึ่งของบรรยากาศ พวกเขาต้องการกระดานพายที่มีสไตล์สำหรับความบันเทิงของแขก, การเช่า SUP สำหรับกิจกรรมริมชายหาด, และอุปกรณ์ที่ดูดีเทียบเท่าสถานที่ กองเรือต้องใช้งานง่าย ทนทานต่อการใช้งานของแขกที่มีทักษะหลากหลาย และติดตั้งรวดเร็วในช่วงชั่วโมงเร่งด่วน
      features:
        - ชุดศิลปะลายเซ็น SUPs ที่เป็นทั้งของตกแต่งสถานที่
        - กองเรือ SUP สำหรับการเช่าพร้อมใช้งานเพื่อความบันเทิงของแขก
        - สีและแบรนด์แบบกําหนดเองที่เข้ากับเอกลักษณ์ภาพของบีชคลับ
        - ระบบปล่อยและดึงกลับอย่างรวดเร็วสําหรับการดําเนินงานที่มีการเปลี่ยนแปลงสูง
        - โครงสร้างทน UV สำหรับการสัมผัสน้ำเค็มทุกวัน
    - title: สโมสรสมาชิกส่วนตัว & สโมสรเรือยอชต์
      subtitle: กีฬาและโปรแกรมพายเรือสำหรับสมาชิกโดยเฉพาะ
      description: คลับส่วนตัวที่กิจกรรมทางน้ำเป็นสิทธิประโยชน์สำหรับสมาชิกมากกว่าการสร้างรายได้ อุปกรณ์ต้องตรงตามมาตรฐานความงามที่สูงขึ้น มีให้บริการตามความต้องการของสมาชิก และใช้พนักงานดูแลน้อยที่สุด คลับยอชท์มาริน่าใช้กองเรือ SUP ที่มีแบรนด์สำหรับความบันเทิงของสมาชิกรอบอ่าว การเก็บรักษาและบำรุงรักษาควรมองไม่เห็นสำหรับสมาชิก
      features:
        - กองเรือ SUP แบรนด์พรีเมียมสำหรับกีฬาและกิจกรรมทางน้ำของสมาชิก
        - 'อุปกรณ์พรีเมียม: EVA ระเบียง, สีสมาชิกสั่งทํา, เบาะแบรนด์'
        - ระบบเช็คเอาท์แบบบริการตนเองสําหรับสมาชิกโดยไม่ต้องมีเจ้าหน้าที่
        - การเก็บรักษานอกฤดูกาลและโปรแกรมรีเฟรชประจําปี
    - title: โรงแรมที่เน้นการผจญภัยและกิจกรรม
      subtitle: ทัวร์ที่มีไกด์, SUP โยคะ, ทริปดำน้ำตื้น, กิจกรรมกลุ่ม
      description: สถานที่พักที่วางตนเองเป็นจุดหมายสำหรับการผจญภัย — มีการจัดทัวร์นำเที่ยว, SUP โยคะ, การพายเรือชมพระอาทิตย์ตก, การดำน้ำตื้น และกิจกรรมกลุ่ม ฝูงเรือต้องรองรับทั้งการให้เช่าแบบฟรีและรูปแบบโปรแกรมนำเที่ยว โดยมีอุปกรณ์ที่สามารถเปลี่ยนไปมาได้อย่างราบรื่นระหว่างการใช้เองของแขกและทัวร์ที่มีผู้สอน สถานที่เหล่านี้ต้องมีอุปกรณ์ที่ทนทานต่อการใช้งานบ่อย มีความสะดวกในการทำความสะอาดระหว่างกลุ่มแขก
      features:
        - กองยานพาหนะผสมอเนกประสงค์ที่สนับสนุนรุ่นทัวร์นำเที่ยวแบบเช่า +
        - แพลตฟอร์ม SUP ที่มีความคงตัวพิเศษสำหรับกิจกรรมกลุ่ม
        - 'อุปกรณ์แนะนำ: กระดานของผู้สอน, กล่องกันความชื้น, อุปกรณ์สื่อสารกันน้ำ'
        - 'การหมุนเวียนอุปกรณ์ตามฤดูกาล: กองเรือฤดูร้อน → โปรแกรมเก็บรักษาฤดูหนาว'
        - โครงสร้างทนทานที่ออกแบบมาเพื่อการใช้งานของแขกทุกวันโดยต้องการการบำรุงรักษาน้อยที่สุด
