content_challenge:
  tagline: ความท้าทาย
  title: ความต้องการในการปฏิบัติการกู้ภัย<br />ความน่าเชื่อถือที่ไม่ประนีประนอม
  subtitle: องค์กรค้นหาและกู้ภัยดำเนินงานภายใต้ความรับผิดชอบต่อความปลอดภัยสูงสุด — การล้มเหลวของเรือแต่ละลำจะก่อให้เกิดผลที่ยอมรับไม่ได้
  paragraphs:
    - ในการปฏิบัติการกู้ภัย ช่วงเวลาระหว่างความสำเร็จและความล้มเหลวถูกวัดด้วยนาที เรือจะต้องพร้อมออกจากฝั่งทันที ทำงานในสภาพที่ท้าทาย และกลับมาปลอดภัยพร้อมผู้โดยสาร ความรับผิดชอบต่อความปลอดภัยนั้นไม่เข้าแง่ — ความล้มเหลวของเครื่องจักรในระหว่างภารกิจกู้ภัยไม่ใช่ค่าใช้จ่ายในการซ่อม มันคือชีวิตที่สูญเสีย
    - เรือ SAR จำเป็นต้องมีความเร็วสูงเพื่อไปถึงผู้ประสบภัยอย่างรวดเร็ว ผสมผสานกับความมั่นคงพิเศษเพื่อการกู้ภัยอย่างปลอดภัย ต้องสามารถบรรทุกอุปกรณ์กู้ภัย อุปกรณ์การแพทย์ และอุปกรณ์สื่อสาร — มักในพื้นที่ดาดฟ้าที่จำกัด เรือที่ปฏิบัติราชการยังต้องมีอายุการใช้งานยาวนาน (10-15+ ปี) เพื่อให้คุ้มกับงบประมาณการจัดซื้อสาธารณะ
    - การมองเห็น ทั้งสำหรับผู้ควบคุมและการค้นหา เป็นสิ่งสำคัญ การออกแบบคอนโซลต้องให้มุมมอง 360 องศา และเรือต้องสามารถสังเกตเห็นได้ง่ายจากเครื่องบินและเรืออื่น
    - Paddle Board Overstock เรือกู้ภัย RIBs ถูกออกแบบตั้งแต่ส่วนค้ำถึงท้องเรือเพื่อตอบสนองความต้องการเหล่านี้ — ดาดฟ้าระบายน้ำได้เอง ตัวเรือเสริมความแข็งแรง ชุดนำทาง และเสาลากจูงเป็นมาตรฐานในรุ่นลาดตระเวน
content_solution:
  tagline: โซลูชันของเรา
  title: เรือกู้ภัยที่ออกแบบเฉพาะ RIBs
  subtitle: เรือกู้ภัย Paddle Board Overstock ทุกลำถูกออกแบบเพื่อตอบสนองหรือเกินกว่ามาตรฐาน SAR ระดับชาติ SOLAS
  list:
    - ดาดฟ้าระบายน้ำได้เอง — น้ำระบายอัตโนมัติเพื่อความมั่นคงในการกู้ภัย
    - ตัวเรือรูปตัว V ลึกเสริมความแข็งแรง — สามารถปฏิบัติการในน้ำขรุขระด้วยการควบคุมที่คาดเดาได้เมื่อเร็ว
    - ชุดไฟนำทางครบ — ใช้งานได้ทั้งกลางวันและกลางคืนในทุกสภาพอากาศ
    - เสาและเชือกลากจูง — พร้อมสำหรับลากเรือหรือปฏิบัติการเลื่อนช่วยชีวิต
    - แผ่นสำหรับติดตั้งอุปกรณ์ — วิทยุ ไฟส่อง แตร และอุปกรณ์การแพทย์
    - มีหลายรูปแบบเครื่องยนต์ — สํารองเครื่องยนต์แบบนอกลําเดียวหรือสองเครื่องยนต์
    - สีของท่อที่มองเห็นได้ชัดเจน — ส้ม เหลือง หรือแดง เพื่อความชัดเจนสูงสุด
content_segments:
  tagline: โปรไฟล์การกู้ภัย
  title: โซลูชันค้นหาและกู้ภัยเรือ<br />แยกตามประเภทองค์กร
  subtitle: องค์กรกู้ภัยต่าง ๆ ดําเนินงานภายใต้ภารกิจ รอบงบประมาณ และสภาพแวดล้อมการดําเนินงานที่แตกต่างกัน — ตั้งแต่ทีมอาสาสมัครชายฝั่งไปจนถึงกองเรือยามฝั่งแห่งชาติเรากําหนดทุกการกู้ภัยRIBให้ตรงกับโปรไฟล์ภารกิจ
  items:
    - title: หน่วยยามฝั่งและหน่วยงานกู้ภัยและกู้ภัยของรัฐบาล
      subtitle: ความรับผิดชอบด้านความปลอดภัยอย่างสมบูรณ์ — มาตรฐานกองยานพาหนะที่สําคัญต่อภารกิจ
      description: หน่วยงานกู้ภัยและกู้ภัยของรัฐบาลมีความรับผิดชอบด้านความปลอดภัยสูงสุดในการปฏิบัติการทางทะเลเรือทุกลําต้องปฏิบัติงานได้อย่างไร้ที่ติในสภาวะสุดขีด — อุปกรณ์ขัดข้องระหว่างภารกิจกู้ภัยไม่ใช่ทางเลือกการตัดสินใจจัดซื้อจัดจ้างขึ้นอยู่กับต้นทุนรวมของการเป็นเจ้าของตลอดอายุการใช้งาน 10-15 ปี ไม่ใช่ราคาล่วงหน้าหน่วยงานต้องการเรือที่สามารถผ่านการลาดตระเวนชายฝั่งเป็นเวลาหลายปี ปฏิบัติตามมาตรฐานระดับชาติที่เข้มงวด และให้ประสิทธิภาพที่สม่ําเสมอในสถานีที่กระจายอยู่เอกสารการปฏิบัติตามข้อกําหนดอย่างครบถ้วนและข้อตกลงการให้บริการหลายปีเป็นสิ่งจําเป็น
      features:
        - SOLAS และชุดเอกสารการปฏิบัติตามมาตรฐาน SAR ระดับชาติ
        - ความเหมือนกันของชิ้นส่วนทั่วทั้งกองยานพาหนะ — ลดความซับซ้อนของสินค้าคงคลังในระดับสถานี
        - การกําหนดค่าเครื่องยนต์คู่เพื่อความซ้ําซ้อนที่สําคัญต่อภารกิจ
        - การออกแบบอายุการใช้งาน 10-15 ปี พร้อมโปรแกรมบํารุงรักษาตามกําหนด
        - ความสามารถในทุกสภาพอากาศ — ตัวเรือ Deep-V เสริมความแข็งแรงสําหรับสภาพทะเลที่ขรุขระ
    - title: เจ้าหน้าที่กู้ภัยชายหาดและบริการกู้ภัยชายหาด
      subtitle: การปล่อยเรือเร็วในน้ําตื้น
      description: บริการกู้ภัยชายหาดและเทศบาลที่ต้องการเรือตอบสนองอย่างรวดเร็วที่สามารถปล่อยผ่านโซนคลื่น ปฏิบัติการในน่านน้ําตื้นใกล้ชายฝั่ง และเข้าถึงผู้ว่ายน้ําหรือเรือที่ประสบภัยได้ภายในไม่กี่นาทีอุปกรณ์ต้องมีน้ําหนักเบาพอสําหรับการลากจูงชายหาดด้วยยานพาหนะขนาดเล็กหรือด้วยมือ
      features:
        - ตัวเรือตื้นRIBสําหรับโซนคลื่นและปฏิบัติการใกล้ชายฝั่ง
        - รองรับการปล่อยเรือขึ้นฝั่ง พร้อมด้ามยกหัวเรือและที่ป้องกันกระดูกงู
        - มีแพลตฟอร์มเลื่อนกู้ภัยหรือแพลตฟอร์มสําหรับนักว่ายน้ํากู้ภัยในตัว
        - สีท่อสีส้มหรือเหลืองที่มองเห็นได้ชัดเจน
    - title: หน่วยกู้ภัยดับเพลิง
      subtitle: การบูรณาการปั๊มดับเพลิง การติดตั้งอุปกรณ์ การตอบสนองอย่างรวดเร็ว
      description: หน่วยกู้ภัยทางทะเลตอบสนองต่อไฟไหม้โครงสร้างริมฝั่ง ไฟไหม้เรือ และเหตุการณ์กู้ภัยในน้ําเรือเหล่านี้ต้องติดตั้งปั๊มดับเพลิง เครื่องมอนิเตอร์ ที่เก็บสายยาง และเครื่องช่วยหายใจ — ทั้งหมดนี้รวมอยู่ในแพลตฟอร์มที่มั่นคงและตอบสนองอย่างรวดเร็วหน่วยงานต่าง ๆ ยังใช้เรือเหล่านี้สําหรับการตอบสนองน้ําท่วมและปฏิบัติการช่วยเหลือซึ่งกันและกันการจัดวางคอนโซลต้องรองรับการควบคุมปั๊ม ระบบวิทยุ และไฟฉุกเฉินโดยไม่กระทบพื้นที่ดาดฟ้าสําหรับการเคลื่อนย้ายลูกเรือ
      features:
        - เครื่องตรวจจับไฟติดตั้งที่หัวเรือพร้อมชุดปั๊มรวม
        - การติดตั้งอุปกรณ์เฉพาะสําหรับปั๊มน้ําดับเพลิง ที่เก็บสายยาง และชุด BA
        - รูปแบบคอนโซลสามารถปรับแต่งได้สําหรับการควบคุมปั๊ม วิทยุ และไฟฉุกเฉิน
        - ดาดฟ้าแบบอัดน้ําอัตโนมัติสําหรับน้ําไหลและรักษาความมั่นคงของดับเพลิง
        - 'ชุดปฏิบัติการกลางคืน: ไฟค้นหา, ไฟฉาก, แถบไฟสีน้ําเงิน/แดง'
    - title: ตํารวจทางทะเลและความปลอดภัยท่าเรือ
      subtitle: การสกัดกั้น ลาดตระเวน และปฏิบัติการขึ้นเรือ
      description: หน่วยบังคับใช้กฎหมายทางทะเลต้องการเรือที่สามารถไล่ตามด้วยความเร็วสูง การขึ้นเรือต้องสงสัย และการลาดตระเวนรักษาความปลอดภัยท่าเรือเรือเหล่านี้ต้องมีพื้นที่เก็บอุปกรณ์และอาวุธที่มั่นคง การเชื่อมต่อกับคําสั่งบนฝั่ง และมีพื้นที่ดาดฟ้าเพียงพอสําหรับการปฏิบัติการของทีมขึ้นเรือความสามารถในการปฏิบัติการกลางคืนและการเข้าใกล้แบบไม่โดดเด่นเป็นสิ่งจําเป็นสําหรับภารกิจสกัดกั้น
      features:
        - ความสามารถในการไล่ล่าความเร็วสูง — ตัวเรือที่แล่นได้ความเร็วสูงสุด 40+ นอต
        - ตู้เก็บอาวุธและช่องเก็บอุปกรณ์บังคับใช้กฎหมายที่ปลอดภัย
        - การผสานคอนโซลสําหรับวิทยุตํารวจ, MDT และระบบสื่อสาร
        - 'ชุดปฏิบัติการกลางคืน: ไฟสปอตไลท์ IR, ขาตั้ง FLIR, ไฟส่องสว่างแบบลับ'
        - แพลตฟอร์มขึ้นเรือเสริมความแข็งแรงพร้อมพื้นผิวกันลื่น
        - ไฟฉุกเฉินและไซเรนสีน้ําเงิน/แดง
    - title: องค์กรอาสาสมัคร SAR และองค์กรไม่แสวงหากําไร
      subtitle: การดําเนินงานชายฝั่งและทะเลสาบที่ได้รับทุนสนับสนุนจากชุมชน
      description: กลุ่มกู้ภัยในชุมชนดําเนินงานในทะเลสาบ แม่น้ํา และพื้นที่ชายฝั่งที่การคุ้มครอง SAR ของรัฐบาลมีจํากัดองค์กรเหล่านี้มักได้รับทุนจากการบริจาคหรือเงินสนับสนุนจากรัฐบาล จึงต้องการความสามารถสูงสุดต่อเงิน — เรือที่เชื่อถือได้ ดูแลรักษาง่าย ซึ่งอาสาสมัครสามารถปฏิบัติงานได้อย่างปลอดภัยด้วยการฝึกอบรมเฉพาะทางเพียงเล็กน้อยรอบการขอทุนสนับสนุนหมายความว่าเรือต้องปฏิบัติตามข้อกําหนดการปฏิบัติตามข้อกําหนดในขณะที่ต้องอยู่ในงบประมาณที่จํากัด
      features:
        - การกําหนดค่าแบบติดตั้งนอกเรือเดี่ยวที่ออกแบบมาเพื่อลดต้นทุนการจัดหาและการดําเนินงาน
        - PVC โครงสร้างเพื่อการบํารุงรักษาที่ต่ําและซ่อมแซมในภาคสนามได้ง่าย
        - คอนโซลอเนกประสงค์ช่วยลดความซับซ้อนทางอิเล็กทรอนิกส์สําหรับอาสาสมัครผู้ปฏิบัติงาน
        - ชุดเอกสารการปฏิบัติตามข้อกําหนดเงินทุนสําหรับคําขอรับทุน
        - ดีไซน์น้ําหนักเบาสําหรับการปล่อยเรือขึ้นชายหาดโดยไม่ต้องใช้รถพ่วงหรือเครนเฉพาะ
    - title: การกู้ภัยน้ําท่วมและการตอบสนองต่อภัยพิบัติ
      subtitle: น้ําท่วมภายในประเทศ น้ําตื้น สภาพแวดล้อมที่เต็มไปด้วยเศษซาก
      description: การกู้ภัยน้ําท่วมเป็นรูปแบบปฏิบัติการที่โดดเด่น — เรือจะปฏิบัติการในพื้นที่เมืองที่น้ําท่วม กระแสน้ําที่เต็มไปด้วยเศษซาก และน้ําตื้นมากที่สิ่งกีดขวางใต้น้ํามองไม่เห็นผู้ปฏิบัติงานต้องการเรือที่สามารถนําทางบนถนนที่น้ําท่วม ดันผ่านเศษซาก และช่วยเหลือผู้ประสบภัยจากอาคารและยานพาหนะความสามารถในการใช้เรือในระวางน้ําตื้นเป็นสิ่งสําคัญ เช่นเดียวกับความสามารถในการปฏิบัติการในกระแสน้ําที่มีความเสี่ยงจากการติดขัดเรือเหล่านี้มักถูกส่งโดยหน่วยดับเพลิง การป้องกันพลเรือน และองค์กรบรรเทาทุกข์ภัยพิบัติ
      features:
        - ลําเรือตื้นมาก — ทํางานในน้ําลึก 30-50 ซม.
        - หัวเรือที่ป้องกันเศษซากและท่อเสริมความแข็งแรงสําหรับสิ่งกีดขวางที่จมอยู่ใต้น้ํา
        - ระเบียงแบบตั้งพื้นอัตโนมัติสําหรับน้ําท่วมและฟื้นฟูผู้ประสบภัย
        - ท่อสีส้มหรือสีเหลืองที่มองเห็นได้ชัดเจนสําหรับการลาดตระเวนทางอากาศ
        - การออกแบบน้ําหนักเบาสําหรับการขนส่งเฮลิคอปเตอร์และการปฏิบัติงานบนถนน
        - จุดยกเสริมความแข็งแรงสําหรับปฏิบัติการยกและเชือกกู้ภัย
cta:
