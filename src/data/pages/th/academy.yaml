hero:
  tagline: Paddle Board Overstock อะคาเดมี
  title: ศูนย์การเรียนรู้
  subtitle: คู่มือและบทเรียนสำหรับทุกระดับทักษะ — ตั้งแต่พื้นฐาน SUP ไปจนถึงเทคนิคการกู้ภัยขั้นสูง
categories:
  - level: ผู้เริ่มต้น
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP พื้นฐาน
        desc: เรียนรู้พื้นฐานของการพายบอร์ดแบบยืน — ท่าทาง เทคนิคการพาย และการทรงตัว
        slug: beginner-sup-guide
      - title: เทคนิคการพายเรือ
        desc: การพายไปข้างหน้า การพายกวาด การวาดพาย และการพายต่ำ — ฝึกให้ชำนาญท่าพายหลักเหล่านี้
        slug: sup-paddle-guide
      - title: ความปลอดภัยมาก่อน
        desc: แนวทางด้านความปลอดภัยที่สำคัญรวมถึงการตรวจสอบสภาพอากาศ, การใช้ PFD, กฎการใช้สายจูง และการช่วยเหลือตัวเอง
        slug: sup-safety-guide
  - level: ระดับกลาง
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: สิ่งจำเป็นสำหรับการท่องเที่ยว
        desc: วางแผนการพายเรือหลายชั่วโมง — การนำทาง การดื่มน้ำ การจัดจังหวะ และการอ่านพยากรณ์ลม
        slug: touring-sup-guide
      - title: การอ่านสภาพอากาศ
        desc: ตีความพยากรณ์ทางทะเล ระบุรูปแบบเมฆ และเข้าใจผลกระทบของลมต่อผิวน้ำ
        slug: weather-planning-water-sports
      - title: พื้นฐานการนำทาง
        desc: การอ่านแผนที่ การใช้เข็มทิศ จุดทาง GPS และการวางแผนเส้นทางสำหรับการพายเลียบชายฝั่ง
        slug: sup-navigation-guide
      - title: ความตระหนักเกี่ยวกับน้ำขึ้นน้ำลง
        desc: การเข้าใจวงจรน้ำขึ้นน้ำลง กระแสน้ำ และวิธีที่สิ่งเหล่านี้ส่งผลต่อเวลาการออกเรือและเส้นทาง
        slug: understanding-tides
  - level: ขั้นสูง
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: การวางแผนการเดินทางหลายวัน
        desc: ลอจิสติกส์ของการสำรวจ — การเลือกอุปกรณ์ การวางแผนอาหาร โปรโตคอลความปลอดภัย และผู้ติดต่อฉุกเฉิน
        slug: sup-travel-guide
      - title: เทคนิคการช่วยเหลือ
        desc: การช่วยเหลือตนเอง การช่วยเหลือแบบที การช่วยเหลือแบบเอสกิโมสำหรับเรือคายัค และหลักเกณฑ์การลากในน้ำเปิด
        slug: sup-self-rescue
      - title: พายเรือกลางคืน
        desc: การนำทางหลังค่ำ — ข้อกำหนดการส่องสว่าง ความจำเส้นทาง การสื่อสารกลุ่ม และการรับรู้ถึงอันตราย
        slug: sup-navigation-guide
  - level: การบำรุงรักษา
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: การทำความสะอาดและการดูแล
        desc: การล้างด้วยน้ำจืด, การป้องกัน UV, การป้องกันเชื้อราบูด, และเทคนิคการทำให้แห้งที่เหมาะสมหลังจากแต่ละครั้ง
        slug: inflatable-sup-maintenance
      - title: คู่มือการเก็บรักษา
        desc: แนวทางปฏิบัติที่ดีที่สุดสำหรับการเก็บบอร์ดและเรือเป่าลม — การลดลม การพับ การควบคุมอุณหภูมิ และอายุการใช้งาน
        slug: inflatable-sup-storage
      - title: พื้นฐานการซ่อมแซม
        desc: ซ่อมรอยเจาะเล็ก ๆ รอยรั่วที่ตะเข็บ และปัญวาล์วด้วยชุดซ่อม PVC และเทคนิคการติดแผ่นปะ
        slug: inflatable-sup-repair
      - title: การบำรุงรักษาวาล์ว
        desc: ระบุประเภทวาล์ว (Halkey-Roberts, Boston, Leafield) ทำความสะอาดเศษสิ่งสกปรก และเปลี่ยนก้านวาล์วที่ชำรุด
        slug: inflatable-sup-repair
knowledge_center_tagline: ศูนย์ความรู้
knowledge_center_title: อุปกรณ์ทางทะเล & คู่มืออุตสาหกรรม
knowledge_center_subtitle: ความรู้ผู้เชี่ยวชาญและคู่มือการซื้อสำหรับมืออาชีพทางทะเล ผู้บริหารเรือ และผู้ที่ชื่นชอบกีฬาทางน้ำ
knowledge_sections:
  - title: RIB ความรู้เกี่ยวกับเรือ
    tagline: คู่มือเรือเป่าลมแบบแข็ง
    desc: ทุกสิ่งเกี่ยวกับเรือ RIB — การออกแบบตัวเรือ วัสดุ การเลือกเครื่องยนต์ การบำรุงรักษา และคำแนะนำการซื้อสำหรับการใช้งานเชิงพาณิชย์และสันทนาการ
    guides:
      - title: วิธีเลือกเรือ RIB ที่เหมาะสม
        desc: คู่มือครบถ้วนสำหรับการเลือก RIB — ขนาด กำลังเครื่องยนต์ วัสดุท่อ ประเภทตัวเรือ และการใช้งานที่ตั้งใจ
        href: /v2/inflatable-boat-buying-guide
      - title: RIB เทียบกับเรือเป่าลม
        desc: เรือเป่าลมแบบแข็งเทียบกับเรือยางเป่าลมแบบดั้งเดิม — การออกแบบตัวเรือ ประสิทธิภาพ ความทนทาน และความจุเปรียบเทียบ
        href: /compare/rib-vs-dinghy
      - title: RIB เชิงพาณิชย์ vs RIB สันทนาการ
        desc: เรือเชิงพาณิชย์เทียบกับเรือ RIB สันทนาการ — มาตรฐานการก่อสร้าง วัสดุ อายุการใช้งาน ค่าใช้จ่าย และการรับรอง
        href: /compare/commercial-vs-recreational-rib
      - title: ตัวเรืออะลูมิเนียมเทียบกับไฟเบอร์กลาส
        desc: เปรียบเทียบตัวเรืออลูมิเนียมและไฟเบอร์กลาสสำหรับเรือ RIB ในเรื่องน้ำหนัก ค่าใช้จ่าย ความทนทาน และความต้านทานการกัดกร่อน
        href: /compare/aluminum-vs-fiberglass
  - title: คู่มือเรือเป่าลม
    tagline: ความรู้เกี่ยวกับยานพาหนะทางน้ำแบบเป่าลม
    desc: คู่มือครบวงจรเกี่ยวกับเรือเป่าลม — PVC เทียบกับ Hypalon วิธีการก่อสร้าง มาตรฐานความปลอดภัย และแนวทางปฏิบัติที่ดีที่สุดในการบำรุงรักษา
    guides:
      - title: คู่มือวัสดุ PVC เทียบกับ Hypalon
        desc: การเปรียบเทียบอย่างชัดเจนระหว่าง PVC และ Hypalon CSM สำหรับการก่อสร้างเรือเป่าลม
        href: /compare/pvc-vs-hypalon
      - title: การผลิตเรือเป่าลม
        desc: กระบวนการผลิต — การตัดวัสดุ การเชื่อม HF การก่อสร้างตะเข็บ การทดสอบแรงดัน และการควบคุมคุณภาพ
        href: /learn/inflatable-technology
      - title: คู่มือความปลอดภัยสำหรับเรือเป่าลม
        desc: มาตรฐานความปลอดภัย ความจุในการบรรทุก การสูบลมอย่างถูกต้อง การตรวจสอบก่อนออกเดินทาง และวิธีการฉุกเฉิน
        href: /learn/water-safety
      - title: การบำรุงรักษาเรือเป่าลม
        desc: การทำความสะอาด การจัดเก็บ การป้องกัน UV การเตรียมเรือในฤดูหนาว และการซ่อมแซมเรือเป่าลมและ RIBs
        href: /v2/inflatable-boat-maintenance
  - title: ความรู้เกี่ยวกับเรือ
    tagline: เรือยางและศูนย์ RIB
    desc: คู่มือเทคนิคเกี่ยวกับประเภทของเรือยาง วัสดุ วิธีการก่อสร้าง การบำรุงรักษา และความปลอดภัย — ตั้งแต่เรือเล็กไปจนถึง RIBs
    guides:
      - title: ประเภทของเรือยาง
        desc: เรือเล็ก, RIBs, เรือคายัค และทัณฑ์น้ำ — เรียนรู้ความแตกต่างและเลือกแบบที่เหมาะสม
        href: /v2/inflatable-boat-buying-guide
      - title: เทคโนโลยี Drop-Stitch
        desc: วิธีที่เธรดภายในนับพันสร้างโครงสร้างพองที่แข็งแรงและทนแรงดันสูง
        href: /learn/drop-stitch-core
      - title: ข้อมูลอ้างอิงวัสดุ
        desc: การให้คะแนน denier ของ PVC, น้ำหนักผ้า, ความต้านทานต่อ UV และวัสดุคุณภาพทางทะเลอธิบายไว้
        href: /learn/materials
      - title: RIB เทียบกับเรือเล็ก
        desc: เปรียบเทียบเรือยางแข็งกับเรือเล็กแบบพองมาตรฐานสำหรับการใช้งานที่แตกต่างกัน
        href: /compare/rib-vs-dinghy
  - title: ความรู้ SUP
    tagline: คู่มือการใช้งานบอร์ดพายยืน
    desc: ทุกเรื่องเกี่ยวกับบอร์ด SUP — พอง vs แข็ง, ขนาดบอร์ด, เทคโนโลยีวัสดุ และคำแนะนำจากผู้เชี่ยวชาญสำหรับทุกระดับทักษะ
    guides:
      - title: บอร์ดพอง vs ฮาร์ด SUP
        desc: เปรียบเทียบ iSUP และบอร์ดอีพ็อกซี่แข็งในเรื่องการพกพา ความทนทาน ประสิทธิภาพ และความคุ้มค่า
        href: /learn/sup
      - title: คู่มือขนาดบอร์ด SUP
        desc: วิธีที่ความยาว กว้าง และความหนามีผลต่อความมั่นคง ความเร็ว และความคล่องตัว
        href: /learn/sup
      - title: การบำรุงรักษาและดูแล SUP
        desc: การทำความสะอาด การจัดเก็บ การป้องกัน UV และคำแนะนำซ่อมแซมสำหรับบอร์ด SUP แบบพอง
        href: /v2/inflatable-sup-maintenance
      - title: การเลือก SUP แรกของคุณ
        desc: คู่มือสำหรับผู้เริ่มต้นในการเลือกบอร์ดพายยืนที่เหมาะสมกับน้ำหนัก ระดับทักษะ และการใช้งานที่ตั้งใจไว้
        href: /learn/sup
  - title: คู่มืออุปกรณ์ดำน้ำ
    tagline: ความรู้เกี่ยวกับเรือดำน้ำเชิงพาณิชย์
    desc: คู่มือเฉพาะเกี่ยวกับเรือดำน้ำ อุปกรณ์ดำน้ำ RIBs และอุปกรณ์สำหรับศูนย์ดำน้ำ ผู้ประกอบการดำน้ำ และทีมดำน้ำเชิงพาณิชย์
    guides:
      - title: เรือ RIB ที่ดีที่สุดสำหรับศูนย์ดำน้ำ
        desc: วิธีเลือกเรือดำน้ำ RIB ที่เหมาะสมสำหรับศูนย์ดำน้ำของคุณ — ความจุ การจัดวาง และข้อพิจารณาด้านงบประมาณ
        href: /solutions-diving-center-boats
      - title: คู่มือการจัดวางเรือดำน้ำ RIB
        desc: คุณสมบัติสำคัญสำหรับเรือดำน้ำ RIBs — ชั้นวางถัง ระบบบันได แพลตฟอร์มดำน้ำ และการจัดเก็บอุปกรณ์
        href: /solutions-diving-center-boats
  - title: คู่มือเรือยอชต์ท้องถิ่น
    tagline: โซลูชั่นซูเปอร์ยอชต์และเรือเทนเดอร์ทางทะเล
    desc: คู่มือการเลือกเทนเดอร์ยอชต์ที่สมบูรณ์แบบ — เทนเดอร์แบบพอง, เทนเดอร์ RIB, โซลูชั่นการเก็บรักษา, และอุปกรณ์เสริมเทนเดอร์
    guides:
      - title: วิธีการเลือกเทนเดอร์ยอชต์
        desc: ปัจจัยที่ควรพิจารณาเมื่อเลือกเทนเดอร์สำหรับยอชต์ของคุณ — ขนาด, วัสดุ, เครื่องยนต์, และการจัดเก็บ
        href: /solutions-yacht-tender-solutions
      - title: เทนเดอร์แบบพองกับเทนเดอร์ RIB
        desc: เปรียบเทียบเทนเดอร์ดิงกี้แบบพองกับเรือแบบแข็งพองเพื่อประสิทธิภาพ, ความทนทาน, และความสะดวกในการจัดเก็บ
        href: /compare/rib-vs-dinghy
  - title: คู่มืออุปกรณ์กู้ภัย
    tagline: ความรู้เกี่ยวกับเรือค้นหาและกู้ภัย
    desc: คู่มือมืออาชีพเกี่ยวกับเรือกู้ภัย, เรือ SAR, และอุปกรณ์ตอบสนองฉุกเฉินสำหรับทหารเรือ, เจ้าหน้าที่ช่วยชีวิตชายหาด, และทีมบรรเทาสาธารณภัย
    guides:
      - title: คู่มือการเลือกเรือ SAR
        desc: วิธีการเลือกเรือค้นหาและกู้ภัยที่เหมาะสม — ความเร็ว, ความจุ, ความทนทาน, และความต้องการอุปกรณ์เฉพาะ
        href: /solutions-rescue-watercraft
      - title: RIB ทางการค้าเพื่อปฏิบัติการกู้ภัย
        desc: เหตุผลที่ RIBs ระดับมืออาชีพเป็นตัวเลือกที่นิยมสำหรับทีมค้นหาและกู้ภัยมืออาชีพทั่วโลก
        href: /use-cases/search-and-rescue
