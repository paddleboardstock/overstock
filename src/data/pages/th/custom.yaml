hero:
  tagline: Paddle Board Overstock ห้องแล็บกำหนดเอง
  title: ออกแบบของคุณเอง<br />เรือ
  subtitle: OEM, ODM, บริการแบรนด์ส่วนตัว และการสร้างแบรนด์ที่กำหนดเองสำหรับธุรกิจทั่วโลก ตั้งแต่ต้นแบบเดียวไปจนถึงการผลิตเต็มรูปแบบ
  cta: เริ่มโครงการของคุณ
  footer_link: /contact
steps_section:
  tagline: มันทำงานอย่างไร
  title: จากแนวคิดสู่การผลิต
  subtitle: สี่ขั้นตอนจากความคิดของคุณไปสู่ผลิตภัณฑ์ที่เสร็จสมบูรณ์และพร้อมใช้งานทางทะเล
  steps:
    - num: '01'
      title: เลือกบอร์ดของคุณ
      desc: เลือกจากรุ่นหลักของเรา — SUP, คายัก, เรือเล็ก, หรือ RIB. เลือกขนาด วัสดุ และสี
    - num: '02'
      title: อัปโหลดการออกแบบของคุณ
      desc: ส่งโลโก้ งานศิลปะ หรือแนวทางแบรนด์ของคุณมาให้เรา ทีมออกแบบของเราจะจัดทำตัวอย่างดิจิทัล
    - num: '03'
      title: การทบทวนตัวอย่าง AI
      desc: ดูภาพจำลองที่สร้างโดย AI แบบสมจริงของบอร์ดที่คุณสั่งทำก่อนเริ่มการผลิต
    - num: '04'
      title: การผลิตและการจัดส่ง
      desc: เมื่อได้รับการอนุมัติ คำสั่งซื้อของคุณจะเข้าสู่สายการผลิตที่ได้รับการรับรอง ISO ระยะเวลาการผลิตเริ่มต้นที่ 30 วัน
services_section:
  tagline: บริการ
  title: บริการการผลิตสำหรับแบรนด์ระดับโลก
  subtitle: รูปแบบการมีส่วนร่วมที่ยืดหยุ่น — ตั้งแต่การผลิตตามสัญญาจนถึงการสร้างแบรนด์แบบครบวงจร
  items:
    - title: OEM การผลิต
      desc: เราผลิตงานออกแบบของคุณตามข้อกำหนด — สิทธิ์ทรัพย์สินทางปัญญาของคุณ แบบร่างของคุณ มาตรฐานคุณภาพของคุณ การปกป้องเต็มรูปแบบ NDA
      icon: ⚙️
    - title: ODM โซลูชัน
      desc: เลือกจาก 50+ แพลตฟอร์มที่ได้รับการพิสูจน์และปรับแต่งขนาด สี กราฟิก และบรรจุภัณฑ์ได้
      icon: 🎨
    - title: แบรนด์ส่วนตัว
      desc: แบรนด์ของคุณบนผลิตภัณฑ์ของเรา — โลโก้ บรรจุภัณฑ์ ป้ายห้อย คู่มือ พร้อมขายปลีกทันทีเมื่อแกะออกจากกล่อง
      icon: 🏷️
    - title: แบรนด์ที่ปรับแต่งได้
      desc: การพิมพ์แผ่นปูดาดฟ้า กราฟิกตัวเรือ สติกเกอร์ติดท่อ และฉลากที่ปรับแต่งได้ — การรวมแบรนด์อย่างเต็มรูปแบบ
      icon: ✨
capabilities_section:
  tagline: ความสามารถ
  title: ความสามารถในการผลิตและปรับแต่ง
  subtitle: ทุกสิ่งที่คุณต้องรู้ก่อนทำการสั่งซื้อ
  capabilities:
    - label: ปริมาณการสั่งซื้อ
      value: MOQ 5–10 หน่วย (SUP/คายัค), 2–5 หน่วย (RIB)
    - label: ระยะเวลาในการจัดส่ง
      value: 30–45 วันตามมาตรฐาน; 15–20 วันสำหรับต้นแบบ
    - label: การปรับแต่ง
      value: ขนาด, รูปร่าง, สี, กราฟิก, บรรจุภัณฑ์, ฮาร์ดแวร์
    - label: วัสดุ
      value: PVC, Hypalon, drop-stitch, ไฟเบอร์กลาส, อลูมิเนียม
    - label: การพิมพ์
      value: ดิจิทัล (CMYK), สกรีน, การโอนด้วยความร้อน, การซับลิเมชัน
    - label: การรับรอง
      value: CE, ISO 9001, BSCI, UKCA (สนับสนุนการปฏิบัติตามมาตรฐานโลก)
why_section:
  tagline: ทำไม Paddle Board Overstock
  title: โรงงานเดียว มาตรฐานเดียว ไม่มีการประนีประนอม
  points:
    - text: โรงงานผลิตแบบรวม 12,000 ตร.ม.
      highlight: 12,000 ตร.ม.
    - text: 200-300 พนักงานและวิศวกรมืออาชีพ
      highlight: 200-300
    - text: ผลิตเรือ 15,000 ลำต่อปี
      highlight: 15,000
    - text: ISO การจัดการคุณภาพได้รับการรับรอง 9001
      highlight: ISO 9001
    - text: CE ผลิตภัณฑ์ที่ได้รับการรับรองสำหรับตลาดสหภาพยุโรป
      highlight: CE
  cta: ดูรายละเอียดโรงงาน
  cta_link: /factory
  contact:
    title: พร้อมหารือเกี่ยวกับโครงการของคุณหรือไม่?
    desc: ทีมงานของเราตอบกลับภายใน 24 ชั่วโมงพร้อมใบเสนอราคาคร่าวๆ
