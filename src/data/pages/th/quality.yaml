testimonial:
  quote: ระดับของเอกสารและการติดตาม Paddle Board Overstock สำหรับการทดสอบคุณภาพเกินกว่าที่เราเคยเห็นจากผู้ผลิตจีน แต่ละการจัดส่งจะมีรายงานการทดสอบฉบับเต็มพร้อมอ้างอิงมาตรฐานและข้อมูลการผ่าน/ไม่ผ่าน
  author: มาร์คัส แฮนเซน
  title: ผู้จัดการฝ่ายจัดซื้อ
  company: นอร์ดิก มารีน ซัพพลาย
  location: สวีเดน
