hero:
  tagline: การประกันคุณภาพ
  title: การทดสอบประสิทธิภาพและคุณภาพ
  subtitle: กระดานเป่าลม Paddle Board Overstock ทุกแผ่นจะผ่านการทดสอบสมรรถนะและคุณภาพอย่างเข้มงวดที่ศูนย์วิจัยและพัฒนาของเราก่อนจัดส่ง แปดโปรโตคอล ไม่มีการสุ่มตรวจ — ทุกหน่วยได้รับการยืนยัน
trust_bar:
  items:
    - value: 100%
      label: ตรวจสอบหน่วยก่อนจัดส่ง
      sub: การสุ่มศูนย์ — ทุกหน่วย
    - value: '8'
      label: โปรโตคอลการทดสอบ
      sub: กลไก · ความร้อน · UV · การขัดถู
    - value: 99.3%
      label: อัตราค่าขนส่งปราศจากข้อบกพร่อง
      sub: ย้อนหลัง 12 เดือน
    - value: 1,200+
      label: โครงการที่ได้รับการรับรองคุณภาพ
      sub: ตั้งแต่ปี 2012
testimonial:
  quote: กระดานมาพร้อมกับบันทึกการทดสอบที่ฉันสามารถอ่านได้จริง — หมายเลขชุด บันทึกการทดสอบแรงดัน ครบทุกอย่าง สามฤดูกาลของการใช้งานหนักและมันยังคงเก็บอากาศเหมือนวันแรก
  author: ทอม รีลลี่
  title: ผู้ซื้อที่ยืนยันแล้ว
  company: นักพายเรือวันหยุดสุดสัปดาห์
  location: ไอร์แลนด์
