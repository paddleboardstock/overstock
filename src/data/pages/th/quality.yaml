tests:
  - title: การทดสอบความดัน
    standard: ISO 6185-1 |สเปกภายใน AF-PT-001
    description: ห้องเป่าลมจะถูกอัดแรงดันให้สูงกว่าขีดจํากัดการทํางานที่แนะนํา 1.25 เท่า และเก็บไว้นาน 30 นาทีการวัดการเสื่อมสภาพของแรงดันเพื่อยืนยันความแน่นหนาของอากาศและความแข็งแรงของวัสดุและรอยต่อ
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: การทดสอบผลกระทบ
    standard: สเปกภายใน AF-IT-002
    description: ผลิตภัณฑ์จะถูกควบคุมแรงกระแทกจากตุ้มน้ําหนักตกมาตรฐานและอุปกรณ์ลูกตุ้มสิ่งนี้ประเมินความต้านทานการเจาะ การแพร่กระจายของการฉีกขาด และความยืดหยุ่นของโครงสร้างต่อการชนกับสิ่งกีดขวาง ท่าเรือ และเศษซาก
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV การทดสอบความต้านทาน
    standard: ASTM G154 |ISO4892-3
    description: ตัวอย่างวัสดุจะถูกนําไปฉายกับหลอด UVA-340 ในห้องผุกร่อนแบบเร่งความเร็วเป็นเวลา 1,000+ ชั่วโมงเราวัดการเปลี่ยนแปลงสี (Delta E), การคงความเงา และการสูญเสียความแข็งแรงดึงเพื่อยืนยันUVบรรจุภัณฑ์ของสารเสริมความคงตัว
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: การทดสอบความต้านทานการขีดข่วน
    standard: ASTM D751 (Taber) |ISO5470-1
    description: ตัวอย่างวัสดุจะถูกนําไปทดสอบด้วยล้อขัด CS-10 ภายใต้แรง 500g/1,000g เป็นเวลา 1,000 รอบการสูญเสียมวลและการเกรดการสึกหรอทางสายตาเป็นตัวกําหนดความทนทานของการเคลือบต่อทราย กรวด และการปล่อยซ้ํา ๆ
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: การทดสอบประสิทธิภาพที่อุณหภูมิต่ํา
    standard: สเปกภายใน AF-LT-003 |MIL-STD-810G
    description: ผลิตภัณฑ์และคูปองวัสดุที่ประกอบเสร็จจะถูกปรับสภาพที่อุณหภูมิ -20°C, -10°C และ 0°C เป็นเวลา 24 ชั่วโมง จากนั้นทดสอบแบบยืดหยุ่นเราตรวจสอบและPVC Hypalon รักษาความยืดหยุ่นโดยไม่แตกร้าวหรือลอกชั้น
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: การทดสอบความลอยตัวและความสามารถในการรับน้ําหนัก
    standard: ISO 6185-1 |ISO12402
    description: ผลิตภัณฑ์จะถูกบรรจุขึ้นทีละน้อยจนถึงความจุที่กําหนด 1.25 เท่าในสระควบคุมประสิทธิภาพการระบายน้ํา ความมั่นคง และการระบายน้ําอัตโนมัติถูกบันทึกไว้ความจุที่กําหนดของแต่ละรุ่นได้รับการตรวจสอบทางคณิตศาสตร์และเชิงประจักษ์
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: การทดสอบความคล่องตัว
    standard: สเปกภายใน AF-MT-004
    description: การทดสอบบนผิวน้ําจะวัดรัศมีการเลี้ยว การเร่งความเร็ว เวลาการไสร และการตอบสนองของพาย/มอเตอร์ในสภาวะโหลดที่หลากหลายลักษณะการควบคุมจริงจะถูกตรวจสอบตามเป้าหมายการออกแบบ
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: การทดสอบความกันน้ํา
    standard: ISO 6185-1 §7.3 |สเปกภายใน AF-WT-005
    description: ผลิตภัณฑ์ทุกชิ้นที่ประกอบเสร็จจะถูกทดสอบด้วยการพ่นที่แรงดัน 0.5 บาร์บนรอยต่อ วาล์ว และข้อต่อทั้งหมดการทดสอบจุ่มน้ําด้วยแรงดัน 5 นาทีเพื่อยืนยันความกันน้ําของห้องและวาล์วมาตรฐานการรั่วซึมเป็นศูนย์ก่อนจัดส่ง
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
testing_section:
  tagline: ขั้นตอนการทดสอบ
  title: การทดสอบอย่างเข้มงวดในทุกขั้นตอน
commitment:
  title: ความมุ่งมั่นของเรา
  body: ผ่านกระบวนการทดสอบที่เข้มงวดเหล่านี้ {SITE} มอบความมั่นใจให้ลูกค้าว่าเรือเป่าลมSUPsและเรือของเราไม่เพียงแต่มีประสิทธิภาพสูง แต่ยังสร้างมาเพื่อความทนทาน — รับประกันการผจญภัยที่สนุกสนานและปลอดภัยบนผิวน้ําอย่างไม่รู้จบห้องปฏิบัติการคุณภาพของเราทํางานอย่างอิสระจากฝ่ายผลิตและรายงานตรงต่อฝ่ายบริหาร
  cta: ขอเอกสารการทดสอบ
  cta_link: /contact
