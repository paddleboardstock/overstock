process_section:
  tagline: วิธีการจัดส่งสินค้า
  title: จากคลังสินค้าของเราถึงประตูบ้านคุณ
  steps:
    - title: ใบเสนอราคาพร้อมตัวเลือกค่าขนส่ง
      description: ทุกใบเสนอราคาจะแยกรายการตัวเลือกค่าขนส่งไปยังปลายทางของคุณ — ทั้งแบบด่วนและแบบทางทะเล — พร้อมเวลาการขนส่งโดยประมาณ เพื่อให้ไม่มีสิ่งใดถูกตัดสินแทนคุณ
    - title: ตรวจสอบคุณภาพและบรรจุ
      description: กระดานจะถูกทดสอบแรงดัน 100% จากนั้นจะบรรจุพร้อมปั๊ม, พาย, สายจูง, ครีบ, กระเป๋าเป้ และชุดซ่อม — เป็นแพ็กเกจครบเหมือนที่ขายปลีก
    - title: จัดส่งจากเวย์ไห่
      description: การจัดส่งของคุณจะออกจากฐานโลจิสติกส์ของเราด้วยวิธีขนส่งที่คุณเลือก และการติดตามแบบประตูถึงประตูจะถูกแชร์กับคุณในวันเดียวกัน
    - title: การผ่านด่านศุลกากร
      description: เราจัดเตรียมใบแจ้งหนี้เชิงพาณิชย์และรายการบรรจุภัณฑ์ที่คุณต้องใช้สำหรับการนำเข้า ภาษีนำเข้าและภาษีในประเทศของคุณเป็นความรับผิดชอบของผู้นำเข้า — ดูส่วนศุลกากรด้านล่าง
    - title: การจัดส่งและการตรวจสอบ
      description: ตรวจสอบการจัดส่งของคุณเมื่อมาถึง หากมีสิ่งใดเสียหายหรือขาดหาย ติดต่อเราพร้อมรูปถ่ายและหมายเลขคำสั่งซื้อของคุณ — ดูนโยบายการสูญหายและความเสียหายด้านล่าง
customs_section:
  tagline: ศุลกากรและภาษี
  title: อากรศุลกากรและภาษีนำเข้า
  subtitle: เรารักษาความรับผิดชอบด้านค่าขนส่งอย่างชัดเจน แทนที่จะให้คำสัญญาที่คลุมเครือ นี่คือความรับผิดชอบของแต่ละฝ่ายอย่างชัดเจน
  items:
    - title: สิ่งที่เรารับผิดชอบ
      description: ใบเสนอราคาของคุณรวมค่าขนส่งไปยังปลายทางของคุณ และเราจัดเตรียมเอกสารส่งออกทั้งหมดให้ — ใบแจ้งหนี้เชิงพาณิชย์, รายการบรรจุภัณฑ์, และการติดตามการจัดส่ง
    - title: สิ่งที่ผู้นำเข้ารับผิดชอบ
      description: อากรนำเข้า, VAT/GST, และภาษีในประเทศปลายทางใด ๆ ต้องชำระโดยผู้นำเข้า (คุณหรือธุรกิจของคุณ) ตามกฎของประเทศของคุณ เราไม่รวมคำสัญญาภาษีที่คลุมเครือเข้าในใบเสนอค่าขนส่งของเรา
    - title: การสนับสนุนการผ่านด่านศุลกากร
      description: เอกสารของเราครบถ้วนและสม่ําเสมอ — รหัส HS ที่ถูกต้อง ค่าที่ประกาศไว้ และข้อกําหนดของบอร์ด — ซึ่งเป็นสิ่งที่ช่วยให้การเคลียร์เป็นไปอย่างราบรื่นหากนายหน้าหรือสํานักงานศุลกากรของคุณต้องการเอกสารเพิ่มเติม เราจะจัดเตรียมให้
    - title: ตรวจสอบอัตราค่าบริการในพื้นที่ของคุณก่อนสั่งซื้อ
      description: อัตราภาษีสําหรับอุปกรณ์กีฬาทางน้ําเป่าลมจะแตกต่างกันไปตามประเทศตรวจสอบกฎการนําเข้าของประเทศคุณหรือสอบถามในข้อสอบถาม — คู่มือตลาดภูมิภาคของเรามีบันทึกศุลกากรสําหรับตลาดสําคัญ
lost_damaged:
  title: การจัดส่งที่สูญหายหรือเสียหาย
  description: ตรวจสอบการจัดส่งของคุณเมื่อมาถึงในกรณีที่หายากที่แผ่นไม้มาถึงมีความเสียหายหรือพัสดุหาย กรุณาติดต่อเราโดยเร็วที่สุดพร้อมหมายเลขคําสั่งซื้อและภาพถ่ายชัดเจนของบรรจุภัณฑ์และแผ่นไม้เราจะประเมินแต่ละกรณีเป็นรายกรณี — ขึ้นอยู่กับกรณี เช่น อะไหล่ทดแทน แผ่นไม้ทดแทน หรือการคืนเงินสําหรับสินค้าที่ได้รับผลกระทบข้อบกพร่องในการผลิตจะได้รับความคุ้มครองแยกต่างหากภายใต้การรับประกัน 2 ปีของเรา SUP
destinations_section:
  tagline: สถานที่ที่เราจัดส่ง
  title: 50+ ประเทศและยังเพิ่มขึ้นเรื่อย ๆ
  description: เราจัดส่งทั่วโลก พร้อมคู่มือรายละเอียดสําหรับตลาดภูมิภาคหลักของเราคู่มือตลาดแต่ละฉบับครอบคลุมประเภทลูกค้าท้องถิ่น ใบส่งสินค้า และเคล็ดลับศุลกากรสําหรับภูมิภาคนั้น ๆ
  regions_label: คู่มือภูมิภาค
  countries_label: คู่มือประเทศ
faq_section:
  title: คําถามที่พบบ่อยเกี่ยวกับการจัดส่ง
  items:
    - q: การจัดส่งด่วนใช้เวลานานเท่าไร?
      a: เวลาขนส่งด่วนขึ้นอยู่กับปลายทาง — เราจะระบุเวลาขนส่งโดยประมาณสําหรับประเทศของคุณในทุกการสอบถาม ก่อนที่คุณจะตัดสินใจทําอะไร
    - q: การขนส่งทางทะเลใช้เวลานานเท่าไร?
      a: การขนส่งทางทะเลจะแตกต่างกันไปตามจุดหมายปลายทาง ท่าเรือ และตารางการเดินเรือเราจะประเมินช่วงเวลาประมาณสําหรับจุดหมายปลายทางของคุณในคําสั่งซื้อของคุณ และคุณจะได้รับการติดตามเมื่อสินค้าออกเดินทาง
    - q: ฉันควรเลือกวิธีการจัดส่งแบบใด?
      a: จัดส่งด่วนสําหรับบอร์ด 1–3 บอร์ด ตัวอย่าง หรือการเติมสินค้าด่วนขนส่งทางทะเลสําหรับคําสั่งซื้อขายส่ง 5–20 บอร์ด ซึ่งต้นทุนต่อบอร์ดสําคัญกว่าความเร็วเราเสนอราคาทั้งสองแบบเพื่อให้คุณสามารถเปรียบเทียบได้
    - q: ภาษีนําเข้าและภาษีนําเข้ารวมอยู่ในค่าจัดส่งหรือไม่?
      a: ไม่ค่าขนส่งจะถูกระบุแยกต่างหาก และภาษีนําเข้า VAT/GST และภาษีปลายทางเป็นความรับผิดชอบของผู้นําเข้าตามกฎของประเทศคุณเราจัดเตรียมเอกสารที่ครบถ้วนและถูกต้องเพื่อให้การผ่านศักดิ์สิทธิ์เป็นไปอย่างราบรื่น
    - q: คุณส่งของไปประเทศของฉันไหม?
      a: เราจัดส่งไปยัง 50+ ประเทศตรวจสอบคู่มือภูมิภาคและประเทศของเราด้านล่าง หรือสอบถามในคําถามของคุณ — เราจะยืนยันบริการปัจจุบันไปยังที่อยู่ของคุณ
    - q: สามารถติดตามคําสั่งซื้อของฉันได้ไหม?
      a: ใช่ทุกการจัดส่ง — ไม่ว่าจะเป็นแบบด่วนหรือทางทะเล — จะมีการติดตามถึงประตูบ้านที่เราแบ่งปันกับคุณในวันจัดส่ง
cta:
