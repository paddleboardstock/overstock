  subtitle: แจ้งจุดหมายปลายทางและขนาดคําสั่งซื้อเป้าหมายของคุณ — เราจะตอบกลับพร้อมตัวเลือกค่าขนส่ง ประมาณค่าขนส่ง และต้นทุนรวม
  actions:
