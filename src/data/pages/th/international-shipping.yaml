hero:
  tagline: การจัดส่งระหว่างประเทศ
  title: การขนส่งระหว่างประเทศ —<br />ขนส่งด่วนและทางทะเลไปยัง 50+ ประเทศ
  subtitle: ทุกคําสั่งซื้อจะจัดส่งจากฐานโลจิสติกส์ของเราที่เว่ยไห่ ประเทศจีนเลือกขนส่งทางอากาศด่วนสําหรับตัวอย่างและเติมสต็อกด่วน หรือขนส่งทางทะเลแบบรวมสําหรับคําสั่งซื้อขายส่งธุรกิจขนาดเล็ก
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP แผ่นไม้ที่บรรจุสําหรับการจัดส่งระหว่างประเทศ
direct_answer: Paddle Board Overstock จัดส่งไปยังมากกว่า 50 ประเทศจากเมืองเว่ยไห่ ประเทศจีนการขนส่งทางอากาศด่วนมีบอร์ด 1–3 แผ่น การสั่งซื้อตัวอย่าง และการเติมสินค้าด่วน;การขนส่งทางทะเลแบบรวมเป็นทางเลือกที่คุ้มค่าสําหรับคําสั่งซื้อขายส่งบอร์ด 5–20 บอร์ดทุกการจัดส่งจะมีการติดตามจากประตูถึงประตู และทุกบอร์ดผ่านการทดสอบแรงดัน 100% พร้อมชุดอุปกรณ์เสริมครบชุดก่อนจัดส่ง
tldr_points:
  - 'ขนส่งทางอากาศด่วน: 1–3 บอร์ด, ตัวอย่าง, เติมสต็อกด่วน — ตัวเลือกที่รวดเร็วที่สุด'
  - 'การขนส่งทางทะเล: สั่งซื้อขายส่ง 5–20 บอร์ด — ต้นทุนต่อเรือต่ําสุด'
  - ติดตามจากประตูถึงประตูในทุกการจัดส่งไปยัง 50+ ประเทศ
  - ค่าขนส่ง ประกันภัย พิธีการศุลกากร และภาษีนําเข้าจะถูกระบุไว้ในใบเสนอราคาของคุณ — ไม่มีคําสัญญาที่คลุมเครือ
from_china:
  tagline: จัดส่งจากจีน
  title: สถานที่จัดส่งคําสั่งซื้อ
  description: คําสั่งซื้อทั้งหมดจัดส่งจากฐานโลจิสติกส์ของเราที่เว่ยไห่ ประเทศจีน — หัวใจของการดําเนินงานด้านการผลิตและคลังสินค้าของเราเว่ยไห่เป็นเมืองท่าชายฝั่งสําคัญในมณฑลซานตง มีการเชื่อมต่อขนส่งทางทะเลและทางอากาศโดยตรง ซึ่งช่วยให้เวลาขนส่งและต้นทุนการขนส่งสามารถแข่งขันกับจุดหมายปลายทางในเอเชีย อเมริกา แอฟริกา ยุโรป และตะวันออกกลาง
modes_section:
  tagline: สองทางเลือก
  title: จัดส่งด่วนหรือขนส่งทางทะเล
  subtitle: วิธีการขนส่งที่เหมาะสมขึ้นอยู่กับว่าคุณต้องการบอร์ดเร็วแค่ไหนและสั่งจํานวนเท่าไหร่ทั้งสองตัวเลือกจะถูกเสนอราคาทุกครั้งที่สอบถาม
  express:
    name: ตัวเลือก A — จัดส่งด่วน
    best_for: เหมาะสําหรับบอร์ด 1–3 แผ่น ตัวอย่าง และการเติมสต็อกด่วน
    description: Air Express ส่งออเดอร์เล็ก ๆ และบอร์ดตัวอย่างถึงบ้านคุณภายในไม่กี่วัน ไม่ใช่เป็นสัปดาห์เหมาะสําหรับการทดสอบรุ่นก่อนรับออเดอร์ใหญ่ หรือเติมสินค้าขายดีกลางฤดูกาล
    features:
      - 1–3 บอร์ด แบบเดี่ยว หรือแบบผสม
      - เป็นทางเลือกขนส่งที่เร็วที่สุดในสองตัวเลือก — ระบุราคาต่อจุดหมายปลายทาง
      - ติดตามจากประตูถึงประตูด้วยผู้ให้บริการขนส่งด่วนรายใหญ่
      - 'การใช้งานทั่วไป: ตัวอย่าง, การเติมสต็อกด่วน, คําสั่งซื้อครั้งแรกขนาดเล็ก'
  sea:
    name: ตัวเลือก B — การขนส่งทางทะเล
    best_for: เหมาะสําหรับคําสั่งซื้อขายส่งและร้านค้าปลีก 5–20 บอร์ด
    description: การขนส่งทางทะเลแบบรวมเป็นทางเลือกที่คุ้มค่าสําหรับคําสั่งซื้อขายส่งธุรกิจขนาดเล็กบอร์ดจะถูกบรรจุรวมกันในการจัดส่งรวมจากเว่ยไห่ ทําให้ต้นทุนการขนส่งต่อบอร์ดต่ํา
    features:
      - 5–20 คําสั่งจากร้านค้าปลีกและขายส่งบอร์ด
      - ค่าขนส่งต่อบอร์ดต่ําที่สุดในสองตัวเลือก
      - การบรรจุแบบรวม — หนึ่งการจัดส่ง, หนึ่งการเคลียร์
      - 'การใช้งานทั่วไป: เติมสต็อกตามฤดูกาล, สั่งซื้อขายส่งแบบผสม'
