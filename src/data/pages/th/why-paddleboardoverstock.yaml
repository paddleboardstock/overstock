hero:
  tagline: ทำไม Paddle Board Overstock
  title: สร้างมาต่างออกไปสร้างมาให้ทนทาน<br />บอร์ดเบื้องหลัง Water Adventures ทั่วโลก
  subtitle: ไม่ใช่แค่โรงงาน — ทีมงานนักพายและวิศวกรที่ออกแบบ ทดสอบ และสร้างบอร์ดเป่าลมคุณภาพสูง SUP สําหรับครอบครัว นักผจญภัย และชมรมทั่วโลก
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: คุณภาพและความเชี่ยวชาญในการผลิต Paddle Board Overstock
pillars:
  tagline: สามเสาหลักแห่งคุณภาพ
  title: ทําไมนักพายเรือทั่วโลกจึงเลือก Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: ออกแบบเพื่อการใช้งานเชิงพาณิชย์
      description: บอร์ดของเราถูกออกแบบมาเพื่อการพายเรืออย่างสม่ําเสมอเป็นเวลาหลายปีแกนเสริมความแข็งแรงระดับเชิงพาณิชย์ PVC drop-stitch UV วัสดุที่มั่นคง และฮาร์ดแวร์ที่ผ่านการทดสอบภาคสนาม หมายถึงการบํารุงรักษาที่ต่ํากว่าและอายุการใช้งานบนผิวน้ํายาวนานขึ้น
      icon: tabler:building-factory
      callToAction:
        text: ดูสายผลิตภัณฑ์เชิงพาณิชย์
        href: /products
    - title: ผ่านการทดสอบเกินมาตรฐาน
      description: ทุกแผ่นจะถูกเติมลมให้ถึง 1.25 เท่าของแรงดันที่กําหนดเป็นเวลา 24-48 ชั่วโมงก่อนออกจากโรงงาน — ผ่านการทดสอบแรงดัน 100% ปราศจากข้อบกพร่อง 99.3%แผ่นของคุณจะพิสูจน์ความแข็งแกร่งก่อนจะลงน้ํา
      icon: tabler:shield-check
      callToAction:
        text: ดูวิธีที่เราทดสอบ
        href: /quality
    - title: สร้างเพื่อสภาพแวดล้อมทั่วโลก
      description: 'ผลิตภัณฑ์ถูกปรับให้เหมาะกับทุกสภาพภูมิอากาศ: สูตร PVC สำหรับน้ำเย็นในยุโรป วัสดุกัน UV สำหรับตะวันออกกลางและออสเตรเลีย การรักษาต่อต้านความชื้นสำหรับเอเชียตะวันออกเฉียงใต้ การจัดส่งแต่ละครั้งถูกปรับให้เหมาะสมกับสภาพแวดล้อมปลายทาง'
      icon: tabler:world
stats:
  title: วางใจจากตัวเลข
  stats:
    - title: ปีในการประกอบธุรกิจ
