      amount: <2%
reasons:
  tagline: ความแตกต่างของ Paddle Board Overstock
  title: สิ่งที่ทำให้เราต่าง
  isBeforeContent: false
  columns: 3
  items:
    - title: การผลิตจริง ไม่ใช่การค้า
      description: เรามีโรงงานขนาด 12,000 ตารางเมตร เมื่อคุณร่วมงานกับ Paddle Board Overstock คุณจะทำงานโดยตรงกับผู้ที่ออกแบบ วิศวกร และสร้างผลิตภัณฑ์ของคุณ — ไม่มีคนกลาง
      icon: tabler:building-factory
    - title: แนวทางการออกแบบที่มุ่งเน้นวิศวกรรม
      description: กระบวนการออกแบบของเราเริ่มต้นจากกรณีการใช้งาน ไม่ใช่หมวดหมู่สินค้าเราปรับแต่งรูปทรงตัวเรือ การเลือกวัสดุ และการกําหนดค่าให้เหมาะสมกับการใช้งานจริงของบอร์ดบนผิวน้ํา
      icon: tabler:engine
    - title: คุณภาพที่พิสูจน์แล้ว
      description: ทุกแผ่นจะถูกทดสอบแรงดันที่ 1.25 เท่าของแรงดันที่กําหนดเป็นเวลา 24-48 ชั่วโมงก่อนจัดส่ง และ 99.3% ของการจัดส่งของเรามาถึงโดยไม่มีข้อบกพร่อง — พร้อมการรับประกันของเรา
      icon: tabler:award
    - title: การออกแบบที่เน้นนักพายเป็นอันดับแรก
      description: 'ทุกรุ่นเริ่มต้นจากวิธีการพาย: แพลตฟอร์มที่มั่นคงสําหรับผู้เริ่มต้น, รูปทรงที่ลู่ลมสําหรับทัวร์ และดาดฟ้าขนาดเต็มสําหรับโยคะเราออกแบบสําหรับนักพายจริง ไม่ใช่สเปกโชว์รูม'
      icon: tabler:adjustments
    - title: โลจิสติกส์ทั่วโลก
      description: คลังสินค้าของสหรัฐอเมริกาในแคลิฟอร์เนีย จัดส่งตรงจากเว่ยไห่ ค่าขนส่งทางอากาศสำหรับคำสั่งซื้อด่วน เราดูแลเอกสารศุลกากรและเอกสารอื่น ๆ ทั่วโลก
      icon: tabler:truck-delivery
    - title: การสนับสนุนตลอดอายุการใช้งาน
      description: เรายืนหยัดอยู่เบื้องหลังแผ่นไม้ที่เราสร้างขึ้นเมื่อ 20 ปีก่อนอะไหล่แท้ คําแนะนําทางเทคนิค คําแนะนําการซ่อมแซม — ทีมงานของเราพร้อมให้บริการเมื่อคุณต้องการ ไม่ว่าคุณจะอยู่ที่ไหน
      icon: tabler:lifebuoy
testimonials:
  tagline: ได้รับความไว้วางใจจากนักพายทั่วโลก
  title: สิ่งที่นักพายพูด
  items:
    - content: Ocean Voyager ของฉันรับมือได้ทุกอย่างตั้งแต่เช้าที่ทะเลสาบสงบจนถึงบ่ายชายฝั่งที่คลื่นแรงผ่านไปสองฤดูกาลแล้ว มันยังคงดูและขี่เหมือนใหม่
      name: — นักพายเรือเพื่อสันทนาการ, แคลิฟอร์เนีย
    - content: ฉันรู้สึกกังวลเวลาซื้อบอร์ดเป่าลมครั้งแรกทางออนไลน์ แต่คุณภาพก็เห็นได้ชัดตั้งแต่เป่าลมแข็งแรง มั่นคง และตกแต่งอย่างสวยงาม
      name: — SUP เจ้าของครั้งแรก ประเทศเยอรมนี
    - content: เราพายเรือกันเป็นครอบครัวทุกสุดสัปดาห์ฤดูร้อนมีบอร์ดสามใบ ไม่มีปัญหา และเด็กๆ ชอบลวดลายสีสดใส
      name: — Family Paddler, ออสเตรเลีย
    - content: การทดสอบแรงดันน้ําไม่ใช่แค่การตลาด — บอร์ดของผมแข็งแรงมากเมื่อแรงดันเต็มที่และไม่มีการยืดตัวหลังจากพายสัปดาห์ละครั้งหนึ่งปี
      name: — Weekly Paddler, เนเธอร์แลนด์
cta:
  title: พร้อมที่จะค้นหาบอร์ดที่สมบูรณ์แบบสําหรับคุณหรือยัง?
  subtitle: พูดคุยกับผู้เชี่ยวชาญด้านการพายของเราเพื่อขอคําแนะนําอย่างตรงไปตรงมาในการเลือกบอร์ดที่เหมาะสม — ไม่ต้องกดดัน แค่ได้รับความช่วยเหลือจริงๆ
  actions:
    - variant: primary
      text: พูดคุยกับทีมของเรา
      href: /contact
    - text: ดาวน์โหลดแคตตาล็อกสินค้า
      href: /resources
