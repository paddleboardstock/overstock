hero:
  tagline: กรณีศึกษา
  title: นักพายเรือจริง เรื่องราวจริง<br />— Paddle Board Overstock ในการปฏิบัติ
  subtitle: ดูว่านักพายเรือ ครอบครัว และนักผจญภัยทั่วโลกจะลงเล่นน้ําอย่างไรด้วย Paddle Board Overstock กระดานเป่าลม SUP
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Paddle Board Overstock เรื่องราวของลูกค้า — กระดานเป่าลม SUP ในทางปฏิบัติ
features3_cases:
  tagline: เรื่องเด่น
  title: กระดานจริง<br />เพื่อการผจญภัยที่แท้จริง
  isBeforeContent: false
  columns: 3
  items:
    - title: จากโซฟาสู่การยืนได้ตั้งแต่ครั้งแรก
      customer: นักพายเรือครั้งแรก
      country: เยอรมนี
      industry: กิจกรรมนันทนาการสําหรับผู้เริ่มต้น
      challenge: แอนนาไม่เคยพายเรือมาก่อนและรู้สึกกังวลเรื่องการทรงตัว น้ําเย็น และการดูงี่เง่าต่อหน้าคนอื่นเธออาศัยอยู่ในอพาร์ตเมนต์เล็กๆ ที่มิวนิก และไม่มีที่เก็บกระดานแข็งและไม่มีราวแขวนหลังคาสําหรับการเดินทาง
      solution: SUP Explorer 11 มอบแพลตฟอร์มที่กว้างและมั่นคง ให้อภัยการว่ายน้ําครั้งแรกที่สั่นชุดอุปกรณ์ครบชุด — บอร์ด ไม้พายปรับได้ ปั๊มน้ํา สายจูง และกระเป๋า — ทําให้เธอสามารถขนทุกอย่างไปทะเลสาบด้วยการเดินเท้าจากกล่องถึงน้ําในเวลาไม่ถึง 20 นาที โดยไม่ต้องมีประสบการณ์
      product: Explorer 11
      results: แอนนาลุกขึ้นในครั้งแรกที่พยายามและพายเรือได้หนึ่งชั่วโมงโดยไม่ล้มสองเดือนต่อมา เธอพายเรือสัปดาห์ละสามครั้งและเข้าร่วมกลุ่มพบปะท้องถิ่นกระดานนี้บรรจุใส่เป้ที่พอดีกับตู้เสื้อผ้าในทางเดินของเธอ
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      quote: ฉันคาดหวังว่าจะได้ใช้วันแรกว่ายน้ําข้างกระดานแต่กลับกลายเป็นว่ายน้ําข้ามทะเลสาบได้ภายในไม่กี่นาที — ฉันแทบไม่เชื่อเลยว่ามันมั่นคงขนาดนี้
      icon: tabler:school
    - title: บอร์ดเดียว ลูกสองคน ไม่มีข้อร้องเรียนใด ๆ
      customer: ครอบครัวสี่คน
      country: อิตาลี
      industry: กิจกรรมครอบครัว
      challenge: มาร์โกและจูเลียอยากได้กิจกรรมฤดูร้อนที่ลูกสองคนของพวกเขาจะทิ้งหน้าจอไว้จริงๆยางเป่าลมราคาถูกก่อนหน้านี้บิดงอ รั่วที่ตะเข็บ และแฟบกลางทาง — เด็กๆ สูญเสียความมั่นใจหลังจากว่ายน้ําไม่ดีครั้งเดียว
      solution: ซีรีส์ Tropical Breeze นําเสนอประสบการณ์วันหยุดแบบเกาะเต็มรูปแบบ — แสงแดด สวนมะพร้าว และวิวชายหาด — ที่ทําให้เด็กๆ อยากลงเล่นน้ําdrop-stitchแกนบอร์ดทํางานแข็งที่ 15 องศา PSI และทุกแผ่นจะถูกทดสอบแรงดันที่ 1.25 เท่าของแรงดันที่กําหนดเป็นเวลา 24-48 ชั่วโมงในโรงงานก่อนจัดส่ง
      product: ซีรีส์สายลมเขตร้อน
      results: ครอบครัวนี้พายเรือทุกสุดสัปดาห์ตั้งแต่เดือนมิถุนายนถึงกันยายนหลังจากฤดูกาลที่เด็กๆ มีคนมาเล่นเต็มฤดูกาล กระดานไม่มีรอยต่อหรือการซีดจางใดๆลูกสาวของพวกเขาเริ่มขอกระดานของตัวเองเป็นของขวัญวันเกิด
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      quote: เด็ก ๆ ทะเลาะกันว่าใครจะได้พายบ้างหลังจากที่เคยลองใช้บอร์ดราคาถูกก่อนหน้านี้ บอร์ดนี้รู้สึกเหมือนถูกสร้างมาเพื่ออยู่รอดกับครอบครัวเรา
      icon: tabler:users
    - title: สตูดิโอโยคะลอยน้ํายามพระอาทิตย์ขึ้น
      customer: ผู้ฝึกโยคะ
      country: อินโดนีเซีย
      industry: SUP โยคะและการทําสมาธิ
      challenge: ปูตูสอนโยคะที่บาหลีและต้องการนําการฝึกของเธอไปเล่นบนผิวน้ํา แต่ครั้งแรกที่เธอลองเล่นบนกระดานที่ยืมมารู้สึกลื่นและไม่มั่นคงการถือท่าทางขณะลอยอยู่บนน้ําเปิดต้องการการยึดเกาะ ความมั่นคง และการออกแบบที่ทําให้สงบ
      solution: ซีรีส์ Flowing Lotus ผสมผสานงานศิลปะลายบัว ปลาคาร์ฟ และแมลงปอ กับแผ่นยึดเกาะที่สลักด้วยเลเซอร์ ซึ่งช่วยให้มือและเท้ายึดติดกับด็อกที่ลงด้านล่างเส้นขอบกว้างรอบด้านและความหนา 6 นิ้ว สร้างแท่นลอยตัวที่มั่นคงสําหรับการไหลและนั่งสมาธิ
      product: ซีรีส์โลตัสไหลลื่น
      results: ปูตูตอนนี้เป็นผู้นํา SUP คลาสโยคะชมพระอาทิตย์ขึ้นเล็ก ๆ สัปดาห์ละสองครั้งนักเรียนของเธอจองล่วงหน้าหลายสัปดาห์ และกระดานกลายเป็นเอกลักษณ์ของคลาส — งานศิลปะช่วยทําการตลาดให้เธอได้ครึ่งหนึ่ง
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      quote: การฝึกบนผิวน้ําเปลี่ยนทุกอย่างกระดานมั่นคงพอสําหรับท่ากา และการออกแบบบัวทําให้ทุกคลาสรู้สึกเหมือนพิธีกรรม
      icon: tabler:heart
    - title: สีที่ฝังอยู่ในวัสดุ — ตามตัวอักษร
      customer: ผู้สร้างเนื้อหาท่องเที่ยว
      country: โปรตุเกส
      industry: โซเชียลมีเดียและการสร้างเนื้อหา
      challenge: มิเกลถ่ายทําเนื้อหาจากไม้พายเป็นอาชีพแผ่นไม้พิมพ์ที่เขาเคยใช้ก่อนหน้านี้สูญเสียสีในช่วงฤดูน้ําเค็มและแสงแดด — ฟุตเทจของเขาเริ่มดูเหนื่อยล้า และผู้ติดตามสังเกตเห็นแผ่นรองดาดฟ้าลอก
      solution: รุ่น Cheetah Surge สร้างลวดลายเสือชีตาห์ของมันจากการตัดชิ้นส่วนหลายสี EVA แบบไดคัท แทนการพิมพ์ลงบนพื้นผิว สีเป็นส่วนหนึ่งของโฟมเอง ดังนั้น น้ำเค็ม UV และการสัญจรเท้าจึงมีโอกาสน้อยมากที่จะทำให้ลวดลายจาง ลอก หรือเป็นรอย
      product: เชตาห์ ซอร์จ อิดิชั่น
      results: หลังจากถ่ายทําชายฝั่งครบหนึ่งปี บอร์ดดูเหมือนใหม่เอี่ยมบนกล้องคลิปพระอาทิตย์ขึ้นจากอัลการ์ฟกลายเป็นคอนเทนต์ที่ทําผลงานดีที่สุดของเขา และบอร์ดเองก็ปรากฏในความร่วมมือกับแบรนด์หลายสิบแบรนด์
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      quote: กระดานเก่าของผมเก่าเร็วกว่าคอนเทนต์ของผม Cheetah ดูเหมือนวันแรกหลังจากอยู่ในทะเลมาหนึ่งปี — ผู้ติดตามของผมถามตลอดว่าผมใช้ฟิลเตอร์ตัวไหนมันไม่ใช่ฟิลเตอร์มันคือบอร์ด
      icon: tabler:camera
    - title: ทริปสํารวจชายฝั่งสุดสัปดาห์
      customer: นักพายเรือทัวร์ชายฝั่ง
      country: ออสเตรเลีย
      industry: ท่องเที่ยว & สำรวจ
      challenge: ทอมอยากพายเรือในอ่าวสงบและแหลมของโกลด์โคสต์ในทัวร์หลายชั่วโมง แต่บอร์ดราคาประหยัดที่น้ําหนักเบากลับงอในคลื่นและทําให้เขาเหนื่อยหลังจากผ่านไปหนึ่งชั่วโมงเขาต้องการความแข็งแรงที่สามารถพายเดี่ยวไปยังจุดพักที่ห่างไกลได้
      solution: ซีรีส์ Ocean Voyager ผสมผสานงานศิลปะเต่าทะเลในสีฟ้าเขียวเข้มและปะการัง กับdrop-stitchแกนแข็งที่คงรูปทรงไว้ได้แม้จะเกิดคลื่นเบา ๆ ตามชายฝั่งด้วยน้ําหนักประมาณ 20 ปอนด์ในกระเป๋าเป้ ทอมสามารถเดินป่าไปยังชายหาดที่ไม่มีรถยนต์คนไหนไปถึง เติมลมด้วยปั๊มที่แถมมา และเดินชมได้นานหลายชั่วโมง
      product: ชุดนักเดินเรือมหาสมุทร
      results: ตอนนี้ทอมได้ทําแผนที่เส้นทางชายฝั่งไปแล้วสิบเอ็ดเส้นทาง รวมถึงการข้ามทะเลช่วงเช้าเต็มที่เขาเคยคิดว่าเกินความสามารถของเขากระดานจะแข็งตั้งแต่ปล่อยเรือจนถึงมื้อกลางวัน และลายเต่าทะเลกลายเป็นลายเซ็นที่เขารู้จักบนผิวน้ํา
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: แผ่นไม้แข็งให้ความรู้สึกเหมือนแผ่นฮาร์ดบอร์ด แต่แผ่นนี้แบกเหมือนกระเป๋าเป้มันเปิดชายฝั่งที่ฉันไม่มีทางไปถึงได้ด้วยรถยนต์และรถพ่วง
      icon: tabler:compass
    - title: ฟิตเนสทั้งตัว ไม่มีค่าธรรมเนียมฟิตเนส
      customer: นักพายเรือฟิตเนส
      country: แคนาดา
      industry: ฟิตเนสและการฝึกซ้อม
      challenge: ปรียาต้องการออกกําลังกายทั้งตัวที่มีแรงกระแทกต่ําและไม่รู้สึกเหมือนออกกําลังกายจริง ๆการวิ่งทําให้เข่าของเธอเจ็บ และยิมก็รู้สึกซ้ําซาก — เธอเลิกทุกกิจวัตรภายในหกสัปดาห์
      solution: 'Dolphin Wave Series เปลี่ยนการออกกําลังกายให้กลายเป็นกิจกรรม: การพายเผาผลาญแคลอรี สร้างความแข็งแรงของแกนกลางและไหล่ และท้าทายการทรงตัว พร้อมกับการล่องผ่านทิวทัศน์แวนคูเวอร์ดาดฟ้าขนาด 32 นิ้วที่มั่นคงให้อภัยการพายที่ไม่คล่องตัว แต่ยังคงต้องการการทรงตัวเล็กๆ น้อยๆ อย่างต่อเนื่อง — ยิมที่ปลอมตัวเป็นกระดานพาย'
      product: ซีรีส์โลมาเวฟ
      results: ปรียาพายเรือห้าเช้าก่อนเข้างานสัปดาห์ละห้าครั้ง และรักษากิจวัตรนี้มา 14 เดือน — สถิติส่วนตัวของเธอสําหรับแผนการออกกําลังกายใดๆเพื่อนๆ ตอนนี้เข้าร่วมชมรมพายเรือประจําสัปดาห์ของเธอ และเข่าของเธอก็มีความสุขที่สุดเท่าที่เคย
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
      quote: ฉันไม่เคยต้องบังคับตัวเองให้พายเรือเลยสักครั้งการออกกําลังกายนั้นจริงจัง — ฉันแค่หยุดสังเกตเพราะมัวแต่สนุกกับน้ํา
      icon: tabler:trophy
    - title: ลาบราดอร์น้ําหนัก 30 กิโลกรัม และพื้นระเบียงที่มั่นคงมาก
      customer: นักพายเรือกับสุนัข
      country: สหรัฐอเมริกา
      industry: พายเรือพร้อมสัตว์เลี้ยง
      challenge: เจคอยากพาสุนัขลาบราดอร์ของเขา บิสกิต ลงน้ํา แต่กระดานแคบเก่าของเขากลับกลายเป็นเรือดําน้ําทันทีที่สุนัขกระโดดขึ้นเรือกรงเล็บยังฉีกแผ่นรองดาดฟ้าราคาถูกนี้ภายในไม่กี่สัปดาห์
      solution: Leviathan Wake Series มีแพลตฟอร์มกว้างและรองรับน้ําหนักสูง รองรับผู้โดยสารน้ําหนัก 30 กิโลกรัมโดยไม่จมอยู่EVA พื้นไม้ยึดเกาะยังคงอยู่แม้กรงเล็บจะทําลายกระดานเดิมของเขา และสัญลักษณ์ปลาวาฬสีน้ําเงินก็ทําให้บิสกิตมี "จุด" นั่งที่มองเห็นได้ชัดเจน
      product: ซีรีส์เลเวียธาน เวค
      results: บิสกิตกระโดดขึ้นเรือตามคําสั่งและขี่หัวเรือเหมือนหุ่นเชิดสองฤดูร้อน ดาดฟ้าไม่มีรอยกรงเล็บเสียหาย และไม้พายแม่น้ํากลายเป็นเนื้อหาที่ได้รับความนิยมมากที่สุดในฟีดของเจค
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-leviathan-wake-1.webp
      quote: ผมซื้อบอร์ดและได้ผู้ช่วยกัปตันดาดฟ้ารับมือกับทุกอย่างที่สุนัขตัวใหญ่เปียกจะขว้างใส่ — จริงๆ
      icon: tabler:dog
    - title: งบประมาณนักศึกษา คุณภาพราคาเต็ม
      customer: นักศึกษามหาวิทยาลัย
      country: โปแลนด์
      industry: วิถีชีวิตนักศึกษา
      challenge: คาเซียเป็นนักศึกษาที่เมืองกดัญสค์ มีงบประมาณสําหรับนักเรียนและกิจวัตรฤดูร้อนที่ทะเลสาบกระดานราคาถูกทุกแผ่นที่เธอหาเจอมักจะเปราะบาง ไม่สวย หรือทั้งสองอย่าง — และกระดานคุณภาพก็มีราคาสูงกว่างบอาหารรายเดือนของเธอเสียอีก
      solution: Medusa Glow Series ผสมผสานงานสร้างระดับพรีเมียม — drop-stitch แกนกลาง ความแข็งแรง 15 นิ้ว PSI งานศิลปะแมงกะพรุนสีเขียวมิ้นต์ที่ประกอบจากบล็อกแม่พิมพ์ EVA — กับ Paddle Board Overstock ราคาลดราคาจากโรงงานโดยตรงที่ไม่ต้องผ่านคนกลางทุกขั้นตอน
      product: ซีรีส์เมดูซ่า โกลว์
      results: คาเซียจ่ายน้อยกว่าครึ่งหนึ่งของราคาบอร์ดพรีเมียมที่ขายในท้องถิ่นบอร์ดของเธอผ่านฤดูกาลเต็มของการฝึกที่ทะเลสาบทุกวันและสัปดาห์ที่ชายหาดบอลติก และเพื่อนร่วมชั้นสามคนก็สั่งซื้อบอร์ดของตัวเองหลังจากลองบอร์ดของเธอ
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
      quote: ฉันคาดหวังว่าจะมีการประนีประนอมงบประมาณของนักเรียนแต่กลับได้บอร์ดที่เพื่อนคิดว่าแพงกว่าสามเท่า — และมันก็อยู่ได้นานกว่าสองบอร์ดของพวกเขา
      icon: tabler:backpack
    - title: การปล่อยตัวจากแท่นที่มั่นคง
      customer: นักตกปลาช่วงสุดสัปดาห์
      country: สหรัฐอเมริกา
      industry: SUP การตกปลาแบบสบาย ๆ
      challenge: เดวอนตกปลาในแหล่งน้ําตื้นที่เงียบเกินกว่ายานยนต์จะไปถึงเขาต้องการเรือพายที่มั่นคงพอจะเหวี่ยงเบ็ดขณะยืน แข็งแรงพอสําหรับเบ็ดและอุปกรณ์ และน้ําหนักเบาพอที่จะพาไปตามทางตอนรุ่งสาง
      solution: ชุด Jungle Mandala ให้แท่นยืนกว้างและแข็งแรงสําหรับการขว้าง พร้อมดาดฟ้าสีฟ้าทิฟฟานี่ที่มีรูปชบาและนกฮัมมิงเบิร์ดซึ่งเย็นสบายใต้แสงแดดยามเช้ากระดานสามารถบรรจุขนาดเป้สําหรับเส้นทางเข้าไป พองตัวได้ภายในไม่กี่นาทีที่ริมน้ํา และผิวเสริมความแข็งแรง PVC ช่วยป้องกันการติดขัดของตะขอและครีบ
      product: ซีรีส์ป่ามันดาลา
      results: เดวอนตอนนี้มีอ่าววางไข่สามแห่งที่ไม่มีใครตกปลาได้อัตราการจับปลาของเขาเพิ่มขึ้นเป็นสองเท่าตลอดฤดูกาล และกระดาน — ทั้งเบ็ด สตริงเกอร์ และอื่น ๆ — ก็ยังดูพร้อมสําหรับฤดูร้อนอีกปี
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-jungle-mandala-1.webp
      quote: การยืนบนกระดานนี้SUP เปลี่ยนวิธีการตกปลาของผมไปอย่างสิ้นเชิงบอร์ดนี้มั่นคงพอที่จะขว้าง ตั้งเบ็ด และจับปลาได้ — ทั้งหมดนี้โดยไม่ต้องเปียกน้ํา
      icon: tabler:fish
