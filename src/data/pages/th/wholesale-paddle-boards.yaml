faq_section:
  title: คำถามที่พบบ่อยเกี่ยวกับการขายส่ง
  items:
    - q: คำสั่งซื้อขายส่งขั้นต่ำคือเท่าใด?
      a: ห้าบอร์ด โมเดลสินค้าคงคลังของเราถูกสร้างขึ้นสำหรับร้านค้าปลีกขนาดเล็ก — คุณไม่จำเป็นต้องเติมคอนเทนเนอร์เพื่อรับราคาขายส่ง
    - q: สามารถผสมรุ่น SUP ต่าง ๆ ในคำสั่งซื้อขายส่งเดียวกันได้หรือไม่?
      a: ได้ คำสั่งซื้อผสมรุ่นเป็นหนึ่งในข้อได้เปรียบที่ใหญ่ที่สุดของการซื้อสินค้าสำรอง — รวมรุ่นใด ๆ ที่มีอยู่ในสต็อกในคำสั่งจัดส่งเดียว และจำนวนบอร์ดรวมจะกำหนดระดับราคาของคุณ ดูหน้าขายส่งรุ่นผสมของเราสำหรับรายละเอียด
    - q: แผ่นบอร์ดพวกนั้นใหม่เอี่ยมหรือเปล่า?
      a: ใช่ แผงวงจรทุกชิ้นเป็นสินค้าใหม่เอี่ยม สต็อกเกินที่ยังไม่เคยใช้งาน — ไม่ใช่ของที่สอง ของที่ซ่อมแล้ว หรือสินค้าที่ลูกค้าคืน ทุกแผงผ่านการทดสอบแรงดัน 100% ก่อนส่งออก
    - q: ขายส่งถูกกว่าขายปลีกเท่าไหร่?
      a: ราคาหน่วยขายส่งจะระบุต่อคำสั่งซื้อโดยขึ้นอยู่กับรุ่นและปริมาณ และมีราคาที่ต่ำกว่าราคาขายปลีกที่ระบุข้างต้นอย่างมีนัยสำคัญ ขอให้ส่งคำขอเสนอราคาสำหรับส่วนผสมที่คุณต้องการ และเราจะตั้งราคาให้ตรงตามนั้น
    - q: ฉันควรเลือกวิธีการจัดส่งแบบใด?
      a: การจัดส่งทางอากาศด่วนเหมาะสำหรับบอร์ด 1–3 แผ่น ตัวอย่าง และการสต็อกเติมด่วน การจัดส่งทางทะเลแบบรวมเป็นตัวเลือกที่ประหยัดสำหรับคำสั่งซื้อของร้านค้าระหว่างบอร์ด 5–20 แผ่น เราเสนอราคาสำหรับทั้งสองตัวเลือกในทุกคำถาม
    - q: บอร์ดขายส่งมีการรับประกันอย่างไร?
      a: การรับประกัน 2 ปีเดียวกัน SUP ที่เรามอบให้แก่ลูกค้าทุกคน ในทุกหนึ่งใน 50+ ประเทศที่เราจัดส่งไป
    - q: คุณส่งของไปประเทศของฉันไหม?
      a: ปัจจุบันเราจัดส่งไปยังมากกว่า 50 ประเทศ โดยมีคู่มือภูมิภาคสำหรับละตินอเมริกา เอเชียตะวันออกเฉียงใต้ แอฟริกา ตะวันออกกลาง และตลาดสำคัญรวมถึงเม็กซิโก บราซิล ฟิลิปปินส์ อินโดนีเซีย ไทย แอฟริกาใต้ เคนยา และสหรัฐอาหรับเอมิเรตส์ โปรดสอบถามในการขอใบเสนอราคา และเราจะยืนยันบริการปัจจุบันไปยังที่อยู่ของคุณ
