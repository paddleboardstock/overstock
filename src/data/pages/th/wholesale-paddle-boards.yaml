hero:
  tagline: SUP แผงขายส่ง
  title: ขายส่งกระดานพายเป่าลม<br />สําหรับธุรกิจขนาดเล็ก
  subtitle: บอร์ดสินค้าคงคลังใหม่ใน SUP ปริมาณที่เป็นมิตรกับธุรกิจขนาดเล็กสั่งซื้อบอร์ด 5–20 แผ่น ผสมโมเดลใดก็ได้ในหนึ่งครั้ง และเลือกขนส่งด่วนทางอากาศหรือทางทะเลไปยัง 50+ ประเทศ
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: ขายส่งกระดานเป่าลม SUP พร้อม Paddle Board Overstock จัดส่ง
direct_answer: Paddle Board Overstock จัดส่งบอร์ดเป่าลมใหม่เอี่ยมที่ยังเหลืออยู่ให้กับ SUP ร้านค้าปลีกขนาดเล็กทั่วโลกไม่มีคําสั่งซื้อขั้นต่ําจํานวนมาก — คําสั่งซื้อขายส่งเริ่มต้นที่เพียง 5 บอร์ด และคุณสามารถผสมรุ่นที่มีในสต็อกได้ทุกแบบในคําสั่งซื้อเดียวบอร์ดจัดส่งจากฐานของเราที่เว่ยไห่ ประเทศจีน โดยการขนส่งทางอากาศด่วน (1–3 บอร์ด ตัวอย่าง หรือเติมสต็อกด่วน) หรือขนส่งทางทะเลแบบรวม (สั่งบอร์ด 5–20 บอร์ดจากร้านค้าปลีก)บอร์ดทุกชิ้นผ่านการทดสอบแรงดัน 100% ก่อนจัดส่ง และครอบคลุมภายใต้การรับประกัน 2 ปีของเรา SUP
tldr_points:
  - 'ต่ํา MOQ: คําสั่งซื้อขายส่งเริ่มต้นที่ 5 บอร์ด — ขนาดสําหรับร้านค้าขนาดเล็ก ไม่ใช่ขนาดตู้คอนเทนเนอร์'
  - 'คําสั่งซื้อแบบผสม: รวมรุ่นที่มีในสต็อก SUP ทั้งหมดในการจัดส่งเดียว'
  - 'มีสองทางเลือกในการจัดส่ง: ขนส่งด่วนทางอากาศสําหรับ 1–3 บอร์ด, ขนส่งทางทะเลสําหรับคําสั่งซื้อ 5–20 บอร์ด'
  - 'สินค้าใหม่เอี่ยม: ผ่านการทดสอบแรงดัน 100%, ผ่านการตรวจสอบขั้นสุดท้าย 99.3%, รับประกัน 2 ปีSUP'
why_retailers:
  title: ทําไมร้านค้าปลีกขนาดเล็กถึงเลือก SUP ใช้แผ่นไม้สต็อกเกิน
  subtitle: คุณไม่จําเป็นต้องมีคลังสินค้าหรืองบประมาณตู้คอนเทนเนอร์เพื่อซื้อในราคาขายส่ง
  items:
    - title: ปริมาณที่เป็นมิตรกับธุรกิจขนาดเล็ก
      description: การขายส่งแบบดั้งเดิมต้องการสินค้าหลายร้อยชิ้นต่อคําสั่งซื้อโมเดลสต็อกเกินของเราออกแบบมาเพื่อร้านค้าอิสระ — เริ่มจาก 5 แผ่นบอร์ดและขยายคําสั่งซื้อของคุณตามการเติบโตของร้าน
    - title: ราคาขายส่งจริงโดยไม่ต้องผูกมัดปริมาณ
      description: เนื่องจากเราขายสินค้าคงคลังส่วนเกิน — ทั้งการผลิตส่วนเกินและสต็อกที่คัดสรรอย่างพิถีพิถันจากโรงงานพันธมิตรที่คัดสรร — คุณจะได้ราคาต่อหน่วยตามปริมาณโดยไม่มีความเสี่ยงจากปริมาณ
    - title: ผสมผสานโมเดลให้ตรงกับลูกค้าของคุณ
      description: ร้านค้าริมชายหาด ร้านจัดอุปกรณ์ริมทะเลสาบ และร้านค้าในเมืองให้บริการนักพายหลากหลายประเภทผสมผสานทั้งรุ่นอเนกประสงค์ ทัวร์ และสไตล์เซิร์ฟ SUP ในคําสั่งซื้อเดียว เพื่อให้ชั้นวางของคุณตรงกับความต้องการในพื้นที่ของคุณ
    - title: ใหม่เอี่ยม ไม่เคยใช้งาน
      description: แผ่นไม้ทุกแผ่นในสินค้าคงคลังส่วนเกินของเราเป็นแผ่นใหม่เอี่ยมและไม่ได้ใช้งาน — ไม่ใช่แผ่นสํารอง ไม่ใช่แผ่นคืนแผ่นแต่ละแผ่นผ่านการทดสอบแรงดัน 100% ก่อนออกจากคลังสินค้า
    - title: การจัดส่งระหว่างประเทศที่รวดเร็วและยืดหยุ่น
      description: ขนส่งทางอากาศด่วนจะส่งบอร์ดหรือตัวอย่างคําสั่งซื้อ 1–3 ชุดถึงหน้าประตูบ้านคุณอย่างรวดเร็ว;การขนส่งทางทะเลแบบรวมช่วยให้ต้นทุนต่อบอร์ดต่ําสําหรับคําสั่งซื้อจากร้านค้าปลีก 5–20 บอร์ด
    - title: รับประกันด้วยการรับประกันจริง
      description: การขายส่งไม่ได้หมายความว่าไม่ได้รับการสนับสนุน SUP ทุกบอร์ดมีการรับประกัน 2 ปีของเรา ซึ่งเป็น SUP ความคุ้มครองเดียวกับที่เรามอบให้กับลูกค้าทุกคนใน 50+ ประเทศ
pricing_section:
  tagline: ราคาขายส่ง
  title: ราคาขายส่งที่เรียบง่ายและโปร่งใส
  subtitle: ราคาจะถูกระบุตามคําสั่งซื้อตามรุ่น ปริมาณ และวิธีการจัดส่งที่คุณเลือกไม่มีค่าธรรมเนียมแอบแฝง — ใบเสนอราคาที่คุณได้รับคือราคาที่คุณจ่าย
  points:
    - title: แบ่งตามปริมาณ
      description: ราคาต่อหน่วยลดลงเมื่อขนาดคําสั่งซื้อเพิ่มขึ้นคําสั่งซื้อ 10 บอร์ดมีราคาต่อบอร์ดดีกว่าคําสั่งซื้อ 5 บอร์ด;คําสั่งซื้อ 20 บอร์ดจะดีกว่าอีก
    - title: โมเดลผสมนับรวมเป็นหนึ่งยอดรวม
      description: ระดับส่วนลดของคุณจะคํานวณจากจํานวนบอร์ดทั้งหมดในคําสั่งซื้อ — ไม่ใช่ต่อรุ่นการผสม 4 รุ่น× 3 บอร์ดแต่ละรุ่นจะนับเป็นคําสั่งซื้อ 12 บอร์ด
    - title: เสนอราคาพร้อมตัวเลือกการจัดส่ง
      description: ใบเสนอราคาทุกใบจะรวมทั้งตัวเลือกขนส่งด่วนและขนส่งทางทะเลพร้อมเวลาขนส่งโดยประมาณ ดังนั้นคุณสามารถเลือกสมดุลความรวดเร็วต่อต้นทุนที่เหมาะสมกับระยะเวลาการเติมสต็อกของคุณ
    - title: ไม่ต้องมีบัญชีหรือสมาชิก
      description: ไม่มีคลับขายส่งให้เข้าร่วมและไม่มีค่าธรรมเนียมรายปีขอใบเสนอราคา ยืนยันคําสั่งซื้อ แล้วเราจะจัดส่งสินค้า
inventory_section:
  tagline: สินค้าคงคลังปัจจุบัน
  title: สินค้าที่มีจําหน่ายและสินค้าคงคลังปัจจุบัน
  subtitle: สินค้าทั้ง 11 รายการด้านล่างนี้เป็นสินค้าคงคลังส่วนเกินในปัจจุบันเงื่อนไขเป็นใหม่เอี่ยม;ระดับสินค้าคงคลังเปลี่ยนแปลงทุกสัปดาห์ กรุณาตรวจสอบความพร้อมในคําขอใบเสนอราคาของคุณ
  table_labels:
    product: รุ่น
    condition: สภาพ
    price: ราคาขายปลีก
    action: ติดต่อเรา
    condition_value: ใหม่
    note: ราคาขายปลีกแสดงเพื่ออ้างอิงราคาขายส่งต่อหน่วยจะแสดงต่อคําสั่งซื้อและต่ํากว่าราคาขายปลีก
who_section:
  tagline: เราจัดหาใคร
  title: สร้างขึ้นสําหรับธุรกิจกีฬาทางน้ําอิสระ
  items:
    - title: ร้านค้าชายหาดและเซิร์ฟ
      description: ร้านค้าปลีกชายฝั่งขนาดเล็กที่ต้องการบอร์ด 5–15 ใบต่อฤดูกาล ผสมผสานระหว่างรุ่นอเนกประสงค์สําหรับนักท่องเที่ยวและบอร์ดสไตล์เซิร์ฟสําหรับคนท้องถิ่น
    - title: ผู้ขายออนไลน์
      description: ร้านค้าอีคอมเมิร์ซและผู้ขายในมาร์เก็ตเพลอร์SUP ทดสอบหมวดหมู่โดยไม่ต้องผูกมัดกับตู้คอนเทนเนอร์เต็มของรุ่นเดียว
    - title: รถเช่าและโรงเรียน
      description: การดําเนินงานเช่าและ SUP โรงเรียนที่เติมน้ํามันให้กับกองยานพาหนะ — บอร์ดที่ทนทาน รุ่นผสมเพื่อรองรับลูกค้าขนาดต่าง ๆ และระบบสํารองรับประกัน
    - title: รีสอร์ทและผู้ประกอบการทัวร์
      description: โรงแรม รีสอร์ทบนเกาะ และผู้ประกอบการทัวร์เพิ่มกิจกรรม SUP ด้วยกองเรือเริ่มต้นขนาดเล็กและการเติมสินค้าตามฤดูกาลที่ง่าย
how_to_order:
  tagline: มันทำงานอย่างไร
  title: วิธีสั่งซื้อขายส่ง
  steps:
    - title: เรียกดูสินค้าคงคลัง
      description: ตรวจสอบรุ่นที่มีสินค้า 11 รุ่นที่มีอยู่ด้านบน หรือใช้ตัวเลือกแบบผสมเพื่อร่างชุดสินค้าที่เหมาะสมกับลูกค้าของคุณ
    - title: ขอใบเสนอราคา
      description: ส่งรุ่น จํานวนโดยประมาณ ประเทศของคุณ และความเร็วในการจัดส่งที่ต้องการผ่านแบบฟอร์มสอบถามด้านล่างเราจะตอบกลับพร้อมราคาต่อหน่วยและตัวเลือกการจัดส่ง
    - title: ยืนยันและชำระเงิน
      description: อนุมัติใบเสนอราคาสุดท้าย — รุ่น จำนวน วิธีการขนส่ง และยอดรวม เงื่อนไขการชำระเงินจะถูกยืนยันตอนเสนอราคา
    - title: เราทดสอบ บรรจุ และจัดส่ง
      description: ทุกบอร์ดได้รับการทดสอบแรงดัน 100% บรรจุพร้อมชุดอุปกรณ์ครบถ้วน และจัดส่งจากเมืองเว่ยไห่ คุณจะได้รับหมายเลขติดตามสำหรับการเดินทางทั้งหมด
