content_challenge:
  tagline: ความท้าทาย
  title: ความต้องการของการเพาะเลี้ยงสัตว์น้ํา<br />อุปกรณ์ทนน้ําเค็ม
  subtitle: ฟาร์มปลา ฟาร์มไข่มุก และฟาร์มสัตว์ทะเลดําเนินงานในสภาพแวดล้อมทางทะเลที่มีสารเคมีรุนแรงที่สุด — การสัมผัสน้ําเค็มเป็นเวลานาน เศษเชื้อเพลิงและอาหารสัตว์ และการใช้ชีวิตประจําวันอย่างต่อเนื่อง
  paragraphs:
    - การเพาะเลี้ยงสัตว์น้ําดําเนินไปตลอด 365 วันต่อปีในสภาพแวดล้อมชายฝั่งและนอกชายฝั่งที่เปิดโล่งเรือทํางานที่ใช้ตรวจสอบกรง ขนส่งอาหารสัตว์ บํารุงรักษาสายไข่มุก และดูแลอุปกรณ์ต้องเผชิญกับการจุ่มน้ําเค็มอย่างต่อเนื่อง การ UV สัมผัส และการสัมผัสสารเคมีจากเชื้อเพลิง อาหารปลา และการบําบัดป้องกันสารจับสัตว์
    - '**การกัดกร่อนเป็นศัตรูหลัก** — อุปกรณ์ทางทะเลมาตรฐานเสื่อมสภาพอย่างรวดเร็วในสภาพเช่นนี้เครื่องยนต์นอกเรือ โครงรถพ่วง และอุปกรณ์ตัวเรือต้องเปลี่ยนใหม่อย่างต่อเนื่องผู้ปฏิบัติงานต้องการเรือที่สร้างจากวัสดุที่ทนต่อการกัดกร่อนและสามารถอยู่รอดในสภาพแวดล้อมนี้ได้หลายปีโดยไม่เสื่อมสภาพ'
    - '**ความน่าเชื่อถือในแต่ละวันเป็นสิ่งสําคัญ** — เรือทํางานที่เสียหมายถึงการพลาดตารางการให้อาหาร การเก็บเกี่ยวล่าช้า และการสูญเสียผลผลิตที่มีค่าใช้จ่ายสูงสําหรับฟาร์มไข่มุก การพลาดการตรวจสอบเพียงวันเดียวอาจหมายถึงความเสียหายของพืชผลอย่างรุนแรงสําหรับฟาร์มปลา การให้อาหารล่าช้าส่งผลต่ออัตราการเติบโตและความสามารถในการทํากําไร'
    - การAquafarerเพาะเลี้ยงสัตว์น้ําRIBsถูกออกแบบด้วยฮาร์ดแวร์ที่ทนต่อการกัดกร่อน Hypalon ท่อแข็งแรง และตัวเรือเสริมความแข็งแรงที่ออกแบบมาโดยเฉพาะสําหรับสภาพแวดล้อมที่ท้าทายของการเลี้ยงปลา การเพาะเลี้ยงไข่มุก และการเลี้ยงสัตว์ในมหาสมุทร
content_solution:
  tagline: โซลูชันของเรา
  title: สร้างขึ้นRIBsเพื่อวัตถุประสงค์<br />สําหรับอุตสาหกรรมการเพาะเลี้ยงสัตว์น้ํา
  subtitle: Aquafarer เรือทํางานเพาะเลี้ยงสัตว์น้ําทุกลําถูกออกแบบมาให้ทนต่อสภาพแวดล้อมน้ําเค็มที่รุนแรง พร้อมให้ประสิทธิภาพรายวันที่เชื่อถือได้
  list:
    - ท่อเกรดทางทะเล Hypalon — ทนต่อUVสารเคมีน้ําเค็ม เชื้อเพลิง และอาหารปลาได้เหนือกว่า
    - ฮาร์ดแวร์สแตนเลส 316 ทั่วทั้ง — ไม่เกิดสนิมเมื่อสัมผัสกับน้ําเค็มเป็นเวลานาน
    - เสริมความแข็งแรงด้วยแถบกันเสียดสีและแผ่นป้องกันกระดูกงูสําหรับการสัมผัสซ้ําระหว่างท่าเรือและกรง
    - พื้นรองรับน้ําอัตโนมัติเพื่อการล้างและระบายน้ําที่ง่ายหลังจากการขนส่งอาหารและการเก็บเกี่ยว
    - การออกแบบพื้นเรียบสําหรับใส่ถุงอาหารสัตว์ ถังเก็บเกี่ยว และอุปกรณ์ต่าง ๆ
    - การกําหนดค่าภายนอกตั้งแต่ 15 HP ถึง 60 — HP ปรับแต่งให้เหมาะสมกับน้ําหนักบรรทุกเทียบกับประสิทธิภาพการใช้เชื้อเพลิง
    - ตัวเลือกสีของท่อที่มองเห็นได้ชัดเจน เพื่อการสังเกตเห็นได้ง่ายในพื้นที่ฟาร์มขนาดใหญ่
content_segments:
  tagline: โปรไฟล์การเพาะเลี้ยงสัตว์น้ํา
  title: โซลูชัน Workboat<br />ตามประเภทการเพาะเลี้ยงสัตว์น้ํา
  subtitle: การดําเนินงานเพาะเลี้ยงสัตว์น้ําแต่ละแห่งมีความต้องการเรือทํางานที่แตกต่างกัน — ตั้งแต่เรือขนาดเล็กที่คล่องRIBsตัวสําหรับตรวจสอบกรงปลา ไปจนถึงแพลตฟอร์มขนส่งที่มั่นคงสําหรับการเลี้ยงไข่มุก และเรือทํางานหนักสําหรับฟาร์มปศุสัตว์ในมหาสมุทร
  items:
    - title: การเลี้ยงปลา
      subtitle: การตรวจสอบกรง, การขนส่งอาหารสัตว์, การสนับสนุนการเก็บเกี่ยว
      description: ฟาร์มปลาทะเลใช้กรงในพื้นที่ชายฝั่งและนอกชายฝั่งที่เปิดโล่งเรือทํางานถูกใช้ทุกวันสําหรับการตรวจสอบตาข่ายกรง การให้อาหาร การสนับสนุนการจับปลา และการบํารุงรักษาอุปกรณ์ความท้าทายหลักคือการกัดกร่อน — เรือมักสัมผัสกับน้ําเค็ม เศษอาหารปลา และเชื้อเพลิงอย่างต่อเนื่องเรือทํางานที่เชื่อถือได้เป็นสิ่งจําเป็น เพราะการให้อาหารที่พลาดหรือการเก็บเกี่ยวล่าช้าส่งผลโดยตรงต่อผลผลิตและกําไร
      features:
        - 'แพ็คเกจสภาพแวดล้อมที่เข้มข้น: ฮาร์ดแวร์สแตนเลส 316, ชิ้นส่วนโลหะผสมเกรดทางทะเล'
        - การจัดวางพื้นเรียบสําหรับการขนส่งถุงอาหารสัตว์และถังเก็บเกี่ยว
        - พื้นระเบียงแบบน้ําลอยอัตโนมัติ เพื่อการล้างล้างหลังการใช้งานที่ง่าย
        - Hypalon ท่อเคลือบกันสารเคมีสําหรับการสัมผัสอาหารและเชื้อเพลิง
        - แผ่นรัดเสริมความแข็งแรงสําหรับการสัมผัสในกรงและท่าเรือบ่อยครั้ง
    - title: การดําเนินงานการเพาะเลี้ยงไข่มุก
      subtitle: การขนส่งที่มั่นคงสําหรับการตรวจสอบและเก็บเกี่ยวสายไข่มุก
      description: ฟาร์มไข่มุกต้องการเรือทํางานที่มั่นคงและเชื่อถือได้สําหรับการขนส่งระหว่างเส้นไข่มุกในแต่ละวัน การตรวจสอบอวนหอยนางรม และการเก็บรวบรวมผลผลิตการดําเนินงานเหล่านี้ดําเนินการในพื้นที่ชายฝั่งที่ห่างไกลซึ่งมีโครงสร้างพื้นฐานการบํารุงรักษาจํากัดเรือต้องมีความมั่นคงพอสําหรับลูกเรือในการตรวจสอบเส้นไข่มุก พร้อมการขึ้นเรือที่ง่ายและมีพื้นที่ดาดฟ้ากว้างขวางสําหรับขนหอยนางรม ตาข่าย และเสบียงที่เก็บได้ความน่าเชื่อถือและการบํารุงรักษาที่ง่ายเป็นสิ่งสําคัญในฟาร์มที่ห่างไกล
      features:
        - การออกแบบตัวเรือที่มั่นคงสําหรับลูกเรือยืนระหว่างการตรวจสอบสายไข่มุก
        - พื้นเรียบพร้อมพื้นผิวกันลื่นเพื่อความปลอดภัยในการเคลื่อนย้ายลูกเรือ
        - ขอบเรือต่ําเพื่อการเข้าถึงตาข่ายหอยนางรมและเก็บเกี่ยวได้ง่าย
        - การกําหนดค่าภายนอกที่เรียบง่ายเพื่อการบํารุงรักษาในสถานที่ได้ง่าย
        - ชุดท่อและฮาร์ดแวร์ที่ทนต่อการกัดกร่อน สําหรับการสัมผัสน้ําเค็มอย่างต่อเนื่อง
    - title: การเลี้ยงสัตว์ในมหาสมุทรและการพัฒนาทางทะเล
      subtitle: การขนส่งเยาวชน การดูแลกรง การสนับสนุนการติดตาม
      description: การดําเนินงานเลี้ยงสัตว์ในมหาสมุทรเกี่ยวข้องกับการปล่อยปลาวัยอ่อนเข้าสู่สภาพแวดล้อมทางทะเลที่มีการจัดการ การติดตามการเจริญเติบโต และการบํารุงรักษาโครงสร้างเสริมสร้างเรือทํางานต้องขนส่งปลาวัยอ่อนมีชีวิตในภาชนะที่มีอากาศ ติดตั้งอุปกรณ์ตรวจสอบ และเข้าถึงพื้นที่ปล่อยปลาตื้นตามชายฝั่งการออกแบบตัวเรือต้องสมดุลระหว่างความสามารถในการบรรทุกน้ํากับระวางน้ําตื้นสําหรับการเข้าถึงชายหาดและปากแม่น้ํา
      features:
        - พื้นที่บนดาดฟ้าสําหรับตู้คอนเทนเนอร์ขนส่งลูกหลานที่มีอากาศและอุปกรณ์ตรวจสอบ
        - ระวางน้ําตื้นสําหรับเข้าถึงชายหาดและพื้นที่ปล่อยน้ําในปากแม่น้ํา
        - การลงจอดบนชายหาดที่ง่าย — เสริมความแข็งแรงด้วยการป้องกันกระดูกงูและหัวเรือ
        - จุดติดตั้งอุปกรณ์สําหรับตรวจสอบอิเล็กทรอนิกส์และอุปกรณ์เก็บตัวอย่าง
        - ท่อ Hypalon ทนทานสำหรับความคงทนในสภาพทรายผสมและน้ำทะเล
cta:
  title: กำหนดค่ากระบวนการทำงานของเรือประมงของคุณ
  subtitle: บอกเราเกี่ยวกับประเภทฟาร์ม เส้นทางประจำวัน และความต้องการบรรทุกของคุณ — เราจะแนะนำการกำหนดค่า RIB ที่เหมาะสมที่สุดสำหรับการดำเนินงานเพาะเลี้ยงสัตว์น้ำของคุณ
  actions:
    - variant: primary
      text: ขอราคาเพาะเลี้ยงสัตว์น้ำ
      href: /contact
    - text: ดูรุ่นเรือประมง
      href: /products
