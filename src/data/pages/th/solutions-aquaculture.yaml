  title: RIB เรือทํางาน<br />สําหรับการดําเนินงานเพาะเลี้ยงสัตว์น้ํา
  subtitle: เรือเป่าลมที่เชื่อถือได้และทนต่อการกัดกร่อนสําหรับการเลี้ยงปลา การเพาะเลี้ยงไข่มุก และการเลี้ยงสัตว์ในมหาสมุทร — ซึ่งการดําเนินงานประจําวันต้องพึ่งพาอุปกรณ์ที่ทนทานในสภาพแวดล้อมน้ําเค็มที่รุนแรง
