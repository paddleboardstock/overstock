hero:
  tagline: สร้างตามมาตรฐานที่สำคัญ
  title: เชื่อใจ Aquafarer
  subtitle: |
    64 โมเดลที่ได้รับการรับรอง CE — ผ่านการทดสอบด้านความปลอดภัย,<br />
    ความทนทาน และประสิทธิภาพ ไม่มีทางลัด ไม่มีข้อยกเว้น
  taglineSection: รับรอง ทดสอบ ได้รับการพิสูจน์
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  imageAlt: Aquafarer ผลิตภัณฑ์กำลังอยู่ระหว่างการทดสอบคุณภาพ
stats:
  title: Aquafarer ตามตัวเลข
  stats:
    - title: CE 6185
      description: รุ่นสันทนาการ 64 รุ่นที่ได้รับการรับรอง CE เป็นไปตามมาตรฐานความปลอดภัยของสหภาพยุโรป — ได้รับการรับรองโดย TÜV Rheinland
    - title: ISO 9001:2015
      description: ระบบการจัดการคุณภาพที่ได้รับการรับรองโดย SGS ตั้งแต่ปี 2022
    - title: BSCI & REACH
      description: การผลิตอย่างมีจริยธรรมและการปฏิบัติตามข้อกำหนดวัสดุของสหภาพยุโรป — ได้รับการตรวจสอบโดยอินเทอร์เทค
    - title: การรับประกันเรือ 5 ปี
      description: บนผ้าท่อ รอยต่อ และตัวเรือ — รับประกัน 2 ปี สำหรับ SUP และอุปกรณ์เสริม อัตราข้อบกพร่อง 99.3% (AQL 2.5 ต่อ ISO 2859)
features3_certifications:
  title: การรับรองและความสอดคล้อง
  subtitle: สินค้าทุกชิ้นได้รับการทดสอบอย่างอิสระ; 64 รุ่นได้รับการรับรองตามมาตรฐานสากล
  columns: 3
  isBeforeContent: true
  items:
    - title: CE ใบรับรอง
      description: มีรุ่นที่ได้รับการรับรอง CE จำนวน 64 รุ่น ครอบคลุม SUPs เรือคายัค เรือเล็ก และ RIBs ซึ่งได้มาตรฐานความปลอดภัยของยุโรป CE สำหรับเรือสันทนาการ แต่ละผลิตภัณฑ์จะผ่านการทดสอบแรงดัน ความลอยตัว และการรับน้ำหนักก่อนออกจากโรงงาน
      icon: tabler:certificate
    - title: ''
      description: โรงงานของเราที่ชิงเต่าขนาด 12,000 ตร.ม. ดำเนินงานภายใต้ระบบการจัดการคุณภาพ ISO 9001 แต่ละชุดการผลิตสามารถตรวจสอบย้อนหลังได้ มีการบันทึกและตรวจสอบทุกชุด
      icon: tabler:clipboard-check
    - title: BSCI การปฏิบัติตามสังคม
      description: เรามีการรับรอง BSCI ซึ่งรับประกันการปฏิบัติต่อแรงงานอย่างมีจรรยาบรรณ สภาพการทำงานที่ปลอดภัย และความรับผิดชอบต่อสิ่งแวดล้อมตลอดห่วงโซ่อุปทานของเรา
      icon: tabler:users
    - title: REACH & RoHS
      description: วัสดุทั้งหมด — โฟม PVC, Hypalon, EVA, กาว — เป็นไปตามข้อบังคับของสหภาพยุโรป REACH และ RoHS ไม่มีสารต้องห้าม ไม่มีการประนีประนอม
      icon: tabler:flask
    - title: ห้องปฏิบัติการทดสอบวัสดุ
      description: แล็บวัสดุภายในบริษัททดสอบความตึง ความต้านทาน UV ความสมบูรณ์ของรอยต่อ และความทนต่อการขีดข่วนของผ้าทุกล็อตก่อนการผลิต
      icon: tabler:microscope
    - title: การรับประกันเรือ 5 ปี
      description: Aquafarer เรือได้รับการรับประกันจำกัด 5 ปี สำหรับผ้าท่อ รอยต่อ และตัวเรือ SUP บอร์ดและอุปกรณ์เสริมมีการรับประกัน 2 ปี เราภูมิใจในสิ่งที่เราสร้างขึ้น
      icon: tabler:shield-check
testimonials:
  tagline: ความไว้วางใจของลูกค้า
  title: สิ่งที่ลูกค้าของเรากล่าว
  subtitle: ตั้งแต่นักพายมือใหม่ไปจนถึงผู้ประกอบการเรือมืออาชีพ — ดูว่าทำไมพวกเขาถึงไว้วางใจ Aquafarer
  items:
    - content: เราติดตั้ง Aquafarer RIBs ให้กับเรือเช่าทั้งหมดของเรา — 12 ลำในสามสถานที่ สองฤดูกาลที่ผ่านมาไม่มีความล้มเหลวเอกสารการรับรอง CE ทำให้การอนุมัติประกันเป็นไปอย่างราบรื่น ทีมวิศวกรรมของพวกเขายังปรับแต่งสีของท่อให้ตรงกับแบรนด์ของเราอีกด้วย
      name: มาร์โก วาเลนติ
      title: ผู้อำนวยการฝ่ายปฏิบัติการ, Adriatic Adventure Tours — ดูบรอฟนิก, โครเอเชีย
    - content: ในฐานะผู้ซื้อครั้งแรก ฉันกังวลเกี่ยวกับคุณภาพเมื่อต้องสั่งจากต่างประเทศ เอกสาร ISO และรายงานการทดสอบจากบุคคลที่สามที่พวกเขาแชร์ให้ฉันก่อนที่ฉันจะขอ ทำให้ฉันมั่นใจเต็มที่ เรือมาถึงภายใน 6 วันและเกินความคาดหมายของฉัน
      name: เจมส์ ธอร์นตัน
      title: SUP เจ้าของ Explorer 11 — แวนคูเวอร์, แคนาดา
    - content: เราดำเนินงาน Aquafarer RIBs เป็นจำนวน 24 ลำในกองเรือตรวจการณ์ชายฝั่ง กระบวนการ QC ของพวกเขาเป็นมาตรฐานในทุกชุด — ความแข็งแรงของตะเข็บเหมือนกัน การวางวาล์วเหมือนกัน ความดันเท่ากันทุกครั้ง ความสามารถในการทำซ้ำนี้มีความสำคัญเมื่อชีวิตขึ้นอยู่กับอุปกรณ์
      name: ร้อยตรี อันเดรส เรเยส
      title: เจ้าหน้าที่จัดซื้อทางทะเล กองเสริมด้านชายฝั่งฟิลิปปินส์ — มะนิลา, ฟิลิปปินส์
features3_lab:
  title: การทดสอบภายในและห้องปฏิบัติการคุณภาพ
  subtitle: วัสดุทุกล็อตและผลิตภัณฑ์สำเร็จรูปจะผ่านการทดสอบในห้องปฏิบัติการของเราก่อนที่จะจัดส่ง
  columns: 3
  isBeforeContent: true
  items:
    - title: การทดสอบความต้านแรงดึง
      description: 'ผ้าทุกม้วน PVC ถูกทดสอบตามมาตรฐาน ASTM D751 ข้อกำหนดขั้นต่ำ: 350 N/cm ในแนวตั้งและแนวนอน ชุดที่ไม่ผ่านการทดสอบจะถูกส่งกลับไปยังผู้จัดหา — เราปฏิเสธวัสดุที่เข้ามาประมาณ 3%'
      icon: tabler:scale
    - title: UV การเสื่อมสภาพอย่างรวดเร็ว
      description: ตัวอย่างผ้าผ่านการทดสอบสภาพอากาศเร่งด้วย QUV เป็นเวลา 1,000 ชั่วโมง (ASTM G154) ความคงทนของแรงดึงต้องเกิน 80% หลังจากการสัมผัส UV ผลิตภัณฑ์ที่ได้รับการจัดอันดับสำหรับการใช้งานกลางแจ้ง 3+ ปี
      icon: tabler:sun
    - title: ความแข็งแรงของรอยต่อในการลอก
      description: รอยต่อที่เชื่อมด้วย RF ทดสอบที่ความแข็งแรงในการลอกอย่างน้อย 5 N/mm (ASTM D751) รอยต่อที่ติดด้วยมือ Hypalon ทดสอบที่ 3.5 N/mm แต่ละชุดการผลิตมีตัวอย่างรอยต่อที่ถูกทดสอบแบบทำลายและเก็บบันทึกไว้
      icon: tabler:stack
    - title: การกดทับค้างไว้ 24–48 ชั่วโมง
      description: 'ผลิตภัณฑ์เป่าลมทุกชิ้นจะถูกเติมลมจนถึง 1.25 เท่าของค่าที่กำหนด PSI และเฝ้าสังเกตเป็นเวลา 24–48 ชั่วโมง การลดความดันสูงสุดที่อนุญาต: 5% ผลิตภัณฑ์ที่ไม่ผ่านการทดสอบนี้จะถูกปรับปรุงและทดสอบใหม่ก่อนจัดส่ง'
      icon: tabler:wind
    - title: การทดสอบวาล์วรอบ
      description: การออกแบบวาล์วแต่ละแบบต้องผ่านการทดสอบเปิด-ปิด 10,000 รอบในห้องปฏิบัติการของเรา วาล์วต้องคงความสามารถในการปิดผนึกได้แน่นที่ความดัน 1.25 เท่าของความดันที่กำหนดหลังการทดสอบรอบทั้งหมด วาล์ว Aquafarer ทั้งหมดถูกกำหนดอายุการใช้งานปกติ 5+ ปี
      icon: tabler:rotate
    - title: ความต้านทานต่อการแตกร้าวเมื่อเย็น
      description: วัสดุที่ทดสอบที่ -30°C เป็นเวลา 4 ชั่วโมงต่อ ISO 4646 ห้ามเกิดการแตกร้าวหรือแข็งกระด้าง ผลิตภัณฑ์ที่ให้คะแนนสำหรับการเก็บรักษาฤดูหนาวและการใช้น้ำเย็นที่อุณหภูมิแวดล้อมต่ำถึง -10°C
      icon: tabler:snowflake
steps2_manufacturing:
  title: เรารับประกันคุณภาพอย่างไร
  subtitle: ตั้งแต่การตรวจสอบวัตถุดิบไปจนถึงการทดสอบแรงดันสุดท้าย — ผลิตภัณฑ์ทุกชิ้นต้องผ่านห่วงโซ่คุณภาพที่เข้มงวด
  items:
    - title: การตรวจสอบวัตถุดิบ
      description: ผ้าทุกม้วนของ PVC จะถูกทดสอบความหนา ความต้านแรงดึง และความต้านทานต่อ UV ก่อนเข้าสู่การผลิต
      icon: tabler:search
    - title: การควบคุมคุณภาพระหว่างกระบวนการ
      description: รอยเชื่อม การติดตั้งวาล์ว และการเชื่อมต่อของห้องจะถูกตรวจสอบที่แต่ละสถานีระหว่างการประกอบ
      icon: tabler:eye
    - title: การทดสอบแรงดัน
      description: ผลิตภัณฑ์เป่าลมทุกชิ้นจะถูกเติมลมให้ถึง 1.25x PSI และเก็บไว้ 24–48 ชั่วโมงเพื่อยืนยันการกักเก็บอากาศและความสมบูรณ์ของรอยต่อ
      icon: tabler:wind
    - title: การตรวจสอบขั้นสุดท้าย
      description: แต่ละหน่วยจะได้รับการตรวจสอบด้านการตกแต่ง ฮาร์ดแวร์ และบรรจุภัณฑ์ก่อนอนุมัติการจัดส่งตัวอย่างชุดจะถูกส่งไปยังห้องปฏิบัติการของเราเพื่อทดสอบการทําลาย
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB คําถามที่พบบ่อยเกี่ยวกับเรือ
  subtitle: คําถามที่พบบ่อยเกี่ยวกับเรือยางแบบตัวเรือแข็งของเรา
  columns: 2
  items:
    - title: มีเรือขนาดไหนRIB Aquafarer บ้าง?
      description: เรามีรุ่นให้เลือก 35 RIB รุ่น ตั้งแต่ 2.5 เมตร ถึง 7.6 เมตร ครอบคลุมตั้งแต่เรือเทนเดอร์ขนาดกะทัดรัดไปจนถึงเรือพาณิชย์และเรือลาดตระเวนขนาดใหญ่แต่ละรุ่นมีตัวเลือกการกําหนดค่าหลายแบบ
    - title: ความแตกต่างระหว่างRIBเรือเป่าลมกับเรือเป่าลมแบบดั้งเดิมคืออะไร?
      description: A RIB (เรือยางแข็ง) ผสมผสานตัวเรือไฟเบอร์กลาสหรืออะลูมิเนียมแบบ Deep-V กับเรือยางหรือHypalon PVC ท่อสิ่งนี้ให้ความมั่นคงและความสามารถในการบรรทุกของเรือแข็ง พร้อมทั้งการดูดซับแรงกระแทกและความลอยตัวของเรือยาง
    - title: เครื่องยนต์รุ่นไหนที่ใช้งานร่วมกับAquafarerRIBsได้บ้าง?
      description: เราRIBsรองรับเครื่องยนต์นอกเรือตั้งแต่ 3 HP ถึง 250 ขึ้นอยู่กับHPรุ่นแต่ละหน้าสินค้าจะแสดงกําลังเครื่องยนต์สูงสุดที่กําหนดไว้เราแนะนําให้ปรึกษาตัวแทนจําหน่ายของคุณเพื่อความเหมาะสมที่เหมาะสม
    - title: ได้รับAquafarer RIBs CE การรับรองหรือไม่?
      description: ใช่โมเดลเพื่อการพักผ่อนทั้งหมดRIBได้รับCEการรับรองตามมาตรฐานยุโรปที่ใช้บังคับสําหรับเรือเพื่อการพักผ่อนโมเดลเชิงพาณิชย์และลาดตระเวนมีข้อกําหนดเพิ่มเติมด้านความมั่นคงและน้ําหนักบรรทุก
    - title: เรือมีการรับประกันอะไรบ้างRIB?
      description: ทุกรุ่นAquafarer RIBs มาพร้อมกับการรับประกันแบบจํากัด 5 ปี สําหรับผ้าท่อ รอยต่อ และตัวเรือ; วาล์วเติมลมคุ้มครอง 5 ปี; อุปกรณ์เสริมที่ติดตั้งจากโรงงานคุ้มครอง 1 ปี
    - title: มีห้องลมกี่ห้องAquafarer RIBs ?
      description: เรามีRIBsห้องอากาศอิสระ 3 ถึง 7 ห้อง ขึ้นอยู่กับความยาวของรุ่นการออกแบบหลายห้องนี้ช่วยให้เรือลอยอยู่ได้แม้จะมีช่องใดห้องหนึ่งเสียหาย
faqs_inflatable:
  title: คําถามที่พบบ่อยเกี่ยวกับเรือเป่าลม
  subtitle: คําถามที่พบบ่อยเกี่ยวกับเรือยาง เรือคายัค และเรือยางของเรา
  columns: 2
  items:
    - title: ใช้วัสดุอะไรในAquafarerเรือเป่าลม?
      description: เราใช้เกรดทหาร PVC (1100 denier) และยางพรีเมียม Hypalon/CSM ยาง ขึ้นอยู่กับรุ่นวัสดุทั้งสองแบบมีUVความแข็งแรง ทนต่อการขีดข่วน และเป็นไปตามข้อกําหนดของสหภาพยุโรปREACHและRoHSข้อบังคับ
    - title: เรือเป่าลมใช้งานได้นานแค่ไหน?
      description: หากดูแลอย่างเหมาะสม PVC เรือเป่าลมคุณภาพดีจะมีอายุการใช้งาน 7–10 ปี ขณะHypalonที่รุ่นต่าง ๆ สามารถใช้งานได้ 15–20 ปีการทําความสะอาด UV การป้องกัน และการเก็บรักษาอย่างเหมาะสมช่วยยืดอายุการใช้งานได้อย่างมาก
    - title: เรือเป่าลมต้องดูแลรักษาอะไรบ้าง?
      description: การบํารุงรักษาพื้นฐานได้แก่ การล้างด้วยน้ําสะอาดหลังใช้งานทุกครั้ง (โดยเฉพาะในน้ําเค็ม), การเช็ดให้แห้งก่อนเก็บ, ตรวจสอบซีลวาล์วทุกปี และการทาUVสารป้องกันบนท่อหลีกเลี่ยงการโดนแสงแดดเป็นเวลานานเมื่อไม่ได้ใช้งาน
    - title: เรือเป่าลมสามารถใช้ในน้ําเค็มได้หรือไม่?
      description: ใช่เรือยางทุกลําAquafarerออกแบบมาสําหรับการใช้งานทั้งน้ําจืดและน้ําเค็มเราแนะนําให้ล้างด้วยน้ําจืดและเช็ดให้แห้งอย่างทั่วถึงหลังจากสัมผัสน้ําเค็ม เพื่อป้องกันการกัดกร่อนและการตกผลึกของผ้า
    - title: ฉันจะเก็บเรือเป่าลมได้อย่างไร?
      description: ปล่อยลม ทําความสะอาด และทําให้เรือแห้งสนิทก่อนเก็บม้วนเรือให้หลวม ๆ (หลีกเลี่ยงรอยพับที่แน่น) เก็บในที่เย็นและแห้ง ห่างจากแสงแดดโดยตรง และหลีกเลี่ยงพื้นคอนกรีตเพื่อป้องกันความชื้นซึมผ่าน
    - title: น้ําหนักเรือเป่าลมมีน้ําหนักเท่าไรAquafarer?
      description: ความสามารถในการรับน้ำหนักอยู่ระหว่าง 290 กก. สำหรับรุ่นเล็กที่สุดของเราไปจนถึงมากกว่า 2,000 กก. สำหรับเรือเชิงพาณิชย์ขนาดใหญ่ แต่ละหน้าผลิตภัณฑ์จะแสดงการรับน้ำหนักสูงสุดสำหรับรุ่นเฉพาะของคุณ
faqs_sup:
  title: SUP คำถามที่พบบ่อยเกี่ยวกับบอร์ด
  subtitle: คำถามทั่วไปเกี่ยวกับบอร์ดพายแบบยืนของเรา
  columns: 2
  items:
    - title: มีขนาดบอร์ด SUP อะไรบ้าง?
      description: เรามีบอร์ด SUP ตั้งแต่ 9 ฟุตถึง 12 ฟุต รวมถึงบอร์ดออล-ราวด์, ทัวร์ริ่ง, โยคะ และดีไซน์พิเศษ รุ่นขายดีของเรารวมถึง Tropical Breeze (10 ฟุต) และ Ocean Voyager (11 ฟุต)
    - title: โครงสร้าง drop-stitch คืออะไร?
      description: โครงสร้าง Drop-stitch ใช้เส้นใยโพลีเอสเตอร์นับพันเส้นเชื่อมระหว่างชั้นบนและชั้นล่างของบอร์ด ทำให้สามารถรับแรงดันอากาศสูง (15–20 PSI) และสร้างแพลตฟอร์มที่แข็งและมั่นคง ซึ่งเป็นมาตรฐานอุตสาหกรรมสำหรับ SUPs อินฟลาตเอเบิลระดับพรีเมียม
    - title: ขีดจำกัดน้ำหนักของบอร์ด SUP คือเท่าไหร่?
      description: บอร์ด SUP ของเรารองรับน้ำหนักได้สูงสุดถึง 150 กก. ขึ้นอยู่กับรุ่นและปริมาตร บอร์ด Leviathan Wake เป็นรุ่นที่มีความสามารถสูงสุดของเรา ออกแบบมาสำหรับผู้เล่นที่มีน้ำหนักมากและการใช้งานโยคะ
    - title: คุณให้บริการแพ็กเกจ SUP ครบชุดหรือไม่?
      description: ใช่ บอร์ด SUP แต่ละรุ่นจะมาพร้อมแพ็กเกจครบชุด รวมถึงไม้พายอลูมิเนียม 3 ชิ้น, ปั๊มมือแรงดันสูง, สายโคอิล, กระเป๋าเป้สำหรับเดินทาง และชุดซ่อม บางรุ่นยังมาพร้อมชุดครีบที่ถอดได้
    - title: การรับประกันของบอร์ด SUP คืออะไร?
      description: บอร์ด Aquafarer SUP ทุกชิ้นมาพร้อมการรับประกัน 2 ปี สำหรับข้อบกพร่องด้านการผลิต รวมถึงการรั่วของรอยต่อ วาล์วบกพร่อง และวัสดุลอกภายใต้การใช้งานปกติ
    - title: ต้องใช้เวลาเท่าไหร่ในการเป่าลมบอร์ด SUP?
      description: การใช้ปั๊มมือที่รวมมาให้ เติมลมจนเต็มที่ 15 PSI จะใช้เวลาประมาณ 8–12 นาที สำหรับการเติมลมที่เร็วขึ้น เราแนะนำปั๊มไฟฟ้า 12V Aquafarer ของเรา ซึ่งสามารถเติมบอร์ดได้ภายใน 4 นาที
cta:
  title: ต้องการดูใบรับรองด้วยตัวเองหรือไม่?
  subtitle: ขอพอร์ตโฟลิโอใบรับรอง รายงานตรวจสอบโรงงาน หรือเอกสารการปฏิบัติตามมาตรฐานวัสดุ ไม่มี NDA จำเป็น
  actions:
