features3_lab:
  title: การทดสอบภายในและห้องปฏิบัติการคุณภาพ
  subtitle: วัสดุทุกล็อตและผลิตภัณฑ์สำเร็จรูปจะผ่านการทดสอบในห้องปฏิบัติการของเราก่อนที่จะจัดส่ง
  columns: 3
  isBeforeContent: true
  items:
    - title: การทดสอบความต้านแรงดึง
      description: 'Every PVC fabric roll is tested for tensile strength in-house. Minimum requirement: 350 N/cm warp and weft. Rejected batches are returned to supplier — we reject approximately 3% of incoming materials.'
      icon: tabler:scale
    - title: UV การเสื่อมสภาพอย่างรวดเร็ว
      description: Fabric samples undergo 1,000-hour accelerated UV weathering. Tensile strength must retain 80%+ after exposure. Products rated for 3+ years of outdoor use.
      icon: tabler:sun
    - title: ความแข็งแรงของรอยต่อในการลอก
      description: Welded seams are tested to a 5 N/mm minimum peel strength. Each production batch has seam samples destructively tested and archived.
      icon: tabler:stack
    - title: การกดทับค้างไว้ 24–48 ชั่วโมง
      description: 'ผลิตภัณฑ์เป่าลมทุกชิ้นจะถูกเติมลมจนถึง 1.25 เท่าของค่าที่กำหนด PSI และเฝ้าสังเกตเป็นเวลา 24–48 ชั่วโมง การลดความดันสูงสุดที่อนุญาต: 5% ผลิตภัณฑ์ที่ไม่ผ่านการทดสอบนี้จะถูกปรับปรุงและทดสอบใหม่ก่อนจัดส่ง'
      icon: tabler:wind
    - title: การทดสอบวาล์วรอบ
      description: การออกแบบวาล์วแต่ละแบบต้องผ่านการเปิด-ปิด 10,000 รอบในห้องปฏิบัติการของเรา วาล์วต้องรักษาการปิดผนึกให้แน่นที่ความดัน 1.25 เท่าของความดันที่กำหนดหลังจากการใช้งานซ้ำ วาล์ว Paddle Board Overstock ทุกตัวได้รับการกำหนดอายุการใช้งาน 5+ ปีสำหรับการใช้งานปกติ
      icon: tabler:rotate
    - title: ความต้านทานต่อการแตกร้าวเมื่อเย็น
      description: Materials are tested at -30°C for 4 hours. No cracking or embrittlement allowed. Products rated for winter storage and cold-water use down to -10°C ambient temperature.
      icon: tabler:snowflake
steps2_manufacturing:
  title: เรารับประกันคุณภาพอย่างไร
  subtitle: ตั้งแต่การตรวจสอบวัตถุดิบไปจนถึงการทดสอบแรงดันสุดท้าย — ผลิตภัณฑ์ทุกชิ้นต้องผ่านห่วงโซ่คุณภาพที่เข้มงวด
  items:
    - title: การตรวจสอบวัตถุดิบ
      description: ผ้าทุกม้วนของ PVC จะถูกทดสอบความหนา ความต้านแรงดึง และความต้านทานต่อ UV ก่อนเข้าสู่การผลิต
      icon: tabler:search
    - title: การควบคุมคุณภาพระหว่างกระบวนการ
      description: รอยเชื่อม การติดตั้งวาล์ว และการเชื่อมต่อของห้องจะถูกตรวจสอบที่แต่ละสถานีระหว่างการประกอบ
      icon: tabler:eye
    - title: การทดสอบแรงดัน
      description: ผลิตภัณฑ์เป่าลมทุกชิ้นจะถูกเติมลมให้ถึง 1.25x PSI และเก็บไว้ 24–48 ชั่วโมงเพื่อยืนยันการกักเก็บอากาศและความสมบูรณ์ของรอยต่อ
      icon: tabler:wind
    - title: การตรวจสอบขั้นสุดท้าย
      description: แต่ละหน่วยจะได้รับการตรวจสอบด้านการตกแต่ง ฮาร์ดแวร์ และบรรจุภัณฑ์ก่อนอนุมัติการจัดส่งตัวอย่างชุดจะถูกส่งไปยังห้องปฏิบัติการของเราเพื่อทดสอบการทําลาย
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP คำถามที่พบบ่อยเกี่ยวกับบอร์ด
  subtitle: คำถามทั่วไปเกี่ยวกับบอร์ดพายแบบยืนของเรา
  columns: 2
  items:
    - title: มีขนาดบอร์ด SUP อะไรบ้าง?
      description: เรามีบอร์ด SUP ตั้งแต่ 9 ฟุตถึง 12 ฟุต รวมถึงบอร์ดออล-ราวด์, ทัวร์ริ่ง, โยคะ และดีไซน์พิเศษ รุ่นขายดีของเรารวมถึง Tropical Breeze (10 ฟุต) และ Ocean Voyager (11 ฟุต)
    - title: โครงสร้าง drop-stitch คืออะไร?
      description: โครงสร้าง Drop-stitch ใช้เส้นใยโพลีเอสเตอร์นับพันเส้นเชื่อมระหว่างชั้นบนและชั้นล่างของบอร์ด ทำให้สามารถรับแรงดันอากาศสูง (15–20 PSI) และสร้างแพลตฟอร์มที่แข็งและมั่นคง ซึ่งเป็นมาตรฐานอุตสาหกรรมสำหรับ SUPs อินฟลาตเอเบิลระดับพรีเมียม
    - title: ขีดจำกัดน้ำหนักของบอร์ด SUP คือเท่าไหร่?
      description: บอร์ด SUP ของเรารองรับน้ำหนักได้สูงสุดถึง 150 กก. ขึ้นอยู่กับรุ่นและปริมาตร บอร์ด Leviathan Wake เป็นรุ่นที่มีความสามารถสูงสุดของเรา ออกแบบมาสำหรับผู้เล่นที่มีน้ำหนักมากและการใช้งานโยคะ
    - title: คุณให้บริการแพ็กเกจ SUP ครบชุดหรือไม่?
      description: ใช่ บอร์ด SUP แต่ละรุ่นจะมาพร้อมแพ็กเกจครบชุด รวมถึงไม้พายอลูมิเนียม 3 ชิ้น, ปั๊มมือแรงดันสูง, สายโคอิล, กระเป๋าเป้สำหรับเดินทาง และชุดซ่อม บางรุ่นยังมาพร้อมชุดครีบที่ถอดได้
    - title: การรับประกันของบอร์ด SUP คืออะไร?
      description: บอร์ด Paddle Board Overstock SUP ทุกตัวมาพร้อมการรับประกัน 2 ปี สำหรับข้อบกพร่องจากการผลิต รวมถึงการรั่วของรอยต่อ ข้อบกพร่องของวาล์ว และการล delamination ของวัสดุ ภายใต้การใช้งานปกติ
    - title: ต้องใช้เวลาเท่าไหร่ในการเป่าลมบอร์ด SUP?
      description: การใช้ปั๊มมือที่มากับชุด การสูบลมจนเต็มที่ 15 PSI ใช้เวลาประมาณ 8–12 นาที สำหรับการสูบลมที่เร็วขึ้น เราแนะนำปั๊มไฟฟ้า 12V Paddle Board Overstock ของเรา ซึ่งสามารถสูบลมกระดานได้ภายในเวลาไม่ถึง 4 นาที
