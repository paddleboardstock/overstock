hero:
  tagline: อุปกรณ์
  title: อุปกรณ์และเครื่องจักรการผลิต
  subtitle: อุปกรณ์ระดับอุตสาหกรรมสำหรับการตัด การเชื่อม การพิมพ์ และการประกอบ
  back_label: กลับไปที่โรงงาน
  back_link: /factory
categories:
  - title: การตัดและการเตรียมวัสดุ
    items:
      - name: PVC เครื่องตัดอัตโนมัติ
        spec: เครื่องควบคุม CNC, ขนาด 6.5 ม. × 2.5 ม., ความแม่นยำ 0.1 มม.
        desc: เครื่องตัดอัตโนมัติควบคุมด้วยคอมพิวเตอร์สำหรับผ้า PVC, Hypalon, และ drop-stitch ซอฟต์แวร์การจัดเรียงวัสดุช่วยเพิ่มประสิทธิภาพการใช้วัสดุโดยให้ของเสียต่ำกว่า 5%
      - name: เครื่องปูผ้า
        spec: ความกว้างสูงสุด 3 ม., ป้อนด้วยความตึงควบคุม
        desc: ปูผ้าเป็นชั้นเดียวหรือหลายชั้นพร้อมควบคุมความตึงเพื่อป้องกันการบิดเบี้ยวก่อนการตัด
  - title: การเชื่อมหลอดและการประสาน
    items:
      - name: เครื่องซีลด้วยความร้อน
        spec: การเชื่อมด้วยลมร้อน, 200–600 °C ปรับได้, 0.5–5 ม./นาที
        desc: เครื่องปิดผนึกลมร้อนสำหรับการประสานและเชื่อมรอยตะเข็บหลอด PVC และ Hypalon ใช้สำหรับการยึด การปิดผนึก และการรวมห้องหลอดและข้อต่อลอย
      - name: เครื่องกดเชื่อม RF แบบไดอิเล็กทริก
        spec: 15 kW, พื้นที่กด 2000 × 600 มม.
        desc: เครื่องกดเชื่อมความถี่วิทยุสำหรับรอยตะเข็บตามแนวยาวหลัก, ข้อต่อข้ามท่อน และการสร้างห้องขนาดใหญ่
      - name: เครื่องเชื่อม RF ควบคุม CNC
        spec: 8 kW, โต๊ะ XY 2500 × 1200 มม.
        desc: การเชื่อมรอยโค้งแบบโปรแกรมได้สำหรับรูปทรงซับซ้อน การประทับโลโก้ และงานปะติดที่แม่นยำ
  - title: การผลิตตัวเรือ RIB
    items:
      - name: แม่พิมพ์วางมือไฟเบอร์กลาส
        spec: แม่พิมพ์หลายแบบสำหรับตัวเรือ RIB ขนาดยาวสุด 6 ม.
        desc: การขึ้นรูปไฟเบอร์กลาสแบบมือแบบดั้งเดิมโดยใช้เรซิ่นโพลีเอสเตอร์และไวนิลเอสเตอร์ แต่ละชั้นถูกม้วนด้วยมือและบรรจุในถุงสุญญากาศเพื่อให้คุณภาพและความแข็งแรงของชั้นเลเยอร์สม่ำเสมอ
      - name: ห้องพ่นเกลโค้ท
        spec: ควบคุมอุณหภูมิ, อากาศกรองและระบาย
        desc: การพ่นเกลโค้ทสำหรับตัวเรือ RIB ให้ผิวมันวาวสูง, ทน UV พร้อมควบคุมความหนาได้อย่างแม่นยำ
      - name: เครื่องตัดสายร่าง CNC (5 แกน)
        spec: ขนาดพื้นที่ 3 ม. × 2 ม. × 1 ม., แกนหมุนระบายความร้อนด้วยน้ำ
        desc: การประมวลผลชิ้นส่วนตัวเรือ, แม่พิมพ์คอนโซล, ฐานที่นั่ง, และขาแขวนแบบกำหนดเอง
  - title: SUP การพิมพ์และการตกแต่ง
    items:
      - name: เครื่องพิมพ์ดิจิทัล
        spec: เครื่องพิมพ์อิงค์เจ็ทความละเอียดสูง, ความกว้างการพิมพ์สูงสุด 2 ม.
        desc: การพิมพ์โดยตรงลงบนผ้าสำหรับกราฟิกชั้นดาดฟ้าสีเต็มรูปแบบ SUP พิมพ์ลวดลายกำหนดเอง, สีไล่ระดับ, และภาพคุณภาพระดับภาพถ่ายด้วยหมึกน้ำที่ทนต่อ UV
      - name: เครื่องพิมพ์สกรีน
        spec: การลงทะเบียนแบบแมนนวลและกึ่งอัตโนมัติหลายสี
        desc: การพิมพ์สกรีนสำหรับโลโก้บอร์ด SUP, เครื่องหมายแบรนด์, และลวดลายซ้ำ พิมพ์ที่ทนทานและทึบแสงพร้อมสีสันสดใส
  - title: การประกอบและการติดตั้งเครน
    items:
      - name: รอกยกเครื่องยนต์
        spec: รับน้ำหนัก 500 กก., บาร์ยกปรับได้
        desc: ติดตั้งเครื่องยนต์นอกเรืออย่างปลอดภัยตั้งแต่ 2.5 ถึง 60 แรงม้า
      - name: โครงจำลองคอนโซล
        spec: ปรับความสูงและมุมได้
        desc: การติดตั้งสายพวงมาลัย, คันเร่ง, และแผงเครื่องมือก่อนการติดตั้งจริง
      - name: เครื่องดัดสายไฮดรอลิก
        spec: ขนาดท่อสูงสุด 1 นิ้ว, เกจความดันดิจิทัล
        desc: ชุดสายพวงมาลัยไฮดรอลิกความยาวกำหนดเองพร้อมฟิตติ้งแบบบีบ
      - name: บอร์ดสายไฟฟ้า
        spec: ขนาด 3 ม. × 1.5 ม., แผนภาพการเดินสายพิมพ์ล่วงหน้า
        desc: ประกอบและทดสอบสายไฟฟ้าเต็มระบบนอกเรือ
  - title: การทดสอบและควบคุมคุณภาพ
    items:
      - name: เครื่องทดสอบแรงดึงสากล
        spec: 50 kN, / ASTM D751
        desc: ทดสอบแรงดึง, การยืดตัวตอนขาด, และการขยายรอยขาดของผ้าแต่ละชุด
      - name: ชุดทดสอบการเก็บอากาศ
        spec: โปรแกรมตั้งค่าได้, การยึดแรงดัน 30 นาที
        desc: การทดสอบการยึดแรงดันอัตโนมัติสำหรับทุกช่องท่อก่อนการประกอบ
      - name: เครื่องทดสอบการลอกตะเข็บ
        spec: ลอกอัตโนมัติ 180° ที่ 100 มม./นาที
        desc: การทดสอบความแข็งแรงของรอยต่อที่เชื่อมและติดกาวตาม ISO 6185
      - name: เครื่องจำลองสภาพอากาศ Xenon-Arc
        spec: การสัมผัส 2000 ชั่วโมง
        desc: การทดสอบความต้านทาน UV สำหรับการเปลี่ยนสีและการคงความแข็งแรง
cta:
