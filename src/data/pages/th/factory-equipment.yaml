hero:
  tagline: อุปกรณ์
  title: อุปกรณ์และเครื่องจักรการผลิต
  subtitle: อุปกรณ์ระดับอุตสาหกรรมสำหรับการตัด การเชื่อม การพิมพ์ และการประกอบ
  back_label: กลับไปที่โรงงาน
  back_link: /factory
categories:
  - title: การตัดและการเตรียมวัสดุ
    items:
      - name: PVC เครื่องตัดอัตโนมัติ
        spec: เครื่องควบคุม CNC, ขนาด 6.5 ม. × 2.5 ม., ความแม่นยำ 0.1 มม.
        desc: เครื่องตัดอัตโนมัติควบคุมด้วยคอมพิวเตอร์สำหรับผ้า PVC และ drop-stitch ซอฟต์แวร์จัดวางรูปแบบช่วยเพิ่มประสิทธิภาพการใช้วัสดุให้เสียหายน้อยกว่า 5%
      - name: เครื่องปูผ้า
        spec: ความกว้างสูงสุด 3 ม., ป้อนด้วยความตึงควบคุม
        desc: ปูผ้าเป็นชั้นเดียวหรือหลายชั้นพร้อมควบคุมความตึงเพื่อป้องกันการบิดเบี้ยวก่อนการตัด
  - title: การเชื่อม & การยึดติด
    items:
      - name: เครื่องซีลด้วยความร้อน
        spec: การเชื่อมด้วยลมร้อน, 200–600 °C ปรับได้, 0.5–5 ม./นาที
        desc: เครื่องซีลด้วยความร้อนลมร้อนสำหรับการยึดและเชื่อมชั้นฟิล์ม PVC แถบราง และรอยต่อห้อง ใช้สำหรับการยึด, การซีล และการหลอมรวมรอยต่อแกนกลาง drop-stitch
      - name: เครื่องกดเชื่อม RF แบบไดอิเล็กทริก
        spec: 15 kW, พื้นที่กด 2000 × 600 มม.
        desc: เครื่องกดเชื่อมความถี่วิทยุสำหรับรอยตะเข็บตามแนวยาวหลัก, ข้อต่อข้ามท่อน และการสร้างห้องขนาดใหญ่
      - name: เครื่องเชื่อม RF ควบคุม CNC
        spec: 8 kW, โต๊ะ XY 2500 × 1200 มม.
        desc: การเชื่อมรอยโค้งแบบโปรแกรมได้สำหรับรูปทรงซับซ้อน การประทับโลโก้ และงานปะติดที่แม่นยำ
  - title: ศิลปะและการตกแต่งดาดฟ้า
    items:
      - name: EVA เครื่องตัดดาดฟ้า
        spec: การตัดด้วยมีด CNC กว้าง 2 ม.
        desc: การตัดแม่นยำของแผ่นโฟมเด็ค EVA สำหรับลวดลายเด็คชุดศิลปะ แต่ละแผ่นถูกตัดเป็นรูปทรงเพื่อให้เข้ากับเด็คทั้งหมดอย่างไร้รอยต่อ
      - name: เครื่องอัดชั้นฟิล์มเด็ค
        spec: ควบคุมอุณหภูมิและความดัน
        desc: ยึดแผ่นเด็ค EVA เข้ากับพื้นผิวบอร์ดด้วยการยึดเกาะที่สม่ำเสมอทั่วทั้งพื้นที่เด็ค
  - title: SUP การพิมพ์และการตกแต่ง
    items:
      - name: เครื่องพิมพ์ดิจิทัล
        spec: เครื่องพิมพ์อิงค์เจ็ทความละเอียดสูง, ความกว้างการพิมพ์สูงสุด 2 ม.
        desc: การพิมพ์โดยตรงลงบนผ้าสำหรับกราฟิกชั้นดาดฟ้าสีเต็มรูปแบบ SUP พิมพ์ลวดลายกำหนดเอง, สีไล่ระดับ, และภาพคุณภาพระดับภาพถ่ายด้วยหมึกน้ำที่ทนต่อ UV
      - name: เครื่องพิมพ์สกรีน
        spec: การลงทะเบียนแบบแมนนวลและกึ่งอัตโนมัติหลายสี
        desc: การพิมพ์สกรีนสำหรับโลโก้บอร์ด SUP, เครื่องหมายแบรนด์, และลวดลายซ้ำ พิมพ์ที่ทนทานและทึบแสงพร้อมสีสันสดใส
  - title: การประกอบขั้นสุดท้าย
    items:
      - name: สถานีขันแรงบิดวาล์ว
        spec: สอบเทียบ ทดสอบฟังก์ชัน 10 รอบ
        desc: ติดตั้งและขันแรงบิดวาล์วเติมลม จากนั้นทดสอบฟังก์ชันของวาล์วทุกตัวด้วยการเปิด/ปิด 10 รอบ
      - name: เครื่องวางกล่องครีบและ D-Ring
        spec: จัดตำแหน่งด้วยจิ๊ก กาวแห้ง
        desc: วางและยึดกล่องครีบ D-ring และด้ามจับที่ตำแหน่งบนดาดฟ้าอย่างแม่นยำตามสเปกของรุ่น
  - title: การทดสอบและควบคุมคุณภาพ
    items:
      - name: เครื่องทดสอบแรงดึงสากล
        spec: ความจุ 50 kN
        desc: ทดสอบแรงดึง, การยืดตัวตอนขาด, และการขยายรอยขาดของผ้าแต่ละชุด
      - name: ชุดทดสอบการเก็บอากาศ
        spec: โปรแกรมตั้งค่าได้, การยึดแรงดัน 30 นาที
        desc: การทดสอบการยึดแรงดันอัตโนมัติสำหรับทุกช่องท่อก่อนการประกอบ
      - name: เครื่องทดสอบการลอกตะเข็บ
        spec: ลอกอัตโนมัติ 180° ที่ 100 มม./นาที
        desc: ทดสอบความแข็งแรงของรอยต่อเชื่อมและรอยต่อที่ยึดด้วยกาวตามโปรโตคอลภายใน
      - name: เครื่องจำลองสภาพอากาศ Xenon-Arc
        spec: การสัมผัส 2000 ชั่วโมง
        desc: การทดสอบความต้านทาน UV สำหรับการเปลี่ยนสีและการคงความแข็งแรง
cta:
  title: สนใจทัวร์โรงงานไหม?
  desc: เรายินดีต้อนรับผู้เยี่ยมชมสถานที่ของเราในเว่ยไห่ มาชมอุปกรณ์และกระบวนการของเราด้วยตัวคุณเอง
  label: กำหนดเวลาการเยี่ยมชม →
  link: /contact
tldr:
  summary: Paddle Board Overstock ดำเนินงานบนพื้นที่การผลิตขนาด 12,000 ม² ซึ่งติดตั้งเครื่องตัด PVC อัตโนมัติ เครื่องเชื่อม RF ความถี่สูง สถานีตัดและตกแต่งดาดฟ้า EVA เครื่องกดปิดผนึกความร้อน และเครื่องประกอบขั้นสุดท้าย ทุกแผงผ่านการทดสอบการรับแรงดัน 1.25 เท่าของค่าที่กำหนด
  points:
    - การตัด PVC อัตโนมัติด้วยความแม่นยำ CNC
    - การเชื่อม RF ความถี่สูงเพื่อความมั่นคงของรอยต่อ
    - สถานีตัดดาดฟ้า EVA และการตกแต่งด้วยมือ
    - เครื่องขันวาล์วและประกอบกล่องครีบ
    - การทดสอบการรับแรงดัน 1.25 เท่าของค่าที่กำหนดกับแผง 100%
