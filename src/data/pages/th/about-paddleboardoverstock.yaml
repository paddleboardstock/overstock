hero:
  tagline: เกี่ยวกับ
  title: เกี่ยวกับ {SITE}
  subtitle: ผู้ผลิตอุปกรณ์กีฬาทางน้ำแบบบูรณาการตั้งแต่วัสดุดิบจนถึงเรือสำเร็จรูป
intro:
  - 'Paddle Board Overstock ก่อตั้งขึ้นในปี 2012 ด้วยภารกิจเดียว: ออกแบบและผลิตอุปกรณ์กีฬาทางน้ำที่มีประสิทธิภาพบนผิวน้ำเท่ากับคุณภาพที่รายงาน เริ่มต้นจากเวิร์กช็อปบอร์ด SUP ที่เน้นเฉพาะทาง จนเติบโตเป็นโรงงานผลิตแบบบูรณาการขนาด 12,000 ตร.ม. ในเขตพัฒนาเศรษฐกิจชิงเต่า ผลิตเรือยาง RIBs คายัค บอร์ด SUP อุปกรณ์ความปลอดภัย และอุปกรณ์เสริมสำหรับลูกค้าในกว่า 50+ ประเทศ'
  - วันนี้ Paddle Board Overstock ดำเนินงานในฐานะแบรนด์โรงงาน — เราออกแบบ วิศวกรรม ทำต้นแบบ ผลิต และทดสอบทุกอย่างภายใต้หลังคาเดียว การรวมขั้นตอนการผลิตแบบตั้งฉากนี้ช่วยให้เราควบคุมการเลือกวัสดุ คุณภาพการผลิต และเวลาในการส่งมอบได้โดยตรง เรือทุกลำถูกสร้างโดยทีมงานของเรา บนเครื่องมือของเรา ตามมาตรฐานของเรา
  - เราบริการผู้ใช้เพื่อการพักผ่อน ผู้ประกอบการเชิงพาณิชย์ หน่วยงานรัฐบาล และพันธมิตรแบรนด์ทั่วโลก โปรแกรม OEM และ ODM ของเราช่วยให้ธุรกิจเริ่มสายผลิตภัณฑ์ของตนเองโดยไม่ต้องลงทุนในโครงสร้างพื้นฐานของโรงงาน ไม่ว่าคุณจะต้องการต้นแบบเพียงชิ้นเดียวหรือการผลิตเต็มรูปแบบ ทีมงานของเราจะนำคุณตั้งแต่แนวคิดจนถึงการส่งมอบพร้อมใช้งานในทะเล
