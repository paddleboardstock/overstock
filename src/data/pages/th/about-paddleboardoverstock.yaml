  tagline: โปรไฟล์โรงงาน
  title: ความสามารถด้านการผลิตและการส่งออก
values_section:
  tagline: ภารกิจและค่านิยม
  title: สิ่งที่ขับเคลื่อนเรา
services_section:
  tagline: บริการ
  title: OEM, ODM และป้ายส่วนตัว
  subtitle: ความร่วมมือด้านการผลิตที่ยืดหยุ่นสำหรับธุรกิจทุกขนาด
certifications_section:
  tagline: ใบรับรอง
  title: CE & ISO การผลิตที่ได้รับการรับรอง
  subtitle: โมเดลที่ได้รับการรับรอง CE จำนวน 64 รุ่นของเราตรงตามมาตรฐานความปลอดภัยและคุณภาพสากล
values:
  - title: คุณภาพมาก่อน
    desc: ทุกเรือที่ออกจากโรงงานของเราต้องผ่านการทดสอบการเก็บอากาศ การลอกตะเข็บ และการทดสอบระบบก่อนส่งมอบ
  - title: การรวมแนวดิ่ง
    desc: เราควบคุมทุกขั้นตอน — ตั้งแต่การตัด PVC จนถึงการประกอบขั้นสุดท้าย — ขจัดความไม่มีประสิทธิภาพของผู้รับเหมาช่วงและรับประกันคุณภาพที่สม่ำเสมอ
  - title: ความปลอดภัยเป็นมาตรฐาน
    desc: การรับรอง CE เป็นหัวใจหลักของสิ่งที่เราสร้าง โมเดล 64 รุ่นที่ได้รับการรับรอง CE ของเราตรงตามมาตรฐานความปลอดภัยของสหภาพยุโรปสำหรับการใช้งานเพื่อพักผ่อนหย่อนใจและเชิงพาณิชย์
  - title: มุ่งเน้นคู่ค้า
    desc: เราสร้างความสัมพันธ์ระยะยาวกับ OEM, ODM, และพันธมิตรป้ายส่วนตัวผ่านความโปร่งใส ความน่าเชื่อถือ และการเติบโตร่วมกัน
services:
  - title: OEM การผลิต
    desc: เราสร้างตามข้อกำหนดของคุณ แชร์แบบของคุณ แล้วทีมวิศวกรรมของเราจะดูแลการสร้างต้นแบบ การทำแม่พิมพ์ และการผลิต
  - title: ODM โซลูชัน
    desc: เริ่มจากการออกแบบแพลตฟอร์มที่พิสูจน์แล้วของเรา ปรับแต่งขนาด สี กราฟิก และบรรจุภัณฑ์เพื่อสร้างสายผลิตภัณฑ์เฉพาะของคุณ
  - title: แบรนด์ส่วนตัว
    desc: ชื่อแบรนด์ของคุณ โลโก้ของคุณ บรรจุภัณฑ์ของคุณ ผลิตภัณฑ์จะมาถึงพร้อมขายปลีกพร้อมการผสานแบรนด์อย่างเต็มที่
  - title: แบรนด์ที่ปรับแต่งได้
    desc: การพิมพ์แผ่นปูดาดฟ้า กราฟิกเรือ สติกเกอร์ติดท่อ และป้ายกำหนดเอง — การปรากฏตัวของแบรนด์ที่สม่ำเสมอในทุกพื้นผิว
certifications:
  - name: CE ใบรับรอง
    desc: เรือและยานพาหนะทางน้ำของเราปฏิบัติตามคำสั่ง EU เกี่ยวกับเรือสันทนาการ (2013/53/EU) และมาตรฐานที่สอดคล้องกันที่เกี่ยวข้อง
    scope: เรือและยานน้ำ
  - name: null
    desc: ระบบบริหารคุณภาพได้รับการรับรองสำหรับการออกแบบ การผลิต และการจัดจำหน่ายยานพาหนะน้ำแบบเป่าลม
    scope: ทั้งสถานที่
  - name: null
    desc: เรือยางลม — ข้อกำหนดด้านความปลอดภัยและสมรรถนะสำหรับเรือยางลมที่เสริมความแข็งแรงและมีตัวถังแข็ง
    scope: RIB & เส้นลม
cta:
  title: อยากดูไหมว่าเราสร้างอย่างไร?
  desc: เยี่ยมชมหน้าของโรงงานของเราเพื่อดูการแนะนำอย่างละเอียดเกี่ยวกับทุกเวิร์กช็อปการผลิตและกระบวนการควบคุมคุณภาพ
  link: /factory
  label: สำรวจโรงงาน →
