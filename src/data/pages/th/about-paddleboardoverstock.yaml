factory_details:
  - label: ขนาดโรงงาน
    value: พื้นที่สถาบันแบบบูรณาการ 12,000 ตร.ม. (130,000 ฟุต²) ในเขตพัฒนาเศรษฐกิจชิงเต่า
  - label: กำลังการผลิตต่อปี
    value: 15,000 ลำ รวมถึง SUPs คายัค เรือดิงฮี RIBs และอุปกรณ์ความปลอดภัย
  - label: ทีมวิจัยและพัฒนา
    value: วิศวกร 25+ คน ครอบคลุมการออกแบบผลิตภัณฑ์ วิทยาศาสตร์วัสดุ และวิศวกรรมคุณภาพ
  - label: อุปกรณ์หลัก
    value: โต๊ะตัด CNC เครื่องเชื่อมไดอิเล็กทริค RF เครื่องซีลด้วยอากาศร้อน เครื่องพิมพ์ดิจิทัล แม่พิมพ์ไฟเบอร์กลาส อุปกรณ์ทดสอบการเก็บอากาศ
  - label: สายการผลิต
    value: '6 สายการผลิตเฉพาะ: การตัด PVC การเชื่อมท่อ การวางส่วนตัวเรือไฟเบอร์กลาส การประกอบ SUP การประกอบ RIB การตรวจสอบคุณภาพขั้นสุดท้าย'
  - label: ปริมาณการส่งออกต่อปี
    value: ส่งออกมูลค่า 8 ล้านดอลลาร์สหรัฐ + ไปยังกว่า 50+ ประเทศทั่วยุโรป อเมริกา เอเชีย-แปซิฟิก และตะวันออกกลาง
