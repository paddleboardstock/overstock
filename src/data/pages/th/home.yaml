content_customer_types:
  tagline: เราบริการใครบ้าง
  title: สร้างขึ้นสำหรับผู้ซื้อ B2B<br />— ไม่ใช่ผู้ซื้อปลีก
  subtitle: Paddle Board Overstock ผลิตสินค้าให้กับลูกค้าสี่ประเภท แต่ละประเภทมีลำดับความสำคัญที่แตกต่างกัน และเราดูแลทุกประเภท
  items:
    - title: เจ้าของแบรนด์ / แบรนด์ส่วนตัว
      description: การออกแบบผลิตภัณฑ์ตามสั่ง กราฟิกแบรนด์ส่วนตัว เอกสารการปฏิบัติตามภายใต้แบรนด์ของคุณ และการสนับสนุนวิศวกรรมเฉพาะจากแนวคิดจนถึงตู้คอนเทนเนอร์
      icon: tabler:palette
      cta: ขอใบเสนอราคา OEM/ODM
      cta_href: /request-quotation
    - title: ตัวแทนจำหน่าย / ผู้ค้าส่ง
      description: การคุ้มครองพื้นที่ การกำหนดราคาขายส่งที่แข่งขันได้ ชุดสนับสนุนการตลาด การฝึกอบรมผลิตภัณฑ์ และเอกสารการปฏิบัติตามกฎระเบียบครบถ้วนสำหรับตลาดของคุณ
      icon: tabler:world
      cta: สมัครตัวแทนจำหน่าย
      cta_href: /dealers-distributors
    - title: รีสอร์ท / ผู้ให้เช่า
      description: ความทนทานระดับเชิงพาณิชย์ คำแนะนำเกี่ยวกับการกำหนดขนาดยานพาหนะ คำสั่งซื้อคอนเทนเนอร์แบบผสม กลยุทธ์ชิ้นส่วนอะไหล่ และชุดอุปกรณ์แบรนด์ของรีสอร์ต
      icon: tabler:beach
      cta: รับแพ็กเกจเชิงพาณิชย์
      cta_href: /solutions/resorts
    - title: กู้ภัย / รัฐบาล / มืออาชีพ
      description: การก่อสร้าง Hypalon/CSM, ตัวเลือกความสอดคล้อง SOLAS, การรับรองเฉพาะโครงการ, การสนับสนุนเอกสารประกวดราคา และวิศวกรรมที่ได้รับการปกป้องด้วย NDA
      icon: tabler:shield
      cta: หารือเกี่ยวกับโครงการ
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM ความสามารถ
  title: สิ่งที่คุณจะได้รับ<br />กับ Paddle Board Overstock
  subtitle: เข้าถึงโรงงานโดยตรงพร้อมการสนับสนุนด้านวิศวกรรม คุณภาพ และการปฏิบัติตามมาตรฐานอย่างครบถ้วน — ไม่ใช่บริษัทค้า
  columns: 2
  items:
    - title: OEM/ODM การปรับแต่ง
      description: การออกแบบตัวเรือแบบกำหนดเอง วัสดุท่อ (PVC หรือ Hypalon/CSM) การจัดวางคอนโซล ที่นั่ง การสร้างแบรนด์ สี และบรรจุภัณฑ์ ตั้งแต่การปรับแต่งเล็กน้อยจนถึงวิศวกรรมแบบกำหนดเองเต็มรูปแบบ
      icon: tabler:adjustments
    - title: ต่ำ MOQ การสุ่มตัวอย่างเร็ว
      description: 'RIB: 2-5 ชิ้น (แม่พิมพ์ที่มีอยู่). SUP: 5-10 ชิ้นต่อ SKU. แม่พิมพ์สั่งทำ: 200+ ชิ้น. ตัวอย่างก่อนการผลิตพร้อมแบรนด์ของคุณใน 7-14 วัน.'
      icon: tabler:rocket
    - title: คุณภาพพร้อมผลิต
      description: ทุกหน่วยผ่านการทดสอบแรงดันที่ 1.25 เท่าของค่าที่กำหนด PSI เป็นเวลา 24-48 ชั่วโมง อัตราข้อบกพร่อง 99.3% ต่อ AQL 2.5 / ISO 2859 มีรายการตรวจสอบคุณภาพ 100 คะแนนต่อตัวเรือ
      icon: tabler:certificate
    - title: เอกสารการปฏิบัติตามอย่างครบถ้วน
      description: CE ตามมาตรฐาน 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI การตรวจสอบทางสังคม, REACH การปฏิบัติตาม, UKCA การทำเครื่องหมาย ข้อมูล DoC ตามรุ่นและข้อมูลแผ่นผู้สร้างรวมอยู่ด้วย
      icon: tabler:file-certificate
    - title: ระยะเวลาการนำเข้าล่วงหน้า 30-45 วัน
      description: การผลิตมาตรฐาน 30-45 วัน FOB ชิงเต่า ตัวอย่างต้นแบบ 7-14 วัน มีบริการผลิตเร่งด่วน แผนการโหลดตู้คอนเทนเนอร์และการบรรจุกล่องตามมาตรฐาน ISPM-15 รวมอยู่ด้วย
      icon: tabler:truck-delivery
    - title: หลังการขายและอะไหล่
      description: รับประกันเรือ/คายัค/RIBs เป็นเวลา 5 ปี, รับประกัน SUP/อุปกรณ์เสริม เป็นเวลา 2 ปี จัดส่งอะไหล่โดยมีความสำคัญเป็นลำดับแรก สนับสนุนกระบวนการเคลมประกัน
      icon: tabler:lifebuoy
content_categories:
  tagline: ประเภทสินค้า
  title: 5 หมวดหมู่<br />64 โมเดลที่ผ่านการรับรอง CE
  subtitle: ตั้งแต่เรือเล็ก 2.4 ม. RIB จนถึงแผงไม้ยาว 15 ฟุต SUP — ทั้งหมดผลิตที่โรงงาน 9001 ของเราที่ชิงเต่า ISO
  items:
    - title: RIB เรือ
      description: ขนาด 2.4 เมตร ถึง 7.0 เมตร พร้อมตัวเรืออลูมิเนียมหรือ GRPPVC หรือ Hypalon/CSM ท่อCEตาม 2013/53/EU สําหรับลาดตระเวน ดําน้ํา กู้ภัย และเชิงพาณิชย์
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: เรือเป่าลม
      description: 2.0 เมตร ถึง 5.0 เมตร พร้อมพื้นอลูมิเนียม พื้นไม้อัด หรือแบบแอร์เด็ครุ่นสําหรับตกปลา พักผ่อน และเรือเทนเดอร์
      icon: tabler:sailboat
      link: /products
    - title: SUP กระดาน
      description: ขนาด 9 ฟุตถึง 15 ฟุต ขนาด 4 นิ้วและ 6 นิ้วDrop-Stitchมีทั้งรุ่นอเนกประสงค์ ทัวร์ โยคะ และตกปลามีให้เลือกเกรดเชิงพาณิชย์
      icon: tabler:swimming
      link: /products
    - title: เรือคายัค
      description: เรือคายัคเป่าลมสําหรับ 1 คนถึง 3 คนรุ่นพักผ่อนและทัวร์พร้อมDrop-Stitchตัวเลือกพื้น
      icon: tabler:kayak
      link: /products
    - title: อุปกรณ์เสริมด้านความปลอดภัย
      description: CE-เสื้อชูชีพที่ได้รับการรับรอง เชือกโยนแขน ชุดซ่อม ปั๊มน้ํา และไฟนําทางUSCG PFD ที่ได้รับการรับรองประเภท III/V
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: ความแข็งแกร่งของโรงงาน
  title: การผลิตที่พร้อมสําหรับการตรวจสอบ<br />ที่ชิงเต่า
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">พื้นที่ 12,000 ตร.ม. ISO 9001 สถานที่ — ผู้ผลิตจริง ไม่ใช่บริษัทการค้า</h3>
  items:
    - title: สายการผลิตเฉพาะ 6 สาย
      description: เรือRIBเป่าลม เรือSUPคายัค อุปกรณ์ความปลอดภัย และOEMODM/สายแยกแต่ละสายมีจุดตรวจสอบคุณภาพและแผนการผลิตเฉพาะ
    - title: ทดสอบแรงดัน 100%
      description: ห้องเป่าลมทุกห้องมีแรงดันสูงถึง 1.25x PSI และเก็บไว้ได้ 24-48 ชั่วโมงผลการทดสอบเชื่อมโยงกับหมายเลขซีเรียลตัวเรือ (HIN)
    - title: การตรวจสอบย้อนกลับต่อตัวเรือ
      description: 'บันทึกการผลิตระดับ HIN พร้อมข้อมูล 21+ ช่องต่อตัวถัง: ชุดวัสดุ, รหัสผู้เชื่อม, ผลการทดสอบแรงดัน, การกําหนดค่าขั้นสุดท้าย และจุดหมายปลายทางการส่งมอบ'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock โรงงานผลิตขนาด 12,000 ตารางเมตร ISO 9001 ในชิงเต่า พร้อมRIBสายการผลิต
content_compliance:
  tagline: การปฏิบัติตามข้อกําหนดและพิสูจน์คุณภาพ
  title: หลักฐานที่ได้รับการบันทึกไว้,<br />ไม่ใช่แค่การเคลม
  subtitle: ทุกข้ออ้างด้านการปฏิบัติตามข้อกําหนดมีเอกสารเฉพาะรุ่นรองรับสําหรับการตรวจสอบของคุณ
  items:
    - title: ISO 9001:2015 (SGS)
      description: ระบบการจัดการคุณภาพที่ได้รับการรับรองโดย TÜV Rheinland/SGS.การตรวจสอบตรวจสอบประจําปีกระบวนการ QC ที่มีการบันทึกไว้ตั้งแต่วัสดุที่เข้ามาจนถึงการปล่อยสินค้า
      icon: tabler:certificate
    - title: CE ตามปี 2013/53/EU (RCD)
      description: 64 รุ่นที่มีคําประกาศความสอดคล้องเฉพาะรุ่นการประเมินความสอดคล้องต่อโมดูลที่เกี่ยวข้องข้อมูลการลงทะเบียน HIN และแผ่นผู้สร้างสําหรับตัวถังทุกลํา
      icon: tabler:file-certificate
    - title: BSCI การปฏิบัติตามกฎหมายทางสังคม
      description: การตรวจสอบประจำปี BSCI โดย SGS ตรวจสอบการปฏิบัติแรงงานอย่างมีจริยธรรม ความปลอดภัยในที่ทำงาน และการจัดการสิ่งแวดล้อมทั่วทั้งโรงงานของเรา
      icon: tabler:users
    - title: REACH & UKCA
      description: วัสดุ PVC และกาวทั้งหมดเป็นไปตามข้อบังคับ REACH ของสหภาพยุโรป มีเครื่องหมาย UKCA สำหรับตลาดสหราชอาณาจักร ใบข้อมูลความปลอดภัยวัสดุสามารถขอได้
      icon: tabler:shield-check
steps:
  title: OEM/ODM กระบวนการ — จากบรีฟไปยังคอนเทนเนอร์
  items:
    - title: ขั้นตอนที่ 1:<span class="font-medium">ข้อกำหนด</span>
      description: แชร์ข้อมูลสเปคผลิตภัณฑ์ของคุณ ตลาดเป้าหมาย จำนวน และข้อกำหนดการปฏิบัติตาม ทีมวิศวกรของเราจะตรวจสอบภายใน 48 ชั่วโมง
      icon: tabler:file-text
    - title: ขั้นตอนที่ 2:<span class="font-medium">ข้อเสนอ</span>
      description: รับข้อเสนอรายละเอียดพร้อมสเปค ตัวเลือกวัสดุ MOQ ราคา ระยะเวลาในการจัดส่ง และขอบเขตการปฏิบัติตามสำหรับตลาดของคุณ
      icon: tabler:clipboard-list
    - title: ขั้นตอนที่ 3:<span class="font-medium">ต้นแบบ</span>
      description: ตัวอย่างก่อนการผลิตพร้อมแบรนด์ของคุณภายใน 7-14 วัน การทดสอบคุณภาพเต็มรูปแบบที่ความดันที่ระบุ 1.25 เท่า ค่าตัวอย่างจะถูกตัดเป็นเครดิตสำหรับการผลิต
      icon: tabler:settings
    - title: ขั้นตอนที่ 4:<span class="font-medium">การผลิต</span>
      description: การผลิต 30-45 วัน FOB ที่ชิงเต่า หลังจากอนุมัติตัวอย่าง จุดตรวจสอบ QC ระหว่างกระบวนการ การทดสอบแรงดัน และการตรวจสอบขั้นสุดท้าย 100 จุดในแต่ละหน่วย
      icon: tabler:building-factory
    - title: ขั้นตอนที่ 5:<span class="font-medium">การจัดส่ง</span>
      description: แผนการบรรจุภาชนะ, การตีลังไม้ตามมาตรฐาน ISPM-15, แพ็คเกจเอกสารการปฏิบัติตามข้อกำหนด, และการจัดส่งไปชิงเต่า FOB พร้อมเอกสารการส่งออกครบถ้วน
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock OEM/ODM กระบวนการผลิตเรือยางจากการออกแบบจนถึงการจัดส่งตู้คอนเทนเนอร์
blog_latest:
  title: ข้อมูลเชิงลึกด้านอุตสาหกรรมและเทคนิค
  information: |
    RCD คู่มือด้านความสอดคล้อง, บทความกระบวนการ OEM/ODM, การเปรียบเทียบวัสดุ,
    และทรัพยากรการตรวจสอบโรงงานจากทีมวิศวกรรม Paddle Board Overstock
faqs:
  title: B2B คำถามที่พบบ่อยเกี่ยวกับการจัดซื้อ
  subtitle: คำถามทั่วไปจากแบรนด์ ผู้จัดจำหน่าย และผู้ประกอบการเชิงพาณิชย์เกี่ยวกับการผลิต OEM/ODM ด้วย Paddle Board Overstock
  columns: 2
  items:
    - title: คุณเป็นผู้ผลิตหรือบริษัทการค้าหรือไม่?
      description: เราเป็นโรงงานที่รวมทุกขั้นตอนในการผลิตและมีการควบคุมคุณภาพ วัสดุ และระยะเวลาการส่งมอบอย่างครบถ้วน ใบอนุญาตประกอบธุรกิจและขอบเขตการผลิตสามารถตรวจสอบได้ในระหว่างการตรวจสอบโรงงาน
      icon: tabler:building-factory
      category: all
    - title: กระบวนการ OEM/ODM ของคุณคืออะไร?
      description: การทบทวนข้อกำหนด (48 ชั่วโมง) ไปยังข้อเสนอเพื่อสร้างต้นแบบ (7-14 วัน) ไปยังการผลิต (30-45 วัน FOB ชิงเต่า) การสนับสนุนวิศวกรรมเต็มรูปแบบ เอกสารการปฏิบัติตามข้อกำหนด และสามารถติดตามได้ตามเรือแต่ละลำตลอดกระบวนการ
      icon: tabler:route
      category: all
    - title: คุณมีข้อกำหนด MOQ อะไรบ้าง?
      description: 'RIB เรือ: 2-5 หน่วยต่อรุ่น (แม่พิมพ์ที่มีอยู่), 200+ สำหรับแม่พิมพ์ที่กำหนดเอง. SUP กระดาน: 5-10 หน่วยต่อ SKU. สามารถสั่งซื้อคอนเทนเนอร์แบบหลายรุ่นได้. การสั่งตัวอย่างเริ่มต้นที่ 2-5 หน่วยเพื่อประเมิน.'
      icon: tabler:sort-ascending
      category: all
    - title: ตัวเลือกการปรับแต่งใดบ้างที่มี?
      description: การออกแบบตัวเรือ, วัสดุท่อ (PVC หรือ Hypalon/CSM), เส้นผ่านศูนย์กลางท่อ, การจัดเรียงคอนโซล, ที่นั่ง, การควบคุมการเลี้ยว, ระบบเชื้อเพลิง, การจัดเรียงดาดฟ้า, สีแบรนด์, กราฟิกโลโก้, การออกแบบแท่น EVA, บรรจุภัณฑ์ขายปลีก, และการทำแบรนด์คู่มือผู้ใช้งาน.
      icon: tabler:adjustments
      category: all
    - title: เอกสารความสอดคล้องใดบ้างที่คุณสามารถจัดหาให้สำหรับตลาดของฉัน?
      description: CE DoC ตาม 2013/53/EU, เครื่องหมาย UKCA, ใบรับรอง ISO 9001 (SGS), รายงานการตรวจสอบ BSCI, การปฏิบัติตามข้อกำหนด REACH, รายงานการทดสอบวัสดุ, บันทึกการทดสอบแรงกด, และข้อมูลแผ่นเครื่องสร้างเฉพาะรุ่น. เอกสารสำหรับตลาดเฉพาะสามารถขอตามความต้องการ.
      icon: tabler:file-certificate
      category: all
    - title: ระยะเวลาในการส่งตัวอย่างและการผลิตเป็นเท่าไหร่?
      description: 'ตัวอย่างก่อนการผลิต: 7-14 วันทำการ. การผลิตมาตรฐาน: 30-45 วัน FOB ชิงเต่า. การผลิตด่วนมีให้ในค่าใช้จ่ายเพิ่มเติม. ช่วงฤดูกาลสูง (มีนาคม-มิถุนายน) อาจขยายระยะเวลาในการผลิต.'
      icon: tabler:clock
      category: all
    - title: สามารถจัดการตรวจสอบโรงงานหรือตัวอย่างวิดีโอสดได้หรือไม่?
      description: ได้. ต้อนรับการตรวจสอบโรงงาน ณ สถานที่ของเราในชิงเต่าพร้อมแจ้งล่วงหน้า 3-5 วัน. ทัวร์วิดีโอสดผ่าน WhatsApp/Zoom พร้อมใช้งานทันที. รองรับการตรวจสอบโดยบุคคลที่สาม (SGS, BV, TÜV).
      icon: tabler:video
      category: all
    - title: การตรวจคุณภาพใดที่เสร็จสิ้นก่อนการจัดส่ง?
      description: การทดสอบแรงดัน 1.25 เท่าของกำลังที่กำหนด (24-48 ชม.), การทดสอบตะเข็บ, ตรวจสอบรายการตรวจสอบสุดท้าย 100 จุด, การตรวจสอบมิติ, การตรวจสอบลักษณะภายนอก, การตรวจสอบเอกสารความสอดคล้อง, และตรวจสอบความสมบูรณ์ของการบรรจุ. ทั้งหมดตามขั้นตอน ISO 9001.
      icon: tabler:clipboard-check
      category: all
cta:
