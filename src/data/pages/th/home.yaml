hero:
  tagline: โรงงานจำหน่ายตรง SUP สินค้าล้างสต็อก · Weihai · ตั้งแต่ปี 2012
  title: บอร์ด SUP เป่าลม —<br />สินค้าล้นสต็อก & ล้างสต็อก
  subtitle: |
    แพ็กเกจบอร์ดพายครบชุด ลดสูงสุดถึง 60% จากราคาปลีก<br />
    จำหน่ายตรงจากโรงงานของเราที่ Weihai CE บอร์ดที่ได้รับการรับรอง,<br />
