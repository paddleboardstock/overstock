content_customer_types:
  tagline: เราบริการใครบ้าง
  title: บอร์ดสำหรับนักพายเรือทุกประเภท<br />
  subtitle: ไม่ว่าคุณจะเป็นครั้งแรกหรือครั้งที่ห้าสิบ มีบอร์ดล้างสต็อกที่ตรงกับสไตล์การพายของคุณ
  items:
    - title: ผู้เริ่มต้น
      description: บอร์ดกว้างพิเศษและมีความมั่นคงสำหรับทุกการใช้งาน ช่วยให้การพายครั้งแรกของคุณง่ายขึ้น — ผู้เริ่มต้นส่วนใหญ่สามารถยืนขึ้นได้ภายในไม่กี่นาที
      icon: tabler:swimming
      cta: ช็อปที่เหมาะสําหรับSUPsผู้เริ่มต้น
      cta_href: /supboard
    - title: ครอบครัว
      description: บอร์ดที่มั่นคงที่ครอบครัวใช้ร่วมกันได้ รวมถึงรุ่นเด็กที่เบากว่า — อุปกรณ์ที่บรรจุในรถและพองตัวได้ในไม่กี่นาที
      icon: tabler:beach
      cta: ช้อปแพ็กเกจสําหรับครอบครัว
      cta_href: /products
    - title: นักพายทอร์ริ่งและฟิตเนส
      description: กระดานทัวร์ที่ยาวและเร็วขึ้น พร้อมแพลตฟอร์มโยคะเต็มดาดฟ้าสําหรับนักพายที่พายได้ตลอดระยะทาง
      icon: tabler:route
      cta: ช็อปบอร์ดทัวร์ริ่งและโยคะ
      cta_href: /supboard
    - title: นักตกปลา
      description: แพลตฟอร์มที่มั่นคงมาก พร้อมขาตั้งเฟืองและพื้นที่สําหรับตู้เย็น — หล่อจากพื้นเรียบและเงียบ
      icon: tabler:lifebuoy
      cta: ช็อปตกปลาSUPs
      cta_href: /products
features:
  id: features
  tagline: ทําไมต้องซื้อจากPaddle Board Overstock
  title: โรงงานจริง<br />ประหยัดจริง
  subtitle: แพ็คเกจ SUP ล้นสต็อกและเคลียร์สต็อกโดยตรงจากโรงงาน — คุณภาพที่ได้รับการพิสูจน์แล้วโดยไม่ต้องเพิ่มราคาขายปลีก
  columns: 2
  items:
    - title: ลดสูงสุด 60% สําหรับร้านค้าปลีก
      description: เราขายสินค้าคงคลังจากโรงงานและล็อตสินค้าลดราคาโดยตรง — ไม่มีคนกลาง ไม่มีการบวกราคาขายปลีกบอร์ดเดียวกับที่ขายในราคาเต็มที่ที่อื่น ๆ ที่นี่
      icon: tabler:rocket
    - title: แพ็กเกจครบวงจร
      description: 'ทุกชุดSUPมาพร้อมชุดครบครัน: บอร์ด, กระเป๋าเป้เดินทาง, ปั๊มมือ, ไม้พายปรับได้, ครีบถอดได้, สายจูงแบบขดลวด และชุดซ่อม'
      icon: tabler:clipboard-list
    - title: คุณภาพที่พิสูจน์แล้ว
      description: บอร์ดทุกตัวผ่านการทดสอบแรงดัน 100% ที่พิกัด PSI 1.25x ก่อนจัดส่ง อัตราปราศจากข้อบกพร่อง 99.3% ในทุกชุด
      icon: tabler:shield-check
    - title: ไม่มีการสั่งซื้อขั้นต่ำ
      description: ซื้อสิ่งที่คุณต้องการอย่างแน่นอน เพิ่มบอร์ดลงในรถเข็น ชำระเงิน เสร็จสิ้น ไม่มีขั้นต่ำ ไม่มีกระบวนการเสนอราคา ไม่มีการรอ
      icon: tabler:adjustments
    - title: จัดส่งรวดเร็วทั่วโลก
      description: คําสั่งซื้อที่มีสินค้าคงคลังจะจัดส่งจาก Weihai ภายใน 2-3 วันทําการติดตามการจัดส่งไปยัง 50+ ประเทศทั่วสหภาพยุโรป อเมริกาเหนือ เอเชียแปซิฟิก และที่อื่น ๆ
      icon: tabler:truck-delivery
    - title: รับประกัน SUP 2 ปี
      description: SUP แผ่นไม้และอุปกรณ์เสริมทุกชิ้นได้รับความคุ้มครองเป็นเวลา 2 ปี — drop-stitch รวมถึงรอยต่อ วาล์วเติมลม และอุปกรณ์เสริมการเคลมจะได้รับการแก้ไขภายในไม่กี่วัน ไม่ใช่ไม่กี่สัปดาห์
      icon: tabler:lifebuoy
content_categories:
  tagline: ประเภทสินค้า
  title: สายผลิตภัณฑ์เดียว<br />ทำถูกต้อง
  subtitle: บอร์ด SUP แบบเป่าลมและอุปกรณ์เสริม — ทั้งหมดผลิตในโรงงานที่ Weihai ของเรา
  items:
    - title: SUP กระดาน
      description: อุปกรณ์เป่าลมSUPsรอบด้าน สูง 9 ถึง 12 ฟุต มีความมั่นคง ทนทาน และมาพร้อมปั๊ม ไม้พาย สายจูง และเป้สะพายหลัง
      icon: tabler:swimming
      link: /supboard
    - title: การทัวร์SUPs
      description: บอร์ดที่ยาวและเร็วกว่า พร้อมเส้นทางทัวร์สําหรับทะเลสาบ แม่น้ํา และการสํารวจชายฝั่ง
      icon: tabler:route
      link: /supboard
    - title: โยคะ & ฟิตเนสSUPs
      description: แพลตฟอร์มกว้างพิเศษที่มั่นคงมาก พร้อมแผ่นรองดาดฟ้ายาวเต็มด้านสําหรับโยคะและออกกําลังกายบนผิวน้ํา
      icon: tabler:users
      link: /supboard
    - title: ลูก SUPsๆ
      description: แผ่นไม้ที่เบาและสั้นลง ขนาดสําหรับเด็ก — drop-stitch คุณภาพเดียวกันในแพ็คเกจที่เหมาะกับเด็ก
      icon: tabler:lifebuoy
      link: /products
    - title: อุปกรณ์เสริม
      description: ปั๊มน้ํา ไม้พาย เสื้อชูชีพ สายจูง ชุดซ่อม และอะไหล่สําหรับทุกบอร์ดที่เราจําหน่าย
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: ความแข็งแกร่งของโรงงาน
  title: ทำไมราคาเคลียร์สินค้าของเรา<br />จึงเป็นราคาจริง
  content: <h3 class="text-2xl font-bold Tracking-tight dark:text-white sm:text-3xl mb-2">โรงงานจริง ประหยัดจริง — กระดานทุกใบจัดส่งจากโรงงานใน Weihai ของเรา</h3>
  items:
    - title: สายการผลิตเดียวกับแบรนด์หลัก
      description: โรงงานเว่ยไห่ของเราขนาด 12,000 ตารางเมตร ผลิตแผ่นไม้สําหรับแบรนด์ระดับนานาชาติและล็อตสินค้าคงคลังสํารองของเราเองในสายการผลิตเดียวกันและวัสดุเดียวกัน
    - title: ทดสอบแรงดัน 100%
      description: บอร์ดทุกตัวได้รับแรงดันถึง 1.25x พิกัด PSI และยึดไว้ก่อนจัดส่ง อัตราปราศจากข้อบกพร่อง 99.3% ในทุกชุด
    - title: ไม่มีคนกลาง
      description: บอร์ดจัดส่งตรงจากโรงงานถึงประตูบ้านคุณ ไม่มีพ่อค้าคนกลาง ไม่มีส่วนเพิ่มราคาขายปลีก — นั่นคือราคาเคลียร์สต็อกที่ต่ำกว่าราคาขายปลีกถึง 60%
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock โรงงานเว่ยไห่ขนาด 12,000 ตารางเมตร พร้อมSUPสายการผลิตเป่าลม
content_compliance:
  tagline: คุณภาพและการทดสอบ
  title: ผ่านการทดสอบคุณภาพ<br />จัดทำเป็นเอกสาร
  subtitle: การกล่าวอ้างด้านคุณภาพทั้งหมดได้รับการสนับสนุนโดยตัวเลขจริงจากสายการผลิตของเรา — การทดสอบแรงดัน บันทึกแบทช์ และอัตราข้อบกพร่องที่วัดได้
  items:
    - title: ผ่านการทดสอบแรงดัน 100%
      description: บอร์ดทุกตัวจะพองตัวอยู่ที่พิกัด 1.25x PSI และยึดไว้ก่อนจัดส่ง หากตะเข็บ วาล์ว หรือด้ายแบบหยดล้มเหลว บอร์ดจะไม่ออกจากโรงงาน
      icon: tabler:shield-check
    - title: อัตราปราศจากข้อบกพร่อง 99.3%
      description: วัดผลในทุกชุดการผลิต ตัวเลขดังกล่าวมาจากบันทึกการตรวจสอบขั้นสุดท้ายของเราเอง ไม่ใช่การตลาด
      icon: tabler:gauge
    - title: การติดตามย้อนกลับแบบแบทช์
      description: Every board carries a production batch code, so warranty claims and quality checks trace back to exact materials and runs.
      icon: tabler:clipboard-check
    - title: รับประกัน SUP 2 ปี
      description: SUP แผ่นไม้และอุปกรณ์เสริมทุกชิ้นได้รับความคุ้มครองเป็นเวลา 2 ปี — drop-stitch รวมถึงรอยต่อ วาล์วเติมลม และอุปกรณ์เสริมเคลมได้รับการแก้ไขอย่างรวดเร็ว
      icon: tabler:lifebuoy
steps:
  title: จากจุดชําระเงินจนถึงทางน้ํา — วิธีการจัดส่งคําสั่งซื้อของคุณ
  items:
    - title: 'ขั้นตอนที่ 1: <span class="font-medium">เลือกบอร์ดของคุณ</span>'
      description: เลือกได้ทั้งรุ่นรอบด้าน ทัวร์ โยคะ และรุ่นสําหรับเด็กคู่มือการซื้อของเราช่วยให้คุณจับคู่ขนาดและสไตล์บอร์ดกับการพายของคุณ
      icon: tabler:clipboard-list
    - title: 'ขั้นตอนที่ 2: <span class="font-medium">การชำระเงินที่ปลอดภัย</span>'
      description: ชําระเงินอย่างปลอดภัยผ่าน Stripe หรือ PayPal รับบัตรเครดิตและเดบิตหลักทุกประเภทไม่ต้องมีบัญชี — การยืนยันคําสั่งซื้อจะส่งถึงกล่องจดหมายของคุณ
      icon: tabler:file-text
    - title: 'ขั้นตอนที่ 3: <span class="font-medium">การตรวจสอบคุณภาพ</span>'
      description: แผ่นไม้ทุกแผ่นผ่านการทดสอบแรงดัน 100% ที่ค่า 1.25x PSI และตรวจสอบกับรายการตรวจสอบคุณภาพอย่างครบถ้วนก่อนบรรจุ
      icon: tabler:settings
    - title: 'ขั้นตอนที่ 4: <span class="font-medium">จัดส่งด่วน</span>'
      description: คําสั่งซื้อที่มีสินค้าคงคลังจัดส่งจากโรงงานของเราที่เว่ยไห่ภายใน 2-3 วันทําการบริการจัดการด่วนสําหรับคําสั่งซื้อเร่งด่วน
      icon: tabler:building-factory
    - title: 'ขั้นตอนที่ 5: <span class="font-medium">การติดตามการจัดส่ง</span>'
      description: ติดตามการจัดส่งทั่วโลกไปยัง 50+ ประเทศการรับประกัน 2 ปีและการสนับสนุนหลังการขายที่ตอบสนองอย่างรวดเร็วจะเริ่มตั้งแต่วันที่บอร์ดของคุณมาถึง
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP กระบวนการสั่งซื้อตั้งแต่การชําระเงินที่ปลอดภัยจนถึงการจัดส่งทั่วโลกที่มีการติดตาม
blog_latest:
  title: SUP คู่มือและข้อมูลเชิงลึกทางเทคนิค
  information: |-
    คู่มือการซื้อ เทคนิคการพายเรือ สิ่งจำเป็นด้านความปลอดภัย และการก่อสร้าง
    การวิจัยจากทีม Paddle Board Overstock
faqs:
  title: SUP คําถามที่พบบ่อยเกี่ยวกับการสั่งซื้อและสินค้า
  subtitle: คําถามที่พบบ่อยเกี่ยวกับบอร์ดลดราคา การSUPสั่งซื้อ การชําระเงิน การจัดส่ง และการรับประกัน
  columns: 2
  items:
    - title: SUP เรียนรู้ยากไหม?
      description: ไม่เลยผู้เริ่มต้นส่วนใหญ่จะลุกขึ้นและพายตั้งแต่ครั้งแรกบอร์ดอเนกประสงค์ของเราSUPมีแพลตฟอร์มกว้างพิเศษที่มั่นคง ออกแบบมาโดยเฉพาะสําหรับผู้พายครั้งแรกเริ่มต้นบนน้ําที่สงบ แล้วคุณจะล่องเรือได้ภายในไม่กี่นาที
      icon: tabler:swimming
      category: จีบ
    - title: ขีดจำกัดน้ำหนักคืออะไร?
      description: รองรับน้ําหนักได้สูงสุด SUPs 220 ปอนด์ และแพลตฟอร์มทัวร์ริ่งและโยคะรองรับน้ําหนักได้สูงสุด 250 ปอนด์ทุกหน้าผลิตภัณฑ์จะแสดงความจุน้ําหนักของนักขี่อย่างแม่นยํา เพื่อให้คุณสามารถเลือกบอร์ดให้ตรงกับความต้องการของคุณ
      icon: tabler:adjustments
      category: จีบ
    - title: ฉันสามารถเดินทางโดยมีเรือเป่าลม SUP ได้หรือไม่
      description: แน่นอนPaddle Board Overstockทุกแผ่นสามารถบรรจุในกระเป๋าเป้ขนาดเป้ได้น้ําหนักเพียง 18-22 ปอนด์ จึงพกพาไปชายหาด ทะเลสาบ หรือผ่านอาคารผู้โดยสารสนามบินได้ง่ายตรวจสอบนโยบายสัมภาระของสายการบินก่อนเดินทาง
      icon: tabler:truck-delivery
      category: จีบ
    - title: อะไรมาในกล่อง?
      description: ทุกชิ้นPaddle Board Overstock SUP ประกอบด้วยบอร์ด กระเป๋าเป้เดินทาง ปั๊มมือ ไม้พายปรับได้ ครีบถอดได้ สายจูงแบบขดลวด และชุดซ่อม
      icon: tabler:clipboard-list
      category: จีบ
    - title: ทำไมราคาของคุณถึงต่ำกว่าราคาขายปลีก?
      description: เราขายสต๊อกส่วนเกินในโรงงาน — บอร์ดใหม่ล่าสุดที่เหลือจากใบสั่งผลิตที่เสร็จสมบูรณ์ — ซึ่งได้มาจากฐานการผลิตใน Weihai ของเราเองและพันธมิตรการผลิตที่ได้รับการคัดเลือก ไม่มีมาร์กอัปการขายปลีกและไม่มีพ่อค้าคนกลาง หมายถึงแพ็คเกจ SUP ที่สมบูรณ์พร้อมส่วนลดสูงสุดถึง 60% จากราคาขายปลีกทั่วไป ด้วยคุณภาพที่ผ่านการทดสอบแรงกดดันเช่นเดียวกัน
      icon: tabler:shield-check
      category: คำสั่งซื้อ
    - title: ฉันจะสั่งซื้อและชำระเงินได้อย่างไร?
      description: เพิ่มแพ็กเกจ SUP ของคุณไปยังตะกร้าและชำระเงินอย่างปลอดภัยผ่าน Stripe หรือ PayPal เรารับบัตรเครดิตและบัตรเดบิตทุกประเภท คำสั่งซื้อทุกออร์เดอร์จะได้รับการยืนยันทางอีเมลพร้อมใบแจ้งหนี้เต็มรูปแบบ
      icon: tabler:file-text
      category: คำสั่งซื้อ
    - title: คุณจัดส่งสินค้าทั่วโลกหรือไม่?
      description: ใช่ เราจัดส่งไปยัง 50+ ประเทศทั่วสหภาพยุโรป อเมริกาเหนือ เอเชียแปซิฟิก ตะวันออกกลาง และแอฟริกา คำสั่งซื้อที่มีสินค้าในสต็อกมักจะจัดส่งภายใน 2-3 วันทำการ พร้อมมีการติดตามพัสดุสำหรับแต่ละพัสดุ
      icon: tabler:route
      category: คำสั่งซื้อ
    - title: บอร์ด SUP มีการรับประกันอะไรบ้าง?
      description: 'บอร์ดและอุปกรณ์เสริมทุกชิ้น SUP มีการรับประกัน 2 ปี — รวมถึงตัวบอร์ดเอง รอยต่อ drop-stitch และวาล์วเติมลม การเคลมจะได้รับการแก้ไขภายในไม่กี่วัน ไม่ใช่สัปดาห์: ยื่นเรื่องออนไลน์แล้วเราจะซ่อมแซมหรือเปลี่ยนให้'
      icon: tabler:lifebuoy
      category: คำสั่งซื้อ
