breadcrumb: OEM/ODM ผู้ผลิต
tldr:
  summary: Paddle Board Overstock เป็นผู้ผลิตโดยตรงจากโรงงาน OEMมีพื้นที่ODM 12,000 ตารางเมตร ISO 9001:2015 ผลิตเฉลี่ย 15,000 คันต่อปี CE/BSCI/REACH/UKCA เป็นไปตามมาตรฐาน จํานวนต่ําMOQsตั้งแต่ 2-10 คัน
  points:
    - พื้นที่ 12,000 ตร.ม. สถานที่ ISO ได้รับการรับรอง 9001:2015 จากชิงเต่า
    - กําลังการผลิต 15,000 หน่วยต่อปี พร้อมแรงงานฝีมือ 200-300 คน
    - CE 2013/53/EU, UKCA, BSCI, REACH การปฏิบัติตามข้อกําหนด
    - 'ต่ํา MOQs: 2-5 หน่วย (RIB), 5-10 หน่วย (SUP) สําหรับรุ่นมาตรฐาน'
    - 50+ ประเทศส่งออกพร้อมFOBการจัดส่งชิงเต่า
trust_badges:
  badges:
    - icon: ⭐
      title: ISO ได้รับการรับรอง 9001:2015
      desc: SGS-ระบบบริหารคุณภาพที่ผ่านการตรวจสอบในทุกสายการผลิต
      variant: cert
    - icon: ⭐
      title: CE & UKCA สอดคล้อง
      desc: ปฏิบัติตามข้อกําหนดการติดเครื่องหมายของ EU 2013/53/EU และสหราชอาณาจักรอย่างครบถ้วน
      variant: cert
    - icon: ⭐
      title: BSCI การตรวจสอบทางสังคม
      desc: ได้รับการยืนยันว่ามีแนวปฏิบัติด้านแรงงานและมาตรฐานในที่ทํางานอย่างมีจริยธรรม
      variant: standard
    - icon: ⭐
      title: ต่ําMOQตั้งแต่ 2 หน่วยขึ้นไป
      desc: 'รุ่นมาตรฐานRIBตั้งแต่ 2-5 ชิ้น และ SUP ตั้งแต่ 5-10 ชิ้นแม่พิมพ์สั่งทําพิเศษ: 200 ชิ้น+'
      variant: standard
process_section:
  eyebrow: กระบวนการของเรา
  title: ตั้งแต่ต้นจนจบ OEM/ODM เวิร์กโฟลว์
  subtitle: ตั้งแต่บรีฟการออกแบบไปจนถึงการบรรจุตู้คอนเทนเนอร์ — หกขั้นตอนสู่เรือเป่าลมแบรนด์ส่วนตัวของคุณ
  steps:
    - step: '01'
      title: ข้อกําหนดและบรีฟการออกแบบ
      desc: แบ่งปันสเปกเป้าหมาย แบบร่าง CAD หรือผลิตภัณฑ์อ้างอิงของคุณทีมวิศวกรรมของเราจะตรวจสอบวัสดุ ขนาด และข้อกําหนดการปฏิบัติตามข้อกําหนด (CE, BSCI) ก่อนเสนอราคา
    - step: '02'
      title: การสร้างต้นแบบแม่พิมพ์ 3 มิติ
      desc: เราออกแบบและCNCเครื่องจักรแม่พิมพ์เฉพาะสําหรับบอร์ด ตัวSUPเรือคายัค และRIBชิ้นส่วนต่างๆตัวอย่างต้นแบบผลิตภายใน 15–20 วันทําการเพื่อขออนุมัติจากคุณ
    - step: '03'
      title: การเลือกวัสดุและการผลิตตัวอย่าง
      desc: เลือกได้ทั้งผ้าเกรดทหาร PVC (0.9mm–1.2mm) Hypalon CSMหรือdrop-stitchผ้าแกนกลางเราผลิตตัวอย่างก่อนการผลิตพร้อมสีแบรนด์ โลโก้ และบรรจุภัณฑ์ของคุณเพื่อการอนุมัติ
    - step: '04'
      title: CE การตรวจสอบและการปฏิบัติตามข้อกําหนดในโรงงาน
      desc: OEM ทุกคําสั่งซื้อประกอบด้วยเอกสารการปฏิบัติตามข้อกําหนด — CE การประกาศความสอดคล้อง, ISO บันทึกการติดตาม 9001, BSCI รายงานการปฏิบัติตามสังคม และREACHเอกสารสําคัญ
    - step: '05'
      title: การผลิตจํานวนมากและการตรวจสอบคุณภาพแบบอินไลน์
      desc: การผลิตตามรายการตรวจสอบคุณภาพ 100 ข้อของเราแต่ละหน่วยจะผ่านการทดสอบการเก็บแรงดัน 24 ชั่วโมง การทดสอบรอยต่อลอก และการตรวจสอบด้วยสายตาก่อนบรรจุ
    - step: '06'
      title: FOB โลจิสติกส์และการจัดส่งชิงเต่า
      desc: สินค้าสําเร็จรูปจะถูกบรรจุในพาเลท ห่อหด และบรรจุตู้คอนเทนเนอร์ที่ท่าเรือชิงเต่าเราดูแลเอกสารส่งออกทั้งหมด พิธีการศุลกากร และติดตามการจัดส่งแบบเรียลไทม์
capabilities_section:
  eyebrow: ความสามารถในการผลิต
  title: สิ่งที่เราสร้าง
  subtitle: ขีดความสามารถการผลิตหลัก 6 ประการสําหรับB2Bพันธมิตรระดับโลก
  items:
    - title: Drop-Stitch SUP การผลิตแผ่นไม้
      desc: drop-stitch การเคลือบแกนกลางเต็มความยาวสําหรับบอร์ดพายแบบยืนแข็งแรงดันสูง (15–20PSI)ออกแบบความยาว ความกว้าง ความหนา โปรไฟล์โยก และการออกแบบกราฟิกตามต้องการ
    - title: PVC การผลิตเรือเป่าลม
      desc: เรือเล็กเชื่อมความถี่สูง เรือPVCเทนเดอร์ และเรือสปอร์ตมีการจัดวางห้องหลายแบบ ตัวเลือกพื้น (สแลต ดาดฟ้าอากาศ ม้วนขึ้น) และการรวมอุปกรณ์เสริม
    - title: Hypalon RIB การผลิตเรือ
      desc: ท่อเกรดเชิงพาณิชย์Hypalon CSM ที่ยึดติดกับตัวเรือไฟเบอร์กลาสหรืออลูมิเนียมแบบ deep-V ความยาว 3.3 เมตรถึง 6.0 เมตร สําหรับการลาดตระเวน กู้ภัย ทัวร์ และดําน้ํา
    - title: แบรนด์ส่วนตัวและแบรนด์สั่งทําพิเศษ
      desc: 'บริการฉลากส่วนตัวเต็มรูปแบบ: การถ่ายเทด้วยความร้อนหรือการพิมพ์สกรีนโลโก้แบบกําหนดเอง, บรรจุภัณฑ์แบรนด์ (กล่องขายปลีก, กระเป๋าสะพาย), คู่มือผู้ใช้ในภาษาของคุณ และบาร์โค้ด/UPCการลงทะเบียน'
    - title: การออกแบบแม่พิมพ์และเครื่องมือแบบกําหนดเอง
      desc: ทีมวิศวกร 3D CAD/CAM ภายในบริษัทเราออกแบบและผลิตแม่พิมพ์อลูมิเนียมและคอมโพสิตแบบสั่งทําพิเศษสําหรับรูปทรงตัวเรือ การจัดวางดาดฟ้า และจุดยึดอุปกรณ์เสริมที่เป็นเอกลักษณ์
    - title: OEM อุปกรณ์เสริม & ชุดประกอบ
      desc: เสื้อชูชีพ (CE12402), ปั๊มแบบสองขั้นตอน, ไม้พายคาร์บอน/ไนลอน, ชุดซ่อม, กระเป๋าใส่ และชุดสายจูงชุดประกอบและบรรจุภัณฑ์ครบชุดสําหรับการนําเสนอในร้านค้าปลีก
experience_section:
  eyebrow: ประสบการณ์จริง
  title: ความร่วมมือที่สร้างแบรนด์
  subtitle: เรื่องราวจริงจากแบรนด์และองค์กรที่ร่วมมือกับPaddle Board Overstockฝ่ายOEMODMผลิต
  stories:
    - quote: เรามาPaddle Board Overstockพร้อมภาพร่างบนกระดาษทิชชู่และรายการข้อกําหนดแปดเดือนต่อมา เรามีผลิตภัณฑ์ที่พร้อมใช้งานCEจริงและผ่านการรับรองตั้งแต่ครั้งแรก
      narrative: สตาร์ทอัพยุโรปที่มีแนวทางการออกแบบใหม่SUP Paddle Board Overstock สําหรับODMการผลิตPaddle Board Overstockทีมวิจัยและพัฒนาได้นําแนวคิดนี้ผ่านการออกแบบ CAD, การวิเคราะห์โครงสร้าง FEA, การจําลองไฮโดรไดนามิก, การสร้างแม่พิมพ์, การผลิตต้นแบบ และเครื่องมือผลิตผู้ก่อตั้งสตาร์ทอัพได้เดินทางไปชิงเต่าสามครั้งในระหว่างกระบวนการผลิตภัณฑ์สุดท้ายผ่านCEการรับรองโดยไม่มีการแก้ไขใด ๆ — ผลลัพธ์ที่ผู้ก่อตั้งเชื่อว่าเป็นผลจากPaddle Board Overstockทีมวิศวกรรมของ 's ที่เข้าใจข้อกําหนดด้านกฎระเบียบของยุโรปตั้งแต่เริ่มต้น
      context: เปิดตัวSUPแบรนด์ยุโรป, 2023-2024
      source: Brand Founder
    - quote: ระดับNDAการปกป้องและความปลอดภัยทางปัญญาPaddle Board Overstockที่ทําให้เรามั่นใจที่จะแบ่งปันดีไซน์ที่เป็นกรรมสิทธิ์ของเราพวกเขาปฏิบัติต่อทรัพย์สินทางปัญญาของเราราวกับเป็นของตัวเอง
      narrative: บริษัทอุปกรณ์ทางทะเลจากสหรัฐฯ ที่มีเทคโนโลยีวาล์วเฉพาะทางต้องการพันธมิตรผู้ผลิตที่สามารถปกป้องทรัพย์สินทางปัญญาของตนในขณะที่ผลิตในระดับใหญ่หลังจากตรวจสอบผู้ผลิตจีนห้าราย พวกเขาเลือกPaddle Board Overstockโดยอิงตามมาตรการปกป้องทรัพย์สินทางปัญญาของโรงงาน การจัดการไฟล์การออกแบบที่ปลอดภัย และความเต็มใจที่จะลงนามในข้อตกลง NDA อย่างเข้มงวดความร่วมมือนี้ได้ผลิตผลิตภัณฑ์สามสายในช่วงสี่ปีโดยไม่มีเหตุการณ์ IP ใด ๆ
      context: บริษัทอุปกรณ์ทางทะเลของสหรัฐฯ, OEM ความร่วมมือตั้งแต่ปี 2021
      source: รองประธานฝ่ายปฏิบัติการ
