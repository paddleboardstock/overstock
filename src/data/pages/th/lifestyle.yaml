hero:
  tagline: ไลฟ์สไตล์
  title: Aquafarer<br />ไลฟ์สไตล์
  subtitle: สร้างขึ้นสำหรับผู้ที่ใช้ชีวิตบนผืนน้ำ — ตั้งแต่นักสำรวจช่วงสุดสัปดาห์ไปจนถึงผู้ประกอบการเชิงพาณิชย์ที่พึ่งพาอุปกรณ์ของพวกเขาทุกวัน
values:
  - icon: 🌊
    title: เกิดบนผืนน้ำ
    desc: การออกแบบทุกชิ้นเริ่มจากการเข้าใจพฤติกรรมของน้ำ เราออกแบบจากขอบเขตของสภาพไปสู่ภายใน — เพราะมหาสมุทรคือครูของเรา ไม่ใช่สถานที่ทำงานของเรา
  - icon: 🔧
    title: สร้างมาเพื่อต่ออายุการใช้งาน
    desc: ผลิตภัณฑ์ที่ยั่งยืนที่สุดคือหนึ่งที่ไม่จำเป็นต้องเปลี่ยนวัสดุ วัสดุเกรดทะเล drop-stitch แกนที่รองรับแรงถึง 15 PSI และรอยต่อที่ยืนยงกว่าฤดูกาล
  - icon: 🏆
    title: เข้าถึงได้ด้วยการออกแบบ
    desc: กีฬาทางน้ำไม่ควรเป็นความหรูหรา ประสิทธิภาพระดับมืออาชีพในราคาที่สมเหตุสมผลสำหรับครอบครัว ไกด์ และผู้ประกอบการขนาดเล็ก — ไม่ใช่เฉพาะกองเรือเชิงพาณิชย์
  - icon: 🌍
    title: ชุมชนทั่วโลก
    desc: 'จากชายฝั่งชิงเต่าไปจนถึงทะเลสาบในยุโรป แม่น้ำในเอเชียตะวันออกเฉียงใต้ และอ่าวในอเมริกา — ลูกค้าของเรามีสิ่งหนึ่งร่วมกัน: ความรักในการอยู่บนผืนน้ำ'
  - icon: ♻️
    title: การผลิตที่รับผิดชอบ
    desc: การตัดแบบ CNC-optimized ลดของเสียวัสดุต่ำกว่า 5% การก่อสร้างที่ทนทานช่วยลดรอบการเปลี่ยนใหม่ เราสร้างเพื่อความยาวนานเพราะนั่นคือการเลือกที่ยั่งยืนที่สุด
  - icon: 🤝
    title: การสนับสนุนที่ยืนยาว
    desc: ลำเรืออายุยี่สิบปียังคงติดต่อเราสำหรับอะไหล่ การตอบรับเรื่องการรับประกันเฉลี่ย 24 ชั่วโมง เราไม่หายไปหลังการขาย — เราอยู่ที่นี่ตลอดอายุการใช้งานของผลิตภัณฑ์
