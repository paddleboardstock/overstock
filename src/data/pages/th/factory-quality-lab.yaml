hero:
  tagline: ห้องปฏิบัติการควบคุมคุณภาพ
  title: ห้องปฏิบัติการทดสอบ & การประกันคุณภาพ
  subtitle: ห้องปฏิบัติการคุณภาพอิสระที่มีขั้นตอน ISO 9001 — ทุกหน่วยถูกทดสอบก่อนการจัดส่ง
intro: Paddle Board Overstock ดำเนินการห้องปฏิบัติการควบคุมคุณภาพเฉพาะที่ทำงานเป็นอิสระจากกระบวนการผลิต ทุกล็อตของวัตถุดิบและเรือสำเร็จทุกลำจะผ่านขั้นตอนการตรวจสอบที่มีเอกสารก่อนการออกจากระบบ ทีม QC ของเรารายงานตรงต่อฝ่ายบริหาร เพื่อให้มั่นใจในการตัดสินคุณภาพที่เป็นกลาง
highlights:
  - value: 100%
    label: ชิ้นส่วนทดสอบแรงดัน
    detail: ทุกห้อง, ทุกเรือ
  - value: 48 h
    label: ระยะเวลาการทดสอบการเก็บอากาศ
    detail: ที่ความดันที่กำหนด 1.25×
  - value: '&lt;5%'
    label: ความดันตกสูงสุดที่อนุญาต
    detail: ในช่วงเวลาถือ 24 ชั่วโมง
  - value: AQL 2.5
    label: เกณฑ์ข้อบกพร่องหลัก
    detail: ต่อการสุ่มตัวอย่าง ISO 2859
test_procedures:
  - title: การตรวจสอบวัตถุดิบ
    description: ทุกล็อตของ PVC, ผ้า Hypalon, drop-stitch และอุปกรณ์ที่เข้ามาจะถูกทดสอบก่อนรับ การทดสอบความต้านแรงดึง (ASTM D751), ความต้านทานการขาด (ISO 4674) และความต้านทานต่อ UV จะได้รับการยืนยัน วัสดุที่ไม่เป็นไปตามมาตรฐานจะถูกกักตัวและส่งคืน
    standards:
      - ASTM D751 (แรงดึง)
      - ISO 4674 (ขาด)
      - ISO 4892 (UV)
  - title: จุดตรวจสอบ QC ในกระบวนการผลิต
    description: ผู้ปฏิบัติงานผลิตทำการตรวจสอบตัวเองในแต่ละขั้นตอน ผู้ตรวจ QC ทำการสุ่มตัวอย่างตลอดช่วงเวลา ผลการทดสอบการลอกเชื่อมจะทำทุก 50 หน่วย การตรวจสอบขนาดเกิดขึ้นทุกแผงที่ 20
    standards:
      - ASTM D751 (ลอก)
      - รายการตรวจสอบ 100 จุดภายใน
      - ISO 2859 การสุ่มตัวอย่าง
  - title: การทดสอบการกักเก็บอากาศ 48 ชั่วโมง
    description: ทุกห้องท่อจะถูกเติมลมจนถึง 125% ของความดันที่กำหนดและค้างไว้ 48 ชั่วโมง เซ็นเซอร์ตรวจวัดความดันบันทึกอย่างต่อเนื่องพร้อมการชดเชยอุณหภูมิ ห้องใดที่มีการตกของความดันเกิน 5% จะเรียกให้ทำการตรวจสอบล็อตใหม่โดยอัตโนมัติ
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: การทดสอบโหลดและสมดุล
    description: เรือที่เสร็จสมบูรณ์จะถูกทดสอบที่ความจุสูงสุดเพื่อความมั่นคง ระดับตลิ่งและการควบคุม เรือแต่ละลำจะผ่านการทดสอบน้ำก่อนการอนุมัติการตรวจสอบสุดท้าย
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: เครื่องทดสอบแรงดึงสากล (Universal Testing Machine)
    spec: 5 kN, เป็นไปตามมาตรฐาน ASTM D751
  - name: เครื่องทดสอบการรั่วซึมด้วยแรงดัน (Pressure Decay Tester)
    spec: หลายช่องสัญญาณ, 0–50 psi, บันทึกข้อมูล
  - name: UV ห้องจำลองสภาพอากาศ (Weathering Chamber)
    spec: ISO 4892, วงจร 1,000 ชั่วโมง
  - name: เกจวัดความหนา (แบบดิจิทัล)
    spec: ความละเอียด 0.01 มม.
  - name: เครื่องทดสอบการปอก/ตัด (Peel Tester) สำหรับรอยเชื่อม
    spec: มอเตอร์ขับเคลื่อน, กำลังรับ 50 N
  - name: ตู้ควบคุมอุณหภูมิ (Temperature Chamber)
    spec: -40 °C ถึง +100 °C
  - name: ถังตรวจจับการรั่ว (Leak Detection Tank)
    spec: ขนาด 6 ม. × 2 ม., มีไฟส่องสว่าง
