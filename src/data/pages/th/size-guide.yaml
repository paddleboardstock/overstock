how_to_choose:
  title: วิธีเลือกขนาดที่เหมาะสม
  cards:
    - title: กระดานอเนกประสงค์ SUP
      description: กระดานแบบอเนกประสงค์ของเราประมาณ 11 ฟุต (กว้าง 32 นิ้ว หนา 6 นิ้ว drop-stitch) มีความสมดุลระหว่างความมั่นคง ความเร็ว และความจุ เลือกความจุของกระดานให้เหมาะสมกับน้ำหนักของคุณ — ผู้พายที่มีน้ำหนักมากจะต้องการความจุมากขึ้น
    - title: ความกว้างและความหนา
      description: กระดานที่กว้างขึ้น (32"+) ให้ความมั่นคงมากขึ้นสำหรับผู้เริ่มต้น โยคะ และการตกปลา ความหนา 6 นิ้วที่ 15 PSI ช่วยให้ดาดฟ้ามีความแข็งแรงรองรับทั้งผู้พายและอุปกรณ์
    - title: แพ็กเกจและอุปกรณ์เสริม
      description: บอร์ดแต่ละชิ้นจัดส่งเป็นชุดสมบูรณ์ — บอร์ด, กระเป๋าเป้เดินทาง, ปั๊วมืือ, ไม้พายปรับได้, ครีบที่ถอดออกได้, สายคล้องขด และชุดซ่อม ตรวจสอบน้ำหนักสูงสุดสำหรับผู้ขี่รวมถึงอุปกรณ์
