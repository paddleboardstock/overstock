hero:
  title: คู่มือขนาด & สเปค
  subtitle: ขนาด ความจุ และการใช้งานที่แนะนำสำหรับผลิตภัณฑ์ Paddle Board Overstock ทุกชิ้น
categories:
  SUP: กระดาน SUP แบบเป่าลมออกแบบเพื่อความสะดวกในการพกพาโดยไม่ลดทอนประสิทธิภาพ เลือกขนาดที่เหมาะสมกับน้ำหนักและสไตล์การพายของคุณ
  ACCESSORY: อุปกรณ์เสริมและแพ็กเกจที่ช่วยเติมเต็มกระดานของคุณ มีขนาดมาตรฐานแบบสากลพร้อมตัวเลือกหลากหลาย
