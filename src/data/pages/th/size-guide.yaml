how_to_choose:
  title: How to Choose the Right Size
  cards:
    - title: All-Around SUP Boards
      description: Our ~11 ft all-around boards (32" wide, 6-inch drop-stitch) balance stability, speed, and capacity. Match the board volume to your weight — heavier paddlers need more volume.
    - title: Width & Thickness
      description: Wider boards (32"+) offer more stability for beginners, yoga, and fishing. 6-inch thickness at 15 PSI keeps the deck rigid under rider and gear.
    - title: Packages & Accessories
      description: Every board ships as a complete package — board, travel backpack, hand pump, adjustable paddle, removable fin, coil leash, and repair kit. Check max load for rider plus gear.
