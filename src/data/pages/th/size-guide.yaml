how_to_choose:
  title: วิธีเลือกขนาดที่เหมาะสม
  cards:
    - title: SUP กระดาน
      description: เลือกความยาวตามน้ำหนักตัวและการใช้งานที่ตั้งใจไว้ แผ่นบอร์ดที่กว้างขึ้น (32"+) มอบความมั่นคงมากขึ้น บอร์ดที่ยาวขึ้น (11-12 ฟุต) ทำให้การท่องเที่ยวดีขึ้น ผู้พายที่มีน้ำหนักตัวมากต้องการบอร์ดปริมาตรมากขึ้น
    - title: คายัค
      description: คายัคเดี่ยว (9 ฟุต) เหมาะสำหรับการเดินทางคนเดียวและแม่น้ำ คายัคคู่ (12 ฟุต) รองรับผู้พายสองคนหรือผู้ใหญ่หนึ่งคนพร้อมอุปกรณ์ ตรวจสอบความจุรับน้ำหนักสำหรับน้ำหนักรวมของอุปกรณ์ทั้งหมด
    - title: เรือคายัคเล็ก & RIBs
      description: เลือกความยาวของเรือเล็กตามจำนวนผู้โดยสารและการใช้งานที่ตั้งใจไว้ เรือ RIBs ขนาดใหญ่ (4.5 ม.+) เหมาะสำหรับการออกทะเลและการช่วยเหลือ เรือเล็กขนาดเล็ก (2.7 ม.) เหมาะสำหรับการเป็นเรือนำและเป็นแพตกปลา
