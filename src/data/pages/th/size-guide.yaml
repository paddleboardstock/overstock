hero:
  title: คู่มือขนาด & สเปค
  subtitle: ขนาด ความจุ และการใช้งานที่แนะนำสำหรับผลิตภัณฑ์ Paddle Board Overstock ทุกประเภท
categories:
  inflatable: เรือเป่าลม SUPs และเรือคายัคออกแบบให้พกพาสะดวกโดยไม่ลดทอนประสิทธิภาพ เลือกขนาดที่เหมาะสมกับน้ำหนักตัวและสไตล์การพายของคุณ
  rib: เรือเป่าลมแบบตัวถังแข็งสำหรับการนำทางชายฝั่ง การลาดตระเวน และการปฏิบัติการทางทะเลเชิงมืออาชีพ เลือกตามความยาวและความจุมอเตอร์
  accessory: อุปกรณ์เสริมและอุปกรณ์ความปลอดภัยเพื่อเสริมกับเรือของคุณ ขนาดสากลพร้อมตัวเลือกหลากหลาย
table:
  headers:
    product: ผลิตภัณฑ์
    length: ความยาว
    width: ความกว้าง
    weight: น้ำหนัก
    max_load: น้ำหนักสูงสุด
