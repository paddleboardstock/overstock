content_challenge:
  tagline: ความท้าทาย
  title: ความต้องการเรือประมง<br />ความมั่นคง ช่วง และความทนทาน
  subtitle: ไม่ว่าคุณจะขับเรือประมงเชิงพาณิชย์ บริหารจัดการกองเรือสหกรณ์ หรือดำเนินการเช่าเรือประมง เรือของคุณจำเป็นต้องทำงานได้อย่างน่าเชื่อถือในทุกวัน
  paragraphs:
    - เรือประมงต้องการแพลตฟอร์มที่มั่นคงสำหรับการทำงานกับอวน จัดการปลา และเคลื่อนที่บนดาดฟ้าอย่างปลอดภัย เรือเป่าลมและRIBs มอบความมั่นคงโดยธรรมชาติตามการออกแบบท่อของพวกมัน — เป็นข้อได้เปรียบที่สำคัญเมื่อเทียบกับลำเรือแข็งที่มีความยาวใกล้เคียงกัน
    - ความประหยัดน้ำมันมีความสำคัญต่อกิจกรรมตกปลา เนื่องจากต้นทุนการดำเนินงานส่งผลโดยตรงต่อความสามารถในการทำกำไร RIBs และเรือเป่าลมมีน้ำหนักเบากว่าเรือแข็งประเภทเดียวกัน ทำให้ต้องใช้กำลังน้อยลงและใช้น้ํามันน้อยลง — เป็นสิ่งสำคัญสำหรับผู้ประกอบการเชิงพาณิชย์ที่ใช้งานเรือทุกวัน และสหกรณ์ที่จัดการงบประมาณกองเรือ
    - ความทนทานในสภาพแวดล้อมทางทะเลเป็นสิ่งสำคัญ น้ำเกลือ, การสัมผัส UV และการใช้งานอย่างต่อเนื่องต้องการวัสดุที่สามารถทนต่อสภาพที่รุนแรงโดยไม่เสื่อมสภาพ สำหรับผู้ประกอบการเชิงพาณิชย์และความร่วมมือ ความน่าเชื่อถือมีผลโดยตรงต่อรายได้ — เรือที่พังหมายถึงวันทำการประมงที่สูญเสียไป
    - การตั้งค่าการตกปลา Paddle Board Overstock รวมถึงที่วางคันเบ็ด เครื่องค้นหาปลา บ่อเหยื่อ บ่อปลา และโซลูชันการจัดการสินค้าออกแบบมาสำหรับการใช้งานการตกปลาอย่างจริงจังทั้งในเชิงพาณิชย์ สหกรณ์ และการพักผ่อนหย่อนใจ
content_solution:
  tagline: โซลูชันของเรา
  title: การตั้งค่าพร้อมสำหรับการตกปลา
  subtitle: เรือประมงทุกลำสามารถปรับแต่งได้ตามการใช้งานประมงเฉพาะของคุณ
  list:
    - การติดตั้งที่ยึดคันเบ็ด — ติดตั้งจากโรงงานหรือพร้อมสำหรับการติดตั้งภายหลัง
    - แผ่นยึด Fishfinder/GPS ที่ตำแหน่งคอนโซล
    - ตัวเลือกบ่อเหยื่อหรือบ่อเก็บปลาแบบมีชีวิตสำหรับผู้ประกอบการเช่าเหมาลำและเชิงพาณิชย์
    - การจัดเก็บ/ตู้เย็นสำหรับการจัดการปลา
    - ตัวเรือแบบ Deep-V สำหรับความสามารถนอกชายฝั่ง — มีความมั่นคงขณะหยุดนิ่ง ลื่นไหลเมื่อเคลื่อนที่ด้วยความเร็ว
    - PVC ตัวเลือก OR Hypalon Tube — Hypalon สําหรับการUVเปิดรับแสงนาน
    - ขนาดเครื่องยนต์นอกเรือมีตั้งแต่ 15 HP ถึง 115 ขึ้นอยู่กับHPรุ่นและการใช้งาน
content_segments:
  tagline: โปรไฟล์การตกปลา
  title: โซลูชันเรือประมงเป่าลม<br />ตามประเภทโอเปอเรเตอร์
  subtitle: ตั้งแต่การตกปลากีฬาในชายฝั่งไปจนถึงการจับสายยาวเชิงพาณิชย์ — การประมงแต่ละประเภทต้องการรูปแบบตัวเรือ ช่วงกําลัง และการตั้งค่าบนดาดฟ้าที่แตกต่างกันเราปรับแต่งเรือทุกลําให้เหมาะกับการประมง น้ํา และรูปแบบการทํางาน
  items:
    - title: บริษัทประมงเชิงพาณิชย์
      subtitle: เรือทํางานสําหรับปฏิบัติการประมงประจําวัน การจัดการอวน การขนส่งจับปลา
      description: บริษัทประมงเชิงพาณิชย์ใช้เรือทํางานสําหรับการตั้งและเก็บอวน การบริการดักจับ การวางสายยาว และการขนส่งปลาเรือเหล่านี้ทํางานทุกวันในสภาพแวดล้อมน้ําเค็ม และต้องทนต่อน้ําหนักมาก การจัดการดาดฟ้าอย่างต่อเนื่อง และชั่วโมงการทํางานที่ยาวนานประสิทธิภาพการใช้เชื้อเพลิงและการบํารุงรักษาต่ําเป็นสิ่งสําคัญต่อความสามารถในการทํากําไรของกองเรือเรือต้องมีแพลตฟอร์มทํางานที่มั่นคงสําหรับลูกเรือในการจัดการอุปกรณ์และการจับปลาในสภาพทะเลที่แตกต่างกัน
      features:
        - การจัดวางดาดฟ้าเรียบสําหรับการจัดการอวน การวางกับดัก และการเก็บปลา
        - เครื่องยนต์นอกเรือ 40-115 ลิตรประหยัดน้ํามัน HP เพื่อต้นทุนการดําเนินงานรายวันต่ํา
        - Hypalon ท่อทนทานสําหรับการใช้งานประจําวัน ทนต่อการขีดข่วน
        - แผ่นรองเสริมความแข็งแรงสําหรับการสัมผัสท่าเรือและเรือบ่อยครั้ง
        - พื้นระเบียงแบบน้ําลอยอัตโนมัติ เพื่อการล้างล้างหลังการใช้งานที่ง่าย
        - การกําหนดราคากองเรือและข้อกําหนดที่สอดคล้องกันสําหรับผู้ประกอบการเรือหลายลํา
    - title: ผู้ประกอบการเช่าเหมาลําการประมง
      subtitle: ความสะดวกสบายสําหรับผู้โดยสารหลายคน การจัดการจับ และได้รับการรับรองความปลอดภัย
      description: ผู้ประกอบการที่ให้บริการเช่าเหมาลําตกปลาครึ่งวันและเต็มวัน — ตั้งแต่การตกปลาแนวปะการังใกล้ชายฝั่งไปจนถึงตกปลานอกชายฝั่งเรือของคุณต้องมีที่นั่งสําหรับผู้โดยสารที่ได้รับการรับรองความปลอดภัย พื้นที่ดาดฟ้ากว้างขวางสําหรับนักตกปลาหลายคน และมีช่องเก็บเหยื่อแบบบูรณาการเพื่อรักษาความสดของเหยื่อและปลาตลอดการเดินทางความสะดวกสบายของแขกส่งผลโดยตรงต่อรีวิวทริป การจองซ้ํา และการจัดอันดับออนไลน์
      features:
        - พวงมาลัยคอนโซลพร้อมเบาะบัคเก็ตดูดซับแรงกระแทก
        - ที่ยึดคันเบ็ดติดตั้งจากโรงงาน (4–8 ตําแหน่ง)
        - ระยะ 60–115 ช่องสําหรับHPความเร็วล่องเรือนอกชายฝั่ง
        - CE การรับรองประเภท C หรือ B สําหรับการให้บริการผู้โดยสารเชิงพาณิชย์
        - ร่มกันแดดบิมินี่หรือแบบที-ท็อปเพื่อความสบายของแขกในการเดินทางไกล
    - title: ชาวประมงเชิงพาณิชย์ทั้งแบบช่างฝีมือและขนาดเล็ก
      subtitle: เรือทํางานที่เชื่อถือได้สําหรับการดํารงชีวิตประจําวัน
      description: ชาวประมงอิสระที่พึ่งพาเรือเป็นแหล่งรายได้หลัก — วางอวน ดูแลกับดักปลา หรือจับเรือใกล้ฝั่งความสําคัญของคุณคือประหยัดน้ํามัน การบํารุงรักษาง่าย ๆ ที่คุณสามารถทําได้เอง และเรือที่จัดการปลาและอุปกรณ์ปริมาณปานกลางโดยไม่เสียความมั่นคง
      features:
        - เครื่องยนต์นอกเรือ 15–40 สูบประหยัดน้ํามัน เพื่อHPต้นทุนการดําเนินงานต่ํา
        - Hypalon CSM ท่อสําหรับความUVทนทานและการขีดข่วน
        - การจัดวางดาดฟ้าเรียบสําหรับการจัดการอวนและเก็บปลา
        - สามารถลงจอดบนชายหาดได้ง่ายด้วยระบบป้องกันกระดูกงูแบบเป่าลม
    - title: สหกรณ์ประมง
      subtitle: การเก็บรวบรวมการจับปลา การขนส่งสมาชิก การกระจายเสบียง
      description: สหกรณ์ประมงดําเนินกองเรือชุมชนเพื่อเก็บจับปลาจากสมาชิกชาวประมง ขนส่งเสบียงไปยังชุมชนประมงห่างไกล และแจกจ่ายผลผลิตไปยังตลาดเรือทํางานเหล่านี้ต้องการความจุบรรทุกสูง การดําเนินงานประจําวันที่เชื่อถือได้ และการบํารุงรักษาที่ง่ายในพื้นที่ห่างไกลสหกรณ์มักดําเนินงานในพื้นที่กําลังพัฒนาที่มีการจัดหาชิ้นส่วนและการเข้าถึงบริการจํากัด ทําให้การออกแบบเรือนอกเรือที่เรียบง่ายและการก่อสร้างที่ทนทานเป็นสิ่งจําเป็น
      features:
        - มีความสามารถในการบรรทุกสูงสําหรับการขนส่งปลาและเสบียง
        - การกําหนดค่าภายนอกที่เรียบง่ายเพื่อการบํารุงรักษาในสถานที่ได้ง่าย
        - ทั้งแบบทนทานPVCหรือHypalonโครงสร้างเพื่อความยืดหยุ่นด้านงบประมาณ
        - ดาดฟ้าเรียบพร้อมจุดผูกสําหรับยึดสินค้า
        - การดําเนินงานที่ประหยัดน้ํามัน ลดต้นทุนการดําเนินงานร่วมกัน
    - title: ผู้ที่ชื่นชอบกีฬาและการตกปลา
      subtitle: ประสิทธิภาพและสไตล์สําหรับนักตกปลาตัวจริง
      description: นักตกปลาที่มีประสบการณ์กําลังมองหาแพลตฟอร์มตกปลาที่มีประสิทธิภาพ ซึ่งให้ความเร็วไปยังพื้นที่ไกล ท่าต่อสู้ยืนที่มั่นคง และฟิตแอนด์ฟิตระดับพรีเมียมเรือต้องรู้สึกเหมือนอยู่บ้านไม่ว่าจะแล่นห่างจากฝั่งสองไมล์ไปยังแนวปะการัง หรือสํารวจแหล่งน้ําห่างไกลในปากแม่น้ํา
      features:
        - ตัวถังดีพวี RIB เพื่อการขับขี่ที่นุ่มนวลในคลื่น
        - แผ่นติดตั้ง Fishfinder/GPS ที่เดินสายล่วงหน้าที่คอนโซล
        - ช่องเก็บเหยื่อและคูลเลอร์ที่รวมอยู่ในโมดูลเบาะหลัง
        - EVA ตัวเลือกสีดาดฟ้าแบบกําหนดเองที่เข้ากับกราฟิกเรือ/ท่อ
    - title: ไกด์ตกปลาและผู้ประกอบการทัวร์เชิงนิเวศ
      subtitle: ประสบการณ์ตกปลาพร้อมไกด์สําหรับนักตกปลาที่มาเยือน
      description: ไกด์ที่พากลุ่มนักตกปลาขนาดเล็กไปยังจุดตกปลาที่มีประโยชน์ — มักผสมผสานการตกปลากับองค์ประกอบการท่องเที่ยวเชิงนิเวศ เช่น การดูนกหรือการสํารวจป่าชายเลนเรือต้องแล่นแบบแห้งและสบายสําหรับแขกที่ไม่คุ้นเคยกับเรือเล็ก พร้อมตัวเลือกบอร์ดและร่มเงาที่ง่าย
      features:
        - จุดติดตั้งบนบิมินิหรือทีท็อปติดตั้งจากโรงงาน
        - บันไดขึ้นเรือแบบเรียบเนียน ช่วยให้ขึ้นเรือกลับได้ง่าย
        - เครื่องยนต์นอก 4 จังหวะเงียบ ลดการรบกวน
        - ช่องเก็บของแห้งสําหรับโทรศัพท์แขก กระเป๋าสตางค์ กล้อง
cta:
  title: ติดตั้งเรือประมงของคุณ
  subtitle: ติดต่อเราพร้อมใบสมัครตกปลา ชนิดปลาเป้าหมาย และน่านน้ําที่ใช้ในการประมง — เราจะแนะนําการตั้งค่าที่เหมาะสม
  actions:
    - variant: primary
      text: ปรับแต่งเรือประมงของคุณ
      href: /contact
    - text: ดูผลิตภัณฑ์ทางทะเล
      href: /products
