  title: ต้องการตรวจสอบข้อมูลรับรองของเราหรือไม่?
  subtitle: ติดต่อเราสำหรับสำเนาใบรับรอง รายงานการตรวจสอบจากบุคคลที่สาม หรือเพื่อนัดหมายการเยี่ยมชมโรงงาน
  actions:
