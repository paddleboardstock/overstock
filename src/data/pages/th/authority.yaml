features3_brand:
  tagline: เราเป็นใคร
  title: รากฐานของแบรนด์<br />& มรดก
  subtitle: เรื่องราว ความเชี่ยวชาญ และการเข้าถึงระดับโลกที่เป็นตัวกำหนด Paddle Board Overstock ให้เป็นผู้ผลิตอุปกรณ์ทางทะเลที่น่าเชื่อถือ
  isBeforeContent: false
  columns: 3
  items:
    - title: เกี่ยวกับ Paddle Board Overstock
      description: ก่อตั้งขึ้นในปี 2012 ที่ชิงเต่า ประเทศจีน จากเวิร์กช็อปริมชายฝั่งสู่โรงงานขนาด 12,000 ตารางเมตร — เรื่องราวทั้งหมดของ Paddle Board Overstock
      icon: tabler:building-factory
      link: /about
    - title: เรื่องราวของแบรนด์
      description: วิธีที่ทีมวิศวกรทางทะเลเริ่มต้นในการทำให้เรือลอยน้ำแบบเป่าลมระดับมืออาชีพสามารถเข้าถึงได้ทั่วโลก
      icon: tabler:book
      link: /brand-story
    - title: ความเชี่ยวชาญด้านอุตสาหกรรมทางทะเล
      description: วัสดุศาสตร์เชิงลึก การผลิตที่แม่นยำ และการทดสอบในโลกจริง — หลายทศวรรษของวิศวกรรมทางทะเลในทุกลำเรือ
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: การมีอยู่ทั่วโลก
      description: ให้บริการกว่า 50+ ประเทศทั่วทุกทวีป มีความเชี่ยวชาญในภูมิภาคสำหรับข้อกำหนดด้านกฎระเบียบท้องถิ่นและความชอบของตลาด
      icon: tabler:globe
      link: /brand-global-presence
    - title: ทำไม Paddle Board Overstock
      description: สิ่งที่ทำให้เราแตกต่าง — คุณภาพ การปรับแต่ง ราคาจากโรงงานโดยตรง และการสนับสนุนแบบครบวงจรสำหรับผู้ประกอบการเชิงพาณิชย์
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: ทีมของเรา
      description: พบกับผู้นำ — วิศวกรทางทะเล นักวิทยาศาสตร์วัสดุ และผู้เชี่ยวชาญด้านการผลิตที่ขับเคลื่อน Paddle Board Overstock ไปข้างหน้า
      icon: tabler:users
      link: /brand/team
    - title: ทีมวิศวกรรม
      description: 78+ ปีรวมของการวิจัยและพัฒนา, 40+ แพลตฟอร์ม, 12 การรับรอง, 1200+ OEM โครงการ ทีมเทคนิคเบื้องหลังทุกผลิตภัณฑ์
      icon: tabler:engine
      link: /engineering-team
    - title: ศูนย์วิจัยและพัฒนา
      description: วิศวกรรมตัวถัง การเชื่อม RF ห้องปฏิบัติการ PVC การสร้างต้นแบบ ถังทดสอบ และห้องปฏิบัติการคุณภาพ — ศูนย์วิจัยและพัฒนาครบวงจรของเรา
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: ความไว้วางใจและคุณภาพ
  title: การรับรอง, คุณภาพ<br />& พิสูจน์
  subtitle: การรับรองอิสระ การทดสอบที่เข้มงวด และหลักฐานจริงที่แสดงถึงความมุ่งมั่นของเราต่อคุณภาพ
  isBeforeContent: false
  columns: 3
  items:
    - title: ใบรับรอง
      description: CE, ISO 9001, UKCA, BSCIREACH , — เอกสารรับรองครบถ้วนและการปฏิบัติตามข้อกําหนดสําหรับตลาดโลก
      icon: tabler:shield-check
      link: /certifications
    - title: คุณภาพและการทดสอบ
      description: ทุกผลิตภัณฑ์ผ่านการทดสอบแรงดันก่อนจัดส่งความแข็งแรงของรอยต่อ UV ความต้านทาน และการลอยตัว — ได้รับการตรวจสอบในทุกขั้นตอน
      icon: tabler:clipboard-check
      link: /quality
    - title: หลักฐาน & การพิสูจน์
      description: ผลการทดสอบ ภาพถ่ายการติดตั้ง รายงานการตรวจสอบจากบุคคลที่สาม และกรณีศึกษาที่ยืนยันPaddle Board Overstockคุณภาพ
      icon: tabler:file-check
      link: /evidence
    - title: กราฟความรู้
      description: สํารวจPaddle Board Overstockกราฟเอนทิตี — ผลิตภัณฑ์ เทคโนโลยี การรับรอง และความสัมพันธ์ในฐานความรู้ที่เชื่อมต่อกัน
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: ผู้นํา
  title: พบกับทีมงาน<br />ด้านหลังPaddle Board Overstock
  subtitle: ความเชี่ยวชาญในอุตสาหกรรมที่ครอบคลุมด้านวิศวกรรมทางทะเล วิทยาศาสตร์วัสดุ การจัดการคุณภาพ และB2Bการค้าระหว่างประเทศ
  isBeforeContent: false
  columns: 3
  items:
    - title: โทบี้ หลิว — ผู้ก่อตั้งและซีอีโอ
      description: 15+ ปีในสายการผลิตทางทะเลเคยเป็นหัวหน้าฝ่ายวิจัยและพัฒนาที่ผู้ผลิตเรือรายใหญ่ของจีนถือสิทธิบัตรหลายฉบับในการออกแบบเรือเป่าลม
      icon: tabler:crown
    - title: จางเหว่ย — หัวหน้าวิศวกร
      description: 20+ ปีในPVCHypalonสายการผลิตและการออกแบบตัวเรือ Deep-V อดีตผู้อํานวยการฝ่ายเทคนิคที่บริษัทวิศวกรรมทางทะเลในยุโรป
      icon: tabler:engine
    - title: เฉิน หมิง — หัวหน้าฝ่ายวิจัยและพัฒนา
      description: ปริญญาเอกด้านวิทยาศาสตร์วัสดุเชี่ยวชาญด้านdrop-stitchเทคโนโลยีและการเชื่อมความถี่สูงมีประสบการณ์ 10+ ปีในงานคอมโพสิตสิ่งทอ
      icon: tabler:flask
    - title: หลิวเฉียง — ผู้อํานวยการฝ่ายผลิต
      description: 18+ ปีในสายการผลิตแบบลีนสายดํา Six Sigma ติดตั้งISOระบบคุณภาพ 9001 ในทุกสายการผลิต
      icon: tabler:settings
    - title: หวัง ฟาง — ผู้จัดการคุณภาพ
      description: มีประสบการณ์ 12+ ปีในการควบคุมคุณภาพทางทะเลได้รับการรับรองCEและISOตรวจสอบบัญชีดูแลการทดสอบสําหรับทุกล็อตการผลิต
      icon: tabler:shield-check
    - title: เฮเลน ลี — ผู้อํานวยการฝ่ายขาย
      description: 15+ ปีในB2Bการค้าระหว่างประเทศบริหารOEM/ODMร่วมมือใน 30+ ประเทศพูดได้คล่อง 4 ภาษา
      icon: tabler:briefcase
