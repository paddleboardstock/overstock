hero:
  tagline: ศูนย์อำนาจ
  title: ทำไม Paddle Board Overstock?<br />ความไว้วางใจที่สร้างขึ้นมากว่าทศวรรษ
  subtitle: ทุกคณะบอร์ดที่เราสร้างขึ้นแบกรับน้ำหนักของประสบการณ์วิศวกรรมทางทะเล 10+ ปี การควบคุมคุณภาพอย่างเข้มงวด และนักพายเรือหลายพันคนทั่วโลก นี่คือเหตุผลที่นักพายเลือก Paddle Board Overstock
  image:
