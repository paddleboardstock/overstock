features3_brand:
  tagline: เราเป็นใคร
  title: รากฐานของแบรนด์<br />& มรดก
  subtitle: เรื่องราว ความเชี่ยวชาญ และการเข้าถึงทั่วโลกที่ทำให้ Paddle Board Overstock เป็นแบรนด์ SUP ที่น่าเชื่อถือ
  isBeforeContent: false
  columns: 3
  items:
    - title: เกี่ยวกับ Paddle Board Overstock
      description: ก่อตั้งในปี 2012 ที่ Weihai ประเทศจีน จากเวิร์กช็อปริมชายฝั่งสู่สิ่งอำนวยความสะดวกขนาด 12,000 ตร.ม. — เรื่องราวครบถ้วนของ Paddle Board Overstock
      icon: tabler:building-factory
      link: /about
    - title: เรื่องราวของแบรนด์
      description: วิธีที่ทีมวิศวกรทางทะเลออกแบบเพื่อให้กระดานพายลมระดับมืออาชีพเข้าถึงได้ทั่วโลก
      icon: tabler:book
      link: /brand-story
    - title: ความเชี่ยวชาญด้านอุตสาหกรรมทางทะเล
      description: วิทยาศาสตร์วัสดุลึก การผลิตที่แม่นยำ และการทดสอบในโลกจริง — ทศวรรษของวิศวกรรมทางทะเลในทุกคณะบอร์ด
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: ทำไม Paddle Board Overstock
      description: สิ่งที่ทำให้เราแตกต่าง — คุณภาพ การปรับแต่ง ราคาโดยตรงจากโรงงาน และการสนับสนุนครบวงจรสำหรับนักพายทุกคน
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: ทีมของเรา
      description: พบกับผู้บริหาร — วิศวกรทางทะเล นักวิทยาศาสตร์วัสดุ และผู้เชี่ยวชาญด้านการผลิต ที่ขับเคลื่อน Paddle Board Overstock ไปข้างหน้า
      icon: tabler:users
      link: /brand/team
    - title: ทีมวิศวกรรม
      description: 78+ ปีรวมของงานวิจัยและพัฒนา, 40+ แพลตฟอร์ม, 1,200+ โครงการวิศวกรรม ทีมเทคนิคเบื้องหลังทุกผลิตภัณฑ์
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: ความไว้วางใจและคุณภาพ
  title: คุณภาพ การทดสอบ<br />& พิสูจน์
  subtitle: การทดสอบอย่างเข้มงวด ข้อมูลทดสอบจริง และหลักฐานที่แสดงถึงความมุ่งมั่นของเราในคุณภาพ
  isBeforeContent: false
  columns: 3
  items:
    - title: คุณภาพและการทดสอบ
      description: ทุกผลิตภัณฑ์ผ่านการทดสอบแรงดันก่อนจัดส่งความแข็งแรงของรอยต่อ UV ความต้านทาน และการลอยตัว — ได้รับการตรวจสอบในทุกขั้นตอน
      icon: tabler:clipboard-check
      link: /quality
    - title: หลักฐาน & การพิสูจน์
      description: ผลการทดสอบ รูปถ่ายการติดตั้ง รายงานการตรวจสอบจากบุคคลที่สาม และกรณีศึกษา ยืนยันคุณภาพของ Paddle Board Overstock
      icon: tabler:file-check
      link: /evidence
    - title: กราฟความรู้
      description: สำรวจกราฟเอนทิตี Paddle Board Overstock — ผลิตภัณฑ์ เทคโนโลยี วัสดุ และความสัมพันธ์ในฐานความรู้ที่เชื่อมโยงกัน
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: ผู้นํา
  title: พบกับทีมงาน<br />เบื้องหลัง Paddle Board Overstock
  subtitle: ความเชี่ยวชาญในอุตสาหกรรมที่ครอบคลุมวิศวกรรมทางทะเล วิทยาศาสตร์วัสดุ การจัดการคุณภาพ และอีคอมเมิร์ซระดับโลก
  isBeforeContent: false
  columns: 3
  items:
    - title: โทบี้ หลิว — ผู้ก่อตั้งและซีอีโอ
      description: 15+ ปีในอุตสาหกรรมการผลิตทางทะเล เคยเป็นหัวหน้าฝ่ายวิจัยและพัฒนาที่ผู้ผลิตทางทะเลรายใหญ่ของจีน ถือสิทธิบัตรหลายรายการในการออกแบบผลิตภัณฑ์เป่าลม
      icon: tabler:crown
    - title: จางเหว่ย — หัวหน้าวิศวกร
      description: 20+ ปีในด้านการผลิตโพลิเมอร์และการออกแบบโครงสร้างเป่าลม เคยเป็นผู้อำนวยการฝ่ายเทคนิคที่บริษัทวิศวกรรมทางทะเลในยุโรป
      icon: tabler:engine
    - title: เฉิน หมิง — หัวหน้าฝ่ายวิจัยและพัฒนา
      description: ปริญญาเอกด้านวิทยาศาสตร์วัสดุเชี่ยวชาญด้านdrop-stitchเทคโนโลยีและการเชื่อมความถี่สูงมีประสบการณ์ 10+ ปีในงานคอมโพสิตสิ่งทอ
      icon: tabler:flask
    - title: หลิวเฉียง — ผู้อํานวยการฝ่ายผลิต
      description: 18+ ปีในการผลิตแบบลีน นำระบบคุณภาพเข้มงวดไปใช้ในทุกสายการผลิต
      icon: tabler:settings
    - title: หวัง ฟาง — ผู้จัดการคุณภาพ
      description: 12+ ปีในการควบคุมคุณภาพทางทะเล เป็นผู้นำการตรวจสอบคุณภาพภายใน ควบคุมการทดสอบสำหรับทุกล็อตการผลิต
      icon: tabler:shield-check
    - title: เฮเลน ลี — ผู้อํานวยการฝ่ายขาย
      description: 15+ ปีในด้านพาณิชย์อิเล็กทรอนิกส์ระหว่างประเทศและโลจิสติกส์ ส่งกระดานถึงผู้พายใน 50+ ประเทศ พูดได้คล่อง 4 ภาษา
      icon: tabler:briefcase
cta:
  title: ต้องการหลักฐานคุณภาพของเราไหม?
  subtitle: ติดต่อเราเพื่อขอรายงานการทดสอบ บันทึกการตรวจสอบ หรือเพื่อนัดหมายเยี่ยมชมโรงงาน
  actions:
    - variant: primary
      text: ขอเอกสาร
      href: /contact
