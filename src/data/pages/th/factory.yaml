hero:
  tagline: โรงงาน
  title: โรงงานและการผลิต
  subtitle: พื้นที่การผลิตรวม 12,000 ตารางเมตร — จากวัตถุดิบจนถึงเรือสำเร็จรูป
intro:
  - ในฐานะแบรนด์โรงงานของ **Aquafarer ศูนย์การผลิตชิงเต่า** Aquafarer ควบคุมทุกขั้นตอนของการผลิต — ตั้งแต่การรับวัสดุ PVC และไฟเบอร์กลาส จนถึงการตรวจสอบก่อนส่งมอบเรือสำเร็จรูป โรงงานของเราที่เขตพัฒนาเศรษฐกิจชิงเต่ามีพื้นที่ 12,000 ตารางเมตร และมีเวิร์กช็อปเฉพาะสำหรับการตัด PVC การปิดผนึกท่อด้วยความร้อน การผลิตตัวถังไฟเบอร์กลาส RIB การพิมพ์ดิจิทัล SUP การประกอบขั้นสุดท้าย และการทดสอบคุณภาพ
  - ด้วยการรวมการออกแบบ วิศวกรรม การสร้างต้นแบบ การผลิต และการทดสอบไว้ภายใต้หลังคาเดียวกัน เราจะขจัดความไม่มีประสิทธิภาพของการผลิตตามสัญญาและรักษาการควบคุมโดยตรงต่อคุณภาพของการก่อสร้าง การเลือกวัสดุ และกำหนดการส่งมอบ เรือทุกลำที่ออกจากเวิร์กช็อปของเราสร้างโดยทีมงานของเรา บนเครื่องมือของเรา ตามมาตรฐานของเรา
