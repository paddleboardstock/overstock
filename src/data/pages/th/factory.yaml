qc_section:
  tagline: การควบคุมคุณภาพ
  title: กระบวนการทดสอบและประกันคุณภาพ
  subtitle: เรือทุกลําต้องผ่านการทดสอบที่จําเป็นก่อนจัดส่งห้องปฏิบัติการคุณภาพของเราทํางานอย่างอิสระจากฝ่ายผลิตและรายงานตรงต่อฝ่ายบริหาร
  steps:
    - step: '1'
      title: การตรวจสอบวัตถุดิบ
      desc: PVCHypalon, , , และdrop-stitchผ้าต้องผ่านการทดสอบแรงดึง (ASTM D751), การขยายตัวของการฉีกขาด และUVการตรวจสอบความต้านทานก่อนที่ชุดผ้าจะเข้าสู่การผลิต
    - step: '2'
      title: การทดสอบการกักเก็บอากาศ 48 ชั่วโมง
      desc: แต่ละห้องท่อจะถูกเติมลมถึง 125% ของแรงดันที่กําหนดและเก็บไว้เป็นเวลา 48 ชั่วโมงแรงดันตกคร่อมเกิน 5% จะกระตุ้นให้มีการปฏิเสธอัตโนมัติและตรวจสอบรอยต่อใหม่
    - step: '3'
      title: การทดสอบโหลดและสมดุล
      desc: เรือที่เสร็จสมบูรณ์จะถูกบรรทุกจนเต็มความจุที่กําหนดและทดสอบความมั่นคง ความลึกของลําเรือ และการควบคุมเรือแต่ละลําจะถูกทดสอบน้ําก่อนการตรวจสอบขั้นสุดท้าย
oem_section:
  tagline: OEM โครงการ
  title: OEM กรณีศึกษาแบรนด์และความร่วมมือ
  subtitle: ตั้งแต่แนวคิดสู่ตู้คอนเทนเนอร์ — วิธีที่เราช่วยแบรนด์ระดับโลกเปิดตัวและขยายไลน์เรือเป่าลมของพวกเขา
  cases:
    - challenge: ผู้ค้าปลีกกลางแจ้งในยุโรปต้องการไลน์สินค้าแบรนด์ส่วนตัวSUPที่มีกราฟิกระเบียงที่เป็นเอกลักษณ์ บรรจุภัณฑ์เป็นมิตรกับสิ่งแวดล้อม PVCและพร้อมจําหน่าย — ทั้งหมดนี้จัดส่งภายใน 60 วัน
      solution: พัฒนาไฟล์พิมพ์ดิจิทัลแบบกําหนดเอง การREACHสุ่มตัวอย่างแบบ -compliant PVCและแบบบีบอัดจาก 3 รอบเป็น 1 รอบ โดยร่วมทีมออกแบบที่โรงงานชิงเต่าของเรา
      result: 55 วันจากวันที่ลงนามถึง FOB.2,400 หน่วยใน 4 SKU สั่งซื้อซ้ําก่อนที่ตู้คอนเทนเนอร์แรกจะมาถึง
    - challenge: สตาร์ทอัพกีฬาทางน้ําของสหรัฐฯ ต้องการเรือคายัคสมรรถนะสูงdrop-stitchที่มีรูปทรงตัวเรือแบบสั่งทํา บรรจุภัณฑ์ร่วมแบรนด์ และBSCIการรับรองสําหรับการวางขายในร้านค้าปลีก
      solution: ปรับdrop-stitchแม่พิมพ์เรือคายัคที่มีอยู่ให้ปรับรูปทรงโยก พัฒนางานศิลปะบรรจุภัณฑ์ร่วมแบรนด์ และจัดทําBSCIเอกสารตรวจสอบอย่างครบถ้วน
      result: จดทะเบียนสําเร็จในเครือร้านค้ากลางแจ้งใหญ่ 3 แห่งในสหรัฐฯปีแรกขายได้ 5,000+ ยูนิต ด้วยอัตราขาย 98%
    - challenge: ผู้จัดจําหน่ายในออสเตรเลียต้องการCEชุดผลิตภัณฑ์ที่ได้รับการรับรอง - RIB พร้อมสีหลอดแบบกําหนดเอง Hypalon ตัวเลือกการอัปเกรด และเป็นไปตามมาตรฐานออสเตรเลีย AS 1799
      solution: ผลิตตัวอย่างก่อนการผลิตที่มีหลอดสี 4 แบบ จัดหาCSM Hypalon จากซัพพลายเออร์ญี่ปุ่น และประสานงานการทดสอบความสอดคล้องกับ AS 1799 ของบุคคลที่สาม
      result: เปิดตัวกลุ่ม 3 รุ่นRIBในตลาด AU/นิวซีแลนด์ตามมาด้วยการชนะการประมูลของรัฐบาลสําหรับรถลาดตระเวน 12 คันRIBs
faq_section:
  tagline: คําถามที่พบบ่อย
  title: B2B & OEM คําถามที่พบบ่อย
  questions:
    - q: ปริมาณขั้นต่ําในการสั่งซื้อ (MOQ) สําหรับOEMแผ่นเป่าลมคือเท่าSUPไร?
      a: เริ่มต้นที่ MOQ 5–10 ชิ้นสําหรับOEMรุ่นมาตรฐานแม่พิมพ์สั่งทําพิเศษและโครงการแบรนด์ส่วนตัวต้องการอย่างน้อย 200 ชิ้น ขึ้นอยู่กับความซับซ้อนมีคําสั่งทดลองและการผลิตตัวอย่างสําหรับการเปิดตัวแบรนด์ใหม่
    - q: มีAquafarer BSCI ใบรับรองหรือไม่?
      a: ใช่โรงงานของเรามีBSCIใบรับรองการปฏิบัติตามกฎหมายสังคมที่ถูกต้อง (รายงานการตรวจสอบสามารถขอได้)เรายังมีใบรับรอง ISO 9001:2015 สําหรับการจัดการคุณภาพ และ 64 รุ่นผลิตภัณฑ์ของเรามีCEใบรับรอง (TÜVRheinland)REACHและRoHSเอกสารการปฏิบัติตามข้อกําหนดที่จัดเตรียมไว้กับทุกOEMการจัดส่ง
    - q: ระยะเวลาจัดส่งโดยปกติสําหรับคําสั่งซื้อคือเท่าไรOEM?
      a: เวลาการผลิตมาตรฐานคือ 30–45 วันนับจากการสั่งซื้อที่ยืนยันแล้วและการวางมัดจำ การพัฒนาแม่พิมพ์แบบกำหนดเองเพิ่มเวลา 15–20 วันสำหรับการทำเครื่องมือ เรามีบริการผลิตด่วนสำหรับคำสั่งซื้อเร่งด่วนและช่วงเร่งด่วนตามฤดูกาลในช่วงก่อนฤดูร้อน (ม.ค.–มี.ค.)
    - q: คุณสามารถจัดส่ง FOB ชิงเต่า หรือ CIF ไปยังท่าเรือของเราได้หรือไม่?
      a: ใช่ เราจัดส่งไปยัง FOB ชิงเต่า, CIF พอร์ตหลักระดับโลก, และ DDP สำหรับพันธมิตรที่มีคุณสมบัติ ทีมโลจิสติกส์ของเราดูแลการจองตู้คอนเทนเนอร์, เอกสารการส่งออก, และการผ่านพิธีการศุลกากร เราจัดส่งไปยัง 50+ ประเทศทั่วทั้งตลาดยุโรป, สหรัฐอเมริกา, ออสเตรเลีย, และเอเชีย
b2b_moq: 'มาตรฐาน MOQ: 5–10 หน่วยต่อรุ่น (SUP/คายัค/drop-stitch) RIB MOQ: 2–5 หน่วย ยินดีต้อนรับคำสั่งทดลองสำหรับความร่วมมือใหม่'
production_flow:
  tagline: กระบวนการผลิต
  title: จากวัสดุสู่เรือสำเร็จรูป
  subtitle: ทุกเรือผ่านกระบวนการผลิต 6 ขั้นตอนโดยมีจุดตรวจคุณภาพ (QC) ในทุกขั้นตอน ไม่มีทางลัด ไม่มีการข้ามการตรวจสอบ
  stages:
    - stage: '01'
      title: การรับวัสดุและการตรวจสอบคุณภาพขาเข้า
      description: วัสดุทั้งหมดที่เข้ามาจะถูกบันทึกตามหมายเลขล็อต/ชุดในระบบ ERP ของเรา ม้วนผ้า PVC แกน drop-stitch วาล์ว กาว และฮาร์ดแวร์จะถูกกักกันจนกว่าจะได้รับการอนุมัติจาก QC
      qc_check: ความต้านแรงดึง (ASTM D751), ความต้านทานการฉีกขาด (ISO 4674), เกจวัดความหนา, ความหนืดของกาว, การตรวจหาข้อบกพร่องด้วยสายตา
      qc_threshold: ทดสอบชุดตัวอย่าง 100% ปฏิเสธหากความตึงน้อยกว่า 90% ของสเปค การฉีกขาดต่ำกว่าค่าต่ำสุดของสเปค หรือมีข้อบกพร่องทางสายตาใด ๆ
      responsibility: ทีม QC ขาเข้าจำนวน 3 ผู้ตรวจสอบ
    - stage: '02'
      title: CNC การตัดและการเตรียมวัสดุ
      description: การจัดวางแบบเนสติ้งที่ปรับแต่งสำหรับคอมพิวเตอร์จะวางแผงบนวัสดุ PVC เพื่อลดของเสีย เครื่องตัด CNC อัตโนมัติรักษาความแม่นยำตำแหน่ง 0.1 มม.
      qc_check: ตรวจสอบขนาดเทียบกับไฟล์ CAD DXF, ตรวจสอบคุณภาพขอบ, ตรวจสอบจำนวนแผง
      qc_threshold: วัดทุกแผงที่ 20 ความคลาดเคลื่อน ±0.5 มม. ปฏิเสธชุดถ้ามากกว่า 2% นอกขอบเขตความคลาดเคลื่อน
      responsibility: หัวหน้าการประชุมเชิงปฏิบัติการตัด
    - stage: '03'
      title: การเชื่อม & การยึดติด Drop-Stitch
      description: แกน Drop-stitch ถูกยึดติดกับแผ่นชั้นนอก PVC โดยใช้การลามิเนตความร้อน ห้องท่อเชื่อมด้วย RF หรือการเชื่อมด้วยอากาศร้อน แถบรางเชื่อมติดเป็นชั้นสามชั้น
      qc_check: การทดสอบปอกทุก 50 หน่วย (ASTM D751), การวัดความกว้างรอยเชื่อม, การตรวจสอบบันทึกอุณหภูมิอากาศร้อน, การตรวจสอบรอยต่อด้วยสายตาภายใต้แสงด้านหลัง
      qc_threshold: ความแข็งแรงการลอกอย่างน้อย 8 N/cm ความคลาดเคลื่อนความกว้างการเชื่อม ±1 มม. หากพบร่องที่มองเห็นได้ = ปฏิเสธ
      responsibility: การตรวจสอบคุณภาพการเชื่อม (ผู้ตรวจสอบ 2 คนต่อกะ)
    - stage: '04'
      title: การประกอบและการติดตั้งเครน
      description: 'เรือถูกเคลื่อนย้ายไปยังการประกอบขั้นสุดท้ายซึ่งชิ้นส่วนทั้งหมดถูกประกอบเข้าด้วยกัน: ตัวเรือ + ท่อ วาล์วที่ติดตั้งแล้ว D-ring มือจับ กล่องครีบ และการติดตั้งกระเป๋าสะพาย แต่ละหน่วยถูกตรวจสอบตามรายการตรวจสอบการประกอบ 100 จุด'
      qc_check: การตรวจสอบตามรายการตรวจสอบ 100 จุดต่อหน่วย การทดสอบการทำงานของวาล์ว (10 รอบเปิด/ปิด) การตรวจสอบแรงบิดของอุปกรณ์ ฮาร์ดแวร์ การตรวจสอบด้วยสายตา
      qc_threshold: 'นโยบายศูนย์ข้อบกพร่องสำหรับชิ้นส่วนที่มีความสำคัญต่อความปลอดภัย (วาล์ว, D-ring, มือจับ) ความบกพร่องเล็กน้อยด้านความสวยงาม: AQL 2.5 (ISO 2859)'
      responsibility: หัวหน้าทีมประกอบ + ตรวจสอบคุณภาพสาย
    - stage: '05'
      title: การทดสอบแรงดันและการควบคุมคุณภาพ
      description: ทุกห้องถูกเติมลมจนถึงความดัน 1.25× ความดันที่กำหนด (โดยปกติ 20–25 PSI) และคงไว้นาน 24–48 ชั่วโมง เซ็นเซอร์วัดความดันบันทึกอย่างต่อเนื่อง ห้องที่มีการลดลงของความดันเกิน 5% จะถูกปฏิเสธและส่งไปตรวจรอยต่อใหม่
      qc_check: บันทึกการถือความดัน 24 ชั่วโมง, ตรวจสอบการสอบเทียบเซนเซอร์ทุกวัน, การอ่านความดันที่ปรับตามอุณหภูมิ, ทดสอบรอยต่อใหม่หลังซ่อม
      qc_threshold: ความดันตกคร่อมสูงสุด 5% ภายใน 24 ชั่วโมงที่อุณหภูมิคงที่ห้องใดที่เกินค่านี้ = ทดสอบซ้ํา 100% ของชุดการผลิตทั้งหมด
      responsibility: ห้องปฏิบัติการคุณภาพ (ไม่ขึ้นกับการผลิต รายงานต่อฝ่ายบริหาร)
    - stage: '06'
      title: การตรวจสอบขั้นสุดท้ายและการบรรจุ
      description: การตรวจสอบด้วยสายตาและการใช้งานขั้นสุดท้ายข้อบกพร่องของพื้นผิว ความสม่ําเสมอของสี การตรวจสอบฉลาก/ถังขยะ ความสมบูรณ์ของบรรจุภัณฑ์ และความครบถ้วนของอุปกรณ์เสริมหน่วยต่าง ๆ ถูกบรรจุด้วยสุญญากาศ บรรจุกล่อง และจัดเรียงเป็นพาเลทสําหรับการบรรจุตู้คอนเทนเนอร์
      qc_check: การตรวจสอบด้วยสายตาอย่างครบถ้วน, รายการตรวจสอบอุปกรณ์เสริมSKU, ทดสอบการตกของบรรจุภัณฑ์ (1 เมตร, ตัวอย่างสุ่ม), ตรวจสอบการสแกนฉลาก/บาร์โค้ด
      qc_threshold: AQL 2.5 สําหรับข้อบกพร่องใหญ่, AQL 4.0 สําหรับข้อบกพร่องเล็กน้อยไม่ยอมรับข้อบกพร่องด้านความปลอดภัยตรวจสอบด้วยสายตา 100% ของยูนิต
      responsibility: ทีม QC สุดท้าย (ผู้ตรวจสอบ 4 คน) + หัวหน้าทีมบรรจุ
workforce:
  tagline: บุคลากรของเรา
  title: แรงงานและความเชี่ยวชาญ
  engineers: 25+
  engineers_detail: วิศวกรในสาขาวิจัยและพัฒนา การออกแบบแม่พิมพ์ ห้องปฏิบัติการวัสดุ และวิศวกรรมการผลิตมีประสบการณ์เฉลี่ย 7+ ปีในสายการผลิตเป่าลม
  shift_pattern: 2 กะ/วัน (07:00–15:30, 15:30–00:00)มีเวรกลางคืนเป็นทางเลือกสําหรับคําสั่งเร่งด่วน
  training: การฝึกอบรม QC รายเดือน การฝึกซ้อมความปลอดภัยรายไตรมาส และการประเมินทักษะประจําปีพนักงานใหม่ต้องผ่านการปฐมนิเทศ 40 ชั่วโมงก่อนเริ่มงานสายการผลิต
  departments:
    - name: การวิจัยและพัฒนา & วิศวกรรม
      count: 25+
      role: การออกแบบผลิตภัณฑ์ วิศวกรรมแม่พิมพ์ ห้องปฏิบัติการวัสดุ
    - name: การตัดและเตรียมวัสดุ
      count: 15
      role: CNC การตัด, การเตรียมแผง, การจัดการวัสดุ
    - name: การเชื่อมและเคลือบ
      count: 40
      role: การเชื่อม RF, การเชื่อมด้วยลมร้อน, drop-stitch การเชื่อมติด
    - name: RIB ตัวเรือ (FRP)
      count: 30
      role: ไฟเบอร์กลาสเคลือบชั้น, เจลโค้ท, ถุงสุญญากาศ
    - name: การประกอบและการติดตั้งเครน
      count: 35
      role: การประกอบขั้นสุดท้าย การติดตั้งฮาร์ดแวร์ การตรวจสอบระบบ
    - name: การควบคุมคุณภาพ
      count: 12
      role: คุณภาพคุณภาพที่เข้ามา, การตรวจสอบคุณภาพระหว่างกระบวนการ, การตรวจสอบขั้นสุดท้าย, การทดสอบในห้องปฏิบัติการ
    - name: โลจิสติกส์และบรรจุภัณฑ์
      count: 20
      role: บรรจุภัณฑ์ การโหลดตู้คอนเทนเนอร์ เอกสารส่งออก
    - name: การจัดการ & ผู้ดูแลระบบ
      count: 15
      role: ฝ่ายขาย การจัดซื้อ ทรัพยากรบุคคล การเงิน การปฏิบัติตามกฎระเบียบ
material_traceability:
  tagline: การตรวจสอบย้อนกลับ
  title: การติดตามวัสดุและการควบคุมชุดงาน
  description: แต่ละชุดวัตถุดิบจะได้รับหมายเลขล็อตเฉพาะในERPระบบของเราตั้งแต่การมาถึงจนถึงการผลิตจนถึงผลิตภัณฑ์สําเร็จรูป ใบสั่งวัสดุของแต่ละลําจะเชื่อมโยงกลับไปยังชุดสินค้าผู้จัดจําหน่ายเดิมสิ่งนี้ช่วยให้สามารถติดตามย้อนกลับได้อย่างสมบูรณ์สําหรับการสอบถามคุณภาพหรือการปฏิบัติตามข้อกําหนดใด ๆ
  system: ERP + แท็กแบตช์แบบกายภาพ (ภายในระบบ) แบบกําหนดเองในแต่ละคําสั่งงาน
  coverage: วัสดุการผลิต 100% — ผ้า PVC, Hypalon, drop-stitch, กาว, วาล์ว, ฮาร์ดแวร์, บรรจุภัณฑ์
  records_retained: 10 ปี (ตามข้อกำหนด CE 2013/53/EU)
  suppliers:
    - material: เกรดการใช้งานทางทะเล PVC
      source: ผู้จัดหาชาวจีนและเกาหลี
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: ผ้า Drop-stitch
      source: การทอภายในองค์กร + พันธมิตรภายนอก
      certified: การควบคุมคุณภาพภายใน + ซัพพลายเออร์ ISO 9001
    - material: วาล์ว & ฮาร์ดแวร์
      source: Chinese OEM suppliers
      certified: ISO 9001, ใบรับรองวัสดุต่อแต่ละล็อต
qc_dashboard:
  tagline: ควบคุมคุณภาพตามตัวเลข
  title: ตัวชี้วัดการควบคุมคุณภาพ
  subtitle: ข้อมูลผ่าน/ไม่ผ่านจริงจากสายการผลิตของเรา ห้องแล็บคุณภาพของเราทำงานอย่างอิสระจากการผลิตและรายงานตรงต่อผู้บริหาร
  stats:
    - value: 100%
      label: ชิ้นส่วนทดสอบแรงดัน
      detail: ทุกเรือ, ทุกห้อง, ทุกล็อต
    - value: <5%
      label: แรงดันตกสูงสุดที่อนุญาต
      detail: เกิน 24 ชั่วโมงที่แรงดัน 1.25× ของแรงดันกำหนด
    - value: AQL 2.5
      label: เกณฑ์ข้อบกพร่องหลัก
      detail: ตามมาตรฐานการสุ่มตัวอย่าง ISO 2859
    - value: 24–48h
      label: ระยะเวลาการคงแรงดัน
      detail: ขึ้นอยู่กับประเภทสินค้า
    - value: 1.25×
      label: แรงดันทดสอบกับแรงดันกำหนด
      detail: ขอบเขตความปลอดภัยในทุกห้อง
    - value: 0%
      label: ความคลาดเคลื่อนของข้อบกพร่องด้านความปลอดภัย
      detail: วาล์ว, D-ring, รอยต่อ, ความลอยตัว
process_cta:
  title: ดูขั้นตอนการผลิตของเรา
  desc: ติดตามเรือผ่านทุกขั้นตอนการผลิต — ตั้งแต่วัสดุดิบจนถึงเรือพร้อมใช้งาน
  label: ดูขั้นตอนการผลิต →
  link: /factory/process
testing_section:
  tagline: การควบคุมคุณภาพ
  title: กระบวนการทดสอบและประกันคุณภาพ
  description: เรือทุกลําต้องผ่านการทดสอบที่จําเป็นก่อนจัดส่งห้องปฏิบัติการคุณภาพของเราทํางานอย่างอิสระจากฝ่ายผลิตและรายงานตรงต่อฝ่ายบริหาร
  steps:
    - title: การตรวจสอบวัตถุดิบ
      desc: ผ้า PVC, Hypalon, และ drop-stitch ผ่านการทดสอบแรงดึง, การขยายรอยฉีก และการตรวจสอบความต้านทาน UV ก่อนที่แต่ละล็อตจะเข้าสู่การผลิต
    - title: การทดสอบการกักเก็บอากาศ 48 ชั่วโมง
      desc: แต่ละห้องท่อจะถูกเติมลมถึง 125% ของแรงดันที่กําหนดและเก็บไว้เป็นเวลา 48 ชั่วโมงแรงดันตกคร่อมเกิน 5% จะกระตุ้นให้มีการปฏิเสธอัตโนมัติและตรวจสอบรอยต่อใหม่
    - title: การทดสอบโหลดและสมดุล
      desc: เรือที่เสร็จสมบูรณ์จะถูกบรรทุกจนเต็มความจุที่กําหนดและทดสอบความมั่นคง ความลึกของลําเรือ และการควบคุมเรือแต่ละลําจะถูกทดสอบน้ําก่อนการตรวจสอบขั้นสุดท้าย
case_studies:
  tagline: OEM โครงการ
  title: OEM กรณีศึกษาแบรนด์และความร่วมมือ
  description: ตั้งแต่แนวคิดสู่ตู้คอนเทนเนอร์ — วิธีที่เราช่วยแบรนด์ระดับโลกเปิดตัวและขยายไลน์เรือเป่าลมของพวกเขา
  labels:
    challenge: ความท้าทาย
    solution: วิธีแก้ปัญหา
    result: ผลลัพธ์
  cards:
    - challenge: ผู้ค้าปลีกกลางแจ้งในยุโรปต้องการไลน์สินค้าแบรนด์ส่วนตัวSUPที่มีกราฟิกระเบียงที่เป็นเอกลักษณ์ บรรจุภัณฑ์เป็นมิตรกับสิ่งแวดล้อม PVCและพร้อมจําหน่าย — ทั้งหมดนี้จัดส่งภายใน 60 วัน
      solution: พัฒนาไฟล์พิมพ์ดิจิทัลแบบกําหนดเอง การREACHสุ่มตัวอย่างแบบ -compliant PVCและแบบบีบอัดจาก 3 รอบเป็น 1 รอบ โดยร่วมทีมออกแบบที่โรงงานชิงเต่าของเรา
      result: 55 วันจากวันที่ลงนามถึง FOB.2,400 หน่วยใน 4 SKU สั่งซื้อซ้ําก่อนที่ตู้คอนเทนเนอร์แรกจะมาถึง
    - challenge: สตาร์ทอัพกีฬาทางน้ําของสหรัฐฯ ต้องการเรือคายัคสมรรถนะสูงdrop-stitchที่มีรูปทรงตัวเรือแบบสั่งทํา บรรจุภัณฑ์ร่วมแบรนด์ และBSCIการรับรองสําหรับการวางขายในร้านค้าปลีก
      solution: ปรับdrop-stitchแม่พิมพ์เรือคายัคที่มีอยู่ให้ปรับรูปทรงโยก พัฒนางานศิลปะบรรจุภัณฑ์ร่วมแบรนด์ และจัดทําBSCIเอกสารตรวจสอบอย่างครบถ้วน
      result: จดทะเบียนสําเร็จในเครือร้านค้ากลางแจ้งใหญ่ 3 แห่งในสหรัฐฯปีแรกขายได้ 5,000+ ยูนิต ด้วยอัตราขาย 98%
    - challenge: ผู้จัดจําหน่ายในออสเตรเลียต้องการCEชุดผลิตภัณฑ์ที่ได้รับการรับรอง - RIB พร้อมสีหลอดแบบกําหนดเอง Hypalon ตัวเลือกการอัปเกรด และเป็นไปตามมาตรฐานออสเตรเลีย AS 1799
      solution: ผลิตตัวอย่างก่อนการผลิตที่มีหลอดสี 4 แบบ จัดหาCSM Hypalon จากซัพพลายเออร์ญี่ปุ่น และประสานงานการทดสอบความสอดคล้องกับ AS 1799 ของบุคคลที่สาม
      result: เปิดตัวกลุ่ม 3 รุ่นRIBในตลาด AU/นิวซีแลนด์ตามมาด้วยการชนะการประมูลของรัฐบาลสําหรับรถลาดตระเวน 12 คันRIBs
