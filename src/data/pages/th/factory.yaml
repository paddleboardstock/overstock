intelligence_cards:
  - title: กำลังการผลิต
    icon: C
    icon_bg: blue
    desc: โรงงานขนาด 12,000 ตร.ม. ผลิตเรือ 15,000 ลำต่อปี ครอบคลุม SUP (8,000+), RIB (2,000+), เรือยางแบบเป่าลม (5,000+) และสายการผลิตอุปกรณ์ความปลอดภัย มีพนักงาน 200-300 คน ทำงาน 2 กะ
    metrics:
      - label: MOQ
        value: 'SUP: 5–10 / RIB: 2–5'
      - label: ระยะเวลาในการผลิต
        value: 30–45 วัน
    link: /factory/capacity
    link_label: รายละเอียดความจุเต็มรูปแบบ →
  - title: ห้องปฏิบัติการและการทดสอบคุณภาพ
    icon: Q
    icon_bg: green
    desc: 'ห้องปฏิบัติการ QC อิสระ มี 4 ขั้นตอนการทดสอบ: ตรวจสอบวัตถุดิบ (แรงดึง, ฉีกขาด, UV), การทดสอบความคงทนแรงดัน 48 ชั่วโมง ที่แรงดัน 1.25 เท่าของแรงดันกำหนด, การทดสอบการลอกของรอยต่อ และการยืนยันโหลด/สมดุลของเรือทุกลำ'
    metrics:
      - label: อุปกรณ์ห้องปฏิบัติการ
        value: เครื่องทดสอบแรงดึง, ห้องควบคุมอุณหภูมิ, ถังรั่ว
      - label: มาตรฐาน
        value: ISO 9001, CE, AS 1799
    link: /factory/quality-lab
    link_label: กระบวนการและอุปกรณ์ในห้องปฏิบัติการ →
  - title: ความสามารถ OEM/ODM
    icon: O
    icon_bg: purple
    desc: บริการแบบครบวงจร OEM/ODM ได้แก่ การออกแบบแม่พิมพ์ตามสั่ง, แพ็กเกจจิ้งแบบเรียกลูกค้า, สีท่อแบบกำหนดเอง, กราฟิกบนเด็ค (พิมพ์ดิจิทัลและสกรีน), ตัวเลือกการอัปเกรด Hypalon และโลจิสติกส์ส่งตรงถึงลูกค้า
    metrics:
      - label: ใบรับรอง
        value: ISO 9001, BSCI, CE, REACH
      - label: การจัดส่ง
        value: FOB, CIF, DDP ไปยัง 50+ ประเทศ
    link: /factory/oem-capability
