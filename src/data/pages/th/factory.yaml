qc_section:
  tagline: การควบคุมคุณภาพ
  title: กระบวนการทดสอบและประกันคุณภาพ
  subtitle: ทุกแผงวงจรต้องผ่านการทดสอบบังคับก่อนจัดส่ง ห้องปฏิบัติการคุณภาพของเราทำงานอย่างอิสระจากการผลิตและรายงานตรงต่อฝ่ายบริหาร
  steps:
    - step: '1'
      title: การตรวจสอบวัตถุดิบ
      desc: ผ้า PVC และ drop-stitch จะต้องผ่านการทดสอบแรงดึง การแพร่ขาด และการตรวจสอบความต้านทาน UV ก่อนที่ชุดใด ๆ จะเข้าสู่กระบวนการผลิต
    - step: '2'
      title: การทดสอบการกักเก็บอากาศ 48 ชั่วโมง
      desc: ห้องบอร์ดแต่ละห้องจะถูกเติมลมถึง 125% ของแรงดันที่กําหนดและเก็บไว้เป็นเวลา 48 ชั่วโมงแรงดันตกคร่อมเกิน 5% จะกระตุ้นให้มีการปฏิเสธอัตโนมัติและตรวจสอบรอยต่อใหม่
    - step: '3'
      title: การทดสอบโหลดและสมดุล
      desc: แผ่นไม้ที่เสร็จสมบูรณ์จะถูกบรรจุน้ําหนักสูงสุดและทดสอบความมั่นคง ความลึกของแผ่น และการควบคุมแต่ละแผ่นจะถูกทดสอบน้ําก่อนการตรวจสอบขั้นสุดท้าย
faq_section:
  tagline: คําถามที่พบบ่อย
  title: คำถามที่พบบ่อย
  questions:
    - q: แผ่นพายของคุณผลิตที่ไหน?
      a: ทุกแผ่นผลิตในโรงงานของเราเองขนาด 12,000 ตารางเมตรที่เว่ยไห่ ประเทศจีนเราไม่ได้จ้างภายนอก — การออกแบบ วัสดุ การเชื่อม การประกอบ และการทดสอบทั้งหมดเกิดขึ้นภายใต้หลังคาเดียวกัน ดังนั้นคุณภาพจึงไม่ขึ้นอยู่กับบุคคลที่สาม
    - q: ทําไมราคาของคุณถึงต่ํากว่าราคาขายปลีกมากขนาดนั้น?
      a: เราจําหน่ายสินค้าคงคลังจากโรงงานและล็อตสินค้าที่เคลียร์โดยตรงจากโรงงานของเราเอง — ไม่มีคนกลาง ไม่มีการบวกราคาขายปลีกนั่นหมายถึงบรรจุภัณฑ์ครบชุด SUP ในราคาลดสูงสุดถึง 60% จากราคาขายปลีกทั่วไป พร้อมคุณภาพที่ผ่านการทดสอบความกดดันเหมือนเดิม
    - q: บอร์ดมีอะไรบ้าง?
      a: 'ทุกชุด SUP จัดส่งเป็นชุดครบชุด: บอร์ด, กระเป๋าเป้เดินทาง, ปั๊มมือ, ไม้พายปรับได้, ครีบถอดได้, สายจูงแบบขดลวด และชุดซ่อม'
    - q: คําสั่งซื้อจัดส่งเร็วแค่ไหน?
      a: คําสั่งซื้อที่มีสต็อกจะออกจากโรงงานเว่ยไห่ของเราภายใน 2-3 วันทําการ พร้อมการจัดส่งติดตามไปยัง 50+ ประเทศทั่วสหภาพยุโรป อเมริกาเหนือ เอเชียแปซิฟิก และที่อื่น ๆ
production_flow:
  tagline: กระบวนการผลิต
  title: จากวัสดุสู่แผ่นไม้สําเร็จรูป
  subtitle: ทุกบอร์ดต้องผ่าน 6 ขั้นตอนการผลิต พร้อมจุดตรวจสอบคุณภาพในทุกขั้นตอนไม่มีทางลัด ไม่มีการข้ามการตรวจสอบ
  stages:
    - stage: '01'
      title: การรับวัสดุและการตรวจสอบคุณภาพขาเข้า
      description: วัสดุทั้งหมดที่เข้ามาจะถูกบันทึกตามหมายเลขล็อต/ชุดในระบบ ERP ของเรา ม้วนผ้า PVC แกน drop-stitch วาล์ว กาว และฮาร์ดแวร์จะถูกกักกันจนกว่าจะได้รับการอนุมัติจาก QC
      qc_check: ความต้านทานแรงดึง, ความต้านทานการฉีกขาด, เกจวัดความหนา, ความหนืดของกาว, การสแกนข้อบกพร่องด้วยสายตา
      qc_threshold: ทดสอบชุดตัวอย่าง 100% ปฏิเสธหากความตึงน้อยกว่า 90% ของสเปค การฉีกขาดต่ำกว่าค่าต่ำสุดของสเปค หรือมีข้อบกพร่องทางสายตาใด ๆ
      responsibility: ทีม QC ขาเข้าจำนวน 3 ผู้ตรวจสอบ
    - stage: '02'
      title: CNC การตัดและการเตรียมวัสดุ
      description: การจัดวางแบบเนสติ้งที่ปรับแต่งสำหรับคอมพิวเตอร์จะวางแผงบนวัสดุ PVC เพื่อลดของเสีย เครื่องตัด CNC อัตโนมัติรักษาความแม่นยำตำแหน่ง 0.1 มม.
      qc_check: ตรวจสอบขนาดเทียบกับไฟล์ CAD DXF, ตรวจสอบคุณภาพขอบ, ตรวจสอบจำนวนแผง
      qc_threshold: วัดทุกแผงที่ 20 ความคลาดเคลื่อน ±0.5 มม. ปฏิเสธชุดถ้ามากกว่า 2% นอกขอบเขตความคลาดเคลื่อน
      responsibility: หัวหน้าการประชุมเชิงปฏิบัติการตัด
    - stage: '03'
      title: การเชื่อม & การยึดติด Drop-Stitch
      description: แกน Drop-stitch ถูกยึดติดกับแผ่นชั้นนอก PVC โดยใช้การลามิเนตความร้อน ห้องท่อเชื่อมด้วย RF หรือการเชื่อมด้วยอากาศร้อน แถบรางเชื่อมติดเป็นชั้นสามชั้น
      qc_check: ทดสอบการลอกทุก 50 หน่วย วัดความกว้างรอยเชื่อม ตรวจสอบบันทึกอุณหภูมิอากาศร้อน ตรวจสอบรอยต่อด้วยแสงไฟหลัง
      qc_threshold: ความแข็งแรงการลอกอย่างน้อย 8 N/cm ความคลาดเคลื่อนความกว้างการเชื่อม ±1 มม. หากพบร่องที่มองเห็นได้ = ปฏิเสธ
      responsibility: การตรวจสอบคุณภาพการเชื่อม (ผู้ตรวจสอบ 2 คนต่อกะ)
    - stage: '04'
      title: การประกอบและการติดตั้งเครน
      description: 'แผงวงจรเคลื่อนที่ไปยังการประกอบขั้นสุดท้ายซึ่งประกอบชิ้นส่วนทั้งหมด: ติดตั้งวาล์ว, D-ring, มือจับ, กล่องครีบ และการติดตั้งถุงพกพา แต่ละหน่วยจะทำตามรายการตรวจสอบการประกอบ 100 จุด'
      qc_check: การตรวจสอบตามรายการตรวจสอบ 100 จุดต่อหน่วย การทดสอบการทำงานของวาล์ว (10 รอบเปิด/ปิด) การตรวจสอบแรงบิดของอุปกรณ์ ฮาร์ดแวร์ การตรวจสอบด้วยสายตา
      qc_threshold: นโยบายข้อบกพร่องศูนย์สำหรับชิ้นส่วนที่สำคัญต่อความปลอดภัย (วาล์ว, D-ring, มือจับ) ข้อบกพร่องเล็กน้อยด้านความสวยงามต้องอยู่ภายในขอบเขตที่เข้มงวด
      responsibility: หัวหน้าทีมประกอบ + ตรวจสอบคุณภาพสาย
    - stage: '05'
      title: การทดสอบแรงดันและการควบคุมคุณภาพ
      description: ทุกห้องถูกเติมลมจนถึงความดัน 1.25× ความดันที่กำหนด (โดยปกติ 20–25 PSI) และคงไว้นาน 24–48 ชั่วโมง เซ็นเซอร์วัดความดันบันทึกอย่างต่อเนื่อง ห้องที่มีการลดลงของความดันเกิน 5% จะถูกปฏิเสธและส่งไปตรวจรอยต่อใหม่
      qc_check: บันทึกการถือความดัน 24 ชั่วโมง, ตรวจสอบการสอบเทียบเซนเซอร์ทุกวัน, การอ่านความดันที่ปรับตามอุณหภูมิ, ทดสอบรอยต่อใหม่หลังซ่อม
      qc_threshold: ความดันตกคร่อมสูงสุด 5% ภายใน 24 ชั่วโมงที่อุณหภูมิคงที่ห้องใดที่เกินค่านี้ = ทดสอบซ้ํา 100% ของชุดการผลิตทั้งหมด
      responsibility: ห้องปฏิบัติการคุณภาพ (ไม่ขึ้นกับการผลิต รายงานต่อฝ่ายบริหาร)
    - stage: '06'
      title: การตรวจสอบขั้นสุดท้ายและการบรรจุ
      description: การตรวจสอบด้วยสายตาและการใช้งานขั้นสุดท้ายข้อบกพร่องของพื้นผิว ความสม่ําเสมอของสี การตรวจสอบฉลาก/ถังขยะ ความสมบูรณ์ของบรรจุภัณฑ์ และความครบถ้วนของอุปกรณ์เสริมหน่วยต่าง ๆ ถูกบรรจุด้วยสุญญากาศ บรรจุกล่อง และจัดเรียงเป็นพาเลทสําหรับการบรรจุตู้คอนเทนเนอร์
      qc_check: การตรวจสอบด้วยสายตาอย่างครบถ้วน, รายการตรวจสอบอุปกรณ์เสริมSKU, ทดสอบการตกของบรรจุภัณฑ์ (1 เมตร, ตัวอย่างสุ่ม), ตรวจสอบการสแกนฉลาก/บาร์โค้ด
      qc_threshold: ไม่มีการยอมรับข้อบกพร่องด้านความปลอดภัย ข้อบกพร่องด้านความสวยงามต้องอยู่ภายในขอบเขตที่เข้มงวด ตรวจสอบสายตา 100% ของแต่ละหน่วย
      responsibility: ทีม QC สุดท้าย (ผู้ตรวจสอบ 4 คน) + หัวหน้าทีมบรรจุ
workforce:
  tagline: บุคลากรของเรา
  title: แรงงานและความเชี่ยวชาญ
  engineers: 25+
  engineers_detail: วิศวกรในสาขาวิจัยและพัฒนา การออกแบบแม่พิมพ์ ห้องปฏิบัติการวัสดุ และวิศวกรรมการผลิตมีประสบการณ์เฉลี่ย 7+ ปีในสายการผลิตเป่าลม
  shift_pattern: 2 กะ/วัน (07:00–15:30, 15:30–00:00)มีเวรกลางคืนเป็นทางเลือกสําหรับคําสั่งเร่งด่วน
  training: การฝึกอบรม QC รายเดือน การฝึกซ้อมความปลอดภัยรายไตรมาส และการประเมินทักษะประจําปีพนักงานใหม่ต้องผ่านการปฐมนิเทศ 40 ชั่วโมงก่อนเริ่มงานสายการผลิต
  departments:
    - name: การวิจัยและพัฒนา & วิศวกรรม
      count: 25+
      role: การออกแบบผลิตภัณฑ์ วิศวกรรมแม่พิมพ์ ห้องปฏิบัติการวัสดุ
    - name: การตัดและเตรียมวัสดุ
      count: 15
      role: CNC การตัด, การเตรียมแผง, การจัดการวัสดุ
    - name: การเชื่อมและเคลือบ
      count: 40
      role: การเชื่อม RF, การเชื่อมด้วยลมร้อน, drop-stitch การเชื่อมติด
    - name: ศิลปะและการตกแต่งดาดฟ้า
      count: '25'
      role: การวางดาดฟ้า EVA, การตกแต่งศิลปะซีรีส์
    - name: การประกอบและการติดตั้งเครน
      count: 35
      role: การประกอบขั้นสุดท้าย การติดตั้งฮาร์ดแวร์ การตรวจสอบระบบ
    - name: การควบคุมคุณภาพ
      count: 12
      role: คุณภาพคุณภาพที่เข้ามา, การตรวจสอบคุณภาพระหว่างกระบวนการ, การตรวจสอบขั้นสุดท้าย, การทดสอบในห้องปฏิบัติการ
    - name: โลจิสติกส์และบรรจุภัณฑ์
      count: 20
      role: บรรจุภัณฑ์ การโหลดตู้คอนเทนเนอร์ เอกสารส่งออก
    - name: การจัดการ & ผู้ดูแลระบบ
      count: 15
      role: ฝ่ายขาย การจัดซื้อ ทรัพยากรบุคคล การเงิน การปฏิบัติตามกฎระเบียบ
material_traceability:
  tagline: การตรวจสอบย้อนกลับ
  title: การติดตามวัสดุและการควบคุมชุดงาน
  description: วัตถุดิบแต่ละชุดจะถูกกำหนดหมายเลขล็อตเฉพาะในระบบ ERP ของเรา ตั้งแต่การมาถึงจนถึงการผลิตจนถึงผลิตภัณฑ์สำเร็จรูป ใบแสดงรายการวัสดุของบอร์ดแต่ละชิ้นจะเชื่อมโยงกลับไปยังล็อตของผู้จัดหาต้นฉบับ ซึ่งช่วยให้สามารถติดตามย้อนหลังได้เต็มที่สำหรับคำถามด้านคุณภาพ
  system: ERP + แท็กแบตช์แบบกายภาพ (ภายในระบบ) แบบกําหนดเองในแต่ละคําสั่งงาน
  coverage: วัสดุการผลิต 100% — PVC, ผ้า drop-stitch, ฟองน้ำ EVA, กาว, วาล์ว, ฮาร์ดแวร์, บรรจุภัณฑ์
  records_retained: 10 ปี
qc_dashboard:
  tagline: ควบคุมคุณภาพตามตัวเลข
  title: ตัวชี้วัดการควบคุมคุณภาพ
  subtitle: ข้อมูลผ่าน/ไม่ผ่านจริงจากสายการผลิตของเรา ห้องแล็บคุณภาพของเราทำงานอย่างอิสระจากการผลิตและรายงานตรงต่อผู้บริหาร
  stats:
    - value: 100%
      label: ชิ้นส่วนทดสอบแรงดัน
      detail: กระดานทุกชิ้น ทุกห้อง ทุกชุด
    - value: <5%
      label: แรงดันตกสูงสุดที่อนุญาต
      detail: เกิน 24 ชั่วโมงที่แรงดัน 1.25× ของแรงดันกำหนด
    - value: 99.3%
      label: อัตราค่าขนส่งปราศจากข้อบกพร่อง
      detail: ตามการสุ่มตรวจสอบ QC ภายใน
    - value: 24–48h
      label: ระยะเวลาการคงแรงดัน
      detail: ขึ้นอยู่กับประเภทสินค้า
    - value: 1.25×
      label: แรงดันทดสอบกับแรงดันกำหนด
      detail: ขอบเขตความปลอดภัยในแต่ละห้อง
    - value: 0%
      label: ความคลาดเคลื่อนของข้อบกพร่องด้านความปลอดภัย
      detail: วาล์ว, D-rings, รอยต่อ, ความลอยตัว
process_cta:
  title: ดูขั้นตอนการผลิตของเรา
  desc: ติดตามบอร์ดผ่านทุกขั้นตอนของการผลิต — ตั้งแต่วัตถุดิบจนถึงบอร์ดพร้อมใช้น้ำ
  label: ดูขั้นตอนการผลิต →
  link: /factory/process
testing_section:
  tagline: การควบคุมคุณภาพ
  title: กระบวนการทดสอบและประกันคุณภาพ
  description: ทุกแผงวงจรต้องผ่านการทดสอบบังคับก่อนจัดส่ง ห้องปฏิบัติการคุณภาพของเราทำงานอย่างอิสระจากการผลิตและรายงานตรงต่อฝ่ายบริหาร
  steps:
    - title: การตรวจสอบวัตถุดิบ
      desc: ผ้า PVC และ drop-stitch จะต้องผ่านการทดสอบแรงดึง การแพร่ขาด และการตรวจสอบความต้านทาน UV ก่อนที่ชุดใด ๆ จะเข้าสู่กระบวนการผลิต
    - title: การทดสอบการกักเก็บอากาศ 48 ชั่วโมง
      desc: ห้องบอร์ดแต่ละห้องจะถูกเติมลมถึง 125% ของแรงดันที่กําหนดและเก็บไว้เป็นเวลา 48 ชั่วโมงแรงดันตกคร่อมเกิน 5% จะกระตุ้นให้มีการปฏิเสธอัตโนมัติและตรวจสอบรอยต่อใหม่
    - title: การทดสอบโหลดและสมดุล
      desc: แผ่นไม้ที่เสร็จสมบูรณ์จะถูกบรรจุน้ําหนักสูงสุดและทดสอบความมั่นคง ความลึกของแผ่น และการควบคุมแต่ละแผ่นจะถูกทดสอบน้ําก่อนการตรวจสอบขั้นสุดท้าย
