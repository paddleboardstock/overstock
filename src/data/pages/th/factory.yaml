workshops_section:
  tagline: เวิร์กช็อป
  title: โรงงานผลิต
  workshops:
    - title: PVC การตัดและการเตรียมวัสดุ
      description: CNC เครื่องตัดอัตโนมัติจะประมวลผล PVC และdrop-stitchสร้างผ้าด้วยความแม่นยําระดับซับมิลลิเมตรการวางผ้าแบบซ้อนที่ปรับแต่งด้วยคอมพิวเตอร์ช่วยลดการสูญเสียวัสดุและมั่นใจว่าทุกแผ่นมีขนาดตรงตามข้อกําหนดก่อนการเชื่อม
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: การเชื่อมและการซีลด้วยความร้อน
      description: เวิร์กช็อปเชื่อมโลหะโดยเฉพาะพร้อมเครื่องซีลความร้อนและเครื่องกดไดอิเล็กทริก RF เครื่องเชื่อมอากาศร้อนเชื่อมและหลอมไส้กลาง drop-stitch และแถบราง ในขณะที่การเชื่อม RF สร้างรอยต่อที่มีความแข็งแรงสูงและป้องกันอากาศรั่ว
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: ศิลปะบนสำรับ & การตกแต่ง EVA
      description: 'เด็คชุดอาร์ตซีรีส์เกิดรูปแบบที่นี่: แผ่นโฟม EVA ตัดด้วยความแม่นยำถูกวางในรูปแบบเต็มเด็ค ติดกันและตัดแต่งด้วยมือเพื่อให้ได้การสัมผัสที่กระชับ สะดวกสบาย และทนทาน — นี่คือรูปลักษณ์ที่เป็นเอกลักษณ์ของบอร์ดอาร์ตซีรีส์ทุกชิ้น'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP การพิมพ์และการตกแต่ง
      description: SUP แผ่นไม้ถูกตกแต่งด้วยการพิมพ์ดิจิทัลสําหรับกราฟิกสีเต็มรูปแบบ และการพิมพ์สกรีนสําหรับโลโก้และลวดลายซ้ําเครื่องพิมพ์ดิจิทัลผลิตลวดลายสํารับที่มีคุณภาพภาพถ่าย ขณะที่การพิมพ์สกรีนให้เครื่องหมายแบรนด์ที่ทนทานและสดใส
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: การประกอบขั้นสุดท้ายและการติดตั้งอุปกรณ์
      description: สายการผลิตที่บอร์ดได้รับวาล์ว, D-ริง, มือจับ, ครีบ, และอุปกรณ์ติดสายนำทาง แต่ละบอร์ดจะปฏิบัติตามรายการตรวจสอบการประกอบ 100 จุดที่หัวหน้าทีมลงนามอนุมัติ
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: การทดสอบและตรวจสอบคุณภาพ
      description: ทุกบอร์ดที่เสร็จสมบูรณ์จะต้องผ่านการทดสอบการเก็บอากาศ การตรวจสอบการลอกของรอยต่อ และการตรวจสอบระบบทั้งหมดก่อนจัดส่ง ห้องแล็บคุณภาพของเราทำงานอย่างอิสระจากการผลิตและรายงานตรงต่อฝ่ายบริหาร
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
