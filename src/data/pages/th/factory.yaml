workshops_section:
  tagline: เวิร์กช็อป
  title: โรงงานผลิต
  workshops:
    - title: PVC การตัดและการเตรียมวัสดุ
      description: CNC เครื่องตัดอัตโนมัติจะประมวลผล PVC, Hypalon, และdrop-stitchผ้าด้วยความแม่นยําระดับมิลลิเมตรการซ้อนกันที่ปรับแต่งด้วยคอมพิวเตอร์ช่วยลดขยะวัสดุและมั่นใจว่าทุกแผงตรงตามข้อกําหนดขนาดก่อนการเชื่อม
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: การเชื่อมท่อและการซีลด้วยความร้อน
      description: เวิร์กช็อปเชื่อมเฉพาะทางพร้อมเครื่องซีลความร้อนและเครื่องอัดไดอิเล็กทริก RF เครื่องซีลความร้อนอากาศร้อนจะเชื่อมและเชื่อมห้องหลอดฟิวส์ PVC ขณะที่การเชื่อม RF จะสร้างรอยต่อที่มีความแข็งแรงสูงและปิดสนิทเกินISOข้อกําหนด 9001
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB การผลิตตัวเรือ — ไฟเบอร์กลาส
      description: RIB ตัวเรือผลิตด้วยวัสดุขึ้นรูปไฟเบอร์กลาสแบบวางมือ พร้อมระบบเรซินโพลีเอสเตอร์และไวนิลเอสเตอร์แต่ละชั้นถูกรีดด้วยมือและบรรจุถุงสุญญากาศเพื่อคุณภาพที่สม่ําเสมอห้องพ่นเจลโค้ทให้ผิวเคลือบเงางามUVและทนต่อการเดินเรือ
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP การพิมพ์และการตกแต่ง
      description: SUP แผ่นไม้ถูกตกแต่งด้วยการพิมพ์ดิจิทัลสําหรับกราฟิกสีเต็มรูปแบบ และการพิมพ์สกรีนสําหรับโลโก้และลวดลายซ้ําเครื่องพิมพ์ดิจิทัลผลิตลวดลายสํารับที่มีคุณภาพภาพถ่าย ขณะที่การพิมพ์สกรีนให้เครื่องหมายแบรนด์ที่ทนทานและสดใส
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: การประกอบขั้นสุดท้ายและการติดตั้งอุปกรณ์
      description: สายการประกอบที่ต่อตัวเรือและท่อไฟเบอร์กลาส ติดตั้งPVCเครื่องยนต์ เชื่อมต่อพวงมาลัยและควบคุม และเดินสายระบบไฟฟ้าเรือแต่ละลําปฏิบัติตามรายการตรวจสอบประกอบ 100 ข้อที่หัวหน้าทีมลงนาม
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: การทดสอบและตรวจสอบคุณภาพ
      description: เรือทุกลําที่เสร็จสมบูรณ์จะต้องผ่านการทดสอบการกักเก็บอากาศ การตรวจสอบรอยต่อ และการตรวจสอบระบบอย่างครบถ้วนก่อนจัดส่งห้องปฏิบัติการคุณภาพของเราทํางานอย่างอิสระจากฝ่ายผลิตและรายงานโดยตรงต่อฝ่ายบริหาร
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
