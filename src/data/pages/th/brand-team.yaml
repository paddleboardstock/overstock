hero:
  tagline: ทีมของเรา
  title: ผู้คนเบื้องหลัง Paddle Board Overstock<br />— วิศวกรรมเสรีภาพบนผิวน้ำ
  subtitle: ก่อตั้งขึ้นในปี 2012 ที่ Weihai ประเทศจีน, Paddle Board Overstock ถูกสร้างขึ้นโดยวิศวกรทางทะเล นักวิทยาศาสตร์วัสดุ และผู้ที่ชื่นชอบกีฬาทางน้ำที่เชื่อในการทำให้บอร์ดพายลมระดับมืออาชีพสามารถเข้าถึงได้ทั่วโลก
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock ภาพถ่ายทีมเต็ม — วิศวกรรม การผลิต และผู้นำ
founding:
  tagline: การก่อตั้งของเรา
  title: จากเวิร์กช็อปชายฝั่ง<br />สู่พื้นที่ 12,000 ตารางเมตร
  subtitle: Paddle Board Overstock ก่อตั้งโดยทีมวิศวกรทางทะเลที่มีประสบการณ์รวมหลายสิบปีในการออกแบบ SUP แบบเป่าลม การก่อสร้าง drop-stitch และการผลิตกีฬาทางน้ำระดับโลก
  items:
    - title: 'ก่อตั้ง: 2012'
      description: ก่อตั้งขึ้นที่ Weihai ประเทศจีน — ศูนย์กลางทางทะเลสำคัญที่มีมรดกการต่อเรือที่ยาวนาน
      icon: tabler:calendar
    - title: พนักงาน 200-300 คน
      description: รวมถึงวิศวกรวิจัยและพัฒนา (R&D) 14 คน ผู้เชี่ยวชาญด้านการควบคุมคุณภาพ และช่างเทคนิคการผลิต
      icon: tabler:users
    - title: พื้นที่ 12,000 ตารางเมตร
      description: โรงงานผลิตที่ทุ่มเทมีสายการผลิต 6 สายสำหรับบอร์ด SUP และอุปกรณ์เสริม
      icon: tabler:building-factory
    - title: ส่งออกไป 50+ ประเทศ
      description: ส่งออกไปยุโรป อเมริกา ตะวันออกกลาง เอเชียแปซิฟิก และแอฟริกา
      icon: tabler:globe
leadership:
  tagline: ผู้นํา
  title: การบริหารจัดการและผู้นำด้านวิศวกรรม
  subtitle: ทีมผู้นำของเรารวมความเชี่ยวชาญลึกซึ้งด้านวิศวกรรมทางทะเล การค้าระหว่างประเทศ และการจัดการคุณภาพ
  columns: 3
  items:
    - title: ผู้ก่อตั้งและซีอีโอ
      name: โทบี้ หลิว
      description: 15+ ปีในอุตสาหกรรมการผลิตทางทะเล เคยเป็นหัวหน้าฝ่ายวิจัยและพัฒนาที่ผู้ผลิตทางทะเลรายใหญ่ของจีน ถือสิทธิบัตรหลายรายการในการออกแบบผลิตภัณฑ์เป่าลม
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: หัวหน้าวิศวกร
      name: จาง เว่ย
      description: 20+ ปีในด้านการผลิตโพลิเมอร์และการออกแบบโครงสร้างเป่าลม เคยเป็นผู้อำนวยการฝ่ายเทคนิคที่บริษัทวิศวกรรมทางทะเลในยุโรป
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: หัวหน้า R&D
      name: เฉิน หมิง
      description: ปริญญาเอกด้านวิทยาศาสตร์วัสดุ เชี่ยวชาญเทคโนโลยี drop-stitch และกระบวนการเชื่อมความถี่สูง มีประสบการณ์ 10+ ปีในคอมโพสิตสิ่งทอ
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: ผู้อำนวยการฝ่ายผลิต
      name: หลิว เฉียง
      description: 18+ ปีในด้านการผลิตแบบลีนและการเพิ่มประสิทธิภาพสายการผลิต สร้างระบบคุณภาพที่อยู่เบื้องหลังอัตราข้อบกพร่อง 99.3% ของเรา
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: ผู้จัดการฝ่ายคุณภาพ
      name: หวางฟาง
      description: 12+ ปีในด้านการควบคุมคุณภาพทางทะเล ควบคุมการทดสอบแรงดัน รอยต่อ และน้ำหนักของทุกล็อตการผลิตก่อนการปล่อย
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: ผู้อำนวยการฝ่ายขายและปฏิบัติการ
      name: เฮเลน ลี
      description: 15+ ปีในด้านพาณิชย์อิเล็กทรอนิกส์ระหว่างประเทศและโลจิสติกส์ ส่งกระดานถึงผู้พายใน 50+ ประเทศ พูดได้คล่อง 4 ภาษา
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: ปรัชญาการออกแบบ
  title: การออกแบบโดยวิศวกรรมเป็นผู้นำ<br />— ทุกรายละเอียดสำคัญ
  subtitle: ปรัชญาด้านวิศวกรรมของเรามุ่งเน้นไปที่สามหลักการที่เป็นแนวทางในการสร้างผลิตภัณฑ์ทุกชิ้นของเรา
  list:
    - 'ความน่าเชื่อถือมาก่อน: ทุกผลิตภัณฑ์ Paddle Board Overstock ถูกทดสอบเพื่อทนต่อสภาพจริง — ตั้งแต่การสำรวจน้ำเย็นจนถึงการเช่าที่ชายหาดเขตร้อน เราออกแบบให้แข็งแรงเกินจำเป็นในจุดที่สำคัญที่สุด'
    - 'ความแม่นยำในการผลิต: โรงงานของเราใช้การตัด CNC การเชื่อมความถี่สูง และการทดสอบแรงดันอัตโนมัติ รอยต่อทุกจุด วาล์วทุกตัว อุปกรณ์ทุกชิ้นตรงตามข้อกำหนดที่บันทึกไว้'
    - 'นวัตกรรมอย่างต่อเนื่อง: ทีมวิจัยและพัฒนาของเราประเมินวัสดุใหม่ วิธีการผลิต และการปรับปรุงการออกแบบอย่างต่อเนื่อง เราไม่รอให้เกิดปัญหา — เราคาดการณ์ปัญหาเหล่านั้นล่วงหน้า'
cta:
  title: อยากพูดคุยเกี่ยวกับโปรเจกต์กับทีมของเราหรือไม่?
  subtitle: ทีมงานของเราพร้อมที่จะช่วยคุณเลือกกระดาน อุปกรณ์เสริม และอุปกรณ์ให้เหมาะกับสไตล์การพายของคุณ
  actions:
    - variant: primary
      text: ติดต่อทีมของเรา
      href: /contact
    - text: ดูสินค้าของเรา
      href: /products
