hero:
  tagline: ทีมของเรา
  title: ผู้คนเบื้องหลัง Aquafarer<br />— วิศวกรรมเสรีภาพบนผิวน้ำ
  subtitle: ก่อตั้งขึ้นในปี 2012 ที่ชิงเต่า ประเทศจีน Aquafarer ถูกสร้างขึ้นโดยวิศวกรทางทะเล นักวิทยาศาสตร์วัสดุ และผู้ที่ชื่นชอบกีฬาทางน้ำที่เชื่อในการทำให้เรือเป่าขนาดมืออาชีพเข้าถึงได้ทั่วโลก
  image:
    src: /images/team-all.webp
    alt: Aquafarer ภาพทีมเต็ม — วิศวกรรม การผลิต และผู้นำ
founding:
  tagline: การก่อตั้งของเรา
  title: จากเวิร์กช็อปชายฝั่ง<br />สู่พื้นที่ 12,000 ตารางเมตร
  subtitle: Aquafarer ก่อตั้งโดยทีมวิศวกรทางทะเลที่มีประสบการณ์รวมกันหลายทศวรรษในการออกแบบเรือเป่า การผลิต PVC/Hypalon และการผลิตอุปกรณ์ทางทะเลระดับโลก
  items:
    - title: 'ก่อตั้ง: 2012'
      description: ตั้งอยู่ในชิงเต่า ประเทศจีน — ศูนย์กลางการเดินเรือที่สำคัญและมีประวัติการต่อเรือที่ยาวนาน
      icon: tabler:calendar
    - title: พนักงาน 200-300 คน
      description: รวมถึงวิศวกร R&D 50+ ผู้เชี่ยวชาญด้านคุณภาพ และช่างเทคนิคการผลิต
      icon: tabler:users
    - title: พื้นที่ 12,000 ตารางเมตร
      description: โรงงานผลิตเฉพาะกิจพร้อมสายการผลิต 6 สายสำหรับ RIBs เรือเป่า และบอร์ด SUP
      icon: tabler:building-factory
    - title: ส่งออกไป 50+ ประเทศ
      description: ส่งออกไปยุโรป อเมริกา ตะวันออกกลาง เอเชียแปซิฟิก และแอฟริกา
      icon: tabler:globe
leadership:
  tagline: ผู้นํา
  title: การบริหารจัดการและผู้นำด้านวิศวกรรม
  subtitle: ทีมผู้นำของเรารวมความเชี่ยวชาญลึกซึ้งด้านวิศวกรรมทางทะเล การค้าระหว่างประเทศ และการจัดการคุณภาพ
  columns: 3
  items:
    - title: ผู้ก่อตั้งและซีอีโอ
      name: โทบี้ หลิว
      description: 15+ ปีในสายการผลิตทางทะเลเคยเป็นหัวหน้าฝ่ายวิจัยและพัฒนาที่ผู้ผลิตเรือรายใหญ่ของจีนถือสิทธิบัตรหลายฉบับในการออกแบบเรือเป่าลม
      icon: tabler:crown
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-toby-liu-team.webp
    - title: หัวหน้าวิศวกร
      name: จาง เว่ย
      description: 20+ ปีในPVCHypalonสายการผลิตและการออกแบบตัวเรือ Deep-V อดีตผู้อํานวยการฝ่ายเทคนิคที่บริษัทวิศวกรรมทางทะเลในยุโรป
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: หัวหน้า R&D
      name: เฉิน หมิง
      description: ปริญญาเอกด้านวิทยาศาสตร์วัสดุ เชี่ยวชาญเทคโนโลยี drop-stitch และกระบวนการเชื่อมความถี่สูง มีประสบการณ์ 10+ ปีในคอมโพสิตสิ่งทอ
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: ผู้อำนวยการฝ่ายผลิต
      name: หลิว เฉียง
      description: มีประสบการณ์ 18+ ปีในสายการผลิตแบบลีนและการปรับปรุงสายการผลิต Six Sigma Black Belt ดำเนินการระบบคุณภาพ ISO 9001
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: ผู้จัดการฝ่ายคุณภาพ
      name: หวางฟาง
      description: มีประสบการณ์ 12+ ปีในการควบคุมคุณภาพทางทะเลได้รับการรับรองCEและISOตรวจสอบบัญชีดูแลการทดสอบสําหรับทุกล็อตการผลิต
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: ผู้อำนวยการฝ่ายขายและปฏิบัติการ
      name: เฮเลน ลี
      description: 15+ ปีในB2Bการค้าระหว่างประเทศบริหารOEM/ODMร่วมมือใน 30+ ประเทศพูดได้คล่อง 4 ภาษา
      icon: tabler:briefcase
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: ปรัชญาการออกแบบ
  title: การออกแบบโดยวิศวกรรมเป็นผู้นำ<br />— ทุกรายละเอียดสำคัญ
  subtitle: ปรัชญาด้านวิศวกรรมของเรามุ่งเน้นไปที่สามหลักการที่เป็นแนวทางในการสร้างผลิตภัณฑ์ทุกชิ้นของเรา
  list:
    - 'ความน่าเชื่อถือมาก่อน: ทุกผลิตภัณฑ์ Aquafarer ถูกทดสอบให้สามารถทนต่อสภาพแวดล้อมในโลกจริง — ตั้งแต่ปฏิบัติการกู้ภัยในน้ำเย็นไปจนถึงการเช่าที่รีสอร์ทเขตร้อน เราออกแบบเกินความจำเป็นในส่วนที่สำคัญที่สุด'
    - 'ความแม่นยำในการผลิต: โรงงานของเราใช้การตัด CNC การเชื่อมความถี่สูง และการทดสอบแรงดันอัตโนมัติ รอยต่อทุกจุด วาล์วทุกตัว อุปกรณ์ทุกชิ้นตรงตามข้อกำหนดที่บันทึกไว้'
    - 'นวัตกรรมอย่างต่อเนื่อง: ทีมวิจัยและพัฒนาของเราประเมินวัสดุใหม่ วิธีการผลิต และการปรับปรุงการออกแบบอย่างต่อเนื่อง เราไม่รอให้เกิดปัญหา — เราคาดการณ์ปัญหาเหล่านั้นล่วงหน้า'
cta:
  title: อยากพูดคุยเกี่ยวกับโปรเจกต์กับทีมของเราหรือไม่?
  subtitle: วิศวกรของเราพร้อมให้คำปรึกษาเกี่ยวกับการเลือกผลิตภัณฑ์ การปรับแต่ง และความร่วมมือ OEM/ODM
  actions:
    - variant: primary
      text: ติดต่อทีมของเรา
