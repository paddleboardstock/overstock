hero:
  tagline: พันธมิตร & การจัดจำหน่าย
  title: เข้าร่วมเป็นพันธมิตร Aquafarer<br />— เครือข่ายการจัดจำหน่ายระดับโลก
  subtitle: เข้าร่วมเครือข่ายพันธมิตรระดับโลกของ Aquafarer เราทำงานร่วมกับผู้จัดจำหน่ายทางทะเล, ผู้จำหน่ายเรือ, ร้านค้าจัดจำหน่ายอุปกรณ์, และพันธมิตรแบรนด์ใน 50+ ประเทศ
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer เครือข่ายพันธมิตรและผู้จัดจำหน่ายระดับโลก
content_programs:
  tagline: โปรแกรมพันธมิตร
  title: โปรแกรมพันธมิตร<br />สร้างมาเพื่อการเติบโต
  subtitle: ไม่ว่าคุณจะเป็นผู้จัดจำหน่าย, ตัวแทนจำหน่าย, หรือพันธมิตรแบรนด์ Aquafarer มีโปรแกรมที่ออกแบบเพื่อสนับสนุนธุรกิจของคุณ
  columns: 3
  items:
    - title: โปรแกรมผู้จัดจำหน่าย
      description: การจัดจำหน่ายในเขตที่กำหนดพร้อมราคาปริมาณ, การสนับสนุนด้านการตลาด, และการเข้าถึงโรงงานโดยตรง ต้องมีการรับประกันขั้นต่ำตามขนาดเขต
      icon: tabler:world
    - title: โปรแกรมตัวแทนจำหน่าย
      description: ราคาสำหรับตัวแทนจำหน่ายโดยตรง, การฝึกอบรมสินค้า, วัสดุการตลาด, และการสนับสนุนการรับประกันสำหรับร้านค้าปลีกและร้านค้าออนไลน์
      icon: tabler:building-store
    - title: OEM/ODM การเป็นพันธมิตร
      description: บริการเต็มรูปแบบ OEM และการผลิต ODM ด้วยแบรนด์, บรรจุภัณฑ์ และสเปคสินค้าแบบกำหนดเอง ตั้งแต่แนวคิดไปจนถึงการขนส่ง
      icon: tabler:certificate
    - title: พันธมิตรแบรนด์
      description: ร่วมแบรนด์, ป้ายส่วนตัว, และโปรแกรมรุ่นพิเศษสำหรับแบรนด์ที่มีชื่อเสียงในอุตสาหกรรมทางทะเลและนันทนาการกลางแจ้ง
      icon: tabler:stars
    - title: รัฐบาลและสถาบัน
      description: โปรแกรมผู้จัดจำหน่ายที่ได้รับการยอมรับสำหรับหน่วยงานรัฐบาล, รัการชายฝั่ง, กองทัพ, และองค์กรนิรภัย เอกสารพร้อมประกวดราคา
      icon: tabler:building-community
    - title: พันธมิตรรีสอร์ท & การเช่า
      description: ราคาสำหรับฟลีท, คุณภาพสม่ำเสมอ และแบรนด์ที่กำหนดเอง สำหรับรีสอร์ท, ศูนย์ดำน้ำ, และธุรกิจให้เช่าทั่วโลก
      icon: tabler:sun
content_benefits:
  tagline: ทำไมต้องเป็นพันธมิตรกับเรา
  title: ทำไมพันธมิตรจึงเลือก Aquafarer
  subtitle: พันธมิตรของเราได้รับประโยชน์จากความสามารถในการผลิตจริง, คุณภาพสม่ำเสมอ, และการสนับสนุนที่รวดเร็ว
  list:
    - 'การเข้าถึงโรงงานโดยตรง: ทำงานโดยตรงกับทีมผลิตของเรา — ไม่มีคนกลาง ได้รับคำตอบรวดเร็ว, ราคาดีกว่า, และการมองเห็นการผลิตทั้งหมด'
    - 'พร้อมปรับแต่ง: แบรนด์สินค้าของคุณด้วยสี, โลโก้, บรรจุภัณฑ์, และสเปคที่กำหนดเอง ปริมาณการสั่งซื้อขั้นต่ำได้ถูกปรับแต่งให้เหมาะกับตลาดของคุณ'
    - 'คุณภาพรับประกัน: การผลิตที่ได้รับการรับรอง ISO 9001 พร้อมการปฏิบัติตาม CE, UKCA, และ BSCI ทุกผลิตภัณฑ์ผ่านการทดสอบก่อนการส่ง'
    - 'โลจิสติกส์ระดับโลก: การขนส่งจากชิงเต่า, ประเทศจีน พร้อมตัวเลือก FOB, CIF, และ DDP คลังสินค้าในสหรัฐอเมริกาที่มอนต์แคลร์, แคลิฟอร์เนีย สำหรับการจัดจำหน่ายในอเมริกาเหนือ'
    - 'การสนับสนุนด้านการตลาด: แคตตาล็อกสินค้า, การถ่ายภาพ, เอกสารทางเทคนิค, และสื่อดิจิทัลเพื่อสนับสนุนการขายของคุณ'
    - 'การฝึกอบรม & การสนับสนุน: การฝึกอบรมสินค้าแก่ทีมขายของคุณ, การสนับสนุนทางเทคนิคให้กับลูกค้าของคุณ, และการประสานงานบริการรับประกัน'
content_process:
  tagline: วิธีการเข้าร่วมเป็นพันธมิตร
  title: กระบวนการเป็นพันธมิตรที่เรียบง่าย
  subtitle: กระบวนการเป็นพันธมิตรของเราเรียบง่าย — ออกแบบมาเพื่อให้คุณเริ่มขายผลิตภัณฑ์ Aquafarer ได้อย่างรวดเร็ว
  items:
    - title: 'ขั้นตอนที่ 1: ส่งใบสมัคร'
      description: กรอกแบบฟอร์มสมัครเป็นพันธมิตรของเราพร้อมข้อมูลโปรไฟล์บริษัท ตลาดเป้าหมาย และความสนใจในผลิตภัณฑ์
    - title: 'ขั้นตอนที่ 2: การตรวจสอบคุณสมบัติ'
      description: ทีมพันธมิตรของเราจะตรวจสอบใบสมัครของคุณและติดต่อคุณภายใน 3 วันทำการเพื่อตรวจสอบโอกาส
    - title: 'ขั้นตอนที่ 3: ข้อตกลงและการตั้งค่า'
      description: ลงนามในข้อตกลงพันธมิตร ตั้งค่าบัญชีของคุณ และรับราคาสำหรับพันธมิตร สื่อการตลาด และตัวอย่างผลิตภัณฑ์
    - title: 'ขั้นตอนที่ 4: การฝึกอบรมและเปิดตัว'
      description: มีการฝึกอบรมผลิตภัณฑ์ การสนับสนุนการขาย และสื่อการตลาดที่จัดเตรียมให้ คุณก็พร้อมที่จะเริ่มขาย
cta:
  title: พร้อมที่จะเป็นพันธมิตร Aquafarer หรือยัง?
  subtitle: สมัครเป็นพันธมิตรและทีมงานของเราจะตอบกลับภายใน 3 วันทำการ
  actions:
    - variant: primary
      text: สมัครเป็นพันธมิตร
      href: /contact
    - text: ดูสินค้าของเรา
      href: /products
