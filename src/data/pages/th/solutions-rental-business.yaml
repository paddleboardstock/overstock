testimonial:
  content: ฉันเคยเช่าเซิร์ฟบอร์ด 5 แผ่นจากร้านท้องถิ่นและเสียรายได้ 60% ให้กับพวกเขา Paddle Board Overstock ช่วยฉันสร้างฟลีทของตัวเอง 15 SUPs ตัว เครื่องคิดเลข ROI ที่พวกเขาให้มาบอกว่าฉันจะคืนทุนใน 4 เดือน — แต่จริง ๆ ใช้เวลาแค่ 3 เดือน ตอนนี้ฉันกำลังขยายเป็น 30 แผ่น
  name: แดเนียล โอโกนคโว
  title: เจ้าของ, Lakeland SUP Rentals — ออนแทรีโอ, แคนาดา
content_segments:
  tagline: โปรไฟล์การเช่า
  title: โซลูชันการเช่าอุปกรณ์กีฬาทางน้ำ<br />ตามประเภทโอเปอเรเตอร์
  subtitle: การดำเนินงานให้เช่าที่แตกต่างกันมีความต้องการที่แตกต่างกัน — ตั้งแต่การให้เช่า SUP ริมชายหาดขนาดเล็กไปจนถึงศูนย์กีฬาทางน้ำในรีสอร์ทขนาดใหญ่ เราปรับแพ็คเกจอุปกรณ์และรูปแบบการสนับสนุนของเราให้เหมาะสมตามนั้น
  items:
    - title: เช่าที่พักริมชายหาด & ริมทะเลสาบ SUP
      subtitle: การดำเนินงานปริมาณสูง ความซับซ้อนต่ำ
      description: ผู้ให้บริการเช่าเซิร์ฟบอร์ดแบบยืนตรงโดยตรงให้กับนักท่องเที่ยวชายหาดและผู้เข้าชมทะเลสาบ ความสำคัญของคุณคือการลดเวลาระหว่างการเช่าให้มากที่สุด การรักษาอุปกรณ์ให้อยู่ในวงจรการใช้งาน และจัดการกับความต้องการตามฤดูกาลในพื้นที่จัดเก็บขนาดเล็ก
      features:
        - กองเรือ SUP แบบพองลมที่พับเก็บเรียบ — ไม่ต้องใช้ท่าเรือหรือเทรลเลอร์
        - เกรดเชิงพาณิชย์ PVC ได้รับการจัดอันดับสำหรับ 100+ รอบการเช่าต่อฤดูกาล
        - ผ้าแห้งเร็ว ทนต่อ UV พร้อมใช้งานให้เช่าใหม่ได้ในวันเดียวกัน
        - ช่วงของกระดานที่มีรหัสสีเพื่อการระบุฝูงเรือได้ง่าย
    - title: ศูนย์กีฬาทางน้ำของรีสอร์ทและโรงแรม
      subtitle: ประสบการณ์ของแขกและการปรับแบรนด์ให้สอดคล้องกัน
      description: รีสอร์ทและโรงแรมที่มีกีฬาทางน้ําเป็นสิ่งอํานวยความสะดวกในสถานที่อุปกรณ์ต้องดูพรีเมียม ทํางานได้อย่างน่าเชื่อถือสําหรับแขกระดับเริ่มต้นถึงกลาง และผสานรวมกับขั้นตอนการจองกิจกรรมและการเรียกเก็บเงินที่มีอยู่ของรีสอร์ท
      features:
        - SUP บอร์ดและเสื้อชูชีพแบรนด์พิเศษที่เข้ากับสีของรีสอร์ท
        - 'เรือผสม: รอบด้าน, ทัวร์, และชุดศิลปะ SUPs'
        - โซลูชันปั๊มไฟฟ้าที่เงียบและไม่ใช้เชื้อเพลิงสําหรับการเติมลมบนชายหาด
        - รวมการฝึกอบรมและการรับพนักงานบํารุงรักษา
    - title: การเช่าบูติก & แบบเคลื่อนที่ SUP
      subtitle: บริการเช่าชั่วคราวและแบบจัดส่ง
      description: ผู้ให้บริการนำบอร์ดไปยังลูกค้าโดยตรง — ส่งถึงชายหาดของโรงแรม, จุดเช่าชั่วคราวตามงานอีเวนต์, และการตั้งค่าบูธเคลื่อนที่ อุปกรณ์ต้องสามารถติดตั้งได้อย่างรวดเร็ว, ขนย้ายง่าย, และดูดีทันทีที่เห็น พร้อมมีขนาดกองเรือที่ยืดหยุ่นสำหรับงานอีเวนต์และความต้องการตามฤดูกาล
      features:
        - การขนส่งบอร์ดแบบเป้สะพายหลัง — ไม่ต้องใช้Trailer
        - การเติมลมอย่างรวดเร็วสำหรับการติดตั้งตามต้องการภายใน 15 นาที
        - อุปกรณ์ที่ดูดีและหรูหราทันทีที่เห็น
        - ขนาดกองเรือที่ยืดหยุ่นสำหรับงานอีเวนต์และความต้องการตามฤดูกาล
    - title: ผู้ประกอบการทัวร์และผจญภัย
      subtitle: กองเรือท่องเที่ยวแบบมีไกด์
      description: ผู้ให้บริการจัดทัวร์กีฬาทางน้ำแบบมีไกด์ — SUP ซาฟารี, ทัวร์ดำน้ำตื้น, และทัวร์สำรวจชายฝั่ง อุปกรณ์ต้องมีความมั่นคงเพียงพอสำหรับผู้เข้าร่วมทัวร์มือใหม่, ทำความสะอาดง่ายระหว่างกลุ่ม, และทนทานพอสำหรับการใช้งานไกด์แบบรายวันในสภาพน้ำที่หลากหลาย
      features:
        - แพลตฟอร์มที่มั่นคงเป็นพิเศษ SUP (กว้าง 32 นิ้ว+) สําหรับผู้ขี่ครั้งแรก
        - แพลตฟอร์มขนาดใหญ่พิเศษสำหรับถ่ายภาพคู่/กลุ่มในการทัวร์
        - มีความจุสัมภาระในตัวสําหรับอุปกรณ์ดําน้ําตื้น ถุงแห้ง และตู้เย็น
        - ชุดอุปกรณ์ความปลอดภัยสำหรับการดำเนินงานทัวร์เชิงพาณิชย์
cta:
  title: พร้อมสร้างกองรถเช่าของคุณหรือยัง?
  subtitle: บอกเราเกี่ยวกับที่ตั้งและปริมาณผู้เข้าพักของคุณ — เราจะออกแบบกองเรือเช่าที่เหมาะสมกับตลาดของคุณ
  actions:
    - variant: primary
      text: รับข้อเสนอเช่า
      href: /contact
    - text: ดูเรื่องราวความสําเร็จ
      href: /success-stories
