content_capability:
  tagline: ความสามารถทางวิศวกรรม
  title: วิศวกรรมของเรา<br />ทีมส่งมอบ
  subtitle: Paddle Board Overstock วิศวกรรมครอบคลุมวงจรชีวิตผลิตภัณฑ์ทั้งหมด — ตั้งแต่การวิจัยตลาดและการออกแบบแนวคิด ผ่านการสร้างต้นแบบ การทดสอบ และการผลิตจำนวนมาก
  items:
    - title: การออกแบบอุตสาหกรรม
      description: ทีมออกแบบอุตสาหกรรมของเราทำงานจากความต้องการของลูกค้า การวิจัยตลาด และการวิเคราะห์การแข่งขัน เพื่อพัฒนาแนวคิดผลิตภัณฑ์ที่สมดุลระหว่างความงาม การใช้งาน และความสามารถในการผลิต เราผลิตภาพร่าง 2 มิติ ภาพจำลอง 3 มิติ และเอกสารรายละเอียดทางเทคนิคสำหรับการตรวจสอบของลูกค้าก่อนที่จะยืนยันในการทำเครื่องมือ
      features:
        - การพัฒนาแนวคิดและการศึกษาความเป็นไปได้
        - แบบร่างการออกแบบ 2 มิติ และภาพเรนเดอร์ 3 มิติ
        - การเลือกและกำหนดวัสดุ
        - การวิเคราะห์การออกแบบเพื่อการผลิต (DFM)
        - การประเมินด้านสรีรศาสตร์และความปลอดภัย
    - title: วิศวกรรมโครงสร้าง
      description: วิศวกรโครงสร้างของเรามีความเชี่ยวชาญด้านสถาปัตยกรรมเรือยาง — การออกแบบตัวเรือ การจัดเรียงห้องท่อ วิศวกรรมแกน drop-stitch และการกระจายน้ำหนัก การออกแบบแต่ละแบบได้รับการวิเคราะห์ด้านความมั่นคงของโครงสร้าง การปรับน้ำหนักให้เหมาะสม และความสอดคล้องกับมาตรฐานที่เกี่ยวข้อง (CE, ISO, AS)
      features:
        - การออกแบบตัวเรือไฟเบอร์กลาสแบบ Deep-V พร้อมมุมเอียงล่างที่คำนวณมาแล้ว
        - การจัดเรียงท่อหลายห้องเพื่อความปลอดภัยและความลอยตัว
        - Drop-stitch ข้อกำหนดหลักและการปรับความหนาแน่น
        - การวิเคราะห์องค์ประกอบจำกัดสำหรับชิ้นส่วนที่รับน้ำหนัก
        - การคำนวณการกระจายน้ำหนักและความมั่นคง
    - title: การสร้างแบบจำลอง 3 มิติและงาน CAD
      description: การออกแบบผลิตภัณฑ์ทั้งหมดจะถูกพัฒนาด้วยระบบ CAD 3D ก่อนเริ่มการผลิตเครื่องมือต้นแบบวิศวกรของเราใช้ SolidWorks และ Rhino 3D สําหรับการสร้างแบบจําลองผลิตภัณฑ์ ช่วยให้ลูกค้าตรวจสอบทุกรายละเอียด — ตั้งแต่โปรไฟล์ท่อไปจนถึงการจัดวางคอนโซล — ก่อนตัดสินใจลงมือผลิต
      features:
        - การสร้างโมเดล CAD 3D เต็มรูปแบบใน SolidWorks และ Rhino 3D
        - การเรนเดอร์สมจริงสําหรับงานนําเสนอของลูกค้า
        - ชุดแบบทางเทคนิคสําหรับการผลิต
        - การออกแบบแม่พิมพ์และเครื่องมือจากโมเดล 3 มิติ
        - การถ่ายโอนข้อมูล CAD เป็นCNCข้อมูลโดยตรงเพื่อการตัดอย่างแม่นยํา
    - title: การสร้างต้นแบบและการทดสอบ
      description: ก่อนการผลิตจํานวนมาก ผลิตภัณฑ์ใหม่ทุกชิ้นจะผ่านขั้นตอนต้นแบบเราสร้างต้นแบบที่ใช้งานได้จริงเพื่อประเมินจากลูกค้า จากนั้นนําไปทดสอบตามกระบวนการทดสอบเต็มรูปแบบ — การทดสอบแรงดัน การทดสอบความเสถียร การทดสอบโหลด และการทดลองน้ําการออกแบบซ้ําในขั้นตอนต้นแบบรวดเร็วและคุ้มค่า
      features:
        - เครื่องมือต้นแบบรวดเร็ว (ใช้เวลาดําเนินการ 15-20 วัน)
        - ต้นแบบฟังก์ชันสําหรับการประเมินผลในโลกจริง
        - โปรโตคอลการทดสอบเต็มรูปแบบก่อนการอนุมัติการผลิต
        - การปรับปรุงการออกแบบแบบวนซ้ําโดยอิงจากผลการทดสอบ
        - เป้าหมายการอนุมัติจากลูกค้าก่อนเครื่องมือผลิต
    - title: การผสานรวมอุปกรณ์เสริมแบบกําหนดเอง
      description: OEM หลายโครงการต้องการการผสานรวมอุปกรณ์เสริมที่ลูกค้าจัดหาให้หรือจากบุคคลที่สาม เช่น คอนโซลสั่งทําพิเศษ ที่นั่งเฉพาะทาง ระบบอิเล็กทรอนิกส์ ขาตั้งอุปกรณ์ดําน้ํา หรือองค์ประกอบแบรนด์ทีมวิศวกรรมของเราดูแลการออกแบบการบูรณาการ การปรับโครงสร้าง และการตรวจสอบคุณภาพของอุปกรณ์เสริมทั้งหมด
      features:
        - การออกแบบคอนโซลและการจัดวางแผงมาตรวัด
        - การผสานรวมที่นั่งและเบาะแบบกําหนดเอง
        - การออกแบบระบบอิเล็กทรอนิกส์และการเดินสาย
        - ระบบติดตั้งอุปกรณ์ดําน้ําและกู้ภัย
        - ข้อกําหนดด้านแบรนด์และการใช้งานกราฟิก
content_process:
  tagline: กระบวนการพัฒนา
  title: จากแนวคิด<br />ไปยังการผลิต
  subtitle: กระบวนการพัฒนาผลิตภัณฑ์ของเราดําเนินไปตามกระบวนการทํางาน 6 ขั้นตอนที่มีโครงสร้าง ออกแบบมาเพื่อลดความเสี่ยง ย่อระยะเวลา และรับประกันความพร้อมในการผลิตตั้งแต่วันแรก
  stages:
    - stage: '01'
      title: ข้อกําหนดและการวิจัย
      duration: 1-2 สัปดาห์
      description: เราทํางานร่วมกับลูกค้าเพื่อกําหนดข้อกําหนดของผลิตภัณฑ์ ข้อกําหนดตลาดเป้าหมาย ความต้องการปฏิบัติตามกฎระเบียบ และวัตถุประสงค์ทางการค้าขั้นตอนนี้จะจัดทําเอกสารข้อกําหนดผลิตภัณฑ์ (PRD) ซึ่งเป็นแนวทางสําหรับงานทั้งหมดที่ตามมา
      deliverables: PRD, การวิเคราะห์ตลาด, ดัชนีเปรียบเทียบคู่แข่ง, ประมาณการต้นทุนเบื้องต้น
    - stage: '02'
      title: การออกแบบแนวคิด
      duration: 2-3 สัปดาห์
      description: ทีมออกแบบอุตสาหกรรมพัฒนาคอนเซ็ปต์ผลิตภัณฑ์ตามเอกสาร PRD มีการนำเสนอทางเลือกการออกแบบหลายแบบพร้อมการเรนเดอร์ 3 มิติ คำแนะนำเกี่ยวกับวัสดุ และการประเมินวิศวกรรมเบื้องต้น ลูกค้าเลือกทิศทางสำหรับการพัฒนารายละเอียด
      deliverables: การเรนเดอร์แนวคิด 3 มิติ, ข้อมูลวัสดุ, เหตุผลด้านการออกแบบ, บัญชีวัสดุเบื้องต้น
    - stage: '03'
      title: วิศวกรรมเชิงละเอียด
      duration: 2-4 สัปดาห์
      description: แนวคิดที่เลือกได้รับการออกแบบอย่างครบถ้วน — การสร้างแบบจำลอง CAD 3 มิติ การวิเคราะห์โครงสร้าง การกำหนดค่าท่อ การออกแบบตัวเรือ การรวมอุปกรณ์เสริม และเอกสารการผลิต ขนาด วัสดุ และกระบวนการทั้งหมดถูกระบุสำหรับเครื่องมือ
      deliverables: โมเดล CAD 3 มิติเต็มรูปแบบ แบบร่างวิศวกรรม รายการวัสดุสุดท้าย (BOM) ข้อกำหนดเครื่องมือ แผนการควบคุมคุณภาพ (QC)
    - stage: '04'
      title: การสร้างต้นแบบ
      duration: 2-3 สัปดาห์
      description: เครื่องมือต้นแบบถูกผลิตขึ้นและตัวอย่างที่ใช้งานได้ถูกสร้าง ลูกค้าตรวจสอบต้นแบบเทียบกับสเปค PRD การทดสอบดำเนินการตามระเบียบปฏิบัติที่ตกลงกัน การปรับเปลี่ยนการออกแบบทำขึ้นตามข้อเสนอแนะก่อนการผลิตเครื่องมือ
      deliverables: ต้นแบบการทำงาน รายงานการทดสอบ บันทึกการแก้ไขการออกแบบ เอกสารลงนามของลูกค้า
    - stage: '05'
      title: เครื่องมือตัดเฉพาะสำหรับการผลิต
      duration: 2-3 สัปดาห์
      description: เมื่อแบบต้นแบบได้รับการอนุมัติแล้ว เครื่องมือการผลิตจะถูกว่าจ้าง — แม่พิมพ์ แม่พิมพ์เชื่อม โปรแกรมตัด อุปกรณ์ประกอบ เอกสาร QC และเกณฑ์การตรวจสอบจะถูกสรุปขั้นสุดท้าย การทดลองผลิตจะดำเนินการเพื่อตรวจสอบความถูกต้องของกระบวนการ
      deliverables: เครื่องมือการผลิต เอกสารกระบวนการ แผนการตรวจสอบคุณภาพ รายงานการทดลองผลิต
    - stage: '06'
      title: การผลิตจำนวนมากและการควบคุมคุณภาพ
      duration: กําลังดําเนินอยู่
      description: การผลิตเต็มรูปแบบเริ่มต้นด้วยการควบคุมคุณภาพระหว่างกระบวนการในทุกขั้นตอน ชิ้นงานตัวอย่างแรกจะถูกตรวจสอบและอนุมัติก่อนการปล่อยชุดการผลิต การติดตามคุณภาพอย่างต่อเนื่อง การติดตามข้อบกพร่อง และการปรับปรุงอย่างต่อเนื่องตลอดวงจรการผลิต
      deliverables: ตารางการผลิต รายงาน QC บันทึกการติดตามล็อต เอกสารการจัดส่ง
content_customization:
  tagline: ตัวเลือกการปรับแต่ง
  title: สิ่งที่อาจเป็น<br />ปรับแต่งตามต้องการ
  subtitle: แทบทุกด้านของผลิตภัณฑ์ของเราสามารถปรับแต่งให้ตรงตามความต้องการของลูกค้า ด้านล่างนี้คือหมวดหมู่การปรับแต่งที่พบบ่อยที่สุด
  columns: 3
  items:
    - title: ตัวเรือและโครงสร้าง
      description: ความยาวตัวเรือ แบบความกว้างลำตัว มุมเดดไรส์ เส้นผ่านศูนย์กลางหลอด การจัดเรียงห้อง และเกรดวัสดุ
      icon: tabler:sailboat
    - title: สีและกราฟิก
      description: สีของท่อยาง (PVC/Hypalon), สีเจลโค้ทตัวเรือ, สีคอนโซล, กราฟิกบนดาดฟ้า, การวางโลโก้ และการออกแบบบรรจุภัณฑ์
      icon: tabler:palette
    - title: คอนโซลและการควบคุม
      description: คอนโซลกลาง คอนโซลข้าง หรือการบังคับเลี้ยวด้วยพวงมาลัยแบบทิลเลอร์ การจัดวางแผงหน้าปัดอุปกรณ์แบบกำหนดเอง การวางสวิตช์ และตำแหน่งหัวเรือ
      icon: tabler:steering-wheel
    - title: ที่นั่งและการบุผ้า
      description: เบาะนั่งแบบจ๊อกกี้, ที่นั่งแบบม้านั่ง, บุผ้าหรูหรา, การเย็บที่เข้ากับสี, การปรับพับหรือถอดได้
      icon: tabler:armchair
    - title: อุปกรณ์และเครื่องมือ
      description: บันไดดำน้ำ แร็คถัง พิลอนลาก หลังคา T หลังคา Bimini ระบบเสียง อุปกรณ์อิเล็กทรอนิกส์นำทาง และอุปกรณ์ความปลอดภัย
      icon: tabler:backpack
    - title: บรรจุภัณฑ์ & แบรนด์
      description: บรรจุภัณฑ์ค้าปลีกแบบกำหนดเอง, กล่องแบรนด์ส่วนตัว, กล่องขนส่งพร้อมเครื่องหมายแบรนด์, ป้ายแขวน, และคู่มือผู้ใช้เป็นภาษาของลูกค้า
      icon: tabler:box
content_industries:
  tagline: การประยุกต์ใช้อุตสาหกรรม
  title: โซลูชันวิศวกรรม<br />แบ่งตามอุตสาหกรรม
  subtitle: ทีมวิศวกรรมของเราได้พัฒนาผลิตภัณฑ์สำหรับการใช้งานทางทะเลที่หลากหลายแต่ละประเภทมีความต้องการและเกณฑ์ประสิทธิภาพที่แตกต่างกัน
  columns: 3
  items:
    - title: การดำเนินการดำน้ำ
      description: ดาดฟ้าที่เสริมแรง, การรวมบันไดดำน้ำ, ระบบเก็บถังอากาศ, และแพลตฟอร์มที่มั่นคงสำหรับศูนย์ดำน้ำเชิงพาณิชย์ทั่วโลก
      icon: tabler:lifebuoy
    - title: การกู้ภัย & ฉุกเฉิน
      description: การออกแบบตัวเรือความเร็วสูง, ดาดฟ้าระบายน้ำเอง, ระบบติดตั้งอุปกรณ์, และการจัดหลายห้องเพื่อความปลอดภัยสำหรับปฏิบัติการกู้ภัยและฉุกเฉิน
      icon: tabler:alert-triangle
    - title: การท่องเที่ยวทางทะเล
      description: การจัดวางเพื่อความสะดวกสบายของผู้โดยสาร, การรวมร่มเงา, ระบบขึ้นลงเรือ, และการจัดวางที่ประหยัดน้ำมันสำหรับการเดินทางระหว่างเกาะ
      icon: tabler:beach
    - title: เรือยอชต์เล็ก
      description: การออกแบบกะทัดรัดเพื่อเก็บในกว้าน, ตัวเลือกการตกแต่งหรู, สีที่ตรงกับเรือแม่, และสมรรถนะการลากสูง
      icon: tabler:sailboat
    - title: การประมง & การเพาะเลี้ยงสัตว์น้ำ
      description: การจัดวางดาดฟ้าแบน, การรวมถังเลี้ยงสัตว์น้ำ, การจัดที่วางเบ็ด, อุปกรณ์ทนต่อการกัดกร่อนสำหรับการสัมผัสน้ำทะเลอย่างต่อเนื่อง
      icon: tabler:fish
    - title: ท่าเรือ & อุตสาหกรรม
      description: การเสริมแรงตัวเรือสำหรับงานหนัก, การจัดวางเรือทำงาน, การจัดวางการขนส่งบุคลากร, และการรวมอุปกรณ์สำหรับปฏิบัติการนอกชายฝั่ง
      icon: tabler:ship
