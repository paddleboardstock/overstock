hero:
  tagline: พลังงานนอกชายฝั่ง
  title: RIB เรือทํางาน<br />สําหรับการดําเนินงานพลังงานนอกชายฝั่ง
  subtitle: ออกแบบมาอย่างหนักRIBsสําหรับการสนับสนุนแท่นขุดเจาะน้ํามันและก๊าซนอกชายฝั่ง การโอนย้ายทีมงานฟาร์มกังหันลม การตรวจสอบสายเคเบิลใต้ทะเล และการก่อสร้างทางทะเล — โดยความปลอดภัยและความน่าเชื่อถือเป็นสิ่งที่ไม่สามารถต่อรองได้
