content_challenge:
  tagline: ความท้าทาย
  title: ความต้องการพลังงานนอกชายฝั่ง<br />ความน่าเชื่อถือในสภาพแวดล้อมสุดขีด
  subtitle: การดําเนินงานด้านพลังงานนอกชายฝั่งผลักดันอุปกรณ์ไปถึงขีดสุด — สภาพอากาศสุดขั้ว สถานที่ห่างไกล รอบการทํางานต่อเนื่อง และไม่ยอมรับความล้มเหลวโดยเด็ดขาด
  paragraphs:
    - อุตสาหกรรมพลังงานนอกชายฝั่งดําเนินงานในสภาพแวดล้อมทางทะเลที่ท้าทายที่สุดบนโลกเรือทํางานสนับสนุนแท่นขุดเจาะน้ํามันและก๊าซ การติดตั้งกังหันลม การดําเนินงานสายเคเบิลใต้ทะเล และโครงการก่อสร้างทางทะเล — มักอยู่ในสภาพทะเลเปิดที่มีช่วงเวลาสภาพอากาศจํากัดความล้มเหลวของอุปกรณ์ไม่เพียงแต่มีค่าใช้จ่ายสูง แต่ยังเป็นอันตรายด้วย
    - '**ความปลอดภัยเป็นสิ่งสําคัญสูงสุด** — เรือที่ถ่ายโอนลูกเรือต้องปฏิบัติการอย่างปลอดภัยในสภาพทะเลที่อาจหยุดชะงักการดําเนินงานอื่น ๆความมั่นคง ณ จุดถ่ายโอน สมรรถนะเครื่องยนต์ที่เชื่อถือได้ในทุกสภาพอากาศ และโครงสร้างที่แข็งแรงสําหรับการเทียบท่าซ้ํากับโครงสร้างนอกชายฝั่งเป็นข้อกําหนดที่จําเป็น'
    - '**ความสามารถในการทํางานทุกสภาพอากาศเป็นสิ่งสําคัญ** — ฟาร์มกังหันลมและแท่นขุดเจาะน้ํามันนอกชายฝั่งเปิดให้บริการตลอดทั้งปีเรือทํางานต้องทํางานได้ดีในทะเลที่มีคลื่นแรง ลมแรง และทัศนวิสัยจํากัดการปฏิบัติการทั้งกลางวันและกลางคืนต้องการชุดนําทางครบครันและระบบไฟส่องสว่างที่เชื่อถือได้'
    - '**ภาคพลังงานลมนอกชายฝั่งเติบโตอย่างรวดเร็ว** — มีการติดตั้งกังหันลมใหม่นับพันเครื่องทั่วโลก โดยแต่ละเครื่องต้องการการย้ายลูกเรืออย่างสม่ําเสมอ การขนส่งเครื่องมือ และการสนับสนุนการบํารุงรักษาสิ่งนี้สร้างความต้องการอย่างต่อเนื่องสําหรับเรือถ่ายโอนลูกเรือ (CTV) ที่สร้างขึ้นเพื่อวัตถุประสงค์เฉพาะ และการสนับสนุนRIBs'
    - พลังงานPaddle Board Overstockนอกชายฝั่งRIBsถูกออกแบบด้วยตัวเรือ Deep-V เสริมความแข็งแรง Hypalon ท่อขนาดใหญ่ ชุดนําทางครบชุด และระบบความปลอดภัยที่ออกแบบมาเพื่อรองรับสภาพแวดล้อมที่รุนแรงของการดําเนินงานพลังงานนอกชายฝั่ง
content_solution:
  tagline: โซลูชันของเรา
  title: เรือนอกชายฝั่งRIBsที่ออกแบบมาโดยเฉพาะ<br />สําหรับอุตสาหกรรมพลังงาน
  subtitle: Paddle Board Overstock พลังงานนอกชายฝั่งทุกชนิดRIBถูกออกแบบมาเพื่อการดําเนินงานที่ปลอดภัยและเชื่อถือได้ในสภาพทะเลสุดขั้ว — ตั้งแต่ทะเลเหนือไปจนถึงเอเชียตะวันออกเฉียงใต้
  list:
    - ตัวเรือ Deep-V เสริมความแข็งแรงเพื่อประสิทธิภาพในน้ําขรุขระและการควบคุมที่คาดการณ์ได้
    - ท่อทนทานและHypalon UV ทนต่อสารเคมี เพื่อการใช้งานนอกชายฝั่งเป็นเวลานาน
    - ฮาร์ดแวร์สแตนเลส 316 — ไม่เกิดการกัดกร่อนจากการสัมผัสน้ําเค็มต่อเนื่อง
    - 'ชุดระบบนําทางครบครัน: GPS, เรดาร์, VHF, ไฟนําทางกลางคืน — เป็นมาตรฐานในรุ่นนอกชายฝั่ง'
    - ดาดฟ้าแบบตักน้ําอัตโนมัติเพื่อความปลอดภัยในสภาพทะเลขึ้นเรือ
    - มีหลายรูปแบบเครื่องยนต์ — เครื่องยนต์นอกลําเดี่ยวหรือคู่เพื่อความซ้ําซ้อนภารกิจ
    - เสาลากและคลีตสําหรับงานหนักสําหรับการจัดการแท่นและทุ่น
    - สีของท่อที่มองเห็นได้ชัดเจนสําหรับการระบุในไซต์งานนอกชายฝั่ง
content_segments:
  tagline: โปรไฟล์พลังงาน
  title: โซลูชันพลังงานนอกชายฝั่ง<br />ตามประเภทแอปพลิเคชัน
  subtitle: ภาคพลังงานนอกชายฝั่งต่าง ๆ มีความต้องการเรือทํางานที่แตกต่างกัน — ตั้งแต่การสนับสนุนแพลตฟอร์ม RIBs ไปจนถึงเครื่อง CTV ฟาร์มกังหันลม และเรือตรวจสอบใต้น้ํา
  items:
    - title: การสนับสนุนแพลตฟอร์มน้ํามันและก๊าซนอกชายฝั่ง
      subtitle: การถ่ายโอนลูกเรือ, การจัดหาอุปกรณ์, การสํารองความปลอดภัยของแพลตฟอร์ม
      description: แท่นขุดเจาะน้ํามันและก๊าซต้องเปลี่ยนลูกเรือทุกวัน ขนส่งอุปกรณ์และเสบียง และต้องมีการสํารองความปลอดภัยเรือทํางานต้องปฏิบัติงานอย่างปลอดภัยรอบโครงสร้างแท่นขุดเจาะ ในกระแสน้ําแรงและสภาพทะเลที่เปลี่ยนแปลง และรักษาตําแหน่งอย่างแม่นยําระหว่างการถ่ายโอนบุคลากรผ่านบันไดหรือทางเดินสภาพแวดล้อมที่รุนแรง — ไฮโดรคาร์บอน สารเคมี ละอองเกลือตลอดเวลา — ต้องการโครงสร้างที่ทนต่อการกัดกร่อนและประสิทธิภาพที่เชื่อถือได้
      features:
        - การจัดวางการถ่ายโอนลูกเรือพร้อมการเข้าถึงขึ้นเรือที่ปลอดภัยและราวจับ
        - ท่อที่ทนต่อการกัดกร่อนHypalonและฮาร์ดแวร์สแตนเลส 316
        - แถบกันชนเสริมความแข็งแรงสําหรับการสัมผัสกันชนกับซุ้มล้อแพลตฟอร์มบ่อยครั้ง
        - พื้นระเบียงแบบน้ําอัดน้ําอัตโนมัติสําหรับน้ํามันและการล้างด้วยสารเคมี
        - ถังน้ํามันความจุสูงสําหรับระยะทางการใช้งานนอกชายฝั่งที่กว้างขึ้น
        - ตัวเลือกเครื่องยนต์คู่สําหรับความซ้ําซ้อนที่สําคัญต่อภารกิจ
    - title: การดําเนินงานฟาร์มกังหันลมนอกชายฝั่ง
      subtitle: การย้ายทีมงาน การบํารุงรักษากังหัน การขนส่งเครื่องมือ
      description: กังหันลมนอกชายฝั่งเป็นภาคส่วนที่เติบโตเร็วที่สุดในพลังงานทางทะเลผู้ปฏิบัติงานต้องการเรือถ่ายโอนลูกเรือ (CTV) ที่สามารถถ่ายโอนช่างเทคนิคไปยังแพลตฟอร์มเข้าถึงกังหันลมในสภาพทะเลที่มีคลื่นสูงถึง 1.5 เมตรได้อย่างปลอดภัยความมั่นคงระหว่างการถ่ายโอน ความสามารถในการทํางานในทุกสภาพอากาศ และการดําเนินงานประจําวันที่เชื่อถือได้เป็นสิ่งสําคัญเรือบริการฟาร์มกังหันลมทํางานตามตารางเวลาที่เข้มงวด — การหยุดทํางานใด ๆ จะทําให้การเริ่มใช้งานหรือบํารุงรักษากังหันล่าช้า ส่งผลโดยตรงต่อรายได้จากการผลิตพลังงาน
      features:
        - รูปทรงตัวเรือที่ปรับแต่งให้เหมาะสมเพื่อการถ่ายโอนลูกเรือที่ฐานกังหันอย่างมั่นคง
        - ทางเข้า Deep-V เพื่อความสบายในการขี่ในคลื่นและคลื่นทะเล
        - ป้องกันสภาพอากาศอย่างเต็มที่ — คอนโซลหรือห้องควบคุมแบบปิดเพื่อความสบายของลูกเรือ
        - พื้นที่ดาดฟ้าสําหรับเครื่องมือ อะไหล่ และอุปกรณ์บริการ
        - แพ็กเกจปฏิบัติการกลางคืนสําหรับกะฤดูหนาวที่จํากัดเวลากลางวันเป็นเวลานาน
        - การทํางานนอกเรือที่เงียบ เพื่อผลกระทบจากเสียงรบกวนต่อสิ่งแวดล้อมทางทะเลน้อยที่สุด
    - title: การสนับสนุนสายเคเบิลใต้ทะเลและท่อส่ง
      subtitle: การตรวจสอบ การบํารุงรักษา การสนับสนุน ROV และการสํารวจ
      description: ผู้ปฏิบัติงานสายเคเบิลและท่อใต้ทะเลต้องการเรือทํางานสําหรับการตรวจสอบเส้นทาง สนับสนุนการบํารุงรักษา การดําเนินงาน ROV และงานสํารวจเรือเหล่านี้ต้องการแพลตฟอร์มที่มั่นคงสําหรับการติดตั้งและกู้คืนอุปกรณ์ใต้น้ํา การควบคุมที่แม่นยําในความเร็วต่ําสําหรับการติดตามสายเคเบิล และการดําเนินงานที่เชื่อถือได้ทั้งในสภาพแวดล้อมชายฝั่งและนอกชายฝั่งความมั่นคงของเรือมีความสําคัญต่อความแม่นยําของโซนาร์และอุปกรณ์สํารวจ
      features:
        - แพลตฟอร์มที่เสถียรด้วยความเร็วต่ําสําหรับการติดตามสายเคเบิลและงานสํารวจ
        - การจัดวางดาดฟ้าเปิดสําหรับการปล่อย ROV, ม้วนสายเคเบิล และอุปกรณ์สํารวจ
        - แผ่นติดตั้งอุปกรณ์สำหรับโซนาร์, GPS และอุปกรณ์สำรวจ
        - ตัวเรือแบบลดคลื่นเพื่อลดการรบกวนพื้นทะเลในระหว่างการตรวจสอบ
        - การบังคับเลี้ยวความเร็วต่ำอย่างแม่นยำด้วยพวงมาลัยนอกเรือตอบสนองเร็ว
    - title: วิศวกรรมและการสนับสนุนงานก่อสร้างทางทะเล
      subtitle: การขนส่งบุคลากร, การจัดส่งวัสดุ, การสนับสนุนการดำน้ำ
      description: ผู้รับเหมาด้านวิศวกรรมทางทะเลที่ทำงานในโครงการก่อสร้างท่าเรือ, การป้องกันชายฝั่ง และการติดตั้งนอกชายฝั่งต้องการเรือทำงานที่หลากหลายสำหรับการขนส่งบุคลากรระหว่างเรือก่อสร้างกับฝั่ง, จัดส่งวัสดุและเครื่องมือ, สนับสนุนการดำน้ำ และสำรวจไซต์งาน เรือเหล่านี้ทำงานในโซนก่อสร้างที่มีเรือหลายลำ, พื้นที่บังคับเลี้ยวจำกัด, และสภาพทะเลที่หลากหลาย ความทนทานและความอเนกประสงค์เป็นสิ่งสำคัญ
      features:
        - การออกแบบดาดฟ้าอเนกประสงค์สำหรับบุคลากร, วัสดุ และอุปกรณ์ดำน้ำ
        - บันไดดำน้ำและการติดตั้งอุปกรณ์สำหรับการสนับสนุนปฏิบัติการดำน้ำ
        - เคลือบผิวแข็งและเสาเทียบท่าหนักเพื่อการบังคับเรือในไซต์งานก่อสร้าง
        - โครงสร้าง Hypalon แข็งแรงเพื่อทนต่อเศษซากการก่อสร้างและการขัดสี
        - การจัดวางที่นั่งที่ยืดหยุ่น — สำหรับขนส่งลูกเรือหรือโหมดขนส่งสินค้า
cta:
  title: ปรับแต่งพลังงานนอกชายฝั่งของคุณ RIB
  subtitle: บอกเราถึงสภาพแวดล้อมการปฏิบัติงาน, ความสามารถของลูกเรือ และโปรไฟล์ภารกิจ — เราจะแนะนำการปรับแต่งที่เหมาะสมที่สุดสำหรับการดำเนินงานพลังงานนอกชายฝั่งของคุณ
  actions:
    - variant: primary
      text: ขอราคาออฟชอร์
      href: /contact
    - text: ดูรุ่น RIB
      href: /products
