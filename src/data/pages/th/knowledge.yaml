hero:
  tagline: กราฟความรู้
  title: ความรู้เกี่ยวกับการสำรวจน้ำ
  subtitle: |
    ฐานความรู้ที่มีโครงสร้างครอบคลุมเทคโนโลยี SUP แบบพองลม,<br />
    ความปลอดภัยทางน้ำ วิศวกรรมเรือ และการวางแผนการผจญภัย
  taglineSection: สำรวจ เรียนรู้ ไปด้วยความมั่นใจ
clusters:
  tagline: คลัสเตอร์ความรู้
  title: สำรวจตามหัวข้อ
  subtitle: เจาะลึกเทคโนโลยี ความปลอดภัย และทักษะเบื้องหลังผลิตภัณฑ์ Aquafarer ทุกชิ้น
  items:
    - title: ความรู้ SUP
      description: ตั้งแต่การเลือกกระดานครั้งแรกของคุณไปจนถึงเทคนิคการท่องเที่ยวขั้นสูง — ทุกสิ่งเกี่ยวกับการพายบอร์ดยืนขึ้น
      icon: tabler:lifebuoy
      topics:
        - วิธีการเลือก SUP แบบเป่าลมชิ้นแรกของคุณ
        - ขนาด SUP ที่ดีที่สุดสำหรับผู้เริ่มต้น
        - การพายเรือยืนบนกระดานยากแค่ไหน?
        - การเปรียบเทียบระหว่างบอร์ดพองลมกับบอร์ดแข็ง
        - SUP รายการตรวจสอบความปลอดภัย
    - title: ความรู้เกี่ยวกับเรือ
      description: คู่มือทางเทคนิคเกี่ยวกับเรือยาง RIBs เรือเล็ก และเรือคายัค — วิศวกรรม วัสดุ และการใช้งาน
      icon: tabler:sailboat
      topics:
        - ประเภทของเรือยางที่อธิบาย
        - การเปรียบเทียบ PVC กับ Hypalon
        - RIB กับ การเปรียบเทียบ Dinghy
        - การสำรวจเชิงลึกด้านเทคโนโลยี Drop-stitch
        - คู่มือวิทยาศาสตร์วัสดุทางทะเล
    - title: ความรู้ด้านความปลอดภัย
      description: ความรู้ด้านความปลอดภัยที่จำเป็นสำหรับผู้พายเรือทุกคน — ตั้งแต่การเลือก PFD การอ่านสภาพอากาศ ไปจนถึงเทคนิคการช่วยเหลือตัวเอง
      icon: tabler:shield
      topics:
        - SUP รายการตรวจสอบความปลอดภัย
        - คุณต้องการเสื้อชูชีพไหม?
        - คู่มือความปลอดภัยในการพายเรือในมหาสมุทร
        - ความปลอดภัยในแม่น้ำสำหรับเรือคายัคแบบพองลม
        - ความตระหนักเกี่ยวกับสภาพอากาศและน้ำ
    - title: เทคโนโลยี
      description: วิศวกรรมเบื้องหลังผลิตภัณฑ์ Aquafarer — วัสดุ, วิธีการก่อสร้าง, และการทดสอบคุณภาพ
      icon: tabler:microscope
      topics:
        - เทคโนโลยีระดับเรือPVC
        - Drop-stitch คําอธิบายแกนกลาง
        - เหตุผลPSIที่สําคัญสําหรับอุปกรณ์SUPsเป่าลม
        - การเชื่อม RF เทียบกับการยึดติดด้วยกาว
        - การทดสอบคุณภาพและการรับรอง
    - title: ความรู้ทางธุรกิจ
      description: คู่มือเชิงพาณิชย์สําหรับการสร้างและขยายธุรกิจกีฬาทางน้ําของคุณ — ตั้งแต่การให้เช่าไปจนถึงการสร้างแบรนด์แบรนด์ส่วนตัว
      icon: tabler:briefcase
      topics:
        - วิธีเริ่มต้นSUPธุรกิจให้เช่า
        - การสร้างศูนย์กีฬาทางน้ําของรีสอร์ท
        - ขนาดเรือพายบอร์ดสําหรับสโมสร
        - เป่าลมกับแบบแข็งSUPสําหรับการใช้งานเชิงพาณิชย์
        - วัสดุเรือคายัคที่ดีที่สุดสําหรับกองเรือเช่า
        - เริ่มต้นแบรนด์น้ําแบรนด์ส่วนตัว
        - กลยุทธ์รายได้จากกีฬาทางน้ําของรีสอร์ท
        - คู่มือการบํารุงรักษาอุปกรณ์เชิงพาณิชย์
