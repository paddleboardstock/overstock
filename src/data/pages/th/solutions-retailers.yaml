hero:
  tagline: โซลูชันสําหรับผู้ค้าปลีก
  title: กระดานพายสําหรับร้านค้าปลีก —<br />เติมสต็อกบอร์ดสินค้าคงคลังในร้านของคุณ SUP
  subtitle: จําหน่ายส่งบอร์ดเป่าลมใหม่เอี่ยมสําหรับธุรกิจขนาดเล็ก SUP สําหรับร้านค้าริมชายหาด ผู้ขายออนไลน์ และร้านค้าปลีกกีฬาเริ่มต้นที่ 5 บอร์ด ผสมรุ่นที่มีในสต็อก และจัดส่งไปยัง 50+ ประเทศ
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: บอร์ดเป่าลมสินค้าใหม่เอี่ยม SUP พร้อมวางขายในร้านค้าปลีก
direct_answer: Paddle Board Overstock จัดส่งกระดานเป่าลมใหม่เอี่ยมที่มีสต็อกเหลืออยู่SUP ให้กับร้านค้าปลีกอิสระทั่วโลกคําสั่งซื้อขายส่งเริ่มต้นที่เพียง 5 แผ่น และคุณสามารถผสมรุ่นที่มีในสต็อกใดก็ได้ในการจัดส่งครั้งเดียว — ดังนั้นร้านเล็ก ๆ สามารถเติมแผ่นบอร์ดแบบครบวงจร กระดานทัวร์ และซีรีส์ศิลปะโดยไม่ต้องเติมตู้คอนเทนเนอร์แผ่นไม้ทุกชิ้นผ่านการทดสอบแรงดัน 100% ก่อนจัดส่งและครอบคลุมการรับประกัน 2 ปีSUP คําสั่งซื้อจัดส่งจากฐานของเราที่เว่ยไห่ ประเทศจีน โดยขนส่งด่วนทางอากาศหรือขนส่งทางทะเลรวมไปยังมากกว่า 50 ประเทศ
tldr_label: คําตอบด่วนสําหรับร้านค้าปลีก
packages_section:
  badge: Retail Stock Packages
  title: เติมสต็อกร้านของคุณตามประเภทธุรกิจ
  subtitle: ตั้งแต่ร้านค้าริมชายหาดไปจนถึงร้านค้าออนไลน์ — การสั่งซื้อเริ่มต้นที่ยืดหยุ่นซึ่งออกแบบมาสําหรับผู้ค้าปลีกอิสระ
solution_offerings:
  - title: สต็อกเริ่มต้นร้านชายหาดและเซิร์ฟ
    subtitle: สําหรับร้านค้าปลีกชายฝั่งที่ให้บริการนักท่องเที่ยวและคนท้องถิ่น
    badge: Popular
    features:
      - title: คําสั่งซื้อเริ่มต้นขนาดเล็ก
        description: เริ่มต้นด้วยบอร์ด 5 แผ่นและเติมสต็อกเมื่อฤดูกาลเพิ่มขึ้น — ไม่ต้องผูกมัดกับตู้คอนเทนเนอร์
      - title: หนังสือขายดีหลากหลายประเภท
        description: รวมบอร์ดอเนกประสงค์ที่มั่นคงสําหรับมือใหม่และบอร์ดสไตล์เซิร์ฟสําหรับคนท้องถิ่นในคําสั่งซื้อเดียว
      - title: แพ็กเกจครบวงจร
        description: บอร์ดทุกใบมาพร้อมกับชุดอุปกรณ์เสริมครบครัน — ไม้พาย ปั๊ม สายจูง และกระเป๋าพร้อมวางบนชั้นวาง
      - title: ตัวเลือกเติมสินค้าอย่างรวดเร็ว
        description: Express air freight จะได้รับบอร์ดเติมสินค้า 1–3 แผ่นถึงหน้าประตูบ้านอย่างรวดเร็วเมื่อรุ่นหนึ่งขายหมด
      - title: สต็อกพร้อมแสดงสินค้า
        description: บอร์ดใหม่เอี่ยมที่ปิดผนึกจากโรงงาน นําเสนอได้ดีทั้งในร้านและออนไลน์
    cta_text: วางแผนสต็อกร้านของฉัน
    cta_href: /wholesale-paddle-boards#inquiry
  - title: สต็อกร้านค้าออนไลน์
    subtitle: สําหรับผู้ขายอีคอมเมิร์ซและตลาดกลาง
    badge: Growing
    features:
      - title: ทดสอบหมวดหมู่นี้อย่างประหยัด
        description: เริ่มต้นด้วยลําดับผสม 5 บอร์ดเพื่อเรียนรู้ว่าตลาดของคุณซื้อโมเดลไหนก่อนขยายขนาด
      - title: ความแตกต่างของซีรีส์ศิลปะ
        description: งาน EVA พิมพ์บล็อกและงานศิลปะที่โดดเด่นในรายการตลาด
      - title: สต็อกที่เหมาะกับการถ่ายภาพ
        description: ยูนิตใหม่ที่สม่ําเสมอ — ลูกค้าทุกคนจะได้รับป้ายแสดงในรายการ
      - title: ราคาตรงจากโรงงาน
        description: การจัดหาสินค้าล้นคลังช่วยให้ต้นทุนต่อหน่วยต่ำโดยไม่เสี่ยงต่อปริมาณ
      - title: ภูมิศาสตร์การจัดส่งตรงทั่วโลก
        description: จัดส่งไปยังคลังสินค้าหรือจุดบริการของคุณใน 50+ ประเทศ
    cta_text: วางแผนสินค้าคงคลังออนไลน์ของฉัน
    cta_href: /wholesale-paddle-boards#inquiry
  - title: ช่วงสินค้ากีฬาและกลางแจ้ง
    subtitle: สำหรับร้านกีฬาที่เพิ่มหมวดหมู่ SUP
    badge: Range
    features:
      - title: การจัดกลุ่มตามระดับ
        description: บอร์ดสำหรับผู้เริ่มต้นทั่วไป ทัวร์ริ่งระดับกลาง และบอร์ดศิลปะพรีเมียมเพื่อครอบคลุมราคาที่แตกต่างกัน
      - title: ความยืดหยุ่นตามฤดูกาล
        description: ขนาดการสั่งซื้อที่ตรงกับฤดูกาล — ไม่มีภาระสต็อกตลอดทั้งปี
      - title: การรับประกันสำรอง
        description: การรับประกัน SUP 2 ปี สนับสนุนสัญญาบริการหลังการขายของคุณ
      - title: สเปคชีต & สื่อ
        description: ข้อมูลจำเพาะของสินค้าและภาพประกอบเพื่อสนับสนุนการนำเสนอบนชั้นวางและแคตตาล็อก
      - title: ขนส่งทางทะเลรวม
        description: ค่าขนส่งประหยัดสำหรับคำสั่งซื้อจำนวนมากตามฤดูกาล
    cta_text: วางแผนช่วงสินค้าปลีกของฉัน
    cta_href: /wholesale-paddle-boards#inquiry
benefits_section:
  badge: Why Retailers Choose Overstock
  title: สร้างสำหรับร้านค้าปลีกอิสระ
benefits:
  - icon: package
    title: ขั้นต่ำในการสั่งซื้อต่ำ
    description: ขายส่งเริ่มที่ 5 บอร์ด — ขนาดสำหรับร้านค้าอิสระ ไม่ใช่ตู้คอนเทนเนอร์
  - icon: layers
    title: ผสมรุ่นใดก็ได้
    description: รวมบอร์ด SUP รุ่นที่มีอยู่ในสต็อกในคำสั่งเดียวกัน; จำนวนบอร์ดทั้งหมดจะกำหนดระดับราคาของคุณ
  - icon: shield-check
    title: สต็อกใหม่เอี่ยม
    description: บอร์ดทุกชิ้นเป็นสินค้าล้นคลังที่ยังไม่ใช้ — ทดสอบแรงกด 100% ก่อนจัดส่ง
  - icon: award
    title: การรับประกัน 2 ปี
    description: การรับประกัน SUP 2 ปีเดียวกันที่เรามอบให้ลูกค้าใน 50+ ประเทศ
