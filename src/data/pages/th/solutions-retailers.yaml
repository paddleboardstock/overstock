retail_pick:
  tagline: การเลือกสินค้าปลีก
  title: SUP ไพ่กระดานที่ขายดีในร้านค้า
  subtitle: คัดสรรเริ่มต้นของโมเดลสต็อกเกินที่เหมาะกับการขายปลีกที่สุด — กระดานที่มั่นคงสำหรับผู้เริ่มต้น กระดานชุดศิลปะที่โดดเด่น และกระดานขนาดกะทัดรัดสำหรับนักเดินทาง
