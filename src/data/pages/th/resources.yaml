hero_text:
  tagline: ทรัพยากร
  title: ศูนย์ดาวน์โหลดและคู่มือผู้ซื้อ
  subtitle: เข้าถึงแคตตาล็อกสินค้า OEM คู่มือ รายการตรวจสอบผู้ซื้อ และเอกสารทางเทคนิค เพื่อช่วยให้คุณตัดสินใจจัดซื้อได้อย่างมีข้อมูล
features3_downloads:
  tagline: ดาวน์โหลด
  title: เอกสารผลิตภัณฑ์<br />& ทรัพยากรสําหรับผู้ซื้อ
  isBeforeContent: false
  columns: 2
  items:
    - title: แคตตาล็อกสินค้าทางทะเลปี 2026
      description: สินค้าครบวงจร รวมถึงRIBเรือ เรือเป่าลม SUP กระดาน เรือคายัค และอุปกรณ์เสริมข้อมูลจําเพาะ การกําหนดค่า และตัวเลือกรูปแบบ PDF
      icon: tabler:file-text
    - title: OEM คู่มือการผลิต
      description: 'ทุกสิ่งที่คุณควรรู้ OEM/ODM ความร่วมมือ: ภาพรวมกระบวนการ, ปริมาณสั่งซื้อขั้นต่ํา, ตัวเลือกการปรับแต่ง, การควบคุมคุณภาพ และการจัดส่ง'
      icon: tabler:building-factory
    - title: RIB คู่มือผู้ซื้อเรือ
      description: 'วิธีเลือกที่เหมาะสมRIB: วัสดุตัวถัง วัสดุท่อ การเลือกเครื่องยนต์ การพิจารณาขนาด และตัวเลือกการกําหนดค่าสําหรับการใช้งานต่าง ๆ'
      icon: tabler:file-description
    - title: SUP รายการตรวจสอบซัพพลายเออร์
      description: ข้อควรพิจารณาสําคัญเมื่อเลือกSUPผู้ผลิตบอร์ด ได้แก่ ตัวชี้วัดคุณภาพ ข้อกําหนดการรับรอง MOQ ข้อควรพิจารณา และสิ่งที่ควรสังเกตในการตรวจสอบโรงงาน
      icon: tabler:clipboard-check
    - title: คู่มือวัสดุเรือเป่าลม
      description: 'PVC VSHypalon: การเปรียบเทียบความทนทาน UV ความต้านทาน อายุการใช้งาน ตัวเลือกการซ่อมแซม และต้นทุนสําหรับการใช้งานทางทะเลที่แตกต่างกัน'
      icon: tabler:files
    - title: เทมเพลตบรีฟการผลิตแบบกําหนดเอง
      description: ดาวน์โหลดเทมเพลตบรีฟสินค้าของเรากรอกข้อกําหนดของคุณและส่งคืนให้เราเพื่อประเมินราคาและประเมินความเป็นไปได้ในสัปดาห์เดียวกัน
      icon: tabler:template
faqs:
  title: คําถามที่พบบ่อย
  subtitle: คําถามที่พบบ่อยเกี่ยวกับผลิตภัณฑ์ กระบวนการผลิต และรูปแบบความร่วมมือของเรา
  columns: 2
  items:
    - title: ปริมาณขั้นต่ําในการสั่งซื้อคือเท่าไร?
      description: MOQ แตกต่างกันไปตามหมวดหมู่สินค้าRIBเรือโดยปกติเริ่มต้นที่ 10 หน่วยต่อรุ่นSUPบอร์ดเริ่มต้นที่ 50 หน่วยติดต่อทีมขายของเราเพื่อMOQขอข้อมูลเฉพาะผลิตภัณฑ์
      icon: tabler:help-circle
    - title: ฉันสามารถขอตัวอย่างก่อนสั่งซื้อได้หรือไม่?
      description: ใช่Paddle Board Overstockให้บริการตัวอย่างการผลิตเพื่อประเมินก่อนการผลิตจํานวนมากต้นทุนตัวอย่างสามารถต่อรองได้และมักจะนําไปหักในคําสั่งซื้อแรก
      icon: tabler:package
    - title: มีเงื่อนไขการชําระเงินอะไรบ้าง?
      description: เงื่อนไขมาตรฐานคือมัดจํา 30% เมื่อสั่งซื้อ และ 70% ก่อนจัดส่งเงื่อนไข LC มีให้สําหรับลูกค้าที่มีคุณสมบัติติดต่อทีมการเงินของเราเพื่อหารือเกี่ยวกับการจัดการ
      icon: tabler:currency-dollar
    - title: การผลิตใช้เวลานานแค่ไหน?
      description: 'ระยะเวลาการผลิตทั่วไป: RIB เรือ 30-45 วัน, SUP เรือบอร์ด 20-30 วัน, เรือเป่าลม 25-35 วันการพัฒนาตามสั่งจะเพิ่มเวลา 15-30 วันสําหรับการสร้างต้นแบบ'
      icon: tabler:calendar-clock
    - title: ผลิตภัณฑ์ของคุณมีใบรับรองอะไรบ้าง?
      description: CE การรับรองสําหรับตลาดสหภาพยุโรป การผลิตที่ได้รับการอนุมัติจากหน่วยยามฝั่งสหรัฐฯ ระบบ ISO คุณภาพ BSCI การปฏิบัติตามข้อกําหนด และการREACHปฏิบัติตามวัสดุ
      icon: tabler:certificate
    - title: คุณมีบริการแพ็กเกจและแบรนด์ตามสั่งหรือไม่?
      description: ใช่ เรามีบริการบรรจุภัณฑ์แบบกำหนดเองพร้อมโลโก้ สี และเอกลักษณ์แบรนด์ของคุณ MOQ สำหรับบรรจุภัณฑ์แบบกำหนดเองขึ้นอยู่กับประเภทของผลิตภัณฑ์
      icon: tabler:color-swatch
cta:
  title: ต้องการความช่วยเหลือในการหาทรัพยากรที่เหมาะสมหรือไม่?
  subtitle: ติดต่อทีมงานของเราสำหรับคำแนะนำส่วนบุคคลเกี่ยวกับการเลือกผลิตภัณฑ์, ความร่วมมือ OEM, หรือข้อกำหนดทางเทคนิค
  actions:
    - variant: primary
      text: ติดต่อทีมของเรา
      href: /contact
