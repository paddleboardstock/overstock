hero_text:
  tagline: ทรัพยากร
  title: ศูนย์ดาวน์โหลดและคู่มือพายเรือ
  subtitle: แคตตาล็อกสินค้า คู่มือการซื้อ และคําแนะนําการดูแล เพื่อช่วยให้คุณเลือก ใช้ และเพลิดเพลินกับบอร์ดเป่าลมของคุณ SUP
features3_downloads:
  tagline: ดาวน์โหลด
  title: เอกสารผลิตภัณฑ์<br />& ทรัพยากรสําหรับการพายเรือ
  isBeforeContent: false
  columns: 2
  items:
    - title: SUP แคตตาล็อกสินค้า ปี 2026
      description: 'มีครบทุก Paddle Board Overstock SUP ประเภท: บอร์ดครบวงจร, ซีรีส์ศิลปะ และอุปกรณ์เสริม พร้อมสเปกและเนื้อหาในแพ็กเกจครบถ้วนรูปแบบ PDF'
      icon: tabler:file-text
    - title: SUP คู่มือผู้ซื้อเป่าลม
      description: 'วิธีเลือกบอร์ดแรกของคุณ: ความยาว ความกว้าง ความหนา ปริมาตร น้ําหนักผู้ขับ และรูปทรงบอร์ดที่เหมาะกับสไตล์การพายของคุณ'
      icon: tabler:file-description
    - title: SUP คู่มือไซส์และขนาดที่เหมาะสม
      description: จับคู่ปริมาตรและขนาดของบอร์ดให้เหมาะสมกับน้ําหนักและระดับทักษะของคุณ พร้อมคําแนะนําเฉพาะกิจกรรมสําหรับกิจกรรมสันทนาการ ทัวร์ โยคะ และฟิตเนส
      icon: tabler:clipboard-check
    - title: คู่มือการดูแลและบํารุงรักษาบอร์ด
      description: 'รักษาบอร์ดของคุณให้เหมือนใหม่: ทําความสะอาด อบแห้ง เก็บรักษา UV ป้องกัน ดูแลวาล์ว และคําแนะนําการซ่อมแซมเล็กน้อย'
      icon: tabler:tool
    - title: คู่มือวัสดุกระดานเป่าลม
      description: PVC โครงสร้าง drop-stitch แกนกลาง EVA แผ่นรองพื้น และความหมายของความแข็งแรง 15 ต่อ PSI ประสิทธิภาพและความทนทาน
      icon: tabler:files
    - title: เริ่มต้นใช้งาน SUP
      description: 'พื้นฐานสําหรับนักพายมือใหม่: การพองลม, การถือ, การปล่อยเรือ, ท่าพายพื้นฐาน และสิ่งจําเป็นด้านความปลอดภัยเพื่อให้คุณยืนได้ตั้งแต่วันแรก'
      icon: tabler:swimming
faqs:
  title: คำถามที่พบบ่อย
  subtitle: คําถามที่พบบ่อยเกี่ยวกับบอร์ดของเรา การสั่งซื้อ และการขึ้นเรือ
  columns: 2
  items:
    - title: บอร์ดของฉันมีอะไรบ้าง?
      description: ทุกชุดประกอบด้วยบอร์ด ไม้พายปรับระดับ ปั๊มน้ําไหลสูง สายจูง ชุดซ่อม และกระเป๋าเป้ชุดไม้พายและปั๊มก็มีจําหน่ายแยกต่างหากเช่นกัน
      icon: tabler:package
    - title: เงินเฟ้อใช้เวลานานแค่ไหน?
      description: ด้วยปั๊มน้ําไหลสูงที่แถมมา ผู้พายส่วนใหญ่จะถึงแรงดันเต็มภายใน 8-12 นาทีปั๊มไฟฟ้าก็ใช้งานได้เช่นกัน — เพียงแค่หยุดที่แรงดันที่กําหนดไว้ใกล้วาล์ว
      icon: tabler:clock
    - title: ฉันจะเลือกบอร์ดที่เหมาะสมได้อย่างไร?
      description: 'เริ่มต้นด้วยน้ําหนักและสไตล์การพายของคุณ: ผู้เริ่มต้นและครอบครัวชอบแพลตฟอร์มกว้างและมั่นคงอย่าง SUP Explorer 11; นักพายโยคะชอบการยึดเกาะแบบเต็มดาดฟ้า; นักพายทัวร์ต้องการรูปร่างที่แข็งแรงและลู่ลมทีมงานของเรายินดีแนะนํา'
      icon: tabler:help-circle
    - title: คุณรับชําระเงินด้วยวิธีใดบ้าง?
      description: เรารับบัตรเครดิตหลัก, PayPal และการโอนเงินผ่านธนาคารราคาทั้งหมดรวมแพ็กเกจครบถ้วน — ไม่มีค่าใช้จ่ายแอบแฝง
      icon: tabler:currency-dollar
    - title: การจัดส่งใช้เวลานานเท่าใด?
      description: คําสั่งซื้อจะถูกจัดส่งจากโรงงานของเราและโดยปกติจะมาถึงภายใน 5-10 วันทําการ ขึ้นอยู่กับภูมิภาคของคุณมีการติดตามสินค้าสําหรับทุกคําสั่งซื้อ
      icon: tabler:truck-delivery
    - title: บอร์ดของฉันมีการรับประกันหรือไม่?
      description: ใช่ — บอร์ดทุกตัวมีการรับประกันต่อข้อบกพร่องจากการผลิต และทุกหน่วยจะถูกทดสอบแรงดันที่ 1.25 เท่าของแรงดันที่ระบุเป็นเวลา 24-48 ชั่วโมงก่อนออกจากโรงงาน อัตราการเคลมประกันของเราต่ำกว่า 2%
      icon: tabler:shield-check
cta:
  title: ต้องการความช่วยเหลือในการหาบอร์ดที่เหมาะสม?
  subtitle: ติดต่อทีมงานของเราเพื่อขอคำแนะนำที่ตรงไปตรงมาเกี่ยวกับการเลือกบอร์ด ขนาด หรือคำถามเกี่ยวกับคำสั่งซื้อ
  actions:
    - variant: primary
      text: ติดต่อทีมของเรา
      href: /contact
