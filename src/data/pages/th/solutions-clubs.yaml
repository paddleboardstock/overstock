hero:
  tagline: ชมรมกีฬาทางน้ำ
  title: อุปกรณ์ & โซลูชัน<br />สำหรับชมรมพายเรือ & ศูนย์ฝึกอบรม
  subtitle: ชุดอุปกรณ์ครบชุด อุปกรณ์สำหรับผู้สอน การสร้างแบรนด์ และการสนับสนุนด้านการบำรุงรักษาสำหรับชมรม SUP ชมรมคายัค โรงเรียนโต้คลื่น และศูนย์ฝึกกีฬาทางน้ำทุกขนาด
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP กระดานสำหรับชมรมกีฬาทางน้ำและฝูงเรือให้เช่า
direct_answer: Paddle Board Overstock ให้บริการโซลูชันอุปกรณ์แบบครบวงจรสำหรับชมรมกีฬาทางน้ำและศูนย์ฝึกทั่วโลก ชุดอุปกรณ์ของเรารวมถึง SUP กระดาน คายัค ไม้พาย ปั๊ม ชุดซ่อมแซม และอุปกรณ์ความปลอดภัยในราคาส่งที่แข่งขันได้พร้อม MOQs ต่ำ แต่ละชุดสามารถปรับแต่งได้ด้วยโลโก้ของชมรม สีประจำชมรม และบรรจุภัณฑ์ที่ปรับแต่งส่วนบุคคล เรายังมีการฝึกอบรมการบำรุงรักษา การสนับสนุนชิ้นส่วนอะไหล่ และโปรแกรมหมุนเวียนอุปกรณ์เพื่อยืดอายุการใช้งานของฝูงเรือของคุณ
solution_offerings:
  - title: ชุดเริ่มต้นสำหรับชมรม
    subtitle: สำหรับชมรมใหม่ที่มีสมาชิก 10–30 คน
    badge: Best Seller
    features:
      - title: อุปกรณ์หลัก
        description: กระดานหรือคายัค SUP จำนวน 10–30 ชิ้น พร้อมไม้พาย ปั๊ม และชุดซ่อมแซมที่เข้าชุดกัน
      - title: อุปกรณ์ความปลอดภัย
        description: เสื้อชูชีพ นกหวีด ชุดสายนิรภัยในสีของชมรมสำหรับทุกกระดาน
      - title: อุปกรณ์สำหรับผู้สอน
        description: กระดานสำหรับโค้ชพร้อมด้านบนไม่ลื่นและความมั่นคงเพิ่มเติม
      - title: ชุดสร้างแบรนด์
        description: พิมพ์โลโก้แบบกำหนดเองบนกระดาน ไม้พาย และบรรจุภัณฑ์
      - title: วัสดุการฝึกอบรม
        description: คู่มือบทเรียนสำหรับผู้เริ่มต้น ขั้นตอนความปลอดภัย และรายการตรวจสอบการบำรุงรักษา
    cta_text: สร้างชุดสำหรับชมรมของฉัน
    cta_href: /contact
  - title: ชุดพรีเมียมสำหรับชมรม
    subtitle: สำหรับชมรมที่มีอยู่และผู้ดำเนินการหลายสาขา
    badge: Professional
    features:
      - title: ฝูงเรือครบชุด
        description: ฝูงเรือผสม 30–100 ชิ้นประกอบด้วย SUPs คายัค และอุปกรณ์เสริม
      - title: ระบบความปลอดภัยขั้นสูง
        description: ติดตามอุปกรณ์ด้วย RFID แอปสำหรับรายงานความเสียหาย ป้ายความปลอดภัย
      - title: การฝึกอบรมบุคลากร
        description: การรับรองผู้สอนและเวิร์กช็อปบำรุงรักษาอุปกรณ์ ณ สถานที่
      - title: สนับสนุนการตลาด
        description: การถ่ายภาพระดับมืออาชีพ โบรชัวร์ และเทมเพลตโซเชียลมีเดีย
      - title: โปรแกรมเปลี่ยนอุปกรณ์
        description: การปรับปรุงอุปกรณ์ประจำปีในราคาลดพิเศษพร้อมตัวเลือกการแลกเปลี่ยน
    cta_text: ขยายคลับของฉัน
    cta_href: /contact
benefits:
  - icon: gear
    title: ราคาขายส่ง
    description: ราคาจากโรงงานโดยตรงพร้อมส่วนลดตามปริมาณสำหรับคลับและโรงเรียน
  - icon: palette
    title: การสร้างแบรนด์ตามสั่ง
    description: ปรับแต่งได้ทั้งหมด — สีของบอร์ด พิมพ์โลโก้ บรรจุภัณฑ์ที่มีแบรนด์
  - icon: wrench
    title: การสนับสนุนการบำรุงรักษา
    description: คู่มือวิดีโอ สต็อกอะไหล่ และการวินิจฉัยจากระยะไกล
  - icon: ship
    title: โลจิสติกส์ทั่วโลก
    description: FOB ชิงเต่า, CIF ตัวเลือก, หรือการจัดส่งรวมสำหรับคำสั่งซื้อจำนวนมาก
trust_bar:
  items:
    - amount: 500+
      label: คลับที่ติดตั้งอุปกรณ์ทั่วโลก
    - amount: 12,000 m²
      label: ISO โรงงานที่ได้รับการรับรอง 9001
    - amount: CE + BSCI
      label: คุณภาพและการปฏิบัติตามมาตรฐานที่ได้รับการรับรอง
    - amount: การรับประกัน 2 ปี
      label: สำหรับทุกผลิตภัณฑ์
testimonial:
  content: เราเริ่มต้นด้วยแพ็กเกจเริ่มต้นของคลับสำหรับโรงเรียนสอนเซิร์ฟของเราในประเทศโปรตุเกส 20 บอร์ด, เรือพาย, เสื้อชูชีพ — ทุกอย่างมาถึงภายใน 3 สัปดาห์ หลังจากสองฤดูกาล เราอัปเกรดเป็นแพ็กเกจมืออาชีพ การสร้างแบรนด์แบบกำหนดเองพร้อมโลโก้ของเราเป็นการเปลี่ยนแปลงครั้งสำคัญสำหรับภาพลักษณ์มืออาชีพของเรา
  name: ริคาร์โด ซานโตส
  title: เจ้าของ, Algarve Surf Academy — ลากอส, โปรตุเกส
content_segments:
  tagline: โปรไฟล์ของคลับ
  title: โซลูชันสำหรับคลับกีฬาทางน้ำ<br />ตามประเภทคลับ
  subtitle: ตั้งแต่คลับพายเรือของมหาวิทยาลัยไปจนถึงคลับเรือยอชท์เอกชนสุดหรู — แต่ละประเภทของคลับมีความต้องการอุปกรณ์ รูปแบบการใช้งาน และโครงสร้างงบประมาณที่แตกต่างกัน เราปรับแต่ละแพ็กเกจให้ตรงกับโมเดลของคลับ
  items:
    - title: คลับพายเรือของมหาวิทยาลัยและวิทยาลัย
      subtitle: กองเรือนักศึกษาที่ใช้งานสูง
      description: คลับพายเรือที่บริหารโดยนักศึกษาหรือสนับสนุนโดยสถาบัน ดำเนินโครงการพายเรือ SUP และคายัคสำหรับฝ่ายสันทนาการของมหาวิทยาลัย อุปกรณ์ต้องเผชิญกับการใช้งานบ่อยครั้งและมีการหมุนเวียนสูงในระดับทักษะต่างๆ ทุกภาคการศึกษา ความทนทานและการซ่อมแซมได้ง่ายเป็นสิ่งสำคัญ พร้อมกับราคาที่เป็นมิตรกับงบประมาณสำหรับองค์กรนักศึกษา
      features:
        - โครงสร้าง PVC ที่ทนทานพิเศษสำหรับรอบการใช้งานของนักศึกษา
        - ชุดบอร์ดที่ระบุสีตามระดับทักษะเพื่อการจัดการกองเรืออย่างง่าย
        - ชุดซ่อม + พร้อมสนับสนุนวิดีโอเมื่อเรียกใช้งานรวมอยู่กับคำสั่งซื้อทุกครั้ง
        - ราคาส่วนลดสำหรับองค์กรนักศึกษาและเงื่อนไขการชำระเงินตามภาคการศึกษา
    - title: ชมรมพายเรือและสังคมชุมชน
      subtitle: ชมรมสันทนาการที่ขับเคลื่อนด้วยสมาชิก
      description: ชมรมที่ตั้งอยู่ในชุมชนเสนอประสบการณ์ SUP คายัค และการพายเรือแบบสังคมให้กับสมาชิก อุปกรณ์ต้องสร้างสมดุลระหว่างประสิทธิภาพและความสบายสำหรับกลุ่มอายุที่หลากหลาย พร้อมกับแบรนด์ที่ส่งเสริมเอกลักษณ์ของชมรมและความภาคภูมิใจของสมาชิก ประสิทธิภาพในการจัดเก็บเป็นสิ่งสำคัญสำหรับชมรมที่ดำเนินงานจากพื้นที่น้ำจำกัด
      features:
        - 'กองเรือผสม: SUPs แบบรอบด้าน, บอร์ดทัวร์ริ่ง, และคายัคเพื่อการพักผ่อน'
        - 'การสร้างแบรนด์สโมสรแบบเต็มรูปแบบ: สีที่กำหนดเอง, การพิมพ์โลโก้, PFD ที่มีแบรนด์'
        - โซลูชันการจัดเก็บแบบกะทัดรัดสำหรับอุปกรณ์เป่าลม
        - 'ชุดเริ่มต้นการเติบโตของสมาชิก: บัตรแนะนำ, การถ่ายภาพมีแบรนด์'
    - title: โรงเรียนโต้คลื่นและสถาบันคายัคโต้คลื่น
      subtitle: ประสิทธิภาพและการโค้ชทางชายฝั่ง
      description: โรงเรียนที่เน้นการเล่นเซิร์ฟสอน SUP การโต้คลื่น การพายเรือคายัคในคลื่น และทักษะการขี่คลื่น อุปกรณ์ต้องสามารถใช้งานในสภาพคลื่นได้ — คล่องตัว ตอบสนองดี และทนทานพอที่จะรับมือกับการล้มซ้ำๆ การเสียดสีจากทราย และการสัมผัสน้ำเกลือโดยไม่เสื่อมสภาพอย่างรวดเร็ว
      features:
        - รูปร่าง SUP ที่สั้นกว่าและกว้างกว่า ปรับให้เหมาะกับการเคลื่อนไหวบนคลื่น
        - การก่อสร้างรางเสริมความแข็งแรงสำหรับทนต่อแรงกระแทกในคลื่น
        - 'อุปกรณ์ความปลอดภัยเฉพาะการเล่นเซิร์ฟ: สายจูงแบบม้วน, ตัวเลือกครีบอ่อน'
        - โครงการเปลี่ยนยานพาหนะฝูงรถพร้อมส่วนลดแลกเปลี่ยนตามฤดูกาล
    - title: คลับเรือยอทช์สำหรับธุรกิจและส่วนตัว
      subtitle: ประสบการณ์สมาชิกพรีเมียม
      description: คลับส่วนตัวสุดพิเศษที่เสนอการกีฬาทางน้ำเป็นสิทธิพิเศษพรีเมียมสำหรับสมาชิก อุปกรณ์มีมาตรฐานสูง — ทั้งเรื่องความสวยงาม การสอดคล้องกับแบรนด์ และการจัดเตรียมให้พร้อมสำหรับผู้มาเยือนมีความสำคัญเท่ากับประสิทธิภาพ การบริการที่คาดหวังรวมถึงการส่งมอบแบบมืออาชีพ การจัดเก็บแบบกำหนดเอง และการสนับสนุนระดับคอนเซียร์จ
      features:
        - บอร์ดผิวพรีเมียมพร้อมลวดลายไม้ EVA และรายละเอียดโลหะ
        - การจับคู่สีแบบกำหนดเองตามแนวทางแบรนด์ของคลับ
        - 'การจัดส่งคอนเซียร์จ: เติมลมไว้ล่วงหน้า จัดเตรียม และติดป้ายสำหรับแต่ละฤดูกาล'
        - การจัดการบัญชีโดยเฉพาะพร้อมระดับการตอบสนองลำดับความสำคัญ
cta:
  title: พร้อมสร้างคลับของคุณหรือยัง?
  subtitle: บอกเราขนาดของสโมสรและเป้าหมายของคุณ — เราจะออกแบบแพ็กเกจให้ภายใน 24 ชั่วโมง
  actions:
    - variant: primary
      text: รับแพ็กเกจคลับของคุณ
      href: /contact
    - text: สำรวจแพ็กเกจธุรกิจ
      href: /business-packages
    - text: อ่านเรื่องราวความสำเร็จของคลับ
      href: /success-stories
tldr_points:
  - 'แพ็กเกจเริ่มต้นคลับ: 10–30 SUPs/คายัคพร้อมไม้พาย ปั๊ม ชุดซ่อม อุปกรณ์ความปลอดภัย'
  - 'แพ็กเกจคลับพรีเมียม: ยุทโธปกรณ์ผสม 30–100 ชิ้นพร้อมการติดตามด้วย RFID, การฝึกอบรมพนักงาน, การสนับสนุนด้านการตลาด'
  - 'การสร้างแบรนด์แบบกำหนดเองเต็มรูปแบบ: การพิมพ์โลโก้บนบอร์ด, สีแบรนด์, บรรจุภัณฑ์แบบกำหนดเอง'
  - 'ราคาขายส่ง: จากโรงงานโดยตรง พร้อมส่วนลดตามปริมาณและโปรแกรมปรับปรุงประจำปี'
packages_section:
  title: แพ็คเกจอุปกรณ์สโมสร
  subtitle: เลือกแพ็คเกจที่เหมาะสมกับขนาดของสโมสรคุณ แพ็คเกจทั้งหมดรวมถึงราคาตรงจากโรงงาน ตัวเลือกการสร้างแบรนด์ตามสั่ง และการจัดส่งทั่วโลก
  featured_label: แพ็คเกจยอดนิยม
  packages:
    - name: Club Starter
      description: สำหรับสโมสรที่กำลังเติบโตที่มีสมาชิก 10-30 คน
      audience: สโมสรขนาดเล็กและโรงเรียนสอนเซิร์ฟ
      items:
        - บอร์ดหรือเรือคายัค 10-20 SUP
        - ไม้พาย ปั๊ม และชุดซ่อม
        - เสื้อชูชีพและอุปกรณ์ความปลอดภัย (CE รับรองคุณภาพ)
        - โลโก้พื้นฐานบนบอร์ด
        - การรับประกัน 1 ปีและสนับสนุนด้านเทคนิค
      cta: ขอใบเสนอราคา Starter
      ctaHref: /request-quotation
    - name: Club Pro
      description: สำหรับสโมสรที่มีความมั่นคงและมีสมาชิก 30-100 คน
      audience: สโมสรขนาดกลางและศูนย์ฝึกอบรม
      featured: true
      items:
        - เรือ 30-60 ลำแบบผสม (SUP + คายัค)
        - ไม้พายพรีเมียม ปั๊มแรงสูง
        - แพ็คเกจความปลอดภัยครบชุดพร้อมชั้นวางเก็บของ
        - การสร้างแบรนด์แบบครบถ้วน (บอร์ด + บรรจุภัณฑ์)
        - ระบบติดตามการเช่า RFID
        - การฝึกอบรมพนักงานและสื่อการตลาด
