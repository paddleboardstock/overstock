hero:
  tagline: ชมรมกีฬาทางน้ำ
  title: อุปกรณ์ & โซลูชัน<br />สำหรับชมรมพายเรือ & ศูนย์ฝึกอบรม
  subtitle: ชุดอุปกรณ์ครบชุด อุปกรณ์สำหรับผู้สอน การสร้างแบรนด์ และการสนับสนุนด้านการบำรุงรักษาสำหรับสโมสร โรงเรียนสอนโต้คลื่น และศูนย์ฝึกกีฬาทางน้ำทุกขนาดของ SUP
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP กระดานสำหรับสโมสรกีฬาทางน้ำและกองเรือเช่า
direct_answer: Paddle Board Overstock ให้บริการโซลูชันอุปกรณ์ครบวงจรสำหรับคลับกีฬาทางน้ำและศูนย์ฝึกอบรมทั่วโลก แพ็กเกจคลับของเราประกอบด้วย กระดาน SUP ไม้พาย ปั๊ม ชุดซ่อมแซม และอุปกรณ์ความปลอดภัย ในราคาส่งตรงจากโรงงานสำหรับคลับแต่ละแห่ง แต่ละแพ็กเกจสามารถปรับแต่งได้ด้วยโลโก้ของคลับ สีประจำแบรนด์ และบรรจุภัณฑ์ส่วนตัว เรายังให้บริการฝึกอบรมบำรุงรักษา การสนับสนุนอะไหล่ และโปรแกรมหมุนเวียนอุปกรณ์เพื่อเพิ่มอายุการใช้งานของเรือและอุปกรณ์ของคุณให้สูงสุด
solution_offerings:
  - title: ชุดเริ่มต้นสำหรับชมรม
    subtitle: สำหรับชมรมใหม่ที่มีสมาชิก 10–30 คน
    badge: Best Seller
    features:
      - title: อุปกรณ์หลัก
        description: กระดาน 10–30 แผ่น พร้อมไม้พาย, ปั๊ม, และชุดซ่อมที่ตรงกัน
      - title: อุปกรณ์ความปลอดภัย
        description: เสื้อชูชีพ นกหวีด ชุดสายนิรภัยในสีของชมรมสำหรับทุกกระดาน
      - title: อุปกรณ์สำหรับผู้สอน
        description: กระดานสำหรับโค้ชพร้อมด้านบนไม่ลื่นและความมั่นคงเพิ่มเติม
      - title: ชุดสร้างแบรนด์
        description: พิมพ์โลโก้แบบกำหนดเองบนกระดาน ไม้พาย และบรรจุภัณฑ์
      - title: วัสดุการฝึกอบรม
        description: คู่มือบทเรียนสำหรับผู้เริ่มต้น ขั้นตอนความปลอดภัย และรายการตรวจสอบการบำรุงรักษา
    cta_text: สร้างชุดสำหรับชมรมของฉัน
    cta_href: /contact
  - title: ชุดพรีเมียมสำหรับชมรม
    subtitle: สำหรับชมรมที่มีอยู่และผู้ดำเนินการหลายสาขา
    badge: Professional
    features:
      - title: ฝูงเรือครบชุด
        description: 30–100 กองเรือผสมของ SUPs และอุปกรณ์เสริม
      - title: ระบบความปลอดภัยขั้นสูง
        description: ติดตามอุปกรณ์ด้วย RFID แอปสำหรับรายงานความเสียหาย ป้ายความปลอดภัย
      - title: การฝึกอบรมบุคลากร
        description: การฝึกอบรมผู้สอนในสถานที่และเวิร์กช็อปการบำรุงรักษาอุปกรณ์
      - title: สนับสนุนการตลาด
        description: การถ่ายภาพระดับมืออาชีพ โบรชัวร์ และเทมเพลตโซเชียลมีเดีย
      - title: โปรแกรมเปลี่ยนอุปกรณ์
        description: การปรับปรุงอุปกรณ์ประจำปีในราคาลดพิเศษพร้อมตัวเลือกการแลกเปลี่ยน
    cta_text: ขยายคลับของฉัน
    cta_href: /contact
benefits:
  - icon: gear
    title: การตั้งราคาสมาชิก
    description: ราคาจากโรงงานโดยตรงพร้อมส่วนลดสำหรับสโมสรและโรงเรียน
  - icon: palette
