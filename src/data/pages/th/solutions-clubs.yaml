  - icon: wrench
    title: การสนับสนุนการบำรุงรักษา
    description: คู่มือวิดีโอ สต็อกอะไหล่ และการวินิจฉัยจากระยะไกล
  - icon: ship
    title: โลจิสติกส์ทั่วโลก
    description: จัดส่งตรงจากโรงงาน Weihai ของเรา พร้อมค่าขนส่งรวมสำหรับคำสั่งซื้อจำนวนมาก
