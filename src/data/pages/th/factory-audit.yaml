hero:
  tagline: การตรวจสอบโรงงานและหลักฐาน
  title: การเตรียมการตรวจสอบโรงงาน<br />และหลักฐานคุณภาพ
  subtitle: ทุกสิ่งที่ผู้ซื้อ B2B ตรวจสอบระหว่างการเยี่ยมชมโรงงาน — ตั้งแต่ความแท้จริงของการผลิตและเอกสารการปฏิบัติตามข้อกำหนดจนถึงการติดตามการผลิตและระบบควบคุมคุณภาพ พร้อมสำหรับการตรวจสอบทุกวัน
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock การเตรียมการตรวจสอบโรงงานและหลักฐานคุณภาพ
direct_answer: Paddle Board Overstock มีสถานที่ผลิตขนาด 12,000 ตร.ม. ในชิงเต่า พร้อมกระบวนการ QC ที่มีเอกสารแสดง, การติดตามวัตถุดิบ, บันทึกการผลิตตาม HIN ระดับต่อชิ้น และเอกสารการปฏิบัติตามข้อกำหนดสำหรับทุกรูปแบบลูกเรือ ทัวร์โรงงานจริงและเสมือนมีให้สำหรับผู้ซื้อที่มีคุณสมบัติ
stats:
  - value: 12,000 m²
    label: ISO โรงงานมาตรฐาน 9001
    detail: วิทยาเขตการผลิตชิงเต่า
  - value: 6
    label: สายการผลิต
    detail: สายเฉพาะ RIB, SIB, SUP
  - value: 100%
    label: ทดสอบแรงดัน
    detail: ทุกหน่วย, 1.25x / 24-48 ชม.
  - value: HIN
    label: ติดตามต่อชิ้น
    detail: บันทึกทั้งหมดตั้งแต่การผลิตจนถึงการส่งมอบ
content_priorities:
  tagline: สิ่งที่ลูกค้าตรวจสอบ
  title: 8 สิ่งที่ผู้ซื้อจะตรวจสอบ<br />ในทุกการเยี่ยมชมโรงงาน
  subtitle: จากความคิดเห็นของผู้ซื้อจาก 50+ ประเทศ สิ่งสำคัญแปดประการที่ลูกค้าให้ความสำคัญก่อนการสั่งซื้อ B2B คือ
  items:
    - title: ผู้ผลิตจริง
      description: 'คุณเป็นโรงงานจริง ไม่ใช่บริษัทค้าส่งใช่หรือไม่? ผู้ซื้อจะตรวจสอบ: นิติบุคคล, อุปกรณ์การผลิตจริง, พนักงานที่ปฏิบัติการเครื่องจักร, คำสั่งผลิตปัจจุบันบนพื้นโรงงาน และความสอดคล้องระหว่างเว็บไซต์และเวิร์กช็อป'
      icon: tabler:building-factory
    - title: ผลิตภัณฑ์เหมาะสมกับการใช้งาน
      description: RIB ตรงกับการใช้งานเฉพาะของพวกเขาหรือไม่? ผู้ปฏิบัติงานรีสอร์ท, ช่วยเหลือ, ดำน้ำ, ประมง และตรวจตรามีความต้องการพื้นฐานที่แตกต่างกัน ผู้ซื้อจะประเมินการจัดวางบนดาดฟ้า, วัสดุท่อ, และตัวเลือกอุปกรณ์บนเรือที่แสดง
      icon: tabler:target
    - title: ความเสถียรและการทำซ้ำของคุณภาพ
      description: หน่วยที่ 50 ดีเท่าไหร่กับหน่วยที่ 1? ผู้ซื้อจะตรวจสอบระบบ QC, จุดตรวจระหว่างกระบวนการ, การจัดการความไม่สอดคล้อง, และขอดูบันทึกจากหลายรอบการผลิตเพื่อยืนยันความสม่ำเสมอ
      icon: tabler:repeat
    - title: ความแท้จริงของเอกสารการปฏิบัติตามข้อกำหนด
      description: ใบรับรอง CE เป็นแบบเฉพาะรุ่นหรือไม่? DoC ลงนามโดยบุคคลจริงหรือไม่? สามารถตรวจสอบการปฏิบัติตามแต่ละหมายเลข HIN ได้หรือไม่? ผู้ซื้อจะตรวจสอบเอกสารเฉพาะรุ่นเทียบกับการอ้างสิทธิ์แบบทั่วไป
      icon: tabler:file-certificate
    - title: การดำเนินการปรับแต่ง
      description: โรงงานสามารถส่งมอบการปรับแต่งตามสั่งได้จริงหรือไม่? ผู้ซื้อจะมองหาหลักฐานโครงการปรับแต่งที่ผ่านมา, ตัวอย่างต้นแบบที่แสดง, แผนภาพวิศวกรรม และความสามารถในการหารือเกี่ยวกับการปรับเปลี่ยนทางเทคนิคในที่นั้นทันที
      icon: tabler:adjustments
    - title: ระยะเวลาในการส่งมอบและกำลังการผลิต
      description: 'ไทม์ไลน์ที่อ้างถึงนั้นสมจริงหรือไม่? ผู้ซื้อจะประเมิน: ปริมาณการผลิตปัจจุบัน, ความสามารถที่มีอยู่, ขนาดของแรงงาน, ระดับสต็อกวัตถุดิบ และว่าผลิตภัณฑ์มีระบบวางแผนการผลิตหรือไม่'
      icon: tabler:clock
    - title: ราคาและเงื่อนไขการค้า
      description: 'ราคาชัดเจนหรือไม่? การตั้งราคา FOB ชัดเจนหรือไม่? ผู้ซื้อจะตรวจสอบ: การแยกราคาต่อหน่วย, ต้นทุนเครื่องมือ, ต้นทุนบรรจุภัณฑ์ และว่าบริษัทสามารถจัดการกับเงื่อนไข DDP หรือ CIF พร้อมเอกสารส่งออกที่ถูกต้องหรือไม่'
      icon: tabler:currency-dollar
    - title: หลังการขายและอะไหล่
      description: 'เกิดอะไรขึ้นหลังการส่งมอบ? ผู้ซื้อประเมิน: ความพร้อมของอะไหล่, กระบวนการรับประกัน, การเปลี่ยนท่อส่วน, การเปลี่ยนวาล์ว, และว่ามีโรงงานที่มีเอกสารระเบียบปฏิบัติหลังการขายหรือไม่'
      icon: tabler:headset
content_tour:
  tagline: เส้นทางทัวร์โรงงาน
  title: ทัวร์ตรวจสอบ —<br />สิ่งที่คุณจะได้เห็น
  subtitle: ทัวร์โรงงานมาตรฐานของเราจะดำเนินไปตามเส้นทางที่กำหนดไว้ซึ่งออกแบบมาเพื่อตอบคำถามของผู้ซื้อในทุกสถานี
  items:
    - title: 1. ห้องประชุม — แนะนำบริษัท
      description: ใบอนุญาตประกอบธุรกิจ, ใบรับรอง ISO 9001 และ BSCI, ใบอนุญาตส่งออก, และประวัติของบริษัท ภาพรวมอย่างรวดเร็วของความสามารถในการผลิตและขอบเขตการปฏิบัติตามกฎหมาย
      icon: tabler:users
    - title: 2. คลังวัตถุดิบ — สถานี IQC
      description: บันทึกการตรวจสอบวัสดุขาเข้า ใบรับรองชุดผ้า ตัวอย่างกาวและอุปกรณ์ฮาร์ดแวร์ ดูว่าวัสดุถูกทดสอบอย่างไรก่อนเข้าสู่กระบวนการผลิต
      icon: tabler:building-warehouse
    - title: 3. การผลิตท่อ — การเชื่อม RF และการติดกาวด้วยมือ
      description: กระบวนการเชื่อมท่อหรือการติดกาวแบบสด การสาธิตการทดสอบความแข็งแรงรอยต่อ และการติดตั้งวาล์ว สังเกตการก่อสร้างแต่ละห้องและจุดตรวจสอบคุณภาพ
      icon: tabler:flame
    - title: 4. การเคลือบลำตัวเรือ — เวิร์กช็อป GRP
      description: กระบวนการวางใยแก้ว, การทาเจลโค้ท, และการบ่มตัวตัวเรือ ดูตารางการเคลือบและการเสริมความแข็งแรงโครงสร้างสำหรับรุ่น RIB ต่าง ๆ
      icon: tabler:layers-subtract
    - title: 5. การประกอบและการบูรณาการ
      description: การเชื่อมท่อลำตัวเรือ การติดตั้งคอนโซลและที่นั่ง การรวมระบบไฟฟ้าและเชื้อเพลิง และการติดตั้งอุปกรณ์ สังเกตสายการผลิตในขณะที่กำลังทำงาน
      icon: tabler:tool
    - title: 6. สถานีทดสอบแรงดัน
      description: การทดสอบการกดทับคงที่เป็นเวลา 24-48 ชั่วโมงที่ความดัน 1.25 เท่าของความดันที่กำหนด ดูบันทึกการทดสอบ เกจวัดความดัน และเกณฑ์ผ่าน/ไม่ผ่าน ดูวิธีการที่ผลการทดสอบเชื่อมโยงกับหมายเลขซีเรียลของตัวเรือ
      icon: tabler:gauge
    - title: 7. การตรวจสอบครั้งสุดท้ายและการควบคุมคุณภาพ
      description: รายการตรวจสอบคุณภาพ 100 คะแนนต่อหน่วย การตรวจสอบขนาด การตรวจสอบความสวยงาม และการตรวจสอบความสมบูรณ์ของบรรจุภัณฑ์ ตรวจสอบบันทึกความไม่สอดคล้องและบันทึกการดำเนินการแก้ไข
      icon: tabler:clipboard-check
    - title: 8. ห้องตรวจเอกสาร
      description: เอกสารการปฏิบัติตามแต่ละรุ่น (DoC, แผ่นป้ายผู้ผลิต, คู่มือเจ้าของ), บันทึกการติดตามการผลิต, ทะเบียน HIN, และสาธิตฐานข้อมูลการติดตามล็อตวัสดุ
      icon: tabler:folder
content_qc_chain:
  tagline: หลักฐานคุณภาพ
  title: สายโซ่ QC 8 ขั้น<br />— ตรวจสอบได้ในทุกขั้นตอน
  subtitle: สายการควบคุมคุณภาพของเราครอบคลุมตั้งแต่วัสดุที่เข้ามาจนถึงการจัดส่งสุดท้าย พร้อมหลักฐานที่บันทึกไว้ในทุกขั้นตอน
  items:
    - title: 'ขั้นตอนที่ 1: การตรวจสอบวัสดุที่เข้ามา'
      description: ทุกล็อตของ PVC, Hypalon, , ไฟเบอร์กลาส, อะลูมิเนียม, กาว และฮาร์ดแวร์ จะถูกทดสอบตามข้อกําหนดก่อนเข้าสู่การผลิตการตรวจสอบความแข็งแรงต่อแรงดึง การยึดเกาะของเคลือบ และขนาดตาม AQL 2.5/ISO2859
      icon: tabler:package
    - title: 'ขั้นตอนที่ 2: การเชื่อมท่อ / การติดกาว QC'
      description: การทดสอบความแข็งแรงของรอยต่อต่อชุดการผลิตตรวจสอบและบันทึกพารามิเตอร์การเชื่อม RF ตรวจสอบรอยต่อที่ติดกาวด้วยมือเพื่อความสม่ําเสมอของการเคลือบกาวและเวลาการแข็งตัว
      icon: tabler:flame
    - title: 'ขั้นตอนที่ 3: การตรวจสอบคุณภาพการเคลือบผิวตัวเรือ'
      description: การวัดความหนาของเจลโค้ท การตรวจสอบการวางชั้นไฟเบอร์กลาสตามตารางลามิเนต และการตรวจสอบเวลาการอบตําแหน่งเสริมโครงสร้างได้รับการตรวจสอบเทียบกับแบบวิศวกรรม
      icon: tabler:layers-subtract
    - title: 'ขั้นตอนที่ 4: การประกอบและควบคุมคุณภาพการบูรณาการ'
      description: ความแข็งแรงของข้อต่อท่อตัวถัง, แรงบิดสําหรับติดตั้งคอนโซลและเบาะ, ความต่อเนื่องทางไฟฟ้า และการทดสอบการรั่วไหลของระบบเชื้อเพลิงแต่ละจุดติดตั้งได้รับการตรวจสอบตามรายการตรวจสอบประกอบเฉพาะรุ่น
      icon: tabler:tool
    - title: 'ขั้นตอนที่ 5: การทดสอบการยึดแรงกด'
      description: ทุกห้องเป่าลมแรงดันสูงถึง 1.25x PSI และเก็บไว้ 24-48 ชั่วโมงบันทึกแรงดันตกคร่อมต่อห้องมีการบันทึกเกณฑ์ผ่าน/ไม่ผ่านเชื่อมโยงกับหมายเลขซีเรียลตัวถัง
      icon: tabler:gauge
    - title: 'ขั้นตอนที่ 6: การตรวจสอบขั้นสุดท้าย'
      description: รายการตรวจสอบคุณภาพ 100 ข้อ ครอบคลุมความแม่นยําของขนาด การตกแต่งภายนอก ความครบถ้วนของอุปกรณ์เสริม การบรรจุเอกสาร และความสมบูรณ์ของบรรจุภัณฑ์เป็นอิสระจากทีมผลิต
      icon: tabler:clipboard-check
    - title: 'ขั้นตอนที่ 7: เอกสารการปฏิบัติตามข้อกําหนด'
      description: เอกสาร DoC เฉพาะรุ่น, การตรวจสอบป้ายผู้ผลิต, ความสมบูรณ์ของคู่มือเจ้าของ และการกรอกข้อมูลในทะเบียน IN เอกสารการปฏิบัติตามข้อกําหนดทั้งหมดถูกจัดเตรียมและตรวจสอบก่อนปล่อยสินค้า
      icon: tabler:file-certificate
    - title: 'ขั้นตอนที่ 8: การปล่อยสินค้าและการตรวจสอบย้อนกลับ'
      description: การปล่อยตัวขั้นสุดท้ายต้องผ่านขั้นตอน QC ครบถ้วน เอกสารการปฏิบัติตามข้อกําหนดครบถ้วน และเอกสารการจัดส่งต้องได้รับการยืนยันบันทึก Hull ถูกปิดและเก็บถาวรเพื่อเก็บรักษาเป็นเวลา 10+ ปี
      icon: tabler:truck
content_traceability:
  tagline: การตรวจสอบย้อนกลับการผลิต
  title: → ไฟล์→หลัก HIN<br />การจัดส่งแผ่นเสียงตัวเรือ→
  subtitle: เรือทุกRIBลําจะมีหมายเลขประจําตัวลําเรือที่ไม่ซ้ํากัน ซึ่งเชื่อมโยงกับห่วงโซ่การผลิตและการปฏิบัติตามข้อกําหนดอย่างครบถ้วน
  items:
    - title: หมายเลขประจําตัวตัวเรือ (HIN)
      description: รหัสเฉพาะ 14 ตัวอักษรที่ถูกทําเครื่องหมายถาวรบนเรือแต่ละลําเข้ารหัสรหัสผู้ผลิต (MIC) ชื่อรุ่น ปีผลิต และหมายเลขซีเรียลกุญแจที่ใช้ปลดล็อกสายการตรวจสอบย้อนกลับทั้งหมด
      icon: tabler:hash
    - title: ไฟล์เทคนิคหลัก
      description: เอกสารการปฏิบัติตามข้อกําหนดและวิศวกรรมสําหรับตระกูลโมเดลประกอบด้วยแบบร่าง GA การประเมินความเสี่ยง การคํานวณความมั่นคง ข้อกําหนดวัสดุ และมาตรฐานที่เกี่ยวข้องเชื่อมโยงกับตัวถังทุกชิ้นของโมเดลนั้น
      icon: tabler:folder
    - title: สถิติตัวเรือแต่ละตัว
      description: 'บันทึกการผลิตต่อตัวถัง: HIN, วันที่ผลิต, ล็อตท่อ, ใบรับรองวัสดุ, ผลการทดสอบแรงดัน, การกําหนดค่าสุดท้าย, สเปคเครื่องยนต์, ผลการตรวจสอบคุณภาพ และจุดหมายปลายทางการส่งมอบมี+ช่องข้อมูล 21 ช่องต่อตัวถัง'
      icon: tabler:file-description
    - title: ชุดการปฏิบัติตามข้อกําหนดของลูกค้า
      description: แพ็คเกจจัดส่งตามตัวเรือ รวมถึง DoC, รูปถ่ายป้ายผู้ผลิต, คู่มือเจ้าของ, รายการตรวจสอบการปฏิบัติตามข้อกําหนด และแผ่นข้อมูลการตั้งค่าขั้นสุดท้ายจัดส่งพร้อมกับเรือและเก็บถาวรที่โรงงานเป็นเวลา 10+ ปี
      icon: tabler:package
content_red_flags:
  tagline: ข้อควรระวังในการตรวจสอบบัญชี
  title: ผู้ซื้อที่เป็นสัญญาณเตือน<br />สังเกตเห็นได้ง่าย
  subtitle: ปัญหาทั่วไปที่ทําลายความเชื่อมั่นของผู้ซื้อในระหว่างการตรวจสอบโรงงานเราดําเนินการแก้ไขแต่ละปัญหาอย่างเชิงรุก
  items:
    - title: CE การอ้างสิทธิ์แบบครอบคลุมโดยไม่มีขอบเขตของโมเดล
      description: '"ผลิตภัณฑ์ทั้งหมดCEได้รับการรับรอง" โดยไม่ระบุว่าคําสั่งใด รุ่นไหน และโมดูลความสอดคล้องใดธงแดง: บ่งชี้ว่าการปฏิบัติตามเป็นไปตามข้อกําหนดเป็นเพียงผิวเผิน ไม่ใช่เฉพาะรุ่นหรือแต่ละการกําหนดค่า'
      icon: tabler:alert-triangle
    - title: ไม่มีหลักฐานการทดสอบทางกายภาพ
      description: 'การอ้างสิทธิ์การทดสอบแรงดันโดยไม่มีบันทึกการทดสอบ เกจวัด หรือสถานีทดสอบที่ปรากฏบนพื้นโรงงานธงแดง: ไม่สามารถตรวจสอบการอ้างคุณภาพได้ในระหว่างการเยี่ยมชม'
      icon: tabler:alert-triangle
    - title: การติดตามวัสดุที่ขาดหายไป
      description: 'ไม่มีบันทึกล็อต ไม่มีการตรวจสอบใหม่ หรือไม่มีความเชื่อมโยงระหว่างใบรับรองวัสดุกับสินค้าสําเร็จรูปธงแดง: ไม่มีวิธีติดตามปัญหาคุณภาพไปยังแหล่งที่มา'
      icon: tabler:alert-triangle
    - title: เอกสารทั่วไป
      description: 'DoC เดียวครอบคลุมทุกรุ่น ไม่มีบันทึกเฉพาะ HIN หรือเอกสารการปฏิบัติตาม "เทมเพลต"ธงแดง: การปฏิบัติตามข้อกําหนดไม่ได้จํากัดอยู่กับหน่วยผลิตแต่ละหน่วย'
      icon: tabler:alert-triangle
content_shipping:
  tagline: การจัดส่งและบรรจุภัณฑ์
  title: RIB ตู้คอนเทนเนอร์เรือ<br />การบรรจุและบรรจุลัง
  subtitle: โซลูชันการจัดส่งของเราช่วยปกป้องการลงทุนของคุณตั้งแต่ชิงเต่าถึงท่าเรือปลายทางแผนการบรรทุกตู้คอนเทนเนอร์และข้อกําหนดการบรรจุลังมีให้สําหรับทุกรุ่น
  items:
    - title: การกําหนดค่าตู้คอนเทนเนอร์ขนาด 20 ฟุต
      description: 'ตู้คอนเทนเนอร์มาตรฐานขนาด 20 ฟุต: มีเรือ 1-2 RIB ลํา (4.0-5.5 เมตร) วางซ้อนกันโดยมีดาดฟ้าและท่อแยกกัน หรือ 8-12 SUP บอร์ดRIB + SUP มีการจัดวางแบบผสมผสานให้เลือกแผนการบรรทุกรายละเอียดให้ตามคําสั่งซื้อ'
      icon: tabler:box
    - title: การกําหนดค่าตู้คอนเทนเนอร์ขนาด 40 ฟุต
      description: 'ตู้คอนเทนเนอร์มาตรฐานขนาด 40 ฟุต: 2-4 RIB ลํา (สูงสุด 7.0 เมตร) โดยตัวเรือซ้อนกันและท่อซ้อนกัน หรือ 20-30 SUP แผ่นรองรับ 40 ฟุตสําหรับรุ่นที่สูงกว่าRIBการบรรจุที่ออกแบบมาเพื่อปริมาณช่วยลดต้นทุนการขนส่งต่อหน่วย'
      icon: tabler:container
    - title: ลังไม้สําหรับRIBตัวเรือ
      description: ตัวเรืออลูมิเนียมและ GRP บรรจุในลังไม้ที่ออกแบบเฉพาะ พร้อมฟองน้ํา แผ่นกันความชื้น และแถบเหล็กขนาดและน้ําหนักลังแต่ละรุ่นมีให้สําหรับการวางแผนโลจิสติกส์รวมการรับรองไม้อบความร้อน ISPM-15
      icon: tabler:wood
    - title: การบรรจุแยกท่อและดาดฟ้า
      description: ท่อที่แฟบและพับแยกจากตัวเรือเพื่อประหยัดพื้นที่แผ่นดาดฟ้า คอนโซล และที่นั่งบรรจุในห่อหุ้มป้องกันพร้อมชุดอุปกรณ์ติดตั้งคําแนะนําการประกอบใหม่รวมอยู่ในทุกการจัดส่ง
      icon: tabler:package
    - title: การป้องกันความชื้นและการกัดกร่อน
      description: กระดาษป้องกันการกัดกร่อน VCI สําหรับชิ้นส่วนอะลูมิเนียม ถุงดูดความชื้นซิลิกาเจล และถุงอุปกรณ์ที่ปิดผนึกด้วยสุญญากาศป้องกันความเสียหายจากการควบแน่นระหว่างการเดินทางในมหาสมุทรเป็นเวลา 30-45 วัน
      icon: tabler:droplet-off
    - title: FOB เอกสารชิงเต่า
      description: ใบตราส่งสินค้า ใบแจ้งหนี้การค้า รายการบรรจุภัณฑ์ ใบรับรองแหล่งกําเนิดสินค้า และเอกสารการปฏิบัติตามข้อกําหนดต่อการจัดส่งแต่ละครั้งมีบริการรวมเอกสาร FCL และ LCL สนับสนุนเอกสารศุลกากรสําหรับตลาดสหภาพยุโรป สหรัฐอเมริกา และตะวันออกกลาง
      icon: tabler:file-text
content_audit_evidence:
  tagline: หลักฐานการตรวจสอบ
  title: หลักฐานการตรวจสอบ<br />คุณสามารถตรวจสอบได้ที่หน้างาน
  subtitle: ในระหว่างการเยี่ยมชมโรงงาน ลูกค้าสามารถตรวจสอบหลักฐานเฉพาะในแต่ละพื้นที่ผลิตได้นี่คือสิ่งที่ควรสังเกต — และสิ่งที่เราเตรียมพร้อมสําหรับการตรวจสอบทุกครั้ง
  areas:
    - area: คลังวัตถุดิบ
      what_to_verify: วัสดุมีความเสถียรหรือไม่?มีการผสมแบบแบทช์หรือไม่?
      evidence: บันทึกการตรวจสอบที่เข้ามา, ฉลากล็อต, การจัดเก็บ FIFO, รายชื่อผู้จัดหาอนุมัติ, ใบรับรองวัสดุ (PVC, Hypalonไฟเบอร์กลาส, อะลูมิเนียม, กาว, ฮาร์ดแวร์)
      icon: tabler:building-warehouse
    - area: การผลิตหลอด
      what_to_verify: จะรับประกันความแข็งแรงของตะเข็บและความแน่นหนาของอากาศได้อย่างไร?
      evidence: บัตรกระบวนการ, การยืนยันสินค้าชิ้นแรก, บันทึกการทดสอบแรงดันต่อห้อง, บันทึกการซ่อมและทดสอบซ้ํา, บันทึกการติดตั้งวาล์ว
      icon: tabler:flame
    - area: การผลิตตัวเรือ
      what_to_verify: ความสม่ําเสมอของโครงสร้างถูกควบคุมอย่างไร?
      evidence: เอกสารกระบวนการที่ควบคุมได้ จุดตรวจสอบคุณภาพ การนับหมายเลขผลิตภัณฑ์กึ่งสําเร็จรูป การวัดความหนาของเจลโค้ท การตรวจสอบตารางการเคลือบ
      icon: tabler:layers-subtract
    - area: พื้นที่รวมตัว
      what_to_verify: ชิ้นส่วนเสริมช่วยป้องกันไม่ให้ประกอบผิดวิธีได้อย่างไร?
      evidence: BOM, ใบสั่งงาน, รายการตรวจสอบการกําหนดค่า, บัตรตรวจสอบสถานีงาน, การตรวจสอบแรงบิดและการทํางานตามรุ่น
      icon: tabler:tool
    - area: สถานีทดสอบ
      what_to_verify: คุณยืนยันได้อย่างไรว่าเรือปลอดภัยก่อนส่งมอบ?
      evidence: ขั้นตอนการทดสอบ, รายการเครื่องมือ, บันทึกการสอบเทียบ, บันทึกการทดสอบแรงดัน (1.25x / 24-48 ชั่วโมง), รายการตรวจสอบการทดสอบเชิงฟังก์ชัน, เกณฑ์ผ่าน/ไม่ผ่านที่บันทึกไว้
      icon: tabler:gauge
    - area: พื้นที่ไม่เป็นไปตามข้อกําหนด
      what_to_verify: ข้อบกพร่องถูกจัดการอย่างไร?
      evidence: ป้ายกํากับการแยก, บันทึก NCR, การวิเคราะห์สาเหตุรากฐาน, บันทึกการอนุมัติการปรับปรุง, การติดตาม CAPA (Corrective and Preventive Action)
      icon: tabler:alert-triangle
    - area: คลังสินค้าสําเร็จรูป
      what_to_verify: จะป้องกันการส่งผิดวัตถุประสงค์และความเสียหายได้อย่างไร?
      evidence: ฉลากผลิตภัณฑ์สําเร็จรูป บันทึกการจับคู่คําสั่งซื้อ มาตรฐานบรรจุภัณฑ์ บันทึกการตรวจสอบก่อนจัดส่ง
      icon: tabler:box
    - area: อะไหล่ & บริการหลังการขาย
      what_to_verify: คุณสามารถสนับสนุนบริการหลังการขายระยะยาวได้หรือไม่?
      evidence: รายการอะไหล่ทั่วไป กลยุทธ์สต็อก ระบบหมายเลขชิ้นส่วน เอกสารกระบวนการรับประกัน และบทเรียนการบํารุงรักษา
      icon: tabler:headset
content_closing_script:
  tagline: ตรวจสอบตามคําสั่ง
  title: จากการเยี่ยมชมโรงงาน<br />ไปยังโครงการที่ได้รับการยืนยันแล้ว
  subtitle: การตรวจสอบที่ประสบความสําเร็จไม่ควรจบลงเพียงแค่ภาพถ่ายและการจับมือก่อนจากไป เรารับประกันว่ามีการบันทึกผลลัพธ์ทางการค้าสามประการไว้
  items:
    - title: ยืนยันการตั้งค่าทางเทคนิค
      description: ตกลงกันในรุ่น การใช้งาน ตัวเลือกหลัก ตลาดเป้าหมาย ปริมาณโดยประมาณ และตารางการจัดส่ง — ทั้งหมดนี้ถูกบันทึกไว้ก่อนออกเดินทาง
      icon: tabler:checklist
    - title: ยืนยันเอกสารขั้นตอนถัดไป
      description: 'กําหนดสิ่งที่Paddle Board Overstockให้ต่อไป: GA ที่แก้ไข, รายการกําหนดค่า, ใบเสนอราคา, รายการตรวจสอบเอกสาร, แผนตัวอย่าง หรือ NDA — พร้อมไทม์ไลน์ที่เฉพาะเจาะจง'
      icon: tabler:file-plus
    - title: ยืนยันไทม์ไลน์ร่วมกัน
      description: ปรับปรุงการกําหนดค่าและใบเสนอราคาเบื้องต้นภายใน 3 วันทําการตัวอย่างหรือการยืนยันรูปลักษณ์ภายใน 7 วันการตรวจสอบทางวิศวกรรมหรือการตรวจสอบโดยบุคคลที่สามภายใน 14 วันวันประชุมถัดไปและผู้รับผิดชอบถูกล็อกไว้
      icon: tabler:calendar
faq:
  title: การตรวจสอบโรงงาน — คําถามที่พบบ่อย
  questions:
    - q: ฉันสามารถไปเยี่ยมชมโรงงานด้วยตัวเองได้ไหม?
      a: ใช่เรายินดีต้อนรับการตรวจสอบโรงงาน ณ สถานที่ขนาด 12,000 ตารางเมตรในชิงเต่าของเราทัวร์มาตรฐานของเราครอบคลุม 8 สถานี ตั้งแต่คลังวัตถุดิบจนถึงห้องตรวจสอบเอกสารทัวร์โรงงานเสมือนผ่านวิดีโอคอลก็มีให้สําหรับการประเมินคุณสมบัติเบื้องต้น
    - q: คุณรับการตรวจสอบจากบุคคลที่สาม (BSCI, SMETA, SGS) หรือไม่?
      a: ใช่เรารักษาBSCIการรับรอง (Intertek) และยินดีรับการตรวจสอบเฉพาะลูกค้าเรายังสามารถจัดการSGS TÜV ตรวจสอบตามคําขอได้รายงานการตรวจสอบมีให้ภายใต้ NDA.
    - q: สามารถดูการทดสอบแรงดันระหว่างการตรวจได้ไหม?
      a: สถานีทดสอบแรงดันของเราเป็นส่วนหนึ่งของเส้นทางทัวร์มาตรฐานขึ้นอยู่กับตารางการผลิต คุณอาจสังเกตเห็นการทดสอบแรงดันแบบแอคทีฟพร้อมการอ่านเกจและบันทึกการทดสอบบันทึกการทดสอบแรงดันต่อตัวถังพร้อมให้ตรวจสอบเสมอ
    - q: คุณจัดการกับผลิตภัณฑ์ที่ไม่เป็นไปตามมาตรฐานอย่างไร?
      a: หน่วยที่ไม่เป็นไปตามมาตรฐานจะถูกแยก บันทึก และตรวจสอบตามISOกระบวนการแก้ไข 9001 ของเรามีการวิเคราะห์สาเหตุรากฐาน ดําเนินการแก้ไข และเก็บบันทึกไว้ผู้ซื้อสามารถตรวจสอบบันทึก NCR ของเราในระหว่างการตรวจสอบ
    - q: เอกสารการปฏิบัติตามข้อกําหนดใดบ้างที่สามารถตรวจสอบได้?
      a: 'ระหว่างการตรวจสอบ คุณสามารถตรวจสอบ: ตัวอย่าง DoC เฉพาะรุ่น, ข้อกําหนดแผ่นผู้ผลิต, ทะเบียน HIND, ร่างคู่มือเจ้าของ, รายการมาตรฐานที่เกี่ยวข้อง และบันทึกการประเมินความสอดคล้องของแต่ละตระกูลรุ่น'
    - q: ฉันจะจองทัวร์โรงงานเสมือนจริงได้อย่างไร?
      a: ติดต่อทีมขายของเราเพื่อจองทัวร์วิดีโอสดผ่าน WhatsApp, Zoom หรือ Teams เราปฏิบัติตามเส้นทาง 8 สถานีเดียวกัน และสามารถเน้นพื้นที่เฉพาะตามความสนใจของคุณทัวร์เสมือนจริงโดยทั่วไปใช้เวลาประมาณ 45-60 นาที
    - q: โรงงานเป็นผู้ผลิตจริงหรือบริษัทการค้า?
      a: Paddle Board Overstock เป็นผู้ผลิตจริงเราดําเนินงานโรงงานที่ไคซี ชิงเต่าใบอนุญาตประกอบธุรกิจ ขอบเขตการผลิต และการผลิตจริงทั้งหมดสามารถตรวจสอบได้ระหว่างการตรวจสอบ
    - q: มีบันทึกคุณภาพอะไรบ้างที่ฉันสามารถตรวจสอบได้บ้าง?
      a: บันทึกการตรวจสอบวัสดุที่เข้ามา จุดตรวจสอบคุณภาพระหว่างกระบวนการ บันทึกการทดสอบแรงดัน รายการตรวจสอบขั้นสุดท้าย 100 จุด รายงานการไม่เป็นไปตามข้อกําหนด บันทึกการดําเนินการแก้ไข และบันทึกการติดตามแต่ละตัวถังทั้งหมดได้รับการดูแลตามISOข้อกําหนด 9001
