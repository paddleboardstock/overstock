materials:
  intro_p1: ประสิทธิภาพ ความทนทาน และความปลอดภัยของเรือเป่าลมขึ้นอยู่กับวัสดุที่ใช้ในการผลิตเกือบทั้งหมด ตั้งแต่ผ้าที่สร้างท่อจนถึงด้ายที่ให้คณะกรรมการ SUP ความแข็งแรง ทุกการเลือกวัสดุส่งผลต่อการทำงานของผลิตภัณฑ์บนทางน้ำและอายุการใช้งาน
  intro_p2: 'คู่มือนี้ครอบคลุมสี่วัสดุหลักที่ใช้ในเรือเป่าลมสมัยใหม่: ผ้า PVC, ยาง Hypalon CSM, โครงสร้างแกน drop-stitch, และแผ่นโฟม EVA การเข้าใจวัสดุเหล่านี้จะช่วยให้คุณเลือกผลิตภัณฑ์ที่เหมาะสมกับความต้องการและบำรุงรักษาเพื่อให้ได้อายุการใช้งานสูงสุด'
  labels:
    advantages: ข้อดี
    limitations: ข้อจำกัด
    best_for: 'เหมาะสำหรับ:'
  items:
    - name: PVC (โพลีไวนิลคลอไรด์)
      summary: มาตรฐานอุตสาหกรรมสำหรับเรือเป่าลมเพื่อพักผ่อนและ SUPs ผ้าสองชั้นที่มีลามิเนตหลายชั้นให้ความแข็งแรงต่อน้ำหนักที่ยอดเยี่ยมในราคาที่เข้าถึงได้
      pros:
        - ราคาประหยัด — ถูกกว่าประมาณ 30-50% เมื่อเทียบกับ Hypalon
        - เบาและง่ายต่อการจัดการ
        - ทนต่อ UV ได้ดีเมื่อเคลือบอย่างเหมาะสม
        - มีสีและผิวให้เลือกหลากหลาย
        - ซ่อมง่ายด้วยแผ่นปะ PVC และกาวละลาย
      cons:
        - อายุการใช้งานสั้นกว่า Hypalon (7-10 ปี)
        - ยืดหยุ่นน้อยกว่าในอุณหภูมิเย็น
        - ทนต่อสารเคมีต่ำกว่า
        - อาจเกิดการเคลื่อนย้ายพลาสติไซเซอร์เมื่อเวลาผ่านไป
      best_for: SUPs เพื่อพักผ่อน เรือราคาประหยัด ฝูงเรือเช่า การใช้งานตามฤดูกาล น้ำจืดและชายฝั่ง
    - name: Hypalon (ยาง CSM)
      summary: วัสดุยางสังเคราะห์พรีเมียมที่มีความทนทานเป็นเลิศ ทนต่อ UV และอายุการใช้งานยาวนาน เป็นมาตรฐานทองคำสำหรับเรือเป่าลมเชิงพาณิชย์และทางทหาร
      pros:
        - ทนต่อ UV และโอโซนเป็นเลิศ
        - อายุการใช้งาน 15-20 ปีเมื่อได้รับการดูแลอย่างเหมาะสม
        - ความยืดหยุ่นยอดเยี่ยมในสภาพอากาศหนาว
        - ทนต่อสารเคมีและน้ำมันได้ดีเยี่ยม
        - คงสีได้นานกว่าสินค้า PVC
      cons:
        - มีราคาสูงกว่าสินค้า PVC อย่างมาก
        - เนื้อผ้าหนักกว่า
        - ตัวเลือกสีมีน้อยกว่า
        - การซ่อมแซมต้องใช้กาวเฉพาะทาง
        - มีโรงงานผลิตน้อยลงทั่วโลก
      best_for: การใช้งานเชิงพาณิชย์ RIBs การค้นหาและกู้ภัย การใช้งานทางทหาร สภาพภูมิอากาศเขตร้อน การเป็นเจ้าของเรือในระยะยาว
    - name: Drop-Stitch คอร์
      summary: เทคโนโลยีที่เปลี่ยนแปลงเรือเป่าลม SUPs มีเส้นใยโพลีเอสเตอร์นับพันเชื่อมระหว่างชั้นผ้าด้านบนและด้านล่าง ทำให้สามารถพองลมแรงดันสูงเพื่อให้ได้สมรรถนะแบบแข็งและเปลือกแข็ง
      pros:
        - แข็งมากที่ 12-20 PSI
        - เบา — 18-30 ปอนด์สำหรับบอร์ดขนาดเต็ม
        - พับแบนเพื่อจัดเก็บและการเดินทาง
        - ทนต่อแรงกระแทกได้ดีมาก
        - ให้สมรรถนะคงที่ในช่วงอุณหภูมิที่แตกต่างกัน
      cons:
        - ต้องใช้ปั๊มแรงดันสูง
        - การซ่อมรอยเจาะซับซ้อนกว่าชั้นเดียว
        - ค่าใช้จ่ายในการผลิตสูงกว่าสินค้าเป่าลมทั่วไป
        - การสูญเสียแรงดันตามเวลา ต้องเติมลมเป็นระยะ
      best_for: บอร์ดแบบพายยืน, คายัค, แผ่นลมสำหรับเรือเป่าลม, การใช้งานใด ๆ ที่ต้องการสมรรถนะแข็งแต่พกพาแบบเป่าลมได้
    - name: EVA โฟมเด็ค
      summary: โฟมแบบปิดเซลล์ EVA (เอทิลีน-ไวนิลอะซิเตท) ใช้ทำแผ่นกันลื่นบนบอร์ด SUP และดาดฟ้าเรือ ให้การรองรับ การยึดเกาะ และฉนวนความร้อน
      pros:
        - ยึดเกาะไม่ลื่นได้ดีทั้งเปียกและแห้ง
        - เบาะรองลดความเหนื่อยล้าระหว่างพายระยะยาว
        - ฉนวนความร้อนจากพื้นดาดฟ้าเย็น
        - ทนต่อ UV และน้ำเค็ม
        - มีให้เลือกแบบหลายสีและลายสลักด้วยเลเซอร์
      cons:
        - สามารถใช้งานหนักได้นาน 2-3 ปี
        - ต้องมีการยึดอย่างเหมาะสมเพื่อป้องกันการลอกเลเยอร์
        - ไม่ใช่โครงสร้าง — ไม่มีผลต่อความแข็งแรง
        - เพิ่มน้ำหนักเล็กน้อย (200-400 กรัมต่อแผ่น)
      best_for: SUP การยึดเกาะบนดาดฟ้า, เบาะดาดฟ้าเรือ, ความสบายของเบาะคายัค, พื้นผิวใด ๆ ที่ต้องการการยึดเกาะไม่ลื่น
  selection:
    title: คู่มือการเลือกวัสดุ
    subtitle: 'เลือกวัสดุที่เหมาะสมตามการใช้งานหลักของคุณ:'
    headers:
      - กรณีการใช้งาน
      - วัสดุที่แนะนำ
      - เหตุผล
    rows:
      - - พายเรือเพื่อสันทนาการ SUP
        - Drop-stitch PVC
        - น้ำหนักเบา แข็งแรง ราคาไม่แพง — สมดุลที่เหมาะสำหรับผู้พายเรือทั่วไป
      - - เรือคันเล็กสำหรับครอบครัว / เรือในทะเลสาบ
        - PVC (1100 เดนิเยร์)
        - คุ้มค่า ซ่อมแซมง่าย ทนทานพอสำหรับการใช้งานเพื่อสันทนาการ
      - - เรือพาณิชย์ RIB / เรือลาดตระเวน
        - Hypalon CSM
        - ทนต่อ UV สูงสุด อายุตั้ง 15-20 ปี ทนสารเคมี/น้ำมัน
      - - บอร์ดให้เช่า SUP
        - Drop-stitch PVC + EVA ดาดฟ้า
        - ทนทาน ซ่อมแซมได้ คุ้มค่าสำหรับการใช้งานที่หมุนเวียนเร็ว
      - - ปฏิบัติการค้นหาและช่วยเหลือ
        - Hypalon CSM
        - เชื่อถือได้ในสภาวะสุดขั้ว ยืดหยุ่นในที่เย็น ทนสารเคมี
      - - คายัคท่องเที่ยว / การสำรวจ
        - Drop-stitch PVC
        - ประสิทธิภาพแข็งแรงพร้อมสามารถพกพาได้เพื่อการเดินทาง
  deep_dive:
    title: คู่มือการดำน้ำเชิงลึก
    topics:
      - title: วัสดุเกรดทางทะเล PVC
        desc: ผ้าหลายชั้นแบบลามิเนต PVC — การทนต่อ UV การทดสอบการขัดถู และค่าการวัดเดนิเยร์อธิบายไว้
      - title: PVC เทียบกับ Hypalon
        desc: การเปรียบเทียบที่ชัดเจนของวัสดุเรือเป่าลมสองประเภทหลัก — ค่าใช้จ่าย อายุการใช้งาน การทนต่อ UV
      - title: Drop-Stitch คอร์
        desc: วิธีที่เส้นด้ายจำนวนมากสร้างโครงสร้างเป่าลมแรงดันสูงที่แข็งแรงที่ 12-15 PSI
      - title: เทคโนโลยีการเชื่อมด้วยคลื่นความถี่วิทยุ
        desc: การเชื่อมด้วยความถี่สูงสร้างรอยต่อที่แข็งแรงและสม่ำเสมอ — วิธีการทำงานและเหตุผลที่สำคัญ
      - title: PSI & ประสิทธิภาพ
        desc: เหตุใดความดันอากาศจึงสำคัญสำหรับ SUPs และเรือเป่าลม — ความแข็งแรง ความสามารถในการรับน้ำหนัก และคุณภาพการล่อง
      - title: การทดสอบคุณภาพ
        desc: การทดสอบความดัน การทดสอบการลอย UV การเสื่อมสภาพ และการทดสอบแบบทำลาย — กระบวนการคุณภาพของเรา
      - title: EVA แผ่นโฟมสำหรับดาดฟ้า
        desc: แผ่นโฟมปิดเซลล์ EVA สำหรับดาดฟ้า — การยึดเกาะ ความสบาย และความทนทานสำหรับ SUP และดาดฟ้าเรือ
      - title: การดูแลรักษาวัสดุ
        desc: การทำความสะอาด การปกป้อง UV การป้องกันเชื้อรา และแนวทางการจัดเก็บที่ดีที่สุดสำหรับผลิตภัณฑ์เป่าลม
