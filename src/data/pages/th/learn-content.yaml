articles:
  sup:
    - title: SUP พื้นฐาน — คู่มือผู้เริ่มต้น
      desc: ทุกสิ่งที่ผู้เริ่มต้นจำเป็นต้องรู้ — ประเภทของกระดาน ขนาดไม้ตีท่า ยืน และเคล็ดลับวันแรก
    - title: SUP คู่มือขนาด
      desc: หาความยาว ความกว้าง และปริมาตรของบอร์ดที่เหมาะสมกับน้ำหนัก ความสามารถ และสไตล์การพายของคุณ
    - title: กระดานเป่าลม vs กระดานแข็ง
      desc: อันไหนเหมาะกับคุณ? เปรียบเทียบความพกพา, สมรรถนะ, ความทนทาน และค่าใช้จ่าย
    - title: เทคนิคระดับกลาง
      desc: พัฒนาการพายของคุณด้วยท่าพายขั้นสูง เทคนิคการเลี้ยว และการรับมือกับน้ำที่ขรุขระ
    - title: วิธีการเลือกเรือเป่าลม SUP
      desc: นำทางปัจจัยสำคัญ — การก่อสร้าง, ความหนา, การติดตั้งครีบ และอุปกรณ์เสริมที่รวมมา
    - title: ความปลอดภัยทางน้ำ
      desc: ความรู้ด้านความปลอดภัยที่จำเป็น รวมถึงการอ่านสภาพอากาศ, การเลือก PFD, การช่วยเหลือตัวเอง และการพายเป็นกลุ่ม
  inflatable-boat:
    - title: ข้อมูลอ้างอิงวัสดุ
      desc: PVC, Hypalon, drop-stitch, การให้คะแนนเดนเนียร์ — เข้าใจว่าอุปกรณ์เป่าลมของคุณทำมาจากอะไร
    - title: PVC เทียบกับ Hypalon
      desc: การเปรียบเทียบที่ชัดเจนของผ้า PVC และ Hypalon สำหรับเรือเป่าลม — ความทนทาน, ความต้านทาน UV, และค่าใช้จ่าย
    - title: Drop-Stitch อธิบายแกนหลัก
      desc: วิธีที่เส้นด้ายในตัวหลายพันเส้นสร้างแพลตฟอร์มแข็งแรงที่ 12-15 PSI สำหรับ SUPs เป่าลมประสิทธิภาพสูง
    - title: ภาพรวมเทคโนโลยีเป่าลม
      desc: วิธีการสร้างเรือและ SUPs เป่าลม — ตั้งแต่การจัดวางวัสดุไปจนถึงระบบวาล์วและการเชื่อมตะเข็บ
    - title: คู่มือเรือแข็งเป่าลม (Rigid Inflatable Boat, RIB)
      desc: ทุกเรื่องเกี่ยวกับการก่อสร้าง RIB, ประเภทตัวเรือ, วัสดุท่อ, และการเลือก RIB ที่เหมาะกับความต้องการของคุณ
    - title: เรือเป่าลม vs RIB
      desc: ความแตกต่างสำคัญระหว่างกะลาที่เป่าลมแบบดั้งเดิมกับเรือแข็งเป่าลมในกรณีการใช้งานต่าง ๆ
  water-safety:
    - title: คู่มือความปลอดภัยทางน้ํา
      desc: ความรู้ด้านความปลอดภัยที่จำเป็นสำหรับผู้พายทุกคน — สภาพอากาศ, เสื้อชูชีพ, การช่วยเหลือตัวเอง, และระเบียบการพายเป็นกลุ่ม
    - title: คู่มือเสื้อชูชีพ & PFD
      desc: วิธีการเลือกอุปกรณ์ช่วยลอยตัวส่วนบุคคลที่เหมาะสมสำหรับ SUP, พายเรือคายัค, การทำกิจกรรมทางน้ำ, และการใช้งานแบบมืออาชีพ
    - title: SUP รายการตรวจสอบความปลอดภัย
      desc: รายการตรวจสอบความปลอดภัยก่อนลงน้ำที่ผู้พายสแตนด์อัพแพดเดิลบอร์ดทุกคนควรปฏิบัติก่อนลงน้ำ
    - title: ความปลอดภัยในการพายเรือในน้ำเย็น
      desc: ข้อควรระวัง อุปกรณ์ และเทคนิคที่จำเป็นสำหรับการพายเรือในสภาพน้ำเย็น
    - title: ข้อผิดพลาดของผู้เริ่มต้นพายเรือ
      desc: ข้อผิดพลาดที่พบบ่อยสำหรับผู้พายเรือครั้งแรกและวิธีหลีกเลี่ยงเพื่อประสบการณ์ที่ปลอดภัยและสนุกสนานมากขึ้น
    - title: CE การรับรองอธิบาย
      desc: ความหมายของการรับรอง CE สำหรับเรือเป่าลม — มาตรฐาน การทดสอบ และเหตุผลว่าทำไมจึงมีความสำคัญต่อความปลอดภัย
ui:
  read_guide: อ่านคู่มือ →
  card_tech: วิศวกรรมความปลอดภัยทางทะเลและการทดสอบวัสดุ
  card_products: สำรวจแคตตาล็อกผลิตภัณฑ์ Aquafarer ทั้งหมด
