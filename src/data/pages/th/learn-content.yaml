materials:
  intro_p1: ประสิทธิภาพ ความทนทาน และความปลอดภัยของกระดานพายแบบเป่าลมขึ้นอยู่กับวัสดุที่ใช้ในการสร้างเกือบทั้งหมด ตั้งแต่ชั้นลามิเนตที่เป็นตัวเรือไปจนถึงเส้นด้ายที่ให้ความแข็งแรงแก่กระดาน SUP ทุกการเลือกวัสดุล้วนมีผลกระทบต่อการทำงานของผลิตภัณฑ์บนผิวน้ำและความทนทานต่อการใช้งาน
  intro_p2: 'คู่มือนี้ครอบคลุมสามวัสดุหลักที่ใช้ในกระดานพายแบบเป่าลมสมัยใหม่: ลามิเนต PVC, แกน drop-stitch และโฟมสำหรับปูพื้น EVA การเข้าใจวัสดุเหล่านี้จะช่วยให้คุณเลือกกระดานที่เหมาะสมกับความต้องการและดูแลรักษาให้ยาวนาน'
  labels:
    advantages: ข้อดี
    limitations: ข้อจำกัด
    best_for: 'เหมาะสำหรับ:'
  items:
    - name: PVC (โพลีไวนิลคลอไรด์)
      summary: มาตรฐานอุตสาหกรรมสำหรับ SUPs แบบเป่าลม ผ้าลามิเนตหลายชั้นให้ความแข็งแรงต่อแรงน้ำหนักที่ยอดเยี่ยมในราคาที่เอื้อมถึง
      pros:
        - คุ้มค่ากับเงินที่จ่าย
        - เบาและง่ายต่อการจัดการ
        - ทนต่อ UV ได้ดีเมื่อเคลือบอย่างเหมาะสม
        - มีสีและผิวให้เลือกหลากหลาย
        - ซ่อมง่ายด้วยแผ่นปะ PVC และกาวละลาย
      cons:
        - อายุการใช้งานทั่วไป 7-10 ปี หากดูแลอย่างเหมาะสม
        - ยืดหยุ่นน้อยกว่าในอุณหภูมิเย็น
        - ทนต่อสารเคมีต่ำกว่า
        - อาจเกิดการเคลื่อนย้ายพลาสติไซเซอร์เมื่อเวลาผ่านไป
      best_for: SUPs สำหรับสันทนาการและท่องเที่ยว การพายกับครอบครัว การใช้งานตามฤดูกาล สภาพน้ำจืดและชายฝั่ง
    - name: แกน Drop-Stitch
      summary: เทคโนโลยีที่เปลี่ยนแปลงเรือเป่าลม SUPs มีเส้นใยโพลีเอสเตอร์นับพันเชื่อมระหว่างชั้นผ้าด้านบนและด้านล่าง ทำให้สามารถพองลมแรงดันสูงเพื่อให้ได้สมรรถนะแบบแข็งและเปลือกแข็ง
      pros:
        - แข็งมากที่ 12-20 PSI
        - เบา — 18-30 ปอนด์สำหรับบอร์ดขนาดเต็ม
        - พับแบนเพื่อจัดเก็บและการเดินทาง
        - ทนต่อแรงกระแทกได้ดีมาก
        - ให้สมรรถนะคงที่ในช่วงอุณหภูมิที่แตกต่างกัน
      cons:
        - ต้องใช้ปั๊มแรงดันสูง
        - การซ่อมรอยเจาะซับซ้อนกว่าชั้นเดียว
        - ค่าใช้จ่ายในการผลิตสูงกว่าสินค้าเป่าลมทั่วไป
        - การสูญเสียแรงดันตามเวลา ต้องเติมลมเป็นระยะ
      best_for: กระดานพายแบบยืนและอุปกรณ์ใด ๆ ที่ต้องการประสิทธิภาพแข็งแกร่งพร้อมความสะดวกในการพกพาแบบพองลม
    - name: EVA โฟมเด็ค
      summary: โฟมปิดเซลล์ EVA (เอทิลีน-ไวนิลอะซิเตท) ใช้สำหรับแผ่นยึดบนบอร์ด SUP มีคุณสมบัติในการรองรับแรงกระแทก, ให้การยึดเกาะ และเป็นฉนวนความร้อน — และมีลวดลายชุดศิลปะติดมาด้วย
      pros:
        - ยึดเกาะไม่ลื่นได้ดีทั้งเปียกและแห้ง
        - เบาะรองลดความเหนื่อยล้าระหว่างพายระยะยาว
        - ฉนวนความร้อนจากพื้นดาดฟ้าเย็น
        - ทนต่อ UV และน้ำเค็ม
        - มีให้เลือกแบบหลายสีและลายสลักด้วยเลเซอร์
      cons:
        - สามารถใช้งานหนักได้นาน 2-3 ปี
        - ต้องมีการยึดอย่างเหมาะสมเพื่อป้องกันการลอกเลเยอร์
        - ไม่ใช่โครงสร้าง — ไม่มีผลต่อความแข็งแรง
        - เพิ่มน้ำหนักเล็กน้อย (200-400 กรัมต่อแผ่น)
      best_for: SUP พื้นด้านบนของดาดฟ้า, การออกแบบดาดฟ้าแบบชุดศิลปะ, และพื้นผิวใด ๆ ที่ต้องการการยึดเกาะเพื่อป้องกันการลื่น
  selection:
    title: คู่มือการเลือกวัสดุ
    subtitle: 'เลือกวัสดุที่เหมาะสมตามการใช้งานหลักของคุณ:'
    headers:
      - กรณีการใช้งาน
      - วัสดุที่แนะนำ
      - เหตุผล
    rows:
      - - พายเรือเพื่อสันทนาการ SUP
        - Drop-stitch PVC
        - น้ำหนักเบา แข็งแรง ราคาไม่แพง — สมดุลที่เหมาะสำหรับผู้พายเรือทั่วไป
      - - ครอบครัวและการพายนักเริ่มต้น
        - กว้าง drop-stitch PVC (32"+)
        - มีความมั่นคงและให้อภัยง่าย — ทำให้ผู้พายครั้งแรกมั่นใจ
      - - การตกปลา & พายพร้อมอุปกรณ์หนัก
        - กว้าง drop-stitch PVC พร้อมดาดฟ้า EVA เต็ม
        - ความมั่นคงพิเศษสำหรับการยืนและการขว้าง สูงสำหรับเก็บอุปกรณ์
      - - บอร์ดให้เช่า SUP
        - Drop-stitch PVC + EVA ดาดฟ้า
        - ทนทาน ซ่อมแซมได้ คุ้มค่าสำหรับการใช้งานที่หมุนเวียนเร็ว
      - - ท่องเที่ยว & พายระยะไกล
        - Drop-stitch PVC (~11 ฟุต)
        - ติดตามได้ดีขึ้นและลื่นไหลอย่างมีประสิทธิภาพสำหรับระยะทาง
      - - โยคะ & พายออกกำลังกาย
        - กว้าง drop-stitch PVC พร้อมดาดฟ้า EVA เต็ม
        - แพลตฟอร์มมั่นคงและสะดวกสบายสำหรับท่าทางและการออกกำลังกาย
  deep_dive:
    title: คู่มือการดำน้ำเชิงลึก
    topics:
      - title: PVC เกรดทางทะเล
        desc: ผ้าหลายชั้นแบบลามิเนต PVC — การทนต่อ UV การทดสอบการขัดถู และค่าการวัดเดนิเยร์อธิบายไว้
      - title: PVC ชั้นลามิเนต
        desc: วิธีที่ PVC ลามิเนตหลายชั้นสร้างสมดุลระหว่างความแข็งแรง น้ำหนัก และการต้านทาน UV
      - title: แกน Drop-Stitch
        desc: วิธีที่เส้นด้ายภายในนับพันสร้างโครงสร้างเป่าลมที่แข็งและทนแรงดันสูงที่ 15 PSI
      - title: เทคโนโลยีการเชื่อมด้วยคลื่นความถี่วิทยุ
        desc: การเชื่อมด้วยความถี่สูงสร้างรอยต่อที่แข็งแรงและสม่ำเสมอ — วิธีการทำงานและเหตุผลที่สำคัญ
      - title: PSI & ประสิทธิภาพ
        desc: ทำไมความดันอากาศถึงสำคัญต่อ SUPs แบบเป่าลม — ความแข็งแรง ความจุน้ำหนัก และคุณภาพการขับเคลื่อน
      - title: การทดสอบคุณภาพ
        desc: การทดสอบความดัน การทดสอบการลอย UV การเสื่อมสภาพ และการทดสอบแบบทำลาย — กระบวนการคุณภาพของเรา
      - title: EVA แผ่นโฟมสำหรับดาดฟ้า
        desc: แผ่นฟองน้ำ EVA ปิดเซลล์สำหรับดาดฟ้า — การยึดเกาะ ความสะดวกสบาย และความทนทานสำหรับดาดฟ้า SUP
      - title: การดูแลรักษาวัสดุ
        desc: การทำความสะอาด การปกป้อง UV การป้องกันเชื้อรา และแนวทางการจัดเก็บที่ดีที่สุดสำหรับผลิตภัณฑ์เป่าลม
