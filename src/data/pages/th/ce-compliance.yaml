content_scope:
  tagline: ขอบเขตการปฏิบัติตามข้อกําหนด
  title: ผลิตภัณฑ์ใดที่ต้องใช้<br />RCD การปฏิบัติตาม?
  subtitle: คําสั่งเรือเพื่อการพักผ่อน 2013/53/EU ใช้กับเรือเพื่อการพักผ่อนที่มีความยาวตัวเรือระหว่าง 2.5 เมตร ถึง 24 เมตรการเข้าใจขอบเขตเป็นก้าวแรกสู่การปฏิบัติตามข้อกําหนด
  items:
    - title: RIB เรือ (2.5–24 ม.)
      description: เรือยางแข็งที่มีความยาวลําเรือตั้งแต่ 2.5 เมตรถึง 24 เมตร จะอยู่ในกลุ่มRCDหมวดหมู่การออกแบบ A ถึง D ขึ้นอยู่กับสภาพทะเลที่ตั้งใจไว้และแรงลมสูงสุด
      icon: tabler:sailboat
    - title: เรือเป่าลม (ต่ํากว่า 2.5 เมตร)
      description: เรือยางขนาดเล็กและเรือยางขนาดเล็กที่มีความยาวต่ํากว่า 2.5 เมตร อาจได้รับการยกเว้นบางส่วน RCD แต่ยังต้องCEได้รับการทําเครื่องหมายภายใต้ข้อกําหนดอื่น ๆ และISOมาตรฐานการก่อสร้าง EN 6185
      icon: tabler:sailboat
    - title: SUP บอร์ดและอุปกรณ์เสริม
      description: กระดานพายแบบยืนอยู่นอกRCDขอบเขตอย่างไรก็ตาม อุปกรณ์ลอยตัวส่วนบุคคล (PFDs) ที่เกี่ยวข้องต้องCEได้รับการทําเครื่องหมายภายใต้ข้อบังคับ PPE (EU) 2016/425 โดยได้รับUSCGการรับรองประเภท III/V หากมี
      icon: tabler:swimming
    - title: เรือที่ยังสร้างไม่เสร็จ
      description: เรือที่ส่งมอบโดยไม่มีเครื่องยนต์หรือการติดตั้งเฉพาะจะต้องมีคําประกาศของผู้สร้างสําหรับเรือที่สร้างเสร็จบางส่วน โดยผู้RCDสร้างหรือผู้นําเข้าต้องปฏิบัติตามข้อกําหนดอย่างครบถ้วน
      icon: tabler:tool
content_trust_layers:
  tagline: ระบบความน่าเชื่อถือสามชั้น
  title: ข้อมูลความสอดคล้องทางกฎหมาย<br />— แชร์ในระดับที่เหมาะสม
  subtitle: ไม่ใช่ข้อมูลความสอดคล้องทั้งหมดที่เหมาะสมสำหรับเว็บไซต์สาธารณะ เราใช้แนวทางสามชั้นที่ปกป้องทรัพย์สินทางปัญญา ในขณะเดียวกันก็สร้างความมั่นใจให้ผู้ซื้อ
  items:
    - title: ชั้นที่ 1 — เว็บไซต์สาธารณะ
      description: มีการอ้างอิงมาตรฐาน, อธิบายเส้นทางความสอดคล้อง, ระบุประเภทเอกสาร, ขอบเขตการรับรองตามตระกูลรุ่น ไม่มีการให้ใบรับรองจริง, ข้อมูลการทดสอบ หรือรายละเอียดวิศวกรรมที่เป็นกรรมสิทธิ์
      icon: tabler:world
    - title: ชั้นที่ 2 — แชร์หลังจากสอบถาม
      description: 'หลังจากการสอบถามที่มีคุณสมบัติ: ตัวอย่าง DoC ที่แก้ไขแล้ว, รูปถ่ายป้ายผู้สร้าง, รายการมาตรฐานที่ใช้ได้, รายการตรวจสอบความสอดคล้อง, และสรุปการรับรองวัสดุ — แชร์ภายใต้ข้อกำหนดการใช้ที่ยุติธรรม'
      icon: tabler:mail
    - title: ชั้นที่ 3 — NDA / ระยะการสั่งซื้อ
      description: ไฟล์ทางเทคนิคเต็ม, การประเมินความเสี่ยง, การคำนวณความมั่นคง, รายงานการทดสอบ, บันทึกล็อตวัสดุ, และเอกสารการติดตามการผลิต — แชร์เฉพาะภายใต้ NDA กับผู้ซื้อที่ยืนยันแล้ว
      icon: tabler:lock
content_standards:
  tagline: มาตรฐานที่ใช้ได้
  title: ISO และมาตรฐาน EN<br />เราสร้างตาม
  subtitle: ผลิตภัณฑ์ของเราได้รับการออกแบบและทดสอบตามมาตรฐานที่ประสานกันภายใต้ RCD มีการอ้างอิงหมายเลขและชื่อมาตรฐาน; ข้อความมาตรฐานเต็มยังคงมีลิขสิทธิ์ ISO
  items:
    - title: EN ISO 6185-3
      description: 'เรือเป่าลม — ตอนที่ 3: เรือที่มีกำลังสูงสุดของมอเตอร์ 15 กิโลวัตต์หรือมากกว่า ข้อกำหนดด้านโครงสร้าง, ความมั่นคง, การลอยตัว, และการกู้คืนบุคคลตกน้ำสำหรับ RIBs'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'เรือเป่าลม — ตอนที่ 4: เรือที่มีกำลังสูงสุดของมอเตอร์ 15 กิโลวัตต์และมากกว่าหรือเท่ากับ 4.5 กิโลวัตต์ ข้อกำหนดเพิ่มเติมด้านโครงสร้างและความมั่นคง'
      icon: tabler:file-text
    - title: ISO 12215 ซีรีส์
      description: เรือขนาดเล็ก — การก่อสร้างลำเรือและการวัดความหนา การออกแบบโครงสร้างของลำเรือ, ระเบียง, และผนังกันน้ำสำหรับลำเรือ RIB ไฟเบอร์กลาสและอลูมิเนียม
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: เรือขนาดเล็ก — คู่มือเจ้าของ เอกสารเนื้อหาและรูปแบบที่ต้องใช้สำหรับคู่มือเจ้าของที่มาพร้อมกับเรือ RIB แต่ละลำที่ส่งภายในสหภาพยุโรป
      icon: tabler:book
    - title: EN ISO 14945
      description: เรือขนาดเล็ก — ป้ายผู้สร้าง ข้อมูลที่ต้องทำเครื่องหมายบนป้ายผู้สร้างซึ่งติดอย่างถาวรกับเรือแต่ละลำ
      icon: tabler:badge
    - title: ISO 8666
      description: เรือขนาดเล็ก — ข้อมูลหลัก การวัดและพารามิเตอร์มาตรฐานเพื่อให้มีข้อกำหนดสอดคล้องกันในเอกสารผลิตภัณฑ์ทั้งหมด
      icon: tabler:dimensions
content_process:
  tagline: กระบวนการความสอดคล้อง
  title: กระบวนการความสอดคล้อง 6 ขั้นตอน CE<br />เวิร์กโฟลว์
  subtitle: ตั้งแต่ขอบเขตโครงการไปจนถึงการติดตามระดับซีเรียล — ทุกแบบ RIB ปฏิบัติตามเส้นทางความสอดคล้องที่กำหนดไว้
  steps:
    - number: '01'
      title: ขอบเขตโครงการและการจัดประเภท
      description: กําหนดRIBโมเดล หมวดหมู่การออกแบบ (A/B/C/D) จํานวนคนสูงสุด น้ําหนักบรรทุก กําลังเครื่องยนต์ และตลาดเป้าหมายกําหนดว่าRCDมีการใช้หรือไม่ และโมดูลการประเมินความสอดคล้องใดที่จําเป็น
      timeline: 2–3 วัน
    - number: '02'
      title: การระบุข้อกําหนดที่เกี่ยวข้อง
      description: ระบุข้อกําหนดด้านความปลอดภัยที่จําเป็นทั้งหมดจากRCDภาคผนวก I มาตรฐานที่สอดคล้องกันที่เกี่ยวข้อง (EN ISO 6185, 12215, 10240, 14945) และข้อกําหนดระดับชาติเพิ่มเติมสําหรับตลาดเป้าหมาย
      timeline: 3–5 วัน
    - number: '03'
      title: การออกแบบและเอกสารทางเทคนิค
      description: 'สร้างไฟล์เทคนิคหลัก: แบบการจัดวางทั่วไป การคํานวณความมั่นคงและแรงลอยตัว การประเมินความเสี่ยง ข้อกําหนดวัสดุ และการวิเคราะห์ความปลอดภัยของระบบ (เชื้อเพลิง ไฟฟ้า การบังคับเลี้ยว)'
      timeline: 10–15 วัน
    - number: '04'
      title: การตรวจสอบและทดสอบผลิตภัณฑ์
      description: ดําเนินการตรวจสอบทางกายภาพ — ทดสอบแรงดันที่แรงดันที่กําหนด 1.25x เป็นเวลา 24–48 ชั่วโมง, ทดสอบความมั่นคงและแรงลอยตัว, การทดสอบโหลด และการเริ่มใช้งานระบบบันทึกผลการทดสอบทั้งหมดต่อตัวเรือ
      timeline: 5–7 วัน
    - number: '05'
      title: การทําเครื่องหมายและเอกสารการจัดส่ง
      description: ติดCEเครื่องหมาย ป้ายผู้สร้าง (EN ISO 14945) และ HIN/CIN (หมายเลขประจําตัวเรือ)เตรียมประกาศความสอดคล้องของสหภาพยุโรป คู่มือเจ้าของ (EN ISO 10240) และรายการตรวจสอบความสอดคล้อง
      timeline: 2–3 วัน
    - number: '06'
      title: การติดตามย้อนกลับระดับซีเรียล
      description: แต่ละลําเรือจะได้รับบันทึกตัวเรือเฉพาะที่เชื่อมโยงกับไฟล์เทคนิคหลัก ชุดผลิต ใบรับรองวัสดุ ผลการทดสอบ และการกําหนดค่าขั้นสุดท้ายบันทึกจะถูกเก็บไว้เป็นเวลา 10+ ปีต่อRCD
      timeline: กําลังดําเนินอยู่
content_document_cards:
  tagline: ประเภทของเอกสาร
  title: เอกสารการปฏิบัติตามข้อกําหนด<br />ไพ่
  subtitle: นี่คือประเภทเอกสารที่เราจัดเตรียมและดูแลสําหรับCERIBแต่ละรุ่นที่ได้รับการรับรองตัวอย่างสามารถขอรับได้เมื่อสอบถามอย่างมีคุณภาพ
  items:
    - title: CE / RCD ใบรับรองความสอดคล้อง
      description: ใบรับรองเฉพาะรุ่นที่ยืนยันว่ายานเป็นไปตามข้อกําหนดความปลอดภัยที่จําเป็นทั้งหมดตาม RCD 2013/53/EU ซึ่งออกโดยผู้ผลิตโดยมีหน่วยงานที่ได้รับแจ้งเข้าร่วมเมื่อจําเป็น
      icon: tabler:certificate
    - title: คําประกาศความสอดคล้องของสหภาพยุโรป (DoC)
      description: คําประกาศที่ลงนามโดยผู้ผลิตหรือผู้แทนที่ได้รับอนุญาต ระบุข้อกําหนดที่ใช้บังคับ มาตรฐาน โมดูลความสอดคล้อง และรายละเอียดของหน่วยงานที่ได้รับแจ้งจําเป็นสําหรับทุกรุ่นที่วางจําหน่ายในตลาดสหภาพยุโรป
      icon: tabler:file-check
    - title: แผ่นผู้สร้าง (EN ISO 14945)
      description: ป้ายติดถาวรที่แสดงจํานวนคนสูงสุด กําลังเครื่องยนต์สูงสุด หมวดหมู่การออกแบบ และหมายเลขผู้ผลิตต้องยังคงอ่านได้ตลอดอายุการใช้งานของยาน
      icon: tabler:badge
    - title: คู่มือเจ้าของรถ (EN ISO 10240)
      description: คู่มือฉบับสมบูรณ์ครอบคลุมการใช้งานอย่างปลอดภัย ขั้นตอนฉุกเฉิน ตารางการบํารุงรักษา และคําเตือนด้านความปลอดภัยบังคับสําหรับทุกRIBการจัดส่งในสหภาพยุโรป
      icon: tabler:book
    - title: ISO รายงานการทดสอบและตรวจสอบ
      description: บันทึกการทดสอบแรงดัน (1.25x / 24–48 ชั่วโมง), ผลการทดสอบความมั่นคงและแรงลอยตัว, ใบรับรองการทดสอบวัสดุ และรายงานการตรวจสอบขนาด — ทั้งหมดนี้เชื่อมโยงกับหมายเลขตัวเรือเฉพาะ
      icon: tabler:test-pipe
    - title: บันทึกการติดตามวัสดุ
      description: การติดตามย้อนกลับในระดับล็อตสําหรับผ้าท่อ กาว ไฟเบอร์กลาส และฮาร์ดแวร์เชื่อมโยงแต่ละหน่วยผลิตกับใบรับรองวัสดุที่เข้ามาและผลการตรวจสอบ IQC
      icon: tabler:link
    - title: การตรวจสอบคุณภาพและบันทึก QC
      description: รายการตรวจสอบคุณภาพ 100 จุดต่อหน่วย, บันทึก QC ระหว่างกระบวนการ, รายงานการไม่เป็นไปตามข้อกําหนด และการดําเนินการแก้ไขเป็นส่วนหนึ่งของห่วงโซ่การติดตามย้อนกลับการผลิต
      icon: tabler:clipboard-check
    - title: ชุดเอกสารโครงการ
      description: ชุดเอกสารสําหรับแต่ละตัวเรือ รวมถึงบันทึกการกําหนดค่าขั้นสุดท้าย รายละเอียดการติดตั้งเครื่องยนต์และอุปกรณ์ รายการตรวจสอบการเริ่มใช้งาน และเอกสารการส่งมอบ
      icon: tabler:package
content_design_categories:
  tagline: RCD หมวดหมู่การออกแบบ
  title: หมวดหมู่การออกแบบ A–D<br />— ความหมายของพวกมัน
  subtitle: ระบบนี้RCDกําหนดประเภทการออกแบบตามแรงลมสูงสุดและความสูงของคลื่นที่เรือถูกออกแบบให้ทนทาน
  items:
    - title: หมวดหมู่ A — มหาสมุทร
      description: ออกแบบสําหรับการเดินทางระยะไกลที่แรงลมอาจเกิน Beaufort 8 (>40 นอต) และความสูงของคลื่นที่สําคัญอาจเกิน 4 เมตรต้องการการตรวจสอบโครงสร้างและความมั่นคงอย่างเข้มงวดที่สุด
      icon: tabler:ripple
    - title: หมวดหมู่ B — นอกชายฝั่ง
      description: ออกแบบสําหรับการเดินทางนอกชายฝั่งที่มีแรงลมสูงสุดถึง Beaufort 8 (≤40 นอต) และคลื่นสูงถึง 4 เมตรเหมาะสําหรับน่านน้ําชายฝั่งและน่านน้ํากึ่งเปิดเผย
      icon: tabler:anchor
    - title: หมวดหมู่ C — เรือชายฝั่ง
      description: ออกแบบมาสําหรับการเดินทางตามชายฝั่งที่มีแรงลมสูงสุดถึง Beaufort 6 (≤27 นอต) และระดับคลื่นสูงถึง 2 เมตรกิจกรรมสันทนาการส่วนใหญ่RIBsอยู่ในประเภทนี้
      icon: tabler:sun
    - title: หมวดหมู่ D — ที่พักพิง
      description: ออกแบบมาสําหรับน่านน้ําที่มีที่กําบัง โดยมีแรงลมสูงสุดถึง Beaufort 4 (≤16 นอต) และคลื่นสูงถึง 0.3 เมตรทะเลสาบ แม่น้ํา และท่าเรือที่ได้รับการคุ้มครอง
      icon: tabler:pool
content_hin:
  tagline: การระบุเรือ
  title: HIN / CIN & แผ่นผู้สร้าง
  subtitle: เรือทุกRIBลําต้องมีหมายเลขประจําตัวเรือ (HIN) หรือหมายเลขประจําเรือ (CIN) และป้ายทะเบียนผู้สร้างตามISOข้อกําหนด EN 14945 RCD
  items:
    - title: หมายเลขประจําตัวตัวเรือ (HIN)
      description: รหัสเฉพาะ 14 ตัวอักษรที่ติดอยู่ทางด้านขวาของท้ายเรือ โดยเข้ารหัสรหัสผู้ผลิต (MIC) ปีรุ่น ปีผลิต และหมายเลขซีเรียลจําเป็นสําหรับการเข้าสู่ตลาดสหภาพยุโรป
      icon: tabler:hash
    - title: หมายเลขประจําตัวเรือ (CIN)
      description: ตามมาตรฐาน EN ISO 10087 หมายเลขประจําตัวรองที่ซ่อนอยู่ในที่ซ่อนเพื่อวัตถุประสงค์ป้องกันการโจรกรรมและการตรวจสอบย้อนกลับ
      icon: tabler:eye-off
    - title: เนื้อหาบนแผ่นผู้สร้าง
      description: จํานวนคนสูงสุด กําลังเครื่องยนต์สูงสุด (kW) น้ําหนักบรรทุกสูงสุด (กก.) หมวดหมู่การออกแบบ ชื่อผู้ผลิต และCEเครื่องหมาย — ทั้งหมดจะแสดงอย่างถาวรบนแผ่นป้องกันการกัดกร่อน
      icon: tabler:badge
content_tech_file:
  tagline: โครงสร้างไฟล์ทางเทคนิค
  title: ไฟล์เทคนิคหลัก<br />& บันทึกของเรือ
  subtitle: 'ระบบเอกสารของเรามีโครงสร้างสองชั้น: ไฟล์เทคนิคหลักสําหรับแต่ละตระกูลโมเดล และบันทึกตัวเรือแต่ละลําที่ผลิต'
  items:
    - title: ไฟล์เทคนิคหลัก
      description: 'ประกอบด้วยเอกสารความสอดคล้องครบถ้วนสําหรับตระกูลโมเดล: การจัดวางทั่วไป การประเมินความเสี่ยง การคํานวณความมั่นคง/ความลอยตัว สเปกวัสดุ มาตรฐานที่ใช้บังคับ และบันทึกการประเมินความสอดคล้องเก็บรักษาไว้เป็นเวลา 10+ ปี'
      icon: tabler:folder
    - title: บันทึกตัวเรือ (การตรวจสอบย้อนกลับต่อเรือ)
      description: 'แต่ละตัวถังจะมีบันทึกเฉพาะที่เชื่อมโยงกับไฟล์เทคนิคหลัก: HIN, วันที่ผลิต, ล็อตท่อ, ใบรับรองวัสดุ, ผลการทดสอบแรงดัน, การกําหนดค่าสุดท้าย, การติดตั้งเครื่องยนต์ และจุดหมายปลายทางการส่งมอบ'
      icon: tabler:file-description
    - title: ชุดการปฏิบัติตามข้อกําหนดของลูกค้า
      description: แพ็คเกจจัดส่งตามตัวเรือ รวมถึง DoC, รูปถ่ายป้ายทะเบียนผู้สร้าง, คู่มือเจ้าของ, สรุปการทดสอบ และแผ่นข้อมูลการกําหนดค่าขั้นสุดท้าย — พร้อมจัดส่งRIBทุกชิ้นไปยังสหภาพยุโรป
      icon: tabler:package
content_material_cert:
  tagline: การรับรองวัสดุ
  title: การติดตามย้อนกลับวัสดุ &<br />หลักฐานการรับรอง
  subtitle: เรือคุณภาพRIBเริ่มต้นด้วยวัสดุที่ควบคุมได้และกระบวนการที่มีการบันทึกไว้ด้านล่างนี้คือวิธีที่เราจัดระเบียบการรับรองวัสดุสําหรับแต่ละกลุ่มชิ้นส่วนสําคัญ
  items:
    - title: การตรวจสอบย้อนกลับวัสดุท่อเป่าลม
      description: PVC วัสดุและCSMHypalon/ท่อจะถูกเลือกตามการใช้งานที่ตั้งใจไว้ สภาพภูมิอากาศ และตลาดเป้าหมายข้อมูลทางเทคนิคของผู้จัดหา (TDS) ข้อมูลชุดวัสดุ การติดตามย้อนกลับของชุดผ้า UV และรายงานการทดสอบการผุกร่อน รวมถึงREACHคําประกาศ /SVHC มีให้ภายในขอบเขตเอกสารโครงการที่ตกลงกันไว้
      icon: tabler:circle
    - title: การติดตามย้อนกลับอลูมิเนียมทางทะเล
      description: สําหรับโครงการตัวเรืออลูมิเนียม จะมีRIBการควบคุมเกรด ความหนา และวัสดุตามข้อกําหนดที่ได้รับอนุมัติเอกสารรับรองการทดสอบวัสดุ (MTC/MTR), EN 10204 3.1, รายงานองค์ประกอบทางเคมีและคุณสมบัติทางกล และการติดตามความร้อน/ล็อต จะถูกจัดเตรียมเมื่อมีข้อตกลง
      icon: tabler:rectangle
    - title: การควบคุมวัสดุและกระบวนการของตัวเรือ GRP
      description: สําหรับตัวเรือไฟเบอร์กลาส RIBsเจลโค้ท เรซิน ไฟเบอร์กลาส การเสริมความแข็งแรงและวัสดุแกน จะถูกจัดการผ่านข้อกําหนดที่ควบคุมได้ข้อมูลวัสดุ TDS/SDS, บันทึกการผลิต, ข้อกําหนดลามิเนต และบันทึกการอบแห้งและควบคุมเวิร์กช็อป มีให้ตามข้อตกลงโครงการ
      icon: tabler:layers-subtract
    - title: การสนับสนุนเอกสารประกอบชิ้นส่วน
      description: สําหรับชิ้นส่วนที่เลือก — รวมถึงEVAวัสดุบนดาดฟ้า ที่นั่ง ฮาร์ดแวร์สแตนเลส ระบบเชื้อเพลิง อุปกรณ์ไฟฟ้า และอุปกรณ์เสริมทางทะเล — เอกสารจากซัพพลายเออร์ที่เกี่ยวข้องจะถูกประสานงานตามการกําหนดค่าสุดท้ายและความต้องการตลาดปลายทาง
      icon: tabler:package
    - title: ประกาศขอบเขตการปฏิบัติตามข้อกําหนด
      description: ใบรับรอง รายงานการทดสอบ และเอกสารการปฏิบัติตามข้อกําหนดจะใช้ได้เฉพาะกับรุ่นผลิตภัณฑ์ วัสดุ ชิ้นส่วน ชุดการผลิต หรือขอบเขตโครงการที่ระบุในเอกสารที่เกี่ยวข้องเท่านั้นติดต่อเราพร้อมข้อมูลตลาดเป้าหมาย การใช้งานที่ตั้งใจไว้ และข้อกําหนดทางเทคนิค เพื่อให้สามารถยืนยันชุดเอกสารที่เกี่ยวข้องก่อนการสั่งซื้อ
      icon: tabler:info-circle
faq:
  title: CE การปฏิบัติตามข้อกําหนด — คําถามที่พบบ่อย
  questions:
    - q: Paddle Board Overstock RIB เรือทุกลําCEได้รับการรับรองสําหรับตลาดสหภาพยุโรปหรือไม่?
      a: RIB เรือในแคตตาล็อกของเราได้รับการออกแบบและจัดทําเอกสารเพื่อRCDปฏิบัติตามข้อกําหนด 2013/53/EU ตามข้อกําหนดของสหภาพยุโรปที่ใช้บังคับCEการทําเครื่องหมายจะใช้ได้ตามแต่ละรุ่นและแต่ละการตั้งค่าติดต่อเราเพื่อขอเอกสารขอบเขตการปฏิบัติตามข้อกําหนดเฉพาะรุ่น
    - q: ความแตกต่างระหว่างRCDการปฏิบัติตามข้อกําหนดและการทําเครื่องหมายคืออะไรCE?
      a: RCD (ข้อกําหนดเรือสันทนาการ 2013/53/EU) เป็นกฎหมายของสหภาพยุโรปที่กําหนดข้อกําหนดด้านความปลอดภัยที่จําเป็นCEการทําเครื่องหมายคือสัญลักษณ์ภาพที่วางบนผลิตภัณฑ์ที่ได้รับการประเมินและยืนยันว่าเป็นไปตามข้อกําหนดเหล่านั้นผลิตภัณฑ์ต้องเป็นไปตามข้อกําหนดRCDก่อนที่จะสามารถติดCEเครื่องหมายได้
    - q: คุณมีเอกสารรับรองความสอดคล้องกับเรือแต่ละลําหรือไม่?
      a: ใช่เรือทุกลําที่RIBส่งมอบสู่ตลาดสหภาพยุโรปจะมีคําประกาศความสอดคล้องเฉพาะรุ่นของสหภาพยุโรปที่ระบุข้อกําหนดที่ใช้บังคับ มาตรฐานที่สอดคล้องกัน โมดูลการประเมินความสอดคล้อง และรายละเอียดของหน่วยงานที่แจ้ง
    - q: โมดูลการประเมินความสอดคล้องที่ใช้คืออะไรPaddle Board Overstock?
      a: โมดูลขึ้นอยู่กับประเภทการออกแบบและประเภทของเรือRIBโมเดลส่วนใหญ่ในประเภทการออกแบบ C ใช้โมดูล A (การควบคุมการผลิตภายใน)สําหรับเรือประเภทการออกแบบ A/B หรือการกําหนดค่าเฉพาะ โมดูล B+C หรือ B+D อาจสมัครได้โดยมีหน่วยงานแจ้งให้ทราบเข้าร่วมเราแนะนําโมดูลที่เหมาะสมสําหรับแต่ละโครงการ
    - q: คุณสามารถแบ่งปันเอกสารการปฏิบัติตามข้อกําหนดก่อนที่เราจะสั่งซื้อได้หรือไม่?
      a: หลังจากสอบถามอย่างมีเงื่อนไข เราจะแบ่งปันเอกสารขอบเขตการปฏิบัติตามที่ระบุมาตรฐานที่เกี่ยวข้อง เส้นทางความสอดคล้อง และประเภทเอกสารที่มีให้สําหรับรุ่นที่คุณกําลังประเมินไฟล์ทางเทคนิคฉบับเต็มจะถูกแชร์NDAภายใต้การยืนยันคําสั่งซื้อ
    - q: หมายเลขประจําตัวเรือ (HIN) คืออะไร และรวมอยู่ในนั้นหรือไม่?
      a: HIN เป็นรหัสประจําตัวเฉพาะที่มีความยาว 14 ตัวอักษร ซึ่งถูกทําเครื่องหมายถาวรบนเรือแต่ละลํา โดยเข้ารหัสรหัสผู้ผลิต (MIC) ชื่อรุ่น ปีผลิต และหมายเลขซีเรียล HIN เป็นข้อบังคับสําหรับRIBเรือทุกลําที่วางจําหน่ายในตลาดสหภาพยุโรป และจะถูกระบุไว้ในทุกลําPaddle Board Overstock RIB
    - q: ไฟล์เทคนิคถูกเก็บไว้นานแค่ไหน?
      a: ตามRCDข้อกําหนด 2013/53/EU ผู้ผลิตต้องเก็บแฟ้มข้อมูลทางเทคนิคไว้อย่างน้อย 10 ปีนับจากวันที่สินค้าถูกวางขายในตลาดครั้งสุดท้ายPaddle Board Overstockเก็บรักษาเอกสารทางเทคนิคอย่างครบถ้วนสําหรับทุกรุ่นที่ผลิต
    - q: คุณช่วยเหลือเรื่องภาระผูกพันของผู้นําเข้าภายใต้ RCD?
      a: ใช่เรามีชุดเอกสารที่ผู้นําเข้าในสหภาพยุโรปต้องการเพื่อปฏิบัติตามข้อผูกพันของตน ได้แก่ การเข้าถึงแฟ้มข้อมูลทางเทคนิค เอกสารประกอบ ป้ายทะเบียนผู้สร้าง คู่มือเจ้าของ และบันทึกการติดตามผลิตภัณฑ์ความรับผิดชอบของผู้นําเข้าภายใต้ข้อกําหนดเหล่านี้RCDถูกบันทึกไว้อย่างชัดเจนในคู่มือการปฏิบัติตามข้อกําหนดของเรา
cta:
  title: ต้องการขอบเขตการปฏิบัติตามข้อกําหนดเฉพาะของสหภาพยุโรปหรือไม่?
  subtitle: ขอรายการตรวจสอบการปฏิบัติตามข้อกําหนดโดยละเอียดสําหรับRIBรุ่นและการกําหนดค่าที่คุณกําลังประเมิน — รวมถึงมาตรฐานที่เกี่ยวข้อง เส้นทางความสอดคล้อง และเอกสารที่มีอยู่
  actions:
    - variant: primary
      text: ขอเอกสารการปฏิบัติตามข้อกําหนด
      href: /contact
    - text: ดูใบรับรอง
      href: /certifications
