hero:
  tagline: CE & RCD การปฏิบัติตามข้อกําหนด
  title: RIB CE การปฏิบัติตามกฎระเบียบของเรือ<br />และเอกสารทางเทคนิค
  subtitle: Paddle Board Overstock RIB เรือและเรือเป่าลมได้รับการออกแบบและจัดทําเอกสารเพื่อให้เป็นไปตามข้อกําหนดของตลาดสหภาพยุโรปภายใต้ข้อกําหนดเรือเพื่อการพักผ่อน 2013/53/EU ตั้งแต่การประเมินความเสี่ยงจนถึงการประกาศความสอดคล้อง เรามีเอกสารการปฏิบัติตามเฉพาะรุ่นสําหรับลําเรือทุกลํา
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: RIB CE เอกสารและการรับรองการปฏิบัติตามข้อกําหนดของเรือ
direct_answer: Paddle Board Overstock จัดเตรียมRCDเอกสารการปฏิบัติตามมาตรฐาน 2013/53/EU เฉพาะรุ่นสําหรับRIBเรือและเรือเป่าลม รวมถึงแฟ้มข้อมูลทางเทคนิค คําประกาศความสอดคล้อง ป้ายผู้ผลิต และคู่มือเจ้าของ — ทั้งหมดสอดคล้องกับ EN ISO 6185, ISO 12217 และมาตรฐานที่เป็นมาตรฐานเดียวกันที่เกี่ยวข้อง
