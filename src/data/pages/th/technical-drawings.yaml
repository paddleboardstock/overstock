hero:
  tagline: แบบร่างทางเทคนิค & CAD
  title: RIB & เรือยาง<br />ดาวน์โหลดแบบร่างทางเทคนิค & CAD
  subtitle: แผนภาพ GA ระดับการวางแผน แผ่นมิติ และการจัดวางดาดฟ้าสำหรับการประเมินโครงการและข้อกำหนด เข้าถึงแบบร่างทางเทคนิคในระดับที่เหมาะสม — ตั้งแต่ PDF สาธารณะไปจนถึงไฟล์ STEP ระดับโครงการ
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB ดาวน์โหลดแบบร่างและ CAD ของเรือ
direct_answer: Aquafarer ให้บริการแบบร่างทางเทคนิคระดับการจัดซื้อสำหรับเรือ RIB และยานพาหนะทางน้ำแบบพอง — รวมถึง PDF ของการจัดวางทั่วไป (GA) แผ่นมิติ และแบบจัดวางดาดฟ้า รูปแบบที่มีรายละเอียดสูงกว่า (DXF/DWG, STEP/IGES) สามารถเข้าถึงได้หลังจากสอบถามคุณสมบัติหรือตามแอปพลิเคชันโครงการ
