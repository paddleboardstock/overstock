    detail: การเคลือบตัวเรือ ข้อมูลแม่พิมพ์
content_tiers:
  tagline: ระดับการดาวน์โหลด
  title: สี่ระดับการเข้าถึง<br />— รายละเอียดที่ถูกต้องสำหรับขั้นตอนที่เหมาะสม
  subtitle: เราจัดเตรียมแบบร่างระดับการจัดซื้อ ไม่ใช่ไฟล์ระดับการผลิต แต่ละระดับสอดคล้องกับขั้นตอนโครงการที่แตกต่างกัน
  items:
    - title: ระดับ 1 — PDF สาธารณะ
      description: การจัดวางทั่วไป (GA) แบบมิติ 4 มุมมอง และการจัดวางดาดฟ้าในรูปแบบ PDF ดาวน์โหลดได้ฟรี เพียงพอสำหรับการวางแผนโครงการ การจัดสรรพื้นที่ และการตรวจสอบข้อกำหนดเบื้องต้น
      icon: tabler:file-type-pdf
    - title: ระดับ 2 — DXF/DWG แบบฟอร์มง่าย
      description: ไฟล์ CAD 2 มิติ (DXF หรือ DWG) สำหรับการรวมเลย์เอาต์ระดับการวางแผน ต้องกรอกแบบฟอร์มคุณสมบัติสั้น ๆ (ชื่อบริษัท ประเภทโครงการ การใช้งานที่ตั้งใจไว้) ไม่มีข้อมูลโครงสร้างหรือการผลิตรวมอยู่
      icon: tabler:file-code
    - title: ระดับ 3 — STEP/IGES สำหรับแอปพลิเคชันโครงการ
      description: ไฟล์รุ่น 3 มิติ (STEP หรือ IGES) สำหรับการรวมระบบ การออกแบบอุปกรณ์ หรือการประสานงานสถาปัตยกรรมเรือ ต้องยื่นคำขอโครงการพร้อมขอบเขต ระยะเวลา และเจตนาร่วมซื้อ ขึ้นอยู่กับการอนุมัติ
      icon: tabler:cube
    - title: ระดับ 4 — วิศวกรรม NDA
      description: แบบทางโครงสร้างตัวเรือ ตารางการเคลือบ ขยายการตัดท่อ และข้อมูลแม่พิมพ์ มีให้เฉพาะภายใต้ NDA พร้อมคำสั่งซื้อที่ยืนยันแล้ว ไฟล์เหล่านี้เป็นไฟล์ระดับการผลิต — ไม่ใช่สำหรับการแจกจ่ายสู่สาธารณะ
      icon: tabler:lock
content_included:
  tagline: สิ่งที่รวมอยู่ในรายการ
  title: เนื้อหาภาพวาด<br />ต่อรุ่น
  subtitle: แต่ละแบบมีชุดแบบมาตรฐานที่ครอบคลุมข้อมูลการวางแผนที่สําคัญสําหรับB2Bผู้ซื้อและวิศวกรโครงการ
  items:
    - title: ข้อตกลงทั่วไป (GA)
      description: ด้านข้าง มุมมองด้านบน และหน้าตัดแสดงรูปทรงตัวถัง ตําแหน่งท่อ ตําแหน่งคอนโซล ที่นั่ง ระบบเชื้อเพลิง และขนาดสําคัญ (LOA, ความกว้าง, เส้นผ่านศูนย์กลางท่อ, มุมเดดไรซ์)สถานะการแก้ไขและลิขสิทธิ์ระบุไว้บนบล็อกชื่อเรื่อง
      icon: tabler:layout
    - title: ภาพวาดขนาด 4 มุมมอง
      description: มุมมองด้านข้าง ด้านหน้า ด้านหลัง และด้านบน พร้อมขนาดโดยรวมสําหรับการวางแผนการขนส่ง (ความสูงบนเทรลเลอร์, คานสําหรับตู้คอนเทนเนอร์, น้ําหนักสําหรับยก)รวมการกําหนดค่าการใช้งานและการขนส่ง
      icon: tabler:ruler-2
    - title: แผนผังดาดฟ้าและอุปกรณ์
      description: มุมมองจากด้านบนแสดงฐานคอนโซล ตําแหน่งที่นั่ง ตําแหน่ง D-ring ตําแหน่งไฟนําทาง การเข้าถึงปั๊มน้ําเรือ ช่องเก็บแบตเตอรี่/เชื้อเพลิง และจุดติดตั้งอุปกรณ์ความแม่นยําจํากัดบนอินเทอร์เฟซเฉพาะ
      icon: tabler:map
    - title: แบบร่างการขนส่งและบรรจุภัณฑ์
      description: แผนการบรรทุกตู้คอนเทนเนอร์ ขนาดแท่นวาง การกระจายน้ําหนัก และตําแหน่งจุดยกสําหรับการวางแผนโลจิสติกส์รวมตัวเลือกบรรจุภัณฑ์มาตรฐานและแบบกําหนดเอง
      icon: tabler:truck
content_protection:
  tagline: การป้องกันทรัพย์สินทางปัญญา
  title: สิ่งที่เราไม่แบ่งปัน<br />& ทําไม
  subtitle: การปกป้องทรัพย์สินทางวิศวกรรมของเราช่วยให้เราสามารถลงทุนในงานวิจัยและพัฒนาต่อไปได้ ในขณะที่ยังคงมีทุกสิ่งที่ผู้ซื้อต้องการสําหรับการวางแผนโครงการ
  items:
    - title: ข้อมูลแกนแกนตัวเรือ
      description: รูปทรงปลั๊กและแม่พิมพ์ CNC เส้นทางเครื่องมือ และแม่แบบเคลือบเป็นทรัพย์สินเฉพาะของการผลิตจะไม่ถูกแชร์ในระดับการเข้าถึงใด ๆ นอกเหนือจากสัญญาที่ได้รับการยืนยันNDAแล้ว
      icon: tabler:ban
    - title: การขยายตัวสําหรับการตัดท่อ
      description: ไฟล์ตัดแบบแบนสําหรับผ้าท่อเป็นข้อมูลระดับการผลิตมีให้เฉพาะNDAเมื่อมีคําสั่งซื้อที่ยืนยันแล้ว และแบ่งปันเฉพาะกับคู่สัญญาเท่านั้น
      icon: tabler:ban
    - title: การคํานวณโครงสร้าง
      description: การวิเคราะห์ความเครียดโดยละเอียด ผลลัพธ์ FEA และตารางลามิเนตเป็นเอกสารที่ละเอียดอ่อนต่อการปฏิบัติตามข้อกําหนด ซึ่งจะถูกแบ่งปันเฉพาะกับหน่วยงานที่ได้รับแจ้งและNDAลูกค้าที่มีพันธะผูกพันในระหว่างกระบวนการประเมินความสอดคล้อง
      icon: tabler:ban
    - title: การคัดกรองคู่แข่ง
      description: เราขอสงวนสิทธิ์ในการปฏิเสธคําขอเข้าถึง CAD ที่ดูเหมือนมาจากคู่แข่ง นักศึกษาที่ไม่มีบริบทโครงการ หรือฝ่ายที่ไม่มีเจตนาจัดซื้อที่ชอบด้วยกฎหมาย
      icon: tabler:shield
content_models:
  tagline: รุ่นที่มีให้เลือก
  title: แบบแปลนทางเทคนิค<br />ความพร้อมจําหน่ายตามรุ่น
  subtitle: มีไฟล์ PDF GA สําหรับRIBโมเดลเรือหลักและเรือเป่าลมของเราติดต่อเราสําหรับแบบโมเดลเฉพาะที่ไม่ได้ระบุไว้
  items:
    - title: AF580 RIB
      description: 5.8 เมตรRIB, ตัวเรือ GRP deep-V Hypalon หรือPVCท่อ, คอนโซลกลางมีข้อมูลแบบ GA, ขนาด, การจัดวางดาดฟ้า และแผนการขนส่งหมวดหมู่การออกแบบ C
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5.2 ม. RIB, ตัวเรือ GRP แบบ moderate-V, Hypalon หรือ PVC ท่อ, คอนโซลข้างหรือกลาง. GA และขนาดมีให้. หมวดการออกแบบ C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4.3 ม. RIB, ตัวเรือ GRP, PVC ท่อ, พวงมาลัยหรือคอนโซล. GA และขนาดมีให้. หมวดการออกแบบ C/D.
      icon: tabler:sailboat
    - title: AF380 เรือยาง
      description: เรือยางพอง 3.8 ม., พื้นอลูมิเนียม, PVC ท่อ. GA และขนาดบรรจุมีให้. เป็นไปตามมาตรฐาน EN ISO 6185.
      icon: tabler:sailboat
    - title: AF320 เรือยาง
      description: เรือยางพอง 3.2 ม., พื้นแอร์เด็ค, PVC ท่อ. GA และขนาดบรรจุมีให้. เป็นไปตามมาตรฐาน EN ISO 6185.
      icon: tabler:sailboat
