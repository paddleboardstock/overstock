content_version_control:
  tagline: การควบคุมเวอร์ชัน
  title: เวอร์ชันวาด<br />การบริหารจัดการ
  subtitle: แบบร่างทุกฉบับจะปฏิบัติตามระบบการแก้ไขที่ควบคุมได้โปรดตรวจสอบเสมอว่าคุณมีการแก้ไขฉบับปัจจุบันก่อนใช้แบบร่างในการวางแผนโครงการ
  items:
    - title: การติดตามการแก้ไข
      description: แต่ละแบบร่างจะมีรหัสแก้ไข (Rev-A, Rev-B, Rev-C), วันที่ออก, วันที่ตรวจสอบล่าสุด, รุ่น/การกําหนดค่าที่เกี่ยวข้อง, หน่วย, ขนาดไฟล์ และรูปแบบเฉพาะเวอร์ชัน "ปัจจุบัน" เท่านั้นที่สามารถดาวน์โหลดได้
      icon: tabler:git-branch
    - title: ประกาศสถานะการวาดภาพ
      description: แบบร่างสาธารณะทั้งหมดจะถูกระบุว่า "เฉพาะการจัดวางเบื้องต้นเท่านั้น — ไม่สําหรับการก่อสร้าง การรับรอง หรือการใช้งานในการผลิตขนาดขึ้นอยู่กับข้อกําหนดสุดท้ายและการยืนยันคําสั่งซื้อ"สิ่งนี้ช่วยปกป้องทั้งสองฝ่ายจากการใช้งานผิดพลาด
      icon: tabler:alert-circle
    - title: อัปเดตการแจ้งเตือน
      description: เมื่อข้อกําหนดของโมเดลเปลี่ยนแปลง การปรับปรุงแบบร่างจะถูกอัปเดตและเวอร์ชันก่อนหน้าจะถูกทําเครื่องหมายว่า "แทนที่"ผู้ใช้ที่ลงทะเบียนซึ่งดาวน์โหลดแพ็ก DXF/DWG จะได้รับแจ้งเกี่ยวกับการอัปเดตที่สําคัญทางอีเมล
      icon: tabler:bell
faq:
  title: ภาพวาดทางเทคนิค — คําถามที่พบบ่อย
  questions:
    - q: ไฟล์ PDF ของ GA ฟรีจริงหรือ?
      a: ใช่ไฟล์ PDF สําหรับการจัดวางทั่วไปสําหรับรุ่นหลักของเรามีให้ฟรี — กรอกแบบฟอร์มคุณสมบัติสั้น ๆ ด้านล่าง และลิงก์ดาวน์โหลดจะถูกส่งทางอีเมลภายใน 1 วันทําการเอกสารเหล่านี้มีข้อมูลระดับการวางแผนที่เพียงพอสําหรับการประเมินโครงการ การจัดสรรพื้นที่ และการตรวจสอบข้อกําหนดเบื้องต้น
    - q: ฉันจะเข้าถึงไฟล์ DXF/DWG ได้อย่างไร?
      a: กรอกแบบฟอร์มคุณสมบัติสั้น ๆ บนหน้าดาวน์โหลดโดยระบุชื่อบริษัท ประเภทโครงการ และการใช้งานที่ตั้งใจไว้คําขอที่ได้รับการอนุมัติจะได้รับลิงก์ดาวน์โหลดทางอีเมลภายใน 1 วันทําการ
    - q: ฉันสามารถใช้โมเดล 3D STEP/IGES ได้ไหม?
      a: ไฟล์โมเดล 3D STEP หรือ IGES สามารถดาวน์โหลดได้ผ่านกระบวนการสมัครโครงการของเราระบุขอบเขตโครงการ ข้อกําหนดการผสานรวม กําหนดเวลา และความตั้งใจซื้อขึ้นอยู่กับการอนุมัติ — โดยปกติภายใน 3-5 วันทําการ
    - q: ทําไมคุณถึงจํากัดการเข้าถึงไฟล์ที่มีรายละเอียดสูง?
      a: รูปทรงตัวถัง ข้อมูลแม่พิมพ์ และการคํานวณโครงสร้าง สะท้อนถึงการลงทุนด้านวิจัยและพัฒนาเป็นเวลาหลายปี และเป็นทรัพย์สินทางปัญญาหลักของการผลิตเรามอบทุกสิ่งที่จําเป็นสําหรับการวางแผนจัดซื้อและการบูรณาการโครงการ พร้อมทั้งปกป้องความสามารถในการลงทุนต่อไปในการพัฒนาผลิตภัณฑ์ใหม่
    - q: แบบแปลนมีรายละเอียดการผลิตไหม?
      a: ไม่แบบสาธารณะและแบบแบบน้ําหนักเบามีข้อมูลระดับการจัดซื้อจัดจ้างสําหรับการวางแผนและการกําหนดข้อกําหนดรายละเอียดระดับการผลิต (ตารางการเคลือบ เส้นทางเครื่องมือ การขยายการตัด) จะแบ่งปันเฉพาะNDAกับคําสั่งซื้อที่ได้รับการยืนยันเท่านั้น
    - q: มีแบบร่างสําหรับการกําหนดค่าแบบกําหนดเองหรือกึ่งปรับแต่งRIBหรือไม่?
      a: แบบร่างโครงการแบบกําหนดเองจะถูกจัดเตรียมเป็นส่วนหนึ่งของOEMODMกระบวนการพัฒนาหากคุณกําลังประเมินโครงการตามสั่ง กรุณาRIBติดต่อเราพร้อมความต้องการของคุณ และเราจะจัดเตรียมแบบ GA เฉพาะโครงการเป็นส่วนหนึ่งของข้อเสนอ
