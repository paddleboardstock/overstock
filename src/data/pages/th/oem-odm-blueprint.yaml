process_steps:
  title: กระบวนการ 6 ขั้นตอน OEM/ODM
  subtitle: จากบรีฟการออกแบบไปยัง FOB ชิงเต่า — กระบวนงานที่ราบรื่น
  steps:
    - number: '01'
      title: บรีฟการออกแบบ & การทำแบบจำลอง CAD 3D
      description: แบ่งปันข้อกำหนดเป้าหมาย ผลิตภัณฑ์อ้างอิง หรือแนวคิด ทีมวิศวกรรมของเราพัฒนาภาพร่าง CAD โดยละเอียดและภาพ 3D เพื่อการอนุมัติของคุณ
      timeline: 3–5 วัน
    - number: '02'
      title: การเลือกวัสดุ & การทดสอบผ้า
      description: เลือกจาก PVC เกรดกองทัพ (0.9–1.2 มม.) Hypalon CSM หรือผ้าคอร์ drop-stitch เราดำเนินการทดสอบแรงดึง การยึดเกาะของเคลือบ และความคงทน UV
      timeline: 2–3 วัน
    - number: '03'
      title: การสร้างต้นแบบอย่างรวดเร็ว & การผลิตตัวอย่าง
      description: เราผลิตแม่พิมพ์แบบกำหนดเองด้วยเครื่อง CNC และผลิตตัวอย่างก่อนการผลิตด้วยสีแบรนด์ โลโก้ และวัสดุที่ระบุ ตัวอย่างถูกจัดส่งเพื่อขอการอนุมัติของคุณ
      timeline: 7–14 วัน
    - number: '04'
      title: ทดสอบการเก็บแรงดันสูง 24–48 ชั่วโมง
      description: แต่ละต้นแบบผ่านการทดสอบการเก็บแรงดันอย่างเข้มงวดที่ 1.25 เท่าของแรงดันที่กำหนด การทดสอบการลอกเย็บและการตรวจสอบขนาดถูกดำเนินการ
      timeline: 1–2 วัน
    - number: '05'
      title: CE/ISO การตรวจสอบคุณภาพ & การบรรจุภัณฑ์
      description: รายการตรวจสอบคุณภาพ 100 จุด ทุกหน่วยได้รับการตรวจสอบก่อนบรรจุภัณฑ์พร้อมขาย CE ใบรับรองความสอดคล้อง และ BSCI รายงานการปฏิบัติตามกฎหมายรวมอยู่ด้วย
      timeline: 2–3 วัน
    - number: '06'
      title: FOB การขนส่ง & โลจิสติกส์ชิงเต่า
      description: สินค้าสำเร็จรูปถูกจัดลงพาเลท, ห่อพลาสติกหด, และบรรจุลงตู้คอนเทนเนอร์ที่ท่าชิงเต่า เอกสารส่งออกครบถ้วน, การผ่านพิธีการศุลกากร, และสามารถติดตามสถานะแบบเรียลไทม์
      timeline: 7–14 วัน
