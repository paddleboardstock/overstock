hero_text:
  tagline: ขอใบเสนอราคา
  title: ขอใบเสนอราคา<br />สำหรับโครงการของคุณ
  subtitle: บอกเราถึงความต้องการของคุณ และทีมงานของเราจะตอบกลับด้วยใบเสนอราคาที่ละเอียดภายใน 2 วันทำการ
steps2_process:
  title: มันทำงานอย่างไร
  subtitle: สี่ขั้นตอนง่ายๆ จากการสอบถามไปสู่การเสนอราคา
  items:
    - title: 'ขั้นตอนที่ 1: ส่งความต้องการของคุณ'
      description: กรุณากรอกแบบฟอร์มด้านล่างพร้อมประเภทสินค้า ปริมาณ และรายละเอียดสินค้า ยิ่งคุณให้รายละเอียดมาก การเสนอราคาก็จะยิ่งแม่นยำมากขึ้น
      icon: tabler:file-text
    - title: 'ขั้นตอนที่ 2: เราทบทวนและให้คำแนะนำ'
      description: ทีมวิศวกรรมของเราจะตรวจสอบความต้องการของคุณและอาจติดต่อคุณเพื่อขอคำชี้แจง เราให้คำแนะนำเกี่ยวกับการกำหนดค่าผลิตภัณฑ์และตัวเลือกต่างๆ
      icon: tabler:users
    - title: 'ขั้นตอนที่ 3: รับใบเสนอราคาของคุณ'
      description: คุณจะได้รับใบเสนอราคาที่ละเอียดรวมถึงราคาต่อหน่วย, MOQ, ระยะเวลาในการผลิต, เงื่อนไขการชำระเงิน และตัวเลือกการจัดส่ง โดยปกติภายใน 48 ชั่วโมง
      icon: tabler:currency-dollar
    - title: 'ขั้นตอนที่ 4: ตัวอย่างและการผลิต'
      description: หลังจากการยอมรับใบเสนอราคา เราจะดำเนินการผลิตตัวอย่าง (ถ้ามี) หรือไปสู่การผลิตจำนวนมากโดยตรง มีการอัปเดตเป็นประจำตลอดกระบวนการ
      icon: tabler:building-factory
content_form:
  tagline: แบบฟอร์มใบเสนอราคา
  title: บอกเราเกี่ยวกับโครงการของคุณ
  subtitle: ช่องทั้งหมดที่มี * เป็นช่องที่ต้องกรอก
  fields:
    - name: ประเภทสินค้า
      type: select
      options:
        - RIB เรือ
        - เรือยาง
        - SUP คณะกรรมการ
        - เรือคายัคแบบเป่าลม
        - เสื้อชูชีพ
        - อุปกรณ์เสริมทางทะเล
        - กำหนดเอง OEM/ODM
    - name: แอปพลิเคชัน
      type: select
      options:
        - ศูนย์ดำน้ำ
        - การตกปลา
        - การท่องเที่ยวทางทะเล / รีสอร์ท
        - ค้นหาและกู้ภัย
        - เรือยอร์ชขนาดเล็ก
        - เรือทำงานเชิงพาณิชย์
        - รัฐบาล / กองทัพ
        - OEM / แบรนด์ส่วนตัว
        - ส่วนบุคคล / ใช้เพื่อความเพลิดเพลิน
        - อื่น ๆ
    - name: จำนวน
      type: text
      placeholder: เช่น 50 หน่วย
    - name: ตลาดเป้าหมาย
      type: text
      placeholder: เช่น ยุโรป, อเมริกาเหนือ, ตะวันออกกลาง
    - name: ประเทศที่จะส่งมอบ
      type: text
      placeholder: เช่น อิตาลี, UAE, USA, ออสเตรเลีย
    - name: ความชอบวัสดุ
      type: select
      options:
        - ไม่จำกัดความชอบ
        - PVC เกรดทางทะเล (1100 dtex)
        - Hypalon / CSM คุณภาพพรีเมียม
        - ตัวเรือไฟเบอร์กลาส
        - ตัวเรืออลูมิเนียม
    - name: ความต้องการเครื่องยนต์
      type: text
      placeholder: เช่น เครื่องยนต์นอกเรือ 60 HP, ไม่มีเครื่องยนต์, เครื่องยนต์คู่ 115 HP
    - name: ความต้องการปรับแต่ง
      type: text
      placeholder: เช่น สีที่กำหนดเอง, แบรนด์/โลโก้, การบรรจุ, อุปกรณ์พิเศษ
    - name: ระยะเวลา
      type: text
      placeholder: เช่น ส่งมอบภายใน 90 วัน
    - name: ความต้องการเพิ่มเติม
      type: textarea
      placeholder: อธิบายการใช้งาน ข้อกำหนดทางเทคนิค หรือความต้องการพิเศษอื่น ๆ — รวมถึงภาพวาดอ้างอิง ข้อกำหนด หรือลิงก์ถ้ามี
    - name: อัปโหลดข้อกำหนด
      type: file
      placeholder: อัปโหลดแผ่นข้อกำหนด ภาพวาด หรือเอกสารอ้างอิงของคุณ (PDF, DWG, DXF)
    - name: อัปโหลดโลโก้ / งานศิลปะ
      type: file
      placeholder: อัปโหลดโลโก้หรืองานศิลปะของคุณสำหรับการสร้างแบรนด์แบบกำหนดเอง (AI, EPS, PNG)
content_rfq_types:
  tagline: ระบบ RFQ 3 ระดับ
  title: เลือกสิ่งที่ถูกต้อง<br />ระดับการสอบถาม
  subtitle: โครงการที่แตกต่างกันต้องการระดับรายละเอียดที่แตกต่างกัน เลือกรูปแบบที่ตรงกับขั้นตอนการซื้อของคุณ
  items:
    - title: สอบถามด่วน
      description: 5-6 ช่อง, 30 วินาที สำหรับการติดต่อเบื้องต้น คำถามทั่วไป หรือการติดตามดาวน์โหลดทรัพยากร เราจะตอบกลับภายใน 24 ชั่วโมงพร้อมข้อมูลพื้นฐานและขั้นตอนถัดไป
      icon: tabler:bolt
    - title: คำขอเสนอราคามาตรฐาน
      description: 8-10 ช่อง, 2 นาที สำหรับการเสนอราคาสินค้าเฉพาะพร้อมการเลือกโมเดล จำนวน และข้อกำหนดการจัดส่ง รับใบเสนอราคาละเอียดภายใน 48 ชั่วโมง
      icon: tabler:file-text
    - title: โครงการขอใบเสนอราคา
      description: 10-14 ช่องสนาม, 5 นาที สำหรับ RIB, กองเรือรีสอร์ท, การกู้ภัย หรือโครงการของรัฐบาลที่ต้องการการกำหนดค่าที่กำหนดเอง, เอกสารการปฏิบัติตามกฎระเบียบ, และการวางแผนจัดหาสินค้าเป็นหลายปี มีผู้จัดการโครงการเฉพาะมอบหมาย
      icon: tabler:clipboard-list
form_quick:
  title: สอบถามด่วน
  subtitle: การติดต่ออย่างรวดเร็วสำหรับคำถามทั่วไปและคำขอข้อมูลเบื้องต้น
  fields:
    - name: ชื่อเต็ม
      label: ชื่อเต็ม
      type: text
      required: true
      placeholder: ชื่อเต็มของคุณ
    - name: อีเมลธุรกิจ
      label: อีเมลธุรกิจ
      type: email
      required: true
      placeholder: you@company.com
    - name: ชื่อบริษัท
      label: ชื่อบริษัท
      type: text
      required: true
      placeholder: บริษัทของคุณ
    - name: ประเภทผู้ซื้อ
      label: ฉันเป็น...
      type: select
      required: true
      options:
        - ตัวแทนจำหน่าย / ผู้นำเข้า
        - เจ้าของแบรนด์ / แบรนด์ส่วนตัว
        - รีสอร์ท / ศูนย์น้ำ
        - ผู้ให้เช่า
        - รัฐบาล / หน่วยกู้ภัย
        - ผู้ประกอบการดำน้ำ / ตกปลา
        - วิศวกรทางทะเล / ช่างปรับสภาพเรือ
        - อื่น ๆ
    - name: ความสนใจในผลิตภัณฑ์
      label: ความสนใจในผลิตภัณฑ์
      type: multiselect
      required: true
      options:
        - RIB เรือ
        - เรือเป่าลม
        - SUP กระดาน
        - อุปกรณ์ความปลอดภัย
        - อุปกรณ์เสริม
        - OEM/ODM ที่กำหนดเอง
    - name: message
      label: คุณต้องการอะไร
      type: textarea
      required: false
      placeholder: คำอธิบายสั้น ๆ เกี่ยวกับความต้องการของคุณ...
form_standard:
  title: คำขอเสนอราคามาตรฐาน
  subtitle: คำขอใบเสนอราคาละเอียดสำหรับสินค้าประเภทและจำนวนเฉพาะ
  fields:
    - name: ชื่อเต็ม
      label: ชื่อเต็ม
      type: text
      required: true
    - name: อีเมลธุรกิจ
      label: อีเมลธุรกิจ
      type: email
      required: true
    - name: ชื่อบริษัท
      label: ชื่อบริษัท
      type: text
      required: true
    - name: ประเภทผู้ซื้อ
      label: ประเภทผู้ซื้อ
      type: select
      required: true
    - name: รุ่นสินค้า
      label: รุ่น / ประเภทของสินค้า
      type: text
      required: true
      placeholder: เช่น AF580 RIB, AF380 พองตัว
    - name: quantity
      label: จำนวนที่ประมาณ
      type: text
      required: true
      placeholder: ตัวอย่างเช่น 10-20 หน่วย
    - name: ตลาดเป้าหมาย
      label: ตลาดเป้าหมาย / ภูมิภาค
      type: text
      required: true
      placeholder: เช่น สหภาพยุโรป อเมริกาเหนือ ตะวันออกกลาง
    - name: ระยะเวลาการจัดส่ง
      label: การจัดส่งที่ต้องการ
      type: select
      required: true
      options:
        - ภายใน 30 วัน
        - 30-60 วัน
        - 60-90 วัน
        - การวางแผนล่วงหน้า (90+ วัน)
        - แค่กำลังหาข้อมูล
    - name: ต้องปฏิบัติตาม
      label: ข้อกำหนดการปฏิบัติตาม
      type: multiselect
      required: false
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - USCG
        - ISO 9001
        - BSCI
        - REACH
        - ไม่มี / ไม่แน่ใจ
    - name: message
      label: รายละเอียดเพิ่มเติม
      type: textarea
      required: false
form_project:
  title: โครงการขอใบเสนอราคา
  subtitle: การสอบถามโครงการอย่างครอบคลุมสำหรับกองยานพาหนะ โรงแรม หรือการจัดซื้อของรัฐบาล
  fields:
    - name: ชื่อเต็ม
      label: ชื่อเต็ม
      type: text
      required: true
    - name: อีเมลธุรกิจ
      label: อีเมลธุรกิจ
      type: email
      required: true
    - name: ชื่อบริษัท
      label: ชื่อบริษัท
      type: text
      required: true
    - name: ประเภทผู้ซื้อ
      label: ประเภทผู้ซื้อ
      type: select
      required: true
    - name: ประเภทโครงการ
      label: ประเภทโครงการ
      type: select
      required: true
      options:
        - กองยานพาหนะรีสอร์ต / โรงแรม
        - กองยานพาหนะให้เช่า
        - กองยานพาหนะกู้ภัย /ลาดตระเวน
        - กองยานพาหนะศูนย์ดำน้ำ
        - การจัดซื้อของรัฐบาล
        - ป้ายส่วนตัว / OEM
        - การสั่งซื้อสต็อกตัวแทนจำหน่าย
        - อื่น ๆ
    - name: ประเภทเรือ
      label: ประเภทเรือที่ต้องการ
      type: multiselect
      required: true
      options:
        - RIB เรือ
        - เรือเป่าลม / เรือเล็ก
        - SUP กระดาน
        - คายัค
        - อุปกรณ์ความปลอดภัย
    - name: ขนาดกองยานพาหนะ
      label: ขนาดกองยานพาหนะ / ช่วงจำนวน
      type: text
      required: true
      placeholder: เช่น 20-50 ยูนิตใน 12 เดือน
    - name: ความต้องการปรับแต่งพิเศษ
      label: ความต้องการกำหนดค่าเฉพาะ
      type: textarea
      required: false
      placeholder: ขนาดตัวเรือ วัสดุท่อ การจัดวางดาดฟ้า ข้อกำหนดแบรนด์...
    - name: ต้องปฏิบัติตาม
      label: ข้อกำหนดการปฏิบัติตามและการรับรอง
      type: multiselect
      required: true
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - ประเภท USCG III/V
        - ISO 9001
        - BSCI
        - REACH / RoHS
        - การรับรองตลาดภายในประเทศ
    - name: ตลาดเป้าหมาย
      label: ตลาดเป้าหมาย
      type: text
      required: true
    - name: ช่วงงบประมาณ
      label: ช่วงงบประมาณ
      type: select
      required: false
      options:
        - ต่ำกว่า $10,000
        - $10,000 - $50,000
        - $50,000 - $200,000
        - $200,000+
        - ไม่สะดวกที่จะระบุ
    - name: ระยะเวลาการจัดส่ง
      label: กำหนดเวลาโครงการ
      type: select
      required: true
      options:
        - ด่วน (ภายใน 30 วัน)
        - ปกติ (30-60 วัน)
        - วางแผน (60-90 วัน)
        - วางแผนในอนาคต (เกิน 90 วัน)
    - name: message
      label: รายละเอียดโครงการ & ข้อกำหนด
      type: textarea
      required: false
      placeholder: อธิบายโครงการ แอปพลิเคชัน และข้อกำหนดเฉพาะใด ๆ...
cta:
  title: สะดวกที่จะพูดคุยทางอีเมลหรือไม่?
  subtitle: ส่งคำถามของคุณโดยตรงไปยังทีมฝ่ายขายของเรา และเราจะตอบกลับภายใน 24 ชั่วโมง
  actions:
    - variant: primary
      text: ส่งอีเมลถึงเราโดยตรง
      href: /contact
