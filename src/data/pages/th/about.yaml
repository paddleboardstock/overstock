hero:
  tagline: เกี่ยวกับเรา
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock โรงงานและเวิร์กช็อป
  title: |
    วิศวกรรมทางทะเล<br />
    สร้าง<span class="text-accent dark:text-white">Paddle Board Overstock</span>ทาง
  subtitle: 'เราเริ่มต้นในเวิร์กช็อปบนชายฝั่งด้วยเรือลำหนึ่งและความเชื่อที่แน่วแน่: ผลิตภัณฑ์ทางทะเลควรถูกออกแบบราวกับว่ามีความสำคัญ เพราะมันมีความสำคัญ วันนนี้เราจัดส่งไปยังมากกว่า 50 ประเทศ แต่ทุกร่างเรือยังคงผ่านมือเดียวกับที่เริ่มต้นบริษัท'
stats:
  title: ตามตัวเลข
  columns: 4
  stats:
    - title: ตัวเรือที่ส่งมอบแล้ว
      amount: 2,400+
    - title: ประเทศที่จัดส่ง
      amount: 50+
    - title: ปีของประสบการณ์รวม
      amount: '60'
    - title: เวลาตอบสนองการรับประกันเฉลี่ย (ชั่วโมง)
      amount: '24'
features3_what_we_build:
  title: สิ่งที่เราสร้าง
  subtitle: สายผลิตภัณฑ์ที่มุ่งเน้นซึ่งเรารู้จักอย่างละเอียด — ไม่มีการทดลองที่ยังไม่สมบูรณ์ ไม่มีการปรับสัญลักษณ์เพื่อสร้างผลิตภัณฑ์ใหม่.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB เรือ
      description: ตัวเรืออะลูมิเนียม RIBs ตั้งแต่ 3.3 ม. ถึง 7.5 ม. ออกแบบมาสำหรับลาดตระเวน ดำน้ำ ตกปลา และใช้กับครอบครัว
      icon: tabler:ship
    - title: เรือยาง
      description: PVC และ Hypalon เรือยางเป่าลมขนาดตั้งแต่ 2.4 ม. ถึง 4.2 ม. น้ำหนักเบา แข็งแรง และเก็บง่าย
      icon: tabler:speedboat
    - title: เรือเล็กของซูเปอร์ยอชต์
      description: คอมแพค พิเศษสูง RIBs สร้างขึ้นตามสั่งให้เข้ากับรูปลักษณ์ของยานแม่ของคุณ
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: อุปกรณ์เสริม
      description: พาย ปั๊ม ฝาครอบ ถุงกันน้ำ ถังน้ำมัน และอุปกรณ์อิเล็กทรอนิกส์ ทั้งหมดเข้าคู่กับเรือของเรา
      icon: tabler:package
    - title: ปรับปรุงและซ่อมแซม
      description: การเปลี่ยนท่อภายใน, การปรับปรุงอุปกรณ์อิเล็กทรอนิกส์ และการอัปเกรดเครื่องยนต์
      icon: tabler:tool
    - title: การสร้างตามสั่ง
      description: การออกแบบเฉพาะโปรเจกต์สำหรับลูกค้าทางการค้า วิทยาศาสตร์ และทหาร
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: การสนทนาเกี่ยวกับการออกแบบและวิศวกรรมเรือ
steps2_values:
  title: ค่านิยมของเรา
  subtitle: สามหลักการที่ได้หล่อหลอมทุกผลิตภัณฑ์ตั้งแต่วันแรก
  items:
    - title: สร้างเหมือนกับว่ามันแบกครอบครัวของคุณ
      description: ทุกตัวถัง รอยเชื่อม และตัวยึดทุกชิ้นถูกปฏิบัติเหมือนกับว่าครอบครัวของเราเองจะใช้มัน
      icon: tabler:heart
    - title: วิศวกรก่อนขาย
      description: ถ้าสเปคผิดพลาด เราจะเปลี่ยนสเปคนั้น — ไม่เคยเปลี่ยนลูกค้า
      icon: tabler:settings
    - title: การสนับสนุนที่ยาวนานเกินระยะเวลารับประกัน
      description: ตัวถังที่มีอายุยี่สิบปียังคงเรียกเราขออะไหล่ และเราก็ยังรับสายได้
      icon: tabler:headset
steps2_milestones:
  title: เหตุการณ์สําคัญ
  subtitle: เรื่องราวสั้น ๆPaddle Board Overstock
  isReversed: true
  items:
    - title: ก่อตั้งขึ้นในเวิร์กช็อปริมชายฝั่ง
      description: เริ่มต้นโดยสถาปนิกเรือสองคนที่มีCNCโรงสีและแนวคิดที่ดื้อรั้น
      icon: tabler:building-factory
    - title: ลําเรือ 1,000 ลําแรกที่ส่งมอบ
      description: เข้าถึงได้ตั้งแต่ปีที่เจ็ด ส่วนใหญ่ผ่านการบอกต่อและลูกค้าประจํา
      icon: tabler:circle-check
    - title: โครงการส่งออกระหว่างประเทศ
      description: ขณะนี้จัดส่งไปยัง 50+ ประเทศ พร้อมพันธมิตรสนับสนุนในพื้นที่ใน 5 ทวีป
      icon: tabler:world
    - title: โครงสร้างการดําเนินงานระดับโลกใหม่
      description: ในเดือนกันยายน 2026 การดําเนินงานของแบรนด์ได้ย้ายจากกลุ่ม Vatrad ชิงเต่าไปยัง Weihai Dongjilian Co., Ltd. (นิวเม็กซิโก, สหรัฐอเมริกา); ศูนย์กลางการผลิตของชิงเต่ายังคงดําเนินการวิจัยและพัฒนา การผลิต และการส่งออกโดยตรงไปยังโรงงาน
      icon: tabler:building-skyscraper
features2_locations:
  title: สถานที่ตั้งของเรา
  tagline: ค้นหาเรา
  columns: 3
  items:
    - title: สํานักงานใหญ่และเวิร์กช็อป
      description: สวนอุตสาหกรรมชายฝั่ง อาคาร 4 — เปิดวันจันทร์–ศุกร์ ให้เข้าชมโดยนัดหมายล่วงหน้า
    - title: ศูนย์บริการของสหภาพยุโรป
      description: ท่าเรือเมดิเตอร์เรเนียน — การปรับปรุง ซ่อมแซม และสนับสนุนการรับประกันสําหรับลูกค้าชาวยุโรป
    - title: เครือข่ายพันธมิตร APAC
      description: พันธมิตรบริการที่ได้รับอนุญาตในออสเตรเลีย ญี่ปุ่น สิงคโปร์ และฮ่องกง
brand_hub_tagline: แบรนด์
brand_hub_title: สํารวจแบรนด์ของเรา
brand_hub_subtitle: เจาะลึกความเชี่ยวชาญด้านวิศวกรรมทางทะเล การมีตัวตนในระดับโลก และหลักการที่ขับเคลื่อนเรา
brand_hub_cards:
  - title: ความเชี่ยวชาญทางทะเล
    desc: หลายสิบปีแห่งวิทยาศาสตร์วัสดุ การผลิตที่แม่นยํา และการทดสอบในโลกจริง — ตั้งแต่PVCHypalonการผลิตไปจนถึงการออกแบบและเทคโนโลยีตัวถัง Deep-V drop-stitch
    link: /brand-marine-expertise
    link_label: เรียนรู้เพิ่มเติม→
  - title: การมีตัวตนทั่วโลก
    desc: จัดส่งไปยัง 50+ ประเทศจากสถานที่ของเราที่ชิงเต่า พร้อมผู้ร่วมให้บริการที่ได้รับอนุญาตทั่วยุโรป เอเชีย-แปซิฟิก และอเมริกา
    link: /brand-global-presence
    link_label: เรียนรู้เพิ่มเติม→
  - title: ทำไม Paddle Board Overstock
    desc: การรวมตั้งแต่ต้นน้ำถึงปลายน้ำ การรับรองคู่ (ISO 9001 + BSCI) การปฏิบัติตาม CE และ MOQs ต่ำ — สร้างขึ้นสำหรับแบรนด์ ผู้จัดจำหน่าย และหน่วยงานรัฐบาล
    link: /brand-why-paddleboardoverstock
    link_label: เรียนรู้เพิ่มเติม→
production_section:
  tagline: ความเป็นเลิศด้านการผลิต
  title: รับประกันความประณีตในงานฝีมือ
  description: สายการผลิต Paddle Board Overstock นี้มุ่งเน้นไปที่การผลิตเรือยางเป่าลมที่มีคุณภาพสูง ทนทาน และมีประสิทธิภาพสูง
  cards:
    - title: ทีมช่างผู้มีประสบการณ์
      items:
        - ความรู้เชิงวิชาชีพเกี่ยวกับ PVC, Hypalon, และวัสดุทางทะเล
        - ความประณีตแม่นยำในการตัด การเชื่อม และการติดตั้งอุปกรณ์เสริม
        - การฝึกอบรมอย่างต่อเนื่องเพื่อเชี่ยวชาญเทคโนโลยีการผลิตล่าสุด
    - title: อุปกรณ์การผลิตขั้นสูง
      items:
        - CNC อุปกรณ์ตัดสำหรับตัดผ้าอย่างแม่นยำโดยมีความผิดพลาดน้อยที่สุด
        - การเชื่อมร้อน/เย็นความแม่นยำสูงสำหรับรอยต่อที่แน่นและทนทาน
        - อุปกรณ์ทดสอบความแน่นและความตึงระดับมืออาชีพ
    - title: ระบบการจัดการที่มีประสิทธิภาพ
      items:
        - กระบวนการผลิตมาตรฐานพร้อมมาตรฐานคุณภาพที่ชัดเจน
        - ปรัชญาการผลิตแบบลีน การลดของเสียและปรับปรุงประสิทธิภาพ
        - การจัดการห่วงโซ่อุปทานอย่างมีประสิทธิภาพด้วยความร่วมมือกับผู้จัดจำหน่ายที่เชื่อถือได้
    - title: การควบคุมคุณภาพอย่างเข้มงวด
      items:
        - ระบบการจัดการคุณภาพที่ได้รับการรับรอง
        - 'การตรวจสอบหลายขั้นตอน: วัตถุดิบ, ระหว่างกระบวนการ, สินค้าสำเร็จออก'
        - การทดสอบความแน่นและความทนทานอย่างเข้มงวดก่อนการจัดส่ง
global_ops_section:
  tagline: สถาปัตยกรรมการปฏิบัติการระดับโลก
  title_html: หนึ่งแบรนด์<span class="text-white/90">สองฮับ</span>
  description_html: ตั้งแต่เดือนกันยายน พ.ศ. 2569 Paddle Board Overstock ได้ถูกดำเนินการโดย<strong class="text-white">Paddle Board Overstock บริษัทจำกัด</strong>(นิวเม็กซิโก, สหรัฐอเมริกา) — หน่วยงานระดับโลกสำหรับการจัดจำหน่าย การขายเชิงพาณิชย์ B2B สัญญา การเรียกเก็บเงิน และการบริการหลังการขาย งานวิจัยและพัฒนา การผลิต และการควบคุมคุณภาพยังคงอยู่ที่<strong class="text-white">Paddle Board Overstock ศูนย์การผลิตชิงเต่า</strong>, ซึ่งจัดส่งคำสั่งซื้อทุกคำสั่งโดยตรงจากโรงงาน FOB ชิงเต่า การเปลี่ยนแปลงนี้เปลี่ยนผู้ที่ลงนามในสัญญาของคุณ — ไม่ใช่ผู้ที่สร้างเรือของคุณ
  stats:
    - value: 2,400+
      label: ตัวเรือจัดส่งทั่วโลก
    - value: 50+
      label: ประเทศที่ส่งออก
    - value: 10+
      label: ปีแห่งการผลิต
