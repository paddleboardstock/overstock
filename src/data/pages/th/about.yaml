  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock โรงงานและเวิร์กช็อป
  title: เกี่ยวกับ <span class="text-accent dark:text-white">Paddle Board Overstock</span>
  subtitle: Brand-new inflatable SUP boards at overstock and clearance prices — backed by our own Weihai manufacturing since 2012, mixed-model wholesale for small retailers, and flexible worldwide shipping.
