features3_what_we_build:
  title: สิ่งที่เราสร้าง
  subtitle: สายผลิตภัณฑ์ที่มุ่งเน้นซึ่งเรารู้จักอย่างละเอียด — ไม่มีการทดลองที่ยังไม่สมบูรณ์ ไม่มีการปรับสัญลักษณ์เพื่อสร้างผลิตภัณฑ์ใหม่.
  columns: 3
  isBeforeContent: true
  items:
    - title: Inflatable SUP boards
      description: All-around and touring SUPs from 10' to 12 ft. Stable, rigid, and complete with pump, paddle, and leash.
      icon: tabler:swimming
    - title: Art series decks
      description: งานศิลปะบนดาดฟ้า EVA ที่เป็นเอกลักษณ์ — เสือชีตาห์, Tropical Breeze, Medusa Glow และอื่นๆอีกมากมาย
      icon: tabler:hexagons
    - title: Complete packages
      description: 'Every board ships as a full kit: board, backpack, pump, paddle, fin, leash, and repair kit.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: อุปกรณ์เสริม
      description: Pumps, paddles, leashes, repair kits, and dry-bags. All matched to our boards.
      icon: tabler:tool
    - title: Care & repair
      description: In-house repair support, spare parts, and maintenance guidance to keep your board on the water for years.
      icon: tabler:settings
    - title: Club & rental fleets
      description: Bulk outfitting for clubs, schools, and rental fleets with direct factory support.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Board design and engineering discussion
steps2_values:
  title: ค่านิยมของเรา
  subtitle: สามหลักการที่ได้หล่อหลอมทุกผลิตภัณฑ์ตั้งแต่วันแรก
  items:
    - title: สร้างเหมือนกับว่ามันแบกครอบครัวของคุณ
      description: Every board, seam, and valve is treated as if our own families will use it.
      icon: tabler:heart
    - title: วิศวกรก่อนขาย
      description: ถ้าสเปคผิดพลาด เราจะเปลี่ยนสเปคนั้น — ไม่เคยเปลี่ยนลูกค้า
      icon: tabler:settings
    - title: การสนับสนุนที่ยาวนานเกินระยะเวลารับประกัน
      description: Boards we built years ago still call us for spare parts, and we still pick up.
      icon: tabler:headset
steps2_milestones:
  title: เหตุการณ์สําคัญ
  subtitle: เวอร์ชันสั้นของเรื่อง Paddle Board Overstock
  isReversed: true
  items:
    - title: Founded in Weihai
      description: A coastal workshop dedicated to drop-stitch inflatable SUP boards.
      icon: tabler:building-factory
    - title: 12,000 m² production campus
      description: ขยายไปยังสถานที่เฉพาะที่มีกำลังการผลิตการเชื่อม RF และ Drop-stitch
      icon: tabler:circle-check
    - title: โครงการส่งออกระหว่างประเทศ
      description: Now shipping to 50+ countries with express and sea freight options.
      icon: tabler:world
    - title: Overstock & wholesale focus
      description: ในเดือนกันยายน 2026 การดำเนินงานของแบรนด์ได้ย้ายจาก Qingdao Vatrad Group ไปยัง Weihai Dongjilian Co., Ltd. ศูนย์กลางการผลิตของ Weihai ยังคงดำเนินการวิจัยและพัฒนาการผลิตและการจัดส่งโดยตรงจากโรงงาน
      icon: tabler:building-skyscraper
features2_locations:
  title: สถานที่ตั้งของเรา
  tagline: ค้นหาเรา
  columns: 3
  items:
    - title: สํานักงานใหญ่และเวิร์กช็อป
      description: สวนอุตสาหกรรมชายฝั่ง อาคาร 4 — เปิดวันจันทร์–ศุกร์ ให้เข้าชมโดยนัดหมายล่วงหน้า
    - title: ศูนย์บริการของสหภาพยุโรป
      description: ท่าเรือเมดิเตอร์เรเนียน — การปรับปรุง ซ่อมแซม และสนับสนุนการรับประกันสําหรับลูกค้าชาวยุโรป
    - title: เครือข่ายพันธมิตร APAC
      description: พันธมิตรบริการที่ได้รับอนุญาตในออสเตรเลีย ญี่ปุ่น สิงคโปร์ และฮ่องกง
