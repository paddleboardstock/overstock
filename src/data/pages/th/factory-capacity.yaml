hero:
  tagline: กำลังการผลิต
  title: กำลังการผลิตและผลผลิตประจำปี
  subtitle: โรงงานขนาด 12,000 ตารางเมตร ผลิตบอร์ด 15,000 แผ่นต่อปี พร้อมพื้นที่สําหรับขยาย
intro: Paddle Board Overstock ดําเนินการโรงงานผลิตบอร์ดเป่าลมขนาดใหญ่ที่สุดแห่งหนึ่งในเมือง SUP เว่ยไห่ ประเทศจีนโรงงานขนาด 12,000 ตารางเมตรของเราถูกจัดเป็นเวิร์กช็อปเฉพาะทาง 6 แห่งที่ดําเนินงานควบคู่กัน ทําให้เราสามารถผลิตบอร์ดได้ 15,000 ชิ้นต่อปีในสายการผลิตออลอะราวด์ ทัวร์ริ่ง และซีรีส์ศิลปะ SUP
highlights:
  - value: 12,000 m²
    label: พื้นที่ชั้นการผลิตทั้งหมด
    detail: ทั่ว 6 เวิร์กช็อปเฉพาะทาง
  - value: 15,000
    label: บอร์ดที่ผลิตขึ้นทุกปี
    detail: ครบวงจร ทัวร์ และซีรีส์SUPs ศิลปะ
  - value: 200-300
    label: แรงงานที่มีทักษะ
    detail: วิศวกร 25 คน, 2 กะ/วัน
  - value: 50+
    label: ประเทศที่ส่งออก
    detail: สหภาพยุโรป, สหรัฐอเมริกา, ออสเตรเลีย, ตะวันออกกลาง, เอเชีย
  - value: 2-3
    label: วันทําการก่อนจัดส่ง
    detail: คําสั่งซื้อที่มีสต็อกออกจากเว่ยไห่อย่างรวดเร็ว
  - value: 10+
    label: ประสบการณ์การส่งออกหลายปี
    detail: ตั้งแต่ปี 2012
workshops:
  - title: SUP การผลิตบอร์ด
    description: 'สายการประกอบแบบขนาน 4 สายสำหรับบอร์ด SUP แบบพองได้ แต่ละสายสามารถผลิตบอร์ดได้ 50–80 แผ่นต่อกะ สถานีพิมพ์ดิจิทัลและสกรีนพริ้นท์ทำงานพร้อมกัน ความจุประจำปีของ SUP: 8,000+ แผ่น'
    output: 8,000+ SUPs/ปี
  - title: ศิลปะบนสำรับ & การตกแต่ง EVA
    description: เวิร์กช็อปตกแต่งเฉพาะสําหรับดาดฟ้าซีรีส์ศิลปะการตัดอย่างแม่นยํา EVA ลวดลายดาดฟ้าที่วางด้วยมือ และการตกแต่งขั้นสุดท้ายกําลังการผลิตประจําปีครอบคลุมชุดผลิตภัณฑ์ศิลปะทั้งหมด
    output: ชุดงานศิลปะครบชุด
  - title: Drop-Stitch การเคลือบ
    description: 'สายการเคลือบด้วยความร้อนจะยึดdrop-stitchแกนเข้ากับ PVC แผ่นลามิเนตด้านนอกแถบรางเป็นแบบฟิวชันสามชั้นเพื่อความแข็งแรงที่แน่นหนากําลังการผลิตต่อปี: 15,000+ แกน'
    output: 15,000+ คอร์/ปี
  - title: อุปกรณ์เสริมและบรรจุภัณฑ์
    description: สายการประกอบและบรรจุอุปกรณ์เสริมสําหรับปั๊ม ไม้พาย สายจูง และชุดซ่อมแซมแผ่นไม้ถูกบรรจุด้วยสุญญากาศ บรรจุกล่อง และจัดเรียงบนพาเลทสําหรับการจัดส่งทั่วโลก
    output: พัสดุครบชุด พร้อมจัดส่ง
