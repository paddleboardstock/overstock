hero:
  tagline: กำลังการผลิต
  title: กำลังการผลิตและผลผลิตประจำปี
  subtitle: โรงงานขนาด 12,000 ตารางเมตร ผลิตเรือ 15,000 ลำต่อปี และมีพื้นที่สำหรับขยาย
intro: Paddle Board Overstock ดำเนินการโรงงานผลิตเรือยางแบบเป่าลมที่ใหญ่ที่สุดแห่งหนึ่งในชิงเต่า ประเทศจีน โรงงานของเรามีพื้นที่ 12,000 ตารางเมตร จัดแบ่งเป็นเวิร์กช็อปเฉพาะทางหกแห่งที่ทำงานพร้อมกัน ทำให้เรามีความสามารถในการผลิตเรือ 15,000 ลำต่อปี ครอบคลุมสายการผลิต SUP คายัค ดิงกี้ RIB และอุปกรณ์ความปลอดภัย
highlights:
  - value: 12,000 m²
    label: พื้นที่ชั้นการผลิตทั้งหมด
    detail: ทั่ว 6 เวิร์กช็อปเฉพาะทาง
  - value: 15,000
    label: จำนวนเรือที่ผลิตต่อปี
    detail: SUPs, เรือคายัค, RIBs, เรือเล็ก, อุปกรณ์ความปลอดภัย
  - value: 200-300
    label: แรงงานที่มีทักษะ
    detail: วิศวกร 25 คน, 2 กะ/วัน
  - value: 50+
    label: ประเทศที่ส่งออก
    detail: สหภาพยุโรป, สหรัฐอเมริกา, ออสเตรเลีย, ตะวันออกกลาง, เอเชีย
  - value: 30–45
    label: ระยะเวลาการจัดส่งมาตรฐาน (วัน)
    detail: จากการยืนยัน PO ถึง FOB
  - value: 10+
    label: ประสบการณ์การส่งออกหลายปี
    detail: ตั้งแต่ปี 2012
workshops:
  - title: SUP การผลิตบอร์ด
    description: 'สายการประกอบแบบขนาน 4 สายสำหรับบอร์ด SUP แบบพองได้ แต่ละสายสามารถผลิตบอร์ดได้ 50–80 แผ่นต่อกะ สถานีพิมพ์ดิจิทัลและสกรีนพริ้นท์ทำงานพร้อมกัน ความจุประจำปีของ SUP: 8,000+ แผ่น'
    output: 8,000+ SUPs/ปี
  - title: RIB การผลิตเรือ
    description: 'เวิร์กช็อปไฟเบอร์กลาสที่อุทิศให้กับตัวเรือพร้อมสถานีแม่พิมพ์ 6 แห่งสำหรับตัวเรือ RIB ขนาดสูงสุด 7.6 ม. พื้นที่เชื่อมท่อและประกอบจัดการ RIBs ได้พร้อมกัน 3–5 ชิ้น กำลังการผลิตประจำปี RIB: 2,000+ เรือ'
    output: 2,000+ RIBs/ปี
  - title: เรือยางและเรือเล็ก
    description: 'สายการผลิตอเนกประสงค์สำหรับเรือผ่อนลมหรือเรือพอง เช่น คายัค และเรือเล็ก สถานีเชื่อมด้วยอากาศร้อน เครื่องกดไฟฟ้า RF และสถานีประกอบจะปรับโครงสร้างตามสัดส่วนคำสั่งซื้อ กำลังการผลิตต่อปี: 5,000 หน่วย'
    output: 5,000+ หน่วย/ปี
  - title: อุปกรณ์ความปลอดภัย
    description: 'พื้นที่การผลิตห้องสะอาดแยกต่างหากสำหรับเสื้อชูชีพและอุปกรณ์ความปลอดภัย มีสถานีเย็บ แทรกโฟม และทดสอบเฉพาะ ประสิทธิภาพการผลิตเสื้อชูชีพต่อปี: 50,000 หน่วย'
    output: เสื้อชูชีพ 50,000 ตัว/ปี
oem_capacity:
  moq: 'SUP: 5–10 หน่วย | RIB: 2–5 หน่วย | คายัค/เรือลำเล็ก: 10–20 หน่วย | แม่พิมพ์ที่กำหนดเอง: 200+ หน่วย'
  lead_time: มาตรฐาน 30–45 วัน ตัวอย่าง 15–20 วัน บริการด่วนมีให้
  payment: T/T เงินมัดจำ 30% + จ่าย 70% ก่อนส่งสินค้า ยอมรับ L/C, Western Union
