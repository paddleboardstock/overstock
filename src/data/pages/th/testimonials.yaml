testimonials:
  - category: clubs
    name: ริคาร์โด ซานโตส
    title: เจ้าของ, Algarve Surf Academy
    location: ลากอส, โปรตุเกส
    content: เราเริ่มต้นด้วย Club Starter Package สำหรับโรงเรียนเซิร์ฟของเรา บอร์ด 20 แผ่น พลั่ว เสื้อชูชีพ — ทุกอย่างมาถึงภายใน 3 สัปดาห์ หลังจากสองฤดูกาล เราอัปเกรดไปที่ Pro Package การปรับแบรนด์ให้ตรงกับโลโก้ของเราเปลี่ยนภาพลักษณ์มืออาชีพของเราอย่างสิ้นเชิง
    rating: 5
    product: ชุดเริ่มต้นสำหรับชมรม
    source: solutions/clubs
  - category: clubs
    name: เจ้าของคลับ
    title: ชมรมกีฬาทางน้ำ
    location: ภูเก็ต, ไทย
    content: แพ็คเกจเริ่มต้นของคลับเป็นจุดเริ่มต้นที่สมบูรณ์แบบ ขณะที่ธุรกิจของเราเติบโตขึ้น Paddle Board Overstock ก็เติบโตไปกับเรา — คุณภาพเหมือนเดิม ราคาเหมือนเดิม ไม่มีเรื่องไม่คาดฝัน เราขยายจาก 10 เป็น 80 กระดานใน 18 เดือน
    rating: 5
    product: Club Starter + แพ็คเกจพรีเมียม
    source: success-stories
  - category: resorts
    name: ผู้จัดการทั่วไปของรีสอร์ท
    title: รีสอร์ตชายหาด 5 ดาว
    location: กรีซ
    content: Paddle Board Overstock ไม่ได้ส่งมอบแค่กระดาน — แต่ช่วยเราสร้างประสบการณ์ลูกค้าเต็มรูปแบบ โปรแกรมกีฬาทางน้ำของเรากลายเป็นไฮไลท์ของรีสอร์ทเพียงในหนึ่งฤดูกาล มีการจอง 300+ ครั้งต่อสัปดาห์และรายได้ประจำปี 180,000 ดอลลาร์
    rating: 5
    product: แพ็กเกจพรีเมียมรีสอร์ท
    source: success-stories
  - category: resorts
    name: โซฟี โลรองต์
    title: ผู้อำนวยการฝ่ายประสบการณ์แขก, รีสอร์ต Azure Bay
    location: ภูเก็ต, ไทย
    content: Paddle Board Overstock ออกแบบและจัดอุปกรณ์โปรแกรมกิจกรรมชายหาดทั้งหมดของเราครอบคลุมรีสอร์ทสามแห่ง 120 SUPs โครงสร้างความปลอดภัย และการฝึกอบรมพนักงาน — ทั้งหมดจัดส่งในครั้งเดียว การเข้าร่วมของแขกเพิ่มขึ้น 60% ในฤดูกาลแรก
    rating: 5
    product: แพ็กเกจพรีเมียมรีสอร์ท
    source: solutions/resorts
  - category: rental
    name: แดเนียล โอโกนคโว
    title: เจ้าของ, Lakeland SUP Rentals
    location: ออนแทรีโอ, แคนาดา
    content: ฉันเคยเช่า 5 กระดานจากร้านท้องถิ่นและเสียรายได้ 60% ให้กับพวกเขา Paddle Board Overstock ช่วยฉันสร้างกลุ่มของฉันเองจำนวน 15 SUPs เครื่องคิดเลข ROI แสดงจุดคุ้มทุนใน 4 เดือน — ใช้เวลาแค่ 3 เดือน ตอนนี้ฉันกำลังขยายเป็น 30 กระดาน
    rating: 5
    product: ชุดเริ่มต้นสำหรับยานพาหนะ
    source: solutions/rental-business
  - category: rental
    name: มาร์โก วาเลนติ
    title: ผู้อำนวยการฝ่ายปฏิบัติการ, Adriatic Adventure Tours
    location: ดูบรอฟนิก, โครเอเชีย
    content: เราจัดเตรียมยานพาหนะเช่า SUP ทั้งหมดของเราด้วยกระดาน Paddle Board Overstock — 30 กระดานในสามสถานที่ สองฤดูกาลผ่านไป ไม่มีข้อบกพร่อง คุณภาพสม่ำเสมอในแต่ละชุดทำให้การตัดสินใจของเราง่ายขึ้น และทีมงานของพวกเขายังจับคู่สีให้เข้ากับแบรนด์ของเราอีกด้วย
    rating: 5
    product: แพ็กเกจยานพาหนะเช่า
    source: trust
  - category: rental
    name: เอลีนา มาร์เค็ตที
    title: เจ้าของ, Lake Garda SUP Rentals
    location: ทะเลสาบการ์ดา, อิตาลี
    content: กระดานเช่าของเราออกไปวันละห้าครั้งในฤดูกาลพีค หลังจากเปลี่ยนมาใช้ Paddle Board Overstock ข้อร้องเรียนเกี่ยวกับความเสียหายลดลงเกือบเป็นศูนย์ และลูกค้าก็ยังถามอยู่เรื่อย ๆ ว่าพวกเขาสามารถซื้อกระดานของตัวเองได้ที่ไหน
    rating: 5
    product: แพ็กเกจยานพาหนะเช่า
    source: solutions/rental-business
  - category: consumers
    name: ซาร่าห์ เค.
    title: เจ้าของ SUP ครั้งแรก
    location: ทะเลสาบทาโฮ, สหรัฐอเมริกา
    content: มั่นคงแม้สำหรับผู้เริ่มต้นแบบเต็มตัว เอาไปพายบนทะเลสาบในวันแรกและไม่ล้มเลย ชุดครบพร้อมปั้มและไม้พาย ทำให้ฉันอยู่บนผิวน้ำได้ภายใน 20 นาทีหลังเปิดกล่อง
    rating: 5
    product: Explorer 11
  - category: consumers
    name: เจมส์ ธอร์นตัน
    title: SUP เจ้าของ Explorer 11
    location: แวนคูเวอร์, แคนาดา
    content: ในฐานะผู้ซื้อครั้งแรก ฉันกังวลเกี่ยวกับการสั่งซื้อจากต่างประเทศ คุณภาพการผลิตได้บอกตัวเองตั้งแต่วินาทีที่ฉันแกะกล่อง — แข็งแรง รอยต่อไร้ที่ติ และมาถึงเพียง 6 วัน
    rating: 5
    product: Explorer 11
    source: trust
  - category: consumers
    name: ไมค์ อาร์.
    title: นักพายเรือสุดสัปดาห์
    location: ฟลอริดา, สหรัฐอเมริกา
    content: คุณภาพการสร้างแข็งแรง ทนต่อคลื่นชายฝั่งได้ดีกว่าที่คาดไว้จากเรือเป่าลม แพ็คใส่ท้ายรถสำหรับทริปสุดสัปดาห์ — เป่าลมที่ท่าเรือภายในเวลาไม่ถึง 4 นาที
    rating: 5
    product: SUP ลมเขตร้อน
