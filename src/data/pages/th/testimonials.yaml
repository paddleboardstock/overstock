testimonials:
  - category: clubs
    name: ริคาร์โด ซานโตส
    title: เจ้าของ, Algarve Surf Academy
    location: ลากอส, โปรตุเกส
    content: เราเริ่มต้นด้วย Club Starter Package สำหรับโรงเรียนเซิร์ฟของเรา บอร์ด 20 แผ่น พลั่ว เสื้อชูชีพ — ทุกอย่างมาถึงภายใน 3 สัปดาห์ หลังจากสองฤดูกาล เราอัปเกรดไปที่ Pro Package การปรับแบรนด์ให้ตรงกับโลโก้ของเราเปลี่ยนภาพลักษณ์มืออาชีพของเราอย่างสิ้นเชิง
    rating: 5
    product: ชุดเริ่มต้นสำหรับชมรม
    source: solutions/clubs
  - category: clubs
    name: เจ้าของคลับ
    title: ชมรมกีฬาทางน้ำ
    location: ภูเก็ต, ไทย
    content: Club Starter Package เป็นจุดเริ่มต้นที่สมบูรณ์แบบ เมื่อธุรกิจของเราเติบโตขึ้น Aquafarer ก็เติบโตไปพร้อมกับเรา — คุณภาพเหมือนเดิม ราคาเหมือนเดิม ไม่มีสิ่งแปลกใจ เราขยายจาก 10 บอร์ดเป็น 80 บอร์ดภายใน 18 เดือน
    rating: 5
    product: Club Starter + Premium Package
    source: success-stories
  - category: resorts
    name: ผู้จัดการทั่วไปของรีสอร์ท
    title: รีสอร์ตชายหาด 5 ดาว
    location: กรีซ
    content: Aquafarer ไม่ได้เพียงส่งมอบบอร์ด — พวกเขาช่วยเราสร้างประสบการณ์ของแขกอย่างสมบูรณ์ โปรแกรมกีฬาทางน้ำของเราเติบโตจากศูนย์จนกลายเป็นไฮไลท์ของรีสอร์ตภายในหนึ่งฤดูกาล 300+ การจองต่อสัปดาห์และรายได้ต่อปี 180,000 ดอลลาร์
    rating: 5
    product: แพ็กเกจพรีเมียมรีสอร์ท
    source: success-stories
  - category: resorts
    name: โซฟี โลรองต์
    title: ผู้อำนวยการฝ่ายประสบการณ์แขก, รีสอร์ต Azure Bay
    location: ภูเก็ต, ไทย
    content: Aquafarer ออกแบบและจัดอุปกรณ์โปรแกรมกิจกรรมชายหาดของเราทั้งหมดในสามรีสอร์ต มี 80 SUPs, 40 คายัค โครงสร้างความปลอดภัย และการฝึกอบรมพนักงาน — ทั้งหมดจัดส่งในครั้งเดียว การเข้าร่วมของแขกเพิ่มขึ้น 60% ในฤดูกาลแรก
    rating: 5
    product: แพ็กเกจพรีเมียมรีสอร์ท
    source: solutions/resorts
  - category: entrepreneurs
    name: ไมเคิล พาร์ค
    title: ผู้ก่อตั้ง, Shoreline Paddle Co.
    location: แคลิฟอร์เนีย, สหรัฐอเมริกา
    content: ฉันเปิดตัวแบรนด์ SUP ของฉันโดยไม่มีประสบการณ์ในอุตสาหกรรม ทีม Aquafarer ช่วยชี้แนะฉันตั้งแต่การเลือกผลิตภัณฑ์จนถึงการออกแบบโลโก้และบรรจุภัณฑ์ที่กำหนดเอง คอนเทนเนอร์แรกของฉันมาถึงใน 11 สัปดาห์ และฉันขายหมดใน 3 เดือนบน Amazon
    rating: 5
    product: การเปิดตัวแบรนด์เริ่มต้น
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: ผู้ก่อตั้ง
    title: แบรนด์ SUP ของออสเตรเลีย
    location: ออสเตรเลีย
    content: ฉันมีไอเดียเกี่ยวกับแบรนด์แต่ไม่มีความรู้ด้านการผลิต Aquafarer คอยช่วยฉันทุกขั้นตอน — ตั้งแต่การเลือกการออกแบบบอร์ดที่เหมาะสมจนถึงการเปิดกล่องสินค้าครั้งแรก 90 วันจากความฝันสู่การส่งมอบ
    rating: 5
    product: แพ็กเกจเปิดตัวแบรนด์
    source: success-stories
  - category: rental
    name: แดเนียล โอโกนคโว
    title: เจ้าของ, Lakeland SUP Rentals
    location: ออนแทรีโอ, แคนาดา
    content: ฉันเคยเช่า 5 บอร์ดจากร้านในท้องถิ่นและเสียรายได้ 60% ให้กับร้านนั้น Aquafarer ช่วยฉันสร้างกองเรือของตัวเองจำนวน 15 SUPs เครื่องคำนวณ ROI แสดงให้เห็นว่าคืนทุนใน 4 เดือน — ใช้เวลาเพียง 3 เดือน ตอนนี้ฉันกำลังขยายไปที่ 30 บอร์ด
    rating: 5
    product: ชุดเริ่มต้นสำหรับยานพาหนะ
    source: solutions/rental-business
  - category: rental
    name: มาร์โก วาเลนติ
    title: ผู้อำนวยการฝ่ายปฏิบัติการ, Adriatic Adventure Tours
    location: ดูบรอฟนิก, โครเอเชีย
    content: เราติดตั้งอุปกรณ์ Aquafarer RIBs ให้กับกองเรือเช่าของเราทั้งหมด — 12 เรือในสามสถานที่ สองฤดูกาลที่ผ่านมา ไม่มีการล้มเหลวเอกสารการรับรอง CE ทำให้การอนุมัติประกันเป็นไปอย่างราบรื่น ทีมวิศวกรของพวกเขายังปรับสีของท่อได้ตามต้องการ
    rating: 5
    product: ชุดขยายกองยาน
    source: trust
  - category: rental
    name: ร้อยตรี อันเดรส เรเยส
    title: เจ้าหน้าที่จัดหาอุปกรณ์ทางทะเล, กองกำลังพิทักษ์ชายฝั่งฟิลิปปินส์
    location: มะนิลา, ฟิลิปปินส์
    content: เราดำเนินงาน Aquafarer RIBs เป็นจำนวน 24 ลำในกองเรือตรวจการณ์ชายฝั่ง กระบวนการ QC ของพวกเขาเป็นมาตรฐานในทุกชุด — ความแข็งแรงของตะเข็บเหมือนกัน การวางวาล์วเหมือนกัน ความดันเท่ากันทุกครั้ง ความสามารถในการทำซ้ำนี้มีความสำคัญเมื่อชีวิตขึ้นอยู่กับอุปกรณ์
    rating: 5
    product: กองเรือตรวจการณ์ RIB
    source: trust
  - category: consumers
    name: ซาร่าห์ เค.
    title: เจ้าของ SUP ครั้งแรก
    location: ทะเลสาบทาโฮ, สหรัฐอเมริกา
    content: มั่นคงแม้สำหรับผู้เริ่มต้นแบบเต็มตัว เอาไปพายบนทะเลสาบในวันแรกและไม่ล้มเลย ชุดครบพร้อมปั้มและไม้พาย ทำให้ฉันอยู่บนผิวน้ำได้ภายใน 20 นาทีหลังเปิดกล่อง
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: เจมส์ ธอร์นตัน
    title: SUP เจ้าของ Explorer 11
    location: แวนคูเวอร์, แคนาดา
    content: ในฐานะผู้ซื้อครั้งแรก ฉันกังวลเกี่ยวกับคุณภาพเมื่อต้องสั่งจากต่างประเทศ เอกสาร ISO และรายงานการทดสอบจากบุคคลที่สามที่พวกเขาแชร์ให้ฉันก่อนที่ฉันจะขอ ทำให้ฉันมั่นใจเต็มที่ เรือมาถึงภายใน 6 วันและเกินความคาดหมายของฉัน
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: ไมค์ อาร์.
    title: นักพายเรือเพื่อสันทนาการ
    location: ฟลอริดา, สหรัฐอเมริกา
    content: คุณภาพการสร้างแข็งแรง ทนต่อคลื่นชายฝั่งได้ดีกว่าที่คาดไว้จากเรือเป่าลม แพ็คใส่ท้ายรถสำหรับทริปสุดสัปดาห์ — เป่าลมที่ท่าเรือภายในเวลาไม่ถึง 4 นาที
    rating: 5
    product: เรือคายัคเป่าลม
