      - item: ระบบชั้นวางเก็บสินค้าเชิงพาณิชย์
      - item: สถานีเติมน้ําพร้อมปั๊มอุตสาหกรรม
      - item: ระบบความปลอดภัย (ทุ่นลอย, ป้าย, กระดานกู้ภัย)
      - item: โครงการฝึกอบรมบุคลากร
      - item: คู่มือการจัดการรายได้
