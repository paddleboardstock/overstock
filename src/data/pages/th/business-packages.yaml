    subtitle: โปรแกรมกิจกรรมทางน้ําสําหรับแขกครบวงจรสําหรับโรงแรมและรีสอร์ท
    target: รีสอร์ทชายหาด โรงแรมริมทะเลสาบ รีสอร์ทเชิงนิเวศ สโมสรเรือยอชต์
