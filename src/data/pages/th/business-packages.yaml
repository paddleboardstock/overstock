    cta_href: /contact
faq:
  title: คำถามที่พบบ่อยเกี่ยวกับแพ็กเกจ
  questions:
    - q: จำนวนสั่งซื้อต่ำสุดสำหรับแพ็กเกจคือเท่าใด?
      a: แพ็กเกจเริ่มต้น Club ต้องสั่งขั้นต่ำ 10 หน่วย แพ็กเกจรีสอร์ทและแบรนด์จะปรับแต่งตามความต้องการของคุณด้วย MOQs ที่ยืดหยุ่น
    - q: การจัดส่งใช้เวลานานเท่าใด?
      a: การผลิตมาตรฐานใช้เวลา 30–45 วันนับจากยืนยันคำสั่งซื้อ สามารถผลิตด่วนได้โดยมีค่าธรรมเนียมเพิ่มเติม
    - q: ฉันสามารถปรับแต่งสีอุปกรณ์และแบรนด์ได้หรือไม่?
      a: ได้ ทุกแพ็กเกจรวมการปรับแต่งเต็มรูปแบบ — สีบอร์ด, การพิมพ์โลโก้ และการออกแบบบรรจุภัณฑ์
    - q: คุณมีบริการหลังการขายหรือไม่?
      a: มี ทุกแพ็กเกจรวมการเข้าถึงคู่มือการบำรุงรักษาออนไลน์, วิดีโอสอน และระบบสั่งซื้ออะไหล่
