  - id: brand-launch
    tag: Entrepreneur
    name: แพ็กเกจเปิดตัวแบรนด์
    subtitle: เปลี่ยนไอเดียแบรนด์ของคุณให้เป็นผลิตภัณฑ์ที่จัดส่งได้ — โดยปกติภายใน 60–90 วัน
    target: ผู้ขาย Amazon, ผู้มีอิทธิพล, ผู้จัดจำหน่ายในภูมิภาค
