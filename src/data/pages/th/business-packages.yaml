    line_items:
      - item: คำปรึกษาเกี่ยวกับการเลือกสินค้า
      - item: ออกแบบโลโก้เฉพาะบนบอร์ด
      - item: การจับคู่สีแบบกำหนดเอง
      - item: บรรจุภัณฑ์ขายปลีกที่มีแบรนด์
      - item: ป้ายห้อยและคู่มือการใช้งาน
      - item: เอกสารการรับรอง CE
      - item: ตัวอย่างการผลิต
      - item: การจัดส่งจากชิงเต่า FOB
