hero:
  tagline: ความเชี่ยวชาญทางทะเล
  title: วิศวกรรมทางทะเลยาวนานหลายทศวรรษ<br />ในทุกกระดาน
  subtitle: Paddle Board Overstock ผสมผสานวิทยาศาสตร์วัสดุขั้นลึก การผลิตที่แม่นยำ และการทดสอบในโลกจริง เพื่อผลิตกระดานที่ทำงานได้เมื่อมีความสำคัญ
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock ทีมวิศวกรรมทางทะเลและงานวิจัยและพัฒนา (R&D) กำลังทำงาน
expertise_materials:
  tagline: วิทยาศาสตร์วัสดุ
  title: การเลือกวัสดุที่เหมาะสม<br />สำหรับการใช้งานแต่ละประเภท
  subtitle: เราทำงานกับวัสดุหลักสามชนิด — แต่ละชนิดถูกเลือกสำหรับกรณีการใช้งานและข้อกำหนดด้านประสิทธิภาพเฉพาะ
  columns: 3
  items:
    - title: PVC เกรดทางทะเล
      description: ผ้า 1100 เดนิเยร์ PVC — วัสดุที่ใช้งานได้หลากหลายที่สุดของเรา UV ทนทานต่อการเสียดสีและผ่านการทดสอบตามเวลา เหมาะสำหรับกระดาน SUP ที่น้ำหนัก ความแข็ง และความคุ้มค่าเป็นสิ่งสำคัญ
      icon: tabler:droplet
    - title: แกน Drop-Stitch
      description: เส้นใยโพลีเอสเตอร์นับพันเชื่อมชั้นผ้าด้านบนและด้านล่าง ทำให้สามารถพองด้วยแรงดันสูง (15 PSI) เพื่อให้ได้การขี่ที่แข็งแรงและมั่นคง แต่ยังสามารถม้วนเก็บลงในกระเป๋าเป้ได้
      icon: tabler:building-arch
    - title: EVA ฟองน้ำด้านบนของกระดาน
      description: ฟองน้ำ EVA ความหนาแน่นสูงลายนูนให้การยึดเกาะเต็มความยาว รองรับแรงกระแทกจากการล้ม และเป็นพื้นฐานสำหรับกระดานซีรีส์ศิลปะที่เป็นเอกลักษณ์ของเรา
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: ความสามารถในการผลิต
  title: การผลิตที่แม่นยำ<br />ในทุกขั้นตอน
  subtitle: โรงงานขนาด 12,000 ตารางเมตรของเรามีเครื่องจักรพิเศษสำหรับทุกขั้นตอนของการผลิต
  columns: 2
  items:
    - title: CNC การตัด
      description: การตัดด้วยคอมพิวเตอร์ช่วยให้ได้แผงผ้าที่แม่นยำ ทำซ้ำได้ และลดของเสียให้เหลือน้อยที่สุด ชิ้นส่วนทุกชิ้นพอดีกับการออกแบบอย่างแม่นยำ
      icon: tabler:cpu
    - title: การเชื่อมความถี่สูง
      description: การเชื่อม HF อุตสาหกรรมสร้างรอยต่อที่แข็งแรงกว่าวัสดุพื้นฐาน การควบคุมอุณหภูมิและความดันอย่างสม่ำเสมอทำให้แน่ใจว่าการปิดผนึกกันอากาศทั่วทุกการผลิต
      icon: tabler:bolt
    - title: การประกอบแกน Drop Stitch
      description: เส้นใยโพลีเอสเตอร์นับพันเชื่อมชั้นผ้าบนและล่าง ทำให้สามารถพองความดันสูง (15-20 PSI) สำหรับกระดานและพื้น SUP ที่แข็งและมั่นคง
      icon: tabler:building-arch
    - title: การทดสอบแรงดัน
      description: ทุกกระดานผ่านการทดสอบแรงดันก่อนจัดส่ง โดยจะคงแรงดันที่ 1.25 เท่าของแรงดันที่ระบุ — หากมันสามารถคงแรงดันนี้ได้ มันก็จะทำงานได้ในน้ำ
      icon: tabler:wind
    - title: การทดสอบความแข็งแรงรอยต่อ
      description: ตัวอย่างสุ่มจากแต่ละชุดการผลิตถูกทดสอบความแข็งแรงรอยต่อแบบทำลาย ผลลัพธ์ถูกบันทึกและสามารถติดตามไปยังชุดการผลิตเฉพาะ
      icon: tabler:files
    - title: การทดสอบในน้ำ
      description: การออกแบบบอร์ดทุกแบบผ่านการทดสอบในน้ําจริงการพายเรือจริงในสภาพชายฝั่งช่วยยืนยันประสิทธิภาพ การควบคุม และความมั่นคง
      icon: tabler:ripple
expertise_design:
  tagline: การออกแบบและวิศวกรรม
  title: ออกแบบมาสำหรับสภาพจริง
  subtitle: ปรัชญาการออกแบบของเราเริ่มต้นจากวิธีการใช้งานบอร์ด — จากนั้นจึงสร้างวิศวกรรมรอบกรณีการใช้งานนั้น
  items:
    - title: รูปทรงและเส้นขอบของกระดาน
      description: ความยาว ความกว้าง และร็อกเกอร์ถูกปรับแต่งให้เหมาะกับการใช้งานของแต่ละรุ่น — เส้นขอบทัวร์ที่ยาวขึ้นเพื่อการลื่นไถล ส่วนรูปทรงกว้างขึ้นเพื่อความมั่นคงและโยคะ
    - title: การเสริมเหล็กรางและสตริงเกอร์
      description: รางเสริมความแข็งแรงและเส้นตรงกลางช่วยเพิ่มความแข็งแรงและดูดซับแรงกระแทก — ซึ่งเป็นจุดที่บอร์ดถูกใช้งานหนักที่สุดในแต่ละฤดูกาล
    - title: การจัดวางและแรงยึดเกาะของดาดฟ้า
      description: พื้นที่ยืน ตําแหน่งจับ ขาตั้ง D-ring และโซนการยึดเกาะถูกออกแบบให้เหมาะกับท่าทางพายจริง — ไม่ว่าจะเป็นการพายเรือ ตกปลา หรือฝึกโยคะ
    - title: ซีรีส์ศิลปะและสี
      description: งานศิลปะบนดาดฟ้า โทนสี และฐานอุปกรณ์เสริม — แต่ละซีรีส์ถูกออกแบบให้เข้ากับบุคลิกการพายที่โดดเด่น
cta:
  title: มีแอปพลิเคชันเฉพาะในใจหรือไม่?
  subtitle: ทีมงานของเราสามารถช่วยคุณเลือกบอร์ด ขนาด และอุปกรณ์ที่เหมาะกับสไตล์การพายของคุณ
