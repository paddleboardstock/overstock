  title: วิศวกรรมทางทะเลยาวนานหลายทศวรรษ<br />ในทุกตัวเรือ
  subtitle: Paddle Board Overstock ผสมผสานวิทยาศาสตร์วัสดุลึกซึ้ง การผลิตที่แม่นยำ และการทดสอบในโลกจริงเพื่อสร้างเรือที่ทำงานได้ในเวลาที่สำคัญ
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
