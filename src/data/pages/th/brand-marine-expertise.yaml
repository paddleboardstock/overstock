expertise_materials:
  tagline: วิทยาศาสตร์วัสดุ
  title: การเลือกวัสดุที่เหมาะสม<br />สำหรับการใช้งานแต่ละประเภท
  subtitle: เราทำงานกับวัสดุหลักสามชนิด — แต่ละชนิดถูกเลือกสำหรับกรณีการใช้งานและข้อกำหนดด้านประสิทธิภาพเฉพาะ
  columns: 3
  items:
    - title: วัสดุเกรดทางทะเล PVC
      description: ผ้า PVC ขนาด 1100 เดนียร์ — วัสดุที่หลากหลายที่สุดของเรา. UV-เสถียร, ทนต่อการเสียดสี, และเป็นไปตาม REACH. เหมาะสำหรับเรือสันทนาการ กระดาน SUP และเรือคายัค ที่น้ำหนักและความคุ้มค่ามีความสำคัญ
      icon: tabler:droplet
    - title: วัสดุพรีเมียม Hypalon/CSM
      description: มีความต้านทานสารเคมีสูงและเสถียรภาพ UV. เรือ Hypalon สามารถใช้งานได้ 15-20 ปี เมื่อดูแลอย่างเหมาะสม แนะนำสำหรับการใช้งานเชิงพาณิชย์ การกู้ภัย และการทหารที่ความทนทานระยะยาวมีความสำคัญ
      icon: tabler:shield
    - title: ไฟเบอร์กลาสและอะลูมิเนียม
      description: ตัวเรือไฟเบอร์กลาสแบบ Deep-V สำหรับ RIBs และเรือตรวจการณ์ — การทำงานตัดคลื่นในสภาพน้ำท้องฟ้าไม่สงบ ตัวเรืออะลูมิเนียมสำหรับเรือทำงานเชิงพาณิชย์ขนาดหนักที่ต้องการความแข็งแรงสูงสุดและความสามารถในการรับน้ำหนัก
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: ความสามารถในการผลิต
  title: การผลิตที่แม่นยำ<br />ในทุกขั้นตอน
  subtitle: โรงงานขนาด 12,000 ตารางเมตรของเรามีเครื่องจักรพิเศษสำหรับทุกขั้นตอนของการผลิต
  columns: 2
  items:
    - title: CNC การตัด
      description: การตัดด้วยคอมพิวเตอร์ช่วยให้ได้แผงผ้าที่แม่นยำ ทำซ้ำได้ และลดของเสียให้เหลือน้อยที่สุด ชิ้นส่วนทุกชิ้นพอดีกับการออกแบบอย่างแม่นยำ
      icon: tabler:cpu
    - title: การเชื่อมความถี่สูง
      description: การเชื่อม HF อุตสาหกรรมสร้างรอยต่อที่แข็งแรงกว่าวัสดุพื้นฐาน การควบคุมอุณหภูมิและความดันอย่างสม่ำเสมอทำให้แน่ใจว่าการปิดผนึกกันอากาศทั่วทุกการผลิต
      icon: tabler:bolt
    - title: การประกอบแกน Drop Stitch
      description: เส้นใยโพลีเอสเตอร์นับพันเชื่อมชั้นผ้าบนและล่าง ทำให้สามารถพองความดันสูง (15-20 PSI) สำหรับกระดานและพื้น SUP ที่แข็งและมั่นคง
      icon: tabler:building-arch
    - title: การทดสอบความดัน
      description: สินค้าที่พองได้ทุกชิ้นจะถูกทดสอบความดันก่อนจัดส่ง ท่อ RIB ถูกทดสอบที่ความดัน 1.25 เท่าของความดันที่กำหนด — ถ้ารักษาได้ จะทำงานได้ดีบนผิวน้ำ
      icon: tabler:wind
    - title: การทดสอบความแข็งแรงรอยต่อ
      description: ตัวอย่างสุ่มจากแต่ละชุดการผลิตถูกทดสอบความแข็งแรงรอยต่อแบบทำลาย ผลลัพธ์ถูกบันทึกและสามารถติดตามไปยังชุดการผลิตเฉพาะ
      icon: tabler:files
    - title: การทดสอบในน้ำ
      description: ทุกรุ่น RIB จะต้องผ่านการทดสอบทางทะเลก่อนรับรอง การทดสอบในสภาพชายฝั่งจริงช่วยยืนยันสมรรถนะ การควบคุม และความมั่นคง
      icon: tabler:ripple
expertise_design:
  tagline: การออกแบบและวิศวกรรม
  title: ออกแบบมาสำหรับสภาพจริง
  subtitle: ปรัชญาการออกแบบของเราเริ่มจากวิธีการใช้เรือ — จากนั้นจึงสร้างวิศวกรรมรอบการใช้งานนั้น
  items:
    - title: การออกแบบตัวเรือรูปตัววีลึก
      description: ลำตัวเรือไฟเบอร์กลาสของเรามีมุมเดดไรส์ที่คำนวณมาอย่างเหมาะสมสำหรับความยาวและการใช้งานของแต่ละรุ่น V ที่ชันขึ้นสำหรับการใช้งานในน้ำขรุขระ ส่วน V ที่ตื้นขึ้นเพื่อความมั่นคง
    - title: ความปลอดภัยหลายห้อง
      description: เรือทุกลำมีห้องลมอิสระ 3-7 ห้อง หากห้องใดห้องหนึ่งเสียหาย ห้องลมที่เหลือจะช่วยให้เรือยังลอยน้ำและสามารถใช้งานได้
    - title: การออกแบบตามหลักสรีรศาสตร์
      description: ตำแหน่งคอนโซล ความสูงของท่อ และการจัดวางที่นั่งถูกออกแบบเพื่อความสะดวกสบายของผู้ปฏิบัติงานในระหว่างการใช้งานเป็นเวลานาน — ไม่ว่าจะเป็นการลาดตระเวน การตกปลา หรือการขนส่ง
    - title: การกำหนดค่าที่กำหนดเอง
      description: สีของท่อ การกำหนดค่าคอนโซล ความจุเชื้อเพลิง การติดตั้งอุปกรณ์เสริม — แต่ละรุ่นสามารถปรับแต่งให้ตรงกับความต้องการในการปฏิบัติงานเฉพาะได้
