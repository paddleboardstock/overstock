content_system:
  tagline: ภาพรวมระบบ QC
  title: คุณภาพแบบบูรณาการ<br />กรอบการควบคุม
  subtitle: ระบบ QC ของเราทํางานอย่างอิสระจากฝ่ายผลิตและรายงานโดยตรงต่อฝ่ายบริหารไม่มีล็อตใดถูกจัดส่งโดยไม่มีใบรับรองคุณภาพที่ลงนามจากห้องปฏิบัติการคุณภาพ
  items:
    - title: ห้องปฏิบัติการคุณภาพอิสระ
      description: ห้องปฏิบัติการคุณภาพของเราทํางานแยกจากฝ่ายผลิตผู้ตรวจสอบ QC รายงานต่อผู้จัดการฝ่ายคุณภาพ ไม่ใช่ผู้อํานวยการฝ่ายผลิตความเป็นอิสระขององค์กรนี้ช่วยให้การตัดสินใจด้านคุณภาพเป็นไปอย่างเป็นกลาง — กําหนดเวลาการผลิตไม่เคยมีผลต่อข้อกําหนดด้านคุณภาพ
      features:
        - รายงานโดยตรงต่อฝ่ายบริหารโดยไม่ขึ้นกับฝ่ายผลิต
        - ได้รับอนุญาตให้หยุดการผลิตเนื่องจากปัญหาคุณภาพ
        - มีผู้ตรวจสอบคุณภาพเฉพาะทาง 12 คนในทุกขั้นตอน
        - อุปกรณ์ทดสอบทั้งหมดได้รับการสอบเทียบประจําปี
    - title: การติดตามย้อนกลับแบบแบทช์
      description: แต่ละชุดวัตถุดิบจะได้รับหมายเลขล็อตเฉพาะในERPระบบของเราตั้งแต่การมาถึงวัสดุ การผลิต ไปจนถึงผลิตภัณฑ์สําเร็จรูป ใบสั่งวัสดุของแต่ละลําจะเชื่อมโยงกลับไปยังชุดซัพพลายเออร์เดิมสิ่งนี้ช่วยให้สามารถติดตามย้อนกลับได้อย่างสมบูรณ์สําหรับการสอบถามคุณภาพหรือการปฏิบัติตามข้อกําหนด
      features:
        - ERP-ติดตามล็อตจากวัสดุจนถึงผลิตภัณฑ์สําเร็จรูป
        - แท็กแบตช์แบบกายภาพในแต่ละใบสั่งงาน
        - ครอบคลุมวัสดุ 100% — PVCHypalon, , ฮาร์ดแวร์, กาว
        - บันทึกที่เก็บไว้เป็นเวลา 10 ปี (CEข้อกําหนด 2013/53/EU)
    - title: มาตรฐานและการปฏิบัติตามข้อกําหนด
      description: ขั้นตอน QC ของเราสอดคล้องกับมาตรฐานสากลผลิตภัณฑ์ได้รับCEการรับรองภายใต้ข้อกําหนด EU Recreational Craft Directive 2013/53/EU ระบบบริหารคุณภาพของเราได้รับISOการรับรอง 9001 การปฏิบัติตามข้อกําหนดทางสังคมได้รับBSCIการรับรองผ่านการรับรอง
      features:
        - CE การรับรอง (EU 2013/53/EU)
        - ISO 9001:2015 การจัดการคุณภาพ
        - BSCI การรับรองความสอดคล้องทางสังคม
        - REACH และการRoHSปฏิบัติตามวัสดุ
        - UKCA การรับรองหลัง Brexit
content_inspection:
  tagline: ขั้นตอนการตรวจสอบ
  title: หกขั้นตอน<br />กระบวนการตรวจสอบ
  subtitle: สินค้าทุกชิ้นผ่านการตรวจสอบ 6 ขั้นตอนพร้อมจุดตรวจสอบคุณภาพที่มีการบันทึกไว้ข้อบกพร่องถูกตรวจพบตั้งแต่เนิ่น ๆ การดําเนินการแก้ไขเกิดขึ้นทันที และทุกล็อตสามารถตรวจสอบย้อนกลับได้อย่างสมบูรณ์
  stages:
    - stage: '1'
      title: การตรวจสอบวัสดุที่เข้ามา
      description: วัสดุที่เข้ามาทั้งหมดจะถูกบันทึกตามหมายเลขล็อต/ล็อตและกักกันจนกว่าจะได้รับการอนุมัติจาก QCPVC/Hypalon ม้วนผ้าจะได้รับการทดสอบความแข็งแรงต่อแรงดึง (ASTM D751), ความต้านทานการฉีกขาด (ISO4674) และความหนาDrop-stitchแกนกลาง วาล์ว กาว และฮาร์ดแวร์จะถูกตรวจสอบด้วยสายตาและวัดตามข้อกําหนด
      checks: ความต้านแรงดึง ASTM D751, ความต้านทานการฉีกขาด ISO 4674, เกจวัดความหนา, ความหนืดของกาว, การสแกนข้อบกพร่องด้วยสายตา
      threshold: ทดสอบชุดตัวอย่าง 100% ปฏิเสธหากความตึงน้อยกว่า 90% ของสเปค การฉีกขาดต่ำกว่าค่าต่ำสุดของสเปค หรือมีข้อบกพร่องทางสายตาใด ๆ
    - stage: '2'
      title: การควบคุมคุณภาพระหว่างกระบวนการ — การตัดและเตรียมงาน
      description: CNCแผงที่ตัดแล้วจะถูกตรวจสอบขนาดกับไฟล์ต้นทาง CAD ทุก ๆ 20 แผงคุณภาพของขอบจะถูกตรวจสอบเพื่อหาการขาด การตัดไม่สม่ําเสมอ หรือการเลื่อนของขนาดจํานวนแผงจะถูกตรวจสอบกับ BOM สําหรับแต่ละชุดการผลิตก่อนที่วัสดุจะถูกนําไปเชื่อม
      checks: ตรวจสอบขนาดเทียบกับไฟล์ CAD DXF, ตรวจสอบคุณภาพขอบ, ตรวจสอบจำนวนแผง
      threshold: ความคลาดเคลื่อน ±0.5 มม.ปฏิเสธล็อตสินค้าหากเกินความคลาดเคลื่อน >2%
    - stage: '3'
      title: การควบคุมคุณภาพในกระบวนการ — การเชื่อมและการเชื่อมติด
      description: ระหว่างการผลิต คุณภาพของรอยเชื่อมจะถูกตรวจสอบอย่างต่อเนื่องมีการทดสอบการลอก (ASTM D751) กับตัวอย่างทุก ๆ 50 หน่วยความกว้างของรอยเชื่อมจะถูกวัดตามข้อกําหนดบันทึกอุณหภูมิอากาศร้อนจะถูกตรวจสอบความสม่ําเสมอทุกรอยต่อจะถูกตรวจสอบด้วยสายตาภายใต้แสงไฟย้อนเพื่อหาการรั่วไหลหรือช่องว่าง
      checks: การทดสอบลอก ASTM D751 ทุก 50 หน่วย, วัดความกว้างรอยเชื่อม, ตรวจสอบบันทึกอุณหภูมิอากาศร้อน, ตรวจสอบรอยต่อแสงแบ็คไลท์
      threshold: ความแข็งแรงในการลอกอย่างน้อย 8 N/cm ความคลาดเคลื่อนของความกว้างเชื่อม ±1 มม.การลอกที่มองเห็นได้ = การปฏิเสธ
    - stage: '4'
      title: การตรวจสอบคุณภาพการประกอบ
      description: แต่ละหน่วยจะปฏิบัติตามรายการตรวจสอบประกอบ 100 ข้อที่หัวหน้าทีมลงนามการทํางานของวาล์วจะถูกทดสอบผ่านรอบเปิด/ปิด 10 รอบมีการตรวจสอบแรงบิดของฮาร์ดแวร์การตรวจสอบด้วยสายตาครอบคลุมถึงผิวสัมผัส ความสม่ําเสมอของสี การวางฉลาก และความสมบูรณ์ของอุปกรณ์เสริม
      checks: รายการตรวจสอบ 100 ข้อต่อหน่วย, การทดสอบการทํางานของวาล์ว, การตรวจสอบแรงบิดฮาร์ดแวร์, การตรวจสอบด้วยสายตา
      threshold: 'นโยบายศูนย์ข้อบกพร่องสำหรับชิ้นส่วนที่มีความสำคัญต่อความปลอดภัย (วาล์ว, D-ring, มือจับ) ความบกพร่องเล็กน้อยด้านความสวยงาม: AQL 2.5 (ISO 2859)'
    - stage: '5'
      title: การทดสอบความดัน
      description: แต่ละห้องจะถูกเติมลมเป็นแรงดันที่กําหนด 1.25× และเก็บไว้เป็นเวลา 24-48 ชั่วโมงเซ็นเซอร์วัดแรงดันจะบันทึกอย่างต่อเนื่องตลอดช่วงเวลาการเก็บการอ่านค่าที่ชดเชยอุณหภูมิช่วยให้มั่นใจในความแม่นยําห้องที่มีแรงดันตกคร่อมเกิน 5% จะถูกปฏิเสธและส่งไปตรวจสอบรอยต่อใหม่พร้อมการทดสอบซ้ํา 100% ของชุดการผลิตทั้งหมด
      checks: บันทึกการเก็บแรงดัน 24-48 ชั่วโมง ตรวจสอบการสอบเทียบเซ็นเซอร์ทุกวัน ค่าที่ชดเชยอุณหภูมิ ทดสอบรอยต่อใหม่หลังซ่อม
      threshold: แรงดันตกคร่อมสูงสุด 5% ภายใน 24 ชั่วโมงที่อุณหภูมิคงที่เกิน = ทดสอบซ้ํา 100% ของทั้งล็อต
    - stage: '6'
      title: การตรวจสอบขั้นสุดท้ายและการปล่อยสินค้า
      description: การตรวจสอบด้วยสายตาและการใช้งานขั้นสุดท้ายก่อนบรรจุตรวจสอบข้อบกพร่องของพื้นผิว ความสม่ําเสมอของสี การตรวจสอบฉลาก/ถังขยะ ความสมบูรณ์ของบรรจุภัณฑ์ และความครบถ้วนของอุปกรณ์เสริม จะถูกตรวจสอบเทียบกับคําสั่งซื้อของลูกค้าแต่ละชิ้นถูกบรรจุด้วยสุญญากาศ บรรจุกล่อง และจัดวางบนพาเลทต้องมีการอนุมัติคุณภาพขั้นสุดท้ายก่อนที่สินค้าจะออกจากโรงงาน
      checks: การตรวจสอบด้วยสายตาอย่างเต็มรูปแบบ รายการตรวจอุปกรณ์เสริมตาม SKU การทดสอบตกบรรจุภัณฑ์ (ตัวอย่างสุ่ม 1 ม.) การตรวจสอบสแกนฉลาก/บาร์โค้ด
      threshold: AQL 2.5 ข้อบกพร่องร้ายแรง, AQL 4.0 ข้อบกพร่องเล็กน้อย ข้อบกพร่องด้านความปลอดภัยรับไม่ได้ทั้งหมด ตรวจสอบด้วยสายตา 100% ของหน่วย
content_equipment:
  tagline: อุปกรณ์ทดสอบ
  title: ห้องปฏิบัติการ QC<br />อุปกรณ์
  subtitle: ห้องปฏิบัติการคุณภาพของเราติดตั้งอุปกรณ์ทดสอบเฉพาะทางสำหรับการตรวจสอบวัสดุ ความสมบูรณ์ของรอยเชื่อม และการยืนยันประสิทธิภาพของผลิตภัณฑ์
  columns: 3
  items:
    - title: เครื่องทดสอบแรงดึง
      description: วัดความทนแรงดึงและการยืดตัวของผ้าตาม ASTM D751 ใช้สำหรับ QC ขาเข้าของผ้าชุด PVC, Hypalon, และ drop-stitch ทั้งหมด
      icon: tabler:scale
    - title: ตู้ควบคุมอุณหภูมิ (Temperature Chamber)
      description: ตู้สิ่งแวดล้อมสำหรับทดสอบความต้านทาน UV (ASTM G154) และการทดสอบความยืดหยุ่นที่อุณหภูมิต่ำ เลียนแบบสภาพการใช้งานที่รุนแรง
      icon: tabler:temperature
    - title: เซ็นเซอร์แรงดันและเครื่องบันทึก
      description: เซ็นเซอร์แรงดิจิทัลพร้อมการบันทึกข้อมูลต่อเนื่องสำหรับการทดสอบการเก็บอากาศ 24-48 ชั่วโมง ชดเชยอุณหภูมิเพื่อความแม่นยำ
      icon: tabler:wind
    - title: เครื่องทดสอบการลอก
      description: อุปกรณ์ทดสอบการลอกที่ปรับเทียบแล้วสำหรับตรวจสอบความแข็งแรงของรอยเชื่อม ตัวอย่างสุ่มจากแต่ละชุดการผลิต
      icon: tabler:files
    - title: ถังตรวจจับการรั่ว (Leak Detection Tank)
      description: ถังน้ำสำหรับทดสอบการรั่วซึมของห้องที่พองด้วยการแช่น้ำ การตรวจสอบฟองด้วยสายตาเพื่อยืนยันความสมบูรณ์ของรอยต่อและวาล์ว
      icon: tabler:ripple
    - title: เครื่องมือการตรวจสอบ
      description: เครื่องมือวัดที่ปรับเทียบแล้ว — เกจวัดความหนา ประแจแรงบิด เวอร์เนียร์คาลิเปอร์ เครื่องทดสอบความแข็ง สำหรับสถานี QC การผลิต
      icon: tabler:tools
content_metrics:
  tagline: ผลการตรวจสอบคุณภาพ (QC)
  title: การควบคุมคุณภาพ<br />มาตรการ
  subtitle: ข้อมูลผ่าน/ไม่ผ่านจริงจากสายการผลิต มาตรการเหล่านี้ถูกตรวจสอบทุกวันและทบทวนทุกเดือนโดยผู้บริหาร
  columns: 3
  items:
    - title: ทดสอบหน่วย 100%
      description: ทุกห้องของเรือแต่ละลำถูกทดสอบแรงดันก่อนจัดส่ง ไม่มีการสุ่ม ตรวจสอบแรงดัน 100%
      icon: tabler:check
    - title: <5% การลดแรงดัน
      description: การสูญเสียแรงดันสูงสุดที่อนุญาตใน 24-48 ชั่วโมง ที่แรงดัน 1.25× ของค่าที่กำหนด ห้องใดเกินเกณฑ์นี้จะทำการทดสอบชุดใหม่
      icon: tabler:gauge
    - title: AQL 2.5
      description: ระดับคุณภาพยอมรับได้สำหรับข้อบกพร่องร้ายแรงตามมาตรฐานการสุ่ม ISO 2859 ศูนย์ยอมรับข้อบกพร่องด้านความปลอดภัย
      icon: tabler:clipboard-check
    - title: ระยะเวลาเก็บแรงดัน 24-48 ชั่วโมง
