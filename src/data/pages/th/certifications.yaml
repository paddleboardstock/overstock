hero:
  tagline: การรับรองและมาตรฐาน
  title: การรับรองคุณภาพ<br />& มาตรฐานการปฏิบัติตามข้อกําหนด
  subtitle: Paddle Board Overstock ผลิตภัณฑ์ถูกผลิตตามมาตรฐานความปลอดภัยทางทะเลสากล ระบบการจัดการคุณภาพ และข้อบังคับด้านสิ่งแวดล้อม
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock การรับรองคุณภาพและเอกสารการปฏิบัติตามข้อกําหนด
content_certifications:
  tagline: การรับรองของเรา
  title: คุณภาพที่ได้รับการรับรอง,<br />ได้รับการยอมรับในระดับโลก
  subtitle: มีCEรุ่นที่ได้รับการรับรอง 64 รุ่นและการรับรองทั่วโรงงาน แสดงให้เห็นถึงความมุ่งมั่นของเราต่อคุณภาพ ความปลอดภัย และความรับผิดชอบต่อสิ่งแวดล้อม
  items:
    - title: CE ได้รับการรับรอง
      description: รุ่นที่ได้รับการรับรอง 64 CEรุ่นเป็นไปตามCEข้อกําหนดการทําเครื่องหมายของยุโรปสําหรับเรือเพื่อการพักผ่อนหย่อนใจ เพื่อให้มั่นใจว่ามาตรฐานความปลอดภัย สุขภาพ และการปกป้องสิ่งแวดล้อมได้รับการปฏิบัติตาม
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: ระบบการจัดการคุณภาพของเราได้รับISOการรับรองมาตรฐาน 9001:2015 ครอบคลุมการออกแบบ การผลิต และการกระจายสินค้าทางน้ําเป่าลมและอุปกรณ์ทางทะเล
      icon: tabler:clipboard-check
    - title: UKCA ทําเครื่องหมาย
      description: ผลิตภัณฑ์ที่จําหน่ายในตลาดสหราชอาณาจักรจะมีUKCAเครื่องหมายยืนยันการปฏิบัติตามข้อกําหนดของสหราชอาณาจักรสําหรับอุปกรณ์ทางทะเลและเรือส่วนบุคคล
      icon: tabler:shield
    - title: BSCI เป็นไปตามข้อกําหนด
      description: Paddle Board Overstock ได้รับการBSCIตรวจสอบ (Business Social Social Compliance Initiative) ซึ่งแสดงให้เห็นถึงแนวปฏิบัติการผลิตที่มีจริยธรรม สภาพแรงงานที่เป็นธรรม และความรับผิดชอบในห่วงโซ่อุปทาน
      icon: tabler:heart-handshake
    - title: REACH เป็นไปตามข้อกําหนด
      description: วัสดุทั้งหมดที่ใช้ในPaddle Board Overstockผลิตภัณฑ์เป็นไปตามข้อกําหนดของสหภาพยุโรปREACHด้านความปลอดภัยทางเคมี โดยรับประกันว่าไม่มีสารที่ถูกจํากัดในPVCHypalonส่วนประกอบของเรา
      icon: tabler:flask
    - title: การทดสอบวัสดุ
      description: ผ้าจะถูกทดสอบความแข็งแรงต่อแรงดึง ความต้านทานการฉีกขาด UV การเสื่อมสภาพ และประสิทธิภาพการแตกร้าวเย็นทุกล็อตการผลิตจะถูกสุ่มตัวอย่างและตรวจสอบ
      icon: tabler:test-pipe
content_factory:
  tagline: มาตรฐานโรงงาน
  title: ความเป็นเลิศในการผลิต<br />— ผลิตตามข้อกําหนด
  subtitle: โรงงานขนาด 12,000 ตารางเมตรของเราดําเนินงานภายใต้มาตรการควบคุมคุณภาพอย่างเข้มงวดในทุกขั้นตอนของการผลิต
  list:
    - 'การตรวจสอบวัสดุนําเข้า: วัตถุดิบทั้งหมด — PVC ผ้า, Hypalonอะลูมิเนียม, ไม้อัด, กาว — จะได้รับการทดสอบตามข้อกําหนดก่อนเข้าสู่การผลิต'
    - 'การควบคุมคุณภาพระหว่างกระบวนการ: ทุกขั้นตอนการผลิตมีจุดตรวจสอบ QC ที่บันทึกไว้ความแข็งแรงของรอยเชื่อม การจัดแนวรอยต่อ การติดตั้งวาล์ว และแรงบิดของข้อต่อ ได้รับการตรวจสอบในระบบ'
    - 'การทดสอบแรงดัน: ห้องเป่าลมทุกห้องจะถูกทดสอบแรงดันที่แรงดันที่กําหนด 1.25× เป็นเวลา 24–48 ชั่วโมงอัตราการรั่วต้องอยู่ในขอบเขตที่ยอมรับได้ตามISOมาตรฐาน 6185'
    - 'การตรวจสอบขั้นสุดท้าย: ผลิตภัณฑ์ที่เสร็จสมบูรณ์จะถูกตรวจสอบความแม่นยําของขนาด การตกแต่งภายนอก ความสมบูรณ์ของอุปกรณ์เสริม และความสมบูรณ์ของบรรจุภัณฑ์ก่อนจัดส่ง'
    - 'การติดตามย้อนกลับแบบแบทช์: สินค้าทุกชิ้นจะมีหมายเลขซีเรียลที่เชื่อมโยงกับบันทึกแบตช์ที่ผลิต ทําให้สามารถติดตามย้อนกลับได้ตั้งแต่วัตถุดิบจนถึงสินค้าสําเร็จรูปได้อย่างสมบูรณ์'
content_safety:
  tagline: มาตรฐานความปลอดภัยทางทะเล
  title: ความปลอดภัยมาก่อน<br />— ออกแบบเพื่อการทำงานที่เชื่อถือได้
  subtitle: ผลิตภัณฑ์ Paddle Board Overstock ถูกออกแบบและทดสอบให้ตรงตามมาตรฐานความปลอดภัยทางทะเลสากลสำหรับการใช้งานเชิงพาณิชย์และนันทนาการ
  items:
    - title: ISO 6185
      description: เรือเป่าลมเป็นไปตามมาตรฐาน ISO 6185 สำหรับการก่อสร้าง ความมั่นคง ความลอยตัว และความสามารถในการบรรทุก
      icon: tabler:sailboat
    - title: มาตรฐาน ABYC
      description: ระบบไฟฟ้าและระบบเชื้อเพลิงเป็นไปตามมาตรฐาน ABYC (American Boat & Yacht Council) สำหรับการติดตั้งและการใช้งานอย่างปลอดภัย
      icon: tabler:bolt
    - title: SOLAS การปฏิบัติตาม
      description: อุปกรณ์ความปลอดภัยและอุปกรณ์ช่วยชีวิตเป็นไปตามข้อกำหนด SOLAS (Safety of Life at Sea) เมื่อสามารถใช้ได้
      icon: tabler:lifebuoy
cta:
  title: ต้องการผลิตภัณฑ์ที่ได้รับการรับรองสำหรับโครงการของคุณหรือไม่?
  subtitle: ติดต่อทีมงานของเราเพื่อหารือเกี่ยวกับข้อกำหนดการรับรอง เอกสาร และการปฏิบัติตามสำหรับตลาดของคุณ
  actions:
    - variant: primary
      text: ขอเอกสารการรับรอง
      href: /contact
    - text: ดูหน้าคุณภาพของเรา
      href: /quality
