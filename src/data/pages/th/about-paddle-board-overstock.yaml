hero:
  tagline: เกี่ยวกับ
  title: เกี่ยวกับ Paddle Board Overstock
  subtitle: ตั้งแต่ปี 2012 เราได้นําบอร์ดเป่าลมใหม่SUP เอี่ยมไปสู่มือของนักพายและร้านค้าปลีกขนาดเล็กใน 50+ ประเทศ — สินค้าคงคลังเกิน ราคาที่ยุติธรรม และการรับประกันที่เราปฏิบัติตามจริง
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock กระดานเป่าลมใหม่เอี่ยม SUP
direct_answer: Paddle Board Overstock เป็นแบรนด์อุปกรณ์กีฬาทางน้ํา ก่อตั้งขึ้นในปี 2012 และมีฐานอยู่ที่เมืองเว่ยไห่ ประเทศจีนเราจําหน่ายบอร์ดเป่าลมใหม่เอี่ยม SUP จากสินค้าคงคลังส่วนเกิน — ผสมผสานระหว่างการผลิตส่วนเกินจากฐานการผลิตของเราเองและสต็อกที่คัดสรรมาอย่างพิถีพิถันจากโรงงานพันธมิตร — โดยตรงถึงผู้พายปลายทางและร้านค้าปลีกขนาดเล็กใน 50+ ประเทศบอร์ดทุกชิ้นผ่านการทดสอบแรงดัน 100% รับประกัน 2 ปี SUP และจัดส่งโดยขนส่งด่วนหรือทางทะเล
tldr_points:
  - ก่อตั้งในปี 2012 ตั้งอยู่ที่เว่ยไห่ ประเทศจีน — หนึ่งในศูนย์กลางการผลิตที่สําคัญของโลก SUP
  - 'โมเดลสินค้าคงคลัง: บอร์ดใหม่เอี่ยมในราคาต่ํากว่าราคาขายปลีก ไม่มีคนกลาง'
  - 'สินค้าคงคลังเป็นแบบผสม: ผลิตส่วนเกินจากฐานของเรา บวกกับสต็อกจากโรงงานพันธมิตรที่ผ่านการตรวจสอบ'
  - ให้บริการ 50+ ประเทศ ผ่านการตรวจสอบขั้นสุดท้าย 99.3% รับประกัน 2 ปีSUP
story_section:
  tagline: เรื่องราวของเรา
  title: เหตุผลที่เราขายสินค้าคงคลังส่วนเกิน
  paragraphs:
    - Paddle Board Overstock เริ่มต้นในปี 2012 ที่เมืองเว่ยไห่ ประเทศจีน — เมืองชายฝั่งในมณฑลซานตงที่เติบโตขึ้นเป็นหนึ่งในศูนย์กลางการผลิตเรือเป่าลมที่สําคัญที่สุดในโลก SUP จากฐานนี้ เราใช้เวลากว่าทศวรรษในการผลิตกระดานพายเป่าลมและจัดส่งไปทั่วโลก
    - Along the way we noticed something that shapes everything we do today: ทุกฤดูกาลผลิตจะทิ้งแผ่นไม้ใหม่ที่ยังดีอยู่ — สินค้าที่เกินความต้องการ คําสั่งซื้อที่ถูกยกเลิก สีสันของฤดูกาลที่แล้วในขณะเดียวกัน ร้านค้าปลีกอิสระทั่วโลกถูกปิดกั้นไม่ให้ขายส่งเพราะซัพพลายเออร์แบบดั้งเดิมต้องการคําสั่งซื้อขนาดตู้คอนเทนเนอร์
    - ช่องว่างนั้นคือธุรกิจของเราด้วยการขายสินค้าคงคลังส่วนเกิน — การผลิตส่วนเกินจากฐานของเราเองที่เว่ยไห่ รวมถึงสต็อกที่คัดสรรอย่างพิถีพิถันจากโรงงานพันธมิตร — เราสามารถเสนอบอร์ดใหม่เอี่ยมในราคาที่ต่ํากว่าราคาปกติมาก ในปริมาณที่พอสําหรับนักพายคนเดียวหรือคําสั่งซื้อบอร์ดห้าชุดไม่มีอะไรเป็นของมือสอง ไม่มีอะไรเป็นของมือสอง;มันเป็นเพียงสินค้าคงคลังที่สมควรได้รับลูกค้าแทนที่จะเป็นคลังสินค้า
model_section:
  tagline: รูปแบบธุรกิจของเรา
  title: วิธีการทํางานของโมเดลสต็อกเกิน
  items:
    - title: ใหม่เอี่ยม ไม่เคยใช้งาน
      description: ทุกแผ่นที่เราขายเป็นของใหม่เอี่ยมและไม่ได้ใช้งานสินค้าคงคลังเกินหมายถึงสินค้าคงคลังส่วนเกิน — ไม่ใช่การคืนสินค้า ไม่ใช่ของรีเฟอร์บิช ไม่ใช่ของสํารอง
    - title: สินค้าคงคลังแหล่งผสม
      description: สต็อกของเรารวมการผลิตส่วนเกินจากฐานการผลิตของเราเองที่เว่ยไห่กับสต็อกที่คัดสรรจากโรงงานพันธมิตรที่เรายึดตามมาตรฐานคุณภาพเดียวกันแหล่งผลิตมีความหลากหลาย;มาตรฐานไม่เป็นเช่นนั้น
    - title: ราคาต่ํากว่าราคาขายปลีก
      description: สินค้าคงคลังส่วนเกินมีต้นทุนน้อยกว่าการซื้อ ดังนั้นคุณจึงมีค่าใช้จ่ายในการซื้อถูกกว่าไม่มีราคาขายที่เกินจริง ไม่มีส่วนลดปลอม — มีแต่ราคาที่ซื่อสัตย์บนสินค้าจริง
    - title: ขายส่งที่เป็นมิตรกับธุรกิจขนาดเล็ก
      description: การขายส่งเริ่มต้นที่ 5 บอร์ด ไม่ใช่จํานวนตู้คอนเทนเนอร์ร้านค้าปลีกขนาดเล็กสามารถผสมรุ่นที่มีในสต็อกในคําสั่งซื้อเดียวและเลือกขนส่งด่วนหรือขนส่งทางทะเล
    - title: การจัดส่งตรงถึงคุณ
      description: คําสั่งซื้อจัดส่งตรงจากฐานโลจิสติกส์ของเราในเว่ยไห่ถึงหน้าประตูบ้านคุณใน 50+ ประเทศ — ส่งตัวอย่างและสั่งซื้อขนาดเล็ก ขนส่งทางทะเลรวมสําหรับขายส่ง
quality_section:
  tagline: คุณภาพและการรับประกัน
  title: คุณภาพเบื้องหลังทุกบอร์ด
  subtitle: ราคาสินค้าคงคลังเกินไม่ได้หมายความว่ามาตรฐานจะผ่อนปรนทุกบอร์ด — ไม่ว่าจะมาจากที่ใด — ต้องผ่านกระบวนการเดียวกันก่อนจัดส่ง
  items:
    - title: ผ่านการทดสอบแรงดัน 100%
      description: ทุกบอร์ดถูกเติมลมและทดสอบแรงดันถึง 15 PSI ก่อนจัดส่ง ไม่มีบอร์ดใดที่จะจัดส่งโดยไม่ผ่านการทดสอบ ไม่ว่าแหล่งที่มาของสต็อกจะมาจากที่ใด
    - title: ทดสอบการรับน้ำหนักเกินถึง 1.25 เท่า
      description: บอร์ดจากการผลิตของเราจะถูกสุ่มทดสอบเกินแรงดันที่กำหนด — คงแรงดันที่ 1.25 เท่าของแรงดันทำงานเป็นเวลา 24–48 ชั่วโมงเพื่อยืนยันรอยต่อ วาล์ว และการก่อสร้าง drop-stitch
    - title: อัตราผ่านการตรวจสอบสุดท้าย 99.3%
      description: กระบวนการตรวจสอบสุดท้ายของเราผ่านบอร์ด 99.3% ว่าไร้ข้อบกพร่อง — และบอร์ดส่วนน้อยที่ไม่ผ่านจะไม่ถูกนำเข้าสู่สต็อกเกิน
    - title: รับประกัน SUP 2 ปี
      description: ทุกบอร์ด SUP มาพร้อมการรับประกัน SUP 2 ปี ครอบคลุมข้อบกพร่องด้านการผลิต การรับประกันเดียวกันนี้ใช้กับลูกค้าทุกคนในตลาด 50+ แห่งของเรา
