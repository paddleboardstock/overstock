hero:
  tagline: การมีอยู่ทั่วโลก
  title: ให้บริการในกว่า 50 ประเทศ<br />ทั่วทุกทวีป
  subtitle: ตั้งแต่ผู้ปฏิบัติการลาดตระเวนชายฝั่งในยุโรปไปจนถึงผู้จำหน่ายอุปกรณ์กีฬาทางน้ำในออสเตรเลีย และทีมกู้ภัยในตะวันออกกลาง — เรือ Aquafarer ของเราลงน้ำทั่วโลก
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer การผลิตและจัดจำหน่ายด้านการเดินเรือระดับโลก
stats:
  title: การเข้าถึงระดับโลก
  stats:
    - title: ประเทศ
      amount: 50+
    - title: ตลาดส่งออก
      amount: ยุโรป อเมริกา เอเชีย ตะวันออกกลาง โอเชียเนีย
    - title: การผลิต
      amount: ชิงเต่า ประเทศจีน
    - title: คลังสินค้าในสหรัฐอเมริกา
      amount: มอนต์แคลร์, แคลิฟอร์เนีย
features3_markets:
  tagline: ตลาดหลัก
  title: ความเชี่ยวชาญระดับภูมิภาค<br />เพื่อตอบสนองความต้องการในท้องถิ่น
  subtitle: เราเข้าใจว่าตลาดที่แตกต่างกันมีข้อกำหนดด้านกฎระเบียบ ความชอบ และการใช้งานที่แตกต่างกัน
  isBeforeContent: false
  columns: 4
  items:
    - title: ยุโรปและสหราชอาณาจักร
      description: ผลิตภัณฑ์ที่ได้รับการรับรอง CE ตรงตามมาตรฐาน EN ISO 6185 ความต้องการสูงสำหรับ RIBs เรือเป่าลม และ SUP ทั่วตลาดสหภาพยุโรป ตัวแทนจำหน่ายในสหราชอาณาจักรชื่นชมความรวดเร็วในการจัดส่งของเรา
      icon: tabler:map-pin
    - title: อเมริกาเหนือ
      description: การผลิตได้รับการอนุมัติจาก US Coast Guard มีคลังสินค้าในมอนต์แคลร์, แคลิฟอร์เนีย เพื่อการจัดส่งอย่างรวดเร็วในฝั่งตะวันตก ความต้องการเพิ่มขึ้นสำหรับเรือตกปลา เรือกู้ภัย และ SUPs เพื่อพักผ่อนหย่อนใจ
      icon: tabler:map-pin
    - title: ออสเตรเลียและโอเชียเนีย
      description: ตลาดแข็งแกร่งสำหรับเรือ RIB และเรือท้องเป่าลม ตัวแทนจำหน่ายในออสเตรเลียให้คุณค่ากับเรือ Hypalon ของเราสำหรับความทนทานต่อ UV ในสภาพแสงแดดจัด การจัดส่งรวดเร็วจากโรงงานในเอเชียของเรา
      icon: tabler:map-pin
    - title: ตะวันออกกลาง
      description: ความต้องการเพิ่มขึ้นสำหรับเรือตรวจการณ์และกู้ภัย เรือส่วนตัวลำตัวอลูมิเนียม RIBs ของเรามีความนิยมในหมู่หน่วยยามฝั่งและผู้ประกอบการด้านความปลอดภัย การปรับแต่งตามสภาพแวดล้อมที่มีอุณหภูมิสูง
      icon: tabler:map-pin
features3_distribution:
  tagline: เครือข่ายการจัดจำหน่าย
  title: ความร่วมมือกับตัวแทนจำหน่าย<br />ทั่วโลก
  subtitle: เราทำงานร่วมกับตัวแทนจำหน่ายอุปกรณ์ทางทะเลที่มีชื่อเสียง แบรนด์ OEM และหน่วยงานจัดซื้อของรัฐบาล
  isBeforeContent: false
  columns: 3
  items:
    - title: ความร่วมมือ OEM/ODM
      description: การผลิตแบรนด์ส่วนตัวสําหรับแบรนด์กีฬาทางน้ําระดับโลกเราดูแลทุกอย่างตั้งแต่การออกแบบ การผลิต ไปจนถึงการส่งสินค้าแบบดรอปชิปปิ้ง
      icon: tabler:building
    - title: เครือข่ายผู้จัดจําหน่าย
      description: ผู้จัดจําหน่ายที่ได้รับอนุญาตใน 20+ ประเทศมีสต็อกสินค้าและให้บริการในพื้นที่ยินดีรับคําถามจากผู้จัดจําหน่ายใหม่
      icon: tabler:users
    - title: รัฐบาลและสถาบัน
      description: การจัดหาโดยตรงให้กับหน่วยยามฝั่ง องค์กรค้นหาและกู้ภัย และโครงการจัดซื้อจัดจ้างทางทหารการปฏิบัติตามข้อกําหนดการจัดซื้อจัดจ้างของสถาบัน
      icon: tabler:building-community
steps2_logistics:
  title: โลจิสติกส์และการสนับสนุนระดับโลก
  subtitle: ตั้งแต่โรงงานจนถึงปลายทาง — เราดูแลห่วงโซ่อุปทานทั้งหมด
  items:
    - title: ตัวเลือกการจัดส่ง
      description: ขนส่งทางทะเล (FOBชิงเต่า), ขนส่งทางอากาศสําหรับคําสั่งซื้อเร่งด่วน และจัดส่งด่วนสําหรับตัวอย่างและอะไหล่
      icon: tabler:truck-delivery
    - title: คลังสินค้าในสหรัฐอเมริกา
      description: 'สต็อกเก็บไว้ที่มอนต์แคลร์ รัฐแคลิฟอร์เนีย เพื่อจัดส่งรวดเร็วทั่วอเมริกาเหนือฝั่งตะวันตก: 2-3 วัน, ภาคกลาง: 3-4 วัน, ภาคตะวันออก: 4-5 วัน'
      icon: tabler:building-warehouse
    - title: อะไหล่
      description: Aquafarer อะไหล่แท้และวัสดุสิ้นเปลืองมีสต็อกตลอดทั้งปีอะไหล่ทั่วไปจัดส่งภายใน 24 ชั่วโมง
      icon: tabler:package
    - title: ฝ่ายสนับสนุนทางเทคนิค
      description: ติดต่อทีมวิศวกรรมของเราโดยตรงเพื่อสอบถามเรื่องเทคนิค คําแนะนําการซ่อมแซม และการสนับสนุนการปรับปรุงเราสนับสนุนเรือที่เราสร้างเมื่อ 20 ปีก่อน
      icon: tabler:headset
cta:
  title: อยากเป็นตัวแทนจําหน่ายไหม?
  subtitle: เรากําลังขยายเครือข่ายการจัดจําหน่ายอย่างต่อเนื่องติดต่อทีมส่งออกของเราเพื่อหารือเกี่ยวกับโอกาสในการเป็นพันธมิตร
  actions:
    - variant: primary
      text: การสอบถามเกี่ยวกับความร่วมมือ
      href: /contact
    - text: ดูกลุ่มผลิตภัณฑ์ของเรา
      href: /products
