testimonial:
  quote: สิ่งที่ทำให้ Paddle Board Overstock แตกต่างคือวิทยาศาสตร์วัสดุของพวกเขา พวกเขาไม่ได้เพียงแค่ประกอบชิ้นส่วน — แต่พัฒนาสารประกอบ PVC พารามิเตอร์การเชื่อม และการวางโครงสร้างภายในบริษัท การรวมกระบวนการแบบแนวตั้งนี้สะท้อนให้เห็นในผลิตภัณฑ์สุดท้าย
  author: เดวิด พาร์ค
  title: ผู้จัดการฝ่ายพัฒนาผลิตภัณฑ์
  company: Bluewater Sports Equipment
  location: ออสเตรเลีย
sections:
  - title: แกน Drop-Stitch
    standard: ความดันการใช้งาน 12-15 PSI
    description: เส้นใยโพลีเอสเตอร์ภายในหลายพันเส้นเชื่อมชั้นบนและล่าง สร้างโครงสร้างที่แข็งแรงที่ 12-15 PSI เทคโนโลยีเดียวกันนี้ถูกใช้ในบอร์ดพายมืออาชีพและเรือเป่าระดับแข่งขัน ความหนาแน่น drop-stitch ของเราจะถูกปรับตามแต่ละโมเดลเพื่อให้ได้สมดุลระหว่างความแข็งและน้ำหนักที่เหมาะสม
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: แผนภาพแกน DS
  - title: PVC เกรดทางทะเล
    standard: เชื่อมฟิวชั่น | UV / น้ำทะเล / ทดสอบการขีดข่วน
    description: ผ้าหลายชั้น PVC ผ่านการเคลือบที่เหมาะกับสภาพแวดล้อมทางทะเล แต่ละชั้นเชื่อมด้วยฟิวชั่นแทนการใช้กาว เพื่อลดความเสี่ยงของการหลุดลอก ทดสอบความต้านทาน UV (ASTM G154, 1,000+ ชั่วโมง) การกัดกร่อนจากน้ำทะเล (ISO 9227) และการขีดข่วน (ASTM D751)
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: ชั้น PVC
  - title: ท่อ Hypalon
    standard: ยาง CSM | UV / เคมี / ทนความร้อนสูง
    description: ใช้ในโมเดล RIB ท่อยาง Hypalon (CSM) ให้ความต้านทานต่อ UV และสารเคมีดีกว่ายาง PVC ปกติ ท่อ Hypalon คงความยืดหยุ่นในอุณหภูมิสูงและทนต่อการเสื่อมสภาพจากน้ำมันและเชื้อเพลิง รอยต่อทั้งหมดถูกวางด้วยมือโดยช่างเทคนิคที่ได้รับการรับรอง
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: พื้นกระดานอากาศ
    standard: ยางพองความดันสูง | แทนแผ่นไม้ไผ่/อะลูมิเนียม
    description: ระบบพื้นยางพองความดันสูงที่ใช้แทนพื้นแผ่นไม้หรือแผ่นอะลูมิเนียมแบบดั้งเดิม ลดเวลาในการติดตั้ง น้ำหนักรวม และปริมาตรการจัดเก็บ พร้อมทั้งให้ความแข็งพอเหมาะสำหรับการยืน ตกปลา และเดิน ทดสอบรองรับน้ำหนักกระจายได้ 200 กก.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: พื้นอากาศ
