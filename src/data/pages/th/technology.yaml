hero:
  tagline: เทคโนโลยี
  title: ออกแบบเพื่อประสิทธิภาพ
  subtitle: ทุก Paddle Board Overstock บอร์ดถูกออกแบบด้วยวัสดุและวิธีการก่อสร้างที่แม่นยำ ผ่านการทดสอบสำหรับสภาพแวดล้อมทางทะเล ศูนย์วิจัยและพัฒนา 12,000 ตร.ม. พร้อมต้นแบบภายในบริษัท
