hero:
  tagline: เทคโนโลยี
  title: ออกแบบเพื่อประสิทธิภาพ
  subtitle: ทุกบอร์ด Paddle Board Overstock ถูกออกแบบด้วยวัสดุและวิธีการก่อสร้างที่มีความแม่นยำซึ่งผ่านการทดสอบสำหรับสภาพแวดล้อมทางทะเล ศูนย์วิจัยและพัฒนาขนาด 12,000 ตารางเมตรพร้อมการสร้างต้นแบบภายในองค์กร
