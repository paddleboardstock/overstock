features3_solutions:
  tagline: แนวทางแก้ไข
  title: การผจญภัยทางน้ําของคุณ<br />พันธมิตรทางธุรกิจ
  isBeforeContent: false
  columns: 3
  items:
    - title: ชมรมกีฬาทางน้ํา
      description: ชุดอุปกรณ์ครบวงจร การสร้างแบรนด์เฉพาะ และโปรแกรมบํารุงรักษาสําหรับSUPสโมสร สโมสรคายัค โรงเรียนสอนเซิร์ฟ และศูนย์ฝึกอบรม
      icon: tabler:users
      link: /solutions/clubs
    - title: กีฬาRIBsทางน้ํา
      description: สร้างขึ้นRIBsโดยเฉพาะสําหรับโรงเรียนสอนแล่นเรือใบ ศูนย์กีฬาทางน้ํา และองค์กรจัดงานต่าง ๆเรือโค้ช เรือลากจูง และเรือมาร์แชลสําหรับกีฬาทางน้ํามืออาชีพ
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: รีสอร์ทและโรงแรม
      description: โปรแกรมกีฬาทางน้ําระดับพรีเมียมพร้อมอุปกรณ์สําหรับเรือ ระบบความปลอดภัย การฝึกอบรมพนักงาน และการบริหารรายได้สําหรับที่พักการบริการ
      icon: tabler:beach
      link: /solutions/resorts
    - title: ผู้ประกอบการแบรนด์น้ํา
      description: แบรนด์ส่วนตัว OEM/ODM การผลิต พร้อมMOQsการออกแบบสินค้าที่ต่ํา ปรับแต่งเฉพาะ บรรจุภัณฑ์ และการจัดส่งทั่วโลกสําหรับเจ้าของแบรนด์ใหม่
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: เรือศูนย์ดําน้ํา
      description: แพลตฟอร์มที่มั่นคง RIB พร้อมการขึ้น-ออกที่ง่าย การเก็บอุปกรณ์ และการตั้งค่าเครื่องยนต์ที่ออกแบบมาเพื่อการดําน้ํา
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: เรือกู้ภัยและฉุกเฉิน
      description: RIBs เรือความเร็วสูงและเรือเป่าลมที่ออกแบบมาเพื่อค้นหาและกู้ภัย การตอบสนองเหตุฉุกเฉิน และปฏิบัติการของหน่วยยามฝั่ง
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: โซลูชันเรือยอชต์เทนเดอร์
      description: เรือเทนเดอร์ขนาดกะทัดรัด ดีไซน์ทันสมัย RIB เสริมกับซูเปอร์ยอชต์และเรือพักผ่อนเก็บรักษาง่าย สมรรถนะทรงพลัง
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: โซลูชันเรือประมง
      description: เรือเป่าลมที่มั่นคงและทนทาน RIBs เหมาะสําหรับการตกปลาเชิงพาณิชย์และเพื่อการพักผ่อน
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: อุปกรณ์ท่องเที่ยวทางทะเล
      description: เรือยางพร้อมใช้งาน, กระดาน SUP, และเรือคายัค สำหรับรีสอร์ท ผู้ประกอบการทัวร์ และธุรกิจให้เช่าอุปกรณ์กีฬาทางน้ำ
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: พลังงานนอกชายฝั่ง RIBs
      description: RIBs ทนทานสำหรับรองรับแพลตฟอร์มน้ำมันและก๊าซ, การขนส่งทีมงานฟาร์มกังหันลม, การตรวจสอบสายเคเบิลใต้น้ำ, และงานก่อสร้างทางทะเล
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: เรือทำงานด้านการเลี้ยงสัตว์น้ำ
      description: RIBs กันการกัดกร่อนสำหรับเลี้ยงปลา, การเพาะเลี้ยงมุก, และการเพาะเลี้ยงสัตว์ทะเล Hypalon ท่อ, อุปกรณ์สแตนเลส, ทนทานต่อการใช้งานทุกวัน
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: การวิจัยและสำรวจทางทะเล
      description: RIBs ที่มั่นคงพร้อมติดตั้งเครื่องมือสำหรับงานวิจัยสมุทรศาสตร์, การเฝ้าระวังสิ่งแวดล้อม, การเก็บตัวอย่างคุณภาพน้ำ, และโปรแกรมการสอนในมหาวิทยาลัย
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: เรือทำงานเชิงพาณิชย์
      description: RIBs ทนทานสำหรับการลาดตระเวน, การสำรวจ, การขนส่ง, และโลจิสติกส์นอกชายฝั่ง สร้างขึ้นเพื่อตอบรับความต้องการเข้มงวดของการดำเนินงานเชิงพาณิชย์
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: ยังไม่แน่ใจว่าหนทางไหนเหมาะกับธุรกิจของคุณ?
  subtitle: บอกเราเกี่ยวกับการดำเนินงานของคุณ — เราจะแนะนำแพ็กเกจอุปกรณ์ โปรแกรมสร้างแบรนด์ หรือทางออกที่กำหนดเองที่เหมาะสม
  actions:
    - variant: primary
      text: รับคำปรึกษาฟรี
      href: /contact
