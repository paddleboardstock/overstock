hero:
  tagline: โรงเรียนกีฬาทางน้ำ & ศูนย์ฝึกอบรม
  title: โซลูชันอุปกรณ์<br />สำหรับโรงเรียน SUP & คายัค
  subtitle: อุปกรณ์เชิงพาณิชย์ที่เชื่อถือได้สำหรับโรงเรียนพายเรือ การสอนเซิร์ฟ การฝึกคายัค และโปรแกรมการศึกษากีฬาทางน้ำทุกขนาด
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP กระดานสำหรับโรงเรียนและศูนย์ฝึกอบรม
direct_answer: Paddle Board Overstock จัดหา SUP และโรงเรียนคายัคทั่วโลกด้วยกระดานมาตรฐานเชิงพาณิชย์ อุปกรณ์ความปลอดภัย และแพ็กเกจสำหรับครูผู้สอน อุปกรณ์ของเราสร้างขึ้นเพื่อการใช้งานในการสอนประจำวัน — PVC หนาขึ้น แกน drop-stitch เสริมความแข็งแรง และการออกแบบตัวเรือที่มั่นคงเพื่อสร้างความมั่นใจให้ผู้เริ่มเรียนและความเชื่อถือให้กับครูผู้สอน แพ็กเกจรวมถึงการปรับแบรนด์ โปรแกรมอะไหล่ และทรัพยากรการฝึกอบรม
solution_offerings:
  - title: แพ็กเกจเริ่มต้นสำหรับโรงเรียน
    subtitle: สำหรับโปรแกรมใหม่และศูนย์ฝึกอบรมขนาดเล็ก
    badge: Popular
    features:
      - title: กระดานสำหรับนักเรียน
        description: 10–25 กระดาน SUP แบบรอบด้านหรือคายัคสันทนาการที่มีแพลตฟอร์มมั่นคงสำหรับบทเรียนผู้เริ่มต้น
      - title: กระดานสำหรับครูผู้สอน
        description: กระดานขนาดกว้างและยาวขึ้น พร้อมความมั่นคงพิเศษและดาดฟ้า EVA ป้องกันการลื่นสำหรับการฝึกสอน
      - title: อุปกรณ์ความปลอดภัย
        description: เสื้อชูชีพ สายรัด นกหวีด และถุงกู้ภัยในสีที่เข้าชุดกัน
      - title: การจัดเก็บ & ขนส่ง
        description: ชั้นวางกระดานแบบซ้อนกัน แครเดิลคายัคแบบบุบุนุ่ม และรถเข็นขนส่ง
      - title: สนับสนุนหลักสูตร
        description: แม่แบบบทเรียน รายการตรวจสอบความปลอดภัย และคู่มือการพัฒนาทักษะ
    cta_text: เริ่มแพ็กเกจโรงเรียนของฉัน
    cta_href: /contact
  - title: แพ็กเกจโรงเรียนพรีเมียม
    subtitle: สำหรับโรงเรียนที่มีอยู่แล้วและผู้ดำเนินหลายโปรแกรม
    badge: Best Value
    features:
      - title: กองเรือเต็ม
        description: 25–50 กระดานหรือคายัคพร้อมกองผสม (แบบรอบด้าน, ทัวร์ริ่ง, ขนาดเยาวชน)
      - title: กองเรือครูผู้สอน
        description: 3–5 กระดานครูผู้สอนเฉพาะทางพร้อมที่ติดตั้งระบบเสียงในตัว
      - title: สถานีความปลอดภัย
        description: สถานีอุปกรณ์ความปลอดภัยกลางรวม PFD วิทยุ ชุดปฐมพยาบาล และป้ายสัญลักษณ์
      - title: แพ็กเกจแบรนด์
        description: พิมพ์โลโก้เต็มรูปแบบบนกระดาน แพดเดิล PFD และชุดยูนิฟอร์ม
      - title: โปรแกรมบำรุงรักษา
        description: ชุดบำรุงรักษาแบบรายไตรมาส ชุดอะไหล่ และการฝึกอบรมซ่อมแซม
    cta_text: สร้างแพ็คเกจพรีเมียม
    cta_href: /contact
  - title: แพ็คเกจแฟรนไชส์โรงเรียน
    subtitle: สำหรับเครือข่ายหลายสาขาและผู้ประกอบการแฟรนไชส์
    badge: Enterprise
    features:
      - title: มาตรฐานยานพาหนะ
        description: อุปกรณ์เหมือนกันในทุกสาขาเพื่อประสบการณ์ผู้เรียนที่สม่ำเสมอ
      - title: การสั่งซื้อกลาง
        description: การสั่งซื้อรวม ราคาส่ง และการจัดการอะไหล่แบบศูนย์กลาง
      - title: การฝึกอบรมผู้สอน
        description: การจัดการอุปกรณ์และการรับรองการบำรุงรักษาสำหรับผู้สอนทุกคน
      - title: การสร้างแบรนด์ร่วม
        description: แบรนด์ร่วมกับแฟรนไชส์ + Paddle Board Overstock ตัวเลือกการสร้างแบรนด์ร่วม
      - title: การสนับสนุนการขยายธุรกิจ
        description: คำปรึกษาการขยาย การคาดการณ์อุปกรณ์ และการติดตั้งสาขาใหม่
    cta_text: หารือแผนแฟรนไชส์
    cta_href: /contact
benefits:
  - title: สร้างมาเพื่อการสอนทุกวัน
    description: PVC หนาขึ้นและราวเสริมแรงสามารถรองรับการใช้งานโดยนักเรียนทุกวัน การตกลงบนทราย และการลงจอดบนหิน
    icon: tabler:shield
  - title: แพลตฟอร์มการเรียนที่มั่นคง
    description: ตัวถังกว้างขึ้นและตัวโค้งเรียบขึ้นทำให้ผู้เริ่มต้นมั่นใจ ผู้สอนสามารถมุ่งเน้นการสอนได้แทนอุปกรณ์
    icon: tabler:scale
  - title: การเก็บและขนส่งง่าย
    description: การออกแบบแบบเป่าลมเก็บในพื้นที่ขนาดเล็กได้ กระดานที่ลดลมแล้วสามารถใส่ในท้ายรถมาตรฐานเพื่อการสอนเคลื่อนที่
    icon: tabler:box-seam
  - title: แบรนด์ที่ปรับแต่งได้
    description: โลโก้และสีของโรงเรียนบนแต่ละกระดาน แบรนด์ของคุณ อัตลักษณ์ของคุณ — ไม่ใช่อุปกรณ์เช่าแบบทั่วไป
    icon: tabler:brush
content_segments:
  tagline: โปรไฟล์โรงเรียน
  title: โซลูชันการศึกษากีฬาทางน้ำ<br />ตามประเภทโปรแกรม
  subtitle: โรงเรียนพายเรือ โรงเรียนสอนโต้คลื่น โปรแกรมมหาวิทยาลัย และผู้ประกอบการแฟรนไชส์แต่ละประเภทเผชิญกับความท้าทายในการดำเนินงานที่แตกต่างกัน — ตั้งแต่การบูรณาการหลักสูตรจนถึงการสร้างมาตรฐานยานพาหนะหลายสาขา เราจัดแพ็คเกจอุปกรณ์ให้ตรงกับรูปแบบการศึกษา
  items:
    - title: โรงเรียน SUP & คายัคอิสระ
      subtitle: ศูนย์ฝึกอบรมที่เจ้าของเป็นผู้ดำเนินการ
      description: โรงเรียนขนาดเล็กถึงกลางที่ดำเนินการโดยเจ้าของ-ผู้สอนที่ให้บทเรียน SUP การฝึกคายัค และหลักสูตรรับรองอุปกรณ์ต้องทนทานเพียงพอสำหรับการใช้งานสอนทุกวัน ราคาสมเหตุสมผลสำหรับงบประมาณธุรกิจขนาดเล็ก และมีความหลากหลายเพียงพอที่จะรองรับผู้เริ่มต้นจนถึงนักเรียนระดับกลางในยานพาหนะแบบเดียว
      features:
        - บอร์ด SUP ที่มั่นคงรอบด้านและคายักเพื่อการพักผ่อนสำหรับบทเรียนสำหรับผู้เริ่มต้น
        - บอร์ดเฉพาะสำหรับผู้สอนพร้อมความมั่นคงเพิ่มเติมสำหรับการสอนจากน้ำ
        - รวมเทมเพลนแผนบทเรียนและคู่มือการเพิ่มพูนทักษะ
        - โปรแกรมรีเฟรชอุปกรณ์ประจำปีพร้อมส่วนลดการแลกเปลี่ยน
    - title: โปรแกรมสันทนาการของมหาวิทยาลัยและวิทยาลัย
      subtitle: ฝูงนักศึกษาขนาดใหญ่สำหรับกิจกรรมสันทนาการ
      description: ฝ่ายสันทนาการของมหาวิทยาลัยที่ดำเนินการคลับพายเรือ โปรแกรมเช่า และหลักสูตรการสอนเป็นส่วนหนึ่งของกิจกรรมสันทนาการในวิทยาเขต อุปกรณ์เผชิญการใช้งานสูงสุดในช่วงเทอม ต้องการระบบลงทะเบียนรับ/คืนที่ง่าย และต้องทนต่อระดับทักษะที่หลากหลายตั้งแต่นักศึกษาครั้งแรกจนถึงนักพายขั้นสูง
      features:
        - โครงสร้าง PVC ทนทานสูง ผ่านการจัดอันดับสำหรับการใช้งานในสถาบัน
        - การจัดฝูงตามสีตามระดับทักษะเพื่อการจัดการที่ง่าย
        - รองรับระบบติดตามสินค้าด้วย RFID หรือสติ๊กเกอร์
        - ราคาส่งพร้อมการสั่งซื้อและเงื่อนไขการชำระเงินแบบแบ่งเป็นเทอม
    - title: โรงเรียนสอนโต้คลื่น & สถาบันสอนโต้คลื่น
      subtitle: โปรแกรมสอนโต้คลื่นตามชายฝั่ง
      description: โรงเรียนสอนโต้คลื่นที่สอนการโต้คลื่น SUP การพายแบบนอนราบ และทักษะพายคายักโต้คลื่นในสภาพแวดล้อมทะเล อุปกรณ์ต้องรับมือกับสภาพโซนคลื่น — ทนแรงกระแทก ทนทรายและน้ำเค็ม และง่ายต่อการล้าง-คืนระหว่างบทเรียนรายชั่วโมง
      features:
        - รูปทรงเฉพาะการโต้คลื่นพร้อมรางเสริมและโครงสร้างทนแรงกระแทก
        - ตัวเลือกครีบอ่อนและเชือกรัดขดสำหรับความปลอดภัยของนักเรียน
        - ผ้าล้างง่ายแห้งระหว่างหมุนเวียนบทเรียน
        - โปรแกรมเปลี่ยนฝูงพร้อมการตรวจสอบและรีเฟรชเมื่อสิ้นฤดูกาล
    - title: แฟรนไชส์ & เครือข่ายหลายสาขา
      subtitle: อุปกรณ์มาตรฐานในทุกสาขา
      description: ผู้ดำเนินหลายสาขาที่ดำเนินโปรแกรมการฝึกฝนแบบมาตรฐานในหลายเมืองหรือภูมิภาค ความสอดคล้องของฝูงในทุกสาขาเป็นสิ่งสำคัญ — นักเรียนทุกคนควรมีประสบการณ์อุปกรณ์เหมือนกันไม่ว่าจะไปสาขาแฟรนไชส์ใด การสั่งซื้อรวมศูนย์ ความสม่ำเสมอของแบรนด์ และการสนับสนุนการขยายตัวเป็นสิ่งจำเป็น
      features:
        - สเปคฝูงเหมือนกันในทุกสาขาแฟรนไชส์
        - การสั่งซื้อรวมศูนย์พร้อมราคาตามปริมาณ
        - 'ตัวเลือกการร่วมแบรนด์: แบรนด์แฟรนไชส์ + Paddle Board Overstock ร่วมแบรนด์'
        - 'ชุดอุปกรณ์สำหรับตั้งสาขาใหม่: อุปกรณ์ ป้าย และสินค้าคงคลังเริ่มต้น'
cta:
  title: พร้อมที่จะจัดอุปกรณ์ให้โรงเรียนของคุณหรือยัง?
  subtitle: ติดต่อทีมของเราเพื่อแผนอุปกรณ์แบบกำหนดเอง เราทำงานร่วมกับโรงเรียนทุกขนาด
  actions:
    - variant: primary
      text: พูดคุยกับทีมงานของเรา
      href: /contact
    - text: ดูแคตตาล็อกสินค้า
      href: /products
