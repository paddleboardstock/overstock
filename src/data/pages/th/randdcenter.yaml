hero:
  tagline: ศูนย์วิจัยและพัฒนา
  title: ศูนย์วิจัยและพัฒนา
  subtitle: มุ่งเน้นไปที่ความก้าวหน้า
intro:
  - ศูนย์วิจัยและพัฒนา (R&D) ของ Paddle Board Overstock เป็นแรงขับเคลื่อนเบื้องหลังพันธกิจของเราในการปฏิวัติอุปกรณ์กีฬาทางน้ำ เรามอบอำนาจให้กับผู้ที่ชื่นชอบกีฬาทางน้ำทั่วโลกด้วยผลิตภัณฑ์ที่ปลอดภัย สะดวกสบาย และสนุกสนานยิ่งขึ้นผ่านนวัตกรรมที่ไม่หยุดยั้งในบอร์ดพายแบบพอง (SUPs) และเรือ ทีมงานวิศวกร นักออกแบบ และผู้เชี่ยวชาญด้านกีฬาทางน้ำที่มีความหลงใหลของเรากำลังสร้างอนาคตของอุตสาหกรรมอย่างต่อเนื่อง โดยยกระดับมาตรฐานด้านคุณภาพ ประสิทธิภาพ และความยั่งยืน
  - ศูนย์วิจัยและพัฒนาของเรารวมผู้เชี่ยวชาญด้านวัสดุ วิศวกรเรือ และวิศวกรการผลิตไว้ภายใต้หลังคาเดียวกัน ตั้งแต่การจัดสูตรวัสดุและการจำลองตัวเรือไปจนถึงการพัฒนากระบวนการเชื่อมและการทดสอบในทะเลเต็มรูปแบบ ทุกขั้นตอนของการพัฒนาผลิตภัณฑ์ถูกขับเคลื่อนด้วยข้อมูลและตรวจสอบความถูกต้องด้วยการทดสอบ
mission:
  tagline: ภารกิจของเรา
  title: นวัตกรรมเพื่ออนาคตของกีฬาทางน้ำ
  pillars:
    - icon: lightning
      title: ความก้าวหน้าทางเทคโนโลยี
      desc: นำทางวัสดุใหม่ การออกแบบ และการผลิต เพื่อประสิทธิภาพและความทนทานของผลิตภัณฑ์ที่เหนือกว่า
    - icon: design
      title: การออกแบบที่มุ่งเน้นผู้ใช้
      desc: เข้าใจอย่างลึกซึ้งและเกินความต้องการของผู้ใช้ผ่านการออกแบบผลิตภัณฑ์ที่เป็นมิตรต่อร่างกายและใช้งานง่าย
    - icon: globe
      title: แนวทางปฏิบัติที่ยั่งยืน
      desc: การลดรอยเท้าทางสิ่งแวดล้อมของเราด้วยการใช้วัสดุและกระบวนการที่เป็นมิตรกับสิ่งแวดล้อม
    - icon: shield
      title: ความปลอดภัยที่ไม่ประนีประนอม
      desc: การรับรองมาตรฐานความปลอดภัยสูงสุดผ่านการทดสอบและการรับรองอย่างเข้มงวด
pillars:
  - title: ความก้าวหน้าทางเทคโนโลยี
    desc: บุกเบิกวัสดุใหม่ การออกแบบ และกระบวนการผลิต เพื่อมอบประสิทธิภาพผลิตภัณฑ์ที่เหนือกว่าและความคงทนยาวนาน
    icon: tech
  - title: วัสดุขั้นสูง
    desc: การวิจัย PVC, Hypalon, คอมโพสิต และทางเลือกที่ยั่งยืนเพื่อปรับปรุงคุณลักษณะของผลิตภัณฑ์
    icon: materials
  - title: ความยั่งยืน
    desc: 'ความมุ่งมั่นหลัก: เรามุ่งมั่นต่อการดูแลสิ่งแวดล้อมผ่านการผลิตอย่างยั่งยืนและการใช้วัสดุรีไซเคิล'
    icon: sustainability
capabilities:
  tagline: ความสามารถ
  title: ความสามารถด้านวิจัยและพัฒนา
  subtitle: สี่สาขาหลักที่ให้การควบคุมการพัฒนาผลิตภัณฑ์ตั้งแต่ต้นจนจบ — ตั้งแต่การวิจัยวัตถุดิบจนถึงการรับรองขั้นสุดท้าย
  groups:
    - title: วิทยาศาสตร์วัสดุและเทคโนโลยีผ้า
      items:
        - การวิเคราะห์และปรับแต่งสูตรของ PVC และ Hypalon
        - UV การพัฒนาสารเติมแต่งเพื่อความคงตัว ความต้านไฟ และต้านจุลชีพ
        - วิศวกรรมการเคลือบและยึดติดผ้าหลายชั้น
        - การทดสอบการเสื่อมสภาพอย่างเร่ง (UV, ความร้อน, ความชื้น, สเปรย์เกลือ)
    - title: วิศวกรรมตัวเรือและอุทกพลศาสตร์
      items:
        - การออกแบบตัวเรือ 3 มิติแบบพารามิเตอร์และการปรับแต่ง CFD
        - การวิเคราะห์ด้วยวิธีองค์ประกอบจำกัดสำหรับโครงสร้างและแรงกระแทก
        - การทดสอบแทงก์ลากแบบจำลองสเกลและการตรวจสอบประสิทธิภาพ
        - การพัฒนาตัวเรือเฉพาะทางสำหรับภารกิจพิเศษ
    - title: เทคโนโลยีการเชื่อมและการต่อ
      items:
        - การพัฒนาและปรับแต่งกระบวนการเชื่อมด้วยไฟฟ้าไดอิเล็กทริก RF
        - วิธีการเชื่อมด้วยอากาศร้อน แทรกแหวนร้อน และอัลตราโซนิก
        - การประเมินคุณสมบัติการยึดติดด้วยกาวและเทปรอยต่อ
        - การสร้างแบบจำลองความแข็งแรงของรอยเชื่อมและการทำนายอายุการใช้งาน
    - title: การทดสอบ การรับรอง และความสอดคล้อง
      items:
        - การจัดการคุณภาพและการทดสอบการปฏิบัติตาม CE
        - การสนับสนุนการทดสอบและการรับรองโดยบุคคลที่สามอิสระ
        - การพัฒนากระบวนการทดสอบตามมาตรฐานเฉพาะสำหรับการผ่านคุณสมบัติการจัดซื้อ
        - การวิเคราะห์ความล้มเหลวระหว่างการใช้งานและการสอบสวนหาสาเหตุรากเหง้า
