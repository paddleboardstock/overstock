rd_services:
  tagline: การวิจัยและพัฒนาตามสั่ง
  title: บริการวิจัยและพัฒนาสำหรับพันธมิตร
  services:
    - title: การพัฒนาวัสดุที่กำหนดเอง
      desc: เราพัฒนาสูตรผ้าพิเศษ การวางชั้นลามิเนต และระบบกาวที่ปรับให้เหมาะกับสภาพแวดล้อมการทำงานและเป้าหมายประสิทธิภาพของคุณ
    - title: OEM / ODM วิศวกรรมผลิตภัณฑ์
      desc: ตั้งแต่ภาพร่างแนวคิดไปจนถึงแพ็กเกจวิศวกรรมที่พร้อมผลิต — ทีมงานของเราสามารถออกแบบ สร้างต้นแบบ และตรวจสอบความถูกต้องของเรือตามแบรนด์ของคุณ
    - title: การทดสอบและการรับรองโดยบุคคลที่สาม
      desc: ใช้สถานทดสอบที่เป็นไปตามมาตรฐาน ISO ของเราสำหรับการทดสอบวัสดุอย่างอิสระ การตรวจสอบความถูกต้องของผลิตภัณฑ์ และการสนับสนุนการรับรอง
  cta: พูดคุยเกี่ยวกับข้อกำหนดด้านการวิจัยและพัฒนา →
  cta_link: /contact
vision:
  tagline: วิสัยทัศน์ของเรา
  title: การกําหนดอนาคตของกีฬาทางน้ํา
  body: Paddle Board Overstock มุ่งมั่นที่จะเป็นผู้นําอุตสาหกรรมเรือเป่าลมSUPและอุตสาหกรรมด้วยนวัตกรรมอย่างต่อเนื่อง คุณภาพที่มั่นคง และความมุ่งมั่นในความปลอดภัยและความยั่งยืน — ซึ่งท้ายที่สุดจะเติมเต็มประสบการณ์ของผู้ที่ชื่นชอบกีฬาทางน้ําทั่วโลกPaddle Board Overstockศูนย์วิจัยและพัฒนาคือที่ที่ความหลงใหลพบกับนวัตกรรม กําหนดมาตรฐานใหม่ให้กับอุตสาหกรรมกีฬาทางน้ํา
labs_section:
  tagline: ห้องปฏิบัติการ
  title: ห้องปฏิบัติการของเรา
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: PVC ห้องปฏิบัติการผ้า
      description: การวิจัยและทดสอบPVC Hypalon อย่างต่อเนื่องเกี่ยวกับผ้าท่อเพื่อความแข็งแรงต่อแรงดึง UV ความต้านทาน การขีดข่วน และความยืดหยุ่นในอุณหภูมิต่ํา เพื่อให้มั่นใจในความน่าเชื่อถือระยะยาวในสภาพแวดล้อมทางทะเล
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: สตูดิโอวิศวกรรมฮัลล์
      description: การออกแบบที่ขับเคลื่อนด้วย CAD และการวิเคราะห์องค์ประกอบจํากัดของตัวถัง HDPE อะลูมิเนียม และไฟเบอร์กลาสตัวถังทุกชิ้นจะถูกจําลองแบบดิจิทัลเพื่อการกระจายแรงและความต้านทานแรงกระแทกก่อนสร้างต้นแบบแรก
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: ศูนย์เชื่อม RF
      description: โรงงานเชื่อมด้วยคลื่นวิทยุโดยเฉพาะ พร้อมการควบคุมอุณหภูมิและความดันอย่างแม่นยํา ผลิตรอยต่อที่มีความแข็งแรงสูงและปิดสนิท ซึ่งเป็นไปตามมาตรฐานอุตสาหกรรมทางทะเลสําหรับเรือเป่าลม
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: ถังทดสอบไฮโดรไดนามิก
      description: การทดสอบแบบจําลองขนาดย่อในถังทดสอบภายในของเราเพื่อเพิ่มประสิทธิภาพรูปทรงตัวเรือ ประสิทธิภาพการไสร ความมั่นคง และประสิทธิภาพการใช้เชื้อเพลิงในสภาวะบรรทุกและทะเลที่หลากหลาย
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: เวิร์กช็อปต้นแบบ
      description: ศูนย์ต้นแบบและติดตั้งอุปกรณ์ขนาดเต็มที่สร้าง ติดตั้ง และทดลองโมเดลใหม่ในทะเลต้นแบบทุกชิ้นต้องผ่านโปรแกรมทดสอบในน้ําอย่างน้อย 20 ชั่วโมงก่อนได้รับอนุมัติการผลิต
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: ห้องปฏิบัติการคุณภาพและการตรวจสอบ
      description: ห้องปฏิบัติการประกันคุณภาพเฉพาะทางที่ทําการทดสอบแรงดึง การหมุนเวียนการเก็บอากาศ การทดสอบรอยต่อ และการรับรองวัสดุ เพื่อให้มั่นใจว่าเรือทุกลําที่ออกจากเวิร์กช็อปเป็นไปตามข้อกําหนดที่เผยแพร่ไว้
      href: /randdcenter/quality-inspection-lab
