hero:
  tagline: ขายส่งโมเดลผสม
  title: บอร์ดพายขายส่งรุ่นผสม —<br />ผสมรุ่นต่าง ๆ SUP ในคําสั่งซื้อเดียว
  subtitle: ทําไมต้องผูกงบประมาณไว้กับรุ่นเดียว?รวมบอร์ดที่มีในสต็อก SUP — รุ่นออลอะดิ้ง, ทัวร์, เซิร์ฟ และอาร์ต — ในคําสั่งซื้อขายส่งครั้งเดียว โดยมีจํานวนบอร์ดต่ําสุดเพียง 5 ชุด
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: สั่งซื้อบอร์ดเป่าลมหลากหลาย SUP รุ่นจาก Paddle Board Overstock
direct_answer: แบบขายส่งแบบผสมช่วยให้ผู้ค้าปลีกขนาดเล็กสามารถสั่งซื้อ SUP หลายรุ่นในการจัดส่งรวมครั้งเดียว แทนที่จะต้องสั่งซื้อจํานวนมากในบอร์ดเดียวที่ Paddle Board Overstock, รุ่นที่มีในสต็อกสามารถรวมกันได้ โดยขั้นต่ําในการสั่งซื้อคือ 5 บอร์ดทั้งหมด และจํานวนรวมจะกําหนดระดับราคาคําสั่งซื้อผสมจะจัดส่งจากเว่ยไห่ ประเทศจีน โดยขนส่งทางอากาศด่วน (1–3 บอร์ด) หรือขนส่งทางทะเลรวม (5–20 บอร์ด) ไปยัง 50+ ประเทศ และทุกบอร์ดจะได้รับการทดสอบแรงดัน 100% และครอบคลุมการรับประกัน 2 ปีSUP
tldr_points:
  - ผสมรุ่นที่มีสินค้าในสต็อก SUP ในคําสั่งซื้อเดียว — ไม่มีขั้นต่ําต่อรุ่น
  - ปริมาณการสั่งซื้อรวม (ไม่ใช่จํานวนต่อรุ่น) จะกําหนดระดับราคาของคุณ
  - เริ่มต้นที่ 5 บอร์ดทั้งหมด — สร้างมาสําหรับร้านค้าปลีกขนาดเล็ก ไม่ใช่สําหรับตู้คอนเทนเนอร์
  - 'การจัดส่งรวมหนึ่งครั้ง: ค่าขนส่งหนึ่งครั้ง พิธีการศุลกากรหนึ่งครั้ง การจัดส่งหนึ่งครั้ง'
why_mixed:
  tagline: ทําไมต้องผสม?
  title: ผสมผสานและจับคู่ซื้อสินค้าหลากหลายมากขึ้นใช้จ่ายน้อยลง
  subtitle: ชั้นวางกระดานที่เหมือนกันใช้สําหรับนักพายประเภทหนึ่งการสั่งซื้อแบบผสมจะเปลี่ยนงบประมาณเดียวกันให้กลายเป็นสินค้าครบชุด
  items:
    - title: ความหลากหลายมากขึ้นบนชั้นวางของคุณ
      description: รวมบอร์ดอเนกประสงค์สําหรับมือใหม่ บอร์ดทัวร์สําหรับนักผจญภัย และบอร์ดสไตล์เซิร์ฟสําหรับนักสเก็ตบอร์ด — คําสั่งซื้อเดียวครอบคลุมทุกกลุ่มลูกค้าของคุณ
    - title: ความเสี่ยงต่อรุ่นที่ต่ําลง
      description: แทนที่จะเดิมพันฤดูกาลของคุณกับรุ่นเดียว ให้สั่งซื้อ 2–4 รุ่นของแต่ละรุ่นถ้ารุ่นหนึ่งขายดีกว่ารุ่นอื่น ให้เติมสต็อกในคําสั่งซื้อถัดไปด้วยข้อมูลยอดขายจริง
    - title: ทดสอบสิ่งที่ขายในตลาดของคุณ
      description: แต่ละชายหาด ทะเลสาบ และเมืองมีความต้องการที่แตกต่างกันคําสั่งซื้อแรกแบบผสมเป็นวิธีวิจัยตลาดที่ถูกที่สุด — สต็อกหกรุ่น ดูว่ารุ่นไหนขายได้
    - title: ขอบกระดาษที่ดีกว่าในฉบับศิลปะ
      description: บอร์ดซีรีส์ศิลปะระดับพรีเมียม (Leviathan Wake, Medusa Glow, Ocean Voyager) มีราคาขายปลีกสูงกว่าผสมบอร์ดหลายตัวเข้าด้วยกันเป็นฐานบอร์ดรอบด้านเพื่อเพิ่มกําไรเฉลี่ยของคุณ
    - title: การจัดส่งรวมหนึ่งครั้ง
      description: คําสั่งซื้อผสมหนึ่งครั้งหมายถึงการจองสินค้าหนึ่งครั้ง พิธีการศุลกากรหนึ่งครั้ง และการจัดส่งหนึ่งครั้ง — แทนที่จะเป็นการจัดส่งแยกกันห้าครั้งจากซัพพลายเออร์ห้าราย
how_it_works:
  tagline: มันทำงานอย่างไร
  title: วิธีการทํางานของลําดับโมเดลผสม
  steps:
    - title: เลือกส่วนผสมของคุณ
      description: เลือกรุ่นและจํานวนสําหรับตลาดของคุณ — หรือใช้ตัวเลือกด้านล่างเพื่อร่างชุดรวมและดูจํานวนบอร์ดและมูลค่ารวมอัปเดตสด
    - title: ขอใบเสนอราคา
      description: ส่งข้อมูลผสมมาให้เราเรายืนยันสต็อกปัจจุบันสําหรับทุกรุ่นและราคาต่อหน่วย รวมถึงตัวเลือกขนส่งด่วนและทางทะเลไปยังประเทศของคุณ
    - title: ยืนยันคําสั่งซื้อ
      description: อนุมัติใบเสนอราคาสุดท้าย — รุ่นสินค้า, จำนวน, ค่าขนส่ง, ยอดรวม เราจะล็อกสต็อกและกำหนดตารางการจัดส่งจากเว่ยไห่
    - title: เราทดสอบทุกบอร์ด
      description: บอร์ดแต่ละชิ้นในคำสั่งผสมของคุณถูกทดสอบความดัน 100% ที่ 15 PSI ก่อนบรรจุ — มาตรฐานเดียวกันสำหรับทุกโมเดล ไม่ว่าจะเป็นรุ่นเริ่มต้นสำหรับทุกการใช้งานหรือรุ่นศิลปะ
    - title: การจัดส่งหนึ่งครั้งถึงประตูบ้านของคุณ
      description: คำสั่งซื้อแบบผสมทั้งหมดจัดส่งพร้อมกัน — ส่งทางอากาศด่วนสำหรับคำสั่งซื้อขนาดเล็ก, ขนส่งทางเรือรวมสำหรับ 5–20 แผง — พร้อมระบบติดตามจากประตูถึงประตู
