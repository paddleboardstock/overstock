who_benefits:
  tagline: ใครที่จะได้รับประโยชน์
  title: ใครที่โมเดลผสมแบบขายส่งเหมาะสำหรับ
  items:
    - title: ผู้นำเข้าครั้งแรก
      description: ทดลองหมวดหมู่ SUP ด้วยการกระจายหลายรุ่นแทนที่จะยึดเพียงรุ่นเดียว SKU จำนวนมาก
    - title: ร้านค้าชายหาดตามฤดูกาล
      description: ร้านค้าที่ต้องการบอร์ดสำหรับผู้เริ่มต้นสำหรับนักท่องเที่ยว และรุ่นพรีเมียมสำหรับคนท้องถิ่น — ในการสั่งเติมสต็อกครั้งเดียว
    - title: ผู้ขายออนไลน์
      description: ลงรายการหลายรุ่นพร้อมกันเพื่อเรียนรู้ว่าภาพลักษณ์ ความยาว และการใช้งานแบบใดขายดีที่สุด
    - title: รถเช่าและโรงเรียน
      description: กองเรือที่ต้องการบอร์ดขนาดต่างๆ สำหรับน้ำหนักผู้ขี่และประเภทบทเรียนต่างๆ ไม่ใช่กองเรือแบบสเป็คเดียว
faq_section:
  title: คำถามที่พบบ่อยเกี่ยวกับโมเดลผสม
  items:
    - q: ต้องสั่งขั้นต่ำต่อรุ่นหรือไม่?
      a: ไม่ ขั้นต่ำ 5 บอร์ดใช้กับคำสั่งซื้อทั้งหมด ไม่ใช่แต่ละรุ่น คุณสามารถสั่ง 5 รุ่นที่แตกต่างกัน รุ่นละบอร์ดก็ได้
    - q: การผสมรุ่นจะเปลี่ยนราคาไหม?
      a: ราคาหน่วยขายส่งอ้างอิงต่อรุ่น แต่ระดับราคาของคุณจะดีขึ้นตามจำนวนบอร์ดรวม — การผสมรุ่นไม่ทำให้คุณถูกลงโทษ
    - q: สามารถผสมบอร์ดกับอุปกรณ์เสริมได้ไหม?
      a: ได้ — สามารถเพิ่มไม้พายสำรอง ปั๊ม และชุดซ่อมเข้าไปในการสั่งผสม ถามในคำร้องของคุณ
    - q: ฉันจะรู้ได้อย่างไรว่ารุ่นไหนเหมาะกับตลาดของฉัน?
      a: ส่งโน้ตเกี่ยวกับลูกค้าของคุณ (ชายฝั่งหรือติดใน, นักท่องเที่ยวหรือคนท้องถิ่น, ผู้เริ่มต้นหรือผู้ขี่) ในแบบฟอร์มคำร้อง และเราจะแนะนำการผสมให้
cta:
  title: สร้างการผสมของคุณวันนี้
  subtitle: ใช้ตัวเลือกด้านบน แล้วส่งการผสมไปยังทีมของเรา — คุณจะได้รับใบเสนอราคาพร้อมการยืนยันสต็อกและตัวเลือกค่าขนส่ง
  actions:
    - variant: primary
      text: ขอใบเสนอราคาขายส่ง
      href: /wholesale-paddle-boards#inquiry
    - text: ดูบอร์ดทั้งหมดที่มี
