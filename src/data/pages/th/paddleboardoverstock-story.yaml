      - label: กำลังการผลิตประจำปี
        value: 15,000
  quality:
    title: ความมุ่งมั่นด้านคุณภาพ
    body: ตั้งแต่การตรวจสอบวัสดุไปจนถึงการทดสอบสุดท้าย Paddle Board Overstock รักษากระบวนการคุณภาพอย่างเป็นระบบเพื่อส่งมอบผลิตภัณฑ์ทางทะเลที่เชื่อถือได้ ทุกหน่วยถูกทดสอบความดัน ตรวจสอบรอยต่อ และยืนยันประสิทธิภาพก่อนจัดส่ง
    items:
      - อัตราการจัดส่งสินค้าไม่มีตำหนิ 99.3%
      - ทดสอบแรงดัน 100% ที่ 1.25 เท่าของค่าที่ระบุ
      - รับประกัน 2 ปีสำหรับทุกกระดาน
  global:
    title: การมีตัวตนทั่วโลก
    body: ส่งตรงถึงผู้พายเรือใน 50 ประเทศทั่วยุโรป เอเชียแปซิฟิก อเมริกา ตะวันออกกลาง และแอฟริกา
comparison:
  tagline: การวางตำแหน่งแบรนด์
  title: Paddle Board Overstock ในตลาด
  position: แบรนด์ส่งตรงจากโรงงาน ผสมผสานวิศวกรรมกระดานเป่าลมกับการผลิตภายในและประสบการณ์การผลิต 12 ปี
  strengths:
    - ความเชี่ยวชาญด้านวิศวกรรมกระดานเป่าลม
    - ราคาส่งตรงจากโรงงานโดยไม่มีมาร์กร้านค้า
    - ชุดครบครัน — กระดาน ปั๊ม ไม้พาย และอุปกรณ์ในกล่องเดียว
    - โรงงานผลิตขนาด 12,000 ตารางเมตรใน Weihai
  bestFor:
    - ผู้พายเรือที่ต้องการราคาส่งตรงจากโรงงานโดยไม่ลดคุณภาพ
    - ครอบครัวและผู้เริ่มต้นที่ค้นพบการพายยืน
    - ผู้พายเรือเพื่อท่องเที่ยว โยคะ และออกกำลังกายที่ต้องการแพลตฟอร์มเฉพาะทาง
    - กองเรือเช่าและชมรมที่ต้องการกระดานที่ทนทานและดูแลรักษาง่าย
