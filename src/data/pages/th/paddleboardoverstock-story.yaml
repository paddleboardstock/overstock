timeline:
  - year: '2012'
    title: รากฐานการผลิตทางทะเล
    body: Paddle Board Overstock เริ่มต้นเป็นเวิร์กช็อปบอร์ดพายลมเฉพาะทางใน Weihai ประเทศจีน มุ่งมั่นในงานฝีมือทางทะเลและการผลิตบอร์ด จุดสนใจในช่วงแรกคือการสร้างผลิตภัณฑ์ลมที่เชื่อถือได้ผ่านประสบการณ์วิศวกรรมปฏิบัติและวินัยในการผลิต
  - year: '2015'
    title: การส่งออกครั้งแรก
    body: คำสั่งซื้อส่งออกเริ่มแรกไปยังประเทศญี่ปุ่นและเกาหลี ทำให้ Paddle Board Overstock เข้าสู่ตลาดระหว่างประเทศ บริษัทเริ่มให้บริการนักพายและผู้ที่ชื่นชอบกีฬาทางน้ำนอกประเทศจีน
  - year: '2018'
    title: การขยายโรงงาน
    body: ย้ายไปยังโรงงานผลิตขนาด 12,000 ตารางเมตร เพิ่มสายการเชื่อม RF และความสามารถในการผลิต drop-stitch ทำให้สามารถผลิตในระดับใหญ่ขึ้นและปรับปรุงระบบควบคุมคุณภาพ
  - year: '2020'
    title: การก่อตั้งศูนย์ R&D
    body: เปิดศูนย์ R&D เฉพาะทางพร้อมห้องทดลองวัสดุ PVC ถังทดสอบไฮโดรไดนามิก และสตูดิโอจำลอง CAD/FEA การพัฒนาผลิตภัณฑ์ขยายไปให้ความสำคัญกับการสร้างน้ำหนักเบา ความทนทานที่ดีขึ้น และการออกแบบที่เน้นผู้ใช้
  - year: '2022'
    title: การเติบโตในระดับโลก
    body: ขยายทีมวิจัยและพัฒนาจนมีวิศวกร 14 คน และพนักงาน 200+ คน บอร์ดถูกส่งถึงนักพายทั่วยุโรป อเมริกา และเอเชียแปซิฟิก ส่งไปถึง 50+ ประเทศ
  - year: '2024'
    title: นวัตกรรม & สตูดิโอออกแบบ
    body: เปิดตัวสตูดิโอออกแบบและนวัตกรรมครบวงจรสำหรับชุดบอร์ดใหม่ ตั้งแต่แนวคิดจนถึงการผลิต ขยายชุดบอร์ดศิลปะซิกเนเจอร์ของเราและแพลตฟอร์มทัวริ่ง
  - year: '2026'
    title: สร้างอนาคตของการสำรวจทางน้ำ
    body: ในปัจจุบัน Paddle Board Overstock ยังคงพัฒนาบอร์ดลม SUP อุปกรณ์พาย และโซลูชันทางทะเลที่ปรับแต่งตามความต้องการ — เชื่อมผู้คนและองค์กรเข้ากับแหล่งน้ำทั่วโลก ให้บริการใน 50+ ประเทศ กำลังผลิตต่อปี 15,000 หน่วย
content_founding:
  tagline: จุดเริ่มต้น
  title: เกิดในชายฝั่งน้ำ
  subtitle: 'Paddle Board Overstock เริ่มต้นในเวิร์กช็อปริมชายฝั่งใน Weihai ด้วยบอร์ดเพียงหนึ่งตัวและวิสัยทัศน์: สร้างบอร์ดพายลมที่สามารถรับมือกับสภาพทะเลจริง'
  paragraphs:
    - ในปี 2012 ผู้ก่อตั้งของเราเห็นช่องว่างในตลาด — บอร์ดลมส่วนใหญ่หรือราคาประหยัดแต่ไม่น่าเชื่อถือ หรือคุณภาพสูงแต่ราคาแพงเกินไป พวกเขาเชื่อว่ามีพื้นที่สำหรับผู้ผลิตที่สามารถส่งมอบทั้งคุณภาพและความคุ้มค่า
    - ตัวเรือลําแรกถูกสร้างด้วยมือ ทดสอบในน่านน้ําท้องถิ่น และปรับปรุงตามข้อเสนอแนะจริงจากชาวประมงและผู้ประกอบการเชิงพาณิชย์ขนาดเล็กวงจรป้อนกลับนี้ — สร้าง ทดสอบ ฟัง ปรับปรุง — ยังคงเป็นหัวใจของปรัชญาวิศวกรรมของเราจนถึงทุกวันนี้
    - ภายในปี 2015 ข่าวได้แพร่ออกไปไกลเกินกว่าเมืองเว่ยไห่ นักพายเรือและร้านอุปกรณ์กีฬาทางน้ำทั่วเอเชียเริ่มขอซื้อบอร์ด สิ่งที่เริ่มต้นจากเวิร์กช็อปท้องถิ่นกำลังกลายเป็นแบรนด์ระดับโลก
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock เวิร์กช็อปการผลิตและการผลิตในช่วงแรก
content_growth:
  tagline: การเติบโตและนวัตกรรม
  title: จากเวิร์กช็อปสู่พื้นที่ 12,000 ตารางเมตร
  subtitle: การลงทุนอย่างต่อเนื่องในบุคลากร อุปกรณ์ และกระบวนการ ได้เปลี่ยน Paddle Board Overstock ให้กลายเป็นสถานที่ผลิตสินค้าทางทะเลที่ทันสมัย
  paragraphs:
    - เมื่อความต้องการเพิ่มขึ้น โรงงานของเราก็ขยายตามไปด้วย เราขยายจากเวิร์กช็อปขนาดเล็กไปสู่โรงงานขนาด 12,000 ตารางเมตร ที่มีสายการผลิตเฉพาะสำหรับบอร์ด SUP, อุปกรณ์เสริม, และอุปกรณ์ความปลอดภัย
    - เราลงทุนในCNCเครื่องตัด อุปกรณ์เชื่อมความถี่สูง สายการผลิตแบบดรอปสติช และแท่นทดสอบที่ครอบคลุม — ทําให้เราสามารถควบคุมทุกด้านของคุณภาพการผลิตได้
    - วันนี้ ทีมของเราซึ่งมีจำนวน 200-300 คน ประกอบด้วย วิศวกรทางทะเล นักวิทยาศาสตร์วัสดุ ผู้เชี่ยวชาญด้านควบคุมคุณภาพ และช่างฝีมือที่มีความชำนาญ — หลายคนอยู่กับ Paddle Board Overstock ตั้งแต่สมัยเริ่มต้น
founder:
  tagline: พบกับผู้ก่อตั้ง
  title: สร้างโดยคนงานน้ํา
  subtitle: ผู้ก่อตั้ง David Chen ผสมผสานความเชี่ยวชาญด้านการผลิตเข้ากับความหลงใหลตลอดชีวิตในกีฬาทางน้ำ — การผสมผสานนี้เป็นสิ่งที่กำหนดแนวทางที่ Paddle Board Overstock ใช้ในการพัฒนาผลิตภัณฑ์
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — ผู้ก่อตั้ง Paddle Board Overstock
  story:
    - เดวิด เฉิน เติบโตขึ้นริมชายฝั่งเว่ยไห่ ซึ่งทะเลไม่ใช่จุดหมายในการพักผ่อน แต่เป็นวิถีชีวิต เขาใช้เวลาวัยเยาว์พายเรือ, แล่นเรือใบ, และตกปลาในทะเลเหลือง — ประสบการณ์เหล่านี้ทำให้เขามีความเข้าใจโดยสัญชาตญาณว่าบอร์ดพายต้องทนทานต่ออะไรบ้าง
    - ก่อนก่อตั้ง Paddle Board Overstock เดวิดใช้เวลาทศวรรษในอุตสาหกรรมการผลิตทางทะเล ทำงานด้านการผลิต คุณภาพ และการค้าระหว่างประเทศ เขานำโครงการการผลิตและคุณภาพสำหรับตลาดยุโรปและอเมริกาเหนือ เรียนรู้ถึงความคาดหวังของนักพายระดับโลกโดยตรง
    - 'ในปี 2012 เขาก่อตั้ง Paddle Board Overstock ด้วยภารกิจง่าย ๆ: สร้างบอร์ดพายลมที่เขาจะไว้วางใจให้กับครอบครัวของเขาบนผิวน้ำ มาตรฐานส่วนบุคคลนี้ — ฉันจะใช้สิ่งนี้ไหม? — ยังคงเป็นการทดสอบสุดท้ายสำหรับทุกผลิตภัณฑ์ที่ออกจากโรงงาน'
    - วันนี้ David นำกลยุทธ์ผลิตภัณฑ์และดูแลทีมวิจัยและพัฒนา โดยตรวจสอบการออกแบบใหม่และทดสอบต้นแบบด้วยตัวเองบนผิวน้ำใกล้ Weihai เขาเชื่อว่าผลิตภัณฑ์ที่ยอดเยี่ยมเกิดจากความเข้าใจทั้งด้านวิศวกรรมและประสบการณ์
philosophy:
  tagline: ปรัชญาแบรนด์
  title: เสรีภาพทางวิศวกรรมบนผิวน้ํา
  body: อิสรภาพบนผิวน้ําไม่ได้หมายถึงแค่การเคลื่อนไหวเท่านั้นมันหมายถึงการค้นพบสถานที่ใหม่ ๆ การสร้างประสบการณ์กลางแจ้ง เชื่อมโยงผู้คนกับธรรมชาติ และสนับสนุนภารกิจมืออาชีพวิศวกรรมทําให้อิสรภาพนั้นเป็นไปได้
  pillars:
    - title: ความน่าเชื่อถือมาก่อน
      body: สภาพแวดล้อมทางน้ำต้องการความไว้วางใจ ผลิตภัณฑ์ Paddle Board Overstock ถูกออกแบบโดยคำนึงถึงความมั่นคง ความทนทาน ความปลอดภัย และประสิทธิภาพที่สม่ำเสมอ
    - title: การออกแบบที่เน้นมนุษย์เป็นศูนย์กลาง
      body: ผลิตภัณฑ์ควรให้ประโยชน์แก่ผู้คน ไม่ใช่เทคโนโลยี การตัดสินใจในการออกแบบทุกอย่างเริ่มต้นจากการเข้าใจว่าผู้คนใช้บอร์ดของพวกเขาอย่างไร พวกเขาสำรวจที่ไหน และพวกเขาเผชิญความท้าทายอะไร
    - title: การสํารวจที่เข้าถึงได้
      body: น้ำไม่ใช่ของผู้เชี่ยวชาญเท่านั้น Paddle Board Overstock สร้างอุปกรณ์ที่เปิดโอกาสให้ผู้คนมากขึ้นได้สัมผัสประสบการณ์แม่น้ำ ทะเลสาบ มหาสมุทร และพื้นที่ชายฝั่งอย่างปลอดภัย
    - title: นวัตกรรมอย่างต่อเนื่อง
      body: นวัตกรรมไม่ได้หมายถึงแค่การสร้างผลิตภัณฑ์ใหม่แต่เป็นการปรับปรุงทุกรายละเอียด — วัสดุ โครงสร้าง การผลิต และประสบการณ์ผู้ใช้
engineeringDna:
  tagline: ดีเอ็นเอวิศวกรรม
  title: วิธีที่ Paddle Board Overstock สร้างผลิตภัณฑ์
  areas:
    - title: วิทยาศาสตร์วัสดุ
      body: Paddle Board Overstock มุ่งเน้นไปที่การเลือกวัสดุที่เหมาะสมสำหรับสภาพแวดล้อมทางทะเลที่แตกต่างกัน ปัจจัยสำคัญที่ต้องพิจารณาได้แก่ ความต้านทานการสึกหรอ, ความต้านทาน UV, ความมั่นคงต่อแรงดัน และความทนทานในระยะยาว
      items:
        - ความทนทานต่อการขีดข่วน
        - UV การต้านทาน
        - ความมั่นคงต่อแรงดัน
        - ความทนทานในระยะยาว
    - title: วิศวกรรมโครงสร้าง
      body: กระดานพายแบบเป่าลมต้องการความสมดุลที่แม่นยำระหว่างความแข็ง น้ำหนัก ความสะดวกในการพกพา และความมั่นคง Paddle Board Overstock วิศวกรรมมุ่งเน้นการปรับปรุงปัจจัยเหล่านี้ผ่านเทคโนโลยีแกนหลัก drop-stitch และการเย็บตะเข็บขั้นสูง
      items:
        - ความแข็งแรง
        - การปรับน้ำหนัก
        - การพกพา
        - ความมั่นคง
    - title: ความแม่นยำในการผลิต
      body: 'แต่ละผลิตภัณฑ์ผ่านกระบวนการควบคุม: การเตรียมวัสดุ, การตัดแม่นยำ, การเชื่อมและการยึดติด, การประกอบ, การตรวจสอบคุณภาพ, และการยืนยันประสิทธิภาพ'
      items:
        - การเตรียมวัสดุ
        - การตัดแม่นยำ
        - การเชื่อม & การยึดติด
        - การประกอบ & QC
    - title: วิศวกรรมสถานการณ์ผู้ใช้
      body: ผลิตภัณฑ์พัฒนาขึ้นโดยรอบการพายจริง — เพื่อการพักผ่อน ผจญภัย ครอบครัว และท่องเที่ยว — เพื่อให้แน่ใจว่าการออกแบบแต่ละแบบตอบสนองต่อความต้องการเฉพาะของสภาพแวดล้อมที่ตั้งใจ
      items:
        - สันทนาการ
        - การผจญภัย
        - ตระกูล
        - ท่องเที่ยว
trustSignals:
  tagline: สัญญาณความน่าเชื่อถือ
  title: ทำไม Paddle Board Overstock จึงเป็นแบรนด์ที่คุณวางใจได้
  manufacturing:
    title: ความสามารถในการผลิต
