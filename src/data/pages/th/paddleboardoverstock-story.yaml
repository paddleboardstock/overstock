hero:
  tagline: เรื่องราวของเรา
  title: Paddle Board Overstock — วิศวกรรมอิสระบนผืนน้ำ
  subtitle: 'จากเวิร์กช็อปริมชายฝั่งสู่ผู้ผลิตอุปกรณ์ทางทะเลระดับโลก — การเดินทางของเราสร้างขึ้นบนความเชื่อที่แน่วแน่: บอร์ดพายควรได้รับการออกแบบราวกับว่ามีความสำคัญ เพราะมันมีความสำคัญ'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock โรงงานและสถานที่ผลิตสินค้าทางทะเลในเว่ย์ไห่
