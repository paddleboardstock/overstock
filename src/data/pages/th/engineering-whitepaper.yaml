hero:
  tagline: เอกสารไวท์เปเปอร์ด้านวิศวกรรม
  title: Drop-Stitch เทคโนโลยีและวิทยาศาสตร์วัสดุ:<br />วิศวกรรมเบื้องหลังเรือเป่าลมสมัยใหม่
  subtitle: เอกสารอ้างอิงทางเทคนิคที่เชื่อถือได้ครอบคลุมdrop-stitchการสร้างแกนกลาง PVC การHypalonเปรียบเทียบกับวัสดุ การทดสอบความแข็งแรงของถังแรงดันสูง และมาตรฐานการผลิตเรือ
  image:
    src: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-design-discussion-lab.webp
    alt: Aquafarer ห้องปฏิบัติการวิจัยและพัฒนา — การทดสอบวัสดุและวิศวกรรม
direct_answer: Drop-stitch เทคโนโลยีใช้เส้นด้ายโพลีเอสเตอร์ภายในนับพันเส้นที่เชื่อมชั้นบนและล่างของแกนเป่าลมเมื่อเป่าลมถึง 15–20 PSIเส้นด้ายเหล่านี้จะทําหน้าที่เป็นสมาชิกแรงดึง ป้องกันการโป่งและสร้างโครงสร้างที่แข็งแรงคล้ายกับโครงสร้างเปลือกแข็งเมื่อรวมกับPVC Hypalon การเคลือบผ้าขั้นสูงและการเชื่อม RF ทําให้เรือเป่าลมสมรรถนะสูงพกพาได้ เหมาะสําหรับการใช้งานมืออาชีพ เชิงพาณิชย์ และพักผ่อน
section_drop_stitch:
  title: Drop-Stitch วิศวกรรมโครงสร้าง
  subtitle: วิธีที่เส้นด้ายนับพันเปลี่ยนผ้าที่ยืดหยุ่นให้กลายเป็นโครงสร้างที่แข็งแรง
  content: |
    Drop-stitch (หรือที่รู้จักกันในชื่อ "drop-stitchผ้า" หรือ "drop-stitchแกน") ถือเป็นความก้าวหน้าในวิศวกรรมโครงสร้างเป่าลมหลักการนั้นดูเรียบง่ายอย่างหลอกลวง: เส้นด้ายโพลีเอสเตอร์หลายพันเส้นถูกถักทอพร้อมกันเป็นสองชั้นของผ้าฐาน เชื่อมต่อแผงบนและล่างในมุม 90 องศา

    เมื่อห้องปิดสนิทถูกอัดแรงดัน แรงดันอากาศภายในจะออกแรงเท่า ๆ กันในทุกทิศทาง — พยายามดันแผงด้านบนและล่างให้เป็นทรงกระบอกเกลียวนับพันเส้นจะdrop-stitchต้านทานการแยกนี้ โดยถ่ายโอนแรงดึงไปตามแกนเกลียวผลลัพธ์คือแผงที่แบนและแข็งแรง สามารถทนต่อPSIแรงดันภายในได้ 15–20

    ที่ขนาด 20 PSIเมตร แผงขนาด 1 ตารางเมตร drop-stitch จะได้รับแรงภายในรวมประมาณ 14,000 กิโลกรัม — แต่โครงเกลียวยังคงยึดให้เรียบอย่างสมบูรณ์แบบสิ่งนี้ทําให้drop-stitchโครงสร้างมีอัตราส่วนความแข็งแรงต่อน้ําหนักที่เทียบเท่ากับวัสดุแข็งแบบดั้งเดิม
section_materials:
  title: PVC vs Hypalon — การเปรียบเทียบวัสดุทางเทคนิค
  subtitle: ข้อมูลวัตถุประสงค์สําหรับการคัดเลือกวัสดุอย่างมีข้อมูลในการผลิตเรือเป่าลม
  table:
    columns:
      - header: ทรัพย์สิน
      - header: PVC (โพลีไวนิลคลอไรด์)
      - header: Hypalon (CSM)
    rows:
      - property: ความต้านทาน UV
        pvc: ดี (พร้อมUVตัวช่วยเสถียร)
        hypalon: ยอดเยี่ยม (โดยธรรมชาติ)
      - property: ความทนทานต่อการขีดข่วน
        pvc: ดี
        hypalon: ดีมาก
      - property: ความต้านแรงดึง
        pvc: 3,000–5,000 N/5cm
        hypalon: 2,500–4,000 N/5cm
      - property: น้ําหนักต่อตารางเมตร
        pvc: 850–1,200 g
        hypalon: 1,100–1,500 g
      - property: โคลด์เฟล็กซ์
        pvc: -30°C
        hypalon: -20°C
      - property: วิธีการเชื่อมต่อ
        pvc: การเชื่อม RF / การเชื่อมด้วยลมร้อน
        hypalon: การติดกาวด้วยมือ (ซีเมนต์สัมผัส)
      - property: ความสามารถในการซ่อมแซม
        pvc: ง่าย (เชื่อมความร้อนหรือใช้กาว)
        hypalon: ต้องใช้กาว CSM
      - property: ค่าใช้จ่ายวัสดุ
        pvc: $8–15 / m²
        hypalon: $20–40 / m²
      - property: อายุการใช้งาน (แดดเขตร้อน)
        pvc: 5–8 ปี
        hypalon: 10–15 ปี
      - property: ช่วงสี
        pvc: กว้าง (สเปกตรัมสีเต็ม)
        hypalon: จำกัด (สีพื้นฐาน)
      - property: ความต้านทานทางเคมี
        pvc: ดี (เกรดทนเชื้อเพลิง/น้ำมัน)
        hypalon: ยอดเยี่ยม (ทนเคมีได้หลากหลาย)
section_testing:
  title: การทดสอบ & ข้อกำหนดด้านความปลอดภัย
  subtitle: กรอบการประกันคุณภาพของ Aquafarer สำหรับแต่ละชุดการผลิต
  protocols:
    - title: การทดสอบการทนแรงดัน 1.25x
      description: ภาชนะทุกชิ้นที่ประกอบแล้วจะถูกเติมลมจนถึงแรงดันการใช้งานที่กำหนดคูณ 1.25 และคงไว้ 24–48 ชั่วโมง การลดลงของแรงดันเกิน 2% จะทำให้ต้องปฏิเสธและซ่อมแซม
      standard: ISO 6185
    - title: การทดสอบความแข็งแรงรอยต่อ
      description: ตัวอย่างรอยต่อเชื่อมและกาวจากแต่ละชุดการผลิตจะถูกทดสอบความแข็งแรงการดึงด้วยอุปกรณ์วัดแรงดึงที่ได้มาตรฐาน ต้องมีความต้านทานการดึงอย่างต่ำ 4 kN/m
      standard: ISO 2411
    - title: การทดสอบแรงดึงของผ้า
      description: ม้วนผ้าที่รับเข้ามาจะถูกทดสอบความแข็งแรงและการยืดตัวทั้งในแนวตั้งและแนวนอน จะปฏิเสธหากต่ำกว่า 3,000 N/5cm สำหรับ PVC
      standard: ISO 1421
    - title: UV การเร่งสภาพสภาพอากาศ
      description: ตัวอย่างวัสดุถูกทดสอบการสัมผัส UV เร่งใน QUV test chambers เป็นเวลา 1,000+ ชั่วโมง อนุญาตให้สูญเสียแรงดึงสูงสุด 15%
      standard: ASTM G154
    - title: ความสมบูรณ์ของวาล์วและชุดอุปกรณ์
      description: ชุดวาล์วแต่ละชุดจะถูกทดสอบความแน่นในการปิดผนึกที่แรงดัน 1.25x ที่กำหนด วาล์วปิดกลับจะถูกทดสอบการทำงานของผนึกทางเดียว
      standard: ISO 12402
section_manufacturing:
  title: มาตรฐานการผลิตและการรับรองคุณภาพ
  subtitle: การปฏิบัติตามมาตรฐานอุตสาหกรรมเพื่อการเข้าถึงตลาดโลก
  standards:
    - name: ISO 9001:2015
      body: SGS ได้รับการรับรอง
      scope: ระบบการจัดการคุณภาพตั้งแต่การออกแบบ การผลิต และการส่งมอบ
    - name: CE 2013/53/EU
      body: หน่วยงานแจ้งของสหภาพยุโรป
      scope: ข้อกําหนดเรือเพื่อการพักผ่อน — การออกแบบตัวเรือ ความมั่นคง การลอยตัว การปล่อยมลพิษ
    - name: BSCI
      body: แอมโฟรี
      scope: การปฏิบัติตามกฎระเบียบทางสังคม — ความปลอดภัยของแรงงาน แรงงานที่เป็นธรรม การจัดการสิ่งแวดล้อม
    - name: ISO 6185
      body: มาตรฐานสากล
      scope: เรือเป่าลม — การก่อสร้าง, ความมั่นคง, การลอยตัว, การทดสอบแรงดัน
    - name: REACH
      body: ข้อบังคับของสหภาพยุโรป
      scope: ความปลอดภัยทางเคมี — สารที่ถูกจํากัดในวัสดุและสารเคลือบ
section_faq:
  title: คําถามที่พบบ่อยทางเทคนิค
  questions:
    - q: เปรียบเทียบdrop-stitchกับการก่อสร้างแบบเปลือกแข็งแบบดั้งเดิมอย่างไร?
      a: แกนรุ่นใหม่drop-stitchที่ 20 มีPSIความแข็งแรงถึง 85–90% ของเปลือกแข็งโฟม/ไฟเบอร์กลาสที่เทียบเท่า EPS และยังสามารถยุบตัวได้เต็มที่สําหรับการขนส่งข้อแลกเปลี่ยนคือน้ําหนักที่สูงกว่าเล็กน้อยและความแข็งสุดท้ายที่ต่ํากว่า — แต่สําหรับการใช้งานเพื่อการพักผ่อนและเชิงพาณิชย์ส่วนใหญ่ ความแตกต่างนี้แทบไม่มีนัยสําคัญ
    - q: ความหนาแน่นของด้ายแบบไหนถึงจะถือว่าเป็นคุณภาพพรีเมียม?
      a: ผ้าพรีเมียมdrop-stitchใช้ด้าย 2 เส้นต่อตารางนิ้ว (ประมาณ 3,100 เส้นต่อตารางเมตร) ทอจากDTEXเส้นด้ายโพลีเอสเตอร์ 1,680 เส้นผ้าระดับเริ่มต้นใช้เส้นด้าย 1 เส้นต่อตารางนิ้ว กับDTEXเส้นด้าย 1,100 เส้น
    - q: สามารถHypalonเชื่อมแบบนี้PVCได้ไหม?
      a: ไม่Hypalon/CSM ไม่สามารถเชื่อม RF ได้ต้องประกอบโดยใช้ซีเมนต์สัมผัสที่ทาด้วยมือ ซึ่งทําให้การผลิตต้องใช้แรงงานมากขึ้นและรอยต่อขึ้นอยู่กับทักษะของผู้ปฏิบัติงานPVCสามารถเชื่อม RF หรือเชื่อมด้วยลมร้อนเพื่อคุณภาพของรอยต่อที่สม่ําเสมอและอัตโนมัติ
    - q: แรงดันสูงสุดที่ปลอดภัยสําหรับเรือเป่าลมคือเท่าไร?
      a: ท่อเป่าลมมาตรฐานทํางานที่ 8–12 PSIDrop-stitch พื้นทํางานที่ 12–20 PSIแกนแรงดันสูง drop-stitch (SUPs) สามารถทํางานที่ 20–25 PSIแต่ละผลิตภัณฑ์มีวาล์วระบายแรงดันที่ปรับเทียบเพื่อป้องกันการพองเกิน
    - q: ใช้เวลานานเท่าไรในการผลิตเรือเป่าลมแบบสั่งทําพิเศษ?
      a: การผลิตมาตรฐานOEMใช้เวลา 30–45 วันนับจากยืนยันคําสั่งซื้อถึงFOBชิงเต่าการพัฒนาแม่พิมพ์แบบกําหนดเองใช้เวลาผลิตต้นแบบและทดสอบอีก 15–20 วัน
