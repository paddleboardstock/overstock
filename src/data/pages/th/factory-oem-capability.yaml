    custom_moq: 200+ หน่วย
    lead_time: 30–45 วัน
  - product: เสื้อชูชีพและความปลอดภัย
    standard_moq: 100–500 หน่วย
    custom_moq: มากกว่า 1,000 หน่วย
    lead_time: 20–30 วัน
why_us:
  - title: การรวมแนวดิ่ง
    description: เรามีโรงงานเอง, แม่พิมพ์ และห่วงโซ่อุปทาน — ไม่มีคนกลาง, ไม่มีผู้รับจ้างย่อย ซึ่งทำให้เราควบคุมคุณภาพ, ต้นทุน และการส่งมอบได้
  - title: การรับรองคู่
    description: การจัดการคุณภาพ 9001 และการรับรองความสอดคล้องด้านสังคม รายงานการตรวจสอบโรงงานสามารถขอได้
  - title: การปฏิบัติตาม
    description: โมเดลมาตรฐานทั้งหมดได้รับการรับรอง 2013/53/EU โมเดลที่สั่งทำพิเศษสามารถได้รับการรับรองผ่านกระบวนการที่เรามีอยู่แล้ว
  - title: ขั้นต่ำต่ำ
    description: เริ่มต้นเพียง 5 หน่วยสำหรับโมเดลมาตรฐาน เราช่วยแบรนด์ใหม่เปิดตัวโดยไม่ต้องสต็อกเกินความจำเป็น
