hero:
  tagline: OEM/ODM การผลิต
  title: OEM และการผลิตตราสินค้าส่วนตัว
  subtitle: ตั้งแต่แนวคิดจนถึงภาชนะ — ปรับแต่งรายละเอียดทุกอย่างของสายผลิตภัณฑ์เรือเป่าลมของคุณ
intro: Paddle Board Overstock นำเสนอ OEM และ ODM บริการครบวงจรสำหรับแบรนด์ ผู้จัดจำหน่าย และหน่วยงานรัฐบาลทั่วโลก ด้วยประสบการณ์การส่งออกมากกว่า 10+ ปี และโรงงานขนาด 12,000 ตร.ม. ที่ได้รับการรับรอง 9001 & BSCI เราดูแลทุกอย่างตั้งแต่การออกแบบผลิตภัณฑ์และพัฒนาพิมพ์แม่พิมพ์ไปจนถึงการผลิตขนาดเต็ม การบรรจุ และการขนส่ง
highlight:
  - value: 10+
    label: ประสบการณ์ OEM ปี
    detail: ตั้งแต่ปี 2012
  - value: 50+
    label: ประเทศที่ส่งออก
    detail: เข้าถึงทั่วโลก
  - value: 200+
    label: จัดส่งโครงการที่กำหนดเอง
    detail: ครอบคลุมทุกสายผลิตภัณฑ์
  - value: 30–45
    label: ระยะเวลาการจัดส่งมาตรฐาน (วัน)
    detail: ตั้งแต่ PO ถึง FOB
services:
  - title: การออกแบบและวิศวกรรมผลิตภัณฑ์
    description: ทีมวิจัยและพัฒนาภายในของเราทำงานร่วมกับแนวคิดหรือข้อกำหนดของคุณเพื่อพัฒนาภาพร่าง CAD แบบจำลอง 3 มิติ และต้นแบบ เรานำเสนองานออกแบบแม่พิมพ์ การปรับรูปทรงตัวเรือให้เหมาะสม และคำแนะนำเกี่ยวกับการเลือกวัสดุ
  - title: การสร้างแบรนด์และกราฟิกที่กำหนดเอง
    description: การพิมพ์ดิจิทัลแบบสีเต็ม การสกรีน การปั๊ม และตัวเลือกฉลาก เราพัฒนากราฟิกบนพื้นตัวเรือเฉพาะแบรนด์ การสร้างแบรนด์บนท่อ และบรรจุภัณฑ์พร้อมขายปลีก
  - title: การปรับแต่งวัสดุและข้อกำหนด
    description: เลือกจาก PVC (มาตรฐาน เป็นมิตรต่อสิ่งแวดล้อม หน่วงไฟ), Hypalon/CSM, drop-stitch, และโครงสร้างแบบไฮบริด สีท่อ น้ำหนักผ้า และตัวเลือกการเสริมความแข็งแรงสามารถปรับได้ตามต้องการ
  - title: การบรรจุและการขนส่ง
    description: บรรจุภัณฑ์สำหรับขายปลีกที่กำหนดเอง กล่องสำหรับตราสินค้าส่วนตัว บรรจุสูญญากาศ จัดเรียงบนพาเลท และโหลดเข้าในตู้คอนเทนเนอร์ สามารถเลือกเงื่อนไขการจัดส่ง FOB ชิงเต่า, CIF, หรือ DDP
moq_table:
