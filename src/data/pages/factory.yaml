material_traceability:
  tagline: Traceability
  title: Material Tracking & Batch Control
  description: Every batch of raw material is assigned a unique lot number in our ERP system. From arrival through production to the finished product, each board's bill of materials links back to the original supplier batch. This enables full upstream traceability for any quality inquiry.
  system: Custom ERP (internal system) + physical batch tags on each work order
  coverage: 100% of production materials — PVC, drop-stitch fabric, EVA foam, adhesives, valves, hardware, packaging
  records_retained: 10 years
