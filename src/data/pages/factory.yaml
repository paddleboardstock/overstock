hero:
  tagline: Factory
  title: Factory & Manufacturing
  subtitle: 12,000 m2 of integrated manufacturing — from raw material to finished board
intro:
  - As the factory brand of the **Paddle Board Overstock Weihai Manufacturing Hub**, Paddle Board Overstock controls every stage of production — from the arrival of raw PVC and drop-stitch materials to the final pre-delivery inspection of the finished board. Our manufacturing facility in the Weihai Economic Development Zone spans 12,000 square metres and houses dedicated workshops for PVC cutting, heat sealing and welding, deck art finishing, final assembly, and quality testing.
  - By integrating design, engineering, prototyping, manufacturing, and testing under one roof, we eliminate the inefficiencies of contract manufacturing and maintain direct control over build quality, material selection, and delivery timelines. Every board that leaves our workshop is built by our people, on our equipment, to our standards.
