qc_section:
  tagline: Quality Control
  title: Testing & Quality Assurance Process
  subtitle: Every board undergoes mandatory testing before shipping. Our quality lab operates independently from production and reports directly to management.
  steps:
    - step: "1"
      title: Raw Material Inspection
      desc: PVC and drop-stitch fabrics undergo tensile testing, tear propagation, and UV resistance verification before any batch enters production.
    - step: "2"
      title: 48-Hour Air Retention Test
      desc: Every board chamber is inflated to 125% of rated pressure and held for 48 hours. Pressure drop exceeding 5% triggers automatic rejection and seam re-inspection.
    - step: "3"
      title: Load & Balance Testing
      desc: Completed boards are loaded to maximum rated capacity and tested for stability, freeboard, and handling. Each board is water-tested before final inspection.
faq_section:
  tagline: FAQ
  title: Frequently Asked Questions
  questions:
    - q: Where are your paddle boards made?
      a: Every board is built in our own 12,000 m² factory in Weihai, China. We do not outsource — design, materials, welding, assembly, and testing all happen under one roof, so quality never depends on a third party.
    - q: How are your prices so much lower than retail?
      a: We sell factory overstock and clearance batches direct from our own production facility — no middlemen, no retail markup. That means complete SUP packages at up to 60% off typical retail prices, with the same pressure-tested quality.
    - q: What is included with a board?
      a: "Every SUP ships as a complete package: board, travel backpack, hand pump, adjustable paddle, removable fin, coil leash, and repair kit."
    - q: How fast do orders ship?
      a: In-stock orders leave our Weihai factory within 2-3 business days with tracked delivery to 50+ countries across the EU, North America, Asia-Pacific, and beyond.
production_flow:
  tagline: Production Flow
  title: From Material to Finished Board
  subtitle: Every board passes through 6 production stages with QC checkpoints at every step. No shortcuts, no skipped inspections.
  stages:
    - stage: "01"
      title: Material Receiving & Incoming QC
      description: All incoming materials are logged by batch/lot number in our ERP system. PVC fabric rolls, drop-stitch cores, valves, adhesives, and hardware are quarantined until QC sign-off.
      qc_check: Tensile strength, tear resistance, thickness gauge, adhesive viscosity, visual defect scan
      qc_threshold: 100% of batches tested. Reject if tensile < 90% of spec, tear < spec min, or any visual defect
      responsibility: Incoming QC team (3 inspectors)
    - stage: "02"
      title: CNC Cutting & Material Prep
      description: Computer-optimized nesting lays out panels on PVC stock to minimize waste. Automatic CNC cutting machines maintain 0.1 mm positional accuracy.
      qc_check: Dimensional check against CAD DXF files, edge quality inspection, panel count verification
      qc_threshold: Every 20th panel measured. Tolerance ±0.5 mm. Reject batch if >2% out of tolerance
      responsibility: Cutting workshop lead
    - stage: "03"
      title: Welding & Drop-Stitch Bonding
      description: Drop-stitch cores are bonded to outer PVC laminates using heat lamination. Tube chambers are RF-welded or hot-air welded. Rail bands are triple-layer fusion bonded.
      qc_check: Peel test every 50 units, weld width measurement, hot-air temperature log review, visual seam inspection under backlight
      qc_threshold: Peel strength min 8 N/cm. Weld width tolerance ±1 mm. Any visible channeling = reject
      responsibility: Welding QC (2 inspectors per shift)
    - stage: "04"
      title: Assembly & Rigging
      description: "Boards move to final assembly where all components are fitted: valves installed, D-rings, handles, fin boxes, and carry bag fitting. Each unit follows a 100-point assembly checklist."
      qc_check: 100-point checklist sign-off per unit, valve function test (10 open/close cycles), hardware torque verification, visual inspection
      qc_threshold: Zero-defect policy on safety-critical items (valves, D-rings, handles). Minor cosmetic defects within strict cosmetic limits
      responsibility: Assembly team lead + line QC
    - stage: "05"
      title: Pressure Testing & Quality Hold
      description: Every chamber is inflated to 1.25× rated pressure (typically 20–25 PSI) and held for 24–48 hours. Pressure sensors log continuously. Chambers exceeding 5% pressure drop are rejected and sent for seam re-inspection.
      qc_check: 24h pressure hold log, sensor calibration verified daily, temperature-compensated pressure reading, seam re-test after repair
      qc_threshold: Max 5% pressure drop over 24h at stable temp. Any chamber exceeding this = 100% re-test of entire production batch
      responsibility: Quality lab (independent of production, reports to management)
    - stage: "06"
      title: Final Inspection & Packing
      description: Final visual and functional inspection. Surface defects, color consistency, label/BIN verification, packaging integrity, and accessory completeness. Units are vacuum-packed, boxed, and palletized for container loading.
      qc_check: Full visual inspection, accessory checklist per SKU, packaging drop test (1 m, random sample), label/bar code scan verification
      qc_threshold: Zero tolerance on safety defects. Cosmetic defects within strict limits. 100% of units visually inspected
      responsibility: Final QC team (4 inspectors) + Packing team lead
