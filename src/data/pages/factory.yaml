hero:
  tagline: Factory
  title: Factory & Manufacturing
  subtitle: 12,000 m2 of integrated manufacturing — from raw material to finished boat

intro:
  - As the factory brand of the **Paddle Board Overstock Qingdao Manufacturing Hub**, Paddle Board Overstock controls every stage of production — from the arrival of raw PVC and fiberglass materials to the final pre-delivery inspection of the finished boat. Our manufacturing facility in the Qingdao Economic Development Zone spans 12,000 square metres and houses dedicated workshops for PVC cutting, tube heat sealing, fiberglass RIB hull production, SUP digital printing, final assembly, and quality testing.
  - By integrating design, engineering, prototyping, manufacturing, and testing under one roof, we eliminate the inefficiencies of contract manufacturing and maintain direct control over build quality, material selection, and delivery timelines. Every boat that leaves our workshop is built by our people, on our equipment, to our standards.

