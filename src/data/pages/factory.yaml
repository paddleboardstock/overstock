workshops_section:
  tagline: Workshops
  title: Manufacturing Workshops
  workshops:
    - title: PVC Cutting & Material Preparation
      description: Automatic CNC cutting machines process PVC and drop-stitch fabrics with sub-millimetre precision. Computer-optimised nesting minimises material waste and ensures every panel meets its dimensional specification before welding.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Welding & Heat Sealing
      description: Dedicated welding workshop with heat sealing machines and RF dielectric presses. Hot-air welders bond and fuse drop-stitch core laminates and rail bands, while RF welds produce high-strength airtight seams.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Deck Art & EVA Finishing
      description: "Art-series decks take shape here: precision-cut EVA foam panels are laid into full-deck patterns, bonded, and trimmed by hand for a grippy, comfortable, durable finish — the signature look of every art-series board."
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Printing & Decoration
      description: SUP boards are decorated using digital printing for full-colour graphics and screen printing for logos and repeating patterns. Digital printers produce photo-quality deck designs, while screen printing delivers durable, vivid brand marks.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Final Assembly & Rigging
      description: Assembly line where boards receive their valves, D-rings, handles, fins, and leash attachments. Each board follows a 100-point assembly checklist signed off by the team lead.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Quality Testing & Inspection
      description: Every completed board undergoes mandatory air-retention testing, seam peel verification, and a full systems check before shipping. Our quality lab operates independently from production and reports directly to management.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
