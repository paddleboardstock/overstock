content_scope:
  tagline: Compliance Scope
  title: 'Which Products Need<br />RCD Compliance?'
  subtitle: 'The Recreational Craft Directive 2013/53/EU applies to recreational craft with a hull length between 2.5 m and 24 m. Understanding scope is the first step to compliance.'
  items:
    - title: 'RIB Boats (2.5–24 m)'
      description: 'Rigid inflatable boats with hull lengths from 2.5 m to 24 m fall under RCD. Design categories A through D apply depending on intended sea conditions and maximum wind force.'
      icon: tabler:sailboat
    - title: 'Inflatable Boats (under 2.5 m)'
      description: 'Small inflatable boats and dinghies under 2.5 m may be partially exempt from RCD but still require CE marking under other applicable directives and EN ISO 6185 construction standards.'
      icon: tabler:sailboat
    - title: 'SUP Boards & Accessories'
      description: 'Stand-up paddle boards are outside RCD scope. However, associated personal flotation devices (PFDs) require CE marking under the PPE Regulation (EU) 2016/425 with USCG Type III/V approval where applicable.'
      icon: tabler:swimming
    - title: 'Partially Completed Boats'
      description: 'Boats delivered without engine or specific installations require a Builder''s Declaration for partially completed craft, with full RCD compliance completed by the final builder or importer.'
      icon: tabler:tool

content_trust_layers:
  tagline: Three-Layer Trust System
  title: 'Compliance Information<br />— Shared at the Right Level'
  subtitle: 'Not all compliance data belongs on a public website. We follow a three-layer approach that protects IP while building buyer confidence.'
  items:
    - title: 'Layer 1 — Public Website'
      description: 'Standards referenced, conformity routes explained, document types listed, certification scope per model family. No actual certificates, test data, or proprietary engineering details.'
      icon: tabler:world
    - title: 'Layer 2 — Post-Inquiry Sharing'
      description: 'After a qualified inquiry: redacted DoC sample, builder''s plate photo, applicable standards list, compliance checklist, and material certification summaries — shared under fair-use terms.'
      icon: tabler:mail
    - title: 'Layer 3 — NDA / Order Stage'
      description: 'Full technical file, risk assessments, stability calculations, test reports, material batch records, and production traceability documentation — shared only under NDA with confirmed buyers.'
      icon: tabler:lock

content_standards:
  tagline: Applicable Standards
  title: 'ISO & EN Standards<br />We Build To'
  subtitle: 'Our products are designed and tested against the harmonised standards under the RCD. Standard numbers and names are referenced; full standard texts remain ISO copyright.'
  items:
    - title: 'EN ISO 6185-3'
      description: 'Inflatable boats — Part 3: Boats with a maximum motor power of 15 kW or more. Construction, stability, buoyancy, and man-overboard recovery requirements for RIBs.'
      icon: tabler:file-text
    - title: 'EN ISO 6185-4'
      description: 'Inflatable boats — Part 4: Boats with a maximum motor power of 15 kW and greater than or equal to 4.5 kW. Additional structural and stability requirements.'
      icon: tabler:file-text
    - title: 'ISO 12215 Series'
      description: 'Small craft — Hull construction and scantlings. Structural design of hull, deck, and bulkheads for fiberglass and aluminum RIB hulls.'
      icon: tabler:ruler-2
    - title: 'EN ISO 10240'
      description: 'Small craft — Owner''s manual. Required content and format for the owner''s manual accompanying each RIB boat delivered in the EU.'
      icon: tabler:book
    - title: 'EN ISO 14945'
      description: 'Small craft — Builder''s plate. Information to be marked on the builder''s plate permanently attached to each craft.'
      icon: tabler:badge
    - title: 'ISO 8666'
      description: 'Small craft — Principal data. Standardized measurements and parameters for consistent specification across all product documentation.'
      icon: tabler:dimensions

content_process:
  tagline: Compliance Process
  title: '6-Step CE Compliance<br />Workflow'
  subtitle: 'From project scope to serial-level traceability — every RIB model follows a defined compliance path.'
  steps:
    - number: '01'
      title: 'Project Scope & Classification'
      description: 'Define the RIB model, design category (A/B/C/D), maximum persons, payload, engine power, and target market. Determine if RCD applies and which conformity assessment module is required.'
      timeline: '2–3 days'
    - number: '02'
      title: 'Applicable Requirements Identification'
      description: 'Identify all applicable Essential Safety Requirements from RCD Annex I, relevant harmonised standards (EN ISO 6185, 12215, 10240, 14945), and any additional national requirements for the target market.'
      timeline: '3–5 days'
    - number: '03'
      title: 'Design & Technical Documentation'
      description: 'Create the Master Technical File: general arrangement drawings, stability and buoyancy calculations, risk assessment, material specifications, and systems safety analysis (fuel, electrical, steering).'
      timeline: '10–15 days'
    - number: '04'
      title: 'Product Verification & Testing'
      description: 'Conduct physical verification — pressure testing at 1.25x rated pressure for 24–48 hours, stability and buoyancy tests, load tests, and systems commissioning. Record all test results per hull.'
      timeline: '5–7 days'
    - number: '05'
      title: 'Marking & Delivery Documentation'
      description: 'Affix CE marking, builder''s plate (EN ISO 14945), and HIN/CIN (hull identification number). Prepare EU Declaration of Conformity, owner''s manual (EN ISO 10240), and compliance checklist.'
      timeline: '2–3 days'
    - number: '06'
      title: 'Serial-Level Traceability'
      description: 'Each hull receives a unique Hull Record linking it to the Master Technical File, production batch, material certificates, test results, and final configuration. Records retained for 10+ years per RCD.'
      timeline: 'Ongoing'

content_document_cards:
  tagline: Document Types
  title: 'Compliance Document<br />Cards'
  subtitle: 'These are the document types we prepare and maintain for each CE-certified RIB model. Samples are available upon qualified inquiry.'
  items:
    - title: 'CE / RCD Compliance Certificate'
      description: 'Model-specific certificate confirming the craft meets all applicable Essential Safety Requirements of RCD 2013/53/EU, issued by the manufacturer with Notified Body involvement where required.'
      icon: tabler:certificate
    - title: 'EU Declaration of Conformity (DoC)'
      description: 'Signed declaration by the manufacturer or authorized representative, listing applicable directives, standards, conformity module, and Notified Body details. Required for every model placed on the EU market.'
      icon: tabler:file-check
    - title: "Builder's Plate (EN ISO 14945)"
      description: 'Permanently affixed plate showing maximum persons, maximum engine power, design category, and manufacturer identification. Must remain legible for the life of the craft.'
      icon: tabler:badge
    - title: "Owner's Manual (EN ISO 10240)"
      description: 'Comprehensive manual covering safe operation, emergency procedures, maintenance schedules, and safety warnings. Mandatory for every RIB delivered in the EU.'
      icon: tabler:book
    - title: 'ISO Test & Inspection Reports'
      description: 'Pressure test records (1.25x / 24–48h), stability and buoyancy test results, material test certificates, and dimensional verification reports — all linked to specific hull numbers.'
      icon: tabler:test-pipe
    - title: 'Material Traceability Records'
      description: 'Batch-level traceability for tube fabric, adhesives, fiberglass, and hardware. Links each production unit to incoming material certificates and IQC inspection results.'
      icon: tabler:link
    - title: 'Quality Inspection & QC Records'
      description: '100-point quality checklist per unit, in-process QC records, non-conformance reports, and corrective actions. Part of the production traceability chain.'
      icon: tabler:clipboard-check
    - title: 'Project Document Pack'
      description: 'Per-hull documentation package including final configuration record, engine and equipment installation details, commissioning checklist, and delivery documentation.'
      icon: tabler:package

content_design_categories:
  tagline: RCD Design Categories
  title: 'Design Category A–D<br />— What They Mean'
  subtitle: 'The RCD assigns design categories based on maximum wind force and significant wave height the craft is designed to withstand.'
  items:
    - title: 'Category A — Ocean'
      description: 'Designed for extended voyages where wind force may exceed Beaufort 8 (>40 knots) and significant wave height may exceed 4 m. Requires the most rigorous structural and stability verification.'
      icon: tabler:ripple
    - title: 'Category B — Offshore'
      description: 'Designed for offshore voyages with wind force up to Beaufort 8 (≤40 knots) and significant wave height up to 4 m. Suitable for coastal and semi-exposed waters.'
      icon: tabler:anchor
    - title: 'Category C — Inshore'
      description: 'Designed for coastal voyages with wind force up to Beaufort 6 (≤27 knots) and significant wave height up to 2 m. Most recreational RIBs fall in this category.'
      icon: tabler:sun
    - title: 'Category D — Sheltered'
      description: 'Designed for sheltered waters with wind force up to Beaufort 4 (≤16 knots) and significant wave height up to 0.3 m. Lakes, rivers, and protected harbors.'
      icon: tabler:pool

content_hin:
  tagline: Craft Identification
  title: 'HIN / CIN & Builder''s Plate'
  subtitle: 'Every RIB boat requires a Hull Identification Number (HIN) or Craft Identification Number (CIN) and a builder''s plate per EN ISO 14945 and RCD requirements.'
  items:
    - title: 'Hull Identification Number (HIN)'
      description: 'A unique 14-character code permanently marked on the starboard side of the transom, encoding manufacturer code (MIC), model year, production year, and serial number. Required for EU market entry.'
      icon: tabler:hash
    - title: 'Craft Identification Number (CIN)'
      description: 'Per EN ISO 10087, a hidden secondary identification number placed in a concealed location for anti-theft and traceability purposes.'
      icon: tabler:eye-off
    - title: "Builder's Plate Content"
      description: 'Maximum number of persons, maximum engine power (kW), maximum load (kg), design category, manufacturer name, and CE marking — all permanently displayed on a corrosion-resistant plate.'
      icon: tabler:badge

content_tech_file:
  tagline: Technical File Structure
  title: 'Master Technical File<br />& Hull Record'
  subtitle: 'Our documentation system follows a two-tier structure: the Master Technical File for each model family, and individual Hull Records for every boat produced.'
  items:
    - title: 'Master Technical File'
      description: 'Contains the complete compliance documentation for a model family: general arrangement, risk assessment, stability/buoyancy calculations, material specs, applicable standards, and conformity assessment records. Retained for 10+ years.'
      icon: tabler:folder
    - title: 'Hull Record (Per-Boat Traceability)'
      description: 'Each hull has a unique record linking it to the Master Technical File: HIN, production date, tube batch, material certificates, pressure test result, final configuration, engine install, and delivery destination.'
      icon: tabler:file-description
    - title: 'Customer Compliance Pack'
      description: 'Per-hull delivery package including DoC, builder''s plate photo, owner''s manual, test summary, and final configuration sheet — provided with every RIB shipped to the EU.'
      icon: tabler:package

content_material_cert:
  tagline: Material Certification
  title: 'Material Traceability &<br />Certification Evidence'
  subtitle: 'Quality RIB boats begin with controlled materials and documented processes. Below is how we organize material certification for each critical component group.'
  items:
    - title: 'Inflatable Tube Material Traceability'
      description: 'PVC and CSM/Hypalon tube materials are selected according to intended use, climate conditions and target market. Supplier technical data (TDS), material batch information, fabric batch traceability, UV and weathering test reports, and REACH/SVHC declarations are available within the agreed project documentation scope.'
      icon: tabler:circle
    - title: 'Marine Aluminum Traceability'
      description: 'For aluminum-hull RIB projects, alloy grade, thickness and material batches are controlled per approved specification. Material test certificates (MTC/MTR), EN 10204 3.1 documentation, chemical composition and mechanical-properties reports, and heat/lot traceability are supplied where agreed.'
      icon: tabler:rectangle
    - title: 'GRP Hull Material & Process Control'
      description: 'For fiberglass-hull RIBs, gelcoat, resin, fiberglass reinforcement and core materials are managed through controlled specifications. Material TDS/SDS, batch records, laminate specifications, and curing and workshop control records are available upon project agreement.'
      icon: tabler:layers-subtract
    - title: 'Component Documentation Support'
      description: 'For selected components — including EVA deck materials, seating, stainless-steel hardware, fuel systems, electrical equipment and marine accessories — applicable supplier documentation is coordinated based on final configuration and destination-market requirements.'
      icon: tabler:package
    - title: 'Compliance Scope Notice'
      description: 'Certificates, test reports and compliance documents apply only to the specific product model, material, component, production batch or project scope stated in the relevant document. Contact us with your target market, intended use and technical requirements so that the applicable documentation package can be confirmed before order placement.'
      icon: tabler:info-circle

faq:
  title: CE Compliance — Frequently Asked Questions
  questions:
    - q: Are all Paddle Board Overstock RIB boats CE certified for the EU market?
      a: 'RIB boats in our catalog are designed and documented for RCD 2013/53/EU compliance per applicable EU directives. CE marking applies on a per-model, per-configuration basis. Contact us for a model-specific compliance scope document.'
    - q: What is the difference between RCD compliance and CE marking?
      a: 'RCD (Recreational Craft Directive 2013/53/EU) is the EU legislation that sets Essential Safety Requirements. CE marking is the visual symbol placed on a product that has been assessed and confirmed to meet those requirements. A product must comply with the RCD before it can carry the CE mark.'
    - q: Do you provide Declarations of Conformity with each boat?
      a: 'Yes. Every RIB boat delivered to the EU market includes a model-specific EU Declaration of Conformity listing the applicable directives, harmonised standards, conformity assessment module, and Notified Body details.'
    - q: What conformity assessment module does Paddle Board Overstock use?
      a: 'The module depends on the design category and boat type. Most RIB models in Design Category C use Module A (internal production control). For Design Category A/B boats or specific configurations, Module B+C or B+D may apply with Notified Body involvement. We advise on the appropriate module per project.'
    - q: Can you share compliance documentation before we place an order?
      a: 'After a qualified inquiry, we share a compliance scope document listing applicable standards, conformity route, and document types available for the model you are evaluating. Full technical files are shared under NDA after order confirmation.'
    - q: What is a Hull Identification Number (HIN) and is it included?
      a: 'The HIN is a 14-character unique identifier permanently marked on each boat, encoding the manufacturer code (MIC), model designation, production year, and serial number. It is mandatory for all RIB boats placed on the EU market and is included on every Paddle Board Overstock RIB.'
    - q: How long are technical files retained?
      a: 'Per RCD 2013/53/EU requirements, the manufacturer must retain the technical file for at least 10 years from the last date the product was placed on the market. Paddle Board Overstock maintains full technical documentation for all models produced.'
    - q: Do you assist with importer obligations under the RCD?
      a: 'Yes. We provide the documentation package that EU importers need to fulfill their obligations: technical file access, DoC, builder''s plate, owner''s manual, and product traceability records. Importer responsibilities under the RCD are clearly documented in our compliance guide.'

