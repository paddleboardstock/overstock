hero:
  tagline: CE & RCD Compliance
  title: 'RIB Boat CE Compliance<br />& Technical Documentation'
  subtitle: 'Paddle Board Overstock RIB boats and inflatable watercraft are designed and documented for EU market compliance under the Recreational Craft Directive 2013/53/EU. From risk assessment to Declaration of Conformity, we provide model-specific compliance documentation for every hull.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: RIB boat CE compliance documentation and certification

direct_answer: 'Paddle Board Overstock provides model-specific RCD 2013/53/EU compliance documentation for RIB boats and inflatable watercraft, including technical files, Declarations of Conformity, builder plates, and owner manuals — all aligned with EN ISO 6185, ISO 12217, and applicable harmonised standards.'

