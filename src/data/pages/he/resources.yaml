hero_text:
  tagline: אֶמְצָעִי
  title: מרכז הורדות ומדריכי קונים
  subtitle: גשו לקטלוגי מוצרים, מדריכי OEM, רשימות בדיקה לקונים ותיעוד טכני שיעזור לכם לקבל החלטות רכש מושכלות.
features3_downloads:
  tagline: הורדות
  title: תיעוד מוצר<br />ומקורות לקונים
  isBeforeContent: false
  columns: 2
  items:
    - title: קטלוג מוצרי ימי 2026
      description: טווח המוצרים המלא כולל סירות RIB, סירות מתנפחות, לוחות SUP, קיאקים ואביזרים. מפרטים, תצורות ואפשרויות. בפורמט PDF.
      icon: tabler:file-text
    - title: מדריך ייצור OEM
      description: 'כל מה שאתם צריכים לדעת על שותפויות OEM/ODM: סקירת תהליך, מינימום כמות הזמנה, אפשרויות התאמה אישית, בקרת איכות ומשלוח.'
      icon: tabler:building-factory
    - title: מדריך קניית סירה RIB
      description: 'איך לבחור את RIB הנכון: חומרי דופן גוף הסירה, חומרי צינורות, בחירת מנוע, שיקולי גודל ואפשרויות תצורה ליישומים שונים.'
      icon: tabler:file-description
    - title: רשימת בדיקה לספק SUP
      description: 'שיקולים מרכזיים בעת בחירת יצרן לוח SUP: אינדיקטורים לאיכות, דרישות תעודה, שיקולי MOQ ומה לבדוק בביקורת במפעל.'
      icon: tabler:clipboard-check
    - title: מדריך חומר לסירות מתנפחות
      description: 'PVC מול Hypalon: השוואה של עמידות, עמידות UV, אורך חיים, אפשרויות תיקון ושיקולי עלות ליישומים ימיים שונים.'
      icon: tabler:files
    - title: תבנית בריף לייצור מותאם
      description: הורידו את תבנית הבריף שלנו למוצר. מלאו את דרישותיכם ושלחו אלינו לקבלת הצעת מחיר ובדיקת כדאיות באותה שבוע.
      icon: tabler:template
faqs:
  title: שאלות נפוצות
  subtitle: שאלות נפוצות על מוצרינו, תהליך הייצור ודגם השותפות שלנו.
  columns: 2
  items:
    - title: מהי כמות ההזמנה המינימלית?
      description: MOQ משתנה לפי קטגוריית מוצר. סירות RIB בדרך כלל מתחילות מ-10 יחידות לכל דגם. לוחות SUP מ-50 יחידות. צרו קשר עם צוות המכירות שלנו למידע MOQ ספציפי למוצר.
      icon: tabler:help-circle
    - title: האם ניתן לקבל דגימות לפני ביצוע הזמנה?
      description: כן. Paddle Board Overstock מספקת הפקת דגימות להערכה לפני ייצור המוני. עלויות הדגימות ניתנות למו"מ ולעיתים נזקפות להזמנה הראשונה.
      icon: tabler:package
    - title: אילו תנאי תשלום זמינים?
      description: תנאים סטנדרטיים הם 30% מקדמה עם ההזמנה, 70% לפני משלוח. תנאי LC זמינים ללקוחות זכאים. צרו קשר עם צוות הפיננסים שלנו לדיון על תיאומים.
      icon: tabler:currency-dollar
    - title: כמה זמן לוקח הייצור?
      description: 'זמני הובלה טיפוסיים: סירות RIB 30-45 ימים, לוחות SUP 20-30 ימים, סירות מתנפחות 25-35 ימים. פיתוח מותאם מוסיף 15-30 ימים לאפיון פרוטוטיפ.'
      icon: tabler:calendar-clock
    - title: אילו תעודות מחזיקים המוצרים שלכם?
      description: תעודת CE לשווקי האיחוד האירופי, ייצור מאושר על ידי משמר החופים האמריקאי, מערכת איכות ISO, תאימות BSCI ותאימות חומרית REACH.
      icon: tabler:certificate
    - title: האם אתם מציעים אריזה מותאמת ומיתוג?
      description: כן. אנו מספקים אריזות מותאמות אישית עם הלוגו, הצבעים וזהות המותג שלכם. MOQ עבור אריזות מותאמות אישית תלוי בקטגוריית המוצר.
      icon: tabler:color-swatch
cta:
  title: צריך עזרה במציאת המשאב הנכון?
  subtitle: צור קשר עם הצוות שלנו לקבלת הנחיות מותאמות אישית על בחירת מוצרים, OEM שותפויות, או מפרטים טכניים.
  actions:
    - variant: primary
      text: צרו קשר עם הצוות שלנו
      href: /contact
