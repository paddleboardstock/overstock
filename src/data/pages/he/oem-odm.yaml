faq:
  title: OEM/ODM — שאלות נפוצות
  questions:
    - q: מהי כמות ההזמנה המינימלית (MOQ) עבור SUPs מתנפחים מותאמים אישית?
      a: לדגמים סטנדרטיים עם תבניות קיימות, MOQ מתחיל מ-5–10 יחידות לכל עיצוב. לתבניות וכלים מותאמים אישית MOQ מלאה, בדרך כלל יש 200+ יחידות. אנו עובדים עם סטארטאפים ומותגים מתפתחים כדי למצוא נקודות כניסה אפשריות.
    - q: מה MOQ המצב RIB לסירות מותאמות אישית?
      a: RIB דגמים מתחילים מ-2–5 יחידות לכל עיצוב עם תבניות קיימות, בעוד RIB שתבניות מותאמות אישית מלאות דורשות התחייבויות גדולות יותר. אנו עובדים עם סטארטאפים ומותגים מבוססים כדי למצוא נקודות כניסה ישימות.
    - q: כמה זמן OEM לוקח תהליך הדגימה?
      a: דגימות אב-טיפוס סטנדרטיות מושלמות בתוך 7–14 ימי עבודה לאחר אישור התכנון. ניתן לתת עדיפות להזמנות דחופות ל-5–7 ימים בתשלום נוסף.
    - q: מה ההבדל בין PVC Hypalon סירות מתנפחות לבין סירות מתנפחות?
      a: PVC קל יותר, זול יותר, ומציע גמישות מצוינת במזג אוויר קר.Hypalon (CSM) מספק עמידות עדיפה UV ועמידות לאוזון עם אורך חיים ארוך יותר (10–15 שנים לעומת 5–8 שנים). אנו ממליצים PVC לרוב השימושים הפנאי Hypalon ולשימושים מסחריים/מקצועיים.
    - q: האם אפשר להתאים אישית את הצורה והעיצוב של המתנפח?
      a: כן. צוות המחקר והפיתוח שלנו יכול לפתח תבניות מותאמות אישית לכל צורת גוף, קווי מתאר או תצורת צינור. אנחנו משתמשים CNCבתבניות אלומיניום מעובדות לדיוק ועקביות.
    - q: האם אתם מספקים שירותי ביקורת במפעל?
      a: אנו מקבלים ביקורות מפעלים באתר וצד שלישי במתקן שלנו בקינגדאו בשטח של 12,000 מ"ר בצ'ינגדאו. אנו מתחזקים ISO 9001 BSCI והסמכות ויכולים לשתף דוחות ביקורת בNDA-.
    - q: אילו תנאי משלוח אתם מציעים?
      a: אנו מציעים FOB תנאי Qingdao (סטנדרטי), CIF, DDP ותנאי משלוח. טעינת מכולות ומסמכי יצוא מלאים כלולים בכל OEM ההזמנות.
content_profiles:
  tagline: פרופילי מותגים
  title: OEM / ייצור מותג פרטי<br />לפי סוג לקוח
  subtitle: פרופילי מותג שונים מגיעים עם דרישות שונות — אנו מתאימים את OEMODM השירותים שלנו למודל העסקי, ההיקף ואסטרטגיית הכניסה לשוק שלכם.
  items:
    - title: מותגי כלי שיט סטארט-אפ
      subtitle: MOQעלייה נמוכה ומהירה
      description: יזמים ומייסדים שמשיקים את קו RIB הסירות הראשון שלהם, SUPs, או סירות מתנפחות. אתה צריך שותף ייצור שמתייחס למותג שלך כאל שלו — עם סף כניסה נמוך, גדלי אצווה גמישים, והכוונה עיצובית מעשית בכל שלב.
      features:
        - MOQ עד 2–5 יחידות (RIB) / 5–10 יחידות (SUP) לכל SKU
        - ספריית תבנית קיימת לדלג על עלויות הכלים
        - 'חבילת מיתוג מלאה: לוגו, גרפיקה בשפופרות, אריזה, תגיות תלייה'
        - תהליך עבודה עם דגימה ראשונה — אישור לפני הייצור
    - title: מותגים ימיים מבוססים
      subtitle: OEM קנה מידה עם CE/ISO ציות
      description: מותגי סירות, PWC או אביזרי ים קיימים מוסיפים כלי שיט מתנפחים לתיק המוצרים שלהם. אתה צריך איכות עקבית לאורך כל תקופת הייצור, עמידה ברגולציה לשווקים גלובליים, ויכולת להנדס במשותף גוף או צורות צינורות מותאמות אישית.
      features:
        - הנדסת תבניות תלת-ממדית מותאמת אישית לעיצובים קנייניים
        - CE 2013/53/EU, UKCAUSCG , תיעוד ציות
        - BSCI דוחות ביקורת חברתית על עמידה בקמעונאים
        - ניהול חשבון ייעודי + מעדיפות למקומות ייצור
    - title: מותגים DTC ומסחר אלקטרוני
      subtitle: אריזות מוכנות לקמעונאות בקנה מידה גדול
      description: מותגים שממוקדים אונליין ומוכרים דרך אמזון, שופיפיי או חנויות מקוונות משלהם. האריזה, חוויית הפתיחה ואיכות יחידה עקבית הם קריטיים. אתם זקוקים למפעל שמבין את מהירות הנסיעה ודינמיקת שיעור ההחזר במסחר אלקטרוני.
      features:
        - עיצוב קופסה מוכן לקמעונאות + הדפסת כרטיסי החדרה
        - אריזת ואקום / פלטת משלוח לחיסכון בעלויות משלוח
        - EAN / UPC ברקוד ותיעוד מוכן למכס
        - קונסולידציה של מכולות מעורבות לאופטימיזציה של עלות נחתה
    - title: מפעילי השכרה ואירוח
      subtitle: בניית צי ברמת ציוד לעסקים נופשיים והשכרה
      description: אתרי נופש, מרכזי ספורט ימי ומפעילי השכרה זקוקים לצי עמיד, ניתן לשירות עם מיתוג עקבי. אנו מספקים תמחור צי, מכולות בדגמים מעורבים ותמיכה בחלקי חילוף לאורך שנים של פעולה.
      features:
        - תמחור צי בהזמנות מכולות בדגמים מעורבים
        - אפשרויות צינורות ודקים מסחריים עמידים
        - ערכות חלקי חילוף והכשרה לתחזוקה
        - מיתוג עקבי ברחבי SUP, RIB, וציי קיאקים
