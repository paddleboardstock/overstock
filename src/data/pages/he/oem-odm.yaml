hero:
  tagline: OEM / ODM פתרון
  title: OEM & ODM ייצור עבור RIB סירות, סירות מתנפחות & SUP לוחות
  subtitle: מהרעיון למיכל — Paddle Board Overstock מספק שירותי OEM/ODM רחבי היקף עבור RIB סירות, סירות מתנפחות, SUP לוחות, קאייקים ודינג'ים עם MOQs נמוך, הנדסת תבניות 3D מותאמות אישית, ועמידה מלאה בתקני CE/BSCI.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock מתקן OEM/ODM בייצור בקינגדאו
direct_answer: Paddle Board Overstock הוא שותף OEM/ODM ישירות מהמפעל המספק התאמה אישית מלאה עבור RIB סירות, סירות מתנפחות ו-SUP לוחות, הכולל MOQs נמוך (2–5 יחידות עבור RIB, 5–10 יחידות עבור SUP), הנדסת תבניות 3D מותאמות אישית, ועמידה מלאה בתקני CE/BSCI. מיוצר במרכז הייצור בקינגדאו — מתקן בגודל 12,000 מ"ר עם תעודת ISO 9001.
