      sub: AQL 2.5 לכל ISO 2859
certifications:
  - title: CE הסמכה (EU 2016/425)
    standard: תקנות PPE (EU) 2016/425 | EN ISO 12402
    description: כל Paddle Board Overstock ציוד הבטיחות עומד CE בדרישות הסימון לפי תקנות ציוד ההגנה האישי האירופיות. כל מוצר נבדק באופן עצמאי על ידי TÜV Rheinland, גוף אירופי מהודיע. הסירות המתנפחות שלנו RIBs עומדות בדרישות דירקטיבת כלי השיט לפנאי 2013/53/EU (RCD) קטגוריה C ו-D.
    body: CE ההסמכה מכסה דרישות בריאות ובטיחות חיוניות למכשירי ציפה אישיים ולכלי שיט מתנפחים.TÜV ריינלנד בודקת את מתקן הייצור שלנו מדי שנה כדי לוודא עמידה מתמשכת.
  - title: SOLAS — בטיחות החיים בים
    standard: SOLAS פרק ג' | קוד LSA
    description: ה-Life Vest Pro עומד SOLAS בתקנות לפעילות ימית ימית ימית ומסחרית. נבדק לשמירת ציפה 24 שעות, התנפחות אוטומטית בעת הטבלה, וביצועים במצבי ים עד כוח 5. עומד בדרישות פרק III לחגורות הצלה בכלי שיט מסחריים.
    body: SOLAS אישור דורש בדיקה עצמאית על ידי גוף מודע לצורך ציפה, חוזק, נראות והפעלה אוטומטית. ה-Life Vest Pro שלנו נושא SOLAS אישור מלא עם הסמכת MED.
  - title: USCG סוג III / סוג V
    standard: 46 CFR חלק 160 |USCG אישור
    description: Paddle Board Overstock אפודי הצלה נבחרים עומדים בסיווג משמר החופים של ארצות הברית למכשירי סוג III (סיוע לציפה) ו-Type V (לשימוש מיוחד). מתאימים למים מוגנים, שיט חופי ופעולות מסחריות הדורשות USCGPFD מאושרים.
    body: USCG אישור דורש בדיקה על ידי מעבדה עצמאית המוכרת על ידי CG. אישור מסוג V כולל עיצובים מתנפחים היברידיים הדורשים הפעלה ידנית או אוטומטית.
  - title: BSCI ציות חברתי
    standard: קוד ההתנהגות של אמפורי BSCI
    description: המפעל שלנו עובר ביקורת שנתית במסגרת Amfori Business Social Compliance Initiative BSCI(). זה מאמת נהלי עבודה אתיים, בטיחות במקום העבודה, שעות עבודה הוגנות וניהול סביבתי במתקן הייצור שלנו בשטח של 12,000 מ"ר.
    body: BSCI עמידה בדרישות היא תנאי מוקדם לקמעונאים ויבואנים אירופאים. BSCI הדירוג הנוכחי שלנו הוא "C" (טוב), שנבדק על ידי SGS.
  - title: REACH RoHS & ציות
    standard: REACH תקנות האיחוד האירופי (EC) 1907/2006 |RoHS הנחיה 2011/65/האיחוד האירופי
    description: כל PVC התרכובות, הדבקים והציפויים המשמשים Paddle Board Overstock במוצרים עומדים REACH בתקנות בטיחות כימיות של האיחוד האירופי RoHS ובהגבלות חומרים מסוכנים. גיליונות נתוני בטיחות חומרים (MSDS) זמינים לכל קו מוצר.
    body: REACH עמידה בדרישות מבטיחה שאין חומרים מוגבלים ב-SVHC מעבר למגבלות הסף. בדיקות מעבדה סדירות של צד שלישי מאמתות עמידה מתמשכת בכל אצווה לייצור.
  - title: ISO 9001:2015 ניהול איכות
    standard: ISO 9001:2015 |TÜV מוסמך ריינלנד
    description: מערכת ניהול האיכות שלנו ISO מוסמכת 9001:2015 על ידי TÜV Rheinland, וכוללת תכנון, ייצור, בדיקות ושירות לאחר מכירה. ביקורות מעקב שנתיות מבטיחות שיפור מתמשך ושליטה בתהליכים.
    body: ISO הסמכת 9001 דורשת מדיניות איכות מתועדת, ביקורות פנימיות, סקירות ניהול, נהלי פעולה מתקנת ורשומות ייצור ניתנות למעקב.
testimonial:
  quote: רכשנו ציוד בטיחות ממספר ספקים ברחבי אסיה.Paddle Board Overstock הוא היצרן היחיד שסיפק CE תיעוד מלא, SOLAS תעודות ודוחות בדיקה של צד שלישי מראש — מבלי לבקש.
  author: אריק לינדסטרום
  title: קצין בטיחות
  company: אספקת הים הבלטית
  location: פינלנד
content_overpressure:
  tagline: בטיחות לחץ יתר
  title: RIB לחץ צינור<br />ניהול באקלים חם
  subtitle: לחץ הצינורות המתנפחים עולה עם הטמפרטורה. הבנה וניהול לחץ יתר מונעים נזק ומבטיחים פעולה בטוחה בסביבות טרופיות ומדבריות.
  items:
    - title: שסתומי שחרור לחץ של בויל
      description: Paddle Board Overstock RIB הצינורות מצוידים בשסתומי שחרור לחץ יתר שמוציאים אוטומטית לחץ עודף מעל המקסימום המדורג. מונע מתח בתפר ואפשרות להתפוצצות צינור מחימום סולארי.
      icon: tabler:gauge
    - title: שינוי לחץ מהבוקר עד הצהריים
      description: צינור מנופח ל-3.5 PSI ב-20 מעלות עשוי להגיע ל-4.5+ PSI בחשיפה לשמש של 40 מעלות צלזיוס. תמיד יש לנפח לקצה התחתון של הטווח המומלץ באקלים חם ולתת לשסתום ההקלה לנהל את הלחץ העודף.
      icon: tabler:sun
    - title: לחצים מומלצים לתפעול
      description: 'PVC צינורות: 3.0-3.5 PSI פועלות, 4.5 PSI מקסימום. Hypalon שפופרות: 3.5-4.0 PSI פועלות, PSI 5.0 מקסימום. תמיד בדוק דירוג פי 1.25 (4.4 PSI PVCל, 5.0 PSI Hypalonל) לפי Paddle Board Overstock תקני בקרת איכות.'
      icon: tabler:chart-bar
    - title: שיטות עבודה מומלצות לחשיפה לשמש
      description: אחסנו RIBs באזורים מוצלים כאשר אינם בשימוש. השתמשו UVבכיסויי הגנה לעגינה ממושכת. בדקו והתאימו את לחץ הצינור לפני ואחרי שעות השיא של השמש. לעולם אל תעברו את הלחץ המרבי המסודר.
      icon: tabler:umbrella
    - title: דה-פרסוריזציה חירום
      description: אם הצינור מרגיש יציב מדי או שסתום הקלה מאוורר, שחרר אוויר דרך שסתום Halkey-Roberts או שסתום צבאי עד שהלחץ יחזור לטווח הפעלה. יש לשאת מד לחץ לקריאות מדויקות.
      icon: tabler:alert-circle
