hero:
  tagline: בְּטִיחוּת
  title: תקני בטיחות והסמכה
  subtitle: כל Paddle Board Overstock מוצר עובר בדיקות קפדניות, ו-64 CEדגמים מוסמכים עומדים בתקני בטיחות בינלאומיים לשימוש פנאי ומקצועי.ISO מפעל מוסמך 9001.
trust_bar:
  items:
    - value: CE 6185
      label: מוסמכת כלי שיט פנאי
      sub: TÜV ריינלנד שנבדקה
    - value: SOLAS
      label: תואם לבטיחות ימית
      sub: ציפה 24 שעות אומתה
    - value: ISO 9001
      label: ניהול איכות
      sub: נבדק על ידי TÜV Rheinland
    - value: 99.3%
