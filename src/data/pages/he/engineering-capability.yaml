content_capability:
  tagline: יכולת הנדסית
  title: מה ההנדסה שלנו<br />הצוות מספק
  subtitle: הנדסה של Aquafarer מכסה את מחזור החיים המלא של המוצר — מתחקר שוק ועיצוב רעיוני דרך פרוטוטייפ, בדיקות, וייצור המוני.
  items:
    - title: עיצוב תעשייתי
      description: צוות העיצוב התעשייתי שלנו עובד על פי דרישות הלקוח, מחקר שוק וניתוח תחרותי כדי לפתח קונספטים למוצרים שמשלבים אסתטיקה, פונקציונליות ויכולת ייצור. אנו מייצרים סקיצות דו-ממדיות, הדמיות תלת-ממדיות ומסמכי מפרט לבדיקת הלקוח לפני התחייבות לייצור הכלים.
      features:
        - פיתוח קונספט ומחקרי ישימות
        - שרטוטי עיצוב דו-ממדיים ותצוגות תלת-ממדיות
        - בחירת חומר ומפרט
        - ניתוח תכנון לייצור (DFM)
        - הערכה ארגונומית ובטיחותית
    - title: הנדסה מבנית
      description: מהנדסי המבנה שלנו מתמחים באדריכלות של סירות מתנפחות — עיצוב גוף הסירה, תצורת תאי הצינור, הנדסת הליבה, ופיזור עומסים. כל עיצוב נבדק על שלמות מבנית, אופטימיזציית משקל, וציות לסטנדרטים הרלוונטיים (CE, ISO, AS).
      features:
        - עיצוב גוף סירת פיברגלס בצורת V עמוק עם זוויות דדרייז מחושבות
        - תצורת צינור מרובה תאיים לבטיחות וציפה
        - Drop-stitch מפרט ליבה ואופטימיזציית צפיפות
        - ניתוח מרכיבי יסוד סופי לרכיבים נושאי עומס
        - חישובי חלוקת משקל ויציבות
    - title: דוגמנות תלת-ממדית ו-CAD
      description: כל עיצובי המוצר מפותחים בתכנת CAD תלת-ממדית לפני תחילת יצירת אב-טיפוס. המהנדסים שלנו משתמשים ב-SolidWorks ו-Rhino 3D לדוגמנות המוצר, מה שמאפשר ללקוחות לבדוק כל פרט — מפרופיל הצינור ועד לתצורת הקונסולה — לפני שמתחייבים לייצור.
      features:
        - דוגמנות CAD תלת־ממדית מלאה ב‑SolidWorks וב‑Rhino 3D
        - הצגה בפירוט פוטו-ריאליסטי למצגות ללקוח
        - חבילות שרטוט טכניות לייצור
        - עיצוב תבניות וכלים מתוך מודלים תלת-ממדיים
        - העברת נתונים ישירה מ-CAD ל-CNC לחיתוך מדויק
    - title: פרוטוטייפ ובדיקות
      description: לפני ייצור המוני, כל מוצר חדש עובר שלב אב טיפוס. אנו בונים אב-טיפוסים פונקציונליים להערכת הלקוח, ואז מעמידים אותם מול פרוטוקול המבחנים המלא שלנו — מבחני לחץ, מבחני יציבות, מבחני עומס וניסויי מים. חזרות עיצוב בשלב האב-טיפוס מהירות ועלות-יעילות.
      features:
        - כלי אב טיפוס מהיר (זמן הסבול 15-20 יום)
        - פרוטוטיפ פונקציונלי להערכה בעולם האמיתי
        - פרוטוקול בדיקה מלא לפני אישור הייצור
        - זִכְרוּר תִּכנוּן חוֹזֵר על בסיס תוצאות המבחן
        - נקודת אישור הלקוח לפני ייצור הכלים
    - title: שילוב אבזרים מותאמים אישית
      description: רבים מ projets OEM דורשים אינטגרציה של אביזרים שסופקו על ידי הלקוח או צד שלישי — קונסולות מותאמות אישית, מושבים מיוחדים, מערכות אלקטרוניות, מתקני ציוד צלילה או אלמנטים של מיתוג. צוות ההנדסה שלנו מנהל את עיצוב האינטגרציה, התאמת המבנה ואימות האיכות של כל האביזרים.
      features:
        - עיצוב הקונסולה ופריסת לוח הכלים
        - התאמת מושבים וריפודים בהתאמה אישית
        - תכנון מערכת אלקטרונית וחיווט
        - מערכות הרכבה לציוד צלילה והצלה
        - מפרטי מיתוג ויישום גרפי
content_process:
  tagline: תהליך פיתוח
  title: מהרעיון<br />לייצור
  subtitle: תהליך פיתוח המוצר שלנו עוקב אחרי זרימת עבודה מבוססת ב-6 שלבים, שמטרתה למזער סיכונים, לקצר זמנים ולהבטיח מוכנות לייצור מהיום הראשון.
  stages:
    - stage: '01'
      title: דרישות ומחקר
      duration: 1-2 שבועות
      description: אנו עובדים עם הלקוח כדי להגדיר את מפרטי המוצר, דרישות שוק היעד, צרכי תאימות רגולטורית ומטרות מסחריות. שלב זה מייצר מסמך דרישות מוצר (PRD) שמנחה את כל העבודה הבאה.
      deliverables: PRD, ניתוח שוק, השוואת מתחרים, הערכת עלות ראשונית
    - stage: '02'
      title: עיצוב קונספט
      duration: 2-3 שבועות
      description: צוות העיצוב התעשייתי מפתח קונספטים למוצר על בסיס PRD. מוצגות מספר אפשרויות עיצוב עם הדמיות תלת-ממדיות, המלצות לחומרים והערכות הנדסיות ראשוניות. הלקוח בוחר את הכיוון לפיתוח מפורט.
      deliverables: הדמיות קונספט תלת-ממדיות, מפרטי חומרים, נימוקי עיצוב, חשבון כמויות מוקדם
    - stage: '03'
      title: הנדסה מפורטת
      duration: 2-4 שבועות
      description: הקונספט הנבחר מהונדס באופן מלא — דגם תלת-ממדי ב-CAD, ניתוח מבני, תצורת צינורות, עיצוב גוף, שילוב אביזרים ותיעוד ייצור. כל הממדים, החומרים והתהליכים מוגדרים לכלי העבודה.
      deliverables: מודל CAD תלת מימדי מלא, שרטוטים הנדסיים, BOM סופי, מפרטי ציוד, תוכנית בקרת איכות
    - stage: '04'
      title: בניית אב טיפוס
      duration: 2-3 שבועות
      description: כלי פרוטוטיפ מיוצרים ודגימות פונקציונליות נבנות. הלקוח בודק את הפרוטוטיפ מול דרישות מפרט המוצר (PRD). מתקיימים בדיקות בהתאם לפרוטוקול שהוסכם. מתבצעים שינויים בעיצוב על בסיס המשוב לפני ייצור הכלים.
      deliverables: פרוטוטיפ פונקציונלי, דוח בדיקה, יומן תיקון עיצוב, מסמך אישור לקוח
    - stage: '05'
      title: כלי ייצור
      duration: 2-3 שבועות
      description: ברגע שהאבטיפוס מאושר, מתחילים בייצור הכלים - תבניות, תבניות ריתוך, תוכניות חיתוך, מתקני הרכבה. מסמכי בקרת איכות וקריטריוני בדיקה מופקדים סופית. מתבצע ריצת ניסיון לאימות התהליך.
      deliverables: כלי ייצור, תיעוד תהליך, תכנית בדיקת איכות, דוח ריצת ניסיון
    - stage: '06'
      title: ייצור המוני ובקרת איכות
      duration: בת המשך
      description: הייצור המלא מתחיל עם בקרת איכות בתהליך בכל שלב. מאמרים ראשונים נבדקים ומאושרים לפני שחרור האצווה. ניטור איכות מתמשך, מעקב אחר ליקויים ושיפור מתמיד במהלך כל מחזור חיי הייצור.
      deliverables: לוח ייצור, דוחות בקרת איכות, רשומות מעקב אחר אצוות, תיעוד שינוע
content_customization:
  tagline: אפשרויות התאמה אישית
  title: מה יכול להיות<br />מותאם אישית
  subtitle: כמעט כל היבט במוצרים שלנו ניתן להתאמה כדי לענות על דרישות הלקוח. להלן קטגוריות ההתאמה הנפוצות ביותר.
  columns: 3
  items:
    - title: סיפון ומבנה
      description: אורך גוף מותאם אישית, רוחב סיפון, זווית דיידרייז, קוטר צינור, תצורת תא, וסוג חומר.
      icon: tabler:sailboat
    - title: צבעים וגרפיקה
      description: צבע הצינור (PVC/Hypalon), צבע ציפוי הגוף, צבע הקונסולה, גרפיקה על הדק, מיקום הלוגו ועיצוב אריזה.
      icon: tabler:palette
    - title: קונסולה ובקרות
      description: קונסולה מרכזית, קונסולה צדדית, או הגה בהגה. פריסת לוח כלי מדידה מותאמת אישית, מיקום מתגים ומיקום ההגה.
      icon: tabler:steering-wheel
    - title: מושב וריפוד
      description: מושבי רוכב, ספסלי ישיבה, ריפוד יוקרתי, תפירה בצבע תואם, תצורות מתקפלות או ניתנות להסרה.
      icon: tabler:armchair
    - title: אביזרים וציוד
      description: סולמות צלילה, מדפי מיכלים, עמודי גרירה, גגות T, גגות בימיני, מערכות סאונד, אלקטרוניקת ניווט וציוד בטיחות.
      icon: tabler:backpack
    - title: אריזה ומיתוג
      description: אריזות קמעוניות מותאמות אישית, קופסאות לתווית פרטית, קרטוני משלוח עם סימני מותג, תגי תלייה ומדריכי משתמש בשפת הלקוח.
      icon: tabler:box
content_industries:
  tagline: יישומים בתעשייה
  title: פתרונות הנדסיים<br />לפי תעשייה
  subtitle: צוות ההנדסה שלנו פיתח מוצרים למגוון רחב של יישומים ימיים — כל אחד עם דרישות קריטיות וקריטריוני ביצועים ייחודיים.
  columns: 3
  items:
    - title: מבצעי צלילה
      description: דקים מחוזקים, שילוב סולמות צלילה, מערכות אחסון מכלים ופלטפורמות יציבות למרכזי צלילה מסחריים ברחבי העולם.
      icon: tabler:lifebuoy
    - title: חילוץ ומצבי חירום
      description: עיצובי גוף מהיר, דקים שמתנקזים בעצמם, מערכות הרכבת ציוד ותצורות בטיחות מרובות תא לפעולות חירום.
      icon: tabler:alert-triangle
    - title: תיירות ימית
      description: תצורות נוחות לנוסעים, שילוב הצללות, מערכות עלייה וסידורים חסכוניים בדלק לפעולות העברת מבקרים לאיים.
      icon: tabler:beach
    - title: יאכטות שירות
      description: עיצובים קומפקטיים לאחסון בדוויג, אפשרויות גימור יוקרתיות, התאמת צבעי ספינת האם ותכונות גרירה בעלות ביצועים גבוהים.
      icon: tabler:sailboat
    - title: דיג וחקלאות מים
      description: תצורות דק שטוח, שילוב מיכל חיים, סידורי מחזיקי חכות, חומרה עמידה בפני קורוזיה לחשיפה מתמשכת למי ים.
      icon: tabler:fish
    - title: נמל ותעשייה
      description: חיזוק גוף כבד, תצורות סירות עבודה, סידורי העברת צוות והטמעת ציוד לפעולות במים עמוקים.
      icon: tabler:ship
cta:
  title: תתחילו פרויקט פיתוח מוצר
  subtitle: שתפו את דרישות המוצר שלכם, שוק היעד ולוח הזמנים — צוות ההנדסה שלנו יגיב עם הצעת פיתוח והערכת עלות בתוך 48 שעות.
  actions:
    - variant: primary
      text: התחל את הפרויקט שלך
      href: /contact
    - text: צפו בתוכנית OEM/ODM
      href: /oem-odm-blueprint
