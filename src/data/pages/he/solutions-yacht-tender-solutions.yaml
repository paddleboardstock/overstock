content_challenge:
  tagline: האתגר
  title: סירות עזר ליאכטות דורשות<br />ביצועים והצגה
  subtitle: סירת עזר היא יותר מסירה קטנה — היא הרחבה של הספינה הראשית והצהרה על איכות.
  paragraphs:
    - בעלי יאכטות וקפטנים צריכים סירות שיבצעו היטב, יאוחסנו קומפקטית, ויוצגו בצורה יפה. הסירה צריכה להשלים את האסתטיקה של היאכטה תוך מתן תחבורה אמינה לאורחים ולצוות.
    - '**אחסון הוא קריטי** — הסירה חייבת להיכנס על הסיפון, במוסך או על דביטים. משקל חשוב למערכות השקה והשבה. Paddle Board Overstock RIBs מציעות יחס כוח-למשקל מצוין עם פרופילי אחסון קומפקטיים.'
    - '**ציפיות לביצועים גבוהים** — האורחים מצפים לנסיעה חלקה ויבשה כאשר מועברים לחוף. אפשרויות המנוע חייבות לשלב בין מהירות, טווח ורמות רעש לניסיון פרימיום. עבור פעולות השכרה, הסירה פועלת מדי יום וחייבת לעמוד בשימוש תכוף.'
    - '**מראה חשוב** — סירה שאינה תואמת או בלויה פוגעת בהצגת היאכטה הכוללת. צבעי צינורות מותאמים אישית, ריפודים ומיתוג מבטיחים שהסירה תיראה כחלק מהיאכטה.'
content_solution:
  tagline: הפתרון שלנו
  title: תצורות סירות עזר<br />לכל יישום יאכטה
  subtitle: סירות העזר Paddle Board Overstock RIB יכולות להיות מותאמות אישית כדי להתאים לספינה שלך, סוג הפעולה ודרישות האחסון — ממפרטי בוני סופריאכטות ועד תוכניות צי השכרה.
  list:
    - צבעי צינורות מותאמים אישית כדי להתאים או להשלים את הספינה הראשית — כל צבע RAL זמין לHypalon או לPVC צינורות
    - ריפודים ותפירה מותאמים אישית — ויניל ימי פרימיום עם התאמת צבעים ורקמת לוגו
    - הגה או היל תדרוך — בחר לפי דפוס השימוש והעדפת המפעיל
    - סיפון פיברגלס Deep-V לנסיעה חלקה ויבשה בתנאי ים משתנים
    - אחסון קומפקטי — ריקות או קינון לאחסון במרפסת, תא אחסון או דביט
    - Hypalon צינורות UV לעמידות ולשימור מראה לטווח ארוך
    - נקודות הרמה וטבעות גרירה הן סטנדרטיות בכל הדגמים
    - כיסוי קשת אופציונלי, כיסוי מלא ומגני שפשוף מגנים
    - 'טווח מנוע: 15 HP עד 60 HP — תצורות חיצוניות או טילר'
    - OEM/תיוג פרטי זמין לבוני יאכטות וסוחרי ים
content_segments:
  tagline: פרופילי לקוחות
  title: פתרונות סירות עזר ליכטות<br />לפי סוג הלקוח
  subtitle: למגזרים שונים בתעשיית היאכטות יש דרישות ייחודיות.Paddle Board Overstock מגדיר מכרזים שיתאימו לכל יישום.
  items:
    - title: סופריאכטות בילדרס
      subtitle: OEM אינטגרציה עדינה — מידות, צבעים וחומרים מותאמים אישית
      description: 'בוני יאכטות מתמודדים עם אתגר חוזר: לכל כלי חדש יש מגבלות מימד ייחודיות, מגבלות משקל וציפיות אסתטיות. הספינה חייבת להשתלב בצורה מושלמת עם מערכת הדביט של כלי האם, להתאים במידות מדויקות של המוסך, ולהתאים לשפת העיצוב של יאכטה בשווי מיליוני יורו. כל אי-התאמה — צבע צינור שגוי, מיקום לא נכון של נקודת הרמה, משקל לא תואם — מעכב את האספקה ומשקף לרעה על הקבלן.Paddle Board Overstock עובד ישירות עם צוותי רכש ועיצוב של הבנאים כדי לספק טנדרים עם צבעי צינורות RAL מותאמים אישית, ריפוד תואם, לוחות קונסולה ממותגים OEM וחבילות תיעוד מלאות.'
      features:
        - מפרטים מותאמים אישית למימד התואמים מגבלות של מוסך ודביט
        - כל צבע צינור RAL וריפוד תואם — דוגמאות אישור עיצוב שסופקו
        - OEM מיתוג על קונסולה, צינורות ומשענות מושבים
        - אימות נקודת הרמה והתאמת דביט לכל מודל
        - משקל גוף מותאם למערכות שיגור והחזרה מוגדרות
        - תזמון משלוחים בכמויות גדולות תואם את לוחות הזמנים של הייצור
    - title: חברות ניהול יאכטות
      subtitle: מכרזים סטנדרטיים לצי — תמיכה עולמית, זמן השבתה מינימלי
      description: חברות ניהול מפקחות על מספר יאכטות הפועלות ברחבי הים התיכון, הקריביים, האוקיינוס השקט הדרומי ומעבר לו. הצורך המרכזי שלהן הוא אמינות — ספינת תמיכה שבורה בנמל מרוחק משמעותה שעות נוספות של הצוות, תלונות אורחים והחלפות יקרות של הרגע האחרון. מפרטי צי סטנדרטיים מקצרים את זמן האימון של הצוות בין כלי שיט ומפשטים את ניהול חלקי חילוף.Paddle Board Overstock מציע תמחור צי מרובי כלי שיט, מפרטים עקביים בין הזמנות, ותמיכה גלובלית בחלקי חילוף לחברות ניהול עם כלי שיט באזורים שונים.
      features:
        - מפרטים סטנדרטיים לכל הצי המנוהל
        - חלקי חילוף ניתנים להחלפה בכל ספינות התמיכה של הצי
        - הנחות על תמחור צי ונפח להזמנות רב-יחידות
        - זמינות חלקי חילוף עולמית — משלוח מהיר לכל נמל
        - תיעוד שירות ותחזוקה עקבי לצוות
        - תיאום אספקה רב-יחידה למיקומי כלי שיט שונים
    - title: מפעילי השכרת יאכטות
      subtitle: פעילות יומית בתדר גבוה — עמידות מבלי לפגוע במראה
      description: 'מכרזי השכרה מתמודדים עם לוח זמנים תפעולי קשה במיוחד בתעשיית היאכטות: העברות אורחים יומיות, נסיעות לחוף, תמיכה בספורט ימי, ומכרזים בנמל — לעיתים קרובות 200+ פעילויות בעונת השכירות. המכרז חייב להיראות מושלם בכל העברת אורחים תוך עמידה רציפה לעלייה למטוס, חשיפה למי מלח ושעות מנוע. פגיעה במראה היא עניין עסקי ישיר — מכרז שחוק משפיע על ביקורות האורחים ומחירי השכירות.Paddle Board Overstock מכרזי השכר מתאימים לריפוד משודרג, צינורות כבדים Hypalon ואזורי טיפול מחוזקים לעמידות ארוכת טווח השומרת על איכות הצגה.'
      features:
        - צינורות Hypalon כבדים – אורך חיים של 5-8 שנים בשירות צ'רטר יומי
        - דודי עלייה מחוזקים וקווי אחיזה לטיפול לשימוש תדיר
        - ריפוד ויניל עמיד לכתמים איכותי — ניקוי קל בין שכרות
        - משטחים עליונים נגד החלקה שקל לנקות
        - חבילות מנועים חיצוניים אמינות עם גישה קלה לשירות עבור זמן סיבוב קצר
        - חומרים בדרגת קוסמטיקה שמחזיקים במראה לאורך כל עונות הצ'רטר
    - title: סוחרי יאכטות וסוכנים
      subtitle: אספקת מיכון מהימנה להשלמת הספינה ושווי מכירה חוזרת
      description: סוחרים וברוקרים זקוקים לאספקה יציבה של סירות עזר איכותיות שמשלימות את הספינות שהם מוכרים — מתאימות למיצוב המותג ומשפרות את חוויית הקנייה. סירת עזר לא עקבית או עיכוב באספקה עלול לעכב מסירת יאכטה או לפגוע בהצגת הרשימה. סוחרים זקוקים לאיכות עקבית בין המשלוחים, לזמני אספקה אמינים ומחירים תחרותיים כדי לשמור על מרווחי הרווח. Paddle Board Overstock מציעה תוכניות מלאי לסוחרים עם לוח זמנים אספקה עונתי, אפשרויות מיתוג משותף לתצוגת תצוגות וחלוקה עדיפות בעונת השיא.
      features:
        - תוכניות אחסון מלאי עם דגמים זמינים על פי דרישה
        - תזמון משלוחים עונתי מותאם ללוח מסירת אחריות
        - שותפות מותגית של הסוחר על קונסולות וצינורות לתצוגת אולם תצוגה
        - איכות ומפרט עקביים בכל ההזמנות באצוות
        - תמחור ספק תחרותי עם שכבת נפח
