hero:
  tagline: הצוות שלנו
  title: האנשים שמאחורי Aquafarer<br />— מהנדסים חירות על המים
  subtitle: נוסדה בשנת 2012 בצ'ינגדאו, סין, Aquafarer נבנתה על ידי מהנדסי ים, מדעני חומרים וחובבי ספורט ימי שהאמינו בהפיכת כלי שיט מתנפחים ברמת מקצועיות לנגישים ברחבי העולם.
  image:
    src: /images/team-all.webp
    alt: תצלום צוות מלא — הנדסה, ייצור ומנהיגות
founding:
  tagline: הייסוד שלנו
  title: ממפעל חופי<br />אל מתקן בגודל 12,000 מ״ר
  subtitle: Aquafarer נוסדה על ידי צוות של מהנדסי ים עם עשרות שנות ניסיון משולב בתכנון סירות מתנפחות, ייצור PVC/Hypalon, וייצור ציוד ימי עולמי.
  items:
    - title: 'הוקם: 2012'
      description: הוקמה בצ'ינגדאו, סין — מרכז ימי חשוב עם מסורת עמוקה בבניית אוניות.
      icon: tabler:calendar
    - title: 200-300 עובדים
      description: כולל 50+ מהנדסי מחקר ופיתוח, אנשי בקרת איכות, וטכנאי ייצור.
      icon: tabler:users
    - title: מתקן בגודל 12,000 מ"ר
      description: מפעל ייצור ייעודי עם 6 קווי ייצור עבור RIBs, סירות מתנפחות, ולוחות SUP.
      icon: tabler:building-factory
    - title: 50+ מדינות שניתנה להן שירות
      description: ייצוא לאירופה, אמריקות, המזרח התיכון, אסיה-פסיפיק ואפריקה.
      icon: tabler:globe
leadership:
  tagline: מנהיגות
  title: מנהיגות בניהול והנדסה
  subtitle: צוות ההנהגה שלנו מביא יחד מומחיות עמוקה בהנדסת ים, סחר בינלאומי וניהול איכות.
