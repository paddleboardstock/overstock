  items:
    - title: מייסד ומנכ״ל
      name: טובי ליו
      description: 15 שנים בייצור ימי. קודם לכן ניהל מחקר ופיתוח בחברת סירות סינית גדולה. מחזיק במספר פטנטים בעיצוב סירות מתנפחות.
      icon: tabler:crown
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-toby-liu-team.webp
    - title: מהנדס ראשי
      name: ג'אנג ווי
      description: 20+ שנים בייצור PVC/Hypalon ועיצוב גוף עמוק-V. לשעבר מנהל טכני בחברת הנדסת ימית אירופית.
