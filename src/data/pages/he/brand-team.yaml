      icon: tabler:briefcase
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: פילוסופיית עיצוב
  title: עיצוב מונחה הנדסה<br />— כל פרט חשוב
  subtitle: פילוסופיית ההנדסה שלנו מבוססת על שלוש עקרונות שמנחים כל מוצר שאנו בונים.
  list:
    - 'אמינות קודם: כל מוצר נבדק כדי לעמוד בתנאי עולם אמיתי — מפעולות חירום במים קרים ועד השכרות במתקני נופש טרופיים. אנו מהנדסים מעבר למה שצריך במקום שהכי חשוב.'
    - 'דיוק בייצור: המתקנים שלנו משתמשים בחיתוך מתקדם, ריתוך בתדר גבוה ובדיקת לחץ אוטומטית. כל תפר, כל שסתום, כל חיבור עומדים במפרטים שתועדו.'
    - 'חדשנות מתמשכת: צוות ה-R&D שלנו מעריך באופן רציף חומרים חדשים, שיטות ייצור ושיפורי עיצוב. אנחנו לא מחכים לבעיות — אנחנו צופים אותן.'
