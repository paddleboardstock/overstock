content_challenge:
  tagline: האתגר
  title: דרישות למחקר ימי<br />פלטפורמות יציבות ומוכנות לציוד מדעי
  subtitle: סירות מחקר מדעיות חייבות לספק פלטפורמה יציבה לציוד רגיש, פעולה שקטה כדי לא להפריע לחיי הבר ופריסות גמישות לציוד מחקר מגוון.
  paragraphs:
    - מחקר ימי וניטור סביבתי דורשים סירות עבודה שמשרתות כמעבדות ניידות. בשונה מסירות מסחריות או פנאי, RIBs מחקר חייבות להכיל ציוד אלקטרוני רגיש, ציוד לדגימות מים ומשקעים, ולפעמים גם הובלת דגימות חיות — וכל זאת תוך שמירה על פלטפורמה יציבה לאיסוף נתונים מדויק.
    - '**יציבות הפלטפורמה היא קריטית** — סונאר, מכשירי הד הלאה ומכשירי CTD (מוליכות, טמפרטורה, עומק) דורשים גוף יציב במנוחה ובמהירות נמוכה. גלים או תנועות גוף מיותרות מוסיפות רעש לנתונים המדעיים. גוף Deep-V עם תכונות יציבות טובות הוא חיוני.'
    - '**אינטגרציה של ציוד** — סירות מחקר צריכות נקודות הרכבה לאנטנות GPS, משדרי סונאר, זרועות דגימה וציוד רישום נתונים. מקום בקונסולה חייב להכיל מספר תצוגות, הפצת חשמל לכלים ואחסון בטוח לאלקטרוניקה רגישה.'
    - '**פעולה שקטה** — לסקרי ביולוגיה ימית וניטור סביבתי, רעש מנוע ורטט גוף יכולים להפחיד את בעלי החיים הימיים ולהשפיע על תצפיות התנהגותיות. תצורות מנוע חיצונות שקטות ועיצובים מגופים מופחתי רטט חשובים למטרות מחקר.'
    - Paddle Board Overstock RIBs מחקר מיועדות עם פלטפורמות גוף יציבות, מערכות הרכבת ציוד משולבות ותצורות מנוע חיצונות שקטות ליישומים מדעיים וסביבתיים.
content_solution:
  tagline: הפתרון שלנו
  title: מחקר ייעודי RIBs<br />לעבודה מדעית וסביבתית
  subtitle: כל Paddle Board Overstock RIB מחקר מוגדרת כפלטפורמה יציבה הניתנת להתאמה אישית לציוד מדעי וציוד דגימות שדה.
  list:
    - גוף מפיברגלס Deep-V עם יציבות מצוינת במנוחה ובמהירות סקר נמוכה
    - פריסת דק שטוחה עם לוחות להרכבת ציוד סונאר, GPS ודגימה
    - קונסולה מוגדרת למספר תצוגות — מפלוט, סונאר, רישום נתונים
    - חלוקת הספק עזר של 12V ו-24V עבור מכשירים מדעיים
    - מנוע חיצוני שקט עם 4 פעימות — רעידות ורעש מינימליים בסקרי חיות בר
    - עיצוב גוף אופציונלי עם גל נמוך למינימום הפרעות במהלך איסוף הנתונים
    - צבעים מותאמים אישית למיתוג מוסדות מחקר וזיהוי צי
content_segments:
  tagline: פרופילי מחקר
  title: פתרונות למדעי הים<br />לפי סוג יישום
  subtitle: יישומי מחקר שונים דורשים כלי שיט ייחודיים — מפלטפורמות הוראה באוניברסיטאות ועד כלי סקר סביבתיים ועד ניטור איכות מיםRIBs.
  items:
    - title: תוכניות מדעי הים באוניברסיטה
      subtitle: פלטפורמות הוראה, טיולי סטודנטים, מחקר חופי
      description: אוניברסיטאות למדעי הים ומחלקות לאוקיינוגרפיה זקוקות לסירות עבודה אמינות ורב-תכליתיות להוראת קורסי שטח, פרויקטים מחקריים לסטודנטים וסקרים חופיים בהובלת סגל. הסירה חייבת להיות קלה לתפעול עבור סטודנטים תחת פיקוח, יציבה מספיק לפריסת מכשירים מעשית, ועמידה מספיק לשימוש תדיר על ידי משתמשים רבים לאורך תקופות אקדמיות. מגבלות תקציב בסביבות אקדמיות הופכות את היעילות בעלות ותחזוקה נמוכה לשיקולים חשובים.
      features:
        - פלטפורמה יציבה לפריסת מכשירים ושיקום של תלמידים
        - הפעלה קלה — תצורת טילר או קונסולה בודדת לשימוש סטודנטים מפוקח
        - צינורות עמידים Hypalon לנחיתות תכופות בחוף ולטיפול בסטודנטים
        - התקנת ציוד לסונאר ברמת הוראה, דיסק סקי וציוד דגימה
        - אפשרות חסכונית PVC לתוכניות אקדמיות עם תקציב מוגבל
    - title: מכוני מחקר ימיים
      subtitle: סקר RIBs עם אינטגרציה של מכשירים, GPS, ציוד דגימה
      description: ארגוני מחקר ימיים ייעודיים המבצעים סקרים חופיים וימיים זקוקים לסקר מקצועי RIBs עם ציוד משולב. כלי שיט אלו נושאים מערכות סונאר למיפוי בתימטרית, פרופיילרים של CTD לניתוח עמודות מים, דגמי משקעים וציוד איסוף ביולוגי. הסירה חייבת לספק פלטפורמה יציבה במהירויות סקר נמוכות, לספק שטח מספיק על הסיפון לפריסת ציוד, ולספק הספק נקי של 12V/24V לאלקטרוניקה.
      features:
        - הרכבה משולבת של מתמר סונאר — תצורת גוף או טרנסום
        - התקנת אנטנת GPS ואינטגרציה עם קונסולה לניווט ברמת סקר
        - אזור פריסת CTD ודגימת מים עם נקודות חיבור מאובטחות
        - חלוקת הספק עזר ב-12V/24V עבור מכשירים ורוגרי נתונים
        - יציב במהירות איטית (3-6 קשר) לדיוק קו המדידה
        - אופציה של מסגרת A או Davit לפריסת ציוד דגימה כבד יותר
    - title: ניטור ושימור סביבתי
      subtitle: סקרים אקולוגיים, תצפיות על חיות בר, הערכת בתי גידול
      description: ארגונים סביבתיים, סוכנויות ממשלתיות וארגוני שימור מבצעים סקרים אקולוגיים ימיים, ניטור אוכלוסיית חיות בר והערכות בתי גידול. פעולות אלו דורשות כלי שיט שקטים ובעלי השפעה נמוכה שיכולים להתקרב לבתי גידול רגישים מבלי להפריע לחיות בר. הסירות צריכות לשאת ציוד מצלמה, GPS למיפוי טרנסקט, וציוד דגימה לאיסוף מים ומשקעים. גל נמוך ורעש מנוע מינימלי הם קריטיים למחקרי תצפית התנהגותית.
      features:
        - מנוע 4 פעימות שקט מחוץ למים — הפרעה מינימלית לחיות הבר הימיות
        - פלטפורמת תצפית יציבה לצילום ותיעוד וידאו
        - הרכבת ציוד למתקני מצלמות, מעקבי GPS, ומחשבים שטחיים
        - טיוּב רדוד לגישה לגדות לחות חופיות, מנגרובים ואסטרואיות
        - משטחים של סיפון וצינורות הניתנים לניקוי קל להסרת זיהום בין אתרים
    - title: ניטור ובדיקת איכות מים
      subtitle: ריצות דגימה קבועות, מעקב אחר מזהמים, ניטור עמידה בתקנות
      description: ארגוני ניטור איכות מים מבצעים ריצות דגימה קבועות לאורך אזורי חוף, נמלים ורחבי מים פנימיים כדי לעקוב אחר רמות זיהום, פריחה של אצות, ועמידה בתקנות סביבתיות. פעילויות אלו דורשות סירות יעילות ואמינות לביקורים חוזרים בתחנות דגימה קבועות. הספינה חייבת לשאת ציוד דגימה, מקררים לשימור דגימות וציוד בדיקה שטח — עם שטיפת סיפון קלה בין אתרי הדגימה למניעת זיהום צולב.
      features:
        - אזור תחנת דגימה ייעודי עם אחסון מקרר וציוד
        - סיפון וצינורות קלי ניקוי לצורך חיטוי בין אתרים
        - שילוב GPS לחזרה מדויקת לקואורדינטות דגימה קבועות
        - גודל קומפקטי לגישה למים מוגבלים ותעלות צרות
        - מנוע חיצוני חסכוני בדלק לריצות דגימה קבועות בעלות נמוכה
