content_system:
  tagline: סקירת מערכת בקרת איכות
  title: איכות משולבת<br />מסגרת ביקורת
  subtitle: מערכת בקרת האיכות שלנו פועלת באופן עצמאי מהייצור ומדווחת ישירות להנהלה. שום אצווה אינה נשלחת ללא שחרור איכות חתום ממעבדת האיכות.
  items:
    - title: מעבדה עצמאית לאיכות
      description: מעבדת האיכות שלנו פועלת כיחידה נפרדת מהייצור. פקחי בקרת איכות מדווחים למנהל האיכות, ולא למנהל הייצור. עצמאות ארגונית זו מבטיחה שהחלטות האיכות מתקבלות באופן אובייקטיבי — מועדי הייצור אינם עוקפים אף פעם את דרישות האיכות.
      features:
        - מדווח ישירות להנהלה, עצמאי מהייצור
        - מורשה לעצור את הייצור עקב בעיות איכות
        - 12 פקחי בקרת איכות מוקדשים בכל השלבים
        - כל ציוד הבדיקה מכויל שנית כל שנה
    - title: איתור מנות
      description: לכל אצווה של חומר גלם מוקצה מספר אצווה ייחודי במערכת שלנו ERP. מהגעת החומר ועד לייצור ולמוצר המוגמר, כל חשבונית חומרים של כל סירה מקשרת חזרה לאצוות הספק המקוריים. זה מאפשר מעקב מלא כלפי מעלה עבור כל בדיקת איכות או עמידה בתקנים.
      features:
        - מעקב אחר קבוצות מבוסס ERP מהחומר למוצר הגמור
        - תגי אצווה פיזיים על כל הזמנת עבודה
        - כיסוי חומרים ב-100% — PVC, Hypalon, חומרה, דבקים
        - רשומות נשמרות במשך 10 שנים (CE דרישת 2013/53/EU)
    - title: תקנים וציות
      description: נהלי בקרת האיכות שלנו מותאמים לסטנדרטים בינלאומיים. המוצרים מוסמכים לפי תקן EU Recreational Craft Directive 2013/53/EU. מערכת ניהול האיכות שלנו מוסמכת לפי ISO 9001. עמידה חברתית נשמרת באמצעות הסמכת BSCI.
      features:
        - תעודת CE (האיחוד האירופי 2013/53/EU)
        - ISO ניהול איכות 9001:2015
        - BSCI הסמכת ציות חברתי
        - REACH ועמידה RoHS בחומרים
        - UKCA אישור לאחר הברקזיט
content_inspection:
  tagline: שלבי הבדיקה
  title: שישה שלבים<br />תהליך הבדיקה
  subtitle: כל מוצר עובר 6 שלבי בדיקה עם נקודות בקרת איכות מתועדות. פגמים מתגלים מוקדם, פעולות תיקון מיידיות, וכל אצווה ניתנת למעקב מלא.
  stages:
    - stage: '1'
      title: בדיקת חומרים נכנסים
      description: כל החומרים הנכנסים מתועדים לפי מספר אצווה/אצווה ומוחזקים בהסגר עד אישור בקרת האיכות. PVC/Hypalon גלילי בד נבדקים לחוזק מתיחה (ASTM D751), עמידות לקרעים (ISO4674) ועוביים.Drop-stitch ליבות, שסתומים, דבקים וחומרה נבדקים ויזואלית ונמדדים בהתאם למפרט.
      checks: חוזק מתיחה ASTM D751, עמידות קרע ISO 4674, מד עובי, צמיגות דבק, סריקת פגמים ויזואליים
      threshold: 100% מהאשכולות נבדקו. לדחות אם מתח מתיחה < 90% מהמפרט, קריעה < מינימום המפרט, או כל פגם חזותי
    - stage: '2'
      title: בקרת איכות בתהליך — חיתוך והכנה
      description: CNCלוחות -חתוכים נבדקים במימד מול קבצי מקור CAD בכל פאנל 20. איכות הקצוות נבדקת לאיתור פרימות, חיתוכים לא אחידים או סטייה ממדית. ספירת הפאנלים מאומתת מול BOM לכל אצווה ייצור לפני שהחומרים עוברים לריתוך.
      checks: בדיקת ממדים מול קבצי CAD DXF, בדיקת איכות קצוות, אימות מספר לוחות
      threshold: סבילות ±0.5 מ"מ. דחה אצווה אם >2% מחוץ לסבילות
    - stage: '3'
      title: בקרת איכות בתהליך — ריתוך והדבקה
      description: במהלך הייצור, איכות הריתוך מנוטרת באופן רציף. בדיקות פילינג (ASTM D751) מתבצעות על דגימות כל 50 יחידות. רוחב הריתוך נמדד לפי המפרט. יומני טמפרטורת אוויר חם נבדקים לעקביות. כל תפר נבדק ויזואלית תחת תאורה אחורית לאיתור תעלות או חללים.
      checks: בדיקת פילינג ASTM D751 כל 50 יחידות, מדידת רוחב ריתוך, בדיקת יומן טמפרטורה באוויר חם, בדיקת תפר תאורה אחורית
      threshold: חוזק הפילינג מינימום 8 ניוטון/ס"מ. סבילות רוחב ריתוך ±1 מ"מ. כל ערוץ גלוי = דחייה
    - stage: '4'
      title: בקרת איכות אסמבלי
      description: כל יחידה עוקבת אחרי רשימת הרכבה בת 100 נקודות שאושרה על ידי ראש הצוות. פונקציית השסתומים נבדקת ב-10 מחזורי פתיחה/סגירה. מומנט החומרה מאומת. בדיקה ויזואלית כוללת גימור פני שטח, עקביות צבע, מיקום תוויות ושלמות האביזרים.
      checks: רשימת בדיקה של 100 נקודות ליחידה, בדיקת פונקציית שסתומים, אימות מומנט חומרתי, בדיקה ויזואלית
      threshold: 'מדיניות של אפס תקלות בפריטי בטיחות קריטיים (שסתומים, טבעות D, ידיות). קוסמטי קל: AQL 2.5 (ISO 2859)'
    - stage: '5'
      title: בדיקת לחץ
      description: כל תא מנופח ללחץ מדורג של 1.25× ומוחזק למשך 24-48 שעות. חיישני לחץ מתעדים ברציפות לאורך כל תקופת ההחזקה. קריאות מפוצות טמפרטורה מבטיחות דיוק. כל תא שעולה על 5% ירידת לחץ נדחה ונשלח לבדיקה מחודשת של התפר עם בדיקה חוזרת של 100% של כל מחזור הייצור.
      checks: יומן החזקת לחץ 24-48 שעות, כיול חיישנים מאומתים מדי יום, קריאה מפוצה על פי טמפרטורה, בדיקת תפר מחודשת לאחר תיקון
      threshold: ירידת לחץ מקסימלית של 5% במשך 24 שעות בטמפרטורה יציבה. מעבר = 100% בדיקה חוזרת של כל האצווה
    - stage: '6'
      title: בדיקה סופית ושחרור משלוח
      description: בדיקה ויזואלית ופונקציונלית סופית לפני האריזה. ליקויי פני השטח, עקביות צבע, אימות תווית/BIN, שלמות האריזה ושלמות האביזרים נבדקים מול הזמנת הלקוח. היחידות נארזות בוואקום, ארוזות ומאוחסנות במשטחים. נדרש אישור QC סופי לפני יציאת כל מוצר מהמפעל.
      checks: בדיקה ויזואלית מלאה, רשימת תוספים לפי SKU, מבחן נפילה של האריזה (דוגמית אקראית בגובה 1 מ'), אימות סריקת תווית/ברקוד
      threshold: AQL 2.5 פגמים חמורים, AQL 4.0 פגמים קלים. אפס סובלנות לפגמי ביטיחות. 100% מהיחידות נבדקו ויזואלית
content_equipment:
  tagline: ציוד בדיקה
  title: מעבדת בקרה איכות<br />ציוד
  subtitle: מעבדת האיכות שלנו מצוידת בציוד בדיקה מתקדם לאימות חומר, שלמות תפר ולווידוא ביצועי המוצר.
  columns: 3
  items:
    - title: מכונת בדיקת מתיחה
      description: מודדת את חוזק המתיחה והארכה של הבד לפי ASTM D751. משמשת לבקרת איכות נכנסת של כל PVC, Hypalon ו-drop-stitch באצוות הבד.
      icon: tabler:scale
    - title: תא טמפרטורה
      description: תא סביבתי לבדיקת התנגדות ל-UV (ASTM G154) ובדיקת גמישות בטמפרטורה נמוכה. מדמה תנאי תפעול קיצוניים.
      icon: tabler:temperature
    - title: חיישני לחץ ומקליטים
      description: חיישני לחץ דיגיטליים עם רישום נתונים רציף לבדיקות שמירת אוויר לאורך 24-48 שעות. מכויילים לפי טמפרטורה לדיוק.
      icon: tabler:wind
    - title: מתקן בדיקת קליפה
      description: ציוד קליבר לבדיקת חוזק ריתוך לתוודא עמידות התפרים. דגימות אקראיות מכל אצוות הייצור.
      icon: tabler:files
    - title: מכל בדיקת דליפות
      description: מיכל מים לבדיקת דליפות במתקנים מנופחים. זיהוי בועות ויזואלי לאימות שלמות התפר והשסתום.
      icon: tabler:ripple
    - title: כלי בדיקה
      description: כלי מדידה מכוילים — מד עבים, מפתחות מומנט, קליברים ממדיים, בודקי קשיות לתחנות בקרת איכות הייצור.
      icon: tabler:tools
content_metrics:
  tagline: ביצועי בקרה איכות
  title: בקרת איכות<br />מדדים
  subtitle: נתוני הצלחה/כשל אמיתיים מקו הייצור שלנו. המדדים נבדקים מדי יום ונבחנים מדי חודש על ידי ההנהלה.
  columns: 3
  items:
    - title: בדיקה של 100% מהיחידות
      description: כל תא בכל סירה נבדק בלחץ לפני המשלוח. אין דגימות — 100% בדיקה של שלמות הלחץ.
      icon: tabler:check
    - title: ירידת לחץ <5%
      description: הפסד לחץ מקסימלי מותר למשך 24-48 שעות בלחץ 1.25× הלחץ המדורג. כל תא החורג מסף זה מפעיל בדיקה חוזרת של האצווה.
      icon: tabler:gauge
    - title: AQL 2.5
      description: רמת איכות מקובלת לפגמים חמורים לפי תקן דגימה ISO 2859. אפס סובלנות לפגמי ביטחון קריטיים.
      icon: tabler:clipboard-check
    - title: השמירה על לחץ 24-48 שעות
      description: 'משך שמירת הלחץ משתנה לפי קטגוריית המוצר. תאי RIB: 48 שעות. SUP וסירות מתנפחות: 24-48 שעות.'
      icon: tabler:clock
    - title: לחץ מבחן 1.25×
      description: מרווח בטיחות בכל תא — נבדק ב-25% מעל הלחץ הנקוב כדי להבטיח מרווח מעל תנאי הפעלה מקסימליים.
      icon: tabler:arrow-up
    - title: 0% פגמי בטיחות
      description: מדיניות סובלנות אפס לפגמים קריטיים לבטיחות — שסתומים, טבעות D, תפרים ותאי ציפה. כל פגם = בדיקה מחדש של 100%.
      icon: tabler:shield
cta:
  title: בקשת תיעוד איכות
  subtitle: אנו מספקים חבילות תיעוד איכות מלאות כולל דוחות בדיקה, אישורי חומר, והצהרות תאימות עם כל משלוח. צרו קשר לקבלת דגימות.
  actions:
    - variant: primary
      text: בקשת תיעוד QC
      href: /contact
    - text: צפייה בפרוטוקולי בדיקה
      href: /quality
