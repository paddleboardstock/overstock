hero:
  tagline: בקרת איכות
  title: מערכת בקרת איכות<br />לזיכיון הייצור הימי של OEM
  subtitle: תהליך בדיקה רב-שלבי הכולל חומרים נכנסים, ייצור בתהליך, בדיקות לחץ, הרכבה סופית ואימות לפני המשלוח. כל אצווה ניתנת למעקב, וכל בדיקה מתועדת.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
    alt: Aquafarer תהליך בקרת איכות ובדיקות לחץ
