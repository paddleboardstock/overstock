content_priorities:
  tagline: מה הלקוחות מאמתים
  title: 8 דברים שקונים בודקים<br />בכל ביקור במפעל
  subtitle: בהתבסס על משוב מ-50+ קונים ממדינות שונות, אלו שמונה סדרי העדיפויות שהלקוחות מעריכים לפני ביצוע B2B ההזמנה.
  items:
    - title: יצרן אמיתי
      description: 'האם אתה המפעל האמיתי, לא חברת מסחר? בדיקת קונים: ישות עסקית, ציוד ייצור אמיתי, עובדים שמפעילים מכונות, הזמנות ייצור נוכחיות ברצפה, ועקביות בין אתר לסדנה.'
      icon: tabler:building-factory
    - title: התאמה למוצר ליישום
      description: האם הם RIB תואמים את מקרה השימוש הספציפי שלהם? מפעילי אתר נופש, חילוץ, צלילה, דיג וסיור דורשים באופן מהותי שונים. הקונים מעריכים את סידור הסיפון, חומרי הצינורות ואפשרויות הציוד בסירה המוצגת.
      icon: tabler:target
    - title: יציבות איכות ושחזוריות
      description: האם היחידה ה-50 טובה כמו הראשונה? הקונים בודקים מערכות בקרת איכות, נקודות ביקורת בתהליך, טיפול באי-תאימות, ומבקשים לראות רשומות ממספר ריצות ייצור כדי לוודא עקביות.
      icon: tabler:repeat
    - title: אותנטיות מסמכי הציות
      description: האם CE תעודות הן ספציפיות לדגם? האם המסמך חתום על ידי אדם אמיתי? האם ניתן לאמת עמידה לפי מספר גוף? הקונים בודקים תביעות כלליות לעומת תיעוד ספציפי לדגם.
      icon: tabler:file-certificate
    - title: ביצוע התאמה אישית
      description: האם המפעל באמת יכול לספק תצורות מותאמות אישית? קונים מחפשים ראיות לפרויקטים מותאמים אישית קודמים, דגימות אב-טיפוס בתצוגה, שרטוטים הנדסיים ויכולת לדון בשינויים טכניים במקום.
      icon: tabler:adjustments
    - title: זמן אספקה וקיבולת
      description: 'האם לוחות הזמנים המצוינים ריאליים? הקונים מעריכים: נפח הייצור הנוכחי, הקיבולת הזמינה, גודל כוח האדם, רמות מלאי החומרים, והאם למפעל יש מערכת לתכנון ייצור.'
      icon: tabler:clock
    - title: מחיר ותנאי מסחר
      description: 'האם המחירים שקופים? האם תמחור FOB ברור? הקונים מוודאים: פירוט מחירים ליחידה, עלויות כלי עבודה, עלויות אריזה, והאם המפעל יכול להתמודד עם תנאים של DDP או CIF עם מסמכי יצוא מתאימים.'
      icon: tabler:currency-dollar
    - title: שירות לאחר מכירה וחלקי חילוף
      description: 'מה קורה לאחר המסירה? הקונים מעריכים: זמינות חלקי חילוף, תהליך אחריות, חלופי מקטעי צינורות, החלפת שסתומים, והאם למפעל יש פרוטוקול מתועד לאחר המכירה.'
      icon: tabler:headset
content_tour:
  tagline: מסלול סיור במפעל
  title: סיור ביקורת —<br />מה תראו
  subtitle: סיור המפעל הסטנדרטי שלנו עוקב אחר מסלול מוגדר שנועד לענות על שאלות הקונה בכל תחנה.
  items:
    - title: 1. חדר פגישות — הצגת החברה
      description: רישיון עסק, תעודות ISO 9001 ו-BSCI, רישיונות יצוא, והיסטוריית החברה. סקירה קצרה של יכולות הייצור והיקף ההתאמה לדרישות.
      icon: tabler:users
    - title: 2. מחסן חומרי גלם — תחנת IQC
      description: רשומות בדיקת חומר נכנס, תעודות אצוות בד לייצור, דוגמאות דבקים וחומרה. לראות איך החומרים נבדקים לפני כניסתם לייצור.
      icon: tabler:building-warehouse
    - title: 3. ייצור צינורות — ריתוך RF והדבקה ידנית
      description: תהליך ריתוך או הדבקה של הצינורות חי, הדגמות של בדיקת חוזק תפרים, והתקנת שסתומים. להתבונן בבנייה תא-בתא ובנקודות ביקורת האיכות.
      icon: tabler:flame
    - title: 4. למינציה של גוף הסירה — סדנת GRP
      description: תהליך פריסת סיבי זכוכית, מריחת ג'לקוט, וקיבוע הגוף. לראות את לוח הזמנים של הלמינציה ואת החיזוק המבני לדגמי RIB שונים.
      icon: tabler:layers-subtract
    - title: 5. הרכבה ואינטגרציה
      description: חיבור גוף הצינור, התקנת קונסולה ומושבים, אינטגרציה של מערכות חשמל ודלק, והתקנת ציוד. להתבונן בקו הייצור בפעולה.
      icon: tabler:tool
    - title: 6. תחנת בדיקות לחץ
      description: בדיקת החזקת לחץ 24-48 שעות בלחץ של 1.25 פעמים הלחץ המדורג. לראות רשומות בדיקה, מד לוח לחץ, וקריטריוני הצלחה/כשל. לראות איך תוצאות הבדיקה מקושרות למספרי סידורי של הגוף.
      icon: tabler:gauge
    - title: 7. בדיקה סופית ובקרת איכות
      description: רשימת בדיקת איכות בת 100 פריטים לכל יחידה, אימות ממדים, בדיקת מראה, ובדיקת תקינות האריזה. סקירת יומני אי-התאמה ורשומות פעולות מתקנות.
      icon: tabler:clipboard-check
    - title: 8. חדר בדיקת מסמכים
      description: מסמכי התאמה לכל דגם (DoC, לוח יצרן, מדריך לבעלים), רשומות מעקב ייצור, רישום HIN, והדגמת מסד נתוני מעקב אצוות חומרים.
      icon: tabler:folder
content_qc_chain:
  tagline: ראיות איכות
  title: שרשרת QC בת 8 שלבים<br />— ניתנת לאימות בכל שלב
  subtitle: שרשרת בקרת האיכות שלנו עוברת מהחומרים הנכנסים עד המשלוח הסופי, עם ראיות תיעודיות בכל שלב.
  items:
    - title: 'שלב 1: בדיקת חומרי גלם נכנסים'
      description: כל אצווה של PVCHypalon, , סיבי זכוכית, אלומיניום, דבקים וחומרה נבדקת מול המפרטים לפני כניסת הייצור. חוזק מתיחה, הידבקות ציפוי ובדיקות מימד לפי AQL 2.5/ISO2859.
      icon: tabler:package
    - title: 'שלב 2: ריתוך צינורות / הדבקת בקרת איכות'
      description: בדיקת חוזק קילוף התפר לכל אצווה לייצור. פרמטרי ריתוך RF נעקבו ונרשמו. תפרים מודבקים ביד נבדקו לכיסוי דבק וזמן התייבשות עקביים.
      icon: tabler:flame
    - title: 'שלב 3: בקרת בקרת למינציה של גוף הים'
      description: מדידת עובי ג'לקואט, אימות הנחת פיברגלס לפי לוח זמנים של למינציה, וניטור זמן התייבשות. עמדות חיזוק מבני אומתו מול שרטוטים הנדסיים.
      icon: tabler:layers-subtract
    - title: 'שלב 4: בקרת איכותי של הרכבה ואינטגרציה'
      description: שלמות מפרקי גוף הצינור, מומנט ההתקנה של הקונסולה והמושב, רציפות חשמלית ובדיקת דליפת מערכת דלק. כל נקודת התקנה אושרה מול רשימת ההרכבה הספציפית לדגם.
      icon: tabler:tool
    - title: 'שלב 5: מבחן החזקת לחץ'
      description: כל תא מתנפח בלחץ עד פי 1.25 PSI והוחזק למשך 24-48 שעות. נפילת לחץ נרשמה לכל תא. סף מעבר/כישלון מתועד. קישור למספר סידורי גוף הספינה.
      icon: tabler:gauge
    - title: 'שלב 6: בדיקה סופית'
      description: רשימת בדיקה של 100 נקודות הכוללת דיוק מימד, גימור קוסמטי, שלמות אביזרים, אריזת תיעוד ושלמות האריזה. עצמאי מצוות הייצור.
      icon: tabler:clipboard-check
    - title: 'שלב 7: תיעוד ציות'
      description: DoC ספציפי לדגם, אימות לוחית בונה, שלמות מדריך הבעלים, ורישום רישום HIN. כל מסמכי הציות הוכנו ואומתו לפני שחרור המשלוח.
      icon: tabler:file-certificate
    - title: 'שלב 8: שחרור משלוח ומעקב'
      description: שחרור סופי דורש מעבר כל שלבי האיכות, השלמת תיעוד הציות ואימות תיעוד המשלוח. רשומת הגוף נסגרה וארכיון לשמירה של 10+ שנים.
      icon: tabler:truck
content_traceability:
  tagline: מעקב ייצור
  title: → קובץ →המאסטר HIN<br />אספקת שיא גוף →
  subtitle: כל RIB סירה נושאת מספר זיהוי גוף ייחודי המקושר לשרשרת רישום ייצור ותאימות מלאה.
  items:
    - title: מספר זיהוי גוף (HIN)
      description: מזהה ייחודי בן 14 תווים המסומן לצמיתות על כל סירה. מקודד קוד יצרן (MIC), סימון דגם, שנת ייצור ומספר סידורי. המפתח שמשחרר את שרשרת המעקב המלאה.
      icon: tabler:hash
    - title: קובץ טכני ראשי
      description: תיעוד ההתאמה וההנדסה למשפחת הדגמים. מכיל שרטוטי GA, הערכת סיכונים, חישובי יציבות, מפרטי חומרים ותקנים רלוונטיים. מקושר לכל גופי הדגם הזה.
      icon: tabler:folder
    - title: רשומת גוף הספינה האישי
      description: 'רשומת ייצור לכל גוף: HIN, תאריך ייצור, אצווה של צינור, תעודות חומר, תוצאת בדיקת לחץ, תצורה סופית, מפרט מנוע, תוצאות רשימת איכות ויעד אספקה. 21+ שדות נתונים לכל גוף.'
      icon: tabler:file-description
    - title: חבילת ציות ללקוחות
      description: חבילת אספקה לכל גוף כולל DoC, תמונת לוחית היצרן, מדריך הבעלים, רשימת בדיקה לדרישות ודף ההגדרה הסופי. נשלח עם הסירה ונשמר במפעל במשך 10+ שנים.
      icon: tabler:package
content_red_flags:
  tagline: מלכודות ביקורת
  title: קונים דגלים אדומים<br />קל לזהות
  subtitle: בעיות נפוצות שמערערות את אמון הקונים במהלך ביקורות במפעל. אנו מטפלים באופן יזום בכל אחת מהן.
  items:
    - title: CE תביעות כלליות ללא היקף דגם
      description: '"כל המוצרים CE מוסמכים" מבלי לציין איזו הוראה, אילו מודלים ואיזה מודול קונפורמיות. דגל אדום: מרמז שהציות הוא שטחי ולא לפי מודל, לכל תצורה.'
      icon: tabler:alert-triangle
    - title: אין ראיות לבדיקות פיזיות
      description: 'טענות בדיקת לחץ ללא רשומות בדיקה, מדדים או תחנת בדיקה הנראות על רצפת המפעל. דגל אדום: טענות איכות אינן ניתנות לאימות במהלך הביקור.'
      icon: tabler:alert-triangle
    - title: מעקב אחר חומרים חסרים
      description: 'אין רשומות אצווה, אין בדיקות נכנסות, ואין קשר בין תעודות חומר למוצרים מוגמרים. דגל אדום: אין דרך לעקוב אחרי בעיות איכות למקור.'
      icon: tabler:alert-triangle
    - title: תיעוד כללי
      description: 'DoC אחד שמכסה את כל הדגמים, ללא רשומות ספציפיות ל-HIN, או מסמכי עמידה ב"תבניות". דגל אדום: עמידה בדרישות אינן קשורות ליחידות ייצור בודדות.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: משלוח ואריזות
  title: RIB מכולת סירות<br />טעינה וארגז
  subtitle: פתרונות המשלוח שלנו מגנים על ההשקעה שלכם מצ'ינגדאו ועד נמל היעד. תוכניות טעינת מכולות ומפרטי ארגז זמינים לכל דגם.
  items:
    - title: תצורות מכולות בגובה 20 רגל
      description: 'מכולה סטנדרטית באורך 20 רגל: 1-2 RIB סירות (4.0-5.5 מטר) מקוננות עם סיפון וצינורות מופרדים, או 8-12 SUP לוחות. RIB + SUP תצורות מעורבות זמינות. תוכנית טעינה מפורטת מסופקת לפי הזמנה.'
      icon: tabler:box
    - title: תצורות מכולות באורך 40 רגל
      description: 'מכולה סטנדרטית באורך 40 רגל: 2-4 RIB סירות (עד 7.0 מטר) עם גוף מקונן וצינורות מוערמים, או 20-30 SUP לוחות. מטה 40 רגל זמין RIB לדגמים גבוהים יותר. אריזה מותאמת לנפח מפחיתה את עלות המשלוח ליחידה.'
      icon: tabler:container
    - title: ארגז עץ RIB לגופים
      description: גופי אלומיניום ו-GRP מאורזים בארגזי עץ מותאמים אישית עם ריפוד קצף, מחסום לחות ורצועות פלדה. מידות ומשקל הארגז לדגם זמינים לתכנון לוגיסטי. תעודת ISPM-15 לעץ מטופל בחום כלולה.
      icon: tabler:wood
    - title: אריזת הפרדה בצינור ובסיפון
      description: הצינורות נפתחו וקופלו בנפרד מהגוף לצורך חיסכון במקום. לוחות סיפון, קונסולות ומושבים ארוזים בעטיפת מגן עם ערכות חומרה להתקנה. הוראות להרכבה מחדש כלולות בכל משלוח.
      icon: tabler:package
    - title: הגנה מפני לחות וקורוזיה
      description: נייר נגד קורוזיה של VCI לרכיבי אלומיניום, אריזות סיליקה ג'ל לחומר ייבוש, ושקיות אטום בוואקום. מונע נזקי עיבוי במהלך מעבר ימי של 30-45 ימים.
      icon: tabler:droplet-off
    - title: FOB תיעוד צ'ינגדאו
      description: שטר המטען, חשבונית מסחרית, רשימת אריזה, תעודת מוצא ומסמכי ציות לכל משלוח. איחוד FCL ו-LCL זמין. תמיכה במסמכי מכס לשווקים של האיחוד האירופי, ארה"ב והמזרח התיכון.
      icon: tabler:file-text
content_audit_evidence:
  tagline: ראיות אימות
  title: ראיות ביקורת<br />אתה יכול לאמת באתר
  subtitle: במהלך ביקורי מפעל, הלקוחות יכולים לאמת ראיות ספציפיות בכל אזור ייצור. הנה מה לחפש — ומה שאנו מכינים לכל ביקורת.
  areas:
    - area: מחסן חומרי גלם
      what_to_verify: האם החומרים יציבים? האם יש ערבוב של אצוות?
      evidence: רשומות בדיקה נכנסת, תוויות אצווה, אחסון FIFO, רשימת אישור ספקים, תעודות חומר (PVC, Hypalon, סיבי זכוכית, אלומיניום, דבקים, חלקי חומרה)
      icon: tabler:building-warehouse
    - area: ייצור צינורות
      what_to_verify: כיצד מובטחת חוזק התפר ואטימות לאוויר?
      evidence: כרטיסי תהליך, אישור דוגמה ראשונה, רשומות בדיקות לחץ לכל תא, יומני תיקון ובדיקות חוזרות, רשומות התקנת שסתומים
      icon: tabler:flame
    - area: ייצור גוף
      what_to_verify: כיצד נשלטת עקביות מבנית?
      evidence: מסמכי תהליכים מבוקרים, נקודות ביקורת איכות, מספור מוצר חצי-גמור, מדידות עובי גל קואט, אימות לוח זמנים של למינציה
      icon: tabler:layers-subtract
    - area: אזור הרכבה
      what_to_verify: כיצד מונעים הרכבה שגויה של חלקים אופציונליים?
      evidence: BOM, הוראות עבודה, רשימות בדיקת תצורה, כרטיסי בדיקה של תחנות עבודה, בדיקות מומנט ותפקוד לכל דגם
      icon: tabler:tool
    - area: תחנת בדיקה
      what_to_verify: כיצד מאשרים שהסירה תקינה לפני המסירה?
      evidence: נהלי בדיקה, רשימת מכשירים, רשומות כיול, יומני בדיקות לחץ (1.25x / 24-48 שעות), רשימות בדיקות תפקוד, קריטריוני הצלחה/כישלון מתועדים
      icon: tabler:gauge
    - area: אזור אי-תאימות
      what_to_verify: כיצד מטפלים בליקויים?
      evidence: תוויות בידוד, יומני NCR, ניתוח סיבת שורש, רשומות אישור תיקון, מעקב CAPA (פעולה מתקנת ומניעתית)
      icon: tabler:alert-triangle
    - area: מחסן סחורות גמורות
      what_to_verify: כיצד מונעים משלוח שגוי ונזק?
      evidence: תוויות מוצר גמור, רשומות התאמת הזמנות, סטנדרטי אריזה, רשומות בדיקה לפני משלוח
      icon: tabler:box
    - area: חלקי חילוף ושירות לאחר מכירה
      what_to_verify: האם ניתן לתמוך במכירות לאחר מכירה לטווח ארוך?
      evidence: רשימת חלפים נפוצים, אסטרטגיית מלאי, מערכת מספור חלקים, תיעוד תהליך אחריות, מדריכי תחזוקה
      icon: tabler:headset
