faq:
  title: ביקורת מפעל — שאלות נפוצות
  questions:
    - q: אפשר לבקר במפעל באופן אישי?
      a: כן. אנו מקבלים ביקורות מפעל באתר במתקן צ'ינגדאו שלנו בשטח של 12,000 מ"ר. הסיור הסטנדרטי שלנו כולל 8 תחנות, ממחסן חומרי גלם ועד חדר סקירת מסמכים. סיורים וירטואליים במפעל באמצעות שיחת וידאו זמינים גם הם להסמכה ראשונית.
    - q: האם אתה מקבל ביקורות צד שלישי (BSCI, SMETA, SGS)?
      a: כן. אנו שומרים BSCI על הסמכה (Intertek) ומברכים על פרוטוקולי ביקורת ייחודיים ללקוח. אנו יכולים גם לארגן SGS TÜV בדיקות לפי בקשה. דוחות ביקורת זמינים תחת NDA.
    - q: האם אפשר לראות בדיקת לחץ במהלך הביקור?
      a: תחנת בדיקת הלחץ שלנו היא חלק ממסלול הסיור הסטנדרטי. בהתאם ללוח הזמנים של הייצור, תוכלו לצפות בבדיקות לחץ אקטיביות עם קריאות מד ורשומות בדיקה. יומני בדיקת לחץ לכל גוף זמינים תמיד לסקירה.
    - q: איך אתם מתמודדים עם מוצרים לא תואמים?
      a: יחידות שאינן תואמות מופרדות, מתועדות ונבדקות בהתאם ISO לתהליך הפעולה המתקנת 9001 שלנו. מתבצע ניתוח שורש הבעיה, מבצעים פעולות תיקון, והרישומים נשמרים. הקונים יכולים לעיין ביומן ה-NCR שלנו במהלך הביקורות.
    - q: איזה תיעוד עמידה בדרישות זמין לבדיקה?
      a: 'במהלך הביקורת, ניתן לעיין ב: דגימות DoC ספציפיות לדגם, מפרטי לוחיות בנייה, רישום HIN, טיוטות מדריך הבעלים, רשימות תקנים רלוונטיות, ורשומות הערכת התאמה לכל משפחת דגם.'
    - q: איך אני מזמין סיור מפעל וירטואלי?
      a: צרו קשר עם צוות המכירות שלנו לתיאום סיור וידאו חי דרך WhatsApp, Zoom או Teams. אנחנו פועלים באותו מסלול של 8 תחנות ויכולים להתמקד באזורים ספציפיים בהתאם לתחומי העניין שלכם. סיור וירטואלי טיפוסי הוא 45-60 דקות.
    - q: האם המפעל הוא היצרן האמיתי או חברת מסחר?
      a: Paddle Board Overstock הוא היצרן בפועל. אנו מפעילים את המפעל בליישי, צ'ינגדאו. רישיון עסקי, היקף ייצור וייצור פיזי כולם ניתנים לאימות במהלך הביקורת.
    - q: אילו רשומות איכותיות אני יכול לבדוק?
      a: רשומות בדיקת חומרים נכנסות, נקודות בקרת איכות בתהליך, יומני בדיקת לחץ, רשימות בדיקה סופיות של 100 נקודות, דוחות אי-התאמה, רשומות פעולה מתקנת ורשומות מעקב לכל גוף. כולם נשמרים לפי ISO דרישות 9001.
