hero:
  tagline: סיפורי הצלחה
  title: תוצאות אמיתיות מ-<br />Water Business Builders
  subtitle: ראה כיצד מועדונים, בתי נופש ויזמים ברחבי העולם בנו פעילויות ספורט מים רווחיות עם ציוד ותמיכה של Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer סיפורי הצלחה של לקוחות
stories:
  - title: כיצד אתר נופש ים-תיכוני בנה עסק השכרת SUP רווחי
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: אתר נופש חופי 5 כוכבים — יוון
    problem: האתר היה זקוק לפעילויות מים פרימיום לאורחים כדי להעלות את ציוני שביעות הרצון וליצור מקור הכנסה חדש, אך חסר לו ציוד, תשתיות בטיחות ומומחיות צוות.
    solution: Aquafarer סיפקה 50 לוחות SUP מותאמים אישית עם צבעי האתר ולוגו, מערכת בטיחות מלאה כולל תחנת מצילים וקווי ציפה, ותוכנית הדרכת צוות בת 3 ימים שכללה טיפול בציוד, הדרכת אורחים ופרוטוקולי בטיחות.
    result:
      - 300+ פעילויות אורחים שבועיות הוזמנו בחודש הראשון
      - 'ציוני שביעות רצון אורחים עבור פעילויות מים: 4.8/5'
      - 'הכנסה שנתית נלווית חדשה: 180,000$'
      - אין תקריות בטיחות בעונת הפעילות הראשונה
      - עלויות החלפת ציוד יורדו ב-40% לעומת ספק קודם
    quote:
      text: Aquafarer לא רק שסיפקה לוחות — הם עזרו לנו לבנות חווית אורח מלאה. תוכנית הספורט מים שלנו הפכה מהכלום להדגשת האתר בעונה אחת.
      author: מנהל כללי של אתר נופש
    cta_text: בנה את פתרון אתר הנופש שלך
    cta_href: /solutions/resorts
  - title: כיצד סטארטאפ אוסטרלי בנה מותג מים תוך 90 יום
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: יזם חד פעמי — אוסטרליה
    problem: חובב חוץ רצה להשיק את מותג ה-SUP שלו לשוק האוסטרלי אך לא היה לו ניסיון בייצור, לא היו לו קשרי ספקים והון מוגבל.
    solution: חבילת השקת מותג של Aquafarer סיפקה ייעוץ בבחירת מוצר, עיצוב לוגו וצבעים מותאם, אריזות קמעונאיות ממותגות עם תגיות, מסמכי אישור CE, ומשלוח FOB לסידני.
    result:
      - משלוח ראשון של 200 לוחות הושג תוך 75 ימים מהיצירת קשר הראשונית
      - המוצר הושק ב-Shopify + Amazon AU תוך שבועיים מהגעת המשלוח
      - מלאי התחלתי אזל תוך 45 ימים
      - 'ממוצע רווח: 55% ממחירי קמעונאות'
      - 'הזמנה שנייה: 500 יחידות הוזמנו תוך 60 יום מההשקה'
    quote:
      text: היה לי את רעיון המותג אך אפס ידע בייצור. Aquafarer ממש החזיקו לי את היד לאורך כל התהליך — מבחירת עיצוב הלוח ועד פתיחת המשלוח הראשון שלי. 90 ימים מהחלום למסירה.
      author: מייסד, מותג SUP אוסטרלי
    cta_text: השק את המותג שלך
    cta_href: /solutions/entrepreneurs
  - title: כיצד מועדון חוף תאילנדי גדל מ-10 ל-80 לוחות
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: מועדון ספורט ימי — תאילנד
    problem: מועדון קטן לחוף הפוקט היה צריך לגדול מפעילות תחביבית לעסק מקצועי להשכרת ציוד לתיירים, אך לא הצליח למצוא ספק ציוד אמין עם איכות ותמחור עקביים.
    solution: בהתחלה עם חבילת המתחילים למועדון של Aquafarer (10 גלשנים, משוטים, ציוד בטיחות, מיתוג), המועדון צמח דרך תוכנית החבילה הפרימיום במשך 18 חודשים.
    result:
      - הגדל מ-10 ל-80 גלשנים תוך 18 חודשים עם איכות ותמחור עקביים
      - הוסיף השכרת קיאקים וסירות פדלים עם אותו ספק
      - מיתוג מותאם אישית של המועדון העלה את ההכרה במותג בקרב תיירים
      - עלויות תחזוקה ירדו ב-60% לעומת ציוד בתקציב הקודם
      - כעת משרת 150+ השכרות יומיות בעונת השיא
    quote:
      text: חבילת המתחילים למועדון הייתה נקודת הכניסה המושלמת. ככל שהעסק שלנו גדל, Aquafarer גדל איתנו — אותה איכות, אותו תמחור, ללא הפתעות.
      author: בעל המועדון, פוקט
    cta_text: התחל את חבילת המועדון שלך
    cta_href: /solutions/clubs
  - title: כיצד רשת נופש קריבית תקינה ספורט ימי ב-5 נכסים
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: רשת נופש — קריביים
    problem: רשת נופש יוקרתית עם 5 נכסים הייתה זקוקה לאיכות ציוד ספורט ימי עקבית ולמיתוג בכל המיקומים, עם רכש מרכזי ותכנון החלפה עונתי.
    solution: Aquafarer סיפק צי של 300 SUPs ו-100 קיאקים עם מיתוג אחיד, מלאי חלקי חילוף משותף, ולוח שנה שנתי להחלפה עם תמחור לפי נפח.
    result:
      - חוויית האורחים התקינה בכל 5 הנכסים
      - חיסכון של 30% בעלויות באמצעות רכישה מרוכזת ותמחור לפי נפח
      - מלאי חלקי חילוף מרכזי הקטין את זמן ההשבתה ב-80%
      - תוכנית ריענון צי שנתי ביטלה חיפושים קיצוניים בסוף העונה
      - השתתפות האורחים בספורט ימי עלתה ב-45% משנה לשנה
    cta_text: עצב את תוכנית הנופש שלך
    cta_href: /solutions/resorts
