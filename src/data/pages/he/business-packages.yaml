faq:
  title: שאלות נפוצות על חבילות
  questions:
    - q: מהי כמות ההזמנה המינימלית לחבילות?
      a: לחבילת המתחיל של המועדון יש מינימום של 10 יחידות. חבילות הנופש והממותגות מותאמות לצרכים שלך עם MOQs גמיש.
    - q: כמה זמן אורך המשלוח?
      a: הייצור הסטנדרטי נמשך 30–45 יום ממועד אישור ההזמנה. ייצור מזורז זמין בתוספת תשלום.
    - q: האם ניתן להתאים את צבעי הציוד והמותג?
      a: כן. כל החבילות כוללות התאמה מלאה — צבעי לוחות, הדפסת לוגו ועיצוב אריזה.
    - q: האם אתם מספקים תמיכה לאחר המכירה?
      a: כן. כל חבילה כוללת גישה למדריכי תחזוקה מקוונים, מדריכי וידאו ומערכת להזמנת חלקי חילוף.
