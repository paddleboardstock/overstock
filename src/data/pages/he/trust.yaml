features3_certifications:
  title: הסמכות ותאימות
  subtitle: כל מוצר נבדק באופן עצמאי; 64 דגמים מוסמכים לפי תקנים בינלאומיים.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE הסמכה
      description: 64 דגמים מוסמכים CE ברחבי SUPs, קיאקים, דינג'יים ו-RIBs עומדים בסטנדרט הבטיחות האירופי CE לכלי שיט פנאי. כל מוצר עובר בדיקות לחץ, ציפה ועומס לפני שהוא עוזב את המפעל.
      icon: tabler:certificate
    - title: ''
      description: המתקן שלנו בקינגדאו בשטח של 12,000 מ״ר פועל תחת מערכת ניהול איכות ISO 9001. כל אצוות הייצור ניתנות למעקב, מתועדות ונבדקות.
      icon: tabler:clipboard-check
    - title: BSCI ציות חברתי
      description: אנחנו מוסמכים ב-BSCI, מה שמבטיח עמידה בעקרונות עבודה אתית, תנאי עבודה בטוחים ואחריות סביבתית לאורך כל שרשרת האספקה שלנו.
      icon: tabler:users
    - title: REACH & RoHS
      description: כל החומרים — PVC, Hypalon, EVA קצף, דבקים — עומדים בתקנות האיחוד האירופי REACH ו-RoHS. אין חומרים מוגבלים, אין פשרות.
      icon: tabler:flask
    - title: מעבדת בדיקות חומרים
      description: מעבדת החומרים הפנימית בודקת את חוזק המתיחה, עמידות ל-UV, שלמות התפר והתכונות נגד שחיקה של כל אצווה של בד לפני הייצור.
      icon: tabler:microscope
    - title: אחריות לסירה 5 שנים
      description: Aquafarer הסירות מכוסות בערבון מוגבל של 5 שנים על בד הצינורות, התפרים והסיפון. SUP הלוחות והאביזרים כוללים ערבון של 2 שנים. אנו עומדים מאחורי מה שאנו בונים.
      icon: tabler:shield-check
testimonials:
  tagline: אמון הלקוחות
  title: מה שהלקוחות שלנו אומרים
  subtitle: ממתחילים בפדלינג ועד למפעילי צי מקצועיים — ראו מדוע הם סומכים על Aquafarer.
  items:
    - content: ציידנו את כל צי ההשכרה Aquafarer RIBs שלנו — 12 סירות בשלושה סניפים. שתי עונות, ללא תקלות. CE תיעוד ההסמכה הפך את אישור הביטוח לחלק. צוות ההנדסה שלהם אפילו התאם את צבעי הצינורות למותג שלנו.
      name: מרקו וולנטי
      title: מנהל תפעול, סיורי הרפתקאות אדריאטית — דוברובניק, קרואטיה
    - content: כקונה בפעם הראשונה, הייתי מודאג לגבי איכות ההזמנה מחו"ל. התיעוד ודו"חות הבדיקה מצד שלישי שהם שיתפו לפני ששאלתי אפילו נתנו לי ביטחון מלא. הלוח הגיע תוך 6 ימים והעלה על הציפיות שלי.
      name: ג'יימס ת'ורנטון
      title: SUP בעל אקספלורר 11 — ונקובר, קנדה
    - content: אנחנו מפעילים 24 Aquafarer RIBs בצי הסיירת החופית שלנו. תהליך בקרת האיכות שלהם עקבי בכל אצווה — אותו איכות תפר, אותו מיקום שסתום, אותה דרגת לחץ כל פעם. חזרתיות זו חשובה כאשר חיים תלויים בציוד.
      name: סגן מפקד אנדורס רייס
      title: קצין רכש ימי, יחידת משמר החופים הפיליפיני — מנילה, הפיליפינים
features3_lab:
  title: מעבדת בדיקות ואיכות פנימית
  subtitle: כל אצווה של חומר ומוצר מוגמר עוברים במעבדת הבדיקה באתר שלנו לפני המשלוח.
  columns: 3
  isBeforeContent: true
  items:
    - title: בדיקת חוזק מתיחה
      description: 'כל PVC גליל בד נבדק לפי תקני ASTM D751. דרישה מינימלית: 350 ניוטון לס"מ חוט וערב. אצוות שנדחו מוחזרים לספק — אנו דוחים כ-3% מהחומרים הנכנסים.'
      icon: tabler:scale
    - title: UV הזדקנות מואצת
      description: דגימות בד עוברות בליה מואצת QUV של 1,000 שעות (ASTM G154). שמירה על חוזק המתיחה חייבת לעבור את 80% לאחר UV החשיפה. מוצרים המדורגים לשימוש חיצוני של 3+ שנים.
      icon: tabler:sun
    - title: חוזק פילינג התפר
      description: תפרים מרותכים ב-RF נבדקו בחוזק פילינג מינימלי של 5 ניוטון/מ"מ (ASTM D751). תפרים מודבקים ביד Hypalon נבדקו ב-3.5 ניוטון/מ"מ. כל אצווה של ייצור כוללת דגימות תפר שנבדקו והוחזקו באופן הרסני.
      icon: tabler:stack
    - title: החזקת לחץ 24–48 שעות
      description: 'כל מוצר מתנפח מתנפח ל-1.25 פעמים PSI בדירוג ומפוטר במשך 24–48 שעות. ירידת לחץ מרבית מותרת: 5%. מוצרים שנכשלו במבחן זה עובדים מחדש ונבדקים מחדש לפני המשלוח.'
      icon: tabler:wind
    - title: בדיקות מחזור שסתומים
      description: כל עיצוב שסתומים עובר 10,000 מחזורי פתיחה-סגירה במעבדה שלנו. השסתומים חייבים לשמור על אטימה אטומה בלחץ מדורג פי 1.25 לאחר מחזור. כל Aquafarer השסתומים מאומנים ל-5+ שנות שימוש קבוע.
      icon: tabler:rotate
    - title: עמידות לסדק קר
      description: החומרים נבדקו בטמפרטורה של -30°C במשך 4 שעות לכל ISO 4646. אין אסור סדקים או שבירות. מוצרים המדורגים לאחסון חורף ולשימוש במים קרים עד -10°C טמפרטורת סביבה.
      icon: tabler:snowflake
steps2_manufacturing:
  title: איך אנו מבטיחים איכות
  subtitle: מבדיקת חומרי גלם ועד בדיקות לחץ סופיות — כל מוצר עובר שרשרת איכות קפדנית.
  items:
    - title: בדיקת חומרי גלם
      description: כל גליל PVC בד נבדק לעובי, חוזק מתיחה UV והתנגדות לפני כניסת הייצור.
      icon: tabler:search
    - title: בקרת איכות בתהליך
      description: תפרי ריתוך, התקנות שסתומים וקשרי תא נבדקים בכל תחנה במהלך ההרכבה.
      icon: tabler:eye
    - title: בדיקת לחץ
      description: כל מוצר מתנפח מנופח עד פי 1.25 PSI ומוחזק למשך 24–48 שעות כדי לוודא את שמירת האוויר ושלמות התפרים.
      icon: tabler:wind
    - title: בדיקה סופית
      description: כל יחידה נבדקת מבחינת גימור, חומרה ואריזות לפני אישור למשלוח. דגימות אצווה מגיעות למעבדה שלנו לבדיקות הרסניות.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB שאלות נפוצות על סירות
  subtitle: שאלות נפוצות לגבי הסירות המתנפחות שלנו עם גוף קשיח.
  columns: 2
  items:
    - title: אילו גדלים של RIB סירות Aquafarer כן מציעים?
      description: אנו מציעים 35 RIB דגמים בטווח של 2.5 מ' עד 7.6 מטר, המכסים הכל – מטנדרים קומפקטיים ועד כלי שיט מסחריים וסיור כבדים. כל דגם זמין עם מספר אפשרויות תצורה.
    - title: מה ההבדל בין RIB סירה מתנפחת מסורתית לסירה מתנפחת?
      description: A RIB (סירה מתנפחת עם גוף קשיח) משלבת גוף V עמוק מפיברגלס או אלומיניום עם סירה מתנפחת Hypalon או PVC צינורות. זה מעניק לך את היציבות והקיבולת של סירה קשה עם ספיגת זעזועים וציפה של סירה מתנפחת.
    - title: אילו מנועים תואמים Aquafarer RIBsל?
      description: אנחנו RIBs תומכים במנועים חיצוניים מ-3 HP עד 250 HP בהתאם לדגם. כל דף מוצר מפרט את ההספק המרבי המדורג. אנו ממליצים להתייעץ עם הסוכנות שלך לגבי ההתאמה האידיאלית.
    - title: Aquafarer RIBs CE מוסמכים?
      description: כן. כל דגמי הפנאי RIB CE מוסמכים תחת תקנים אירופיים חלים לכלי שיט לפנאי. דגמים מסחריים וסיור עומדים בדרישות יציבות ועומס נוספות.
    - title: מה האחריות על RIB סירות?
      description: כולם Aquafarer RIBs מגיעים עם אחריות מוגבלת ל-5 שנים על בד הצינורות, התפרים והגוף; שסתומי התנפחות מכוסים ל-5 שנים; אביזרים מותקנים במפעל מכוסים לשנה אחת.
    - title: כמה תאי אוויר Aquafarer RIBs יש בכלל?
      description: העיצוב שלנו RIBs כולל 3 עד 7 תאי אוויר עצמאיים בהתאם לאורך הדגם. עיצוב רב-תאים זה מבטיח שהסירה תישאר צפה גם אם תא אחד נפגע.
faqs_inflatable:
  title: שאלות נפוצות על סירות מתנפחות
  subtitle: שאלות נפוצות על דינג'י מתנפחת, קיאקים וסירות מתנפחות.
  columns: 2
  items:
    - title: אילו חומרים משמשים Aquafarer בסירות מתנפחות?
      description: אנחנו משתמשים בדרגת צבא PVC (דניר 1100) HypalonופרימיוםCSM / גומי, תלוי בדגם. שני החומרים UVמיוצבים, עמידים לשחיקה, ועומדים בדרישות האיחוד REACH האירופי RoHS והתקנות.
    - title: כמה זמן מחזיקות סירות מתנפחות?
      description: עם טיפול נכון, PVC סירה מתנפחת איכותית מחזיקה מעמד 7–10 שנים, בעוד Hypalon שדגמים יכולים להחזיק 15–20 שנים. ניקוי סדיר, UV הגנה ואחסון נכון מאריכים משמעותית את חיי השירות.
    - title: איזו תחזוקה נדרשת לסירה מתנפחת?
      description: תחזוקה בסיסית כוללת שטיפה במים טריים לאחר כל שימוש (במיוחד במי מלח), ייבוש לפני האחסון, בדיקת אטמי השסתומים מדי שנה, ומריחת UV חומר מגן על הצינורות. הימנע מחשיפה ממושכת לשמש כאשר אינו בשימוש.
    - title: האם ניתן להשתמש בסירות מתנפחות במים מלוחים?
      description: כן. כל Aquafarer הסירות המתנפחות מיועדות לשימוש במים מתוקים ובמים מלוחים. אנו ממליצים לשטוף במים מתוקים ולייבש היטב לאחר חשיפה למי מלח כדי למנוע קורוזיה מתאימה והתגבשות מלח בבד.
    - title: איך מאחסנים סירה מתנפחת?
      description: לנקות, לנקות ולייבש את הסירה לחלוטין לפני האחסון. גלגלו ברפיון (הימנעו מקפלים צמודים), אחסן במקום קריר ויבש הרחק מאור שמש ישיר, ושמרו על רצפות בטון כדי למנוע ספיגת לחות.
    - title: מהי יכולת המשקל של Aquafarer סירות מתנפחות?
      description: יכולת המשקל נעה בין 290 ק"ג לדגמים הקטנים ביותר שלנו לבין מעל 2000 ק"ג לכלי עבודה מסחריים גדולים יותר. בכל דף מוצר מופיע דירוג העומס המרבי עבור הדגם הספציפי שלכם.
faqs_sup:
  title: SUP שאלות נפוצות על גלשנים
  subtitle: שאלות נפוצות על גלשני ה-stand-up paddle שלנו.
  columns: 2
  items:
    - title: איזה SUP גדלים של גלשנים זמינים?
      description: אנו מציעים SUP גלשנים באורך של 9 עד 12 רגל, כולל דגמים לכלל, טיולים, יוגה ועיצובים מיוחדים. הדגמים המובילים במכירות שלנו כוללים את Tropical Breeze (10 רגל) ו-Ocean Voyager (11 רגל).
    - title: מהי drop-stitch בנייה?
      description: Drop-stitch בנייה משתמשת באלפי חוטי פוליאסטר שמחברים את השכבות העליונות והתחתונות של הגלשן, מה שמאפשר לו לשאת לחץ אוויר גבוה (15–20 PSI) ולהשיג פלטפורמה קשיחה ויציבה. זהו התקן בתעשייה עבור SUPs מתנפחים פרימיום.
    - title: מהו מגבלת המשקל עבור גלשני SUP?
      description: גלשני SUP שלנו תומכים עד 150 ק"ג תלוי בדגם ובנפח. גלשן Leviathan Wake הוא הדגם שלנו עם הקיבולת הגבוהה ביותר, המיועד לרוכבים גדולים יותר ושימוש ביוגה.
    - title: האם אתם מציעים חבילות SUP שלמות?
      description: כן. כל גלשן SUP נשלח עם חבילה מלאה הכוללת משוט אלומיניום ב-3 חלקים, משאבת יד בלחץ גבוה, רצועת ביטחון קווית, תיק נסיעות וערכת תיקון. חלק מהדגמים כוללים גם סט סנפירים נשלפים.
    - title: מהי האחריות על גלשני SUP?
      description: כל גלשני Aquafarer SUP נושאים אחריות לשנתיים נגד פגמים בייצור, כולל כשל בתפרים, פגמים בשסתומים והיפרדות החומרים בשימוש רגיל.
    - title: כמה זמן לוקח לנפח גלשן SUP?
      description: באמצעות משאבת היד המצורפת, מילוי מלא ללחץ של 15 PSI לוקח בערך 8–12 דקות. לניפוח מהיר יותר, אנו ממליצים על משאבת החשמלית 12V Aquafarer שלנו, שמנפחת גלשן בפחות מ-4 דקות.
