hero:
  tagline: אודותינו
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock מפעל וסדנה
  title: |
    מהנדסת ים,<br />
    בנו את<span class="text-accent dark:text-white">Paddle Board Overstock</span>הדרך
  subtitle: 'התחלנו בסדנה על החוף עם סירה אחת ואמונה עיקשת: מוצרי ים צריכים להיות מתוכננים כאילו הם חשובים, כי הם אכן חשובים. היום אנו שולחים ליותר מ-50 מדינות, אך כל גוף סירה עדיין עובר דרך אותן ידיים שהקימו את החברה.'
stats:
  title: לפי המספרים
  columns: 4
  stats:
    - title: גופי סירות שנמסרו
      amount: 2,400+
    - title: מדינות אליהן שולחנו
      amount: 50+
    - title: שנות ניסיון מצטברות
      amount: '60'
    - title: זמן תגובה ממוצע לאחר אחריות (שעות)
      amount: '24'
features3_what_we_build:
  title: מה אנו בונים
  subtitle: קו מוצרים ממוקד שאנו מכירים לעומק — אין ניסויים חצי גמורים, אין הנדסת תגיות.
  columns: 3
  isBeforeContent: true
  items:
    - title: סירות RIB
      description: סירות מאלומיניום RIBs מאורך של 3.3 מ' עד 7.5 מ'. מתוכננות לסיור, צלילה, דיג ושימוש משפחתי.
      icon: tabler:ship
    - title: סירות מתנפחות
      description: סירות PVC ו-Hypalon מתנפחות מאורך 2.4 מ' עד 4.2 מ'. קלות, עמידות וקלות לאחסון.
      icon: tabler:speedboat
    - title: סירות סופריאכט
      description: RIBs קומפקטיות, מותאמות אישית, עם מפרט גבוה, תואמות למראה הספינה הראשית שלך.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: אביזרים
      description: משוטים, משאבות, כיסויים, תיקים יבשים, מכלי דלק ואלקטרוניקה. כולם מותאמים לסירות שלנו.
      icon: tabler:package
    - title: שיפוץ ותיקון
      description: החלפת צינורות בתוך הבית, שדרוג אלקטרוניקה ושדרוגי מנועים.
      icon: tabler:tool
    - title: בניית מותאם אישית
      description: עיצוב פרויקט-פרויקט ללקוחות מסחריים, מדעיים ומדיניים.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: דיון על עיצוב והנדסת סירות
steps2_values:
  title: הערכים שלנו
  subtitle: שלושה עקרונות שעיצבו כל מוצר מאז היום הראשון.
  items:
    - title: לבנות כאילו זה נוגע למשפחתך
      description: כל מבנה, ריתוך וחיזוק מטופלים כאילו המשפחות שלנו ישתמשו בהם.
      icon: tabler:heart
    - title: מהנדסים לפני שמוכרים
      description: אם מפרט שגוי, אנו משנים את המפרט — אף פעם לא את הלקוח.
      icon: tabler:settings
    - title: תמיכה שנשארת מעבר לאחריות
      description: מבנים בני עשרים שנה עדיין מתקשרים אלינו עבור חלקי חילוף, ואנחנו עדיין עונים.
      icon: tabler:headset
steps2_milestones:
  title: אבני דרך
  subtitle: גרסה קצרה של הסיפור Paddle Board Overstock.
  isReversed: true
  items:
    - title: הוקם בסדנה חופית
      description: התחיל על ידי שני טובי אדריכלים ימיים עם CNC מיל ורעיון עקשן.
      icon: tabler:building-factory
    - title: מסירת 1,000 מבנים ראשונים
      description: הושג בשנתנו השביעית, בעיקר באמצעות פה-לאוזן ולקוחות חוזרים.
      icon: tabler:circle-check
    - title: תכנית ייצוא בינלאומית
      description: כעת נשלח ל-50+ מדינות עם שותפי תמיכה מקומיים בחמישה יבשות.
      icon: tabler:world
    - title: מבנה תפעולי גלובלי חדש
      description: בספטמבר 2026, פעולות המותג עברו מקינגדאו Vatrad Group ל-Weihai Dongjilian Co., Ltd. (ניו מקסיקו, ארה"ב); מרכז הייצור בקינגדאו ממשיך במחקר ופיתוח, ייצור וייצוא ישיר מהמפעל.
      icon: tabler:building-skyscraper
features2_locations:
  title: מיקומים שלנו
  tagline: מצאו אותנו
  columns: 3
  items:
    - title: מטה וסדנה
      description: פארק תעשייתי חופי, בניין 4 — פתוח בימים שני–שישי לביקורים בתיאום מראש.
    - title: מרכז שירות באיחוד האירופי
      description: נמל מרוחק בים התיכון — חידוש, תיקון ותמיכת אחריות ללקוחות אירופיים.
    - title: רשת שותפים באסיה-פסיפיק
      description: שותפי שירות מורשים באוסטרליה, יפן, סינגפור והונג קונג.
brand_hub_tagline: מותג
brand_hub_title: חקור את המותג שלנו
brand_hub_subtitle: צללו עמוק יותר למומחיות שלנו בהנדסה ימית, נוכחות גלובלית, והעקרונות שמניעים אותנו.
brand_hub_cards:
  - title: מומחיות ימית
    desc: עשרות שנות מדע חומרים, ייצור מדויק ובדיקות בעולם האמיתי — מיצור PVC/Hypalon ועד לעיצוב גוף סירה V-עמוק וטכנולוגיית drop-stitch.
    link: /brand-marine-expertise
    link_label: למד עוד →
  - title: נוכחות גלובלית
    desc: משלוח ל-50+ מדינות ממתקני הצ'ינגדאו שלנו עם שותפי שירות מורשים ברחבי אירופה, אסיה-פסיפיק והאמריקות.
    link: /brand-global-presence
    link_label: למד עוד →
  - title: למה Paddle Board Overstock
    desc: אינטגרציה אנכית, הסמכה כפולה (ISO 9001 + BSCI), ציות ל-CE, ועלות נמוכה ל-MOQs — מותאמים למותגים, למפיצים ולסוכנויות ממשלתיות.
    link: /brand-why-paddleboardoverstock
    link_label: למד עוד →
production_section:
  tagline: מצוינות בייצור
  title: הבטחת מלאכת יד מעולה
  description: קו הייצור Paddle Board Overstock מוקדש לייצור מוצרים של סירות מתנפחות באיכות גבוהה, עמידות וביצועים גבוהים.
  cards:
    - title: צוות טכנאים מנוסה
      items:
        - ידע מקצועי בPVC, Hypalon, וחומרים ימיים
        - מיומנות מדויקת בחיתוך, הדבקה והתקנת אביזרים
        - הכשרה רציפה לשליטה בטכנולוגיות הייצור האחרונות
    - title: ציוד ייצור מתקדם
      items:
        - CNC ציוד חיתוך לחיתוך בד מדויק עם מינימום שגיאות
        - חיבור חום/קירור מדויק במיוחד לתפרים אטומים ועמידים
        - ציוד מקצועי לבדיקת אטימות ומתח
    - title: מערכת ניהול בוגרת
      items:
        - תהליכי ייצור מסטנדרטים עם סטנדרטים ברורים לאיכות
        - פילוסופיית ייצור רזה שמפחיתה בזבוז ומשפרת יעילות
        - ניהול שרשרת אספקה יעיל עם שותפויות ספקים אמינות
    - title: בקרת איכות קפדנית
      items:
        - מערכת ניהול איכות מוסמכת
        - 'בדיקה רב-שלבית: חומר גלם, בתהליך, יציאה סופית'
        - בדיקות קפדניות של אטימות ואורך חיים לפני המשלוח
global_ops_section:
  tagline: ארכיטקטורת תפעול עולמית
  title_html: מותג אחד,<span class="text-white/90">שניים מרכזים</span>
  description_html: מאז ספטמבר 2026, Paddle Board Overstock מופעל על ידי<strong class="text-white">Paddle Board Overstock חברה בע"מ</strong>(ניו מקסיקו, ארצות הברית) — הגורם העולמי להפצה, מכירות B2B מסחריות, חוזים, חיוב ואחריות לאחר המכירה. מחקר ופיתוח, ייצור ובקרת איכות נשארים ב<strong class="text-white">Paddle Board Overstock מרכז הייצור צ'ינגדאו</strong>, ששולחת כל הזמנה ישירות מהמפעל, FOB צ'ינגדאו. המעבר שינה מי חותם על החוזה שלך — לא מי בונה את הסירה שלך.
  stats:
    - value: 2,400+
      label: גופים נמסרו ברחבי העולם
    - value: 50+
      label: מדינות ייצוא
    - value: 10+
      label: שנות ייצור
