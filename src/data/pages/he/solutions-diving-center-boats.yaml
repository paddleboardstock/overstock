  subtitle: פלטפורמות יציבות ומרווחות המיועדות לצלילה יומיומית מרובת מסלולים — עם סיפוני ציוד גדולים, מערכות עלייה ידידותיות לצוללנים ועמידות ברמה ימית לסביבות מים מלוחים טרופיות.
