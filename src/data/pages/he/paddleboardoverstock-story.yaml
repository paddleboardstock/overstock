timeline:
  - year: '2012'
    title: קרן הייצור הימי
    body: Paddle Board Overstock הסדנה החלה כסדנה מיוחדת לכלי שיט מתנפחים בצ'ינגדאו, סין, שהתחייבה למלאכת יד ימית וייצור סירות מתנפחות. המוקד המוקדם היה בבניית מוצרים מתנפחים אמינים באמצעות ניסיון הנדסי מעשי ומשמעת ייצור.
  - year: '2015'
    title: יצוא ראשון CE והסמכה
    body: הזמנות יצוא ראשוניות הגיעו ליפן ולקוריאה.CE הושג הסמכה לקווי ליבה של המוצרים, מה שסימן Paddle Board Overstockאת כניסתה לשווקים בינלאומיים. החברה החלה לשרת משתמשים מסחריים ופנאי מעבר לסין.
  - year: '2018'
    title: הרחבת המפעל
    body: הועבר למתקן ייצור בשטח של 12,000 מ"ר. נוספו קווי ריתוך RF drop-stitch וקיבולת ייצור, מה שאפשר ייצור בקנה מידה גדול ומערכות בקרת איכות משופרות.
  - year: '2020'
    title: מרכז מחקר ופיתוח שהוקם
    body: נפתח מרכז מחקר ופיתוח ייעודי עם PVC מעבדת בד, מיכל בדיקה הידרודינמי וסטודיו סימולציה CAD/FEA. פיתוח המוצר התרחב להתמקד בבנייה קלה משקל, עמידות משופרת ועיצוב ממוקד משתמש.
  - year: '2022'
    title: הסמכה וצמיחה גלובלית
    body: השיג ISO הסמכת 9001. התרחב ל-14 מהנדסי מחקר ופיתוח ו-200+ עובדים. המוצרים הגיעו ללקוחות ברחבי אירופה, אמריקה ואסיה-פסיפיק דרך מפיצים OEM ושותפויות.
  - year: '2024'
    title: סטודיו לחדשנות ועיצוב
    body: השיק סטודיו לעיצוב וחדשנות מלא ODM לפרויקטים מותאמים אישית, מהקונספט ועד הייצור. חיזק יישומים מקצועיים ימיים כולל הצלה, מכרזים מסחריים וממשלתיים.
  - year: '2026'
    title: בניית עתיד חקר המים
    body: כיום, Paddle Board Overstock ממשיכה לפתח סירות מתנפחות, SUP מערכות ופתרונות ימיים מותאמים אישית — שמחברים אנשים וארגונים למימי העולם. 50+ מדינות שירתו בפועל, קיבולת שנתית של 15,000 יחידות.
content_founding:
  tagline: ההתחלה
  title: נולד על קו המים
  subtitle: "Paddle Board Overstock התחלתי בסדנה חופית בצ'ינגדאו עם סירה אחת וחזון: לבנות כלי שיט מתנפחים שיכולים להתמודד עם תנאי ים אמיתיים."
  paragraphs:
    - בשנת 2012, המייסדים שלנו ראו פער בשוק — רוב הסירות המתנפחות היו או זולות אך לא אמינות, או באיכות גבוהה אך יקרות מאוד. הם האמינו שיש מקום ליצרן שמספק גם איכות וגם ערך.
    - הגוף הראשון נבנה ביד, נבדק במים מקומיים ושופר על בסיס משוב אמיתי מדייגים ומפעילים מסחריים קטנים. לולאת המשוב הזו — בנייה, בדיקה, הקשבה, שיפור — נשארת בלב הפילוסופיה ההנדסית שלנו כיום.
    - עד 2015, השמועה התפשטה מעבר לצ'ינגדאו. מפיצים בינלאומיים החלו לבקש דוגמאות. מה שהתחיל כסדנה מקומית הפך לספק גלובלי.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock סדנת ייצור מוקדמת וייצור
content_growth:
  tagline: צמיחה וחדשנות
  title: מסדנה למתקן בשטח של 12,000 מ"ר
  subtitle: השקעה מתמשכת באנשים, ציוד ותהליכים Paddle Board Overstock הפכה למתקן ייצור ימי מודרני.
  paragraphs:
    - ככל שהביקוש גדל, כך גדל גם המתקן שלנו. התרחבנו מסדנה קטנה למפעל בשטח של 12,000 מ"ר עם קווי ייצור ייעודיים RIB לסירות, סירות מתנפחות, SUP לוחות ואביזרים.
    - השקענו CNC במכונות חיתוך, ציוד ריתוך בתדר גבוה, קווי ייצור תפר דרופ ומתקני בדיקה מקיפים — מה שאפשר לנו לשלוט בכל היבט של איכות הייצור.
    - כיום, הצוות שלנו, שמונה 200-300 איש, כולל מהנדסי ים, מדעני חומרים, מומחי בקרת איכות ובעלי מלאכה מיומנים — רבים מהם עובדים Paddle Board Overstock מאז הימים הראשונים.
founder:
  tagline: הכירו את המייסד
  title: נבנה על ידי איש מים
  subtitle: המייסד דיוויד צ'ן משלב מומחיות בייצור ותשוקה לכל החיים לספורט מים — שילוב שמגדיר כיצד Paddle Board Overstock לגשת לפיתוח מוצר.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: דיוויד צ'ן — מייסד Paddle Board Overstock
  story:
    - דיוויד צ'ן גדל על חוף צ'ינגדאו, שם הים לא היה יעד נופש אלא דרך חיים. הוא בילה את נעוריו בקיאקים, שיט ודיג בים הצהוב — חוויות שנתנו לו הבנה אינטואיטיבית של מה שספינות המים צריכות לעבור.
    - לפני Paddle Board Overstockהקמתו, דיוויד עבד עשור בייצור ימי, ועבד בתחומי הייצור, האיכות והסחר הבינלאומי. הוא OEM ניהל תוכניות למותגים אירופיים וצפון-אמריקאיים, ולמד ממקור ראשון את הסטנדרטים והציפיות של השווקים הגלובליים.
    - 'ב-2012, הוא ייסד Paddle Board Overstock עם משימה פשוטה: לבנות כלי שיט מתנפחים שהוא סומך עליהם עם משפחתו על המים. הסטנדרט האישי הזה — האם אשתמש בזה? — נשאר המבחן הסופי לכל מוצר שיוצא מהמפעל.'
    - כיום, דיוויד מוביל את אסטרטגיית המוצר ומפקח על צוות המחקר והפיתוח, סוקר באופן אישי עיצובים חדשים ובודק אב-טיפוס במים מול צ'ינגדאו. הוא מאמין שמוצרים מצוינים מגיעים מהבנת ההנדסה והחוויה.
philosophy:
  tagline: פילוסופיית המותג
  title: חופש הנדסה על מים
  body: חופש על המים אינו רק תנועה. הוא מייצג גילוי מקומות חדשים, יצירת חוויות חוץ, חיבור אנשים לטבע ואפשרות למשימות מקצועיות. ההנדסה מאפשרת את החופש הזה.
  pillars:
    - title: אמינות ראשונה
      body: סביבות מים דורשות אמון.Paddle Board Overstock המוצרים מעוצבים סביב יציבות, עמידות, בטיחות וביצועים עקביים.
    - title: עיצוב ממוקד אדם
      body: המוצרים צריכים לשרת אנשים, לא את הטכנולוגיה. כל החלטת עיצוב מתחילה בהבנה כיצד אנשים משתמשים בכלי שיט מים, היכן הם חוקרים, ואילו אתגרים הם מתמודדים איתם.
    - title: חקר נגיש
      body: המים לא צריכים להיות שייכים רק למומחים.Paddle Board Overstock יוצר ציוד שמאפשר ליותר אנשים לחוות בבטחה נהרות, אגמים, אוקיינוסים וסביבות חופיות.
    - title: חדשנות מתמשכת
      body: חדשנות אינה רק יצירת מוצרים חדשים. היא משפרת כל פרט — חומרים, מבנים, ייצור וחוויית משתמש.
engineeringDna:
  tagline: DNA הנדסי
  title: איך Paddle Board Overstock יוצרים מוצרים
  areas:
    - title: מדעי החומרים
      body: Paddle Board Overstock מתמקדת בבחירת חומרים מתאימים לסביבות ימיות שונות. שיקולים מרכזיים כוללים עמידות לשחיקה, עמידות ל־UV, יציבות ללחץ, ועמידות ארוכת טווח.
      items:
        - עמידות בפני שחיקה
        - עמידות UV
        - יציבות ללחץ
        - עמידות ארוכת טווח
    - title: הנדסה מבנית
      body: סירות מתנפחות דורשות איזון מדויק בין קשיחות, משקל, ניידות ויציבות. הנדסת Paddle Board Overstock מתמקדת באופטימיזציה של גורמים אלו באמצעות טכנולוגיית ליבה drop-stitch ובנייה מתקדמת של תפרים.
      items:
        - קשיחות
        - אופטימיזציה של משקל
        - הִטַלטְלוּת
        - יַצִיבוּת
    - title: דיוק בייצור
      body: 'כל מוצר עובר תהליכים מבוקרים: הכנת חומר, חיתוך מדויק, ריתוך ודביקה, הרכבה, בדיקת איכות ואימות ביצועים.'
      items:
        - הכנת חומר
        - חיתוך מדויק
        - ריתוך ודביקה
        - הרכבה ובקרת איכות
    - title: הנדסת תרחיש משתמש
      body: מוצרים מפותחים סביב שימושים אמיתיים — פנאי, הרפתקה ושימוש מקצועי — כדי להבטיח שכל עיצוב עומד בדרישות הספציפיות של הסביבה המיועדת.
      items:
        - פנאי
        - הרפתקה
        - Professional
        - מִסְחָרִי
