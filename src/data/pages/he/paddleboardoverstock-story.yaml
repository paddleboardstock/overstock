  title: Paddle Board Overstock — חירות הנדסה על מים
  subtitle: 'מסדנה חופית ועד יצרן ימי עולמי — המסע שלנו מבוסס על אמונה עיקשת: כלי שיט צריכים להיות מהונדסים כאילו הם חשובים, כי הם באמת חשובים.'
