testimonial:
  content: התחלנו עם חבילת המתחילים למועדון הגלישה שלנו בפורטוגל. 20 לוחות, משוטים, אפודים — הכל הגיע תוך 3 שבועות. לאחר שתי עונות, שידרגנו לחבילת הפרו. המיתוג המותאם אישית עם הלוגו שלנו שינה את התדמית המקצועית שלנו.
  name: ריקארדו סנטוס
  title: בעלים, אקדמיית הגלישה באלגרבה — לגוס, פורטוגל
content_segments:
  tagline: פרופילים של מועדונים
  title: פתרונות למועדוני ספורט מים<br />לפי סוג המועדון
  subtitle: ממועדוני משוטים באוניברסיטאות ועד מועדוני יאכטות פרטיים יוקרתיים — לכל סוג מועדון יש צרכי ציוד ייחודיים, דפוסי שימוש ומבני תקציב שונים. אנו מתאימים כל חבילה למודל המועדון.
  items:
    - title: מועדוני משוטים באוניברסיטאות ומכללות
      subtitle: ציי סטודנטים בשימוש גבוה
      description: מועדוני משוטים המופעלים על ידי סטודנטים או נתמכים על ידי המוסד, הפועלים SUP ותוכניות קיאקים למחלקות פנאי באוניברסיטה. הציוד נתון לשימוש תכוף ונשקף להחלפות רבות ברמות מיומנות שונות בכל סמסטר. עמידות ויכולת תיקון קלה קריטיות, לצד תמחור ידידותי לתקציב לארגוני סטודנטים.
      features:
        - מבנה PVC עמיד במיוחד המיועד למחזורי שימוש של סטודנטים
        - טווחי לוחות מקודדים לפי רמת מיומנות לניהול צי קל
        - ערכת תיקון + תמיכה בוידאו לפי קריאה כלולה בכל הזמנה
        - תמחור בהנחת ארגון סטודנטים ותנאי תשלום מבוססי סמסטר
    - title: מועדוני קיאקים וקליעה חברתיים
      subtitle: מועדונים לפנאי המונעים על בסיס חברות
      description: מועדונים קהילתיים המציעים לחברים חוויות של SUP, קיאק, וקליעה חברתית. הציוד צריך לאזן בין ביצועים לנוחות עבור טווח גילאים רחב, עם מיתוג שמעודד זהות מועדון וגאוות חברים. יעילות אחסון הינה חיונית למועדונים המופעלים מגישה מוגבלת לחוף.
      features:
        - 'צי משולב: SUPs לכל שימוש, לוחות טיולים וקיאקים לפנאי'
        - 'מיתוג מלא של המועדון: צבעים מותאמים אישית, הדפסת לוגו, אפודי הצלה ממותגים'
        - פתרונות אחסון קומפקטיים לציוד מתנפח
        - 'ערכת התחלת צמיחת חברות: כרטיסי הפניה, צילום ממותג'
    - title: בתי ספר לגלישה ואקדמיות קיאק גלישה
      subtitle: ביצועים חופיים ואימון
      description: בתי ספר המתמקדים בגלישה מלמדים SUP, גלישת קיאק ויכולות רכיבת גלים. הציוד חייב לפעול בתנאי גל — גמיש, מגיב ועמיד מספיק כדי להתמודד עם הפלות חוזרות, שחיקה מחול וציפה במים מלוחים ללא הידרדרות מהירה.
      features:
        - צורות SUP קצרות ורחבות מותאמות למניפולציה בגלים
        - בניית מסילות מחוזקות לעמידות בפני פגיעות בגלים
        - 'ציוד בטיחות ייחודי לגלישה: רצועות סליליות, אפשרויות סנפירים רכים'
        - תוכנית החלפת צי צי עם הנחות עונתיות
    - title: מועדוני יאכטות פרטיים וחברותיים
      subtitle: חוויות פרימיום לחברים
      description: מועדונים פרטיים בלעדיים המציעים ספורט ימי כאטרקציה פרימיום לחברים. סטנדרטי הציוד גבוהים — אסתטיקה, התאמת מותג והצגת אירוח חשובות כמו הביצועים. הציפיות בשירות כוללות משלוח בגובה לבן, פתרונות אחסון מותאמים אישית ותמיכה ברמת קונסיירז'.
      features:
        - לוחות גימור פרימיום עם דפוס עץ EVA והבלטות מתכתיות
        - התאמת צבע מותאמת אישית להנחיות מותג המועדון
        - "משלוח קונסיירז': מנופח מראש, מסודר ומסומן לכל עונה"
        - ניהול חשבון ייעודי עם SLA לתגובה בעדיפות
