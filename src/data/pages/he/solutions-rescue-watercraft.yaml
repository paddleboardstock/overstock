content_challenge:
  tagline: האתגר
  title: פעולות הצלה דורשות<br />אמינות ללא פשרות
  subtitle: ארגוני חיפוש והצלה פועלים תחת אחריות בטיחותית קיצונית — כל כשל בסירה נושא תוצאות בלתי קבילות.
  paragraphs:
    - בפעולות הצלה, המרווח בין הצלחה לכישלון נמדד בדקות. הסירה חייבת להיות מוכנה להשקה מיידית, לפעול בתנאים קשים ולחזור בבטחה עם נוסעים. אחריות הבטיחות היא מוחלטת — כשל מכני במהלך משימת הצלה אינו עלות תיקון, אלא חיים אבודים.
    - סירות חיפוש והצלה זקוקות למהירות גבוהה כדי להגיע לנפגעים במהירות, בשילוב עם יציבות יוצאת דופן לפעולות חילוץ בטוחות. הן חייבות לשאת ציוד הצלה, ציוד רפואי וציוד תקשורת — לעיתים בחלל סיפון מוגבל. סירות הפועלות בשירות ממשלתי גם זקוקות לתוחלת שירות ארוכה (10-15+ שנים) כדי להצדיק תקציבי רכש ציבוריים.
    - ראות, הן למפעיל והן לחיפוש, היא קריטית. עיצוב הקונסולה חייב לספק ראות של 360 מעלות, והסירה צריכה להיות נראית היטב למטוסים ולסירות אחרות.
    - Paddle Board Overstock סירות הצלה RIBs מהונדסות מהיאולטה למעלה לפי דרישות אלו — עם סיפונים מתרוקנים עצמונית, גלים מחוזקים, מערכות ניווט ועמודי גרירה סטנדרטיים בדגמי סיור.
content_solution:
  tagline: הפתרון שלנו
  title: סירת הצלה ייעודית RIBs
  subtitle: כל Paddle Board Overstock סירת הצלה מעוצבת לעמוד או לעבור את SOLAS וסטנדרטים הלאומיים של חיפוש והצלה.
  list:
    - סיפון מתרוקן עצמונית — המים מתנקזים אוטומטית ליציבות במהלך פעולות חילוץ
    - סיפון V-עמוק מחוזק — יכולת פעולה במים סוערים עם טיפול צפוי במהירות
    - מערכת תאורת ניווט מלאה — פעולה ביום ולילה בכל תנאי מזג האוויר
    - עמוד גרירה וחבל גרירה — מוכן לגרירת סירה או פעולות מזחלת הצלה
    - לוחות הרכבת ציוד — רדיו, פנס חיפוש, סירנה וציוד רפואי
    - תצורות מנוע מרובות — יתירות יחיד חיצוני או שני מנועים
    - צבעי צינורות בעלי נראות גבוהה — כתום, צהוב או אדום למקסימום ראות
content_segments:
  tagline: פרופילי חילוץ
  title: פתרונות כלי שיט חיפוש והצלה<br />לפי סוג ארגון
  subtitle: ארגוני חילוץ שונים פועלים תחת מנדטויות, מחזורי תקציב וסביבות פעולה שונות — מצוותי מתנדבים חופיים ועד צי משמר החופים הלאומי. אנו מגדירים כל חילוץ RIB כך שיתאים לפרופיל המשימה.
  items:
    - title: משמר החופים וסוכנויות חיפוש והצלה ממשלתיים
      subtitle: אחריות בטיחות מוחלטת — תקני צי קריטיים למשימה
      description: סוכנויות חיפוש והצלה ממשלתיות נושאות את האחריות הבטיחותית הגבוהה ביותר בפעילות ימית. כל סירה חייבת לפעול ללא דופי בתנאים קיצוניים — כשל ציוד במהלך משימת חילוץ אינו אופציה. החלטות הרכש מונעות על ידי עלות הבעלות הכוללת לאורך חיי שירות של 10-15 שנים, ולא מחיר ראשוני. סוכנויות זקוקות לכלי שיט ששורדים שנים של סיורי חוף, עומדים בסטנדרטים לאומיים מחמירים ומספקים ביצועים עקביים בתחנות מבוזרות. תיעוד ציות מקיף והסכמי שירות רב-שנתיים הם חובה.
      features:
        - SOLAS וחבילת תיעוד עמידה בתקני SAR לאומיים
        - משותף לחלקים בצי — הפחתת מורכבות המלאי ברמת התחנה
        - תצורת שני מנועים לצורך גיבוי קריטי למשימה
        - עיצוב חיי שירות ל-10-15 שנים עם תוכניות תחזוקה מתוזמנות
        - יכולת לכל מזג אוויר — גוף V מחוזק במצבי ים סוערים
    - title: מצילים ושירותי חילוץ חופים
      subtitle: פעולות שיגור מהיר במים רדודים
      description: שירותי מצילים עירוניים וחוף הים זקוקים לכלי שיט בתגובה מהירה שיכולים לשגר דרך אזורי גלישה, לפעול במים רדודים בחוף ולהגיע לשחיינים או לכלי שיט במצוקה תוך דקות. הציוד חייב להיות קל מספיק לגרירה על החוף ברכב קטן או ידנית.
      features:
        - גוף בעל שוקע רדוד RIB לאזור גלישה ולפעילות חופית
        - יכולת שיגור חוף, עם ידית הרמת חרטום ומגן קיל
        - מזחלת חילוץ משולבת או פלטפורמת שחייני חילוץ
        - צבעי צינורות כתום או צהוב עם נראות גבוהה סטנדרט
    - title: מחלקות כיבוי אש והצלה
      subtitle: אינטגרציה עם משאבות אש, התקנת ציוד, תגובה מהירה
      description: יחידות חילוץ אש מגיבות לשריפות מבנים על קו המים, שריפות כלי שיט ואירועי חילוץ מבוססי מים. סירות אלו חייבות לשאת משאבות כיבוי, מוניטורים, אחסון צינורות ומערכת נשימה — הכל משולב בפלטפורמה יציבה ומהירה. מחלקות משתמשות גם בכלי שיט אלו לתגובה לשיטפונות ולפעולות סיוע הדדי. תכנון הקונסולה חייב לכלול בקרות משאבות, מערכות רדיו ותאורת חירום מבלי לפגוע במרחב הסיפון לתנועת הצוות.
      features:
        - מוניטור אש מותקן בקשת עם חבילת אינטגרציה של משאבה
        - התקנת ציוד ייעודי למשאבת כיבוי אש, אחסון צינורות וסטים של AB
        - פריסת קונסולה ניתנת להתאמה לבקרות משאבות, רדיו ותאורת חירום
        - סיפון שמתפרץ בעצמו לכיבוי אש, נגר מים ויציבות
        - 'חבילת תפעול לילה: פנס חיפוש, תאורת זירה, פס אור כחול/אדום'
    - title: משטרת הים ואבטחת הנמלים
      subtitle: אסורה, סיור, פעולות הספגה
      description: יחידות אכיפת חוק ימי דורשות כלי שיט המסוגלים למרדף במהירות גבוהה, הספגת סירת חשוד, וסיור ביטחוני בנמלים. סירות אלו חייבות לכלול אחסון בטוח לציוד נשק ואכיפה, אינטגרציה תקשורתית עם פיקוד החוף, ומרחב דק מספיק לפעולות צוות ההספגה. יכולת לפעולה בלילה וגישה בדממה חיוניות למשימות אסורה.
      features:
        - יכולת מרדף במהירות גבוהה — גוף מתכנן עם מהירות מקסימום של 40 קשרים
        - ארון נשק בטוח ותאי אחסון לציוד אכיפה
        - אינטגרציה של קונסולה לרדיו משטרתי, MDT ומערכות תקשורת
        - 'חבילת לילה: פנס IR, הרכבת FLIR, תאורה סמויה'
        - פלטפורמת הספגה מחוזקת עם משטח נגד החלקה
        - תאורת חירום כחול/אדום ומערכת אזעקה
    - title: מתנדבים בארגוני חילוץ ועמותות
      subtitle: פעולות חוף ואגמים מימון באמצעות מענקים ומבוססות קהילה
      description: קבוצות חילוץ מבוססות קהילה פועלות באגמים, נהרות ואזורים החופיים שבהם הכיסוי הממשלתי מוגבל. לעיתים ממומנות באמצעות תרומות או מענקי ממשלה, ארגונים אלו זקוקים ליכולות מקסימליות עבור כל דולר — כלי שיט אמין ודל תחזוקה שמתנדבים יכולים להפעילו בבטחה עם הכשרה מינימלית ייחודית. מחזורי המענק דורשים שהסירות יעמדו בדרישות התאימות תוך שמירה על התקציב.
      features:
        - תצורת מנוע חיצוני יחיד המותאמת להוזלת עלויות רכישה והתפעול
        - בניית PVC לצורך תחזוקה נמוכה ותיקון שדה קל
        - קונסולה רב-תפקודית המפחיתה את מורכבות האלקטרוניקה למפעילים מתנדבים
        - חבילת תיעוד תאימות למענקים עבור בקשות מימן
        - עיצוב קל משקל להשקה מהחוף ללא עגלה או מנוף ייעודי
    - title: חילוץ מהצפות ותגובת אסונות
      subtitle: הצפות פנימיות, מים רדודים, סביבות מלאות פגרות
      description: חילוץ מהצפות הוא פרופיל מבצעי ייחודי — סירות פועלות באזורים עירוניים מוצפים, זרמי מים מלאי פגרות ומים רדודים במיוחד שבהם מכשולים תת-מימיים בלתי נראים. מפעילים צריכים כלי שיט המסוגל לנווט ברחובות מוצפים, לדחוף דרך פגרות, ולחלץ נפגעים מבניינים ורכבים. יכולת שים-רפרישה רדוד קריטית, כמו גם היכולת לפעול בזרם עם סיכוני סניגה. סירות אלו לעיתים מועמדות דרך מחלקות כיבוי אש, הגנת אזרחית ועמותות סיוע בעת אסון.
      features:
        - גוף עם שים-רפרישה רדוד במיוחד — פעולה ב-30-50 ס"מ מים
        - חזית דחיפת פגרות והגנה מחוזקת על צינורות למכשולים תת-מימיים
        - דק עם ניקוז עצמי למי הצפה ולחילוץ נפגעים
        - צינורות בצבע כתום או צהוב לבולטות אווירית
        - עיצוב קל משקל לשינוע במסוק ולפריסה בכביש
        - נקודות הרמה מחוזקות להנפה ופעולות חילוץ בחבלים
