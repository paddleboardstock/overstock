certifications_section:
  tagline: הסמכות
  title: CE & ISO ייצור מוסמך
  subtitle: 64 הדגמים שלנו המוסמכים לפי CE עומדים בסטנדרטים בינלאומיים של בטיחות ואיכות.
values:
  - title: איכות קודם כל
    desc: כל סירה שיוצאת מהמפעל שלנו עוברת בדיקות חובה של שמירת אוויר, הרתמת תפרים ומערכות לפני המשלוח.
  - title: אינטגרציה אנכית
    desc: אנחנו שומרים על כל שלב — מחיתוך PVC עד להרכבה הסופית — ומבטלים אי-יעילות של קבלנים ומבטיחים איכות עקבית.
  - title: בטיחות כסטנדרט
    desc: תעודת CE היא ליבת המוצר שלנו. 64 הדגמים שלנו המוסמכים לפי CE עומדים בסטנדרטים של בטיחות האיחוד האירופי לשימוש פנאי ומסחרי.
  - title: ממוקדים בשותף
    desc: אנחנו בונים קשרי עבודה ארוכי טווח עם OEM, ODM ושותפי מותג פרטי באמצעות שקיפות, אמינות וצמיחה משותפת.
services:
  - title: OEM ייצור
    desc: אנחנו מייצרים לפי המפרט שלך. שתף את הרישומים שלך, וצוות ההנדסה שלנו מטפל בפרוטוטיפים, כלים וייצור.
  - title: ODM פתרונות
    desc: התחל מעיצובים קיימים שלנו. אפשר להתאים גודל, צבע, גרפיקה ואריזה כדי ליצור את קו המוצרים הייחודי שלך.
  - title: מותג פרטי
    desc: שם המותג שלך, הלוגו שלך, האריזה שלך. המוצרים מגיעים מוכנים להכירה קמעונאית עם אינטגרציה מלאה של המותג.
  - title: מיתוג מותאם
    desc: הדפסת ריפוד סיפון, גרפיקות גוף, מדבקות צינורות ותוויות מותאמות — נוכחות מותג עקבית בכל משטח.
certifications:
  - name: CE הסמכה
    desc: הסירות ואמצעי השיט שלנו עומדים בדרישות הוראות כלי השיט הפנאי של האיחוד האירופי (2013/53/EU) והסטנדרטים המתואמים הרלוונטיים.
    scope: סירות ואמצעי שיט
  - name: null
    desc: מערכת ניהול איכות מוסמכת לעיצוב, ייצור והפצה של כלי שיט מתנפחים.
    scope: כל המפעל
  - name: null
    desc: סירות מתנפחות — דרישות בטיחות וביצועים לסירות מתנפחות מחוזקות ולסירות בעלות גוף קשיח.
    scope: RIB וקווי מתנפחים
