factory_details:
  - label: גודל המתקן
    value: קמפוס משולב בשטח של 12,000 מ"ר (130,000 רגל רבוע) באזור הפיתוח הכלכלי של צ'ינגדאו
  - label: כושר שנתי
    value: 15,000 סירות כולל SUPs, קיאקים, דינגים RIBs, וציוד בטיחות
  - label: צוות מחקר ופיתוח
    value: 25+ מהנדסים בתחומי עיצוב מוצר, מדעי החומרים והנדסת איכות
  - label: ציוד מרכזי
    value: CNC שולחנות חיתוך, רתכים דיאלקטריים RF, איטומי אוויר חם, מדפסות דיגיטליות, תבניות פיברגלס, מתקני בדיקה לשמירת אוויר
  - label: קווי ייצור
    value: '6 קווים ייעודיים: PVC חיתוך, ריתוך צינורות, הנחת גוף פיברגלס, SUP הרכבה, RIB הרכבה, בקרת איכות סופית'
  - label: נפח הייצוא השנתי
    value: 8 מיליון דולר+ יוצאו ל-50+ מדינות ברחבי אירופה, אמריקה, אסיה-פסיפיק והמזרח התיכון
