hero:
  tagline: אוֹדוֹת
  title: אודות {SITE}
  subtitle: יצרן ספורט מים משולב אנכית — מחומר גלם ועד לסירה מוגמרת
intro:
  - "Aquafarer הוקמה בשנת 2012 עם משימה אחת: לתכנן ולייצר ציוד ספורט ימי שמתקדם על המים כפי שהוא מופיע בדוח האיכות. מה שהתחיל SUP כסדנת דירקטוריון ממוקדת התפתח למתקן ייצור משולב בשטח של 12,000 מטרים רבועים באזור הפיתוח הכלכלי של צ'ינגדאו, המייצר סירות מתנפחות, RIBsקיאקים, SUP לוחות, ציוד בטיחות ואביזרים ללקוחות ב-50+ מדינות."
  - כיום, Aquafarer פועלת כמותג מפעל — אנו מתכננים, מהנדסים, יוצרים אב-טיפוס, מייצרים ובודקים הכל תחת קורת גג אחת. האינטגרציה האנכית הזו מעניקה לנו שליטה ישירה על בחירת חומרים, איכות הבנייה ולוחות הזמנים של המסירה. כל סירה נבנית על ידי האנשים שלנו, על הציוד שלנו, לפי הסטנדרטים שלנו.
  - אנו משרתים משתמשי פנאי, מפעילים מסחריים, סוכנויות ממשלתיות ושותפי מותג ברחבי העולם. OEM ODM התוכניות שלנו מסייעות לעסקים להשיק קווי מוצרים משלהם מבלי להשקיע בתשתיות מפעל. בין אם אתם זקוקים לאב-טיפוס יחיד או ריצת ייצור מלאה, הצוות שלנו מלווה אתכם מהרעיון ועד למשלוח מוכן לים.
