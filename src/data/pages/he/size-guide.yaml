hero:
  title: מדריך מידות ומפרטים
  subtitle: מידות, קיבולות, ושימושים מומלצים לכל מוצר Aquafarer.
categories:
  inflatable: קיאקים מתנפחים SUPs וקיאקים מעוצבים לניידות ללא וויתור על ביצועים. התאימו את המידה הנכונה לפי משקלכם וסגנון ההחלקה שלכם.
  rib: סירות קשות מתנפחות לניווט חופי, סיור ולפעולות ימית מקצועיות. בחרו לפי אורך וקיבולת המנוע.
  accessory: אביזרים וציוד בטיחות להשלמת כלי השיט שלכם. מידות אוניברסליות עם מספר אפשרויות.
table:
  headers:
    product: מוּצָר
    length: מֶשֶׁך
    width: רוחב
    weight: מִשׁקָל
    max_load: מקסימום משקל
    best_for: הטוב ביותר עבור
how_to_choose:
  title: כיצד לבחור את המידה הנכונה
  cards:
    - title: SUP לוחות
      description: בחרו אורך בהתאם למשקלכם ולשימוש המתוכנן. לוחות רחבים יותר (32"+) מציעים יותר יציבות. לוחות ארוכים יותר (11-12 רגל) עוקבים טוב יותר לנסיעות. חותרות כבדות צריכות לוחות בעלי נפח גבוה יותר.
    - title: קיאקים
      description: קיאקים יחידים (9 רגל) מתאימים ביותר לנסיעות לבד ולנהרות. קיאקים טנדם (12 רגל) מתאימים לשני חותרות או למבוגר אחד עם ציוד. בדקו את קיבולת המשקל הכוללת כולל הציוד.
    - title: דינגי וRIBs
      description: בחרו אורך דינגי לפי מספר הנוסעים והשימוש המתוכנן. דינגי גדול יותר RIBs (4.5 מ'+) מתאים לשימוש בחוף ופעולות הצלה. דינגי קטן יותר (2.7 מ') משמש ככפפות וכפלטפורמות דיג.
