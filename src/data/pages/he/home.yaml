content_workshop:
  isReversed: true
  tagline: חוזק המפעל
  title: מדוע מחירי הניקוי שלנו<br />אמיתיים
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">מפעל אמיתי, חיסכון אמיתי — כל לוח נשלח מהמתקן שלנו בויהאי</h3>
  items:
    - title: אותם קווי ייצור כמו מותגים גדולים
      description: המפעל שלנו ב-Weihai בשטח של 12,000 מ"ר מייצר לוחות למותגים בינלאומיים ואצוותיו העודפות על אותם קווים עם אותם חומרים.
    - title: 100% לחץ נבדק
      description: כל לוח מופעל בלחץ עד פי 1.25 PSI ומחזיק לפני המשלוח. 99.3% שיעור ללא תקלות לכל AQL 2.5 / ISO 2859.
    - title: אין מתווכים
      description: הלוחות נשלחים ישירות מהמפעל עד הדלת. אין תוספת מחיר למפיץ, אין תוספת מחיר קמעונאית — כך מחירי הסחר נשארים עד 60% מתחת לקמעונאות.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock מפעל וויהאי בשטח של 12,000 מ"ר עם קווי ייצור מתנפחים SUP
content_compliance:
  tagline: הוכחת ציות ואיכות
  title: איכות מוסמכת,<br />מתועד
  subtitle: כל תביעת עמידה מגובה בתעודות ומסמכים ספציפיים לדגם הזמינים לאימות שלך.
  items:
    - title: ISO 9001:2015
      description: מערכת ניהול איכות מוסמכת על ידי TÜV Rheinland/SGS. ביקורות מעקב שנתיות. תהליכי בקרת איכות מתועדים מהחומר הנכנס ועד שחרור המשלוח.
      icon: tabler:certificate
    - title: CE מוסמך
      description: 13 CEדגמים מוסמכים SUP לפי הנחיות האיחוד האירופי החלות, כל אחד עם הצהרת התאמה ספציפית לדגם ונתוני לוחיות בונה.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: כל PVC החומרים הדביקים REACH עומדים בתקנות האיחוד האירופי.UKCA סימון זמין לשוק הבריטי. דפי נתוני בטיחות חומרים לפי בקשה.
      icon: tabler:shield-check
    - title: 2 שנות SUP אחריות
      description: כל SUP לוח ואביזר כוסו במשך שנתיים — drop-stitch תפרים, שסתומי נפיחה ואביזרים כלולים. התביעות נפתרו במהירות.
      icon: tabler:lifebuoy
steps:
  title: מהקופה למים — איך ההזמנה שלכם נשלחת
  items:
    - title: שלב 1:<span class="font-medium">בחר את הסקייטבורד שלך</span>
      description: בחרו בין דגמים כלליים, טיולים, יוגה ודגמי ילדים. מדריכי הקנייה שלנו עוזרים לכם להתאים את גודל הלוח והסגנון לחתירה שלכם.
      icon: tabler:clipboard-list
    - title: שלב 2:<span class="font-medium">צ'קאאוט מאובטח</span>
      description: שלמו בבטחה באמצעות Stripe או PayPal. כל כרטיסי האשראי והדביט המרכזיים מתקבלים. אין צורך בחשבון — אישור ההזמנה מגיע לתיבת הדואר שלכם.
      icon: tabler:file-text
    - title: שלב 3:<span class="font-medium">בדיקת איכות</span>
      description: כל לוח נבדק בלחץ של 100% בדירוג פי 1.25 PSI ונבדק מול רשימת איכות מלאה לפני האריזה.
      icon: tabler:settings
    - title: שלב 4:<span class="font-medium">הפצה מהירה</span>
      description: הזמנות במלאי נשלחות מהמפעל שלנו בוויהאי בתוך 2-3 ימי עסקים. טיפול מהיר זמין להזמנות דחופות.
      icon: tabler:building-factory
    - title: שלב 5:<span class="font-medium">משלוח מעקב</span>
      description: מעקב אחרי משלוחים ברחבי העולם ל-50+ מדינות. האחריות לשנתיים והתמיכה המגיבה לאחר המכירה מתחילים ביום הגעת הלוח שלך.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP תהליך ההזמנה מתשלום מאובטח ועד משלוח עולמי במעקב
blog_latest:
  title: SUP מדריכים ותובנות טכניות
  information: |
    מדריכי רכישה, טכניקת חתירה, עקרונות בטיחות ובנייה
    מחקר Paddle Board Overstock מהצוות.
faqs:
  title: SUP שאלות נפוצות על הזמנות ומוצרים
  subtitle: שאלות נפוצות לגבי לוחות הפינוי שלנו SUP , הזמנות, תשלום, משלוח ואחריות.
  columns: 2
  items:
    - title: האם קשה ללמוד SUP?
      description: בכלל לא. רוב המתחילים עומדים וחותרים כבר בסשן הראשון. SUP הגלשנים שלנו כוללים פלטפורמות יציבות רחבות במיוחד המיועדות במיוחד לחותרים בפעם הראשונה. תתחילו במים רגועים ותצאו לשייט תוך דקות.
      icon: tabler:swimming
      category: sup
    - title: מהי מגבלת המשקל?
      description: התמיכה הכוללת שלנו SUPs תומכת עד 220 פאונד ופלטפורמות הטיולים והיוגה תומכות עד 250 פאונד. כל עמוד מוצר מציג את קיבולת המשקל המדויקת של הרוכב כדי שתוכל להתאים את הגלשן לצרכים שלך.
      icon: tabler:adjustments
      category: sup
    - title: האם אוכל לנסוע עם מתנפח SUP?
      description: בהחלט. כל Paddle Board Overstock לוח נארז בתיק נשיאה בגודל תיק גב. במשקל של 18-22 פאונד בלבד, קל לשאת אותו לחוף, לאגם או דרך טרמינלים בשדה התעופה. בדוק את מדיניות המטען של חברת התעופה לפני הנסיעה.
      icon: tabler:truck-delivery
      category: sup
    - title: מה מגיע בקופסה?
      description: כל אחד Paddle Board Overstock SUP כולל את הלוח, תיק גב לנסיעות, משאבת יד, משוט מתכוונן, סנפיר נשלף, רצועת סליל וערכת תיקון.
      icon: tabler:clipboard-list
      category: sup
    - title: למה המחירים שלכם נמוכים יותר מהקמעונאי?
      description: אנו מוכרים מלאי עודף של ייצור ומלאי פינוי ישירות ממתקן הייצור שלנו בווהי, סין — ללא מתווכים, ללא תוספת מחיר קמעונאית. זה אומר חבילות SUP מלאות בהנחה של עד 60% ממחירי הקמעונאות הרגילים, עם אותה איכות מוסמכת CE.
      icon: tabler:certificate
      category: orders
    - title: איך אני מבצע הזמנה ומשלם?
      description: הוסף את חבילת SUP שלך לעגלה ושלם בבטחה עם Stripe או PayPal. אנו מקבלים את כל כרטיסי האשראי והחיוב המרכזיים. כל הזמנה מאושרת בדוא"ל עם חשבונית מלאה.
      icon: tabler:file-text
      category: orders
    - title: האם אתם שולחים לכל העולם?
      description: כן. אנו שולחים ל-50+ מדינות ברחבי האיחוד האירופי, צפון אמריקה, אסיה-פסיפיק, המזרח התיכון ואפריקה. הזמנות במלאי בדרך כלל נשלחות בתוך 2-3 ימי עסקים כאשר מסלול מעקב נמסר לכל חבילה.
      icon: tabler:route
      category: orders
    - title: איזו אחריות כלולות בלוחות SUP?
      description: 'כל לוח SUP וכל אביזר מכוסים על ידי אחריות של שנתיים — כולל הלוח עצמו, התפרים drop-stitch ושסתומי הניפוח. תביעות נפתרות בתוך ימים, לא שבועות: הגש בקשה באינטרנט ואנו נתקן או נחליף.'
      icon: tabler:lifebuoy
      category: orders
