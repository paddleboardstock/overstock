content_customer_types:
  tagline: מי אנחנו משרתים
  title: לוחות לכל אחד<br />סוג של חתור
  subtitle: בין אם זו הפגישה הראשונה שלך או החמישים שלך, יש לוח אישור שתואם לאופן שבו אתה מחתור.
  items:
    - title: מְתחִילִים
      description: לוחות רחבים ויציבים מכל הכיוונים שהופכים את המפגש הראשון שלך לקל — רוב המתחילים מצליחים לעמוד תוך דקות.
      icon: tabler:swimming
      cta: קנו ידידותי SUPsלמתחילים
      cta_href: /supboard
    - title: משפחות
      description: לוחות אורווה שכל המשפחה יכולה לחלוק, בנוסף לדגמים קלים יותר לילדים — ציוד שנכנס לרכב ומתנפח תוך דקות.
      icon: tabler:beach
      cta: קנה חבילות משפחתיות
      cta_href: /products
    - title: טורינג וחתרי כושר
      description: לוחות טיולים ארוכים ומהירים יותר ופלטפורמות יוגה מלאות לחותרים שמגיעים עד הסוף.
      icon: tabler:route
      cta: קניות לסיורים ולוחות יוגה
      cta_href: /supboard
    - title: דייגים
      description: פלטפורמות אולטרה-יציבות עם מתקני הילוכים ומקום למקרר — יוצקים ממרפסת שקטה ושטוחה.
      icon: tabler:lifebuoy
      cta: דיג SUPsבחנות
      cta_href: /products
features:
  id: features
  tagline: למה לקנות מ Paddle Board Overstock
  title: ריאל פקטורי,<br />חיסכון אמיתי
  subtitle: חבילות מלאי עודף וניקוי ישירים במפעל SUP — איכות מאושרת ללא תוספת מחיר קמעונאית.
  columns: 2
  items:
    - title: עד 60% הנחה על קמעונאות
      description: אנחנו מוכרים מלאי עודף במפעל ומשלוחי פינוי ישירות — בלי מתווכים, בלי תוספת מחיר קמעונאית. אותם לוחות שמוכרים במחיר מלא במקומות אחרים, במחירי סליקה כאן.
      icon: tabler:rocket
    - title: חבילות מלאות
      description: 'כל אחד SUP מגיע כחבילה שלמה: לוח, תיק גב נסיעות, משאבת יד, משוט מתכוונן, סנפיר נשלף, רצועת סליל וערכת תיקון.'
      icon: tabler:clipboard-list
    - title: איכות מוסמכת
      description: 13 CEדגמים מוסמכים SUP לפי הנחיות האיחוד האירופי החלות. כל לוח עובר בדיקת לחץ של 100% ב-1.25 PSI פעמים לפני המשלוח. 99.3% שיעור ללא תקלות AQL ל-2.5.
      icon: tabler:certificate
    - title: לא MOQ — צו לוח אחד
      description: פינוי עודף מלאי אומר שהזמנות ליחידה אחת מתקבלות בברכה. הוסף לוח לעגלה, צ'ק-אאוט, סיימתי. אין הזמנה מינימלית, אין תהליך הצעות מחיר.
      icon: tabler:adjustments
    - title: משלוחים מהירים ברחבי העולם
      description: הזמנות במלאי נשלחות מוויהאי בתוך 2-3 ימי עסקים. עקב אחרי משלוחים ל-50+ מדינות ברחבי האיחוד האירופי, צפון אמריקה, אסיה-פסיפיק ומעבר לה.
      icon: tabler:truck-delivery
    - title: 2 שנות SUP אחריות
      description: כל SUP לוח ואביזר מכוסים לשנתיים — drop-stitch כולל תפרים, שסתומי נפיחה ואביזרים. התביעות נפתרות בימים, לא בשבועות.
      icon: tabler:lifebuoy
