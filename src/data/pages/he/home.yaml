content_customer_types:
  tagline: מי אנחנו משרתים
  title: נבנה עבור קוני B2B<br />— לא קונים קמעונאיים
  subtitle: Paddle Board Overstock מייצרת לארבעה סוגי לקוחות. לכל אחד מהם עדיפויות שונות, ואנחנו עוסקים בכולם.
  items:
    - title: בעלי מותגים / תווית פרטית
      description: עיצוב מוצר מותאם אישית, גרפיקה בלייבל פרטי, תיעוד תאימות תחת המותג שלך, ותמיכה הנדסית ייעודית מהקונספט ועד למיכל.
      icon: tabler:palette
      cta: בקשת הצעת מחיר OEM/ODM
      cta_href: /request-quotation
    - title: מפיצים / סיטונאים
      description: הגנה על שטח, מחירי סיטונאות תחרותיים, ערכות תמיכה שיווקית, הדרכת מוצר, ותיעוד מלא לציות עבור השוק שלכם.
      icon: tabler:world
      cta: הגישו בקשה לסוכנות
      cta_href: /dealers-distributors
    - title: אתרי נופש / מפעילי השכרה
      description: עמידות מסחרית, ייעוץ על מימדי צי, הזמנות קונטיינר במודלים מעורבים, אסטרטגיית חלפים, וחבילות ציוד ממותגות לאתר הנופש.
      icon: tabler:beach
      cta: קבלו חבילת מסחר
      cta_href: /solutions/resorts
    - title: הצלה / ממשלה / מקצוענים
      description: Hypalon/CSM בנייה, אפשרויות ציות SOLAS, הסמכה ספציפית לפרויקט, תמיכה במסמכי מכרז, ומהנדסים מוגנים NDA.
      icon: tabler:shield
      cta: דונו בפרויקט
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: יכולת OEM/ODM
  title: מה תקבלו<br />עם Paddle Board Overstock
  subtitle: גישה ישירה למפעל עם תמיכה מלאה בהנדסה, איכות וציות — לא חברה מסחרית.
  columns: 2
  items:
    - title: התאמות OEM/ODM
      description: עיצוב גוף מותאם אישית, חומר צינור (PVC או Hypalon/CSM), פריסת קונסולה, מושבים, מיתוג, צבעים ואריזות. משינויים קטנים ועד הנדסה מותאמת מלאה.
      icon: tabler:adjustments
    - title: MOQ נמוך, דגימות מהירות
      description: 'RIB: 2-5 יחידות (תבנית קיימת). SUP: 5-10 יחידות ל-SKU. תבניות מותאמות אישית: 200+ יחידות. דגימות טרום-ייצור עם המיתוג שלכם ב-7-14 ימים.'
      icon: tabler:rocket
    - title: איכות מוכנה לייצור
      description: כל יחידה נבדקת בלחץ 1.25x מהדירוג PSI למשך 24-48 שעות. שיעור פגומים 0.7% לפי AQL 2.5 / ISO 2859. רשימת בדיקה איכות 100 נקודות לכל גוף.
      icon: tabler:certificate
    - title: תיעוד מלא לציות
      description: CE לפי 2013/53/EU (RCD), ISO 9001:2015 (SGS), ביקורת חברתית BSCI, ציות REACH, סימון UKCA. תעודת תאימות חובה לכל דגם ונתוני לוח הבונה כלולים.
      icon: tabler:file-certificate
    - title: זמן אספקה 30-45 ימים
      description: ייצור סטנדרטי 30-45 ימים FOB צ'ינגדאו. פרוטוטיפים 7-14 ימים. ייצור דחוף זמין. תוכניות טעינת קונטיינר ואריזות ISPM-15 כלולות.
      icon: tabler:truck-delivery
    - title: שירות לאחר מכירה וציוד חלפים
      description: 5 שנות אחריות על סירות / קיאקים / RIBs, שנתיים על SUP/אביזרים. אספקת חלפים עם משלוח מועדף. תמיכה בתהליך תביעות אחריות.
      icon: tabler:lifebuoy
content_categories:
  tagline: קטגוריות מוצרים
  title: 5 קטגוריות,<br />64 דגמים מוסמכים CE
  subtitle: משל 2.4 מ' RIB ועד 15 רגל SUP — כולם מיוצרים במתקן 9001 שלנו בצ'ינגדאו ISO.
  items:
    - title: RIB סירות
      description: 2.4 מטר עד 7.0 מטר עם גוף אלומיניום או GRP.PVC או HypalonCSM / שפופרות.CE לפי 2013/53/EU סיור, צלילה, חילוץ ותצורות מסחריות.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: סירות מתנפחות
      description: 2.0 מ' עד 5.0 מטר עם רצפת אלומיניום, רצפת דיקט או רצפת אוויר. דגמי דיג, פנאי וטנדר.
      icon: tabler:sailboat
      link: /products
    - title: SUP מועצות
      description: 9 רגל עד 15 רגל בקוטר 4 אינץ' ו-6 אינץDrop-Stitch'. דגמים רב-תחומיים, טיולים, יוגה ודיג. דגמים בדרגת מסחרי זמינים.
      icon: tabler:swimming
      link: /products
    - title: קיאקים
      description: קיאקים מתנפחים לאדם אחד עד שלושה אנשים. דגמי פנאי וטיולים עם Drop-Stitch אפשרויות רצפה.
      icon: tabler:kayak
      link: /products
    - title: אביזרי בטיחות
      description: CE-אפודי הצלה מוסמכים, חבלי זריקה, ערכות תיקון, משאבות ואורות ניווט. אפודיUSCG PFD מאושרים מסוג III/V.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: חוזק המפעל
  title: ייצור מוכן לביקורת<br />בצ'ינגדאו
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12,000 מ"ר ISO מתקן 9001 — יצרן אמיתי, לא חברת מסחר</h3>
  items:
    - title: 6 קווי ייצור ייעודיים
      description: RIBספינה מתנפחת נפרדת, SUPקיאק, ציוד בטיחות, OEMו/ODMקווים. כל אחת עם נקודות ביקורת ייעודיות ותכנון ייצור.
    - title: 100% לחץ נבדק
      description: כל תא מתנפח הועבר ללחץ עד פי 1.25 PSI והוחזק במשך 24-48 שעות. תוצאות הבדיקה קשורות למספר סידורי גוף (HIN).
    - title: מעקב לכל גוף
      description: 'רשומות ייצור ברמת HIN עם 21+ שדות נתונים לכל גוף: אצווה חומרים, זיהוי ריתוך, תוצאות בדיקת לחץ, תצורה סופית ויעד מסירה.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock מתקן ייצור בשטח של 12,000 מ"ר, ISO 9001 בצ'ינגדאו עם RIB קווי ייצור
content_compliance:
  tagline: הוכחת ציות ואיכות
  title: ראיות מתועדות,<br />לא רק תביעות
  subtitle: כל תביעת ציות מגובה בתיעוד ייחודי לדגם הזמין לאימות שלך.
  items:
    - title: ISO 9001:2015 (SGS)
      description: מערכת ניהול איכות מוסמכת על ידי TÜV Rheinland/SGS. ביקורות מעקב שנתיות. תהליכי בקרת איכות מתועדים מהחומר הנכנס ועד שחרור המשלוח.
      icon: tabler:certificate
    - title: CE לפי 2013/53/EU (RCD)
      description: 64 מודלים עם הצהרות התאמה ספציפיות למודל. הערכת התאמה לפי מודולים רלוונטיים. רישום HIN ונתוני לוחית בנייה עבור כל גוף.
      icon: tabler:file-certificate
    - title: BSCI ציות חברתי
      description: ביקורת שנתית BSCI על ידי SGS. נבדקו פרקטיקות עבודה אתיות, בטיחות במקום העבודה וניהול סביבתי בכל המתקן שלנו.
      icon: tabler:users
    - title: REACH & UKCA
      description: כל PVC וחומרי דבק עומדים בתקנות REACH של האיחוד האירופי. סימון UKCA זמין לשוק הבריטי. גיליונות בטיחות חומרים לפי בקשה.
      icon: tabler:shield-check
steps:
  title: OEM/ODM תהליך — מהקצרה ועד למיכל
  items:
    - title: שלב 1:<span class="font-medium">דרישות</span>
      description: שתפו את מפרטי המוצר שלכם, שוק היעד, כמות ודרישות ציות. צוות ההנדסה שלנו בוחן תוך 48 שעות.
      icon: tabler:file-text
    - title: שלב 2:<span class="font-medium">הצעה</span>
      description: קבלו הצעה מפורטת עם מפרטים, אפשרויות חומר, MOQ, תמחור, זמן אספקה והיקף הציות לשוק שלכם.
      icon: tabler:clipboard-list
    - title: שלב 3:<span class="font-medium">פרוטוטיפ</span>
      description: דוגמת טרום-ייצור עם המיתוג שלכם תוך 7-14 ימים. בדיקות איכות מלאות בלחץ מדורג של 1.25x. עלות הדוגמה מוכרת כלפי הייצור.
      icon: tabler:settings
    - title: שלב 4:<span class="font-medium">ייצור</span>
      description: 30-45 ימי ייצור FOB צ'ינגדאו לאחר אישור הדוגמה. נקודות בקרת איכות בתהליך, בדיקות לחץ ובדיקת סופי 100 נקודות על כל יחידה.
      icon: tabler:building-factory
    - title: שלב 5:<span class="font-medium">מסירה</span>
      description: תוכנית טעינת מכולות, אריזת עץ ISPM-15, חבילת מסמכי ציות ומשלוח FOB צ'ינגדאו עם כל ניירות היצוא.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock OEM/ODM תהליך ייצור סירות מתנפחות מהעיצוב ועד לשליחת מכולה
blog_latest:
  title: תובנות מקצועיות וטכניות
  information: |
    מדריכי ציות RCD, מאמרי תהליך OEM/ODM, השוואות חומרים,
    ומקורות בדיקת מפעל מצוות ההנדסה של Paddle Board Overstock.
faqs:
  title: B2B שאלות נפוצות ברכש
  subtitle: שאלות נפוצות ממותגים, מפיצים ומפעילים עסקיים על ייצור OEM/ODM עם Paddle Board Overstock.
  columns: 2
  items:
    - title: האם אתם יצרנים או חברה מסחרית?
      description: אנו מפעל משולב אנכית עם שליטה מלאה באיכות, חומרי חומר וזמני אספקה. רישיון עסק והיקף ייצור ניתנים לאימות במהלך ביקורת המפעל.
      icon: tabler:building-factory
      category: all
    - title: מהו תהליך OEM/ODM שלכם?
      description: סקירת דרישות (48 שעות) עד להצעה, פרוטוטיפ (7-14 ימים) ועד לייצור (30-45 ימים FOB צ'ינגדאו). תמיכה הנדסית מלאה, מסמכי ציות ועקביות לכל גוף הסירה לכל אורך התהליך.
      icon: tabler:route
      category: all
    - title: מהם דרישות MOQ שלכם?
      description: 'RIB סירות: 2-5 יחידות לכל דגם (תבנית קיימת), 200+ לתבניות מותאמות אישית. SUP לוחות: 5-10 יחידות לכל SKU. הזמנות מכולות עם דגמים מעורבים זמינות. הזמנות דגימה 2-5 יחידות להערכה.'
      icon: tabler:sort-ascending
      category: all
    - title: אילו אפשרויות התאמה אישית זמינות?
      description: עיצוב גוף הסירה, חומר הצינור (PVC או Hypalon/CSM), קוטר הצינור, פריסת קונסולה, ישיבה, הגה, מערכת דלק, פריסת דקה, צבעי מותג, גרפיקה של לוגו, עיצוב ריפוד EVA, אריזת קמעונאות, ומיתוג מדריך בעלים.
      icon: tabler:adjustments
      category: all
    - title: אילו מסמכי תאימות תוכלו לספק עבור השוק שלי?
      description: CE DoC לפי 2013/53/EU, סימון UKCA, תעודת ISO 9001 (SGS), דוח ביקורת BSCI, REACH תאימות, דוחות בדיקת חומרים, רישומי בדיקות לחץ, ונתוני לוח בונה לדגם ספציפי. מסמכים מותאמים לשוק לפי בקשה.
      icon: tabler:file-certificate
      category: all
    - title: מהו זמן דגימה והפקה?
      description: "דגימות לפני הייצור: 7-14 ימי עבודה. ייצור סטנדרטי: 30-45 ימים FOB צ'ינגדאו. ייצור מזורז זמין בעלות נוספת. עונת שיא (מרץ-יוני) יכולה להאריך את זמני ההובלה."
      icon: tabler:clock
      category: all
    - title: האם ניתן לארגן ביקורת במפעל או סיור וידאו חי?
      description: כן. ניתן לבצע ביקורות במפעל במתקן שלנו בצ'ינגדאו בהודעה מוקדמת של 3-5 ימים. סיורי וידאו חיים דרך WhatsApp/Zoom זמינים מיד. בדיקות על ידי צד שלישי (SGS, BV, TÜV) מתאפשרות.
      icon: tabler:video
      category: all
    - title: אילו בדיקות איכות מתבצעות לפני המשלוח?
      description: בדיקת החזקת לחץ פי 1.25 (24-48 שעות), בדיקות התקלפות תפרים, רשימת בדיקה סופית של 100 נקודות, אימות ממדי, בדיקה קוסמטית, אימות מסמכי תאימות, ובדיקת שלמות האריזה. הכל לפי נהלי ISO 9001.
      icon: tabler:clipboard-check
      category: all
