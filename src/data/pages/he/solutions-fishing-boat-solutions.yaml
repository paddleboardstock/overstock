content_challenge:
  tagline: האתגר
  title: סירות דיג זקוקות<br />יציבות, טווח ועמידות
  subtitle: בין אם אתם מפעילים כלי שיט מסחריים, מנהלים צי קואופרטיבי או מריצים צ'ארטרים לדיג — הסירה שלכם צריכה לתפקד באופן אמין בכל יום.
  paragraphs:
    - סירות דיג זקוקות לפלטפורמות יציבות לעבודה עם חבלים, טיפול בדגים ותנועה בטוחה על הסיפון. מתנפחות ו-RIBs מספקות יציבות מובנית דרך עיצוב הצינורות שלהן — יתרון משמעותי על פני גופים נוקשים באורך דומה.
    - יעילות הדלק חשובה עבור פעולות דיג שבהן עלויות התפעול משפיעות ישירות על הרווחיות. RIBs וסירות מתנפחות קלות יותר מסירות נוקשות מקבילות, דורשות פחות כוח ושורפות פחות דלק — קריטי למפעילים מסחריים המפעילים סירות מדי יום ולקואופרטיבים שמנהלים תקציבי צי.
    - עמידות בסביבות ימיות היא חיונית. מים מלוחים, חשיפה ל-UV ושימוש מתמיד דורשים חומרים שיכולים לעמוד בתנאים קשים ללא התדרדרות. עבור מפעילים מסחריים וקואופרטיביים, אמינות משפיעה ישירות על ההכנסה — סירה שבורה פירושה אובדן ימי דיג.
    - תצורות דיג Paddle Board Overstock כוללות מחזיקי מוטות, מדד דגים, בארי דיג, בארי חיים ופתרונות טיפול מטען המיועדים ליישומי דיג רציניים בפעולות מסחריות, קואופרטיביות ובידוריות.
content_solution:
  tagline: הפתרון שלנו
  title: תצורות מוכנות לדיג
  subtitle: כל סירת דיג Paddle Board Overstock יכולה להיות מוגדרת עבור יישום הדיג הספציפי שלכם.
  list:
    - הרכבת מחזיקי מוטות — מותקנת במפעל או מוכנה להתקנה לאחר המכירה
    - לוח הרכבת מדד דגים/GPS במיקום הקונסולה
    - אפשרויות בארי דיג או בארי חיים למפעילי צ'ארטר ומסחר
    - תצורות מקרר/אחסון לטיפול בדגים
    - גוף V-עמוק ליכולות חופיות — יציב במנוחה, חלק במהירות
    - PVC או Hypalon אפשרויות צינור — Hypalon UV לחשיפה ממושכת
    - החלק החיצוני נע בין 15 HP ל-115 HP בהתאם לדגם וליישום
content_segments:
  tagline: פרופילי דיג
  title: פתרונות לסירות דיג מתנפחות<br />לפי סוג מפעיל
  subtitle: מדיג ספורטיבי קרוב לחוף ועד לונג ליינג מסחרי — פעילויות דיג שונות דורשות תצורות גוף שונות, טווחי כוח והגדרות על הסיפון שונות. אנחנו מתאימים כל סירה לדיג, למים ולסגנון העבודה.
  items:
    - title: חברות דיג מסחריות
      subtitle: סירות עבודה בצי לפעולות דיג יומיות, טיפול ברשתות, הובלת תפסים
      description: חברות דיג מסחריות מפעילות סירות עבודה להנחת רשתות ושאיבה, שירות מלכודות, חבל ארוך והובלת תפסים. סירות אלו פועלות מדי יום בסביבות מים מלוחים וחייבות לעמוד בעומסים כבדים, טיפול קבוע בסיפון ושעות פעילות ארוכות. יעילות דלק ותחזוקה נמוכה הן קריטיות לרווחיות הצי. הספינה חייבת לספק פלטפורמות עבודה יציבות לציוד טיפול בצוות ולדגים בתנאי ים משתנים.
      features:
        - סידור סיפון שטוח לטיפול ברשתות, ערימת מלכודות ואחסון דגים
        - מנוע 40-115 חסכוני בדלק HP חיצוני לעלות תפעול יומית נמוכה
        - צינורות כבדים Hypalon לעמידות בפני שחיקה בשימוש יומיומי
        - רצועות חיזוק מחוזקות למגע תדיר עם רציף וכלי שיט
        - דק מתנקז עצמי לניקוי קל לאחר פעולות
        - תמחור צי ומפרטים עקביים למפעילי מספר כלי שיט
    - title: מפעילי דיג צ'רטר
      subtitle: נוחות למספר נוסעים, טיפול בתפיסה, אישור בטיחות
      description: מפעילים שמפעילים טיסות דיג של חצי יום ויום מלא — מדיג בשוניות סמוכות ועד דיג בקרקעית הימית. הסירה שלכם זקוקה למושבי נוסעים עם אישורי בטיחות, שטח דק גדול למספר דייגים ובארות חיים משולבות לשמירה על טריות הפיתיון והדיג לאורך כל הנסיעה. נוחות האורחים משפיעה ישירות על ביקורות טיולים, הזמנות חוזרות ודיגוג מקוון.
      features:
        - הגה קונסולה עם מושבי דלי סופג זעזועים
        - מחזיקי מוטות שהותקנו במפעל (4–8 מקומות)
        - טווח חיצוני 60–115 HP למהירויות שיוט ימיות
        - CE הסמכת קטגוריה C או B לתפעול נוסעים מסחרי
        - Bimini או T-top שמש לנוחות האורחים בטיולים ממושכים
    - title: דייגים אומנותיים ומסחריים בקנה מידה קטן
      subtitle: סירות עבודה אמינות לפרנסה יומיומית
      description: דייגים עצמאיים שמסתמכים על הסירה שלהם כמקור ההכנסה העיקרי — הצבת רשתות, טיפול במלכודות דגים, או טיפול בשיבוש ליד החוף. העדיפות שלך היא חיסכון בדלק, תחזוקה פשוטה שתוכל לבצע בעצמך, וסירה שמטפלת בעומסים מתונים של תפיסה וציוד מבלי לוותר על יציבות.
      features:
        - מנוע 15–40 חיצוני חסכוני בדלק HP לעלות תפעול נמוכה
        - Hypalon CSM צינורות UV לעמידות מורחבת ושחיקה
        - סידור סיפון שטוח לטיפול ברשתות ואחסון דגים
        - יכולת נחיתה קלה על החוף עם הגנה מתנפחת על הקיל
    - title: קואופרטיבים לדיג
      subtitle: איסוף תוצרת, הובלת חברים, חלוקת אספקה
      description: קואופרטיבים לדיג מפעילים צי קהילתי לאיסוף תוצרת מחברי הדייגים, הובלת אספקה לקהילות דייג מרוחקות, וחלוקת הקציר לשווקים. סירות עבודה אלו דורשות יכולת נשיאה גבוהה, פעולה יומית אמינה ותחזוקה קלה במיקומים מרוחקים. קואופרטיבים פועלים לעיתים קרובות באזורים מתפתחים בהם זמינות חלקים ושירות מוגבלת, מה שהופך עיצוב חוץ פשוט ובנייה עמידה לקריטיים.
      features:
        - יכולת נשיאה גבוהה להובלת תוצרת ואספקה
        - תצורת מנוע חיצוני פשוטה לניהול תחזוקה באתר
        - בנייה כבדה PVC או Hypalon לגמישות תקציבית
        - חיפוי שטוח עם נקודות עיגון לאבטחת מטען
        - תפעול חסכוני בדלק המפחית את עלויות התפעול של הקואופרטיב
    - title: חובבי דיג ספורטיבי ומשחק
      subtitle: ביצועים וסטייל לדייגים רציניים
      description: דייגים מנוסים המחפשים פלטפורמת דיג מסוגלת שמספקת מהירות לאזורים מרוחקים, עמדות קרב יציבות בעמידה וגימור ועיצוב פרימיום. הסירה חייבת להרגיש ביתית בין אם היא נעה שני קילומטרים מול חוף לריף או חוקרת חורשים אקולוגיים מרוחקים.
      features:
        - גוף סירה Deep-V RIB לנסיעה חלקה במים גלים
        - לוח חיבור Fishfinder/GPS מוקדם מחוט במרכז הבקרה
        - Baitwell ומקרר משולבים במודול המושב האחורי
        - אפשרויות צבע מותאמות אישית EVA לחיפוי שמשתלבות עם גרפיקות הסירה/צינור
    - title: מדריכי דיג ומפעילי סיורי אקו
      subtitle: חוויות דיג מודרכות לדייגים מבקרים
      description: מדריכים שלקחו קבוצות קטנות של דייגים מבקרים למקומות דיג פרודוקטיביים - לעיתים בשילוב עם אלמנטים של תיירות אקולוגית כמו צפייה בציפורים או חקירת מנגרובים. הסירה חייבת לנוע יבש ונוח עבור אורחים שאינם מורגלים בסירות קטנות, עם עלייה קלה ואפשרויות הצללה.
      features:
        - נקודות עיגון מוגנות למבני Bimini או T-top מותקנות במפעל
        - סולם עלייה חלק להנגשת העלייה חזרה לסירה
        - מנוע חיצוני שקט 4 פעימות לצמצום ההפרעה
        - תאי אחסון יבשים לטלפונים, ארנקים, מצלמות של האורחים
