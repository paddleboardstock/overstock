hero:
  tagline: כושר ייצור
  title: יכולת ייצור ותפוקה שנתית
  subtitle: מתקן בשטח של 12,000 מ"ר המייצר 15,000 סירות בשנה עם אפשרות להרחבה
intro: Paddle Board Overstock מפעילה אחד ממפעלי הייצור הגדולים ביותר לסירות מתנפחות בצ'ינגדאו, סין. המפעל שלנו בשטח של 12,000 מ"ר מאורגן לשישה סדנאות מקצועיות הפועלות במקביל, מה שמעניק לנו את היכולת לייצר 15,000 סירות בשנה במגוון SUP, קאייקים, דינג'ים, RIB וקווי ציוד בטיחות.
highlights:
  - value: 12,000 m²
    label: סה"כ שטח ייצור
    detail: בין 6 סדנאות מקצועיות
  - value: 15,000
    label: סירות המיוצרות מדי שנה
    detail: SUPs, קאייקים, RIBs, דינג'ים, ציוד בטיחות
  - value: 200-300
    label: כוח עבודה מיומן
    detail: 25+ מהנדסים, 2 משמרות/יום
  - value: 50+
    label: מדינות יצוא
    detail: אירופה, ארה"ב, אוסטרליה, המזרח התיכון, אסיה
  - value: 30–45
    label: זמן אספקה סטנדרטי (ימים)
    detail: מאישור ההזמנה ל-FOB
  - value: 10+
    label: שנות ניסיון בייצוא
    detail: מאז 2012
workshops:
  - title: SUP ייצור גלשנים
    description: '4 קווי הרכבה מקבילים לגלשנים מתנפחים SUP. כל קו יכול לייצר 50–80 גלשנים בכל משמרת. תחנות הדפסה דיגיטלית והדפסה מסך פועלות במקביל. תפוקה שנתית SUP: 8,000+ גלשנים.'
    output: 8,000+ SUPs/שנה
  - title: RIB ייצור סירות
    description: "סדנה ייעודית לגופי סירות סיב זכוכית עם 6 תחנות תבניות לגופי RIB עד 7.6 מ'. אזור ריתוך והרכבה של הצינורות מטפל ב-3–5 RIBs במקביל. תפוקה שנתית RIB: 2,000+ סירות."
    output: 2,000+ RIBs/שנה
  - title: סירות מתנפחות ודינג'ים
    description: "קווי ייצור רב-תכליתיים לסירות מתנפחות, קאייקים ודינג'ים. תחנות ריתוך באוויר חם, מדחסי RF, ועמדות הרכבה מותאמות לפי תערובת ההזמנה. תפוקה שנתית: 5,000+ יחידות."
    output: 5,000+ יחידות/שנה
  - title: ציוד בטיחות
    description: 'אזור ייצור נקי נפרד להטענות הצלה וציוד בטיחות. תחנות תפירה ייעודיות, הכנסת קצף ובדיקות. תפוקה שנתית של אפודי הצלה: 50,000+ יחידות.'
    output: 50,000+ אפודים/שנה
oem_capacity:
  moq: "SUP: 5–10 יחידות | RIB: 2–5 יחידות | קאייק/דינג'י: 10–20 יחידות | תבנית מותאמת אישית: 200+ יחידות"
  lead_time: 'הזמן סטנדרטי: 30–45 יום. דוגמית: 15–20 יום. ניתן להזמנה מואצת.'
  payment: העברה בנקאית (T/T) 30% מקדמה + 70% לפני המשלוח. מתקבלים אשראי חוזי (L/C) ו-Western Union.
