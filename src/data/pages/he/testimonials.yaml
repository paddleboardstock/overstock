testimonials:
  - category: clubs
    name: ריקארדו סנטוס
    title: בעלים, אקדמיית הגלישה אלגרבה
    location: לגוס, פורטוגל
    content: התחלנו עם חבילת ההתחלה למועדונים לבית ספר הגלישה שלנו. 20 משטחים, משוטים, אפודים — הכל הגיע תוך שלושה שבועות. לאחר שתי עונות, שדרגנו לחבילת הפרו. המיתוג המותאם עם הלוגו שלנו שינה לחלוטין את התדמית המקצועית שלנו.
    rating: 5
    product: חבילת התחלה למועדון
    source: solutions/clubs
  - category: clubs
    name: בעל מועדון
    title: מועדון ספורט ימי
    location: פוקט, תאילנד
    content: חבילת ההתחלה למועדונים הייתה נקודת הכניסה המושלמת. עם התרחבות העסק שלנו, Aquafarer התרחב איתנו — אותה איכות, אותם מחירים, ללא הפתעות. התקדמנו מ-10 ל-80 משטחים ב-18 חודשים.
    rating: 5
    product: חבילת התחלה למועדון + חבילת פרימיום
    source: success-stories
  - category: resorts
    name: מנהל כללי של אתר נופש
    title: בית מלון חוף 5 כוכבים
    location: יוון
    content: Aquafarer לא רק סיפק משטחים — הם עזרו לנו לבנות חוויית אורחים מלאה. תוכנית הספורט הימי שלנו התקדמה מאות לאטרקציה מרכזית בבית המלון בעונה אחת. 300+ הזמנות שבועיות ו-180,000$ בהכנסה שנתית.
    rating: 5
    product: חבילת פרימיום במלון
    source: success-stories
  - category: resorts
    name: סופי לורן
    title: מנהל חוויית אורחים, מרחצאות אזור ביי
    location: פוקט, תאילנד
    content: Aquafarer עיצב וציוד את כל תוכנית הפעילויות החופית שלנו בשלושה נכסי נופש. 80 SUPs, 40 קיאקים, תשתית בטיחות והכשרת צוות — הכל נמסר במשלוח אחד. השתתפות האורחים עלתה ב-60% בעונה הראשונה.
    rating: 5
    product: חבילת פרימיום במלון
    source: solutions/resorts
  - category: entrepreneurs
    name: מייקל פארק
    title: מייסד, Shoreline Paddle Co.
    location: קליפורניה, ארה"ב
    content: השקתי את המותג SUP שלי ללא ניסיון בתעשייה. צוות Aquafarer הנחה אותי מהבחירה במוצרים ועד לעיצוב לוגו מותאם ואריזות. המכולה הראשונה שלי הגיעה תוך 11 שבועות, ומכרתי הכל ב-3 חודשים באמזון.
    rating: 5
    product: השקת מותג התחלתי
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: מייסד
    title: מותג אוסטרלי SUP
    location: אוסטרליה
    content: היה לי את רעיון המותג אך אפס ידע בייצור. Aquafarer ממש החזיקו לי את היד לאורך כל התהליך — מבחירת עיצוב הלוח ועד פתיחת המשלוח הראשון שלי. 90 ימים מהחלום למסירה.
    rating: 5
    product: חבילת השקת מותג
    source: success-stories
  - category: rental
    name: דניאל אוקונקו
    title: בעלים, Lakeland SUP להשכרות
    location: אונטאריו, קנדה
    content: השכרתי 5 לוחות מחנות מקומית והפסדתי 60% מההכנסות שלי אליהם. Aquafarer עזר לי לבנות צי משל עצמי של 15 SUPs. מחשבון ה-ROI הראה נקודת איזון בארבעה חודשים — אך לקח 3. כעת אני מרחיב ל-30 לוחות.
    rating: 5
    product: ערכת התחלה לצי
    source: solutions/rental-business
  - category: rental
    name: מרקו וולנטי
    title: מנהל תפעול, Adriatic Adventure Tours
    location: דוברובניק, קרואטיה
    content: ציידנו את כל צי ההשכרות שלנו ב-Aquafarer RIBs — 12 סירות בשלוש מיקומים. לאחר שתי עונות, אפס תקלות. מסמכי אישור CE הפכו את אישור הביטוח לחלק. צוות ההנדסה שלהם אפילו התאימו את צבעי הצינורות.
    rating: 5
    product: ערכת הרחבת צי
    source: trust
  - category: rental
    name: סגן מפקד אנדורס רייס
    title: קצין רכש ימי, חיל החופים הפיליפיני (סיירת משולבת)
    location: מנילה, הפיליפינים
    content: אנחנו מפעילים 24 Aquafarer RIBs בצי הסיירת החופית שלנו. תהליך בקרת האיכות שלהם עקבי בכל אצווה — אותו איכות תפר, אותו מיקום שסתום, אותה דרגת לחץ כל פעם. חזרתיות זו חשובה כאשר חיים תלויים בציוד.
    rating: 5
    product: RIB צי סיור
    source: trust
  - category: consumers
    name: שרה ק.
    title: בעל SUP בפעם הראשונה
    location: אגם טאבה, ארה"ב
    content: יציב אפילו למתחיל מוחלט. לקחתי אותו לאגם ביום הראשון שלי ומעולם לא נפלו לי. החבילה המלאה עם משאבה ומשוט גרמה לכך שהייתי על המים 20 דקות אחרי פתיחת הקופסה.
    rating: 5
    product: SUP אקספלורר 11
  - category: consumers
    name: ג'יימס ת'ורנטון
    title: SUP בעל אקספלורר 11
    location: ונקובר, קנדה
    content: כקונה בפעם הראשונה, הייתי מודאג לגבי איכות ההזמנה מחו"ל. התיעוד ודו"חות הבדיקה מצד שלישי שהם שיתפו לפני ששאלתי אפילו נתנו לי ביטחון מלא. הלוח הגיע תוך 6 ימים והעלה על הציפיות שלי.
    rating: 5
    product: SUP אקספלורר 11
    source: trust
  - category: consumers
    name: מייק ר.
    title: קיאקיסט פנאי
    location: פלורידה, ארה"ב
    content: איכות בנייה מוצקה. מתמודד עם גלי חוף הרבה יותר טוב ממה שציפיתי ממפרש מתנפח. ארזתי אותו בתא המטען של המכונית לטיול סוף שבוע — התנפח במרפסת תוך פחות מ-4 דקות.
    rating: 5
    product: קיאק מתנפח
