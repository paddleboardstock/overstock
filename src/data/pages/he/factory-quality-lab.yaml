hero:
  tagline: מעבדת בקרת איכות
  title: מעבדת בדיקות ואבטחת איכות
  subtitle: מעבדה עצמאית לאיכות עם תהליכי ISO 9001 — כל יחידה נבדקת לפני משלוח
intro: Aquafarer מפעילה מעבדת בקרת איכות ייעודית הפועלת באופן עצמאי מהייצור. כל אצווה של חומר גלם וכל סירה גמורה עוברת פרוטוקולי בדיקה מתועדים לפני שחרור. צוות בקרת האיכות שלנו מדווח ישירות להנהלה, מה שמבטיח החלטות איכות בלתי מטהות.
highlights:
  - value: 100%
    label: יחידות נבדקות תחת לחץ
    detail: כל תא, כל סירה
  - value: 48 h
    label: משך מבחן שמירת אוויר
    detail: בלחץ של 1.25× הלחץ המדורג
  - value: '&lt;5%'
    label: ירידת לחץ מקסימום מותרת
    detail: במהלך תקופת החזקת 24 שעות
  - value: AQL 2.5
    label: סף ל-defect משמעותי
    detail: לפי דגימת ISO 2859
test_procedures:
  - title: בדיקת חומרי גלם
    description: כל אצווה נכנסת של PVC, Hypalon, drop-stitch בד וחומרה נבדקת לפני קבלה. חוזק מתיחה (ASTM D751), עמידות לקריעה (ISO 4674), ועמידות ל-UV נבדקים ומאומתים. חומרים שאינם עומדים בתקן מופרדים ומוחזרים.
    standards:
      - ASTM D751 (מתיחה)
      - ISO 4674 (קריעה)
      - ISO 4892 (UV)
  - title: נקודות בדיקה בתהליך
    description: המפעילים בייצור מבצעים אינספקציה עצמית בכל שלב. מבקרי איכות מבצעים דגימה אקראית לאורך כל המשמרת. מבחני קילוף ריתוך מבוצעים כל 50 יחידות. בדיקות מידות מתבצעות בכל לוח עשרים.
    standards:
      - ASTM D751 (קילוף)
      - רשימת בדיקה פנימית בת 100 נקודות
      - ISO דגימת 2859
  - title: מבחן החזקת אוויר במשך 48 שעות
    description: כל תא צינור מנופח ללחץ של 125% מהלחץ המדורג ומוחזק במשך 48 שעות. חיישני לחץ רושמים ברצף עם פיצוי טמפרטורה. כל תא החורג מירידת לחץ של 5% מפעיל בדיקה מחודשת אוטומטית של האצווה.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: בדיקות עומס ואיזון
    description: סירות גמורות נבדקות בקיבולת המרבית המדורגת עבור יציבות, גובה חישול וטיפול. כל כלי עובר מבחן מים לפני אישור הבדיקה הסופית.
    standards:
      - ISO 12217
      - CE 2013/53/EU
equipment:
  - name: מכונת בדיקה אוניברסלית (מתיחה)
    spec: 5 kN, תואם ל- ASTM D751
  - name: מכשיר בדיקת דפיל לחץ
    spec: רב-ערוצי, 0–50 psi, רישום נתונים
  - name: UV תא מזג אוויר
    spec: ISO 4892, 1,000 מחזורים
  - name: מד עובי (דיגיטלי)
    spec: רזולוציה 0.01 מ"מ
  - name: מכשיר בדיקת קילוף (ריתוך)
    spec: ממונע, קיבולת 50 N
  - name: תא טמפרטורה
    spec: -40 °C עד +100 °C
  - name: מכל בדיקת דליפות
    spec: 6 מ' × 2 מ', מואר
