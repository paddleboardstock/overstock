hero:
  tagline: מפיצי ספורט ימי וסיטונאות
  title: שיתוף פעולה סיטונאי<br />למפיצי ספורט ימי
  subtitle: הפוך לשותף הפצה של Paddle Board Overstock. גש למלאי המוצרים שלנו, לתמחור סיטונאי בלעדי, לתמיכה במשלוחים ישירים ולניהול חשבון ייעודי.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock הפצה וסיטונאות במפעל
direct_answer: Paddle Board Overstock מציעה שותפויות סיטונאיות מקיפות למפיצי ספורט ימי ברחבי העולם. השותפים מקבלים תמחור סיטונאי לכל מלאי המוצרים, ניהול חשבון ייעודי, חומרי שיווק ותמיכה לוגיסטית. אנו מציעים אפשרויות משלוח ישיר, תוויות פרטיות וכמויות מינימום גמישות להתאמה למודל העסקי שלך.
solution_offerings:
  - title: מפיץ מתחיל
    subtitle: לשותפויות חדשות ולמפיצים אזוריים
    badge: Popular
    features:
      - title: גישה למלאי מלא
        description: תמחור סיטונאי על כל הלוחות, הקיאקים, RIBs ואביזרים של SUP
      - title: מנהל חשבון ייעודי
        description: נקודת קשר אחת להזמנות, תמיכה ומידע על המוצרים
      - title: חומרי שיווק
        description: תמונות מוצרים, גיליונות מפרט, עלונים ונכסים דיגיטליים בשפה שלך
      - title: תמיכה לוגיסטית
        description: תיאום משלוחים, מסמכי מכס ומסירת מחסן
      - title: תוכנית דוגמאות
        description: הזמנות דוגמאות בהנחה להציג בתצוגות סלון או בהדגמות למפיצים
    cta_text: להגיש בקשה לשותפות
    cta_href: /contact
  - title: מפיץ פרימיום
    subtitle: למפיצים מבוססים עם כיסוי במדינות רבות
    badge: Best Value
    features:
      - title: תמחור מדורג
        description: רמות תמחור מבוססות נפח עם תוכניות החזר רבעוניות
      - title: טריטוריה בלעדית
        description: זכויות הפצה מוגנות לאזור או מדינה שלך
      - title: תוכנית משלוח ישיר
        description: משלוח ישיר ללקוחות שלך ממחסנינו עם המיתוג שלך
      - title: תוויות פרטיות
        description: תמיכה מלאה ב־OEM/ODM למותג שלך — לוחות, סירות ואביזרים
      - title: תמיכה בעדיפות
        description: אחריות תגובה תוך 48 שעות, רכז לוגיסטיקה ייעודי והזמנות מזורזות
    cta_text: שדרוג שותפות
    cta_href: /contact
  - title: מפיץ ראשי
    subtitle: למפיצים אזוריים וארציים בקנה מידה גדול
    badge: Enterprise
    features:
      - title: שותפות אסטרטגית
        description: תכנון עסקי משותף, קרנות לפיתוח השוק ותכניות שיווק משותפות
      - title: פיתוח מוצר מותאם
        description: עיצובים ומפרטים בלעדיים לשוק שלכם
      - title: תמיכה במלאי מקומי
        description: אפשרות למלאי בקונסיגנציה, מלאי חלקי חילוף מקומי והקמת מרכז שירות אזורי
      - title: תמיכה ברשת הסוחרים
        description: תכניות הכשרה, קורסי הסמכה ושילוב מ localização מנוע חיפוש סוחרים
      - title: כנס שותפים שנתי
        description: פגישות אסטרטגיה, תצוגות מקדימות של מוצרים ובניית רשת עם שותפים גלובליים
    cta_text: גלה שותפות ראשית
    cta_href: /contact
benefits:
  - title: גישה ישירה ליצרן
    description: ללא מתווכים. אתם עובדים ישירות עם המפעל שמעצב, מהנדס ומייצר כל מוצר.
    icon: tabler:building-factory
  - title: מרווחים תחרותיים
    description: מחירי סיטונאות עם הנחות על נפח, תכניות החזרי כספים ואזורי הגנה.
    icon: tabler:coin
  - title: תמיכה בשיווק
    description: נכסי מוצר מקצועיים, חוברות מותאמות לשוק המקומי, וקמפיינים שיווקיים עם מותג משותף.
    icon: tabler:chart-bar
  - title: שותפות לוגיסטית
    description: שילוח מתואם, תמיכה במכס ואופציות למלאי מקומי כדי להפחית את עלויות הלוגיסטיקה שלכם.
    icon: tabler:truck-delivery
content_segments:
  tagline: פרופילי שותפים
  title: דגמי שותפות הפצה<br />לפי סוג השותף
  subtitle: מפיצים שונים מביאים יתרונות שוק שונים — תשתית אזורית, נוכחות מסחר אלקטרוני, קמעונאות מיוחדת או פורטפוליו מרובה מותגים. אנו מבנים תנאי שותפות, שכבות תמחור ורמות תמיכה כדי להתאים לכל פרופיל שותף.
  items:
    - title: מפיצי ים אזוריים
      subtitle: הפצה בלעדית לפי אזור B2B
      description: מפיצים מבוססים עם תשתית מחסנים, רשתות סוחרים ויכולות לוגיסטיות, המשרתים סוחרי ים, קמעונאי ספורט מים ומפעילי השכרות בתוך אזור גיאוגרפי מוגדר. אתם צריכים קו מוצרים מלא, תמחור מוגן ויכולת לשרת חשבונות סוחרים עם מלאי ותמיכה מקומית.
      features:
        - הגנה על טריטוריה בלעדית עם תנאי התחייבות מינימליים
        - מחירי סיטונאות מלאים עם החזרים לפי נפח רבעוני
        - תוכנית צ׳ונסיינמנט מלאי מקומי עבור פריטים נעים במהירות
        - הכשרת רשת הסוחרים ותוכניות שיווק משותפות עם המותג
    - title: קמעונאות מקוונת וסוחרי e-commerce
      subtitle: ערוצי הפצה דיגיטליים בראש סדר העדיפויות
      description: קמעונאים מקוונים שמוכרים ציוד ספורט ימי דרך אמזון, איביי או פלטפורמות ה-ecommerce שלהם עצמם. מהירות לשוק, מחירים תחרותיים ולוגיסטיקה ישירה לצרכן הם קריטיים. אתם זקוקים לשותף שיכול לבצע משלוח ישיר של הזמנות תחת המותג שלכם עם ביצוע מהיר וללא סיכון מלאי.
      features:
        - 'תוכנית Drop-ship: מימוש ישיר מהמפעל עם המותג שלכם'
        - זרם API של מלאי בזמן אמת עבור פלטפורמת ה-ecommerce שלכם
        - אינטגרציה עם Amazon Seller Central עם תמיכה EAN/UPC
        - לוגיסטיקת החזרות ועיבוד תביעות אחריות כלולים
    - title: קמעונאים מקצועיים לציוד ספורט ימי
      subtitle: שותפים בחנויות פיזיות
      description: חנויות קמעונאיות פיזיות המתמחות בציוד ספורט ימי — משרתות חתרים, דייגים וחובבי סירות מקומיים עם מכירות פנים אל פנים, הדגמות ושירות אחרי מכירה. אתם זקוקים לאריזות מותאמות לקמעונאות, תוכניות יחידות הדגמה וחומרי נקודת מכירה שמסבים לקוחות נכנסים.
      features:
        - 'תוכנית יחידות הדגמה: לוחות תצוגה מוזלים'
        - אריזות מוכנות לקמעונאות עם עיצוב קופסה מותאם למדף
        - תצוגות לנקודת מכירה, טבלאות השוואה ומדריכי קנייה
        - הכשרה והסמכת צוות בחנות
    - title: מפיצים ורשתות חנויות רב-מותגים
      subtitle: הפצת סחורות ספורט רחבת קו
      description: מפיצים גדולים שמשרתים חנויות כלבו, קמעונאים גדולים ורשתות ספורט עם קטלוגים רב-מותגים. עקביות, מסמכי ציות ותיעוד ספק הם קריטיים — כל SKU חייב לעמוד בסטנדרטים הספציפיים של חנויות עבור אריזה, תיוג ואיכות.
      features:
        - 'מסמכי ציות סוחרים: מפרט אריזה, ברקוד, תיוג'
        - אינטגרציה EDI/ASN למערכות ההזמנה של קמעונאים גדולים
        - ניהול מלאי מנוהל על ידי הספק ותוכניות משלוח אוטומטי
        - ניהול חשבון ייעודי עם SLA תגובה של 24 שעות
