features3_markets:
  tagline: שווקים עיקריים
  title: מומחיות אזורית<br />לצרכים מקומיים
  subtitle: אנו מבינים שלשווקים שונים יש דרישות רגולטוריות שונות, העדפות ושימושים.
  isBeforeContent: false
  columns: 4
  items:
    - title: אירופה ובריטניה
      description: מוצרים מוסמכים CE העומדים בתקן EN ISO 6185. ביקוש חזק לRIBs, סירות מתנפחות וללוחות SUP בכל השווקים באיחוד האירופי. המפיצים בבריטניה מעריכים את המענה המהיר שלנו.
      icon: tabler:map-pin
    - title: צפון אמריקה
      description: ייצור מאושר על ידי משמר החופים של ארה״ב. מחסן בארה״ב ב-Montclair, CA למשלוח מהיר לחוף המערבי. ביקוש גובר לסירות דייג, כלי הצלה וסירות פנאי SUPs.
      icon: tabler:map-pin
    - title: אוסטרליה ואוקיאניה
      description: שוק חזק לסירות RIB וסירות עזר מתנפחות. מפיצים אוסטרלים מעריכים את סירות Hypalon שלנו עבור עמידות UV בתנאי שמש קשים. משלוח מהיר ממתקן האסיה שלנו.
      icon: tabler:map-pin
    - title: מזרח התיכון
      description: ביקוש גובר לסירות סיור והצלה. הסירות שלנו מיחידת אלומיניום RIBs פופולריות בקרב משמר החופים ומפעילי ביטחון. תצורות מותאמות להכנסות בטמפרטורות גבוהות.
      icon: tabler:map-pin
features3_distribution:
  tagline: רשת הפצה
  title: שיתוף פעולה עם מפיצים<br />בכל העולם
  subtitle: אנו עובדים עם מפיצי ציוד ימי מבוססים, מותגי OEM וסוכנויות רכש ממשלתיות.
  isBeforeContent: false
  columns: 3
  items:
    - title: שותפויות OEM/ODM
      description: ייצור במותג פרטי עבור מותגי ספורט ימי עולמיים. אנחנו מטפלים בהכל, מהעיצוב ועד הייצור והמשלוח הישיר.
      icon: tabler:building
    - title: רשת מפיצים
      description: מפיצים מורשים ב-20+ מדינות מחזיקים במלאי ומספקים תמיכה מקומית. פניות של מפיצים חדשים מתקבלות בברכה.
      icon: tabler:users
    - title: ממשל ומוסדי
      description: אספקה ישירה למשמר החופים, לארגוני חיפוש והצלה ולתוכניות רכש צבאיות. עמידה בדרישות הרכש המוסדיות.
      icon: tabler:building-community
steps2_logistics:
  title: לוגיסטיקה ותמיכה עולמית
  subtitle: מפעל ליעד — אנחנו מנהלים את כל שרשרת האספקה.
  items:
    - title: אפשרויות משלוח
      description: שילוח ימי (צ'ינגדאו), שילוח אווירי להזמנות דחופות, ושליחויות מהירות לדגימות וחלקי חילוף.
      icon: tabler:truck-delivery
    - title: מחסן בארה״ב
      description: 'מלאי שמור במונטקלייר, קליפורניה למשלוח מהיר ברחבי צפון אמריקה. החוף המערבי: 2-3 ימים, המרכז: 3-4 ימים, החוף המזרחי: 4-5 ימים.'
      icon: tabler:building-warehouse
    - title: חלקי חילוף
      description: חלקי חילוף וחומרים מתכלים מקוריים Aquafarer זמינים במלאי לאורך כל השנה. חלקים נפוצים נשלחים תוך 24 שעות.
      icon: tabler:package
    - title: תמיכה טכנית
      description: קו ישיר לצוות ההנדסה שלנו לשאלות טכניות, ייעוץ תיקונים ותמיכה בשיפוץ. אנו תומכים בספינות שבנינו לפני 20 שנה.
      icon: tabler:headset
cta:
  title: רוצה להפוך למפיץ?
  subtitle: אנו מרחיבים באופן פעיל את רשת ההפצה שלנו. צרו קשר עם צוות הייצוא שלנו כדי לדון בהזדמנויות לשיתוף פעולה.
  actions:
    - variant: primary
      text: פנייה לשותפות
      href: /contact
    - text: צפו במגוון המוצרים שלנו
      href: /products
