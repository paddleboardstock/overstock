hero:
  tagline: נוכחות עולמית
  title: משרתים 50+ מדינות<br />בכל יבשת
  subtitle: מפעילי משמר החופים באירופה למפיצי ספורטי מים באוסטרליה ועד צוותי הצלה במזרח התיכון — סירות Aquafarer שלנו נמצאות במים בכל רחבי העולם.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer ייצור והפצה ימיים גלובליים
