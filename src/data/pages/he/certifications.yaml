hero:
  tagline: תעודות והזמנים
  title: תעודות איכות<br />& תקני ציות
  subtitle: המוצרים של Aquafarer מיוצרים בהתאם לסטנדרטים הבינלאומיים של בטיחות ימית, מערכות ניהול איכות ותקנות סביבתיות.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: אישורי איכות ותיעוד תאימות
content_certifications:
  tagline: תעודות שלנו
  title: איכות מוסמכת,<br />מוכר בעולם
  subtitle: 64 דגמים מוסמכים CE ותעודות מוסדיות רחבות מפגינים את המחויבות שלנו לאיכות, לבטיחות ולכבוד הסביבתי.
  items:
    - title: CE מוסמך
      description: 64 דגמים מוסמכים בהתאם ל-CE עומדים בדרישות הסימון האירופיות CE לכלי שיט פנאי, ומבטיחים כי נתקיימו סטנדרטים של בטיחות, בריאות והגנה על הסביבה.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: מערכת ניהול האיכות שלנו מוסמכת לפי ISO 9001:2015, ומקיפה תכנון, ייצור והפצה של כלי שיט מתנפחים וציוד ימי.
      icon: tabler:clipboard-check
    - title: UKCA מסומן
      description: מוצרים הנמכרים בשוק הבריטי נושאים סימון UKCA, המאשר עמידה בתקנות בריטניה לציוד ימי וכרכבי מים אישיים.
      icon: tabler:shield
    - title: BSCI תואם
      description: Aquafarer עובר ביקורת BSCI (Business Social Compliance Initiative), המראה על פרקטיקות ייצור אתיות, תנאי עבודה הוגנים ואחריות בשרשרת האספקה.
      icon: tabler:heart-handshake
    - title: REACH תואם
      description: כל החומרים המשמשים במוצרי Aquafarer עומדים בתקנות הכימיות של האיחוד האירופי REACH, ומבטיחים כי אין חומרים מוגבלים במוצרים שלנו PVC, Hypalon או ברכיבים.
      icon: tabler:flask
    - title: בדיקות חומרים
      description: בדים נבדקים לחוזק מתיחה, עמידות לקריעה, פירוק UV וביצועי סדק בקור. כל אצווה ייצור נבדקת ומאומתת.
      icon: tabler:test-pipe
content_factory:
  tagline: תקני מפעל
  title: מצוינות בייצור<br />— נבנה לפי המפרט
  subtitle: המוסד שלנו בגודל 12,000 מ"ר פועל תחת פרוטוקולים קפדניים של בקרת איכות בכל שלב של הייצור.
  list:
    - 'בדיקת חומרים נכנסים: כל חומרי הגלם — PVC בד, Hypalon, אלומיניום, פלטות עץ דחוס, דבקים — נבדקים מול המפרטים לפני הכניסה לייצור.'
    - 'בקרת איכות בתהליך: לכל שלב ייצור קיימות נקודות בדיקה מתועדות. חוזק הריתוך, יישור התפר, התקנת השסתום ומומנט החיבור נבדקים בקו הייצור.'
    - 'בדיקות לחץ: כל תא מתנפח עובר בדיקת לחץ בלחץ של 1.25× הלחץ הנקוב למשך 24–48 שעות. שיעור הדליפה חייב להיות בתוך גבולות מקובלים על פי ISO 6185.'
    - 'בדיקה סופית: מוצרים גמורים נבדקים לדיוק מימדי, גימור קוסמטי, שלמות האביזרים ושלמות האריזה לפני המשלוח.'
    - 'מעקב אחר קבוצות ייצור: כל מוצר נושא מספר סידורי המקושר לרשומות קבוצת הייצור, ומאפשר מעקב מלא מהחומר הגולמי ועד למוצר המוגמר.'
content_safety:
  tagline: תקני בטיחות ימיים
  title: ביטחון קודם כל<br />— תוכננו לפעולה אמינה
  subtitle: מוצרים של Aquafarer תוכננו ונבדקו כדי לעמוד בתקני בטיחות ימיים בינלאומיים לשימוש מסחרי ופנאי.
  items:
    - title: ISO 6185
      description: סירות מתנפחות עומדות בתקני ISO 6185 לבנייה, יציבות, ציפה וקיבולת משקל.
      icon: tabler:sailboat
    - title: תקני ABYC
      description: מערכות חשמל ודלק פועלות לפי תקני ABYC (המועצה האמריקאית לסירות ויאכטות) להתקנה ותפעול בטוחים.
      icon: tabler:bolt
    - title: SOLAS ציות
      description: ציוד בטיחות ומכשירי הצלת חיים עומדים בדרישות SOLAS (Safety of Life at Sea) כאשר נדרש.
      icon: tabler:lifebuoy
cta:
  title: זקוקים למוצרים מוסמכים לפרויקט שלכם?
  subtitle: צור קשר עם הצוות שלנו כדי לדון בדרישות הסמכה, תיעוד וציות לשוק שלכם.
  actions:
    - variant: primary
      text: בקשו מסמכי הסמכה
      href: /contact
    - text: צפו בדף האיכות שלנו
