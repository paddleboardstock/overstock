hero:
  tagline: אורח חיים
  title: הAquafarer<br />אורח חיים
  subtitle: נבנה לאלו החיים על המים — מחוקרי סוף השבוע ועד מפעילים מסחריים שתלויים בציוד שלהם מדי יום.
values:
  - icon: 🌊
    title: נולד על המים
    desc: כל עיצוב מתחיל בהבנת איך המים מתנהגים. אנחנו מהנדסים מהקצה של התנאים פנימה — כי האוקיינוס הוא המורה שלנו, לא מקום העבודה שלנו.
  - icon: 🔧
    title: בנוי להחזיק מעמד
    desc: המוצר הכי בר קיימא הוא זה שאינו צריך החלפה. חומרים בדרגת ים, ליבות drop-stitch המדורגות ל-15 PSI, ותפרים שמחזיקים מעמד מעבר לעונה.
  - icon: 🏆
    title: נגיש לפי עיצוב
    desc: ספורט ימי לא צריך להיות מותרות. ביצועים ברמה מקצועית במחיר שמצדיק עבור משפחות, מדריכים ומפעילים קטנים — לא רק צי מסחרי.
  - icon: 🌍
    title: קהילה גלובלית
    desc: "מחופי צ'ינגדאו עד אגמים באירופה, נהרות בדרום-מזרח אסיה ומפרצים באמריקות — ללקוחותינו יש דבר אחד במשותף: אהבה להיות על המים."
  - icon: ♻️
    title: ייצור אחראי
    desc: גזירה מקוננת מותאמת מפחיתה בזבוז חומר לבלתי מעל 5%. בנייה עמידה מפחיתה את מחזורי ההחלפה. אנו בונים לאורך זמן כי זו הבחירה הקיימת ביותר.
  - icon: 🤝
    title: תמיכה שנמשכת
    desc: סירות בת עשרים שנה עדיין מתקשרות אלינו עבור חלקי חילוף. זמן התגובה שלנו במסגרת האחריות ממוצע של 24 שעות. אנחנו לא נעלמים אחרי המכירה — אנחנו כאן לאורך חיי המוצר.
