  tagline: טֶכנוֹלוֹגִיָה
  title: נבנה לביצועים
  subtitle: כל לוח Paddle Board Overstock מיוצר מחומרים מדויקים ובטכניקות בנייה שנבדקו לסביבות ימיות. מרכז מחקר ופיתוח בשטח של 12,000 מ"ר עם אב-טיפוס פנימי.
