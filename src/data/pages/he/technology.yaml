testimonial:
  quote: מה שמבדיל את Paddle Board Overstock הוא מדע החומרים שלהם. הם לא רק מרכיבים רכיבים — הם מפתחים את תרכובות ה-PVC, פרמטרי הריתוך ושכבות המבנה בעצמם. האינטגרציה האנכית הזו ניכרת במוצר הסופי.
  author: דוד פארק
  title: מנהל פיתוח מוצר
  company: ציוד ספורט בלווטר
  location: אוסטרליה
sections:
  - title: ליבת Drop-Stitch
    standard: 12-15 PSI לחץ פעולה
    description: אלפי חוטי פוליאסטר פנימיים מחברים בין השכבות העליונות והתחתונות, יוצרים מבנה קשיח ב-12-15 PSI. זו אותה טכנולוגיה המשמשת בלוחות חתירה מקצועיים ובסירות מתנפחות למרוצים. צפיפות ה-drop-stitch שלנו מותאמת לכל דגם לאיזון אידיאלי בין חוסן למשקל.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: תרשים ליבת DS
  - title: דרגת PVCימית
    standard: ריתוך בהתכה | UV / מי ים / נבדק לשחיקה
    description: בדים רב-שכבתיים ממותקנים להכנה למבנים ימיים. כל שכבה מורכבת בריתוך בטמפרטורה גבוהה במקום הדבקה, מה שמסיר סיכוני הפרדה. נבדק להתנגדות ל-UV (ASTM G154, 1,000 + שעות), קורוזיה ממים מלוחים (ISO 9227), ושחיקה (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: שכבת PVC
  - title: צינורות Hypalon
    standard: גומי CSM | UV / כימי / עמיד בטמפרטורות קיצוניות
    description: משמש בדגמי RIB, גומי Hypalon (CSM) מספק עמידות UV וכימית מעולה בהשוואה ל-PVC רגיל. צינורות Hypalon שומרים על גמישות בטמפרטורות קיצוניות ומונעים פגיעה מדלק ושמן. כל התפרים מוכנים ביד על ידי טכנאים מוסמכים.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: רצפת Air Deck
    standard: מתנפח בלחץ גבוה | מחליף פלטות עץ/אלומיניום
    description: מערכת רצפה מתנפחת בלחץ גבוה המחליפה רצפות מסורתיות מעץ רב-שכבתי או מאלומיניום. מפחיתה את זמן ההקמה, את המשקל הכולל ואת נפח האחסון תוך מתן קשיחות מספקת לעמידה, דיג והליכה. נבדק לתמיכה בעומס מפוזר של 200+ ק"ג.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: סיפון אוויר
