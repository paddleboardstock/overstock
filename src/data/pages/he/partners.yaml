hero:
  tagline: שותפים והפצה
  title: הפכו לשותף של Aquafarer<br />— רשת הפצה עולמית
  subtitle: הצטרפו לרשת השותפים הגלובלית של Aquafarer. אנו עובדים עם מפיצים ימייים, סוחרי סירות, קמעונאים של ציוד ושותפי מותג ב-50+ מדינות.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer רשת שותפים ומפיצים עולמית
content_programs:
  tagline: תוכניות שותפים
  title: תוכניות שותפים<br />בנוי לצמיחה
  subtitle: בין אם אתם מפיצים, סוחרים או שותפי מותג, Aquafarer מציע תוכניות שנועדו לתמוך בעסק שלכם.
  columns: 3
  items:
    - title: תוכנית מפיצים
      description: הפצה בבלעדיות בשטח עם תמחור לפי נפח, תמיכת שיווק וגישה ישירה למפעל. מחויבות מינימלית נדרשת בהתאם לגודל השטח.
      icon: tabler:world
    - title: תוכנית סוחרים
      description: תמחור ישיר לסוחרים, הדרכות מוצר, חומרים שיווקיים ותמיכת אחריות עבור חנויות קמעונאיות וחנויות מקוונות.
      icon: tabler:building-store
    - title: שותפות OEM/ODM
      description: OEM ושירותי ייצור ODM מלאים עם מיתוג מותאם אישית, אריזה ומפרטי מוצר. מהרעיון למיכל.
      icon: tabler:certificate
    - title: שותפות מותג
      description: מיתוג משותף, תווית פרטית ותוכניות דגמים בלעדיים למותגים מוכרים בתחום הימי והפנאי החיצוני.
      icon: tabler:stars
    - title: ממשל ומוסדי
      description: תוכניות ספקים מועדפים למשרדים ממשלתיים, משמר חופים, צבא וארגונים הומניטריים. מסמכים מוכנים למכרזים.
      icon: tabler:building-community
    - title: שותף למלונות והשכרה
      description: תמחור צי, איכות עקבית ומיתוג מותאם אישית למלונות, מרכזי צלילה ועסקי השכרה ברחבי העולם.
      icon: tabler:sun
content_benefits:
  tagline: למה לשתף איתנו פעולה
  title: למה שותפים בוחרים ב-Aquafarer
  subtitle: השותפים שלנו נהנים מיכולת ייצור אמיתית, איכות עקבית ותמיכה תגובתית.
  list:
    - 'גישה ישירה למפעל: עבדו ישירות עם צוות הייצור שלנו — ללא מתווכים. קבלו תגובות מהירות יותר, תמחור טוב יותר וראות מלאה בייצור.'
    - 'מוכן להתאמה אישית: מיתגו את המוצרים שלכם עם צבעים מותאמים אישית, לוגואים, אריזות ומפרטים. כמויות הזמנה מינימליות מותאמות לשוק שלכם.'
    - 'איכות מובטחת: ייצור מוסמך ISO 9001 עם תאימות ל-CE, UKCA, ו-BSCI. כל מוצר נבדק לפני המשלוח.'
    - 'לוגיסטיקה עולמית: משלוחים מקינגדאו, סין עם אפשרויות FOB, CIF, ו-DDP. מחסן בארה"ב במונטקלייר, קליפורניה להפצה בצפון אמריקה.'
    - 'תמיכת שיווק: קטלוגי מוצרים, צילום, תיעוד טכני ונכסים דיגיטליים לתמיכה במאמצי המכירה שלכם.'
    - 'הדרכה ותמיכה: הדרכת מוצר לצוות המכירות שלכם, תמיכה טכנית ללקוחותיכם ותיאום שירותי אחריות.'
content_process:
  tagline: כיצד להפוך לשותף
  title: תהליך שותפות פשוט
  subtitle: תהליך השותפות שלנו ברור — מתוכנן כדי שתתחילו למכור את מוצרי Aquafarer במהירות.
  items:
    - title: 'שלב 1: הגשת בקשה'
      description: מלאו את טופס בקשת השותפות שלנו עם פרופיל החברה שלכם, שוק היעד ותחומי העניין במוצרים.
    - title: 'שלב 2: בדיקת כשירות'
      description: צוות השותפות שלנו בוחן את בקשתכם ויוצר קשר עמכם תוך 3 ימי עסקים כדי לדון בהזדמנויות.
    - title: 'שלב 3: הסכם והגדרות'
      description: חתמו על הסכם שותפות, הגדירו את החשבון שלכם וקבלו מחירי שותף, חומרי שיווק ודוגמיות מוצרים.
    - title: 'שלב 4: הכשרה והשקה'
      description: מתן הכשרה על מוצרים, תמיכת מכירות וחומרי שיווק. אתם מוכנים להתחיל למכור.
cta:
  title: מוכנים להפוך לשותף Aquafarer?
  subtitle: הגישו בקשה לשותפות והצוות שלנו יענה תוך 3 ימי עסקים.
  actions:
    - variant: primary
      text: הגישו בקשה לשותפות
      href: /contact
    - text: צפו במוצרים שלנו
      href: /products
