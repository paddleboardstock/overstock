features3_solutions:
  tagline: פתרונות
  title: הרפתקת המים שלך<br />שותף עסקי
  isBeforeContent: false
  columns: 3
  items:
    - title: מועדוני ספורט מים
      description: חבילות ציוד מלאות, מיתוג מותאם אישית, ותוכניות תחזוקה למועדוני SUP, מועדוני קיאקים, בתי ספר לגלישה ומרכזי הכשרה.
      icon: tabler:users
      link: /solutions/clubs
    - title: ספורט ימי RIBs
      description: RIBs מיועדות במיוחד לבתי ספר לשיט, מרכזי ספורט מים וארגוני אירועים. סירות מאמן, סירות גרירה וסירות פיקוח לספורט ימי מקצועי.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: ריזורטים ובתי מלון
      description: תוכניות ספורט מים פרימיום עם ציוד צי, מערכות בטיחות, הכשרת צוות וניהול הכנסות לנכסי אירוח.
      icon: tabler:beach
      link: /solutions/resorts
    - title: יזמי מותגי מים
      description: ייצור מותג פרטי של OEM/ODM עם עלויות נמוכות MOQs, עיצוב מוצרים מותאם אישית, אריזה ומשלוח עולמי לבעלי מותגים חדשים.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: סירות למרכזי צלילה
      description: פלטפורמות RIB יציבות עם כניסה/יציאה קלה, אחסון ציוד ותצורות מנוע מותאמות לפעולות צלילה.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: סירות חילוץ ומים חירום
      description: סירות מהירות RIBs וסירות מתנפחות המיועדות לחיפוש והצלה, תגובה לחירום ולפעולות משמר חופים.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: פתרונות סירות עזר ליכטות
      description: סירות עזר קומפקטיות, סגנוניות RIB שמתאימות לסופר-יכטות ולסירות פנאי. אחסון קל, ביצועים עוצמתיים.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: פתרונות סירות דיג
      description: סירות מתנפחות יציבות ועמידות וRIBs המוגדרות לפעולות דיג מסחרי ופנאי.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: ציוד תיירות ימית
      description: סירות מתנפחות מוכנות צי, לוחות SUP וקיאקים למלונות, מפעילי סיורים ועסקי השכרת ספורט ימי.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: אנרגיה ימיות RIBs
      description: RIBs כבדות למתן תמיכה לפלטפורמות נפט וגז, העברת צוותים למתקני רוח, בדיקת כבלים תת-ימיים ובנייה ימית.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: סירות עבודה באקוולתריה
      description: RIBs עמידות בפני קורוזיה לחקלאות דגים, גידול פנינים וחוות ימיות. צינורות Hypalon, חומרות מנירוסטה, עמידות לשימוש יומי.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: מחקר וסקרים ימיים
      description: RIBs יציבות מוכנה לכלי מדידה למחקר אוקיינוגרפי, ניטור סביבתי, דגימות איכות מים ותוכניות לימוד באוניברסיטה.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: סירות עבודה מסחריות
      description: RIBs כבדות לסיור, סקר, העברה ולוגיסטיקה ימיות. נבנו לדרישות הקפדניות של פעולות מסחריות.
      icon: tabler:ship
      link: /commercial-workboats
