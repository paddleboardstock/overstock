hero:
  tagline: שרטוטים טכניים ו-CAD
  title: RIB & סירה מתנפחת<br />שרטוטים טכניים והורדות CAD
  subtitle: שרטוטי GA ברמת תכנון, גיליונות מימד ופריסות סיפון לצורך הערכת פרויקט ומפרט. גש לשרטוטים טכניים ברמה הנכונה — מקבצי PDF ציבוריים ועד קבצי STEP ברמת הפרויקט.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB שרטוטים טכניים של סירות והורדות CAD
direct_answer: Aquafarer מספק שרטוטים טכניים ברמת רכש RIB לסירות ולכלי שיט מתנפחים — כולל קבצי PDF לסידור כללי (GA), גיליונות מימד ושרטוטי סידור דק. פורמטים מפורטים יותר (DXF/DWG, STEP/IGES) זמינים לפי בירור מוסמך או בקשת פרויקט.
