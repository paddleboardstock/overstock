content_version_control:
  tagline: בקרת גרסאות
  title: גרסת ציור<br />ניהול
  subtitle: כל שרטוט עוקב אחרי מערכת תיקונים מבוקרת. תמיד וודא שיש לך את התיקון הנוכחי לפני שאתה משתמש בשרטוטים לתכנון פרויקט.
  items:
    - title: מעקב גרסאות
      description: לכל שרטוט יש קוד עדכון (Rev-A, Rev-B, Review-C), תאריך ההוצאה, תאריך הבדיקה האחרונה, דגם/תצורה רלוונטי, יחידות, גודל קובץ ופורמט. רק הגרסה "הנוכחית" זמינה להורדה.
      icon: tabler:git-branch
    - title: הודעת סטטוס שרטוט
      description: כל השרטוטים הציבוריים מסומנים כ"פריסה ראשונית בלבד — לא לבנייה, הסמכה או שימוש בייצור. המידות כפופות למפרט סופי ולאישור ההזמנה." דבר זה מגן על שני הצדדים מפני יישום שגוי.
      icon: tabler:alert-circle
    - title: התראות עדכון
      description: כאשר מפרט דגם משתנה, גרסת השרטוט מתעדכנת וגרסאות קודמות מסומנות כ"הוחלף". משתמשים רשומים שהורידו חבילות DXF/DWG מקבלים הודעה על עדכונים משמעותיים בדוא"ל.
      icon: tabler:bell
faq:
  title: שרטוטים טכניים — שאלות נפוצות
  questions:
    - q: האם קבצי ה-PDF של GA באמת חינמיים?
      a: כן. קבצי PDF לסידור כללי למודלים הראשיים שלנו זמינים ללא עלות — מלאו את טופס ההסמכה הקצר למטה וקישור ההורדה יישלח בדוא"ל תוך יום עסקים אחד. הם מכילים מידע ברמת תכנון מספיק להערכת פרויקט, הקצאת מקום וסקירת מפרט ראשוני.
    - q: איך אני ניגש לקבצי DXF/DWG?
      a: מלאו את טופס ההסמכה הקצר בדף ההורדה עם שם החברה, סוג הפרויקט והשימוש המיועד שלכם. בקשות שאושרו מקבלות קישור להורדה במייל בתוך יום עסקים אחד.
    - q: האם אפשר לקבל דגמים תלת-ממדיים של STEP/IGES?
      a: קבצי מודלים תלת-ממדיים של STEP או IGES זמינים דרך תהליך הגשת הבקשה לפרויקט שלנו. ספק את היקף הפרויקט, דרישות האינטגרציה, לוח הזמנים וכוונת הרכישה. בכפוף לאישור — בדרך כלל תוך 3-5 ימי עסקים.
    - q: למה אתה מגביל גישה לקבצים מפורטים יותר?
      a: גיאומטריית גוף, נתוני תבניות וחישובים מבניים מייצגים שנים של השקעות במחקר ופיתוח ומהווים קניין רוחני מרכזי בייצור. אנו מספקים את כל מה שנדרש לתכנון רכש ואינטגרציה של פרויקטים, תוך שמירה על יכולתנו להמשיך להשקיע בפיתוח מוצרים חדשים.
    - q: האם השרטוטים כוללים פרטי ייצור?
      a: לא. שרטוטים ציבוריים וצורות אור מכילים מידע ברמת רכש לתכנון ומפרט. פרטי רמת הייצור (לוחות זמנים למינציה, מסלולי כלים, הרחבות חיתוך) משותפים רק NDA תחת הזמנות מאושרות.
    - q: האם שרטוטים זמינים לקונפיגורציות מותאמות אישית או חצי-מותאמות RIB אישית?
      a: שרטוטי פרויקט מותאמים אישית מוכנים כחלק OEMODM מתהליך הפיתוח. אם אתם מעריכים RIB פרויקט מותאם אישית, צרו איתנו קשר עם דרישותיך ונספק שרטוטי GA ייעודיים לפרויקט כחלק מההצעה.
