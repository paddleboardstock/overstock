content_tiers:
  tagline: רמות ההורדה
  title: ארבע רמות גישה<br />— הפרט הנכון לבמה הנכונה
  subtitle: אנחנו מספקים שרטוטים ברמת רכש, לא קבצים ברמת ייצור. כל רמה תואמת לשלב פרויקט שונה.
  items:
    - title: Tier 1 — PDF ציבורי
      description: סידור כללי (GA), שרטוט ממדי 4 תצוגות, ופריסת הדק בפורמט PDF. זמין להורדה חינמית. מספיק לתכנון פרויקט, הקצאת שטחים וסקירת מפרט ראשוני.
      icon: tabler:file-type-pdf
    - title: דרגה 2 — צורת אור DXF/DWG
      description: קבצי CAD דו-ממדיים (DXF או DWG) לאינטגרציה של פריסה ברמת תכנון. דורש טופס הסמכה קצר (שם החברה, סוג הפרויקט, שימוש מיועד). אין נתונים מבניים או ייצוריים כלולים.
      icon: tabler:file-code
    - title: דרגה 3 — יישום פרויקט STEP/IGES
      description: קבצי מודלים תלת-ממדיים (STEP או IGES) לאינטגרציית מערכת, עיצוב ציוד או תיאום ארכיטקטורה ימית. דורש יישום פרויקט עם היקף, לוח זמנים וכוונת רכישה. בכפוף לאישור.
      icon: tabler:cube
    - title: דרגה 4 — NDA הנדסה
      description: שרטוטים מבניים של גוף, לוחות זמנים למינציה, הרחבות חיתוך צינורות ונתוני תבנית. זמינים רק NDA תחת עם הזמנות מאושרות. אלו קבצים ברמת ייצור — לא להפצה ציבורית.
      icon: tabler:lock
content_included:
  tagline: מה כלול
  title: תוכן השרטוט<br />לפי דגם
  subtitle: לכל דגם יש חבילת שרטוטים סטנדרטית המכסה את המידע התכנון החיוני B2B לרוכשים ומהנדסי הפרויקט.
  items:
    - title: סידור כללי (GA)
      description: פרופיל צד, תצוגה עליונה וחתך רוחב המציגים את צורת גוף הספינה, מיקום הצינור, מיקום הקונסולה, הישיבה, מערכת הדלק ומידות מפתח (LOA, רוחב, קוטר צינור, זווית דדרז). סטטוס גרסאות וזכויות יוצרים נרשמו על בלוק הכותרת.
      icon: tabler:layout
    - title: שרטוט מימד בארבעה תצוגות
      description: תצפיות צדדיות, קדמיות, אחוריות ועליונות עם מידות כלליות לתכנון תחבורה (גובה על נגרר, קורה למכולה, משקל להרמה). כולל תצורות תפעול ותחבורה.
      icon: tabler:ruler-2
    - title: תכנון הסיפון ותכנון הציוד
      description: תצוגת סיפון מלמעלה מראה את בסיס הקונסולה, מיקומי המושבים, מיקומי טבעת D, מיקום אורות ניווט, גישה למשאבת המים, תא סוללה/דלק ונקודות התקנה של ציוד. דיוק מוגבל בממשקים קנייניים.
      icon: tabler:map
    - title: שרטוט תחבורה ואריזות
      description: תוכנית טעינת מכולות, מידות העריסה, חלוקת משקל ומיקום נקודות הרמה לתכנון לוגיסטי. כולל אפשרויות אריזה סטנדרטיות ומותאמות אישית.
      icon: tabler:truck
content_protection:
  tagline: הגנה על קניין רוחני
  title: מה שאיננו משתפים<br />& למה
  subtitle: הגנה על קניין הרוחני ההנדסי שלנו מבטיחה שנוכל להמשיך להשקיע במחקר ופיתוח ועדיין לספק את כל מה שהקונים צריכים לתכנון הפרויקט.
  items:
    - title: נתוני ליבת תבנית גוף
      description: גאומטריית פלאג ותבנית, CNC מסלולי כלים ותבניות למינציה הן נכסי ייצור קנייניים. הם אינם משותפים בשום שלב גישה מחוץ NDA לחוזים מאושרים.
      icon: tabler:ban
    - title: הרחבות חיתוך צינורות
      description: קבצי חיתוך בתבנית שטוחה לבד צינורות הם נתונים ברמת הייצור. זמינים רק NDA מתחת להזמנות ייצור מאומתות ומשותפים רק עם צד החוזה.
      icon: tabler:ban
    - title: חישובים מבניים
      description: ניתוח עומס מפורט, תוצאות FEA ולוחות זמנים של למינציה הם מסמכים רגישים לעמידה בתקנות שמשותפים רק עם גופים מודעים NDAולקוחות מחויבים במהלך תהליך הערכת התאמה.
      icon: tabler:ban
    - title: סינון מתחרים
      description: אנו שומרים לעצמנו את הזכות לדחות בקשות גישה ל-CAD שנראות כמגיעות ממתחרים, סטודנטים ללא הקשר לפרויקט, או צדדים ללא כוונת רכש לגיטימית.
      icon: tabler:shield
content_models:
  tagline: דגמים זמינים
  title: שרטוט טכני<br />זמינות לפי דגם
  subtitle: הורדות PDF לג'ורג'יה זמינות עבור RIB דגמי הסירות הראשיים והמתנפחים שלנו. צרו איתנו קשר לשרטוטי דגמים ספציפיים שאינם מופיעים.
  items:
    - title: AF580 RIB
      description: 5.8 מ'RIB, גוף GRP עמוק V, Hypalon או PVC צינורות, קונסולה מרכזית. GA, מידות, סידור הסיפון ותכנית ההובלה זמינים. קטגוריית עיצוב C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5.2 מ' RIB, גוף GRP בינוני-V, Hypalon או PVC צינורות, קונסולה צדדית או מרכזית. זמינים שרטוט כולל ומידות. קטגוריית עיצוב C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4.3 מ' RIB, גוף GRP, צינורות PVC, טילר או קונסולה. זמינים שרטוט כולל ומידות. קטגוריית עיצוב C/D.
      icon: tabler:sailboat
    - title: AF380 סירה מתנפחת
      description: 3.8 מ' דינגי מתנפח, רצפת אלומיניום, צינורות PVC. זמינים שרטוט כולל ומידות אריזה. עומד ב-EN ISO 6185.
      icon: tabler:sailboat
    - title: AF320 סירה מתנפחת
      description: 3.2 מ' סירה מתנפחת, רצפת אוויר, צינורות PVC. זמינים שרטוט כולל ומידות אריזה. עומד ב-EN ISO 6185.
      icon: tabler:sailboat
