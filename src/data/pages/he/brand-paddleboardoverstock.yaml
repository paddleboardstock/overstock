trustSignals:
  tagline: אותות אמון
  title: למה Paddle Board Overstock הוא שותף אמין
  manufacturing:
    title: יכולת ייצור
    body: מתקן ייצור בגודל 12,000 מ"ר עם 200-300 עובדים מיומנים ו־14 מהנדסי + מו"פ. ISO מערכת ניהול איכות מוסמכת ISO 9001. תפוקה שנתית של 15,000 יחידות סירות מתנפחות המשרתות 50+ מדינות.
    stats:
      - label: גודל המתקן
        value: 12,000 m²
      - label: כוח אדם
        value: 200-300
      - label: מהנדסי מחקר ופיתוח
        value: 14+
      - label: הקיבולת השנתית
        value: 15,000
  quality:
    title: מחויבות לאיכות
    body: מבדיקת החומר ועד למבחנים הסופיים, Paddle Board Overstock שומרת על תהליכי איכות שיטתיים כדי לספק מוצרים ימיים אמינים. כל יחידה עוברת בדיקות לחץ, בדיקת תפרים ואימות ביצועים לפני המשלוח.
    items:
      - CE מוסמך — 64 דגמים עומדים בתקני הבטיחות האירופיים
      - ISO 9001:2015 — מערכת ניהול איכות מוסמכת
      - UKCA מסומן — תאימות לשוק הבריטי
  global:
    title: נוכחות עולמית
    body: Paddle Board Overstock מספקת שירות ללקוחות בשווקים עולמיים מרובים, ותומכת במפיצים, מותגי חוץ, ומשתמשים מקצועיים ימיים ב-50+ מדינות ברחבי אירופה, אסיה-פסיפיק, אמריקות, המזרח התיכון ואפריקה.
comparison:
  tagline: מיצוב מותג
  title: Paddle Board Overstock בשוק
  position: יצרן ימי ממוקד הנדסה המשלב מומחיות בכלי שיט מתנפחים עם OEMODM יכולת מלאה, פיתוח מותאם אישית ו-12+ שנות ניסיון בייצור יצוא.
  strengths:
    - מומחיות בהנדסת כלי שיט מתנפחים
    - יכולת ייצור מלאה OEM/ODM
    - פיתוח ועיצוב מוצר מותאם אישית
    - מתקן ייצור מוסמך בשטח של 12,000 מ"ר ISO
  bestFor:
    - משתמשי פנאי חיצוני המחפשים כלי שיט מתנפח אמין
    - מפעילי ימי הזקוקים לציוד בדרגת מסחר
    - שותפי מותג הזקוקים לייצור OEM/ODM
    - ארגוני חילוץ וסיור מקצועיים
