hero:
  tagline: בתי ספר לספורטי מים ומרכזי אימון
  title: פתרונות ציוד<br />לבתי ספר לSUP וקיאקים
  subtitle: ציוד אמין, מסחרי, לבתי ספר לפדלים, הדרכת גלישה, אימון קיאקים, ותוכניות חינוך לספורט ימי בכל היקף.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP לוחות לבתי ספר ומרכזי אימון
direct_answer: Paddle Board Overstock מספקים לSUP ובתי ספר לקיאקים ברחבי העולם לוחות מסחריים, ציוד בטיחות וחבילות למדריכים. הציוד שלנו בנוי לשימוש יומי בהדרכה — PVC עבים יותר, ליבות drop-stitch מחוזקות, ועיצובי גלים יציבים שנותנים ביטחון למתחילים ואמינות למדריכים. החבילות כוללות מיתוג מותאם אישית, תוכניות חלקי חילוף, ומשאבי הדרכה.
solution_offerings:
  - title: חבילת התחלת בית ספר
    subtitle: לתוכניות חדשות ומרכזי אימון קטנים
    badge: Popular
    features:
      - title: לוחות לתלמידים
        description: 10–25 לוחות SUP כלליים או קיאקים פנאי עם פלטפורמות יציבות לשיעורים למתחילים
      - title: לוחות למדריכים
        description: לוחות רחבים וארוכים יותר עם יציבות נוספת ודקים לא מייבשים (EVA) לאימון
      - title: ציוד בטיחות
        description: אפודי הצלה, רצועות בטיחות, שופרות, ותיקים ניידים בצבעים תואמים
      - title: אחסון והעברה
        description: מדפי לוחות ממוספרים, עריסות קיאק מרופדות ועגלות להובלה
      - title: תמיכה בתוכנית הלימודים
        description: תבניות שיעורים, רשימות בדיקה לבטיחות ומדריכי התקדמות מיומנות
    cta_text: חבילת "הפעל את בית הספר שלי"
    cta_href: /contact
  - title: חבילת פרימיום לבית ספר
    subtitle: לבתי ספר מבוססים ומנהלים עם מספר תוכניות
    badge: Best Value
    features:
      - title: צי צי מלא
        description: 25–50 לוחות או קיאקים בצי מעורב (כללי, טיולים, גדלים לנוער)
      - title: צי מדריכים
        description: 3–5 לוחות מדריך מסוימים עם חיבור מובנה למערכת קול
      - title: תחנת בטיחות
        description: תחנת ציוד בטיחות מרוכזת עם אפודי הצלה, רדיו, עזרה ראשונה ושילוט
      - title: חבילת מיתוג
        description: הדפסת לוגו מלאה על לוחות, משוטים, אפודי הצלה ותלבושות
      - title: תוכנית תחזוקה
        description: ערכת תחזוקה רבעונית, חבילות חלקי חילוף והדרכת תיקון
    cta_text: בנה חבילת פרימיום
    cta_href: /contact
  - title: חבילת זכיינות לבית ספר
    subtitle: לרשתות מרובות מיקומים ומפעילי זכיינות
    badge: Enterprise
    features:
      - title: סטנדרטיזציה של צי הצי
        description: ציוד זהה בכל המיקומים לחוויית תלמיד עקבית
      - title: הזמנה מרכזית
        description: הזמנה מרוכזת, תמחור בכמויות וניהול מרכזי של חלקי חילוף
      - title: הדרכת מדריכים
        description: הכשרה על טיפול בציוד ותחזוקה לכל המדריכים
      - title: מיתוג משותף
        description: מיתוג משותף עם זכיין + Paddle Board Overstock אפשרויות מיתוג משותף
      - title: תמיכת הרחבה
        description: ייעוץ להתרחבות, תחזית ציוד והקמת מיקום חדש
    cta_text: דון בתוכנית זכיינות
    cta_href: /contact
benefits:
  - title: בנוי להדרכה יומית
    description: PVC עבה יותר ומסילות מחוזקות עמידות לשימוש יומי של תלמידים, נפילות על חול ונחיתה סלעית.
    icon: tabler:shield
  - title: פלטפורמות למידה יציבות
    description: דקים רחבים יותר ורוקרים שטוחים יותר נותנים לבחורים מתחילים ביטחון. המדריכים מתמקדים בלימוד, לא בציוד.
    icon: tabler:scale
  - title: אחסון והובלה קלים
    description: עיצוב ניפוחי מאחסן במקומות קטנים. לוחות מנופחים משתלבים במכוניות סטנדרטיות להדרכה ניידת.
    icon: tabler:box-seam
  - title: מיתוג מותאם
    description: לוגואים וצבעי בית ספר על כל לוח. המותג שלך, הזהות שלך — לא ציוד השכרה כללי.
    icon: tabler:brush
content_segments:
  tagline: פרופילי בתי ספר
  title: פתרונות חינוך בספורט ימי<br />לפי סוג תוכנית
  subtitle: בתי ספר לפדל, אקדמיות גלישה, תוכניות אוניברסיטאיות ומפעילי זכיינות מתמודדים עם אתגרים תפעוליים שונים — משילוב תכנית לימודים ועד סטנדרטיזציה של צי בצי מרובה מיקומים. אנו מתאימים חבילות ציוד לתבנית החינוכית.
  items:
    - title: בתי ספר עצמאיים SUP וקיאקים
      subtitle: מרכזי הדרכה בבעלות הבעלים
      description: בתי ספר קטנים עד בינוניים המנוהלים על ידי בעלים-מדריכים המציעים שיעורי SUP, הדרכת קיאק וקורסי הסמכה. הציוד צריך להיות עמיד מספיק לשימוש הדרכתי יומיומי, משתלם לתקציב של עסק קטן, ורב שימושי כדי לשרת תלמידים מתחילים עד בינוניים בצי אחד.
      features:
        - לוחות SUP יציבים לכל שימוש וקייאקים לפנאי לשיעורי מתחילים
        - לוחות מותאמים למדריכים עם יציבות נוספת לאימון מהמים
        - תבניות תוכנית שיעור ומדריכי התקדמות בכישורים כלולים
        - תוכנית חידוש ציוד שנתית עם הנחות על החלפה
    - title: תוכניות פנאי באוניברסיטאות ומכללות
      subtitle: צי ציוד פנאי סטודנטיאלי בקנה מידה גדול
      description: מחלקות פנאי באוניברסיטאות המפעילות מועדוני משוט, תוכניות השכרה וקורסי הדרכה כחלק מהיצע הפנאי בקמפוס. הציוד נתקל בשימוש מרבי במהלך הסמסטרים, דורש מערכות בדיקה/החזרה קלות, וחייב לעמוד ברמות כישורים שונות - מתלמידים בפעם הראשונה ועד משיטים מתקדמים.
      features:
        - בנייה PVC עמידה במיוחד, מותאמת למעגלי שימוש מוסדיים
        - צי צבעוני לפי רמת כישורים לניהול קל
        - תאימות למערכת מעקב מלאי מבוססת RFID או מדבקות
        - מחירים בכמויות עם הזמנות ותנאי תשלום מבוססי סמסטר
    - title: בתי ספר לגלישה ואקדמיות גלישה
      subtitle: תוכניות הדרכת גלישה חופית
      description: בתי ספר לגלישה המלמדים גלישת SUP, משטחי פרוונס ומשוט בקייאק בחוף. הציוד חייב להתמודד עם תנאי אזור הגלישה — עמידות בפני פגיעות, סבילות לחול ומי ים, והחזרות מהירות בין שיעורים.
      features:
        - צורות ייעודיות לגלישה עם מסילות מחוזקות ובנייה עמידה לפגיעות
        - אפשרויות סנפירים רכים ורצועות סליליות לבטיחות התלמידים
        - בד לרחיצה מהירה שמתייבש בין סבבי שיעורים
        - תוכנית החלפת ציוד עם בדיקה ולחידוש בסוף העונה
    - title: זכיינות ורשתות מרובות סניפים
      subtitle: ציוד סטנדרטי בכל המיקומים
      description: מפעילים מרובי מיקומים שמנהלים תוכניות הדרכה סטנדרטיות במספר ערים או אזורים. עקביות הציוד בכל המיקומים מהותית — כל תלמיד צריך לקבל את חוויית הציוד זהה ללא קשר למיקום הזכיינות שבו הוא מבקר. הזמנות מרוכזות, אחידות מותגית ותמיכה בהתרחבות חיוניות.
      features:
        - מפרטי צי זהים בכל סניפי הזכיינות
        - הזמנה מרוכזת עם תמחור לפי נפח
        - 'אפשרויות מיתוג משותף: מותג הזכיינות + Paddle Board Overstock מיתוג משותף'
        - 'ערכת הקמה למיקום חדש: ציוד, שילוט ומלאי פתיחה'
cta:
  title: מוכנים לצייד את בית הספר שלכם?
  subtitle: צרו קשר עם הצוות שלנו לתוכנית ציוד מותאמת אישית. אנו עובדים עם בתי ספר בכל הגדלים.
  actions:
    - variant: primary
      text: דברו עם הצוות שלנו
      href: /contact
    - text: צפו בקטלוג המוצרים
      href: /products
