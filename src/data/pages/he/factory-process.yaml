hero:
  tagline: תַהֲלִיך
  title: תהליך הייצור
  subtitle: מחומרי גלם עד סירה מוכנה למים — כל שלב תחת שליטתנו
  back_label: חזרה למפעל
  back_link: /factory
intro: בשונה ממותגים שמחסנים את הייצור במפעלים של צדדים שלישיים, Aquafarer בעלת ומנהלת את כל שרשרת הייצור שלה. שילוב אנכי זה מאפשר לנו לשמור על בקרת איכות קפדנית בכל שלב, להגיב במהירות לדרישות מותאמות אישית, ולספק איכות מוצר עקבית מהייצור לייצור. כך נבנית סירה במתקננו.
steps:
  - step: '01'
    title: קבלת והערכת חומרי גלם
    description: כל מנות של בד PVC, מזרן סיבי זכוכית, שרף וחומרי חיבור נבדקות מול המפרט. דוגמאות בד נבדקות למתיחת חוזק, אחידות עובי, ועמידות ל-UV לפני העברתם לייצור. חומרים שאינם עומדים במפרט מופרדים ומוחזרים.
    duration: 1–2 ימים
  - step: '02'
    title: חיתוך אוטומטי PVC
    description: בדים שאושרו מונחים על מכונת חיתוך אוטומטית CNC ונחתכים בדיוק תת-מילימטרי. סידור הפאנלים הממוחשב מצמצם פסולת — בדרך כלל מתחת ל-5%. פאנלים חתוכים מתויגים לפי דגם הסירה ותא, ואז נארזים להעברה למפעל הריתוך.
    duration: 2–4 שעות לערכת סירה
  - step: '03'
    title: אטימה וריתוך צינורות
    description: הפאנלים נמסים ומודבקים באמצעות מכונות אטימה בחום עם ריתוך אוויר חם בטמפרטורות מבוקרות של 200–600 °C. התפרים הראשיים מחוזקים בריתוך דיאלקטרי RF לצמתים אוויר-אטומים וחזקים. התאים המושלמים מנופחים ללחץ עבודה של 1.25× למשך 30 דקות לאימות שמירת האוויר.
    duration: 1–2 ימים לכל סירה
  - step: '04'
    title: יציקת גוף סירה מסיבי זכוכית RIB
    description: גופי סירות RIB מיוצרים באמצעות יציקת סיבי זכוכית ידנית. שכבות של מזרן סיבי זכוכית וחבל ארוג נגללים ביד עם שרף פוליאסטר או וינילסטר בתבניות מדויקות. כל שכבה נארזת בשקית ואקום לאחידות למקנה האיכות. הגלוח סיים בציפוי ג'לקוט למשטח ימי מבריק ועמיד ל-UV.
    duration: 2–4 ימים לכל גוף סירה
  - step: '05'
    title: SUP הדפסה וקישוט
    description: גרפיקות דקה SUP מוחלות באמצעות הדפסה דיגיטלית לעיצובים צבעוניים איכותיים, והדפסה מסך ללוגואים וסגנונות חוזרים עמידים. ההדפסות מתקשות ומאטמות לעמידות ל-UV ושחיקה.
    duration: 1–2 ימים
  - step: '06'
    title: הרכבה סופית והפיגוע
    description: גופי הסירות מסיבי זכוכית והרכבות צינורות PVC מתחברים בקו ההרכבה. המנוע מותקן, בקרות ההיגוי והדוושה מחוברות, מערכת הדלק מותקנת וכל חיווט החשמל מותקן. כל סירה עוקבת אחרי רשימת בדיקה בת 100 נקודות עם חובת חתימה בכל שלב.
    duration: 2–3 ימים
  - step: '07'
    title: בדיקות איכות ובדיקות
    description: 'כל סירה מושלמת עוברת שער איכות חובה: בדיקת שמירת אוויר בתאים, בדיקת תפקוד מערכות, אימות מומנט מהדקים ובדיקת אסתטיקה. מכוניות מותאמות אישית ופרוטוטיפים אף עוברות ניסויים במים ובים הכוללים מהירות, טיפול, יציבות וסיבולת.'
    duration: 1–2 ימים
  - step: '08'
    title: אריזה ומשלוח
    description: הסירות מנופחות, מקופלות בהתאם לנהלים, נארזות בשקיות ארוגות כבדות או בארגזי עץ, ונטענות למשלוח. כל חבילה מתויגת עם דגם, מספר סידורי ויעד. אנו משתפים פעולה עם חברות שילוח למכולות FCL ו-LCL ברחבי העולם.
    duration: 1 יום
