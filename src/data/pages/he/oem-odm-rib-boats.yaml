      standard: ספק דרישות מונחיות ושוק יעד
      premium: עיצוב מאפס — גוף ייחודי, תבנית ותיעוד מלא
content_customization:
  tagline: מה ניתן להתאים אישית
  title: RIB התאמה אישית<br />אפשרויות
  subtitle: כל אלמנט של סירת RIB יכול להיות מותאם ליישום, לשוק ולדרישות המותג שלך.
  items:
    - title: גוף ומבנה
      description: אורך הגוף (2.5–8.5 מ'), חומר הגוף (GRP פיברגלס או אלומיניום בדרגת ימיות), צבע הגוף (ג'לקוט או צביעה), פרופיל הספינה (Deep-V, Moderate-V, שטוח), סוג הטרנסום (טרנסום סגור עם ברקט או באר), וחיזוק מבני לפי דרישות עומס מסחרי.
      icon: tabler:sailboat
    - title: צינור וקולר
      description: חומר הצינור (0.9–1.2 מ"מ PVC או 1.4–1.7 מ"מ Hypalon/CSM), קוטר הצינור (40–55 ס"מ), מספר תאים (3–7), סוג שסתום (Halkey-Roberts, Leafield D7, או Boston), צבע הצינור (סטנדרטי או מותאם אישית), ותצורת קונוס/טפר הקולר.
      icon: tabler:circle
    - title: תצורת דק וקונסולה
      description: קונסולה מרכזית, קונסולה צדדית, או הגה תילר. פריסת מושבים (מושבי Jockey, ספסלים, מושבי בולסטר). כיסוי הדק (EVA קצף מראה עץ, צבע נגד החלקה, או GRP חשוף). נקודות התקנת ציוד, מסילות אחיזה, ומיקומי D-ring.
      icon: tabler:layout-dashboard
    - title: חשמל וניווט
      description: אורות ניווט (LED), מערכת משאבת ביילג', ניהול סוללות, התקנת רדיו VHF, הרכבת GPS/צ'ארט-פלאוטר, יציאות טעינת USB, ותצורת פאנל הפעלה.
      icon: tabler:bolt
    - title: מיתוג וגרפיקה
      description: גרפיקות על הגוף והצינור (הדפסה מסך, העברת חום, UV הדפסה דיגיטלית), מיקום לוגו, תכניות צבע ייחודיות, סימוני זיהוי, ותיעוד בעל מותאם אישית עם המותג שלך.
      icon: tabler:palette
    - title: בטיחות וציות
      description: דירוג קטגוריית עיצוב (A/B/C/D לפי RCD), מערכת כיבוי אש, מפרט מערכת דלק (מיכל נייד, מיכל קבוע, מתחת לדק), וחבילת תיעוד תאימות לשוק היעד שלך.
      icon: tabler:shield
content_applications:
  tagline: פריסות לפי יישום
  title: RIB תצורות<br />לפי יישום
  subtitle: משימות שונות דורשות תצורות שונות. הנה הגדרות מוכחות ליישומים הנפוצים ביותר של RIB.
  items:
    - title: חילוץ וסיור
      description: גוף Deep-V, צינורות Hypalon, דק מנקז עצמי, מושבי בולסטר, ידיות אחיזה, אורות ניווט, ו-D-rings חזקים. RCD קטגוריית עיצוב B או C. מערכת דלק עמידה לאש וחשמל בדרגה מסחרית.
      icon: tabler:lifebuoy
    - title: תמיכה בצלילה
      description: רוחב רחב, סולם עלייה אחורי, מיקומי מדפי מיכלים, D-rings נוספים, הרכבת דגל צלילה, חיזוק טרנסום למנועי חוץ כפולים, וכיסוי דק מלא נגד החלקה EVA.
      icon: tabler:mask
    - title: תיירות ומסחרי
      description: פריסת מושבים מוסמכת לנוסעים עם ספסלים, צל/בימיני, מסילות אחיזה, אחסון יבש, ומערכת סוללה כפולה. RCD קטגוריה C. עוצב לפעילות נופש וציי שטח.
      icon: tabler:beach
    - title: דַיִג
      description: פריסת דק פתוחה, מיקום מחזיקי חכות, עמק חי, הרכבת דג-מאתר, הרכבת מנוע תילר, חיזוק טרנסום, ומערכת דלק ניידת. אפשרויות קונסולה מרכזית או צדדית.
      icon: tabler:fish
    - title: ספינת פנאי ואיאכטות
      description: גוף קל משקל, PVC צינורות, מושבים נוחים, טילר טלסקופי או קונסולה קומפקטית, נקודות הרמה לדביט, ומיכל דלק נשלף.RCD קטגוריה C או D.
      icon: tabler:sailboat
    - title: סירת עבודה מקצועית
      description: אפשרות גוף אלומיניום, חיזוק כבד, היגוי הידראולי, חשמל מסחרי, קשת רדאר ונקודות אינטגרציה של ציוד ייעודי למשימה. התאמה אישית לכל פרויקט.
      icon: tabler:anchor
process_steps:
  title: תהליך 7-שלבים RIB OEM/ODM פיתוח
  subtitle: מתדריך פרויקט ועד לאחר המכירה — זרימת עבודה מוגדרת עם אבני דרך ברורות ותוצרים
  steps:
    - number: '01'
      title: תקציר הפרויקט ודרישות
      description: הגדר את יישום היעד, גודל גוף הספינה, חומר הצינור, דרישות הציות וצרכי המיתוג. אנו מעריכים את היתכנות ומאשרים את מודל שיתוף הפעולה (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 ימים
    - number: '02'
      title: סקירה טכנית והיתכנות
      description: צוות ההנדסה בוחן היתכנות מבנית, חישובי יציבות וציפה, מסלול עמידה וזמינות חומרים. אנו מזהים תבניות קיימות או דרישות מותאמות אישית.
      timeline: 5–7 ימים
    - number: '03'
      title: הצעה והצעת מחיר
      description: קבל הצעה מפורטת הכוללת מפרטים, הדמיות תלת-ממדיות או שרטוטי GA, היקף ציות, לוח זמנים, ותמחור יחידה בהתבסס על שכבות נפח MOQו-.
      timeline: 5–7 ימים
    - number: '04'
      title: אישור עיצוב ודגימה
      description: אשר את ה-GA הסופי, פריסת הדק ותצורת הצינור. אנו מייצרים דוגמית טרום-ייצור עם צבעי המותג, הלוגו והחומרים המוגדרים שלך לבדיקה הפיזית.
      timeline: 15–20 ימים
    - number: '05'
      title: אישור דגימה ופרוטוקול בקרת איכות
      description: 'בדוק ואשר את הדגימה. הגדר את פרוטוקול בקרת איכות הייצור: בדיקת לחץ (1.25x / 24–48 שעות), בדיקות מימד, ורשימת בדיקה לתיעוד ציות לכל גוף.'
      timeline: 3–5 ימים
    - number: '06'
      title: ייצור המוני ובקרת איכות
      description: ריצת ייצור מלאה עם רשימת בקרת איכות של 100 נקודות לכל יחידה. בדיקות בתהליך, בדיקות לחץ ומעקב ברמת הדרך. CE/ISO תיעוד מוכן במקביל.
      timeline: 30–45 ימים
    - number: '07'
      title: אריזה, משלוח ומכירה לאחר מכן
      description: אריזות מותאמות אישית (סטנדרטיות, מוכנות לקמעונאות או מטוסים), תיעוד ייצוא, טעינת מכולות ולוגיסטיקה. ערכות חלקי חילוף ותיעוד תחזוקה כללו.
      timeline: 7–14 ימים
certifications:
  title: ציות והסמכות RIB לסירות
  subtitle: כל הזמנה מותאמת RIB אישית מגיעה עם תיעוד תאימות ספציפי לדגם
  items:
    - name: CE 2013/53/האיחוד האירופי
      description: RCD עמידה בדרישות לפי דגם וקטגוריית עיצוב — DoC, לוחית בנייה, מדריך לבעלים כולל
      badge: CE
    - name: ISO 9001:2015
      description: מערכת ניהול איכות מוסמכת על ידי SGS הכוללת תכנון, ייצור והפצה
      badge: ISO
    - name: EN ISO 6185
      description: תקן בניית סירות מתנפחות — יציבות, ציפה והצלה במקרה של נפילת אדם למים
      badge: 6185
    - name: EN ISO 14945
      description: לוחית בונה סטנדרטית — מידע על זיהוי וקיבולת המסומן בצורה קבועה
      badge: 14945
    - name: BSCI
      description: בדיקת עמידה חברתית לייצור אתי — נדרשת על ידי קמעונאים באיחוד האירופי
      badge: BSCI
    - name: REACH
      description: ציות לבטיחות כימית של האיחוד האירופי עבור PVC, Hypalon, דבקים וציפויים
      badge: REACH
content_service_modules:
  tagline: מודולי שירות
  title: OEM/ODM שירות<br />מודולים
  subtitle: כל פרויקט משלב את מודולי השירות הנכונים. לא כל פרויקט צריך כל מודול — אנחנו מתכננים רק את מה שהפרויקט שלך דורש.
  items:
    - title: סקירה והיתכנות הנדסית
      description: 'הערכת פלטפורמת גוף הספינה, בדיקת ישימות מבנית, אימות יציבות וציפה, זיהוי מסלול עמידה בתקנות ואישור זמינות חומר. פלט: דוח ישימות עם המלצה המשך/עצירה.'
      icon: tabler:math-function
    - title: עיצוב ותצורה
      description: 'שרטוט GA, פריסת דק, תצורת צינור, עמדות קונסולה וסיעה, תוכנית הרכבת ציוד, ובחירת צבע/חומר. פלט: GA מאושר ומפרט תצורה.'
      icon: tabler:ruler
    - title: דגם ודוגמה
      description: דוגמת טרום ייצור עם צבעים, לוגו וחומרים מאושרים לבדיקה פיזית. כולל פרוטוקול אישור דוגמה, רשימת בדיקה ותהליך בקשה לשינויים.
      icon: tabler:3d-cube-sphere
    - title: ייצור ובקרת איכות
      description: ייצור המוני עם רשימת בדיקה באיכות של 100 נקודות לכל יחידה, בדיקות בתהליך, בדיקות לחץ (1.25x / 24-48 שעות), ומעקב ברמת הסדרה. תיעוד CE/ISO מוכן במקביל.
      icon: tabler:clipboard-check
    - title: מיתוג ואריזה
      description: יישום לוגו במותג פרטי, גרפיקה מותאמת אישית לגוף ולצינור, תיעוד לבעלים ממותג, אריזה מוכנה לקמעונאות או על משטחים, והכנת ערכת חלקי חילוף.
      icon: tabler:palette
    - title: ייצוא ותיעוד
      description: תוכנית אריזת יצוא, טעינת מכולות, מסמכי FOB/CIF/DDP, ניירת תאימות לפי שוק היעד, ופרוטוקול תקשורת לאחר המסירה.
      icon: tabler:world
content_risk_control:
  tagline: בקרת סיכון ואספקה
  title: סיכון פרויקט &<br />ניהול משלוחים
  subtitle: רוכשים מקצועיים של OEM/ODM דואגים לשליטה בסיכונים באותה מידה כמו לאיכות המוצר. הנה איך אנחנו מנהלים זאת.
  items:
    - title: הגדרת תחום ואחזקה
      description: 'לפני תחילת הפיתוח, אנו מגדירים בכתב: היקף התאמה אישית, דרישות כלים, קריטריוני אישור לדוגמה, בעלות על שרטוטים ותבניות, ואחריות על תיעוד. אין עמימות לגבי מי שייך למה.'
      icon: tabler:file-text
    - title: תהליך בקרת שינויים
      description: כל השינויים במפרט לאחר אישור התכנון עוברים תהליך בקשת שינוי מתועד עם הערכת השפעה (עלות, לוח זמנים, עמידה). אין שינויים לא מאושרים שנכנסים לייצור.
      icon: tabler:arrows-diff
    - title: הבטחת עקביות אצווה
      description: היחידה ה-50 תואמת את הדגימה הראשונה שאושרה. המפרטים המאושרים קפואים, פרמטרי החומר והתהליך נעולים, ונקודות ביקורת בתהליך מאמתות עקביות לאורך כל תקופת הייצור.
      icon: tabler:repeat
    - title: אספקה ושקיפות קיבולת
      description: זמני האספקה מוצגים לפי קיבולת ייצור בפועל, רמות מלאי חומרים ועומס הזמנות נוכחי — לא לפי יעדים שאפתיים. לוח זמנים לייצור עם תאריכי אבני דרך מסופקים לכל הזמנה.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — שאלות נפוצות
  questions:
    - q: מה ההבדל בין OEM ODM RIB סירות?
      a: 'OEM (ייצור ציוד מקורי): אתה מספק מפרטים מפורטים ואנחנו בונים את העיצוב שלך.ODM (ייצור עיצוב מקורי): אתה בוחר Paddle Board Overstock RIB פלטפורמה מוכחת ואנחנו מתאימים אותה לתכונות ולמיתוג הרצוי עבורך.ODM מהיר וזול יותר;OEM מציע שליטה עיצובית מרבית.'
    - q: האם אפשר להתאים אישית RIB את צורת הגוף והגודל?
      a: כן. אנו מציעים התאמות חצי-מותאמות לתבניות גוף קיימות (פריסת סיפון שונות, תצורות צינור) ופיתוח גוף מותאם אישית מלא עם CNCתבניות חדשות. פרויקטים חצי-מותאמים אישית יכולים להתחיל ב-2-5 יחידות; מותאם מלא בדרך כלל דורש התחייבויות גבוהות יותר.
    - q: אילו חומרים של שפופרות זמינים בהתאמה RIBsאישית?
      a: אנו מציעים 0.9-1.2 מ"מ PVC לשימוש פנאי ומסחרי קל, ו-1.4-1.7 מ"מ Hypalon/CSM ליישומים מקצועיים, הצלה ומסחריים הדורשים UV עמידות עדיפה ועמידות לאוזון (10-15 שנים לעומת 5-8 שניםPVC).
    - q: האם אפשר להגדיר RIBs יישומים מסוימים כמו הצלה, צלילה או דיג?
      a: כן. אנו מתחזקים תבניות תצורה מוכחות להצלה/סיור, תמיכה בצלילה, תיירות/השכרה, דיג, תמיכה ביאכטות ויישומים מקצועיים לסירות עבודה. כל תבנית כוללת את סוג הגוף המומלץ, חומר הצינור, פריסת הסיפון והציוד — אותם אנו מתאימים בדיוק לדרישותיך.
    - q: איזה מידע אתה צריך עבור RIB OEMODM הצעת מחיר?
      a: יישום היעד, אורך גוף הרצוי, העדפת חומר הצינור (PVCORHypalon), כמות משוערת ולוח זמנים למשלוח, דרישות עמידה בשוק היעד, וכל מוצר או מפרט ייחוסי. ככל שתספק יותר פרטים, כך הצעת המחיר שלנו מהירה ומדויקת יותר.
    - q: מה MOQ המצב RIB לסירות מותאמות אישית?
      a: לתבניות גוף קיימות עם שינויים סטנדרטיים, MOQ מתחילה מ-2-5 יחידות לכל עיצוב. לתבניות מותאמות אישית ופיתוח מותאם מלא, MOQ זה תלוי במורכבות הפרויקט — בדרך כלל 10-20 יחידות לסמי-מותאם אישית ו-30+ למותאם מלא עם כלים חדשים.
    - q: מי הבעלים של התבניות והשרטוטים המותאמים?
      a: תבניות שפותחו באמצעות Paddle Board Overstock עיצובים בסיסיים Paddle Board Overstock נשארות רכוש. תבניות מותאמות אישית מלאות שהוזמנו וממומנו על ידי הלקוח יכולות להיות מוקצות לבעלות הלקוח לפי תנאי החוזה. כל תנאי הבעלות על התבניות מתועדים לפני תחילת הפרויקט.
    - q: איך RIBs מארזים בהתאמה אישית לייצוא?
      a: "סטנדרטי: + עטיפת מתיחה מותאמת אישית לטעינת מכולות. פרימיום: אריזה מוכנה לקמעונאות, אריזת ואקום או משטח. אנו מציעים FOB משלוח צ'ינגדאו, CIF, DDP ומשלוח. כולל תיעוד יצוא מלא ושחרור מכס."
