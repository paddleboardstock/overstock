content_scope:
  tagline: היקף עמידה בדרישות
  title: אילו מוצרים צריכים<br />RCD ציות?
  subtitle: הנחיית כלי השיט הפנאי 2013/53/EU חלה על כלי שיט פנאי באורך גוף בין 2.5 ל-24 מטר. הבנת ההיקף היא הצעד הראשון לעמידה בדרישות.
  items:
    - title: RIB סירות (2.5–24 מ')
      description: סירות מתנפחות קשיחות עם אורך גוף בין 2.5 מ' ל-24 מטר נכללות תחת RCD. קטגוריות עיצוב A עד D חלות בהתאם לתנאי הים המיועדים ולכוח הרוח המרבי.
      icon: tabler:sailboat
    - title: סירות מתנפחות (פחות מ-2.5 מטר)
      description: סירות מתנפחות קטנות ודינג'ים מתחת ל-2.5 מטר עשויות להיות פטורות RCD חלקית אך עדיין דורשות CE סימון לפי הוראות אחרות ISO ותקני בנייה EN 6185.
      icon: tabler:sailboat
    - title: SUP לוחות ואביזרים
      description: לוחות משוט עמידים הם מחוץ RCD לתחום ההיקף. עם זאת, מכשירי ציפה אישיים (PFDs) נלווים דורשים CE סימון לפי תקנות PPE (EU) 2016/425 עם USCG אישור מסוג III/V כאשר רלוונטי.
      icon: tabler:swimming
    - title: סירות שהושלמו חלקית
      description: סירות שנמסרות ללא מנוע או התקנות ספציפיות דורשות הצהרת בונה עבור כלי שיט חלקיים, כאשר RCD ההתאמה המלאה מושלמת על ידי הקבלן או היבואן הסופי.
      icon: tabler:tool
content_trust_layers:
  tagline: מערכת אמון תלת-שכבתית
  title: מידע על עמידה בתקנות<br />— משותף ברמה הנכונה
  subtitle: לא כל נתוני הציות צריכים להיות באתר ציבורי. אנו עוקבים אחר גישה בשלוש שכבות המגנה על קניין רוחני תוך כדי בניית ביטחון אצל הרוכשים.
  items:
    - title: שכבה 1 — אתר ציבורי
      description: תקנים המוזכרים, דרכי עמידה מוסברות, סוגי מסמכים מופיעים, היקף האישורים לפי משפחת דגמים. אין תעודות בפועל, נתוני בדיקה או פרטי הנדסה קנייניים.
      icon: tabler:world
    - title: שכבה 2 — שיתוף לאחר בירור
      description: 'לאחר בדיקה מוסמכת: דוגמית DoC שהוסתרה, צילום לוח הבנאי, רשימת תקנים רלוונטיים, רשימת בדיקת עמידה ותקצירי אישורי חומרים — משותפים תחת תנאי שימוש הוגנים.'
      icon: tabler:mail
    - title: שכבה 3 — NDA / שלב ההזמנה
      description: קובץ טכני מלא, הערכות סיכונים, חישובי יציבות, דוחות בדיקה, רשומות אצוות חומר, ותיעוד מעקב ייצור — משותף רק תחת NDA עם רוכשים מאומתים.
      icon: tabler:lock
content_standards:
  tagline: תקנים חלים
  title: ISO ותקני EN<br />אנחנו בונים ל
  subtitle: המוצרים שלנו מעוצבים ונבדקים בהתאם לסטנדרטים המאוחדים תחת RCD. מספרי השטנדרטים ושמותיהם מצוינים; הטקסטים המלאים של הסטנדרטים נשארים תחת זכויות יוצרים של ISO.
  items:
    - title: EN ISO 6185-3
      description: 'סירות מתנפחות — חלק 3: סירות עם כוח מנוע מקסימלי של 15 קילוואט או יותר. דרישות בנייה, יציבות, ציפה והצלת אדם שנפל למים עבור RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'סירות מתנפחות — חלק 4: סירות עם כוח מנוע מקסימלי של 15 קילוואט וגדולות או שוות ל-4.5 קילוואט. דרישות נוספות למבנה וליציבות.'
      icon: tabler:file-text
    - title: ISO סדרה 12215
      description: סירות קטנות — בניית גוף הסירה ומידות החלקים. עיצוב מבני של הגוף, הסיפון והמחיצות לגופי סירה מפיברגלס ואלומיניום.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: סירות קטנות — מדריך לבעלים. תוכן ונוסח נדרשים למדריך הבעלים המצורף לכל סירה RIB המוסרת באיחוד האירופי.
      icon: tabler:book
    - title: EN ISO 14945
      description: כלי שיט קטן — לוח הבונה. מידע שיסומן על לוח הבונה המותקן לצמיתות על כל כלי שיט.
      icon: tabler:badge
    - title: ISO 8666
      description: סירות קטנות — נתונים עיקריים. מידות ופרמטרים סטנדרטיים למפרט עקבי בכל מסמכי המוצר.
      icon: tabler:dimensions
content_process:
  tagline: תהליך ציות
  title: ציות ב-6 צעדים CE<br />זרימת עבודה
  subtitle: מהיקף הפרויקט ועד לניתוב ברמת הסדרה — כל דגם RIB עוקב אחרי מסלול ציות מוגדר.
  steps:
    - number: '01'
      title: היקף וסיווג הפרויקט
      description: הגדירו את דגם RIB, קטגוריית העיצוב (A/B/C/D), מספר מקסימלי של אנשים, משקל נשיאה, הספק מנוע, ושוק יעד. קבעו אם RCD חל ואיזה מודול הערכת תאימות נדרש.
      timeline: 2–3 ימים
    - number: '02'
      title: זיהוי דרישות חלות
      description: זהו את כל דרישות הבטיחות החיוניות החלות מנספח I של RCD, התקנים המואחדים הרלוונטיים (EN ISO 6185, 12215, 10240, 14945), וכל דרישה לאומית נוספת עבור שוק היעד.
      timeline: 3–5 ימים
    - number: '03'
      title: תיעוד עיצובי וטכני
      description: 'צור את תיק טכני ראשי: שרטוטי סידור כללי, חישובי יציבות וציפה, הערכת סיכונים, מפרטי חומרים, וניתוח בטיחות מערכות (דלק, חשמל, היגוי).'
      timeline: 10–15 ימים
    - number: '04'
      title: אימות ובדיקת מוצר
      description: בצע בדיקה פיזית — בדיקות לחץ ב-1.25x לחץ מדורג למשך 24–48 שעות, בדיקות יציבות וציפה, בדיקות עומס, והפעלת מערכות. רשום את כל תוצאות הבדיקה לכל סירה.
      timeline: 5–7 ימים
    - number: '05'
      title: תיעוד סימון ואספקה
      description: הדבק את סימון CE, לוחית יצרן (EN ISO 14945), ומספר זיהוי סירה (HIN/CIN). הכין הצהרת תאימות של האיחוד האירופי, מדריך בעלים (EN ISO 10240), ורשימת בדיקת תאימות.
      timeline: 2–3 ימים
    - number: '06'
      title: עקיבות ברמת סדרה
      description: כל סירה מקבלת רשומת סירה ייחודית המקשרת אותה לתיק הטכני הראשי, אצוות ייצור, תעודות חומר, תוצאות בדיקות, ותצורה סופית. רשומות נשמרות למשך 10+ שנים לפי RCD.
      timeline: בת המשך
content_document_cards:
  tagline: סוגי מסמכים
  title: מסמך תאימות<br />כרטיסים
  subtitle: אלה סוגי המסמכים שאנו מכינים ושומרים עבור כל דגם CE מוסמך RIB. דוגמאות זמינות לבקשה מוסמכת.
  items:
    - title: תעודת תאימות CE / RCD
      description: תעודה ספציפית לדגם המאשרת שהכלי עומד בכל דרישות הבטיחות החיוניות החלות של RCD 2013/53/EU, מונפקת על ידי היצרן עם מעורבות גוף מוסמך במידת הצורך.
      icon: tabler:certificate
    - title: הצהרת תאימות של האיחוד האירופי (DoC)
      description: הצהרה חתומה על ידי היצרן או נציג מורשה, המפרטת את ההוראות, התקנים, מודול התאימות, ופרטי הגוף המוסמך. נדרשת עבור כל דגם המוצב בשוק האיחוד האירופי.
      icon: tabler:file-check
    - title: לוחית יצרן (EN ISO 14945)
      description: לוחית מוצמדת לצמיתות המציגה את מספר האנשים המקסימלי, הספק מנוע מקסימלי, קטגוריית העיצוב, וזיהוי היצרן. חייבת להישאר קריאה לכל אורך חיי הכלי.
      icon: tabler:badge
    - title: מדריך בעלים (EN ISO 10240)
      description: מדריך מקיף הכולל הפעלה בטוחה, צעדי חירום, לוחות תחזוקה, ואזהרות בטיחות. חובה עבור כל RIB שמסופק באיחוד האירופי.
      icon: tabler:book
    - title: דוחות בדיקה וביקורת ISO
      description: רשומות בדיקות לחץ (1.25x / 24–48 שעות), תוצאות בדיקות יציבות וציפה, תעודות בדיקות חומר, ודוחות בדיקות מימדיות — כולם מקושרים למספרי סירות ספציפיים.
      icon: tabler:test-pipe
    - title: רשומות מעקב חומרים
      description: מעקב ברמת אצווה עבור בד צינור, דבקים, פיברגלס וחומרה. מקשר כל יחידת ייצור לתעודות חומרים נכנסות ולתוצאות בדיקת IQC.
      icon: tabler:link
    - title: בדיקת איכות ורשומות בקרת איכות
      description: רשימת בדיקה של 100 נקודות לכל יחידה, רשומות בקרת איכות בתהליך, דוחות אי-התאמה ופעולות תיקון. חלק משרשרת המעקב אחר הייצור.
      icon: tabler:clipboard-check
    - title: חבילת מסמכי פרויקט
      description: חבילת תיעוד לכל גוף כולל רישום קונפיגורציה סופי, פרטי התקנת מנוע וציוד, רשימת בדיקה להפעלה ותיעוד מסירה.
      icon: tabler:package
content_design_categories:
  tagline: קטגוריות עיצוב RCD
  title: קטגוריית עיצוב A–D<br />— מה הם אומרים
  subtitle: התוכנית RCD מחלקת קטגוריות עיצוב המבוססות על עוצמת רוח מרבית וגובה גלים משמעותי שהכלי מתוכנן לעמוד בו.
  items:
    - title: קטגוריה A — אוקיינוס
      description: תוכנן להפלגות ממושכות שבהן עוצמת הרוח עלולה לעלות על בופורט 8 (>40 קשר) וגובה גל משמעותי עשוי לעלות על 4 מטר. דורש אימות מבני ויציבות קפדני ביותר.
      icon: tabler:ripple
    - title: קטגוריה ב' — ימי
      description: תוכנן להפלגות ימיות עם כוח רוח עד בופורט 8 (≤40 קשר) וגובה גלים משמעותי עד 4 מטר. מתאים למים חופיים וחצי-חשופים.
      icon: tabler:anchor
    - title: קטגוריה C — חוף פנימי
      description: תוכנן להפלגות חופיות עם עוצמת רוח עד בופורט 6 (≤27 קשר) וגובה גלים משמעותי עד 2 מטר. רוב הפעילויות הפנאי RIBs נופלות בקטגוריה זו.
      icon: tabler:sun
    - title: קטגוריה D — מוגן
      description: תוכנן למים מוגנים עם כוח רוח עד בופורט 4 (≤16 קשר) וגובה גלים משמעותי עד 0.3 מטר. אגמים, נהרות ונמלים מוגנים.
      icon: tabler:pool
content_hin:
  tagline: זיהוי כלי שיט
  title: לוחית HIN / CIN & בונה
  subtitle: כל RIB סירה דורשת מספר זיהוי גוף (HIN) או מספר זיהוי כלי שיט (CIN) ולוחית בונה לפי EN ISO 14945 RCD ודרישות.
  items:
    - title: מספר זיהוי גוף (HIN)
      description: קוד ייחודי בן 14 תווים המסומן קבוע בצד ימין של הטרנסום, קוד יצרן (MIC), שנת דגם, שנת ייצור ומספר סידורי. נדרש לכניסה לשוק האיחוד האירופי.
      icon: tabler:hash
    - title: מספר זיהוי כלי שיט (CIN)
      description: לפי EN ISO 10087, מספר זיהוי משני מוסתר ממוקם במקום מוסתר למטרות מניעת גניבה ומעקב.
      icon: tabler:eye-off
    - title: תוכן הלוחות של הבנאי
      description: מספר האנשים המקסימלי, הספק מנוע מקסימלי (קילוואט), עומס מקסימלי (ק"ג), קטגוריית עיצוב, שם יצרן CE וסימון — הכל מוצגים באופן קבוע על פלטת עמידה לקורוזיה.
      icon: tabler:badge
content_tech_file:
  tagline: מבנה הקובץ הטכני
  title: קובץ טכני ראשי<br />& האל רקורד
  subtitle: 'מערכת התיעוד שלנו פועלת לפי מבנה דו-שלבי: קובץ טכני ראשי לכל משפחת דגמים, ורשומות גוף נפרדות לכל סירה שיוצרה.'
  items:
    - title: קובץ טכני ראשי
      description: 'מכיל את כל תיעוד הציות למשפחת מודלים: סידור כללי, הערכת סיכונים, חישובי יציבות/ציפה, מפרט חומרים, תקנים רלוונטיים ורשומות הערכת התאמה. נשמר למשך 10+ שנים.'
      icon: tabler:folder
    - title: רשומת גוף הספינה (מעקב לפי סירה)
      description: 'לכל גוף יש רישום ייחודי המקשר אותו לקובץ הטכני הראשי: HIN, תאריך ייצור, אצווה של צינור, תעודות חומר, תוצאת בדיקת לחץ, תצורה סופית, התקנת מנוע ויעד מסירה.'
      icon: tabler:file-description
    - title: חבילת ציות ללקוחות
      description: חבילת אספקה לכל גוף הכוללת את DoC, תמונת לוח היצרן, מדריך הבעלים, סיכום הבדיקות ודף ההגדרה הסופי — מסופק עם כל RIB משלוח לאיחוד האירופי.
      icon: tabler:package
content_material_cert:
  tagline: הסמכת חומרים
  title: מעקב חומרים &<br />ראיות הסמכה
  subtitle: RIB סירות איכותיות מתחילות מחומרים מבוקרים ותהליכים מתועדים. להלן כיצד אנו מארגנים הסמכת חומרים לכל קבוצת רכיבים קריטיים.
  items:
    - title: מעקב אחר חומר צינור מתנפח
      description: PVC CSMHypalon ו-/ חומרי הצינור נבחרים לפי שימוש מיועד, תנאי אקלים ושוק יעד. נתונים טכניים של ספקים (TDS), מידע על אצווה של חומרים, מעקב אחר אצווה של הבד, UV ודוחות בדיקות סחיפה, REACHוהצהרות /SVHC זמינים במסגרת היקף התיעוד הסוכם של הפרויקט.
      icon: tabler:circle
    - title: מעקב אחר אלומיניום ימי
