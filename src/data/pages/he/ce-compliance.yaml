hero:
  tagline: CE RCD & ציות
  title: RIB CE עמידה בדרישות סירות<br />& תיעוד טכני
  subtitle: Paddle Board Overstock RIB סירות וכלי שיט מתנפחים מתוכננים ומתועדים לעמידה בשוק האיחוד האירופי לפי הנחיית כלי השיט לפנאי 2013/53/EU. מהערכת סיכונים ועד הצהרת התאמה, אנו מספקים תיעוד ציות ספציפי לדגם לכל גוף.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: RIB CE תיעוד ותעודת עמידה בסירה
direct_answer: Paddle Board Overstock מספק RCD תיעוד תאימות ספציפי לדגמים 2013/53/EU עבור RIB סירות וכלי שיט מתנפחים, כולל קבצים טכניים, הצהרות התאמה, לוחות בנייה ומדריכי בעלים — כולם תואמים לתקנים ISO EN 6185, ISO 12217 ולתקנים התואמים החלים.
