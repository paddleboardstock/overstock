faq:
  title: CE ציות — שאלות נפוצות
  questions:
    - q: האם כל Paddle Board Overstock RIB הסירות CE מאושרות לשוק האיחוד האירופי?
      a: RIB הסירות בקטלוג שלנו מתוכננות ומתועדות RCD לדרישות 2013/53/EU בהתאם להנחיות האיחוד האירופי החלות.CE הסימון חל על בסיס כל דגם ולכל תצורה. צרו איתנו קשר לקבלת מסמך תאימות ספציפי לדגם.
    - q: מה ההבדל בין RCD ציות CE לסימון?
      a: RCD (הנחיית מלאכת הפנאי 2013/53/EU) היא החקיקה של האיחוד האירופי שמגדירה דרישות בטיחות חיוניות.CE סימון הוא הסמל הוויזואלי המונח על מוצר שהוערך ואושר לעמוד בדרישות אלו. מוצר חייב לעמוד בדרישות RCD לפני שיוכל לשאת CE את הסימן.
    - q: האם אתם מספקים הצהרות התאמה לכל סירה?
      a: כן. כל סירה RIB שמסופקת לשוק האיחוד האירופי כוללת הצהרת ציות לאיחוד האירופי ספציפית לדגם, הכוללת את ההוראות החלות, התקנים המאוחדים, מודול הערכת הציות ופרטי הגוף המודיע.
    - q: איזה מודול הערכת ציות Paddle Board Overstock משתמש?
      a: המולוד תלוי בקטגוריית העיצוב ובסוג הסירה. רוב דגמי RIB בקטגוריית עיצוב C משתמשים במודול A (בקרת ייצור פנימית). עבור סירות בקטגוריית עיצוב A/B או תצורות ספציפיות, עשוי לחול מודול B+C או B+D עם מעורבות של גוף מודיע. אנו מייעצים לגבי המודול המתאים לכל פרויקט.
    - q: האם תוכלו לשתף מסמכי ציות לפני שנבצע הזמנה?
      a: לאחר בירור מוסמך, אנו משתפים מסמך תחום ציות שמפרט את התקנים החלים, מסלול הציות וסוגי המסמכים הזמינים לדגם שאתם מעריכים. קובצי המידע הטכניים המלאים משותפים ב-NDA לאחר אישור ההזמנה.
    - q: מהו מספר זיהוי גוף (HIN) והאם הוא כלול?
      a: ה-HIN הוא מזהה יחיד בן 14 תווים שמסומן לצמיתות על כל סירה, המקודד בקוד יצרן (MIC), סימול הדגם, שנת הייצור והממספר הסידורי. הוא חובה לכל סירות RIB המיועדות לשוק האיחוד האירופי ומופיע בכל Paddle Board Overstock RIB.
    - q: כמה זמן נשמרים קבצי המידע הטכניים?
      a: על פי דרישות RCD 2013/53/EU, היצרן חייב לשמור את קובץ המידע הטכני לפחות 10 שנים ממועד הצבת המוצר האחרון בשוק. Paddle Board Overstock שומרת את כל התיעוד הטכני המלא לכל הדגמים שיוצרו.
    - q: האם אתם מספקים סיוע בנוגע לחובות היבואן לפי RCD?
      a: 'כן. אנו מספקים את חבילת המסמכים שהיבואנים באיחוד האירופי צריכים כדי לקיים את חובתם: גישה לקובץ טכני, DoC, לוחית יצרן, מדריך בעלים ורשומות מעקב מוצר. חובות היבואן לפי RCD מתועדות בבירור במדריך הציות שלנו.'
