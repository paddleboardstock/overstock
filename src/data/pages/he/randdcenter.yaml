rd_services:
  tagline: מו"פ מותאם אישית
  title: שירותי מו"פ לשותפים
  services:
    - title: פיתוח חומר מותאם אישית
      desc: אנו מפתחים תרכובות בד מותאמות אישית, ערימות לוחות וחומרי דבק המותאמים לסביבת הפעולה וליעדי הביצועים שלכם.
    - title: OEM / ODM הנדסת מוצרים
      desc: מסקיצות קונספט לחבילות הנדסה מוכנות לייצור — הצוות שלנו יכול לתכנן, ליצור אב-טיפוס ולאמת סירות תחת המותג שלכם.
    - title: בדיקות והסמכה של צד שלישי
      desc: השתמשו במתקני הבדיקה שלנו התואמי ISO לבדיקת חומרים עצמאית, אימות מוצרים ותמיכה בהסמכה.
  cta: דונו בצרכי המו"פ שלכם →
