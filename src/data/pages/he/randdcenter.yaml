      desc: חידוש בחומרים, בעיצובים ובייצור למען ביצועי מוצר מעולים ואריכות ימים.
    - icon: design
      title: עיצוב ממוקד משתמש
      desc: הבנה עמוקה וחריגה של צרכי המשתמש באמצעות עיצוב מוצר ארגונומי ואינטואיטיבי.
    - icon: globe
      title: פרקטיקות ברות קיימא
      desc: צמצום טביעת הרגל הסביבתית שלנו על ידי שימוש בחומרים ותהליכים ידידותיים לסביבה.
    - icon: shield
      title: בטיחות ללא פשרות
      desc: הבטחת התקנים הבטיחותיים הגבוהים ביותר באמצעות בדיקות קפדניות ותיעוד הסמכה.
pillars:
  - title: התקדמות טכנולוגית
    desc: חלוצים בתחום חומרים חדשים, עיצובים ותהליכי ייצור כדי לספק ביצועי מוצר מעולים ועמידות לאורך זמן.
    icon: tech
  - title: חומרים מתקדמים
    desc: חקר של PVC, Hypalon, קומפוזיטים ואלטרנטיבות בר קיימא לשיפור תכונות המוצר.
    icon: materials
  - title: קיימות
    desc: 'מחויבות מרכזית: אנו מחויבים לניהול סביבתי באמצעות ייצור בר-קיימא וחומרים הניתנים למיחזור.'
    icon: sustainability
capabilities:
  tagline: יכולות
  title: יכולות מחקר ופיתוח
  subtitle: ארבע דיסציפלינות מרכזיות שמעניקות לנו שליטה מקצה לקצה על פיתוח המוצר — מתחום מחקר חומרי הגלם ועד לאישור הסופי.
  groups:
    - title: מדעי החומרים וטכנולוגיית הבד
      items:
        - ניתוח ואופטימיזציה של נוסחת PVC ו-Hypalon
        - UV ייצוב, עכירות אש, ופיתוח תוספי אנטי-מיקרוביאליים
        - הנדסת למינציה ודבקות של בדים מרובי שכבות
        - בדיקות הזדקנות מואצת (UV, תרמית, לחות, תרסיס מלח)
    - title: הנדסת גוף וסביבה הידרודינמית
      items:
        - עיצוב גוף תלת-ממדי פרמטרי ואופטימיזציית CFD
        - ניתוח אלמנטים סופיים עבור עומסים מבניים ועומסי התנגשות
        - בדיקות במיכל משיכה בקנה מידה ואימות ביצועים
        - פיתוח גוף מותאם לפרופילי משימות מיוחדים
    - title: טכנולוגיית ריתוך וחיבור
      items:
        - פיתוח ואופטימיזציה של תהליך ריתוך בדיאלקטרי RF
        - שיטות ריתוך באוויר חם, בסרח חם ובאולטרסוניק
        - חיבורי דבק והסמכת סרטי תפר
        - דוגמנות חוזק ריתוך וחיזוי אורך חיים
    - title: בדיקה, הסמכה ועמידה בתקנים
      items:
        - ניהול איכות ובדיקות תאימות CE
        - תמיכה בבדיקות והסמכה של צד שלישי עצמאי
        - פיתוח פרוטוקולי בדיקה מותאמים מיוחד לזכאות רכישה
        - ניתוח כישלון בשירות ובחינת השורש
