hero:
  tagline: מרכז מו"פ
  title: מרכז מו״פ
  subtitle: מוקדש להתקדמות
intro:
  - מרכז המחקר והפיתוח (R&D) של Aquafarer הוא הכוח המניע מאחורי המשימה שלנו לחולל מהפכה בציוד לספורט ימי. אנו מעצימים חובבי ספורט ימי ברחבי העולם עם מוצרים בטוחים יותר, נוחים יותר ומהנים יותר באמצעות חדשנות בלתי פוסקת בלוחות עמידים מתנפחים (SUPs) ובסירות. הצוות המוביל שלנו שמורכב ממהנדסים, מעצבים ומומחי ספורט ימי נלהבים מעצב את עתיד התעשייה, ומעלה באופן עקבי את הרף של איכות, ביצועים וקיימות.
  - מתקן המחקר והפיתוח שלנו מאחד תחת קורת גג אחת מדעני חומרים, אדריכלים ימיים ומהנדסי ייצור. מהכנת תערובות חומר ותכנון תא המטען ועד לפיתוח תהליכי ריתוך וניסויי ים בקנה מידה מלא, כל שלב בפיתוח המוצר מונחה על ידי נתונים ומאומת על ידי בדיקות.
mission:
  tagline: המשימה שלנו
  title: חדשנות בעתיד ספורטי המים
  pillars:
    - icon: lightning
