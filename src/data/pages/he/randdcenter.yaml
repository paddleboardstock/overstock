vision:
  tagline: החזון שלנו
  title: עיצוב עתיד ספורט המים
  body: Aquafarer שואפת להיות מובילה בתחום הסירות המתנפחות וSUP דרך חדשנות מתמשכת, איכות ללא פשרות ומחויבות איתנה לבטיחות וקיימות — בסופו של דבר העשרת חוויותיהם של חובבי ספורט מים ברחבי העולם. מרכז המחקר והפיתוח Aquafarer הוא המקום שבו התשוקה פוגשת את החדשנות, וקובע סטנדרטים חדשים לתעשיית ספורט המים.
labs_section:
  tagline: מעבדות
  title: המעבדות שלנו
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: מעבדת בד PVC
      description: מחקר ובדיקות מתמשכים של בדים לPVC ולHypalon לצינורות עבור חוזק מתיחה, עמידות לUV, עמידות לשחיקה וגמישות בטמפרטורות נמוכות כדי להבטיח אמינות לאורך זמן בסביבות ימיות.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: סטודיו להנדסת גופים
      description: תכנון מונחה CAD וניתוח אלמנטים סופיים של גופי HDPE, אלומיניום וציפוי סיבי זכוכית. כל גוף מדומה דיגיטלית לחלוקת עומסים ועמידות להלם לפני בניית האבטיפוס הראשון.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: מרכז ריתוך RF
      description: מתקן ריתוך בתדר רדיו ייעודי עם בקרת טמפרטורה ולחץ מדויקת, המפיק תפרים חזקים ואטומים העומדים בסטנדרטים של תעשיית הסירות המתנפחות.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: מיכל בדיקות הידרודינמי
      description: בדיקות דגם בקנה מידה קטן במיכל הבדיקות הפנימי שלנו למיטוב צורת הגוף, ביצועי מרק, יציבות ויעילות דלק במגוון תנאי עומס וים.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: סדנת אבטיפוס
      description: מתקן אבטיפוס מלא והתקנת ציוד שבו נבנים, מותקנים ומבצעים ניסויי ים לדגמים חדשים. כל אבטיפוס עובר תוכנית בדיקה במים של מינימום 20 שעות לפני אישור ייצור.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: מעבדת איכות וביקורת
      description: מעבדה ייעודית להבטחת איכות המבצעת בדיקות מתיחה, מחזורי שמירת אוויר, בדיקות קרע תפרים ותעודות חומר כדי להבטיח שכל סירה היוצאת מהסדנה עומדת במפרטים שפורסמו.
      href: /randdcenter/quality-inspection-lab
