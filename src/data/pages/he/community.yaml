stories:
  tagline: סיפורי מגלים
  title: הרפתקאות אמיתיות מאנשים אמיתיים
  subtitle: שמעו מכותבים, משפחות ומקצוענים שמשתמשים בציוד Aquafarer במים.
  items:
    - name: שרה ומייק
      title: SUP בעלי Explorer 11, קנדה
      content: לקחנו את Explorer 11 שלנו לטיול בן שבוע דרך פארק אלגונקוין. הם התמודדו יפה עם מעבר תעלות וחציית אגמים. הבנייה drop-stitch משמעותה שיכלנו לנפח ל-15 PSI ולקבל ביצועים של לוח קשיח מלוח שניתן לאריזה.
      image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
      location: פארק אלגונקווין, קנדה
    - name: קרלוס ר.
      title: רוכב צ'יטה סורג', ספרד
      content: הצ'יטה סרז' הוא הבחירה שלי להפלגות לאורך החוף. העיצוב התוסס מושך תשומת לב על החוף, והיציבות נותנת לי ביטחון בגלים קלים. היא מתמודדת בצורה נהדרת בין אם אני טיול ובין אם אני פשוט נהנה מהשקיעה.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
      location: קוסטה בראבה, ספרד
    - name: לינה והמשפחה
      title: חוֹפְשֵׁי הַלּוֹטוּס הזורמים, שוודיה
      content: הרפתקאות משפחתיות בסוף השבוע בארכיפלג. הלוטוס הזורם יציב מספיק כדי שהבת שלי תוכל לעמוד עליו בזמן שאני מחתיר. מתנפח בתוך פחות מ-10 דקות — לא נדרש צTrailer, רק כיף משפחתי טהור על המים.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-flowing-lotus-1.webp
      location: ארכיפלג סטוקהולם, שבדיה
    - name: סגן מפקד אנדרס
      title: חוקר אוקיינוס וויאגר, פיליפינים
      content: אני משתמש ב-Ocean Voyager שלי לסיורים ארוכי טווח לאורך החופים של פאלאוואן. אחרי חודשי שימוש יומי במזג אוויר טרופי, הלוח עדיין מתפקד כמו חדש. הצורה שלו לחקר חופים חותכת דרך הגלים שיעצרו לוחות פחות טובים.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      location: פַּלָאוּאן, הפיליפינים
    - name: אמה ט.
      title: טראשופ בריז למתחילים, אוסטרליה
      content: מעולם לא הייתי על SUP קודם. הטרופיקל בריז כל כך יציב שחשתי בטוח בניסיון הראשון שלי. עכשיו אני משוט כל סוף שבוע. עקומת הלמידה כמעט אפסית — והסאפ נראה מדהים על המים.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-tropical-breeze-1.webp
      location: גולד קוסט, אוסטרליה
