testimonial:
  content: שכרתי 5 לוחות מחנות מקומית ואיבדתי 60% מההכנסות שלי להם. Paddle Board Overstock עזר לי לבנות צי משלי של 15 SUPs. מחשבון ה-ROI שהם סיפקו הראה שאשיג שוויון לאחר 4 חודשים — בפועל זה לקח 3. עכשיו אני מרחיב ל-30 לוחות ומוסיף קיאקים.
  name: דניאל אוקונקו
  title: בעלים, השכרות Lakeland SUP — אונטריו, קנדה
content_segments:
  tagline: פרופילים להשכרה
  title: פתרונות להשכרת ספורטי מים<br />לפי סוג מפעיל
  subtitle: לפעולות השכרה שונות יש צרכים שונים — מהשכרות קטנות ליד החוף של SUP ועד למרכזי ספורט מים בקנה מידה גדול למקלטי נופש. אנו מתאימים את חבילות הציוד שלנו ואת מודל התמיכה בהתאם.
  items:
    - title: חוף והשכרות ליד האגם SUP
      subtitle: פעולות בהיקף גבוה ובמורכבות נמוכה
      description: מפעילים שמשכירים לוחות פדלים עמידים וקיאקים ישירות למתרחצים בחוף ומבקרי האגם. העדיפות שלך היא למזער את זמן ההפעלה בין השכרות, לשמור על ציוד במחזור, ולנהל שיאי ביקוש עונתיים עם שטח אחסון קטן.
      features:
        - צי צפים מתנפחים SUP שניתן לקפל שטוחים — אין צורך במזח או במעקב
        - דירוג מסחרי PVC המיועד ל-100+ מחזורי השכרה לעונה
        - בד יבש-מהיר, עמיד ל-UV למוכנות להשכרה מחדש באותו יום
        - טווחי לוחות עם קוד צבע לזיהוי מהיר של צי
    - title: מרכזי ספורט מים באתרי נופש ומלונות
      subtitle: חויית אורח והתאמה למותג
      description: בתי נופש ובתי מלון המציעים ספורט ימי כהטבה באתר. הציוד צריך להיראות פרימיום, לפעול באופן אמין עבור אורחים مبت מיומנים למתחילים בינוניים, ולהשתלב עם תהליכי הזמנת פעילות וחיוב קיימים בבית הנופש.
      features:
        - לוחות ושוחות חיים ממותגים בהתאמה אישית בצבעי המלון
        - 'צי משולב: SUPs, קיאקים, סירות פדלים וסירות קטנות RIB'
        - פתרונות משאבות חשמליות שקטות וללא דלק לניפוח על החוף
        - כולל הדרכת צוות והכנסת הציוד לתחזוקה
    - title: מפעילי השכרת סירות ו-RIB
      subtitle: צי סירות להשכרה מסחרי
      description: מפעילים המציעים להשכרה כלי שיט ממונעים — סירות RIB, סירות מתנפחות וסירות קטנות — לפי שעה או חצי יום. הצי שלך חייב לעמוד בתקנות בטיחות ימיות, לעמוד בשימוש כבד על ידי אורחים, ולהפחית זמני השבתה מכאניים בין השכרות.
      features:
        - חבילות RIB עם 30–90 HP שרטונים מוכנים לחיבור למנוע חיצוני
        - לוחות רצפה מפנל עץ ימי לשמירה על יציבות מבנית ארוכת טווח
        - מערכות שסתום לשיגור מהיר לחילוף מהיר
        - ערכת חלפים + תמיכה טכנית לפי SLA לפי קריאה
    - title: מפעילי סיורים והרפתקאות
      subtitle: צי רכבי סיורים מודרכנים
      description: מפעילים המציעים סיורי ספורט מים מודרכים — ספארי SUP, קיאקים במערות, סיורי שנורקלינג או סיורי קפיצה בין איים RIB. הציוד חייב להיות יציב דיו עבור אורחים מתחילים, קל לניקוי בין קבוצות ועמיד לשימוש יומיומי מודרך בתנאי מים שונים.
      features:
        - פלטפורמות יציבות במיוחד SUP (רוחב 32"+) לרוכבים בפעם הראשונה
        - אפשרויות קיאק טנדם למבני סיור זוגי/קבוצתי
        - קיבולת מובנית לאחסון ציוד שנורקלינג, תיקי יבש ומקררים
        - תיעוד תאימות CE + USCG לפעילות מסחרית
