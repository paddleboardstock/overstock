hero:
  tagline: פתרונות עסקיים להשכרה
  title: בנה עסק רווחי לספורטי מים<br />עסק השכרת עם Paddle Board Overstock
  subtitle: חבילות ציוד השכרה מלאות עבור SUP מועדונים, אתרי נופש חופיים, מפעילים של אגמים ומרכזי ספורט ימי — החל מבחירת הציוד ועד לניהול הצי והעברת תמיכה תחזוקתית.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-paddle-girls-team.webp
    alt: ציוד השכרה לספורט ימי של Paddle Board Overstock בפעולה
direct_answer: Paddle Board Overstock מספק פתרונות עסקיים למתן השכרות מקצה לקצה למפעילי ספורט ימי. מצי SUP ידידותי למתחילים ועד השכרות RIB בקנה מידה מסחרי, אנו עוזרים לכם לבחור את הציוד הנכון, לייעל את גודל הצי עבור מיקומכם, למזער זמני תחזוקה ולהגדיל את ההכנסה לכל השכרה. המוצרים המוכחים שלנו להשכרה מתאפיינים בבנייה PVC ברמת מסחרית, יכולות תיקון קלות ועיצובים מתנפחים שמבטלים את עלויות האחסון. בין אם אתם משיקים פעולה השכרה חדשה או משדרגים צי קיים, Paddle Board Overstock מספקת את הציוד והמומחיות לבניית עסק השכרות ספורט ימי רווחי.
solution_offerings:
  - title: ערכת התחלה לצי
    subtitle: לצורך ניסוי פעולות השכירות החדשות בשוק
    badge: Popular
    features:
      - title: הערכת צי
        description: ניתוח מומחה של המיקום שלך, דמוגרפיית האורחים ומטרות ההכנסות כדי לקבוע את גודל הצי שלך
      - title: ציוד התחלתי
        description: 10 לוחות SUP עם משוטים, משאבות, אפודי הצלה וערכת תיקון — כל מה שצריך כדי לצאת לדרך
      - title: פתרונות אחסון
        description: ציוד מתקפל לניפוח נשטף — אין צורך במתקן סירה או במכונית נגררת לאחסון
      - title: ציות לבטיחות
        description: כל הציוד CE מוסמך בבנייה ברמת מסחר לשימוש יומי בהשכרה
      - title: שיווק למתחילים
        description: נכסי צילום ממותגים ותבניות תפריט להשכרה שיעזרו לך להשיק את השירות שלך
    cta_text: התחל צי רכב להשכרה
    cta_href: /contact
  - title: ערכת הרחבת צי
    subtitle: להזנת פעילויות גידול על ידי הוספת קיבולת ומגוון
    badge: Premium
    features:
      - title: עיצוב צי מעורב
        description: שילוב של SUPs, קיאקים, סירות מתנפחות ו-RIBs כדי לשרת העדפות אורחים מגוונות
      - title: תמחור לפי נפח
        description: תמחור סיטונאי מדורג לציי של 20+ יחידות עם תעריפי לוגיסטיקה מועדפים
      - title: מיתוג מותאם
        description: הדפסת לוגו על ציוד, מצופים ממותגים ואפשרויות צבע מותאמות אישית לצי השכרתכם
      - title: תוכנית תחזוקה
        description: ערכת חלקי חילוף, הדרכת תיקונים לצוות וגישה ישירה לתמיכה טכנית
      - title: מִטּוּז הַכְּנָסָה
        description: המלצות מונחות נתונים על תמחור, סיבוב ציוד, והתאמות עונתיות של הצי
    cta_text: להרחיב את הצי שלי
    cta_href: /contact
