section_faq:
  title: שאלות נפוצות טכניות
  questions:
    - q: כיצד drop-stitch משתווה לבנייה קשה-קונבנציונלית?
      a: ליבות מודרניות drop-stitch ב-20 PSI משיגות 85–90% מקשיחות הליבה של קצף EPS/פיברגלס כקשיח, תוך שהן ניתנות להוצאת אוויר מלאה להשנאה ולטיפול. הפשרה היא משקל מעט גבוה יותר וקושי סופי נמוך יותר — אך ברוב השימושים הפנאי והמסחריים, ההבדל זניח.
    - q: איזו צפיפות חוט נחשבת לאיכות פרימיום?
      a: בדים drop-stitch פרימיום משתמשים ב-2 חוטים לכל אינץ מרובע (כ-3,100 חוטים למ"ר) ארוגים מחוט פוליאסטר 1,680 DTEX. בדים בסיסיים משתמשים ב-1 חוט לכל אינץ מרובע עם חוט 1,100 DTEX.
    - q: האם ניתן לרתך את Hypalon כמו PVC?
      a: לא. Hypalon/CSM אינם ניתנים לריתוך RF. הם חייבים להיות מורכבים באמצעות דבק מגע שמופעל ביד, מה שהופך את הייצור לעבודה מאומצת יותר ותפירות תלויות במיומנות המפעיל. PVC ניתן לרתך ב-RF או בריתוך אוויר חם לאיכות תפירה עקבית וממוכנת.
    - q: מה הלחץ המרבי הבטוח לסירות מתנפחות?
      a: צינורות סירות מתנפחות סטנדרטיות פועלים בלחץ של 8–12 PSI. רצפות Drop-stitch פועלות בלחץ של 12–20 PSI. ליבות drop-stitch בלחץ גבוה (SUPs) יכולות לפעול בלחץ של 20–25 PSI. כל מוצר כולל שסתומי לחץ מכוילים למניעת נפח יתר.
    - q: כמה זמן לוקח לייצר סירה מתנפחת מותאמת אישית?
      a: ייצור סטנדרטי OEM נמשך 30–45 יום מאישור ההזמנה עד FOB צ'ינגדאו. פיתוח תבנית מותאמת מוסיף 15–20 יום לייצור אב-טיפוס ובדיקות.
