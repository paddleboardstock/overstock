hero:
  tagline: ספר לבן הנדסי
  title: Drop-Stitch טכנולוגיה ומדעי החומרים:<br />ההנדסה מאחורי כלי שיט מתנפחים מודרניים
  subtitle: מדריך טכני סמכותי המכסה drop-stitch בניה ליבתית, PVC מול Hypalon השוואת חומרים, בדיקות קשיחות מכלי לחץ גבוה, וסטנדרטים לייצור כלי שיט.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-design-discussion-lab.webp
    alt: Paddle Board Overstock מעבדת מחקר ופיתוח — בדיקות חומרים והנדסה
direct_answer: Drop-stitch הטכנולוגיה משתמשת באלפי חוטי פוליאסטר פנימיים שמחברים את שכבות הבד העליונות והתחתונות של ליבת הניפוח. כאשר היא מנופחת ל-15–20 PSI, החוטים הללו פועלים כחברי מתיחה, מונעים התנפחות ויוצרים מבנה קשיח המComparable לבנייה קשיחה קשיחה. ביחד עם ציפויי בד PVC או Hypalon מתקדמים וצימוד אלקטרומגנטי (RF welding), זה מאפשר כלי שיט מתנפחים ניידים ובעלי ביצועים גבוהים, המתאימים לשימוש מקצועי, מסחרי ופנאי.
section_drop_stitch:
  title: Drop-Stitch הנדסת מבנה
  subtitle: כיצד אלפי חוטים הופכים בד גמיש למבנה קשיח
  content: |
    Drop-stitch (המוכר גם כ"drop-stitch בד" או "drop-stitch ליבה") מייצג פריצת דרך בהנדסת מבנים מתנפחים. העיקרון פשוט לכאורה: אלפי חוטי פוליאסטר נפרדים נשזרים בו זמנית לשתי שכבות בד בסיסיות, ומחברים את הפאנלים העליונים והתחתונים בזווית של 90 מעלות.

    כאשר תא האוויר הסגור נמצא בלחץ, לחץ האוויר הפנימי מפעיל כוח באופן שווה בכל הכיוונים — מנסה להרחיק את הפאנלים העליונים והתחתונים לצורת צילינדר. אלפי החוטים drop-stitch מתנגדים להפרדה זו, מעבירים את העומס למתיחות לאורך ציר החוט. התוצאה היא פאנל שטוח וקשיח שיכול לעמוד בלחץ פנימי של 15–20 PSI.

    ב-20 PSI, פאנל drop-stitch בגודל 1 מ"ר חווה כ-14,000 ק"ג של כוח פנימי כולל — והמערכת החוטית שומרת עליו שטוח לגמרי. זה נותן למבני drop-stitch יחס חוזק-למשקל המתחרה בחומרים קשיחים מסורתיים.
