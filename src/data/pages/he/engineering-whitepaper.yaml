section_testing:
  title: פרוטוקולי בדיקה ובטיחות
  subtitle: מסגרת הבטחת האיכות של Paddle Board Overstock לכל אצוות הייצור
  protocols:
    - title: בדיקת החזקת לחץ מדורג ×1.25
      description: כל כלי מורכב מנפח למילוי עד 1.25 מן הלחץ התפעולי המדורג ומוחזק למשך 24–48 שעות. כל ירידת לחץ העולה על 2% מפעילה דחייה ועיבוד מחדש.
      standard: ISO 6185
    - title: בדיקת חוזק קרעי בתפר
      description: דגימות תפרי הלחמה ודבק מכל אצוות הייצור נבדקות לעמידות לקריעה באמצעות ציוד מיתח מכויל. נדרש לפחות 4 kN/m עמידות לקריעה.
      standard: ISO 2411
    - title: בדיקת ממתח בד חומר
      description: גלילי הבד הנכנסים עוברים בדיקה של חוזק מתיחה ועקמומיות בכיווני חוט וחוזק. סף דחייה מתחת ל-3,000 N/5 ס"מ עבור PVC.
      standard: ISO 1421
    - title: UV מזג אוויר מואץ
      description: דגימות חומר נחשפות ל-1,000+ שעות של UV מואץ במבחנות QUV. מותר אובדן חוזק מתיחה מקסימלי של 15%.
      standard: ASTM G154
    - title: שלמות שסתומים וחיבורים
      description: כל הרכבת שסתום נבדקת לשלמות הסגירה בלחץ מדורג ×1.25. שסתומי החזרה נבדקים לביצועי סגירה חד-כיוונית.
      standard: ISO 12402
