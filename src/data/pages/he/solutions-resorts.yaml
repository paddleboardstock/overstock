testimonial:
  content: Paddle Board Overstock תכנן וצייד את כל תוכנית הפעילויות החופיות שלנו בשלושה נכסי נופש. 80 SUPs, 40 קיאקים, תשתיות בטיחות והכשרת צוות — כל זה מסופק במשלוח אחד. ההשתתפות של האורחים בפעילויות מים עלתה ב-60% בעונה הראשונה.
  name: סופי לורן
  title: מנהלת חוויית האורח, Azure Bay Resorts — פוקט, תאילנד
content_segments:
  tagline: פרופילי נופש
  title: פתרונות אירוח על חוף המים<br />לפי סוג נכס
  subtitle: לכל נכס נופש יש פרופיל אורח ייחודי, שילוב פעילויות וקצב תפעול — ממלונות אקולוגיים בוטיקיים ועד נכסי נופש יוקרתיים גדולים לאורך החוף. אנו מעצבים תוכניות ספורט מים שמתאימות לרמת הנכס ולציפיות האורחים.
  items:
    - title: נופשיים יוקרתיים על חוף הים
      subtitle: העברות VIP, פעילויות מים, חוויית אורח פרימיום
      description: נכסים יוקרתיים על חוף הים — Four Seasons, Aman וקבוצות יוקרה דומות — שבהם ספורט מים הוא אטרקציה מרכזית לאורחים המשפרת את ציון השביעות רצון ומייצרת הכנסה משנית. הצי חייב להיראות פרימיום, להציע מגוון לגילים ורמות כושר שונות, ולהשתלב בצורה חלקה עם מערכות הקונסיירז' וההזמנות הקיימות של הנכס. ציפיות ההופעה של האורחים גבוהות מאוד — מצב הצי וההצגה שלו משפיעים ישירות על חוות דעת של 5 כוכבים.
      features:
        - 'צי פרימיום ממותג: SUPs, קיאקים, סירות פדל וסירות נוסעים קטנות RIB'
        - 'הצגת מוכנות לאורח: צבעי הנכס תואמים, מיתוג לוגו, הצגת הצי בצורה מסודרת'
        - סירות קטנות יוקרתיות RIB להעברות VIP עם ריפוד מותאם ותאום צבעים
        - 'תשתיות בטיחות משולבות: קווי הצלה, תחנות מצילים, מכשירי AED'
        - 'ניהול הכנסות: תבניות תמחור דינמיות, הכשרת מכירה נוספת, חבילות משולבות'
    - title: נופשיים באיים פרטיים
      subtitle: הסעת אורחים לכל מזג אוויר — אפס זמן השבתה, אמינות מוחלטת
      description: אתרי נופש פרטיים באיים פועלים במקומות מרוחקים שבהם הסירה היא החיבור היחיד ליבשת. העברות יומיות של אורחים, משלוחי אספקה ופינוי רפואי חירום תלויים בכלי שיט אחד — כל זמן השבתה משפיע ישירות על חוויית האורחים ועל פעילות אתר הנופש. מפעילים אלה זקוקים לסירה שפועלת באופן אמין בכל תנאי מזג אוויר, דורשת תחזוקה מינימלית, ומערכות גיבוי לאמינות קריטית למשימה. הסירה צריכה גם להציג בצורה יפה כאשר האורחים מגיעים לאי.
      features:
        - תצורה לכל מזג אוויר RIB עם מארז מלא למזג אוויר וצינורות כבדים
        - אפשרות למנוע דו-מנועי או מנוע גיבוי להפעלה ללא הפסקת זמן
        - בנייה בדרגה מסחרית Hypalon למשך 5-8 שנים בשירות מרחוק
        - עיצוב נוח לתחזוקה עם רכיבים נגישים לשירות באתר
        - מיתוג אתרי נופש מותאם אישית וריפוד פרימיום תואם את האסתטיקה של האי
    - title: ריזורטס ליד האגם ואקו
      subtitle: חוויות אורח משולבות בטבע
      description: נכסים על שפת האגם, לודג'ים אקולוגיים ומקומות נופש טבעיים מציעים פעילויות מים שקטות ודלות השפעה שמשלימות את הסביבה הטבעית. הציוד צריך להיות ללא ממונע ככל האפשר, קל לאחסן בבתי סירות עם שטח מוגבל, ושקט בשימוש כדי לשמור על חוויית הסביבה לכל האורחים.
      features:
        - 'צי לא ממונע: SUPs, קיאקים, קאנו וסירות חתירה'
        - תחנות נפוח משאבות חשמליות שקטות לשימוש אורחים לפי דרישה
        - חומרים ואריזות ידידותיים לסביבה התואמים את מיתוג הקיימות
        - מתקני אחסון ומערכות ארגון בתי סירות כללו
    - title: מועדוני חוף
      subtitle: העברות אורחים, בידור, מותרות RIBsקטנות
      description: מועדוני חוף מפעילים סביבה אנרגטית וממוקדת ויזואלית, שבה ציוד הוא חלק מהאווירה. הם זקוקים למותרות קטנות RIBs להעברת אורחים ממלונות או רציפים סמוכים, וצעצועי מים לבידור האורחים — גרירת אופנוע ים, מגלשות מתנפחות וגלשני משוטים. הצי חייב להיראות אלגנטי, קל לתפעול ולעמוד בשימוש יומיומי של אורחים עם רמות מיומנות משתנות. אחסון ופריסה מהירה הם קריטיים בשעות השיא.
      features:
        - יוקרה קומפקטית RIB (3.3-4.3 מ') להעברת אורחים ושירות מכרזים
        - 'צעצועי מים: מתנפחים נגררים, SUP קרשים, קיאקים לבידור האורחים'
        - צבע ומיתוג מותאמים אישית לזהות הוויזואלית של מועדון החוף
        - מערכות שיגור ושליפה מהירים לתפעול עם תחלופה גבוהה
        - Hypalon מבנה עמיד לחשיפה יומית למי מלח ו UV
    - title: מועדוני חברים פרטיים ומועדוני יאכטות
      subtitle: תחבורה בנמל, מכרזים לחברים, ספורט ימי בלעדי
      description: מועדונים פרטיים שבהם ספורט ימי והובלת סירות הם יתרון לחברים ולא למכנס. הציוד חייב לעמוד בסטנדרטים אסתטיים גבוהים יותר, להיות זמין לפי דרישה לחברים, ולדרוש פיקוח מינימלי של הצוות. מועדוני יאכטות מרינה זקוקים במיוחד לספינות תמיכה להובלת נמל — העברת חברים בין רציף, עגינה וחוף. אחסון ותחזוקה צריכים להיות בלתי נראים לחברים.
      features:
        - RIB אוניות שירות יוקרתיות להובלת נמל והעברת חברים
        - 'ציוד פרימיום: EVA דקים, צבעים מותאמים אישית, ריפוד ממותג'
        - מערכת צ'אאוט בשירות עצמי לגישה לחברים ללא צוות
        - אחסון מחוץ לעונה ותוכנית רענון שנתית
    - title: מלונות המתמקדים בהרפתקאות ופעילות
      subtitle: סיורים מודרכים, SUP יוגה, טיולי שנורקלינג, פעילויות קבוצתיות
      description: נכסים הממקמים את עצמם כיעדי הרפתקה — מציעים סיורים מודרכים, SUP יוגה, פדלים בשקיעה, טיולי שנורקלינג, ופעילויות קבוצתיות. הצי צריך לתמוך גם במודלים של השכרה חופשית וגם בתוכניות מודרכות, עם ציוד שמעברו בין שימוש עצמי של האורח לבין סיורים מודרכים נעשה בצורה חלקה. נכסים אלו צריכים ציוד עמיד לתדירות גבוהה של משתמשים, עם ניקוי קל בין קבוצות האורחים.
      features:
        - צי משולב ורב-שימושי התומך במודלים של השכרה + סיורים מודרכים
        - קאייקים זוגיים ופלטפורמות SUP יציבות במיוחד לפעילויות קבוצתיות
        - 'צי מדריכים: לוחות מדריכה, קופסאות יבשות, אמצעי תקשורת עמידי למים'
        - 'סבב צי עונתי: צי קיץ → תוכנית אחסון חורף'
        - בנייה עמידה המיועדת לשימוש יומיומי של אורחים עם תחזוקה מינימלית
