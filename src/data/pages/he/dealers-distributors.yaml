hero:
  tagline: תוכנית סוכנויות
  title: הפוך ל-Aquafarer<br />מפיץ
  subtitle: שיתוף פעולה עם יצרן RIB ומתקנים מתנפחים מיוצרים המוסמך CE ומשרת ב-50+ מדינות. הגנת טריטוריה, תמיכה שיווקית, ותמחור תחרותי עבור מפיצי ימיה מבוססים.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer תוכנית סוכנויות ומפיצים
direct_answer: Aquafarer מציעה שותפויות סוכנות והפצה עם הגנת טריטוריה, תמחור סיטונאי תחרותי, ערכות תמיכה שיווקית, ותיעוד התאמה מלא (CE, ISO 9001, BSCI). MOQ מתחיל מ-10-20 יחידות להזמנה עם ניהול חשבון ייעודי.
stats:
  - value: 50+
    label: מדינות ששירתו
    detail: רשת הפצה עולמית
  - value: 64
    label: CE-דגמים מוסמכים
    detail: RIB, מתנפח, SUP, בטיחות
  - value: 30-45
    label: זמן אספקה של יום
    detail: FOB צ'ינגדאו
  - value: 10-20
    label: מפיץ MOQ
    detail: לכל הזמנה, דגמים מעורבים
content_benefits:
  tagline: יתרונות שותפות
  title: למה מפיצים<br />בחר Aquafarer
  subtitle: שותפות שנועדה למפיצי ימיה שזקוקים לאספקה אמינה, מרווחים תחרותיים, ותמיכה מקצועית.
  items:
    - title: הגנת טריטוריה
      description: זכויות טריטוריאליות בלעדיות או חצי-בלעדיות למפיצים מוסמכים. מיפוי שוק וניהול קונפליקטים בערוצי הפצה כדי להגן על ההשקעה שלך בבניית מותג Aquafarer באזור שלך.
      icon: tabler:map-pin
    - title: תמחור סיטונאי תחרותי
      description: תמחור היררכי מבוסס על התחייבויות למכירות שנתיות. מבנה תמחור שמגן על מרווח עם ערבויות מחיר מראש וניתוח עלויות שקוף (מבוסס על FOB צ'ינגדאו).
      icon: tabler:currency-dollar
    - title: ערכת תמיכה שיווקית
      description: צילום מוצרים מקצועי, גיליונות מפרטים, תבניות תיעוד התאמה, תוכן לרשתות חברתיות, וחומרים שיווקיים ממותגים משותפים. מתעדכן מדי שנה עם השקות מוצרים חדשות.
      icon: tabler:photo
    - title: הדרכה טכנית
      description: הדרכת מוצר לצוות המכירות שלך (וירטואלית או באתר), הדרכת תחזוקה ותיקון לטכנאים שלך, ומדריכי שאלות נפוצות ופתרון בעיות ללקוחות.
      icon: tabler:school
    - title: חלקי חילוף ושירות לאחר מכירה
      description: אספקת חלקי חילוף ייעודית עם משלוח מועדף. חלקי צינור, שסתומים, סנפירים, וערכת תיקון זמינים למימוש מהיר של הזמנות. תמיכה בתהליך טיפול בתביעות אחריות.
      icon: tabler:tool
    - title: תיעוד תאימות
      description: 'חבילת תיעוד התאמה מלאה לשוק שלך: DoC CE, נתוני לוח בנאי, מדריכי בעלים, ותמיכה ברישום רגולטורי. מפחיתה את הנטל שלך בתאימות.'
      icon: tabler:file-certificate
content_requirements:
  tagline: מה שאנחנו מחפשים
  title: מפיץ<br />דרישות
  subtitle: אנו מחפשים שותפים שיכולים לייצג ולתמוך במוצרי Aquafarer באופן מקצועי באזור שלהם.
  items:
    - title: ידע בשוק ובטריטוריה
      description: נוכחות מבוססת בשוק ימי, ספורט ימי או פנאי חוץ. הבנה של רגולציות מקומיות, העדפות צרכנים, וערוצי הפצה למוצרי כלי שיט.
      icon: tabler:target
    - title: ניסיון בתעשייה
      description: לפחות שנתיים ניסיון בהפצת ציוד ימי, לצורכי חוץ או ציוד ספורט. היסטוריית הצלחה מוכחת עם מותגים בינלאומיים ופעילות סיטונאית של B2B.
      icon: tabler:briefcase
    - title: משרד תצוגה או מחסן
      description: מתקנים פיזיים להצגת מוצרים, אחסון מלאי ומתן שירות ללקוחות. יכולת לשמור על יחידות הדגמה ומלאי חלקי חילוף עבור הטריטוריה שלך.
      icon: tabler:building-store
    - title: מחויבות לסטנדרטים של המותג
      description: נכונות לשמור על סטנדרטים של הצגת המותג Aquafarer, לספק תמיכה ללקוחות לפי פרוטוקולי השירות שלנו, ולהשתתף בעדכוני הכשרה שנתיים למוצרים.
      icon: tabler:star
content_process:
  tagline: תהליך הגשת הבקשה
  title: 4 שלבים למפיץ<br />תהליך הגשת הבקשה
  subtitle: מהפניה הראשונית ועד המשלוח הראשון — תהליך כניסה ברור ופשוט.
  steps:
    - number: '01'
      title: פנייה ראשונית והסמכה
      description: הגש את בקשת המפיץ עם פרטי החברה, טריטוריה מעניינת, קווי מוצר נוכחיים והערכת כמות שנתית. אנו בוחנים את הבקשה תוך 5 ימי עסקים.
      timeline: 5 ימים
    - number: '02'
      title: סקירת עסק ותנאים
      description: פגישה וירטואלית לדון באסטרטגיית הטריטוריה, רמות מחירים ותנאי שותפות. סקירת דרישות מסמכי תאימות לשוק שלך. חתימה על NDA במידת הצורך.
      timeline: 1-2 שבועות
    - number: '03'
      title: הזמנת דוגמיות והערכה
      description: בצע הזמנת דוגמיות ראשונית (2-5 יחידות) במחירי מפיץ להערכת השוק והכשרת הצוות. כולל מסמכי תאימות מלאים והכנת הדגמה.
      timeline: 30-45 ימים
    - number: '04'
      title: השקת שותפות ותמיכה
      description: הזמנה ראשונה למכולה עם הגנת טריטוריה פעילה. ערכת שיווק מסופקת, צוות המכירות מוקדש להכשרה, ומנהל חשבון ייעודי מוקצה. סקירות עסקיות רבעוניות מתמשכות.
      timeline: בת המשך
content_application_docs:
  tagline: מסמכי הגשה
  title: מסמכים נדרשים<br />להגשת בקשה למפיץ
  subtitle: כדי להגיש בקשה למפיץ Aquafarer, אנא הכין את המסמכים והמידע הבאים לצוות הסקירה שלנו.
  items:
    - title: תעודת רישום עסק
      description: מסמך רישום חברה תקף המציג את שם הישות החוקית, כתובת רשומה והיקף העסק המכסה הפצת ציוד ימי, ספורט או חוץ.
      icon: tabler:file-text
    - title: תוכנית כיסוי הטריטוריה
      description: שטח גאוגרפי מעניין, רשת קמעונאות או הפצה קיימת, מגזרי לקוחות יעד, ונפח שנתי מוצע לפי קטגוריית מוצר (RIB, SUP, קיאק).
      icon: tabler:map
    - title: יכולת תצוגה או מחסן
      description: מתקן פיזי לתצוגת מוצרים, אחסון מלאי ושירות לקוחות. תמונות או תוכניות קומה המציגות את שטח ההרס וקיבולת אחסון חלקי חילוף.
      icon: tabler:building
    - title: דוח יכולת פיננסית
      description: 'הפניה בנקאית או דוח כספי המאשר את היכולת לבצע הזמנה ראשונית ולשמור על מלאי. הזמנה ראשונית מינימלית: מכולה אחת בקוטר 20 רגל (10-20 יחידות בדגמים מעורבים).'
      icon: tabler:coin
    - title: קיבולת תמיכה לאחר המכירה
      description: טכנאי שירות שהוכשרו או ניתנים להכשרה לתחזוקה ותיקון סירות מתנפחות. יכולת עיבוד תביעות אחריות והתחייבות למלאי חלקי חילוף.
      icon: tabler:tool
    - title: אזכורים קודמים למותגים
      description: רשימת מותגי ציוד ימי/ספורט נוכחיים או קודמים שהופצו. המלצות ליצירת קשר זמינות בהסכמה הדדית. סטארטאפים ללא ניסיון קודם בהפצה עשויים להיות זכאים עם התחייבות פיננסית חזקה יותר.
      icon: tabler:users
faq:
  title: תוכנית סוכנויות — שאלות נפוצות
  questions:
    - q: מהו מספר ההזמנות המינימלי למפיצים?
      a: המפיץ MOQ מתחיל ב-10-20 יחידות לכל הזמנה, עם גמישות לדגמים מעורבים (RIB, מתנפח, SUP). הזמנות מדגם ראשוניות של 2-5 יחידות זמינות במחיר המפיץ להערכת שוק.
    - q: האם אתם מציעים זכויות טריטוריאליות בלעדיות?
      a: זכויות טריטוריות בלעדיות זמינות למפיצים מוסמכים העומדים בהתחייבויות נפח שנתיות ושומרים על סטנדרטים של מותג. הסדרים חצי-בלעדיים ולא בלעדיים זמינים גם לשווקים מתפתחים.
    - q: איזה תמיכה שיווקית אתם מספקים?
      a: אנו מספקים ערכת שיווק מקיפה הכוללת צילום מוצר מקצועי, דפי מפרט, תבניות תיעוד עמידה, ספריית תוכן ברשתות חברתיות וחומרים ממותגים במשותף. מתעדכנים מדי שנה עם השקות מוצרים חדשים.
    - q: איך מטפלים בתביעות אחריות?
      a: 'המפיצים משמשים כנקודת הקשר הראשונה לתביעות אחריות. אנו מספקים קריטריונים ברורים לאחריות, פרוטוקולי תיעוד צילום, והחלפה מהירה/עיבוד אשראי. תנאי אחריות: הגבלת 5 שנים על בד/תפרים/גוף צינורות סירה; שנתיים SUP ואביזרים.'
    - q: האם אפשר לפרסם מוצרים עם מותג Aquafarer פרטי תחת המותג שלי?
      a: כן, דרך OEMODM התוכנית שלנו / אפשרויות המותג הפרטי כוללות גרפיקה מותאמת אישית של שפופרות, מיתוג קונסולות, אריזות קמעונאיות ותיעוד ציות תחת שם המותג שלך. ראה OEMODM את דף השירותים שלנו לפרטים.
    - q: איזה תיעוד ציות כלול למפיצים?
      a: כל משלוח כולל CE DoC ספציפי לדגם, נתוני לוחיות בונה, מדריכי בעלים ומסמכי משלוח. אנו גם מספקים תמיכה רגולטורית ברישום לאזור שלכם ומסייעים בכל דרישות עמידה מקומיות.
