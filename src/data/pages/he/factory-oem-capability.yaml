hero:
  tagline: OEM/ODM ייצור
  title: OEM וייצור בתווית פרטית
  subtitle: מהרעיון ועד למיכל — התאם כל פרט בקו סירת המים המתנפחת שלך
intro: Aquafarer מציעה שירותי OEM ו-ODM מקיפים למותגים, מפיצים וסוכנויות ממשלתיות ברחבי העולם. עם 10+ שנות ניסיון בייצוא ומפעל בגודל 12,000 מ״ר ISO מוסמך 9001 & BSCI, אנו מטפלים בכל מה שקשור לעיצוב המוצר ופיתוח תבניות ועד לייצור בקנה מידה מלא, אריזה ולוגיסטיקה.
