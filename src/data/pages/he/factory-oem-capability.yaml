services:
  - title: עיצוב והנדסת מוצרים
    description: צוות ה-R&D הפנימי שלנו עובד עם הרעיון או המפרט שלך לפיתוח שרטוטי CAD, דגמי תלת-ממד ופרוטוטיפים. אנו מציעים עיצוב תבניות, אופטימיזציה של צורת הגוף והנחיות לבחירת חומר.
  - title: מיתוג מותאם גרפיקה
    description: הדפסה דיגיטלית מלאה בצבע, דפוס מסך, טביעת חותם ואפשרויות תוויות. אנו מפתחים גרפיקות ייחודיות לסיפון, מיתוג צינורות ואריזה מוכנה לשיווק.
  - title: התאמת חומר ומפרט
    description: בחר מ-PVC (סטנדרטי, ידידותי לסביבה, עמיד באש), Hypalon/CSM, drop-stitch ובניית היברידית. צבעי צינורות מותאמים, משקל בדים ואפשרויות חיזוק.
  - title: אריזה ולוגיסטיקה
    description: אריזת קמעונאות מותאמת, קופסאות בתווית פרטית, אריזת ואקום, פלטות, וטענת מכולות. זמינים תנאי משלוח FOB צ'ינגדאו, CIF, או DDP.
