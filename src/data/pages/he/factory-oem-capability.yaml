why_us:
  - title: אינטגרציה אנכית
    description: אנחנו הבעלים של המפעל, התבניות ושרשרת האספקה שלנו — בלי מתווכים, בלי קבלני משנה. זה נותן לנו שליטה על האיכות, העלות והאספקה.
  - title: הסמכה כפולה
    description: ISO BSCI 9001 הסמכת ניהול איכות וציות חברתי. דוחות ביקורת במפעל זמינים לפי בקשה.
  - title: CE עמידה בדרישות
    description: כל הדגמים CE הסטנדרטיים נושאים הסמכה של 2013/53/EU (האיחוד האירופי). דגמים מותאמים אישית יכולים לקבל CE הסמכה באמצעות התהליך המוסמך שלנו.
  - title: נמוך MOQ
    description: תתחיל עם רק 5 יחידות לדגמים סטנדרטיים. אנחנו עוזרים למותגים מתפתחים להשיק מבלי להתחייב למלאי יתר על המידה.
