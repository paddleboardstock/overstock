hero:
  tagline: Aquafarer אקדמיה
  title: מרכז למידה
  subtitle: מדריכים והדרכות לכל רמת מיומנות — מהבסיס של SUP ועד טכניקות חילוץ מתקדמות
categories:
  - level: מַתחִיל
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP יסודות
        desc: למד את יסודות ההנעה על סאפ — עמידה, טכניקת משיכה ושיווי משקל.
        slug: beginner-sup-guide
      - title: טכניקות משוט
        desc: משיכת קדימה, משיכת סוויפ, משיכת ציור, ותמיכה נמוכה — שלוט במהילולי המשוטים החיוניים.
        slug: sup-paddle-guide
      - title: ביטחון קודם כל
        desc: נהלי בטיחות חיוניים כולל בדיקות מזג אוויר, שימוש ב-PFD, כללי רצועה, וחילוץ עצמי.
        slug: sup-safety-guide
  - level: ביניים
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: יסודות סיורים
        desc: תכנון משיכות מרובות שעות — ניווט, התזונה נוזלים, קצב קריאה, וקריאת תחזיות רוח.
        slug: touring-sup-guide
      - title: קריאת מזג אוויר
        desc: פענוח תחזיות ימיות, זיהוי תבניות עננים, והבנת השפעות הרוח על המים.
        slug: weather-planning-water-sports
      - title: יסודות ניווט
        desc: קריאת מפות, שימוש במצפן, נקודות דרך ב-GPS, ותכנון מסלולים להנעה לחוף.
        slug: sup-navigation-guide
      - title: מודעות לגאות ושפל
        desc: הבנת מחזורי גאות ושפל, זרמים, וכיצד הם משפיעים על זמני יציאה ותכנון מסלול.
        slug: understanding-tides
  - level: מִתקַדֵם
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: תכנון מסע רב ימי
        desc: לוגיסטיקה של משלחות — בחירת ציוד, תכנון אוכל, פרוטוקולי בטיחות, ויצירת קשר במצבי חירום.
        slug: sup-travel-guide
      - title: טכניקות חילוץ
        desc: חילוץ עצמי, חילוץ T, חילוץ אסקימו עבור קיאקים, ופרוטוקולי גרירה במים פתוחים.
        slug: sup-self-rescue
      - title: שיט לילי
        desc: ניווט לאחר חשיכה — דרישות תאורה, זיכרון מסלול, תקשורת קבוצתית, ומודעות לסכנות.
        slug: sup-navigation-guide
  - level: תַחזוּקָה
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: ניקוי וטיפול
        desc: שטיפה במים מתוקים, הגנה על UV, מניעת עובש, ושיטות ייבוש נכונות לאחר כל מפגש.
        slug: inflatable-sup-maintenance
      - title: מדריך אחסון
        desc: שיטות מומלצות לאחסון סירות ומדבקות מתנפחות — ריקון אוויר, קיפול, שליטה בטמפרטורה ומשך חיים על המדף.
        slug: inflatable-sup-storage
      - title: יסודות התיקון
        desc: תיקון נחירי אוויר קטנים, נזילות בתפירה ובעיות שסתום עם ערכות תיקון PVC וטכניקות טלאים.
        slug: inflatable-sup-repair
      - title: תחזוקת שסתומים
        desc: זיהוי סוגי שסתומים (Halkey-Roberts, Boston, Leafield), ניקוי שאריות והחלפת גבעולים תקולים.
        slug: inflatable-sup-repair
knowledge_center_tagline: מרכז ידע
knowledge_center_title: ציוד ימי ומדריכי תעשייה
knowledge_center_subtitle: ידע מקצועי ומדריכי קנייה למקצוענים ימיים, מפעילי צי וחובבי ספורט ימי.
knowledge_sections:
  - title: RIB ידע על סירות
    tagline: מדריכי סירות נוקשות ומתנפחות
    desc: הכל על סירות RIB — עיצוב גוף הסירה, חומרים, בחירת מנוע, תחזוקה ועצות קנייה לשימוש מסחרי ובילוי.
    guides:
      - title: כיצד לבחור את הסירה הנכונה RIB
        desc: מדריך מלא לבחירת סירה RIB — גודל, כוח מנוע, חומר הצינורות, סוג גוף הסירה והשימוש המיועד.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB מול סירת מתנפחת
        desc: סירת נוקשה-מתנפחת מול סירת דאצ'י מתנפחת מסורתית — השוואת עיצוב גוף סירה, ביצועים, עמידות וקיבולת.
        href: /compare/rib-vs-dinghy
      - title: מסחרי RIB לעומת פנאי RIB
        desc: סירות RIB מסחריות מול סירות פנאי — תקני בנייה, חומרים, אורך חיים, עלות ותעודות.
        href: /compare/commercial-vs-recreational-rib
      - title: גוף סירה מאלומיניום מול פיברגלס
        desc: השוואת גופי סירה מאלומיניום ופיברגלס לסירות RIB בהתבסס על משקל, עלות, עמידות והתנגדות לקורוזיה.
        href: /compare/aluminum-vs-fiberglass
  - title: מדריך סירות מתנפחות
    tagline: ידע על כלי שיט מתנפחים
    desc: מדריכים מקיפים על סירות מתנפחות — PVC מול Hypalon, שיטות בנייה, תקני בטיחות ושיטות תחזוקה מומלצות.
    guides:
      - title: PVC מול Hypalon מדריך חומרים
        desc: השוואה סופית בין PVC ו-Hypalon CSM לבניית סירות מתנפחות.
        href: /compare/pvc-vs-hypalon
      - title: איך מייצרים סירות מתנפחות
        desc: תהליך ייצור — חיתוך חומרים, ריתוך HF, בניית תפירות, בדיקות לחץ ובקרת איכות.
        href: /learn/inflatable-technology
      - title: מדריך בטיחות לסירות מתנפחות
        desc: תקני בטיחות, קיבולת טעינה, אינפלציה נכונה, בדיקות טרום-יציאה ונהלים במצבי חירום.
        href: /learn/water-safety
      - title: תחזוקת סירות מתנפחות
        desc: ניקוי, אחסון, הגנת UV, חורף ותיקון סירות מתנפחות ו-RIBs.
        href: /v2/inflatable-boat-maintenance
  - title: ידע על סירות
    tagline: סירת תדלוק מתנפחת & RIB Hub
    desc: מדריכים טכניים המכסים סוגי סירות מתנפחות, חומרים, שיטות בנייה, תחזוקה ובטיחות — מדינג'ים ועד RIBs.
    guides:
      - title: סוגי סירות מתנפחות
        desc: דינג'ים, RIBs, קיאקים ותנדרים — למדו את ההבדלים ובחרו את המתאימה.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch טכנולוגיה
        desc: איך אלפי תפרים פנימיים יוצרים מבנים מתנפחים קשיחים בלחץ גבוה.
        href: /learn/drop-stitch-core
      - title: מדריך חומרים
        desc: דירוגי PVC דנייר, משקלי בד, עמידות UV וחומרים בדרגת ים מוסברים.
        href: /learn/materials
      - title: RIB נגד דינגי
        desc: השוו בין סירות מתנפחות קשיחות לדינג'ים מתנפחים מסורתיים לשימושים שונים.
        href: /compare/rib-vs-dinghy
  - title: SUP ידע
    tagline: מדריכי לוחות דיפ פדאל
    desc: כל מה שקשור ללוחות SUP — מתנפחים מול קשיחים, מידות הלוח, טכנולוגיית החומר ועצות מומחים לכל רמות הכישורים.
    guides:
      - title: מתנפחים מול לוחות קשיחים SUP
        desc: השוו בין iSUPs ולוחות אפוקסי קשיחים מבחינת ניידות, עמידות, ביצועים וערך.
        href: /learn/sup
      - title: מדריך מידות לוח SUP
        desc: איך אורך, רוחב ועובי משפיעים על יציבות, מהירות ויכולת תמרון.
        href: /learn/sup
      - title: תחזוקה וטיפול SUP
        desc: ניקוי, אחסון, הגנת UV וטיפים לתיקון לוחות מתנפחים SUP.
        href: /v2/inflatable-sup-maintenance
      - title: בחירת ה-SUP הראשון שלכם
        desc: מדריך למתחילים לבחור את לוח דיפ פדאל המתאים למשקל, רמת כישורים ושימוש מתוכנן.
        href: /learn/sup
  - title: מדריך ציוד צלילה
    tagline: ידע על סירות צלילה מסחריות
    desc: מדריכים מיוחדים על סירות צלילה, RIBs צלילה וציוד למרכזי צלילה, מפעילי צלילה וצוותי צלילה מסחריים.
    guides:
      - title: הסירת RIB הטובה ביותר למרכזי צלילה
        desc: איך לבחור את סירת הצלילה RIB הנכונה למרכז הצלילה שלכם — קיבולת, תצורה ושיקולי תקציב.
        href: /solutions-diving-center-boats
      - title: מדריך תצורת RIB צלילה
        desc: תכונות חיוניות ל-RIBs צלילה — מתלים למיכלים, מערכות סולמות, פלטפורמת צלילה ואחסון ציוד.
        href: /solutions-diving-center-boats
  - title: מדריך סירת יאכטה תחלופית
    tagline: פתרונות סופריאכטות וסירות עזר ימית
    desc: מדריכים לבחירת סירת עזר מושלמת — סירות עזר מתנפחות, סירות RIB, פתרונות אחסון ואביזרים לסירה.
    guides:
      - title: איך לבחור סירת עזר
        desc: גורמים שיש לשקול בבחירת סירת עזר ליכטה שלך — גודל, חומר, מנוע ואחסון.
        href: /solutions-yacht-tender-solutions
      - title: סירות מתנפחות מול סירות RIB
        desc: השוואת סירות עזר מתנפחות מול סירות סרן מתנפחות קשיחות מבחינת ביצועים, עמידות ויכולת אחסון.
        href: /compare/rib-vs-dinghy
  - title: מדריך ציוד הצלה
    tagline: ידע על כלי שיט לחיפוש והצלה
    desc: מדריכים מקצועיים על סירות הצלה, כלי שיט SAR וציוד תגובה חירום לחיל הים, מצילי חיים וצוותי סיוע באסונות.
    guides:
      - title: מדריך לבחירת סירת SAR
        desc: כיצד לבחור את סירת החיפוש וההצלה הנכונה — מהירות, קיבולת, עמידות ודרישות ציוד מיוחד.
        href: /solutions-rescue-watercraft
      - title: RIB מסחרי למשימות הצלה
        desc: מדוע RIBs בדרגת מסחר הם הבחירה המועדפת לצוותי חיפוש והצלה מקצועיים ברחבי העולם.
        href: /use-cases/search-and-rescue
