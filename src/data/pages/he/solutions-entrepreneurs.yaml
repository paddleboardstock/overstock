testimonial:
  content: השקתי את מותג SUP שלי בלי ניסיון בתעשייה. צוות Paddle Board Overstock הנחה אותי החל מבחירת המוצר ועד עיצוב לוגו מותאם ואריזה. המכולה הראשונה שלי הגיעה תוך 11 שבועות, ומכרתי את הכל תוך 3 חודשים באמזון. כעת אני מזמין את המכולה השלישית שלי.
  name: מייקל פארק
  title: מייסד, Shoreline Paddle Co. — קליפורניה, ארה"ב
content_segments:
  tagline: פרופילים של יזמים
  title: השקת מותג ספורט ימי<br />לפי סוג יזם
  subtitle: מייסדים שונים מגיעים עם חוזקות שונות — מומחיות באי-קומרס, קשרים בתעשייה, תפוצה תוכן או תשתית הפצה. אנו מתאימים את תוכנית ההשקה OEM/ODM למצב ההתחלתי שלך ולשאיפת הצמיחה שלך.
  items:
    - title: מוכרים באמזון FBA ואי-קומרס
      subtitle: בוני מותגים מהירים ומונחי נתונים
      description: מוכרים מנוסים באינטרנט שמשיקים מוצרים לספורט ימי באמזון, וולמארט או החנויות שלהם ב-Shopify. אתם יודעים כיצד למקסם את רשימות המוצרים, לנהל PPC ולקרוא נתוני קטגוריה — אך אתם זקוקים לשותף לייצור שמבין מהירות מסחר מקוון, שיעורי החזרות ושינויים בביקוש עונתי.
      features:
        - אריזה מוכנה לריטייל מותאמת למגבלות מימדי FBA
        - יצירת ברקוד EAN/UPC ותיעוד תואם לאמזון
        - MOQ נמוך (2–5 יחידות לRIB SKU, 5–10 לSUP) כדי לבדוק את הביקוש לפני הגדלה
        - קונסולידציה של מכולות מעורבות למיקסום עלות לליד ליחידה
    - title: משפיעני כושר ואורח חיים חיצוני
      subtitle: יוצרי מותגים שמעמידים את הקהל בראש
      description: יוצרי תוכן, מאמני כושר ואושיות חוץ עם קהל מעורב שמוכן להשקיע במותג לייף סטייל. אתם מביאים את הקהילה ואת סיפור המותג — אנחנו מטפלים בהנדסת המוצר, תאימות, אריזה ולוגיסטיקה כדי שתוכלו להתמקד בתוכן ובהמרות.
      features:
        - 'מיתוג מותאם אישית במהירות: מחזור דגימה של שבועיים עם לוגו + צבעים'
        - מהדורות מוגבלות עם מותג משולב והשקות צבע עונתיות
        - תמיכה בצילום אורח חיים והפקת תוכן וידאו
        - 'מילוי הזמנות ישירות לצרכן: מפעל → משלוח ישיר ללקוח'
    - title: מפיצים אזוריים עוברים למכירה ישירה לצרכנים
      subtitle: מפעלי B2B משיקים מותג משלהם
      description: מפיצי ציוד ימי או חוץ קיימים שרוצים להשיק מותג משלהם לצד או במקום מכירת מוצרים של צד שלישי. כבר יש לכם תשתית מחסן, קשרי לוגיסטיקה ובסיס לקוחות — אתם צריכים שותף במפעל שיכול לספק איכות תווית פרטית בקנה מידה רחב.
      features:
        - עיצובים בלעדיים של מוצרים לאזור השוק שלך
        - פיתוח תבנית מלאה OEM לצורות ולמפרטים קנייניים
        - תיעוד ציות מקומי (CE, UKCA, USCG) לאזור שלך
        - 'אריזות משותפות למותגים: מותג המפיץ + סימן איכות Paddle Board Overstock'
    - title: מייסדי מותג בפעם הראשונה
      subtitle: יצירת מותג מונחית מקצה לקצה
      description: יזמים נלהבים ללא ניסיון בתעשיית ספורט המים שמעוניינים לבנות מותג מאפס. אתם צריכים שותף שיחזיק את ידי בכל שלב — מבחירת המוצר והשם ועד לעיצוב האריזה ולוגיסטיקת המיכל הראשון — עם לוחות זמנים ברורים ותמחור שקוף.
      features:
        - בחירת מוצר התייעצותית מתוך 50+ עיצובים בסיסיים מוכחים
        - 'חבילת זהות מותג: שם, לוגו, פלטת צבעים, עיצוב אריזות'
        - לוח זמנים של 60–90 יום מרעיון ועד לשליחה הראשונה
        - מנהל פרויקט ייעודי לבעלי מותג בפעם הראשונה
