hero:
  tagline: יזמי מותגי מים
  title: השיק מותג ספורט מים משלך<br />עם Paddle Board Overstock OEM/ODM
  subtitle: ייצור מותג פרטי מוכן למוכרי אמזון, משפיענים חיצוניים, מפיצים אזוריים ובעלי מותגים בפעם הראשונה — מעיצוב המוצר ועד המשלוח הראשון שלך.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock Factory — ייצור מותג פרטי למותגי ספורט ימי
direct_answer: Paddle Board Overstock מקל על השקת מותג ספורט ימי משלך. תוכנית המותג הפרטי שלנו מטפלת בכל דבר, מבחירת מוצרים ועיצוב תבניות מותאמים אישית ועד להדפסת לוגו, אריזה ודרופשיפינג ללקוחות. עם MOQs 2–5 יחידות RIB SKU לכל יחידה ו-5–10 לSUP-, וזמני אספקה של 30–45 ימים, יזמים בפעם הראשונה בדרך כלל עוברים מרעיון למשלוח ראשון תוך 60–90 יום. בחרו מתוך הקטלוג שלנו הכולל 50+ עיצובים מוכחים של מתנפחיםSUP, קיאקים RIBואביזרים, או פיתחו מוצר מותאם אישית לחלוטין עם צוות ההנדסה הפנימי שלנו.
solution_offerings:
  - title: השקת מותג התחלתי
    subtitle: ליזמים בפעם הראשונה שבודקים את השוק
    badge: Popular
    features:
      - title: בחירת מוצר
        description: בחרו מתוך 50+ עיצובים מוכחים של כלי שיט מתנפחים עם תמחור ישיר מהמפעל
      - title: מיתוג מותאם
        description: הדפסת לוגואים על לוחות, התאמת צבעים מותאמת אישית, אריזה ממותגת
      - title: נמוך MOQ
        description: התחילו עם 2–5 יחידות בלבד RIB SKU (5–10 עבור SUP) — בדקו את השוק לפני הגדלה
      - title: מוכן לעמידה בדרישות
        description: CE64 דגמים מוסמכים — מוכרים ברחבי העולם בביטחון
      - title: תמיכה לוגיסטית
        description: FOB צ'ינגדאו או CIF משלוח לנמל היעד שלך
    cta_text: השקת המותג שלי
    cta_href: /contact
  - title: השקת מותג פרימיום
    subtitle: למותגים רציניים שדורשים עיצוב ואריזה מותאמים אישית
    badge: Premium
    features:
      - title: עיצוב מוצר מותאם אישית
        description: פיתוח תבניות בהתאמה אישית, אופטימיזציה של צורה וכיוון ביצועים
      - title: עיצוב חבילה מלאה
        description: אריזות מוכנות לקמעונאות, תגי תלייה, מדריכי הוראות וחוויית פתיחה
      - title: נכסים דיגיטליים
        description: צילום מוצר מקצועי, תמונות לייף סטייל ותוכן וידאו
      - title: אבטחת איכות
        description: בדיקות צד שלישי, דוחות ביקורת מפעל ודגימות ייצור
      - title: ייצור ניתן להרחבה
        description: מה-200 יחידות ראשוניות ל-10,000+ עם איכות ומחירים עקביים
    cta_text: בנה את המותג שלי
    cta_href: /contact
