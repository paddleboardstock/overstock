breadcrumb: OEM/ODM יצרן
tldr:
  summary: Aquafarer הוא מתקן ישירות מהמפעלOEM/ODMיצרן. מתקן בשטח של 12,000 מ"ר ISO 9001:2015, תפוקה שנתית של 15,000 יחידות, CE/BSCI/REACH/UKCA עמידה בתקנים, נמוכה MOQs מ-2-10 יחידות.
  points:
    - מתקן מוסמך של צ'ינגדאו בשטח 12,000 מ"ר ISO 9001:2015
    - קיבולת שנתית של 15,000 יחידות עם 200-300 עובדים מיומנים
    - CE 2013/53/EU, UKCA, BSCIREACH , עמידה בדרישות
    - 'נמוךMOQs: 2-5 יחידות (RIB), 5-10 יחידות SUP() לדגמים סטנדרטיים'
    - 50+ מדינות יצוא עם FOB הספנות של צ'ינגדאו
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015 מוסמך
      desc: SGS-מערכת ניהול איכות שנבדקה בכל קווי הייצור.
      variant: cert
    - icon: ⭐
      title: CE UKCA & עומד בדרישות
      desc: עמידה מלאה בדרישות הסימון של האיחוד האירופי 2013/53/EU ובריטניה.
      variant: cert
    - icon: ⭐
      title: BSCI ביקורת חברתית
      desc: אימות נהלי עבודה אתיים ותקני מקום עבודה.
      variant: standard
    - icon: ⭐
      title: נמוך MOQ מ-2 יחידות
      desc: 'דגמים סטנדרטיים RIB מ-2-5 יחידות, SUP מ-5-10 יחידות. תבנית מותאמת אישית: 200+.'
      variant: standard
process_section:
  eyebrow: התהליך שלנו
  title: מקצה OEMלקצה /ODM זרימת עבודה
  subtitle: מתכנון ועד טעינת מכולות — שישה שלבים לכלי השיט המתנפחים הפרטי שלך.
  steps:
    - step: '01'
      title: תקציר מפרט ועיצוב
      desc: שתפו את המפרטים היעד שלכם, שרטוטי CAD או מוצר ייחוס. צוות ההנדסה שלנו בודק חומרים, מידות ודרישות ציות CEBSCI(, ) לפני הצעת מחיר.
    - step: '02'
      title: אב-טיפוס תלת-ממדי
      desc: אנו מעצבים CNCומעבדים תבניות מותאמות אישית SUP ללוחות, גופי קיאקים RIB ורכיבים. דגימות אב-טיפוס מיוצרות בתוך 15–20 ימי עבודה לאישורכם.
    - step: '03'
      title: בחירת חומרים וייצור דגימות
      desc: בחרו בין בדים צבאיים PVC (0.9 מ"מ–1.2 מ"מ), Hypalon CSMאו drop-stitch בדים ליבה. אנו מייצרים דגימות טרום-ייצור עם צבעי המותג, הלוגו והאריזה שלכם לאישור.
    - step: '04'
      title: CE ביקורת מפעל ועמידה בדרישות
      desc: כל OEM צו כולל תיעוד ציות — CE הצהרת התאמה, ISO רשומות מעקב 9001, BSCI דוח ציות חברתי REACH והצהרות מהותיות.
    - step: '05'
      title: ייצור בכמויות גדולות ובקרת איכות בקו
      desc: ריצות הייצור עומדות ברשימת הבדיקה של 100 נקודות האיכות שלנו. כל יחידה עוברת בדיקות שמירת לחץ 24 שעות ביממה, בדיקת פילינג תפר ובדיקה ויזואלית לפני האריזה.
    - step: '06'
      title: FOB לוגיסטיקה וספנות של צ'ינגדאו
      desc: הסחורות המוגמרות מונחות על משטחים, עטופות במכולות ונטענות במכולות בנמל צ'ינגדאו. אנו מטפלים בכל תיעוד הייצוא, שחרור מכס ומספקים מעקב בזמן אמת אחר משלוחים.
capabilities_section:
  eyebrow: יכולות ייצור
  title: מה אנחנו בונים
  subtitle: שש יכולות ייצור מרכזיות B2B לשותפים גלובליים.
  items:
    - title: Drop-Stitch SUP ייצור לוחות
      desc: drop-stitch למינציה ליבה באורך מלא ללוחות משוטים עמידים קשיחים בלחץ גבוה (15–20PSI). אורך, רוחב, עובי, פרופיל נדנדה ועיצוב גרפי מותאמים.
    - title: PVC ייצור סירות מתנפחות
      desc: סירות דינגי מרותכות בתדר גבוה PVC , ספינות טנדר וסירות ספורט. תצורות תא מרובות, אפשרויות רצפה (סלאט, סיפון אוויר, גלגול), ואינטגרציה של אביזרים.
    - title: Hypalon RIB ייצור סירות
      desc: צינורות מסחריים Hypalon CSM מחוברים לגופי פיברגלס או אלומיניום עמוק V. אורכי 3.3 מ' עד 6.0 מ' לפעולות סיור, חילוץ, סיורים וצלילה.
    - title: מותג פרטי ומיתוג בהתאמה אישית
      desc: 'שירות מותג פרטי מלא: העברת חום או הדפסת מסך מותאמת ללוגו, אריזות ממותגות (קופסאות קמעונאיות, תיקי נשיאה), מדריכי משתמש בשפתכם, וברקוד/UPCרישום.'
    - title: עיצוב תבניות וכלים מותאמים אישית
      desc: צוות הנדסה תלת-ממדי CAD ו-CAM פנימי. אנו מעצבים ומייצרים תבניות אלומיניום ומרוכבות בהתאמה אישית לצורות גוף ייחודיות, תצורות דק ונקודות הרכבה לאביזרים.
    - title: OEM אביזרים וקיטינג
      desc: אפודי הצלה (CE12402), משאבות דו-פעולתיות, משוטים מפחמן/ניילון, ערכות תיקון, תיקי נשיאה והרכבות רצועה. ציוד מלא ואריזות חבילות להצגה מוכנה לקמעונאות.
experience_section:
  eyebrow: חוויה מהעולם האמיתי
  title: שותפויות שבנו מותגים
  subtitle: סיפורים אמיתיים ממותגים וארגונים ששיתפו פעולה Aquafarer עם OEM/ODM ייצור.
  stories:
    - quote: הגענו Aquafarer לעצמי עם סקיצה על מפית ורשימת דרישות. שמונה חודשים לאחר מכן, היה לנו מוצר מוכן לייצור שעבר CE הסמכה בניסיון הראשון.
      narrative: סטארט-אפ אירופי עם עיצוב חדשני SUP ניגש Aquafarer ODM לייצור. Aquafarer צוות המו"פ לקח את הקונספט דרך עיצוב CAD, ניתוח מבני FEA, סימולציה הידרודינמית, יצירת תבניות, ייצור אב-טיפוס וכלי ייצור. מייסד הסטארטאפ ביקר בצ'ינגדאו שלוש פעמים במהלך התהליך. המוצר הסופי עבר CE את ההסמכה ללא שינויים — תוצאה שמייסד מייחס לכך Aquafarerשצוות ההנדסה הבין את דרישות הרגולציה האירופיות מההתחלה.
      context: SUP השקת מותג אירופי, 2023-2024
      source: Brand Founder
    - quote: רמת NDA ההגנה ואבטחת הקניין Aquafarer הרוחני נותנת לנו ביטחון לשתף את העיצובים הקנייניים שלנו. הם מתייחסים לקניין הרוחני שלנו כאילו הוא שלהם.
      narrative: חברת ציוד ימי אמריקאית עם טכנולוגיית שסתומים קניינית הייתה זקוקה לשותף ייצור שיוכל להגן על הקניין הרוחני שלה תוך כדי ייצור בקנה מידה גדול. לאחר ביקורת של חמישה יצרנים סינים, הם בחרו Aquafarer בהתבסס על פרוטוקולי הגנת הקניין הרוחני של המפעל, טיפול בטוח בקבצי התכנון ונכונות לחתום על הסכמי סודיות מחמירים. השותפות יצרה שלושה קווי מוצרים בארבע שנים ללא תקריות קניין רוחני.
      context: חברת ציוד ימי אמריקאית, OEM שותפות מאז 2021
      source: סגן נשיא לפעולות
