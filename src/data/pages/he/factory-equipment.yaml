categories:
  - title: חיתוך והכנת חומר
    items:
      - name: PVC מכונת חיתוך אוטומטית
        spec: CNC-מבוקר, 6.5 מ' × 2.5 מ', דיוק 0.1 מ"מ
        desc: מכונת חיתוך אוטומטית מבוקרת מחשב עבור PVC, Hypalon, drop-stitch ובדים. תוכנת קינון אופטימיזציה את ניצול החומרים לפחות מ-5% פסולת.
      - name: מפזר בד
        spec: רוחב מקסימלי של 3 מטר, הזנה מבוקרת במתח
        desc: מניח את הבד בשכבות אחת או מרובות עם מתח מבוקר כדי למנוע עיוות לפני החיתוך.
  - title: ריתוך צינורות והדבקה
    items:
      - name: מכונת איטום חום
        spec: ריתוך באוויר חם, משתנה 200–600 מעלות צלזיוס, 0.5–5 מ' לדקה
        desc: מכונת איטום חום באוויר חם לחיבור PVC Hypalon וריתוך ותפרי צינורות. משמשת לתיקון, איטום ואיתוך של תאי צינורות ומפרקי צף.
      - name: מכבש RF דיאלקטרי
        spec: 15 קילוואט, פלטן 2000 × 600 מ"מ
        desc: מכבש ריתוך בתדר רדיו לתפרים אורכיים עיקריים, חיבורי טרנסום-לצינור, וייצור תא גדול.
      - name: CNC-רתך RF מבוקר
        spec: 8 קילוואט, טבלת XY 2500 × 1200 מ"מ
        desc: ריתוך תפרים מעוקלים מתוכנתים לגאומטריות מורכבות, הטבעת לוגו וטלאים מדויקים.
  - title: RIB ייצור גוף הספינה
    items:
      - name: תבניות פיברגלס להנחה ידנית
        spec: תבניות מרובות RIB לגוף עד 6 מטר LOA
        desc: תבניות סיבי זכוכית מסורתיות עם מערכות פוליאסטר ושרף וינילסטר. כל שכבה מגולגלת ביד ומאוזנת בשקית ואקום לאיכות וחוזק למינציה אחידה.
      - name: תא ספריי ג'לקוט
        spec: אוורור אוויר מבוקר טמפרטורה ומסנן
        desc: יישום ג'לקוט RIB לגוף. מספק גימור מבריק UVועמיד עם שליטה מדויקת בעובי.
      - name: CNC נתב (5 צירים)
        spec: 3 מ' × 2 מ' × 1 מטר, ציר מקורר מים
        desc: עיבוד של תוספות לדפנות, תבניות קונסולה, בסיסי מושבים ומתלים מותאמים אישית.
  - title: SUP הדפסה וקישוט
    items:
      - name: מדפסת דיגיטלית
        spec: דפוס דיו בהפרדה גבוהה, רוחב הדפסה עד 2 מ'
        desc: הדפסה דיגיטלית ישירה על בד עבור גרפיקות SUP מלאות צבע. מדפיסה תבניות מותאמות אישית, גרדיאנטים, ותמונות באיכות צילום עם דיו על בסיס מים עמיד ל-UV.
      - name: מכונת הדפסה במסך
        spec: רישום ידני וחצי אוטומטי רב-צבעי
        desc: הדפסת מסך עבור לוגו לוחות SUP, סימני מותג ותבניות חוזרות. מספקת הדפסות עמידות, אטומות עם רוויה צבעונית חיה.
  - title: הרכבה וחבלי עגור
    items:
      - name: מנוף מנוע
        spec: קיבולת 500 ק"ג, מוט מפזר מתכוונן
        desc: הרכבה בטוחה של מנועים חיצוניים בין 2.5 ל-60 כ"ס.
      - name: מסגרת הדמיה של קונסולה
        spec: גובה וזווית מתכוונים
        desc: קדם-התקנה של גלגל הגה, דוושות ומסכי מכשירים לפני ההתקנה.
      - name: מכונת הידוק צינורות הידראוליים
        spec: עד 1" קוטר פנימי, מד לחץ דיגיטלי
        desc: הרכבות צינורות הגה הידראוליים באורך מותאם אישית עם חיבורי סווג.
      - name: לוח חיווט חשמלי
        spec: 3 מ' × 1.5 מ', דיאגרמות חיווט מודפסות מראש
        desc: הרכבה ובדיקה מחוץ לסירה של חיבורים חשמליים שלמים.
  - title: בדיקות ובקרת איכות
    items:
      - name: בודק מתיחה אוניברסלי
        spec: 50 kN, לפי ASTM D751
        desc: בדיקת כוח שבירה, התארכות בשבירה והתפשטות קרעים עבור קבוצות בד.
      - name: מתקן בדיקת שמירת אוויר
        spec: תיכנות, שמירה על לחץ 30 דק'
        desc: בדיקת שמירה על לחץ אוטומטית לכל תא צינור לפני ההרכבה.
      - name: בודק קילוף תפר
        spec: קילוף ממונע בזווית 180° בקצב של 100 מ"מ/דקה
        desc: בדיקות חוזק התנפצות של תפר ריתוך ודבק לפי ISO 6185.
      - name: תא מזג אוויר קשת קסנון
        spec: חשיפה ל-2000 שעות
        desc: בדיקות עמידות UV לשינוי צבע ושימור חוזק.
