hero:
  tagline: גרף ידע
  title: ידע בחקר מים
  subtitle: |
    בסיס ידע מובנה המכסה טכנולוגיית SUP מתנפחת,<br />
    בטיחות במים, הנדסת סירות, ותכנון הרפתקאות.
  taglineSection: חקור. למד. לך בביטחון.
clusters:
  tagline: אשכולות ידע
  title: חקור לפי נושאים
  subtitle: צלילות עמוקות לטכנולוגיה, לבטיחות ולמיומנויות שמאחורי כל מוצר Paddle Board Overstock.
  items:
    - title: SUP ידע
      description: מבחירת הלוח הראשון שלך ועד טכניקות סיור מתקדמות — הכל על גלישת פדלים בעמידה.
      icon: tabler:lifebuoy
      topics:
        - כיצד לבחור את הSUP המתנפח הראשון שלך
        - הגודל הטוב ביותר לSUP למתחילים
        - כמה קשה לעמוד על לוח פדל
        - השוואה בין מתנפח ללוח קשה
        - SUP רשימת בדיקה לבטיחות
    - title: ידע על סירות
      description: מדריכים טכניים על סירות מתנפחות, RIBs, סירות קטנות, וקיאקים — הנדסה, חומרים, ותפעול.
      icon: tabler:sailboat
      topics:
        - סוגי סירות מתנפחות מוסברים
        - השוואה בין PVC ל-Hypalon
        - RIB מול Dinghy השוואה
        - צלילה עמוקה בטכנולוגיה
        - מדריך למדעי החומרים הימיים
    - title: ידע בטיחות
      description: ידע בטיחותי חיוני לכל חותר — מבחירת PFD ועד קריאת מזג האוויר וטכניקות הצלה עצמית.
      icon: tabler:shield
      topics:
        - SUP רשימת בדיקה לבטיחות
        - אתה צריך אפוד הצלה?
        - מדריך בטיחות לשחייה במי האוקיינוס
        - בטיחות בנהר לקיאקים מתנפחים
        - מודעות למזג האוויר ולתנאי המים
    - title: טֶכנוֹלוֹגִיָה
      description: ההנדסה מאחורי מוצרי Paddle Board Overstock — חומרים, שיטות בנייה, ובדיקות איכות.
      icon: tabler:microscope
      topics:
        - טכנולוגיה ברמה ימית PVC
        - Drop-stitch הסבר ליבה
        - מדוע PSI חשוב למתנפח SUPs
        - ריתוך RF לעומת חיבור דבק
        - בדיקות איכות והסמכה
    - title: ידע עסקי
      description: מדריכים מסחריים לבניית והרחבת עסק הספורט הימי שלך — מפעילויות השכרה ועד מיתוג מותג פרטי.
      icon: tabler:briefcase
      topics:
        - איך להתחיל SUP עסק להשכרה
        - בניית מרכז ספורט ימי באתר נופש
        - גודל צי לוחות משוטים למועדונים
        - מתנפח לעומת קשה SUP לשימוש מסחרי
        - החומר הטוב ביותר לקיאקים לציי השכרה
        - הקמת מותג מים במותג פרטי
        - אסטרטגיות הכנסות מספורט ימי באתר נופש
        - מדריך תחזוקת ציוד מסחרי
