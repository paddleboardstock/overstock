hero:
  tagline: מומחיות ימית
  title: עשורים של הנדסה ימית<br />בכל גוף
  subtitle: Aquafarer משלב מדעי חומרים עמוקים, ייצור מדויק ובדיקות מהעולם האמיתי כדי לייצר כלי שיט שמתפקדים כשהדבר חשוב.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer צוות הנדסה ימית ומו"פ בעבודה
expertise_materials:
  tagline: מדעי החומרים
  title: בחירת החומר הנכון<br />לכל יישום
  subtitle: אנו עובדים עם שלושה חומרים מרכזיים — כל אחד נבחר למקרי שימוש ספציפיים ולדרישות ביצועים.
  columns: 3
  items:
    - title: דרגת PVCימית
      description: בד 1100 Denier PVC — החומר הרב-שימושי ביותר שלנו. UV-יציב, עמיד לשחיקה REACH ועמיד בתקן. אידיאלי לסירות, SUP קרש וקיאקים לפנאי שבהם משקל ויעילות עלויות חשובים.
      icon: tabler:droplet
    - title: פרימיום Hypalon/CSM
      description: עמידות כימית UV ויציבות עליונות.Hypalon סירות יכולות להחזיק 15-20 שנה עם טיפול נכון. מומלץ ליישומים מסחריים, חילוץ וצבאיים שבהם עמידות לטווח ארוך היא קריטית.
      icon: tabler:shield
    - title: פיברגלס ואלומיניום
      description: גוף פיברגלס עמוק V RIBs לסירות סיור — ביצועי חיתוך גלים בתנאים קשים. גופי אלומיניום לסירות עבודה מסחריות כבדות הדורשות חוזק וקיבולת עומס מקסימליות.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: יכולות ייצור
  title: ייצור מדויק<br />בכל צעד
  subtitle: המתקן שלנו, בשטח של 12,000 מ"ר, מצויד במכונות מיוחדות לכל שלב הייצור.
  columns: 2
  items:
    - title: CNC חיתוך
      description: חיתוך מבוקר מחשב מבטיח לוחות בד מדויקים וחוזרים עם פסולת מינימלית. כל פריט מתאים בדיוק כפי שתוכנן.
      icon: tabler:cpu
    - title: ריתוך בתדר גבוה
      description: ריתוך HF תעשייתי יוצר תפרים חזקים יותר מהחומר הבסיסי. שליטה עקבית בטמפרטורה ובלחץ מבטיחה אטימות אטומות לאוויר בכל ריצת ייצור.
      icon: tabler:bolt
    - title: מכלול ליבת תפר נפילה
      description: אלפי חוטי פוליאסטר מחברים בין שכבות הבד העליונות והתחתונות של הבד, ומאפשרים התנפחות בלחץ גבוה (15-20PSI) עבור SUP לוחות ורצפות קשיחים ויציבים.
      icon: tabler:building-arch
    - title: בדיקת לחץ
      description: כל מוצר מתנפח נבדק בלחץ לפני המשלוח.RIB הצינורות נבדקים בלחץ מדורג פי 1.25 — אם הם מחזיקים שם, הם יתפקדו על המים.
      icon: tabler:wind
    - title: בדיקת חוזק התפר
      description: דגימות אקראיות מכל אצווה עוברת בדיקות חוזק תפר הרסניות. התוצאות מתועדות וניתנות למעקב אחר ריצות ייצור ספציפיות.
      icon: tabler:files
    - title: בדיקות מים
      description: כל דגם RIB עובר ניסויי ים לפני אישור. בדיקות בעולם האמיתי בתנאי חוף מאמתות את הביצועים, ההתנהלות והיציבות.
      icon: tabler:ripple
expertise_design:
  tagline: עיצוב והנדסה
  title: מהונדס לתנאים אמיתיים
  subtitle: פילוסופיית העיצוב שלנו מתחילה באיך שהסירה תושמש — ואז בונה את ההנדסה סביב מקרה השימוש הזה.
  items:
    - title: עיצוב גוף בצורת V עמוק
      description: לקסדות הסיבי זכוכית שלנו יש זוויות דדראיז מחושבות שמותאמות לאורך ולשימוש המיועד של כל דגם. V חד יותר למים סוערים, רדוד יותר ליציבות.
    - title: בטיחות רב-חללית
      description: כל סירה כוללת 3-7 תא אוויר עצמאי. אם תא אחד נפגע, התאים הנותרים שומרים על הסירה צפה ופועלת.
    - title: פריסת ארגונומית
      description: מיקום הקונסולה, גובה הצינור, ומיקום המושב מעוצבים סביב נוחות המפעיל במהלך שימוש ממושך — בין אם במפקדת סיור, דיג או תחבורה.
    - title: תצורה מותאמת אישית
      description: צבעי הצינורות, תצורת הקונסולה, קיבולת הדלק, מעמדי אביזרים — כל דגם ניתן להתאים כדי להתאים לדרישות תפעוליות ספציפיות.
