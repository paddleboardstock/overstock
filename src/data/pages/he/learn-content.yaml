articles:
  sup:
    - title: SUP יסודות — מדריך למתחילים
      desc: כל מה שמתחיל צריך לדעת — סוגי לוחות, מידות מחבט, עמידה, ועצות ליום הראשון.
    - title: SUP מדריך מידות
      desc: מצא את אורך הלוח, רוחבו והנפח המתאימים למשקלך, לכישוריך ולסגנון החתירה שלך.
    - title: מתנפח מול לוח קשיח
      desc: איזו אפשרות מתאימה לכם? השוואת ניידות, ביצועים, עמידות ועלות.
    - title: טכניקות ביניים
      desc: שפר את השיט שלך עם משיכות מתקדמות, טכניקות פנייה והתמודדות עם מים סוערים.
    - title: כיצד לבחור סירה מתנפחת SUP
      desc: התמצאות בגורמים המרכזיים — בנייה, עובי, סידור סנפירים ואביזרים נלווים.
    - title: בטיחות במים
      desc: ידע חיוני לבטיחות כולל קריאת מזג אוויר, בחירת PFD, הצלה עצמית ושיט קבוצתי.
  inflatable-boat:
    - title: מדריך חומרים
      desc: PVC, Hypalon, drop-stitch, דירוגי דנייר — הבינו ממה עשוי הציוד המתנפח שלכם.
    - title: PVC לעומת Hypalon
      desc: השוואה חותכת בין בדים PVC ו-Hypalon לסירות מתנפחות — עמידות, עמידות UV ועלות.
    - title: Drop-Stitch הסבר ליבה
      desc: איך אלפי תפרים פנימיים יוצרים פלטפורמה קשיחה ב-12-15 PSI עבור SUPs מתנפחות בעלות ביצועים גבוהים.
    - title: סקירת טכנולוגיית סירות מתנפחות
      desc: כיצד נבנות סירות מתנפחות ו-SUPs — מהשכבת חומר ועד מערכות שסתומים וריתוך תפרים.
    - title: מדריך סירה קשיחה מתנפחת (RIB)
      desc: כל מה שקשור לבניית RIB, סוגי דפנות, חומרי צינורות ובחירת RIB המתאימה לצרכים שלכם.
    - title: סירה מתנפחת לעומת RIB
      desc: הבדלים מרכזיים בין דינגי מתנפח מסורתי לבין סירות מתנפחות בעלות גוף קשיח עבור שימושים שונים.
  water-safety:
    - title: מדריך בטיחות במים
      desc: ידע חיוני לבטיחות לכל חתור — מזג אוויר, גופיות הצפה, הצלה עצמית ופרוטוקולים לשיט קבוצתי.
    - title: מדריך מעיל הצלה ו-PFD
      desc: כיצד לבחור את מתקן ההצפה האישי המתאים ל-SUP, קיאקים, שיט ושימוש מקצועי.
    - title: רשימת בדיקה לבטיחות SUP
      desc: רשימת בדיקה לפני השקה שכל חותר על לוח חתירה עומד צריך לבצע לפני כניסה למים.
    - title: בטיחות בגלישה במים קרים
      desc: אמצעי זהירות חיוניים, ציוד וטכניקות לגלישה בתנאי מים קרים.
    - title: טעויות גלישה למתחילים
      desc: טעויות נפוצות שמבצעים גולשים בפעם הראשונה וכיצד להימנע מהן לחוויית גלישה בטוחה ונעימה יותר.
    - title: CE הסבר על הסמכה
      desc: מה משמעות הסמכת CE לצוללות מתנפחות — הסטנדרטים, הבדיקות ולמה זה חשוב לבטיחות.
ui:
  read_guide: קרא את המדריך →
  card_tech: מהנדסי בטיחות ימית ובדיקת חומרים
  card_products: גלו את קטלוג המוצרים המלא של Aquafarer
  card_trust: עמידה בסטנדרטים CE, ISO ו-BSCI
materials:
  intro_p1: הביצועים, העמידות והבטיחות של כלי שיט מתנפח תלויים כמעט לחלוטין בחומרים בהם הוא מיוצר. מבד שיוצר את הצינורות ועד לתפירות שנותנות לקרש SUP את הקשיחות שלו — כל בחירת חומר משפיעה על ביצועי המוצר במים ועל אורך חייו.
  intro_p2: 'מדריך זה מכסה את ארבעת החומרים המרכזיים בהם משתמשים בכלי שיט מתנפחים מודרניים: בד PVC, גומי Hypalon CSM, בניית ליבת drop-stitch ולוח קצף EVA. הבנת חומרים אלה תסייע לכם לבחור את המוצר המתאים לצרכים שלכם ולטפל בו כדי להכפיל את אורך חייו.'
  labels:
    advantages: יתרונות
    limitations: מגבלות
    best_for: 'הטוב ביותר עבור:'
  items:
    - name: PVC (פוליוויניל כלוריד)
      summary: הסטנדרט בתעשייה לסירות מתנפחות לפנאי ו-SUPs. בד רב-שכבתי מצופה מציע יחס חוזק-למשקל מצוין במחיר נגיש.
      pros:
        - זול — 30-50% זול יותר מ-Hypalon
        - קל משקל וקל לניהול
        - עמידות טובה ל-UV עם ציפויים מתאימים
        - מגוון רחב של צבעים וגימורים
        - קל לתיקון עם טלאי PVC ודבק ממס
      cons:
        - משך חיים קצר יותר מ-Hypalon (7-10 שנים)
        - פחות גמיש בטמפרטורות קרות
        - עמידות כימית נמוכה יותר
        - יכול לפתח נדידת פלסטיצייזר לאורך הזמן
      best_for: SUPs לפנאי, סירות בתקציב נמוך, צי להשכרה, שימוש עונתי, מים מתוקים וחופים.
    - name: Hypalon (גומי CSM)
      summary: חומר גומי סינתטי פרימיום הידוע בעמידות יוצאת דופן, עמידות ל-UV ואריכות ימים. הסטנדרט הגבוה לסירות מתנפחות מסחריות וצבאיות.
      pros:
        - עמידות יוצאת דופן ל-UV ואוזון
        - תוחלת חיים של 15-20 שנה עם טיפול נכון
        - גמישות מצוינת במזג אוויר קר
        - עמידות גבוהה לכימיקלים ולשמן
        - שומר על צבע לאורך זמן יותר מ-PVC
      cons:
        - יקר משמעותית מ-PVC
        - משקל בד כבד יותר
        - אפשרויות צבע מוגבלות יותר
        - תיקונים דורשים דבקים מיוחדים
        - פחות מתקני ייצור ברחבי העולם
      best_for: יישומים מסחריים RIBs, חיפוש והצלה, יישומים צבאיים, אקלים טרופי, בעלות ארוכת טווח על צי רכבי מים.
    - name: ליבת Drop-Stitch
      summary: הטכנולוגיה שהפכה את SUPs הניתנים לניפוח למהפכנית. אלפי חוטי פוליאסטר מחברים את שכבות הבד העליונה והתחתונה, מה שמאפשר התנפחות בלחץ גבוה לביצועים קשיחים וקשים.
      pros:
        - קשה במיוחד בלחץ 12-20 PSI
        - קל משקל — 18-30 פאונד לכל לוח בגודל מלא
        - מתקפל שטוח לאחסון ולטיולים
        - עמידות מצוינת בפני זעזועים
        - ביצועים עקביים בטווחי טמפרטורות שונים
      cons:
        - דורש משאבה בלחץ גבוה
        - תיקון נקבים מורכב יותר משכבה אחת
        - עלות ייצור גבוהה יותר מנפחים סטנדרטיים
        - אובדן לחץ לאורך זמן דורש תוספת תקופתית
      best_for: לוחות פדל עמידים, קיאקים, דקים מתנפחים לסירות, כל יישום הדורש ביצועים קשיחים עם ניידות מתנפחת.
    - name: דק קצף EVA
      summary: קצף תא סגור EVA (אתילן-ויניל אצטט) המשמש לבליטות אחיזה על לוחות SUP ודקי סירות. מספק ריפוד, אחיזה ובידוד תרמי.
      pros:
        - אחיזה מצוינת למניעת החלקה, רטוב או יבש
        - הריפוד מפחית עייפות במהלך פדלים ארוכים
        - בידוד תרמי מפני משטח דק קר
        - עמיד ל-UV ומים מלוחים
        - זמין בעבודות צבע מרובות ובדגמים חרוטים בלייזר
      cons:
        - יכול להתבלה עם שימוש כבד במשך 2-3 שנים
        - חייב להיות מודבק כראוי כדי למנוע התפצלות
        - לא מבני — לא משפיע על קשיחות
        - מוסיף משקל קל (200-400 גרם לכל לוח)
      best_for: SUP אחיזת סיפון, ריפוד סיפון סירה, נוחות מושב קיאק, כל משטח הדורש מדריכה מונעת החלקה.
  selection:
    title: מדריך לבחירת חומר
    subtitle: 'בחר את החומר הנכון על פי השימוש העיקרי שלך:'
    headers:
      - מקרה שימוש
      - חומר מומלץ
      - למה
    rows:
      - - שייט פנאי SUP
        - Drop-stitch PVC
        - קל משקל, קשיח, משתלם — איזון אידיאלי למשוטים מזדמנים
      - - סירה משפחתית / סירת אגם
        - PVC (1100 דנייר)
        - יעיל מבחינת עלות, קל לתיקון, עמידות מספקת לשימוש פנאי
      - - סירת RIB מסחרית / סיור
        - Hypalon CSM
        - עמידות מקסימלית ל-UV, אורך חיים 15-20 שנה, עמידות לכימיקלים ושמן
      - - צי לוחות להשכרה SUP
        - Drop-stitch PVC + EVA סיפון
        - עמיד, ניתן לתיקון, ערך טוב לשימוש עם תחלופה גבוהה
      - - מבצעים של חיפוש והצלה
        - Hypalon CSM
        - אמינות בתנאים קיצוניים, גמישות בקור, עמידות לכימיקלים
      - - קיאק תיור / משלחת
        - Drop-stitch PVC
        - ביצועים קשיחים עם ניידות ארוזה לנסיעה
  deep_dive:
    title: מדריכי צלילה עמוקה
    topics:
      - title: דרגת PVCימית
        desc: בדי PVC מרובי שכבות למינציה — עמידות UV, בדיקות שחיקה ודירוגי דנייר מוסברים.
      - title: PVC לעומת Hypalon
        desc: השוואה חד-משמעית בין שני חומרי הסירה המתנפחת השולטים — עלות, אורך חיים, עמידות UV.
      - title: ליבת Drop-Stitch
        desc: כיצד אלפי חוטים פנימיים יוצרים מבנים מתנפחים קשיחים בעלי לחץ גבוה ב-12-15 PSI.
      - title: טכנולוגיית ריתוך RF
        desc: ריתוך בתדירות גבוהה יוצר תפרים חזקים ועקביים — איך זה עובד ולמה זה חשוב.
      - title: PSI וביצועים
        desc: למה לחץ אוויר חשוב למוצרים מתנפחים SUPs וסירות — קשיחות, יכולת משקל ואיכות הנסיעה.
      - title: בדיקות איכות
        desc: בדיקות לחץ, בדיקות ציפה, UV התיישנות ובדיקות הרס — תהליך האיכות שלנו.
      - title: EVA דקים מעץ קצף
        desc: משטחי דקים מקצף תא סגור EVA — אחיזה, נוחות ועמידות למוצרים SUP ודקי סירות.
      - title: טיפוח חומרים
        desc: ניקוי, הגנה UV, מניעת עובש, ושיטות אחסון מיטביות למוצרים מתנפחים.
