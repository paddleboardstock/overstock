content_challenge:
  tagline: האתגר
  title: דרישות האקוואקלצ'ר<br />ציוד עמיד למים מלוחים
  subtitle: חוות דגים, חוות פנינים וראנצים ימיים פועלים בסביבה ימית כימית תוקפנית במיוחד — חשיפה ממושכת למים מלוחים, שאריות דלק ומזון, ושימוש יומיומי רציף.
  paragraphs:
    - פעולות אקוואקלצ'ר מתבצעות 365 ימים בשנה בסביבות חוף וים פתוחים. סירות העבודה המשמשות לבדיקת כלובים, העברת מזון, תחזוקת קווי פנינים ושירות ציוד נחשפות באופן מתמיד לטבילה במים מלוחים, UV חשיפה ומגע כימי עם דלקים, מזון לדגים וטיפולי אנטי-פולנט.
    - '**הקורוזיה היא האויב העיקרי** — ציוד ימי סטנדרטי מתדרדר במהירות בתנאים אלו. מנועי חוץ, מסגרות קרונית והתקנים על הסיפון דורשים החלפה מתמדת. מפעילים זקוקים לסירות שנבנו מחומרים עמידים בפני קורוזיה שיכולות לשרוד שנים בסביבה זו ללא ירידה בביצועים.'
    - '**אמינות יומית היא קריטית** — סירת עבודה שבורה משמעותה דחיית לוחות האכלה, איחור בקציר והפסדים יקרים בייצור. עבור חוות פנינים, יום אחד של בדיקה שלא בוצעה עלול לגרום נזק משמעותי לקציר. עבור חוות דגים, איחור בהאכלה משפיע על קצב הצמיחה והרווחיות.'
    - Paddle Board Overstock סירות אקוואקלצ'ר RIBs מיועדות עם חומרה עמידה בפני קורוזיה, צינורות כבדים וסיפונים מחוזקים שתוכננו במיוחד לתנאים תובעניים של פעולות גידול דגים, טיפוח פנינים וראנצ'ינג ימי.
content_solution:
  tagline: הפתרון שלנו
  title: מובנה למטרה RIBs<br />לתעשיית האקוואקלצ'ר
  subtitle: כל Paddle Board Overstock סירת אקוואקלצ'ר תוכננה להתמודד עם סביבות מים מלוחים תוקפניות תוך מתן ביצועים יומיומיים אמינים.
  list:
    - צינורות בדרגת ימית — עמידות עליונה לUV, מים מלוחים, דלקים וכימיקלים במזון דגים
    - חומרה מנירוסטה 316 לאורך כל הסירה — ללא חלודה בחשיפה ממושכת למים מלוחים
    - ריבוד מוגבר ושומר קיל למגע חוזר עם רציפים וכלובים
    - סיפון מתנקז עצמי לנוחות שטיפה וניקוז לאחר העברת מזון ופעולות קציר
    - תצורת דק שטוח לנשיאת שקי מזון, מתקני קציר וציוד
    - תצורות מנוע חיצוני מ-15 HP עד 60 HP — מותאמות אופטימלית לנשיאה מול יעילות דלק
    - אפשרויות צבע צינור בעלות נראות גבוהה לזיהוי קל בשטחים חקלאיים גדולים
content_segments:
  tagline: פרופילי אקווה-תרבות
  title: פתרונות סירות עבודה<br />לפי סוג אקווה-תרבות
  subtitle: לפעולות אקווה-תרבות שונות יש דרישות שונות לסירות עבודה — מסירות קטנות וזריזות RIBs לבדיקת כלובי דגים ועד פלטפורמות יציבות להובלת מרעיה וסירות עבודה כבדות לחקלאות ימית.
  items:
    - title: פעולות חקלאות דגים
      subtitle: בדיקת כלובים, הובלת מזון, תמיכה בקציר
      description: חוות דגים ימיות מפעילות כלובים במיקומים חשופים לחוף ולים הפתוח. סירות עבודה משמשות מדי יום לבדיקת רשתות כלובים, פעולות האכלה, תמיכה בקציר ותחזוקת ציוד. האתגר המרכזי הוא קורוזיה — הסירות חשופות באופן מתמיד למי מלח, שאריות מזון לדגים ודלק. סירת עבודה אמינה חיונית, מכיוון שהחמצת האכלה או עיכוב בקציר משפיעים ישירות על תפוקת הייצור והרווחיות.
      features:
        - 'חבילת סביבה תוקפנית: חומרה מנירוסטה 316, רכיבי סגסוגת בדרגת ימית'
        - פריסת דק שטוח להובלת שקי מזון ומתקני קציר
        - דק מתנקז עצמי לניקוי קל לאחר פעולות
        - צינורות Hypalon עם ציפוי עמיד לכימיקלים לחשיפה למזון ודלק
        - רצועות חיכוך מחוזקות למגע תכוף עם כלובים ונמלים
    - title: פעולות חקלאות פנינים
      subtitle: הובלה יציבה לבדיקת קווי פנינים וקציר
      description: חוות פנינים דורשות סירות עבודה יציבות ואמינות להובלה יומית בין קווי פנינים, בדיקת רשתות צדפות ואיסוף קציר. פעולות אלו מתבצעות במיקומים חופיים מרוחקים עם תשתית תחזוקה מוגבלת. הסירה חייבת להיות יציבה מספיק לצוות העובד במהלך בדיקת קווי הפנינים, עם עלייה נוחה למעלה ומרחב דק מספק להובלת צדפות קצורות, רשתות ואספקה. אמינות ותחזוקה קלה הן קריטיות במיקומי חווה מרוחקים.
      features:
        - עיצוב גוף יציב לצוות עומד במהלך בדיקת קווי פנינים
        - דק שטוח עם משטח לא מחליק לתנועת צוות בטוחה
        - גובה חרטום נמוך לגישה נוחה לרשתות צדפות ולקציר
        - תצורת מנוע חיצוני פשוטה לניהול תחזוקה באתר
        - חבילת צינורות וחומרה עמידה לקורוזיה לחשיפה מתמשכת למי מלח
    - title: חקלאות ימית ושיפור ימי
      subtitle: הובלת גור, שירות כלובים, תמיכת ניטור
      description: פעולות חקלאות ימית כוללות שחרור גור במשקיים למערכות ימיות מנוהלות, מעקב אחר גדילה ושירות מבנים לשיפור ימי. סירות עבודה נדרשות להוביל גור במיכלים מואברים, לשאת ציוד ניטור ולגשת לאתרי שחרור רדודים בחוף. עיצוב גוף הסירה חייב לאזן בין יכולת נשיאה לבין זולה רדודה לגישה לחוף ולפיר
      features:
        - מרחב דק למיכלי הובלת גור מואבר וציוד ניטור
        - זולה רדודה לגישה לאתרי שחרור בחוף ולמיתריות
        - חנייה קלה על החוף — קיל וחזית מחוזקים
        - נקודות חיבור לציוד ניטור ולקבלת דגימות
        - צינורות Hypalon עמידים לשימוש בתנאי חול מעורב ומי ים
