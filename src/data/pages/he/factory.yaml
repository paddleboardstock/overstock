workshops_section:
  tagline: סדנאות
  title: סדנאות ייצור
  workshops:
    - title: PVC חיתוך והכנת חומר
      description: CNC מכונות חיתוך PVCHypalondrop-stitch אוטומטיות מעבדות , , ובדים בדיוק תת-מילימטר. קינון מותאם למחשב ממזער בזבוז חומרים ומבטיח שכל לוח עומד במפרט הממדי שלו לפני הריתוך.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: ריתוך צינורות ואיטום חום
      description: סדנת ריתוך ייעודית עם מכונות איטום חום ומכבשים דיאלקטריים RF. איטומי חום באוויר חם מחברים PVC את תאי צינורות הפיוז, בעוד ריתוכי RF מייצרים תפרים אטומים וחזקים העולים ISO על דרישות 9001.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB ייצור גוף — פיברגלס
      description: RIB גופי סירות מיוצרים באמצעות תבנית פיברגלס ידנית עם מערכות פוליאסטר ושרף וינילסטר. כל שכבה מגולגלת ביד ומכוסה בשקית ואקום לאיכות עקבית. תא התרסיס Gelcoat מספק UVגימור ימי מבריק ועמיד.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP הדפסה וקישוט
      description: SUP הלוחות מעוטרים בהדפסה דיגיטלית לגרפיקה צבעונית מלאה והדפסת מסך ללוגואים ודפוסים חוזרים. מדפסות דיגיטליות מייצרות עיצובים של חפיסות באיכות צילום, בעוד שהדפסת מסך מספקת סימני מותג עמידים וחיים.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: הרכבה סופית והפיגוע
      description: קו הרכבה שבו גוף וצינורות פיברגלס PVC מחוברים, מותקנים מנועים, מחוברים ההיגוי והבקרה, ומערכות חשמל מחוברות. כל סירה פועלת לפי רשימת הרכבה בת 100 נקודות שאושרה על ידי ראש הצוות.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: בדיקות איכות ובדיקות
      description: כל סירה שהושלמה עוברת בדיקות החזקת אוויר חובה, אימות פילינג תפר ובדיקת מערכות מלאה לפני המשלוח. מעבדת האיכות שלנו פועלת באופן עצמאי מהייצור ומדווחת ישירות להנהלה.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
