qc_section:
  tagline: בקרת איכות
  title: תהליך בדיקות ואבטחת איכות
  subtitle: כל סירה עוברת בדיקות חובה לפני המשלוח. מעבדת האיכות שלנו פועלת באופן עצמאי מהייצור ומדווחת ישירות להנהלה.
  steps:
    - step: '1'
      title: בדיקת חומרי גלם
      desc: PVC, Hypalon, drop-stitch ובדים עוברים בדיקות מתיחה (ASTM D751), התפשטות קרעים UV ואימות התנגדות לפני כניסת כל אצווה לייצור.
    - step: '2'
      title: מבחן החזקת אוויר במשך 48 שעות
      desc: כל תא צינור מנופח ל-125% מהלחץ המוערך ומוחזק למשך 48 שעות. ירידת לחץ העולה על 5% מפעילה דחייה אוטומטית ובדיקת תפר מחודשת.
    - step: '3'
      title: בדיקות עומס ואיזון
      desc: סירות שהושלמו נטענות לקיבולת מדורגת מקסימלית ונבדקות ליציבות, לחוף חופשי ולטיפול. כל כלי שיט נבדק במים לפני הבדיקה הסופית.
oem_section:
  tagline: OEM פרויקטים
  title: OEM מחקרי מקרה של מותג ושותפויות
  subtitle: מהקונספט ועד המיכל — איך אנחנו עוזרים למותגים גלובליים להשיק ולהרחיב את קווי כלי השיט המתנפחים שלהם.
  cases:
    - challenge: קמעונאי החוץ האירופי היה זקוק לקו מותג פרטי SUP עם גרפיקה ייחודית לדק, אריזה ידידותית לסביבה PVCומוכנה לקמעונאות — הכל נמסר תוך 60 יום.
      solution: פיתחנו קבצי הדפסה דיגיטליים מותאמים אישית, REACHדגימה תואמת מקור, PVCודגימה דחוסה מ-3 סבבים ל-1 על ידי שיתוף צוות התכנון במפעל שלנו בצ'ינגדאו.
      result: 55 ימים מ-PO חתום לFOB-. 2,400 יחידות ב-4 SKUs. הזמנה חוזרת בוצעה לפני הגעת המכולה הראשונה.
    - challenge: סטארטאפ ספורט מים בארה"ב היה זקוק drop-stitch לקיאק ביצועים גבוהים עם צורת גוף מותאמת אישית, אריזה ממותגת במשותף, BSCI והסמכה למיקום קמעונאתי.
      solution: התאים drop-stitch תבנית קיאק קיימת עם פרופיל נדנדה מותאם, פיתח אמנות אריזה ממותגת במשותף, וסיפק BSCI תיעוד ביקורת מלא.
      result: נרשם בהצלחה בשלוש רשתות חוץ גדולות בארה"ב. 5,000+ יחידות בשנה הראשונה עם שיעור מכירה של 98%.
    - challenge: מפיץ אוסטרלי דרש CEסדרה מוסמכת RIB עם צבעי שפופרות מותאמים אישית, Hypalon אפשרות שדרוג ועמידה בתקן האוסטרלי AS 1799.
      solution: ייצר דגימות טרום-ייצור עם 4 גרסאות צבע של שפופרות, שמקורו CSM Hypalon בספק יפני, ותיאום בדיקות עמידה בדרישות AS 1799 של צד שלישי.
      result: סדרת 3 דגמים RIB הושקה בשוק אוסטרליה/ניו זילנד. אחריה זכייה במכרז ממשלתי עבור 12 סיירותRIBs.
faq_section:
  tagline: שאלות נפוצות
  title: B2B OEM & שאלות נפוצות
  questions:
    - q: מהי כמות ההזמנה המינימלית MOQ() OEM SUP ללוחות מתנפחים?
      a: MOQ מתחילה מ-5–10 יחידות OEM לדגמים סטנדרטיים. תבניות מותאמות אישית ופרויקטים עם מותג פרטי דורשים מינימום של 200 יחידות בהתאם למורכבות. הזמנות ניסוי והדגימה זמינות להשקות מותגים חדשים.
    - q: Aquafarer האם יש BSCI לו הסמכה?
      a: כן. המפעל שלנו שומר BSCI על תעודת עמידה חברתית תקפה (דוח ביקורת זמין לפי בקשה). אנו גם מחזיקים ISO ב-9001:2015 לניהול איכות, ו-64 מדגמי המוצרים שלנו נושאים CE הסמכה (TÜVריינלנד).REACH RoHS ותיעוד ציות המסופק עם כל OEM משלוח.
    - q: מהו זמן ההובלה הטיפוסי OEM להזמנה?
      a: זמן ההובלה הסטנדרטי הוא 30–45 ימים מה-PO המאושר והפיקדון. פיתוח תבנית מותאמת אישית מוסיף 15–20 ימים לכלי העבודה. אנו מציעים ייצור מזורז להזמנות דחופות ולזמני שיא עונתיים בתקופת לפנים הקיץ (ינואר–מרץ).
    - q: האם תוכלו לשלוח FOB צ'ינגדאו או CIF לנמל שלנו?
      a: כן. אנו משלחים ל-FOB צ'ינגדאו, CIF נמלים עיקריים עולמיים, ול-DDP עבור שותפים מוכרים. צוות הלוגיסטיקה שלנו מנהל הזמנות מכולות, תיעוד לייצוא ושחרור במכס. אנו משלחים ל-50+ מדינות ברחבי שווקי האיחוד האירופי, ארצות הברית, אוסטרליה ואסיה.
b2b_moq: 'סטנדרטי MOQ: 5–10 יחידות לכל דגם (SUP/קיאק/drop-stitch). RIB MOQ: 2–5 יחידות. הזמנות ניסיון מתקבלות בברכה לשיתופי פעולה חדשים.'
production_flow:
  tagline: זרימת ייצור
  title: מחומר לסירה גמורה
  subtitle: כל סירה עוברת דרך 6 שלבי ייצור עם נקודות ביקורת איכות בכל שלב. אין קיצורי דרך, אין דילוג על בדיקות.
  stages:
    - stage: '01'
      title: קבלת חומר ובקרת איכות נכנס
      description: כל החומרים הנכנסים נרשמים לפי מספר אצווה/סדרה במערכת ERP שלנו. גלילי בד PVC, ליבות drop-stitch, שסתומים, דבקים וחומרה מושעים עד לאישור בקרת איכות.
      qc_check: עוצמת מתיחה (ASTM D751), עמידות לקריעה (ISO 4674), מד עובי, צמיגות דבק, סריקת ליקויים ויזואלית
      qc_threshold: 100% מהאשכולות נבדקו. לדחות אם מתח מתיחה < 90% מהמפרט, קריעה < מינימום המפרט, או כל פגם חזותי
      responsibility: צוות בקרת איכות נכנס (3 מפקחים)
    - stage: '02'
      title: CNC חיתוך והכנת חומר
      description: התכנסות מותאמת למחשב מסדרת לוחות על מלאי PVC כדי למזער פסולת. מכונות חיתוך CNC אוטומטיות שומרות על דיוק מיקום של 0.1 מ"מ.
      qc_check: בדיקת ממדים מול קבצי CAD DXF, בדיקת איכות קצוות, אימות מספר לוחות
      qc_threshold: כל לוח עשרים נמדד. סובלנות ±0.5 מ"מ. דחו את האצווה אם יותר מ-2% חורגים מהסובלנות
      responsibility: מנהיג סדנת חיתוך
    - stage: '03'
      title: ריתוך והידבקות Drop-Stitch
      description: Drop-stitch הליבות מחוברות לשכבות החיצוניות של PVC באמצעות למינציה חום. תאיות הצינור מותקנות בריתוך RF או בריתוך באוויר חם. רצועות המסילה מחוברות בשלוש שכבות בעזרת צימוד סיפוח.
      qc_check: בדיקת פיל כל 50 יחידות (ASTM D751), מדידת רוחב ריתוך, סקירת יומן טמפרטורת אוויר חם, בדיקה חזותית של התפר תחת תאורה אחורית
      qc_threshold: חוזק פילינג מינימום 8 ניוטון/ס"מ. סבילות רוחב ריתוך ±1 מ"מ. כל ערוץ נראה נראה = דחייה
      responsibility: בקרת איכות ריתוך (2 בודקים לכל משמרת)
    - stage: '04'
      title: הרכבה וחבלי עגור
      description: 'סירות עוברות להרכבה הסופית שבה כל הרכיבים מחוברים: גופית +, צינורות, שסתומים מותקנים, טבעות D, ידיות, תאיות סנפיר, והתאמת תיק נשיאה. כל יחידה עוקבת אחר רשימת בדיקה של 100 נקודות להרכבה.'
      qc_check: חתימה על רשימת בדיקה בת 100 נקודות לכל יחידה, בדיקת תפקוד שסתום (10 מחזורי פתיחה וסגירה), אימות מומנט החומרה, בדיקה ויזואלית
      qc_threshold: 'מדיניות של אפס תקלות בפריטי בטיחות קריטיים (שסתומים, טבעות D, ידיות). קוסמטי קל: AQL 2.5 (ISO 2859)'
      responsibility: ראש צוות הרכבה + בקרת איכות קו
    - stage: '05'
      title: בדיקות לחץ והחזקת איכות
      description: כל תא מנופח ללחץ של 1.25× הלחץ הנקוב (בדרך כלל 20–25 PSI) ומוחזק במשך 24–48 שעות. חיישני הלחץ רושמים באופן רציף. תאים החורגים מירידת לחץ של 5% נדחים ונשלחים לבדיקה מחודשת של התפרים.
      qc_check: יומן החזקת לחץ של 24 שעות, כיול חיישן נבדק מדי יום, קריאת לחץ מותאמת לטמפרטורה, בדיקת תפר מחדש לאחר תיקון
      qc_threshold: מקסימום ירידת לחץ של 5% ב-24 שעות בטמפרטורה יציבה. כל תא שחורג מזה = בדיקה חוזרת 100% של כל אצוות הייצור
      responsibility: מעבדת איכות (עצמאית מהייצור, מדווחת להנהלה)
    - stage: '06'
      title: בדיקה סופית ואריזה
      description: בדיקה ויזואלית ופונקציונלית סופית. ליקויי שטח, עקביות צבע, אימות תוויות/קוד BIN, תקינות האריזה, והשלמות אביזרים. היחידות נארזות בוואקום, ממוכסות לקופסאות, ומסודרות על משטחים לטעינת מכולה.
      qc_check: בדיקה ויזואלית מלאה, רשימת בדיקה לאביזרים לפי SKU, מבחן ירידת אריזה (1 מ', דגימה אקראית), אימות סריקת תוויות/קוד בר
      qc_threshold: AQL 2.5 לליקויים משמעותיים, AQL 4.0 לליקויים מינוריים. אפס סובלנות לליקויי בטיחות. 100% מהיחידות נבדקות חזותית
      responsibility: צוות QC סופי (4 מבקרים) + מוביל צוות אריזה
