hero:
  tagline: מִפְעָל
  title: מפעל וייצור
  subtitle: 12,000 מ"ר של ייצור משולב — מחומרי גלם ועד לסירה מוגמרת
intro:
  - כמותג המפעל שלAquafarer ** מרכז הייצור של צ'ינגדאו**, Aquafarer שולט בכל שלבי הייצור — מהגעת חומרי הגלם PVC ופיברגלס ועד לבדיקה הסופית לפני המסירה של הסירה המוגמרת. מתקן הייצור שלנו באזור הפיתוח הכלכלי של צ'ינגדאו משתרע על פני 12,000 מטרים רבועים וכולל סדנאות ייעודיות PVC לחיתוך, איטום חום של צינורות, RIB ייצור גוף פיברגלס, SUP הדפסה דיגיטלית, הרכבה סופית ובדיקות איכות.
  - על ידי שילוב עיצוב, הנדסה, אב-טיפוס, ייצור ובדיקות תחת קורת גג אחת, אנו מבטלים את חוסר היעילות של ייצור חוזי ושומרים על שליטה ישירה על איכות הבנייה, בחירת החומרים ולוחות הזמנים של המסירה. כל סירה שיוצאת מהסדנה שלנו נבנית על ידי האנשים שלנו, על הציוד שלנו, לפי הסטנדרטים שלנו.
