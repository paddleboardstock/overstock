hero:
  tagline: למה Paddle Board Overstock
  title: נבנה שונה. נבנה לעסקים.<br />השותף מאחורי הרפתקאות מים ברחבי העולם
  subtitle: לא רק יצרן — שותף עסקי שמעציב, מהנדס ומספק ציוד ברמה מסחרית למועדונים, אתרי נופש, מפעילי השכרה ומותגי מים חדשים.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock איכות ומומחיות בייצור
pillars:
  tagline: שלושת עמודי השותפות
  title: למה עסקים בתחום המים ברחבי העולם בוחרים ב-Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: עוצב לשימוש מסחרי
      description: הציוד שלנו מהונדס להשכרה יומית, לא לפנאי בסופי שבוע. PVC ברמה מסחרית, ליבות drop-stitch מחוזקות, אפשרויות UV-יציבות Hypalon, וחומרה שנבדקה בשטח משמעותם תחזוקה נמוכה יותר, אורך חיים ארוך יותר, ותפוקה גבוהה יותר לפעילות שלך.
      icon: tabler:building-factory
      callToAction:
        text: צפה בקו המוצרים המסחרי
        href: /products
    - title: מהרעיון לשוק
      description: 'השק את מותג ספורט המים שלך תוך 90 יום. אנו מנחים אותך בכל שלב: אימות הרעיון, בחירת מוצר, אבטיפוס, ייצור, עיצוב אריזות, ומשלוח עולמי. אין לחץ להזמנות מינימום — התחל קטן, והתפתח בביטחון.'
      icon: tabler:rocket
      callToAction:
        text: התחל את מסע המותג שלך
        href: /oem-odm-blueprint
    - title: נבנה לתנאים גלובליים
      description: 'מוצרים מותאמים לכל אקלים: נוסחאות PVC במים קרים לאירופה, חומרים עמידים ל-UV למזרח התיכון ולאוסטרליה, טיפולי נגד לחות לדרום-מזרח אסיה. כל משלוח מותאם לסביבת היעד שלו.'
      icon: tabler:world
