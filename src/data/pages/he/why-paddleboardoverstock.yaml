reasons:
  tagline: ההבדל של Paddle Board Overstock
  title: מה מבדיל אותנו
  isBeforeContent: false
  columns: 3
  items:
    - title: ייצור אמיתי, לא סחר
      description: אנחנו הבעלים והמפעילים של מפעל בגודל 12,000 מ"ר. כשאתה משתף פעולה עם Paddle Board Overstock, אתה עובד ישירות עם האנשים שמעצבים, מהנדסים ובונים את המוצרים שלך — בלי מתווכים.
      icon: tabler:building-factory
    - title: גישה מונעת הנדסה
      description: תהליך העיצוב שלנו מתחיל מהמקרה שימוש, לא מקטגוריית המוצר. אנו ממקסמים את צורת הגוף, בחירת החומרים והקונפיגורציה בהתאם לאופן שבו הציוד יישמש בפועל בסביבות מסחריות.
      icon: tabler:engine
    - title: איכות מוסמכת
      description: CE מוסמך, מערכת איכות ISO, תאימות BSCI, תאימות REACH, אפודי הצלה מאושרים סוג III/V; כל המוצרים עומדים בתקנים בינלאומיים רלוונטיים.
      icon: tabler:certificate
    - title: גמישות OEM/ODM
      description: צבעי צינורות, פריסת קונסולה, מיתוג, אריזה — אנחנו מתאימים אישית לפי המפרט שלך. אין לחץ מינימלי על הזמנה. התחל עם אב-טיפוס, התרחב בביטחון.
      icon: tabler:adjustments
    - title: לוגיסטיקה עולמית
      description: מחסן בארה"ב בקליפורניה, משלוח ישיר מצ'ינגדאו, הובלה אווירית להזמנות דחופות. אנו מטפלים בניירת ומסמכים למכס ברחבי העולם.
      icon: tabler:truck-delivery
    - title: תמיכה לכל החיים
      description: אנו תומכים בסירות שבנינו לפני 20 שנה. חלקי חילוף מקוריים, ייעוץ טכני, הדרכה לתיקונים — הצוות שלנו זמין כשאתה זקוק לנו, בכל מקום שבו אתה נמצא.
      icon: tabler:lifebuoy
testimonials:
  tagline: אמין על ידי Brands Worldwide
  title: מה אומרים השותפים שלנו
  items:
    - content: עבדנו עם מספר יצרנים בסין, אך Paddle Board Overstock הם בולטים בתמיכה ההנדסית שלהם ובאיכות עקבית. הם מתייחסים למותג שלנו כאל שלהם.
      name: — OEM שותף, מותג ספורטי מים אירופי
    - content: ה-Hypalon RIBs שלהם נמצאים בשירות עם הצי שלנו כבר מעל 5 שנים. תחזוקה מינימלית, עמידות מצוינת ל-UV. האחריות לחמש שנים על הצינורות נותנת לנו ביטחון.
      name: — מפעיל צי, קבוצת נופש במזרח התיכון
    - content: צוות Paddle Board Overstock עזר לנו לפתח עיצוב לוח SUP מותאם אישית מהרעיון ועד לייצור תוך 90 ימים. האיכות עלתה על הציפיות שלנו.
      name: — מפיץ, ספורט ימי באוסטרליה
    - content: כבעל עסק קטן, דאגתי לגבי MOQs. Paddle Board Overstock עבד עם התקציב שלי ועזר לי להשיק את המותג שלי עם רק 50 לוחות. עכשיו אני מזמין 500.
      name: — מייסד המותג, חברת השכרת SUP בארה"ב
