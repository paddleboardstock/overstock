hero:
  tagline: מדריכים
  title: חדש ב-SUP?
  subtitle: מדריכים מעשיים שיעזרו לכם לבחור, להשתמש ולהנות מציוד ספורט מים מתנפח.
size_guide:
  tagline: מידות ומפרט
  title: מצא את הגודל הנכון לצרכים שלך
  desc: השווה בין מידות המוצר, קיבולת משקל, והשימושים המומלצים. בין אם אתה צריך קיאק לתיירות SUP, קיאק קומפקטי, או RIB מסחרי — מדריך המידות שלנו יעזור לך לבחור את ההתאמה הנכונה.
  link_label: מדריך מידות מלא עם מפרט המוצר →
  link: /size-guide
  cards:
    - title: SUP לוחות
      desc: בחר אורך בהתאם למשקל שלך ולשימוש המיועד. לוחות רחבים יותר (32"+) מציעים יותר יציבות. לוחות ארוכים יותר (11–12 רגל) נעים טוב יותר בתיירות.
    - title: קיאקים
      desc: קיאקים יחידים (9 רגל) לטיולים סולו ונהרות. קיאקים זוגיים (12 רגל) לשני משוטים או אחד עם ציוד. תמיד בדוק את קיבולת המשקל.
    - title: דינגי וRIBs
      desc: בחר אורך לפי מספר הנוסעים והשימוש. RIBs גדולים יותר (4.5 מ'+) לים הפתוח והצלה. דינגי קטנים יותר (2.7 מ') כמשאיות וכפלטפורמות לדיג.
