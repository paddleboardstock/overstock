hero:
  tagline: ידע בחקר מים
  title: לִלמוֹד
  subtitle: |
    מדריכים, הדרכות וחקר מעמיק — כל מה שתצטרכו כדי לחקור<br />
    מים בביטחון. מהבחירה של SUP הראשון שלך ועד לשליטה בטכניקות מתקדמות.
  taglineSection: ידע לכל משיט. ממתחיל ועד מקצועי.
featured:
  tagline: נושאים מובלטים
  title: התחל את מסע הלמידה שלך
  subtitle: בין אם אתה חדש בספורט ימי או מחפש לשפר רמה, המדריכים שלנו מכסים את הכל.
  items:
    - title: SUP יסודות
      description: כל מה שמתחיל צריך לדעת — סוגי לוחות, מידות מחבט, עמידה, ועצות ליום הראשון.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: מתנפח מול לוח קשיח
      description: מה נכון עבורך? אנחנו משווים ניידות, ביצועים, עמידות ועלות זה לצד זה.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: בטיחות במים
      description: ידע בטיחותי חיוני שכל חותר צריך לדעת — מזג אוויר, אפודי הצלה, הצלה עצמית, ועוד.
      icon: tabler:shield
      href: /learn/water-safety
    - title: מדריך לחומרים
      description: PVC מול Hypalon, טכנולוגיית drop-stitch, דירוגי מנע — להבין ממה הציוד שלך עשוי.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP מדריך מידות
      description: מצא את אורך הלוח, רוחבו והנפח המתאימים למשקלך, לכישוריך ולסגנון החתירה שלך.
      icon: tabler:ruler
      href: /size-guide
    - title: טכניקות ביניים
      description: שפר את השיט שלך עם משיכות מתקדמות, טכניקות פנייה והתמודדות עם מים סוערים.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
