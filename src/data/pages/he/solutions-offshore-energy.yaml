content_challenge:
  tagline: האתגר
  title: דרישות לאנרגיה ימית<br />אמינות בסביבה קיצונית
  subtitle: תפעול אנרגיה ימית דוחף את הציוד לקצה — מזג אוויר קיצוני, מיקומים מרוחקים, מחזורי שירות רציפים, ואפס סובלנות לכשלים.
  paragraphs:
    - תעשיית האנרגיה הימית פועלת בסביבות הימיות התובעניות ביותר על פני כדור הארץ. סירות עבודה תומכות בפלטפורמות נפט וגז, התקנות טורבינות רוח, הפעלת כבלים תת-ימיים ופרויקטים של בנייה ימית — לעיתים בתנאי אוקיינוס פתוח עם חלונות מזג אוויר מוגבלים. כשל בציוד אינו רק יקר, אלא גם מסוכן.
    - '**הבטיחות היא העדיפות העליונה** — כלי שיט להעברת צוותים חייבים לפעול בבטחה במצבים ימיים שעלולים לעצור פעולות אחרות. יציבות בנקודת ההעברה, ביצועי מנוע אמינים בכל מזג אוויר, ובנייה עמידה לעגינה חוזרת מול מבנים ימיים הם דרישות חובה.'
    - '**יכולת לכל מזג אוויר היא חיונית** — חוות רוח ימיות ופלטפורמות נפט פועלות לאורך כל השנה. סירות עבודה חייבות לפעול בים סוער, רוחות חזקות וראות מוגבלת. פעילות יום ולילה דורשת מערכות ניווט מלאות ומערכות תאורה אמינות.'
    - '**מגזר הרוח הימית גדל במהירות** — אלפי טורבינות חדשות מותקנות ברחבי העולם, שכל אחת מהן דורשת העברת צוותים סדירה, הובלה בכלים ותמיכה בתחזוקה. דבר זה יוצר ביקוש מתמשך לכלי שיט להעברת צוותים (CTVs) ייעודיים ולתמיכהRIBs.'
    - Paddle Board Overstock אנרגיה ימית RIBs מהונדסת באמצעות גופי V מחוזקים, Hypalon צינורות כבדים, מערכות ניווט מלאות ומערכות בטיחות המיועדות לתנאים קיצוניים של פעילות אנרגטית ימית.
content_solution:
  tagline: הפתרון שלנו
  title: מטוסים ייעודיים בים RIBs<br />לתעשיית האנרגיה
  subtitle: כל Paddle Board Overstock אנרגיה ימית RIB מעוצבת לפעולה בטוחה ואמינה בתנאים ימיים קיצוניים — מהים הצפוני ועד דרום-מזרח אסיה.
  list:
    - גוף V מחוזק לביצועים במים סוערים וטיפול צפוי
    - צינורות כבדים Hypalon עם UV עמידות כימית לשירות ימי ממושך
    - חומרה מפלדת אל-חלד 316 — ללא קורוזיה בחשיפה רציפה למי מלח
    - 'חבילת ניווט מלאה: GPS, רדאר, VHF, אורות ניווט לילה — סטנדרטי בדגמים ימיים'
    - סיפון קופץ עצמי להפעלה בטוחה בתנאי עלייה לים
    - תצורות מנוע מרובות — מנוע יחיד או זוגי חיצוני עבור חזרה למשימה
    - עמוד גרירה ודפנות כבדים לטיפול בפלטפורמות וצפים
    - צבעי צינורות בעלי נראות גבוהה לזיהוי באתרי עבודה ימיים
content_segments:
  tagline: פרופילי אנרגיה
  title: פתרונות אנרגיה ימיים<br />לפי סוג יישום
  subtitle: סקטורים שונים של אנרגיית חוץ-חופים דורשים כלי עבודה שונים — מתמיכה בפלטפורמות RIBs ועד כלי הובלת צוות רוח ומסוקים לבדיקת תת-ימי.
  items:
    - title: תמיכה בפלטפורמות נפט וגז מחוץ לחוף
      subtitle: העברת צוות, אספקת ציוד, המתנה בטיחותית בפלטפורמות
      description: פלטפורמות נפט וגז דורשות חילופי צוות יומיים, הובלת ציוד ואספקה, וכיסוי בטיחותי. כלי העבודה חייבים לפעול בבטחה סביב מבני הפלטפורמה, בזרמים חזקים ובמצבי ים משתנים, ולשמור על עמידה מדויקת בעת העברת אנשי צוות בסולם או במעבר. הסביבה הקיצונית — פחמימנים, כימיקלים, ריסוס מלח מתמיד — מחייבת בנייה עמידה בפני קורוזיה וביצועים אמינים.
      features:
        - תצורת העברת צוות עם גישה בטוחה לעליה לסירה ומסילות יד
        - צינורות עמידים בפני קורוזיה Hypalon וחומרה מנירוסטה 316
        - רצועות חיכוך מחוסמות למגע תכוף עם פטרי הפלטפורמה
        - דק מתנקז עצמי עבור מים שמנוניים ושטיפה כימית
        - מיכל דלק בקיבולת גבוהה לטווח פעולה ארוך מחוץ לחוף
        - אפשרות מנוע זוגי עבור חזרה קריטית למשימה
    - title: פעולות חוות רוח מחוץ לחוף
      subtitle: העברת צוות, תחזוקת טורבינות, הובלת כלי עבודה
      description: אנרגיית הרוח מחוץ לחוף היא הסקטור הצומח ביותר באנרגיה ימית. מפעילים צריכים כלי העברת צוות (CTVs) שיבצעו העברת טכנאים לבסיסי גישה לטורבינות בבטחה במצבי ים עד גובה גל משמעותי של 1.5 מטר. יציבות בעת ההעברה, יכולת פעולה בכל מזג אוויר, ותפעול יומי אמין חיוניים. כלי שירות לחוות רוח פועלים בלוחות זמנים צפופים — כל השבתה מעכבת תפעול או תחזוקה של טורבינה, מה שמשפיע ישירות על הכנסות ממכירת אנרגיה.
      features:
        - צורת גוף מותאמת להעברת צוות יציבה בסיס הטורבינה
        - כניסה ב-V עמוק לנסיעה נעימה במים מחוץ לחוף ובגלים
        - הגנה מלאה מפני מזג אוויר — קונסולה סגורה או תא משוט לراحة הצוות
        - שטח דק לכלי עבודה, חלקי חילוף, וציוד שירות
        - חבילת פעולות לילי למשמרות חורף מוגבלות באור יום
        - תפעול שקט של מנוע חיצוני להשפעה מינימלית על הסביבה הימית
    - title: תמיכה בכבלי וצנרת תחת-ימית
      subtitle: בדיקה, תחזוקה, תמיכת ROV, סקר
      description: מפעילי כבלים וצנרת תת-ימית צריכים כלי עבודה לבדיקת נתיבים, תמיכת תחזוקה, פעולות ROV, ומשימות סקר. כלי שיט אלו דורשים פלטפורמות יציבות לפריסת ציוד תת-ימי והחזרתו, תמרון מדויק במהירויות נמוכות למעקב אחר כבלים, ותפעול אמין בסביבות חופיות ומחוץ לחוף. יציבות הסירה קריטית לדיוק ציוד סונר וסקרים.
      features:
        - פלטפורמה יציבה במהירות נמוכה למעקב אחר כבלים וביצוע סקרים
        - פריסת דק פתוחה לפריסת ROV, סלילי כבלים וציוד סקר
        - לוחות התקנה לציוד לסונאר, GPS וכלי סקר
        - עיצוב גוף בעל שגרה נמוכה להפרעה מינימלית למצע הימי במהלך בדיקות
        - תמרון מדויק במהירות נמוכה עם הגה חיצוני רגיש
    - title: הנדסה ימית ותמיכה בבנייה
      subtitle: הובלת צוות, אספקת חומר, תמיכה בצלילה
      description: קבלני הנדסה ימית שעובדים על בניית נמל, הגנה על החוף, והתקנות בים הפתוח זקוקים לסירות עבודה רב-תכליתיות להובלת צוות בין כלי בנייה לחוף, אספקת חומרים וכלים, תמיכה בצלילה וביצוע סקרים באתר. סירות אלו פועלות באזורים פעילים של בנייה עם מספר כלי שיט, שטחי תמרון מוגבלים ותנאי ים משתנים. עמידות ורב-תכליתיות הן בעלות עדיפות עליונה.
      features:
        - תצורת דק רב-תכליתית עבור צוות, חומרים וציוד צלילה
        - סולם ציוד התקנה ותמיכה לפעולות צלילה
        - תפסים כבדים ועמוד גרירה לתמרון באתרי בנייה
        - מבנה Hypalon עמיד לפגיעה ושחיקה
        - תצורות ישיבה גמישות — הובלת צוות או מצב מטען
