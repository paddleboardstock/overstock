tests:
  - title: בדיקת לחץ
    standard: ISO 6185-1 | מפרט פנימי AF-PT-001
    description: תאים מתנפחים מופעלים בלחץ של פי 1.25 מהמגבלה המומלצת ומוחזקים למשך 30 דקות. דעיכת לחץ נמדדת כדי לאמת את אטימות האוויר ושלמות המבנה של חומרים ותפרים.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: בדיקות פגיעה
    standard: מפרט פנימי AF-IT-002
    description: המוצרים חשופים לפגיעות מבוקרות ממשקלי נפילה סטנדרטיים וציוד מטוטלת. זה מעריך עמידות לנקרים, התפשטות קרעים ועמידות מבנית מול התנגשויות עם מכשולים, רציפים ופסולת.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV בדיקות התנגדות
    standard: ASTM G154 |ISO 4892-3
    description: דגימות חומר נחשפות לנורות UVA-340 בתאי התבלות מואצים למשך 1,000+ שעות. אנו מודדים שינוי צבע (Delta E), שמירת ברק ואובדן חוזק מתיחה כדי לאמת UV חבילות מייצב.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: בדיקות עמידות לשחיקה
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: דגימות חומר נחשפות לגלגלי CS-10 שוחקים תחת עומסים של 500g/1,000g למשך 1,000 מחזורים. אובדן מסה ודירוג שחיקה חזותי קובעים את עמידות הציפוי מול חול, חצץ ושיגור חוזר.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: בדיקות ביצועים בטמפרטורות נמוכות
    standard: מפרט פנימי AF-LT-003 | MIL-STD-810G
    description: המוצרים והקופונים המורכבים מותנים ב-20°C- - - 10°C ו-0°C למשך 24 שעות ואז עוברים בדיקות גמישות. אנו מאמתים זאת PVC Hypalon ושומרים על גמישות ללא סדקים או דילמינציה.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: בדיקת ציפה וקיבולת עומס
    standard: ISO 6185-1 |ISO 12402
    description: המוצרים נטענים בהדרגה לקיבולת מדורגת פי 1.25 בבריכה מבוקרת. מתועדים פריבורד, יציבות וביצועים מתנקזים עצמית. הקיבולת המדורגת של כל מודל מאומתת מתמטית ואמפירית.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: בדיקות תמרון
    standard: מפרט פנימי AF-MT-004
    description: ניסויים במים מודדים רדיוס סיבוב, תאוצה, זמן תכנון ותגובת משוטים/מנוע במגוון תנאי עומס. מאפייני הטיפול בעולם האמיתי מאומתים מול מטרות תכנון.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: בדיקות אטימות למים
    standard: ISO 6185-1 §7.3 | מפרט פנימי AF-WT-005
    description: כל מוצר מורכב נבדק בהתזה של 0.5 בר על כל התפרים, השסתומים והחיבורים. בדיקת טבילה בלחץ של 5 דקות מאשרת את אטימות המים של התא והשסתום. תקן אפס דליפה לפני המשלוח.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
testing_section:
  tagline: נהלי בדיקה
