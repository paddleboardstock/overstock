features3_reasons:
  tagline: למה לבחור Aquafarer
  title: שבע סיבות לשתף איתנו פעולה
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. ייצור אמיתי, לא מסחר
      description: אנחנו הבעלים והמפעילים של מפעל בגודל 12,000 מ"ר. כשאתה משתף פעולה עם Aquafarer, אתה עובד ישירות עם האנשים שמעצבים, מהנדסים ובונים את המוצרים שלך — בלי מתווכים.
      icon: tabler:building-factory
    - title: 2. גישה מונחית הנדסה
      description: תהליך העיצוב שלנו מתחיל מהמקרה השימושי, לא מקטגוריית המוצר. אנחנו מייעלים את צורת גוף הספינה, בחירת החומרים והתצורה לאופן שבו הסירה תשמש בפועל.
      icon: tabler:engine
    - title: 3. איכות מוסמכת
      description: CE מוסמך, ISO מערכת איכות, BSCI עומד REACH בתקנות, עומד בדרישות, USCG מאושר. CE64 הדגמים המוסמכים שלנו עומדים בסטנדרטים בינלאומיים — לא רק בתביעות.
      icon: tabler:certificate
    - title: 4. גמיש OEM/ODM
      description: צבעי צינורות, פריסת קונסולה, מיתוג, אריזה — אנחנו מתאימים אישית לפי המפרט שלך. אין לחץ מינימלי על הזמנה. התחל עם אב-טיפוס, התרחב בביטחון.
      icon: tabler:adjustments
    - title: 5. לוגיסטיקה גלובלית
      description: מחסן אמריקאי בקליפורניה, משלוח ישיר מצ'ינגדאו, הובלה אווירית להזמנות דחופות. אנחנו מטפלים בניירת ומסמכי מכס.
      icon: tabler:truck-delivery
    - title: 6. תמיכה לכל החיים
      description: אנחנו תומכים בסירות שבנינו לפני 20 שנה. חלקי חילוף אמיתיים, ייעוץ טכני, הכוונה לתיקון — הצוות שלנו זמין כשאתה צריך אותנו.
      icon: tabler:lifebuoy
    - title: 7. מפרט ישר
      description: דירוגי עומס אמיתיים, מידות אמיתיות, משקל אמיתי. אין אינפלציה שיווקית. מה שאנחנו מפרסמים זה מה שמקבלים — מאומת על ידי בדיקות עצמאיות.
      icon: tabler:ruler-measure
testimonials:
  tagline: אמין על ידי Brands Worldwide
  title: מה אומרים השותפים שלנו
  items:
    - content: עבדנו עם מספר יצרנים בסין, אך Aquafarer הם בולטים בתמיכה ההנדסית שלהם ובאיכות עקבית. הם מתייחסים למותג שלנו כאל שלהם.
      name: — OEM שותף, מותג ספורטי מים אירופי
    - content: ה-Hypalon RIBs שלהם נמצאים בשירות עם הצי שלנו כבר מעל 5 שנים. תחזוקה מינימלית, עמידות מצוינת ל-UV. האחריות לחמש שנים על הצינורות נותנת לנו ביטחון.
      name: — מפעיל צי, קבוצת נופש במזרח התיכון
    - content: צוות Aquafarer עזר לנו לפתח עיצוב לוח SUP מותאם אישית מהרעיון ועד לייצור תוך 90 ימים. האיכות עלתה על הציפיות שלנו.
      name: — מפיץ, ספורט ימי באוסטרליה
