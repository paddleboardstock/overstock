label: אַחֲרָיוּת
headline: Paddle Board Overstock אחריות מוגבלת של היצרן
subtitle: Paddle Board Overstock עומד מאחורי האיכות של כל מוצר ימי מתנפח שאנו מייצרים. אחריות מוגבלת זו מגדירה את התנאים וכיסוי המוצר שלך Paddle Board Overstock.
seo:
  headline: Paddle Board Overstock אחריות על סירות מתנפחות — אחריות מוגבלת ל-5 שנים | Paddle Board Overstock
  description: Paddle Board Overstock מציע אחריות מוגבלת של 5 שנים על בד הצינור הראשי, התפרים, ושלמות מבנית של גוף הפיברגלס. כמו כן מכסה שסתומי אוויר ואביזרים מותקנים במפעל. תנאים ומונחים מלאים של Paddle Board Overstock אחריות לסירה מתנפחת.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  אחריות מוגבלת זו חלה על מוצרי ימיים מתנפחים חדשים במותג Paddle Board Overstock שנרכשו ישירות מ-Paddle Board Overstock או מסוחר או קמעונאי מורשה Paddle Board Overstock. תאריך התחולה הוא תאריך הרכישה המקורי שניתן לאמת.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">כיסוי ותוקף האחריות</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 שנים</h3>
        <p class="text-sm text-gray-600 mt-1">שלמות בד הצינור הראשי (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 שנים</h3>
        <p class="text-sm text-gray-600 mt-1">שלמות מבנית של גוף הפיברגלס</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 שנים</h3>
        <p class="text-sm text-gray-600 mt-1">יכולת שמירת אוויר בתפרי הצינור המתנפח</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 שנים</h3>
        <p class="text-sm text-gray-600 mt-1">תפקוד שסתומי האויר</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">שנה אחת</h3>
        <p class="text-sm text-gray-600 mt-1">אביזרים מותקנים במפעל וחיבורים נלווים</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">שנה אחת*</h3>
        <p class="text-sm text-gray-600 mt-1">שימוש מסחרי, להשכרה או בצי — כל הרכיבים</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*שימוש מסחרי, ממשלתי, להשכרה או למטרת הדרכה מפחית את האחריות לשנה אחת. שימוש במרוצים או בתחרויות מבטל את האחריות לחלוטין.</p>
  </div>

  <h2>מה מכוסה</h2>
  <h3>בד הצינור הראשי (5 שנים)</h3>
  <p>Paddle Board Overstock מתחייב על בד הצינור הראשי מפני הידרדרות נקבוביות הפוגמת באופן מהותי ביכולת המוצר לשמור על תנאי התנפחות תפעוליים. זה חל על CSM (Hypalon) בד מצופה וכל שאר חומרי בד הצינור שבשימוש בייצור.</p>

  <h3>שלמות מבנית של גוף הפיברגלס (5 שנים)</h3>
  <p>למוצרים עם גוף פלסטיק מחוזק פיברגלס (FRP), המבנה המרכיבי הבסיסי מובטח מפני כשל מבני הנגרם מטעויות בחומרים או בייצור.</p>

  <h3>יכולת שמירת אוויר בתפרי הצינור המתנפח (5 שנים)</h3>
  <p>התפרים של הצינורות המתנפחים, אשר מצורפים במהלך הייצור, מובטחים מפני ליקויים בייצור שגורמים לדליפת אוויר משמעותית דרך התפר. בדיקה תקופתית ותחזוקת לחצי אוויר מתאימים הם תנאי הכיסוי.</p>

  <h3>תפקוד שסתומי האויר (5 שנים)</h3>
  <p>שסתומי אוויר מקוריים שהותקנו על ידי Paddle Board Overstock מובטחים מפני ליקויי ייצור בחומרים או בעבודה שמונעים מהשסתום לשמור אוויר כמתוכנן.</p>

  <h3>אביזרים מותקנים במפעל (שנה אחת)</h3>
  <p>רכיבים וחיבורים מיוצרים על ידי Paddle Board Overstock ומותקנים במפעל מובטחים מפני פגמים בחומר ובייצור למשך שנה אחת. זה אינו כולל פריטים של צד שלישי, הכוסים רק על ידי אחריות היצרן שלהם.</p>

  <h2>מה לא מכוסה</h2>
  <ul>
    <li>ליקויים קוסמטיים כולל שינוי צבע, כתמים, דהייה, ציטוט, או כל שינוי במראה</li>
    <li>חורים, חתכים, קרעים, קרעים או נזק פיזי אחר</li>
    <li>קריס, סדקים, שפשופים, שריטות או התדרדרות כתוצאה מחיכוך או מגע</li>
    <li>התדרדרות UV מחשיפה לאור, בליה או תנאי אטמוספירה</li>
    <li>נזק ממגע עם דלקים, ממסים, חומצות, אלקליים או כימיקלים</li>
    <li>נזק מרשלנות, שימוש לא נכון, התעללות, תאונה או בלאי רגיל</li>
    <li>בעיות בג'לקוט או בצבע (שלפוחיות, השתוללות, שינוי צבע, דהייה)</li>
    <li>נזק כתוצאה מפגיעה, לחץ, תמיכה לקויה או גרירה.</li>
    <li>נזק מאינפלציה/דפלציה לא נכונה או משימוש במכשירי אינפלציה לא מאושרים</li>
    <li>ציוד, רכיבים או מערכות של צד שלישי (המכוסים על ידי היצרנים שלהם)</li>
  </ul>

  <h2>חובת היצרן והפתרון</h2>
  <p>Paddle Board Overstockהחובה הבלעדית והבלעדית היא תיקון או החלפה, לפי Paddle Board Overstockבחירתך, של כל רכיב שנמצא כפגום בחומרים או בעבודת הייצור ומכוסה באחריות זו. תיקונים או החלפות מתבצעים על ידי Paddle Board Overstock או על ידי מתקן השירות המורשה המיועד לה. רכיבים שתוקנו או הוחלפו מובטחים רק לחלק הבלתי פג של תקופת האחריות המקורית.</p>

  <h2>תנאי אחריות</h2>
  <ul>
    <li><strong>רישום:</strong>המוצר חייב להיות רשום כראוי כפי שנדרש בתנאי האחריות.</li>
    <li><strong>תחזוקה:</strong>המוצר חייב להיות מתוחזק בהתאם Paddle Board Overstockלהנחיות שפורסמו, כולל בדיקה תקופתית ותחזוקה של לחצי אינפלציה מתאימים.</li>
    <li><strong>שיתוף פעולה:</strong>על הרוכש לשתף פעולה באופן מלא ומהיר Paddle Board Overstock בכל הנושאים הנוגעים לתביעות אחריות.</li>
    <li><strong>הקונה המקורי:</strong>אחריות זו מורחבת בלעדית למשתמש הקצה המקורי ואינה ניתנת להעברה.</li>
  </ul>

  <h2>שימוש מסחרי</h2>
  <p>אם המוצר משמש לשימוש מסחרי, ממשלתי, ללא מטרות רווח, שכירות, הדרכה או כל מטרה שאינה לשימוש פנאי פרטי, תקופת האחריות לכל הרכיבים מתקצרת לשנה אחת בלבד מתאריך הרכישה הקמעונאית המקורי. שימוש בתחרויות מרוצים, מהירות או סיבולת מבטל את האחריות באופן מיידי ובלתי הפיך.</p>

  <h2>איך להגיש תביעת אחריות</h2>
  <p>צרו קשר Paddle Board Overstock עם הסוחר המורשה שלכם עם הוכחת רכישה ותיאור מפורט של הבעיה.Paddle Board Overstock יבדוק את התביעה ויספק הוראות לבדיקה ושירות.</p>
  <p>לשאלות בנוגע לשירות אחריות, אנא צרו קשר דרך<a href="/contact" class="text-sky-600 underline">דף יצירת קשר</a>עם מספר ההזמנה ופרטי המוצר.</p>

  <h2>פריטים של צד שלישי</h2>
  <p>ציוד, רכיבים או מערכות שיוצרו על ידי צדדים שלישיים (גם אם Paddle Board Overstockהותקנו על ידי ) מכוסים אך ורק על ידי כל אחריות שמציעה היצרן שלהם.Paddle Board Overstock מתנער במפורש מכל אחריות אחריות על פריטים צד שלישי כאלה.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  הצהרת אחריות זו היא סיכום של כל Paddle Board Overstock האחריות המוגבלת של היצרן. המסמך המשפטי המלא של האחריות מסדיר את כל תנאי האחריות וההגבלות. מפרט הפרטי עשוי להשתנות ללא הודעה מוקדמת.Paddle Board Overstock הוא מותג מפעל של Paddle Board Overstock מרכז הייצור של צ'ינגדאו.
  </p>
