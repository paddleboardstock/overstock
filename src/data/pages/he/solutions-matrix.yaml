hero:
  tagline: מטריצת פתרונות לתעשייה
  title: פתרונות ימיים מבוססי תרחישים<br />למבצעים מקצועיים
  subtitle: סירות מתנפחות מהונדסות למטרה וRIBs מוגדרות לצורכי חילוץ, צי רכב להשכרה, סירת עזר למקלט או יאכטה, ולשימוש בדיג מסחרי — כל אחת מגובה במפרטי טכניים ואפשרויות התאמה אישית.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock פתרונות ימיים מקצועיים לתעשיות מגוונות
direct_answer: 'Paddle Board Overstock מספקת כלי שיט מתנפחים מהונדסים בתרחישים ופתרונות RIB לפעולות ימיות מסחריות: סירות חילוץ וסיור עם צינורות Hypalon מחוזקים ובטיחות רב-תאית, צי סירות להשכרה SUPs וקיאקים עם PVC בעובי 1.2 מ"מ ותפרים מוצמדי אוויר חם לעמידות נמוכה בתחזוקה, סירות יוקרה עם גוף אלומיניום V-עמוק RIBs, ותצורות דיג כבדות עם מחזיקי חכות ומערכות מחיה חיה.'
solution_a:
  tagline: פתרון א
  title: חילוץ ימי &<br />סיור מסחרי
  subtitle: בטיחות במהירות גבוהה עם תאים מרובים RIBs למענה חירום מקצועי ולפעולות אכיפת חוק.
  badge: Heavy-Duty Series
  description: סירות ההצלה והסיור הימיות שלנו RIBs בנויות עם צינורות אוויר Hypalon/PVC מחוזקים בצפיפות גבוהה הכוללים עיצוב ציפה עצמאי מרובה תאים. כל כלי שיט מצויד בחגורת רפלקטיבית מקצועית, קווי אחיזה לחילוץ ושסתומי מתיחה מהירה למוכנות לפריסה. גוף הסירה מפיברגלס Deep-V מספק יציבות יוצאת דופן במהירויות גבוהות ובתנאי ים סוער.
  features:
    - title: בטיחות רב-חללית
      description: 4–6 תא אוויר עצמאי — ניקוב של כל תא בודד שומר על ציפה חיובית
    - title: בד צינור מחוזק
      description: 1.2 מ"מ Hypalon CSM או 1,680 DTEX PVC עם תפרים מחוזקים בשכבת אוויר חמה כפולה
    - title: דרגת מקצועי
      description: SOLAS סרט רפלקטיבי, קווי הצלה, עוגני גרירה, חבל מהיר שחרור לציור
    - title: סיפון מהיר
      description: ספינת גוף עמוק-ו מבד סיבי זכוכית או אלומיניום בדירוג למהירות של 25–45 קשר תלוי בקונפיגורציה
  recommended_models:
    - RIB סיור 450
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: חומר גוף
      value: פיברגלס / אלומיניום בדרגת ימית
    - label: בד צינור
      value: 1.2 מ"מ Hypalon CSM / 1,680 DTEX PVC
    - label: מהירות מקסימלית
      value: 25–45 קשר
    - label: יְכוֹלֶת
      value: 6–12 אנשים
    - label: טווח מנוע
      value: 40–200 HP
    - label: תקינה
      value: CE / ISO 9001
solution_b:
  tagline: פתרון B
  title: השכרת ספורט ימי &<br />ציוד צי הפלזורה
  subtitle: מתנפחים עמידים במיוחד, דורשי תחזוקה נמוכה, SUPs, קיאקים וסירות שנבנו לשימוש שכירות יומי במלונות נופש, מועדונים ופעילויות תיירות.
  badge: Rental-Grade
  description: ציוד צי ההשכרה שלנו מתוכנן לעמידות הגבוהה ביותר ולעלות התחזוקה הנמוכה ביותר. אנו משתמשים בקוטר 1.2 מ"מ מחוזק PVC בטכנולוגיית תפרים מרותכים באוויר חם בשלוש שכבות, UV המתנגדת להתדרדרות ולנזקי התנגשות תכופים.Drop-stitch הבנייה מבטיחה שהלוחות שומרים על קשיחות גם לאחר מאות מחזורי השכרה. כל הדגמים כוללים טבעות D מחוזקות, רצועות מסילה עמידות לשחיקה ושסתומים מסחריים.
  features:
    - title: דרגת מסחר PVC
      description: 1.2 מ"מ מחוזק PVC עם מייצבים UV — עבה פי 3 מחומרים בדרגת צרכן
    - title: תפרים מרותכים באוויר חם
      description: ריתוך פי שלושה שכבות — חזק יותר מהדבקה, עמיד בפני התפצלות
    - title: Drop-Stitch נוקשות
      description: 1,680 DTEX ליבה עם 2 חוטים/אינץ׳ רבוע — מדורג ל-20 PSI לקשיחות הדומה ללוח קשה
    - title: עיצוב מוכן לצי
      description: חוגות D מחוזקות, שסתומי Halkey-Roberts מסחריים, רצועות מסילות עמידות לשחיקה
  recommended_models:
    - SUP התפרצות ג'יטה
    - SUP יורש האוקיינוס
    - AirDeck 360
    - RIB 330
  specifications:
    - label: חומר הצינור
      value: 1.0–1.2 מ"מ מחוזק PVC
    - label: טכנולוגיית תפר
      value: ריתוך באוויר חם בשלוש שכבות
    - label: לחץ מקסימלי
      value: 15–20 PSI (דגמים drop-stitch)
    - label: עמידות UV
      value: 1,000+ שעות בדיקה מואצות
    - label: אַחֲרָיוּת
      value: 2–5 שנים בהתאם לדגם
    - label: תַחזוּקָה
      value: מינימלי — לשטוף ולאחסן
solution_c:
  tagline: תמיסה C
  title: סירות שירות ליכטות<br />וסירות מים יוקרתיות
  subtitle: סירות שירות RIB קלות משקל וביצוע גבוה, שמיועדות לאחסון על סופרייתות ולהובלת אורחים עם גימור יוקרתי.
  badge: Premium Series
  description: סירות השירות שלנו RIBs משלבות מבנה קל משקל עם אסתטיקה יוקרתית. גוף אלומיניום או פיברגלס בעבודת Deep-V מספק איכות נסיעה יוצאת דופן והגבהה קלה לדוויט. זמינים עם גרפיקה על הצלחות תואמות צבע, ריפוד פרימיום ועיצובי קונסולה מותאמים אישית. מידות אחסנה קומפקטיות הופכות אותם לאידיאליים למגרשי גراج וסיפוני סופרייתות.
  features:
    - title: מבנה קל משקל
      description: גופי אלומיניום ברמה יממית מפחיתים את המשקל ב-30% לעומת פיברגלס להקלה בהגבהה
    - title: ביצוע Deep-V
      description: גוף עם זווית Deadrise של 18–22 מעלות לנסיעה חלקה במים גליים ומעקב מצוין
    - title: גימור והתאמה יוקרתיים
      description: ריפוד מותאם אישית, צינורות תואמים צבע, קונסולת הגה פרימיום, חבילת נירוסטה
    - title: אחסון קומפקטי
      description: מתוכנן לגראז'י סופרייתות — צינורות מתנפחים לאחסון קומפקטי
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: סוג גוף
      value: אלומיניום / פיברגלס Deep-V
    - label: Deadrise
      value: 18–22 מעלות
    - label: מהירות מקסימלית
      value: 30–40 קשר
    - label: משקל יבש
      value: 120–350 ק"ג (גוף אלומיניום)
    - label: מוכן להעלאה בדוויט
      value: כן — נקודות הרמה סטנדרטיות
    - label: אִחסוּן
      value: צינורות מתנפחים, ניתנים לערימה
