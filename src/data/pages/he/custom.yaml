hero:
  tagline: Aquafarer מעבדה מותאמת
  title: עצב את שלך<br />סירה
  subtitle: OEM, ODM, תווית פרטית, ושירותי מיתוג מותאם אישית לעסקים ברחבי העולם. מפרוטוטייפ אחד ועד לייצור מלא.
  cta: התחל את הפרויקט שלך
  footer_link: /contact
steps_section:
  tagline: איך זה עובד
  title: מהרעיון לייצור
  subtitle: ארבעה צעדים מהרעיון שלך למוצר גמור, מוכן לים.
  steps:
    - num: '01'
      title: בחר את הלוח שלך
      desc: בחר מתוך הדגמים המרכזיים שלנו — SUP, קיאק, דינגי, או RIB. בחר גודל, חומר וצבע.
    - num: '02'
      title: העלה את העיצוב שלך
      desc: שלחו לנו את הלוגו, העיצוב או קווי המותג שלכם. צוות העיצוב שלנו מכין הוכחה דיגיטלית.
    - num: '03'
      title: סקירת דגם ראשוני של בינה מלאכותית
      desc: צפה במוקאפ מציאותי שנוצר על ידי בינה מלאכותית של הלוח המותאם אישית שלך לפני שהייצור מתחיל.
    - num: '04'
      title: ייצור ואספקה
      desc: לאחר אישור, ההזמנה שלך נכנסת לקו הייצור שלנו המוסמך ב-ISO. זמני ההובלה החל מ-30 יום.
services_section:
  tagline: שירותים
  title: שירותי ייצור למותגים עולמיים
  subtitle: מודלים גמישים של מעורבות — מייצור על חוזה ועד לבניית מותג מלאה עם שירות מלא.
  items:
    - title: OEM ייצור
      desc: אנחנו מייצרים את העיצובים שלך לפי המפרט — הקניין הרוחני שלך, השרטוטים שלך, תקני האיכות שלך. הגנה מלאה NDA.
      icon: ⚙️
    - title: ODM פתרונות
      desc: בחר מתוך 50+ פלטפורמות מוכחות והתאם אישית גודל, צבע, גרפיקה ואריזה.
      icon: 🎨
    - title: מותג פרטי
      desc: המוצר שלך עם המותג שלנו — לוגו, אריזות, תגי תלייה, מדריכים. מוכן למכירה מיד מהקופסה.
      icon: 🏷️
    - title: מיתוג מותאם
      desc: הדפסת פד על סיפון, גרפיקה על גוף הספינה, מדבקות לצינורות ותוויות מותאמות אישית — שילוב מלא של המותג.
      icon: ✨
capabilities_section:
  tagline: יכולות
  title: יכולות ייצור והתאמה אישית
  subtitle: הכל מה שצריך לדעת לפני שמבצעים את ההזמנה שלך.
  capabilities:
    - label: היקף ההזמנה
      value: MOQ 5–10 יחידות (SUP/קיאק), 2–5 יחידות (RIB)
    - label: זמן אספקה
      value: 30–45 יום סטנדרטי; 15–20 יום לאבות טיפוס
    - label: התאמה אישית
      value: גודל, צורה, צבע, גרפיקה, אריזה, חומרה
    - label: חומרים
      value: PVC, Hypalon, drop-stitch, סיבי זכוכית, אלומיניום
    - label: הדפסה
      value: דיגיטלית (CMYK), הדפסת מסך, העברת חום, סובלימציה
    - label: תקינה
      value: CE, ISO 9001, BSCI, UKCA (תמיכה בציות גלובלי)
why_section:
  tagline: למה Aquafarer
  title: מפעל אחד. סטנדרט אחד. אפס פשרות.
  points:
    - text: מתקן ייצור משולב בגודל 12,000 מ"ר
      highlight: 12,000 מ"ר
    - text: 200-300 עובדים ומהנדסים מיומנים
      highlight: 200-300
    - text: 15,000 סירות מיוצרות בשנה
      highlight: 15,000
    - text: ISO ניהול איכות מוסמך 9001
      highlight: ISO 9001
    - text: CE מוצרים מוסמכים לשוק האיחוד האירופי
      highlight: CE
  cta: צפו בפרטי המפעל
  cta_link: /factory
  contact:
    title: מוכנים לדון בפרויקט שלכם?
    desc: הצוות שלנו מגיב תוך 24 שעות עם הצעת מחיר ראשונית.
