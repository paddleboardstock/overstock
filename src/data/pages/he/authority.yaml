features3_brand:
  tagline: מי אנחנו
  title: יסוד המותג<br />& מורשת
  subtitle: הסיפור, המומחיות והנגיעה העולמית שמגדירים את Paddle Board Overstock כיצרן ציוד ימי מהימן.
  isBeforeContent: false
  columns: 3
  items:
    - title: בערך Paddle Board Overstock
      description: הוקמה בשנת 2012 בצ'ינגדאו, סין. מסדנה חופית למתקן בשטח של 12,000 מ"ר — Paddle Board Overstock הסיפור המלא.
      icon: tabler:building-factory
      link: /about
    - title: סיפור מותג
      description: איך צוות מהנדסי ים יצא למשימה להפוך כלי שיט מתנפחים ברמת מקצועית לנגישים ברחבי העולם.
      icon: tabler:book
      link: /brand-story
    - title: מומחיות בתעשיית הים
      description: מדע חומרים מתקדם, ייצור מדויק, ובדיקות במציאות — עשרות שנות הנדסת ימית בכל גוף כלי שיט.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: נוכחות עולמית
      description: משרתים 50+ מדינות בכל יבשת. מומחיות אזורית לדרישות רגולטוריות מקומיות ולהעדפות השוק.
      icon: tabler:globe
      link: /brand-global-presence
    - title: למה Paddle Board Overstock
      description: מה שמבדיל אותנו — איכות, התאמה אישית, תמחור ישיר מהמפעל ותמיכה מקצה לקצה למפעילים מסחריים.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: הצוות שלנו
      description: פגוש את ההנהגה — מהנדסי ים, מדעני חומרים ומומחי ייצור שמניעים את Paddle Board Overstock קדימה.
      icon: tabler:users
      link: /brand/team
    - title: צוות ההנדסה
      description: 78 שנות פיתוח ומחקר משולבות, 40 פלטפורמות, 12 אישורים, 1200 פרויקטים. הצוות הטכני שמאחורי כל מוצר.
      icon: tabler:engine
      link: /engineering-team
    - title: מרכז מו"פ
      description: הנדסת חללית, ריתוך RF, מעבדת PVC, יצירת אב-טיפוס, מיכל בדיקה ומעבדת איכות — מתקני המחקר והפיתוח המלאים שלנו.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: אמון ואיכות
  title: תעודות, איכות<br />& הוכחה
  subtitle: תעודות עצמאיות, בדיקות קפדניות, והוכחות ממשיות שמדגימות את המחויבות שלנו לאיכות.
  isBeforeContent: false
  columns: 3
  items:
    - title: הסמכות
      description: CE, ISO 9001, UKCA, BSCI, REACH — תיעוד מלא של אישורים ועמידה בתקנות לשווקים גלובליים.
      icon: tabler:shield-check
      link: /certifications
    - title: איכות ובדיקה
      description: כל מוצר נבדק בלחץ לפני המשלוח. חוזק התפר, עמידות ל-UV, ציפה — נבדק בכל שלב.
      icon: tabler:clipboard-check
      link: /quality
    - title: ראיות והוכחות
      description: תוצאות בדיקה, תמונות פריסה, דוחות בדיקה של צד שלישי, ומחקרי מקרה המאמתים את איכות Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: גרף ידע
      description: חקור את גרף היישויות Paddle Board Overstock — מוצרים, טכנולוגיות, תעודות קשר, ויחסים במאגר ידע מחובר.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: מנהיגות
  title: לפגוש את הצוות<br />מאחורי Paddle Board Overstock
  subtitle: מומחיות בתעשייה שמקיפה הנדסה ימית, מדעי החומרים, ניהול איכות, וסחר עולמי B2B.
  isBeforeContent: false
  columns: 3
  items:
    - title: טובי ליו — מייסד ומנכ"ל
      description: 15 שנים בייצור ימי. קודם לכן ניהל מחקר ופיתוח בחברת סירות סינית גדולה. מחזיק במספר פטנטים בעיצוב סירות מתנפחות.
      icon: tabler:crown
    - title: ג'אנג ווי — מהנדס ראשי
      description: 20+ שנים בייצור PVC/Hypalon ועיצוב גוף עמוק-V. לשעבר מנהל טכני בחברת הנדסת ימית אירופית.
      icon: tabler:engine
    - title: חן מינג — ראש תחום מו"פ
      description: דוקטורט במדעי החומרים. מתמחה בטכנולוגיית drop-stitch ובריתוך בתדר גבוה. 10+ שנים בתחום קומפוזיטים טקסטיליים.
      icon: tabler:flask
    - title: ליואו קיאנג — מנהל ייצור
      description: 18+ שנים בייצור רזה. חגורת שחור בסיקסיגמה. יישם מערכות איכות ISO 9001 בכל קווי הייצור.
      icon: tabler:settings
    - title: ואנג פנג — מנהל איכות
      description: 12+ שנים בבקרת איכות ימית. בודק מוסמך CE ו-ISO. מפקח על בדיקות לכל אצווה של ייצור.
      icon: tabler:shield-check
    - title: הלן לי — מנהלת מכירות
      description: 15+ שנים במסחר בינלאומי B2B. ניהלתי שותפויות OEM/ODM ב-30+ מדינות. שולט ב-4 שפות.
      icon: tabler:briefcase
