hero:
  tagline: מרכז סמכות
  title: למה Paddle Board Overstock?<br />אמון שנבנה לאורך עשור
  subtitle: כל סירה שאנו בונים נושאת את משקל של 10+ שנים של הנדסת ימית, מערכות איכות מוסמכות, ואלפי פעולות מוצלחות ברחבי העולם. זו הסיבה שמקצוענים בתעשייה בוחרים ב-Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock מתקן ייצור ימי וצוות מהנדסים
