  tagline: מקרים בולטים
  title: פתרונות מותאמים אישית<br />לאתגרים אמיתיים
  isBeforeContent: false
  columns: 3
  items:
    - title: שדרוג תפעול יומי במרכז הצלילה בבאלי
      customer: מרכז הצלילה באוקיינוס הכחול
      country: אינדונזיה
      industry: מרכז הצלילה המסחרית
      challenge: מרכז הצלילה Blue Ocean בבאלי הפעיל סירת צלילה ישנה מפיברגלס עם שטח דק מוגבל, עלייה קשה לצוללנים ותחזוקה גבוהה בתנאי מים מלוחים טרופיים. טעינת הציוד הייתה צפופה, זמן ההכנה היה ארוך, והפלטפורמה הלא יציבה יצרה חששות בטיחותיים לתיירים בינלאומיים — כולל צוללנים בפעם הראשונה ונוסעים מבוגרים. המרכז מפעיל 3-5 טיולי צלילה ביום, 200+ ימים בשנה.
      solution: Paddle Board Overstock סיפקה צלילה מקצועית מותאמת אישית באורך 6.8 מטר RIB עם פריסת סיפון מורחבת המותאמת לאחסון ציוד צלילה, סולם צלילה רחב מפלדת אל-חלד, צינורות כבדים Hypalon UV לעמידות בפני מי מלח, משטח סיפון נגד החלקה ופתרון אחסון במיכלים. התצורה עוצבה סביב תהליך העבודה היומי של מרכז הצלילה — לא מבוססת על סירת פנאי סטנדרטית.
      product: צלילה מקצועית RIBב-6.8 מטר
      results: שטח עבודה גדול יותר שיפר את יעילות הכנת הציוד. הצוללנים חוו עלייה בטוחה וקלה יותר. דרישות התחזוקה ירדו משמעותית. המרכז קיבל קיבולת לטפל ביותר לקוחות בעונת השיא בביטחון רב יותר. זה RIB הפך לבסיס לפעולות הצלילה היומיות.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: סירת הצלילה שלנו אינה רק תחבורה. היא הבסיס לפעילות היומית שלנו.Paddle Board Overstock RIB מעניקה לצוות שלנו יותר ביטחון כאשר הם מבצעים מספר טיולי צלילה מדי יום.
      icon: tabler:lifebuoy
    - title: שדרוג מקצועי במרכז הצלילה בפוקט RIB
      customer: מרכז הצלילה לאוקיינוס אקספלורר
      country: תאילנד
      industry: מרכז הצלילה המסחרית
      challenge: מרכז הצלילה Ocean Explorer בפוקט, תאילנד, נדרש לשדרג מספינת צלילה מסורתית מפיברגלס שלא יכלה לעמוד בביקוש הגובר של הלקוחות. שטח סיפון מוגבל הפך את הכנת הציוד לבלתי יעיל. עלייה קשה יצרה אתגרי בטיחות לתיירים בינלאומיים. דרישות תחזוקה גבוהות בתנאי מים מלוחים טרופיים הגדילו את עלויות התפעול. המרכז מפעיל מספר נסיעות יומיות, 200+ ימים בשנה.
      solution: Paddle Board Overstock סיפקה צלילה מסחרית מותאמת אישית באורך 6.8 מטר RIB עם סידור עבודה אופטימלי לאחסון מיכלי צלילה, הכנת ציוד ותנועת צוללנים. המאפיינים כללו סולם צלילה רחב עם מעקות נירוסטה, מבנה צינורות כבד עם UVחומרים עמידים, רצפת נגד החלקה, פתרון אחסון מיכלים, קונסולה מקצועית ומושבי נוסעים — כולם מותאמים לפעולות צלילה מסחריות.
      product: צלילה RIBמסחרית 6.8 מ'
      results: שטח הסיפון הגדול יותר אפשר ארגון ציוד מהיר יותר וזרימת עבודה יומית יעילה יותר. נוחות ובטיחות העלייה ללקוחות השתפרו משמעותית. זמן ההשבתה של התחזוקה פחת עם בנייה בגובה ים. מרכז הצלילה יכול היה לשרת יותר לקוחות בעונת השיא ולהרחיב את שירותי הצלילה המקצועיים בביטחון.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: עבור מרכז צלילה, הסירה אינה רק תחבורה. היא חלק חשוב מהפעילות היומית שלנו.Paddle Board Overstock RIB היא נותנת לצוות שלנו ביטחון לבצע מספר מסעות צלילה בכל יום עם בטיחות ויעילות טובה יותר.
      icon: tabler:lifebuoy
    - title: צי מרכז הצלילה האירופי
      customer: מרכזי הצלילה BlueMed
      country: יוון
      industry: צלילה ותיירות ימית
      challenge: נדרשו 12 צלילה מוגדרות RIBs לשרשרת מרכזי צלילה ברחבי מספר איים יווניים. כל סירה דרשה סולם צלילה מותאם אישית, אחסון מיכלים ל-8 מיכלים ופלטפורמה יציבה לכניסת צוללנים במים פתוחים. הצי היה צריך להגיע תוך 60 יום לקראת תחילת עונת התיירות.
      solution: ייצרה 12 RIB דגמי 520 Dive עם מתקני מיכלים משולבים, סולמות צלילה וצינורות רחבים במיוחד Hypalon ליציבות עלייה. כל סירה סומנה בצבע הצי של הלקוח. כל 12 הצוללות נבדקו בלחץ ונשלחו מקינגדאו בתוך 55 יום.
      product: RIB 520 Dive
      results: כל 12 הסירות נמסרו בזמן לעונת התיירות. הצי פועל מדי יום כבר 18+ חודשים ללא תקלות חומריות. הלקוח הזמין 6 יחידות נוספות בשנה השנייה.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB ה-520 Dive הייתה עמוד השדרה של פעילות הצלילה היומית שלנו. היציבות במנוחה מצוינת, ופריסת אחסון המיכל שומרת על הדק נקי ובטוח לאורחים שלנו.
      icon: tabler:lifebuoy
    - title: תוכנית המפיצים האוסטרלית OEM
      customer: פסיפיק ווטרספורטס בע"מ
      country: אוסטרליה
      industry: OEM/ODM ייצור
      challenge: מפיץ אוסטרלי היה זקוק SUP לטווח לוחות מותג פרטי במחירים תחרותיים כדי להתחרות במותגים סיניים שמכניסים ישירות לצרכן. דרשו 8 דגמים ייחודיים שמכסים מתחילים ועד מתקדמים, עם גרפיקה מותאמת אישית, אריזות מותאמות אישית ומשלוח דרופ-שיט לחנויות קמעונאיות.
      solution: פיתח 8 SUP דגמים (הכל-סביב, טיולים, יוגה, ילדים, ספורט, אולטרה-קומפקט, אולטרה-יציב, מים לבנים) עם חבילת גרפיקה אוסטרלית בלעדית. אריזות קמעונאיות מותאמות אישית עם קודי QR המקשרים לסרטוני ההגדרה. לוגיסטיקה דרופשיפ מוגדרת מקינגדאו ישירות לחנויות קמעונאיות באוסטרליה.
      product: קו קסטום SUP (8 דגמים)
      results: הקונספט למשלוח הראשון תוך 90 יום. שיעור מכירה קמעונאי של 85% בעונה הראשונה. המפיץ הרחיב את השותפות לכלול קו סירות מתנפחות בשנה השנייה.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock סופק קו שלם SUP ב-90 יום — מהעיצוב הראשוני ועד רצפת הקמעונאות. האיכות משתווה למותגים שנמכרים במחיר כפול.
      icon: tabler:arrows-exchange
    - title: אספקת סירות חילוץ למזרח התיכון
      customer: רשות ההגנה האזרחית הלאומית
      country: איחוד האמירויות הערביות
      industry: חיפוש והצלה
      challenge: ארגון ההגנה האזרחית היה זקוק ל-20 סיור מוכנים RIBs לחיפוש והצלה חופי, אבטחת נמלים ותגובה לשיטפונות. דרשו סיפונים להוצאה עצמית, סוויטות ניווט מלאות (GPS, רדאר, VHF), צינורות כתומים בעלי נראות גבוהה, ועמידה בתקנות ימיות מקומיות.
      solution: סיפקה 20 RIB דגמי 450 פטרול עם סיפונים להחלקה עצמית, מערכות ניווט של Garmin, פנסי LED, SOLAS סרט רפלקטיבי וצינורות כתומים בעלי נראות Hypalon גבוהה. כל סירה CEעברה הסמכה ונבדקה לפי ISO תקני 6185. חבילת התיעוד כללה תעודות עמידה ברישום מקומי.
      product: RIB סיור 450
      results: הצי פרס ב-5 תחנות חוף. הסירות פעלו בחום קיצוני (45°C+) ללא התדרדרות בצינורות. טווח הסיור ויעילות הדלק עלו על המפרט ב-12%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: RIB סיור 450 עלה על הדרישות המבצעיות שלנו. בתנאי חום קיצוני, Hypalon הצינורות אינם מראים סימני UV התדרדרות לאחר 24 חודשי שימוש יומיומי.
      icon: tabler:alert-triangle
    - title: OEM שותפות מותג אירופית
      customer: ציוד ימי צפון בים BV
      country: הולנד
      industry: OEM/ODM ייצור
      challenge: מותג ימי אירופי ותיק רצה להתרחב RIB לשוק מבלי להשקיע במתקני ייצור. נזקק לשותף בעל תווית לבנה שיכול לייצר 5 RIB דגמים (3.9 מיליון עד 6.2 מיליון) עם מיתוג פרטי, CE הסמכה וזכויות הפצה בלעדיות באיחוד האירופי.
      solution: הוקם הסכם ייצור לבן-מותג ל-5 RIB דגמים. כל דגם ממותג בלוגואים של לקוחות וסכמת צבעים.CE תיעוד הסמכה הוכן לכל דגם. זכויות הפצה בלעדיות של האיחוד האירופי עם התחייבויות מינימלית להזמנות כספיות. תיעוד טכני וקטלוג חלקי חילוף סופקו לרשת השירות המקומית.
      product: קו מותאם RIB אישית (5 דגמים)
      results: הסכם רב-שנתי נחתם. סדרת הייצור הראשונה של 50 יחידות נשלחה בתוך 75 ימים. המותג הושק ב-METSTRADE עם קבלת פנים חיובית מהסוחרים.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: העבודה Paddle Board Overstock אפשרה לנו להיכנס RIB לשוק מבלי לבנות מפעל — הם סיפקו פתרון מלא עם CE אישורים ותיעוד תמיכה מהסוכנות.
      icon: tabler:building
    - title: צי אתרי הנופש הקריביים
      customer: פארדייז איילנד ריזורטס בע"מ
      country: בהאמאס
      industry: תיירות ימית ואירוח
      challenge: 'אתר הנופש היוקרתי דרש צי מלא של ציוד ספורט ימי לפעילויות האורחים: 40 SUP לוחות לסיורים מודרכים, 20 קיאקים לחקר הלגונה, 10 סירות מתנפחות להעברת אורחים וטיולי דיג, בנוסף לאביזרים. כל הציוד דרש מיתוג מותאם אישית של אתר הנופש והיה צריך להימסר לפני עונת השיא של התיירות.'
      solution: "חבילת ספורט ימי מלאה יוצרה: 40 SUP לוחות וויאג'ר (דגם רב-מסביב), 20 קיאקים של אקספלורר, 10 AirDeck סירות מתנפחות בגודל 360, בנוסף ל-PFD, משוטים, משאבות וערכות תיקון. כל הציוד מודפס עם לוגו אתר הנופש וסכמת צבעים טרופיים. משלוח מכולות עם רשימת מלאי מלאה."
      product: חבילת ספורט ימי מלאה (70+ יחידות)
      results: הצי הגיע 6 שבועות לפני עונת השיא. ציוני שביעות הרצון של האורחים מפעילויות ספורט ימי עלו ב-40% משנה לשנה. הציוד החזיק מעמד 3 עונות עם תחזוקה שגרתית בלבד.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: גישת החבילה המלאה גרמה לכך שקיבלנו את כל מה שהיינו צריכים במשלוח אחד — לוחות, קיאקים, סירות ואביזרים – כולם ממותגים ומוכנים לשימוש האורחים. האורחים שלנו אוהבים את איכות הציוד.
      icon: tabler:beach
    - title: שדרוג מרכז הצלילה המסחרי של קווינסלנד RIB
      customer: מרכז הצלילה המסחרית
      country: אוסטרליה
      industry: צלילה מסחרית ושירותים ימיים
      challenge: מרכז צלילה מסחרי בקווינסלנד המתמחה בבדיקת תשתיות ימיות, תחזוקת נמלים ותיקון תת-ימי, הפעיל סירת עבודה מיושנת. ככל שהביקוש לפרויקטים גדל, הספינה הישנה הפכה לנטל — תחזוקה תכופה גרמה להפרעות בלוחות זמנים, הפריסה לא תוכננה לפעילות צלילה מודרנית (מקום מוגבל לצילינדרים, כלים וציוד), ונוחות הצוות במהלך פעולות ארוכות הייתה ירודה. החברה הייתה זקוקה לכלי שיט שיכול לתמוך בפעילותה המקצועית בכל יום עבודה.
      solution: Paddle Board Overstock ביצעה ניתוח תפעולי מפורט של תהליך הצלילה של הלקוח, משך הפרויקט הטיפוסי, גודל הצוות ודרישות הציוד. בהתבסס על ניתוח זה, Paddle Board Overstock סופק מקצוען מותאם RIB אישית עם פריסת סיפון פונקציונלית המותאמת להכנת ציוד ותנועת צוללן, מושבים מקצועיים לתקופות הובלה ארוכות יותר, יציבות משופרת לכניסה ויציאה בטוחה יותר, ותכונות תמיכה לצלילה משולבות בעיצוב.
      product: צלילה RIBמקצועית בהתאמה אישית
      results: החדשה RIB הפכה לפלטפורמת עבודה יומית אמינה. הכנת הציוד הפכה למהירה יותר עם הפריסה האופטימלית. הצוות דיווח על שיפור בנוחות ובבטיחות במהלך פעולות ארוכות. המראה המקצועי של הסירה חיזק את ביטחון הלקוחות בעבודה עם מפעילי נמל וקבלני ים. מרכז הצלילה קיבל כלי שיט שהתאים למקצועיות של שירותו.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: היינו צריכים סירה שיכולה לתמוך בעסק שלנו בכל יום, לא רק כלי שייט לצורך תחבורה. Paddle Board Overstock עבדה איתנו כדי להבין את דרישות התפעול שלנו וסיפקה פתרון RIB שמתאים לזרימת העבודה של צלילות מסחרית שלנו.
      icon: tabler:lifebuoy
    - title: חוזה סיור חופי של ארה"ב
      customer: סוכנות ביטחון חופי אטלנטי
      country: ארצות הברית
      industry: ביטחון ימי ואכיפת חוק
