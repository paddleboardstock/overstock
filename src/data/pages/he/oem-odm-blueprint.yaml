hero:
  tagline: OEM/ODM תוכנית התאמה אישית
  title: ייצור מותאם אישית ולבן-תווית<br />לסירות מתנפחות
  subtitle: ממהות ועד מיכל — Aquafarer מציעה שירותי OEM/ODM מלאים לסירות SUPs מתנפחות, קיאקים, RIBs, ודינגי עם MOQs נמוך, הנדסת תבניות תלת-ממד מותאמות אישית, ועמידה מלאה ב-CE/BSCI.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer מתקן OEM/ODM בייצור בקינגדאו
direct_answer: Aquafarer הוא שותף ישיר מהמפעל ל-OEM/ODM, המספק התאמה אישית מלאה לסירות SUPs מתנפחות, סירות, ו-RIBs, עם MOQs נמוך (5–10 יחידות), הנדסת תבניות תלת-ממד מותאמות אישית, ועמידה מלאה ב-CE/BSCI. מיוצר במרכז הייצור צ'ינגדאו — מתקן בגודל 12,000 מ"ר עם תעודת ISO 9001.
