process_steps:
  title: תהליך 6 שלבים OEM/ODM
  subtitle: מקצר עיצוב ל-FOB צינגדאו — זרימת עבודה ממוקדת
  steps:
    - number: '01'
      title: תקציר עיצוב ודגם CAD תלת-ממדי
      description: שתף את המפרט הרצוי, מוצר ייחוס או רעיון. צוות ההנדסה שלנו מפתח שרטוטי CAD מפורטים והדמיות תלת-ממד לאישורך.
      timeline: 3–5 ימים
    - number: '02'
      title: בחירת חומר ובדיקת בד
      description: בחר מבין חומרי PVC בדרגת צבא (0.9–1.2 מ"מ), Hypalon CSM, או בדים עם ליבת drop-stitch. אנו מבצעים בדיקות חוזק מתיחה, אחיזת הציפוי, ויציבות UV.
      timeline: 2–3 ימים
    - number: '03'
      title: מהירות פרוטוטייפ וייצור דוגמות
      description: אנו CNC-מכנים תבניות מותאמות אישית ומייצרים דגימות לפני ייצור עם צבעי המותג שלך, לוגו וחומרים שציינת. דגימות נשלחות לאישורך.
      timeline: 7–14 ימים
    - number: '04'
      title: בדיקת החזקת לחץ גבוה 24–48 שעות
      description: כל פרוטוטייפ עובר בדיקות שמירה על לחץ קפדניות בלחץ של 1.25x הלחץ הנקוב. מבוצעות בדיקות קריעת תפרים ואימות מידות.
      timeline: 1–2 ימים
    - number: '05'
      title: CE/ISO בדיקת איכות ואריזה
      description: רשימת בדיקה איכותית של 100 נקודות. כל יחידה נבדקת לפני האריזה המוכנה למכירה. CE הצהרת התאמה ודוח עמידה ב-BSCI כלולים.
      timeline: 2–3 ימים
    - number: '06'
      title: FOB משלוחים ולוגיסטיקה בקינגדאו
      description: מוצרים מוגמרים מקובצים על משטחים, נעטפים בניילון ורוכזו במכולות בנמל קינגדאו. כוללת תיעוד ייצוא מלא, שחרור מהמכס ומעקב בזמן אמת.
      timeline: 7–14 ימים
