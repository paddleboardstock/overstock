tldr:
  summary: >-
    Six-stage quality control system: material inspection, in-process QC,
    welding verification, assembly QC, pressure testing at 1.25x rated, and
    final inspection. 100% unit pressure testing. 99.3% defect-free rate per
    AQL 2.5 sampling.
  points:
    - >-
      Six-stage QC: material inspection, in-process QC, welding verification,
      assembly QC, 1.25x pressure testing, and 100-point final inspection
    - 100-point final inspection on every board before packing
    - >-
      100% of units undergo 24-48h hold at 1.25x rated pressure with max 5%
      drop tolerance
    - AQL 2.5 sampling ensuring 99.3% defect-free rate
    - >-
      Welding QC: peel testing, weld width verification, and backlight seam
      inspection on every welded joint
