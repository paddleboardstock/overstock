content_challenge:
  tagline: The Challenge
  title: 'Marine Research Demands<br />Stable, Instrument-Ready Platforms'
  subtitle: 'Scientific workboats must provide a stable platform for sensitive instrumentation, quiet operation to avoid disturbing wildlife, and flexible layouts for diverse research equipment.'
  paragraphs:
    - 'Marine research and environmental monitoring require workboats that serve as mobile laboratories. Unlike commercial or recreational vessels, research RIBs must accommodate sensitive electronic instrumentation, water and sediment sampling equipment, and sometimes live specimen transport — all while maintaining a stable platform for accurate data collection.'
    - '**Platform stability is critical** — Sonar, echo sounders, and CTD (conductivity, temperature, depth) profilers require a stable hull at rest and at slow speed. Excessive wake or hull movement introduces noise into scientific data. A deep-V hull with good stability characteristics is essential.'
    - '**Instrument integration** — Research vessels need mounting points for GPS antennas, sonar transducers, sampling arms, and data logging equipment. Console space must accommodate multiple displays, power distribution for instruments, and secure storage for sensitive electronics.'
    - '**Quiet operation** — For marine biology surveys and environmental monitoring, engine noise and hull vibration can scare marine life and compromise behavioral observations. Quiet outboard configurations and reduced-vibration hull designs are important for research applications.'
    - 'Aquafarer research RIBs are designed with stable hull platforms, integrated equipment mounting systems, and quiet outboard configurations for scientific and environmental monitoring applications.'
content_solution:
  tagline: Our Solution
  title: 'Purpose-Built Research RIBs<br />For Science & Environmental Work'
  subtitle: 'Every Aquafarer research RIB is configured as a stable, customizable platform for scientific instrumentation and field sampling equipment.'
  list:
    - 'Deep-V fiberglass hull with excellent stability at rest and at slow survey speeds'
    - 'Flat deck layout with equipment mounting plates for sonar, GPS, and sampling gear'
    - 'Console configured for multiple displays — plotter, sounder, data logger'
    - '12V and 24V accessory power distribution for scientific instruments'
    - 'Quiet 4-stroke outboard — minimal vibration and noise for wildlife surveys'
    - 'Optional low-wake hull design for minimal disturbance during data collection'
    - 'Custom tube colors for research institution branding and fleet identification'
content_segments:
  tagline: Research Profiles
  title: 'Marine Science Solutions<br />By Application Type'
  subtitle: 'Different research applications have unique vessel requirements — from university teaching platforms to environmental survey vessels to water quality monitoring RIBs.'
  items:
    - title: University Marine Science Programs
      subtitle: 'Teaching platforms, student field trips, coastal research'
      description: 'Marine science universities and oceanography departments need reliable, versatile workboats for teaching field courses, student research projects, and faculty-led coastal surveys. The boat must be easy to operate for students under supervision, stable enough for hands-on instrument deployment, and durable enough for frequent use by multiple users across academic terms. Budget constraints in academic settings make cost-effectiveness and low maintenance important considerations.'
      features:
        - 'Stable platform for student instrument deployment and recovery practice'
        - 'Easy operation — tiller or single-console configuration for supervised student use'
        - 'Durable Hypalon tubes for frequent beach landings and student handling'
        - 'Equipment mounting for teaching-grade sonar, secchi disk, and sampling gear'
        - 'Cost-effective PVC option for budget-constrained academic programs'
    - title: Marine Research Institutes
      subtitle: 'Survey RIBs with instrument integration, GPS, sampling equipment'
      description: 'Dedicated marine research organizations conducting coastal and offshore surveys need professionally configured survey RIBs with integrated instrumentation. These vessels carry sonar systems for bathymetric mapping, CTD profilers for water column analysis, sediment samplers, and biological collection equipment. The boat must provide a stable platform at slow survey speeds, have ample deck space for equipment deployment, and offer clean 12V/24V power for electronics.'
      features:
        - 'Integrated sonar transducer mounting — through-hull or transom configuration'
        - 'GPS antenna mounting and console integration for survey-grade navigation'
        - 'CTD and water sampler deployment area with secure tie-down points'
        - '12V/24V auxiliary power distribution for instruments and data loggers'
        - 'Stable at slow speed (3-6 knots) for survey line accuracy'
        - 'Optional A-frame or davit for deploying heavier sampling equipment'
    - title: Environmental Monitoring & Conservation
      subtitle: 'Ecological surveys, wildlife observation, habitat assessment'
      description: 'Environmental NGOs, government agencies, and conservation organizations conduct marine ecological surveys, wildlife population monitoring, and habitat assessments. These operations require quiet, low-impact vessels that can approach sensitive habitats without disturbing wildlife. Boats need to carry camera equipment, GPS for transect mapping, and sampling gear for water and sediment collection. Low wake and minimal engine noise are critical for behavioral observation studies.'
      features:
        - 'Quiet 4-stroke outboard — minimal disturbance to marine wildlife'
        - 'Stable observation platform for photography and video documentation'
        - 'Equipment mounting for camera rigs, GPS trackers, and field computers'
        - 'Shallow draft for accessing coastal wetlands, mangroves, and estuaries'
        - 'Easy-cleaning deck and tube surfaces for decontamination between sites'
    - title: Water Quality Monitoring & Testing
      subtitle: 'Regular sampling runs, pollutant tracking, compliance monitoring'
      description: 'Water quality monitoring organizations perform regular sampling runs across coastal zones, harbors, and inland waterways to track pollution levels, algal blooms, and compliance with environmental regulations. These operations need efficient, reliable boats for repeated visits to fixed sampling stations. The vessel must carry sampling equipment, coolers for sample preservation, and field testing gear — with easy deck washing between sampling sites to prevent cross-contamination.'
      features:
        - 'Dedicated sampling station area with cooler and equipment storage'
        - 'Easy-clean deck and tube surfaces for between-site decontamination'
        - 'GPS integration for precise return to fixed sampling coordinates'
        - 'Compact size for access to restricted waterways and narrow channels'
        - 'Fuel-efficient outboard for cost-effective regular sampling runs'
