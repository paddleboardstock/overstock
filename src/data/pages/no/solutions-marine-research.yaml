content_challenge:
  tagline: Utfordringen
  title: Havforskningskrav<br />Stabile, instrumentklare plattformer
  subtitle: Vitenskapelige arbeidsbåter må gi en stabil plattform for sensitiv instrumentering, stille drift for å unngå å forstyrre dyrelivet, og fleksible oppsett for mangfoldig forskningsutstyr.
  paragraphs:
    - Marin forskning og miljøovervåking krever arbeidsbåter som fungerer som mobile laboratorier. I motsetning til kommersielle eller fritidsfartøy må undersøkelses-RIBer romme følsom elektronisk instrumentering, utstyr for vann- og sedimentprøvetaking og noen ganger transport av levende prøver — samtidig som en stabil plattform opprettholdes for nøyaktig datainnsamling.
    - '**Plattformstabilitet er kritisk** — Sonar, ekkolodd og CTD-profiler (konduktivitet, temperatur, dybde) krever et stabilt skrog i ro og ved lav fart. Overdrevent kjølvann eller skrogbevegelser introduserer støy i vitenskapelige data. Et dyp-V-skrog med gode stabilitetsegenskaper er avgjørende.'
    - '**Instrumentintegrasjon** — Forskningsfartøyer trenger festepunkter for GPS-antenner, sonartransdusere, prøvetakingsarmer og dataloggerutstyr. Konsollplassen må romme flere skjermer, strømforsyning for instrumenter og sikker oppbevaring av følsom elektronikk.'
    - '**Stille drift** — Ved marinbiologiske undersøkelser og miljøovervåking kan motorstøy og skrogvibrasjoner skremme marint liv og kompromittere atferdsobservasjoner. Stille utbordmotorkonfigurasjoner og skrogkonstruksjoner med reduserte vibrasjoner er viktige for forskningsanvendelser.'
    - Aquafarers forsknings-RIBer er konstruert med stabile skrogplattformer, integrerte festesystemer for utstyr og stille utbordmotorkonfigurasjoner for vitenskapelige og miljøovervåkende anvendelser.
content_solution:
  tagline: Vår løsning
  title: Formålsbygde forsknings-RIB-er<br />For vitenskap og miljøarbeid
  subtitle: Hver Aquafarer forsknings-RIB er konfigurert som en stabil, tilpassbar plattform for vitenskapelig instrumentering og feltprøveutstyr.
  list:
    - Dyp-V-skrog i glassfiber med utmerket stabilitet i ro og ved lave undersøkelsesfarter
    - Flatt dekklayout med festplater for utstyr til sonar, GPS og prøvetakingsutstyr
    - Konsoll konfigurert for flere skjermer — plotter, ekkolodd, datalogger
    - 12V- og 24V-tilbehørsstrømforsyning for vitenskapelige instrumenter
    - Stille 4-takts utbordmotor — minimal vibrasjon og støy for faunakartlegging
    - Valgfri skrogkonstruksjon med lavt kjølvann for minimal forstyrrelse under datainnsamling
    - Egendefinerte tubefarger for profilering av forskningsinstitusjoner og flåteidentifisering
content_segments:
  tagline: Forskningsprofiler
  title: Marine Science Solutions<br />Etter søknadstype
  subtitle: Ulike forskningsapplikasjoner har unike fartøykrav - fra universitetsundervisningsplattformer til miljøundersøkelsesfartøyer til RIB-er for overvåking av vannkvalitet.
  items:
    - title: Universitetets havvitenskapsprogrammer
      subtitle: Undervisningsplattformer, studentturer, kystforskning
      description: Havvitenskapelige universiteter og oseanografiavdelinger trenger pålitelige, allsidige arbeidsbåter for undervisning i feltkurs, studentforskningsprosjekter og fakultetsledede kystundersøkelser. Båten må være enkel å betjene for studenter under tilsyn, stabil nok for praktisk utplassering av instrumenter, og holdbar nok til hyppig bruk av flere brukere på tvers av akademiske termer. Budsjettbegrensninger i akademiske miljøer gjør kostnadseffektivitet og lite vedlikehold viktige hensyn.
      features:
        - Stabil plattform for studenters øving i utsetting og gjenhenting av instrumenter
        - Enkel betjening — rorpinne- eller enkeltkonsollkonfigurasjon for overvåket studentbruk
        - Slitesterke Hypalon-tuber for hyppige strandlandinger og håndtering av studenter
        - Utstyrsfesting for undervisningsrettede sonar, secchiskive og prøvetakingsutstyr
        - Kostnadseffektiv PVC-løsning for akademiske programmer med stramt budsjett
    - title: Havforskningsinstitutter
      subtitle: Survey RIBer med instrumentintegrasjon, GPS, prøvetakingsutstyr
      description: Dedikerte havforskningsorganisasjoner som utfører kyst- og offshoreundersøkelser trenger profesjonelt konfigurerte undersøkelses-RIBer med integrert instrumentering. Disse fartøyene har sonarsystemer for batymetrisk kartlegging, CTD-profiler for vannsøyleanalyse, sedimentprøvetakere og biologisk oppsamlingsutstyr. Båten må gi en stabil plattform ved lave undersøkelseshastigheter, ha god dekksplass for utplassering av utstyr, og tilby ren 12V/24V strøm for elektronikk.
      features:
        - Integrert sonartransduserfesting — gjennom skroget eller på akterspeilet
        - GPS-antennefesting og konsollintegrasjon for navigasjon i undersøkelsesklasse
        - Uttplasseringsområde for CTD og vannprøvetaker med sikre festepunkter
        - 12V/24V-hjelpestrømforsyning for instrumenter og dataloggere
        - Stabil ved lav fart (3–6 knop) for nøyaktighet i undersøkelseslinjer
        - Valgfri A-frame eller davitt for utsetting av tyngre prøvetakingsutstyr
    - title: Miljøovervåking og bevaring
      subtitle: Økologiske undersøkelser, viltobservasjon, habitatvurdering
      description: Miljøorganisasjoner, offentlige etater og naturvernorganisasjoner gjennomfører marine økologiske undersøkelser, overvåking av dyrelivsbestander og habitatvurderinger. Disse operasjonene krever stillegående fartøyer med lav innvirkning som kan nærme seg følsomme habitater uten å forstyrre dyrelivet. Båter må ha med seg kamerautstyr, GPS for transektkartlegging og prøvetakingsutstyr for vann- og sedimentoppsamling. Lav våkne og minimal motorstøy er avgjørende for atferdsobservasjonsstudier.
      features:
        - Stille 4-takts utbordmotor — minimal forstyrrelse av marint liv
        - Stabil observasjonsplattform for foto- og videodokumentasjon
        - Utstyrsfesting for kamerarigger, GPS-trackere og feltdatamaskiner
        - Grunn dybdegående for tilgang til kystvåtmarker, mangrove og estuarier
        - Lettrengjorte dekk- og tubeflater for dekontaminering mellom lokaliteter
    - title: Overvåking og testing av vannkvalitet
      subtitle: Regelmessige prøvetaking, sporing av forurensninger, overvåking av samsvar
      description: Vannkvalitetsovervåkingsorganisasjoner utfører regelmessige prøvetaking over kystsoner, havner og indre vannveier for å spore forurensningsnivåer, algeoppblomstring og overholdelse av miljøforskrifter. Disse operasjonene trenger effektive, pålitelige båter for gjentatte besøk på faste prøvetakingsstasjoner. Fartøyet må ha med seg prøvetakingsutstyr, kjølere for prøvekonservering og felttestingsutstyr – med enkel dekkvask mellom prøvetakingsstedene for å forhindre krysskontaminering.
      features:
        - Egendefinert område for prøvetakingsstasjon med kjøleboks og utstyroppbevaring
        - Dekk og tubeflater som er lette å rengjøre for dekontaminering mellom lokaliteter
        - GPS-integrasjon for presis tilbakevending til faste prøvetakingskoordinater
        - Kompakt størrelse for tilgang til begrensede farvann og smale kanaler
        - Drivstoffsparende utbordmotor for kostnadseffektive regelmessige prøvetakingsturer
