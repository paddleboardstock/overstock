hero:
  tagline: Produksjonskapasitet
  title: Produksjonskapasitet og årsproduksjon
  subtitle: Anlegg på 12 000 m² som produserer 15 000 båter per år med mulighet for skalering

intro: Aquafarer driver et av de største spesialiserte anleggene for produksjon av oppblåsbare båter i Qingdao, Kina. Fabrikken vår på 12 000 m² er organisert i seks spesialiserte verksteder som arbeider parallelt, noe som gir oss kapasitet til å produsere 15 000 båter årlig innen SUP-, kajakk-, jolle-, RIB- og sikkerhetsutstyrslinjer.

highlights:
  - value: 12,000 m²
    label: Totalt produksjonsareal
    detail: Fordelt på 6 spesialiserte verksteder
  - value: 15,000
    label: Båter produsert per år
    detail: SUP-er, kajakker, RIB-båter, joller, sikkerhetsutstyr
  - value: 200-300
    label: Kvalifisert arbeidskraft
    detail: 25+ ingeniører, 2 skift/dag
  - value: 50+
    label: Eksportland
    detail: EU, USA, AU, Midtøsten, Asia
  - value: 30–45
    label: Standard leveringstid (dager)
    detail: Fra PO-bekreftelse til FOB
  - value: 10+
    label: Års eksporterfaring
    detail: Siden 2012

workshops:
  - title: SUP-brettproduksjon
    description: '4 parallelle monteringslinjer for oppblåsbare SUP-brett. Hver linje kan produsere 50–80 brett per skift. Digitale trykk- og silkscreentrykkstasjoner kjører samtidig. Årlig SUP-kapasitet: 8 000+ brett.'
    output: 8 000+ SUP/år
  - title: RIB-båtproduksjon
    description: 'Dedikert verksted for glassfiberskrog med 6 formstasjoner for RIB-skrog opp til 7,6 m. Området for rørsveising og montering håndterer 3–5 RIB-båter samtidig. Årlig RIB-kapasitet: 2 000+ båter.'
    output: 2 000+ RIB/år
  - title: Oppblåsbar båt og jolle
    description: 'Flerbruks produksjonslinjer for oppblåsbare båter, kajakker og joller. Varmluftsveisestasjoner, RF-dielektriske presser og monteringsarbeidsplasser konfigureres på nytt basert på ordremiks. Årlig kapasitet: 5 000+ enheter.'
    output: 5 000+ enheter/år
  - title: Sikkerhetsutstyr
    description: 'Separat renromsproduksjonsområde for redningsvester og sikkerhetsutstyr. Dedikert søm, innsetting av skum og teststasjoner. Årlig kapasitet for redningsvester: 50 000+ enheter.'
    output: '50 000+ redningsvester/år'

oem_capacity:
  moq: 'SUP: 5–10 enheter | RIB: 2–5 enheter | Kajakk/jolle: 10–20 enheter | Tilpasset form: 200+ enheter'
  lead_time: 'Standard 30–45 dager. Prøve 15–20 dager. Hurtiglevering tilgjengelig.'
  payment: 'T/T 30% depositum + 70% før forsendelse. L/C, Western Union aksepteres.'
