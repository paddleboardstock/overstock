features3_solutions:
  tagline: Løsninger
  title: Ditt vanneventyr<br />Forretningspartner
  isBeforeContent: false
  columns: 3
  items:
    - title: Vannsportklubber
      description: Komplette utstyrspakker, tilpasset merkevarebygging og vedlikeholdsprogrammer for SUP-klubber, kajakkklubber, surfeskoler og treningssentre.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vannsport RIBer
      description: Spesialbygde RIB-er for seilskoler, vannsportsentre og eventorganisasjoner. Rutebåter, slepebåter og marskalkfartøyer for profesjonell vannsport.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Feriesteder og hoteller
      description: Premium vannsportprogrammer med flåteutstyr, sikkerhetssystemer, opplæring av personalet og inntektsstyring for gjestfrihetseiendommer.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Water Brand Entreprenører
      description: Private label OEM/ODM produksjon med lave MOQs, tilpasset produktdesign, emballasje og global frakt for nye merkeeiere.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Dykkesenter båter
      description: Stabile RIB-plattformer med enkel inn-/utstigning, oppbevaring av utstyr og motorløsninger optimalisert for dykkeoperasjoner.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Rednings- og Nødfartøy
      description: Høyhastighets-RIB-er og gummibåter konstruert for søk og redning, beredskap og kystvaktoperasjoner.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Tenderløsninger for Yachter
      description: Kompakte, stilrene RIB-tendere som utfyller superyachter og fritidsbåter. Enkel oppbevaring, kraftig ytelse.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Fiskebåtløsninger
      description: Stabile, holdbare gummibåter og RIB-er konfigurert for kommersielt og fritidsfiske.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Utstyr for Maritim Turisme
      description: Flottklare gummibåter, SUP-brett og kajakker for resorter, turoperatører og utleie av vannsport.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Offshore Energy RIBer
      description: Kraftige RIB-er for støtte for olje- og gassplattformer, overføring av mannskap på vindkraftverk, inspeksjon av undervannskabel og marin konstruksjon.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Arbeidsbåter for akvakultur
      description: Korrosjonsbestandige RIB-er for fiskeoppdrett, perledyrking og havbedrift. Hypalon rør, maskinvare i rustfritt stål, holdbarhet ved daglig bruk.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Havforskning og undersøkelse
      description: Stabile instrumentklare RIB-er for oseanografisk forskning, miljøovervåking, vannkvalitetsprøvetaking og universitetsundervisningsprogrammer.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Kommersielle Arbeidsbåter
      description: Tunge RIB-er for patrulje, oppmåling, transport og offshore-logistikk. Bygget for de krevende kravene i kommersiell drift.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Ikke sikker på hvilken vei som passer din bedrift?
  subtitle: Fortell oss om operasjonen din – vi vil anbefale riktig utstyrspakke, merkevareprogram eller tilpasset løsning.
  actions:
    - variant: primary
      text: Få en gratis konsultasjon
      href: /contact

