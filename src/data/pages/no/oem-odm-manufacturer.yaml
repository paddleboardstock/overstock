breadcrumb: OEM/ODM-produsent
tldr:
  summary: Aquafarer er en OEM/ODM-produsent som leverer direkte fra fabrikk. Anlegg på 12 000 m² med ISO 9001:2015-sertifisering, årlig produksjon på 15 000 enheter, CE/BSCI/REACH/UKCA-samsvar, lave MOQ fra 2-10 enheter.
  points:
    - Fabrikk i Qingdao på 12 000 m², ISO 9001:2015-sertifisert
    - Årlig kapasitet på 15 000 enheter med 200-300 dyktige arbeidere
    - Samsvar med CE 2013/53/EU, UKCA, BSCI, REACH
    - 'Lave MOQ: 2-5 enheter (RIB), 5-10 enheter (SUP) for standardmodeller'
    - Eksport til over 50 land med FOB Qingdao-frakt
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015-sertifisert
      desc: Kvalitetsstyringssystem revidert av SGS på alle produksjonslinjer.
      variant: cert
    - icon: ⭐
      title: CE- og UKCA-samsvar
      desc: Fullt samsvar med EU 2013/53/EU og britiske merkingskrav.
      variant: cert
    - icon: ⭐
      title: BSCI-sosial revisjon
      desc: Verifiserte etiske arbeidspraksiser og standarder på arbeidsplassen.
      variant: standard
    - icon: ⭐
      title: Lav MOQ fra 2 enheter
      desc: 'Standard RIB-modeller fra 2-5 enheter, SUP fra 5-10 enheter. Skreddersydd form: 200+.'
      variant: standard
process_section:
  eyebrow: Vår prosess
  title: Helhetlig OEM/ODM-arbeidsflyt
  subtitle: Fra designbrief til containerlasting — seks steg til ditt oppblåsbare vannfartøy med eget merkevare.
  steps:
    - step: '01'
      title: Spesifikasjon & designbrief
      desc: Del målspesifikasjoner, CAD-tegninger eller et referanseprodukt. Vårt ingeniørteam gjennomgår materialer, dimensjoner og samsvarskrav (CE, BSCI) før vi priser.
    - step: '02'
      title: 3D-formprototypeutvikling
      desc: Vi konstruerer og CNC-freser skreddersydde former for SUP-brett, kajakkskrog og RIB-komponenter. Prototypeeksempler produseres innen 15-20 virkedager for din godkjenning.
    - step: '03'
      title: Materialval & prøveproduksjon
      desc: Velg mellom PVC i militærkvalitet (0,9-1,2 mm), Hypalon CSM eller drop-stitch kjernestoff. Vi produserer forproduksjonsprøver i dine merkevarefarger, logo og emballasje for endelig godkjenning.
    - step: '04'
      title: CE-fabrikksrevisjon & samsvar
      desc: Hver OEM-ordre inkluderer samsvarsdokumentasjon — CE-samsvarserklæring, ISO 9001-sporbarhetsregistre, BSCI-sosial samsvarsrapport og REACH-materialerklæringer.
    - step: '05'
      title: Serieproduksjon & inline kvalitetskontroll
      desc: Produksjonsrunder følger vår 100-punkts kvalitetssjekkliste. Hver enhet gjennomgår 24-timers trykkholdstesting, søm-skaleringstesting og visuell inspeksjon før pakking.
    - step: '06'
      title: FOB Qingdao-logistikk & frakt
      desc: Ferdige varer pallelastes, krympepakkes og containerlastes i Qingdao havn. Vi håndterer all eksportdokumentasjon, tollklarering og tilbyr sanntidssporing av forsendelser.
capabilities_section:
  eyebrow: Produksjonskapasitet
  title: Hva vi bygger
  subtitle: Seks kjernekapasiteter i produksjon for globale B2B-partnere.
  items:
    - title: Drop-stitch SUP-brettproduksjon
      desc: Fullengdes drop-stitch kjernelaminering for stive høytrykks- (15-20 PSI) stand-up paddle-brett. Skreddersydd lengde, bredde, tykkelse, rockerprofil og grafisk design.
    - title: Produksjon av oppblåsbare PVC-båter
      desc: Høyfrekvenssveisede PVC joller, tendere og sportsbåter. Flere kammerkonfigurasjoner, gulvalternativer (spiler, luftdekk, rullbart) og integrering av tilbehør.
    - title: Hypalon RIB-fabrikasjon
      desc: Hypalon CSM-rør i kommersiell kvalitet limt på glasfiber- eller aluminiums dyp-V-skrog. Lengder fra 3,3 m til 6,0 m for patrulje-, rednings-, tur- og dykkeoperasjoner.
    - title: Private label & skreddersydd merkevarebygging
      desc: 'Komplett private label-tjeneste: skreddersydd logo i varmetransfer eller silkescreentrykk, merkevareemballasje (butikkesker, bæreposer), bruksanvisninger på ditt språk samt strekkode/UPC-registrering.'
    - title: Skreddersydd form- og verktøykonstruksjon
      desc: Internt 3D CAD/CAM-ingeniørteam. Vi konstruerer og lager skreddersydde aluminium- og komposittformer for unike skrogformer, dekkonfigurasjoner og tilbehørskontakter.
    - title: OEM-tilbehør og kitting
      desc: Redningsvester (CE 12402), dobbeltvirkende pumper, karbon/nylon-padler, reparasjonskit, bæreposer og leash. Komplett kitting og pakking for salgsklar presentasjon.
experience_section:
  eyebrow: Reel erfaring
  title: Partnerskap som bygde merkevarer
  subtitle: Ekte historier fra merkevarer og organisasjoner som valgte Aquafarer for OEM/ODM-produksjon.
  stories:
    - quote: Vi kom til Aquafarer med en skisse på en serviett og en liste med krav. Åtte måneder senere hadde vi et produksjonsklart produkt som besto CE-sertifisering på første forsøk.
      narrative: En europeisk oppstartsbedrift med en nyskapende SUP-design henvendte seg til Aquafarer for ODM-produksjon. Aquafarers FoU-team førte konseptet gjennom CAD-konstruksjon, FEA-strukturanalyse, hydrodynamisk simulering, formfremstilling, prototypeproduksjon og produksjonsverktøy. Grunnleggeren besøkte Qingdao tre ganger under prosessen. Sluttproduktet besto CE-sertifisering uten noen modifikasjoner — et resultat grunnleggeren tilskriver Aquafarers ingeniørteams forståelse av europeiske regulatoriske krav fra starten.
      context: Lansering av europeisk SUP-merkevare, 2023-2024
      source: Merkevaregrunnlegger
    - quote: Nivået på NDA-beskyttelse og IP-sikkerhet hos Aquafarer gir oss tryggheten til å dele våre proprietære konstruksjoner. De behandler vår IP som om den var deres egen.
      narrative: Et amerikansk selskap innen marint utstyr med proprietær ventilteknologi trengte en produksjonspartner som kunne beskytte deres IP samtidig som de produserte i skala. Etter å ha revidert fem kinesiske produsenter valgte de Aquafarer basert på fabrikkens IP-beskyttelsesprotokoller, sikker håndtering av designfiler og vilje til å signere strenge NDA-er. Partnerskapet har produsert tre produktlinjer over fire år uten en eneste IP-hendelse.
      context: Amerikansk selskap innen marint utstyr, OEM-partnerskap siden 2021
      source: VP Drift
