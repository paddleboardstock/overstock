hero:
  tagline: Marin ekspertise
  title: 'Tiår med marin ingeniørkunst<br />i hvert skrog'
  subtitle: 'Paddle Board Overstock kombinerer dyp materialvitenskap, presisjonsproduksjon og tester i virkeligheten for å lage fartøy som presterer når det gjelder.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstocks marinteknikk- og FoU-team i arbeid
expertise_materials:
  tagline: Materialvitenskap
  title: 'Riktig materiale<br />for hvert bruksområde'
  subtitle: 'Vi arbeider med tre kjernematerialer — hvert valgt for spesifikke bruksområder og ytelseskrav.'
  columns: 3
  items:
    - title: Marint PVC
      description: '1100 denier PVC-stoff — vårt mest allsidige materiale. UV-stabilisert, slitesterkt og REACH-etterlevelig. Ideelt for fritidsbåter, SUP-brett og kajakker der vekt og kostnadseffektivitet er viktig.'
      icon: tabler:droplet
    - title: Hypalon/CSM i premiumkvalitet
      description: 'Overlegen kjemikaliemotstand og UV-stabilitet. Hypalon-båter kan vare 15-20 år med riktig pleie. Anbefales for kommersielle, rednings- og militære anvendelser der langsiktig holdbarhet er kritisk.'
      icon: tabler:shield
    - title: Glasfiber og aluminium
      description: 'Dyp-V glasfiberskrog for RIB-båter og patruljebåter — bølgekuttende ytelse i krevende forhold. Aluminimumsskrog for tunge kommersielle arbeidsbåter som krever maksimal styrke og lastekapasitet.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Produksjonskapasitet
  title: 'Presisjonsproduksjon<br />i hvert steg'
  subtitle: 'Vårt anlegg på 12 000 m² er utstyrt med spesialiserte maskiner for hvert produksjonstrinn.'
  columns: 2
  items:
    - title: CNC-kutting
      description: 'Datamaskinstyrt kutting sikrer presise, repeterbare stoffpaneler med minimalt svinn. Hver del passer nøyaktig som designet.'
      icon: tabler:cpu
    - title: Høyfrekvenssveising
      description: 'Industriell HF-sveising skaper sømmer sterkere enn basismaterialet. Konsekvent temperatur- og trykkstyring sikrer lufttette forseglinger i hver produksjonsrunde.'
      icon: tabler:bolt
    - title: Drop-stitch-kjernemontering
      description: 'Tusenvis av polyestertråder binder sammen stoffets øvre og nedre lag og muliggjør høytrykksoppblåsing (15-20 PSI) for stive, stabile SUP-brett og gulv.'
      icon: tabler:building-arch
    - title: Trykktesting
      description: 'Hvert oppblåsbare produkt trykktestes før forsendelse. RIB-rør testes på 1,25x nominelt trykk — holder det der, presterer det på vannet.'
      icon: tabler:wind
    - title: Sømstyrketesting
      description: 'Tilfeldige prøver fra hvert produksjonsparti gjennomgår destruktive sømstyrketester. Resultater logges og kan spores til spesifikke produksjonsrunder.'
      icon: tabler:files
    - title: Vanntesting
      description: 'Hver RIB-modell gjennomgår sjøtesting før sertifisering. Tester i virkelige kystforhold validerer ytelse, håndtering og stabilitet.'
      icon: tabler:ripple
expertise_design:
  tagline: Design og ingeniørarbeid
  title: 'Utviklet for virkelige forhold'
  subtitle: 'Vår designfilosofi starter med hvordan båten skal brukes — deretter bygges ingeniørarbeidet rundt det bruksområdet.'
  items:
    - title: Dyp-V skrogdesign
      description: "Våre glasfiberskrog har beregnede V-vinkler, optimalisert for hver modells lengde og tiltenkte bruk. Brattere V for ytelse i røft farvann, grunnere for stabilitet."
    - title: Flerkammersikkerhet
      description: 'Hver båt har 3-7 uavhengige luftkamre. Blir ett rom kompromittert, holder de resterende kamrene båten flytende og operativ.'
    - title: Ergonomisk layout
      description: 'Konsollposisjon, rørhøyde og seteplassering er utformet rundt operatørens komfort ved langvarig bruk — enten det er patruljering, fiske eller transport.'
    - title: Tilpasset konfigurasjon
      description: 'Rørfarger, konsollkonfigurasjon, drivstoffkapasitet, tilbehørsfester — hver modell kan tilpasses spesifikke operative krav.'
cta:
  title: 'Har du en spesifikk anvendelse i tankene?'
  subtitle: 'Vårt ingeniørteam kan gi råd om materialvalg, design og produksjon for prosjektet ditt.'
  actions:
    - variant: primary
      text: Spør våre ingeniører
      href: /contact
    - text: Se produktutvalget
      href: /products
