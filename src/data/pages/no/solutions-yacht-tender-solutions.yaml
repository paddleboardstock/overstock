content_challenge:
  tagline: Utfordringen
  title: Yachttendere krever<br />ytelse og presentasjon
  subtitle: En yachttender er mer enn en jolle — den er en forlengelse av moderskipet og et kvalitetsstatement.
  paragraphs:
    - Yachteiere og kapteiner trenger anbud som fungerer godt, oppbevares kompakt og presenterer vakkert. Anbudet skal utfylle yachtens estetikk samtidig som det gir pålitelig transport for gjester og mannskap.
    - '**Lagring er kritisk** — Anbudet må passe på dekk, i en garasje eller på daviter. Vekt betyr noe for oppskytnings- og gjenopprettingssystemer. Aquafarer RIB-er tilbyr utmerkede kraft-til-vekt-forhold med kompakte lagringsprofiler.'
    - '**Forventningene til ytelsen er høye** — Gjester forventer en jevn, tørr tur når de overføres til land. Motoralternativer må balansere hastighet, rekkevidde og støynivåer for en førsteklasses opplevelse. For chartervirksomhet går anbudet daglig og skal tåle hyppig bruk.'
    - '**Utseende betyr noe** — Et anbud som ikke samsvarer eller er slitt, forringer den generelle yachtpresentasjonen. Egendefinerte rørfarger, møbeltrekk og merkevarebygging sikrer at anbudet ser ut som det hører hjemme.'
content_solution:
  tagline: Vår løsning
  title: Anbudskonfigurasjoner<br />For hver yachtapplikasjon
  subtitle: Aquafarer RIB anbud kan tilpasses for å matche fartøy, operasjonstype og lagringskrav – fra superyachtbyggerspesifikasjoner til charterflåteprogrammer.
  list:
    - Egendefinerte rørfarger for å matche eller komplementere moderfartøyet – alle RAL-farger tilgjengelig for Hypalon eller PVC rør
    - Tilpasset møbeltrekk og sømmer — førsteklasses vinyl i marinekvalitet med fargetilpasning og logobroderi
    - Konsoll- eller rorkultstyring — velg basert på bruksmønster og operatørens preferanser
    - Glassfiber deep-V skrog for jevn, tørr tur under varierende sjøforhold
    - Kompakt oppbevaring – tømmer luften eller hekker for dekkgarasje, skap eller davitoppbevaring
    - Hypalon-rør for UV-motstand og langsiktig bevaring av utseende
    - Løftepunkter og sleperinger standard på alle modeller
    - Valgfritt buetrekk, heldeksel og beskyttende gnagsår
    - 'Motorområde: 15 HP til 60 HP — påhengsmotor eller rorkultkonfigurasjoner'
    - OEM/privat merking tilgjengelig for yachtbyggere og marineforhandlere
content_segments:
  tagline: Kundeprofiler
  title: Yacht Tender Solutions<br />Etter kundetype
  subtitle: Ulike yachtindustrisegmenter har unike krav. Aquafarer konfigurerer anbud for å matche hver applikasjon.
  items:
    - title: Superyacht-byggere
      subtitle: OEM anbudsintegrasjon — tilpassede dimensjoner, farger og materialer
      description: 'Yachtbyggere står overfor en tilbakevendende utfordring: Hvert nytt fartøy har unike dimensjonsbegrensninger, vektbegrensninger og estetiske forventninger. Anbudet må integreres perfekt med moderfartøyets davit-system, passe innenfor presise garasjedimensjoner og matche designspråket til en multi-million-euro yacht. Eventuell uoverensstemmelse – feil rørfarge, feil plassering av løftepunkt, inkompatibel vekt – forsinker levering og reflekterer dårlig på byggherren. Aquafarer jobber direkte med byggherreanskaffelses- og designteam for å levere anbud med tilpassede RAL-rørfarger, matchende møbeltrekk, merkede konsollpaneler og fulle OEM dokumentasjonspakker.'
      features:
        - Egendefinerte dimensjonsspesifikasjoner som samsvarer med garasje- og davitbegrensninger
        - Enhver RAL-rørfarge og matchende møbeltrekk — designgodkjenningsprøver leveres
        - OEM merkevarebygging på konsoll, rør og seterygger
        - Validering av løftepunkt og davit passform for hver modell
        - Skrogvekt optimalisert for spesifiserte lanserings- og gjenopprettingssystemer
        - Masseleveringsplanlegging i tråd med produksjonstidslinjer
    - title: Yachtadministrasjonsselskaper
      subtitle: Flåtestandardiserte anbud — global støtte, minimal nedetid
      description: Forvaltningsselskaper fører tilsyn med flere yachter som opererer over Middelhavet, Karibia, Sør-Stillehavet og utover. Kjernebehovet deres er pålitelighet - et ødelagt anbud i en ekstern havn betyr overtid for mannskap, gjesteklager og dyre erstatninger i siste liten. Standardiserte flåtespesifikasjoner reduserer treningstiden for mannskap på tvers av fartøyer og forenkler håndtering av reservedeler. Aquafarer tilbyr flåtepriser for flere fartøyer, konsistente spesifikasjoner på tvers av bestillinger og global reservedelsstøtte for administrasjonsselskaper med fartøy i flere regioner.
      features:
        - Standardiserte spesifikasjoner på tvers av hele administrerte flåte
        - Utskiftbare reservedeler på tvers av alle flåteanbud
        - Flåtepriser og volumrabatter for bestillinger med flere enheter
        - Global tilgjengelighet av reservedeler — rask levering til enhver havn
        - Konsekvent service- og vedlikeholdsdokumentasjon for mannskap
        - Leveringskoordinering med flere enheter til forskjellige fartøyslokasjoner
    - title: Yacht charter operatører
      subtitle: Høyfrekvente daglige operasjoner — holdbarhet uten at det går på bekostning av utseendet
      description: 'Charteranbud står overfor den mest straffende operasjonelle planen i yachtindustrien: daglige gjestetransporter, landturer, vannsportstøtte og havneanbud - ofte over 200 operasjoner per chartersesong. Anbudet må se perfekt ut for hver gjesteoverlevering samtidig som det tåler kontinuerlig ombordstigning, saltvannseksponering og motortimer. Utseendeforringelse er et direkte forretningsproblem - et slitt anbud påvirker gjesteanmeldelser og charterpriser. Aquafarer konfigurerer charteranbud med oppgradert møbeltrekk, kraftige Hypalon-rør og forsterkede håndteringsområder for langsiktig holdbarhet som opprettholder presentasjonskvaliteten.'
      features:
        - Kraftige Hypalon-rør — 5-8 års levetid i daglig chartertjeneste
        - Forsterkede påstigningstrinn og håndteringshåndtak for hyppig bruk
        - Førsteklasses flekkbestandig vinyltrekk — enkel rengjøring mellom charter
        - Sklisikre dekkflater som er enkle å rengjøre
        - Pålitelige påhengsmotorpakker med enkel servicetilgang for tett behandlingstid
        - Materialer av kosmetisk kvalitet som opprettholder utseendet på tvers av chartersesongene
    - title: Yachtforhandlere og -meglere
      subtitle: Pålitelig tilbudsforsyning for ferdigstillelse av fartøy og videresalgsverdi
      description: Forhandlere og meglere trenger en stabil tilførsel av kvalitetsanbud som utfyller fartøyene de selger – som matcher merkevareposisjonering og forbedrer kjøperopplevelsen. En inkonsekvent anbuds- eller leveringsforsinkelse kan forsinke en yachtoverlevering eller redusere en oppføringspresentasjon. Forhandlere krever jevn kvalitet på tvers av batcher, pålitelige ledetider og konkurransedyktige priser for å opprettholde marginer. Aquafarer tilbyr forhandlerbeholdningsprogrammer med sesongbasert leveringsplanlegging, co-branding-alternativer for utstillingsrom og prioriteringstildeling i høysesongen.
      features:
        - Lagerbeholdningsprogrammer med tilgjengelige-on-demand-modeller
        - Sesongbestemt leveringsplan tilpasset overleveringskalenderen
        - Forhandler co-branding på konsoll og rør for utstillingsrom
        - Konsekvent kvalitet og spesifikasjoner på tvers av alle batchordrer
        - Konkurransedyktige forhandlerpriser med volumbasert nivå
