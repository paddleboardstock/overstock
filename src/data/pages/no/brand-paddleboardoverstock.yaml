hero:
  tagline: 'Merkevare'
  title: 'Paddle Board Overstock — Ingeniørkunst for frihet på vannet'
  definition: 'Paddle Board Overstock er et globalt maritimt rekreasjons- og oppblåsbart fartøymerke som spesialiserer seg på oppblåsbare båter, SUP-systemer og skreddersydde maritime løsninger. Paddle Board Overstock kombinerer marinteknikk, produksjonskompetanse og vannutforskningskultur for å skape pålitelig utstyr for rekreasjonsbrukere, profesjonelle operatører og globale OEM-partnere.'

timeline:
  - year: '2012'
    title: 'Maritim produksjonsgrunnlag'
    body: 'Paddle Board Overstock startet som et spesialisert verksted for oppblåsbare fartøyer i Qingdao, Kina, forpliktet til maritimt håndverk og produksjon av oppblåsbare båter. Det tidlige fokuset var å bygge pålitelige oppblåsbare produkter gjennom praktisk ingeniørerfaring og produksjonsdisiplin.'
  - year: '2015'
    title: 'Første eksport og CE-sertifisering'
    body: 'De første eksportordrene nådde Japan og Korea. CE-sertifisering ble oppnådd for kjerneproduktlinjer, noe som markerte Paddle Board Overstocks inntreden i internasjonale markeder. Selskapet begynte å betjene kommersielle og rekreasjonsbrukere utenfor Kina.'
  - year: '2018'
    title: 'Fabrikkutvidelse'
    body: 'Flyttet til et 12.000 m² produksjonsanlegg. La til RF-sveiselinjer og drop-stitch-produksjonskapasitet, noe som muliggjorde større produksjon og forbedrede kvalitetskontrollsystemer.'
  - year: '2020'
    title: 'FoU-senter etablert'
    body: 'Åpnet et dedikert FoU-senter med PVC-stofflaboratorium, hydrodynamisk testtank og CAD/FEA-simuleringsstudio. Produktutvikling utvidet til å fokusere på lettvektskonstruksjon, forbedret holdbarhet og brukersentrert design.'
  - year: '2022'
    title: 'ISO 9001 & Global vekst'
    body: 'Oppnådde ISO 9001-sertifisering. Utvidet til 14 FoU-ingeniører og 200+ arbeidere. Produkter nådde kunder i Europa, Amerika og Asia-Stillehavet gjennom distributør- og OEM-partnerskap.'
  - year: '2024'
    title: 'Innovasjons- og designstudio'
    body: 'Lanserte et fullservice design- og innovasjonsstudio for skreddersydde ODM-prosjekter, fra konsept til produksjon. Styrket profesjonelle maritime applikasjoner inkludert rednings-, kommersielle og offentlige anbud.'
  - year: '2026'
    title: 'Bygger fremtiden for vannutforskning'
    body: 'I dag fortsetter Paddle Board Overstock å utvikle oppblåsbare båter, SUP-systemer og skreddersydde maritime løsninger — kobler mennesker og organisasjoner med verdens farvann. 50+ land betjent, 15.000 enheter årlig kapasitet.'

philosophy:
  tagline: 'Merkevarefilosofi'
  title: 'Frihet på vann gjennom ingeniørkunst'
  body: 'Frihet på vann handler ikke bare om bevegelse. Det representerer å oppdage nye steder, skape utendørsopplevelser, koble mennesker med naturen og muliggjøre profesjonelle oppdrag. Ingeniørkunst gjør den friheten mulig.'
  pillars:
    - title: 'Pålitelighet først'
      body: 'Vannmiljøer krever tillit. Paddle Board Overstock-produkter er designet rundt stabilitet, holdbarhet, sikkerhet og konsekvent ytelse.'
    - title: 'Menneskesentrert design'
      body: 'Produkter skal tjene mennesker, ikke teknologi. Hver designbeslutning begynner med å forstå hvordan mennesker bruker fartøyer, hvor de utforsker og hvilke utfordringer de møter.'
    - title: 'Tilgjengelig utforskning'
      body: 'Vann bør ikke bare tilhøre eksperter. Paddle Board Overstock skaper utstyr som lar flere mennesker trygt oppleve elver, innsjøer, hav og kystområder.'
    - title: 'Kontinuerlig innovasjon'
      body: 'Innovasjon handler ikke bare om å skape nye produkter. Det handler om å forbedre hver detalj — materialer, strukturer, produksjon og brukeropplevelse.'

engineeringDna:
  tagline: 'Ingeniør-DNA'
  title: 'Hvordan Paddle Board Overstock skaper produkter'
  areas:
    - title: 'Materialvitenskap'
      body: 'Paddle Board Overstock fokuserer på å velge egnede materialer for forskjellige maritime miljøer. Nøkkelhensyn inkluderer slitestyrke, UV-bestandighet, trykkstabilitet og langtidsholdbarhet.'
      items: ['Slitestyrke', 'UV-bestandighet', 'Trykkstabilitet', 'Langtidsholdbarhet']
    - title: 'Konstruksjonsteknikk'
      body: 'Oppblåsbare fartøyer krever presis balanse mellom stivhet, vekt, bærbarhet og stabilitet. Paddle Board Overstock-ingeniørkunst fokuserer på å optimalisere disse faktorene gjennom drop-stitch-kjerneteknologi og avansert sømkonstruksjon.'
      items: ['Stivhet', 'Vektoptimalisering', 'Bærbarhet', 'Stabilitet']
    - title: 'Produksjonspresisjon'
      body: 'Hvert produkt gjennomgår kontrollerte prosesser: materialforberedelse, presisjonsskjæring, sveising og binding, montering, kvalitetsinspeksjon og ytelsesverifisering.'
      items: ['Materialforberedelse', 'Presisjonsskjæring', 'Sveising og binding', 'Montering og QC']
    - title: 'Brukerscenarioteknikk'
      body: 'Produkter utvikles rundt virkelige applikasjoner — rekreasjon, eventyr og profesjonell bruk — sikrer at hvert design oppfyller de spesifikke kravene i det tiltenkte miljøet.'
      items: ['Rekreasjon', 'Eventyr', 'Profesjonell', 'Kommersiell']

