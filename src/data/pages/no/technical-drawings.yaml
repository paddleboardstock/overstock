content_version_control:
  tagline: Versjonskontroll
  title: Tegneversjon<br />Administrasjon
  subtitle: Hver tegning følger et kontrollert revisjonssystem. Kontroller alltid at du har gjeldende revisjon før du bruker tegninger til prosjektering.
  items:
    - title: Revisjonssporing
      description: Hver tegning har en revisjonskode (Rev-A, Rev-B, Rev-C), utstedelsesdato, siste gjennomgått dato, gjeldende modell/konfigurasjon, enheter, filstørrelse og format. Bare "Gjeldende" revisjon er tilgjengelig for nedlasting.
      icon: tabler:git-branch
    - title: Merknad om tegningsstatus
      description: Alle offentlige tegninger er merket "Kun foreløpig layout - ikke for konstruksjon, sertifisering eller produksjonsbruk. Dimensjoner er underlagt endelig spesifikasjon og ordrebekreftelse." Dette beskytter begge parter mot feilanvendelse.
      icon: tabler:alert-circle
    - title: Oppdater varsler
      description: Når en modellspesifikasjon endres, oppdateres tegningsrevisjonen, og tidligere versjoner er merket med "Erstattet". Registrerte brukere som lastet ned DXF/DWG-pakker blir varslet om betydelige oppdateringer via e-post.
      icon: tabler:bell

