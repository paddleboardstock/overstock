faq:
  title: Tekniske tegninger — Ofte stilte spørsmål
  questions:
    - q: Er GA PDF-ene virkelig gratis å laste ned?
      a: Ja. Generelle ordninger PDF-er for hovedmodellene våre er tilgjengelige uten kostnad. De inneholder informasjon på planleggingsnivå som er tilstrekkelig for prosjektevaluering, plasstildeling og foreløpig spesifikasjonsgjennomgang.
    - q: Hvordan får jeg tilgang til DXF/DWG-filer?
      a: Fyll ut det korte kvalifikasjonsskjemaet på nedlastingssiden med firmanavn, prosjekttype og tiltenkt bruk. Godkjente forespørsler mottar en nedlastingslenke via e-post innen 1 virkedag.
    - q: Kan jeg få STEP/IGES 3D-modeller?
      a: STEP- eller IGES 3D-modellfiler er tilgjengelige gjennom vår prosjektsøknadsprosess. Oppgi prosjektets omfang, integrasjonskrav, tidslinje og kjøpsintensjon. Med forbehold om godkjenning – vanligvis innen 3–5 virkedager.
    - q: Hvorfor begrenser du tilgangen til filer med høyere detaljer?
      a: Skroggeometri, formdata og strukturelle beregninger representerer år med FoU-investeringer og er kjernen i produksjons-IP. Vi tilbyr alt som trengs for anskaffelsesplanlegging og prosjektintegrasjon, samtidig som vi beskytter vår evne til å fortsette å investere i ny produktutvikling.
    - q: Inkluderer tegningene produksjonsdetaljer?
      a: Nei Offentlige tegninger og tegninger i lysform inneholder informasjon på anskaffelsesnivå for planlegging og spesifikasjon. Detaljer på produksjonsnivå (lamineringsplaner, verktøybaner, skjæreutvidelser) deles kun under NDA med bekreftede bestillinger.
    - q: Er tegninger tilgjengelige for tilpassede eller semi-tilpassede RIB-konfigurasjoner?
      a: Tilpassede prosjekttegninger utarbeides som en del av OEM/ODM-utviklingsprosessen. Hvis du vurderer et tilpasset RIB-prosjekt, kontakt oss med dine krav og vi vil gi prosjektspesifikke GA-tegninger som en del av forslaget.
