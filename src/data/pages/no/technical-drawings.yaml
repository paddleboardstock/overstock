content_tiers:
  tagline: Last ned nivåer
  title: Fire tilgangsnivåer<br />— Riktig detalj for riktig scene
  subtitle: Vi tilbyr tegninger på anskaffelsesnivå, ikke filer på produksjonsnivå. Hvert nivå samsvarer med et annet prosjektstadium.
  items:
    - title: Nivå 1 — Offentlig PDF
      description: Generelt arrangement (GA), dimensjonstegning med 4 visninger og dekklayout i PDF-format. Tilgjengelig for gratis nedlasting. Tilstrekkelig for prosjektplanlegging, plasstildeling og foreløpig spesifikasjonsgjennomgang.
      icon: tabler:file-type-pdf
    - title: Nivå 2 — Light Form DXF/DWG
      description: 2D CAD-filer (DXF eller DWG) for layout-integrasjon på planleggingsnivå. Krever et kort kvalifikasjonsskjema (firmanavn, prosjekttype, tiltenkt bruk). Ingen strukturelle eller produksjonsdata inkludert.
      icon: tabler:file-code
    - title: Nivå 3 — Prosjektsøknad STEP/IGES
      description: 3D-modellfiler (STEP eller IGES) for systemintegrasjon, utstyrsdesign eller koordinering av marinearkitektur. Krever prosjektsøknad med omfang, tidslinje og kjøpsintensjon. Med forbehold om godkjenning.
      icon: tabler:cube
    - title: Nivå 4 – NDA Engineering
      description: Skrogstrukturtegninger, lamineringsplaner, rørkutteutvidelser og formdata. Kun tilgjengelig under NDA med bekreftede bestillinger. Dette er filer på produksjonsnivå - ikke for offentlig distribusjon.
      icon: tabler:lock
content_included:
  tagline: Hva er inkludert
  title: Tegningsinnhold<br />Per modell
  subtitle: Hver modell har en standard tegnepakke som dekker viktig planleggingsinformasjon for B2B-kjøpere og prosjektingeniører.
  items:
    - title: Generell ordning (GA)
      description: Sideprofil, sett ovenfra og tverrsnitt som viser skrogform, rørposisjon, konsollplassering, sete, drivstoffsystem og nøkkeldimensjoner (LOA, bjelke, rørdiameter, dødstigningsvinkel). Revisjonsstatus og opphavsrett notert på tittelblokken.
      icon: tabler:layout
    - title: 4-visnings dimensjonstegning
      description: Side-, front-, bak- og topputsikt med overordnede mål for transportplanlegging (høyde på tilhenger, bjelke for container, vekt for løfting). Inkluderer drifts- og transportkonfigurasjoner.
      icon: tabler:ruler-2
    - title: Dekkoppsett og utstyrsplan
      description: Top-down dekkvisning som viser konsollbase, seteposisjoner, D-ringplasseringer, navigasjonslysposisjoner, lensepumpetilgang, batteri/drivstoffrom og utstyrsmonteringspunkter. Begrenset presisjon på proprietære grensesnitt.
      icon: tabler:map
    - title: Transport & Emballasje Tegning
      description: Container lasteplan, vuggedimensjoner, vektfordeling og løftepunktposisjoner for logistikkplanlegging. Inkluderer standard og tilpassede emballasjealternativer.
      icon: tabler:truck
content_protection:
  tagline: IP-beskyttelse
  title: Hva vi ikke deler<br />og hvorfor
  subtitle: Beskyttelse av vår tekniske IP sikrer at vi kan fortsette å investere i FoU og samtidig gi alt kjøpere trenger for prosjektplanlegging.
  items:
    - title: Hull Mold kjernedata
      description: Plugg- og formgeometri, CNC-verktøybaner og lamineringsmaler er proprietære produksjonsmidler. De deles ikke på noen tilgangsnivå utenfor bekreftede NDA-kontrakter.
      icon: tabler:ban
    - title: Utvidelser av rørskjæring
      description: Flatmønstrede skjærefiler for rørstoff er data på produksjonsnivå. Kun tilgjengelig under NDA med bekreftede produksjonsordrer og kun delt med avtaleparten.
      icon: tabler:ban
    - title: Strukturelle beregninger
      description: Detaljert spenningsanalyse, FEA-resultater og laminatplaner er samsvarssensitive dokumenter som bare deles med meldte organer og NDA-bundne klienter under samsvarsvurderingsprosessen.
      icon: tabler:ban
    - title: Konkurrentscreening
      description: Vi forbeholder oss retten til å avslå CAD-tilgangsforespørsler som ser ut til å være fra konkurrenter, studenter uten prosjektsammenheng eller parter uten legitime anskaffelsesintensjoner.
      icon: tabler:shield
