hero:
  tagline: Tekniske tegninger & CAD
  title: RIB og gummibåt<br />Tekniske tegninger og CAD-nedlastinger
  subtitle: GA-tegninger på planleggingsnivå, dimensjonsark og dekkoppsett for prosjektevaluering og spesifikasjon. Få tilgang til tekniske tegninger på riktig nivå – fra offentlige PDF-filer til STEP-filer på prosjektnivå.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB båt tekniske tegninger og CAD nedlastinger
direct_answer: Aquafarer leverer tekniske tegninger på anskaffelsesnivå for RIB-båter og oppblåsbare vannscootere – inkludert PDF-er for generelle arrangement (GA), dimensjonsark og dekkslayouttegninger. Høyere detaljerte formater (DXF/DWG, STEP/IGES) er tilgjengelige ved kvalifisert forespørsel eller prosjektsøknad.
