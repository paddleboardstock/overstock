  tagline: Vår historie
  title: Paddle Board Overstock — Ingeniørkunst for frihet på vannet
  subtitle: 'Fra et kystverksted til en global marineprodusent – ​​vår reise er bygget på en hardnakket tro: vannscootere bør konstrueres som de betyr noe, fordi de gjør det.'
  image:
