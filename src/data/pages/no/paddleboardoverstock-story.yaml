timeline:
  - year: '2012'
    title: Grunnlaget for marin produksjon
    body: Paddle Board Overstock begynte som et spesialisert verksted for oppblåsbare vannscootere i Qingdao, Kina, forpliktet til marint håndverk og produksjon av oppblåsbare båter. Det tidlige fokuset var å bygge pålitelige oppblåsbare produkter gjennom praktisk ingeniørerfaring og produksjonsdisiplin.
  - year: '2015'
    title: Første eksport og CE-sertifisering
    body: De første eksportordrene nådde Japan og Korea. CE-sertifisering ble oppnådd for kjerneproduktlinjer, og markerte Paddle Board Overstocks inntreden i internasjonale markeder. Selskapet begynte å betjene kommersielle og rekreasjonsbrukere utenfor Kina.
  - year: '2018'
    title: Fabrikkutvidelse
    body: Flyttet til et 12 000 m² produksjonsanlegg. Lagt til RF-sveiselinjer og produksjonskapasitet for drop-stitch, noe som muliggjør større produksjon og forbedrede kvalitetskontrollsystemer.
  - year: '2020'
    title: FoU-senter etablert
    body: Åpnet et dedikert FoU-senter med PVC stofflaboratorium, hydrodynamisk testtank og CAD/FEA-simuleringsstudio. Produktutviklingen utvidet til å fokusere på lettvektskonstruksjon, forbedret holdbarhet og brukersentrert design.
  - year: '2022'
    title: Sertifisering og global vekst
    body: Oppnådde ISO 9001-sertifisering. Utvidet til 14 FoU-ingeniører og 200+ arbeidere. Produktene nådde kunder over hele Europa, Amerika og Asia-Stillehavsområdet gjennom distributør- og OEM-partnerskap.
  - year: '2024'
    title: Innovasjons- og designstudio
    body: Lanserte fullservice design- og innovasjonsstudio for tilpassede ODM-prosjekter, fra konsept til produksjon. Styrkede profesjonelle marineapplikasjoner inkludert rednings-, kommersielle og offentlige anbud.
  - year: '2026'
    title: Bygge fremtiden for vannutforskning
    body: I dag fortsetter Paddle Board Overstock å utvikle oppblåsbare båter, SUP-systemer og tilpassede marine løsninger – som forbinder mennesker og organisasjoner med verdens farvann. 50+ land betjenes, 15 000 enheter årlig kapasitet.
content_founding:
  tagline: Begynnelsen
  title: Født på Waterfront
  subtitle: 'Paddle Board Overstock startet i et kystverksted i Qingdao med én båt og en visjon: å bygge oppblåsbare vannscootere som kunne håndtere ekte marine forhold.'
  paragraphs:
    - I 2012 så våre grunnleggere et gap i markedet – de fleste gummibåter var enten rimelige, men upålitelige, eller høykvalitets, men uoverkommelig dyre. De mente det var plass til en produsent som leverte både kvalitet og verdi.
    - Det første skroget ble bygget for hånd, testet i lokale farvann og foredlet basert på reelle tilbakemeldinger fra fiskere og små kommersielle operatører. Denne tilbakemeldingssløyfen – bygg, test, lytt, forbedre – er fortsatt kjernen i vår tekniske filosofi i dag.
    - I 2015 hadde ordet spredt seg utover Qingdao. Internasjonale distributører begynte å be om prøver. Det som startet som et lokalt verksted var å bli en global leverandør.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstocks tidlige produksjonsverksted og produksjon
content_growth:
  tagline: Vekst og innovasjon
  title: Fra verksted til 12 000 m² anlegg
  subtitle: Kontinuerlige investeringer i mennesker, utstyr og prosesser har forvandlet Paddle Board Overstock til et moderne marin produksjonsanlegg.
  paragraphs:
    - Etter hvert som etterspørselen vokste, vokste også anlegget vårt. Vi utvidet fra et lite verksted til en 12 000 m² fabrikk med dedikerte produksjonslinjer for RIB båter, oppblåsbare båter, SUP brett og tilbehør.
    - Vi investerte i CNC-skjæremaskiner, høyfrekvent sveiseutstyr, drop stitch produksjonslinjer og omfattende testrigger – slik at vi kan kontrollere alle aspekter av produksjonskvaliteten.
    - I dag inkluderer teamet vårt på 200-300 marineingeniører, materialforskere, kvalitetskontrollspesialister og dyktige håndverkere – mange av dem har vært med Paddle Board Overstock siden de første dagene.
founder:
  tagline: Møt grunnleggeren
  title: Bygget av en vannmann
  subtitle: Grunnlegger David Chen bringer sammen produksjonsekspertise og en livslang lidenskap for vannsport – en kombinasjon som definerer hvordan Paddle Board Overstock nærmer seg produktutvikling.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — grunnlegger av Paddle Board Overstock
  story:
    - David Chen vokste opp på kysten av Qingdao, hvor havet ikke var et feriemål, men en livsstil. Han tilbrakte sin ungdom på kajakkpadling, seiling og fiske i Gulehavet - opplevelser som ga ham en intuitiv forståelse av hva vannscootere må tåle.
    - Før han grunnla Paddle Board Overstock, tilbrakte David et tiår i marin produksjon, og jobbet på tvers av produksjon, kvalitet og internasjonal handel. Han administrerte OEM-programmer for europeiske og nordamerikanske merkevarer, og lærte standardene og forventningene til globale markeder fra første hånd.
    - 'I 2012 grunnla han Paddle Board Overstock med et enkelt oppdrag: bygge oppblåsbare vannscootere som han ville stole på sammen med sin egen familie på vannet. Den personlige standarden - ville jeg brukt denne? – forblir den siste testen for hvert produkt som forlater fabrikken.'
    - I dag leder David produktstrategi og fører tilsyn med FoU-teamet, personlig gjennomgår nye design og tester prototyper på vannet utenfor Qingdao. Han mener at gode produkter kommer av å forstå både ingeniørkunsten og opplevelsen.
philosophy:
  tagline: Merkefilosofi
  title: Ingeniørfrihet på vann
  body: Frihet på vann handler ikke bare om bevegelse. Det representerer å oppdage nye steder, skape utendørsopplevelser, forbinde mennesker med naturen og muliggjøre profesjonelle oppdrag. Engineering gjør denne friheten mulig.
  pillars:
    - title: Pålitelighet først
      body: Vannmiljøer krever tillit. Paddle Board Overstock produkter er designet rundt stabilitet, holdbarhet, sikkerhet og konsekvent ytelse.
    - title: Menneskesentrert design
      body: Produkter skal tjene mennesker, ikke teknologi. Hver designbeslutning begynner med å forstå hvordan folk bruker vannscootere, hvor de utforsker og hvilke utfordringer de står overfor.
    - title: Tilgjengelig utforskning
      body: Vann bør ikke bare tilhøre eksperter. Paddle Board Overstock skaper utstyr som lar flere mennesker trygt oppleve elver, innsjøer, hav og kystmiljøer.
    - title: Kontinuerlig innovasjon
      body: Innovasjon er ikke bare å skape nye produkter. Det forbedrer hver eneste detalj - materialer, strukturer, produksjon og brukeropplevelse.
engineeringDna:
  tagline: Ingeniør-DNA
  title: Hvordan Paddle Board Overstock lager produkter
  areas:
    - title: Materialvitenskap
      body: Paddle Board Overstock fokuserer på å velge passende materialer for ulike marine miljøer. Viktige hensyn inkluderer slitestyrke, UV-motstand, trykkstabilitet og langsiktig holdbarhet.
      items:
        - Slitasjemotstand
        - UV-motstand
        - Trykkstabilitet
        - Langsiktig holdbarhet
    - title: Konstruksjonsteknikk
      body: Oppblåsbare vannscootere krever nøyaktig balanse mellom stivhet, vekt, portabilitet og stabilitet. Paddle Board Overstock engineering fokuserer på å optimalisere disse faktorene gjennom drop-stitch kjerneteknologi og avansert sømkonstruksjon.
      items:
        - Stivhet
        - Vektoptimalisering
        - Bærbarhet
        - Stabilitet
    - title: Produksjonspresisjon
      body: 'Hvert produkt går gjennom kontrollerte prosesser: materialforberedelse, presisjonsskjæring, sveising og liming, montering, kvalitetsinspeksjon og ytelsesverifisering.'
      items:
        - Materialforberedelse
        - Presisjonsskjæring
        - Sveising og liming
        - Montering og QC
    - title: Brukerscenario-utvikling
      body: Produktene er utviklet rundt reelle bruksområder – rekreasjon, eventyr og profesjonell bruk – for å sikre at hvert design oppfyller de spesifikke kravene til det tiltenkte miljøet.
      items:
        - Rekreasjon
        - Eventyr
        - Profesjonell
        - Kommersiell
