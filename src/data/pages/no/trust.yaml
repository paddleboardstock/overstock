faqs_rib:
  title: RIB-båt FAQ
  subtitle: Vanlige spørsmål om våre oppblåsbare båter med stivt skrog.
  columns: 2
  items:
    - title: Hvilke størrelser RIB-båter tilbyr Paddle Board Overstock?
      description: Vi tilbyr 35 RIB-modeller fra 2,5 m til 7,6 m, alt fra kompakte tendere til tunge kommersielle og patruljefartøyer. Hver modell er tilgjengelig med flere konfigurasjonsalternativer.
    - title: Hva er forskjellen mellom en RIB og en tradisjonell oppblåsbar båt?
      description: En RIB (Rigid-Hull Inflatable Boat) kombinerer et solid glassfiber- eller aluminiumsskrog i dyp V-form med oppblåsbare Hypalon- eller PVC-rør. Dette gir deg stabiliteten og lastekapasiteten til en hard båt med støtdempingen og oppdriften til en oppblåsbar.
    - title: Hvilke motorer er kompatible med Paddle Board Overstock RIB-er?
      description: RIB-ene våre støtter påhengsmotorer fra 3 HK til 250 HK avhengig av modell. Hver produktside viser maksimal motoreffekt. Vi anbefaler å rådføre seg med din forhandler for ideell match.
    - title: Er Paddle Board Overstock RIB-er CE-sertifisert?
      description: Ja. Alle rekreasjonsmodeller er CE-sertifisert i henhold til gjeldende europeiske standarder for rekreasjonsfartøyer. Kommersielle og patruljemodeller oppfyller ytterligere stabilitets- og lastekrav.
    - title: Hva er garantien på RIB-båter?
      description: Alle Paddle Board Overstock RIB-er leveres med standard ett års garanti mot produksjonsfeil, som dekker skrogdelaminering, rørsømssvikt, ventilfeil og maskinvareproblemer.
    - title: Hvor mange luftkammer har Paddle Board Overstock RIB-er?
      description: RIB-ene våre har 3 til 7 uavhengige luftkammer avhengig av modellengde. Denne flerkammerdesignen sikrer at båten forblir flytende selv om ett rom kompromitteres.
faqs_inflatable:
  title: Oppblåsbar båt FAQ
  subtitle: Vanlige spørsmål om våre oppblåsbare joller, kajakker og båter.
  columns: 2
  items:
    - title: Hvilke materialer brukes i Paddle Board Overstock oppblåsbare båter?
      description: Vi bruker militær-grade PVC (1100 denier) og premium Hypalon/CSM-gummi, avhengig av modell. Begge materialene er UV-stabiliserte, slitesterke og overholder EUs REACH- og RoHS-forskrifter.
    - title: Hvor lenge varer oppblåsbare båter?
      description: Med riktig pleie varer en kvalitets-PVC oppblåsbar båt 7–10 år, mens Hypalon-modeller kan vare 15–20 år. Regelmessig rengjøring, UV-beskyttelse og riktig oppbevaring forlenger levetiden betydelig.
    - title: Hvilket vedlikehold kreves for en oppblåsbar båt?
      description: Grunnleggende vedlikehold inkluderer skylling med ferskvann etter hver bruk (spesielt i saltvann), tørking før oppbevaring, årlig kontroll av ventiltetninger og påføring av UV-beskyttelse på rør. Unngå langvarig soleksponering når den ikke er i bruk.
    - title: Kan oppblåsbare båter brukes i saltvann?
      description: Ja. Alle Paddle Board Overstock oppblåsbare båter er designet for både ferskvanns- og saltvannsbruk. Vi anbefaler skylling med ferskvann og grundig tørking etter saltvannseksponering for å forhindre korrosjon av beslag og saltkrystallisering i stoffet.
    - title: Hvordan oppbevarer jeg en oppblåsbar båt?
      description: Tøm luften, rengjør og tørk båten helt før oppbevaring. Rull løst (unngå skarpe folder), oppbevar på et kjølig, tørt sted unna direkte sollys, og hold unna betonggulv for å forhindre fuktsuging.
    - title: Hva er vektkapasiteten til Paddle Board Overstock oppblåsbare båter?
      description: Vektkapasiteter spenner fra 290 kg for våre minste modeller til over 2000 kg for større kommersielle fartøyer. Hver produktside viser maksimal belastning for din spesifikke modell.
faqs_sup:
  title: SUP-brett FAQ
  subtitle: Vanlige spørsmål om våre paddleboard.
  columns: 2
  items:
    - title: Hvilke SUP-brettstørrelser er tilgjengelige?
      description: Vi tilbyr SUP-brett fra 9 ft til 12 ft, inkludert all-round, touring, yoga og spesialdesign. Våre bestselgende modeller inkluderer Tropical Breeze (10 ft) og Ocean Voyager (11 ft).
    - title: Hva er drop-stitch-konstruksjon?
      description: Drop-stitch-konstruksjon bruker tusenvis av polyestertråder som forbinder topp- og bunnlaget på brettet, slik at det kan holde høyt lufttrykk (15–20 PSI) og oppnå en stiv, stabil plattform. Dette er industristandarden for premium oppblåsbare SUP-er.
    - title: Hva er vektgrensen for SUP-brett?
      description: SUP-brettene våre støtter opptil 150 kg avhengig av modell og volum. Leviathan Wake er modellen vår med høyest kapasitet, designet for større brukere og yogabruk.
    - title: Tilbyr du komplette SUP-pakker?
      description: Ja. Hvert SUP-brett leveres med en komplett pakke som inkluderer 3-delt aluminiumspadle, høytrykks håndpumpe, spiralfeste, reiseryggsekk og reparasjonssett. Noen modeller inkluderer også et avtakbart finnesett.
    - title: Hva er garantien på SUP-brett?
      description: Alle Paddle Board Overstock SUP-brett har ett års garanti mot produksjonsfeil, inkludert sømfeil, ventilfeil og materialdelaminering under normal bruk.
    - title: Hvor lang tid tar det å pumpe opp et SUP-brett?
      description: Ved bruk av den medfølgende håndpumpen tar full oppumping til 15 PSI omtrent 8–12 minutter. For raskere oppumping anbefaler vi Paddle Board Overstock 12V elektrisk pumpe, som pumper opp et brett på under 4 minutter.
