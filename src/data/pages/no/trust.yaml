features3_lab:
  title: Intern testing og kvalitetslaboratorium
  subtitle: Hvert materialparti og ferdig produkt går gjennom vårt testlaboratorium på stedet før det sendes.
  columns: 3
  isBeforeContent: true
  items:
    - title: Strekkstyrketesting
      description: 'Hver PVC stoffrull er testet i henhold til ASTM D751-standarder. Minimumskrav: 350 N/cm renning og veft. Avviste partier returneres til leverandøren – vi avviser omtrent 3 % av innkommende materialer.'
      icon: tabler:scale
    - title: UV-akselerert aldring
      description: Stoffprøver gjennomgår 1000-timers QUV-akselerert forvitring (ASTM G154). Retensjon av strekkfasthet må overstige 80 % etter UV-eksponering. Produkter vurdert for 3+ års utendørs bruk.
      icon: tabler:sun
    - title: Skrellestyrke i sømmer
      description: RF-sveisede sømmer testet ved 5 N/mm minimum avskallingsstyrke (ASTM D751). Håndlimte Hypalon sømmer testet ved 3,5 N/mm. Hver produksjonsbatch har sømprøver destruktivt testet og arkivert.
      icon: tabler:stack
    - title: 24–48 timers trykkhold
      description: 'Hvert oppblåsbart produkt ble blåst opp til 1,25x rangert PSI og overvåket i 24–48 timer. Maksimalt tillatt trykkfall: 5 %. Produkter som ikke består denne testen, omarbeides og testes på nytt før forsendelse.'
      icon: tabler:wind
    - title: Syklustesting av ventiler
      description: Hvert ventildesign gjennomgår 10 000 åpne-lukke sykluser i laboratoriet vårt. Ventiler må opprettholde lufttett forsegling ved 1,25x nominelt trykk etter sykling. Alle Paddle Board Overstock ventiler vurdert for 5+ års regelmessig bruk.
      icon: tabler:rotate
    - title: Motstand mot kalde sprekker
      description: Materialer testet ved -30°C i 4 timer per ISO 4646. Ingen sprekker eller sprøhet tillatt. Produkter vurdert for vinterlagring og kaldtvannsbruk ned til -10°C omgivelsestemperatur.
      icon: tabler:snowflake

