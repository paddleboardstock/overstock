        description: Engrospriser på alle SUP-brett, kajakker, RIB-er og tilbehør
      - title: Dedikert kontoansvarlig
        description: Enkelt kontaktpunkt for bestillinger, støtte og produktinformasjon
      - title: Markedsføringsmateriell
        description: Produktbilder, spesifikasjonsark, brosjyrer og digitale ressurser på ditt språk
      - title: Logistikkstøtte
        description: Forsendelseskoordinering, tolldokumentasjon og lagerlevering
      - title: Eksempel program
        description: Rabatterte prøvebestillinger for utstillingslokaler og forhandlerdemonstrasjoner
    cta_text: Søk om partnerskap
    cta_href: /contact
  - title: Distributør Premium
    subtitle: For etablerte distributører med dekning i flere land
    badge: Best Value
    features:
