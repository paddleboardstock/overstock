        description: Volumbaserte prisnivåer med kvartalsvise rabattprogrammer
      - title: Eksklusivt territorium
        description: Beskyttede distribusjonsrettigheter for din region eller land
      - title: Drop-Ship-program
        description: Send direkte til dine kunder fra våre varehus med din merkevarebygging
      - title: Privat merking
        description: Full OEM/ODM-støtte for ditt eget merke – brett, båter og tilbehør
      - title: Prioritert støtte
        description: 48-timers responsgaranti, dedikert logistikkkoordinator og fremskyndede bestillinger
    cta_text: Oppgrader partnerskapet
    cta_href: /contact
  - title: Hoveddistributør
    subtitle: For store regionale og nasjonale distributører
    badge: Enterprise
    features:
      - title: Strategisk partnerskap
        description: Felles forretningsplanlegging, markedsutviklingsfond og co-marketing programmer
      - title: Tilpasset produktutvikling
        description: Eksklusive produktdesign og spesifikasjoner for ditt marked
      - title: Lokal lagerstøtte
        description: Lagerforsendelse, lokalt reservedelslager og oppsett av regionalt servicesenter
      - title: Support for forhandlernettverk
        description: Opplæringsprogrammer, sertifiseringskurs og integrering av forhandlerlokalisering
      - title: Årlig partnertoppmøte
        description: Strategimøter, produktforhåndsvisninger og nettverksbygging med globale partnere
    cta_text: Utforsk Master-partnerskapet
    cta_href: /contact
benefits:
