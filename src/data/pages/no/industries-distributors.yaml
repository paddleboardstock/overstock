content_segments:
  tagline: Partnerprofiler
  title: Distribusjonspartnerskapsmodeller<br />Etter partnertype
  subtitle: Ulike distributører bringer forskjellige sterke sider på markedet – regional infrastruktur, e-handelsrekkevidde, spesialhandel eller porteføljer med flere merker. Vi strukturerer partnerskapsvilkår, prisnivåer og støttenivåer for å matche hver partnerprofil.
  items:
    - title: Regionale marinedistributører
      subtitle: Territorieksklusiv B2B-distribusjon
      description: Etablerte distributører med lagerinfrastruktur, forhandlernettverk og logistikkevner som betjener marineforhandlere, vannsportforhandlere og utleieoperatører innenfor et definert geografisk territorium. Du trenger en komplett produktlinje, beskyttet prissetting og muligheten til å betjene forhandlerkontoer med lokalt lager og støtte.
      features:
        - Eksklusiv territoriell beskyttelse med minimale forpliktelser
        - Grossistpriser på hele katalogen med kvartalsvise volumrabatter
        - Konsignasjonsprogram for lokalt lager for hurtigroterende SKU-er
        - Opplæring av forhandlernettverket og sambrandede markedsføringsprogrammer
    - title: E-handel og nettforhandlere
      subtitle: Digital-first distribusjonskanaler
      description: Nettbutikker som selger vannsportutstyr gjennom Amazon, eBay eller deres egne e-handelsplattformer. Hastighet til markedet, konkurransedyktige priser og direkte til forbrukerlogistikk er avgjørende. Du trenger en partner som kan sende individuelle bestillinger under merkevaren din med rask gjennomføring og null lagerrisiko.
      features:
        - 'Dropshippingprogram: levering direkte fra fabrikken med deres merkevare'
        - API-feed med beholdning i sanntid for deres e-handelsplattform
        - Integrasjon med Amazon Seller Central med støtte for EAN/UPC
        - Returlogistikk og behandling av garantikrav inkludert
    - title: Spesialforhandlere for vannsport
      subtitle: Murstein-og-mørtel showroom-partnere
      description: Fysiske forhandlere som spesialiserer seg på vannsportutstyr – betjener lokale padlere, sportsfiskere og båtfolk med personlig salg, demonstrasjoner og ettersalgsservice. Du trenger detaljhandeloptimalisert emballasje, demoenhetsprogrammer og salgsstedsmateriell som konverterer inngående kunder.
      features:
        - 'Demoprogram: rabatterte visningsbrett for showroom'
        - Detaljhandelsklar emballasje med eskedesign optimalisert for hyllen
        - POS-displayer, sammenligningstabeller og kjøperguider
        - Opplæring og sertifiseringsprogram for butikkpersonale
    - title: Distributører av flere merker og varehus
      subtitle: Bredlinjedistribusjon av sportsutstyr
      description: Store distributører som betjener varehus, storboksforhandlere og sportsvarekjeder med kataloger med flere merker. Konsistens, samsvarsdokumentasjon og leverandørsamsvar er avgjørende – hver SKU må oppfylle forhandlerspesifikke emballasje-, merkings- og kvalitetsstandarder.
      features:
        - 'Compliance-dokumentasjon for detaljhandlere: emballasjespesifikasjon, strekkode, merking'
        - EDI/ASN-integrasjon med bestillingssystemene til større detaljhandlere
        - Leverandørstyrt lager og programmer for automatisk etterfylling
        - Dedikert kundeansvarlig med SLA på 24 timers responstid
cta:
  title: Bli en distribusjonspartner
