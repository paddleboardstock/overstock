testimonials:
  - category: klubber
    name: Ricardo Santos
    title: Eier, Algarve Surf Academy
    location: Lagos, Portugal
    content: Vi startet med Club Starter Package for surfeskolen vår. 20 brett, årer, vester — alt kom innen 3 uker. Etter to sesonger oppgraderte vi til Pro-pakken. Den tilpassede merkevarebyggingen med logoen vår var en game-changer for vårt profesjonelle image.
    rating: 5
    product: Klubb startpakke
    source: solutions/clubs
  - category: klubber
    name: Klubb eier
    title: Vannsportklubb
    location: Phuket, Thailand
    content: Klubbstartpakken var det perfekte inngangspunktet. Etter hvert som virksomheten vår vokste, vokste Aquafarer med oss – samme kvalitet, samme pris, ingen overraskelser. Vi skalert fra 10 til 80 brett på 18 måneder.
    rating: 5
    product: Klubbstarter + Premium-pakke
    source: success-stories
  - category: alpinanlegg
    name: Resort daglig leder
    title: 5-stjerners strandresort
    location: Hellas
    content: Aquafarer leverte ikke bare brett – de hjalp oss med å bygge en komplett gjesteopplevelse. Vannsportprogrammet vårt gikk fra null til feriestedets høydepunkt på én sesong. 300+ ukentlige bestillinger og $180K i årlig inntekt.
    rating: 5
    product: Resort Premium-pakke
    source: success-stories
  - category: alpinanlegg
    name: Sophie Laurent
    title: Direktør for Guest Experience, Azure Bay Resorts
    location: Phuket, Thailand
    content: Aquafarer designet og utstyrte hele vårt strandaktivitetsprogram på tvers av tre resorteiendommer. 80 SUP-er, 40 kajakker, sikkerhetsinfrastruktur og opplæring av personalet – alt levert i én forsendelse. Gjestedeltakelsen økte med 60 % den første sesongen.
    rating: 5
    product: Resort Premium-pakke
    source: solutions/resorts
  - category: gründere
    name: Michael Park
    title: Grunnlegger, Shoreline Paddle Co.
    location: California, USA
    content: Jeg lanserte SUP-merket mitt uten bransjeerfaring. Aquafarers team guidet meg fra produktvalg til tilpasset logodesign og emballasje. Min første container kom på 11 uker, og jeg ble utsolgt på 3 måneder på Amazon.
    rating: 5
    product: Starter merke lansering
    source: solutions/entrepreneurs
  - category: gründere
    name: Grunnlegger
    title: Australsk SUP-merke
    location: Australia
    content: Jeg hadde merkevareideen, men null produksjonskunnskap. Aquafarer holdt meg bokstavelig talt i hånden gjennom hele prosessen – fra å velge riktig brettdesign til å pakke ut min første forsendelse. 90 dager fra drøm til levering.
    rating: 5
    product: Merkelanseringspakke
    source: success-stories
  - category: utleie
    name: Daniel Okonkwo
    title: Eier, Lakeland SUP Rentals
    location: Ontario
    content: Jeg leide 5 brett fra en lokal butikk og mistet 60 % av inntektene mine til dem. Aquafarer hjalp meg med å bygge min egen flåte på 15 SUP-er. ROI-kalkulatoren viste break-even på 4 måneder — det tok 3. Nå utvider jeg til 30 brett.
    rating: 5
    product: Flåtestartsett
    source: solutions/rental-business
  - category: utleie
    name: Marco Valenti
    title: Driftsdirektør, Adriatic Adventure Tours
    location: Dubrovnik, Kroatia
    content: Vi utstyrte hele utleieflåten vår med Aquafarer RIB-er – 12 båter fordelt på tre lokasjoner. To sesonger på, null feil. CE-sertifiseringsdokumentasjonen gjorde forsikringsgodkjenningen sømløs. Ingeniørteamet deres tilpasset til og med rørfargene.
    rating: 5
    product: Flåteutvidelsessett
    source: trust
  - category: utleie
    name: Kommandørløytnant Andres Reyes
    title: Maritim innkjøpsoffiser, hjelpemann for den filippinske kystvakten
    location: Manila, Filippinene
    content: Vi opererer 24 Aquafarer RIB-er på tvers av vår kystpatruljeflåte. QC-prosessen deres er konsistent på tvers av hver batch - samme sømkvalitet, samme ventilplassering, samme trykkvurdering hver gang. Den repeterbarheten betyr noe når liv avhenger av utstyret.
    rating: 5
    product: RIB patruljeflåte
    source: trust
  - category: forbrukere
    name: Sara K.
    title: Førstegangs SUP-eier
    location: Lake Tahoe, USA
    content: Stabil selv for en nybegynner. Tok den ut på sjøen min første dag og falt aldri. Den komplette pakken med pumpe og åre betydde at jeg var på vannet 20 minutter etter at jeg åpnet esken.
    rating: 5
    product: SUP Explorer 11
  - category: forbrukere
    name: James Thornton
    title: SUP Explorer 11-eier
    location: Vancouver, Canada
    content: Som førstegangskjøper var jeg nervøs for kvalitetsbestilling fra utlandet. ISO-dokumentasjonen og tredjeparts testrapporter de delte før jeg spurte, ga meg full tillit. Brettet kom på 6 dager og overgikk forventningene mine.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: forbrukere
    name: Mike R.
    title: Fritidskajakkpadler
    location: Florida, USA
    content: Solid byggekvalitet. Håndterer kysthogg mye bedre enn jeg forventet fra en gummibåt. Pakket den i bagasjerommet for en helgetur - blåst opp ved rampen på under 4 minutter.
    rating: 5
    product: Oppblåsbar kajakk
