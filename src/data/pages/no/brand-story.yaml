content_founding:
  tagline: Begynnelsen
  title: 'Født ved vannet'
  subtitle: 'Aquafarer startet i et kystverksted i Qingdao med én båt og en visjon: å bygge oppblåsbare farkoster som tåler ekte marine forhold.'
  paragraphs:
    - 'I 2012 så grunnleggerne våre et hull i markedet — de fleste oppblåsbare båter var enten rimelige men upålitelige, eller av høy kvalitet men uoverkommelig dyre. De trodde det var rom for en produsent som leverte både kvalitet og verdi.'
    - 'Det første skroget ble bygget for hånd, testet i lokale farvann og forbedret ut fra ekte tilbakemeldinger fra fiskere og små kommersielle operatører. Den tilbakemeldingssløyfen — bygge, teste, lytte, forbedre — står fortsatt i kjernen av vår ingeniørfilosofi.'
    - 'Innen 2015 hadde ryktet spredt seg utover Qingdao. Internasjonale distributører begynte å be om prøveeksemplarer. Det som startet som et lokalt verksted, ble en global leverandør.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarers tidlige produksjonsverksted og produksjon
content_growth:
  tagline: Vekst & innovasjon
  title: 'Fra verksted til et anlegg på 12 000 m²'
  subtitle: 'Kontinuerlig investering i mennesker, utstyr og prosesser har forvandlet Aquafarer til et moderne marint produksjonsanlegg.'
  paragraphs:
    - 'Etter hvert som etterspørselen vokste, vokste også anlegget vårt. Vi utvidet fra et lite verksted til en fabrikk på 12 000 m² med egne produksjonslinjer for RIB-båter, oppblåsbare båter, SUP-brett og tilbehør.'
    - 'Vi investerte i CNC-skjæremaskiner, høyfrekvenssveiseutstyr, drop stitch-produksjonslinjer og omfattende testoppstillinger — som lar oss kontrollere alle aspekter av produksjonskvaliteten.'
    - 'I dag består teamet vårt på 200–300 personer av marineingeniører, materialforskere, kvalitetskontrollspesialister og dyktige håndverkere — mange av dem har vært med i Aquafarer siden de tidlige årene.'
content_mission:
  tagline: Vår misjon
  title: 'Frihet På Vannet, Ingenjørmessig Bygget'
  subtitle: 'Hvert Aquafarer-produkt er designet for å hjelpe mennesker med å utforske, arbeide og trives på vannet — pålitelig, trygt og rimelig.'
  list:
    - 'Konstruer farkoster som presterer i ekte marine forhold — ikke bare på papiret'
    - 'Bygg varige partnerskap med distributører og merkevarer gjennom pålitelig OEM/ODM-service'
    - 'Forbedre produksjonsprosessene våre kontinuerlig for å levere bedre verdi'
    - 'Støtt hvert produkt med ekte reservedeler og teknisk ekspertise'
cta:
  title: 'Klar til å samarbeide med en produsent<br />som bryr seg om kvalitet?'
  subtitle: 'Kontakt teamet vårt for å diskutere OEM/ODM-prosjektet ditt — ingen press om minimumsordre, bare ærlige råd.'
  actions:
