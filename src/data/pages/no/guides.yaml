hero:
  tagline: Guider
  title: Ny på SUP?
  subtitle: Praktiske guider som hjelper deg å velge, bruke og nyte oppblåsbart vannsportsutstyr.
size_guide:
  tagline: Størrelse og spesifikasjoner
  title: Finn riktig størrelse for dine behov
  desc: Sammenlign produktdimensjoner, vektkapasitet og anbefalt bruk. Enten du trenger en tur-SUP, en kompakt kajakk eller en kommersiell RIB - vår størrelsesguide hjelper deg å velge riktig passform.
  link_label: Full størrelse guide med produktspesifikasjoner →
  link: /size-guide
  cards:
    - title: SUP-brett
      desc: Velg lengde basert på vekt og tiltenkt bruk. Bredere brett (32"+) gir mer stabilitet. Lengre brett (11–12 fot) spor bedre for turer.
    - title: Kajakker
      desc: Enkeltkajakker (9 fot) for soloreiser og elver. Tandemkajakker (12 fot) for to padlere eller en med utstyr. Sjekk alltid vektkapasiteten.
    - title: Joller og RIB-er
      desc: Velg lengde etter antall passasjerer og bruk. Større RIB-er (4,5 m+) for offshore og redning. Mindre joller (2,7 m) som anbud og fiskeplattformer.
