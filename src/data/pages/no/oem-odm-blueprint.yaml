faq:
  title: OEM/ODM — Ofte stilte spørsmål
  questions:
    - q: Hva er minimum bestillingskvantum (MOQ) for tilpasset oppblåsbar SUPs?
      a: For standardmodeller med eksisterende former starter MOQ på 5–10 enheter per design. For helt tilpassede former og verktøy er MOQ vanligvis 200 enheter. Vi jobber med oppstartsbedrifter og nye merker for å finne gjennomførbare inngangspunkter.
    - q: Hvor lang tid tar OEM prøveprosessen?
      a: Standard prototypsamples ferdigstilles innen 7–14 arbeidsdager etter designgodkjenning. Hastemaler kan prioriteres til 5–7 dager mot et tillegg.
    - q: Hva er forskjellen mellom PVC og Hypalon for oppblåsbare båter?
      a: PVC er lettere, mer rimelig, og tilbyr utmerket fleksibilitet i kaldt vær. Hypalon (CSM) gir overlegen UV og ozonmotstand med lengre levetid (10–15 år mot 5–8 år). Vi anbefaler PVC for de fleste fritidsapplikasjoner og Hypalon for kommersiell/profesjonell bruk.
    - q: Kan du tilpasse formen og designet på oppblåsbaren?
      a: Ja. Vårt FoU-team kan utvikle spesialformer for enhver skrogform, brettpensjel eller tubekonfigurasjon. Vi bruker CNC-maskinerte aluminiumsformer for presisjon og konsistens.
    - q: Tilbyr dere fabrikkrevisjonstjenester?
      a: Vi ønsker fabrikkrevisjoner på stedet og fra tredjeparter velkommen ved vårt 12 000 m² store anlegg i Qingdao. Vi opprettholder ISO 9001- og BSCI-sertifiseringer og kan dele revisjonsrapporter etter NDA.
    - q: Hvilke fraktbetingelser tilbyr dere?
      a: Vi tilbyr FOB Qingdao (standard), CIF og DDP fraktbetingelser. Containerlasting og full eksportdokumentasjon er inkludert i alle OEM bestillinger.
content_profiles:
  tagline: Merkevareprofiler
  title: OEM / Produksjon av private merker<br />Etter kundetype
  subtitle: Ulike merkevareprofiler har forskjellige krav — vi tilpasser våre OEM/ODM-tjenester for å matche forretningsmodellen, skalaen og markedsstrategien din.
  items:
    - title: Oppstartsvannfartøymerker
      subtitle: Lav MOQ, rask opptrapping
      description: Entreprenører og grunnleggere som lanserer sin første serie av SUPs, kajakker eller oppblåsbare båter. Du trenger en produksjonspartner som behandler merkevaren din som sin egen — med lave inngangsbarrierer, fleksible batchstørrelser og praktisk designveiledning i hvert steg av prosessen.
      features:
        - MOQ så lavt som 50–100 enheter per SKU, ikke tusenvis
        - Forhåndseksisterende støpeformbibliotek for å unngå verktøykostnader
        - 'Fullt merkevarepakke: logo, tubegrafikk, emballasje, merkelapper'
        - Sample-first arbeidsflyt — godkjenn før produksjon
    - title: Etablerte marinemerker
      subtitle: OEM skala med CE/ISO samsvar
      description: Eksisterende båt-, PWC- eller marineutstyrmerker som legger til oppblåsbare vannfartøy i porteføljen. Du trenger jevn kvalitet på tvers av produksjonsserier, overholdelse av forskrifter for globale markeder, og mulighet til å sameiere egendefinerte skrog- eller rørformer.
      features:
        - Tilpasset 3D-formteknikk for proprietære design
        - CE 2013/53/EU, UKCA, USCG samsvarsdokumentasjon
        - BSCI sosiale revisjonsrapporter for forhandlerens samsvar
        - Dedikert kontoadministrasjon + prioritert produksjonsrom
    - title: DTC- og netthandelsmerker
      subtitle: Butikkklart emballasje i stor skala
      description: Nettbaserte merker som selger gjennom Amazon, Shopify eller sine egne nettbutikker. Emballasje, opplevelsen ved å åpne produktet, og konsekvent enhetskvalitet er avgjørende. Du trenger en fabrikk som forstår hastigheten og returprosenten i netthandel.
      features:
        - Detaljhandelsklar eske design + trykking av innstikkkort
        - Vakuumpakking / palletering for kostnadseffektiv frakt
        - EAN / UPC-strekkode og tollen-klar dokumentasjon
        - Konsolidering av blandede containere for å optimalisere landingskostnad
    - title: Livsstil- og friluftsmerker
      subtitle: White-label design + kategoriutvidelse
      description: Kles-, frilufts- eller reisemerker som går inn i vannsportkategorien under eget merke. Du har kanskje ikke marin engineering-kompetanse internt — så du trenger en partner som kan veilede deg fra konsept til container med minimal friksjon.
      features:
        - Trendanalyse og konseptstemningsbrett
        - Samarbeidsmerkede begrensede utgaver og sesongbaserte fargevarianter
        - Design-til-prøve-syklus på 10–14 virkedager
        - 'Ende-til-ende logistikk: fabrikk → lager → forbruker'
