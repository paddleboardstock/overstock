content_challenge:
  tagline: Utfordringen
  title: Akvakultur krever<br />Saltvann-tøft utstyr
  subtitle: Oppdrettsanlegg, perlefarmer og havrancher opererer i det mest kjemisk aggressive marine miljøet – langvarig saltvannseksponering, drivstoff- og fôrrester og kontinuerlig daglig bruk.
  paragraphs:
    - Akvakulturdrift går 365 dager i året i utsatte kyst- og havmiljøer. Arbeidsbåtene som brukes til merdkontroll, fôrtransport, vedlikehold av perlelinjer og service av utstyr, utsettes for konstant nedsenkning i saltvann, UV-eksponering og kjemisk kontakt fra drivstoff, fiskefôr og antifoulingbehandlinger.
    - '**Korrosjon er hovedfienden** — Standard marineutstyr forringes raskt under disse forholdene. Utenbordsmotorer, tilhengerrammer og skrogbeslag må stadig byttes ut. Drivere trenger båter bygget i korrosjonsbestandige materialer som tåler år i dette miljøet uten å forringes.'
    - '**Daglig pålitelighet er avgjørende** — En havarert arbeidsbåt betyr tapt fôringsplan, forsinket innhøsting og kostbare produksjonstap. For perleoppdrett kan én tapt inspeksjonsdag bety betydelige skader på innhøstingen. For fiskeoppdrett påvirker forsinket fôring vekstrater og lønnsomhet.'
    - Paddle Board Overstock akvakultur-RIB-er er konstruert med korrosjonsbestandig beslag, ekstra slitesterke Hypalon-tuber og forsterkede skrog, spesialbygd for de krevende forholdene innen fiskeoppdrett, perleoppdrett og havranching.
content_solution:
  tagline: Vår løsning
  title: Formålsbygde RIB-er<br />For havbruksnæringen
  subtitle: Hver Paddle Board Overstock akvakulturarbeidsbåt er designet for å tåle aggressive saltvannsmiljøer samtidig som den leverer pålitelig daglig ytelse.
  list:
    - Hypalon-tuber i marin kvalitet — overlegen motstand mot UV, saltvann, drivstoff og kjemikalier fra fiskefôr
    - Beslag i rustfritt stål 316 i hele båten — ingen rust ved langvarig saltvanneksponering
    - Forsterkede gnagslister og kjølbeskytter for gjentatt kontakt med brygger og merder
    - Selvtømmende dekk for enkel vasking og drenering etter fôrtransport og innhøstingsoperasjoner
    - Flat dekkkonfigurasjon for transport av fôrsekker, innhøstingskasser og utstyr
    - Utenbordskonfigurasjoner fra 15 til 60 hk — optimalisert for forholdet mellom nyttelast og drivstoffeffektivitet
    - Fargealternativer for tuber med høy synlighet for enkel gjenkjenning over store oppdrettsområder
content_segments:
  tagline: Akvakulturprofiler
  title: Arbeidsbåtløsninger<br />Etter akvakulturtype
  subtitle: Ulike akvakulturoperasjoner har ulike arbeidsbåtkrav – fra små smidige RIB-er for inspeksjon av merd til stabile transportplattformer for perleoppdrett og tunge arbeidsbåter for havbeite.
  items:
    - title: Fiskeoppdrettsvirksomhet
      subtitle: Merdkontroll, fôrtransport, innhøstingsstøtte
      description: Marine oppdrettsanlegg driver merder på utsatte kyst- og offshoreplasser. Arbeidsbåter brukes daglig til inspeksjon av merdnett, fôringsoperasjoner, høstestøtte og vedlikehold av utstyr. Den primære utfordringen er korrosjon – båter er konstant utsatt for saltvann, fiskefôrrester og drivstoff. En pålitelig arbeidsbåt er avgjørende fordi tapt fôring eller forsinket høsting direkte påvirker produksjonen og lønnsomheten.
      features:
        - 'Pakke for aggressive miljøer: beslag i rustfritt stål 316, komponenter i marin legering'
        - Flatt dekkoppsett for transport av fôrsekker og innhøstingskasser
        - Selvtømmende dekk for enkel skylling etter innsatsene
        - Hypalon-tuber med kjemikalierezistent belegg for eksponering for fôr og drivstoff
        - Forsterkede gnagslister for hyppig kontakt med merder og brygger
    - title: Perleoppdrettsdrift
      subtitle: Stabil transport for perlelinjeinspeksjon og høsting
      description: Perlefarmer krever stabile, pålitelige arbeidsbåter for daglig transport mellom perlelinjer, inspeksjon av østersnett og høsting. Disse operasjonene foregår på avsidesliggende kystnære steder med begrenset vedlikeholdsinfrastruktur. Båten må være stabil nok til at mannskapet kan jobbe fra mens de inspiserer perlelinjer, med enkel ombordstigning og god dekksplass for å frakte høstede østers, garn og forsyninger. Pålitelighet og enkelt vedlikehold er avgjørende på avsidesliggende gårdsplasser.
      features:
        - Stabil skrogkonstruksjon for stående mannskap ved inspeksjon av perlelinjer
        - Flatt dekk med sklisikkert overflate for trygge bevegelser for mannskapet
        - Lavt fribord for enkel tilgang til østersnett og innhøsting
        - Enkel utenbordskonfigurasjon for enkel service på stedet
        - Korrosjonsbestandig tube- og beslagpakke for kontinuerlig saltvanneksponering
    - title: Havranching og marin forbedring
      subtitle: Yngeltransport, burservice, overvåkingsstøtte
      description: Havoppdrettsoperasjoner involverer utsetting av ungfisk i forvaltede marine miljøer, overvåking av vekst og vedlikehold av forbedringsstrukturer. Arbeidsbåter må transportere levende ungfisk i luftede containere, bære overvåkingsutstyr og få tilgang til grunne kystutsettingssteder. Skrogdesign må balansere bæreevne med grunt dypgående for tilgang til strand og elvemunning.
      features:
        - Dekkplass til luftede transportbeholdere for yngel og overvåkingsutstyr
        - Lite dyptgående for tilgang til utsettingsområder ved strender og elvemunninger
        - Enkel landing på stranden — forsterket kjøl og baugbeskyttelse
        - Festepunkter for montering av overvåkingselektronikk og prøvetakingsutstyr
        - Ekstra slitesterke Hypalon-tuber for holdbarhet i blandede sand- og sjøvannsforhold
