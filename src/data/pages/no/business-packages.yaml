faq:
  title: Vanlige spørsmål om pakke
  questions:
    - q: Hva er minimum bestillingsantall for pakker?
      a: Klubbstartpakke har minimum 10 enheter. Resort- og merkevarepakker er tilpasset dine behov med fleksible MOQs.
    - q: Hvor lang tid tar leveringen?
      a: Standard produksjon er 30–45 dager fra ordrebekreftelse. Fremskyndet produksjon er tilgjengelig mot en ekstra avgift.
    - q: Kan jeg tilpasse utstyrets farger og merkevarebygging?
      a: Ja. Alle pakkene inkluderer full tilpasning - bordfarger, logoutskrifter og emballasjedesign.
    - q: Gir du ettersalgsstøtte?
      a: Ja. Hver pakke inkluderer tilgang til våre online vedlikeholdsveiledninger, videoveiledninger og reservedelsbestillingssystem.
