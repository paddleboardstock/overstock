section_faq:
  title: Tekniske vanlige spørsmål
  questions:
    - q: Hvordan er drop-stitch sammenlignet med tradisjonell hard-shell-konstruksjon?
      a: Moderne drop-stitch-kjerner ved 20 PSI oppnår 85–90 % av stivheten til sammenlignbare EPS-skum/glassfiberharde skall, samtidig som de er fullt utblåsbare for transport. Avveiningen er litt høyere vekt og lavere ultimativ stivhet - men for de fleste rekreasjons- og kommersielle bruksområder er forskjellen ubetydelig.
    - q: Hvilken trådtetthet regnes som førsteklasses kvalitet?
      a: Premium drop-stitch-stoffer bruker 2 tråder per kvadrattomme (omtrent 3100 tråder per m²) vevd av 1680 DTEX polyestergarn. Stoffer på startnivå bruker 1 tråd per kvadratmeter med 1100 DTEX-garn.
    - q: Kan Hypalon sveises som PVC?
      a: Nei. Hypalon/CSM kan ikke RF-sveises. Den må monteres med håndpåført kontaktsement, noe som gjør produksjonen mer arbeidskrevende og sømmer avhengig av operatørens ferdigheter. PVC kan RF-sveises eller varmluftsveises for jevn, automatisert sømkvalitet.
    - q: Hva er det maksimale sikre trykket for gummibåter?
      a: Standard oppblåsbare båtrør fungerer ved 8–12 PSI. Drop-stitch-gulv fungerer ved 12–20 PSI. Høytrykks drop-stitch-kjerner (SUP-er) kan operere ved 20–25 PSI. Hvert produkt inkluderer trykkavlastningsventiler som er kalibrert for å forhindre overoppblåsing.
    - q: Hvor lang tid tar det å produsere en tilpasset gummibåt?
      a: Standard OEM-produksjon går 30–45 dager fra ordrebekreftelse til FOB Qingdao. Tilpasset formutvikling legger til 15–20 dager for prototypeproduksjon og testing.
