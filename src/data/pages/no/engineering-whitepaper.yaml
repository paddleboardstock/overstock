section_testing:
  title: Testing og sikkerhetsprotokoller
  subtitle: Aquafarers kvalitetssikringsrammeverk for hvert produksjonsparti
  protocols:
    - title: 1,25x nominell trykkholdtest
      description: Hvert sammensatt fartøy blåses opp til 1,25 ganger det nominelle driftstrykket og holdes i 24–48 timer. Ethvert trykkfall som overstiger 2 % utløser avvisning og omarbeiding.
      standard: ISO 6185
    - title: Skrellstyrketest for søm
      description: Sveise- og limsømprøver fra hver produksjonsbatch testes for flellstyrke ved bruk av kalibrert strekkutstyr. Minimum 4 kN/m skrellemotstand kreves.
      standard: ISO 2411
    - title: Strekktest for stoff
      description: Innkommende stoffruller gjennomgår strekkstyrke- og forlengelsestesting i både varp- og veftretninger. Avvisningsterskel under 3000 N/5cm for PVC.
      standard: ISO 1421
    - title: UV-akselerert forvitring
      description: Materialprøver utsettes for 1000+ timer med akselerert UV-eksponering i QUV-testkamre. Maksimalt 15 % strekkfasthetstap tillatt.
      standard: ASTM G154
    - title: Ventil- og tilpasningsintegritet
      description: Hver ventilenhet er testet for tetningsintegritet ved 1,25x nominelt trykk. Lekkasjeventiler er testet for enveis tetningsytelse.
      standard: ISO 12402
