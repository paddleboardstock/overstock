features3_reasons:
  tagline: Hvorfor velge Aquafarer
  title: 'Sju grunner til å bli vår partner'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Ekte produksjon, ikke handel'
      description: 'Vi eier og driver en fabrikk på 12 000 m². Når du samarbeider med Aquafarer, jobber du direkte med menneskene som designer, konstruerer og bygger produktene dine — uten mellomledd.'
      icon: tabler:building-factory
    - title: '2. Ingeniørdrevet tilnærming'
      description: 'Designprosessen vår starter med bruksområdet, ikke produktkategorien. Vi optimaliserer skrogform, materialvalg og konfigurasjon etter hvordan båten faktisk skal brukes.'
      icon: tabler:engine
    - title: '3. Sertifisert kvalitet'
      description: 'CE-sertifisert, ISO-kvalitetssystem, BSCI-samsvar, REACH-samsvar, USCG-godkjent. Våre 64 CE-sertifiserte modeller oppfyller internasjonale standarder — ikke bare påstander.'
      icon: tabler:certificate
    - title: '4. Fleksibelt OEM/ODM'
      description: 'Tube-farger, konsollayout, merkevarebygging, emballasje — vi tilpasser etter dine spesifikasjoner. Ingen press om minimumsbestilling. Start med en prototype og skaler med trygghet.'
      icon: tabler:adjustments
    - title: '5. Global logistikk'
      description: 'USA-lager i California, direkte forsendelse fra Qingdao, luftfrakt for hastende ordrer. Vi håndterer tollpapirer og dokumentasjon.'
      icon: tabler:truck-delivery
    - title: '6. Livstidsstøtte'
      description: 'Vi støtter båter vi bygde for 20 år siden. Ekte reservedeler, teknisk rådgivning, reparasjonsveiledning — teamet vårt er tilgjengelig når du trenger oss.'
      icon: tabler:lifebuoy
    - title: '7. Ærlige spesifikasjoner'
      description: 'Ekte lasteevner, ekte dimensjoner, ekte vekt. Ingen markedsføringsoppblåsning. Det vi publiserer er det du får — verifisert av uavhengige tester.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Tillit fra merkevarer over hele verden
  title: Hva partnerne våre sier
  items:
    - content: 'Vi har jobbet med flere produsenter i Kina, men Aquafarer skiller seg ut med ingeniørstøtte og konsekvent kvalitet. De behandler merkevaren vår som sin egen.'
      name: '— OEM-partner, europeisk vannsportsmerkevare'
    - content: 'Hypalon-RIB-ene deres har vært i tjeneste i flåten vår i over 5 år. Minimalt vedlikehold, utmerket UV-motstand. 5-års garanti på tubene gir oss trygghet.'
      name: '— Flåteoperatør, resortgruppe i Midtøsten'
    - content: 'Aquafarer-teamet hjalp oss med å utvikle en skreddersydd SUP-brettdesign fra konsept til produksjon på 90 dager. Kvaliteten overgikk forventningene våre.'
      name: '— Distributør, australsk vannsport'
cta:
  title: 'Klar til å kjenne forskjellen?'
  subtitle: 'Kontakt teamet vårt for å diskutere prosjektet ditt. Ingen forpliktelser — bare ærlige råd om produksjon.'
  actions:
    - variant: primary
      text: Snakk med teamet vårt
      href: /contact
    - text: Last ned produktkatalog
      href: /resources
