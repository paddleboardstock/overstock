material_traceability:
  tagline: Sporbarhet
  title: Materialsporing og batchkontroll
  description: Hvert batch av råstoff er tildelt et unikt lotnummer i vårt ERP-system. Fra ankomst gjennom produksjon til ferdig produkt, kobles hver båts stykkliste tilbake til den opprinnelige leverandørbatchen. Dette muliggjør full oppstrøms sporbarhet for enhver kvalitets- eller samsvarsforespørsel.
  system: Tilpasset ERP (internt system) + fysiske batch-tagger på hver arbeidsordre
  coverage: 100 % av produksjonsmaterialene — PVC, Hypalon, drop-stitch-stoff, lim, ventiler, maskinvare, emballasje
  records_retained: 10 år (i henhold til CE 2013/53/EU-krav)
  suppliers:
    - material: Marin PVC
      source: Kinesiske og koreanske leverandører
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japansk leverandør
      certified: ISO 9001, REACH
    - material: Drop-stitch-stoff
      source: Eget veveri + ekstern partner
      certified: Intern kvalitetskontroll + leverandør ISO 9001
    - material: Ventiler & beslag
      source: Kinesiske OEM-leverandører
      certified: ISO 9001, materialsertifikater per batch
