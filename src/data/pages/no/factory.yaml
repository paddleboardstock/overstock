production_flow:
  tagline: Produksjonsflyt
  title: Fra materiale til ferdig båt
  subtitle: Hver båt går gjennom 6 produksjonsstadier med QC-sjekkpunkter ved hvert trinn. Ingen snarveier, ingen hoppet over inspeksjoner.
  stages:
    - stage: '01'
      title: Materialmottak og innkommende kvalitetskontroll
      description: Alt innkommende materiell logges etter batch-/lotnummer i vårt ERP-system. PVC stoffruller, drop-stitch-kjerner, ventiler, lim og maskinvare er i karantene frem til QC-signering.
      qc_check: Strekkfasthet (ASTM D751), rivemotstand (ISO 4674), tykkelsesmåler, limviskositet, skanning av visuelle defekter
      qc_threshold: 100 % av batchene testet. Avvis hvis strekk < 90 % av spesifikasjonen, rive < spesifikasjonsminimum, eller visuell defekt
      responsibility: Innkommende QC-team (3 inspektører)
    - stage: '02'
      title: CNC-skjæring og materialforberedelse
      description: Dataoptimalisert nesting legger ut paneler på PVC lager for å minimere avfall. Automatiske CNC-skjæremaskiner opprettholder 0,1 mm posisjonsnøyaktighet.
      qc_check: Dimensjonssjekk mot CAD DXF-filer, inspeksjon av kantkvalitet, verifisering av panelantall
      qc_threshold: Hvert 20. panel målt. Toleranse ±0,5 mm. Avvis batch hvis >2 % utenfor toleranse
      responsibility: Leder for skjæreverksted
    - stage: '03'
      title: Sveising & Drop-Stitch Bonding
      description: Drop-stitch-kjerner er bundet til ytre PVC-laminater ved hjelp av varmelaminering. Rørkamre er RF-sveiset eller varmluftsveiset. Skinnebånd er trelags fusjonsbundne.
      qc_check: Avrivningstest hver 50. enhet (ASTM D751), måling av sveisebredde, gjennomgang av varmlufttemperaturlogg, visuell søminspeksjon under bakgrunnsbelysning
      qc_threshold: Skrellstyrke min 8 N/cm. Sveisebreddetoleranse ±1 mm. Eventuell synlig kanalisering = avvise
      responsibility: Sveise-QC (2 inspektører per skift)
    - stage: '04'
      title: Montering & rigging
      description: 'Båter flyttes til sluttmontering hvor alle komponenter er sammenkoblet: skrog + rør, installerte ventiler, D-ringer, håndtak, finnebokser og bæreveskebeslag. Hver enhet følger en 100-punkts sjekkliste for montering.'
      qc_check: 100-punkts sjekklisteavtegning per enhet, ventilfunksjonstest (10 åpne/lukke sykluser), verifisering av maskinvaremoment, visuell inspeksjon
      qc_threshold: 'Nulldefektpolicy på sikkerhetskritiske gjenstander (ventiler, D-ringer, håndtak). Mindre kosmetikk: AQL 2,5 (ISO 2859)'
      responsibility: Monteringsteamleder + linje QC
    - stage: '05'
      title: Trykktesting og kvalitetshold
      description: Hvert kammer blåses opp til 1,25 × nominelt trykk (vanligvis 20–25 PSI) og holdes i 24–48 timer. Trykksensorer logger kontinuerlig. Kammere over 5 % trykkfall avvises og sendes til ny inspeksjon av sømmen.
      qc_check: 24-timers trykkholdelogg, sensorkalibrering verifisert daglig, temperaturkompensert trykkavlesning, ny sømtest etter reparasjon
      qc_threshold: Maks 5 % trykkfall over 24 timer ved stabil temp. Ethvert kammer som overskrider dette = 100 % re-test av hele produksjonspartiet
      responsibility: Kvalitetslaboratorium (uavhengig av produksjon, rapporter til ledelsen)
    - stage: '06'
      title: Sluttkontroll og pakking
      description: Avsluttende visuell og funksjonell inspeksjon. Overflatedefekter, fargekonsistens, etikett/BIN-verifisering, emballasjeintegritet og kompletthet av tilbehør. Enhetene er vakuumpakket, eskes og palleteres for containerlasting.
      qc_check: Full visuell inspeksjon, sjekkliste for tilbehør per SKU, emballasjedråpetest (1 m, tilfeldig prøve), etikett-/strekkodeskanningsverifisering
      qc_threshold: AQL 2,5 for større defekter, AQL 4,0 for mindre. Nulltoleranse for sikkerhetsfeil. 100 % av enhetene visuelt inspisert
      responsibility: Endelig QC-team (4 inspektører) + Leder for pakkingsteam
