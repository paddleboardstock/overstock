  title: Sikkerhetsstandarder og sertifisering
  subtitle: Alle Paddle Board Overstock-produkter gjennomgår grundige tester, og 64 CE-sertifiserte modeller oppfyller internasjonale sikkerhetsstandarder for fritids- og profesjonelt bruk. ISO 9001-sertifisert fabrikk.
