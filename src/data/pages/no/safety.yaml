certifications:
  - title: CE-sertifisering (EU 2016/425)
    standard: PPE-forordning (EU) 2016/425 | EN ISO 12402
    description: Alt Paddle Board Overstock-sikkerhetsutstyr oppfyller CE-merkekravene i henhold til EUs forordning om personlig verneutstyr. Hvert produkt testes uavhengig av TÜV Rheinland, et europeisk notifisert organ. Våre gummibåter og RIB-båter oppfyller kravene til kategori C og D i direktivet om fritidsbåter 2013/53/EU (RCD).
    body: CE-sertifisering dekker grunnleggende helse- og sikkerhetskrav for personlige flytehjelpemidler og oppblåsbare farkoster. TÜV Rheinland reviderer produksjonsanlegget vårt årlig for å bekrefte løpende etterlevelse.
  - title: SOLAS — sikkerhet for menneskeliv til sjøs
    standard: SOLAS kapittel III | LSA-koden
    description: Life Vest Pro oppfyller SOLAS-regelverket for offshore- og kommersielle marine operasjoner. Testet for 24 timers flyteevne, automatisk oppblåsing ved neddykking og ytelse i sjøtilstander opp til styrke 5. Oppfyller kravene i kapittel III for redningsvester på kommersielle fartøy.
    body: SOLAS-godkjenning krever uavhengige tester av et notifisert organ for flyteevne, styrke, synlighet og automatisk aktivering. Vår Life Vest Pro har full SOLAS-typegodkjenning med MED-sertifisering.
  - title: USCG Type III / Type V
    standard: 46 CFR Del 160 | USCG-godkjenning
    description: Utvalgte Paddle Board Overstock-redningsvester oppfyller klassifiseringen til United States Coast Guard for type III (flytehjelp) og type V (spesialbruk). Egnet for skjermede farvann, kystseilas og kommersielle operasjoner som krever USCG-godkjente redningsvester (PFD).
    body: USCG-godkjenning krever tester av et uavhengig laboratorium anerkjent av kystvakten. Type V-godkjenning inkluderer hybride oppblåsbare konstruksjoner som krever manuell eller automatisk aktivering.
  - title: BSCI samfunnsansvar
    standard: amfori BSCI adferdsnormer
    description: Fabrikken vår revideres årlig i henhold til amforis Business Social Compliance Initiative (BSCI). Dette bekrefter etiske arbeidspraksiser, arbeidssikkerhet, rimelige arbeidstider og miljøstyring i produksjonsanlegget vårt på 12 000 m².
    body: BSCI-etterlevelse er et vilkår for europeiske forhandlere og importører. Vår nåværende BSCI-vurdering er "C" (God), revidert av SGS.
  - title: REACH- og RoHS-etterlevelse
    standard: EU-forordning REACH (EF) 1907/2006 | RoHS-direktiv 2011/65/EU
    description: Alle PVC-forbindelser, lim og belegg som brukes i Paddle Board Overstock-produkter, oppfyller EUs kjemikaliesikkerhetsforskrift REACH og RoHS-begrensningene for farlige stoffer. Sikkerhetsdatablad (MSDS) er tilgjengelige for hver produktlinje.
    body: REACH-etterlevelse sikrer at ingen begrensede SVHC-stoffer overstiger grenseverdiene. Regelmessige tester hos uavhengige laboratorier bekrefter løpende etterlevelse for hver produksjonsbatch.
  - title: ISO 9001:2015 kvalitetsstyring
    standard: ISO 9001:2015 | Sertifisert av TÜV Rheinland
    description: Vårt kvalitetsstyringssystem er ISO 9001:2015-sertifisert av TÜV Rheinland og dekker design, produksjon, testing og ettermarkedservice. Årlige oppfølgingsrevisjoner sikrer kontinuerlig forbedring og prosesskontroll.
    body: ISO 9001-sertifisering krever dokumentert kvalitetspolitikk, interne revisjoner, ledelsesgjennomganger, korrigerende handlingsprosedyrer og sporbare produksjonsregistreringer.
testimonial:
  quote: Vi har kjøpt sikkerhetsutstyr fra flere leverandører i Asia. Paddle Board Overstock er den eneste produsenten som leverte komplett CE-dokumentasjon, SOLAS-sertifikater og testrapporter fra tredjepart på forhånd — uten at vi ba om det.
  author: Erik Lindström
  title: Sikkerhetsansvarlig
  company: Baltic Marine Supply
  location: Finland
content_overpressure:
  tagline: Sikkerhet ved overtrykk
  title: Håndtering av RIB-rørtrykk<br />i varme klima
  subtitle: Trykket i oppblåsbare rør øker med temperaturen. Å forstå og håndtere overtrykk forhindrer skader og sikrer trygg drift i tropiske og ørkenmiljøer.
  items:
    - title: Boyle overtrykksventiler
      description: Paddle Board Overstock RIB-rør er utstyrt med overtrykksventiler som automatisk slipper ut overtrykk over nominelt maksimum. Forhindrer sømspenninger og potensielle rørbrudd fra soloppvarming.
      icon: tabler:gauge
    - title: Trykkendring fra morgen til middag
      description: Et rør blåst opp til 3,5 PSI ved 20 °C kan nå 4,5+ PSI ved soleksponering på 40 °C. Blås alltid opp til nedre del av det anbefalte området i varme klima og la overtrykksventilen håndtere overtrykket.
      icon: tabler:sun
    - title: Anbefalte driftstrykk
      description: 'PVC-rør: 3,0-3,5 PSI drift, 4,5 PSI maks. Hypalon-rør: 3,5-4,0 PSI drift, 5,0 PSI maks. Test alltid ved 1,25x nominelt (4,4 PSI for PVC, 5,0 PSI for Hypalon) i henhold til Paddle Board Overstocks QC-standarder.'
      icon: tabler:chart-bar
    - title: Beste praksis for soleksponering
      description: Oppbevar RIB-båter i skyggefulle områder når de ikke er i bruk. Bruk UV-beskyttende dekker ved lengre fortøyning. Kontroller og juster rørtrykket før og etter solens topper. Overskrid aldri maksimalt nominelt trykk.
      icon: tabler:umbrella
    - title: Trykkavlastning i nødsituasjoner
      description: Hvis røret føles for hardt eller overtrykksventilen slipper ut luft, slipp ut luft via Halkey-Roberts- eller militærventilen til trykket er tilbake i driftsområdet. Ha alltid et trykkmåler med deg for nøyaktige avlesninger.
      icon: tabler:alert-circle
