why_us:
  - title: Vertikal integrasjon
    description: Vi eier vår fabrikk, former og forsyningskjede — ingen mellomledd, ingen underleverandører. Dette gir oss kontroll over kvalitet, kostnad og levering.
  - title: Dobbel sertifisering
    description: ISO 9001-kvalitetsstyring og BSCI-sertifisering for sosialt ansvar. Fabrikkrevisjonsrapporter tilgjengelige på forespørsel.
  - title: CE-samsvar
    description: Alle standardmodeller har CE 2013/53/EU-sertifisering. Tilpassede modeller kan CE-sertifiseres gjennom vår etablerte prosess.
  - title: Lavt MOQ
    description: Start med så få som 5 enheter for standardmodeller. Vi hjelper nye merkevarer å lansere uten å binde for mye lager.
