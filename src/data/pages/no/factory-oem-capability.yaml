services:
  - title: Produktdesign og ingeniørfag
    description: Vårt interne R&D-team jobber med konseptet eller spesifikasjonen din for å utvikle CAD-tegninger, 3D-modeller og prototyper. Vi tilbyr formdesign, optimalisering av skrogform og veiledning i materialvalg.
  - title: Skreddersydd merkevare og grafikk
    description: Digitaltrykk i fullfarge, silkscreentrykk, preging og etikettalternativer. Vi utvikler merkevarespesifikk dekkgrafikk, rør-branding og emballasje klar for detaljhandel.
  - title: Tilpasning av materialer og spesifikasjoner
    description: Velg mellom PVC (standard, miljøvennlig, flammehemmende), Hypalon/CSM, drop-stitch og hybridkonstruksjoner. Tilpassede rørfarger, stoffvekt og forsterkningsalternativer.
  - title: Emballasje og logistikk
    description: Skreddersydd detaljhandelsemballasje, private label-esker, vakuum emballasje, palletering og containerlasting. Leveringsbetingelser FOB Qingdao, CIF eller DDP tilgjengelige.

