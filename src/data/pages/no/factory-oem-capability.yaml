hero:
  tagline: OEM/ODM-produksjon
  title: OEM- og private label-produksjon
  subtitle: Fra konsept til container — tilpass hver detalj av din linje med oppblåsbare farkoster

intro: Paddle Board Overstock tilbyr omfattende OEM- og ODM-tjenester for merkevarer, distributører og offentlige etater over hele verden. Med 10+ års eksporterfaring og en fabrikk på 12 000 m² med ISO 9001- og BSCI-sertifisering, håndterer vi alt fra produktdesign og utvikling av former til fullskala produksjon, emballasje og logistikk.

