faq:
  title: RIB OEM/ODM — Ofte stilte spørsmål
  questions:
    - q: Hva er forskjellen mellom OEM og ODM for RIB-båter?
      a: 'OEM (Original Equipment Manufacturing): du gir detaljerte spesifikasjoner og vi bygger ditt design. ODM (Original Design Manufacturing): du velger en velprøvd Aquafarer RIB-plattform og vi tilpasser den med dine ønskede funksjoner og merkevarebygging. ODM er raskere og lavere kostnader; OEM tilbyr maksimal designkontroll.'
    - q: Kan jeg tilpasse RIB-skrogets form og størrelse?
      a: Ja. Vi tilbyr semi-tilpassede modifikasjoner av eksisterende skrogformer (ulike dekksoppsett, rørkonfigurasjoner) og full tilpasset skrogutvikling med nye CNC-maskinerte former. Semi-tilpassede prosjekter kan starte på 2-5 enheter; full tilpasset krever vanligvis høyere forpliktelser.
    - q: Hvilke rørmaterialer er tilgjengelige for tilpassede RIB-er?
      a: Vi tilbyr 0,9-1,2 mm PVC for rekreasjons- og lett kommersiell bruk, og 1,4-1,7 mm Hypalon/CSM for profesjonelle, rednings- og kommersielle applikasjoner som krever overlegen UV- og ozonbestandighet (10-15 års levetid vs. 5-8 år for PVC).
    - q: Kan du konfigurere RIB-er for spesifikke applikasjoner som redning, dykking eller fiske?
      a: Ja. Vi opprettholder velprøvde konfigurasjonsmaler for redning/patrulje, dykkerstøtte, turisme/charter, fiske, yachtanbud og profesjonelle arbeidsbåtapplikasjoner. Hver mal inkluderer anbefalt skrogtype, rørmateriale, dekkslayout og utstyr - som vi deretter tilpasser til dine eksakte krav.
    - q: Hvilken informasjon trenger du for et RIB OEM/ODM-tilbud?
      a: Målapplikasjon, ønsket skroglengde, preferanse for rørmateriale (PVC eller Hypalon), omtrentlig mengde og leveringsplan, krav til målmarkedsoverholdelse og eventuelle referanseprodukter eller spesifikasjoner. Jo flere detaljer du oppgir, jo raskere og mer nøyaktig er tilbudet vårt.
    - q: Hva er MOQ for tilpassede RIB-båter?
      a: For eksisterende skrogformer med standard modifikasjoner starter MOQ på 2-5 enheter per design. For tilpassede former og full tilpasset utvikling avhenger MOQ av prosjektets kompleksitet - vanligvis 10-20 enheter for semi-tilpassede og 30+ for full tilpasset med nytt verktøy.
    - q: Hvem eier de tilpassede formene og tegningene?
      a: Former utviklet med Aquafarer-basedesign forblir Aquafarers eiendom. Fullt skreddersydde former bestilt og betalt av klienten kan tildeles klienteierskap i henhold til kontraktsvilkår. Alle formeiervilkår er dokumentert før prosjektstart.
    - q: Hvordan pakkes tilpassede RIB-er for eksport?
      a: 'Standard: tilpasset vugge + stretch-omslag for containerlasting. Premium: butikkklar emballasje, vakuumpakke eller palletert. Vi tilbyr FOB Qingdao, CIF og DDP frakt. Full eksportdokumentasjon og fortolling inkludert.'
