content_customization:
  tagline: Hva kan tilpasses
  title: RIB-tilpasning<br />Alternativer
  subtitle: Hvert element i en RIB-båt kan skreddersys til ditt bruksområde, marked og merkevarekrav.
  items:
    - title: Skrog og strukturell
      description: Skroglengde (2,5–8,5 m), skrogmateriale (GRP glassfiber eller aluminium av marinekvalitet), skrogfarge (gelcoat eller malt), kjølprofil (dyp-V, moderat-V, flat), akterspeiltype (lukket akterspeil med brakett eller brønn), og strukturell forsterkning for kommersielle belastningskrav.
      icon: tabler:sailboat
    - title: Rør og krage
      description: Rørmateriale (0,9–1,2 mm PVC eller 1,4–1,7 mm Hypalon/CSM), rørdiameter (40–55 cm), antall kammer (3–7), ventiltype (Halkey-Roberts, Leafield D7 eller Boston), rørfarge (standard eller tilpasset), og konfigurasjon av kragekoner/konisk.
      icon: tabler:circle
    - title: Dekk- og konsolloppsett
      description: Midtkonsoll, sidekonsoll eller rorkultstyring. Sitteoppsett (jockeyseter, benkeseter, støtteseter). Dekkbelegg (EVA-skum i teak-look, sklisikker maling eller blank GRP). Utstyrsfestepunkter, gripeskinner og D-ringposisjoner.
      icon: tabler:layout-dashboard
    - title: Elektro og navigasjon
      description: Navigasjonslys (LED), lensepumpesystem, batteristyring, VHF-radioinstallasjon, GPS/kartplottermontering, USB-ladeporter og bryterpanelkonfigurasjon.
      icon: tabler:bolt
    - title: Merkevarebygging og grafikk
      description: Skrog- og rørgrafikk (silketrykk, varmeoverføring, UV digital utskrift), logoplassering, skreddersydde fargeskjemaer, identifikasjonsmerker og tilpasset eierdokumentasjon med ditt merke.
      icon: tabler:palette
    - title: Sikkerhet og samsvar
      description: Designkategorivurdering (A/B/C/D per RCD), brannslokkingssystem, drivstoffsystemspesifikasjon (bærbar tank, fast tank, under dekk) og dokumentasjonspakke for samsvar for målmarkedet.
      icon: tabler:shield
content_applications:
  tagline: Applikasjonskonfigurasjoner
  title: RIB-konfigurasjoner<br />etter applikasjon
  subtitle: Ulike oppdrag krever forskjellige konfigurasjoner. Her er velprøvde oppsett for de vanligste RIB-applikasjonene.
  items:
    - title: Redning og patrulje
      description: Deep-V-skrog, Hypalon-rør, selvlensende dekk, støtteseter, gripehåndtak, navigasjonslys og kraftige D-ringer. RCD-designkategori B eller C. Brannsikkert drivstoffsystem og elektrisk elektrisk.
      icon: tabler:lifebuoy
    - title: Dykkerstøtte
      description: Bred bjelke, ombordstigningsstige bak, tankstativposisjoner, ekstra D-ringer, dykkeflaggfeste, forsterket akterspeil for tvillingpåhengsmotorer, og sklisikre full-dekk EVA-belegg.
      icon: tabler:mask
    - title: Turisme og kommersielt
      description: Passasjersertifisert layout med sittebenk, parasoll/Bimini, håndtak, tørroppbevaring og dobbelt batterisystem. RCD Kategori C. Designet for resort- og charterflåteoperasjoner.
      icon: tabler:beach
    - title: Fiske
      description: Åpent dekklayout, stangholderposisjoner, levende agnbrønn, ekkoloddfeste, trollingmotorfeste, forsterket akterspeil og bærbart drivstoffsystem. Alternativer for midtkonsoll eller sidekonsoll.
      icon: tabler:fish
    - title: Fritid & Yacht Tender
      description: Lett skrog, PVC-rør, komfortable sitteplasser, teleskopisk rorkult eller kompakt konsoll, løftepunkter for davit og flyttbar drivstofftank. RCD kategori C eller D.
      icon: tabler:sailboat
    - title: Profesjonell arbeidsbåt
      description: Aluminiumskrogalternativ, kraftig forsterkning, hydraulisk styring, elektrisk elektrisk, radarbue og oppdragsspesifikke integreringspunkter for kommersiell kvalitet. Tilpasset samsvar per prosjekt.
      icon: tabler:anchor
process_steps:
  title: 7-Trinns RIB OEM/ODM utviklingsprosess
  subtitle: Fra prosjektkort til ettersalg – en definert arbeidsflyt med klare milepæler og leveranser
  steps:
    - number: '01'
      title: Prosjektkort og krav
      description: Definer målapplikasjonen, skrogstørrelsen, rørmaterialet, samsvarskrav og merkevarebehov. Vi vurderer gjennomførbarhet og bekrefter samarbeidsmodellen (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 dager
    - number: '02'
      title: Teknisk gjennomgang og gjennomførbarhet
      description: Ingeniørteamet vurderer strukturell gjennomførbarhet, stabilitet og oppdriftsberegninger, samsvarsvei og materialtilgjengelighet. Vi identifiserer eksisterende former eller tilpassede formkrav.
      timeline: 5–7 dager
    - number: '03'
      title: Forslag og tilbud
      description: Motta et detaljert forslag, inkludert spesifikasjoner, 3D-gjengivelser eller GA-tegninger, samsvarsomfang, tidslinje og enhetspriser basert på volumnivåer og MOQ.
      timeline: 5–7 dager
    - number: '04'
      title: Designbekreftelse og prøvetaking
      description: Godkjenn endelig GA, dekklayout og rørkonfigurasjon. Vi produserer en pre-produksjonsprøve med merkefarger, logo og spesifiserte materialer for din fysiske inspeksjon.
      timeline: 15–20 dager
    - number: '05'
      title: Prøvegodkjenning og QC-protokoll
      description: 'Inspiser og godkjenn prøven. Definer produksjons-QC-protokollen: trykktest (1,25x / 24–48 timer), dimensjonssjekker og sjekkliste for samsvarsdokumentasjon per skrog.'
      timeline: 3–5 dager
    - number: '06'
      title: Masseproduksjon og kvalitetskontroll
      description: Full produksjon med 100-punkts QC-sjekkliste per enhet. Inspeksjoner under prosessen, trykktesting og sporbarhet på serienivå. CE/ISO dokumentasjon utarbeidet parallelt.
      timeline: 30–45 dager
    - number: '07'
      title: Pakking, frakt og ettersalg
      description: Tilpasset emballasje (standard, detaljklar eller palletert), eksportdokumentasjon, containerlasting og logistikk. Reservedelssett og vedlikeholdsdokumentasjon inkludert.
      timeline: 7–14 dager
