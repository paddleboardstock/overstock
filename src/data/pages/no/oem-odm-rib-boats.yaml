content_service_modules:
  tagline: Servicemoduler
  title: OEM/ODM Tjeneste<br />Moduler
  subtitle: Hvert prosjekt kombinerer de riktige servicemodulene. Ikke alle prosjekter trenger hver modul – vi tar kun opp det prosjektet ditt krever.
  items:
    - title: Teknisk gjennomgang og gjennomførbarhet
      description: 'Skrogplattformvurdering, strukturell gjennomførbarhetssjekk, stabilitets- og oppdriftsverifisering, samsvarsbaneidentifikasjon og bekreftelse av materialtilgjengelighet. Utgang: mulighetsrapport med go/no-go-anbefaling.'
      icon: tabler:math-function
    - title: Design og konfigurasjon
      description: 'GA-tegning, dekklayout, rørkonfigurasjon, konsoll- og sitteposisjoner, utstyrsmontering og valg av farge/materiale. Utgang: godkjent GA og konfigurasjonsspesifikasjon.'
      icon: tabler:ruler
    - title: Prøveeksemplar & prototype
      description: Pre-produksjonsprøve med godkjente farger, logo og spesifiserte materialer for fysisk inspeksjon. Inkluderer prøvegodkjenningsprotokoll, inspeksjonssjekkliste og prosess for endringsforespørsel.
      icon: tabler:3d-cube-sphere
    - title: Produksjon & kvalitetskontroll
      description: Masseproduksjon med 100-punkts QC-sjekkliste per enhet, inspeksjoner under prosessen, trykktesting (1,25x / 24-48 timer) og sporbarhet på serienivå. CE/ISO dokumentasjon utarbeidet parallelt.
      icon: tabler:clipboard-check
    - title: Merkevarebygging og emballasje
      description: Logoapplikasjon med eget merke, spesialtilpasset skrog- og rørgrafikk, dokumentasjon for merkevareeier, forhandlerklar eller palletert emballasje og klargjøring av reservedelssett.
      icon: tabler:palette
    - title: Eksport og dokumentasjon
      description: Eksporter pakking, lasteplan for containere, FOB/CIF/DDP dokumentasjon, samsvarspapirer per destinasjonsmarked og kommunikasjonsprotokoll etter levering.
      icon: tabler:world
content_risk_control:
  tagline: Risiko og leveringskontroll
  title: Prosjektrisiko &<br />Leveringsstyring
  subtitle: Profesjonelle OEM/ODM kjøpere bryr seg like mye om risikokontroll som produktkvalitet. Her er hvordan vi klarer det.
  items:
    - title: Definisjon av omfang og eierskap
      description: 'Før utviklingen starter, definerer vi skriftlig: tilpasningsomfang, verktøykrav, prøvegodkjenningskriterier, eierskap til tegninger og støpeformer, og dokumentasjonsansvar. Ingen uklarhet om hvem som eier hva.'
      icon: tabler:file-text
    - title: Endringskontrollprosess
      description: Alle spesifikasjonsendringer etter designbekreftelse følger en dokumentert endringsforespørselsprosess med konsekvensutredning (kostnad, tidslinje, samsvar). Ingen ikke-godkjente modifikasjoner kommer i produksjon.
      icon: tabler:arrows-diff
    - title: Batch-konsistensgaranti
      description: Den 50. enheten samsvarer med den 1. godkjente prøven. Godkjente spesifikasjoner fryses, material- og prosessparametere er låst, og sjekkpunkter under prosessen bekrefter konsistens i hele produksjonskjøringen.
      icon: tabler:repeat
    - title: Levering og kapasitetstransparens
      description: Ledetider er oppgitt basert på faktisk produksjonskapasitet, materiallagernivåer og gjeldende ordrebelastning – ikke ambisjonsmål. Produksjonsplan med milepælsdatoer gitt per bestilling.
      icon: tabler:calendar-stats

