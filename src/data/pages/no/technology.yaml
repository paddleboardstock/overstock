testimonial:
  quote: Det som skiller Paddle Board Overstock er deres materialvitenskap. De setter ikke bare sammen komponenter – de konstruerer PVC-sammensetningene, sveiseparametere og strukturelle oppsett internt. Den vertikale integrasjonen viser seg i sluttproduktet.
  author: David Park
  title: Produktutviklingssjef
  company: Bluewater Sports Equipment
  location: Australia
sections:
  - title: Drop-Stitch-kjerne
    standard: 12-15 PSI driftstrykk
    description: Tusenvis av interne polyestertråder forbinder topp- og bunnlaget, og skaper en stiv struktur ved 12-15 PSI. Dette er den samme teknologien som brukes i profesjonelle padlebrett og oppblåsbare racerbåter. Vår drop-stitch-tetthet er optimalisert per modell for den ideelle balansen mellom stivhet og vekt.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagram over drop-stitch-kjernen
  - title: Marin PVC
    standard: Fusjonssveiset | UV / saltvann / slitasje testet
    description: Flerlags laminert PVC stoff vurdert for marine miljøer. Hvert lag er smeltesveiset i stedet for limt, noe som eliminerer risikoen for delaminering. Testet for UV-motstand (ASTM G154, 1000+ timer), saltvannskorrosjon (ISO 9227) og slitasje (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC-lag
  - title: Hypalon Rør
    standard: CSM gummi | UV / kjemisk / ekstrem temperaturbestandig
    description: Brukt på RIB-modeller gir Hypalon (CSM) gummi overlegen UV- og kjemisk motstand sammenlignet med standard PVC. Hypalon rør opprettholder fleksibilitet i ekstreme temperaturer og motstår nedbrytning fra drivstoff- og oljeeksponering. Alle sømmer er håndlagde av sertifiserte teknikere.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Luftgulv (Air Deck)
    standard: Høytrykks oppblåsbar | Erstatter kryssfiner/aluminium
    description: Høytrykks oppblåsbart gulvsystem som erstatter tradisjonelle gulv i kryssfiner eller aluminium. Reduserer oppsetttid, totalvekt og lagringsvolum samtidig som den gir tilstrekkelig stivhet for stående, fiske og gå. Testet for å støtte 200+ kg fordelt last.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Luftgulv (Air Deck)
