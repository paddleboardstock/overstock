reasons:
  tagline: Paddle Board Overstock forskjellen
  title: Hva som skiller oss
  isBeforeContent: false
  columns: 3
  items:
    - title: Ekte produksjon, ikke handel
      description: Vi eier og driver en fabrikk på 12 000 m². Når du inngår samarbeid med Paddle Board Overstock, jobber du direkte med menneskene som designer, konstruerer og bygger produktene dine — ingen mellomledd.
      icon: tabler:building-factory
    - title: Ingeniørledet tilnærming
      description: Vår designprosess begynner med bruksområdet, ikke produktkategorien. Vi optimaliserer skrogform, materialvalg og konfigurasjon for hvordan utstyret faktisk vil bli brukt i kommersielle miljøer.
      icon: tabler:engine
    - title: Sertifisert kvalitet
      description: CE sertifisert, ISO kvalitetsystem, BSCI samsvarende, REACH samsvarende, USCG Type III/V godkjente redningsvester; alle produkter oppfyller gjeldende internasjonale standarder.
      icon: tabler:certificate
    - title: Fleksibel OEM/ODM
      description: Tubefarger, konsolloppsett, merkevarebygging, emballasje — vi tilpasser etter dine spesifikasjoner. Ingen krav om minimumsbestilling. Start med en prototype, skaler med selvtillit.
      icon: tabler:adjustments
    - title: Global logistikk
      description: US-lager i California, direkte frakt fra Qingdao, luftfrakt for hastende bestillinger. Vi håndterer tollpapirer og dokumentasjon over hele verden.
      icon: tabler:truck-delivery
    - title: Livstidssupport
      description: Vi støtter båter vi bygde for 20 år siden. Ekte reservedeler, teknisk rådgivning, reparasjonsveiledning — vårt team er tilgjengelig når du trenger oss, uansett hvor du er.
      icon: tabler:lifebuoy
testimonials:
  tagline: Pålitelig av merker over hele verden
  title: Hva våre partnere sier
  items:
    - content: Vi har jobbet med flere produsenter i Kina, men Paddle Board Overstock skiller seg ut for deres tekniske støtte og jevne kvalitet. De behandler vårt merke som sitt eget.
      name: — OEM Partner, europeisk vannsportmerke
    - content: Deres Hypalon RIBs har vært i tjeneste med vår flåte i over 5 år. Minimal vedlikehold, utmerket UV motstand. 5-års garantien på rør gir oss tillit.
      name: — Flåteoperatør, Middle East Resort Group
    - content: Teamet Paddle Board Overstock hjalp oss med å utvikle et tilpasset SUP-kortdesign fra idé til produksjon på 90 dager. Kvaliteten overgikk våre forventninger.
      name: — Distributør, australske vannsport
    - content: Som liten bedriftseier var jeg bekymret for minimumsbestillinger (MOQs). Paddle Board Overstock jobbet med budsjettet mitt og hjalp meg med å lansere merket mitt med bare 50 brett. Nå bestiller jeg 500.
      name: — Merkegrunnlegger, amerikansk SUP utleiefirma
cta:
  title: Klar til å bygge vannvirksomheten din?
  subtitle: Kontakt teamet vårt for en gratis konsultasjon. Ingen forpliktelse — bare ærlige råd om utstyr og produksjon.
  actions:
