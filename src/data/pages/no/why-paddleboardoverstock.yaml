hero:
  tagline: Hvorfor Paddle Board Overstock
  title: Bygget annerledes. Bygget for business.<br />Partneren bak vannopplevelser verden over
  subtitle: Ikke bare en produsent — en forretningspartner som designer, utvikler og leverer utstyr av kommersiell kvalitet for klubber, feriesteder, utleieoperatører og nye vannmerker.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock produksjonskvalitet og ekspertise
pillars:
  tagline: Tre pilarer for partnerskap
  title: Hvorfor verdens vannbedrifter velger Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Designet for kommersiell bruk
      description: Vårt utstyr er konstruert for daglig utleie, ikke helgerekreasjon. Kommersiell kvalitet PVC, forsterkede drop-stitch kjerner, UV-stabile Hypalon alternativer, og felt-testet maskinvare betyr lavere vedlikehold, lengre levetid og høyere ROI for din virksomhet.
      icon: tabler:building-factory
      callToAction:
        text: Se kommersiell produktlinje
        href: /products
    - title: Fra idé til marked
      description: 'Lanser ditt vannsportsmerke på 90 dager. Vi guider deg gjennom hvert steg: konseptvalidering, produktvalg, prototype, produksjon, emballasjedesign og global frakt. Ingen krav om minimumsbestilling — start i det små, og øk med selvtillit.'
      icon: tabler:rocket
      callToAction:
        text: Start din merkevare-reise
        href: /oem-odm-blueprint
    - title: Bygget for globale forhold
      description: 'Produkter optimalisert for alle klima: kaldtvannsPVC-formuleringer for Europa, UV-bestandige materialer for Midtøsten og Australia, anti-fuktighetsbehandlinger for Sørøst-Asia. Hver sending er kalibrert til sitt destinasjonsmiljø.'
      icon: tabler:world
