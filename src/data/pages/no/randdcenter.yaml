hero:
  tagline: FoU-senter
  title: FoU-senter
  subtitle: Fokusert på fremgang

intro:
  - Paddle Board Overstocks forsknings- og utviklingssenter (FoU) er drivkraften bak vårt oppdrag om å revolusjonere vannsportsutstyr. Vi styrker vannsportsentusiaster over hele verden med tryggere, mer komfortable og mer nytelsesrike produkter gjennom ustoppelig innovasjon innen oppblåsbare SUP-brett og båter. Vårt dedikerte team av ingeniører, designere og lidenskapelige vannsportseksperter former fremtiden for bransjen, og hever kontinuerlig standarden for kvalitet, ytelse og bærekraft.
  - FoU-anlegget vårt samler materialforskere, marinearkitekter og produksjonsingeniører under samme tak. Fra tekstilformulering og skrogsimulering til sveiseprosessutvikling og fullskala sjøprøver — hvert steg i produktutviklingen er datadrevet og validert gjennom testing.

mission:
  tagline: Vårt oppdrag
  title: Innovasjon for fremtiden av vannsport
  pillars:
    - icon: lightning
      title: Teknologisk fremgang
      desc: Banebrytende nye materialer, design og produksjon for overlegen produktytelse og holdbarhet.
    - icon: design
      title: Brukerorientert design
      desc: Dyptgående forståelse og overgåelse av brukerbehov gjennom ergonomisk og intuitiv produktdesign.
    - icon: globe
      title: Bærekraftig praksis
      desc: Minimering av vårt miljøavtrykk ved å bruke miljøvennlige materialer og prosesser.
    - icon: shield
      title: Urokkelig sikkerhet
      desc: Sikring av de høyeste sikkerhetsstandardene gjennom rigorøse tester og sertifisering.

pillars:
  - title: Teknologisk fremgang
    desc: Banebrytende nye materialer, design og produksjonsprosesser for å levere overlegen produktytelse og holdbarhet.
    icon: tech
  - title: Avanserte materialer
    desc: Utforskning av toppmoderne PVC, Hypalon, kompositter og bærekraftige alternativer for forbedrede produktegenskaper.
    icon: materials
  - title: Bærekraft
    desc: 'Kjerneforpliktelse: Vi er dedikert til miljøansvar gjennom bærekraftig produksjon og resirkulerbare materialer.'
    icon: sustainability

capabilities:
  tagline: Kapabiliteter
  title: FoU-kapabiliteter
  subtitle: Fire kjernefagområder som gir oss ende-til-ende-kontroll over produktutvikling — fra råvareforskning til endelig sertifisering.
  groups:
    - title: Materialvitenskap og tekstilteknologi
      items:
        - Analyse og optimalisering av PVC- og Hypalon-formuleringer
        - UV-stabilisering, flammehemming og antibakteriell tilsetningsutvikling
        - Laminering og adhesjonsteknikk for flerlags tekstiler
        - Akselerert aldringstesting (UV, termisk, fuktighet, saltspray)
    - title: Skrogteknikk og hydrodynamikk
      items:
        - Parametrisk 3D-skrogdesign og CFD-optimalisering
        - Elementmetodeanalyse for strukturelle og støtbelastninger
        - Slepetanktesting av skalerte modeller og ytelsesvalidering
        - Tilpasset skrogutvikling for spesielle oppdragsprofiler
    - title: Sveiseteknologi og sammenføyning
      items:
        - Utvikling og optimalisering av RF-dielektrisk sveiseprosess
        - Varmlufts-, varmkile- og ultralydsveisemetoder
        - Kvalifisering av liming og sømtape
        - Sveisestyrkemodellering og levetidsprediksjon
    - title: Testing, sertifisering og samsvar
      items:
        - Kvalitetsstyring og CE-samsvarstesting
        - Uavhengig tredjepartstesting og sertifiseringsstøtte
        - Utvikling av tilpassede testprotokoller for innkjøpskvalifisering
        - Feilanalyse i drift og grunnårsaksundersøkelse

