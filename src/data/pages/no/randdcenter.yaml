rd_services:
  tagline: Tilpasset FoU
  title: FoU-tjenester for partnere
  services:
    - title: Utvikling av tilpassede materialer
      desc: Vi utvikler tilpassede tekstilformuleringer, laminatstabler og klebesystemer skreddersydd for ditt driftsmiljø og ytelsesmål.
    - title: OEM/ODM-produktteknikk
      desc: Fra konseptskisser til produksjonsklare ingeniørpakker — teamet vårt kan designe, prototype og validere båter under ditt merke.
    - title: Tredjepartstesting og sertifisering
      desc: Bruk våre ISO-kompatible testanlegg for uavhengig materialtesting, produktvalidering og sertifiseringsstøtte.
  cta: Diskuter dine FoU-behov →
  cta_link: /contact

vision:
  tagline: Vår visjon
  title: Forme fremtiden for vannsport
  body: Paddle Board Overstock strever etter å lede gummibåt- og SUP-industrien gjennom kontinuerlig innovasjon, urokkelig kvalitet og et fast forpliktelse til sikkerhet og bærekraft — og til slutt berike opplevelsene til vannsportsentusiaster verden over. Paddle Board Overstock FoU-senter er der lidenskap møter innovasjon, og setter nye standarder for vannsportsbransjen.

labs_section:
  tagline: Laboratorier
  title: Våre laboratorier
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: PVC-tekstillaboratorium
      description: Kontinuerlig forskning og testing av PVC- og Hypalon-rørtekstiler for strekkfasthet, UV-motstand, slitasje og lavtemperaturfleksibilitet for å sikre langsiktig pålitelighet i marine miljøer.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Skrogteknikkstudio
      description: CAD-drevet design og elementmetodeanalyse av HDPE-, aluminium- og glassfiberskrog. Hvert skrog simuleres digitalt for spenningsfordeling og støtmotstand før den første prototypen bygges.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: RF-sveisesenter
      description: Dedikert radiofrekvenssveisanlegg med presis temperatur- og trykkontroll, som produserer høyfaste, lufttette sømmer som overgår industristandarder for oppblåsbare farkoster.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Hydrodynamisk testbasseng
      description: Testing av skalerte modeller i vårt interne testbasseng for å optimalisere skrogform, planingsytelse, stabilitet og drivstoffeffektivitet på tvers av ulike last- og sjøforhold.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypeverksted
      description: Fullskala prototypings- og riggeanlegg der nye modeller bygges, monteres og sjøprøves. Hver prototype gjennomgår et minimum 20 timers vanntestprogram før produksjonsgodkjennelse.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Kvalitets- og inspeksjonslaboratorium
      description: Dedikert kvalitetssikringslaboratorium som utfører strekktester, luftopprettholdelsessykluser, sømflisingstester og materialsertifisering for å sikre at hver båt som forlater verkstedet oppfyller våre publiserte spesifikasjoner.
      href: /randdcenter/quality-inspection-lab
