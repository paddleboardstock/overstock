hero:
  tagline: Om selskapet
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer-verksted
  title: |
    Marine engineering <br />
    i <span class="text-accent dark:text-white">Aquafarer</span>-stil
  subtitle: 'Vi startet i et kystverksted med én båt og en urokkelig overbevisning: marine produkter bør designes som om liv avhenger av dem – for det gjør de. I dag leverer vi til 40+ land, men hvert skrog går fortsatt gjennom de samme hendene som startet selskapet.'

stats:
  title: I tall
  columns: 4
  stats:
    - title: Leverte skrog
      amount: '2,400+'
    - title: Leveringsland
      amount: '50+'
    - title: Samlet erfaring (år)
      amount: '60'
    - title: Gjennomsnittlig responstid (t)
      amount: '24'

features3_what_we_build:
  title: Hva vi bygger
  subtitle: En fokusert produktlinje vi kan ut og inn – ingen halvhjertede løsninger eller badge engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB-båter
      description: RIB med aluminiumsskrog fra 3,3 m til 7,5 m. Designet for patruljering, dykking, fiske og familiebruk.
      icon: tabler:ship
    - title: Oppblåsbare båter
      description: PVC- og Hypalon-oppblåsbare båter fra 2,4 m til 4,2 m. Lette, slitesterke og enkle å oppbevare.
      icon: tabler:speedboat
    - title: Superyacht tender
      description: Kompakte RIB med høye spesifikasjoner, tilpasset moderfartøyets design.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Tilbehør
      description: Belter, pumper, trekk, vanntette vesker, drivstofftanker og elektronikk. Alt kompatibelt med våre båter.
      icon: tabler:package
    - title: Modifikasjoner og reparasjoner
      description: Reparasjon av oppblåsbare kamre, elektronikkoppgraderinger og motorbytte.
      icon: tabler:tool
    - title: Produkter på bestilling
      description: Design for kommersielle, vitenskapelige og militære kunder.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Båt på bestilling

steps2_values:
  title: Våre verdier
  subtitle: Tre prinsipper som former hvert produkt fra dag én.
  items:
    - title: Bygg som om familien din var i båten
      description: Hvert skrog, hver sveis og hver komponent behandles som om de skulle brukes av våre egne familier.
      icon: tabler:heart
    - title: Ingeniørkunst før salg
      description: Hvis spesifikasjonen er feil, endrer vi spesifikasjonen – aldri kunden.
      icon: tabler:settings
    - title: Støtte utover garantien
      description: Tjue år gamle skrog ringer fortsatt etter deler – og vi svarer fortsatt.
      icon: tabler:headset

steps2_milestones:
  title: Milepæler
  subtitle: Kortversjonen av Aquafarers historie.
  isReversed: true
  items:
    - title: Grunnlagt i et kystverksted
      description: To marineingeniører med én CNC-fres og en urokkelig idé.
      icon: tabler:building-factory
    - title: Første 1 000 leverte skrog
      description: Oppnådd i det syvende året, hovedsakelig gjennom jungeltelegrafen og faste kunder.
      icon: tabler:circle-check
    - title: Internasjonalt eksportprogram
      description: Leveranser til 40+ land med lokale servicepartnere på fem kontinenter.
      icon: tabler:world

features2_locations:
  title: Våre lokasjoner
  tagline: Hvor du finner oss
  columns: 3
  items:
    - title: Hovedkontor og verksted
      description: Kystnært industripark, bygning 4 – åpent man-fre for besøk etter avtale.
    - title: EU-servicesenter
      description: Middelhavshavn – modifikasjoner, reparasjoner og garantistøtte for europeiske kunder.
    - title: APAC-partnernettverk
      description: Autoriserte servicepartnere i Australia, Japan, Singapore og Hongkong.
brand_hub_tagline: 'Merkevare'
brand_hub_title: 'Utforsk merkevaren vår'
brand_hub_subtitle: 'Dykk dypere ned i vår marine ingeniørekspertise, globale nærvær og prinsippene som driver oss.'

brand_hub_cards:
  - title: 'Marin ekspertise'
    desc: 'Tiår med materialvitenskap, presisjonsproduksjon og tester i virkelige forhold — fra PVC/Hypalon-produksjon til konstruksjon av dype V-skrog og drop-stitch-teknologi.'
    link: /brand-marine-expertise
    link_label: 'Les mer →'
  - title: 'Globalt nærvær'
    desc: 'Frakt til 50+ land fra anlegget vårt i Qingdao med autoriserte servicepartnere i Europa, Asia-Stillehavsregionen og Amerika.'
    link: /brand-global-presence
    link_label: 'Les mer →'
  - title: 'Hvorfor Aquafarer'
    desc: 'Vertikal integrasjon, dobbel sertifisering (ISO 9001 + BSCI), CE-samsvar og lave MOQ — bygget for merkevarer, distributører og offentlige etater.'
    link: /brand-why-aquafarer
    link_label: 'Les mer →'

production_section:
  tagline: 'Førsteklasses produksjon'
  title: 'Sikrer utsøkt håndverk'
  description: 'Aquafarers produksjonslinje er dedikert til produksjon av oppblåsbare produkter av høy kvalitet — holdbare og med høy ytelse.'
  cards:
    - title: 'Erfarent teknikerteam'
      items:
        - 'Profesjonell kunnskap om PVC, Hypalon og marine materialer'
        - 'Presist håndverk ved kapping, liming og montering av tilbehør'
        - 'Kontinuerlig opplæring i de nyeste produksjonsteknologiene'
    - title: 'Avansert produksjonsutstyr'
      items:
        - 'CNC-kapemaskiner for presis stoffkutting med minimal feil'
        - 'Høy presisjon varm-/kaldliming for lufttette, holdbare sømmer'
        - 'Profesjonelt utstyr for lufttetthets- og strekktesting'
    - title: 'Modent ledelsessystem'
      items:
        - 'Standardiserte produksjonsprosesser med tydelige kvalitetsstandarder'
        - 'Lean produksjonsfilosofi som reduserer svinn og øker effektiviteten'
        - 'Effektiv leverandørkjedeadministrasjon med pålitelige leverandørpartnerskap'
    - title: 'Streng kvalitetskontroll'
      items:
        - 'Sertifisert kvalitetsledelsessystem'
        - 'Flertrinns inspeksjon: råmateriale, under produksjon, endelig kontroll'
        - 'Strenge lufttetthets- og holdbarhetstester før forsendelse'

global_ops_section:
  tagline: 'Global driftsarkitektur'
  title_html: 'Ett merke, <span class="text-white/90">to sentra</span>'
  description_html: 'Siden september 2026 drives Aquafarer av <strong class="text-white">Aquafarer LLC</strong> (New Mexico, USA) — den globale enheten for distribusjon, kommersielt B2B-salg, kontrakter, fakturering og ettersalg. FoU, produksjon og kvalitetskontroll forblir hos <strong class="text-white">Aquafarers produksjonshub i Qingdao</strong>, som sender hver bestilling direkte fra fabrikk, FOB Qingdao. Overgangen endret hvem som signerer kontrakten din — ikke hvem som bygger båten din.'
  stats:
    - value: '2,400+'
      label: 'Skrog levert globalt'
    - value: '50+'
      label: 'Eksportland'
    - value: '10+'
      label: 'År med produksjon'
