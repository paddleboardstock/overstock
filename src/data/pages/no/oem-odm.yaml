process_steps:
  title: 6-trinns OEM/ODM prosess
  subtitle: Fra designbrief til FOB Qingdao — en strømlinjeformet arbeidsflyt
  steps:
    - number: '01'
      title: Designbrief og 3D CAD-modellering
      description: Del dine målspesifikasjoner, referanseprodukter eller konsepter. Vårt ingeniørteam utvikler detaljerte CAD-tegninger og 3D-renderinger for din godkjenning.
      timeline: 3–5 dager
    - number: '02'
      title: Materialvalg og stofftesting
      description: Velg mellom militærgrad PVC (0,9–1,2 mm), Hypalon CSM, eller drop-stitch kjernekvaliteter. Vi utfører tester for strekkstyrke, beleggningsadhesjon, og UV stabilitet.
      timeline: 2–3 dager
    - number: '03'
      title: Rask prototyping og prøveproduksjon
      description: Vi CNC-maskin lager spesialformer og produserer forhåndsproduksjonsprøver med dine merkevarefarger, logo og spesifiserte materialer. Prøver sendes for din godkjenning.
      timeline: 7–14 dager
    - number: '04'
      title: 24–48 timers høytrykks holdetest
      description: Hver prototype gjennomgår grundig trykkholdbarhetstesting ved 1,25 ganger nominelt trykk. Sømpeeltester og dimensjonsverifisering utføres.
      timeline: 1–2 dager
    - number: '05'
      title: CE/ISO Kvalitetskontroll og emballering
      description: 100-punkts kvalitetskontrolliste. Hver enhet inspiseres før detaljhandelklar emballasje. CE samsvarserklæring og BSCI overensstemmelsesrapport inkludert.
      timeline: 2–3 dager
    - number: '06'
      title: FOB Qingdao Frakt og logistikk
      description: Ferdige varer palletert, krympet innpakket og containerlastet ved Qingdao havn. Full eksportdokumentasjon, tollklarering og sanntidssporing.
      timeline: 7–14 dager
