hero:
  tagline: Global tilstedeværelse
  title: 'Aktive i 50+ land<br />på alle kontinenter'
  subtitle: 'Fra europeiske kystpatruljeoperatører til australske vannsportsdistributører og redningsteam i Midtøsten — Paddle Board Overstock-båter er på vannet over hele verden.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstocks globale maritime produksjon og distribusjon
stats:
  title: Global rekkevidde
  stats:
    - title: Land
      amount: '50+'
    - title: Eksportmarkeder
      amount: Europa, Amerika, Asia, Midtøsten, Oseania
    - title: Produksjon
      amount: Qingdao, China
    - title: Lager i USA
      amount: Montclair, CA
features3_markets:
  tagline: Nøkkelmarkeder
  title: 'Regional ekspertise<br />for lokale krav'
  subtitle: 'Vi forstår at ulike markeder har ulike regulatoriske krav, preferanser og bruksområder.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa og Storbritannia
      description: 'CE-sertifiserte produkter som oppfyller EN ISO 6185-standardene. Sterk etterspørsel etter RIB-båter, oppblåsbare båter og SUP-brett på EU-markedene. Britiske distributører setter pris på vår raske levering.'
      icon: tabler:map-pin
    - title: Nord-Amerika
      description: 'Produksjon godkjent av US Coast Guard. USA-lager i Montclair, Kalifornien for rask levering til vestkysten. Økende etterspørsel etter fiskebåter, redningsfartøy og fritids-SUP-er.'
      icon: tabler:map-pin
    - title: Australia og Oseania
      description: 'Sterkt marked for RIB-båter og oppblåsbare tender. Australske distributører verdsetter våre Hypalon-båter for UV-motstand i sterk sol. Rask forsendelse fra vårt anlegg i Asia.'
      icon: tabler:map-pin
    - title: Midtøsten
      description: 'Økende etterspørsel etter patrulje- og redningsbåter. Våre RIB-er med aluminiumsskrog er populære hos kystvakt- og sikkerhetsoperatører. Skreddersydde konfigurasjoner for miljøer med høye temperaturer.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribusjonsnettverk
  title: 'Samarbeid med distributører<br />verden over'
  subtitle: 'Vi samarbeider med etablerte distributører av marin utrustning, OEM-merker og offentlige innkjøpsorgan.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM-partnerskap
      description: 'Private label-produksjon for globale vannsportsmerker. Vi tar hånd om alt fra design til produksjon til dropshipping.'
      icon: tabler:building
    - title: Distributørnettverk
      description: 'Autoriserte distributører i over 20 land holder lager og gir lokal støtte. Henvendelser fra nye distributører er velkomne.'
      icon: tabler:users
    - title: Myndigheter og institusjoner
      description: 'Direkte levering til kystvakter, søk- og redningsorganisasjoner og militære innkjøpsprogrammer. Samsvar med institusjonelle innkjøpskrav.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Global logistikk og støtte'
  subtitle: 'Fra fabrikk til destinasjon — vi styrer hele forsyningskjeden.'
  items:
    - title: Fraktalternativer
      description: 'Sjøfrakt (FOB Qingdao), luftfrakt for hasteordrer og ekspresskurir for prøver og reservedeler.'
      icon: tabler:truck-delivery
    - title: Lager i USA
      description: 'Lager i Montclair, Kalifornien for rask levering i hele Nord-Amerika. Vestkysten: 2-3 dager, midten: 3-4 dager, østkysten: 4-5 dager.'
      icon: tabler:building-warehouse
    - title: Reservedeler
      description: 'Ekte Paddle Board Overstock-reservedeler og forbruksvarer på lager hele året. Vanlige deler sendes innen 24 timer.'
      icon: tabler:package
    - title: Teknisk støtte
      description: 'Direkte linje til ingeniørteamet vårt for tekniske spørsmål, reparasjonsråd og støtte ved ombygging. Vi støtter båter vi bygde for 20 år siden.'
      icon: tabler:headset
cta:
  title: 'Vil du bli distributør?'
  subtitle: 'Vi utvider aktivt distribusjonsnettverket vårt. Kontakt eksportteamet vårt for å diskutere partnerskapsmuligheter.'
  actions:
    - variant: primary
      text: Partnerskaphenvendelse
      href: /contact
    - text: Se produktsortimentet vårt
      href: /products
