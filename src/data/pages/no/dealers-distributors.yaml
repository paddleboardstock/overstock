hero:
  tagline: Forhandlerprogram
  title: Bli en Aquafarer<br />distributør
  subtitle: Partner med en CE-sertifisert RIB og oppblåsbar vannscooterprodusent som betjener 50+ land. Territoriumbeskyttelse, markedsføringsstøtte og konkurransedyktige priser for etablerte marinedistributører.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer-forhandler- og distributørprogram
direct_answer: Aquafarer tilbyr forhandler- og distribusjonspartnerskap med territoriumbeskyttelse, konkurransedyktige engrospriser, markedsføringsstøttesett og full samsvarsdokumentasjon (CE, ISO 9001, BSCI). MOQ starter på 10-20 enheter per ordre med dedikert kontoadministrasjon.
