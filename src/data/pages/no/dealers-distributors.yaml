content_benefits:
  tagline: Partnerskapsfordeler
  title: Hvorfor distributører<br />Velg Aquafarer
  subtitle: Et partnerskap designet for marine distributører som trenger pålitelig forsyning, konkurransedyktige marginer og profesjonell støtte.
  items:
    - title: Territoriumbeskyttelse
      description: Eksklusive eller semi-eksklusive territoriumrettigheter for kvalifiserte distributører. Markedskartlegging og kanalkonflikthåndtering for å beskytte investeringen din i å bygge merkevaren Aquafarer i din region.
      icon: tabler:map-pin
    - title: Konkurransedyktige engrospriser
      description: Lagdelt prissetting basert på årlige volumforpliktelser. Marginbeskyttende prisstruktur med forhåndsprisgarantier og transparente kostnadsfordelinger (FOB Qingdao-basis).
      icon: tabler:currency-dollar
    - title: Markedsføringsstøttesett
      description: Profesjonell produktfotografering, spesifikasjonsark, dokumentasjonsmaler for samsvar, innhold på sosiale medier og markedsføringsmateriell med sammerke. Oppdateres årlig med nye produktlanseringer.
      icon: tabler:photo
    - title: Teknisk opplæring
      description: Produktopplæring for salgsteamet ditt (virtuelt eller på stedet), vedlikeholds- og reparasjonsopplæring for serviceteknikerne dine, og kundevendte FAQ og feilsøkingsveiledninger.
      icon: tabler:school
    - title: Reservedeler og ettersalg
      description: Dedikert reservedelsforsyning med prioritert frakt. Erstatningsrørseksjoner, ventiler, finner og reparasjonssett tilgjengelig for rask bestilling. Støtte for behandling av garantikrav.
      icon: tabler:tool
    - title: Samsvarsdokumentasjon
      description: 'Full overholdelsesdokumentasjonspakke for ditt marked: CE DoC, byggeplatedata, brukermanualer og støtte for forskriftsregistrering. Eliminerer overholdelsesbyrden.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Hva vi ser etter
  title: Distributør<br />Krav
  subtitle: Vi søker partnere som profesjonelt kan representere og støtte Aquafarer-produkter i deres territorium.
  items:
    - title: Territorium og markedskunnskap
      description: Etablert tilstedeværelse i markedet for marin, vannsport eller friluftsliv. Forståelse av lokale forskrifter, forbrukerpreferanser og distribusjonskanaler for vannscooterprodukter.
      icon: tabler:target
    - title: Bransjeerfaring
      description: Minimum 2 års erfaring med distribusjon av marine-, utendørs- eller sportsutstyr. Bevist merittliste med internasjonale merkevarer og B2B-grossistvirksomhet.
      icon: tabler:briefcase
    - title: Showroom eller lager
      description: Fysisk anlegg for produktvisning, lagerbeholdning og kundeservice. Evne til å vedlikeholde demoenheter og reservedelslager for ditt territorium.
      icon: tabler:building-store
    - title: Forpliktelse til merkevarestandarder
      description: Vilje til å opprettholde Aquafarer-merkepresentasjonsstandarder, gi kundestøtte i henhold til våre serviceprotokoller og delta i årlige produktopplæringsoppdateringer.
      icon: tabler:star
content_process:
  tagline: Søknadsprosess
  title: 4-trinns forhandler<br />Søknadsprosess
  subtitle: Fra første forespørsel til første forsendelse - en enkel ombordstigningsprosess.
  steps:
    - number: '01'
      title: Innledende forespørsel og kvalifisering
      description: Send inn din distributørsøknad med firmadetaljer, interesseområde, gjeldende produktlinjer og årlige volumanslag. Vi vurderer innen 5 virkedager.
      timeline: 5 dager
    - number: '02'
      title: Bedriftsanmeldelse og vilkår
      description: Virtuelt møte for å diskutere territoriumstrategi, prisnivåer og partnerskapsvilkår. Gjennomgå krav til samsvarsdokumentasjon for ditt marked. NDA-signering om nødvendig.
      timeline: 1-2 uker
    - number: '03'
      title: Prøvebestilling og evaluering
      description: Plasser en innledende prøvebestilling (2-5 enheter) til distributørpriser for markedsevaluering og teamtrening. Full samsvarsdokumentasjon og demoforberedelse inkludert.
      timeline: 30-45 dager
    - number: '04'
      title: Partnerskapslansering og støtte
      description: Første containerordre med territoriumbeskyttelse aktivert. Markedsføringssett levert, salgsteam trent og dedikert kontoansvarlig tildelt. Løpende kvartalsvise forretningsgjennomganger.
      timeline: Pågående
content_application_docs:
  tagline: Søknadsdokumenter
  title: Dokumenter som kreves<br />for forhandlersøknad
  subtitle: For å søke om et Aquafarer-forhandlerskap, vennligst forbered følgende dokumenter og informasjon til gjennomgangsteamet vårt.
  items:
    - title: Registreringsbevis for selskap
      description: Gyldig selskapsregistreringsdokument som viser juridisk navn, registrert adresse og virksomhetsomfang som dekker distribusjon av marin-, sport- eller friluftsutstyr.
      icon: tabler:file-text
    - title: Dekningsplan for territorium
      description: Geografisk interessert område, eksisterende detaljhandels- eller distribusjonsnettverk, mål kundesegmenter og foreslått årlig volum per produktkategori (RIB, SUP, kajakk).
      icon: tabler:map
    - title: Showroom- eller lagerkapasitet
      description: Fysisk lokal for produktvisning, lagring av beholdning og kundeservice. Bilder eller plantegninger som viser demoområde og lagringskapasitet for reservedeler.
      icon: tabler:building
    - title: Erklæring om finansiell kapasitet
      description: 'Bankreferanse eller finansrapport som bekrefter evnen til å legge inn en initial containerordre og opprettholde beholdning. Minimum initial ordre: én 20-fots container (10–20 enheter, blandede modeller).'
      icon: tabler:coin
    - title: Kapasitet for ettersalgsstøtte
      description: Serviceteknikere som er opplært eller kan opplæres i vedlikehold og reparasjon av gummibåter. Evne til å behandle garantikrav og forpliktelse til reservedelsbeholdning.
      icon: tabler:tool
    - title: Referanser fra tidligere merkevarer
      description: Liste over marin- eller sportsmerker som nå eller tidligere distribueres. Kontaktreferanser tilgjengelige etter gjensidig avtale. Oppstartsbedrifter uten tidligere distribusjonserfaring kan kvalifisere med et sterkere finansielt engasjement.
      icon: tabler:users
faq:
  title: Forhandlerprogram — Ofte stilte spørsmål
  questions:
    - q: Hva er minimumsordreantallet for distributører?
      a: Distributør MOQ starter på 10-20 enheter per bestilling, med fleksibilitet for blandede modeller (RIB, oppblåsbar, SUP). Innledende prøvebestillinger på 2-5 enheter er tilgjengelig til distributørpriser for markedsevaluering.
    - q: Tilbyr du eksklusive territoriumrettigheter?
      a: Eksklusive territorierettigheter er tilgjengelige for kvalifiserte distributører som oppfyller årlige volumforpliktelser og opprettholder merkevarestandarder. Semi-eksklusive og ikke-eksklusive ordninger er også tilgjengelige for fremvoksende markeder.
    - q: Hvilken markedsføringsstøtte gir du?
      a: Vi tilbyr et omfattende markedsføringssett som inkluderer profesjonell produktfotografering, spesifikasjonsark, dokumentasjonsmaler for samsvar, innholdsbibliotek for sosiale medier og co-branded materialer. Oppdateres årlig med nye produktlanseringer.
    - q: Hvordan håndteres garantikrav?
      a: 'Distributører fungerer som det første kontaktpunktet for garantikrav. Vi tilbyr klare garantikriterier, fotodokumentasjonsprotokoller og rask erstatning eller kredittbehandling. Garantibetingelser: 5-års begrenset på stoff/sømmer/skrog av båtrør; 2-år på SUP og tilbehør.'
    - q: Kan jeg privatmerke Aquafarer-produkter under mitt eget merke?
      a: Ja, gjennom vårt OEM/ODM-program. Alternativer for private etiketter inkluderer tilpasset rørgrafikk, konsollmerke, detaljemballasje og samsvarsdokumentasjon under merkenavnet ditt. Se vår OEM/ODM-tjenesteside for detaljer.
    - q: Hvilken samsvarsdokumentasjon er inkludert for distributører?
      a: Hver forsendelse inkluderer modellspesifikk CE DoC, byggeplatedata, brukermanualer og forsendelsesdokumentasjon. Vi tilbyr også støtte for forskriftsregistrering for ditt territorium og bistår med eventuelle lokale krav.
