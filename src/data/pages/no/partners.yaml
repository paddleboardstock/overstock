hero:
  tagline: Partnerskap og distribusjon
  title: 'Bli en Aquafarer-partner<br />— globalt distribusjonsnettverk'
  subtitle: "Bli med i Aquafarers globale partnernettverk. Vi samarbeider med marine distributører, båtforhandlere, utstyrsforretninger og merkevarepartnere i over 50 land."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarers globale partner- og distributørnettverk
content_programs:
  tagline: Partnerprogram
  title: 'Partnerprogrammer<br />bygget for vekst'
  subtitle: 'Enten du er distributør, forhandler eller merkevarepartner, tilbyr Aquafarer programmer utformet for å støtte din virksomhet.'
  columns: 3
  items:
    - title: Distributørprogram
      description: 'Eksklusiv territoriell distribusjon med volumpriser, markedsføringsstøtte og direkte tilgang til fabrikken. Minimumsforpliktelse kreves basert på territoriets størrelse.'
      icon: tabler:world
    - title: Forhandlerprogram
      description: 'Direkte forhandlerpriser, produkttrening, markedsføringsmateriell og garantistøtte for fysiske butikker og nettbutikker.'
      icon: tabler:building-store
    - title: OEM/ODM-partnerskap
      description: 'Fullverdig OEM- og ODM-produksjon med skreddersydd merkevare, emballasje og produktspesifikasjoner. Fra konsept til container.'
      icon: tabler:certificate
    - title: Merkevarepartnerskap
      description: 'Programmer for sammerkevarer, private merkevarer og eksklusive modeller for etablerte merkevarer innen marine- og friluftssektoren.'
      icon: tabler:stars
    - title: 'Offentlige sektor og institusjoner'
      description: 'Foretrukne leverandørprogrammer for offentlige etater, kystvakter, militæret og humanitære organisasjoner. Anbudsklar dokumentasjon.'
      icon: tabler:building-community
    - title: 'Partner for feriesteder og utleie'
      description: 'Flåtepriser, konsistent kvalitet og skreddersydd merkevare for feriesteder, dykkentre og utleievirksomheter over hele verden.'
      icon: tabler:sun
content_benefits:
  tagline: Hvorfor inngå partnerskap med oss
  title: 'Hvorfor partnere velger Aquafarer'
  subtitle: 'Våre partnere drar nytte av reell produksjonskapasitet, konsistent kvalitet og rask støtte.'
  list:
    - 'Direkte tilgang til fabrikken: Arbeid direkte med produksjonsteamet vårt — uten mellomledd. Få raskere svar, bedre priser og full innsyn i produksjonen.'
    - 'Klar for tilpasning: Profilér produktene dine med egne farger, logoer, emballasje og spesifikasjoner. Minste bestillingsantall tilpasset ditt marked.'
    - 'Garantert kvalitet: ISO 9001-sertifisert produksjon med CE-, UKCA- og BSCI-samsvar. Hvert produkt testes før forsendelse.'
    - 'Global logistikk: Forsendelse fra Qingdao, Kina med FOB-, CIF- og DDP-alternativer. Lager i USA i Montclair, California for distribusjon i Nord-Amerika.'
    - 'Markedsføringsstøtte: Produktkataloger, fotografering, teknisk dokumentasjon og digitale ressurser som støtter salget ditt.'
    - 'Trening og støtte: Produkttrening for salgsteamet ditt, teknisk støtte for kundene dine og koordinering av garantitjenester.'
content_process:
  tagline: Slik blir du partner
  title: 'Enkel partnerskapsprosess'
  subtitle: 'Partnerskapsprosessen vår er grei — utformet slik at du raskt kan begynne å selge Aquafarer-produkter.'
  items:
    - title: 'Trinn 1: Send inn søknaden'
      description: 'Fyll ut partnersøknadsskjemaet vårt med bedriftsprofilen din, målmarkedet og produktinteressene dine.'
    - title: 'Trinn 2: Kvalifiseringsgjennomgang'
      description: 'Partnerskapsteamet vårt gjennomgår søknaden din og kontakter deg innen 3 virkedager for å diskutere muligheter.'
    - title: 'Trinn 3: Avtale og oppsett'
      description: 'Signer en partnerskapsavtale, opprett kontoen din og motta partnerpriser, markedsføringsmateriell og produktprøver.'
    - title: 'Trinn 4: Trening og lansering'
      description: 'Produkttrening, salgsstøtte og markedsføringsmateriell leveres. Du er klar til å begynne å selge.'
cta:
  title: 'Klar til å bli en Aquafarer-partner?'
  subtitle: 'Søk om partnerskap, og teamet vårt svarer innen 3 virkedager.'
  actions:
    - variant: primary
      text: Søk om partnerskap
      href: /contact
    - text: Se våre produkter
      href: /products
