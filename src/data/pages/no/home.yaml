features:
  id: features
  tagline: Hvorfor Kjøpe Fra Paddle Board Overstock
  title: Ekte Fabrikk,<br />Ekte Besparelser
  subtitle: Fabrikklager og utsalgsvarer SUP pakker — sertifisert kvalitet uten detaljistpåslag.
  columns: 2
  items:
    - title: Opptil 60% Avslag på ordinær pris
      description: Vi selger fabrikkoverskudd og utsalgsvarer direkte — ingen mellomledd, ingen detaljistpåslag. De samme brettene som selges til full pris andre steder, til utsalgspris her.
      icon: tabler:rocket
    - title: Komplette Pakker
      description: 'Hvert SUP leveres som en komplett pakke: brett, reiseveske, håndpumpe, justerbar padleåre, avtakbar finne, coil-leash og reparasjonssett.'
      icon: tabler:clipboard-list
    - title: Sertifisert kvalitet
      description: 13 CE-sertifiserte SUP modeller i henhold til gjeldende EU-direktiver. Hvert brett testes 100% under trykk til 1,25x anbefalt PSI før det sendes. 99,3% feilfri rate i henhold til AQL 2.5.
      icon: tabler:certificate
    - title: Ingen MOQ — Bestill Ett Brett
      description: Overskuddsopprydding betyr at enkeltbestillinger er velkomne. Legg et brett i handlekurven, betal, ferdig. Ingen minimumsbestilling, ingen tilbudsprosess.
      icon: tabler:adjustments
    - title: Rask Frakt Over Hele Verden
      description: Lagervarer sendes fra Weihai innen 2-3 arbeidsdager. Sporbar levering til 50+ land i EU, Nord-Amerika, Asia-Stillehavet og videre.
      icon: tabler:truck-delivery
    - title: 2-års SUP garanti
      description: Hvert SUP brett og tilbehør har 2 års dekning — drop-stitch sømmer, oppblåsingsventiler og tilbehør inkludert. Krav behandles på dager, ikke uker.
      icon: tabler:lifebuoy
