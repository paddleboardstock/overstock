content_workshop:
  isReversed: true
  tagline: Fabrikkstyrke
  title: Hvorfor Våre Utsalgspriser<br />Er Ekte
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Ekte Fabrikk, Ekte Sparing — Hvert brett sendes fra vår Weihai-fabrikk</h3>
  items:
    - title: Samme Produksjonslinjer som Store Merker
      description: Vår 12 000 m² store Weihai-fabrikk bygger brett for internasjonale merker og våre egne overflødige partier på de samme linjene med de samme materialene.
    - title: 100% Trykkstestet
      description: Hvert brett blir pressurert til 1,25x angitt PSI og holdt før det sendes. 99,3 % feilfrie per AQL 2,5 / ISO 2859.
    - title: Ingen Mellomledd
      description: Brett sendes direkte fra fabrikk til din dør. Ingen distributørpåslag, ingen detaljhandelpåslag — slik holder utsalgsprisene seg opptil 60 % under detaljhandelspris.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12 000 m² Weihai-fabrikk med oppblåsbare SUP produksjonslinjer
content_compliance:
  tagline: Samsvar & Kvalitetsbevis
  title: Sertifisert Kvalitet,<br />Dokumentert
  subtitle: Hver samsvarskrav støttes av sertifikater og modellspesifikk dokumentasjon tilgjengelig for din verifikasjon.
  items:
    - title: ISO 9001:2015
      description: Kvalitetsstyringssystem sertifisert av TÜV Rheinland/SGS. Årlige overvåkningsrevisjoner. Dokumenterte QC-prosesser fra innkommende materiale til utsendelsesfrigivelse.
      icon: tabler:certificate
    - title: CE Sertifisert
      description: 13 CE-sertifiserte SUP modeller i henhold til gjeldende EU-direktiver, hver med modellspesifikk samsvarserklæring og produsentplateinformasjon.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Alle PVC og limmaterialer overholder EU REACH regulering. UKCA merking tilgjengelig for det britiske markedet. Materialdatasikkerhetsblad fås på forespørsel.
      icon: tabler:shield-check
    - title: 2-års SUP garanti
      description: Hvert SUP brett og tilbehør dekkes i 2 år — drop-stitch sømmer, oppblåsingsventiler og tilbehør inkludert. Krav håndteres raskt.
      icon: tabler:lifebuoy
