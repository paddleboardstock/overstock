faqs:
  title: Vanlige spørsmål om B2B-innkjøp
  subtitle: 'Vanlige spørsmål fra merkevarer, distributører og kommersielle operatører om OEM/ODM-produksjon med Paddle Board Overstock.'
  columns: 2
  items:
    - title: Er dere produsent eller handelsselskap?
      description: 'Vi er en vertikalt integrert fabrikk med full kontroll over kvalitet, materialer og leveringstider. Firmalisens og produksjonsomfang kan verifiseres under en fabrikkrevisjon.'
      icon: tabler:building-factory
      category: all
    - title: Hvordan foregår OEM/ODM-prosessen deres?
      description: 'Fra kravgjennomgang (48 timer) til tilbud, prototype (7–14 dager) og produksjon (30–45 dager FOB Qingdao). Full ingeniørstøtte, samsvarsdokumentasjon og sporbarhet per skrog hele veien.'
      icon: tabler:route
      category: all
    - title: Hvilke MOQ-krav har dere?
      description: 'RIB-båter: 2–5 enheter per modell (eksisterende form), 200+ for egne former. SUP-brett: 5–10 enheter per SKU. Containerordrer med blandede modeller er mulig. Prøveordrer fra 2–5 enheter for evaluering.'
      icon: tabler:sort-ascending
      category: all
    - title: Hvilke tilpasningsmuligheter finnes?
      description: 'Skrogdesign, rørmateriale (PVC eller Hypalon/CSM), rørdiameter, konsollplassering, seter, styring, drivstoffsystem, dekklayout, merkevarefarger, logografikk, EVA-mattedesign, detaljhandelsemballasje og branding av bruksanvisningen.'
      icon: tabler:adjustments
      category: all
    - title: Hvilke samsvarsdokumenter kan dere levere for mitt marked?
      description: 'CE-samsvarserklæring i henhold til 2013/53/EU, UKCA-merking, ISO 9001-sertifikat (SGS), BSCI-revisjonsrapport, REACH-samsvar, materialprøvingsrapporter, trykktestlogger og modellspesifikke byggerplatedata. Markedsspesifikk dokumentasjon på forespørsel.'
      icon: tabler:file-certificate
      category: all
    - title: Hvor lang er leveringstiden for prøver og produksjon?
      description: 'Forserieprøver: 7–14 arbeidsdager. Standardproduksjon: 30–45 dager FOB Qingdao. Hurtigproduksjon mot tillegg er mulig. I høysesongen (mars–juni) kan leveringstidene forlenges.'
      icon: tabler:clock
      category: all
    - title: Kan jeg arrangere en fabrikkrevisjon eller en direkte videovisning?
      description: 'Ja. Revisjoner på stedet i anlegget vårt i Qingdao er velkomne med 3–5 dagers varsel. Direkte videovisninger via WhatsApp/Zoom er tilgjengelige umiddelbart. Inspeksjoner fra tredjepart (SGS, BV, TÜV) imøtekommes.'
      icon: tabler:video
      category: all
    - title: Hvilke kvalitetsinspeksjoner gjennomføres før forsendelse?
      description: 'Trykkholdetest ved 1,25× nominelt trykk (24–48 timer), skrelletest av sømmer, 100-punkts sjekkliste for sluttkontroll, dimensjonell verifisering, visuell inspeksjon, verifisering av samsvarsdokumentasjon og kontroll av emballasjens integritet. Alt etter ISO 9001-prosedyrer.'
      icon: tabler:clipboard-check
      category: all

