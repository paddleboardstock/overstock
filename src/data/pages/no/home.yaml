faqs:
  title: SUP Bestilling og produkt-FAQ
  subtitle: Vanlige spørsmål om våre kampanje-SUP-kort, bestilling, betaling, frakt og garanti.
  columns: 2
  items:
    - title: Er SUP vanskelig å lære?
      description: Ikke i det hele tatt. De fleste nybegynnere står opp og padler allerede i løpet av sin første økt. Våre allsidige SUP-brett har ekstra brede, stabile plattformer som er spesielt designet for førstegangspadlere. Start på stille vann, og du vil kunne cruise på få minutter.
      icon: tabler:swimming
      category: sup
    - title: Hva er vektgrensen?
      description: Vår allsidige SUPs støtter opptil 220 lbs, og touring- og yoga-plattformene støtter opptil 250 lbs. Hver produktside oppgir den nøyaktige vektkapasiteten for rytteren, slik at du kan tilpasse brettet til dine behov.
      icon: tabler:adjustments
      category: sup
    - title: Kan jeg reise med en oppblåsbar SUP?
      description: Absolutt. Hver Paddle Board Overstock brett pakkes i en ryggsekkstørrelse bæreveske. Med bare 18-22 lbs er det lett å ta med til stranden, innsjøen eller gjennom flyplass-terminaler. Sjekk flyselskapets bagasjepolicy før reise.
      icon: tabler:truck-delivery
      category: sup
    - title: Hva kommer i boksen?
      description: Hver Paddle Board Overstock SUP inkluderer brettet, en re ryggsekk, håndpumpe, justerbar åre, avtakbar finne, spirallese og reparasjonssett.
      icon: tabler:clipboard-list
      category: sup
    - title: Hvorfor er prisene deres lavere enn detaljhandelen?
      description: Vi selger fabrikkoverskudd og oppryddingspartier direkte fra vårt eget produksjonsanlegg i Weihai, Kina — ingen mellomledd, ingen detaljhandelsmarginal. Det betyr komplette SUP-pakker med opptil 60 % rabatt fra vanlige utsalgspriser, med samme CE-sertifiserte kvalitet.
      icon: tabler:certificate
      category: orders
    - title: Hvordan legger jeg inn en bestilling og betaler?
      description: Legg til din SUP pakke i handlekurven og betal sikkert med Stripe eller PayPal. Vi aksepterer alle større kreditt- og debetkort. Hver bestilling bekreftes via e-post med en fullstendig faktura.
      icon: tabler:file-text
      category: orders
    - title: Sender dere over hele verden?
      description: Ja. Vi sender til 50+ land i EU, Nord-Amerika, Asia-Stillehavet, Midtøsten og Afrika. Bestillinger som er på lager sendes vanligvis innen 2-3 virkedager, med sporingsinformasjon for hver pakke.
      icon: tabler:route
      category: orders
    - title: Hvilken garanti inkluderer SUP-kort?
      description: 'Hver SUP brett og tilbehør omfattes av en 2-års garanti — inkludert selve brettet, drop-stitch sømmer og oppblåsingsventiler. Reklamasjoner behandles på dager, ikke uker: registrer dem på nettet, så reparerer eller erstatter vi.'
      icon: tabler:lifebuoy
      category: orders
