content_customer_types:
  tagline: Hvem vi betjener
  title: 'Bygget for B2B-kjøpere<br />— ikke for forbrukere'
  subtitle: 'Paddle Board Overstock produserer for fire kundetyper. Hver av dem har ulike prioriteringer — og vi imøtekommer dem alle.'
  items:
    - title: Merkevareeiere / Private Label
      description: 'Skreddersydd produktdesign, private label-grafikk, samsvarsdokumentasjon under din merkevare og dedikert ingeniørstøtte fra konsept til container.'
      icon: tabler:palette
      cta: Be om et OEM/ODM-tilbud
      cta_href: /request-quotation
    - title: Distributører / Engroshandel
      description: 'Områdebeskyttelse, konkurransedyktige engrospriser, markedsføringspakker, produkttrening og fullstendig samsvarsdokumentasjon for ditt marked.'
      icon: tabler:world
      cta: Søk om forhandlerskap
      cta_href: /dealers-distributors
    - title: Resorter / Utleieoperatører
      description: 'Holdbarhet i kommersiell klasse, rådgivning om flåtestørrelse, containerordrer med blandede modeller, reservedelsstrategi og utstyrspakker med resort-branding.'
      icon: tabler:beach
      cta: Be om en kommersiell pakke
      cta_href: /solutions/resorts
    - title: Redning / Offentlig sektor / Profesjonelt
      description: 'Hypalon/CSM-konstruksjon, SOLAS-samsvarsalternativer, prosjektspesifikk sertifisering, støtte ved anbudsdokumentasjon og ingeniørarbeid under NDA.'
      icon: tabler:shield
      cta: Diskuter et prosjekt
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: OEM/ODM-kapasitet
  title: 'Hva du får<br />med Paddle Board Overstock'
  subtitle: 'Direkte tilgang til fabrikken med full støtte innen ingeniørfag, kvalitet og samsvar — ikke et handelsselskap.'
  columns: 2
  items:
    - title: OEM/ODM-tilpasning
      description: 'Skreddersydd skrogdesign, rørmateriale (PVC eller Hypalon/CSM), konsollplassering, seter, branding, farger og emballasje. Fra mindre justeringer til fullt skreddersydd konstruksjon.'
      icon: tabler:adjustments
    - title: Lav MOQ, raske prøver
      description: 'RIB: 2–5 enheter (eksisterende form). SUP: 5–10 enheter per SKU. Egne former: 200+ enheter. Forserieprøver med din branding på 7–14 dager.'
      icon: tabler:rocket
    - title: Produksjonsklar kvalitet
      description: 'Hver enhet trykktestes ved 1,25× nominell PSI i 24–48 timer. 99,3 % feilfrie per AQL 2,5 / ISO 2859. 100-punkts kvalitetssjekkliste per skrog.'
      icon: tabler:certificate
    - title: Fullstendig samsvarsdokumentasjon
      description: 'CE i henhold til 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI-sosialrevisjon, REACH-samsvar, UKCA-merking. Modellspesifikk samsvarserklæring og byggerplatedata inkludert.'
      icon: tabler:file-certificate
    - title: 30–45 dagers leveringstid
      description: 'Standardproduksjon 30–45 dager FOB Qingdao. Prototyper på 7–14 dager. Hurtigproduksjon er mulig. Containerlasteplaner og ISPM-15-emballasje inkludert.'
      icon: tabler:truck-delivery
    - title: Ettersalg & reservedeler
      description: '5 års garanti på båter/kajakker/RIB, 2 års garanti på SUP/tilbehør. Reservedelsforsyning med prioritert frakt. Støtte ved garantibehandling.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Produktkategorier
  title: '5 kategorier,<br />64 CE-sertifiserte modeller'
  subtitle: 'Fra 2,4 m RIB-tendere til 15 fots SUP-brett — alle produsert i vår ISO 9001-fabrikk i Qingdao.'
  items:
    - title: RIB-båter
      description: '2,4 m til 7,0 m med aluminiums- eller GFK-skrog. PVC- eller Hypalon/CSM-rør. CE i henhold til 2013/53/EU. Konfigurasjoner for patrulje, dykking, redning og kommersielt bruk.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Oppblåsbare båter
      description: '2,0 m til 5,0 m med aluminiumsgulv, kryssfinergulv eller luftdekk. Modeller for fiske, fritid og tender.'
      icon: tabler:sailboat
      link: /products
    - title: SUP-brett
      description: '9 til 15 fot i 4-tommers og 6-tommers Drop-Stitch. Allround-, touring-, yoga- og fiskemodeller. Finnes også i kommersiell klasse.'
      icon: tabler:swimming
      link: /products
    - title: Kajakker
      description: 'Oppblåsbare kajakker for 1 til 3 personer. Fritids- og touringmodeller med Drop-Stitch-gulv.'
      icon: tabler:kayak
      link: /products
    - title: Sikkerhetsutstyr
      description: 'CE-sertifiserte flytevester, kastetau, reparasjonssett, pumper og navigasjonslys. Flytevester godkjent av USCG type III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Fabrikkstyrke
  title: 'Revisjonsklar produksjon<br />i Qingdao'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12 000 m² ISO 9001-fabrikk — en ekte produsent, ikke et handelsselskap</h3>
  items:
    - title: 6 dedikerte produksjonslinjer
      description: 'Separate linjer for RIB, oppblåsbare båter, SUP, kajakker, sikkerhetsutstyr og OEM/ODM. Hver med egne QC-kontrollpunkter og egen produksjonsplanlegging.'
    - title: 100 % trykktestet
      description: 'Hvert oppblåsbare kammer trykksettes til 1,25× nominell PSI og holdes i 24–48 timer. Testresultatene knyttes til skrogets serienummer (HIN).'
    - title: Sporbarhet per skrog
      description: 'Produksjonsregister på HIN-nivå med 21+ datafelt per skrog: materialeparti, sveiser-ID, trykktestresultat, sluttkonfigurasjon og leveringsdestinasjon.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstocks 12 000 m² store ISO 9001-produksjonsanlegg i Qingdao med RIB-produksjonslinjer

content_compliance:
  tagline: Samsvar & kvalitetsbevis
  title: 'Dokumenterte bevis,<br />ikke bare påstander'
  subtitle: 'Hver samsvarspåstand er dekket av modellspesifikk dokumentasjon tilgjengelig for din verifisering.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Kvalitetsstyringssystem sertifisert av TÜV Rheinland/SGS. Årlige overvåkingsrevisjoner. Dokumenterte QC-prosesser fra mottak av materiale til utlevering.'
      icon: tabler:certificate
    - title: CE i henhold til 2013/53/EU (RCD)
      description: '64 modeller med modellspesifikke samsvarserklæringer. Vurdering av samsvar i henhold til gjeldende moduler. HIN-registrering og byggerplatedata for hvert skrog.'
      icon: tabler:file-certificate
    - title: BSCI-sosialrevisjon
      description: 'Årlig BSCI-revisjon utført av SGS. Verifiserte etiske arbeidsforhold, arbeidssikkerhet og miljøstyring i hele anlegget.'
      icon: tabler:users
    - title: REACH & UKCA
      description: 'Alle PVC- og limmaterialer oppfyller EU-REACH-forordningen. UKCA-merking tilgjengelig for det britiske markedet. Sikkerhetsdatablad på forespørsel.'
      icon: tabler:shield-check

