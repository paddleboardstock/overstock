  items:
    - title: Trinn 1:<span class="font-medium">Velg Brettet Ditt</span>
      description: Velg mellom allsidige, touring-, yoga- og barne-modeller. Våre kjøpsguider hjelper deg med å matche brettstørrelse og stil til padlingen din.
      icon: tabler:clipboard-list
    - title: Trinn 2:<span class="font-medium">Sikker utsjekking</span>
      description: Betal sikkert med Stripe eller PayPal. Alle store kreditt- og debetkort aksepteres. Ingen konto nødvendig — ordrebekreftelse lander i innboksen din.
      icon: tabler:file-text
    - title: Trinn 3:<span class="font-medium">Kvalitetskontroll</span>
      description: Hvert brett er 100 % trykktestet ved 1,25x nominell PSI og sjekket mot en full kvalitetskontrolliste før det pakkes.
      icon: tabler:settings
    - title: Trinn 4:<span class="font-medium">Rask utsendelse</span>
      description: Lagerførte bestillinger sendes fra vår fabrikk i Weihai innen 2–3 arbeidsdager. Hurtighåndtering er tilgjengelig for hastende bestillinger.
      icon: tabler:building-factory
    - title: Trinn 5:<span class="font-medium">Sporbar levering</span>
      description: Sporbar frakt til 50+ land verden over. Din 2-års garanti og responsive kundeservice starter den dagen brettet ditt ankommer.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP bestillingsprosess fra sikker utsjekking til sporbar internasjonal levering
