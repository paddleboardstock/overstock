content_challenge:
  tagline: Utfordringen
  title: Fiskebåter trenger<br />stabilitet, rekkevidde og holdbarhet
  subtitle: Enten du driver kommersielle fiskefartøy, administrerer en samarbeidsflåte eller driver fiskecharter – båten din må yte pålitelig hver dag.
  paragraphs:
    - Fiskebåter trenger stabile plattformer for å arbeide med liner, håndtere fangst og bevege seg trygt omkring på dekk. Gummibåter og RIB-er tilbyr iboende stabilitet gjennom tubedesignen — en betydelig fordel fremfor stive skrog av tilsvarende lengde.
    - Drivstoffeffektivitet er viktig for fiskeoperasjoner der driftskostnadene direkte påvirker lønnsomheten. RIB-er og oppblåsbare båter er lettere enn tilsvarende stive båter, krever mindre kraft og brenner mindre drivstoff – kritisk for kommersielle operatører som kjører båter daglig og kooperativer som administrerer flåtebudsjetter.
    - Holdbarhet i marine miljøer er avgjørende. Saltvann, UV-eksponering og konstant bruk krever materialer som tåler tøffe forhold uten nedbrytning. For kommersielle og kooperative operatører påvirker pålitelighet direkte inntekten - en ødelagt båt betyr tapte fiskedager.
    - Paddle Board Overstock fiskekonfigurasjoner inkluderer stangholdere, fishfinders, agnbrønner, livewells og lasthåndteringsløsninger designet for seriøse fiskeapplikasjoner på tvers av kommersielle, samarbeidende og rekreasjonsoperasjoner.
content_solution:
  tagline: Vår løsning
  title: Fiskeklare konfigurasjoner
  subtitle: Hver fiskebåt fra Paddle Board Overstock kan konfigureres for din spesifikke fiskeanvendelse.
  list:
    - Montering av stangholder — fabrikkmontert eller klar for ettermontering
    - Monteringsplate for ekkolodd/GPS ved konsollposisjonen
    - Alternativer for agnbekk eller levende-bekk for charter- og kommersielle operatører
    - Kjøleboks/oppsamlingskonfigurasjoner for håndtering av fangst
    - Deep-V-skrog for offshore-evne — stabilt i ro, mykt i fart
    - Alternativer med PVC- eller Hypalon-tuber — Hypalon for lengre UV-eksponering
    - Utenbordsmotorområde fra 15 HK til 115 HK avhengig av modell og anvendelse
content_segments:
  tagline: Fiskeprofiler
  title: Oppblåsbare fiskebåtløsninger<br />Etter operatørtype
  subtitle: Fra kystsportsfiske til kommersiell linefiske – ulike fiskeoperasjoner krever ulike skrogkonfigurasjoner, kraftområder og oppsett på dekk. Vi skreddersyr hver båt for å matche fisket, vannet og arbeidsstilen.
  items:
    - title: Kommersielle fiskeselskaper
      subtitle: Flåtearbeidsbåter for daglige fiskeoperasjoner, garnhåndtering, fangsttransport
      description: Kommersielle fiskeselskaper driver arbeidsbåter for garnsetting og -henting, fangstservice, linefiske og fangsttransport. Disse båtene jobber hver dag i saltvannsmiljøer og må tåle tung belastning, konstant dekkshåndtering og lange driftstimer. Drivstoffeffektivitet og lite vedlikehold er avgjørende for flåtens lønnsomhet. Fartøyet skal sørge for stabile arbeidsplattformer for mannskapshåndtering av redskaper og fangst under varierende sjøforhold.
      features:
        - Flatt dekk for garnhåndtering, fellestabling og fiskelagring
        - Drivstoffeffektiv 40-115 HP påhengsmotor for lave daglige driftskostnader
        - Kraftige Hypalon-rør for slitestyrke ved daglig bruk
        - Forsterkede gnistrekker for hyppig kontakt med kai og fartøy
        - Selvlåsende dekk for enkel nedvasking etter operasjoner
        - Flåtepriser og konsistente spesifikasjoner for operatører med flere fartøy
    - title: Charterfiskeoperatører
      subtitle: Komfort for flere passasjerer, fangsthåndtering, sikkerhetssertifisert
      description: Operatører som driver halvdags- og heldagsfiskecharter - fra revfiske til havs til bunnfiske. Båten din trenger passasjerseter med sikkerhetssertifiseringer, god dekksplass for flere sportsfiskere og integrerte borebrønner for å holde agn og fangst frisk gjennom hele turen. Gjestekomfort påvirker direkte turanmeldelser, gjentatte bestillinger og nettvurderinger.
      features:
        - Konsollstyring med støtdempende bøtteseter
        - Fabrikkinstallerte stangholdere (4–8 posisjoner)
        - 60–115 HP utenbordsrekkevidde for offshore-marsjhastigheter
        - CE Kategori C- eller B-sertifisering for kommersiell passasjervirksomhet
        - Bimini eller T-top solskjerming for gjestenes komfort på lengre turer
    - title: Håndverks- og småskala kommersielle fiskere
      subtitle: Pålitelige arbeidsbåter for daglig levebrød
      description: Uavhengige fiskere som er avhengige av båten sin som sin primære inntektskilde - setter garn, steller fiskefeller eller håndterer nær land. Din prioritet er drivstofføkonomi, enkelt vedlikehold du kan utføre selv, og en båt som håndterer moderate mengder fangst og utstyr uten å ofre stabiliteten.
      features:
        - Drivstoffeffektiv 15–40 HP påhengsmotor for lave driftskostnader
        - Hypalon CSM rør for utvidet UV- og slitestyrke
        - Flatt dekk for garnhåndtering og fiskeoppbevaring
        - Enkel strandlandingsevne med oppblåsbar kjølbeskyttelse
    - title: Fiskesamvirke
      subtitle: Fangstinnsamling, medlemstransport, forsyningsfordeling
      description: Fiskekooperativer driver lokalsamfunnsbaserte flåter for å samle inn fangst fra medlemsfiskere, transportere forsyninger til avsidesliggende fiskesamfunn og distribuere høsting til markeder. Disse arbeidsbåtene trenger høy nyttelastkapasitet, pålitelig daglig drift og enkelt vedlikehold på avsidesliggende steder. Kooperativer opererer ofte i utviklingsregioner der deler tilgjengelighet og servicetilgang er begrenset, noe som gjør enkle påhengsmotorkonfigurasjoner og holdbar konstruksjon avgjørende.
      features:
        - Høy nyttelastkapasitet for trekking av fangst og forsyninger
        - Enkel påhengsmotorkonfigurasjon for enkel service på stedet
        - Kraftig PVC eller Hypalon konstruksjon for budsjettfleksibilitet
        - Flatt dekk med festepunkter for sikring av last
        - Drivstoffeffektiv drift som minimerer driftskostnader for samarbeid
    - title: Sports- og viltfiskeentusiaster
      subtitle: Ytelse og stil for seriøse sportsfiskere
      description: Erfarne sportsfiskere som søker en dyktig fiskeplattform som leverer fart til fjerne marker, stabile stående kampposisjoner og førsteklasses passform og finish. Båten må føle seg hjemme uansett om den løper to miles offshore til et rev eller utforsker avsidesliggende elvemunninger.
      features:
        - Deep-V RIB skrog for jevn kjøring i hakk
        - Fishfinder/GPS-monteringsplate forhåndskablet på konsollen
        - Baitwell og kjøler integrert i baksetemodulen
        - Egendefinerte EVA dekkfargealternativer som matcher båt/rør-grafikk
    - title: Fiskeguide og øko-turoperatører
      subtitle: Guidede fiskeopplevelser for tilreisende sportsfiskere
      description: Guider som tar små grupper av tilreisende sportsfiskere til produktive fiskeplasser - ofte kombinerer fiske med økoturismeelementer som fugletitting eller mangroveutforskning. Båten må kjøre tørt og komfortabelt for gjester som ikke er vant til småbåter, med lett ombordstigning og skyggemuligheter.
      features:
        - Bimini topp eller T-top monteringspunkter fabrikkinstallert
        - Glatt påstigningsstige for enkel ombordstigning
        - Stillegående 4-takts påhengsmotor for å minimere forstyrrelser
        - Tørre oppbevaringsrom for gjestetelefoner, lommebøker, kameraer
