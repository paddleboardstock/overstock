tests:
  - title: Trykktesting
    standard: ISO 6185-1 | Intern spesifikasjon AF-PT-001
    description: Oppblåsbare kamre settes under trykk til 1,25x den anbefalte driftsgrensen og holdes i 30 minutter. Trykkfall måles for å validere lufttetthet og strukturell integritet til materialer og sømmer.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
  - title: Effekttesting
    standard: Intern spesifikasjon AF-IT-002
    description: Produktene utsettes for kontrollerte støt fra standardiserte fallvekter og pendelapparater. Dette vurderer punkteringsmotstand, riveutbredelse og strukturell motstandskraft mot kollisjoner med hindringer, dokker og rusk.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
  - title: UV-motstandstesting
    standard: ASTM G154 | ISO 4892-3
    description: Materialprøver eksponeres for UVA-340-lamper i akselerert forvitringskamre i 1000+ timer. Vi måler fargeendring (Delta E), glansretensjon og tap av strekkfasthet for å validere UV-stabilisatorpakker.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
  - title: Testing av slitestyrke
    standard: ASTM D751 (Taber) | ISO 5470-1
    description: Materialprøver utsettes for CS-10 slipeskiver under 500g/1000g belastning i 1000 sykluser. Massetap og visuell slitasjeklassifisering bestemmer beleggets holdbarhet mot sand, grus og gjentatt utsetting.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pvc-material-testing.webp
  - title: Lav-temperatur ytelsestesting
    standard: Intern spesifikasjon AF-LT-003 | MIL-STD-810G
    description: Sammensatte produkter og materialkuponger kondisjoneres ved -20 °C, -10 °C og 0 °C i 24 timer og deretter flekstestes. Vi bekrefter at PVC og Hypalon forblir fleksible uten sprekker eller delaminering.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-exterior.webp
  - title: Oppdrifts- og lastekapasitetstesting
    standard: ISO 6185-1 | ISO 12402
    description: Produktene lastes trinnvis til 1,25x nominell kapasitet i et kontrollert basseng. Fribord, stabilitet og selvdrenerende ytelse registreres. Hver modells nominelle kapasitet er matematisk og empirisk verifisert.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-stock-boat-inventory.webp
  - title: Manøvrerbarhetstesting
    standard: Intern spesifikasjon AF-MT-004
    description: Forsøk på vann måler svingradius, akselerasjon, planingstid og padle-/motorrespons over en rekke belastningsforhold. Reelle håndteringsegenskaper er validert mot designmål.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-dolphin-wave-1.webp
  - title: Vanntetthetstesting
    standard: ISO 6185-1 §7.3 | Intern spesifikasjon AF-WT-005
    description: Hvert sammensatt produkt er spraytestet ved 0,5 bar på alle sømmer, ventiler og beslag. En 5-minutters nedsenkingstest under trykk validerer kammerets og ventilens vanntetthet. Nulllekkasjestandard før frakt.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department-2.webp
