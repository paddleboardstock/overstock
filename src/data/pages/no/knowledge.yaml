hero:
  tagline: Kunnskapsgraf
  title: Vannutforskningskunnskap
  subtitle: |
    En strukturert kunnskapsbase som dekker oppblåsbar SUP-teknologi,<br />
    vannsikkerhet, båtkonstruksjon og eventyrplanlegging.
  taglineSection: Utforsk. Lær. Gå med tillit.
clusters:
  tagline: Kunnskapsklynger
  title: Utforsk etter emne
  subtitle: Dypdykk i teknologien, sikkerheten og ferdighetene bak hvert Paddle Board Overstock-produkt.
  items:
    - title: SUP-kunnskap
      description: Fra å velge ditt første brett til avanserte turteknikker — alt om paddleboarding.
      icon: tabler:lifebuoy
      topics:
        - Hvordan velge ditt første oppblåsbare SUP
        - Beste SUP-størrelse for nybegynnere
        - Hvor vanskelig er paddleboarding?
        - Sammenligning av oppblåsbart vs hardt brett
        - SUP-sikkerhetssjekkliste
    - title: Båtkunnskap
      description: Tekniske guider om oppblåsbare båter, RIB-er, joller og kajakker — teknikk, materialer og drift.
      icon: tabler:sailboat
      topics:
        - Oppblåsbare båttyper forklart
        - PVC vs Hypalon sammenligning
        - RIB vs Jolle sammenligning
        - Drop-stitch-teknologi dybdegående
        - Maritim materialvitenskapsguide
    - title: Sikkerhetskunnskap
      description: Viktig sikkerhetskunnskap for enhver padler — fra PFD-valg til væravlesing til selvevakueringsteknikker.
      icon: tabler:shield
      topics:
        - SUP-sikkerhetssjekkliste
        - Trenger du redningsvest?
        - Sikkerhetsguide for havpadling
        - Elvesikkerhet for oppblåsbare kajakker
        - Vær- og vannforholdbevissthet
    - title: Teknologi
      description: Ingeniørkunsten bak Paddle Board Overstock-produkter — materialer, konstruksjonsmetoder og kvalitetstesting.
      icon: tabler:microscope
      topics:
        - Maritim-grade PVC-teknologi
        - Drop-stitch-kjerne forklart
        - Hvorfor PSI betyr noe for oppblåsbare SUP-er
        - RF-sveising vs limbinding
        - Kvalitetstesting og sertifisering
    - title: Business Knowledge
      description: Kommersielle guider for å bygge og skalere vannsportvirksomheten din – fra utleievirksomhet til merkevarebygging med private label.
      icon: tabler:briefcase
      topics:
        - Hvordan starte en SUP utleievirksomhet
        - Bygge et vannsportsenter for feriestedet
        - Padlebrett flåtestørrelse for klubber
        - Oppblåsbar vs hard SUP for kommersiell bruk
        - Beste kajakkmateriale for utleieflåter
        - Starter et private label vannmerke
        - Inntektsstrategier for resortvannsport
        - Veiledning for vedlikehold av kommersielt utstyr
