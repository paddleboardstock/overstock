hero:
  tagline: CE & RCD-samsvar
  title: RIB Boat CE-samsvar<br />og teknisk dokumentasjon
  subtitle: Aquafarer RIB-båter og oppblåsbare vannscootere er designet og dokumentert for samsvar med EU-markedet i henhold til direktivet for fritidsfartøy 2013/53/EU. Fra risikovurdering til samsvarserklæring gir vi modellspesifikk samsvarsdokumentasjon for hvert skrog.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: RIB-båt CE-samsvarsdokumentasjon og sertifisering
direct_answer: Aquafarer leverer modellspesifikk RCD 2013/53/EU-samsvarsdokumentasjon for RIB-båter og oppblåsbare vannscootere, inkludert tekniske filer, samsvarserklæringer, byggeskilt og eierhåndbøker – alt i tråd med EN ISO 6185, ISO 12217 og gjeldende harmoniserte standarder.
