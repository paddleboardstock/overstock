content_material_cert:
  tagline: Materialsertifisering
  title: Materialsporbarhet og<br />sertifiseringsbevis
  subtitle: Kvalitet RIB båter begynner med kontrollerte materialer og dokumenterte prosesser. Nedenfor er hvordan vi organiserer materialsertifisering for hver kritisk komponentgruppe.
  items:
    - title: Oppblåsbart rørmateriale Sporbarhet
      description: PVC og CSM/Hypalon rørmaterialer velges i henhold til tiltenkt bruk, klimaforhold og målmarked. Leverandørens tekniske data (TDS), materialbatchinformasjon, stoffbatchsporbarhet, UV- og værtestrapporter og REACH/SVHC-deklarasjoner er tilgjengelig innenfor avtalt prosjektdokumentasjonsomfang.
      icon: tabler:circle
    - title: Marine aluminium sporbarhet
      description: For aluminiumskrog RIB-prosjekter kontrolleres legeringskvalitet, tykkelse og materialpartier i henhold til godkjent spesifikasjon. Materialtestsertifikater (MTC/MTR), EN 10204 3.1-dokumentasjon, rapporter om kjemisk sammensetning og mekaniske egenskaper, og varme/lot-sporbarhet leveres der det er avtalt.
      icon: tabler:rectangle
    - title: GRP Skrogmateriale og prosesskontroll
      description: For RIB-er med glassfiberskrog styres gelcoat, harpiks, glassfiberarmering og kjernematerialer gjennom kontrollerte spesifikasjoner. Materiale-TDS/SDS, batch-registreringer, laminatspesifikasjoner og herde- og verkstedkontroller er tilgjengelig etter prosjektavtale.
      icon: tabler:layers-subtract
    - title: Støtte for komponentdokumentasjon
      description: For utvalgte komponenter – inkludert EVA dekkmaterialer, seter, maskinvare i rustfritt stål, drivstoffsystemer, elektrisk utstyr og marinetilbehør – koordineres gjeldende leverandørdokumentasjon basert på endelig konfigurasjon og destinasjonsmarkedskrav.
      icon: tabler:package
    - title: Varsel om samsvar
      description: Sertifikater, testrapporter og samsvarsdokumenter gjelder kun for den spesifikke produktmodellen, materialet, komponenten, produksjonspartiet eller prosjektomfanget som er angitt i det relevante dokumentet. Kontakt oss med ditt målmarked, tiltenkte bruk og tekniske krav slik at den aktuelle dokumentasjonspakken kan bekreftes før bestilling.
      icon: tabler:info-circle

