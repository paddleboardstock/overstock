content_scope:
  tagline: Samsvarsomfang
  title: Hvilke produkter trenger<br />RCD-overholdelse?
  subtitle: Fritidsfartøydirektivet 2013/53/EU gjelder for fritidsfartøyer med skroglengde mellom 2,5 m og 24 m. Å forstå omfanget er det første trinnet til samsvar.
  items:
    - title: RIB-båter (2,5–24 m)
      description: Stive oppblåsbare båter med skroglengder fra 2,5 m til 24 m faller inn under RCD. Designkategori A til D gjelder avhengig av tiltenkte sjøforhold og maksimal vindstyrke.
      icon: tabler:sailboat
    - title: Oppblåsbare båter (under 2,5 m)
      description: Små oppblåsbare båter og joller under 2,5 m kan være delvis unntatt fra RCD, men krever fortsatt CE-merking under andre gjeldende direktiver og EN ISO 6185 konstruksjonsstandarder.
      icon: tabler:sailboat
    - title: SUP-brett og tilbehør
      description: Stående padlebrett er utenfor RCD-omfanget. Tilknyttede personlige flyteanordninger (PFDs) krever imidlertid CE-merking i henhold til PPE-forordningen (EU) 2016/425 med USCG Type III/V-godkjenning der det er aktuelt.
      icon: tabler:swimming
    - title: Delvis ferdigstilte båter
      description: Båter levert uten motor eller spesifikke installasjoner krever en byggherreerklæring for delvis fullførte fartøyer, med full RCD-overholdelse fullført av den endelige byggherren eller importøren.
      icon: tabler:tool
content_trust_layers:
  tagline: Tre-lags tillitssystem
  title: Samsvarsinformasjon<br />— Delt på riktig nivå
  subtitle: Ikke alle samsvarsdata hører hjemme på et offentlig nettsted. Vi følger en tre-lags tilnærming som beskytter IP samtidig som vi bygger kjøpers tillit.
  items:
    - title: Lag 1 — Offentlig nettside
      description: Standarder referert, samsvarsruter forklart, dokumenttyper oppført, sertifiseringsomfang per modellfamilie. Ingen faktiske sertifikater, testdata eller proprietære tekniske detaljer.
      icon: tabler:world
    - title: Lag 2 — Deling etter forespørsel
      description: 'Etter en kvalifisert forespørsel: redigert DoC-eksempel, bilde av byggeplaten, gjeldende standardliste, sjekkliste for samsvar og sammendrag av materialsertifiseringer – delt under vilkår for rimelig bruk.'
      icon: tabler:mail
    - title: Lag 3 — NDA / Ordrestadium
      description: Full teknisk fil, risikovurderinger, stabilitetsberegninger, testrapporter, materialbatch-oppføringer og produksjonssporbarhetsdokumentasjon – deles kun under NDA med bekreftede kjøpere.
      icon: tabler:lock
content_standards:
  tagline: Gjeldende standarder
  title: ISO & EN-standarder<br />Vi bygger til
  subtitle: Våre produkter er designet og testet mot de harmoniserte standardene under RCD. Standardnumre og navn er referert; fulle standardtekster forblir ISO-opphavsrett.
  items:
    - title: EN ISO 6185-3
      description: 'Oppblåsbare båter – Del 3: Båter med en maksimal motoreffekt på 15 kW eller mer. Krav til konstruksjon, stabilitet, oppdrift og utvinning mann over bord for RIB-er.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Oppblåsbare båter – Del 4: Båter med en maksimal motoreffekt på 15 kW og større enn eller lik 4,5 kW. Ytterligere krav til struktur og stabilitet.'
      icon: tabler:file-text
    - title: ISO 12215-serien
      description: Små farkoster — Skrogkonstruksjon og skjæring. Strukturell design av skrog, dekk og skott for RIB-skrog i glassfiber og aluminium.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Små fartøy — Instruksjonsbok. Nødvendig innhold og format for brukermanualen som følger med hver RIB-båt levert i EU.
      icon: tabler:book
    - title: EN ISO 14945
      description: Lite håndverk — Byggerplate. Informasjon som skal merkes på byggeplaten permanent festet til hvert fartøy.
      icon: tabler:badge
    - title: ISO 8666
      description: Små fartøy — Hoveddata. Standardiserte målinger og parametere for konsistente spesifikasjoner på tvers av all produktdokumentasjon.
      icon: tabler:dimensions
content_process:
  tagline: Overholdelsesprosess
  title: 6-trinns CE-samsvar<br />Arbeidsflyt
  subtitle: Fra prosjektomfang til sporbarhet på serienivå – hver RIB-modell følger en definert samsvarsvei.
  steps:
    - number: '01'
      title: Prosjektomfang og klassifisering
      description: Definer RIB-modellen, designkategori (A/B/C/D), maksimalt antall personer, nyttelast, motorkraft og målmarked. Finn ut om RCD gjelder og hvilken samsvarsvurderingsmodul som kreves.
      timeline: 2–3 dager
    - number: '02'
      title: Gjeldende kravidentifikasjon
      description: Identifiser alle gjeldende essensielle sikkerhetskrav fra RCD Annex I, relevante harmoniserte standarder (EN ISO 6185, 12215, 10240, 14945), og eventuelle ytterligere nasjonale krav for målmarkedet.
      timeline: 3–5 dager
    - number: '03'
      title: Design og teknisk dokumentasjon
      description: 'Lag den tekniske masterfilen: generelle tegninger, stabilitets- og oppdriftsberegninger, risikovurdering, materialspesifikasjoner og systemsikkerhetsanalyse (drivstoff, elektrisk, styring).'
      timeline: 10–15 dager
    - number: '04'
      title: Produktverifisering og testing
      description: Gjennomfør fysisk verifisering – trykktesting ved 1,25x nominelt trykk i 24–48 timer, stabilitets- og oppdriftstester, lasttester og igangkjøring av systemer. Registrer alle testresultater per skrog.
      timeline: 5–7 dager
    - number: '05'
      title: Merking og leveringsdokumentasjon
      description: Fest CE-merking, byggeskilt (EN ISO 14945) og HIN/CIN (skrogidentifikasjonsnummer). Utarbeid EU-samsvarserklæring, brukerhåndbok (EN ISO 10240) og sjekkliste for samsvar.
      timeline: 2–3 dager
    - number: '06'
      title: Sporbarhet på seriell nivå
      description: Hvert skrog mottar et unikt skrogregister som knytter det til den tekniske masterfilen, produksjonsbatch, materialsertifikater, testresultater og endelig konfigurasjon. Rekorder oppbevart i 10+ år per RCD.
      timeline: Pågående
content_document_cards:
  tagline: Dokumenttyper
  title: Samsvarsdokument<br />kort
  subtitle: Dette er dokumenttypene vi utarbeider og vedlikeholder for hver CE-sertifisert RIB-modell. Prøver er tilgjengelige ved kvalifisert forespørsel.
  items:
    - title: CE / RCD-samsvarssertifikat
      description: Modellspesifikt sertifikat som bekrefter at fartøyet oppfyller alle gjeldende essensielle sikkerhetskrav i RCD 2013/53/EU, utstedt av produsenten med involvering av bemyndiget organ der det er nødvendig.
      icon: tabler:certificate
    - title: EU-samsvarserklæring (DoC)
      description: Signert erklæring fra produsenten eller autorisert representant, som viser gjeldende direktiver, standarder, samsvarsmodul og detaljert informasjon om varslet organ. Påkrevd for hver modell som er plassert på EU-markedet.
      icon: tabler:file-check
    - title: Byggeplate (EN ISO 14945)
      description: Permanent festet plate som viser maksimalt antall personer, maksimal motoreffekt, designkategori og produsentidentifikasjon. Må forbli leselig i hele farkostens levetid.
      icon: tabler:badge
    - title: Brukerhåndbok (EN ISO 10240)
      description: Omfattende håndbok som dekker sikker drift, nødprosedyrer, vedlikeholdsplaner og sikkerhetsadvarsler. Obligatorisk for hver RIB levert i EU.
      icon: tabler:book
    - title: ISO test- og inspeksjonsrapporter
      description: Trykktestregistreringer (1,25x / 24–48 timer), stabilitets- og oppdriftstestresultater, materialtestsertifikater og dimensjonsverifikasjonsrapporter – alt knyttet til spesifikke skrognummer.
      icon: tabler:test-pipe
    - title: Materialsporbarhetsregistre
      description: Sporbarhet på batchnivå for tubestoff, lim, glassfiber og maskinvare. Kobler hver produksjonsenhet til innkommende materialsertifikater og IQC-inspeksjonsresultater.
      icon: tabler:link
    - title: Kvalitetsinspeksjon og kvalitetskontroll
      description: 100-punkts kvalitetssjekkliste per enhet, QC-oppføringer i prosessen, avviksrapporter og korrigerende handlinger. En del av produksjonens sporbarhetskjede.
      icon: tabler:clipboard-check
    - title: Prosjektdokumentpakke
      description: Dokumentasjonspakke per skrog, inkludert endelig konfigurasjonsopptegnelse, motor- og utstyrsinstallasjonsdetaljer, sjekkliste for igangkjøring og leveringsdokumentasjon.
      icon: tabler:package
content_design_categories:
  tagline: RCD-designkategorier
  title: Designkategori A–D<br />— Hva de betyr
  subtitle: RCD tildeler designkategorier basert på maksimal vindstyrke og betydelig bølgehøyde fartøyet er designet for å tåle.
  items:
    - title: Kategori A — Hav
      description: Designet for lengre seilaser der vindstyrken kan overstige Beaufort 8 (>40 knop) og signifikant bølgehøyde kan overstige 4 m. Krever den mest strenge struktur- og stabilitetsverifiseringen.
      icon: tabler:ripple
    - title: Kategori B — Offshore
      description: Designet for offshore-reiser med vindstyrke opp til Beaufort 8 (≤40 knop) og betydelig bølgehøyde opp til 4 m. Egnet for kyst- og semi-eksponerte farvann.
      icon: tabler:anchor
    - title: Kategori C — Inshore
      description: Designet for kystreiser med vindstyrke opp til Beaufort 6 (≤27 knop) og betydelig bølgehøyde opp til 2 m. De fleste rekreasjons-RIB-er faller i denne kategorien.
      icon: tabler:sun
    - title: Kategori D – Skjermet
      description: Designet for skjermet farvann med vindstyrke opp til Beaufort 4 (≤16 knop) og signifikant bølgehøyde opp til 0,3 m. Innsjøer, elver og beskyttede havner.
      icon: tabler:pool
content_hin:
  tagline: Håndverksidentifikasjon
  title: HIN / CIN og byggeskilt
  subtitle: Hver RIB-båt krever et skrogidentifikasjonsnummer (HIN) eller et håndverksidentifikasjonsnummer (CIN) og en byggeskilt i henhold til EN ISO 14945 og RCD-krav.
  items:
    - title: Skrogidentifikasjonsnummer (HIN)
      description: En unik kode på 14 tegn permanent merket på styrbord side av akterspeilet, kodende produsentkode (MIC), modellår, produksjonsår og serienummer. Nødvendig for å komme inn på EU-markedet.
      icon: tabler:hash
    - title: Fartøyets identifikasjonsnummer (CIN)
      description: I henhold til EN ISO 10087, et skjult sekundært identifikasjonsnummer plassert på et skjult sted for anti-tyveri og sporbarhetsformål.
      icon: tabler:eye-off
    - title: Byggerens plateinnhold
      description: Maksimalt antall personer, maksimal motoreffekt (kW), maksimal belastning (kg), designkategori, produsentnavn og CE-merking – alt permanent vist på en korrosjonsbestandig plate.
      icon: tabler:badge
content_tech_file:
  tagline: Teknisk filstruktur
  title: Hovedteknisk fil<br /> & Hull Record
  subtitle: 'Vårt dokumentasjonssystem følger en to-lags struktur: Master Technical File for hver modellfamilie, og individuelle Hull Records for hver båt som produseres.'
  items:
    - title: Master teknisk fil
      description: 'Inneholder den fullstendige samsvarsdokumentasjonen for en modellfamilie: generelt arrangement, risikovurdering, stabilitets-/oppdriftsberegninger, materialspesifikasjoner, gjeldende standarder og samsvarsvurderingsposter. Oppbevart i 10+ år.'
      icon: tabler:folder
    - title: Skrogrekord (sporbarhet per båt)
      description: 'Hvert skrog har en unik registrering som knytter den til den tekniske masterfilen: HIN, produksjonsdato, rørbatch, materialsertifikater, trykktestresultat, endelig konfigurasjon, motorinstallasjon og leveringsdestinasjon.'
      icon: tabler:file-description
    - title: Kundeoverholdelsespakke
      description: Leveringspakke per skrog, inkludert DoC, byggeplatefoto, brukerhåndbok, testsammendrag og endelig konfigurasjonsark – følger med hver RIB som sendes til EU.
      icon: tabler:package
faq:
  title: CE-samsvar – ofte stilte spørsmål
  questions:
    - q: Er alle Aquafarer RIB-båter CE-sertifisert for EU-markedet?
      a: RIB-båter i vår katalog er designet og dokumentert for RCD 2013/53/EU-samsvar i henhold til gjeldende EU-direktiver. CE-merking gjelder per modell, per konfigurasjon. Kontakt oss for et modellspesifikt samsvarsdokument.
    - q: Hva er forskjellen mellom RCD-samsvar og CE-merking?
      a: RCD (Recreational Craft Directive 2013/53/EU) er EU-lovgivningen som setter essensielle sikkerhetskrav. CE-merking er det visuelle symbolet plassert på et produkt som er vurdert og bekreftet å oppfylle disse kravene. Et produkt må være i samsvar med RCD før det kan bære CE-merket.
    - q: Leverer du samsvarserklæringer med hver båt?
      a: Ja. Hver RIB-båt som leveres til EU-markedet inkluderer en modellspesifikk EU-samsvarserklæring som viser gjeldende direktiver, harmoniserte standarder, samsvarsvurderingsmodul og detaljert informasjon om bemyndiget organ.
    - q: Hvilken samsvarsvurderingsmodul bruker Aquafarer?
      a: Modulen avhenger av designkategori og båttype. De fleste RIB-modeller i designkategori C bruker modul A (intern produksjonskontroll). For designkategori A/B-båter eller spesifikke konfigurasjoner, kan modul B+C eller B+D gjelde med involvering av varslet organ. Vi gir råd om passende modul per prosjekt.
    - q: Kan du dele samsvarsdokumentasjon før vi legger inn en bestilling?
      a: Etter en kvalifisert forespørsel deler vi et dokument med samsvarsomfang som viser gjeldende standarder, samsvarsrute og dokumenttyper tilgjengelig for modellen du vurderer. Fullstendige tekniske filer deles under NDA etter ordrebekreftelse.
    - q: Hva er et skrogidentifikasjonsnummer (HIN) og er det inkludert?
      a: HIN er en 14-tegns unik identifikator som er permanent merket på hver båt, som koder for produsentens kode (MIC), modellbetegnelse, produksjonsår og serienummer. Det er obligatorisk for alle RIB-båter som er plassert på EU-markedet og er inkludert på hver Aquafarer RIB.
    - q: Hvor lenge lagres tekniske filer?
      a: I henhold til RCD 2013/53/EU-krav må produsenten oppbevare den tekniske filen i minst 10 år fra siste dato da produktet ble markedsført. Aquafarer opprettholder full teknisk dokumentasjon for alle produserte modeller.
    - q: Bistår du med importørforpliktelser under RCD?
      a: 'Ja. Vi tilbyr dokumentasjonspakken som EU-importører trenger for å oppfylle sine forpliktelser: teknisk filtilgang, DoC, byggeskilt, brukerhåndbok og produktsporbarhetsregistreringer. Importørens ansvar under RCD er tydelig dokumentert i vår overholdelsesveiledning.'
