testimonial:
  content: Aquafarer designet og utstyrte hele vårt strandaktivitetsprogram på tvers av tre resorteiendommer. 80 SUP-er, 40 kajakker, sikkerhetsinfrastruktur og opplæring av personalet – alt levert i én forsendelse. Vår gjestedeltakelse i vannaktiviteter økte med 60 % den første sesongen.
  name: Sophie Laurent
  title: Direktør for Guest Experience, Azure Bay Resorts – Phuket, Thailand
content_segments:
  tagline: Feriestedsprofiler
  title: Waterfront Hospitality Solutions<br />Etter eiendomstype
  subtitle: Hver resorteiendom har en unik gjesteprofil, aktivitetsmiks og operasjonell rytme - fra boutique øko-lodges til viltvoksende luksuriøse strandferiesteder. Vi designer vannsportprogrammer som matcher eiendomsklassen og gjestenes forventninger.
  items:
    - title: Luksusferiesteder ved stranden
      subtitle: VIP-overføringer, vannaktiviteter, førsteklasses gjesteopplevelse
      description: Eksklusive strandeiendommer – Four Seasons, Aman og lignende luksusgrupper – der vannsport er et stort gjestetilbud som driver tilfredshetsscore og tilhørende inntekter. Flåten må se premium ut, tilby variasjon på tvers av aldersgrupper og ferdighetsnivåer, og integreres sømløst med feriestedets eksisterende concierge- og bookingsystemer. Forventningene til gjestenes utseende er ekstremt høye - utstyrets tilstand og presentasjon påvirker 5-stjerners anmeldelser direkte.
      features:
        - 'Premiummerket flåte: SUP-er, kajakker, pedalbåter og små RIB-tendere'
        - 'Gjesteklar presentasjon: resorttilpassede farger, logoprofilering, iscenesatt utstyrsvisning'
        - Liten luksus-RIB til VIP-gjestetransporter med skreddersydd polstring og fargematching
        - 'Integrert sikkerhetsinfrastruktur: bøyeliner, badevaktstasjoner, AED'
        - 'Inntektsstyring: maler for dynamisk prissetting, mersalgstrening, pakkeløsninger'
    - title: Private øyferiesteder
      subtitle: Gjestetransport i all vær – null nedetid, absolutt pålitelighet
      description: Private feriesteder på øya opererer på avsidesliggende steder der båten er den eneste forbindelsen til fastlandet. Daglige gjesteoverføringer, forsyningskjøringer og medisinsk nødevakuering avhenger av et enkelt fartøy – enhver nedetid påvirker gjesteopplevelsen og feriestedets drift direkte. Disse operatørene trenger en båt som går pålitelig under alle værforhold, krever minimalt med vedlikehold og har backup-systemer for driftskritisk pålitelighet. Båten må også presentere seg vakkert når gjestene ankommer øya.
      features:
        - RIB-konfigurasjon for alle værforhold med full værbeskyttelse og ekstra kraftige rør
        - Tvillingmotor eller reservemotor for drift uten nedetid
        - Hypalon-konstruksjon i kommersiell kvalitet for 5-8 års levetid i drift på fjerntliggende steder
        - Vedlikeholdsvennlig design med tilgjengelige komponenter for service på stedet
        - Skreddersydd resortprofilering og premiumpolstring tilpasset øyas estetikk
    - title: Innsjø- og økoferiesteder
      subtitle: Naturintegrerte gjesteopplevelser
      description: Eiendommer ved innsjøen, øko-hytter og naturreservater som tilbyr rolige vannaktiviteter med lav innvirkning som utfyller det naturlige miljøet. Utstyret skal være ikke-motorisert der det er mulig, enkelt å lagre i naust med begrenset plass, og stille i bruk for å bevare den omgivende opplevelsen for alle gjester.
      features:
        - 'Ikke-motorisert flåte: SUP-er, kajakker, kanoer og pedalbåter'
        - Stille oppblåsingsstasjoner med el-pumpe til gjestebruk etter behov
        - Miljøvennlige materialer og emballasje i tråd med bærekraftsprofileringen
        - Stativsystemer og organiseringssystemer for naust er inkludert
    - title: Strandklubber
      subtitle: Gjestetransport, underholdning, små luksuriøse RIB-er
      description: Strandklubber driver et høyenergi, visuelt fokusert miljø der utstyr er en del av atmosfæren. De trenger små luksuriøse RIB-er for gjestetransport fra nærliggende hoteller eller brygger, og vannleker for gjesteunderholdning - jetski-sleep, oppblåsbare sklier og padlebrett. Flåten skal se stilig ut, være enkel å betjene, og tåle daglig bruk av gjester med varierende ferdighetsnivå. Lagring og rask distribusjon er kritisk i rushtiden.
      features:
        - Kompakt luksus-RIB (3,3-4,3 m) til gjestetransporter og tenderservice
        - 'Vannleker: oppblåsbare slepebøyer, SUP-brett og kajakker til gjestenes underholdning'
        - Egen farge og profilering tilpasset strandklubbens visuelle identitet
        - Systemer for rask sjøsetting og opptak for drift med høy gjennomstrømning
        - Holdbar Hypalon-konstruksjon for daglig eksponering for saltvann og UV
    - title: Private medlemsklubber og yachtklubber
      subtitle: Havnetransport, medlemsanbud, eksklusiv vannsport
      description: Private klubber hvor vannsport og båttransport er en medlemsfordel fremfor en inntektsdriver. Utstyr må oppfylle høyere estetiske standarder, være tilgjengelig på forespørsel for medlemmer, og kreve minimalt tilsyn av personalet. Marina yachtklubber trenger spesifikt anbud for havnetransport – flytting av medlemmer mellom kai, fortøyning og land. Oppbevaring og vedlikehold skal være usynlig for medlemmene.
      features:
        - Eksklusive RIB-tendere til havnetransport og medlemstransportjeneste
        - 'Premiumutstyr: EVA-dekk, tilpassede medlemsfarger, merket polstring'
        - Selvbetjent utlånssystem for medlemsadgang uten personale
        - Lagring utenfor sesongen og årlig oppfriskningsprogram
    - title: Eventyr- og aktivitetsfokuserte hoteller
      subtitle: Guidede turer, SUP yoga, snorkleutflukter, gruppeaktiviteter
      description: Eiendommer som posisjonerer seg som eventyrdestinasjoner – tilbyr guidede turer, SUP-yoga, solnedgangspadler, snorkleutflukter og gruppeaktiviteter. Flåten må støtte både gratis utleie og guidede programmodeller, med utstyr som går sømløst mellom gjestebruk og instruktørledede turer. Disse eiendommene trenger slitesterkt utstyr for høyfrekvent omsetning, med enkel rengjøring mellom gjestegruppene.
      features:
        - Allsidig blandet flåte som støtter modeller for utleie + guidete turer
        - Tandemkajakker og ekstra stabile SUP-plattformer for gruppeaktiviteter
        - 'Guideutstyr: instruktørbrett, tørrbokser, vanntett kommunikasjonsutstyr'
        - 'Sesongbasert utstyrsrotasjon: sommerflåte → vinterlagringsprogram'
        - Holdbar konstruksjon dimensjonert for daglig gjestebruk med minimalt vedlikehold
