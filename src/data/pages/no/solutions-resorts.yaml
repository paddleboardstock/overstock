hero:
  tagline: Hoteller, feriesteder og gjestfrihet
  title: Premium Waterfront-opplevelser<br />For hoteller, feriesteder og yachtklubber
  subtitle: Nøkkelferdige vannsportprogrammer for strandhoteller, private feriesteder på øya, strandklubber og yachtklubber – fra gjesteutstyr og RIB-anbud til sikkerhetssystemer og opplæring av personalet.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer oppblåsbare båter for aktiviteter ved sjøen
direct_answer: Aquafarer samarbeider med hoteller, feriesteder, private øyer, strandklubber og yachtklubber over hele verden for å skape førsteklasses opplevelser ved sjøen. Våre løsninger inkluderer SUP-utleieflåter, guidede turkajakker, anbuds-RIB-er for gjestetransport, små luksus-RIB-er for transport til strandklubber og komplette sikkerhetssystemer. Hvert utstyr kan merkes med din eiendomslogo og fargevalg. Vi tilbyr også personalopplæring, programdesignkonsultasjon og planlegging av flåteutskifting for å sikre jevn kvalitet på tvers av sesonger.
