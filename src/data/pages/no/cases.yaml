features3_cases:
  tagline: Utvalgte saker
  title: Tilpassede løsninger<br />For ekte utfordringer
  isBeforeContent: false
  columns: 3
  items:
    - title: Bali dykkesenter oppgradering av daglig drift
      customer: Blue Ocean dykkesenter
      country: Indonesia
      industry: Kommersielt dykkesenter
      challenge: Blue Ocean Diving Centre på Bali opererte en eldre dykkebåt i glassfiber med begrenset dekksplass, vanskelig ombordstigning og høyt vedlikehold under tropiske saltvannsforhold. Lasting av utstyr var overfylt, forberedelsestiden var lang, og den ustabile plattformen skapte sikkerhetsproblemer for internasjonale turister - inkludert førstegangsdykkere og eldre reisende. Senteret kjører 3-5 dykkerturer daglig, 200+ dager per år.
      solution: Paddle Board Overstock leverte en tilpasset 6,8 m Professional Diving RIB med utvidet dekklayout optimalisert for lagring av dykkeutstyr, bred dykkestige i rustfritt stål, kraftige Hypalon-rør for UV- og saltvannsmotstand, sklisikker dekkoverflate og tanklagringsløsning. Konfigurasjonen ble designet rundt dykkesenterets daglige arbeidsflyt – ikke basert på en standard fritidsbåtoppsett.
      product: 6,8 m profesjonell dykking RIB
      results: Større arbeidsområde forbedret effektiviteten til klargjøring av utstyr. Dykkere opplevde tryggere og enklere ombordstigning. Kravene til vedlikehold redusert betydelig. Senteret fikk kapasitet til å håndtere flere kunder i høysesongen med større tillit. RIB ble grunnlaget for daglige dykkeoperasjoner.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Dykkerbåten vår er ikke bare transport. Det er grunnlaget for vår daglige drift. Paddle Board Overstock RIB gir teamet vårt mer selvtillit når de kjører flere dykkerturer hver dag.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center Professional RIB Oppgradering
      customer: Ocean Explorer dykkesenter
      country: Thailand
      industry: Kommersielt dykkesenter
      challenge: Ocean Explorer Diving Center i Phuket, Thailand, trengte å oppgradere fra en tradisjonell dykkebåt i glassfiber som ikke kunne holde tritt med økende etterspørsel fra kunder. Begrenset dekksplass gjorde klargjøring av utstyr ineffektivt. Vanskelig ombordstigning skapte sikkerhetsutfordringer for internasjonale turister. Høye vedlikeholdskrav i tropiske saltvannsforhold økte driftskostnadene. Senteret driver flere daglige turer, 200+ dager per år.
      solution: Paddle Board Overstock leverte en tilpasset 6,8 m kommersiell dykking RIB med optimert arbeidsdekkslayout for lagring av dykketanker, klargjøring av utstyr og dykkerbevegelse. Funksjonene inkluderer bred dykkerstige med rekkverk i rustfritt stål, kraftig rørkonstruksjon med UV-bestandige materialer, sklisikre gulv, tankoppbevaringsløsning, profesjonell konsoll og passasjerseter – alt konfigurert for kommersielle dykkeoperasjoner.
      product: 6,8 m kommersiell dykking RIB
      results: Større dekksareal muliggjorde raskere organisering av utstyr og mer effektiv daglig arbeidsflyt. Kundekomfort og sikkerhet ble betydelig forbedret. Nedetiden for vedlikehold ble redusert med konstruksjon av marinekvalitet. Dykkesenteret kan betjene flere kunder i høysesongen og utvide profesjonelle dykkertjenester med tillit.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: For et dykkesenter er ikke båten bare transport. Det er en viktig del av vår daglige drift. Paddle Board Overstock RIB gir teamet vårt selvtillit til å kjøre flere dykkerturer hver dag med bedre sikkerhet og effektivitet.
      icon: tabler:lifebuoy
    - title: Flåte for European Diving Center
      customer: BlueMed dykkesentre
      country: Hellas
      industry: Dykking og marin turisme
      challenge: Krever 12 dykkekonfigurerte RIBer for en kjede av dykkesentre på tvers av flere greske øyer. Hver båt trengte tilpasset dykkestige, tankoppbevaring for 8 tanker og stabil plattform for dykkerinngang i åpent vann. Flåten måtte ankomme innen 60 dager for starten av turistsesongen.
      solution: Produsert 12 RIB 520 dykkemodeller med integrerte tankstativ, dykkestiger og ekstra brede Hypalon-rør for ombordstigningsstabilitet. Hver båt ble merket med kundeflåten. Alle 12 båtene er trykktestet og sendt fra Qingdao innen 55 dager.
      product: RIB 520 dykk
      results: Alle 12 båtene leverte i tide for turistsesongen. Flåten har vært i daglig drift i 18+ måneder med null materialfeil. Kunden bestilte 6 ekstra enheter i år to.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB 520 Dive har vært ryggraden i våre daglige dykkeoperasjoner. Stabiliteten i hvile er utmerket, og tankoppbevaringsoppsettet holder dekket rent og trygt for våre gjester.
      icon: tabler:lifebuoy
    - title: Australsk distributør OEM-program
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: OEM/ODM Produksjon
      challenge: Den australske distributøren trengte en SUP-brettserie med private merker til konkurransedyktige priser for å konkurrere med kinesiske direkte-til-forbrukermerker. Nødvendig 8 unike modeller som dekker nybegynner til avansert, med tilpasset grafikk, tilpasset innpakning og levering til utsalgssteder.
      solution: Utviklet 8 SUP-modeller (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) med eksklusiv australsk grafikkpakke. Tilpasset forhandleremballasje med QR-koder som kobler til oppsettsvideoer. Drop-ship-logistikk konfigurert fra Qingdao direkte til australske butikker.
      product: Custom SUP Line (8 modeller)
      results: Konsept til første forsendelse på 90 dager. Detaljsalgsrate på 85 % i første sesong. Distributør utvidet partnerskapet til å inkludere oppblåsbar båtlinje i år to.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock leverte en komplett SUP-linje på 90 dager – fra første design til butikkgulv. Kvaliteten matcher merker som selger til det dobbelte av prisen.
      icon: tabler:arrows-exchange
    - title: Midtøsten Redningsbåtforsyning
      customer: Nasjonal sivilforsvarsmyndighet
      country: De forente arabiske emirater
      industry: Søk og redning
      challenge: Sivilforsvarsorganisasjonen trengte 20 patruljeklare RIB-er for kystsøk og redning, havnesikkerhet og flomrespons. Nødvendige selvborgende dekk, fulle navigasjonssuiter (GPS, radar, VHF), oransje rør med høy synlighet og samsvar med lokale maritime forskrifter.
      solution: Leveres med 20 RIB 450 patruljemodeller med selvlåsende dekk, Garmin-navigasjonssuiter, LED-søkelys, SOLAS reflekterende tape og oransje Hypalon-rør med høy synlighet. Hver båt var CE-sertifisert og testet i henhold til ISO 6185 standarder. Dokumentasjonspakken inkluderte samsvarssertifikater for lokal registrering.
      product: RIB 450 patrulje
      results: Flåte utplassert på tvers av 5 kyststasjoner. Båter har operert i ekstrem varme (45°C+) uten nedbrytning av rør. Patruljerekkevidde og drivstoffeffektivitet overskred spesifikasjonene med 12 %.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: RIB 450-patruljen overgikk våre operasjonelle krav. Under ekstreme varmeforhold viser Hypalon-rørene ingen tegn til UV-nedbrytning etter 24 måneders daglig bruk.
      icon: tabler:alert-triangle
    - title: Europeisk OEM merkevarepartnerskap
      customer: North Sea Marine Equipment BV
      country: Nederland
      industry: OEM/ODM Produksjon
      challenge: Etablert europeisk marinemerke ønsket å ekspandere inn i RIB-markedet uten å investere i produksjonsanlegg. Trengte en white-label-partner som kan produsere 5 RIB-modeller (3,9 til 6,2 m) med privat merkevare, CE-sertifisering og eksklusive EU-distribusjonsrettigheter.
      solution: Etablert white-label produksjonsavtale for 5 RIB modeller. Hver modell merket med kundelogoer og fargevalg. CE sertifiseringsdokumentasjon utarbeidet for hver modell. Eksklusive EU-distribusjonsrettigheter gitt med minimum ordreforpliktelser. Teknisk dokumentasjon og reservedelskatalog leveres for lokalt servicenettverk.
      product: Custom RIB Line (5 modeller)
      results: Flerårig avtale signert. Første produksjonsserie på 50 enheter sendes innen 75 dager. Merkevare lansert på METSTRADE med positiv forhandlermottakelse.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Å jobbe med Paddle Board Overstock tillot oss å gå inn på RIB-markedet uten å bygge en fabrikk – de leverte en komplett nøkkelferdig løsning med CE-sertifisering og forhandlerstøttedokumentasjon.
      icon: tabler:building
    - title: Karibisk resortflåte
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Marine turisme og gjestfrihet
      challenge: 'Luksusanlegget trengte en komplett flåte for vannsportutstyr for gjesteaktiviteter: 40 SUP brett for guidede turer, 20 kajakker for laguneutforskning, 10 oppblåsbare båter for gjestetransport og fisketurer, pluss tilbehør. Alt utstyr trengte tilpasset feriestedmerking og måtte leveres før turistsesongen.'
      solution: 'Produsert komplett vannsportpakke: 40 SUP Voyager-brett (All-Around-modell), 20 Explorer-kajakker, 10 AirDeck 360 oppblåsbare båter, pluss PFD-er, padler, pumper og reparasjonssett. Alt utstyr trykket med resortlogo og tropisk fargevalg. Containerisert forsendelse med fullstendig inventarmanifest.'
      product: Full vannsportpakke (70+ enheter)
      results: Flåten ankom 6 uker før høysesongen. Gjestetilfredshetsscore for vannsportaktiviteter økte med 40 % fra år til år. Utstyret har vart i 3 sesonger med kun rutinemessig vedlikehold.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Den komplette pakketilnærmingen betydde at vi mottok alt vi trengte i én forsendelse – brett, kajakker, båter og tilbehør, alt merket og klart for gjestebruk. Våre gjester elsker utstyrskvaliteten.
      icon: tabler:beach
    - title: Queensland Commercial Diving Center RIB Oppgradering
      customer: Kommersielt dykkesenter
      country: Australia
      industry: Kommersiell dykking og marine tjenester
      challenge: Et kommersielt dykkersenter i Queensland som spesialiserer seg på inspeksjon av marin infrastruktur, havnevedlikehold og undervannsreparasjonsprosjekter drev en aldrende arbeidsbåt. Etter hvert som etterspørselen etter prosjekter vokste, ble det gamle fartøyet et ansvar - hyppig vedlikehold forårsaket planleggingsforstyrrelser, oppsettet var ikke designet for moderne dykkeoperasjoner (begrenset plass til sylindere, verktøy og utstyr), og mannskapets komfort under lange operasjoner var dårlig. Selskapet trengte et fartøy som kunne støtte deres profesjonelle drift hver arbeidsdag.
      solution: Paddle Board Overstock gjennomførte en detaljert operasjonell analyse av kundens dykkearbeidsflyt, typisk prosjektvarighet, mannskapsstørrelse og utstyrskrav. Basert på denne analysen, leverte Paddle Board Overstock en tilpasset profesjonell RIB med en funksjonell dekklayout optimalisert for utstyrsforberedelse og dykkerbevegelse, profesjonelle sitteplasser for lengre transportperioder, forbedret stabilitet for tryggere dykkerinn- og utstigning, og dykkestøttefunksjoner integrert i designet.
      product: Tilpasset profesjonell dykking RIB
      results: Den nye RIB ble en pålitelig daglig arbeidsplattform. Utstyrsforberedelsen ble raskere med den optimaliserte layouten. Mannskapet rapporterte forbedret komfort og sikkerhet under lange operasjoner. Det profesjonelle utseendet til båten styrket kundenes tillit når de jobbet med havneoperatører og sjøentreprenører. Dykkersenteret fikk et fartøy som matchet profesjonaliteten i tjenesten deres.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Vi trengte en båt som kunne støtte virksomheten vår hver dag, ikke bare et fartøy for transport. Paddle Board Overstock jobbet med oss ​​for å forstå våre operasjonelle krav og leverte en RIB-løsning som passer vår kommersielle dykkearbeidsflyt.
      icon: tabler:lifebuoy
    - title: Amerikansk kystpatruljekontrakt
      customer: Sikkerhetsmyndigheten for Atlanterhavskysten
      country: USA
      industry: Maritim sikkerhet og rettshåndhevelse
      challenge: Det amerikanske kystsikkerhetsbyrået krevde tunge patrulje-RIB-er for avskjæringsoperasjoner i åpent vann. Nødvendig tomotors konfigurasjon for redundans, pansret konsoll for mannskapsbeskyttelse, militærspesifisert elektronikk (kryptert kommunikasjon, FLIR, radar) og samsvar med US Coast Guard-forskrifter.
      solution: Konstruert RIB 600 Patrol med tvilling 115 HP påhengsmotorkonfigurasjon, pansret konsoll med ballistisk beskyttelse, FLIR termisk bildebehandling, kryptert VHF/UHF-kommunikasjon og integrerte våpenfestepunkter. Skrog forsterket for høyhastighets avskjæringsmanøvrer. All elektronikk integrert og testet på fabrikk. USCG samsvarsdokumentasjon levert.
      product: RIB 600 Patrulje (to motorer)
      results: Båter oppnådde 52 knops toppfart under akseptprøver. Byrået rapporterte 95 % oppdragsberedskap i løpet av de første 12 månedene. Tilleggsbestilling for 8 enheter.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Tomotoren RIB 600 gir våre mannskaper hastigheten og redundansen som kreves for operasjoner med åpent vann. Den pansrede konsollen gir kritisk beskyttelse uten at det går på bekostning av ytelsen.
      icon: tabler:shield
