hero:
  tagline: Sertifiseringer & Standarder
  title: 'Kvalitetssertifiseringer<br />& Etterlevelsesstandarder'
  subtitle: 'Aquafarer-produkter produseres i samsvar med internasjonale standarder for maritim sikkerhet, kvalitetsledelsessystemer og miljøforskrifter.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Aquafarers kvalitetssertifiseringer og samsvarsdokumentasjon
content_certifications:
  tagline: Våre sertifiseringer
  title: 'Sertifisert kvalitet,<br />globalt anerkjent'
  subtitle: '64 CE-sertifiserte modeller og sertifiseringer for hele fabrikken viser vårt engasjement for kvalitet, sikkerhet og miljøansvar.'
  items:
    - title: 'CE-sertifisert'
      description: '64 CE-sertifiserte modeller oppfyller europeiske CE-merkekrav for fritidsfartøyer, noe som sikrer at krav til sikkerhet, helse og miljøvern er oppfylt.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Vårt kvalitetsledelsessystem er sertifisert i henhold til ISO 9001:2015 og dekker design, produksjon og distribusjon av oppblåsbare fartøyer og marint utstyr.'
      icon: tabler:clipboard-check
    - title: 'UKCA-merking'
      description: 'Produkter som selges på det britiske markedet, har UKCA-merking, som bekrefter samsvar med britiske forskrifter for marint utstyr og fritidsfartøyer.'
      icon: tabler:shield
    - title: 'BSCI-konform'
      description: 'Aquafarer revideres i henhold til BSCI (Business Social Compliance Initiative), noe som viser etiske produksjonspraksiser, rettferdige arbeidsforhold og ansvar i forsyningskjeden.'
      icon: tabler:heart-handshake
    - title: 'REACH-konform'
      description: 'Alle materialer i Aquafarer-produkter oppfyller EUs REACH-forordning for kjemikalsikkerhet, noe som sikrer at vår PVC, Hypalon og komponenter ikke inneholder begrensede stoffer.'
      icon: tabler:flask
    - title: 'Materialtesting'
      description: 'Stoffer testes for strekkfasthet, rivemotstand, UV-nedbrytning og ytelse ved kaldspraking. Hver produksjonsbatch prøvetas og verifiseres.'
      icon: tabler:test-pipe
content_factory:
  tagline: Fabrikkstandarder
  title: 'Produksjon i toppklasse<br />— bygget etter spesifikasjon'
  subtitle: 'Vår fabrikk på 12,000 m² drives etter strenge kvalitetskontrollprotokoller i hvert trinn av produksjonen.'
  list:
    - 'Innkommende materiellkontroll: alle råvarer — PVC-stoff, Hypalon, aluminium, kryssfiner, lim — testes mot spesifikasjoner før de går inn i produksjonen.'
    - 'Kvalitetskontroll i prosessen: hvert produksjonstrinn har dokumenterte QC-kontrollpunkter. Sveisestyrke, sømjustering, ventilmontering og strammingsmoment verifiseres inline.'
    - 'Trykktesting: Hvert oppblåsbart kammer blir trykktestet ved 1,25× nominelt trykk i 24-48 timer. Lekkasjeraten må være null for bestått karakter.'
    - 'Sluttinspeksjon: ferdige produkter inspiseres for dimensjonal nøyaktighet, kosmetisk finish, tilbehørskompletthet og emballasjeintegritet før forsendelse.'
    - 'Sporbarhet per parti: hvert produkt har et serienummer knyttet til produksjonsbatchoppføringer, noe som muliggjør full sporbarhet fra råvare til ferdig vare.'
content_safety:
  tagline: Standarder for maritim sikkerhet
  title: 'Sikkerhet først<br />— konstruert for pålitelig drift'
  subtitle: 'Aquafarer-produkter er konstruert og testet for å oppfylle internasjonale standarder for maritim sikkerhet for kommersiell og fritidsbruk.'
  items:
    - title: 'ISO 6185'
      description: 'Oppblåsbare båter oppfyller ISO 6185-standardene for konstruksjon, stabilitet, oppdrift og lastekapasitet.'
      icon: tabler:sailboat
    - title: 'ABYC-standarder'
      description: 'Elektriske systemer og drivstoffsystemer følger ABYC-standardene (American Boat & Yacht Council) for trygg installasjon og drift.'
      icon: tabler:bolt
    - title: 'SOLAS-etterlevelse'
      description: 'Sikkerhetsutstyr og redningsutstyr oppfyller SOLAS-kravene (Safety of Life at Sea) der det er relevant.'
      icon: tabler:lifebuoy
cta:
  title: 'Trenger du sertifiserte produkter til prosjektet ditt?'
  subtitle: 'Kontakt teamet vårt for å diskutere sertifiseringskrav, dokumentasjon og etterlevelse for markedet ditt.'
  actions:
    - variant: primary
      text: Be om sertifiseringsdokumenter
      href: /contact
    - text: Se kvalitetssiden vår
      href: /quality
