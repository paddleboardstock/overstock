materials:
  intro_p1: Ytelse, holdbarhet og sikkerhet i et oppblåsbart fartøy avhenger nesten helt av materialene som brukes i produksjonen. Fra stoffet som danner tubene til trådene som gir et SUP-brett stivheten — hvert materialvalg påvirker hvordan produktet fungerer på vannet og hvor lenge det varer.
  intro_p2: 'Denne guiden dekker de fire kernematerialene som brukes i moderne oppblåsbare fartøy: PVC-stoff, Hypalon CSM-gummi, drop-stitch-kjernekonstruksjon og EVA-skumdekk. Forståelsen av disse materialene hjelper deg å velge riktig produkt for dine behov og vedlikeholde det for maksimal levetid.'
  labels:
    advantages: Fordeler
    limitations: Begrensninger
    best_for: 'Best egnet for:'
  items:
    - name: PVC (polyvinylklorid)
      summary: Bransjestandarden for fritidsbåter og SUP. Flerlagets laminert stoff gir utmerket forhold mellom styrke og vekt til en overkommelig pris.
      pros:
        - Prisvennlig — 30-50 % billigere enn Hypalon
        - Lett og enkel å håndtere
        - God UV-motstand med riktige belegg
        - Stort utvalg av farger og finish
        - Lett å reparere med PVC-lapper og lim på løsemiddelbasis
      cons:
        - Kortere levetid enn Hypalon (7-10 år)
        - Mindre fleksibel i kulde
        - Lavere kjemikaliemotstand
        - Kan utvikle mykgjermigrasjon over tid
      best_for: Fritids-SUP, rimelige båter, utleieflåter, sesongbruk, ferskvann og kystmiljøer.
    - name: Hypalon (CSM-gummi)
      summary: Premium syntetisk gummi kjent for usedvanlig holdbarhet, UV-motstand og lang levetid. Gullstandarden for kommersielle og militære oppblåsbare båter.
      pros:
        - Usedvanlig UV- og ozonmotstand
        - Levetid på 15-20 år med riktig pleie
        - Utmerket fleksibilitet i kaldt vær
        - Overlegen motstand mot kjemikalier og olje
        - Beholder fargen lenger enn PVC
      cons:
        - Betydelig dyrere enn PVC
        - Tyngre stoff
        - Færre fargevalg
        - Reparasjoner krever spesiallim
        - Færre produksjonsanlegg i verden
      best_for: Kommersielle RIB, søk og redning, militær bruk, tropiske klima, langsiktig flåteeierskap.
    - name: Drop-stitch-kjerne
      summary: Teknologien som revolusjonerte oppblåsbare SUP. Tusenvis av polyestertråder binder sammen stoffets øvre og nedre lag, noe som muliggjør høytrykksoppblåsing for ytelse på nivå med et hardt brett.
      pros:
        - Ekstremt stivt ved 12-20 PSI
        - Lett — 18-30 lbs for et brett i full størrelse
        - Brettes flatt for oppbevaring og reise
        - Utmerket støtmotstand
        - Jevn ytelse over alle temperaturområder
      cons:
        - Krever høytrykkspumpe
        - Reparasjon av punkteringer er mer komplisert enn énlags konstruksjon
        - Høyere produksjonskostnad enn standard oppblåsbare produkter
        - Trykktap over tid krever jevnlig etterfylling
      best_for: Stand-up paddle-brett, kajakker, luftdekk til oppblåsbare båter — ethvert bruksområde som krever stivhet med oppblåsbar portabilitet.
    - name: EVA-skumdekk
      summary: Lukket celle-EVA-skum (etylen-vinylacetat) brukt til gripeputer på SUP-brett og båtdekk. Gir demping, grep og termisk isolasjon.
      pros:
        - Utmerket sklisikkert grep, vått som tørt
        - Demping reduserer utmattelse på lange padleturer
        - Termisk isolasjon mot kalde dekkflater
        - UV- og saltvannsbestandig
        - Finnes i flerfargede komposisjoner og lasergraverte mønstre
      cons:
        - Kan slites ved hard bruk etter 2-3 år
        - Må festes riktig for å unngå delaminering
        - Ikke bærende — påvirker ikke stivheten
        - Tilfører litt vekt (200-400 g per brett)
      best_for: SUP-dekkgrep, polstring av båtdekk, komfort i kajakksete — alle flater som krever sklisikkert fotfeste.
  selection:
    title: Guide for materialvalg
    subtitle: 'Velg riktig materiale basert på ditt primære bruksområde:'
    headers:
      - Bruksområde
      - Anbefalt materiale
      - Hvorfor
    rows:
      - - Fritids-SUP-padling
        - Drop-stitch PVC
        - Lett, stivt og prisvennlig — ideell balanse for fritidspadlere
      - - Familiebåt / innsjøbåt
        - PVC (1100 denier)
        - Kostnadseffektiv, enkel å reparere, tilstrekkelig holdbarhet for fritidsbruk
      - - Kommersiell RIB / patruljebåt
        - Hypalon CSM
        - Maksimal UV-motstand, levetid på 15-20 år, motstand mot kjemikalier og olje
      - - Utleieflåte med SUP-brett
        - Drop-stitch PVC + EVA-dekk
        - Holdbart, repererbart, god verdi ved intensiv bruk
      - - Søk- og redningsoperasjoner
        - Hypalon CSM
        - Pålitelighet i ekstreme forhold, fleksibilitet i kulde, kjemikaliemotstand
      - - Tur-/ekspedisjonskajakk
        - Drop-stitch PVC
        - Stiv ytelse med pakkbar portabilitet for reise
  deep_dive:
    title: Fordypningsguider
    topics:
      - title: Marin PVC
        desc: Flerlags laminert PVC-stoff — UV-motstand, slitasjetesting og denier-verdier forklart.
      - title: PVC vs Hypalon-sammenligning
        desc: Den endelige sammenligningen av de to dominerende materialene for oppblåsbare båter — kostnad, levetid, UV-motstand.
      - title: Drop-stitch-kjerne
        desc: Hvordan tusenvis av interne tråder skaper stive høytrykkskonstruksjoner ved 12-15 PSI.
      - title: HF-sveisingsteknologi
        desc: Høyfrekvenssveising gir sterke, jevne sømmer — hvordan det fungerer og hvorfor det er viktig.
      - title: PSI og ytelse
        desc: Hvorfor lufttrykk betyr noe for oppblåsbare SUP og båter — stivhet, lastekapasitet og komfort.
      - title: Kvalitetstesting
        desc: Trykktesting, oppdriftstester, UV-aldring og destruktive tester — vår kvalitetsprosess.
      - title: EVA-skumdekk
        desc: Dekkmatter av lukket celle-EVA-skum — grep, komfort og holdbarhet for SUP- og båtdekk.
      - title: Materialpleie
        desc: Rengjøring, UV-beskyttelse, forebygging av mugg og beste praksis for oppbevaring av oppblåsbare produkter.
