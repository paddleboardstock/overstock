hero_text:
  tagline: Ressurser
  title: 'Nedlastningssenter & innkjøpsguider'
  subtitle: 'Få tilgang til produktkataloger, OEM-guider, innkjøpssjekklister og teknisk dokumentasjon som hjelper deg med å treffe velinformerte innkjøpsbeslutninger.'
features3_downloads:
  tagline: Nedlastinger
  title: 'Produktdokumentasjon<br />& ressurser for kjøpere'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Marin produktkatalog 2026'
      description: 'Hele produktsortimentet inkludert RIB-båter, gummibåter, SUP-brett, kajakker og tilbehør. Spesifikasjoner, konfigurasjoner og valgmuligheter. PDF-format.'
      icon: tabler:file-text
    - title: 'OEM-produksjonsguide'
      description: 'Alt du trenger å vite om OEM/ODM-partnerskap: oversikt over prosessen, minste ordreantall, tilpasningsmuligheter, kvalitetskontroll og frakt.'
      icon: tabler:building-factory
    - title: 'Kjøpeguide for RIB-båter'
      description: 'Slik velger du riktig RIB: skrogmaterialer, tubematerialer, motorval, størrelsesvurderinger og konfigurasjonsmuligheter for ulike bruksområder.'
      icon: tabler:file-description
    - title: 'Sjekkliste for SUP-leverandører'
      description: 'Viktige hensyn ved valg av produsent av SUP-brett: kvalitetsindikatorer, sertifiseringskrav, MOQ-hensyn og hva du bør se etter i en fabrikkaudit.'
      icon: tabler:clipboard-check
    - title: 'Materiellguide for gummibåter'
      description: 'PVC mot Hypalon: sammenligning av holdbarhet, UV-motstand, levetid, reparasjonsalternativer og kostnadshensyn for ulike maritime bruksområder.'
      icon: tabler:files
    - title: 'Mal for kravspesifikasjon ved skreddersydd produksjon'
      description: 'Last ned vår mal for produktkrav. Fyll inn dine krav og send den tilbake til oss for et tilbud innen samme uke og en vurdering av gjennomførbarheten.'
      icon: tabler:template
faqs:
  title: Ofte stilte spørsmål
  subtitle: 'Vanlige spørsmål om produktene våre, produksjonsprosessen og vår partnerskapsmodell.'
  columns: 2
  items:
    - title: Hva er minste ordreantall?
      description: 'MOQ varierer etter produktkategori. RIB-båter starter vanligvis ved 10 enheter per modell. SUP-brett fra 50 enheter. Kontakt vårt salgsteam for produktspesifikk MOQ-informasjon.'
      icon: tabler:help-circle
    - title: Kan jeg få prøver før jeg legger inn en ordre?
      description: 'Ja. Paddle Board Overstock tilbyr prøveproduksjon for evaluering før masseproduksjon. Prøvekostnader er forhandlingsbare og krediteres ofte mot den første produksjonsordren.'
      icon: tabler:package
    - title: Hvilke betalingsbetingelser er tilgjengelige?
      description: 'Standardbetingelser: 30% depositum ved ordre, 70% før forsendelse. LC-betingelser er tilgjengelige for kvalifiserte kunder. Kontakt vårt økonomiteam for å diskutere ordningene.'
      icon: tabler:currency-dollar
    - title: Hvor lang tid tar produksjonen?
      description: 'Typiske leveringstider: RIB-båter 30-45 dager, SUP-brett 20-30 dager, gummibåter 25-35 dager. Skreddersydd utvikling legger til 15-30 dager for prototypefremstilling.'
      icon: tabler:calendar-clock
    - title: Hvilke sertifiseringer har produktene deres?
      description: 'CE-sertifisering for EU-markeder, produksjon godkjent av den amerikanske kystvakten, ISO-kvalitetssystem, BSCI-samsvar og REACH-materialesamsvar.'
      icon: tabler:certificate
    - title: Tilbyr dere skreddersydd emballasje og merkevareprofil?
      description: 'Ja. Vi tilbyr skreddersydd emballasje med deres logo, farger og merkevareidentitet. MOQ for skreddersydd emballasje avhenger av produktkategorien.'
      icon: tabler:color-swatch
cta:
  title: 'Trenger du hjelp med å finne riktig ressurs?'
  subtitle: 'Kontakt teamet vårt for personlig veiledning om produktval, OEM-partnerskap eller tekniske spesifikasjoner.'
  actions:
    - variant: primary
      text: Kontakt teamet vårt
      href: /contact
