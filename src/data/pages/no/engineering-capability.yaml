content_capability:
  tagline: Teknisk evne
  title: Hva våre ingeniører<br />team leverer
  subtitle: Aquafarer engineering dekker hele produktets livssyklus – fra markedsundersøkelser og konseptdesign til prototyping, testing og masseproduksjon.
  items:
    - title: Industriell design
      description: Vårt industridesignteam jobber fra kundekrav, markedsundersøkelser og konkurranseanalyser for å utvikle produktkonsepter som balanserer estetikk, funksjonalitet og produksjonsevne. Vi produserer 2D-skisser, 3D-gjengivelser og spesifikasjonsdokumenter for klientgjennomgang før vi forplikter oss til verktøy.
      features:
        - Konseptutvikling og forprosjektstudier
        - 2D-konstruksjonstegninger og 3D-visualiseringer
        - Materialvalg og spesifikasjon
        - Produksjonsorientert konstruksjonsanalyse (DFM)
        - Ergonomisk og sikkerhetsmessig evaluering
    - title: Konstruksjonsteknikk
      description: Våre konstruksjonsingeniører spesialiserer seg på oppblåsbar båtarkitektur - skrogdesign, rørkammerkonfigurasjon, drop-stitch-kjerneteknikk og lastfordeling. Hvert design blir analysert for strukturell integritet, vektoptimalisering og samsvar med relevante standarder (CE, ISO, AS).
      features:
        - Deep-V glassfiberskrogkonstruksjon med beregnede V-vinkler
        - Flerkamre tubkonfigurasjon for sikkerhet og oppdrift
        - Drop-stitch-kjernespesifikasjon og tetthetsoptimalisering
        - Elementmetodeanalyse for lastbærende komponenter
        - Vektfordelings- og stabilitetsberegninger
    - title: 3D-modellering og CAD
      description: Alle produktdesign er utviklet i 3D CAD før prototypeverktøy begynner. Ingeniørene våre bruker SolidWorks og Rhino 3D for produktmodellering, slik at kundene kan se gjennom hver detalj – fra rørprofil til konsolllayout – før de forplikter seg til produksjon.
      features:
        - Fullstendig 3D-CAD-modellering i SolidWorks og Rhino 3D
        - Fotorealistiske visualiseringer for kundepresentasjoner
        - Tekniske tegningspakker for produksjon
        - Form- og verktøykonstruksjon fra 3D-modeller
        - Direkt CAD-til-CNC-dataoverføring for presisjonskutting
    - title: Prototyping og testing
      description: Før masseproduksjon går hvert nytt produkt gjennom prototypestadiet. Vi bygger funksjonelle prototyper for klientevaluering, og utsetter dem deretter for vår fullstendige testprotokoll – trykktesting, stabilitetstesting, lasttesting og vannforsøk. Designgjentakelser på prototypestadiet er raske og kostnadseffektive.
      features:
        - Raske prototypeverktøy (leveringstid 15-20 dager)
        - Funksjonell prototype for evaluering i virkelige forhold
        - Fullstendig testprotokoll før produksjonsgodkjenning
        - Iterativ forbedring av konstruksjonen basert på testresultater
        - Milepæl for kundegodkjenning før produksjonsverktøy
    - title: Tilpasset tilbehørsintegrering
      description: Mange OEM-prosjekter krever integrering av klientlevert eller tredjepartstilbehør – tilpassede konsoller, spesialiserte sitteplasser, elektroniske systemer, dykkeutstyrsfester eller merkevareelementer. Vårt ingeniørteam administrerer integrasjonsdesign, strukturell tilpasning og kvalitetsvalidering av alt tilbehør.
      features:
        - Konsoldesign og layout for instrumentpanelet
        - Integrering av skreddersydde seter og trekk
        - Design og kabeldragning av elektroniske systemer
        - Monteringssystemer for dykke- og redningsutstyr
        - Spesifikasjoner for påføring av merkevare og grafikk
content_process:
  tagline: Utviklingsprosess
  title: Fra konsept<br />til produksjon
  subtitle: Produktutviklingsprosessen vår følger en strukturert 6-trinns arbeidsflyt designet for å minimere risiko, komprimere tidslinjer og sikre produksjonsberedskap fra dag én.
  stages:
    - stage: '01'
      title: Krav og forskning
      duration: 1-2 uker
      description: Vi samarbeider med kunden for å definere produktspesifikasjoner, målmarkedskrav, regulatoriske overholdelsesbehov og kommersielle mål. Dette stadiet produserer et produktkravsdokument (PRD) som veileder alt etterfølgende arbeid.
      deliverables: PRD, markedsanalyse, konkurransedyktig benchmark, foreløpig kostnadsestimat
    - stage: '02'
      title: Konseptdesign
      duration: 2-3 uker
      description: Industrielt designteam utvikler produktkonsepter basert på PRD. Flere designalternativer presenteres med 3D-gjengivelser, materialanbefalinger og innledende tekniske vurderinger. Oppdragsgiver velger retning for detaljert utvikling.
      deliverables: 3D-konseptgjengivelser, materialspesifikasjoner, designrasjonale, foreløpig stykkliste
    - stage: '03'
      title: Detaljert ingeniørfag
      duration: 2-4 uker
      description: Det valgte konseptet er ferdig utviklet – 3D CAD-modellering, strukturell analyse, rørkonfigurasjon, skrogdesign, integrering av tilbehør og produksjonsdokumentasjon. Alle dimensjoner, materialer og prosesser er spesifisert for verktøy.
      deliverables: Full 3D CAD-modell, tekniske tegninger, endelig stykkliste, verktøyspesifikasjoner, QC-plan
    - stage: '04'
      title: Prototype
      duration: 2-3 uker
      description: Prototypeverktøy produseres og funksjonelle prøver bygges. Kunden vurderer prototypen mot PRD-spesifikasjoner. Testing utføres etter avtalt protokoll. Designjusteringer gjøres basert på tilbakemelding før produksjonsverktøy.
      deliverables: Funksjonell prototype, testrapport, designrevisjonslogg, klientsigneringsdokument
    - stage: '05'
      title: Produksjonsverktøy
      duration: 2-3 uker
      description: Når prototypen er godkjent, settes produksjonsverktøy i drift - støpeformer, sveisejigger, skjæreprogrammer, monteringsarmaturer. QC-dokumentasjon og inspeksjonskriterier er ferdigstilt. Prøvekjøring utført for prosessvalidering.
      deliverables: Produksjonsverktøy, prosessdokumentasjon, QC inspeksjonsplan, prøvekjøringsrapport
    - stage: '06'
      title: Masseproduksjon og kvalitetskontroll
      duration: Pågående
      description: Full produksjon begynner med prosess-QC på hvert trinn. De første artiklene inspiseres og godkjennes før batchfrigivelse. Løpende kvalitetsovervåking, defektsporing og kontinuerlig forbedring gjennom hele produksjonens livssyklus.
      deliverables: Produksjonsplan, QC-rapporter, batchsporbarhetsposter, fraktdokumentasjon
content_customization:
  tagline: Tilpasningsalternativer
  title: Hva kan<br />tilpasses
  subtitle: Nesten alle aspekter av produktene våre kan tilpasses for å møte kundens krav. Nedenfor er de vanligste tilpasningskategoriene.
  columns: 3
  items:
    - title: Skrog og struktur
      description: Tilpasset skroglengde, bjelkebredde, dødstigningsvinkel, rørdiameter, kammerkonfigurasjon og materialkvalitet.
      icon: tabler:sailboat
    - title: Farger og grafikk
      description: Rørfarge (PVC/Hypalon), skroggelcoatfarge, konsollfarge, dekksgrafikk, logoplassering og emballasjedesign.
      icon: tabler:palette
    - title: Konsoll og kontroller
      description: Midtkonsoll, sidekonsoll eller rorkultstyring. Egendefinert instrumentpanellayout, bryterplassering og rorposisjon.
      icon: tabler:steering-wheel
    - title: Sitteplasser og møbeltrekk
      description: Jockeyseter, sittebenker, luksuriøst trekk, fargetilpassede sømmer, sammenleggbare eller avtagbare konfigurasjoner.
      icon: tabler:armchair
    - title: Tilbehør og utstyr
      description: Dykkestiger, tankstativer, slepemaster, T-topper, Bimini-topper, lydanlegg, navigasjonselektronikk og sikkerhetsutstyr.
      icon: tabler:backpack
    - title: Emballasje og merkevarebygging
      description: Tilpasset forhandleremballasje, private label-bokser, forsendelseskartonger med merkemerker, hengemerker og brukermanualer på klientspråk.
      icon: tabler:box
content_industries:
  tagline: Industriapplikasjoner
  title: Tekniske løsninger<br />etter industri
  subtitle: Vårt ingeniørteam har utviklet produkter for et bredt spekter av marine applikasjoner - hver med forskjellige krav og ytelseskriterier.
  columns: 3
  items:
    - title: Dykkeoperasjoner
      description: Forsterkede dekk, integrering av dykkestige, tanklagringssystemer og stabile plattformer for kommersielle dykkesentre over hele verden.
      icon: tabler:lifebuoy
    - title: Redning og beredskap
      description: Høyhastighets skrogdesign, selvlensende dekk, utstyrsmonteringssystemer og sikkerhetskonfigurasjoner med flere kammer for SAR-operasjoner.
      icon: tabler:alert-triangle
    - title: Marin turisme
      description: Passasjerkomfortoppsett, parasolintegrering, boardingsystemer og drivstoffeffektive konfigurasjoner for øyoverføringsoperasjoner.
      icon: tabler:beach
    - title: Yachttendere
      description: Kompakt design for davitoppbevaring, luksuriøse finishalternativer, matchende moderskipsfarger og høyytelses slepeegenskaper.
      icon: tabler:sailboat
    - title: Fiske og akvakultur
      description: Flate dekkkonfigurasjoner, borbrønnintegrering, stangholderoppsett, korrosjonsbestandig maskinvare for kontinuerlig saltvannseksponering.
      icon: tabler:fish
    - title: Havn og industri
      description: Kraftig skrogforsterkning, arbeidsbåtoppsett, personelltransportkonfigurasjoner og utstyrsintegrasjon for offshoreoperasjoner.
      icon: tabler:ship
