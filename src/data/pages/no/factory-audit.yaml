content_audit_evidence:
  tagline: Verifikasjonsbevis
  title: Revisjonsbevis<br />Du kan verifisere på stedet
  subtitle: Under fabrikkbesøk kan klienter verifisere spesifikke bevis ved hvert produksjonsområde. Her er hva du skal se etter - og hva vi forbereder for hver revisjon.
  areas:
    - area: Råvarelager
      what_to_verify: Er materialene stabile? Er det batchblanding?
      evidence: Innkommende inspeksjonsposter, batchetiketter, FIFO-lagring, leverandørgodkjenningsliste, materialsertifikater (PVC, Hypalon, glassfiber, aluminium, lim, maskinvare)
      icon: tabler:building-warehouse
    - area: Tubeproduksjon
      what_to_verify: Hvordan garanteres sømstyrke og lufttetthet?
      evidence: Prosesskort, bekreftelse av første artikkel, trykktestposter per kammer, reparasjons- og retestlogger, ventilinstallasjonsjournaler
      icon: tabler:flame
    - area: Skrogproduksjon
      what_to_verify: Hvordan kontrolleres strukturell konsistens?
      evidence: Kontrollerte prosessdokumenter, kvalitetskontrollpunkter, nummerering av halvfabrikata, målinger av gelcoattykkelse, verifisering av lamineringsplan
      icon: tabler:layers-subtract
    - area: Monteringsområde
      what_to_verify: Hvordan forhindres valgfrie deler fra feilmontering?
      evidence: Stykkeliste, arbeidsordrer, konfigurasjonssjekklister, arbeidsstasjonsinspeksjonskort, dreiemoment og funksjonskontroller per modell
      icon: tabler:tool
    - area: Teststasjon
      what_to_verify: Hvordan bekrefter du at båten er god før levering?
      evidence: Testprosedyrer, instrumentliste, kalibreringsregistreringer, trykktestlogger (1,25x / 24-48h), funksjonelle testsjekklister, bestått/ikke bestått kriterier dokumentert
      icon: tabler:gauge
    - area: Avviksområde
      what_to_verify: Hvordan håndteres mangler?
      evidence: Isolasjonsetiketter, NCR-logger, rotårsaksanalyse, omarbeidsgodkjenningsposter, CAPA-sporing (Corrective and Preventive Action)
      icon: tabler:alert-triangle
    - area: Ferdigvarelager
      what_to_verify: Hvordan forhindrer du feilsending og skade?
      evidence: Ferdige produktetiketter, ordrematchende poster, emballasjestandarder, inspeksjonsposter før forsendelse
      icon: tabler:box
    - area: Reservedeler og ettersalg
      what_to_verify: Kan du støtte langsiktig ettersalg?
      evidence: Felles reservedelsliste, lagerstrategi, delenummereringssystem, garantiprosessdokumentasjon, vedlikeholdsveiledninger
      icon: tabler:headset
content_closing_script:
  tagline: Revisjon på bestilling
  title: Fra fabrikkbesøk<br />til bekreftet prosjekt
  subtitle: En vellykket revisjon bør ikke ende med bilder og et håndtrykk. Før avreise sikrer vi at tre kommersielle utfall er dokumentert.
  items:
    - title: Bekreft teknisk konfigurasjon
      description: Bli enige om modell, applikasjon, nøkkelalternativer, målmarked, estimert mengde og leveringsplan - alt dokumentert før avreise.
      icon: tabler:checklist
    - title: Bekreft neste trinns dokumenter
      description: 'Definer hva Aquafarer gir neste: revidert GA, konfigurasjonsliste, tilbud, dokumentsjekkliste, eksempelplan eller NDA – med spesifikke tidslinjer.'
      icon: tabler:file-plus
    - title: Bekreft gjensidig tidslinje
      description: Revidert konfigurasjon og foreløpig tilbud innen 3 virkedager. Prøve eller utseendebekreftelse innen 7 dager. Teknisk gjennomgang eller tredjepartsinspeksjon innen 14 dager. Neste møtedato og ansvarlige parter låst.
      icon: tabler:calendar

