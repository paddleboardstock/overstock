content_priorities:
  tagline: Hva klienter bekrefter
  title: 8 ting kjøpere bekrefter<br />ved hvert fabrikkbesøk
  subtitle: Basert på tilbakemeldinger fra 50+ landkjøpere, er dette de åtte prioriteringene kundene vurderer før de legger inn en B2B-bestilling.
  items:
    - title: Ekte produsent
      description: 'Er du den faktiske fabrikken, ikke et handelsselskap? Kjøpere sjekker: forretningsenhet, ekte produksjonsutstyr, ansatte som betjener maskiner, gjeldende produksjonsordrer på gulvet og konsistens på nettstedet og verkstedet.'
      icon: tabler:building-factory
    - title: Produkt egnet for bruk
      description: Stemmer RIB-en deres spesifikke brukstilfelle? Operatører av feriested, redning, dykking, fiske og patrulje har fundamentalt forskjellige krav. Kjøpere vurderer dekkslayout, rørmateriale og utstyrsalternativer på den viste båten.
      icon: tabler:target
    - title: Kvalitetsstabilitet og reproduserbarhet
      description: Er den 50. enheten like god som den første? Kjøpere undersøker QC-systemer, sjekkpunkter i prosessen, håndtering av avvik og ber om å se poster fra flere produksjonskjøringer for å bekrefte konsistens.
      icon: tabler:repeat
    - title: Samsvarsdokumentets autentisitet
      description: Er CE-sertifikater modellspesifikke? Er DoC signert av en ekte person? Kan samsvar verifiseres per skrognummer? Kjøpere ser etter generelle krav kontra modellspesifikk dokumentasjon.
      icon: tabler:file-certificate
    - title: Tilpasningsutførelse
      description: Kan fabrikken faktisk levere tilpassede konfigurasjoner? Kjøpere ser etter bevis på tidligere tilpassede prosjekter, prototypeprøver som vises, tekniske tegninger og muligheten til å diskutere tekniske modifikasjoner på stedet.
      icon: tabler:adjustments
    - title: Ledetid og kapasitet
      description: 'Er siterte tidslinjer realistiske? Kjøpere vurderer: nåværende produksjonsvolum, tilgjengelig kapasitet, arbeidsstyrkestørrelse, materiallagernivåer og om fabrikken har et produksjonsplanleggingssystem.'
      icon: tabler:clock
    - title: Pris og handelsbetingelser
      description: 'Er prisene gjennomsiktige? Er FOB-priser klare? Kjøpere bekrefter: enhetsprisfordeling, verktøykostnader, emballasjekostnader og om fabrikken kan håndtere DDP- eller CIF-vilkår med riktig eksportdokumentasjon.'
      icon: tabler:currency-dollar
    - title: Ettersalg og reservedeler
      description: 'Hva skjer etter levering? Kjøpere vurderer: tilgjengelighet av reservedeler, garantiprosess, erstatningsrørseksjoner, ventilbytte og om fabrikken har en dokumentert ettersalgsprotokoll.'
      icon: tabler:headset
content_tour:
  tagline: Fabrikkturrute
  title: Revisjonstur —<br />Hva du vil se
  subtitle: Vår standard fabrikkomvisning følger en definert rute designet for å svare på spørsmål fra kjøpere på hver stasjon.
  items:
    - title: 1. Møterom — Bedriftsintroduksjon
      description: Forretningslisens, ISO 9001 og BSCI-sertifikater, eksportlisenser og bedriftshistorie. Rask oversikt over produksjonsmuligheter og samsvarsomfang.
      icon: tabler:users
    - title: 2. Råvarelager — IQC-stasjon
      description: Inngående materialinspeksjonsposter, stoffbatch-sertifikater, lim og maskinvareprøver. Se hvordan materialer testes før du går i produksjon.
      icon: tabler:building-warehouse
    - title: 3. Rørfabrikasjon — RF-sveising og håndliming
      description: Sveising eller liming av rør, demonstrasjoner av sømstyrketesting og ventilinstallasjon. Observer kammer-for-kammer konstruksjon og kvalitetskontrollpunkter.
      icon: tabler:flame
    - title: 4. Skroglaminering — GRP-verksted
      description: Glassfiberoppleggingsprosess, gelcoatpåføring og skrogherding. Se lamineringsskjema og strukturell forsterkning for forskjellige RIB-modeller.
      icon: tabler:layers-subtract
    - title: 5. Montering og integrasjon
      description: Skrog-rørskjøting, installasjon av konsoll og sete, integrering av elektrisk og drivstoffsystem, og utstyrsmontering. Observer produksjonslinjen i drift.
      icon: tabler:tool
    - title: 6. Trykkteststasjon
      description: 24-48 timers trykkholdtest ved 1,25x nominelt trykk. Se testposter, trykkmålere og bestått/ikke bestått-kriterier. Se hvordan testresultater er knyttet til skrogets serienummer.
      icon: tabler:gauge
    - title: 7. Endelig inspeksjon og kvalitetskontroll
      description: 100-punkts kvalitetssjekkliste per enhet, dimensjonsbekreftelse, kosmetisk inspeksjon og sjekk av emballasjeintegritet. Gjennomgå avvikslogger og korrigerende handlingsposter.
      icon: tabler:clipboard-check
    - title: 8. Dokumentgjennomgangsrom
      description: Samsvarsdokumentasjon per modell (DoC, byggeskilt, brukerhåndbok), produksjonssporbarhetsposter, HIN-register og demonstrasjon av materialbatchsporingsdatabase.
      icon: tabler:folder
content_qc_chain:
  tagline: Kvalitetsbevis
  title: 8-trinns QC-kjede<br />— Verifiserbar ved hvert trinn
  subtitle: Kvalitetskontrollkjeden vår går fra innkommende materialer til endelig forsendelse, med dokumentert bevis på alle trinn.
  items:
    - title: 'Trinn 1: Inspeksjon av innkommende materiell'
      description: Hver batch av PVC, Hypalon, glassfiber, aluminium, lim og maskinvare testes mot spesifikasjoner før de går i produksjon. Strekkstyrke, beleggvedheft og dimensjonskontroll i henhold til AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Trinn 2: Rørsveising / liming QC'
      description: Testing av sømavskallingsstyrke per produksjonsparti. RF-sveiseparametere overvåket og registrert. Håndlimte sømmer sjekket for konsistent limdekning og herdetid.
      icon: tabler:flame
    - title: 'Trinn 3: Skroglaminering QC'
      description: Måling av gelcoattykkelse, verifisering av glassfiberopplegg i henhold til laminatplan og overvåking av herdetid. Strukturelle forsterkningsposisjoner verifisert mot tekniske tegninger.
      icon: tabler:layers-subtract
    - title: 'Trinn 4: Montering og integrering QC'
      description: Skrog-rørskjøts integritet, konsoll og setemonteringsmoment, elektrisk kontinuitet og lekkasjetest av drivstoffsystemet. Hvert installasjonspunkt verifisert mot den modellspesifikke monteringssjekklisten.
      icon: tabler:tool
    - title: 'Trinn 5: Trykkholdtest'
      description: Hvert oppblåsbare kammer satt under trykk til 1,25x klassifisert PSI og holdt i 24-48 timer. Trykkfall registrert per kammer. Bestått/ikke bestått terskel dokumentert. Koblet til skrogets serienummer.
      icon: tabler:gauge
    - title: 'Trinn 6: Sluttkontroll'
      description: 100-punkts kvalitetssjekkliste som dekker dimensjonsnøyaktighet, kosmetisk finish, kompletthet av tilbehør, dokumentasjonspakke og emballasjeintegritet. Uavhengig av produksjonsteamet.
      icon: tabler:clipboard-check
    - title: 'Trinn 7: Samsvarsdokumentasjon'
      description: Modellspesifikk DoC, byggeplateverifisering, fullstendighet av brukerhåndboken og HIN-registeroppføring. Alle samsvarsdokumenter utarbeidet og verifisert før forsendelsesfrigivelse.
      icon: tabler:file-certificate
    - title: 'Trinn 8: Frigivelse og sporbarhet for forsendelser'
      description: Den endelige utgivelsen krever at alle QC-stadier er bestått, samsvarsdokumentasjonen er fullstendig og fraktdokumentasjonen bekreftet. Skrogpost stengt og arkivert for 10+ års oppbevaring.
      icon: tabler:truck
content_traceability:
  tagline: Produksjonssporbarhet
  title: HIN → Hovedfil →<br />Skroget → Levering
  subtitle: Hver RIB-båt har et unikt skrogidentifikasjonsnummer knyttet til en komplett kjede for produksjon og samsvar.
  items:
    - title: Skrogidentifikasjonsnummer (HIN)
      description: 14-tegns unik identifikator permanent merket på hver båt. Koder produsentkode (MIC), modellbetegnelse, produksjonsår og serienummer. Nøkkelen som låser opp hele sporbarhetskjeden.
      icon: tabler:hash
    - title: Master teknisk fil
      description: Samsvars- og teknisk dokumentasjon for modellfamilien. Inneholder GA-tegninger, risikovurdering, stabilitetsberegninger, materialspesifikasjoner og gjeldende standarder. Koblet til alle skrog av den modellen.
      icon: tabler:folder
    - title: Individuell skrogrekord
      description: 'Produksjonsrekord per skrog: HIN, produksjonsdato, rørbatch, materialsertifikater, trykktestresultat, endelig konfigurasjon, motorspesifikasjon, kvalitetssjekklisteresultater og leveringsdestinasjon. 21+ datafelt per skrog.'
      icon: tabler:file-description
    - title: Kundeoverholdelsespakke
      description: Leveringspakke per skrog inkludert DoC, byggeplatefoto, brukerhåndbok, sjekkliste for samsvar og endelig konfigurasjonsark. Sendt med båten og arkivert på fabrikken i 10+ år.
      icon: tabler:package
content_red_flags:
  tagline: Revisjonsfallgruver
  title: Kjøpere med røde flagg<br />Sett enkelt
  subtitle: Vanlige problemer som undergraver kjøpers tillit under fabrikkrevisjoner. Vi henvender oss proaktivt til hver enkelt.
  items:
    - title: Teppe CE-krav uten modellomfang
      description: '"Alle produkter CE-sertifisert" uten å spesifisere hvilket direktiv, hvilke modeller og hvilken samsvarsmodul. Rødt flagg: antyder at samsvar er overfladisk i stedet for per modell, per konfigurasjon.'
      icon: tabler:alert-triangle
    - title: Ingen bevis for fysisk testing
      description: 'Trykktestkrav uten testregistreringer, målere eller teststasjon synlig på fabrikkgulvet. Rødt flagg: kvalitetskrav kan ikke verifiseres under besøket.'
      icon: tabler:alert-triangle
    - title: Manglende materialsporbarhet
      description: 'Ingen batch-oppføringer, ingen innkommende inspeksjon, eller ingen kobling mellom materialsertifikater og ferdige produkter. Rødt flagg: ingen måte å spore kvalitetsproblemer til kilden.'
      icon: tabler:alert-triangle
    - title: Generisk dokumentasjon
      description: 'Én DoC som dekker alle modeller, ingen HIN-spesifikke poster eller "mal"-samsvarsdokumenter. Rødt flagg: samsvar er ikke knyttet til individuelle produksjonsenheter.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Frakt og emballasje
  title: Containerlasting og emballering<br />av RIB-båter
  subtitle: Våre fraktløsninger beskytter investeringen din fra Qingdao til destinasjonshavnen. Containerlasteplaner og emballasjespesifikasjoner tilgjengelige for hver modell.
  items:
    - title: 20-fots containerkonfigurasjoner
      description: 'Standard 20-fots container: 1-2 RIB-båter (4,0-5,5 m) nøstet med dekk og rør adskilt, eller 8-12 SUP-brett. Blandede RIB + SUP-konfigurasjoner tilgjengelige. Detaljert lasteplan ved hver bestilling.'
      icon: tabler:box
    - title: 40-fots containerkonfigurasjoner
      description: 'Standard 40-fots container: 2-4 RIB-båter (opptil 7,0 m) med nøstede skrog og stablede rør, eller 20-30 SUP-brett. 40-fots HQ tilgjengelig for høyere RIB-modeller. Volumoptimert emballasje reduserer fraktkostnaden per enhet.'
      icon: tabler:container
    - title: Treemballasje for RIB-skrog
      description: Aluminium- og GRP-skrog pakket i skreddersydde trekasser med skumfylling, fuktbarriere og stålbånding. Kassedimensjoner og vekt per modell tilgjengelig for logistisk planlegging. ISPM-15-sertifisering av varmebehandlet trevirke inkludert.
      icon: tabler:wood
    - title: Emballering med adskilte rør og dekk
      description: Rør tømt og brettet separat fra skrogene for plassbesparelse. Dekksplater, konsoller og seter pakket i beskyttende folie med monteringsbeslagskit. Monteringsinstruksjoner inkludert ved hver forsendelse.
      icon: tabler:package
    - title: Beskyttelse mot fukt og korrosjon
      description: VCI-antikorrusjonspapir for aluminiumskomponenter, silikagel-tørkeposer og vakuumforseglede beslagsposer. Forhindrer kondensskader under 30-45 dagers sjøtransport.
      icon: tabler:droplet-off
    - title: FOB Qingdao-dokumentasjon
      description: Konnossement, kommersiell faktura, pakkeliste, opprinnelsessertifikat og samsvarsdokumentasjon per forsendelse. FCL- og LCL-konsolidering tilgjengelig. Støtte med tolldokumentasjon for EU-, USA- og Midtøsten-markeder.
      icon: tabler:file-text
faq:
  title: Fabrikkrevisjon – ofte stilte spørsmål
  questions:
    - q: Kan jeg besøke fabrikken personlig?
      a: Ja. Vi ønsker velkommen til fabrikkrevisjoner på stedet ved vårt 12 000 m² store Qingdao-anlegg. Vår standardtur dekker 8 stasjoner fra råvarelager til dokumentgjennomgang. Virtuelle fabrikkomvisninger via videosamtale er også tilgjengelige for innledende kvalifisering.
    - q: Godtar du tredjepartsrevisjoner (BSCI, SMETA, SGS)?
      a: Ja. Vi opprettholder BSCI-sertifisering (Intertek) og ønsker kundespesifikke revisjonsprotokoller velkommen. Vi kan også arrangere SGS eller TÜV inspeksjoner på forespørsel. Revisjonsrapporter er tilgjengelige under NDA.
    - q: Kan jeg se trykktesting under besøket?
      a: Vår trykkteststasjon er en del av standard turrute. Avhengig av produksjonsplanen kan du observere aktive trykktester med måleravlesninger og testregistreringer. Trykktestlogger per skrog er alltid tilgjengelig for gjennomgang.
    - q: Hvordan håndterer du produkter som ikke er i samsvar?
      a: Avvikende enheter er adskilt, dokumentert og gjennomgått i henhold til ISO 9001-prosessen for korrigerende tiltak. Rotårsaksanalyse utføres, korrigerende handlinger implementeres og journaler opprettholdes. Kjøpere kan gjennomgå vår NCR-logg under revisjoner.
    - q: Hvilken samsvarsdokumentasjon er tilgjengelig for gjennomgang?
      a: 'Under revisjonen kan du gjennomgå: modellspesifikke DoC-prøver, byggeplatespesifikasjoner, HIN-register, utkast til brukerhåndbok, gjeldende standardlister og samsvarsvurderingsposter per modellfamilie.'
    - q: Hvordan bestiller jeg en virtuell fabrikkomvisning?
      a: Kontakt salgsteamet vårt for å planlegge en live videotur via WhatsApp, Zoom eller Teams. Vi følger samme 8-stasjonsrute og kan fokusere på spesifikke områder basert på dine interesser. Typisk virtuell tur er 45-60 minutter.
    - q: Er fabrikken den faktiske produsenten eller et handelsselskap?
      a: Aquafarer er den faktiske produsenten. Vi driver fabrikken i Laixi, Qingdao. Virksomhetslisens, produksjonsomfang og fysisk produksjon er alle verifiserbare under tilsynet.
    - q: Hvilke kvalitetsposter kan jeg gjennomgå?
      a: Inspeksjonsposter for innkommende materiale, QC-kontrollpunkter i prosessen, trykktestlogger, 100-punkts siste inspeksjonssjekklister, avviksrapporter, registreringer av korrigerende handlinger og sporbarhetsregistreringer per skrog. Alt vedlikeholdes i henhold til ISO 9001-kravene.
