testimonial:
  content: Vi startet med Club Starter Package for surfeskolen vår i Portugal. 20 brett, årer, vester — alt kom innen 3 uker. Etter to sesonger oppgraderte vi til Pro-pakken. Den tilpassede merkevarebyggingen med logoen vår var en game-changer for vårt profesjonelle image.
  name: Ricardo Santos
  title: Eier, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Klubbprofiler
  title: Løsninger for vannsportklubber<br />Etter klubbtype
  subtitle: Fra universitetspadleklubber til eksklusive private yachtklubber - hver type klubb har unike utstyrsbehov, bruksmønstre og budsjettstrukturer. Vi skreddersyr hver pakke for å matche klubbmodellen.
  items:
    - title: Padleklubber for universiteter og høyskoler
      subtitle: Studentflåter med høy bruk
      description: Studentdrevne eller institusjonsstøttede padleklubber som driver SUP- og kajakkprogrammer for universitetets rekreasjonsavdelinger. Utstyr står overfor høyfrekvent bruk med høy omsetning på tvers av flere ferdighetsnivåer hvert semester. Holdbarhet og enkel reparerbarhet er avgjørende, sammen med budsjettvennlige priser for studentorganisasjoner.
      features:
        - 'Ekstra holdbar PVC-konstruksjon dimensjonert for studentbruk'
        - 'Fargekodede brettserier etter nivå for enkel flåteforvaltning'
        - 'Reparasjonskit + videostøtte på anrop inkludert i hver bestilling'
        - 'Rabatterte priser for studentorganisasjoner og semesterbasert betaling'
    - title: Felles padle & sosiale klubber
      subtitle: Medlemsdrevne fritidsklubber
      description: Fellesbaserte klubber som tilbyr SUP, kajakk og sosiale padleopplevelser til medlemmene. Utstyr må balansere ytelse og komfort for et bredt aldersspekter, med merkevarebygging som fremmer klubbidentitet og medlemsstolthet. Lagringseffektivitet er nøkkelen for klubber som opererer fra begrenset tilgang til vannkanten.
      features:
        - 'Blandet flåte: allround-SUP-er, turbrett og fritidskajakker'
        - 'Full klubprofil: egne farger, logotrykk, merkede redningsvester'
        - 'Kompakte lagringsløsninger for oppblåsbart utstyr'
        - 'Startpakke for medlemsvekst: anbefalingskort, fotografering i klubbprofil'
    - title: Surfeskoler og surfekajakkakademier
      subtitle: Kystprestasjon og coaching
      description: Surfefokuserte skoler som lærer SUP-surfing, surfekajakk og bølgeridning. Utstyret må fungere under surfeforhold – manøvrerbart, responsivt og holdbart nok til å håndtere gjentatte utslettinger, sandslitasje og saltvannseksponering uten rask nedbrytning.
      features:
        - 'Kortere, bredere SUP-former optimalisert for manøvrering i surf'
        - 'Forsterket rails-konstruksjon for støtmotstand i bølger'
        - 'Surf-spesifikt sikkerhetsutstyr: spiralleds, myke finner som alternativ'
        - 'Flåtebytteprogram med sesongrabatter ved innbytte'
    - title: Bedrifts- og private yachtklubber
      subtitle: Premium medlemsopplevelser
      description: Eksklusive private klubber som tilbyr vannsport som et førsteklasses tilbud for medlemmene. Utstyrsstandardene er høye - estetikk, merkevaretilpasning og gjesteklar presentasjon er like viktig som ytelse. Serviceforventninger inkluderer levering av hvite hansker, tilpassede lagringsløsninger og support på concierge-nivå.
      features:
        - 'Brett med premiumfinish i EVA med treåremønster og metalliske detaljer'
        - 'Egen fargematching i tråd med klubbens merkevarelinjer'
        - 'Concierge-levering: oppblåst, klargjort og merket for hver sesong'
        - 'Dedikert kundeansvarlig med prioritert respons-SLA'
