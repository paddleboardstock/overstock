hero:
  tagline: Vannsportklubber
  title: Utstyr og løsninger<br />For padleklubber og treningssentre
  subtitle: Komplette utstyrspakker, instruktørutstyr, merkevarebygging og vedlikeholdsstøtte for SUP-klubber, kajakkklubber, surfeskoler og treningssentre for vannsport av alle størrelser.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP-brett for vannsportklubber og utleieflåter
direct_answer: Paddle Board Overstock leverer ende-til-ende utstyrsløsninger for vannsportklubber og treningssentre over hele verden. Klubbpakkene våre inkluderer SUP-brett, kajakker, padler, pumper, reparasjonssett og sikkerhetsutstyr til konkurransedyktige engrospriser med lave MOQer. Hver pakke kan tilpasses med klubblogoer, merkefarger og personlig emballasje. Vi tilbyr også vedlikeholdstrening, reservedelsstøtte og utstyrsrotasjonsprogrammer for å maksimere levetiden til flåten din.
solution_offerings:
  - title: Klubb startpakke
    subtitle: For nye klubber med 10–30 medlemmer
    badge: Best Seller
    features:
      - title: Kjerneutstyr
        description: 10–30 SUP-brett eller kajakker med matchende padler, pumper og reparasjonssett
      - title: Sikkerhetsutstyr
        description: Redningsvester, fløyte, båndsett i klubbfarger for hvert brett
      - title: Instruktør utstyr
        description: Trenerspesifikke brett med sklisikre dekk og ekstra stabilitet
      - title: Merkevarepakke
        description: Tilpasset logoutskrift på brett, padleårer og emballasje
      - title: Opplæringsmateriell
        description: Veiledninger for nybegynnere, sikkerhetsprotokoller og vedlikeholdssjekklister
    cta_text: 'Bygg klubbpakken min'
    cta_href: /contact
  - title: Club Premium-pakke
    subtitle: For etablerte klubber og operatører med flere lokasjoner
    badge: Professional
    features:
      - title: Full flåte
        description: 30–100 blandet flåte av SUP-er, kajakker og tilbehør
      - title: Avansert sikkerhetssystem
        description: Sporing av RFID-utstyr, skaderapporteringsapp, sikkerhetsskilting
      - title: Personalopplæring
        description: Verksted for instruktørsertifisering og vedlikehold av utstyr på stedet
      - title: Markedsføringsstøtte
        description: Profesjonell fotografering, brosjyrer og maler for sosiale medier
      - title: Erstatningsprogram
        description: Årlig utstyrsoppdatering til rabatterte priser med innbyttemuligheter
    cta_text: 'Skaler opp klubben min'
    cta_href: /contact
