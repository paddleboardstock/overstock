values:
  - title: Kvalitet først
    desc: Hver båt som forlater fabrikken vår, gjennomgår obligatorisk trykktesting, sømstyrketesting og systemtesting før forsendelse.
  - title: Vertikal integrasjon
    desc: Vi kontrollerer hvert trinn — fra PVC-skjæring til sluttmontering — og eliminerer underleverandørineffektivitet og sikrer jevn kvalitet.
  - title: Sikkerhet som standard
    desc: CE-sertifisering er kjernen i det vi bygger. Våre 64 CE-sertifiserte modeller oppfyller EUs sikkerhetsstandarder for fritids- og kommersiell bruk.
  - title: Partnerfokusert
    desc: Vi bygger langsiktige relasjoner med OEM-, ODM- og private label-partnere gjennom åpenhet, pålitelighet og felles utvikling.

services:
  - title: OEM-produksjon
    desc: Vi produserer etter dine spesifikasjoner. Del tegningene dine, så tar ingeniørteamet vårt seg av prototyping, verktøy og produksjon.
  - title: ODM-løsninger
    desc: Start med våre dokumenterte designplattformer. Tilpass størrelse, farge, grafikk og emballasje for å skape en unik produktlinje.
  - title: Private Label
    desc: Ditt merke, din logo, din emballasje. Produktene ankommer klare for salg med full merkevareintegrering.
  - title: Tilpasset merkevarebygging
    desc: Dekketrykk, skrog-grafikk, tube-klistremerker og tilpassede etiketter — en helhetlig merkevare til stede på hver overflate.

certifications:
  - name: CE-sertifikat
    desc: Våre båter og fartøy er i samsvar med EU-direktivet for fritidsfartøy (2013/53/EU) og relevante harmoniserte standarder.
    scope: Båter og fartøy
  - name:
    desc: Kvalitetsstyringssystem sertifisert ISO 9001 for design, produksjon og distribusjon av oppblåsbare fritidsfartøy.
    scope: Hele anlegget
  - name:
    desc: Oppblåsbare båter — sikkerhets- og ytelseskrav for forsterkede og stive oppblåsbare båter.
    scope: RIB- og oppblåsbare linjer

