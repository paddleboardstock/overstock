philosophy:
  tagline: Designfilosofi
  title: 'Ingeniørdrevet design<br />— hver detalj teller'
  subtitle: 'Ingeniørfilosofien vår bygger på tre prinsipper som styrer hvert produkt vi bygger.'
  list:
    - 'Pålitelighet først: Hvert Aquafarer-produkt testes for å tåle reelle forhold — fra redningsoperasjoner i kaldt vann til utleie på tropiske resorter. Vi bygger med god margin der det betyr mest.'
    - 'Produksjonspresisjon: Anleggene våre bruker CNC-kutting, høyfrekvenssveising og automatiserte trykktester. Hver søm, hver ventil, hver kobling oppfyller dokumenterte spesifikasjoner.'
    - 'Kontinuerlig innovasjon: FoU-teamet vårt evaluerer kontinuerlig nye materialer, produksjonsmetoder og designforbedringer. Vi venter ikke på problemer — vi foregriper dem.'
cta:
  title: 'Vil du diskutere et prosjekt med teamet vårt?'
  subtitle: 'Ingeniørene våre er klare til å gi råd om produktvalg, tilpasning og OEM/ODM-partnerskap.'
  actions:
    - variant: primary
      text: Kontakt teamet vårt
      href: /contact
    - text: Se produktene våre
      href: /products
