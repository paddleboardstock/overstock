hero:
  tagline: Teamet vårt
  title: 'Menneskene bak Aquafarer<br />— ingeniørkunst for frihet på vannet'
  subtitle: 'Grunnlagt i 2012 i Qingdao i Kina ble Aquafarer bygget opp av maritime ingeniører, materialforskere og vannsportsentusiaster som trodde på å gjøre profesjonelle oppblåsbare vannsportsfartøy tilgjengelige over hele verden.'
  image:
    src: /images/team-all.webp
    alt: Gruppebilde av hele Aquafarer-teamet — ingeniørarbeid, produksjon og ledelse
founding:
  tagline: Grunnleggelsen
  title: 'Fra et verksted på kysten<br />til et anlegg på 12,000 m²'
  subtitle: 'Aquafarer ble grunnlagt av et team marineingeniører med tiår av samlet erfaring innen design av oppblåsbare båter, PVC/Hypalon-fabrikasjon og global produksjon av marint utstyr.'
  items:
    - title: "Grunnlagt: 2012"
      description: 'Etablert i Qingdao i Kina — et stort maritimt knutepunkt med dyp skipsbyggingstradisjon.'
      icon: tabler:calendar
    - title: 200-300 ansatte
      description: 'Inkludert 50+ FoU-ingeniører, kvalitetsspesialister og produksjonsteknikere.'
      icon: tabler:users
    - title: Anlegg på 12,000 m²
      description: 'Egen fabrikk med 6 produksjonslinjer for RIB-båter, oppblåsbare båter og SUP-brett.'
      icon: tabler:building-factory
    - title: 'Mer enn 50 land'
      description: 'Eksport til Europa, Amerika, Midtøsten, Asia-Stillehavsregionen og Afrika.'
      icon: tabler:globe
