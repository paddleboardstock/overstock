hero:
  tagline: Matrise for industriløsninger
  title: Scenariobaserte marine løsninger<br />For profesjonell drift
  subtitle: Formålskonstruerte oppblåsbare vannscootere og RIB-er konfigurert for redning, utleieflåte, yacht-anbud og kommersielle fiskeapplikasjoner – hver støttet av tekniske spesifikasjoner og tilpasningsmuligheter.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer profesjonelle marine løsninger for ulike bransjer
direct_answer: 'Aquafarer leverer scenario-konstruerte oppblåsbare vannscootere og RIB-løsninger for kommersielle marine operasjoner: rednings- og patruljebåter med forsterkede Hypalon-rør og flerkammersikkerhet, utleieflåte-SUP-er og kajakker med 1,2 mm PVC og varmluftsveisede sømmer for holdbarhet med lavt vedlikehold, luksus- og luksurv-skrog, R. kraftige fiskekonfigurasjoner med stangholdere og livebrønnsystemer.'
solution_a:
  tagline: Løsning A
  title: Marine Rescue &<br />Kommersiell patrulje
  subtitle: Høyhastighets sikkerhets-RIB-er med flere kammer for profesjonell beredskap og politioperasjoner.
  badge: Heavy-Duty Series
  description: Våre marine rednings- og patrulje-RIB-er er konstruert med forsterkede Hypalon/PVC-luftrør med høy tetthet med flerkammeruavhengig flytedesign. Hvert fartøy er utstyrt med reflekterende tape av profesjonell kvalitet, redningsgrep og hurtigoppblåsingsventiler for utplasseringsberedskap. Deep-V glassfiberskrog gir eksepsjonell stabilitet ved høye hastigheter og under røffe sjøforhold.
  features:
    - title: Flerkammersikkerhet
      description: 4–6 uavhengige luftkamre – enhver punktering av enkeltkammer opprettholder positiv flotasjon
    - title: Forsterket rørstoff
      description: 1,2 mm Hypalon CSM eller 1.680 DTEX PVC med dobbeltlags varmluftsveisede sømmer
    - title: Profesjonell karakter
      description: SOLAS reflekterende tape, redningsliner, slepeklosser, hurtigutløsende malerlinje
    - title: Høyhastighets skrog
      description: Deep-V glassfiber eller aluminiumsskrog vurdert til 25–45 knop avhengig av konfigurasjon
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Skrogmateriale
      value: Glassfiber / Marine-grade aluminium
    - label: Tube stoff
      value: 1,2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Maks hastighet
      value: 25–45 knop
    - label: Kapasitet
      value: 6–12 personer
    - label: Motorutvalg
      value: 40–200 HK
    - label: Sertifisering
      value: CE / ISO 9001
solution_b:
  tagline: Løsning B
  title: Utleie av vannsport og<br />utstyr for ferieanleggsflåte
  subtitle: Ultra-holdbare oppblåsbare SUP-er, kajakker og båter som krever lite vedlikehold, bygget for daglig leiebruk på feriesteder, klubber og turoperasjoner.
  badge: Rental-Grade
  description: Vårt leie av flåteutstyr er konstruert for høyeste holdbarhet og laveste vedlikeholdskostnad. Vi bruker 1,2 mm forsterket PVC med trelags varmluftsveisede sømteknologi som motstår UV-nedbrytning og hyppige kollisjonsskader. Drop-stitch-konstruksjon sikrer at platene opprettholder stivheten selv etter hundrevis av leiesykluser. Alle modellene har forsterkede D-ringer, slitasjebestandige skinnebånd og ventiler av kommersiell kvalitet.
  features:
    - title: PVC av kommersiell kvalitet
      description: 1,2 mm forsterket PVC med UV-stabilisatorer — 3 ganger tykkere enn materialer av forbrukerkvalitet
    - title: Varmluftsveisede sømmer
      description: Trelags smeltesveising — sterkere enn limbinding, motstår delaminering
    - title: Drop-Stitch-stivhet
      description: 1680 DTEX-kjerne med 2 gjenger/sq in — vurdert til 20 PSI for hardboard-lignende stivhet
    - title: Flåteklar design
      description: Forsterkede D-ringer, kommersielle Halkey-Roberts ventiler, slitasjebestandige skinnebånd
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Rørmateriale
      value: 1,0–1,2 mm Forsterket PVC
    - label: Sømteknologi
      value: Trelags varmluftsveising
    - label: Maks trykk
      value: 15–20 PSI (drop-stitch-modeller)
    - label: UV-motstand
      value: 1000+ timers akselerert testing
    - label: Garanti
      value: 2–5 år avhengig av modell
    - label: Vedlikehold
      value: Minimal - skyll og oppbevar
solution_c:
  tagline: Løsning C
  title: Yachtanbud og<br />luksusvannskutere
  subtitle: Lette, høyytelses RIB-tender designet for superyachtlagring og gjestetransport med luksuriøs passform og finish.
  badge: Premium Series
  description: Våre yacht tender RIB-er kombinerer lett konstruksjon med luksuriøs estetikk. Deep-V aluminium eller glassfiberskrog gir eksepsjonell kjørekvalitet og enkelt davitløfting. tilgjengelig med fargetilpasset rørgrafikk, førsteklasses møbeltrekk og tilpassede konsolloppsett. Kompakte lagringsdimensjoner gjør dem ideelle for superyachtgarasjer og dekklagring.
  features:
    - title: Lett konstruksjon
      description: Marine-grade aluminiumsskrog reduserer vekten med 30 % sammenlignet med glassfiber for enkel løfting
    - title: Deep-V ytelse
      description: 18–22 graders deadrise skrog for jevn tur i hakk og utmerket sporing
    - title: Luksus passform og finish
      description: Tilpasset møbeltrekk, fargetilpassede rør, førsteklasses styrekonsoll, rustfri pakke
    - title: Kompakt oppbevaring
      description: Designet for superyachtgarasjer – oppblåsbare rør for kompakt oppbevaring
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Skrogtype
      value: Deep-V Aluminium / Glassfiber
    - label: Dødoppgang
      value: 18–22 grader
    - label: Maks hastighet
      value: 30–40 knop
    - label: Tørr vekt
      value: 120–350 kg (aluminiumsskrog)
    - label: Davit Lift klar
      value: Ja – standard løftepunkter
    - label: Lagring
      value: Utblåsbare rør, stables
cta:
  title: Ikke sikker på hvilken løsning som passer din operasjon?
  subtitle: Beskriv applikasjonen, driftsmiljøet og volumkravene dine. Vårt team vil anbefale den optimale konfigurasjonen innen 48 timer.
  actions:
    - variant: primary
      text: Få en løsningsanbefaling
      href: /contact
    - text: Se alle marine produkter
