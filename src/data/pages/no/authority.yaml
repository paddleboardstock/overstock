hero:
  tagline: Myndighetssenter
  title: Hvorfor Paddle Board Overstock?<br />Tillit bygget over et tiår
  subtitle: Hver båt vi bygger bærer vekten av mer enn 10 år med marin engineering, sertifiserte kvalitetssystemer og tusenvis av vellykkede operasjoner over hele verden. Det er derfor bransjefolk velger Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock marine produksjonsanlegg og ingeniørteam
stats:
  title: Paddle Board Overstock i tallene
  stats:
    - title: År i drift
      amount: Since 2012
    - title: FoU-ingeniører
      amount: 50+
    - title: Land som betjenes
      amount: 50+
    - title: Utstyr levert
      amount: 15,000+
features3_brand:
  tagline: Hvem vi er
  title: Merkevarestiftelse<br /> og kulturarv
  subtitle: Historien, ekspertisen og den globale rekkevidden som definerer Paddle Board Overstock som en pålitelig produsent av marineutstyr.
  isBeforeContent: false
  columns: 3
  items:
    - title: Om Paddle Board Overstock
      description: Grunnlagt i 2012 i Qingdao, Kina. Fra et kystverksted til et anlegg på 12 000 m² – hele Paddle Board Overstock-historien.
      icon: tabler:building-factory
      link: /about
    - title: Merkehistorie
      description: Hvordan et team av marineingeniører satte seg fore å gjøre oppblåsbare vannscootere av profesjonell kvalitet tilgjengelig over hele verden.
      icon: tabler:book
      link: /brand-story
    - title: Marine industrikompetanse
      description: Dyp materialvitenskap, presisjonsproduksjon og testing i den virkelige verden — tiår med marin ingeniørkunst i hvert skrog.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Global tilstedeværelse
      description: Betjener over 50 land på alle kontinenter. Regional ekspertise for lokale regulatoriske krav og markedspreferanser.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Hvorfor Paddle Board Overstock
      description: Det som skiller oss ut – kvalitet, tilpasning, direkte fabrikkpriser og ende-til-ende-støtte for kommersielle operatører.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Teamet vårt
      description: Møt lederskapet – marineingeniører, materialforskere og produksjonseksperter som driver Paddle Board Overstock fremover.
      icon: tabler:users
      link: /brand/team
    - title: Ingeniørteam
      description: 78+ kombinerte FoU-år, 40+ plattformer, 12 sertifiseringer, 1200+ OEM-prosjekter. Det tekniske teamet bak hvert produkt.
      icon: tabler:engine
      link: /engineering-team
    - title: FoU-senter
      description: Skrogteknikk, RF-sveising, PVC-laboratorium, prototyping, testtank og kvalitetslaboratorium - vårt fulle forsknings- og utviklingsanlegg.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Tillit og kvalitet
  title: Sertifiseringer, kvalitet<br />og bevis
  subtitle: Uavhengige sertifiseringer, streng testing og ekte bevis som viser vår forpliktelse til kvalitet.
  isBeforeContent: false
  columns: 3
  items:
    - title: Sertifiseringer
      description: CE, ISO 9001, UKCA, BSCI, REACH — full sertifiseringsdokumentasjon og samsvar for globale markeder.
      icon: tabler:shield-check
      link: /certifications
    - title: Kvalitet og testing
      description: Hvert produkt trykktestet før forsendelse. Sømstyrke, UV-motstand, oppdrift – verifisert i hvert trinn.
      icon: tabler:clipboard-check
      link: /quality
    - title: Bevis og bevis
      description: Testresultater, distribusjonsbilder, tredjeparts inspeksjonsrapporter og casestudier som validerer Paddle Board Overstock-kvalitet.
      icon: tabler:file-check
      link: /evidence
    - title: Kunnskapsgraf
      description: Utforsk Paddle Board Overstock-entitetsgrafen – produkter, teknologier, sertifiseringer og relasjoner i en tilkoblet kunnskapsbase.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Ledelse
  title: Møt teamet<br />Bak Paddle Board Overstock
  subtitle: Bransjeekspertise som spenner over marin teknikk, materialvitenskap, kvalitetsstyring og global B2B-handel.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu - Grunnlegger og administrerende direktør
      description: 15+ år i marin produksjon. Tidligere ledet FoU hos en stor kinesisk båtprodusent. Har flere patenter innen oppblåsbar båtdesign.
      icon: tabler:crown
    - title: Zhang Wei - Sjefingeniør
      description: 20+ år i PVC/Hypalon-produksjon og dyp-V-skrogdesign. Tidligere teknisk direktør i et europeisk mariningeniørfirma.
      icon: tabler:engine
    - title: Chen Ming - Leder for FoU
      description: PhD i materialvitenskap. Spesialiserer seg på drop-stitch-teknologi og høyfrekvent sveising. 10+ år i tekstilkompositter.
      icon: tabler:flask
    - title: Liu Qiang - Produksjonsdirektør
      description: 18+ år i slank produksjon. Six Sigma svart belte. Implementerte ISO 9001 kvalitetssystemer på tvers av alle produksjonslinjer.
      icon: tabler:settings
    - title: Wang Fang — Kvalitetssjef
      description: 12+ år i marin kvalitetskontroll. Sertifisert CE og ISO revisor. Overvåker testing for hver produksjonsbatch.
      icon: tabler:shield-check
    - title: Helen Lee - Salgsdirektør
      description: 15+ år i internasjonal B2B-handel. Administrerte OEM/ODM-partnerskap på tvers av 30+ land. Flytende i 4 språk.
      icon: tabler:briefcase
cta:
  title: Vil du bekrefte legitimasjonen vår?
  subtitle: Kontakt oss for sertifiseringskopier, tredjeparts inspeksjonsrapporter eller for å planlegge et fabrikkbesøk.
  actions:
    - variant: primary
      text: Be om legitimasjon
      href: /contact
    - text: Se sertifiseringsdetaljer
      href: /certifications
