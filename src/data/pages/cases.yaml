features3_cases:
  tagline: Featured Cases
  title: 'Custom Solutions<br />For Real Challenges'
  isBeforeContent: false
  columns: 3
  items:
    - title: 'Bali Diving Center Daily Operations Upgrade'
      customer: Blue Ocean Diving Center
      country: Indonesia
      industry: Commercial Diving Center
      challenge: 'Blue Ocean Diving Center in Bali operated an older fiberglass dive boat with limited deck space, difficult diver boarding, and high maintenance in tropical saltwater conditions. Equipment loading was crowded, preparation time was long, and the unstable platform created safety concerns for international tourists — including first-time divers and older travelers. The center runs 3-5 diving trips daily, 200+ days per year.'
      solution: 'Aquafarer supplied a custom 6.8m Professional Diving RIB with expanded deck layout optimized for scuba equipment storage, wide stainless steel dive ladder, heavy-duty Hypalon tubes for UV and saltwater resistance, non-slip deck surface, and tank storage solution. The configuration was designed around the diving center daily workflow — not based on a standard recreational boat layout.'
      product: '6.8m Professional Diving RIB'
      results: 'Larger working area improved equipment preparation efficiency. Divers experienced safer and easier boarding. Maintenance requirements reduced significantly. The center gained capacity to handle more customers during peak season with greater confidence. The RIB became the foundation of daily diving operations.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp'
      quote: 'Our diving boat is not only transportation. It is the foundation of our daily operation. Aquafarer RIB gives our team more confidence when running multiple diving trips every day.'
      icon: tabler:lifebuoy
    - title: 'Phuket Dive Center Professional RIB Upgrade'
      customer: Ocean Explorer Diving Center
      country: Thailand
      industry: Commercial Diving Center
      challenge: 'Ocean Explorer Diving Center in Phuket, Thailand, needed to upgrade from a traditional fiberglass dive boat that could not keep up with growing customer demand. Limited deck space made equipment preparation inefficient. Difficult boarding created safety challenges for international tourists. High maintenance requirements in tropical saltwater conditions increased operational costs. The center operates multiple daily trips, 200+ days per year.'
      solution: 'Aquafarer delivered a customized 6.8m Commercial Diving RIB with optimized working deck layout for scuba tank storage, equipment preparation, and diver movement. Features included wide diving ladder with stainless steel handrails, heavy-duty tube construction with UV-resistant materials, non-slip flooring, tank storage solution, professional console, and passenger seating — all configured for commercial diving operations.'
      product: '6.8m Commercial Diving RIB'
      results: 'Larger deck area enabled faster equipment organization and more efficient daily workflow. Customer boarding comfort and safety improved significantly. Maintenance downtime decreased with marine-grade construction. The diving center could serve more customers during peak season and expand professional diving services with confidence.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp'
      quote: 'For a diving center, the boat is not just transportation. It is an important part of our daily operation. Aquafarer RIB gives our team confidence to run multiple diving trips every day with better safety and efficiency.'
      icon: tabler:lifebuoy
    - title: European Diving Center Fleet
      customer: BlueMed Diving Centers
      country: Greece
      industry: Diving & Marine Tourism
      challenge: 'Required 12 dive-configured RIBs for a chain of diving centers across multiple Greek islands. Each boat needed custom dive ladder, tank storage for 8 tanks, and stable platform for open-water diver entry. Fleet needed to arrive within 60 days for the start of tourist season.'
      solution: 'Produced 12 RIB 520 Dive models with integrated tank racks, dive ladders, and extra-wide Hypalon tubes for boarding stability. Each boat was branded with the customer fleet livery. All 12 boats pressure-tested and shipped from Qingdao within 55 days.'
      product: RIB 520 Dive
      results: 'All 12 boats delivered on time for the tourist season. Fleet has been in daily operation for 18+ months with zero material failures. Customer ordered 6 additional units in year two.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp'
      quote: 'The RIB 520 Dive has been the backbone of our daily diving operations. Stability at rest is excellent, and the tank storage layout keeps the deck clean and safe for our guests.'
      icon: tabler:lifebuoy
    - title: Australian Distributor OEM Program
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: OEM/ODM Manufacturing
      challenge: 'Australian distributor needed a private-label SUP board range at competitive pricing to compete with Chinese direct-to-consumer brands. Required 8 unique models covering beginner through advanced, with custom graphics, custom packaging, and drop-ship fulfillment to retail outlets.'
      solution: 'Developed 8 SUP models (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) with exclusive Australian graphics package. Custom retail packaging with QR codes linking to setup videos. Drop-ship logistics configured from Qingdao direct to Australian retail stores.'
      product: Custom SUP Line (8 models)
      results: 'Concept to first shipment in 90 days. Retail sell-through rate of 85% in first season. Distributor expanded partnership to include inflatable boat line in year two.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp'
      quote: 'Aquafarer delivered a complete SUP line in 90 days — from initial design to retail floor. The quality matches brands selling at twice the price point.'
      icon: tabler:arrows-exchange
    - title: Middle East Rescue Boat Supply
      customer: National Civil Defense Authority
      country: United Arab Emirates
      industry: Search & Rescue
      challenge: 'Civil defense organization needed 20 patrol-ready RIBs for coastal search and rescue, port security, and flood response. Required self-bailing decks, full navigation suites (GPS, radar, VHF), high-visibility orange tubes, and compliance with local maritime regulations.'
      solution: 'Supplied 20 RIB 450 Patrol models with self-bailing decks, Garmin navigation suites, LED searchlights, SOLAS reflective tape, and high-visibility orange Hypalon tubes. Each boat was CE-certified and tested to ISO 6185 standards. Documentation package included compliance certificates for local registration.'
      product: RIB 450 Patrol
      results: 'Fleet deployed across 5 coastal stations. Boats have been operating in extreme heat (45°C+) with no tube degradation. Patrol range and fuel efficiency exceeded specifications by 12%.'
      image: 'https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp'
      quote: 'The RIB 450 Patrol exceeded our operational requirements. In extreme heat conditions, the Hypalon tubes show no signs of UV degradation after 24 months of daily use.'
      icon: tabler:alert-triangle
    - title: European OEM Brand Partnership
      customer: North Sea Marine Equipment BV
      country: Netherlands
      industry: OEM/ODM Manufacturing
      challenge: 'Established European marine brand wanted to expand into the RIB market without investing in manufacturing facilities. Needed a white-label partner capable of producing 5 RIB models (3.9m to 6.2m) with private branding, CE certification, and exclusive EU distribution rights.'
      solution: 'Established white-label manufacturing agreement for 5 RIB models. Each model branded with customer logos and color scheme. CE certification documentation prepared for each model. Exclusive EU distribution rights granted with minimum order commitments. Technical documentation and spare parts catalog provided for local service network.'
      product: Custom RIB Line (5 models)
      results: 'Multi-year agreement signed. First production run of 50 units shipped within 75 days. Brand launched at METSTRADE with positive dealer reception.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp'
      quote: 'Working with Aquafarer allowed us to enter the RIB market without building a factory — they delivered a complete turnkey solution with CE certification and dealer support documentation.'
      icon: tabler:building
    - title: Caribbean Resort Fleet
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Marine Tourism & Hospitality
      challenge: 'Luxury resort needed a complete water sports equipment fleet for guest activities: 40 SUP boards for guided tours, 20 kayaks for lagoon exploration, 10 inflatable boats for guest transfers and fishing excursions, plus accessories. All equipment needed custom resort branding and had to be delivered before peak tourist season.'
      solution: 'Produced complete water sports package: 40 SUP Voyager boards (All-Around model), 20 Explorer kayaks, 10 AirDeck 360 inflatable boats, plus PFDs, paddles, pumps, and repair kits. All equipment printed with resort logo and tropical color scheme. Containerized shipment with full inventory manifest.'
      product: Full Water Sports Package (70+ units)
      results: 'Fleet arrived 6 weeks before peak season. Guest satisfaction scores for water sports activities increased 40% year-over-year. Equipment has lasted 3 seasons with only routine maintenance.'
      image: 'https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp'
      quote: 'The complete package approach meant we received everything we needed in one shipment — boards, kayaks, boats, and accessories all branded and ready for guest use. Our guests love the equipment quality.'
      icon: tabler:beach
    - title: 'Queensland Commercial Diving Center RIB Upgrade'
      customer: Commercial Diving Center
      country: Australia
      industry: Commercial Diving & Marine Services
      challenge: 'A Queensland-based commercial diving center specializing in marine infrastructure inspection, port maintenance, and underwater repair projects was operating an aging workboat. As project demand grew, the old vessel became a liability — frequent maintenance caused scheduling disruptions, the layout was not designed for modern diving operations (limited space for cylinders, tools, and equipment), and crew comfort during long operations was poor. The company needed a vessel that could support their professional operations every working day.'
      solution: 'Aquafarer conducted a detailed operational analysis of the customer diving workflow, typical project duration, crew size, and equipment requirements. Based on this analysis, Aquafarer delivered a customized professional RIB with a functional deck layout optimized for equipment preparation and diver movement, professional seating for longer transportation periods, enhanced stability for safer diver entry and exit, and diving support features integrated into the design.'
      product: 'Custom Professional Diving RIB'
      results: 'The new RIB became a reliable daily working platform. Equipment preparation became faster with the optimized layout. Crew reported improved comfort and safety during long operations. The professional appearance of the boat strengthened customer confidence when working with port operators and marine contractors. The diving center gained a vessel that matched the professionalism of their service.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp'
      quote: 'We needed a boat that could support our business every day, not just a vessel for transportation. Aquafarer worked with us to understand our operational requirements and delivered a RIB solution that fits our commercial diving workflow.'
      icon: tabler:lifebuoy
    - title: US Coastal Patrol Contract
      customer: Atlantic Coastal Security Agency
      country: United States
      industry: Maritime Security & Law Enforcement
      challenge: 'US coastal security agency required heavy-duty patrol RIBs for open-water intercept operations. Needed twin-engine configuration for redundancy, armored console for crew protection, military-spec electronics (encrypted communications, FLIR, radar), and compliance with US Coast Guard regulations.'
      solution: 'Engineered RIB 600 Patrol with twin 115 HP outboard configuration, armored console with ballistic protection, FLIR thermal imaging, encrypted VHF/UHF communications, and integrated weapons mounting points. Hull reinforced for high-speed intercept maneuvers. All electronics integrated and tested at factory. USCG compliance documentation provided.'
      product: RIB 600 Patrol (Twin Engine)
      results: 'Boats achieved 52 knot top speed during acceptance trials. Agency reported 95% mission readiness rate over first 12 months. Additional order placed for 8 units.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp'
      quote: 'The twin-engine RIB 600 gives our crews the speed and redundancy required for open-water intercept operations. The armored console provides critical protection without compromising performance.'
      icon: tabler:shield
