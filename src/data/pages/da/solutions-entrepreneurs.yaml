testimonial:
  content: Jeg lancerede mit SUP-mærke uden brancheerfaring. Paddle Board Overstocks team guidede mig fra produktvalg til tilpasset logodesign og indpakning. Min første container ankom om 11 uger, og jeg blev udsolgt på 3 måneder på Amazon. Jeg bestiller nu min tredje container.
  name: Michael Park
  title: Grundlægger, Shoreline Paddle Co. - Californien, USA
content_segments:
  tagline: Iværksætterprofiler
  title: Lancering af vandsportsmærke<br />Efter entreprenørtype
  subtitle: Forskellige grundlæggere kommer med forskellige styrker - e-handelsekspertise, brancheforbindelser, indholdsrækkevidde eller distributionsinfrastruktur. Vi skræddersyer OEM/ODM-lanceringsprogrammet, så det matcher din startposition og vækstambition.
  items:
    - title: Amazon FBA og e-handelssælgere
      subtitle: Datadrevne brandbyggere i hurtig skalering
      description: Erfarne online sælgere, der lancerer vandsportsprodukter på Amazon, Walmart eller deres egne Shopify-butikker. Du ved, hvordan du optimerer fortegnelser, administrerer PPC og læser kategoridata - men du har brug for en produktionspartner, der forstår e-handelshastighed, afkastrater og sæsonbestemte efterspørgselsudsving.
      features:
        - Butiksklar emballage optimeret til FBAs dimensionsgrænser
        - Generering af EAN/UPC-stregkoder og dokumentation i overensstemmelse med Amazon
        - Lav MOQ (2–5 enheder pr. SKU for RIB, 5–10 for SUP) til at teste efterspørgslen før opskalering
        - Konsolidering af blandede containere for at optimere landede omkostninger pr. enhed
    - title: Influencere inden for fitness & outdoor lifestyle
      subtitle: Målgruppe-første brand skabere
      description: Indholdsskabere, fitnesstrænere og udendørspersonligheder med et engageret publikum klar til at købe ind i et livsstilsbrand. Du bringer fællesskabet og brandhistorien - vi håndterer produktudvikling, compliance, pakning og logistik, så du kan fokusere på indhold og konvertering.
      features:
        - 'Hurtig skræddersyet brandbuilding: 2-ugers prøvecyklus med logo + farver'
        - Begrænsede co-branding-udgaver og sæsonbaserede farvevarianter
        - Støtte til produktion af lifestylefotografi og videoindhold
        - 'Direct-to-consumer-ekspedition: dropshipping fra fabrik → til kunde'
    - title: Regionale distributører går direkte til forbrugeren
      subtitle: B2B-operatører lancerer deres eget brand
      description: Etablerede distributører af marine- eller udendørsudstyr, der ønsker at lancere deres eget brand sammen med eller i stedet for at videresælge tredjepartsprodukter. Du har allerede lagerinfrastruktur, logistikrelationer og en kundebase - du har brug for en fabrikspartner, der kan levere private label-kvalitet i stor skala.
      features:
        - Eksklusive produktdesigns til dit markedsområde
        - Fuld OEM-formudvikling til egne former og specifikationer
        - Lokaliseret overholdelsesdokumentation (CE, UKCA, USCG) til din region
        - 'Co-branding-emballage: distributørens brand + Paddle Board Overstocks kvalitetsmærke'
    - title: Første gangs brandstiftere
      subtitle: Guidet end-to-end brand skabelse
      description: Passionerede iværksættere med ingen erfaring fra vandsportsbranchen, som ønsker at opbygge et brand fra bunden. Du har brug for en partner, der holder din hånd gennem alle stadier – fra produktvalg og navngivning til emballagedesign og logistik i første container – med klare tidslinjer og gennemsigtige priser.
      features:
        - Rådgivende produktudvælgelse fra over 50 beprøvede basisdesigns
        - 'Brandidentitetspakke: navngivning, logo, farvepalette, emballagedesign'
        - Tidslinje på 60–90 dage fra koncept til første forsendelse
        - Dedikeret projektleder til førstegangsbrandejere
