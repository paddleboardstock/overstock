content_capability:
  tagline: Teknisk kapacitet
  title: Hvad vores ingeniør<br />team leverer
  subtitle: Aquafarer engineering dækker hele produktets livscyklus - fra markedsundersøgelser og konceptdesign til prototyping, test og masseproduktion.
  items:
    - title: Industrielt design
      description: Vores industridesignteam arbejder ud fra kundekrav, markedsundersøgelser og konkurrenceanalyser for at udvikle produktkoncepter, der balancerer æstetik, funktionalitet og fremstillingsevne. Vi producerer 2D-skitser, 3D-gengivelser og specifikationsdokumenter til klientgennemgang, før vi forpligter os til værktøj.
      features:
        - Konceptudvikling og gennemførlighedsstudier
        - 2D-konstruktionstegninger og 3D-renderinger
        - Materialevalg og -specifikation
        - Produktionsorienteret designanalyse (DFM)
        - Ergonomisk og sikkerhedsmæssig evaluering
    - title: Konstruktionsteknik
      description: Vores konstruktionsingeniører specialiserer sig i oppustelig bådarkitektur - skrogdesign, rørkammerkonfiguration, drop-stitch kerneteknik og lastfordeling. Hvert design analyseres for strukturel integritet, vægtoptimering og overholdelse af relevante standarder (CE, ISO, AS).
      features:
        - Deep-V glasfiberskrogskonstruktion med beregnede V-vinkler
        - Multikammer tubekonfiguration til sikkerhed og opdrift
        - Drop-stitch-kerne-specifikation og densitetsoptimering
        - Elementmetodeanalyse for lastbærende komponenter
        - Vægtfordelings- og stabilitetsberegninger
    - title: 3D-modellering og CAD
      description: Alle produktdesign er udviklet i 3D CAD, før prototypeværktøj begynder. Vores ingeniører bruger SolidWorks og Rhino 3D til produktmodellering, hvilket giver kunderne mulighed for at gennemgå alle detaljer - fra rørprofil til konsollayout - før de forpligter sig til produktion.
      features:
        - Fuld 3D-CAD-modellering i SolidWorks og Rhino 3D
        - Fotorealistiske renderinger til kundepresentationer
        - Tekniske tegningspakker til produktion
        - Form- og værktøjskonstruktion ud fra 3D-modeller
        - Direkt CAD-til-CNC-dataoverførsel til præcisionsskæring
    - title: Prototyping og test
      description: Før masseproduktion gennemgår hvert nyt produkt prototypestadiet. Vi bygger funktionelle prototyper til klientevaluering og udsætter dem derefter for vores fulde testprotokol - tryktest, stabilitetstest, belastningstest og vandforsøg. Designgentagelser på prototypestadiet er hurtige og omkostningseffektive.
      features:
        - Hurtige prototypeværktøjer (leveringstid 15-20 dage)
        - Funktionel prototype til evaluering i virkelige forhold
        - Fuldt testprotokoll før produktionsgodkendelse
        - Iterativ forfining af designet baseret på testresultater
        - Milepæl for kundegodkendelse før produktionsværktøj
    - title: Tilpasset tilbehørsintegration
      description: Mange OEM-projekter kræver integration af kundeleveret tilbehør eller tredjepartstilbehør – tilpassede konsoller, specialiserede siddepladser, elektroniske systemer, monteringer til dykkerudstyr eller branding-elementer. Vores ingeniørteam administrerer integrationsdesign, strukturel tilpasning og kvalitetsvalidering af alt tilbehør.
      features:
        - Konsoldesign og layout af instrumentpanelet
        - Integration af skræddersyede sæder og polstring
        - Design og kabelføring af elektroniske systemer
        - Montagesystemer til dykker- og redningsudstyr
        - Specifikationer for påføring af branding og grafik
content_process:
  tagline: Udviklingsproces
  title: Fra koncept<br />til produktion
  subtitle: Vores produktudviklingsproces følger en struktureret 6-trins arbejdsgang designet til at minimere risiko, komprimere tidslinjer og sikre fremstillingsparathed fra dag ét.
  stages:
    - stage: '01'
      title: Krav og forskning
      duration: 1-2 uger
      description: Vi arbejder sammen med kunden om at definere produktspecifikationer, målmarkedskrav, lovgivningsmæssige overholdelsesbehov og kommercielle mål. Denne fase producerer et produktkravsdokument (PRD), der guider alt efterfølgende arbejde.
      deliverables: PRD, markedsanalyse, konkurrencemæssig benchmark, foreløbigt omkostningsestimat
    - stage: '02'
      title: Koncept design
      duration: 2-3 uger
      description: Industrielt designteam udvikler produktkoncepter baseret på PRD. Flere designmuligheder præsenteres med 3D-gengivelser, materialeanbefalinger og indledende tekniske vurderinger. Kunden vælger retning for detaljeret udvikling.
      deliverables: 3D-konceptgengivelser, materialespecifikationer, designrationale, foreløbig stykliste
    - stage: '03'
      title: Detaljeret teknik
      duration: 2-4 uger
      description: Det udvalgte koncept er fuldt konstrueret - 3D CAD-modellering, strukturel analyse, rørkonfiguration, skrogdesign, tilbehørsintegration og produktionsdokumentation. Alle dimensioner, materialer og processer er specificeret for værktøj.
      deliverables: Fuld 3D CAD-model, tekniske tegninger, endelig stykliste, værktøjsspecifikationer, QC-plan
    - stage: '04'
      title: Prototype
      duration: 2-3 uger
      description: Prototypeværktøj fremstilles og funktionelle prøver bygges. Kunden gennemgår prototypen i forhold til PRD-specifikationer. Testning udføres efter aftalt protokol. Designjusteringer foretages baseret på feedback før produktionsværktøj.
      deliverables: Funktionel prototype, testrapport, designrevisionslog, klientafmeldingsdokument
    - stage: '05'
      title: Produktionsværktøj
      duration: 2-3 uger
      description: Når prototypen er godkendt, idriftsættes produktionsværktøj - støbeforme, svejsestik, skæreprogrammer, monteringsarmaturer. QC-dokumentation og inspektionskriterier er færdiggjort. Prøvekørsel udført for procesvalidering.
      deliverables: Produktionsværktøj, procesdokumentation, QC inspektionsplan, prøvekørselsrapport
    - stage: '06'
      title: Masseproduktion & QC
      duration: Løbende
      description: Fuld produktion begynder med i-proces QC på hvert trin. De første artikler inspiceres og godkendes inden batchfrigivelse. Løbende kvalitetsovervågning, defektsporing og kontinuerlig forbedring gennem hele produktionslivscyklussen.
      deliverables: Produktionsplan, QC-rapporter, batch-sporbarhedsregistreringer, forsendelsesdokumentation
content_customization:
  tagline: Tilpasningsmuligheder
  title: Hvad kan<br />tilpasses
  subtitle: Næsten alle aspekter af vores produkter kan tilpasses til at opfylde kundens krav. Nedenfor er de mest almindelige tilpasningskategorier.
  columns: 3
  items:
    - title: Skrog og struktur
      description: Tilpasset skroglængde, strålebredde, dødstigningsvinkel, rørdiameter, kammerkonfiguration og materialekvalitet.
      icon: tabler:sailboat
    - title: Farver & grafik
      description: Rørfarve (PVC/Hypalon), skroggelcoatfarve, konsolfarve, dæksgrafik, logoplacering og emballagedesign.
      icon: tabler:palette
    - title: Konsol og kontroller
      description: Midterkonsol, sidekonsol eller styrestangsstyring. Brugerdefineret instrumentpanellayout, kontaktplacering og rorposition.
      icon: tabler:steering-wheel
    - title: Sæder & polstring
      description: Jockeysæder, bænkesæder, luksusindtræk, farvetilpassede syninger, foldbare eller aftagelige konfigurationer.
      icon: tabler:armchair
    - title: Tilbehør og udstyr
      description: Dykkerstiger, tankstativer, trækpyloner, T-toppe, Bimini-toppe, lydsystemer, navigationselektronik og sikkerhedsudstyr.
      icon: tabler:backpack
    - title: Emballage & Branding
      description: Skræddersyet detailemballage, private label-kasser, forsendelseskartoner med mærkemærker, hængemærker og brugervejledninger på klientsprog.
      icon: tabler:box
content_industries:
  tagline: Industri applikationer
  title: Tekniske løsninger<br />efter industri
  subtitle: Vores ingeniørteam har udviklet produkter til en bred vifte af marineapplikationer - hver med forskellige krav og ydeevnekriterier.
  columns: 3
  items:
    - title: Dykkeroperationer
      description: Forstærkede dæk, integration af dykkerstige, tankopbevaringssystemer og stabile platforme til kommercielle dykkercentre verden over.
      icon: tabler:lifebuoy
    - title: Redning og nødsituation
      description: Højhastighedsskrogdesign, selv-bajerende dæk, udstyrsmonteringssystemer og flerkammer sikkerhedskonfigurationer til SAR-operationer.
      icon: tabler:alert-triangle
    - title: Marine turisme
      description: Passagerkomfortlayouter, solskærmsintegration, boardingsystemer og brændstofeffektive konfigurationer til ø-transferoperationer.
      icon: tabler:beach
    - title: Yachttendere
      description: Kompakte designs til opbevaring af davit, luksuriøse finishmuligheder, matchende moderskibsfarver og højtydende bugseringsegenskaber.
      icon: tabler:sailboat
    - title: Fiskeri & Akvakultur
      description: Konfigurationer af flade dæk, integration af levende brønde, layout af stangholdere, korrosionsbestandigt hardware til kontinuerlig eksponering af saltvand.
      icon: tabler:fish
    - title: Havn og industri
      description: Kraftig skrogforstærkning, arbejdsbådslayout, personaletransportkonfigurationer og udstyrsintegration til offshore-operationer.
      icon: tabler:ship
