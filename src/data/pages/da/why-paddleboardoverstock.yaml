hero:
  tagline: Hvorfor Paddle Board Overstock
  title: Bygget anderledes. Bygget til forretning.<br />Partneren bag vandoplevelser verden over
  subtitle: Ikke bare en producent — en forretningspartner, der designer, udvikler og leverer kommercielt udstyr til klubber, resorts, udlejningsoperatører og nye vandmærker.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock fremstillingskvalitet og ekspertise
pillars:
  tagline: Tre søjler af partnerskab
  title: Hvorfor verdens vandvirksomheder vælger Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Designet til kommerciel brug
      description: Vores udstyr er designet til daglig udlejning, ikke weekendrekreation. Kommercielt kvalitet PVC, forstærkede drop-stitch kerner, UV-stabile Hypalon muligheder og felt-testet hardware betyder lavere vedligeholdelse, længere levetid og højere ROI for din drift.
      icon: tabler:building-factory
      callToAction:
        text: Se kommerciel produktlinje
        href: /products
    - title: Fra idé til marked
      description: 'Lancér dit vandsportsmærke på 90 dage. Vi guider dig gennem hvert trin: konceptvalidering, produktvalg, prototype, produktion, emballagedesign og global forsendelse. Ingen minimumsordrekontrol — start småt, og skaler med selvtillid.'
      icon: tabler:rocket
      callToAction:
        text: Start din brandrejse
        href: /oem-odm-blueprint
    - title: Bygget til globale forhold
      description: 'Produkter optimeret til alle klimaer: koldtvandsPVC-formuleringer til Europa, UV-resistente materialer til Mellemøsten og Australien, anti-fugtbehandlinger til Sydøstasien. Hver forsendelse er kalibreret til dens destinationsmiljø.'
      icon: tabler:world
