reasons:
  tagline: Paddle Board Overstock Forskellen
  title: Hvad der skiller os ud
  isBeforeContent: false
  columns: 3
  items:
    - title: Ægte produktion, ikke handel
      description: Vi ejer og driver en fabrik på 12.000 m². Når du samarbejder med Paddle Board Overstock, arbejder du direkte med de mennesker, der designer, konstruerer og bygger dine produkter — uden mellemled.
      icon: tabler:building-factory
    - title: Ingeniørstyret tilgang
      description: Vores designproces starter med anvendelsestilfældet, ikke produktkategorien. Vi optimerer skrogform, materialevalg og konfiguration i forhold til, hvordan udstyret faktisk vil blive brugt i kommercielle miljøer.
      icon: tabler:engine
    - title: Certificeret kvalitet
      description: CE certificeret, ISO kvalitetssystem, BSCI overensstemmende, REACH overensstemmende, USCG Type III/V godkendte redningsveste; alle produkter opfylder gældende internationale standarder.
      icon: tabler:certificate
    - title: Fleksibel OEM/ODM
      description: Tubefarver, konsollayout, branding, emballage — vi tilpasser efter dine specifikationer. Ingen pres om minimumsordre. Start med en prototype, og skaler med selvtillid.
      icon: tabler:adjustments
    - title: Global logistik
      description: US-lager i Californien, direkte forsendelse fra Qingdao, luftfragt for hastende ordrer. Vi håndterer toldpapirer og dokumentation verden over.
      icon: tabler:truck-delivery
    - title: Livstidsstøtte
      description: Vi støtter både, vi byggede for 20 år siden. Ægte reservedele, teknisk rådgivning, reparationsvejledning — vores team er tilgængeligt, når du har brug for os, uanset hvor du er.
      icon: tabler:lifebuoy
testimonials:
  tagline: Betroet af mærker verden over
  title: Hvad vores partnere siger
  items:
    - content: Vi har arbejdet med flere producenter i Kina, men Paddle Board Overstock skiller sig ud på grund af deres tekniske support og konsekvente kvalitet. De behandler vores mærke som deres eget.
      name: — OEM Partner, europæisk vandsportsmærke
    - content: Deres Hypalon RIBs har været i tjeneste hos vores flåde i over 5 år. Minimal vedligeholdelse, fremragende UV modstandsdygtighed. 5-års garantien på rør giver os tillid.
      name: — Flådeoperatør, Mellemøstlig Feriestedgruppe
    - content: Paddle Board Overstock-teamet hjalp os med at udvikle et tilpasset SUP-kortdesign fra koncept til produktion på 90 dage. Kvaliteten oversteg vores forventninger.
      name: — Distributør, australske vandsportsaktiviteter
    - content: Som lille virksomhedsejer var jeg bekymret for MOQs. Paddle Board Overstock arbejdede med mit budget og hjalp mig med at lancere mit brand med kun 50 boards. Nu bestiller jeg 500.
      name: — Brandgrundlægger, USA SUP Udlejningsfirma
cta:
  title: Klar til at opbygge din vandvirksomhed?
