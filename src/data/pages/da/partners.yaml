hero:
  tagline: Partnerskaber og distribution
  title: 'Bliv en Paddle Board Overstock-partner<br />— globalt distributionsnetværk'
  subtitle: "Deltag i Paddle Board Overstocks globale partnernetværk. Vi samarbejder med marine distributører, bådforhandlere, udstyrsforretninger og brandpartnere i over 50 lande."
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sales-office.webp
    alt: Paddle Board Overstocks globale partner- og distributørnetværk
content_programs:
  tagline: Partnerprogrammer
  title: 'Partnerprogrammer<br />bygget til vækst'
  subtitle: 'Uanset om du er distributør, forhandler eller brandpartner, tilbyder Paddle Board Overstock programmer designet til at understøtte din forretning.'
  columns: 3
  items:
    - title: Distributørprogram
      description: 'Eksklusiv territorial distribution med volumenpriser, markedsføringsstøtte og direkte adgang til fabrikken. Minimumsforpligtelse kræves baseret på territoriets størrelse.'
      icon: tabler:world
    - title: Forhandlerprogram
      description: 'Direkte forhandlerpriser, produkttræning, markedsføringsmateriale og garantistøtte til fysiske butikker og webshops.'
      icon: tabler:building-store
    - title: OEM/ODM-partnerskab
      description: 'Fuld OEM- og ODM-produktion med custom branding, emballage og produktspecifikationer. Fra koncept til container.'
      icon: tabler:certificate
    - title: Mærkepartnerskab
      description: 'Co-branding-, private label- og eksklusive modelprogrammer for etablerede brands inden for marine- og friluftsbranchen.'
      icon: tabler:stars
    - title: 'Offentlige myndigheder og institutioner'
      description: 'Foretrukne leverandørprogrammer til offentlige myndigheder, kystvagter, militæret og humanitære organisationer. Tilbuds klar dokumentation.'
      icon: tabler:building-community
    - title: 'Partner for feriesteder og udlejning'
      description: 'Flådepriser, konsistent kvalitet og custom branding til feriesteder, dykkercentre og udlejningsvirksomheder i hele verden.'
      icon: tabler:sun
content_benefits:
  tagline: Hvorfor indgå partnerskab med os
  title: 'Hvorfor partnere vælger Paddle Board Overstock'
  subtitle: 'Vores partnere drager fordel af reel produktionskapacitet, konsistent kvalitet og responsiv support.'
  list:
    - 'Direkte adgang til fabrikken: Arbejd direkte med vores produktionsteam — uden mellemled. Få hurtigere svar, bedre priser og fuld indsigt i produktionen.'
    - 'Klar til tilpasning: Brand dine produkter med egne farver, logoer, emballage og specifikationer. Minimumsordremængder tilpasset dit marked.'
    - 'Garanteret kvalitet: ISO 9001-certificeret produktion med CE-, UKCA- og BSCI-overholdelse. Hvert produkt testes før forsendelse.'
    - 'Global logistik: Forsendelse fra Qingdao, Kina med FOB-, CIF- og DDP-muligheder. Lager i USA i Montclair, Californien til distribution i Nordamerika.'
    - 'Markedsføringsstøtte: Produktkataloger, fotografering, teknisk dokumentation og digitale aktiver, der understøtter dit salg.'
    - 'Træning og support: Produkttræning til dit salgsteam, teknisk support til dine kunder og koordinering af garantitjenester.'
content_process:
  tagline: Sådan bliver du partner
  title: 'Enkel partnerskabsproces'
  subtitle: 'Vores partnerskabsproces er ligetil — designet til, at du hurtigt kommer i gang med at sælge Paddle Board Overstock-produkter.'
  items:
    - title: 'Trin 1: Indsend ansøgning'
      description: 'Udfyld vores partneransøgningsformular med din virksomhedsprofil, målmarked og produktinteresser.'
    - title: 'Trin 2: Kvalifikationsgennemgang'
      description: 'Vores partnerskabsteam gennemgår din ansøgning og kontakter dig inden for 3 hverdage for at drøfte muligheder.'
    - title: 'Trin 3: Aftale og opsætning'
      description: 'Underskriv en partnerskabsaftale, opret din konto og modtag partnerpriser, markedsføringsmateriale og produktprøver.'
    - title: 'Trin 4: Træning og lancering'
      description: 'Produkttræning, salgsstøtte og markedsføringsmateriale leveres. Du er klar til at begynde at sælge.'
cta:
  title: 'Klar til at blive en Paddle Board Overstock-partner?'
  subtitle: 'Ansøg om partnerskab, og vores team svarer inden for 3 hverdage.'
  actions:
    - variant: primary
      text: Ansøg om partnerskab
      href: /contact
    - text: Se vores produkter
      href: /products
