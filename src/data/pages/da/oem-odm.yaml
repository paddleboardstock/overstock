faq:
  title: OEM/ODM — Ofte stillede spørgsmål
  questions:
    - q: Hvad er minimumsordremængden (MOQ) for specialfremstillede oppustelige SUPs?
      a: For standardmodeller med eksisterende forme starter MOQ ved 5–10 enheder pr. design. For fuldt tilpassede forme og værktøj er MOQ typisk 200 enheder. Vi arbejder med startups og nye mærker for at finde mulige indgangspunkter.
    - q: Hvad er MOQ for brugerdefinerede RIB-både?
      a: RIB modeller starter ved 2–5 enheder pr. design med eksisterende forme, mens fuldt tilpassede RIB forme kræver større forpligtelser. Vi arbejder med startups og etablerede mærker for at finde gennemførlige adgangspunkter.
    - q: Hvor lang tid tager OEM prøveprocessen?
      a: Standard prototypeprøver færdiggøres inden for 7–14 arbejdsdage efter designgodkendelse. Hastende ordrer kan prioriteres til 5–7 dage mod et ekstra gebyr.
    - q: Hvad er forskellen mellem PVC og Hypalon for oppustelige både?
      a: PVC er lettere, mere overkommelig og tilbyder fremragende fleksibilitet i koldt vejr. Hypalon (CSM) giver overlegen UV og ozonresistens med en længere levetid (10–15 år mod 5–8 år). Vi anbefaler PVC til de fleste rekreative anvendelser og Hypalon til kommerciel/professionel brug.
    - q: Kan du tilpasse formen og designet af oppustelige?
      a: Ja. Vores forsknings- og udviklingsteam kan udvikle specialforme til enhver skrogform, brætform eller rørkonfiguration. Vi bruger CNC-bearbejdede aluminiumsforme for præcision og konsistens.
    - q: Tilbyder I fabriksaudit-tjenester?
      a: Vi byder velkommen til inspektioner på stedet og tredjepartsrevisionsbesøg på vores 12.000 m² store facilitet i Qingdao. Vi opretholder ISO 9001- og BSCI certificeringer og kan dele revisionsrapporter efter NDA.
    - q: Hvilke fragtbetingelser tilbyder I?
      a: Vi tilbyder FOB Qingdao (standard), CIF og DDP forsendelsesbetingelser. Containerlastning og fuld eksportdokumentation er inkluderet i alle OEM ordrer.
content_profiles:
  tagline: Brandprofiler
  title: OEM / Private Label Produktion<br /> Efter Kundetype
  subtitle: Forskellige brandprofiler har forskellige krav — vi tilpasser vores OEM/ODM-tjenester, så de matcher din forretningsmodel, skala og go-to-market-strategi.
  items:
    - title: Opstartsmærker af vandscootere
      subtitle: Lav MOQ, hurtig optrapning
      description: Entreprenører og grundlæggere, der lancerer deres første serie af RIB både, SUPs eller oppustelige både. Du har brug for en produktionspartner, der behandler dit mærke som deres eget — med lave adgangsbarrierer, fleksible batchstørrelser og praktisk designvejledning i hvert skridt af processen.
      features:
        - MOQ så lavt som 2–5 enheder (RIB) / 5–10 enheder (SUP) pr. SKU
        - Forud eksisterende formbibliotek for at springe værktøjsomkostninger over
        - 'Fuld brandingpakke: logo, tube-grafik, emballage, hangtags'
        - Sample-første arbejdsgang — godkend før produktion
    - title: Etablerede marinebrands
      subtitle: OEM skala med CE/ISO overholdelse
      description: Eksisterende både-, PWC- eller marineudstyrsbrands, der tilføjer oppustelige vandfartøjer til deres portefølje. Du har brug for ensartet kvalitet på tværs af produktionsserier, overholdelse af regler for globale markeder og evnen til at co-udvikle specialdesignede skrog- eller tubefaconer.
      features:
        - Specialfremstillet 3D-formteknik til proprietære designs
        - CE 2013/53/EU, UKCA, USCG overensstemmelsesdokumentation
        - BSCI sociale revisionsrapporter for detailhandlens overholdelse
        - Dedikeret kontoadministration + prioriterede produktionspladser
    - title: DTC & e-handelsmærker
      subtitle: Detailklar emballage i stor skala
      description: Online-første mærker, der sælger gennem Amazon, Shopify eller deres egne webbutikker. Emballage, unboxing-oplevelse og ensartet enhedskvalitet er afgørende. Du har brug for en fabrik, der forstår tempoet og returprocent-dynamikken i e-handel.
      features:
        - Detaljeanpasset emballagedesign + indsæt korttryk
        - Vakuumpakning / palletering for omkostningseffektiv forsendelse
        - EAN / UPC-stregkode og toldklar dokumentation
        - Konsolidering af blandede containere for at optimere landede omkostninger
    - title: Udlejnings- og hospitality-operatører
      subtitle: Flådeklassebyggerier til feriesteder og udlejningsvirksomheder
      description: Resorts, vandsportscentre og udlejningsoperatører har brug for holdbare, vedligeholdelsesvenlige flåder med ensartet branding. Vi tilbyder flådepriser, containere med blandede modeller og reservedelsstøtte til mange års drift.
      features:
        - Flådepriser på blandede modelcontainerordrer
        - Holdbare kommercielle rør- og dækmuligheder
        - Reservedele sæt og vedligeholdelsestræning
        - Konsistent branding på tværs af SUP, RIB og kajakflåder
