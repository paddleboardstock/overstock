process_steps:
  title: 6-trins OEM/ODM proces
  subtitle: Fra designbrief til FOB Qingdao — en strømlinet arbejdsproces
  steps:
    - number: '01'
      title: Designbrief & 3D CAD-modellering
      description: Del dine målspecifikationer, referenceprodukt eller koncept. Vores ingeniørteam udarbejder detaljerede CAD-tegninger og 3D-visualiseringer til din godkendelse.
      timeline: 3-5 dage
    - number: '02'
      title: Materialeudvælgelse og stofprøvning
      description: Vælg mellem militærkvalitets PVC (0,9–1,2 mm), Hypalon CSM eller drop-stitch kernestoffer. Vi udfører trækstyrke-, belægningshæftnings- og UV stabilitetstest.
      timeline: 2-3 dage
    - number: '03'
      title: Hurtig prototyping og prøveproduktion
      description: Vi CNC-maskine specialfremstiller forme og producerer præproduktionsprøver med dine brandfarver, logo og specificerede materialer. Prøver sendes til godkendelse.
      timeline: 7-14 dage
    - number: '04'
      title: 24–48 timers højtryks-holdtest
      description: Hver prototype gennemgår grundige trykbestandighedstest ved 1,25x den vurderede tryk. Sømbelastningstest og dimensionskontrol udføres.
      timeline: 1-2 dage
    - number: '05'
      title: CE/ISO Kvalitetskontrol & Emballering
      description: 100-punkts kvalitetscheckliste. Hver enhed inspiceres før detailklar emballage. CE overensstemmelseserklæring og BSCI overensstemmelsesrapport inkluderet.
      timeline: 2-3 dage
    - number: '06'
      title: FOB Qingdao Forsendelse & Logistik
      description: Færdigvarer palleteret, strækfilmindpakket og containerlastet i Qingdao havn. Fuld eksportdokumentation, toldbehandling og realtids-sporing.
      timeline: 7-14 dage
