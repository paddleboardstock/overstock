testimonial:
  content: Vi startede med Club Starter Package til vores surfskole i Portugal. 20 brædder, pagajer, veste - alt ankom inden for 3 uger. Efter to sæsoner opgraderede vi til Pro-pakken. Den tilpassede branding med vores logo var en game-changer for vores professionelle image.
  name: Ricardo Santos
  title: Ejer, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Klubprofiler
  title: Vandsportsklubløsninger<br />Efter klubtype
  subtitle: Fra universitetspadleklubber til eksklusive private yachtklubber - hver type klub har unikke udstyrsbehov, brugsmønstre og budgetstrukturer. Vi skræddersyer hver pakke, så den matcher klubmodellen.
  items:
    - title: Universitets- og universitetspadleklubber
      subtitle: Studenterflåder med høj brug
      description: Studenterdrevne eller institutionsstøttede padleklubber, der driver SUP- og kajakprogrammer for universitetets rekreative afdelinger. Udstyr står over for højfrekvent brug med høj omsætning på tværs af flere færdighedsniveauer hvert semester. Holdbarhed og nem reparation er afgørende, sammen med budgetvenlige priser for studenterorganisationer.
      features:
        - 'Ekstra holdbar PVC-konstruktion dimensioneret til studenterbrug'
        - 'Farvekodede brætserier efter niveau for nem flådestyring'
        - 'Reparationskit + videosupport efter behov inkluderet i hver ordre'
        - 'Rabatpriser for studenterorganisationer og semesterbaseret betaling'
    - title: Fællesskab padle & sociale klubber
      subtitle: Medlemsdrevne fritidsklubber
      description: Fællesskabsbaserede klubber, der tilbyder SUP, kajak og sociale padleoplevelser til medlemmer. Udstyr skal balancere ydeevne og komfort for en bred aldersgruppe med branding, der fremmer klubbens identitet og medlemsstolthed. Opbevaringseffektivitet er nøglen til klubber, der opererer fra begrænset adgang til vandet.
      features:
        - 'Blandet flåde: allround-SUP’er, touringbrætter og fritidskajakker'
        - 'Fuld klubprofil: egne farver, logotryk, profilerede redningsvester'
        - 'Kompakte opbevaringsløsninger til oppusteligt udstyr'
        - 'Startpakke til medlemsvækst: henvisningskort, fotografering i klubprofil'
    - title: Surfskoler og surfkajakakademier
      subtitle: Kystpræstation og coaching
      description: Surf-fokuserede skoler, der underviser i SUP-surfing, surfkajaksejlads og bølgeridning. Udstyr skal fungere under surfforhold - manøvredygtigt, responsivt og holdbart nok til at håndtere gentagne wipeouts, sandslibning og saltvandseksponering uden hurtig nedbrydning.
      features:
        - 'Kortere, bredere SUP-former optimeret til manøvrering i surf'
        - 'Forstærket rails-konstruktion med stødmotstand i bølger'
        - 'Surfspecifikt sikkerhedsudstyr: spiralleds, bløde finner som valg'
        - 'Flådeudskiftningsprogram med sæsonrabatter ved indbytning'
    - title: Virksomheds- og private yachtklubber
      subtitle: Premium medlemsoplevelser
      description: Eksklusive private klubber, der tilbyder vandsport som en førsteklasses faciliteter for medlemmer. Udstyrsstandarder er høje - æstetik, mærketilpasning og gæsteklar præsentation er lige så vigtige som ydeevne. Serviceforventningerne omfatter levering af hvide handsker, brugerdefinerede opbevaringsløsninger og support på concierge-niveau.
      features:
        - 'Brætter med premiumfinish i EVA med træåremønster og metalliske detaljer'
        - 'Egen farvematchning efter klubbens brandretningslinjer'
        - 'Concierge-levering: oppustet, klargjort og mærket til hver sæson'
        - 'Dedikeret kundeansvarlig med prioriteret svar-SLA'
