hero:
  tagline: Vandsportsklubber
  title: Udstyr og løsninger<br />Til padleklubber og træningscentre
  subtitle: Komplet udstyrspakker, instruktørudstyr, branding og vedligeholdelsesstøtte til SUP-klubber, kajakklubber, surfskoler og vandsportstræningscentre af enhver størrelse.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP boards til vandsportsklubber og udlejningsflåder
direct_answer: Paddle Board Overstock leverer end-to-end udstyrsløsninger til vandsportsklubber og træningscentre verden over. Vores klubpakker inkluderer SUP boards, kajakker, padler, pumper, reparationssæt og sikkerhedsudstyr til konkurrencedygtige engrospriser med lave MOQ'er. Hver pakke kan tilpasses med klublogoer, mærkefarver og personlig emballage. Vi tilbyder også vedligeholdelsestræning, reservedelssupport og udstyrsrotationsprogrammer for at maksimere levetiden for din flåde.
solution_offerings:
  - title: Klub startpakke
    subtitle: For nye klubber med 10-30 medlemmer
    badge: Best Seller
    features:
      - title: Kerneudstyr
        description: 10–30 SUP boards eller kajakker med matchende pagajer, pumper og reparationssæt
      - title: Sikkerhedsudstyr
        description: Redningsveste, fløjte, snoresæt i klubfarver til hvert bræt
      - title: Instruktør udstyr
        description: Trænerspecifikke brædder med skridsikre dæk og ekstra stabilitet
      - title: Branding pakke
        description: Brugerdefineret logotryk på brædder, pagajer og emballage
      - title: Træningsmaterialer
        description: Begynder lektionsvejledninger, sikkerhedsprotokoller og vedligeholdelsestjeklister
    cta_text: 'Saml min klubpakke'
    cta_href: /contact
  - title: Club Premium-pakke
    subtitle: For etablerede klubber og multi-location operatører
    badge: Professional
    features:
      - title: Fuld flåde
        description: 30-100 blandet flåde af SUP'er, kajakker og tilbehør
      - title: Avanceret sikkerhedssystem
        description: Sporing af RFID-udstyr, skadesrapporteringsapp, sikkerhedsskiltning
      - title: Personaleuddannelse
        description: On-site instruktørcertificering og værksted for vedligeholdelse af udstyr
      - title: Marketingstøtte
        description: Professionel fotografering, brochurer og skabeloner til sociale medier
      - title: Udskiftningsprogram
        description: Årlig udstyrsopfriskning til nedsatte priser med indbyttemuligheder
    cta_text: 'Udvid min klub'
    cta_href: /contact
