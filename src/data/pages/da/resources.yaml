hero_text:
  tagline: Ressourcer
  title: 'Downloadcenter & indkøbsvejledninger'
  subtitle: 'Få adgang til produktkataloger, OEM-vejledninger, indkøbschecklister og teknisk dokumentation, der hjælper dig med at træffe velunderbyggede indkøbsbeslutninger.'
features3_downloads:
  tagline: Downloads
  title: 'Produktdokumentation<br />& ressourcer til købere'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Marin produktkatalog 2026'
      description: 'Fuldt produktsortiment herunder RIB-både, gummibåde, SUP-brædder, kajakker og tilbehør. Specifikationer, konfigurationer og valgmuligheder. PDF-format.'
      icon: tabler:file-text
    - title: 'OEM-produktionsvejledning'
      description: 'Alt, hvad du behøver at vide om OEM/ODM-partnerskaber: procesoversigt, minimumsbestillingsmængder, tilpasningsmuligheder, kvalitetskontrol og forsendelse.'
      icon: tabler:building-factory
    - title: 'Købevejledning til RIB-både'
      description: 'Sådan vælger du den rigtige RIB: skrogmaterialer, tubematerialer, motorvalg, størrelsesovervejelser og konfigurationsmuligheder til forskellige anvendelser.'
      icon: tabler:file-description
    - title: 'Tjekliste for SUP-leverandører'
      description: 'Vigtige overvejelser ved valg af SUP-bræddeproducent: kvalitetsindikatorer, certificeringskrav, MOQ-overvejelser og hvad du skal være opmærksom på ved en fabriksaudit.'
      icon: tabler:clipboard-check
    - title: 'Materialevejledning til gummibåde'
      description: 'PVC mod Hypalon: sammenligning af holdbarhed, UV-bestandighed, levetid, reparationsmuligheder og omkostningsforhold for forskellige maritime anvendelser.'
      icon: tabler:files
    - title: 'Skabelon til kravspecifikation for skræddersyet produktion'
      description: 'Download vores skabelon til produktkrav. Udfyld dine krav og send den tilbage til os for et tilbud inden for samme uge og en vurdering af gennemførbarheden.'
      icon: tabler:template
faqs:
  title: Ofte stillede spørgsmål
  subtitle: 'Almindelige spørgsmål om vores produkter, produktionsprocessen og vores partnerskabsmodel.'
  columns: 2
  items:
    - title: Hvad er minimumsbestillingsmængden?
      description: 'MOQ varierer efter produktkategori. RIB-både starter typisk ved 10 enheder pr. model. SUP-brædder fra 50 enheder. Kontakt vores salgsteam for produktspecifik MOQ-information.'
      icon: tabler:help-circle
    - title: Kan jeg få prøver, før jeg afgiver en ordre?
      description: 'Ja. Paddle Board Overstock tilbyder prøveproduktion til evaluering før masseproduktion. Prøveomkostninger er forhandlelige og kreditères ofte mod den første produktionsordre.'
      icon: tabler:package
    - title: Hvilke betalingsbetingelser er tilgængelige?
      description: 'Standardbetingelser: 30% depositum ved bestilling, 70% før afsendelse. LC-betingelser er tilgængelige for kvalificerede kunder. Kontakt vores økonomiteam for at drøfte ordningerne.'
      icon: tabler:currency-dollar
    - title: Hvor lang tid tager produktionen?
      description: 'Typiske leveringstider: RIB-både 30-45 dage, SUP-brædder 20-30 dage, gummibåde 25-35 dage. Skræddersyet udvikling tilføjer 15-30 dage til prototypefremstilling.'
      icon: tabler:calendar-clock
    - title: Hvilke certificeringer har jeres produkter?
      description: 'CE-certificering til EU-markeder, produktion godkendt af den amerikanske kystvagt, ISO-kvalitetssystem, BSCI-overholdelse og REACH-materialeoverholdelse.'
      icon: tabler:certificate
    - title: Tilbyder I skræddersyet emballage og branding?
      description: 'Ja. Vi leverer skræddersyet emballage med jeres logo, jeres farver og jeres brandidentitet. MOQ for skræddersyet emballage afhænger af produktkategorien.'
      icon: tabler:color-swatch
cta:
  title: 'Brug for hjælp til at finde den rigtige ressource?'
  subtitle: 'Kontakt vores team for personlig vejledning om produktvalg, OEM-partnerskaber eller tekniske specifikationer.'
  actions:
    - variant: primary
      text: Kontakt vores team
      href: /contact
