    detail: EU, USA, AU, Mellemøsten, Asien
  - value: 30–45
    label: Standard leveringstid (dage)
    detail: Fra PO-bekræftelse til FOB
  - value: 10+
    label: Års eksporterfaring
    detail: Siden 2012

workshops:
  - title: SUP-brætteproduktion
    description: '4 parallelle samlelinjer til oppustelige SUP-brætter. Hver linje kan producere 50-80 brætter pr. hold. Digitale tryk- og silkscreentrykstationer kører samtidig. Årlig SUP-kapacitet: 8.000+ brætter.'
    output: 8 000+ SUP/år
  - title: RIB-bådproduktion
    description: 'Dedikeret værksted til glasfiberskrog med 6 formstationer til RIB-skrog på op til 7,6 m. Området til tuber- og samling håndterer 3-5 RIB-både samtidigt. Årlig RIB-kapacitet: 2.000+ både.'
    output: 2 000+ RIB/år
  - title: Oppustelig båd og jolle
    description: 'Flerbrugs produktionslinjer til oppustelige både, kajakker og joller. Varm luft-svejsestationer, RF-dielektriske presser og samlearbejdspladser konfigureres igen baseret på ordremiks. Årlig kapacitet: 5.000+ enheder.'
    output: 5 000+ enheder/år
  - title: Sikkerhedsudstyr
    description: 'Separat renrumsproduktionsområde til redningsvester og sikkerhedsudstyr. Dedikeret syning, indsættelse af skum og teststationer. Årlig kapacitet for redningsvester: 50.000+ enheder.'
    output: '50.000+ redningsvester/år'

oem_capacity:
  moq: 'SUP: 5-10 enheder | RIB: 2-5 enheder | Kajak/jolle: 10-20 enheder | Tilpasset form: 200+ enheder'
  lead_time: 'Standard 30-45 dage. Prøve 15-20 dage. Hurtiglevering tilgængelig.'
  payment: 'T/T 30% depositum + 70% før forsendelse. L/C, Western Union accepteres.'
