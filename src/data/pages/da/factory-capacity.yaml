hero:
  tagline: Produktionskapacitet
  title: Produktionskapacitet og årlig produktion
  subtitle: Anlæg på 12.000 m², der producerer 15.000 både om året med plads til skalering

intro: Paddle Board Overstock driver en af de største specialiserede produktionsanlæg for oppustelige både i Qingdao, Kina. Vores fabrik på 12.000 m² er organiseret i seks specialiserede værksteder, der arbejder parallelt, hvilket giver os kapacitet til at producere 15.000 både årligt inden for SUP-, kajak-, jolle-, RIB- og sikkerhedsudstyrlinjer.

highlights:
  - value: 12,000 m²
    label: Samlet produktionsareal
    detail: Fordelt på 6 specialiserede værksteder
  - value: 15,000
    label: Både produceret om året
    detail: SUP'ere, kajakker, RIB-både, joller, sikkerhedsudstyr
  - value: 200-300
    label: Kvalificeret arbejdsstyrke
    detail: 25+ ingeniører, 2 hold/dag
  - value: 50+
