section_faq:
  title: Tekniske ofte stillede spørgsmål
  questions:
    - q: Hvordan er drop-stitch sammenlignet med traditionel hard-shell-konstruktion?
      a: Moderne drop-stitch-kerner ved 20 PSI opnår 85-90 % af stivheden af sammenlignelige EPS-skum/fiberglas-hårde skaller, samtidig med at de kan tømmes fuldt ud til transport. Afvejningen er lidt højere vægt og lavere ultimativ stivhed - men for de fleste rekreative og kommercielle applikationer er forskellen ubetydelig.
    - q: Hvilken trådtæthed betragtes som førsteklasses kvalitet?
      a: Premium drop-stitch-stoffer bruger 2 tråde pr. kvadrattomme (ca. 3.100 tråde pr. m²) vævet af 1.680 DTEX polyestergarn. Indgangsstoffer bruger 1 tråd pr. m2 med 1.100 DTEX-garn.
    - q: Kan Hypalon svejses som PVC?
      a: Nej. Hypalon/CSM kan ikke RF-svejses. Det skal samles ved hjælp af håndpåført kontaktcement, hvilket gør produktionen mere arbejdskrævende og sømme afhængig af operatørens færdigheder. PVC kan RF-svejses eller varmluftsvejses for ensartet, automatiseret sømkvalitet.
    - q: Hvad er det maksimale sikre tryk for gummibåde?
      a: Standard oppustelige bådrør fungerer ved 8–12 PSI. Drop-stitch-gulve fungerer ved 12–20 PSI. Højtryks drop-stitch cores (SUP'er) kan fungere ved 20–25 PSI. Hvert produkt inkluderer trykaflastningsventiler, der er kalibreret til at forhindre overoppustning.
    - q: Hvor lang tid tager det at fremstille en tilpasset gummibåd?
      a: Standard OEM-produktion kører 30-45 dage fra ordrebekræftelse til FOB Qingdao. Skræddersyet formudvikling tilføjer 15-20 dage til prototypeproduktion og -testning.
