hero:
  tagline: Certificeringer & Standarder
  title: 'Kvalitetscertificeringer<br />& Overholdelsesstandarder'
  subtitle: 'Aquafarer-produkter fremstilles i overensstemmelse med internationale standarder for maritim sikkerhed, kvalitetsledelsessystemer og miljøbestemmelser.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Aquafarers kvalitetscertificeringer og overholdelsesdokumentation
content_certifications:
  tagline: Vores certificeringer
  title: 'Certificeret kvalitet,<br />globalt anerkendt'
  subtitle: '64 CE-certificerede modeller og certificeringer på hele fabrikken demonstrerer vores engagement i kvalitet, sikkerhed og miljøansvar.'
  items:
    - title: 'CE-certificeret'
      description: '64 CE-certificerede modeller overholder europæiske CE-mærkningskrav for fritidsfartøjer, hvilket sikrer, at krav til sikkerhed, sundhed og miljøbeskyttelse er opfyldt.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Vores kvalitetsledelsessystem er certificeret i henhold til ISO 9001:2015 og dækker design, produktion og distribution af oppustelige fartøjer og marint udstyr.'
      icon: tabler:clipboard-check
    - title: 'UKCA-mærkning'
      description: 'Produkter, der sælges på det britiske marked, har UKCA-mærkning, hvilket bekræfter overensstemmelse med britiske regler for marint udstyr og fritidsfartøjer.'
      icon: tabler:shield
    - title: 'BSCI-konform'
      description: 'Aquafarer revideres i henhold til BSCI (Business Social Compliance Initiative), hvilket demonstrerer etiske produktionspraksisser, retfærdige arbejdsvilkår og ansvar i forsyningskæden.'
      icon: tabler:heart-handshake
    - title: 'REACH-konform'
      description: 'Alle materialer i Aquafarer-produkter overholder EU''s REACH-forordning for kemisk sikkerhed, hvilket sikrer, at vores PVC, Hypalon og komponenter ikke indeholder begrænsede stoffer.'
      icon: tabler:flask
    - title: 'Materialeprøvning'
      description: 'Stoffer testes for trækstyrke, rivmodstand, UV-nedbrydning og ydeevne ved koldsprækning. Hver produktionsbatch udtagnes og verificeres.'
      icon: tabler:test-pipe
content_factory:
  tagline: Fabriksstandarder
  title: 'Produktion i topklasse<br />— bygget efter specifikation'
  subtitle: 'Vores anlæg på 12,000 m² drives under strenge kvalitetskontrolprotokoller i hvert trin af produktionen.'
  list:
    - 'Indkommende materialekontrol: alle råvarer — PVC-stof, Hypalon, aluminium, krydsfiner, lim — testes mod specifikationer, før de går i produktion.'
    - 'Kvalitetskontrol i processen: hvert produktionstrin har dokumenterede QC-kontrolpunkter. Svejsestyrke, sømjustering, ventilinstallation og strammingsmoment verificeres inline.'
    - 'Tryktestning: Hvert oppustelige kammer er tryktestet ved 1,25× nominelt tryk i 24-48 timer. Lækageprocenten skal være nul for at bestå karakteren.'
    - 'Slutinspektion: færdige produkter inspiceres for dimensionel nøjagtighed, kosmetisk finish, tilbehørskompletthed og emballageintegritet før forsendelse.'
    - 'Batch-sporbarhed: hvert produkt har et serienummer knyttet til produktionsbatchoptegnelser, hvilket muliggør fuld sporbarhed fra råvare til færdig vare.'
content_safety:
  tagline: Standarder for maritim sikkerhed
  title: 'Sikkerhed først<br />— designet til pålidelig drift'
  subtitle: 'Aquafarer-produkter er designet og testet til at opfylde internationale standarder for maritim sikkerhed til kommercielt og fritidsbrug.'
  items:
    - title: 'ISO 6185'
      description: 'Oppustelige både opfylder ISO 6185-standarderne for konstruktion, stabilitet, opdrift og lastekapacitet.'
      icon: tabler:sailboat
    - title: 'ABYC-standarder'
      description: 'Elektriske systemer og brændstofsystemer følger ABYC-standarderne (American Boat & Yacht Council) for sikker installation og drift.'
      icon: tabler:bolt
    - title: 'SOLAS-efterlevelse'
      description: 'Sikkerhedsudstyr og redningsudstyr opfylder SOLAS-kravene (Safety of Life at Sea), hvor det er relevant.'
      icon: tabler:lifebuoy
cta:
  title: 'Brug for certificerede produkter til dit projekt?'
  subtitle: 'Kontakt vores team for at drøfte certificeringskrav, dokumentation og overholdelse for dit marked.'
  actions:
    - variant: primary
      text: Anmod om certificeringsdokumenter
      href: /contact
    - text: Se vores kvalitetsside
      href: /quality
