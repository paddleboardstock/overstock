hero:
  tagline: Tekniske tegninger & CAD
  title: RIB & gummibåd<br />Tekniske tegninger & CAD-downloads
  subtitle: GA-tegninger på planlægningsniveau, dimensionsark og dæklayout til projektevaluering og -specifikation. Få adgang til tekniske tegninger på det rigtige niveau - fra offentlige PDF'er til STEP-filer på projektniveau.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: RIB båd tekniske tegninger og CAD downloads
direct_answer: Paddle Board Overstock leverer tekniske tegninger på indkøbsniveau til RIB-både og oppustelige vandfartøjer - inklusive PDF'er for generel arrangement (GA), dimensionsark og dæklayouttegninger. Højere detaljerede formater (DXF/DWG, STEP/IGES) er tilgængelige ved kvalificeret forespørgsel eller projektansøgning.
