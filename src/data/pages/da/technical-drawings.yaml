content_version_control:
  tagline: Versionsstyring
  title: Tegneversion<br />Administration
  subtitle: Hver tegning følger et kontrolleret revisionssystem. Bekræft altid, at du har den aktuelle revision, før du bruger tegninger til projektering.
  items:
    - title: Revisionssporing
      description: Hver tegning har en revisionskode (Rev-A, Rev-B, Rev-C), udstedelsesdato, dato for sidste gennemgang, relevant model/konfiguration, enheder, filstørrelse og format. Kun den "aktuelle" revision er tilgængelig til download.
      icon: tabler:git-branch
    - title: Meddelelse om tegningsstatus
      description: Alle offentlige tegninger er mærket "Kun foreløbigt layout - ikke til konstruktion, certificering eller produktionsbrug. Dimensioner er underlagt endelige specifikationer og ordrebekræftelse." Dette beskytter begge parter mod forkert anvendelse.
      icon: tabler:alert-circle
    - title: Opdater meddelelser
      description: Når en modelspecifikation ændres, opdateres tegningsrevisionen, og tidligere versioner er markeret "Udskiftet". Registrerede brugere, der har downloadet DXF/DWG-pakker, får besked om væsentlige opdateringer via e-mail.
      icon: tabler:bell

