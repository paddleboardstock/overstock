faq:
  title: Tekniske tegninger — ofte stillede spørgsmål
  questions:
    - q: Er GA PDF'erne virkelig gratis at downloade?
      a: Ja. Generelt arrangement PDF'er for vores hovedmodeller er tilgængelige uden omkostninger. De indeholder oplysninger på planlægningsniveau, der er tilstrækkelige til projektevaluering, pladsallokering og foreløbig specifikationsgennemgang.
    - q: Hvordan får jeg adgang til DXF/DWG-filer?
      a: Udfyld den korte kvalifikationsformular på downloadsiden med dit firmanavn, projekttype og påtænkte anvendelse. Godkendte anmodninger modtager et downloadlink via e-mail inden for 1 hverdag.
    - q: Kan jeg få STEP/IGES 3D-modeller?
      a: STEP- eller IGES 3D-modelfiler er tilgængelige via vores projektansøgningsproces. Angiv dit projektomfang, integrationskrav, tidslinje og købshensigt. Med forbehold for godkendelse - typisk inden for 3-5 hverdage.
    - q: Hvorfor begrænser du adgangen til filer med højere detaljer?
      a: Skroggeometri, støbedata og strukturelle beregninger repræsenterer mange års F&U-investeringer og er kernen i fremstillings-IP. Vi leverer alt det nødvendige til indkøbsplanlægning og projektintegration, samtidig med at vi beskytter vores evne til at fortsætte med at investere i udvikling af nye produkter.
    - q: Indeholder tegningerne fremstillingsdetaljer?
      a: Nej. Offentlige tegninger og tegninger i lysform indeholder oplysninger på indkøbsniveau til planlægning og specifikation. Detaljer på produktionsniveau (lamineringsplaner, værktøjsbaner, skæreudvidelser) deles kun under NDA med bekræftede ordrer.
    - q: Er tegninger tilgængelige for brugerdefinerede eller semi-tilpassede RIB-konfigurationer?
      a: Skræddersyede projekttegninger udarbejdes som en del af OEM/ODM-udviklingsprocessen. Hvis du vurderer et tilpasset RIB-projekt, så kontakt os med dine krav, og vi vil levere projektspecifikke GA-tegninger som en del af forslaget.
