content_tiers:
  tagline: Download niveauer
  title: Fire adgangsniveauer<br />— Den rigtige detalje til den rigtige scene
  subtitle: Vi leverer tegninger på indkøbsniveau, ikke filer på produktionsniveau. Hvert niveau matcher en anden projektfase.
  items:
    - title: Niveau 1 — Offentlig PDF
      description: Generelt arrangement (GA), dimensionstegninger med 4 visninger og dæklayout i PDF-format. Tilgængelig til gratis download. Tilstrækkelig til projektplanlægning, pladsallokering og foreløbig specifikationsgennemgang.
      icon: tabler:file-type-pdf
    - title: Niveau 2 — Lysform DXF/DWG
      description: 2D CAD-filer (DXF eller DWG) til layout-integration på planlægningsniveau. Kræver en kort kvalifikationsformular (virksomhedsnavn, projekttype, tilsigtet anvendelse). Ingen strukturelle eller fremstillingsdata inkluderet.
      icon: tabler:file-code
    - title: Niveau 3 — Projektansøgning STEP/IGES
      description: 3D-modelfiler (STEP eller IGES) til systemintegration, indretningsdesign eller koordinering af marinearkitektur. Kræver projektansøgning med omfang, tidslinje og købshensigt. Med forbehold for godkendelse.
      icon: tabler:cube
    - title: Niveau 4 — NDA Engineering
      description: Skrogstrukturtegninger, lamineringsplaner, rørskæringsudvidelser og formdata. Kun tilgængelig under NDA med bekræftede ordrer. Disse er filer på produktionsniveau - ikke til offentlig distribution.
      icon: tabler:lock
content_included:
  tagline: Hvad er inkluderet
  title: Tegningsindhold<br />Pr. model
  subtitle: Hver model har en standard tegningspakke, der dækker de væsentlige planlægningsoplysninger for B2B-købere og projektingeniører.
  items:
    - title: Generel aftale (GA)
      description: Sideprofil, topvisning og tværsnit, der viser skrogform, rørposition, konsolplacering, sæde, brændstofsystem og nøgledimensioner (LOA, stråle, rørdiameter, dødstigningsvinkel). Revisionsstatus og copyright noteret på titelblok.
      icon: tabler:layout
    - title: 4-View Dimension Tegning
      description: Side-, front-, bag- og topvisninger med overordnede dimensioner til transportplanlægning (højde på trailer, bjælke til container, vægt til løft). Inkluderer drifts- og transportkonfigurationer.
      icon: tabler:ruler-2
    - title: Dæklayout og udstyrsplan
      description: Top-down dækbillede viser konsolbase, sædepositioner, D-ringplaceringer, navigationslyspositioner, lænsepumpeadgang, batteri/brændstofrum og udstyrsmonteringspunkter. Begrænset præcision på proprietære grænseflader.
      icon: tabler:map
    - title: Transport & Emballage tegning
      description: Containerladningsplan, vuggedimensioner, vægtfordeling og løftepunkter til logistikplanlægning. Inkluderer standard og brugerdefinerede emballagemuligheder.
      icon: tabler:truck
content_protection:
  tagline: IP beskyttelse
  title: Hvad vi ikke deler<br />og hvorfor
  subtitle: Beskyttelse af vores tekniske IP sikrer, at vi kan fortsætte med at investere i R&D, mens vi stadig leverer alt, hvad købere har brug for til projektplanlægning.
  items:
    - title: Skrogform kernedata
      description: Stik- og formgeometri, CNC-værktøjsbaner og lamineringsskabeloner er proprietære produktionsaktiver. De deles ikke på noget adgangsniveau uden for bekræftede NDA-kontrakter.
      icon: tabler:ban
    - title: Udvidelser af rørskæring
      description: Fladmønstrede skærefiler til rørstof er data på produktionsniveau. Kun tilgængelig under NDA med bekræftede produktionsordrer og kun delt med den kontraherende part.
      icon: tabler:ban
    - title: Strukturelle beregninger
      description: Detaljeret stressanalyse, FEA-resultater og laminatplaner er overholdelsesfølsomme dokumenter, der kun deles med notificerede organer og NDA-bundne klienter under overensstemmelsesvurderingsprocessen.
      icon: tabler:ban
    - title: Konkurrent screening
      description: Vi forbeholder os retten til at afvise anmodninger om CAD-adgang, der ser ud til at være fra konkurrenter, studerende uden projektkontekst eller parter uden legitime indkøbshensigter.
      icon: tabler:shield
