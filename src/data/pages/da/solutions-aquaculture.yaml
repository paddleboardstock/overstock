content_challenge:
  tagline: Udfordringen
  title: Akvakultur kræver<br />Saltvandsstærkt udstyr
  subtitle: Fiskefarme, perlefarme og havfarme opererer i det mest kemisk aggressive havmiljø - langvarig saltvandseksponering, brændstof- og foderrester og kontinuerlig daglig brug.
  paragraphs:
    - Akvakulturdrift kører 365 dage om året i udsatte kyst- og havmiljøer. Arbejdsbådene, der bruges til burinspektion, fodertransport, vedligehold af perlelinjer og service af udstyr, udsættes for konstant nedsænkning i saltvand, UV-eksponering og kemisk kontakt fra brændstoffer, fiskefoder og antifoulingbehandlinger.
    - '**Korrosion er hovedfjenden** — Standard maritimt udstyr forringes hurtigt under disse betingelser. Udenbordsmotorer, trailerstel og skrogbeslag skal løbende udskiftes. Operatører har brug for både bygget i korrosionsbestandige materialer, der kan holde i år i dette miljø uden at forringes.'
    - '**Daglig pålidelighed er afgørende** — En defekt arbejdsbåd betyder mistede foderplaner, forsinkede høst og kostbare produktionstab. For perledrift kan en enkelt mistet inspektionsdag betyde betydelige skader på høsten. For fiskeopdræt påvirker forsinket fodring vækstrater og rentabilitet.'
    - Aquafarer akvakultur-RIB'er er konstrueret med korrosionsbestandigt beslag, ekstra slidstærke Hypalon-tuber og forstærkede skrog, specialbygget til de krævende betingelser inden for fiskeopdræt, perleopdræt og havranching.
content_solution:
  tagline: Vores løsning
  title: Specialbyggede RIB'er<br />Til akvakulturindustrien
  subtitle: Hver Aquafarer akvakultur arbejdsbåd er designet til at modstå aggressive saltvandsmiljøer og samtidig levere pålidelig daglig ydeevne.
  list:
    - Hypalon-tuber i marin kvalitet — overlegen modstandsdygtighed over for UV, saltvand, brændstoffer og kemikalier fra fiskefoder
    - Beslag i rustfrit stål 316 i hele båden — ingen rust ved langvarig saltvandseksponering
    - Forstærkede stødlister og kølbeskytter for gentagen kontakt med kajer og bure
    - Selvlænsende dæk for nem vask og drænering efter fodertransport og høstarbejde
    - Flad dækkonfiguration til transport af fodersække, høstkasser og udstyr
    - Udenbordskonfigurationer fra 15 til 60 hk — optimeret til forholdet mellem lasteevne og brændstofeffektivitet
    - Farvevalg for tuber med høj synlighed for nem genkendelse over store opdrætsområder
content_segments:
  tagline: Akvakulturprofiler
  title: Arbejdsbådsløsninger<br />Efter akvakulturtype
  subtitle: Forskellige akvakulturoperationer har forskellige krav til arbejdsbåde - fra små agile RIB'er til fiskeburinspektion til stabile transportplatforme til perleopdræt og tunge arbejdsbåde til havfarm.
  items:
    - title: Fiskeopdræt
      subtitle: Burinspektion, fodertransport, høststøtte
      description: Marine dambrug opererer bure i udsatte kystnære og offshore lokationer. Arbejdsbåde bruges dagligt til inspektion af burnet, fodringsoperationer, høststøtte og udstyrsvedligeholdelse. Den primære udfordring er korrosion - bådene udsættes konstant for saltvand, fiskefoderrester og brændstof. En pålidelig arbejdsbåd er afgørende, fordi manglende fodring eller forsinket høst direkte påvirker produktionsoutput og rentabilitet.
      features:
        - 'Pakke til aggressive miljøer: beslag i rustfrit stål 316, komponenter i marin legering'
        - Fladt dæklayout til transport af fodersække og høstkasser
        - Selvlænsende dæk for nem afvaskning efter indsatsene
        - Hypalon-tuber med kemikaliebestandig belægning til eksponering for foder og brændstoffer
        - Forstærkede stødlister for hyppig kontakt med bure og kajer
    - title: Perledrift
      subtitle: Stabil transport til perlelinjeinspektion og høst
      description: Perlefarme kræver stabile, pålidelige arbejdsbåde til daglig transport mellem perlelinjer, inspektion af østersnet og høstindsamling. Disse operationer kører på fjerntliggende kystnære steder med begrænset vedligeholdelsesinfrastruktur. Båden skal være stabil nok til, at besætningen kan arbejde fra, mens de inspicerer perlelinjer, med nem boarding og rigelig dæksplads til at transportere høstede østers, net og forsyninger. Pålidelighed og nem vedligeholdelse er afgørende på fjerntliggende bedrifter.
      features:
        - Stabil skrogkonstruktion til stående besætning ved inspektion af perlelinjer
        - Fladt dæk med skridsikker overflade til sikker færdsel for besætningen
        - Lavt fribord for nem adgang til østersnet og høst
        - Enkel udenbordskonfiguration for nem service på stedet
        - Korrosionsbestandigt tube- og beslagpakke til kontinuerlig saltvandseksponering
    - title: Havranching og marin forbedring
      subtitle: Yngeltransport, burservice, overvågningsstøtte
      description: Havfartsoperationer involverer udsætning af unge bestande i forvaltede havmiljøer, overvågning af vækst og servicering af forbedringsstrukturer. Arbejdsbåde skal transportere levende ungdyr i beholdere med luft, bære overvågningsudstyr og få adgang til lavvandede kystnære udsætningssteder. Skrogdesign skal balancere bæreevne med lavt træk for adgang til stranden og flodmundingen.
      features:
        - Dæksområde til luftede transportbeholdere til yngel og overvågningsudstyr
        - Fladgående for adgang til udskætningssteder ved strande og flodmundinger
        - Nem landing på stranden — forstærket køl og bovbeskyttelse
        - Fastgørelsespunkter til overvågningselektronik og prøvetagningsudstyr
        - Ekstra slidstærke Hypalon-tuber til holdbarhed i blandede sand- og saltvandsforhold
