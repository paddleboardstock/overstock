        description: 50-100+ SUP'er, kajakker, vandcykler og bløde RIB'er med fuld tilpasning
      - title: Avanceret sikkerhed
        description: Livreddertårne, radiosystem, redningstavle, AED og nødhandlingsplan
      - title: Gæsteoplevelse
        description: Check-in kiosk, udstyrsdisplay, omklædningshytter, opbevaring ved stranden
      - title: Indtægtsprogram
