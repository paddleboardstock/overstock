hero:
  tagline: Hoteller, feriesteder og gæstfrihed
  title: Premium-oplevelser ved vandet<br />Til hoteller, feriesteder og yachtklubber
  subtitle: Nøglefærdige vandsportsprogrammer til strandhoteller, private ø-resorts, strandklubber og yachtklubber - fra gæsteudstyr og RIB-udbud til sikkerhedssystemer og personaletræning.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer oppustelige både til resort-aktiviteter ved vandet
direct_answer: Aquafarer samarbejder med hoteller, resorts, private øer, strandklubber og yachtklubber verden over for at skabe førsteklasses oplevelser ved vandet. Vores løsninger omfatter SUP-udlejningsflåder, guidede turkajakker, ømme RIB'er til gæstetransport, små luksus-RIB'er til strandklubtransfer og komplette sikkerhedssystemer. Hvert stykke udstyr kan mærkes med dit ejendomslogo og farveskema. Vi tilbyder også personaletræning, programdesignkonsultation og planlægning af flådeudskiftning for at sikre ensartet kvalitet på tværs af sæsoner.
