testimonial:
  content: Aquafarer designede og udstyrede hele vores strandaktivitetsprogram på tværs af tre resortejendomme. 80 SUP'er, 40 kajakker, sikkerhedsinfrastruktur og personaletræning - alt sammen leveret i én forsendelse. Vores gæstedeltagelse i vandaktiviteter steg med 60 % i den første sæson.
  name: Sophie Laurent
  title: Direktør for Guest Experience, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Resort profiler
  title: Waterfront Hospitality Solutions<br />Efter ejendomstype
  subtitle: Hver resortejendom har en unik gæsteprofil, aktivitetsmix og operationel rytme - fra øko-logiske boutique-lodges til vidtstrakte luksusresorts ved stranden. Vi designer vandsportsprogrammer, der matcher ejendomsklassen og gæsternes forventninger.
  items:
    - title: Luksusferiesteder ved stranden
      subtitle: VIP-overførsler, vandaktiviteter, førsteklasses gæsteoplevelse
      description: Avancerede ejendomme ved stranden - Four Seasons, Aman og lignende luksusgrupper - hvor vandsport er et gæstetelt, der driver tilfredshedsscore og tilhørende indtægter. Flåden skal se premium ud, tilbyde variation på tværs af aldersgrupper og færdighedsniveauer og integreres problemfrit med resortets eksisterende concierge- og bookingsystemer. Forventningerne til gæstens udseende er ekstremt høje - udstyrets tilstand og præsentation påvirker 5-stjernede anmeldelser direkte.
      features:
        - 'Premiumbrandet flåde: SUP''er, kajakker, vandcykler og små RIB-tendere'
        - 'Gæsteklar præsentation: resorttilpassede farver, logobranding, iscenesat udstyrsvisning'
        - Lille luksus-RIB til VIP-gæstetransporter med skræddersyet polstring og farvematching
        - 'Integreret sikkerhedsinfrastruktur: bøjeliner, livredderstationer, AED'
        - 'Indtægtsstyring: skabeloner til dynamisk prissætning, mersalgstræning, pakkebundt'
    - title: Private ø-feriesteder
      subtitle: Gæstetransport i al slags vejr — ingen nedetid, absolut pålidelighed
      description: Private ø-resorts opererer på fjerntliggende steder, hvor båden er den eneste forbindelse til fastlandet. Daglige gæsteoverførsler, forsyningskørsler og akutmedicinske evakueringer afhænger af et enkelt fartøj - enhver nedetid påvirker direkte gæstens oplevelse og resortets drift. Disse operatører har brug for en båd, der kører pålideligt under alle vejrforhold, kræver minimal vedligeholdelse og har backup-systemer til missionskritisk pålidelighed. Båden skal også præsentere sig smukt, når gæster ankommer til øen.
      features:
        - RIB-konfiguration til al slags vejr med fuld vejrbeskyttelse og ekstra kraftige rør
        - Tvillingemotorer eller reservemotor til drift uden nedetid
        - Hypalon-konstruktion i kommerciel kvalitet til 5-8 års levetid i drift på afsides steder
        - Vedligeholdelsesvenligt design med tilgængelige komponenter til service på stedet
        - Skræddersyet resortbranding og premium polstring matchet til øens æstetik
    - title: Feriesteder ved søen og økoferiesteder
      subtitle: Naturintegrerede gæsteoplevelser
      description: Ejendomme ved søen, øko-lodges og naturreservater, der tilbyder rolige vandaktiviteter med lav indvirkning, der komplementerer det naturlige miljø. Udstyr bør være ikke-motoriseret, hvor det er muligt, let at opbevare i bådehuse med begrænset plads og stille i brug for at bevare den omgivende oplevelse for alle gæster.
      features:
        - 'Ikke-motoriseret flåde: SUP''er, kajakker, kanoer og vandcykler'
        - Stille oppustningsstationer med el-pumpe til gæstebrug efter behov
        - Miljøvenlige materialer og emballage i overensstemmelse med bæredygtighedsbranding
        - Reolsystemer og organiseringssystemer til bådehuse er inkluderet
    - title: Strandklubber
      subtitle: Gæsteoverførsler, underholdning, små luksus RIB'er
      description: Strandklubber driver et højenergi, visuelt fokuseret miljø, hvor udstyr er en del af atmosfæren. De har brug for små luksus RIB'er til gæstetransfer fra nærliggende hoteller eller havne, og vandlegetøj til gæsteunderholdning - jetski bugsering, oppustelige rutsjebaner og paddle boards. Flåden skal se stilfuld ud, være nem at betjene og modstå daglig brug af gæster med varierende færdighedsniveauer. Opbevaring og hurtig implementering er afgørende i myldretiden.
      features:
        - Kompakt luksus-RIB (3,3-4,3 m) til gæstetransporter og tenderservice
        - 'Vandlegetøj: opblæselige slæbetubes, SUP-brædder og kajakker til gæsternes underholdning'
        - Egen farve og branding matchet til strandklubbens visuelle identitet
        - Systemer til hurtig søsætning og optagning til drift med højt gennemløb
        - Holdbar Hypalon-konstruktion til daglig udsættelse for saltvand og UV
    - title: Private medlemsklubber og yachtklubber
      subtitle: Havnetransport, medlemsudbud, eksklusiv vandsport
      description: Private klubber, hvor vandsport og bådtransport er en medlemsfordel frem for en indtægtsdriver. Udstyr skal opfylde højere æstetiske standarder, være tilgængeligt på efterspørgsel for medlemmer og kræve minimalt medarbejdertilsyn. Marina yachtklubber har specifikt brug for tilbud på havnetransport - flytning af medlemmer mellem kaj, fortøjning og kyst. Opbevaring og vedligeholdelse skal være usynlig for medlemmer.
      features:
        - Eksklusive RIB-tendere til havnetransport og medlemstransporttjeneste
        - 'Premiumudstyr: EVA-dæk, tilpassede medlemsfarver, brandet polstring'
        - Selvbetjent udlånssystem til medlemsadgang uden personale
        - Opbevaring uden for sæsonen og årligt genopfriskningsprogram
    - title: Eventyr- og aktivitetsfokuserede hoteller
      subtitle: Guidede ture, SUP yoga, snorkeludflugter, gruppeaktiviteter
      description: Ejendomme, der positionerer sig som eventyrdestinationer - tilbyder guidede ture, SUP-yoga, solnedgangspadler, snorkeludflugter og gruppeaktiviteter. Flåden skal understøtte både gratis leje og guidede programmodeller med udstyr, der skifter problemfrit mellem gæstens selvbrug og instruktørledede ture. Disse ejendomme har brug for holdbart udstyr til højfrekvent omsætning, med nem rengøring mellem gæstegrupper.
      features:
        - Alsidig blandet flåde, der understøtter udlejnings- + guidede turmodeller
        - Tandemkajakker og ekstra stabile SUP-platforme til gruppeaktiviteter
        - 'Guideudstyr: instruktørbrædder, tørboxe, vandtæt kommunikation'
        - 'Sæsonbaseret udstyrsrotation: sommerflåde → vinterlagringsprogram'
        - Holdbar konstruktion dimensioneret til daglig gæstebrug med minimal vedligeholdelse
