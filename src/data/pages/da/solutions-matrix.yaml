hero:
  tagline: Matrix for industriløsninger
  title: Scenariebaserede marineløsninger<br />Til professionel drift
  subtitle: Formålsudviklede oppustelige vandfartøjer og RIB'er konfigureret til rednings-, udlejningsflåde, yachtudbud og kommercielt fiskeri - hver understøttet af tekniske specifikationer og tilpasningsmuligheder.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock professionelle marineløsninger til forskellige industrier
direct_answer: "Paddle Board Overstock leverer scenarieudviklede oppustelige vandfartøjer og RIB-løsninger til kommercielle marineoperationer: rednings- og patruljebåde med forstærkede Hypalon-rør og flerkammersikkerhed, udlejningsflåde-SUP'er og kajakker med 1,2 mm PVC og varmluftssvejsede sømme for holdbarhed med lav vedligeholdelse, luksus- og luksusskrog, R.L.B. kraftige fiskekonfigurationer med stangholdere og livewell-systemer."
solution_a:
  tagline: Løsning A
  title: Marine Rescue &<br />Kommerciel patrulje
  subtitle: Højhastigheds, flerkammer sikkerheds-RIB'er til professionel nødberedskab og retshåndhævelsesoperationer.
  badge: Heavy-Duty Series
  description: 'Vores marine rednings- og patrulje-RIB''er er konstrueret med forstærkede Hypalon/PVC-luftrør med høj densitet med flerkammer-uafhængig flotationsdesign. Hvert fartøj er udstyret med reflekterende tape af professionel kvalitet, redningsgribeliner og hurtigoppumpede ventiler for at være klar til at blive installeret. Deep-V glasfiberskrog giver enestående stabilitet ved høje hastigheder og under barske havforhold.'
  features:
    - title: Multi-kammer sikkerhed
      description: 4-6 uafhængige luftkamre — enhver enkeltkammerpunktur bevarer en positiv flotation
    - title: Forstærket rørstof
      description: 1,2 mm Hypalon CSM eller 1.680 DTEX PVC med dobbeltlags varmluftsvejsede sømme
    - title: Professionel klasse
      description: SOLAS reflekterende tape, redningsgrebsliner, bugserklemmer, quick-release malerlinje
    - title: Højhastighedsskrog
      description: Deep-V glasfiber eller aluminium skrog vurderet til 25–45 knob afhængigt af konfiguration
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Skrogmateriale
      value: Glasfiber / Marine-grade aluminium
    - label: Rørstof
      value: 1,2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Max hastighed
      value: 25-45 knob
    - label: Kapacitet
      value: 6-12 personer
    - label: Motor rækkevidde
      value: 40-200 HK
    - label: Certificering
      value: CE/ISO 9001
solution_b:
  tagline: Løsning B
  title: Udlejning af vandsport &<br />udstyr til feriestedets flåde
  subtitle: Ultra-holdbare oppustelige SUP'er, kajakker og både med lav vedligeholdelse, bygget til daglig udlejning i resorts, klubber og turoperationer.
  badge: Rental-Grade
  description: Vores udlejningsflådeudstyr er konstrueret til den højeste holdbarhed og laveste vedligeholdelsesomkostninger. Vi bruger 1,2 mm forstærket PVC med trelags varmluftssvejsede sømteknologi, der modstår UV-nedbrydning og hyppige kollisionsskader. Drop-stitch-konstruktion sikrer, at brædder bevarer stivheden selv efter hundredvis af lejecyklusser. Alle modeller har forstærkede D-ringe, slidbestandige skinnebånd og ventiler af kommerciel kvalitet.
  features:
    - title: PVC af kommerciel kvalitet
      description: 1,2 mm forstærket PVC med UV-stabilisatorer — 3x tykkere end materialer af forbrugerkvalitet
    - title: Varmluftsvejsede sømme
      description: Tre-lags fusionssvejsning — stærkere end klæbende limning, modstår delaminering
    - title: Drop-Stitch-stivhed
      description: 1.680 DTEX kerne med 2 gevind/sq in — vurderet til 20 PSI for hardboard-lignende stivhed
    - title: Flådeklar design
      description: Forstærkede D-ringe, kommercielle Halkey-Roberts ventiler, slidbestandige skinnebånd
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Rørmateriale
      value: 1,0–1,2 mm Forstærket PVC
    - label: Søm teknologi
      value: Trelags varmluftsvejsning
    - label: Max tryk
      value: 15–20 PSI (modeller med drop-stitch)
    - label: UV-modstand
      value: 1.000+ timers accelereret test
    - label: Garanti
      value: 2-5 år afhængig af model
    - label: Opretholdelse
      value: Minimal — skyl og opbevar
solution_c:
  tagline: Løsning C
  title: Yachtudbud og<br />luksusvandfartøjer
  subtitle: Letvægts, højtydende RIB-tender designet til superyachtopbevaring og gæstetransport med luksuriøs pasform og finish.
  badge: Premium Series
  description: Vores yacht tender RIB'er kombinerer letvægtskonstruktion med luksus æstetik. Deep-V aluminiums- eller glasfiberskrog giver enestående kørekvalitet og let davitløft. fås med farvematchet rørgrafik, førsteklasses polstring og brugerdefinerede konsollayouts. Kompakte opbevaringsdimensioner gør dem ideelle til superyachtgarage og dækopbevaring.
  features:
    - title: Letvægtskonstruktion
      description: Marine-grade aluminiumsskrog reducerer vægten med 30 % i forhold til glasfiber for let løft
    - title: Deep-V-ydeevne
      description: 18–22 graders skrog i dødhøjde for jævn kørsel i chop og fremragende sporing
    - title: Luksus pasform og finish
      description: Brugerdefineret polstring, farvematchede rør, premium styrekonsol, rustfri pakke
    - title: Kompakt opbevaring
      description: Designet til superyacht-garage – tømmeslange til kompakt opbevaring
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Skrogtype
      value: Deep-V Aluminium / Glasfiber
    - label: Deadrise
      value: 18-22 grader
    - label: Max hastighed
      value: 30-40 knob
    - label: Tørvægt
      value: 120-350 kg (aluminiumsskrog)
    - label: Davit Lift klar
      value: Ja — løftepunkter standard
    - label: Opbevaring
      value: Deflaterbare rør, stabelbare
