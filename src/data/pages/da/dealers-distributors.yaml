hero:
  tagline: Forhandlerprogram
  title: Bliv en Paddle Board Overstock<br />distributør
  subtitle: Partner med en CE-certificeret RIB og oppustelig vandscooterproducent, der betjener mere end 50 lande. Territoriebeskyttelse, marketingstøtte og konkurrencedygtige priser for etablerede marinedistributører.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock forhandler- og distributørprogram
direct_answer: Paddle Board Overstock tilbyder forhandler- og distributionspartnerskaber med områdebeskyttelse, konkurrencedygtige engrospriser, marketingstøttesæt og fuld overholdelsesdokumentation (CE, ISO 9001, BSCI). MOQ starter ved 10-20 enheder pr. ordre med dedikeret kontostyring.
