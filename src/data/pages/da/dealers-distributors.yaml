content_benefits:
  tagline: Partnerskabsfordele
  title: Hvorfor distributører<br />Vælg Paddle Board Overstock
  subtitle: Et partnerskab designet til marinedistributører, der har brug for pålidelig forsyning, konkurrencedygtige avancer og professionel support.
  items:
    - title: Territoriebeskyttelse
      description: Eksklusive eller semi-eksklusive områderettigheder for kvalificerede distributører. Markedskortlægning og kanalkonflikthåndtering for at beskytte din investering i at opbygge Paddle Board Overstock-mærket i din region.
      icon: tabler:map-pin
    - title: Konkurrencedygtige engrospriser
      description: Differentieret prissætning baseret på årlige volumenforpligtelser. Marginbeskyttende prisstruktur med forhåndsprisgarantier og gennemsigtige omkostningsopdelinger (FOB Qingdao-basis).
      icon: tabler:currency-dollar
    - title: Marketingstøttesæt
      description: Professionel produktfotografering, specifikationsark, overholdelsesdokumentationsskabeloner, indhold på sociale medier og co-branded marketingmateriale. Opdateres årligt med nye produktlanceringer.
      icon: tabler:photo
    - title: Teknisk uddannelse
      description: Produkttræning for dit salgsteam (virtuelt eller on-site), vedligeholdelses- og reparationstræning for dine serviceteknikere og kundevendte FAQ og fejlfindingsvejledninger.
      icon: tabler:school
    - title: Reservedele og eftersalg
      description: Dedikeret reservedelsforsyning med prioriteret forsendelse. Udskiftningsrørsektioner, ventiler, finner og reparationssæt til rådighed for hurtig ordreopfyldelse. Support til behandling af garantikrav.
      icon: tabler:tool
    - title: Overholdelsesdokumentation
      description: 'Fuld overensstemmelsesdokumentationspakke til dit marked: CE DoC, byggepladedata, ejermanualer og regulatorisk registreringssupport. Eliminerer din overholdelsesbyrde.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Hvad vi leder efter
  title: Forhandler<br />Krav
  subtitle: Vi søger partnere, der professionelt kan repræsentere og støtte Paddle Board Overstock-produkter i deres område.
  items:
    - title: Territorium og markedsviden
      description: Etableret tilstedeværelse på hav-, vandsports- eller udendørs rekreationsmarkedet. Forståelse af lokale regler, forbrugerpræferencer og distributionskanaler for vandscooterprodukter.
      icon: tabler:target
    - title: Brancheerfaring
      description: Minimum 2 års erfaring med distribution af marine-, udendørs- eller sportsudstyr. Dokumenteret track record med internationale mærker og B2B engrosdrift.
      icon: tabler:briefcase
    - title: Showroom eller lager
      description: Fysisk facilitet til produktvisning, lageropbevaring og kundeservice. Evne til at vedligeholde demo-enheder og reservedelsbeholdning for dit område.
      icon: tabler:building-store
    - title: Forpligtelse til brandstandarder
      description: Vilje til at opretholde Paddle Board Overstock-mærkepræsentationsstandarder, yde kundesupport i henhold til vores serviceprotokoller og deltage i årlige produkttræningsopdateringer.
      icon: tabler:star
content_process:
  tagline: Ansøgningsproces
  title: 4-trins forhandler<br />Ansøgningsproces
  subtitle: Fra indledende forespørgsel til første forsendelse - en ligetil onboarding-proces.
  steps:
    - number: '01'
      title: Indledende forespørgsel & kvalifikation
      description: Indsend din distributøransøgning med virksomhedsoplysninger, interesseområde, aktuelle produktlinjer og årlige mængdeoverslag. Vi gennemgår inden for 5 hverdage.
      timeline: 5 dage
    - number: '02'
      title: Virksomhedsanmeldelse og vilkår
      description: Virtuelt møde for at diskutere områdestrategi, prisniveauer og partnerskabsvilkår. Gennemgå overholdelsesdokumentationskravene for dit marked. NDA-signering, hvis det er nødvendigt.
      timeline: 1-2 uger
    - number: '03'
      title: Prøvebestilling og evaluering
      description: Afgiv en første prøveordre (2-5 enheder) til distributørpriser til markedsevaluering og teamtræning. Fuld overholdelsesdokumentation og demoforberedelse inkluderet.
      timeline: 30-45 dage
    - number: '04'
      title: Lancering og support af partnerskab
      description: Første containerordre med områdebeskyttelse aktiveret. Marketingsæt leveret, salgsteam uddannet og dedikeret account manager tildelt. Løbende kvartalsvise forretningsgennemgange.
      timeline: Løbende
content_application_docs:
  tagline: Ansøgningsdokumenter
  title: Dokumenter der kræves<br />til forhandleransøgning
  subtitle: For at ansøge om et Paddle Board Overstock-forhandlerskab, bedes du forberede følgende dokumenter og oplysninger til vores gennemsynsteam.
  items:
    - title: Virksomhedsregistreringsbevis
      description: Gyldigt virksomhedsregistreringsdokument, der viser juridisk navn, registreret adresse og forretningsomfang, der dækker distribution af marin-, sport- eller outdoorudstyr.
      icon: tabler:file-text
    - title: Territoriedækningsplan
      description: Geografisk interesseområde, eksisterende detail- eller distributionsnetværk, mål kundesegmenter og foreslået årligt volumen pr. produktkategori (RIB, SUP, kajak).
      icon: tabler:map
    - title: Showroom- eller lagerkapacitet
      description: Fysiske lokaler til produktvisning, lagerhold og kundeservice. Fotos eller plantegninger, der viser demoareal og lagerkapacitet til reservedele.
      icon: tabler:building
    - title: Erklæring om økonomisk formåen
      description: 'Bankreference eller regnskab, der bekræfter evnen til at afgive en initial containerordre og opretholde lager. Minimumsinitialordre: én 20-fods container (10-20 enheder, blandede modeller).'
      icon: tabler:coin
    - title: Kapacitet for eftersalgsupport
      description: Serviceteknikere, der er uddannet eller kan oplæres i vedligeholdelse og reparation af oppustelige både. Evne til at behandle garantikrav og forpligtelse til reservedelslager.
      icon: tabler:tool
    - title: Referencer fra tidligere brands
      description: Liste over marin- eller sportsbrands, der i øjeblikket eller tidligere distribueres. Kontaktreferencer tilgængelige efter gensidig aftale. Startups uden tidligere distributionserfaring kan kvalificere sig med et stærkere økonomisk engagement.
      icon: tabler:users
faq:
  title: Forhandlerprogram — ofte stillede spørgsmål
  questions:
    - q: Hvad er minimumsordremængden for distributører?
      a: Distributør MOQ starter ved 10-20 enheder pr. ordre, med fleksibilitet til blandede modeller (RIB, oppustelig, SUP). Indledende prøveordrer på 2-5 enheder er tilgængelige til distributørpriser til markedsevaluering.
    - q: Tilbyder du eksklusive territoriumrettigheder?
      a: Eksklusive områderettigheder er tilgængelige for kvalificerede distributører, der opfylder årlige volumenforpligtelser og opretholder mærkestandarder. Semi-eksklusive og ikke-eksklusive arrangementer er også tilgængelige for nye markeder.
    - q: Hvilken markedsføringsstøtte yder du?
      a: Vi leverer et omfattende marketingsæt, herunder professionel produktfotografering, specifikationsark, overholdelsesdokumentationsskabeloner, indholdsbibliotek på sociale medier og co-brandede materialer. Opdateres årligt med nye produktlanceringer.
    - q: Hvordan håndteres garantikrav?
      a: 'Distributører fungerer som det første kontaktpunkt for garantikrav. Vi leverer klare garantikriterier, fotodokumentationsprotokoller og hurtig udskiftning eller kreditbehandling. Garantibetingelser: 5-års begrænset på bådrørstof/sømme/skrog; 2-år på SUP og tilbehør.'
    - q: Kan jeg private mærke Paddle Board Overstock-produkter under mit eget mærke?
      a: Ja, gennem vores OEM/ODM-program. Private label-muligheder omfatter tilpasset rørgrafik, konsolbranding, detailemballage og overholdelsesdokumentation under dit varemærke. Se vores OEM/ODM-serviceside for detaljer.
    - q: Hvilken overholdelsesdokumentation er inkluderet for distributører?
      a: Hver forsendelse inkluderer modelspecifik CE DoC, byggepladedata, ejermanualer og forsendelsesdokumentation. Vi yder også lovpligtig registreringssupport for dit område og hjælper med eventuelle lokale overholdelseskrav.
