content_challenge:
  tagline: Udfordringen
  title: Yachttendere kræver<br />ydeevne og fremtoning
  subtitle: En yachttender er mere end en jolle — den er en forlængelse af moderskibet og et kvalitetsstatement.
  paragraphs:
    - Yachtejere og kaptajner har brug for bud, der fungerer godt, opbevarer kompakt og præsenterer smukt. Udbuddet skal komplementere yachts æstetik og samtidig give pålidelig transport for gæster og besætning.
    - "**Opbevaring er kritisk** — Buddet skal passe på dækket, i en garage eller på daviter. Vægt betyder noget for lancerings- og genoprettelsessystemer. Aquafarer RIB'er tilbyder fremragende kraft-til-vægt-forhold med kompakte opbevaringsprofiler."
    - '**Ydeevneforventningerne er høje** — Gæster forventer en jævn, tør tur, når de bliver overført til land. Motoroptionerne skal balancere hastighed, rækkevidde og støjniveauer for en førsteklasses oplevelse. Ved charterdrift løber udbuddet dagligt og skal tåle hyppig brug.'
    - '**Udseende betyder noget** — Et uoverensstemmende eller slidt bud forringer den overordnede yachtpræsentation. Brugerdefinerede rørfarver, polstring og branding sikrer, at buddet ser ud som om det hører hjemme.'
content_solution:
  tagline: Vores løsning
  title: Udbudskonfigurationer<br />For enhver yachtapplikation
  subtitle: Aquafarer RIB bud kan tilpasses til at matche dit fartøj, driftstype og opbevaringskrav - fra superyachtbyggerspecifikationer til charterflådeprogrammer.
  list:
    - Brugerdefinerede rørfarver, der matcher eller komplementerer moderkarret - enhver RAL-farve tilgængelig for Hypalon eller PVC rør
    - Brugerdefineret polstring og syning — førsteklasses vinyl i marinekvalitet med farvematchning og logobroderi
    - Konsol eller rorpindsstyring — vælg baseret på brugsmønster og førerens præference
    - Glasfiber deep-V skrog til jævn, tør tur under varierende havforhold
    - Kompakt opbevaring - tømmes for luft eller indlejrer til dækgarage, skab eller davitopbevaring
    - Hypalon-rør til UV-resistens og langtidsbevarelse af udseendet
    - Løftepunkter og trækringe standard på alle modeller
    - Mulighed for sløjfebetræk, heldæksel og beskyttende gnidningsbeskyttelse
    - 'Motorområde: 15 HP til 60 HP — påhængsmotor eller styrestangskonfigurationer'
    - OEM/privat mærkning tilgængelig for yachtbyggere og marineforhandlere
content_segments:
  tagline: Kundeprofiler
  title: Yacht Tender Solutions<br />Efter kundetype
  subtitle: Forskellige yachtindustrisegmenter har unikke krav. Aquafarer konfigurerer tilbud til at matche hver applikation.
  items:
    - title: Superyachtbyggere
      subtitle: OEM tilbudsintegration — brugerdefinerede dimensioner, farver og materialer
      description: 'Yachtbyggere står over for en tilbagevendende udfordring: Hvert nyt fartøj har unikke dimensionelle begrænsninger, vægtgrænser og æstetiske forventninger. Buddet skal integreres perfekt med moderfartøjets davit-system, passe inden for præcise garagedimensioner og matche designsproget på en multi-million-euro yacht. Enhver uoverensstemmelse - forkert rørfarve, forkert placering af løftepunktet, inkompatibel vægt - forsinker leveringen og reflekterer dårligt på bygherren. Aquafarer arbejder direkte med bygherrers indkøb og designteams for at levere tilbud med tilpassede RAL-rørfarver, matchende polstring, mærkede konsolpaneler og komplette OEM dokumentationspakker.'
      features:
        - Brugerdefinerede dimensionelle specifikationer, der matcher garage- og davit-begrænsninger
        - Enhver RAL-rørfarve og matchende polstring — designgodkendelsesprøver leveres
        - OEM branding på konsol, rør og sæderyg
        - Løftepunkt og davit pasform validering for hver model
        - Skrogvægt optimeret til specificerede affyrings- og genopretningssystemer
        - Masseleveringsplanlægning tilpasset produktionstidslinjer
    - title: Yacht Management virksomheder
      subtitle: Flådestandardiserede udbud — global support, minimal nedetid
      description: Administrationsselskaber fører tilsyn med flere yachter, der opererer på tværs af Middelhavet, Caribien, det sydlige Stillehav og videre. Deres kernebehov er pålidelighed - et ødelagt bud i en fjerntliggende havn betyder overarbejde, gæsteklager og dyre udskiftninger i sidste øjeblik. Standardiserede flådespecifikationer reducerer besætningens træningstid på tværs af skibe og forenkler håndtering af reservedele. Aquafarer tilbyder flådepriser for flere fartøjer, ensartede specifikationer på tværs af ordrer og global reservedelssupport til administrationsselskaber med skibe i flere regioner.
      features:
        - Standardiserede specifikationer på tværs af hele administrerede flåde
        - Udskiftelige reservedele på tværs af alle flådeudbud
        - Flådepriser og mængderabatter for ordrer med flere enheder
        - Global tilgængelighed af reservedele — hurtig forsendelse til enhver havn
        - Konsekvent service- og vedligeholdelsesdokumentation for besætningen
        - Leveringskoordinering af flere enheder til forskellige fartøjslokationer
    - title: Yacht charter operatører
      subtitle: Højfrekvente daglige operationer — holdbarhed uden at gå på kompromis med udseendet
      description: 'Charterudbud står over for den mest straffende operationelle tidsplan i yachtindustrien: daglige gæsteoverførsler, landture, støtte til vandsport og havneudbud - ofte 200+ operationer pr. chartersæson. Tilbuddet skal se uberørt ud for hver gæsteoverdragelse, mens det modstår kontinuerlig boarding, saltvandseksponering og motortimer. Udseendeforringelse er en direkte forretningsmæssig bekymring - et slidt bud påvirker gæsteanmeldelser og charterpriser. Aquafarer konfigurerer charterudbud med opgraderet polstring, kraftige Hypalon-rør og forstærkede håndteringsområder for langsigtet holdbarhed, der bevarer præsentationskvaliteten.'
      features:
        - Kraftige Hypalon rør — 5-8 års levetid i daglig charterservice
        - Forstærkede påstigningstrin og håndteringsgrabber til hyppig brug
        - Førsteklasses pletafvisende vinylpolstring — nem rengøring mellem chartre
        - Let at rengøre skridsikre dækoverflader
        - Pålidelige påhængsmotorpakker med nem serviceadgang for tæt kørsel
        - Materialer af kosmetisk kvalitet, der bevarer udseendet på tværs af chartersæsoner
    - title: Yachtforhandlere og -mæglere
      subtitle: Pålidelig tilbudsforsyning for skibsfærdiggørelse og gensalgsværdi
      description: Forhandlere og mæglere har brug for et stabilt udbud af kvalitetsudbud, der komplementerer de fartøjer, de sælger - matchende brandpositionering og forbedrer køberoplevelsen. Et inkonsekvent tilbud eller leveringsforsinkelse kan forsinke en yachtoverdragelse eller formindske en præsentation af en liste. Forhandlere kræver ensartet kvalitet på tværs af batcher, pålidelige leveringstider og konkurrencedygtige priser for at opretholde marginer. Aquafarer tilbyder forhandlerbeholdningsprogrammer med sæsonbestemt leveringsplanlægning, co-branding-muligheder for showroom-udstilling og prioritetstildeling i højsæsonen.
      features:
        - Lagerbeholdningsprogrammer med tilgængelige-on-demand modeller
        - Sæsonbestemt leveringsplanlægning tilpasset overdragelseskalender
        - Forhandler co-branding på konsol og rør til showroom display
        - Ensartet kvalitet og specifikationer på tværs af alle batchordrer
        - Konkurrencedygtige forhandlerpriser med volumenbaseret niveau
