hero:
  tagline: Myndighedscenter
  title: Hvorfor Paddle Board Overstock?<br />Tillid bygget over et årti
  subtitle: Hver båd, vi bygger, bærer vægten af mere end 10 års marineteknik, certificerede kvalitetssystemer og tusindvis af succesfulde operationer verden over. Det er derfor, branchefolk vælger Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock marine produktionsfacilitet og ingeniørteam
stats:
  title: Paddle Board Overstock efter antal
  stats:
    - title: År i drift
      amount: Since 2012
    - title: R&D ingeniører
      amount: 50+
    - title: Betjente lande
      amount: 50+
    - title: Udstyr leveret
      amount: 15,000+
features3_brand:
  tagline: Hvem vi er
  title: Mærkegrundlag og<br />-arv
  subtitle: Historien, ekspertisen og den globale rækkevidde, der definerer Paddle Board Overstock som en pålidelig producent af marineudstyr.
  isBeforeContent: false
  columns: 3
  items:
    - title: Om Paddle Board Overstock
      description: Grundlagt i 2012 i Qingdao, Kina. Fra et kystværksted til et 12.000 m² stort anlæg - hele Paddle Board Overstock-historien.
      icon: tabler:building-factory
      link: /about
    - title: Vores brands historie
      description: Hvordan et team af marineingeniører satte sig for at gøre oppustelige vandfartøjer i professionel kvalitet tilgængelige over hele verden.
      icon: tabler:book
      link: /brand-story
    - title: Marine industri ekspertise
      description: Dyb materialevidenskab, præcisionsfremstilling og test i den virkelige verden - årtiers skibsteknik i hvert skrog.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Global tilstedeværelse
      description: Betjener mere end 50 lande på tværs af alle kontinenter. Regional ekspertise til lokale regulatoriske krav og markedspræferencer.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Hvorfor Paddle Board Overstock
      description: Hvad adskiller os - kvalitet, tilpasning, direkte fabrikspriser og end-to-end support til kommercielle operatører.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Vores team
      description: Mød lederskabet - marineingeniører, materialeforskere og produktionseksperter, der driver Paddle Board Overstock fremad.
      icon: tabler:users
      link: /brand/team
    - title: Ingeniørteam
      description: 78+ kombinerede R&D-år, 40+ platforme, 12 certificeringer, 1200+ OEM-projekter. Det tekniske team bag hvert produkt.
      icon: tabler:engine
      link: /engineering-team
    - title: R&D Center
      description: Skrogteknik, RF-svejsning, PVC-laboratorium, prototyping, testtank og kvalitetslaboratorium - vores fulde forsknings- og udviklingsfacilitet.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Tillid & Kvalitet
  title: Certificeringer, kvalitet<br />og bevis
  subtitle: Uafhængige certificeringer, strenge tests og ægte beviser, der viser vores forpligtelse til kvalitet.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certificeringer
      description: CE, ISO 9001, UKCA, BSCI, REACH — fuld certificeringsdokumentation og overholdelse for globale markeder.
      icon: tabler:shield-check
      link: /certifications
    - title: Kvalitet & Test
      description: Hvert produkt tryktestet før forsendelse. Sømstyrke, UV-modstand, opdrift - verificeret på hvert trin.
      icon: tabler:clipboard-check
      link: /quality
    - title: Beviser og beviser
      description: Testresultater, implementeringsfotos, tredjepartsinspektionsrapporter og casestudier, der validerer Paddle Board Overstock-kvaliteten.
      icon: tabler:file-check
      link: /evidence
    - title: Vidensgraf
      description: Udforsk Paddle Board Overstock-enhedsgrafen - produkter, teknologier, certificeringer og relationer i en forbundet videnbase.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Ledelse
  title: Mød holdet<br />Bag Paddle Board Overstock
  subtitle: Brancheekspertise, der spænder over havteknik, materialevidenskab, kvalitetsstyring og global B2B-handel.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Grundlægger og administrerende direktør
      description: 15+ år i marineproduktion. Tidligere ledet R&D hos en stor kinesisk bådproducent. Har flere patenter i oppustelig båddesign.
      icon: tabler:crown
    - title: Zhang Wei - chefingeniør
      description: 20+ år i PVC/Hypalon-fremstilling og dyb-V-skrogdesign. Tidligere teknisk direktør hos et europæisk skibsingeniørfirma.
      icon: tabler:engine
    - title: Chen Ming — Leder af R&D
      description: Ph.d. i materialevidenskab. Specialiseret i drop-stitch teknologi og højfrekvent svejsning. 10+ år i tekstilkompositter.
      icon: tabler:flask
    - title: Liu Qiang — Produktionsdirektør
      description: 18+ år i lean manufacturing. Six Sigma sort bælte. Implementerede ISO 9001 kvalitetssystemer på tværs af alle produktionslinjer.
      icon: tabler:settings
    - title: Wang Fang — Kvalitetschef
      description: 12+ år i marine kvalitetskontrol. Certificeret CE og ISO revisor. Overvåger test for hver produktionsbatch.
      icon: tabler:shield-check
    - title: Helen Lee - salgsdirektør
      description: 15+ år i international B2B handel. Administreret OEM/ODM-partnerskaber på tværs af 30+ lande. Flydende i 4 sprog.
      icon: tabler:briefcase
cta:
  title: Vil du bekræfte vores legitimationsoplysninger?
  subtitle: Kontakt os for certificeringskopier, tredjepartsinspektionsrapporter eller for at planlægge et fabriksbesøg.
  actions:
    - variant: primary
      text: Anmod om legitimationsoplysninger
      href: /contact
    - text: Se certificeringsdetaljer
      href: /certifications
