      text: Book en Live Factory Video Tour
      href: /contact
    - text: Anmod om QC-tjekliste
      href: /contact
content_audit_evidence:
  tagline: Verifikationsbevis
  title: Revisionsbevis<br />Du kan verificere på stedet
  subtitle: Under fabriksbesøg kan kunder verificere specifikke beviser på hvert produktionsområde. Her er, hvad du skal kigge efter - og hvad vi forbereder til hver revision.
  areas:
    - area: Råvarelager
      what_to_verify: Er materialer stabile? Er der batchblanding?
      evidence: Indgående inspektionsoptegnelser, batchetiketter, FIFO-opbevaring, leverandørgodkendelsesliste, materialecertifikater (PVC, Hypalon, glasfiber, aluminium, klæbemidler, hardware)
      icon: tabler:building-warehouse
    - area: Tubeproduktion
      what_to_verify: Hvordan garanteres sømstyrke og lufttæthed?
      evidence: Proceskort, bekræftelse af første artikel, tryktestregistreringer pr. kammer, reparations- og gentestlogfiler, ventilinstallationsjournaler
      icon: tabler:flame
    - area: Skrogproduktion
      what_to_verify: Hvordan kontrolleres strukturel sammenhæng?
      evidence: Kontrollerede procesdokumenter, kvalitetskontrolpunkter, nummerering af halvfabrikata, målinger af gelcoattykkelse, verifikation af lamineringsplan
      icon: tabler:layers-subtract
    - area: Montageområde
      what_to_verify: Hvordan forhindres valgfrie dele i at samles forkert?
      evidence: Stykliste, arbejdsordrer, konfigurationstjeklister, arbejdsstationsinspektionskort, drejningsmoment og funktionstjek pr. model
      icon: tabler:tool
    - area: Teststation
      what_to_verify: Hvordan bekræfter du, at båden er god inden levering?
      evidence: Testprocedurer, instrumentliste, kalibreringsregistreringer, tryktestlogfiler (1,25x / 24-48 timer), funktionelle testtjeklister, dokumenteret beståede/ikke-beståede kriterier
      icon: tabler:gauge
    - area: Uoverensstemmelsesområde
      what_to_verify: Hvordan håndteres mangler?
      evidence: Isolationsetiketter, NCR-logfiler, rodårsagsanalyse, genopbygningsgodkendelsesposter, CAPA-sporing (korrektiv og forebyggende handling)
      icon: tabler:alert-triangle
    - area: Færdigvarelager
      what_to_verify: Hvordan forhindrer du fejlforsendelse og skader?
      evidence: Færdige produktetiketter, ordrematchende optegnelser, emballagestandarder, inspektionsoptegnelser før forsendelse
      icon: tabler:box
    - area: Reservedele og eftersalg
      what_to_verify: Kan du støtte langsigtet eftersalg?
      evidence: Fælles reservedelsliste, lagerstrategi, delnummereringssystem, garantiprocesdokumentation, vedligeholdelsesvejledninger
      icon: tabler:headset
content_closing_script:
  tagline: Revision på bestilling
  title: Fra fabriksbesøg<br />til bekræftet projekt
  subtitle: En vellykket revision bør ikke ende med billeder og et håndtryk. Inden afrejse sikrer vi, at tre kommercielle resultater er dokumenteret.
  items:
    - title: Bekræft teknisk konfiguration
      description: Aftal model, applikation, nøglemuligheder, målmarked, anslået mængde og leveringsplan - alt sammen dokumenteret før afgang.
      icon: tabler:checklist
    - title: Bekræft næste trins dokumenter
      description: 'Definer, hvad Aquafarer giver næste gang: revideret GA, konfigurationsliste, tilbud, dokumenttjekliste, prøveplan eller NDA - med specifikke tidslinjer.'
      icon: tabler:file-plus
    - title: Bekræft gensidig tidslinje
      description: Revideret konfiguration og foreløbigt tilbud inden for 3 arbejdsdage. Prøve eller udseende bekræftelse inden for 7 dage. Teknisk gennemgang eller tredjepartsinspektion inden for 14 dage. Næste mødedato og ansvarlige parter låst.
      icon: tabler:calendar

