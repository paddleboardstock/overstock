content_priorities:
  tagline: Hvad kunder bekræfter
  title: 8 ting, købere bekræfter<br />ved hvert fabriksbesøg
  subtitle: Baseret på feedback fra 50+ landekøbere er dette de otte prioriteter, kunder vurderer, før de afgiver en B2B-ordre.
  items:
    - title: Rigtig producent
      description: 'Er du den egentlige fabrik, ikke en handelsvirksomhed? Købere tjekker: forretningsenhed, rigtigt produktionsudstyr, medarbejdere, der betjener maskiner, aktuelle produktionsordrer på gulvet og sammenhæng mellem websted og værksted.'
      icon: tabler:building-factory
    - title: Produkt egnet til anvendelse
      description: Passer RIB'en til deres specifikke anvendelsestilfælde? Resort-, rednings-, dyknings-, fiskeri- og patruljeoperatører har fundamentalt forskellige krav. Købere vurderer dækslayout, rørmateriale og udstyrsmuligheder på den viste båd.
      icon: tabler:target
    - title: Kvalitetsstabilitet og reproducerbarhed
      description: Er den 50. enhed lige så god som den 1.? Købere undersøger QC-systemer, kontrolpunkter i processen, håndtering af afvigelser og beder om at se registreringer fra flere produktionskørsler for at verificere sammenhængen.
      icon: tabler:repeat
    - title: Overholdelsesdokumentets ægthed
      description: Er CE-certifikater modelspecifikke? Er DoC underskrevet af en rigtig person? Kan overensstemmelse verificeres pr. skrognummer? Købere tjekker for generelle krav i forhold til modelspecifik dokumentation.
      icon: tabler:file-certificate
    - title: Tilpasningsudførelse
      description: Kan fabrikken rent faktisk levere tilpassede konfigurationer? Købere leder efter beviser på tidligere tilpassede projekter, prototypeprøver på displayet, tekniske tegninger og evnen til at diskutere tekniske ændringer på stedet.
      icon: tabler:adjustments
    - title: Ledetid og kapacitet
      description: 'Er citerede tidslinjer realistiske? Købere vurderer: nuværende produktionsvolumen, tilgængelig kapacitet, arbejdsstyrkens størrelse, materialelagerniveauer, og om fabrikken har et produktionsplanlægningssystem.'
      icon: tabler:clock
    - title: Pris & Handelsbetingelser
      description: 'Er priserne gennemsigtige? Er FOB-priser klar? Købere verificerer: enhedsprisopdeling, værktøjsomkostninger, emballeringsomkostninger og om fabrikken kan håndtere DDP- eller CIF-vilkår med korrekt eksportdokumentation.'
      icon: tabler:currency-dollar
    - title: Eftersalg og reservedele
      description: 'Hvad sker der efter levering? Købere vurderer: tilgængelighed af reservedele, garantiproces, udskiftning af rørsektioner, ventiludskiftning og om fabrikken har en dokumenteret eftersalgsprotokol.'
      icon: tabler:headset
content_tour:
  tagline: Fabriksrundvisningsrute
  title: Revisionstur —<br />Hvad du vil se
  subtitle: Vores standard fabriksrundvisning følger en defineret rute designet til at besvare købers spørgsmål på hver station.
  items:
    - title: 1. Mødelokale — Virksomhedsintroduktion
      description: Virksomhedslicens, ISO 9001 og BSCI-certifikater, eksportlicenser og virksomhedens historie. Hurtigt overblik over produktionskapaciteter og compliance-omfang.
      icon: tabler:users
    - title: 2. Råvarelager — IQC Station
      description: Indgående materialeinspektionsoptegnelser, stofbatchcertifikater, klæbemidler og hardwareprøver. Se, hvordan materialer testes, inden de går i produktion.
      icon: tabler:building-warehouse
    - title: 3. Rørfremstilling — RF-svejsning og håndlimning
      description: Svejse- eller limproces med levende rør, demonstrationer af sømstyrketest og ventilinstallation. Overhold kammer-for-kammer konstruktion og kvalitetskontrolpunkter.
      icon: tabler:flame
    - title: 4. Skroglaminering — GRP-værksted
      description: Glasfiberoplægningsproces, gelcoatpåføring og skroghærdning. Se lamineringsskemaet og strukturel forstærkning for forskellige RIB-modeller.
      icon: tabler:layers-subtract
    - title: 5. Montering & Integration
      description: Skrog-rørsamling, installation af konsol og sæde, integration af elektriske og brændstofsystemer og udstyrsmontering. Overhold produktionslinjen i drift.
      icon: tabler:tool
    - title: 6. Trykprøvestation
      description: 24-48 timers trykholdetest ved 1,25x nominelt tryk. Se testregistreringer, trykmålere og bestået/ikke bestået kriterier. Se, hvordan testresultater er knyttet til skrogets serienumre.
      icon: tabler:gauge
    - title: 7. Endelig inspektion & QC
      description: 100-punkts kvalitetstjekliste pr. enhed, dimensionskontrol, kosmetisk inspektion og emballageintegritetskontrol. Gennemgå afvigelseslogfiler og korrigerende handlingsregistre.
      icon: tabler:clipboard-check
    - title: 8. Dokumentgennemgangsrum
      description: Overensstemmelsesdokumentation pr. model (DoC, byggeplade, ejermanual), produktionssporbarhedsregistreringer, HIN-registrering og demonstration af materialebatchsporingsdatabase.
      icon: tabler:folder
content_qc_chain:
  tagline: Kvalitetsbevis
  title: 8-trins QC-kæde<br />— Verificerbar ved hvert trin
  subtitle: Vores kvalitetskontrolkæde strækker sig fra indgående materialer til endelig forsendelse, med dokumenteret bevis på alle stadier.
  items:
    - title: 'Trin 1: Inspektion af indgående materiale'
      description: Hvert parti af PVC, Hypalon, glasfiber, aluminium, klæbemidler og hardware testes i forhold til specifikationerne, før de går i produktion. Trækstyrke, belægningsvedhæftning og dimensionskontrol i henhold til AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Trin 2: Rørsvejsning / limning QC'
      description: Afrivningsstyrketestning pr. produktionsbatch. RF-svejseparametre overvåges og registreres. Håndlimede sømme kontrolleret for ensartet klæbemiddeldækning og hærdetid.
      icon: tabler:flame
    - title: 'Trin 3: Skroglaminering QC'
      description: Måling af gelcoattykkelse, glasfiberoplægningsverifikation i henhold til laminatplan og overvågning af hærdetid. Strukturelle forstærkningspositioner verificeret i forhold til tekniske tegninger.
      icon: tabler:layers-subtract
    - title: 'Trin 4: Montering og integration QC'
      description: Skrog-rørsamlingsintegritet, konsol- og sædemonteringsmoment, elektrisk kontinuitet og lækagetest af brændstofsystemet. Hvert installationspunkt verificeret i forhold til den modelspecifikke samlingstjekliste.
      icon: tabler:tool
    - title: 'Trin 5: Trykhold test'
      description: Hvert oppustelige kammer blev sat under tryk til 1,25x nominel PSI og holdt i 24-48 timer. Trykfald registreret pr. kammer. Bestået/ikke-bestået grænsen dokumenteret. Linket til skrogets serienummer.
      icon: tabler:gauge
    - title: 'Trin 6: Slutinspektion'
      description: 100-punkts kvalitetstjekliste, der dækker dimensionsnøjagtighed, kosmetisk finish, komplet tilbehør, dokumentationspakke og emballageintegritet. Uafhængig af produktionsteamet.
      icon: tabler:clipboard-check
    - title: 'Trin 7: Overholdelsesdokumentation'
      description: Modelspecifik DoC, byggepladebekræftelse, fuldstændighed af ejermanualen og HIN-registrering. Alle overensstemmelsesdokumenter udarbejdet og verificeret før frigivelse af forsendelse.
      icon: tabler:file-certificate
    - title: 'Trin 8: Forsendelsesfrigivelse og sporbarhed'
      description: Den endelige udgivelse kræver, at alle QC-stadier er bestået, overholdelsesdokumentation komplet og forsendelsesdokumentation verificeret. Skrogregistrering lukket og arkiveret til 10+ års opbevaring.
      icon: tabler:truck
content_traceability:
  tagline: Produktionssporbarhed
  title: HIN → Master File →<br />Skrog Record → Levering
  subtitle: Hver RIB-båd har et unikt skrogidentifikationsnummer, der er knyttet til en komplet produktions- og overholdelsesregistreringskæde.
  items:
    - title: Skrogidentifikationsnummer (HIN)
      description: 14-karakters unik identifikator permanent markeret på hver båd. Koder producentkode (MIC), modelbetegnelse, produktionsår og serienummer. Nøglen, der låser op for den fulde sporbarhedskæde.
      icon: tabler:hash
    - title: Master teknisk fil
      description: Overensstemmelses- og teknisk dokumentation for modelfamilien. Indeholder GA-tegninger, risikovurdering, stabilitetsberegninger, materialespecifikationer og gældende standarder. Forbundet til alle skrog af den model.
      icon: tabler:folder
    - title: Individuel skrogrekord
      description: 'Produktionsrekord pr. skrog: HIN, produktionsdato, rørbatch, materialecertifikater, tryktestresultat, endelig konfiguration, motorspecifikation, kvalitetstjeklisteresultater og leveringsdestination. 21+ datafelter pr. skrog.'
      icon: tabler:file-description
    - title: Kundeoverholdelsespakke
      description: Leveringspakke pr. skrog inklusive DoC, byggepladefoto, ejermanual, overholdelsestjekliste og endeligt konfigurationsark. Sendt med båden og arkiveret på fabrikken i 10+ år.
      icon: tabler:package
content_red_flags:
  tagline: Revision faldgruber
  title: Købere med røde flag<br />Nemt at finde
  subtitle: Almindelige problemer, der underminerer købers tillid under fabriksrevisioner. Vi henvender os proaktivt til hver enkelt.
  items:
    - title: Tæppe CE-krav uden modelomfang
      description: '"Alle produkter CE-certificeret" uden at angive hvilket direktiv, hvilke modeller og hvilket overensstemmelsesmodul. Rødt flag: antyder, at overholdelse er overfladisk snarere end pr. model, pr. konfiguration.'
      icon: tabler:alert-triangle
    - title: Ingen fysiske testbeviser
      description: 'Tryktestkrav uden testregistreringer, målere eller teststation synlige på fabriksgulvet. Rødt flag: Kvalitetskrav kan ikke verificeres under besøget.'
      icon: tabler:alert-triangle
    - title: Manglende materialesporbarhed
      description: 'Ingen batch-registreringer, ingen indgående inspektion eller ingen forbindelse mellem materialecertifikater og færdige produkter. Rødt flag: ingen måde at spore kvalitetsproblemer til kilden.'
      icon: tabler:alert-triangle
    - title: Generisk dokumentation
      description: 'Ét DoC, der dækker alle modeller, ingen HIN-specifikke optegnelser eller "skabelon"-overensstemmelsesdokumenter. Rødt flag: Overholdelse er ikke bundet til individuelle produktionsenheder.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Forsendelse og emballering
  title: Containerindlæsning og emballering<br />af RIB-både
  subtitle: Vores forsendelsesløsninger beskytter din investering fra Qingdao til destinationshavnen. Indlæsningsplaner og emballagespecifikationer tilgængelige for hver model.
  items:
    - title: 20-fods containerkonfigurationer
      description: 'Standard 20-fods container: 1-2 RIB-både (4,0-5,5 m) placeret i hinanden med adskilt dæk og tuber, eller 8-12 SUP-brætter. Blandede RIB + SUP-konfigurationer tilgængelige. Detaljeret indlæsningsplan ved hver ordre.'
      icon: tabler:box
    - title: 40-fods containerkonfigurationer
      description: 'Standard 40-fods container: 2-4 RIB-både (op til 7,0 m) med skrog placeret i hinanden og stablede tuber, eller 20-30 SUP-brætter. 40-fods HQ tilgængelig til højere RIB-modeller. Volumenoptimeret emballering reducerer fragtomkostningen pr. enhed.'
      icon: tabler:container
    - title: Trækasser til RIB-skrog
      description: Aluminium- og GRP-skrog emballeret i specialfremstillede trækasser med skumpolstring, fugtspærre og stålbånding. Kassedimensioner og vægt pr. model tilgængelige til logistisk planlægning. ISPM-15-certificering af varmebehandlet træ inkluderet.
      icon: tabler:wood
    - title: Emballering med adskilt tuber og dæk
      description: Tuber tømt og foldet separat fra skrogene for pladseffektivitet. Dæksplader, konsoller og sæder emballeret i beskyttende indpakning med monteringsbeslagssæt. Samleinstruktioner inkluderet ved hver forsendelse.
      icon: tabler:package
    - title: Beskyttelse mod fugt og korrosion
      description: VCI-antikorrosionspapir til aluminiumskomponenter, silicagel-tørreposer og vakuumforseglede beslagsposer. Forhindrer kondensskader under 30-45 dages søtransport.
      icon: tabler:droplet-off
    - title: FOB Qingdao-dokumentation
      description: Konossement, kommerciel faktura, pakkeliste, oprindelsescertifikat og overholdelsesdokumentation pr. forsendelse. FCL- og LCL-konsolidering tilgængelig. Support til tolddokumentation for EU-, USA- og Mellemøst-markeder.
      icon: tabler:file-text
faq:
  title: Fabriksrevision — ofte stillede spørgsmål
  questions:
    - q: Kan jeg besøge fabrikken personligt?
      a: Ja. Vi byder velkommen til fabriksrevisioner på stedet på vores 12.000 m² store Qingdao-anlæg. Vores standardtur dækker 8 stationer fra råvarelager til dokumentgennemgang. Virtuelle fabriksrundvisninger via videoopkald er også tilgængelige for indledende kvalifikation.
    - q: Accepterer du tredjepartsrevisioner (BSCI, SMETA, SGS)?
      a: Ja. Vi opretholder BSCI-certificering (Intertek) og hilser kundespecifikke revisionsprotokoller velkommen. Vi kan også arrangere SGS eller TÜV inspektioner efter anmodning. Revisionsrapporter er tilgængelige under NDA.
    - q: Kan jeg se tryktest under besøget?
      a: Vores trykteststation er en del af standardrejseruten. Afhængigt af produktionsplanen kan du observere aktive tryktest med måleraflæsninger og testregistreringer. Tryktestlogs pr. skrog er altid tilgængelige for gennemgang.
    - q: Hvordan håndterer du ikke-overensstemmende produkter?
      a: Ikke-overensstemmende enheder er adskilt, dokumenteret og gennemgået i henhold til vores ISO 9001 korrigerende handlingsproces. Grundårsagsanalyse udføres, korrigerende handlinger implementeres, og registreringer vedligeholdes. Købere kan gennemgå vores NCR-log under revisioner.
    - q: Hvilken overholdelsesdokumentation er tilgængelig til gennemgang?
      a: 'Under revisionen kan du gennemgå: modelspecifikke DoC-prøver, byggepladespecifikationer, HIN-registrering, udkast til ejermanualer, gældende standardlister og overensstemmelsesvurderingsposter pr. modelfamilie.'
    - q: Hvordan bestiller jeg en virtuel fabriksrundvisning?
      a: Kontakt vores salgsteam for at planlægge en live videotur via WhatsApp, Zoom eller Teams. Vi følger den samme 8-stationsrute og kan fokusere på specifikke områder ud fra dine interesser. Typisk virtuel tur er 45-60 minutter.
    - q: Er fabrikken den egentlige producent eller en handelsvirksomhed?
      a: Aquafarer er den faktiske producent. Vi driver fabrikken i Laixi, Qingdao. Virksomhedslicens, fremstillingsomfang og fysisk produktion kan alle verificeres under revisionen.
    - q: Hvilke kvalitetsregistre kan jeg gennemgå?
      a: Indgående materialeinspektionsjournaler, QC-kontrolpunkter i processen, tryktestlogfiler, 100-punkts endelige inspektionstjeklister, afvigelsesrapporter, optegnelser om korrigerende handlinger og sporbarhedsregistreringer pr. skrog. Alt vedligeholdt i henhold til ISO 9001 krav.
cta:
