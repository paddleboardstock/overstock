content_scope:
  tagline: Overholdelsesomfang
  title: Hvilke produkter har brug for<br />RCD-overholdelse?
  subtitle: Fritidsfartøjsdirektivet 2013/53/EU gælder for fritidsfartøjer med en skroglængde mellem 2,5 m og 24 m. At forstå omfanget er det første skridt til overholdelse.
  items:
    - title: RIB-både (2,5-24 m)
      description: Stive gummibåde med skroglængder fra 2,5 m til 24 m falder ind under RCD. Designkategori A til D gælder afhængigt af tilsigtede havforhold og maksimal vindstyrke.
      icon: tabler:sailboat
    - title: Gummibåde (under 2,5 m)
      description: Små gummibåde og joller under 2,5 m kan være delvist undtaget fra RCD, men kræver stadig CE-mærkning i henhold til andre gældende direktiver og EN ISO 6185 konstruktionsstandarder.
      icon: tabler:sailboat
    - title: SUP Boards & tilbehør
      description: Stand-up paddle boards er uden for RCD-omfanget. Tilknyttede personlige flydeanordninger (PFD'er) kræver dog CE-mærkning i henhold til PPE-forordningen (EU) 2016/425 med USCG Type III/V-godkendelse, hvor det er relevant.
      icon: tabler:swimming
    - title: Delvist færdiggjorte både
      description: Både, der leveres uden motor eller specifikke installationer, kræver en bygherreerklæring for delvist færdiggjorte fartøjer, med fuld RCD-overensstemmelse udfyldt af den endelige bygherre eller importør.
      icon: tabler:tool
content_trust_layers:
  tagline: Tre-lags tillidssystem
  title: Overholdelsesoplysninger<br />— Delt på det rigtige niveau
  subtitle: Ikke alle overholdelsesdata hører hjemme på et offentligt websted. Vi følger en tre-lags tilgang, der beskytter IP og samtidig opbygger købernes tillid.
  items:
    - title: Lag 1 — Offentlig hjemmeside
      description: Der henvises til standarder, overensstemmelsesruter forklaret, dokumenttyper anført, certificeringsomfang pr. modelfamilie. Ingen egentlige certifikater, testdata eller proprietære tekniske detaljer.
      icon: tabler:world
    - title: Lag 2 — Deling efter forespørgsel
      description: 'Efter en kvalificeret forespørgsel: redigeret DoC-prøve, byggepladefoto, gældende standardliste, overholdelsestjekliste og materialecertificeringsresuméer - delt under rimelige vilkår.'
      icon: tabler:mail
    - title: Lag 3 — NDA / Ordrefase
      description: Fuld teknisk fil, risikovurderinger, stabilitetsberegninger, testrapporter, materialebatch-optegnelser og produktionssporbarhedsdokumentation - deles kun under NDA med bekræftede købere.
      icon: tabler:lock
content_standards:
  tagline: Gældende standarder
  title: ISO & EN-standarder<br />Vi bygger til
  subtitle: Vores produkter er designet og testet i forhold til de harmoniserede standarder under RCD. Der henvises til standardnumre og -navne; fulde standardtekster forbliver ISO-ophavsret.
  items:
    - title: EN ISO 6185-3
      description: "Gummibåde — Del 3: Både med en maksimal motoreffekt på 15 kW eller mere. Krav til konstruktion, stabilitet, opdrift og mand-overbord genopretning for RIB'er."
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Gummibåde — Del 4: Både med en maksimal motoreffekt på 15 kW og større end eller lig med 4,5 kW. Yderligere krav til struktur og stabilitet.'
      icon: tabler:file-text
    - title: ISO 12215-serien
      description: Små fartøjer — Skrogkonstruktion og scantlings. Strukturelt design af skrog, dæk og skotter til RIB-skrog af glasfiber og aluminium.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Lille fartøj — Instruktionsbog. Nødvendigt indhold og format til ejermanualen, der følger med hver RIB-båd leveret i EU.
      icon: tabler:book
    - title: EN ISO 14945
      description: Lille håndværk — Bygmesterplade. Oplysninger, der skal markeres på byggepladen, permanent fastgjort til hvert fartøj.
      icon: tabler:badge
    - title: ISO 8666
      description: Lille fartøj — Hoveddata. Standardiserede mål og parametre for ensartede specifikationer på tværs af al produktdokumentation.
      icon: tabler:dimensions
content_process:
  tagline: Overholdelsesproces
  title: 6-trins CE-overholdelse<br />Workflow
  subtitle: Fra projektomfang til sporbarhed på seriel niveau - hver RIB-model følger en defineret overholdelsessti.
  steps:
    - number: '01'
      title: Projektomfang og klassificering
      description: Definer RIB-modellen, designkategori (A/B/C/D), maksimalt antal personer, nyttelast, motorkraft og målmarked. Bestem, om RCD gælder, og hvilket overensstemmelsesvurderingsmodul, der er påkrævet.
      timeline: 2-3 dage
    - number: '02'
      title: Gældende kravidentifikation
      description: Identificer alle relevante væsentlige sikkerhedskrav fra RCD Annex I, relevante harmoniserede standarder (EN ISO 6185, 12215, 10240, 14945) og eventuelle yderligere nationale krav til målmarkedet.
      timeline: 3-5 dage
    - number: '03'
      title: Design og teknisk dokumentation
      description: 'Opret Master Technical File: generelle arrangementstegninger, stabilitets- og opdriftsberegninger, risikovurdering, materialespecifikationer og systemsikkerhedsanalyse (brændstof, el, styring).'
      timeline: 10-15 dage
    - number: '04'
      title: Produktverifikation og test
      description: Udfør fysisk verifikation - trykprøvning ved 1,25x nominelt tryk i 24-48 timer, stabilitets- og opdriftstest, belastningstest og idriftsættelse af systemer. Registrer alle testresultater pr. skrog.
      timeline: 5-7 dage
    - number: '05'
      title: Mærkning & Leveringsdokumentation
      description: Påfør CE-mærkning, byggeplade (EN ISO 14945) og HIN/CIN (skrogs identifikationsnummer). Udarbejd EU-overensstemmelseserklæring, brugermanual (EN ISO 10240) og tjekliste for overholdelse.
      timeline: 2-3 dage
    - number: '06'
      title: Sporbarhed på seriel niveau
      description: Hvert skrog modtager et unikt skrogrekord, der forbinder det med den tekniske masterfil, produktionsbatch, materialecertifikater, testresultater og endelig konfiguration. Optegnelser opbevaret i 10+ år pr. RCD.
      timeline: Løbende
content_document_cards:
  tagline: Dokumenttyper
  title: Overholdelsesdokument<br />kort
  subtitle: Det er de dokumenttyper, vi udarbejder og vedligeholder for hver CE-certificeret RIB-model. Prøver er tilgængelige ved kvalificeret forespørgsel.
  items:
    - title: CE / RCD overensstemmelsescertifikat
      description: Modelspecifikt certifikat, der bekræfter, at fartøjet opfylder alle gældende væsentlige sikkerhedskrav i RCD 2013/53/EU, udstedt af producenten med inddragelse af bemyndiget organ, hvor det kræves.
      icon: tabler:certificate
    - title: EU-overensstemmelseserklæring (DoC)
      description: Underskrevet erklæring fra producenten eller den autoriserede repræsentant med en liste over gældende direktiver, standarder, overensstemmelsesmodul og detaljerede oplysninger om det bemyndigede organ. Påkrævet for hver model, der markedsføres i EU.
      icon: tabler:file-check
    - title: Byggeplade (EN ISO 14945)
      description: Permanent påsat plade, der viser maksimalt antal personer, maksimal motoreffekt, designkategori og fabrikantens identifikation. Skal forblive læseligt i hele håndværkets levetid.
      icon: tabler:badge
    - title: Brugervejledning (EN ISO 10240)
      description: Omfattende manual, der dækker sikker drift, nødprocedurer, vedligeholdelsesplaner og sikkerhedsadvarsler. Obligatorisk for hver RIB leveret i EU.
      icon: tabler:book
    - title: ISO test- og inspektionsrapporter
      description: Tryktestregistreringer (1,25x / 24–48 timer), stabilitets- og opdriftstestresultater, materialetestcertifikater og dimensionelle verifikationsrapporter - alt sammen knyttet til specifikke skrognumre.
      icon: tabler:test-pipe
    - title: Optegnelser om materialesporbarhed
      description: Sporbarhed på batchniveau for tubestof, klæbemidler, glasfiber og hardware. Forbinder hver produktionsenhed til indgående materialecertifikater og IQC-inspektionsresultater.
      icon: tabler:link
    - title: Kvalitetsinspektion & QC Records
      description: 100-punkts kvalitetstjekliste pr. enhed, igangværende QC-registreringer, rapporter om manglende overensstemmelse og korrigerende handlinger. En del af produktionssporbarhedskæden.
      icon: tabler:clipboard-check
    - title: Projektdokumentpakke
      description: Skrogdokumentationspakke inklusive endelig konfigurationsrekord, motor- og udstyrsinstallationsdetaljer, idriftsættelsestjekliste og leveringsdokumentation.
      icon: tabler:package
content_design_categories:
  tagline: RCD-designkategorier
  title: Designkategori A–D<br />— Hvad de betyder
  subtitle: RCD tildeler designkategorier baseret på maksimal vindstyrke og signifikant bølgehøjde, som fartøjet er designet til at modstå.
  items:
    - title: Kategori A — Ocean
      description: Designet til længere rejser, hvor vindstyrken kan overstige Beaufort 8 (>40 knob) og signifikant bølgehøjde kan overstige 4 m. Kræver den mest strenge struktur- og stabilitetsverifikation.
      icon: tabler:ripple
    - title: Kategori B — Offshore
      description: Designet til offshore-rejser med vindstyrke op til Beaufort 8 (≤40 knob) og signifikant bølgehøjde op til 4 m. Velegnet til kystnære og semi-eksponerede farvande.
      icon: tabler:anchor
    - title: Kategori C — Kyst
      description: Designet til kystrejser med vindstyrke op til Beaufort 6 (≤27 knob) og signifikant bølgehøjde op til 2 m. De fleste rekreative RIB'er falder i denne kategori.
      icon: tabler:sun
    - title: Kategori D — Beskyttet
      description: Designet til beskyttet farvand med vindstyrke op til Beaufort 4 (≤16 knob) og signifikant bølgehøjde op til 0,3 m. Søer, floder og beskyttede havne.
      icon: tabler:pool
content_hin:
  tagline: Håndværksidentifikation
  title: Hin/CIN & Builder's Plate
  subtitle: Hver RIB-båd kræver et skrogidentifikationsnummer (HIN) eller et håndværksidentifikationsnummer (CIN) og en byggeplade i henhold til EN ISO 14945 og RCD-krav.
  items:
    - title: Skrogidentifikationsnummer (HIN)
      description: En unik kode på 14 tegn permanent markeret på styrbord side af agterspejlet, kodende producentkode (MIC), modelår, produktionsår og serienummer. Nødvendig for at komme ind på EU-markedet.
      icon: tabler:hash
    - title: Håndværksidentifikationsnummer (CIN)
      description: I henhold til EN ISO 10087, et skjult sekundært identifikationsnummer placeret på et skjult sted med henblik på tyverisikring og sporbarhed.
      icon: tabler:eye-off
    - title: Builder's Plate Indhold
      description: Maksimalt antal personer, maksimal motoreffekt (kW), maksimal belastning (kg), designkategori, fabrikantnavn og CE-mærkning - alt sammen permanent vist på en korrosionsbestandig plade.
      icon: tabler:badge
content_tech_file:
  tagline: Teknisk filstruktur
  title: Master teknisk fil<br />og skrogoptegnelse
  subtitle: 'Vores dokumentationssystem følger en struktur i to niveauer: Master Technical File for hver modelfamilie og individuelle Hull Records for hver produceret båd.'
  items:
    - title: Master teknisk fil
      description: 'Indeholder den komplette overensstemmelsesdokumentation for en modelfamilie: generelt arrangement, risikovurdering, stabilitets-/opdriftsberegninger, materialespecifikationer, gældende standarder og overensstemmelsesvurderingsregistre. Gemt i 10+ år.'
      icon: tabler:folder
    - title: Skrogrekord (sporbarhed pr. båd)
      description: 'Hvert skrog har en unik registrering, der forbinder det med den tekniske masterfil: HIN, produktionsdato, rørbatch, materialecertifikater, tryktestresultat, endelig konfiguration, motorinstallation og leveringsdestination.'
      icon: tabler:file-description
    - title: Kundeoverholdelsespakke
      description: Leveringspakke pr. skrog inklusive DoC, byggepladefoto, brugermanual, testresumé og endelig konfigurationsark — leveres med hver RIB, der sendes til EU.
      icon: tabler:package
faq:
  title: CE-overholdelse — ofte stillede spørgsmål
  questions:
    - q: Er alle Paddle Board Overstock RIB både CE-certificeret til EU-markedet?
      a: RIB-både i vores katalog er designet og dokumenteret til RCD 2013/53/EU-overensstemmelse i henhold til gældende EU-direktiver. CE-mærkning gælder pr. model, pr. konfiguration. Kontakt os for et modelspecifikt overensstemmelsesdokument.
    - q: Hvad er forskellen mellem RCD-overensstemmelse og CE-mærkning?
      a: RCD (Recreational Craft Directive 2013/53/EU) er EU-lovgivningen, der stiller væsentlige sikkerhedskrav. CE-mærkning er det visuelle symbol på et produkt, der er blevet vurderet og bekræftet til at opfylde disse krav. Et produkt skal overholde RCD, før det kan bære CE-mærket.
    - q: Leverer du overensstemmelseserklæringer med hver båd?
      a: Ja. Hver RIB-båd, der leveres til EU-markedet, inkluderer en modelspecifik EU-overensstemmelseserklæring med de gældende direktiver, harmoniserede standarder, overensstemmelsesvurderingsmodul og detaljerede oplysninger om det bemyndigede organ.
    - q: Hvilket overensstemmelsesvurderingsmodul bruger Paddle Board Overstock?
      a: Modulet afhænger af designkategori og bådtype. De fleste RIB-modeller i designkategori C bruger modul A (intern produktionskontrol). For både designkategori A/B eller specifikke konfigurationer kan modul B+C eller B+D gælde med inddragelse af bemyndiget organ. Vi rådgiver om det passende modul pr. projekt.
    - q: Kan du dele overholdelsesdokumentation, før vi afgiver en ordre?
      a: Efter en kvalificeret forespørgsel deler vi et overholdelsesomfangsdokument med gældende standarder, overensstemmelsesrute og tilgængelige dokumenttyper for den model, du vurderer. Fuldstændige tekniske filer deles under NDA efter ordrebekræftelse.
    - q: Hvad er et skrogidentifikationsnummer (HIN), og er det inkluderet?
      a: HIN er en 14-karakters unik identifikator, der er permanent markeret på hver båd, som koder for producentkoden (MIC), modelbetegnelse, produktionsår og serienummer. Det er obligatorisk for alle RIB-både, der placeres på EU-markedet, og er inkluderet på alle Paddle Board Overstock RIB'er.
    - q: Hvor længe opbevares tekniske filer?
      a: I henhold til RCD 2013/53/EU-kravene skal producenten opbevare den tekniske dokumentation i mindst 10 år fra den sidste dato, hvor produktet blev markedsført. Paddle Board Overstock opretholder fuld teknisk dokumentation for alle producerede modeller.
    - q: Bistår du med importørforpligtelser i henhold til RCD?
      a: 'Ja. Vi leverer den dokumentationspakke, som EU-importører har brug for for at opfylde deres forpligtelser: teknisk filadgang, DoC, byggeplade, brugermanual og produktsporbarhedsregistreringer. Importørens ansvar under RCD er tydeligt dokumenteret i vores overholdelsesvejledning.'
