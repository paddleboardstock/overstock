hero:
  tagline: CE & RCD overensstemmelse
  title: RIB Boat CE-overholdelse<br />& teknisk dokumentation
  subtitle: Paddle Board Overstock RIB-både og oppustelige vandfartøjer er designet og dokumenteret til overensstemmelse med EU-markedet i henhold til direktivet om fritidsfartøjer 2013/53/EU. Fra risikovurdering til overensstemmelseserklæring leverer vi modelspecifik overensstemmelsesdokumentation for hvert skrog.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: RIB båd CE overensstemmelse dokumentation og certificering
direct_answer: Paddle Board Overstock leverer modelspecifik RCD 2013/53/EU-overensstemmelsesdokumentation for RIB-både og oppustelige vandfartøjer, inklusive tekniske filer, overensstemmelseserklæringer, byggeplader og ejermanualer - alt sammen i overensstemmelse med EN ISO 6185, ISO 12217 og gældende harmoniserede standarder.
