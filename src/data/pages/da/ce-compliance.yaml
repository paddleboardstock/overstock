content_material_cert:
  tagline: Materiale certificering
  title: Materialesporbarhed og<br />certificeringsbevis
  subtitle: Kvalitet RIB både begynder med kontrollerede materialer og dokumenterede processer. Nedenfor er, hvordan vi organiserer materialecertificering for hver kritisk komponentgruppe.
  items:
    - title: Sporbarhed af oppusteligt rørmateriale
      description: PVC og CSM/Hypalon rørmaterialer er udvalgt efter tilsigtet anvendelse, klimaforhold og målmarked. Leverandør tekniske data (TDS), materialebatchinformation, stofbatchsporbarhed, UV- og vejrbestandighedstestrapporter og REACH/SVHC-erklæringer er tilgængelige inden for det aftalte projektdokumentationsomfang.
      icon: tabler:circle
    - title: Marine aluminium sporbarhed
      description: For aluminiumskrog RIB-projekter kontrolleres legeringskvalitet, tykkelse og materialepartier i henhold til godkendte specifikationer. Materialetestcertifikater (MTC/MTR), EN 10204 3.1 dokumentation, rapporter om kemisk sammensætning og mekaniske egenskaber samt varme/parti-sporbarhed leveres, hvor det er aftalt.
      icon: tabler:rectangle
    - title: GRP Skrogmateriale og proceskontrol
      description: For glasfiberskrog RIB'er styres gelcoat, harpiks, glasfiberarmering og kernematerialer gennem kontrollerede specifikationer. Materiale TDS/SDS, batch-registreringer, laminatspecifikationer og hærdnings- og værkstedskontrolregistre er tilgængelige efter projektaftale.
      icon: tabler:layers-subtract
    - title: Komponentdokumentationssupport
      description: For udvalgte komponenter – herunder EVA dækmaterialer, sæder, rustfrit stål hardware, brændstofsystemer, elektrisk udstyr og marinetilbehør – koordineres gældende leverandørdokumentation baseret på den endelige konfiguration og destinationsmarkedets krav.
      icon: tabler:package
    - title: Meddelelse om overholdelse af omfang
      description: Certifikater, testrapporter og overensstemmelsesdokumenter gælder kun for den specifikke produktmodel, materiale, komponent, produktionsbatch eller projektomfang, der er angivet i det relevante dokument. Kontakt os med dit målmarked, påtænkte anvendelse og tekniske krav, så den gældende dokumentationspakke kan bekræftes inden ordreafgivelse.
      icon: tabler:info-circle

