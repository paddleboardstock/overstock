hero:
  tagline: Global tilstedeværelse
  title: 'Aktive i 50+ lande<br />på alle kontinenter'
  subtitle: 'Fra europæiske kystpatruljeoperatører til australske vandsportsdistributører og redningshold i Mellemøsten — Paddle Board Overstock-både sejler på vandet hele verden over.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstocks globale maritime produktion og distribution
stats:
  title: Global rækkevidde
  stats:
    - title: Lande
      amount: '50+'
    - title: Eksportmarkeder
      amount: Europa, Amerika, Asien, Mellemøsten, Oceanien
    - title: Produktion
      amount: Qingdao, China
    - title: Lager i USA
      amount: Montclair, CA
features3_markets:
  tagline: Nøglemarkeder
  title: 'Regional ekspertise<br />til lokale krav'
  subtitle: 'Vi forstår, at forskellige markeder har forskellige regulatoriske krav, præferencer og anvendelsesområder.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa og Storbritannien
      description: 'CE-certificerede produkter, der opfylder EN ISO 6185-standarderne. Stærk efterspørgsel på RIB-både, oppustelige både og SUP-boards på EU-markederne. Britiske distributører sætter pris på vores hurtige levering.'
      icon: tabler:map-pin
    - title: Nordamerika
      description: 'Produktion godkendt af US Coast Guard. USA-lager i Montclair, Kalifornien til hurtig levering til vestkysten. Voksende efterspørgsel på fiskebåde, redningsfartøjer og fritids-SUP''er.'
      icon: tabler:map-pin
    - title: Australien og Oceanien
      description: 'Stærkt marked for RIB-både og oppustelige tenders. Australske distributører værdsætter vores Hypalon-både for UV-bestandighed under hård sol. Hurtig forsendelse fra vores anlæg i Asien.'
      icon: tabler:map-pin
    - title: Mellemøsten
      description: 'Voksende efterspørgsel på patrulje- og redningsbåde. Vores RIB''er med aluminiumskrog er populære hos kystvagt- og sikkerhedsoperatører. Skræddersyede konfigurationer til miljøer med høje temperaturer.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Distributionsnetværk
  title: 'Partnerskab med distributører<br />i hele verden'
  subtitle: 'Vi samarbejder med etablerede distributører af marineudstyr, OEM-brands og offentlige indkøbsorganer.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM-partnerskaber
      description: 'Private label-produktion for globale vandsportsbrands. Vi klarer det hele fra design til produktion til dropshipping.'
      icon: tabler:building
    - title: Distributørnetværk
      description: 'Autoriserede distributører i over 20 lande fører lager og yder lokal support. Henvendelser fra nye distributører er velkomne.'
      icon: tabler:users
    - title: Myndigheder og institutioner
      description: 'Direkte levering til kystvagter, sø- og redningsorganisationer og militære indkøbsprogrammer. Overholdelse af institutionelle indkøbskrav.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Global logistik og support'
  subtitle: 'Fra fabrik til destination — vi styrer hele forsyningskæden.'
  items:
    - title: Fragtmuligheder
      description: 'Søfragt (FOB Qingdao), luftfragt til hastende ordrer og ekspreslevering til prøver og reservedele.'
      icon: tabler:truck-delivery
    - title: Lager i USA
      description: 'Lager i Montclair, Kalifornien til hurtig levering i hele Nordamerika. Vestkysten: 2-3 dage, midten: 3-4 dage, østkysten: 4-5 dage.'
      icon: tabler:building-warehouse
    - title: Reservedele
      description: 'Ægte Paddle Board Overstock-reservedele og forbrugsvarer på lager hele året. Almindelige dele sendes inden for 24 timer.'
      icon: tabler:package
    - title: Teknisk support
      description: 'Direkte linje til vores ingeniørteam for tekniske spørgsmål, reparationsrådgivning og refit-support. Vi yder support til både, vi byggede for 20 år siden.'
      icon: tabler:headset
cta:
  title: 'Vil du blive distributør?'
  subtitle: 'Vi udbygger aktivt vores distributionsnetværk. Kontakt vores eksportteam for at drøfte partnerskabsmuligheder.'
  actions:
    - variant: primary
      text: Partnerskabsforespørgsel
      href: /contact
    - text: Se vores produktsortiment
      href: /products
