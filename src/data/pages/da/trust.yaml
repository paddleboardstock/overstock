features3_lab:
  title: Internt test- og kvalitetslaboratorium
  subtitle: Hvert materialebatch og færdigt produkt gennemgår vores testlaboratorium på stedet, før det sendes.
  columns: 3
  isBeforeContent: true
  items:
    - title: Trækstyrketestning
      description: 'Hver PVC stofrulle er testet i henhold til ASTM D751 standarder. Minimumskrav: 350 N/cm kæde og skud. Afviste partier returneres til leverandøren - vi afviser ca. 3 % af indgående materialer.'
      icon: tabler:scale
    - title: UV-accelereret aldring
      description: Stofprøver gennemgår 1.000 timers QUV accelereret forvitring (ASTM G154). Retention af trækstyrke skal overstige 80% efter UV-eksponering. Produkter vurderet til 3+ års udendørs brug.
      icon: tabler:sun
    - title: Skræleastyrke i sømme
      description: RF-svejsede sømme testet ved 5 N/mm minimum afskalningsstyrke (ASTM D751). Håndlimede Hypalon sømme testet ved 3,5 N/mm. Hver produktionsbatch har sømprøver destruktivt testet og arkiveret.
      icon: tabler:stack
    - title: 24–48 timers trykhold
      description: 'Hvert oppustelige produkt pustes op til 1,25x nominel PSI og overvåges i 24-48 timer. Maksimalt tilladt trykfald: 5%. Produkter, der ikke består denne test, omarbejdes og testes igen før afsendelse.'
      icon: tabler:wind
    - title: Cyklustest af ventiler
      description: Hvert ventildesign gennemgår 10.000 åben-lukke-cyklusser i vores laboratorium. Ventiler skal opretholde lufttæt forsegling ved 1,25x nominelt tryk efter cykling. Alle Aquafarer ventiler vurderet til 5+ års regelmæssig brug.
      icon: tabler:rotate
    - title: Modstandsdygtighed over for kolde revner
      description: Materialer testet ved -30°C i 4 timer pr. ISO 4646. Ingen revner eller skørhed tilladt. Produkter vurderet til vinteropbevaring og koldtvandsbrug ned til -10°C omgivelsestemperatur.
      icon: tabler:snowflake

