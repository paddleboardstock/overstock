features3_certifications:
  title: Certificeringer & overholdelse
  subtitle: Hvert produkt er uafhængigt testet; 64 modeller er CE-certificerede efter internationale standarder.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE-certificering
      description: 64 CE-certificerede modeller på tværs af SUP'er, kajakker, joller og RIB'er opfylder den europæiske CE-sikkerhedsstandard for rekreative fartøjer. Hvert produkt gennemgår tryk-, opdrifts- og belastningstest, før det forlader fabrikken.
      icon: tabler:certificate
    - title: ISO 9001-certificeret
      description: Vores 12,000 m² Qingdao-facilitet opererer under et kvalitetsstyringssystem. Hver produktionsbatch er sporbar, dokumenteret og inspiceret.
      icon: tabler:clipboard-check
    - title: BSCI social overholdelse
      description: Vi er BSCI-certificerede, hvilket sikrer etisk arbejdspraksis, sikre arbejdsforhold og miljømæssigt ansvar på tværs af vores forsyningskæde.
      icon: tabler:users
    - title: REACH & RoHS
      description: Alle materialer — PVC, Hypalon, EVA-skum, klæbemidler — overholder EU's REACH- og RoHS-regler. Ingen forbudte stoffer, ingen kompromiser.
      icon: tabler:flask
    - title: Materialetestlaboratorium
      description: Internt materialelaboratorium tester trækstyrke, UV-bestandighed, sømintegritet og slidstyrke for hver stofbatch før produktion.
      icon: tabler:microscope
    - title: 2-års garanti
      description: Hvert Aquafarer-produkt leveres med en to-års garanti mod produktionsfejl. Vi står ved det, vi bygger.
      icon: tabler:shield-check
testimonials:
  tagline: Kundetillid
  title: Hvad vores kunder siger
  subtitle: Fra førstegangspadlere til professionelle flådeoperatører — se hvorfor de stoler på Aquafarer.
  items:
    - content: Vi udstyrede hele vores udlejningsflåde med Aquafarer RIB'er. To sæsoner inde, nul fejl. CE-certificeringen gjorde forsikringsgodkendelse problemfri.
      name: Marco V.
      title: Turarrangør, Kroatien
    - content: Som førstegangskøber var jeg nervøs for kvaliteten. ISO-dokumentationen og testrapporterne, de delte, gav mig fuldstændig tillid.
      name: James T.
      title: SUP Explorer 11-ejer, Canada
    - content: Vi arbejder med Aquafarer til vores kystpatruljeenheder. Deres QC-proces er konsekvent på tværs af hver batch — den pålidelighed betyder noget i missionskritiske operationer.
      name: Lt. Cmdr. Andres
      title: Flådeindkøb, Filippinerne
steps2_manufacturing:
  title: Sådan sikrer vi kvalitet
  subtitle: Fra råvareinspektion til endelig trykprøvning — hvert produkt gennemgår en stringent kvalitetskæde.
  items:
    - title: Råvareinspektion
      description: Hver rulle PVC-stof testes for tykkelse, trækstyrke og UV-bestandighed, før den går ind i produktionen.
      icon: tabler:search
    - title: Løbende QC
      description: Svejsesømme, ventilinstallationer og kammerbindinger inspiceres ved hver station under samling.
      icon: tabler:eye
    - title: Trykprøvning
      description: Hvert oppusteligt produkt pumpes op til 1,25x nominel PSI og holdes i 24-48 timer for at verificere luftretention og sømintegritet.
      icon: tabler:wind
    - title: Slutinspektion
      description: Hver enhed inspiceres for finish, hardware og emballage, før den godkendes til forsendelse. Batchprøver sendes til vores laboratorium til destruktiv testning.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB-både FAQ
  subtitle: Almindelige spørgsmål om vores RIB'er med stift skrog.
  columns: 2
  items:
    - title: Hvilke størrelser RIB-både tilbyder Aquafarer?
      description: Vi tilbyder 35 RIB-modeller fra 2,5 m til 7,6 m, der dækker alt fra kompakte tendere til kraftige kommercielle og patruljefartøjer. Hver model er tilgængelig med flere konfigurationsmuligheder.
    - title: Hvad er forskellen mellem en RIB og en traditionel oppustelig båd?
      description: En RIB (Rigid-Hull Inflatable Boat) kombinerer et solidt glasfiber- eller aluminiums dyb-V-skrog med oppustelige Hypalon- eller PVC-rør. Dette giver dig stabiliteten og lastkapaciteten fra en hård båd med stødabsorbering og opdrift fra en oppustelig.
    - title: Hvilke motorer er kompatible med Aquafarer RIB'er?
      description: Vores RIB'er understøtter påhængsmotorer fra 3 HK til 250 HK afhængigt af modellen. Hver produktside viser den maksimale motoreffekt. Vi anbefaler at konsultere din forhandler for det ideelle match.
    - title: Er Aquafarer RIB'er CE-certificerede?
      description: Ja. Alle rekreative RIB-modeller er CE-certificerede efter gældende europæiske standarder for rekreative fartøjer. Kommercielle og patruljemodeller opfylder yderligere stabilitets- og belastningskrav.
    - title: Hvad er garantien på RIB-både?
      description: Alle Aquafarer RIB'er leveres med en standard et-års garanti mod produktionsfejl, der dækker skrogdelaminering, rørsømssvigt, ventilfejl og hardwareproblemer.
    - title: Hvor mange luftkamre har Aquafarer RIB'er?
      description: Vores RIB'er har 3 til 7 uafhængige luftkamre afhængigt af modellens længde. Dette flerkammerdesign sikrer, at båden forbliver flydende, selv hvis et rum kompromitteres.
faqs_inflatable:
  title: Oppustelige både FAQ
  subtitle: Almindelige spørgsmål om vores oppustelige joller, kajakker og både.
  columns: 2
  items:
    - title: Hvilke materialer bruges i Aquafarer oppustelige både?
      description: Vi bruger militær-grade PVC (1100 denier) og premium Hypalon/CSM-gummi, afhængigt af modellen. Begge materialer er UV-stabiliserede, slidstærke og overholder EU's REACH- og RoHS-regler.
    - title: Hvor længe holder oppustelige både?
      description: Med ordentlig pleje holder en kvalitets-PVC oppustelig båd 7-10 år, mens Hypalon-modeller kan holde 15-20 år. Regelmæssig rengøring, UV-beskyttelse og korrekt opbevaring forlænger levetiden betydeligt.
    - title: Hvilken vedligeholdelse kræves for en oppustelig båd?
      description: Grundlæggende vedligeholdelse omfatter skylning med ferskvand efter hver brug (især i saltvand), tørring før opbevaring, årlig kontrol af ventiltætninger og påføring af UV-beskyttelse på rør. Undgå længerevarende soleksponering, når den ikke er i brug.
    - title: Kan oppustelige både bruges i saltvand?
      description: Ja. Alle Aquafarer oppustelige både er designet til både ferskvands- og saltvandsbrug. Vi anbefaler skylning med ferskvand og grundig tørring efter saltvandseksponering for at forhindre korrosion af beslag og saltkrystallisering i stoffet.
    - title: Hvordan opbevarer jeg en oppustelig båd?
      description: Pust luften ud, rengør og tør båden helt før opbevaring. Rul løst (undgå skarpe folder), opbevar på et køligt, tørt sted væk fra direkte sollys, og hold væk fra betongulve for at forhindre fugtsugning.
    - title: Hvad er vægtkapaciteten for Aquafarer oppustelige både?
      description: Vægtkapaciteter spænder fra 290 kg for vores mindste modeller til over 2000 kg for større kommercielle fartøjer. Hver produktside viser den maksimale belastning for din specifikke model.
faqs_sup:
  title: SUP-brædder FAQ
  subtitle: Almindelige spørgsmål om vores paddleboards.
  columns: 2
  items:
    - title: Hvilke SUP-brætstørrelser er tilgængelige?
      description: Vi tilbyder SUP-brædder fra 9 ft til 12 ft, inklusive all-round, touring, yoga og specialdesigns. Vores bedst sælgende modeller inkluderer Tropical Breeze (10 ft) og Ocean Voyager (11 ft).
    - title: Hvad er drop-stitch-konstruktion?
      description: Drop-stitch-konstruktion bruger tusindvis af polyestertråde, der forbinder brættets top- og bundlag, hvilket gør det muligt at holde højt lufttryk (15-20 PSI) og opnå en stiv, stabil platform. Dette er industristandarden for premium oppustelige SUP'er.
    - title: Hvad er vægtgrænsen for SUP-brædder?
      description: Vores SUP-brædder understøtter op til 150 kg afhængigt af model og volumen. Leviathan Wake er vores model med højest kapacitet, designet til større ryttere og yogabrug.
    - title: Tilbyder du komplette SUP-pakker?
      description: Ja. Hvert SUP-bræt leveres med en komplet pakke inklusive 3-delt aluminiumspagaj, højtryks håndpumpe, spiralsnor, rejserygsæk og reparationssæt. Nogle modeller inkluderer også et aftageligt finnesæt.
    - title: Hvad er garantien på SUP-brædder?
      description: Alle Aquafarer SUP-brædder har et-års garanti mod produktionsfejl, inklusive sømfejl, ventilfejl og materialedelaminering under normal brug.
    - title: Hvor lang tid tager det at pumpe et SUP-bræt op?
      description: Ved brug af den medfølgende håndpumpe tager fuld oppumpning til 15 PSI cirka 8-12 minutter. For hurtigere oppumpning anbefaler vi vores Aquafarer 12V elektriske pumpe, der pumper et bræt op på under 4 minutter.
