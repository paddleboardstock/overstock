faq:
  title: Ofte stillede spørgsmål om pakke
  questions:
    - q: Hvad er den mindste ordremængde for pakker?
      a: Klub startpakke har minimum 10 enheder. Resort- og brandpakker er tilpasset dine behov med fleksible MOQ'er.
    - q: Hvor lang tid tager leveringen?
      a: Standardproduktion er 30-45 dage fra ordrebekræftelse. Fremskyndet produktion er tilgængelig mod et ekstra gebyr.
    - q: Kan jeg tilpasse udstyrsfarver og branding?
      a: Ja. Alle pakker inkluderer fuld tilpasning - tavlefarver, logotryk og emballagedesign.
    - q: Yder du eftersalgssupport?
      a: Ja. Hver pakke inkluderer adgang til vores online vedligeholdelsesvejledninger, videovejledninger og reservedelsbestillingssystem.
