hero:
  tagline: Teknologi
  title: Bygget til ydeevne
  subtitle: Hvert Paddle Board Overstock board er konstrueret med præcisionsmaterialer og fremstillingsmetoder testet til maritime miljøer.
sections:
  - title: Drop-stitch kerne
    description: Tusindvis af interne polyestertråde forbinder top- og bundlag og skaber en stiv struktur ved 12-15 PSI.
    imageAlt: DS kerne diagram
    standard: 12-15 PSI driftstryk
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - title: Militær-grade PVC
    description: Flerlags lamineret PVC-stof klassificeret til maritime miljøer. Hvert lag er smeltesvejset.
    imageAlt: PVC lag
    standard: Fusion-svejset | UV / saltvand / slid testet
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - title: Hypalon slanger
    description: Hypalon (CSM) gummi giver overlegen UV- og kemikaliebestandighed sammenlignet med standard PVC.
    imageAlt: Hypalon
    standard: CSM gummi | UV / kemisk / ekstrem-temp resistent
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
  - title: Air Deck gulv
    description: Højtryks oppusteligt gulvsystem, der erstatter traditionelle krydsfinér- eller aluminiumsgulve.
    imageAlt: Luftgulv (Air Deck)
    standard: Højtryks oppustelig | Erstatter krydsfiner/aluminium
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
