hero:
  tagline: Om os
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer-fabrik og værksted
  title: |
    Marineingeniørkunst, <br />
    bygget på <span class="text-accent dark:text-white">Aquafarer</span>-måden
  subtitle: 'Vi startede i et værksted ved kysten med én båd og en stædig overbevisning: marineprodukter skal konstrueres, som om de betyder noget — for det gør de. I dag sender vi til mere end 50 lande, men hvert skrog passerer stadig gennem de samme hænder, der startede virksomheden.'
stats:
  title: I tal
  columns: 4
  stats:
    - title: Leverede skrog
      amount: 2,400+
    - title: Leveringslande
      amount: 50+
    - title: Samlet erfaring (år)
      amount: '60'
    - title: Gennemsnitlig svartid (t)
      amount: '24'
features3_what_we_build:
  title: Hvad vi bygger
  subtitle: En fokuseret produktlinje, som vi kender uden og med — ingen genveje eller badge engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB-både
      description: RIB-både med aluminiumskrog fra 3,3 m til 7,5 m. Designet til patruljesejlads, dykning, lystfiskeri og familjebrug.
      icon: tabler:ship
    - title: Gummibåde
      description: PVC- og Hypalon-gummibåde fra 2,4 m til 4,2 m. Lette, holdbare og nemme at opbevare.
      icon: tabler:speedboat
    - title: Superyacht-tendere
      description: Kompakte RIB-både med høje specifikationer, tilpasset værtsfartøjets design.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Tilbehør
      description: Sæder, pumper, beskyttelse, vandtætte tasker, brændstoftanke og elektronik. Alt kompatibelt med vores både.
      icon: tabler:package
    - title: Modifikationer og reparationer
      description: Reparation af luftkamre, elektronikopgraderinger og motorudskiftninger.
      icon: tabler:tool
    - title: Skræddersyede produkter
      description: Design til kommercielle, videnskabelige og militære kunder.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Skræddersyet båd
steps2_values:
  title: Vores værdier
  subtitle: Tre principper, der har formet hvert produkt siden dag ét.
  items:
    - title: Byg, som var din familie om bord
      description: Hvert skrog, hver svejsning og hver komponent behandles, som skulle de bruges af vores egne familier.
      icon: tabler:heart
    - title: Ingeniørarbejde før salg
      description: Hvis specifikationen er forkert, ændrer vi specifikationen — aldrig kunden.
      icon: tabler:settings
    - title: Support efter garantien
      description: Tyve år gamle skrog ringer stadig efter reservedele — og vi svarer stadig.
      icon: tabler:headset
steps2_milestones:
  title: Milepæle
  subtitle: Den korte version af Aquafarers historie.
  isReversed: true
  items:
    - title: Grundlagt i et kystværksted
      description: To mariningeniører med en CNC-fræser og en stædig idé.
      icon: tabler:building-factory
    - title: De første 1.000 leverede skrog
      description: Opnået i det syvende år, primært via mund-til-mund og tilbagevendende kunder.
      icon: tabler:circle-check
    - title: Internationalt eksportprogram
      description: Leverancer til 40+ lande med lokale servicepartnere på fem kontinenter.
      icon: tabler:world
features2_locations:
  title: Vores lokationer
  tagline: Hvor du finder os
  columns: 3
  items:
    - title: Hovedkontor og værksted
      description: Kystnær industripark, bygning 4 — åben mandag-fredag for besøg efter aftale.
    - title: EU-servicecenter
      description: Middelhavshavn — modifikationer, reparationer og garantisupport for europæiske kunder.
    - title: APAC-partnernetværk
      description: Autoriserede servicepartnere i Australien, Japan, Singapore og Hongkong.
brand_hub_tagline: Mærke
brand_hub_title: Udforsk vores brand
brand_hub_subtitle: Dyk dybere ned i vores maritime ingeniørekspertise, globale tilstedeværelse og de principper, der driver os.
brand_hub_cards:
  - title: Marin ekspertise
    desc: Årtiers materialevidenskab, præcisionsproduktion og test i den virkelige verden — fra PVC/Hypalon-fremstilling til design af dybe V-skrog og drop-stitch-teknologi.
    link: /brand-marine-expertise
    link_label: Læs mere →
  - title: Global tilstedeværelse
    desc: Forsendelse til 50+ lande fra vores anlæg i Qingdao med autoriserede servicepartnere i Europa, Asien-Stillehavsområdet og Amerika.
    link: /brand-global-presence
    link_label: Læs mere →
  - title: Hvorfor Aquafarer
    desc: Vertikal integration, dobbelt certificering (ISO 9001 + BSCI), CE-overholdelse og lave MOQ — bygget til brands, distributører og offentlige myndigheder.
    link: /brand-why-aquafarer
    link_label: Læs mere →
production_section:
  tagline: Produktionsekscellens
  title: Sikrer forfinet håndværk
  description: Aquafarers produktionslinje er dedikeret til at producere oppustelige produkter af høj kvalitet — holdbare og med høj ydeevne.
  cards:
    - title: Erfarent teknikerteam
      items:
        - Professionel viden om PVC, Hypalon og maritime materialer
        - Præcist håndværk ved skæring, limning og montering af tilbehør
        - Løbende træning i de nyeste produktionsteknologier
    - title: Avanceret produktionsudstyr
      items:
        - CNC-skæremaskiner til præcis klipning af stof med minimal fejl
        - Højpræcis varm-/koldlimning til lufttætte, holdbare sømme
        - Professionelt udstyr til lufttætheds- og trækprøvning
    - title: Modent ledelsessystem
      items:
        - Standardiserede produktionsprocesser med klare kvalitetsstandarder
        - Lean produktionsfilosofi, der reducerer spild og forbedrer effektiviteten
        - Effektiv forsyningskædestyring med pålidelige leverandørpartnerskaber
    - title: Stram kvalitetskontrol
      items:
        - Certificeret kvalitetsledelsessystem
        - 'Flertrinskontrol: råvarer, under produktion, endelig kontrol'
        - Stramme lufttætheds- og holdbarhedstests før forsendelse
global_ops_section:
  tagline: Global driftsarkitektur
  title_html: Ét brand, <span class="text-white/90">to centre</span>
  description_html: Siden september 2026 drives Aquafarer af <strong class="text-white">Aquafarer LLC</strong> (New Mexico, USA) — den globale enhed for distribution, kommercielt B2B-salg, kontrakter, fakturering og eftersalg. FoU, produktion og kvalitetskontrol forbliver i <strong class="text-white">Aquafarers produktionshub i Qingdao</strong>, som afsender hver ordre direkte fra fabrikken, FOB Qingdao. Overgangen ændrede, hvem der underskriver din kontrakt — ikke hvem der bygger din båd.
  stats:
    - value: 2,400+
      label: Skrog leveret globalt
    - value: 50+
      label: Eksportlande
    - value: 10+
      label: År med produktion

