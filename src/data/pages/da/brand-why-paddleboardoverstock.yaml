features3_reasons:
  tagline: Hvorfor vælge Paddle Board Overstock
  title: 'Syv grunde til at blive vores partner'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Ægte produktion, ikke handel'
      description: 'Vi ejer og driver en fabrik på 12.000 m². Når du indgår partnerskab med Paddle Board Overstock, arbejder du direkte med de mennesker, der designer, konstruerer og bygger dine produkter — uden mellemled.'
      icon: tabler:building-factory
    - title: '2. Ingeniørdrevet tilgang'
      description: 'Vores designproces starter med anvendelsestilfældet, ikke produktkategorien. Vi optimerer skrogform, materialevalg og konfiguration ud fra, hvordan båden faktisk vil blive brugt.'
      icon: tabler:engine
    - title: '3. Certificeret kvalitet'
      description: 'CE-certificeret, ISO-kvalitetssystem, BSCI-compliant, REACH-compliant, USCG-godkendt. Vores 64 CE-certificerede modeller opfylder internationale standarder — ikke kun påstande.'
      icon: tabler:certificate
    - title: '4. Fleksibelt OEM/ODM'
      description: 'Tube-farver, konsollayout, branding, emballage — vi tilpasser efter dine specifikationer. Intet pres om minimumsordrer. Start med en prototype og skaler med tillid.'
      icon: tabler:adjustments
    - title: '5. Global logistik'
      description: 'USA-lager i Californien, direkte forsendelse fra Qingdao, luftfragt til hastende ordrer. Vi klarer toldpapirer og dokumentation.'
      icon: tabler:truck-delivery
    - title: '6. Livstidssupport'
      description: 'Vi supporterer både, vi byggede for 20 år siden. Ægte reservedele, teknisk rådgivning, reparationsvejledning — vores team er til rådighed, når du har brug for os.'
      icon: tabler:lifebuoy
    - title: '7. Ærlige specifikationer'
      description: 'Ægte lasteevner, ægte dimensioner, ægte vægt. Ingen marketingoppustethed. Det, vi offentliggør, er det, du får — verificeret af uafhængige tests.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Betroet af brands i hele verden
  title: Hvad vores partnere siger
  items:
    - content: 'Vi har arbejdet med flere producenter i Kina, men Paddle Board Overstock skiller sig ud med deres ingeniørstøtte og konsekvente kvalitet. De behandler vores brand som deres eget.'
      name: '— OEM-partner, europæisk vandsportsbrand'
    - content: 'Deres Hypalon-RIB''er har været i drift i vores flåde i over 5 år. Minimal vedligeholdelse, fremragende UV-bestandighed. 5-års-garantien på tuberne giver os tryghed.'
      name: '— Flådeoperatør, resortgruppe i Mellemøsten'
    - content: 'Paddle Board Overstock-teamet hjalp os med at udvikle et skræddersyet SUP-boarddesign fra koncept til produktion på 90 dage. Kvaliteten overgik vores forventninger.'
      name: '— Distributør, australsk vandsport'
cta:
  title: 'Klar til at mærke forskellen?'
  subtitle: 'Kontakt vores team for at drøfte dit projekt. Ingen forpligtelser — bare ærlige råd om produktion.'
  actions:
    - variant: primary
      text: Tal med vores team
      href: /contact
    - text: Download produktkatalog
      href: /resources
