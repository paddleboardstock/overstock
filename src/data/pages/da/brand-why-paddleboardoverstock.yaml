hero:
  tagline: Hvorfor Paddle Board Overstock
  title: 'Syv grunde til, at globale brands<br />vælger Paddle Board Overstock'
  subtitle: 'Ikke alle producenter er ens. Her er det, der gør Paddle Board Overstock til den foretrukne partner for distributører, brands og operatører i hele verden.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstocks produktionskvalitet og ekspertise
