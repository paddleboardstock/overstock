hero:
  tagline: Fabrik
  title: Fabrik & Fremstilling
  subtitle: 12.000 m2 integreret produktion — fra råmateriale til færdig båd
intro:
  - Som fabriksmærket for **Aquafarer Qingdao Manufacturing Hub**, kontrollerer Aquafarer alle trin i produktionen - fra ankomsten af ​​rå PVC og glasfibermaterialer til den endelige inspektion før levering af den færdige båd. Vores produktionsanlæg i Qingdao Economic Development Zone spænder over 12.000 kvadratmeter og huser dedikerede værksteder til PVC skæring, rørvarmeforsegling, glasfiber RIB skrogproduktion, SUP digital print, slutmontage og kvalitetstest.
  - Ved at integrere design, engineering, prototyping, fremstilling og test under ét tag eliminerer vi ineffektiviteten ved kontraktfremstilling og opretholder direkte kontrol over byggekvalitet, materialevalg og leveringstidslinjer. Hver båd, der forlader vores værksted, er bygget af vores folk, på vores udstyr, til vores standarder.
