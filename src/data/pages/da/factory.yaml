workshops_section:
  tagline: Værksteder
  title: Fremstillingsværksteder
  workshops:
    - title: PVC Skæring og materialeforberedelse
      description: Automatiske CNC-skæremaskiner behandler PVC, Hypalon og drop-stitch-stoffer med sub-millimeter præcision. Computeroptimeret indlejring minimerer materialespild og sikrer, at hvert panel opfylder dens dimensionelle specifikation før svejsning.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: Rørsvejsning og varmeforsegling
      description: Dedikeret svejseværksted med varmeforseglingsmaskiner og RF dielektriske presser. Varmluftsvarmeforseglere binder og sammensmelter PVC rørkamre, mens RF-svejsninger producerer højstyrke lufttætte sømme, der overstiger ISO 9001 kravene.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB Skrogproduktion — Glasfiber
      description: RIB bådskrog er fremstillet ved hjælp af håndoplagt glasfiberstøbning med polyester- og vinylesterharpikssystemer. Hvert lag er håndrullet og vakuumposet for ensartet kvalitet. Gelcoat sprayboks giver en højglans, UV-bestandig marinefinish.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP Tryk og dekoration
      description: SUP tavler er dekoreret ved hjælp af digital print til fuldfarve grafik og serigrafi til logoer og gentagne mønstre. Digitale printere producerer dækdesigns i fotokvalitet, mens serigrafi leverer holdbare, levende mærkemærker.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Afsluttende montering og rigning
      description: Samlebånd, hvor glasfiberskrog og PVC-rør er sammenkoblet, motorer er monteret, styring og kontrol er tilsluttet, og elektriske systemer er forbundet. Hver båd følger en 100-punkts samlingstjekliste, der er underskrevet af teamlederen.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: Kvalitetstest og inspektion
      description: Hver færdig båd gennemgår obligatorisk lufttilbageholdelsestest, sømafskalning verifikation og en komplet systemkontrol inden forsendelse. Vores kvalitetslaboratorium opererer uafhængigt af produktionen og rapporterer direkte til ledelsen.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
