qc_section:
  tagline: Kvalitetskontrol
  title: Test- og kvalitetssikringsproces
  subtitle: Hver båd gennemgår obligatorisk test før forsendelse. Vores kvalitetslaboratorium opererer uafhængigt af produktionen og rapporterer direkte til ledelsen.
  steps:
    - step: '1'
      title: Råstofinspektion
      desc: PVC, Hypalon og drop-stitch-stoffer gennemgår trækprøvning (ASTM D751), riveudbredelse og UV-modstandsverifikation, før en batch går i produktion.
    - step: '2'
      title: 48-timers lufttilbageholdelsestest
      desc: Hvert rørkammer pustes op til 125 % af det nominelle tryk og holdes i 48 timer. Trykfald under 5 % udløser automatisk afvisning og geninspektion af søm.
    - step: '3'
      title: Belastnings- og balancetest
      desc: Færdige både lastes til maksimal nominel kapacitet og testes for stabilitet, fribord og håndtering. Hvert fartøj er vandtestet inden endelig inspektion.
oem_section:
  tagline: OEM Projekter
  title: Brand & OEM Partnerskab Case Studies
  subtitle: Fra koncept til container - hvordan vi hjælper globale brands med at lancere og skalere deres oppustelige vandscooterlinjer.
  cases:
    - challenge: Europæisk udendørs forhandler havde brug for en private-label SUP-linje med unik dækgrafik, miljøvenlig PVC og detailklar emballage - alt sammen leveret på 60 dage.
      solution: Udviklede brugerdefinerede digitale printfiler, hentede REACH-kompatible PVC og komprimerede prøveudtagning fra 3 runder til 1 ved at samlokalisere designteamet på vores Qingdao-fabrik.
      result: 55 dage fra underskrevet PO til FOB. 2.400 enheder fordelt på 4 SKU'er. Gentag ordre afgivet før den første container ankom.
    - challenge: Opstart af vandsport i USA havde brug for en højtydende drop-stitch kajak med tilpasset skrogform, co-branded emballage og BSCI certificering til detailplacering.
      solution: Tilpasset eksisterende drop-stitch kajakform med modificeret vippeprofil, udviklet co-branded emballagegrafik og leverede fuld BSCI revisionsdokumentation.
      result: Opført med succes i 3 store amerikanske udendørskæder. 5.000+ enheder det første år med 98 % gennemsalgsrate.
    - challenge: Australsk distributør krævede en CE-certificeret RIB serie med tilpassede rørfarver, Hypalon opgraderingsmulighed og overholdelse af australsk standard AS 1799.
      solution: Producerede præproduktionsprøver med 4 rørfarvevarianter, hentet CSM Hypalon fra japansk leverandør og koordineret tredjeparts AS 1799-overensstemmelsestest.
      result: 3-model RIB serie lanceret på AU/NZ-markedet. Efterfulgt af regeringens udbudssejr for 12 patrulje-RIB'er.
faq_section:
  tagline: FAQ
  title: B2B & OEM Ofte stillede spørgsmål
  questions:
    - q: Hvad er minimumsordremængden (MOQ) for OEM oppustelige SUP boards?
      a: MOQ starter ved 5-10 enheder for standard OEM modeller. Skræddersyede forme og private-label projekter kræver minimum 200 enheder afhængigt af kompleksitet. Prøveordrer og prøvekørsler er tilgængelige for nye brandlanceringer.
    - q: Har Aquafarer BSCI certificering?
      a: Ja. Vores fabrik opretholder en gyldig BSCI social compliance-certificering (revisionsrapport tilgængelig på anmodning). Vi har også ISO 9001:2015 til kvalitetsstyring, og 64 af vores modeller bærer CE-certificering (TÜV Rheinland). REACH og RoHS overensstemmelsesdokumentation leveres med hver OEM forsendelse.
    - q: Hvad er den typiske leveringstid for en OEM ordre?
      a: Standard leveringstid er 30-45 dage fra bekræftet PO og depositum. Tilpasset formudvikling tilføjer 15-20 dage til værktøj. Vi tilbyder fremskyndet produktion af hasteordrer og sæsonbestemte rush under forsommervinduet (jan-mar).
    - q: Kan du sende FOB Qingdao eller CIF til vores havn?
      a: Ja. Vi sender FOB Qingdao, CIF store globale havne og DDP til kvalificerede partnere. Vores logistikteam administrerer containerbooking, eksportdokumentation og fortoldning. Vi sender til mere end 50 lande på tværs af markederne i EU, USA, AU og Asien.
b2b_moq: 'Standard MOQ: 5-10 enheder pr. model (SUP/kajak/drop-stitch). RIB MOQ: 2–5 enheder. Prøveordrer velkommen til nye partnerskaber.'
production_flow:
  tagline: Produktionsflow
  title: Fra materiale til færdig båd
  subtitle: Hver båd gennemgår 6 produktionsstadier med QC-kontrolpunkter ved hvert trin. Ingen genveje, ingen oversprungne inspektioner.
  stages:
    - stage: '01'
      title: Materialemodtagelse og indgående kvalitetskontrol
      description: Alt indgående materiale logges efter batch-/lotnummer i vores ERP-system. PVC stofruller, drop-stitch-kerner, ventiler, klæbemidler og hardware er i karantæne indtil QC-sign-off.
      qc_check: Trækstyrke (ASTM D751), rivemodstand (ISO 4674), tykkelsesmåler, klæbemiddelviskositet, scanning af visuelle defekter
      qc_threshold: 100% af batches testet. Afvis hvis trækstyrke < 90 % af spec, rive < spec min, eller enhver visuel defekt
      responsibility: Indkommende QC-hold (3 inspektører)
    - stage: '02'
      title: CNC-skæring og materialeforberedelse
      description: Computeroptimeret indlejring udlægger paneler på PVC lager for at minimere spild. Automatiske CNC skæremaskiner bevarer 0,1 mm positionsnøjagtighed.
      qc_check: Dimensionskontrol mod CAD DXF-filer, inspektion af kantkvalitet, verifikation af panelantal
      qc_threshold: Hvert 20. panel målt. Tolerance ±0,5 mm. Afvis batch hvis >2 % uden for tolerance
      responsibility: Ledning af skæreværksted
    - stage: '03'
      title: Svejsning & Drop-Stitch Bonding
      description: Drop-stitch-kerner er bundet til ydre PVC-laminater ved hjælp af varmelaminering. Rørkamre er RF-svejsede eller varmluftsvejsede. Skinnebånd er tre-lags fusionsbundne.
      qc_check: Peeltest for hver 50 enheder (ASTM D751), måling af svejsebredde, log gennemgang af varmlufttemperatur, visuel søminspektion under baggrundsbelysning
      qc_threshold: Skrælstyrke min 8 N/cm. Svejsebreddetolerance ±1 mm. Enhver synlig kanalisering = afvisning
      responsibility: Svejse-QC (2 inspektører pr. skift)
    - stage: '04'
      title: Montering & Rigning
      description: 'Bådene flyttes til den endelige samling, hvor alle komponenter er parret: skrog + rør, ventiler installeret, D-ringe, håndtag, finnekasser og bæretaskebeslag. Hver enhed følger en 100-punkts samlingstjekliste.'
      qc_check: Afmelding af 100-punkters checkliste pr. enhed, ventilfunktionstest (10 åbne/lukke-cyklusser), verifikation af hardwaremoment, visuel inspektion
      qc_threshold: 'Nul-defektpolitik på sikkerhedskritiske emner (ventiler, D-ringe, håndtag). Mindre kosmetik: AQL 2,5 (ISO 2859)'
      responsibility: Samleholdsleder + linje QC
    - stage: '05'
      title: Tryktestning og kvalitetshold
      description: Hvert kammer pustes op til et nominelt tryk på 1,25 x (typisk 20-25 PSI) og holdes i 24-48 timer. Tryksensorer logger kontinuerligt. Kamre, der overstiger 5 % trykfald, afvises og sendes til sømeftersyn.
      qc_check: 24 timers trykhold log, sensorkalibrering verificeret dagligt, temperaturkompenseret trykaflæsning, søm gentest efter reparation
      qc_threshold: Max 5 % trykfald over 24 timer ved stabil temp. Ethvert kammer, der overstiger dette = 100 % gentest af hele produktionsbatchen
      responsibility: Kvalitetslaboratorium (uafhængig af produktion, rapporter til ledelsen)
    - stage: '06'
      title: Slutinspektion og pakning
      description: Afsluttende visuel og funktionel inspektion. Overfladefejl, farvekonsistens, etiket/BIN-verifikation, emballageintegritet og tilbehørsfuldstændighed. Enhederne vakuumpakkes, pakkes og palleteres til containerlæsning.
      qc_check: Fuld visuel inspektion, tjekliste for tilbehør pr. SKU, emballagefaldstest (1 m, tilfældig prøve), scanningsverifikation af etiket/stregkode
      qc_threshold: AQL 2,5 for større defekter, AQL 4,0 for mindre. Nultolerance for sikkerhedsmangler. 100 % af enhederne er visuelt inspiceret
      responsibility: Endeligt QC-hold (4 inspektører) + pakkeholdsleder
