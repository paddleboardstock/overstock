material_traceability:
  tagline: Sporbarhed
  title: Materialesporing og batchkontrol
  description: Hvert batch af råvarer tildeles et unikt lotnummer i vores ERP-system. Fra ankomst over produktion til det færdige produkt linker hver båds stykliste tilbage til den oprindelige leverandørbatch. Dette muliggør fuld upstream-sporbarhed for enhver kvalitets- eller overensstemmelsesforespørgsel.
  system: Tilpasset ERP (internt system) + fysiske batch-tags på hver arbejdsordre
  coverage: 100 % af produktionsmaterialerne — PVC, Hypalon, drop-stitch stof, klæbemidler, ventiler, hardware, emballage
  records_retained: 10 år (i henhold til CE 2013/53/EU-krav)
  suppliers:
    - material: Marine-grade PVC
      source: Kinesiske og koreanske leverandører
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japansk leverandør
      certified: ISO 9001, REACH
    - material: Drop-stitch stof
      source: Eget væveri + ekstern partner
      certified: Intern QC + leverandør ISO 9001
    - material: Ventiler og hardware
      source: Kinesiske OEM-leverandører
      certified: ISO 9001, materialecertifikater pr. batch
