content_service_modules:
  tagline: Servicemoduler
  title: OEM/ODM Service<br />Moduler
  subtitle: Hvert projekt kombinerer de rigtige servicemoduler. Ikke ethvert projekt har brug for hvert modul - vi scoperer kun, hvad dit projekt kræver.
  items:
    - title: Teknisk gennemgang og gennemførighed
      description: 'Vurdering af skrogplatform, kontrol af strukturel gennemførlighed, verifikation af stabilitet og opdrift, identifikation af overensstemmelsessti og bekræftelse af materialetilgængelighed. Output: feasibility-rapport med go/no-go-anbefaling.'
      icon: tabler:math-function
    - title: Design og konfiguration
      description: 'GA-tegning, dæklayout, rørkonfiguration, konsol- og siddepositioner, udstyrsmonteringsplan og farve/materialevalg. Output: godkendt GA og konfigurationsspecifikation.'
      icon: tabler:ruler
    - title: Prøveeksemplar & prototype
      description: Præproduktionsprøve med godkendte farver, logo og specificerede materialer til fysisk inspektion. Inkluderer prøvegodkendelsesprotokol, inspektionstjekliste og ændringsanmodningsproces.
      icon: tabler:3d-cube-sphere
    - title: Produktion & kvalitetskontrol
      description: Masseproduktion med 100-punkts QC-tjekliste pr. enhed, inspektioner i processen, trykprøvning (1,25x / 24-48 timer) og sporbarhed på seriel niveau. CE/ISO dokumentation udarbejdet parallelt.
      icon: tabler:clipboard-check
    - title: Branding og emballage
      description: Logoapplikation med private mærker, tilpasset skrog- og rørgrafik, dokumentation af mærkevareejere, detailklar eller palleteret emballage og forberedelse af reservedelssæt.
      icon: tabler:palette
    - title: Eksport og dokumentation
      description: Eksportpakning, containerladningsplan, FOB/CIF/DDP dokumentation, overholdelsespapirer pr. destinationsmarked og kommunikationsprotokol efter levering.
      icon: tabler:world
content_risk_control:
  tagline: Risiko & Leveringskontrol
  title: Projektrisiko &<br />Leveringsstyring
  subtitle: Professionelle OEM/ODM købere bekymrer sig lige så meget om risikokontrol som produktkvalitet. Sådan klarer vi det.
  items:
    - title: Definition af omfang og ejerskab
      description: 'Inden udviklingen begynder, definerer vi skriftligt: ​​tilpasningsomfang, værktøjskrav, prøvegodkendelseskriterier, ejerskab af tegninger og forme og dokumentationsansvar. Ingen uklarhed om, hvem der ejer hvad.'
      icon: tabler:file-text
    - title: Ændringskontrolproces
      description: Alle specifikationsændringer efter designbekræftelse følger en dokumenteret ændringsanmodningsproces med konsekvensanalyse (omkostninger, tidslinje, overholdelse). Ingen ikke-godkendte ændringer kommer i produktion.
      icon: tabler:arrows-diff
    - title: Batchkonsistensgaranti
      description: Den 50. enhed matcher den 1. godkendte prøve. Godkendte specifikationer fryses, materiale- og procesparametre er låst, og kontrolpunkter i processen bekræfter konsistens på tværs af produktionskørslen.
      icon: tabler:repeat
    - title: Levering & Kapacitetsgennemsigtighed
      description: Ledetider er angivet baseret på faktisk produktionskapacitet, materialelagerniveauer og nuværende ordrebelastning - ikke forhåbningsmål. Produktionsplan med milepælsdatoer angivet pr. ordre.
      icon: tabler:calendar-stats

