content_customization:
  tagline: Hvad kan tilpasses
  title: RIB-tilpasning<br />Indstillinger
  subtitle: Hvert element i en RIB-båd kan skræddersyes til din applikation, dit marked og dine mærkekrav.
  items:
    - title: Skrog og strukturel
      description: Skroglængde (2,5-8,5 m), skrogmateriale (GRP glasfiber eller marine-grade aluminium), skrogfarve (gelcoat eller malet), kølprofil (dyb-V, moderat-V, flad), agterspejlstype (lukket agterspejl med beslag eller brønd) og strukturel forstærkning til kommercielle belastningskrav.
      icon: tabler:sailboat
    - title: Rør & krave
      description: Rørmateriale (0,9–1,2 mm PVC eller 1,4–1,7 mm Hypalon/CSM), rørdiameter (40–55 cm), antal kamre (3–7), ventiltype (Halkey-Roberts, Leafield D7 eller Boston), rørfarve (standard eller brugerdefineret) og kravekonus/konuskonfiguration.
      icon: tabler:circle
    - title: Deck- og konsollayout
      description: Midterkonsol, sidekonsol eller styrestangsstyring. Sædelayout (jockeysæder, bænkesæder, bolstersæder). Dækbeklædning (EVA-skum i teak-look, skridsikker maling eller blank GRP). Udstyrsmonteringspunkter, gribeskinner og D-ringspositioner.
      icon: tabler:layout-dashboard
    - title: El & Navigation
      description: Navigationslys (LED), lænsepumpesystem, batteristyring, VHF-radioinstallation, GPS/kortplottermontering, USB-opladningsporte og konfiguration af switchpanel.
      icon: tabler:bolt
    - title: Branding og grafik
      description: Skrog- og rørgrafik (screen print, varmeoverførsel, UV digital print), logoplacering, skræddersyede farveskemaer, identifikationsmærker og brugerdefineret ejerdokumentation med dit brand.
      icon: tabler:palette
    - title: Sikkerhed og overholdelse
      description: Designkategoriklassificering (A/B/C/D pr. RCD), brandslukningssystem, brændstofsystemspecifikation (transportabel tank, fast tank, under dæk) og overensstemmelsesdokumentationspakke til dit målmarked.
      icon: tabler:shield
content_applications:
  tagline: Applikationskonfigurationer
  title: RIB-konfigurationer<br />Efter applikation
  subtitle: Forskellige missioner kræver forskellige konfigurationer. Her er gennemprøvede opsætninger til de mest almindelige RIB-applikationer.
  items:
    - title: Redning og patrulje
      description: Deep-V-skrog, Hypalon-rør, selvbærende dæk, bolstersæder, gribehåndtag, navigationslys og kraftige D-ringe. RCD Design Kategori B eller C. Brandsikkert brændstofsystem og elektrisk elektrisk.
      icon: tabler:lifebuoy
    - title: Dykkerstøtte
      description: Bred bjælke, bagerste boardingstige, tankstativpositioner, ekstra D-ringe, dykkerflagmontering, forstærket agterspejl til dobbelte påhængsmotorer og skridsikker EVA-beklædning i fuld dæk.
      icon: tabler:mask
    - title: Turisme & Kommerciel
      description: Passagercertificeret layout med bænke, parasoll/Bimini, gribeskinner, tør opbevaring og dobbelt batterisystem. RCD Kategori C. Designet til resort- og charterflådeoperationer.
      icon: tabler:beach
    - title: Fiskeri
      description: Åbent dækslayout, stangholderpositioner, levende agnbrønd, fishfinder-montering, trollingmotormontering, forstærket agterspejl og bærbart brændstofsystem. Valgmuligheder for midterkonsol eller sidekonsol.
      icon: tabler:fish
    - title: Fritid & Yacht Tender
      description: Letvægtsskrog, PVC-rør, komfortable siddepladser, teleskopstang eller kompakt konsol, løftepunkter til davit og aftagelig brændstoftank. RCD kategori C eller D.
      icon: tabler:sailboat
    - title: Professionel arbejdsbåd
      description: Mulighed for aluminiumsskrog, kraftig forstærkning, hydraulisk styring, elektrisk udstyr i kommerciel kvalitet, radarbue og missionsspecifikt udstyrsintegrationspunkter. Tilpasset overholdelse pr. projekt.
      icon: tabler:anchor
process_steps:
  title: 7-trins RIB OEM/ODM udviklingsproces
  subtitle: Fra projektopgave til eftersalg — en defineret arbejdsgang med klare milepæle og leverancer
  steps:
    - number: '01'
      title: Projektbeskrivelse og krav
      description: Definer målapplikationen, skrogstørrelsen, rørmateriale, overholdelseskrav og brandingbehov. Vi vurderer gennemførligheden og bekræfter samarbejdsmodellen (OEM/ODM/Semi-Custom/Fuld Custom).
      timeline: 3-5 dage
    - number: '02'
      title: Teknisk gennemgang og gennemførlighed
      description: Ingeniørteamet gennemgår strukturel gennemførlighed, stabilitet og opdriftsberegninger, overholdelsesvej og materialetilgængelighed. Vi identificerer eksisterende forme eller tilpassede formkrav.
      timeline: 5-7 dage
    - number: '03'
      title: Forslag & Tilbud
      description: Modtag et detaljeret forslag inklusive specifikationer, 3D-gengivelser eller GA-tegninger, compliance-omfang, tidslinje og enhedspriser baseret på volumenniveauer og MOQ.
      timeline: 5-7 dage
    - number: '04'
      title: Designbekræftelse & prøveudtagning
      description: Godkend endelig GA, dæklayout og rørkonfiguration. Vi producerer en præproduktionsprøve med dit brandfarver, logo og specificerede materialer til din fysiske inspektion.
      timeline: 15-20 dage
    - number: '05'
      title: Prøvegodkendelse & QC-protokol
      description: 'Inspicer og godkend prøven. Definer produktions-QC-protokollen: tryktest (1,25x / 24–48 timer), dimensionskontrol og tjekliste for overensstemmelsesdokumentation pr. skrog.'
      timeline: 3-5 dage
    - number: '06'
      title: Masseproduktion og kvalitetskontrol
      description: Fuld produktionskørsel med 100-punkts QC-tjekliste pr. enhed. Inspektioner i processen, trykprøvning og sporbarhed på seriel niveau. CE/ISO dokumentation udarbejdet parallelt.
      timeline: 30-45 dage
    - number: '07'
      title: Pakning, forsendelse og eftersalg
      description: Brugerdefineret emballage (standard, detailklar eller palleteret), eksportdokumentation, containerladning og logistik. Reservedelssæt og vedligeholdelsesdokumentation medfølger.
      timeline: 7-14 dage
certifications:
  title: Overholdelse og certificeringer for RIB-både
  subtitle: Hver brugerdefineret RIB-ordre leveres med modelspecifik overholdelsesdokumentation
  items:
