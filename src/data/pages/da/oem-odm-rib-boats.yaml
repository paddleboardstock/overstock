      badge: REACH
faq:
  title: RIB OEM/ODM — Ofte stillede spørgsmål
  questions:
    - q: Hvad er forskellen mellem OEM og ODM for RIB-både?
      a: 'OEM (Original Equipment Manufacturing): du giver detaljerede specifikationer, og vi bygger dit design. ODM (Original Design Manufacturing): du vælger en gennemprøvet Aquafarer RIB-platform, og vi tilpasser den med dine ønskede funktioner og branding. ODM er hurtigere og lavere omkostninger; OEM tilbyder maksimal designkontrol.'
    - q: Kan jeg tilpasse RIB-skrogets form og størrelse?
      a: Ja. Vi tilbyder semi-tilpassede modifikationer af eksisterende skrogforme (forskellige dæklayouts, rørkonfigurationer) og fuld skræddersyet skrogudvikling med nye CNC-bearbejdede forme. Semi-tilpassede projekter kan starte ved 2-5 enheder; fuld skik kræver typisk højere forpligtelser.
    - q: Hvilke rørmaterialer er tilgængelige til brugerdefinerede RIB'er?
      a: Vi tilbyder 0,9-1,2 mm PVC til rekreativ og let kommerciel brug og 1,4-1,7 mm Hypalon/CSM til professionelle, rednings- og kommercielle applikationer, der kræver overlegen UV- og ozonbestandighed (10-15 års levetid vs. 5-8 år for PVC).
    - q: Kan du konfigurere RIB'er til specifikke applikationer som redning, dykning eller fiskeri?
      a: Ja. Vi opretholder gennemprøvede konfigurationsskabeloner til redning/patrulje, dykkerstøtte, turisme/charter, fiskeri, yachtudbud og professionelle arbejdsbådsapplikationer. Hver skabelon inkluderer anbefalet skrogtype, rørmateriale, dæklayout og udstyr - som vi derefter tilpasser til dine nøjagtige krav.
    - q: Hvilke oplysninger har du brug for til et RIB OEM/ODM tilbud?
      a: Målanvendelse, ønsket skroglængde, præference for rørmateriale (PVC eller Hypalon), omtrentlig mængde og leveringsplan, overholdelse af målmarkedets krav og eventuelle referenceprodukter eller specifikationer. Jo flere detaljer du giver, jo hurtigere og mere præcist er vores tilbud.
    - q: Hvad er MOQ for brugerdefinerede RIB-både?
      a: For eksisterende skrogforme med standardmodifikationer starter MOQ ved 2-5 enheder pr. design. For brugerdefinerede forme og fuld tilpasset udvikling afhænger MOQ af projektets kompleksitet - typisk 10-20 enheder til semi-custom og 30+ for fuld brugerdefineret med nyt værktøj.
    - q: Hvem ejer de tilpassede forme og tegninger?
      a: Forme udviklet med Aquafarer-basedesign forbliver Aquafarers ejendom. Fuldt tilpassede forme bestilt og betalt af kunden kan overdrages til kundens ejerskab i henhold til kontraktvilkår. Alle formejervilkår er dokumenteret inden projektstart.
    - q: Hvordan pakkes brugerdefinerede RIB'er til eksport?
      a: 'Standard: brugerdefineret vugge + strækomslag til containerladning. Premium: detailklar emballage, vakuumpakning eller palleteret. Vi tilbyder FOB Qingdao, CIF og DDP forsendelse. Fuld eksportdokumentation og fortoldning inkluderet.'
