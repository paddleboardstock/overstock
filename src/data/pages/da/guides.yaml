hero:
  tagline: Vejledninger
  title: Ny til SUP?
  subtitle: Praktiske guider til at hjælpe dig med at vælge, bruge og nyde oppusteligt vandsportsudstyr.
size_guide:
  tagline: Størrelse & Specifikationer
  title: Find den rigtige størrelse til dine behov
  desc: Sammenlign produktdimensioner, vægtkapaciteter og anbefalede anvendelser. Uanset om du har brug for en tur-SUP, en kompakt kajak eller en kommerciel RIB - vores størrelsesguide hjælper dig med at vælge den rigtige pasform.
  link_label: Fuld størrelse guide med produktspecifikationer →
  link: /size-guide
  cards:
    - title: SUP tavler
      desc: Vælg længde baseret på din vægt og påtænkte brug. Bredere boards (32"+) giver mere stabilitet. Længere boards (11-12 ft) spor bedre til touring.
    - title: Kajakker
      desc: Enkelte kajakker (9 fod) til solorejser og floder. Tandem kajakker (12 fod) til to padlere eller en med gear. Kontroller altid vægtkapaciteten.
    - title: Joller og RIB'er
      desc: Vælg længde efter antal passagerer og brug. Større RIB'er (4,5 m+) til offshore og redning. Mindre joller (2,7 m) som tendere og fiskeplatforme.
