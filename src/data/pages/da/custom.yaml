hero:
  tagline: Paddle Board Overstock Custom Lab
  title: Design dit eget<br />vandfartøj
  subtitle: OEM, ODM, private label og tilpassede brandingtjenester til virksomheder over hele verden. Fra en enkelt prototype til hele produktionskørsler.
  cta: Start dit projekt
  footer_link: /contact
steps_section:
  tagline: Hvordan det virker
  title: Fra idé til produktion
  subtitle: Fire trin fra din idé til et færdigt, havfærdigt produkt.
  steps:
    - num: '01'
      title: Vælg dit bord
      desc: Vælg mellem vores kernemodeller - SUP, kajak, jolle eller RIB. Vælg størrelse, materiale og farve.
    - num: '02'
      title: Upload dit design
      desc: Send os dit logo, kunstværk eller brandretningslinjer. Vores designteam udarbejder et digitalt bevis.
    - num: '03'
      title: AI Mockup anmeldelse
      desc: Se en fotorealistisk AI-genereret mockup af dit brugerdefinerede board, før produktionen begynder.
    - num: '04'
      title: Produktion & Levering
      desc: Når den er godkendt, kommer din ordre ind i vores ISO-certificerede produktionslinje. Leveringstider fra 30 dage.
services_section:
  tagline: Tjenester
  title: Produktionsydelser til globale mærker
  subtitle: Fleksible engagementsmodeller - fra kontraktfremstilling til fuld-service varemærkeopbygning.
  items:
    - title: OEM-fremstilling
      desc: Vi producerer dine designs efter specifikationer - din IP, dine tegninger, dine kvalitetsstandarder. Fuld NDA-beskyttelse.
      icon: ⚙️
    - title: ODM Løsninger
      desc: Vælg mellem 50+ gennemprøvede platforme og tilpas størrelse, farve, grafik og emballage.
      icon: 🎨
    - title: Private Label
      desc: Dit brand på vores produkter - logo, emballage, hængemærker, manualer. Detailklar ud af æsken.
      icon: 🏷️
    - title: Brugerdefineret branding
      desc: Dækpudeudskrivning, skroggrafik, tube-decals og brugerdefinerede etiketter - fuld mærkeintegration.
      icon: ✨
capabilities_section:
  tagline: Evner
  title: Produktions- og tilpasningsmuligheder
  subtitle: Alt hvad du behøver at vide, før du afgiver din ordre.
  capabilities:
    - label: Ordrevolumen
      value: MOQ 5-10 enheder (SUP/kajak), 2-5 enheder (RIB)
    - label: Leveringstid
      value: 30-45 dage standard; 15-20 dage for prototyper
    - label: Tilpasning
      value: Størrelse, form, farve, grafik, emballage, hardware
    - label: Materialer
      value: PVC, Hypalon, drop-stitch, glasfiber, aluminium
    - label: Trykning
      value: Digital (CMYK), serigrafi, varmeoverførsel, sublimering
    - label: Certificering
      value: CE, ISO 9001, BSCI, UKCA (understøttelse af global overholdelse)
why_section:
  tagline: Hvorfor Paddle Board Overstock
  title: Én fabrik. Én standard. Nul kompromiser.
  points:
    - text: 12.000 kvm integreret produktionsanlæg
      highlight: 12.000 kvm
    - text: 200-300 faglærte og ingeniører
      highlight: 200-300
    - text: 15.000 både produceret årligt
      highlight: 15 000
    - text: ISO 9001 certificeret kvalitetsstyring
      highlight: ISO 9001
    - text: CE certificerede produkter til EU-markedet
      highlight: CE
  cta: Se fabriksdetaljer
  cta_link: /factory
  contact:
    title: Klar til at diskutere dit projekt?
    desc: Vores team svarer inden for 24 timer med et foreløbigt tilbud.

