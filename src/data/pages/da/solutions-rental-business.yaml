      - title: Volumenpriser
        description: Differentierede engrospriser for flåder på 20+ enheder med fordelagtige logistikpriser
      - title: Brugerdefineret branding
        description: Logoudskrivning på udstyr, branded redningsveste og tilpassede farvemuligheder til din lejeflåde
