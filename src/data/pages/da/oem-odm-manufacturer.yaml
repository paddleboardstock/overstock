breadcrumb: OEM/ODM-producent
tldr:
  summary: Aquafarer er en OEM/ODM-producent, der leverer direkte fra fabrik. 12.000 m² ISO 9001:2015-certificeret facilitet, årlig produktion på 15.000 enheder, CE/BSCI/REACH/UKCA-overholdelse, lave MOQ fra 2-10 enheder.
  points:
    - 12.000 m² ISO 9001:2015-certificeret fabrik i Qingdao
    - Årlig kapacitet på 15.000 enheder med 200-300 dygtige arbejdere
    - Overholdelse af CE 2013/53/EU, UKCA, BSCI, REACH
    - 'Lave MOQ: 2-5 enheder (RIB), 5-10 enheder (SUP) for standardmodeller'
    - Eksport til over 50 lande med FOB Qingdao-forsendelse
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015-certificeret
      desc: SGS-revideret kvalitetsledelsessystem på alle produktionslinjer.
      variant: cert
    - icon: ⭐
      title: CE- og UKCA-overholdelse
      desc: Fuld overholdelse af EU 2013/53/EU og britiske mærkningskrav.
      variant: cert
    - icon: ⭐
      title: BSCI-social revision
      desc: Verificerede etiske arbejdspraksisser og arbejdspladsstandarder.
      variant: standard
    - icon: ⭐
      title: Lav MOQ fra 2 enheder
      desc: 'Standard RIB-modeller fra 2-5 enheder, SUP fra 5-10 enheder. Skræddersyet form: 200+.'
      variant: standard
process_section:
  eyebrow: Vores proces
  title: Komplet OEM/ODM-arbejdsgang
  subtitle: Fra designbrief til containerindlæsning — seks trin til dit oppustelige fartøj under eget mærke.
  steps:
    - step: '01'
      title: Specifikation & designbrief
      desc: Del dine målspecifikationer, CAD-tegninger eller et referenceprodukt. Vores ingeniørteam gennemgår materialer, dimensioner og overholdelseskrav (CE, BSCI), før vi prissætter.
    - step: '02'
      title: 3D-form-prototyping
      desc: Vi designer og CNC-fræser skræddersyede forme til SUP-brædder, kajakskrog og RIB-komponenter. Prototypeprøver produceres inden for 15-20 arbejdsdage til din godkendelse.
    - step: '03'
      title: Materialevalg & prøveproduktion
      desc: Vælg mellem PVC i militærkvalitet (0,9-1,2 mm), Hypalon CSM eller drop-stitch-kernevæv. Vi producerer forproduktionsprøver i dine brandfarver, logo og emballage til endelig godkendelse.
    - step: '04'
      title: CE-fabriksrevision & overholdelse
      desc: Hver OEM-ordre indeholder overholdelsesdokumentation — CE-overensstemmelseserklæring, ISO 9001-sporbarhedsregistreringer, BSCI-social overholdelsesrapport og REACH-materialedeklarationer.
    - step: '05'
      title: Serierproduktion & inline kvalitetskontrol
      desc: Produktionsserier følger vores 100-punkts kvalitetskontrolliste. Hver enhed gennemgår 24-timers trykholdningstest, sømtrækketests og visuel inspektion før emballering.
    - step: '06'
      title: FOB Qingdao-logistik & forsendelse
      desc: Færdigvarer palleres, folieindpakkes og containerindlæses i Qingdao havn. Vi håndterer al eksportdokumentation, toldbehandling og tilbyder forsendelsessporing i realtid.
capabilities_section:
  eyebrow: Produktionskapacitet
  title: Hvad vi bygger
  subtitle: Seks kerneproduktionskapaciteter til globale B2B-partnere.
  items:
    - title: Drop-stitch SUP-brætproduktion
      desc: Drop-stitch-kernelaminering i fuld længde til stive stand-up paddle-brædder med højt tryk (15-20 PSI). Skræddersyet længde, bredde, tykkelse, rockerprofil og grafisk design.
    - title: Produktion af oppustelige PVC-både
      desc: Højfrekvens-svejsede PVC joller, tenders og sportsbåde. Flere kammerkonfigurationer, gulvindstillinger (liste, luftdæk, rullesammen) og tilbehørsintegration.
    - title: Hypalon RIB-fabrikation
      desc: Hypalon CSM-rør i kommerciel kvalitet bundet til glasfiber- eller aluminiums dybe-V-skrog. Længder fra 3,3 m til 6,0 m til patrulje-, rednings-, tur- og dykkeroperationer.
    - title: Private label & skræddersyet branding
      desc: 'Komplet private label-service: skræddersyet logo i varmetransfer eller silkescreentryk, brandemballage (detailkasser, bæreposer), brugermanualer på dit sprog samt stregkode/UPC-registrering.'
    - title: Skræddersyet form- og værktøjsdesign
      desc: Internt 3D CAD/CAM-ingeniørteam. Vi designer og fremstiller skræddersyede aluminium- og kompositforme til unikke skrogformer, dækkonfigurationer og tilbehørsmonteringspunkter.
    - title: OEM-tilbehør & kitting
      desc: Redningsveste (CE 12402), dobbeltvirkende pumper, kulstof/nylon-årepadder, reparationskits, bæreposer og leash. Komplet kitting og bundtpakning til salgsklar præsentation.
experience_section:
  eyebrow: Praktisk erfaring
  title: Partnerskaber der byggede brands
  subtitle: Ægte historier fra brands og organisationer, der valgte Aquafarer til OEM/ODM-produktion.
  stories:
    - quote: Vi kom til Aquafarer med en skitse på en serviet og en liste med krav. Otte måneder senere havde vi et produktionsklart produkt, der bestod CE-certificering i første forsøg.
      narrative: En europæisk startup med et nyt SUP-design henvendte sig til Aquafarer om ODM-produktion. Aquafarers R&D-team førte konceptet gennem CAD-design, FEA-strukturanalyse, hydrodynamisk simulering, formfremstilling, prototypefremstilling og produktionsværktøj. Startuppens grundlægger besøgte Qingdao tre gange under processen. Det endelige produkt bestod CE-certificering uden ændringer — et resultat, som grundlæggeren tilskriver, at Aquafarers ingeniørteam forstod de europæiske reguleringskrav fra starten.
      context: Europæisk SUP-brand-lancering, 2023-2024
      source: Brandgrundlægger
    - quote: Niveauet af NDA-beskyttelse og IP-sikkerhed hos Aquafarer giver os trygheden til at dele vores proprietære designs. De behandler vores IP, som var det deres egen.
      narrative: En amerikansk virksomhed inden for marint udstyr med proprietær ventelteknologi havde brug for en produktionspartner, der kunne beskytte deres IP og samtidig producere i stor skala. Efter revision af fem kinesiske producenter valgte de Aquafarer baseret på fabrikkens IP-beskyttelsesprotokoller, sikker håndtering af designfiler og villigheden til at underskrive strenge NDA’er. Partnerskabet har produceret tre produktlinjer over fire år uden en eneste IP-hændelse.
      context: Amerikansk virksomhed inden for marint udstyr, OEM-partnerskab siden 2021
      source: VP Operationer
