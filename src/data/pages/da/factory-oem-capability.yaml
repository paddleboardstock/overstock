why_us:
  - title: Vertikal integration
    description: Vi ejer vores fabrik, forme og forsyningskæde — ingen mellemled, ingen underleverandører. Det giver os kontrol over kvalitet, omkostninger og levering.
  - title: Dobbelt certificering
    description: ISO 9001-kvalitetsledelse og BSCI-certificering for social ansvarlighed. Fabriksrevisionsrapporter tilgængelige på anmodning.
  - title: CE-overholdelse
    description: Alle standardmodeller bærer CE 2013/53/EU-certificering. Skræddersyede modeller kan CE-certificeres gennem vores etablerede proces.
  - title: Lavt MOQ
    description: Start med så få som 5 enheder for standardmodeller. Vi hjælper nye brands med at lancere uden at binde for meget lager.
