services:
  - title: Produktdesign og ingeniørarbejde
    description: Vores interne R&D-team arbejder med dit koncept eller din specifikation for at udvikle CAD-tegninger, 3D-modeller og prototyper. Vi tilbyder formedesign, optimering af skrogform og vejledning i materialevalg.
  - title: Skræddersyet branding og grafik
    description: Digitaltryk i fuld farve, silkscreentryk, prægning og etiketmuligheder. Vi udvikler brandspecifik dækgrafik, tube-branding og emballage klar til detailhandel.
  - title: Tilpasning af materialer og specifikationer
    description: Vælg mellem PVC (standard, miljøvenlig, flammehæmmende), Hypalon/CSM, drop-stitch og hybridkonstruktioner. Skræddersyede tubefarver, stofvægte og forstærkningsmuligheder.
  - title: Emballering og logistik
    description: Skræddersyet detailemballage, private label-æsker, vakuumemballering, palletering og containerindlæsning. Leveringsbetingelser FOB Qingdao, CIF eller DDP tilgængelige.

