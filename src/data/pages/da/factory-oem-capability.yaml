hero:
  tagline: OEM/ODM-produktion
  title: OEM- og private label-produktion
  subtitle: Fra koncept til container — tilpas hver detalje af din linje af oppustelige fartøjer

intro: Paddle Board Overstock tilbyder omfattende OEM- og ODM-ydelser til brands, distributører og offentlige myndigheder i hele verden. Med 10+ års eksporterfaring og en fabrik på 12.000 m² med ISO 9001- og BSCI-certificering varetager vi alt fra produktdesign og udvikling af forme til fuldskalaproduktion, emballering og logistik.

