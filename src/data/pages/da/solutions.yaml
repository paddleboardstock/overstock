features3_solutions:
  tagline: Løsninger
  title: Dit vandeventyr<br />Forretningspartner
  isBeforeContent: false
  columns: 3
  items:
    - title: Vandsportsklubber
      description: Komplet udstyrspakker, tilpasset branding og vedligeholdelsesprogrammer for SUP klubber, kajakklubber, surfskoler og træningscentre.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vandsport RIB'er
      description: Specialbyggede RIB'er til sejlerskoler, vandsportscentre og eventorganisationer. Coachbåde, slæbebåde og marskalfartøjer til professionel vandsport.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Feriesteder og hoteller
      description: Førsteklasses vandsportsprogrammer med flådeudstyr, sikkerhedssystemer, personaletræning og indtægtsstyring for hotelejendomme.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Vandmærke-iværksættere
      description: Private label OEM/ODM fremstilling med lave MOQ'er, tilpasset produktdesign, emballering og global forsendelse til nye brandejere.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Dykkercenter både
      description: Stabile RIB-platforme med nem ind-/udstigning, opbevaring af udstyr og motorkonfigurationer optimeret til dykkeroperationer.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Rednings- og Nødfartøjer
      description: Højhastigheds-RIB'er og gummibåde designet til søgning og redning, beredskab og kystvagtsoperationer.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Tenderløsninger til Yachtter
      description: Kompakte, stilrene RIB-tendere, der supplerer superyachtter og fritidsfartøjer. Nem opbevaring, kraftfuld ydeevne.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Fiskebådløsninger
      description: Stabile, holdbare gummibåde og RIB'er konfigureret til kommercielle og fritidsfiskeoperationer.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Udstyr til Maritim Turisme
      description: Floteklare gummibåde, SUP-brædder og kajakker til resorter, turoperatører og udlejning af vandsport.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Offshore Energy RIB'er
      description: Heavy-duty RIB'er til olie- og gasplatformsstøtte, overførsel af besætning til vindmølleparker, inspektion af undersøiske kabler og marinekonstruktion.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Akvakultur arbejdsbåde
      description: Korrosionsbestandige RIB'er til fiskeopdræt, perledyrkning og havbrug. Hypalon rør, rustfrit stål hardware, holdbarhed til daglig brug.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Havforskning og -undersøgelse
      description: Stabile instrumentklare RIB'er til oceanografisk forskning, miljøovervågning, vandkvalitetsprøvetagning og universitetsundervisningsprogrammer.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Kommersielle Arbejdsbåde
      description: Tunge RIB'er til patrulje, opmåling, transport og offshore-logistik. Bygget til de krævende behov i kommerciel drift.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Ikke sikker på, hvilken vej der passer til din virksomhed?
  subtitle: Fortæl os om din operation - vi vil anbefale den rigtige udstyrspakke, branding-program eller tilpassede løsning.
  actions:
    - variant: primary
      text: Få en gratis konsultation
      href: /contact

