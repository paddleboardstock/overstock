hero:
  tagline: Marin ekspertise
  title: 'Årtiers maritim ingeniørkunst<br />i hvert skrog'
  subtitle: 'Paddle Board Overstock kombinerer dyb materialevidenskab, præcisionsproduktion og test i den virkelige verden for at bygge fartøjer, der leverer, når det gælder.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstocks marin- og udviklingsteam på arbejde
expertise_materials:
  tagline: Materialevidenskab
  title: 'Det rigtige materiale<br />til hver anvendelse'
  subtitle: 'Vi arbejder med tre kernematerialer — hvert valgt til specifikke anvendelser og præstationskrav.'
  columns: 3
  items:
    - title: Marint PVC
      description: '1100 denier PVC-stof — vores mest alsidige materiale. UV-stabiliseret, slidstærkt og REACH-overholdende. Ideelt til fritidsbåde, SUP-brætter og kajakker, hvor vægt og omkostningseffektivitet er vigtig.'
      icon: tabler:droplet
    - title: Hypalon/CSM i premiumkvalitet
      description: 'Overlegen kemikaliebestandighed og UV-stabilitet. Hypalon-både kan holde 15-20 år med den rette pleje. Anbefales til kommercielle, rednings- og militære anvendelser, hvor langsigtet holdbarhed er kritisk.'
      icon: tabler:shield
    - title: Glasfiber og aluminium
      description: 'Dyb-V glasfiberskrog til gummibåde og patruljebåde — bølgeskærende præstation i hårde forhold. Aluminiumskrog til tunge kommercielle arbejdsbåde, der kræver maksimal styrke og lastekapacitet.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Produktionskapacitet
  title: 'Præcisionsproduktion<br />i hvert trin'
  subtitle: 'Vores anlæg på 12.000 m² er udstyret med specialmaskiner til hvert trin i produktionen.'
  columns: 2
  items:
    - title: CNC-klipning
      description: 'Computerstyret klipning sikrer præcise, gentagelige stofpaneler med minimalt spild. Hver del passer præcist som designet.'
      icon: tabler:cpu
    - title: Højfrekvenssvejsning
      description: 'Industriel HF-svejsning skaber sømme, der er stærkere end basismaterialet. Konsekvent temperatur- og trykstyring sikrer lufttætte forseglinger i hver produktionsrunde.'
      icon: tabler:bolt
    - title: Drop-stitch-kernemontering
      description: 'Tusindvis af polyestertråde forbinder stoffets øverste og nederste lag og muliggør oppustning ved højt tryk (15-20 PSI) til stive, stabile SUP-brætter og gulve.'
      icon: tabler:building-arch
    - title: Trykprøvning
      description: 'Hvert oppustelige produkt trykprøves inden forsendelse. RIB-rør testes ved 1,25x det nominelle tryk — holder det der, klarer det sig på vandet.'
      icon: tabler:wind
    - title: Sømstyrkeprøvning
      description: 'Tilfældige prøver fra hver produktionsbatch gennemgår destruktive sømstyrketests. Resultaterne logges og kan spores til specifikke produktionsrunder.'
      icon: tabler:files
    - title: Vandprøvning
      description: 'Hver RIB-model gennemgår søprøver inden certificering. Test i virkelige kystforhold validerer ydeevne, håndtering og stabilitet.'
      icon: tabler:ripple
expertise_design:
  tagline: Design & teknik
  title: 'Konstrueret til virkelige forhold'
  subtitle: 'Vores designfilosofi starter med, hvordan båden skal bruges — derefter bygges ingeniørarbejdet omkring den anvendelse.'
  items:
    - title: Dyb-V skrogdesign
      description: "Vores glasfiberskrog har beregnede V-vinkler, optimeret til hver models længde og tilsigtede brug. Stejlere V til præstation i hårdt vand, fladere til stabilitet."
    - title: Flerkammersikkerhed
      description: 'Hver båd har 3-7 uafhængige luftkamre. Hvis ét rum går tabt, holder de resterende kamre båden flydende og i drift.'
    - title: Ergonomisk layout
      description: 'Konsolplacering, rørhøjde og sædeplacering er designet omkring operatørens komfort ved længere tids brug — hvad enten det er patrulje, fiskeri eller transport.'
    - title: Skræddersyet konfiguration
      description: 'Rørfarver, konsolkonfiguration, brændstofkapacitet, tilbehørsbeslag — hver model kan tilpasses specifikke driftskrav.'
cta:
  title: 'Har du en bestemt anvendelse i tankerne?'
  subtitle: 'Vores ingeniørteam kan rådgive om materialevalg, design og produktion til dit projekt.'
  actions:
    - variant: primary
      text: Spørg vores ingeniører
      href: /contact
    - text: Se produktprogrammet
      href: /products
