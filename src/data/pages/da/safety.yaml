certifications:
  - title: CE-certificering (EU 2016/425)
    standard: PPE-forordning (EU) 2016/425 | EN ISO 12402
    description: Al Aquafarer-sikkerhedsudstyr overholder CE-mærkningskravene i henhold til EU's forordning om personlige værnemidler. Hvert produkt testes uafhængigt af TÜV Rheinland, et europæisk anmeldt organ. Vores gummibåde og RIB-både opfylder kravene til kategori C og D i direktivet om fritidsbåde 2013/53/EU (RCD).
    body: CE-certificering dækker væsentlige sundheds- og sikkerhedskrav til personlige flydemidler og oppustelige fartøjer. TÜV Rheinland reviderer vores produktionsfacilitet årligt for at bekræfte løbende overholdelse.
  - title: SOLAS — sikkerhed for menneskeliv til søs
    standard: SOLAS kapitel III | LSA-koden
    description: Life Vest Pro overholder SOLAS-reglerne for offshore- og kommercielle marineoperationer. Testet for 24 timers flydeevne, automatisk oppustning ved neddykning og ydeevne i søtilstande op til styrke 5. Opfylder kravene i kapitel III til redningsvester på kommercielle fartøjer.
    body: SOLAS-godkendelse kræver uafhængig test af et anmeldt organ for flydeevne, styrke, synlighed og automatisk aktivering. Vores Life Vest Pro har fuld SOLAS-typegodkendelse med MED-certificering.
  - title: USCG Type III / Type V
    standard: 46 CFR Del 160 | USCG-godkendelse
    description: Udvalgte Aquafarer-redningsvester opfylder United States Coast Guards klassificering for type III (flydehjælp) og type V (specialanvendelse). Velegnede til beskyttede farvande, kystsejlads og kommercielle operationer, der kræver USCG-godkendte redningsvester (PFD).
    body: USCG-godkendelse kræver test af et uafhængigt laboratorium, der er anerkendt af kystvagten. Type V-godkendelse omfatter hybridoppustelige konstruktioner, der kræver manuel eller automatisk aktivering.
  - title: BSCI social ansvarlighed
    standard: amfori BSCI adfærdskodeks
    description: Vores fabrik revideres årligt i henhold til amforis Business Social Compliance Initiative (BSCI). Dette bekræfter etiske arbejdspraksisser, arbejdssikkerhed, rimelige arbejdstider og miljøledelse på vores produktionsfacilitet på 12.000 m².
    body: BSCI-overholdelse er en forudsætning for europæiske detailhandlere og importører. Vores nuværende BSCI-vurdering er "C" (God), revideret af SGS.
  - title: REACH- og RoHS-overholdelse
    standard: EU REACH-forordning (EF) 1907/2006 | RoHS-direktiv 2011/65/EU
    description: Alle PVC-forbindelser, lim og belægninger, der anvendes i Aquafarer-produkter, overholder EU's REACH-kemikaliesikkerhedsregler og RoHS-begrænsninger for farlige stoffer. Sikkerhedsdatablade (MSDS) er tilgængelige for hver produktlinje.
    body: REACH-overholdelse sikrer, at ingen begrænsede SVHC-stoffer overstiger grænseværdierne. Regelmæssige tests hos uafhængige laboratorier bekræfter løbende overholdelse for hver produktionsbatch.
  - title: ISO 9001:2015 kvalitetsledelse
    standard: ISO 9001:2015 | Certificeret af TÜV Rheinland
    description: Vores kvalitetsledelsessystem er ISO 9001:2015-certificeret af TÜV Rheinland og dækker design, produktion, test og service efter salg. Årlige overvågningsrevisioner sikrer løbende forbedring og processtyring.
    body: ISO 9001-certificering kræver dokumenterede kvalitetspolitikker, interne revisioner, ledelsesgennemgange, korrigerende handlingsprocedurer og sporbare produktionsregistreringer.
testimonial:
  quote: Vi har indkøbt sikkerhedsudstyr fra flere leverandører i Asien. Aquafarer er den eneste producent, der fremlagde komplet CE-dokumentation, SOLAS-certifikater og testrapporter fra tredjepart på forhånd — uden at vi bad om det.
  author: Erik Lindström
  title: Sikkerhedsansvarlig
  company: Baltic Marine Supply
  location: Finland
content_overpressure:
  tagline: Sikkerhed ved overtryk
  title: Håndtering af RIB-rørtryk<br />i varme klimaer
  subtitle: Trykket i oppustelige rør stiger med temperaturen. Forståelse og håndtering af overtryk forhindrer skader og sikrer sikker drift i tropiske og ørkenmiljøer.
  items:
    - title: Boyle-overtryksventiler
      description: Aquafarer RIB-rør er udstyret med overtryksventiler, der automatisk udlufter overskydende tryk over det nominelle maksimum. Forhindrer sømspændinger og potentiel rørbrist som følge af solopvarmning.
      icon: tabler:gauge
    - title: Trykændring fra morgen til middag
      description: Et rør oppustet til 3,5 PSI ved 20 °C kan nå 4,5+ PSI ved soleksponering på 40 °C. Oppust altid til den nedre del af det anbefalede område i varme klimaer, og lad overtryksventilen håndtere overskydende tryk.
      icon: tabler:sun
    - title: Anbefalede driftstryk
      description: 'PVC-rør: 3,0-3,5 PSI drift, 4,5 PSI maks. Hypalon-rør: 3,5-4,0 PSI drift, 5,0 PSI maks. Test altid ved 1,25x nominelt (4,4 PSI for PVC, 5,0 PSI for Hypalon) i henhold til Aquafarers QC-standarder.'
      icon: tabler:chart-bar
    - title: Bedste praksis ved soleksponering
      description: Opbevar RIB-både i skyggefulde områder, når de ikke er i brug. Anvend UV-beskyttende båtrafter ved længere fortøjning. Kontrollér og justér rørtrykket før og efter solens spidsbelastningstimer. Overskrid aldrig det maksimale nominelle tryk.
      icon: tabler:umbrella
    - title: Nødtrykudluftning
      description: Hvis røret føles for hårdt, eller overtryksventilen udlufter, skal du udlufte luft via Halkey-Roberts- eller militærventilen, indtil trykket er tilbage i driftsområdet. Medbring altid et trykmåler til nøjagtige aflæsninger.
      icon: tabler:alert-circle
