testimonials:
  - category: klubber
    name: Ricardo Santos
    title: Ejer, Algarve Surf Academy
    location: Lagos, Portugal
    content: Vi startede med Club Starter Package til vores surfskole. 20 brædder, pagajer, veste - alt ankom inden for 3 uger. Efter to sæsoner opgraderede vi til Pro-pakken. Den tilpassede branding med vores logo var en game-changer for vores professionelle image.
    rating: 5
    product: Klub startpakke
    source: solutions/clubs
  - category: klubber
    name: Klubejer
    title: Vandsportsklub
    location: Phuket, Thailand
    content: Klubstartpakken var det perfekte indgangspunkt. Efterhånden som vores forretning voksede, voksede Aquafarer med os – samme kvalitet, samme prissætning, ingen overraskelser. Vi skalerede fra 10 til 80 tavler på 18 måneder.
    rating: 5
    product: Club Starter + Premium Pakke
    source: success-stories
  - category: feriesteder
    name: Resortets administrerende direktør
    title: 5-stjernet strandresort
    location: Grækenland
    content: Aquafarer leverede ikke kun boards – de hjalp os med at opbygge en komplet gæsteoplevelse. Vores vandsportsprogram gik fra nul til resort-højdepunkt på én sæson. 300+ ugentlige bookinger og $180K i årlig omsætning.
    rating: 5
    product: Resort Premium-pakke
    source: success-stories
  - category: feriesteder
    name: Sophie Laurent
    title: Direktør for Guest Experience, Azure Bay Resorts
    location: Phuket, Thailand
    content: Aquafarer designede og udstyrede hele vores strandaktivitetsprogram på tværs af tre resortejendomme. 80 SUP'er, 40 kajakker, sikkerhedsinfrastruktur og personaletræning - alt sammen leveret i én forsendelse. Gæstedeltagelsen steg med 60 % i den første sæson.
    rating: 5
    product: Resort Premium-pakke
    source: solutions/resorts
  - category: iværksættere
    name: Michael Park
    title: Grundlægger, Shoreline Paddle Co.
    location: Californien, USA
    content: Jeg lancerede mit SUP-mærke uden brancheerfaring. Aquafarers team guidede mig fra produktvalg til tilpasset logodesign og indpakning. Min første container ankom om 11 uger, og jeg blev udsolgt på 3 måneder på Amazon.
    rating: 5
    product: Starter Brand Lancering
    source: solutions/entrepreneurs
  - category: iværksættere
    name: Grundlægger
    title: australsk SUP-mærke
    location: Australien
    content: Jeg havde mærkeideen, men ingen produktionskendskab. Aquafarer holdt bogstaveligt talt min hånd gennem hele processen - fra at vælge det rigtige borddesign til at udpakke min første forsendelse. 90 dage fra drøm til levering.
    rating: 5
    product: Brand lanceringspakke
    source: success-stories
  - category: leje
    name: Daniel Okonkwo
    title: Ejer, Lakeland SUP Rentals
    location: Ontario, Canada
    content: Jeg lejede 5 brædder fra en lokal butik og mistede 60 % af min omsætning til dem. Aquafarer hjalp mig med at bygge min egen flåde på 15 SUP'er. ROI-beregneren viste break-even på 4 måneder - det tog 3. Nu udvider jeg til 30 boards.
    rating: 5
    product: Flådestartsæt
    source: solutions/rental-business
  - category: leje
    name: Marco Valenti
    title: Driftsdirektør, Adriatic Adventure Tours
    location: Dubrovnik, Kroatien
    content: Vi udstyrede hele vores udlejningsflåde med Aquafarer RIB'er - 12 både fordelt på tre lokationer. To sæsoner efter, nul fiaskoer. CE-certificeringsdokumentationen gjorde forsikringsgodkendelsen problemfri. Deres ingeniørteam tilpassede endda rørfarverne.
    rating: 5
    product: Flådeudvidelsessæt
    source: trust
  - category: leje
    name: Kommandørløjtnant Andres Reyes
    title: Søfartsindkøbsansvarlig, filippinsk kystvagt medhjælper
    location: Manila, Filippinerne
    content: Vi driver 24 Aquafarer RIB'er på tværs af vores kystpatruljeflåde. Deres QC-proces er konsistent på tværs af hver batch - samme sømkvalitet, samme ventilplacering, samme trykklassificering hver gang. Den repeterbarhed betyder noget, når liv afhænger af udstyret.
    rating: 5
    product: RIB Patruljeflåde
    source: trust
  - category: forbrugere
    name: Sarah K.
    title: Førstegangs SUP-ejer
    location: Lake Tahoe, USA
    content: Stabil selv for en helt nybegynder. Tog den ud på søen min første dag og faldt aldrig. Den komplette pakke med pumpe og pagaj betød, at jeg var på vandet 20 minutter efter at have åbnet kassen.
    rating: 5
    product: SUP Explorer 11
  - category: forbrugere
    name: James Thornton
    title: Ejer af SUP Explorer 11
    location: Vancouver, Canada
    content: Som førstegangskøber var jeg nervøs for kvalitetsbestilling fra udlandet. ISO-dokumentationen og tredjeparts testrapporter, de delte, før jeg overhovedet spurgte, gav mig fuld tillid. Bestyrelsen ankom på 6 dage og oversteg mine forventninger.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: forbrugere
    name: Mike R.
    title: Fritidskajakroer
    location: Florida, USA
    content: Solid byggekvalitet. Håndterer kystchop langt bedre, end jeg forventede af en gummibåd. Pakkede den i min bils bagagerum til en weekendtur - oppustet ved rampen på under 4 minutter.
    rating: 5
    product: Oppustelig kajak
