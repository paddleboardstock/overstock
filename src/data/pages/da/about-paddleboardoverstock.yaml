values:
  - title: Kvalitet først
    desc: Hver båd, der forlader vores fabrik, gennemgår obligatorisk lufttilbageholdelse, sømafskalning og systemtest inden forsendelse.
  - title: Vertikal integration
    desc: Vi kontrollerer hvert trin - fra PVC skæring til slutmontering - eliminerer entreprenørens ineffektivitet og sikrer ensartet kvalitet.
  - title: Sikkerhed som standard
    desc: CE-certificering er kernen i det, vi bygger. Vores 64 CE-certificerede modeller opfylder EU's sikkerhedsstandarder til rekreativ og kommerciel brug.
  - title: Partner-centreret
    desc: Vi opbygger langsigtede relationer med OEM, ODM og private label-partnere gennem gennemsigtighed, pålidelighed og fælles vækst.
services:
  - title: OEM-fremstilling
    desc: Vi bygger efter dine specifikationer. Del dine tegninger, og vores ingeniørteam håndterer prototyping, værktøj og produktion.
  - title: ODM Løsninger
    desc: Start med vores gennemprøvede platformdesign. Tilpas størrelse, farve, grafik og emballage for at skabe din unikke produktlinje.
  - title: Private Label
    desc: Dit varemærke, dit logo, din emballage. Produkterne kommer klar til detailhandlen med fuld brandintegration.
  - title: Brugerdefineret branding
    desc: Dækpudeprint, skroggrafik, tube-decals og brugerdefinerede etiketter - konsekvent mærketilstedeværelse på alle overflader.
certifications:
  - name: CE Certificering
    desc: Vores både og fartøjer overholder EU-direktivet om fritidsfartøjer (2013/53/EU) og relevante harmoniserede standarder.
    scope: Både og fartøjer
  - name: null
    desc: Kvalitetsstyringssystem certificeret til design, fremstilling og distribution af oppustelige vandfartøjer.
    scope: Hele anlægget
  - name: null
    desc: Gummibåde — sikkerheds- og ydeevnekrav til gummibåde med forstærkning og stift skrog.
    scope: RIB & oppustelige liner
