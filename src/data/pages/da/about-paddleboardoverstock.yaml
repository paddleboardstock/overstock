hero:
  tagline: Om
  title: Om {SITE}
  subtitle: En vertikalt integreret vandsportsproducent — fra råmateriale til færdig båd
intro:
  - "Paddle Board Overstock blev grundlagt i 2012 med en enkelt mission: designe og fremstille vandsportsudstyr, der klarer sig lige så godt på vandet, som det gør i kvalitetsrapporten. Hvad der begyndte som et fokuseret SUP-brætværksted er vokset til en 12.000 kvadratmeter integreret produktionsfacilitet i Qingdao Economic Development Zone, der producerer oppustelige både, RIB'er, kajakker, SUP-brætter, sikkerhedsudstyr og tilbehør til kunder i 50+ lande."
  - I dag fungerer Paddle Board Overstock som et fabriksmærke - vi designer, konstruerer, prototyper, fremstiller og tester alt under ét tag. Denne vertikale integration giver os direkte kontrol over materialevalg, byggekvalitet og leveringstidslinjer. Hver båd er bygget af vores folk, på vores udstyr, til vores standarder.
  - Vi betjener rekreative brugere, kommercielle operatører, offentlige myndigheder og brandpartnere over hele verden. Vores OEM- og ODM-programmer hjælper virksomheder med at lancere deres egne produktlinjer uden at investere i fabriksinfrastruktur. Uanset om du har brug for en enkelt prototype eller et komplet produktionsforløb, guider vores team dig fra idé til havklar levering.
