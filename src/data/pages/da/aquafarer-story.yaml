timeline:
  - year: '2012'
    title: Grundlaget for maritim produktion
    body: Aquafarer begyndte som et specialiseret værksted for oppustelige fartøjer i Qingdao, Kina, forpligtet til marine håndværk og fremstilling af gummibåde. Det tidlige fokus var at bygge pålidelige oppustelige produkter gennem praktisk ingeniørerfaring og fremstillingsdisciplin.
  - year: '2015'
    title: Første eksport & CE-certificering
    body: De første eksportordrer nåede Japan og Korea. CE-certificering blev opnået for kerneproduktlinjer, hvilket markerer Aquafarers indtræden på internationale markeder. Virksomheden begyndte at betjene kommercielle og rekreative brugere uden for Kina.
  - year: '2018'
    title: Fabriksudvidelse
    body: Flyttet til et 12.000 m² produktionsanlæg. Tilføjet RF-svejselinjer og drop-stitch produktionskapacitet, hvilket muliggør større produktion og forbedrede kvalitetskontrolsystemer.
  - year: '2020'
    title: R&D Center etableret
    body: Åbnede et dedikeret R&D-center med PVC stoflaboratorium, hydrodynamisk testtank og CAD/FEA-simuleringsstudie. Produktudvikling udvidet til at fokusere på letvægtskonstruktion, forbedret holdbarhed og brugercentreret design.
  - year: '2022'
    title: Certificering og global vækst
    body: Opnåede ISO 9001 certificering. Udvidet til 14 R&D-ingeniører og 200+ medarbejdere. Produkter nåede kunder i hele Europa, Amerika og Asien-Stillehavsområdet gennem distributør- og OEM-partnerskaber.
  - year: '2024'
    title: Innovations- og designstudio
    body: Lanceret full-service design- og innovationsstudie til skræddersyede ODM-projekter, fra koncept til produktion. Styrkede professionelle marineapplikationer, herunder rednings-, kommercielle og offentlige udbud.
  - year: '2026'
    title: Opbygning af fremtiden for vandudforskning
    body: I dag fortsætter Aquafarer med at udvikle gummibåde, SUP-systemer og skræddersyede marineløsninger – der forbinder mennesker og organisationer med verdens farvande. 50+ lande betjenes, 15.000 enheder årlig kapacitet.
content_founding:
  tagline: Begyndelsen
  title: Født på havnefronten
  subtitle: 'Aquafarer startede i et kystværksted i Qingdao med én båd og en vision: at bygge oppustelige vandfartøjer, der kunne klare virkelige havforhold.'
  paragraphs:
    - I 2012 så vores grundlæggere et hul i markedet - de fleste gummibåde var enten overkommelige, men upålidelige, eller høj kvalitet, men uoverkommeligt dyre. De mente, at der var plads til en producent, der leverede både kvalitet og værdi.
    - Det første skrog blev bygget i hånden, testet i lokale farvande og forfinet baseret på reel feedback fra fiskere og små kommercielle operatører. Denne feedback-loop – byg, test, lyt, forbedre – er fortsat kernen i vores ingeniørfilosofi i dag.
    - I 2015 havde ordet spredt sig ud over Qingdao. Internationale distributører begyndte at anmode om prøver. Det, der startede som et lokalt værksted, var at blive en global leverandør.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarers tidlige produktionsværksted og fremstilling
content_growth:
  tagline: Vækst og innovation
  title: Fra værksted til 12.000 m² anlæg
  subtitle: Kontinuerlig investering i mennesker, udstyr og processer har forvandlet Aquafarer til en moderne marineproduktionsfacilitet.
  paragraphs:
    - Efterhånden som efterspørgslen voksede, voksede vores anlæg også. Vi udvidede fra et lille værksted til en 12.000 m² stor fabrik med dedikerede produktionslinjer til RIB både, oppustelige både, SUP boards og tilbehør.
    - Vi investerede i CNC-skæremaskiner, højfrekvent svejseudstyr, drop stitch produktionslinjer og omfattende testrigge - hvilket giver os mulighed for at kontrollere alle aspekter af produktionskvalitet.
    - I dag omfatter vores team på 200-300 marineingeniører, materialeforskere, kvalitetskontrolspecialister og dygtige håndværkere - hvoraf mange har været med Aquafarer siden de tidlige dage.
founder:
  tagline: Mød grundlæggeren
  title: Bygget af en vandmand
  subtitle: Grundlæggeren David Chen samler produktionsekspertise og en livslang passion for vandsport - en kombination, der definerer, hvordan Aquafarer griber produktudvikling an.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — grundlægger af Aquafarer
  story:
    - David Chen voksede op ved kysten af ​​Qingdao, hvor havet ikke var et feriemål, men en livsstil. Han tilbragte sin ungdom med at sejle i kajak, sejle og fiske i Det Gule Hav - oplevelser, der gav ham en intuitiv forståelse af, hvad vandfartøjer skal udholde.
    - Før han grundlagde Aquafarer, tilbragte David et årti i marineproduktion, hvor han arbejdede på tværs af produktion, kvalitet og international handel. Han styrede OEM-programmer for europæiske og nordamerikanske mærker, og lærte standarderne og forventningerne på globale markeder på første hånd.
    - 'I 2012 grundlagde han Aquafarer med en simpel mission: bygge oppustelige vandfartøjer, som han ville stole på med sin egen familie på vandet. Den personlige standard – ville jeg bruge denne? — forbliver den endelige test for hvert produkt, der forlader fabrikken.'
    - I dag leder David produktstrategien og fører tilsyn med R&D-teamet, idet han personligt gennemgår nye designs og tester prototyper på vandet ud for Qingdao. Han mener, at gode produkter kommer af at forstå både teknikken og oplevelsen.
philosophy:
  tagline: Brand Filosofi
  title: Ingeniørfrihed på vand
  body: Frihed på vand handler ikke kun om bevægelse. Det repræsenterer at opdage nye steder, skabe udendørs oplevelser, forbinde mennesker med naturen og muliggøre professionelle missioner. Engineering gør denne frihed mulig.
  pillars:
    - title: Pålidelighed først
      body: Vandmiljøer kræver tillid. Aquafarer produkter er designet omkring stabilitet, holdbarhed, sikkerhed og ensartet ydeevne.
    - title: Menneske-centreret design
      body: Produkter skal tjene mennesker, ikke teknologi. Hver designbeslutning begynder med at forstå, hvordan folk bruger vandfartøjer, hvor de udforsker, og hvilke udfordringer de står over for.
    - title: Tilgængelig udforskning
      body: Vand bør ikke kun tilhøre eksperter. Aquafarer skaber udstyr, der giver flere mennesker mulighed for sikkert at opleve floder, søer, oceaner og kystmiljøer.
    - title: Kontinuerlig innovation
      body: Innovation er ikke kun at skabe nye produkter. Det forbedrer hver eneste detalje - materialer, strukturer, fremstilling og brugeroplevelse.
engineeringDna:
  tagline: Ingeniør-DNA
  title: Hvordan Aquafarer opretter produkter
  areas:
    - title: Materialevidenskab
      body: Aquafarer fokuserer på at vælge passende materialer til forskellige havmiljøer. Nøgleovervejelser omfatter slidstyrke, UV-bestandighed, trykstabilitet og langtidsholdbarhed.
      items:
        - Slidstyrke
        - UV-modstand
        - Trykstabilitet
        - Langtidsholdbarhed
    - title: Konstruktionsteknik
      body: Oppustelige vandfartøjer kræver præcis balance mellem stivhed, vægt, bærbarhed og stabilitet. Aquafarer engineering fokuserer på at optimere disse faktorer gennem drop-stitch kerneteknologi og avanceret sømkonstruktion.
      items:
        - Stivhed
        - Vægtoptimering
        - Bærbarhed
        - Stabilitet
    - title: Fremstillingspræcision
      body: 'Hvert produkt gennemgår kontrollerede processer: materialeforberedelse, præcisionsskæring, svejsning og limning, samling, kvalitetsinspektion og ydeevneverifikation.'
      items:
        - Materialeforberedelse
        - Præcisionsskæring
        - Svejsning & limning
        - Montering & QC
    - title: Bruger Scenario Engineering
      body: Produkterne er udviklet omkring reelle applikationer - rekreation, eventyr og professionel brug - hvilket sikrer, at hvert design opfylder de specifikke krav i dets tilsigtede miljø.
      items:
        - Fritid
        - Eventyr
        - Professionel
        - Kommerciel
