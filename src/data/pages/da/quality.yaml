tests:
  - title: Trykprøvning
    standard: ISO 6185-1 | Intern spec AF-PT-001
    description: Oppustelige kamre sættes under tryk til 1,25x den anbefalede driftsgrænse og holdes i 30 minutter. Trykfald måles for at validere lufttæthed og strukturel integritet af materialer og sømme.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Effekttestning
    standard: Intern Spec AF-IT-002
    description: Produkter udsættes for kontrollerede stød fra standardiserede faldvægte og pendulapparater. Dette vurderer punkteringsmodstand, riveudbredelse og strukturel modstandsdygtighed mod kollisioner med forhindringer, dokker og affald.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV-modstandstest
    standard: ASTM G154 | ISO 4892-3
    description: Materialeprøver udsættes for UVA-340-lamper i accelererede forvitringskamre i mere end 1.000 timer. Vi måler farveændring (Delta E), glansfastholdelse og tab af trækstyrke for at validere UV-stabilisatorpakker.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Test af slidstyrke
    standard: ASTM D751 (Taber) | ISO 5470-1
    description: Materialeprøver udsættes for CS-10 slibeskiver under 500g/1.000g belastninger i 1.000 cyklusser. Massetab og visuel slitageklassificering bestemmer belægningens holdbarhed mod sand, grus og gentagen udsætning.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Lav-temperatur præstationstest
    standard: Intern Spec AF-LT-003 | MIL-STD-810G
    description: Samlede produkter og materialekuponer konditioneres ved -20°C, -10°C og 0°C i 24 timer og flextestes derefter. Vi verificerer, at PVC og Hypalon forbliver fleksible uden at revne eller delaminere.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Prøvning af opdrift og belastningskapacitet
    standard: ISO 6185-1 | ISO 12402
    description: Produkter indlæses trinvist til 1,25x nominel kapacitet i en kontrolleret pool. Fribord, stabilitet og selvdrænende ydeevne registreres. Hver models nominelle kapacitet er matematisk og empirisk verificeret.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Manøvredygtighedstest
    standard: Intern spec AF-MT-004
    description: Forsøg på vandet måler venderadius, acceleration, planetid og padle-/motorrespons på tværs af en række belastningsforhold. Håndteringsegenskaber fra den virkelige verden valideres i forhold til designmål.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Vandtæthedstestning
    standard: ISO 6185-1 §7.3 | Intern Spec AF-WT-005
    description: Hvert samlet produkt er spraytestet ved 0,5 bar på alle sømme, ventiler og fittings. En 5-minutters nedsænkningstest under tryk validerer kammer- og ventilens vandtæthed. Nullækagestandard før forsendelse.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
