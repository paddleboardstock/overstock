hero:
  tagline: Vores team
  title: 'Menneskene bag Aquafarer<br />— ingeniørkunst for frihed på vandet'
  subtitle: 'Grundlagt i 2012 i Qingdao i Kina blev Aquafarer bygget op af maritime ingeniører, materialevidenskabsfolk og vandsportsentusiaster, der troede på at gøre professionelle oppustelige vandsportsfartøjer tilgængelige i hele verden.'
  image:
    src: /images/team-all.webp
    alt: Gruppebillede af hele Aquafarer-teamet — ingeniørarbejde, produktion og ledelse
founding:
  tagline: Vores grundlæggelse
  title: 'Fra et værksted på kysten<br />til et anlæg på 12,000 m²'
  subtitle: 'Aquafarer blev grundlagt af et team af maritime ingeniører med årtiers samlet erfaring inden for design af oppustelige både, PVC/Hypalon-fabrikation og global fremstilling af marineudstyr.'
  items:
    - title: "Grundlagt: 2012"
      description: 'Etableret i Qingdao i Kina — et vigtigt maritimt knudepunkt med dyb skibsbygningstradition.'
      icon: tabler:calendar
    - title: 200-300 medarbejdere
      description: 'Herunder 50+ FoU-ingeniører, kvalitetsspecialister og produktionsteknikere.'
      icon: tabler:users
    - title: Anlæg på 12,000 m²
      description: 'Dedikeret fabrik med 6 produktionslinjer til RIB-både, oppustelige både og SUP-boards.'
      icon: tabler:building-factory
    - title: 'Mere end 50 lande'
      description: 'Eksport til Europa, Amerika, Mellemøsten, Asien-Stillehavsregionen og Afrika.'
      icon: tabler:globe
