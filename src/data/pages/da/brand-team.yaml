philosophy:
  tagline: Designfilosofi
  title: 'Ingeniørdrevet design<br />— hver detalje tæller'
  subtitle: 'Vores ingeniørfilosofi hviler på tre principper, der styrer hvert produkt, vi bygger.'
  list:
    - 'Pålidelighed først: Hvert Aquafarer-produkt testes til at modstå virkelige forhold — fra redningsoperationer i koldt vand til udlejning på tropiske resorts. Vi bygger med ekstra margin, hvor det betyder mest.'
    - 'Produktionspræcision: Vores anlæg bruger CNC-skæring, højfrekvenssvejsning og automatiserede trykprøver. Hver søm, hver ventil, hver fitting opfylder dokumenterede specifikationer.'
    - 'Løbende innovation: Vores FoU-team evaluerer løbende nye materialer, produktionsmetoder og designforbedringer. Vi venter ikke på problemer — vi foregriber dem.'
cta:
  title: 'Vil du drøfte et projekt med vores team?'
  subtitle: 'Vores ingeniører står klar til at give råd om produktvalg, tilpasning og OEM/ODM-partnerskaber.'
  actions:
    - variant: primary
      text: Kontakt vores team
      href: /contact
    - text: Se vores produkter
      href: /products
