stories:
  tagline: 'Opdagelseshistorier'
  title: 'Virkelige eventyr fra virkelige mennesker'
  subtitle: 'Hør fra padlere, familier og professionelle, der bruger Aquafarer-udstyr på vandet.'
  items:
    - name: 'Sarah & Mike'
      title: 'SUP Explorer 11-ejere, Canada'
      content: "Vi tog vores Explorer 11'er med på en uges tur gennem Algonquin Park. De håndterede portager og søovergange smukt. Drop-stitch-konstruktionen betød, at vi kunne pumpe op til 15 PSI og få hardboard-ydeevne fra et pakkeligt bræt."
      image: 'https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp'
      location: 'Algonquin Park, Canada'
    - name: 'Carlos R.'
      title: 'Cheetah Surge-rytter, Spanien'
      content: 'Cheetah Surge er min go-to til kystcruising. Det livlige design vender hoveder på stranden, og stabiliteten giver mig selvtillid i let sø. Den håndterer smukt, uanset om jeg er på tur eller bare nyder solnedgangen.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp'
      location: 'Costa Brava, Spanien'
    - name: 'Lina & familie'
      title: 'Flowing Lotus-padlere, Sverige'
      content: 'Weekend-familieeventyr på skærgården. Flowing Lotus er stabil nok til, at min datter kan stå på den, mens jeg padler. Pumpes op på under 10 minutter — ingen trailer nødvendig, bare ren familiehygge på vandet.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-flowing-lotus-1.webp'
      location: 'Stockholms Skærgård, Sverige'
    - name: 'Lt. Cmdr. Andres'
      title: 'Ocean Voyager-udforsker, Filippinerne'
      content: 'Jeg bruger min Ocean Voyager til langdistance kystture omkring Palawan. Efter måneder med daglig brug i tropiske forhold, fungerer brættet stadig som nyt. Turingsformen skærer gennem sø, der ville stoppe mindre brædder.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp'
      location: 'Palawan, Filippinerne'
    - name: 'Emma T.'
      title: 'Tropical Breeze-førstegangsbruger, Australien'
      content: 'Jeg havde aldrig været på en SUP før. Tropical Breeze er så stabil, at jeg følte mig sikker på mit første forsøg. Nu padler jeg hver weekend. Læringskurven er stort set nul — og brættet ser fantastisk ud på vandet.'
      image: 'https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-tropical-breeze-1.webp'
      location: 'Gold Coast, Australien'

