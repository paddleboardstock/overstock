hero:
  tagline: Vandsportsskoler og træningscentre
  title: Udstyrsløsninger<br />Til SUP- og kajakskoler
  subtitle: Pålideligt udstyr i kommerciel kvalitet til padleskoler, surfinstruktion, kajaktræning og vandsportsuddannelser i enhver skala.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP boards til skoler og træningscentre
direct_answer: Paddle Board Overstock forsyner SUP- og kajakskoler verden over med tavler af kommerciel kvalitet, sikkerhedsudstyr og instruktørpakker. Vores udstyr er bygget til daglig instruktionsbrug - tykkere PVC, forstærkede drop-stitch-kerner og stabile skrogdesign, der giver begyndere selvtillid og instruktører pålidelighed. Pakker inkluderer tilpasset branding, reservedelsprogrammer og træningsressourcer.
solution_offerings:
  - title: Skolestartpakke
    subtitle: Til nye programmer og små træningscentre
    badge: Popular
    features:
      - title: Elevbrædder
        description: 10–25 all-around SUP-brætter eller rekreative kajakker med stabile platforme til begynderundervisning
      - title: Instruktørbrædder
        description: Bredere, længere boards med ekstra stabilitet og skridsikre EVA-dæk til coaching
      - title: Sikkerhedsudstyr
        description: Redningsveste, snore, fløjter og kastetasker i matchende farver
      - title: Opbevaring & Transport
        description: Stabelbare brætstativer, polstrede kajakvugger og transportdukke
      - title: Læreplanstøtte
        description: Lektionsskabeloner, sikkerhedstjeklister og færdighedsvejledninger
    cta_text: Kom i gang med skolepakken
    cta_href: /contact
  - title: Skole Premium-pakke
    subtitle: For etablerede skoler og multi-program operatører
    badge: Best Value
    features:
      - title: Fuld flåde
        description: 25–50 brædder eller kajakker med blandet flåde (allround, touring, ungdomsstørrelser)
      - title: Instruktørflåde
        description: 3–5 specialiserede instruktørtavler med indbyggede lydsystembeslag
      - title: Sikkerhedsstation
        description: Centraliseret sikkerhedsudstyrsstation med PFD'er, radioer, førstehjælp og skiltning
      - title: Brandingpakke
        description: Fuld logotryk på brædder, padler, PFD'er og uniformer
      - title: Vedligeholdelsesprogram
        description: Kvartalsvis vedligeholdelsessæt, reservedelsbundter og reparationstræning
    cta_text: Saml Premium-pakken
    cta_href: /contact
  - title: Skolefranchisepakke
    subtitle: Til kæder med flere lokationer og franchiseoperatører
    badge: Enterprise
    features:
      - title: Flådestandardisering
        description: Identisk udstyr på tværs af alle lokationer for ensartet elevoplevelse
      - title: Central bestilling
        description: Konsolideret bestilling, bulkpriser og centraliseret reservedelsstyring
      - title: Instruktøruddannelse
        description: Udstyrshåndtering og vedligeholdelsescertificering for alle instruktører
      - title: Sammærkning
        description: Fælles branding med franchise + Paddle Board Overstock co-branding muligheder
      - title: Udvidelsesstøtte
        description: Skaleringsrådgivning, udstyrsprognoser og ny placeringsopsætning
    cta_text: Diskutér franchiseplanen
    cta_href: /contact
benefits:
  - title: Bygget til daglig undervisning
    description: Tykkere PVC og forstærkede skinner modstår daglig elevbrug, fald på sand og stenede landinger.
    icon: tabler:shield
  - title: Stabile læringsplatforme
    description: Bredere skrog og fladere rockere giver begyndere selvtillid. Instruktører fokuserer på undervisning, ikke udstyr.
    icon: tabler:scale
  - title: Nem opbevaring og transport
    description: Oppustelige designbutikker i små rum. Tømte brædder passer i standardkøretøjets bagagerum til mobil undervisning.
    icon: tabler:box-seam
  - title: Brugerdefineret branding
    description: Skolelogoer og farver på hver tavle. Dit brand, din identitet - ikke generisk lejeudstyr.
    icon: tabler:brush
content_segments:
  tagline: Skolens profiler
  title: Vandsportsuddannelsesløsninger<br />Efter programtype
  subtitle: Padleskoler, surfakademier, universitetsprogrammer og franchiseoperatører står hver over for forskellige operationelle udfordringer - fra integrering af læseplaner til standardisering af flåde på flere steder. Vi konfigurerer udstyrspakker til at matche uddannelsesmodellen.
  items:
    - title: Uafhængige SUP & Kajakskoler
      subtitle: Ejerdrevne træningscentre
      description: Små til mellemstore skoler drevet af ejer-instruktører, der tilbyder SUP-lektioner, kajaktræning og certificeringskurser. Udstyret skal være holdbart nok til daglig instruktionsbrug, overkommeligt for et lille firmas budget og alsidigt nok til at betjene begyndere til mellemliggende studerende i en enkelt flåde.
      features:
        - Stabile allround-SUP-brædder og fritidskajakker til begynderundervisning
        - Brædder beregnet til instruktører med ekstra stabilitet til coaching fra vandet
        - Lektionsplanskabeloner og færdighedsprogressionsguider inkluderet
        - Årligt fornyelsesprogram for udstyr med indbytterabatter
    - title: Universitets- og gymnasieprogrammer
      subtitle: Storstilede fritidsflåder for studerende
      description: Universitetets rekreationsafdelinger, der driver padleklubber, udlejningsprogrammer og instruktionskurser som en del af campus rekreationstilbud. Udstyr står over for høj brug i løbet af semestre, kræver lette check-in/check-out-systemer og skal modstå varierede færdighedsniveauer fra førstegangsstuderende til avancerede padlere.
      features:
        - Slidestro PVC-konstruktion klassificeret til institutionelle brugscyklusser
        - Farvekodede flåder efter færdighedsniveau for nem administration
        - Kompatibilitet med lagersporingssystemer baseret på RFID eller klæbemærker
        - Partipriser med semesterbaserede bestillinger og betalingsbetingelser
    - title: Surfskoler og surfakademier
      subtitle: Coastal surf instruktionsprogrammer
      description: Surfskoler, der underviser i SUP-surfing, tilbøjelige padle- og surfkajakfærdigheder i havmiljøer. Udstyret skal håndtere surfzoneforhold - slagfasthed, sand- og saltvandstolerance og nem skylning og retur mellem timetimerne.
      features:
        - Surf-specifikke former med forstærkede kanter og slagfast konstruktion
        - Bløde finnevalg og spirallinor til elevernes sikkerhed
        - Stof med hurtigskyl, der tørrer mellem lektionsskiftene
        - Program til flådeudskiftning med inspektion og fornyelse ved sæsonafslutning
    - title: Franchise & Multi-Location kæder
      subtitle: Standardiseret udstyr på tværs af lokationer
      description: Operatører på flere steder, der kører standardiserede træningsprogrammer på tværs af flere byer eller regioner. Konsistens i flåden på tværs af lokationer er altafgørende - hver elev bør have den samme udstyrsoplevelse, uanset hvilken franchise-lokation de besøger. Centraliseret bestilling, mærkevareens ensartethed og skaleringsstøtte er afgørende.
      features:
        - Identiske flådespecifikationer på alle franchiselokationer
        - Centraliserede konsoliderede bestillinger med volumenpriser
        - 'Co-branding-muligheder: franchisemærke + Paddle Board Overstock co-branding'
        - 'Opstartssæt til ny lokation: udstyr, skiltningsmateriale og åbningslager'
