content_challenge:
  tagline: Udfordringen
  title: Offshore energikrav<br />Ekstrem miljøpålidelighed
  subtitle: Offshore energioperationer presser udstyr til det yderste - ekstremt vejr, fjerntliggende steder, kontinuerlige driftscyklusser og nultolerance for fejl.
  paragraphs:
    - Offshore-energiindustrien opererer i planetens mest krævende maritime miljøer. Arbejdsbåde understøtter olie- og gasplatforme, installation af offshore-vindmøller, undersøiske kabeloperationer og maritime anlægsprojekter — ofte på åbent hav med begrænsede vejr-vinduer. Udstyrsfejl er ikke kun dyre — de er farlige.
    - '**Sikkerhed er højeste prioritet** — Crew transfer vessels skal operere sikkert i søtilstande, der ville standse enhver anden operation. Stabilitet i overførselspunktet, pålidelig motorydelse i alt vejr og robust konstruktion til gentagne fortøjninger mod offshore-konstruktioner er obligatoriske krav.'
    - '**Allvejrsevne er afgørende** — Offshore-vindparker og olieplatforme opererer hele året. Arbejdsbåde skal klare tung sø, stærk vind og begrænset sigtbarhed. Operationer døgnet rundt kræver komplet navigationsudstyr og pålidelige belysningssystemer.'
    - '**Offshore-vindenergisektoren vokser hurtigt** — Tusindvis af nye møller installeres globalt, og hver enkelt kræver regelmæssig overførsel af besætning, transport af værktøj og vedligeholdelsesstøtte. Dette skaber vedvarende efterspørgsel efter specialbyggede crew transfer vessels (CTV''er) og støttende RIB-både.'
    - Paddle Board Overstocks offshore-energi-RIB'er er designet med forstærkede deep-V-skrog, kraftigt belastbare Hypalon-tuber, komplet navigationsudstyr og sikkerhedssystemer udviklet til de ekstreme forhold ved offshore-energioperationer.
content_solution:
  tagline: Vores løsning
  title: Specialbyggede offshore RIB'er<br />Til energiindustrien
  subtitle: Hver Paddle Board Overstock offshore energi RIB er designet til sikker, pålidelig drift under ekstreme havforhold - fra Nordsøen til Sydøstasien.
  list:
    - Forstærket deep-V-skrog for ydeevne i hård sø og forudsigelige køreegenskaber
    - Kraftigt belastbare Hypalon-tuber med UV- og kemikalieresistens for forlænget offshore-indsats
    - Beslag i rustfrit stål 316 — ingen korrosion ved konstant eksponering for saltvand
    - 'Komplet navigationsudstyr: GPS, radar, VHF, natlige navigationslys — standard på offshore-modeller'
    - Selvlænsende dæk for sikker drift, når søen skyller ind over dækket
    - Flere motorkonfigurationer — enkelt- eller dobbeltpåhængsmotor for opgaveredundans
    - Slæbemast og kraftige pullerter for håndtering af platforme og bojer
    - Tubefarver med høj synlighed for identifikation på offshore-arbejdspladser
content_segments:
  tagline: Energiprofiler
  title: Offshore energiløsninger<br />Efter applikationstype
  subtitle: Forskellige offshore-energisektorer har unikke krav til arbejdsbåde - fra platformstøtte-RIB'er til vindmølleparker til undersøiske inspektionsfartøjer.
  items:
    - title: Understøttelse af offshore olie- og gasplatforme
      subtitle: Besætningsoverførsel, udstyrsforsyning, platformsikkerhed standby
      description: Olie- og gasplatforme kræver daglig besætningsskifte, udstyr og forsyningstransport og sikkerheds-standby-dækning. Arbejdsbåde skal operere sikkert omkring platformskonstruktioner, i stærk strøm og varierende havtilstande, og opretholde præcis stationshold under personaleoverførsel via stige eller landgangsbro. Det ekstreme miljø - kulbrinter, kemikalier, konstant saltspray - kræver korrosionsbestandig konstruktion og pålidelig ydeevne.
      features:
        - Konfiguration til besætningsoverførsel med sikker ombordgang og gelændere
        - Korrosionsbestandige Hypalon-tuber og beslag i rustfrit stål 316
        - Forstærkte stødlister for hyppig kontakt med platformens fendere
        - Selvlænsende dæk for olieholdigt vand og kemisk vask
        - Brændstoftank med høj kapacitet for udvidet operationel rækkevidde offshore
        - Mulighed for dobbelt motor for opgavekritisk redundans
    - title: Offshore vindmølledrift
      subtitle: Besætningsoverførsel, turbinevedligeholdelse, værktøjstransport
      description: Offshorevind er den hurtigst voksende sektor inden for havenergi. Operatører har brug for crew transfer fartøjer (CTV'er), der sikkert kan overføre teknikere til turbineadgangsplatforme i havstater op til 1,5 m signifikant bølgehøjde. Stabilitet under overførsel, kapacitet i al slags vejr og pålidelig daglig drift er afgørende. Servicefartøjer til vindmølleparker opererer efter stramme tidsplaner - enhver nedetid forsinker idriftsættelse eller vedligeholdelse af turbine, hvilket direkte påvirker energiproduktionsindtægterne.
      features:
        - Optimeret skrogform for stabil besætningsoverførsel ved møllens fod
        - Deep-V-stavn for komfortabel sejlads i kort, vinddrevet sø og offshore-dønning
        - Fuldt vejrbeskyttelse — lukket konsol eller styrehus for besætningens komfort
        - Dæksplads til værktøj, reservedele og serviceudstyr
        - Nattoperationspakke til vintervagter med begrænset dagslys
        - Stille drift af påhængsmotor for minimal støjpåvirkning af det marine miljø
    - title: Undersøisk kabel- og rørledningsstøtte
      subtitle: Inspektion, vedligeholdelse, ROV support, opmåling
      description: Undersøiske kabel- og rørledningsoperatører har brug for arbejdsbåde til ruteinspektion, vedligeholdelsesstøtte, ROV-operationer og undersøgelsesopgaver. Disse fartøjer kræver stabile platforme til indsættelse og genvinding af undervandsudstyr, præcis manøvrering ved lav hastighed til kabelsporing og pålidelig drift i kyst- og offshoremiljøer. Bådens stabilitet er afgørende for ekkolods- og undersøgelsesudstyrets nøjagtighed.
      features:
        - Stabil platform ved lav fart for kabelsporing og måleoperationer
        - Åben dækslayout til indsættelse af ROV'er, kabelspoler og måleudstyr
        - Monteringsplader til udstyr til sonar, GPS og måleinstrumentering
        - Skrogdesign med minimal kølvand for mindst mulig forstyrrelse af havbunden under inspektion
        - Præcis manøvrering ved lav fart med responsiv påhængsmotorstyring
    - title: Marineteknik og konstruktionssupport
      subtitle: Personaletransport, materialeforsyning, dykkerstøtte
      description: Marineingeniørentreprenører, der arbejder med havnebyggeri, kystbeskyttelse og offshore installationsprojekter, har brug for alsidige arbejdsbåde til personaletransport mellem byggefartøjer og land, materiale- og værktøjsforsyning, dykkerstøtte og stedundersøgelser. Disse både opererer i aktive konstruktionszoner med flere fartøjer, begrænset manøvreplads og variable havforhold. Holdbarhed og alsidighed er altafgørende.
      features:
        - Multifunktionelt dækslayout til personale, materialer og dykkerudstyr
        - Dykkertrappe og udstyrsfastgørelser til dykkerstøtteoperationer
        - Kraftige pullerter og slæbemast til manøvrering på byggepladser
        - Robust Hypalon-konstruktion med modstandskraft over for byggeaffald og slid
        - Fleksible sædekonfigurationer — besætningsmodus eller lastmodus
