label: 'Garanti'
headline: 'Aquafarer producentens begrænsede garanti'
subtitle: 'Aquafarer står bag kvaliteten af hvert maritimt produkt, vi fremstiller.'
seo:
  headline: 'Aquafarer garanti for gummibåde — 5 års begrænset garanti | Aquafarer'
  description: 'Aquafarer tilbyder 5 års begrænset garanti på primært slangestof, sømme og glasfiberskrog.'
  datePublished: '2024-01-01'
  dateModified: '2026-06-01'
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
    Denne begrænsede garanti gælder for nye oppustelige marineprodukter under Aquafarer-mærket, købt direkte hos Aquafarer eller hos en autoriseret Aquafarer-forhandler eller detailhandler. Ikrafttrædelsesdatoen er den verificérbare dato for det oprindelige detailkøb.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garantidækning og -varighed</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 år</h3>
        <p class="text-sm text-gray-600 mt-1">Primært tubestofs integritet (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 år</h3>
        <p class="text-sm text-gray-600 mt-1">Fiberglasskrogets strukturelle integritet</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 år</h3>
        <p class="text-sm text-gray-600 mt-1">Oppustelige tubesømmes luftbevarende evne</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 år</h3>
        <p class="text-sm text-gray-600 mt-1">Opblæsningsventilens funktionalitet</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 år</h3>
        <p class="text-sm text-gray-600 mt-1">Fabriksmonteret tilbehør og hjælpefittings</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 år*</h3>
        <p class="text-sm text-gray-600 mt-1">Kommersielt, udleje- eller flådebrug — alle komponenter</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Kommersielt, offentligt, charter-, udleje- eller undervisningsbrug reducerer garantien til 1 år. Brug i kapløb eller konkurrence ophæver garantien helt.</p>
  </div>

  <h2>Hvad er dækket</h2>
  <h3>Primært tubestof (5 år)</h3>
  <p>Aquafarer garanterer for det primære tubestof mod porositetsforringelse, der væsentligt kompromitterer produktets evne til at opretholde operationel opblæsning. Dette gælder CSM (Hypalon)-belagt stof og alle andre tubestofmaterialer, der anvendes i fremstillingen.</p>

  <h3>Fiberglasskrogets strukturelle integritet (5 år)</h3>
  <p>For produkter med skrog af fiberglassarmeret plastic (FRP) garanteres den grundlæggende kompositstruktur mod strukturelle svigt som følge af fejl i materialer eller arbejdsudførelse.</p>

  <h3>Oppustelige tubesømmes luftbevarende evne (5 år)</h3>
  <p>Sømmene på oppustelige tuber, hvor de er forbundet under fremstillingen, garanteres mod produktionsfejl, der resulterer i væsentlig luftring gennem sømmen. Periodisk inspektion og vedligeholdelse af passende opblæsningstryk er betingelser for dækning.</p>

  <h3>Opblæsningsventilens funktionalitet (5 år)</h3>
  <p>Luftopblæsningsventiler, der oprindeligt er monteret af Aquafarer, garanteres mod produktionsfejl i materialer eller arbejdsudførelse, der forhindrer ventilen i at holde på luften som designet.</p>

  <h3>Fabriksmonteret tilbehør (1 år)</h3>
  <p>Komponenter og fittings fremstillet af Aquafarer og oprindeligt monteret på fabrikken garanteres mod fejl i materiale og arbejdsudførelse i ét år. Dette omfatter ikke tredjepartsemner, som alene er dækket af deres respektive producentgarantier.</p>

  <h2>Hvad er ikke dækket</h2>
  <ul>
    <li>Kosmetiske fejl herunder misfarvning, pletter, falming, kridtning eller enhver ændring i udseende</li>
    <li>Punkteringer, snit, revner, flækker eller anden fysisk skade</li>
    <li>Krakelering, revner, slitage, skrammer eller forringelse som følge af friktion eller kontakt</li>
    <li>Forringelse fra UV-lyseksponering, vejrpåvirkning eller atmosfæriske forhold</li>
    <li>Skader fra kontakt med brændstoffer, opløsningsmidler, syrer, alkalier eller kemikalier</li>
    <li>Skader fra uagtsomhed, forkert brug, misbrug, uheld eller normal slid</li>
    <li>Problemer med gelcoat- eller malede overflader (blastring, krakelering, misfarvning, falming)</li>
    <li>Skader fra stød, belastning, forkert understøttelse eller trailerkørsel</li>
    <li>Skader fra forkert op-/afladning eller brug af ikke-godkendte opblæsningsenheder</li>
    <li>Tredjepartsudstyr, -komponenter eller -systemer (dækket af deres respektive producenter)</li>
  </ul>

  <h2>Producentens forpligtelse og afhjælpning</h2>
  <p>Aquafarers eneste og eksklusive forpligtelse er reparation eller udskiftning — efter Aquafarers valg — af enhver komponent, der vurderes at være defekt i materialer eller arbejdsudførelse, og som er dækket af denne garanti. Reparationer eller udskiftninger udføres af Aquafarer eller dets udpegede autoriserede servicefacilitet. Komponenter, der repareres eller udskiftes, garanteres alene for den resterende del af den oprindelige garantiperiode.</p>

  <h2>Garantibetingelser</h2>
  <ul>
    <li><strong>Registrering:</strong> Produktet skal være korrekt registreret som fastsat i garantibestemmelserne.</li>
    <li><strong>Vedligeholdelse:</strong> Produktet skal vedligeholdes i overensstemmelse med Aquafarers offentliggjorte retningslinjer, herunder periodisk inspektion og vedligeholdelse af passende opblæsningstryk.</li>
    <li><strong>Samarbejde:</strong> Køberen skal samarbejde fuldt ud og hurtigt med Aquafarer i alle spørgsmål vedrørende garantisager.</li>
    <li><strong>Oprindelig køber:</strong> Denne garanti gives udelukkende til den oprindelige slutbruger og kan ikke overdrages.</li>
  </ul>

  <h2>Kommersielt brug</h2>
  <p>Hvis produktet anvendes til kommercielt, offentligt, ikke-kommercielt, charter-, udleje-, undervisnings- eller ethvert andet formål end privat rekreativt brug, reduceres garantiperioden for alle komponenter til én (1) år fra den oprindelige dato for detailkøbet. Brug i kapløb, hastigheds- eller udholdenhedskonkurrencer ophæver garantien øjeblikkeligt og uigenkaldeligt helt.</p>

  <h2>Sådan indgives en garantisag</h2>
  <p>Kontakt Aquafarer eller din autoriserede forhandler med købsbevis og en detaljeret beskrivelse af problemet. Aquafarer gennemgår sagen og giver instruktioner til inspektion og service.</p>
  <p>Ved henvendelser om garantiservice bedes du kontakte os via vor <a href="/contact" class="text-sky-600 underline">kontaktside</a> med dit ordrenummer og produktdetaljer.</p>

  <h2>Tredjepartsemner</h2>
  <p>Udstyr, komponenter eller systemer fremstillet af tredjeparter (selv hvis monteret af Aquafarer) er udelukkende dækket af enhver garanti, der tilbydes af deres respektive producent. Aquafarer fraskriver sig udtrykkeligt ethvert garantiansvar for sådanne tredjepartsemner.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
    Denne garantierklæring er en oversigt over den komplette begrænsede producentgaranti fra Aquafarer. Det fulde juridiske garantidokument styrer alle garantibetingelser. Specifikationer kan ændres uden varsel. Aquafarer er et fabriksmærke fra Aquafarer Qingdao Manufacturing Hub.
  </p>
