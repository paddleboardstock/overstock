features3_cases:
  tagline: Udvalgte sager
  title: Skræddersyede løsninger<br />Til rigtige udfordringer
  isBeforeContent: false
  columns: 3
  items:
    - title: Bali Diving Center Opgradering af daglig drift
      customer: Blue Ocean Diving Center
      country: Indonesien
      industry: Kommercielt dykkercenter
      challenge: Blue Ocean Diving Center på Bali drev en ældre dykkerbåd af glasfiber med begrænset dæksplads, vanskelig ombordstigning og høj vedligeholdelse under tropiske saltvandsforhold. Indlæsning af udstyr var overfyldt, forberedelsestiden var lang, og den ustabile platform skabte sikkerhedsproblemer for internationale turister - inklusive førstegangsdykkere og ældre rejsende. Centret kører 3-5 dykkerture dagligt, 200+ dage om året.
      solution: Paddle Board Overstock leverede en brugerdefineret 6,8 m professionel dykning RIB med udvidet dæklayout optimeret til opbevaring af dykkerudstyr, bred dykkerstige i rustfrit stål, kraftige Hypalon rør til UV- og saltvandsbestandighed, skridsikker dækoverflade og tankopbevaringsløsning. Konfigurationen blev designet omkring dykkercentrets daglige arbejdsgang - ikke baseret på et standard layout for fritidsbåde.
      product: 6,8 m professionel dykning RIB
      results: Større arbejdsområde forbedret effektiviteten af ​​udstyrsforberedelse. Dykkere oplevede sikrere og nemmere boarding. Vedligeholdelsesbehov reduceret betydeligt. Centret fik kapacitet til at håndtere flere kunder i højsæsonen med større tillid. RIB blev grundlaget for daglige dykkeroperationer.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Vores dykkerbåd er ikke kun transport. Det er grundlaget for vores daglige drift. Paddle Board Overstock RIB giver vores team mere selvtillid, når de løber flere dykkerture hver dag.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center Professional RIB Opgradering
      customer: Ocean Explorer dykkercenter
      country: Thailand
      industry: Kommercielt dykkercenter
      challenge: Ocean Explorer Diving Center i Phuket, Thailand, var nødt til at opgradere fra en traditionel dykkerbåd i glasfiber, der ikke kunne følge med kundernes stigende efterspørgsel. Begrænset dæksplads gjorde forberedelse af udstyr ineffektiv. Vanskelig boarding skabte sikkerhedsmæssige udfordringer for internationale turister. Høje vedligeholdelseskrav i tropiske saltvandsforhold øgede driftsomkostningerne. Centret driver flere daglige ture, 200+ dage om året.
      solution: Paddle Board Overstock leverede en tilpasset 6,8 m kommerciel dykning RIB med optimeret arbejdsdækslayout til opbevaring af dykkertanke, forberedelse af udstyr og dykkerbevægelse. Funktionerne omfattede bred dykkerstige med gelændere i rustfrit stål, kraftig rørkonstruktion med UV-bestandige materialer, skridsikre gulve, tankopbevaringsløsning, professionel konsol og passagersæde - alt sammen konfigureret til kommercielle dykkeroperationer.
      product: 6,8 m kommerciel dykning RIB
      results: Større dæksareal muliggjorde hurtigere organisering af udstyr og mere effektiv daglig arbejdsgang. Kundernes boardingkomfort og sikkerhed blev væsentligt forbedret. Vedligeholdelsesnedetiden faldt med konstruktion af marinekvalitet. Dykkercentret kunne betjene flere kunder i højsæsonen og udvide professionelle dykkertjenester med tillid.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: For et dykkercenter er båden ikke kun transport. Det er en vigtig del af vores daglige drift. Paddle Board Overstock RIB giver vores team selvtillid til at køre flere dykkerture hver dag med bedre sikkerhed og effektivitet.
      icon: tabler:lifebuoy
    - title: Flåde for European Diving Center
      customer: BlueMed dykkercentre
      country: Grækenland
      industry: Dykning og havturisme
      challenge: Kræver 12 dykkerkonfigurerede RIB'er til en kæde af dykkercentre på tværs af flere græske øer. Hver båd havde brug for tilpasset dykkerstige, tankopbevaring til 8 tanke og stabil platform til åbent vands dykkerindgang. Flåden skulle ankomme inden for 60 dage til starten af ​​turistsæsonen.
      solution: Produceret 12 RIB 520 dykkermodeller med integrerede tankstativer, dykkerstiger og ekstra brede Hypalon rør til boardingstabilitet. Hver båd blev mærket med kundeflådens bemaling. Alle 12 både er tryktestet og afsendt fra Qingdao inden for 55 dage.
      product: RIB 520 dyk
      results: Alle 12 både blev leveret til tiden til turistsæsonen. Flåden har været i daglig drift i mere end 18 måneder uden materialefejl. Kunden bestilte 6 ekstra enheder i år to.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB 520 Dive har været rygraden i vores daglige dykkeroperationer. Stabiliteten i hvile er fremragende, og tankopbevaringslayoutet holder dækket rent og sikkert for vores gæster.
      icon: tabler:lifebuoy
    - title: Australsk distributør OEM-program
      customer: Pacific Watersports Pty Ltd
      country: Australien
      industry: OEM/ODM Fremstilling
      challenge: Den australske distributør havde brug for et private label SUP bordsortiment til konkurrencedygtige priser for at konkurrere med kinesiske direkte-til-forbrugermærker. Påkrævet 8 unikke modeller, der dækker begyndere til avancerede, med tilpasset grafik, tilpasset emballage og levering til detailforretninger.
      solution: Udviklet 8 SUP-modeller (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) med eksklusiv australsk grafikpakke. Tilpasset detailemballage med QR-koder, der linker til opsætningsvideoer. Drop-ship logistik konfigureret fra Qingdao direkte til australske detailbutikker.
      product: Brugerdefineret SUP linje (8 modeller)
      results: Koncept til første forsendelse om 90 dage. Detailsalgsrate på 85 % i første sæson. Distributør udvidede partnerskab til at omfatte oppustelig bådlinje i år to.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock leverede en komplet SUP-linje på 90 dage - fra det første design til butiksgulvet. Kvaliteten matcher mærker, der sælger til det dobbelte af prisen.
      icon: tabler:arrows-exchange
    - title: Mellemøsten Redningsbådsforsyning
      customer: National Civil Defence Authority
      country: Forenede Arabiske Emirater
      industry: Søg og redning
      challenge: Civilforsvarsorganisationen havde brug for 20 patruljeklare RIB'er til kystsøgning og -redning, havnesikkerhed og oversvømmelsesbekæmpelse. Nødvendige selvborgende dæk, komplette navigationssuiter (GPS, radar, VHF), orange rør med høj synlighed og overholdelse af lokale maritime regler.
      solution: Leveres med 20 RIB 450 patruljemodeller med selvlåsende dæk, Garmin-navigationssuiter, LED-søgelygter, SOLAS reflekterende tape og orange Hypalon-rør med høj synlighed. Hver båd var CE-certificeret og testet efter ISO 6185 standarder. Dokumentationspakken inkluderede overensstemmelsescertifikater for lokal registrering.
      product: RIB 450 patrulje
      results: Flåde indsat på tværs af 5 kyststationer. Bådene har kørt i ekstrem varme (45°C+) uden nedbrydning af rør. Patruljerækkevidde og brændstofeffektivitet oversteg specifikationerne med 12 %.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: RIB 450-patruljen oversteg vores operationelle krav. Under ekstreme varmeforhold viser Hypalon-rørene ingen tegn på UV-nedbrydning efter 24 måneders daglig brug.
      icon: tabler:alert-triangle
    - title: Europæisk OEM Brand Partnerskab
      customer: North Sea Marine Equipment BV
      country: Holland
      industry: OEM/ODM Fremstilling
      challenge: Etableret europæisk marinebrand ønskede at ekspandere til RIB-markedet uden at investere i produktionsfaciliteter. Manglede en white-label-partner, der kunne producere 5 RIB-modeller (3,9 m til 6,2 m) med private branding, CE-certificering og eksklusive EU-distributionsrettigheder.
      solution: Etableret hvid-label fremstillingsaftale for 5 RIB modeller. Hver model er mærket med kundelogoer og farveskema. CE certificeringsdokumentation udarbejdet for hver model. Eksklusive EU-distributionsrettigheder givet med minimum ordreforpligtelser. Teknisk dokumentation og reservedelskatalog leveres til lokalt servicenetværk.
      product: Brugerdefineret RIB linje (5 modeller)
      results: Flerårig aftale underskrevet. Første produktionsserie på 50 enheder afsendt inden for 75 dage. Mærke lanceret hos METSTRADE med positiv forhandlermodtagelse.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: At arbejde med Paddle Board Overstock gav os mulighed for at komme ind på RIB-markedet uden at bygge en fabrik – de leverede en komplet nøglefærdig løsning med CE-certificering og forhandlersupportdokumentation.
      icon: tabler:building
    - title: Karibisk resortflåde
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Marine turisme og gæstfrihed
      challenge: 'Luksusresort havde brug for en komplet flåde af vandsportsudstyr til gæsteaktiviteter: 40 SUP brædder til guidede ture, 20 kajakker til laguneudforskning, 10 gummibåde til gæstetransport og fiskeudflugter, plus tilbehør. Alt udstyr krævede tilpasset resort-branding og skulle leveres inden høj turistsæson.'
      solution: "Produceret komplet vandsportspakke: 40 SUP Voyager-brætter (All-Around-model), 20 Explorer-kajakker, 10 AirDeck 360 oppustelige både, plus PFD'er, padler, pumper og reparationssæt. Alt udstyr trykt med resortlogo og tropisk farveskema. Containeriseret forsendelse med fuld beholdningsmanifest."
      product: Fuld vandsportspakke (70+ enheder)
      results: Flåden ankom 6 uger før højsæsonen. Gæstetilfredshedsscore for vandsportsaktiviteter steg 40 % år-til-år. Udstyret har holdt 3 sæsoner med kun rutinemæssig vedligeholdelse.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Den komplette pakketilgang betød, at vi modtog alt, hvad vi havde brug for i én forsendelse - boards, kajakker, både og tilbehør, alt sammen mærket og klar til gæstbrug. Vores gæster elsker udstyrskvaliteten.
      icon: tabler:beach
    - title: Queensland Commercial Diving Center RIB Opgradering
      customer: Kommercielt dykkercenter
      country: Australien
      industry: Kommerciel dykning og marineservice
      challenge: Et kommercielt dykkercenter i Queensland, der er specialiseret i inspektion af marineinfrastruktur, havnevedligeholdelse og undervandsreparationsprojekter, drev en aldrende arbejdsbåd. Efterhånden som projektefterspørgslen voksede, blev det gamle fartøj et ansvar - hyppig vedligeholdelse forårsagede planlægningsforstyrrelser, layoutet var ikke designet til moderne dykkeroperationer (begrænset plads til cylindre, værktøj og udstyr), og besætningens komfort under lange operationer var dårlig. Virksomheden havde brug for et fartøj, der kunne understøtte deres professionelle drift hver arbejdsdag.
      solution: Paddle Board Overstock udførte en detaljeret operationel analyse af kundens dykkerarbejdsgang, typisk projektvarighed, besætningsstørrelse og udstyrskrav. Baseret på denne analyse leverede Paddle Board Overstock en skræddersyet professionel RIB med et funktionelt dæklayout optimeret til udstyrsforberedelse og dykkerbevægelse, professionelle siddepladser til længere transportperioder, forbedret stabilitet for sikrere dykkerind- og udstigning og dykkerstøttefunktioner integreret i designet.
      product: Brugerdefineret professionel dykning RIB
      results: Den nye RIB blev en pålidelig daglig arbejdsplatform. Udstyrsforberedelse blev hurtigere med det optimerede layout. Besætningen rapporterede forbedret komfort og sikkerhed under lange operationer. Bådens professionelle udseende styrkede kundernes tillid, når de arbejdede med havneoperatører og marineentreprenører. Dykkercentret fik et fartøj, der matchede fagligheden i deres service.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Vi havde brug for en båd, der kunne støtte vores forretning hver dag, ikke kun et skib til transport. Paddle Board Overstock arbejdede sammen med os for at forstå vores operationelle krav og leverede en RIB-løsning, der passer til vores kommercielle dykkerarbejdsgang.
      icon: tabler:lifebuoy
    - title: Amerikansk kystpatruljekontrakt
      customer: Sikkerhedsmyndigheden for Atlanterhavskysten
      country: USA
      industry: Søfartssikkerhed og retshåndhævelse
      challenge: Det amerikanske kystsikkerhedsagentur krævede tunge patrulje-RIB'er til åbentvands-aflytningsoperationer. Nødvendig to-motors konfiguration til redundans, pansret konsol til beskyttelse af besætningen, militærspecifik elektronik (krypteret kommunikation, FLIR, radar) og overholdelse af US Coast Guards regler.
      solution: Konstrueret RIB 600 Patrol med dobbelt 115 HP påhængsmotorkonfiguration, pansret konsol med ballistisk beskyttelse, FLIR termisk billedbehandling, krypteret VHF/UHF-kommunikation og integrerede våbenmonteringspunkter. Skrog forstærket til højhastigheds-aflytningsmanøvrer. Al elektronik integreret og testet på fabrikken. USCG overholdelsesdokumentation leveret.
      product: RIB 600 Patrulje (to motorer)
      results: Bådene opnåede en topfart på 52 knob under acceptprøver. Agenturet rapporterede 95 % missionsparathed over de første 12 måneder. Yderligere ordre afgivet for 8 enheder.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Den to-motorede RIB 600 giver vores besætninger den hastighed og redundans, der kræves til åbent vands aflytning. Den pansrede konsol giver kritisk beskyttelse uden at gå på kompromis med ydeevnen.
      icon: tabler:shield
