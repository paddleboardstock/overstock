articles:
  sup:
    - title: SUP-grundlæggende — guide for begyndere
      desc: 'Alt, hvad en begynder skal vide: boardtyper, padlestørrelse, stilling og tips til den første dag.'
    - title: SUP-størrelsesguide
      desc: Find den rigtige længde, bredde og volumen til din vægt, dit niveau og din padlestil.
    - title: Oppusteligt eller hårdt bræt
      desc: Hvad passer til dig? Portabilitet, ydeevne, holdbarhed og omkostninger sammenlignet.
    - title: Avancerede teknikker
      desc: Forbedr din padling med avancerede padleslag, drejeteknikker og håndtering på uroligt vand.
    - title: Sådan vælger du et oppusteligt SUP
      desc: De vigtigste faktorer — konstruktion, tykkelse, finneopsætning og medfølgende tilbehør.
    - title: Vandsikkerhed
      desc: 'Vigtig sikkerhedsviden: vejrudlæsning, valg af redningsvest (PFD), selvræddning og padling i gruppe.'
  inflatable-boat:
    - title: Materialereference
      desc: PVC, Hypalon, drop-stitch, denier-værdier — forstå, hvad dit oppustelige udstyr består af.
    - title: PVC vs Hypalon sammenligning
      desc: Den endelige sammenligning af PVC- og Hypalon-stoffer til gummibåde — holdbarhed, UV-bestandighed og omkostninger.
    - title: Drop-stitch-kernen forklaret
      desc: Hvordan tusindvis af interne tråde skaber en stiv platform ved 12-15 PSI til højtydende oppustelige SUP.
    - title: Oversigt over oppustelig teknologi
      desc: Hvordan gummibåde og SUP bygges — fra materialeopbygning til ventilsystemer og sømsvejsning.
    - title: Guide til rigid inflatable boats (RIB)
      desc: Alt om RIB-konstruktion, skrogtyper, tubematerialer og valg af den rigtige RIB til dine behov.
    - title: Gummibåd vs RIB
      desc: De vigtigste forskelle mellem traditionelle gummibåde og både med stift skrog til forskellige anvendelser.
  water-safety:
    - title: Vandsikkerhedsguide
      desc: Vigtig sikkerhedsviden for enhver padler — vejr, redningsvester (PFD), selvræddning og protokoller for gruppepadling.
    - title: Redningsvest- og PFD-guide
      desc: Sådan vælger du den rigtige flydeudrustning til SUP, kajak, sejlads og professionel brug.
    - title: SUP-sikkerhedscheckliste
      desc: Sikkerhedschecklisten inden søsætning, som enhver stand-up paddleboarder bør følge.
    - title: Sikkerhed ved padling i koldt vand
      desc: Vigtige forholdsregler, udstyr og teknikker til padling i koldt vand.
    - title: Begynderfejl ved padling
      desc: Almindelige fejl, førstegangspadlere begår, og hvordan du undgår dem for en sikrere og mere behagelig oplevelse.
    - title: CE-certificering forklaret
      desc: Hvad CE-certificering betyder for oppustelige fartøjer — standarder, test og hvorfor det er vigtigt for sikkerheden.
