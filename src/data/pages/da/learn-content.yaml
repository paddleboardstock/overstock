materials:
  intro_p1: Ydeevnen, holdbarheden og sikkerheden i et oppusteligt fartøj afhænger næsten helt af materialerne, der bruges i dets fremstilling. Fra stoffet, der danner tuberne, til trådene, der giver et SUP-bræt dets stivhed — hvert materialevalg påvirker, hvordan produktet præsterer på vandet, og hvor længe det holder.
  intro_p2: 'Denne guide dækker de fire kernematerialer, der bruges i moderne oppustelige fartøjer: PVC-stof, Hypalon CSM-gummi, drop-stitch-kernekonstruktion og EVA-skumdæk. Forståelsen af disse materialer hjælper dig med at vælge det rigtige produkt til dine behov og vedligeholde det for maksimal levetid.'
  labels:
    advantages: Fordele
    limitations: Begrænsninger
    best_for: 'Bedst til:'
  items:
    - name: PVC (polyvinylklorid)
      summary: Branchestandarden for fritidsgummibåde og SUP. Flerlags lamineret stof tilbyder et fremragende forhold mellem styrke og vægt til en overkommelig pris.
      pros:
        - Overkommelig pris — 30-50 % billigere end Hypalon
        - Letvægt og nem at håndtere
        - God UV-bestandighed med de rette belægninger
        - Bred vifte af farver og finish
        - Nem at reparere med PVC-lapper og opløsningsmiddellim
      cons:
        - Kortere levetid end Hypalon (7-10 år)
        - Mindre fleksibel ved lave temperaturer
        - Lavere kemisk bestandighed
        - Kan udvikle blødgørervandring over tid
      best_for: Fritids-SUP, prisvenlige både, udlejningsflåder, sæsonbrug, ferskvand og kystmiljøer.
    - name: Hypalon (CSM-gummi)
      summary: Premium syntetisk gummi kendt for enestående holdbarhed, UV-bestandighed og lang levetid. Guldstandarden for kommercielle og militære gummibåde.
      pros:
        - Enestående UV- og ozonbestandighed
        - Levetid på 15-20 år med korrekt pleje
        - Fremragende fleksibilitet i koldt vejr
        - Overlegen bestandighed mod kemikalier og olie
        - Bevarer farven længere end PVC
      cons:
        - Betydeligt dyrere end PVC
        - Tungere stof
        - Færre farvevalg
        - Reparationer kræver specialiserede limtyper
        - Færre produktionsanlæg i verden
      best_for: Kommersielle RIB, søg og redning, militære anvendelser, tropiske klimaer, langsigtet flådeejerskab.
    - name: Drop-stitch-kerne
      summary: Teknologien, der revolutionerede oppustelige SUP. Tusindvis af polyestertråde forbinder stoffets øverste og nederste lag, hvilket muliggør oppustning ved højt tryk for ydeevne som et hårdt bræt.
      pros:
        - Ekstremt stiv ved 12-20 PSI
        - Letvægt — 18-30 lbs for et bræt i fuld størrelse
        - Folder fladt sammen til opbevaring og rejse
        - Fremragende stødmodstand
        - Konsekvent ydeevne over alle temperaturområder
      cons:
        - Kræver højtrykspumpe
        - Reparation af punkteringer er mere kompleks end enkeltlags konstruktion
        - Højere produktionsomkostninger end standard oppustelige produkter
        - Tryktab over tid kræver periodisk efterfyldning
      best_for: Stand-up paddle-brætter, kajakker, luftdæk til gummibåde — enhver anvendelse, der kræver stivhed med oppustelig portabilitet.
    - name: EVA-skumdæk
      summary: EVA-skum med lukkede celler (ethylen-vinylacetat), der bruges til gribeplader på SUP-brætter og båddæk. Giver dæmpning, greb og termisk isolering.
      pros:
        - Fremragende skridsikkert greb, vådt som tørt
        - Dæmpning reducerer træthed på lange padleture
        - Termisk isolering fra kolde dækflader
        - UV- og saltvandsbestandig
        - Fås i flerfarvede kompositioner og lasergraverede designs
      cons:
        - Kan slide ved hård brug efter 2-3 år
        - Skal bindes korrekt for at undgå delaminering
        - Ikke konstruktionsmæssig — påvirker ikke stivheden
        - Tilfører let vægt (200-400 g pr. bræt)
      best_for: SUP-dækgreb, båddækbeklædning, komfort i kajaksæde — alle overflader, der kræver skridsikker støtte.
  selection:
    title: Guide til materialevalg
    subtitle: 'Vælg det rigtige materiale ud fra din primære anvendelse:'
    headers:
      - Anvendelse
      - Anbefalet materiale
      - Hvorfor
    rows:
      - - Fritids-SUP-padling
        - Drop-stitch PVC
        - Let, stift, overkommeligt — ideel balance for fritidspadlere
      - - Familiebåd / søbåd
        - PVC (1100 denier)
        - Omkostningseffektiv, nem at reparere, tilstrækkelig holdbarhed til fritidsbrug
      - - Kommersielt RIB / patruljebåd
        - Hypalon CSM
        - Maksimal UV-bestandighed, levetid på 15-20 år, bestandighed mod kemikalier/olie
      - - Udlejningsflåde af SUP-brætter
        - Drop-stitch PVC + EVA-dæk
        - Holdbar, reparerbar, god værdi ved intensiv brug
      - - Søg- og redningsoperationer
        - Hypalon CSM
        - Pålidelighed under ekstreme forhold, fleksibilitet i kulde, kemisk bestandighed
      - - Tur-/ekspeditionskajak
        - Drop-stitch PVC
        - Stiv ydeevne med pakkbar portabilitet til rejser
  deep_dive:
    title: Dybdegående guider
    topics:
      - title: Marin PVC
        desc: Flerlags lamineret PVC-stof — UV-bestandighed, slidtests og denier-værdier forklaret.
      - title: PVC vs Hypalon sammenligning
        desc: Den endelige sammenligning af de to dominerende materialer til gummibåde — omkostninger, levetid, UV-bestandighed.
      - title: Drop-stitch-kerne
        desc: Hvordan tusindvis af interne tråde skaber stive højtrykskonstruktioner ved 12-15 PSI.
      - title: HF-svejseteknologi
        desc: Højfrekvenssvejsning skaber stærke, ensartede sømme — hvordan det virker, og hvorfor det er vigtigt.
      - title: PSI og ydeevne
        desc: Hvorfor lufttryk betyder noget for oppustelige SUP og både — stivhed, lasteevne og sejlkomfort.
      - title: Kvalitetstest
        desc: Trykprøvning, opdriftstest, UV-ældning og destruktive test — vores kvalitetsproces.
      - title: EVA-skumdæk
        desc: Dækmåtter af EVA-skum med lukkede celler — greb, komfort og holdbarhed til SUP- og båddæk.
      - title: Materialepleje
        desc: Rengøring, UV-beskyttelse, skimmelforebyggelse og god praksis ved opbevaring af oppustelige produkter.
