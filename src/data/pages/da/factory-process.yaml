hero:
  tagline: Behandle
  title: Fremstillingsproces
  subtitle: Fra råmateriale til havklar båd - hvert skridt under vores kontrol
  back_label: Tilbage til fabrikken
  back_link: /factory
intro: I modsætning til mærker, der outsourcer produktion til tredjepartsfabrikker, ejer og driver Paddle Board Overstock hele sin produktionskæde. Denne vertikale integration giver os mulighed for at opretholde streng kvalitetskontrol på alle trin, reagere hurtigt på tilpassede krav og levere ensartet produktkvalitet batch efter batch. Her er hvordan en båd bygges i vores anlæg.
steps:
  - step: '01'
    title: Materialemodtagelse & inspektion
    description: Hvert indkommende parti af PVC stof, glasfibermåtte, harpiks og hardware inspiceres i forhold til specifikationerne. Stofprøver testes for trækstyrke, tykkelsesensartethed og UV-bestandighed før frigivelse til produktion. Ikke-overensstemmende materialer sættes i karantæne og returneres.
    duration: 1-2 dage
  - step: '02'
    title: Automatisk PVC skæring
    description: Godkendte stoffer lægges på den automatiske CNC skæremaskine og skæres med sub-millimeter nøjagtighed. Computeroptimeret indlejring arrangerer paneler for at minimere spild - typisk under 5 %. Udskårne paneler mærkes efter bådmodel og kammer og bundtes derefter til overførsel til svejseværkstedet.
    duration: 2-4 timer pr. bådsæt
  - step: '03'
    title: Rør varmeforsegling og svejsning
    description: Paneler klæbes og limes ved hjælp af varmeforseglingsmaskiner med varmluftsvejsning ved kontrollerede temperaturer på 200–600 °C. Hovedsømme er forstærket med RF dielektrisk svejsning til lufttætte, højstyrke samlinger. Færdiggjorte kamre pustes op til 1,25× arbejdstryk for 30-minutters lufttilbageholdelsesvalidering.
    duration: 1-2 dage pr. båd
  - step: '04'
    title: Glasfiber RIB Skrogstøbning
    description: RIB bådskrog er produceret ved hjælp af håndoplagt glasfiberstøbning. Lag af glasfibermåtte og vævet roving er håndrullet med polyester- eller vinylesterharpiks i præcisionsforme. Hvert lag er vakuumposet for ensartet laminatkvalitet. Skroget er afsluttet med gelcoat for en højglans, UV-bestandig marineoverflade.
    duration: 2-4 dage pr. skrog
  - step: '05'
    title: SUP Tryk og dekoration
    description: SUP borddæksgrafik påføres ved hjælp af digital udskrivning til fuldfarvefotokvalitetsdesign og screenprint for holdbare logoer og gentagne mønstre. Udskrifter er hærdet og forseglet for UV- og slidstyrke.
    duration: 1-2 dage
  - step: '06'
    title: Afsluttende montering og rigning
    description: Glasfiberskrog og PVC rørsamlinger er parret på samlebåndet. Motoren er monteret, styretøj og gasregulering er tilsluttet, brændstofsystem er installeret, og den fulde elektriske sele er tilsluttet. Hver båd følger en 100-punkts samlingstjekliste med obligatorisk afmelding på hvert trin.
    duration: 2-3 dage
  - step: '07'
    title: Kvalitetstest og inspektion
    description: 'Hver færdig båd gennemgår obligatorisk kvalitetsport: kammerlufttilbageholdelsestest, systemfunktionskontrol, drejningsmomentverifikation af fastgørelseselementer og kosmetisk inspektion. Brugerdefinerede og prototypebygninger modtager også forsøg i vandet, der dækker hastighed, håndtering, stabilitet og udholdenhed.'
    duration: 1-2 dage
  - step: '08'
    title: Pakning & forsendelse
    description: Bådene tømmes for luft, foldes efter procedure, pakkes i kraftige vævede poser eller krydsfinerkasser og læsses til forsendelse. Hver pakke er mærket med model, serienummer og destination. Vi koordinerer med speditører for FCL og LCL containerforsendelser over hele verden.
    duration: 1 dag
