rd_services:
  tagline: 'Special F&U'
  title: 'F&U-tjenester for partnere'
  services:
    - title: 'Udvikling af specialmaterialer'
      desc: 'Vi udvikler skræddersyede stofformuleringer, laminatstakke og klæbesystemer tilpasset dit driftsmiljø og dine ydelsesmål.'
    - title: 'OEM / ODM produktteknik'
      desc: 'Fra konceptskitser til produktionsklare engineering-pakker — vores team kan designe, prototype og validere både under dit mærke.'
    - title: 'Tredjeparts testning & certificering'
      desc: 'Brug vores ISO-kompatible testfaciliteter til uafhængig materialetestning, produktvalidering og certificeringsstøtte.'
  cta: 'Diskuter dine F&U-behov →'
  cta_link: /contact

vision:
  tagline: 'Vores vision'
  title: 'Formning af fremtiden for vandsport'
  body: 'Paddle Board Overstock stræber efter at lede oppustelig båd- og SUP-industrien gennem kontinuerlig innovation, urokkelig kvalitet og et fast forpligtelse til sikkerhed og bæredygtighed — og beriger til sidst oplevelserne for vandsportsentusiaster verden over. Paddle Board Overstock F&U-centeret er hvor passion møder innovation og sætter nye standarder for vandsportsindustrien.'

labs_section:
  tagline: 'Laboratorier'
  title: 'Vores laboratorier'
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: 'PVC-stoflaboratorium'
      description: 'Kontinuerlig forskning og testning af PVC- og Hypalon-rørduge for trækstyrke, UV-bestandighed, slidstyrke og lavtemperaturfleksibilitet for at sikre langtidspålidelighed i marine miljøer.'
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: 'Skrogteknik-studie'
      description: 'CAD-drevet design og finit elementanalyse af HDPE-, aluminiums- og glasfiber-skrog. Hvert skrog simuleres digitalt for spændingsfordeling og stødmodstand, før den første prototype bygges.'
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: 'RF-svejsecenter'
      description: 'Dedikeret radiofrekvens-svejsefacilitet med præcis temperatur- og trykkontrol, der producerer højstyrkede, lufttætte sømme, som opfylder marine industristandarder for oppustelige fartøjer.'
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: 'Hydrodynamisk testtank'
      description: 'Skalamodeltestning i vores interne testtank til at optimere skrogform, planing-ydelse, stabilitet og brændstofeffektivitet på tværs af en række last- og søforhold.'
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: 'Prototypeværksted'
      description: 'Fuldskala prototype- og udrustningsfacilitet, hvor nye modeller bygges, monteres og søprøves. Hver prototype gennemgår et minimum 20-timers vandtestprogram før produktionsgodkendelse.'
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: 'Kvalitets- & inspektionslaboratorium'
      description: 'Dedikeret kvalitetssikringslaboratorium, der udfører træktestning, luftretentionscyklus, sømpeeltests og materialecertificering for at sikre, at hver båd, der forlader værkstedet, opfylder vores offentliggjorte specifikationer.'
      href: /randdcenter/quality-inspection-lab
