hero:
  tagline: 'F&U-center'
  title: 'F & U Center'
  subtitle: 'Fokuseret på fremskridt'

intro:
  - Paddle Board Overstocks forsknings- og udviklingscenter (F&U) er drivkraften bag vores mission om at revolutionere vandsportsudstyr. Vi styrker vandsportsentusiaster verden over med sikrere, mere komfortable og mere fornøjelige produkter gennem vedvarende innovation inden for oppustelige stand-up paddleboards (SUP'er) og både. Vores dedikerede team af ingeniører, designere og passionerede vandsporseksperter former fremtiden for industrien og løfter hele tiden barren for kvalitet, ydeevne og bæredygtighed.
  - Vores F&U-facilitet samler materialeforskere, marinearkitekter og produktionsingeniører under ét tag. Fra stofformulering og skrogsimulering til udvikling af svejseprocesser og fuldskala søprøver drives hvert trin i produktudviklingen af data og valideres gennem testning.

mission:
  tagline: 'Vores mission'
  title: 'Innovation i fremtiden for vandsport'
  pillars:
    - icon: lightning
      title: 'Teknologisk fremskridt'
      desc: 'Banebrydende nye materialer, designs og fremstilling for overlegen produktydelse og lang levetid.'
    - icon: design
      title: 'Brugercentreret design'
      desc: 'Dyb forståelse af og overgåelse af brugernes behov gennem ergonomisk og intuitiv produktdesign.'
    - icon: globe
      title: 'Bæredygtig praksis'
      desc: 'Minimering af vores miljøaftryk ved at anvende miljøvenlige materialer og processer.'
    - icon: shield
      title: 'Ukompromitterende sikkerhed'
      desc: 'Sikring af de højeste sikkerhedsstandarder gennem streng testning og certificering.'

pillars:
  - title: 'Teknologisk fremskridt'
    desc: 'Banebrydende nye materialer, designs og fremstillingsprocesser for at levere overlegen produktydelse og lang levetid.'
    icon: tech
  - title: 'Avancerede materialer'
    desc: 'Undersøgelse af banebrydende PVC, Hypalon, kompositter og bæredygtige alternativer for forbedrede produktegenskaber.'
    icon: materials
  - title: 'Bæredygtighed'
    desc: 'En kerneforpligtelse: Vi er dedikerede til miljømæssig forvaltning gennem bæredygtig fremstilling og genanvendelige materialer.'
    icon: sustainability

capabilities:
  tagline: 'Kapaciteter'
  title: 'F&U-kapaciteter'
  subtitle: 'Fire kerneområder, der giver os end-to-end kontrol over produktudvikling — fra råmaterialeforskning til endelig certificering.'
  groups:
    - title: 'Materialevidenskab & Stoftteknologi'
      items:
        - 'Analyse og optimering af PVC- og Hypalon-formulering'
        - 'UV-stabilisering, flammehæmning og udvikling af antimikrobielle tilsætningsstoffer'
        - 'Flerlags stoflaminering og vedhæftningsingeniørarbejde'
        - 'Accelereret ældningstestning (UV, termisk, fugtighed, saltsprøjt)'
    - title: 'Skrogteknik & Hydrodynamik'
      items:
        - 'Parametrisk 3D-skrogdesign og CFD-optimering'
        - 'Finit elementanalyse for strukturelle og stødbelastninger'
        - 'Skalamodel-slæbetanktestning og ydelsesvalidering'
        - 'Tilpasset skrogudvikling til specielle missionsprofiler'
    - title: 'Svejse- & Samlings-teknologi'
      items:
        - 'Udvikling og optimering af RF-dielektrisk svejsning'
        - 'Varmlufts-, varmkile- og ultralydssvejsningsmetoder'
        - 'Klæbende binding og kvalificering af sømbånd'
        - 'Modellering af svejsestyrke og levetidsforudsigelse'
    - title: 'Testning, certificering & overholdelse'
      items:
        - 'Kvalitetsstyring og CE-overholdelsestestning'
        - 'Uafhængig tredjepartstestning og certificeringsstøtte'
        - 'Udvikling af tilpasset testprotokol til indkøbskvalifikation'
        - 'Fejlanalyses og rodårsagsundersøgelse i drift'

