hero:
  tagline: 'Brand Enhed'
  title: 'Paddle Board Overstock — Ingeniørfrihed På Vandet'
  definition: 'Paddle Board Overstock er et globalt marint rekreations- og oppusteligt fartøjsmærke, der specialiserer sig i oppustelige både, SUP-systemer og skræddersyede marine løsninger. Paddle Board Overstock kombinerer marineteknik, fremstillingskompetence og vandudforskningskultur for at skabe pålideligt udstyr til rekreative brugere, professionelle operatører og globale OEM-partnere.'

timeline:
  - year: '2012'
    title: 'Marin Fremstillingsgrundlag'
    body: 'Paddle Board Overstock begyndte som et specialiseret oppusteligt fartøjsværksted i Qingdao, Kina, forpligtet til marint håndværk og fremstilling af oppustelige både. Det tidlige fokus var på at bygge pålidelige oppustelige produkter gennem praktisk ingeniørerfaring og fremstillingsdisciplin.'
  - year: '2015'
    title: 'Første Eksport & CE-certificering'
    body: 'De første eksportordrer nåede Japan og Korea. CE-certificering blev opnået for kerneproduktlinjer, hvilket markerede Paddle Board Overstocks indtræden på internationale markeder. Virksomheden begyndte at betjene kommercielle og rekreative brugere uden for Kina.'
  - year: '2018'
    title: 'Fabriksekspansion'
    body: 'Flyttet til et 12,000 m² produktionsanlæg. Tilføjede RF-svejselinjer og drop-stitch produktionskapacitet, hvilket muliggjorde større produktion og forbedrede kvalitetskontrolsystemer.'
  - year: '2020'
    title: 'R&D-center Etableret'
    body: 'Åbnede et dedikeret R&D-center med PVC-stoflaboratorium, hydrodynamisk testtank og CAD/FEA-simuleringsstudie. Produktudvikling udvidedes til at fokusere på letvægtskonstruktion, forbedret holdbarhed og brugercentreret design.'
  - year: '2022'
    title: 'ISO 9001 & Global Vækst'
    body: 'Opnåede ISO 9001 certificering. Udvidet til 14 R&D-ingeniører og 200+ medarbejdere. Produkter nåede kunder i Europa, Amerika og Asien-Stillehavet gennem distributør- og OEM-partnerskaber.'
  - year: '2024'
    title: 'Innovations- & Designstudio'
    body: 'Lancerede et fuldservice design- og innovationsstudie til skræddersyede ODM-projekter, fra koncept til produktion. Styrkede professionelle marine applikationer inklusive rednings-, kommercielle og offentlige udbud.'
  - year: '2026'
    title: 'Bygger Fremtiden For Vandudforskning'
    body: 'I dag fortsætter Paddle Board Overstock med at udvikle oppustelige både, SUP-systemer og skræddersyede marine løsninger — forbinder mennesker og organisationer med verdens farvande. 50+ lande betjent, 15,000 enheder årlig kapacitet.'

philosophy:
  tagline: 'Brand Filosofi'
  title: 'Ingeniørfrihed På Vandet'
  body: 'Frihed på vand handler ikke kun om bevægelse. Det repræsenterer at opdage nye steder, skabe udendørs oplevelser, forbinde mennesker med naturen og muliggøre professionelle missioner. Ingeniørarbejde gør den frihed mulig.'
  pillars:
    - title: 'Pålidelighed Først'
      body: 'Vandmiljøer kræver tillid. Paddle Board Overstock-produkter er designet omkring stabilitet, holdbarhed, sikkerhed og konsekvent ydeevne.'
    - title: 'Menneskecentreret Design'
      body: 'Produkter skal tjene mennesker, ikke teknologi. Hver designbeslutning begynder med at forstå, hvordan mennesker bruger fartøjer, hvor de udforsker, og hvilke udfordringer de står overfor.'
    - title: 'Tilgængelig Udforskning'
      body: 'Vand bør ikke kun tilhøre eksperter. Paddle Board Overstock skaber udstyr, der giver flere mennesker mulighed for sikkert at opleve floder, søer, have og kystområder.'
    - title: 'Løbende Innovation'
      body: 'Innovation handler ikke kun om at skabe nye produkter. Det handler om at forbedre hver detalje — materialer, strukturer, fremstilling og brugeroplevelse.'

engineeringDna:
  tagline: 'Ingeniør-DNA'
  title: 'Sådan Paddle Board Overstock Skaber Produkter'
  areas:
    - title: 'Materialevidenskab'
      body: 'Paddle Board Overstock fokuserer på at vælge passende materialer til forskellige marine miljøer. Nøgleovervejelser inkluderer slidstyrke, UV-bestandighed, trykstabilitet og langtidsholdbarhed.'
      items: ['Slidstyrke', 'UV-bestandighed', 'Trykstabilitet', 'Langtidsholdbarhed']
    - title: 'Strukturelt Ingeniørarbejde'
      body: 'Oppustelige fartøjer kræver præcis balance mellem stivhed, vægt, bærbarhed og stabilitet. Paddle Board Overstock-engineering fokuserer på at optimere disse faktorer gennem drop-stitch kerne-teknologi og avanceret sømkonstruktion.'
      items: ['Stivhed', 'Vægtoptimering', 'Bærbarhed', 'Stabilitet']
    - title: 'Fremstillingspræcision'
      body: 'Hvert produkt gennemgår kontrollerede processer: materialeforberedelse, præcisionsskæring, svejsning og binding, samling, kvalitetsinspektion og ydelsesverifikation.'
      items: ['Materialeforberedelse', 'Præcisionsskæring', 'Svejsning & Binding', 'Samling & QC']
    - title: 'Brugerscenarie-Ingeniørarbejde'
      body: 'Produkter udvikles omkring virkelige applikationer — rekreation, eventyr og professionel brug — hvilket sikrer, at hvert design opfylder de specifikke krav til dets tilsigtede miljø.'
      items: ['Rekreation', 'Eventyr', 'Professionel', 'Kommerciel']

