content_founding:
  tagline: Begyndelsen
  title: 'Født ved vandet'
  subtitle: 'Aquafarer startede i et kystværksted i Qingdao med én båd og en vision: at bygge oppustelige fartøjer, der kan håndtere ægte marine forhold.'
  paragraphs:
    - 'I 2012 så vores grundlæggere et hul på markedet — de fleste oppustelige både var enten overkommelige men upålidelige, eller af høj kvalitet men uoverkommeligt dyre. De troede, der var plads til en producent, der leverede både kvalitet og værdi.'
    - 'Det første skrog blev bygget i hånden, testet i lokale farvande og forfinet ud fra ægte feedback fra fiskere og små kommercielle operatører. Den feedbackkreds — bygge, teste, lytte, forbedre — står stadig i centrum for vores ingeniørfilosofi.'
    - 'Inden 2015 var rygtet spredt ud over Qingdao. Internationale forhandlere begyndte at efterspørge prøver. Det, der startede som et lokalt værksted, blev en global leverandør.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarers tidlige produktionsværksted og fremstilling
content_growth:
  tagline: Vækst & innovation
  title: 'Fra værksted til en facilitet på 12.000 m²'
  subtitle: 'Løbende investering i mennesker, udstyr og processer har forvandlet Aquafarer til en moderne marin produktionsfacilitet.'
  paragraphs:
    - 'Efterhånden som efterspørgslen voksede, voksede vores facilitet også. Vi udvidede fra et lille værksted til en fabrik på 12.000 m² med dedikerede produktionslinjer til RIB-både, oppustelige både, SUP-brædder og tilbehør.'
    - 'Vi investerede i CNC-skæremaskiner, højfrekvenssvejseudstyr, drop stitch-produktionslinjer og omfattende testanlæg — hvilket lader os kontrollere alle aspekter af produktionskvaliteten.'
    - 'I dag består vores team på 200-300 personer af mariningeniører, materialeforskere, kvalitetskontrolspecialister og dygtige håndværkere — mange af dem har været med i Aquafarer siden de tidlige år.'
content_mission:
  tagline: Vores mission
  title: 'Frihed På Vandet, Konstrueret Med Omsorg'
  subtitle: 'Hvert Aquafarer-produkt er designet til at hjælpe mennesker med at udforske, arbejde og trives på vandet — pålideligt, sikkert og overkommeligt.'
  list:
    - 'Konstruér fartøjer, der præsterer i ægte marine forhold — ikke kun på papiret'
    - 'Opbyg varige partnerskaber med forhandlere og brands gennem pålidelig OEM/ODM-service'
    - 'Forbedre vores produktionsprocesser løbende for at levere bedre værdi'
    - 'Støt hvert produkt med ægte reservedele og teknisk ekspertise'
cta:
  title: 'Klar til at samarbejde med en producent,<br />der bryder sig om kvalitet?'
