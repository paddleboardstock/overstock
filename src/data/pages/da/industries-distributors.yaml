    icon: tabler:building-factory
  - title: Konkurrencedygtige marginer
    description: Engrospriser med mængderabatter, rabatprogrammer og beskyttede områder.
    icon: tabler:coin
  - title: Marketingstøtte
    description: Professionelle produktaktiver, lokaliserede brochurer og co-brandede marketingkampagner.
    icon: tabler:chart-bar
  - title: Logistik partnerskab
    description: Koordineret forsendelse, toldsupport og lokale lagermuligheder for at reducere dine logistikomkostninger.
