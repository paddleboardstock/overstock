content_segments:
  tagline: Partnerprofiler
  title: Distributionspartnerskabsmodeller<br />Efter partnertype
  subtitle: Forskellige distributører bringer forskellige go-to-market styrker – regional infrastruktur, e-handelsrækkevidde, specialbutikker eller multi-brand porteføljer. Vi strukturerer partnerskabsvilkår, prisniveauer og supportniveauer for at matche hver partnerprofil.
  items:
    - title: Regionale marinedistributører
      subtitle: Område-eksklusiv B2B distribution
      description: Etablerede distributører med lagerinfrastruktur, forhandlernetværk og logistikfunktioner, der betjener marineforhandlere, vandsportsforhandlere og udlejningsoperatører inden for et afgrænset geografisk område. Du har brug for en komplet produktlinje, beskyttede priser og evnen til at servicere forhandlerkonti med lokalt lager og support.
      features:
        - Eksklusiv beskyttelse af territorium med minimale forpligtelser
        - Engrospriser på hele kataloget med kvartalsvise volumenrabatter
        - Konsignationsprogram for lokalt lager til hurtigt roterende SKU'er
        - Træning af forhandlernetværket og co-branding markedsføringsprogrammer
    - title: E-handel og online forhandlere
      subtitle: Digital-first distributionskanaler
      description: Online forhandlere, der sælger udstyr til vandsport gennem Amazon, eBay eller deres egne e-handelsplatforme. Hastighed-til-marked, konkurrencedygtige priser og direkte-til-forbruger-logistik er afgørende. Du har brug for en partner, der kan drop-shippe individuelle ordrer under dit brand med hurtig opfyldelse og nul lagerrisiko.
      features:
        - 'Dropshippingprogram: levering direkte fra fabrikken med jeres branding'
        - API-feed med lagerstatus i realtid til jeres e-handelsplatform
        - Integration med Amazon Seller Central med understøttelse af EAN/UPC
        - Returlogistik og behandling af garantikrav inkluderet
    - title: Specialforhandlere af vandsport
      subtitle: Mursten og mørtel showroom partnere
      description: Fysiske detailbutikker med speciale i vandsportsudstyr - betjener lokale padlere, lystfiskere og sejlere med personligt salg, demonstrationer og eftersalgsservice. Du har brug for detail-optimeret emballage, demonstrationsenhedsprogrammer og salgsstedsmaterialer, der konverterer walk-in-kunder.
      features:
        - 'Demoprogram: rabatterede udstillingsbrædder til showroom'
        - Detailklar emballage med æskedesign optimeret til hylden
        - POS-displays, sammenligningstabeller og køberguider
        - Træning og certificeringsprogram for butikspersonale
    - title: Distributører af flere mærker og stormagasiner
      subtitle: Bredline distribution af sportsartikler
      description: Store distributører, der betjener stormagasiner, store detailhandlere og sportsvarekæder med kataloger med flere mærker. Konsistens, overensstemmelsesdokumentation og leverandøroverholdelse er altafgørende - hver SKU skal opfylde forhandlerspecifikke emballage-, mærknings- og kvalitetsstandarder.
      features:
        - 'Compliance-dokumentation til detailhandlere: emballagespecifikation, stregkode, mærkning'
        - EDI/ASN-integration med større detailhandleres bestillingssystemer
        - Leverandørstyret lager og programmer til automatisk genopfyldning
        - Dedikeret kundeansvarlig med SLA på 24 timers svartid
