content_challenge:
  tagline: Udfordringen
  title: Redningsoperationer kræver<br />ukompromisserlig pålidelighed
  subtitle: Eftersøgnings- og redningsorganisationer opererer under ekstremt sikkerhedsansvar - hver bådfejl har uacceptable konsekvenser.
  paragraphs:
    - Ved redningsaktioner måles marginen mellem succes og fiasko i minutter. Båden skal være klar til at søsætte med det samme, operere under barske forhold og returnere sikkert med passagerer. Sikkerhedsansvar er absolut - en mekanisk fejl under en redningsmission er ikke en reparationsomkostning, det er et tabt liv.
    - SAR både har brug for høj hastighed for at nå ofrene hurtigt, kombineret med enestående stabilitet for sikre bjærgningsoperationer. De skal medbringe redningsudstyr, medicinske forsyninger og kommunikationsudstyr - ofte på begrænset dæksplads. Både, der opererer i offentlig tjeneste, har også brug for lang levetid (10-15+ år) for at retfærdiggøre offentlige indkøbsbudgetter.
    - Sigtbarhed, både for føreren og til eftersøgning, er kritisk. Konsoldesignet skal give 360-graders sigtbarhed, og båden skal være let synlig for fly og andre fartøjer.
    - Paddle Board Overstocks rednings-RIB'er er konstrueret fra kølen og op til disse krav — med selvtømmende dæk, forstærkede skrog, navigationssuitter og slæbestolper som standard på patruljemodeller.
content_solution:
  tagline: Vores løsning
  title: Specialbyggede rednings-RIB'er
  subtitle: Hver Paddle Board Overstock redningsbåd er designet til at opfylde eller overgå SOLAS- og nationale SAR-standarder.
  list:
    - Selvtømmende dæk — vandet drænes automatisk for stabilitet under redningsoperationer
    - Forstærket deep-V-skrog — evne i hårdt vand med forudsigelig kørsel i høj fart
    - Komplet sæt navigationslys — drift dag og nat i alle vejrforhold
    - Slæbestolpe og slæbelinie — klar til slæbning af fartøjer eller redningsslæde-operationer
    - Monteringsplader til udstyr — radio, søgelys, sirene og medicinsk udstyr
    - Flere motorkonfigurationer — enkelt påhængsmotor eller redundans med tvillingsmotorer
    - Højsynlige tubefarver — orange, gul eller rød for maksimal synlighed
content_segments:
  tagline: Redningsprofiler
  title: Search & Rescue Watercraft Solutions<br />Efter organisationstype
  subtitle: Forskellige redningsorganisationer opererer under forskellige mandater, budgetcyklusser og driftsmiljøer - fra frivillige kystbesætninger til nationale kystvagtflåder. Vi konfigurerer hver redning RIB til at matche missionsprofilen.
  items:
    - title: Kystvagt og regering SAR agenturer
      subtitle: Absolut sikkerhedsansvar — missionskritiske flådestandarder
      description: Statslige SAR-agenturer bærer det højeste sikkerhedsansvar i maritime operationer. Enhver båd skal fungere fejlfrit under ekstreme forhold - udstyrsfejl under en redningsmission er ikke en mulighed. Indkøbsbeslutninger er drevet af samlede ejeromkostninger over 10-15 års levetid, ikke forudgående pris. Agenturer har brug for fartøjer, der overlever mange års kystpatrulje, opfylder strenge nationale standarder og leverer ensartet ydeevne på tværs af distribuerede stationer. Omfattende overholdelsesdokumentation og flerårige serviceaftaler er obligatoriske.
      features:
        - SOLAS og nationale SAR standarder overholdelse dokumentationspakke
        - Fælles for dele i hele flåden — reducer lagerkompleksiteten på stationsniveau
        - Twin-motor konfiguration til missionskritisk redundans
        - 10-15 års levetidsdesign med planlagte vedligeholdelsesprogrammer
        - Mulighed for al slags vejr — forstærket deep-V skrog til barske havtilstande
    - title: Livredder og strandredningstjenester
      subtitle: Quick-launch, lavt vand-operationer
      description: Kommunale og strandlivreddertjenester, der har brug for hurtige reaktionsfartøjer, der kan starte gennem surfzoner, operere i lavvandede kystnære farvande og nå svømmere eller nødstedte fartøjer inden for få minutter. Udstyret skal være let nok til bugsering på stranden med et lille køretøj eller manuelt.
      features:
        - Skrog med lavt dybdegående RIB til surfzone og kystdrift
        - Beach-launch stand med bovløftehåndtag og kølbeskyttelse
        - Integreret redningsslæde eller redningssvømmerplatform
        - Højsynlighed orange eller gule rørfarver standard
    - title: Brandredningsafdelinger
      subtitle: Brandpumpeintegration, udstyrsmontering, hurtig reaktion
      description: Marineredningsenheder reagerer på brande i havnefronten, fartøjsbrande og vandbaserede redningshændelser. Disse både skal bære brandpumper, monitorer, slangeopbevaring og åndedrætsapparater - alt sammen integreret i en stabil platform med hurtig reaktion. Afdelinger bruger også disse fartøjer til oversvømmelsesbekæmpelse og gensidige hjælpeoperationer. Konsollayouter skal rumme pumpestyringer, radiosystemer og nødbelysning uden at kompromittere dækspladsen til besætningens bevægelser.
      features:
        - Buemonteret brandmonitor med pumpeintegrationspakke
        - Dedikeret udstyrsmontering til brandpumpe, slangeopbevaring og BA-sæt
        - Konsollayout kan konfigureres til pumpestyringer, radio og nødbelysning
        - Selvdæmpende dæk til brandbekæmpelse af vandafstrømning og stabilitet
        - 'Natdriftspakke: søgelys, scenebelysning, blå/rød lysbjælke'
    - title: Søpoliti og Havnesikkerhed
      subtitle: Interdiktion, patrulje, boarding operationer
      description: Marine retshåndhævende enheder kræver fartøjer, der er i stand til højhastighedsforfølgelse, mistænkelige fartøjer ombordstigning og havnesikkerhedspatrulje. Disse både skal have sikker opbevaring til håndhævelsesudstyr og våben, kommunikationsintegration med kystkommando og tilstrækkelig dæksplads til ombordstigningsholdsoperationer. Natteoperationsevne og lavprofilstilgang er afgørende for forbudsmissioner.
      features:
        - Højhastigheds-forfølgelsesevne — planende skrog med 40+ knobs topfart
        - Sikkert våbenskab og opbevaringsrum til håndhævelsesudstyr
        - Konsolintegration til politiradio, MDT og kommunikationssystemer
        - 'Natdriftspakke: IR-spot, FLIR-beslag, skjult belysning'
        - Forstærket boardingplatform med skridsikker overflade
        - Blå/rød nødbelysning og sireneanlæg
    - title: Frivillige SAR & non-profit organisationer
      subtitle: Tilskudsfinansieret, samfundsbaseret kyst- og sødrift
      description: Fællesskabsbaserede redningsgrupper opererer i søer, floder og kystområder, hvor regeringens SAR dækning er begrænset. Ofte finansieret af donationer eller offentlige tilskud, har disse organisationer brug for maksimal kapacitet pr. dollar - et pålideligt fartøj med lav vedligeholdelse, som frivillige kan betjene sikkert med minimal dedikeret træning. Tilskudsindkøbscyklusser betyder, at bådene skal opfylde overholdelseskravene, mens de holder sig inden for faste budgetter.
      features:
        - Single-outboard konfiguration optimeret til lavere anskaffelses- og driftsomkostninger
        - PVC konstruktion for lavere vedligeholdelse og nem reparation i marken
        - Multifunktionskonsol minimerer elektronisk kompleksitet for frivillige operatører
        - Dokumentationspakke for overholdelse af tilskud til finansieringsansøgninger
        - Letvægtsdesign til strandlancering uden dedikeret trailer eller kran
    - title: Oversvømmelsesredning og katastrofeberedskab
      subtitle: Indlandsoversvømmelser, lavt vand, miljøer med affald
      description: Oversvømmelsesredning er en særskilt operationel profil - både opererer i oversvømmede byområder, affaldsfyldte strømme og ekstremt lavt vand, hvor nedsænkede forhindringer er usynlige. Operatører har brug for fartøjer, der kan navigere i oversvømmede gader, skubbe gennem affald og udvinde ofre fra bygninger og køretøjer. Muligheden for lavt træk er kritisk, ligesom evnen til at fungere i strøm med fare for problemer. Disse både bliver ofte indsat af brandvæsener, civilforsvar og NGO'er for katastrofehjælp.
      features:
        - Skrog med meget lavt træk — arbejde i 30-50 cm vand
        - Snavs-afvisende bue og forstærket rørbeskyttelse til nedsænkede forhindringer
        - Selvdæmpende dæk til afstrømning af oversvømmelser og genopretning af ofre
        - Højsynlighed orange eller gule rør til luftopklaringssynlighed
        - Letvægtsdesign til helikoptertransport og vejinstallation
        - Forstærkede løftepunkter til hejse- og rebredningsoperationer
