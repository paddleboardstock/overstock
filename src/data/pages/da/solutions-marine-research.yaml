content_challenge:
  tagline: Udfordringen
  title: Havforskningskrav<br />Stabile, instrumentklare platforme
  subtitle: Videnskabelige arbejdsbåde skal give en stabil platform for følsom instrumentering, stille drift for at undgå at forstyrre dyrelivet og fleksible layouts til forskelligt forskningsudstyr.
  paragraphs:
    - Havforskning og miljøovervågning kræver arbejdsbåde, der fungerer som mobile laboratorier. I modsætning til kommercielle eller fritidsfartøjer skal forsknings-RIB'er rumme følsom elektronisk instrumentering, udstyr til vand- og sedimentprøvetagning og til tider transport af levende prøver — samtidig med at en stabil platform opretholdes til præcis dataindsamling.
    - '**Platformstabilitet er afgørende** — Sonar, ekkolod og CTD-profiler (ledningsevne, temperatur, dybde) kræver et stabilt skrog i stillestående tilstand og ved lav fart. Overdrevent kølvand eller skrogbevægelser introducerer støj i videnskabelige data. Et dyb-V-skrog med gode stabilitetsegenskaber er afgørende.'
    - '**Instrumentintegration** — Forskningsfartøjer har brug for fastgørelsespunkter til GPS-antenner, sonartransducere, prøvetagningsarme og dataregistreringsudstyr. Konsolpladsen skal rumme flere skærme, strømforsyning til instrumenter og sikker opbevaring af følsom elektronik.'
    - '**Stille drift** — Ved marinebiologiske undersøgelser og miljøovervågning kan motorstøj og skrogvibrationer skræmme havlivet og kompromittere adfærdsobservationer. Stille udenbordskonfigurationer og skrogkonstruktioner med reducerede vibrationer er vigtige for forskningsanvendelser.'
    - Paddle Board Overstocks forsknings-RIB'er er designet med stabile skrogplatforme, integrerede fastgørelsessystemer til udstyr og stille udenbordskonfigurationer til videnskabelige og miljøovervågningsmæssige anvendelser.
content_solution:
  tagline: Vores løsning
  title: Formålsbyggede forsknings-RIB'er<br />Til videnskab og miljøarbejde
  subtitle: Hver Paddle Board Overstock-forsknings-RIB er konfigureret som en stabil, tilpasselig platform for videnskabelig instrumentering og feltprøveudtagningsudstyr.
  list:
    - Dyb-V-skrog i glasfiber med fremragende stabilitet i stillestående tilstand og ved lave undersøgelsesfarter
    - Fladt dæklayout med monteringsplader til udstyr til sonar, GPS og prøvetagningsudstyr
    - Konsol konfigureret til flere skærme — plotter, ekkolod, datalogger
    - 12V- og 24V-tilbehørsstrømforsyning til videnskabelige instrumenter
    - Stille 4-takts udenbordsmotor — minimal vibration og støj til faunakortlægning
    - Valgfri skrogkonstruktion med lavt kølvand til minimal forstyrrelse under dataindsamling
    - Tilpassede tubefarver til branding af forskningsinstitutioner og flådeidentifikation
content_segments:
  tagline: Forskningsprofiler
  title: Marine Science Solutions<br />Efter ansøgningstype
  subtitle: Forskellige forskningsapplikationer har unikke fartøjskrav - fra universitetsundervisningsplatforme til miljøundersøgelsesfartøjer til vandkvalitetsovervågnings-RIB'er.
  items:
    - title: Universitets marinevidenskabsprogrammer
      subtitle: Undervisningsplatforme, studieture for studerende, kystforskning
      description: Havvidenskabelige universiteter og oceanografiafdelinger har brug for pålidelige, alsidige arbejdsbåde til undervisning i feltkurser, studerendes forskningsprojekter og fakultetsledede kystundersøgelser. Båden skal være let at betjene for studerende under opsyn, stabil nok til praktisk instrumentinstallation og holdbar nok til hyppig brug af flere brugere på tværs af akademiske termer. Budgetbegrænsninger i akademiske omgivelser gør omkostningseffektivitet og lav vedligeholdelse vigtige overvejelser.
      features:
        - Stabil platform til studenters træning i udsætning og genindtagning af instrumenter
        - Nem betjening — konfiguration med ror eller enkelt konsol til overvåget studenterbrug
        - Holdbare Hypalon-tuber til hyppige strandlandinger og håndtering af studerende
        - Fastgørelse af udstyr til sonar i undervisningskvalitet, secchiskive og prøvetagningsudstyr
        - Omkostningseffektiv PVC-løsning til akademiske programmer med stramt budget
    - title: Havforskningsinstitutter
      subtitle: Survey RIB'er med instrumentintegration, GPS, prøveudtagningsudstyr
      description: Dedikerede havforskningsorganisationer, der udfører kyst- og offshoreundersøgelser, har brug for professionelt konfigurerede undersøgelses-RIB'er med integreret instrumentering. Disse fartøjer bærer sonarsystemer til batymetrisk kortlægning, CTD-profiler til vandsøjleanalyse, sedimentprøveudtagere og biologisk opsamlingsudstyr. Båden skal give en stabil platform ved langsomme undersøgelseshastigheder, have rigelig dæksplads til udstyrsinstallation og tilbyde ren 12V/24V strøm til elektronik.
      features:
        - Integreret sonartransducerfastgørelse — gennem skroget eller på agterspejlet
        - GPS-antennefastgørelse og konsolintegration til navigation i undersøgelseskvalitet
        - Udsætningsområde til CTD og vandprøvetager med sikre fastgørelsespunkter
        - 12V/24V-hjælpestrømforsyning til instrumenter og dataloggere
        - Stabil ved lav fart (3–6 knob) for præcision i undersøgelseslinjer
        - Valgfri A-frame eller davit til udsætning af tungere prøvetagningsudstyr
    - title: Miljøovervågning og -bevaring
      subtitle: Økologiske undersøgelser, dyrelivsobservation, habitatvurdering
      description: Miljø-NGO'er, regeringsorganer og bevaringsorganisationer udfører havøkologiske undersøgelser, overvågning af dyrelivsbestande og habitatvurderinger. Disse operationer kræver støjsvage fartøjer med lav påvirkning, der kan nærme sig følsomme levesteder uden at forstyrre dyrelivet. Både skal medbringe kameraudstyr, GPS til kortlægning af transekter og prøveudtagningsudstyr til vand- og sedimentopsamling. Lavt vågenhed og minimal motorstøj er afgørende for adfærdsobservationsundersøgelser.
      features:
        - Stille 4-takts udenbordsmotor — minimal forstyrrelse af havlivet
        - Stabil observationsplatform til foto- og videodokumentation
        - Fastgørelse af udstyr til kamerarig, GPS-trackere og feltcomputere
        - Lav dybgående for adgang til kystvådområder, mangrove og estuarier
        - Dæk- og tubeflader, der er lette at rengøre, til dekontaminering mellem lokaliteter
    - title: Vandkvalitetsovervågning og -testning
      subtitle: Regelmæssige prøveudtagninger, sporing af forurenende stoffer, overvågning af overholdelse
      description: Vandkvalitetsovervågningsorganisationer udfører regelmæssige prøveudtagninger på tværs af kystzoner, havne og indre vandveje for at spore forureningsniveauer, algeopblomstring og overholdelse af miljøbestemmelser. Disse operationer kræver effektive, pålidelige både til gentagne besøg på faste prøveudtagningsstationer. Fartøjet skal have prøveudtagningsudstyr, kølere til prøvekonservering og felttestudstyr - med nem dækvask mellem prøvetagningssteder for at forhindre krydskontaminering.
      features:
        - Dedikeret prøvetagningsstationsområde med køleboks og udstyropbevaring
        - Dæk- og tubeflader, der let rengøres, til dekontaminering mellem lokaliteter
        - GPS-integration til præcis tilbagevenden til faste prøvetagningskoordinater
        - Kompakt størrelse for adgang til begrænsede farvande og smale kanaler
        - Brændstofbesparende udenbordsmotor til omkostningseffektive regelmæssige prøvetagningsture
