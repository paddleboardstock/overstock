hero:
  tagline: Succeshistorier
  title: Reelle resultater fra<br />Water Business Builders
  subtitle: Se, hvordan klubber, feriesteder og iværksættere over hele verden byggede rentable vandsportsaktiviteter med Paddle Board Overstock-udstyr og support.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock-kundesucceshistorier
stories:
  - title: Hvordan et middelhavsresort byggede en rentabel SUP-udlejningsvirksomhed
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: 5-stjernet strandresort — Grækenland
    problem: Resortet havde brug for premium-gæstevandaktiviteter for at øge tilfredshedsscore og skabe en ny indtægtsstrøm, men manglede udstyr, sikkerhedsinfrastruktur og personaleekspertise.
    solution: Paddle Board Overstock leverede 50 specialmærkede SUP-brætter med resortfarver og logo, komplet sikkerhedssystem inklusive livredderstation og bøjelinjer og et 3-dages personaletræningsprogram, der dækker udstyrshåndtering, gæsteinstruktioner og sikkerhedsprotokoller.
    result:
      - Over 300 gæsteaktiviteter booket om ugen allerede den første måned
      - 'Gæstetilfredshed for vandsportsaktiviteter: 4,8/5'
      - 'Ny årlig sideindtægt: 180.000 $'
      - Nul sikkerhedshændelser i den første sæson
      - Omkostninger til udskiftning af udstyr reduceret med 40 % sammenlignet med den tidligere leverandør
    quote:
      text: Paddle Board Overstock leverede ikke kun boards – de hjalp os med at opbygge en komplet gæsteoplevelse. Vores vandsportsprogram gik fra nul til resort-højdepunkt på én sæson.
      author: Resortets administrerende direktør
    cta_text: Byg din feriestedsløsning
    cta_href: /solutions/resorts
  - title: Hvordan en australsk startup byggede et vandmærke på 90 dage
    badge: Brand Launch
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    customer: Første gang iværksætter - Australien
    problem: En udendørsentusiast ønskede at lancere sit eget SUP-mærke til det australske marked, men havde ingen produktionserfaring, ingen leverandørforhold og begrænset kapital.
    solution: Paddle Board Overstock's Brand Launch Package gav produktvalgsrådgivning, tilpasset logo og farvedesign, branded detailemballage med hang tags, CE-certificeringsdokumentation og FOB-forsendelse til Sydney.
    result:
      - Første forsendelse på 200 brædder leveret på 75 dage fra første kontakt
      - Mærke lanceret på Shopify + Amazon AU inden for 2 uger efter ankomst
      - Første lager udsolgt på 45 dage
      - 'Gennemsnitlig margen: 55 % af detailprisen'
      - 'Anden ordre: 500 enheder afgivet inden for 60 dage efter lanceringen'
    quote:
      text: Jeg havde mærkeideen, men ingen produktionskendskab. Paddle Board Overstock holdt bogstaveligt talt min hånd gennem hele processen - fra at vælge det rigtige borddesign til at udpakke min første forsendelse. 90 dage fra drøm til levering.
      author: Grundlægger, australsk SUP-mærke
    cta_text: Lancer dit mærke
    cta_href: /solutions/entrepreneurs
  - title: Hvordan en thailandsk strandklub skaleres fra 10 til 80 brædder
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Vandsportsklub - Thailand
    problem: En lille SUP-klub ved stranden i Phuket skulle skalere fra en hobbyvirksomhed til en professionel udlejningsvirksomhed, der betjener turister, men kunne ikke finde en pålidelig udstyrsleverandør med ensartet kvalitet og prisfastsættelse.
    solution: Startende med Paddle Board Overstocks Club Starter Package (10 boards, padler, sikkerhedsudstyr, branding), voksede klubben gennem Premium Package-programmet over 18 måneder.
    result:
      - Skaleret fra 10 til 80 brædder på 18 måneder med konsekvent kvalitet og priser
      - Tilføjede kajak- og pedalbådsudlejning hos samme leverandør
      - Klubbens skræddersyede profilering øgede mærkekendskabet blandt turister
      - Vedligeholdelsesomkostninger reduceret med 60 % sammenlignet med tidligere budgetudstyr
      - Nu over 150 udlejninger om dagen i højsæsonen
    quote:
      text: Klubstartpakken var det perfekte indgangspunkt. Efterhånden som vores forretning voksede, voksede Paddle Board Overstock med os – samme kvalitet, samme prissætning, ingen overraskelser.
      author: Klubejer, Phuket
    cta_text: Start din klubpakke
    cta_href: /solutions/clubs
  - title: Hvordan en caribisk feriestedskæde standardiserede vandsport på tværs af 5 ejendomme
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    customer: Resortkæde - Caribien
    problem: En luksusresortskæde med 5 ejendomme havde brug for ensartet vandsportsudstyrskvalitet og branding på tværs af alle lokationer, med centraliseret indkøb og sæsonbestemt udskiftningsplanlægning.
    solution: Paddle Board Overstock leverede en flåde med flere ejendomme på 300 SUP'er og 100 kajakker med samlet branding, delt reservedelsbeholdning og årlig udskiftningsplan med volumenpriser.
    result:
      - Standardiseret gæsteoplevelse på tværs af alle 5 ejendomme
      - 30 % omkostningsbesparelse gennem samlede indkøb og volumenpriser
      - Centraliseret reservedelslager reducerede nedetid med 80 %
      - Det årlige program til fornyelse af udstyr eliminerede travlheden ved sæsonafslutningen
      - Gæsternes deltagelse i vandsport steg med 45 % år for år
    cta_text: Design dit feriestedsprogram
    cta_href: /solutions/resorts
