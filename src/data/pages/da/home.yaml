faqs:
  title: SUP Bestilling & Produkt FAQ
  subtitle: Almindelige spørgsmål om vores udsalgs-SUP-kort, bestilling, betaling, forsendelse og garanti.
  columns: 2
  items:
    - title: Er SUP svært at lære?
      description: Slet ikke. De fleste begyndere står op og padler inden for deres første session. Vores allround SUP boards har ekstra brede, stabile platforme designet specielt til førstegangs-paddlere. Start på roligt vand, og du vil være i gang på få minutter.
      icon: tabler:swimming
      category: sup
    - title: Hvad er vægtgrænsen?
      description: Vores alsidige SUPs understøtter op til 220 lbs, og touring- og yoga-platformene understøtter op til 250 lbs. Hver produktside angiver den nøjagtige belastningskapacitet for rytteren, så du kan matche boardet til dine behov.
      icon: tabler:adjustments
      category: sup
    - title: Kan jeg rejse med en oppustelig SUP?
      description: Absolut. Hver Paddle Board Overstock plade passer ned i en rygsæksstørrelse bærepose. Med kun 18-22 lbs er den nem at bære til stranden, søen eller gennem lufthavnsterminaler. Tjek dit flyselskabs bagagepolitik før rejse.
      icon: tabler:truck-delivery
      category: sup
    - title: Hvad følger med i kassen?
      description: Hver Paddle Board Overstock SUP inkluderer boardet, en rejserygsæk, håndpumpe, justerbar pagaj, aftagelig finne, spiralline og reparationssæt.
      icon: tabler:clipboard-list
      category: sup
    - title: Hvorfor er jeres priser lavere end detailpriser?
      description: Vi sælger fabrikkens restlager og udsalgsbatcher direkte fra vores egen produktionsfacilitet i Weihai, Kina — ingen mellemled, ingen detailpåslag. Det betyder komplette SUP-pakker med op til 60 % rabat på typiske detailpriser, med samme CE-certificerede kvalitet.
      icon: tabler:certificate
      category: orders
    - title: Hvordan afgiver jeg en ordre og betaler?
      description: Tilføj din SUP pakke til kurven og betal sikkert med Stripe eller PayPal. Vi accepterer alle større kredit- og betalingskort. Hver ordre bekræftes via e-mail med en fuld faktura.
      icon: tabler:file-text
      category: orders
    - title: Sender I til hele verden?
      description: Ja. Vi sender til 50+ lande i hele EU, Nordamerika, Asien-Stillehavsområdet, Mellemøsten og Afrika. Bestillinger på lager sendes typisk inden for 2-3 hverdage med sporingsoplysninger for hver pakke.
      icon: tabler:route
      category: orders
    - title: Hvilken garanti inkluderer SUP boards?
      description: 'Hver SUP bræt og tilbehør er dækket af en 2-års garanti — inklusive selve brættet, drop-stitch sømme og oppustningsventiler. Krav bliver løst på dage, ikke uger: indsend online, og vi reparerer eller erstatter.'
      icon: tabler:lifebuoy
      category: orders
