content_workshop:
  isReversed: true
  tagline: Fabriksstyrke
  title: Hvorfor vores udsalgspriser<br />Er virkelige
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Ægte fabrik, ægte besparelser — hvert bord sendes fra vores facilitet i Weihai</h3>
  items:
    - title: Samme produktionslinjer som de store mærker
      description: Vores 12.000 m² store Weihai-fabrik bygger boards til internationale mærker og vores egne overlagerpartier på de samme linjer med de samme materialer.
    - title: 100% tryktestet
      description: Hvert board er tryksat til 1,25x klassificeret PSI og opbevaret før forsendelse. 99,3% fejlfri rate pr. AQL ISO 2,5 / 2859.
    - title: Ingen mellemled
      description: Bestyrelser sender fabriksudsalg direkte til din dør. Ingen distributørtilslag, ingen detailpåslag — det er sådan, udsalgsprisen forbliver op til 60% under detailprisen.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12.000 m² fabrik i Weihai med oppustelige SUP produktionslinjer
content_compliance:
  tagline: Overholdelse og kvalitetssikring
  title: Certificeret kvalitet,<br />Dokumenteret
  subtitle: Hver overholdelsessag understøttes af certifikater og modelspecifik dokumentation, som er tilgængelig til din verifikation.
  items:
    - title: ISO 9001:2015
      description: Kvalitetsstyringssystem certificeret af TÜV Rheinland/SGS. Årlige overvågningsaudits. Dokumenterede kvalitetskontrolprocesser fra indkommende materiale til forsendelsesfrigivelse.
      icon: tabler:certificate
    - title: CE Certificeret
      description: 13 CE-certificerede SUP modeller i henhold til gældende EU-direktiver, hver med en modelspecifik overensstemmelseserklæring og konstruktionspladedata.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Alle PVC og klæbematerialer overholder REACH EU-regulering.UKCA Mærkning er tilgængelig for det britiske marked. Materialesikkerhedsdatablade efter anmodning.
      icon: tabler:shield-check
    - title: 2-års SUP Garanti
      description: Hvert SUP board og tilbehør dækket i 2 år — drop-stitch samlinger, oppustningsventiler og tilbehør inkluderet. Skadene blev løst hurtigt.
      icon: tabler:lifebuoy
