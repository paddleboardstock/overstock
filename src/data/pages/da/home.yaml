faqs:
  title: Ofte stillede spørgsmål om B2B-indkøb
  subtitle: 'Almindelige spørgsmål fra brands, distributører og kommercielle operatører om OEM/ODM-fremstilling med Paddle Board Overstock.'
  columns: 2
  items:
    - title: Er I producent eller handelsselskab?
      description: 'Vi er en vertikalt integreret fabrik med fuld kontrol over kvalitet, materialer og leveringstider. Erhvervslicens og produktionsomfang kan verificeres under en fabriksrevision.'
      icon: tabler:building-factory
      category: all
    - title: Hvordan foregår jeres OEM/ODM-proces?
      description: 'Fra kravgennemgang (48 timer) til tilbud, prototype (7–14 dage) og produktion (30–45 dage FOB Qingdao). Fuld ingeniørstøtte, overholdelsesdokumentation og sporbarhed pr. skrog hele vejen.'
      icon: tabler:route
      category: all
    - title: Hvilke MOQ-krav har I?
      description: 'RIB-både: 2–5 enheder pr. model (eksisterende form), 200+ for egne former. SUP-boards: 5–10 enheder pr. SKU. Containerordrer med blandede modeller er mulige. Prøveordrer fra 2–5 enheder til evaluering.'
      icon: tabler:sort-ascending
      category: all
    - title: Hvilke tilpasningsmuligheder findes?
      description: 'Skrogdesign, rørmateriale (PVC eller Hypalon/CSM), rørdiameter, konsolplacering, sæder, styring, brændstofsystem, dæklayout, brandfarver, logografik, EVA-mattedesign, detailhandelsemballage og branding af brugsanvisningen.'
      icon: tabler:adjustments
      category: all
    - title: Hvilke overholdelsesdokumenter kan I levere til mit marked?
      description: 'CE-overensstemmelseserklæring i henhold til 2013/53/EU, UKCA-mærkning, ISO 9001-certifikat (SGS), BSCI-revisionsrapport, REACH-overholdelse, materialetestrapporter, tryktestlogge og modelspecifikke byggerpladedata. Markedsspecifik dokumentation på forespørgsel.'
      icon: tabler:file-certificate
      category: all
    - title: Hvor lang er leveringstiden for prøver og produktion?
      description: 'Forserieprøver: 7–14 arbejdsdage. Standardproduktion: 30–45 dage FOB Qingdao. Hurtigproduktion mod tillæg er mulig. I højsæsonen (marts–juni) kan leveringstiderne forlænges.'
      icon: tabler:clock
      category: all
    - title: Kan jeg arrangere en fabriksrevision eller en live-videorundvisning?
      description: 'Ja. Revisioner på stedet i vores anlæg i Qingdao er velkomne med 3–5 dages varsel. Live-videorundvisninger via WhatsApp/Zoom er tilgængelige med det samme. Inspektioner fra tredjepart (SGS, BV, TÜV) imødekommes.'
      icon: tabler:video
      category: all
    - title: Hvilke kvalitetsinspektioner gennemføres før forsendelse?
      description: 'Trykholdthedstest ved 1,25× nominelt tryk (24–48 timer), skræltest af sømme, 100-punkts checkliste til slutkontrol, dimensionel kontrol, kosmetisk inspektion, verifikation af overholdelsesdokumentation og kontrol af emballagens integritet. Alt efter ISO 9001-procedurer.'
      icon: tabler:clipboard-check
      category: all

