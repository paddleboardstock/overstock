content_customer_types:
  tagline: Hvem vi betjener
  title: 'Bygget til B2B-købere<br />— ikke til forbrugere'
  subtitle: 'Paddle Board Overstock fremstiller til fire kundetyper. Hver har forskellige prioriteter — og vi imødekommer dem alle.'
  items:
    - title: Brandejere / Private Label
      description: 'Skræddersyet produktdesign, private label-grafik, overholdelsesdokumentation under dit brand og dedikeret ingeniørstøtte fra koncept til container.'
      icon: tabler:palette
      cta: Anmod om et OEM/ODM-tilbud
      cta_href: /request-quotation
    - title: Distributører / Engroshandel
      description: 'Områdebeskyttelse, konkurrencedygtige engrospriser, marketingpakker, produkttræning og komplet overholdelsesdokumentation til dit marked.'
      icon: tabler:world
      cta: Ansøg om forhandlerskab
      cta_href: /dealers-distributors
    - title: Resorts / Udlejningsvirksomheder
      description: 'Holdbarhed i kommerciel klasse, rådgivning om flådestørrelse, containerordrer med blandede modeller, reservedelsstrategi og udstyrspakker med resort-branding.'
      icon: tabler:beach
      cta: Anmod om en kommerciel pakke
      cta_href: /solutions/resorts
    - title: Redning / Offentlig sektor / Professionelt
      description: 'Hypalon/CSM-konstruktion, SOLAS-overholdelsesmuligheder, projektspecifik certificering, støtte til udbudsdokumentation og ingeniørarbejde under NDA.'
      icon: tabler:shield
      cta: Diskuter et projekt
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: OEM/ODM-kapacitet
  title: 'Hvad du får<br />med Paddle Board Overstock'
  subtitle: 'Direkte adgang til fabrikken med fuld støtte inden for ingeniørfag, kvalitet og overholdelse — ikke et handelsselskab.'
  columns: 2
  items:
    - title: OEM/ODM-tilpasning
      description: 'Skræddersyet skrogdesign, rørmateriale (PVC eller Hypalon/CSM), konsolplacering, sæder, branding, farver og emballage. Fra mindre justeringer til fuldt skræddersyet konstruktion.'
      icon: tabler:adjustments
    - title: Lav MOQ, hurtige prøver
      description: 'RIB: 2–5 enheder (eksisterende form). SUP: 5–10 enheder pr. SKU. Egne former: 200+ enheder. Forserieprøver med din branding på 7–14 dage.'
      icon: tabler:rocket
    - title: Produktionklar kvalitet
      description: 'Hver enhed tryktestes ved 1,25× nominel PSI i 24–48 timer. 99,3 % fejlfrie pr. AQL 2,5 / ISO 2859. 100-punkts kvalitetscheckliste pr. skrog.'
      icon: tabler:certificate
    - title: Komplet overholdelsesdokumentation
      description: 'CE i henhold til 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI-socialrevision, REACH-overholdelse, UKCA-mærkning. Modelspecifik overensstemmelseserklæring og byggerpladedata inkluderet.'
      icon: tabler:file-certificate
    - title: 30–45 dages leveringstid
      description: 'Standardproduktion 30–45 dage FOB Qingdao. Prototyper på 7–14 dage. Hurtigproduktion er mulig. Containerlasteplaner og ISPM-15-emballage inkluderet.'
      icon: tabler:truck-delivery
    - title: Eftersalg & reservedele
      description: '5 års garanti på både/kajakker/RIB, 2 års garanti på SUP/tilbehør. Reservedelsforsyning med prioriteret forsendelse. Støtte til behandling af garantikrav.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Produktkategorier
  title: '5 kategorier,<br />64 CE-certificerede modeller'
  subtitle: 'Fra 2,4 m RIB-tendere til 15 fods SUP-boards — alle fremstillet i vores ISO 9001-anlæg i Qingdao.'
  items:
    - title: RIB-både
      description: '2,4 m til 7,0 m med aluminiums- eller GFK-skrog. PVC- eller Hypalon/CSM-rør. CE i henhold til 2013/53/EU. Konfigurationer til patrulje, dykning, redning og kommercielt brug.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Oppustelige både
      description: '2,0 m til 5,0 m med aluminiumsgulv, krydsfinergulv eller luftdæk. Fiskeri-, fritids- og tendermodeller.'
      icon: tabler:sailboat
      link: /products
    - title: SUP-boards
      description: '9 til 15 fod i 4- og 6-tommers Drop-Stitch. Allround-, touring-, yoga- og fiskerimodeller. Findes også i kommerciel klasse.'
      icon: tabler:swimming
      link: /products
    - title: Kajakker
      description: 'Oppustelige kajakker til 1 til 3 personer. Fritids- og touringmodeller med Drop-Stitch-gulv.'
      icon: tabler:kayak
      link: /products
    - title: Sikkerhedsudstyr
      description: 'CE-certificerede redningsvester, kastetove, reparationskits, pumper og navigationslys. Redningsvester godkendt af USCG type III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Fabriksstyrke
  title: 'Revisionsklar produktion<br />i Qingdao'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12.000 m² ISO 9001-anlæg — en ægte producent, ikke et handelsselskab</h3>
  items:
    - title: 6 dedikerede produktionslinjer
      description: 'Separate linjer til RIB, oppustelige både, SUP, kajakker, sikkerhedsudstyr og OEM/ODM. Hver med egne QC-kontrolpunkter og egen produktionsplanlægning.'
    - title: 100 % tryktestet
      description: 'Hvert oppusteligt kammer tryksættes til 1,25× nominel PSI og holdes i 24–48 timer. Testresultaterne knyttes til skrogserienummeret (HIN).'
    - title: Sporbarhed pr. skrog
      description: 'Produktionsregistre på HIN-niveau med 21+ datafelter pr. skrog: materialeparti, svejser-ID, tryktestresultat, slutkonfiguration og leveringsdestination.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstocks 12.000 m² store ISO 9001-produktionsanlæg i Qingdao med RIB-produktionslinjer

content_compliance:
  tagline: Overholdelse & kvalitetsbevis
  title: 'Dokumenterede beviser,<br />ikke kun påstande'
  subtitle: 'Hver overholdelsespåstand er understøttet af modelspecifik dokumentation, som du kan verificere.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Kvalitetsstyringssystem certificeret af TÜV Rheinland/SGS. Årlige overvågningsrevisioner. Dokumenterede QC-processer fra modtagelse af materialer til udlevering.'
      icon: tabler:certificate
    - title: CE i henhold til 2013/53/EU (RCD)
      description: '64 modeller med modelspecifikke overensstemmelseserklæringer. Vurdering af overensstemmelse i henhold til de gældende moduler. HIN-registrering og byggerpladedata for hvert skrog.'
      icon: tabler:file-certificate
    - title: BSCI-socialrevision
      description: 'Årlig BSCI-revision udført af SGS. Verificerede etiske arbejdsvilkår, arbejdssikkerhed og miljøledelse i hele anlægget.'
      icon: tabler:users
    - title: REACH & UKCA
      description: 'Alle PVC- og limmaterialer opfylder EU-REACH-forordningen. UKCA-mærkning tilgængelig til det britiske marked. Sikkerhedsdatablade på forespørgsel.'
      icon: tabler:shield-check

steps:
  title: OEM/ODM-processen — fra forespørgsel til container
  items:
    - title: 'Trin 1: <span class="font-medium">Krav</span>'
      description: 'Del dine produktspecifikationer, målmarked, antal og overholdelseskrav. Vores ingeniørteam gennemgår alt inden for 48 timer.'
      icon: tabler:file-text
    - title: 'Trin 2: <span class="font-medium">Tilbud</span>'
      description: 'Du modtager et detaljeret tilbud med specifikationer, materialevalg, MOQ, priser, leveringstid og overholdelsesomfang til dit marked.'
      icon: tabler:clipboard-list
    - title: 'Trin 3: <span class="font-medium">Prototype</span>'
      description: 'Forserieprøve med din branding på 7–14 dage. Fuldstændig kvalitetstest ved 1,25× nominelt tryk. Prøveomkostningerne godskrives produktionen.'
      icon: tabler:settings
    - title: 'Trin 4: <span class="font-medium">Produktion</span>'
      description: '30–45 dages produktion FOB Qingdao efter godkendt prøve. QC-kontrolpunkter undervejs, tryktest og 100-punkts slutkontrol af hver enhed.'
      icon: tabler:building-factory
    - title: 'Trin 5: <span class="font-medium">Levering</span>'
      description: 'Containerlasteplan, ISPM-15-træemballage, pakke med overholdelsesdokumentation og forsendelse FOB Qingdao med komplet eksportdokumentation.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstocks OEM/ODM-fremstillingsproces for oppustelige både — fra konstruktion til containerforsendelse

