features:
  id: features
  tagline: Hvorfor købe fra Paddle Board Overstock
  title: Ægte Fabrik,<br />Reelle besparelser
  subtitle: Fabriks-direkte overflod og udsalgs SUP pakker — certificeret kvalitet uden detailpristillæg.
  columns: 2
  items:
    - title: Op til 60% rabat på vejledende pris
      description: Vi sælger fabriksoverskud og udsalgsparti direkte — ingen mellemled, ingen detailpåslag. De samme boards, der sælges til fuld pris andre steder, til udsalgspriser her.
      icon: tabler:rocket
    - title: Færdige pakker
      description: 'Hver SUP leveres som en komplet pakke: bræt, rejserygsæk, håndpumpe, justerbar pagaj, aftagelig finne, spiralline og reparationssæt.'
      icon: tabler:clipboard-list
    - title: Certificeret kvalitet
      description: 13 CE-certificerede SUP-modeller i henhold til gældende EU-direktiver. Hvert kort testes 100% med tryk ved 1,25x nominelt PSI før det sendes. 99,3% fejlratefri ifølge AQL 2,5.
      icon: tabler:certificate
    - title: Nej MOQ — Bestil et stikbord
      description: Overstock-rydning betyder, at enkeltstående ordrer er velkomne. Tilføj en plade til kurven, gå til kassen, færdig. Ingen minimumsordre, ingen tilbudsproces.
      icon: tabler:adjustments
    - title: Hurtig levering verden over
      description: Lagerførte ordrer sendes fra Weihai inden for 2-3 hverdage. Sporbar levering til 50+ lande i hele EU, Nordamerika, Asien-Stillehavsområdet og derudover.
      icon: tabler:truck-delivery
    - title: 2-års SUP Garanti
      description: Hvert SUP board og tilbehør er dækket i 2 år — drop-stitch samlinger, inflationsventiler og tilbehør inkluderet. Krav behandles på dage, ikke uger.
      icon: tabler:lifebuoy
