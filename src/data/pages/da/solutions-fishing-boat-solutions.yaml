content_challenge:
  tagline: Udfordringen
  title: Fiskebåde har brug for<br />stabilitet, rækkevidde og holdbarhed
  subtitle: Uanset om du driver kommercielle fiskefartøjer, administrerer en andelsflåde eller driver fiskecharter - din båd skal præstere pålideligt hver dag.
  paragraphs:
    - Fiskebåde har brug for stabile platforme til at arbejde med liner, håndtere fangst og bevæge sig sikkert rundt på dækket. Gummibåde og RIB'er tilbyder iboende stabilitet gennem deres tubedesign — en betydelig fordel i forhold til stive skrog af tilsvarende længde.
    - Brændstofeffektivitet har betydning for fiskeriet, hvor driftsomkostningerne direkte påvirker rentabiliteten. RIB'er og gummibåde er lettere end tilsvarende stive både, de kræver mindre strøm og forbrænder mindre brændstof - afgørende for kommercielle operatører, der kører både dagligt, og kooperativer, der administrerer flådebudgetter.
    - Holdbarhed i havmiljøer er afgørende. Saltvand, UV-eksponering og konstant brug kræver materialer, der kan modstå barske forhold uden nedbrydning. For kommercielle og kooperative operatører påvirker pålidelighed direkte indkomsten - en ødelagt båd betyder tabte fiskedage.
    - Aquafarer fiskekonfigurationer inkluderer stangholdere, fishfinders, agnbrønde, livewells og lasthåndteringsløsninger designet til seriøse fiskeriapplikationer på tværs af kommercielle, kooperative og rekreative aktiviteter.
content_solution:
  tagline: Vores løsning
  title: Fiskeklare konfigurationer
  subtitle: Hver Aquafarer fiskebåd kan konfigureres til din specifikke fiskeanvendelse.
  list:
    - Montering af stangholder — fabriksmonteret eller klar til eftermontering
    - Monteringsplade til fisksøger/GPS ved konsolpositionen
    - Muligheder for agtanks eller levende-tank til charter- og kommercielle operatører
    - Køleboks/opbevaringskonfigurationer til håndtering af fangst
    - Deep-V-skrog til offshore-evne — stabilt i hvile, blødt i fart
    - Muligheder med PVC- eller Hypalon-tuber — Hypalon til længere UV-eksponering
    - Påhængsmotorområde fra 15 HK til 115 HK afhængigt af model og anvendelse
content_segments:
  tagline: Fiskeprofiler
  title: Løsninger til oppustelige fiskebåde<br />Efter operatørtype
  subtitle: Fra kystsportsfiskeri til kommercielt langlinefiskeri - forskellige fiskerioperationer kræver forskellige skrogkonfigurationer, effektområder og opsætninger på dækket. Vi skræddersyer hver båd til at matche fiskeriet, farvandet og arbejdsstilen.
  items:
    - title: Kommercielle fiskerivirksomheder
      subtitle: Flådearbejdsbåde til dagligt fiskeri, nethåndtering, fangsttransport
      description: Kommercielle fiskerivirksomheder driver arbejdsbåde til garnsætning og -hentning, fangstservice, langline- og fangsttransport. Disse både arbejder hver dag i saltvandsmiljøer og skal modstå tunge belastninger, konstant dækhåndtering og lange driftstimer. Brændstofeffektivitet og lav vedligeholdelse er afgørende for flådens rentabilitet. Fartøjet skal sørge for stabile arbejdsplatforme til besætningshåndtering af redskaber og fangst under varierende havforhold.
      features:
        - Fladt dækslayout til nethåndtering, fældestabling og fiskeopbevaring
        - Brændstofeffektiv 40-115 HP påhængsmotor til lave daglige driftsomkostninger
        - Kraftige Hypalon-rør til slidstyrke ved daglig brug
        - Forstærkede gnidningslister til hyppig kontakt med kaj og fartøj
        - Selvlåsende dæk til nem afvaskning efter operationer
        - Flådepriser og ensartede specifikationer for operatører med flere fartøjer
    - title: Charter fiskeoperatører
      subtitle: Multi-passager komfort, fangsthåndtering, sikkerhedscertificeret
      description: Operatører, der kører halvdags- og heldagsfiskeri – fra kystfiskeri til revfiskeri til havbundsfiskeri. Din båd har brug for passagersæder med sikkerhedscertificeringer, rigelig dæksplads til flere lystfiskere og integrerede brønde til at holde agn og fangst frisk under hele turen. Gæstekomfort påvirker direkte rejseanmeldelser, gentagne reservationer og onlinevurderinger.
      features:
        - Konsolstyring med stødabsorberende skovlsæder
        - Fabriksinstallerede stangholdere (4–8 positioner)
        - 60–115 HP udenbords rækkevidde til offshore-marchhastigheder
        - CE Kategori C- eller B-certificering til kommerciel passagerdrift
        - Bimini eller T-top parasol for gæsternes komfort på længere ture
    - title: Håndværks- og småskala erhvervsfiskere
      subtitle: Pålidelige arbejdsbåde til dagligt levebrød
      description: Uafhængige fiskere, der er afhængige af deres båd som deres primære indtægtskilde - at sætte garn, passe fiskefælder eller håndtere foring nær kysten. Din prioritet er brændstoføkonomi, enkel vedligeholdelse, du selv kan udføre, og en båd, der håndterer moderate mængder fangst og grej uden at ofre stabiliteten.
      features:
        - Brændstofeffektiv 15–40 HP påhængsmotor til lave driftsomkostninger
        - Hypalon CSM rør for udvidet UV- og slidstyrke
        - Fladt dækslayout til nethåndtering og fiskeopbevaring
        - Nem strandlandingsevne med oppustelig kølbeskyttelse
    - title: Fiskerikooperativer
      subtitle: Fangstindsamling, medlemstransport, forsyningsfordeling
      description: Fiskerikooperativer driver lokalsamfundsbaserede flåder til at indsamle fangst fra medlemsfiskere, transportere forsyninger til fjerntliggende fiskersamfund og distribuere høst til markeder. Disse arbejdsbåde har brug for høj nyttelastkapacitet, pålidelig daglig drift og nem vedligeholdelse på fjerntliggende steder. Kooperativer opererer ofte i udviklingsområder, hvor tilgængelighed af reservedele og serviceadgang er begrænset, hvilket gør enkle påhængsmotorkonfigurationer og holdbar konstruktion afgørende.
      features:
        - Høj nyttelastkapacitet til at trække fangst og forsyninger
        - Enkel påhængsmotorkonfiguration til nem service på stedet
        - Kraftig PVC eller Hypalon konstruktion for budgetfleksibilitet
        - Fladt dæk med fastgørelsespunkter til sikring af last
        - Brændstofeffektiv drift, der minimerer samarbejdsomkostninger
    - title: Sports- og fiskeentusiaster
      subtitle: Ydeevne og stil til seriøse lystfiskere
      description: Erfarne lystfiskere søger en dygtig fiskeplatform, der leverer fart til fjerne grunde, stabile stand-up kamppositioner og førsteklasses pasform og finish. Båden skal føle sig hjemme, uanset om den løber to miles offshore til et rev eller udforsker fjerntliggende flodmundinger.
      features:
        - Deep-V RIB skrog til jævn kørsel i chop
        - Fishfinder/GPS-monteringsplade formonteret på konsollen
        - Baitwell og køler integreret i bagsædets modul
        - Brugerdefinerede EVA dækfarveindstillinger, der matcher båd/rør-grafik
    - title: Fiskeguide og øko-turarrangører
      subtitle: Guidede fiskeoplevelser for besøgende lystfiskere
      description: Guider, der tager små grupper af besøgende lystfiskere med til produktive fiskesteder - ofte kombinerer fiskeri med økoturismeelementer som fuglekiggeri eller mangroveudforskning. Båden skal sejle tørt og behageligt for gæster, der ikke er vant til små både, med nem boarding og skyggemuligheder.
      features:
        - Bimini top eller T-top monteringspunkter fabriksinstalleret
        - Glat indstigningsstige for nem ombordstigning
        - Stille 4-takts påhængsmotor for at minimere forstyrrelser
        - Tørre opbevaringsrum til gæstetelefoner, tegnebøger, kameraer
