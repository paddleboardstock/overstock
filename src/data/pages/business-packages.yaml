faq:
  title: Package FAQ
  questions:
    - q: What is the minimum order quantity for packages?
      a: Club Starter Package has a minimum of 10 units. Resort and Brand packages are customized to your needs with flexible MOQs.
    - q: How long does delivery take?
      a: Standard production is 30–45 days from order confirmation. Expedited production is available for an additional fee.
    - q: Can I customize the equipment colors and branding?
      a: Yes. All packages include full customization — board colors, logo prints, and packaging design.
    - q: Do you provide after-sales support?
      a: Yes. Every package includes access to our online maintenance guides, video tutorials, and spare parts ordering system.

