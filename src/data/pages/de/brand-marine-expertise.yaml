hero:
  tagline: Maritime Kompetenz
  title: 'Jahrzehnte Schiffsbaukompetenz<br />in jedem Rumpf'
  subtitle: 'Paddle Board Overstock verbindet tiefe Materialwissenschaft, Präzisionsfertigung und praxisnahe Erprobung, um Wasserfahrzeuge zu bauen, die leisten, wenn es darauf ankommt.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Marine-Ingenieur- und F&E-Team von Paddle Board Overstock bei der Arbeit
expertise_materials:
  tagline: Materialwissenschaft
  title: 'Das richtige Material<br />für jede Anwendung'
  subtitle: 'Wir arbeiten mit drei Kernmaterialien – jedes ausgewählt für spezifische Einsatzbereiche und Leistungsanforderungen.'
  columns: 3
  items:
    - title: Marine-PVC
      description: '1100-den-PVC-Gewebe – unser vielseitigstes Material. UV-stabilisiert, abriebfest und REACH-konform. Ideal für Freizeitboote, SUP-Boards und Kajaks, bei denen Gewicht und Kosteneffizienz zählen.'
      icon: tabler:droplet
    - title: Premium-Hypalon/CSM
      description: 'Hervorragende Chemikalienbeständigkeit und UV-Stabilität. Hypalon-Boote können bei richtiger Pflege 15-20 Jahre halten. Empfohlen für gewerbliche, Rettungs- und Militäranwendungen, bei denen langfristige Haltbarkeit entscheidend ist.'
      icon: tabler:shield
    - title: Fiberglas & Aluminium
      description: 'Deep-V-Fiberglasrümpfe für RIBs und Patrouillenboote – wellenbrechende Leistung bei rauer See. Aluminiumrümpfe für schwere gewerbliche Arbeitsboote, die maximale Festigkeit und Ladekapazität erfordern.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Fertigungskapazitäten
  title: 'Präzisionsfertigung<br />auf jeder Stufe'
  subtitle: 'Unsere 12.000 m² große Anlage ist mit Spezialmaschinen für jede Produktionsstufe ausgestattet.'
  columns: 2
  items:
    - title: CNC-Zuschnitt
      description: 'Computergesteuerter Zuschnitt gewährleistet präzise, wiederholbare Stoffbahnen mit minimalem Verschnitt. Jedes Teil passt exakt, wie konstruiert.'
      icon: tabler:cpu
    - title: Hochfrequenzschweißen
      description: 'Industrielles HF-Schweißen erzeugt Nähte, die fester sind als das Grundmaterial. Konstante Temperatur- und Druckkontrolle sorgt in jeder Produktionsserie für luftdichte Nahtverbindungen.'
      icon: tabler:bolt
    - title: Drop-Stitch-Kernmontage
      description: 'Tausende Polyesterfäden verbinden obere und untere Stoffschicht und ermöglichen Hochdruck-Aufblasung (15-20 PSI) für steife, stabile SUP-Boards und Böden.'
      icon: tabler:building-arch
    - title: Druckprüfung
      description: 'Jedes aufblasbare Produkt wird vor dem Versand druckgeprüft. RIB-Schläuche werden mit dem 1,25-fachen Nenndruck getestet – hält das Produkt dort stand, leistet es auch auf dem Wasser.'
      icon: tabler:wind
    - title: Nahtfestigkeitsprüfung
      description: 'Stichproben aus jeder Produktionscharge werden zerstörenden Nahtfestigkeitstests unterzogen. Die Ergebnisse werden protokolliert und sind bestimmten Produktionsserien zuordenbar.'
      icon: tabler:files
    - title: Wassererprobung
      description: 'Jedes RIB-Modell absolviert vor der Zertifizierung Seeprobefahrten. Praxistests unter Küstenbedingungen validieren Leistung, Fahrverhalten und Stabilität.'
      icon: tabler:ripple
expertise_design:
  tagline: Konstruktion & Technik
  title: 'Für reale Bedingungen entwickelt'
  subtitle: 'Unsere Designphilosophie beginnt mit der Frage, wie das Boot genutzt wird – und baut das Engineering um diesen Einsatzzweck herum auf.'
  items:
    - title: Deep-V-Rumpfdesign
      description: 'Unsere Fiberglasrümpfe verfügen über berechnete Kimmwinkel, optimiert für Länge und Einsatzzweck jedes Modells. Steileres V für raues Wasser, flacher für Stabilität.'
    - title: Multikammer-Sicherheit
      description: 'Jedes Boot verfügt über 3-7 unabhängige Luftkammern. Wird eine Kammer beschädigt, halten die übrigen das Boot schwimmfähig und einsatzbereit.'
    - title: Ergonomisches Layout
      description: 'Konsolenposition, Schlauchhöhe und Sitzplatzierung sind auf den Bedienkomfort bei längerem Einsatz ausgelegt – ob beim Patrouillieren, Fischen oder Transportieren.'
    - title: Individuelle Konfiguration
      description: 'Schlauchfarben, Konsolenkonfiguration, Treibstoffkapazität, Zubehörhalterungen – jedes Modell kann an spezifische betriebliche Anforderungen angepasst werden.'
