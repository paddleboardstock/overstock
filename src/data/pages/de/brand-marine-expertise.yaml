hero:
  tagline: Marine-Expertise
  title: Jahrzehnte des Schiffsingenieurwesens<br />in jedem Brett
  subtitle: Paddle Board Overstock Kombiniert tiefgehende Materialwissenschaft, Präzisionsfertigung und praxisnahe Tests, um Bretter zu produzieren, die genau dann leistungsfähig sind, wenn es darauf ankommt.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Schiffsingenieurwesen und F&E-Team bei der Arbeit
expertise_materials:
  tagline: Materialwissenschaft
  title: Die Wahl des richtigen Materials<br />für jede Anwendung
  subtitle: Wir arbeiten mit drei Kernmaterialien – jedes für spezifische Anwendungsfälle und Leistungsanforderungen ausgewählt.
  columns: 3
  items:
    - title: Marine-Qualität PVC
      description: 1100-Denier-Stoff PVC – unser vielseitigstes Material. UV- Stabilisiert, abriebfest und zeitgeprüft. Ideal für SUP Bretter, bei denen Gewicht, Steifigkeit und Kosteneffizienz zählen.
      icon: tabler:droplet
    - title: Drop-Stitch Kern
      description: Tausende von Polyesterfäden verbinden die oberen und unteren Stoffschichten und ermöglichen so eine Hochdruckaufblasung (15) PSI für eine steife, stabile Fahrt, die sich trotzdem in einen Rucksack rollen lässt.
      icon: tabler:building-arch
    - title: EVA Deckschaumstoff
      description: Rillierter, hochdichter EVA Schaumstoff sorgt für durchgehenden Halt, Polsterung bei Stürzen und eine Leinwand für unsere charakteristischen Art-Series-Decks.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Fertigungskapazitäten
  title: Präzisionsfertigung<br />bei jedem Schritt
  subtitle: Unsere 12.000 m² große Anlage ist mit spezialisierten Maschinen für jede Produktionsphase ausgestattet.
  columns: 2
  items:
    - title: CNC Schneiden
      description: Computergesteuertes Zuschneiden sorgt für präzise, wiederholbare Stoffplatten mit minimalem Abfall. Jedes Teil passt genau so, wie es entworfen ist.
      icon: tabler:cpu
    - title: Hochfrequenzschweißen
      description: Das industrielle HF-Schweißen erzeugt Nähte, die stärker sind als das Grundmaterial. Eine konstante Temperatur- und Druckregelung sorgt für luftdichte Dichtungen in jedem Produktionslauf.
      icon: tabler:bolt
    - title: Drop-Stitch-Kernbaugruppe
      description: Tausende von Polyesterfäden verbinden obere und untere Stoffschichten, was eine Hochdruckaufblasung (15–20) PSI für starre, stabile SUP Dielen und Böden ermöglicht.
      icon: tabler:building-arch
    - title: Druckprüfung
      description: Jedes Board wird vor dem Versand unter Druck getestet und mit 1,25-fachem Nenndruck gehalten – wenn es dort hält, funktioniert es auch auf dem Wasser.
      icon: tabler:wind
    - title: Nahtfestigkeitstests
      description: Zufallsproben jeder Produktionscharge werden zerstörerischen Nahtfestigkeitstests unterzogen. Die Ergebnisse werden protokolliert und auf bestimmte Produktionsläufe zurückverfolgbar.
      icon: tabler:files
    - title: Wassertests
      description: Jedes Board-Design wird echten Wassertests unterzogen. Paddeln unter realen Küstenbedingungen überprüft Leistung, Handling und Stabilität.
      icon: tabler:ripple
expertise_design:
  tagline: Design & Technik
  title: Für reale Bedingungen entwickelt
  subtitle: Unsere Designphilosophie beginnt damit, wie das Board genutzt wird – und baut die Technik um diesen Einsatzzweck herum.
  items:
    - title: Board-Form & Kontur
      description: Länge, Breite und Rocker werden für den vorgesehenen Einsatz jedes Modells abgestimmt – längere Touring-Konturen für Gleiten, breitere Boardflächen für Stabilität und Yoga.
    - title: Rails & Stringer-Verstärkung
      description: Verstärkte Rails und Mittelschnüre erhöhen die Steifigkeit und dämpfen Stöße – die Stellen, an denen Boards Saison für Saison am meisten beansprucht werden.
    - title: Deck-Layout & Traktion
      description: Standbereich, Griffplatzierung, D-Ring-Montagen und Traktionszonen sind auf reale Paddelhaltungen ausgelegt – egal ob cruisen, angeln oder Yoga praktizieren.
    - title: Kunst & Farbserien
      description: Deck-Grafiken, Farbschemata und Zubehör-Montagen – jede Serie ist auf eine bestimmte Paddel-Persönlichkeit abgestimmt.
cta:
  title: Haben Sie eine spezielle Anwendung im Sinn?
  subtitle: Unser Team kann Ihnen helfen, das richtige Board, die richtige Größe und Ausrüstung für Ihren Paddelstil auszuwählen.
  actions:
    - variant: primary
      text: Fragen Sie unsere Ingenieure
      href: /contact
    - text: Produktangebot ansehen
      href: /products
