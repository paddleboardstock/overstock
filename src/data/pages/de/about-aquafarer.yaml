hero:
  tagline: Über uns
  title: 'Über {SITE}'
  subtitle: Ein vertikal integrierter Wassersporthersteller – vom Rohmaterial bis zum fertigen Boot

intro:
  - 'Aquafarer wurde 2012 mit einer einzigen Mission gegründet: Wassersportausrüstung zu entwickeln und zu fertigen, die auf dem Wasser genauso überzeugt wie im Qualitätsbericht. Was als fokussierte SUP-Brett-Werkstatt begann, ist zu einer 12.000 Quadratmeter großen integrierten Fertigungsanlage in der Wirtschaftsentwicklungszone Qingdao herangewachsen, die Schlauchboote, RIBs, Kajaks, SUP-Bretter, Sicherheitsausrüstung und Zubehör für Kunden in über 50 Ländern produziert.'
  - Heute agiert Aquafarer als Fabrikmarke – wir entwerfen, entwickeln, prototypisieren, fertigen und testen alles unter einem Dach. Diese vertikale Integration gibt uns die direkte Kontrolle über Materialauswahl, Verarbeitungsqualität und Liefertermine. Jedes Boot wird von unseren Leuten, auf unseren Maschinen, nach unseren Standards gebaut.
  - Wir bedienen Freizeitnutzer, gewerbliche Betreiber, Regierungsbehörden und Markenpartner weltweit. Unsere OEM- und ODM-Programme helfen Unternehmen, ihre eigenen Produktlinien zu starten, ohne in Fabrikinfrastruktur investieren zu müssen. Ob Sie einen einzelnen Prototypen oder eine vollständige Produktionsserie benötigen – unser Team begleitet Sie vom Konzept bis zur seereifen Lieferung.

