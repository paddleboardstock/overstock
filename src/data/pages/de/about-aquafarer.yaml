values:
  - title: Qualität zuerst
    desc: Jedes Boot, das unser Werk verlässt, durchläuft vor dem Versand obligatorische Luftdichtheits-, Nahtschäl- und Systemtests.
  - title: Vertikale Integration
    desc: Wir kontrollieren jede Stufe – vom PVC-Schneiden bis zur Endmontage – und vermeiden so Subunternehmer-Ineffizienzen bei gleichbleibender Qualität.
  - title: Sicherheit als Standard
    desc: CE-Zertifizierung ist Kern dessen, was wir bauen. Unsere 64 CE-zertifizierten Modelle erfüllen die EU-Sicherheitsstandards für Freizeit- und Gewerbenutzung.
  - title: Partnerzentriert
    desc: Wir bauen langfristige Beziehungen zu OEM-, ODM- und Private-Label-Partnern durch Transparenz, Zuverlässigkeit und gemeinsames Wachstum.

services:
  - title: OEM-Fertigung
    desc: Wir fertigen nach Ihren Spezifikationen. Teilen Sie uns Ihre Zeichnungen mit, und unser Ingenieurteam kümmert sich um Prototyping, Werkzeugbau und Produktion.
  - title: ODM-Lösungen
    desc: Starten Sie von unseren bewährten Plattformdesigns. Passen Sie Größe, Farbe, Grafik und Verpackung an, um Ihre einzigartige Produktlinie zu erstellen.
  - title: Private Label
    desc: Ihr Markenname, Ihr Logo, Ihre Verpackung. Die Produkte kommen verkaufsfertig mit vollständiger Markenintegration.
  - title: Individuelles Branding
    desc: Deckpad-Druck, Rumpfgrafiken, Schlauchaufkleber und individuelle Etiketten – konsistente Markenpräsenz auf jeder Oberfläche.

certifications:
  - name: CE-Zertifizierung
    desc: Unsere Boote und Wasserfahrzeuge entsprechen der EU-Richtlinie für Sportboote (2013/53/EU) und den relevanten harmonisierten Normen.
    scope: Boote & Wasserfahrzeuge
  - name: ISO 9001
    desc: Qualitätsmanagementsystem zertifiziert für Entwicklung, Fertigung und Vertrieb von aufblasbaren Wasserfahrzeugen.
    scope: Gesamte Anlage
  - name: ISO 6185
    desc: Schlauchboote – Sicherheits- und Leistungsanforderungen für verstärkte und starre Schlauchboote.
    scope: RIB- & Schlauchbootlinien

