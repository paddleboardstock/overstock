hero:
  tagline: Unsere Geschichte
  title: 'Paddle Board Overstock — Engineering Freiheit auf dem Wasser'
  subtitle: 'Von einer Küstenwerkstatt zu einem globalen Marinehersteller — unser Weg ist geprägt von der festen Überzeugung: Wasserfahrzeuge sollten so konstruiert sein, als ob sie zählen, denn sie tun es.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock Fabrik und Marinefertigungsanlage in Qingdao

