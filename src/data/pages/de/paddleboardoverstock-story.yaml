  subtitle: 'Von einer Küstenwerkstatt bis hin zu einem globalen Marinehersteller – unsere Reise basiert auf dem hartnäckigen Glauben: Paddleboards sollten so konstruiert werden, als ob sie wichtig sind, denn das tun sie.'
