timeline:
  - year: '2012'
    title: Stiftung für Marine Fertigung
    body: Paddle Board Overstock begann als spezialisierte aufblasbare Paddleboard-Werkstatt in Weihai, China, die sich der maritimen Handwerkskunst und der Herstellung von Brettern widmete. Der frühe Fokus lag auf der Herstellung zuverlässiger aufblasbarer Produkte durch praktische Ingenieurserfahrung und Fertigungsdisziplin.
  - year: '2015'
    title: Erste Exporte
    body: Erste Exportaufträge erreichten Japan und Korea, was Paddle Board Overstock den Eintritt in internationale Märkte markierte. Das Unternehmen begann, Paddler und Wassersportbegeisterte außerhalb Chinas zu bedienen.
  - year: '2018'
    title: Fabrikerweiterung
    body: Verlegung in eine Produktionsstätte von 12.000 m². Hinzufügen von RF-Schweißlinien und drop-stitch Produktionskapazität, was größere Fertigung und verbesserte Qualitätskontrollsysteme ermöglichte.
  - year: '2020'
    title: F&E-Zentrum gegründet
    body: Ein eigenes F&E-Zentrum mit PVC Stofflabor, hydrodynamischem Testtank und CAD/FEA-Simulationsstudio wurde eröffnet. Die Produktentwicklung wurde auf leichte Bauweise, verbesserte Haltbarkeit und nutzerorientiertes Design ausgeweitet.
  - year: '2022'
    title: Globales Wachstum
    body: Erweitert auf 14 F&E-Ingenieure und 200+ Arbeiter. Die Boards erreichten Paddler in ganz Europa, Amerika und Asien-Pazifik und verschickten in 50+ Länder.
  - year: '2024'
    title: Innovations- und Designstudio
    body: Wir haben ein Full-Service-Design- und Innovationsstudio für neue Board-Serien vom Konzept bis zur Produktion gestartet. Wir haben unsere charakteristischen Art-Series-Decks und Tour-Plattformen erweitert.
  - year: '2026'
    title: Die Zukunft der Wassererkundung aufbauen
    body: Heute entwickelt es Paddle Board Overstock weiterhin aufblasbare SUP Bretter, Paddelausrüstung und maßgeschneiderte maritime Lösungen – die Menschen und Organisationen mit den Gewässern der Welt verbinden. 50+ Länder bedienen und haben eine jährliche Kapazität von 15.000 Einheiten.
content_founding:
  tagline: Der Anfang
  title: Geboren am Waterfront
  subtitle: 'Paddle Board Overstock begann in einer Küstenwerkstatt in Weihai mit einem Brett und einer Vision: aufblasbare Paddleboards zu bauen, die realen maritimen Bedingungen standhalten.'
  paragraphs:
    - 2012 sahen unsere Gründer eine Marktlücke – die meisten aufblasbaren Boards waren entweder erschwinglich, aber unzuverlässig oder hochwertig, aber unerschwinglich teuer. Sie glaubten, dass es Platz für einen Hersteller gibt, der sowohl Qualität als auch Mehrwert bietet.
    - Der erste Rumpf wurde von Hand gebaut, in lokalen Gewässern getestet und basierend auf echtem Feedback von Fischern und kleinen kommerziellen Betreibern verfeinert. Diese Rückkopplungsschleife – bauen, testen, anhören, verbessern – bleibt heute der Kern unserer Ingenieurphilosophie.
    - Bis 2015 hatte sich die Nachricht über Weihai hinaus verbreitet. Paddler und Wassersportgeschäfte in ganz Asien begannen, Bretter anzufragen. Was als lokaler Workshop begann, entwickelte sich zu einer globalen Marke.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Frühe Produktionswerkstatt und Fertigung
content_growth:
  tagline: Wachstum & Innovation
  title: Von der Werkstatt zu einer 12.000 m² großen Anlage
  subtitle: Kontinuierliche Investitionen in Personal, Ausrüstung und Prozesse haben Paddle Board Overstock sich in eine moderne maritime Produktionsstätte verwandelt.
  paragraphs:
    - Mit steigender Nachfrage wuchs auch unsere Anlage. Wir bauten uns von einer kleinen Werkstatt auf eine 12.000 m² große Fabrik mit eigenen Produktionslinien für SUP Bretter, Zubehör und Sicherheitsausrüstung aus.
    - Wir investierten in CNC Schneidmaschinen, Hochfrequenzschweißgeräte, Dropstitch-Produktionslinien und umfassende Prüfanlagen – was uns ermöglichte, jeden Aspekt der Produktionsqualität zu kontrollieren.
    - Heute besteht unser Team von 200 bis 300 Personen aus Schiffsingenieuren, Materialwissenschaftlern, Qualitätskontrollspezialisten und erfahrenen Handwerkern – viele von ihnen sind Paddle Board Overstock seit den Anfängen dabei.
founder:
  tagline: Lernen Sie den Gründer kennen
  title: Gebaut von einem Wassermann
  subtitle: Gründer David Chen vereint Fertigungsexpertise und eine lebenslange Leidenschaft für Wassersport – eine Kombination, die die Paddle Board Overstock Herangehensweise an die Produktentwicklung prägt.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Gründer von Paddle Board Overstock
  story:
    - David Chen wuchs an der Küste von Weihai auf, wo das Meer kein Urlaubsziel, sondern eine Lebensweise war. Er verbrachte seine Jugend mit Paddeln, Segeln und Angeln im Gelben Meer – Erfahrungen, die ihm ein intuitives Verständnis dafür gaben, was Paddleboards ertragen müssen.
    - Vor seiner Gründung Paddle Board Overstock verbrachte David ein Jahrzehnt in der Schiffsfertigung und arbeitete in den Bereichen Produktion, Qualität und internationalen Handel. Er leitete Produktions- und Qualitätsprogramme für europäische und nordamerikanische Märkte und lernte die Erwartungen globaler Paddler aus erster Hand kennen.
    - '2012 gründete er Paddle Board Overstock mit einer einfachen Mission: aufblasbare Paddleboards zu bauen, denen er seine eigene Familie auf dem Wasser anvertrauen würde. Dieser persönliche Standard – würde ich das verwenden? – bleibt der endgültige Test für jedes Produkt, das die Fabrik verlässt.'
    - Heute leitet David die Produktstrategie und leitet das F&E-Team, überprüft persönlich neue Entwürfe und testet Prototypen auf den Gewässern vor Weihai. Er ist überzeugt, dass großartige Produkte aus dem Verständnis sowohl der Technik als auch der Erfahrung entstehen.
philosophy:
  tagline: Markenphilosophie
  title: Ingenieursfreiheit auf dem Wasser
  body: Freiheit auf dem Wasser bedeutet nicht nur Bewegung. Sie steht dafür, neue Orte zu entdecken, Outdoor-Erlebnisse zu schaffen, Menschen mit der Natur zu verbinden und professionelle Missionen zu ermöglichen. Ingenieurwesen macht diese Freiheit möglich.
  pillars:
    - title: Zuverlässigkeit an erster Stelle
      body: Wasserumgebungen erfordern Vertrauen.Paddle Board Overstock Produkte sind auf Stabilität, Haltbarkeit, Sicherheit und konstante Leistung ausgelegt.
    - title: Menschzentriertes Design
      body: Produkte sollten den Menschen dienen, nicht der Technologie. Jede Designentscheidung beginnt damit, zu verstehen, wie Menschen ihre Boards nutzen, wo sie erkunden und welche Herausforderungen sie begegnen.
    - title: Zugängliche Erkundung
      body: Wasser sollte nicht nur Experten gehören.Paddle Board Overstock Es wird Ausrüstung entwickelt, die es mehr Menschen ermöglicht, Flüsse, Seen, Ozeane und Küstenumgebungen sicher zu erleben.
    - title: Kontinuierliche Innovation
      body: Innovation bedeutet nicht nur, neue Produkte zu schaffen. Es geht darum, jedes Detail zu verbessern — Materialien, Strukturen, Fertigung und Benutzererfahrung.
engineeringDna:
  tagline: DNA-Ingenieurwesen
  title: Wie Paddle Board Overstock Produkte erstellt
  areas:
    - title: Materialwissenschaft
      body: Paddle Board Overstock konzentriert sich darauf, geeignete Materialien für verschiedene Meeresumgebungen auszuwählen. Wichtige Überlegungen umfassen Abriebfestigkeit, UV-Beständigkeit, Druckstabilität und langfristige Haltbarkeit.
      items:
        - Abriebfestigkeit
        - UV-Beständigkeit
        - Druckstabilität
        - Langzeitbeständigkeit
    - title: Bauingenieurwesen
      body: Aufblasbare Paddleboards erfordern ein präzises Gleichgewicht zwischen Steifigkeit, Gewicht, Tragbarkeit und Stabilität. Paddle Board Overstock Ingenieurwesen konzentriert sich darauf, diese Faktoren durch drop-stitch Kerntechnologie und fortschrittliche Nahtkonstruktion zu optimieren.
      items:
        - Steifigkeit
        - Gewichtsoptimierung
        - Portabilität
        - Stabilität
    - title: Fertigung Präzision
      body: 'Jedes Produkt durchläuft kontrollierte Prozesse: Materialvorbereitung, Präzisionsschneiden, Schweißen und Verkleben, Montage, Qualitätsprüfung und Leistungsüberprüfung.'
      items:
        - Materialvorbereitung
        - Präzisionsschneiden
        - Schweißen und Zusammenkleben
        - Montage & Qualitätskontrolle
    - title: Benutzerszenario-Engineering
      body: Produkte werden rund um reale Paddelanwendungen entwickelt – Freizeit, Abenteuer, Familie und Touring – und stellen sicher, dass jedes Design die spezifischen Anforderungen seiner vorgesehenen Umgebung erfüllt.
      items:
        - Freizeit
        - Abenteuer
        - Familie
        - Touring
