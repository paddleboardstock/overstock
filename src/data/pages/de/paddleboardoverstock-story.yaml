timeline:
  - year: '2012'
    title: 'Grundstein der Marinefertigung'
    body: 'Paddle Board Overstock begann als spezialisierte Werkstatt für aufblasbare Wasserfahrzeuge in Qingdao, China, mit dem Fokus auf handwerkliche Meeresqualität und Schlauchbootfertigung. Der frühe Schwerpunkt lag auf dem Bau zuverlässiger aufblasbarer Produkte durch praktische Ingenieurserfahrung und Fertigungsdisziplin.'
  - year: '2015'
    title: 'Erster Export & CE-Zertifizierung'
    body: 'Erste Exportaufträge erreichten Japan und Korea. Die CE-Zertifizierung wurde für Kernproduktlinien erreicht, was Paddle Board Overstocks Eintritt in internationale Märkte markierte. Das Unternehmen begann, kommerzielle und private Nutzer über China hinaus zu bedienen.'
  - year: '2018'
    title: 'Werkserweiterung'
    body: 'Umzug in eine 12.000 m² Produktionsanlage. Hinzugefügt wurden HF-Schweißlinien und Drop-Stitch-Produktionskapazitäten, was eine größere Fertigung und verbesserte Qualitätskontrollsysteme ermöglichte.'
  - year: '2020'
    title: 'Gründung des F&E-Zentrums'
    body: 'Eröffnung eines eigenen F&E-Zentrums mit PVC-Stofflabor, hydrodynamischem Testbecken und CAD/FEA-Simulationsstudio. Die Produktentwicklung konzentrierte sich auf Leichtbauweise, verbesserte Haltbarkeit und benutzerzentriertes Design.'
  - year: '2022'
    title: 'Zertifizierung & Globales Wachstum'
    body: 'Erlangung der ISO 9001-Zertifizierung. Erweiterung auf 14 F&E-Ingenieure und 200+ Mitarbeiter. Produkte erreichten Kunden in Europa, Amerika und dem asiatisch-pazifischen Raum durch Händler- und OEM-Partnerschaften.'
  - year: '2024'
    title: 'Innovations- & Designstudio'
    body: 'Einführung eines Full-Service-Design- und Innovationsstudios für kundenspezifische ODM-Projekte, vom Konzept bis zur Produktion. Stärkung professioneller maritimer Anwendungen einschließlich Rettungs-, Gewerbe- und Regierungsausschreibungen.'
  - year: '2026'
    title: 'Die Zukunft der Wassererkundung gestalten'
    body: 'Heute entwickelt Paddle Board Overstock weiterhin Schlauchboote, SUP-Systeme und maßgeschneiderte maritimen Lösungen — und verbindet Menschen und Organisationen mit den Gewässern der Welt. 50+ Länder beliefert, 15.000 Einheiten Jahreskapazität.'

content_founding:
  tagline: Der Anfang
  title: 'An der Waterkant geboren'
  subtitle: 'Paddle Board Overstock startete in einer Küstenwerkstatt in Qingdao mit einem Boot und einer Vision: aufblasbare Wasserfahrzeuge zu bauen, die echten Meeresbedingungen standhalten.'
  paragraphs:
    - '2012 erkannten unsere Gründer eine Marktlücke — die meisten Schlauchboote waren entweder erschwinglich aber unzuverlässig oder hochwertig aber unerschwinglich teuer. Sie glaubten, dass es Raum für einen Hersteller gab, der sowohl Qualität als auch Preiswert liefert.'
    - 'Der erste Rumpf wurde von Hand gebaut, in heimischen Gewässern getestet und auf Basis echter Rückmeldungen von Fischern und kleinen gewerblichen Betreibern verfeinert. Diese Feedbackschleife — bauen, testen, zuhören, verbessern — bleibt bis heute der Kern unserer Ingenieursphilosophie.'
    - 'Bis 2015 hatte sich die Nachricht über Qingdao hinaus verbreitet. Internationale Händler begannen, Muster anzufordern. Was als lokale Werkstatt begann, wurde zu einem globalen Lieferanten.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock frühe Produktionswerkstatt und Fertigung

content_growth:
  tagline: Wachstum & Innovation
  title: 'Von der Werkstatt zur 12.000 m² Anlage'
  subtitle: 'Kontinuierliche Investitionen in Menschen, Ausrüstung und Prozesse haben Paddle Board Overstock in eine moderne marine Fertigungsanlage verwandelt.'
  paragraphs:
    - 'Mit der steigenden Nachfrage wuchs auch unsere Anlage. Wir erweiterten uns von einer kleinen Werkstatt auf eine 12.000 m² Fabrik mit eigenen Produktionslinien für RIB-Boote, Schlauchboote, SUP-Boards und Zubehör.'
    - 'Wir investierten in CNC-Schneidemaschinen, Hochfrequenzschweißgeräte, Drop-Stitch-Produktionslinien und umfassende Prüfvorrichtungen — so können wir jeden Aspekt der Produktionsqualität kontrollieren.'
    - 'Heute umfasst unser Team von 200-300 Mitarbeitern Schiffsingenieure, Materialwissenschaftler, Qualitätskontrolleure und erfahrene Handwerker — viele von ihnen sind seit den Anfangstagen bei Paddle Board Overstock.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock moderne Produktionsanlage

founder:
  tagline: Der Gründer
  title: Gebaut von einem Wassermenschen
  subtitle: >-
    Gründer David Chen verbindet Fertigungsexpertise mit einer lebenslangen Leidenschaft für den
    Wassersport — eine Kombination, die prägt, wie Paddle Board Overstock Produkte entwickelt.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Gründer von Paddle Board Overstock
  story:
    - >-
      David Chen wuchs an der Küste von Qingdao auf, wo das Meer kein Urlaubsziel war, sondern eine
      Lebensweise. Er verbrachte seine Jugend mit Kajakfahren, Segeln und Angeln im Gelben Meer —
      Erfahrungen, die ihm ein intuitives Verständnis dafür gaben, was Wasserfahrzeuge aushalten
      müssen.
    - >-
      Vor der Gründung von Paddle Board Overstock verbrachte David ein Jahrzehnt in der Maritimfertigung und
      arbeitete in Fertigung, Qualitätssicherung und internationalem Handel. Er leitete OEM-Programme
      für europäische und nordamerikanische Marken und lernte die Standards und Erwartungen globaler
      Märkte aus erster Hand.
    - >-
      2012 gründete er Paddle Board Overstock mit einer einfachen Mission — aufblasbare Wasserfahrzeuge zu bauen,
      denen er seine eigene Familie auf dem Wasser anvertrauen würde. Dieser persönliche Maßstab
      (Würde ich das selbst nutzen?) bleibt der letzte Test für jedes Produkt, das das Werk verlässt.
    - >-
      Heute leitet David die Produktstrategie und verantwortet das F&E-Team, prüft persönlich neue
      Konstruktionen und testet Prototypen auf den Gewässern vor Qingdao. Er ist überzeugt, dass
      große Produkte entstehen, wenn man sowohl das Engineering als auch das Erlebnis versteht.

philosophy:
  tagline: 'Markenphilosophie'
  title: 'Engineering Freiheit auf dem Wasser'
  body: 'Freiheit auf dem Wasser bedeutet nicht nur Fortbewegung. Sie repräsentiert das Entdecken neuer Orte, das Schaffen von Outdoor-Erlebnissen, die Verbindung von Menschen mit der Natur und die Ermöglichung professioneller Missionen. Engineering macht diese Freiheit möglich.'
  pillars:
    - title: 'Zuverlässigkeit an erster Stelle'
      body: 'Wasserumgebungen erfordern Vertrauen. Paddle Board Overstock-Produkte sind auf Stabilität, Langlebigkeit, Sicherheit und konstante Leistung ausgelegt.'
    - title: 'Menschzentriertes Design'
      body: 'Produkte sollten Menschen dienen, nicht der Technologie. Jede Designentscheidung beginnt mit dem Verständnis, wie Menschen Wasserfahrzeuge nutzen, wo sie erkunden und welchen Herausforderungen sie gegenüberstehen.'
    - title: 'Zugängliche Erkundung'
      body: 'Wasser sollte nicht nur Experten vorbehalten sein. Paddle Board Overstock entwickelt Ausrüstung, die mehr Menschen ermöglicht, sicher Flüsse, Seen, Ozeane und Küstenumgebungen zu erleben.'
    - title: 'Kontinuierliche Innovation'
      body: 'Innovation bedeutet nicht nur, neue Produkte zu schaffen. Es geht darum, jedes Detail zu verbessern — Materialien, Strukturen, Fertigung und Benutzererfahrung.'

engineeringDna:
  tagline: 'Engineering-DNA'
  title: 'Wie Paddle Board Overstock Produkte entwickelt'
  areas:
    - title: 'Materialwissenschaft'
      body: 'Paddle Board Overstock konzentriert sich auf die Auswahl geeigneter Materialien für verschiedene Meeresumgebungen. Zu den wichtigsten Überlegungen gehören Abriebfestigkeit, UV-Beständigkeit, Druckstabilität und Langzeitbeständigkeit.'
      items: ['Abriebfestigkeit', 'UV-Beständigkeit', 'Druckstabilität', 'Langzeitbeständigkeit']
    - title: 'Strukturtechnik'
      body: 'Aufblasbare Wasserfahrzeuge erfordern ein präzises Gleichgewicht zwischen Steifigkeit, Gewicht, Tragbarkeit und Stabilität. Paddle Board Overstock-Ingenieurwesen konzentriert sich auf die Optimierung dieser Faktoren durch Drop-Stitch-Kerntechnologie und fortschrittliche Nahtkonstruktion.'
      items: ['Steifigkeit', 'Gewichtsoptimierung', 'Tragbarkeit', 'Stabilität']
    - title: 'Fertigungspräzision'
      body: 'Jedes Produkt durchläuft kontrollierte Prozesse: Materialvorbereitung, Präzisionsschneiden, Schweißen und Fügen, Montage, Qualitätsprüfung und Leistungsverifikation.'
      items: ['Materialvorbereitung', 'Präzisionsschneiden', 'Schweißen & Fügen', 'Montage & QC']
    - title: 'Anwendungsszenario-Engineering'
      body: 'Produkte werden für reale Anwendungen entwickelt — Freizeit, Abenteuer und professionelle Nutzung — und stellen sicher, dass jedes Design den spezifischen Anforderungen seiner vorgesehenen Umgebung entspricht.'
      items: ['Freizeit', 'Abenteuer', 'Professionell', 'Gewerblich']

