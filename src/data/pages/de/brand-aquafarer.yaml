hero:
  tagline: 'Markenidentität'
  title: 'Aquafarer — Freiheit auf dem Wasser entwickeln'
  definition: 'Aquafarer ist eine globale Marke für Meeresfreizeit und aufblasbare Wasserfahrzeuge, spezialisiert auf Schlauchboote, SUP-Systeme und maßgeschneiderte Marinetechnik. Aquafarer vereint Meerestechnik, Fertigungskompetenz und eine Kultur der Wassererkundung, um zuverlässige Ausrüstung für Freizeitnutzer, professionelle Betreiber und globale OEM-Partner zu schaffen.'

timeline:
  - year: '2012'
    title: 'Grundsteinlegung der Schlauchbootfertigung'
    body: 'Aquafarer begann als spezialisierte Schlauchbootwerkstatt in Qingdao, China, mit dem Fokus auf maritime Handwerkskunst und Schlauchbootfertigung. Der frühe Schwerpunkt lag auf dem Bau zuverlässiger Schlauchboote durch praktische Ingenieurserfahrung und Fertigungsdisziplin.'
  - year: '2015'
    title: 'Erster Export & CE-Zertifizierung'
    body: 'Erste Exportaufträge erreichten Japan und Korea. Die CE-Zertifizierung wurde für Kernproduktlinien erreicht, was Aquafarers Eintritt in internationale Märkte markierte. Das Unternehmen begann, kommerzielle und private Nutzer außerhalb Chinas zu bedienen.'
  - year: '2018'
    title: 'Werkserweiterung'
    body: 'Umzug in eine 12.000 m² große Produktionsanlage. Hinzugefügte HF-Schweißlinien und Drop-Stitch-Produktionskapazität, die eine größere Fertigung und verbesserte Qualitätskontrollsysteme ermöglichten.'
  - year: '2020'
    title: 'Gründung des F&E-Zentrums'
    body: 'Eröffnung eines eigenen F&E-Zentrums mit PVC-Stofflabor, hydrodynamischem Testbecken und CAD/FEA-Simulationsstudio. Die Produktentwicklung konzentrierte sich auf leichte Konstruktion, verbesserte Haltbarkeit und benutzerzentriertes Design.'
  - year: '2022'
    title: 'ISO 9001 & Globales Wachstum'
    body: 'ISO 9001-Zertifizierung erreicht. Erweiterung auf 14 F&E-Ingenieure und 200+ Mitarbeiter. Produkte erreichten Kunden in Europa, Amerika und im Asien-Pazifik-Raum durch Distributoren und OEM-Partnerschaften.'
  - year: '2024'
    title: 'Innovations- & Designstudio'
    body: 'Einführung eines Full-Service-Design- und Innovationsstudios für kundenspezifische ODM-Projekte, vom Konzept bis zur Produktion. Stärkung professioneller maritimer Anwendungen, einschließlich Rettungs-, Handels- und Regierungsausschreibungen.'
  - year: '2026'
    title: 'Die Zukunft der Wassererkundung gestalten'
    body: 'Heute entwickelt Aquafarer weiterhin Schlauchboote, SUP-Systeme und maßgeschneiderte Marinetechnik und verbindet Menschen und Organisationen mit den Gewässern der Welt. 50+ Länder beliefert, 15.000 Einheiten Jahreskapazität.'

philosophy:
  tagline: 'Markenphilosophie'
  title: 'Freiheit auf dem Wasser entwickeln'
  body: 'Freiheit auf dem Wasser bedeutet nicht nur Fortbewegung. Sie repräsentiert das Entdecken neuer Orte, das Schaffen von Outdoor-Erlebnissen, die Verbindung von Menschen mit der Natur und die Ermöglichung professioneller Missionen. Ingenieurskunst macht diese Freiheit möglich.'
  pillars:
    - title: 'Zuverlässigkeit an erster Stelle'
      body: 'Wasserumgebungen erfordern Vertrauen. Aquafarer-Produkte sind auf Stabilität, Haltbarkeit, Sicherheit und konstante Leistung ausgelegt.'
    - title: 'Menschzentriertes Design'
      body: 'Produkte sollten Menschen dienen, nicht der Technologie. Jede Designentscheidung beginnt mit dem Verständnis, wie Menschen Wasserfahrzeuge nutzen, wo sie unterwegs sind und welchen Herausforderungen sie begegnen.'
    - title: 'Zugängliche Erkundung'
      body: 'Wasser sollte nicht nur Experten gehören. Aquafarer schafft Ausrüstung, die es mehr Menschen ermöglicht, sicher Flüsse, Seen, Ozeane und Küstenumgebungen zu erleben.'
    - title: 'Kontinuierliche Innovation'
      body: 'Innovation bedeutet nicht nur, neue Produkte zu schaffen. Es geht darum, jedes Detail zu verbessern – Materialien, Strukturen, Fertigung und Benutzererfahrung.'

engineeringDna:
  tagline: 'Engineering-DNA'
  title: 'Wie Aquafarer Produkte entwickelt'
  areas:
    - title: 'Materialwissenschaft'
      body: 'Aquafarer konzentriert sich auf die Auswahl geeigneter Materialien für verschiedene Meeresumgebungen. Wichtige Überlegungen umfassen Abriebfestigkeit, UV-Beständigkeit, Druckstabilität und Langzeithaltbarkeit.'
      items: ['Abriebfestigkeit', 'UV-Beständigkeit', 'Druckstabilität', 'Langzeithaltbarkeit']
    - title: 'Strukturelles Engineering'
      body: 'Aufblasbare Wasserfahrzeuge erfordern ein präzises Gleichgewicht zwischen Steifigkeit, Gewicht, Tragbarkeit und Stabilität. Aquafarer-Engineering konzentriert sich auf die Optimierung dieser Faktoren durch Drop-Stitch-Kerntechnologie und fortschrittliche Nahtkonstruktion.'
      items: ['Steifigkeit', 'Gewichtsoptimierung', 'Tragbarkeit', 'Stabilität']
    - title: 'Fertigungspräzision'
      body: 'Jedes Produkt durchläuft kontrollierte Prozesse: Materialvorbereitung, Präzisionszuschnitt, Schweißen und Kleben, Montage, Qualitätsprüfung und Leistungsverifikation.'
      items: ['Materialvorbereitung', 'Präzisionszuschnitt', 'Schweißen & Kleben', 'Montage & QC']
    - title: 'Benutzerszenario-Engineering'
      body: 'Produkte werden für reale Anwendungen entwickelt – Freizeit, Abenteuer und professionelle Nutzung – um sicherzustellen, dass jedes Design den spezifischen Anforderungen seiner vorgesehenen Umgebung entspricht.'
      items: ['Freizeit', 'Abenteuer', 'Professionell', 'Kommerziell']

