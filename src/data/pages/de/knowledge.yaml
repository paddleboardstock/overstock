hero:
  tagline: Wissensgraph
  title: Wassererforschungswissen
  subtitle: |
    Eine strukturierte Wissensdatenbank, die aufblasbare SUP-Technologie abdeckt,<br />
    Wassersicherheit, Bretttechnik und Abenteuerplanung.
  taglineSection: Entdecken. Lernen. Gehe mit Vertrauen.
clusters:
  tagline: Wissenscluster
  title: Nach Thema erkunden
  subtitle: Tiefgehende Einblicke in die Technologie, Sicherheit und Fähigkeiten hinter jedem Paddle Board Overstock-Produkt.
  items:
    - title: SUP Wissen
      description: Von der Auswahl Ihres ersten Boards bis zu fortgeschrittenen Touring-Techniken – alles über Stand-up-Paddeln.
      icon: tabler:lifebuoy
      topics:
        - Wie man sein erstes aufblasbares SUP auswählt
        - Beste SUP-Größe für Anfänger
        - Wie schwierig ist Stand-Up-Paddling?
        - Vergleich zwischen aufblasbarem und festem Board
        - SUP Sicherheitscheckliste
    - title: Plattentechnologie
      description: Technische Tiefenanalysen zu drop-stitch-Kernen, PVC-Laminaten, Schienen und Ventilen – wie aufblasbare SUPs konstruiert werden.
      icon: tabler:anchor
      topics:
        - Wie aufblasbare SUPs hergestellt werden
        - PVC Laminatschichten erklärt
        - Schienen- und Nahtkonstruktion
        - Drop-stitch Technologie tiefgehender Einblick
        - EVA Deck-Art erklärt
    - title: Sicherheitswissen
      description: Wesentliches Sicherheitswissen für jeden Paddler — von der PFD-Auswahl über Wetterbeobachtung bis hin zu Selbstrettungstechniken.
      icon: tabler:shield
      topics:
        - SUP Sicherheitscheckliste
        - Brauchst du eine Rettungsweste?
        - Sicherheitsleitfaden für das Paddeln im Ozean
        - Fluss- und Strömungssicherheit für Paddler
        - Bewusstsein für Wetter- und Wasserbedingungen
    - title: Technologie
      description: Die Technik hinter Paddle Board Overstock-Produkten – Materialien, Konstruktionsmethoden und Qualitätstests.
      icon: tabler:microscope
      topics:
        - Marine-Grade-PVC-Technologie
        - Drop-stitch-Kern erklärt
        - Warum PSI für aufblasbare SUPs wichtig ist
        - RF-Schweißen vs. Klebeverbindung
        - Qualitätstest auf jedem Board
    - title: Club- & Mietwissen
      description: Praktische Leitfäden zum Betrieb eines SUP-Programms – von Mietbetrieben bis zu Resort- und Clubflotten.
      icon: tabler:briefcase
      topics:
        - So starten Sie ein SUP Vermietungsunternehmen
        - Bau eines Resort-Wassersportzentrums
        - Dimensionierung der Paddle-Board-Flotte für Vereine
        - Aufblasbar vs. hart SUP für den gewerblichen Einsatz
        - Beste SUP-Boards für Mietflotten
        - Umsatzstrategien für Wassersport-Resorts
        - Leitfaden zur Wartung gewerblicher Geräte
