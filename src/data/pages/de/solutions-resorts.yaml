testimonial:
  content: Paddle Board Overstock hat unser gesamtes Strandaktivitätsprogramm über drei Resortanlagen hinweg entworfen und ausgestattet. 120 SUPs, Sicherheitsinfrastruktur und Mitarbeiterschulungen – alles in einer Lieferung. Die Teilnahme unserer Gäste an Wasseraktivitäten stieg in der ersten Saison um 60 %.
  name: Sophie Laurent
  title: Direktor für Gästeerlebnis, Azure Bay Resorts – Phuket, Thailand
content_segments:
  tagline: Resort-Profile
  title: Waterfront Hospitality Solutions<br />Nach Immobilientyp
  subtitle: Jedes Resortobjekt verfügt über ein einzigartiges Gästeprofil, einen einzigartigen Aktivitätsmix und einen eigenen Betriebsrhythmus – von Boutique-Öko-Lodges bis hin zu weitläufigen Luxusresorts am Strand. Wir entwerfen Wassersportprogramme, die der Objektklasse und den Erwartungen der Gäste entsprechen.
  items:
    - title: Luxusresorts direkt am Strand
      subtitle: VIP-Transfers, Wasseraktivitäten, erstklassiges Gästeerlebnis
      description: Hochwertige Strandimmobilien – Four Seasons, Aman und ähnliche Luxuskonzerne –, in denen Wassersport ein wichtiger Bestandteil der Gästeannehmlichkeiten ist und die Zufriedenheitswerte und Nebeneinnahmen steigert. Die Flotte muss erstklassig aussehen, Vielfalt für alle Altersgruppen und Leistungsniveaus bieten und sich nahtlos in die bestehenden Concierge- und Buchungssysteme des Resorts integrieren lassen. Die Erwartungen an den Gastauftritt sind extrem hoch – der Zustand und die Präsentation der Ausrüstung wirken sich direkt auf die 5-Sterne-Bewertungen aus.
      features:
        - Premium-gekennzeichnete Flotte von SUPs in den passenden Resortfarben
        - 'Gastgerechte Präsentation: passende Resortfarben, Logo-Branding, inszenierte Gerätepräsentation'
        - Signatur-Art-Serie-Boards für Premium-Gästeerlebnisse und Fotomomente
        - 'Integrierte Sicherheitsinfrastruktur: Bojenlinien, Rettungsschwimmerstationen, AED'
        - 'Einnahmenmanagement: dynamische Preismodelle, Upsell-Schulungen, Paketbündelung'
    - title: Private Inselresorts
      subtitle: Ruhige, selbstversorgende Wasseraktivitäten für Gäste
      description: 'Private Inselresorts befinden sich an abgelegenen Orten, wo die Logistik komplex ist und jede Lieferung zählt. Die Wasseraktivitäten der Gäste müssen autark sein: Ausrüstung, die kompakt gelagert, auf Abruf aufgeblasen werden kann, minimale Wartung erfordert und sich bei Ankunft der Gäste wunderschön präsentiert. Wir planen Flottenprogramme rund um Wasserflugzeug- und Seefrachtfenster, und unsere robuste Konstruktion hält die Ausrüstung über lange Saisons hinweg einsatzbereit, ohne Unterstützung vom Festland.'
      features:
        - Kompakte aufblasbare Flotte – Schiffe und Vorräte effizient auf abgelegenen Inseln
        - Gewerbliche PVC Bauweise für mehrjährige Gästenutzung
        - Einfache Wartung vor Ort mit mitgelieferten Reparatursets und Videoanleitung
        - Individuelle Resort-Branding, passend zur Inselästhetik
    - title: See- und Öko-Resorts
      subtitle: Naturintegrierte Gästeerlebnisse
      description: Seegebäude, Öko-Lodges und Naturschutzgebiete bieten ruhige, gefährdende Wasseraktivitäten, die die natürliche Umgebung ergänzen. Die Ausrüstung sollte, wenn möglich, nicht motorisiert sein, an begrenztem Platz leicht zu verstauen und leise genutzt werden, um das Atmosphärenerlebnis für alle Gäste zu bewahren.
      features:
        - Nicht-motorisierte SUP Flotte in naturinspirierter Kunstserie
        - Leise elektrische Pumpenaufblasstationen für den Einsatz von Gästen auf Abruf
        - Umweltfreundliche Materialien und Verpackungen im Einklang mit Nachhaltigkeitsbranding
        - Lagerregale und Organisationssysteme am Hafen umfassten
    - title: Strandclubs
      subtitle: Gästeunterhaltung und Uferatmosphäre
      description: Beach Clubs betreiben eine energiegeladene, visuell fokussierte Umgebung, in der die Ausrüstung Teil der Atmosphäre ist. Sie brauchen stilvolle Paddleboards für Gästeunterhaltung, SUP Miete für Strandaktivitäten und Ausrüstung, die genauso gut aussieht wie der Veranstaltungsort selbst. Die Flotte muss einfach zu bedienen sein, dem täglichen Gebrauch durch Gäste mit unterschiedlichen Fähigkeiten standhalten und während der Hauptverkehrszeiten schnell eingesetzt werden können.
      features:
        - Signature-Kunstserien SUPs , die gleichzeitig als Dekoration für den Veranstaltungsort dienen
        - SUP Mietwagenfähige Flotte für Gästeunterhaltung
        - Individuelle Farbe und Branding passen zur visuellen Identität des Beach Clubs
        - Schnellstart- und Bergungssysteme für Betrieb mit hoher Fluktuation
        - UV-widerstandsfähige Konstruktion für tägliche Salzwasserexposition
    - title: Private Mitgliederclubs und Yachtclubs
      subtitle: Mitglieder-Wassersportarten und exklusive Paddelprogramme
      description: Private Clubs, in denen Wassersportarten eher ein Vorteil für die Mitglieder als für Einnahmen sind. Die Ausrüstung muss höhere ästhetische Standards erfüllen, für Mitglieder auf Abruf verfügbar sein und nur minimale Aufsicht des Personals erfordern. Yachtclubs der Marina nutzen SUP Markenflotten für die Freizeitaktivitäten rund um den Hafen. Lagerung und Wartung sollten für die Mitglieder unsichtbar sein.
      features:
        - SUP Premium-Markenflotten für Mitglieder-Wassersportarten
        - 'Premiumausstattung EVA : Decks, individuelle Mitgliederfarben, gebrandete Polsterung'
        - Selbstbedienungs-Checkout-System für Mitgliederzugang ohne Personal
        - Lager- und jährliches Auffrischungsprogramm außerhalb der Saison
    - title: Abenteuer- und aktivitätsorientierte Hotels
      subtitle: Geführte Touren, SUP-Yoga, Schnorchelausflüge, Gruppenaktivitäten
      description: Unterkünfte positionieren sich als Abenteuerziele und bieten geführte Touren, SUP-Yoga, Paddeltouren bei Sonnenuntergang, Schnorchelausflüge und Gruppenaktivitäten an. Die Flotte muss sowohl kostenlose Miet- als auch geführte Programmmodelle unterstützen, mit Ausrüstung, die nahtlos zwischen der Eigennutzung durch Gäste und von Lehrern geführten Touren wechselt. Diese Unterkünfte benötigen eine langlebige Ausrüstung für eine hohe Wechselfrequenz und eine einfache Reinigung zwischen den Gästegruppen.
      features:
        - Vielseitige gemischte Flotte zur Unterstützung von Miet-+-Führungsmodellen
        - Extra-stabile SUP-Plattformen für Gruppenaktivitäten
        - 'Führerausrüstung: Instruktor-Boards, trockene Boxen, wasserdichte Kommunikationsmittel'
        - 'Saisonale Ausrüstungsrotation: Sommerflotte → Winterlagerprogramm'
        - Langlebige Konstruktion, geeignet für den täglichen Gästebetrieb mit minimalem Wartungsaufwand
