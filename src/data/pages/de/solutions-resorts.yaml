testimonial:
  content: Paddle Board Overstock hat unser gesamtes Strandaktivitätsprogramm in drei Resortanlagen entworfen und ausgestattet. 80 SUPs, 40 Kajaks, Sicherheitsinfrastruktur und Personalschulung – alles in einer Lieferung geliefert. Die Teilnahme unserer Gäste an Wasseraktivitäten stieg in der ersten Saison um 60 %.
  name: Sophie Laurent
  title: Direktor für Gästeerlebnis, Azure Bay Resorts – Phuket, Thailand
content_segments:
  tagline: Resort-Profile
  title: Waterfront Hospitality-Lösungen<br />Nach Immobilientyp
  subtitle: Jedes Resortobjekt verfügt über ein einzigartiges Gästeprofil, einen einzigartigen Aktivitätsmix und einen eigenen Betriebsrhythmus – von Boutique-Öko-Lodges bis hin zu weitläufigen Luxusresorts am Strand. Wir entwerfen Wassersportprogramme, die der Objektklasse und den Erwartungen der Gäste entsprechen.
  items:
    - title: Luxusresorts direkt am Strand
      subtitle: VIP-Transfers, Wasseraktivitäten, erstklassiges Gästeerlebnis
      description: Hochwertige Strandimmobilien – Four Seasons, Aman und ähnliche Luxuskonzerne –, in denen Wassersport ein wichtiger Bestandteil der Gästeannehmlichkeiten ist und die Zufriedenheitswerte und Nebeneinnahmen steigert. Die Flotte muss erstklassig aussehen, Vielfalt für alle Altersgruppen und Leistungsniveaus bieten und sich nahtlos in die bestehenden Concierge- und Buchungssysteme des Resorts integrieren lassen. Die Erwartungen an den Gastauftritt sind extrem hoch – der Zustand und die Präsentation der Ausrüstung wirken sich direkt auf die 5-Sterne-Bewertungen aus.
      features:
        - 'Premium-Markenflotte: SUPs, Kajaks, Tretboote und kleine Tender-RIBs'
        - 'Gästefertige Präsentation: Farben passend zum Resort, Logo-Branding, inszenierte Ausrüstungspräsentation'
        - Kleiner Luxus-RIB für VIP-Gästetransfers mit individueller Polsterung und abgestimmten Farben
        - 'Integrierte Sicherheitsinfrastruktur: Bojenleinen, Rettungsschwimmerstände, AED'
        - 'Umsatzmanagement: Vorlagen für dynamische Preisgestaltung, Upsell-Schulungen, Paketbündelung'
    - title: Private Inselresorts
      subtitle: Gästetransport bei jedem Wetter – keine Ausfallzeiten, absolute Zuverlässigkeit
      description: Private Inselresorts liegen an abgelegenen Orten, wo das Boot die einzige Verbindung zum Festland darstellt. Tägliche Gästetransfers, Versorgungsfahrten und medizinische Notfallevakuierungen hängen von einem einzigen Schiff ab – jede Ausfallzeit wirkt sich direkt auf das Gästeerlebnis und den Resortbetrieb aus. Diese Betreiber benötigen ein Boot, das bei allen Wetterbedingungen zuverlässig läuft, nur minimale Wartung erfordert und über Backup-Systeme für geschäftskritische Zuverlässigkeit verfügt. Auch bei der Ankunft der Gäste auf der Insel muss sich das Boot schön präsentieren.
      features:
        - Allwetter-RIB-Konfiguration mit vollständigem Wetterschutz und verstärkten Schläuchen
        - Doppelmotorisierung oder Ersatzmotor für einen Betrieb ohne Ausfallzeiten
        - Hypalon-Konstruktion in gewerblicher Qualität für eine Lebensdauer von 5-8 Jahren im Einsatz an abgelegenen Standorten
        - Wartungsfreundliches Design mit gut zugänglichen Komponenten für die Wartung vor Ort
        - Individuelles Resort-Branding und Premium-Polsterung, abgestimmt auf die Inselsästhetik
    - title: See- und Öko-Resorts
      subtitle: Naturintegrierte Gästeerlebnisse
      description: Anwesen am Seeufer, Öko-Lodges und Rückzugsorte in der Natur bieten ruhige, schonende Wasseraktivitäten, die die natürliche Umgebung ergänzen. Die Ausrüstung sollte nach Möglichkeit nicht motorisiert sein, sich leicht in Bootshäusern mit begrenztem Platzangebot verstauen lassen und leise im Betrieb sein, um allen Gästen ein angenehmes Raumerlebnis zu bieten.
      features:
        - 'Nicht motorisierte Flotte: SUPs, Kajaks, Kanus und Tretboote'
        - Leise Füllstationen mit Elektropumpe für die bedarfsgerechte Nutzung durch Gäste
        - Umweltfreundliche Materialien und Verpackungen, abgestimmt auf Ihr Nachhaltigkeitsbranding
        - Regalsysteme und Bootshaus-Organisationssysteme inklusive
    - title: Strandclubs
      subtitle: Gästetransfers, Unterhaltung, kleine Luxus-RIBs
      description: Strandclubs betreiben eine energiegeladene, visuell fokussierte Umgebung, in der die Ausrüstung Teil der Atmosphäre ist. Sie benötigen kleine Luxus-RIBs für den Gästetransfer von nahegelegenen Hotels oder Anlegestellen sowie Wasserspielzeug für die Gästeunterhaltung – Jet-Ski-Schlepper, aufblasbare Rutschen und Paddle-Boards. Die Flotte muss stilvoll aussehen, einfach zu bedienen sein und dem täglichen Gebrauch durch Gäste mit unterschiedlichen Fähigkeiten standhalten. Speicherung und schnelle Bereitstellung sind während der Spitzenzeiten von entscheidender Bedeutung.
      features:
        - Kompakter Luxus-RIB (3,3-4,3 m) für Gästetransfers und Tenderdienst
        - 'Wasserspielzeug: aufblasbare Schleppbojen, SUP-Boards, Kajaks zur Unterhaltung der Gäste'
        - Individuelle Farben und Branding, passend zur visuellen Identität des Strandclubs
        - Systeme für schnelles Slippen und Bergen für den Betrieb mit hohem Durchsatz
        - Robuste Hypalon-Konstruktion für tägliche Salzwasser- und UV-Belastung
    - title: Private Mitgliederclubs und Yachtclubs
      subtitle: Hafentransport, Mitgliederausschreibungen, exklusive Wassersportarten
      description: Private Clubs, in denen Wassersport und Bootstransport eher ein Vorteil für die Mitglieder als ein Umsatztreiber sind. Die Ausrüstung muss höheren ästhetischen Ansprüchen genügen, den Mitgliedern auf Abruf zur Verfügung stehen und nur minimale Aufsicht durch das Personal erfordern. Marina-Yachtclubs benötigen insbesondere Ausschreibungen für den Hafentransport – den Transport von Mitgliedern zwischen Dock, Liegeplatz und Ufer. Lagerung und Wartung sollten für die Mitglieder unsichtbar sein.
      features:
        - Hochwertige Tender-RIBs für den Hafentransport und den Mitgliedstransferservice
        - 'Premium-Ausrüstung: EVA-Decks, individuelle Mitgliederfarben, Marken-Polsterung'
        - Self-Check-out-System für den Mitgliederzugang ohne Personal
        - Lagerung außerhalb der Saison und jährliches Auffrischungsprogramm
    - title: Abenteuer- und aktivitätsorientierte Hotels
      subtitle: Geführte Touren, SUP-Yoga, Schnorchelausflüge, Gruppenaktivitäten
      description: Unterkünfte positionieren sich als Abenteuerziele und bieten geführte Touren, SUP-Yoga, Paddeltouren bei Sonnenuntergang, Schnorchelausflüge und Gruppenaktivitäten an. Die Flotte muss sowohl kostenlose Miet- als auch geführte Programmmodelle unterstützen, mit Ausrüstung, die nahtlos zwischen der Eigennutzung durch Gäste und von Lehrern geführten Touren wechselt. Diese Unterkünfte benötigen eine langlebige Ausrüstung für eine hohe Wechselfrequenz und eine einfache Reinigung zwischen den Gästegruppen.
      features:
        - Vielseitige gemischte Flotte, die Modelle aus Vermietung + geführten Touren unterstützt
        - Tandem-Kajaks und besonders stabile SUP-Plattformen für Gruppenaktivitäten
        - 'Ausrüstung für Guides: Instruktor-Boards, Trockenboxen, wasserdichte Kommunikationsmittel'
        - 'Saisonale Ausrüstungsrotation: Sommerflotte → Winterlagerungsprogramm'
        - Robuste Konstruktion, ausgelegt für die tägliche Nutzung durch Gäste mit minimalem Wartungsaufwand
