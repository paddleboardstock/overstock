content_system:
  tagline: Übersicht über das QS-System
  title: Integrierte Qualität<br />Kontrollrahmen
  subtitle: Unser QS-System arbeitet unabhängig von der Produktion und berichtet direkt an das Management. Keine Charge wird versendet, ohne dass eine unterzeichnete Qualitätsfreigabe aus dem Qualitätslabor vorliegt.
  items:
    - title: Unabhängiges Qualitätslabor
      description: Unser Qualitätslabor arbeitet als eigenständige Funktion getrennt von der Produktion. QC-Inspektoren berichten an den Qualitätsmanager, nicht an den Produktionsleiter. Diese organisatorische Unabhängigkeit stellt sicher, dass Qualitätsentscheidungen objektiv getroffen werden – Produktionsfristen haben niemals Vorrang vor Qualitätsanforderungen.
      features:
        - Berichtet direkt an die Geschäftsleitung, unabhängig von der Produktion
        - Berechtigt, die Produktion bei Qualitätsproblemen zu stoppen
        - 12 engagierte QC-Inspektoren in allen Phasen
        - Alle Prüfgeräte werden jährlich kalibriert
    - title: Chargenrückverfolgbarkeit
      description: Jeder Rohstoffcharge wird in unserem ERP-System eine eindeutige Losnummer zugewiesen. Vom Materialeingang über die Produktion bis zum fertigen Produkt verweist die Stückliste jeder Platine auf die ursprünglichen Lieferantenchargen. Dies ermöglicht eine vollständige Rückverfolgbarkeit für alle Qualitäts- oder Compliance-Anfragen.
      features:
        - Chargenverfolgung auf ERP-Basis vom Material bis zum Fertigprodukt
        - Physische Chargenetiketten auf jedem Arbeitsauftrag
        - 100% Materialabdeckung — PVC, drop-stitch, EVA Schaum, Hardware, Klebstoffe
        - Aufzeichnungen werden 10 Jahre lang aufbewahrt
    - title: Qualitätsmanagement
      description: Unsere QS-Verfahren folgen dokumentierten internen Protokollen. Testergebnisse werden aufgezeichnet, sind nachvollziehbar und werden von unserem unabhängigen Qualitätslabor überprüft. 99,3 % fehlerfreie Rate bei den Lieferungen der letzten 12 Monate.
      features:
        - Dokumentierte interne QC-Protokolle, jährlich überprüft
        - 99,3 % fehlerfreie Quote bei den Lieferungen der letzten 12 Monate
        - Null Toleranz gegenüber sicherheitskritischen Defekten
        - Aufzeichnungen werden 10 Jahre lang aufbewahrt
content_inspection:
  tagline: Inspektionsphasen
  title: Sechsstufige<br />Inspektionsprozess
  subtitle: Jedes Produkt durchläuft 6 Inspektionsphasen mit dokumentierten Qualitätskontrollpunkten. Fehler werden frühzeitig erkannt, Korrekturmaßnahmen sind sofort und jede Charge ist vollständig nachverfolgbar.
  stages:
    - stage: '1'
      title: Eingehende Materialinspektion
      description: Alle eingehenden Materialien werden nach Chargen-/Chargennummer protokolliert und bis zur Qualitätskontrolle in Quarantäne gestellt.PVC Stoffrollen werden auf Zugfestigkeit, Reißfestigkeit und Dicke getestet.Drop-stitch Kerne, Ventile, Klebstoffe und Beschläge werden visuell inspiziert und anhand der Vorgaben gemessen.
      checks: Zugfestigkeit, Reißfestigkeit, Dickenmessgerät, Klebstoffviskosität, Visuelle Fehlerprüfung
      threshold: 100 % der geprüften Chargen. Ablehnen, wenn die Zugfestigkeit < 90 % der Spezifikation, die Reißfestigkeit < Spezifikationsminimum oder irgendein sichtbarer Mangel vorhanden ist
    - stage: '2'
      title: In-Process QC — Schneiden und Vorbereitung
      description: CNC-geschnittene Platten werden alle 20. Platten maßlich mit CAD-Quelldateien überprüft. Die Kantenqualität wird auf Ausfransen, ungleichmäßige Schnitte oder Maßverschiebung überprüft. Die Plattenanzahl wird für jede Produktionscharge anhand des Stückstücks überprüft, bevor Materialien zum Schweißen übergehen.
      checks: Dimensionsprüfung gegen CAD-DXF-Dateien, Kantenqualitätsprüfung, Überprüfung der Paneelanzahl
      threshold: Toleranz ±0,5 mm. Charge verwerfen, wenn >2 % außerhalb der Toleranz liegen
    - stage: '3'
      title: In-Process Qualitätskontrolle – Schweißen und Binden
      description: Während der Produktion wird die Schweißqualität kontinuierlich überwacht. Alle 50 Einheiten werden Peel-Tests an Proben durchgeführt. Die Schweißbreite wird gemäß den Vorgaben gemessen. Heißluft-Temperaturprotokolle werden auf Konsistenz überprüft. Jede Naht wird unter Gegenlicht visuell auf Kanalisation oder Hohlräume inspiziert.
      checks: Peel-Test alle 50 Einheiten, Moos der Schweißbreite, Überprüfung des Heißlufttemperaturprotokolls, Inspektion der Backlight-Naht
      threshold: Abschalfestigkeit mindestens 8 N/cm. Schweißweitentoleranz ±1 mm. Sichtbare Kanalisierung = Ablehnung
    - stage: '4'
      title: Montage-QC
      description: Jede Einheit folgt einer 100-Punkte-Montage-Checkliste, die vom Teamleiter unterzeichnet wird. Die Ventilfunktion wird in 10 Öffnungs-/Schließzyklen getestet. Das Drehmoment der Hardware wird überprüft. Die Sichtprüfung umfasst Oberflächenoberfläche, Farbkonsistenz, Etikettplatzierung und Zubehörvollständigkeit.
      checks: 100-Punkte-Checkliste pro Einheit, Ventilfunktionstest, Drehmomentüberprüfung der Hardware, Sichtprüfung
      threshold: 'Null-Fehler-Richtlinie bei sicherheitskritischen Gegenständen (Ventile, D-Ringe, Griffe). Kleine Kosmetik: 99,3 % fehlerfreies Ziel'
    - stage: '5'
      title: Druckprüfung
      description: Jede Kammer wird auf 1,25× Nenndruck aufgeblasen und 24–48 Stunden gehalten. Drucksensoren protokollieren während der gesamten Wartezeit kontinuierlich. Temperaturkompensierte Messwerte gewährleisten die Genauigkeit. Jede Kammer mit mehr als 5 % Druckabfall wird abgelehnt und zur Nahtinspektion mit 100 % erneuten Tests der gesamten Produktionscharge geschickt.
      checks: 24-48 Stunden Druckhaltprotokoll, täglich überprüfte Sensorkalibrierung, temperaturkompensierte Messung, Nahttest nach Reparatur erneut
      threshold: Maximal 5 % Druckabfall über 24 Stunden bei stabiler Temperatur. Überschreiten = 100 % erneutes Testen der gesamten Charge
    - stage: '6'
      title: Endgültige Inspektion und Versandfreigabe
      description: Abschließende visuelle und funktionale Inspektion vor dem Verpacken. Oberflächenfehler, Farbkonsistenz, Etikett-/Bin-Verifikation, Verpackungsintegrität und Zubehör-Vollständigkeit werden mit der Kundenbestellung überprüft. Die Einheiten werden vakuumverpackt, verpackt und palettiert. Vor dem Verlassen eines Produkts ist eine endgültige Qualitätskontrolle erforderlich.
      checks: Vollständige visuelle Inspektion, Zubehör-Checkliste pro SKU Stück, Verpackungs-Droptest (1 m Zufallsprobe), Etikett-/Barcode-Scan-Verifikation
      threshold: Sicherheitsmängel ohne Toleranz. 99,3 % fehlerfreies Ziel. 100 % der Geräte visuell inspiziert
content_equipment:
  tagline: Prüfausrüstung
  title: QC-Labor<br />Ausrüstung
  subtitle: Unser Qualitätslabor ist mit spezialisierten Prüfgeräten für Materialverifikation, Schweißintegrität und Produktleistungsvalidierung ausgestattet.
  columns: 3
  items:
    - title: Zugprüfmaschine
      description: Misst Zugfestigkeit und Verlängerung des Gewebes gemäß internem Testprotokoll. Wird für die eingehende Qualitätskontrolle aller PVC und drop-stitch Stoffchargen verwendet.
      icon: tabler:scale
    - title: Temperaturkammer
      description: Umweltkammer für UV Widerstandstests und Flexibilitätstests bei niedrigen Temperaturen. Simuliert extreme Betriebsbedingungen.
      icon: tabler:temperature
    - title: Drucksensoren und Holzlogger
      description: Digitale Drucksensoren mit kontinuierlicher Datenerfassung für 24-48-stündige Luftretentionstests. Temperaturkompensiert für Genauigkeit.
      icon: tabler:wind
    - title: Peel-Testgerät
      description: Kalibrierte Peel-Testgeräte zur Überprüfung der Schweißnahtfestigkeit. Zufällige Proben jeder Produktionscharge.
      icon: tabler:files
    - title: Leckdetektionstank
      description: Wassertank für Unterwasser-Lecktests aufgeblasener Kammern. Visuelle Blasenerkennung zur Überprüfung der Naht- und Ventilintegrität.
      icon: tabler:ripple
    - title: Inspektionswerkzeuge
      description: Kalibrierte Messwerkzeuge – Dickenmessgeräte, Drehmomentschlüssel, Maßschieber, Härtemesser für Produktions-QC-Stationen.
      icon: tabler:tools
content_metrics:
  tagline: QC-Leistung
  title: Qualitätskontrolle<br />Metriken
  subtitle: Echte Bestanden/Nicht-bestanden-Daten aus unserer Produktionslinie. Diese Kennzahlen werden täglich überwacht und monatlich vom Management überprüft.
  columns: 3
  items:
    - title: 100 % getestete Einheiten
      description: Jede Kammer jeder Platine wird vor dem Versand unter Druck getestet. Keine Probenahme – 100%ige Inspektion der Druckintegrität.
      icon: tabler:check
    - title: <5 % Druckabfall
      description: Maximal zulässiger Druckverlust über 24–48 Stunden bei 1,25× Nenndruck. Jede Kammer, die diesen Schwellenwert überschreitet, löst einen Batch-Neutest aus.
      icon: tabler:gauge
    - title: 99,3 % fehlerfrei
      description: Fehlerfreie Rate über nachfolgende 12-Monats-Lieferungen. Null Toleranz gegenüber sicherheitskritischen Mängeln.
      icon: tabler:clipboard-check
    - title: 24-48 Stunden Aufenthalt
      description: Die Boards werden je nach Modell und Charge rund um die Uhr aufbewahrt. Drucksensoren erfassen während der gesamten Wartezeit kontinuierlich.
      icon: tabler:clock
    - title: 1,25× Testdruck
      description: Sicherheitsmarge an jeder Kammer – getestet bei 25 % über dem Nenndruck, um die Marge über den maximalen Betriebsbedingungen zu gewährleisten.
      icon: tabler:arrow-up
    - title: 0 % Sicherheitsmängel
      description: Null-Toleranz-Richtlinie gegenüber sicherheitskritischen Mängeln – Ventile, D-Ringe, Nähte und Auftriebskammern. Jeder Defekt = 100 % Nachinspektion.
      icon: tabler:shield
