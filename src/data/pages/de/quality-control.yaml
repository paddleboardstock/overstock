tldr:
  summary: 'Sechs-stufiges Qualitätskontrollsystem: Materialprüfung, Prozess-QC, Schweißüberprüfung, Montage-QC, Druckprüfung bei 1,25-fachem Nennwert und Endkontrolle. 100% Druckprüfung der Einheiten. 99,3% fehlerfreie Rate gemäß AQL 2,5-Stichprobe.'
  points:
    - 'Sechs-stufiges QC: Materialprüfung, Prozess-QC, Schweißüberprüfung, Montage-QC, 1,25-fache Druckprüfung und 100-Punkte-Endkontrolle'
    - 100-Punkte-Endkontrolle jeder Platine vor der Verpackung
    - 100% der Einheiten unterliegen einer 24-48-stündigen Haltezeit bei 1,25-fachem Nennwert mit maximal 5% Toleranz beim Druckabfall
    - AQL 2,5-Stichprobe zur Sicherstellung einer 99,3% fehlerfreien Rate
    - 'Schweiß-QC: Abziehprüfung, Überprüfung der Schweißnahtbreite und Inspektion der Hintergrundnaht jeder geschweißten Verbindung'
