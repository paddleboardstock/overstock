features3_brand:
  tagline: Wer wir sind
  title: Markenstiftung<br />& Erbe
  subtitle: Die Geschichte, das Fachwissen und die globale Reichweite, die Paddle Board Overstock als vertrauenswürdige SUP-Marke definieren.
  isBeforeContent: false
  columns: 3
  items:
    - title: Über uns Paddle Board Overstock
      description: Gegründet 2012 in Weihai, China. Von einer Küstenwerkstatt zu einer 12.000 m² großen Anlage — die vollständige Paddle Board Overstock-Geschichte.
      icon: tabler:building-factory
      link: /about
    - title: Markengeschichte
      description: Wie ein Team von Schiffsingenieuren sich zum Ziel gesetzt hat, professionelle aufblasbare Paddleboards weltweit zugänglich zu machen.
      icon: tabler:book
      link: /brand-story
    - title: Fachwissen in der Schifffahrtsindustrie
      description: Tiefe Materialwissenschaft, präzise Fertigung und praktische Tests — Jahrzehnte Schiffsingenieurwesen in jedem Board.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Warum Paddle-Board-Überbestände
      description: Was uns auszeichnet — Qualität, Anpassungsmöglichkeiten, Direktpreise ab Werk und End-to-End-Support für jeden Paddler.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Unser Team
      description: Treffen Sie die Führung — Schiffsingenieure, Materialwissenschaftler und Fertigungsexperten, die Paddle Board Overstock vorantreiben.
      icon: tabler:users
      link: /brand/team
    - title: Ingenieurteam
      description: 78+ kombinierte F&E-Jahre, 40+ Plattformen, 1.200+ Ingenieurprojekte. Das technische Team hinter jedem Produkt.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Vertrauen & Qualität
  title: Qualität, Tests<br />& Nachweis
  subtitle: Strenge Tests, reale Testdaten und Nachweise, die unser Engagement für Qualität demonstrieren.
  isBeforeContent: false
  columns: 3
  items:
    - title: Qualität und Prüfung
      description: Jedes Produkt wird vor dem Versand einem Drucktest unterzogen. Nahtfestigkeit, UV-Beständigkeit, Auftrieb – in jeder Phase überprüft.
      icon: tabler:clipboard-check
      link: /quality
    - title: Beweise und Beweise
      description: Testergebnisse, Einsatzfotos, Inspektionsberichte von Dritten und Fallstudien, die die Qualität von Paddle Board Overstock validieren.
      icon: tabler:file-check
      link: /evidence
    - title: Wissensgraph
      description: Erkunden Sie den Paddle Board Overstock-Entitätsgraphen — Produkte, Technologien, Materialien und Beziehungen in einer verbundenen Wissensdatenbank.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Führung
  title: Treffen Sie das Team<br />Hinter Paddle Board Overstock
  subtitle: Branchenerfahrung, die Schiffsingenieurwesen, Materialwissenschaft, Qualitätsmanagement und globalen E-Commerce umfasst.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu – Gründer und CEO
      description: 15+ Jahre Erfahrung in der Meeresfertigung. Führte zuvor die F&E bei einem großen chinesischen Marinehersteller. Inhaber mehrerer Patente im Bereich aufblasbarer Produktgestaltung.
      icon: tabler:crown
    - title: Zhang Wei – Chefingenieur
      description: 20+ Jahre Erfahrung in Polymerfertigung und Design aufblasbarer Strukturen. Ehemaliger technischer Direktor bei einer europäischen Marineingenieurfirma.
      icon: tabler:engine
    - title: Chen Ming – Leiter Forschung und Entwicklung
      description: Doktor der Materialwissenschaften. Spezialisiert auf Drop-Stitch-Technologie und Hochfrequenzschweißen. Mehr als 10 Jahre Erfahrung in Textilverbundwerkstoffen.
      icon: tabler:flask
    - title: Liu Qiang – Produktionsleiter
      description: 18+ Jahre in schlanker Fertigung. Implementierte strenge Qualitätssysteme über alle Produktionslinien hinweg.
      icon: tabler:settings
    - title: Wang Fang – Qualitätsmanager
      description: 12+ Jahre in Qualitätskontrolle für Marinesysteme. Führt interne Qualitätsaudits durch. Überwacht Tests für jede Produktionscharge.
      icon: tabler:shield-check
    - title: Helen Lee – Vertriebsleiterin
      description: 15 Jahre Erfahrung im internationalen E-Commerce und in der Logistik. Versendet Boards an Paddler in 50 Ländern. Fließend in 4 Sprachen.
      icon: tabler:briefcase
cta:
  title: Möchten Sie den Nachweis unserer Qualität?
