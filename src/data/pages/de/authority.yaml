hero:
  tagline: Autoritätszentrum
  title: Warum Paddle Board Overstock?<br />Vertrauen, das über ein Jahrzehnt aufgebaut wurde
  subtitle: Jedes Board, das wir bauen, trägt das Gewicht von 10+ Jahren Schiffsingenieurwesen, strenger Qualitätskontrolle und Tausenden von Paddlern weltweit. Deshalb wählen Paddler Paddle Board Overstock.
  image:
