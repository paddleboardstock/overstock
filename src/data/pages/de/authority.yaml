hero:
  tagline: Autoritätszentrum
  title: Warum Paddle Board Overstock?<br />Über ein Jahrzehnt aufgebautes Vertrauen
  subtitle: In jedem Boot, das wir bauen, steckt das Gewicht von mehr als 10 Jahren Schiffstechnik, zertifizierten Qualitätssystemen und Tausenden erfolgreicher Einsätze weltweit. Aus diesem Grund entscheiden sich Branchenexperten für Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock-Schiffsfertigungsanlage und Ingenieurteam
