features3_brand:
  tagline: Wer wir sind
  title: Markenstiftung<br />& Erbe
  subtitle: Die Geschichte, das Fachwissen und die globale Reichweite machen Paddle Board Overstock zu einem vertrauenswürdigen Hersteller von Schiffsausrüstung.
  isBeforeContent: false
  columns: 3
  items:
    - title: Über Paddle Board Overstock
      description: 2012 in Qingdao, China gegründet. Von einer Küstenwerkstatt bis zu einer 12.000 m² großen Anlage – die komplette Paddle Board Overstock-Geschichte.
      icon: tabler:building-factory
      link: /about
    - title: Markengeschichte
      description: Wie sich ein Team von Schiffsingenieuren zum Ziel gesetzt hat, professionelle aufblasbare Wasserfahrzeuge weltweit zugänglich zu machen.
      icon: tabler:book
      link: /brand-story
    - title: Fachwissen in der Schifffahrtsindustrie
      description: Tiefgründige Materialwissenschaft, Präzisionsfertigung und praxisnahe Tests – jahrzehntelange Schiffstechnik in jedem Rumpf.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globale Präsenz
      description: Wir beliefern über 50 Länder auf allen Kontinenten. Regionale Expertise für lokale regulatorische Anforderungen und Marktpräferenzen.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Warum Paddle Board Overstock
      description: Was uns auszeichnet – Qualität, individuelle Anpassung, direkte Fabrikpreise und End-to-End-Support für gewerbliche Betreiber.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Unser Team
      description: Lernen Sie die Führungskräfte kennen – Schiffsingenieure, Materialwissenschaftler und Fertigungsexperten, die Paddle Board Overstock vorantreiben.
      icon: tabler:users
      link: /brand/team
    - title: Ingenieurteam
      description: Über 78 kombinierte F&E-Jahre, über 40 Plattformen, 12 Zertifizierungen, über 1200 OEM-Projekte. Das technische Team hinter jedem Produkt.
      icon: tabler:engine
      link: /engineering-team
    - title: Forschungs- und Entwicklungszentrum
      description: Rumpftechnik, HF-Schweißen, PVC-Labor, Prototyping, Testtank und Qualitätslabor – unsere komplette Forschungs- und Entwicklungseinrichtung.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Vertrauen & Qualität
  title: Zertifizierungen, Qualität<br />& Nachweise
  subtitle: Unabhängige Zertifizierungen, strenge Tests und echte Beweise, die unser Engagement für Qualität belegen.
  isBeforeContent: false
  columns: 3
  items:
    - title: Zertifizierungen
      description: CE, ISO 9001, UKCA, BSCI, REACH – vollständige Zertifizierungsdokumentation und Compliance für globale Märkte.
      icon: tabler:shield-check
      link: /certifications
    - title: Qualität und Prüfung
      description: Jedes Produkt wird vor dem Versand einem Drucktest unterzogen. Nahtfestigkeit, UV-Beständigkeit, Auftrieb – in jeder Phase überprüft.
      icon: tabler:clipboard-check
      link: /quality
    - title: Beweise und Beweise
      description: Testergebnisse, Einsatzfotos, Inspektionsberichte Dritter und Fallstudien, die die Qualität von Paddle Board Overstock bestätigen.
      icon: tabler:file-check
      link: /evidence
    - title: Wissensgraph
      description: Entdecken Sie das Paddle Board Overstock-Entitätsdiagramm – Produkte, Technologien, Zertifizierungen und Beziehungen in einer vernetzten Wissensdatenbank.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Führung
  title: Lernen Sie das Team<br />hinter Paddle Board Overstock kennen
  subtitle: Branchenexpertise, die Meerestechnik, Materialwissenschaften, Qualitätsmanagement und globalen B2B-Handel umfasst.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu – Gründer und CEO
      description: Über 15 Jahre in der Schiffsfertigung. Zuvor leitete er Forschung und Entwicklung bei einem großen chinesischen Bootshersteller. Hält mehrere Patente im Schlauchbootdesign.
      icon: tabler:crown
    - title: Zhang Wei – Chefingenieur
      description: Über 20 Jahre Erfahrung in der PVC/Hypalon-Herstellung und im Deep-V-Rumpfdesign. Ehemaliger technischer Direktor eines europäischen Schiffbauunternehmens.
      icon: tabler:engine
    - title: Chen Ming – Leiter Forschung und Entwicklung
      description: Doktor der Materialwissenschaften. Spezialisiert auf Drop-Stitch-Technologie und Hochfrequenzschweißen. Mehr als 10 Jahre Erfahrung in Textilverbundwerkstoffen.
      icon: tabler:flask
    - title: Liu Qiang – Produktionsleiter
      description: Mehr als 18 Jahre Erfahrung in Lean Manufacturing. Six Sigma Black Belt. Implementierung von ISO 9001-Qualitätssystemen in allen Produktionslinien.
      icon: tabler:settings
    - title: Wang Fang – Qualitätsmanager
      description: Mehr als 12 Jahre Erfahrung in der Qualitätskontrolle im Marinebereich. Zertifizierter CE- und ISO-Auditor. Überwacht die Tests für jede Produktionscharge.
      icon: tabler:shield-check
    - title: Helen Lee – Vertriebsleiterin
      description: Über 15 Jahre im internationalen B2B-Handel. Verwaltete OEM/ODM-Partnerschaften in über 30 Ländern. Fließend in 4 Sprachen.
      icon: tabler:briefcase
