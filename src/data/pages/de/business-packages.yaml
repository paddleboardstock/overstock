faq:
  title: Paket-FAQ
  questions:
    - q: Was ist die Mindestbestellmenge für Pakete?
      a: Das Club-Starterpaket umfasst mindestens 10 Einheiten. Resort- und Markenpakete werden mit flexiblen Mindestbestellmengen an Ihre Bedürfnisse angepasst.
    - q: Wie lange dauert die Lieferung?
      a: Die Standardproduktion dauert 30–45 Tage ab Auftragsbestätigung. Eine beschleunigte Produktion ist gegen eine zusätzliche Gebühr möglich.
    - q: Kann ich die Farben und das Branding der Ausrüstung anpassen?
      a: Ja. Alle Pakete beinhalten eine vollständige Anpassung – Kartonfarben, Logodrucke und Verpackungsdesign.
    - q: Bieten Sie After-Sales-Support an?
      a: Ja. Jedes Paket beinhaltet den Zugang zu unseren Online-Wartungshandbüchern, Video-Tutorials und unserem Ersatzteilbestellsystem.
