  title: Einsatzbereite Wassergeschäftspakete für jede Phase
  subtitle: Vorkonfigurierte Ausrüstungspakete für Wassersportvereine, Resorts und Marken-Startups – mit transparenten Preisen, schneller Lieferung und umfassenden Anpassungsoptionen.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
