content_challenge:
  tagline: Die Herausforderung
  title: Meeresforschung erfordert stabile, instrumentenbereite Plattformen
  subtitle: Wissenschaftliche Arbeitsboote müssen eine stabile Plattform für empfindliche Instrumente, einen leisen Betrieb, um die Tierwelt nicht zu stören, und flexible Anordnungen für verschiedene Forschungsgeräte bieten.
  paragraphs:
    - Die Meeresforschung und Umweltüberwachung erfordern Arbeitsboote, die als schwimmende Laboratorien dienen. Anders als gewerbliche oder Freizeitschiffe müssen Forschungs-RIBs empfindliche elektronische Instrumentierung, Wasser- und Sedimentprobenahmeausrüstung und teilweise den Transport lebender Proben aufnehmen — und dabei eine stabile Plattform für eine genaue Datenerhebung bieten.
    - '**Plattformstabilität ist entscheidend** — Sonar, Echolote und CTD-Profiler (Leitfähigkeit, Temperatur, Tiefe) erfordern einen ruhigen Rumpf im Stand und bei langsamer Fahrt. Übermäßiger Wellenschlag oder Rumpfbewegungen bringen Störungen in die wissenschaftlichen Daten. Ein Deep-V-Rumpf mit guten Stabilitätseigenschaften ist unerlässlich.'
    - '**Instrumentenintegration** — Forschungsschiffe benötigen Befestigungspunkte für GPS-Antennen, Sonarwandler, Probenahmearme und Datenlogger. Der Konsolenraum muss mehrere Displays, die Stromversorgung der Instrumente und sichere Aufbewahrung für empfindliche Elektronik aufnehmen.'
    - '**Leiser Betrieb** — Bei meeresbiologischen Untersuchungen und Umweltüberwachung können Motorenlärm und Rumpfvibrationen Meerestiere verscheuchen und Verhaltensbeobachtungen beeinträchtigen. Leise Außenborderkonfigurationen und vibrationsarme Rumpfkonstruktionen sind für Forschungsanwendungen wichtig.'
    - Paddle Board Overstock-Forschungs-RIBs werden mit stabilen Rumpfplattformen, integrierten Geräteträgersystemen und leisen Außenborderkonfigurationen für wissenschaftliche Anwendungen und die Umweltüberwachung entwickelt.
content_solution:
  tagline: Unsere Lösung
  title: Speziell entwickelte Forschungs-RIBs<br />Für Wissenschaft und Umweltarbeit
  subtitle: Jedes Paddle Board Overstock-Forschungs-RIB ist als stabile, anpassbare Plattform für wissenschaftliche Instrumente und Feldprobengeräte konfiguriert.
  list:
    - Deep-V-GFK-Rumpf mit hervorragender Stabilität im Stand und bei langsamem Vermessungstempo
    - Flaches Decklayout mit Gerätegrundplatten für Sonar, GPS und Probenahmeausrüstung
    - Konsole für mehrere Displays ausgelegt — Kartenplotter, Echolot, Datenlogger
    - 12-V- und 24-V-Zubehör-Stromverteilung für wissenschaftliche Instrumente
    - Leiser 4-Takt-Außenborder — minimale Vibration und Geräuschentwicklung für Wildtiererhebungen
    - Optionale Rumpfbauart mit geringem Wellenschlag für minimale Störung während der Datenerhebung
    - Individuelle Schlauchfarben für das Branding von Forschungsinstitutionen und die Flottenkennzeichnung
content_segments:
  tagline: Forschungsprofile
  title: Meereswissenschaftliche Lösungen<br />Nach Anwendungstyp
  subtitle: Für verschiedene Forschungsanwendungen gelten besondere Schiffsanforderungen – von universitären Lehrplattformen über Umweltuntersuchungsschiffe bis hin zu RIBs zur Überwachung der Wasserqualität.
  items:
    - title: Meereswissenschaftliche Programme der Universität
      subtitle: Lehrplattformen, studentische Exkursionen, Küstenforschung
      description: Meereswissenschaftliche Universitäten und Ozeanographieabteilungen benötigen zuverlässige, vielseitige Arbeitsboote für die Durchführung von Feldkursen, studentischen Forschungsprojekten und von Fakultäten geleiteten Küstenuntersuchungen. Das Boot muss für Studierende unter Aufsicht leicht zu bedienen sein, stabil genug für den praktischen Einsatz von Instrumenten und langlebig genug für den häufigen Einsatz durch mehrere Benutzer im Laufe der akademischen Semester. Budgetbeschränkungen im akademischen Umfeld machen Kosteneffizienz und geringen Wartungsaufwand zu wichtigen Überlegungen.
      features:
        - Stabile Plattform für die Übungen der Studierenden zum Aussetzen und Bergen von Instrumenten
        - Einfache Bedienung — Pinne oder Einzelkonsolenkonfiguration für die beaufsichtigte Nutzung durch Studierende
        - Robuste Hypalon-Schläuche für häufige Landungen am Strand und die Handhabung durch Studierende
        - Gerätebefestigung für Lehr-Sonar, Secchi-Scheibe und Probenahmeausrüstung
        - Wirtschaftliche PVC-Option für akademische Programme mit knappem Budget
    - title: Meeresforschungsinstitute
      subtitle: Vermessung von RIBs mit Instrumentenintegration, GPS und Probenahmeausrüstung
      description: Spezielle Meeresforschungsorganisationen, die Küsten- und Offshore-Untersuchungen durchführen, benötigen professionell konfigurierte Vermessungs-RIBs mit integrierter Instrumentierung. Diese Schiffe sind mit Sonarsystemen für die Bathymetriekartierung, CTD-Profilern für die Wassersäulenanalyse, Sedimentprobennehmern und Geräten zur biologischen Sammlung ausgestattet. Das Boot muss eine stabile Plattform bei langsamen Vermessungsgeschwindigkeiten bieten, über ausreichend Platz an Deck für den Einsatz der Ausrüstung verfügen und eine saubere 12-V-/24-V-Stromversorgung für die Elektronik bieten.
      features:
        - Integrierte Sonarwandlerbefestigung — durch den Rumpf oder am Spiegel geführt
        - GPS-Antennenbefestigung und Konsolenintegration für vermessungstaugliche Navigation
        - Bereich zum Aussetzen von CTD und Wasserprobennehmer mit sicheren Zurrpunkten
        - 12-V/24-V-Hilfsstromverteilung für Instrumente und Datenlogger
        - Stabil bei langsamer Fahrt (3–6 Knoten) für präzise Vermessungslinien
        - Optionaler A-Frame oder Davits zum Aussetzen schwererer Probenahmeausrüstung
    - title: Umweltüberwachung und -schutz
      subtitle: Ökologische Untersuchungen, Wildtierbeobachtung, Lebensraumbewertung
      description: Umwelt-NGOs, Regierungsbehörden und Naturschutzorganisationen führen meeresökologische Untersuchungen, Überwachung der Wildtierpopulation und Lebensraumbewertungen durch. Für diese Einsätze sind leise, schonende Schiffe erforderlich, die sich sensiblen Lebensräumen nähern können, ohne die Tierwelt zu stören. Boote müssen Kameraausrüstung, GPS für die Kartierung von Transekten und Probenahmeausrüstung für die Sammlung von Wasser und Sedimenten mitführen. Ein geringer Nachlauf und ein minimaler Motorlärm sind für Verhaltensbeobachtungsstudien von entscheidender Bedeutung.
      features:
        - Leiser 4-Takt-Außenborder — minimale Störung der Meeresfauna
        - Stabile Beobachtungsplattform für Foto- und Videodokumentation
        - Gerätebefestigung für Kamerahalterungen, GPS-Tracker und Feldcomputer
        - Geringer Tiefgang für die Anfahrt von Küstenfeuchtgebieten, Mangroven und Ästuarien
        - Leicht zu reinigende Deck- und Schlauchoberflächen für die Dekontamination zwischen den Standorten
    - title: Überwachung und Prüfung der Wasserqualität
      subtitle: Regelmäßige Probenahmeläufe, Schadstoffverfolgung, Compliance-Überwachung
      description: Organisationen zur Überwachung der Wasserqualität führen regelmäßig Probenahmen in Küstengebieten, Häfen und Binnenwasserstraßen durch, um den Verschmutzungsgrad, die Algenblüte und die Einhaltung von Umweltvorschriften zu überwachen. Diese Betriebe benötigen effiziente, zuverlässige Boote für wiederholte Besuche fester Probenahmestationen. Das Schiff muss Probenahmeausrüstung, Kühler zur Probenaufbewahrung und Ausrüstung für Feldtests mitführen – mit einfacher Deckreinigung zwischen den Probenahmestellen, um Kreuzkontaminationen zu verhindern.
      features:
        - Eigener Probenahmebereich mit Kühlbox und Gerätestauraum
        - Leicht zu reinigendes Deck und Schlauchoberflächen für die Dekontamination zwischen den Standorten
        - GPS-Integration für die präzise Rückkehr zu festen Probenahmekoordinaten
        - Kompakte Abmessungen für die Befahrung eingeschränkter Gewässer und enger Kanäle
        - Kraftstoffsparender Außenborder für wirtschaftliche regelmäßige Probenahmefahrten
