      name: James Thornton
      title: SUP Explorer 11 Besitzer — Vancouver, Kanada
features3_lab:
  title: Interne Test- & Qualitätslabor
  subtitle: Jede Materialcharge und jedes fertige Produkt durchläuft unser Vor-Ort-Testlabor, bevor es versendet wird.
  columns: 3
  isBeforeContent: true
  items:
    - title: Zugfestigkeitstest
      description: 'Jede PVC Stoffrolle wird intern auf Zugfestigkeit geprüft. Mindestanforderung: 350 N/cm Kette und Schuss. Abgelehnte Chargen werden an den Lieferanten zurückgeschickt — wir lehnen etwa 3 % der eingehenden Materialien ab.'
      icon: tabler:scale
    - title: UV Beschleunigte Alterung
      description: Stoffmuster durchlaufen 1.000 Stunden beschleunigte UV Witterungsprüfung. Die Zugfestigkeit muss nach der Exposition 80 %+ beibehalten. Produkte sind für 3+ Jahre Außeneinsatz bewertet.
      icon: tabler:sun
    - title: Naht-Abziehfestigkeit
      description: Geschweißte Nähte werden auf mindestens 5 N/mm Abziehfestigkeit getestet. Jede Produktionscharge hat Nahtmuster, die zerstörend getestet und archiviert werden.
      icon: tabler:stack
    - title: 24–48 Stunden Druck halten
      description: 'Jedes aufblasbare Produkt wird auf 1,25-fachen Nennwert PSI aufgeblasen und 24–48 Stunden überwacht. Maximal zulässiger Druckabfall: 5 %. Produkte, die diesen Test nicht bestehen, werden nachbearbeitet und vor dem Versand erneut getestet.'
      icon: tabler:wind
    - title: Ventilzyklustest
      description: Jedes Ventildesign durchläuft in unserem Labor 10.000 Öffnungs-Schließ-Zyklen. Ventile müssen nach dem Zyklisieren bei 1,25-fachem Nenndruck die Dichtheit behalten. Alle Paddle Board Overstock-Ventile sind für 5+ Jahre regelmäßiger Nutzung ausgelegt.
      icon: tabler:rotate
    - title: Kältesprödigkeitsbeständigkeit
      description: Materialien werden bei -30°C für 4 Stunden getestet. Kein Riss- oder Sprödewerden erlaubt. Produkte sind für Winterlagerung und den Einsatz mit Kaltwasser bis zu einer Umgebungstemperatur von -10°C ausgelegt.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Wie wir Qualität sicherstellen
  subtitle: Von der Rohstoffprüfung bis zur endgültigen Druckprüfung — jedes Produkt durchläuft eine strenge Qualitätskette.
  items:
    - title: Rohstoffinspektion
      description: Jede Rolle PVC-Stoff wird auf Dicke, Zugfestigkeit und UV-Beständigkeit getestet, bevor sie in die Produktion geht.
      icon: tabler:search
    - title: In-Prozess-Kontrolle
      description: Schweißnähte, Ventilinstallationen und Kameraverbindungen werden an jeder Station während der Montage überprüft.
      icon: tabler:eye
    - title: Druckprüfung
      description: Jedes aufblasbare Produkt wird auf das 1,25-fache des Nennwerts PSI aufgeblasen und für 24–48 Stunden gehalten, um die Luftdichtheit und die Nahtfestigkeit zu überprüfen.
      icon: tabler:wind
    - title: Endkontrolle
      description: Jede Einheit wird auf Verarbeitung, Hardware und Verpackung geprüft, bevor sie für den Versand freigegeben wird. Chargenproben werden in unser Labor zur zerstörenden Prüfung geschickt.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP FAQ zum Board
  subtitle: Häufig gestellte Fragen zu unseren Stand-Up-Paddle-Boards.
  columns: 2
  items:
    - title: Welche SUP Brettgrößen sind verfügbar?
      description: Wir bieten SUP-Bretter von 9 ft bis 12 ft an, einschließlich Allround-, Touring-, Yoga- und Spezialdesigns. Unsere meistverkauften Modelle sind der Tropical Breeze (10 ft) und der Ocean Voyager (11 ft).
    - title: Was ist drop-stitch-Konstruktion?
      description: Drop-stitch-Konstruktion verwendet Tausende von Polyestergarnen, die die oberen und unteren Schichten des Boards verbinden, wodurch es einen hohen Luftdruck (15–20 PSI) halten und eine starre, stabile Plattform erreichen kann. Dies ist der Industriestandard für erstklassige aufblasbare SUPs.
    - title: Was ist die Gewichtsbeschränkung für SUP-Bretter?
      description: Unsere SUP-Boards unterstützen je nach Modell und Volumen bis zu 150 kg. Das Leviathan Wakeboard ist unser Modell mit der höchsten Tragfähigkeit, entwickelt für größere Fahrer und die Nutzung für Yoga.
    - title: Bieten Sie komplette SUP-Pakete an?
      description: Ja. Jedes SUP-Board wird mit einem kompletten Paket geliefert, das ein 3-teiliges Alu-Paddel, eine Hochdruck-Handpumpe, eine Spiralleine, einen Reise-Rucksack und ein Reparaturset enthält. Einige Modelle enthalten auch ein abnehmbares Finnen-Set.
    - title: Wie lange gilt die Garantie auf SUP-Platinen?
      description: Alle Paddle Board Overstock SUP Boards haben eine 2-jährige Garantie gegen Herstellungsfehler, einschließlich Nahtversagen, Ventilmängel und Materialablösungen bei normaler Nutzung.
    - title: Wie lange dauert es, ein SUP-Board aufzupumpen?
      description: Mit der beigefügten Handpumpe dauert eine vollständige Befüllung auf 15 PSI etwa 8–12 Minuten. Für eine schnellere Befüllung empfehlen wir unsere Paddle Board Overstock 12V-Elektropumpe, die ein Board in weniger als 4 Minuten aufbläst.
