faqs_rib:
  title: 'RIB-Boot FAQ'
  subtitle: 'Häufige Fragen zu unseren Festrumpfschlauchbooten.'
  columns: 2
  items:
    - title: 'Welche RIB-Bootgrößen bietet Paddle Board Overstock an?'
      description: 'Wir bieten 35 RIB-Modelle von 2,5 m bis 7,6 m, von kompakten Beibooten bis hin zu schweren Nutz- und Patrouillenfahrzeugen. Jedes Modell ist mit verschiedenen Konfigurationsoptionen erhältlich.'
    - title: 'Was ist der Unterschied zwischen einem RIB und einem traditionellen Schlauchboot?'
      description: 'Ein RIB (Rigid-Hull Inflatable Boat) kombiniert einen soliden Glasfaser- oder Aluminium-Tief-V-Rumpf mit aufblasbaren Hypalon- oder PVC-Schläuchen. Dies bietet die Stabilität und Tragfähigkeit eines Hartbootes mit der Stoßdämpfung und Auftriebsfähigkeit eines Schlauchbootes.'
    - title: 'Welche Motoren sind mit Paddle Board Overstock RIBs kompatibel?'
      description: 'Unsere RIBs unterstützen Außenbordmotoren von 3 PS bis 250 PS, je nach Modell. Jede Produktseite listet die maximale Motorleistung auf. Wir empfehlen, für die ideale Abstimmung Ihren Händler zu konsultieren.'
    - title: 'Sind Paddle Board Overstock RIBs CE-zertifiziert?'
      description: 'Ja. Alle Freizeit-RIB-Modelle sind CE-zertifiziert nach den geltenden europäischen Standards für Freizeitwasserfahrzeuge. Nutz- und Patrouillenmodelle erfüllen zusätzliche Stabilitäts- und Lastanforderungen.'
    - title: 'Welche Garantie gilt für RIB-Boote?'
      description: 'Alle Paddle Board Overstock RIBs werden mit einer einjährigen Garantie gegen Herstellungsfehler geliefert, die Rumpfdelamination, Schlauchnahtversagen, Ventildefekte und Beschlagprobleme abdeckt.'
    - title: 'Wie viele Luftkammern haben Paddle Board Overstock RIBs?'
      description: 'Unsere RIBs verfügen über 3 bis 7 unabhängige Luftkammern, je nach Modelllänge. Dieses Mehrkammersystem stellt sicher, dass das Boot auch bei Beschädigung einer Kammer schwimmfähig bleibt.'

faqs_inflatable:
  title: 'Schlauchboot FAQ'
  subtitle: 'Häufige Fragen zu unseren aufblasbaren Dinghies, Kayaks und Booten.'
  columns: 2
  items:
    - title: 'Welche Materialien werden bei Paddle Board Overstock Schlauchbooten verwendet?'
      description: 'Wir verwenden militärisches PVC (1100 Denier) und hochwertiges Hypalon/CSM-Gummi, je nach Modell. Beide Materialien sind UV-stabilisiert, abriebfest und entsprechen den EU-REACH- und RoHS-Verordnungen.'
    - title: 'Wie lange halten Schlauchboote?'
      description: 'Bei richtiger Pflege hält ein hochwertiges PVC-Schlauchboot 7–10 Jahre, während Hypalon-Modelle 15–20 Jahre halten können. Regelmäßige Reinigung, UV-Schutz und ordnungsgemäße Lagerung verlängern die Lebensdauer erheblich.'
    - title: 'Welche Wartung ist für ein Schlauchboot erforderlich?'
      description: 'Zur Grundwartung gehören das Abspülen mit Süßwasser nach jedem Gebrauch (besonders im Salzwasser), das Trocknen vor der Lagerung, die jährliche Überprüfung der Ventildichtungen und das Auftragen von UV-Schutz auf die Schläuche. Vermeiden Sie längere Sonneneinstrahlung bei Nichtgebrauch.'
    - title: 'Können Schlauchboote im Salzwasser verwendet werden?'
      description: 'Ja. Alle Paddle Board Overstock Schlauchboote sind für den Einsatz im Süß- und Salzwasser ausgelegt. Wir empfehlen nach Salzwasserkontakt das Abspülen mit Süßwasser und gründliches Trocknen, um Beschlagkorrosion und Salzkristallisation im Gewebe zu verhindern.'
    - title: 'Wie lagere ich ein Schlauchboot?'
      description: 'Lassen Sie die Luft ab, reinigen und trocknen Sie das Boot vollständig vor der Lagerung. Rolle es locker auf (vermeide enge Falten), lagere es kühl und trocken, fern von direktem Sonnenlicht, und nicht auf Betonböden, um Feuchtigkeitsbildung zu vermeiden.'
    - title: 'Welche Tragfähigkeit haben Paddle Board Overstock Schlauchboote?'
      description: 'Die Tragfähigkeiten reichen von 290 kg für unsere kleinsten Modelle bis über 2000 kg für größere Nutzfahrzeuge. Jede Produktseite listet die maximale Traglast für Ihr spezifisches Modell.'

faqs_sup:
  title: 'SUP-Board FAQ'
  subtitle: 'Häufige Fragen zu unseren Stand-Up-Paddle-Boards.'
  columns: 2
  items:
    - title: 'Welche SUP-Boardgrößen sind erhältlich?'
      description: 'Wir bieten SUP-Boards von 9 ft bis 12 ft, darunter Allround-, Touren-, Yoga- und Spezialdesigns. Unsere meistverkauften Modelle sind das Tropical Breeze (10 ft) und das Ocean Voyager (11 ft).'
    - title: 'Was ist Drop-Stitch-Konstruktion?'
      description: 'Die Drop-Stitch-Konstruktion verwendet tausende Polyesterfäden, die die obere und untere Schicht des Boards verbinden, sodass es hohen Luftdruck (15–20 PSI) halten kann und eine starre, stabile Plattform bietet. Dies ist der Industriestandard für hochwertige aufblasbare SUPs.'
    - title: 'Wie hoch ist das Gewichtslimit für SUP-Boards?'
      description: 'Unsere SUP-Boards unterstützen je nach Modell und Volumen bis zu 150 kg. Das Leviathan Wake Board ist unser Modell mit der höchsten Kapazität, entwickelt für schwerere Fahrer und den Einsatz beim Yoga.'
    - title: 'Bieten Sie komplette SUP-Pakete an?'
      description: 'Ja. Jedes SUP-Board wird mit einem Komplettpaket geliefert, das ein 3-teiliges Aluminiumpaddel, eine Hochdruck-Handpumpe, eine Spiralleine, einen Reiserucksack und ein Reparaturset enthält. Einige Modelle enthalten auch einen abnehmbaren Finnen-Satz.'
    - title: 'Welche Garantie gilt für SUP-Boards?'
      description: 'Alle Paddle Board Overstock SUP-Boards haben eine einjährige Garantie gegen Herstellungsfehler, einschließlich Nahtversagen, Ventildefekte und Materialdelamination bei normalem Gebrauch.'
    - title: 'Wie lange dauert es, ein SUP-Board aufzupumpen?'
      description: 'Mit der mitgelieferten Handpumpe dauert eine vollständige Befüllung auf 15 PSI etwa 8–12 Minuten. Für schnelleres Aufpumpen empfehlen wir unsere Paddle Board Overstock 12V-Elektropumpe, die ein Board in unter 4 Minuten aufpumpt.'

