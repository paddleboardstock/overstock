features3_lab:
  title: Interne Prüfung & Qualitätslabor
  subtitle: >-
    Jede Materialcharge und jedes Endprodukt durchläuft vor dem Versand unser hauseigenes
    Prüflabor.
  columns: 3
  isBeforeContent: true
  items:
    - title: Zugfestigkeitsprüfung
      description: >-
        Jede PVC-Gewebebahn wird nach ASTM D751 geprüft. Mindestanforderung: 350 N/cm in Kett- und
        Schussrichtung. Zurückgewiesene Chargen gehen an den Lieferanten zurück — wir lehnen etwa
        3 % der Eingangsmaterialien ab.
      icon: tabler:scale
    - title: UV-beschleunigte Alterung
      description: >-
        Gewebeproben durchlaufen 1.000 Stunden QUV-Bewitterung (ASTM G154). Die
        Zugfestigkeitsretention muss nach UV-Exposition über 80 % liegen. Produkte sind für 3+ Jahre
        Außeneinsatz ausgelegt.
      icon: tabler:sun
    - title: Schälfestigkeit der Nähte
      description: >-
        HF-geschweißte Nähte müssen mindestens 5 N/mm Schälfestigkeit erreichen (ASTM D751).
        Handgeklebte Hypalon-Nähte werden mit 3,5 N/mm geprüft. Aus jeder Produktionscharge werden
        Nahtproben zerstörend geprüft und archiviert.
      icon: tabler:stack
    - title: 24–48 Stunden Druckhaltung
      description: >-
        Jedes aufblasbare Produkt wird auf 1,25× Nenndruck aufgepumpt und 24–48 Stunden überwacht.
        Maximal zulässiger Druckabfall: 5 %. Produkte, die diesen Test nicht bestehen, werden
        nachgearbeitet und erneut geprüft.
      icon: tabler:wind
    - title: Ventil-Zyklentest
      description: >-
        Jedes Ventildesign durchläuft im Labor 10.000 Öffnen-Schließen-Zyklen. Ventile müssen nach
        dem Zyklentest bei 1,25× Nenndruck dicht bleiben. Alle Paddle Board Overstock-Ventile sind für 5+ Jahre
        regelmäßigen Einsatz ausgelegt.
      icon: tabler:rotate
    - title: Kaltbruchbeständigkeit
      description: >-
        Materialien werden 4 Stunden bei -30 °C nach ISO 4646 geprüft. Risse oder Versprödung sind
        nicht zulässig. Produkte sind für Winterlagerung und Kaltwassereinsatz bis -10 °C
        Umgebungstemperatur ausgelegt.
      icon: tabler:snowflake

