features3_certifications:
  title: Qualität und Prüfung
  subtitle: Jedes Board wird in unserem eigenen Labor getestet, bevor es versendet wird — echte Zahlen, echte Aufzeichnungen, keine Marketingaussagen.
  columns: 3
  isBeforeContent: true
  items:
    - title: In Unserer Eigenen Fabrik Hergestellt
      description: Wir besitzen und betreiben eine 12.000 m² große Einrichtung in Weihai. Jede Produktionscharge ist rückverfolgbar, dokumentiert und geprüft — keine ausgelagerte, mysteriöse Fertigung.
      icon: tabler:building-factory
    - title: Materialprüflabor
      description: Das interne Materiallabor prüft Zugfestigkeit, UV Beständigkeit, Nahtintegrität und Abrieb für jede Stoffcharge vor der Produktion.
      icon: tabler:microscope
    - title: Marine-Qualitätsmaterialien
      description: UV-stabilisierte PVC, drop-stitch Kerne und EVA Deckschaum — ausgewählt und getestet für viele Saisons von Sonne, Salz und Beanspruchung.
      icon: tabler:flask
    - title: 2 Jahre SUP Garantie
      description: Paddle Board Overstock SUP Boards sind durch eine 2-jährige Garantie gegen Herstellungsfehler abgedeckt, einschließlich Nähte, Ventile und Materialdelamination. Wir stehen hinter dem, was wir bauen.
      icon: tabler:shield-check
testimonials:
  tagline: Kundenzufriedenheit
