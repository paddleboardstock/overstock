    - title: 'ISO 9001'
      description: 'Unsere 12.000 m² große Anlage in Qingdao arbeitet nach einem ISO 9001-zertifizierten Qualitätsmanagementsystem. Jede Produktionscharge ist rückverfolgbar, dokumentiert und geprüft.'
