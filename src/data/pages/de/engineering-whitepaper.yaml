section_faq:
  title: Technische FAQ
  questions:
    - q: Wie schneidet Drop-Stitch im Vergleich zur herkömmlichen Hartschalenkonstruktion ab?
      a: Moderne Drop-Stitch-Kerne erreichen bei 20 PSI 85–90 % der Steifigkeit vergleichbarer Hartschalen aus EPS-Schaum/Glasfaser und lassen sich für den Transport vollständig entlüften. Der Kompromiss ist ein etwas höheres Gewicht und eine geringere Endsteifigkeit – aber für die meisten Freizeit- und kommerziellen Anwendungen ist der Unterschied vernachlässigbar.
    - q: Welche Fadendichte gilt als Premiumqualität?
      a: Premium-Drop-Stitch-Stoffe verwenden 2 Fäden pro Quadratzoll (ca. 3.100 Fäden pro m²), gewebt aus 1.680 DTEX-Polyestergarn. Stoffe der Einstiegsklasse verwenden 1 Faden pro Quadratmeter mit 1.100 DTEX-Garn.
    - q: Kann Hypalon wie PVC geschweißt werden?
      a: Nein. Hypalon/CSM kann nicht hochfrequenzgeschweißt werden. Der Zusammenbau muss mit von Hand aufgetragenem Kontaktkleber erfolgen, was die Produktion arbeitsintensiver macht und die Nähte von den Fähigkeiten des Bedieners abhängig macht. PVC kann für eine gleichbleibende, automatisierte Nahtqualität hochfrequenz- oder heißluftgeschweißt werden.
    - q: Was ist der maximale Sicherheitsdruck für Schlauchboote?
      a: Standardschläuche für Schlauchboote arbeiten mit 8–12 PSI. Drop-Stitch-Böden arbeiten mit 12–20 PSI. Hochdruck-Drop-Stitch-Kerne (SUPs) können bei 20–25 PSI betrieben werden. Jedes Produkt verfügt über Druckentlastungsventile, die kalibriert sind, um ein Überpumpen zu verhindern.
    - q: Wie lange dauert die Herstellung eines maßgeschneiderten Schlauchbootes?
      a: Die Standard-OEM-Produktion dauert 30–45 Tage von der Auftragsbestätigung bis zum FOB Qingdao. Durch die kundenspezifische Formenentwicklung werden 15–20 Tage für die Prototypenfertigung und -prüfung benötigt.
