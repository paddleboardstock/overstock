process_section:
  tagline: So funktioniert der Versand
  title: Von unserem Lager zu Ihrer Tür
  steps:
    - title: Angebot mit Frachtoptionen
      description: Jedes Angebot listet die Frachtoptionen für Ihr Ziel auf — Express und See — mit geschätzten Transitzeiten, sodass nichts für Sie entschieden wird.
    - title: Qualitätskontrolle und Verpackung
      description: Die Boards werden zu 100 % auf Druck getestet und dann mit Pumpe, Paddel, Leash, Finne, Rucksack und Reparaturset verpackt — dasselbe vollständige Paket, das wir im Einzelhandel anbieten.
    - title: Versand aus Weihai
      description: Ihre Sendung verlässt unsere Logistikbasis mit der von Ihnen gewählten Versandart, und die Tür-zu-Tür-Verfolgung wird Ihnen noch am selben Tag mitgeteilt.
    - title: Zollabfertigung
      description: Wir stellen die kommerzielle Rechnung und die Packliste zur Verfügung, die Sie für den Import benötigen. Einfuhrabgaben und Steuern in Ihrem Land trägt der Importeur — siehe Abschnitt Zoll unten.
    - title: Lieferung und Prüfung
      description: Überprüfen Sie Ihre Lieferung bei Ankunft. Wenn etwas beschädigt oder fehlen sollte, kontaktieren Sie uns mit Fotos und Ihrer Bestellnummer — siehe unsere Richtlinien für verlorene und beschädigte Waren unten.
customs_section:
  tagline: Zoll & Abgaben
  title: Zölle und Einfuhrsteuern
  subtitle: Wir halten Frachtverantwortlichkeiten ausdrücklich fest, anstatt vage Versprechen zu machen. Hier ist genau aufgeführt, wer für was verantwortlich ist.
  items:
    - title: Was wir abdecken
      description: Ihr Angebot beinhaltet die Frachtkosten zu Ihrem Zielort, und wir bereiten alle Exportdokumente vor und stellen sie zur Verfügung — kommerzielle Rechnung, Packliste und Sendungsverfolgung.
    - title: Was der Importeur abdeckt
      description: Einfuhrabgaben, MwSt./GST und alle Steuern des Ziellandes sind vom Importeur (Ihnen oder Ihrem Unternehmen) gemäß den Regeln Ihres Landes zu zahlen. Wir bündeln keine vagen Steuerzusagen in unseren Frachtangeboten.
    - title: Unterstützung bei der Zollabfertigung
      description: Unsere Unterlagen sind vollständig und konsistent – korrekte HS-Codes, deklarierte Werte und Board-Spezifikationen – was die Abfertigung reibungslos gewährleistet. Wenn Ihr Makler oder Zollamt zusätzliche Unterlagen benötigt, stellen wir sie zur Verfügung.
    - title: Überprüfen Sie Ihre lokalen Tarife, bevor Sie bestellen
      description: Die Zollsätze auf aufblasbare Wassersportausrüstung variieren je nach Land. Prüfen Sie die Importbestimmungen Ihres Landes oder fragen Sie in Ihrer Anfrage – unsere regionalen Marktführer enthalten Zollhinweise für wichtige Märkte.
lost_damaged:
  title: Verlorene oder beschädigte Lieferungen
  description: Überprüfen Sie Ihre Lieferung, wenn sie ankommt. Im seltenen Fall, dass eine Platine beschädigt ankommt oder ein Paket fehlt, kontaktieren Sie uns so schnell wie möglich mit Ihrer Bestellnummer und klaren Fotos von Verpackung und Karton. Wir beurteilen jeden Fall einzeln – je nach Fall bedeutet das ein Ersatzteil, eine Ersatzplatte oder eine Rückerstattung für den betroffenen Artikel. Herstellungsfehler werden separat durch unsere 2-Jahres-Garantie abgedeckt SUP .
destinations_section:
  tagline: Wo wir verschiffen
  title: 50+ Länder und mehr
  description: Wir versenden weltweit mit detaillierten Leitfäden für unsere wichtigsten regionalen Märkte. Jeder Marktführer behandelt lokale Kundentypen, Versandhinweise und Zolltipps für diese Region.
  regions_label: Regionale Führer
  countries_label: Landführer
faq_section:
  title: Versand-FAQ
  items:
    - q: Wie lange dauert der Expressversand?
      a: Die Express-Transitzeit hängt vom Ziel ab – wir nennen bei jeder Anfrage die geschätzte Transitzeit für Ihr Land, bevor Sie sich auf etwas festlegen.
    - q: Wie lange dauert die Seefracht?
      a: Der Seefrachttransport variiert je nach Zielhafen und Fahrplänen. Wir geben ein geschätztes Zeitfenster für Ihr Ziel mit Ihrer Bestellung an, und Sie erhalten die Sendungsverfolgung, sobald die Sendung abfährt.
    - q: Welche Versandmethode sollte ich wählen?
      a: Express für 1–3 Bretter, Proben oder dringende Nachbestände. Seefracht für 5–20 Brett-Großhandelsaufträge, bei denen die Kosten pro Brett wichtiger sind als die Geschwindigkeit. Wir bieten beide Angebote an, damit Sie vergleichen können.
    - q: Sind Einfuhrzölle und Steuern in den Versandkosten enthalten?
      a: Nein. Der Transport wird separat angegeben, und Einfuhrzölle, Mehrwertsteuer/GST sowie Zielsteuern liegen gemäß den Vorschriften Ihres Landes in der Verantwortung des Importeurs. Wir stellen vollständige, genaue Unterlagen zur Verfügung, damit die Abfertigung reibungslos läuft.
    - q: Versenden Sie in mein Land?
      a: Wir versenden in 50+ Länder. Schauen Sie sich unsere regionalen und Länderführer unten an oder fragen Sie einfach in Ihrer Anfrage – wir bestätigen den aktuellen Service an Ihre Adresse.
    - q: Kann ich meine Bestellung verfolgen?
      a: Ja. Jede Lieferung – Express oder See – beinhaltet eine Tür-zu-Tür-Sendung, die wir Ihnen am Tag des Versands mitteilen.
