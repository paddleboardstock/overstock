hero:
  tagline: Internationaler Versand
  title: Internationaler Versand —<br />Express- & Seefracht in 50+ Länder
  subtitle: Jede Bestellung wird von unserem Logistikzentrum in Weihai, China, versendet. Wählen Sie Express-Luftfracht für Muster und dringende Nachbestellungen oder konsolidierte Seefracht für Großhandelsbestellungen kleiner Unternehmen.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Boards verpackt für internationalen Versand
direct_answer: Paddle Board Overstock versendet in mehr als 50 Länder von Weihai, China. Express-Luftfracht transportiert 1–3 Boards, Musterbestellungen und dringende Nachbestellungen; konsolidierte Seefracht ist die wirtschaftliche Option für Großhandelsbestellungen von 5–20 Boards. Jede Sendung beinhaltet Tür-zu-Tür-Tracking, und jedes Board wird vor dem Versand zu 100 % druckgeprüft und mit dem vollständigen Zubehörset verpackt.
tldr_points:
  - 'Express-Luftfracht: 1–3 Boards, Muster, dringende Nachbestellungen — schnellste Option'
  - 'Seefracht: 5–20 Board-Großhandelsbestellungen — niedrigste Frachtkosten pro Board'
  - Tür-zu-Tür-Tracking bei jeder Sendung in 50+ Länder
  - Fracht, Versicherung, Zollabfertigung und Einfuhrabgaben werden in Ihrem Angebot aufgeführt — keine vagen Pauschalversprechen
from_china:
  tagline: Versand aus China
  title: Wo Bestellungen versendet werden
  description: Alle Bestellungen werden von unserem Logistikzentrum in Weihai, China, versendet — das Herzstück unserer Produktion und Lagerhaltung. Weihai ist eine bedeutende Küstenstadt in der Provinz Shandong mit direkten See- und Luftfrachtverbindungen, die Transitzeiten und Frachtkosten zu Zielen in Asien, Amerika, Afrika, Europa und dem Nahen Osten wettbewerbsfähig halten.
modes_section:
  tagline: Zwei Optionen
  title: Expressversand oder Seefracht
  subtitle: Die richtige Versandart hängt davon ab, wie schnell Sie die Boards benötigen und wie viele Sie bestellen. Beide Optionen werden bei jeder Anfrage mit Angeboten angegeben.
  express:
    name: Option A — Expressversand
    best_for: Am besten für 1–3 Boards, Muster und dringende Nachbestellungen
    description: Express-Luftfracht liefert kleine Bestellungen und Musterboards in Tagen, nicht Wochen, zu Ihnen nach Hause. Ideal, wenn Sie ein Modell vor einer größeren Bestellung testen oder einen Bestseller mitten in der Saison nachbestellen.
    features:
      - 1–3 Boards, einzelne Modelle oder gemischte Mustermodelle
      - Schnellster Transport der beiden Optionen — nach Zielort kalkuliert
      - Tür-zu-Tür-Tracking mit einem großen Expressdienstleister
      - 'Typische Anwendung: Muster, dringende Nachbestellungen, kleine Erstbestellungen'
  sea:
    name: Option B — Seefracht
    best_for: Am besten für 5–20 Board-Großhandels- und Einzelhandelsbestellungen
    description: Konsolidierte Seefracht ist die wirtschaftliche Wahl für Großhandelsbestellungen kleiner Unternehmen. Boards werden zusammen in einer konsolidierten Sendung von Weihai verpackt, was die Frachtkosten pro Board niedrig hält.
    features:
      - 5–20 Board-Einzelhandels- und Großhandelsbestellungen
      - Niedrigste Frachtkosten pro Board der beiden Optionen
      - Konsolidierte Verpackung — eine Sendung, eine Verzollung
      - 'Typische Anwendung: saisonale Nachbestellungen, gemischte Großhandelsbestellungen'
