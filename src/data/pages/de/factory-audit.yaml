content_priorities:
  tagline: Was Kunden überprüfen
  title: 8 Dinge, die Käufer<br />bei jedem Fabrikbesuch überprüfen
  subtitle: Basierend auf dem Feedback von Käufern aus über 50 Ländern sind dies die acht Prioritäten, die Kunden bewerten, bevor sie eine B2B-Bestellung aufgeben.
  items:
    - title: Echter Hersteller
      description: 'Sind Sie die eigentliche Fabrik und kein Handelsunternehmen? Käufer prüfen: Geschäftseinheit, echte Produktionsausrüstung, Mitarbeiter, die Maschinen bedienen, aktuelle Produktionsaufträge vor Ort und Konsistenz zwischen Website und Werkstatt.'
      icon: tabler:building-factory
    - title: Produkt passend zur Anwendung
      description: Passt das RIB zu ihrem spezifischen Anwendungsfall? Resort-, Rettungs-, Tauch-, Angel- und Patrouillenbetreiber haben grundlegend unterschiedliche Anforderungen. Käufer bewerten Decklayout, Rohrmaterial und Ausstattungsoptionen auf dem ausgestellten Boot.
      icon: tabler:target
    - title: Qualitätsstabilität und Reproduzierbarkeit
      description: Ist die 50. Einheit genauso gut wie die 1.? Käufer prüfen QC-Systeme, In-Prozess-Kontrollpunkte und den Umgang mit Abweichungen und bitten um Einsicht in Aufzeichnungen aus mehreren Produktionsläufen, um die Konsistenz zu überprüfen.
      icon: tabler:repeat
    - title: Authentizität von Compliance-Dokumenten
      description: Sind CE-Zertifikate modellspezifisch? Ist das DoC von einer echten Person unterzeichnet? Kann die Konformität anhand der Rumpfnummer überprüft werden? Käufer prüfen, ob Pauschalansprüche oder modellspezifische Unterlagen vorliegen.
      icon: tabler:file-certificate
    - title: Anpassungsausführung
      description: Kann das Werk tatsächlich kundenspezifische Konfigurationen liefern? Käufer suchen nach Beweisen vergangener kundenspezifischer Projekte, ausgestellten Prototypenmustern, Konstruktionszeichnungen und der Möglichkeit, technische Änderungen vor Ort zu besprechen.
      icon: tabler:adjustments
    - title: Vorlaufzeit und Kapazität
      description: 'Sind die angegebenen Zeitpläne realistisch? Käufer bewerten: aktuelles Produktionsvolumen, verfügbare Kapazität, Personalgröße, Materialbestände und ob die Fabrik über ein Produktionsplanungssystem verfügt.'
      icon: tabler:clock
    - title: Preis- und Geschäftsbedingungen
      description: 'Sind die Preise transparent? Ist die FOB-Preisgestaltung klar? Käufer prüfen: Aufschlüsselung der Stückpreise, Werkzeugkosten, Verpackungskosten und ob das Werk DDP- oder CIF-Bedingungen mit ordnungsgemäßer Exportdokumentation erfüllen kann.'
      icon: tabler:currency-dollar
    - title: Kundendienst und Ersatzteile
      description: 'Was passiert nach der Lieferung? Käufer bewerten: Ersatzteilverfügbarkeit, Garantieprozess, Ersatzrohrabschnitte, Ventilaustausch und ob das Werk über ein dokumentiertes Kundendienstprotokoll verfügt.'
      icon: tabler:headset
content_tour:
  tagline: Route der Werksbesichtigung
  title: Audit-Tour –<br />Was Sie sehen werden
  subtitle: Unsere Standard-Werksbesichtigung folgt einer festgelegten Route, die darauf ausgelegt ist, an jeder Station Fragen des Käufers zu beantworten.
  items:
    - title: 1. Besprechungsraum – Vorstellung des Unternehmens
      description: Geschäftslizenz, ISO 9001- und BSCI-Zertifikate, Exportlizenzen und Firmengeschichte. Schneller Überblick über Produktionskapazitäten und Compliance-Umfang.
      icon: tabler:users
    - title: 2. Rohstofflager – IQC-Station
      description: Aufzeichnungen über eingehende Materialkontrollen, Stoffchargenzertifikate, Klebstoffe und Hardware-Muster. Sehen Sie, wie Materialien vor Produktionsbeginn getestet werden.
      icon: tabler:building-warehouse
    - title: 3. Rohrherstellung — HF-Schweißen & Handkleben
      description: Live-Rohrschweiß- oder Klebeprozess, Demonstration der Nahtfestigkeitsprüfung und Ventilinstallation. Beachten Sie die kammerweise Konstruktion und die Qualitätskontrollpunkte.
      icon: tabler:flame
    - title: 4. Rumpflaminierung – GFK-Workshop
      description: Glasfaser-Layup-Prozess, Gelcoat-Auftrag und Aushärtung des Rumpfes. Sehen Sie sich den Laminierungsplan und die strukturelle Verstärkung für verschiedene RIB-Modelle an.
      icon: tabler:layers-subtract
    - title: 5. Montage und Integration
      description: Rumpf-Rohr-Verbindung, Konsolen- und Sitzinstallation, Integration von Elektro- und Kraftstoffsystemen sowie Gerätemontage. Beobachten Sie die Produktionslinie im Betrieb.
      icon: tabler:tool
    - title: 6. Druckprüfstation
      description: 24-48-Stunden-Druckhaltetest bei 1,25-fachem Nenndruck. Sehen Sie sich Testaufzeichnungen, Manometer und Pass/Fail-Kriterien an. Sehen Sie, wie Testergebnisse mit Rumpfseriennummern verknüpft werden.
      icon: tabler:gauge
    - title: 7. Endkontrolle und Qualitätskontrolle
      description: 100-Punkte-Qualitätscheckliste pro Einheit, Dimensionsprüfung, kosmetische Inspektion und Prüfung der Verpackungsintegrität. Überprüfen Sie Nichtkonformitätsprotokolle und Korrekturmaßnahmenaufzeichnungen.
      icon: tabler:clipboard-check
    - title: 8. Dokumentenüberprüfungsraum
      description: Konformitätsdokumentation pro Modell (DoC, Herstellerschild, Benutzerhandbuch), Produktionsrückverfolgbarkeitsaufzeichnungen, HIN-Registrierung und Demonstration der Datenbank zur Materialchargenverfolgung.
      icon: tabler:folder
content_qc_chain:
  tagline: Qualitätsnachweise
  title: 8-stufige QC-Kette<br /> – bei jedem Schritt überprüfbar
  subtitle: Unsere Qualitätskontrollkette reicht vom Materialeingang bis zum endgültigen Versand und verfügt über dokumentierte Nachweise in jeder Phase.
  items:
    - title: 'Stufe 1: Wareneingangskontrolle'
      description: Jede Charge aus PVC, Hypalon, Glasfaser, Aluminium, Klebstoffen und Hardware wird vor Produktionsbeginn anhand der Spezifikationen getestet. Zugfestigkeit, Beschichtungshaftung und Maßprüfungen gemäß AQL 2,5/ISO 2859.
      icon: tabler:package
    - title: 'Stufe 2: Rohrschweißen / Kleben QC'
      description: Prüfung der Nahtschälfestigkeit pro Produktionscharge. Überwachte und aufgezeichnete HF-Schweißparameter. Von Hand geklebte Nähte auf gleichmäßige Klebstoffabdeckung und Aushärtezeit überprüft.
      icon: tabler:flame
    - title: 'Stufe 3: Qualitätskontrolle der Rumpflaminierung'
      description: Messung der Gelcoat-Dicke, Überprüfung des Glasfaseraufbaus gemäß Laminatplan und Überwachung der Aushärtezeit. Strukturelle Bewehrungspositionen anhand technischer Zeichnungen überprüft.
      icon: tabler:layers-subtract
    - title: 'Stufe 4: QC für Montage und Integration'
      description: Integrität der Rumpf-Rohr-Verbindung, Drehmoment für Konsolen- und Sitzmontage, elektrischer Durchgang und Dichtheitsprüfung des Kraftstoffsystems. Jeder Installationspunkt wird anhand der modellspezifischen Montage-Checkliste überprüft.
      icon: tabler:tool
    - title: 'Stufe 5: Druckhaltetest'
      description: Jede aufblasbare Kammer wird auf das 1,25-fache des Nenn-PSI unter Druck gesetzt und 24–48 Stunden lang gehalten. Pro Kammer aufgezeichneter Druckabfall. Bestehens-/Nichtbestehensschwellenwert dokumentiert. Mit der Rumpfseriennummer verknüpft.
      icon: tabler:gauge
    - title: 'Stufe 6: Endkontrolle'
      description: 100-Punkte-Qualitätscheckliste, die Maßhaltigkeit, kosmetisches Finish, Vollständigkeit des Zubehörs, Dokumentationspaket und Verpackungsintegrität umfasst. Unabhängig vom Produktionsteam.
      icon: tabler:clipboard-check
    - title: 'Stufe 7: Compliance-Dokumentation'
      description: Modellspezifisches DoC, Überprüfung des Herstellerschilds, Vollständigkeit des Benutzerhandbuchs und HIN-Registereintrag. Alle Compliance-Dokumente werden vor der Versandfreigabe vorbereitet und überprüft.
      icon: tabler:file-certificate
    - title: 'Stufe 8: Versandfreigabe und Rückverfolgbarkeit'
      description: Für die endgültige Freigabe müssen alle QC-Stufen bestanden, die Compliance-Dokumentation vollständig sein und die Versanddokumentation überprüft werden. Das Rumpfprotokoll wurde geschlossen und für eine Aufbewahrungsdauer von mehr als 10 Jahren archiviert.
      icon: tabler:truck
content_traceability:
  tagline: Rückverfolgbarkeit der Produktion
  title: HIN → Stammdatei →<br />Rumpfdatensatz → Lieferung
  subtitle: Jedes RIB-Boot trägt eine eindeutige Rumpfidentifikationsnummer, die mit einer vollständigen Produktions- und Compliance-Aufzeichnungskette verknüpft ist.
  items:
    - title: Rumpfidentifikationsnummer (HIN)
      description: 14-stellige eindeutige Kennung, die dauerhaft auf jedem Boot angebracht ist. Kodiert Herstellercode (MIC), Modellbezeichnung, Produktionsjahr und Seriennummer. Der Schlüssel, der die gesamte Rückverfolgbarkeitskette freischaltet.
      icon: tabler:hash
    - title: Technische Masterdatei
      description: Die Konformitäts- und technische Dokumentation für die Modellfamilie. Enthält GA-Zeichnungen, Risikobewertungen, Stabilitätsberechnungen, Materialspezifikationen und geltende Normen. Verbunden mit allen Rümpfen dieses Modells.
      icon: tabler:folder
    - title: Individueller Rumpfrekord
      description: 'Produktionsaufzeichnung pro Rumpf: HIN, Produktionsdatum, Rohrcharge, Materialzertifikate, Drucktestergebnis, endgültige Konfiguration, Motorspezifikation, Ergebnisse der Qualitätscheckliste und Lieferziel. 21+ Datenfelder pro Rumpf.'
      icon: tabler:file-description
    - title: Kunden-Compliance-Paket
      description: Paket für die Lieferung pro Rumpf, einschließlich DoC, Foto des Herstellerschilds, Benutzerhandbuch, Compliance-Checkliste und endgültigem Konfigurationsblatt. Wird mit dem Boot geliefert und im Werk für mehr als 10 Jahre archiviert.
      icon: tabler:package
content_red_flags:
  tagline: Audit-Fallstricke
  title: Warnsignale für Käufer<br />Leicht zu erkennen
  subtitle: Häufige Probleme, die das Vertrauen der Käufer bei Fabrikaudits untergraben. Wir gehen jeden einzelnen proaktiv an.
  items:
    - title: Pauschale CE-Ansprüche ohne Modellumfang
      description: '„Alle Produkte CE-zertifiziert“, ohne Angabe der Richtlinie, der Modelle und des Konformitätsmoduls. Warnhinweis: deutet darauf hin, dass die Konformität oberflächlich und nicht modell- oder konfigurationsspezifisch ist.'
      icon: tabler:alert-triangle
    - title: Keine physischen Testnachweise
      description: 'Drucktestansprüche ohne Testaufzeichnungen, Messgeräte oder Teststation, die in der Fabrikhalle sichtbar sind. Warnhinweis: Qualitätsansprüche können beim Besuch nicht überprüft werden.'
      icon: tabler:alert-triangle
    - title: Fehlende Materialrückverfolgbarkeit
      description: 'Keine Chargenprotokolle, keine Eingangskontrolle und keine Verknüpfung zwischen Materialzertifikaten und Fertigprodukten. Warnhinweis: Qualitätsprobleme können nicht bis zur Quelle zurückverfolgt werden.'
      icon: tabler:alert-triangle
    - title: Allgemeine Dokumentation
      description: 'Ein DoC für alle Modelle, keine HIN-spezifischen Aufzeichnungen oder „Vorlagen“-Compliance-Dokumente. Warnhinweis: Compliance ist nicht an einzelne Produktionseinheiten gebunden.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Versand und Verpackung
  title: Containerbeladung und Verpackung<br />von RIB-Booten
  subtitle: Unsere Versandlösungen schützen Ihre Investition von Qingdao bis zum Bestimmungshafen. Containerbeladepläne und Verpackungsspezifikationen für jedes Modell verfügbar.
  items:
    - title: 20-Fuß-Containerkonfigurationen
      description: 'Standard 20-Fuß-Container: 1–2 RIB-Boote (4,0–5,5 m) verschachtelt mit getrenntem Deck und Röhren, oder 8–12 SUP-Boards. Gemischte RIB- + SUP-Konfigurationen verfügbar. Detaillierter Beladeplan pro Bestellung.'
      icon: tabler:box
    - title: 40-Fuß-Containerkonfigurationen
      description: 'Standard 40-Fuß-Container: 2–4 RIB-Boote (bis 7,0 m) mit verschachtelten Rümpfen und gestapelten Röhren, oder 20–30 SUP-Boards. 40-Fuß-HQ für höhere RIB-Modelle verfügbar. Volumenoptimierte Verpackung senkt die Versandkosten pro Einheit.'
      icon: tabler:container
    - title: Holzkisten für RIB-Rümpfe
      description: Aluminium- und GRP-Rümpfe in maßgefertigten Holzkisten mit Schaumstoffpolsterung, Feuchtigkeitssperre und Stahlumreifung. Kistenmaße und Gewicht pro Modell für die Logistikplanung verfügbar. ISPM-15-Zertifizierung für wärmebehandeltes Holz inklusive.
      icon: tabler:wood
    - title: Verpackung mit Röhren- und Decktrennung
      description: Röhren werden für platzsparende Verpackung getrennt von den Rümpfen entleert und gefaltet. Deckplatten, Konsolen und Sitze in Schutzfolie mit Montagebeschlägen verpackt. Montageanleitung bei jeder Sendung inklusive.
      icon: tabler:package
    - title: Feuchtigkeits- und Korrosionsschutz
      description: VCI-Korrosionsschutzpapier für Aluminiumkomponenten, Silicagel-Trockenmittelbeutel und vakuumversiegelte Beschlägebeutel. Verhindert Kondensationsschäden während des 30–45-tägigen Seetransports.
      icon: tabler:droplet-off
    - title: FOB-Qingdao-Dokumentation
      description: Konnossement, Handelsrechnung, Packliste, Ursprungszeugnis und Konformitätsdokumentation pro Sendung. FCL- und LCL-Konsolidierung verfügbar. Zolldokumentations-Support für EU-, US- und Nahostmärkte.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Vor Ort überprüfbare Nachweise
  title: Prüfnachweise,<br />die Sie vor Ort verifizieren können
  subtitle: Bei Werksbesichtigungen können Kunden in jedem Produktionsbereich gezielte Nachweise prüfen. Hier erfahren Sie, worauf Sie achten sollten — und was wir für jedes Audit vorbereiten.
  areas:
    - area: Rohmateriallager
      what_to_verify: Sind die Materialien einwandfrei gelagert? Kommt es zu Chargenvermischungen?
      evidence: Wareneingangsprüfprotokolle, Chargenetiketten, FIFO-Lagerung, Lieferantenfreigabeliste, Materialzertifikate (PVC, Hypalon, Fiberglas, Aluminium, Klebstoffe, Beschläge)
      icon: tabler:building-warehouse
    - area: Schlauchproduktion
      what_to_verify: Wie werden Nahtfestigkeit und Luftdichtheit gewährleistet?
      evidence: Prozesskarten, Erstmusterbestätigung, Druckprüfprotokolle je Kammer, Reparatur- und Nachprüfprotokolle, Ventileinbauprotokolle
      icon: tabler:flame
    - area: Rumpfproduktion
      what_to_verify: Wie wird die strukturelle Konsistenz überwacht?
      evidence: Kontrollierte Prozessdokumente, Qualitätskontrollpunkte, Nummerierung der Halbfabrikate, Gelcoat-Dickenmessungen, Verifikation des Laminierplans
      icon: tabler:layers-subtract
    - area: Montagebereich
      what_to_verify: Wie werden Falschmontagen von Optionsteilen verhindert?
      evidence: Stücklisten, Arbeitsaufträge, Konfigurationschecklisten, Prüfkarten je Arbeitsplatz, Drehmoment- und Funktionsprüfungen je Modell
      icon: tabler:tool
    - area: Prüfstation
      what_to_verify: Wie wird bestätigt, dass das Boot vor der Auslieferung einwandfrei ist?
      evidence: Prüfverfahren, Geräteverzeichnis, Kalibrierprotokolle, Druckprüfprotokolle (1,25x / 24-48h), Funktionsprüfchecklisten, dokumentierte Bestehens- und Fehlerkriterien
      icon: tabler:gauge
    - area: Sperrbereich für Nichtkonformitäten
      what_to_verify: Wie werden Fehler behandelt?
      evidence: Sperrkennzeichnungen, NCR-Protokolle, Ursachenanalysen, Freigabeaufzeichnungen für Nacharbeit, CAPA-Verfolgung (korrektive und präventive Maßnahmen)
      icon: tabler:alert-triangle
    - area: Fertigwarenlager
      what_to_verify: Wie werden Fehlauslieferungen und Beschädigungen verhindert?
      evidence: Fertigproduktetiketten, Abgleichaufzeichnungen mit den Aufträgen, Verpackungsstandards, Prüfprotokolle der Vorversandkontrolle
      icon: tabler:box
    - area: Ersatzteile & After-Sales
      what_to_verify: Können Sie langfristigen After-Sales-Support leisten?
      evidence: Liste gängiger Ersatzteile, Lagerhaltungsstrategie, Teilenummernsystem, Dokumentation des Gewährleistungsprozesses, Wartungsanleitungen
      icon: tabler:headset

content_closing_script:
  tagline: Vom Audit zur Bestellung
  title: Von der Werksbesichtigung<br />zum bestätigten Projekt
  subtitle: Ein erfolgreiches Audit sollte nicht mit Fotos und einem Händedruck enden. Vor Ihrer Abreise stellen wir sicher, dass drei kommerzielle Ergebnisse dokumentiert sind.
  items:
    - title: Technische Konfiguration bestätigen
      description: Einigung über Modell, Einsatzbereich, Schlüsseloptionen, Zielmarkt, geschätzte Menge und Liefertermin — alles dokumentiert vor der Abreise.
      icon: tabler:checklist
    - title: Nächste Dokumente festlegen
      description: 'Definition der nächsten Unterlagen von Aquafarer: überarbeitete GA, Konfigurationsliste, Angebot, Dokumentencheckliste, Musterplan oder NDA — mit konkreten Terminen.'
      icon: tabler:file-plus
    - title: Gemeinsamen Zeitplan bestätigen
      description: Überarbeitete Konfiguration und vorläufiges Angebot innerhalb von 3 Arbeitstagen. Muster- oder Optikbestätigung innerhalb von 7 Tagen. Technische Prüfung oder Inspektion durch Dritte innerhalb von 14 Tagen. Nächster Termin und Verantwortliche verbindlich festgelegt.
      icon: tabler:calendar

faq:
  title: Fabrikaudit – Häufig gestellte Fragen
  questions:
    - q: Kann ich die Fabrik persönlich besichtigen?
      a: Ja. Wir begrüßen Werksaudits vor Ort in unserem 12.000 m² großen Werk in Qingdao. Unsere Standardtour umfasst 8 Stationen vom Rohstofflager bis zum Dokumentenprüfraum. Zur Erstqualifizierung stehen auch virtuelle Werksführungen per Videocall zur Verfügung.
    - q: Akzeptieren Sie Audits durch Dritte (BSCI, SMETA, SGS)?
      a: Ja. Wir pflegen die BSCI-Zertifizierung (Intertek) und begrüßen kundenspezifische Auditprotokolle. Auf Wunsch können wir auch SGS- oder TÜV-Prüfungen veranlassen. Prüfberichte sind unter NDA verfügbar.
    - q: Kann ich während des Besuchs einen Drucktest sehen?
      a: Unsere Druckprüfstation gehört zum Standard-Rundgang. Abhängig vom Produktionsplan können Sie aktive Drucktests mit Manometerablesungen und Testprotokollen beobachten. Drucktestprotokolle pro Rumpf stehen jederzeit zur Einsicht zur Verfügung.
    - q: Wie gehen Sie mit fehlerhaften Produkten um?
      a: Nicht konforme Einheiten werden gemäß unserem ISO 9001-Korrekturmaßnahmenprozess getrennt, dokumentiert und überprüft. Es werden Ursachenanalysen durchgeführt, Korrekturmaßnahmen umgesetzt und Aufzeichnungen geführt. Käufer können unser NCR-Protokoll während Audits einsehen.
    - q: Welche Compliance-Dokumentation steht zur Überprüfung zur Verfügung?
      a: 'Während des Audits können Sie Folgendes überprüfen: modellspezifische DoC-Muster, Herstellerschildspezifikationen, HIN-Registrierung, Entwürfe von Benutzerhandbuchen, anwendbare Normenlisten und Konformitätsbewertungsaufzeichnungen pro Modellfamilie.'
    - q: Wie buche ich eine virtuelle Werksführung?
      a: Kontaktieren Sie unser Vertriebsteam, um eine Live-Videotour über WhatsApp, Zoom oder Teams zu vereinbaren. Wir folgen der gleichen 8-Stationen-Route und können uns je nach Ihren Interessen auf bestimmte Bereiche konzentrieren. Eine typische virtuelle Tour dauert 45–60 Minuten.
    - q: Ist die Fabrik der eigentliche Hersteller oder ein Handelsunternehmen?
      a: Aquafarer ist der eigentliche Hersteller. Wir betreiben die Fabrik in Laixi, Qingdao. Geschäftslizenz, Fertigungsumfang und physische Produktion sind alle während des Audits überprüfbar.
    - q: Welche Qualitätsaufzeichnungen kann ich überprüfen?
      a: Aufzeichnungen über eingehende Materialinspektionen, In-Prozess-QC-Kontrollpunkte, Drucktestprotokolle, 100-Punkte-Checklisten für die Endkontrolle, Nichtkonformitätsberichte, Aufzeichnungen über Korrekturmaßnahmen und Aufzeichnungen zur Rückverfolgbarkeit pro Rumpf. Alle werden gemäß den Anforderungen der ISO 9001 gewartet.
