hero:
  tagline: Globale Präsenz
  title: 'Über 50 Länder beliefert<br />auf allen Kontinenten'
  subtitle: 'Von europäischen Küstenpatrouillen-Betreibern über australische Wassersport-Distributoren bis zu Rettungsteams im Nahen Osten — Aquafarer-Boote sind weltweit auf dem Wasser im Einsatz.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer globale Marineproduktion und -distribution
stats:
  title: Globale Reichweite
  stats:
    - title: Länder
      amount: '50+'
    - title: Exportmärkte
      amount: Europa, Amerika, Asien, Naher Osten, Ozeanien
    - title: Produktion
      amount: Qingdao, China
    - title: US-Lager
      amount: Montclair, CA
features3_markets:
  tagline: Wichtige Märkte
  title: 'Regionale Expertise<br />für lokale Anforderungen'
  subtitle: 'Wir verstehen, dass verschiedene Märkte unterschiedliche regulatorische Anforderungen, Präferenzen und Anwendungsfälle haben.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa & Großbritannien
      description: 'CE-zertifizierte Produkte gemäß EN ISO 6185. Starke Nachfrage nach RIBs, Schlauchbooten und SUP-Boards in EU-Märkten. Britische Distributoren schätzen unsere schnellen Lieferzeiten.'
      icon: tabler:map-pin
    - title: Nordamerika
      description: 'Von der US-Küstenwache zugelassene Fertigung. US-Lager in Montclair, CA für schnelle Lieferung an der Westküste. Wachsende Nachfrage nach Angelbooten, Rettungsfahrzeugen und Freizeit-SUPs.'
      icon: tabler:map-pin
    - title: Australien & Ozeanien
      description: 'Starker Markt für RIB-Boote und aufblasbare Tender. Australische Distributoren schätzen unsere Hypalon-Boote wegen der UV-Beständigkeit bei intensiver Sonneneinstrahlung. Schneller Versand ab unserer Anlage in Asien.'
      icon: tabler:map-pin
    - title: Naher Osten
      description: 'Wachsende Nachfrage nach Patrouillen- und Rettungsbooten. Unsere RIBs mit Aluminiumrumpf sind bei Küstenwachen und Sicherheitsbetreibern beliebt. Individuelle Konfigurationen für Umgebungen mit hohen Temperaturen.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Vertriebsnetzwerk
  title: 'Zusammenarbeit mit Distributoren<br />weltweit'
  subtitle: 'Wir arbeiten mit etablierten Marineausrüstungs-Distributoren, OEM-Marken und Beschaffungsstellen der öffentlichen Hand zusammen.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM-Partnerschaften
      description: 'Private-Label-Fertigung für globale Wassersportmarken. Wir übernehmen alles von Design über Produktion bis zum Drop-Shipping.'
      icon: tabler:building
    - title: Distributorennetzwerk
      description: 'Autorisierte Distributoren in über 20 Ländern führen Lagerbestände und bieten lokalen Support. Neue Distributoranfragen sind willkommen.'
      icon: tabler:users
    - title: Regierung & Institutionen
      description: 'Direkte Belieferung von Küstenwachen, Such- und Rettungsorganisationen sowie militärischen Beschaffungsprogrammen. Einhaltung der Beschaffungsanforderungen öffentlicher Einrichtungen.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Globale Logistik & Support'
  subtitle: 'Vom Werk bis zum Bestimmungsort — wir managen die gesamte Lieferkette.'
  items:
    - title: Versandoptionen
      description: 'Seefracht (FOB Qingdao), Luftfracht für Eilaufträge und Expresskurier für Muster und Ersatzteile.'
      icon: tabler:truck-delivery
    - title: US-Lager
      description: 'Lagerbestand in Montclair, CA für schnelle Lieferung in ganz Nordamerika. Westküste: 2–3 Tage, Mitte: 3–4 Tage, Ostküste: 4–5 Tage.'
      icon: tabler:building-warehouse
    - title: Ersatzteile
      description: 'Original-Aquafarer-Ersatzteile und Verbrauchsmaterialien ganzjährig auf Lager. Gängige Teile werden innerhalb von 24 Stunden versendet.'
      icon: tabler:package
    - title: Technischer Support
      description: 'Direkter Draht zu unserem Engineering-Team für technische Fragen, Reparaturberatung und Refit-Unterstützung. Wir betreuen auch Boote, die wir vor 20 Jahren gebaut haben.'
      icon: tabler:headset
cta:
  title: 'Möchten Sie Distributor werden?'
  subtitle: 'Wir bauen unser Vertriebsnetzwerk aktiv aus. Kontaktieren Sie unser Exportteam, um Partnerschaftsmöglichkeiten zu besprechen.'
  actions:
    - variant: primary
      text: Partnerschaftsanfrage
      href: /contact
    - text: Produktpalette ansehen
      href: /products
