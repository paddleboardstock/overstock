faq_section:
  title: Großhandels-FAQ
  items:
    - q: Was ist die Mindestbestellmenge im Großhandel?
      a: Fünf Platinen. Unser Überbestandsmodell ist für kleine Einzelhändler ausgelegt — Sie müssen keinen Container füllen, um Großhandelspreise zu erhalten.
    - q: Kann ich verschiedene SUP-Modelle in einer Großhandelsbestellung mischen?
      a: Ja. Gemischte Modellbestellungen sind einer der größten Vorteile beim Kauf von Überbeständen — kombinieren Sie beliebige vorrätige Modelle in einer einzigen Lieferung, und die Gesamtanzahl der Platinen bestimmt Ihre Preiskategorie. Siehe unsere Seite für gemischte Modell-Großhandelsbestellungen für Details.
    - q: Sind die Bretter brandneu?
      a: Ja. Jedes Board ist nagelneu, unbenutzter Überbestandsbestand – niemals B-Ware, generalüberholt oder Kundenrückläufer. Jedes Board wird vor dem Versand zu 100 % einem Drucktest unterzogen.
    - q: Wie viel günstiger ist der Großhandel im Vergleich zum Einzelhandel?
      a: Großhandelspreise pro Einheit werden pro Bestellung auf der Grundlage von Modellen und Mengen angegeben und liegen deutlich unter den oben aufgeführten Einzelhandelspreisen. Fordern Sie ein Angebot für Ihre gewünschte Mischung an und wir werden es genau preislich festlegen.
    - q: Welche Versandmethode sollte ich wählen?
      a: Express-Luftfracht eignet sich für 1–3 Boards, Muster und dringend benötigte Nachlieferungen. Konsolidierte Seefracht ist die wirtschaftliche Wahl für 5–20 Board-Bestellungen von Händlern. Wir unterbreiten bei jeder Anfrage Angebote für beide Optionen.
    - q: Welche Garantie haben Großhandelsplatinen?
      a: Die gleiche 2-Jahres-SUP-Garantie, die wir jedem Kunden in jedem der 50+ Länder, in die wir liefern, geben.
    - q: Versenden Sie in mein Land?
      a: Wir liefern derzeit in mehr als 50 Länder, mit regionalen Leitfäden für Lateinamerika, Südostasien, Afrika, den Nahen Osten und wichtige Märkte einschließlich Mexiko, Brasilien, die Philippinen, Indonesien, Thailand, Südafrika, Kenia und die VAE. Fragen Sie in Ihrer Angebotsanfrage nach, und wir bestätigen den aktuellen Service an Ihre Adresse.
