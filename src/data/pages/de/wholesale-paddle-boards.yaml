hero:
  tagline: SUP Großhandelsboards
  title: Aufblasbare Paddleboards im Großhandel<br />für kleine Unternehmen
  subtitle: Brandneue SUP Überlagerbretter in kleinunternehmerfreundlichen Mengen. Bestellen Sie 5–20 Bretter, mischen Sie beliebige Modelle in einer Lieferung und wählen Sie Express-Luft- oder Seefracht in 50+ Länder.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Großhandelsaufblasbare SUP Bretter ab Paddle Board Overstock Versandfertigkeit
direct_answer: Paddle Board Overstock Liefert brandneue überschüssige aufblasbare SUP Boards an kleine Einzelhändler weltweit. Es gibt keine große Mindestbestellung – eine Großhandelsbestellung beginnt bereits bei 5 Boards, und Sie können alle vorrätigen Modelle in einer einzigen Bestellung kombinieren. Die Boards werden von unserer Basis in Weihai, China, per Express-Luftfracht (1–3 Boards, Proben oder dringende Nachfüllungen) oder mit konsolidiertem Seefracht (5–20 Board-Händlerbestellungen) versandt. Jedes Board wird vor dem Versand zu 100 % unter Druck getestet und durch unsere 2-Jahres-Garantie abgedeckt SUP .
tldr_points:
  - 'Niedrig MOQ: Großhandelsbestellung beginnen bei 5 Boards – für kleine Läden, nicht für Containerladungen – für kleine Geschäfte ausgelegt, nicht für Containerladungen'
  - 'Gemischte Modellbestellungen: Kombinieren alle auf Lager befindlichen SUP Modelle in einer Lieferung'
  - 'Zwei Versandoptionen: Express-Luftfracht für 1–3 Boards, Seefracht für 5–20 Board-Bestellungen'
  - 'Brandneuer Lagerbestand: 100 % unter Druck, 99,3 % Bestehensquote bei der Endprüfung, 2-jährige SUP Garantie'
why_retailers:
  title: Warum kleine Einzelhändler SUP Überlagerbretter wählen
  subtitle: Sie benötigen kein Lager- oder Containerbudget, um zu Großhandelspreisen zu kaufen.
  items:
    - title: Kleinunternehmensfreundliche Mengen
      description: Der traditionelle Großhandel verlangt Hunderte von Einheiten pro Bestellung. Unser Überschussmodell ist für unabhängige Geschäfte konzipiert – beginnen Sie mit 5 Boards und wachsen Sie Ihre Bestellung mit dem Wachstum Ihres Geschäfts.
    - title: Echte Großhandelspreise ohne das Volumenengagement
      description: Da wir Überschussbestände verkaufen – Überschussproduktion und sorgfältig beschaffte Bestände aus ausgewählten Partnerfabriken – erhalten Sie volumennahe Stückpreise ohne das Volumenrisiko.
    - title: Kombinieren Sie die Modelle, um Ihre Kunden abzugleichen
      description: Strandläden, Seeausstatter und Stadtläden bedienen verschiedene Paddler. Kombinieren Sie Allround-, Touring- und Surf-Modelle SUP in einer Portion, damit Ihr Regal Ihrer lokalen Nachfrage entspricht.
    - title: Brandneu, nie benutzt
      description: Jede Platine in unserem Überlagerbestand ist brandneu und ungenutzt – keine Zweitnoten, keine Rückgaben. Jede Platte wird zu 100 % unter Druck getestet, bevor sie das Lager verlässt.
    - title: Schneller, flexibler internationaler Versand
      description: Express-Luftfracht bringt 1–3 Karton- oder Musterbestellungen schnell an Ihre Haustür; Consolidated Sea Freight hält die Kosten pro Bord bei 5–20 Brett-Bestellungen niedrig.
    - title: Abgesichert durch eine echte Garantie
      description: Großhandel bedeutet nicht, dass man nicht unterstützt wird. Jedes SUP Board bietet unsere 2-Jahres-Garantie SUP , denselben Versicherungsschutz, den wir jedem Kunden in 50+ Ländern bieten.
pricing_section:
  tagline: Großhandelspreise
  title: Einfache, transparente Großhandelspreise
  subtitle: Die Preise werden pro Bestellung basierend auf den Modellen, Mengen und der von Ihnen gewählten Versandart angeboten. Keine versteckten Gebühren – das erhaltene Angebot ist der Preis, den Sie zahlen.
  points:
    - title: Nach Menge gestaffelt
      description: Die Einheitspreise sinken, wenn die Bestellgröße steigt. Eine Bestellung mit zehn Brettern kostet pro Tafel besser als eine Bestellung mit fünf Brettern; eine Bestellung mit 20 Brettern ist noch besser.
    - title: Gemischte Modelle zählen zu einer Gesamtzahl
      description: Ihr Rabattstufen basiert auf der Gesamtzahl der Boards in der Bestellung – nicht pro Modell. Das Mischen von 4 verschiedenen Modellen × 3 Boards jeweils zählt als eine 12-Board-Bestellung.
    - title: Angeboten mit Versandoptionen
      description: Jedes Angebot enthält sowohl Optionen für Express- als auch Seefracht mit geschätzten Transportzeiten, sodass Sie das Geschwindigkeits-Kosten-Verhältnis wählen können, das zu Ihrem Nachschubzeitplan passt.
    - title: Kein Konto oder keine Mitgliedschaft erforderlich
      description: Es gibt keinen Großhandelsclub, dem man beitreten kann, und keine Jahresgebühr. Fordern Sie ein Angebot an, bestätigen Sie die Bestellung, und wir versenden.
inventory_section:
  tagline: Aktueller Bestand
  title: Verfügbare Produkte und aktueller Lagerbestand
  subtitle: Alle 11 unten aufgeführten Produkte sind derzeit Überbestände. Die Bedingungen sind nagelneu; die Bestände ändern sich wöchentlich, daher bestätigen Sie die Verfügbarkeit in Ihrer Angebotsanfrage.
  table_labels:
    product: Modell
    condition: Bedingung
    price: Einzelhandelspreis
    action: Kontaktieren Sie uns
    condition_value: Neu
    note: Der Einzelhandelspreis wird nur als Referenz angezeigt. Der Großhandelspreis pro Einheit wird pro Bestellung angeboten und ist niedriger als der Einzelhandelspreis.
who_section:
  tagline: Wen wir beliefern
  title: Für unabhängige Wassersportunternehmen gebaut
  items:
    - title: Strand- & Surfshops
      description: Kleine Küstenhändler, die pro Saison 5–15 Boards benötigen, gemischt zwischen Allround-Modellen für Touristen und Surf-Boards für Einheimische.
    - title: Online-Verkäufer
      description: E-Commerce-Shops und Marktplatzverkäufer testen die SUP-Kategorie, ohne sich auf einen vollen Container eines einzelnen Modells festzulegen.
    - title: Verleihflotten & Schulen
      description: Mietbetriebe und SUP Schulen, die Flotten auffüllen — langlebige Boards, gemischte Modelle, um verschiedene Kundengrößen zu bedienen, und Garantieunterstützung.
    - title: Resorts & Reiseveranstalter
      description: Hotels, Inselresorts und Reiseveranstalter fügen SUP zu ihrem Aktivitätsangebot mit kleinen anfänglichen Flotten und einfacher saisonaler Nachbestückung hinzu.
how_to_order:
  tagline: Wie es funktioniert
  title: Wie man eine Großhandelsbestellung aufgibt
  steps:
    - title: Durchsuchen Sie das Inventar
      description: Überprüfen Sie die 11 vorrätigen Modelle oben oder verwenden Sie den Mixed-Model-Selector, um eine Kombination zu erstellen, die zu Ihren Kunden passt.
    - title: Angebot anfordern
      description: Senden Sie uns die Modelle, geschätzten Mengen, Ihr Land und die bevorzugte Versandgeschwindigkeit über das untenstehende Anfrageformular. Wir antworten mit Stückpreisen und Versandoptionen.
    - title: Bestätigen und Bezahlen
      description: Genehmigen Sie das endgültige Angebot — Modelle, Mengen, Versandart und Gesamtsumme. Die Zahlungsbedingungen werden beim Angebot bestätigt.
    - title: Wir Testen, Verpacken und Versenden
      description: Jede Platine wird zu 100 % auf Druck getestet, mit dem vollständigen Zubehörsatz verpackt und ab Weihai verschickt. Sie erhalten die Sendungsverfolgung für die gesamte Reise.
