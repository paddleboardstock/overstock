content_challenge:
  tagline: Die Herausforderung
  title: 'Rettungseinsätze erfordern<br />kompromisslose Zuverlässigkeit'
  subtitle: 'Such- und Rettungsorganisationen arbeiten unter extremer Sicherheitsverantwortung — jeder Bootsausfall hat inakzeptable Folgen.'
  paragraphs:
    - 'In Rettungseinsätzen wird der Abstand zwischen Erfolg und Scheitern in Minuten gemessen. Das Boot muss sofort einsatzbereit sein, unter rauen Bedingungen operieren und mit Passagieren sicher zurückkehren. Die Sicherheitsverantwortung ist absolut — ein mechanischer Ausfall während einer Rettungsmission ist keine Reparaturkostenfrage, sondern ein verlorenes Leben.'
    - 'SAR-Boote benötigen hohe Geschwindigkeit, um Opfer schnell zu erreichen, kombiniert mit außergewöhnlicher Stabilität für sichere Bergungsarbeiten. Sie müssen Rettungsausrüstung, medizinische Versorgung und Kommunikationsausrüstung transportieren — oft auf begrenztem Deck. Boote im staatlichen Dienst benötigen zudem eine lange Lebensdauer (10-15+ Jahre), um öffentliche Beschaffungsbudgets zu rechtfertigen.'
    - 'Sichtbarkeit — sowohl für den Operator als auch für die Suche — ist entscheidend. Das Konsolendesign muss 360-Grad-Sicht ermöglichen, und das Boot muss von Flugzeugen und anderen Schiffen gut sichtbar sein.'
    - 'Die Rettungs-RIBs von Paddle Board Overstock sind von der Kielspitze an für diese Anforderungen konstruiert — mit selbstlenzenden Decks, verstärkten Rümpfen, Navigationsausstattung und Schlepppfosten als Standard auf den Patrol-Modellen.'
content_solution:
  tagline: Unsere Lösung
  title: 'Speziell gebaute Rettungs-RIBs'
  subtitle: 'Jedes Paddle Board Overstock-Rettungsboot ist so konstruiert, dass es die SOLAS- und nationalen SAR-Normen erfüllt oder übertrifft.'
  list:
    - 'Selbstlenzendes Deck — Wasser läuft automatisch ab für Stabilität während der Bergungsarbeiten'
    - 'Verstärkter Tief-V-Rumpf — seegängig bei rauem Wasser mit vorhersehbarem Fahrverhalten bei hoher Geschwindigkeit'
    - 'Vollständige Navigationslichter — einsatzbereit Tag und Nacht bei jedem Wetter'
    - 'Schlepppfosten und Schleppleine — bereit für Schiffsschlepp oder Rettungsschlitten-Einsätze'
    - 'Montageplatten für Ausrüstung — Funk, Suchscheinwerfer, Sirene und medizinische Geräte'
    - 'Mehrere Motorkonfigurationen — einzelner Außenbordmotor oder Zweimotoren-Redundanz'
    - 'Leuchtende Schlauchfarben — Orange, Gelb oder Rot für maximale Sichtbarkeit'
content_segments:
  tagline: Rettungsprofile
  title: 'Lösungen für Such- und Rettungsboote<br />Nach Organisationstyp'
  subtitle: 'Verschiedene Rettungsorganisationen arbeiten unter unterschiedlichen Mandaten, Haushaltszyklen und Einsatzumgebungen — von freiwilligen Küstencrews bis zu den Flotten nationaler Küstenwachen. Wir konfigurieren jede Rettungs-RIB passend zum Einsatzprofil.'
  items:
    - title: 'Küstenwache & staatliche SAR-Behörden'
      subtitle: 'Absolute Sicherheitsverantwortung — flottenkritische Einsatzstandards'
      description: 'Staatliche SAR-Behörden tragen die höchste Sicherheitsverantwortung im maritimen Einsatz. Jedes Boot muss unter extremen Bedingungen fehlerfrei funktionieren — ein Geräteausfall während einer Rettungsmission ist keine Option. Beschaffungsentscheidungen orientieren sich an den Gesamtbetriebskosten über eine Lebensdauer von 10-15 Jahren, nicht am Anschaffungspreis. Die Behörden benötigen Fahrzeuge, die jahrelange Küstenpatrouillen überstehen, strenge nationale Normen erfüllen und an verteilten Stationen gleichbleibende Leistung liefern. Eine umfassende Konformitätsdokumentation und mehrjährige Serviceverträge sind verpflichtend.'
      features:
        - 'Dokumentationspaket zur Konformität mit SOLAS- und nationalen SAR-Normen'
        - 'Einheitliche Ersatzteile flottenweit — geringere Lagerkomplexität auf Stationsebene'
        - 'Zweimotoren-Konfiguration für einsatzkritische Redundanz'
        - 'Konstruktion für eine Lebensdauer von 10-15 Jahren mit geplanten Wartungsprogrammen'
        - 'Allwettertauglichkeit — verstärkter Tief-V-Rumpf für raue Seegangsbedingungen'
    - title: 'Rettungsschwimmer- & Strandrettungsdienste'
      subtitle: 'Schnellstart-Einsätze in flachem Wasser'
      description: 'Kommunale und strandnahe Rettungsschwimmerdienste benötigen Schnelleinsatzboote, die durch die Brandungszone auslaufen, in flachen Küstengewässern operieren und Schwimmer oder in Not geratene Fahrzeuge innerhalb von Minuten erreichen. Die Ausrüstung muss leicht genug sein, um mit einem kleinen Fahrzeug oder von Hand über den Strand gezogen zu werden.'
      features:
        - 'RIB-Rumpf mit geringem Tiefgang für Brandungszone und Küsteneinsatz'
        - 'Strandstart möglich durch Bughandgriff und Kielschutz'
        - 'Integrierter Rettungsschlitten oder Plattform für Rettungsschwimmer'
        - 'Leuchtend orange oder gelbe Schlauchfarben als Standard'
    - title: 'Feuerwehr-Rettungsdienste'
      subtitle: 'Feuerlöschpumpen-Integration, Ausrüstungsmontage, Schnelleinsatz'
      description: 'Die maritimen Einheiten der Feuerwehrrettung reagieren auf Brände an Uferanlagen, Fahrzeugbrände und wassergestützte Rettungseinsätze. Diese Boote müssen Feuerlöschpumpen, Wasserwerfer, Schlauchlagerung und Atemschutzgeräte transportieren — alles integriert in eine stabile, schnelle Plattform. Die Dienststellen nutzen diese Fahrzeuge auch für Hochwasserhilfe und Amtshilfe. Das Konsolenlayout muss Platz für Pumpensteuerungen, Funksysteme und Einsatzbeleuchtung bieten, ohne die Deckfläche für die Bewegungsfreiheit der Crew zu beeinträchtigen.'
      features:
        - 'Am Bug montierter Wasserwerfer mit Pumpenintegrationspaket'
        - 'Eigene Montageplätze für Feuerlöschpumpe, Schlauchlagerung und Atemschutzgeräte'
        - 'Konsolenlayout konfigurierbar für Pumpensteuerung, Funk und Einsatzbeleuchtung'
        - 'Selbstlenzendes Deck für Löschwasserabfluss und Stabilität'
        - 'Nachteinsatz-Paket: Suchscheinwerfer, Einsatzbeleuchtung, Blau-/Rotlichtbalken'
    - title: 'Wasserschutzpolizei & Hafensicherheit'
      subtitle: 'Eingriffs-, Patrouillen- und Boarding-Einsätze'
      description: 'Einheiten der maritimen Strafverfolgung benötigen Boote für Hochgeschwindigkeitsverfolgung, das Entern von Verdachtsfahrzeugen und Hafensicherheitspatrouillen. Diese Boote müssen sichere Stauräume für Einsatzausrüstung und Waffen, die Kommunikationsanbindung an die Uferleitstelle und ausreichend Deckfläche für Boarding-Teams bieten. Nachteinsatzfähigkeit und eine unauffällige Annäherung sind für Eingriffsmissionen unerlässlich.'
      features:
        - 'Hochgeschwindigkeitsverfolgung — Gleitrumpf mit über 40 Knoten Spitzengeschwindigkeit'
        - 'Sicherer Waffenschrank und Staufächer für Einsatzausrüstung'
        - 'Konsolenintegration für Polizeifunk, MDT und Kommunikationssysteme'
        - 'Nachteinsatz-Paket: IR-Scheinwerfer, FLIR-Halterung, getarnte Beleuchtung'
        - 'Verstärkte Boarding-Plattform mit rutschfester Oberfläche'
        - 'Blau-/Rot-Einsatzbeleuchtung und Sirenensystem'
    - title: 'Freiwillige SAR- & gemeinnützige Organisationen'
      subtitle: 'Förderfinanzierte, gemeindenahe Küsten- und See-Einsätze'
      description: 'Gemeindenahe Rettungsgruppen operieren auf Seen, Flüssen und in Küstengebieten, in denen die staatliche SAR-Abdeckung begrenzt ist. Oft durch Spenden oder staatliche Zuschüsse finanziert, benötigen diese Organisationen maximale Leistung pro Euro — ein zuverlässiges, wartungsarmes Boot, das Freiwillige mit minimaler Spezialausbildung sicher bedienen können. Förderzyklen bedeuten, dass die Boote die Konformitätsanforderungen erfüllen müssen, ohne die festen Budgets zu sprengen.'
      features:
        - 'Einmotorige Konfiguration, optimiert für niedrigere Anschaffungs- und Betriebskosten'
        - 'PVC-Konstruktion für geringeren Wartungsaufwand und einfache Reparaturen vor Ort'
        - 'Multifunktionskonsole mit minimaler elektronischer Komplexität für freiwillige Bediener'
        - 'Dokumentationspaket zur Förderkonformität für Fördermittelanträge'
        - 'Leichtbauweise für den Strandstart ohne eigenen Trailer oder Kran'
    - title: 'Hochwasserrettung & Katastrophenhilfe'
      subtitle: 'Binnenhochwasser, flaches Wasser, treibgutreiche Umgebungen'
      description: 'Hochwasserrettung ist ein eigenständiges Einsatzprofil — die Boote operieren in überfluteten Stadtgebieten, treibgutdurchsetzten Strömungen und extrem flachem Wasser, in dem untergetauchte Hindernisse unsichtbar sind. Die Bediener benötigen Fahrzeuge, die überflutete Straßen befahren, durch Treibgut vorstoßen und Opfer aus Gebäuden und Fahrzeugen retten können. Ein geringer Tiefgang ist ebenso entscheidend wie die Fähigkeit, in strömendem Wasser mit Hängernisiko zu operieren. Diese Boote werden häufig von Feuerwehren, dem Zivilschutz und Katastrophenhilfe-NGOs eingesetzt.'
      features:
        - 'Rumpf mit extrem geringem Tiefgang — einsatzfähig in 30-50 cm Wasser'
        - 'Treibgutabweisender Bug und verstärkter Schlauchschutz für untergetauchte Hindernisse'
        - 'Selbstlenzendes Deck für den Abfluss von Hochwasser und die Opferbergung'
        - 'Leuchtend orange oder gelbe Schläuche für die Sichtbarkeit aus der Luft'
        - 'Leichtbauweise für Hubschraubertransport und Straßenverlegung'
        - 'Verstärkte Hebeösen für Hub- und Seilrettungseinsätze'
