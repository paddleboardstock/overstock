hero:
  tagline: Wassererforschungswissen
  title: Lernen
  subtitle: |
    Anleitungen, Tutorials und tiefgehende Einblicke — alles, was Sie zum Entdecken brauchen<br />
    Mit Vertrauen schwimmen. Vom Auswählen Ihres ersten SUP bis hin zum Beherrschen fortgeschrittener Techniken.
  taglineSection: Wissen für jeden Paddler. Vom Anfänger bis zum Profi.
featured:
  tagline: Ausgewählte Themen
  title: Beginne deine Lernreise
  subtitle: Egal, ob Sie neu im Wassersport sind oder Ihr Niveau steigern möchten, unsere Guides haben alles für Sie abgedeckt.
  items:
    - title: SUP Grundlagen
      description: Alles, was ein Anfänger wissen muss — Bordtypen, Paddelgrößen, Standhaltung und Tipps für den ersten Tag.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Aufblasbar vs. Hardboard
      description: Welche ist die richtige für Sie? Wir vergleichen Tragbarkeit, Leistung, Haltbarkeit und Kosten nebeneinander.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Wassersicherheit
      description: Wesentliches Sicherheitswissen, das jeder Paddler haben sollte – Wetter, Schwimmwesten, Selbstrettung und mehr.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Materialienführer
      description: Drop-stitch Kerne, PVC Laminierungen, EVA Deckschaum — verstehen Sie, woraus Ihr Board besteht.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Größenratgeber
      description: Finden Sie die richtige Boardlänge, -breite und -volumen für Ihr Gewicht, Ihre Fähigkeiten und Ihren Paddelstil.
      icon: tabler:ruler
      href: /size-guide
    - title: Fortgeschrittene Techniken
      description: Verbessern Sie Ihr Paddeln mit fortgeschrittenen Schlägen, Wendetechniken und dem Umgang mit rauem Wasser.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
