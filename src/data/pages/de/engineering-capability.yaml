content_capability:
  tagline: Technische Fähigkeiten
  title: Was unser Engineering<br />Team liefert
  subtitle: Die Technik von Paddle Board Overstock deckt den gesamten Produktlebenszyklus ab – von der Marktforschung und dem Konzeptdesign bis hin zum Prototyping, Testen und der Massenproduktion.
  items:
    - title: Industriedesign
      description: Unser Industriedesign-Team arbeitet auf der Grundlage von Kundenanforderungen, Marktforschung und Wettbewerbsanalysen, um Produktkonzepte zu entwickeln, die Ästhetik, Funktionalität und Herstellbarkeit in Einklang bringen. Wir erstellen 2D-Skizzen, 3D-Renderings und Spezifikationsdokumente zur Überprüfung durch den Kunden, bevor wir uns an die Herstellung von Werkzeugen wenden.
      features:
        - Konzeptentwicklung und Machbarkeitsstudien
        - 2D-Konstruktionszeichnungen und 3D-Renderings
        - Materialauswahl und -spezifikation
        - Fertigungsgerechte Konstruktion (DFM-Analyse)
        - Ergonomische und sicherheitstechnische Bewertung
    - title: Konstruktionstechnik
      description: Unsere Bauingenieure sind auf die Architektur von Schlauchbooten spezialisiert – Rumpfdesign, Rohrkammerkonfiguration, Drop-Stitch-Kerntechnik und Lastverteilung. Jedes Design wird auf strukturelle Integrität, Gewichtsoptimierung und Einhaltung relevanter Standards (CE, ISO, AS) analysiert.
      features:
        - Deep-V-GFK-Rumpfkonstruktion mit berechneten Deadrise-Winkeln
        - Multikammer-Schlauchkonfiguration für Sicherheit und Auftrieb
        - Drop-Stitch-Kernspezifikation und Dichteoptimierung
        - Finite-Elemente-Analyse für tragende Komponenten
        - Gewichtsverteilung und Stabilitätsberechnungen
    - title: 3D-Modellierung und CAD
      description: Alle Produktdesigns werden im 3D-CAD entwickelt, bevor mit der Prototypenfertigung begonnen wird. Unsere Ingenieure verwenden SolidWorks und Rhino 3D für die Produktmodellierung, sodass Kunden jedes Detail – vom Rohrprofil bis zum Konsolenlayout – überprüfen können, bevor sie mit der Produktion beginnen.
      features:
        - Vollständige 3D-CAD-Modellierung in SolidWorks und Rhino 3D
        - Fotorealistische Renderings für Kundenpräsentationen
        - Technische Zeichnungssätze für die Produktion
        - Formen- und Werkzeugkonstruktion aus 3D-Modellen
        - Direkte CAD-zu-CNC-Datenübertragung für präzises Schneiden
    - title: Prototyping und Tests
      description: Vor der Massenproduktion durchläuft jedes neue Produkt die Prototypenphase. Wir bauen funktionale Prototypen zur Kundenbewertung und unterziehen sie dann unserem vollständigen Testprotokoll – Drucktests, Stabilitätstests, Belastungstests und Wasserversuche. Design-Iterationen im Prototypenstadium sind schnell und kostengünstig.
      features:
        - Schnelle Prototyp-Werkzeuge (15-20 Tage Durchlaufzeit)
        - Funktionsprototyp zur realen Evaluierung
        - Vollständiges Testprotokoll vor der Produktionsfreigabe
        - Iterative Konstruktionsverfeinerung auf Basis von Testergebnissen
        - Kundenfreigabe-Meilenstein vor der Produktionswerkzeug-Erstellung
    - title: Benutzerdefinierte Zubehörintegration
      description: Viele OEM-Projekte erfordern die Integration von vom Kunden oder Drittanbietern bereitgestelltem Zubehör – kundenspezifische Konsolen, spezielle Sitze, elektronische Systeme, Halterungen für Tauchausrüstung oder Branding-Elemente. Unser Ingenieurteam verwaltet das Integrationsdesign, die strukturelle Anpassung und die Qualitätsvalidierung aller Zubehörteile.
      features:
        - Konsolkonstruktion und Armaturenbrett-Layout
        - Integration von maßgefertigten Sitzen und Polstern
        - Design und Verkabelung elektronischer Systeme
        - Montagesysteme für Tauch- und Rettungsausrüstung
        - Spezifikationen für Branding- und Grafikanbringung
content_process:
  tagline: Entwicklungsprozess
  title: Vom Konzept<br />bis zur Produktion
  subtitle: Unser Produktentwicklungsprozess folgt einem strukturierten 6-stufigen Arbeitsablauf, der darauf ausgelegt ist, Risiken zu minimieren, Zeitpläne zu verkürzen und die Produktionsbereitschaft vom ersten Tag an sicherzustellen.
  stages:
    - stage: '01'
      title: Anforderungen & Forschung
      duration: 1-2 Wochen
      description: Wir arbeiten mit dem Kunden zusammen, um Produktspezifikationen, Zielmarktanforderungen, Anforderungen zur Einhaltung gesetzlicher Vorschriften und kommerzielle Ziele zu definieren. In dieser Phase wird ein Produktanforderungsdokument (PRD) erstellt, das alle nachfolgenden Arbeiten leitet.
      deliverables: PRD, Marktanalyse, Wettbewerbsbenchmark, vorläufige Kostenschätzung
    - stage: '02'
      title: Konzeptdesign
      duration: 2-3 Wochen
      description: Das Industriedesign-Team entwickelt Produktkonzepte auf Basis des PRD. Mehrere Designoptionen werden mit 3D-Renderings, Materialempfehlungen und ersten technischen Bewertungen präsentiert. Der Kunde wählt die Richtung für die detaillierte Entwicklung.
      deliverables: 3D-Konzeptdarstellungen, Materialspezifikationen, Designbegründung, vorläufige Stückliste
    - stage: '03'
      title: Detailliertes Engineering
      duration: 2-4 Wochen
      description: Das ausgewählte Konzept ist vollständig ausgearbeitet – 3D-CAD-Modellierung, Strukturanalyse, Rohrkonfiguration, Rumpfdesign, Zubehörintegration und Produktionsdokumentation. Für die Werkzeugbestückung sind alle Abmessungen, Materialien und Verfahren spezifiziert.
      deliverables: Vollständiges 3D-CAD-Modell, technische Zeichnungen, endgültige Stückliste, Werkzeugspezifikationen, QC-Plan
    - stage: '04'
      title: Prototypenbau
      duration: 2-3 Wochen
      description: Es werden Prototypenwerkzeuge hergestellt und Funktionsmuster gebaut. Der Kunde überprüft den Prototyp anhand der PRD-Spezifikationen. Die Tests werden gemäß dem vereinbarten Protokoll durchgeführt. Designanpassungen werden auf der Grundlage von Rückmeldungen vor der Produktion von Werkzeugen vorgenommen.
      deliverables: Funktioneller Prototyp, Testbericht, Entwurfsrevisionsprotokoll, Kundenfreigabedokument
    - stage: '05'
      title: Produktionswerkzeuge
      duration: 2-3 Wochen
      description: Sobald der Prototyp genehmigt ist, werden die Produktionswerkzeuge in Betrieb genommen – Formen, Schweißvorrichtungen, Schneidprogramme, Montagevorrichtungen. Die QC-Dokumentation und die Inspektionskriterien sind fertiggestellt. Probelauf zur Prozessvalidierung durchgeführt.
      deliverables: Produktionswerkzeuge, Prozessdokumentation, QC-Inspektionsplan, Testlaufbericht
    - stage: '06'
      title: Massenproduktion und Qualitätskontrolle
      duration: Laufend
      description: Die vollständige Produktion beginnt mit einer prozessbegleitenden Qualitätskontrolle in jeder Phase. Vor der Chargenfreigabe werden Erstartikel geprüft und freigegeben. Kontinuierliche Qualitätsüberwachung, Fehlerverfolgung und kontinuierliche Verbesserung während des gesamten Produktionslebenszyklus.
      deliverables: Produktionsplan, QC-Berichte, Aufzeichnungen zur Chargenrückverfolgbarkeit, Versanddokumentation
content_customization:
  tagline: Anpassungsoptionen
  title: Was kann individuell angepasst werden?
  subtitle: Nahezu jeder Aspekt unserer Produkte kann an die Anforderungen unserer Kunden angepasst werden. Nachfolgend finden Sie die häufigsten Anpassungskategorien.
  columns: 3
  items:
    - title: Rumpf und Struktur
      description: Kundenspezifische Rumpflänge, Strahlbreite, Deadrise-Winkel, Rohrdurchmesser, Kammerkonfiguration und Materialqualität.
      icon: tabler:sailboat
    - title: Farben und Grafiken
      description: Rohrfarbe (PVC/Hypalon), Rumpf-Gelcoat-Farbe, Konsolenfarbe, Deckgrafiken, Logo-Platzierung und Verpackungsdesign.
      icon: tabler:palette
    - title: Konsole und Steuerung
      description: Mittelkonsole, Seitenkonsole oder Pinnensteuerung. Benutzerdefinierte Anordnung der Instrumententafel, Schalterplatzierung und Steuerstandposition.
      icon: tabler:steering-wheel
    - title: Sitze und Polster
      description: Jockeysitze, Sitzbänke, luxuriöse Polsterung, farblich abgestimmte Nähte, klappbare oder abnehmbare Konfigurationen.
      icon: tabler:armchair
    - title: Zubehör und Ausrüstung
      description: Tauchleitern, Flaschenhalter, Schleppmasten, T-Tops, Bimini-Tops, Soundsysteme, Navigationselektronik und Sicherheitsausrüstung.
      icon: tabler:backpack
    - title: Verpackung und Branding
      description: Kundenspezifische Einzelhandelsverpackungen, Private-Label-Boxen, Versandkartons mit Markenzeichen, Hängeetiketten und Benutzerhandbücher in der Sprache des Kunden.
      icon: tabler:box
