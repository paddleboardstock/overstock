services:
  - title: Produktdesign & Engineering
    description: Unser internes F&E-Team entwickelt auf Basis Ihres Konzepts oder Ihrer Spezifikation CAD-Zeichnungen, 3D-Modelle und Prototypen. Wir bieten Formenkonstruktion, Rumpfform-Optimierung und Beratung zur Materialauswahl.
  - title: Custom-Branding & Grafiken
    description: Ganzfarbiger Digitaldruck, Siebdruck, Prägung und Etikettenoptionen. Wir entwickeln markenspezifische Deck-Grafiken, Schlauch-Branding und verkaufsfertige Verpackungen.
  - title: Material- & Spezifikationsanpassung
    description: Wählen Sie aus PVC (Standard, umweltfreundlich, flammhemmend), Hypalon/CSM, Drop-Stitch und Hybridkonstruktionen. Individuelle Schlauchfarben, Stoffgewichte und Verstärkungsoptionen.
  - title: Verpackung & Logistik
    description: Individuelle Handelsverpackungen, Private-Label-Kartons, Vakuumverpackung, Palettierung und Containerbeladung. FOB Qingdao, CIF oder DDP-Versandbedingungen verfügbar.

