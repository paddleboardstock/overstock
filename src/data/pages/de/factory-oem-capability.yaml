why_us:
  - title: Vertikale Integration
    description: Wir besitzen unsere Fabrik, unsere Formen und unsere Lieferkette – keine Zwischenhändler, keine Subunternehmer. Das gibt uns Kontrolle über Qualität, Kosten und Lieferung.
  - title: Doppelzertifizierung
    description: ISO 9001-Qualitätsmanagement- und BSCI-Sozialaudit-Zertifizierung. Fabrikinspektionsberichte auf Anfrage verfügbar.
  - title: CE-Konformität
    description: Alle Standardmodelle tragen die CE-Zertifizierung 2013/53/EU. Sondermodelle können über unseren etablierten Prozess CE-zertifiziert werden.
  - title: Niedriger MOQ
    description: Starten Sie mit nur 5 Einheiten bei Standardmodellen. Wir helfen aufstrebenden Marken, ohne Überinvestition in Lagerbestände zu starten.
