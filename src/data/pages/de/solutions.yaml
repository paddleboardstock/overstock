  items:
    - title: Wassersport-Clubs
      description: 'Komplette Ausrüstungspakete, individuelles Branding und Wartungsprogramme für SUP-Clubs, Kajakclubs, Surfschulen und Trainingszentren.'
      icon: tabler:users
      link: /solutions/clubs
    - title: Wassersport-RIBs
      description: 'Speziell gebaute RIBs für Segelschulen, Wassersportzentren und Eventveranstalter. Coachboote, Zugboote und Sicherheitsboote für den professionellen Wassersport.'
