      link: /solutions/rescue-watercraft
    - title: Tenderlösungen für Yachten
      description: 'Kompakte, stilvolle RIB-Tender, die Superyachten und Freizeitboote ergänzen. Platzsparende Verstauung, kraftvolle Leistung.'
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Lösungen für Fischerboote
      description: 'Stabile, langlebige Schlauchboote und RIBs für kommerzielle und Freizeit-Fischerei.'
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Ausrüstung für den Meerestourismus
      description: 'Flottenbereite Schlauchboote, SUP-Boards und Kajaks für Resorts, Reiseveranstalter und Wassersport-Verleihunternehmen.'
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Offshore-Energie-RIBs
      description: 'Schwerlast-RIBs für die Plattformunterstützung in Öl und Gas, Crew-Transfer zu Windparks, Inspektion von Unterseekabeln und maritime Bauarbeiten.'
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Arbeitsboote für die Aquakultur
      description: 'Korrosionsbeständige RIBs für Fischzucht, Perlenkultivierung und Ocean Ranching. Hypalon-Schläuche, Edelstahlbeschläge, Alltagstauglichkeit.'
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Meeresforschung & Vermessung
      description: 'Stabile, instrumententaugliche RIBs für ozeanografische Forschung, Umweltüberwachung, Wasserqualitätsproben und universitäre Lehre.'
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Kommerzielle Arbeitsboote
      description: 'Schwerlast-RIBs für Patrouille, Vermessung, Transport und Offshore-Logistik. Gebaut für die anspruchsvollen Anforderungen des kommerziellen Betriebs.'
      icon: tabler:ship
      link: /commercial-workboats
