      link: /solutions/resorts
    - title: Wassermarken-Gründer
      description: 'OEM/ODM-Fertigung in Eigenmarke mit niedrigen Mindestbestellmengen, individuellem Produktdesign, Verpackung und weltweitem Versand für neue Markeninhaber.'
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Boote für Tauchzentren
      description: 'Stabile RIB-Plattformen mit leichtem Ein- und Ausstieg, Stauraum für Ausrüstung und Motorkonfigurationen, die für den Tauchbetrieb optimiert sind.'
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Rettungs- und Notfallboote
      description: 'Hochgeschwindigkeits-RIBs und Schlauchboote für Suche und Rettung, Notfalleinsätze und Küstenwachen-Einsätze.'
