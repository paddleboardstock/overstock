content_challenge:
  tagline: Die Herausforderung
  title: 'Yacht-Beiboote erfordern<br />Leistung & Präsentation'
  subtitle: 'Ein Yacht-Beiboot ist mehr als ein Schlauchboot — es ist eine Erweiterung des Mutterschiffs und ein Qualitätsstatement.'
  paragraphs:
    - 'Yachtbesitzer und Kapitäne benötigen Beiboote, die gute Fahreigenschaften bieten, kompakt verstaut werden können und sich hervorragend präsentieren. Das Beiboot sollte die Ästhetik der Yacht ergänzen und gleichzeitig zuverlässigen Transport für Gäste und Crew gewährleisten.'
    - '**Stauraum ist entscheidend** — Das Beiboot muss auf Deck, in einer Garage oder an Davits Platz finden. Das Gewicht ist für Aussetz- und Bergungssysteme von Bedeutung. Paddle Board Overstock-RIBs bieten ein hervorragendes Leistungs-Gewichts-Verhältnis bei kompaktem Stauraumprofil.'
    - '**Die Leistungserwartungen sind hoch** — Gäste erwarten eine ruhige, trockene Fahrt beim Transfer an Land. Die Motoroptionen müssen Geschwindigkeit, Reichweite und Geräuschpegel für ein Premium-Erlebnis in Einklang bringen. Im Charterbetrieb ist das Beiboot täglich im Einsatz und muss häufiger Nutzung standhalten.'
    - '**Das Erscheinungsbild zählt** — Ein nicht passendes oder abgenutztes Beiboot beeinträchtigt die Gesamtpräsentation der Yacht. Individuelle Schlauchfarben, Polster und Branding sorgen dafür, dass das Beiboot wie dazugehörig wirkt.'
content_solution:
  tagline: Unsere Lösung
  title: 'Beiboot-Konfigurationen<br />Für jeden Yacht-Einsatz'
  subtitle: 'Paddle Board Overstock-RIB-Beiboote können an Ihr Schiff, Ihre Betriebsart und Ihre Stauraumanforderungen angepasst werden — von Superyacht-Werftvorgaben bis zu Charterflottenprogrammen.'
  list:
    - 'Individuelle Schlauchfarben passend oder ergänzend zum Mutterschiff — jede RAL-Farbe für Hypalon- oder PVC-Schläuche erhältlich'
    - 'Individuelle Polster und Nähte — Premium-Marinevinyl mit Farbabstimmung und Logostickerei'
    - 'Konsole oder Pinne — wählen Sie je nach Nutzungsmuster und Vorliebe des Bedieners'
    - 'Fiberglas-Tief-V-Rumpf für eine ruhige, trockene Fahrt bei unterschiedlichen Seebedingungen'
    - 'Kompakte Lagerung — lässt sich entleeren oder stapeln für Deckgarage, Staufach oder Davit'
    - 'Hypalon-Schläuche für UV-Beständigkeit und langfristig erhaltenes Erscheinungsbild'
    - 'Hebepunkte und Schleppringe standardmäßig bei allen Modellen'
    - 'Optionale Bugabdeckung, Vollabdeckung und schützende Scheuerschutzpolster'
    - 'Motorleistung: 15 PS bis 60 PS — Außenborder- oder Pinnenkonfigurationen'
    - 'OEM/Private-Label-Branding für Yachtwerften und Marinehändler'
content_segments:
  tagline: Kundengruppen
  title: 'Yacht-Beiboot-Lösungen<br />Nach Kundentyp'
  subtitle: 'Verschiedene Segmente der Yachtbranche haben unterschiedliche Anforderungen. Paddle Board Overstock konfiguriert Beiboote passend zu jedem Einsatzgebiet.'
  items:
    - title: Superyacht-Werften
      subtitle: OEM-Beiboot-Integration — individuelle Maße, Farben und Materialien
      description: 'Yachtwerften stehen vor einer wiederkehrenden Herausforderung: Jedes neue Schiff hat einzigartige Maßvorgaben, Gewichtslimits und ästhetische Erwartungen. Das Beiboot muss perfekt in das Davitsystem des Mutterschiffs integriert werden, exakt in die Garagenmaße passen und der Designsprache einer Multi-Millionen-Euro-Yacht entsprechen. Jede Abweichung — falsche Schlauchfarbe, falsch positionierte Hebepunkte, inkompatibles Gewicht — verzögert die Auslieferung und wirft ein schlechtes Licht auf die Werft. Paddle Board Overstock arbeitet direkt mit den Einkaufs- und Designteams der Werften zusammen, um Beiboote mit individuellen RAL-Schlauchfarben, passenden Polstern, gebrandeten Konsolenpaneelen und vollständigen OEM-Dokumentationspaketen zu liefern.'
      features:
        - 'Individuelle Maßspezifikationen passend zu Garage- und Davitvorgaben'
        - 'Jede RAL-Schlauchfarbe und passende Polster — Design-Freigabemuster werden bereitgestellt'
        - 'OEM-Branding auf Konsole, Schlauch und Rückenlehnen'
        - 'Validierung von Hebepunkten und Davitpassung für jedes Modell'
        - 'Rumpfgewicht optimiert für die vorgegebenen Aussetz- und Bergungssysteme'
        - 'Planung von Sammellieferungen abgestimmt auf die Produktionszeitpläne'
    - title: Yacht-Managementgesellschaften
      subtitle: Flottenstandardisierte Beiboote — weltweiter Support, minimale Ausfallzeiten
      description: 'Managementgesellschaften betreuen mehrere Yachten im Mittelmeer, in der Karibik, im Südpazifik und darüber hinaus. Ihr Kernbedürfnis ist Zuverlässigkeit — ein defektes Beiboot in einem abgelegenen Hafen bedeutet Überstunden für die Crew, Beschwerden von Gästen und teure Ersatzlösungen in letzter Minute. Standardisierte Flottenspezifikationen reduzieren den Schulungsaufwand der Crew über mehrere Schiffe hinweg und vereinfachen die Ersatzteilverwaltung. Paddle Board Overstock bietet Flottenkonditionen für mehrere Schiffe, konsistente Spezifikationen über alle Bestellungen hinweg und weltweiten Ersatzteil-Support für Managementgesellschaften mit Schiffen in mehreren Regionen.'
      features:
        - 'Standardisierte Spezifikationen über die gesamte verwaltete Flotte'
        - 'Austauschbare Ersatzteile für alle Flotten-Beiboote'
        - 'Flottenkonditionen und Mengenrabatte bei Mehrfachbestellungen'
        - 'Weltweite Ersatzteilverfügbarkeit — schneller Versand in jeden Hafen'
        - 'Konsistente Service- und Wartungsdokumentation für die Crew'
        - 'Koordinierte Lieferung mehrerer Einheiten an verschiedene Schiffsstandorte'
    - title: Charterbetreiber
      subtitle: Täglicher Hochfrequenzbetrieb — Langlebigkeit ohne Kompromisse beim Erscheinungsbild
      description: 'Charter-Beiboote haben den anspruchsvollsten Einsatzplan in der Yachtbranche: tägliche Gästetransfers, Landausflüge, Wassersport-Support und Hafen-Shuttle — oft über 200 Einsätze pro Chartersaison. Das Beiboot muss bei jeder Gästesübergabe makellos aussehen und gleichzeitig kontinuierlicher Beladung, Salzwassereinwirkung und Betriebsstunden standhalten. Ein nachlassendes Erscheinungsbild ist ein direktes Geschäftsrisiko — ein abgenutztes Beiboot beeinflusst Gästebewertungen und Charterraten. Paddle Board Overstock konfiguriert Charter-Beiboote mit hochwertigeren Polstern, robusten Hypalon-Schläuchen und verstärkten Handhabungsbereichen für langfristige Haltbarkeit, die die Präsentationsqualität erhält.'
      features:
        - 'Robuste Hypalon-Schläuche — 5-8 Jahre Lebensdauer im täglichen Charterbetrieb'
        - 'Verstärkte Einstiegsstufen und Haltegriffe für häufige Nutzung'
        - 'Premium-Vinylpolster, fleckabweisend — einfache Reinigung zwischen Charterfahrten'
        - 'Leicht zu reinigende, rutschfeste Decksflächen'
        - 'Zuverlässige Außenborderpakete mit einfachem Servicezugang für schnelle Wenden'
        - 'Optisch hochwertige Materialien, die das Erscheinungsbild über mehrere Chartersaisons erhalten'
    - title: Yacht-Händler & Makler
      subtitle: Zuverlässige Beiboot-Lieferung für Schiffsfertigstellung und Wiederverkaufswert
      description: 'Händler und Makler benötigen eine stabile Versorgung mit qualitativ hochwertigen Beibooten, die die von ihnen verkauften Schiffe ergänzen — passend zur Markenpositionierung und zur Verbesserung des Kauferlebnisses. Ein unpassendes Beiboot oder Lieferverzögerungen können eine Yachtübergabe verzögern oder die Präsentation eines Angebots beeinträchtigen. Händler verlangen gleichbleibende Qualität über alle Chargen hinweg, zuverlässige Lieferzeiten und wettbewerbsfähige Preise, um ihre Margen zu sichern. Paddle Board Overstock bietet Händlerbestandsprogramme mit saisonaler Lieferplanung, Co-Branding-Optionen für die Ausstellungspräsentation und bevorzugte Zuteilung während der Hochsaison.'
      features:
        - 'Bestandsprogramme mit auf Anfrage verfügbaren Modellen'
        - 'Saisonale Lieferplanung abgestimmt auf den Übergabekalender'
        - 'Co-Branding für Händler auf Konsole und Schläuchen für die Ausstellungspräsentation'
        - 'Gleichbleibende Qualität und Spezifikation über alle Serienbestellungen'
        - 'Wettbewerbsfähige Händlerpreise mit volumenbasierten Stufen'
