hero:
  tagline: Erfolgsgeschichten
  title: Echte Ergebnisse von Wasserunternehmen
  subtitle: Erfahren Sie, wie Clubs, Resorts und Unternehmer auf der ganzen Welt mit der Ausrüstung und Unterstützung von Aquafarer profitable Wassersportbetriebe aufgebaut haben.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Erfolgsgeschichten von Aquafarer-Kunden
stories:
  - title: Wie ein mediterranes Resort ein profitables SUP-Verleihgeschäft aufbaute
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5-Sterne-Strandresort – Griechenland
    problem: Das Resort benötigte Premium-Wasseraktivitäten für Gäste, um die Zufriedenheitswerte zu steigern und eine neue Einnahmequelle zu schaffen, aber es fehlte an Ausrüstung, Sicherheitsinfrastruktur und Fachwissen des Personals.
    solution: Aquafarer lieferte 50 individuell gebrandete SUP-Boards mit den Farben und dem Logo des Resorts, ein komplettes Sicherheitssystem einschließlich Rettungsschwimmerstation und Bojenleinen sowie ein dreitägiges Schulungsprogramm für das Personal, das den Umgang mit der Ausrüstung, die Einweisung der Gäste und Sicherheitsprotokolle abdeckte.
    result:
      - Über 300 Gästaktivitäten pro Woche bereits im ersten Monat gebucht
      - 'Gastzufriedenheit bei Wasseraktivitäten: 4,8/5'
      - 'Neuer jährlicher Zusatzerlös: 180.000 $'
      - Null Sicherheitsvorfälle in der ersten Betriebssaison
      - Kosten für Ersatzbeschaffung um 40 % gegenüber dem bisherigen Lieferanten gesenkt
    quote:
      text: Aquafarer hat nicht nur Boards geliefert – sie haben uns dabei geholfen, ein umfassendes Gästeerlebnis zu schaffen. Unser Wassersportprogramm hat sich in einer Saison von Null zum Resort-Highlight entwickelt.
      author: Resort-Generaldirektor
    cta_text: Erstellen Sie Ihre Resort-Lösung
    cta_href: /solutions/resorts
  - title: Wie ein australisches Startup in 90 Tagen eine Wassermarke aufbaute
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Erstmaliger Unternehmer – Australien
    problem: Ein Outdoor-Enthusiast wollte seine eigene SUP-Marke für den australischen Markt einführen, hatte aber keine Erfahrung in der Herstellung, keine Lieferantenbeziehungen und nur begrenztes Kapital.
    solution: Das Markeneinführungspaket von Aquafarer umfasste Beratung bei der Produktauswahl, individuelles Logo- und Farbdesign, gebrandete Einzelhandelsverpackungen mit Hängeetiketten, CE-Zertifizierungsdokumentation und FOB-Versand nach Sydney.
    result:
      - Erste Lieferung von 200 Boards in 75 Tagen ab Erstkontakt ausgeliefert
      - Marke innerhalb von 2 Wochen nach Ankunft auf Shopify + Amazon AU gestartet
      - Erstbestand in 45 Tagen ausverkauft
      - 'Durchschnittsmarge: 55 % auf den Einzelhandelspreis'
      - 'Zweite Bestellung: 500 Einheiten innerhalb von 60 Tagen nach dem Launch aufgegeben'
    quote:
      text: Ich hatte die Markenidee, aber keine Kenntnisse in der Herstellung. Aquafarer hielt mich während des gesamten Prozesses buchstäblich an der Hand – von der Auswahl des richtigen Boarddesigns bis zum Auspacken meiner ersten Lieferung. 90 Tage vom Traum bis zur Lieferung.
      author: Gründer der australischen SUP-Marke
    cta_text: Starten Sie Ihre Marke
    cta_href: /solutions/entrepreneurs
  - title: Wie ein thailändischer Strandclub von 10 auf 80 Bretter skalierte
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Wassersportverein – Thailand
    problem: Ein kleiner SUP-Club am Strand in Phuket musste sich von einem Hobbybetrieb zu einem professionellen Vermietungsunternehmen für Touristen entwickeln, konnte aber keinen zuverlässigen Ausrüstungslieferanten mit gleichbleibender Qualität und gleichbleibenden Preisen finden.
    solution: Beginnend mit dem Aquafarer's Club-Starterpaket (10 Boards, Paddel, Sicherheitsausrüstung, Branding) wuchs der Club über 18 Monate hinweg durch das Premium-Paket-Programm.
    result:
      - Von 10 auf 80 Bretter in 18 Monaten skaliert – bei gleichbleibender Qualität und Preisen
      - Kajak- und Tretbootverleih beim selben Lieferanten ergänzt
      - Individuelles Club-Branding steigerte die Markenbekanntheit bei Touristen
      - Wartungskosten um 60 % gegenüber der bisherigen Budgetausrüstung gesenkt
      - Jetzt über 150 Vermietungen pro Tag in der Hochsaison
    quote:
      text: Das Club-Starterpaket war der perfekte Einstieg. Als unser Geschäft wuchs, wuchs Aquafarer mit uns – gleiche Qualität, gleiche Preise, keine Überraschungen.
      author: Clubbesitzer, Phuket
    cta_text: Starten Sie Ihr Club-Paket
    cta_href: /solutions/clubs
  - title: Wie eine karibische Resortkette den Wassersport in 5 Hotels standardisierte
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Resortkette – Karibik
    problem: Eine Luxus-Resort-Kette mit 5 Häusern benötigte eine einheitliche Qualität und Markenbildung der Wassersportausrüstung an allen Standorten, mit zentraler Beschaffung und saisonaler Ersatzplanung.
    solution: Aquafarer lieferte eine Multi-Property-Flotte von 300 SUPs und 100 Kajaks mit einheitlichem Branding, gemeinsamem Ersatzteilbestand und einem jährlichen Austauschplan mit Mengenpreisen.
    result:
      - Standardisiertes Gästeerlebnis in allen 5 Häusern
      - 30 % Kostensenkung durch gebündelte Einkäufe und Mengenrabatte
      - Zentrales Ersatzteillager reduzierte Ausfallzeiten um 80 %
      - Jährliches Programm zur Erneuerung der Ausrüstung beendete den Stress am Saisonende
      - Teilnahme der Gäste am Wassersport stieg um 45 % im Jahresvergleich
    cta_text: Gestalten Sie Ihr Resort-Programm
    cta_href: /solutions/resorts
