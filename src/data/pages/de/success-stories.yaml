hero:
  tagline: Erfolgsgeschichten
  title: Echte Ergebnisse von Wasserunternehmen
  subtitle: See how clubs, resorts, and rental operators around the world built thriving water sports programs with Paddle Board Overstock equipment and support.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Erfolgsgeschichten von Paddle Board Overstock-Kunden
stories:
  - title: Wie ein mediterranes Resort ein profitables SUP-Verleihgeschäft aufbaute
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: 5-Sterne-Strandresort – Griechenland
    problem: Das Resort benötigte Premium-Wasseraktivitäten für Gäste, um die Zufriedenheitswerte zu steigern und eine neue Einnahmequelle zu schaffen, aber es fehlte an Ausrüstung, Sicherheitsinfrastruktur und Fachwissen des Personals.
    solution: Paddle Board Overstock lieferte 50 individuell gebrandete SUP-Boards mit den Farben und dem Logo des Resorts, ein komplettes Sicherheitssystem einschließlich Rettungsschwimmerstation und Bojenleinen sowie ein dreitägiges Schulungsprogramm für das Personal, das den Umgang mit der Ausrüstung, die Einweisung der Gäste und Sicherheitsprotokolle abdeckte.
    result:
      - Über 300 Gästaktivitäten pro Woche bereits im ersten Monat gebucht
      - "Gastzufriedenheit bei Wasseraktivitäten: 4,8/5"
      - "Neuer jährlicher Zusatzerlös: 180.000 $"
      - Null Sicherheitsvorfälle in der ersten Betriebssaison
      - Kosten für Ersatzbeschaffung um 40 % gegenüber dem bisherigen Lieferanten gesenkt
    quote:
      text: Paddle Board Overstock hat nicht nur Boards geliefert – sie haben uns dabei geholfen, ein umfassendes Gästeerlebnis zu schaffen. Unser Wassersportprogramm hat sich in einer Saison von Null zum Resort-Highlight entwickelt.
      author: Resort-Generaldirektor
    cta_text: Erstellen Sie Ihre Resort-Lösung
    cta_href: /solutions/resorts
  - title: Wie ein thailändischer Strandclub von 10 auf 80 Bretter skalierte
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Wassersportverein – Thailand
    problem: Ein kleiner SUP-Club am Strand in Phuket musste sich von einem Hobbybetrieb zu einem professionellen Vermietungsunternehmen für Touristen entwickeln, konnte aber keinen zuverlässigen Ausrüstungslieferanten mit gleichbleibender Qualität und gleichbleibenden Preisen finden.
    solution: Beginnend mit dem Paddle Board Overstock's Club-Starterpaket (10 Boards, Paddel, Sicherheitsausrüstung, Branding) wuchs der Club über 18 Monate hinweg durch das Premium-Paket-Programm.
    result:
      - Von 10 auf 80 Bretter in 18 Monaten skaliert – bei gleichbleibender Qualität und Preisen
      - Added SUP yoga and fitness classes to the weekly schedule
      - Individuelles Club-Branding steigerte die Markenbekanntheit bei Touristen
      - Wartungskosten um 60 % gegenüber der bisherigen Budgetausrüstung gesenkt
      - Jetzt über 150 Vermietungen pro Tag in der Hochsaison
    quote:
      text: Das Club-Starterpaket war der perfekte Einstieg. Als unser Geschäft wuchs, wuchs Paddle Board Overstock mit uns – gleiche Qualität, gleiche Preise, keine Überraschungen.
      author: Clubbesitzer, Phuket
    cta_text: Starten Sie Ihr Club-Paket
    cta_href: /solutions/clubs
  - title: Wie eine karibische Resortkette den Wassersport in 5 Hotels standardisierte
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Resortkette – Karibik
    problem: Eine Luxus-Resort-Kette mit 5 Häusern benötigte eine einheitliche Qualität und Markenbildung der Wassersportausrüstung an allen Standorten, mit zentraler Beschaffung und saisonaler Ersatzplanung.
    solution: Paddle Board Overstock delivered a multi-property fleet of 400 SUPs with unified branding, shared spare parts inventory, and an annual replacement schedule with volume pricing.
    result:
      - Standardisiertes Gästeerlebnis in allen 5 Häusern
      - 30 % Kostensenkung durch gebündelte Einkäufe und Mengenrabatte
      - Zentrales Ersatzteillager reduzierte Ausfallzeiten um 80 %
      - Jährliches Programm zur Erneuerung der Ausrüstung beendete den Stress am Saisonende
      - Teilnahme der Gäste am Wassersport stieg um 45 % im Jahresvergleich
    cta_text: Gestalten Sie Ihr Resort-Programm
    cta_href: /solutions/resorts
