hero:
  tagline: Warum Paddle Board Overstock
  title: Anders gebaut. Für die Ewigkeit gebaut.<br />Die Boards hinter Wasserabenteuern weltweit
  subtitle: Nicht nur eine Fabrik – ein Team aus Paddlern und Ingenieuren, die Premium-Inflatable-SUP-Boards für Familien, Abenteurer und Clubs weltweit entwerfen, testen und bauen.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Fertigungsqualität und Kompetenz von Paddle Board Overstock
pillars:
  tagline: Drei Säulen der Qualität
  title: Warum Paddler weltweit Paddle Board Overstock wählen
  subtitle: ''
  columns: 3
  items:
    - title: Für den gewerblichen Einsatz entwickelt
      description: Unsere Boards sind für jahrelanges regelmäßiges Paddeln entwickelt. Handelsübliche PVC, verstärkte drop-stitch-Kerne, UV-stabile Materialien und feldgetestetes Zubehör bedeuten weniger Wartung und längere Lebensdauer auf dem Wasser.
      icon: tabler:building-factory
      callToAction:
        text: Gewerbliche Produktlinie ansehen
        href: /products
    - title: Über Standards hinaus getestet
      description: Jedes Board wird auf 1,25-mal den angegebenen Druck für 24-48 Stunden aufgepumpt, bevor es unsere Fabrik verlässt – 100% druckgeprüft, 99,3% fehlerfrei. Ihr Board ist bewährt robust, bevor es das erste Mal auf dem Wasser ist.
      icon: tabler:shield-check
      callToAction:
        text: Sehen Sie, wie wir testen
        href: /quality
    - title: Für globale Bedingungen gebaut
      description: 'Produkte für jedes Klima optimiert: Kaltwasser-PVC-Formulierungen für Europa, UV-beständige Materialien für den Nahen Osten und Australien, Anti-Feuchtigkeits-Behandlungen für Südostasien. Jede Lieferung wird auf ihre Zielregion abgestimmt.'
      icon: tabler:world
