hero:
  tagline: Warum Paddle Board Overstock
  title: 'Anders gebaut. Fürs Geschäft gebaut.<br />Der Partner für Wasserabenteuer weltweit'
  subtitle: 'Nicht nur ein Hersteller – ein Geschäftspartner, der Ausrüstung in Profiqualität für Clubs, Resorts, Verleihbetreiber und aufstrebende Wassermarken entwirft, entwickelt und liefert.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Fertigungsqualität und Kompetenz von Paddle Board Overstock

pillars:
  tagline: Drei Säulen der Partnerschaft
  title: Warum sich Wassergeschäfte weltweit für Paddle Board Overstock entscheiden
  subtitle: ''
  columns: 3
  items:
    - title: Für den gewerblichen Einsatz entwickelt
      description: 'Unsere Ausrüstung ist für den täglichen Verleih konzipiert, nicht für das Wochenendvergnügen. PVC in Profiqualität, verstärkte Drop-Stitch-Kerne, UV-stabile Hypalon-Optionen und praxiserprobtes Zubehör bedeuten geringeren Wartungsaufwand, längere Lebensdauer und höhere Rentabilität für Ihren Betrieb.'
      icon: tabler:building-factory
      callToAction:
        text: Gewerbliche Produktlinie ansehen
        href: /products
    - title: Von der Idee zum Markt
      description: 'Starten Sie Ihre Wassersportmarke in 90 Tagen. Wir begleiten Sie durch jeden Schritt: Konzeptvalidierung, Produktauswahl, Prototyp, Produktion, Verpackungsdesign und weltweiter Versand. Kein Mindestbestellmengen-Zwang – klein starten, souverän skalieren.'
      icon: tabler:rocket
      callToAction:
        text: Starten Sie Ihre Markenreise
        href: /oem-odm-blueprint
    - title: Für globale Bedingungen gebaut
      description: 'Produkte für jedes Klima optimiert: Kaltwasser-PVC-Formulierungen für Europa, UV-beständige Materialien für den Nahen Osten und Australien, Anti-Feuchtigkeits-Behandlungen für Südostasien. Jede Lieferung wird auf ihre Zielregion abgestimmt.'
      icon: tabler:world

