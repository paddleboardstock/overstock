hero:
  tagline: Warum Paddle Board Overstock
  title: Built Different. Built to Last.<br />The Boards Behind Water Adventures Worldwide
  subtitle: Not just a factory — a team of paddlers and engineers who design, test, and build premium inflatable SUP boards for families, adventurers, and clubs worldwide.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Fertigungsqualität und Kompetenz von Paddle Board Overstock
pillars:
  tagline: Three Pillars of Quality
  title: Why Paddlers Worldwide Choose Paddle Board Overstock
  subtitle: ""
  columns: 3
  items:
    - title: Für den gewerblichen Einsatz entwickelt
      description: Our boards are engineered for years of regular paddling. Commercial-grade PVC, reinforced drop-stitch cores, UV-stable materials, and field-tested hardware mean lower maintenance and a longer life on the water.
      icon: tabler:building-factory
      callToAction:
        text: Gewerbliche Produktlinie ansehen
        href: /products
    - title: Tested Beyond Standards
      description: Every board is inflated to 1.25x its rated pressure for 24-48 hours before it leaves our factory — 100% pressure-tested, 99.3% defect-free. Your board is proven tough before it ever hits the water.
      icon: tabler:shield-check
      callToAction:
        text: See how we test
        href: /quality
    - title: Für globale Bedingungen gebaut
      description: "Produkte für jedes Klima optimiert: Kaltwasser-PVC-Formulierungen für Europa, UV-beständige Materialien für den Nahen Osten und Australien, Anti-Feuchtigkeits-Behandlungen für Südostasien. Jede Lieferung wird auf ihre Zielregion abgestimmt."
      icon: tabler:world
