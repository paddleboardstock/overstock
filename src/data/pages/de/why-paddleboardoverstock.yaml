reasons:
  tagline: Der Paddle Board Overstock-Unterschied
  title: Was uns auszeichnet
  isBeforeContent: false
  columns: 3
  items:
    - title: Echte Fertigung, kein Handel
      description: Wir besitzen und betreiben eine 12.000 m² große Fabrik. Als Partner von Paddle Board Overstock arbeiten Sie direkt mit den Menschen zusammen, die Ihre Produkte entwerfen, entwickeln und bauen – ohne Zwischenhändler.
      icon: tabler:building-factory
    - title: Engineering-getriebener Ansatz
      description: Unser Designprozess beginnt mit dem Verwendungszweck, nicht mit der Produktkategorie. Wir optimieren Rumpfform, Materialauswahl und Konfiguration für die tatsächliche Nutzung des Boards auf dem Wasser.
      icon: tabler:engine
    - title: Bewährte Qualität
      description: Jedes Board wird vor dem Versand auf 1,25-mal den angegebenen Druck für 24-48 Stunden getestet, und 99,3% unserer Lieferungen kommen fehlerfrei an – unterstützt durch unsere Garantie.
      icon: tabler:award
    - title: Paddler-freundliches Design
      description: 'Jedes Modell beginnt mit dem Paddelstil: stabile Plattformen für Anfänger, stromlinienförmige Shapes für Touren und full-size Decks für Yoga. Wir entwerfen für echte Paddler, nicht für Showroom-Spezifikationen.'
      icon: tabler:adjustments
    - title: Globale Logistik
      description: US-Lager in Kalifornien, direkter Versand aus Weihai, Luftfracht für Eilaufträge. Wir übernehmen Zollformalitäten und Dokumentation weltweit.
      icon: tabler:truck-delivery
    - title: Lebenslanger Support
      description: Wir stehen hinter Boards, die wir vor 20 Jahren gebaut haben. Echte Ersatzteile, technischer Rat, Reparaturanleitungen – unser Team ist da, wenn Sie uns brauchen, egal wo Sie sind.
      icon: tabler:lifebuoy
testimonials:
  tagline: Weltweit von Paddlern vertraut
  title: Was Paddler sagen
  items:
    - content: Mein Ocean Voyager hat alles gemeistert, von ruhigen Morgens auf dem See bis zu unruhigen Nachmittagen an der Küste. Nach zwei Saisons sieht es immer noch aus und fährt wie neu.
      name: — Freizeitpaddler, Kalifornien
    - content: Ich war nervös, mein erstes Inflatable-Board online zu kaufen, aber die Qualität war sofort erkennbar, als ich es aufpumpte. Stabil, fest und wunderschön verarbeitet.
      name: — Erster SUP Besitzer, Deutschland
    - content: Wir paddeln jeden Sommerwochenende als Familie. Drei Boards, null Probleme, und die Kinder lieben das leuchtende Design.
      name: — Familienpaddler, Australien
    - content: Der Drucktest ist kein Marketingtrick – mein Board ist bei vollem Druck bombenfest und zeigt nach einem Jahr wöchentlichen Paddelns keinerlei Dehnung.
      name: — Wöchentlicher Paddler, Niederlande
