reasons:
  tagline: Der Paddle Board Overstock-Unterschied
  title: Was uns auszeichnet
  isBeforeContent: false
  columns: 3
  items:
    - title: Echte Fertigung, kein Handel
      description: 'Wir besitzen und betreiben eine 12.000 m² große Fabrik. Als Partner von Paddle Board Overstock arbeiten Sie direkt mit den Menschen zusammen, die Ihre Produkte entwerfen, entwickeln und bauen – ohne Zwischenhändler.'
      icon: tabler:building-factory
    - title: Engineering-getriebener Ansatz
      description: 'Unser Designprozess beginnt beim Einsatzzweck, nicht bei der Produktkategorie. Wir optimieren Rumpfform, Materialauswahl und Konfiguration für den tatsächlichen Einsatz in gewerblichen Umgebungen.'
      icon: tabler:engine
    - title: Zertifizierte Qualität
      description: 'CE-zertifiziert, ISO-Qualitätssystem, BSCI-konform, REACH-konform, USCG-zugelassen. Jedes Produkt erfüllt internationale Standards – nicht nur Behauptungen.'
      icon: tabler:certificate
    - title: Flexibles OEM/ODM
      description: 'Rohrfarben, Konsolenlayout, Branding, Verpackung – wir passen alles an Ihre Vorgaben an. Kein Mindestbestellmengen-Zwang. Mit einem Prototyp starten, souverän skalieren.'
      icon: tabler:adjustments
    - title: Globale Logistik
      description: 'US-Lager in Kalifornien, direkter Versand aus Qingdao, Luftfracht für Eilaufträge. Wir übernehmen Zollformalitäten und Dokumentation weltweit.'
      icon: tabler:truck-delivery
    - title: Lebenslanger Support
      description: 'Wir unterstützen Boote, die wir vor 20 Jahren gebaut haben. Echte Ersatzteile, technische Beratung, Reparaturanleitungen – unser Team ist für Sie da, wann und wo immer Sie uns brauchen.'
      icon: tabler:lifebuoy

testimonials:
  tagline: Marken weltweit vertrauen uns
  title: Was unsere Partner sagen
  items:
    - content: 'Wir haben mit mehreren Herstellern in China zusammengearbeitet, aber Paddle Board Overstock sticht durch technische Unterstützung und gleichbleibende Qualität hervor. Sie behandeln unsere Marke wie ihre eigene.'
      name: '— OEM-Partner, europäische Wassersportmarke'
    - content: 'Ihre Hypalon-RIBs sind seit über 5 Jahren in unserer Flotte im Einsatz. Minimaler Wartungsaufwand, hervorragende UV-Beständigkeit. Die 5-Jahres-Garantie auf die Schläuche gibt uns Sicherheit.'
      name: '— Flottenbetreiber, Resort-Gruppe im Nahen Osten'
    - content: 'Das Paddle Board Overstock-Team hat uns geholfen, ein individuelles SUP-Board-Design in 90 Tagen von der Konzeption bis zur Produktion zu entwickeln. Die Qualität hat unsere Erwartungen übertroffen.'
      name: '— Händler, australischer Wassersport'
    - content: 'Als Inhaber eines kleinen Unternehmens hatte ich Bedenken wegen der Mindestbestellmengen. Paddle Board Overstock hat mit meinem Budget gearbeitet und mir geholfen, meine Marke mit nur 50 Boards zu launchen. Jetzt bestelle ich 500.'
      name: '— Markengründer, US-SUP-Verleihfirma'

