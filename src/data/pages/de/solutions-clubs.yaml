testimonial:
  content: Wir begannen mit dem Club-Starterpaket für unsere Surfschule in Portugal. 20 Boards, Paddel, Westen – alles innerhalb von 3 Wochen angekommen. Nach zwei Saisons haben wir ein Upgrade auf das Pro-Paket durchgeführt. Das individuelle Branding mit unserem Logo hat unser professionelles Image entscheidend verändert.
  name: Ricardo Santos
  title: Inhaber, Algarve Surf Academy – Lagos, Portugal
content_segments:
  tagline: Clubprofile
  title: Wassersport-Club-Lösungen<br />Nach Clubtyp
  subtitle: Von universitären Paddelclubs bis hin zu exklusiven privaten Yachtclubs – jede Art von Club hat einzigartige Anforderungen an die Ausrüstung, Nutzungsmuster und Budgetstrukturen. Wir passen jedes Paket individuell an das Vereinsmodell an.
  items:
    - title: Paddelclubs an Universitäten und Hochschulen
      subtitle: Studentenflotten mit hoher Auslastung
      description: Von Studenten geführte oder von Institutionen unterstützte Paddle-Clubs, die SUP-Programme für Universitätsfreizeitabteilungen betreiben. Die Ausrüstung wird jedes Semester auf mehreren Fertigkeitsstufen häufig genutzt und häufig ausgetauscht. Haltbarkeit und einfache Reparierbarkeit sind entscheidend, ebenso wie budgetfreundliche Preise für Studentenorganisationen.
      features:
        - Extra-robuste PVC-Konstruktion, ausgelegt für Studentennutzungzyklen
        - Farbcodierte Board-Serien nach Fertigkeitsstufe für einfache Flottenverwaltung
        - Reparaturset + mit Video-Support auf Abruf bei jeder Bestellung inbegriffen
        - Rabattpreise für Studentenorganisationen und semesterbasierte Zahlungsbedingungen
    - title: Community-Paddle & Social Clubs
      subtitle: Von der Mitgliedschaft getragene Freizeitclubs
      description: Gemeinschaftsbasierte Vereine, die SUP und soziale Paddelerlebnisse für Mitglieder anbieten. Die Ausrüstung muss Leistung und Komfort für ein breites Alterssegment ausbalancieren, mit Branding, das die Vereinsidentität und den Stolz der Mitglieder fördert. Speichereffizienz ist entscheidend für Vereine mit begrenztem Zugang zum Wasser.
      features:
        - 'Gemischte Flotte: Allround- und Touring-SUPs'
        - 'Vollständiges Vereinsbranding: individuelle Farben, Logoaufdruck, gebrandete Schwimmwesten'
        - Kompakte Lagerlösungen für aufblasbare Ausrüstung
        - 'Starterkit für Mitgliederwachstum: Empfehlungskarten, gebrandete Fotografie'
    - title: Surfschulen & SUP-Akademien
      subtitle: Küstenleistung und Coaching
      description: Auf Surfen fokussierte Schulen lehren SUP-Surfen und Wellenreittechniken. Die Ausrüstung muss unter Surfbedingungen funktionieren – wendig, reaktionsschnell und robust genug, um wiederholte Stürze, Sandabrieb und Salzwassereinwirkung ohne schnelle Abnutzung zu überstehen.
      features:
        - Kürzere, breitere SUP-Formen, optimiert für Surfmanövrierbarkeit
        - Verstärkte Rails für Stoßfestigkeit in Wellen
        - 'Surfspezifische Sicherheitsausrüstung: Coiled-Leashes, Soft-Fin-Optionen'
        - Flottenaustauschprogramm mit saisonalen Trade-in-Rabatten
    - title: Firmen- und private Yachtclubs
      subtitle: Erfahrungen für Premium-Mitglieder
      description: Exklusive Privatclubs, die Wassersport als Premium-Angebot für Mitglieder anbieten. Die Ausstattungsstandards sind hoch – Ästhetik, Markenausrichtung und gastgerechte Präsentation sind ebenso wichtig wie Leistung. Zu den Serviceerwartungen gehören eine erstklassige Lieferung, maßgeschneiderte Lagerlösungen und Support auf Concierge-Ebene.
      features:
        - Premium-Boards mit Holzmaserung EVA und Metallic-Akzenten
        - Individuelle Farbanpassung gemäß Vereinsrichtlinien
        - 'Concierge-Lieferung: voraufgepumpt, bereitgestellt und für jede Saison gekennzeichnet'
        - Dediziertes Account-Management mit Prioritätsreaktionszeiten
