hero:
  tagline: Wassersportvereine
  title: Ausrüstung und Lösungen<br />Für Paddelclubs und Trainingszentren
  subtitle: Komplette Ausrüstungspakete, Lehrerausrüstung, Branding und Wartungsunterstützung für SUP-Clubs, Kajakclubs, Surfschulen und Wassersport-Trainingszentren jeder Größe.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP-Boards für Wassersportvereine und Verleihflotten
direct_answer: Aquafarer bietet umfassende Ausrüstungslösungen für Wassersportvereine und Trainingszentren weltweit. Unsere Clubpakete umfassen SUP-Boards, Kajaks, Paddel, Pumpen, Reparatursets und Sicherheitsausrüstung zu wettbewerbsfähigen Großhandelspreisen mit niedrigen Mindestbestellmengen. Jedes Paket kann mit Vereinslogos, Markenfarben und einer personalisierten Verpackung individuell gestaltet werden. Wir bieten außerdem Wartungsschulungen, Ersatzteilunterstützung und Geräterotationsprogramme an, um die Lebensdauer Ihrer Flotte zu maximieren.
solution_offerings:
  - title: Club-Starterpaket
    subtitle: Für aufstrebende Clubs mit 10–30 Mitgliedern
    badge: Best Seller
    features:
      - title: Kernausrüstung
        description: 10–30 SUP-Boards oder Kajaks mit passenden Paddeln, Pumpen und Reparatursets
      - title: Sicherheitsausrüstung
        description: Schwimmwesten, Pfeifen, Leinensets in Vereinsfarben für jedes Board
      - title: Ausbilderausrüstung
        description: Busspezifische Boards mit rutschfesten Decks und zusätzlicher Stabilität
      - title: Branding-Paket
        description: Individueller Logodruck auf Boards, Paddeln und Verpackungen
      - title: Schulungsmaterialien
        description: Unterrichtsleitfäden für Anfänger, Sicherheitsprotokolle und Wartungschecklisten
    cta_text: 'Mein Club-Paket zusammenstellen'
    cta_href: /contact
  - title: Club-Premium-Paket
    subtitle: Für etablierte Clubs und Betreiber mit mehreren Standorten
    badge: Professional
    features:
      - title: Volle Flotte
        description: 30–100 gemischte Flotte von SUPs, Kajaks und Zubehör
      - title: Fortschrittliches Sicherheitssystem
        description: RFID-Geräteverfolgung, Schadensmelde-App, Sicherheitsbeschilderung
      - title: Mitarbeiterschulung
        description: Vor-Ort-Workshop zur Zertifizierung von Ausbildern und zur Wartung der Ausrüstung
      - title: Marketingunterstützung
        description: Professionelle Fotografie, Broschüren und Social-Media-Vorlagen
      - title: Ersatzprogramm
        description: Jährliche Geräteaktualisierung zu ermäßigten Konditionen mit Inzahlungnahmeoptionen
    cta_text: 'Meinen Club ausbauen'
