testimonial:
  content: Wir begannen mit dem Club-Starterpaket für unsere Surfschule in Portugal. 20 Boards, Paddel, Westen – alles innerhalb von 3 Wochen angekommen. Nach zwei Saisons haben wir ein Upgrade auf das Pro-Paket durchgeführt. Das individuelle Branding mit unserem Logo hat unser professionelles Image entscheidend verändert.
  name: Ricardo Santos
  title: Inhaber, Algarve Surf Academy – Lagos, Portugal
content_segments:
  tagline: Clubprofile
  title: Lösungen für Wassersportclubs<br />Nach Clubtyp
  subtitle: Von universitären Paddelclubs bis hin zu exklusiven privaten Yachtclubs – jede Art von Club hat einzigartige Anforderungen an die Ausrüstung, Nutzungsmuster und Budgetstrukturen. Wir passen jedes Paket individuell an das Vereinsmodell an.
  items:
    - title: Paddelclubs an Universitäten und Hochschulen
      subtitle: Studentenflotten mit hoher Auslastung
      description: Von Studenten geführte oder von Institutionen unterstützte Paddelclubs, die SUP- und Kajakprogramme für die Freizeitabteilungen der Universitäten anbieten. Die Geräte werden jedes Semester häufig und mit hoher Fluktuation über mehrere Qualifikationsniveaus hinweg genutzt. Haltbarkeit und einfache Reparaturfähigkeit sind neben budgetfreundlichen Preisen für Studentenorganisationen von entscheidender Bedeutung.
      features:
        - 'Extra-robuste PVC-Konstruktion, ausgelegt auf studentische Nutzungszyklen'
        - 'Farbcodierte Board-Serien nach Können für einfaches Flottenmanagement'
        - 'Reparaturset + Video-Support auf Abruf bei jeder Bestellung inklusive'
        - 'Rabattpreise für Studierendenorganisationen und semesterbasierte Zahlungsbedingungen'
    - title: Community-Paddle & Social Clubs
      subtitle: Von der Mitgliedschaft getragene Freizeitclubs
      description: Community-basierte Clubs, die ihren Mitgliedern SUP-, Kajak- und soziale Paddelerlebnisse anbieten. Die Ausrüstung muss Leistung und Komfort für ein breites Altersspektrum vereinen und mit einem Branding versehen sein, das die Vereinsidentität und den Stolz der Mitglieder fördert. Für Clubs, die nur über begrenzten Zugang zum Wasser verfügen, ist die Effizienz der Lagerung von entscheidender Bedeutung.
      features:
        - 'Gemischte Flotte: Allround-SUPs, Touring-Boards und Freizeit-Kajaks'
        - 'Komplettes Club-Branding: individuelle Farben, Logodruck, gebrandete Rettungswesten'
        - 'Kompakte Lagerlösungen für aufblasbare Ausrüstung'
        - 'Starterkit für Mitgliederwachstum: Empfehlungskarten, gebrandete Fotografie'
    - title: Surfschulen und Surf-Kajak-Akademien
      subtitle: Küstenleistung und Coaching
      description: Surforientierte Schulen, die SUP-Surfen, Surfkajakfahren und Wellenreiten vermitteln. Die Ausrüstung muss unter Surfbedingungen funktionieren – manövrierfähig, reaktionsfähig und langlebig genug, um wiederholten Wassereinbrüchen, Sandabrieb und Salzwassereinwirkung ohne schnelle Verschlechterung standzuhalten.
      features:
        - 'Kürzere, breitere SUP-Shapes, optimiert für Manövrierfähigkeit in der Welle'
        - 'Verstärkte Rail-Konstruktion für Impactfestigkeit in Wellen'
        - 'Surfspezifische Sicherheitsausrüstung: Spiralleashes, Flexible-Finne-Optionen'
        - 'Flotten-Erneuerungsprogramm mit saisonalen Inzahlungsnahme-Rabatten'
    - title: Firmen- und private Yachtclubs
      subtitle: Erfahrungen für Premium-Mitglieder
      description: Exklusive Privatclubs, die Wassersport als Premium-Angebot für Mitglieder anbieten. Die Ausstattungsstandards sind hoch – Ästhetik, Markenausrichtung und gastgerechte Präsentation sind ebenso wichtig wie Leistung. Zu den Serviceerwartungen gehören eine erstklassige Lieferung, maßgeschneiderte Lagerlösungen und Support auf Concierge-Ebene.
      features:
        - 'Boards mit Premium-Finish in Holzmaserungs-EVA und Metallic-Akzenten'
        - 'Individuelle Farbabstimmung nach den Markenrichtlinien des Clubs'
        - 'Concierge-Lieferung: vorgefüllt, bereitgestellt und für jede Saison etikettiert'
        - 'Dediziertes Kontomanagement mit vorrangigem Reaktions-SLA'
