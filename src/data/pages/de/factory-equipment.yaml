hero:
  tagline: Ausrüstung
  title: Fertigungsausrüstung und Maschinen
  subtitle: Industriegeräte in den Bereichen Schneiden, Schweißen, Drucken und Montage
  back_label: Zurück in die Fabrik
  back_link: /factory
categories:
  - title: Schneiden und Materialvorbereitung
    items:
      - name: Automatische PVC Schneidemaschine
        spec: CNC-kontrolliert, 6,5 m × 2,5 m, 0,1 mm Genauigkeit
        desc: Computergesteuerte automatische Schneidemaschine PVC für und drop-stitch Stoffe. Verschachtelungssoftware optimiert den Materialverbrauch auf unter 5 % Abfall.
      - name: Stoffverbreiter
        spec: 3 m maximale Breite, spannungsgesteuerter Zufuhr
        desc: Legt den Stoff vor dem Zuschneiden in Einzel- oder Mehrschichten mit kontrollierter Spannung, um Verzerrung zu verhindern.
  - title: Schweißen und Zusammenkleben
    items:
      - name: Hitzeversiegelungsmaschine
        spec: Heißluftschweißen, variable 200–600 °C, 0,5–5 m/min
        desc: Heißluft-Hitzedichtungsmaschine zum Verkleben und Schweißen PVC von Laminaten, Schienenbändern und Kammernähten. Verwendet zum Heften, Abdichten und Verschmelzen drop-stitch von Kernverbindungen.
      - name: Dielektrische HF-Presse
        spec: 15 kW, Platen 2000 × 600 mm
        desc: Radiofrequenz-Schweißpresse für Hauptlängsnähte, Transom-zu-Röhren-Verbindungen und Großkammerfertigung.
      - name: CNC- Gesteuerter RF-Schweißer
        spec: 8 kW, XY-Tisch 2500 × 1200 mm
        desc: Programmierbares Schweißen mit gebogenen Nähten für komplexe Geometrien, Logoprägung und präzises Flickwerk.
  - title: Deckkunst & Fertigstellung
    items:
      - name: EVA Deck-Schneidemaschine
        spec: CNC Messerschnitt, 2 m Breite
        desc: Präzises EVA Zuschneiden von Deckschaumplatten für Art-Series-Deckmuster. Jedes Panel wird für eine nahtlose Komplettmontage zugeschnitten.
      - name: Deck-Laminationspresse
        spec: Temperatur- und Drucksteuerung
        desc: Er verbindet EVA die Deckplatten mit gleichmäßiger Haftung über die gesamte Deckfläche an der Brettoberfläche.
  - title: SUP Druck und Dekoration
    items:
      - name: Digitaldrucker
        spec: Hochauflösender Tintenstrahl, bis zu 2 m Druckbreite
        desc: Direkt-auf-Stoff-Digitaldruck für vollfarbige SUP Deckgrafiken. Druckt individuelle Muster, Farbverläufe und fotostarke Bilder mit UV wasserbasierten Tinten.
      - name: Siebdruckmaschine
        spec: Manuelle und halbautomatische Mehrfarb-Zulassung
        desc: Siebdruck für SUP Kartonlogos, Markenmarken und wiederkehrende Muster. Liefert langlebige, deckende Drucke mit lebendiger Farbsättigung.
  - title: Endversammlung
    items:
      - name: Ventildrehmomentstation
        spec: Kalibrierter, 10-Takt-Funktionstest
        desc: Er installiert und dreht die Aufblasventile an, dann funktionstest er jedes Ventil durch 10 Öffnungs-/Schließzyklen.
      - name: Fin Box & D-Ring Setter
        spec: Jig-ausgerichtet, Klebstoff ausgehärtet
        desc: Positioniert und verbindet Finnenboxen, D-Ringe und Griffe an exakten Deckpositionen gemäß Modellspezifikation.
  - title: Prüfung und Qualitätskontrolle
    items:
      - name: Universeller Zugtester
        spec: 50 kN Kapazität
        desc: Bruchkraft, Verlängerung beim Bruch und Rissausbreitungstests für Stoffchargen.
      - name: Luftretentionstestanlage
        spec: Programmierbar, 30-minütiges Druckhalten
        desc: Automatischer Druckhalttest für jede Rohrkammer vor der Montage.
      - name: Naht-Peel-Tester
        spec: Motorisierter 180°-Abzug mit 100 mm/min
        desc: Schweiß- und Klebnaht-Peel-Festigkeitstests gemäß internem Protokoll.
      - name: Xenon-Arc-Verwitterungskammer
        spec: 2000 H Belichtung
        desc: UV Widerstandstests auf Farbveränderung und Festigkeitsfesthalt.
