content_tiers:
  tagline: Laden Sie Ebenen herunter
  title: Vier Zugriffsebenen<br /> – Das richtige Detail für die richtige Bühne
  subtitle: Wir liefern Zeichnungen auf Beschaffungsebene, keine Dateien auf Fertigungsebene. Jede Stufe entspricht einer anderen Projektphase.
  items:
    - title: Stufe 1 – Öffentliches PDF
      description: Gesamtanordnung (GA), 4-Ansichten-Maßzeichnung und Decklayout im PDF-Format. Verfügbar zum kostenlosen Download. Ausreichend für die Projektplanung, Raumzuteilung und vorläufige Spezifikationsprüfung.
      icon: tabler:file-type-pdf
    - title: Stufe 2 – Leichte Form DXF/DWG
      description: 2D-CAD-Dateien (DXF oder DWG) für die Layoutintegration auf Planungsebene. Erfordert ein kurzes Qualifikationsformular (Firmenname, Projekttyp, Verwendungszweck). Keine Struktur- oder Fertigungsdaten enthalten.
      icon: tabler:file-code
    - title: Stufe 3 – Projektantrag STEP/IGES
      description: 3D-Modelldateien (STEP oder IGES) für Systemintegration, Ausstattungsdesign oder Marinearchitekturkoordination. Erfordert einen Projektantrag mit Umfang, Zeitplan und Kaufabsicht. Vorbehaltlich der Genehmigung.
      icon: tabler:cube
    - title: Stufe 4 – NDA Engineering
      description: Rumpfkonstruktionszeichnungen, Laminierungspläne, Erweiterungen zum Rohrschneiden und Formdaten. Nur unter NDA mit bestätigten Bestellungen verfügbar. Hierbei handelt es sich um Dateien auf Fertigungsebene – nicht für die öffentliche Verbreitung.
      icon: tabler:lock
content_included:
  tagline: Was ist enthalten
  title: Zeichnungsinhalte<br />Pro Modell
  subtitle: Jedes Modell verfügt über ein Standardzeichnungspaket, das die wesentlichen Planungsinformationen für B2B-Einkäufer und Projektingenieure abdeckt.
  items:
    - title: Allgemeine Vereinbarung (GA)
      description: Seitenprofil, Draufsicht und Querschnitt mit Darstellung der Rumpfform, der Rohrposition, der Konsolenposition, der Bestuhlung, des Kraftstoffsystems und der wichtigsten Abmessungen (LOA, Breite, Rohrdurchmesser, Totwinkel). Revisionsstatus und Urheberrecht sind im Titelblock vermerkt.
      icon: tabler:layout
    - title: 4-Ansicht-Maßzeichnung
      description: Seiten-, Vorder-, Rück- und Draufsicht mit Gesamtabmessungen für die Transportplanung (Höhe des Anhängers, Träger für Container, Gewicht zum Heben). Beinhaltet Betriebs- und Transportkonfigurationen.
      icon: tabler:ruler-2
    - title: Decklayout und Ausrüstungsplan
      description: Ansicht des Decks von oben nach unten mit Konsolenbasis, Sitzpositionen, D-Ring-Positionen, Positionen der Navigationslichter, Zugang zur Bilgenpumpe, Batterie-/Kraftstofffach und Ausrüstungsbefestigungspunkten. Begrenzte Präzision bei proprietären Schnittstellen.
      icon: tabler:map
    - title: Transport- und Verpackungszeichnung
      description: Containerladeplan, Wiegenabmessungen, Gewichtsverteilung und Hebepunktpositionen für die Logistikplanung. Beinhaltet Standard- und kundenspezifische Verpackungsoptionen.
      icon: tabler:truck
content_protection:
  tagline: IP-Schutz
  title: Was wir nicht teilen<br />und warum
  subtitle: Durch den Schutz unseres technischen geistigen Eigentums stellen wir sicher, dass wir weiterhin in Forschung und Entwicklung investieren und gleichzeitig den Käufern alles bieten können, was sie für die Projektplanung benötigen.
  items:
    - title: Kerndaten der Rumpfform
      description: Plug-and-Mold-Geometrie, CNC-Werkzeugwege und Laminierungsvorlagen sind proprietäre Fertigungsressourcen. Sie werden auf keiner Zugriffsebene außerhalb bestätigter NDA-Verträge weitergegeben.
      icon: tabler:ban
    - title: Erweiterungen zum Rohrschneiden
      description: Bei Schnittdateien für Flachmuster für Schlauchgewebe handelt es sich um Daten auf Fertigungsebene. Nur unter NDA mit bestätigten Produktionsaufträgen verfügbar und nur mit der Vertragspartei geteilt.
      icon: tabler:ban
    - title: Strukturberechnungen
      description: Detaillierte Belastungsanalysen, FEA-Ergebnisse und Laminatpläne sind Compliance-relevante Dokumente, die während des Konformitätsbewertungsprozesses nur an benannte Stellen und NDA-gebundene Kunden weitergegeben werden.
      icon: tabler:ban
    - title: Wettbewerber-Screening
      description: Wir behalten uns das Recht vor, CAD-Zugriffsanfragen abzulehnen, die scheinbar von Wettbewerbern, Studenten ohne Projektkontext oder Parteien ohne legitime Beschaffungsabsicht stammen.
      icon: tabler:shield
