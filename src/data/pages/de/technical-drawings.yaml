content_version_control:
  tagline: Versionsverwaltung
  title: Versionsverwaltung<br />von Zeichnungen
  subtitle: Jede Zeichnung folgt einem kontrollierten Revisionssystem. Prüfen Sie vor der Verwendung der Zeichnungen für die Projektplanung immer, ob Sie die aktuelle Revision besitzen.
  items:
    - title: Revisionsverfolgung
      description: Jede Zeichnung trägt einen Revisionscode (Rev-A, Rev-B, Rev-C), ein Ausstellungsdatum, das Datum der letzten Prüfung, das zutreffende Modell bzw. die zutreffende Konfiguration, Einheiten, Dateigröße und Format. Zum Download steht nur die "aktuelle" Revision bereit.
      icon: tabler:git-branch
    - title: Hinweis zum Zeichnungsstatus
      description: Alle öffentlichen Zeichnungen sind mit dem Vermerk "Nur vorläufiges Layout — nicht für Konstruktion, Zertifizierung oder Produktion. Maße vorbehaltlich endgültiger Spezifikation und Auftragsbestätigung." gekennzeichnet. Dies schützt beide Seiten vor zweckfremder Anwendung.
      icon: tabler:alert-circle
    - title: Update-Benachrichtigungen
      description: Ändert sich die Modellspezifikation, wird die Zeichnungsrevision aktualisiert und frühere Versionen werden als "ersetzt" markiert. Registrierte Benutzer, die DXF/DWG-Pakete heruntergeladen haben, werden über wichtige Updates per E-Mail informiert.
      icon: tabler:bell

faq:
  title: Technische Zeichnungen – Häufig gestellte Fragen
  questions:
    - q: Können die GA-PDFs wirklich kostenlos heruntergeladen werden?
      a: Ja. Übersichts-PDFs für unsere Hauptmodelle sind kostenlos erhältlich. Sie enthalten Informationen auf Planungsebene, die für die Projektbewertung, die Raumzuteilung und die vorläufige Spezifikationsüberprüfung ausreichend sind.
    - q: Wie greife ich auf DXF/DWG-Dateien zu?
      a: Füllen Sie das kurze Qualifikationsformular auf der Download-Seite mit Ihrem Firmennamen, Projekttyp und Verwendungszweck aus. Genehmigte Anfragen erhalten innerhalb eines Werktages einen Download-Link per E-Mail.
    - q: Kann ich STEP/IGES 3D-Modelle erhalten?
      a: STEP- oder IGES-3D-Modelldateien sind über unseren Projektantragsprozess verfügbar. Geben Sie Ihren Projektumfang, Ihre Integrationsanforderungen, Ihren Zeitplan und Ihre Kaufabsicht an. Vorbehaltlich der Genehmigung – normalerweise innerhalb von 3–5 Werktagen.
    - q: Warum beschränken Sie den Zugriff auf Dateien mit höheren Details?
      a: Rumpfgeometrie, Formdaten und Strukturberechnungen stellen jahrelange Forschungs- und Entwicklungsinvestitionen dar und sind Kernkompetenzen der Fertigung. Wir bieten alles, was für die Beschaffungsplanung und Projektintegration erforderlich ist, und schützen gleichzeitig unsere Fähigkeit, weiterhin in die Entwicklung neuer Produkte zu investieren.
    - q: Enthalten die Zeichnungen Fertigungsdetails?
      a: Nein. Öffentliche und Light-Form-Zeichnungen enthalten Informationen auf Beschaffungsebene für Planung und Spezifikation. Details auf Fertigungsebene (Laminierpläne, Werkzeugwege, Schnitterweiterungen) werden nur im Rahmen einer NDA mit bestätigten Bestellungen weitergegeben.
    - q: Sind Zeichnungen für kundenspezifische oder halbkundenspezifische RIB-Konfigurationen verfügbar?
      a: Im Rahmen des OEM/ODM-Entwicklungsprozesses werden kundenspezifische Projektzeichnungen erstellt. Wenn Sie ein kundenspezifisches RIB-Projekt bewerten, kontaktieren Sie uns mit Ihren Anforderungen und wir stellen Ihnen im Rahmen des Angebots projektspezifische GA-Zeichnungen zur Verfügung.
