hero:
  tagline: Technische Zeichnungen und CAD
  title: RIB & Schlauchboot<br />Technische Zeichnungen und CAD-Downloads
  subtitle: GA-Zeichnungen, Maßblätter und Terrassenlayouts auf Planungsebene für die Projektbewertung und -spezifikation. Greifen Sie auf technische Zeichnungen auf der richtigen Ebene zu – von öffentlichen PDFs bis hin zu STEP-Dateien auf Projektebene.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Technische Zeichnungen und CAD-Downloads für RIB-Boote
direct_answer: Paddle Board Overstock bietet technische Zeichnungen auf Beschaffungsebene für RIB-Boote und aufblasbare Wasserfahrzeuge – einschließlich General Arrangement (GA)-PDFs, Maßblätter und Decklayoutzeichnungen. Höhere Detailformate (DXF/DWG, STEP/IGES) sind auf qualifizierte Anfrage oder Projektanmeldung verfügbar.
