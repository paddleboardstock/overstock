content_challenge:
  tagline: Die Herausforderung
  title: Aquakultur erfordert<br />Salzwasserbeständige Ausrüstung
  subtitle: Fischfarmen, Perlenfarmen und Meeresfarmen arbeiten in der chemisch aggressivsten Meeresumgebung – längere Salzwasserexposition, Treibstoff- und Futtermittelrückstände und ständiger täglicher Gebrauch.
  paragraphs:
    - Aquakulturbetriebe laufen 365 Tage im Jahr in exponierten Küstengewässern und Offshore-Gewässern. Arbeitsboote für Käfigkontrolle, Futtertransport, Wartung der Perlenlinien und Gerätewartung sind ständigem Eintauchen in Salzwasser, UV-Einstrahlung und chemischem Kontakt durch Kraftstoffe, Fischfutter und Antifouling-Behandlungen ausgesetzt.
    - '**Korrosion ist der Hauptfeind** — Standardmäßige Marineausrüstung verschleißt unter diesen Bedingungen rasch. Außenbordmotoren, Anhängerrahmen und Rumpfbeschläge müssen laufend ersetzt werden. Betreiber brauchen Boote aus korrosionsbeständigen Materialien, die in dieser Umgebung Jahre lang überstehen, ohne sich zu verschlechtern.'
    - '**Tägliche Zuverlässigkeit ist entscheidend** — Ein ausgefallenes Arbeitsboot bedeutet verpasste Futterpläne, verzögerte Ernten und teure Produktionsverluste. Bei Perlenfarmen kann ein einzelner verpasster Inspektionstag erhebliche Schäden am Bestand bedeuten. Bei Fischfarmen wirkt sich eine verzögerte Fütterung auf Wachstumsraten und Rentabilität aus.'
    - Aquafarer Aquakultur-RIBs sind mit korrosionsbeständigen Beschlägen, schwer belastbaren Hypalon-Schläuchen und verstärkten Rümpfen konstruiert, die speziell für die anspruchsvollen Bedingungen von Fischzucht, Perlenzucht und Ocean Ranching entwickelt wurden.
content_solution:
  tagline: Unsere Lösung
  title: Speziell entwickelte RIBs<br />Für die Aquakulturindustrie
  subtitle: Jedes Aquafarer-Aquakultur-Arbeitsboot ist so konzipiert, dass es aggressiven Salzwasserumgebungen standhält und gleichzeitig zuverlässige tägliche Leistung liefert.
  list:
    - Hypalon-Schläuche in mariner Qualität — überlegene Beständigkeit gegen UV, Salzwasser, Kraftstoffe und Chemikalien des Fischfutters
    - Beschläge aus Edelstahl 316 im gesamten Boot — kein Rost bei längerem Salzwasserkontakt
    - Verstärkte Scheuerleisten und Kielschutz für wiederholten Kontakt mit Docks und Käfigen
    - Selbstlenzendes Deck für einfaches Waschen und Ablassen nach Futtertransport und Ernteeinsätzen
    - Flache Deckskonfiguration für den Transport von Futtersäcken, Ernteboxen und Ausrüstung
    - Außenborderkonfigurationen von 15 bis 60 PS — optimiert auf das Verhältnis von Nutzlast und Kraftstoffeffizienz
    - Schlauchfarboptionen mit hoher Sichtbarkeit für leichte Erkennbarkeit über große Farmflächen
content_segments:
  tagline: Aquakulturprofile
  title: Lösungen für Arbeitsboote<br />Nach Aquakulturtyp
  subtitle: Verschiedene Aquakulturbetriebe haben unterschiedliche Anforderungen an Arbeitsboote – von kleinen, wendigen RIBs für die Inspektion von Fischkäfigen über stabile Transportplattformen für die Perlenzucht bis hin zu Hochleistungs-Arbeitsbooten für die Meereszucht.
  items:
    - title: Fischzuchtbetriebe
      subtitle: Käfiginspektion, Futtertransport, Ernteunterstützung
      description: Meeresfischfarmen betreiben Käfige an exponierten Küsten- und Offshore-Standorten. Arbeitsboote werden täglich für die Käfignetzinspektion, Fütterungsarbeiten, Ernteunterstützung und Gerätewartung eingesetzt. Die größte Herausforderung ist Korrosion – Boote sind ständig Salzwasser, Fischfutterresten und Treibstoff ausgesetzt. Ein zuverlässiges Arbeitsboot ist unerlässlich, da sich versäumte Fütterung oder verspätete Ernte direkt auf die Produktionsleistung und Rentabilität auswirken.
      features:
        - 'Paket für aggressive Umgebungen: Beschläge aus Edelstahl 316, Komponenten aus Marinelegierungen'
        - Flaches Deckslayout für den Transport von Futtersäcken und Ernteboxen
        - Selbstlenzendes Deck für einfaches Abspritzen nach den Einsätzen
        - Hypalon-Schläuche mit chemikalienbeständiger Beschichtung für Kontakt mit Futter und Kraftstoff
        - Verstärkte Scheuerleisten für häufigen Kontakt mit Käfigen und Docks
    - title: Perlenzuchtbetriebe
      subtitle: Stabiler Transport für die Inspektion und Ernte von Perlenlinien
      description: Perlenfarmen benötigen stabile, zuverlässige Arbeitsboote für den täglichen Transport zwischen Perlenlinien, die Inspektion von Austernnetzen und die Ernteeinsammlung. Diese Operationen werden an abgelegenen Küstenstandorten mit begrenzter Wartungsinfrastruktur durchgeführt. Das Boot muss stabil genug sein, damit die Besatzung bei der Inspektion der Perlenfischerei arbeiten kann, mit einfachem Einstieg und ausreichend Platz an Deck für den Transport von geernteten Austern, Netzen und Vorräten. Zuverlässigkeit und einfache Wartung sind an abgelegenen landwirtschaftlichen Standorten von entscheidender Bedeutung.
      features:
        - Stabile Rumpfbauweise für die stehende Besatzung bei der Kontrolle der Perlenlinien
        - Flaches Deck mit rutschfester Oberfläche für sichere Bewegungen der Besatzung
        - Niedrige Bordwand für leichten Zugang zu Austernetzen und Ernte
        - Einfache Außenborderkonfiguration für problemlose Wartung vor Ort
        - Korrosionsbeständiges Schlauch- und Beschlagpaket für dauerhafte Salzwasserexposition
    - title: Ocean Ranching und Meeresverbesserung
      subtitle: Transport von Jungfischen, Käfigwartung, Überwachungsunterstützung
      description: Bei der Meereszucht geht es um die Auswilderung von Jungtieren in bewirtschafteten Meeresumgebungen, die Überwachung des Wachstums und die Wartung von Verbesserungsstrukturen. Arbeitsboote müssen lebendes Jungvieh in belüfteten Containern transportieren, Überwachungsgeräte mitführen und Zugang zu flachen Küstenfreisetzungsstellen haben. Bei der Rumpfkonstruktion muss die Tragfähigkeit mit dem geringen Tiefgang für den Zugang zum Strand und zur Flussmündung in Einklang gebracht werden.
      features:
        - Deckfläche für belüftete Jungfisch-Transportbehälter und Überwachungstechnik
        - Flacher Tiefgang für den Zugang zu Aussetzungsorten an Strand und Flussmündungen
        - Einfaches Landen am Strand — verstärkter Kiel und Bugschutz
        - Befestigungspunkte für Überwachungselektronik und Beprobungsausrüstung
        - Schwer belastbare Hypalon-Schläuche für Dauerhaftigkeit bei gemischten Sand- und Seewasserbedingungen
