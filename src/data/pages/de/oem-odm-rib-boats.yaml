comparison_matrix:
  title: OEM vs. ODM – welches Modell passt zu Ihrem Projekt?
  subtitle: Vier Kooperationsmodi mit jeweils unterschiedlichem Grad der Fabrikbeteiligung und Markenkontrolle
  columns:
    - header: Kollaborationsmodus
    - header: Ihre Markenrolle
    - header: Paddle Board Overstock-Rolle
  rows:
    - option: OEM-Fertigung
      standard: Geben Sie Marke, Spezifikationen und Compliance-Anforderungen an
      premium: Bauen Sie nach Ihren Vorgaben mit unseren vorhandenen Formen und Produktionslinien
    - option: ODM-Anpassung
      standard: Wählen Sie ein Basismodell aus, passen Sie Funktionen und Branding an
