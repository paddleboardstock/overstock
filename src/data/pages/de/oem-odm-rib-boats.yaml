    - option: Semi-Custom-Rippe
      standard: Definieren Sie Rumpflänge, Rohrmaterial, Decklayout und Ausrüstung
      premium: Modifizieren Sie den vorhandenen Rumpf mit einer individuellen Rohrkonfiguration und einem Deckplan
    - option: Vollständige kundenspezifische Entwicklung
      standard: Bereitstellung von Konzept und Zielmarktanforderungen
      premium: Design von Grund auf – maßgeschneiderter Rumpf, Form und vollständige Dokumentation
content_customization:
  tagline: Was kann angepasst werden?
  title: RIB-Anpassung<br />Optionen
  subtitle: Jedes Element eines RIB-Bootes kann an Ihre Anwendungs-, Markt- und Markenanforderungen angepasst werden.
  items:
    - title: Rumpf & Struktur
      description: Rumpflänge (2,5–8,5 m), Rumpfmaterial (GFK-Glasfaser oder Aluminium in Marinequalität), Rumpffarbe (Gelcoat oder lackiert), Kielprofil (tiefes V, mittleres V, flach), Spiegeltyp (geschlossener Spiegel mit Halterung oder Schacht) und strukturelle Verstärkung für kommerzielle Belastungsanforderungen.
      icon: tabler:sailboat
    - title: Schlauch und Kragen
      description: Schlauchmaterial (0,9–1,2 mm PVC oder 1,4–1,7 mm Hypalon/CSM), Schlauchdurchmesser (40–55 cm), Anzahl der Kammern (3–7), Ventiltyp (Halkey-Roberts, Leafield D7 oder Boston), Schlauchfarbe (Standard oder kundenspezifisch) und Kragenkonus/Kegelkonfiguration.
      icon: tabler:circle
    - title: Deck- und Konsolenlayout
      description: Mittelkonsole, Seitenkonsole oder Pinnensteuerung. Sitzanordnung (Jockeysitze, Sitzbänke, Polstersitze). Deckbelag (EVA-Schaum in Teak-Optik, rutschfeste Farbe oder blankes GFK). Gerätebefestigungspunkte, Haltegriffe und D-Ring-Positionen.
      icon: tabler:layout-dashboard
    - title: Elektrik und Navigation
      description: Navigationslichter (LED), Bilgenpumpensystem, Batteriemanagement, UKW-Funkinstallation, GPS-/Kartenplotter-Montage, USB-Ladeanschlüsse und Schalttafelkonfiguration.
      icon: tabler:bolt
    - title: Branding und Grafiken
      description: Rumpf- und Rohrgrafiken (Siebdruck, Wärmeübertragung, UV-Digitaldruck), Logoplatzierung, maßgeschneiderte Farbschemata, Identifikationsmarkierungen und individuelle Eigentümerdokumentation mit Ihrer Marke.
      icon: tabler:palette
    - title: Sicherheit und Compliance
      description: Designkategoriebewertung (A/B/C/D pro RCD), Feuerlöschsystem, Kraftstoffsystemspezifikation (tragbarer Tank, fester Tank, Unterdeck) und Compliance-Dokumentationspaket für Ihren Zielmarkt.
      icon: tabler:shield
content_applications:
  tagline: Anwendungskonfigurationen
  title: RIB-Konfigurationen<br />Nach Anwendung
  subtitle: Unterschiedliche Missionen erfordern unterschiedliche Konfigurationen. Hier finden Sie bewährte Setups für die gängigsten RIB-Anwendungen.
  items:
    - title: Rettung und Patrouille
      description: Tiefer V-Rumpf, Hypalon-Rohre, selbstlenzendes Deck, Polstersitze, Haltegriffe, Navigationslichter und robuste D-Ringe. RCD-Designkategorie B oder C. Feuerbeständiges Kraftstoffsystem und handelsübliche Elektrik.
      icon: tabler:lifebuoy
    - title: Tauchunterstützung
      description: Breiter Balken, hintere Einstiegsleiter, Flaschenhalterpositionen, zusätzliche D-Ringe, Tauchflaggenhalterung, verstärkter Spiegel für zwei Außenborder und rutschfeste EVA-Volldeckabdeckung.
      icon: tabler:mask
    - title: Tourismus & Kommerziell
      description: Für Passagiere zertifiziertes Layout mit Sitzbänken, Sonnenschirm/Bimini, Haltegriffen, Trockenlagerung und Doppelbatteriesystem. RCD-Kategorie C. Konzipiert für den Betrieb von Resorts und Charterflotten.
      icon: tabler:beach
    - title: Angeln
      description: Offenes Decklayout, Rutenhalterpositionen, Behälter für lebende Köder, Halterung für Fischfinder, Halterung für Trolling-Motor, verstärkter Spiegel und tragbares Kraftstoffsystem. Optionen für Mittelkonsole oder Seitenkonsole.
      icon: tabler:fish
    - title: Freizeit- und Yachtausschreibung
      description: Leichter Rumpf, PVC-Rohre, bequeme Sitze, teleskopierbare Pinne oder kompakte Konsole, Hebepunkte für Davit und abnehmbarer Kraftstofftank. RCD-Kategorie C oder D.
      icon: tabler:sailboat
    - title: Professionelles Arbeitsboot
      description: Optionaler Aluminiumrumpf, Hochleistungsverstärkung, hydraulische Lenkung, handelsübliche Elektrik, Radarbogen und missionsspezifische Ausrüstungsintegrationspunkte. Benutzerdefinierte Compliance pro Projekt.
      icon: tabler:anchor
process_steps:
  title: 7-stufiger RIB-OEM/ODM-Entwicklungsprozess
  subtitle: Von der Projektbeschreibung bis zum After-Sales – ein definierter Arbeitsablauf mit klaren Meilensteinen und Ergebnissen
  steps:
    - number: '01'
      title: Projektbeschreibung und Anforderungen
      description: Definieren Sie die Zielanwendung, Rumpfgröße, Rohrmaterial, Compliance-Anforderungen und Branding-Anforderungen. Wir bewerten die Machbarkeit und bestätigen das Kooperationsmodell (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 Tage
    - number: '02'
      title: Technische Überprüfung und Machbarkeit
      description: Das Ingenieurteam überprüft die strukturelle Machbarkeit, Stabilitäts- und Auftriebsberechnungen, den Compliance-Pfad und die Materialverfügbarkeit. Wir identifizieren vorhandene Formen oder kundenspezifische Formenanforderungen.
      timeline: 5–7 Tage
    - number: '03'
      title: Vorschlag und Angebot
      description: Erhalten Sie ein detailliertes Angebot mit Spezifikationen, 3D-Renderings oder GA-Zeichnungen, Compliance-Umfang, Zeitplan und Stückpreisen basierend auf Volumenstufen und Mindestbestellmenge.
      timeline: 5–7 Tage
    - number: '04'
      title: Designbestätigung und Bemusterung
      description: Genehmigen Sie die endgültige GA, das Decklayout und die Rohrkonfiguration. Wir erstellen ein Vorproduktionsmuster mit Ihren Markenfarben, Ihrem Logo und den angegebenen Materialien für Ihre physische Inspektion.
      timeline: 15–20 Tage
    - number: '05'
      title: Probengenehmigung und QC-Protokoll
      description: 'Prüfen und genehmigen Sie die Probe. Definieren Sie das Produktions-QC-Protokoll: Drucktest (1,25 x / 24–48 Stunden), Maßprüfungen und Checkliste für die Konformitätsdokumentation pro Rumpf.'
      timeline: 3–5 Tage
    - number: '06'
      title: Massenproduktion und Qualitätskontrolle
      description: Vollständiger Produktionslauf mit 100-Punkte-QC-Checkliste pro Einheit. In-Prozess-Inspektionen, Druckprüfungen und Rückverfolgbarkeit auf Serienebene. CE/ISO documentation prepared in parallel.
      timeline: 30–45 Tage
    - number: '07'
      title: Verpackung, Versand und Kundendienst
      description: Kundenspezifische Verpackung (Standard, einzelhandelsfertig oder palettiert), Exportdokumentation, Containerverladung und Logistik. Ersatzteilsets und Wartungsdokumentation im Lieferumfang enthalten.
      timeline: 7–14 Tage
certifications:
  title: Konformität und Zertifizierungen für RIB-Boote
  subtitle: Jede maßgeschneiderte RIB-Bestellung wird mit einer modellspezifischen Compliance-Dokumentation geliefert
  items:
    - name: CE 2013/53/EU
      description: RCD-Konformität pro Modell und Designkategorie – Konformitätserklärung, Herstellerschild und Bedienungsanleitung enthalten
      badge: CE
    - name: ISO 9001:2015
      description: Von SGS zertifiziertes Qualitätsmanagementsystem für Design, Produktion und Vertrieb
      badge: ISO
    - name: EN ISO 6185
      description: Standard für den Bau von Schlauchbooten – Stabilität, Auftrieb und Bergung von Mann über Bord
      badge: 6185
    - name: EN ISO 14945
      description: Herstellerschildstandard – dauerhaft gekennzeichnete Identifikations- und Kapazitätsinformationen
      badge: 14945
    - name: BSCI
      description: Soziales Compliance-Audit für ethische Herstellung – von EU-Einzelhändlern gefordert
      badge: BSCI
    - name: ERREICHEN
      description: Einhaltung der EU-Chemikaliensicherheit für PVC, Hypalon, Klebstoffe und Beschichtungen
      badge: REACH
content_service_modules:
  tagline: Servicemodule
  title: OEM/ODM-<br />Servicemodule
  subtitle: Jedes Projekt kombiniert die passenden Servicemodule. Nicht jedes Projekt braucht jedes Modul — wir leisten nur, was Ihr Projekt erfordert.
  items:
    - title: Technische Bewertung & Machbarkeit
      description: 'Bewertung der Rumpfplattform, Prüfung der strukturellen Machbarkeit, Verifikation von Stabilität und Auftrieb, Identifizierung des Konformitätspfads und Bestätigung der Materialverfügbarkeit. Ergebnis: Machbarkeitsbericht mit Go-/No-Go-Empfehlung.'
      icon: tabler:math-function
    - title: Design & Konfiguration
      description: 'GA-Zeichnung, Decklayout, Schlauchkonfiguration, Konsol- und Sitzplätze, Einbauplan für die Ausrüstung sowie Auswahl von Farbe und Material. Ergebnis: freigegebene GA und Konfigurationsspezifikation.'
      icon: tabler:ruler
    - title: Muster & Prototyp
      description: Vorserienmuster mit freigegebenen Farben, Logo und spezifizierten Materialien zur physischen Begutachtung. Inklusive Musterfreigabeprotokoll, Prüfliste und Änderungsanforderungsprozess.
      icon: tabler:3d-cube-sphere
    - title: Produktion & Qualitätskontrolle
      description: Serienproduktion mit 100-Punkte-QC-Checkliste je Einheit, Prüfungen im Prozess, Druckprüfung (1,25x / 24-48h) und Rückverfolgbarkeit auf Serienebene. CE-/ISO-Dokumentation wird parallel erstellt.
      icon: tabler:clipboard-check
    - title: Branding & Verpackung
      description: Anbringung des Private-Label-Logos, individuelle Rumpf- und Schlauchgrafiken, Owner-Dokumentation unter Ihrer Marke, verkaufs- oder palettenfertige Verpackung und Zusammenstellung der Ersatzteil-Kits.
      icon: tabler:palette
    - title: Export & Dokumentation
      description: Exportverpackung, Containerbeladungsplan, FOB/CIF/DDP-Dokumentation, Konformitätsunterlagen je Zielmarkt und Kommunikationsprotokoll nach Lieferung.
      icon: tabler:world

content_risk_control:
  tagline: Risiko- & Lieferkontrolle
  title: Projektrisiken &<br />Liefermanagement
  subtitle: Professionelle OEM/ODM-Einkäufer messen der Risikokontrolle dieselbe Bedeutung bei wie der Produktqualität. So gehen wir damit um.
  items:
    - title: Festlegung von Umfang & Eigentum
      description: 'Vor Entwicklungsbeginn halten wir schriftlich fest: Umfang der Individualisierung, Werkzeuganforderungen, Kriterien der Musterfreigabe, Eigentum an Zeichnungen und Formen sowie Verantwortlichkeiten für die Dokumentation. Keine Unklarheit darüber, wem was gehört.'
      icon: tabler:file-text
    - title: Änderungscontrollprozess
      description: Alle Spezifikationsänderungen nach der Designfreigabe durchlaufen einen dokumentierten Änderungsanforderungsprozess mit Auswirkungsanalyse (Kosten, Termin, Konformität). Keine nicht genehmigten Änderungen gelangen in die Produktion.
      icon: tabler:arrows-diff
    - title: Garantie der Chargenkonsistenz
      description: Die 50. Einheit entspricht dem 1. freigegebenen Muster. Freigegebene Spezifikationen werden eingefroren, Material- und Prozessparameter gesperrt, und Prüfpunkte im Prozess verifizieren die Konsistenz über die gesamte Produktionsserie.
      icon: tabler:repeat
    - title: Transparenz bei Lieferzeit & Kapazität
      description: Lieferzeiten werden auf Basis realer Produktionskapazität, aktueller Materialbestände und Auslastung kalkuliert — nicht nach Wunschzielen. Ein Produktionsplan mit Meilensteinterminen wird je Auftrag bereitgestellt.
      icon: tabler:calendar-stats

faq:
  title: RIB OEM/ODM – Häufig gestellte Fragen
  questions:
    - q: Was ist der Unterschied zwischen OEM und ODM für RIB-Boote?
      a: 'OEM (Original Equipment Manufacturing): Sie liefern detaillierte Spezifikationen und wir bauen Ihr Design. ODM (Original Design Manufacturing): Sie wählen eine bewährte Paddle Board Overstock RIB-Plattform und wir passen sie mit Ihren gewünschten Funktionen und Ihrem gewünschten Branding an. ODM ist schneller und kostengünstiger; OEM bietet maximale Designkontrolle.'
    - q: Kann ich die Form und Größe des RIB-Rumpfes individuell anpassen?
      a: Ja. Wir bieten semi-kundenspezifische Modifikationen an vorhandenen Rumpfformen (verschiedene Deckslayouts, Rohrkonfigurationen) und die Entwicklung vollständig kundenspezifischer Rumpfformen mit neuen CNC-gefrästen Formen an. Halbkundenspezifische Projekte können bei 2–5 Einheiten beginnen; Vollständige kundenspezifische Lösungen erfordern in der Regel höhere Verpflichtungen.
    - q: Welche Rohrmaterialien sind für kundenspezifische RIBs verfügbar?
      a: Wir bieten 0,9–1,2 mm PVC für den Freizeit- und leichten gewerblichen Einsatz sowie 1,4–1,7 mm Hypalon/CSM für professionelle, Rettungs- und gewerbliche Anwendungen, die eine hervorragende UV- und Ozonbeständigkeit erfordern (10–15 Jahre Lebensdauer gegenüber 5–8 Jahren für PVC).
    - q: Können Sie RIBs für bestimmte Anwendungen wie Rettung, Tauchen oder Angeln konfigurieren?
      a: Ja. Wir pflegen bewährte Konfigurationsvorlagen für Rettungs-/Patrouillen-, Tauchunterstützungs-, Tourismus-/Charter-, Angel-, Yacht-Beiboot- und professionelle Arbeitsbootanwendungen. Jede Vorlage enthält den empfohlenen Rumpftyp, das Rohrmaterial, die Decksanordnung und die Ausrüstung – die wir dann genau an Ihre Anforderungen anpassen.
    - q: Welche Informationen benötigen Sie für ein RIB OEM/ODM-Angebot?
      a: Zielanwendung, gewünschte Rumpflänge, bevorzugtes Rohrmaterial (PVC oder Hypalon), ungefähre Menge und Lieferplan, Compliance-Anforderungen des Zielmarktes sowie etwaige Referenzprodukte oder -spezifikationen. Je detaillierter Sie Ihre Angaben machen, desto schneller und genauer wird unser Angebot erstellt.
    - q: Wie hoch ist die Mindestbestellmenge für maßgeschneiderte RIB-Boote?
      a: Für bestehende Rumpfformen mit Standardmodifikationen beginnt die Mindestbestellmenge bei 2–5 Einheiten pro Design. Bei kundenspezifischen Formen und vollständiger kundenspezifischer Entwicklung hängt die MOQ von der Komplexität des Projekts ab – typischerweise 10–20 Einheiten für halbkundenspezifische Formen und 30+ für vollständig kundenspezifische Einheiten mit neuen Werkzeugen.
    - q: Wem gehören die kundenspezifischen Formen und Zeichnungen?
      a: Formen, die mit Paddle Board Overstock-Basisdesigns entwickelt wurden, bleiben Eigentum von Paddle Board Overstock. Vom Kunden in Auftrag gegebene und bezahlte, vollständig maßgeschneiderte Formen können gemäß den Vertragsbedingungen in das Eigentum des Kunden übergehen. Alle Formeneigentumsbedingungen werden vor Projektbeginn dokumentiert.
    - q: Wie werden kundenspezifische RIBs für den Export verpackt?
      a: 'Standard: Maßgeschneiderte Wiege + Stretchfolie für die Containerbeladung. Premium: verkaufsfertig verpackt, vakuumverpackt oder palettiert. Wir bieten FOB-Qingdao-, CIF- und DDP-Versand an. Vollständige Exportdokumentation und Zollabfertigung inklusive.'
