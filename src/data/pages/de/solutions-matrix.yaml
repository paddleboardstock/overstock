hero:
  tagline: Branchenlösungsmatrix
  title: Szenariobasierte Marinelösungen<br />Für den professionellen Einsatz
  subtitle: Speziell entwickelte aufblasbare Wasserfahrzeuge und RIBs, konfiguriert für Rettungs-, Mietflotten-, Yacht-Tender- und kommerzielle Angelanwendungen – jeweils unterstützt durch technische Spezifikationen und Anpassungsoptionen.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Professionelle Marinelösungen von Aquafarer für verschiedene Branchen
direct_answer: 'Aquafarer liefert szenariogerechte Schlauchboot- und RIB-Lösungen für kommerzielle Schiffseinsätze: Rettungs- und Patrouillenboote mit verstärkten Hypalon-Rohren und Mehrkammersicherheit, Mietflotten-SUPs und Kajaks mit 1,2 mm PVC und heißluftgeschweißten Nähten für wartungsarme Haltbarkeit, Luxusyachttender mit RIBs mit tiefem V-Rumpf aus Aluminium sowie Hochleistungs-Angelkonfigurationen mit Rutenhaltern und Livewell-Systemen.'
solution_a:
  tagline: Lösung A
  title: Seenotrettung und kommerzielle Patrouille
  subtitle: Hochgeschwindigkeits-Mehrkammer-Sicherheits-RIBs für professionelle Notfalleinsätze und Strafverfolgungseinsätze.
  badge: Heavy-Duty Series
  description: Unsere Marine-Rettungs- und Patrouillen-RIBs bestehen aus verstärkten Hypalon/PVC-Luftschläuchen mit hoher Dichte und verfügen über ein unabhängiges Auftriebsdesign mit mehreren Kammern. Jedes Schiff ist für die Einsatzbereitschaft mit professionellem Reflektorband, Rettungsleinen und Schnellaufblasventilen ausgestattet. Deep-V-Rümpfe aus Glasfaser sorgen für außergewöhnliche Stabilität bei hohen Geschwindigkeiten und bei rauem Seegang.
  features:
    - title: Mehrkammersicherheit
      description: 4–6 unabhängige Luftkammern – jeder einzelne Kammerdurchstich sorgt für einen positiven Auftrieb
    - title: Verstärktes Schlauchgewebe
      description: 1,2 mm Hypalon CSM oder 1.680 DTEX PVC mit doppellagigen Heißluftschweißnähten
    - title: Professionelle Qualität
      description: SOLAS-Reflexband, Rettungsleinen, Abschleppklampen, Malerleine mit Schnellverschluss
    - title: Hochgeschwindigkeitsrumpf
      description: Deep-V-Rumpf aus Glasfaser oder Aluminium, ausgelegt für 25–45 Knoten, je nach Konfiguration
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Rumpfmaterial
      value: Glasfaser / Aluminium in Marinequalität
    - label: Schlauchstoff
      value: 1,2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Maximale Geschwindigkeit
      value: 25–45 Knoten
    - label: Kapazität
      value: 6–12 Personen
    - label: Motorenpalette
      value: 40–200 PS
    - label: Zertifizierung
      value: CE/ISO 9001
solution_b:
  tagline: Lösung B
  title: Wassersportverleih und<br />Resort-Flottenausrüstung
  subtitle: Extrem langlebige, wartungsarme aufblasbare SUPs, Kajaks und Boote für den täglichen Mieteinsatz in Resorts, Clubs und Reiseveranstaltern.
  badge: Rental-Grade
  description: Die Ausrüstung unserer Mietflotte ist auf höchste Haltbarkeit und niedrigste Wartungskosten ausgelegt. Wir verwenden 1,2 mm verstärktes PVC mit dreilagiger Heißluft-Schweißnahttechnologie, die UV-Schäden und häufigen Kollisionsschäden standhält. Die Drop-Stitch-Konstruktion sorgt dafür, dass die Boards auch nach Hunderten von Leihzyklen ihre Steifigkeit behalten. Alle Modelle verfügen über verstärkte D-Ringe, abriebfeste Schienenbänder und handelsübliche Ventile.
  features:
    - title: PVC in handelsüblicher Qualität
      description: 1,2 mm verstärktes PVC mit UV-Stabilisatoren – 3x dicker als Materialien in Verbraucherqualität
    - title: Heißluftgeschweißte Nähte
      description: Dreischichtiges Schmelzschweißen – stärker als Klebebindung, beständig gegen Delamination
    - title: Drop-Stitch-Steifigkeit
      description: 1.680 DTEX-Kern mit 2 Fäden/Quadratzoll – ausgelegt für 20 PSI für hartbrettähnliche Steifigkeit
    - title: Flottentaugliches Design
      description: Verstärkte D-Ringe, handelsübliche Halkey-Roberts-Ventile, abriebfeste Schienenbänder
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Rohrmaterial
      value: 1,0–1,2 mm verstärktes PVC
    - label: Nahttechnologie
      value: Dreilagiges Heißluftschweißen
    - label: Maximaler Druck
      value: 15–20 PSI (Drop-Stitch-Modelle)
    - label: UV-Beständigkeit
      value: Mehr als 1.000 Stunden beschleunigte Tests
    - label: Garantie
      value: 2–5 Jahre je nach Modell
    - label: Wartung
      value: Minimal – ausspülen und aufbewahren
solution_c:
  tagline: Lösung C
  title: Yachttender und<br />Luxus-Wasserfahrzeuge
  subtitle: Leichte, leistungsstarke RIB-Tender für die Lagerung von Superyachten und den Gästetransport mit luxuriöser Passform und Verarbeitung.
  badge: Premium Series
  description: Unsere Yacht-Tender-RIBs kombinieren Leichtbau mit luxuriöser Ästhetik. Deep-V-Rümpfe aus Aluminium oder Glasfaser bieten außergewöhnliche Fahrqualität und einfaches Heben des Davits. Erhältlich mit farblich abgestimmten Röhrengrafiken, hochwertiger Polsterung und individuellem Konsolenlayout. Durch die kompakten Lagerabmessungen eignen sie sich ideal für Superyacht-Garagen und Deckslager.
  features:
    - title: Leichtbau
      description: Rümpfe aus Aluminium in Marinequalität reduzieren das Gewicht im Vergleich zu Glasfaser um 30 % und erleichtern das Anheben
    - title: Deep-V-Leistung
      description: 18–22 Grad Deadrise-Rumpf für sanftes Fahren bei Kabbelwasser und hervorragende Spurtreue
    - title: Luxuriöse Passform und Verarbeitung
      description: Maßgeschneiderte Polsterung, farblich abgestimmte Rohre, Premium-Steuerkonsole, Edelstahlpaket
    - title: Kompakte Aufbewahrung
      description: Konzipiert für Superyacht-Garagen – entleerbare Schläuche für kompaktes Verstauen
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Rumpftyp
      value: Deep-V-Aluminium/Fiberglas
    - label: Deadrise
      value: 18–22 Grad
    - label: Maximale Geschwindigkeit
      value: 30–40 Knoten
    - label: Trockengewicht
      value: 120–350 kg (Aluminiumrumpf)
    - label: Davit-Lift bereit
      value: Ja – Hebepunkte Standard
    - label: Lagerung
      value: Entleerbare Schläuche, stapelbar
