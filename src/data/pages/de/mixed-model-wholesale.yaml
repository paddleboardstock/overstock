who_benefits:
  tagline: Wer profitieren kann
  title: Für wen ist Mixed Model Wholesale
  items:
    - title: Erstimporteure
      description: Die SUP Kategorie wird mit einer Modellverteilung getestet, anstatt sich auf eine einzige Menge zu verpflichten SKU.
    - title: Saisonale Strandhändler
      description: Geschäfte, die Anfänger-Boards für Touristen und Premium-Ausgaben für Einheimische brauchen – in derselben Nachfüllreihenfolge.
    - title: Online-Verkäufer
      description: Mehrere Modelle gleichzeitig aufzulisten, um herauszufinden, welche Grafik, Länge und Anwendungsfall am besten geeignet sind.
    - title: Verleihflotten & Schulen
      description: Flotten, die unterschiedliche Brettgrößen für unterschiedliche Reitergewichte und Unterrichtstypen benötigen, nicht eine Flotte mit nur einer Spezifikation.
faq_section:
  title: Gemischte Modell-FAQ
  items:
    - q: Gibt es eine Mindestmenge pro Modell?
      a: Nein. Das Minimum von 5 Brettern gilt für die Gesamtbestellung, nicht für jedes Modell. Man könnte fünf verschiedene Modelle bestellen, jeweils ein Brett.
    - q: Verändert das Mischen von Modellen den Preis?
      a: Der Großhandelspreis pro Modell wird angegeben, aber Ihre Preisstufe verbessert sich mit der Gesamtzahl der Platinen – das Mischen der Modelle bestraft Sie nicht.
    - q: Kann ich Bretter und Zubehör mischen?
      a: Ja – Ersatzpaddel, Pumpen und Reparatursets können in einer gemischten Bestellung hinzugefügt werden. Fragen Sie in Ihrer Anfrage.
    - q: Woran erkenne ich, welche Modelle zu meinem Markt passen?
      a: Senden Sie uns eine Nachricht über Ihre Kunden (Küsten- oder Binnenland, Touristen oder Einheimische, Anfänger oder Fahrer) im Anfrageformular, und wir empfehlen eine Mischung.
