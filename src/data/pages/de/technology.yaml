testimonial:
  quote: Was mich überzeugt hat, war die Konstruktion. Verschweißte Nähte statt Kleber, ein drop-stitch-Kern, der sich bei 15 PSI fest anfühlt, und kein Wackeln, wenn ich zurücktrete, um mich zu drehen. Zwei Jahre später, null Probleme.
  author: Marta Keller
  title: Verifizierter Käufer
  company: See-Touring-Paddlerin
  location: Deutschland
sections:
  - title: Drop-Stitch Kern
    standard: 12-15 PSI Betriebsdruck
    description: Tausende interne Polyesterfäden verbinden die oberen und unteren Schichten und schaffen eine starre Struktur bei 12-15 PSI. Dies ist die gleiche Technologie, die bei professionellen Paddleboards verwendet wird. Unsere drop-stitch-Dichte ist pro Modell für die ideale Balance zwischen Steifigkeit und Gewicht optimiert.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS-Kern-Diagramm
  - title: Marine-Qualität PVC
    standard: Fusionverschweißt | UV / Salzwasser / Abrieb getestet
    description: Mehrschichtig laminiertes PVC-Gewebe, bewertet für marine Umgebungen. Jede Schicht ist verschweißt statt geklebt, wodurch das Risiko der Delamination ausgeschlossen wird. Getestet auf UV-Beständigkeit (1.000 + Stunden), Salzwasserkorrosion und Abrieb.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC-Schicht
  - title: EVA-Deck-System
    standard: Rutschfeste, komfortable Art-Serie-Muster
    description: Foam auf der gesamten Deckfläche EVA sorgt für Grip, Dämpfung und den charakteristischen Art-Serie-Look. Präzise geschnittene Paneele werden nahtlos verlegt — keine aufgedruckten Grafiken, die abkratzen könnten, kein Wachs nötig.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: EVA-Deck
  - title: Dreischichtiges Railsystem
    standard: Fusion Bonded | Überdimensioniert in der hochbelasteten Zone
    description: Die Schienenbänder sind dreischichtig fusion bonded und um die Kante des Boards gewickelt — die höchstbelastete Zone auf jedem aufblasbaren Board. Hier versagen billige Boards als Erste; unsere sind überdimensioniert.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Schienensystem
