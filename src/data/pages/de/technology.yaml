testimonial:
  quote: Was Aquafarer auszeichnet, ist ihre Materialwissenschaft. Sie montieren nicht nur Komponenten — PVC-Compounds, Schweißparameter und struktureller Lagenaufbau werden intern entwickelt. Diese vertikale Integration zeigt sich im Endprodukt.
  author: David Park
  title: Produktentwicklungsleiter
  company: Bluewater Sports Equipment
  location: Australien

sections:
  - title: Drop-Stitch-Kern
    standard: Betriebsdruck 12-15 PSI
    description: Tausende interne Polyesterfäden verbinden die obere und die untere Lage und erzeugen bei 12-15 PSI eine steife Struktur. Dies ist dieselbe Technologie, die in professionellen Paddleboards und aufblasbaren Rennbooten zum Einsatz kommt. Unsere Drop-Stitch-Dichte wird je Modell optimiert — für die ideale Balance aus Steifigkeit und Gewicht.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: Drop-Stitch-Kern-Diagramm
  - title: PVC für maritime Anwendungen
    standard: Fusionsschweißung | Getestet gegen UV / Salzwasser / Abrieb
    description: Mehrlagig laminierter PVC-Planenstoff für maritime Umgebungen. Jede Lage wird fusionsschweißverbunden statt verklebt — das schließt Delaminationsrisiken aus. Getestet auf UV-Beständigkeit (ASTM G154, 1.000+ Stunden), Salzwasserkorrosion (ISO 9227) und Abrieb (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC-Schicht
  - title: Hypalon-Schläuche
    standard: CSM-Kautschuk | Beständig gegen UV / Chemikalien / extreme Temperaturen
    description: Bei RIB-Modellen eingesetzt, bietet Hypalon-Kautschuk (CSM) gegenüber Standard-PVC überlegene UV- und Chemikalienbeständigkeit. Hypalon-Schläuche bleiben bei extremen Temperaturen flexibel und widerstehen der Alterung durch Kraftstoff- und Öleinwirkung. Alle Nähte werden von zertifizierten Technikern von Hand gefertigt.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Luftboden (Air Deck)
    standard: Hochdruckaufblasbar | Ersetzt Sperrholz/Aluminium
    description: Hochdruck-aufblasbares Bodensystem, das herkömmliche Sperrholz- oder Aluleistenböden ersetzt. Reduziert Aufbauzeit, Gesamtgewicht und Packmaß und bietet zugleich ausreichende Steifigkeit zum Stehen, Angeln und Laufen. Getestet für eine verteilte Last von 200+ kg.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Luftboden

