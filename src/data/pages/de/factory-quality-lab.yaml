hero:
  tagline: Qualitätskontrolllabor
  title: Testlabor und Qualitätssicherung
  subtitle: Unabhängiges Qualitätslabor – jede Einheit vor dem Versand getestet
intro: Paddle Board Overstock Betreibt ein dediziertes Qualitätskontrolllabor, das unabhängig von der Produktion arbeitet. Jede Charge Rohmaterial und jede fertige Platine durchläuft dokumentierte Inspektionsprotokolle vor der Freigabe. Unser QC-Team berichtet direkt an das Management und sichert unparteiische Qualitätsentscheidungen.
highlights:
  - value: 100%
    label: Einheiten druckgeprüft
    detail: Jede Kammer, jede Tafel
  - value: 48 h
    label: Dauer des Luftretentionstests
    detail: Bei 1,25× Nenndruck
  - value: '&lt;5 %'
    label: Max ließ den Druckabfall zu.
    detail: Über 24-stündige Wartezeit
  - value: 99.3%
    label: Fehlerfreie Quote
    detail: Nachfolgende 12-Monats-Lieferungen
test_procedures:
  - title: Rohstoffinspektion
    description: Jede eingehende Charge von PVC, drop-stitch Stoff, EVA Schaumstoff und Hardware wird vor der Abnahme getestet. Zugfestigkeit, Reißfestigkeit und -UV widerstand werden überprüft. Nicht konforme Materialien werden in Quarantäne gestellt und zurückgegeben.
    standards:
      - Zugfestigkeit (350 N/cm min)
      - Rissresistenz
      - UV Widerstand (1.000 H)
  - title: In-Process QC-Kontrollpunkte
    description: Produktionsbediener führen in jeder Phase Selbstinspektionen durch. QC-Prüfer führen während der gesamten Schicht eine zufällige Stichprobe durch. Alle 50. Einheiten werden Schweiß-Peel-Tests durchgeführt. Dimensionsprüfungen finden alle 20. Panels statt.
    standards:
      - Peel-Test alle 50 Einheiten
      - Interne 100-Punkte-Checkliste
      - Zufällige Stichprobenprüfungen
  - title: 48-Stunden-Luftretentionstest
    description: Jede Rohrkammer wird auf 125 % des Nenndrucks aufgeblasen und 48 Stunden gehalten. Drucksensoren protokollieren kontinuierlich mit Temperaturkompensation. Jede Kammer mit einem Druckabfall von 5 % löst eine automatische Chargen-Nachinspektion aus.
    standards:
      - 1,25-fach Nenndruckhalt
      - <5 % maximaler Druckabfall
  - title: Last- und Balancetests
    description: Fertige Bretter werden mit maximaler Kapazität für Stabilität, Freibord und Handhabung getestet. Jedes Board wird vor der endgültigen Inspektionsgenehmigung einer Wasserprüfung getestet.
    standards:
      - 1,25-fache Bewertungslastverifikation
      - Wasserprüfung
equipment:
  - name: Universelle Prüfmaschine (Zug)
    spec: 5 kN Kapazität
  - name: Druckverlustprüfer
    spec: Mehrkanalig, 0–50 psi, Datenaufzeichnung
  - name: UV Alterungskammer
    spec: UVA-340, 1.000 Stunden Zyklen
  - name: Dickenmessgerät (digital)
    spec: 0,01 mm Auflösung
  - name: Abziehtester (Schweißen)
    spec: Motorisiert, 50 N Kapazität
  - name: Temperaturkammer
    spec: -40 °C bis +100 °C
  - name: Leckdetektionstank
    spec: 6 m × 2 m, beleuchtet
