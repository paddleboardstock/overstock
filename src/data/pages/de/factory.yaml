qc_section:
  tagline: Qualitätskontrolle
  title: Test- und Qualitätssicherungsprozess
  subtitle: Jede Platine wird vor dem Versand verpflichtend getestet. Unser Qualitätslabor arbeitet unabhängig von der Produktion und berichtet direkt an das Management.
  steps:
    - step: '1'
      title: Rohstoffinspektion
      desc: PVC und drop-stitch Gewebe werden Zugtests, Rissausbreitung und UV Widerstandsüberprüfung durchlaufen, bevor eine Charge in die Produktion geht.
    - step: '2'
      title: 48-Stunden-Luftretentionstest
      desc: Jede Platinenkammer wird auf 125 % des Nennluftdrucks aufgepumpt und 48 Stunden lang gehalten. Ein Druckabfall von mehr als 5 % löst eine automatische Ablehnung und eine Nahtnachprüfung aus.
    - step: '3'
      title: Last- und Balancetests
      desc: Fertige Bretter werden bis zur maximal zulässigen Kapazität beladen und auf Stabilität, Freibord und Handhabung getestet. Jedes Brett wird vor der Endkontrolle einem Wassertest unterzogen.
faq_section:
  tagline: Häufig gestellte Fragen
  title: Häufig gestellte Fragen
  questions:
    - q: Wo werden Ihre Stand-Up-Paddle-Boards hergestellt?
      a: Jedes Board wird in unserer eigenen 12.000 m² großen Fabrik in Weihai, China, hergestellt. Wir lagern nichts aus – Design, Materialien, Schweißen, Montage und Tests erfolgen alle unter einem Dach, sodass die Qualität niemals von einem Dritten abhängt.
    - q: Wie können Ihre Preise so viel niedriger als im Einzelhandel sein?
      a: Wir verkaufen Werksüberbestände und Ausverkaufsserien direkt aus unserer eigenen Produktionsstätte — ohne Zwischenhändler, ohne Einzelhandelaufschlag. Das bedeutet komplette SUP-Pakete mit bis zu 60% Rabatt auf die üblichen Einzelhandelspreise, bei gleicher druckgeprüfter Qualität.
    - q: Was ist bei einem Board enthalten?
      a: 'Jedes SUP wird als komplettes Paket geliefert: Brett, Reisrucksack, Handpumpe, verstellbares Paddel, abnehmbare Finne, Coil-Leash und Reparaturset.'
    - q: Wie schnell werden Bestellungen versendet?
      a: Vorrätige Bestellungen verlassen unser Werk in Weihai innerhalb von 2-3 Werktagen mit Sendungsverfolgung in 50+ Länder in der EU, Nordamerika, Asien-Pazifik und darüber hinaus.
production_flow:
  tagline: Produktionsfluss
  title: Vom Material zum fertigen Brett
  subtitle: Jedes Board durchläuft 6 Produktionsstufen mit Qualitätskontrollpunkten an jedem Schritt. Keine Abkürzungen, keine übersprungenen Inspektionen.
  stages:
    - stage: '01'
      title: Materialeingang & Wareneingangsprüfung
      description: Alle eingehenden Materialien werden nach Chargen-/Losnummer in unserem ERP System erfasst. PVC Stoffrollen, drop-stitch Kerne, Ventile, Klebstoffe und Hardware werden bis zur Freigabe durch die Qualitätskontrolle unter Quarantäne gestellt.
      qc_check: Zugfestigkeit, Reißfestigkeit, Dickenmessgerät, Klebstoffviskosität, Visuelle Fehlerprüfung
      qc_threshold: 100 % der geprüften Chargen. Ablehnen, wenn die Zugfestigkeit < 90 % der Spezifikation, die Reißfestigkeit < Spezifikationsminimum oder irgendein sichtbarer Mangel vorhanden ist
      responsibility: Eingehendes QC-Team (3 Prüfer)
    - stage: '02'
      title: CNC Schneiden & Materialvorbereitung
      description: Computergestütztes Nesting legt Platten auf PVC Vorrat aus, um Abfall zu minimieren. Automatische CNC Schneidemaschinen halten eine Positionsgenauigkeit von 0,1 mm.
      qc_check: Dimensionsprüfung gegen CAD-DXF-Dateien, Kantenqualitätsprüfung, Überprüfung der Paneelanzahl
      qc_threshold: Jedes 20. Panel wird gemessen. Toleranz ±0,5 mm. Charge ablehnen, wenn >2% außerhalb der Toleranz liegen
      responsibility: Leiter der Schneidwerkstatt
    - stage: '03'
      title: Schweißen & Drop-Stitch Kleben
      description: Drop-stitch-Kerne sind mit äußeren PVC-Schichten durch Hitzelaminierung verbunden. Rohrkammern werden RF-geschweißt oder Heißluft-geschweißt. Schienenbänder sind dreilagig verschmolzen.
      qc_check: Abziehprüfung alle 50 Einheiten, Schweißnahtbreitenmessung, Überprüfung des Heißlufttemperaturprotokolls, visuelle Nahtkontrolle unter Rücklicht
      qc_threshold: Abziehfestigkeit mindestens 8 N/cm. Schweißbreitentoleranz ±1 mm. Jegliches sichtbares Kanalisieren = Ablehnung
      responsibility: Schweiß-QC (2 Inspektoren pro Schicht)
    - stage: '04'
      title: Montage und Rigging
      description: 'Die Platinen gehen zur Endmontage, wo alle Komponenten montiert werden: installierte Ventile, D-Ringe, Griffe, Finnenboxen und Montage der Tragetasche. Jede Einheit folgt einer 100-Punkte-Montage-Checkliste.'
      qc_check: 100-Punkte-Checklisten-Signatur pro Einheit, Ventilfunktionstest (10 Öffnungs-/Schließzyklen), Hardware-Drehmomentüberprüfung, Sichtprüfung
      qc_threshold: Null-Fehler-Richtlinie bei sicherheitskritischen Gegenständen (Ventile, D-Ringe, Griffe). Kleinere kosmetische Mängel innerhalb strenger kosmetischer Grenzen
      responsibility: Zusammenbauteam Lead + Line QC
    - stage: '05'
      title: Druckprüfung & Qualitätshalt
      description: Jede Kammer wird auf 1,25× Nenndruck (typischerweise 20–25) PSI aufgeblasen und 24–48 Stunden gehalten. Drucksensoren protokollieren kontinuierlich. Kammern mit einem Druckabfall von über 5 % werden abgelehnt und zur Nahtinspektion geschickt.
      qc_check: 24-Stunden-Druckhaltprotokoll, täglich überprüfte Sensorkalibrierung, temperaturkompensierte Druckmessung, Nahttest nach Reparatur
      qc_threshold: Maximal 5 % Druckabfall über 24 Stunden bei stabiler Temperatur. Jede Kammer, die dies überschreitet = 100 % Nachtest der gesamten Produktionscharge.
      responsibility: Qualitätslabor (unabhängig von der Produktion, berichtet an das Management)
    - stage: '06'
      title: Endinspektion und Verpackung
      description: Endgültige visuelle und funktionale Inspektion. Oberflächenmängel, Farbkonsistenz, Etikett-/BIN-Verifikation, Verpackungsintegrität und Zubehör-Vollständigkeit. Die Einheiten werden vakuumverpackt, verpackt und für das Verladen von Containern palettiert.
      qc_check: Vollständige visuelle Inspektion, Zubehör-Checkliste pro SKU Stück, Verpackungs-Droptest (1 m, Zufallsprobe), Etikett-/Barcode-Scan-Verifikation
      qc_threshold: Null Toleranz gegenüber Sicherheitsmängeln. Kosmetische Mängel innerhalb strikter Grenzen. 100 % der Einheiten werden visuell inspiziert
      responsibility: Endgültiges QC-Team (4 Inspektoren) + Leiter des Packteams
