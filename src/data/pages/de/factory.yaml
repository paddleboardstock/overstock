hero:
  tagline: Fabrik
  title: Fabrik & Fertigung
  subtitle: 12.000 m² integrierte Fertigung – vom Rohmaterial bis zum fertigen Boot

intro:
  - Als Fabrikmarke des **Aquafarer Qingdao Manufacturing Hub** kontrolliert Aquafarer jede Produktionsstufe – vom Eingang der rohen PVC- und Glasfasermaterialien bis zur endgültigen Vorversandinspektion des fertigen Bootes. Unsere Fertigungsanlage in der Qingdao Economic Development Zone erstreckt sich über 12.000 Quadratmeter und beherbergt spezielle Werkstätten für PVC-Zuschnitt, Schlauchwärmeverbindung, Glasfaser-RIB-Rumpfproduktion, SUP-Digitaldruck, Endmontage und Qualitätsprüfung.
  - Durch die Integration von Design, Technik, Prototyping, Fertigung und Prüfung unter einem Dach eliminieren wir die Ineffizienzen der Auftragsfertigung und behalten die direkte Kontrolle über Bauqualität, Materialauswahl und Liefertermine. Jedes Boot, das unsere Werkstatt verlässt, wird von unseren Leuten, auf unserer Ausrüstung, nach unseren Standards gebaut.

