hero:
  tagline: Fabrik
  title: Fabrik & Herstellung
  subtitle: 12.000 m² integrierte Fertigung – vom Rohmaterial bis zur fertigen Platte
intro:
  - Als Fabrikmarke des **Paddle Board Overstock Weihai Manufacturing Hub** kontrolliert Paddle Board Overstock jede Produktionsstufe – vom Eintreffen der Roh-PVC und drop-stitch-Materialien bis zur abschließenden Vorlieferungskontrolle der fertigen Platte. Unsere Produktionsstätte in der Weihai Economic Development Zone erstreckt sich über 12.000 Quadratmeter und beherbergt spezialisierte Werkstätten für PVC Schneiden, Heißsiegeln und Schweißen, Deck Art-Finishing, Endmontage und Qualitätstest.
  - Durch die Integration von Design, Engineering, Prototyping, Fertigung und Tests unter einem Dach beseitigen wir die Ineffizienzen der Auftragsfertigung und behalten die direkte Kontrolle über Bauqualität, Materialauswahl und Lieferzeiten. Jede Platte, die unsere Werkstatt verlässt, wird von unseren Mitarbeitern, auf unserer Ausrüstung und nach unseren Standards gefertigt.
