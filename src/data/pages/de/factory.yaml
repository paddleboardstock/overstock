workshops_section:
  tagline: Werkstätten
  title: Produktionswerkstätten
  workshops:
    - title: PVC Schneiden & Materialvorbereitung
      description: Automatische CNC-Schneidemaschinen verarbeiten PVC- und drop-stitch-Gewebe mit submillimetergenauer Präzision. Computergestütztes Nesting minimiert Materialabfall und stellt sicher, dass jedes Paneel vor dem Schweißen seinen Maßspezifikationen entspricht.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Schweißen & Heißsiegeln
      description: Spezialisierte Schweißwerkstatt mit Wärmedichtungsmaschinen und RF-Dielektrikpressen. Heißluftschweißer verbinden und drop-stitch verschmelzen Kernlaminate und Schienenbänder, während HF-Schweißbänder hochfeste luftdichte Nähte erzeugen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Deckkunst & EVA Fertigstellung
      description: 'Art-Series-Decks nehmen hier Gestalt an: Präzisionsgeschnittene EVA Schaumstoffplatten werden zu Volldeck-Mustern gelegt, von Hand verklebt und für ein griffiges, bequemes und langlebiges Finish bearbeitet – das Markenzeichen jedes Art-Series-Boards.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Druck und Dekoration
      description: SUP Die Tafeln werden mit Digitaldruck für vollfarbige Grafiken und Siebdruck für Logos und wiederholende Muster dekoriert. Digitaldrucker produzieren fotohochwertige Deck-Designs, während Siebdruck langlebige, lebendige Markenmarken liefert.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Endmontage & Rigging
      description: Fließband, wo die Bretter ihre Ventile, D-Ringe, Griffe, Flossen und Leinenbefestigungen erhalten. Jede Platine folgt einer 100-Punkte-Checkliste, die vom Teamleiter unterzeichnet wird.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Qualitätsprüfung & Inspektion
      description: Jede fertige Platine wird vor dem Versand einer obligatorischen Luftretentionsprüfung, einer Überprüfung der Nahtabzüge und einer vollständigen Systemüberprüfung durchgeführt. Unser Qualitätslabor arbeitet unabhängig von der Produktion und berichtet direkt an das Management.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
