material_traceability:
  tagline: Rückverfolgbarkeit
  title: Materialverfolgung & Chargenkontrolle
  description: Jede Rohmaterialcharge erhält eine eindeutige Losnummer in unserem ERP-System. Von der Anlieferung über die Produktion bis zum Endprodukt verweist die Stückliste jedes Bootes auf die ursprüngliche Lieferantencharge. Dies ermöglicht eine vollständige Rückverfolgbarkeit für jede Qualitäts- oder Compliance-Anfrage.
  system: Eigenentwickeltes ERP (internes System) + physische Chargen-Etiketten an jedem Fertigungsauftrag
  coverage: 100 % der Produktionsmaterialien — PVC, Hypalon, Drop-Stitch-Gewebe, Klebstoffe, Ventile, Beschläge, Verpackung
  records_retained: 10 Jahre (gemäß CE 2013/53/EU)
  suppliers:
    - material: Marine-PVC
      source: Chinesische und koreanische Lieferanten
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanischer Lieferant
      certified: ISO 9001, REACH
    - material: Drop-Stitch-Gewebe
      source: Eigene Weberei + externer Partner
      certified: Interne QC + ISO 9001 des Lieferanten
    - material: Ventile & Beschläge
      source: Chinesische OEM-Lieferanten
      certified: ISO 9001, Materialzertifikate je Charge

