material_traceability:
  tagline: Rückverfolgbarkeit
  title: Materialverfolgung & Chargenkontrolle
  description: Jeder Rohmaterialcharge wird in unserem ERP-System eine eindeutige Losnummer zugewiesen. Vom Eintreffen über die Produktion bis zum fertigen Produkt verknüpft sich die Stückliste jeder Platine mit der ursprünglichen Lieferantencharge. Dies ermöglicht eine vollständige Rückverfolgbarkeit nach oben für jede Qualitätsanfrage.
  system: Benutzerdefiniertes ERP (internes System) + physische Chargenetiketten auf jedem Arbeitsauftrag
  coverage: 100% der Produktionsmaterialien — PVC, drop-stitch Stoff, EVA Schaumstoff, Klebstoffe, Ventile, Hardware, Verpackung
  records_retained: 10 Jahre
