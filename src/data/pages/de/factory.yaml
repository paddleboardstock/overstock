qc_section:
  tagline: Qualitätskontrolle
  title: Prüf- & Qualitätssicherungsprozess
  subtitle: Jedes Boot durchläuft vor dem Versand obligatorische Tests. Unser Qualitätslabor arbeitet unabhängig von der Produktion und berichtet direkt an das Management.
  steps:
    - step: '1'
      title: Rohmaterialprüfung
      desc: PVC, Hypalon und Drop-Stitch-Gewebe werden vor dem Produktionseinsatz einer Zugprüfung (ASTM D751), Weiterreißprüfung und UV-Beständigkeitsprüfung unterzogen.
    - step: '2'
      title: 48-Stunden-Luftdichtheitstest
      desc: Jede Schlauchkammer wird auf 125 % des Nenndrucks aufgepumpt und 48 Stunden gehalten. Ein Druckabfall unter 5 % löst automatische Ablehnung und Nahtnachprüfung aus.
    - step: '3'
      title: Last- & Gleichgewichtsprüfung
      desc: Fertige Boote werden bis zur maximalen Nennkapazität beladen und auf Stabilität, Freibord und Fahrverhalten geprüft. Jedes Schiff wird vor der Endkontrolle einem Wassertest unterzogen.

oem_section:
  tagline: OEM-Projekte
  title: Marken- & OEM-Partnerschaftsfallstudien
  subtitle: Vom Konzept bis zum Container – wie wir globalen Marken helfen, ihre Schlauchbootlinien zu starten und zu skalieren.
  cases:
    - challenge: Ein europäischer Outdoor-Händler benötigte eine Private-Label-SUP-Linie mit einzigartigen Deckgrafiken, umweltfreundlichem PVC und verkaufsfertiger Verpackung – alles innerhalb von 60 Tagen.
      solution: Entwicklung kundenspezifischer digitaler Druckdateien, Beschaffung REACH-konformen PVCs und Komprimierung der Bemusterung von 3 Runden auf 1 durch Zusammenlegung des Designteams in unserer Qingdao-Fabrik.
      result: 55 Tage von unterzeichneter Bestellung bis FOB. 2.400 Einheiten in 4 SKUs. Folgeauftrag vor Ankunft des ersten Containers.
    - challenge: Ein US-Wassersport-Startup benötigte einen leistungsstarken Drop-Stitch-Kayak mit kundenspezifischer Rumpfform, Co-Branding-Verpackung und BSCI-Zertifizierung für den Einzelhandel.
      solution: Anpassung einer bestehenden Drop-Stitch-Kayakform mit modifiziertem Rockerprofil, Entwicklung von Co-Branding-Verpackungsgrafiken und Bereitstellung vollständiger BSCI-Auditdokumentation.
      result: Erfolgreich in 3 großen US-Outdoor-Ketten gelistet. 5.000+ Einheiten im ersten Jahr mit 98 % Durchverkaufsrate.
    - challenge: Ein australischer Distributor benötigte eine CE-zertifizierte RIB-Palette mit kundenspezifischen Schlauchfarben, Hypalon-Upgrade-Option und Konformität mit dem australischen Standard AS 1799.
      solution: Produktion von Vorserienmustern mit 4 Schlauchfarbvarianten, Beschaffung von CSM-Hypalon von einem japanischen Lieferanten und Koordination der AS-1799-Konformitätsprüfung durch Dritte.
      result: 3-modellige RIB-Palette auf dem AU/NZ-Markt eingeführt. Gefolgt von einem Regierungsauftrag für 12 Patrouillen-RIBs.

faq_section:
  tagline: FAQ
  title: B2B- & OEM-häufig gestellte Fragen
  questions:
    - q: Wie hoch ist die Mindestbestellmenge (MOQ) für OEM-aufblasbare SUP-Boards?
      a: Die MOQ beginnt bei 5–10 Einheiten für Standard-OEM-Modelle. Kundenspezifische Formen und Private-Label-Projekte erfordern je nach Komplexität mindestens 200 Einheiten. Probebestellungen und Musterläufe sind für neue Marken erhältlich.
    - q: Besitzt Aquafarer eine BSCI-Zertifizierung?
      a: Ja. Unser Werk unterhält eine gültige BSCI-Social-Compliance-Zertifizierung (Prüfbericht auf Anfrage erhältlich). Wir besitzen auch ISO 9001:2015 für Qualitätsmanagement, und 64 unserer Modelle tragen die CE-Zertifizierung (TÜV Rheinland). REACH- und RoHS-Konformitätsdokumentation wird mit jeder OEM-Sendung bereitgestellt.
    - q: Wie ist die typische Lieferzeit für einen OEM-Auftrag?
      a: Die Standardlieferzeit beträgt 30–45 Tage ab bestätigter Bestellung und Anzahlung. Die Entwicklung kundenspezifischer Formen verlängert die Werkzeugvorbereitung um 15–20 Tage. Wir bieten Expressfertigung für dringende Bestellungen und saisonale Spitzen im Vor-Sommer-Fenster (Jan–Mär).
    - q: Können Sie FOB Qingdao oder CIF zu unserem Hafen versenden?
      a: Ja. Wir versenden FOB Qingdao, CIF zu großen globalen Häfen und DDP für qualifizierte Partner. Unser Logistikteam übernimmt Containerbuchung, Exportedokumentation und Zollabfertigung. Wir versenden in 50+ Länder in den Märkten EU, USA, AU und Asien.

b2b_moq: 'Standard-Mindestbestellmenge (MOQ): 5–10 Einheiten pro Modell (SUP/Kayak/Drop-Stitch). RIB-MOQ: 2–5 Einheiten. Probebestellungen für neue Partnerschaften willkommen.'

production_flow:
  tagline: Produktionsablauf
  title: Vom Material zum fertigen Boot
  subtitle: Jedes Boot durchläuft 6 Produktionsstufen mit QC-Kontrollpunkten bei jedem Schritt. Keine Abkürzungen, keine übersprungenen Prüfungen.
  stages:
    - stage: '01'
      title: Materialeingang & Eingangskontrolle
      description: Alle eingehenden Materialien werden per Charge/Losnummer in unserem ERP-System erfasst. PVC-Gewebebahnen, Drop-Stitch-Kerne, Ventile, Klebstoffe und Beschläge werden unter Quarantäne gestellt, bis die QC sie freigibt.
      qc_check: Zugfestigkeit (ASTM D751), Weiterreißfestigkeit (ISO 4674), Dickenmessung, Klebstoffviskosität, Sichtprüfung auf Mängel
      qc_threshold: 100 % der Chargen geprüft. Ablehnung bei Zugfestigkeit < 90 % der Spezifikation, Weiterreißfestigkeit unter Mindestwert oder sichtbaren Mängeln
      responsibility: Eingangs-QC-Team (3 Prüfer)
    - stage: '02'
      title: CNC-Zuschnitt & Materialvorbereitung
      description: Computeroptimiertes Nesting legt die Zuschnitte auf dem PVC-Material an, um Verschnitt zu minimieren. Automatische CNC-Schneidanlagen halten eine Positionsgenauigkeit von 0,1 mm.
      qc_check: Maßkontrolle gegen CAD-DXF-Dateien, Kantenqualitätsprüfung, Verifikation der Zuschnittanzahl
      qc_threshold: Jede 20. Zuschnittfläche vermessen. Toleranz ±0,5 mm. Chargenablehnung bei >2 % außerhalb der Toleranz
      responsibility: Leiter Zuschnittwerkstatt
    - stage: '03'
      title: Schweißen & Drop-Stitch-Verbindung
      description: Drop-Stitch-Kerne werden mittels Heißlaminierung mit den äußeren PVC-Laminaten verbunden. Schlauchkammern werden HF- oder Heißluftgeschweißt. Schienenbänder werden dreischichtig fusioniert.
      qc_check: Schältest alle 50 Einheiten (ASTM D751), Messung der Schweißnahtbreite, Prüfung der Heißluft-Temperaturprotokolle, Sichtprüfung der Nähte unter Gegenlicht
      qc_threshold: Schälfestigkeit min. 8 N/cm. Toleranz der Schweißnahtbreite ±1 mm. Jede sichtbare Kanalbildung = Ablehnung
      responsibility: Schweiß-QC (2 Prüfer pro Schicht)
    - stage: '04'
      title: Montage & Ausrüstung
      description: 'Die Boote gehen zur Endmontage, wo alle Komponenten zusammengefügt werden: Rumpf + Schläuche, Ventile eingebaut, D-Ringe, Griffe, Finnenboxen und Anpassung der Tragetasche. Jede Einheit folgt einer 100-Punkte-Montageliste.'
      qc_check: Abnahme per 100-Punkte-Checkliste für jede Einheit, Ventilfunktionstest (10 Öffnungs-/Schließzyklen), Drehmomentprüfung der Beschläge, Sichtprüfung
      qc_threshold: 'Null-Fehler-Strategie bei sicherheitskritischen Teilen (Ventile, D-Ringe, Griffe). Geringfügige Optikmängel: AQL 2,5 (ISO 2859)'
      responsibility: Montageleiter + Linien-QC
    - stage: '05'
      title: Druckprüfung & Qualitätssperre
      description: Jede Kammer wird auf 1,25× Nenndruck aufgepumpt (in der Regel 20–25 PSI) und 24–48 Stunden gehalten. Drucksensoren protokollieren kontinuierlich. Kammern mit mehr als 5 % Druckabfall werden abgelehnt und zur Naht-Nachprüfung gegeben.
      qc_check: 24h-Druckhalteprotokoll, Sensorkalibrierung täglich verifiziert, temperaturkompensierte Druckmessung, Naht-Nachtest nach Reparatur
      qc_threshold: Max. 5 % Druckabfall über 24 h bei stabiler Temperatur. Jede Kammer darüber = 100 %-Nachtest der gesamten Produktionscharge
      responsibility: Qualitätslabor (unabhängig von der Produktion, berichtet an die Geschäftsführung)
    - stage: '06'
      title: Endkontrolle & Verpackung
      description: Abschließende visuelle und funktionelle Prüfung. Oberflächenmängel, Farbgleichmäßigkeit, Etiketten-/BIN-Verifikation, Verpackungsintegrität und Vollständigkeit des Zubehörs. Einheiten werden vakuumverpackt, kartoniert und für die Containerverladung palettiert.
      qc_check: Vollständige Sichtprüfung, Zubehör-Checkliste je SKU, Verpackungs-Falltest (1 m, Stichprobe), Etiketten-/Barcode-Scan-Verifikation
      qc_threshold: AQL 2,5 für wesentliche Mängel, AQL 4,0 für geringfügige. Null Toleranz bei Sicherheitsmängeln. 100 % der Einheiten visuell geprüft
      responsibility: End-QC-Team (4 Prüfer) + Leiter Verpackung

