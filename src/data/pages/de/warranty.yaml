label: Garantie
headline: Paddle Board Overstock Herstellergarantie des Herstellers
subtitle: Paddle Board Overstock steht hinter der Qualität jedes aufblasbaren SUP-Boards, das wir herstellen. Diese eingeschränkte Garantie legt die Bedingungen und den Umfang für Ihr Paddle Board Overstock-Board fest.
seo:
  headline: Paddle Board Overstock SUP Garantie — 2 Jahre beschränkte Garantie | Paddle Board Overstock
  description: Paddle Board Overstock bietet eine 2-jährige eingeschränkte Garantie, die drop-stitch-Nähte, Schienenkonstruktion, Aufblasventile und enthaltenes Zubehör auf jedem SUP-Board abdeckt. Vollständige Geschäftsbedingungen.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Diese begrenzte Garantie gilt für neue Paddle Board Overstock-gebrandete aufblasbare SUP-Boards, die direkt im Paddle Board Overstock-Onlineshop gekauft wurden. Das Datum des Inkrafttretens ist das nachweisbare Datum des ursprünglichen Kaufs.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Garantieabdeckung & Dauer</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Jahre</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch Kern- & Deckstruktur</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Jahre</h3>
          <p class="text-sm text-gray-600 mt-1">Schienen- und Nahtkonstruktion</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Jahre</h3>
          <p class="text-sm text-gray-600 mt-1">Funktionalität des Aufblasventils</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Jahre</h3>
          <p class="text-sm text-gray-600 mt-1">Zubehör enthalten (Pumpe, Paddel, Leine, Flosse)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Jahr*</h3>
          <p class="text-sm text-gray-600 mt-1">Gewerbliche Nutzung, Vermietung oder Flotteneinsatz – alle Komponenten</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Gewerbliche, Vermietungs- oder Flottennutzung reduziert die Garantie auf 1 Jahr. Renn- oder Wettkampfnutzung setzt die Garantie vollständig außer Kraft.</p>
    </div>

    <h2>Was abgedeckt ist</h2>
    <h3>Drop-Stitch Kern- & Deckstruktur (2 Jahre)</h3>
    <p>Der innere drop-stitch-Kern und die äußere Struktur des Boards sind gegen Herstellungsfehler garantiert, die die Fähigkeit des Boards beeinträchtigen, die Betriebsinflation und Steifigkeit aufrechtzuerhalten.</p>

    <h3>Schienen- und Nahtkonstruktion (2 Jahre)</h3>
    <p>Die Nähte und dreilagigen Schienenbänder, die während der Herstellung verbunden wurden, sind gegen Herstellungsfehler garantiert, die zu erheblichem Luftaustritt durch die Naht führen. Die regelmäßige Inspektion und die Wartung des entsprechenden Reifendrucks sind Bedingungen für die Deckung.</p>

    <h3>Inflationsventil Funktionalität (2 Jahre)</h3>
    <p>Luftfüllventile, die ursprünglich von Paddle Board Overstock installiert wurden, sind gegen Herstellungsfehler im Material oder in der Verarbeitung garantiert, die verhindern, dass das Ventil die Luft wie vorgesehen hält.</p>

    <h3>Enthaltenes Zubehör (2 Jahre)</h3>
    <p>Die Pumpe, das verstellbare Paddel, die Leine, die abnehmbare Finne und andere Komponenten, die in Ihrem Board-Paket enthalten sind, sind gegen Material- und Herstellungsfehler garantiert.</p>

    <h2>Was nicht abgedeckt ist</h2>
    <ul>
      <li>Kosmetische Mängel einschließlich Verfärbung, Fleckenbildung, Ausbleichen, Kreidung oder jeglicher Veränderung im Erscheinungsbild</li>
      <li>Durchstiche, Schnitte, Risse, Einreißungen oder andere physische Schäden</li>
      <li>Craquelé, Risse, Abrieb, Scheuern oder Verschlechterung durch Reibung oder Kontakt</li>
      <li>Abbau durch UV-Lichtbelastung, Witterungseinflüsse oder atmosphärische Bedingungen</li>
      <li>Schäden durch Kontakt mit Lösungsmitteln, Säuren, Alkalien oder Chemikalien</li>
      <li>Schäden durch Fahrlässigkeit, unsachgemäße Nutzung, Missbrauch, Unfall oder normalen Verschleiß</li>
      <li>Schäden durch Aufprall, Belastung, unsachgemäße Unterstützung oder Transport</li>
      <li>Schäden durch unsachgemäße Inflation/Deflation oder den Einsatz nicht zugelassener Aufblasgeräte</li>
      <li>Drittanbieter-Geräte, Komponenten oder Systeme (abgedeckt von ihren jeweiligen Herstellern)</li>
    </ul>

    <h2>Herstellerpflicht und Abhilfe</h2>
    <p>Paddle Board Overstock Die einzige und ausschließliche Verpflichtung von 's ist die Reparatur oder der Austausch nach Paddle Board Overstock's Wahl eines Bauteils, das als mangelhaft in Materialien oder Verarbeitung eingestuft wird und durch diese Garantie abgedeckt ist. Reparaturen oder Austausch werden von Paddle Board Overstock oder deren zugewiesener Werkstatt durchgeführt. Reparierte oder ausgetauschte Komponenten werden nur für den nicht abgelaufenen Teil der ursprünglichen Garantiezeit garantiert.</p>

    <h2>Garantiebedingungen</h2>
    <ul>
      <li><strong>Wartung:</strong>Das Produkt muss gemäß Paddle Board Overstock den veröffentlichten Richtlinien gewartet werden, einschließlich regelmäßiger Inspektion und Aufrechterhaltung geeigneter Inflationsdrücke.</li>
      <li><strong>Kooperation:</strong>Der Käufer muss Paddle Board Overstock in allen Angelegenheiten im Zusammenhang mit Garantieansprüchen vollständig und umgehend kooperieren.</li>
      <li><strong>Ursprünglicher Käufer:</strong>Diese Garantie gilt ausschließlich dem ursprünglichen Endnutzer und ist nicht übertragbar.</li>
    </ul>

    <h2>Kommerzielle Nutzung</h2>
    <p>Wenn das Produkt für kommerzielle, Miet- oder Flottenzwecke verwendet wird, wird die Garantiezeit für alle Komponenten auf ein (1) Jahr ab dem ursprünglichen Kaufdatum verkürzt. Die Verwendung im Renn-, Geschwindigkeits- oder Ausdauerwettbewerb erlischt die Garantie sofort und unwiderruflich vollständig.</p>

    <h2>Wie man einen Garantieanspruch stellt</h2>
    <p>Kontaktieren Paddle Board Overstock Sie mit Kaufnachweis und einer detaillierten Beschreibung des Problems.Paddle Board Overstock Wir prüfen den Anspruch und geben Ihnen Anweisungen zur Inspektion und Wartung.</p>
    <p>Für Anfragen zum Garantieservice kontaktieren Sie uns bitte über unser<a href="/contact" class="text-sky-600 underline">Kontaktseite</a>Mit Ihrer Bestellnummer und Produktdetails.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Diese Garantieerklärung ist eine Zusammenfassung der vollständigen Paddle Board Overstock Herstellergarantie. Das vollständige gesetzliche Garantiedokument regelt alle Garantiebedingungen. Spezifikationen können ohne Vorankündigung geändert werden.Paddle Board Overstock ist eine Werksmarke des Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
