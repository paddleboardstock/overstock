hero_text:
  tagline: Kontakt
  title: KONTAKTIEREN SIE UNS
contact_form:
  id: form
  title: Schicken Sie uns eine Nachricht
  subtitle: Bei Fragen zu Bestellungen, Größenberatung oder Produktsupport schreiben Sie uns eine Nachricht. Wir antworten innerhalb eines Werktages.
  email_to: info@paddleboardoverstock.com
  submit_button: Anfrage senden → Angebot anfordern
  success_message: Danke! Ihre Nachricht ist in unserem Posteingang eingegangen. Wir werden innerhalb eines Werktages antworten.
  error_message: Beim Senden Ihrer Nachricht ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut oder senden Sie uns direkt eine E-Mail.
  default_country_code: '+1'
  captcha:
    label: 'Anti-Spam: bitte lösen Sie Folgendes'
  fields:
    - name: Vorname
      label: Vorname
      row: 1
    - name: Nachname
      label: Nachname
      row: 1
    - name: Name der Firma
      label: Name der Firma
      row: 2
    - name: address
      label: Adresse
      row: 3
    - name: zip
      label: PLZ / Postleitzahl
      row: 4
    - name: country
      label: Land
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-Mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: Bestellvolumen
      label: Geschätztes Bestellvolumen
      row: 6
      type: select
      options:
        - value: ''
          label: Für wie viele Boards möchten Sie bestellen?...
        - value: one
          label: Nur ein Board
        - value: 2-4
          label: 2–4 Boards
        - value: 5-plus
          label: 5+ Boards (Familie, Verein oder Verleih)
    - name: customization
      label: Wobei können wir helfen?
      row: 7
      type: select
      options:
        - value: ''
          label: Thema auswählen...
        - value: none
          label: Allgemeine Produktfrage
        - value: sizing
          label: Hilfe bei der Auswahl des richtigen Boards
        - value: order
          label: Bestellung, Zahlung oder Versand
        - value: warranty
          label: Garantie- oder Reparaturunterstützung
    - name: ProduktInteresse
      label: Produktkategorien von Interesse
      row: 8
      type: select
      options:
        - value: ''
          label: Produktkategorie auswählen...
        - value: all
          label: Alle Produkte / Gesamtkatalog
        - value: sup
          label: SUP Boards / Stand-Up-Paddleboards
        - value: packages
          label: Komplette SUP-Pakete
        - value: accessory
          label: Zubehör (Pumpen, Paddel, Taschen)
    - name: subject
      label: Betreff
      row: 9
    - name: message
      label: Nachricht
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
