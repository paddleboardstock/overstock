      icon: tabler:news
    - title: Telefon
      description: +1 279 732 3333 (US-Hauptsitz) · +86 13305324192 (Fabrik)
      icon: tabler:headset
    - title: E-Mail
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Globaler Hauptsitz & Abrechnung
      description: Weihai Dongjilian Co., Ltd.
      icon: tabler:map-pin
map:
