  items:
    - title: Markeninhaber / Private Label
      description: 'Individuelle Produktentwicklung, Private-Label-Designs, Konformitätsdokumentation unter Ihrer Marke und persönliche Entwicklungsunterstützung vom Konzept bis zum Container.'
      icon: tabler:palette
      cta: OEM/ODM-Angebot anfordern
      cta_href: /request-quotation
    - title: Händler / Großhandel
      description: 'Gebietsschutz, wettbewerbsfähige Großhandelspreise, Marketingpakete, Produktschulungen und komplette Konformitätsdokumentation für Ihren Markt.'
      icon: tabler:world
      cta: Als Händler bewerben
      cta_href: /dealers-distributors
    - title: Resorts / Bootsvermieter
      description: 'Robustheit für den Gewerbeeinsatz, Flottenplanung, gemischte Containerbestellungen, Ersatzteilstrategie und Ausrüstungspakete mit Resort-Branding.'
      icon: tabler:beach
      cta: Gewerbepaket anfordern
      cta_href: /solutions/resorts
    - title: Rettungsdienste / Behörden / Profis
      description: 'Hypalon/CSM-Konstruktionen, SOLAS-Konformitätsoptionen, projektspezifische Zertifizierung, Unterstützung bei Ausschreibungsunterlagen und Entwicklung unter NDA.'
      icon: tabler:shield
      cta: Projekt besprechen
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: OEM/ODM-Fähigkeiten
  title: 'Was Sie bei<br />Aquafarer bekommen'
  subtitle: 'Direkter Zugriff auf die Fabrik – mit kompletter Entwicklungs-, Qualitäts- und Konformitätsunterstützung. Kein Handelsunternehmen.'
  columns: 2
  items:
    - title: OEM/ODM-Anpassung
      description: 'Individuelle Rumpfform, Schlauchmaterial (PVC oder Hypalon/CSM), Konsolanordnung, Sitzlayout, Branding, Farben und Verpackung. Vom Feinschliff bestehender Modelle bis zur kompletten Neuentwicklung.'
      icon: tabler:adjustments
    - title: Niedrige MOQ, schnelle Muster
      description: 'RIB: 2–5 Einheiten (bestehende Form). SUP: 5–10 Einheiten pro SKU. Eigene Formen: ab 200 Einheiten. Vorserienmuster mit Ihrem Branding in 7–14 Tagen.'
      icon: tabler:rocket
    - title: Serienreife Qualität
      description: 'Jede Einheit wird 24–48 Stunden mit dem 1,25-fachen Nenndruck geprüft. 99,3 % fehlerfrei nach AQL 2,5 / ISO 2859. 100-Punkte-Checkliste pro Rumpf.'
      icon: tabler:certificate
    - title: Vollständige Konformitätsdokumentation
      description: 'CE nach 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI-Sozialaudit, REACH, UKCA-Kennzeichnung. Modellspezifische Konformitätserklärung und Herstellerplakette inklusive.'
      icon: tabler:file-certificate
    - title: 30–45 Tage Lieferzeit
      description: 'Serienproduktion 30–45 Tage FOB Qingdao. Prototypen in 7–14 Tagen. Eilproduktion möglich. Containerbeladepläne und ISPM-15-Verpackung inklusive.'
      icon: tabler:truck-delivery
    - title: After-Sales & Ersatzteile
      description: '5 Jahre Garantie auf Boote, Kajaks und RIBs, 2 Jahre auf SUP und Zubehör. Ersatzteillieferung mit Prioritätsversand. Unterstützung bei Garantieabwicklung.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Produktkategorien
  title: '5 Kategorien,<br />64 CE-zertifizierte Modelle'
  subtitle: 'Vom 2,4-m-RIB-Tender bis zum 15-Fuß-SUP – alles entsteht in unserem ISO-9001-Werk in Qingdao.'
  items:
    - title: RIB-Boote
      description: '2,4 m bis 7,0 m mit Aluminium- oder GfK-Rumpf. PVC- oder Hypalon/CSM-Schläuche. CE nach 2013/53/EU. Konfigurationen für Patrouillen, Tauchbetrieb, Rettung und Gewerbe.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Schlauchboote
      description: '2,0 m bis 5,0 m mit Aluminiumboden, Sperrholzboden oder Luftdeck. Modelle für Angeln, Freizeit und als Tender.'
      icon: tabler:sailboat
      link: /products
    - title: SUP Boards
      description: '9 bis 15 Fuß in 4-Zoll- und 6-Zoll-Drop-Stitch. Allround, Touring, Yoga und Angeln. Auch in gewerblicher Qualität.'
      icon: tabler:swimming
      link: /products
    - title: Kajaks
      description: 'Aufblasbare Kajaks für eine bis drei Personen. Freizeit- und Touringmodelle mit Drop-Stitch-Boden.'
      icon: tabler:kayak
      link: /products
    - title: Sicherheitszubehör
      description: 'CE-zertifizierte Schwimmwesten, Wurfleinen, Reparatursets, Pumpen und Positionslichter. USCG Typ III/V zugelassene Rettungswesten.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Fabrikstärke
  title: 'Auditbereite Fertigung<br />in Qingdao'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12.000 m² ISO-9001-Werk — echter Hersteller, kein Handelsunternehmen</h3>
  items:
    - title: 6 dedizierte Produktionslinien
      description: 'Getrennte Linien für RIBs, Schlauchboote, SUP, Kajaks, Sicherheitsausrüstung und OEM/ODM. Jede mit eigenen QC-Prüfpunkten und eigener Produktionsplanung.'
    - title: 100 % druckgetestet
      description: 'Jede Luftkammer wird auf das 1,25-Fache des Nenndrucks aufgepumpt und 24–48 Stunden gehalten. Die Prüfergebnisse sind der Rumpfseriennummer (HIN) zugeordnet.'
    - title: Rückverfolgbarkeit pro Rumpf
      description: 'Produktionsdaten auf HIN-Ebene mit über 21 Feldern pro Rumpf: Materialcharge, Schweißer-ID, Drucktestergebnis, Endkonfiguration und Lieferziel.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarers 12.000-m²-ISO-9001-Fertigungsanlage in Qingdao mit RIB-Produktionslinien

content_compliance:
  tagline: Konformität & Qualitätsnachweise
  title: 'Belege statt<br />Behauptungen'
  subtitle: 'Hinter jeder Konformitätsangabe steht eine modellspezifische Dokumentation, die Sie jederzeit einsehen können.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Qualitätsmanagementsystem, zertifiziert durch TÜV Rheinland/SGS. Jährliche Überwachungsaudits. Dokumentierte QC-Prozesse vom Materialeingang bis zur Versandfreigabe.'
      icon: tabler:certificate
    - title: CE nach 2013/53/EU (RCD)
      description: '64 Modelle mit modellspezifischer Konformitätserklärung. Konformitätsbewertung nach den einschlägigen Modulen. HIN-Registrierung und Herstellerplakette für jeden Rumpf.'
      icon: tabler:file-certificate
    - title: BSCI-Sozialaudit
      description: 'Jährliches BSCI-Audit durch SGS. Geprüfte faire Arbeitsbedingungen, Arbeitssicherheit und Umweltmanagement im gesamten Werk.'
      icon: tabler:users
    - title: REACH & UKCA
      description: 'Alle PVC- und Klebematerialien erfüllen die EU-REACH-Verordnung. UKCA-Kennzeichnung für den britischen Markt verfügbar. Sicherheitsdatenblätter auf Anfrage.'
      icon: tabler:shield-check

steps:
  title: Der OEM/ODM-Prozess — von der Anfrage bis zum Container
  items:
    - title: 'Schritt 1: <span class="font-medium">Anforderungen</span>'
      description: 'Teilen Sie uns Produktspezifikationen, Zielmarkt, Stückzahlen und Konformitätsanforderungen mit. Unser Entwicklungsteam prüft alles innerhalb von 48 Stunden.'
      icon: tabler:file-text
    - title: 'Schritt 2: <span class="font-medium">Angebot</span>'
      description: 'Sie erhalten ein detailliertes Angebot mit Spezifikationen, Materialoptionen, MOQ, Preisen, Lieferzeit und Konformitätsumfang für Ihren Markt.'
      icon: tabler:clipboard-list
    - title: 'Schritt 3: <span class="font-medium">Prototyp</span>'
      description: 'Vorserienmuster mit Ihrem Branding in 7–14 Tagen. Vollständige Qualitätsprüfung beim 1,25-fachen Nenndruck. Musterkosten werden mit der Serie verrechnet.'
      icon: tabler:settings
    - title: 'Schritt 4: <span class="font-medium">Produktion</span>'
      description: '30–45 Tage Produktion FOB Qingdao nach Musterfreigabe. QC-Prüfpunkte in der Fertigung, Drucktests und 100-Punkte-Endkontrolle an jeder Einheit.'
      icon: tabler:building-factory
    - title: 'Schritt 5: <span class="font-medium">Lieferung</span>'
      description: 'Containerbeladeplan, ISPM-15-Holzverpackung, Konformitätsunterlagen und Verschiffung FOB Qingdao mit kompletten Exportpapieren.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Der OEM/ODM-Fertigungsprozess von Aquafarer – von der Konstruktion bis zum Container

