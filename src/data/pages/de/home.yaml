content_workshop:
  isReversed: true
  tagline: Werksstärke
  title: Warum unsere Ausverkaufspreise<br />Sind echt
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Echte Fabrik, echte Einsparungen – Jedes Brett wird aus unserer Einrichtung in Weihai versandt</h3>
  items:
    - title: Gleiche Produktionslinien wie große Marken
      description: Unsere 12.000 m² große Fabrik in Weihai stellt auf denselben Produktionslinien mit denselben Materialien Platinen für internationale Marken und unsere eigenen Überbestandschargen her.
    - title: 100% Druckgeprüft
      description: Jedes Board wird auf 1,25-fachen Nennwert PSI unter Druck gesetzt und vor dem Versand gehalten. 99,3 % fehlerfreie Rate pro AQL 2,5 / ISO 2859.
    - title: Keine Zwischenhändler
      description: Boards werden direkt vom Werk zu Ihnen nach Hause geliefert. Kein Aufschlag durch Zwischenhändler, kein Einzelhandelaufschlag — so bleibt der Räumungspreis bis zu 60 % unter dem Einzelhandelspreis.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12.000 m² große Fabrik in Weihai mit aufblasbaren SUP-Produktionslinien
