faqs:
  title: B2B-Beschaffung — häufige Fragen
  subtitle: 'Was Marken, Händler und gewerbliche Betreiber am häufigsten zur OEM/ODM-Fertigung bei Aquafarer fragen.'
  columns: 2
  items:
    - title: Sind Sie Hersteller oder Handelsunternehmen?
      description: 'Wir sind ein vertikal integrierter Betrieb mit voller Kontrolle über Qualität, Material und Termine. Gewerbeschein und Produktionsumfang lassen sich beim Werksaudit überprüfen.'
      icon: tabler:building-factory
      category: all
    - title: Wie läuft Ihr OEM/ODM-Prozess ab?
      description: 'Von der Anforderungsprüfung (48 h) über Angebot und Prototyp (7–14 Tage) bis zur Produktion (30–45 Tage FOB Qingdao). Durchgehend mit Entwicklungsunterstützung, Konformitätsdokumentation und Rückverfolgbarkeit je Rumpf.'
      icon: tabler:route
      category: all
    - title: Welche MOQ gelten?
      description: 'RIB-Boote: 2–5 Einheiten pro Modell (bestehende Form), ab 200 Einheiten für eigene Formen. SUP: 5–10 Einheiten pro SKU. Gemischte Containerbestellungen möglich. Musteraufträge ab 2–5 Einheiten zur Bewertung.'
      icon: tabler:sort-ascending
      category: all
    - title: Welche Anpassungen sind möglich?
      description: 'Rumpfform, Schlauchmaterial (PVC oder Hypalon/CSM), Schlauchdurchmesser, Konsolanordnung, Sitzbänke, Lenkung, Kraftstoffsystem, Decklayout, Markenfarben, Logografik, EVA-Pad-Design, Verkaufsverpackung und Branding der Bedienungsanleitung.'
      icon: tabler:adjustments
      category: all
    - title: Welche Konformitätsdokumente stellen Sie für meinen Markt bereit?
      description: 'CE-Konformitätserklärung nach 2013/53/EU, UKCA-Kennzeichnung, ISO-9001-Zertifikat (SGS), BSCI-Auditbericht, REACH-Nachweis, Materialprüfberichte, Drucktestprotokolle und modellspezifische Herstellerplaketten. Marktspezifische Dokumentation auf Anfrage.'
      icon: tabler:file-certificate
      category: all
    - title: Wie lang sind Muster- und Produktionszeiten?
      description: 'Vorserienmuster: 7–14 Werktage. Serienproduktion: 30–45 Tage FOB Qingdao. Eilproduktion gegen Aufpreis möglich. In der Hochsaison (März–Juni) können sich die Zeiten verlängern.'
      icon: tabler:clock
      category: all
    - title: Kann ich ein Werksaudit oder eine Live-Video-Tour vereinbaren?
      description: 'Ja. Vor-Ort-Audits in Qingdao sind mit 3–5 Tagen Vorlauf willkommen. Live-Video-Touren per WhatsApp oder Zoom sind sofort möglich. Prüfungen durch Drittparteien (SGS, BV, TÜV) unterstützen wir.'
      icon: tabler:video
      category: all
    - title: Welche Qualitätsprüfungen erfolgen vor dem Versand?
      description: 'Druckhaltetest mit dem 1,25-Fachen des Nenndrucks (24–48 h), Nahtschälprüfung, 100-Punkte-Endkontrollliste, Maßkontrolle, Sichtprüfung, Prüfung der Konformitätsdokumente und Verpackungsintegritätstest – alles nach ISO-9001-Verfahren.'
      icon: tabler:clipboard-check
      category: all

