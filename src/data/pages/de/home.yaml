features:
  id: features
  tagline: Warum bei Paddle Board Overstock kaufen
  title: Echte Fabrik,<br />Echte Ersparnis
  subtitle: Direktverkauf von Überbeständen und Ausverkaufspaketen SUP – zertifizierte Qualität ohne Einzelhandelspreisaufschlag.
  columns: 2
  items:
    - title: Bis zu 60% Rabatt auf den Einzelhandel
      description: Wir verkaufen Fabrik-Überbestände und Ausverkaufsbatches direkt – keine Zwischenhändler, kein Einzelhandelspreisaufschlag. Dieselben Boards, die anderswo zum Vollpreis verkauft werden, hier zu Ausverkaufspreisen.
      icon: tabler:rocket
    - title: Komplettpakete
      description: 'Jedes SUP wird als Komplettpaket geliefert: Board, Reisetasche, Handpumpe, verstellbares Paddel, abnehmbare Finne, Spiralleine und Reparaturset.'
      icon: tabler:clipboard-list
    - title: Zertifizierte Qualität
      description: 13 nach CE zertifizierte SUP-Modelle gemäß den geltenden EU-Richtlinien. Jedes Board wird vor dem Versand zu 100 % bei 1,25-fachem Nennwert PSI druckgeprüft. 99,3 % fehlerfreie Rate gemäß AQL 2.5.
      icon: tabler:certificate
    - title: Kein MOQ — Bestellen Sie ein Board
      description: Überbestands-Ausverkauf bedeutet, dass Einzelbestellungen willkommen sind. Legen Sie ein Board in den Warenkorb, bezahlen, fertig. Kein Mindestbestellwert, kein Angebotsverfahren.
      icon: tabler:adjustments
    - title: Schneller weltweiter Versand
      description: Lagerbestellungen werden innerhalb von 2-3 Werktagen aus Weihai versendet. Nachverfolgbare Lieferung in 50+ Ländern innerhalb der EU, Nordamerika, Asien-Pazifik und darüber hinaus.
      icon: tabler:truck-delivery
    - title: 2 Jahre SUP Garantie
      description: Jedes SUP-Board und Zubehör ist für 2 Jahre abgedeckt – drop-stitch Nähte, Aufblasventile und Zubehör eingeschlossen. Ansprüche werden in Tagen, nicht Wochen, bearbeitet.
      icon: tabler:lifebuoy
