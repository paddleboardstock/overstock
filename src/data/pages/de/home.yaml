    alt: Paddle Board Overstock 12.000 m² große Fabrik in Weihai mit aufblasbaren SUP-Produktionslinien
content_compliance:
  tagline: Qualität und Prüfung
  title: Geprüfte Qualität, dokumentiert
  subtitle: Jeder Qualitätsanspruch wird durch reale Zahlen aus unserer Produktionslinie gestützt – Drucktests, Chargenprotokolle und gemessene Fehlerraten.
  items:
    - title: 100 % druckgeprüft
      description: Jedes Board wird vor dem Versand auf den 1,25-fachen Druck in PSI aufgepumpt und festgehalten. Wenn eine Naht, ein Ventil oder ein Drop-Stitch-Faden ausfällt, verlässt das Board das Werk nie.
      icon: tabler:shield-check
    - title: 99,3 % fehlerfreie Rate
      description: Gemessen für jede Produktionscharge. Die Zahl stammt aus unseren eigenen Endkontrollaufzeichnungen – nicht aus dem Marketing.
      icon: tabler:gauge
    - title: Chargenrückverfolgbarkeit
      description: Jedes Board trägt einen Produktionschargencode, sodass Garantieansprüche und Qualitätsprüfungen auf genaue Materialien und Auflagen zurückgeführt werden können.
      icon: tabler:clipboard-check
    - title: 2 Jahre SUP Garantie
      description: Jedes SUP Board und Zubehörteile sind 2 Jahre lang abgedeckt — drop-stitch Nähte, Inflationsventile und Zubehör eingeschlossen. Ansprüche werden schnell bearbeitet.
      icon: tabler:lifebuoy
