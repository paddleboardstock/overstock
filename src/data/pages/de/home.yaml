faqs:
  title: SUP Bestellung & Produkt-FAQ
  subtitle: Häufige Fragen zu unseren Ausverkaufs-SUP-Boards, Bestellungen, Zahlungen, Versand und Garantie.
  columns: 2
  items:
    - title: Ist SUP schwer zu lernen?
      description: Überhaupt nicht. Die meisten Anfänger stehen beim ersten Mal schon auf und paddeln. Unsere vielseitigen SUP-Boards verfügen über extra breite, stabile Plattformen, die speziell für Erstpaddler entwickelt wurden. Beginnen Sie auf ruhigem Wasser und Sie werden in wenigen Minuten fahren.
      icon: tabler:swimming
      category: sup
    - title: Was ist die Gewichtsgrenze?
      description: Unsere vielseitige SUPs-Unterstützung trägt bis zu 220 lbs und die Touring- und Yoga-Plattformen tragen bis zu 250 lbs. Auf jeder Produktseite wird die genaue Tragfähigkeit für den Fahrer angegeben, sodass Sie das Board an Ihre Bedürfnisse anpassen können.
      icon: tabler:adjustments
      category: sup
    - title: Kann ich mit einem aufblasbaren SUP reisen?
      description: Absolut. Jedes Paddle Board Overstock Board passt in eine rucksackgroße Tragetasche. Mit nur 18-22 Pfund ist es leicht zum Strand, See oder durch Flughafen-Terminals zu transportieren. Überprüfen Sie vor der Reise die Gepäckbestimmungen Ihrer Fluggesellschaft.
      icon: tabler:truck-delivery
      category: sup
    - title: Was ist in der Schachtel enthalten?
      description: Jedes Paddle Board Overstock SUP enthält das Board, einen Reisrucksack, eine Handpumpe, ein verstellbares Paddel, eine abnehmbare Finne, eine Spiral-Leine und ein Reparaturset.
      icon: tabler:clipboard-list
      category: sup
    - title: Warum sind Ihre Preise niedriger als im Einzelhandel?
      description: Wir verkaufen Produktionsüberschüsse und Lagerbestände direkt aus unserer eigenen Produktionsstätte in Weihai, China — keine Zwischenhändler, kein Einzelhandelspreisaufschlag. Das bedeutet komplette SUP-Pakete mit bis zu 60 % Rabatt auf die üblichen Einzelhandelspreise, bei gleichbleibender CE-zertifizierter Qualität.
      icon: tabler:certificate
      category: orders
    - title: Wie gebe ich eine Bestellung auf und bezahle?
      description: Fügen Sie Ihr SUP Paket dem Warenkorb hinzu und zahlen Sie sicher mit Stripe oder PayPal. Wir akzeptieren alle gängigen Kredit- und Debitkarten. Jede Bestellung wird per E-Mail mit einer vollständigen Rechnung bestätigt.
      icon: tabler:file-text
      category: orders
    - title: Versenden Sie weltweit?
      description: Ja. Wir liefern in 50+ Länder in der EU, Nordamerika, Asien-Pazifik, dem Nahen Osten und Afrika. Auf Lager befindliche Bestellungen werden normalerweise innerhalb von 2-3 Werktagen versendet, und für jedes Paket wird eine Sendungsverfolgung bereitgestellt.
      icon: tabler:route
      category: orders
    - title: Welche Garantie beinhalten SUP-Platten?
      description: 'Jedes SUP-Board und Zubehör ist durch eine 2-Jahres-Garantie abgedeckt – einschließlich des Boards selbst, drop-stitch-Nähte und Aufblasventile. Ansprüche werden in Tagen, nicht Wochen bearbeitet: online einreichen und wir reparieren oder ersetzen.'
      icon: tabler:lifebuoy
      category: orders
