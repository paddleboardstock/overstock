breadcrumb: OEM/ODM-Hersteller
tldr:
  summary: Paddle Board Overstock ist ein OEM/ODM-Hersteller mit direkter Fabrikfertigung. 12.000 m² ISO 9001:2015-zertifiziertes Werk, 15.000 Einheiten Jahresproduktion, CE/BSCI/REACH/UKCA-Konformität, niedrige MOQs ab 2–10 Einheiten.
  points:
    - 12.000 m² ISO 9001:2015-zertifiziertes Werk in Qingdao
    - 15.000 Einheiten Jahreskapazität mit 200–300 qualifizierten Fachkräften
    - Konformität mit CE 2013/53/EU, UKCA, BSCI, REACH
    - 'Niedrige MOQs: 2–5 Einheiten (RIB), 5–10 Einheiten (SUP) für Standardmodelle'
    - Export in über 50 Länder, Verschiffung FOB Qingdao
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015-zertifiziert
      desc: Von SGS auditiertes Qualitätsmanagementsystem über alle Produktionslinien.
      variant: cert
    - icon: ⭐
      title: CE- & UKCA-konform
      desc: Vollständige Konformität mit EU 2013/53/EU und den britischen Kennzeichnungsvorschriften.
      variant: cert
    - icon: ⭐
