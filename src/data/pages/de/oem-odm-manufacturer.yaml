      variant: standard
process_section:
  eyebrow: Unser Prozess
  title: End-to-End OEM/ODM-Workflow
  subtitle: Vom Designbrief bis zur Containerverladung — sechs Schritte zu Ihrem privat gelabelten aufblasbaren Wasserfahrzeug.
  steps:
    - step: '01'
      title: Spezifikation & Designbrief
      desc: Teilen Sie Ihre Zielspezifikationen, CAD-Zeichnungen oder ein Referenzprodukt. Unser Ingenieursteam prüft Materialien, Maße und Konformitätsanforderungen (CE, BSCI), bevor wir anbieten.
    - step: '02'
      title: 3D-Formenprototyping
      desc: Wir konstruieren und fräsen individuelle Formen für SUP-Boards, Kajakrümpfe und RIB-Komponenten im CNC-Verfahren. Prototypmuster werden innerhalb von 15–20 Arbeitstagen zur Freigabe gefertigt.
    - step: '03'
      title: Materialauswahl & Musterproduktion
      desc: Wählen Sie zwischen Militär-PVC (0,9 mm–1,2 mm), Hypalon CSM oder Drop-Stitch-Kernstoffen. Wir fertigen Vorserienmuster mit Ihren Markenfarben, Ihrem Logo und Ihrer Verpackung zur Abnahme.
    - step: '04'
      title: CE-Werksaudit & Konformität
      desc: Jede OEM-Bestellung umfasst Konformitätsdokumentation — CE-Konformitätserklärung, ISO 9001-Rückverfolgbarkeitsaufzeichnungen, BSCI-Bericht zur sozialen Verantwortung und REACH-Materialerklärungen.
    - step: '05'
      title: Serienproduktion & Inline-QC
      desc: Produktionsläufe folgen unserer 100-Punkte-Qualitätscheckliste. Jede Einheit durchläuft 24-Stunden-Druckhaltungstests, Schältests der Nähte und Sichtprüfung vor der Verpackung.
    - step: '06'
      title: FOB-Qingdao-Logistik & Verschiffung
      desc: Fertigwaren werden palettiert, folienverschweißt und im Hafen Qingdao containerverladen. Wir übernehmen die gesamte Exportdokumentation und Zollabfertigung und bieten Sendungsverfolgung in Echtzeit.
capabilities_section:
  eyebrow: Fertigungskapazitäten
  title: Was wir bauen
  subtitle: Sechs Kernfertigungskapazitäten für globale B2B-Partner.
  items:
    - title: Drop-Stitch-SUP-Board-Fertigung
      desc: Drop-Stitch-Kernlaminierung über die gesamte Länge für steife, hochdruckfeste (15–20 PSI) Stand-Up-Paddle-Boards. Individuelle Länge, Breite, Dicke, Rocker-Profil und Grafikdesign.
    - title: PVC-Schlauchbootproduktion
      desc: Hochfrequenzgeschweißte PVC-Beiboote, Tender und Sportboote. Mehrere Kammervarianten, Bodenoptionen (Latten-, Luftdeck-, Roll-up-Boden) und Zubehörintegration.
    - title: Hypalon-RIB-Fertigung
      desc: Hypalon-CSM-Schläuche in gewerblicher Qualität, verklebt mit GFK- oder Aluminium-Tief-V-Rümpfen. Längen von 3,3 m bis 6,0 m für Patrouillen-, Rettungs-, Tour- und Taucheinsätze.
    - title: Private Label & individuelles Branding
      desc: 'Umfassender Private-Label-Service: individuelles Logo im Thermotransfer- oder Siebdruck, Markenverpackung (Verkaufskartons, Tragetaschen), Bedienungsanleitungen in Ihrer Sprache sowie Barcode-/UPC-Registrierung.'
    - title: Individuelle Formen- & Werkzeugkonstruktion
      desc: Eigenes 3D-CAD/CAM-Ingenieursteam. Wir konstruieren und fertigen individuelle Aluminium- und Verbundwerkstoffformen für einzigartige Rumpfformen, Deckkonfigurationen und Zubehörhalterungen.
    - title: OEM-Zubehör & Kitting
      desc: Rettungswesten (CE 12402), Doppelhubpumpen, Carbon-/Nylon-Paddel, Reparatursets, Tragetaschen und Leinen. Komplettes Kitting und Bündelverpackung für verkaufsfertige Präsentation.
experience_section:
  eyebrow: Praxiserfahrung
  title: Partnerschaften, die Marken gebaut haben
  subtitle: Echte Geschichten von Marken und Organisationen, die Paddle Board Overstock für ihre OEM/ODM-Fertigung gewählt haben.
  stories:
    - quote: Wir kamen mit einer Skizze auf einer Serviette und einer Liste von Anforderungen zu Paddle Board Overstock. Acht Monate später hatten wir ein produktionsreifes Produkt, das die CE-Zertifizierung im ersten Anlauf bestand.
      narrative: Ein europäisches Startup mit einem neuartigen SUP-Design wandte sich für die ODM-Fertigung an Paddle Board Overstock. Das Paddle Board Overstock-F&E-Team begleitete das Konzept durch CAD-Konstruktion, FEA-Strukturanalyse, hydrodynamische Simulation, Formerstellung, Prototypbau und Produktionswerkzeuge. Der Gründer des Startups reiste während des Prozesses dreimal nach Qingdao. Das Endprodukt bestand die CE-Zertifizierung ohne jegliche Modifikationen — ein Ergebnis, das der Gründer darauf zurückführt, dass Paddle Board Overstocks Ingenieursteam die europäischen regulatorischen Anforderungen von Anfang an verstand.
      context: Europäischer SUP-Markenlaunch, 2023–2024
      source: Markengründer
    - quote: Der Grad an NDA-Schutz und IP-Sicherheit bei Paddle Board Overstock gibt uns die Sicherheit, unsere geschützten Designs zu teilen. Sie behandeln unser geistiges Eigentum, als wäre es ihr eigenes.
      narrative: Ein US-Unternehmen für Marineausrüstung mit proprietärer Ventiltechnologie benötigte einen Fertigungspartner, der seine IP schützen und gleichzeitig in großem Maßstab produzieren kann. Nach Audits bei fünf chinesischen Herstellern wählte das Unternehmen Paddle Board Overstock — wegen der IP-Schutzprotokolle des Werks, der sicheren Handhabung von DesignDateien und der Bereitschaft, strenge NDAs zu unterzeichnen. Die Partnerschaft hat in vier Jahren drei Produktlinien hervorgebracht — ohne einen einzigen IP-Zwischenfall.
      context: US-Unternehmen für Marineausrüstung, OEM-Partnerschaft seit 2021
      source: VP Operations
