hero:
  tagline: Über uns
  title: Über uns Paddle Board Overstock
  subtitle: Seit 2012 bringen wir brandneue aufblasbare SUP Boards in die Hände von Paddlern und kleinen Einzelhändlern in 50+ Ländern – Überlager, ehrliche Preise und eine Garantie, die wir tatsächlich einhalten.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock Brandneue aufblasbare SUP Bretter
direct_answer: Paddle Board Overstock ist eine Wassersportausrüstungsmarke, die 2012 gegründet wurde und in Weihai, China, ansässig ist. Wir verkaufen brandneue aufblasbare SUP Boards aus überschüssigen Lagerbeständen – eine Mischung aus Überschussproduktion aus unserer eigenen Fertigung und sorgfältig ausgewähltem Bestand aus Partnerfabriken – direkt an Endpaddler und an kleine Einzelhändler in 50+ Ländern. Jedes Board wird zu 100 % unter Druck getestet, mit einer 2-Jahres-Garantie abgesichert SUP und per Express- oder Seefrachtschiff versandt.
tldr_points:
  - Gegründet 2012, mit Sitz in Weihai, China – einem der weltweit wichtigsten SUP Produktionszentren
  - 'Überlagermodell: brandneue Boards zu günstigeren Preisen, keine Mittelsmänner'
  - 'Der Bestand stammt aus gemischter Quelle: Überschussproduktion aus unserer Basis plus geprüfter Partnerfabrikbestand'
  - 50+ betreute Länder, 99,3 % Bestehensquote bei der Endprüfung, SUP 2-jährige Garantie
story_section:
  tagline: Unsere Geschichte
  title: Warum wir Überbestände verkaufen
  paragraphs:
    - gegründet Paddle Board Overstock 2012 in Weihai, China – einer Küstenstadt in der Provinz Shandong, die zu einem der weltweit wichtigsten Zentren für aufblasbare Maschinen herangewachsen ist SUP . Von dieser Basis aus haben wir mehr als ein Jahrzehnt damit verbracht, aufblasbare Paddleboards herzustellen und weltweit zu versenden.
    - Along the way we noticed something that shapes everything we do today: Jede Produktionssaison hinterlässt brandneue, einwandfreie Boards – Überschussserien, stornierte Bestellungen, die Farbvarianten der letzten Saison. Unterdessen wurden unabhängige Einzelhändler weltweit vom Großhandel ausgeschlossen, weil traditionelle Lieferanten Bestellungen in Containergröße verlangten.
    - Diese Lücke ist unser Geschäft. Durch den Verkauf von Überlagerbeständen – Überschussproduktion aus unserer eigenen Basis in Weihai sowie sorgfältig ausgewählte Bestände aus Partnerfabriken – können wir brandneue Bretter zu Preisen anbieten, die weit unter dem typischen Einzelhandel liegen, in Mengen, die für einen einzelnen Paddler oder eine Bestellung mit fünf Brettern passen. Nichts ist gebraucht, nichts ist ein zweites; es ist einfach Lagerbestand, der einen Kunden verdient, statt eines Lagers.
model_section:
  tagline: Unser Geschäftsmodell
  title: Wie das Overstock-Modell funktioniert
  items:
    - title: Brandneu, nie benutzt
      description: Jedes Brett, das wir verkaufen, ist nagelneu und unbenutzt. Überbestände bedeuten Überschuss und überschüssige Lagerbestände – keine Rückgaben, keine generalüberholten Exemplare, keine Ersatzbestände.
    - title: Mischquellen-Inventar
      description: Unser Bestand vereint Überschussproduktion aus unserer eigenen Weihai-Produktionsbasis mit dem Lagerbestand aus Partnerfabriken, die wir an denselben Qualitätsstandard halten. Die Quellen sind gemischt; die Standards sind es nicht.
    - title: Preise unter dem Einzelhandelspreis
      description: Überlagerbestände kosten uns weniger beim Erwerb, daher kostet es weniger beim Kauf. Kein überhöhter Listenpreis, keine gefälschten Rabatte – nur ehrliche Preise für echtes Inventar.
    - title: Großhandel für kleine Unternehmen
      description: Der Großhandel beginnt mit 5 Boards, nicht mit Containerladungen. Kleine Einzelhändler können alle vorrätigen Modelle in einer Bestellung kombinieren und wählen Express- oder Seefrachten.
    - title: Direkter Versand zu Ihnen
      description: Bestellungen werden direkt von unserer Logistikbasis in Weihai in 50 Ländern zu Ihnen nach Hause geliefert+ – Express für Proben und kleine Bestellungen, konsolidierte Seefracht für den Großhandel.
quality_section:
  tagline: Qualität & Garantie
  title: Die Qualität hinter jedem Board
  subtitle: Überlagerpreise bedeuten nie lockere Standards. Jede Platine – unabhängig von ihrer Herkunft – durchläuft denselben Prozess vor dem Versand.
  items:
    - title: 100 % druckgeprüft
      description: Jedes einzelne Board wird vor dem Versand aufgepumpt und einem Drucktest von 15 PSI unterzogen. Kein Board wird ungetestet verschickt, unabhängig davon, woher der Lagerbestand stammt.
    - title: Überlastungstest bis 1,25x
      description: Boards aus unseren Produktionsläufen werden stichprobenartig über den angegebenen Druck hinaus getestet – 24–48 Stunden bei 1,25-fachem Betriebsdruck gehalten, um Nähte, Ventile und drop-stitch-Konstruktion zu überprüfen.
    - title: 99,3% Endkontrolle-Bestehensquote
      description: Unser Endkontrollprozess gibt 99,3% der Boards als fehlerfrei frei – und der kleine Teil, der nicht besteht, gelangt niemals in unser Überbestandslager.
    - title: 2 Jahre SUP Garantie
      description: Jedes SUP-Board hat eine 2-Jahres SUP-Garantie auf Herstellungsfehler. Dieselbe Garantie gilt für jeden Kunden in allen unseren 50 + Märkten.
