  tagline: Das Team
  title: Die Personen hinter den Boards
  description: Unser Standort in Weihai beherbergt ein 14 +-köpfiges Forschungs- und Entwicklungsteam für Materialien, Strukturdesign und Produktionsprozesse. Rund um sie arbeitet das größere Team, das Qualitätskontrolle, Inventar, Logistik und den Support übernimmt, den Sie beim Kontakt mit uns erreichen – dieselben Personen, egal ob Sie ein Board oder zwanzig kaufen.
