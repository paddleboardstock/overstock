hero:
  tagline: Wassersportschulen & Trainingszentren
  title: 'Ausrüstungslösungen<br />für SUP- & Kayak-Schulen'
  subtitle: 'Zuverlässige Ausrüstung in gewerblicher Qualität für Paddelschulen, Surfunterricht, Kayak-Training und Wassersport-Bildungsprogramme jeder Größenordnung.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP-Boards für Schulen und Trainingszentren

direct_answer: 'Paddle Board Overstock versorgt SUP- und Kayak-Schulen weltweit mit Boards in gewerblicher Qualität, Sicherheitsausrüstung und Trainerpaketen. Unsere Ausrüstung ist für den täglichen Unterrichtsbetrieb gebaut – dickeres PVC, verstärkte Drop-Stitch-Kerne und stabile Rumpfformen, die Anfängern Sicherheit und Trainern Zuverlässigkeit geben. Pakete umfassen individuelles Branding, Ersatzteilprogramme und Schulungsressourcen.'

solution_offerings:
  - title: Schul-Starter-Paket
    subtitle: Für neue Programme und kleine Trainingszentren
    badge: Popular
    features:
      - title: Schüler-Boards
        description: 10–25 Allround-SUP-Boards oder Freizeit-Kayaks mit stabilen Plattformen für den Anfängerunterricht
      - title: Trainer-Boards
        description: Breitere, längere Boards mit extra Stabilität und rutschfesten EVA-Decks für das Coaching
      - title: Sicherheitsausrüstung
        description: Schwimmwesten, Leashes, Signalpfeifen und Wurfsäcke in passenden Farben
      - title: Lagerung & Transport
        description: Stapelbare Board-Ständer, gepolsterte Kayak-Halterungen und Transportwagen
      - title: Curriculum-Support
        description: Unterrichtsvorlagen, Sicherheitschecklisten und Leitfäden zum Könnensaufbau
    cta_text: Schul-Paket anfragen
    cta_href: '/contact'

  - title: Schul-Premium-Paket
    subtitle: Für etablierte Schulen und Betreiber mit mehreren Programmen
    badge: Best Value
    features:
      - title: Komplette Flotte
        description: 25–50 Boards oder Kayaks mit gemischter Flotte (Allround, Touring, Jugendgrößen)
      - title: Trainer-Flotte
        description: 3–5 spezialisierte Trainer-Boards mit integrierten Halterungen für Soundsysteme
      - title: Sicherheitsstation
        description: Zentrale Station für Sicherheitsausrüstung mit Rettungswesten, Funkgeräten, Erste-Hilfe-Set und Beschilderung
      - title: Branding-Paket
        description: Kompletter Logodruck auf Boards, Paddeln, Rettungswesten und Bekleidung
      - title: Wartungsprogramm
        description: Quartalsweise Wartungskits, Ersatzteilsortimente und Reparaturschulungen
    cta_text: Premium-Paket zusammenstellen
    cta_href: '/contact'

  - title: Schul-Franchise-Paket
    subtitle: Für Standortketten und Franchise-Betreiber
    badge: Enterprise
    features:
      - title: Flotten-Standardisierung
        description: Identische Ausrüstung an allen Standorten für ein konsistentes Schülererlebnis
      - title: Zentrale Bestellung
        description: Konsolidierte Bestellungen, Mengenpreise und zentrales Ersatzteilmanagement
      - title: Trainer-Schulung
        description: Zertifizierung in Ausrüstungshandhabung und -wartung für alle Trainer
      - title: Co-Branding
        description: Gemeinsames Branding mit Optionen für Franchise-Marke plus Paddle Board Overstock Co-Branding
      - title: Expansions-Support
        description: Skalierungsberatung, Ausrüstungsplanung und Aufbau neuer Standorte
    cta_text: Franchise-Plan besprechen
    cta_href: '/contact'

benefits:
  - title: Gebaut für den täglichen Unterricht
    description: Dickeres PVC und verstärkte Rails halten dem täglichen Schülerbetrieb, Stürzen auf Sand und steinigen Anlandungen stand.
    icon: tabler:shield
  - title: Stabile Lernplattformen
    description: Breitere Rümpfe und flacherer Rocker geben Anfängern Sicherheit. Trainer konzentrieren sich auf das Unterrichten, nicht auf die Ausrüstung.
    icon: tabler:scale
  - title: Einfache Lagerung & Transport
    description: Das aufblasbare Design passt in kleine Räume. Luftleere Boards passen in Standard-Kofferräume für mobilen Unterricht.
    icon: tabler:box-seam
  - title: Individuelles Branding
    description: Schullogos und -farben auf jedem Board. Ihre Marke, Ihre Identität – keine generische Verleihware.
    icon: tabler:brush

content_segments:
  tagline: Schulprofile
  title: 'Wassersport-Bildungslösungen<br />nach Programmtyp'
  subtitle: 'Paddelschulen, Surf-Akademien, Universitätsprogramme und Franchise-Betreiber stehen vor jeweils unterschiedlichen operativen Herausforderungen – von der Curriculum-Integration bis zur Flotten-Standardisierung über mehrere Standorte. Wir konfigurieren Ausrüstungspakete passend zum jeweiligen Bildungsmodell.'
  items:
    - title: Unabhängige SUP- & Kayak-Schulen
      subtitle: Von Eigentümern betriebene Trainingszentren
      description: 'Kleine bis mittlere Schulen, geführt von Eigentümer-Trainern, die SUP-Unterricht, Kayak-Training und Zertifizierungskurse anbieten. Die Ausrüstung muss robust genug für den täglichen Unterrichtsbetrieb, bezahlbar für ein Kleinunternehmerbudget und vielseitig genug sein, um in einer einzigen Flotte Anfänger bis Fortgeschrittene zu unterrichten.'
      features:
        - 'Stabile Allround-SUP-Boards und Freizeit-Kayaks für den Anfängerunterricht'
        - 'Trainer-Boards mit extra Stabilität für das Coaching vom Wasser aus'
        - 'Unterrichtsplan-Vorlagen und Leitfäden zum Könnensaufbau inklusive'
        - 'Jährliches Ausrüstungs-Erneuerungsprogramm mit Inzahlungsnahme-Rabatten'
    - title: Universitäts- & Hochschulsport-Programme
      subtitle: Studierenden-Sportflotten in großem Maßstab
      description: 'Sportabteilungen von Universitäten, die Paddelclubs, Verleihprogramme und Unterrichtskurse als Teil des Campus-Sports betreiben. Die Ausrüstung hat im Semester Spitzenbelastungen, erfordert einfache Ausgabe- und Rückgabesysteme und muss unterschiedliche Könnensstufen aushalten – von Erstsemestlern bis zu fortgeschrittenen Paddlern.'
      features:
        - 'Hochbelastbare PVC-Konstruktion, ausgelegt für institutionelle Nutzungszyklen'
        - 'Farbcodierte Flotten nach Könnensstufe für eine einfache Verwaltung'
        - 'Kompatibilität mit RFID- oder aufkleberbasierten Inventarverfolgungssystemen'
        - 'Mengenpreise mit semesterbezogener Bestellung und Zahlungsbedingungen'
    - title: Surfschulen & Surf-Akademien
      subtitle: Küsten-Surfunterrichtsprogramme
      description: 'Surfschulen, die SUP-Surfen, Prone-Paddling und Surf-Kayak-Techniken in der Meeresumgebung unterrichten. Die Ausrüstung muss Surfzonen-Bedingungen aushalten – Schlagfestigkeit, Toleranz gegenüber Sand und Salzwasser sowie schnelles Abspülen und Zurückführen zwischen Unterrichtseinheiten im Stundentakt.'
      features:
        - 'Surf-spezifische Shapes mit verstärkten Rails und schlagfester Konstruktion'
        - 'Soft-Fin-Optionen und Spiralleashes für die Sicherheit der Schüler'
        - 'Schnell abspülbare Bezüge, die zwischen den Unterrichtseinheiten trocknen'
        - 'Flotten-Erneuerungsprogramm mit Inspektion und Auffrischung am Saisonende'
    - title: Franchise- & Multi-Standort-Ketten
      subtitle: Standardisierte Ausrüstung über alle Standorte
      description: 'Betreiber mehrerer Standorte mit standardisierten Trainingsprogrammen in mehreren Städten oder Regionen. Flotten-Konsistenz über alle Standorte ist entscheidend – jeder Schüler sollte dasselbe Ausrüstungserlebnis haben, unabhängig davon, welchen Franchise-Standort er besucht. Zentrale Bestellung, einheitliches Branding und Skalierungs-Support sind unverzichtbar.'
      features:
        - 'Identische Flottenspezifikationen an allen Franchise-Standorten'
        - 'Zentrale, konsolidierte Bestellung mit Mengenpreisen'
        - 'Co-Branding-Optionen: Franchise-Marke plus Paddle Board Overstock Co-Brand'
        - 'Standort-Eröffnungsset: Ausrüstung, Beschilderung und Anfangsinventar'

