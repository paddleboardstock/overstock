hero:
  tagline: Über uns
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock-Fabrik und Werkstatt
  title: Über <span class="text-accent dark:text-white">Paddle Board Overstock</span>
  subtitle: Brandneue aufblasbare SUP-Boards zu Überbeständen und Ausverkaufspreisen – unterstützt durch unsere eigene Weihai-Fertigung seit 2012, Großhandel mit gemischten Modellen für kleine Einzelhändler und flexiblen weltweiten Versand.
stats:
  title: Anhand der Zahlen
  columns: 4
  stats:
    - title: Jährliche Produktionskapazität
      amount: 15.000 Einheiten
    - title: Länder versendet
      amount: 50+
    - title: Druckgeprüfte Platten
      amount: 100%
    - title: F&E-Ingenieure
      amount: 14+
features3_what_we_build:
  title: Was wir bauen
  subtitle: Eine fokussierte Produktlinie, die wir in- und auswendig kennen – keine halbfertigen Experimente, kein Badge-Engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: Aufblasbare SUP-Boards
      description: Allround- und Touring-SUPs von 10 Fuß bis 12 Fuß. Stabil, steif und komplett mit Pumpe, Paddel und Leine.
      icon: tabler:swimming
    - title: Decks der Art-Serie
      description: Charakteristisches EVA-Deck-Artwork – Cheetah Surge, Tropical Breeze, Medusa Glow und mehr.
      icon: tabler:hexagons
    - title: Komplettpakete
      description: 'Jedes Board wird als komplettes Set geliefert: Board, Rucksack, Pumpe, Paddel, Flosse, Leine und Reparaturset.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Zubehör
      description: Pumpen, Paddel, Leinen, Reparatursets und Packsäcke. Alles passend zu unseren Boards.
      icon: tabler:tool
    - title: Pflege & Reparatur
      description: Interner Reparatursupport, Ersatzteile und Wartungsanleitungen, damit Ihr Board jahrelang auf dem Wasser bleibt.
      icon: tabler:settings
    - title: Club- und Mietflotten
      description: Großausstattung für Vereine, Schulen und Mietflotten mit direkter Werksunterstützung.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Diskussion über Platinendesign und Technik
steps2_values:
  title: Unsere Werte
  subtitle: Drei Prinzipien, die jedes Produkt seit dem ersten Tag prägen.
  items:
    - title: Bauen Sie, als ob es Ihre Familie tragen würde
      description: Jedes Brett, jede Naht und jedes Ventil wird so behandelt, als ob unsere eigenen Familien es benutzen würden.
      icon: tabler:heart
    - title: Ingenieur, bevor wir verkaufen
      description: Wenn eine Spezifikation falsch ist, ändern wir die Spezifikation – niemals den Kunden.
      icon: tabler:settings
    - title: Support, der über die Garantie hinausgeht
      description: Boards, die wir vor Jahren gebaut haben, rufen immer noch wegen Ersatzteilen bei uns an, und wir holen immer noch ab.
      icon: tabler:headset
steps2_milestones:
  title: Meilensteine
  subtitle: Eine kurze Version der Paddle Board Overstock-Geschichte.
  isReversed: true
  items:
    - title: Gegründet in Weihai
      description: Eine Küstenwerkstatt, die sich der Herstellung von aufblasbaren SUP-Boards mit Drop-Stitch-Technik widmet.
      icon: tabler:building-factory
    - title: 12.000 m² großer Produktionscampus
      description: Erweiterung zu einer speziellen Anlage mit HF-Schweiß- und Drop-Stitch-Produktionskapazität.
      icon: tabler:circle-check
    - title: Internationales Exportprogramm
      description: Jetzt Versand in über 50 Länder mit Express- und Seefrachtoptionen.
      icon: tabler:world
    - title: Schwerpunkt auf Überbestände und Großhandel
      description: Im September 2026 wurde der Markenbetrieb von der Qingdao Vatrad Group zur Weihai Dongjilian Co., Ltd. verlagert; Das Produktionszentrum Weihai setzt Forschung und Entwicklung, Produktion und Direktlieferung ab Werk fort.
      icon: tabler:building-skyscraper
features2_locations:
  title: Unsere Standorte
  tagline: Finden Sie uns
  columns: 3
  items:
    - title: Hauptsitz & Werkstatt
      description: Küstenindustriepark, Gebäude 4 – geöffnet von Montag bis Freitag für Besichtigungen nach Vereinbarung.
    - title: EU-Servicecenter
      description: Mittelmeerhafen – Nachrüstung, Reparatur und Garantieunterstützung für europäische Kunden.
    - title: APAC-Partnernetzwerk
      description: Autorisierte Servicepartner in Australien, Japan, Singapur und Hongkong.
brand_hub_tagline: Marke
brand_hub_title: Entdecken Sie unsere Marke
brand_hub_subtitle: Tauchen Sie tiefer in unser Fachwissen im Bereich Schiffstechnik, unsere globale Präsenz und die Prinzipien ein, die uns antreiben.
brand_hub_cards:
  - title: Marine-Expertise
    desc: Jahrzehntelange Materialwissenschaft, Präzisionsfertigung und Praxistests – von Drop-Stitch-Kernen über Schweißnähte bis hin zu Decks der Art-Serie.
    link: /brand-marine-expertise
    link_label: Erfahren Sie mehr →
  - title: Warum Paddle-Board-Überbestände
    desc: Direktpreise ab Werk, 100 % druckgeprüfte Boards und eine 2-Jahres-Garantie – entwickelt für Paddler, Familien und Wassersportliebhaber.
    link: /brand-why-paddleboardoverstock
    link_label: Erfahren Sie mehr →
