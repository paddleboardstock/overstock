content_scope:
  tagline: Compliance-Bereich
  title: Welche Produkte benötigen RCD-Konformität?
  subtitle: Die Sportbootrichtlinie 2013/53/EU gilt für Sportboote mit einer Rumpflänge zwischen 2,5 m und 24 m. Das Verständnis des Umfangs ist der erste Schritt zur Compliance.
  items:
    - title: RIB-Boote (2,5–24 m)
      description: Festrumpfschlauchboote mit einer Rumpflänge von 2,5 m bis 24 m fallen unter RCD. Abhängig von den beabsichtigten Seebedingungen und der maximalen Windstärke gelten die Designkategorien A bis D.
      icon: tabler:sailboat
    - title: Schlauchboote (unter 2,5 m)
      description: Kleine Schlauchboote und Schlauchboote unter 2,5 m sind möglicherweise teilweise von der RCD ausgenommen, erfordern aber dennoch eine CE-Kennzeichnung gemäß anderen geltenden Richtlinien und den Baunormen EN ISO 6185.
      icon: tabler:sailboat
    - title: SUP-Boards und Zubehör
      description: Stand-Up-Paddle-Boards fallen nicht in den Geltungsbereich der RCD. Zugehörige persönliche Schwimmhilfen (PFDs) erfordern jedoch eine CE-Kennzeichnung gemäß der PSA-Verordnung (EU) 2016/425 mit ggf. USCG-Typ-III/V-Zulassung.
      icon: tabler:swimming
    - title: Teilweise fertiggestellte Boote
      description: Boote, die ohne Motor oder spezielle Installationen geliefert werden, erfordern eine Herstellererklärung für teilweise fertiggestellte Boote, wobei die vollständige RCD-Konformität vom endgültigen Hersteller oder Importeur ausgefüllt werden muss.
      icon: tabler:tool
content_trust_layers:
  tagline: Dreischichtiges Vertrauenssystem
  title: Compliance-Informationen<br /> – auf der richtigen Ebene geteilt
  subtitle: Nicht alle Compliance-Daten gehören auf eine öffentliche Website. Wir verfolgen einen dreistufigen Ansatz, der geistiges Eigentum schützt und gleichzeitig das Vertrauen der Käufer stärkt.
  items:
    - title: Schicht 1 – Öffentliche Website
      description: Referenzierte Standards, Erläuterung der Konformitätswege, aufgeführte Dokumenttypen, Zertifizierungsumfang pro Modellfamilie. Keine tatsächlichen Zertifikate, Testdaten oder proprietären technischen Details.
      icon: tabler:world
    - title: Ebene 2 – Weitergabe nach der Anfrage
      description: 'Nach einer qualifizierten Anfrage: geschwärztes DoC-Muster, Foto des Herstellerschilds, Liste der geltenden Standards, Compliance-Checkliste und Zusammenfassungen der Materialzertifizierung – geteilt unter Fair-Use-Bedingungen.'
      icon: tabler:mail
    - title: Schicht 3 – NDA/Bestellphase
      description: Vollständige technische Unterlagen, Risikobewertungen, Stabilitätsberechnungen, Testberichte, Materialchargenaufzeichnungen und Dokumentation zur Produktionsrückverfolgbarkeit – Weitergabe nur im Rahmen einer NDA an bestätigte Käufer.
      icon: tabler:lock
content_standards:
  tagline: Anwendbare Standards
  title: ISO- und EN-Standards<br />Wir bauen nach
  subtitle: Unsere Produkte werden gemäß den harmonisierten Normen der RCD entwickelt und getestet. Auf Standardnummern und -namen wird verwiesen; Vollständige Standardtexte unterliegen dem ISO-Copyright.
  items:
    - title: EN ISO 6185-3
      description: 'Schlauchboote – Teil 3: Boote mit einer maximalen Motorleistung von 15 kW oder mehr. Anforderungen an Konstruktion, Stabilität, Auftrieb und Mann-über-Bord-Bergung für RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Schlauchboote – Teil 4: Boote mit einer maximalen Motorleistung von 15 kW und größer oder gleich 4,5 kW. Zusätzliche Anforderungen an Struktur und Stabilität.'
      icon: tabler:file-text
    - title: ISO 12215-Serie
      description: Kleine Boote – Rumpfkonstruktion und Kanteln. Strukturelle Gestaltung von Rumpf, Deck und Schotten für RIB-Rümpfe aus Glasfaser und Aluminium.
      icon: tabler:ruler-2
    - title: EN ISO 10240:2004
      description: Kleines Boot – Bedienungsanleitung. Erforderlicher Inhalt und Format für die Bedienungsanleitung, die jedem in der EU gelieferten RIB-Boot beiliegt.
      icon: tabler:book
    - title: EN ISO 14945
      description: Kleines Handwerk – Bauschild. Informationen müssen auf dem Herstellerschild vermerkt werden, das dauerhaft an jedem Fahrzeug angebracht ist.
      icon: tabler:badge
    - title: ISO 8666
      description: Kleines Wasserfahrzeug – Hauptdaten. Standardisierte Messungen und Parameter für konsistente Spezifikationen in der gesamten Produktdokumentation.
      icon: tabler:dimensions
content_process:
  tagline: Compliance-Prozess
  title: 6-stufiger CE-Compliance<br />Workflow
  subtitle: Vom Projektumfang bis zur Rückverfolgbarkeit auf Serienebene – jedes RIB-Modell folgt einem definierten Compliance-Pfad.
  steps:
    - number: '01'
      title: Projektumfang und -klassifizierung
      description: Definieren Sie das RIB-Modell, die Designkategorie (A/B/C/D), die maximale Personenzahl, die Nutzlast, die Motorleistung und den Zielmarkt. Stellen Sie fest, ob RCD gilt und welches Konformitätsbewertungsmodul erforderlich ist.
      timeline: 2–3 Tage
    - number: '02'
      title: Identifizierung der anwendbaren Anforderungen
      description: Identifizieren Sie alle anwendbaren wesentlichen Sicherheitsanforderungen aus RCD Anhang I, relevante harmonisierte Normen (EN ISO 6185, 12215, 10240, 14945) und alle zusätzlichen nationalen Anforderungen für den Zielmarkt.
      timeline: 3–5 Tage
    - number: '03'
      title: Design und technische Dokumentation
      description: 'Erstellen Sie die technische Hauptdatei: allgemeine Anordnungszeichnungen, Stabilitäts- und Auftriebsberechnungen, Risikobewertung, Materialspezifikationen und Systemsicherheitsanalyse (Kraftstoff, Elektrik, Lenkung).'
      timeline: 10–15 Tage
    - number: '04'
      title: Produktverifizierung und -tests
      description: Führen Sie eine physische Überprüfung durch – Drucktests bei 1,25-fachem Nenndruck für 24–48 Stunden, Stabilitäts- und Auftriebstests, Belastungstests und Systeminbetriebnahme. Notieren Sie alle Testergebnisse pro Rumpf.
      timeline: 5–7 Tage
    - number: '05'
      title: Kennzeichnung und Lieferdokumentation
      description: Bringen Sie die CE-Kennzeichnung, das Herstellerschild (EN ISO 14945) und die HIN/CIN (Rumpfidentifikationsnummer) an. Bereiten Sie die EU-Konformitätserklärung, das Benutzerhandbuch (EN ISO 10240) und die Konformitätscheckliste vor.
      timeline: 2–3 Tage
    - number: '06'
      title: Rückverfolgbarkeit auf Serienebene
      description: Jeder Rumpf erhält ein einzigartiges Rumpfprotokoll, das ihn mit der technischen Hauptdatei, der Produktionscharge, den Materialzertifikaten, den Testergebnissen und der endgültigen Konfiguration verknüpft. Aufzeichnungen werden pro RCD für mehr als 10 Jahre aufbewahrt.
      timeline: Laufend
content_document_cards:
  tagline: Dokumenttypen
  title: Compliance-Dokument<br />Karten
  subtitle: Dies sind die Dokumenttypen, die wir für jedes CE-zertifizierte RIB-Modell erstellen und pflegen. Muster sind auf qualifizierte Anfrage erhältlich.
  items:
    - title: CE-/RCD-Konformitätszertifikat
      description: Modellspezifisches Zertifikat, das bestätigt, dass das Fahrzeug alle geltenden grundlegenden Sicherheitsanforderungen der RCD 2013/53/EU erfüllt, ausgestellt vom Hersteller unter Einbeziehung einer benannten Stelle, sofern erforderlich.
      icon: tabler:certificate
    - title: EU-Konformitätserklärung (DoC)
      description: Unterzeichnete Erklärung des Herstellers oder Bevollmächtigten, in der die geltenden Richtlinien, Normen, Konformitätsmodule und Angaben zur benannten Stelle aufgeführt sind. Erforderlich für jedes auf den EU-Markt gebrachte Modell.
      icon: tabler:file-check
    - title: Herstellerschild (EN ISO 14945)
      description: Dauerhaft angebrachtes Schild mit Angabe der maximalen Personenanzahl, der maximalen Motorleistung, der Designkategorie und der Herstelleridentifikation. Muss während der gesamten Lebensdauer des Fahrzeugs lesbar bleiben.
      icon: tabler:badge
    - title: Bedienungsanleitung (EN ISO 10240)
      description: Umfassendes Handbuch mit Informationen zum sicheren Betrieb, Notfallverfahren, Wartungsplänen und Sicherheitswarnungen. Obligatorisch für jedes in der EU gelieferte RIB.
      icon: tabler:book
    - title: ISO-Test- und Inspektionsberichte
      description: Drucktestaufzeichnungen (1,25x / 24–48 Stunden), Stabilitäts- und Auftriebstestergebnisse, Materialtestzertifikate und Dimensionsüberprüfungsberichte – alles verknüpft mit bestimmten Rumpfnummern.
      icon: tabler:test-pipe
    - title: Aufzeichnungen zur Materialrückverfolgbarkeit
      description: Rückverfolgbarkeit auf Chargenebene für Schlauchgewebe, Klebstoffe, Glasfaser und Hardware. Verknüpft jede Produktionseinheit mit eingehenden Materialzertifikaten und IQC-Inspektionsergebnissen.
      icon: tabler:link
    - title: Qualitätsprüfungs- und QC-Aufzeichnungen
      description: 100-Punkte-Qualitätscheckliste pro Einheit, prozessbegleitende QC-Aufzeichnungen, Nichtkonformitätsberichte und Korrekturmaßnahmen. Teil der Rückverfolgbarkeitskette der Produktion.
      icon: tabler:clipboard-check
    - title: Projektdokumentenpaket
      description: Dokumentationspaket pro Rumpf, einschließlich endgültiger Konfigurationsaufzeichnung, Details zur Motor- und Ausrüstungsinstallation, Checkliste für die Inbetriebnahme und Lieferdokumentation.
      icon: tabler:package
content_design_categories:
  tagline: RCD-Designkategorien
  title: Designkategorie A–D<br /> – Was sie bedeuten
  subtitle: Das RCD weist Designkategorien zu, die auf der maximalen Windstärke und der signifikanten Wellenhöhe basieren, denen das Fahrzeug standhalten soll.
  items:
    - title: Kategorie A – Ozean
      description: Konzipiert für ausgedehnte Reisen, bei denen die Windstärke Beaufort 8 (>40 Knoten) überschreiten und die Wellenhöhe 4 m überschreiten kann. Erfordert strengste Struktur- und Stabilitätsprüfungen.
      icon: tabler:ripple
    - title: Kategorie B – Offshore
      description: Konzipiert für Offshore-Reisen mit Windstärken bis zu Beaufort 8 (≤40 Knoten) und erheblichen Wellenhöhen bis zu 4 m. Geeignet für Küstengewässer und halbexponierte Gewässer.
      icon: tabler:anchor
    - title: Kategorie C – Küstennah
      description: Konzipiert für Küstenfahrten mit Windstärken bis zu Beaufort 6 (≤27 Knoten) und erheblichen Wellenhöhen bis zu 2 m. Die meisten Freizeit-RIBs fallen in diese Kategorie.
      icon: tabler:sun
    - title: Kategorie D – Geschützt
      description: Entwickelt für geschützte Gewässer mit Windstärken bis zu Beaufort 4 (≤16 Knoten) und einer signifikanten Wellenhöhe von bis zu 0,3 m. Seen, Flüsse und geschützte Häfen.
      icon: tabler:pool
content_hin:
  tagline: Handwerksidentifikation
  title: HIN / CIN & Herstellerschild
  subtitle: Für jedes RIB-Boot sind eine Hull Identification Number (HIN) oder Craft Identification Number (CIN) und ein Herstellerschild gemäß den Anforderungen von EN ISO 14945 und RCD erforderlich.
  items:
    - title: Rumpfidentifikationsnummer (HIN)
      description: Ein eindeutiger 14-stelliger Code, der dauerhaft auf der Steuerbordseite des Spiegels angebracht ist und den Herstellercode (MIC), das Modelljahr, das Produktionsjahr und die Seriennummer kodiert. Erforderlich für den EU-Markteintritt.
      icon: tabler:hash
    - title: Handwerksidentifikationsnummer (CIN)
      description: Gemäß EN ISO 10087 eine versteckte sekundäre Identifikationsnummer, die zur Diebstahlsicherung und Rückverfolgbarkeit an einer verdeckten Stelle angebracht wird.
      icon: tabler:eye-off
    - title: Inhalt der Bautafel
      description: Maximale Personenzahl, maximale Motorleistung (kW), maximale Belastung (kg), Designkategorie, Herstellername und CE-Kennzeichnung – alles dauerhaft auf einem korrosionsbeständigen Schild angezeigt.
      icon: tabler:badge
content_tech_file:
  tagline: Technische Dateistruktur
  title: Master Technical File<br />& Rumpfprotokoll
  subtitle: 'Unser Dokumentationssystem folgt einer zweistufigen Struktur: der Master Technical File für jede Modellfamilie und individuellen Rumpfaufzeichnungen für jedes produzierte Boot.'
  items:
    - title: Technische Masterdatei
      description: 'Enthält die vollständige Konformitätsdokumentation für eine Modellfamilie: allgemeine Anordnung, Risikobewertung, Stabilitäts-/Auftriebsberechnungen, Materialspezifikationen, geltende Normen und Konformitätsbewertungsaufzeichnungen. Für mehr als 10 Jahre aufbewahrt.'
      icon: tabler:folder
    - title: Rumpfaufzeichnung (Rückverfolgbarkeit pro Boot)
      description: 'Jeder Rumpf verfügt über einen eindeutigen Datensatz, der ihn mit der technischen Hauptdatei verknüpft: HIN, Produktionsdatum, Rohrcharge, Materialzertifikate, Drucktestergebnis, endgültige Konfiguration, Motorinstallation und Lieferziel.'
      icon: tabler:file-description
    - title: Kunden-Compliance-Paket
      description: Paket für die Lieferung pro Rumpf, einschließlich DoC, Foto des Herstellerschilds, Benutzerhandbuch, Testzusammenfassung und endgültigem Konfigurationsblatt – wird mit jedem in die EU versendeten RIB geliefert.
      icon: tabler:package
content_material_cert:
  tagline: Materialzertifizierung
  title: Materialrückverfolgbarkeit &<br />Zertifizierungsnachweise
  subtitle: >-
    Qualitativ hochwertige RIB-Boote beginnen mit kontrollierten Materialien und dokumentierten
    Prozessen. Nachfolgend, wie wir die Materialzertifizierung für jede kritische Bauteilgruppe
    organisieren.
  items:
    - title: Materialrückverfolgbarkeit der Schläuche
      description: >-
        PVC- und CSM/Hypalon-Schlauchmaterialien werden gemäß Einsatzzweck, Klimabedingungen und
        Zielmarkt ausgewählt. Technische Datenblätter der Lieferanten (TDS), Materialchargendaten,
        Geweberückverfolgbarkeit, UV- und Bewitterungsprüfberichte sowie REACH/SVHC-Erklärungen sind
        im vereinbarten Projektdokumentationsumfang verfügbar.
      icon: tabler:circle
    - title: Rückverfolgbarkeit von Marine-Aluminium
      description: >-
        Bei RIB-Projekten mit Aluminiumrumpf werden Legierungsgrad, Dicke und Materialchargen gemäß
        freigegebener Spezifikation kontrolliert. Materialprüfzertifikate (MTC/MTR),
        EN-10204-3.1-Dokumentation, Berichte zur chemischen Zusammensetzung und zu mechanischen
        Eigenschaften sowie Wärme-/Chargenrückverfolgbarkeit werden vereinbarungsgemäß geliefert.
      icon: tabler:rectangle
    - title: GRP-Rumpf — Material- und Prozesskontrolle
      description: >-
        Bei RIBs mit GFK-Rumpf werden Gelcoat, Harz, Glasfaserverstärkung und Kernmaterialien über
        kontrollierte Spezifikationen geführt. Material-TDS/SDS, Chargenaufzeichnungen,
        Laminatspezifikationen sowie Aushärtungs- und Werkstattkontrollaufzeichnungen sind auf
        Projektvereinbarung erhältlich.
      icon: tabler:layers-subtract
    - title: Dokumentationsunterstützung für Komponenten
      description: >-
        Für ausgewählte Komponenten — einschließlich EVA-Deckmaterialien, Sitzbänke,
        Edelstahlbeschläge, Kraftstoffsysteme, elektrische Ausrüstung und Marinezubehör — wird die
        zutreffende Lieferantendokumentation basierend auf der endgültigen Konfiguration und den
        Anforderungen des Zielmarkts koordiniert.
      icon: tabler:package
    - title: Hinweis zum Konformitätsumfang
      description: >-
        Zertifikate, Prüfberichte und Konformitätsdokumente gelten nur für das jeweilige
        Produktmodell, Material, Bauteil, die Produktionscharge oder den Projektrumfang, der im
        entsprechenden Dokument angegeben ist. Kontaktieren Sie uns mit Zielmarkt, Einsatzzweck und
        technischen Anforderungen, damit das zutreffende Dokumentationspaket vor der Bestellung
        bestätigt werden kann.
      icon: tabler:info-circle

faq:
  title: CE-Konformität – Häufig gestellte Fragen
  questions:
    - q: Sind alle Aquafarer RIB-Boote für den EU-Markt CE-zertifiziert?
      a: Die RIB-Boote in unserem Katalog sind für die Einhaltung der RCD 2013/53/EU gemäß den geltenden EU-Richtlinien konzipiert und dokumentiert. Die CE-Kennzeichnung gilt für jedes Modell und jede Konfiguration. Kontaktieren Sie uns für ein modellspezifisches Compliance-Scope-Dokument.
    - q: Was ist der Unterschied zwischen RCD-Konformität und CE-Kennzeichnung?
      a: RCD (Recreational Craft Directive 2013/53/EU) ist die EU-Gesetzgebung, die grundlegende Sicherheitsanforderungen festlegt. Bei der CE-Kennzeichnung handelt es sich um das visuelle Symbol, das auf einem Produkt angebracht wird, dessen Einhaltung dieser Anforderungen bewertet und bestätigt wurde. Ein Produkt muss der RCD entsprechen, bevor es das CE-Zeichen tragen darf.
    - q: Stellen Sie jedem Boot eine Konformitätserklärung zur Verfügung?
      a: Ja. Zu jedem auf den EU-Markt gelieferten RIB-Boot gehört eine modellspezifische EU-Konformitätserklärung, in der die geltenden Richtlinien, harmonisierten Normen, das Konformitätsbewertungsmodul und Angaben zur benannten Stelle aufgeführt sind.
    - q: Welches Konformitätsbewertungsmodul verwendet Aquafarer?
      a: Das Modul ist abhängig von der Designkategorie und dem Bootstyp. Die meisten RIB-Modelle der Designkategorie C verwenden Modul A (interne Produktionskontrolle). Für Boote der Designkategorie A/B oder spezifische Konfigurationen können Modul B+C oder B+D unter Einbeziehung einer benannten Stelle gelten. Wir beraten Sie zum passenden Modul pro Projekt.
    - q: Können Sie die Compliance-Dokumentation weitergeben, bevor wir eine Bestellung aufgeben?
      a: Nach einer qualifizierten Anfrage stellen wir Ihnen ein Compliance-Scope-Dokument zur Verfügung, in dem die geltenden Standards, der Konformitätsweg und die verfügbaren Dokumenttypen für das von Ihnen bewertete Modell aufgeführt sind. Vollständige technische Dateien werden nach Auftragsbestätigung im Rahmen einer NDA weitergegeben.
    - q: Was ist eine Hull Identification Number (HIN) und ist sie enthalten?
      a: Die HIN ist eine 14-stellige eindeutige Kennung, die dauerhaft auf jedem Boot angebracht ist und den Herstellercode (MIC), die Modellbezeichnung, das Produktionsjahr und die Seriennummer kodiert. Es ist für alle auf den EU-Markt gebrachten RIB-Boote obligatorisch und auf jedem Aquafarer-RIB enthalten.
    - q: Wie lange werden technische Dateien aufbewahrt?
      a: Gemäß den Anforderungen der RCD 2013/53/EU muss der Hersteller die technischen Unterlagen mindestens 10 Jahre lang ab dem letzten Datum, an dem das Produkt auf den Markt gebracht wurde, aufbewahren. Aquafarer verfügt über eine vollständige technische Dokumentation für alle hergestellten Modelle.
    - q: Unterstützen Sie Importeure bei der Einhaltung der RCD?
      a: 'Ja. Wir stellen das Dokumentationspaket bereit, das EU-Importeure zur Erfüllung ihrer Pflichten benötigen: Zugriff auf technische Dateien, Konformitätserklärung, Herstellerschild, Bedienungsanleitung und Aufzeichnungen zur Produktrückverfolgbarkeit. Die Pflichten des Importeurs im Rahmen der RCD sind in unserem Compliance-Leitfaden klar dokumentiert.'
