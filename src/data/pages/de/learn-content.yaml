materials:
  intro_p1: Die Leistung, Haltbarkeit und Sicherheit eines aufblasbaren Paddleboards hängen fast vollständig von den verwendeten Materialien ab. Vom Laminat, das den Rumpf bildet, bis zu den Gewinden, die dem SUP Board seine Steifigkeit verleihen – jede Materialwahl beeinflusst, wie das Produkt auf dem Wasser funktioniert und wie lange es hält.
  intro_p2: 'Dieser Leitfaden behandelt die drei Kernmaterialien, die in modernen aufblasbaren Paddleboards verwendet werden: das PVC Laminat, den drop-stitch Kern und das EVA Schaumstoffdeck. Das Verständnis dieser Materialien hilft Ihnen, das richtige Board für Ihre Bedürfnisse auszuwählen und es für maximale Lebensdauer zu erhalten.'
  labels:
    advantages: Vorteile
    limitations: Einschränkungen
    best_for: 'Am besten für:'
  items:
    - name: PVC (Polyvinylchlorid)
      summary: Der Industriestandard für aufblasbare SUPs Stoffe. Mehrlagiger laminierter Stoff bietet ein ausgezeichnetes Festigkeits-Gewichts-Verhältnis zu einem erschwinglichen Preis.
      pros:
        - Ausgezeichnetes Preis-Leistungs-Verhältnis
        - Leicht und leicht zu handhaben
        - Guter UV Widerstand mit geeigneten Beschichtungen
        - Große Auswahl an Farben und Oberflächen
        - Leicht zu reparieren mit PVC Flicken und Lösungsmittelkleber
      cons:
        - Typische Lebenserwartung von 7–10 Jahren bei angemessener Pflege
        - Weniger flexibel bei kalten Temperaturen
        - Geringere chemische Beständigkeit
        - Kann im Laufe der Zeit eine Migration von Weichmachern entwickeln
      best_for: Freizeit- und Touren SUPs, Familienpaddeln, saisonale Nutzung, Süßwasser- und Küstenumgebungen.
    - name: Drop-Stitch Kern
      summary: Die Technologie, die SUPs aufblasbare Fäden revolutionierte. Tausende von Polyesterfäden verbinden die oberen und unteren Stoffschichten und ermöglichen so Hochdruckaufblasung für starre, harte Schalenleistung.
      pros:
        - Extrem starr bei 12-20 PSI
        - Leichtgewicht — 8-14 kg für Boards in Standardgröße
        - Lässt sich flach zusammenfalten für Lagerung und Reisen
        - Ausgezeichnete Schlagfestigkeit
        - Konstante Leistung über verschiedene Temperaturbereiche
      cons:
        - Benötigt eine Hochdruckpumpe
        - Reparatur von Durchstichen komplexer als bei einlagigen Boards
        - Höhere Herstellungskosten als bei Standard-Inflatables
        - Druckverlust über die Zeit erfordert regelmäßiges Nachfüllen
      best_for: Stand-up-Paddle-Boards und jede Ausrüstung, die steife Leistung bei aufblasbarer Tragbarkeit benötigt.
    - name: EVA Schaumstoff-Deck
      summary: Geschlossenzelliger EVA (Ethylen-Vinylacetat) Schaumstoff, der für Traktionspads auf SUP Boards verwendet wird. Bietet Polsterung, Grip und Wärmedämmung — und trägt die Art-Series-Designs.
      pros:
        - Ausgezeichnete rutschfeste Haftung bei nass oder trocken
        - Polsterung reduziert Ermüdung bei langen Paddelstrecken
        - Wärmedämmung gegen kalte Deckoberfläche
        - UV und salzwasserbeständig
        - Erhältlich in mehrfarbigen Blockmustern und lasergravierten Designs
      cons:
        - Kann bei starker Nutzung 2-3 Jahre halten
        - Muss korrekt verklebt werden, um Delamination zu verhindern
        - Nicht strukturell — beeinflusst die Steifigkeit nicht
        - Fügt leichtes Gewicht hinzu (200-400 g pro Board)
      best_for: SUP Traktion auf dem Deck, Art-Series-Deckdesigns und jede Oberfläche, die rutschfesten Halt benötigt.
  selection:
    title: Materialauswahl-Leitfaden
    subtitle: 'Wählen Sie das richtige Material basierend auf Ihrem Hauptanwendungsfall:'
    headers:
      - Anwendungsfall
      - Empfohlenes Material
      - Warum
    rows:
      - - Freizeit-SUP Paddeln
        - Drop-stitch PVC
        - Leicht, steif, erschwinglich — idealer Kompromiss für Freizeitsportler
      - - Familien- & Anfänger-Paddeln
        - Breit drop-stitch PVC (32")+
        - Stabil und verzeihend – Selbstvertrauen für Erstradler
      - - Angeln und gerätelastiges Paddeln
        - Breit drop-stitch PVC mit vollem EVA Deck
        - Zusätzliche Stabilität beim Stehen und Werfen, großes Volumen beim Tackle
      - - SUP Vermietungsflotten-Boards
        - Drop-stitch PVC + EVA Deck
        - Haltbar, reparierbar, ein gutes Preis-Leistungs-Verhältnis bei hohem Umsatz
      - - Touring & längere Paddel
        - Drop-stitch PVC (~11 Fuß)
        - Bessere Verfolgung und Gleiteffizienz über Distanz
      - - Yoga & Fitness-Paddeln
        - Breit drop-stitch PVC mit vollem EVA Deck
        - Stabile, bequeme Plattform für Posen und Workouts
  deep_dive:
    title: Tieftaucher-Guides
    topics:
      - title: Marine-Qualität PVC
        desc: Mehrschichtiger laminierter PVC Stoff – UV Widerstandsfähigkeit, Abriebtests und Denier-Bewertungen erklärt.
      - title: PVC Laminatschichten
        desc: Wie mehrschichtige Laminierung PVC Stärke, Gewicht und Widerstand ausbalanciert UV .
      - title: Drop-Stitch Kern
        desc: Wie Tausende von inneren Gewinden starre, hochdruckaufblasbare Strukturen bei 15 erzeugen PSI.
      - title: RF-Schweißtechnologie
        desc: Hochfrequenzschweißen erzeugt starke, gleichmäßige Nähte – wie es funktioniert und warum es wichtig ist.
      - title: PSI & Leistung
        desc: Warum Luftdruck für aufblasbare Geräte wichtig SUPs ist – Steifigkeit, Tragfähigkeit und Fahrkomfort.
      - title: Qualitätstest
        desc: Druckprüfungen, Auftriebstests, UV Alterungstests und zerstörerische Tests – unser Qualitätsprozess.
      - title: EVA Schaumstoffdecks
        desc: Geschlossenzellige EVA Schaumstoff-Deckpads – Traktion, Komfort und Haltbarkeit für SUP Decks.
      - title: Materialpflege
        desc: Reinigung, UV Schutz, Mehltauprävention und Lagerung bewährte Praktiken für aufblasbare Produkte.
