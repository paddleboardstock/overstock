materials:
  intro_p1: Leistung, Haltbarkeit und Sicherheit eines aufblasbaren Wasserfahrzeugs hängen fast vollständig von den verwendeten Materialien ab. Vom Stoff, der die Schläuche bildet, bis zu den Fäden, die einem SUP-Board seine Steifigkeit geben — jede Materialwahl beeinflusst, wie sich das Produkt auf dem Wasser verhält und wie lange es hält.
  intro_p2: 'Dieser Leitfaden behandelt die vier Kernmaterialien moderner aufblasbarer Wasserfahrzeuge: PVC-Gewebe, Hypalon-CSM-Kautschuk, Drop-Stitch-Kernkonstruktion und EVA-Schaumstoffdecks. Wer diese Materialien versteht, wählt das richtige Produkt für seine Bedürfnisse und erhält es für eine maximale Lebensdauer.'
  labels:
    advantages: Vorteile
    limitations: Nachteile
    best_for: 'Am besten für:'
  items:
    - name: PVC (Polyvinylchlorid)
      summary: Der Industriestandard für Freizeit-Schlauchboote und SUPs. Das mehrlagige laminierte Gewebe bietet ein hervorragendes Verhältnis von Festigkeit zu Gewicht zu einem zugänglichen Preis.
      pros:
        - Bezahlbar — 30-50 % günstiger als Hypalon
        - Leicht und einfach zu handhaben
        - Gute UV-Beständigkeit mit geeigneten Beschichtungen
        - Große Auswahl an Farben und Oberflächen
        - Einfach zu reparieren mit PVC-Flicken und Lösungsmittelkleber
      cons:
        - Kürzere Lebensdauer als Hypalon (7-10 Jahre)
        - Weniger flexibel bei Kälte
        - Geringere Chemikalienbeständigkeit
        - Kann im Laufe der Zeit Weichmacherverlust zeigen
      best_for: Freizeit-SUPs, preisgünstige Boote, Verleihflotten, saisonale Nutzung, Süß- und Küstengewässer.
    - name: Hypalon (CSM-Kautschuk)
      summary: Hochwertiges Synthesekautschuk-Material, bekannt für außergewöhnliche Haltbarkeit, UV-Beständigkeit und Langlebigkeit. Der Goldstandard für gewerbliche und militärische Schlauchboote.
      pros:
        - Außergewöhnliche UV- und Ozonbeständigkeit
        - Lebensdauer von 15-20 Jahren bei richtiger Pflege
        - Ausgezeichnete Kälteflexibilität
        - Überlegene Beständigkeit gegen Chemikalien und Öl
        - Hält die Farbe länger als PVC
      cons:
        - Deutlich teurer als PVC
        - Schwereres Gewebe
        - Weniger Farboptionen
        - Reparaturen erfordern Spezialkleber
        - Weniger Produktionsstätten weltweit
      best_for: Gewerbliche RIBs, Suche und Rettung, militärische Anwendungen, tropische Klimazonen, langfristiger Flottenbetrieb.
    - name: Drop-Stitch-Kern
      summary: Die Technologie, die aufblasbare SUPs revolutioniert hat. Tausende Polyesterfäden verbinden die obere und untere Gewebelage und ermöglichen so das Aufpumpen mit hohem Druck für Steifigkeit wie bei einem Hardshell-Board.
      pros:
        - Extrem steif bei 12-20 PSI
        - Leicht — 18-30 lbs für ein Board in voller Größe
        - Lässt sich flach falten für Transport und Lagerung
        - Ausgezeichnete Stoßfestigkeit
        - Konstante Leistung über alle Temperaturbereiche
      cons:
        - Benötigt eine Hochdruckpumpe
        - Reparatur von Einstichen ist komplexer als bei einschichtigen Konstruktionen
        - Höhere Herstellungskosten als bei Standard-Aufblasprodukten
        - Druckverlust über die Zeit erfordert regelmäßiges Nachpumpen
      best_for: Stand-Up-Paddle-Boards, Kajaks, Luftdecks für Schlauchboote — überall dort, wo steife Leistung auf aufblasbare Portabilität trifft.
    - name: EVA-Schaumstoffdeck
      summary: Geschlossenzelliger EVA-Schaum (Ethylen-Vinyl-Acetat) für Traktionspads auf SUP-Boards und Bootsdecks. Bietet Dämpfung, Halt und Wärmedämmung.
      pros:
        - Hervorragender rutschfester Halt, nass oder trocken
        - Dämpfung reduziert Ermüdung auf langen Paddeltouren
        - Wärmedämmung gegen kalte Decks
        - UV- und salzwasserbeständig
        - Verfügbar in mehrfarbigen Mustern und lasergeschnittenen Designs
      cons:
        - Kann bei starker Nutzung nach 2-3 Jahren verschleißen
        - Muss richtig verklebt werden, um Ablösung zu verhindern
        - Nicht tragend — beeinflusst die Steifigkeit nicht
        - Etwas höheres Gewicht (200-400 g pro Board)
      best_for: SUP-Decktraktion, Bootsdeck-Polsterung, Kajaksitz-Komfort — jede Oberfläche mit rutschfestem Anspruch.
  selection:
    title: Material-Auswahlleitfaden
    subtitle: 'Wählen Sie das richtige Material nach Ihrem hauptsächlichen Einsatzzweck:'
    headers:
      - Einsatzzweck
      - Empfohlenes Material
      - Warum
    rows:
      - - Freizeit-SUP-Paddeln
        - Drop-Stitch-PVC
        - Leicht, steif, bezahlbar — die ideale Balance für Gelegenheitspaddler
      - - Familien-Dingi / Seenboot
        - PVC (1100 Denier)
        - Kosteneffizient, leicht zu reparieren, ausreichend haltbar für die Freizeit
      - - Gewerblicher RIB / Patrouillenboot
        - Hypalon CSM
        - Maximale UV-Beständigkeit, 15-20 Jahre Lebensdauer, Chemikalien-/Ölbeständigkeit
      - - SUP-Verleihflotte
        - Drop-Stitch-PVC + EVA-Deck
        - Robust, reparierbar, gutes Preis-Leistungs-Verhältnis bei hoher Auslastung
      - - Such- und Rettungseinsätze
        - Hypalon CSM
        - Zuverlässigkeit unter extremen Bedingungen, Kälteflexibilität, Chemikalienbeständigkeit
      - - Touren- / Expeditions-Kajak
        - Drop-Stitch-PVC
        - Steife Leistung mit packbarer Portabilität für Reisen
  deep_dive:
    title: Vertiefte Leitfäden
    topics:
      - title: PVC in Marinequalität
        desc: Mehrlagiges laminiertes PVC-Gewebe — UV-Beständigkeit, Abriebtests und Denier-Werte erklärt.
      - title: PVC vs. Hypalon
        desc: Der definitive Vergleich der beiden dominierenden Schlauchboot-Materialien — Kosten, Lebensdauer, UV-Beständigkeit.
      - title: Drop-Stitch-Kern
        desc: Wie Tausende interne Fäden bei 12-15 PSI steife Hochdruckstrukturen schaffen.
      - title: HF-Schweißtechnologie
        desc: Hochfrequenzschweißen erzeugt starke, gleichmäßige Nähte — so funktioniert es und warum es zählt.
      - title: PSI und Leistung
        desc: Warum Luftdruck für aufblasbare SUPs und Boote zählt — Steifigkeit, Zuladung und Fahrverhalten.
      - title: Qualitätstests
        desc: Drucktests, Auftriebstests, UV-Aging und zerstörende Prüfungen — unser Qualitätsprozess.
      - title: EVA-Schaumstoffdecks
        desc: Geschlossenzellige EVA-Decks-Pads — Traktion, Komfort und Haltbarkeit für SUP- und Bootsdecks.
      - title: Materialpflege
        desc: Reinigung, UV-Schutz, Schimmelvorbeugung und Lagerungstipps für aufblasbare Produkte.
