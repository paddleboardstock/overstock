content_challenge:
  tagline: Die Herausforderung
  title: Offshore-Energieanforderungen<br />Extreme Umgebungszuverlässigkeit
  subtitle: Offshore-Energiebetriebe bringen die Ausrüstung an ihre Grenzen – extreme Wetterbedingungen, abgelegene Standorte, kontinuierliche Arbeitszyklen und keine Toleranz gegenüber Ausfällen.
  paragraphs:
    - Die Offshore-Energiebranche arbeitet in den anspruchsvollsten maritimen Umgebungen der Erde. Arbeitsboote unterstützen Öl- und Gasplattformen, Windkraftanlagen-Installationen, Unterseekabel-Operationen und marine Bauprojekte — oft auf offenem Meer innerhalb begrenzter Wetterfenster. Ein Geräteausfall ist nicht nur teuer, er ist gefährlich.
    - '**Sicherheit hat oberste Priorität** — Crew-Transfer-Vessels müssen sicher in Seegang operieren können, der andere Einsätze zum Stillstand bringen würde. Stabilität am Transferpunkt, zuverlässige Motorleistung bei jedem Wetter und robuste Bauweise für wiederholtes Anlegen an Offshore-Strukturen sind zwingende Anforderungen.'
    - '**Ganzwettertauglichkeit ist entscheidend** — Offshore-Windparks und Ölplattformen laufen ganzjährig. Arbeitsboote müssen bei schwerer See, starkem Wind und eingeschränkter Sichtleistung bringen. Tag- und Nachtoperationen erfordern vollständige Navigationsausstattung und zuverlässige Beleuchtungssysteme.'
    - '**Die Offshore-Windbranche wächst rasch** — Weltweit werden Tausende neue Turbinen installiert, jede davon erfordert regelmäßigen Personaltransfer, Werkzeugtransport und Wartungsunterstützung. Das schafft eine anhaltende Nachfrage nach speziell gebauten Crew-Transfer-Vessels (CTV) und Support-RIBs.'
    - Aquafarer Offshore-Energie-RIBs sind konzipiert mit verstärkten Deep-V-Rümpfen, schwer belastbaren Hypalon-Schläuchen, vollständiger Navigationsausstattung und Sicherheitssystemen für die extremen Bedingungen von Offshore-Energieeinsätzen.
content_solution:
  tagline: Unsere Lösung
  title: Speziell gebaute Offshore-RIBs<br />Für die Energiebranche
  subtitle: Jedes Offshore-Energie-RIB von Aquafarer ist für den sicheren und zuverlässigen Betrieb unter extremen Meeresbedingungen ausgelegt – von der Nordsee bis Südostasien.
  list:
    - Verstärkter Deep-V-Rumpf für Leistung in rauer See und vorhersehbares Fahrverhalten
    - Schwer belastbare Hypalon-Schläuche mit UV- und Chemikalienbeständigkeit für verlängerten Offshore-Einsatz
    - Beschläge aus Edelstahl 316 — keine Korrosion bei dauerhafter Salzwasserexposition
    - 'Volle Navigationsausstattung: GPS, Radar, VHF, Nachtnavigationslichter — Standard bei Offshore-Modellen'
    - Selbstlenzendes Deck für sicheren Betrieb bei überkommender See
    - Mehrere Motorkonfigurationen — Einzel- oder Doppel-Außenborder für Einsatzredundanz
    - Schleppmast und schwere Kauschen für die Handhabung von Plattformen und Bojen
    - Hochsichtbare Schlauchfarben zur Identifikation auf Offshore-Arbeitsplätzen
content_segments:
  tagline: Energieprofile
  title: Offshore-Energielösungen<br />Nach Anwendungstyp
  subtitle: Verschiedene Offshore-Energiesektoren haben unterschiedliche Anforderungen an Arbeitsboote – von Plattformunterstützungs-RIBs über CTVs für Windparks bis hin zu Unterwasserinspektionsschiffen.
  items:
    - title: Unterstützung von Offshore-Öl- und Gasplattformen
      subtitle: Mannschaftstransfer, Ausrüstungsversorgung, Sicherheitsbereitschaft der Plattform
      description: Öl- und Gasplattformen erfordern einen täglichen Personalwechsel, einen Ausrüstungs- und Versorgungstransport sowie eine Sicherheitsbereitschaftsabdeckung. Arbeitsboote müssen sicher um Plattformstrukturen herum, bei starken Strömungen und wechselndem Seegang operieren und während des Personaltransfers über Leiter oder Gangway eine präzise Positionshaltung gewährleisten. Die extreme Umgebung – Kohlenwasserstoffe, Chemikalien, ständiger Salznebel – erfordert eine korrosionsbeständige Konstruktion und zuverlässige Leistung.
      features:
        - Crew-Transfer-Konfiguration mit sicherem Bootszugang und Haltegriffen
        - Korrosionsbeständige Hypalon-Schläuche und Beschläge aus Edelstahl 316
        - Verstärkte Scheuerleisten für häufigen Kontakt mit Plattform-Fendern
        - Selbstlenzendes Deck für öliges Wasser und chemische Spülung
        - Hochkapazitativer Kraftstofftank für erweiterte Offshore-Reichweite
        - Doppelmotor-Option für missionskritische Redundanz
    - title: Betrieb von Offshore-Windparks
      subtitle: Mannschaftstransfer, Turbinenwartung, Werkzeugtransport
      description: Offshore-Wind ist der am schnellsten wachsende Sektor der Meeresenergie. Betreiber benötigen Crew-Transfer-Schiffe (CTVs), die Techniker bei Seegang bis zu einer signifikanten Wellenhöhe von 1,5 m sicher zu Turbinenzugangsplattformen transportieren können. Stabilität beim Transfer, Allwettertauglichkeit und zuverlässiger Alltagsbetrieb sind entscheidend. Windpark-Serviceschiffe arbeiten nach engen Zeitplänen – jede Ausfallzeit verzögert die Inbetriebnahme oder Wartung der Turbine, was sich direkt auf die Einnahmen aus der Energieproduktion auswirkt.
      features:
        - Optimierte Rumpfform für stabilen Personaltransfer am Turbinenfuß
        - Deep-V-Einlauf für komfortable Fahrt in Offshore-Dünung und Wellengang
        - Vollständiger Wetterschutz — geschlossene Konsole oder Steuerhaus für den Komfort der Besatzung
        - Deckfläche für Werkzeug, Ersatzteile und Serviceausrüstung
        - Nachtbetriebs-Paket für verlängerte winterliche Schichten mit kurzer Tageslichtzeit
        - Leiser Außenborderbetrieb für minimale Lärmbelastung der Meeresumwelt
    - title: Unterstützung für Unterwasserkabel und Pipelines
      subtitle: Inspektion, Wartung, ROV-Unterstützung, Vermessung
      description: Unterseekabel- und Pipelinebetreiber benötigen Arbeitsboote für die Streckeninspektion, Wartungsunterstützung, ROV-Einsätze und Vermessungsaufgaben. Diese Schiffe benötigen stabile Plattformen zum Ausbringen und Bergen von Unterwasserausrüstung, präzises Manövrieren zur Kabelverfolgung und einen zuverlässigen Betrieb in Küsten- und Offshore-Umgebungen. Die Stabilität des Bootes ist entscheidend für die Genauigkeit von Sonar- und Vermessungsgeräten.
      features:
        - Stabile Plattform bei langsamer Fahrt für Kabelverfolgung und Vermessungseinsätze
        - Offenes Decklayout für ROV-Einsatz, Kabeltrommeln und Vermessungstechnik
        - Geräte-Montageplatten für Sonar, GPS und Vermessungsinstrumentierung
        - Kielwasserarme Rumpfbauweise für minimale Meeresbodenbeeinträchtigung bei Inspektionen
        - Präzise Langsamfahrmanöver mit reaktionsfreudiger Außenborder-Steuerung
    - title: Meerestechnik und Bauunterstützung
      subtitle: Personentransport, Materialversorgung, Tauchunterstützung
      description: Schiffbauunternehmen, die an Hafenbau-, Küstenschutz- und Offshore-Installationsprojekten arbeiten, benötigen vielseitige Arbeitsboote für den Personentransport zwischen Bauschiffen und Land, Material- und Werkzeugversorgung, Tauchunterstützung und Standortvermessungen. Diese Boote werden in aktiven Baugebieten mit mehreren Schiffen, begrenztem Manövrierraum und wechselnden Seebedingungen eingesetzt. Haltbarkeit und Vielseitigkeit stehen im Vordergrund.
      features:
        - Multifunktions-Decklayout für Personal, Material und Tauchausrüstung
        - Tauchleiter und Geräteaufnahmen für Taucheinsatz-Unterstützung
        - Schwere Kauschen und Schleppmast für Manöver auf Baustellen
        - Robuste Hypalon-Bauweise mit Widerstandsfähigkeit gegen Bauschutt und Abrieb
        - Flexible Sitzkonfigurationen — Personaltransport oder Lademodus
