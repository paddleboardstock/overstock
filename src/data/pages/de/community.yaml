stories:
  tagline: Entdeckergeschichten
  title: Echte Abenteuer von echten Menschen
  subtitle: Hören Sie von Paddlern, Familien und Fachleuten, die Paddle Board Overstock Ausrüstung auf dem Wasser benutzen.
  items:
    - name: Sarah & Mike
      title: SUP Explorer 11 Besitzer, Kanada
      content: Wir nahmen unsere Explorer 11 auf eine einwöchige Reise durch den Algonquin Park mit. Sie meisterten Transportagen und Seeüberquerungen hervorragend. Die drop-stitch Bauweise ermöglichte es uns, auf 15 Fuß aufzublasen PSI und Hardboard-Leistung von einem packbaren Board zu erzielen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Algonquin Park, Kanada
    - name: Carlos R.
      title: Cheetah Surge Reiter, Spanien
      content: Der Cheetah Surge ist meine erste Wahl für Küstenfahrten. Das lebendige Design sorgt am Strand für Aufsehen, und die Stabilität gibt mir Selbstvertrauen bei leichtem Chopping. Er fährt sich wunderschön, egal ob ich auf Tour bin oder einfach den Sonnenuntergang genieße.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Spanien
    - name: Lina & Familie
      title: Flowing Lotus Paddler, Schweden
      content: Wochenend-Familienabenteuer auf dem Archipel. Der Flowing Lotus ist stabil genug, damit meine Tochter darauf stehen kann, während ich paddele. Bläht sich in weniger als 10 Minuten auf – kein Anhänger nötig, einfach reiner Familienspaß auf dem Wasser.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Stockholmer Archipel, Schweden
    - name: Andres D.
      title: Ocean Voyager-Entdecker, Philippinen
      content: Ich nutze meine Ocean Voyager für Langstrecken-Küstentouren rund um Palawan. Nach monatelangem täglichem Einsatz unter tropischen Bedingungen funktioniert das Board immer noch wie neu. Die Touring-Form durchdringt Chop, die kleinere Boards aufhalten würde.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Philippinen
    - name: Emma T.
      title: Tropical Breeze-Erstnutzer, Australien
      content: Ich war noch nie auf einem SUP gewesen. Der Tropical Breeze ist so stabil, dass ich mich beim ersten Versuch sicher fühlte. Jetzt paddel ich jedes Wochenende. Die Lernkurve ist praktisch null – und das Board sieht auf dem Wasser einfach fantastisch aus.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australien
