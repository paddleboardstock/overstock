content_founding:
  tagline: Der Anfang
  title: 'Am Wasser geboren'
  subtitle: 'Paddle Board Overstock startete in einer Küstenwerkstatt in Qingdao mit einem Boot und einer Vision: aufblasbare Wasserfahrzeuge zu bauen, die echten Marinebedingungen standhalten.'
  paragraphs:
    - '2012 erkannten unsere Gründer eine Marktlücke — die meisten Schlauchboote waren entweder erschwinglich, aber unzuverlässig, oder von hoher Qualität, aber unerschwinglich teuer. Sie glaubten an einen Platz für einen Hersteller, der Qualität und Wert zugleich bietet.'
    - 'Der erste Rumpf wurde von Hand gebaut, in lokalen Gewässern getestet und auf Basis echter Rückmeldungen von Fischern und kleinen gewerblichen Betreibern verfeinert. Diese Schleife — bauen, testen, zuhören, verbessern — ist bis heute der Kern unserer Ingenieursphilosophie.'
    - 'Bis 2015 hatte sich die Nachricht über Qingdao hinaus verbreitet. Internationale Distributoren begannen, Muster anzufordern. Was als lokale Werkstatt begann, wurde zu einem globalen Lieferanten.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Frühe Produktionswerkstatt und Fertigung von Paddle Board Overstock
content_growth:
  tagline: Wachstum und Innovation
  title: 'Von der Werkstatt zu 12,000 m² Werksfläche'
  subtitle: 'Kontinuierliche Investitionen in Menschen, Ausrüstung und Prozesse haben Paddle Board Overstock zu einem modernen Marine-Produktionsbetrieb gemacht.'
  paragraphs:
    - 'Mit der Nachfrage wuchs auch unser Werk. Wir expandierten von einer kleinen Werkstatt zu einer 12,000 m² großen Fabrik mit eigenen Produktionslinien für RIB-Boote, Schlauchboote, SUP-Boards und Zubehör.'
    - 'Wir investierten in CNC-Zuschneidemaschinen, Hochfrequenz-Schweißgeräte, Drop-Stitch-Produktionslinien und umfassende Testvorrichtungen — so kontrollieren wir jeden Aspekt der Produktionsqualität.'
    - 'Heute umfasst unser Team von 200-300 Personen Schiffsingenieure, Materialwissenschaftler, Qualitätssicherungsspezialisten und erfahrene Handwerker — viele davon sind seit den Anfängen bei Paddle Board Overstock.'
content_mission:
  tagline: Unsere Mission
  title: 'Freiheit auf dem Wasser konstruiert'
  subtitle: 'Jedes Paddle Board Overstock-Produkt ist darauf ausgelegt, Menschen zu helfen, auf dem Wasser zu erkunden, zu arbeiten und zu wachsen — zuverlässig, sicher und erschwinglich.'
  list:
    - 'Wasserfahrzeuge konstruieren, die unter echten Marinebedingungen funktionieren — nicht nur auf dem Papier'
    - 'Dauerhafte Partnerschaften mit Distributoren und Marken durch zuverlässigen OEM/ODM-Service aufbauen'
    - 'Unsere Fertigungsprozesse kontinuierlich verbessern, um mehr Wert zu liefern'
    - 'Jedes Produkt mit echten Ersatzteilen und technischer Expertise unterstützen'
