process_steps:
  title: 6-Schritte-OEM/ODM-Prozess
  subtitle: Vom Design-Brief bis FOB Qingdao — ein optimierter Arbeitsablauf
  steps:
    - number: '01'
      title: Design-Brief & 3D-CAD-Modellierung
      description: Teilen Sie Ihre Zielvorgaben, ein Referenzprodukt oder Ihr Konzept. Unser Konstruktionsteam erstellt detaillierte CAD-Zeichnungen und 3D-Visualisierungen zur Freigabe.
      timeline: 3–5 Tage
    - number: '02'
      title: Materialauswahl & Gewebetests
      description: Wählen Sie zwischen militärischem PVC (0,9–1,2 mm), Hypalon CSM oder Drop-Stitch-Kerngeweben. Wir führen Zugfestigkeits-, Beschichtungshaftungs- und UV-Stabilitätstests durch.
      timeline: 2–3 Tage
    - number: '03'
      title: Schnellprototyping & Musterproduktion
      description: Wir fertigen kundenspezifische Formen per CNC und produzieren Vorserienmuster in Ihren Markenfarben, mit Ihrem Logo und den gewünschten Materialien. Muster werden zur Freigabe versandt.
      timeline: 7–14 Tage
    - number: '04'
      title: 24–48-Stunden-Druckhalteprüfung
      description: Jeder Prototyp durchläuft strenge Druckhalteprüfungen bei dem 1,25-fachen Nenndruck. Nahtschältests und Maßverifikation werden durchgeführt.
      timeline: 1–2 Tage
    - number: '05'
      title: CE/ISO-Qualitätsprüfung & Verpackung
      description: 100-Punkte-Qualitätscheckliste. Jede Einheit wird vor der verkaufsfertigen Verpackung geprüft. CE-Konformitätserklärung und BSCI-Konformitätsbericht inklusive.
      timeline: 2–3 Tage
    - number: '06'
      title: FOB-Qingdao-Versand & Logistik
      description: Fertigwaren werden palettiert, schrumpffolienverpackt und im Hafen von Qingdao containerbeladen. Vollständige Exportdokumentation, Zollabfertigung und Echtzeit-Tracking.
      timeline: 7–14 Tage

