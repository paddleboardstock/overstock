faq:
  title: OEM/ODM — Häufig gestellte Fragen
  questions:
    - q: Wie hoch ist die Mindestbestellmenge (MOQ) für kundenspezifische aufblasbare SUPs?
      a: Für Standardmodelle mit vorhandenen Formen beginnt die MOQ bei 5–10 Stück je Design. Bei vollständig kundenspezifischen Formen und Werkzeugen liegt die MOQ üblicherweise bei 200+ Stück. Wir arbeiten mit Startups und aufstrebenden Marken zusammen, um gangbare Einstiegspunkte zu finden.
    - q: Wie hoch ist die MOQ für kundenspezifische RIB-Boote?
      a: RIB-Modelle starten bei 2–5 Stück je Design mit vorhandenen Formen, während vollständig kundenspezifische RIB-Formen größere Mindestmengen erfordern. Wir arbeiten mit Startups und etablierten Marken zusammen, um gangbare Einstiegspunkte zu finden.
    - q: Wie lange dauert der OEM-Musterprozess?
      a: Standard-Prototypmuster werden innerhalb von 7–14 Arbeitstagen nach Designfreigabe fertiggestellt. Eilaufträge können gegen Aufpreis auf 5–7 Tage priorisiert werden.
    - q: Was ist der Unterschied zwischen PVC und Hypalon für Schlauchboote?
      a: PVC ist leichter, günstiger und bietet ausgezeichnete Flexibilität bei Kälte. Hypalon (CSM) bietet überlegene UV- und Ozonbeständigkeit bei längerer Lebensdauer (10–15 Jahre gegenüber 5–8 Jahren). Wir empfehlen PVC für die meisten Freizeitanwendungen und Hypalon für gewerbliche/professionelle Nutzung.
    - q: Können Sie Form und Design des Schlauchboots individualisieren?
      a: Ja. Unser F&E-Team kann kundenspezifische Formen für jede Rumpfform, Boardkontur oder Schlauchkonfiguration entwickeln. Wir verwenden CNC-gefräste Aluminiumformen für Präzision und Konsistenz.
    - q: Bieten Sie Werksaudit-Dienste an?
      a: Wir begrüßen Werksaudits vor Ort und durch Dritte in unserer 12.000 m² großen Anlage in Qingdao. Wir halten ISO-9001- und BSCI-Zertifizierungen aufrecht und können Auditberichte gegen NDA teilen.
    - q: Welche Lieferbedingungen bieten Sie an?
      a: Wir bieten die Lieferbedingungen FOB Qingdao (Standard), CIF und DDP an. Containerbeladung und vollständige Exportdokumentation sind in allen OEM-Aufträgen enthalten.

content_profiles:
  tagline: Markenprofile
  title: 'OEM / Private-Label-Fertigung<br /> nach Kundentyp'
  subtitle: 'Verschiedene Markenprofile haben unterschiedliche Anforderungen — wir passen unsere OEM/ODM-Services an Ihr Geschäftsmodell, Ihre Größe und Ihre Go-to-Market-Strategie an.'
  items:
    - title: Startup-Wassersportmarken
      subtitle: Niedrige MOQ, schneller Hochlauf
      description: 'Unternehmer und Gründer, die ihre erste Linie an RIB-Booten, SUPs oder Schlauchbooten auf den Markt bringen. Sie brauchen einen Fertigungspartner, der Ihre Marke wie seine eigene behandelt — mit niedrigen Einstiegshürden, flexiblen Losgrößen und praxisnaher Designberatung in jedem Schritt.'
      features:
        - 'MOQ ab nur 2–5 Stück (RIB) / 5–10 Stück (SUP) je SKU'
        - 'Vorhandene Formenbibliothek zur Vermeidung von Werkzeugkosten'
        - 'Komplettes Branding-Paket: Logo, Schlauchgrafiken, Verpackung, Hängeetiketten'
        - 'Muster-zuerst-Workflow — Freigabe vor der Produktion'
    - title: Etablierte Marinemarken
      subtitle: OEM-Maßstab mit CE/ISO-Konformität
      description: 'Bestehende Marken für Boote, PWCs oder Marinezubehör, die aufblasbare Wasserfahrzeuge in ihr Sortiment aufnehmen. Sie brauchen gleichbleibende Qualität über Produktionsserien hinweg, regulatorische Konformität für globale Märkte und die Fähigkeit zur gemeinsamen Entwicklung kundenspezifischer Rümpfe oder Schlauchformen.'
      features:
        - 'Kundenspezifische 3D-Formenkonstruktion für eigene Designs'
        - 'CE-2013/53/EU-, UKCA-, USCG-Konformitätsdokumentation'
        - 'BSCI-Sozialauditberichte für Händlerkonformität'
        - 'Dediziertes Account-Management + prioritäre Produktionsfenster'
    - title: DTC- & E-Commerce-Marken
      subtitle: Verkaufsfertige Verpackung im großen Maßstab
      description: 'Online-first-Marken, die über Amazon, Shopify oder eigene Webshops verkaufen. Verpackung, Unboxing-Erlebnis und gleichbleibende Einheitenqualität sind entscheidend. Sie brauchen eine Fabrik, die die Dynamik von Umsatzgeschwindigkeit und Retourenquoten im E-Commerce versteht.'
