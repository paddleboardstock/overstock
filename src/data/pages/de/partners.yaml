hero:
  tagline: Partner & Vertrieb
  title: 'Werden Sie Aquafarer-Partner<br />— globales Vertriebsnetzwerk'
  subtitle: 'Schließen Sie sich dem globalen Partnernetzwerk von Aquafarer an. Wir arbeiten mit Marinedistributoren, Bootshändlern, Ausrüstungshändlern und Markenpartnern in über 50 Ländern zusammen.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer globales Partner- und Vertriebsnetzwerk
content_programs:
  tagline: Partnerprogramme
  title: 'Partnerprogramme<br />für Wachstum ausgelegt'
  subtitle: 'Ob Distributor, Händler oder Markenpartner — Aquafarer bietet Programme, die Ihr Geschäft unterstützen.'
  columns: 3
  items:
    - title: 'Distributor-Programm'
      description: 'Exklusiver Gebietsvertrieb mit Mengenrabatten, Marketingunterstützung und direktem Werkszugang. Mindestabnahme je nach Gebietsgröße erforderlich.'
      icon: tabler:world
    - title: 'Händlerprogramm'
      description: 'Direkte Händlerkonditionen, Produktschulungen, Marketingmaterialien und Garantieunterstützung für stationäre Geschäfte und Online-Shops.'
      icon: tabler:building-store
    - title: 'OEM/ODM-Partnerschaft'
      description: 'Full-Service-OEM- und ODM-Fertigung mit individuellem Branding, Verpackung und Produktspezifikationen. Vom Konzept bis zum Container.'
      icon: tabler:certificate
    - title: 'Markenpartnerschaft'
      description: 'Co-Branding, Private Label und exklusive Modellprogramme für etablierte Marken im Marine- und Outdoor-Freizeitbereich.'
      icon: tabler:stars
    - title: 'Regierung & Institutionen'
      description: 'Bevorzugte Lieferantenprogramme für Regierungsbehörden, Küstenwachen, Militär und humanitäre Organisationen. Ausschreibungsfertige Dokumentation.'
      icon: tabler:building-community
    - title: 'Resort- & Verleihpartner'
      description: 'Flottenpreise, gleichbleibende Qualität und individuelles Branding für Resorts, Tauchzentren und Verleihbetriebe weltweit.'
      icon: tabler:sun
content_benefits:
  tagline: Warum eine Partnerschaft mit uns
  title: 'Warum Partner sich für Aquafarer entscheiden'
  subtitle: 'Unsere Partner profitieren von echter Fertigungskompetenz, gleichbleibender Qualität und reaktionsschnellem Support.'
  list:
    - 'Direkter Werkszugang: Arbeiten Sie direkt mit unserem Fertigungsteam — ohne Zwischenhändler. Schnellere Rückmeldungen, bessere Preise und volle Transparenz über die Produktion.'
    - 'Individuelle Anpassung: Branden Sie Ihre Produkte mit individuellen Farben, Logos, Verpackungen und Spezifikationen. Mindestbestellmengen, zugeschnitten auf Ihren Markt.'
    - 'Garantierte Qualität: ISO 9001-zertifizierte Produktion mit CE-, UKCA- und BSCI-Konformität. Jedes Produkt wird vor dem Versand getestet.'
    - 'Globale Logistik: Versand ab Qingdao, China mit FOB-, CIF- und DDP-Optionen. US-Lager in Montclair, CA für den Vertrieb in Nordamerika.'
    - 'Marketingunterstützung: Produktkataloge, Fotografie, technische Dokumentation und digitale Assets zur Unterstützung Ihrer Vertriebsaktivitäten.'
    - 'Schulung & Support: Produktschulungen für Ihr Vertriebsteam, technischer Support für Ihre Kunden und Koordination der Garantieleistungen.'
content_process:
  tagline: So werden Sie Partner
  title: 'Einfacher Partnerschaftsprozess'
  subtitle: 'Unser Partnerschaftsprozess ist unkompliziert — damit Sie schnell mit dem Verkauf von Aquafarer-Produkten starten können.'
  items:
    - title: 'Schritt 1: Bewerbung einreichen'
      description: 'Füllen Sie unser Partnerbewerbungsformular mit Ihrem Firmenprofil, Ihrem Zielmarkt und Ihren Produktinteressen aus.'
    - title: 'Schritt 2: Qualifikationsprüfung'
      description: 'Unser Partnerschaftsteam prüft Ihre Bewerbung und kontaktiert Sie innerhalb von 3 Werktagen, um Möglichkeiten zu besprechen.'
    - title: 'Schritt 3: Vereinbarung & Einrichtung'
      description: 'Unterzeichnen Sie eine Partnerschaftsvereinbarung, richten Sie Ihr Konto ein und erhalten Sie Partnerkonditionen, Marketingmaterialien und Produktmuster.'
    - title: 'Schritt 4: Schulung & Start'
      description: 'Produktschulungen, Vertriebsunterstützung und Marketingmaterialien werden bereitgestellt. Sie sind bereit für den Verkauf.'
cta:
  title: 'Bereit, Aquafarer-Partner zu werden?'
  subtitle: 'Bewerben Sie sich für die Partnerschaft und unser Team wird sich innerhalb von 3 Werktagen bei Ihnen melden.'
  actions:
    - variant: primary
      text: Partnerschaft beantragen
      href: /contact
    - text: Unsere Produkte ansehen
      href: /products
