testimonial:
  content: Ich habe 5 Boards von einem lokalen Geschäft gemietet und 60 % meines Umsatzes an sie verloren. Paddle Board Overstock half mir, meine eigene Flotte von 15 SUPs aufzubauen. Der von ihnen bereitgestellte ROI-Rechner zeigte, dass ich in 4 Monaten die Gewinnschwelle erreichen würde — tatsächlich hat es 3 Monate gedauert. Jetzt erweitere ich auf 30 Boards.
  name: Daniel Okonkwo
  title: Eigentümer, Lakeland SUP Rentals – Ontario, Kanada
content_segments:
  tagline: Mietprofile
  title: Water Sports Rental Solutions<br />Nach Betreiberart
  subtitle: Unterschiedliche Vermietungsunternehmen haben unterschiedliche Anforderungen – von kleinen SUP-Vermietungen am Strand bis hin zu großen Wassersportzentren in Resorts. Wir passen unsere Ausstattungspakete und Supportmodelle entsprechend an.
  items:
    - title: SUP-Verleih am Strand und am See
      subtitle: Operationen mit hohem Volumen und geringer Komplexität
      description: Betreiber, die Stand-up-Paddle-Boards direkt an Strandbesucher und Seenbesucher vermieten. Ihre Priorität liegt darin, die Umschlagzeiten zwischen den Vermietungen zu minimieren, die Ausrüstung im Umlauf zu halten und saisonale Nachfragespitzen mit einem kleinen Lagerplatz zu bewältigen.
      features:
        - Aufblasbare SUP-Flotten, die flach verpackt werden können — kein Steg oder Anhänger erforderlich
        - Kommerzielle PVC für 100+ Vermietungszyklen pro Saison
        - Schnelltrocknender, UV-resistenter Stoff für die gleiche Tagesbereitschaft zur Wiedervermietung
        - Farblich codierte Board-Reihen zur einfachen Flottenidentifikation
    - title: Wassersportzentren in Resorts und Hotels
      subtitle: Gästeerlebnis und Markenausrichtung
      description: Resorts und Hotels, die Wassersport als Vor-Ort-Angebot anbieten. Die Ausrüstung muss erstklassig aussehen, für Anfänger bis Fortgeschrittene zuverlässig funktionieren und sich in die bestehenden Aktivitätsbuchungs- und Abrechnungsabläufe des Resorts integrieren lassen.
      features:
        - Maßgeschneiderte SUP-Boards und Schwimmwesten in den Farben des Resorts
        - 'Gemischte Flotte: Allround-, Touring- und Art-Serie SUPs'
        - Leise, kraftstofffreie elektrische Pumpenlösungen für die Inflation am Strand
        - Mitarbeiterschulung und Einweisung in die Wartung inklusive
    - title: Boutique- & Mobile SUP-Verleih
      subtitle: Pop-up- und lieferbasierte Verleihdienste
      description: Operatoren, die die Boards direkt zum Kunden bringen — Hotelstrandlieferungen, Pop-up-Verleihstationen bei Veranstaltungen und mobile Aufbauten. Die Ausrüstung muss schnell einsatzbereit, leicht zu transportieren und auf den ersten Blick ansehnlich sein, mit flexibler Flottengröße für Veranstaltungen und saisonale Nachfrage.
      features:
        - Rucksackartiger Boardtransport — kein Anhänger erforderlich
        - Schnelle Aufblaszeit für On-Demand-Aufbau in unter 15 Minuten
        - Präsentable Ausrüstung, die auf den ersten Blick hochwertig aussieht
        - Flexible Flottengröße für Veranstaltungen und saisonale Nachfrage
    - title: Reise- und Abenteuerveranstalter
      subtitle: Geführte Ausflugsflotten
      description: Operatoren, die geführte Wassersporttouren durchführen — SUP-Safaris, Schnorchel-Ausflüge und Küstenerkundungstouren. Die Ausrüstung muss stabil genug für Anfänger-Tourgäste sein, schnell zwischen Gruppen zu reinigen und robust genug für den täglichen geführten Einsatz unter verschiedenen Wasserbedingungen.
      features:
        - Extra-stabile SUP-Plattformen (32" breit+) für Erstfahrer
        - Extra-große stabile Plattformen für Paar-/Gruppenfotos während Touren
        - Integrierte Transportkapazität für Schnorchelausrüstung, Drybags und Kühlboxen
        - Sicherheitsausrüstungspakete für gewerbliche Touren
