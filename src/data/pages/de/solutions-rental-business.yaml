testimonial:
  content: Ich habe 5 Boards von einem örtlichen Geschäft gemietet und 60 % meines Umsatzes an sie verloren. Aquafarer hat mir geholfen, meine eigene Flotte von 15 SUPs aufzubauen. Der von ihnen bereitgestellte ROI-Rechner zeigte, dass ich in 4 Monaten die Gewinnschwelle erreichen würde – tatsächlich dauerte es 3. Jetzt erweitere ich auf 30 Boards und füge Kajaks hinzu.
  name: Daniel Okonkwo
  title: Eigentümer, Lakeland SUP Rentals – Ontario, Kanada
content_segments:
  tagline: Mietprofile
  title: Wassersport-Vermietungslösungen<br />Nach Betreibertyp
  subtitle: Unterschiedliche Vermietungsunternehmen haben unterschiedliche Anforderungen – von kleinen SUP-Vermietungen am Strand bis hin zu großen Wassersportzentren in Resorts. Wir passen unsere Ausstattungspakete und Supportmodelle entsprechend an.
  items:
    - title: SUP-Verleih am Strand und am See
      subtitle: Operationen mit hohem Volumen und geringer Komplexität
      description: Betreiber vermieten Stand-Up-Paddle-Boards und Kajaks direkt an Strandbesucher und Seebesucher. Ihre Priorität besteht darin, die Bearbeitungszeit zwischen Anmietungen zu minimieren, die Ausrüstung im Wechsel zu halten und saisonale Nachfragespitzen mit einer geringen Lagerfläche zu bewältigen.
      features:
        - Aufblasbare SUP-Flotten, die flach zusammengepackt werden können — kein Steg oder Trailer erforderlich
        - PVC in kommerzieller Qualität, ausgelegt für über 100 Verleihzyklen pro Saison
        - Schnelltrocknender, UV-beständiger Stoff für sofortige Wiederbereitstellung am selben Tag
        - Farbcodierte Board-Serien zur einfachen Flottenidentifikation
    - title: Wassersportzentren in Resorts und Hotels
      subtitle: Gästeerlebnis und Markenausrichtung
      description: Resorts und Hotels, die Wassersport als Vor-Ort-Angebot anbieten. Die Ausrüstung muss erstklassig aussehen, für Anfänger bis Fortgeschrittene zuverlässig funktionieren und sich in die bestehenden Aktivitätsbuchungs- und Abrechnungsabläufe des Resorts integrieren lassen.
      features:
        - Kundenspezifisch markierte SUP-Boards und Schwimmwesten in den Farben des Resorts
        - 'Gemischte Flotte: SUPs, Kajaks, Tretboote und kleine RIB-Beiboote'
        - Leise, kraftstofffreie elektrische Pumpenlösungen zum Aufblasen am Strand
        - Schulung des Personals und Einführung in die Wartung inklusive
    - title: Boots- und RIB-Vermieter
      subtitle: Mietflotten für kommerzielle Schiffe
      description: Betreiber vermieten Motorboote – RIB-Tender, Schlauchboote und kleine Runabouts – stunden- oder halbtags. Ihre Flotte muss den Sicherheitsbestimmungen für den Seeverkehr entsprechen, der starken Nutzung durch Gäste standhalten und mechanische Ausfallzeiten zwischen Chartern minimieren.
      features:
        - RIB-Pakete mit für Außenborder von 30–90 PS geeigneten Spiegeln
        - Bootsboden-Sperrholzplatten in Marinequalität für langfristige strukturelle Integrität
        - Schnellstart-Ventilsysteme für einen schnelleren Umschlag
        - Ersatzteilkit + technischer SLA-Support auf Abruf
    - title: Reise- und Abenteuerveranstalter
      subtitle: Geführte Ausflugsflotten
      description: Veranstalter bieten geführte Wassersporttouren an – SUP-Safaris, Höhlenkajakfahrten, Schnorchelausflüge oder Insel-Hopping-RIB-Touren. Die Ausrüstung muss stabil genug für unerfahrene Tourgäste sein, zwischen Gruppen schnell zu reinigen und langlebig genug für den täglichen geführten Einsatz bei unterschiedlichen Wasserbedingungen sein.
      features:
        - Extra-stabile SUP-Plattformen (82 cm+ Breite) für Erstanwender
        - Tandem-Kajak-Optionen für Konfigurationen für Paar- und Gruppentouren
        - Integrierte Ladekapazität für Schnorchelausrüstung, Trockentaschen und Kühlboxen
        - CE- + USCG-Konformitätsdokumentation für kommerzielle Betriebe
