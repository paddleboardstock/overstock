content_challenge:
  tagline: Die Herausforderung
  title: 'Fischereiboote brauchen<br />Stabilität, Reichweite & Langlebigkeit'
  subtitle: 'Ob Sie gewerbliche Fangschiffe betreiben, eine Genossenschaftsflotte führen oder Angelcharter anbieten — Ihr Boot muss Tag für Tag zuverlässig funktionieren.'
  paragraphs:
    - 'Fischereiboote brauchen stabile Arbeitsflächen zum Führen der Leinen, Bearbeiten des Fangs und zur sicheren Bewegung an Deck. Schlauchboote und RIBs bieten durch ihre Schlauchkörperkonstruktion eine inhärente Stabilität — ein bedeutender Vorteil gegenüber starren Rümpfen gleicher Länge.'
    - 'Kraftstoffeffizienz ist überall dort entscheidend, wo Betriebskosten direkt die Rentabilität beeinflussen. RIBs und Schlauchboote sind leichter als vergleichbare starre Boote, benötigen weniger Leistung und verbrauchen weniger Treibstoff — ein entscheidender Faktor für gewerbliche Betreiber, die täglich Boote einsetzen, und für Genossenschaften, die ihre Flottenbudgets verwalten.'
    - 'Langlebigkeit in der Meeresumgebung ist unerlässlich. Salzwasser, UV-Strahlung und ständiger Einsatz verlangen Materialien, die rauen Bedingungen ohne Verschleißerscheinungen standhalten. Für gewerbliche und genossenschaftliche Betreiber wirkt sich Zuverlässigkeit direkt auf das Einkommen aus — ein defektes Boot bedeutet verlorene Fangtage.'
    - 'Die Aquafarer-Fischereikonfigurationen umfassen Rutenhalter, Echolote, Köderbecken, Livewells und Ladungslösungen, die für anspruchsvolle Fischereianwendungen im gewerblichen, genossenschaftlichen und Freizeitbetrieb entwickelt wurden.'
content_solution:
  tagline: Unsere Lösung
  title: 'Fischereitaugliche Konfigurationen'
  subtitle: 'Jedes Aquafarer-Fischereiboot lässt sich für Ihre spezifische Fischereianwendung konfigurieren.'
  list:
    - 'Rutenhalter-Montage — werkseitig installiert oder für die Nachrüstung vorbereitet'
    - 'Echolot-/GPS-Montageplatte an der Konsolenposition'
    - 'Köderbecken- oder Livewell-Optionen für Charter- und Gewerbebetreiber'
    - 'Kühlbox- und Stauraumkonfigurationen zur Handhabung des Fangs'
    - 'Deep-V-Rumpf für den Offshore-Einsatz — stabil im Stillstand, ruhig bei Fahrt'
    - 'PVC- oder Hypalon-Schlauchoptionen — Hypalon für lang anhaltende UV-Belastung'
    - 'Außenbordmotoren von 15 PS bis 115 PS, je nach Modell und Einsatzgebiet'
content_segments:
  tagline: Fischerei-Profile
  title: 'Schlauchbootlösungen für die Fischerei<br />Nach Betreibertyp'
  subtitle: 'Vom küstennahen Sportangeln bis zur gewerblichen Langleinenfischerei — verschiedene Fischereibetriebe erfordern unterschiedliche Rumpfkonfigurationen, Leistungsbereiche und Deckausstattungen. Wir passen jedes Boot an das Fanggebiet, die Gewässer und den Arbeitsstil an.'
  items:
    - title: Gewerbliche Fischereiunternehmen
      subtitle: 'Arbeitsboote für die Flotte: täglicher Fangbetrieb, Netzarbeit, Fangtransport'
      description: 'Gewerbliche Fischereiunternehmen setzen Arbeitsboote zum Ausbringen und Einholen der Netze, zur Bedienung von Reusen, zum Langleinenfischen und zum Fangtransport ein. Diese Boote arbeiten täglich im Salzwasser und müssen schweren Lasten, ständiger Deckarbeit und langen Betriebszeiten standhalten. Kraftstoffeffizienz und geringer Wartungsaufwand sind entscheidend für die Rentabilität der Flotte. Das Boot muss der Besatzung auch bei wechselnden Seegangsbedingungen stabile Arbeitsflächen für den Umgang mit Ausrüstung und Fang bieten.'
      features:
        - 'Flaches Deck für Netzarbeit, Reusen-Stapelung und Fischlagerung'
        - 'Spritsparender 40-115 PS Außenbordmotor für geringe tägliche Betriebskosten'
        - 'Robuste Hypalon-Schläuche für Abriebfestigkeit im täglichen Einsatz'
        - 'Verstärkte Scheuerleisten für häufigen Kontakt mit Kai und Schiff'
        - 'Selbstlenzendes Deck für einfaches Abspülen nach dem Einsatz'
        - 'Flottenkonditionen und einheitliche Spezifikationen für Mehrbootbetreiber'
    - title: Charter-Angelbetreiber
      subtitle: 'Komfort für mehrere Passagiere, Fanghandling, sicherheitszertifiziert'
      description: 'Betreiber von Halb- und Ganztages-Angelcharter — vom küstennahen Riffangeln bis zum Offshore-Grundangeln. Ihr Boot braucht Sitzplätze mit Sicherheitszertifizierung, reichlich Deckfläche für mehrere Angler und integrierte Livewells, um Köder und Fang während des gesamten Ausflugs frisch zu halten. Der Komfort der Gäste wirkt sich direkt auf Bewertungen, Wiederbuchungen und Online-Ratings aus.'
      features:
        - 'Konsolensteuerung mit stoßdämpfenden Schalensitzen'
        - 'Werkseitig installierte Rutenhalter (4–8 Positionen)'
        - '60–115 PS Außenbordmotor für Offshore-Reisegeschwindigkeiten'
        - 'CE-Zertifizierung der Kategorie C oder B für gewerblichen Passagierbetrieb'
        - 'Bimini- oder T-Top-Sonnenschutz für den Komfort der Gäste auf längeren Ausflügen'
    - title: Handwerkliche & Kleinbetriebliche Fischerei
      subtitle: Zuverlässige Arbeitsboote für den täglichen Lebensunterhalt
      description: 'Unabhängige Fischer, deren Boot ihre Haupteinkommensquelle ist — Netze auslegen, Reusen kontrollieren oder in Küstennähe handangeln. Ihre Prioritäten sind Kraftstoffersparnis, einfache Wartung in Eigenregie und ein Boot, das mäßige Lasten an Fang und Ausrüstung ohne Stabilitätsverlust verkraftet.'
      features:
        - 'Spritsparender 15–40 PS Außenbordmotor für geringe Betriebskosten'
        - 'Hypalon-CSM-Schläuche für erhöhte UV- und Abriebbeständigkeit'
        - 'Flaches Deck für Netzarbeit und Fischlagerung'
        - 'Einfache Strandlandung dank integriertem aufblasbaren Kielschutz'
    - title: Fischereigenossenschaften
      subtitle: 'Fangsammlung, Mitgliedertransport, Versorgungslogistik'
      description: 'Fischereigenossenschaften betreiben gemeinschaftliche Flotten, um den Fang der Mitgliedsfischer einzusammeln, abgelegene Fanggemeinschaften zu versorgen und die Ernte zu den Märkten zu transportieren. Diese Arbeitsboote brauchen eine hohe Nutzlastkapazität, zuverlässigen Tagesbetrieb und einfache Wartung an abgelegenen Standorten. Genossenschaften arbeiten häufig in Entwicklungsregionen, in denen Ersatzteilversorgung und Servicezugang begrenzt sind — einfache Außenbordkonfigurationen und robuste Bauweise sind daher unerlässlich.'
      features:
        - 'Hohe Nutzlastkapazität für den Transport von Fang und Versorgungsgütern'
        - 'Einfache Außenbordkonfiguration für problemlosen Vor-Ort-Service'
        - 'Robuste PVC- oder Hypalon-Bauweise für flexible Budgets'
        - 'Flaches Deck mit Verzurrpunkten zur Ladungssicherung'
        - 'Spritsparender Betrieb zur Minimierung der Genossenschaftskosten'
    - title: Sport- & Großfischangler
      subtitle: Leistung und Stil für ambitionierte Angler
      description: 'Erfahrene Angler, die eine leistungsfähige Fangplattform suchen: Schnelligkeit zu entfernten Fanggründen, stabile Positionen zum Drillen im Stehen und erstklassige Verarbeitung. Das Boot muss sich zu Hause fühlen, ob es zwei Meilen vor der Küste zum Riff fährt oder abgelegene Ästuar-Rückgewässer erkundet.'
      features:
        - 'Deep-V-RIB-Rumpf für ruhige Fahrt bei Kabbelsee'
        - 'Echolot-/GPS-Montageplatte, vorkonfektioniert an der Konsole'
        - 'Baitwell und Kühlbox integriert in das hintere Sitzmodul'
        - 'Individuelle EVA-Deckfarben passend zur Boots- und Schlauchgrafik'
    - title: Angelguides & Ökotourismus-Anbieter
      subtitle: Geführte Angelausflüge für reisende Angler
      description: 'Guides, die kleine Gruppen reisender Angler zu ergiebigen Fangplätzen bringen — oft kombiniert mit Ökotourismus-Elementen wie Vogelbeobachtung oder Mangroven-Erkundung. Das Boot muss trocken und komfortabel fahren, auch für Gäste, die kleine Boote nicht gewohnt sind, mit einfachem Einstieg und Sonnenschutzoptionen.'
      features:
        - 'Bimini- oder T-Top-Befestigungspunkte, werkseitig installiert'
        - 'Gleitende Einstiegsleiter für einfaches Wiederanbordgehen'
        - 'Leiser 4-Takt-Außenbordmotor zur Minimierung von Störungen'
        - 'Trockene Staufächer für Handys, Brieftaschen und Kameras der Gäste'

