hero:
  tagline: Paddle Board Overstock Akademie
  title: Lernzentrum
  subtitle: Anleitungen und Tutorials für jedes Fähigkeitsniveau — von SUP Grundlagen bis zu fortgeschrittenen Rettungstechniken
categories:
  - level: Anfänger
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Grundlagen
        desc: Lernen Sie die Grundlagen des Stand-Up-Paddleboardings — Stand, Schlagtechnik und Gleichgewicht.
        slug: beginner-sup-guide
      - title: Paddeltechniken
        desc: Vorwärtsschlag, Sweep-Schlag, Ziehschlag und Niedrigstütze — beherrschen Sie die wesentlichen Paddelbewegungen.
        slug: sup-paddle-guide
      - title: Sicherheit zuerst
        desc: Wichtige Sicherheitspraktiken einschließlich Wetterüberprüfungen, PFD Verwendung, Leash-Regeln und Selbstrettung.
        slug: sup-safety-guide
  - level: Mittelstufe
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Touring-Essentials
        desc: Planung mehrstündiger Paddeltouren — Navigation, Hydratation, Tempoeinteilung und das Lesen von Windvorhersagen.
        slug: touring-sup-guide
      - title: Wetterlesen
        desc: Meeresvorhersagen interpretieren, Wolkenmuster erkennen und die Auswirkungen von Wind auf das Wasser verstehen.
        slug: weather-planning-water-sports
      - title: Navigation Grundlagen
        desc: Kartenlesen, Kompassnutzung, GPS-Wegpunkte und Routenplanung für Küstenpaddeln.
        slug: sup-navigation-guide
      - title: Gezeitenbewusstsein
        desc: Verständnis von Gezeitenzyklen, Strömungen und wie sie den Startzeitpunkt und die Routenwahl beeinflussen.
        slug: understanding-tides
  - level: Fortgeschritten
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planung von Mehrtagestouren
        desc: Expeditionslogistik — Ausrüstungswahl, Essensplanung, Sicherheitsprotokolle und Notfallkontakte.
        slug: sup-travel-guide
      - title: Rettungstechniken
        desc: Selbstrettung, T-Rettung und Schleppprotokolle für offenes Wasser.
        slug: sup-self-rescue
      - title: Nächtliches Paddeln
        desc: Navigation nach Einbruch der Dunkelheit — Beleuchtungsvorschriften, Routenwissen, Gruppenkommunikation und Gefahrenbewusstsein.
        slug: sup-navigation-guide
  - level: Wartung
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Reinigung & Pflege
        desc: Süßwasserspülung, UV Schutz, Schimmelprävention und richtige Trocknungstechniken nach jeder Session.
        slug: inflatable-sup-maintenance
      - title: Aufbewahrungsleitfaden
        desc: Beste Praktiken für die Lagerung von aufblasbaren Boards — Entleeren, Falten, Temperaturkontrolle und Haltbarkeit.
        slug: inflatable-sup-storage
      - title: Reparaturgrundlagen
        desc: Kleine Einstiche, Nahtlecks und Ventilprobleme mit PVC Reparatursets und Reparaturtechniken beheben.
        slug: inflatable-sup-repair
      - title: Ventilwartung
        desc: Ventiltypen identifizieren (Halkey-Roberts, Boston, Leafield), Schmutz entfernen und defekte Ventilstängel austauschen.
        slug: inflatable-sup-repair
knowledge_center_tagline: Wissenszentrum
knowledge_center_title: Paddle-Board-Guides & Wissen
knowledge_center_subtitle: Experten-Guides und Kaufberatung für Paddleboarder aller Leistungsstufen.
knowledge_sections:
  - title: Board-Technologie & Konstruktion
    tagline: Im Inneren Ihres Paddleboards
    desc: Wie aufblasbare Paddleboards gebaut werden — drop-stitch Kerne, Laminatschichten, EVA Decks und Werksdrucktests.
    guides:
      - title: Wie Paddleboards hergestellt werden
        desc: Vom Zuschneiden der Materialien und Laminieren bis hin zu 100% Drucktests — sehen Sie, wie jedes Board die Fabrik verlässt.
        href: /factory/process
      - title: Drop-Stitch Kerntechnologie
        desc: Wie Tausende von inneren Fäden eine starre, hochdruckfähige aufblasbare Struktur erzeugen.
        href: /learn/drop-stitch-core
      - title: Materialreferenz
        desc: PVC Denier-Werte, Stoffgewichte, UV Beständigkeit und Deckmaterialien erklärt.
        href: /learn/materials
      - title: Technologie von aufblasbaren Boards
        desc: Geschweißte Nähte, Rail-Konstruktion und Ventilsysteme, die Ihr Board steif und luftdicht halten.
        href: /learn/inflatable-technology
  - title: Kauf-Guides
    tagline: Die richtige Wahl des Boards
    desc: Alles, was Sie brauchen, um Ihr erstes — oder nächstes — aufblasbares SUP auszuwählen, von Größe bis Konstruktion.
    guides:
      - title: Wie man ein aufblasbares SUP auswählt
        desc: Die wichtigsten Faktoren — Konstruktion, Dicke, Finne-Setup und enthaltenes Zubehör.
        href: /guides/how-to-choose-your-sup/
      - title: Was ist Stand-Up-Paddleboarding?
        desc: Eine freundliche Einführung in den Sport, die Ausrüstung und warum aufblasbare Boards den Einstieg erleichtern.
        href: /guides/what-is-sup
      - title: Aufblasbar vs. Hardboard
        desc: Vergleichen Sie i SUPs und feste Epoxy-Boards hinsichtlich Tragbarkeit, Haltbarkeit, Leistung und Preis-Leistungs-Verhältnis.
        href: /compare/inflatable-vs-hardboard
      - title: SUP Größenratgeber
        desc: Finden Sie die richtige Boardlänge, -breite und -volumen für Ihr Gewicht, Ihre Fähigkeiten und Ihren Paddelstil.
        href: /size-guide
  - title: Fähigkeiten & Sicherheit
    tagline: Mit Vertrauen paddeln
    desc: Praktisches Wissen für jede Sitzung — Grundlagen für Anfänger, Wassersicherheit, Pflege und Reparatur.
    guides:
      - title: SUP Grundlagen — Leitfaden für Anfänger
        desc: Alles, was ein Anfänger wissen muss — Bordtypen, Paddelgrößen, Standhaltung und Tipps für den ersten Tag.
        href: /v2/beginner-sup-guide
      - title: Wassersicherheitsgrunde
        desc: Wetterkontrollen, PFD Auswahl, Leash-Regeln, Selbstrettung und bewährte Praktiken beim Paddeln in der Gruppe.
        href: /learn/water-safety
      - title: SUP Wartung & Pflege
        desc: Reinigung, Lagerung, UV Schutz und Pflegetipps für aufblasbare SUP Boards.
        href: /v2/inflatable-sup-maintenance
      - title: Grundlagen der Bordreparatur
        desc: Kleine Einstiche, Nahtlecks und Ventilprobleme mit PVC Reparatursets und Reparaturtechniken beheben.
        href: /v2/inflatable-sup-repair
