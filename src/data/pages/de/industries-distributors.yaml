hero:
  tagline: Wassersport-Distributoren & Großhandel
  title: 'Großhandelspartnerschaft<br />für Wassersport-Distributoren'
  subtitle: 'Werden Sie Paddle Board Overstock-Distributionspartner. Erhalten Sie Zugang zu unserem vollständigen Produktkatalog, exklusiven Großhandelspreisen, Dropshipping-Support und persönlicher Betreuung.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock-Werk und Großhandelsvertrieb

direct_answer: 'Paddle Board Overstock bietet umfassende Großhandelspartnerschaften für Wassersport-Distributoren weltweit. Partner erhalten Großhandelspreise auf den gesamten Produktkatalog, persönliche Betreuung, Marketingmaterial und Logistikunterstützung. Wir bieten Dropshipping-Funktionen, Private Labeling und flexible Mindestbestellmengen, die zu Ihrem Geschäftsmodell passen.'

solution_offerings:
  - title: Distributor Starter
    subtitle: Für neue Partnerschaften und regionale Distributoren
    badge: Popular
    features:
      - title: Vollständiger Katalogzugang
        description: Großhandelspreise für alle SUP-Boards, Kayaks, RIBs und Zubehör
      - title: Persönlicher Ansprechpartner
        description: Eine zentrale Kontaktperson für Bestellungen, Support und Produktinformationen
      - title: Marketingmaterial
        description: Produktfotos, Datenblätter, Broschüren und digitale Assets in Ihrer Sprache
      - title: Logistikunterstützung
        description: Versandkoordination, Zolldokumente und Lieferung an Ihr Lager
      - title: Sample-Programm
        description: Vergünstigte Musterbestellungen für Showroom-Exponate und Händler-Demonstrationen
    cta_text: Partnerschaft beantragen
    cta_href: '/contact'

  - title: Distributor Premium
    subtitle: Für etablierte Distributoren mit länderübergreifender Abdeckung
    badge: Best Value
    features:
      - title: Staffelpreise
        description: Mengenbasierte Preistufen mit quartalsweisen Rückvergütungsprogrammen
      - title: Exklusives Vertriebsgebiet
        description: Geschützte Vertriebsrechte für Ihre Region oder Ihr Land
      - title: Dropshipping-Programm
        description: Direktversand an Ihre Kunden aus unseren Lagern mit Ihrem Branding
      - title: Private Labeling
        description: Vollständige OEM/ODM-Unterstützung für Ihre eigene Marke – Boards, Boote und Zubehör
      - title: Priority-Support
        description: 48-Stunden-Reaktionsgarantie, dedizierter Logistikkoordinator und Expressbestellungen
    cta_text: Partnerschaft erweitern
    cta_href: '/contact'

  - title: Master Distributor
    subtitle: Für große regionale und nationale Distributoren
    badge: Enterprise
    features:
      - title: Strategische Partnerschaft
        description: Gemeinsame Geschäftsplanung, Marktentwicklungsfonds und Co-Marketing-Programme
      - title: Individuelle Produktentwicklung
        description: Exklusive Produktdesigns und Spezifikationen für Ihren Markt
      - title: Unterstützung bei lokalem Lager
        description: Kommissionslager, lokale Ersatzteilbestände und Aufbau regionaler Servicecenter
      - title: Händlernetz-Support
        description: Schulungsprogramme, Zertifizierungskurse und Integration einer Händlersuche
      - title: Jährlicher Partner-Gipfel
        description: Strategiemeetings, Produktvorschauen und Netzwerkarbeit mit globalen Partnern
    cta_text: Master-Partnerschaft erkunden
    cta_href: '/contact'

benefits:
  - title: Direkter Herstellerzugang
    description: Keine Zwischenhändler. Sie arbeiten direkt mit dem Werk, das jedes Produkt entwickelt, konstruiert und produziert.
    icon: tabler:building-factory
  - title: Wettbewerbsfähige Margen
    description: Großhandelspreise mit Mengenrabatten, Rückvergütungsprogrammen und geschützten Vertriebsgebieten.
    icon: tabler:coin
  - title: Marketing-Support
    description: Professionelle Produkt-Assets, lokalisierte Broschüren und Co-Branding-Marketingkampagnen.
    icon: tabler:chart-bar
  - title: Logistik-Partnerschaft
    description: Koordinierter Versand, Zollsupport und lokale Lageroptionen zur Senkung Ihrer Logistikkosten.
    icon: tabler:truck-delivery

content_segments:
  tagline: Partnerprofile
  title: 'Distributionspartnerschafts-Modelle<br />nach Partnertyp'
  subtitle: 'Verschiedene Distributoren bringen verschiedene Markstärken mit – regionale Infrastruktur, E-Commerce-Reichweite, Fachhandel oder Multibrand-Portfolios. Wir strukturieren Partnerschaftsbedingungen, Preisstufen und Support-Level passend zu jedem Partnerprofil.'
  items:
    - title: Regionale Marine-Distributoren
      subtitle: Gebietsexklusive B2B-Distribution
      description: 'Etablierte Distributoren mit Lagerinfrastruktur, Händlernetzen und Logistikkapazitäten, die Marinehändler, Wassersport-Einzelhändler und Verleihbetreiber in einem definierten geografischen Gebiet bedienen. Sie benötigen eine vollständige Produktlinie, geschützte Preise und die Fähigkeit, Händlerkonten mit lokalem Lagerbestand und Support zu bedienen.'
      features:
        - 'Exklusiver Gebietsschutz mit Mindestverpflichtungen'
        - 'Großhandelspreise für den Gesamtkatalog mit quartalsweisen Mengenrückvergütungen'
        - 'Kommissionslager-Programm für schnell drehende SKUs'
        - 'Händlerschulung und Co-Branding-Marketingprogramme'
    - title: E-Commerce- und Online-Händler
      subtitle: Digital-first Vertriebskanäle
      description: 'Online-Händler, die Wassersportausrüstung über Amazon, eBay oder eigene E-Commerce-Plattformen verkaufen. Time-to-Market, wettbewerbsfähige Preise und Direktlogistik an Verbraucher sind entscheidend. Sie benötigen einen Partner, der Einzelbestellungen unter Ihrer Marke mit schneller Abwicklung und ohne Lagerkostenrisiko per Dropshipping versendet.'
      features:
        - 'Dropshipping-Programm: Werksdirekte Abwicklung mit Ihrem Branding'
        - 'Echtzeit-Bestands-API-Feed für Ihre E-Commerce-Plattform'
        - 'Amazon Seller Central Integration mit EAN/UPC-Support'
        - 'Retourenlogistik und Garantieabwicklung inklusive'
    - title: Fachhändler für Wassersport
      subtitle: Stationäre Showroom-Partner
      description: 'Physische Einzelhandelsgeschäfte, die auf Wassersportausrüstung spezialisiert sind – sie bedienen lokale Paddler, Angler und Bootfahrer mit persönlicher Beratung, Demonstrationen und After-Sales-Service. Sie benötigen einzelhandelsoptimierte Verpackungen, Demo-Einheiten-Programme und Point-of-Sale-Material, das Laufkundschaft überzeugt.'
      features:
        - 'Demo-Einheiten-Programm: Vergünstigte Showroom-Exponate'
        - 'Einzelhandelstaugliche Verpackung mit regaloptimierter Kartongestaltung'
        - 'Point-of-Sale-Displays, Vergleichstabellen und Käuferleitfäden'
        - 'Schulung und Zertifizierungsprogramm für Vertriebspersonal'
    - title: Multibrand- und Warenhaus-Distributoren
      subtitle: Breitassortierte Sportartikel-Distribution
      description: 'Große Distributoren, die Warenhäuser, großflächige Einzelhändler und Sportartikelketten mit Multibrand-Katalogen beliefern. Konsistenz, Konformitätsdokumentation und Lieferantencompliance haben oberste Priorität – jede SKU muss die händlerspezifischen Anforderungen an Verpackung, Kennzeichnung und Qualität erfüllen.'
      features:
        - 'Compliance-Dokumentation für Händler: Verpackungsspezifikation, Barcode, Kennzeichnung'
        - 'EDI/ASN-Integration für Bestellsysteme großer Händler'
        - 'Lieferantengesteuerte Bestände und automatische Nachbestellprogramme'
        - 'Persönliche Betreuung mit 24-Stunden-Reaktions-SLA'

