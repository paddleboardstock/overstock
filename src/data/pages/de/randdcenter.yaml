pillars:
  - title: Technologischer Fortschritt
    desc: Pionierarbeit bei neuen Materialien, Designs und Fertigungsprozessen für überlegene Produktleistung und Langlebigkeit.
    icon: tech
  - title: Fortschrittliche Materialien
    desc: Erforschung modernster PVC-, Hypalon-, Verbundwerkstoffe und nachhaltiger Alternativen für verbesserte Produkteigenschaften.
