hero:
  tagline: F&E-Zentrum
  title: F & E Zentrum
  subtitle: Fokussiert auf Fortschritt

intro:
  - Das Forschungs- und Entwicklungszentrum (F&E) von Aquafarer ist die treibende Kraft hinter unserer Mission, die Wassersportausrüstung zu revolutionieren. Wir befähigen Wassersportler weltweit mit sichereren, komfortableren und angenehmeren Produkten durch unermüdliche Innovation bei aufblasbaren Stand-Up-Paddle-Boards (SUPs) und Booten. Unser engagiertes Team aus Ingenieuren, Designern und leidenschaftlichen Wassersportexperten gestaltet die Zukunft der Branche und hebt die Messlatte für Qualität, Leistung und Nachhaltigkeit kontinuierlich an.
  - Unsere F&E-Einrichtung vereint Materialwissenschaftler, Schiffsarchitekten und Produktionsingenieure unter einem Dach. Von der Stoffformulierung und Rumpfsimulation bis zur Schweißprozessentwicklung und großtechnischen Seeproben — jede Phase der Produktentwicklung wird von Daten gesteuert und durch Tests validiert.

mission:
