rd_services:
  tagline: Kundenspezifische F&E
  title: F&E-Dienstleistungen für Partner
  services:
    - title: Individuelle Materialentwicklung
      desc: Wir entwickeln kundenspezifische Stoffformulierungen, Laminataufbauten und Klebstoffsysteme, die auf Ihre Betriebsumgebung und Leistungsziele zugeschnitten sind.
    - title: OEM-/ODM-Produktentwicklung
      desc: Von Konzeptskizzen bis zu produktionsreifen technischen Paketen — unser Team kann Boote unter Ihrer Marke entwerfen, prototypisieren und validieren.
    - title: Drittanbieterprüfung & Zertifizierung
      desc: Nutzen Sie unsere ISO-konformen Prüfeinrichtungen für unabhängige Materialtests, Produktvalidierung und Zertifizierungsunterstützung.
  cta: Besprechen Sie Ihre F&E-Anforderungen →
  cta_link: /contact

vision:
  tagline: Unsere Vision
  title: Die Zukunft des Wassersports prägen
  body: Aquafarer strebt danach, die Schlauchboot- und SUP-Branche durch kontinuierliche Innovation, unerschütterliche Qualität und ein standhaftes Engagement für Sicherheit und Nachhaltigkeit anzuführen — und letztlich die Erlebnisse von Wassersportlern weltweit zu bereichern. Das Aquafarer F&E-Zentrum ist der Ort, an dem Leidenschaft auf Innovation trifft und neue Standards für die Wassersportbranche setzt.

labs_section:
  tagline: Labore
  title: Unsere Labore
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC-Stofflabor
      description: Kontinuierliche Forschung und Prüfung von PVC- und Hypalon-Schlauchgeweben auf Zugfestigkeit, UV-Beständigkeit, Abrieb und Tieftemperaturflexibilität zur Gewährleistung langfristiger Zuverlässigkeit in Meeresumgebungen.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Rumpftechnik-Studio
      description: CAD-gestütztes Design und Finite-Elemente-Analyse von HDPE-, Aluminium- und GFK-Rümpfen. Jeder Rumpf wird vor dem Bau des ersten Prototyps digital auf Spannungsverteilung und Schlagfestigkeit simuliert.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: HF-Schweißzentrum
      description: Spezielle Hochfrequenz-Schweißeinrichtung mit präziser Temperatur- und Druckkontrolle, die hochfeste, luftdichte Nähte herstellt, die die ISO-6185-Standards für aufblasbare Wasserfahrzeuge übertreffen.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Hydrodynamischer Prüftank
      description: Modellversuche in unserem hauseigenen Prüftank zur Optimierung der Rumpfform, Gleitleistung, Stabilität und Kraftstoffeffizienz bei verschiedenen Last- und Seebedingungen.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototypenwerkstatt
      description: Einrichtung für großtechnisches Prototyping und Rigging, in der neue Modelle gebaut, ausgerüstet und seeerprobt werden. Jeder Prototyp durchläuft vor der Produktionsfreigabe ein Mindestprogramm von 20 Stunden Wassertests.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Qualitäts- & Inspektionslabor
      description: Spezielles Qualitätssicherungslabor für Zugfestigkeitsprüfungen, Luftdichtheitszyklen, Nahtschältests und Materialzertifizierung, um sicherzustellen, dass jedes die Werkstatt verlassende Boot unseren veröffentlichten Spezifikationen entspricht.
      href: /randdcenter/quality-inspection-lab
