capabilities:
  tagline: Fähigkeiten
  title: F&E-Fähigkeiten
  subtitle: Vier Kerndisziplinen, die uns eine durchgängige Kontrolle über die Produktentwicklung geben — von der Rohmaterialforschung bis zur Endzertifizierung.
  groups:
    - title: Materialwissenschaft & Gewebetechnologie
      items:
        - Analyse und Optimierung von PVC- und Hypalon-Formulierungen
        - UV-Stabilisierung, Flammschutz und Entwicklung antimikrobieller Additive
        - Mehrschicht-Gewebelaminierung und Haftungstechnik
        - Beschleunigte Alterungsprüfung (UV, thermisch, Feuchte, Salzsprühnebel)
    - title: Rumpftechnik & Hydrodynamik
      items:
        - Parametrisches 3D-Rumpfdesign und CFD-Optimierung
        - Finite-Elemente-Analyse für Struktur- und Stoßbelastungen
        - Modell-Schleppversuche und Leistungsvalidierung
        - Individuelle Rumpfentwicklung für spezielle Einsatzprofile
    - title: Schweiß- & Fügetechnologie
      items:
        - HF-Dielektrikumsschweißprozessentwicklung und -optimierung
        - Heißluft-, Heizkeil- und Ultraschallschweißverfahren
        - Klebeverbindungen und Nahtbandqualifizierung
        - Schweißnahtfestigkeitsmodellierung und Lebensdauervorhersage
    - title: Prüfung, Zertifizierung & Konformität
      items:
        - -, - und CE-Konformitätsprüfungen
        - Unabhängige Drittanbieterprüfung und Zertifizierungsunterstützung
        - Entwicklung kundenspezifischer Prüfprotokolle für die Beschaffungsqualifizierung
        - Schadensanalyse während des Betriebs und Ursachenermittlung

