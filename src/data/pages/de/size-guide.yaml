hero:
  title: Größen- und Spezifikationsanleitung
  subtitle: Abmessungen, Kapazitäten und empfohlene Verwendungszwecke für jedes Paddle Board Overstock-Produkt.
categories:
  SUP: Aufblasbare SUP-Boards, die für Tragbarkeit entwickelt wurden, ohne Leistungseinbußen. Wählen Sie die richtige Größe entsprechend Ihrem Gewicht und Ihrem Paddelstil.
  ACCESSORY: Zubehör und Sets, die Ihr Board ergänzen. Universelle Größen mit mehreren Optionen.
