how_to_choose:
  title: Wie man die richtige Größe wählt
  cards:
    - title: Allround SUP Bretter
      description: Unsere ~11 ft Allround-Boards (32" breit, 6 Zoll drop-stitch) bieten ein Gleichgewicht zwischen Stabilität, Geschwindigkeit und Kapazität. Stimmen Sie das Boardvolumen auf Ihr Gewicht ab – schwerere Paddler benötigen mehr Volumen.
    - title: Breite & Dicke
      description: Breitere Boards (32"+) bieten mehr Stabilität für Anfänger, Yoga und Angeln. 6-Zoll-Dicke bei 15 PSI hält das Deck unter Fahrer und Ausrüstung steif.
    - title: Pakete & Zubehör
      description: Jedes Board wird als komplettes Paket geliefert – Board, Reiserucksack, Handpumpe, verstellbares Paddel, abnehmbare Finne, Spiral-Leash und Reparaturset. Überprüfen Sie die maximale Belastung für Fahrer plus Ausrüstung.
