tests:
  - title: Druckprüfung
    description: Aufblasbare Kammern werden über längere Zeiträume Drücken ausgesetzt, die über den empfohlenen Betriebsgrenzen liegen. Dies überprüft die Luftdichtheit und strukturelle Integrität des Materials und der Nähte und stellt sicher, dass das Produkt dem vorgesehenen Gebrauch und möglicher Überdruck standhält, ohne zu versagen oder undicht zu werden.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
    standard: ISO 6185-1 | Interne Spezifikation AF-PT-001
  - title: Aufprallprüfung
    description: Produkte werden kontrollierten Stößen mit verschiedenen Gewichten und Winkeln ausgesetzt. Dies bewertet die Widerstandsfähigkeit des Materials gegen Durchstiche, Risse und Schäden durch Kollisionen mit Hindernissen im Wasser und demonstriert Haltbarkeit und Langlebigkeit.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    standard: Interne Spezifikation AF-IT-002
  - title: UV-Beständigkeitsprüfung
    description: Endprodukte werden über längere Zeiträume simuliertem Sonnenlicht ausgesetzt, um die Beständigkeit des Materials gegen Abbau, Ausbleichen und Schwächung durch längere UV-Einstrahlung zu bewerten — kritisch für Boote, die in tropischen und sonnenreichen Umgebungen eingesetzt werden.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
    standard: ASTM G154 | ISO 4892-3
  - title: Abriebfestigkeitsprüfung
    description: Materialproben werden unter kontrolliertem Druck für eine bestimmte Anzahl von Zyklen gegen abrasive Oberflächen gerieben. Dies misst die Fähigkeit des Materials, Verschleiß durch wiederholten Gebrauch, Kontakt mit Sand, Steinen oder anderen Oberflächen zu widerstehen und gewährleistet langfristige Haltbarkeit.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
    standard: ASTM D751 (Taber) | ISO 5470-1
  - title: Tieftemperaturprüfung
    description: Produkte werden in kalten Umgebungen getestet, um Funktionalität und Haltbarkeit unter verschiedenen Temperaturbedingungen zu bewerten und Sprödigkeit oder Rissbildung in kälteren Gewässern zu verhindern. Unverzichtbar für Boote, die für den Winter- oder Hochbreiteneinsatz bestimmt sind.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
    standard: Interne Spezifikation AF-LT-003 | MIL-STD-810G
  - title: Auftriebs- & Lastkapazitätsprüfung
    description: Produkte werden mit verschiedenen Gewichten getestet, um ihre maximale Tragfähigkeit zu bestimmen und sicherzustellen, dass sie Benutzer und Ausrüstung sicher tragen. Die Nennkapazität jedes Modells wird vor der Freigabe überprüft.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
    standard: ISO 6185-1 | ISO 12402
  - title: Manövrierfähigkeitsprüfung
    description: Produkte werden auf ihr Ansprechverhalten auf Paddel- oder Motoreingaben getestet, wobei der Wenderadius und die Handhabungsfreundlichkeit bewertet werden. Erprobungen auf dem Wasser bestätigen, dass das tatsächliche Fahrverhalten den Konstruktionsspezifikationen entspricht.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    standard: Interne Spezifikation AF-MT-004
  - title: Wasserdichtigkeitsprüfung
    description: Vollständig montierte Produkte werden eingetaucht oder Wasserstrahlen ausgesetzt, um Undichtigkeiten an Nähten, Ventilen oder Materialien zu prüfen. Jedes Boot durchläuft vor dem Versand eine obligatorische Wasserdichtigkeitskontrolle.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
    standard: ISO 6185-1 §7.3 | Interne Spezifikation AF-WT-005
