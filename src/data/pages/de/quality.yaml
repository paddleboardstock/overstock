tldr:
  summary: Paddle Board Overstock betreibt ein 8-Protokoll-Qualitätstestprogramm, das Druck, Aufprall, UV, Abrieb, Tieftemperatur, Auftrieb, Manövrierfähigkeit und Wasserdichtigkeit abdeckt. 99,3 % fehlerfreie Rate bei Sendungen der letzten 12 Monate.
  points:
    - '8 Testprotokolle: Druck, Aufprall, UV, Abrieb, Tieftemperatur, Auftrieb, Manövrierfähigkeit und Wasserdichtigkeit'
    - 99,3 % fehlerfreie Quote bei den Lieferungen der letzten 12 Monate
    - Jede Einheit wird 24–48 Stunden bei 1,25-fachem Nennwertdruck mit maximal 5 % Toleranzabfall gehalten
    - UV beschleunigte Wetterbeständigkeit (1.000+ Stunden) und Prüfungen der Abriebfestigkeit von Beschichtungen
testing_note: Jeder Test folgt dokumentierten internen Protokollen. Die Testergebnisse werden aufgezeichnet, sind nachvollziehbar und werden von unserem unabhängigen Qualitätslabor überprüft.
