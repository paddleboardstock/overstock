tests:
  - title: Druckprüfung
    standard: Interne Spezifikation AF-PT-001
    description: Aufblasbare Kammern werden auf das 1,25-fache des empfohlenen Betriebsdrucks aufgepumpt und 30 Minuten lang gehalten. Druckverlust wird gemessen, um die Luftdichtheit und die strukturelle Integrität von Materialien und Nähten zu überprüfen.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Aufpralltests
    standard: Interne Spezifikation AF-IT-002
    description: Produkte werden kontrollierten Aufprallen mit standardisierten Fallgewichten und Pendelapparaturen ausgesetzt. Dies bewertet die Durchstoßfestigkeit, die Rissausbreitung und die strukturelle Widerstandsfähigkeit gegen Kollisionen mit Hindernissen, Stegen und Trümmern.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Widerstandstests
    standard: Internes Testprotokoll
    description: Materialproben werden in beschleunigten Witterungskammern 1.000+ Stunden lang UVA-340-Lampen ausgesetzt. Wir messen Farbänderung (Delta E), Glanzbeständigkeit und Zugfestigkeitsverlust, um UV Stabilisator-Pakete zu validieren.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Abriebfestigkeitstests
    standard: Internes Testprotokoll
    description: Materialproben werden CS-10 Schleifscheiben unter 500g/1.000g Lasten für 1.000 Zyklen ausgesetzt. Massenverlust und visuelle Verschleißbewertung bestimmen die Beständigkeit der Beschichtung gegen Sand, Kies und wiederholtes Starten.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Leistungstests bei niedrigen Temperaturen
    standard: Interne Spezifikation AF-LT-003
    description: Zusammengebaute Produkte und Materialcoupons werden 24 Stunden lang bei -20°C, -10°C und 0°C konditioniert und anschließend flexibel getestet. Wir überprüfen, dass das PVC flexibel bleibt, ohne Risse oder Delamination.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Auftriebs- und Lastkapazitätstests
    standard: Internes Testprotokoll
    description: Produkte werden schrittweise auf eine 1,25-fache der Nennkapazität in einem kontrollierten Pool geladen. Freibord, Stabilität und selbstentwässernde Leistung werden erfasst. Die angegebene Kapazität jedes Modells wird mathematisch und empirisch überprüft.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-2.webp
  - title: Manövriertests
    standard: Interne Spezifikation AF-MT-004
    description: Tests auf dem Wasser messen Wenderadius, Beschleunigung, Planzeit und Paddel-/Motorreaktion unter verschiedenen Lastbedingungen. Die realen Handhabungseigenschaften werden anhand der Konstruktionsziele validiert.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Wasserdichtkeitsprüfung
    standard: Interne Spezifikation AF-WT-005
    description: Jedes zusammengebaute Produkt wird mit 0,5 bar an allen Nähten, Ventilen und Anschlüssen gesprühtest. Ein 5-minütiger Drucktauchtest bestätigt die Wasserdichtheit von Kammer und Ventil. Null-Leck-Standard vor dem Versand.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
