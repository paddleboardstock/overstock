  quote: Ich habe das Drucktestprotokoll überprüft, das mit meinem Board geliefert wurde, und zwei Fragen zum Aufblasen bei Sommerhitze per E-Mail an den Support geschickt. Sie antworteten noch am selben Tag mit realen Zahlen. Das ist mehr, als mir je ein Geschäft geboten hat.
