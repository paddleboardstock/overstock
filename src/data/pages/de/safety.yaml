  company: Küstenpaddlerin
  location: Italien
content_overpressure:
  tagline: Drucksicherheit
  title: Board-Druck<br />Management in heißen Klimazonen
  subtitle: Der Druck auf aufblasbaren Boards steigt mit der Temperatur. Das Verstehen und Managen von Überdruck schützt dein Board und sorgt dafür, dass jede Session sicher bleibt.
  items:
    - title: Warum der Druck steigt
      description: Luft dehnt sich bei Hitze aus. Ein Board, das bei 20°C auf 15 PSI aufgepumpt ist, kann in 40°C Sonne um 1-2 PSI steigen — dieselbe Physik, die ein am Morgen noch weiches Board bis zum Mittag steinhart macht.
      icon: tabler:gauge
    - title: Empfohlener Betriebsdruck
      description: Auf 12-15 PSI aufpumpen, wie in der Nähe des Ventils angegeben. Der angegebene Bereich balanciert Steifigkeit, Sicherheit und Nahtlebensdauer — mehr ist nicht besser.
      icon: tabler:chart-bar
    - title: Best Practices für heiße Klimazonen
      description: An heißen Tagen am unteren Ende des Bereichs aufpumpen. Vor längerer Sonnenexposition etwas Luft ablassen und niemals ein vollständig aufgepumptes Board am Strand in der Sonne liegen lassen.
      icon: tabler:sun
    - title: Sonneneinstrahlung & Lagerung
      description: Boards bei Nichtgebrauch schattig und teilweise entleert lagern. Verwende eine Boardtasche als UV-Schutz. Vor dem Zusammenrollen für die Lagerung abspülen und trocknen.
      icon: tabler:umbrella
    - title: Wenn sich das Board steinhart anfühlt
      description: Luft über das Ventil ablassen, bis das Board wieder im Nenndruckbereich ist. Die Pumpe mit Manometer mitführen, um genaue Messungen zu erhalten — ein übermäßig aufgepumptes Board belastet unnötig die Nähte.
      icon: tabler:alert-circle
