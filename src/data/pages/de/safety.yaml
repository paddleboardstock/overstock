certifications:
  - title: CE-Zertifizierung (EU 2016/425)
    standard: PPE-Verordnung (EU) 2016/425 | EN ISO 12402
    description: Alle Aquafarer-Sicherheitsausrüstungen erfüllen die CE-Kennzeichnungsanforderungen gemäß der europäischen Verordnung über persönliche Schutzausrüstung. Jedes Produkt wird unabhängig von TÜV Rheinland, einer europäischen notifizierten Stelle, geprüft. Unsere Schlauchboote und RIBs erfüllen die Anforderungen der Sportboote-Richtlinie 2013/53/EU (RCD) der Kategorien C und D.
    body: Die CE-Zertifizierung deckt die wesentlichen Gesundheits- und Sicherheitsanforderungen für persönliche Auftriebsmittel und aufblasbare Wasserfahrzeuge ab. TÜV Rheinland auditiert unser Produktionswerk jährlich, um die fortlaufende Konformität zu überprüfen.
  - title: SOLAS — Sicherheit des Lebens auf See
    standard: SOLAS Kapitel III | LSA-Code
    description: Die Rettungsweste Pro erfüllt die SOLAS-Vorschriften für Offshore- und gewerbliche Marineeinsätze. Geprüft auf 24-stündige Auftriebsfähigkeit, automatische Auslösung bei Wassereintritt und Leistung bei Windstärken bis 5. Erfüllt die Anforderungen von Kapitel III für Rettungswesten auf Handelsschiffen.
    body: Die SOLAS-Zulassung erfordert unabhängige Prüfungen durch eine notifizierte Stelle für Auftrieb, Festigkeit, Sichtbarkeit und automatische Aktivierung. Unsere Rettungsweste Pro trägt die vollständige SOLAS-Bauartzulassung mit MED-Zertifizierung.
  - title: USCG Typ III / Typ V
    standard: 46 CFR Part 160 | USCG-Zulassung
    description: Ausgewählte Aquafarer-Rettungswesten erfüllen die Klassifizierung der United States Coast Guard für Typ-III-Geräte (Auftriebshilfe) und Typ-V-Geräte (Sonderanwendung). Geeignet für geschützte Gewässer, Küstenfahrten und gewerbliche Einsätze mit USCG-zugelassenen Rettungswesten.
    body: Die USCG-Zulassung erfordert Prüfungen durch ein von der Küstenwache anerkanntes unabhängiges Labor. Die Typ-V-Zulassung umfasst hybride aufblasbare Designs mit manueller oder automatischer Aktivierung.
  - title: BSCI Soziale Compliance
    standard: amfori BSCI Verhaltenskodex
    description: Unser Werk wird jährlich im Rahmen der amfori Business Social Compliance Initiative (BSCI) auditiert. Dies bestätigt faire Arbeitspraktiken, Arbeitssicherheit, gerechte Arbeitszeiten und Umweltmanagement in unserer 12.000 m² großen Produktionsstätte.
    body: BSCI-Compliance ist eine Grundvoraussetzung für europäische Einzelhändler und Importeure. Unsere aktuelle BSCI-Bewertung ist „C“ (Gut), auditiert von SGS.
  - title: REACH- & RoHS-Konformität
    standard: EU-REACH-Verordnung (EG) 1907/2006 | RoHS-Richtlinie 2011/65/EU
    description: Alle in Aquafarer-Produkten verwendeten PVC-Compounds, Klebstoffe und Beschichtungen erfüllen die EU-Chemikalienverordnung REACH und die RoHS-Beschränkungen gefährlicher Stoffe. Sicherheitsdatenblätter (MSDS) sind für jede Produktlinie erhältlich.
    body: Die REACH-Konformität stellt sicher, dass keine beschränkten SVHC-Stoffe oberhalb der Grenzwerte enthalten sind. Regelmäßige Laborprüfungen durch Dritte bestätigen die fortlaufende Konformität für jede Produktionscharge.
  - title: ISO 9001:2015 Qualitätsmanagement
    standard: ISO 9001:2015 | von TÜV Rheinland zertifiziert
    description: Unser Qualitätsmanagementsystem ist nach ISO 9001:2015 von TÜV Rheinland zertifiziert und umfasst Entwicklung, Produktion, Prüfung und Kundendienst. Jährliche Überwachungsaudits gewährleisten kontinuierliche Verbesserung und Prozesskontrolle.
    body: Die ISO-9001-Zertifizierung erfordert dokumentierte Qualitätsrichtlinien, interne Audits, Managementbewertungen, Korrekturmaßnahmen und rückverfolgbare Produktionsaufzeichnungen.

testimonial:
  quote: Wir haben Sicherheitsausrüstung von mehreren Lieferanten in Asien bezogen. Aquafarer ist der einzige Hersteller, der vollständige CE-Dokumentation, SOLAS-Zertifikate und Prüfberichte unabhängiger Institute von Anfang an vorgelegt hat — ohne dass wir darum bitten mussten.
  author: Erik Lindström
  title: Sicherheitsbeauftragter
  company: Baltic Marine Supply
  location: Finnland

content_overpressure:
  tagline: Überdrucksicherheit
  title: 'RIB-Schlauchdruckmanagement<br />in heißen Klimazonen'
  subtitle: 'Der Druck in aufblasbaren Schläuchen steigt mit der Temperatur. Wer Überdruck versteht und beherrscht, verhindert Schäden und gewährleistet einen sicheren Betrieb in tropischen und Wüstenregionen.'
  items:
    - title: 'Boyle-Überdruckablassventile'
      description: 'Aquafarer-RIB-Schläuche sind mit Überdruckablassventilen ausgestattet, die überschüssigen Druck oberhalb des zulässigen Maximums automatisch ablassen. Dies verhindert Nahtbelastung und ein mögliches Platzen des Schlauchs durch Sonneneinstrahlung.'
      icon: tabler:gauge
    - title: 'Druckänderung von Morgen bis Mittag'
      description: 'Ein bei 20 °C auf 3,5 PSI aufgepumpter Schlauch kann bei 40 °C Sonneneinstrahlung über 4,5 PSI erreichen. Pumpen Sie in heißen Klimazonen immer am unteren Ende des empfohlenen Bereichs und lassen Sie das Überdruckventil den überschüssigen Druck ablassen.'
      icon: tabler:sun
    - title: 'Empfohlene Betriebsdrücke'
      description: 'PVC-Schläuche: 3,0–3,5 PSI Betriebsdruck, 4,5 PSI maximal. Hypalon-Schläuche: 3,5–4,0 PSI Betriebsdruck, 5,0 PSI maximal. Prüfen Sie stets beim 1,25-fachen Nenndruck (4,4 PSI für PVC, 5,0 PSI für Hypalon) gemäß den Aquafarer-QC-Standards.'
      icon: tabler:chart-bar
    - title: 'Bewährte Praktiken bei Sonneneinstrahlung'
      description: 'Lagern Sie RIBs bei Nichtgebrauch im Schatten. Verwenden Sie bei längerem Liegen UV-Schutzabdeckungen. Prüfen und korrigieren Sie den Schlauchdruck vor und nach den Stunden mit stärkster Sonneneinstrahlung. Überschreiten Sie niemals den maximalen Nenndruck.'
      icon: tabler:umbrella
    - title: 'Notdruckabbau'
      description: 'Fühlt sich der Schlauch zu hart an oder entlüftet das Überdruckventil, lassen Sie Luft über das Halkey-Roberts-Ventil oder das Militärventil ab, bis der Druck wieder im Betriebsbereich liegt. Führen Sie stets ein Manometer für genaue Messwerte mit.'
      icon: tabler:alert-circle

