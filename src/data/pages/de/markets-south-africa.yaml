overview_section:
  tagline: Marktübersicht
  title: Der südafrikanische SUP Markt
  paragraphs:
    - Südafrika verfügt über den reifsten Brettsportmarkt des Kontinents. Kapstadt verbindet erstklassige Windabfahrten und Flachwasserlagunen mit einer tiefen Surfkultur; Durban betreibt das ganze Jahr über warme Wasserstrände; die Knysna-Lagunen der Garden Route und die Plettenberg Bay sind für Freizeitpaddeln gemacht. Eine gut ausgebaute Einzelhandelsinfrastruktur und eine echte lokale Paddelgemeinschaft – von SUP Surfern bis zu Flachwasser-Fitness-Paddlern – heben diesen Markt aus.
    - Buyers here are seasoned: Surfshops mit echten Einzelhandelsflächen, Paddelschulen mit Flotten und Abenteuerveranstalter, die SUP mit Kajak- und Radtouren kombiniert werden. Sie bewerten Ausrüstung wie Profis – Bau, Garantie und Reparaturfähigkeit – und bestellen in kleinen, gezielten Chargen von 5–20 Brettern, wobei sie Miet-Allrounder mit Premium-Editionen für die Verkaufswand kombinieren.
  customer_types:
    - title: Surf- und Paddle-Geschäfte
      description: Etablierte Händler in Kapstadt und Durban, die SUP die Linien für die lokale Paddelgemeinschaft erweiterten oder erweiterten.
    - title: Paddelschulen & Vermietungen
      description: Schulen und Mietflotten an Lagunen und ruhigen Stränden erfrischen die Tafeln in einem echten Ersatzzyklus.
    - title: Abenteuerbetreiber
      description: Garden Route- und Western Cape-Betreiber erweitern das SUP Multi-Activity-Abenteuerangebot.
shipping_section:
  title: Schiff nach Südafrika
  paragraphs:
    - Bestellungen werden aus Weihai, China, versandt. Express-Luftfracht transportiert Muster und 1–3 Board-Bestellungen nach Johannesburg und Kapstadt; Consolidated Sea Freight bedient 5–20 Board-Großhandelsaufträge über Durban, Kapstadt und andere Häfen. Transit-Schätzungen für Ihr Ziel sind in Ihrem Angebot enthalten.
    - Wir stellen die erforderlichen Handelsrechnungen und Packlistenabfertigungen mit korrekten HS-Codes und deklarierten Werten bereit. Einfuhrzölle und Mehrwertsteuer werden vom Importeur nach südafrikanischen Regeln zu zahlen.
  customs_note: Die SARS-Freigabe basiert auf Dokumentation – bestätigen Sie vor der Bestellung die aktuelle Pflicht und die Mehrwertsteuerregelung für aufblasbare Sportausrüstung mit Ihrem Clearing-Agenten. Wir stellen vollständige, konsistente Unterlagen bereit und reagieren schnell auf Anfragen von Maklern.
faq_section:
  title: Südafrika FAQ
  items:
    - q: Passen die Boards zu den gemischten Bedingungen in Kapstadt?
      a: Ja. Allround-Modelle bewältigen flaches Wasser in der Lagune und ruhige Küstentage, und das Sortiment umfasst Touring-Boards für längere Paddel. Für offene Fahrten mit dem Wind sollten erfahrene Paddler vor der Bestellung mit uns über ihren spezifischen Anwendungsfall sprechen.
    - q: Wie sieht eine Ladenbestellung aus?
      a: 'Typischerweise 5–20 Bretter: eine Basis aus Allround-Modellen für Unterricht und Ausleihe sowie Premium-Kunstausgaben für die Verkaufswand – gemischte Modelle, eine Lieferung, bepreist nach Gesamtmenge.'
    - q: Wie wird der Frachtpreis nach Südafrika angeboten?
      a: Schnellversand per Luftfracht nach Johannesburg oder Kapstadt für Muster und kleine Bestellungen; gebündelte Seefracht nach Durban oder Kapstadt für Großhandelsmengen. Beides ist in Ihrem Angebot mit geschätzten Transitzeiten aufgeführt.
    - q: Wer übernimmt Einfuhrzölle und Mehrwertsteuer?
      a: Sie als Importeur, über Ihren Zollagenten gemäß den SARS-Vorschriften. Wir stellen die Handelsrechnung und die Packliste mit den korrekten HS-Codes und deklarierten Werten bereit.
