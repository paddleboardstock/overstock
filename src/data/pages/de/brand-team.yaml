hero:
  tagline: Unser Team
  title: 'Die Menschen hinter Aquafarer<br />— Ingenieurskunst für Freiheit auf dem Wasser'
  subtitle: 'Aquafarer wurde 2012 in Qingdao, China, von Schiffsingenieuren, Materialwissenschaftlern und Wassersportbegeisterten gegründet, die daran glaubten, professionelle aufblasbare Wasserfahrzeuge weltweit zugänglich zu machen.'
  image:
    src: /images/team-all.webp
    alt: Aquafarer-Teamfoto — Technik, Produktion und Führung
founding:
  tagline: Unsere Gründung
  title: 'Von einer Küstenwerkstatt<br />zu einer 12.000 m² Anlage'
  subtitle: 'Aquafarer wurde von einem Team aus Schiffsingenieuren gegründet, das über jahrzehntelange kombinierte Erfahrung in der Konstruktion aufblasbarer Boote, der PVC/Hypalon-Fertigung und der weltweiten Herstellung von Schiffsausrüstung verfügt.'
  items:
    - title: 'Gegründet: 2012'
      description: 'Gegründet in Qingdao, China — einem bedeutenden maritimen Zentrum mit tiefer Schiffbautradition.'
      icon: tabler:calendar
    - title: '200-300 Mitarbeiter'
      description: 'Darunter über 50 F&E-Ingenieure, Qualitätskontrollspezialisten und Produktionstechniker.'
      icon: tabler:users
    - title: '12.000 m² Anlage'
      description: 'Eigenes Produktionswerk mit 6 Fertigungslinien für RIBs, aufblasbare Boote und SUP-Boards.'
      icon: tabler:building-factory
    - title: 'Über 50 Länder beliefert'
      description: 'Export nach Europa, Amerika, Naher Osten, Asien-Pazifik und Afrika.'
      icon: tabler:globe
