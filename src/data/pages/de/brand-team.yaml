hero:
  tagline: Unser Team
  title: Die Menschen hinter Paddle Board Overstock<br />— Ingenieurwesen für Freiheit auf dem Wasser
  subtitle: Gegründet 2012 in Weihai, China, wurde Paddle Board Overstock von Meeresingenieuren, Materialwissenschaftlern und Wassersport-Enthusiasten aufgebaut, die daran glaubten, professionell hergestellte aufblasbare Paddleboards weltweit zugänglich zu machen.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock Gruppenfoto des gesamten Teams — Ingenieurwesen, Produktion und Leitung
founding:
  tagline: Unsere Gründung
  title: Von einer Küstenwerkstatt<br />zu einer 12.000 m² großen Anlage
  subtitle: Paddle Board Overstock wurde von einem Team von Meeresingenieuren gegründet, das über Jahrzehnte gebündelte Erfahrung im Design von aufblasbaren SUP, in der drop-stitch-Konstruktion und in der globalen Wassersportfertigung verfügt.
  items:
    - title: 'Gegründet: 2012'
      description: Gegründet in Weihai, China — einem wichtigen maritimen Zentrum mit reicher Schiffbautradition.
      icon: tabler:calendar
    - title: 200-300 Mitarbeiter
      description: Darunter 14+ F&E-Ingenieure, Qualitätsspezialisten und Produktionstechniker.
      icon: tabler:users
    - title: 12.000 m² Anlage
      description: Eigene Fertigungsanlage mit 6 Produktionslinien für SUP-Boards und Zubehör.
      icon: tabler:building-factory
    - title: 50+ bediente Länder
      description: Export nach Europa, Amerika, Mittlerer Osten, Asien-Pazifik und Afrika.
      icon: tabler:globe
