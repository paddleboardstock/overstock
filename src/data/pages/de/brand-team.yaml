philosophy:
  tagline: Design-Philosophie
  title: 'Engineering-getriebenes Design<br />— Jedes Detail zählt'
  subtitle: 'Unsere Ingenieursphilosophie stützt sich auf drei Prinzipien, die jedes von uns gebaute Produkt leiten.'
  list:
    - 'Zuverlässigkeit zuerst: Jedes Aquafarer-Produkt wird getestet, um realen Bedingungen standzuhalten — von Kaltwasser-Rettungseinsätzen bis zu tropischen Resort-Verleihen. Wir überdimensionieren dort, wo es am wichtigsten ist.'
    - 'Fertigungspräzision: Unsere Anlagen nutzen CNC-Schneiden, Hochfrequenzschweißen und automatisierte Druckprüfungen. Jede Naht, jedes Ventil und jede Armatur erfüllt dokumentierte Spezifikationen.'
    - 'Kontinuierliche Innovation: Unser F&E-Team bewertet kontinuierlich neue Materialien, Produktionsmethoden und Designverbesserungen. Wir warten nicht auf Probleme — wir antizipieren sie.'
cta:
  title: 'Möchten Sie ein Projekt mit unserem Team besprechen?'
  subtitle: 'Unsere Ingenieure beraten Sie gerne bei der Produktauswahl, Individualisierung und OEM/ODM-Partnerschaften.'
  actions:
