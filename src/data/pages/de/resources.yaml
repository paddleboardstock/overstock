hero_text:
  tagline: Ressourcen
  title: Download-Center & Paddel-Guides
  subtitle: Produktkataloge, Kaufratgeber und Pflegeanleitungen, die Ihnen helfen, Ihr aufblasbares SUP-Board auszuwählen, zu verwenden und zu genießen.
features3_downloads:
  tagline: Downloads
  title: Produktdokumentation<br />& Paddelressourcen
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026 SUP Produktkatalog
      description: 'Die vollständige Paddle Board Overstock SUP-Reihe: Allround-Boards, Art-Serie und Zubehör mit vollständigen Spezifikationen und Verpackungsinhalt. PDF-Format.'
      icon: tabler:file-text
    - title: Aufblasbarer SUP-Kaufratgeber
      description: 'Wie Sie Ihr erstes Board auswählen: Länge, Breite, Dicke, Volumen, Abstimmung auf das Gewicht des Fahrers und welches Board-Shape zu Ihrem Paddelstil passt.'
      icon: tabler:file-description
    - title: SUP Größen- & Passformguide
      description: Passen Sie Boardvolumen und Abmessungen an Ihr Gewicht und Ihr Können an, mit aktivitätsspezifischen Empfehlungen für Freizeit, Touring, Yoga und Fitness.
      icon: tabler:clipboard-check
    - title: Board-Pflege- & Wartungsanleitung
      description: 'Halten Sie Ihr Board wie neu: Reinigung, Trocknung, Lagerung, UV-Schutz, Ventilpflege und Anleitungen für kleine Reparaturen.'
      icon: tabler:tool
    - title: Handbuch zu Materialien von aufblasbaren Boards
      description: PVC-Konstruktion, drop-stitch-Kerne, EVA-Deckpads und was 15 PSI-Steifigkeit für Leistung und Haltbarkeit bedeutet.
      icon: tabler:files
    - title: Erste Schritte mit SUP
      description: 'Grundlagen für Erst-Paddler: Aufblasen, Tragen, Starten, Grundschläge und Sicherheitsgrundlagen, damit Sie am ersten Tag stehen können.'
      icon: tabler:swimming
faqs:
  title: Häufig gestellte Fragen
  subtitle: Häufige Fragen zu unseren Boards, Bestellungen und dem Paddeln.
  columns: 2
  items:
    - title: Was ist im Lieferumfang meines Boards enthalten?
      description: Jedes Komplettpaket enthält das Board, ein verstellbares Paddel, eine Hochdruckpumpe, eine Leine, ein Reparaturset und einen Rucksack. Das Ruder- & Pumpen-Set ist auch separat erhältlich.
      icon: tabler:package
    - title: Wie lange dauert das Aufblasen?
      description: Mit der beigefügten Hochdruckpumpe erreichen die meisten Paddler den vollen Druck in 8–12 Minuten. Elektrische Pumpen funktionieren ebenfalls – stoppen Sie einfach beim angegebenen Druck in der Nähe des Ventils.
      icon: tabler:clock
    - title: Wie wähle ich das richtige Board aus?
      description: 'Beginnen Sie mit Ihrem Gewicht und Paddelstil: Anfänger und Familien lieben breite, stabile Plattformen wie das SUP Explorer 11; Yoga-Paddler bevorzugen volle Deck-Traktion; Touring-Paddler wollen steife, stromlinienförmige Shapes. Unser Team berät Sie gerne.'
      icon: tabler:help-circle
    - title: Welche Zahlungsmethoden akzeptieren Sie?
      description: Wir akzeptieren gängige Kreditkarten, PayPal und Banküberweisung. Alle Preise beinhalten das komplette Paket – keine versteckten Extras.
      icon: tabler:currency-dollar
    - title: Wie lange dauert die Lieferung?
      description: Bestellungen werden ab unserer Fabrik versendet und kommen je nach Region in der Regel innerhalb von 5–10 Werktagen an. Für jede Bestellung wird eine Sendungsverfolgung bereitgestellt.
      icon: tabler:truck-delivery
    - title: Ist mein Board durch die Garantie abgedeckt?
      description: Ja — jedes Board ist gegen Herstellungsfehler abgedeckt, und jede Einheit wird vor Verlassen der Fabrik 24-48 Stunden lang einem Drucktest von 1,25-fachem des Nennwerts unterzogen. Unsere Garantiefallrate liegt unter 2%.
      icon: tabler:shield-check
cta:
  title: Brauchen Sie Hilfe, das richtige Board zu finden?
  subtitle: Kontaktieren Sie unser Team für ehrliche Beratung zur Boardauswahl, Größenbestimmung oder zu Bestellfragen.
  actions:
    - variant: primary
      text: Kontaktieren Sie unser Team
      href: /contact
