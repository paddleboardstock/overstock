hero_text:
  tagline: Ressourcen
  title: 'Downloadcenter & Kaufratgeber'
  subtitle: 'Zugriff auf Produktkataloge, OEM-Leitfäden, Käufer-Checklisten und technische Dokumentation für fundierte Beschaffungsentscheidungen.'
features3_downloads:
  tagline: Downloads
  title: 'Produktdokumentation<br />& Käuferressourcen'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Marine-Produktkatalog 2026'
      description: 'Das komplette Sortiment: RIB-Boote, Schlauchboote, SUP-Boards, Kajaks und Zubehör. Spezifikationen, Konfigurationen und Optionen. Als PDF-Datei.'
      icon: tabler:file-text
    - title: 'OEM-Fertigungsleitfaden'
      description: 'Alles Wissenswerte über OEM/ODM-Partnerschaften: Prozessübersicht, Mindestbestellmengen, Individualisierungsoptionen, Qualitätskontrolle und Versand.'
      icon: tabler:building-factory
    - title: 'RIB-Kaufratgeber'
      description: 'So finden Sie das richtige RIB: Rumpfmaterialien, Schlauchmaterialien, Motorauswahl, Größenfragen und Konfigurationsoptionen für verschiedene Einsatzbereiche.'
      icon: tabler:file-description
    - title: 'SUP-Lieferanten-Checkliste'
      description: 'Entscheidende Kriterien bei der Auswahl eines SUP-Board-Herstellers: Qualitätsindikatoren, Zertifizierungsanforderungen, MOQ-Fragen und worauf Sie bei einem Werksaudit achten sollten.'
      icon: tabler:clipboard-check
    - title: 'Materialleitfaden für Schlauchboote'
      description: 'PVC vs. Hypalon: Vergleich von Haltbarkeit, UV-Beständigkeit, Lebensdauer, Reparaturmöglichkeiten und Kostenaspekten für unterschiedliche Marineanwendungen.'
      icon: tabler:files
    - title: 'Vorlage für den Produkt-Brief'
      description: 'Laden Sie unsere Produkt-Brief-Vorlage herunter. Füllen Sie Ihre Anforderungen aus und senden Sie sie uns zurück – Sie erhalten innerhalb derselben Woche ein Angebot und eine Machbarkeitsprüfung.'
      icon: tabler:template
faqs:
  title: Häufig gestellte Fragen
  subtitle: 'Häufige Fragen zu unseren Produkten, zum Fertigungsprozess und zum Partnerschaftsmodell.'
  columns: 2
  items:
    - title: Wie hoch ist die Mindestbestellmenge?
      description: 'Die MOQ variiert je nach Produktkategorie. RIB-Boote starten üblicherweise bei 10 Einheiten pro Modell, SUP-Boards bei 50 Einheiten. Kontaktieren Sie unser Vertriebsteam für produktspezifische MOQ-Informationen.'
      icon: tabler:help-circle
    - title: Kann ich vor der Bestellung Muster erhalten?
      description: 'Ja. Aquafarer fertigt Muster zur Bewertung vor der Serienproduktion. Die Musterkosten sind verhandelbar und werden häufig auf den ersten Serienauftrag angerechnet.'
      icon: tabler:package
    - title: Welche Zahlungsbedingungen sind möglich?
      description: 'Standardbedingungen: 30 % Anzahlung bei Bestellung, 70 % vor dem Versand. LC-Bedingungen für qualifizierte Kunden. Kontaktieren Sie unser Finanzteam, um Konditionen zu besprechen.'
      icon: tabler:currency-dollar
    - title: Wie lange dauert die Produktion?
      description: 'Typische Lieferzeiten: RIB-Boote 30–45 Tage, SUP-Boards 20–30 Tage, Schlauchboote 25–35 Tage. Individuelle Entwicklungen verlängern die Fertigung um 15–30 Tage für die Prototypenphase.'
      icon: tabler:calendar-clock
    - title: Welche Zertifizierungen haben Ihre Produkte?
      description: 'CE-Zertifizierung für den EU-Markt, Fertigung nach US-Coast-Guard-Zulassung, ISO-Qualitätssystem, BSCI-Konformität und REACH-Materialkonformität.'
      icon: tabler:certificate
    - title: Bieten Sie individuelle Verpackung und Branding an?
      description: 'Ja. Wir bieten individuelle Verpackungen mit Ihrem Logo, Ihren Farben und Ihrer Markenidentität. Die MOQ für individuelle Verpackungen hängt von der Produktkategorie ab.'
      icon: tabler:color-swatch
cta:
  title: 'Sie finden die richtige Ressource nicht?'
  subtitle: 'Kontaktieren Sie unser Team für persönliche Beratung zu Produktauswahl, OEM-Partnerschaften oder technischen Spezifikationen.'
  actions:
    - variant: primary
      text: Kontaktieren Sie unser Team
      href: /contact