  subtitle: 12.000 m² große Anlage, die 15.000 Boards pro Jahr produziert und erweiterbar ist
intro: Paddle Board Overstock betreibt eine der größten spezialisierten Produktionsanlagen für aufblasbare SUP-Boards in Weihai, China. Unsere 12.000 m² große Fabrik ist in sechs spezialisierte Werkstätten unterteilt, die parallel arbeiten und uns die Kapazität geben, jährlich 15.000 Boards der All-Around-, Touring- und Art-Serien SUP herzustellen.
