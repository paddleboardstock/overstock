workshops:
  - title: SUP Board-Produktion
    description: '4 parallele Montagelinien für aufblasbare SUP-Boards. Jede Linie kann 50–80 Boards pro Schicht produzieren. Digitale Druck- und Siebdruckstationen laufen gleichzeitig. Jährliche SUP Kapazität: 8.000 + Boards.'
    output: 8.000 + SUPs/Jahr
  - title: Deckkunst & EVA Fertigstellung
    description: Spezielle Endbearbeitungswerkstatt für Art-Serien-Decks. Präzises EVA Schneiden, handgelegte Deckmuster und Endbearbeitung. Jährliche Kapazität deckt die gesamte Art-Serien-Palette ab.
    output: Vollständige Art-Serien-Palette
  - title: Drop-Stitch Laminierung
    description: 'Hitze-Laminierlinien verbinden drop-stitch Kerne mit äußeren PVC Laminaten. Kantenbänder sind dreilagig verschweißt für luftdichte Stabilität. Jährliche Kapazität: 15.000 + Kerne.'
    output: 15.000 + Kerne/Jahr
  - title: Zubehör & Verpackung
    description: Montage- und Verpackungslinien für Pumpen, Paddel, Leinen und Reparaturkits. Die Boards werden vakuumverpackt, gekartoniert und palettiert für den weltweiten Versand.
    output: Komplettpakete, versandfertig
tldr:
  summary: Paddle Board Overstock stellt jährlich 15.000 Paddleboards in seiner eigenen 12.000 m² großen Fabrik in Weihai, China, her. 200-300 qualifizierte Arbeiter arbeiten in 2 Schichten und verkaufen direkt an Paddler in 50+ Ländern.
  points:
    - 12.000 m² Produktionscampus in Weihai
    - 15.000 Boards werden jährlich gebaut
    - 200-300 qualifizierte Arbeiter, 2 Schichten pro Tag
    - Bestellungen auf Lager werden innerhalb von 2-3 Werktagen versendet
    - 2 Jahre Garantie auf jedes Board
