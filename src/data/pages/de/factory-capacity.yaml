hero:
  tagline: Produktionskapazität
  title: Fertigungskapazität & Jahresausstoß
  subtitle: 12,000 m² Anlage mit 15,000 Booten pro Jahr – mit Raum zur Erweiterung

intro: Paddle Board Overstock betreibt eine der größten spezialisierten Fertigungsstätten für aufblasbare Boote in Qingdao, China. Unsere 12,000 m² große Fabrik ist in sechs spezialisierte Werkstätten unterteilt, die parallel arbeiten – so können wir jährlich 15,000 Boote aus den Produktlinien SUP, Kayak, Dinghy, RIB und Sicherheitsausrüstung herstellen.

