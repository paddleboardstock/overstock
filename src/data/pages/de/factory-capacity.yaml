workshops:
  - title: SUP-Board-Produktion
    description: '4 parallele Montagelinien für aufblasbare SUP-Boards. Jede Linie kann 50–80 Boards pro Schicht produzieren. Digitaldruck- und Siebdruckstationen arbeiten parallel. Jährliche SUP-Kapazität: 8,000+ Boards.'
    output: '8,000+ SUPs/Jahr'
  - title: RIB-Boot-Produktion
    description: 'Eigene Glasfaserrumpf-Werkstatt mit 6 Formenstationen für RIB-Rümpfe bis 7.6 m. Der Schlauchschweiß- und Montagebereich verarbeitet 3–5 RIBS gleichzeitig. Jährliche RIB-Kapazität: 2,000+ Boote.'
    output: '2,000+ RIBS/Jahr'
  - title: Aufblasbare Boote & Dinghys
    description: 'Multifunktionale Produktionslinien für aufblasbare Boote, Kayaks und Dinghys. Heißluftschweißstationen, HF-Dielektrik-Pressen und Montagearbeitsplätze werden je nach Auftragsmix umkonfiguriert. Jährliche Kapazität: 5,000+ Einheiten.'
    output: '5,000+ Einheiten/Jahr'
  - title: Sicherheitsausrüstung
    description: 'Separater Reinraumbereich für Schwimmwesten und Sicherheitsausrüstung. Eigene Näh-, Schaumstoffeinlege- und Prüfstationen. Jährliche Schwimmwesten-Kapazität: 50,000+ Einheiten.'
    output: '50,000+ Schwimmwesten/Jahr'

oem_capacity:
  moq: 'SUP: 5–10 Einheiten | RIB: 2–5 Einheiten | Kayak/Dinghy: 10–20 Einheiten | Eigenform: 200+ Einheiten'
  lead_time: 'Standard 30–45 Tage. Muster 15–20 Tage. Eilaufträge möglich.'
  payment: 'T/T 30% Anzahlung + 70% vor Versand. L/C und Western Union akzeptiert.'
