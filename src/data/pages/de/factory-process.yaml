hero:
  tagline: Ablauf
  title: Herstellungsprozess
  subtitle: Vom Rohstoff bis zum seebereiten Board – jeder Schritt steht unter unserer Kontrolle
  back_label: Zurück in die Fabrik
  back_link: /factory
intro: Im Gegensatz zu Marken, die die Produktion an Drittanbieterfabriken auslagern, Paddle Board Overstock besitzen und betreiben sie ihre gesamte Produktionskette. Diese vertikale Integration ermöglicht es uns, in jeder Phase eine strenge Qualitätskontrolle aufrechtzuerhalten und Charge für Charge eine einheitliche Produktqualität zu liefern. So wird eine Platine in unserer Anlage aufgebaut.
steps:
  - step: '01'
    title: Materialeingang & Inspektion
    description: Jede eingehende Charge von PVC Stoff, drop-stitch Kern, EVA Schaumstoff und Hardware wird gemäß den Vorgaben überprüft. Stoffproben werden vor der Freigabe in die Produktion auf Zugfestigkeit, Dickegleichmäßigkeit und UV Widerstand getestet. Nicht konforme Materialien werden unter Quarantäne gestellt und zurückgegeben.
    duration: 1–2 Tage
  - step: '02'
    title: Automatisches PVC Schneiden
    description: Zugelassene Stoffe werden auf der automatischen CNC Schneidemaschine aufgelegt und mit sub-Millimeter-Genauigkeit geschnitten. Computeroptimiertes Verschachteln ordnet die Paneele so an, dass Abfall minimiert wird – typischerweise unter 5 %. Zugeschnittene Platten werden nach Kartonmodell und Kammer beschriftet und dann gebündelt für den Transport in die Schweißwerkstatt.
    duration: 2–4 Stunden pro Board-Kit
  - step: '03'
    title: Rohr-Wärmeabdichtung und -schweißen
    description: Die Paneele werden mit Wärmeabdichtungsmaschinen mit Heißluftschweißen bei kontrollierten Temperaturen von 200–600 °C geheftet und verklebt. Hauptnähte werden mit RF-Dielektrik-Schweißen verstärkt, um luftdichte, hochfeste Verbindungen zu gewährleisten. Fertige Kammern werden auf 1,25× Arbeitsdruck für eine 30-minütige Luftfesthaltvalidierung aufgeblasen.
    duration: 1–2 Tage pro Spielfeld
  - step: '04'
    title: Deckkunst & EVA Fertigstellung
    description: 'Art-Series-Decks nehmen hier Gestalt: Präzisionsgeschnittene EVA Schaumstoffplatten werden zu Volldeckmustern verlegt, von Hand verklebt und zugeschnitten. Griffig, bequem und langlebig – das Markenzeichen jedes Art-Series-Boards.'
    duration: 1–2 Tage
  - step: '05'
    title: SUP Druck und Dekoration
    description: Board SUP Deck-Grafiken werden mit Digitaldruck für vollfarbige Fotodesigns und Siebdruck für langlebige Logos und wiederholende Muster verwendet. Drucke werden ausgehärtet und versiegelt, um UV Abschleißfestigkeit zu gewährleisten.
    duration: 1–2 Tage
  - step: '06'
    title: Endmontage & Rigging
    description: 'Die Platinen erhalten ihre endgültigen Komponenten: Ventile werden angezogen und funktionsgeprüft, D-Ringe, Griffe und Finnenboxen werden montiert und die Leinenbefestigung wird gesichert. Jede Platine folgt einer 100-Punkte-Montage-Checkliste mit verpflichtender Abgabe in jeder Phase.'
    duration: 2–3 Tage
  - step: '07'
    title: Qualitätsprüfung & Inspektion
    description: 'Jedes fertige Board unterzog sich einem verpflichtenden Qualitätsgate: Luftfesthalttest der Kammer, Systemfunktionsprüfung, Überprüfung des Befestigungsmoments und kosmetische Inspektion. Sonder- und Prototypenbauten erhalten zudem Fahrten im Wasser, die Geschwindigkeit, Handhabung, Stabilität und Ausdauer abdecken.'
    duration: 1–2 Tage
  - step: '08'
    title: Verpackung und Versand
    description: Die Bretter werden entleert, gerollt und in Reise-Rucksäcken mit Pumpe, Paddel, Flossen, Leine und Reparaturset verpackt und dann für Kurier- und Frachtversenden verpackt. Jedes Paket ist mit Modell, Seriennummer und Zielort beschriftet. Wir versenden in 50+ Länder weltweit.
    duration: 1 Tag
