        - Breite Tauchleiter mit Haltegriffen für leichtes Einsteigen in Resortgarderobe
        - Gekühlte Lagerung für Premium-Getränke und Handtücher
        - EVA-Deck in Teak-Optik für Luxus-Anmutung und rutschfeste Sicherheit
        - Leise Motorkonfiguration für minimale Lärmbelästigung
    - title: Boutique-Eco-Tauchresorts
      subtitle: Lage am Strand, Eco-Lodges, Nachhaltigkeitsorientiert
      description: Kleinere Anlagen in abgelegenen Küstenregionen, die Umweltverantwortung und authentische Erlebnisse in den Vordergrund stellen. Diese Resorts brauchen zuverlässige, wartungsarme Boote, die mit begrenzter technischer Unterstützung eigenständig betrieben werden können. Kraftstoffeffizienz und Haltbarkeit zählen mehr als Höchstgeschwindigkeit. Das Boot sollte zur natürlichen Umgebung passen.
      features:
        - Kraftstoffsparsame 4-Takt-Außenbordkonfigurationen
        - Robuste Hypalon-Schläuche für lange Lebensdauer an abgelegenen Standorten
        - Solarkompatibles elektrisches System für netzunabhängiges Laden
        - Kompaktes Decklayout für 8-10 Gäste mit minimalem ökologischen Fußabdruck
        - Wartungsfreundliches Design — zugängliche Komponenten für die Wartung vor Ort
        - Neutrale Farboptionen, die sich in die natürliche Umgebung einfügen
        - Leichte Bauweise für Strandlandungen und Operationen in flachem Wasser
    - title: Premium-Liveaboard-Betreiber
      subtitle: Mehrtägige Tauchsafaris, Expeditionstauchen, abgelegene Atolle
      description: 'Liveaboard-Betreiber brauchen Tenderboote, die mehrere Rollen erfüllen: Transport der Taucher zu den Riffen, Ausrüstungstransporte, Notfallunterstützung und Gästerausflüge. Das RIB muss kompakt genug für Deckslagerung oder Schlepp sein und zugleich Überfahrten auf offener See unter wechselnden Bedingungen bewältigen. Tägliches Aussetzen und Einholen erfordern robuste Bauweise.'
      features:
        - Kompakte Bauweise (4,5-5,5 m) für Deckslagerung oder Schlepp hinter dem Liveaboard
        - Verstärkter Rumpf für häufige Strandlandungen und Riffnavigation
        - Schnell aufblasbare/ablassbare Schlauchoptionen für effiziente Lagerung
        - Niedrig bauende Tauchleiter für leichtes Bordgehen aus dem Wasser
        - Robuste Hebepunkte für Davit- oder Kran-Aussetzsysteme
        - Reichweite für 50+ Seemeilen zwischen den Betankungen
        - Langlebige Schlauchmaterialien beständig gegen Sonne, Salz und Kraftstoff
    - title: VIP-Privatcharter-Betriebe
      subtitle: Ultraluxuriöse Privatinseln, Promigäste, Firmencharters
      description: Die höchste Stufe der Resort-Gastfreundschaft, in der jedes Detail personalisiert ist und die Erwartungen extrem hoch sind. Das Boot muss makellos sein, flüsterleise fahren und mit nahtlosem Service betrieben werden. Privatsphäre, Komfort und ästhetische Perfektion haben oberste Priorität. Diese Kunden sind nicht preissensibel, aber außerordentlich qualitätssensibel.
      features:
        - Ultra-Premium-Sitze mit individuellem Stepp und beheizbaren Optionen
        - Schallgedämmter Motorraum für nahezu lautlose Fahrten
        - Vollverdeck-Option für Privatsphäre und Wetterschutz
        - Integriertes Entertainment-System mit Marinelautsprechern
        - Individuelle Bar oder Erfrischungsstation
        - Privatzelt für Bad/WC und Umkleiden
        - Dedizierte Crewstation mit Kommunikation und Navigation
        - Aufeinander abgestimmtes Tender-Set — koordiniertes Mutterschiff und Support-RIB
