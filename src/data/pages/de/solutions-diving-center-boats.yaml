content_challenge:
  tagline: Die Herausforderung
  title: Warum Tauchcenter<br />Spezialboote brauchen
  subtitle: Tauchgänge stellen besondere Anforderungen an Wasserfahrzeuge, die Allzweckboote oft nicht erfüllen.
  paragraphs:
    - Tauchboote benötigen Stabilität im Stillstand für sicheren Ein- und Ausstieg, besonders wenn Taucher schwere Ausrüstung tragen. Ein schmales oder instabiles Plattform schafft Sicherheitsrisiken und begrenzt die Betriebskapazität.
    - Ausrüstungsaufbewahrung ist ein weiterer kritischer Faktor. Tanks, Gewichte, Tauchausrüstung und Sicherheitsausrüstung benötigen spezielle organisierte Lagerung, die das Deck frei und zugänglich hält.
    - Motorzuverlässigkeit ist nicht verhandelbar. Wenn Taucher im Wasser sind, muss das Boot jederzeit einsatzbereit sein. Doppelmotorkonfigurationen werden oft aus Redundanzgründen bevorzugt.
    - Paddle Board Overstock erfüllt diese Anforderungen mit speziell entwickelten RIB-Konfigurationen — stabilen Tief-V-Rümpfen, breiten Schläuchen für das Einsteigen, integrierter Tanklagerung und für Tauchgänge optimierten Motoroptionen.
    - '**Stabilität im Ruhezustand** – Taucher benötigen eine stabile Plattform, wenn sie sich ausrüsten, ins Wasser gehen und wieder an Bord klettern. Unzureichende Stabilität birgt Sicherheitsrisiken und wirkt sich negativ auf das Kundenerlebnis aus.'
    - '**Hohe Betriebskosten** – Kraftstoffeffizienz ist wichtig, wenn täglich mehrere Fahrten durchgeführt werden. Ein Boot, das mehr Kraftstoff verbraucht, verringert direkt die Gewinnspanne. Kommerziellen Tauchbetreibern sind die täglichen Betriebskosten wichtiger als die Höchstgeschwindigkeit.'
content_solution:
  tagline: Unsere Lösung
  title: Für Tauchgänge konfiguriert
  subtitle: Jedes Paddle Board Overstock Tauch-RIB ist auf die spezifischen Bedürfnisse kommerzieller und Freizeittaucheinsätze ausgelegt.
  list:
    - Breite Hypalon- oder PVC-Schläuche als stabile Einstiegsplattform — Taucher steigen sicher ein und aus
    - Integrierte Tanklagerregale — halten das Gewicht niedrig und das Deck frei
    - Konsolenpositionierung für klare Sicht auf Taucher im Wasser
    - Optionale Tauchleiter für einfaches Wiederanbordgehen
    - Motoroptionen von 40 PS bis 115 PS — Einzel- oder Doppelkonfiguration
    - Gerätehalterungen für Sonar, GPS und Kommunikationsausrüstung
    - Tankkapazität an die Betriebsreichweite angepasst
    - Konstruktion in Marinequalität – robuste Rohrmaterialien mit UV- und Salzwasserbeständigkeit, verstärkte Struktur für den täglichen kommerziellen Einsatz
    - Individuelle Konfigurationen von Tauchleitern und Plattformen – abgestimmt auf Ihre Wassertiefe und Ihr Taucherprofil
    - Gerätemontageplatten für Sonar-, GPS- und Kommunikationsgeräte
