hero:
  tagline: Lebensstil
  title: Der Paddle Board Overstock<br />Lebensstil
  subtitle: Gebaut für diejenigen, die auf dem Wasser leben – von Wochenend-Entdeckern bis zu täglichen Paddlern, die die Tage bis zur nächsten Session herunterzählen.
values:
  - icon: 🌊
    title: Geboren auf dem Wasser
    desc: Jedes Design beginnt mit dem Verständnis, wie sich Wasser verhält. Wir entwickeln vom Rand der Bedingungen nach innen – denn der Ozean ist unser Lehrer, nicht unser Arbeitsplatz.
  - icon: 🔧
    title: Gebaut, um zu halten
    desc: Das nachhaltigste Produkt ist das, das nicht ersetzt werden muss. Materialien in Marinequalität, drop-stitch-Kerne mit einer Belastbarkeit von 15 PSI und Nähte, die die Saison überdauern.
  - icon: 🏆
    title: Zugänglich durch Design
    desc: Wassersport sollte kein Luxus sein. Leistung in Profiqualität zu einem Preis, der für Familien, Guides und alltägliche Paddler sinnvoll ist – nicht nur für Profis.
  - icon: 🌍
    title: Globale Gemeinschaft
    desc: 'Von der Küste Weihais bis zu Seen in Europa, Flüssen in Südostasien und Buchten in Amerika – unsere Kunden teilen eines: die Liebe zum Leben auf dem Wasser.'
  - icon: ♻️
    title: Verantwortungsvolle Herstellung
    desc: CNC-optimierte Verschachtelung reduziert Materialabfall auf unter 5 %. Langlebige Konstruktion verringert Ersatzzyklen. Wir bauen für Langlebigkeit, weil das die nachhaltigste Wahl ist.
  - icon: 🤝
    title: Support, der Bestand hat
    desc: Boards, die wir vor Jahren gebaut haben, rufen uns immer noch nach Ersatzteilen an. Unsere Reaktionszeit bei Garantieleistungen liegt im Durchschnitt bei 24 Stunden. Wir verschwinden nicht nach dem Verkauf – wir sind für die Lebensdauer des Produkts da.
