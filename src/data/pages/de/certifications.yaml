hero:
  tagline: Zertifizierungen & Normen
  title: 'Qualitätszertifizierungen<br />& Konformitätsnormen'
  subtitle: 'Paddle Board Overstock-Produkte werden in Übereinstimmung mit internationalen Sicherheitsnormen für Wasserfahrzeuge, Qualitätsmanagementsystemen und Umweltvorschriften hergestellt.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock-Qualitätszertifizierungen und Konformitätsdokumentation
content_certifications:
  tagline: Unsere Zertifizierungen
  title: 'Zertifizierte Qualität,<br />weltweit anerkannt'
  subtitle: '64 CE-zertifizierte Modelle und werksweite Zertifizierungen belegen unser Engagement für Qualität, Sicherheit und Umweltverantwortung.'
  items:
    - title: 'CE-zertifiziert'
      description: '64 CE-zertifizierte Modelle erfüllen die CE-Kennzeichnungsanforderungen der EU für Sportfahrzeuge und gewährleisten die Einhaltung von Sicherheits-, Gesundheits- und Umweltschutzstandards.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Unser Qualitätsmanagementsystem ist nach ISO 9001:2015 zertifiziert und deckt Design, Fertigung und Vertrieb von aufblasbaren Wasserfahrzeugen und Marineausrüstung ab.'
      icon: tabler:clipboard-check
    - title: 'UKCA-Kennzeichnung'
      description: 'Auf dem britischen Markt verkaufte Produkte tragen die UKCA-Kennzeichnung, die die Konformität mit den britischen Vorschriften für Marineausrüstung und private Wasserfahrzeuge bestätigt.'
      icon: tabler:shield
    - title: 'BSCI-konform'
      description: 'Paddle Board Overstock ist nach BSCI (Business Social Compliance Initiative) auditiert und belegt damit ethische Fertigungspraktiken, faire Arbeitsbedingungen und Verantwortung in der Lieferkette.'
      icon: tabler:heart-handshake
    - title: 'REACH-konform'
      description: 'Alle in Paddle Board Overstock-Produkten verwendeten Materialien entsprechen der EU-REACH-Verordnung zur chemischen Sicherheit — ohne beschränkte Substanzen in unserem PVC, Hypalon oder den Komponenten.'
      icon: tabler:flask
    - title: 'Materialprüfung'
      description: 'Gewebe werden auf Zugfestigkeit, Reißfestigkeit, UV-Abbau und Kältebruchverhalten geprüft. Jede Produktionscharge wird beprobt und verifiziert.'
      icon: tabler:test-pipe
content_factory:
  tagline: Werksstandards
  title: 'Fertigungsexzellenz<br />— präzise nach Spezifikation'
  subtitle: 'Unsere 12.000 m² große Anlage arbeitet in jeder Produktionsphase nach strengen Qualitätskontrollprotokollen.'
  list:
    - 'Wareneingangskontrolle: Alle Rohmaterialien — PVC-Gewebe, Hypalon, Aluminium, Sperrholz, Klebstoffe — werden vor dem Einsatz in der Produktion gegen die Spezifikationen geprüft.'
    - 'Prozessbegleitende Qualitätskontrolle: Jede Produktionsstufe hat dokumentierte QC-Prüfpunkte. Schweißnahtfestigkeit, Nahtausrichtung, Ventilmontage und Anzugsdrehmomente werden inline verifiziert.'
    - 'Druckprüfung: Jede aufblasbare Kammer wird 24 Stunden lang bei 1,25× Nenndruck geprüft. Die Leckrate muss für eine bestandene Prüfung null betragen.'
    - 'Endkontrolle: Fertigprodukte werden vor dem Versand auf Maßhaltigkeit, optische Oberflächenqualität, Vollständigkeit des Zubehörs und Verpackungsintegrität geprüft.'
    - 'Chargenrückverfolgbarkeit: Jedes Produkt trägt eine Seriennummer, die mit den Produktionschargen verknüpft ist und eine vollständige Rückverfolgbarkeit vom Rohmaterial bis zum Fertigprodukt ermöglicht.'
content_safety:
  tagline: Sicherheitsnormen für Wasserfahrzeuge
  title: 'Sicherheit an erster Stelle<br />— für zuverlässigen Betrieb entwickelt'
  subtitle: 'Paddle Board Overstock-Produkte werden entwickelt und getestet, um internationale Sicherheitsnormen für Wasserfahrzeuge im gewerblichen und Freizeitbereich zu erfüllen.'
  items:
    - title: 'ISO 6185'
      description: 'Schlauchboote entsprechen den Normen ISO 6185 für Konstruktion, Stabilität, Auftrieb und Tragfähigkeit.'
      icon: tabler:sailboat
    - title: 'ABYC-Normen'
      description: 'Elektro- und Kraftstoffsysteme folgen den ABYC-Normen (American Boat & Yacht Council) für sichere Installation und Betrieb.'
      icon: tabler:bolt
    - title: 'SOLAS-Konformität'
      description: 'Sicherheitsausrüstung und Rettungsmittel erfüllen die SOLAS-Anforderungen (Safety of Life at Sea), soweit anwendbar.'
      icon: tabler:lifebuoy
cta:
  title: 'Benötigen Sie zertifizierte Produkte für Ihr Projekt?'
  subtitle: 'Kontaktieren Sie unser Team, um Zertifizierungsanforderungen, Dokumentation und Konformität für Ihren Markt zu besprechen.'
  actions:
    - variant: primary
      text: Zertifizierungsunterlagen anfordern
      href: /contact
    - text: Qualitätsseite ansehen
      href: /quality
