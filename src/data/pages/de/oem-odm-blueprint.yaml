faq:
  title: OEM/ODM — Häufig gestellte Fragen
  questions:
    - q: Was ist die Mindestbestellmenge (MOQ) für kundenspezifische aufblasbare SUPs?
      a: Für Standardmodelle mit vorhandenen Formen beginnt MOQ bei 5–10 Einheiten pro Design. Für vollständig kundenspezifische Formen und Werkzeuge beträgt MOQ typischerweise 200 Einheiten. Wir arbeiten mit Start-ups und aufstrebenden Marken zusammen, um machbare Einstiegspunkte zu finden.
    - q: Wie lange dauert der OEM Probenprozess?
      a: Standardprototypmuster werden innerhalb von 7–14 Arbeitstagen nach Designfreigabe fertiggestellt. Eilaufträge können gegen eine zusätzliche Gebühr auf 5–7 Tage priorisiert werden.
    - q: Was ist der Unterschied zwischen PVC und Hypalon bei aufblasbaren Booten?
      a: PVC ist leichter, günstiger und bietet ausgezeichnete Flexibilität bei Kälte. Hypalon (CSM) bietet überlegene UV- und Ozonbeständigkeit mit einer längeren Lebensdauer (10–15 Jahre gegenüber 5–8 Jahren). Wir empfehlen PVC für die meisten Freizeit-Anwendungen und Hypalon für kommerzielle/professionelle Nutzung.
    - q: Können Sie die Form und das Design des aufblasbaren Produkts anpassen?
      a: Ja. Unser F&E-Team kann kundenspezifische Formen für jede Rumpfform, Plattenkontur oder Rohrkonfiguration entwickeln. Wir verwenden CNC-bearbeitete Aluminiumformen für Präzision und Konsistenz.
    - q: Bieten Sie Fabriksaudit-Dienstleistungen an?
      a: Wir begrüßen Vor-Ort- und externe Werksprüfungen in unserer 12.000 m² großen Einrichtung in Qingdao. Wir verfügen über ISO 9001- und BSCI-Zertifizierungen und können Prüfberichte auf NDA bereitstellen.
    - q: Welche Versandbedingungen bieten Sie an?
      a: Wir bieten FOB Qingdao (Standard), CIF und DDP Versandbedingungen an. Das Beladen von Containern und die vollständige Exportdokumentation sind in allen OEM Aufträgen enthalten.
content_profiles:
  tagline: Markenprofile
  title: OEM / Eigenmarkenfertigung<br />Nach Kundentyp
  subtitle: Verschiedene Markenprofile haben unterschiedliche Anforderungen – wir passen unsere OEM/ODM-Dienstleistungen an Ihr Geschäftsmodell, Ihre Größe und Ihre Markteinführungsstrategie an.
  items:
    - title: Start-up-Wasserfahrzeugmarken
      subtitle: Niedrig MOQ, schnelle Steigerung
      description: Unternehmer und Gründer, die ihre erste Reihe von SUPs, Kajaks oder Schlauchbooten auf den Markt bringen. Sie benötigen einen Fertigungspartner, der Ihre Marke wie seine eigene behandelt – mit niedrigen Einstiegshürden, flexiblen Losgrößen und praktischer Designunterstützung bei jedem Schritt.
      features:
        - MOQ so niedrig wie 50–100 Einheiten pro SKU, nicht Tausende
        - Vorhandene Formenbibliothek, um Werkzeugkosten zu vermeiden
        - 'Komplettes Markenpaket: Logo, Tubengrafiken, Verpackung, Anhängeschilder'
        - Sample-First-Workflow — vor der Produktion freigeben
    - title: Etablierte Marine-Marken
      subtitle: OEM Skala mit CE/ISO Konformität
      description: Bestehende Boots-, PWC- oder Marinezubehörmarken, die aufblasbare Wasserfahrzeuge in ihr Portfolio aufnehmen. Sie benötigen gleichbleibende Qualität über die Produktionsserien hinweg, die Einhaltung von Vorschriften für globale Märkte und die Fähigkeit, kundenspezifische Rümpfe oder Schlauchformen mitzuentwickeln.
      features:
        - Maßgeschneiderte 3D-Formenentwicklung für proprietäre Designs
        - CE 2013/53/EU, UKCA, USCG Konformitätsdokumentation
        - BSCI Prüfberichte zur Einhaltung sozialer Standards bei Einzelhändlern
        - Dedizierte Kontoverwaltung + vorrangige Produktionsslots
    - title: DTC- und E-Commerce-Marken
      subtitle: Verbrauchsfertige Verpackung in großem Maßstab
      description: Online-first-Marken, die über Amazon, Shopify oder ihre eigenen Webshops verkaufen. Verpackung, Auspack-Erlebnis und konstante Produktqualität sind entscheidend. Sie benötigen eine Fabrik, die die Dynamik von Geschwindigkeit und Rücklaufquoten im E-Commerce versteht.
      features:
        - Einzelhandelsfertiges Boxdesign + Einsteckkarten-Druck
        - Vakuumverpackung / Palettierung für kostengünstigen Versand
        - EAN / UPC-Strichcode und zollfertige Dokumentation
        - Konsolidierung von Mischcontainern zur Optimierung der Gesamtkosten
    - title: Lifestyle- und Outdoor-Marken
      subtitle: White-Label-Design + Kategorieerweiterung
      description: Bekleidung, Outdoor-Ausrüstung oder Reise-Marken, die unter ihrem eigenen Label in die Kategorie Wassersport einsteigen. Sie verfügen möglicherweise nicht über hausinterne Expertise in der Meerestechnik – daher benötigen Sie einen Partner, der Sie vom Konzept bis zum Container mit minimalen Reibungsverlusten begleiten kann.
      features:
        - Trendrecherche und Konzept-Moodboards
        - Co-Branding-Limited Editions und saisonale Farbvarianten
        - Design-to-Sample-Zyklus in 10–14 Werktagen
        - 'End-to-End-Logistik: Fabrik → Lager → Verbraucher'
