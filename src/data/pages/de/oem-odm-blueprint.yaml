process_steps:
  title: 6-Schritte-OEM/ODM-Prozess
  subtitle: Vom Designbrief bis FOB Qingdao — ein optimierter Arbeitsablauf
  steps:
    - number: '01'
      title: Designbrief & 3D-CAD-Modellierung
      description: Teilen Sie Ihre Zielvorgaben, Ihr Referenzprodukt oder Konzept. Unser Ingenieurteam erstellt detaillierte CAD-Zeichnungen und 3D-Renderings zur Genehmigung.
      timeline: 3–5 Tage
    - number: '02'
      title: Materialauswahl & Stoffprüfung
      description: Wählen Sie zwischen militärischer Qualität PVC (0,9–1,2 mm), Hypalon CSM oder drop-stitch Kernstoffen. Wir führen Zugfestigkeitsprüfungen, Beschichtungsadhäsion und UV Stabilitätstests durch.
      timeline: 2–3 Tage
    - number: '03'
      title: Schnellprototypen & Musterproduktion
      description: Wir CNC-Maschinen fertigen kundenspezifische Formen und produzieren Vorserienmuster mit Ihren Markenfarben, Logo und angegebenen Materialien. Muster werden zur Genehmigung versandt.
      timeline: 7–14 Tage
    - number: '04'
      title: 24–48 Stunden Hochdruckhalte-Test
      description: Jeder Prototyp durchläuft rigorose Druckhalteprüfungen bei 1,25-fachem Nenn- druck. Nahtabziehprüfungen und Maßverifikationen werden durchgeführt.
      timeline: 1–2 Tage
    - number: '05'
      title: CE/ISO Qualitätskontrolle & Verpackung
      description: 100-Punkte-Qualitätscheckliste. Jede Einheit wird vor der verpackungsfertigen Auslieferung überprüft. CE Konformitätserklärung und BSCI Konformitätsbericht enthalten.
      timeline: 2–3 Tage
    - number: '06'
      title: FOB Qingdao Versand & Logistik
      description: Fertige Waren palettiert, in Schrumpffolie verpackt und im Container am Hafen von Qingdao verladen. Vollständige Exportdokumentation, Zollabfertigung und Echtzeitverfolgung.
      timeline: 7–14 Tage
