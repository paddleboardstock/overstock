overview_section:
  tagline: Marktübersicht
  title: Der brasilianische SUP Markt
  paragraphs:
    - Brasilien ist einer der natürlichsten Stand-up-Paddle-Märkte der Welt. Strandkultur ist nationale Kultur – von der Stand-Up-Paddle-Szene an den Lagunen Rios und der Mischung aus Surf und Flachwasser von Florianópolis bis zu den warmen, ruhigen Gewässern des Nordostens in Ceará, Pernambuco und Bahia. Paddelschulen, Lagunenmietungen sowie Downwind- und SUP Surf-Gemeinschaften stammen alle aus einer riesigen, sportbegeisterten Bevölkerung.
    - Brasilianische Käufer sind typischerweise von Eigentümern geführte Unternehmen – Mietstande an der Lagune, Strandschulen, Surfläden, die SUP Schlangen hinzufügen, und wachsende inländische E-Commerce-Verkäufer. Sie bestellen in kleinen Chargen (5–20 Bretter) und legen Wert auf Haltbarkeit für den täglichen Gebrauch und Preiswettbewerbsfähigkeit in einem Markt mit erheblichen Importkosten.
  customer_types:
    - title: Lagunen- und Strandschulen
      description: Schulen und Vermieter an Rios Lagunen und den ruhigen Wasserstränden des Nordostens bieten Unterricht und Stundenvermietungen an.
    - title: Surfshops
      description: Etablierte Surfhändler fügen Flachwasser hinzu und bieten SUP Touren für die lokale Paddelgemeinschaft.
    - title: Online-Verkäufer
      description: Inländische E-Commerce-Verkäufer importieren SUP Waren, um Brasiliens riesigen Binnenmarkt zu bedienen.
shipping_section:
  title: Schiff nach Brasilien
  paragraphs:
    - Bestellungen werden von Weihai, China, versandt. Express-Luftfracht transportiert Proben und 1–3 Boarding-Bestellungen zu den wichtigsten Flughäfen Brasiliens; Consolidated Sea Freight bedient 5–20 Großhandelsaufträge über Häfen wie Santos und andere Küstengateways. Transit-Schätzungen für Ihr Ziel sind in Ihrem Angebot enthalten.
    - Wir stellen die für die Abfertigung erforderliche Handelsrechnung und Verpackungsliste bereit, mit korrekten HS-Codes und deklarierten Werten. Einfuhrzölle und Steuern werden vom Importeur nach brasilianischen Regeln zu zahlen.
  customs_note: Die Einfuhrsteuern auf Sportartikel in Brasilien sind erheblich und variieren je nach Produktklassifizierung. Bestätigen Sie vor der Bestellung den aktuellen Zoll, die Mehrwertsteuer und etwaige staatliche Gebühren bei Ihrem Zollmakler (despachante) – wir stellen vollständige Unterlagen bereit, bündeln jedoch keine Importsteuern in Frachtangebote.
faq_section:
  title: Brasilien FAQ
  items:
    - q: Können Angebote und Unterstützung auf Portugiesisch abgewickelt werden?
      a: Ja – wir arbeiten mit portugiesischsprachigen Käufern. Fragen Sie Ihre Anfrage an, und wir übernehmen Ihr Angebot und Ihre Bestellung auf Portugiesisch.
    - q: Sind die Einfuhrsteuern Brasiliens in Ihren Preisen enthalten?
      a: Nein. Einfuhrzölle, Mehrwertsteuer und Steuern auf Landesebene liegen in der Verantwortung des Importeurs gemäß brasilianischen Vorschriften. Wir geben Preise und Frachtkosten klar und getrennt an und stellen die Unterlagen, die Ihr Despachant benötigt.
    - q: Wie sieht eine erste Bestellung für eine brasilianische Strandschule aus?
      a: 'Typischerweise 5–15 Boards: robuste Allround-Modelle für Unterricht und stundenweise Vermietung sowie ein paar Premium-Editionen für den Einzelhandel. Gemischte Modelle in einer Lieferung, Preis nach Gesamtmenge.'
    - q: Versenden Sie Seefracht nach Brasilien?
      a: Ja — konsolidierte Seefracht dient brasilianischen Häfen für Großbestellungen von 5–20 Boards, angeboten nach Zielort. Expressluftfracht ist für Muster und dringende Kleinbestellungen verfügbar.
