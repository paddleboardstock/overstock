testimonials:
  - category: Vereine
    name: Ricardo Santos
    title: Inhaber, Algarve Surf Academy
    location: Lagos, Portugal
    content: Begonnen haben wir mit dem Club Starter Package für unsere Surfschule. 20 Boards, Paddel, Westen – alles innerhalb von 3 Wochen angekommen. Nach zwei Saisons haben wir ein Upgrade auf das Pro-Paket durchgeführt. Das individuelle Branding mit unserem Logo hat unser professionelles Image entscheidend verändert.
    rating: 5
    product: Club-Starterpaket
    source: solutions/clubs
  - category: Vereine
    name: Clubbesitzer
    title: Wassersportverein
    location: Phuket, Thailand
    content: Das Club-Starterpaket war der perfekte Einstieg. Als unser Geschäft wuchs, wuchs Aquafarer mit uns – gleiche Qualität, gleiche Preise, keine Überraschungen. Wir sind in 18 Monaten von 10 auf 80 Boards gewachsen.
    rating: 5
    product: Club-Starter + Premium-Paket
    source: success-stories
  - category: Resorts
    name: Resort-Generaldirektor
    title: 5-Sterne-Strandresort
    location: Griechenland
    content: Aquafarer hat nicht nur Boards geliefert – sie haben uns dabei geholfen, ein umfassendes Gästeerlebnis zu schaffen. Unser Wassersportprogramm hat sich in einer Saison von Null zum Resort-Highlight entwickelt. Über 300 wöchentliche Buchungen und ein Jahresumsatz von 180.000 US-Dollar.
    rating: 5
    product: Resort-Premium-Paket
    source: success-stories
  - category: Resorts
    name: Sophie Laurent
    title: Direktor für Gästeerlebnis, Azure Bay Resorts
    location: Phuket, Thailand
    content: Aquafarer hat unser gesamtes Strandaktivitätsprogramm in drei Resortanlagen entworfen und ausgestattet. 80 SUPs, 40 Kajaks, Sicherheitsinfrastruktur und Personalschulung – alles in einer Lieferung geliefert. Die Gastbeteiligung stieg in der ersten Saison um 60 %.
    rating: 5
    product: Resort-Premium-Paket
    source: solutions/resorts
  - category: Unternehmer
    name: Michael Park
    title: Gründer, Shoreline Paddle Co.
    location: Kalifornien, USA
    content: Ich habe meine SUP-Marke ohne jegliche Branchenerfahrung gegründet. Das Team von Aquafarer hat mich von der Produktauswahl bis zum individuellen Logodesign und der Verpackung begleitet. Mein erster Container kam nach 11 Wochen an und war bei Amazon innerhalb von 3 Monaten ausverkauft.
    rating: 5
    product: Starter-Markeneinführung
    source: solutions/entrepreneurs
  - category: Unternehmer
    name: Gründer
    title: Australische SUP-Marke
    location: Australien
    content: Ich hatte die Markenidee, aber keine Kenntnisse in der Herstellung. Aquafarer hielt mich während des gesamten Prozesses buchstäblich an der Hand – von der Auswahl des richtigen Boarddesigns bis zum Auspacken meiner ersten Lieferung. 90 Tage vom Traum bis zur Lieferung.
    rating: 5
    product: Markeneinführungspaket
    source: success-stories
  - category: Vermietung
    name: Daniel Okonkwo
    title: Eigentümer, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Ich habe 5 Boards von einem örtlichen Geschäft gemietet und 60 % meines Umsatzes an sie verloren. Aquafarer hat mir geholfen, meine eigene Flotte von 15 SUPs aufzubauen. Der ROI-Rechner zeigte den Break-Even in 4 Monaten an – es dauerte 3. Jetzt erweitere ich auf 30 Boards.
    rating: 5
    product: Flotten-Starterkit
    source: solutions/rental-business
  - category: Vermietung
    name: Marco Valenti
    title: Betriebsleiter, Adriatic Adventure Tours
    location: Dubrovnik, Kroatien
    content: Wir haben unsere gesamte Mietflotte mit Aquafarer-RIBs ausgestattet – 12 Boote an drei Standorten. Zwei Saisons später, null Ausfälle. Die CE-Zertifizierungsdokumentation ermöglichte eine reibungslose Versicherungsgenehmigung. Ihr Ingenieursteam hat sogar die Röhrenfarben angepasst.
    rating: 5
    product: Flottenerweiterungskit
    source: trust
  - category: Vermietung
    name: Oberleutnant Andres Reyes
    title: Beauftragter für maritime Beschaffung, Hilfskraft der philippinischen Küstenwache
    location: Manila, Philippinen
    content: Wir betreiben in unserer gesamten Küstenpatrouillenflotte 24 Aquafarer-RIBs. Ihr QC-Prozess ist bei jeder Charge gleich – jedes Mal dieselbe Nahtqualität, dieselbe Ventilplatzierung, dieselbe Druckstufe. Diese Wiederholbarkeit ist wichtig, wenn Leben von der Ausrüstung abhängen.
    rating: 5
    product: RIB-Patrouillenflotte
    source: trust
  - category: Verbraucher
    name: Sarah K.
    title: Erstmaliger SUP-Besitzer
    location: Lake Tahoe, USA
    content: Stabil auch für einen kompletten Anfänger. Habe es an meinem ersten Tag mit auf den See genommen und bin nie hingefallen. Durch das Komplettpaket mit Pumpe und Paddel war ich bereits 20 Minuten nach dem Öffnen der Box auf dem Wasser.
    rating: 5
    product: SUP Explorer 11
  - category: Verbraucher
    name: James Thornton
    title: Besitzer eines SUP Explorer 11
    location: Vancouver, Kanada
    content: Als Erstkäufer hatte ich Bedenken hinsichtlich der Qualität von Bestellungen aus dem Ausland. Die ISO-Dokumentation und die Testberichte Dritter, die sie uns zur Verfügung stellten, bevor ich überhaupt nachfragte, gaben mir volles Vertrauen. Das Board kam innerhalb von 6 Tagen an und hat meine Erwartungen übertroffen.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: Verbraucher
    name: Mike R.
    title: Freizeitkajakfahrer
    location: Berlin, Deutschland
    content: Solide Verarbeitungsqualität. Bewältigt Kabbelwasser an der Küste viel besser, als ich es von einem Schlauchboot erwartet hätte. Habe es für einen Wochenendausflug in den Kofferraum meines Autos gepackt – an der Rampe in weniger als 4 Minuten aufgeblasen.
    rating: 5
    product: Aufblasbares Kajak
