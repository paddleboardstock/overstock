testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Inhaber, Algarve Surf Academy
    location: Lagos, Portugal
    content: Begonnen haben wir mit dem Club Starter Package für unsere Surfschule. 20 Boards, Paddel, Westen – alles innerhalb von 3 Wochen angekommen. Nach zwei Saisons haben wir ein Upgrade auf das Pro-Paket durchgeführt. Das individuelle Branding mit unserem Logo hat unser professionelles Image entscheidend verändert.
    rating: 5
    product: Club-Starterpaket
    source: solutions/clubs
  - category: clubs
    name: Clubbesitzer
    title: Wassersportverein
    location: Phuket, Thailand
    content: Das Club-Starter-Paket war der perfekte Einstiegspunkt. Als unser Geschäft wuchs, wuchs Paddle Board Overstock mit uns — gleiche Qualität, gleiche Preise, keine Überraschungen. Wir skalierte von 10 auf 80 Boards in 18 Monaten.
    rating: 5
    product: Club-Starter + Premium-Paket
    source: success-stories
  - category: resorts
    name: Resort-Generaldirektor
    title: 5-Sterne-Strandresort
    location: Griechenland
    content: Paddle Board Overstock lieferte nicht nur Boards — sie halfen uns, ein vollständiges Gästeerlebnis aufzubauen. Unser Wassersportprogramm ging von null zum Highlight des Resorts in einer Saison. 300+ wöchentliche Buchungen und 180.000 $ Jahresumsatz.
    rating: 5
    product: Resort-Premium-Paket
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Direktor für Gästeerlebnis, Azure Bay Resorts
    location: Phuket, Thailand
    content: Paddle Board Overstock hat unser gesamtes Strandaktivitätsprogramm über drei Resort-Immobilien hinweg entworfen und ausgestattet. 120 SUPs, Sicherheitsinfrastruktur und Schulung des Personals — alles in einer Lieferung. Die Teilnahme der Gäste stieg in der ersten Saison um 60%.
    rating: 5
    product: Resort-Premium-Paket
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: Eigentümer, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Ich habe 5 Bretter von einem lokalen Geschäft gemietet und dabei 60% meines Umsatzes verloren. Paddle Board Overstock hat mir geholfen, meine eigene Flotte von 15 SUPs aufzubauen. Der ROI-Rechner zeigte Break-even in 4 Monaten — es dauerte 3. Jetzt erweitere ich auf 30 Bretter.
    rating: 5
    product: Flotten-Starterkit
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Betriebsleiter, Adriatic Adventure Tours
    location: Dubrovnik, Kroatien
    content: Wir haben unsere gesamte SUP-Verleihflotte mit Paddle Board Overstock-Brettern ausgestattet — 30 Bretter über drei Standorte. Nach zwei Saisons, null Ausfälle. Die gleichbleibende Qualität in jeder Charge machte unsere Wahl einfach, und ihr Team passte sogar die Farben an unsere Marke an.
    rating: 5
    product: Rental Fleet Package
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Inhaberin, Lake Garda SUP Rentals
    location: Lake Garda, Italien
    content: Unsere Verleihbretter werden in der Hauptsaison fünfmal am Tag ausgeliehen. Seitdem wir auf Paddle Board Overstock umgestiegen sind, gingen die Schadensmeldungen nahezu gegen null, und die Kunden fragen ständig, wo sie ihr eigenes Brett kaufen können.
    rating: 5
    product: Rental Fleet Package
    source: solutions/rental-business
  - category: consumers
    name: Sarah K.
    title: Erstmaliger SUP-Besitzer
    location: Lake Tahoe, USA
    content: Stabil auch für einen kompletten Anfänger. Habe es an meinem ersten Tag mit auf den See genommen und bin nie hingefallen. Durch das Komplettpaket mit Pumpe und Paddel war ich bereits 20 Minuten nach dem Öffnen der Box auf dem Wasser.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: Besitzer eines SUP Explorer 11
    location: Vancouver, Kanada
    content: Als Erstkäufer war ich nervös, aus dem Ausland zu bestellen. Die Verarbeitungsqualität sprach für sich, sobald ich es ausgepackt habe — steif, nahtlos, und es kam in nur 6 Tagen an.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Wochenend-Paddler
    location: Berlin, Deutschland
    content: Solide Verarbeitungsqualität. Bewältigt Kabbelwasser an der Küste viel besser, als ich es von einem Schlauchboot erwartet hätte. Habe es für einen Wochenendausflug in den Kofferraum meines Autos gepackt – an der Rampe in weniger als 4 Minuten aufgeblasen.
    rating: 5
    product: SUP Tropical Breeze
