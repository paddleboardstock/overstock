testimonial:
  content: Ich habe meine SUP-Marke ohne jegliche Branchenerfahrung gegründet. Das Team von Aquafarer hat mich von der Produktauswahl bis zum individuellen Logodesign und der Verpackung begleitet. Mein erster Container kam nach 11 Wochen an und war bei Amazon innerhalb von 3 Monaten ausverkauft. Ich bestelle jetzt meinen dritten Container.
  name: Michael Park
  title: Gründer, Shoreline Paddle Co. – Kalifornien, USA
content_segments:
  tagline: Unternehmerprofile
  title: Einführung einer Wassersportmarke<br />Nach Unternehmertyp
  subtitle: Verschiedene Gründer haben unterschiedliche Stärken – E-Commerce-Expertise, Branchenverbindungen, Content-Reichweite oder Vertriebsinfrastruktur. Wir passen das OEM/ODM-Einführungsprogramm an Ihre Ausgangsposition und Ihre Wachstumsambitionen an.
  items:
    - title: Amazon FBA- und E-Commerce-Verkäufer
      subtitle: Datengesteuerte, schnell skalierende Markenaufbauer
      description: Erfahrene Online-Verkäufer, die Wassersportprodukte auf Amazon, Walmart oder ihren eigenen Shopify-Shops einführen. Sie wissen, wie man Angebote optimiert, PPC verwaltet und Kategoriedaten liest – aber Sie brauchen einen Produktionspartner, der die Geschwindigkeit des E-Commerce, die Rücklaufquoten und saisonale Nachfrageschwankungen versteht.
      features:
        - Handelsfertige Verpackung, optimiert für FBA-Maßbegrenzungen
        - EAN/UPC-Barcode-Erstellung und Amazon-konforme Dokumentation
        - Niedrige MOQ (2–5 Einheiten pro SKU für RIB, 5–10 für SUP) zur Testung der Nachfrage vor der Skalierung
        - Konsolidierung gemischter Container zur Optimierung der Stücklandekosten
    - title: Fitness- und Outdoor-Lifestyle-Influencer
      subtitle: Zielgruppenorientierte Markenschöpfer
      description: Content-Ersteller, Fitnesstrainer und Outdoor-Persönlichkeiten mit einem engagierten Publikum, das bereit ist, sich an einer Lifestyle-Marke zu beteiligen. Sie bringen die Community und die Markengeschichte mit – wir kümmern uns um Produktentwicklung, Compliance, Verpackung und Logistik, damit Sie sich auf Inhalte und Konvertierung konzentrieren können.
      features:
        - 'Schnelles Custom Branding: 2-wöchiger Musterzyklus mit Logo + Farben'
        - Co-gebrandete limitierte Editionen und saisonale Farbvarianten
        - Unterstützung bei Lifestyle-Fotografie und Produktion von Videoinhalten
        - 'Direct-to-Consumer-Abwicklung: Drop-Shipping ab Werk → zum Kunden'
    - title: Regionale Vertriebshändler gehen direkt zum Verbraucher
      subtitle: B2B-Betreiber führen ihre eigene Marke ein
      description: Etablierte Vertriebshändler für Marine- oder Outdoor-Ausrüstung, die neben oder anstelle des Weiterverkaufs von Produkten Dritter ihre eigene Marke einführen möchten. Sie verfügen bereits über eine Lagerinfrastruktur, Logistikbeziehungen und einen Kundenstamm – Sie benötigen einen Fabrikpartner, der Handelsmarkenqualität in großem Maßstab liefern kann.
      features:
        - Exklusive Produktdesigns für Ihr Marktgebiet
        - Komplette OEM-Werkzeugentwicklung für proprietäre Formen und Spezifikationen
        - Lokalisierte Konformitätsdokumentation (CE, UKCA, USCG) für Ihre Region
        - 'Co-gebrandete Verpackung: Distributorenmarke + Aquafarer-Qualitätszeichen'
    - title: Erstmalige Markengründer
      subtitle: Geführte End-to-End-Markenbildung
      description: Leidenschaftliche Unternehmer ohne Erfahrung in der Wassersportbranche, die eine Marke von Grund auf aufbauen wollen. Sie brauchen einen Partner, der Ihnen in jeder Phase – von der Produktauswahl und -benennung bis hin zum Verpackungsdesign und der Erstverpackungslogistik – mit klaren Zeitplänen und transparenten Preisen zur Seite steht.
      features:
        - Beratende Produktauswahl aus über 50 bewährten Basisdesigns
        - 'Markenidentitätspaket: Namensfindung, Logo, Farbpalette, Verpackungsdesign'
        - Zeitplan von 60–90 Tagen vom Konzept bis zur ersten Lieferung
        - Dedizierter Projektmanager für Erstmarkeninhaber
