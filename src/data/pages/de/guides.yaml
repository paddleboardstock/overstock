hero:
  tagline: Führer
  title: Neu bei SUP?
  subtitle: Praktische Leitfäden, die Ihnen bei der Auswahl, Verwendung und Freude an aufblasbaren Wassersportgeräten helfen.
size_guide:
  tagline: Größe und Spezifikationen
  title: Finden Sie die richtige Größe für Ihre Bedürfnisse
  desc: Vergleichen Sie Produktabmessungen, Gewichtskapazitäten und empfohlene Verwendungszwecke. Egal, ob Sie ein Touren-SUP, ein kompaktes Kajak oder ein kommerzielles RIB benötigen – unser Größenratgeber hilft Ihnen bei der Auswahl der richtigen Passform.
  link_label: Vollständiger Leitfaden mit Produktspezifikationen →
  link: /size-guide
  cards:
    - title: SUP-Boards
      desc: Wählen Sie die Länge basierend auf Ihrem Gewicht und dem Verwendungszweck. Breitere Bretter (32 Zoll+) bieten mehr Stabilität. Längere Bretter (11–12 Fuß) bieten eine bessere Spurtreue für Touren.
    - title: Kajaks
      desc: Einzelkajaks (9 Fuß) für Alleinreisende und Flüsse. Tandemkajaks (12 Fuß) für zwei Paddler oder einen mit Ausrüstung. Überprüfen Sie immer die Gewichtskapazität.
    - title: Beiboote und RIBs
      desc: Wählen Sie die Länge nach Passagierzahl und Nutzung. Größere RIBs (4,5 m+) für Offshore- und Rettungszwecke. Kleinere Beiboote (2,7 m) als Tender und Angelplattformen.
