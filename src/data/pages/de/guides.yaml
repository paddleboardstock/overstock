hero:
  tagline: Führer
  title: Neu bei SUP?
  subtitle: Praktische Leitfäden, die Ihnen bei der Auswahl, Verwendung und Freude an aufblasbaren Wassersportgeräten helfen.
size_guide:
  tagline: Größe und Spezifikationen
  title: Finden Sie die richtige Größe für Ihre Bedürfnisse
  desc: Vergleichen Sie Brettabmessungen, Gewichtskapazitäten und empfohlene Verwendungen. Ob Sie ein stabiles Allround-Brett oder eine schnellere Touring-Form wünschen – unser Größenleitfaden hilft Ihnen, die richtige Passform zu wählen.
  link_label: Vollständiger Leitfaden mit Produktspezifikationen →
  link: /size-guide
  cards:
    - title: Allround SUP Bretter
      desc: Unsere etwa 11 Fuß langen Boards (32" breit) bieten ein Gleichgewicht aus Stabilität, Geschwindigkeit und Kapazität. Der 6-Zoll-drop-stitch-Kern bei 15 PSI sorgt dafür, dass das Deck für Paddler aller Niveaus steif bleibt.
    - title: Breite & Stabilität
      desc: Breitere Boards (32"+) bieten mehr Stabilität für Anfänger, Yoga und Angeln. 6 Zoll Dicke sorgt für Steifigkeit und Tragfähigkeit für den Fahrer plus Ausrüstung.
    - title: Pakete & Zubehör
      desc: Jedes Board wird als komplettes Paket geliefert – Board, Reiserucksack, Handpumpe, verstellbares Paddel, abnehmbare Finne, Spiral-Leash und Reparaturset. Überprüfen Sie die maximale Belastung für Fahrer plus Ausrüstung.
