content_benefits:
  tagline: Vorteile der Partnerschaft
  title: Warum Vertriebspartner<br />Aquafarer wählen
  subtitle: Eine Partnerschaft für Schiffshändler, die zuverlässige Lieferung, wettbewerbsfähige Margen und professionelle Unterstützung benötigen.
  items:
    - title: Gebietsschutz
      description: Exklusive oder halbexklusive Gebietsrechte für qualifizierte Vertriebshändler. Marktkartierung und Kanalkonfliktmanagement zum Schutz Ihrer Investition in den Aufbau der Marke Aquafarer in Ihrer Region.
      icon: tabler:map-pin
    - title: Wettbewerbsfähige Großhandelspreise
      description: Gestaffelte Preise basierend auf jährlichen Mengenverpflichtungen. Margenschützende Preisstruktur mit Vorabpreisgarantien und transparenten Kostenaufschlüsselungen (FOB Qingdao-Basis).
      icon: tabler:currency-dollar
    - title: Marketing-Support-Kit
      description: Professionelle Produktfotografie, Spezifikationsblätter, Compliance-Dokumentationsvorlagen, Social-Media-Inhalte und Co-Branding-Marketingmaterialien. Wird jährlich mit neuen Produkteinführungen aktualisiert.
      icon: tabler:photo
    - title: Technische Schulung
      description: Produktschulungen für Ihr Vertriebsteam (virtuell oder vor Ort), Wartungs- und Reparaturschulungen für Ihre Servicetechniker sowie kundenorientierte FAQ- und Fehlerbehebungsleitfäden.
      icon: tabler:school
    - title: Ersatzteile und Kundendienst
      description: Spezielle Ersatzteilversorgung mit vorrangigem Versand. Für eine schnelle Auftragsabwicklung stehen Ersatzrohrabschnitte, Ventile, Rippen und Reparatursätze zur Verfügung. Unterstützung bei der Bearbeitung von Garantieansprüchen.
      icon: tabler:tool
    - title: Compliance-Dokumentation
      description: 'Komplettes Compliance-Dokumentationspaket für Ihren Markt: CE-Konformitätserklärung, Herstellerschilddaten, Bedienungsanleitungen und Unterstützung bei der behördlichen Registrierung. Eliminiert Ihren Compliance-Aufwand.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Was wir suchen
  title: <br />Anforderungen an den Vertriebspartner
  subtitle: Wir suchen Partner, die Aquafarer-Produkte in ihrem Gebiet professionell vertreten und unterstützen können.
  items:
    - title: Gebiets- und Marktkenntnisse
      description: Etablierte Präsenz auf dem Marine-, Wassersport- oder Outdoor-Freizeitmarkt. Verständnis der örtlichen Vorschriften, Verbraucherpräferenzen und Vertriebskanäle für Wasserfahrzeugprodukte.
      icon: tabler:target
    - title: Branchenerfahrung
      description: Mindestens 2 Jahre Erfahrung im Vertrieb von Marine-, Outdoor- oder Sportausrüstung. Nachgewiesene Erfolgsbilanz bei internationalen Marken und B2B-Großhandelsgeschäften.
      icon: tabler:briefcase
    - title: Ausstellungsraum oder Lager
      description: Physische Einrichtung für Produktpräsentation, Lagerhaltung und Kundenservice. Möglichkeit zur Verwaltung von Demoeinheiten und Ersatzteilbeständen für Ihr Gebiet.
      icon: tabler:building-store
    - title: Verpflichtung zu Markenstandards
      description: Bereitschaft, die Präsentationsstandards der Marke Aquafarer einzuhalten, Kundensupport gemäß unseren Serviceprotokollen bereitzustellen und an jährlichen Produktschulungsaktualisierungen teilzunehmen.
      icon: tabler:star
content_process:
  tagline: Bewerbungsprozess
  title: 4-stufiger Händler-Bewerbungsprozess
  subtitle: Von der ersten Anfrage bis zur ersten Lieferung – ein unkomplizierter Onboarding-Prozess.
  steps:
    - number: '01'
      title: Erstanfrage und Qualifizierung
      description: Reichen Sie Ihre Vertriebspartnerbewerbung mit Unternehmensdetails, Interessengebiet, aktuellen Produktlinien und jährlichen Volumenschätzungen ein. Wir prüfen innerhalb von 5 Werktagen.
      timeline: 5 Tage
    - number: '02'
      title: Geschäftsbericht und Geschäftsbedingungen
      description: Virtuelles Treffen zur Besprechung der Gebietsstrategie, Preisstufen und Partnerschaftsbedingungen. Überprüfen Sie die Compliance-Dokumentationsanforderungen für Ihren Markt. NDA-Unterzeichnung bei Bedarf.
      timeline: 1-2 Wochen
    - number: '03'
      title: Musterbestellung und -bewertung
      description: Geben Sie zur Marktbewertung und Teamschulung eine Erstmusterbestellung (2–5 Einheiten) zum Händlerpreis auf. Vollständige Compliance-Dokumentation und Demo-Vorbereitung inklusive.
      timeline: 30-45 Tage
    - number: '04'
      title: Partnerschaftsstart und -unterstützung
      description: Erster Containerauftrag mit aktiviertem Gebietsschutz. Marketing-Kit geliefert, Vertriebsteam geschult und engagierter Account Manager zugewiesen. Laufende vierteljährliche Geschäftsberichte.
      timeline: Laufend
content_application_docs:
  tagline: Bewerbungsunterlagen
  title: Erforderliche Unterlagen<br />für die Händlerbewerbung
  subtitle: Um eine Aquafarer-Händlervertretung zu beantragen, bereiten Sie bitte die folgenden Unterlagen und Informationen für unser Prüfungsteam vor.
  items:
    - title: Gewerbeanmeldung / Handelsregisterauszug
      description: Gültige Gewerbeanmeldung mit Firmennamen, eingetragener Adresse und Geschäftsbereich, der den Vertrieb von Marine-, Sport- oder Outdoor-Ausrüstung umfasst.
      icon: tabler:file-text
    - title: Gebietsabdeckungsplan
      description: Angestrebtes geografisches Gebiet, bestehendes Einzelhandels- oder Vertriebsnetzwerk, Zielkundensegmente und geplantes Jahresvolumen nach Produktkategorie (RIB, SUP, Kajak).
      icon: tabler:map
    - title: Showroom- oder Lagerraumkapazität
      description: Physische Räumlichkeiten für Produktpräsentation, Lagerhaltung und Kundenservice. Fotos oder Grundrisse mit Demobereich und Lagerkapazität für Ersatzteile.
      icon: tabler:building
    - title: Nachweis der finanziellen Leistungsfähigkeit
      description: 'Bankreferenz oder Finanznachweis, der die Fähigkeit zur Erstbestellung eines Containers und zur Lagerhaltung bestätigt. Mindestauftrag: ein 20-Fuß-Container (10–20 Einheiten, gemischte Modelle).'
      icon: tabler:coin
    - title: Kapazität für Kundendienst
      description: Servicetechniker, die für die Wartung und Reparatur von Schlauchbooten ausgebildet sind oder ausgebildet werden können. Fähigkeit zur Bearbeitung von Garantieansprüchen und Zusicherung eines Ersatzteillagers.
      icon: tabler:tool
    - title: Referenzen bisheriger Marken
      description: Liste der aktuell oder zuvor vertriebenen Marken für Marine- oder Sportausrüstung. Kontaktreferenzen nach beiderseitigem Einverständnis verfügbar. Startups ohne frühere Vertriebserfahrung können mit stärkerer finanzieller Bindung qualifiziert werden.
      icon: tabler:users
faq:
  title: Händlerprogramm – Häufig gestellte Fragen
  questions:
    - q: Was ist die Mindestbestellmenge für Händler?
      a: Die Mindestbestellmenge für Händler beginnt bei 10–20 Einheiten pro Bestellung, mit Flexibilität für gemischte Modelle (RIB, aufblasbar, SUP). Zur Marktbewertung sind Erstmusterbestellungen von 2–5 Einheiten zum Händlerpreis möglich.
    - q: Bieten Sie exklusive Gebietsrechte an?
      a: Exklusive Gebietsrechte stehen qualifizierten Händlern zur Verfügung, die jährliche Mengenverpflichtungen erfüllen und Markenstandards einhalten. Für Schwellenländer sind auch semi-exklusive und nicht-exklusive Vereinbarungen verfügbar.
    - q: Welche Marketingunterstützung bieten Sie an?
      a: Wir bieten ein umfassendes Marketing-Kit mit professioneller Produktfotografie, Spezifikationsblättern, Compliance-Dokumentationsvorlagen, einer Social-Media-Inhaltsbibliothek und Co-Branding-Materialien. Wird jährlich mit neuen Produkteinführungen aktualisiert.
    - q: Wie werden Gewährleistungsansprüche abgewickelt?
      a: 'Händler sind die erste Anlaufstelle für Garantieansprüche. Wir sorgen für klare Garantiekriterien, Fotodokumentationsprotokolle und eine schnelle Ersatz- oder Gutschriftsabwicklung. Garantiebedingungen: 5 Jahre beschränkt auf Schlauchmaterial/Nähte/Rumpf des Bootes; 2 Jahre auf SUP und Zubehör.'
    - q: Kann ich Aquafarer-Produkte unter meiner eigenen Marke privat kennzeichnen?
      a: Ja, über unser OEM/ODM-Programm. Zu den Private-Label-Optionen gehören individuelle Röhrengrafiken, Konsolen-Branding, Einzelhandelsverpackungen und Compliance-Dokumentation unter Ihrem Markennamen. Weitere Informationen finden Sie auf unserer OEM/ODM-Services-Seite.
    - q: Welche Compliance-Dokumentation ist für Händler enthalten?
      a: Zu jeder Lieferung gehören modellspezifische CE-Konformitätserklärungen, Herstellerschilddaten, Bedienungsanleitungen und Versanddokumente. Wir bieten auch Unterstützung bei der behördlichen Registrierung für Ihr Gebiet und unterstützen Sie bei allen lokalen Compliance-Anforderungen.
