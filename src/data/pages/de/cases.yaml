  title: Echte Paddler, wahre Geschichten<br />— Paddle Board Overstock im Einsatz
  subtitle: Sehen Sie, wie Paddler, Familien und Abenteurer auf der ganzen Welt mit Paddle Board Overstock aufblasbaren Boards aufs Wasser gehen SUP .
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
