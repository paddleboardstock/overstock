features3_cases:
  tagline: Ausgewählte Fälle
  title: Maßgeschneiderte Lösungen<br />Für echte Herausforderungen
  isBeforeContent: false
  columns: 3
  items:
    - title: Tägliches Betriebs-Upgrade des Bali Diving Center
      customer: Blue Ocean Diving Center
      country: Indonesien
      industry: Kommerzielles Tauchzentrum
      challenge: Das Blue Ocean Diving Center auf Bali betrieb ein älteres Glasfaser-Tauchboot mit begrenztem Platz an Deck, schwierigem Einstieg für Taucher und hohem Wartungsaufwand unter tropischen Salzwasserbedingungen. Das Verladen der Ausrüstung war überfüllt, die Vorbereitungszeit war lang und die instabile Plattform führte zu Sicherheitsbedenken für internationale Touristen – darunter Ersttaucher und ältere Reisende. Das Zentrum führt täglich 3-5 Tauchausflüge an mehr als 200 Tagen im Jahr durch.
      solution: Paddle Board Overstock lieferte ein maßgeschneidertes 6,8 m langes professionelles Tauchboot RIB mit erweitertem Decklayout, das für die Aufbewahrung von Tauchausrüstung optimiert ist, einer breiten Tauchleiter aus Edelstahl, robusten Hypalon-Röhren für UV- und Salzwasserbeständigkeit, rutschfester Deckoberfläche und einer Tanklagerlösung. Die Konfiguration wurde um den täglichen Arbeitsablauf des Tauchzentrums herum entworfen und basiert nicht auf einem Standard-Freizeitboot-Layout.
      product: 6,8 m professionelles Tauchen RIB
      results: Der größere Arbeitsbereich verbesserte die Effizienz der Gerätevorbereitung. Taucher erlebten ein sichereres und einfacheres Einsteigen. Der Wartungsaufwand wurde erheblich reduziert. Das Zentrum gewann an Kapazität, um in der Hochsaison mehr Kunden mit größerer Zuversicht bedienen zu können. Der RIB wurde zur Grundlage des täglichen Tauchbetriebs.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Unser Tauchboot dient nicht nur dem Transport. Es ist die Grundlage unseres täglichen Handelns. Paddle Board Overstock RIB gibt unserem Team mehr Selbstvertrauen bei der täglichen Durchführung mehrerer Tauchausflüge.
      icon: tabler:lifebuoy
    - title: Professionelles RIB-Upgrade für das Phuket Dive Center
      customer: Ocean Explorer Tauchzentrum
      country: Thailand
      industry: Kommerzielles Tauchzentrum
      challenge: Das Ocean Explorer Diving Center in Phuket, Thailand, musste ein traditionelles Glasfaser-Tauchboot aufrüsten, das mit der wachsenden Kundennachfrage nicht Schritt halten konnte. Der begrenzte Platz an Deck machte die Vorbereitung der Ausrüstung ineffizient. Das schwierige Einsteigen stellte internationale Touristen vor Sicherheitsprobleme. Hohe Wartungsanforderungen unter tropischen Salzwasserbedingungen erhöhten die Betriebskosten. Das Zentrum führt mehrere tägliche Fahrten an mehr als 200 Tagen im Jahr durch.
      solution: Paddle Board Overstock lieferte ein maßgeschneidertes 6,8 m langes kommerzielles Tauchschiff RIB mit optimierter Arbeitsdeckanordnung für die Lagerung der Tauchflaschen, die Vorbereitung der Ausrüstung und die Bewegung der Taucher. Zu den Merkmalen gehörten eine breite Tauchleiter mit Handläufen aus Edelstahl, eine robuste Rohrkonstruktion aus UV-beständigen Materialien, rutschfester Bodenbelag, eine Tanklagerlösung, eine professionelle Konsole und Passagiersitze – alles konfiguriert für kommerzielle Taucheinsätze.
      product: 6,8 m kommerzielles Tauchen RIB
      results: Die größere Deckfläche ermöglichte eine schnellere Organisation der Ausrüstung und einen effizienteren täglichen Arbeitsablauf. Komfort und Sicherheit beim Einsteigen der Kunden wurden deutlich verbessert. Durch die Konstruktion in Marinequalität verringerten sich die Wartungsausfallzeiten. Das Tauchzentrum könnte in der Hochsaison mehr Kunden bedienen und professionelle Tauchdienstleistungen mit Zuversicht ausbauen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Für ein Tauchzentrum ist das Boot nicht nur ein Transportmittel. Es ist ein wichtiger Teil unseres täglichen Betriebs. Paddle Board Overstock RIB gibt unserem Team die Sicherheit, täglich mehrere Tauchausflüge sicherer und effizienter durchzuführen.
      icon: tabler:lifebuoy
    - title: Flotte der Europäischen Tauchzentren
      customer: BlueMed Tauchzentren
      country: Griechenland
      industry: Tauchen und Meerestourismus
      challenge: Erforderlich waren 12 tauchkonfigurierte RIBs für eine Kette von Tauchzentren auf mehreren griechischen Inseln. Jedes Boot benötigte eine maßgefertigte Tauchleiter, einen Tankspeicher für 8 Flaschen und eine stabile Plattform für den Einstieg von Tauchern ins Freiwasser. Die Flotte musste innerhalb von 60 Tagen zum Beginn der Touristensaison eintreffen.
      solution: Produzierte 12 RIB 520 Dive-Modelle mit integrierten Flaschenhaltern, Tauchleitern und extrabreiten Hypalon Rohren für Stabilität beim Einsteigen. Jedes Boot wurde mit der Flottenlackierung des Kunden versehen. Alle 12 Boote wurden innerhalb von 55 Tagen druckgeprüft und ab Qingdao versandt.
      product: RIB 520 Tauchgang
      results: Alle 12 Boote wurden pünktlich zur Touristensaison geliefert. Die Flotte ist seit mehr als 18 Monaten im täglichen Betrieb, ohne Materialausfälle. Der Kunde bestellte im zweiten Jahr 6 zusätzliche Einheiten.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Der RIB 520 Dive war das Rückgrat unseres täglichen Tauchbetriebs. Die Stabilität im Ruhezustand ist ausgezeichnet und die Anordnung der Tanklager sorgt dafür, dass das Deck für unsere Gäste sauber und sicher bleibt.
      icon: tabler:lifebuoy
    - title: Australisches Vertriebspartnerprogramm OEM
      customer: Pacific Watersports Pty Ltd
      country: Australien
      industry: OEM/ODM Herstellung
      challenge: Der australische Händler benötigte ein Private-Label-SUP-Board-Sortiment zu wettbewerbsfähigen Preisen, um mit chinesischen Direct-to-Consumer-Marken konkurrieren zu können. Erforderlich sind 8 einzigartige Modelle für Anfänger bis Fortgeschrittene, mit individueller Grafik, individueller Verpackung und Direktversand an Einzelhandelsgeschäfte.
      solution: Entwicklung von 8 SUP Modellen (Allround, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) mit exklusivem australischen Grafikpaket. Individuelle Einzelhandelsverpackung mit QR-Codes, die auf Einrichtungsvideos verweisen. Drop-Ship-Logistik konfiguriert von Qingdao direkt zu australischen Einzelhandelsgeschäften.
      product: Benutzerdefinierte SUP-Linie (8 Modelle)
      results: Vom Konzept bis zur ersten Lieferung in 90 Tagen. Einzelhandelsverkaufsrate von 85 % in der ersten Saison. Im zweiten Jahr erweiterte der Vertriebspartner seine Partnerschaft um die Schlauchbootlinie.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock lieferte in 90 Tagen eine komplette SUP-Linie – vom ersten Entwurf bis zur Verkaufsfläche. Die Qualität entspricht Marken, die zum doppelten Preis verkauft werden.
      icon: tabler:arrows-exchange
    - title: Versorgung mit Rettungsbooten für den Nahen Osten
      customer: Nationale Zivilschutzbehörde
      country: Vereinigte Arabische Emirate
      industry: Suche und Rettung
      challenge: Die Zivilschutzorganisation benötigte 20 patrouillenbereite RIBs für die Suche und Rettung an der Küste, die Hafensicherheit und den Hochwasserschutz. Erforderliche selbstlenzende Decks, vollständige Navigationssysteme (GPS, Radar, VHF), gut sichtbare orangefarbene Röhren und die Einhaltung örtlicher Seevorschriften.
      solution: Im Lieferumfang sind 20 RIB 450 Patrol-Modelle mit selbstlenzendem Deck, Garmin-Navigationssystemen, LED-Suchscheinwerfern, SOLAS reflektierendem Band und gut sichtbaren orangefarbenen Hypalon Röhren enthalten. Jedes Boot wurde CE-zertifiziert und nach ISO 6185-Standards getestet. Das Dokumentationspaket enthielt Konformitätszertifikate für die lokale Registrierung.
      product: RIB 450 Patrouille
      results: Die Flotte ist auf 5 Küstenstationen verteilt. Die Boote wurden bei extremer Hitze (45 °C+) betrieben, ohne dass sich die Röhren verschlechterten. Patrouillenreichweite und Kraftstoffeffizienz übertrafen die Spezifikationen um 12 %.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: Die RIB 450 Patrol hat unsere betrieblichen Anforderungen übertroffen. Unter extremen Hitzebedingungen zeigen die Hypalon-Röhren nach 24 Monaten täglicher Nutzung keine Anzeichen einer UV-Verschlechterung.
      icon: tabler:alert-triangle
    - title: Europäische OEM Markenpartnerschaft
      customer: North Sea Marine Equipment BV
      country: Niederlande
      industry: OEM/ODM Herstellung
      challenge: Die etablierte europäische Marinemarke wollte in den RIB-Markt expandieren, ohne in Produktionsanlagen zu investieren. Benötigt wurde ein White-Label-Partner, der in der Lage ist, 5 RIB-Modelle (3,9 m bis 6,2 m) mit privatem Branding, CE-Zertifizierung und exklusiven EU-Vertriebsrechten herzustellen.
      solution: Etablierte White-Label-Herstellungsvereinbarung für 5 RIB Modelle. Jedes Modell ist mit Kundenlogos und Farbschema versehen. CE Zertifizierungsdokumentation für jedes Modell erstellt. Exklusive EU-Vertriebsrechte mit Mindestbestellverpflichtungen. Technische Dokumentation und Ersatzteilkatalog werden für das lokale Servicenetzwerk bereitgestellt.
      product: Benutzerdefinierte RIB-Linie (5 Modelle)
      results: Mehrjähriger Vertrag unterzeichnet. Versand der ersten Produktionsserie von 50 Einheiten innerhalb von 75 Tagen. Markeneinführung bei METSTRADE mit positivem Händlerempfang.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Durch die Zusammenarbeit mit Paddle Board Overstock konnten wir in den RIB-Markt eintreten, ohne eine Fabrik bauen zu müssen – sie lieferten eine komplette schlüsselfertige Lösung mit CE-Zertifizierung und Dokumentation zur Händlerunterstützung.
      icon: tabler:building
    - title: Karibik-Resort-Flotte
      customer: Paradise Island Resorts Ltd
      country: Bahamas
      industry: Meerestourismus und Gastgewerbe
      challenge: 'Das Luxusresort benötigte eine komplette Wassersportausrüstungsflotte für Gästeaktivitäten: 40 SUP Boards für geführte Touren, 20 Kajaks für die Erkundung der Lagune, 10 Schlauchboote für Gästetransfers und Angelausflüge sowie Zubehör. Die gesamte Ausrüstung benötigte ein individuelles Resort-Branding und musste vor der touristischen Hochsaison geliefert werden.'
      solution: 'Produziertes komplettes Wassersportpaket: 40 SUP Voyager-Boards (Allround-Modell), 20 Explorer-Kajaks, 10 AirDeck 360-Schlauchboote sowie Schwimmwesten, Paddel, Pumpen und Reparatursätze. Alle Geräte sind mit dem Resort-Logo und einem tropischen Farbschema bedruckt. Containerversand mit vollständigem Inventarmanifest.'
      product: Komplettes Wassersportpaket (70+ Einheiten)
      results: Die Flotte traf 6 Wochen vor der Hauptsaison ein. Die Gästezufriedenheitswerte für Wassersportaktivitäten stiegen im Jahresvergleich um 40 %. Die Ausrüstung hat drei Saisons lang gehalten und wurde nur routinemäßig gewartet.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Der Komplettpaket-Ansatz bedeutete, dass wir alles, was wir brauchten, in einer Lieferung erhielten – Bretter, Kajaks, Boote und Zubehör, alle gebrandet und bereit für die Nutzung durch die Gäste. Unsere Gäste lieben die Qualität der Ausstattung.
      icon: tabler:beach
    - title: Queensland Commercial Diving Centre RIB Upgrade
      customer: Kommerzielles Tauchzentrum
      country: Australien
      industry: Kommerzielle Tauch- und Marinedienstleistungen
      challenge: Ein in Queensland ansässiges kommerzielles Tauchzentrum, das auf Inspektionen der Meeresinfrastruktur, Hafeninstandhaltung und Unterwasserreparaturprojekte spezialisiert ist, betrieb ein in die Jahre gekommenes Arbeitsboot. Als die Projektnachfrage zunahm, wurde das alte Schiff zu einer Belastung – häufige Wartungsarbeiten führten zu Terminunterbrechungen, die Anordnung war nicht für moderne Taucheinsätze ausgelegt (begrenzter Platz für Flaschen, Werkzeuge und Ausrüstung) und der Komfort der Besatzung bei langen Einsätzen war schlecht. Das Unternehmen brauchte ein Schiff, das jeden Arbeitstag seinen professionellen Betrieb unterstützen konnte.
      solution: Paddle Board Overstock führte eine detaillierte Betriebsanalyse des Tauch-Workflows des Kunden, der typischen Projektdauer, der Besatzungsgröße und der Ausrüstungsanforderungen durch. Basierend auf dieser Analyse lieferte Paddle Board Overstock ein maßgeschneidertes professionelles RIB mit einem funktionalen Decklayout, das für die Vorbereitung der Ausrüstung und die Bewegung des Tauchers optimiert ist, professionellen Sitzen für längere Transportzeiten, erhöhter Stabilität für einen sichereren Ein- und Ausstieg des Tauchers und in das Design integrierten Funktionen zur Tauchunterstützung.
      product: Maßgeschneidertes professionelles Tauchen RIB
      results: Der neue RIB wurde zu einer zuverlässigen täglichen Arbeitsplattform. Durch das optimierte Layout wurde die Vorbereitung der Ausrüstung beschleunigt. Die Besatzung berichtete über verbesserten Komfort und Sicherheit bei langen Einsätzen. Das professionelle Erscheinungsbild des Bootes stärkte das Vertrauen der Kunden bei der Zusammenarbeit mit Hafenbetreibern und Schiffsunternehmern. Das Tauchzentrum gewann ein Schiff, das der Professionalität seines Dienstes entsprach.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Wir brauchten ein Boot, das unser Geschäft jeden Tag unterstützen konnte, und nicht nur ein Transportschiff. Paddle Board Overstock arbeitete mit uns zusammen, um unsere betrieblichen Anforderungen zu verstehen und lieferte eine RIB Lösung, die zu unserem kommerziellen Tauch-Workflow passt.
      icon: tabler:lifebuoy
    - title: Vertrag über die US-Küstenpatrouille
      customer: Sicherheitsbehörde für die Atlantikküste
      country: Vereinigte Staaten
      industry: Maritime Sicherheit und Strafverfolgung
      challenge: Die US-Küstensicherheitsbehörde benötigte hochbelastbare Patrouillen-RIBs für Abfangeinsätze im offenen Wasser. Erforderliche zweimotorige Konfiguration für Redundanz, gepanzerte Konsole zum Schutz der Besatzung, militärische Elektronik (verschlüsselte Kommunikation, FLIR, Radar) und Einhaltung der Vorschriften der US-Küstenwache.
      solution: Entwickelte RIB 600 Patrol mit zwei 115 HP-Außenbordkonfigurationen, gepanzerter Konsole mit ballistischem Schutz, FLIR-Wärmebildkamera, verschlüsselter VHF/UHF-Kommunikation und integrierten Waffenbefestigungspunkten. Rumpf verstärkt für Hochgeschwindigkeits-Abfangmanöver. Die gesamte Elektronik ist im Werk integriert und getestet. USCG Compliance-Dokumentation bereitgestellt.
      product: RIB 600 Patrouille (zweimotorig)
      results: Bei den Abnahmeversuchen erreichten die Boote eine Höchstgeschwindigkeit von 52 Knoten. Die Agentur meldete in den ersten 12 Monaten eine Missionsbereitschaftsrate von 95 %. Zusätzliche Bestellung für 8 Einheiten aufgegeben.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Der zweimotorige RIB 600 bietet unseren Besatzungen die Geschwindigkeit und Redundanz, die für Abfangeinsätze auf offenem Wasser erforderlich sind. Die gepanzerte Konsole bietet kritischen Schutz, ohne die Leistung zu beeinträchtigen.
      icon: tabler:shield
