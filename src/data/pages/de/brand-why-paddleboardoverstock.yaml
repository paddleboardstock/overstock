features3_reasons:
  tagline: Warum Paddle Board Overstock wählen
  title: 'Sieben Gründe für eine Partnerschaft mit uns'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Echte Fertigung, kein Handel'
      description: 'Wir besitzen und betreiben eine 12.000 m² große Fabrik. Als Partner von Paddle Board Overstock arbeiten Sie direkt mit den Menschen zusammen, die Ihre Produkte entwickeln, konstruieren und bauen – ohne Zwischenhändler.'
      icon: tabler:building-factory
    - title: '2. Engineering-getriebener Ansatz'
      description: 'Unser Designprozess beginnt mit dem Einsatzzweck, nicht mit der Produktkategorie. Wir optimieren Rumpfform, Materialauswahl und Konfiguration danach, wie das Boot tatsächlich genutzt wird.'
      icon: tabler:engine
    - title: '3. Zertifizierte Qualität'
      description: 'CE-zertifiziert, ISO-Qualitätssystem, BSCI-konform, REACH-konform, USCG-zugelassen. Unsere 64 CE-zertifizierten Modelle erfüllen internationale Standards – nicht nur Behauptungen.'
      icon: tabler:certificate
    - title: '4. Flexible OEM/ODM'
      description: 'Schlauchfarben, Konsolen-Layout, Branding, Verpackung – wir passen alles an Ihre Spezifikationen an. Kein Mindestbestelldruck. Beginnen Sie mit einem Prototyp und skalieren Sie mit Zuversicht.'
      icon: tabler:adjustments
    - title: '5. Globale Logistik'
      description: 'US-Lager in Kalifornien, direkter Versand aus Qingdao, Luftfracht für Eilaufträge. Wir übernehmen Zollformalitäten und Dokumentation.'
      icon: tabler:truck-delivery
    - title: '6. Lebenslanger Support'
      description: 'Wir unterstützen Boote, die wir vor 20 Jahren gebaut haben. Original-Ersatzteile, technische Beratung, Reparaturanleitungen – unser Team ist für Sie da, wenn Sie uns brauchen.'
      icon: tabler:lifebuoy
    - title: '7. Ehrliche Spezifikationen'
      description: 'Echte Tragfähigkeiten, echte Maße, echtes Gewicht. Keine Marketing-Übertreibungen. Was wir veröffentlichen, ist das, was Sie erhalten – durch unabhängige Tests verifiziert.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Von Marken weltweit geschätzt
  title: Was unsere Partner sagen
  items:
    - content: 'Wir haben mit mehreren Herstellern in China gearbeitet, aber Paddle Board Overstock sticht durch technischen Support und gleichbleibende Qualität hervor. Sie behandeln unsere Marke wie ihre eigene.'
      name: '— OEM-Partner, europäische Wassersportmarke'
    - content: 'Ihre Hypalon-RIBs sind seit über 5 Jahren in unserer Flotte im Einsatz. Minimaler Wartungsaufwand, hervorragende UV-Beständigkeit. Die 5-jährige Garantie auf die Schläuche gibt uns Sicherheit.'
      name: '— Flottenbetreiber, Resortgruppe im Nahen Osten'
    - content: 'Das Paddle Board Overstock-Team hat uns geholfen, ein individuelles SUP-Board-Design vom Konzept bis zur Produktion in 90 Tagen zu entwickeln. Die Qualität hat unsere Erwartungen übertroffen.'
      name: '— Distributor, australische Wassersportbranche'
