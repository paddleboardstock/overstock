features3_reasons:
  tagline: Warum Paddle Board Overstock wählen
  title: Sieben Gründe, mit uns zusammenzuarbeiten
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Echte Herstellung, kein Handel
      description: Wir besitzen und betreiben eine 12.000 m² große Fabrik. Wenn Sie bei Paddle Board Overstock kaufen, kaufen Sie direkt von den Menschen, die Ihr Board entwerfen, konstruieren und bauen – ohne Zwischenhändler, ohne Einzelhandelaufschlag.
      icon: tabler:building-factory
    - title: 2. Ingenieurgeführter Ansatz
      description: Unser Designprozess beginnt mit dem Anwendungsfall, nicht mit der Produktkategorie. Wir optimieren Rumpfform, Materialauswahl und Konfiguration für die tatsächliche Nutzung des Boards.
      icon: tabler:engine
    - title: 3. Bewährte Qualität
      description: Jedes Brett wird vor dem Versand zu 100 % einem Drucktest bei 1,25-facher Nennbelastung PSI unterzogen. Eine Fehlerfreiheit von 99,3 % – gemessen an jeder Charge, nicht nur behauptet.
      icon: tabler:shield-check
    - title: 4. Paddler-zuerst-Design
      description: 'Deckkunst, Farbserien, Zubehörhalterungen und Komplettpakete – Boards, die auf echtes Paddeln ausgelegt sind: Touring, Yoga, Angeln, Fitness und Familienspaß.'
      icon: tabler:swimming
    - title: 5. Globale Logistik
      description: Direkter Versand von unserer Fabrik in Weihai an Paddler in 50+ Ländern, mit vollständiger Sendungsverfolgung und Zollabwicklung.
      icon: tabler:truck-delivery
    - title: 6. Lebenslanger Support
      description: Wir unterstützen Platinen, die wir vor Jahren gebaut haben. Original-Ersatzteile, technische Beratung, Reparaturanleitungen – unser Team ist verfügbar, wenn Sie uns brauchen.
      icon: tabler:lifebuoy
    - title: 7. Ehrliche Spezifikationen
      description: Echte Tragfähigkeiten, echte Abmessungen, echtes Gewicht. Keine Marketingübertreibungen. Was wir veröffentlichen, ist das, was Sie erhalten – geprüft durch unabhängige Tests.
      icon: tabler:ruler-measure
testimonials:
  tagline: Vertrauenswürdig von Marken weltweit
  title: Was unsere Partner sagen
  items:
    - content: Mein Board kam fabrikfrisch mit allem im Karton an. Nach zwei Saisons wöchentlichen Paddelns hält es immer noch perfekt die Luft.
      name: — Sarah M., Wochenend-Paddlerin, Florida
    - content: Ich habe wochenlang die Spezifikationen verglichen, bevor ich kaufte. Paddle Board Overstock war die einzige Marke, die echte Gewichte und echten Druck veröffentlichte. Was sie auflisten, entspricht dem, was tatsächlich ankommt.
      name: — Tomasz K., Touring-Paddler, Polen
    - content: Die ganze Familie paddelt jetzt. Wir begannen mit einem Board und endeten mit vier — die Qualität machte die Entscheidung einfach.
      name: — Angela R., Familien-Paddlerin, Australien
