content_risk_control:
  tagline: Risk & Delivery Control
  title: 'Project Risk &<br />Delivery Management'
  subtitle: 'Professional OEM/ODM buyers care about risk control as much as product quality. Here is how we manage it.'
  items:
    - title: 'Scope & Ownership Definition'
      description: 'Before development begins, we define in writing: customization scope, tooling requirements, sample approval criteria, ownership of drawings and molds, and documentation responsibilities. No ambiguity about who owns what.'
      icon: tabler:file-text
    - title: 'Change Control Process'
      description: 'All specification changes after design confirmation follow a documented change-request process with impact assessment (cost, timeline, compliance). No unapproved modifications enter production.'
      icon: tabler:arrows-diff
    - title: 'Batch Consistency Guarantee'
      description: 'The 50th unit matches the 1st approved sample. Approved specifications are frozen, material and process parameters are locked, and in-process checkpoints verify consistency across the production run.'
      icon: tabler:repeat
    - title: 'Delivery & Capacity Transparency'
      description: 'Lead times are quoted based on actual production capacity, material stock levels, and current order load — not aspirational targets. Production schedule with milestone dates provided per order.'
      icon: tabler:calendar-stats

faq:
  title: RIB OEM/ODM — Frequently Asked Questions
  questions:
    - q: What is the difference between OEM and ODM for RIB boats?
      a: 'OEM (Original Equipment Manufacturing): you provide detailed specifications and we build your design. ODM (Original Design Manufacturing): you select a proven Paddle Board Overstock RIB platform and we customize it with your desired features and branding. ODM is faster and lower cost; OEM offers maximum design control.'
    - q: Can I customize the RIB hull shape and size?
      a: 'Yes. We offer semi-custom modifications to existing hull molds (different deck layouts, tube configurations) and full custom hull development with new CNC-machined molds. Semi-custom projects can start at 2-5 units; full custom typically requires higher commitments.'
    - q: What tube materials are available for custom RIBs?
      a: 'We offer 0.9-1.2 mm PVC for recreational and light commercial use, and 1.4-1.7 mm Hypalon/CSM for professional, rescue, and commercial applications requiring superior UV and ozone resistance (10-15 year lifespan vs. 5-8 years for PVC).'
    - q: Can you configure RIBs for specific applications like rescue, diving, or fishing?
      a: 'Yes. We maintain proven configuration templates for rescue/patrol, diving support, tourism/charter, fishing, yacht tender, and professional workboat applications. Each template includes recommended hull type, tube material, deck layout, and equipment — which we then customize to your exact requirements.'
    - q: What information do you need for a RIB OEM/ODM quotation?
      a: 'Target application, desired hull length, tube material preference (PVC or Hypalon), approximate quantity and delivery schedule, target market compliance requirements, and any reference products or specifications. The more detail you provide, the faster and more accurate our quotation.'
    - q: What is the MOQ for custom RIB boats?
      a: 'For existing hull molds with standard modifications, MOQ starts at 2-5 units per design. For custom molds and full custom development, MOQ depends on project complexity — typically 10-20 units for semi-custom and 30+ for full custom with new tooling.'
    - q: Who owns the custom molds and drawings?
      a: 'Molds developed using Paddle Board Overstock base designs remain Paddle Board Overstock property. Fully custom molds commissioned and paid for by the client can be assigned to client ownership per contract terms. All mold ownership terms are documented before project start.'
    - q: How are custom RIBs packaged for export?
      a: 'Standard: custom cradle + stretch-wrap for container loading. Premium: retail-ready packaging, vacuum pack, or palletized. We offer FOB Qingdao, CIF, and DDP shipping. Full export documentation and customs clearance included.'

