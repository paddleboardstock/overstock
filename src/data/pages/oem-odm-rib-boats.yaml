content_customization:
  tagline: What Can Be Customized
  title: 'RIB Customization<br />Options'
  subtitle: 'Every element of a RIB boat can be tailored to your application, market, and brand requirements.'
  items:
    - title: 'Hull & Structural'
      description: 'Hull length (2.5–8.5 m), hull material (GRP fiberglass or marine-grade aluminum), hull color (gelcoat or painted), keel profile (deep-V, moderate-V, flat), transom type (closed transom with bracket or well), and structural reinforcement for commercial load requirements.'
      icon: tabler:sailboat
    - title: 'Tube & Collar'
      description: 'Tube material (0.9–1.2 mm PVC or 1.4–1.7 mm Hypalon/CSM), tube diameter (40–55 cm), number of chambers (3–7), valve type (Halkey-Roberts, Leafield D7, or Boston), tube color (standard or custom), and collar cone/taper configuration.'
      icon: tabler:circle
    - title: 'Deck & Console Layout'
      description: 'Center console, side console, or tiller steering. Seating layout (jockey seats, bench seats, bolster seats). Deck covering (EVA foam teak-look, non-slip paint, or bare GRP). Equipment mounting points, grab rails, and D-ring positions.'
      icon: tabler:layout-dashboard
    - title: 'Electrical & Navigation'
      description: 'Navigation lights (LED), bilge pump system, battery management, VHF radio installation, GPS/chartplotter mounting, USB charging ports, and switch panel configuration.'
      icon: tabler:bolt
    - title: 'Branding & Graphics'
      description: 'Hull and tube graphics (screen printing, heat transfer, UV digital printing), logo placement, bespoke color schemes, identification markings, and custom owner documentation with your brand.'
      icon: tabler:palette
    - title: 'Safety & Compliance'
      description: 'Design category rating (A/B/C/D per RCD), fire suppression system, fuel system specification (portable tank, fixed tank, under-deck), and compliance documentation package for your target market.'
      icon: tabler:shield

content_applications:
  tagline: Application Configs
  title: 'RIB Configurations<br />By Application'
  subtitle: 'Different missions demand different configurations. Here are proven setups for the most common RIB applications.'
  items:
    - title: 'Rescue & Patrol'
      description: 'Deep-V hull, Hypalon tubes, self-bailing deck, bolster seats, grab handles, navigation lights, and heavy-duty D-rings. RCD Design Category B or C. Fire-resistant fuel system and commercial-grade electrical.'
      icon: tabler:lifebuoy
    - title: 'Diving Support'
      description: 'Wide beam, rear boarding ladder, tank rack positions, extra D-rings, dive flag mount, reinforced transom for twin outboards, and non-slip full-deck EVA covering.'
      icon: tabler:mask
    - title: 'Tourism & Commercial'
      description: 'Passenger-certified layout with bench seating, sunshade/Bimini, grab rails, dry storage, and dual battery system. RCD Category C. Designed for resort and charter fleet operations.'
      icon: tabler:beach
    - title: 'Fishing'
      description: 'Open deck layout, rod holder positions, live bait well, fish finder mount, trolling motor mount, reinforced transom, and portable fuel system. Center console or side console options.'
      icon: tabler:fish
    - title: 'Leisure & Yacht Tender'
      description: 'Lightweight hull, PVC tubes, comfortable seating, telescoping tiller or compact console, lifting points for davit, and removable fuel tank. RCD Category C or D.'
      icon: tabler:sailboat
    - title: 'Professional Workboat'
      description: 'Aluminum hull option, heavy-duty reinforcement, hydraulic steering, commercial-grade electrical, radar arch, and mission-specific equipment integration points. Custom compliance per project.'
      icon: tabler:anchor

process_steps:
  title: 7-Step RIB OEM/ODM Development Process
  subtitle: 'From project brief to after-sales — a defined workflow with clear milestones and deliverables'
  steps:
    - number: '01'
      title: 'Project Brief & Requirements'
      description: 'Define the target application, hull size, tube material, compliance requirements, and branding needs. We assess feasibility and confirm the collaboration model (OEM/ODM/Semi-Custom/Full Custom).'
      timeline: '3–5 days'
    - number: '02'
      title: 'Technical Review & Feasibility'
      description: 'Engineering team reviews structural feasibility, stability and buoyancy calculations, compliance path, and material availability. We identify existing molds or custom mold requirements.'
      timeline: '5–7 days'
    - number: '03'
      title: 'Proposal & Quotation'
      description: 'Receive a detailed proposal including specifications, 3D renderings or GA drawings, compliance scope, timeline, and unit pricing based on volume tiers and MOQ.'
      timeline: '5–7 days'
    - number: '04'
      title: 'Design Confirmation & Sampling'
      description: 'Approve final GA, deck layout, and tube configuration. We produce a pre-production sample with your brand colors, logo, and specified materials for your physical inspection.'
      timeline: '15–20 days'
    - number: '05'
      title: 'Sample Approval & QC Protocol'
      description: 'Inspect and approve the sample. Define the production QC protocol: pressure test (1.25x / 24–48h), dimensional checks, and compliance documentation checklist per hull.'
      timeline: '3–5 days'
    - number: '06'
      title: 'Mass Production & Quality Control'
      description: 'Full production run with 100-point QC checklist per unit. In-process inspections, pressure testing, and serial-level traceability. CE/ISO documentation prepared in parallel.'
      timeline: '30–45 days'
    - number: '07'
      title: 'Packing, Shipping & After-Sales'
      description: 'Custom packaging (standard, retail-ready, or palletized), export documentation, container loading, and logistics. Spare parts kits and maintenance documentation included.'
      timeline: '7–14 days'

