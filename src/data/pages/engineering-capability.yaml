content_capability:
  tagline: Engineering Capability
  title: 'What Our Engineering<br />Team Delivers'
  subtitle: 'Aquafarer engineering covers the full product lifecycle — from market research and concept design through prototyping, testing, and mass production.'
  items:
    - title: Industrial Design
      description: Our industrial design team works from customer requirements, market research, and competitive analysis to develop product concepts that balance aesthetics, functionality, and manufacturability. We produce 2D sketches, 3D renderings, and specification documents for client review before committing to tooling.
      features:
        - Concept development and feasibility studies
        - 2D design drawings and 3D renderings
        - Material selection and specification
        - Design for manufacturing (DFM) analysis
        - Ergonomic and safety evaluation
    - title: Structural Engineering
      description: Our structural engineers specialize in inflatable boat architecture — hull design, tube chamber configuration, drop-stitch core engineering, and load distribution. Each design is analyzed for structural integrity, weight optimization, and compliance with relevant standards (CE, ISO, AS).
      features:
        - Deep-V fiberglass hull design with calculated deadrise angles
        - Multi-chamber tube configuration for safety and buoyancy
        - Drop-stitch core specification and density optimization
        - Finite element analysis for load-bearing components
        - Weight distribution and stability calculations
    - title: 3D Modeling & CAD
      description: All product designs are developed in 3D CAD before prototype tooling begins. Our engineers use SolidWorks and Rhino 3D for product modeling, allowing clients to review every detail — from tube profile to console layout — before committing to production.
      features:
        - Full 3D CAD modeling in SolidWorks and Rhino 3D
        - Photo-realistic rendering for client presentations
        - Technical drawing packages for production
        - Mold and tooling design from 3D models
        - CAD-to-CNC direct data transfer for precision cutting
    - title: Prototyping & Testing
      description: Before mass production, every new product goes through prototype stage. We build functional prototypes for client evaluation, then subject them to our full testing protocol — pressure testing, stability testing, load testing, and water trials. Design iterations at prototype stage are fast and cost-effective.
      features:
        - Rapid prototype tooling (15-20 day turnaround)
        - Functional prototype for real-world evaluation
        - Full testing protocol before production sign-off
        - Iterative design refinement based on test results
        - Client approval milestone before production tooling
    - title: Custom Accessory Integration
      description: Many OEM projects require integration of client-supplied or third-party accessories — custom consoles, specialized seating, electronic systems, dive equipment mounts, or branding elements. Our engineering team manages the integration design, structural adaptation, and quality validation of all accessories.
      features:
        - Console design and instrument panel layout
        - Custom seating and upholstery integration
        - Electronic system design and wiring
        - Dive and rescue equipment mounting systems
        - Branding and graphic application specifications
content_process:
  tagline: Development Process
  title: 'From Concept<br />to Production'
  subtitle: 'Our product development process follows a structured 6-stage workflow designed to minimize risk, compress timelines, and ensure manufacturing readiness from day one.'
  stages:
    - stage: '01'
      title: Requirements & Research
      duration: 1-2 weeks
      description: 'We work with the client to define product specifications, target market requirements, regulatory compliance needs, and commercial objectives. This stage produces a Product Requirements Document (PRD) that guides all subsequent work.'
      deliverables: 'PRD, market analysis, competitive benchmark, preliminary cost estimate'
    - stage: '02'
      title: Concept Design
      duration: 2-3 weeks
      description: 'Industrial design team develops product concepts based on the PRD. Multiple design options are presented with 3D renderings, material recommendations, and initial engineering assessments. Client selects direction for detailed development.'
      deliverables: '3D concept renderings, material specifications, design rationale, preliminary BOM'
    - stage: '03'
      title: Detailed Engineering
      duration: 2-4 weeks
      description: 'Selected concept is fully engineered — 3D CAD modeling, structural analysis, tube configuration, hull design, accessory integration, and production documentation. All dimensions, materials, and processes are specified for tooling.'
      deliverables: 'Full 3D CAD model, engineering drawings, final BOM, tooling specifications, QC plan'
    - stage: '04'
      title: Prototyping
      duration: 2-3 weeks
      description: 'Prototype tooling is produced and functional samples are built. Client reviews prototype against PRD specifications. Testing is conducted per agreed protocol. Design adjustments are made based on feedback before production tooling.'
      deliverables: 'Functional prototype, test report, design revision log, client sign-off document'
    - stage: '05'
      title: Production Tooling
      duration: 2-3 weeks
      description: 'Once prototype is approved, production tooling is commissioned — molds, welding jigs, cutting programs, assembly fixtures. QC documentation and inspection criteria are finalized. Trial run conducted for process validation.'
      deliverables: 'Production tooling, process documentation, QC inspection plan, trial run report'
    - stage: '06'
      title: Mass Production & QC
      duration: Ongoing
      description: 'Full production begins with in-process QC at every stage. First articles are inspected and approved before batch release. Ongoing quality monitoring, defect tracking, and continuous improvement throughout production lifecycle.'
      deliverables: 'Production schedule, QC reports, batch traceability records, shipping documentation'
