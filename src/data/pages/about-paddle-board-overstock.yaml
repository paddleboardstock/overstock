hero:
  tagline: About
  title: About Paddle Board Overstock
  subtitle: Since 2012, we have been putting brand-new inflatable SUP boards into the hands of paddlers and small retailers in 50+ countries — overstock inventory, honest pricing, and a warranty we actually honor.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock brand-new inflatable SUP boards
direct_answer: Paddle Board Overstock is a water sports equipment brand founded in 2012 and based in Weihai, China. We sell brand-new inflatable SUP boards from overstock inventory — a mix of surplus production from our own manufacturing base and carefully selected stock from partner factories — directly to end paddlers and to small retailers in 50+ countries. Every board is 100% pressure-tested, backed by a 2-Year SUP Warranty, and shipped by express or sea freight.
tldr_points:
  - "Founded 2012, based in Weihai, China — one of the world's key SUP manufacturing hubs"
  - "Overstock model: brand-new boards at below-retail pricing, no middlemen"
  - "Inventory is mixed-source: surplus production from our base plus vetted partner-factory stock"
  - "50+ countries served, 99.3% final-inspection pass rate, 2-Year SUP Warranty"
story_section:
  tagline: Our Story
  title: Why We Sell Overstock
  paragraphs:
    - Paddle Board Overstock started in 2012 in Weihai, China — a coastal city in Shandong province that has grown into one of the world's most important inflatable SUP manufacturing hubs. From that base, we have spent more than a decade making inflatable paddle boards and shipping them worldwide.
    - Along the way we noticed something that shapes everything we do today: every production season leaves behind brand-new, perfectly good boards — surplus runs, cancelled orders, last season's colorways. Meanwhile, independent retailers around the world were locked out of wholesale because traditional suppliers demanded container-sized orders.
    - That gap is our business. By selling overstock inventory — surplus production from our own Weihai base, plus carefully selected stock from partner factories — we can offer brand-new boards at prices well below typical retail, in quantities that work for a single paddler or a five-board shop order. Nothing is second-hand, nothing is a second; it is simply inventory that deserves a customer instead of a warehouse.
model_section:
  tagline: Our Business Model
  title: How the Overstock Model Works
  items:
    - title: Brand-New, Never Used
      description: Every board we sell is brand-new and unused. Overstock means surplus and excess inventory — not returns, not refurbs, not seconds.
    - title: Mixed-Source Inventory
      description: Our stock combines surplus production from our own Weihai manufacturing base with inventory selected from partner factories we hold to the same quality bar. Sources are mixed; standards are not.
    - title: Below-Retail Pricing
      description: Overstock inventory costs us less to acquire, so it costs you less to buy. No inflated list price, no fake discounts — just honest pricing on real inventory.
    - title: Small-Business-Friendly Wholesale
      description: Wholesale starts at 5 boards, not container loads. Small retailers can mix any in-stock models in one order and choose express or sea freight.
    - title: Direct-to-You Shipping
      description: Orders ship straight from our Weihai logistics base to your door in 50+ countries — express for samples and small orders, consolidated sea freight for wholesale.
quality_section:
  tagline: Quality & Warranty
  title: The Quality Behind Every Board
  subtitle: Overstock pricing never means relaxed standards. Every board — whatever its source — passes the same process before it ships.
  items:
    - title: 100% Pressure-Tested
      description: Every single board is inflated and pressure-tested to 15 PSI before dispatch. No board ships untested, regardless of where its inventory came from.
    - title: Overload Tested to 1.25x
      description: Boards from our production runs are sample-tested beyond rated pressure — held at 1.25x working pressure for 24–48 hours to verify seams, valves, and drop-stitch construction.
    - title: 99.3% Final-Inspection Pass Rate
      description: Our final inspection process passes 99.3% of boards as defect-free — and the small fraction that fail never enter our overstock inventory.
    - title: 2-Year SUP Warranty
      description: Every SUP board carries a 2-Year SUP Warranty covering manufacturing defects. The same warranty applies to every customer in every one of our 50+ markets.
