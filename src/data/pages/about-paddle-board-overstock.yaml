team_section:
  tagline: The Team
  title: The People Behind the Boards
  description: Our Weihai base is home to a 14+ strong research and development team covering materials, structural design, and production processes. Around them operates the wider team that runs quality control, inventory, logistics, and the support you reach when you contact us — the same people, whether you are buying one board or twenty.
