hero:
  tagline: Certifications & Standards
  title: 'Quality Certifications<br />& Compliance Standards'
  subtitle: 'Aquafarer products are manufactured in compliance with international marine safety standards, quality management systems, and environmental regulations.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Aquafarer quality certifications and compliance documentation
content_certifications:
  tagline: Our Certifications
  title: 'Certified Quality,<br />Globally Recognized'
  subtitle: '64 CE-certified models and factory-wide certifications demonstrate our commitment to quality, safety, and environmental responsibility.'
  items:
    - title: 'CE Certified'
      description: '64 CE-certified models comply with European CE marking requirements for recreational watercraft, ensuring safety, health, and environmental protection standards are met.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Our quality management system is ISO 9001:2015 certified, covering design, manufacturing, and distribution of inflatable watercraft and marine equipment.'
      icon: tabler:clipboard-check
    - title: 'UKCA Marked'
      description: 'Products sold in the UK market carry UKCA marking, confirming compliance with UK regulations for marine equipment and personal watercraft.'
      icon: tabler:shield
    - title: 'BSCI Compliant'
      description: 'Aquafarer is BSCI (Business Social Compliance Initiative) audited, demonstrating ethical manufacturing practices, fair labor conditions, and supply chain responsibility.'
      icon: tabler:heart-handshake
    - title: 'REACH Compliant'
      description: 'All materials used in Aquafarer products comply with EU REACH regulations for chemical safety, ensuring no restricted substances in our PVC, Hypalon, or components.'
      icon: tabler:flask
    - title: 'Material Testing'
      description: 'Fabrics are tested for tensile strength, tear resistance, UV degradation, and cold-crack performance. Every production batch is sampled and verified.'
      icon: tabler:test-pipe
content_factory:
  tagline: Factory Standards
  title: 'Manufacturing Excellence<br />— Built to Specification'
  subtitle: 'Our 12,000 m² facility operates under strict quality control protocols at every stage of production.'
  list:
    - 'Incoming Material Inspection: All raw materials — PVC fabric, Hypalon, aluminum, plywood, adhesives — are tested against specifications before entering production.'
    - 'In-Process Quality Control: Every production stage has documented QC checkpoints. Weld strength, seam alignment, valve installation, and fitting torque are verified inline.'
    - 'Pressure Testing: Every inflatable chamber is pressure-tested at 1.25× rated pressure for 24–48 hours. Leak rate must be within acceptable limits per ISO 6185.'
    - 'Final Inspection: Completed products are inspected for dimensional accuracy, cosmetic finish, accessory completeness, and packaging integrity before shipping.'
    - 'Batch Traceability: Every product carries a serial number linked to production batch records, enabling full traceability from raw material to finished goods.'
content_safety:
  tagline: Marine Safety Standards
  title: 'Safety First<br />— Designed for Reliable Operation'
  subtitle: 'Aquafarer products are designed and tested to meet international marine safety standards for commercial and recreational use.'
  items:
    - title: 'ISO 6185'
      description: 'Inflatable boats comply with ISO 6185 standards for construction, stability, buoyancy, and load capacity.'
      icon: tabler:sailboat
    - title: 'ABYC Standards'
      description: 'Electrical systems and fuel systems follow ABYC (American Boat & Yacht Council) standards for safe installation and operation.'
      icon: tabler:bolt
    - title: 'SOLAS Compliance'
      description: 'Safety equipment and life-saving appliances meet SOLAS (Safety of Life at Sea) requirements where applicable.'
      icon: tabler:lifebuoy
cta:
  title: 'Need certified products for your project?'
  subtitle: 'Contact our team to discuss certification requirements, documentation, and compliance for your market.'
  actions:
    - variant: primary
      text: Request certification docs
      href: /contact
    - text: View our quality page
      href: /quality
