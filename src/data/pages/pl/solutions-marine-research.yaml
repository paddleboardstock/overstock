content_challenge:
  tagline: Wyzwanie
  title: Wymagania w zakresie badań morskich<br />Stabilne platformy gotowe do współpracy z instrumentami
  subtitle: Naukowe łodzie robocze muszą zapewniać stabilną platformę dla czułego oprzyrządowania, cichą pracę, aby uniknąć niepokojenia dzikiej przyrody, oraz elastyczne układy dla różnorodnego sprzętu badawczego.
  paragraphs:
    - Badania morskie i monitoring środowiskowy wymagają łodzi roboczych pełniących funkcję mobilnych laboratoriów. W przeciwieństwie do jednostek komercyjnych i rekreacyjnych RIB badawcze muszą pomieścić wrażliwą aparaturę elektroniczną, sprzęt do pobierania próbek wody i osadów, a czasem także transport żywych okazów — zachowując przy tym stabilną platformę do dokładnego zbierania danych.
    - '**Stabilność platformy jest kluczowa** — Sonary, echosondy i profilometry CTD (przewodność, temperatura, głębokość) wymagają stabilnego kadłuba na postoju i przy małej prędkości. Nadmierny kilwater albo ruchy kadłuba wprowadzają zakłócenia do danych naukowych. Niezbędny jest kadłub o głębokim V z dobrymi charakterystykami stateczności.'
    - '**Integracja przyrządów** — Jednostki badawcze potrzebują punktów montażowych dla anten GPS, przetworników sonarowych, ramion pobierania próbek i urządzeń rejestrujących dane. Przestrzeń konsoli musi pomieścić wiele ekranów, dystrybucję zasilania przyrządów oraz bezpieczne przechowywanie wrażliwej elektroniki.'
    - '**Cicha praca** — Podczas badań biologii morskiej i monitoringu środowiskowego hałas silnika i drgania kadłuba mogą płoszyć życie morskie i uniemożliwiać obserwacje behawioralne. Ciche konfiguracje silników zaburtowych i kadłuby o ograniczonych drganiach są istotne w zastosowaniach badawczych.'
    - Badawcze RIB-y Paddle Board Overstock projektowane są ze stabilnymi platformami kadłubowymi, zintegrowanymi systemami mocowania sprzętu i cichymi konfiguracjami silników zaburtowych do zastosowań naukowych i monitoringu środowiskowego.
content_solution:
  tagline: Nasze rozwiązanie
  title: Zaprojektowane specjalnie do celów badawczych RIB<br />Do celów naukowych i środowiskowych
  subtitle: Każdy badawczy RIB Paddle Board Overstock jest skonfigurowany jako stabilna, konfigurowalna platforma dla oprzyrządowania naukowego i sprzętu do pobierania próbek w terenie.
  list:
    - Kadłub z włókna szklanego o głębokim V — doskonała stateczność na postoju i przy małych prędkościach pomiarowych
    - Płaski pokład z płytami montażowymi na sonar, GPS i sprzęt do pobierania próbek
    - Konsola przygotowana pod wiele ekranów — ploter, echosonda, rejestrator danych
    - Rozdział zasilania akcesoriów 12 V i 24 V dla przyrządów naukowych
    - Cichy silnik zaburtowy czterosuwowy — minimalne drgania i hałas podczas inwentaryzacji przyrody
    - Opcjonalna konstrukcja kadłuba o małym kilwaterze dla minimalnych zakłóceń podczas zbierania danych
    - Niestandardowe kolory balonów dla wizerunku instytucji badawczych i identyfikacji floty
content_segments:
  tagline: Profile badawcze
  title: Rozwiązania dla nauk o morzu<br />Według typu zastosowania
  subtitle: Różne zastosowania badawcze mają specyficzne wymagania dotyczące statków – od uniwersyteckich platform dydaktycznych, przez statki do badań środowiskowych, po RIB monitorujące jakość wody.
  items:
    - title: Uniwersyteckie programy nauk o morzu
      subtitle: Platformy dydaktyczne, wycieczki terenowe dla studentów, badania wybrzeża
      description: Uniwersytety morskie i wydziały oceanografii potrzebują niezawodnych, wszechstronnych łodzi roboczych do prowadzenia zajęć terenowych, projektów badawczych dla studentów i badań wybrzeża pod kierunkiem wykładowców. Łódź musi być łatwa w obsłudze dla studentów pod nadzorem, wystarczająco stabilna, aby umożliwić praktyczne rozmieszczenie przyrządów i wystarczająco trwała, aby mogła być często używana przez wielu użytkowników w trakcie semestrów akademickich. Ograniczenia budżetowe w środowisku akademickim sprawiają, że opłacalność i niskie koszty utrzymania są ważnymi czynnikami.
      features:
        - Stabilna platforma do ćwiczeń studentów w opuszczaniu i odzyskiwaniu przyrządów
        - Łatwa obsługa — konfiguracja z rummlem lub pojedynczą konsolą do pracy studenckiej pod nadzorem
        - Trwałe balony z Hypalonu na częste lądowania na plaży i obsługę przez studentów
        - Mocowanie sprzętu dla dydaktycznego sonaru, tarczy Secchiego i akcesoriów do pobierania próbek
        - Ekonomiczna opcja PVC dla programów akademickich z ograniczonym budżetem
    - title: Instytuty Badań Morskich
      subtitle: Pomiarowe RIB-y z integracją przyrządów, GPS, sprzętem do pobierania próbek
      description: Wyspecjalizowane organizacje prowadzące badania morskie prowadzące badania przybrzeżne i morskie potrzebują profesjonalnie skonfigurowanych RIB do badań ze zintegrowanym oprzyrządowaniem. Statki te wyposażone są w systemy sonarowe do mapowania batymetrycznego, profilery CTD do analizy słupa wody, próbniki osadów i sprzęt do zbierania materiałów biologicznych. Łódź musi zapewniać stabilną platformę przy małych prędkościach badawczych, mieć wystarczająco dużo miejsca na pokładzie do rozmieszczenia sprzętu i zapewniać czyste zasilanie 12 V/24 V dla elektroniki.
      features:
        - Zintegrowane mocowanie przetwornika sonarowego — montaż przez kadłub lub na pawężu
        - Mocowanie anteny GPS i integracja z konsolą dla nawigacji klasy pomiarowej
        - Strefa opuszczania profilometru CTD i pobieraka wody z bezpiecznymi punktami mocowania
        - Pomocniczy rozdział zasilania 12 V/24 V dla przyrządów i rejestratorów danych
        - Stateczność przy małej prędkości (3–6 węzłów) dla dokładności linii pomiarowych
        - Opcjonalna rama w kształcie litery A lub żurawik do opuszczania cięższego sprzętu pobierania próbek
    - title: Monitoring i ochrona środowiska
      subtitle: Badania ekologiczne, obserwacja dzikiej przyrody, ocena siedlisk
      description: Organizacje pozarządowe zajmujące się ochroną środowiska, agencje rządowe i organizacje zajmujące się ochroną środowiska prowadzą morskie badania ekologiczne, monitorowanie populacji dzikich zwierząt i oceny siedlisk. Operacje te wymagają cichych statków o niskim wpływie na środowisko, które mogą zbliżać się do wrażliwych siedlisk bez zakłócania spokoju dzikiej przyrody. Łodzie muszą mieć na pokładzie sprzęt fotograficzny, GPS do mapowania transektów oraz sprzęt do pobierania próbek wody i osadów. Niski ślad i minimalny hałas silnika mają kluczowe znaczenie w badaniach obserwacji behawioralnych.
      features:
        - Cichy silnik zaburtowy czterosuwowy — minimalne niepokojenie morskiej fauny
        - Stabilna platforma obserwacyjna do dokumentacji fotograficznej i wideo
        - Mocowanie sprzętu dla rigów kamer, trackerów GPS i komputerów polowych
        - Małe zanurzenie dla dostępu do nadmorskich terenów podmokłych, namorzyn i estuariów
        - Łatwe w czyszczeniu pokład i powierzchnie balonów do dekontaminacji między stanowiskami
    - title: Monitorowanie i testowanie jakości wody
      subtitle: Regularne pobieranie próbek, śledzenie substancji zanieczyszczających, monitorowanie zgodności
      description: Organizacje monitorujące jakość wody regularnie pobierają próbki ze stref przybrzeżnych, portów i śródlądowych dróg wodnych w celu śledzenia poziomu zanieczyszczenia, zakwitów glonów i zgodności z przepisami środowiskowymi. Do tych operacji potrzebne są wydajne i niezawodne łodzie do wielokrotnych wizyt w stałych stacjach pobierania próbek. Na statku musi znajdować się sprzęt do pobierania próbek, chłodziarki do konserwacji próbek i sprzęt do badań w terenie, a także możliwość łatwego mycia pokładu pomiędzy miejscami pobierania próbek, aby zapobiec zanieczyszczeniu krzyżowemu.
      features:
        - Wydzielona strefa stacji pobierania próbek ze skrzynią chłodniczą i schowkiem na sprzęt
        - Pokład i powierzchnie balonów łatwe w czyszczeniu do dekontaminacji między stanowiskami
        - Integracja GPS dla precyzyjnego powrotu do stałych współrzędnych pobierania próbek
        - Kompaktowe wymiary dla dostępu do ograniczonych dróg wodnych i wąskich kanałów
        - Oszczędny silnik zaburtowy dla ekonomicznych regularnych rejsów pobierania próbek
