features3_solutions:
  tagline: Rozwiązania
  title: Twoja przygoda wodna<br />partner biznesowy
  isBeforeContent: false
  columns: 3
  items:
    - title: Kluby sportów wodnych
      description: Kompletne pakiety wyposażenia, niestandardowe brandingi i programy konserwacji dla klubów SUP, klubów kajakowych, szkół surfingu i ośrodków szkoleniowych.
      icon: tabler:users
      link: /solutions/clubs
    - title: RIBy do sportów wodnych
      description: RIB-y specjalnie zaprojektowane dla szkół żeglarskich, ośrodków sportów wodnych i organizacji eventowych. Łodzie trenerskie, łodzie holownicze i jednostki marszałkowskie do profesjonalnych sportów wodnych.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Kurorty i hotele
      description: Programy sportów wodnych premium obejmujące sprzęt flotowy, systemy bezpieczeństwa, szkolenia personelu i zarządzanie przychodami dla obiektów hotelarskich.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Przedsiębiorcy marki wody
      description: Produkcja pod marką własną OEM/ODM z niskimi MOQ, niestandardowym projektowaniem produktów, pakowaniem i globalną wysyłką dla nowych właścicieli marek.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Łodzie centrum nurkowego
      description: Stabilne platformy RIB z łatwym wejściem/wyjściem, przechowywaniem sprzętu i konfiguracjami silników zoptymalizowanymi pod operacje nurkowe.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Łodzie Ratownicze i Awaryjne
      description: Szybkie RIB-y i łodzie pneumatyczne zaprojektowane do poszukiwania i ratownictwa, reagowania w sytuacjach awaryjnych i operacji straży przybrzeżnej.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Rozwiązania Tender dla Jachtów
      description: Kompaktowe, stylowe tendery RIB uzupełniające superjachty i jednostki rekreacyjne. Łatwe przechowywanie, mocna wydajność.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Rozwiązania dla Łodzi Wędkarskich
      description: Stabilne, trwałe łodzie pneumatyczne i RIB-y skonfigurowane do komercyjnych i rekreacyjnych operacji połowowych.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Wyposażenie Turystyki Morskiej
      description: Gotowe dla flot łodzie pneumatyczne, płyty SUP i kajaki dla kurortów, operatorów wycieczek i wypożyczalni sportów wodnych.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: RIB dla energetyki morskiej
      description: Wytrzymałe żebra RIB do obsługi platform naftowych i gazowych, transportu załogi farm wiatrowych, inspekcji kabli podmorskich i budowy statków.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Łodzie robocze do akwakultury
      description: Odporne na korozję żebra do hodowli ryb, hodowli pereł i hodowli oceanicznej. Rury Hypalon, okucia ze stali nierdzewnej, trwałość w codziennym użytkowaniu.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Badania i ankiety morskie
      description: Stabilne, gotowe do użycia przyrządy RIB do badań oceanograficznych, monitorowania środowiska, pobierania próbek jakości wody i programów nauczania na uniwersytetach.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Komercyjne Łodzie Robocze
      description: Wzmocnione RIB-y do patroli, pomiarów, transportu i logistyki offshore. Zbudowane dla rygorystycznych wymagań operacji komercyjnych.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Nie wiesz, która ścieżka pasuje do Twojej firmy?
  subtitle: Opowiedz nam o swojej działalności — polecimy odpowiedni pakiet wyposażenia, program brandingowy lub niestandardowe rozwiązanie.
  actions:
    - variant: primary
      text: Uzyskaj bezpłatną konsultację
      href: /contact

