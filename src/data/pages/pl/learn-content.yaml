materials:
  intro_p1: Wydajność, trwałość i bezpieczeństwo jednostki nadmuchiwanej zależą niemal całkowicie od materiałów użytych do jej produkcji. Od tkaniny formującej pontony po nici nadające desce SUP sztywność — każdy wybór materiału wpływa na zachowanie produktu na wodzie i jego żywotność.
  intro_p2: 'Ten przewodnik obejmuje cztery podstawowe materiały stosowane w nowoczesnych jednostkach nadmuchiwanych: tkaninę PVC, gumę Hypalon CSM, konstrukcję z rdzeniem drop-stitch i pokłady z pianki EVA. Zrozumienie tych materiałów pomoże Ci wybrać odpowiedni produkt i dbać o niego, aby zmaksymalizować jego żywotność.'
  labels:
    advantages: Zalety
    limitations: Ograniczenia
    best_for: 'Najlepsze do:'
  items:
    - name: PVC (polichlorek winylu)
      summary: Standard branżowy dla rekreacyjnych łodzi pneumatycznych i SUP-ów. Wielowarstwowa tkanina laminowana oferuje doskonały stosunek wytrzymałości do wagi w przystępnej cenie.
      pros:
        - Przystępna cena — 30-50 % tańszy niż Hypalon
        - Lekki i łatwy w obsłudze
        - Dobra odporność na UV przy odpowiednich powłokach
        - Szeroka gama kolorów i wykończeń
        - Łatwa naprawa łatami PVC i klejem rozpuszczalnikowym
      cons:
        - Krótsza żywotność niż Hypalon (7-10 lat)
        - Mniejsza elastyczność w niskich temperaturach
        - Niższa odporność chemiczna
        - Z czasem może dochodzić do migracji plastyfikatorów
      best_for: Rekreacyjne SUP-y, tanie łodzie, floty wypożyczalni, użytkowanie sezonowe, wody słodkie i przybrzeżne.
    - name: Hypalon (guma CSM)
      summary: Materiał premium z gumy syntetycznej znany z wyjątkowej trwałości, odporności na UV i długowieczności. Złoty standard dla komercyjnych i wojskowych łodzi pneumatycznych.
      pros:
        - Wyjątkowa odporność na UV i ozon
        - Żywotność 15-20 lat przy odpowiedniej pielęgnacji
        - Doskonała elastyczność w niskich temperaturach
        - Wzorcowy opór na chemikalia i oleje
        - Zachowuje kolor dłużej niż PVC
      cons:
        - Znacznie droższy niż PVC
        - Cięższa tkanina
        - Mniejszy wybór kolorów
        - Naprawy wymagają specjalistycznych klejów
        - Mniej zakładów produkcyjnych na świecie
      best_for: Komercyjne RIB-y, poszukiwanie i ratownictwo, zastosowania wojskowe, klimaty tropikalne, długoterminowe posiadanie floty.
    - name: Rdzeń drop-stitch
      summary: Technologia, która zrewolucjonizowała nadmuchiwane SUP-y. Tysiące poliestrowych nici łączy górną i dolną warstwę tkaniny, umożliwiając pompowanie do wysokiego ciśnienia dla osiągów na poziomie sztywnej deski.
      pros:
        - Skrajnie sztywny przy 12-20 PSI
        - Lekki — 18-30 lbs dla deski w pełnym rozmiarze
        - Składa się na płasko do przechowywania i podróży
        - Doskonała odporność na uderzenia
        - Stabilne osiągi w całym zakresie temperatur
      cons:
        - Wymaga pompy wysokociśnieniowej
        - Naprawa przebić jest bardziej skomplikowana niż w konstrukcji jednowarstwowej
        - Wyższy koszt produkcji niż standardowych produktów nadmuchiwanych
        - Utrata ciśnienia w czasie wymaga okresowego dopełniania
      best_for: Deski do stand-up paddle, kajaki, pomosty powietrzne do łodzi — wszędzie tam, gdzie potrzeba sztywności i mobilności konstrukcji nadmuchiwanej.
    - name: Pokład z pianki EVA
      summary: Pianka EVA o zamkniętych komórkach (octan etylenu-winylu) stosowana na maty antypoślizgowe desek SUP i pokładów łodzi. Zapewnia amortyzację, przyczepność i izolację termiczną.
      pros:
        - Doskonała przyczepność antypoślizgowa na mokro i na sucho
        - Amortyzacja zmniejsza zmęczenie przy długim wiosłowaniu
        - Izolacja termiczna od zimnej powierzchni pokładu
        - Odporna na UV i słoną wodę
        - Dostępna w wielokolorowych kompozycjach i wzorach grawerowanych laserem
      cons:
        - Może zużywać się przy intensywnym użytkowaniu po 2-3 latach
        - Musi być odpowiednio przyklejona, aby zapobiec delaminacji
        - Bez funkcji konstrukcyjnej — nie wpływa na sztywność
        - Dodaje niewielką wagę (200-400 g na deskę)
      best_for: Okładziny pokładów SUP, wyściółki pokładów łodzi, komfort siedzisk kajakowych — każda powierzchnia wymagająca antypoślizgowego podparcia.
  selection:
    title: Przewodnik wyboru materiału
    subtitle: 'Wybierz odpowiedni materiał w zależności od głównego zastosowania:'
    headers:
      - Zastosowanie
      - Zalecany materiał
      - Dlaczego
    rows:
      - - Rekreacyjne wiosłowanie na SUP
        - PVC drop-stitch
        - Lekki, sztywny, przystępny — idealny balans dla okazjonalnych wioślarzy
      - - Rodzinna łódź / łódź jeziorna
        - PVC (1100 denier)
        - Korzystny cenowo, łatwy w naprawie, wystarczająca trwałość do użytku rekreacyjnego
      - - Komercyjny RIB / łódź patrolowa
        - Hypalon CSM
        - Maksymalna odporność na UV, żywotność 15-20 lat, odporność na chemikalia i oleje
      - - Flota desek SUP do wynajmu
        - PVC drop-stitch + pokład EVA
        - Trwały, naprawialny, dobra relacja ceny do jakości przy intensywnym użytkowaniu
      - - Operacje poszukiwawczo-ratunkowe
        - Hypalon CSM
        - Niezawodność w ekstremalnych warunkach, elastyczność na mrozie, odporność chemiczna
      - - Kajak turystyczny / ekspedycyjny
        - PVC drop-stitch
        - Sztywne osiągi ze składaną mobilnością do podróży
  deep_dive:
    title: Przewodniki pogłębione
    topics:
      - title: PVC klasy morskiej
        desc: Wielowarstwowa tkanina PVC laminowana — odporność na UV, testy ścieralności i wartości denier wyjaśnione.
      - title: Porównanie PVC vs Hypalon
        desc: Definitywne porównanie dwóch dominujących materiałów łodzi pneumatycznych — koszty, żywotność, odporność na UV.
      - title: Rdzeń drop-stitch
        desc: Jak tysiące wewnętrznych nitek tworzy sztywne, wysokociśnieniowe konstrukcje nadmuchiwane przy 12-15 PSI.
      - title: Technologia spawania RF
        desc: Spawanie wysokoczęstotliwościowe tworzy mocne i równe szwy — jak działa i dlaczego ma znaczenie.
      - title: PSI a osiągi
        desc: Dlaczego ciśnienie powietrza ma znaczenie dla nadmuchiwanych SUP i łodzi — sztywność, nośność i komfort pływania.
      - title: Testy jakości
        desc: Testy ciśnieniowe, testy wyporności, starzenie UV i testy niszczące — nasz proces kontroli jakości.
      - title: Pokłady z pianki EVA
        desc: Maty z pianki EVA o zamkniętych komórkach — przyczepność, komfort i trwałość pokładów SUP i łodzi.
      - title: Pielęgnacja materiałów
        desc: Czyszczenie, ochrona UV, zapobieganie pleśni i najlepsze praktyki przechowywania produktów nadmuchiwanych.
