articles:
  sup:
    - title: Podstawy SUP — przewodnik dla początkujących
      desc: 'Wszystko, co powinien wiedzieć początkujący: rodzaje desek, rozmiar wiosła, postawa i wskazówki na pierwszy dzień.'
    - title: Przewodnik po rozmiarach SUP
      desc: Znajdź odpowiednią długość, szerokość i objętość deski dopasowane do Twojej wagi, umiejętności i stylu wiosłowania.
    - title: SUP nadmuchiwany czy sztywna deska
      desc: Który wybrać? Porównanie przenośności, osiągów, trwałości i kosztów.
    - title: Zaawansowane techniki
      desc: Podnieś swoje umiejętności wiosłowania dzięki zaawansowanym pociągnięciom wiosłem, technikom skrętów i żegludze na wzburzonej wodzie.
    - title: Jak wybrać nadmuchiwany SUP
      desc: 'Kluczowe czynniki: konstrukcja, grubość, konfiguracja płetw i dołączone akcesoria.'
    - title: Bezpieczeństwo na wodzie
      desc: 'Niezbędna wiedza o bezpieczeństwie: odczytywanie pogody, wybór kamizelki ratunkowej (PFD), samoratowanie i wiosłowanie w grupie.'
  inflatable-boat:
    - title: Materiały — kompendium
      desc: PVC, Hypalon, drop-stitch, wartości denier — zrozum, z czego wykonany jest Twój sprzęt nadmuchiwany.
    - title: Porównanie PVC vs Hypalon
      desc: Definitywne porównanie tkanin PVC i Hypalon do łodzi pneumatycznych — trwałość, odporność na UV i koszty.
    - title: Rdzeń drop-stitch wyjaśniony
      desc: Jak tysiące wewnętrznych nitek tworzy sztywną platformę przy 12-15 PSI dla wydajnych nadmuchiwanych SUP.
    - title: Przegląd technologii nadmuchiwanej
      desc: Jak budowane są łodzie pneumatyczne i SUP-y — od układania materiałów po systemy zaworów i spawanie szwów.
    - title: Przewodnik po łodziach RIB (sztywny kadłub)
      desc: Wszystko o konstrukcji RIB, typach kadłubów, materiałach pontonów i wyborze odpowiedniego RIB-a do Twoich potrzeb.
    - title: Łódź pneumatyczna czy RIB
      desc: Kluczowe różnice między tradycyjnymi łodziami pneumatycznymi a łodziami o sztywnym kadłubie w zależności od zastosowania.
  water-safety:
    - title: Przewodnik po bezpieczeństwie na wodzie
      desc: Niezbędna wiedza o bezpieczeństwie dla każdego wioślarza — pogoda, kamizelki ratunkowe (PFD), samoratowanie i protokoły wiosłowania w grupie.
    - title: Przewodnik po kamizelkach i PFD
      desc: Jak wybrać odpowiedni środek ratunkowy do SUP, kajaka, żeglarstwa i zastosowań profesjonalnych.
    - title: Checklista bezpieczeństwa SUP
      desc: Checklista przed wypłynięciem, którą powinien wykonać każdy miłośnik paddleboardingu.
    - title: Bezpieczeństwo w zimnej wodzie
      desc: Niezbędne środki ostrożności, sprzęt i techniki wiosłowania w zimnej wodzie.
    - title: Błędy początkujących wioślarzy
      desc: Częste błędy osób rozpoczynających przygodę z wiosłowaniem i jak ich unikać dla bezpieczniejszej i przyjemniejszej zabawy.
    - title: Certyfikacja CE wyjaśniona
      desc: Co oznacza certyfikacja CE dla jednostek nadmuchiwanych — normy, badania i dlaczego ma znaczenie dla bezpieczeństwa.
