articles:
  sup:
    - title: SUP Podstawy — przewodnik dla początkujących
      desc: Wszystko, co początkujący powinien wiedzieć — typy desek, dobór wiosła, postawa i wskazówki na pierwszy dzień.
    - title: SUP Przewodnik po rozmiarach
      desc: Znajdź odpowiednią długość, szerokość i objętość deski dopasowaną do swojej wagi, umiejętności i stylu wiosłowania.
    - title: Nadmuchiwana vs twarda deska
      desc: Co jest dla Ciebie odpowiednie? Porównanie mobilności, wydajności, trwałości i kosztów.
    - title: Techniki średniozaawansowane
      desc: Podnieś poziom swojego wiosłowania dzięki zaawansowanym pociągnięciom, technikom skręcania i radzeniu sobie na wzburzonej wodzie.
    - title: Jak wybrać nadmuchiwaną SUP maszynę
      desc: Poruszaj się po kluczowych czynnikach — konstrukcji, grubości, ustawieniu płetw i dołączonych akcesoriach.
    - title: Bezpieczeństwo nad wodą
      desc: Podstawowa wiedza o bezpieczeństwie, w tym odczytywanie pogody, PFD selekcja, samoratowanie oraz grupowe wiosłowanie.
  inflatable-boat:
    - title: Materiały referencyjne
      desc: Drop-stitch Rdzenie, PVC laminaty, EVA pianka tarasowa i oceny denier — zrozum, z czego wykonana jest Twoja deska.
    - title: EVA Wyjaśnienie grafiki na pokładzie
      desc: Jak EVA wielokolorowe bloki są wycinane i ręcznie składane w mozaikę tarasową, która nigdy nie blaknie ani się nie łuszczy.
    - title: Drop-Stitch Wyjaśnienie rdzenia
      desc: Jak tysiące wewnętrznych wątków tworzy sztywną platformę w wieku 15 lat PSI dla wysokowydajnych nadmuchiwanych SUPs gwintów.
    - title: Przegląd technologii nadmuchiwanej
      desc: Jak konstruowane są nadmuchiwane deski paddle — od układania materiałów, przez systemy zaworowe, aż po spawanie szwów.
    - title: Budowa kolejowa i pojezd
      desc: Jak potrójne warstwy szyn i szwy spawane RF utrzymują deskę szczelną przy pełnym ciśnieniu.
    - title: Dlaczego 15 PSI Matters
      desc: Jak ciśnienie powietrza odblokowuje sztywną, twardą deskę dzięki dmuchaniu do składania.
  water-safety:
    - title: Przewodnik bezpieczeństwa na wodzie
      desc: Niezbędna wiedza o bezpieczeństwie dla każdego kajakarza — pogoda, PFD, samoratownictwo i protokoły wiosłowania grupowego.
    - title: Kamizelka ratunkowa i PFD przewodnik
      desc: Jak wybrać odpowiednie osobiste urządzenie do pływania do stand-up paddleboardingu — oceny wyporności, dopasowanie i komfort.
    - title: SUP Lista kontrolna bezpieczeństwa
      desc: Lista bezpieczeństwa przed startem powinna przestrzegać każdego stand-up paddleboardzistę przed wejściem na wodę.
    - title: Bezpieczeństwo podczas wiosłowania w zimnej wodzie
      desc: Podstawowe środki ostrożności, sprzęt i techniki wiosłowania w zimnych wodach.
    - title: Błędy początkujących w wiosłowaniu
      desc: Typowe błędy popełniane przez osoby wiosłujące po raz pierwszy i jak ich unikać, aby doświadczenie było bezpieczniejsze i przyjemniejsze.
    - title: Zasady bezpieczeństwa dotyczące smyczy i PFD
      desc: Kiedy smycz jest niezbędna, jakie typy PFD działają dla SUP oraz jaki sprzęt bezpieczeństwa powinien mieć każdy wioślarz.
