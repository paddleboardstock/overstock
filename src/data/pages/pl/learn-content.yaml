materials:
  intro_p1: Wydajność, trwałość i bezpieczeństwo dmuchanej deski wiosłowej zależą niemal w całości od materiałów użytych do jej konstrukcji. Od laminatu tworzącego kadłub po nici, które nadają sztywność SUP desce, każdy wybór materiałów wpływa na zachowanie produktu na wodzie i jego trwałość.
  intro_p2: 'Ten przewodnik obejmuje trzy główne materiały stosowane w nowoczesnych dmuchanych deskach wiosłowych: laminat PVC, rdzeń drop-stitch i piankową nawierzchnię EVA. Zrozumienie tych materiałów pomoże wybrać odpowiednią deskę do Twoich potrzeb i utrzymać ją w stanie zapewniającym maksymalną żywotność.'
  labels:
    advantages: Zalety
    limitations: Ograniczenia
    best_for: 'Najlepsze dla:'
  items:
    - name: PVC (polichlorek winylu)
      summary: Standard branżowy dla dmuchanych SUPs. Wielowarstwowa tkanina laminowana oferuje doskonały stosunek wytrzymałości do wagi w przystępnej cenie.
      pros:
        - Doskonale odnosi się do wartości za pieniądze
        - Lekka i łatwa w obsłudze
        - Dobra odporność na UV przy odpowiednich powłokach
        - Szeroka gama kolorów i wykończeń
        - Łatwa do naprawy przy użyciu łatek PVC i kleju rozpuszczalnikowego
      cons:
        - Typowa żywotność 7-10 lat przy właściwym użytkowaniu
        - Mniej elastyczna w niskich temperaturach
        - Niższa odporność chemiczna
        - Może wystąpić migracja plastyfikatorów z czasem
      best_for: Rekreacyjne i turystyczne SUPs, wiosłowanie rodzinne, sezonowe użytkowanie, wody słodkie i przybrzeżne.
    - name: Rdzeń typu drop-stitch
      summary: Technologia, która zrewolucjonizowała dmuchane SUPs. Tysiące nici poliestrowych łączą górne i dolne warstwy tkaniny, umożliwiając wysokociśnieniowe nadmuchanie dla sztywnej, twardoskorupowej wydajności.
      pros:
        - Niezwykle sztywna przy 12-20 PSI
        - Lekki — 8-14 kg dla pełnowymiarowej deski
        - Składa się na płasko do przechowywania i podróży
        - Doskonała odporność na uderzenia
        - Stała wydajność w różnych zakresach temperatur
      cons:
        - Wymaga pompy wysokociśnieniowej
        - Naprawa przebicia bardziej skomplikowana niż w przypadku jednowarstwowych
        - Wyższy koszt produkcji niż w przypadku standardowych nadmuchiwania
        - Utrata ciśnienia z czasem wymaga okresowego dopompowywania
      best_for: Deski typu stand-up paddle i każdy sprzęt wymagający sztywnej wydajności z przenośnością nadmuchiwaną.
    - name: EVA Pokład piankowy
      summary: Pianka zamkniętokomórkowa EVA (etylowy octan winylu) używana do podkładek trakcyjnych na deskach SUP. Zapewnia amortyzację, przyczepność i izolację termiczną — oraz nosi wzory serii artystycznej.
      pros:
        - Doskonała antypoślizgowa przyczepność na mokro i sucho
        - Amortyzacja zmniejsza zmęczenie przy długich wiosłowaniach
        - Izolacja termiczna przed zimną powierzchnią pokładu
        - UV i odporność na wodę soloną
        - Dostępna w konstrukcji wielokolorowych paneli i wzorach grawerowanych laserowo
      cons:
        - Może się zużywać przy intensywnym użytkowaniu przez 2-3 lata
        - Musi być prawidłowo klejona, aby zapobiec rozwarstwianiu
        - Nie jest elementem konstrukcyjnym — nie wpływa na sztywność
        - Dodaje niewielką wagę (200-400 g na deskę)
      best_for: SUP przyczepność pokładu, wzory pokładu serii artystycznej i każda powierzchnia wymagająca antypoślizgowego podłoża.
  selection:
    title: Przewodnik wyboru materiału
    subtitle: 'Wybierz odpowiedni materiał w zależności od głównego zastosowania:'
    headers:
      - Zastosowanie
      - Polecany materiał
      - Dlaczego
    rows:
      - - Rekreacyjne wiosłowanie SUP
        - Drop-stitch PVC
        - Lekki, sztywny, przystępny cenowo — idealna równowaga dla przypadkowych wioślarzy
      - - Rodzinne i dla początkujących wiosłowanie
        - Szeroki drop-stitch PVC (32"+)
        - Stabilny i wyrozumiały — pewność siebie dla początkujących kajakarzy
      - - Wędkowanie i wiosłowanie z dużym sprzętem
        - Szeroki drop-stitch PVC z EVA pełnym pokładem
        - Dodatkowa stabilność przy staniu i rzucaniu, duża objętość przy stackle
      - - Tablice flot wynajmowanych SUP
        - Drop-stitch PVC + EVA Deck
        - Trwały, łatwy do naprawy, dobry stosunek do zastosowania o dużej rotacji
      - - Touring i dłuższe wiosła
        - Drop-stitch PVC (~11 stóp)
        - Lepsze śledzenie i efektywność ślizgu na odległość
      - - Joga i kajaskanje fitness
        - Szeroki drop-stitch PVC z EVA pełnym pokładem
        - Stabilna, wygodna platforma do pozycji i treningów
  deep_dive:
    title: Przewodniki Deep Dive
    topics:
      - title: Klasa morska PVC
        desc: PVC Wielowarstwowa tkanina laminowana — UV wyjaśnienie odporności, testów ścierania oraz ocen denier.
      - title: PVC Warstwy laminowane
        desc: Jak wielowarstwowe warstwy PVC laminowane równoważą wytrzymałość, wagę i UV opór.
      - title: Rdzeń typu drop-stitch
        desc: Jak tysiące wewnętrznych gwintów tworzy sztywne, wysokociśnieniowe nadmuchiwane struktury w wieku 15 PSI.
      - title: Technologia spawania RF
        desc: Spawanie wysokoczęstotliwościowe tworzy mocne, spójne szwy — jak to działa i dlaczego jest ważne.
      - title: PSI & Występy
        desc: Dlaczego ciśnienie powietrza ma znaczenie dla nadmuchiwanych SUPs — sztywność, nośność i jakość jazdy.
      - title: Testowanie jakości
        desc: Testy ciśnieniowe, testy wyporności, UV starzenie się i testy destrukcyjne — nasz proces jakości.
      - title: EVA Pokłady piankowe
        desc: EVA Podkładki do tarasów z pianki zamkniętokomórkowej — przyczepność, komfort i trwałość dla SUP tarasów.
      - title: Pielęgnacja materiałów
        desc: Czyszczenie, UV ochrona, zapobieganie pleśni i najlepsze praktyki przechowywania produktów nadmuchiwanych.
