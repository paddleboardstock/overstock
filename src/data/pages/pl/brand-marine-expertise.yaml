hero:
  tagline: Ekspertyza morska
  title: Dziesięciolecia inżynierii morskiej<br />w każdej desce
  subtitle: Paddle Board Overstock łączy zaawansowaną wiedzę z zakresu nauki o materiałach, precyzyjną produkcję i testy w rzeczywistych warunkach, aby tworzyć deski, które sprawdzają się wtedy, gdy to najważniejsze.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock zespół inżynierii morskiej i R&D przy pracy
expertise_materials:
  tagline: Nauka o Materiałach
  title: Wybór odpowiedniego materiału<br />dla każdego zastosowania
  subtitle: Pracujemy z trzema podstawowymi materiałami — każdy wybrany dla konkretnych przypadków użycia i wymogów wydajnościowych.
  columns: 3
  items:
    - title: Klasa morska PVC
      description: Tkanina 1100 denier PVC — nasz najbardziej wszechstronny materiał. UV-stabilna, odporna na ścieranie i sprawdzona w czasie. Idealna dla desek SUP, gdzie ważna jest waga, sztywność i efektywność kosztowa.
      icon: tabler:droplet
    - title: Rdzeń typu drop-stitch
      description: Tysiące włókien poliestrowych łączą górną i dolną warstwę materiału, pozwalając na wysokociśnieniowe nadmuchiwanie (15 PSI) dla sztywnej, stabilnej jazdy, która nadal można zwinąć do plecaka.
      icon: tabler:building-arch
    - title: EVA Pianka pokładowa
      description: Żłobiona, wysoko-gęsta pianka EVA zapewnia pełną długość chwytności, amortyzację przy upadkach oraz powierzchnię pod nasze charakterystyczne deski z serii artystycznej.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Możliwości produkcyjne
  title: Precyzyjna produkcja<br />na każdym etapie
  subtitle: Nasz zakład o powierzchni 12 000 m² jest wyposażony w specjalistyczne maszyny na każdym etapie produkcji.
  columns: 2
  items:
    - title: CNC Cięcie
      description: Sterowane komputerowo cięcie zapewnia precyzyjne, powtarzalne panele materiału z minimalnymi odpadami. Każdy element idealnie pasuje według projektu.
      icon: tabler:cpu
    - title: Spawanie wysokiej częstotliwości
      description: Przemysłowe spawanie HF tworzy szwy mocniejsze niż materiał bazowy. Stała kontrola temperatury i ciśnienia zapewnia szczelność powietrza w każdej serii produkcyjnej.
      icon: tabler:bolt
    - title: Montaż rdzenia Drop Stitch
      description: Tysiące włókien poliestrowych łączą górną i dolną warstwę materiału, pozwalając na wysokociśnieniowe nadmuchiwanie (15–20 PSI) dla sztywnych, stabilnych desek i podłóg SUP.
      icon: tabler:building-arch
    - title: Próba ciśnieniowa
      description: Każda deska jest testowana pod ciśnieniem przed wysyłką, utrzymywana przy 1,25-krotności nominalnego ciśnienia — jeśli wytrzyma, sprawdzi się na wodzie.
      icon: tabler:wind
    - title: Test wytrzymałości szwów
      description: Losowe próbki z każdej partii produkcyjnej poddawane są destrukcyjnym testom wytrzymałości szwów. Wyniki są rejestrowane i przypisywane do konkretnych serii produkcyjnych.
      icon: tabler:files
    - title: Testy wodne
      description: Każdy projekt deski przechodzi testy w prawdziwej wodzie. Prawdziwe wiosłowanie w warunkach przybrzeżnych potwierdza wydajność, zwrotność i stabilność.
      icon: tabler:ripple
expertise_design:
  tagline: Projektowanie i Inżynieria
  title: Zaprojektowane do prawdziwych warunków
  subtitle: Nasza filozofia projektowania zaczyna się od sposobu, w jaki deska będzie używana — a następnie buduje inżynierię wokół tego zastosowania.
  items:
    - title: Kształt i Obrys Deski
      description: Długość, szerokość i rocker są dopasowane do przeznaczenia każdego modelu — dłuższe obrysy do wycieczek dla płynnego ślizgu, szersze powierzchnie dla stabilności i jogi.
    - title: Wzmocnienie Krawędzi i Wzdłużników
      description: Wzmocnione krawędzie i centralne wzdłużniki dodają sztywności i absorbują uderzenia — miejsca, w których deski są najbardziej narażone na zużycie sezon po sezonie.
    - title: Układ Pokładu i Przyczepność
      description: Obszar stania, rozmieszczenie uchwytów, mocowania D-ring i strefy przyczepności są projektowane w kontekście rzeczywistych pozycji wiosłowania — czy to podczas rekreacji, łowienia ryb, czy praktykowania jogi.
    - title: Sztuka i Seria Kolorów
      description: Grafiki na pokładzie, schematy kolorystyczne i mocowania akcesoriów — każda seria jest projektowana tak, aby pasować do odrębnej osobowości wiosłowania.
cta:
  title: Masz konkretne zastosowanie na myśli?
  subtitle: Nasz zespół może pomóc wybrać odpowiednią deskę, rozmiar i wyposażenie do Twojego stylu wiosłowania.
  actions:
