hero:
  tagline: Wiedza morska
  title: 'Dziesięciolecia inżynierii morskiej<br />w każdym kadłubie'
  subtitle: 'Aquafarer łączy głęboką naukę o materiałach, precyzyjną produkcję i testy w realnych warunkach, tworząc jednostki, które sprawdzają się, kiedy jest to najważniejsze.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Zespół inżynierii morskiej i B&R Aquafarer w pracy
expertise_materials:
  tagline: Nauka o materiałach
  title: 'Właściwy materiał<br />do każdego zastosowania'
  subtitle: 'Pracujemy z trzema podstawowymi materiałami — każdy wybrany pod konkretne zastosowania i wymagania wydajnościowe.'
  columns: 3
  items:
    - title: PVC klasy morskiej
      description: 'Tkanina PVC 1100 denier — nasz najbardziej uniwersalny materiał. Stabilizowany na UV, odporny na ścieranie i zgodny z REACH. Idealny do łodzi rekreacyjnych, desk SUP i kajaków, gdzie liczą się waga i opłacalność.'
      icon: tabler:droplet
    - title: Hypalon/CSM Premium
      description: 'Wyższa odporność chemiczna i stabilność UV. Łodzie z hypalonu mogą służyć 15-20 lat przy właściwej pielęgnacji. Polecane do zastosowań komercyjnych, ratowniczych i wojskowych, gdzie kluczowa jest trwałość.'
      icon: tabler:shield
    - title: Włókno szklane i aluminium
      description: 'Kadłuby z włókna szklanego z głębokim V dla RIB-ów i łodzi patrolowych — wydajność tnąca fale w trudnych warunkach. Kadłuby aluminiowe dla ciężkich komercyjnych łodzi roboczych wymagających maksymalnej wytrzymałości i ładowności.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Możliwości produkcyjne
  title: 'Precyzyjna produkcja<br />na każdym etapie'
  subtitle: 'Nasz zakład o powierzchni 12 000 m² wyposażony jest w specjalistyczne maszyny na każdym etapie produkcji.'
  columns: 2
  items:
    - title: Cięcie CNC
      description: 'Cięcie sterowane komputerowo zapewnia precyzyjne, powtarzalne panele tkanin przy minimalnych odpadach. Każdy element pasuje dokładnie tak, jak zaprojektowano.'
      icon: tabler:cpu
    - title: Spawanie wysokoczęstotliwościowe
      description: 'Przemysłowe spawanie HF tworzy szwy mocniejsze niż materiał bazowy. Stała kontrola temperatury i ciśnienia gwarantuje szczelne łączenia w każdej serii produkcyjnej.'
      icon: tabler:bolt
    - title: Montaż rdzenia drop-stitch
      description: 'Tysiące poliestrowych nici łączy górną i dolną warstwę tkaniny, umożliwiając pompowanie do wysokiego ciśnienia (15-20 PSI) dla sztywnych, stabilnych desk SUP i podłóg.'
      icon: tabler:building-arch
    - title: Test ciśnieniowy
      description: 'Każdy produkt pompowany jest testowany ciśnieniowo przed wysyłką. Pontony RIB są badane przy 1,25x ciśnienia nominalnego — jeśli wytrzymają, sprawdzą się na wodzie.'
      icon: tabler:wind
    - title: Test wytrzymałości szwów
      description: 'Losowe próbki z każdej partii produkcyjnej przechodzą destrukcyjne testy wytrzymałości szwów. Wyniki są rejestrowane i identyfikowalne do konkretnych serii produkcyjnych.'
      icon: tabler:files
    - title: Testy na wodzie
      description: 'Każdy model RIB przechodzi próby morskie przed certyfikacją. Testy w realnych warunkach przybrzeżnych potwierdzają osiągi, sterowność i stateczność.'
      icon: tabler:ripple
expertise_design:
  tagline: Design i inżynieria
  title: 'Zaprojektowane do realnych warunków'
  subtitle: 'Nasza filozofia projektowania zaczyna się od tego, jak łódź będzie używana — a dopiero potem budujemy inżynierię wokół tego zastosowania.'
  items:
    - title: Kadłub z głębokim V
      description: "Nasze kadłuby z włókna szklanego mają obliczone kąty dna (deadrise), zoptymalizowane pod długość i przeznaczenie każdego modelu. Ostrzejsze V dla osiągów na fali, płystsze dla stateczności."
    - title: Bezpieczeństwo wielokomorowe
      description: 'Każda łódź ma 3-7 niezależnych komór powietrznych. Jeśli jedna zostanie uszkodzona, pozostałe utrzymują łódź na powierzchni i w ruchu.'
    - title: Ergonomiczny układ
      description: 'Pozycja konsoli, wysokość pontonu i rozmieszczenie siedzeń zaprojektowano z myślą o komforcie operatora przy długotrwałej pracy — podczas patrolu, połowu czy transportu.'
    - title: Konfiguracja na zamówienie
      description: 'Kolory pontonów, konfiguracja konsoli, pojemność zbiornika, mocowania akcesoriów — każdy model można dostosować do konkretnych wymagań operacyjnych.'
cta:
  title: 'Masz konkretne zastosowanie na myśli?'
  subtitle: 'Nasz zespół inżynierów doradzi w zakresie doboru materiałów, designu i produkcji Twojego projektu.'
  actions:
    - variant: primary
      text: Zapytaj naszych inżynierów
      href: /contact
    - text: Zobacz ofertę produktów
