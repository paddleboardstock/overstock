content_challenge:
  tagline: Wyzwanie
  title: Wymagania akwakultury<br />Sprzęt odporny na słoną wodę
  subtitle: Hodowle ryb, hodowle pereł i rancza oceaniczne działają w najbardziej agresywnym chemicznie środowisku morskim – długotrwałym narażeniu na słoną wodę, pozostałościach paliwa i paszy oraz ciągłym codziennym użytkowaniu.
  paragraphs:
    - Operacje akwakultury trwają 365 dni w roku w wymagających środowiskach przybrzeżnych i pełnomorskich. Łodzie robocze używane do kontroli klatek, transportu paszy, konserwacji linii pereł i serwisowania sprzętu narażone są na ciągłe zanurzenie w słonej wodzie, ekspozycję na promieniowanie UV oraz kontakt chemiczny z paliwami, paszą dla ryb i powłokami przeciwporostowymi.
    - '**Korozja to główny wróg** — Standardowy sprzęt morski szybko ulega zniszczeniu w takich warunkach. Silniki zaburtowe, ramy przyczep i osprzęt kadłuba wymagają ciągłej wymiany. Operatorzy potrzebują łodzi zbudowanych z materiałów odpornych na korozję, które wytrzymają lata w tym środowisku bez degradacji.'
    - '**Codzienna niezawodność jest kluczowa** — Zepsuta łódź robocza oznacza niewykonane plany karmienia, opóźnione zbiory i kosztowne straty produkcyjne. W hodowlach pereł jeden pominięty dzień kontroli może oznaczać poważne uszkodzenia zbiorów. W hodowlach ryb opóźnione karmienie wpływa na tempo wzrostu i rentowność.'
    - RIB-y do akwakultury Paddle Board Overstock zaprojektowano z odpornym na korozję osprzętem, balonami z Hypalonu o podwyższonej wytrzymałości i wzmocnionymi kadłubami, zbudowanymi specjalnie na wymagające warunki hodowli ryb, hodowli pereł i hodowli oceanicznej.
content_solution:
  tagline: Nasze rozwiązanie
  title: Specjalnie zaprojektowane RIBy<br />Dla branży akwakultury
  subtitle: Każda łódź robocza Paddle Board Overstock do akwakultury została zaprojektowana tak, aby wytrzymać agresywne środowisko słonowodne, zapewniając jednocześnie niezawodną codzienną wydajność.
  list:
    - Balony z Hypalonu w jakości morskiej — doskonała odporność na promieniowanie UV, słoną wodę, paliwa i chemikalia z paszy dla ryb
    - Osprzęt ze stali nierdzewnej 316 w całej łodzi — brak rdzy przy długotrwałej ekspozycji na słoną wodę
    - Wzmocnione listwy odbierające i ochrona stępki na powtarzający się kontakt z dokami i klatkami
    - Samoodpływowy pokład do łatwego mycia i odpływu po transporcie paszy i pracach zbiorczych
    - Konfiguracja płaskiego pokładu do przewożenia worków paszy, skrzyń zbiorczych i sprzętu
    - Konfiguracje silników zaburtowych od 15 do 60 KM — zoptymalizowane pod kątem relacji ładunku do oszczędności paliwa
    - Opcje kolorów balonów o wysokiej widoczności dla łatwego dostrzeżenia na dużych obszarach hodowli
content_segments:
  tagline: Profile akwakultury
  title: Rozwiązania dla łodzi roboczych<br />Według typu akwakultury
  subtitle: Różne przedsiębiorstwa z branży akwakultury mają różne wymagania dotyczące łodzi roboczych — od małych, zwrotnych RIBów do inspekcji klatek rybnych po stabilne platformy transportowe do hodowli pereł i wytrzymałe łodzie robocze do hodowli oceanicznej.
  items:
    - title: Działalność w zakresie hodowli ryb
      subtitle: Kontrola klatek, transport paszy, pomoc przy zbiorach
      description: Hodowle ryb morskich obsługują klatki w odsłoniętych lokalizacjach przybrzeżnych i morskich. Łodzie robocze są używane codziennie do kontroli sieci klatek, karmienia, wspomagania zbiorów i konserwacji sprzętu. Głównym wyzwaniem jest korozja — łodzie są stale narażone na działanie słonej wody, pozostałości paszy dla ryb i paliwa. Niezawodna łódź robocza jest niezbędna, ponieważ brak karmienia lub opóźnione zbiory bezpośrednio wpływają na wydajność produkcji i rentowność.
      features:
        - 'Pakiet do agresywnych środowisk: osprzęt ze stali nierdzewnej 316, komponenty ze stopów w jakości morskiej'
        - Układ płaskiego pokładu do transportu worków paszy i skrzyń zbiorczych
        - Samoodpływowy pokład do łatwego spłukiwania po zakończonych pracach
        - Balony z Hypalonu z powłoką odporną na chemikalia do ekspozycji na paszę i paliwa
        - Wzmocnione listwy odbierające na częsty kontakt z klatkami i dokami
    - title: Działalność w zakresie hodowli pereł
      subtitle: Stabilny transport do kontroli i zbiorów pereł
      description: Hodowle pereł wymagają stabilnych i niezawodnych łodzi roboczych do codziennego transportu między liniami pereł, inspekcji sieci ostryg i zbierania zbiorów. Operacje te prowadzone są w odległych lokalizacjach przybrzeżnych z ograniczoną infrastrukturą konserwacyjną. Łódź musi być wystarczająco stabilna, aby załoga mogła na niej pracować podczas sprawdzania linek perełkowych, zapewniać łatwe wejście na pokład i dużą przestrzeń na pokładzie do przewożenia zebranych ostryg, sieci i zapasów. Niezawodność i łatwa konserwacja mają kluczowe znaczenie w odległych lokalizacjach gospodarstw.
      features:
        - Stabilna konstrukcja kadłuba dla stojącej załogi podczas kontroli linii pereł
        - Płaski pokład z antypoślizgową powierzchnią dla bezpiecznego przemieszczania się załogi
        - Niska burta dla łatwego dostępu do sieci na ostrygi i zbiorów
        - Prosta konfiguracja silnika zaburtowego ułatwiająca serwis na miejscu
        - Odporny na korozję pakiet balonów i osprzętu do ciągłej ekspozycji na słoną wodę
    - title: Hodowla oceaniczna i ulepszanie środowiska morskiego
      subtitle: Transport narybku, obsługa klatek, wsparcie monitoringu
      description: Działalność hodowlana w oceanach obejmuje wypuszczanie młodych osobników do zarządzanych środowisk morskich, monitorowanie wzrostu i obsługę struktur ulepszających. Łodzie robocze muszą transportować żywe młode osobniki w napowietrzanych kontenerach, przewozić sprzęt monitorujący i zapewniać dostęp do płytkich przybrzeżnych miejsc uwolnienia. Konstrukcja kadłuba musi równoważyć nośność z płytkim zanurzeniem umożliwiającym dostęp do plaży i ujścia rzek.
      features:
        - Przestrzeń pokładu na napowietrzane pojemniki do transportu narybku i sprzęt do monitoringu
        - Małe zanurzenie umożliwiające dostęp do miejsc wypuszczania na plażach i w ujściach rzek
        - Łatwe lądowanie na plaży — wzmocniona stępka i ochrona dziobu
        - Punkty montażowe sprzętu dla elektroniki monitorującej i urządzeń do pobierania próbek
        - Balony z Hypalonu do ciężkiej pracy, zapewniające trwałość w mieszanych warunkach piasku i słonej wody
