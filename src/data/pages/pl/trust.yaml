features3_certifications:
  title: Jakość i testowanie
  subtitle: Każda deska jest testowana w naszym laboratorium przed wysyłką — prawdziwe liczby, prawdziwe rekordy, brak deklaracji marketingowych.
  columns: 3
  isBeforeContent: true
  items:
    - title: Zbudowane we własnej fabryce
      description: Posiadamy i prowadzimy zakład Weihai o powierzchni 12 000 m². Każda partia produkcyjna jest śledzona, dokumentowana i kontrolowana — nie ma zewnętrznej tajemniczej produkcji.
      icon: tabler:building-factory
    - title: Laboratorium Testów Materiałowych
      description: Laboratorium materiałów na miejscu testuje wytrzymałość na rozciąganie, UV odporność, integralność szwów oraz ścieranie dla każdej partii tkaniny przed produkcją.
      icon: tabler:microscope
    - title: Materiały morskie
      description: UV- Stabilizowane PVC, drop-stitch rdzenie i EVA pianka pokładowa — wybrane i testowane pod kątem sezonów słońca, soli i nadużycia.
      icon: tabler:flask
    - title: 2-letnia SUP gwarancja
      description: Paddle Board Overstock SUP Deski objęte są dwuletnią gwarancją na wady produkcyjne, w tym szwy, zawory i delaminację materiału. Stoimy za tym, co budujemy.
      icon: tabler:shield-check
testimonials:
  tagline: Zaufanie klienta
  title: Co mówią nasi klienci
  subtitle: Od początkujących kajakarzy po doświadczonych odkrywców — zobacz, dlaczego ufają Paddle Board Overstock.
  items:
    - content: Jako osoba kupująca po raz pierwszy, byłam zdenerwowana zamówieniem z zagranicy. Zespół odpowiadał na każde pytanie prawdziwymi zdjęciami i dokumentacją testów, zanim jeszcze zapytałam. Tablica dotarła w 6 dni i przerosła moje oczekiwania.
      name: Jamesa Thorntona
      title: SUP Właściciel Explorer 11 — Vancouver, Kanada
features3_lab:
  title: Wewnętrzne laboratorium testowe i jakościowe
  subtitle: Każda partia materiału i gotowy produkt przechodzi przed wysyłką przez nasze laboratorium badawcze na miejscu.
  columns: 3
  isBeforeContent: true
  items:
    - title: Badanie wytrzymałości na rozciąganie
      description: 'Każda PVC rolka tkaniny jest testowana pod kątem wytrzymałości na rozciąganie we własnym zakresie. Minimalne wymagania: osnowa i wątek 350 N/cm. Odrzucone partie są zwracane dostawcy — odrzucamy około 3% materiałów napływających.'
      icon: tabler:scale
    - title: Przyspieszone starzenie się UV
      description: Próbki tkanin podlegają UV przyspieszonemu wietrzeniu trwającemu 1 000 godzin. Wytrzymałość na rozciąganie musi zachować 80%+ po ekspozycji. Produkty przeznaczone na+ 3 lata użytkowania na zewnątrz.
      icon: tabler:sun
    - title: Wytrzymałość oskórki szwu
      description: Spawane łącze są testowane do minimalnej wytrzymałości na odłukiwanie 5 N/mm. Każda partia produkcyjna ma próbki szwu testowane destrukcyjnie i archiwizowane.
      icon: tabler:stack
    - title: Utrzymanie ciśnienia przez 24–48 godzin
      description: 'Każdy nadmuchiwany produkt napompowano do wartości znamionowej 1,25 PSI i monitorowano przez 24–48 godzin. Maksymalny dopuszczalny spadek ciśnienia: 5%. Produkty, które nie przejdą tego testu, są poddawane ponownej obróbce i ponownemu testowaniu przed wysyłką.'
      icon: tabler:wind
    - title: Testowanie cyklu zaworu
      description: Każdy projekt zaworu przechodzi 10 000 cykli otwarto-zamykanie w naszym laboratorium. Zawory muszą utrzymywać szczelność powietrzną przy ciśnieniu 1,25x po cyklach. Wszystkie Paddle Board Overstock zawory są przystosowane do+ 5 lat regularnego użytkowania.
      icon: tabler:rotate
    - title: Odporność na pękanie na zimno
      description: Materiały testuje się w temperaturze -30°C przez 4 godziny. Nie wolno pękać ani kruchości. Produkty przeznaczone do przechowywania zimą i do zimnej wody do temperatury otoczenia do -10°C.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Jak zapewniamy jakość
  subtitle: Od inspekcji surowców po końcowe testy ciśnieniowe — każdy produkt przechodzi rygorystyczny łańcuch jakości.
  items:
    - title: Inspekcja surowców
      description: Każda rolka PVC tkaniny jest testowana pod kątem grubości, wytrzymałości na rozciąganie i UV wytrzymałości przed wejściem do produkcji.
      icon: tabler:search
    - title: Kontrola jakości w trakcie procesu
      description: Spoiny spawu, instalacje zaworów oraz połączenia komorowe są sprawdzane na każdym stanowisku podczas montażu.
      icon: tabler:eye
    - title: Próba ciśnieniowa
      description: Każdy produkt nadmuchiwany jest napompowany do 1,25x PSI i przechowywany przez 24–48 godzin, aby zweryfikować zatrzymanie powietrza i integralność szwów.
      icon: tabler:wind
    - title: Ostateczna inspekcja
      description: Każda jednostka jest sprawdzana pod kątem wykończenia, sprzętu i opakowania przed zatwierdzeniem do wysyłki. Próbki partii trafiają do naszego laboratorium na testy destrukcyjne.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Najczęściej zadawane pytania rady
  subtitle: Najczęściej zadawane pytania dotyczące naszych desek do paddleboardów stojących.
  columns: 2
  items:
    - title: SUP Jakie rozmiary planszów są dostępne?
      description: Oferujemy SUP deski od 9 do 12 stóp, w tym uniwersalne, turystyczne, jogowe oraz specjalistyczne. Nasze najlepiej sprzedające się modele to Tropical Breeze (10 ft) i Ocean Voyager (11 ft).
    - title: Czym drop-stitch jest budownictwo?
      description: Drop-stitch Konstrukcja wykorzystuje tysiące nitek poliestrowych łączących górną i dolną warstwę deski, co pozwala utrzymać wysokie ciśnienie powietrza (15–20 PSI) i uzyskać sztywną, stabilną platformę. Jest to standard branżowy dla nadmuchiwanych urządzeń premium SUPs.
    - title: Jaki jest limit wagowy SUP dla desek?
      description: SUP Nasze deski mogą unosić do 150 kg, w zależności od modelu i objętości. Leviathan Wake Board to nasz model o największej przepustowości, zaprojektowany do większych rowerzystów i do użytku jogi.
    - title: Czy oferujecie SUP kompletne pakiety?
      description: Tak. Każda SUP deska jest dostarczana z kompletnym pakietem, w tym 3-częściowym aluminiowym łopatką, pompą ręczną wysokociśnieniową, smyczą spiralną, plecakiem podróżnym oraz zestawem naprawczym. Niektóre modele mają także zestaw wyjmowanych stateczników.
    - title: Jaka jest gwarancja na SUP płyty?
      description: Wszystkie Paddle Board Overstock SUP płyty mają 2-letnią gwarancję na wady produkcyjne, w tym uszkodzenia szwu, wady zaworów oraz odwarstwienie materiału podczas normalnego użytkowania.
    - title: Jak długo trwa napompowanie SUP deski?
      description: Dzięki dołączonej pompie ręcznej pełne napompowanie do 15 PSI trwa około 8–12 minut. Aby zwiększyć ciśnienie, zalecamy naszą Paddle Board Overstock pompę elektryczną 12V, która napompowuje deskę w mniej niż 4 minuty.
cta:
  title: Chcesz zobaczyć jakość na własną rękę?
  subtitle: Poproś o nasze dokumentacje testowe, zdjęcia fabryczne lub specyfikacje materiałowe. Nie NDA jest wymagane.
  actions:
    - variant: primary
      text: Zamów o jakość dokumentacji
      href: /contact
    - text: Odwiedź naszą stronę fabryki
      href: /factory
