features3_certifications:
  title: Certyfikaty i zgodność
  subtitle: Każdy produkt jest niezależnie testowany; 64 modele mają certyfikat CE zgodnie z międzynarodowymi normami.
  columns: 3
  isBeforeContent: true
  items:
    - title: Certyfikat CE
      description: 64 modele z certyfikatem CE w kategorii SUP-y, kajaki, pontony i RIB-y spełniają europejską normę bezpieczeństwa CE dla rekreacyjnych jednostek pływających. Każdy produkt przechodzi testy ciśnienia, wyporności i obciążenia przed opuszczeniem fabryki.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Nasz zakład w Qingdao o powierzchni 12 000 m² działa w ramach systemu zarządzania jakością ISO 9001:2015. Każda partia produkcyjna jest identyfikowalna, udokumentowana i kontrolowana.
      icon: tabler:clipboard-check
    - title: Zgodność społeczna BSCI
      description: Jesteśmy certyfikowani BSCI, co zapewnia etyczne praktyki pracy, bezpieczne warunki pracy i odpowiedzialność środowiskową w całym naszym łańcuchu dostaw.
      icon: tabler:users
    - title: REACH i RoHS
      description: Wszystkie materiały — PVC, Hypalon, pianka EVA, kleje — są zgodne z przepisami UE REACH i RoHS. Żadnych substancji zabronionych, żadnych kompromisów.
      icon: tabler:flask
    - title: Laboratorium testowania materiałów
      description: Wewnętrzne laboratorium materiałowe testuje wytrzymałość na rozciąganie, odporność na UV, integralność szwów i ścieralność każdej partii tkaniny przed produkcją.
      icon: tabler:microscope
    - title: 2-letnia gwarancja
      description: Każdy produkt Aquafarer jest objęty dwuletnią gwarancją na wady produkcyjne. Ręczymy za to, co budujemy.
      icon: tabler:shield-check
testimonials:
  tagline: Zaufanie klientów
  title: Co mówią nasi klienci
  subtitle: Od początkujących wioślarzy po profesjonalnych operatorów floty — zobacz, dlaczego ufają Aquafarer.
  items:
    - content: Wyposażyliśmy całą naszą flotę wynajmu w RIB-y Aquafarer. Dwa sezony, zero awarii. Certyfikat CE sprawił, że zatwierdzenie ubezpieczenia przebiegło bezproblemowo.
      name: Marco V.
      title: Organizator wycieczek, Chorwacja
    - content: Jako kupujący po raz pierwszy, obawiałem się jakości. Dokumentacja ISO i raporty z testów, które udostępnili, dały mi pełną pewność.
      name: James T.
      title: Właściciel SUP Explorer 11, Kanada
    - content: Współpracujemy z Aquafarer w zakresie naszych przybrzeżnych jednostek patrolowych. Ich proces kontroli jakości jest spójny w każdej partii — ta niezawodność ma znaczenie w operacjach krytycznych.
      name: Kmdr ppor. Andres
      title: Zamówienia morskie, Filipiny
steps2_manufacturing:
  title: Jak zapewniamy jakość
  subtitle: Od kontroli surowców po końcowe testy ciśnieniowe — każdy produkt przechodzi rygorystyczny łańcuch jakości.
  items:
    - title: Kontrola surowców
      description: Każda rolka tkaniny PVC jest testowana pod kątem grubości, wytrzymałości na rozciąganie i odporności na UV przed dopuszczeniem do produkcji.
      icon: tabler:search
    - title: Kontrola jakości w procesie
      description: Szwy spawalnicze, montaże zaworów i wiązania komór są kontrolowane na każdym stanowisku podczas montażu.
      icon: tabler:eye
    - title: Test ciśnieniowy
      description: Każdy produkt nadmuchiwany jest pompowany do 1,25x nominalnego PSI i utrzymywany przez 24-48 godziny w celu weryfikacji zatrzymywania powietrza i integralności szwów.
      icon: tabler:wind
    - title: Kontrola końcowa
      description: Każda jednostka jest kontrolowana pod kątem wykończenia, osprzętu i opakowania przed zatwierdzeniem do wysyłki. Próbki partii trafiają do naszego laboratorium w celu testów niszczących.
      icon: tabler:clipboard-check
faqs_rib:
  title: FAQ dotyczące łodzi RIB
  subtitle: Często zadawane pytania dotyczące naszych sztywnych łodzi nadmuchiwanych.
  columns: 2
  items:
    - title: Jakie rozmiary łodzi RIB oferuje Aquafarer?
      description: Oferujemy 35 modeli RIB w zakresie od 2,5 m do 7,6 m, obejmujących wszystko od kompaktowych tenderów po ciężkie łodzie komercyjne i patrolowe. Każdy model jest dostępny w wielu opcjach konfiguracyjnych.
    - title: Jaka jest różnica między RIB a tradycyjną łodzią nadmuchiwaną?
      description: RIB (sztywna łódź nadmuchiwana) łączy solidny, głęboki V-hull z włókna szklanego lub aluminium z nadmuchiwanymi rurami Hypalon lub PVC. Zapewnia to stabilność i ładowność twardej łodzi z amortyzacją wstrząsów i wypornością nadmuchiwanej.
    - title: Jakie silniki są kompatybilne z RIB-ami Aquafarer?
      description: Nasze RIB-y obsługują silniki zaburtowe od 3 KM do 250 KM w zależności od modelu. Każda strona produktu zawiera maksymalną moc silnika. Zalecamy konsultację z dealerem w celu znalezienia idealnego dopasowania.
    - title: Czy RIB-y Aquafarer są certyfikowane CE?
      description: Tak. Wszystkie rekreacyjne modele RIB są certyfikowane CE zgodnie z obowiązującymi europejskimi normami dla rekreacyjnych jednostek pływających. Modele komercyjne i patrolowe spełniają dodatkowe wymagania dotyczące stabilności i obciążenia.
    - title: Jaka jest gwarancja na łodzie RIB?
      description: Wszystkie RIB-y Aquafarer są objęte standardową roczną gwarancją na wady produkcyjne, obejmującą delaminację kadłuba, pęknięcie szwu rury, wady zaworów i problemy z osprzętem.
    - title: Ile komór powietrznych mają RIB-y Aquafarer?
      description: Nasze RIB-y posiadają od 3 do 7 niezależnych komór powietrznych w zależności od długości modelu. Ta wielokomorowa konstrukcja zapewnia, że łódź pozostaje na powierzchni nawet jeśli jeden przedział zostanie naruszony.
faqs_inflatable:
  title: FAQ dotyczące łodzi nadmuchiwanych
  subtitle: Często zadawane pytania dotyczące naszych nadmuchiwanych pontonów, kajaków i łodzi.
  columns: 2
  items:
    - title: Jakie materiały są używane w nadmuchiwanych łodziach Aquafarer?
      description: Używamy PVC klasy wojskowej (1100 denier) i najwyższej jakości gumy Hypalon/CSM, w zależności od modelu. Oba materiały są stabilizowane UV, odporne na ścieranie i zgodne z przepisami UE REACH i RoHS.
    - title: Jak długo wytrzymują nadmuchiwane łodzie?
      description: Przy odpowiedniej pielęgnacji, wysokiej jakości nadmuchiwana łódź PVC wytrzymuje 7–10 lat, a modele Hypalon mogą wytrzymać 15–20 lat. Regularne czyszczenie, ochrona przed UV i odpowiednie przechowywanie znacznie wydłużają żywotność.
    - title: Jakiej konserwacji wymaga nadmuchiwana łódź?
      description: Podstawowa konserwacja obejmuje płukanie świeżą wodą po każdym użyciu (zwłaszcza w słonej wodzie), suszenie przed przechowywaniem, coroczną kontrolę uszczelek zaworów i nakładanie ochrony UV na rury. Unikaj długotrwałej ekspozycji na słońce, gdy nie jest używana.
    - title: Czy nadmuchiwane łodzie mogą być używane w słonej wodzie?
      description: Tak. Wszystkie nadmuchiwane łodzie Aquafarer są zaprojektowane do użytku zarówno w słodkiej, jak i słonej wodzie. Zalecamy płukanie świeżą wodą i dokładne suszenie po kontakcie ze słoną wodą, aby zapobiec korozji okuć i krystalizacji soli w tkaninie.
    - title: Jak przechowywać nadmuchiwaną łódź?
      description: Przed przechowywaniem całkowicie spuść powietrze, wyczyść i osusz łódź. Zwiń luźno (unikaj ciasnych zgięć), przechowuj w chłodnym, suchym miejscu z dala od bezpośredniego światła słonecznego i z dala od betonowych podłóg, aby zapobiec wchłanianiu wilgoci.
    - title: Jaka jest ładowność nadmuchiwanych łodzi Aquafarer?
      description: Ładowność waha się od 290 kg dla naszych najmniejszych modeli do ponad 2000 kg dla większych jednostek komercyjnych. Każda strona produktu zawiera maksymalne obciążenie dla konkretnego modelu.
faqs_sup:
  title: FAQ dotyczące desek SUP
  subtitle: Często zadawane pytania dotyczące naszych desek do wiosłowania na stojąco.
  columns: 2
  items:
    - title: Jakie rozmiary desek SUP są dostępne?
      description: Oferujemy deski SUP od 9 stóp do 12 stóp, w tym modele uniwersalne, turystyczne, do jogi i specjalistyczne. Nasze najlepiej sprzedające się modele to Tropical Breeze (10 stóp) i Ocean Voyager (11 stóp).
    - title: Czym jest konstrukcja drop-stitch?
      description: Konstrukcja drop-stitch wykorzystuje tysiące poliestrowych nici łączących górną i dolną warstwę deski, umożliwiając utrzymanie wysokiego ciśnienia powietrza (15–20 PSI) i uzyskanie sztywnej, stabilnej platformy. Jest to standard branżowy dla najwyższej jakości nadmuchiwanych SUP.
    - title: Jaki jest limit wagi dla desek SUP?
      description: Nasze deski SUP obsługują do 150 kg w zależności od modelu i objętości. Leviathan Wake to nasz model o największej pojemności, zaprojektowany dla większych wioślarzy i do jogi.
    - title: Czy oferujecie kompletne pakiety SUP?
      description: Tak. Każda deska SUP jest wysyłana z kompletnym pakietem zawierającym 3-częściowe wiosło aluminiowe, ręczną pompkę wysokociśnieniową, linkę spiralną, plecak podróżny i zestaw naprawczy. Niektóre modele zawierają również wymienny zestaw stateczników.
    - title: Jaka jest gwarancja na deski SUP?
      description: Wszystkie deski SUP Aquafarer są objęte roczną gwarancją na wady produkcyjne, w tym pęknięcia szwów, wady zaworów i delaminację materiału przy normalnym użytkowaniu.
    - title: Ile czasu zajmuje pompowanie deski SUP?
      description: Przy użyciu dołączonej pompki ręcznej, pełne napompowanie do 15 PSI zajmuje około 8–12 minut. Aby przyspieszyć pompowanie, zalecamy naszą elektryczną pompkę Aquafarer 12V, która pompuje deskę w mniej niż 4 minuty.
cta:
  title: Chcesz zobaczyć certyfikaty osobiście?
  subtitle: Poproś o nasze portfolio certyfikatów, raporty z audytu fabryki lub dokumentację zgodności materiałowej. NDA nie jest wymagane.
  actions:
    - variant: primary
      text: Poproś o dokumentację certyfikatów
      href: /contact
    - text: Odwiedź naszą stronę fabryki
      href: /factory
features3_lab:
  title: Wewnętrzne laboratorium testowe i jakościowe
  subtitle: Każda partia materiału i gotowy produkt przechodzi przed wysyłką przez nasze laboratorium badawcze na miejscu.
  columns: 3
  isBeforeContent: true
  items:
    - title: Badanie wytrzymałości na rozciąganie
      description: 'Każda rolka tkaniny o średnicy PVC jest testowana zgodnie z normami ASTM D751. Minimalne wymagania: osnowa i wątek 350 N/cm. Odrzucone partie wracają do dostawcy – odrzucamy około 3% przychodzących materiałów.'
      icon: tabler:scale
    - title: Przyspieszone starzenie się UV
      description: Próbki tkanin poddawane są procesowi starzenia przyspieszonego QUV trwającego 1000 godzin (ASTM G154). Zachowanie wytrzymałości na rozciąganie musi przekraczać 80% po ekspozycji na promieniowanie UV. Produkty przeznaczone do użytku na zewnątrz przez ponad 3 lata.
      icon: tabler:sun
    - title: Wytrzymałość na odrywanie szwów
      description: Zgrzewane szwy RF testowane przy minimalnej wytrzymałości na odrywanie 5 N/mm (ASTM D751). Ręcznie klejone szwy Hypalon testowane przy 3,5 N/mm. W każdej partii produkcyjnej próbki szwów zostały poddane testom niszczącym i zarchiwizowane.
      icon: tabler:stack
    - title: Utrzymanie ciśnienia przez 24–48 godzin
      description: 'Każdy nadmuchiwany produkt napompowano do wartości znamionowej 1,25 PSI i monitorowano przez 24–48 godzin. Maksymalny dopuszczalny spadek ciśnienia: 5%. Produkty, które nie przejdą tego testu, są poddawane ponownej obróbce i ponownemu testowaniu przed wysyłką.'
      icon: tabler:wind
    - title: Cykliczne testy zaworów
      description: Każdy projekt zaworu przechodzi w naszym laboratorium 10 000 cykli otwarcia i zamknięcia. Zawory muszą utrzymywać hermetyczne uszczelnienie przy ciśnieniu znamionowym 1,25x po cyklu. Wszystkie zawory Aquafarer mają trwałość ponad 5 lat regularnego użytkowania.
      icon: tabler:rotate
    - title: Odporność na pękanie na zimno
      description: Materiały testowane w -30°C przez 4 godziny według ISO 4646. Niedopuszczalne jest pękanie ani kruchość. Produkty przystosowane do przechowywania w zimie i stosowania w zimnej wodzie do temperatury otoczenia -10°C.
      icon: tabler:snowflake

