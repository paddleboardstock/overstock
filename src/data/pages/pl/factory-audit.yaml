content_priorities:
  tagline: Co weryfikują klienci
  title: 8 rzeczy, które kupujący weryfikują<br /> podczas każdej wizyty w fabryce
  subtitle: Na podstawie opinii klientów z ponad 50 krajów przedstawiamy osiem priorytetów, które klienci oceniają przed złożeniem zamówienia B2B.
  items:
    - title: Prawdziwy producent
      description: 'Czy jesteś faktyczną fabryką, a nie firmą handlową? Kupujący sprawdzają: podmiot gospodarczy, rzeczywisty sprzęt produkcyjny, pracowników obsługujących maszyny, aktualne zlecenia produkcyjne na hali oraz spójność strony internetowej z warsztatem.'
      icon: tabler:building-factory
    - title: Produkt odpowiedni do zastosowania
      description: Czy RIB pasuje do ich konkretnego przypadku użycia? Operatorzy ośrodków wypoczynkowych, ratowniczych, nurkowych, wędkarskich i patrolowych mają zasadniczo różne wymagania. Kupujący oceniają układ pokładu, materiał rur i opcje wyposażenia prezentowanej łodzi.
      icon: tabler:target
    - title: Stabilność jakości i powtarzalność
      description: Czy 50-ta jednostka jest tak samo dobra jak pierwsza? Kupujący sprawdzają systemy kontroli jakości, punkty kontrolne w trakcie procesu, postępowanie z niezgodnościami i proszą o przedstawienie zapisów z wielu serii produkcyjnych w celu sprawdzenia spójności.
      icon: tabler:repeat
    - title: Autentyczność dokumentu zgodności
      description: Czy certyfikaty CE są specyficzne dla modelu? Czy deklaracja zgodności jest podpisana przez prawdziwą osobę? Czy zgodność można zweryfikować na podstawie numeru kadłuba? Kupujący sprawdzają, czy roszczenia ogólne są porównane z dokumentacją dotyczącą konkretnego modelu.
      icon: tabler:file-certificate
    - title: Wykonanie dostosowywania
      description: Czy fabryka może faktycznie dostarczyć konfiguracje niestandardowe? Kupujący szukają dowodów wcześniejszych projektów niestandardowych, próbek prototypów na wystawie, rysunków technicznych i możliwości omówienia modyfikacji technicznych na miejscu.
      icon: tabler:adjustments
    - title: Czas realizacji i pojemność
      description: 'Czy podane terminy są realistyczne? Kupujący oceniają: aktualną wielkość produkcji, dostępne moce produkcyjne, wielkość siły roboczej, poziom zapasów materiałów oraz to, czy fabryka posiada system planowania produkcji.'
      icon: tabler:clock
    - title: Ceny i warunki handlowe
      description: 'Czy ceny są przejrzyste? Czy ceny FOB są jasne? Kupujący weryfikują: podział cen jednostkowych, koszty oprzyrządowania, koszty pakowania oraz to, czy fabryka jest w stanie obsłużyć warunki DDP lub CIF z odpowiednią dokumentacją eksportową.'
      icon: tabler:currency-dollar
    - title: Obsługa posprzedażna i części zamienne
      description: 'Co dzieje się po porodzie? Kupujący oceniają: dostępność części zamiennych, proces gwarancyjny, wymienne sekcje rurowe, wymianę zaworów oraz to, czy fabryka posiada udokumentowany protokół obsługi posprzedażnej.'
      icon: tabler:headset
content_tour:
  tagline: Trasa zwiedzania fabryki
  title: Wycieczka audytowa —<br />Co zobaczysz
  subtitle: Nasza standardowa wycieczka po fabryce przebiega według określonej trasy, mającej na celu udzielenie odpowiedzi na pytania kupujących na każdej stacji.
  items:
    - title: 1. Sala konferencyjna — wprowadzenie do firmy
      description: Licencja na prowadzenie działalności, certyfikaty ISO 9001 i BSCI, licencje eksportowe i historia firmy. Szybki przegląd możliwości produkcyjnych i zakresu zgodności.
      icon: tabler:users
    - title: 2. Magazyn Surowców – Stacja IQC
      description: Dokumenty kontroli przychodzących materiałów, certyfikaty partii tkanin, próbki klejów i sprzętu. Zobacz jak testowane są materiały przed wejściem do produkcji.
      icon: tabler:building-warehouse
    - title: 3. Produkcja rur — spawanie RF i klejenie ręczne
      description: Proces spawania lub klejenia rur na żywo, pokazy testów wytrzymałości szwów i instalacja zaworów. Obserwuj konstrukcję poszczególnych komór i punkty kontroli jakości.
      icon: tabler:flame
    - title: 4. Laminowanie kadłuba — warsztaty z GRP
      description: Proces układania włókna szklanego, nakładanie żelkotu i utwardzanie kadłuba. Zobacz harmonogram laminowania i wzmocnienie konstrukcyjne dla różnych modeli RIB.
      icon: tabler:layers-subtract
    - title: 5. Montaż i integracja
      description: Łączenie rur kadłuba, montaż konsoli i siedzenia, integracja układu elektrycznego i paliwowego oraz montaż wyposażenia. Obserwuj działającą linię produkcyjną.
      icon: tabler:tool
    - title: 6. Stacja prób ciśnieniowych
      description: Test utrzymywania ciśnienia przez 24–48 godzin przy ciśnieniu znamionowym 1,25x. Przeglądaj zapisy testów, manometry i kryteria pozytywnego/negatywnego wyniku. Zobacz, jak wyniki testów są powiązane z numerami seryjnymi kadłuba.
      icon: tabler:gauge
    - title: 7. Kontrola końcowa i kontrola jakości
      description: 100-punktowa lista kontrolna jakości na jednostkę, weryfikacja wymiarowa, kontrola kosmetyczna i kontrola integralności opakowania. Przejrzyj dzienniki niezgodności i zapisy działań naprawczych.
      icon: tabler:clipboard-check
    - title: 8. Pokój Przeglądu Dokumentów
      description: Dokumentacja zgodności dla każdego modelu (DoC, tabliczka producenta, instrukcja obsługi), zapisy dotyczące identyfikowalności produkcji, rejestr HIN i demonstracja bazy danych śledzenia partii materiałów.
      icon: tabler:folder
content_qc_chain:
  tagline: Dowód jakości
  title: 8-etapowy łańcuch kontroli jakości<br /> — weryfikowalny na każdym kroku
  subtitle: Nasz łańcuch kontroli jakości rozciąga się od materiałów przychodzących do wysyłki końcowej i na każdym etapie jest udokumentowany.
  items:
    - title: 'Etap 1: Kontrola przychodzącego materiału'
      description: Każda partia PVC, Hypalonu, włókna szklanego, aluminium, klejów i sprzętu jest testowana pod kątem specyfikacji przed wprowadzeniem do produkcji. Wytrzymałość na rozciąganie, przyczepność powłoki i kontrola wymiarów zgodnie z AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Etap 2: Spawanie rur / klejenie QC'
      description: Badanie wytrzymałości na odrywanie szwów dla każdej partii produkcyjnej. Parametry spawania RF są monitorowane i rejestrowane. Ręcznie klejone szwy sprawdzone pod kątem stałego pokrycia klejem i czasu utwardzania.
      icon: tabler:flame
    - title: 'Etap 3: Kontrola jakości laminowania kadłuba'
      description: Pomiar grubości żelkotu, weryfikacja układu włókna szklanego zgodnie z harmonogramem laminatu i monitorowanie czasu utwardzania. Położenia zbrojenia konstrukcyjnego zweryfikowane na podstawie rysunków technicznych.
      icon: tabler:layers-subtract
    - title: 'Etap 4: Kontrola montażu i integracji'
      description: Integralność połączenia rura kadłuba, moment obrotowy mocowania konsoli i siedzenia, ciągłość elektryczna i test szczelności układu paliwowego. Każdy punkt instalacji zweryfikowany na podstawie listy kontrolnej montażu specyficznej dla modelu.
      icon: tabler:tool
    - title: 'Etap 5: Test utrzymania ciśnienia'
      description: Każda nadmuchiwana komora jest pod ciśnieniem do 1,25x znamionowego PSI i utrzymywana przez 24-48 godzin. Spadek ciśnienia zarejestrowany na komorę. Udokumentowany próg Pass/Fail. Powiązany z numerem seryjnym kadłuba.
      icon: tabler:gauge
    - title: 'Etap 6: Kontrola końcowa'
      description: 100-punktowa lista kontrolna jakości obejmująca dokładność wymiarową, wykończenie kosmetyczne, kompletność akcesoriów, pakiet dokumentacji i integralność opakowania. Niezależny od zespołu produkcyjnego.
      icon: tabler:clipboard-check
    - title: 'Etap 7: Dokumentacja zgodności'
      description: DoC dla konkretnego modelu, weryfikacja tabliczki znamionowej producenta, kompletność instrukcji obsługi i wpis do rejestru HIN. Wszystkie dokumenty zgodności przygotowane i zweryfikowane przed wydaniem wysyłki.
      icon: tabler:file-certificate
    - title: 'Etap 8: Zwolnienie przesyłki i identyfikowalność'
      description: Wersja ostateczna wymaga przejścia wszystkich etapów kontroli jakości, skompletowania dokumentacji zgodności i zweryfikowania dokumentacji wysyłkowej. Rekord kadłuba został zamknięty i zarchiwizowany w celu przechowywania przez ponad 10 lat.
      icon: tabler:truck
content_traceability:
  tagline: Identyfikowalność produkcji
  title: HIN → Plik główny →<br />Rekord kadłuba → Dostawa
  subtitle: Każda łódź RIB posiada unikalny numer identyfikacyjny kadłuba powiązany z pełnym łańcuchem zapisów dotyczących produkcji i zgodności.
  items:
    - title: Numer identyfikacyjny kadłuba (HIN)
      description: 14-znakowy unikalny identyfikator trwale oznaczony na każdej łodzi. Koduje kod producenta (MIC), oznaczenie modelu, rok produkcji i numer seryjny. Klucz odblokowujący pełny łańcuch identyfikowalności.
      icon: tabler:hash
    - title: Główny plik techniczny
      description: Dokumentacja zgodności i inżynieria rodziny modeli. Zawiera rysunki GA, ocenę ryzyka, obliczenia stabilności, specyfikacje materiałów i obowiązujące normy. Powiązany ze wszystkimi kadłubami tego modelu.
      icon: tabler:folder
    - title: Indywidualny rekord kadłuba
      description: 'Zapis produkcji każdego kadłuba: HIN, data produkcji, partia rur, certyfikaty materiałowe, wynik próby ciśnieniowej, ostateczna konfiguracja, specyfikacja silnika, wyniki listy kontrolnej jakości i miejsce dostawy. Ponad 21 pól danych na kadłub.'
      icon: tabler:file-description
    - title: Pakiet zgodności z klientem
      description: Pakiet dostawy dla każdego kadłuba, zawierający deklarację zgodności, zdjęcie płyty konstrukcyjnej, instrukcję obsługi, listę kontrolną zgodności i arkusz ostatecznej konfiguracji. Dostarczane z łodzią i archiwizowane w fabryce przez ponad 10 lat.
      icon: tabler:package
content_red_flags:
  tagline: Pułapki audytu
  title: Kupujący sygnalizują czerwone flagi<br />Łatwo je dostrzec
  subtitle: Typowe problemy, które podważają zaufanie kupujących podczas audytów fabrycznych. Do każdego z nich podchodzimy proaktywnie.
  items:
    - title: Ogólne roszczenia CE bez zakresu modelu
      description: '„Wszystkie produkty posiadają certyfikat CE” bez określenia, która dyrektywa, które modele i który moduł zgodności. Czerwona flaga: sugeruje, że zgodność jest powierzchowna, a nie zależna od modelu czy konfiguracji.'
      icon: tabler:alert-triangle
    - title: Brak dowodów na badania fizyczne
      description: 'Oświadczenia dotyczące testów ciśnieniowych bez zapisów testów, manometrów lub stacji testowej widocznych na hali produkcyjnej. Czerwona flaga: podczas wizyty nie można zweryfikować roszczeń jakościowych.'
      icon: tabler:alert-triangle
    - title: Brak możliwości śledzenia materiałów
      description: 'Brak zapisów partii, brak kontroli przychodzącej lub brak powiązania między certyfikatami materiałowymi a gotowymi produktami. Czerwona flaga: brak możliwości prześledzenia problemów z jakością do źródła.'
      icon: tabler:alert-triangle
    - title: Dokumentacja ogólna
      description: 'Jedna deklaracja zgodności obejmująca wszystkie modele, brak zapisów specyficznych dla HIN lub „szablonów” dokumentów zgodności. Czerwona flaga: zgodność nie jest powiązana z poszczególnymi jednostkami produkcyjnymi.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Wysyłka i pakowanie
  title: Załadunek kontenerowy i pakowanie<br />łodzi RIB
  subtitle: Nasze rozwiązania wysyłkowe chronią Twoją inwestycję od Qingdao do portu docelowego. Plany załadunku kontenerów i specyfikacje pakowania dostępne dla każdego modelu.
  items:
    - title: Konfiguracje kontenera 20-stopowego
      description: 'Standardowy kontener 20-stopowy: 1-2 łodzie RIB (4,0-5,5 m) zagnieżdżone z oddzielonym pokładem i tubami, lub 8-12 desek SUP. Dostępne konfiguracje mieszane RIB + SUP. Szczegółowy plan załadunku dołączany do każdego zamówienia.'
      icon: tabler:box
    - title: Konfiguracje kontenera 40-stopowego
      description: 'Standardowy kontener 40-stopowy: 2-4 łodzie RIB (do 7,0 m) z zagnieżdżonymi kadłubami i ułożonymi stosami tubami, lub 20-30 desek SUP. Kontener 40-stopowy HQ dostępny dla wyższych modeli RIB. Pakowanie zoptymalizowane pod względem objętości obniża koszt wysyłki na jednostkę.'
      icon: tabler:container
    - title: Skrzynie drewniane dla kadłubów RIB
      description: Kadłuby aluminiowe i GRP pakowane w skrzynie drewniane na wymiar z wypełnieniem piankowym, barierą wilgociową i opasaniem stalowym. Wymiary i waga skrzyń dla każdego modelu dostępne do planowania logistycznego. Certyfikacja drewna obrabianego termicznie ISPM-15 w cenie.
      icon: tabler:wood
    - title: Pakowanie z oddzieleniem tub i pokładu
      description: Tuby spuszczone i złożone oddzielnie od kadłubów dla oszczędności miejsca. Płyty pokładu, konsole i siedzenia pakowane w folię ochronną z zestawami okuć montażowych. Instrukcje ponownego montażu dołączone do każdej wysyłki.
      icon: tabler:package
    - title: Ochrona przed wilgocią i korozją
      description: Papier antykorozyjny VCI dla komponentów aluminiowych, saszetki z żelem krzemionkowym i worki z okuciami pakowane próżniowo. Zapobiega uszkodzeniom kondensacyjnym podczas 30-45-dniowego transportu morskiego.
      icon: tabler:droplet-off
    - title: Dokumentacja FOB Qingdao
      description: Konosament, faktura handlowa, lista pakowania, świadectwo pochodzenia i dokumentacja zgodności dla każdej wysyłki. Dostępna konsolidacja FCL i LCL. Wsparcie dokumentacji celnej dla rynków UE, USA i Bliskiego Wschodu.
      icon: tabler:file-text
faq:
  title: Audyt fabryki — często zadawane pytania
  questions:
    - q: Czy mogę odwiedzić fabrykę osobiście?
      a: Tak. Chętnie przeprowadzamy audyty fabryczne w naszym zakładzie w Qingdao o powierzchni 12 000 m². Nasza standardowa wycieczka obejmuje 8 stacji, od magazynu surowców do pokoju przeglądu dokumentów. W celu wstępnej kwalifikacji dostępne są także wirtualne wycieczki po fabryce za pośrednictwem połączeń wideo.
    - q: Czy akceptujecie audyty stron trzecich (BSCI, SMETA, SGS)?
      a: Tak. Utrzymujemy certyfikat BSCI (Intertek) i przyjmujemy protokoły audytów dostosowane do potrzeb klienta. Na życzenie możemy również zorganizować inspekcje SGS lub TÜV. Raporty z audytów są dostępne w ramach NDA.
    - q: Czy podczas wizyty mogę zobaczyć badanie ciśnienia?
      a: Nasza stacja prób ciśnieniowych jest częścią standardowej trasy zwiedzania. W zależności od harmonogramu produkcji można obserwować aktywne próby ciśnieniowe z odczytami manometrów i zapisami testów. Dzienniki prób ciśnieniowych każdego kadłuba są zawsze dostępne do wglądu.
    - q: Jak postępować z produktami niezgodnymi?
      a: Jednostki niezgodne z wymaganiami są segregowane, dokumentowane i sprawdzane zgodnie z naszym procesem działań korygujących ISO 9001. Przeprowadzana jest analiza przyczyn źródłowych, wdrażane są działania naprawcze i prowadzona jest rejestracja. Kupujący mogą przeglądać nasz dziennik NCR podczas audytów.
    - q: Jaka dokumentacja dotycząca zgodności jest dostępna do wglądu?
      a: 'Podczas audytu można przejrzeć: próbki DoC specyficzne dla modelu, specyfikacje tabliczki znamionowej producenta, rejestr HIN, projekty instrukcji obsługi, listy obowiązujących norm i zapisy oceny zgodności dla każdej rodziny modeli.'
    - q: Jak zarezerwować wirtualną wycieczkę po fabryce?
      a: Skontaktuj się z naszym zespołem sprzedaży, aby zaplanować wycieczkę wideo na żywo za pośrednictwem WhatsApp, Zoom lub Teams. Podążamy tą samą trasą składającą się z 8 stacji i możemy skupić się na konkretnych obszarach w oparciu o Twoje zainteresowania. Typowa wirtualna wycieczka trwa 45-60 minut.
    - q: Czy fabryka jest faktycznym producentem czy firmą handlową?
      a: Aquafarer jest faktycznym producentem. Prowadzimy fabrykę w Laixi, Qingdao. Licencja na prowadzenie działalności, zakres produkcji i produkcja fizyczna są weryfikowalne podczas audytu.
    - q: Jakie zapisy dotyczące jakości mogę sprawdzić?
      a: Zapisy z inspekcji przychodzących materiałów, punkty kontrolne kontroli jakości w trakcie procesu, dzienniki prób ciśnieniowych, 100-punktowe listy kontrolne z kontroli końcowej, raporty o niezgodnościach, zapisy działań naprawczych i zapisy dotyczące identyfikowalności każdego kadłuba. Wszystko utrzymywane zgodnie z wymaganiami ISO 9001.
