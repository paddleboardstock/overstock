hero:
  tagline: Audyt fabryki i dowody
  title: Przygotowanie do audytu fabryki<br />i dowód jakości
  subtitle: Wszystko, co kupujący B2B weryfikują podczas wizyty w fabryce — od autentyczności produkcji i dokumentacji zgodności po identyfikowalność produkcji i systemy kontroli jakości. Gotowość do audytu każdego dnia.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Przygotowanie audytu fabryki Aquafarer i dowody jakości
direct_answer: Aquafarer utrzymuje gotowy do audytu obiekt w Qingdao o powierzchni 12 000 m² z udokumentowanymi procesami kontroli jakości, identyfikowalnością materiałów, dokumentacją produkcji na poziomie HIN i dokumentacją zgodności dla każdego kadłuba. Dla kwalifikujących się nabywców dostępne są wycieczki po fabryce na miejscu i wirtualne.
