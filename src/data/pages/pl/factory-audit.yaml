content_audit_evidence:
  tagline: Dowód weryfikacyjny
  title: Dowody z audytu<br />Możesz zweryfikować na miejscu
  subtitle: Podczas wizyt w fabrykach klienci mogą zweryfikować konkretne dowody w każdym obszarze produkcyjnym. Oto, na co należy zwrócić uwagę i co przygotowujemy do każdego audytu.
  areas:
    - area: Magazyn surowców
      what_to_verify: Czy materiały są stabilne? Czy istnieje mieszanie wsadowe?
      evidence: Dokumentacja kontroli przychodzącej, etykiety partii, przechowywanie FIFO, lista zatwierdzeń dostawców, certyfikaty materiałowe (PVC, Hypalon, włókno szklane, aluminium, kleje, sprzęt)
      icon: tabler:building-warehouse
    - area: Produkcja rur
      what_to_verify: W jaki sposób gwarantuje się wytrzymałość szwów i szczelność?
      evidence: Karty procesowe, potwierdzenie pierwszego artykułu, zapisy prób ciśnieniowych każdej komory, dzienniki napraw i ponownych testów, zapisy instalacji zaworów
      icon: tabler:flame
    - area: Produkcja kadłubów
      what_to_verify: W jaki sposób kontrolowana jest spójność strukturalna?
      evidence: Kontrolowana dokumentacja procesowa, punkty kontroli jakości, numeracja półproduktów, pomiary grubości żelkotu, weryfikacja harmonogramu laminacji
      icon: tabler:layers-subtract
    - area: Strefa montażu
      what_to_verify: W jaki sposób zapobiega się nieprawidłowemu montażowi części opcjonalnych?
      evidence: BOM, zlecenia pracy, listy kontrolne konfiguracji, karty kontroli stacji roboczej, kontrole momentu obrotowego i funkcjonalności dla każdego modelu
      icon: tabler:tool
    - area: Stacja testów
      what_to_verify: Jak sprawdzić, czy łódź jest dobra przed dostawą?
      evidence: Procedury testowe, lista przyrządów, zapisy kalibracji, dzienniki testów ciśnieniowych (1,25x / 24-48h), listy kontrolne testów funkcjonalnych, udokumentowane kryteria pozytywne/niezaliczone
      icon: tabler:gauge
    - area: Obszar niezgodności
      what_to_verify: Jak sobie radzi się z defektami?
      evidence: Etykiety izolacyjne, dzienniki NCR, analiza przyczyn źródłowych, zapisy zatwierdzeń przeróbek, śledzenie CAPA (działania korygujące i zapobiegawcze)
      icon: tabler:alert-triangle
    - area: Magazyn Wyrobów Gotowych
      what_to_verify: Jak zapobiegać błędnym dostawom i uszkodzeniom?
      evidence: Etykiety gotowych produktów, zapisy dopasowania zamówień, standardy pakowania, zapisy kontroli przed wysyłką
      icon: tabler:box
    - area: Części zamienne i obsługa posprzedażna
      what_to_verify: Czy możesz wspierać długoterminową obsługę posprzedażną?
      evidence: Wspólna lista części zamiennych, strategia zapasów, system numeracji części, dokumentacja procesu gwarancyjnego, tutoriale dotyczące konserwacji
      icon: tabler:headset
content_closing_script:
  tagline: Audyt na zamówienie
  title: Od wizyty w fabryce<br />do potwierdzonego projektu
  subtitle: Udany audyt nie powinien kończyć się zdjęciami i uściskiem dłoni. Przed wyjazdem upewniamy się, że udokumentowane są trzy wyniki komercyjne.
  items:
    - title: Potwierdź konfigurację techniczną
      description: Uzgodnij model, zastosowanie, kluczowe opcje, rynek docelowy, szacunkową ilość i harmonogram dostaw – wszystko udokumentowane przed wyjazdem.
      icon: tabler:checklist
    - title: Potwierdź dokumenty dotyczące następnego kroku
      description: 'Zdefiniuj, co Aquafarer zapewnia dalej: poprawiona umowa ogólna, lista konfiguracji, oferta cenowa, lista kontrolna dokumentów, przykładowy plan lub NDA – z określonymi harmonogramami.'
      icon: tabler:file-plus
    - title: Potwierdź wzajemną oś czasu
      description: Poprawiona konfiguracja i wstępna wycena w ciągu 3 dni roboczych. Potwierdzenie próbki lub wyglądu w ciągu 7 dni. Przegląd techniczny lub inspekcja strony trzeciej w ciągu 14 dni. Data następnego spotkania i osoby odpowiedzialne zablokowane.
      icon: tabler:calendar

