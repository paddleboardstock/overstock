      icon: tabler:lifebuoy
      link: /products
    - title: Akcesoria
      description: Pompy, wiosła, kamizelki ratunkowe, smycze, zestawy naprawcze i części zamienne do każdej deski, którą sprzedajemy.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Wytrzymałość fabryki
  title: Dlaczego nasze ceny wyprzedażowe<br />Są prawdziwe
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Prawdziwa fabryka, prawdziwe oszczędności — każda deska wysyłana jest z naszego zakładu w Weihai</h3>
  items:
    - title: Te same linie produkcyjne co główne marki
      description: Nasza fabryka Weihai o powierzchni 12 000 m² produkuje deski dla międzynarodowych marek oraz własne partie nadwyżkowe na tych samych liniach, używając tych samych materiałów.
    - title: 100% testy ciśnieniowe
      description: Każda deska jest ciśnieniowa do 1,25x i PSI utrzymywana przed wysyłką. 99,3% bezwadliwości na AQL 2,5 / ISO 2859.
    - title: Brak pośredników
      description: Deski wysyłkowe są wysyłane bezpośrednio pod Twoje drzwi. Bez marży dystrybutora, bez marży detalicznej — dzięki temu ceny wyprzedażowe pozostają do 60% niższe od detalicznej.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Fabryka Weihai o powierzchni 12 000 m² z SUP liniami produkcyjnymi nadmuchiwanych
content_compliance:
  tagline: Zgodność i dowód jakości
  title: Certyfikowana Jakość,<br />Udokumentowane
  subtitle: Każde zgłoszenie dotyczące zgodności jest poparte certyfikatami oraz dokumentacją specyficzną dla modelu, dostępną do weryfikacji.
  items:
    - title: ISO 9001:2015
      description: System zarządzania jakością certyfikowany przez TÜV Rheinland/SGS. Coroczne audyty nadzoru. Dokumentowane procesy kontroli jakości od napływających materiałów do wydania wysyłki.
      icon: tabler:certificate
    - title: CE Certyfikowany
      description: 13 CEmodeli certyfikowanych SUP zgodnie z obowiązującymi dyrektywami UE, każdy z konkretną Deklaracją Zgodności oraz danymi płyt budowlanych.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Wszystkie PVC materiały klejące spełniają przepisy UE REACH .UKCA Oznaczenie dostępne na rynek brytyjski. Karty charakterystyki materiałów na życzenie.
      icon: tabler:shield-check
    - title: 2-letnia SUP gwarancja
      description: SUP Każda deska i akcesoria objęte przez 2 lata — drop-stitch łącznie łączone z szwami, zaworami napompowującymi i akcesoriami. Szkody szybko rozwiązane.
      icon: tabler:lifebuoy
steps:
  title: Od zamówienia do wody — Jak wysyła Twoje zamówienie
  items:
    - title: Krok 1:<span class="font-medium">Wybierz swoją planszę</span>
      description: Wybierz modele uniwersalne, turystyczne, jogowe i dziecięce. Nasze przewodniki zakupowe pomagają dopasować rozmiar i styl deski do Twojego wiosłowania.
      icon: tabler:clipboard-list
    - title: Krok 2:<span class="font-medium">Bezpieczne wymeldowanie</span>
      description: Płać bezpiecznie przez Stripe lub PayPal. Wszystkie główne karty kredytowe i debetowe akceptowane. Konto nie jest potrzebne — potwierdzenie zamówienia trafia do Twojej skrzynki odbiorczej.
      icon: tabler:file-text
    - title: Krok 3:<span class="font-medium">Inspekcja jakości</span>
      description: Każda deska jest w 100% testowana na ciśnienie z oceną 1,25x PSI i sprawdzona według pełnej listy kontroli jakości przed pakowaniem.
      icon: tabler:settings
    - title: Krok 4:<span class="font-medium">Szybka Dyspozycja</span>
      description: Zamówienia na stanie są wysyłane z naszej fabryki w Weihai w ciągu 2-3 dni roboczych. Obsługa w trybie pilnym dostępna dla pilnych zamówień.
      icon: tabler:building-factory
    - title: Krok 5:<span class="font-medium">Dostawa śledzona</span>
      description: Śledziłem wysyłkę na całym świecie do 50+ krajów. Twoja 2-letnia gwarancja i responsywne wsparcie posprzedażowe zaczynają się od dnia, w którym dotrze deska.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Proces zamawiania od bezpiecznej kasy do śledzonej dostawy na całym świecie
