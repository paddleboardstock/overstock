content_customer_types:
  tagline: Komu służymy
  title: Deski dla każdego<br />Rodzaj wioślarza
  subtitle: Niezależnie od tego, czy to twoja pierwsza sesja, czy pięćdziesiąta, istnieje tablica do pływania dopasowana do twojego sposobu wiosłowania.
  items:
    - title: Początkujący
      description: Bardzo szerokie, stabilne deski do jazdy we wszystkich kierunkach, które ułatwiają pierwszą sesję — większość początkujących wstaje w ciągu kilku minut.
      icon: tabler:swimming
      cta: Sklep dla początkujących SUPs
      cta_href: /supboard
    - title: Rodziny
      description: Stabilne deski, którymi może cieszyć się cała rodzina, oraz lżejsze modele dla dzieci — sprzęt, który zmieści się w samochodzie i napompowuje w kilka minut.
      icon: tabler:beach
      cta: Kup Pakiety Rodzinne
      cta_href: /products
    - title: Turystyka i Fitness dla wioślarzy
      description: Dłuższe i szybsze deski turystyczne oraz pełnowymiarowe platformy do jogi dla wioślarzy, którzy pokonują duże dystanse.
      icon: tabler:route
      cta: Kup Deski Turystyczne i do Jogi
      cta_href: /supboard
    - title: Wędkarze
      description: Ultra-stabilne platformy z uchwytami na sprzęt i miejscem na lodówkę — rzucaj wędkę z cichego, płaskiego pokładu.
      icon: tabler:lifebuoy
      cta: Kup Deski Wędkarskie SUPs
      cta_href: /products
features:
  id: features
  tagline: Dlaczego warto kupować od Paddle Board Overstock
  title: Prawdziwa fabryka,<br />Prawdziwe oszczędności
  subtitle: Bezpośredni nadwyżki fabryczne i oferty wyprzedażowe SUP — certyfikowana jakość bez marży detalicznej.
  columns: 2
  items:
    - title: Do 60% taniej niż w sklepie
      description: Sprzedajemy nadwyżki i partie wyprzedażowe bezpośrednio — bez pośredników, bez marży detalicznej. Te same deski, które sprzedają się w pełnej cenie gdzie indziej, u nas w cenach wyprzedażowych.
      icon: tabler:rocket
    - title: Kompletne pakiety
      description: 'Każdy SUP jest oferowany jako kompletny pakiet: deska, plecak podróżny, pompka ręczna, regulowane wiosło, wyjmowane fin, linka skręcana i zestaw naprawczy.'
      icon: tabler:clipboard-list
    - title: Certyfikowana jakość
      description: 13 modeli CE-certyfikowanych SUP według obowiązujących dyrektyw UE. Każda deska jest w 100% testowana pod ciśnieniem 1,25x nominalnego PSI przed wysyłką. 99,3% desek bez wad zgodnie z AQL 2.5.
      icon: tabler:certificate
    - title: Brak MOQ — zamów jedną deskę
      description: Wyprzedaż nadwyżek oznacza, że zamówienia na pojedyncze sztuki są mile widziane. Dodaj deskę do koszyka, dokonaj zakupu, gotowe. Brak minimalnej ilości zakupu, brak procesu wyceny.
      icon: tabler:adjustments
    - title: Szybka wysyłka na całym świecie
      description: Zamówienia dostępne w magazynie wysyłamy z Weihai w ciągu 2-3 dni roboczych. Śledzona dostawa do 50+ krajów w UE, Ameryce Północnej, regionie Azji i Pacyfiku i poza nim.
      icon: tabler:truck-delivery
    - title: 2-letnia SUP gwarancja
      description: Każda deska SUP i akcesoria objęte są 2-letnią gwarancją — w tym szwy drop-stitch, zawory pompowania i akcesoria. Roszczenia rozpatrywane są w ciągu dni, a nie tygodni.
      icon: tabler:lifebuoy
