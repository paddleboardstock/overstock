      link: /accessory
content_workshop:
  isReversed: true
  tagline: Wytrzymałość fabryki
  title: Dlaczego nasze ceny wyprzedażowe<br />są prawdziwe
  content: <h3 class="text-2xl czcionka-bold śledzenie-tight dark:text-white sm:text-3xl mb-2">Prawdziwa fabryka, prawdziwe oszczędności — każda deska jest wysyłana z naszego zakładu w Weihai</h3>
  items:
    - title: Te same linie produkcyjne co główne marki
      description: Nasza fabryka Weihai o powierzchni 12 000 m² produkuje deski dla międzynarodowych marek oraz własne partie nadwyżkowe na tych samych liniach, używając tych samych materiałów.
    - title: 100% testy ciśnieniowe
      description: Każda deska jest poddawana ciśnieniu znamionowemu 1,25x PSI i utrzymywana przed wysyłką. 99,3% współczynnika braku defektów w każdej partii.
    - title: Brak pośredników
      description: Deski wysyłamy bezpośrednio do Twoich drzwi. Żadnych pośredników, żadnych marż detalicznych — dzięki temu ceny wyprzedażowe pozostają nawet o 60% niższe od detalicznych.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Fabryka Weihai o powierzchni 12 000 m² z SUP liniami produkcyjnymi nadmuchiwanych
content_compliance:
  tagline: Jakość i testowanie
  title: Sprawdzona jakość,<br />udokumentowana
  subtitle: Każde twierdzenie dotyczące jakości jest poparte rzeczywistymi liczbami z naszej linii produkcyjnej – próbami ciśnieniowymi, zapisami partii i zmierzonymi wskaźnikami defektów.
  items:
    - title: 100% testowane ciśnieniowo
      description: Każda deska jest napompowana do wartości znamionowej 1,25x PSI i przechowywana przed wysyłką. Jeśli szew, zawór lub nić ściegu kropelkowego ulegnie uszkodzeniu, deska nigdy nie opuszcza fabryki.
      icon: tabler:shield-check
    - title: Wskaźnik braku usterek na poziomie 99,3%.
      description: Mierzone w każdej partii produkcyjnej. Liczba pochodzi z naszych własnych zapisów z kontroli końcowej, a nie z marketingu.
      icon: tabler:gauge
    - title: Śledzenie partii
      description: Każda płyta posiada kod partii produkcyjnej, więc roszczenia gwarancyjne i kontrole jakości odnoszą się do dokładnych materiałów i serii.
      icon: tabler:clipboard-check
    - title: 2-letnia SUP gwarancja
      description: SUP Każda deska i akcesoria objęte przez 2 lata — drop-stitch łącznie łączone z szwami, zaworami napompowującymi i akcesoriami. Szkody szybko rozwiązane.
      icon: tabler:lifebuoy
steps:
  title: Od zamówienia do wody — Jak wysyła Twoje zamówienie
  items:
    - title: 'Krok 1: <span class="font-medium">Wybierz swoją tablicę</span>'
      description: Wybierz modele uniwersalne, turystyczne, jogowe i dziecięce. Nasze przewodniki zakupowe pomagają dopasować rozmiar i styl deski do Twojego wiosłowania.
      icon: tabler:clipboard-list
    - title: 'Krok 2: <span class="font-medium">Bezpieczna płatność</span>'
      description: Płać bezpiecznie przez Stripe lub PayPal. Wszystkie główne karty kredytowe i debetowe akceptowane. Konto nie jest potrzebne — potwierdzenie zamówienia trafia do Twojej skrzynki odbiorczej.
      icon: tabler:file-text
    - title: 'Krok 3: <span class="font-medium">Kontrola jakości</span>'
      description: Każda deska jest w 100% testowana na ciśnienie z oceną 1,25x PSI i sprawdzona według pełnej listy kontroli jakości przed pakowaniem.
      icon: tabler:settings
    - title: 'Krok 4: <span class="font-medium">Szybka wysyłka</span>'
      description: Zamówienia na stanie są wysyłane z naszej fabryki w Weihai w ciągu 2-3 dni roboczych. Obsługa w trybie pilnym dostępna dla pilnych zamówień.
      icon: tabler:building-factory
    - title: 'Krok 5: <span class="font-medium">Śledzenie dostawy</span>'
      description: Śledziłem wysyłkę na całym świecie do 50+ krajów. Twoja 2-letnia gwarancja i responsywne wsparcie posprzedażowe zaczynają się od dnia, w którym dotrze deska.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Proces zamawiania od bezpiecznej kasy do śledzonej dostawy na całym świecie
blog_latest:
  title: SUP Przewodniki i wskazówki techniczne
  information: |-
    Przewodniki zakupowe, technika wiosłowania, podstawy bezpieczeństwa i konstrukcja
    badania przeprowadzone przez zespół Paddle Board Overstock.
faqs:
  title: SUP Zamawianie i FAQ dotyczące produktów
  subtitle: Typowe pytania dotyczące naszych tablic wyprzedaży SUP , zamówień, płatności, wysyłki i gwarancji.
  columns: 2
  items:
    - title: Czy SUP trudno się nauczyć?
      description: Wcale nie. Większość początkujących wstaje i wiosłuje już podczas pierwszej sesji. SUP Nasze deski uniwersalne mają bardzo szerokie stabilne platformy zaprojektowane specjalnie dla początkujących kajakarzy. Zacznij na spokojnej wodzie, a za kilka minut będziesz płynąć.
      icon: tabler:swimming
      category: pić małymi łykami
    - title: Jaki jest limit wagowy?
      description: SUPs Nasza wszechstronna obsługa do 220 funtów, a platformy turystyczne i jogi do 250 funtów. Każda strona produktu zawiera dokładną wagę rowerzysty, dzięki czemu możesz dopasować deskę do swoich potrzeb.
      icon: tabler:adjustments
      category: pić małymi łykami
    - title: Czy mogę podróżować z dmuchanym SUP?
      description: Zdecydowanie. Każda Paddle Board Overstock deska pakuje się do torby wielkości plecaka. Ważąca zaledwie 18-22 funty, łatwo ją przenieść na plażę, jezioro lub przez terminale lotniskowe. Sprawdź politykę bagażową w linii lotniczej przed podróżą.
      icon: tabler:truck-delivery
      category: pić małymi łykami
    - title: Co jest w pudełku?
      description: Każdy Paddle Board Overstock SUP zawiera deskę, plecak podróżny, pompkę ręczną, regulowaną wiosłkę, zdejmowaną statecznicę, smycz do sprężania oraz zestaw naprawczy.
      icon: tabler:clipboard-list
      category: pić małymi łykami
    - title: Dlaczego wasze ceny są niższe niż ceny detaliczne?
      description: Sprzedajemy fabryczne nadwyżki — zupełnie nowe deski pozostałe po zrealizowanych zamówieniach produkcyjnych — pochodzące z naszej własnej bazy produkcyjnej Weihai i wybranych partnerów produkcyjnych. Brak narzutów detalicznych i brak pośredników oznacza kompletne pakiety SUP nawet o 60% zniżki od typowych cen detalicznych, przy tej samej sprawdzonej jakości.
      icon: tabler:shield-check
      category: święcenia
    - title: Jak złożyć zamówienie i zapłacić?
      description: Dodaj swój SUP pakiet do koszyka i dokonaj bezpiecznej płatności za pomocą Stripe lub PayPal. Akceptujemy wszystkie główne karty kredytowe i debetowe. Każde zamówienie jest potwierdzane e-mailem wraz z pełną fakturą.
      icon: tabler:file-text
      category: święcenia
    - title: Czy wysyłacie na cały świat?
      description: Tak. Wysyłamy do 50+ krajów w całej UE, Ameryce Północnej, regionie Azji i Pacyfiku, na Bliskim Wschodzie oraz w Afryce. Zamówienia dostępne w magazynie zazwyczaj wysyłane są w ciągu 2-3 dni roboczych, a dla każdej paczki udostępniany jest numer do śledzenia.
      icon: tabler:route
      category: święcenia
    - title: Jaką gwarancję obejmują płyty SUP?
      description: 'Każda SUP deska i akcesorium objęte są 2-letnią gwarancją — w tym sama deska, drop-stitch szwy i zawory do pompowania. Roszczenia rozpatrywane są w ciągu dni, a nie tygodni: złóż zgłoszenie online, a my naprawimy lub wymienimy.'
      icon: tabler:lifebuoy
      category: święcenia
