      link: /supboard
    - title: Zwiedzanie SUPs
      description: Dłuższe, szybsze deski z plansami po jeziorach, rzekach i przybrzeżach.
      icon: tabler:route
      link: /supboard
    - title: Joga i fitness SUPs
      description: Ekstra szerokie, ultra-stabilne platformy z podłogami na pełnej długości do jogi i ćwiczeń na wodzie.
      icon: tabler:users
      link: /supboard
    - title: Dzieci SUPs
