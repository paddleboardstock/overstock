content_customer_types:
  tagline: Komu dostarczamy
  title: 'Stworzone dla kupujących B2B<br />— nie dla klientów detalicznych'
  subtitle: 'Paddle Board Overstock produkuje dla czterech typów klientów. Każdy ma inne priorytety — a my odpowiadamy na wszystkie.'
  items:
    - title: Właściciele marek / Private Label
      description: 'Niestandardowy projekt produktu, grafika private-label, dokumentacja zgodności pod Twoją marką i dedykowane wsparcie inżynieryjne od koncepcji do kontenera.'
      icon: tabler:palette
      cta: Zapytaj o wycenę OEM/ODM
      cta_href: /request-quotation
    - title: Dystrybutorzy / Hurtownicy
      description: 'Ochrona terytorium, konkurencyjne ceny hurtowe, zestawy wsparcia marketingowego, szkolenia produktowe i pełna dokumentacja zgodności dla Twojego rynku.'
      icon: tabler:world
      cta: Złóż wniosek o dealership
      cta_href: /dealers-distributors
    - title: Kurorty / Operatorzy wypożyczalni
      description: 'Trwałość klasy komercyjnej, doradztwo w doborze floty, mieszane zamówienia kontenerowe, strategia części zamiennych i pakiety sprzętu z brandem kurortu.'
      icon: tabler:beach
      cta: Uzyskaj pakiet komercyjny
      cta_href: /solutions/resorts
    - title: Ratownictwo / Administracja / Profesjonaliści
      description: 'Konstrukcja Hypalon/CSM, opcje zgodności SOLAS, certyfikacja pod konkretny projekt, wsparcie dokumentacji przetargowej i inżynieria chroniona umową NDA.'
      icon: tabler:shield
      cta: Omów projekt
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: Możliwości OEM/ODM
  title: 'Co zyskujesz<br />współpracując z Paddle Board Overstock'
  subtitle: 'Bezpośredni dostęp do fabryki z pełnym wsparciem inżynieryjnym, jakościowym i zgodności — nie firma handlowa.'
  columns: 2
  items:
    - title: Personalizacja OEM/ODM
      description: 'Niestandardowy projekt kadłuba, materiał rur (PVC lub Hypalon/CSM), układ konsoli, siedzenia, branding, kolory i opakowanie. Od drobnych modyfikacji po pełną inżynierię na zamówienie.'
      icon: tabler:adjustments
    - title: Niskie MOQ, szybkie próbki
      description: 'RIB: 2–5 szt. (istniejąca forma). SUP: 5–10 szt. na SKU. Własne formy: 200+ szt. Próbki przedprodukcyjne z Twoim brandingiem w 7–14 dni.'
      icon: tabler:rocket
    - title: Jakość gotowa do produkcji seryjnej
      description: 'Każda jednostka testowana pod ciśnieniem 1,25× nominalnego PSI przez 24–48 godzin. 99,3% bez wad według AQL 2,5 / ISO 2859. 100-punktowa lista kontrolna jakości dla każdego kadłuba.'
      icon: tabler:certificate
    - title: Pełna dokumentacja zgodności
      description: 'CE zgodnie z 2013/53/EU (RCD), ISO 9001:2015 (SGS), audyt społeczny BSCI, zgodność REACH, oznakowanie UKCA. Deklaracja zgodności dla każdego modelu i dane tabliczki producenta w zestawie.'
      icon: tabler:file-certificate
    - title: Czas realizacji 30–45 dni
      description: 'Standardowa produkcja 30–45 dni FOB Qingdao. Prototypy w 7–14 dni. Dostępna produkcja ekspresowa. Plany załadunku kontenerów i opakowania ISPM-15 w zestawie.'
      icon: tabler:truck-delivery
    - title: Wsparcie posprzedażowe i części zamienne
      description: '5 lat gwarancji na łodzie/kajaki/RIB, 2 lata na SUP/akcesoria. Dostawa części zamiennych z wysyłką priorytetową. Wsparcie w obsłudze reklamacji gwarancyjnych.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Kategorie produktów
  title: '5 kategorii,<br />64 modele z certyfikatem CE'
  subtitle: 'Od tenderów RIB 2,4 m do desek SUP 15 stóp — wszystko produkowane w naszym zakładzie ISO 9001 w Qingdao.'
  items:
    - title: Łodzie RIB
      description: 'Od 2,4 do 7,0 m z kadłubem aluminiowym lub GRP. Rury z PVC lub Hypalon/CSM. CE zgodnie z 2013/53/EU. Konfiguracje patrolowe, nurkowe, ratownicze i komercyjne.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Łodzie pneumatyczne
      description: 'Od 2,0 do 5,0 m z podłogą aluminiową, sklejkową lub powietrzną. Modele wędkarskie, rekreacyjne i tenderowe.'
      icon: tabler:sailboat
      link: /products
    - title: Deski SUP
      description: 'Od 9 do 15 stóp w technologii Drop-Stitch 4 i 6 cali. Modele uniwersalne, turystyczne, do jogi i wędkarskie. Dostępne w jakości komercyjnej.'
      icon: tabler:swimming
      link: /products
    - title: Kajaki
      description: 'Kajaki pneumatyczne 1–3-osobowe. Modele rekreacyjne i turystyczne z podłogą Drop-Stitch.'
      icon: tabler:kayak
      link: /products
    - title: Akcesoria bezpieczeństwa
      description: 'Certyfikowane CE kamizelki ratunkowe, rzutki, zestawy naprawcze, pompy i światła nawigacyjne. Kamizelki zatwierdzone USCG Typ III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Potencjał fabryki
  title: 'Produkcja gotowa<br />na audyt w Qingdao'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12 000 m² zakładu ISO 9001 — prawdziwy producent, nie firma handlowa</h3>
  items:
    - title: 6 dedykowanych linii produkcyjnych
      description: 'Osobne linie dla RIB, łodzi pneumatycznych, SUP, kajaków, sprzętu ratowniczego i OEM/ODM. Każda z dedykowanymi punktami kontroli QC i własnym planowaniem produkcji.'
    - title: 100% testów ciśnieniowych
      description: 'Każda komora pneumatyczna napompowana do 1,25× nominalnego ciśnienia i utrzymywana przez 24–48 godzin. Wyniki testów powiązane z numerem seryjnym kadłuba (HIN).'
    - title: Pełna identyfikowalność kadłuba
      description: 'Zapisy produkcji na poziomie HIN z ponad 21 polami danych na kadłub: partia materiału, ID spawacza, wynik testu ciśnieniowego, konfiguracja końcowa i miejsce dostawy.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Zakład produkcyjny Paddle Board Overstock ISO 9001 o powierzchni 12 000 m² w Qingdao z liniami produkcyjnymi RIB

content_compliance:
  tagline: Zgodność i dowody jakości
  title: 'Udokumentowane dowody,<br />nie tylko deklaracje'
  subtitle: 'Każde oświadczenie o zgodności poparte jest dokumentacją dla konkretnego modelu, dostępną do Twojej weryfikacji.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'System zarządzania jakością certyfikowany przez TÜV Rheinland/SGS. Coroczne audyty nadzoru. Udokumentowane procesy QC od przyjęcia materiału do wydania do wysyłki.'
      icon: tabler:certificate
    - title: CE zgodnie z 2013/53/EU (RCD)
      description: '64 modele z indywidualnymi deklaracjami zgodności. Ocena zgodności według właściwych modułów. Rejestracja HIN i dane tabliczki producenta dla każdego kadłuba.'
      icon: tabler:file-certificate
    - title: Zgodność społeczna BSCI
      description: 'Coroczny audyt BSCI przeprowadzany przez SGS. Zweryfikowane etyczne praktyki zatrudnienia, bezpieczeństwo pracy i zarządzanie środowiskowe w całym zakładzie.'
      icon: tabler:users
    - title: REACH i UKCA
      description: 'Wszystkie materiały PVC i kleje spełniają rozporządzenie REACH UE. Oznakowanie UKCA dostępne na rynek brytyjski. Karty charakterystyki materiałów na życzenie.'
      icon: tabler:shield-check

steps:
  title: Proces OEM/ODM — od briefu do kontenera
  items:
    - title: 'Krok 1: <span class="font-medium">Wymagania</span>'
      description: 'Prześlij specyfikację produktu, rynek docelowy, ilość i wymagania dotyczące zgodności. Nasz zespół inżynieryjny odpowiada w ciągu 48 godzin.'
      icon: tabler:file-text
    - title: 'Krok 2: <span class="font-medium">Propozycja</span>'
      description: 'Otrzymujesz szczegółową propozycję ze specyfikacjami, opcjami materiałowymi, MOQ, cenami, czasem realizacji i zakresem zgodności dla Twojego rynku.'
      icon: tabler:clipboard-list
    - title: 'Krok 3: <span class="font-medium">Prototyp</span>'
      description: 'Próbka przedprodukcyjna z Twoim brandingiem w 7–14 dni. Pełne testy jakości przy 1,25× ciśnienia nominalnego. Koszt próbki zaliczany na produkcję.'
      icon: tabler:settings
    - title: 'Krok 4: <span class="font-medium">Produkcja</span>'
      description: 'Produkcja 30–45 dni FOB Qingdao po zatwierdzeniu próbki. Punkty kontroli QC w procesie, testy ciśnieniowe i 100-punktowa kontrola końcowa każdej sztuki.'
      icon: tabler:building-factory
    - title: 'Krok 5: <span class="font-medium">Dostawa</span>'
      description: 'Plan załadunku kontenera, drewniane opakowania ISPM-15, pakiet dokumentacji zgodności i wysyłka FOB Qingdao z pełną dokumentacją eksportową.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Proces produkcyjny OEM/ODM łodzi pneumatycznych Paddle Board Overstock — od projektu do wysyłki kontenerem

blog_latest:
  title: Wnioski branżowe i techniczne
  information: |
    Poradniki zgodności RCD, artykuły o procesie OEM/ODM, porównania materiałów
    i zasady audytów fabrycznych od zespołu inżynieryjnego Paddle Board Overstock.

faqs:
  title: FAQ zakupów B2B
  subtitle: 'Częste pytania marek, dystrybutorów i operatorów komercyjnych dotyczące produkcji OEM/ODM w Paddle Board Overstock.'
  columns: 2
  items:
    - title: Czy jesteście producentem czy firmą handlową?
      description: 'Jesteśmy fabryką zintegrowaną pionowo z pełną kontrolą jakości, materiałów i terminów. Licencja działalności i zakres produkcji do weryfikacji podczas audytu fabryki.'
      icon: tabler:building-factory
      category: all
    - title: Jak przebiega Wasz proces OEM/ODM?
      description: 'Od analizy wymagań (48 h) przez propozycję i prototyp (7–14 dni) po produkcję (30–45 dni FOB Qingdao). Na każdym etapie pełne wsparcie inżynieryjne, dokumentacja zgodności i identyfikowalność kadłuba.'
      icon: tabler:route
      category: all
    - title: Jakie są Wasze wymagania MOQ?
      description: 'Łodzie RIB: 2–5 szt. na model (istniejąca forma), 200+ dla własnych form. Deski SUP: 5–10 szt. na SKU. Dostępne mieszane zamówienia kontenerowe. Zamówienia próbne od 2–5 szt. w celu oceny.'
      icon: tabler:sort-ascending
      category: all
    - title: Jakie opcje personalizacji są dostępne?
      description: 'Projekt kadłuba, materiał rur (PVC lub Hypalon/CSM), średnica rur, układ konsoli, siedzenia, układ sterowania, system paliwowy, układ pokładu, kolory marki, grafika logo, design padów EVA, opakowanie detaliczne i branding instrukcji obsługi.'
      icon: tabler:adjustments
      category: all
    - title: Jakie dokumenty zgodności dostarczycie na nasz rynek?
      description: 'Deklaracja CE zgodnie z 2013/53/EU, oznakowanie UKCA, certyfikat ISO 9001 (SGS), raport audytu BSCI, zgodność REACH, raporty badań materiałów, protokoły testów ciśnieniowych i dane tabliczki producenta dla każdego modelu. Dokumentacja dla konkretnego rynku na życzenie.'
      icon: tabler:file-certificate
      category: all
    - title: Jaki jest czas realizacji próbek i produkcji?
      description: 'Próbki przedprodukcyjne: 7–14 dni roboczych. Produkcja standardowa: 30–45 dni FOB Qingdao. Produkcja ekspresowa dostępna za dopłatą. W sezonie szczytowym (marzec–czerwiec) terminy mogą się wydłużyć.'
      icon: tabler:clock
      category: all
    - title: Czy mogę umówić audyt fabryki lub transmisję wideo na żywo?
      description: 'Tak. Audyty na miejscu w naszym zakładzie w Qingdao mile widziane po uprzedzeniu 3–5 dni wcześniej. Transmisje wideo na żywo przez WhatsApp/Zoom dostępne od razu. Inspekcje podmiotów trzecich (SGS, BV, TÜV) wspierane.'
      icon: tabler:video
      category: all
    - title: Jakie kontrole jakości są wykonywane przed wysyłką?
      description: 'Test utrzymania ciśnienia 1,25× nominalnego (24–48 h), test odrywania szwów, 100-punktowa lista kontrolna kontroli końcowej, weryfikacja wymiarów, kontrola wizualna, weryfikacja dokumentacji zgodności i kontrola integralności opakowania. Wszystko według procedur ISO 9001.'
      icon: tabler:clipboard-check
      category: all

