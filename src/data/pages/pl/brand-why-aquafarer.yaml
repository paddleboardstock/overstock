features3_reasons:
  tagline: Dlaczego warto wybrać Aquafarer
  title: 'Siedem powodów, żeby zostać naszym partnerem'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Prawdziwa produkcja, nie handel'
      description: 'Jesteśmy właścicielami i operatorami fabryki o powierzchni 12 000 m². Współpracując z Aquafarer, pracujesz bezpośrednio z ludźmi, którzy projektują, konstruują i budują Twoje produkty — bez pośredników.'
      icon: tabler:building-factory
    - title: '2. Podejście inżynierskie'
      description: 'Nasz proces projektowania zaczyna się od przypadku użycia, a nie od kategorii produktu. Optymalizujemy kształt kadłuba, dobór materiałów i konfigurację pod rzeczywiste wykorzystanie łodzi.'
      icon: tabler:engine
    - title: '3. Certyfikowana jakość'
      description: 'Certyfikat CE, system jakości ISO, zgodność z BSCI i REACH, aprobata USCG. Nasze 64 modele z certyfikatem CE spełniają normy międzynarodowe — to nie tylko deklaracje.'
      icon: tabler:certificate
    - title: '4. Elastyczne OEM/ODM'
      description: 'Kolory rur, układ konsoli, branding, opakowanie — dostosowujemy wszystko do Twoich specyfikacji. Żadnej presji minimalnego zamówienia. Zacznij od prototypu, skaluj z pewnością.'
      icon: tabler:adjustments
    - title: '5. Globalna logistyka'
      description: 'Magazyn w USA w Kalifornii, wysyłka bezpośrednia z Qingdao, transport lotniczy dla pilnych zamówień. Załatwiamy dokumentację celną.'
      icon: tabler:truck-delivery
    - title: '6. Dożywotnie wsparcie'
      description: 'Wspieramy łodzie zbudowane przez nas 20 lat temu. Oryginalne części zamienne, porady techniczne, wskazówki dotyczące napraw — nasz zespół jest dostępny, kiedy nas potrzebujesz.'
      icon: tabler:lifebuoy
    - title: '7. Uczciwe specyfikacje'
      description: 'Rzeczywiste ładowności, rzeczywiste wymiary, rzeczywista waga. Bez marketingowych zawyżeń. To, co publikujemy, to dokładnie to, co otrzymujesz — potwierdzone niezależnymi testami.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Zaufanie marek na całym świecie
  title: Co mówią nasi partnerzy
  items:
    - content: 'Współpracowaliśmy z kilkoma producentami w Chinach, ale Aquafarer wyróżnia się wsparciem inżynieryjnym i powtarzalną jakością. Traktują naszą markę jak własną.'
      name: '— Partner OEM, europejska marka sportów wodnych'
    - content: 'Ich łodzie RIB z Hypalonu służą w naszej flocie od ponad 5 lat. Minimalna konserwacja, doskonała odporność na UV. 5-letnia gwarancja na rury daje nam pewność.'
      name: '— Operator floty, grupa kurortów na Bliskim Wschodzie'
    - content: 'Zespół Aquafarer pomógł nam opracować niestandardowy projekt deski SUP od koncepcji do produkcji w 90 dni. Jakość przeszła nasze oczekiwania.'
      name: '— Dystrybutor, australijskie sporty wodne'
cta:
  title: 'Gotowy poczuć różnicę?'
  subtitle: 'Skontaktuj się z naszym zespołem, aby omówić Twój projekt. Bez żadnych zobowiązań — po prostu uczciwe porady o produkcji.'
  actions:
    - variant: primary
      text: Porozmawiaj z naszym zespołem
      href: /contact
    - text: Pobierz katalog produktów
      href: /resources
