hero:
  tagline: Dlaczego Aquafarer
  title: Inny w budowie. Stworzony dla biznesu.<br />Partner wspierający przygody wodne na całym świecie
  subtitle: Nie tylko producent — partner biznesowy, który projektuje, konstruuje i dostarcza sprzęt klasy komercyjnej dla klubów, ośrodków wypoczynkowych, operatorów wynajmu i rozwijających się marek wodnych.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer jakość produkcji i ekspertyza
pillars:
  tagline: Trzy filary partnerstwa
  title: Dlaczego światowe firmy wodne wybierają Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Zaprojektowane do użytku komercyjnego
      description: Nasze wyposażenie jest zaprojektowane do codziennego wynajmu, a nie weekendowej rekreacji. Komercyjnej jakości PVC, wzmocnione jądra drop-stitch, stabilne w UV opcje Hypalon oraz przetestowany w terenie sprzęt oznaczają niższe koszty utrzymania, dłuższą żywotność i wyższą ROI dla Twojej działalności.
      icon: tabler:building-factory
      callToAction:
        text: Zobacz linię produktów komercyjnych
        href: /products
    - title: Od pomysłu do rynku
      description: 'Wprowadź swoją markę sportów wodnych w 90 dni. Przeprowadzimy Cię przez każdy etap: weryfikację koncepcji, wybór produktu, prototyp, produkcję, projekt opakowania i globalną wysyłkę. Brak presji minimalnego zamówienia — zacznij od małych ilości, rozwijaj się z pewnością.'
      icon: tabler:rocket
      callToAction:
        text: Rozpocznij swoją podróż z marką
        href: /oem-odm-blueprint
    - title: Zaprojektowany na warunki globalne
      description: 'Produkty zoptymalizowane pod każdy klimat: formuły do wody zimnej PVC dla Europy, materiały odporne na UV dla Bliskiego Wschodu i Australii, zabiegi przeciwwilgociowe dla Azji Południowo-Wschodniej. Każda przesyłka jest skalibrowana do środowiska jej przeznaczenia.'
      icon: tabler:world
