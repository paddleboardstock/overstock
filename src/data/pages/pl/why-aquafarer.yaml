reasons:
  tagline: Różnica Aquafarer
  title: Co nas wyróżnia
  isBeforeContent: false
  columns: 3
  items:
    - title: Prawdziwa produkcja, nie handel
      description: Posiadamy i prowadzimy fabrykę o powierzchni 12 000 m². Kiedy współpracujesz z Aquafarer, pracujesz bezpośrednio z osobami, które projektują, konstruują i wytwarzają Twoje produkty — bez pośredników.
      icon: tabler:building-factory
    - title: Podejście kierowane przez inżynierię
      description: Nasz proces projektowania zaczyna się od przypadku użycia, a nie od kategorii produktu. Optymalizujemy kształt kadłuba, dobór materiałów i konfigurację pod kątem tego, jak sprzęt będzie faktycznie używany w środowiskach komercyjnych.
      icon: tabler:engine
    - title: Certyfikowana jakość
      description: CE certyfikowany, ISO system jakości, BSCI zgodny, REACH zgodny, USCG kamizelki ratunkowe zatwierdzone typu III/V; wszystkie produkty spełniają obowiązujące międzynarodowe normy.
      icon: tabler:certificate
    - title: Elastyczny OEM/ODM
      description: Kolory tub, układ konsoli, branding, opakowania — dostosowujemy do Twoich wymagań. Brak presji minimalnego zamówienia. Zacznij od prototypu, rozwijaj się z pewnością.
      icon: tabler:adjustments
    - title: Globalna logistyka
      description: Magazyn w USA w Kalifornii, bezpośrednia wysyłka z Qingdao, transport lotniczy dla pilnych zamówień. Załatwiamy dokumenty celne i formalności na całym świecie.
      icon: tabler:truck-delivery
    - title: Wsparcie na całe życie
      description: Wspieramy łodzie, które zbudowaliśmy 20 lat temu. Oryginalne części zamienne, porady techniczne, wskazówki dotyczące napraw — nasz zespół jest dostępny, kiedy go potrzebujesz, gdziekolwiek jesteś.
      icon: tabler:lifebuoy
testimonials:
  tagline: Zaufany przez marki na całym świecie
  title: Co mówią nasi partnerzy
  items:
    - content: Współpracowaliśmy z kilkoma producentami w Chinach, ale Aquafarer wyróżnia się wsparciem inżynieryjnym i stałą jakością. Traktują naszą markę jak swoją własną.
      name: — OEM Partner, europejska marka sportów wodnych
    - content: Ich Hypalon RIBs służą w naszej flocie od ponad 5 lat. Minimalna konserwacja, doskonała odporność UV. 5-letnia gwarancja na rury daje nam pewność.
      name: — Operator Floty, Grupa Kurortów Bliskiego Wschodu
    - content: Zespół Aquafarer pomógł nam opracować niestandardowy projekt płytki SUP od koncepcji do produkcji w ciągu 90 dni. Jakość przewyższyła nasze oczekiwania.
      name: — Dystrybutor, Australijskie Sporty Wodne
    - content: Jako właściciel małej firmy, martwiłem się o MOQs. Aquafarer dopasował się do mojego budżetu i pomógł mi wprowadzić moją markę przy zaledwie 50 deskach. Teraz zamawiam 500.
      name: — Założyciel marki, USA SUP Firma wynajmująca
cta:
  title: Gotowy, aby zbudować swój biznes wodny?
  subtitle: Skontaktuj się z naszym zespołem, aby uzyskać bezpłatną konsultację. Brak zobowiązań — tylko uczciwe porady dotyczące sprzętu i produkcji.
  actions:
    - variant: primary
      text: Porozmawiaj z naszym zespołem
      href: /contact
    - text: Pobierz katalog produktów
      href: /resources
