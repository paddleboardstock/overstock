hero_text:
  tagline: Zasoby
  title: 'Centrum pobierania i przewodniki dla kupujących'
  subtitle: 'Korzystaj z katalogów produktów, przewodników OEM, list kontrolnych dla kupujących i dokumentacji technicznej, aby podejmować świadome decyzje zakupowe.'
features3_downloads:
  tagline: Do pobrania
  title: 'Dokumentacja produktów<br />i zasoby dla kupujących'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Katalog produktów morskich 2026'
      description: 'Pełna gama produktów, w tym łodzie RIB, łodzie pneumatyczne, deski SUP, kajaki i akcesoria. Specyfikacje, konfiguracje i opcje. Format PDF.'
      icon: tabler:file-text
    - title: 'Przewodnik po produkcji OEM'
      description: 'Wszystko, co musisz wiedzieć o partnerstwach OEM/ODM: przegląd procesu, minimalne ilości zamówienia, opcje personalizacji, kontrola jakości i wysyłka.'
      icon: tabler:building-factory
    - title: 'Przewodnik zakupowy: łodzie RIB'
      description: 'Jak wybrać odpowiednią łódź RIB: materiały kadłuba, materiały pontonów, dobór silnika, kwestie rozmiaru i opcje konfiguracji do różnych zastosowań.'
      icon: tabler:file-description
    - title: 'Lista kontrolna dostawcy SUP'
      description: 'Kluczowe kwestie przy wyborze producenta desek SUP: wskaźniki jakości, wymagania certyfikacyjne, kwestie MOQ i na co zwrócić uwagę podczas audytu fabryki.'
      icon: tabler:clipboard-check
    - title: 'Przewodnik po materiałach do łodzi pneumatycznych'
      description: 'PVC czy Hypalon: porównanie trwałości, odporności na UV, żywotności, opcji naprawy i kosztów dla różnych zastosowań morskich.'
      icon: tabler:files
    - title: 'Szablon briefu dla produkcji na zamówienie'
      description: 'Pobierz nasz szablon briefu produktowego. Wypełnij swoje wymagania i odeślij go do nas, aby otrzymać wycenę w ciągu tego samego tygodnia oraz ocenę wykonalności.'
      icon: tabler:template
faqs:
  title: Często zadawane pytania
  subtitle: 'Częste pytania dotyczące naszych produktów, procesu produkcji i modelu partnerstwa.'
  columns: 2
  items:
    - title: Jaka jest minimalna ilość zamówienia?
      description: 'MOQ zależy od kategorii produktu. Łodzie RIB — zazwyczaj od 10 sztuk na model. Deski SUP — od 50 sztuk. Skontaktuj się z naszym działem sprzedaży, aby poznać MOQ dla konkretnych produktów.'
      icon: tabler:help-circle
    - title: Czy mogę otrzymać próbki przed złożeniem zamówienia?
      description: 'Tak. Aquafarer zapewnia produkcję próbek do oceny przed produkcją masową. Koszty próbek są negocjowane i często zaliczane na poczet pierwszego zamówienia produkcyjnego.'
      icon: tabler:package
    - title: Jakie są dostępne warunki płatności?
      description: 'Standardowe warunki: 30% zadatku przy zamówieniu, 70% przed wysyłką. Warunki LC są dostępne dla kwalifikujących się klientów. Skontaktuj się z naszym działem finansowym, aby omówić szczegóły.'
      icon: tabler:currency-dollar
    - title: Ile trwa produkcja?
      description: 'Typowe terminy realizacji: łodzie RIB 30-45 dni, deski SUP 20-30 dni, łodzie pneumatyczne 25-35 dni. Rozwój spersonalizowany dodaje 15-30 dni na prototypowanie.'
      icon: tabler:calendar-clock
    - title: Jakie certyfikaty posiadają wasze produkty?
      description: 'Certyfikacja CE dla rynków UE, produkcja zatwierdzona przez amerykańską straż wybrzeża, system jakości ISO, zgodność z BSCI oraz zgodność materiałów z REACH.'
      icon: tabler:certificate
    - title: Czy oferujecie spersonalizowane opakowania i branding?
      description: 'Tak. Zapewniamy spersonalizowane opakowania z waszym logo, waszymi kolorami i tożsamością marki. MOQ dla spersonalizowanych opakowań zależy od kategorii produktu.'
      icon: tabler:color-swatch
cta:
  title: 'Potrzebujesz pomocy w znalezieniu odpowiedniego materiału?'
  subtitle: 'Skontaktuj się z naszym zespołem, aby uzyskać spersonalizowane wskazówki dotyczące wyboru produktów, partnerstw OEM lub specyfikacji technicznych.'
  actions:
    - variant: primary
      text: Skontaktuj się z naszym zespołem
      href: /contact
