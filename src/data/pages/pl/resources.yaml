hero_text:
  tagline: Zasoby
  title: Centrum pobierania i przewodniki po wiosłowaniu
  subtitle: Katalogi produktów, przewodniki zakupowe i instrukcje pielęgnacji, które pomogą Ci wybrać, korzystać i cieszyć się Twoją SUP nadmuchiwaną deską.
features3_downloads:
  tagline: Pobrania
  title: Dokumentacja produktu<br />& Zasoby dotyczące wiosłowania
  isBeforeContent: false
  columns: 2
  items:
    - title: Katalog produktów 2026 SUP
      description: 'Paddle Board Overstock SUP Pełna gama: uniwersalne deski, serie artystyczne i akcesoria, z pełnymi specyfikacjami i zawartością opakowania. Format PDF.'
      icon: tabler:file-text
    - title: SUP Przewodnik po nabywcy nadmuchiwanych urządzeń
      description: 'Jak wybrać swoją pierwszą deskę: długość, szerokość, grubość, objętość, dopasowanie wagi zawodnika oraz kształt deski pasujący do Twojego stylu wiosłowania.'
      icon: tabler:file-description
    - title: SUP Przewodnik po rozmiarze i dopasowaniu
      description: Dostosuj objętość i wymiary deski do swojej wagi i poziomu umiejętności, z rekomendacjami specyficznymi dla aktywności w zakresie rekreacji, wycieczek, jogi i fitnessu.
      icon: tabler:clipboard-check
    - title: Przewodnik po pielęgnacji i konserwacji płyt
      description: 'Trzymaj płytę jak nową: czyszczenie, suszenie, przechowywanie, UV ochrona, pielęgnacja zaworów oraz drobne instrukcje naprawcze.'
      icon: tabler:tool
    - title: Przewodnik po materiałach na nadmuchiwane deski
      description: PVC konstrukcja, drop-stitch rdzenie, EVA podkładki pokładowe oraz co PSI sztywność 15 oznacza dla wydajności i trwałości.
      icon: tabler:files
    - title: Zaczynając SUP
      description: 'Podstawy kajakarstwa po raz pierwszy: napompowanie, noszenie, startowanie, podstawowe ruchy i niezbędne zasady bezpieczeństwa, które pozwolą Ci stanąć już pierwszego dnia.'
      icon: tabler:swimming
faqs:
  title: Najczęściej zadawane pytania
  subtitle: Często pojawiają się pytania dotyczące naszych desk, zamawiania i wchodzenia na wodę.
  columns: 2
  items:
    - title: Co jest dołączone do mojej tablicy?
      description: Każdy kompletny pakiet obejmuje deskę, regulowaną wiosło, pompę o wysokim przepływie, smycz, zestaw naprawczy oraz plecak. Zestaw Wiosła i Pompa jest również dostępny osobno.
      icon: tabler:package
    - title: Jak długo trwa inflacja?
      description: Dzięki dołączonej pompie o wysokim przepływie większość wiosłarzy osiąga pełne ciśnienie w 8-12 minut. Działają też pompy elektryczne — wystarczy zatrzymać się na ciśnieniu nominalnym wydrukowanym przy zaworze.
      icon: tabler:clock
    - title: Jak wybrać odpowiednią deskę?
      description: 'Zacznij od swojego ciężaru i stylu wiosłowania: początkujący i rodziny uwielbiają szerokie, stabilne platformy, takie jak SUP Explorer 11; jogarzyści wolą pełną przyczepność; wioślarze turystyczni chcą sztywne, opływowe kształty. Nasz zespół chętnie poleca.'
      icon: tabler:help-circle
    - title: Jakie metody płatności akceptujecie?
      description: Akceptujemy główne karty kredytowe, PayPal oraz przelewy bankowe. Wszystkie ceny obejmują pełny pakiet — bez ukrytych dodatków.
      icon: tabler:currency-dollar
    - title: Jak długo trwa dostawa?
      description: Zamówienia wysyłane są z naszej fabryki i zazwyczaj docierają w ciągu 5-10 dni roboczych, w zależności od regionu. Dla każdego zamówienia dostępne jest śledzenie.
      icon: tabler:truck-delivery
    - title: Czy moja deska jest objęta gwarancją?
      description: Tak — każda deska jest objęta ochroną przed wadami produkcyjnymi, a każda jednostka jest testowana ciśnieniowo przy 1,25-krotnym ciśnieniu nominalnym przez 24-48 godzin przed opuszczeniem fabryki. Nasza rata reklamacyjna wynosi poniżej 2%.
      icon: tabler:shield-check
cta:
  title: Potrzebujesz pomocy przy wyborze odpowiedniej deski?
  subtitle: Skontaktuj się z naszym zespołem, aby uzyskać uczciwe porady dotyczące wyboru deski, rozmiaru lub pytań dotyczących zamówienia.
  actions:
    - variant: primary
      text: Skontaktuj się z naszym zespołem
      href: /contact
