how_to_order:
  tagline: Jak to działa
  title: Jak złożyć zamówienie hurtowe
  steps:
    - title: Przeglądaj inwentarz
      description: Przejrzyj 11 modeli dostępnych powyżej lub użyj selektora mieszanych modeli, aby dobrać kombinację dopasowaną do Twoich klientów.
    - title: Poproś o wycenę
      description: Prześlij nam modele, szacowane ilości, swój kraj oraz preferowaną prędkość wysyłki, korzystając z poniższego formularza zapytania. Odpowiadamy cenami jednostkowymi i opcjami wysyłki.
    - title: Potwierdź i zapłać
      description: Zatwierdzaj ostateczną wycenę — modele, ilości, metodę transportu i całkowitą kwotę. Warunki płatności potwierdza się podczas wyceny.
    - title: Testujemy, pakujemy i wysyłamy
      description: Każda deska jest w 100% przetestowana pod kątem ciśnieniowym, wyposażona w pełny zestaw akcesoriów i wysłana z Weihai. Otrzymujesz śledzenie na całą podróż.
