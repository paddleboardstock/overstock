hero:
  tagline: Rady Hurtowe SUP
  title: Hurtowe nadmuchiwane deski do wiosłowania<br />dla małych firm
  subtitle: Nowe SUP nadmiarowe deski w ilościach przyjaznych małym firmom. Zamów 5–20 desek, połącz dowolne modele w jednej dostawie i wybierz ekspresowe transporty lotnicze lub morskie do 50+ krajów.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Hurtowe nadmuchiwane deski od Paddle Board Overstock gotowych do wysyłki
direct_answer: Paddle Board Overstock Dostarcza zupełnie nowe SUP nadmuchiwane deski do małych detalistów na całym świecie. Nie ma dużego zamówienia minimalnego — zamówienie hurtowe zaczyna się od zaledwie 5 desek, a w jednym zamówieniu można mieszać dowolne dostępne modele. Deski wysyłane są z naszej bazy w Weihai w Chinach ekspresowym transportem lotniczym (1–3 deski, próbki lub pilne uzupełnienia) lub skonsolidowanym frachtem morskim (zamówienia od sprzedawcy na 5–20 desek). Każda deska jest w 100% testowana ciśnieniowo przed wysyłką i objęta naszą SUP 2-letnią gwarancją.
tldr_points:
  - 'MOQ Niskie: zamówienia hurtowe zaczynają się od 5 tablic — rozmiar przeznaczony dla małych sklepów, nie dla kontenerów'
  - 'Zamówienia modeli mieszanych: łącz SUP dowolne dostępne modele w jednej dostawie'
  - 'Dwie opcje wysyłki: ekspresowy transport lotniczy na 1–3 deski, fracht morski na zamówienia na 5–20 pokładów'
  - 'Nowy sprzęt: w 100% testowany ciśnieniowo, 99,3% przechodząca przez ostateczną kontrolę, SUP 2-letnia gwarancja'
why_retailers:
  title: Dlaczego mali detaliści wybierają deski z nadmiarem SUP
  subtitle: Nie potrzebujesz magazynu ani budżetu na kontenery, aby kupić po cenach hurtowych.
  items:
    - title: Ilości przyjazne małym firmom
      description: Tradycyjna hurtowa wymaga setek sztuk na zamówienie. Nasz model nadwyżkowych jest stworzony dla niezależnych sklepów — zacznij od 5 tablic i zwiększ zamówienie wraz z rozwojem sklepu.
    - title: Prawdziwe ceny hurtowe bez zobowiązań do ilości.
      description: Ponieważ sprzedajemy zapasy nadwyżkowe — nadwyżkę produkcji i starannie pozyskiwane zapasy z wybranych fabryk partnerskich — otrzymujesz ceny jednostkowe na poziomie wolumenu bez ryzyka na poziomie wolumenu.
    - title: Mieszaj modele, aby dopasowały je do klientów
      description: Sklepy plażowe, oprawcy nad jeziorem i sklepy miejskie obsługują różnych kajakarzy. Mieszaj modele uniwersalne, SUP turystyczne i surfowe w jednym kolejności, aby Twoja półka odpowiadała lokalnym potrzebom.
    - title: Nowiutkie, nigdy nie używane
      description: Każda deska w naszym zapasie jest nowa i nieużywana — nie jest to tylko kilka sekund, ani zwroty. Każda deska jest w 100% testowana na ciśnienie przed opuszczeniem magazynu.
    - title: Szybka, elastyczna wysyłka międzynarodowa
      description: Express air cargo szybko dostarcza 1–3 zamówienia próbne lub 1–3 na Twoje drzwi; Consolidated Sea Freight utrzymuje niski koszt na pokład przy zamówieniach od 5 do 20 pokładów u sprzedawców.
    - title: Zabezpieczone prawdziwą gwarancją
      description: Hurtowe nie oznacza braku wsparcia. Każda SUP deska posiada naszą SUP 2-letnią gwarancję, taką samą ochronę, jaką oferujemy każdemu klientowi w 50+ krajach.
pricing_section:
  tagline: Ceny hurtowe
  title: Proste, przejrzyste ceny hurtowe
  subtitle: Ceny są podawane za każde zamówienie w zależności od modeli, ilości i wybranej metody wysyłki. Brak ukrytych opłat — otrzymana wycena to cena, którą płacisz.
  points:
    - title: Warstwowo według ilości
      description: Ceny jednostkowe spadają wraz ze wzrostem wielkości zlecenia. Zlecenie z 10 deskami jest lepsze na każdej desce niż na 5 desk; zamówienie na 20 szachownic jeszcze lepsze.
    - title: Modele mieszane liczą się do jednego łącznego wyniku
      description: Twój poziom rabatowy zależy od łącznej liczby planszów w zamówieniu — nie od modelu. Mieszanie 4 różnych modeli × 3 planszów z każdej liczy się jako zamówienie na 12 płyt.
    - title: Wyceny z opcjami wysyłki
      description: Każda wycena obejmuje zarówno ekspresowe, jak i morskie opcje frachtu z szacunkowymi czasami transportu, dzięki czemu możesz wybrać równowagę między prędkością a kosztami, dopasowaną do harmonogramu uzupełniania zapasów.
    - title: Nie jest wymagane konto ani członkostwo
      description: Nie ma klubu hurtowego, do którego można dołączyć, ani opłaty rocznej. Poproś o wycenę, potwierdź zamówienie, a my wysyłamy.
