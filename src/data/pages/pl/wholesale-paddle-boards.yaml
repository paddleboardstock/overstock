  title: Zbudowane dla niezależnych firm zajmujących się sportami wodnymi
  items:
    - title: Sklepy plażowe i surfingowe
      description: Mali nadmorski sprzedawcy, którzy potrzebują 5–15 desek na sezon, mieszanych między uniwersalnymi modelami dla turystów a deskami surfowymi dla miejscowych.
    - title: Sprzedawcy internetowi
      description: Sklepy e-commerce i sprzedawcy na marketplace testują SUP kategorię, nie zobowiązując się do pełnego pojemnika jednego modelu.
    - title: Floty i szkoły na wynajem
      description: Operacje wynajmu i SUP szkoły uzupełniające floty — wytrzymałe deski, mieszane modele do obsługi różnych rozmiarów klientów oraz wsparcie gwarancyjne.
    - title: Ośrodki i operatorzy wycieczek
