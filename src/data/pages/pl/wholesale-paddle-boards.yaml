faq_section:
  title: FAQ o hurtowni
  items:
    - q: Jakie jest minimalne zamówienie hurtowe?
      a: Pięć tablic. Nasz model nadmiaru jest stworzony dla małych detalistów — nie trzeba napełniać pojemnika, aby uzyskać cenę hurtową.
    - q: Czy mogę mieszać SUP różne modele w jednym zamówieniu hurtowym?
      a: Tak. Zamówienia modeli mieszanych to jedna z największych zalet zakupu zapasów nadmiarowych — połącz dowolne modele dostępne w jednej dostawie, a całkowita liczba modeli w zestawie decyduje o twojej cenie. Szczegóły znajdziesz na naszej stronie hurtowej modeli mieszanych.
    - q: Czy deski są całkowicie nowe?
      a: Tak. Każda płyta jest całkowicie nowa, nieużywana, nadwyżkowa – nigdy nie są to produkty drugiej kategorii, odnowione ani zwroty od klientów. Każda płyta jest w 100% testowana pod kątem ciśnienia przed wysyłką.
    - q: O ile tańsza jest sprzedaż hurtowa w porównaniu ze sprzedażą detaliczną?
      a: Cena jednostkowa hurtowa jest podawana w przeliczeniu na zamówienie w zależności od modeli i ilości, i jest znacząco niższa od podanych powyżej cen detalicznych. Poproś o wycenę dla swojego docelowego zestawu, a my dokładnie ją wycenimy.
    - q: Jaką metodę wysyłki powinienem wybrać?
      a: Ekspresowy transport lotniczy odpowiada 1–3 deskom, próbom i pilnym uzupełnieniom zapasów. Zbiorowy transport morski jest ekonomicznym wyborem dla zamówień detalicznych 5–20 desek. Podajemy wycenę obu opcji przy każdym zapytaniu.
    - q: Jaką gwarancję mają hurtowe płyty?
      a: Ta sama 2-letnia SUP gwarancja, którą dajemy każdemu klientowi, w każdym z 50+ krajów, do których wysyłamy.
    - q: Czy wysyłacie do mojego kraju?
      a: Obecnie wysyłamy do ponad 50 krajów, oferując przewodniki regionalne dla Ameryki Łacińskiej, Azji Południowo-Wschodniej, Afryki, Bliskiego Wschodu oraz kluczowych rynków, w tym Meksyku, Brazylii, Filipin, Indonezji, Tajlandii, RPA, Kenii i ZEA. Zapytaj w swoim zamówieniu ofertowym, a my potwierdzimy aktualną możliwość obsługi Twojego adresu.
