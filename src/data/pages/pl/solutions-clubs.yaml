hero:
  tagline: Kluby sportów wodnych
  title: Sprzęt i rozwiązania<br />Dla klubów wiosłowych i centrów szkoleniowych
  subtitle: Kompletne pakiety sprzętu, wyposażenie instruktora, branding i wsparcie serwisowe dla klubów SUP, klubów kajakowych, szkół surfingu i ośrodków szkoleniowych sportów wodnych dowolnej wielkości.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Deski SUP Paddle Board Overstock dla klubów sportów wodnych i flot wypożyczalni
direct_answer: Paddle Board Overstock dostarcza kompleksowe rozwiązania sprzętowe dla klubów sportów wodnych i ośrodków szkoleniowych na całym świecie. Nasze pakiety klubowe obejmują deski SUP, kajaki, wiosła, pompy, zestawy naprawcze i sprzęt ochronny w konkurencyjnych cenach hurtowych z niskimi MOQ. Każde opakowanie można dostosować za pomocą logo klubu, kolorów marki i spersonalizowanego opakowania. Zapewniamy również szkolenia w zakresie konserwacji, wsparcie w zakresie części zamiennych i programy rotacji sprzętu, aby zmaksymalizować żywotność Twojej floty.
solution_offerings:
  - title: Klubowy Pakiet Startowy
    subtitle: Dla powstających klubów liczących 10–30 członków
    badge: Best Seller
    features:
      - title: Podstawowe wyposażenie
        description: 10–30 desek SUP lub kajaków z pasującymi wiosłami, pompkami i zestawami naprawczymi
      - title: Sprzęt ochronny
        description: Kamizelki ratunkowe, gwizdek, komplety smyczy w barwach klubowych do każdej deski
      - title: Sprzęt instruktorski
        description: Deski dla autokarów z antypoślizgowymi pokładami i dodatkową stabilnością
      - title: Pakiet brandingowy
        description: Niestandardowy nadruk logo na deskach, wiosłach i opakowaniach
      - title: Materiały szkoleniowe
        description: Podręczniki lekcji dla początkujących, protokoły bezpieczeństwa i listy kontrolne dotyczące konserwacji
    cta_text: 'Zbuduj pakiet dla mojego klubu'
    cta_href: /contact
  - title: Pakiet Premium Klubowy
    subtitle: Dla uznanych klubów i operatorów z wieloma lokalizacjami
    badge: Professional
    features:
      - title: Pełna flota
        description: 30–100 mieszanych flot SUP, kajaków i akcesoriów
      - title: Zaawansowany system bezpieczeństwa
        description: Śledzenie sprzętu RFID, aplikacja do zgłaszania uszkodzeń, oznakowanie bezpieczeństwa
      - title: Szkolenie personelu
        description: Warsztaty certyfikacji instruktorskiej i konserwacji sprzętu na miejscu
      - title: Wsparcie marketingowe
        description: Profesjonalna fotografia, broszury i szablony do mediów społecznościowych
      - title: Program wymiany
        description: Coroczne odświeżanie sprzętu po obniżonych cenach z opcjami wymiany
    cta_text: 'Rozwiń mój klub'
    cta_href: /contact
