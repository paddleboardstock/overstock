testimonial:
  content: Zaczęliśmy od Pakietu Startowego Klubu dla naszej szkoły surfingu w Portugalii. 20 desek, wioseł, kamizelek – wszystko dotarło w ciągu 3 tygodni. Po dwóch sezonach przeszliśmy na Pakiet Pro. Niestandardowy branding z naszym logo zmienił zasady gry w naszym profesjonalnym wizerunku.
  name: Ricardo Santosa
  title: Właściciel, Algarve Surf Academy — Lagos, Portugalia
content_segments:
  tagline: Profile klubowe
  title: Rozwiązania klubów sportów wodnych<br />Według typu klubu
  subtitle: Od uniwersyteckich klubów wiosłowych po ekskluzywne prywatne kluby jachtowe — każdy typ klubu ma unikalne potrzeby w zakresie sprzętu, wzorce użytkowania i strukturę budżetu. Każdy pakiet dostosowujemy do modelu klubu.
  items:
    - title: Uniwersyteckie i uniwersyteckie kluby wiosłowe
      subtitle: Floty studenckie o dużym wykorzystaniu
      description: Prowadzone przez studentów lub wspierane przez instytucje kluby wiosłowe obsługujące programy SUP i kajaki dla wydziałów rekreacji uniwersyteckiej. W każdym semestrze sprzęt jest używany z dużą częstotliwością i dużą rotacją na wielu poziomach umiejętności. Trwałość i łatwość naprawy mają kluczowe znaczenie, a także przystępne ceny dla organizacji studenckich.
      features:
        - 'Wyjątkowo trwała konstrukcja z PVC zaprojektowana do studenckich cykli użytkowania'
        - 'Kolorowe oznaczenia serii desek według poziomu dla łatwego zarządzania flotą'
        - 'Zestaw naprawczy + wsparcie wideo na żądanie w cenie każdego zamówienia'
        - 'Ceny rabatowe dla organizacji studenckich i płatności semestralne'
    - title: Społeczność Paddle i kluby towarzyskie
      subtitle: Kluby rekreacyjne oparte na członkostwie
      description: Kluby społecznościowe oferujące członkom SUP, kajaki i wiosłowanie towarzyskie. Sprzęt musi równoważyć wydajność i wygodę dla szerokiego przedziału wiekowego, a branding musi wspierać tożsamość klubu i dumę członków. Wydajność przechowywania ma kluczowe znaczenie dla klubów działających przy ograniczonym dostępie do nabrzeża.
      features:
        - 'Flota mieszana: SUP-y uniwersalne, deski turystyczne i kajaki rekreacyjne'
        - 'Pełny branding klubu: niestandardowe kolory, druk logo, markowe kamizelki ratunkowe'
        - 'Kompaktowe rozwiązania magazynowe dla sprzętu pompowanego'
        - 'Zestaw startowy dla rozwoju członkostwa: karty poleceń, sesja foto w brandzie'
    - title: Szkoły surfingu i akademie kajakarstwa surfingowego
      subtitle: Występy na wybrzeżu i coaching
      description: Szkoły skupiające się na surfingu uczące surfingu SUP, pływania kajakiem i jazdy na falach. Sprzęt musi działać w warunkach surfingowych – zwrotny, responsywny i wystarczająco trwały, aby wytrzymać wielokrotne wycierania, ścieranie piasku i ekspozycję na słoną wodę bez szybkiej degradacji.
      features:
        - 'Krótsze i szersze kształty SUP zoptymalizowane pod manewrowanie na fali'
        - 'Wzmocniona konstrukcja rantów na odporność na uderzenia w falach'
        - 'Sprzęt bezpieczeństwa dla surfingu: leash spiralne, opcje miękkich płetw'
        - 'Program wymiany floty z sezonowymi rabatami za odkup'
    - title: Korporacyjne i prywatne kluby jachtowe
      subtitle: Doświadczenia członków premium
      description: Ekskluzywne prywatne kluby oferujące sporty wodne jako dodatkowe udogodnienie dla członków. Standardy sprzętu są wysokie — estetyka, spójność marki i prezentacja przygotowana dla gości są równie ważne jak wydajność. Oczekiwania dotyczące usług obejmują dostawę w białych rękawiczkach, niestandardowe rozwiązania w zakresie przechowywania i wsparcie na poziomie konsjerża.
      features:
        - 'Deski z wykończeniem premium: EVA imitująca drewno i metaliczne akcenty'
        - 'Dopasowanie kolorów do wytycznych marki klubu'
        - 'Dostawa concierge: napompowane, przygotowane i oznaczone na każdy sezon'
        - 'Dedykowany opiekun konta z priorytetowym SLA odpowiedzi'
