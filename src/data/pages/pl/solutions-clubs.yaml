testimonial:
  content: Zaczęliśmy od Pakietu Startowego Klubu dla naszej szkoły surfingu w Portugalii. 20 desek, wioseł, kamizelek – wszystko dotarło w ciągu 3 tygodni. Po dwóch sezonach przeszliśmy na Pakiet Pro. Niestandardowy branding z naszym logo zmienił zasady gry w naszym profesjonalnym wizerunku.
  name: Ricardo Santosa
  title: Właściciel, Algarve Surf Academy — Lagos, Portugalia
content_segments:
  tagline: Profile klubowe
  title: Rozwiązania dla klubów sportów wodnych<br />Według rodzaju klubu
  subtitle: Od uniwersyteckich klubów wiosłowych po ekskluzywne prywatne kluby jachtowe — każdy typ klubu ma unikalne potrzeby w zakresie sprzętu, wzorce użytkowania i strukturę budżetu. Każdy pakiet dostosowujemy do modelu klubu.
  items:
    - title: Uniwersyteckie i uniwersyteckie kluby wiosłowe
      subtitle: Floty studenckie o dużym wykorzystaniu
      description: Kluby wiosłowe prowadzone przez studentów lub wspierane przez instytucje, realizujące SUP programy dla wydziałów rekreacji uniwersyteckiej. Sprzęt poddawany jest intensywnemu, o dużej rotacji użyciu na różnych poziomach zaawansowania w każdym semestrze. Kluczowa jest trwałość i łatwość naprawy, a także przystępna cena dla organizacji studenckich.
      features:
        - Ekstra trwała konstrukcja PVC oceniona na cykle użytkowania przez studentów
        - Tablice oznaczone kolorami według poziomu umiejętności dla łatwego zarządzania flotą
        - Zestaw do napraw + z dostępnym wsparciem wideo w każdej przesyłce
        - Ceny z rabatem dla organizacji studenckich i możliwość płatności semestralnej
    - title: Społeczność Paddle i kluby towarzyskie
      subtitle: Kluby rekreacyjne oparte na członkostwie
      description: Kluby oparte na społeczności oferujące SUP i doświadczenia wiosłowania towarzyskiego dla członków. Sprzęt musi łączyć wydajność i komfort dla szerokiego zakresu wiekowego, z brandingiem wzmacniającym tożsamość klubu i dumę członków. Efektywne przechowywanie jest kluczowe dla klubów działających przy ograniczonym dostępie do wody.
      features:
        - 'Mieszana flota: deski all-around i turystyczne SUPs'
        - 'Pełny branding klubu: niestandardowe kolory, nadruk logo, kamizelki ratunkowe z logo'
        - Kompaktowe rozwiązania przechowywania dla sprzętu dmuchanego
        - 'Pakiet startowy do rozwoju członkostwa: karty polecające, zdjęcia z brandingiem'
    - title: Szkoły Surfingu i Akademie SUP
      subtitle: Występy na wybrzeżu i coaching
      description: Szkoły surfingu koncentrujące się na nauce SUP umiejętności surfowania i jazdy na falach. Sprzęt musi sprawdzać się w warunkach falowych — być zwrotny, responsywny i wystarczająco trwały, aby wytrzymać powtarzające się upadki, otarcia piaskiem i działanie wody morskiej bez szybkiego zużycia.
      features:
        - Krótsze, szersze kształty SUP zoptymalizowane pod kątem manewrowości na falach
        - Wzmocniona konstrukcja krawędzi dla odporności na uderzenia w falach
        - 'Sprzęt bezpieczeństwa specyficzny dla surfingu: linki spiralne, opcje miękkich płetw'
        - Program wymiany floty z sezonowymi rabatami przy wymianie
    - title: Korporacyjne i prywatne kluby jachtowe
      subtitle: Doświadczenia członków premium
      description: Ekskluzywne prywatne kluby oferujące sporty wodne jako dodatkowe udogodnienie dla członków. Standardy sprzętu są wysokie — estetyka, spójność marki i prezentacja przygotowana dla gości są równie ważne jak wydajność. Oczekiwania dotyczące usług obejmują dostawę w białych rękawiczkach, niestandardowe rozwiązania w zakresie przechowywania i wsparcie na poziomie konsjerża.
      features:
        - Deski z wykończeniem premium z fakturą drewna EVA i metalicznymi akcentami
        - Dopasowanie kolorów do wytycznych marki klubu
        - 'Dostawa concierge: wstępnie napompowane, przygotowane i oznaczone dla każdego sezonu'
        - Dedykowane zarządzanie kontem z priorytetową obsługą
