hero:
  tagline: Partnerstwa i dystrybucja
  title: 'Zostań partnerem Aquafarer<br />— globalna sieć dystrybucji'
  subtitle: "Dołącz do globalnej sieci partnerów Aquafarer. Współpracujemy z dystrybutorami sprzętu morskiego, dealerami łodzi, sprzedawcami akcesoriów i partnerami markowymi w ponad 50 krajach."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Globalna sieć partnerów i dystrybutorów Aquafarer
content_programs:
  tagline: Programy partnerskie
  title: 'Programy partnerskie<br />zbudowane pod wzrost'
  subtitle: 'Niezależnie od tego, czy jesteś dystrybutorem, dealerem czy partnerem markowym, Aquafarer oferuje programy zaprojektowane tak, aby wspierać Twój biznes.'
  columns: 3
  items:
    - title: Program dystrybutorów
      description: 'Ekskluzywna dystrybucja terytorialna z cenami hurtowymi, wsparciem marketingowym i bezpośrednim dostępem do fabryki. Wymagane minimalne zobowiązanie zależne od wielkości terytorium.'
      icon: tabler:world
    - title: Program dealerski
      description: 'Bezpośrednie ceny dealerskie, szkolenia produktowe, materiały marketingowe i obsługa gwarancyjna dla sklepów stacjonarnych i internetowych.'
      icon: tabler:building-store
    - title: Partnerstwo OEM/ODM
      description: 'Kompleksowa produkcja OEM i ODM z indywidualnym brandingiem, opakowaniami i specyfikacjami produktów. Od koncepcji do kontenera.'
      icon: tabler:certificate
    - title: Partnerstwo markowe
      description: 'Programy co-brandingu, marek prywatnych i modeli ekskluzywnych dla uznanych marek w branży morskiej i rekreacji na świeżym powietrzu.'
      icon: tabler:stars
    - title: 'Instytucje rządowe'
      description: 'Programy preferowanego dostawcy dla agencji rządowych, straży przybrzeżnych, wojska i organizacji humanitarnych. Dokumentacja gotowa do przetargów.'
      icon: tabler:building-community
    - title: 'Partner dla kurortów i wypożyczalni'
      description: 'Ceny flotowe, spójna jakość i indywidualny branding dla kurortów, centrów nurkowych i wypożyczalni na całym świecie.'
      icon: tabler:sun
content_benefits:
  tagline: Dlaczego warto z nami współpracować
  title: 'Dlaczego partnerzy wybierają Aquafarer'
  subtitle: 'Nasi partnerzy korzystają z realnych możliwości produkcyjnych, spójnej jakości i szybkiego wsparcia.'
  list:
    - 'Bezpośredni dostęp do fabryki: współpracuj bezpośrednio z naszym zespołem produkcyjnym — bez pośredników. Otrzymujesz szybsze odpowiedzi, lepsze ceny i pełną widoczność produkcji.'
    - 'Gotowość do personalizacji: oznacz swoje produkty własnymi kolorami, logotypami, opakowaniami i specyfikacjami. Minimalne ilości zamówień dostosowane do Twojego rynku.'
    - 'Gwarantowana jakość: produkcja certyfikowana ISO 9001 zgodnie z CE, UKCA i BSCI. Każdy produkt testowany przed wysyłką.'
    - 'Globalna logistyka: wysyłka z Qingdao w Chinach z opcjami FOB, CIF i DDP. Magazyn w USA w Montclair w Kalifornii dla dystrybucji w Ameryce Północnej.'
    - 'Wsparcie marketingowe: katalogi produktów, fotografie, dokumentacja techniczna i zasoby cyfrowe wspierające Twoją sprzedaż.'
    - 'Szkolenia i wsparcie: szkolenia produktowe dla Twojego zespołu sprzedaży, wsparcie techniczne dla Twoich klientów i koordynacja obsługi gwarancyjnej.'
content_process:
  tagline: Jak zostać partnerem
  title: 'Prosty proces partnerstwa'
  subtitle: 'Nasz proces partnerski jest prosty — zaprojektowany tak, abyś szybko rozpoczął sprzedaż produktów Aquafarer.'
  items:
    - title: 'Krok 1: Złóż aplikację'
      description: 'Wypełnij nasz formularz aplikacji partnerskiej z profilem firmy, rynkiem docelowym i interesującymi Cię produktami.'
    - title: 'Krok 2: Weryfikacja kwalifikacji'
      description: 'Nasz zespół ds. partnerstw rozpatruje Twoją aplikację i kontaktuje się z Tobą w ciągu 3 dni roboczych, aby omówić możliwości.'
    - title: 'Krok 3: Umowa i konfiguracja'
      description: 'Podpisz umowę partnerską, skonfiguruj konto i otrzymaj ceny partnerskie, materiały marketingowe oraz próbki produktów.'
    - title: 'Krok 4: Szkolenie i start'
      description: 'Zapewniamy szkolenia produktowe, wsparcie sprzedaży i materiały marketingowe. Jesteś gotowy, aby rozpocząć sprzedaż.'
cta:
  title: 'Gotowy zostać partnerem Aquafarer?'
  subtitle: 'Złóż wniosek o partnerstwo, a nasz zespół odpowie w ciągu 3 dni roboczych.'
  actions:
    - variant: primary
      text: Złóż wniosek o partnerstwo
      href: /contact
    - text: Zobacz nasze produkty
      href: /products
