who_benefits:
  tagline: Kto Może Skorzystać
  title: Dla Kogo Jest Hurt Sprzedaży z Mieszanym Modelem
  items:
    - title: Importerzy po raz pierwszy
      description: Testowanie kategorii SUP za pomocą różnych modeli zamiast zobowiązywania się do jednej hurtowej ilości SKU.
    - title: Sezonowi Sprzedawcy Plażowi
      description: Sklepy, które potrzebują desek początkowych dla turystów i edycji premium dla miejscowych — w tym samym zamówieniu uzupełniającym.
    - title: Sprzedawcy internetowi
      description: Wystawianie kilku modeli jednocześnie, aby sprawdzić, która grafika, długość i zastosowanie przynosi najlepsze wyniki.
    - title: Floty i szkoły na wynajem
      description: Floty, które potrzebują różnych rozmiarów desek dla różnych wag użytkowników i rodzajów lekcji, a nie jednej specyfikacji floty.
faq_section:
  title: FAQ dotyczące Mieszanych Modeli
  items:
    - q: Czy istnieje minimalna ilość dla każdego modelu?
      a: Nie. Minimalna ilość 5 desek dotyczy całego zamówienia, nie pojedynczego modelu. Możesz zamówić 5 różnych modeli po jednej desce każdy.
    - q: Czy mieszanie modeli zmienia cenę?
      a: Cena hurtowa jednostki jest podawana dla każdego modelu, ale Twój poziom cenowy poprawia się wraz z całkowitą liczbą desek — mieszanie modeli nie powoduje kary.
    - q: Czy mogę mieszać deski i akcesoria?
      a: Tak — zapasowe wiosła, pompki i zestawy naprawcze mogą być dodawane do mieszanych zamówień. Zapytaj podczas składania zapytania.
    - q: Skąd mam wiedzieć, które modele pasują do mojego rynku?
      a: Prześlij nam informacje o swoich klientach (nadmorskich czy śródlądowych, turystach czy miejscowych, początkujących czy doświadczonych) w formularzu zapytania, a my polecimy miks.
