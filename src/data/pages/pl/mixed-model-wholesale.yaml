hero:
  tagline: Hurtowa Mieszana Modelka
  title: Mieszane modele Hurtowe Paddle Boardy —<br />Mieszaj SUP różne modele w jednej kolejności
  subtitle: Dlaczego zamykać budżet na jednym modelu? Połącz SUP dowolne deski dostępne na stanie—uniwersalne, turystyczne, surfowe i artystyczne—w jednym zamówieniu hurtowym, z łączną liczbą nawet 5 desek.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Mieszanka różnych SUP modeli nadmuchiwanych desek z Paddle Board Overstock
direct_answer: Hurtowo modeli mieszanych pozwala małemu detalistowi zamówić kilka różnych SUP modeli w jednej skonsolidowanej dostawie zamiast ilości jednej deski. W Paddle Board Overstock, dowolne modele dostępne na stanie mogą być łączone, minimalne zamówienie to 5 desek, a całkowita ilość decyduje o poziomie cenowym. Zamówienia mieszane wysyłane są z Weihai w Chinach ekspresowym przewozem lotniczym (1–3 deski) lub skonsolidowanym frachtem morskim (5–20 tablic) do+ 50 krajów, a każda deska jest w 100% testowana pod ciśnieniem i objęta SUP 2-letnią gwarancją.
tldr_points:
  - Mieszaj SUP dowolne dostępne modele w jednej kolejności — bez minimalnych wymagań na model
  - Całkowita ilość zamówień (nie ilość na model) ustala poziom cenowy
  - Zacznij od 5 płyt łącznie — przeznaczonych dla małych sprzedawców, nie dla kontenerów
  - 'Jedna skonsolidowana przesyłka: jeden koszt frachtu, jedna odprawa celna, jedna dostawa'
why_mixed:
  tagline: Dlaczego mieszane?
  title: Mieszaj i dopasowuj. Kupuj więcej różnorodności. Wydaj mniej.
  subtitle: Półka z identycznymi deskami obsługuje jeden typ kajakarza. Mieszane zamówienie zamienia ten sam budżet w pełną linię produktów.
  items:
    - title: Więcej różnorodności na twojej półce
      description: Połącz uniwersalne deski dla początkujących, deski turystyczne dla miłośników przygód oraz deski w stylu surfingowym dla rowerzystów — jedno zamówienie obejmuje cały zakres klientów.
    - title: Niższe ryzyko na model
      description: Zamiast stawiać sezon na jeden model, zamów po 2–4 egzemplarze z każdego. Jeśli jeden model sprzedaje się lepiej niż reszta, uzupełnij go w następnym zamówieniu z rzeczywistymi danymi sprzedażowymi.
    - title: Sprawdź, co sprzedaje się na twoim rynku
      description: Każda plaża, jezioro i miasto mają inny popyt. Mieszanym pierwszym zamówieniem jest najtańsze badanie rynku — sześć modeli na składzie, zobacz, które się sprzedają.
    - title: Lepsze marginesy w wydaniach artystycznych
      description: Płyty premium z serii artystycznych (Leviathan Wake, Medusa Glow, Ocean Voyager) mają wyższe ceny cenowe. Wymieszaj kilka z nich w bazę uniwersalnych płyt, aby zwiększyć swoją średnią marżę.
    - title: Jedna skonsolidowana przesyłka
      description: Jedno zamówienie mieszane oznacza jedną rezerwację przesyłek, jedną odprawę celną i jedną dostawę — zamiast pięciu oddzielnych przesyłek od pięciu różnych dostawców.
how_it_works:
  tagline: Jak to działa
  title: Jak działa kolejność modelu mieszanego
  steps:
    - title: Wybierz swój miks
      description: Wybierz modele i ilości dla swojego rynku — lub użyj poniższego selektora, aby sporządzić kombinację i zobaczyć na żywo aktualizację liczby planszów i całkowitej wartości.
    - title: Poproś o wycenę
      description: Prześlij nam mieszankę. Potwierdzamy aktualny stan zapasowy dla każdego modelu i wycenę jednostkową oraz opcje ekspresowego i morskiego transportu do Twojego kraju.
    - title: Potwierdź rozkaz
      description: Zatwierdź ostateczną wycenę — modele, ilości, fracht, całkowitą kwotę. Zarezerwujemy zapasy i zaplanujemy wysyłkę z Weihai.
    - title: Testujemy każdą deskę
      description: Każda deska w Twoim mieszanym zamówieniu jest testowana na ciśnienie w 100% do 15 PSI przed pakowaniem — te same standardy dotyczą każdego modelu, niezależnie od tego, czy jest to wszechstronny model dla początkujących, czy edycja artystyczna.
    - title: Jedna dostawa pod Twoje drzwi
      description: Całe mieszane zamówienie wysyłane jest razem — ekspresowy transport lotniczy dla małych zamówień, skonsolidowany transport morski dla 5–20 desek — z możliwością śledzenia przesyłki od drzwi do drzwi.
