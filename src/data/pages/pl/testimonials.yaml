testimonials:
  - category: kluby
    name: Ricardo Santosa
    title: Właściciel, Algarve Surf Academy
    location: Lagos, Portugalia
    content: Zaczęliśmy od Pakietu Startowego Klubu dla naszej szkoły surfingu. 20 desek, wioseł, kamizelek – wszystko dotarło w ciągu 3 tygodni. Po dwóch sezonach przeszliśmy na Pakiet Pro. Niestandardowy branding z naszym logo zmienił zasady gry w naszym profesjonalnym wizerunku.
    rating: 5
    product: Klubowy Pakiet Startowy
    source: solutions/clubs
  - category: kluby
    name: Właściciel klubu
    title: Klub Sportów Wodnych
    location: Phuket, Tajlandia
    content: Pakiet Startowy Klubu był idealnym punktem wyjścia. Wraz z rozwojem naszej firmy, Aquafarer rozwijał się wraz z nami — ta sama jakość, te same ceny, żadnych niespodzianek. W ciągu 18 miesięcy przeskalowaliśmy od 10 do 80 desek.
    rating: 5
    product: Klubowy Starter + Pakiet Premium
    source: success-stories
  - category: kurorty
    name: Dyrektor Generalny Ośrodka
    title: Pięciogwiazdkowy kurort przy plaży
    location: Grecja
    content: Aquafarer nie tylko dostarczył deski — pomógł nam stworzyć kompletne doświadczenie gości. Nasz program sportów wodnych w ciągu jednego sezonu przeszedł od zera do najważniejszego wydarzenia w ośrodku. Ponad 300 rezerwacji tygodniowych i roczny przychód na poziomie 180 tys. dolarów.
    rating: 5
    product: Pakiet Resort Premium
    source: success-stories
  - category: kurorty
    name: Zofia Laurent
    title: Dyrektor ds. obsługi gości, Azure Bay Resorts
    location: Phuket, Tajlandia
    content: Aquafarer zaprojektował i wyposażył cały nasz program zajęć na plaży w trzech obiektach wypoczynkowych. 80 desek SUP, 40 kajaków, infrastruktura bezpieczeństwa i szkolenie personelu – wszystko dostarczone w jednej przesyłce. Udział gości wzrósł o 60% w pierwszym sezonie.
    rating: 5
    product: Pakiet Resort Premium
    source: solutions/resorts
  - category: przedsiębiorcy
    name: Michała Parka
    title: Założyciel firmy Shoreline Paddle Co.
    location: Kalifornia, USA
    content: Swoją markę SUP uruchomiłem z zerowym doświadczeniem w branży. Zespół Aquafarer przeprowadził mnie od wyboru produktu po projekt niestandardowego logo i opakowanie. Mój pierwszy pojemnik dotarł w ciągu 11 tygodni, a na Amazonie wyprzedałem się w ciągu 3 miesięcy.
    rating: 5
    product: Premiera marki startowej
    source: solutions/entrepreneurs
  - category: przedsiębiorcy
    name: Założyciel
    title: Australijska marka SUP
    location: Australia
    content: Miałem pomysł na markę, ale zerową wiedzę na temat produkcji. Aquafarer dosłownie trzymał mnie za rękę przez cały proces — od wyboru odpowiedniego projektu płyty po rozpakowanie mojej pierwszej przesyłki. Od snu do dostawy 90 dni.
    rating: 5
    product: Pakiet wprowadzenia marki
    source: success-stories
  - category: dzierżawa
    name: Daniel Okonkwo
    title: Właściciel, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Wynajmowałem 5 desek w lokalnym sklepie i traciłem na ich rzecz 60% moich przychodów. Aquafarer pomógł mi zbudować własną flotę 15 SUP-ów. Kalkulator ROI pokazał próg rentowności po 4 miesiącach — zajęło to 3. Teraz rozwijam się do 30 płyt.
    rating: 5
    product: Zestaw startowy floty
    source: solutions/rental-business
  - category: dzierżawa
    name: Marco Valenti
    title: Dyrektor operacyjny, Adriatic Adventure Tours
    location: Dubrownik, Chorwacja
    content: Wyposażyliśmy całą naszą flotę do wynajęcia w łodzie Aquafarer RIB — 12 łodzi w trzech lokalizacjach. Dwa sezony i zero awarii. Dokumentacja certyfikacyjna CE umożliwiła bezproblemową akceptację ubezpieczenia. Ich zespół inżynierów dostosował nawet kolory rurek.
    rating: 5
    product: Zestaw do rozbudowy floty
    source: trust
  - category: dzierżawa
    name: Komandor porucznik Andres Reyes
    title: Urzędnik ds. zamówień morskich, pomocniczy filipińskiej straży przybrzeżnej
    location: Manila, Filipiny
    content: W naszej flocie patroli przybrzeżnych obsługujemy 24 jednostki Aquafarer RIB. Ich proces kontroli jakości jest spójny dla każdej partii — za każdym razem ta sama jakość szwów, to samo rozmieszczenie zaworów, to samo ciśnienie znamionowe. Powtarzalność ma znaczenie, gdy od sprzętu zależy życie.
    rating: 5
    product: Flota patrolowa RIB
    source: trust
  - category: konsumenci
    name: Sara K.
    title: Pierwszy właściciel SUP-a
    location: Jezioro Tahoe, USA
    content: Stabilny nawet dla zupełnie początkującego. Pierwszego dnia zabrałem go nad jezioro i nigdy nie upadł. Kompletny zestaw z pompką i wiosłem oznaczał, że byłem na wodzie 20 minut po otwarciu pudełka.
    rating: 5
    product: Eksplorator SUP-ów 11
  - category: konsumenci
    name: Jamesa Thorntona
    title: Właściciel SUP Explorera 11
    location: Vancouver, Kanada
    content: Jako kupujący po raz pierwszy denerwowałem się jakością zamówień z zagranicy. Dokumentacja ISO i raporty z testów stron trzecich, które udostępnili, zanim w ogóle zapytałem, dały mi całkowitą pewność. Deska dotarła w ciągu 6 dni i przekroczyła moje oczekiwania.
    rating: 5
    product: Eksplorator SUP-ów 11
    source: trust
  - category: konsumenci
    name: Mike R.
    title: Kajakarz rekreacyjny
    location: Floryda, USA
    content: Solidna jakość wykonania. Radzi sobie z kotletami przybrzeżnymi znacznie lepiej, niż się spodziewałem po nadmuchiwanym pontonie. Zapakowałem go do bagażnika samochodu na weekendową wycieczkę — napompowany na rampie w niecałe 4 minuty.
    rating: 5
    product: Nadmuchiwany kajak
