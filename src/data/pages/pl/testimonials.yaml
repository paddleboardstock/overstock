testimonials:
  - category: clubs
    name: Ricardo Santosa
    title: Właściciel, Algarve Surf Academy
    location: Lagos, Portugalia
    content: Zaczęliśmy od Pakietu Startowego Klubu dla naszej szkoły surfingu. 20 desek, wioseł, kamizelek – wszystko dotarło w ciągu 3 tygodni. Po dwóch sezonach przeszliśmy na Pakiet Pro. Niestandardowy branding z naszym logo zmienił zasady gry w naszym profesjonalnym wizerunku.
    rating: 5
    product: Klubowy Pakiet Startowy
    source: solutions/clubs
  - category: clubs
    name: Właściciel klubu
    title: Klub Sportów Wodnych
    location: Phuket, Tajlandia
    content: Pakiet Startowy Klubu był idealnym punktem wejścia. W miarę jak nasz biznes rósł, Paddle Board Overstock rósł razem z nami — ta sama jakość, te same ceny, bez niespodzianek. Rozwinęliśmy się z 10 do 80 desek w ciągu 18 miesięcy.
    rating: 5
    product: Klubowy Starter + Pakiet Premium
    source: success-stories
  - category: resorts
    name: Dyrektor Generalny Ośrodka
    title: Pięciogwiazdkowy kurort przy plaży
    location: Grecja
    content: Paddle Board Overstock nie tylko dostarczał deski — pomógł nam stworzyć pełne doświadczenie dla gości. Nasz program sportów wodnych przeszedł od zera do głównej atrakcji ośrodka w jednym sezonie. 300+ rezerwacji tygodniowo i 180 000 USD rocznego przychodu.
    rating: 5
    product: Pakiet Resort Premium
    source: success-stories
  - category: resorts
    name: Zofia Laurent
    title: Dyrektor ds. obsługi gości, Azure Bay Resorts
    location: Phuket, Tajlandia
    content: Paddle Board Overstock designed and equipped our entire beach activity program across three resort properties. 120 SUPs, safety infrastructure, and staff training — all delivered in one shipment. Guest participation increased 60% in the first season.
    rating: 5
    product: Pakiet Resort Premium
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: Właściciel, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: I was renting 5 boards from a local shop and losing 60% of my revenue to them. Paddle Board Overstock helped me build my own fleet of 15 SUPs. The ROI calculator showed break-even in 4 months — it took 3. Now I am expanding to 30 boards.
    rating: 5
    product: Zestaw startowy floty
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Dyrektor operacyjny, Adriatic Adventure Tours
    location: Dubrownik, Chorwacja
    content: We outfitted our entire SUP rental fleet with Paddle Board Overstock boards — 30 boards across three locations. Two seasons in, zero failures. The consistent quality across every batch made our choice easy, and their team even matched the colors to our brand.
    rating: 5
    product: Rental Fleet Package
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Owner, Lake Garda SUP Rentals
    location: Lake Garda, Italy
    content: Our rental boards go out five times a day in peak season. Since switching to Paddle Board Overstock, damage complaints dropped to nearly zero, and customers keep asking where they can buy their own board.
    rating: 5
    product: Rental Fleet Package
    source: solutions/rental-business
  - category: consumers
    name: Sara K.
    title: Pierwszy właściciel SUP-a
    location: Jezioro Tahoe, USA
    content: Stabilny nawet dla zupełnie początkującego. Pierwszego dnia zabrałem go nad jezioro i nigdy nie upadł. Kompletny zestaw z pompką i wiosłem oznaczał, że byłem na wodzie 20 minut po otwarciu pudełka.
    rating: 5
    product: Eksplorator SUP-ów 11
  - category: consumers
    name: Jamesa Thorntona
    title: Właściciel SUP Explorera 11
    location: Vancouver, Kanada
    content: As a first-time buyer, I was nervous about ordering from overseas. The build quality spoke for itself the moment I unboxed it — rigid, flawless seams, and it arrived in just 6 days.
    rating: 5
    product: Eksplorator SUP-ów 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Weekend Paddler
    location: Floryda, USA
    content: Solidna jakość wykonania. Radzi sobie z kotletami przybrzeżnymi znacznie lepiej, niż się spodziewałem po nadmuchiwanym pontonie. Zapakowałem go do bagażnika samochodu na weekendową wycieczkę — napompowany na rampie w niecałe 4 minuty.
    rating: 5
    product: SUP Tropical Breeze
