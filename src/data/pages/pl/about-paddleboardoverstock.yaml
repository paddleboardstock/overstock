values:
  - title: Jakość przede wszystkim
    desc: Każda łódź opuszczająca naszą fabrykę przechodzi obowiązkowe testy zatrzymywania powietrza, odrywania szwów i systemów przed wysyłką.
  - title: Pionowa integracja
    desc: Kontrolujemy każdy etap — od cięcia PVC po końcowy montaż — eliminując nieefektywność podwykonawców i zapewniając stałą jakość.
  - title: Bezpieczeństwo jako standard
    desc: Certyfikacja CE jest fundamentem tego, co tworzymy. Nasze 64 modele z certyfikatem CE spełniają unijne normy bezpieczeństwa dla użytku rekreacyjnego i komercyjnego.
  - title: Skoncentrowani na partnerze
    desc: Budujemy długoterminowe relacje z partnerami OEM, ODM i private label poprzez transparentność, niezawodność i wspólny rozwój.

services:
  - title: Produkcja OEM
    desc: Produkujemy według Twoich specyfikacji. Udostępnij swoje rysunki, a nasz zespół inżynieryjny zajmie się prototypowaniem, oprzyrządowaniem i produkcją.
  - title: Rozwiązania ODM
    desc: Zacznij od naszych sprawdzonych platform projektowych. Dostosuj rozmiar, kolor, grafikę i opakowanie, aby stworzyć unikalną linię produktów.
  - title: Private Label
    desc: Twoja marka, Twoje logo, Twoje opakowanie. Produkty docierają gotowe do sprzedaży z pełną integracją marki.
  - title: Niestandardowy branding
    desc: Nadruk na decku, grafika kadłuba, naklejki na tuby i niestandardowe etykiety — spójna obecność marki na każdej powierzchni.

certifications:
  - name: Certyfikat CE
    desc: Nasze łodzie i jednostki pływające są zgodne z dyrektywą UE dotyczącą rekreacyjnych jednostek pływających (2013/53/EU) i odpowiednimi normami zharmonizowanymi.
    scope: Łodzie i jednostki pływające
  - name: ISO 9001
    desc: System zarządzania jakością certyfikowany dla projektowania, produkcji i dystrybucji nadmuchiwanych jednostek pływających.
    scope: Cały obiekt
  - name: ISO 6185
    desc: Łodzie pneumatyczne — wymagania bezpieczeństwa i wydajności dla wzmocnionych i sztywnych łodzi pneumatycznych.
    scope: Linie RIB i pneumatyczne

