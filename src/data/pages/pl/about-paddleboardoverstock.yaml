factory_details:
  - label: Wielkość obiektu
    value: 12 000 m² (130 000 ft²) zintegrowanego kampusu w Strefie Rozwoju Gospodarczego Qingdao
  - label: Roczna wydajność
    value: 15 000 łodzi, w tym SUP, kajaki, dinghy, RIB i sprzęt bezpieczeństwa
  - label: Zespół B+R
    value: Ponad 25 inżynierów w zakresie projektowania produktów, materiałoznawstwa i inżynierii jakości
  - label: Kluczowy sprzęt
    value: CNC stoły tnące, zgrzewarki RF, zgrzewarki gorącym powietrzem, drukarki cyfrowe, formy z włókna szklanego, stanowiska testowania szczelności
  - label: Linie produkcyjne
    value: '6 dedykowanych linii: cięcie PVC, spawanie rur, układanie kadłubów z włókna szklanego, montaż SUP, montaż RIB, końcowa kontrola jakości'
  - label: Roczny wolumen eksportu
    value: Ponad 8 mln USD eksportowane do ponad 50 krajów w Europie, Amerykach, Azji i Pacyfiku oraz na Bliskim Wschodzie

