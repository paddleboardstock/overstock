hero:
  tagline: O nas
  title: 'O {SITE}'
  subtitle: Zintegrowany pionowo producent sprzętu wodnego — od surowca do gotowej łodzi

intro:
  - 'Paddle Board Overstock został założony w 2012 roku z jedną misją: projektować i produkować sprzęt wodny, który sprawdza się na wodzie równie dobrze, jak w raporcie jakości. To, co zaczęło się jako warsztat skupiony na deskach SUP, rozrosło się do 12 000-metrowego zintegrowanego zakładu produkcyjnego w Strefie Rozwoju Gospodarczego Qingdao, produkującego łodzie pneumatyczne, RIB, kajaki, deski SUP, sprzęt bezpieczeństwa i akcesoria dla klientów w ponad 50 krajach.'
  - Dziś Paddle Board Overstock działa jako marka fabryczna — projektujemy, konstruujemy, tworzymy prototypy, produkujemy i testujemy wszystko pod jednym dachem. Ta pionowa integracja daje nam bezpośrednią kontrolę nad wyborem materiałów, jakością wykonania i terminami dostaw. Każda łódź jest zbudowana przez naszych ludzi, na naszym sprzęcie, zgodnie z naszymi standardami.
  - Obsługujemy użytkowników rekreacyjnych, operatorów komercyjnych, agencje rządowe i partnerów marek na całym świecie. Nasze programy OEM i ODM pomagają firmom uruchamiać własne linie produktów bez inwestowania w infrastrukturę fabryczną. Niezależnie od tego, czy potrzebujesz pojedynczego prototypu, czy pełnej serii produkcyjnej, nasz zespół prowadzi Cię od koncepcji do gotowej do morza dostawy.

