testimonial:
  content: Wynajmowałem 5 desek w lokalnym sklepie i traciłem na ich rzecz 60% moich przychodów. Paddle Board Overstock pomógł mi zbudować własną flotę 15 SUP-ów. Dostarczony przez nich kalkulator ROI pokazał, że osiągnę próg rentowności po 4 miesiącach — w rzeczywistości zajęło to 3. Teraz rozszerzam ofertę do 30 desek i dodaję kajaki.
  name: Daniel Okonkwo
  title: Właściciel, Lakeland SUP Rentals — Ontario, Kanada
content_segments:
  tagline: Profile wynajmu
  title: Rozwiązania w zakresie wynajmu sportów wodnych<br />Według rodzaju operatora
  subtitle: Różne wypożyczalnie mają różne potrzeby — od małych wypożyczalni SUP przy plaży po duże ośrodki sportów wodnych w kurortach. Dopasowujemy do tego nasze pakiety wyposażenia i model wsparcia.
  items:
    - title: Wypożyczalnie SUP na plaży i nad jeziorem
      subtitle: Operacje o dużej objętości i niskiej złożoności
      description: Operatorzy wynajmujący deski do wiosłowania na stojąco i kajaki bezpośrednio plażowiczom i odwiedzającym jezioro. Twoim priorytetem jest minimalizacja czasu między wypożyczeniami, utrzymanie rotacji sprzętu i zarządzanie sezonowymi skokami popytu przy niewielkiej powierzchni magazynowej.
      features:
        - Floty nadmuchiwanych SUP zwijanych płasko — bez potrzeby pomostu lub przyczepy
        - PVC klasy komercyjnej zaprojektowane na ponad 100 cykli wypożyczeń na sezon
        - Tkanina szybłoschnąca i odporna na UV, gotowa do ponownego wypożyczenia tego samego dnia
        - Linie desek z kodowaniem kolorystycznym dla łatwej identyfikacji floty
    - title: Centra sportów wodnych Resort & Hotel
      subtitle: Doświadczenia gości i dostosowanie marki
      description: Ośrodki i hotele oferujące sporty wodne jako udogodnienie na miejscu. Sprzęt musi wyglądać premium, działać niezawodnie wśród gości od początkującego do średniozaawansowanego oraz integrować się z istniejącymi w ośrodku procesami rezerwacji zajęć i rozliczeń.
      features:
        - Deski SUP i kamizelki ratunkowe z niestandardowym brandingiem w kolorach ośrodka
        - 'Flota mieszana: SUP, kajaki, rowerki wodne i małe tendery RIB'
        - Ciche, bezpaliwowe elektryczne pompy do nadmuchiwania na plaży
        - W cenie szkolenie personelu i wdrożenie w zakresie konserwacji
    - title: Operatorzy wynajmu łodzi i RIBów
      subtitle: Flota wynajmu statków klasy komercyjnej
      description: Operatorzy wynajmujący statki z napędem — łodzie RIB, pontony i małe łodzie motorowe — na godziny lub pół dnia. Twoja flota musi spełniać przepisy dotyczące bezpieczeństwa morskiego, wytrzymywać intensywne użytkowanie przez gości i minimalizować przestoje mechaniczne między czarterami.
      features:
        - Pakiety RIB z pawężami gotowymi na silniki zaburtowe 30–90 KM
        - Panele podłogowe ze sklejki klasy morskiej dla długotrwałej integralności konstrukcji
        - Systemy szybkich zaworów dla szybszej rotacji
        - Zestaw części zamiennych + wsparcie techniczne SLA na żądanie
    - title: Operatorzy wycieczek i przygód
      subtitle: Floty wycieczkowe z przewodnikiem
      description: Operatorzy organizujący wycieczki z przewodnikiem po sportach wodnych — safari SUP, spływy kajakowe po jaskiniach, wycieczki z rurką lub wycieczki RIB na wyspy. Sprzęt musi być wystarczająco stabilny dla początkujących gości wycieczek, łatwy do czyszczenia pomiędzy grupami i wystarczająco trwały, aby można go było używać codziennie z przewodnikiem w zróżnicowanych warunkach wodnych.
      features:
        - Bardzo stabilne platformy SUP (szerokość 82 cm i więcej) dla początkujących
        - Opcje kajaków dwuosobowych do konfiguracji wycieczek para/grupa
        - Wbudowana ładowność na sprzęt do snorkelingu, worki wodoszczelne i lodówki
        - Dokumentacja zgodności CE + USCG dla działalności komercyjnej
