        description: Połączenie SUP, kajaków, pontonów i RIB-ów w celu zaspokojenia różnorodnych preferencji gości
      - title: Ceny objętościowe
        description: Warstwowe ceny hurtowe dla flot liczących ponad 20 jednostek z preferencyjnymi stawkami logistycznymi
      - title: Niestandardowe oznakowanie
        description: Drukowanie logo na sprzęcie, markowe kamizelki ratunkowe i niestandardowe opcje kolorów dla wynajmowanej floty
      - title: Program konserwacji
        description: Zestaw części zamiennych, szkolenia w zakresie napraw dla personelu i bezpośredni dostęp do wsparcia technicznego
      - title: Optymalizacja przychodów
        description: Zalecenia oparte na danych dotyczące cen, rotacji sprzętu i sezonowych dostosowań floty
    cta_text: Scale My Fleet
    cta_href: /contact
