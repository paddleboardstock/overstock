testimonial:
  content: Wynajmowałem 5 desek w lokalnym sklepie i traciłem 60% swoich przychodów na ich rzecz. Paddle Board Overstock pomogło mi zbudować własną flotę 15 SUPs. Kalkulator ROI, który udostępnili, pokazał, że wyrównam koszty po 4 miesiącach — w rzeczywistości zajęło to 3. Teraz rozbudowuję flotę do 30 desek.
  name: Daniel Okonkwo
  title: Właściciel, Lakeland SUP Rentals — Ontario, Kanada
content_segments:
  tagline: Profile wynajmu
  title: Water Sports Rental Solutions<br />Według typu operatora
  subtitle: Różne wypożyczalnie mają różne potrzeby — od małych wypożyczalni SUP przy plaży po duże ośrodki sportów wodnych w kurortach. Dopasowujemy do tego nasze pakiety wyposażenia i model wsparcia.
  items:
    - title: Wypożyczalnie SUP na plaży i nad jeziorem
      subtitle: Operacje o dużej objętości i niskiej złożoności
      description: Operatorzy wynajmujący deski typu stand-up paddle bezpośrednio turystom na plaży i nad jeziorem. Twoim priorytetem jest minimalizacja czasu między wynajmami, utrzymywanie sprzętu w rotacji oraz zarządzanie sezonowymi skokami popytu przy niewielkim zapotrzebowaniu na przestrzeń magazynową.
      features:
        - Nadmuchiwane floty SUP, które pakują się płasko — nie potrzeba pomostu ani przyczepy
        - Sprzęt klasy komercyjnej PVC przystosowany do 100+ cykli wynajmu na sezon
        - Szybkoschnąca, odporna na UV tkanina, gotowa do ponownego wynajmu tego samego dnia
        - Zasady kolorystyczne dla łatwej identyfikacji floty
    - title: Centra sportów wodnych Resort & Hotel
      subtitle: Doświadczenia gości i dostosowanie marki
      description: Ośrodki i hotele oferujące sporty wodne jako udogodnienie na miejscu. Sprzęt musi wyglądać premium, działać niezawodnie wśród gości od początkującego do średniozaawansowanego oraz integrować się z istniejącymi w ośrodku procesami rezerwacji zajęć i rozliczeń.
      features:
        - Deski i kamizelki ratunkowe z niestandardowym logo dopasowane do kolorów ośrodka
        - 'Mieszany park sprzętu: deski uniwersalne, turystyczne i z serii artystycznej'
        - Ciche, bezpaliwowe elektryczne rozwiązania do pompowania na plaży
        - Szkolenie personelu i wprowadzenie do konserwacji wliczone
    - title: Butikowe i mobilne wypożyczalnie
      subtitle: Usługi wypożyczania typu pop-up i z dostawą
      description: Operatorzy dostarczający deski bezpośrednio do klienta — dostawy na plażę hotelową, stanowiska wynajmu typu pop-up podczas wydarzeń i mobilne zestawy. Sprzęt musi być szybki w rozstawieniu, łatwy w transporcie i estetyczny na pierwszy rzut oka, z możliwością elastycznego dopasowania liczby jednostek do wydarzeń i sezonowego zapotrzebowania.
      features:
        - Transport desek w formie plecaka — bez przyczepy
        - Szybkie pompowanie do uruchomienia na żądanie w mniej niż 15 minut
        - Estetyczny sprzęt, który wygląda na premium od pierwszego spojrzenia
        - Elastyczne dopasowanie liczby jednostek do wydarzeń i sezonowego zapotrzebowania
    - title: Operatorzy wycieczek i przygód
      subtitle: Floty wycieczkowe z przewodnikiem
      description: Operatorzy prowadzący zorganizowane wycieczki sportów wodnych — safari SUP, wycieczki snorkelingowe i wyprawy wzdłuż wybrzeża. Sprzęt musi być wystarczająco stabilny dla początkujących uczestników wycieczek, szybki do czyszczenia między grupami i trwały na codzienne użycie podczas różnych warunków wodnych.
      features:
        - Ekstra stabilne platformy SUP (32" szerokości +) dla osób rozpoczynających pływanie
        - Ekstra duże, stabilne platformy do zdjęć dla par/grup podczas wycieczek
        - Wbudowana pojemność ładunkowa na sprzęt do snorkelingu, wodoodporne torby i lodówki turystyczne
        - Pakiety sprzętu bezpieczeństwa dla komercyjnych operacji turystycznych
