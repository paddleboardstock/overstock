    badge: Popular
    features:
      - title: Ocena floty
        description: Ekspercka analiza Twojej lokalizacji, danych demograficznych gości i docelowych przychodów w celu ustalenia wielkości Twojej floty
      - title: Sprzęt startowy
        description: 10 desek SUP z wiosłami, pompkami, kamizelkami ratunkowymi i zestawami naprawczymi – wszystko, czego potrzebujesz do wodowania
      - title: Rozwiązania do przechowywania
        description: Nadmuchiwany sprzęt można złożyć na płasko — do przechowywania nie jest wymagana żadna przyczepa do łodzi ani przyczepa
      - title: Zgodność z bezpieczeństwem
        description: Cały sprzęt z certyfikatem CE i konstrukcją klasy komercyjnej do codziennego użytku na wynajem
      - title: Marketing na początek
        description: Markowe zasoby fotograficzne i szablony menu do wypożyczenia, które pomogą Ci uruchomić usługę
    cta_text: Start Rental Fleet
    cta_href: /contact
  - title: Zestaw do rozbudowy floty
    subtitle: Do uprawy zwiększającej pojemność i różnorodność
    badge: Premium
