process_section:
  tagline: Jak działa wysyłka
  title: Od naszego magazynu aż do Twoich drzwi
  steps:
    - title: Wycena z opcjami frachtu
      description: Każda wycena zawiera szczegółowe opcje przewozu dla Twojego celu — ekspresowego i morskiego — wraz z przewidywanymi czasami przewozu, więc nic nie jest decydowane za Ciebie.
    - title: Kontrola jakości i paczka
      description: Deski są w 100% testowane pod kątem ciśnienia, a następnie pakowane w pompę, wiosło, smycz, płetwę, plecak i zestaw naprawczy — ten sam kompletny pakiet, który sprzedajemy w sprzedaży.
    - title: Depesza z Weihai
      description: Twoja przesyłka opuszcza naszą bazę logistyczną metodą przesyłku, którą wybrałeś, a śledzenie od drzwi do drzwi jest z Tobą udostępniane tego samego dnia.
    - title: Odprawa celna
      description: Dostarczamy fakturę handlową oraz listę pakowania potrzebną do importu. Cła importowe i podatki w Twoim kraju są odpowiedzialnością importera — zobacz sekcję celną poniżej.
    - title: Dostawa i inspekcja
      description: Sprawdź swoją dostawę po przybyciu. Jeśli coś jest uszkodzone lub brakuje, skontaktuj się z nami ze zdjęciami i numerem zamówienia — zobacz naszą polisę dotyczącą zagubionych i uszkodzonych poniżej.
customs_section:
  tagline: Służba celna i cła
  title: Cła i podatki importowe
  subtitle: Wyraźnie określamy obowiązki frachtowe, zamiast składać niejasne obietnice. Oto dokładnie, kto za co odpowiada.
  items:
    - title: Co omawiamy
      description: Twoja wycena zawiera koszt transportu do miejsca docelowego, a my przygotowujemy i dostarczamy wszystkie dokumenty eksportowe — fakturę handlową, listę pakowania oraz przesyłkę.
    - title: Co obejmuje importer
      description: Cła importowe, VAT/GST oraz wszelkie podatki z kraju docelowego są do płacenia przez importera (Ciebie lub Twoją firmę) zgodnie z przepisami obowiązującymi w Twoim kraju. Nie łączymy niejasnych obietnic podatkowych z naszymi ofertami frachtu.
    - title: Wsparcie w odprawie celnej
      description: Nasza dokumentacja jest kompletna i spójna — poprawne kody HS, deklarowane wartości i specyfikacje zarządu — co zapewnia płynność przepustki. Jeśli Twój agent lub urząd celny potrzebuje dodatkowej dokumentacji, zapewniamy ją.
    - title: Sprawdź lokalne stawki przed złożeniem zamówienia
      description: Stawki cła na nadmuchiwany sprzęt do sportów wodnych różnią się w zależności od kraju. Sprawdź zasady importowe swojego kraju lub zapytaj w swoim zapytaniu — nasze regionalne przewodniki rynkowe zawierają notatki celne dla kluczowych rynków.
lost_damaged:
  title: Utracone lub uszkodzone przesyłki
  description: Sprawdź dostawę po przyjściu. W rzadkich przypadkach, gdy deska dotrze uszkodzona lub brakuje paczki, skontaktuj się z nami jak najszybciej, podając numer zamówienia oraz wyraźne zdjęcia opakowania i deski. Każdą przypadek oceniamy indywidualnie — w zależności od przypadku oznacza to część wymienną, płytę wymienną lub zwrot za uszkodzony produkt. Wady produkcyjne są objęte osobno naszą SUP 2-letnią gwarancją.
destinations_section:
  tagline: Gdzie wysyłamy
  title: 50+ krajów i liczba rośnie
  description: Wysyłamy na cały świat, z szczegółowymi przewodnikami po naszych kluczowych rynkach regionalnych. Każdy przewodnik rynkowy obejmuje lokalne typy klientów, notatki wysyłkowe oraz wskazówki dotyczące cel dla danego regionu.
  regions_label: Regionalni Przewodnicy
  countries_label: Przewodniki po kraju
faq_section:
  title: FAQ dotyczące wysyłki
  items:
    - q: Jak długo trwa wysyłka ekspresowa?
      a: Czas ekspresowego transportu zależy od miejsca docelowego — przy każdym zapytaniu podajemy szacowany czas przejścia dla Twojego kraju, zanim się na cokolwiek zobowiążesz.
    - q: Jak długo zajmuje transport transportu morskiego?
      a: Tranzyt towarowy na morzu różni się w zależności od portu docelowego i harmonogramu rejsów. Podajemy szacowany czas oczekiwania na Twój cel wraz z zamówieniem, a Ty otrzymujesz śledzenie po odejściu przesyłki.
    - q: Jaką metodę wysyłki powinienem wybrać?
      a: Express na 1–3 deski, próbki lub pilne uzupełnienia. Transport morski dla hurtowych zamówień 5–20 desk, gdzie koszt za deskę ma większe znaczenie niż szybkość. Oferujemy wyceny obu, abyś mógł porównać.
    - q: Czy cła importowe i podatki są wliczone w koszt wysyłki?
      a: Nie. Fracht jest wyceniany osobno, a cła importowe, VAT/GST oraz podatki docelowe są odpowiedzialnością importera zgodnie z przepisami Twojego kraju. Zapewniamy kompletną, dokładną dokumentację, aby zapewnić płynność rozliczenia.
    - q: Czy wysyłacie do mojego kraju?
      a: Wysyłamy do 50+ krajów. Sprawdź nasze przewodniki regionalne i krajowe poniżej lub po prostu zapytaj w swoim zapytaniu — potwierdzimy aktualną jakość obsługi na Twój adres.
    - q: Czy mogę śledzić swoje zamówienie?
      a: Tak. Każda przesyłka — ekspresowa lub morska — zawiera śledzenie od drzwi do drzwi, które udostępniamy Ci w dniu wysyłki.
