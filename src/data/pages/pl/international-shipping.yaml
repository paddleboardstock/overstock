hero:
  tagline: Żegluga międzynarodowa
  title: Międzynarodowa żegluga —<br />Ekspresowe i morskie przewozy towarowe do 50+ krajów
  subtitle: Każde zamówienie wysyłane jest z naszej bazy logistycznej w Weihai w Chinach. Wybierz ekspresowy fracht lotniczy dla próbek i pilnych uzupełnień, albo skonsolidowany transport morski dla hurtowych zamówień dla małych firm.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Deski pakowane do wysyłki międzynarodowej
direct_answer: Paddle Board Overstock wysyła do ponad 50 krajów z Weihai w Chinach. Ekspresowy transport lotniczy przewozi 1–3 deski, zamówienia próbne i pilne uzupełnienia zapasów; skonsolidowany transport morski to ekonomiczna opcja dla hurtowych zamówień 5–20 płyt. Każda wysyłka obejmuje trasę od drzwi do drzwi, a każda deska jest w 100% testowana ciśnieniowa i pakowana z pełnym zestawem akcesoriów przed wysyłką.
tldr_points:
  - 'Ekspresowe przewozy lotnicze: 1–3 deski, próbki, pilne uzupełnienia zapasów — najszybsza opcja'
  - 'Transport morski: hurtowe zamówienia na 5–20 pokładów — najniższy koszt frachtu na pokład'
  - Śledzenie od drzwi do drzwi przy każdej przesyłce do 50+ krajów
  - W wycenach wymieniono przewozy, ubezpieczenie, odprawę celną i cła importowe — bez żadnych niejasnych obietnic
from_china:
  tagline: Transport z Chin
  title: Skąd wysyłają rozkazy
  description: Wszystkie zamówienia są wysyłane z naszej bazy logistycznej w Weihai w Chinach — sercu naszej produkcji i magazynowania. Weihai to duże nadmorskie miasto portowe w prowincji Shandong, z bezpośrednimi połączeniami towarowymi i morskimi, co utrzymuje czas tranzytu i koszty frachtu konkurencyjnymi dla destynacji w Azji, obu Amerykach, Afryce, Europie i na Bliskim Wschodzie.
modes_section:
  tagline: Dwie opcje
  title: Ekspresowa wysyłka lub transport morski
  subtitle: Odpowiednia metoda transportu zależy od tego, jak szybko potrzebujesz desek i ile zamawiasz. Obie opcje są wycenione przy każdym zapytaniu.
  express:
    name: Opcja A — Wysyłka ekspresowa
    best_for: Najlepsze na 1–3 deski, próbki i pilne uzupełnienia zapasów
    description: Air Express dostarcza małe zamówienia i próbne tablice do drzwi w ciągu dni, a nie tygodni. Idealne, gdy testujesz model przed większym zamówieniem lub uzupełniasz bestseller w trakcie sezonu.
    features:
      - 1–3 płyty, pojedyncze modele lub mieszane próbki modeli
      - Najszybszy transport z tych dwóch opcji — podano według celu
      - Śledzenie od drzwi do drzwi u dużego przewoźnika ekspresowego
      - 'Typowe zastosowanie: próbki, pilne uzupełnienia, małe pierwsze zamówienia'
  sea:
    name: Opcja B — Transport morski
    best_for: Najlepsze dla zamówień hurtowych i detalistów od 5 do 20 osób
    description: Skonsolidowany transport morski jest ekonomicznym wyborem dla hurtowych zamówień dla małych firm. Deski są pakowane w jedną skonsolidowaną przesyłkę z Weihai, co utrzymuje niskie koszty frachtu na pokładzie.
    features:
      - 5–20 zamówień detalicznych i hurtowych dla sprzedawców i dystur
      - Najniższy koszt frachtu na pokładzie spośród obu opcji
      - Skonsolidowane pakowanie — jedna przesyłka, jedna odprawa
      - 'Typowe zastosowanie: sezonowe uzupełnienia zapasów, zamówienia hurtowe modeli mieszanych'
