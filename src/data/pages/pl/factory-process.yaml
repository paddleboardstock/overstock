tldr:
  summary: Paddle Board Overstock przechodzi rygorystyczny, wieloetapowy proces produkcji od inspekcji surowców, przez cięcie, spawanie, dekorację pokładu i wykończenie EVA, montaż, test ciśnieniowy 1,25x nominalnego ciśnienia oraz końcową kontrolę jakości. 100% desek poddawanych jest testowi ciśnieniowemu, 99,3% bez wad.
  points:
    - 'Inspekcja surowców: testy rozciągania, rozdzierania, UV'
    - Automatyczne CNC cięcie i spawanie RF o wysokiej częstotliwości
    - Ręcznie montowana dekoracja pokładu EVA z blokami bez blaknięcia
    - Utrzymanie ciśnienia 1,25x nominalnego przez 24-48h dla każdej jednostki
    - 100-punktowa inspekcja końcowa każdej deski
