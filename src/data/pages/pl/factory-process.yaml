hero:
  tagline: Proces
  title: Proces produkcyjny
  subtitle: Od surowca po gotowość do morza — każdy krok pod naszą kontrolą
  back_label: Powrót do Fabryki
  back_link: /factory
intro: W przeciwieństwie do marek, które zlecają produkcję fabrykom zewnętrznym, Paddle Board Overstock są właścicielami i operatorami całego łańcucha produkcyjnego. Ta pionowa integracja pozwala nam utrzymać ścisłą kontrolę jakości na każdym etapie i dostarczać spójną jakość produktu partię po partii. Oto jak w naszym zakładzie zbudowana jest płyta.
steps:
  - step: '01'
    title: Otrzymanie i inspekcja materiałów
    description: Każda napływająca partia PVC tkanin, drop-stitch rdzeni, EVA pianki i okuć jest sprawdzana zgodnie ze specyfikacją. Próbki tkanin są testowane pod kątem wytrzymałości na rozciąganie, jednolitości grubości i UV odporności przed wpuszczeniem do produkcji. Materiały niezgodne z normami są kwarantannowe i zwracane.
    duration: 1–2 dni
  - step: '02'
    title: PVC Automatyczne cięcie
    description: Zatwierdzone tkaniny są układane na CNC automatycznej maszynie tnącej i cięte z dokładnością poniżej milimetra. Komputerowo zmodyfikowane gniazdowanie układa panele tak, aby minimalizować odpady — zazwyczaj poniżej 5%. Panele cięte są oznaczane według modelu płyty i komory, a następnie pakowane do transportu do warsztatu spawalniczego.
    duration: 2–4 godziny na zestaw deskowy
  - step: '03'
    title: Uszczelnianie termiczne i spawanie rur
    description: Panele są przypinane i łączone za pomocą maszyn do uszczelniania termicznego spawaniem gorącym powietrzem w kontrolowanych temperaturach 200–600 °C. Główne łącze wzmacniane są spawaniem dielektrycznym RF dla szczelnych, wytrzymałych połączeń. Gotowe komory są pompowane do 1,25× ciśnienia roboczego na 30-minutową weryfikację zatrzymania powietrza.
    duration: 1–2 dni na plansze
  - step: '04'
    title: Grafika talii i EVA wykończenie
    description: 'Tutaj powstają talie z serii artystycznych: EVA precyzyjnie cięte panele piankowe układane są w pełne wzory talii, klejone i ręcznie przycinane. Chwytliwe, wygodne i trwałe — charakterystyczny wygląd każdej planszy z serii artystycznych.'
    duration: 1–2 dni
  - step: '05'
    title: SUP Druk i dekoracja
    description: SUP Grafiki na pokładzie desek są stosowane za pomocą druku cyfrowego do pełnokolorowych projektów fotograficznych oraz sitodruku dla trwałych logografii i powtarzających się wzorów. Odbitki są utwardzane i uszczelniane pod kątem UV odporności na ścieranie.
    duration: 1–2 dni
  - step: '06'
    title: Montaż końcowy i montaż
    description: 'Płyty otrzymują swoje końcowe elementy: zawory są dokręcane i testowane funkcjonalnie, montowane są D-ringi, uchwyty i skrzynki z żebermi, a mocowanie smyczy jest zabezpieczone. Każda deska przebiega według 100-punktowej listy kontrolnej montażu z obowiązkowym podpisem na każdym etapie.'
    duration: 2–3 dni
  - step: '07'
    title: Testowanie jakości i inspekcja
    description: 'Każda ukończona deska przechodzi obowiązkową kontrolę jakości: test utrzymania powietrza w komorze, sprawdzenie funkcji systemów, weryfikację momentu momentu mocowania oraz inspekcję kosmetyczną. Konstrukcje niestandardowe i prototypowe przechodzą także próby morskie na wodzie obejmujące prędkość, prowadzenie, stabilność i wytrzymałość.'
    duration: 1–2 dni
  - step: '08'
    title: Pakowanie i wysyłka
    description: Deski są spuszczane, zwijane i pakowane w plecaki podróżne z pompą, wiosłem, płetwą, smyczą i zestawem naprawczym, a następnie pakowane do transportu kurierskiego i frachtowego. Każda paczka jest oznaczona modelem, numerem seryjnym i celem docelowym. Wysyłamy do 50+ krajów na całym świecie.
    duration: 1 dzień
