  subtitle: Od Cancún i Tulum po Puerto Vallarta i Los Cabos — zupełnie nowe nadmiarowe deski do wiosłowania dla meksykańskich sklepów plażowych, hoteli i sprzedawców internetowych, od 5 desek.
