hero:
  tagline: Matryca rozwiązań branżowych
  title: Rozwiązania morskie oparte na scenariuszach<br />Do profesjonalnych operacji
  subtitle: Specjalnie zaprojektowane nadmuchiwane jednostki pływające i RIB-y skonfigurowane do zastosowań ratowniczych, wynajmu floty, przetargów na jachty i zastosowań w rybołówstwie komercyjnym — każdy poparty specyfikacjami technicznymi i opcjami dostosowywania.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Profesjonalne rozwiązania morskie Paddle Board Overstock dla różnorodnych gałęzi przemysłu
direct_answer: 'Paddle Board Overstock dostarcza dostosowane do scenariuszy nadmuchiwane jednostki pływające i rozwiązania RIB do komercyjnych operacji morskich: łodzie ratownicze i patrolowe ze wzmocnionymi rurami Hypalon i wielokomorowym bezpieczeństwem, flota SUP i kajaki do wynajęcia ze szwami zgrzewanymi gorącym powietrzem o grubości 1,2 mm, co zapewnia trwałość wymagającą niewielkiej konserwacji, luksusowe jachty z RIBami z aluminiowego kadłuba o głębokości V oraz konfiguracje wędkarskie do ciężkich zastosowań z uchwytami na wędki i systemami osłon na żywe zwierzęta.'
solution_a:
  tagline: Rozwiązanie A
  title: Ratownictwo Morskie i<br />Patrol Handlowy
  subtitle: Szybkie, wielokomorowe RIBy bezpieczeństwa do profesjonalnego reagowania w sytuacjach awaryjnych i działań organów ścigania.
  badge: Heavy-Duty Series
  description: Nasze RIB-y do ratownictwa morskiego i patroli są zbudowane ze wzmocnionych rur powietrznych z Hypalonu/PVC o dużej gęstości i charakteryzują się wielokomorową, niezależną konstrukcją flotacyjną. Każdy statek jest wyposażony w profesjonalną taśmę odblaskową, liny ratownicze i zawory szybkiego napełniania, umożliwiające gotowość do użycia. Kadłuby z włókna szklanego typu Deep-V zapewniają wyjątkową stabilność przy dużych prędkościach i w trudnych warunkach morskich.
  features:
    - title: Bezpieczeństwo wielokomorowe
      description: 4–6 niezależnych komór powietrznych – każde przebicie pojedynczej komory zapewnia dodatnią flotację
    - title: Wzmocniona tkanina tubowa
      description: Hypalon CSM lub 1680 DTEX PVC o grubości 1,2 mm z dwuwarstwowymi szwami zgrzewanymi gorącym powietrzem
    - title: Stopień profesjonalny
      description: Taśma odblaskowa SOLAS, liny ratownicze, knagi holownicze, szybkozłączka lina malarska
    - title: Szybki kadłub
      description: Kadłub z włókna szklanego lub aluminium typu Deep-V o prędkości 25–45 węzłów, w zależności od konfiguracji
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Materiał kadłuba
      value: Włókno szklane / aluminium klasy morskiej
    - label: Tkanina tubowa
      value: Hypalon CSM / 1680 DTEX PVC o grubości 1,2 mm
    - label: Maksymalna prędkość
      value: 25–45 węzłów
    - label: Pojemność
      value: 6–12 osób
    - label: Zakres silników
      value: 40–200 KM
    - label: Orzecznictwo
      value: CE/ISO9001
solution_b:
  tagline: Rozwiązanie B
  title: Wypożyczalnia sportów wodnych i<br />sprzęt floty ośrodka
  subtitle: Niezwykle trwałe, łatwe w utrzymaniu nadmuchiwane SUP, kajaki i łodzie zbudowane do codziennego użytku na wynajem w kurortach, klubach i organizacjach turystycznych.
  badge: Rental-Grade
  description: Sprzęt naszej floty do wynajęcia został zaprojektowany z myślą o najwyższej trwałości i najniższych kosztach konserwacji. Używamy wzmocnionego PCV o grubości 1,2 mm z trójwarstwową technologią zgrzewania gorącym powietrzem, która jest odporna na degradację UV i częste uszkodzenia kolizyjne. Konstrukcja drop-stitch zapewnia, że deski zachowują sztywność nawet po setkach cykli wypożyczeń. Wszystkie modele posiadają wzmocnione pierścienie typu D, odporne na ścieranie opaski szynowe i zawory klasy komercyjnej.
  features:
    - title: PCV klasy handlowej
      description: Wzmocniony PVC o grubości 1,2 mm ze stabilizatorami UV — 3 razy grubszy niż materiały klasy konsumenckiej
    - title: Szwy zgrzewane gorącym powietrzem
      description: Zgrzewanie trójwarstwowe — mocniejsze niż klejenie, odporne na rozwarstwianie
    - title: Sztywność drop-stitch
      description: Rdzeń 1680 DTEX z 2 zwojami na cal kwadratowy — obciążenie znamionowe do 20 PSI zapewnia sztywność porównywalną z płytą pilśniową
    - title: Projekt gotowy na flotę
      description: Wzmocnione pierścienie typu D, dostępne w handlu zawory Halkey-Roberts, odporne na ścieranie opaski szynowe
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Materiał tuby
      value: 1,0–1,2 mm wzmocniony PVC
    - label: Technologia szwów
      value: Zgrzewanie trójwarstwowe gorącym powietrzem
    - label: Maksymalne ciśnienie
      value: 15–20 PSI (modele ze ściegiem kroplowym)
    - label: Odporność na promieniowanie UV
      value: Ponad 1000 godzin przyspieszonych testów
    - label: Gwarancja
      value: 2–5 lat w zależności od modelu
    - label: Konserwacja
      value: Minimalne — spłucz i przechowuj
solution_c:
  tagline: Rozwiązanie C
  title: Przetargi na jachty i<br />luksusowe jednostki pływające
  subtitle: Lekkie, wydajne łodzie RIB przeznaczone do przechowywania superjachtów i transportu gości, charakteryzujące się luksusowym dopasowaniem i wykończeniem.
  badge: Premium Series
  description: Nasze jachtowe RIBy przetargowe łączą lekką konstrukcję z luksusową estetyką. Kadłuby z aluminium lub włókna szklanego o głębokim kształcie litery V zapewniają wyjątkową jakość jazdy i łatwe podnoszenie żurawików. dostępne z dopasowaną kolorystycznie grafiką tub, wysokiej jakości tapicerką i niestandardowymi układami konsoli. Kompaktowe wymiary przechowywania sprawiają, że idealnie nadają się do garaży dla superjachtów i do przechowywania na pokładzie.
  features:
    - title: Lekka konstrukcja
      description: Kadłuby aluminiowe klasy morskiej zmniejszają wagę o 30% w porównaniu z włóknem szklanym, co ułatwia podnoszenie
    - title: Wydajność Deep-V
      description: Kadłub o kącie wzniosu 18–22 stopni zapewnia płynną jazdę w kotle i doskonałe śledzenie
    - title: Luksusowe dopasowanie i wykończenie
      description: Niestandardowa tapicerka, dopasowane kolorystycznie rurki, wysokiej jakości konsola steru, pakiet ze stali nierdzewnej
    - title: Kompaktowe przechowywanie
      description: Zaprojektowany do garaży superjachtów — nadmuchiwane rurki do kompaktowego przechowywania
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Typ kadłuba
      value: Głębokie V aluminium / włókno szklane
    - label: Martwy wzrost
      value: 18–22 stopnie
    - label: Maksymalna prędkość
      value: 30–40 węzłów
    - label: Sucha masa
      value: 120–350 kg (kadłub aluminiowy)
    - label: Gotowy podnośnik Davit
      value: Tak – standardowe punkty podnoszenia
    - label: Składowanie
      value: Dmuchane rurki, możliwość układania w stosy
