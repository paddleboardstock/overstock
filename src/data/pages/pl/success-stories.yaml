hero:
  tagline: Historie sukcesu
  title: Prawdziwe wyniki od<br />kreatorów przedsiębiorstw wodnych
  subtitle: Zobacz, jak kluby, kurorty i przedsiębiorcy na całym świecie stworzyli dochodową działalność w zakresie sportów wodnych dzięki sprzętowi i wsparciu Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Historie sukcesu klientów Paddle Board Overstock
stories:
  - title: Jak śródziemnomorski kurort zbudował dochodowy biznes wynajmu SUP
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: 5-gwiazdkowy kurort nadmorski — Grecja
    problem: Ośrodek potrzebował najwyższej jakości zajęć wodnych dla gości, aby zwiększyć poziom zadowolenia i stworzyć nowy strumień przychodów, ale brakowało mu sprzętu, infrastruktury bezpieczeństwa i wiedzy personelu.
    solution: Paddle Board Overstock dostarczył 50 niestandardowych desek SUP z kolorami i logo ośrodka, kompletny system bezpieczeństwa, w tym stanowisko ratownika i liny bojowe, a także 3-dniowy program szkolenia personelu obejmujący obsługę sprzętu, instruktaż gości i protokoły bezpieczeństwa.
    result:
      - Ponad 300 aktywności gości zarezerwowanych tygodniowo w pierwszym miesiącu
      - 'Oceny zadowolenia gości z aktywności wodnych: 4,8/5'
      - 'Nowe roczne przychody dodatkowe: 180 tys. $'
      - Zero incydentów bezpieczeństwa w pierwszym sezonie operacyjnym
      - Koszt wymiany sprzętu obniżony o 40 % w porównaniu z poprzednim dostawcą
    quote:
      text: Paddle Board Overstock nie tylko dostarczył deski — pomógł nam stworzyć kompletne doświadczenie gości. Nasz program sportów wodnych w ciągu jednego sezonu przeszedł od zera do najważniejszego wydarzenia w ośrodku.
      author: Dyrektor Generalny Ośrodka
    cta_text: Zbuduj rozwiązanie dla swojego kurortu
    cta_href: /solutions/resorts
  - title: Jak australijski startup zbudował markę wody w 90 dni
    badge: Brand Launch
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    customer: Przedsiębiorca po raz pierwszy — Australia
    problem: Entuzjasta outdooru chciał wprowadzić na rynek australijski własną markę SUP, ale nie miał doświadczenia w produkcji, relacji z dostawcami i ograniczony kapitał.
    solution: Pakiet wprowadzający markę Paddle Board Overstock obejmował konsultacje w zakresie wyboru produktu, niestandardowe logo i projekt kolorystyczny, markowe opakowanie detaliczne z zawieszkami, dokumentację certyfikacyjną CE oraz wysyłkę FOB do Sydney.
    result:
      - Pierwsza dostawa 200 desek zrealizowana w 75 dni od pierwszego kontaktu
      - Marka uruchomiona na Shopify + Amazon AU w ciągu 2 tygodni od przybycia
      - Początkowy zapas wyprzedany w 45 dni
      - 'Średnia marża: 55 % na cenach detalicznych'
      - 'Drugie zamówienie: 500 sztuk złożone w ciągu 60 dni od startu'
    quote:
      text: Miałem pomysł na markę, ale zerową wiedzę na temat produkcji. Paddle Board Overstock dosłownie trzymał mnie za rękę przez cały proces — od wyboru odpowiedniego projektu płyty po rozpakowanie mojej pierwszej przesyłki. Od snu do dostawy 90 dni.
      author: Założyciel australijskiej marki SUP
    cta_text: Uruchom swoją markę
    cta_href: /solutions/entrepreneurs
  - title: Jak tajski klub plażowy powiększył się z 10 do 80 desek
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Klub sportów wodnych — Tajlandia
    problem: Mały klub SUP przy plaży w Phuket musiał przekształcić się z działalności hobbystycznej w profesjonalną wypożyczalnię obsługującą turystów, ale nie mógł znaleźć niezawodnego dostawcy sprzętu o stałej jakości i cenach.
    solution: Począwszy od Pakietu Startowego Paddle Board Overstock's Club (10 desek, wioseł, sprzęt ochronny, branding), klub rozwijał się poprzez program Pakietu Premium w ciągu 18 miesięcy.
    result:
      - Rozwój z 10 do 80 desek w 18 miesięcy przy stałej jakości i cenach
      - Dodano wynajem kajaków i rowerków wodnych u tego samego dostawcy
      - Spersonalizowany branding klubu zwiększył rozpoznawalność marki wśród turystów
      - Koszty utrzymania obniżone o 60 % w porównaniu z poprzednim budżetowym sprzętem
      - Obecnie ponad 150 wypożyczeń dziennie w szczycie sezonu
    quote:
      text: Pakiet Startowy Klubu był idealnym punktem wyjścia. Wraz z rozwojem naszej firmy, Paddle Board Overstock rozwijał się wraz z nami — ta sama jakość, te same ceny, żadnych niespodzianek.
      author: Właściciel klubu, Phuket
    cta_text: Rozpocznij swój pakiet klubowy
    cta_href: /solutions/clubs
  - title: Jak karaibska sieć kurortów ujednoliciła sporty wodne w 5 obiektach
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    customer: Sieć kurortów — Karaiby
    problem: Sieć luksusowych ośrodków wypoczynkowych obejmująca 5 obiektów potrzebowała spójnej jakości sprzętu do sportów wodnych i marki we wszystkich lokalizacjach, przy scentralizowanym zaopatrzeniu i planowaniu sezonowej wymiany.
    solution: Paddle Board Overstock dostarczył flotę obejmującą 300 SUP i 100 kajaków z ujednoliconym brandingiem, wspólnym zapasem części zamiennych i rocznym harmonogramem wymiany z cenami hurtowymi.
    result:
      - Ujednolicone doświadczenie gości we wszystkich 5 obiektach
      - Redukcja kosztów o 30 % dzięki skonsolidowanym zakupom i cenom za duże wolumeny
      - Scentralizowany magazyn części zamiennych skrócił przestoje o 80 %
      - Roczny program wymiany sprzętu wyeliminował końcową gonitwę sezonową
      - Udział gości w sportach wodnych wzrósł o 45 % rok do roku
    cta_text: Zaprojektuj program dla swojego kurortu
    cta_href: /solutions/resorts
