hero:
  tagline: Centrum Autorytetu
  title: Dlaczego Aquafarer?<br />Zaufanie budowane przez dekadę
  subtitle: Każda łódź, którą budujemy, niesie ze sobą ciężar ponad 10-letniego doświadczenia w inżynierii morskiej, certyfikowanych systemów jakości i tysięcy udanych operacji na całym świecie. Właśnie dlatego profesjonaliści z branży wybierają Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Zakład produkcyjny i zespół inżynierów firmy Aquafarer
stats:
  title: Aquafarer w liczbach
  stats:
    - title: Lata w działaniu
      amount: Since 2012
    - title: Inżynierowie ds. badań i rozwoju
      amount: 50+
    - title: Obsługiwane kraje
      amount: 50+
    - title: Dostarczono sprzęt
      amount: 15,000+
features3_brand:
  tagline: Kim jesteśmy
  title: Fundacja marki<br />i dziedzictwo
  subtitle: Historia, wiedza specjalistyczna i globalny zasięg, które definiują Aquafarer jako zaufanego producenta sprzętu morskiego.
  isBeforeContent: false
  columns: 3
  items:
    - title: O Aquafarerze
      description: Założona w 2012 roku w Qingdao w Chinach. Od warsztatu przybrzeżnego po obiekt o powierzchni 12 000 m² — pełna historia Aquafarer.
      icon: tabler:building-factory
      link: /about
    - title: Historia marki
      description: Jak zespół inżynierów morskich postanowił udostępnić na całym świecie profesjonalne nadmuchiwane jednostki pływające.
      icon: tabler:book
      link: /brand-story
    - title: Doświadczenie w branży morskiej
      description: Głęboka nauka o materiałach, precyzyjna produkcja i testy w świecie rzeczywistym — dziesięciolecia inżynierii morskiej w każdym kadłubie.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globalna obecność
      description: Obsługujemy ponad 50 krajów na każdym kontynencie. Regionalna wiedza specjalistyczna w zakresie lokalnych wymogów regulacyjnych i preferencji rynkowych.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Dlaczego Aquafarer
      description: Co nas wyróżnia — jakość, personalizacja, bezpośrednie ceny fabryczne i kompleksowe wsparcie dla operatorów komercyjnych.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Nasz zespół
      description: Poznaj kierownictwo — inżynierów morskich, naukowców zajmujących się materiałami i ekspertów ds. produkcji, którzy napędzają rozwój Aquafarer.
      icon: tabler:users
      link: /brand/team
    - title: Zespół inżynierski
      description: Ponad 78 lat połączonych badań i rozwoju, ponad 40 platform, 12 certyfikatów, ponad 1200 projektów OEM. Zespół techniczny stojący za każdym produktem.
      icon: tabler:engine
      link: /engineering-team
    - title: Centrum badawczo-rozwojowe
      description: Inżynieria kadłuba, spawanie RF, laboratorium PCV, prototypowanie, zbiornik testowy i laboratorium jakości — nasze pełne zaplecze badawczo-rozwojowe.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Zaufanie i jakość
  title: Certyfikaty, jakość<br />i dowód
  subtitle: Niezależne certyfikaty, rygorystyczne testy i prawdziwe dowody potwierdzające nasze zaangażowanie w jakość.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certyfikaty
      description: CE, ISO 9001, UKCA, BSCI, REACH — pełna dokumentacja certyfikacyjna i zgodność dla rynków światowych.
      icon: tabler:shield-check
      link: /certifications
    - title: Jakość i testowanie
      description: Każdy produkt jest testowany ciśnieniowo przed wysyłką. Wytrzymałość szwów, odporność na promieniowanie UV, wyporność – sprawdzane na każdym etapie.
      icon: tabler:clipboard-check
      link: /quality
    - title: Dowody i dowody
      description: Wyniki testów, zdjęcia z wdrożenia, raporty z inspekcji stron trzecich i studia przypadków potwierdzające jakość Aquafarer.
      icon: tabler:file-check
      link: /evidence
    - title: Wykres wiedzy
      description: Przeglądaj wykres encji Aquafarer — produkty, technologie, certyfikaty i relacje w połączonej bazie wiedzy.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Przywództwo
  title: Poznaj zespół<br /> stojący za Aquafarerem
  subtitle: Wiedza branżowa obejmująca inżynierię morską, naukę o materiałach, zarządzanie jakością i globalny handel B2B.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — założyciel i dyrektor generalny
      description: Ponad 15 lat w produkcji okrętowej. Wcześniej kierował badaniami i rozwojem u głównego chińskiego producenta łodzi. Posiada wiele patentów na konstrukcję pontonów.
      icon: tabler:crown
    - title: Zhang Wei — główny inżynier
      description: Ponad 20 lat w produkcji PVC/Hypalon i projektowaniu kadłubów o głębokim kształcie litery V. Były dyrektor techniczny w europejskiej firmie zajmującej się inżynierią morską.
      icon: tabler:engine
    - title: Chen Ming — kierownik działu badań i rozwoju
      description: Doktor nauk o materiałach. Specjalizuje się w technologii drop-stitch oraz zgrzewaniu wysoką częstotliwością. Ponad 10 lat w kompozytach tekstylnych.
      icon: tabler:flask
    - title: Liu Qiang — dyrektor produkcji
      description: Ponad 18 lat w Lean Manufacturing. Czarny pas Six Sigma. Wdrożony system jakości ISO 9001 na wszystkich liniach produkcyjnych.
      icon: tabler:settings
    - title: Wang Fang — kierownik ds. jakości
      description: Ponad 12 lat w morskiej kontroli jakości. Certyfikowany audytor CE i ISO. Nadzoruje badania każdej partii produkcyjnej.
      icon: tabler:shield-check
    - title: Helen Lee – dyrektor sprzedaży
      description: Ponad 15 lat w międzynarodowym handlu B2B. Zarządzane partnerstwami OEM/ODM w ponad 30 krajach. Biegle włada 4 językami.
      icon: tabler:briefcase
cta:
  title: Chcesz zweryfikować nasze referencje?
  subtitle: Skontaktuj się z nami, aby uzyskać kopie certyfikatów, raporty z inspekcji stron trzecich lub umówić się na wizytę w fabryce.
  actions:
    - variant: primary
      text: Poproś o dane uwierzytelniające
      href: /contact
    - text: Zobacz szczegóły certyfikatu
      href: /certifications
