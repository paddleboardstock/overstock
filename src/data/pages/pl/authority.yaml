features3_brand:
  tagline: Kim jesteśmy
  title: Fundacja marki<br />i dziedzictwo
  subtitle: Historia, wiedza i globalny zasięg definiują Paddle Board Overstock markę zaufaną SUP .
  isBeforeContent: false
  columns: 3
  items:
    - title: O nas Paddle Board Overstock
      description: Założona w 2012 roku w Weihai, Chiny. Od warsztatu nadbrzeżnego po obiekt o powierzchni 12 000 m² — Paddle Board Overstock cała historia.
      icon: tabler:building-factory
      link: /about
    - title: Historia marki
      description: Jak zespół inżynierów morskich postanowił uczynić profesjonalne dmuchane deski paddle dostępne na całym świecie.
      icon: tabler:book
      link: /brand-story
    - title: Doświadczenie w branży morskiej
      description: Głęboka nauka o materiałach, produkcja precyzyjna i testy w praktyce — dekady inżynierii morskiej na każdej desce.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Dlaczego Paddle Board Overstock
      description: Co nas wyróżnia — jakość, personalizacja, bezpośrednie ceny fabryczne oraz kompleksowe wsparcie dla każdego wioślarza.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Nasz zespół
      description: Poznaj kierownictwo — inżynierów morskich, naukowców zajmujących się materiałami i ekspertów produkcyjnych, którzy idą Paddle Board Overstock naprzód.
      icon: tabler:users
      link: /brand/team
    - title: Zespół inżynierski
      description: 78+ łącznych lat badań i rozwoju, 40 platform,+ 1200+ projektów inżynieryjnych. Zespół techniczny stojący za każdym produktem.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Zaufanie i jakość
  title: Jakość, testowanie<br />& Dowód
  subtitle: Rygorystyczne testy, prawdziwe dane testowe i dowody potwierdzające nasze zaangażowanie w jakość.
  isBeforeContent: false
  columns: 3
  items:
    - title: Jakość i testowanie
      description: Każdy produkt jest testowany ciśnieniowo przed wysyłką. Wytrzymałość szwów, odporność na promieniowanie UV, wyporność – sprawdzane na każdym etapie.
      icon: tabler:clipboard-check
      link: /quality
    - title: Dowody i dowody
      description: Wyniki testów, zdjęcia wdrożeń, raporty z inspekcji firm trzecich oraz studia przypadków potwierdzające Paddle Board Overstock jakość.
      icon: tabler:file-check
      link: /evidence
    - title: Wykres wiedzy
      description: Poznaj Paddle Board Overstock graf encji — produkty, technologie, materiały i relacje w połączonej bazie wiedzy.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Przywództwo
  title: Poznaj zespół<br />Tył Paddle Board Overstock
  subtitle: Wiedza branżowa obejmująca inżynierię morską, naukę o materiałach, zarządzanie jakością oraz globalny e-commerce.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — założyciel i dyrektor generalny
      description: 15+ lat w produkcji morskiej. Wcześniej kierował działem badań i rozwoju w dużym chińskim producentie morskim. Posiada kilka patentów w projektowaniu produktów dmuchanych.
      icon: tabler:crown
    - title: Zhang Wei — główny inżynier
      description: 20+ lat doświadczenia w wytwarzaniu tworzyw sztucznych i projektowaniu konstrukcji nadmuchiwanych. Były dyrektor techniczny w europejskiej firmie inżynierii morskiej.
      icon: tabler:engine
    - title: Chen Ming — kierownik działu badań i rozwoju
      description: Doktor nauk o materiałach. Specjalizuje się w technologii drop-stitch oraz zgrzewaniu wysoką częstotliwością. Ponad 10 lat w kompozytach tekstylnych.
      icon: tabler:flask
    - title: Liu Qiang — dyrektor produkcji
      description: 18+ lat pracy w produkcji lean. Wdrożenie rygorystycznych systemów jakości na wszystkich liniach produkcyjnych.
      icon: tabler:settings
    - title: Wang Fang — kierownik ds. jakości
      description: 12+ lat w kontroli jakości na morzu. Kieruje wewnętrznymi audytami jakości. Nadzoruje testy dla każdej partii produkcyjnej.
      icon: tabler:shield-check
    - title: Helen Lee – dyrektor sprzedaży
      description: 15 lat doświadczenia w międzynarodowym e-commerce i logistyce. Wysyła deski do wioślarzy w 50 krajach. Biegle mówi w 4 językach.
      icon: tabler:briefcase
cta:
  title: Chcesz dowodu na naszą jakość?
