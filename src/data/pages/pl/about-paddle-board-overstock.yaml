team_section:
  tagline: Zespół
  title: Ludzie stojący za deskami
  description: Nasza baza w Weihai jest domem dla 14-osobowego zespołu badawczo-rozwojowego zajmującego się materiałami, projektowaniem konstrukcji i procesami produkcyjnymi. Wokół nich działa szerszy zespół odpowiedzialny za kontrolę jakości, zapasy, logistykę i wsparcie, z którego korzystasz, gdy się z nami kontaktujesz — ci sami ludzie, niezależnie od tego, czy kupujesz jedną deskę czy dwadzieścia.
