hero:
  tagline: O nas
  title: O nas Paddle Board Overstock
  subtitle: Od 2012 roku dostarczamy zupełnie nowe SUP dmuchane deski w ręce kajakarzy i małych sprzedawców w 50+ krajach — nadmiar zapasów, uczciwe ceny i gwarancja, którą faktycznie szanujemy.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock Nowe SUP nadmuchiwane deski
direct_answer: Paddle Board Overstock to marka sprzętu do sportów wodnych założona w 2012 roku i z siedzibą w Weihai w Chinach. Sprzedajemy zupełnie nowe SUP nadmuchiwane deski z nadmiaru zapasów — mieszankę nadwyżki produkcji z naszej własnej bazy produkcyjnej oraz starannie dobranych zapasów z fabryk partnerskich — bezpośrednio do kajakarzy końcowych oraz do małych detalistów w 50+ krajach. Każda deska jest w 100% testowana pod kątem ciśnieniowym, objęta SUP 2-letnią gwarancją i wysyłana ekspresowo lub morsko.
tldr_points:
  - Założone w 2012 roku, z siedzibą w Weihai w Chinach — jednym z kluczowych SUP światowych ośrodków produkcji
  - 'Model Overstock: zupełnie nowe deski w cenie poniżej ceny detalicznej, bez pośredników'
  - 'Zapasy są mieszane: nadwyżka produkcji z naszej bazy oraz sprawdzone zapasy fabryczne partnerów'
  - 50+ obsługiwanych krajów, 99,3% przebiegu kontroli końcowej, SUP 2-letnia gwarancja
story_section:
  tagline: Nasza historia
  title: Dlaczego sprzedajemy nadwyżki
  paragraphs:
    - Paddle Board Overstock powstała w 2012 roku w Weihai w Chinach — nadmorskim mieście w prowincji Shandong, które rozwinęło się w jedno z najważniejszych na świecie centrów produkcji nadmuchiwanych płyt. SUP Na tej podstawie spędziliśmy ponad dekadę na produkcji dmuchanych desków paddle board i wysyłaniu ich na cały świat.
    - Along the way we noticed something that shapes everything we do today: Każdy sezon produkcyjny zostawia po sobie zupełnie nowe, idealnie dobre deski — nadwyżki serii, anulowane zamówienia, kolorystykę z poprzedniego sezonu. Tymczasem niezależni detaliści na całym świecie byli wykluczeni z hurtowni, ponieważ tradycyjni dostawcy wymagali zamówień w rozmiarze pojemnika.
    - Ta luka to nasz biznes. Sprzedając zapasy nadmiarowe — nadwyżkę produkcji z naszej własnej bazy Weihai oraz starannie dobrane zapasy z fabryk partnerskich — możemy oferować zupełnie nowe deski w cenach znacznie niższych niż typowe dla detalicznych, w ilościach odpowiadających pojedynczemu wiosłakowi lub zamówieniu pięciu desk. Nic nie jest używane z drugiej ręki, nic nie jest drugim; to po prostu zapasy zasługują na klienta, a nie na magazyn.
model_section:
  tagline: Nasz model biznesowy
  title: Jak działa model Overstock
  items:
    - title: Nowiutkie, nigdy nie używane
      description: Każda deska, którą sprzedajemy, jest zupełnie nowa i nieużywana. Nadmiar oznacza nadmiar i nadmiar zapasów — nie zwroty, nie odnowienia, nie sekundy.
    - title: Zapasy mieszanych źródeł
      description: Nasze zapasy łączą nadwyżkę produkcji z naszej własnej bazy produkcyjnej Weihai z zapasami wybranymi z fabryk partnerskich, które trzymamy na tym samym poziomie jakości. Źródła są mieszane; standardy nie.
    - title: Ceny poniżej ceny detalicznej
      description: Nadmiar towarów kosztuje nas mniej do zdobycia, więc kosztuje cię mniej zakup. Brak zawyżonej ceny katalogowej, brak fałszywych rabatów — tylko uczciwe ceny prawdziwych zapasów.
    - title: Hurtownia przyjazna małym firmom
      description: Hurtowa zaczyna się od 5 płyt, nie od kontenerów. Mali detaliści mogą mieszać dowolne modele dostępne w jednym zamówieniu i wybierać ekspresowe lub morskie.
    - title: Wysyłka bezpośrednio do Ciebie
      description: Zamówienia wysyłane są bezpośrednio z naszej bazy logistycznej Weihai pod Twoje drzwi w 50+ krajach — ekspresowo na próbki i małe zamówienia, skonsolidowany transport morski na hurtowość.
quality_section:
  tagline: Jakość i gwarancja
  title: Jakość każdej deski
  subtitle: Ceny nadmiaru nigdy nie oznaczają luźnych standardów. Każda deska — niezależnie od źródła — przechodzi ten sam proces przed wysyłką.
  items:
    - title: 100% testowane ciśnieniowo
      description: Każda pojedyncza deska jest napompowana i testowana ciśnieniowo do 15 PSI przed wysyłką. Żadna deska nie opuszcza magazynu bez testu, niezależnie od pochodzenia jej zapasów.
    - title: Test przeciążeniowy do 1,25x
      description: Deski z naszych serii produkcyjnych są testowane próbkowo przy ciśnieniu wyższym niż nominalne — utrzymywane przy 1,25x ciśnienia roboczego przez 24–48 godzin, aby zweryfikować szwy, zawory i konstrukcję drop-stitch.
    - title: 99,3% wskaźnik zdawalności końcowej kontroli
      description: Nasz proces końcowej kontroli jakości zalicza 99,3% desek jako wolne od wad — a niewielka część, która nie przechodzi testu, nigdy nie trafia do naszego nadmiarowego stanu magazynowego.
    - title: 2-letnia SUP gwarancja
      description: Każda deska SUP posiada 2-letnią SUP gwarancję obejmującą wady produkcyjne. Ta sama gwarancja dotyczy każdego klienta na wszystkich naszych 50+ rynkach.
