tests:
  - title: Próba ciśnieniowa
    standard: Specyfikacja wewnętrzna AF-PT-001
    description: Nadmuchiwane komory są poddawane działaniu ciśnienia 1,25x zalecanego limitu roboczego i utrzymywane przez 30 minut. Mierzy się spadek ciśnienia w celu sprawdzenia szczelności i integralności strukturalnej materiałów i szwów.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Testowanie udarności
    standard: Specyfikacja wewnętrzna AF-IT-002
    description: Produkty poddawane są kontrolowanym uderzeniom ze standardowych ciężarków i urządzeń wahadłowych. Ocenia odporność na przebicie, propagację rozdarcia i odporność konstrukcji na zderzenia z przeszkodami, dokami i gruzem.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: Testowanie odporności na promieniowanie UV
    standard: Wewnętrzny protokół testowy
    description: Próbki materiałów poddaje się działaniu lamp UVA-340 w komorach przyspieszonego starzenia przez ponad 1000 godzin. Mierzymy zmianę koloru (Delta E), zachowanie połysku i utratę wytrzymałości na rozciąganie, aby zweryfikować pakiety stabilizatorów UV.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Badanie odporności na ścieranie
    standard: Wewnętrzny protokół testowy
    description: Próbki materiałów poddawane są ścierniwom CS-10 pod obciążeniem 500g/1000g przez 1000 cykli. Ubytek masy i wizualny stopień zużycia określają odporność powłoki na piasek, żwir i wielokrotne wystrzeliwanie.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Testowanie wydajności w niskich temperaturach
    standard: Specyfikacja wewnętrzna AF-LT-003
    description: Zmontowane produkty i próbki materiałów są poddawane kondycjonowaniu w temperaturach -20°C, -10°C i 0°C przez 24 godziny, a następnie poddawane testom giętkości. Sprawdzamy, czy PVC pozostaje elastyczny bez pękania lub delaminacji.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Testowanie pływalności i nośności
    standard: Wewnętrzny protokół testowy
    description: Produkty są ładowane przyrostowo do pojemności znamionowej 1,25x w kontrolowanej puli. Rejestrowana jest wolna burta, stabilność i wydajność samoodpływu. Nośność znamionowa każdego modelu jest weryfikowana matematycznie i empirycznie.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-2.webp
  - title: Testowanie zwrotności
    standard: Specyfikacja wewnętrzna AF-MT-004
    description: Próby na wodzie mierzą promień skrętu, przyspieszenie, czas ślizgu i reakcję łopatki/silnika w różnych warunkach obciążenia. Właściwości jezdne w świecie rzeczywistym są sprawdzane pod kątem celów projektowych.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Testowanie wodoszczelności
    standard: Specyfikacja wewnętrzna AF-WT-005
    description: Każdy zmontowany produkt jest testowany natryskowo pod ciśnieniem 0,5 bara na wszystkich szwach, zaworach i złączkach. 5-minutowy test zanurzenia pod ciśnieniem potwierdza wodoszczelność komory i zaworu. Standard zerowych wycieków przed wysyłką.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
