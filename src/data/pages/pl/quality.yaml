  quote: Deska dotarła z zapisami testów, które naprawdę mogłem przeczytać — numer partii, log testu ciśnienia i wszystko inne. Po trzech sezonach intensywnego użytkowania nadal trzyma powietrze jak pierwszego dnia.
  author: Tom Reilly
  title: Zweryfikowany kupujący
  company: Weekendowy wioślarz
  location: Irlandia
