hero_text:
  tagline: Uzyskaj wycenę
  title: Poproś o wycenę<br />swojego projektu
  subtitle: Opowiedz nam o swoich wymaganiach, a nasz zespół prześle szczegółową ofertę w ciągu 2 dni roboczych.
steps2_process:
  title: Jak to działa
  subtitle: Cztery proste kroki od zapytania do wyceny.
  items:
    - title: 'Krok 1: Prześlij swoje wymagania'
      description: Wypełnij poniższy formularz, podając rodzaj produktu, ilość i specyfikacje. Im więcej szczegółów podasz, tym dokładniejsza będzie Twoja oferta.
      icon: tabler:file-text
    - title: 'Krok 2: Sprawdzamy i doradzamy'
      description: Nasz zespół inżynierów sprawdzi Twoje wymagania i może skontaktować się z Tobą w celu wyjaśnienia. Zapewniamy zalecenia dotyczące konfiguracji i opcji produktu.
      icon: tabler:users
    - title: 'Krok 3: Otrzymaj wycenę'
      description: Otrzymasz szczegółową ofertę obejmującą cenę jednostkową, MOQ, czas realizacji, warunki płatności i opcje wysyłki. Zwykle w ciągu 48 godzin.
      icon: tabler:currency-dollar
    - title: 'Krok 4: Próbka i produkcja'
      description: Po akceptacji wyceny przystępujemy do produkcji próbnej (jeśli dotyczy) lub bezpośrednio do produkcji masowej. Regularne aktualizacje w trakcie całego procesu.
      icon: tabler:building-factory
content_form:
  tagline: Formularz wyceny
  title: Opowiedz nam o swoim projekcie
  subtitle: Wszystkie pola oznaczone * są wymagane.
  fields:
    - name: Kategoria produktu
      type: wybierać
      options:
        - Łódź RIB
        - Łódź pneumatyczna
        - Deska SUP
        - Kajak pneumatyczny
        - Kamizelka ratunkowa
        - Akcesorium morskie
        - OEM/ODM na zamówienie
    - name: Aplikacja
      type: wybierać
      options:
        - Centrum nurkowe
        - Wędkarstwo
        - Turystyka morska / Resort
        - Poszukiwanie i ratownictwo
        - Tender jachtowy
        - Komercyjna łódź robocza
        - Rządowe / Wojskowe
        - OEM / Marka własna
        - Osobiste / Rekreacyjne
        - Inne
    - name: Ilość
      type: tekst
      placeholder: np. 50 jednostek
    - name: Rynek docelowy
      type: tekst
      placeholder: np. Europa, Ameryka Północna, Bliski Wschód
    - name: Kraj dostawy
      type: tekst
      placeholder: np. Włochy, Zjednoczone Emiraty Arabskie, USA, Australia
    - name: Preferencje materialne
      type: wybierać
      options:
        - Bez preferencji
        - PVC klasy morskiej (1100 dtex)
        - Hypalon premium / CSM
        - Kadłub z włókna szklanego
        - Kadłub aluminiowy
    - name: Wymagania dotyczące silnika
      type: tekst
      placeholder: np. Silnik zaburtowy 60 KM, bez silnika, bliźniak 115 KM
    - name: Wymagane dostosowanie
      type: tekst
      placeholder: np. niestandardowe kolory, branding/logo, opakowanie, specjalne wyposażenie
    - name: Oś czasu
      type: tekst
      placeholder: np. dostawa w ciągu 90 dni
    - name: Dodatkowe wymagania
      type: obszar tekstowy
      placeholder: Opisz swoją aplikację, specyfikacje techniczne lub wszelkie wymagania specjalne — dołącz rysunki referencyjne, specyfikacje lub łącza, jeśli są dostępne
    - name: Prześlij specyfikację
      type: plik
      placeholder: Prześlij arkusz specyfikacji, rysunek lub dokument referencyjny (PDF, DWG, DXF)
    - name: Prześlij logo/grafikę
      type: plik
      placeholder: Prześlij swoje logo lub grafikę do niestandardowego brandingu (AI, EPS, PNG)
content_rfq_types:
  tagline: Trójpoziomowy system zapytań ofertowych
  title: Wybierz właściwy<br />poziom zapytania
  subtitle: Różne projekty wymagają różnych poziomów szczegółowości. Wybierz formularz pasujący do Twojego etapu zakupu.
  items:
    - title: Szybkie zapytanie
      description: 5-6 pól, 30 sekund. Do pierwszego kontaktu, pytań ogólnych lub dalszych działań związanych z pobieraniem zasobów. Odpowiadamy w ciągu 24 godzin, przekazując podstawowe informacje i dalsze kroki.
      icon: tabler:bolt
    - title: Standardowe zapytanie ofertowe
      description: 8-10 pól, 2 minuty. Aby uzyskać szczegółowe oferty produktów z wyborem modelu, ilością i wymaganiami dotyczącymi dostawy. Otrzymaj szczegółową ofertę w ciągu 48 godzin.
      icon: tabler:file-text
    - title: Zapytanie ofertowe projektu
      description: 10-14 pól, 5 minut. Do projektów RIB, floty kurortów, projektów ratowniczych lub rządowych wymagających niestandardowej konfiguracji, dokumentacji zgodności i wieloletniego planowania dostaw. Przydzielony dedykowany kierownik projektu.
      icon: tabler:clipboard-list
form_quick:
  title: Szybkie zapytanie
  subtitle: Szybki kontakt w przypadku pytań ogólnych i wniosków o wstępne informacje.
  fields:
    - name: pełne imię i nazwisko
      label: Pełne imię i nazwisko
      type: tekst
      required: true
      placeholder: Twoje pełne imię i nazwisko
    - name: biznesowy e-mail
      label: Biznesowy e-mail
      type: e-mail
      required: true
      placeholder: ty@firma.com
    - name: Nazwa firmy
      label: Nazwa firmy
      type: tekst
      required: true
      placeholder: Twoja firma
    - name: Typ kupującego
      label: jestem...
      type: wybierać
      required: true
      options:
        - Dystrybutor / Importer
        - Właściciel marki / Marka własna
        - Resort / Centrum wodne
        - Operator wypożyczalni
        - Rząd / Agencja ratownicza
        - Operator nurkowania / wędkarstwa
        - Inżynier morski / refit
        - Inne
    - name: produktZainteresowanie
      label: Zainteresowanie produktem
      type: wybór wielokrotny
      required: true
      options:
        - Łodzie RIB
        - Łodzie pneumatyczne
        - Deski SUP
        - Sprzęt bezpieczeństwa
        - Akcesoria
        - OEM/ODM na zamówienie
    - name: wiadomość
      label: Czego potrzebujesz?
      type: obszar tekstowy
      required: false
      placeholder: Krótki opis Twoich wymagań...
form_standard:
  title: Standardowe zapytanie ofertowe
  subtitle: Szczegółowe zapytanie ofertowe na konkretne produkty i ilości.
  fields:
    - name: pełne imię i nazwisko
      label: Pełne imię i nazwisko
      type: tekst
      required: true
    - name: biznesowy e-mail
      label: Biznesowy e-mail
      type: e-mail
      required: true
    - name: Nazwa firmy
      label: Nazwa firmy
      type: tekst
      required: true
    - name: Typ kupującego
      label: Typ kupującego
      type: wybierać
      required: true
    - name: Model produktu
      label: Model/typ produktu
      type: tekst
      required: true
      placeholder: np. AF580 RIB, AF380 nadmuchiwany
    - name: ilość
      label: Szacowana ilość
      type: tekst
      required: true
      placeholder: np. 10–20 jednostek
    - name: rynek docelowy
      label: Rynek docelowy/region
      type: tekst
      required: true
      placeholder: np. UE, Ameryka Północna, Bliski Wschód
    - name: Termin dostawy
      label: Pożądana dostawa
      type: wybierać
      required: true
      options:
        - W ciągu 30 dni
        - 30-60 dni
        - 60-90 dni
        - Planowanie z wyprzedzeniem (90+ dni)
        - Na razie tylko sprawdzam
    - name: zgodnośćWymagane
      label: Wymagania dotyczące zgodności
      type: wybór wielokrotny
      required: false
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - USCG
        - ISO 9001
        - BSCI
        - REACH
        - Brak / Nie jestem pewien
    - name: wiadomość
      label: Dodatkowe szczegóły
      type: obszar tekstowy
      required: false
form_project:
  title: Zapytanie ofertowe projektu
  subtitle: Kompleksowe zapytanie projektowe dotyczące zamówień flotowych, niestandardowych lub rządowych.
  fields:
    - name: pełne imię i nazwisko
      label: Pełne imię i nazwisko
      type: tekst
      required: true
    - name: biznesowy e-mail
      label: Biznesowy e-mail
      type: e-mail
      required: true
    - name: Nazwa firmy
      label: Nazwa firmy
      type: tekst
      required: true
    - name: Typ kupującego
      label: Typ kupującego
      type: wybierać
      required: true
    - name: Typ projektu
      label: Typ projektu
      type: wybierać
      required: true
      options:
        - Flota resortu / hotelu
        - Flota wypożyczalni
        - Flota ratownicza / patrolowa
        - Flota centrum nurkowego
        - Zamówienia publiczne
        - Marka własna / OEM
        - Zamówienie magazynowe dealera
        - Inne
    - name: Typy łodzi
      label: Wymagane typy łodzi
      type: wybór wielokrotny
      required: true
      options:
        - Łodzie RIB
        - Łodzie pneumatyczne / dinghy
        - Deski SUP
        - Kajaki
        - Sprzęt bezpieczeństwa
    - name: Rozmiar floty
      label: Wielkość floty/zakres ilościowy
      type: tekst
      required: true
      placeholder: np. 20–50 jednostek w ciągu 12 miesięcy
    - name: Wymagania niestandardowe
      label: Niestandardowe potrzeby konfiguracyjne
      type: obszar tekstowy
      required: false
      placeholder: Rozmiar kadłuba, materiał rur, układ pokładu, wymagania dotyczące marki...
    - name: zgodnośćWymagane
      label: Wymagania dotyczące zgodności i certyfikacji
      type: wybór wielokrotny
      required: true
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - USCG Type III/V
        - ISO 9001
        - BSCI
        - REACH / RoHS
        - Certyfikacja lokalnego rynku
    - name: rynek docelowy
      label: Rynek docelowy
      type: tekst
      required: true
    - name: budżetZakres
      label: Zakres budżetu
      type: wybierać
      required: false
      options:
        - Poniżej $10,000
        - $10,000 - $50,000
        - $50,000 - $200,000
        - $200,000+
        - Wolę nie podawać
    - name: Termin dostawy
      label: Harmonogram projektu
      type: wybierać
      required: true
      options:
        - Pilne (w ciągu 30 dni)
        - Standard (30-60 dni)
        - Zaplanowane (60-90 dni)
        - Plany na przyszłość (90+ dni)
    - name: wiadomość
      label: Szczegóły projektu i wymagania
      type: obszar tekstowy
      required: false
      placeholder: Opisz swój projekt, aplikację i wszelkie specyficzne wymagania...
cta:
  title: Wolisz rozmawiać przez e-mail?
  subtitle: Wyślij zapytanie bezpośrednio do naszego zespołu sprzedaży, a my odpowiemy w ciągu 24 godzin.
  actions:
    - variant: primary
      text: Napisz do nas bezpośrednio
      href: /contact
