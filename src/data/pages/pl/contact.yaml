hero_text:
  tagline: Kontakt
  title: SKONTAKTUJ SIĘ Z NAMI
contact_form:
  id: form
  title: Wyślij nam wiadomość
  subtitle: W sprawach związanych z zamówieniami, poradami dotyczącymi rozmiaru lub wsparciem dotyczącym produktu, napisz do nas. Odpowiadamy w ciągu jednego dnia roboczego.
  email_to: info@paddleboardoverstock.com
  submit_button: Wyślij zapytanie → Uzyskaj wycenę
  success_message: Dziękujemy! Twoja wiadomość trafiła do naszej skrzynki odbiorczej. Odpowiemy w ciągu jednego dnia roboczego.
  error_message: Coś poszło nie tak podczas wysyłania wiadomości. Spróbuj ponownie lub wyślij do nas e-mail bezpośrednio.
  default_country_code: '+1'
  captcha:
    label: 'Ochrona przed spamem: proszę rozwiązać poniższe'
  fields:
    - name: Imię
      label: Imię
      row: 1
    - name: Nazwisko
      label: Nazwisko
      row: 1
    - name: Nazwa firmy
      label: Nazwa firmy
      row: 2
    - name: address
      label: Adres
      row: 3
    - name: zip
      label: Kod pocztowy
      row: 4
    - name: country
      label: Kraj
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: Wielkość zamówienia
      label: Szacowana ilość zamówienia
      row: 6
      type: select
      options:
        - value: ''
          label: Ile desek chcesz zamówić?...
        - value: one
          label: Tylko jedna deska
        - value: 2-4
          label: 2–4 deski
        - value: 5-plus
          label: 5+ desek (dla rodziny, klubu lub wynajmu)
    - name: customization
      label: W czym możemy pomóc?
      row: 7
      type: select
      options:
        - value: ''
          label: Wybierz temat...
        - value: none
          label: Ogólne pytanie o produkt
        - value: sizing
          label: Pomoc w wyborze odpowiedniej deski
        - value: order
          label: Zamówienie, płatność lub wysyłka
        - value: warranty
          label: Wsparcie gwarancyjne lub naprawcze
    - name: produktZainteresowanie
      label: Kategorie produktów, które Cię interesują
      row: 8
      type: select
      options:
        - value: ''
          label: Wybierz kategorię produktu...
        - value: all
          label: Wszystkie produkty / Pełny katalog
        - value: sup
          label: SUP Deski / Paddleboardy
        - value: packages
          label: Kompletne pakiety SUP
        - value: accessory
          label: Akcesoria (pompki, wiosła, torby)
    - name: subject
      label: Temat
      row: 9
    - name: message
      label: Wiadomość
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Inne sposoby kontaktu z nami
  columns: 3
  items:
    - title: Pomoc w zamówieniu
      description: Pytania o produkty, porady dotyczące rozmiarów i wsparcie przy zamówieniach.
      icon: tabler:shopping-bag
    - title: Wsparcie techniczne
      description: Gwarancja, naprawy, części zamienne i pytania dotyczące obsługi.
      icon: tabler:tool
    - title: Prasa i partnerstwa
      description: Materiały dla mediów, sponsoring i współpraca w branży.
      icon: tabler:news
    - title: Telefon
      description: +1 279 732 3333 (centrala USA) · +86 13305324192 (fabryka)
      icon: tabler:headset
    - title: Email
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Centrala i fakturowanie globalne
      description: Weihai Dongjilian Co., Ltd.
      icon: tabler:map-pin
map:
  title: Nasza lokalizacja
  subtitle: Odwiedź nasz zakład produkcyjny w Weihai
  address: Weihai, Shandong, Chiny
  zoom: 15
