headline: Paddle Board Overstock Gwarancja ograniczona producenta
subtitle: Paddle Board Overstock stoi za jakością SUP każdej nadmuchiwanej deski, którą produkujemy. Ta Ograniczona Gwarancja określa warunki i zakres ochrony Paddle Board Overstock Twojej deski.
seo:
  headline: Paddle Board Overstock SUP Gwarancja — 2-letnia ograniczona gwarancja | Paddle Board Overstock
  description: Paddle Board Overstock Oferuje 2-letnią ograniczoną gwarancję drop-stitch obejmującą szwy, konstrukcję szyny, zawory do napompowania oraz dołączone akcesoria na SUP każdej desce. Pełne warunki i zasady.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Ta Ograniczona Gwarancja dotyczy nowych Paddle Board Overstock , SUP markowych nadmuchiwanych desek zakupionych bezpośrednio w Paddle Board Overstock sklepie internetowym. Data wejścia w życie to weryfikowalna data pierwotnego zakupu.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Zakres gwarancji i czas trwania</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 lata</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch Struktura rdzenia i pokładu</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 lata</h3>
          <p class="text-sm text-gray-600 mt-1">Budowa szyn i pokładów</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 lata</h3>
          <p class="text-sm text-gray-600 mt-1">Funkcjonalność zaworu nadmuchującego</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 lata</h3>
          <p class="text-sm text-gray-600 mt-1">Dołączone akcesoria (pompa, wiosło, smycz, płetwa)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 rok*</h3>
          <p class="text-sm text-gray-600 mt-1">Użytkowanie komercyjne, wynajmowane lub flotowe — wszystkie komponenty</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Użytkowanie komercyjne, wypożyczalnie lub flotowe skraca gwarancję do 1 roku. Użycie w wyścigach lub zawodach całkowicie unieważnia gwarancję.</p>
    </div>

    <h2>Co jest objęte</h2>
    <h3>Drop-Stitch Struktura rdzenia i talii (2 lata)</h3>
    <p>drop-stitch Wewnętrzny rdzeń i zewnętrzna struktura płyty są zabezpieczone przed wadami produkcyjnymi, które ograniczają zdolność zarządu do utrzymania nadmiękowania i sztywności operacyjnej.</p>

    <h3>Budowa kolej i pokładów (2 lata)</h3>
    <p>Szwy i potrójne warstwowe taśmy szynowe, jeśli są łączone podczas produkcji, są zabezpieczone przed wadami produkcyjnymi powodującymi znaczne przecieki powietrza przez szw. Okresowe inspekcje i utrzymanie odpowiednich ciśnień nadmuchujących to warunki zabezpieczenia.</p>

    <h3>Funkcjonalność zaworu nadmuchującego (2 lata)</h3>
    <p>Zawory pompujące powietrze pierwotnie zainstalowane Paddle Board Overstock są zabezpieczone przed wadami produkcyjnymi w materiałach lub wykonaniu, które uniemożliwiają zawórowi zatrzymanie powietrza zgodnie z przeznaczeniem.</p>

    <h3>Dodatki dołączone (2 lata)</h3>
    <p>Pompa, regulowana wiosło, smycz, zdejmowana żebra i inne elementy dołączone do zestawu deski są zabezpieczone przed wadami materiałowymi i wykonanymi.</p>

    <h2>Co nie jest objęte</h2>
    <ul>
      <li>Wady kosmetyczne, takie jak przebarwienia, przebarwienia, blaknięcie, malowanie kredą lub jakiekolwiek zmiany wyglądu</li>
      <li>Przebite, skaleczenia, rozdarcia, rozdarcia lub inne uszkodzenia fizyczne</li>
      <li>Zgniatanie, pękanie, ścieranie, zatarcie lub degradacja spowodowana tarciem lub kontaktem</li>
      <li>Degradacja spowodowana UV ekspozycją na światło, warunki atmosferyczne lub atmosferyczne</li>
      <li>Uszkodzenia spowodowane kontakcią z rozpuszczalnikami, kwasami, zasadami lub chemikaliami</li>
      <li>Uszkodzenia spowodowane zaniedbaniem, niewłaściwym użytkowaniem, nadużyciami, wypadkiem lub normalnym zużyciem</li>
      <li>Uszkodzenia spowodowane uderzeniem, naprężeniem, niewłaściwym podparciem lub transportem</li>
      <li>Szkody spowodowane nieprawidłową inflacją/deflacją lub użyciem niezatwierdzonych urządzeń do inflacji</li>
      <li>Sprzęt, komponenty lub systemy firm trzecich (objęte przez ich producentów)</li>
    </ul>

    <h2>Odpowiedzialność producenta i środki zaradcze</h2>
    <p>Paddle Board Overstock Wyłącznym i wyłącznym obowiązkiem jest naprawa lub wymiana Paddle Board Overstock dowolnego komponentu uznanego za wadliwy materiałowy lub wykonany i objęty niską gwarancją. Naprawy lub wymiany wykonuje Paddle Board Overstock lub wyznaczone przez jego miejsce serwisowe. Komponenty naprawione lub wymienione są gwarantowane tylko na niewygasłą część pierwotnego okresu gwarancji.</p>

    <h2>Warunki gwarancji</h2>
    <ul>
      <li><strong>Konserwacja:</strong>Produkt musi być konserwowany zgodnie z Paddle Board Overstock opublikowanymi wytycznymi firmy, w tym okresowymi inspekcjami i utrzymaniem odpowiednich ciśnień inflacyjnych.</li>
      <li><strong>Współpraca:</strong>Kupujący musi w pełni i niezawodnie współpracować Paddle Board Overstock we wszystkich sprawach związanych z roszczeniami gwarancyjnymi.</li>
      <li><strong>Pierwotny nabywca:</strong>Gwarancja ta jest udzielana wyłącznie pierwotnemu użytkownikowi końcowemu i nie jest przenoszona.</li>
    </ul>

    <h2>Zastosowanie komercyjne</h2>
    <p>Jeśli produkt jest używany do celów komercyjnych, wypożyczalniowych lub flotowych, okres gwarancji na wszystkie komponenty skraca się do jednego (1) roku od pierwotnej daty zakupu. Użycie w wyścigach, wyścigach prędkości lub wytrzymałościowych natychmiast i nieodwracalnie unieważnia gwarancję całkowicie.</p>

    <h2>Jak zgłosić reklamację gwarancyjną</h2>
    <p>Skontaktuj Paddle Board Overstock się z dowodem zakupu oraz szczegółowym opisem problemu.Paddle Board Overstock Przeanalizujemy zgłoszenie oraz przekażę instrukcje dotyczące inspekcji i serwisu.</p>
    <p>W przypadku zapytań dotyczących serwisu gwarancyjnego prosimy o kontakt przez nasz<a href="/contact" class="text-sky-600 underline">Strona kontaktowa</a>Z numerem zamówienia i szczegółami produktu.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Niniejsze oświadczenie gwarancyjne jest podsumowaniem pełnej Paddle Board Overstock gwarancji ograniczonej producenta. Pełny dokument gwarancyjny reguluje wszystkie warunki gwarancji. Specyfikacje mogą ulec zmianie bez uprzedzenia.Paddle Board Overstock jest marką fabryjną Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
