faq:
  title: Często zadawane pytania dotyczące pakietu
  questions:
    - q: Jaka jest minimalna wielkość zamówienia paczek?
      a: Pakiet Startowy Klubu obejmuje minimum 10 jednostek. Pakiety Resort i Brand są dostosowywane do Twoich potrzeb dzięki elastycznym MOQ.
    - q: Jak długo trwa dostawa?
      a: Standardowa produkcja wynosi 30–45 dni od potwierdzenia zamówienia. Przyspieszona produkcja jest dostępna za dodatkową opłatą.
    - q: Czy mogę dostosować kolory i branding sprzętu?
      a: Tak. Wszystkie pakiety obejmują pełną personalizację — kolory tektury, nadruki logo i projekty opakowań.
    - q: Czy zapewniacie wsparcie posprzedażowe?
      a: Tak. Każdy pakiet obejmuje dostęp do naszych internetowych przewodników konserwacyjnych, samouczków wideo i systemu zamawiania części zamiennych.
