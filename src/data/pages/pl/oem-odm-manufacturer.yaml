      variant: standard
process_section:
  eyebrow: Nasz proces
  title: Kompleksowy przepływ pracy OEM/ODM
  subtitle: Od briefu projektowego do załadunku kontenera — sześć kroków do Twojej dmuchanej łodzi pod własną marką.
  steps:
    - step: '01'
      title: Specyfikacja i brief projektowy
      desc: Prześlij docelowe specyfikacje, rysunki CAD lub produkt referencyjny. Nasz zespół inżynieryjny analizuje materiały, wymiary i wymagania zgodności (CE, BSCI) przed wyceną.
    - step: '02'
      title: Prototypowanie form 3D
      desc: Projektujemy i obrabiamy na obrabiarkach CNC niestandardowe formy do boardów SUP, kadłubów kajaków i komponentów RIB. Próbki prototypowe produkujemy w ciągu 15-20 dni roboczych do Twojej akceptacji.
    - step: '03'
      title: Wybór materiałów i produkcja próbek
      desc: Wybierz spośród PVC klasy militarnej (0,9-1,2 mm), Hypalonu CSM lub tkanin z rdzeniem drop-stitch. Produkujemy próbki przedprodukcyjne w kolorach Twojej marki, z logo i opakowaniem do zatwierdzenia.
    - step: '04'
      title: Audyt fabryczny CE i zgodność
      desc: Każde zamówienie OEM obejmuje dokumentację zgodności — deklarację zgodności CE, zapisy identyfikowalności ISO 9001, raport zgodności społecznej BSCI i deklaracje materiałowe REACH.
    - step: '05'
      title: Produkcja seryjna i kontrola inline
      desc: Partie produkcyjne przechodzą naszą 100-punktową listę kontrolną jakości. Każda sztuka przechodzi 24-godzinne testy utrzymania ciśnienia, testy odporności szwów na odrywanie i inspekcję wizualną przed pakowaniem.
    - step: '06'
      title: Logistyka FOB Qingdao i wysyłka
      desc: Gotowe produkty są paletyzowane, foliowane i ładowane do kontenerów w porcie Qingdao. Załatwiamy całą dokumentację eksportową, odprawę celną i zapewniamy śledzenie przesyłek w czasie rzeczywistym.
capabilities_section:
  eyebrow: Możliwości produkcyjne
  title: Co produkujemy
  subtitle: Sześć kluczowych kompetencji produkcyjnych dla globalnych partnerów B2B.
  items:
    - title: Produkcja boardów SUP drop-stitch
      desc: Laminowanie rdzenia drop-stitch na całej długości dla sztywnych boardów do paddleboardingu o wysokim ciśnieniu (15-20 PSI). Niestandardowa długość, szerokość, grubość, profil rocker i projekt graficzny.
    - title: Produkcja łodzi dmuchanych z PVC
      desc: Sztywy, tendery i łodzie sportowe z PVC spawane wysokoczęstotliwościowo. Wiele konfiguracji komór, opcje podłogi (listwy, pomost dmuchany, zwijana) i integracja akcesoriów.
    - title: Fabrykacja łodzi RIB z Hypalonu
      desc: Komercyjne komory z Hypalonu CSM klejone do kadłubów z włókna szklanego lub aluminium o głębokim V. Długości od 3,3 m do 6,0 m dla operacji patrolowych, ratowniczych, turystycznych i nurkowych.
    - title: Private label i niestandardowy branding
      desc: 'Pełna usługa private label: logo metodą termotransferu lub sitodruku, opakowania z marką (pudełka detaliczne, torby transportowe), instrukcje w Twoim języku i rejestracja kodów kreskowych/UPC.'
    - title: Projektowanie form i oprzyrządowania
      desc: Wewnętrzny zespół inżynierów 3D CAD/CAM. Projektujemy i wykonujemy niestandardowe formy aluminiowe i kompozytowe dla unikalnych kształtów kadłubów, konfiguracji pokładu i punktów montażu akcesoriów.
    - title: Akcesoria OEM i kitting
      desc: Kamizelki ratunkowe (CE 12402), pompy dwutłoczkowe, wiosła karbonowe/nylonowe, zestawy naprawcze, torby transportowe i leash. Pełny kitting i pakowanie w zestawy dla prezentacji gotowej do sprzedaży.
experience_section:
  eyebrow: Doświadczenie w praktyce
  title: Partnerstwa, które zbudowały marki
  subtitle: Prawdziwe historie marek i organizacji, które wybrały Paddle Board Overstock do produkcji OEM/ODM.
  stories:
    - quote: Przyszliśmy do Paddle Board Overstock ze szkicem na serwetce i listą wymagań. Osiem miesięcy później mieliśmy produkt gotowy do produkcji, który przeszedł certyfikację CE za pierwszym podejściem.
      narrative: Europejski startup z nowatorskim projektem SUP zwrócił się do Paddle Board Overstock o produkcję ODM. Zespół R&D Paddle Board Overstock przeprowadził koncepcję przez projektowanie CAD, analizę strukturalną FEA, symulację hydrodynamiczną, stworzenie formy, wykonanie prototypu i oprzyrządowanie produkcyjne. Założyciel startupu trzykrotnie odwiedził Qingdao podczas procesu. Finalny produkt przeszedł certyfikację CE bez żadnych modyfikacji — wynik, który założyciel przypisuje temu, że zespół inżynieryjny Paddle Board Overstock od początku rozumiał europejskie wymogi regulacyjne.
      context: Premiera europejskiej marki SUP, 2023-2024
      source: Założyciel marki
    - quote: Poziom ochrony NDA i bezpieczeństwa IP w Paddle Board Overstock daje nam pewność, że możemy dzielić się naszymi zastrzeżonymi projektami. Traktują naszą własność intelektualną jak swoją.
      narrative: Amerykańska firma sprzętu morskiego z zastrzeżoną technologią zaworów potrzebowała partnera produkcyjnego, który chroniłby jej IP przy produkcji na dużą skalę. Po audycie pięciu chińskich producentów wybrała Paddle Board Overstock ze względu na protokoły ochrony IP fabryki, bezpieczną obsługę plików projektowych i gotowość do podpisania rygorystycznych NDA. Partnerstwo przyniosło trzy linie produktów w cztery lata bez żadnego incydentu związanego z IP.
      context: Amerykańska firma sprzętu morskiego, partnerstwo OEM od 2021
      source: Wiceprezes ds. operacyjnych
