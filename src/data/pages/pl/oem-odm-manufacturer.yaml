breadcrumb: Producent OEM/ODM
tldr:
  summary: Paddle Board Overstock to producent OEM/ODM działający bezpośrednio z fabryki. Zakład o powierzchni 12 000 m² z certyfikatem ISO 9001:2015, roczna produkcja 15 000 sztuk, zgodność CE/BSCI/REACH/UKCA, niskie MOQ od 2-10 sztuk.
  points:
    - Zakład w Qingdao o powierzchni 12 000 m² z certyfikatem ISO 9001:2015
    - Roczna moc produkcyjna 15 000 sztuk przy 200-300 wykwalifikowanych pracownikach
    - Zgodność CE 2013/53/EU, UKCA, BSCI, REACH
    - 'Niskie MOQ: 2-5 sztuk (RIB), 5-10 sztuk (SUP) dla modeli standardowych'
    - Eksport do ponad 50 krajów z wysyłką FOB Qingdao
