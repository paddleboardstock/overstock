process_steps:
  title: Proces 6-krokowy OEM/ODM
  subtitle: Od briefu projektowego do FOB Qingdao — usprawniony przepływ pracy
  steps:
    - number: '01'
      title: Specyfikacja projektu i modelowanie 3D w CAD
      description: Podziel się swoimi specyfikacjami, produktem referencyjnym lub koncepcją. Nasz zespół inżynierów opracowuje szczegółowe rysunki CAD i wizualizacje 3D do Twojej akceptacji.
      timeline: 3–5 dni
    - number: '02'
      title: Wybór materiału i testowanie tkanin
      description: Wybierz spośród tkanin wojskowej klasy PVC (0,9–1,2 mm), Hypalon CSM lub drop-stitch rdzeniowych. Przeprowadzamy testy wytrzymałości na rozciąganie, przyczepności powłoki i stabilności UV.
      timeline: 2–3 dni
    - number: '03'
      title: Szybkie prototypowanie i produkcja próbek
      description: Tworzymy CNC-maszynowe formy na zamówienie i produkujemy próbki przedprodukcyjne w kolorach Twojej marki, z logo i określonych materiałów. Próbki wysyłane do Twojej akceptacji.
      timeline: 7–14 dni
    - number: '04'
      title: Test wytrzymałości pod wysokim ciśnieniem przez 24–48 godzin
      description: Każdy prototyp przechodzi rygorystyczne testy utrzymania ciśnienia przy 1,25-krotności nominalnego ciśnienia. Wykonywane są testy odrywania szwów oraz weryfikacja wymiarów.
      timeline: 1–2 dni
    - number: '05'
      title: CE/ISO Kontrola jakości i pakowanie
      description: Lista kontrolna jakości 100 punktów. Każda jednostka jest sprawdzana przed zapakowaniem gotowym do sprzedaży detalicznej. Załączono deklarację zgodności CE oraz raport zgodności BSCI.
      timeline: 2–3 dni
    - number: '06'
      title: Transport i logistyka FOB Qingdao
      description: Gotowe produkty spakowane na paletach, owinięte folią termokurczliwą i załadowane do kontenera w porcie w Qingdao. Pełna dokumentacja eksportowa, odprawa celna i śledzenie w czasie rzeczywistym.
      timeline: 7–14 dni
