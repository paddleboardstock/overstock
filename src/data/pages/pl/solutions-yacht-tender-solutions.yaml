content_challenge:
  tagline: Wyzwanie
  title: Tendery jachtowe wymagają<br />wydajności i prezencji
  subtitle: Tender jachtowy to więcej niż łódka pomocnicza — to przedłużenie jednostki macierzystej i wyznacznik jakości.
  paragraphs:
    - Właściciele i kapitanowie jachtów potrzebują łodzi, które dobrze się sprawdzają, są kompaktowe i pięknie się prezentują. Przetarg powinien uzupełniać estetykę jachtu, zapewniając jednocześnie niezawodny transport gości i załogi.
    - '**Przechowywanie ma kluczowe znaczenie** — Ofertę należy zmieścić na pokładzie, w garażu lub na żurawikach. Waga ma znaczenie dla systemów startu i odzyskiwania. Aquafarer RIB oferują doskonały stosunek mocy do masy przy kompaktowych profilach przechowywania.'
    - '**Oczekiwania dotyczące wydajności są wysokie** — Goście oczekują płynnej i suchej podróży po przeniesieniu na brzeg. Opcje silnika muszą równoważyć prędkość, zasięg i poziom hałasu, aby zapewnić najwyższą jakość. W przypadku operacji czarterowych przetarg kursuje codziennie i musi wytrzymywać częste użytkowanie.'
    - '**Wygląd ma znaczenie** — Niedopasowany lub zużyty materiał pogarsza ogólną prezentację jachtu. Niestandardowe kolory tub, tapicerka i branding sprawiają, że oferta wygląda tak, jak należy.'
content_solution:
  tagline: Nasze rozwiązanie
  title: Konfiguracje przetargowe<br />dla każdego zastosowania jachtowego
  subtitle: Oferty Aquafarer RIB można dostosować do swojego statku, rodzaju operacji i wymagań dotyczących przechowywania — od specyfikacji producenta superjachtów po programy floty czarterowej.
  list:
    - Niestandardowe kolory rur pasujące lub uzupełniające zbiornik macierzysty — dowolny kolor RAL dostępny dla rur Hypalon lub PVC
    - Niestandardowa tapicerka i szwy — najwyższej jakości winyl morski z dopasowanymi kolorami i haftowanym logo
    - Sterowanie za pomocą konsoli lub rumpla — wybierz w oparciu o sposób użytkowania i preferencje operatora
    - Kadłub z włókna szklanego deep-V zapewnia płynną, suchą jazdę w zmiennych warunkach morskich
    - Kompaktowe przechowywanie — opróżnianie lub gniazda do garażu pokładowego, szafki lub miejsca do przechowywania żurawików
    - Rury Hypalon zapewniające odporność na promieniowanie UV i długotrwałe zachowanie wyglądu
    - Punkty podnoszenia i zaczepy holownicze są standardem we wszystkich modelach
    - Opcjonalna osłona dziobu, pełna osłona i osłony ochronne
    - 'Gama silników: 15 HP do 60 HP — konfiguracje z silnikiem zaburtowym lub rumplem'
    - OEM/oznaczenie prywatne dostępne dla konstruktorów jachtów i dealerów morskich
content_segments:
  tagline: Profile klientów
  title: Rozwiązania przetargowe dla jachtów<br />Według typu klienta
  subtitle: Różne segmenty branży jachtowej mają unikalne wymagania. Aquafarer konfiguruje oferty dopasowane do każdego wniosku.
  items:
    - title: Konstruktorzy superjachtów
      subtitle: OEM integracja ofert — niestandardowe wymiary, kolory i materiały
      description: 'Konstruktorzy jachtów stoją przed powtarzającym się wyzwaniem: każdy nowy statek ma unikalne ograniczenia wymiarowe, ograniczenia wagowe i oczekiwania estetyczne. Oferta musi doskonale integrować się z systemem żurawików na statku macierzystym, mieścić się w precyzyjnych wymiarach garażu i pasować do języka projektowania jachtu wartego wiele milionów euro. Wszelkie niedopasowania – niewłaściwy kolor rurki, nieprawidłowe umiejscowienie punktu podnoszenia, niezgodna waga – opóźniają dostawę i źle odbijają się na konstruktorze. Aquafarer współpracuje bezpośrednio z zespołami zaopatrzeniowymi i projektowymi, aby dostarczać oferty z niestandardowymi kolorami rur RAL, dopasowaną tapicerką, markowymi panelami konsoli i pełnymi pakietami dokumentacji OEM.'
      features:
        - Niestandardowe specyfikacje wymiarowe pasujące do ograniczeń garażu i żurawika
        - Dowolny kolor rurki RAL i pasująca tapicerka — dostarczone próbki do zatwierdzenia projektu
        - Logo OEM na konsoli, rurze i oparciach siedzeń
        - Weryfikacja punktu podnoszenia i dopasowania żurawika dla każdego modelu
        - Masa kadłuba zoptymalizowana pod kątem określonych systemów startu i odzyskiwania
        - Harmonogram dostaw masowych zgodny z harmonogramem produkcji
    - title: Firmy zarządzające jachtami
      subtitle: Przetargi ustandaryzowane pod kątem floty — globalne wsparcie, minimalne przestoje
      description: Spółki zarządzające nadzorują wiele jachtów działających na Morzu Śródziemnym, Karaibach, Południowym Pacyfiku i poza nim. Ich podstawową potrzebą jest niezawodność — zerwany przetarg w odległym porcie oznacza nadgodziny załogi, skargi gości i kosztowne wymiany w ostatniej chwili. Standaryzowane specyfikacje floty skracają czas szkolenia załogi na różnych statkach i upraszczają zarządzanie częściami zamiennymi. Aquafarer oferuje ceny floty składającej się z wielu statków, spójne specyfikacje wszystkich zamówień oraz globalne wsparcie w zakresie części zamiennych dla firm zarządzających posiadających statki w wielu regionach.
      features:
        - Standaryzowane specyfikacje dla całej zarządzanej floty
        - Wymienne części zamienne we wszystkich ofertach flotowych
        - Ceny flotowe i rabaty ilościowe w przypadku zamówień obejmujących wiele jednostek
        - Globalna dostępność części zamiennych — szybka wysyłka do dowolnego portu
        - Stała dokumentacja serwisowa i konserwacyjna dla załogi
        - Koordynacja dostaw wielu jednostek do różnych lokalizacji statków
    - title: Operatorzy czarterujący jachty
      subtitle: Codzienne operacje o wysokiej częstotliwości — trwałość bez uszczerbku dla wyglądu
      description: 'Przetargi czarterowe wiążą się z najbardziej rygorystycznym harmonogramem operacyjnym w branży jachtowej: codzienne transfery gości, wycieczki na ląd, wsparcie w zakresie sportów wodnych i przetargi portowe – często ponad 200 operacji w sezonie czarterowym. Oferta musi wyglądać nieskazitelnie przy każdym przekazaniu gościa, a jednocześnie wytrzymać ciągłe wchodzenie na pokład, ekspozycję na słoną wodę i godziny pracy silnika. Pogorszenie wyglądu jest bezpośrednim problemem biznesowym — zużyty przetarg wpływa na recenzje gości i stawki czarterowe. Aquafarer konfiguruje łodzie czarterowe z ulepszoną tapicerką, wytrzymałymi rurami Hypalon i wzmocnionymi obszarami obsługi zapewniającymi długoterminową trwałość, która utrzymuje jakość prezentacji.'
      features:
        - Rury o dużej wytrzymałości Hypalon — żywotność 5-8 lat w codziennej obsłudze czarterowej
        - Wzmocnione stopnie do wsiadania i liny do chwytania przy częstym użyciu
        - Wysokiej jakości, plamoodporna tapicerka winylowa — łatwe czyszczenie między czarterami
        - Łatwe w czyszczeniu, antypoślizgowe powierzchnie tarasu
        - Niezawodne zespoły silników zaburtowych z łatwym dostępem serwisowym zapewniającym szybką obsługę
        - Materiały kosmetyczne, które zachowują wygląd przez cały sezon czarterowy
    - title: Dealerzy i brokerzy jachtów
      subtitle: Niezawodna oferta przetargowa dotycząca kompletacji statków i wartości odsprzedaży
      description: Dealerzy i brokerzy potrzebują stabilnej podaży wysokiej jakości ofert przetargowych, które uzupełniają sprzedawane przez nich statki – dopasowując się do pozycjonowania marki i poprawiając doświadczenia kupujących. Niespójna oferta lub opóźnienie w dostawie może opóźnić przekazanie jachtu lub pogorszyć prezentację oferty. Dealerzy wymagają stałej jakości we wszystkich partiach, niezawodnych terminów realizacji i konkurencyjnych cen, aby utrzymać marże. Aquafarer oferuje programy inwentaryzacji dealerów z harmonogramem dostaw sezonowych, opcjami co-brandingu do ekspozycji w salonie i przydziałem priorytetów w szczycie sezonu.
      features:
        - Programy magazynowania zapasów z modelami dostępnymi na żądanie
        - Harmonogram dostaw sezonowych dostosowany do kalendarza przekazania
        - Co-branding dealera na konsoli i tubach do ekspozycji w salonie
        - Stała jakość i specyfikacja we wszystkich zamówieniach seryjnych
        - Konkurencyjne ceny dealerów z poziomem opartym na wolumenie
content_benefits:
  tagline: Kluczowe korzyści
  title: Dlaczego Aquafarer jako<br />Twoja oferta na jacht
  subtitle: Oferty jachtów premium wybierane przez właścicieli superjachtów, konstruktorów, operatorów czarterowych i dealerów na całym świecie.
  list:
    - Lekki i kompaktowy po opróżnieniu — łatwy do przechowywania w garażu, szafce lub kołysce pokładowej
    - Konstrukcja Hypalon — doskonała odporność na promieniowanie UV podczas przechowywania w marinie w tropikalnym słońcu
    - Stabilna i wygodna przejażdżka do transferu gości w zmiennych warunkach morskich
    - Niestandardowa tapicerka, kolory tub i branding idealnie pasują do Twojego jachtu
    - 'Zakres silnika zaburtowego: 15 HP do 60 HP do zastosowań na łodziach motorowych i pontonach'
    - 'Szybka realizacja: 25–45 dni od zamówienia do wysyłki w przypadku standardowych konfiguracji przetargowych'
    - Ceny flotowe dostępne dla producentów jachtów wielojednostkowych i programów firm zarządzających
