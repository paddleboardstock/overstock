timeline:
  - year: '2012'
    title: Fundacja Produkcji Morskiej
    body: Firma Paddle Board Overstock rozpoczęła swoją działalność jako wyspecjalizowany warsztat nadmuchiwanych jednostek pływających w Qingdao w Chinach, zajmujący się rzemiosłem morskim i produkcją pontonów. Na początku skupiono się na budowaniu niezawodnych nadmuchiwanych produktów dzięki praktycznemu doświadczeniu inżynieryjnemu i dyscyplinie produkcyjnej.
  - year: '2015'
    title: Pierwszy eksport i certyfikacja CE
    body: Pierwsze zamówienia eksportowe dotarły do ​​Japonii i Korei. Uzyskano certyfikat CE dla podstawowych linii produktów, co oznacza wejście Paddle Board Overstock na rynki międzynarodowe. Firma zaczęła obsługiwać użytkowników komercyjnych i rekreacyjnych poza Chinami.
  - year: '2018'
    title: Rozbudowa fabryki
    body: Przeniesienie do zakładu produkcyjnego o powierzchni 12 000 m². Dodano linie spawalnicze RF i zdolność produkcyjną ściegu kropelkowego, umożliwiając produkcję na większą skalę i ulepszone systemy kontroli jakości.
  - year: '2020'
    title: Utworzono centrum badawczo-rozwojowe
    body: Otwarto dedykowane centrum badawczo-rozwojowe z laboratorium tkaninowym PVC, zbiornikiem do testów hydrodynamicznych i studiem symulacji CAD/FEA. Rozwój produktu rozszerzył się, koncentrując się na lekkiej konstrukcji, zwiększonej trwałości i projektowaniu zorientowanym na użytkownika.
  - year: '2022'
    title: Certyfikacja i globalny rozwój
    body: Uzyskano certyfikat ISO 9001. Rozszerzony do 14 inżynierów badawczo-rozwojowych i ponad 200 pracowników. Produkty docierały do ​​klientów w Europie, obu Amerykach oraz regionie Azji i Pacyfiku za pośrednictwem dystrybutorów i partnerstw OEM.
  - year: '2024'
    title: Pracownia Innowacji i Projektowania
    body: Uruchomiono studio projektowe i innowacyjne oferujące pełen zakres usług dla niestandardowych projektów ODM, od koncepcji po produkcję. Wzmocnione profesjonalne zastosowania morskie, w tym ratownictwo, przetargi komercyjne i rządowe.
  - year: '2026'
    title: Budowanie przyszłości eksploracji wody
    body: Dziś Paddle Board Overstock kontynuuje rozwój pontonów, systemów SUP i niestandardowych rozwiązań morskich, łącząc ludzi i organizacje z wodami świata. Obsługiwanych jest ponad 50 krajów, roczna wydajność 15 000 jednostek.
content_founding:
  tagline: Początek
  title: Urodzony na nabrzeżu
  subtitle: 'Paddle Board Overstock zaczynał w warsztacie przybrzeżnym w Qingdao z jedną łodzią i wizją: zbudować nadmuchiwaną jednostkę pływającą, która poradziłaby sobie w rzeczywistych warunkach morskich.'
  paragraphs:
    - W 2012 roku nasi założyciele dostrzegli lukę na rynku — większość pontonów była albo niedroga, ale zawodna, albo wysokiej jakości, ale zbyt droga. Wierzyli, że jest miejsce dla producenta, który zapewni zarówno jakość, jak i wartość.
    - Pierwszy kadłub został zbudowany ręcznie, przetestowany na lokalnych wodach i udoskonalony w oparciu o rzeczywiste opinie rybaków i małych operatorów komercyjnych. Ta pętla informacji zwrotnej — buduj, testuj, słuchaj, ulepszaj — pozostaje dziś podstawą naszej filozofii inżynieryjnej.
    - Do 2015 roku wieść rozeszła się poza Qingdao. Międzynarodowi dystrybutorzy zaczęli zamawiać próbki. To, co zaczęło się jako lokalny warsztat, stało się globalnym dostawcą.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Wczesny warsztat produkcyjny i produkcja Paddle Board Overstock
content_growth:
  tagline: Wzrost i innowacje
  title: Od warsztatu do obiektu o powierzchni 12 000 m²
  subtitle: Ciągłe inwestycje w ludzi, sprzęt i procesy przekształciły Paddle Board Overstock w nowoczesny morski zakład produkcyjny.
  paragraphs:
    - Wraz ze wzrostem popytu rósł także nasz obiekt. Rozwinęliśmy się z małego warsztatu do fabryki o powierzchni 12 000 m² z dedykowanymi liniami produkcyjnymi do łodzi RIB, pontonów, desek SUP i akcesoriów.
    - Zainwestowaliśmy w maszyny do cięcia CNC, sprzęt do spawania wysokiej częstotliwości, linie produkcyjne drop stitch i kompleksowe stanowiska testowe — co pozwala nam kontrolować każdy aspekt jakości produkcji.
    - Dziś nasz zespół liczący 200–300 osób składa się z inżynierów morskich, badaczy materiałów, specjalistów ds. kontroli jakości i wykwalifikowanych rzemieślników — wielu z nich pracuje w Paddle Board Overstock od samego początku.
founder:
  tagline: Poznaj Założyciela
  title: Zbudowany przez Watermana
  subtitle: Założyciel David Chen łączy wiedzę produkcyjną z życiową pasją do sportów wodnych – połączenie, które definiuje sposób, w jaki Paddle Board Overstock podchodzi do rozwoju produktu.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — założyciel Paddle Board Overstock
  story:
    - David Chen dorastał na wybrzeżu Qingdao, gdzie morze nie było miejscem wypoczynku, ale sposobem na życie. Młodość spędził na pływaniu kajakiem, żeglowaniu i łowieniu ryb na Morzu Żółtym — doświadczenia, które dały mu intuicyjne zrozumienie, jakie warunki muszą wytrzymać jednostki pływające.
    - Przed założeniem Paddle Board Overstock David spędził dziesięć lat w produkcji morskiej, pracując nad produkcją, jakością i handlem międzynarodowym. Zarządzał OEM programami dla marek europejskich i północnoamerykańskich, poznając z pierwszej ręki standardy i oczekiwania rynków światowych.
    - 'W 2012 roku założył Paddle Board Overstock z prostą misją: zbudować nadmuchiwaną jednostkę pływającą, której powierzyłby swojej rodzinie na wodzie. Ten osobisty standard – czy bym go użył? — pozostaje ostatecznym testem każdego produktu opuszczającego fabrykę.'
    - Obecnie David kieruje strategią produktu i nadzoruje zespół badawczo-rozwojowy, osobiście przeglądając nowe projekty i testując prototypy na wodach u wybrzeży Qingdao. Wierzy, że świetne produkty powstają dzięki zrozumieniu zarówno inżynierii, jak i doświadczenia.
philosophy:
  tagline: Filozofia marki
  title: Inżynieria Wolność Na Wodzie
  body: Wolność na wodzie to nie tylko ruch. Reprezentuje odkrywanie nowych miejsc, tworzenie wrażeń na świeżym powietrzu, łączenie ludzi z naturą i umożliwianie zawodowych misji. Inżynieria umożliwia tę swobodę.
  pillars:
    - title: Niezawodność przede wszystkim
      body: Środowiska wodne wymagają zaufania. Produkty Paddle Board Overstock zostały zaprojektowane z myślą o stabilności, trwałości, bezpieczeństwie i stałej wydajności.
    - title: Projektowanie skoncentrowane na człowieku
      body: Produkty powinny służyć ludziom, a nie technologii. Każda decyzja projektowa rozpoczyna się od zrozumienia, w jaki sposób ludzie korzystają ze jednostek pływających, gdzie eksplorują i jakie wyzwania przed nimi stoją.
    - title: Dostępna eksploracja
      body: Woda nie powinna należeć wyłącznie do ekspertów. Paddle Board Overstock tworzy sprzęt, który pozwala większej liczbie ludzi bezpiecznie korzystać z rzek, jezior, oceanów i środowisk przybrzeżnych.
    - title: Ciągłe innowacje
      body: Innowacja to nie tylko tworzenie nowych produktów. Udoskonala każdy szczegół — materiały, konstrukcje, produkcję i wygodę użytkownika.
engineeringDna:
  tagline: Inżynieria DNA
  title: Jak Paddle Board Overstock tworzy produkty
  areas:
    - title: Nauka o Materiałach
      body: Paddle Board Overstock koncentruje się na wyborze odpowiednich materiałów dla różnych środowisk morskich. Kluczowe kwestie obejmują odporność na ścieranie, odporność na promieniowanie UV, stabilność ciśnienia i długoterminową trwałość.
      items:
        - Odporność na ścieranie
        - Odporność na promieniowanie UV
        - Stabilność ciśnienia
        - Długoterminowa trwałość
    - title: Inżynieria budowlana
      body: Nadmuchiwane jednostki pływające wymagają precyzyjnej równowagi pomiędzy sztywnością, wagą, przenośnością i stabilnością. Inżynieria Paddle Board Overstock koncentruje się na optymalizacji tych czynników poprzez technologię rdzenia typu drop-stitch i zaawansowaną konstrukcję szwów.
      items:
        - Sztywność
        - Optymalizacja wagi
        - Ruchliwość
        - Stabilność
    - title: Precyzja produkcji
      body: 'Każdy produkt przechodzi kontrolowane procesy: przygotowanie materiału, precyzyjne cięcie, spawanie i klejenie, montaż, kontrolę jakości i weryfikację wydajności.'
      items:
        - Przygotowanie materiału
        - Precyzyjne cięcie
        - Spawanie i klejenie
        - Montaż i kontrola jakości
    - title: Inżynieria scenariuszy użytkownika
      body: Produkty opracowywane są pod kątem rzeczywistych zastosowań — rekreacji, przygód i zastosowań zawodowych — dzięki czemu każdy projekt spełnia specyficzne wymagania zamierzonego środowiska.
      items:
        - Rekreacja
        - Przygoda
        - Profesjonalny
        - Handlowy
trustSignals:
  tagline: Sygnały zaufania
  title: Dlaczego Paddle Board Overstock to niezawodny partner
  manufacturing:
    title: Możliwości produkcyjne
    body: Zakład produkcyjny o powierzchni 12 000 m², zatrudniający 200–300 wykwalifikowanych pracowników i ponad 14 inżynierów badawczo-rozwojowych. ISO 9001 certyfikowany system zarządzania jakością. Roczna produkcja 15 000 nadmuchiwanych jednostek pływających obsługujących ponad 50 krajów.
    stats:
      - label: Rozmiar obiektu
        value: 12 000 m²
      - label: Siła robocza
        value: 200-300
      - label: Inżynierowie ds. badań i rozwoju
        value: 14+
      - label: Roczna pojemność
        value: 15 000
  quality:
    title: Zaangażowanie w jakość
    body: Od kontroli materiałów po testy końcowe, Paddle Board Overstock utrzymuje systematyczne procesy jakości, aby dostarczać niezawodne produkty morskie. Przed wysyłką każde urządzenie przechodzi próbę ciśnieniową, kontrolę szwów i weryfikację wydajności.
    items:
      - CE Certyfikat — wszystkie produkty spełniają europejskie standardy bezpieczeństwa
      - ISO 9001:2015 — Certyfikat systemu zarządzania jakością
      - UKCA Oznaczone — zgodność z rynkiem brytyjskim
  global:
    title: Globalna obecność
    body: Paddle Board Overstock obsługuje klientów na wielu rynkach światowych, wspierając dystrybutorów, marki outdoorowe i profesjonalnych użytkowników morskich w ponad 50 krajach w Europie, regionie Azji i Pacyfiku, obu Amerykach, Bliskim Wschodzie i Afryce.
comparison:
  tagline: Pozycjonowanie marki
  title: Paddle Board Overstock na Rynku
  position: Producent statków zajmujący się inżynierią, łączący wiedzę w zakresie nadmuchiwanych jednostek pływających z pełnymi możliwościami OEM/ODM, niestandardowymi rozwiązaniami i głębokim doświadczeniem produkcyjnym.
  strengths:
    - Wiedza specjalistyczna w zakresie inżynierii nadmuchiwanych jednostek pływających
    - Pełna zdolność produkcyjna OEM/ODM
    - Niestandardowy rozwój i projektowanie produktów
    - 12 000 m² ISO 9001 certyfikowany zakład produkcyjny
  bestFor:
    - Użytkownicy rekreacji na świeżym powietrzu poszukujący niezawodnych nadmuchiwanych jednostek pływających
    - Operatorzy morscy potrzebujący sprzętu klasy komercyjnej
    - Partnerzy marki potrzebujący produkcji OEM/ODM
    - Profesjonalne organizacje ratownicze i patrolowe
