timeline:
  - year: '2012'
    title: Fundacja Produkcji Morskiej
    body: Paddle Board Overstock Rozpoczęto działalność jako specjalistyczny warsztat nadmuchiwanych deski paddleboardowych w Weihai w Chinach, poświęcony rzemiosłu morskiemu i produkcji desek. Początkowo skupiano się na budowie niezawodnych produktów dmuchanych poprzez praktyczne doświadczenie inżynierskie i dyscyplinę produkcyjną.
  - year: '2015'
    title: Pierwsze eksporty
    body: Początkowe zamówienia eksportowe dotarły do Japonii i Korei, co oznaczało Paddle Board Overstock wejście na rynki międzynarodowe. Firma zaczęła obsługiwać kajakarzy i entuzjastów sportów wodnych poza Chinami.
  - year: '2018'
    title: Rozbudowa fabryki
    body: Przeniesiono do zakładu produkcyjnego o powierzchni 12 000 m². Dodano linie spawania RF oraz drop-stitch zdolności produkcyjne, umożliwiając produkcję na większą skalę i ulepszone systemy kontroli jakości.
  - year: '2020'
    title: Utworzono centrum badawczo-rozwojowe
    body: Otwarto dedykowane centrum badawczo-rozwojowe z laboratorium tkaninowym PVC, zbiornikiem do testów hydrodynamicznych i studiem symulacji CAD/FEA. Rozwój produktu rozszerzył się, koncentrując się na lekkiej konstrukcji, zwiększonej trwałości i projektowaniu zorientowanym na użytkownika.
  - year: '2022'
    title: Globalny wzrost
    body: Rozszerzył się do 14 inżynierów badawczo-rozwojowych oraz 200+ pracowników. Deski dotarły do wioślarzy w całej Europie, obu Amerykach oraz regionie Azji i Pacyfiku, wysyłając do 50+ krajów.
  - year: '2024'
    title: Pracownia Innowacji i Projektowania
    body: Uruchomiliśmy pełnoprawne studio projektowania i innowacji dla nowych serii planszowych, od koncepcji po produkcję. Rozbudowaliśmy nasze charakterystyczne talie i platformy turystyczne serii artystycznych.
  - year: '2026'
    title: Budowanie przyszłości eksploracji wody
    body: Obecnie Paddle Board Overstock kontynuuje rozwój SUP nadmuchiwanych desek, sprzętu do wiosłowania oraz dostosowanych rozwiązań morskich — łącząc ludzi i organizacje z wodami świata.+ Obsługiwano 50 krajów, 15 000 jednostek rocznie.
content_founding:
  tagline: Początek
  title: Urodzony na nabrzeżu
  subtitle: 'Paddle Board Overstock zaczęło się w warsztatach nadmorskich w Weihai z jedną deską i wizją: zbudować nadmuchiwane deski wiosłowe, które poradziłyby sobie z prawdziwymi warunkami morskimi.'
  paragraphs:
    - W 2012 roku nasi założyciele dostrzegli lukę na rynku — większość nadmuchiwanych desek była albo przystępna cenowo, ale zawodna, albo wysokiej jakości, ale zbyt droga. Wierzyli, że jest miejsce na producenta, który dostarcza zarówno jakość, jak i wartość.
    - Pierwszy kadłub został zbudowany ręcznie, przetestowany na lokalnych wodach i udoskonalony w oparciu o rzeczywiste opinie rybaków i małych operatorów komercyjnych. Ta pętla informacji zwrotnej — buduj, testuj, słuchaj, ulepszaj — pozostaje dziś podstawą naszej filozofii inżynieryjnej.
    - Do 2015 roku wieści rozeszły się poza Weihai. Wioślarze i sklepy sportów wodnych w całej Azji zaczęły zgłaszać zapotrzebowanie na deski. To, co zaczęło się jako lokalny warsztat, stawało się globalną marką.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock wczesny warsztat produkcyjny i wytwórnia
content_growth:
  tagline: Wzrost i innowacje
  title: Od warsztatu do obiektu o powierzchni 12 000 m²
  subtitle: Stałe inwestycje w ludzi, sprzęt i procesy przekształciły Paddle Board Overstock w nowoczesny ośrodek produkcji morskiej.
  paragraphs:
    - Wraz ze wzrostem popytu, rosły też nasze możliwości produkcyjne. Rozszerzyliśmy działalność z małego warsztatu do fabryki o powierzchni 12 000 m² z dedykowanymi liniami produkcyjnymi dla desek SUP, akcesoriów i sprzętu ochronnego.
    - Zainwestowaliśmy w maszyny do cięcia CNC, sprzęt do spawania wysokiej częstotliwości, linie produkcyjne drop stitch i kompleksowe stanowiska testowe — co pozwala nam kontrolować każdy aspekt jakości produkcji.
    - Dziś nasz zespół liczy od 200 do 300 osób, w tym inżynierów morskich, specjalistów od materiałów, kontrolerów jakości i wykwalifikowanych rzemieślników — wielu z nich pracuje w Paddle Board Overstock od samego początku.
founder:
  tagline: Poznaj Założyciela
  title: Zbudowany przez Watermana
  subtitle: Założyciel David Chen łączy doświadczenie w produkcji z całym życiem pasją do sportów wodnych — kombinacja, która definiuje podejście Paddle Board Overstock do rozwoju produktu.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — założyciel Paddle Board Overstock
  story:
    - David Chen dorastał na wybrzeżu Weihai, gdzie morze nie było celem wakacyjnym, lecz sposobem życia. Spędził młodość na wioślarstwie, żeglowaniu i wędkowaniu w Morzu Żółtym — doświadczenia te dały mu intuicyjne zrozumienie, czego potrzebują deski paddle, aby wytrzymać.
    - Zanim założył Paddle Board Overstock, David spędził dekadę w produkcji morskiej, pracując w obszarach produkcji, jakości i handlu międzynarodowego. Prowadził programy produkcji i kontroli jakości na rynki europejskie i północnoamerykańskie, ucząc się osobiście oczekiwań globalnych wioślarzy.
    - 'W 2012 roku założył Paddle Board Overstock z prostą misją: tworzyć nadmuchiwane deski paddle, którym zaufałby, używając ich z własną rodziną na wodzie. Ta osobista norma — czy sam bym tego użył? — pozostaje ostatecznym testem dla każdego produktu opuszczającego fabrykę.'
    - Dziś David kieruje strategią produktową i nadzoruje zespół badawczo-rozwojowy, osobiście przeglądając nowe projekty i testując prototypy na wodach u wybrzeży Weihai. Wierzy, że świetne produkty powstają z rozumienia zarówno inżynierii, jak i doświadczenia.
philosophy:
  tagline: Filozofia marki
  title: Inżynieria Wolność Na Wodzie
  body: Wolność na wodzie to nie tylko ruch. Reprezentuje odkrywanie nowych miejsc, tworzenie wrażeń na świeżym powietrzu, łączenie ludzi z naturą i umożliwianie zawodowych misji. Inżynieria umożliwia tę swobodę.
  pillars:
    - title: Niezawodność przede wszystkim
      body: Środowiska wodne wymagają zaufania. Produkty Paddle Board Overstock są projektowane z myślą o stabilności, trwałości, bezpieczeństwie i konsekwentnej wydajności.
    - title: Projektowanie skoncentrowane na człowieku
      body: Produkty powinny służyć ludziom, a nie technologii. Każda decyzja projektowa zaczyna się od zrozumienia, jak ludzie używają swoich desek, gdzie eksplorują i jakie napotykają wyzwania.
    - title: Dostępna eksploracja
      body: Woda nie powinna należeć wyłącznie do ekspertów. Paddle Board Overstock tworzy sprzęt, który pozwala większej liczbie osób bezpiecznie doświadczać rzek, jezior, oceanów i środowisk przybrzeżnych.
    - title: Ciągłe innowacje
      body: Innowacja to nie tylko tworzenie nowych produktów. Udoskonala każdy szczegół — materiały, konstrukcje, produkcję i wygodę użytkownika.
engineeringDna:
  tagline: Inżynieria DNA
  title: Jak Paddle Board Overstock tworzy produkty
  areas:
    - title: Nauka o Materiałach
      body: Paddle Board Overstock koncentruje się na wyborze odpowiednich materiałów do różnych środowisk morskich. Kluczowe kwestie obejmują odporność na ścieranie, odporność na UV, stabilność pod ciśnieniem oraz trwałość w długim okresie.
      items:
        - Odporność na ścieranie
        - Odporność na promieniowanie UV
        - Stabilność ciśnienia
        - Długoterminowa trwałość
    - title: Inżynieria budowlana
      body: Dmuchane deski SUP wymagają precyzyjnej równowagi między sztywnością, wagą, przenośnością a stabilnością. Paddle Board Overstock inżynieria koncentruje się na optymalizacji tych czynników poprzez drop-stitch podstawową technologię i zaawansowaną konstrukcję szwów.
      items:
        - Sztywność
        - Optymalizacja wagi
        - Ruchliwość
        - Stabilność
    - title: Precyzja produkcji
      body: 'Każdy produkt przechodzi kontrolowane procesy: przygotowanie materiału, precyzyjne cięcie, spawanie i klejenie, montaż, kontrolę jakości i weryfikację wydajności.'
      items:
        - Przygotowanie materiału
        - Precyzyjne cięcie
        - Spawanie i klejenie
        - Montaż i kontrola jakości
    - title: Inżynieria scenariuszy użytkownika
      body: Produkty są rozwijane w oparciu o rzeczywiste zastosowania wioślarskie — rekreację, przygodę, rodzinę i turystykę — zapewniając, że każdy projekt spełnia konkretne wymagania środowiska, dla którego został przeznaczony.
      items:
        - Rekreacja
        - Przygoda
        - Rodzina
        - Zwiedzanie
trustSignals:
  tagline: Sygnały zaufania
  title: Dlaczego Paddle Board Overstock jest marką, której możesz zaufać
  manufacturing:
    title: Możliwości produkcyjne
    body: Zakład produkcyjny o powierzchni 12 000 m² z 200-300 wykwalifikowanymi pracownikami i 14 inżynierami ds. badań i rozwoju. Roczna produkcja wynosi 15 000 desek, które trafiają do wioślarzy w 50 krajach.
    stats:
      - label: Rozmiar obiektu
        value: 12,000 m²
      - label: Siła robocza
        value: 200-300
      - label: Inżynierowie ds. badań i rozwoju
        value: 14+
      - label: Roczna pojemność
        value: 15,000
  quality:
    title: Zaangażowanie w jakość
    body: Od kontroli materiałów po końcowe testy, Paddle Board Overstock utrzymuje systematyczne procesy jakościowe, aby dostarczać niezawodne produkty morskie. Każda jednostka przechodzi test ciśnieniowy, kontrolę szwów i weryfikację wydajności przed wysyłką.
    items:
      - 99,3% wysyłek wolnych od wad
      - 100% testowane pod względem ciśnienia przy 1,25x nominalnym PSI
      - 2-letnia gwarancja na każdą deskę
  global:
    title: Globalna obecność
    body: Paddle Board Overstock wysyła bezpośrednio do wioślarzy w 50 krajach w Europie, regionie Azji i Pacyfiku, obu Amerykach, na Bliskim Wschodzie i w Afryce.
comparison:
  tagline: Pozycjonowanie marki
  title: Paddle Board Overstock na rynku
  position: Marka SUP bezpośrednio z fabryki łącząca inżynierię desek dmuchanych z produkcją wewnętrzną i 12-letnim doświadczeniem w produkcji.
  strengths:
    - Ekspertyza w inżynierii desek dmuchanych SUP
    - Ceny bezpośrednio z fabryki bez dodatkowej marży handlowej
    - Kompletne zestawy — deska, pompka, wiosło i sprzęt w jednym pudełku
    - Zakład produkcyjny o powierzchni 12 000 m² w Weihai
  bestFor:
    - Wioślarze poszukujący wartości bezpośrednio z fabryki bez kompromisów jakościowych
    - Rodziny i początkujący odkrywający wiosłowanie stojące
    - Wioślarze do wycieczek, jogi i fitnessu potrzebujący specjalistycznych platform
    - Floty wynajmu i kluby potrzebujące wytrzymałych, łatwych w utrzymaniu desek
