hero:
  tagline: Nasza historia
  title: Paddle Board Overstock — Inżynieria wolności na wodzie
  subtitle: 'Od warsztatu przybrzeżnego po globalnego producenta sprzętu morskiego — nasza podróż opiera się na upartym przekonaniu: jednostki pływające powinny być projektowane tak, jak mają znaczenie, bo mają.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Fabryka Paddle Board Overstock i zakład produkcyjny w Qingdao
