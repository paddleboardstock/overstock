hero:
  tagline: Nasza historia
  title: Paddle Board Overstock — Wolność inżynieryjna w otoczeniu
  subtitle: 'Od warsztatu nadbrzeżnego po globalnego producenta żeglugi — nasza droga opiera się na upartym przekonaniu: deski paddleboardowe powinny być projektowane tak, jakby miały znaczenie, bo naprawdę mają znaczenie.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock fabryka i zakład produkcyjny morski w Weihai
