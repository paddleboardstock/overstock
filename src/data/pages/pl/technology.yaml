hero:
  tagline: Technologia
  title: Zbudowany z myślą o wydajności
  subtitle: Każda Paddle Board Overstock płyta jest projektowana z precyzyjnymi materiałami i metodami konstrukcyjnymi testowanymi pod kątem środowisk morskich. Centrum R&D o powierzchni 12 000 m² z prototypowaniem na miejscu.
