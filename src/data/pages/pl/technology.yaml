testimonial:
  quote: Tym, co wyróżnia Paddle Board Overstock, jest ich nauka o materiałach. Nie tylko montują komponenty — samodzielnie opracowują związki PVC, parametry spawania i układ konstrukcyjny. Ta pionowa integracja jest widoczna w produkcie końcowym.
  author: Dawida Parka
  title: Menedżer ds. Rozwoju Produktu
  company: Bluewater Sports Equipment
  location: Australia
sections:
  - title: Rdzeń typu drop-stitch
    standard: Ciśnienie robocze 12-15 PSI
    description: Tysiące wewnętrznych nici poliestrowych łączy górną i dolną warstwę, tworząc sztywną konstrukcję przy ciśnieniu 12-15 PSI. Jest to ta sama technologia, która jest stosowana w profesjonalnych deskach wiosłowych i nadmuchiwanych łodziach wyścigowych. Nasza gęstość ściegu kropelkowego jest zoptymalizowana dla każdego modelu, aby zapewnić idealną równowagę sztywności i wagi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagram rdzenia drop-stitch
  - title: Klasa morska PVC
    standard: Spawane | Testowane na promieniowanie UV / słoną wodę / ścieranie
    description: Wielowarstwowy laminowany materiał PVC przystosowany do środowisk morskich. Każda warstwa jest raczej zgrzewana niż klejona, co eliminuje ryzyko rozwarstwienia. Testowany pod kątem odporności na promieniowanie UV (ASTM G154, ponad 1000 godzin), korozję słoną wodą (ISO 9227) i ścieranie (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Warstwa PVC
  - title: Hypalon Rury
    standard: CSM guma | Odporny na promieniowanie UV / chemikalia / ekstremalne temperatury
    description: Stosowana w modelach RIB guma Hypalon (CSM) zapewnia doskonałą odporność na promieniowanie UV i chemikalia w porównaniu ze standardową gumą PVC. Rury Hypalon zachowują elastyczność w ekstremalnych temperaturach i są odporne na degradację pod wpływem paliwa i oleju. Wszystkie szwy są układane ręcznie przez certyfikowanych techników.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Podłoga pokładu powietrznego
    standard: Nadmuchiwane pod wysokim ciśnieniem | Zastępuje sklejkę/aluminium
    description: Wysokociśnieniowy system podłóg nadmuchiwanych zastępujący tradycyjne podłogi ze sklejki lub listew aluminiowych. Skraca czas konfiguracji, wagę całkowitą i objętość przechowywania, zapewniając jednocześnie odpowiednią sztywność podczas stania, łowienia ryb i chodzenia. Przetestowano pod kątem obciążenia rozproszonego o masie ponad 200 kg.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Dno powietrzne (Air Deck)
