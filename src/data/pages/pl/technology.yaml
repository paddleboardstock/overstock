testimonial:
  quote: Przekonała mnie konstrukcja. Spoje spajane spajaniem zamiast kleju, drop-stitch rdzeń przy 15 cm i PSI brak chwian, gdy cofam się, żeby skręcić. Po dwóch latach zero problemów.
  author: Marta Keller
  title: Zweryfikowany kupujący
  company: Kajakarz turystyczny po jeziorze
  location: Niemcy
sections:
  - title: Rdzeń typu drop-stitch
    standard: Ciśnienie robocze 12-15 PSI
    description: Tysiące wewnętrznych nici poliestrowych łączą górną i dolną warstwę, tworząc sztywną strukturę o wymiarach 12-15 PSI. To ta sama technologia stosowana w profesjonalnych deskach paddleboardowych. drop-stitch Nasza gęstość jest optymalizowana dla modelu pod kątem idealnej równowagi sztywności i wagi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagram rdzenia DS
  - title: Klasa morska PVC
    standard: Spawane | Testowane na promieniowanie UV / słoną wodę / ścieranie
    description: PVC Wielowarstwowa tkanina laminowana przeznaczona do środowisk morskich. Każda warstwa jest spawana spawana spawano (fusion fusion stoping), a nie klejona, co eliminuje ryzyko delaminacji. Testowano UV pod kątem odporności (1000+ godzin), korozji w słonej wodzie oraz ścierania.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC Warstwa
  - title: EVA System Deck
    standard: Chwytliwe, wygodne, artystyczne wzory
    description: Pianka pełna tarasu EVA zapewnia przyczepność, amortyzację i charakterystyczny dla serii artystycznych wygląd. Precyzyjnie wycięte panele układane są w jednolite wzory — bez wyciskania drukowanych grafik, bez potrzeby wosku.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: EVA Talia
  - title: System szyn trójwarstwowych
    standard: Fusion bonded | Nadmiernie wzmocnione w strefie najwyższego naprężenia
    description: Listwy krawędziowe są potrójnie warstwowo spawane i owinięte wokół krawędzi deski — to strefa najwyższego naprężenia w każdym nadmuchiwanym sprzęcie. To tutaj tanie deski zawodzą jako pierwsze; nasze są nadmiernie wzmocnione.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: System krawędzi
