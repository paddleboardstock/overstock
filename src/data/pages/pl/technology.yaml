hero:
  tagline: Technologia
  title: Zbudowany z myślą o wydajności
  subtitle: Każda deska Paddle Board Overstock została zaprojektowana z wykorzystaniem precyzyjnych materiałów i metod konstrukcyjnych przetestowanych pod kątem środowiska morskiego. Centrum badawczo-rozwojowe o powierzchni 12 000 m² z wewnętrznym prototypowaniem.
