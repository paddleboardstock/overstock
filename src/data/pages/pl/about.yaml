features3_what_we_build:
  title: Co budujemy
  subtitle: Skoncentrowana linia produktów, którą znamy od podszewki – żadnych półśrodków ani badge engineeringu.
  columns: 3
  isBeforeContent: true
  items:
    - title: Łodzie RIB
      description: RIB z kadłubem aluminiowym od 3,3 m do 7,5 m. Zaprojektowane do patrolowania, nurkowania, wędkowania i użytku rodzinnego.
      icon: tabler:ship
    - title: Łodzie pneumatyczne
      description: Łodzie pneumatyczne z PVC i Hypalon od 2,4 m do 4,2 m. Lekkie, wytrzymałe i łatwe w przechowywaniu.
      icon: tabler:speedboat
    - title: Tender do superjachtów
      description: Kompaktowe RIB o wysokich specyfikacjach, wykonane na miarę projektu jachtu macierzystego.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Akcesoria
      description: Pasy, pompy, pokrowce, torby wodoodporne, zbiorniki paliwa i elektronika. Wszystko kompatybilne z naszymi łodziami.
      icon: tabler:package
    - title: Modyfikacje i naprawy
      description: Naprawa przedziałów pneumatycznych, modernizacja elektroniki i wymiana silników.
      icon: tabler:tool
    - title: Produkty na zamówienie
      description: Projektowanie dla klientów komercyjnych, naukowych i wojskowych.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Łódź na zamówienie
steps2_values:
  title: Nasze wartości
  subtitle: Trzy zasady kształtujące każdy produkt od pierwszego dnia.
  items:
    - title: Buduj tak, jakby w łodzi była twoja rodzina
      description: Każdy kadłub, każdy spaw i każdy komponent są traktowane tak, jakby miały być używane przez nasze własne rodziny.
      icon: tabler:heart
    - title: Inżynieria przed sprzedażą
      description: Jeśli specyfikacja jest błędna, zmieniamy specyfikację – nigdy klienta.
      icon: tabler:settings
    - title: Wsparcie poza gwarancją
      description: Dwudziestoletnie kadłuby wciąż dzwonią po części – i wciąż odbieramy.
      icon: tabler:headset
steps2_milestones:
  title: Kamienie milowe
  subtitle: Krótka wersja historii Paddle Board Overstock.
  isReversed: true
  items:
    - title: Założona w nadmorskim warsztacie
      description: Dwóch inżynierów okrętowych z jedną frezarką CNC i niezachwianą ideą.
      icon: tabler:building-factory
    - title: Pierwsze 1 000 dostarczonych kadłubów
      description: Osiągnięte w siódmym roku, głównie dzięki poczcie pantoflowej i stałym klientom.
      icon: tabler:circle-check
    - title: Międzynarodowy program eksportowy
      description: Dostawy do 40+ krajów z lokalnymi partnerami serwisowymi na pięciu kontynentach.
      icon: tabler:world
    - title: Nowa globalna struktura operacyjna
      description: We wrześniu 2026 roku działalność marki została przeniesiona z Qingdao Vatrad Group do Weihai Dongjilian Co., Ltd. (Nowy Meksyk, USA); centrum produkcyjne Qingdao kontynuuje prace badawczo-rozwojowe, produkcję i bezpośredni eksport z fabryki.
      icon: tabler:building-skyscraper
features2_locations:
  title: Nasze lokalizacje
  tagline: Gdzie nas znaleźć
  columns: 3
  items:
    - title: Siedziba główna i warsztat
      description: Nadmorski park przemysłowy, budynek 4 – otwarte pn-pt dla odwiedzin po umówieniu.
    - title: Centrum serwisowe UE
      description: Port śródziemnomorski – modyfikacje, naprawy i wsparcie gwarancyjne dla klientów europejskich.
    - title: Sieć partnerska APAC
      description: Autoryzowani partnerzy serwisowi w Australii, Japonii, Singapurze i Hongkongu.
brand_hub_tagline: Marka
brand_hub_title: Poznaj naszą markę
brand_hub_subtitle: Zanurz się w naszej wiedzy z zakresu inżynierii morskiej, globalnej obecności i zasad, które nami kierują.
brand_hub_cards:
  - title: Wiedza Morska
    desc: Dekady nauki o materiałach, precyzyjnej produkcji i testów w rzeczywistych warunkach — od produkcji PVC/Hypalon po konstrukcję głębokiego kadłuba V i technologię drop-stitch.
    link: /brand-marine-expertise
    link_label: Dowiedz się więcej →
  - title: Globalna Obecność
    desc: Wysyłka do ponad 50 krajów z naszego zakładu w Qingdao z autoryzowanymi partnerami serwisowymi w Europie, Azji-Pacyfiku i Amerykach.
    link: /brand-global-presence
    link_label: Dowiedz się więcej →
  - title: Dlaczego Paddle Board Overstock
    desc: Pionowa integracja, podwójna certyfikacja (ISO 9001 + BSCI), zgodność z CE i niskie MOQ — stworzone dla marek, dystrybutorów i agencji rządowych.
    link: /brand-why-paddleboardoverstock
    link_label: Dowiedz się więcej →
production_section:
  tagline: Doskonałość produkcyjna
  title: Zapewniając doskonałe rzemiosło
  description: Linia produkcyjna Paddle Board Overstock jest poświęcona wytwarzaniu produktów dmuchanych najwyższej jakości — trwałych i o wysokiej wydajności.
  cards:
    - title: Doświadczony zespół techników
      items:
        - Profesjonalna wiedza o PVC, Hypalonie i materiałach morskich
        - Precyzyjne rzemiosło w cięciu, klejeniu i montażu akcesoriów
        - Ciągłe szkolenia z najnowszych technologii produkcji
    - title: Zaawansowany sprzęt produkcyjny
      items:
        - Urządzenia do cięcia CNC zapewniające precyzyjne cięcie tkanin z minimalnym błędem
        - Wysokoprecyzyjne klejenie na gorąco/zimno dla szczelnych, trwałych szwów
        - Profesjonalny sprzęt do badań szczelności i wytrzymałości na rozciąganie
    - title: Dojrzały system zarządzania
      items:
        - Ustandaryzowane procesy produkcyjne z jasnymi normami jakości
        - Filozofia lean production zmniejszająca odpady i poprawiająca wydajność
        - Skuteczne zarządzanie łańcuchem dostaw z niezawodnymi partnerami
    - title: Ścisła kontrola jakości
      items:
        - Certyfikowany system zarządzania jakością
        - 'Wieloetapowa inspekcja: surowce, w trakcie produkcji, kontrola końcowa'
        - Rygorystyczne testy szczelności i trwałości przed wysyłką
global_ops_section:
  tagline: Globalna architektura operacyjna
  title_html: Jedna marka, <span class="text-white/90">dwa centra</span>
  description_html: Od września 2026 roku marką Paddle Board Overstock zarządza <strong class="text-white">Weihai Dongjilian Co., Ltd.</strong> (Nowy Meksyk, USA) — globalna struktura odpowiedzialna za dystrybucję, sprzedaż B2B, umowy, fakturowanie i obsługę posprzedażową. Badania i rozwój, produkcja oraz kontrola jakości pozostają w <strong class="text-white">centrum produkcyjnym Paddle Board Overstock w Qingdao</strong>, które wysyła każde zamówienie bezpośrednio z fabryki, FOB Qingdao. Przejście zmieniło to, kto podpisuje Twoją umowę — nie to, kto buduje Twoją łódź.
  stats:
    - value: 2,400+
      label: Kadłubów dostarczonych na świecie
    - value: 50+
      label: Krajów eksportu
    - value: 10+
      label: Lat produkcji

