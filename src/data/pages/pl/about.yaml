hero:
  tagline: Kim jesteśmy?
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Fabryka i warsztat Paddle Board Overstock
  title: O nadmiernym zapasie <span class="text-accent dark:text-white">wioseł</span>
  subtitle: Zupełnie nowe nadmuchiwane deski SUP w cenach nadmiernych zapasów i wyprzedaży — wspierane przez naszą własną produkcję Weihai od 2012 roku, hurtową sprzedaż mieszanych modeli dla małych detalistów i elastyczną wysyłkę na całym świecie.
stats:
  title: By the numbers
  columns: 4
  stats:
    - title: Roczna zdolność produkcyjna
      amount: 15,000 units
    - title: Kraje wysłane
      amount: 50+
    - title: Płyty poddawane próbie ciśnieniowej
      amount: 100%
    - title: Inżynierowie R&D
      amount: 14+
features3_what_we_build:
  title: What we build
  subtitle: Skoncentrowana linia produktów, którą znamy na wylot — bez niedokończonych eksperymentów, bez inżynierii odznak.
  columns: 3
  isBeforeContent: true
  items:
    - title: Nadmuchiwane deski SUP
      description: Uniwersalne i objazdowe SUPy od 10' do 12 ft. Stabilny, sztywny i wyposażony w pompkę, wiosło i smycz.
      icon: tabler:swimming
    - title: Talie Z serii Art
      description: Signature EVA Deck Artwork — Cheetah Surge, Tropical Breeze, Medusa Glow i nie tylko.
      icon: tabler:hexagons
    - title: Kompletne pakiety
      description: 'Każda deska jest dostarczana jako pełny zestaw: deska, plecak, pompka, wiosło, płetwa, smycz i zestaw naprawczy.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Akcesoria
      description: Czółenka, łopatki, smycze, zestawy naprawcze i suche worki. Wszystko dopasowane do naszych plansz.
      icon: tabler:tool
    - title: Pielęgnacja i naprawa
      description: Wewnętrzne wsparcie naprawcze, części zamienne i wskazówki dotyczące konserwacji, aby utrzymać deskę na wodzie przez lata.
      icon: tabler:settings
    - title: Floty klubowe i wypożyczalnie
      description: Masowe wyposażenie klubów, szkół i wypożyczalni flot z bezpośrednim wsparciem fabrycznym.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Omówienie projektu tablicy i inżynierii
steps2_values:
  title: Nasze wartości
  subtitle: Trzy zasady, które ukształtowały każdy produkt od samego początku.
  items:
    - title: Buduj tak, jak Twoja rodzina
      description: Każda deska, szew i zawór są traktowane tak, jakby korzystały z nich nasze rodziny.
      icon: tabler:heart
    - title: Inżynier przed sprzedażą
      description: Jeśli specyfikacja jest nieprawidłowa, zmieniamy specyfikację — nigdy klienta.
      icon: tabler:settings
    - title: Wsparcie, które trwa dłużej niż gwarancja
      description: Płyty, które zbudowaliśmy lata temu, nadal dzwonią do nas po części zamienne, a my nadal je odbieramy.
      icon: tabler:headset
steps2_milestones:
  title: Ważne etapy
  subtitle: Krótka wersja historii Paddle Board Overstock.
  isReversed: true
  items:
    - title: Założona w Weihai
      description: Nadmorskie warsztaty poświęcone nadmuchiwanym deskom SUP.
      icon: tabler:building-factory
    - title: Kampus produkcyjny 12 000 m²
      description: Rozbudowany do dedykowanego obiektu ze spawaniem RF i zdolnością produkcyjną ściegów kropelkowych.
      icon: tabler:circle-check
    - title: Program eksportu międzynarodowego
      description: Teraz wysyłka do ponad 50 krajów z opcjami frachtu ekspresowego i morskiego.
      icon: tabler:world
    - title: Nadmiar zapasów i koncentracja na sprzedaży hurtowej
      description: We wrześniu 2026 roku działalność marki przeniosła się z Qingdao Vatrad Group do Weihai Dongjilian Co., Ltd.; centrum produkcyjne Weihai kontynuuje badania i rozwój, produkcję i wysyłkę bezpośrednią.
      icon: tabler:building-skyscraper
features2_locations:
  title: Nasze biura
  tagline: 'Znajdź nas:'
  columns: 3
  items:
    - title: Siedziba i warsztaty
      description: Nadmorski park przemysłowy, budynek 4 — czynny od poniedziałku do piątku.
    - title: Centrum serwisowe
      description: Port śródziemnomorski — remont, naprawa i wsparcie gwarancyjne dla klientów europejskich.
    - title: 'Sieć partnerska:'
      description: Autoryzowani partnerzy serwisowi w Australii, Japonii, Singapurze i Hongkongu.
brand_hub_tagline: Marka
brand_hub_title: Poznaj naszą markę
brand_hub_subtitle: Zanurz się głębiej w naszą wiedzę z zakresu inżynierii morskiej, globalną obecność i zasady, które nas napędzają.
brand_hub_cards:
  - title: Ekspertyza morska
    desc: Dekady materiałoznawstwa, precyzyjnej produkcji i testów w świecie rzeczywistym — od rdzeni ściegów kropelkowych po szwy spawane i talie serii artystycznych.
    link: /brand-marine-expertise
    link_label: Zobacz
  - title: Dlaczego Paddle Board Overstock
    desc: Ceny bezpośrednie, w 100% testowane ciśnieniowo deski i 2-letnia gwarancja — stworzone z myślą o wioślarzach, rodzinach i miłośnikach sportów wodnych.
    link: /brand-why-paddleboardoverstock
    link_label: Zobacz
