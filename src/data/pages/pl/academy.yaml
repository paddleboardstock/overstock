hero:
  tagline: Paddle Board Overstock Akademia
  title: Centrum Nauki
  subtitle: Przewodniki i samouczki na każdym poziomie umiejętności — od podstaw SUP po zaawansowane techniki ratownicze
categories:
  - level: Początkujący
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Podstawy
        desc: Naucz się podstaw paddleboardingu na stojąco — postawy, techniki uderzeń i równowagi.
        slug: beginner-sup-guide
      - title: Techniki wiosłowania
        desc: Ruch do przodu, ruch zamachowy, ruch rysujący i dolna klamra — opanuj podstawowe ruchy wiosłem.
        slug: sup-paddle-guide
      - title: Bezpieczeństwo przede wszystkim
        desc: Podstawowe praktyki bezpieczeństwa, w tym kontrola pogody, używanie PFD, zasady smyczy i samoratowanie.
        slug: sup-safety-guide
  - level: Mediator
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Niezbędne informacje turystyczne
        desc: Planowanie wielogodzinnych wioseł — nawigacja, nawodnienie, tempo i odczytywanie prognoz wiatru.
        slug: touring-sup-guide
      - title: Czytanie pogodowe
        desc: Interpretuj prognozy morskie, identyfikuj układy chmur i poznaj wpływ wiatru na wodę.
        slug: weather-planning-water-sports
      - title: Podstawy nawigacji
        desc: Czytanie map, korzystanie z kompasu, punkty GPS i planowanie trasy dla wiosłowania przybrzeżnego.
        slug: sup-navigation-guide
      - title: Świadomość pływów
        desc: Zrozumienie cykli pływów, prądów i ich wpływu na czas i trasę startu.
        slug: understanding-tides
  - level: Zaawansowany
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Planowanie wycieczki wielodniowej
        desc: Logistyka wyprawy — wybór sprzętu, planowanie żywności, protokoły bezpieczeństwa i kontakty w sytuacjach awaryjnych.
        slug: sup-travel-guide
      - title: Techniki Ratownictwa
        desc: Protokoły ratownictwa własnego, ratownictwa T i holowania na otwartych wodach.
        slug: sup-self-rescue
      - title: Nocne wiosłowanie
        desc: Nawigacja po zmroku — wymagania dotyczące oświetlenia, pamięć tras, komunikacja grupowa i świadomość zagrożeń.
        slug: sup-navigation-guide
  - level: Konserwacja
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Czyszczenie i pielęgnacja
        desc: Płukanie słodką wodą, ochrona przed promieniowaniem UV, zapobieganie pleśni i odpowiednie techniki suszenia po każdej sesji.
        slug: inflatable-sup-maintenance
      - title: Przewodnik przechowywania
        desc: Najlepsze praktyki przechowywania nadmuchiwanych desek — deflacja, składanie, kontrola temperatury i trwałość.
        slug: inflatable-sup-storage
      - title: Podstawy naprawy
        desc: Napraw małe przebicia, nieszczelności szwów i problemy z zaworami za pomocą zestawów naprawczych PVC i technik łatania.
        slug: inflatable-sup-repair
      - title: Konserwacja zaworu
        desc: Zidentyfikuj typy zaworów (Halkey-Roberts, Boston, Leafield), usuń zanieczyszczenia i wymień uszkodzone trzpienie.
        slug: inflatable-sup-repair
knowledge_center_tagline: Centrum wiedzy
knowledge_center_title: Przewodniki i wiedza o deskach wiosłowych
knowledge_center_subtitle: Eksperci i porady zakupowe dla osób na każdym poziomie zaawansowania.
knowledge_sections:
  - title: Technologia i budowa płyt
    tagline: Wewnątrz twojej deski paddleboardowej
    desc: Jak zbudowane są nadmuchiwane deski paddle boardów — drop-stitch rdzenie, warstwy laminowane, EVA tarasy i testy ciśnieniowe fabryczne.
    guides:
      - title: Jak powstają deski paddle board
        desc: Od cięcia i laminowania materiałów po 100% testy ciśnieniowe — zobacz, jak każda deska opuszcza fabrykę.
        href: /factory/process
      - title: Drop-Stitch Technologia podstawowa
        desc: Jak tysiące wewnętrznych gwintów tworzy sztywną, wysokociśnieniową konstrukcję nadmuchiwaną.
        href: /learn/drop-stitch-core
      - title: Materiały referencyjne
        desc: PVC Wyjaśniono oceny Denier, wagę tkanin, UV odporność oraz materiały pokładu.
        href: /learn/materials
      - title: Technologia nadmuchiwanych desek
        desc: Spawane szwy, konstrukcja szyn i systemy zaworowe, które utrzymują deskę sztywną i szczelną.
        href: /learn/inflatable-technology
  - title: Poradniki zakupowe
    tagline: Wybierz odpowiednią tablicę
    desc: Wszystko, czego potrzebujesz, aby wybrać swoją pierwszą — lub następną — dmuchaną – SUP od rozmiaru po konstrukcję.
    guides:
      - title: Jak wybrać nadmuchiwaną SUP maszynę
        desc: Kluczowe czynniki — konstrukcja, grubość, układ stateczników oraz dołączone akcesoria.
        href: /guides/how-to-choose-your-sup/
      - title: Czym jest stand-up paddleboarding?
        desc: Przyjazne wprowadzenie do sportu, sprzętu i dlaczego nadmuchiwane deski ułatwiają rozpoczęcie.
        href: /guides/what-is-sup
      - title: Nadmuchiwana vs twarda deska
        desc: Porównaj i SUP-y i twarde płyty epoksydowe pod względem przenośności, trwałości, wydajności i wartości.
        href: /compare/inflatable-vs-hardboard
      - title: SUP Przewodnik po rozmiarach
        desc: Znajdź odpowiednią długość, szerokość i objętość deski dopasowaną do swojej wagi, umiejętności i stylu wiosłowania.
        href: /size-guide
  - title: Umiejętności i bezpieczeństwo
    tagline: Wiosłuj z pewnością
    desc: Praktyczna wiedza na każdą sesję — podstawy dla początkujących, bezpieczeństwo na wodzie, pielęgnacja i naprawa.
    guides:
      - title: SUP Podstawy — przewodnik dla początkujących
        desc: Wszystko, co początkujący powinien wiedzieć — typy desek, dobór wiosła, postawa i wskazówki na pierwszy dzień.
        href: /v2/beginner-sup-guide
      - title: Podstawy bezpieczeństwa na wodzie
        desc: Sprawdzanie pogody, PFD wybór, zasady smyczy, samoratunek i najlepsze praktyki w grupowym wiosłowaniu.
        href: /learn/water-safety
      - title: SUP Konserwacja i pielęgnacja
        desc: Czyszczenie, przechowywanie, UV ochrona i wskazówki dotyczące pielęgnacji dmuchanych SUP desek.
        href: /v2/inflatable-sup-maintenance
      - title: Podstawy naprawy desek
        desc: Napraw małe przebicia, nieszczelności szwów i problemy z zaworami za pomocą zestawów naprawczych PVC i technik łatania.
        href: /v2/inflatable-sup-repair
