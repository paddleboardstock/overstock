overview_section:
  tagline: Przegląd rynku
  title: Rynek indonezyjski SUP
  paragraphs:
    - Indonezja to jedna z największych gospodarek sportów wodnych w Azji, a Bali to jej bijące serce. Od klubów plażowych Seminyak i Canggu po spokojne laguny Sanur i Nusa Dua, deski do wiosłowania pojawiają się wszędzie — wiosłowania nad rafami o wschodzie słońca, SUP zajęcia jogi, wycieczki po lagunach i programy dla gości hotelowych. Poza Bali, Lombok, Wyspy Gili i rozwijająca się scena turystyczna w archipelagu podążają tym samym schematem.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: Trwałość UV , wydajność i możliwość naprawy mają większe znaczenie niż połysk katalogowy. Zamówienia składają się z 5–20 płyt, mieszanych na lekcje, wynajem i ekspozycję detaliczną.
  customer_types:
    - title: Sklepy ze sportami wodnymi na Bali
      description: Ugruntowani operatorzy Sanur, Seminyak i Canggu powiększyli SUP linie surfingowe, nurkowe i nurkowe.
    - title: Wyspy kurortowe i kluby plażowe
      description: Ośrodki i kluby plażowe na Bali, Lombok i Gillis organizują gościnne wiosłowania i SUP programy jogi.
    - title: Operatorzy wycieczek i wypożyczalni
      description: Operatorzy wycieczek po lagunach i namorzynach oraz stanowiska z wynajmem godzinowym odświeżają floty sezonowo.
shipping_section:
  title: Statek do Indonezji
  paragraphs:
    - Indonezja jest jednym z najkrótszych szlaków towarowych od naszej bazy w Weihai w Chinach. Ekspresowe przewozy lotnicze szybko przewozą próbki i 1–3 zamówienia na pokład do Denpasar i Dżakarty; Consolidated Sea Freight obsługuje zamówienia hurtowe na 5–20 pokładów przez Tanjung Priok, Tanjung Benoa i inne porty. Obie opcje są podane wraz z szacowanymi czasami przeprawy do celu.
    - Dostarczamy wymagane faktury handlowe oraz listę pakowania, z poprawnymi kodami HS i deklarowanymi wartościami. Cła importowe i podatki są płacone przez importera zgodnie z indonezyjskimi przepisami.
  customs_note: Indonezyjska zrada sprzętu sportowego jest wrażliwa na dokumentację — współpracuj ze swoim agentem celnym (PPJK), aby potwierdzić aktualne traktowanie ceł i podatków. Zapewniamy kompletną, spójną dokumentację i szybko odpowiadamy na prośby brokerów.
faq_section:
  title: FAQ o Indonezji
  items:
    - q: Jak szybko przejeżdża transport z Chin na Bali?
      a: Indonezja jest jednym z naszych najbliższych miejsc transportowych z Weihai. Ekspresowe loty do Denpasar lub Dżakarty to najszybsza opcja dla próbek i małych zamówień; skonsolidowany transport morski jest wyceniany z oknem tranzytowym dla zamówień hurtowych. Oba są wymienione w Twojej wycenie.
    - q: Czy deski są odpowiednie do codziennego wynajmu w tropikalnych miejscach UV?
      a: Tak — drop-stitch PVC oferujemy flotom w 50 krajach przeznaczone do codziennych cykli wynajmu+. Standardowa pielęgnacja (płukanie po wodzie słonej, przechowywanie w cieniu) pozwala im działać przez wiele sezonów słońca na Bali.
    - q: Jak wygląda zamówienie w sklepie ze sportami wodnymi?
      a: Zazwyczaj 5–15 desek, mieszane pomiędzy stabilnymi modelami uniwersalnymi do lekcji i wynajmu a kilkoma ekskluzywnymi wydaniami artystycznymi do ekspozycji detalicznej — jedna wysyłka, cena ustalana według całkowitej ilości.
    - q: Czy możecie wesprzeć nasze PPJK dokumentacją?
      a: Tak. Każde zamówienie wysyłane jest z fakturą handlową i listą przewozową zawierającą poprawne kody HS oraz deklarowane wartości, a my szybko odpowiadamy, gdy Twój pośrednik potrzebuje dodatkowych dokumentów.
