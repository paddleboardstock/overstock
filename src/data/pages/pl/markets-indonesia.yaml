  - Hurtowo od 5 tablic — modele mieszane, wycenione według całkowitej ilości
  - Obsługa gospodarki sportów wodnych Bali oraz wyspiarskich kurortów w całym kraju
  - Krótkie trasy towarowe Chiny–Indonezja, zarówno powietrzne, jak i morskie
