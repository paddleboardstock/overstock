workshops_section:
  tagline: Warsztaty
  title: Warsztaty Produkcyjne
  workshops:
    - title: Cięcie PVC i Przygotowanie Materiału
      description: Automatyczne maszyny do cięcia CNC przetwarzają tkaniny PVC, Hypalon i drop-stitch z precyzją poniżej milimetra. Komputerowo zoptymalizowane układanie minimalizuje odpady materiałowe i zapewnia, że każdy panel spełnia swoją specyfikację wymiarową przed spawaniem.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Spawanie Rur i Uszczelnianie Termiczne
      description: Dedykowany warsztat spawalniczy z maszynami do uszczelniania termicznego i prasami dielektrycznymi RF. Nagrzewnice gorącego powietrza łączą i stapiają komory rur PVC, podczas gdy zgrzewy RF wytwarzają wysokowytrzymałe, szczelne szwy przekraczające wymagania ISO 9001.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Produkcja Kadłubów RIB — Włókno Szklane
      description: Kadłuby łodzi RIB są produkowane przy użyciu ręcznego formowania z włókna szklanego z systemami żywic poliestrowych i winyloestrowych. Każda warstwa jest ręcznie wałkowana i pakowana próżniowo dla zapewnienia stałej jakości. Kabina natryskowa żelkotu zapewnia wysokopołyskowe, odporne na UV wykończenie morskie.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: Druk SUP i Dekoracja
      description: Deski SUP są dekorowane przy użyciu druku cyfrowego do pełnokolorowych grafik i sitodruku do logo i powtarzalnych wzorów. Drukarki cyfrowe tworzą projekty pokładów w jakości fotograficznej, podczas gdy sitodruk zapewnia trwałe, żywe oznaczenia marki.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Montaż Końcowy i Olinowanie
      description: Linia montażowa, na której łączone są kadłuby z włókna szklanego i rury PVC, montowane są silniki, podłączane są układy kierownicze i sterownicze, a instalacje elektryczne są okablowane. Każda łódź przechodzi 100-punktową listę kontrolną montażu podpisaną przez lidera zespołu.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Testy Jakości i Inspekcja
      description: Każda ukończona łódź przechodzi obowiązkowy test retencji powietrza, weryfikację wytrzymałości szwów i pełną kontrolę systemów przed wysyłką. Nasze laboratorium jakości działa niezależnie od produkcji i raportuje bezpośrednio do kierownictwa.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
