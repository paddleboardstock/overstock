workshops_section:
  tagline: Warsztaty
  title: Warsztaty produkcyjne
  workshops:
    - title: PVC Cięcie i przygotowanie materiałów
      description: CNC Automatyczne maszyny tnące PVC drop-stitch przetwarzają i przetwarzają tkaniny z precyzją poniżej milimetra. Komputerowo zoptymalizowane zagnieżdżanie minimalizuje marnotrawstwo materiału i zapewnia, że każdy panel spełnia specyfikację wymiarową przed spawaniem.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Spawanie i uszczelnianie termiczne
      description: Dedykowany warsztat spawalnicze z maszynami do uszczelniania termicznego i prasami dielektrycznymi RF. Spawacze gorącym powietrzem łączą i drop-stitch przepalają warstwy rdzeniowe oraz taśmy szynowe, podczas gdy spawania RF dają szczelne szczeliny o wysokiej wytrzymałości.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Grafika talii i EVA wykończenie
      description: 'Tutaj kształtują się talie z serii art: EVA precyzyjnie cięte panele piankowe układane są w pełne wzory talii, klejone i ręcznie przycinane, by uzyskać chwytliwe, wygodne i trwałe wykończenie — charakterystyczny wygląd każdej planszy z serii artystycznych.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Druk i dekoracja
      description: SUP Plansze dekorowane są drukiem cyfrowym do pełnokolorowej grafiki oraz sitodrukiem dla logow i powtarzających się wzorów. Drukarki cyfrowe tworzą wzory tarasów o jakości fotograficznej, podczas gdy sitodruk zapewnia trwałe, wyraziste znaki marki.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Montaż końcowy i montaż
      description: Linia montażowa, na której deski otrzymują zawory, D-ringi, uchwyty, żebra i mocowania smyczy. Każda deska przechodzi według 100-punktowej listy kontrolnej montażu zatwierdzanej przez lidera zespołu.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Testowanie jakości i inspekcja
      description: Każda ukończona płyta przechodzi obowiązkowe testy zatrzymywania powietrza, weryfikację odklejania szwów oraz pełną kontrolę systemów przed wysyłką. Nasze laboratorium jakości działa niezależnie od produkcji i raportuje bezpośrednio do zarządu.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
