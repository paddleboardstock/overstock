qc_section:
  tagline: Kontrola jakości
  title: Proces testowania i zapewnienia jakości
  subtitle: Każda tablica przechodzi obowiązkowe testy przed wysyłką. Nasze laboratorium jakości działa niezależnie od produkcji i raportuje bezpośrednio do zarządu.
  steps:
    - step: '1'
      title: Inspekcja surowców
      desc: PVC a drop-stitch tkaniny przechodzą testy rozciągania, rozprzestrzenianie się rozdarć oraz UV weryfikację odporności przed wejściem do produkcji.
    - step: '2'
      title: 48-godzinny test utrzymania powietrza
      desc: Każda komora płyty jest napompowana do 125% ciśnienia znamionowego i utrzymwana przez 48 godzin. Spadek ciśnienia przekraczający 5% powoduje automatyczne odrzucenie i ponowną inspekcję szwów.
    - step: '3'
      title: Testy obciążenia i wyważenia
      desc: Gotowe deski są ładowane do maksymalnej dopuszczalnej wydajności i testowane pod kątem stabilności, wolnej burty oraz właściwości jazdy. Każda deska jest testowana wodą przed ostateczną inspekcją.
faq_section:
  tagline: Najczęściej zadawane pytania
  title: Najczęściej zadawane pytania
  questions:
    - q: Gdzie są twoje deski do wiosłowania?
      a: Każda deska jest produkowana w naszej własnej fabryce o powierzchni 12 000 m² w Weihai w Chinach. Nie zlecamy pracy na zewnątrz — projektowanie, materiały, spawanie, montaż i testowanie odbywają się pod jednym dachem, więc jakość nigdy nie zależy od zewnętrznej strony.
    - q: Jak to możliwe, że ceny są tak dużo niższe niż w sklepie?
      a: Sprzedajemy zapasy fabryczne i wyprzedaże bezpośrednio z naszego zakładu produkcyjnego — bez pośredników, bez marży detalicznej. Oznacza to SUP kompletne pakiety z rabatem do 60% od typowych cen detalicznych, z tą samą jakością testowaną przez ciśnienie.
    - q: Co jest dołączone do tablicy?
      a: 'Każdy SUP z nich jest kompletnym pakietem: deska, plecak podróżny, pompka ręczna, regulowane wiosło, zdejmowana statecznica, smycz spiralna oraz zestaw naprawczy.'
    - q: Jak szybko wysyłane są zamówienia?
      a: Zamówienia na stanie opuszczają naszą fabrykę Weihai w ciągu 2-3 dni roboczych z dostawą śledzoną do 50+ krajów UE, Ameryki Północnej, Azji i Pacyfiku oraz poza nią.
production_flow:
  tagline: Przepływ produkcji
  title: Od materiału do gotowej płyty
  subtitle: Każda tablica przechodzi przez 6 etapów produkcji z punktami kontrolnymi kontroli jakości na każdym etapie. Bez skrótów, bez pomijanych inspekcji.
  stages:
    - stage: '01'
      title: Odbiór materiałów i przychodząca kontrola jakości
      description: Wszystkie materiały napływające są rejestrowane według numeru partii/partii w ERP naszym systemie.PVC Rolki tkanin, drop-stitch rdzenie, zawory, kleje i osprzęt są kwarantannowe do czasu zatwierdzenia przez kontrolę jakości.
      qc_check: Wytrzymałość na rozciąganie, odporność na rozdarcie, grubość, lepkość kleju, skan defektów wzrokowych
      qc_threshold: Przetestowano 100% partii. Odrzucić, jeśli rozciąganie < 90% specyfikacji, rozdarcie < minimalna specyfikacja lub jakakolwiek wada wizualna
      responsibility: Przychodzący zespół ds. kontroli jakości (3 inspektorów)
    - stage: '02'
      title: Cięcie CNC i przygotowanie materiału
      description: Zoptymalizowane komputerowo zagnieżdżanie układa panele na magazynie PVC, aby zminimalizować ilość odpadów. Automatyczne maszyny do cięcia CNC utrzymują dokładność pozycjonowania na poziomie 0,1 mm.
      qc_check: Kontrola wymiarowa z plikami CAD DXF, kontrola jakości krawędzi, weryfikacja liczby paneli
      qc_threshold: Mierzono co 20. panel. Tolerancja ±0,5 mm. Odrzucić partię, jeśli >2% poza tolerancją
      responsibility: Prowadzenie warsztatu cięcia
    - stage: '03'
      title: Spawanie i łączenie metodą drop-stitch
      description: Rdzenie typu drop-stitch są łączone z zewnętrznymi laminatami PVC za pomocą laminowania na gorąco. Komory rurowe są spawane metodą RF lub gorącym powietrzem. Taśmy szynowe są klejone trójwarstwowo.
      qc_check: Testy osłabienia co 50 jednostek, pomiar szerokości spawu, przegląd dziennika temperatury gorącego powietrza, wizualna inspekcja szwu pod podświetleniem
      qc_threshold: Wytrzymałość na odrywanie min. 8 N/cm. Tolerancja szerokości spoiny ±1 mm. Wszelkie widoczne channelingi = odrzucenie
      responsibility: Kontrola jakości spawania (2 inspektorów na zmianę)
    - stage: '04'
      title: Montaż i riggowanie
      description: 'Deski przechodzą do końcowego montażu, gdzie wszystkie komponenty są instalowane: zawory, D-ringi, uchwyty, boxy na stateczniki oraz montaż torby transportowej. Każda jednostka przechodzi 100-punktową listę kontrolną montażu.'
      qc_check: Podpisanie 100-punktowej listy kontrolnej na jednostkę, test działania zaworu (10 cykli otwierania/zamykania), weryfikacja momentu obrotowego sprzętu, kontrola wizualna
      qc_threshold: Polityka zerowej tolerancji dla elementów krytycznych dla bezpieczeństwa (zawory, D-ringi, uchwyty). Drobne wady kosmetyczne w ramach ścisłych limitów kosmetycznych.
      responsibility: Lider zespołu montażowego + linia kontroli jakości
    - stage: '05'
      title: Próba ciśnieniowa i utrzymanie jakości
      description: Każdą komorę napompowuje się do ciśnienia znamionowego 1,25 × (zwykle 20–25 PSI) i trzyma przez 24–48 godzin. Czujniki ciśnienia rejestrują się w sposób ciągły. Komory przekraczające 5% spadek ciśnienia są odrzucane i wysyłane do ponownej kontroli szwu.
      qc_check: 24-godzinny dziennik utrzymywania ciśnienia, codzienna weryfikacja kalibracji czujnika, odczyt ciśnienia z kompensacją temperatury, ponowny test szwu po naprawie
      qc_threshold: Maksymalny spadek ciśnienia 5% w ciągu 24 godzin przy stabilnej temp. Każda komora przekraczająca tę wartość = 100% ponownego badania całej partii produkcyjnej
      responsibility: Laboratorium Jakości (niezależne od produkcji, raporty dla kierownictwa)
    - stage: '06'
      title: Kontrola końcowa i pakowanie
      description: Końcowa kontrola wizualna i funkcjonalna. Wady powierzchni, zgodność kolorów, weryfikacja etykiety/BIN, integralność opakowania i kompletność akcesoriów. Jednostki są pakowane próżniowo, pudła i paletyzowane do załadunku w kontenerach.
      qc_check: Pełna kontrola wizualna, lista kontrolna akcesoriów według SKU, test upadku opakowania (1 m, próbka losowa), weryfikacja skanu etykiety/kodu kreskowego
      qc_threshold: Brak tolerancji dla wad wpływających na bezpieczeństwo. Wady kosmetyczne w ramach ścisłych limitów. 100% jednostek poddawanych inspekcji wizualnej.
      responsibility: Końcowy zespół ds. kontroli jakości (4 inspektorów) + lider zespołu pakującego
workforce:
  tagline: Nasi ludzie
  title: Siła robocza i wiedza specjalistyczna
  engineers: 25+
  engineers_detail: Inżynierowie zajmujący się badaniami i rozwojem, projektowaniem form, laboratorium materiałowym i inżynierią produkcji. Średnio ponad 7 lat w produkcji nadmuchiwanych produktów.
  shift_pattern: 2 zmiany/dzień (07:00–15:30, 15:30–00:00). Opcjonalna zmiana nocna w przypadku pilnych zamówień.
  training: Comiesięczne szkolenie QC, kwartalne ćwiczenia bezpieczeństwa, roczna ocena umiejętności. Nowi pracownicy przechodzą 40-godzinne szkolenie wstępne przed rozpoczęciem pracy na linii produkcyjnej.
  departments:
    - name: Badania i rozwój oraz inżynieria
      count: 25+
      role: Projektowanie produktu, inżynieria form, laboratorium materiałowe
    - name: Cięcie i przygotowanie materiału
      count: 15
      role: Cięcie CNC, przygotowanie panelu, obsługa materiału
    - name: Spawanie i laminowanie
      count: 40
      role: Zgrzewanie RF, zgrzewanie gorącym powietrzem, klejenie metodą drop-stitch
    - name: Dekorowanie deski i wykończenia
      count: '25'
      role: Układanie pokładu EVA, wykończenia serii artystycznej
    - name: Montaż i riggowanie
      count: 35
      role: Montaż końcowy, instalacja sprzętu, sprawdzenie systemów
    - name: Kontrola jakości
      count: 12
      role: Kontrola przychodząca, kontrola jakości w trakcie procesu, kontrola końcowa, testy laboratoryjne
    - name: Logistyka i pakowanie
      count: 20
      role: Pakowanie, załadunek kontenerów, dokumentacja eksportowa
    - name: Zarządzanie i administracja
      count: 15
      role: Sprzedaż, zakupy, HR, finanse, compliance
material_traceability:
  tagline: Śledzenie pochodzenia
  title: Śledzenie materiałów i kontrola partii
  description: Każda partia surowca otrzymuje unikalny numer partii w naszym systemie ERP. Od przybycia, przez produkcję, aż do gotowego produktu, lista materiałów każdego deski odsyła do oryginalnej partii dostawcy. To umożliwia pełną śledzalność wsteczną w przypadku każdej kontroli jakości.
  system: Niestandardowy ERP (system wewnętrzny) + fizyczne znaczniki partii na każdym zleceniu pracy
  coverage: 100% materiałów produkcyjnych — PVC, drop-stitch tkanina, EVA pianka, kleje, zawory, elementy metalowe, opakowania
  records_retained: 10 lat
