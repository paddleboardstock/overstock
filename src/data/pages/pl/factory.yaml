qc_section:
  tagline: Kontrola Jakości
  title: Proces Testowania i Zapewnienia Jakości
  subtitle: Każda łódź przechodzi obowiązkowe testy przed wysyłką. Nasze laboratorium jakości działa niezależnie od produkcji i raportuje bezpośrednio do kierownictwa.
  steps:
    - step: '1'
      title: Inspekcja Surowców
      desc: Tkaniny PVC, Hypalon i drop-stitch przechodzą test wytrzymałości na rozciąganie (ASTM D751), propagację pęknięcia i weryfikację odporności na UV, zanim jakakolwiek partia wejdzie do produkcji.
    - step: '2'
      title: 48-godzinny Test Retencji Powietrza
      desc: Każda komora rury jest nadmuchiwana do 125% ciśnienia nominalnego i utrzymywana przez 48 godzin. Spadek ciśnienia powyżej 5% powoduje automatyczne odrzucenie i ponowną inspekcję szwu.
    - step: '3'
      title: Test Obciążenia i Równowagi
      desc: Ukończone łodzie są obciążane do maksymalnej ładowności nominalnej i testowane pod kątem stabilności, wolnej burty i prowadzenia. Każda jednostka jest testowana na wodzie przed końcową inspekcją.
oem_section:
  tagline: Projekty OEM
  title: Studia Przypadków Partnerstw Marki i OEM
  subtitle: Od koncepcji do kontenera — jak pomagamy globalnym markom uruchamiać i skalować linie łodzi nadmuchiwanych.
  cases:
    - challenge: Europejski sprzedawca detaliczny outdoor potrzebował linii SUP pod własną marką z unikalnymi grafikami pokładu, ekologicznym PVC i opakowaniem gotowym do sprzedaży — wszystko dostarczone w 60 dni.
      solution: Opracowaliśmy niestandardowe pliki druku cyfrowego, pozyskaliśmy PVC zgodne z REACH i skompresowaliśmy proces próbkowania z 3 rund do 1, umieszczając zespół projektowy w naszej fabryce w Qingdao.
      result: 55 dni od podpisania zamówienia do FOB. 2.400 jednostek w 4 SKU. Zamówienie powtórzone przed przybyciem pierwszego kontenera.
    - challenge: Amerykański startup sportów wodnych potrzebował wysokowydajnego kajaka drop-stitch z niestandardowym kształtem kadłuba, wspólnym brandingiem opakowania i certyfikatem BSCI do umieszczenia w sprzedaży detalicznej.
      solution: Dostosowaliśmy istniejącą formę kajaka drop-stitch ze zmodyfikowanym profilem rocker, opracowaliśmy grafikę opakowania ze wspólnym brandingiem i zapewniliśmy pełną dokumentację audytu BSCI.
      result: Z powodzeniem wprowadzony do 3 głównych amerykańskich sieci outdoor. Ponad 5.000 jednostek w pierwszym roku z 98% wskaźnikiem sprzedaży.
    - challenge: Australijski dystrybutor potrzebował certyfikowanej CE gamy RIB z niestandardowymi kolorami rur, opcją modernizacji do Hypalon i zgodnością z australijską normą AS 1799.
      solution: Wyprodukowaliśmy próbki przedprodukcyjne z 4 wariantami kolorów rur, pozyskaliśmy CSM Hypalon od japońskiego dostawcy i skoordynowaliśmy testy zgodności z AS 1799 przez stronę trzecią.
      result: Gama 3 modeli RIB wprowadzona na rynek AU/NZ. Następnie wygrany przetarg rządowy na 12 RIB-ów patrolowych.
faq_section:
  tagline: FAQ
  title: Często Zadawane Pytania B2B i OEM
  questions:
    - q: Jaka jest minimalna ilość zamówienia (MOQ) dla OEM nadmuchiwanych desek SUP?
      a: MOQ zaczyna się od 5–10 sztuk dla standardowych modeli OEM. Niestandardowe formy i projekty pod własną marką wymagają minimum 200 sztuk, w zależności od złożoności. Zamówienia próbne i serie wzorcowe są dostępne dla nowych marek.
    - q: Czy Paddle Board Overstock posiada certyfikat BSCI?
      a: Tak. Nasza fabryka utrzymuje ważny certyfikat zgodności społecznej BSCI (raport z audytu dostępny na żądanie). Posiadamy również ISO 9001:2015 do zarządzania jakością, a 64 naszych modeli posiada certyfikat CE (TÜV Rheinland). Dokumentacja zgodności REACH i RoHS jest dostarczana z każdą przesyłką OEM.
    - q: Jaki jest typowy czas realizacji zamówienia OEM?
      a: Standardowy czas realizacji to 30–45 dni od potwierdzonego zamówienia i zaliczki. Rozwój niestandardowej formy dodaje 15–20 dni na oprzyrządowanie. Oferujemy przyspieszoną produkcję dla pilnych zamówień i sezonowych szczytów w okresie przedletnim (sty–mar).
    - q: Czy możecie wysłać FOB Qingdao lub CIF do naszego portu?
      a: Tak. Wysyłamy FOB Qingdao, CIF do głównych portów świata oraz DDP dla kwalifikowanych partnerów. Nasz zespół logistyczny zarządza rezerwacją kontenerów, dokumentacją eksportową i odprawą celną. Wysyłamy do ponad 50 krajów na rynkach UE, USA, AU i Azji.
b2b_moq: 'Standardowe MOQ: 5–10 sztuk na model (SUP/kajak/drop-stitch). MOQ RIB: 2–5 sztuk. Zamówienia próbne mile widziane dla nowych partnerstw.'
