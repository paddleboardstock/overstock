hero:
  tagline: Fabryka
  title: Fabryka i produkcja
  subtitle: 12 000 m2 zintegrowanej produkcji — od surowca po gotową płytę
intro:
  - Jako marka fabryczna **Paddle Board Overstock Weihai Manufacturing Hub**, Paddle Board Overstock kontroluje każdy etap produkcji — od nadejścia surowców PVC i drop-stitch materiałów po końcową inspekcję przeddostawową gotowej deski. Nasz zakład produkcyjny w Strefie Rozwoju Gospodarczego Weihai zajmuje powierzchnię 12 000 metrów kwadratowych i mieści specjalne warsztaty do PVC cięcia, uszczelniania termicznego i spawania, wykańczania dekoracji tarasów, końcowego montażu oraz testów jakości.
  - Integrując projektowanie, inżynierię, prototypowanie, produkcję i testowanie pod jednym dachem, eliminujemy nieefektywności produkcji kontraktowej i zachowujemy bezpośrednią kontrolę nad jakością wykonania, wyborem materiałów i terminami dostaw. Każda deska opuszczająca nasz warsztat jest budowana przez naszych ludzi, na naszym sprzęcie, według naszych standardów.
