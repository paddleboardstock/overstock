stories:
  tagline: Historie Odkrywcy
  title: Prawdziwe przygody prawdziwych ludzi
  subtitle: Posłuchaj kajakarzy, rodzin i profesjonalistów korzystających Paddle Board Overstock ze sprzętu na wodzie.
  items:
    - name: Sarah & Mike
      title: SUP Właściciele Explorer 11, Kanada
      content: Zabraliśmy nasze Explorer 11 na tygodniową wycieczkę po Algonquin Park. Świetnie radziły sobie z przenoszeniami i przeprawami przez jezioro. drop-stitch Budowa pozwoliła nam napompować do 15 i PSI uzyskać twardą deskę z deski do składania.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Algonquin Park, Kanada
    - name: Carlos R.
      title: Jeździec Cheetah Surge, Hiszpania
      content: Cheetah Surge to mój wybór na rejsach nadmorskich. Żywy design przyciąga wzrok na plaży, a stabilność daje mi pewność w lekkim falowaniu wody. Świetnie się prowadzi, zarówno podczas trasy, jak i po prostu ciesząc się zachodem słońca.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Hiszpania
    - name: Lina i rodzina
      title: Płynący Lotus, Szwecja
      content: Weekendowe rodzinne przygody na archipelagu. Flowing Lotus jest na tyle stabilny, że moja córka może na nim stanąć, podczas gdy ja wiosłuję. Pompuje się w mniej niż 10 minut — nie potrzeba przyczepy, po prostu czysta rodzinna zabawa na wodzie.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Archipelag sztokholmski, Szwecja
    - name: Andres D.
      title: Ocean Voyager explorer, Filipiny
      content: Używam mojego Ocean Voyagera do długodystansowych wycieczek po wybrzeżu Palawanu. Po miesiącach codziennego użytkowania w tropikalnych warunkach deska nadal działa jak nowa. Kształt do touringu przecina chwycenie, które zatrzymałoby słabsze deski.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipiny
    - name: Emma T.
      title: Tropical Breeze dla początkujących, Australia
      content: Nigdy wcześniej nie jeździłem na SUP. Tropical Breeze jest tak stabilna, że poczułem się pewnie już przy pierwszej próbie. Teraz wiosłuję każdy weekend. Krzywa nauki jest praktycznie zerowa — a deska wygląda niesamowicie na wodzie.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australia
