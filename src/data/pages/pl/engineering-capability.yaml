content_capability:
  tagline: Możliwości inżynieryjne
  title: Co zapewnia nasz zespół inżynieryjny<br />
  subtitle: Inżynieria Aquafarer obejmuje pełny cykl życia produktu — od badań rynku i projektu koncepcyjnego, poprzez prototypowanie, testowanie i masową produkcję.
  items:
    - title: Wzornictwo Przemysłowe
      description: Nasz zespół ds. projektów przemysłowych opiera się na wymaganiach klientów, badaniach rynku i analizach konkurencji, aby opracować koncepcje produktów, które równoważą estetykę, funkcjonalność i łatwość produkcji. Tworzymy szkice 2D, renderingi 3D i dokumenty specyfikacji do wglądu klienta przed przystąpieniem do oprzyrządowania.
      features:
        - Rozwój koncepcji i badania wykonalności
        - Rysunki projektowe 2D i renderowanie 3D
        - Dobór i specyfikacja materiałów
        - Analiza projektowania pod kątem produkcji (DFM)
        - Ocena ergonomii i bezpieczeństwa
    - title: Inżynieria konstrukcyjna
      description: Nasi inżynierowie konstrukcyjni specjalizują się w architekturze pontonów — projektowaniu kadłuba, konfiguracji komór rurowych, inżynierii rdzenia metodą drop-stitch i rozkładzie obciążenia. Każdy projekt jest analizowany pod kątem integralności strukturalnej, optymalizacji masy i zgodności z odpowiednimi normami (CE, ISO, AS).
      features:
        - Projektowanie kadłubów z włókna szklanego w kształcie głębokiego V z obliczonymi kątami dna
        - Konfiguracja wielokomorowych balonów dla bezpieczeństwa i wyporności
        - Specyfikacja rdzenia drop-stitch i optymalizacja gęstości
        - Analiza metodą elementów skończonych dla elementów nośnych
        - Obliczenia rozkładu masy i stateczności
    - title: Modelowanie 3D i CAD
      description: Wszystkie projekty produktów są opracowywane w formacie 3D CAD przed rozpoczęciem tworzenia prototypów. Nasi inżynierowie używają SolidWorks i Rhino 3D do modelowania produktów, umożliwiając klientom sprawdzenie każdego szczegółu – od profilu rury po układ konsoli – przed przystąpieniem do produkcji.
      features:
        - Pełne modelowanie 3D CAD w programach SolidWorks i Rhino 3D
        - Fotorealistyczne renderowanie do prezentacji dla klientów
        - Pakiety rysunków technicznych dla produkcji
        - Projektowanie form i oprzyrządowania na podstawie modeli 3D
        - Bezpośredni transfer danych z CAD do CNC do precyzyjnego cięcia
    - title: Prototypowanie i testowanie
      description: Przed masową produkcją każdy nowy produkt przechodzi fazę prototypu. Budujemy funkcjonalne prototypy do oceny klienta, a następnie poddajemy je naszemu pełnemu protokołowi testów — próbom ciśnieniowym, testom stabilności, testom obciążeniowym i próbom wodnym. Iteracje projektu na etapie prototypu są szybkie i opłacalne.
      features:
        - Szybkie oprzyrządowanie prototypowe (realizacja 15-20 dni)
        - Prototyp funkcjonalny do oceny w warunkach rzeczywistych
        - Pełny protokół testów przed zatwierdzeniem produkcji
        - Iteracyjne doskonalenie projektu na podstawie wyników testów
        - Kamień milowy zatwierdzenia przez klienta przed oprzyrządowaniem produkcyjnym
    - title: Niestandardowa integracja akcesoriów
      description: Wiele projektów OEM wymaga integracji akcesoriów dostarczonych przez klienta lub innych firm — niestandardowych konsol, specjalistycznych siedzeń, systemów elektronicznych, uchwytów do sprzętu nurkowego lub elementów brandingu. Nasz zespół inżynierów zarządza projektem integracji, adaptacją konstrukcyjną i walidacją jakości wszystkich akcesoriów.
      features:
        - Projektowanie konsol i układ panelu przyrządów
        - Integracja niestandardowych siedzeń i tapicerki
        - Projektowanie i okablowanie systemów elektronicznych
        - Systemy mocowania sprzętu do nurkowania i ratownictwa
        - Specyfikacje nanoszenia brandingu i grafiki
content_process:
  tagline: Proces rozwoju
  title: Od koncepcji<br />do produkcji
  subtitle: Nasz proces opracowywania produktów przebiega według zorganizowanego, 6-etapowego przepływu pracy, którego celem jest minimalizacja ryzyka, skrócenie terminów i zapewnienie gotowości produkcyjnej od pierwszego dnia.
  stages:
    - stage: '01'
      title: Wymagania i badania
      duration: 1-2 tygodnie
      description: Współpracujemy z klientem w celu zdefiniowania specyfikacji produktu, wymagań rynku docelowego, potrzeb w zakresie zgodności z przepisami i celów komercyjnych. Na tym etapie powstaje dokument wymagań produktu (PRD), który stanowi wytyczne dla wszystkich dalszych prac.
      deliverables: PRD, analiza rynku, benchmark konkurencyjny, wstępny kosztorys
    - stage: '02'
      title: Projekt koncepcyjny
      duration: 2-3 tygodnie
      description: Zespół projektantów przemysłowych opracowuje koncepcje produktów w oparciu o PRD. Przedstawiono wiele opcji projektowych z renderingami 3D, zaleceniami materiałowymi i wstępnymi ocenami inżynieryjnymi. Klient wybiera kierunek szczegółowego rozwoju.
      deliverables: Wizualizacja koncepcji 3D, specyfikacja materiałów, uzasadnienie projektu, wstępne BOM
    - stage: '03'
      title: Szczegółowa inżynieria
      duration: 2-4 tygodnie
      description: Wybrana koncepcja jest w pełni opracowana — modelowanie 3D CAD, analiza strukturalna, konfiguracja rur, projekt kadłuba, integracja akcesoriów i dokumentacja produkcyjna. Wszystkie wymiary, materiały i procesy są określone dla oprzyrządowania.
      deliverables: Pełny model 3D CAD, rysunki techniczne, ostateczne zestawienie komponentów, specyfikacje narzędzi, plan kontroli jakości
    - stage: '04'
      title: Prototypowanie
      duration: 2-3 tygodnie
      description: Produkowane jest oprzyrządowanie prototypowe i budowane są próbki funkcjonalne. Klient sprawdza prototyp pod kątem specyfikacji PRD. Testowanie przeprowadza się zgodnie z ustalonym protokołem. Korekty projektu wprowadzane są na podstawie informacji zwrotnych przed użyciem narzędzi produkcyjnych.
      deliverables: Funkcjonalny prototyp, raport z testów, dziennik zmian projektu, dokument podpisu klienta
    - stage: '05'
      title: Oprzyrządowanie produkcyjne
      duration: 2-3 tygodnie
      description: Po zatwierdzeniu prototypu uruchamiane jest oprzyrządowanie produkcyjne — formy, przyrządy spawalnicze, programy cięcia, osprzęt montażowy. Dokumentacja kontroli jakości i kryteria kontroli zostały sfinalizowane. Przeprowadzono próbę w celu walidacji procesu.
      deliverables: Oprzyrządowanie produkcyjne, dokumentacja procesu, plan kontroli jakości, raport z przebiegu próbnego
    - stage: '06'
      title: Produkcja masowa i kontrola jakości
      duration: Bieżący
      description: Pełna produkcja rozpoczyna się od kontroli jakości w procesie na każdym etapie. Pierwsze artykuły są sprawdzane i zatwierdzane przed zwolnieniem partii. Bieżące monitorowanie jakości, śledzenie defektów i ciągłe doskonalenie w całym cyklu produkcyjnym.
      deliverables: Harmonogram produkcji, raporty kontroli jakości, zapisy identyfikowalności partii, dokumentacja wysyłkowa
content_customization:
  tagline: Opcje dostosowywania
  title: Co można<br />spersonalizować
  subtitle: Prawie każdy aspekt naszych produktów można dostosować do wymagań klienta. Poniżej znajdują się najczęstsze kategorie dostosowywania.
  columns: 3
  items:
    - title: Kadłub i konstrukcja
      description: Niestandardowa długość kadłuba, szerokość belki, kąt wzniesienia, średnica rury, konfiguracja komory i gatunek materiału.
      icon: tabler:sailboat
    - title: Kolory i grafika
      description: Kolor tuby (PVC/Hypalon), kolor żelkotu kadłuba, kolor konsoli, grafika pokładu, rozmieszczenie logo i projekt opakowania.
      icon: tabler:palette
    - title: Konsola i sterowanie
      description: Konsola środkowa, konsola boczna lub sterowanie rumplem. Niestandardowy układ tablicy przyrządów, rozmieszczenie przełączników i pozycja steru.
      icon: tabler:steering-wheel
    - title: Siedzenia i tapicerka
      description: Fotele dżokejowe, ławki, luksusowa tapicerka, dopasowane kolorystycznie szwy, konfiguracje składane lub zdejmowane.
      icon: tabler:armchair
    - title: Akcesoria i sprzęt
      description: Drabinki nurkowe, stojaki na zbiorniki, słupy holownicze, blaty T, blaty Bimini, systemy dźwiękowe, elektronika nawigacyjna i sprzęt bezpieczeństwa.
      icon: tabler:backpack
    - title: Opakowanie i marka
      description: Niestandardowe opakowania detaliczne, pudełka pod marką własną, kartony wysyłkowe ze znakami marki, przywieszki i instrukcje obsługi w języku klienta.
      icon: tabler:box
content_industries:
  tagline: Zastosowania branżowe
  title: Rozwiązania inżynieryjne<br />według branży
  subtitle: Nasz zespół inżynierów opracował produkty do szerokiego zakresu zastosowań morskich — każdy z odrębnymi wymaganiami i kryteriami wydajności.
  columns: 3
  items:
    - title: Operacje nurkowe
      description: Wzmocnione pokłady, integracja drabinek nurkowych, systemy przechowywania zbiorników i stabilne platformy dla komercyjnych centrów nurkowych na całym świecie.
      icon: tabler:lifebuoy
    - title: Ratownictwo i sytuacje awaryjne
      description: Projekty kadłubów szybkich, pokładów samoczynnie ratujących się, systemów mocowania sprzętu i wielokomorowych konfiguracji bezpieczeństwa do operacji SAR.
      icon: tabler:alert-triangle
    - title: Turystyka morska
      description: Układy zapewniające wygodę pasażerom, integracja osłon przeciwsłonecznych, systemy wsiadania i konfiguracje oszczędzające paliwo w przypadku operacji transferu na wyspy.
      icon: tabler:beach
    - title: Tendery jachtowe
      description: Kompaktowe konstrukcje do przechowywania żurawików, opcje luksusowego wykończenia, pasujące kolory statku-matki i wysoka wydajność holowania.
      icon: tabler:sailboat
    - title: Rybołówstwo i akwakultura
      description: Konfiguracje z płaskim pokładem, integracja zbiorników na żywe zwierzęta, układy uchwytów na wędki, osprzęt odporny na korozję umożliwiający ciągłą ekspozycję na słoną wodę.
      icon: tabler:fish
    - title: Portowe i przemysłowe
      description: Wzmocnienie kadłuba o dużej wytrzymałości, układy łodzi roboczych, konfiguracje transportu personelu i integracja sprzętu do operacji na morzu.
      icon: tabler:ship
