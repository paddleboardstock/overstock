features3_reasons:
  tagline: Dlaczego wybrać Paddle Board Overstock
  title: Siedem powodów, aby nawiązać z nami współpracę
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Prawdziwa produkcja, nie handel
      description: Posiadamy i prowadzimy fabrykę o powierzchni 12 000 m². Kiedy kupujesz od Paddle Board Overstock, kupujesz bezpośrednio od osób, które projektują, konstruują i budują twoją deskę — bez pośredników, bez marży detalicznej.
      icon: tabler:building-factory
    - title: 2. Podejście ukierunkowane na inżynierię
      description: Nasz proces projektowania zaczyna się od przypadku użycia, a nie od kategorii produktu. Optymalizujemy kształt kadłuba, dobór materiałów i konfigurację w zależności od tego, jak deska będzie faktycznie używana.
      icon: tabler:engine
    - title: 3. Sprawdzona jakość
      description: Każda płyta jest w 100% testowana pod kątem ciśnienia przy 1,25x wartości nominalnej PSI przed wysyłką. Wskaźnik bezwadliwości na poziomie 99,3% — mierzony w każdej partii, a nie tylko deklarowany.
      icon: tabler:shield-check
    - title: 4. Projekt z myślą o wioślarzu
      description: 'Grafika na pokładzie, seria kolorów, uchwyty na akcesoria i kompletne zestawy — deski zaprojektowane z myślą o prawdziwym wiosłowaniu: turystyce, jodze, wędkarstwie, fitnessie i rodzinnej zabawie.'
      icon: tabler:swimming
    - title: 5. Logistyka globalna
      description: Bezpośrednia wysyłka z naszej fabryki w Weihai do wioślarzy w 50+ krajach, z pełnym śledzeniem i obsługą celną.
      icon: tabler:truck-delivery
    - title: 6. Dożywotnie wsparcie
      description: Wspieramy płyty, które zbudowaliśmy lata temu. Oryginalne części zamienne, porady techniczne, wskazówki dotyczące naprawy — nasz zespół jest dostępny, gdy go potrzebujesz.
      icon: tabler:lifebuoy
    - title: 7. Uczciwe Specyfikacje
      description: Rzeczywiste wartości nośności, rzeczywiste wymiary, rzeczywista waga. Żadnej marketingowej przesady. To, co publikujemy, otrzymujesz — potwierdzone przez niezależne testy.
      icon: tabler:ruler-measure
testimonials:
  tagline: Zaufany przez marki na całym świecie
  title: Co mówią nasi partnerzy
  items:
    - content: Moja deska dotarła fabrycznie nowa ze wszystkim w pudełku. Po dwóch sezonach cotygodniowego pływania wciąż idealnie trzyma powietrze.
      name: — Sarah M., wioślarz weekendowy, Floryda
    - content: Porównywałam specyfikacje przez tygodnie przed zakupem. Paddle Board Overstock była jedyną marką publikującą rzeczywiste wagi i rzeczywiste ciśnienia. To, co podają, zgadza się z rzeczywistością.
      name: — Tomasz K., wioślarz turystyczny, Polska
    - content: Cała rodzina teraz wiosłuje. Zaczęliśmy od jednej deski, a skończyliśmy na czterech — jakość ułatwiła decyzję.
      name: — Angela R., wioślarz rodzinny, Australia
