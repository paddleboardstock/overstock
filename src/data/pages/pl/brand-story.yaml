hero:
  tagline: Nasza Historia
  title: 'Aquafarer — inżynieria wolności na wodzie'
  subtitle: 'Od nadmorskiego warsztatu po globalnego producenta sprzętu wodnego — nasza droga opiera się na upartym przekonaniu: jednostki pływające powinny być projektowane tak, jakby miały znaczenie. Bo mają.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Fabryka Aquafarer i zakład produkcji sprzętu wodnego w Qingdao
