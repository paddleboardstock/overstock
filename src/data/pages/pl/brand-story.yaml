content_founding:
  tagline: Początki
  title: 'Narodziny na nabrzeżu'
  subtitle: 'Aquafarer powstał w nadmorskim warsztacie w Qingdao z jednym pontonem i jedną wizją: budować nadmuchiwane jednostki, które poradzą sobie w realnych warunkach morskich.'
  paragraphs:
    - 'W 2012 roku nasi założyciele dostrzegli lukę na rynku — większość pontonów była albo tania, ale zawodna, albo wysokiej jakości, ale niewspółmiernie droga. Uwierzyli, że jest miejsce dla producenta łączącego jakość i wartość.'
    - 'Pierwszy kadłub zbudowano ręcznie, przetestowano na lokalnych wodach i udoskonalono na podstawie prawdziwych opinii rybaków i małych operatorów komercyjnych. Ten cykl — buduj, testuj, słuchaj, ulepszaj — pozostaje do dziś sercem naszej filozofii inżynieryjnej.'
    - 'Do 2015 roku o nas usłyszano poza Qingdao. Międzynarodowi dystrybutorzy zaczęli zamawiać próbki. To, co zaczęło się jako lokalny warsztat, stawało się globalnym dostawcą.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Wczesny warsztat produkcyjny Aquafarer
content_growth:
  tagline: Rozwój i innowacje
  title: 'Od warsztatu do zakładu o powierzchni 12,000 m²'
  subtitle: 'Ciągłe inwestycje w ludzi, sprzęt i procesy przekształciły Aquafarer w nowoczesny zakład produkcji sprzętu wodnego.'
  paragraphs:
    - 'Wraz z rosnącym popytem rosła nasza fabryka. Rozwinęliśmy się z małego warsztatu do fabryki o powierzchni 12,000 m² z dedykowanymi liniami produkcyjnymi dla łodzi RIB, pontonów, desek SUP i akcesoriów.'
    - 'Zainwestowaliśmy w maszyny tnące CNC, wysokoczęstotliwościowe urządzenia spawalnicze, linie produkcyjne drop stitch i kompleksowe stanowiska testowe — dzięki czemu kontrolujemy każdy aspekt jakości produkcji.'
    - 'Dziś nasz zespół liczący 200-300 osób obejmuje inżynierów okrętowych, materiałoznawców, specjalistów kontroli jakości i wykwalifikowanych rzemieślników — wielu z nich jest z Aquafarer od pierwszych dni.'
content_mission:
  tagline: Nasza misja
  title: 'Inżynieria wolności na wodzie'
  subtitle: 'Każdy produkt Aquafarer ma pomagać ludziom odkrywać, pracować i rozwijać się na wodzie — niezawodnie, bezpiecznie i w przystępnej cenie.'
  list:
    - 'Projektować jednostki, które sprawdzają się w realnych warunkach morskich — nie tylko na papierze'
    - 'Budować trwałe partnerstwa z dystrybutorami i markami dzięki niezawodnej obsłudze OEM/ODM'
    - 'Ciągle doskonalić procesy produkcyjne, aby dostarczać większą wartość'
    - 'Wspierać każdy produkt oryginalnymi częściami zamiennymi i wiedzą techniczną'
cta:
  title: 'Gotowy do współpracy z producentem,<br />któremu zależy na jakości?'
  subtitle: 'Skontaktuj się z naszym zespołem, aby omówić swój projekt OEM/ODM — bez presji minimalnego zamówienia, tylko uczciwe doradztwo.'
  actions:
    - variant: primary
      text: Rozpocznij rozmowę
      href: /contact
    - text: Poznaj nasze produkty
      href: /products
