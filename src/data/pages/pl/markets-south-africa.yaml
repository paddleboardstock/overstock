  title: SUP Hurtowe zarządy dla<br />Detaliści z RPA
  subtitle: Warsztaty i operatorzy Kapsztadu, Durbanu i Garden Route — zupełnie nowe nadmiarowe deski paddle boardów z 5 egzemplarzy, modele mieszane, wysłane z Chin.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
