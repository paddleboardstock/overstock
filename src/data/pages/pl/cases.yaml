features3_cases:
  tagline: Polecane przypadki
  title: Rozwiązania niestandardowe<br />Dla prawdziwych wyzwań
  isBeforeContent: false
  columns: 3
  items:
    - title: Aktualizacja codziennych operacji centrum nurkowego Bali
      customer: Centrum nurkowe Blue Ocean
      country: Indonezja
      industry: Komercyjne Centrum Nurkowe
      challenge: Centrum nurkowe Blue Ocean na Bali obsługiwało starszą łódź nurkową z włókna szklanego z ograniczoną przestrzenią na pokładzie, trudnym wejściem na pokład dla nurków i wymagającymi konserwacji w tropikalnych warunkach słonowodnych. Załadunek sprzętu był zatłoczony, czas przygotowania długi, a niestabilna platforma stwarzała zagrożenie dla bezpieczeństwa turystów zagranicznych – w tym osób nurkujących po raz pierwszy i starszych podróżnych. Ośrodek organizuje 3-5 wypraw nurkowych dziennie, ponad 200 dni w roku.
      solution: Firma Paddle Board Overstock dostarczyła niestandardową łódź do nurkowania Professional Diving RIB o długości 6,8 m z rozszerzonym układem pokładu zoptymalizowanym do przechowywania sprzętu do nurkowania, szeroką drabiną nurkową ze stali nierdzewnej, wytrzymałymi rurami Hypalon zapewniającymi odporność na promieniowanie UV i słoną wodę, antypoślizgową powierzchnią pokładu i rozwiązaniem do przechowywania zbiorników. Konfiguracja została zaprojektowana z myślą o codziennej pracy w centrum nurkowym — a nie w oparciu o standardowy układ łodzi rekreacyjnej.
      product: 6,8 m Profesjonalne nurkowanie RIB
      results: Większy obszar roboczy poprawił efektywność przygotowania sprzętu. Nurkowie doświadczyli bezpieczniejszego i łatwiejszego wejścia na pokład. Wymagania konserwacyjne zostały znacznie zmniejszone. Centrum zyskało zdolność do obsługi większej liczby klientów w szczycie sezonu z większą pewnością. RIB stał się podstawą codziennych operacji nurkowych.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Nasza łódź nurkowa to nie tylko transport. Stanowi podstawę naszego codziennego działania. Paddle Board Overstock RIB daje naszemu zespołowi większą pewność siebie podczas wykonywania wielu wypraw nurkowych każdego dnia.
      icon: tabler:lifebuoy
    - title: Aktualizacja centrum nurkowego Phuket Professional RIB
      customer: Centrum nurkowe Ocean Explorer
      country: Tajlandia
      industry: Komercyjne Centrum Nurkowe
      challenge: Centrum nurkowe Ocean Explorer w Phuket w Tajlandii wymagało modernizacji tradycyjnej łodzi nurkowej z włókna szklanego, która nie nadążała za rosnącym zapotrzebowaniem klientów. Ograniczona przestrzeń na pokładzie sprawiała, że ​​przygotowanie sprzętu było nieefektywne. Trudne wejście na pokład stworzyło wyzwania w zakresie bezpieczeństwa dla turystów międzynarodowych. Wysokie wymagania konserwacyjne w warunkach tropikalnej słonej wody zwiększyły koszty operacyjne. Centrum obsługuje wiele codziennych wycieczek, ponad 200 dni w roku.
      solution: Paddle Board Overstock dostarczył dostosowany do potrzeb klienta komercyjny sprzęt nurkowy o długości 6,8 m RIB ze zoptymalizowanym układem pokładu roboczego do przechowywania butli do nurkowania, przygotowania sprzętu i przemieszczania się nurka. Funkcje obejmowały szeroką drabinkę do nurkowania z poręczami ze stali nierdzewnej, wytrzymałą konstrukcję rurową z materiałów odpornych na promieniowanie UV, antypoślizgową podłogę, rozwiązanie do przechowywania zbiorników, profesjonalną konsolę i siedzenia dla pasażerów – wszystko skonfigurowane do komercyjnych operacji nurkowych.
      product: 6,8 m nurkowania komercyjnego RIB
      results: Większa powierzchnia pokładu umożliwiła szybszą organizację sprzętu i wydajniejszą codzienną pracę. Komfort i bezpieczeństwo wsiadania klientów uległy znacznej poprawie. Dzięki konstrukcji morskiej skrócono czas przestojów konserwacyjnych. Centrum nurkowe mogłoby obsłużyć większą liczbę klientów w szczycie sezonu i z pewnością rozszerzyć profesjonalne usługi nurkowe.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Dla centrum nurkowego łódź to nie tylko środek transportu. Jest to ważny element naszego codziennego funkcjonowania. Paddle Board Overstock RIB daje naszemu zespołowi pewność, że może codziennie przeprowadzać wiele wypraw nurkowych z większym bezpieczeństwem i wydajnością.
      icon: tabler:lifebuoy
    - title: Flota Europejskiego Centrum Nurkowego
      customer: Centra nurkowe BlueMed
      country: Grecja
      industry: Nurkowanie i turystyka morska
      challenge: Wymaganych 12 RIBów skonfigurowanych do nurkowania dla sieci centrów nurkowych na wielu greckich wyspach. Każda łódź potrzebowała niestandardowej drabinki do nurkowania, miejsca do przechowywania zbiorników na 8 butli i stabilnej platformy umożliwiającej wejście nurka na wody otwarte. Aby rozpocząć sezon turystyczny, flota musiała przybyć w ciągu 60 dni.
      solution: Wyprodukowano 12 modeli nurkowych RIB 520 ze zintegrowanymi stojakami na zbiorniki, drabinkami nurkowymi i wyjątkowo szerokimi rurami Hypalon zapewniającymi stabilność podczas wchodzenia na pokład. Każda łódź została oznakowana barwami floty klienta. Wszystkie 12 łodzi zostało poddanych próbom ciśnieniowym i wysłane z Qingdao w ciągu 55 dni.
      product: RIB 520 Nurkowanie
      results: Wszystkie 12 łodzi dostarczonych na czas w sezonie turystycznym. Flota jest w codziennej eksploatacji od ponad 18 miesięcy i nie wystąpiła żadna awaria materiałowa. Klient zamówił 6 dodatkowych jednostek w drugim roku.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Nurkowanie RIB 520 było podstawą naszych codziennych operacji nurkowych. Stabilność w spoczynku jest doskonała, a układ zbiorników zapewnia czystość i bezpieczeństwo pokładu dla naszych gości.
      icon: tabler:lifebuoy
    - title: Program australijskiego dystrybutora OEM
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: OEM/ODM Produkcja
      challenge: Australijski dystrybutor potrzebował asortymentu płytek SUP marki własnej w konkurencyjnych cenach, aby konkurować z chińskimi markami skierowanymi bezpośrednio do konsumentów. Wymaganych 8 unikalnych modeli, od początkujących do zaawansowanych, z niestandardową grafiką, niestandardowym opakowaniem i możliwością wysyłki do punktów sprzedaży detalicznej.
      solution: Opracowano 8 modeli SUP (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) z ekskluzywnym australijskim pakietem graficznym. Niestandardowe opakowanie detaliczne z kodami QR prowadzącymi do filmów konfiguracyjnych. Logistyka wysyłkowa skonfigurowana od Qingdao bezpośrednio do australijskich sklepów detalicznych.
      product: Niestandardowa linia SUP (8 modeli)
      results: Koncepcja do pierwszej wysyłki za 90 dni. Wskaźnik sprzedaży detalicznej 85% w pierwszym sezonie. Dystrybutor rozszerzył współpracę o linię pontonów w drugim roku.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Firma Paddle Board Overstock dostarczyła kompletną linię SUP w 90 dni — od wstępnego projektu do sprzedaży detalicznej. Jakość dorównuje markom, które sprzedają dwukrotnie drożej.
      icon: tabler:arrows-exchange
    - title: Dostawa łodzi ratowniczych na Bliskim Wschodzie
      customer: Krajowy Urząd Obrony Cywilnej
      country: Emiraty Arabskie
      industry: Szukaj i ratuj
      challenge: Organizacja obrony cywilnej potrzebowała 20 gotowych do patrolowania RIBów do poszukiwań i ratownictwa przybrzeżnego, ochrony portów i reagowania na powodzie. Wymagane pokłady samoratujące się, pełne zestawy nawigacyjne (GPS, radar, VHF), pomarańczowe tuby o wysokiej widoczności i zgodność z lokalnymi przepisami morskimi.
      solution: Dostarczono 20 modeli patroli RIB 450 z pokładami samopodtrzymującymi się, zestawami nawigacyjnymi Garmin, reflektorami LED, taśmą odblaskową SOLAS i pomarańczowymi rurami o wysokiej widoczności Hypalon. Każda łódź otrzymała certyfikat CE i została przetestowana zgodnie z normami ISO 6185. Pakiet dokumentacji zawierał certyfikaty zgodności do rejestracji lokalnej.
      product: RIB 450 Patrol
      results: Flota rozmieszczona na 5 stacjach przybrzeżnych. Łodzie pływały w ekstremalnych temperaturach (45°C+) bez degradacji rur. Zasięg patrolu i zużycie paliwa przekroczyły specyfikacje o 12%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: Patrol RIB 450 przekroczył nasze wymagania operacyjne. W ekstremalnie wysokich temperaturach świetlówki Hypalon po 24 miesiącach codziennego użytkowania nie wykazują żadnych oznak degradacji pod wpływem promieni UV.
      icon: tabler:alert-triangle
    - title: Europejskie partnerstwo marki OEM
      customer: North Sea Marine Equipment BV
      country: Niderlandy
      industry: OEM/ODM Produkcja
      challenge: Uznana europejska marka morska chciała rozszerzyć działalność na rynek RIB bez inwestowania w zakłady produkcyjne. Potrzebny był partner z własną marką, zdolny wyprodukować 5 modeli RIB (3,9 m do 6,2 m) z marką prywatną, certyfikatem CE i wyłącznymi prawami do dystrybucji w UE.
      solution: Zawarto umowę produkcyjną pod własną marką na 5 modeli RIB. Każdy model oznakowany logo klienta i kolorystyką. CE dokumentacja certyfikacyjna przygotowana dla każdego modelu. Wyłączne prawa do dystrybucji w UE przyznane przy zobowiązaniach dotyczących minimalnych zamówień. Dokumentacja techniczna i katalog części zamiennych udostępniany lokalnej sieci serwisowej.
      product: Niestandardowa linia RIB (5 modeli)
      results: Podpisana umowa wieloletnia. Pierwsza seria produkcyjna 50 sztuk wysłana w ciągu 75 dni. Marka wprowadzona na METSTRADE z pozytywnym przyjęciem przez dealerów.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Współpraca z Paddle Board Overstock pozwoliła nam wejść na rynek RIB bez budowania fabryki — dostarczyli kompletne rozwiązanie „pod klucz” z certyfikatem CE i dokumentacją wsparcia dealera.
      icon: tabler:building
    - title: Karaibska Flota Kurortowa
      customer: Paradise Island Resorts Ltd
      country: Bahamy
      industry: Turystyka morska i hotelarstwo
      challenge: 'Luksusowy ośrodek potrzebował kompletnej floty sprzętu do sportów wodnych do zajęć dla gości: 40 SUP desek do wycieczek z przewodnikiem, 20 kajaków do eksploracji laguny, 10 pontonów do transferu gości i wypraw wędkarskich, a także akcesoria. Cały sprzęt wymagał niestandardowego oznakowania marki ośrodka i musiał zostać dostarczony przed szczytem sezonu turystycznego.'
      solution: 'Wyprodukowano kompletny pakiet do sportów wodnych: 40 desek SUP Voyager (model All-Around), 20 kajaków Explorer, 10 pontonów AirDeck 360, a także PFD, wiosła, pompy i zestawy naprawcze. Na całym wyposażeniu nadrukowano logo ośrodka i tropikalną kolorystykę. Przesyłka kontenerowa z pełnym manifestem inwentarzowym.'
      product: Pełny Pakiet Sportów Wodnych (70+ jednostek)
      results: Flota przybyła na 6 tygodni przed szczytem sezonu. Wyniki zadowolenia gości ze sportów wodnych wzrosły o 40% rok do roku. Sprzęt przetrwał 3 sezony przy jedynie rutynowej konserwacji.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Podejście oparte na kompletnym pakiecie oznaczało, że otrzymaliśmy wszystko, czego potrzebowaliśmy w jednej przesyłce — deski, kajaki, łodzie i akcesoria, wszystkie markowe i gotowe do użytku gości. Nasi goście są zachwyceni jakością sprzętu.
      icon: tabler:beach
    - title: Komercyjne centrum nurkowe w Queensland RIB Aktualizacja
      customer: Komercyjne Centrum Nurkowe
      country: Australia
      industry: Komercyjne usługi nurkowe i morskie
      challenge: Komercyjne centrum nurkowe z siedzibą w Queensland, specjalizujące się w inspekcjach infrastruktury morskiej, konserwacji portów i projektach napraw podwodnych, obsługiwało starzejącą się łódź roboczą. W miarę wzrostu zapotrzebowania na projekt stary statek stał się problemem — częste konserwacje powodowały zakłócenia w harmonogramie, układ nie był zaprojektowany do nowoczesnych operacji nurkowych (ograniczona przestrzeń na butle, narzędzia i sprzęt), a komfort załogi podczas długich operacji był niski. Firma potrzebowała statku, który wspierałby jej profesjonalną działalność każdego dnia roboczego.
      solution: Paddle Board Overstock przeprowadził szczegółową analizę operacyjną przepływu pracy klienta podczas nurkowania, typowego czasu trwania projektu, wielkości załogi i wymagań sprzętowych. W oparciu o tę analizę Paddle Board Overstock dostarczył dostosowany do indywidualnych potrzeb profesjonalista RIB z funkcjonalnym układem pokładu zoptymalizowanym pod kątem przygotowania sprzętu i ruchu nurka, profesjonalnymi siedzeniami na dłuższe okresy transportu, zwiększoną stabilnością dla bezpieczniejszego wchodzenia i wychodzenia nurka oraz funkcjami wsparcia nurkowania zintegrowanymi z projektem.
      product: Profesjonalne nurkowanie na zamówienie RIB
      results: Nowy RIB stał się niezawodną platformą do codziennej pracy. Dzięki zoptymalizowanemu układowi przygotowanie sprzętu stało się szybsze. Załoga zgłosiła poprawę komfortu i bezpieczeństwa podczas długich operacji. Profesjonalny wygląd łodzi wzmocnił zaufanie klientów podczas współpracy z operatorami portowymi i wykonawcami morskimi. Centrum nurkowe zyskało jednostkę na miarę profesjonalizmu obsługi.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Potrzebowaliśmy łodzi, która na co dzień wspierałaby naszą działalność, a nie tylko statku do transportu. Paddle Board Overstock współpracował z nami, aby zrozumieć nasze wymagania operacyjne i dostarczył RIB rozwiązanie, które pasuje do naszego przepływu pracy w nurkowaniu komercyjnym.
      icon: tabler:lifebuoy
    - title: Umowa na amerykański patrol przybrzeżny
      customer: Agencja Bezpieczeństwa Wybrzeża Atlantyku
      country: Stany Zjednoczone
      industry: Bezpieczeństwo morskie i egzekwowanie prawa
      challenge: Amerykańska agencja bezpieczeństwa wybrzeża potrzebowała ciężkich RIBów patrolowych do operacji przechwytywania na wodach otwartych. Wymagana konfiguracja dwusilnikowa zapewniająca redundancję, opancerzona konsola do ochrony załogi, elektronika do zastosowań wojskowych (komunikacja szyfrowana, FLIR, radar) i zgodność z przepisami amerykańskiej straży przybrzeżnej.
      solution: Zaprojektowany RIB 600 Patrol z podwójną konfiguracją zaburtową 115 HP, opancerzoną konsolą z ochroną balistyczną, obrazowaniem termowizyjnym FLIR, szyfrowaną komunikacją VHF/UHF i zintegrowanymi punktami mocowania broni. Wzmocniony kadłub do manewrów przechwytywania przy dużych prędkościach. Cała elektronika zintegrowana i przetestowana w fabryce. USCG dostarczono dokumentację zgodności.
      product: RIB 600 Patrol (dwusilnikowy)
      results: Podczas prób odbiorczych łodzie osiągnęły prędkość maksymalną 52 węzłów. Agencja podała 95% wskaźnika gotowości do misji w ciągu pierwszych 12 miesięcy. Dodatkowe zamówienie złożone na 8 sztuk.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Dwusilnikowy RIB 600 zapewnia naszym załogom prędkość i redundancję wymaganą do operacji przechwytywania na wodach otwartych. Opancerzona konsola zapewnia krytyczną ochronę bez uszczerbku dla wydajności.
      icon: tabler:shield
