content_version_control:
  tagline: Kontrola wersji
  title: Wersja rysunku<br />Zarządzanie
  subtitle: Każdy rysunek podlega systemowi kontrolowanej rewizji. Przed użyciem rysunków do planowania projektu zawsze sprawdź, czy masz aktualną wersję.
  items:
    - title: Śledzenie rewizji
      description: Każdy rysunek zawiera kod wersji (Rev-A, Rev-B, Rev-C), datę wydania, datę ostatniego przeglądu, odpowiedni model/konfigurację, jednostki, rozmiar pliku i format. Do pobrania dostępna jest tylko wersja „bieżąca”.
      icon: tabler:git-branch
    - title: Informacja o stanie rysunku
      description: Wszystkie rysunki publiczne są oznaczone jako „Tylko wstępny układ — nie do celów konstrukcyjnych, certyfikacyjnych ani produkcyjnych. Wymiary podlegają ostatecznej specyfikacji i potwierdzeniu zamówienia”. Chroni to obie strony przed niewłaściwym zastosowaniem.
      icon: tabler:alert-circle
    - title: Aktualizuj powiadomienia
      description: Kiedy specyfikacja modelu ulegnie zmianie, wersja rysunku zostanie zaktualizowana, a poprzednie wersje zostaną oznaczone jako „Zastąpione”. Zarejestrowani użytkownicy, którzy pobrali pakiety DXF/DWG, są powiadamiani o istotnych aktualizacjach pocztą elektroniczną.
      icon: tabler:bell

