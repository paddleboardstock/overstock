faq:
  title: Rysunki techniczne — często zadawane pytania
  questions:
    - q: Czy pliki PDF GA naprawdę można pobrać bezpłatnie?
      a: Tak. Pliki PDF z ogólnymi ustaleniami dla naszych głównych modeli są dostępne bezpłatnie. Zawierają informacje na poziomie planowania wystarczające do oceny projektu, przydziału przestrzeni i wstępnego przeglądu specyfikacji.
    - q: Jak uzyskać dostęp do plików DXF/DWG?
      a: Wypełnij krótki formularz kwalifikacyjny na stronie pobierania, podając nazwę firmy, typ projektu i zamierzone zastosowanie. Zatwierdzone prośby otrzymają link do pobrania pocztą elektroniczną w ciągu 1 dnia roboczego.
    - q: Czy mogę otrzymać modele 3D STEP/IGES?
      a: Pliki modeli 3D STEP lub IGES są dostępne w procesie składania wniosku o projekt. Podaj zakres projektu, wymagania dotyczące integracji, harmonogram i zamiar zakupu. Pod warunkiem zatwierdzenia — zazwyczaj w ciągu 3–5 dni roboczych.
    - q: Dlaczego ograniczasz dostęp do plików o większej liczbie szczegółów?
      a: Geometria kadłuba, dane formy i obliczenia konstrukcyjne reprezentują lata inwestycji w badania i rozwój i stanowią podstawową własność intelektualną produkcji. Zapewniamy wszystko, co potrzebne do planowania zakupów i integracji projektów, chroniąc jednocześnie naszą zdolność do dalszego inwestowania w rozwój nowych produktów.
    - q: Czy rysunki zawierają szczegóły produkcyjne?
      a: Nie. Rysunki publiczne i uproszczone zawierają informacje na poziomie zaopatrzenia dotyczące planowania i specyfikacji. Szczegóły na poziomie produkcji (harmonogramy laminowania, ścieżki narzędzi, rozszerzenia cięcia) są udostępniane wyłącznie w ramach NDA z potwierdzonymi zamówieniami.
    - q: Czy dostępne są rysunki dla niestandardowych lub częściowo niestandardowych konfiguracji RIB?
      a: Niestandardowe rysunki projektowe są przygotowywane w ramach procesu rozwoju OEM/ODM. Jeśli oceniasz niestandardowy projekt RIB, skontaktuj się z nami i przedstawij swoje wymagania, a my dostarczymy rysunki GA specyficzne dla projektu w ramach propozycji.
