content_tiers:
  tagline: Pobierz poziomy
  title: Cztery poziomy dostępu<br /> — odpowiednie szczegóły na właściwym etapie
  subtitle: Dostarczamy rysunki na poziomie zaopatrzenia, a nie pliki na poziomie produkcji. Każdy poziom odpowiada innemu etapowi projektu.
  items:
    - title: Poziom 1 — publiczny plik PDF
      description: Układ ogólny (GA), rysunek wymiarowy w 4 widokach i układ pokładu w formacie PDF. Dostępne do bezpłatnego pobrania. Wystarczające do planowania projektu, przydzielania przestrzeni i wstępnego przeglądu specyfikacji.
      icon: tabler:file-type-pdf
    - title: Poziom 2 — Lekka forma DXF/DWG
      description: Pliki CAD 2D (DXF lub DWG) do integracji układu na poziomie planowania. Wymaga krótkiego formularza kwalifikacyjnego (nazwa firmy, rodzaj projektu, przeznaczenie). Nie uwzględniono żadnych danych konstrukcyjnych ani produkcyjnych.
      icon: tabler:file-code
    - title: Poziom 3 – Wniosek dotyczący projektu STEP/IGES
      description: Pliki modeli 3D (STEP lub IGES) do integracji systemów, projektowania wyposażenia lub koordynacji architektury morskiej. Wymaga zgłoszenia projektu zawierającego zakres, harmonogram i zamiar zakupu. Pod warunkiem zatwierdzenia.
      icon: tabler:cube
    - title: Poziom 4 — Inżynieria NDA
      description: Rysunki konstrukcyjne kadłuba, harmonogramy laminowania, wydłużenia cięcia rur i dane dotyczące form. Dostępne tylko w ramach NDA z potwierdzonymi zamówieniami. Są to pliki na poziomie produkcyjnym — nie przeznaczone do publicznej dystrybucji.
      icon: tabler:lock
content_included:
  tagline: Co obejmuje
  title: Zawartość rysunku<br />dla każdego modelu
  subtitle: Każdy model posiada standardowy pakiet rysunków obejmujący niezbędne informacje planistyczne dla nabywców B2B i inżynierów projektu.
  items:
    - title: Porozumienie Ogólne (GA)
      description: Profil boczny, widok z góry i przekrój poprzeczny przedstawiający kształt kadłuba, położenie rur, lokalizację konsoli, siedzenia, układ paliwowy i kluczowe wymiary (LOA, belka, średnica rury, kąt wzniosu). Stan wersji i prawa autorskie odnotowane w tabelce tytułowej.
      icon: tabler:layout
    - title: 4-widok rysunku wymiarowego
      description: Widoki z boku, przodu, tyłu i góry z ogólnymi wymiarami do planowania transportu (wysokość na przyczepie, belka do kontenera, ciężar do podnoszenia). Obejmuje konfiguracje operacyjne i transportowe.
      icon: tabler:ruler-2
    - title: Układ pokładu i plan wyposażenia
      description: Widok pokładu z góry na dół, przedstawiający podstawę konsoli, pozycje siedzeń, położenie pierścieni D, położenie świateł nawigacyjnych, dostęp do pompy zęzowej, komorę akumulatora/paliwa i punkty mocowania wyposażenia. Ograniczona precyzja w zastrzeżonych interfejsach.
      icon: tabler:map
    - title: Rysunek dotyczący transportu i pakowania
      description: Plan załadunku kontenera, wymiary kołyski, rozkład ciężaru i położenie punktów podnoszenia na potrzeby planowania logistyki. Obejmuje standardowe i niestandardowe opcje pakowania.
      icon: tabler:truck
content_protection:
  tagline: Ochrona IP
  title: Czego nie udostępniamy<br />i dlaczego
  subtitle: Ochrona naszej inżynieryjnej własności intelektualnej gwarantuje, że możemy nadal inwestować w badania i rozwój, jednocześnie zapewniając kupującym wszystko, czego potrzebują do planowania projektu.
  items:
    - title: Dane rdzenia formy kadłuba
      description: Geometria wtyczki i formy, ścieżki narzędzi CNC i szablony laminacji są zastrzeżonymi zasobami produkcyjnymi. Nie są one udostępniane na żadnym poziomie dostępu poza potwierdzonymi umowami NDA.
      icon: tabler:ban
    - title: Rozszerzenia do cięcia rur
      description: Pliki do wycinania płaskich wzorów dla tkaniny rurowej to dane na poziomie produkcyjnym. Dostępne wyłącznie w ramach NDA z potwierdzonymi zleceniami produkcyjnymi i udostępniane wyłącznie kontrahentowi.
      icon: tabler:ban
    - title: Obliczenia konstrukcyjne
      description: Szczegółowa analiza naprężeń, wyniki FEA i harmonogramy laminatów to dokumenty wrażliwe na zgodność, udostępniane wyłącznie jednostkom notyfikowanym i klientom związanym umową NDA podczas procesu oceny zgodności.
      icon: tabler:ban
    - title: Przegląd konkurencji
      description: Zastrzegamy sobie prawo do odrzucenia próśb o dostęp do CAD, które wydają się pochodzić od konkurencji, studentów bez kontekstu projektu lub stron bez uzasadnionych zamiarów zakupowych.
      icon: tabler:shield
