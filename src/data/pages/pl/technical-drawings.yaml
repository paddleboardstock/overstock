hero:
  tagline: Rysunki techniczne i CAD
  title: RIB i ponton<br />Rysunki techniczne i pliki do pobrania CAD
  subtitle: Rysunki GA na poziomie planowania, arkusze wymiarowe i układy pokładów do oceny i specyfikacji projektu. Uzyskaj dostęp do rysunków technicznych na właściwym poziomie — od publicznych plików PDF po pliki STEP na poziomie projektu.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Rysunki techniczne łodzi RIB i pliki do pobrania CAD
direct_answer: Paddle Board Overstock dostarcza rysunki techniczne na poziomie zamówienia dla łodzi RIB i nadmuchiwanych jednostek pływających, w tym pliki PDF z ogólnymi ustaleniami (GA), arkusze wymiarowe i rysunki układu pokładu. Bardziej szczegółowe formaty (DXF/DWG, STEP/IGES) są dostępne na podstawie kwalifikowanego zapytania lub wniosku projektowego.
stats:
  - value: GA PDF
    label: Bezpłatne pobieranie
    detail: Ogólny układ według modelu
  - value: DXF/DWG
    label: Dostęp do lekkiej formy
