  title: Normy bezpieczeństwa i certyfikacja
  subtitle: Każdy produkt Aquafarer przechodzi rygorystyczne testy, a 64 modele z certyfikatem CE spełnia międzynarodowe normy bezpieczeństwa dla użytku rekreacyjnego i zawodowego. Fabryka z certyfikatem ISO 9001.
