  company: Kajakarz przybrzeżny
  location: Włochy
content_overpressure:
  tagline: Bezpieczeństwo ciśnieniowe
  title: Presja na pokładzie<br />Zarządzanie w gorącym klimacie
  subtitle: Ciśnienie na nadmuchiwanej desce rośnie wraz z temperaturą. Zrozumienie i zarządzanie nadciśnieniem chroni Twoją deskę i zapewnia bezpieczeństwo każdej sesji.
  items:
    - title: Dlaczego ciśnienie rośnie
      description: Powietrze rozszerza się pod wpływem ciepła. Deska napompowana do 15 stopni PSI przy 20°C może wspiąć się o 1-2 w PSI słońcu 40°C — ta sama fizyka, która sprawia, że chłodna poranna deska wydaje się twarda jak skała w południe.
      icon: tabler:gauge
    - title: Zalecane ciśnienie robocze
      description: Napompuj do 12-15 PSI, zgodnie z wydrukowaniem przy zaworze. Zakres objęty wynosi równowagę między sztywnością, bezpieczeństwem i żywotnością szwu — więcej znaczy nie lepiej.
      icon: tabler:chart-bar
    - title: Najlepsze praktyki w gorącym klimacie
      description: Napompuj do dolnej granicy zakresu w upalne dni. Wypuszczaj trochę powietrza przed dłuższym nasłonecznieniem i nigdy nie zostawiaj w pełni napompowanej deski na plaży na smażonej powierzchni.
      icon: tabler:sun
    - title: Ekspozycja na słońce i przechowywanie
      description: Przechowywać deski w cieniu i częściowo spuszczone, gdy nie są używane. Dla ochrony używaj worka na deski UV . Opłucz i wysusz przed zwijaniem do przechowywania.
      icon: tabler:umbrella
    - title: Jeśli deska wydaje się twarda jak skała
      description: Upuszczaj powietrze przez zawór, aż płytka wróci do dopuszczalnego zakresu. Noś manometr przy pompie, aby uzyskać dokładne odczyty — zbyt napompowana płytka niepotrzebnie obciąża szwy.
      icon: tabler:alert-circle
