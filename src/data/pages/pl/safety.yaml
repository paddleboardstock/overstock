certifications:
  - title: Certyfikacja CE (UE 2016/425)
    standard: Rozporządzenie w sprawie ŚOI (UE) 2016/425 | EN ISO 12402
    description: Całe wyposażenie bezpieczeństwa Aquafarer spełnia wymagania oznakowania CE zgodnie z europejskim Rozporządzeniem w sprawie Środków Ochrony Indywidualnej. Każdy produkt jest niezależnie testowany przez TÜV Rheinland, europejską jednostkę notyfikowaną. Nasze łodzie pneumatyczne i RIB spełniają wymagania kategorii C i D Dyrektywy Jednostek Pływających Rekreacyjnych 2013/53/UE (RCD).
    body: Certyfikacja CE obejmuje podstawowe wymagania zdrowotne i bezpieczeństwa dla środków ratunkowych i jednostek pneumatycznych. TÜV Rheinland co roku audytuje naszą fabrykę, aby zweryfikować ciągłą zgodność.
  - title: SOLAS — bezpieczeństwo życia na morzu
    standard: Rozdział III SOLAS | Kodeks LSA
    description: Life Vest Pro spełnia przepisy SOLAS dla operacji morskich offshore i komercyjnych. Testowany pod kątem utrzymania wyporności przez 24 godziny, automatycznego napompowania po zanurzeniu i wydajności przy stanie morza do 5 stopni Beauforta. Spełnia wymagania Rozdziału III dla kamizelek ratunkowych na jednostkach komercyjnych.
    body: Zatwierdzenie SOLAS wymaga niezależnych testów przez jednostkę notyfikowaną w zakresie wyporności, wytrzymałości, widoczności i automatycznej aktywacji. Nasz Life Vest Pro posiada pełne zatwierdzenie typu SOLAS z certyfikacją MED.
  - title: USCG typ III / typ V
    standard: 46 CFR Część 160 | Zatwierdzenie USCG
    description: Wybrane kamizelki ratunkowe Aquafarer spełniają klasyfikację Straży Wybrzeża Stanów Zjednoczonych dla urządzeń typu III (pomoc wypornościowa) i typu V (użytek specjalny). Nadają się do osłoniętych wód, żeglugi przybrzeżnej i operacji komercyjnych wymagających PFD zatwierdzonych przez USCG.
    body: Zatwierdzenie USCG wymaga testów w niezależnym laboratorium uznanym przez Straż Wybrzeża. Zatwierdzenie typu V obejmuje hybrydowe konstrukcje pneumatyczne wymagające aktywacji ręcznej lub automatycznej.
  - title: Zgodność społeczna BSCI
    standard: Kodeks postępowania amfori BSCI
    description: Nasza fabryka jest corocznie audytowana w ramach inicjatywy amfori Business Social Compliance Initiative (BSCI). Potwierdza to etyczne praktyki pracy, bezpieczeństwo w miejscu pracy, uczciwe godziny pracy i zarządzanie środowiskowe na naszej hali produkcyjnej o powierzchni 12 000 m².
    body: Zgodność z BSCI jest warunkiem wstępnym dla europejskich sprzedawców detalicznych i importerów. Nasza aktualna ocena BSCI to "C" (Dobra), audytowana przez SGS.
  - title: Zgodność z REACH i RoHS
    standard: Rozporządzenie UE REACH (WE) 1907/2006 | Dyrektywa RoHS 2011/65/UE
    description: Wszystkie mieszanki PVC, kleje i powłoki stosowane w produktach Aquafarer spełniają europejskie rozporządzenia bezpieczeństwa chemicznego REACH oraz ograniczenia RoHS dotyczące substancji niebezpiecznych. Karty charakterystyki materiałów (MSDS) są dostępne dla każdej linii produktowej.
    body: Zgodność z REACH zapewnia brak ograniczonych substancji SVHC powyżej dopuszczalnych progów. Regularne testy w laboratoriach zewnętrznych weryfikują ciągłą zgodność każdej partii produkcyjnej.
  - title: Zarządzanie jakością ISO 9001:2015
    standard: ISO 9001:2015 | Certyfikowane przez TÜV Rheinland
    description: Nasz system zarządzania jakością jest certyfikowany zgodnie z ISO 9001:2015 przez TÜV Rheinland i obejmuje projektowanie, produkcję, testy i obsługę posprzedażową. Coroczne audyty nadzorcze zapewniają ciągłe doskonalenie i kontrolę procesów.
    body: Certyfikacja ISO 9001 wymaga udokumentowanej polityki jakości, audytów wewnętrznych, przeglądów zarządzania, procedur działań korygujących i możliwych do prześledzenia zapisów produkcyjnych.
testimonial:
  quote: Kupowaliśmy sprzęt ratunkowy od wielu dostawców w Azji. Aquafarer jest jedynym producentem, który z góry dostarczył pełną dokumentację CE, certyfikaty SOLAS i raporty z testów strony trzeciej — bez naszej prośby.
  author: Erik Lindström
  title: Specjalista ds. bezpieczeństwa
  company: Baltic Marine Supply
  location: Finlandia
content_overpressure:
  tagline: Bezpieczeństwo przy nadciśnieniu
  title: Zarządzanie ciśnieniem w rurach RIB<br />w gorącym klimacie
  subtitle: Ciśnienie w rurach pneumatycznych rośnie wraz z temperaturą. Zrozumienie i zarządzanie nadciśnieniem zapobiega uszkodzeniom i zapewnia bezpieczną eksploatację w warunkach tropikalnych i pustynnych.
  items:
    - title: Zawory bezpieczeństwa Boyle
      description: Rury RIB Aquafarer są wyposażone w zawory upuszczające nadciśnienie, które automatycznie uwalniają nadmiar ciśnienia powyżej nominalnego maksimum. Zapobiega to naprężeniom szwów i możliwemu rozerwaniu rury wskutek nagrzewania słonecznego.
      icon: tabler:gauge
    - title: Zmiana ciśnienia od rana do południa
      description: Rura napompowana do 3,5 PSI przy 20 °C może osiągnąć 4,5+ PSI przy ekspozycji na słońce w 40 °C. W gorącym klimacie zawsze pompuj do dolnej granicy zalecanego zakresu i pozwól zaworowi bezpieczeństwa zarządzać nadmiarem ciśnienia.
      icon: tabler:sun
    - title: Zalecane ciśnienia robocze
      description: 'Rury PVC: robocze 3,0-3,5 PSI, maks. 4,5 PSI. Rury Hypalon: robocze 3,5-4,0 PSI, maks. 5,0 PSI. Zawsze testuj przy 1,25x wartości nominalnej (4,4 PSI dla PVC, 5,0 PSI dla Hypalon) zgodnie ze standardami QC Aquafarer.'
      icon: tabler:chart-bar
    - title: Najlepsze praktyki ekspozycji słonecznej
      description: Przechowuj RIB w zacienionych miejscach, gdy nie są używane. Stosuj pokrowce z ochroną UV przy długim cumowaniu. Sprawdzaj i koryguj ciśnienie w rurach przed i po godzinach szczytu słonecznego. Nigdy nie przekraczaj maksymalnego ciśnienia nominalnego.
      icon: tabler:umbrella
    - title: Awaryjne odpowietrzanie
      description: Jeśli rura wydaje się zbyt twarda lub zawór bezpieczeństwa upuszcza powietrze, uwolnij powietrze przez zawór Halkey-Roberts lub zawór wojskowy, aż ciśnienie wróci do zakresu roboczego. Zawsze miej przy sobie manometr, aby uzyskać dokładne odczyty.
      icon: tabler:alert-circle
