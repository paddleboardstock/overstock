  quote: Sprawdziłem dziennik testów ciśnieniowych, który dołączył do mojej tablicy, i wysłałem do wsparcia dwa pytania dotyczące inflacji w letnim upacie. Odpowiedzieli tego samego dnia prawdziwymi liczbami. To więcej niż jakikolwiek warsztat kiedykolwiek mi pomógł.
  author: Sofia Marchetti
