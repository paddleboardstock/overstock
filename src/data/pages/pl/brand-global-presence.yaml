hero:
  tagline: Globalna obecność
  title: 'Obsługujemy ponad 50 krajów<br />na każdym kontynencie'
  subtitle: 'Od europejskich operatorów patroli przybrzeżnych po australijskich dystrybutorów sportów wodnych i bliskowschodnie zespoły ratownicze — łodzie Paddle Board Overstock pływają na wodach całego świata.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Globalna produkcja morska i dystrybucja Paddle Board Overstock
stats:
  title: Globalny zasięg
  stats:
    - title: Kraje
      amount: '50+'
    - title: Rynki eksportowe
      amount: Europa, Ameryka, Azja, Bliski Wschód, Oceania
    - title: Produkcja
      amount: Qingdao, China
    - title: Magazyn w USA
      amount: Montclair, CA
features3_markets:
  tagline: Kluczowe rynki
  title: 'Wiedza regionalna<br />dla lokalnych wymagań'
  subtitle: 'Rozumiemy, że różne rynki mają różne wymagania regulacyjne, preferencje i przypadki użycia.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Europa i Wielka Brytania
      description: 'Produkty z certyfikatem CE zgodne z normami EN ISO 6185. Silny popyt na łodzie RIB, łodzie dmuchane i deski SUP na rynkach UE. Brytyjscy dystrybutorzy cenią naszą szybką realizację.'
      icon: tabler:map-pin
    - title: Ameryka Północna
      description: 'Produkcja zatwierdzona przez US Coast Guard. Magazyn w USA w Montclair w Kalifornii zapewnia szybką dostawę na Zachodnie Wybrzeże. Rosnący popyt na łodzie wędkarskie, jednostki ratownicze i rekreacyjne SUP.'
      icon: tabler:map-pin
    - title: Australia i Oceania
      description: 'Silny rynek dla łodzi RIB i dmuchanych tend. Australijscy dystrybutorzy cenią nasze łodzie z Hypalonu za odporność na UV w warunkach ostrego słońca. Szybka wysyłka z naszej azjatyckiej placówki.'
      icon: tabler:map-pin
    - title: Bliski Wschód
      description: 'Rosnący popyt na łodzie patrolowe i ratownicze. Nasze RIB z aluminiowym kadłubem są popularne wśród straży przybrzeżnej i służb bezpieczeństwa. Konfiguracje dostosowane do środowisk o wysokich temperaturach.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Sieć dystrybucji
  title: 'Współpraca z dystrybutorami<br />na całym świecie'
  subtitle: 'Współpracujemy z renomowanymi dystrybutorami sprzętu morskiego, markami OEM i agencjami zakupów rządowych.'
  isBeforeContent: false
  columns: 3
  items:
    - title: Partnerstwa OEM/ODM
      description: 'Produkcja pod marką klienta dla globalnych marek sportów wodnych. Zajmujemy się wszystkim — od projektu, przez produkcję, po dropshipping.'
      icon: tabler:building
    - title: Sieć dystrybutorów
      description: 'Autoryzowani dystrybutorzy w ponad 20 krajach utrzymują zapasy i zapewniają lokalne wsparcie. Zapraszamy nowych dystrybutorów do zapytań.'
      icon: tabler:users
    - title: Sektor rządowy i instytucjonalny
      description: 'Bezpośrednie dostawy dla straży przybrzeżnych, organizacji poszukiwawczo-ratowniczych i programów zakupów wojskowych. Zgodność z wymogami zamówień instytucjonalnych.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Globalna logistyka i wsparcie'
  subtitle: 'Od fabryki do miejsca przeznaczenia — zarządzamy całym łańcuchem dostaw.'
  items:
    - title: Opcje wysyłki
      description: 'Transport morski (FOB Qingdao), transport lotniczy dla pilnych zamówień i kurier ekspresowy dla próbek i części zamiennych.'
      icon: tabler:truck-delivery
    - title: Magazyn w USA
      description: 'Zapasy w Montclair w Kalifornii zapewniają szybką dostawę w całej Ameryce Północnej. Zachodnie Wybrzeże: 2-3 dni, centrum: 3-4 dni, Wschodnie Wybrzeże: 4-5 dni.'
      icon: tabler:building-warehouse
    - title: Części zamienne
      description: 'Oryginalne części zamienne i materiały eksploatacyjne Paddle Board Overstock dostępne przez cały rok. Popularne części wysyłamy w ciągu 24 godzin.'
      icon: tabler:package
    - title: Wsparcie techniczne
      description: 'Bezpośrednia linia do naszego zespołu inżynierskiego w kwestiach technicznych, porad naprawczych i wsparcia modernizacji. Wspieramy łodzie zbudowane przez nas 20 lat temu.'
      icon: tabler:headset
cta:
  title: 'Chcesz zostać dystrybutorem?'
  subtitle: 'Aktywnie rozbudowujemy naszą sieć dystrybucji. Skontaktuj się z naszym zespołem eksportowym, aby omówić możliwości współpracy.'
  actions:
    - variant: primary
      text: Zapytanie o partnerstwo
      href: /contact
    - text: Zobacz naszą ofertę produktów
      href: /products
