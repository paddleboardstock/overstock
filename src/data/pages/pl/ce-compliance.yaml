hero:
  tagline: Zgodność CE i RCD
  title: Zgodność łodzi RIB z CE<br />i dokumentacja techniczna
  subtitle: Łodzie i nadmuchiwane jednostki pływające Aquafarer RIB są projektowane i dokumentowane pod kątem zgodności z rynkiem UE zgodnie z dyrektywą 2013/53/UE w sprawie rekreacyjnych jednostek pływających. Od oceny ryzyka po Deklarację zgodności, zapewniamy dokumentację zgodności dla konkretnego modelu dla każdego kadłuba.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Dokumentacja i certyfikacja zgodności łodzi RIB CE
direct_answer: Aquafarer zapewnia dokumentację zgodności RCD 2013/53/UE dla konkretnych modeli łodzi RIB i nadmuchiwanych jednostek pływających, w tym dokumentację techniczną, deklaracje zgodności, tabliczki znamionowe i instrukcje obsługi – wszystko zgodne z normami EN ISO 6185, ISO 12217 i obowiązującymi normami zharmonizowanymi.
