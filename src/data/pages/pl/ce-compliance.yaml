content_scope:
  tagline: Zakres zgodności
  title: Które produkty wymagają<br />zgodności z RCD?
  subtitle: Dyrektywa w sprawie rekreacyjnych jednostek pływających 2013/53/UE ma zastosowanie do rekreacyjnych jednostek pływających o długości kadłuba od 2,5 m do 24 m. Zrozumienie zakresu jest pierwszym krokiem do zapewnienia zgodności.
  items:
    - title: Łodzie RIB (2,5–24 m)
      description: Sztywne pontony o długości kadłuba od 2,5 m do 24 m podlegają przepisom RCD. Kategorie projektowe od A do D mają zastosowanie w zależności od przewidywanych warunków na morzu i maksymalnej siły wiatru.
      icon: tabler:sailboat
    - title: Łodzie nadmuchiwane (poniżej 2,5 m)
      description: Małe pontony i pontony o długości poniżej 2,5 m mogą być częściowo zwolnione z obowiązku stosowania RCD, ale nadal wymagają oznakowania CE zgodnie z innymi obowiązującymi dyrektywami i normami konstrukcyjnymi EN ISO 6185.
      icon: tabler:sailboat
    - title: Deski i akcesoria SUP
      description: Deski do wiosłowania na stojąco są poza zakresem RCD. Jednakże powiązane osobiste urządzenia unoszące się na wodzie (PFD) wymagają oznakowania CE zgodnie z rozporządzeniem PPE (UE) 2016/425 z aprobatą USCG typu III/V, w stosownych przypadkach.
      icon: tabler:swimming
    - title: Częściowo ukończone łodzie
      description: Łodzie dostarczane bez silnika lub specjalnych instalacji wymagają Deklaracji Budowniczego dla jednostek częściowo ukończonych, z pełną zgodnością z RCD wypełnioną przez ostatecznego konstruktora lub importera.
      icon: tabler:tool
content_trust_layers:
  tagline: Trójwarstwowy system zaufania
  title: Informacje dotyczące zgodności<br /> — udostępniane na właściwym poziomie
  subtitle: Nie wszystkie dane dotyczące zgodności znajdują się na publicznej stronie internetowej. Stosujemy podejście trójwarstwowe, które chroni własność intelektualną, jednocześnie budując zaufanie kupujących.
  items:
    - title: Warstwa 1 — witryna publiczna
      description: Odniesienia do norm, objaśnione ścieżki zgodności, wykaz typów dokumentów, zakres certyfikacji dla każdej rodziny modeli. Żadnych aktualnych certyfikatów, danych testowych ani zastrzeżonych szczegółów technicznych.
      icon: tabler:world
    - title: Warstwa 2 — udostępnianie po zapytaniu
      description: 'Po kwalifikowanym zapytaniu: zredagowana próbka deklaracji zgodności, zdjęcie tabliczki znamionowej producenta, lista obowiązujących standardów, lista kontrolna zgodności i streszczenia certyfikatów materiałów — udostępniane na zasadach dozwolonego użytku.'
      icon: tabler:mail
    - title: Warstwa 3 — NDA/etap zamówienia
      description: Pełna dokumentacja techniczna, oceny ryzyka, obliczenia stabilności, raporty z testów, zapisy partii materiałów i dokumentacja identyfikowalności produkcji — udostępniane wyłącznie potwierdzonym nabywcom w ramach umowy NDA.
      icon: tabler:lock
content_standards:
  tagline: Obowiązujące standardy
  title: Normy ISO i EN<br /> Według których budujemy
  subtitle: Nasze produkty są projektowane i testowane zgodnie ze zharmonizowanymi normami określonymi w dyrektywie RCD. Odniesienia do standardowych numerów i nazw; pełne teksty standardowe pozostają prawami autorskimi ISO.
  items:
    - title: EN ISO 6185-3
      description: 'Łodzie nadmuchiwane – Część 3: Łodzie o maksymalnej mocy silnika 15 kW lub większej. Wymagania dotyczące konstrukcji, stabilności, pływalności i wyciągania człowieka za burtę dla RIB.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Łodzie nadmuchiwane – Część 4: Łodzie o maksymalnej mocy silnika 15 kW i większej lub równej 4,5 kW. Dodatkowe wymagania konstrukcyjne i statecznościowe.'
      icon: tabler:file-text
    - title: Seria ISO 12215
      description: Małe statki — Konstrukcja kadłuba i kantówki. Projekt konstrukcyjny kadłuba, pokładu i grodzi dla kadłubów RIB z włókna szklanego i aluminium.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Małe statki — instrukcja obsługi. Wymagana treść i format instrukcji obsługi dołączonej do każdej łodzi RIB dostarczanej w UE.
      icon: tabler:book
    - title: EN ISO 14945
      description: Mały statek — talerz budowniczego. Informacje, które należy umieścić na tabliczce producenta, trwale przymocowanej do każdej jednostki.
      icon: tabler:badge
    - title: ISO8666
      description: Małe statki – główne dane. Standaryzowane pomiary i parametry zapewniające spójną specyfikację w całej dokumentacji produktu.
      icon: tabler:dimensions
content_process:
  tagline: Proces zgodności
  title: Zgodność z CE w 6 krokach<br />Przebieg pracy
  subtitle: Od zakresu projektu po identyfikowalność na poziomie seryjnym — każdy model RIB podąża określoną ścieżką zgodności.
  steps:
    - number: '01'
      title: Zakres projektu i klasyfikacja
      description: Zdefiniuj model RIB, kategorię projektową (A/B/C/D), maksymalną liczbę osób, ładowność, moc silnika i rynek docelowy. Ustal, czy RCD ma zastosowanie i jaki moduł oceny zgodności jest wymagany.
      timeline: 2–3 dni
    - number: '02'
      title: Identyfikacja mających zastosowanie wymagań
      description: Zidentyfikuj wszystkie mające zastosowanie zasadnicze wymagania bezpieczeństwa z załącznika I RCD, odpowiednie normy zharmonizowane (EN ISO 6185, 12215, 10240, 14945) oraz wszelkie dodatkowe wymagania krajowe dla rynku docelowego.
      timeline: 3–5 dni
    - number: '03'
      title: Projekt i dokumentacja techniczna
      description: 'Utwórz główną dokumentację techniczną: ogólne rysunki układowe, obliczenia stabilności i pływalności, ocena ryzyka, specyfikacje materiałów i analiza bezpieczeństwa systemów (paliwowego, elektrycznego, kierowniczego).'
      timeline: 10–15 dni
    - number: '04'
      title: Weryfikacja i testowanie produktu
      description: Przeprowadzić weryfikację fizyczną — próbę ciśnieniową przy ciśnieniu znamionowym 1,25x przez 24–48 godzin, testy stabilności i pływalności, próby obciążenia i uruchomienie systemów. Zapisz wszystkie wyniki testów dla każdego kadłuba.
      timeline: 5–7 dni
    - number: '05'
      title: Dokumentacja dotycząca znakowania i dostawy
      description: Umieścić oznakowanie CE, tabliczkę producenta (EN ISO 14945) i HIN/CIN (numer identyfikacyjny kadłuba). Przygotuj Deklarację zgodności UE, instrukcję obsługi (EN ISO 10240) i listę kontrolną zgodności.
      timeline: 2–3 dni
    - number: '06'
      title: Identyfikowalność na poziomie seryjnym
      description: Każdy kadłub otrzymuje unikalny zapis kadłuba łączący go z główną dokumentacją techniczną, partią produkcyjną, certyfikatami materiałowymi, wynikami testów i ostateczną konfiguracją. Zapisy przechowywane przez ponad 10 lat dla każdego RCD.
      timeline: Bieżący
content_document_cards:
  tagline: Typy dokumentów
  title: Dokument zgodności<br />Karty
  subtitle: Oto typy dokumentów, które przygotowujemy i utrzymujemy dla każdego modelu RIB z certyfikatem CE. Próbki są dostępne po kwalifikującym się zapytaniu.
  items:
    - title: Certyfikat zgodności CE/RCD
      description: Certyfikat dla konkretnego modelu potwierdzający, że jednostka spełnia wszystkie obowiązujące zasadnicze wymagania bezpieczeństwa RCD 2013/53/UE, wydany przez producenta przy zaangażowaniu jednostki notyfikowanej, jeśli jest to wymagane.
      icon: tabler:certificate
    - title: Deklaracja zgodności UE (DoC)
      description: Podpisana deklaracja producenta lub upoważnionego przedstawiciela zawierająca listę mających zastosowanie dyrektyw, norm, modułu zgodności i szczegółów Jednostki Notyfikowanej. Wymagane dla każdego modelu wprowadzanego na rynek UE.
      icon: tabler:file-check
    - title: Płyta budowlana (EN ISO 14945)
      description: Trwale przymocowana tabliczka przedstawiająca maksymalną liczbę osób, maksymalną moc silnika, kategorię projektową i dane identyfikacyjne producenta. Muszą pozostać czytelne przez cały okres użytkowania jednostki.
      icon: tabler:badge
    - title: Instrukcja obsługi (EN ISO 10240)
      description: Obszerny podręcznik obejmujący bezpieczną obsługę, procedury awaryjne, harmonogramy konserwacji i ostrzeżenia dotyczące bezpieczeństwa. Obowiązkowe dla każdego RIB-a dostarczonego na terenie UE.
      icon: tabler:book
    - title: Raporty z testów i inspekcji ISO
      description: Zapisy prób ciśnieniowych (1,25x / 24–48 godz.), wyniki badań stabilności i pływalności, certyfikaty badań materiałów i raporty weryfikacji wymiarów – wszystko powiązane z konkretnymi numerami kadłuba.
      icon: tabler:test-pipe
    - title: Zapisy dotyczące identyfikowalności materiałów
      description: Możliwość śledzenia na poziomie partii tkaniny rurowej, klejów, włókna szklanego i sprzętu. Łączy każdą jednostkę produkcyjną z przychodzącymi certyfikatami materiałowymi i wynikami kontroli IQC.
      icon: tabler:link
    - title: Kontrola jakości i zapisy kontroli jakości
      description: 100-punktowa lista kontrolna jakości na jednostkę, zapisy kontroli jakości w procesie, raporty o niezgodnościach i działania naprawcze. Część łańcucha identyfikowalności produkcji.
      icon: tabler:clipboard-check
    - title: Pakiet dokumentów projektu
      description: Pakiet dokumentacji dla każdego kadłuba, zawierający zapis ostatecznej konfiguracji, szczegóły instalacji silnika i wyposażenia, listę kontrolną przekazania do eksploatacji oraz dokumentację dostawy.
      icon: tabler:package
content_design_categories:
  tagline: Kategorie projektów RCD
  title: Kategoria projektowa A–D<br /> — Co one oznaczają
  subtitle: RCD przypisuje kategorie projektowe w oparciu o maksymalną siłę wiatru i znaczną wysokość fal, na jaką zaprojektowano jednostkę.
  items:
    - title: Kategoria A – Ocean
      description: Zaprojektowany do długich rejsów, gdzie siła wiatru może przekraczać 8 w skali Beauforta (>40 węzłów), a znaczna wysokość fali może przekraczać 4 m. Wymaga najbardziej rygorystycznej weryfikacji konstrukcji i stabilności.
      icon: tabler:ripple
    - title: Kategoria B – Offshore
      description: Przeznaczony do rejsów offshore przy sile wiatru do 8 w skali Beauforta (≤40 węzłów) i znacznej wysokości fali do 4 m. Nadaje się do wód przybrzeżnych i częściowo odsłoniętych.
      icon: tabler:anchor
    - title: Kategoria C — przybrzeżna
      description: Przeznaczony do rejsów przybrzeżnych przy sile wiatru do 6 w skali Beauforta (≤27 węzłów) i znacznej wysokości fali do 2 m. Większość rekreacyjnych RIBów należy do tej kategorii.
      icon: tabler:sun
    - title: Kategoria D — Osłonięte
      description: Przeznaczony na wody osłonięte o sile wiatru do 4 w skali Beauforta (≤16 węzłów) i znacznej wysokości fali do 0,3 m. Jeziora, rzeki i chronione porty.
      icon: tabler:pool
content_hin:
  tagline: Identyfikacja rzemiosła
  title: HIN / CIN i tablica budowniczego
  subtitle: Każda łódź RIB wymaga numeru identyfikacyjnego kadłuba (HIN) lub numeru identyfikacyjnego jednostki (CIN) oraz tabliczki znamionowej zgodnie z wymaganiami EN ISO 14945 i RCD.
  items:
    - title: Numer identyfikacyjny kadłuba (HIN)
      description: Unikalny 14-znakowy kod trwale zaznaczony po prawej stronie pawęży, kodujący kod producenta (MIC), rok modelu, rok produkcji i numer seryjny. Wymagane do wejścia na rynek UE.
      icon: tabler:hash
    - title: Numer identyfikacyjny jednostki (CIN)
      description: Zgodnie z EN ISO 10087, ukryty dodatkowy numer identyfikacyjny umieszczony w ukrytym miejscu w celu zabezpieczenia przed kradzieżą i identyfikowalności.
      icon: tabler:eye-off
    - title: Zawartość płyty budowniczego
      description: Maksymalna liczba osób, maksymalna moc silnika (kW), maksymalne obciążenie (kg), kategoria projektowa, nazwa producenta i oznakowanie CE – wszystko to trwale umieszczone na tabliczce odpornej na korozję.
      icon: tabler:badge
content_tech_file:
  tagline: Struktura plików technicznych
  title: Główna dokumentacja techniczna<br />i dokumentacja kadłuba
  subtitle: 'Nasz system dokumentacji ma dwupoziomową strukturę: główna dokumentacja techniczna dla każdej rodziny modeli oraz indywidualne zapisy kadłuba dla każdej wyprodukowanej łodzi.'
  items:
    - title: Główny plik techniczny
      description: 'Zawiera pełną dokumentację zgodności dla rodziny modeli: układ ogólny, ocenę ryzyka, obliczenia stabilności/wyporności, specyfikacje materiałowe, obowiązujące normy i zapisy oceny zgodności. Przechowywane przez ponad 10 lat.'
      icon: tabler:folder
    - title: Zapis kadłuba (możliwość śledzenia poszczególnych łodzi)
      description: 'Każdy kadłub ma unikalny zapis łączący go z główną dokumentacją techniczną: HIN, data produkcji, partia rur, certyfikaty materiałowe, wynik próby ciśnieniowej, ostateczna konfiguracja, instalacja silnika i miejsce dostawy.'
      icon: tabler:file-description
    - title: Pakiet zgodności z klientem
      description: Pakiet dostawy dla każdego kadłuba, obejmujący deklarację zgodności, zdjęcie tabliczki znamionowej, instrukcję obsługi, podsumowanie testów i arkusz ostatecznej konfiguracji — dostarczany z każdym RIB wysyłanym do UE.
      icon: tabler:package
faq:
  title: Zgodność CE — często zadawane pytania
  questions:
    - q: Czy wszystkie łodzie Aquafarer RIB posiadają certyfikat CE na rynek UE?
      a: Łodzie RIB w naszym katalogu zostały zaprojektowane i udokumentowane pod kątem zgodności z RCD 2013/53/UE i obowiązującymi dyrektywami UE. Oznaczenie CE obowiązuje dla każdego modelu i konfiguracji. Skontaktuj się z nami, aby uzyskać dokument dotyczący zakresu zgodności dla konkretnego modelu.
    - q: Jaka jest różnica pomiędzy zgodnością z RCD a oznakowaniem CE?
      a: RCD (dyrektywa w sprawie rekreacyjnych jednostek pływających 2013/53/UE) to prawodawstwo UE określające zasadnicze wymagania bezpieczeństwa. Oznakowanie CE to symbol wizualny umieszczony na produkcie, który został oceniony i potwierdzony, że spełnia te wymagania. Produkt musi być zgodny z dyrektywą RCD, zanim będzie mógł nosić znak CE.
    - q: Czy do każdej łodzi dołączacie Deklaracje zgodności?
      a: Tak. Każda łódź RIB dostarczana na rynek UE zawiera Deklarację zgodności UE dla konkretnego modelu, zawierającą obowiązujące dyrektywy, normy zharmonizowane, moduł oceny zgodności i dane jednostki notyfikowanej.
    - q: Z jakiego modułu oceny zgodności korzysta Aquafarer?
      a: Moduł zależy od kategorii projektowej i typu łodzi. Większość modeli RIB w kategorii projektowej C korzysta z modułu A (wewnętrzna kontrola produkcji). W przypadku łodzi kategorii projektowej A/B lub specyficznych konfiguracji, przy zaangażowaniu jednostki notyfikowanej może mieć zastosowanie moduł B+C lub B+D. Doradzamy w zakresie odpowiedniego modułu dla każdego projektu.
    - q: Czy możesz udostępnić dokumentację dotyczącą zgodności przed złożeniem zamówienia?
      a: Po przeprowadzeniu kwalifikowanego zapytania udostępniamy dokument dotyczący zakresu zgodności zawierający listę obowiązujących standardów, ścieżki zgodności i typów dokumentów dostępnych dla ocenianego modelu. Pełna dokumentacja techniczna udostępniana jest w ramach umowy NDA po potwierdzeniu zamówienia.
    - q: Co to jest numer identyfikacyjny kadłuba (HIN) i czy jest on uwzględniony?
      a: HIN to 14-znakowy unikalny identyfikator trwale umieszczony na każdej łodzi, kodujący kod producenta (MIC), oznaczenie modelu, rok produkcji i numer seryjny. Jest obowiązkowy dla wszystkich łodzi RIB wprowadzanych na rynek UE i znajduje się na każdym RIB Aquafarer.
    - q: Jak długo przechowuje się dokumentację techniczną?
      a: Zgodnie z wymogami RCD 2013/53/UE producent musi przechowywać dokumentację techniczną przez co najmniej 10 lat od ostatniej daty wprowadzenia produktu na rynek. Aquafarer prowadzi pełną dokumentację techniczną wszystkich produkowanych modeli.
    - q: Czy pomagacie w wypełnianiu obowiązków importera wynikających z RCD?
      a: 'Tak. Zapewniamy pakiet dokumentacji, którego importerzy z UE potrzebują do wypełnienia swoich obowiązków: dostęp do dokumentacji technicznej, DoC, tabliczka producenta, instrukcja obsługi i zapisy dotyczące identyfikowalności produktu. Obowiązki importera wynikające z RCD są jasno udokumentowane w naszym przewodniku dotyczącym zgodności.'
cta:
  title: Potrzebujesz zakresu zgodności UE dla konkretnego modelu?
  subtitle: Poproś o szczegółową listę kontrolną zgodności dla modelu RIB i konfiguracji, którą oceniasz – obejmującą obowiązujące normy, ścieżkę zgodności i dostępną dokumentację.
  actions:
    - variant: primary
      text: Poproś o dokumenty zgodności
      href: /contact
    - text: Zobacz certyfikaty
      href: /certifications
content_material_cert:
  tagline: Certyfikacja materiału
  title: Identyfikowalność materiałów i<br />dowód certyfikacyjny
  subtitle: Łodzie o jakości RIB zaczynają się od kontrolowanych materiałów i udokumentowanych procesów. Poniżej opisano, jak organizujemy certyfikację materiałów dla każdej krytycznej grupy komponentów.
  items:
    - title: Identyfikowalność materiału nadmuchiwanej rurki
      description: Materiały rurowe PVC i CSM/Hypalon dobierane są w zależności od przeznaczenia, warunków klimatycznych i rynku docelowego. Dane techniczne dostawcy (TDS), informacje o partii materiału, identyfikowalność partii tkaniny, raporty z testów UV i warunków atmosferycznych oraz deklaracje REACH/SVHC są dostępne w uzgodnionym zakresie dokumentacji projektowej.
      icon: tabler:circle
    - title: Identyfikowalność aluminium morskiego
      description: W przypadku projektów kadłubów aluminiowych RIB gatunek stopu, grubość i partie materiału są kontrolowane zgodnie z zatwierdzoną specyfikacją. Certyfikaty badań materiałowych (MTC/MTR), dokumentacja EN 10204 3.1, raporty dotyczące składu chemicznego i właściwości mechanicznych oraz identyfikowalność cieplna/partii są dostarczane tam, gdzie zostało to uzgodnione.
      icon: tabler:rectangle
    - title: GRP Kontrola materiału i procesu w kadłubie
      description: W przypadku żeber RIB z włókna szklanego, żelkot, żywica, wzmocnienie z włókna szklanego i materiały rdzenia podlegają kontrolowanym specyfikacjom. TDS/SDS materiału, zapisy partii, specyfikacje laminatu oraz zapisy dotyczące utwardzania i kontroli warsztatowej są dostępne po uzgodnieniu projektu.
      icon: tabler:layers-subtract
    - title: Wsparcie dokumentacji komponentów
      description: W przypadku wybranych komponentów — w tym materiałów pokładowych EVA, siedzeń, okuć ze stali nierdzewnej, układów paliwowych, wyposażenia elektrycznego i akcesoriów morskich — obowiązująca dokumentacja dostawcy jest koordynowana w oparciu o ostateczną konfigurację i wymagania rynku docelowego.
      icon: tabler:package
    - title: Informacja o zakresie zgodności
      description: Certyfikaty, raporty z testów i dokumenty zgodności dotyczą wyłącznie konkretnego modelu produktu, materiału, komponentu, partii produkcyjnej lub zakresu projektu określonego w odpowiednim dokumencie. Skontaktuj się z nami, podając swój rynek docelowy, przeznaczenie i wymagania techniczne, aby przed złożeniem zamówienia potwierdzić odpowiedni pakiet dokumentacji.
      icon: tabler:info-circle

