hero:
  tagline: Brazylia
  title: SUP Hurtowe zarządy dla<br />Brazylijscy detaliści
  subtitle: Dla warsztatów i operatorów od Rio i Florianópolis po północno-wschodnie wybrzeże — zupełnie nowe nadmiarowe deski paddle boardów z 5 egzemplarzy, modele mieszane, wysyłane z Chin.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Deski nadmiarowe SUP dla brazylijskich sprzedawców plażowych i szkół wiosłowania
direct_answer: Paddle Board Overstock dostarcza zupełnie nowe SUP nadmuchiwane deski dla brazylijskich firm — szkoły i warsztaty wiosłowania w Rio de Janeiro, Florianópolis i na północno-wschodnim wybrzeżu, operatorów wynajmu oraz sprzedawców internetowych. Zamówienia hurtowe zaczynają się od 5 desek z mieszanymi modelami w jednej dostawie, wysyłanych z Weihai w Chinach ekspresowym transportem lotniczym lub skonsolidowanym frachtem morskim. Każda deska jest w 100% testowana ciśnieniowa i objęta SUP 2-letnią gwarancją.
tldr_points:
  - Hurtowo od 5 tablic — modele mieszane, wycenione według całkowitej ilości
  - Służąc brazylijskiej kulturze plażowej od Rio po północny wschód
  - Ekspresowy transport lotniczy lub skonsolidowany transport morski z Weihai w Chinach
  - 100% testowane na ciśnienie, SUP 2-letnia gwarancja na każdą płytę
overview_section:
  tagline: Przegląd rynku
  title: SUP Brazylijski rynek
  paragraphs:
    - Brazylia to jeden z najbardziej naturalnych targów stand-up paddle na świecie. Kultura plażowa to kultura narodowa — od sceny Stand Up Paddle na lagunach Rio i mieszanki fal i spokojnej wody w Florianópolis po ciepłe, spokojne wody północno-wschodnich w Ceará, Pernambuco i Bahia. Szkoły wiosłania, wypożyczalnie lagun oraz społeczności zjazdowe z wiatrem i SUP surfingiem czerpią z ogromnej, sportowej grupy ludności.
    - Brazylijscy nabywcy to zazwyczaj firmy prowadzone przez właścicieli — stoiska na wynajem nad laguną, szkoły plażowe, sklepy surfingowe dodające SUP kolejki oraz rosnąca liczba krajowych sprzedawców e-commerce. Zamawiają w małych partiach (5–20 desek) i dbają o trwałość do codziennego użytku oraz konkurencyjność cenową na rynku o znaczących kosztach importu.
  customer_types:
    - title: Szkoły Lagoon i Beach
      description: Szkoły i operatorzy wynajmu na lagunach Rio oraz na spokojnych plażach północno-wschodniej Anglii oferują lekcje i wynajem co godzinę.
    - title: Sklepy surfingowe
      description: Ugruntowani sprzedawcy surfingu dodali na wodę spokojną i wycieczki SUP dla lokalnej społeczności kajakarskiej.
    - title: Sprzedawcy internetowi
      description: Krajowi sprzedawcy e-commerce importują SUP towar, aby obsłużyć ogromny rynek wewnętrzny Brazylii.
shipping_section:
  title: Statek do Brazylii
  paragraphs:
    - Zamówienia wysyłane są z Weihai w Chinach. Express air cargo przewozi próbki oraz zamówienia na pokład 1–3 na główne lotniska Brazylii; skonsolidowany transport morski obsługuje zamówienia hurtowe na 5–20 pokładów przez porty takie jak Santos i inne przybrzeżne bramy. Szacunki tranzytu dla Twojego celu są uwzględnione w wycenie.
    - Dostarczamy fakturę handlową oraz listę pakowania wymaganą do odprawy, z poprawnymi kodami HS i deklarowanymi wartościami. Cła importowe i podatki są płacone przez importera zgodnie z brazylijskimi przepisami.
  customs_note: Brazylijskie podatki importowe na sprzęt sportowy są znaczące i różnią się w zależności od klasyfikacji produktu. Przed zamówieniem poupewnij aktualne cło, VAT oraz wszelkie opłaty stanowe ze swoim agentem celnym (despachante) — zapewniamy pełną dokumentację, ale nie łączymy podatków importowych z wycenami frachtowymi.
faq_section:
  title: Najczęściej zadawane pytania o Brazylii
  items:
    - q: Czy wyceny i wsparcie można przekazywać po portugalsku?
      a: Tak — współpracujemy z kupującymi mówiącymi po portugalsku. Zapytaj w swoim zapytaniu, a my zajmiemy się Twoją wyceną i zamówieniem po portugalsku.
    - q: Czy brazylijskie podatki importowe są wliczane w wasze ceny?
      a: Nie. Cła importowe, VAT oraz podatki stanowe są odpowiedzialnością importera zgodnie z brazylijskimi przepisami. Jasno i osobno wyceniamy ceny zarządu i frachtu oraz dostarczamy dokumenty, których potrzebuje Twoja despachante.
    - q: Jak wygląda pierwsze zamówienie dla brazylijskiej szkoły plażowej?
      a: 'Zazwyczaj 5–15 desek: solidne modele uniwersalne do lekcji i wynajmu godzinowego, plus kilka wersji premium do prezentacji w sklepie. W jednej wysyłce mieszane modele, cena zależna od całkowitej ilości.'
    - q: Czy wysyłacie frachtem morskim do Brazylii?
      a: Tak — skonsolidowany fracht morski obsługuje brazylijskie porty dla zamówień hurtowych 5–20 desek, wyceniany według miejsca przeznaczenia. Ekspresowy transport lotniczy dostępny jest dla próbek i pilnych małych zamówień.
