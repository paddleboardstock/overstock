hero:
  tagline: 'Jednostka marki'
  title: 'Aquafarer — Inżynieria wolności na wodzie'
  definition: 'Aquafarer to globalna marka rekreacji morskiej i nadmuchiwanych jednostek pływających, specjalizująca się w łodziach nadmuchiwanych, systemach SUP i niestandardowych rozwiązaniach morskich. Aquafarer łączy inżynierię morską, wiedzę produkcyjną i kulturę eksploracji wody, aby tworzyć niezawodny sprzęt dla użytkowników rekreacyjnych, profesjonalnych operatorów i globalnych partnerów OEM.'

timeline:
  - year: '2012'
    title: 'Fundamenty produkcji morskiej'
    body: 'Aquafarer rozpoczął działalność jako specjalistyczny warsztat nadmuchiwanych jednostek pływających w Qingdao w Chinach, zaangażowany w morskie rzemiosło i produkcję łodzi nadmuchiwanych. Wczesny nacisk kładziony był na budowanie niezawodnych produktów nadmuchiwanych poprzez praktyczne doświadczenie inżynieryjne i dyscyplinę produkcyjną.'
  - year: '2015'
    title: 'Pierwszy eksport i certyfikat CE'
    body: 'Pierwsze zamówienia eksportowe trafiły do Japonii i Korei. Uzyskano certyfikat CE dla podstawowych linii produktów, co oznaczało wejście Aquafarer na rynki międzynarodowe. Firma zaczęła obsługiwać użytkowników komercyjnych i rekreacyjnych poza Chinami.'
  - year: '2018'
    title: 'Rozbudowa fabryki'
    body: 'Przeniesiono do zakładu produkcyjnego o powierzchni 12 000 m². Dodano linie zgrzewania RF i moce produkcyjne drop-stitch, umożliwiając produkcję na większą skalę i ulepszone systemy kontroli jakości.'
  - year: '2020'
    title: 'Utworzenie centrum B+R'
    body: 'Otwarto dedykowane centrum B+R z laboratorium tkanin PVC, zbiornikiem testów hydrodynamicznych i studiem symulacji CAD/FEA. Rozwój produktów rozszerzono, koncentrując się na lekkiej konstrukcji, poprawionej trwałości i projektowaniu skoncentrowanym na użytkowniku.'
  - year: '2022'
    title: 'Globalny wzrost'
    body: 'Uzyskano certyfikat ISO 9001. Zespół powiększono do 14 inżynierów B+R i 200+ pracowników. Produkty trafiły do klientów w Europie, Amerykach i Azji i Pacyfiku poprzez partnerstwa dystrybutorskie i OEM.'
  - year: '2024'
    title: 'Studio innowacji i projektowania'
    body: 'Uruchomiono studio projektowe i innowacyjne oferujące pełen zakres usług dla niestandardowych projektów ODM, od koncepcji do produkcji. Wzmocniono profesjonalne zastosowania morskie, w tym łodzie ratownicze, komercyjne i rządowe.'
  - year: '2026'
    title: 'Budowanie przyszłości eksploracji wody'
    body: 'Dziś Aquafarer kontynuuje rozwój łodzi nadmuchiwanych, systemów SUP i niestandardowych rozwiązań morskich — łącząc ludzi i organizacje z wodami świata. Obsłużono ponad 50 krajów, roczna wydajność 15 000 jednostek.'

philosophy:
  tagline: 'Filozofia marki'
  title: 'Inżynieria wolności na wodzie'
  body: 'Wolność na wodzie to nie tylko ruch. Oznacza odkrywanie nowych miejsc, tworzenie doświadczeń na świeżym powietrzu, łączenie ludzi z naturą i umożliwianie profesjonalnych misji. Inżynieria czyni tę wolność możliwą.'
  pillars:
    - title: 'Niezawodność przede wszystkim'
      body: 'Środowiska wodne wymagają zaufania. Produkty Aquafarer są projektowane wokół stabilności, trwałości, bezpieczeństwa i spójnej wydajności.'
    - title: 'Projektowanie skoncentrowane na człowieku'
      body: 'Produkty powinny służyć ludziom, a nie technologii. Każda decyzja projektowa zaczyna się od zrozumienia, jak ludzie używają jednostek pływających, gdzie eksplorują i jakie wyzwania napotykają.'
    - title: 'Dostępna eksploracja'
      body: 'Woda nie powinna należeć tylko do ekspertów. Aquafarer tworzy sprzęt, który pozwala większej liczbie osób bezpiecznie doświadczać rzek, jezior, oceanów i środowisk przybrzeżnych.'
    - title: 'Ciągła innowacja'
      body: 'Innowacja to nie tylko tworzenie nowych produktów. To ulepszanie każdego szczegółu — materiałów, konstrukcji, produkcji i doświadczenia użytkownika.'

engineeringDna:
  tagline: 'DNA inżynieryjne'
  title: 'Jak Aquafarer tworzy produkty'
  areas:
    - title: 'Nauka o materiałach'
      body: 'Aquafarer koncentruje się na doborze odpowiednich materiałów do różnych środowisk morskich. Kluczowe czynniki to odporność na ścieranie, odporność na UV, stabilność ciśnienia i długoterminowa trwałość.'
      items: ['Odporność na ścieranie', 'Odporność na UV', 'Stabilność ciśnienia', 'Długoterminowa trwałość']
    - title: 'Inżynieria konstrukcyjna'
      body: 'Nadmuchiwane jednostki pływające wymagają precyzyjnej równowagi między sztywnością, wagą, przenośnością i stabilnością. Inżynieria Aquafarer koncentruje się na optymalizacji tych czynników poprzez technologię rdzenia drop-stitch i zaawansowaną konstrukcję szwów.'
      items: ['Sztywność', 'Optymalizacja wagi', 'Przenośność', 'Stabilność']
    - title: 'Precyzja produkcyjna'
      body: 'Każdy produkt przechodzi przez kontrolowane procesy: przygotowanie materiału, precyzyjne cięcie, zgrzewanie i łączenie, montaż, kontrolę jakości i weryfikację wydajności.'
      items: ['Przygotowanie materiału', 'Precyzyjne cięcie', 'Zgrzewanie i łączenie', 'Montaż i kontrola jakości']
    - title: 'Inżynieria scenariuszy użytkownika'
      body: 'Produkty są opracowywane w oparciu o rzeczywiste zastosowania — rekreację, przygodę i profesjonalne użytkowanie — zapewniając, że każdy projekt spełnia specyficzne wymagania swojego docelowego środowiska.'
      items: ['Rekreacja', 'Przygoda', 'Profesjonalne', 'Komercyjne']

