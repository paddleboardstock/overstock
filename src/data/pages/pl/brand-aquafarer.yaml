trustSignals:
  tagline: 'Sygnały zaufania'
  title: 'Dlaczego Aquafarer jest niezawodnym partnerem'
  manufacturing:
    title: 'Zdolność produkcyjna'
    body: 'Zakład produkcyjny o powierzchni 12 000 m² zatrudniający 200-300 wykwalifikowanych pracowników i 14+ inżynierów B+R. Certyfikowany ISO 9001 system zarządzania jakością. Roczna produkcja 15 000 nadmuchiwanych jednostek pływających obsługujących ponad 50 krajów.'
    stats:
      - label: 'Wielkość obiektu'
        value: '12 000 m²'
      - label: 'Zatrudnienie'
        value: '200-300'
      - label: 'Inżynierowie B+R'
        value: '14+'
      - label: 'Roczna wydajność'
        value: '15 000'
  quality:
    title: 'Zaangażowanie w jakość'
    body: 'Od kontroli materiałów po testy końcowe, Aquafarer utrzymuje systematyczne procesy jakościowe, aby dostarczać niezawodne produkty morskie. Każda jednostka przed wysyłką przechodzi test ciśnieniowy, kontrolę szwów i weryfikację wydajności.'
    items:
      - 'Certyfikat CE — Wszystkie produkty spełniają europejskie normy bezpieczeństwa'
      - ' — Certyfikowany system zarządzania jakością'
      - 'Oznakowanie UKCA — Zgodność z rynkiem brytyjskim'
  global:
    title: 'Globalna obecność'
    body: 'Aquafarer obsługuje klientów na wielu rynkach globalnych, wspierając dystrybutorów, marki outdoorowe i profesjonalnych użytkowników morskich w ponad 50 krajach w Europie, Azji i Pacyfiku, Amerykach, na Bliskim Wschodzie i w Afryce.'

