how_to_choose:
  title: Jak wybrać odpowiedni rozmiar
  cards:
    - title: Uniwersalne deski SUP
      description: Nasze deski all-around ~11 stóp (32" szerokości, 6 cali drop-stitch) łączą stabilność, prędkość i pojemność. Dopasuj objętość deski do swojej wagi – ciężsi wioślarze potrzebują większej objętości.
    - title: Szerokość i grubość
      description: Szersze deski (32"+) zapewniają większą stabilność dla początkujących, jogi i wędkowania. Grubość 6 cali przy 15 PSI utrzymuje deskę sztywną pod ciężarem użytkownika i sprzętu.
    - title: Pakiety i akcesoria
      description: Każda deska jest dostarczana jako kompletny zestaw — deska, plecak podróżny, pompka ręczna, regulowana wiosło, wyjmowane fin, linka bezpieczeństwa typu coil i zestaw naprawczy. Sprawdź maksymalne obciążenie dla jeźdźca wraz ze sprzętem.
