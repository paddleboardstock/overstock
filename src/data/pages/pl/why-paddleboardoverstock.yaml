reasons:
  tagline: Różnica Paddle Board Overstock
  title: Co nas wyróżnia
  isBeforeContent: false
  columns: 3
  items:
    - title: Prawdziwa produkcja, nie handel
      description: Posiadamy i prowadzimy fabrykę o powierzchni 12 000 m². Kiedy współpracujesz z Paddle Board Overstock, pracujesz bezpośrednio z osobami, które projektują, konstruują i wytwarzają Twoje produkty — bez pośredników.
      icon: tabler:building-factory
    - title: Podejście kierowane przez inżynierię
      description: Nasz proces projektowania zaczyna się od przypadku użycia, a nie od kategorii produktu. Optymalizujemy kształt kadłuba, wybór materiałów i konfigurację pod kątem tego, jak deska faktycznie będzie używana na wodzie.
      icon: tabler:engine
    - title: Sprawdzona jakość
      description: Każda płyta jest testowana na ciśnienie 1,25 razy względem wartości przez 24-48 godzin przed wysyłką, a 99,3% naszych dostaw przychodzi bez wad — popartych gwarancją.
      icon: tabler:award
    - title: Projekt Paddler-First
      description: 'Każdy model zaczyna się od sposobu wiosłowania: stabilne platformy dla początkujących, opływowe kształty do touringu i pełnowymiarowe pokłady do jogi. Projektujemy dla prawdziwych kajakarzy, a nie dla specyfikacji salonowych.'
      icon: tabler:adjustments
    - title: Globalna logistyka
      description: Magazyn w USA w Kalifornii, bezpośrednia wysyłka z Weihai, transport lotniczy dla pilnych zamówień. Załatwiamy dokumenty celne i formalności na całym świecie.
      icon: tabler:truck-delivery
    - title: Wsparcie na całe życie
      description: Stoimy za deskami, które zbudowaliśmy 20 lat temu. Prawdziwe części zamienne, porady techniczne, porady naprawcze — nasz zespół jest do Ciebie, gdy nas potrzebujesz, gdziekolwiek jesteś.
      icon: tabler:lifebuoy
testimonials:
  tagline: Zaufani przez kajakarzy na całym świecie
  title: Co mówią kajakarze
  items:
    - content: Mój Ocean Voyager radził sobie ze wszystkim – od spokojnych poranków nad jeziorem po wzburzone popołudnia na wybrzeżu. Po dwóch sezonach nadal wygląda i jeździ jak nowy.
      name: — Rekreacyjny kajakarz, Kalifornia
    - content: Byłem zdenerwowany kupując moją pierwszą nadmuchiwaną deskę online, ale jakość była oczywista w momencie, gdy ją napompowałem. Sztywna, stabilna i pięknie wykończona.
      name: — SUP Pierwszy raz właściciel, Niemcy
    - content: Wiosłujemy jako rodzina każdego letniego weekendu. Trzy deski, zero problemów, a dzieci uwielbiają jaskrawe wzory.
      name: — Rodzinny Wioślarz, Australia
    - content: Testy ciśnienia to nie marketingowe rozmowy — moja deska jest solidna jak skała przy pełnym ciśnieniu i nie pokazuje rozciągnięcia po roku cotygodniowego wiosłowania.
      name: — Weekly Paddler, Holandia
cta:
  title: Gotowy, by znaleźć swoją idealną deskę?
  subtitle: Porozmawiaj z naszymi ekspertami od wiosłowania, aby uzyskać szczere porady dotyczące wyboru odpowiedniej deski — bez presji, po prostu prawdziwa pomoc.
  actions:
    - variant: primary
      text: Porozmawiaj z naszym zespołem
      href: /contact
    - text: Pobierz katalog produktów
      href: /resources
