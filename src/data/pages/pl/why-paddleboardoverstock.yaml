hero:
  tagline: Dlaczego Paddle Board Overstock
  title: Zbudowany inaczej. Zbudowany, by trwać.<br />Światowe zarządy wodne przygody
  subtitle: Nie tylko fabryka — zespół kajakarzy i inżynierów, którzy projektują, testują i budują SUP wysokiej klasy nadmuchiwane deski dla rodzin, poszukiwaczy przygód i klubów na całym świecie.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock jakość produkcji i ekspertyza
pillars:
  tagline: Trzy filary jakości
  title: Dlaczego kajakarze na całym świecie wybierają Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Zaprojektowane do użytku komercyjnego
      description: Nasze deski są zaprojektowane pod kątem lat regularnego wiosłowania. PVC Rdzenie o wzmocnieniu klasy komercyjnej drop-stitch , UV stabilne materiały oraz sprawdzony sprzęt oznaczają niższą konserwację i dłuższą żywotność na wodzie.
      icon: tabler:building-factory
      callToAction:
        text: Zobacz linię produktów komercyjnych
        href: /products
    - title: Testowane ponad standardy
      description: Każda deska jest napompowana do 1,25 razy ciśnienia nominalnego przez 24-48 godzin przed opuszczeniem fabryki — w 100% testowana ciśnieniowo, 99,3% wolna od wad. Twoja deska jest udowodniona jako wytrzymała zanim dotknie się wody.
      icon: tabler:shield-check
      callToAction:
        text: Zobacz, jak testujemy
        href: /quality
    - title: Zaprojektowany na warunki globalne
      description: 'Produkty zoptymalizowane pod każdy klimat: formuły do wody zimnej PVC dla Europy, materiały odporne na UV dla Bliskiego Wschodu i Australii, zabiegi przeciwwilgociowe dla Azji Południowo-Wschodniej. Każda przesyłka jest skalibrowana do środowiska jej przeznaczenia.'
      icon: tabler:world
