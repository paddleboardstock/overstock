  tagline: Kontrola jakości
  title: System Kontroli Jakości<br />dla OEM Produkcji Morskiej
  subtitle: Wieloetapowy proces kontroli obejmujący materiały przychodzące, produkcję w toku, testy ciśnieniowe, finalny montaż oraz weryfikację przed wysyłką. Każda partia jest możliwa do śledzenia, każdy test jest rejestrowany.
