      name: Helen Lee
      description: 15 lat doświadczenia w międzynarodowym e-commerce i logistyce. Wysyła deski do wioślarzy w 50 krajach. Biegle mówi w 4 językach.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Filozofia projektowania
  title: Projektowanie prowadzone przez inżynierię<br />— Liczy się każdy szczegół
  subtitle: Nasza filozofia inżynieryjna opiera się na trzech zasadach, które kierują każdym produktem, który tworzymy.
  list:
    - 'Niezawodność na pierwszym miejscu: Każdy produkt jest testowany pod kątem wytrzymania realnych warunków — od wypraw w zimne wody po wynajem na tropikalnych plażach. Tam, gdzie to najważniejsze, stosujemy nadmiarową inżynierię.'
    - 'Precyzja produkcji: Nasze zakłady korzystają z precyzyjnego cięcia, spawania wysokoczęstotliwościowego i automatycznego testowania ciśnieniowego. Każdy szew, każdy zawór, każde złącze spełnia udokumentowane specyfikacje.'
    - 'Ciągła innowacja: Nasz zespół R&D stale ocenia nowe materiały, metody produkcji i ulepszenia projektowe. Nie czekamy na problemy — przewidujemy je.'
