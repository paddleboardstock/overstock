hero:
  tagline: Nasz zespół
  title: 'Ludzie stojący za Paddle Board Overstock<br />— inżynieria wolności na wodzie'
  subtitle: 'Założona w 2012 roku w Qingdao w Chinach firma Paddle Board Overstock powstała dzięki inżynierom morskim, specjalistom od materiałów i pasjonatom sportów wodnych, którzy wierzyli, że profesjonalne dmuchane łodzie powinny być dostępne na całym świecie.'
  image:
    src: /images/team-all.webp
    alt: Zdjęcie całego zespołu Paddle Board Overstock — inżynieria, produkcja i zarząd
founding:
  tagline: Nasze początki
  title: 'Od nadmorskiego warsztatu<br />do zakładu o powierzchni 12,000 m²'
  subtitle: 'Paddle Board Overstock została założona przez zespół inżynierów morskich z wieloletnim łącznym doświadczeniem w projektowaniu łodzi dmuchanych, obróbce PVC/Hypalon i światowej produkcji sprzętu morskiego.'
  items:
    - title: "Rok założenia: 2012"
      description: 'Założona w Qingdao w Chinach — ważnym centrum morskim z bogatym dziedzictwem stoczniowym.'
      icon: tabler:calendar
    - title: 200-300 pracowników
      description: 'W tym ponad 50 inżynierów B+R, specjalistów kontroli jakości i techników produkcji.'
      icon: tabler:users
    - title: Zakład o powierzchni 12,000 m²
      description: 'Dedykowana fabryka z 6 liniami produkcyjnymi dla łodzi RIB, łodzi dmuchanych i desek SUP.'
      icon: tabler:building-factory
    - title: 'Ponad 50 obsługiwanych krajów'
      description: 'Eksport do Europy, obu Ameryk, na Bliski Wschód, do Azji i Pacyfiku oraz Afryki.'
      icon: tabler:globe
leadership:
  tagline: Zarząd
  title: 'Zarząd i kierownictwo inżynieryjne'
  subtitle: 'Nasz zespół kierowniczy łączy głęboką wiedzę z zakresu inżynierii morskiej, handlu międzynarodowego i zarządzania jakością.'
  columns: 3
  items:
    - title: Założyciel i CEO
      name: 'Toby Liu'
      description: 'Ponad 15 lat w produkcji morskiej. Wcześniej kierował działem B+R w dużej chińskiej fabryce łodzi. Posiadacz wielu patentów w projektowaniu łodzi dmuchanych.'
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Główny inżynier
      name: 'Zhang Wei'
      description: 'Ponad 20 lat w obróbce PVC/Hypalon i projektowaniu kadłubów deep-V. Były dyrektor techniczny w europejskiej firmie inżynieryjnej.'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: Szef działu B+R
      name: 'Chen Ming'
      description: 'Doktorat z zakresu nauk o materiałach. Specjalizuje się w technologii drop-stitch i zgrzewaniu wysokoczęstotliwościowym. Ponad 10 lat w kompozytach tekstylnych.'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: Dyrektor Produkcji
      name: 'Liu Qiang'
      description: 'Ponad 18 lat w produkcji lean i optymalizacji linii produkcyjnych. Six Sigma Black Belt. Wdrożył systemy jakości ISO 9001.'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: Menedżer Jakości
      name: 'Wang Fang'
      description: 'Ponad 12 lat w morskiej kontroli jakości. Certyfikowany audytor CE i ISO. Nadzoruje badania każdej partii produkcyjnej.'
      icon: tabler:shield-check
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Dyrektor Sprzedaży i Operacji'
      name: 'Helen Lee'
      description: 'Ponad 15 lat w międzynarodowym handlu B2B. Zarządzał partnerstwami OEM/ODM w ponad 30 krajach. Włada 4 językami.'
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Filozofia projektowania
  title: 'Projektowanie prowadzone przez inżynierię<br />— każdy detal się liczy'
  subtitle: 'Nasza filozofia inżynieryjna opiera się na trzech zasadach, które wyznaczają każdy produkt, który budujemy.'
  list:
    - 'Niezawodność przede wszystkim: każdy produkt Paddle Board Overstock jest testowany w rzeczywistych warunkach — od akcji ratowniczych w zimnej wodzie po wypożyczalnie w tropikalnych kurortach. Zwiększamy marginesy konstrukcyjne tam, gdzie jest to najważniejsze.'
    - 'Precyzja produkcji: nasze zakłady wykorzystują cięcie CNC, zgrzewanie wysokoczęstotliwościowe i automatyczne testy ciśnieniowe. Każdy szew, każdy zawór, każdy element spełnia udokumentowane specyfikacje.'
    - 'Ciągła innowacja: nasz zespół B+R nieustannie ocenia nowe materiały, metody produkcji i usprawnienia projektowe. Nie czekamy na problemy — wyprzedzamy je.'
cta:
  title: 'Chcesz omówić projekt z naszym zespołem?'
  subtitle: 'Nasi inżynierowie chętnie doradzą w kwestii wyboru produktów, personalizacji i partnerstw OEM/ODM.'
  actions:
    - variant: primary
      text: Skontaktuj się z naszym zespołem
      href: /contact
    - text: Zobacz nasze produkty
      href: /products
