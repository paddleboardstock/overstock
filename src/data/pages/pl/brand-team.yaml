hero:
  tagline: Nasz zespół
  title: Ludzie stojący za Paddle Board Overstock<br />— Inżynieria Wolności na Wodzie
  subtitle: Założona w 2012 roku w Weihai w Chinach, Paddle Board Overstock została stworzona przez inżynierów morskich, naukowców zajmujących się materiałami oraz entuzjastów sportów wodnych, którzy wierzyli w udostępnienie profesjonalnych nadmuchiwanych desek paddle na całym świecie.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock pełne zdjęcie zespołu — inżynieria, produkcja i kierownictwo
founding:
  tagline: Nasze Założenie
  title: Z nadmorskiego warsztatu<br />do obiektu o powierzchni 12 000 m²
  subtitle: Paddle Board Overstock zostało założone przez zespół inżynierów morskich z wieloletnim, łącznym doświadczeniem w projektowaniu dmuchanych SUP, budowie drop-stitch oraz globalnej produkcji sprzętu wodnego.
  items:
    - title: 'Założono: 2012'
      description: Założone w Weihai w Chinach — głównym ośrodku morskim o bogatym dziedzictwie stoczniowym.
      icon: tabler:calendar
    - title: 200-300 pracowników
      description: W tym 14+ inżynierów ds. badań i rozwoju, specjalistów ds. kontroli jakości oraz techników produkcji.
      icon: tabler:users
    - title: Obiekt o powierzchni 12 000 m²
      description: Dedykowany zakład produkcyjny z 6 liniami produkcyjnymi do płyt SUP i akcesoriów.
      icon: tabler:building-factory
    - title: 50+ Obsługiwanych Krajów
      description: Eksport do Europy, Ameryk, Bliskiego Wschodu, Azji i Pacyfiku oraz Afryki.
      icon: tabler:globe
leadership:
  tagline: Przywództwo
  title: Zarządzanie i Przywództwo Inżynieryjne
  subtitle: Nasz zespół kierowniczy łączy głęboką wiedzę w dziedzinie inżynierii morskiej, handlu międzynarodowego oraz zarządzania jakością.
  columns: 3
  items:
    - title: Założyciel i dyrektor generalny
      name: Toby Liu
      description: 15+ lat w produkcji morskiej. Wcześniej kierował działem badań i rozwoju w dużym chińskim producentie morskim. Posiada kilka patentów w projektowaniu produktów dmuchanych.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Główny Inżynier
      name: Zhang Wei
      description: 20+ lat doświadczenia w wytwarzaniu tworzyw sztucznych i projektowaniu konstrukcji nadmuchiwanych. Były dyrektor techniczny w europejskiej firmie inżynierii morskiej.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
