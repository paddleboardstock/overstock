      name: Chen Ming
      description: Doktorat z nauk o materiałach. Specjalizuje się w technologii drop-stitch i procesach spawania wysokiej częstotliwości. 10+ lat w kompozytach tekstylnych.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Dyrektor Produkcji
      name: Liu Qiang
      description: 18 lat doświadczenia w lean manufacturing i optymalizacji linii produkcyjnych. Zbudował systemy jakości odpowiadające za nasz wskaźnik 99,3% produktów bez wad.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Kierownik ds. Jakości
      name: Wang Fang
      description: 12 lat doświadczenia w kontroli jakości w przemyśle morskim. Nadzoruje testy ciśnienia, szwów i obciążenia każdej partii produkcyjnej przed jej wprowadzeniem.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
