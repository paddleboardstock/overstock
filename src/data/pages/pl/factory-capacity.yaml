hero:
  tagline: Moc produkcyjna
  title: Możliwości produkcyjne i roczna produkcja
  subtitle: Obiekt o powierzchni 12 000 m² produkujący 15 000 desek rocznie z możliwością zwiększenia skali
intro: Paddle Board Overstock prowadzi jedno z największych wyspecjalizowanych zakładów produkcji dmuchanych desek SUP w Weihai w Chinach. Nasza fabryka o powierzchni 12 000 m² jest zorganizowana w sześć wyspecjalizowanych warsztatów działających równolegle, co daje nam możliwość produkcji 15 000 desek rocznie w liniach SUP all-around, touring i art-serii.
highlights:
  - value: 12,000 m²
    label: Łączna powierzchnia produkcyjna
    detail: W sześciu wyspecjalizowanych warsztatach
  - value: 15,000
    label: Tablice produkowane corocznie
    detail: All-around, touring i art-serie SUPs
  - value: 200-300
    label: Wykwalifikowana kadra
    detail: 25+ inżynierów, 2 zmiany dziennie
  - value: 50+
    label: Kraje eksportu
    detail: UE, USA, Australia, Bliski Wschód, Azja
  - value: 2-3
    label: Liczba dni roboczych do wysyłki
    detail: Zamówienia dostępne w magazynie szybko opuszczają Weihai
  - value: 10+
    label: Lata doświadczenia w eksporcie
    detail: Od 2012
workshops:
  - title: SUP Produkcja desek
    description: '4 równoległe linie montażowe dla dmuchanych desek SUP. Każda linia może produkować 50–80 desek na zmianę. Stacje druku cyfrowego i sitodruku działają równocześnie. Roczna zdolność produkcyjna SUP: 8 000+ desek.'
    output: 8 000+ SUPs/rok
  - title: Grafika talii i EVA wykończenie
    description: Dedykowany warsztat wykończeniowy dla desek art-serii. Precyzyjne cięcie EVA, ręcznie układane wzory na deskach i końcowe przycinanie. Roczna zdolność obejmuje pełen zakres art-serii.
    output: Pełen zakres art-serii
  - title: Drop-Stitch Laminacja
    description: 'Linie laminacji termicznej łączą rdzenie drop-stitch z zewnętrznymi laminatami PVC. Taśmy pokładów są trójwarstwowo spajane dla hermetycznej wytrzymałości. Roczna zdolność: 15 000+ rdzeni.'
    output: 15 000+ rdzeni/rok
  - title: Akcesoria i pakowanie
    description: Linie montażowe i pakujące akcesoria, takie jak pompy, wiosła, leash'e i zestawy naprawcze. Deski są pakowane próżniowo, kartonowane i paletyzowane do wysyłki na całym świecie.
    output: Kompletne pakiety, gotowe do wysyłki
