hero:
  tagline: Możliwości produkcyjne
  title: Możliwości produkcyjne i produkcja roczna
  subtitle: Zakład o powierzchni 12 000 m² produkujący 15 000 łodzi rocznie z możliwością skalowania

intro: Aquafarer prowadzi jedną z największych wyspecjalizowanych fabryk łodzi pneumatycznych w Qingdao w Chinach. Nasza fabryka o powierzchni 12 000 m² jest podzielona na sześć wyspecjalizowanych warsztatów działających równolegle, co daje nam możliwość produkcji 15 000 łodzi rocznie w liniach SUP, kajaków, łodzi pomostowych, RIB i sprzętu bezpieczeństwa.

highlights:
  - value: 12,000 m²
    label: Całkowita powierzchnia produkcyjna
    detail: Na 6 wyspecjalizowanych warsztatach
  - value: 15,000
    label: Łodzie produkowane rocznie
    detail: SUP-y, kajaki, RIB-y, łodzie pomostowe, sprzęt bezpieczeństwa
  - value: 200-300
    label: Wykwalifikowana kadra
    detail: Ponad 25 inżynierów, 2 zmiany/dzień
  - value: 50+
    label: Kraje eksportowe
    detail: UE, USA, Australia, Bliski Wschód, Azja
  - value: 30–45
    label: Standardowy czas realizacji (dni)
    detail: Od potwierdzenia PO do FOB
  - value: 10+
    label: Lata doświadczenia w eksporcie
    detail: Od 2012

workshops:
  - title: Produkcja desek SUP
    description: '4 równoległe linie montażowe do desek SUP. Każda linia może wyprodukować 50–80 desek na zmianę. Stanowiska druku cyfrowego i sitodruku działają jednocześnie. Roczna moc produkcyjna SUP: ponad 8 000 desek.'
    output: 8 000+ desek SUP rocznie
  - title: Produkcja łodzi RIB
    description: 'Dedykowany warsztat kadłubów z włókna szklanego z 6 stanowiskami formującymi dla kadłubów RIB do 7,6 m. Obszar spawania i montażu tub obsługuje jednocześnie 3–5 RIB-ów. Roczna moc produkcyjna RIB: ponad 2 000 łodzi.'
    output: 2 000+ RIB-ów rocznie
  - title: Łodzie pneumatyczne i pomostowe
    description: 'Wielozadaniowe linie produkcyjne dla łodzi pneumatycznych, kajaków i łodzi pomostowych. Stanowiska zgrzewania gorącym powietrzem, prasy dielektryczne RF i stanowiska montażowe są rekonfigurowane w zależności od struktury zamówień. Roczna moc: ponad 5 000 sztuk.'
    output: 5 000+ jednostek rocznie
  - title: Sprzęt bezpieczeństwa
    description: 'Oddzielna czysta strefa produkcyjna dla kamizelek ratunkowych i sprzętu bezpieczeństwa. Dedykowana szwalnia, wstawianie pianki i stacje testowania. Roczna moc produkcyjna kamizelek: ponad 50 000 sztuk.'
    output: 'Ponad 50 000 kamizelek rocznie'

oem_capacity:
  moq: 'SUP: 5–10 szt. | RIB: 2–5 szt. | Kajak/łódź pomostowa: 10–20 szt. | Niestandardowa forma: 200+ szt.'
  lead_time: 'Standardowo 30–45 dni. Próbka 15–20 dni. Tryb pilny dostępny.'
  payment: 'T/T 30% zaliczki + 70% przed wysyłką. Akceptowane L/C, Western Union.'
