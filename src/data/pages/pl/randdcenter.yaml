hero:
  tagline: Centrum B+R
  title: Centrum B + R
  subtitle: Skoncentrowani na postępie

intro:
  - Centrum Badawczo-Rozwojowe (B+R) Aquafarer jest siłą napędową naszej misji rewolucjonizowania sprzętu do sportów wodnych. Wzmacniamy pozycję entuzjastów sportów wodnych na całym świecie dzięki bezpieczniejszym, wygodniejszym i przyjemniejszym produktom poprzez nieustanną innowację w nadmuchiwanych deskach SUP i łodziach. Nasz dedykowany zespół inżynierów, projektantów i pasjonatów sportów wodnych kształtuje przyszłość branży, stale podnosząc poprzeczkę jakości, wydajności i zrównoważonego rozwoju.
  - Nasze zaplecze B+R łączy materiałoznawców, architektów okrętowych i inżynierów produkcji pod jednym dachem. Od formułowania tkanin i symulacji kadłuba po rozwój procesów spawania i pełnoskalowe próby morskie — każdy etap rozwoju produktu jest napędzany danymi i walidowany testami.

mission:
  tagline: Nasza misja
  title: Innowacje w przyszłość sportów wodnych
  pillars:
    - icon: lightning
      title: Postęp technologiczny
      desc: Wprowadzanie nowych materiałów, projektów i procesów produkcyjnych dla lepszej wydajności i trwałości produktów.
    - icon: design
      title: Projektowanie zorientowane na użytkownika
      desc: Dogłębne zrozumienie i przekraczanie potrzeb użytkowników poprzez ergonomiczny i intuicyjny projekt produktów.
    - icon: globe
      title: Zrównoważone praktyki
      desc: Minimalizowanie naszego śladu środowiskowego poprzez wykorzystanie ekologicznych materiałów i procesów.
    - icon: shield
      title: Niezachwiane bezpieczeństwo
      desc: Zapewnienie najwyższych standardów bezpieczeństwa poprzez rygorystyczne testy i certyfikację.

pillars:
  - title: Postęp technologiczny
    desc: Wprowadzanie nowych materiałów, projektów i procesów produkcyjnych w celu zapewnienia lepszej wydajności i trwałości produktów.
    icon: tech
  - title: Zaawansowane materiały
    desc: Badanie najnowocześniejszych PVC, Hypalon, kompozytów i zrównoważonych alternatyw dla ulepszonych właściwości produktów.
    icon: materials
  - title: Zrównoważony rozwój
    desc: 'Podstawowe zobowiązanie: Jesteśmy oddani odpowiedzialności za środowisko poprzez zrównoważoną produkcję i materiały nadające się do recyklingu.'
    icon: sustainability

capabilities:
  tagline: Możliwości
  title: Możliwości B+R
  subtitle: Cztery podstawowe dyscypliny dające nam pełną kontrolę nad rozwojem produktu — od badań surowców po końcową certyfikację.
  groups:
    - title: Materiałoznawstwo i technologia tkanin
      items:
        - Analiza i optymalizacja formuł PVC i Hypalon
        - Rozwój stabilizacji UV, opóźniaczy palenia i dodatków antybakteryjnych
        - Inżynieria laminacji i adhezji tkanin wielowarstwowych
        - Przyspieszone testy starzenia (UV, termiczne, wilgotność, mgła solna)
    - title: Inżynieria kadłuba i hydrodynamika
      items:
        - Parametryczny projekt 3D kadłuba i optymalizacja CFD
        - Analiza elementów skończonych dla obciążeń strukturalnych i udarowych
        - Testy w basenie holowniczym na modelach skalowanych i walidacja wydajności
        - Rozwój niestandardowych kadłubów dla specjalnych profili misji
    - title: Technologia spawania i łączenia
      items:
        - Rozwój i optymalizacja procesów zgrzewania dielektrycznego RF
        - Metody spawania gorącym powietrzem, gorącym klinem i ultradźwiękowe
        - Kwalifikacja klejenia i taśm szwowych
        - Modelowanie wytrzymałości spawów i przewidywanie żywotności
    - title: Testowanie, certyfikacja i zgodność
      items:
        - Testy zgodności , i CE
        - Niezależne testowanie stron trzecich i wsparcie certyfikacji
        - Opracowanie niestandardowych protokołów testowych dla kwalifikacji zakupowej
        - Analiza awarii w eksploatacji i badanie przyczyn źródłowych

