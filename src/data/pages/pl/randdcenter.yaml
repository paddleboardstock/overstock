rd_services:
  tagline: Niestandardowe B+R
  title: Usługi B+R dla partnerów
  services:
    - title: Rozwój niestandardowych materiałów
      desc: Opracowujemy niestandardowe formuły tkanin, stosy laminatów i systemy klejowe dostosowane do Twojego środowiska pracy i celów wydajnościowych.
    - title: Inżynieria produktu OEM / ODM
      desc: Od szkiców koncepcyjnych po gotowe do produkcji pakiety inżynieryjne — nasz zespół może projektować, prototypować i testować łodzie pod Twoją marką.
    - title: Testowanie i certyfikacja stron trzecich
      desc: Korzystaj z naszych zgodnych z ISO obiektów testowych do niezależnych testów materiałów, walidacji produktów i wsparcia certyfikacji.
  cta: Omów swoje wymagania B+R →
  cta_link: /contact

vision:
  tagline: Nasza wizja
  title: Kształtowanie przyszłości sportów wodnych
  body: Aquafarer dąży do przewodzenia branży łodzi pneumatycznych i SUP poprzez ciągłą innowację, niezachwianą jakość i stanowcze zaangażowanie w bezpieczeństwo i zrównoważony rozwój — ostatecznie wzbogacając doświadczenia entuzjastów sportów wodnych na całym świecie. Centrum B+R Aquafarer to miejsce, gdzie pasja spotyka się z innowacją, wyznaczając nowe standardy dla branży sportów wodnych.

labs_section:
  tagline: Laboratoria
  title: Nasze laboratoria
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: Laboratorium tkanin PVC
      description: Ciągłe badania i testowanie tkanin do rur PVC i Hypalon pod kątem wytrzymałości na rozciąganie, odporności na UV, ścierania i elastyczności w niskich temperaturach w celu zapewnienia długoterminowej niezawodności w środowiskach morskich.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Studio inżynierii kadłuba
      description: Projektowanie wspomagane CAD i analiza elementów skończonych kadłubów HDPE, aluminiowych i z włókna szklanego. Każdy kadłub jest cyfrowo symulowany pod kątem rozkładu naprężeń i odporności na uderzenia przed zbudowaniem pierwszego prototypu.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: Centrum zgrzewania RF
      description: Dedykowany obiekt zgrzewania o częstotliwości radiowej z precyzyjną kontrolą temperatury i ciśnienia, produkujący wysokowytrzymałe, szczelne szwy przewyższające normy ISO 6185 dla jednostek pneumatycznych.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Hydrodynamiczny basen testowy
      description: Testowanie na modelach skalowanych w naszym wewnętrznym basenie testowym w celu optymalizacji kształtu kadłuba, wydajności ślizgu, stabilności i efektywności paliwowej w zakresie obciążeń i warunków morskich.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Warsztat prototypowy
      description: Obiekt do pełnoskalowego prototypowania i wyposażania, w którym budowane, montowane i testowane są nowe modele. Każdy prototyp przechodzi minimum 20-godzinny program testów na wodzie przed zatwierdzeniem produkcji.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Laboratorium jakości i inspekcji
      description: Dedykowane laboratorium zapewniania jakości wykonujące testy rozciągania, cykle zatrzymywania powietrza, testy odrywania szwów i certyfikację materiałów, aby zapewnić, że każda łódź opuszczająca warsztat spełnia nasze opublikowane specyfikacje.
      href: /randdcenter/quality-inspection-lab
