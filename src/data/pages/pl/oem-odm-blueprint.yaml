faq:
  title: OEM/ODM — Najczęściej zadawane pytania
  questions:
    - q: Jaka jest minimalna ilość zamówienia (MOQ) dla niestandardowych nadmuchiwanych SUPs?
      a: Dla standardowych modeli z istniejącymi formami, MOQ zaczyna się od 5–10 sztuk na projekt. Dla w pełni niestandardowych form i narzędzi, MOQ wynosi zazwyczaj 200 sztuk. Współpracujemy ze startupami i nowo powstającymi markami, aby znaleźć możliwe punkty wejścia.
    - q: Jak długo trwa proces próbki OEM?
      a: Standardowe próbki prototypowe są przygotowywane w ciągu 7–14 dni roboczych po zatwierdzeniu projektu. Zamówienia przyspieszone mogą być priorytetowo realizowane w ciągu 5–7 dni za dodatkową opłatą.
    - q: Jaka jest różnica między PVC a Hypalon dla łodzi pneumatycznych?
      a: PVC jest lżejszy, bardziej przystępny cenowo i oferuje doskonałą elastyczność w zimnych warunkach. Hypalon (CSM) zapewnia lepszą UV i odporność na ozon oraz dłuższą żywotność (10–15 lat vs 5–8 lat). Zalecamy PVC do większości zastosowań rekreacyjnych, a Hypalon do zastosowań komercyjnych/profesjonalnych.
    - q: Czy możesz dostosować kształt i projekt dmuchanego przedmiotu?
      a: Tak. Nasz zespół badawczo-rozwojowy może opracować niestandardowe formy dla dowolnego kształtu kadłuba, obrysu deski lub konfiguracji tuby. Używamy CNC frezowanych form aluminiowych dla precyzji i spójności.
    - q: Czy świadczą Państwo usługi audytu fabryki?
      a: Zapraszamy do audytów zakładowych i audytów stron trzecich w naszej placówce w Qingdao o powierzchni 12 000 m². Posiadamy certyfikaty ISO 9001 i BSCI i możemy udostępnić raporty z audytów po podpisaniu umowy NDA.
    - q: Jakie warunki wysyłki oferujecie?
      a: Oferujemy warunki wysyłki FOB Qingdao (standard), CIF i DDP. Załadunek kontenera oraz pełna dokumentacja eksportowa są wliczone we wszystkie OEM zamówienia.
content_profiles:
  tagline: Profile marek
  title: OEM / Produkcja pod własną markę<br />Według typu klienta
  subtitle: Różne profile marek mają różne wymagania — dostosowujemy nasze usługi OEM/ODM do Twojego modelu biznesowego, skali i strategii wejścia na rynek.
  items:
    - title: Marki łodzi start-up
      subtitle: Niski MOQ, szybkie zwiększanie
      description: Przedsiębiorcy i założyciele wprowadzający na rynek swoją pierwszą linię SUPs, kajaków lub pontonów. Potrzebujesz partnera produkcyjnego, który traktuje Twoją markę jak własną — z niskimi progami wejściowymi, elastycznymi rozmiarami partii i praktycznym wsparciem w projektowaniu na każdym etapie.
      features:
        - MOQ tak nisko jak 50–100 jednostek na SKU, nie tysiące
        - Wcześniej istniejąca biblioteka form w celu uniknięcia kosztów narzędziowych
        - 'Pełny pakiet brandingowy: logo, grafiki na tubach, opakowania, metki zawieszane'
        - Pierwszy przepływ pracy próbki — zatwierdź przed produkcją
    - title: Ugruntowane marki morskie
      subtitle: OEM skala z CE/ISO zgodnością
      description: Istniejące marki łodzi, PWС lub akcesoriów morskich dodające do swojego portfolio pontony i jednostki nadmuchiwane. Potrzebujesz spójnej jakości w kolejnych seriach produkcyjnych, zgodności z przepisami na rynkach globalnych oraz możliwości współprojektowania niestandardowych kadłubów lub kształtów tub.
      features:
        - Projektowanie niestandardowych form 3D dla własnych projektów
        - CE 2013/53/UE, UKCA, USCG dokumentacja zgodności
        - BSCI raporty z audytu społecznego w zakresie zgodności detalisty
        - Dedykowane zarządzanie kontem + priorytetowe miejsca produkcyjne
    - title: Marki DTC i e-commerce
      subtitle: Opakowania gotowe do sprzedaży detalicznej na dużą skalę
      description: Marki działające w trybie online-first, sprzedające przez Amazon, Shopify lub swoje własne sklepy internetowe. Opakowanie, doświadczenie z otwierania paczki oraz jednolita jakość jednostek są kluczowe. Potrzebujesz fabryki, która rozumie dynamikę szybkości sprzedaży i wskaźników zwrotów w e-commerce.
      features:
        - Projekt pudełka gotowego do sprzedaży detalicznej + drukowanie karty wkładki
        - Pakowanie próżniowe / paletyzacja dla ekonomicznej wysyłki
        - Kod kreskowy EAN / UPC i dokumentacja gotowa do odprawy celnej
        - Konsolidacja kontenerów mieszanych w celu optymalizacji kosztów dostawy
    - title: Marki lifestylowe i outdoorowe
      subtitle: Projekt white-label + rozszerzenie kategorii
      description: Marki odzieżowe, sprzęt outdoorowy lub turystyczne wchodzące w kategorię sportów wodnych pod własną marką. Możesz nie mieć w zespole wiedzy z zakresu inżynierii morskiej — dlatego potrzebujesz partnera, który poprowadzi cię od pomysłu do kontenera z minimalną trudnością.
      features:
        - Badania trendów i tablice nastrojów koncepcji
        - Limitowane edycje współtworzone i sezonowe kolory
        - Cykl od projektu do próbki w 10–14 dni roboczych
        - 'Logistyka od początku do końca: fabryka → magazyn → konsument'
