hero:
  tagline: Szkoły i centra szkoleniowe sportów wodnych
  title: Rozwiązania sprzętowe<br />Dla szkół SUP i kajakarstwa
  subtitle: Niezawodny sprzęt klasy komercyjnej dla szkół wiosłowania, nauki surfingu, szkolenia kajakarstwa i programów edukacyjnych w zakresie sportów wodnych na dowolną skalę.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Deski SUP Paddle Board Overstock dla szkół i ośrodków szkoleniowych
direct_answer: Paddle Board Overstock zaopatruje szkoły SUP i kajakarstwa na całym świecie w deski klasy komercyjnej, sprzęt zabezpieczający i pakiety instruktorskie. Nasz sprzęt jest przeznaczony do codziennego użytku instruktażowego — grubszy PVC, wzmocnione rdzenie typu drop-stitch i stabilna konstrukcja kadłuba, która daje początkującym pewność siebie i niezawodność instruktorów. Pakiety obejmują niestandardowe brandingi, programy części zamiennych i zasoby szkoleniowe.
solution_offerings:
  - title: Szkolny Pakiet Startowy
    subtitle: Dla nowych programów i małych ośrodków szkoleniowych
    badge: Popular
    features:
      - title: Deski dla uczniów
        description: 10–25 uniwersalnych desek SUP lub kajaków rekreacyjnych ze stabilnymi platformami do nauki dla początkujących
      - title: Deski dla instruktorów
        description: Szersze, dłuższe deski z dodatkową stabilnością i antypoślizgowymi pokładami EVA do coachingu
      - title: Sprzęt bezpieczeństwa
        description: Kamizelki ratunkowe, smycze, gwizdki i torby na rzucanie w pasujących kolorach
      - title: Przechowywanie i transport
        description: Możliwość układania w stosy stojaków na deski, wyściełanych kołysek kajakowych i wózków transportowych
      - title: Wsparcie programu nauczania
        description: Szablony lekcji, listy kontrolne bezpieczeństwa i przewodniki rozwoju umiejętności
    cta_text: Rozpocznij mój pakiet szkolny
    cta_href: /contact
  - title: Pakiet Szkolny Premium
    subtitle: Dla uznanych szkół i operatorów wielu programów
    badge: Best Value
    features:
      - title: Pełna flota
        description: 25–50 desek lub kajaków z flotą mieszaną (uniwersalne, turystyczne, młodzieżowe)
      - title: Flota instruktorska
        description: 3–5 specjalistycznych tablic instruktorskich z wbudowanymi uchwytami nagłośnieniowymi
      - title: Stacja Bezpieczeństwa
        description: Scentralizowana stacja sprzętu ochronnego z PFD, radiami, pierwszą pomocą i oznakowaniem
      - title: Pakiet brandingowy
        description: Pełny nadruk logo na deskach, wiosłach, PFD i mundurach
      - title: Program konserwacji
        description: Kwartalne zestawy konserwacyjne, pakiety części zamiennych i szkolenia w zakresie napraw
    cta_text: Skonfiguruj pakiet Premium
    cta_href: /contact
  - title: Pakiet Franczyzowy Szkoły
    subtitle: Dla sieci wielolokacyjnych i operatorów franczyzowych
    badge: Enterprise
    features:
      - title: Standaryzacja floty
        description: Identyczny sprzęt we wszystkich lokalizacjach zapewniający spójne doświadczenia uczniów
      - title: Centralne Zamawianie
        description: Skonsolidowane zamawianie, ceny zbiorcze i scentralizowane zarządzanie częściami zamiennymi
      - title: Szkolenie Instruktorskie
        description: Certyfikacja obsługi i konserwacji sprzętu dla wszystkich instruktorów
      - title: Wspólne brandingowanie
        description: Wspólny branding z franczyzą + opcje co-brandingu Paddle Board Overstock
      - title: Wsparcie ekspansji
        description: Konsultacje dotyczące skalowania, prognozowanie sprzętu i konfiguracja nowej lokalizacji
    cta_text: Omów plan franczyzy
    cta_href: /contact
benefits:
  - title: Zbudowany do codziennych instrukcji
    description: Grubsze PCV i wzmocnione szyny wytrzymują codzienne użytkowanie przez uczniów, upadki na piasek i kamieniste lądowania.
    icon: tabler:shield
  - title: Stabilne platformy edukacyjne
    description: Szersze kadłuby i bardziej płaskie rockery dają początkującym pewność siebie. Instruktorzy skupiają się na nauczaniu, a nie na sprzęcie.
    icon: tabler:scale
  - title: Łatwe przechowywanie i transport
    description: Nadmuchiwane designerskie sklepy na małych przestrzeniach. Opróżnione tablice mieszczą się w standardowych bagażnikach pojazdów do mobilnego nauczania.
    icon: tabler:box-seam
  - title: Niestandardowe oznakowanie
    description: Logo i kolory szkoły na każdej tablicy. Twoja marka, Twoja tożsamość — a nie zwykły sprzęt do wypożyczenia.
    icon: tabler:brush
content_segments:
  tagline: Profile szkół
  title: Rozwiązania edukacyjne w zakresie sportów wodnych<br />Według typu programu
  subtitle: Szkoły wiosłowania, akademie surfingu, programy uniwersyteckie i operatorzy franczyzowi stoją przed różnymi wyzwaniami operacyjnymi – od integracji programów nauczania po standaryzację floty w wielu lokalizacjach. Konfigurujemy pakiety wyposażenia dopasowane do modelu edukacyjnego.
  items:
    - title: Niezależne szkoły SUP i kajakarstwa
      subtitle: Centra szkoleniowe prowadzone przez właścicieli
      description: Małe i średnie szkoły prowadzone przez właścicieli-instruktorów oferujące lekcje SUP, szkolenia kajakowe i kursy certyfikacyjne. Sprzęt musi być wystarczająco trwały, aby można go było używać na co dzień w celach edukacyjnych, przystępny cenowo przy budżecie małej firmy i wystarczająco wszechstronny, aby w ramach jednej floty służyć zarówno początkującym, jak i średniozaawansowanym uczniom.
      features:
        - Stabilne uniwersalne deski SUP i kajaki rekreacyjne na lekcje dla początkujących
        - Deski przeznaczone dla instruktorów z dodatkową stabilnością do prowadzenia zajęć z wody
        - W zestawie szablony planów lekcji i przewodniki progresji umiejętności
        - Roczny program wymiany sprzętu ze zniżkami za oddanie starego
    - title: Programy rekreacyjne na uniwersytetach i uczelniach
      subtitle: Wielkoskalowe floty rekreacyjne dla studentów
      description: Uniwersyteckie wydziały rekreacji obsługujące kluby wiosłowe, programy wynajmu i kursy instruktażowe w ramach oferty rekreacyjnej na kampusie. Sprzęt jest najbardziej obciążony w trakcie semestrów, wymaga łatwych systemów zameldowania/wymeldowania i musi wytrzymać różne poziomy umiejętności, od początkujących uczniów po zaawansowanych wioślarzy.
      features:
        - Konstrukcja z wysokotrwałego PVC przeznaczona do instytucjonalnych cykli użytkowania
        - Floty oznaczone kolorami według poziomu umiejętności dla łatwego zarządzania
        - Zgodność z systemami śledzenia zapasów opartymi na RFID lub naklejki
        - Ceny hurtowe z zamówieniami i warunkami płatności semestralnymi
    - title: Szkoły i akademie surfingu
      subtitle: Programy nauczania surfingu przybrzeżnego
      description: Szkoły surfingu uczące surfingu SUP, wiosłowania na brzuchu i pływania kajakiem w środowisku oceanicznym. Sprzęt musi wytrzymać warunki panujące w strefie surfingu – odporność na uderzenia, tolerancję na piasek i słoną wodę oraz łatwe płukanie i powrót pomiędzy godzinnymi lekcjami.
      features:
        - Kształty surfowe z wzmocnionymi rantami i konstrukcją odporną na uderzenia
        - Opcje miękkich płetw i zwiniętych leashy dla bezpieczeństwa uczniów
        - Materiał do szybkiego płukania, który schnie między zmianami lekcji
        - Program wymiany floty z inspekcją i odnową na koniec sezonu
    - title: Sieci franczyzowe i wielolokacyjne
      subtitle: Standaryzowany sprzęt w różnych lokalizacjach
      description: Operatorzy z wieloma lokalizacjami prowadzący standardowe programy szkoleniowe w wielu miastach lub regionach. Spójność floty w różnych lokalizacjach jest najważniejsza — każdy student powinien mieć takie samo doświadczenie ze sprzętem, niezależnie od tego, którą lokalizację franczyzową odwiedza. Scentralizowane zamawianie, jednolitość marki i wsparcie skalowania są niezbędne.
      features:
        - Identyczne specyfikacje floty we wszystkich lokalizacjach franczyzowych
        - Scentralizowane skonsolidowane zamówienia z cenami hurtowymi
        - 'Opcje cobrandingu: marka franczyzy + cobranding Paddle Board Overstock'
        - 'Zestaw do otwarcia nowej lokalizacji: sprzęt, oznakowanie i zapas na otwarcie'
