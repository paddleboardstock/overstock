content_challenge:
  tagline: Wyzwanie
  title: Operacje ratownicze wymagają<br />niezawodności bez kompromisów
  subtitle: Organizacje poszukiwawczo-ratownicze ponoszą szczególną odpowiedzialność za bezpieczeństwo – każda awaria łodzi niesie ze sobą niedopuszczalne konsekwencje.
  paragraphs:
    - W akcjach ratowniczych różnicę między sukcesem a porażką mierzy się w minutach. Łódź musi być gotowa do natychmiastowego wodowania, działać w trudnych warunkach i bezpiecznie wracać z pasażerami. Odpowiedzialność za bezpieczeństwo jest absolutna – awaria mechaniczna podczas misji ratunkowej nie jest kosztem naprawy, ale utratą życia.
    - Łodzie SAR potrzebują dużej prędkości, aby szybko dotrzeć do ofiar, w połączeniu z wyjątkową stabilnością, aby zapewnić bezpieczne operacje ratownicze. Muszą nosić sprzęt ratowniczy, środki medyczne i sprzęt komunikacyjny – często na ograniczonej przestrzeni na pokładzie. Łodzie pływające w służbie rządowej również potrzebują długiego okresu użytkowania (ponad 10–15 lat), aby uzasadnić budżety na zamówienia publiczne.
    - Widoczność, zarówno dla operatora, jak i przy przeszukiwaniu, jest kluczowa. Konstrukcja konsoli musi zapewniać widoczność 360 stopni, a łódź powinna być doskonale widoczna dla samolotów i innych jednostek.
    - Ratownicze łodzie RIB Aquafarer są projektowane od stępki w górę z myślą o tych wymaganiach — z samoodpływającymi się pokładami, wzmocnionymi kadłubami, zestawami nawigacyjnymi i słupkami holowniczymi w standardzie modeli patrolowych.
content_solution:
  tagline: Nasze rozwiązanie
  title: Ratownicze RIB budowane celowo
  subtitle: Każda łódź ratownicza Aquafarer jest zaprojektowana tak, aby spełniać lub przekraczać normy SOLAS i krajowe normy SAR.
  list:
    - Samoodpływający się pokład — woda odpływa automatycznie, zapewniając stabilność podczas operacji podnoszenia z wody
    - Wzmocniony kadłub deep-V — dzielność na wzburzonym morzu z przewidywalnym prowadzeniem przy prędkości
    - Pełny zestaw świateł nawigacyjnych — praca dniem i nocą w każdych warunkach pogodowych
    - Słupek i lina holownicza — gotowe do holowania jednostek lub operacji z saniami ratowniczymi
    - Płyty montażowe na sprzęt — radio, reflektor poszukiwawczy, syrena i sprzęt medyczny
    - Różne konfiguracje silników — pojedynczy silnik zaburtowy lub redundancja z dwoma silnikami
    - Wysoko widoczne kolory tub — pomarańczowy, żółty lub czerwony dla maksymalnej widoczności
content_segments:
  tagline: Profile ratunkowe
  title: Rozwiązania dla jednostek pływających poszukiwawczo-ratowniczych<br />Według typu organizacji
  subtitle: Różne organizacje ratownicze działają w ramach różnych mandatów, cykli budżetowych i środowisk operacyjnych – od przybrzeżnych załóg ochotniczych po floty krajowej straży przybrzeżnej. Każdą akcję ratunkową RIB konfigurujemy tak, aby pasowała do profilu misji.
  items:
    - title: Straż przybrzeżna i agencje rządowe SAR
      subtitle: Całkowita odpowiedzialność za bezpieczeństwo — standardy floty o znaczeniu krytycznym
      description: Agencje rządowe SAR ponoszą największą odpowiedzialność za bezpieczeństwo operacji morskich. Każda łódź musi działać bez zarzutu w ekstremalnych warunkach — awaria sprzętu podczas misji ratunkowej nie wchodzi w grę. Decyzje dotyczące zamówień są podejmowane na podstawie całkowitego kosztu posiadania w ciągu 10–15 lat okresu użytkowania, a nie ceny początkowej. Agencje potrzebują statków, które przetrwają lata patroli przybrzeżnych, spełniają rygorystyczne normy krajowe i zapewniają stałą wydajność na rozproszonych stacjach. Obowiązkowa jest kompleksowa dokumentacja dotycząca zgodności i wieloletnie umowy serwisowe.
      features:
        - Pakiet dokumentacji zgodności z normami SOLAS i krajowymi SAR
        - Ujednolicenie części w całej flocie — zmniejszenie złożoności zapasów na poziomie stacji
        - Konfiguracja dwusilnikowa zapewniająca redundancję o znaczeniu krytycznym
        - Projekt żywotności 10-15 lat z planowymi programami konserwacji
        - Możliwość pracy w każdych warunkach pogodowych — wzmocniony kadłub deep-V na wzburzone warunki morskie
    - title: Ratownik i ratownictwo plażowe
      subtitle: Szybkie starty i operacje na płytkich wodach
      description: Służby ratowników miejskich i nadmorskich potrzebują statków szybkiego reagowania, które mogą wypływać przez strefy surfowania, działać na płytkich wodach przybrzeżnych i docierać do pływaków lub zagrożonych jednostek w ciągu kilku minut. Sprzęt musi być wystarczająco lekki, aby można go było holować na plaży małym pojazdem lub ręcznie.
      features:
        - Kadłub o płytkim zanurzeniu RIB do użytku w strefie surfingowej i przybrzeżnej
        - Możliwość wodowania z plaży z dziobowym uchwytem do podnoszenia i osłoną stępki
        - Zintegrowane sanki ratownicze lub platforma dla pływaków ratowniczych
        - Standardowe kolory rurek w kolorze pomarańczowym lub żółtym o wysokiej widoczności
    - title: Oddziały Ratownictwa Pożarnego
      subtitle: Integracja pompy pożarniczej, montaż sprzętu, szybka reakcja
      description: Jednostki morskie ratownictwa pożarowego reagują na pożary konstrukcji nabrzeża, pożary statków i zdarzenia związane z ratownictwem wodnym. Łodzie te muszą być wyposażone w pompy strażackie, monitory, schowki na węże i aparaty oddechowe – a wszystko to zintegrowane w stabilną platformę szybkiego reagowania. Departamenty wykorzystują te statki również do reagowania na powódź i operacji wzajemnej pomocy. Układy konsoli muszą uwzględniać sterowanie pompami, systemy radiowe i oświetlenie awaryjne, nie ograniczając przy tym przestrzeni na pokładzie umożliwiającej ruch załogi.
      features:
        - Monitor przeciwpożarowy montowany na dziobie z pakietem integracji pompy
        - Dedykowane mocowanie sprzętu dla pompy strażackiej, magazynu węży i ​​zestawów BA
        - Konfigurowalny układ konsoli do sterowania pompą, radiem i oświetleniem awaryjnym
        - Pokład samousuwający się zapewniający odpływ wody gaśniczej i stabilność
        - 'Pakiet operacji nocnych: reflektor, oświetlenie sceny, niebieski/czerwony pasek świetlny'
    - title: Policja morska i ochrona portu
      subtitle: Zakaz, patrol, operacje abordażowe
      description: Jednostki egzekwowania prawa morskiego wymagają statków zdolnych do szybkiego pościgu, wchodzenia na pokład podejrzanych statków i patrolowania bezpieczeństwa portu. Łodzie te muszą mieć bezpieczne miejsce do przechowywania sprzętu i broni, komunikację z dowództwem na lądzie oraz wystarczającą przestrzeń na pokładzie dla działań zespołu abordażowego. Zdolność do prowadzenia operacji nocnych i podejście dyskretne są niezbędne w misjach przechwytujących.
      features:
        - Możliwość pościgu przy dużych prędkościach — ślizganie się kadłuba z prędkością maksymalną ponad 40 węzłów
        - Bezpieczne schowki na broń i schowki na sprzęt egzekucyjny
        - Integracja konsoli dla radiotelefonów policyjnych, MDT i systemów komunikacyjnych
        - 'Pakiet do operacji nocnych: reflektor IR, uchwyt FLIR, oświetlenie ukryte'
        - Wzmocniona platforma wejściowa z powierzchnią antypoślizgową
        - Niebiesko-czerwony system oświetlenia awaryjnego i syreny
    - title: Wolontariat SAR i organizacje non-profit
      subtitle: Finansowane z dotacji, prowadzone przez społeczność działania na wybrzeżach i jeziorach
      description: Społeczne grupy ratownicze działają na jeziorach, rzekach i obszarach przybrzeżnych, gdzie zasięg rządowy SAR jest ograniczony. Organizacje te, często finansowane z darowizn lub dotacji rządowych, potrzebują maksymalnej wydajności w przeliczeniu na dolara — niezawodnego statku wymagającego niewielkiej konserwacji, z którego wolontariusze będą mogli bezpiecznie korzystać po minimalnym dedykowanym szkoleniu. Cykle pozyskiwania dotacji oznaczają, że łodzie muszą spełniać wymogi zgodności, nie przekraczając ustalonych budżetów.
      features:
        - Konfiguracja z jednym silnikiem zaburtowym zoptymalizowana pod kątem niższych kosztów zakupu i eksploatacji
        - Konstrukcja PVC zapewniająca mniejszą konserwację i łatwą naprawę w terenie
        - Wielofunkcyjna konsola minimalizująca złożoność elektroniki dla operatorów-wolontariuszy
        - Pakiet dokumentacji zgodności z dotacjami dla wniosków o dofinansowanie
        - Lekka konstrukcja do wodowania na plaży bez dedykowanej przyczepy lub dźwigu
    - title: Ratownictwo powodziowe i reagowanie na katastrofy
      subtitle: Powodzie śródlądowe, płytka woda, środowiska obciążone gruzem
      description: Ratownictwo powodziowe ma odrębny profil operacyjny — łodzie działają na zalanych obszarach miejskich, w prądach pełnych gruzu i na niezwykle płytkich wodach, gdzie zanurzone przeszkody są niewidoczne. Operatorzy potrzebują statków, które będą w stanie poruszać się po zalanych ulicach, przepychać gruz i wydobywać ofiary z budynków i pojazdów. Możliwość płytkiego zanurzenia jest krytyczna, podobnie jak zdolność do pracy pod prądem, w przypadku którego istnieje ryzyko zaczepienia. Łodzie te są często wykorzystywane przez straż pożarną, obronę cywilną i organizacje pozarządowe zajmujące się pomocą w przypadku klęsk żywiołowych.
      features:
        - Kadłub o bardzo małym zanurzeniu – działa na głębokości 30-50 cm
        - Dziób odbijający zanieczyszczenia i wzmocniona osłona rurowa przed zanurzonymi przeszkodami
        - Pokład samousuwający się do spływu wód powodziowych i odzyskiwania ofiar
        - Pomarańczowe lub żółte tuby o wysokiej widoczności, zapewniające widoczność podczas rozpoznania powietrznego
        - Lekka konstrukcja do transportu helikopterem i zastosowań drogowych
        - Wzmocnione punkty podnoszenia do akcji ratunkowych przy użyciu wciągników i lin
