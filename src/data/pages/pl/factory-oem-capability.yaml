services:
  - title: Projektowanie i inżynieria produktów
    description: Nasz wewnętrzny zespół R&D pracuje z Twoją koncepcją lub specyfikacją, tworząc rysunki CAD, modele 3D i prototypy. Oferujemy projektowanie form, optymalizację kształtu kadłuba i doradztwo w doborze materiałów.
  - title: Niestandardowy branding i grafika
    description: Pełnokolorowy druk cyfrowy, sitodruk, tłoczenie i opcje etykiet. Tworzymy dedykowaną grafikę pokładów, branding tub i opakowania gotowe do sprzedaży detalicznej.
  - title: Dostosowanie materiałów i specyfikacji
    description: Wybierz spośród PVC (standardowy, ekologiczny, ognioodporny), Hypalon/CSM, drop-stitch i konstrukcji hybrydowych. Niestandardowe kolory tub, gramatura tkanin i opcje wzmocnień.
  - title: Pakowanie i logistyka
    description: Niestandardowe opakowania detaliczne, pudełka marki własnej, pakowanie próżniowe, paletyzacja i załadunek kontenerów. Dostępne warunki FOB Qingdao, CIF lub DDP.

