why_us:
  - title: Integracja pionowa
    description: Posiadamy własną fabrykę, formy i łańcuch dostaw — bez pośredników i podwykonawców. Daje nam to kontrolę nad jakością, kosztem i dostawą.
  - title: Podwójna certyfikacja
    description: Zarządzanie jakością ISO 9001 i certyfikacja zgodności społecznej BSCI. Raporty z audytu fabryki dostępne na życzenie.
  - title: Zgodność CE
    description: Wszystkie standardowe modele posiadają certyfikację CE 2013/53/EU. Modele niestandardowe mogą uzyskać certyfikację CE w ramach naszego ustalonego procesu.
  - title: Niskie MOQ
    description: Zacznij już od 5 sztuk modeli standardowych. Pomagamy wschodzącym markom wchodzić na rynek bez nadmiernego obciążania zapasami.
