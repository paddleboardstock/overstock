hero:
  tagline: Przewodniki
  title: Nowy w SUP-ie?
  subtitle: Praktyczne przewodniki, które pomogą Ci wybrać, używać i cieszyć się nadmuchiwanym sprzętem do uprawiania sportów wodnych.
size_guide:
  tagline: Rozmiar i specyfikacje
  title: Znajdź odpowiedni rozmiar dla swoich potrzeb
  desc: Porównaj wymiary produktu, udźwig i zalecane zastosowania. Niezależnie od tego, czy potrzebujesz turystycznego SUP, kompaktowego kajaka, czy komercyjnego RIB-a — nasz przewodnik po rozmiarach pomoże Ci wybrać odpowiednie dopasowanie.
  link_label: Pełnowymiarowy przewodnik ze specyfikacją produktu →
  link: /size-guide
  cards:
    - title: Deski SUP-owe
      desc: Wybierz długość w oparciu o swoją wagę i przeznaczenie. Szersze deski (32" i więcej) zapewniają większą stabilność. Dłuższe deski (11-12 stóp) lepiej trzymają się trasy w trasie.
    - title: Kajaki
      desc: Pojedyncze kajaki (9 stóp) do podróży w pojedynkę i po rzekach. Kajaki tandemowe (12 stóp) dla dwóch wioślarzy lub jednego ze sprzętem. Zawsze sprawdzaj nośność.
    - title: Pontony i RIB-y
      desc: Wybierz długość według liczby pasażerów i zastosowania. Większe RIBy (4,5 m+) do zastosowań offshore i ratowniczych. Mniejsze pontony (2,7 m) jako pontony i platformy rybackie.
