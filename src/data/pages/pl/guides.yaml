hero:
  tagline: Przewodniki
  title: Nowy w SUP-ie?
  subtitle: Praktyczne przewodniki, które pomogą Ci wybrać, używać i cieszyć się nadmuchiwanym sprzętem do uprawiania sportów wodnych.
size_guide:
  tagline: Rozmiar i specyfikacje
  title: Znajdź odpowiedni rozmiar dla swoich potrzeb
  desc: Porównaj wymiary deski, nośność i zalecane zastosowania. Niezależnie od tego, czy chcesz stabilną deskę uniwersalną, czy szybszy kształt turystyczny — nasz przewodnik po rozmiarach pomoże Ci wybrać odpowiedni fit.
  link_label: Pełnowymiarowy przewodnik ze specyfikacją produktu →
  link: /size-guide
  cards:
    - title: Uniwersalne deski SUP
      desc: Nasze deski o długości ~11 stóp (32 cale szerokości) łączą stabilność, szybkość i pojemność. 6-calowe drop-stitch rdzenie przy 15 PSI utrzymują deskę sztywną dla wioślarzy na każdym poziomie.
    - title: Szerokość i stabilność
      desc: Szersze deski (32"+) oferują większą stabilność dla początkujących, jogi i wędkowania. Grubość 6 cali zwiększa sztywność i nośność zarówno dla użytkownika, jak i sprzętu.
    - title: Pakiety i akcesoria
      desc: Każda deska jest dostarczana jako kompletny zestaw — deska, plecak podróżny, pompka ręczna, regulowana wiosło, wyjmowane fin, linka bezpieczeństwa typu coil i zestaw naprawczy. Sprawdź maksymalne obciążenie dla jeźdźca wraz ze sprzętem.
