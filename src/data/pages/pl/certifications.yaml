hero:
  tagline: Certyfikaty i normy
  title: 'Certyfikaty jakości<br />i normy zgodności'
  subtitle: 'Produkty Aquafarer są wytwarzane zgodnie z międzynarodowymi normami bezpieczeństwa morskiego, systemami zarządzania jakością oraz przepisami środowiskowymi.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Certyfikaty jakości i dokumentacja zgodności Aquafarer
content_certifications:
  tagline: Nasze Certyfikaty
  title: 'Certyfikowana jakość,<br />uznana na świecie'
  subtitle: '64 modele z certyfikatem CE i certyfikaty całej fabryki potwierdzają nasze zaangażowanie w jakość, bezpieczeństwo i odpowiedzialność środowiskową.'
  items:
    - title: 'Certyfikat CE'
      description: '64 modele z certyfikatem CE spełniają europejskie wymagania oznakowania CE dla jednostek rekreacyjnych, zapewniając zgodność ze standardami bezpieczeństwa, zdrowia i ochrony środowiska.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Nasz system zarządzania jakością jest certyfikowany zgodnie z ISO 9001:2015 i obejmuje projektowanie, produkcję oraz dystrybucję łodzi pneumatycznych i sprzętu morskiego.'
      icon: tabler:clipboard-check
    - title: 'Oznaczenie UKCA'
      description: 'Produkty sprzedawane na rynku brytyjskim posiadają oznakowanie UKCA, potwierdzające zgodność z brytyjskimi przepisami dotyczącymi sprzętu morskiego i jednostek rekreacyjnych.'
      icon: tabler:shield
    - title: 'Zgodność z BSCI'
      description: 'Aquafarer jest audytowana w ramach BSCI (Business Social Compliance Initiative), co dowodzi etycznych praktyk produkcyjnych, uczciwych warunków pracy i odpowiedzialności w łańcuchu dostaw.'
      icon: tabler:heart-handshake
    - title: 'Zgodność z REACH'
      description: 'Wszystkie materiały używane w produktach Aquafarer spełniają unijne rozporządzenie REACH w zakresie bezpieczeństwa chemicznego, co gwarantuje brak substancji ograniczonych w naszym PVC, Hypalon i komponentach.'
      icon: tabler:flask
    - title: 'Badania Materiałów'
      description: 'Tkaniny są badane pod kątem wytrzymałości na rozciąganie, odporności na rozdzieranie, degradacji UV i wydajności w niskich temperaturach. Każda partia produkcyjna jest próbkowana i weryfikowana.'
      icon: tabler:test-pipe
content_factory:
  tagline: Standardy Fabryczne
  title: 'Doskonałość produkcyjna<br />— zgodnie ze specyfikacją'
  subtitle: 'Nasz zakład o powierzchni 12,000 m² działa według rygorystycznych protokołów kontroli jakości na każdym etapie produkcji.'
  list:
    - 'Kontrola materiałów przyjętych: wszystkie surowce — tkanina PVC, Hypalon, aluminium, sklejka, kleje — są badane względem specyfikacji przed wprowadzeniem do produkcji.'
    - 'Kontrola jakości w procesie: każdy etap produkcji ma udokumentowane punkty kontrolne QC. Wytrzymałość spoin, zgodność szwów, montaż zaworów i moment dokręcania osprzętu są weryfikowane na linii.'
    - 'Próba ciśnieniowa: Każda nadmuchiwana komora jest poddawana próbie ciśnieniowej przy ciśnieniu znamionowym 1,25 × przez 24–48 godzin. Aby uzyskać ocenę pozytywną, wskaźnik wycieku musi wynosić zero.'
    - 'Kontrola końcowa: gotowe produkty są sprawdzane pod kątem dokładności wymiarowej, wykończenia estetycznego, kompletności akcesoriów i integralności opakowania przed wysyłką.'
    - 'Identyfikowalność partii: każdy produkt ma numer seryjny powiązany z zapisami partii produkcyjnej, co umożliwia pełną identyfikowalność od surowca do wyrobu gotowego.'
content_safety:
  tagline: Morskie normy bezpieczeństwa
  title: 'Bezpieczeństwo przede wszystkim<br />— zaprojektowane do niezawodnej pracy'
  subtitle: 'Produkty Aquafarer są projektowane i badane tak, aby spełniały międzynarodowe normy bezpieczeństwa morskiego do użytku komercyjnego i rekreacyjnego.'
  items:
    - title: 'ISO 6185'
      description: 'Łodzie pneumatyczne spełniają normy ISO 6185 dotyczące konstrukcji, stateczności, wyporności i udźwigu.'
      icon: tabler:sailboat
    - title: 'Normy ABYC'
      description: 'Systemy elektryczne i paliwowe są zgodne ze standardami ABYC (American Boat & Yacht Council) dotyczącymi bezpiecznego montażu i eksploatacji.'
      icon: tabler:bolt
    - title: 'Zgodność z SOLAS'
      description: 'Sprzęt ratunkowy i środki ratunkowe spełniają wymagania SOLAS (Safety of Life at Sea) wszędzie tam, gdzie ma to zastosowanie.'
      icon: tabler:lifebuoy
cta:
  title: 'Potrzebujesz certyfikowanych produktów do swojego projektu?'
  subtitle: 'Skontaktuj się z naszym zespołem, aby omówić wymagania certyfikacyjne, dokumentację i zgodność dla Twojego rynku.'
  actions:
    - variant: primary
      text: Poproś o dokumenty certyfikacyjne
