content_benefits:
  tagline: Korzyści z partnerstwa
  title: Dlaczego dystrybutorzy<br />Wybierz Aquafarer
  subtitle: Partnerstwo przeznaczone dla dystrybutorów morskich, którzy potrzebują niezawodnych dostaw, konkurencyjnych marż i profesjonalnego wsparcia.
  items:
    - title: Ochrona Terytorium
      description: Wyłączne lub półwyłączne prawa terytorialne dla kwalifikowanych dystrybutorów. Mapowanie rynku i zarządzanie konfliktami kanałów w celu ochrony Twojej inwestycji w budowanie marki Aquafarer w Twoim regionie.
      icon: tabler:map-pin
    - title: Konkurencyjne ceny hurtowe
      description: Ceny wielopoziomowe oparte na rocznych zobowiązaniach dotyczących wolumenu. Struktura cenowa chroniąca marżę z gwarancjami ceny z wyprzedzeniem i przejrzystym zestawieniem kosztów (na podstawie FOB Qingdao).
      icon: tabler:currency-dollar
    - title: Zestaw wsparcia marketingowego
      description: Profesjonalne zdjęcia produktów, arkusze specyfikacji, szablony dokumentacji zgodności, treści w mediach społecznościowych i materiały marketingowe pod wspólną marką. Corocznie aktualizowana o nowe produkty.
      icon: tabler:photo
    - title: Szkolenie techniczne
      description: Szkolenia produktowe dla zespołu sprzedaży (wirtualne lub na miejscu), szkolenia w zakresie konserwacji i napraw dla techników serwisowych oraz często zadawane pytania i przewodniki dotyczące rozwiązywania problemów dla klientów.
      icon: tabler:school
    - title: Części zamienne i obsługa posprzedażna
      description: Dedykowana dostawa części zamiennych z priorytetową wysyłką. Dostępne są zamienne sekcje rurowe, zawory, żebra i zestawy naprawcze umożliwiające szybką realizację zamówień. Wsparcie w przetwarzaniu roszczeń gwarancyjnych.
      icon: tabler:tool
    - title: Dokumentacja zgodności
      description: 'Pełny pakiet dokumentacji zgodności dla Twojego rynku: CE DoC, dane na tabliczce znamionowej producenta, instrukcje obsługi i wsparcie w zakresie rejestracji regulacyjnej. Eliminuje obciążenie związane z przestrzeganiem przepisów.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Czego szukamy
  title: Dystrybutor<br />Wymagania
  subtitle: Poszukujemy partnerów, którzy mogą profesjonalnie reprezentować i wspierać produkty Aquafarer na swoim terytorium.
  items:
    - title: Znajomość terytorium i rynku
      description: Ugruntowana obecność na rynku sportów morskich, sportów wodnych i rekreacji na świeżym powietrzu. Zrozumienie lokalnych przepisów, preferencji konsumentów i kanałów dystrybucji produktów do jednostek pływających.
      icon: tabler:target
    - title: Doświadczenie branżowe
      description: Minimum 2 lata doświadczenia w dystrybucji sprzętu morskiego, outdoorowego lub sportowego. Udokumentowane doświadczenie we współpracy z międzynarodowymi markami i sprzedażą hurtową B2B.
      icon: tabler:briefcase
    - title: Salon wystawowy lub magazyn
      description: Fizyczny obiekt do ekspozycji produktów, przechowywania zapasów i obsługi klienta. Możliwość utrzymywania jednostek demonstracyjnych i zapasów części zamiennych na swoim terytorium.
      icon: tabler:building-store
    - title: Zaangażowanie w standardy marki
      description: Chęć utrzymywania standardów prezentacji marki Aquafarer, zapewniania obsługi klienta zgodnie z naszymi protokołami usług i uczestniczenia w corocznych aktualizacjach szkoleń produktowych.
      icon: tabler:star
content_process:
  tagline: Proces aplikacyjny
  title: Dealer w 4 krokach<br />Proces składania wniosku
  subtitle: Od wstępnego zapytania do pierwszej wysyłki — prosty proces wdrożenia.
  steps:
    - number: '01'
      title: Wstępne zapytanie i kwalifikacja
      description: Prześlij swoją aplikację dystrybutorską, podając dane firmy, obszar zainteresowania, aktualne linie produktów i szacunki rocznej wielkości sprzedaży. Rozpatrujemy w ciągu 5 dni roboczych.
      timeline: 5 dni
    - number: '02'
      title: Przegląd i warunki biznesowe
      description: Wirtualne spotkanie w celu omówienia strategii terytorialnej, poziomów cenowych i warunków partnerstwa. Przejrzyj wymagania dotyczące dokumentacji zgodności na swoim rynku. Podpisanie umowy NDA w razie potrzeby.
      timeline: 1-2 tygodnie
    - number: '03'
      title: Przykładowe zamówienie i ocena
      description: Złóż pierwsze zamówienie na próbkę (2–5 jednostek) po cenach dystrybutora w celu oceny rynku i szkolenia zespołu. W cenie pełna dokumentacja zgodności i przygotowanie wersji demonstracyjnej.
      timeline: 30-45 dni
    - number: '04'
      title: Uruchomienie partnerstwa i wsparcie
      description: Pierwsze zamówienie kontenerowe z aktywowaną ochroną terytorium. Dostarczono zestaw marketingowy, przeszkolono zespół sprzedaży i przydzielono dedykowanego opiekuna klienta. Bieżące kwartalne przeglądy biznesowe.
      timeline: Bieżący
content_application_docs:
  tagline: Dokumenty aplikacyjne
  title: Wymagane dokumenty<br />do aplikacji dealerskiej
  subtitle: Aby aplikować o przedstawicielstwo Aquafarer, przygotuj następujące dokumenty i informacje dla naszego zespołu weryfikacyjnego.
  items:
    - title: Zaświadczenie o rejestracji firmy
      description: Ważny dokument rejestracji firmy wskazujący nazwę prawną, zarejestrowany adres i zakres działalności obejmujący dystrybucję sprzętu morskiego, sportowego lub outdoorowego.
      icon: tabler:file-text
    - title: Plan pokrycia terytorialnego
      description: Interesujące terytorium geograficzne, istniejąca sieć sprzedaży lub dystrybucji, docelowe segmenty klientów oraz proponowany roczny wolumen według kategorii produktów (RIB, SUP, kajak).
      icon: tabler:map
    - title: Możliwości salonu lub magazynu
      description: Lokal fizyczny do prezentacji produktów, przechowywania zapasów i obsługi klienta. Zdjęcia lub plany pokazujące strefę demo i możliwości magazynowania części zamiennych.
      icon: tabler:building
    - title: Oświadczenie o zdolności finansowej
      description: 'Referencja bankowa lub sprawozdanie finansowe potwierdzające zdolność do złożenia początkowego zamówienia kontenerowego i utrzymania zapasów. Minimalne zamówienie początkowe: jeden kontener 20-stopowy (10-20 sztuk, modele mieszane).'
      icon: tabler:coin
    - title: Możliwości wsparcia posprzedażowego
      description: Technicy serwisu wyszkoleni lub gotowi do szkolenia w zakresie konserwacji i napraw łodzi pneumatycznych. Możliwość obsługi roszczeń gwarancyjnych i zobowiązanie do utrzymania zapasów części.
      icon: tabler:tool
    - title: Referencje wcześniejszych marek
      description: Lista marek sprzętu morskiego lub sportowego aktualnie lub wcześniej dystrybuowanego. Kontaktowe referencje dostępne po obopólnej zgodzie. Startupy bez wcześniejszego doświadczenia w dystrybucji mogą się zakwalifikować przy silniejszym zaangażowaniu finansowym.
      icon: tabler:users
faq:
  title: Program dealerski — często zadawane pytania
  questions:
    - q: Jaka jest minimalna wielkość zamówienia dla dystrybutorów?
      a: MOQ dystrybutora zaczyna się od 10-20 sztuk na zamówienie, z elastycznością dla modeli mieszanych (RIB, nadmuchiwane, SUP). Wstępne zamówienia próbne 2-5 sztuk są dostępne po cenach dystrybutora w celu oceny rynku.
    - q: Czy oferujecie wyłączne prawa terytorialne?
      a: Wyłączne prawa terytorialne są dostępne dla kwalifikowanych dystrybutorów, którzy spełniają roczne zobowiązania dotyczące wielkości sprzedaży i zachowują standardy marki. Dla rynków wschodzących dostępne są również porozumienia półwyłączne i niewyłączne.
    - q: Jakie wsparcie marketingowe zapewniacie?
      a: Zapewniamy kompleksowy zestaw marketingowy obejmujący profesjonalne zdjęcia produktów, arkusze specyfikacji, szablony dokumentacji zgodności, bibliotekę treści do mediów społecznościowych i materiały pod wspólną marką. Corocznie aktualizowana o nowe produkty.
    - q: Jak rozpatrywane są roszczenia gwarancyjne?
      a: 'Dystrybutorzy są pierwszym punktem kontaktowym w przypadku roszczeń gwarancyjnych. Zapewniamy jasne kryteria gwarancji, protokoły dokumentacji fotograficznej oraz szybką wymianę lub realizację kredytu. Warunki gwarancji: 5-letnia ograniczona na materiał/szwy/kadłub łodzi; 2 lata na SUP i akcesoria.'
    - q: Czy mogę oznaczyć produkty Aquafarer pod moją własną marką?
      a: Tak, poprzez nasz program OEM/ODM. Opcje marek własnych obejmują niestandardową grafikę na tubach, branding konsoli, opakowania detaliczne i dokumentację zgodności pod Twoją marką. Aby uzyskać szczegółowe informacje, zobacz naszą stronę usług OEM/ODM.
    - q: Jaka dokumentacja dotycząca zgodności jest dołączona dla dystrybutorów?
      a: Każda przesyłka zawiera dokument CE specyficzny dla modelu, dane na tabliczce znamionowej producenta, instrukcje obsługi i dokumentację wysyłkową. Zapewniamy również wsparcie w zakresie rejestracji regulacyjnej na Twoim terytorium i pomagamy w spełnieniu wszelkich lokalnych wymogów dotyczących zgodności.
