content_segments:
  tagline: Profile partnerów
  title: Modele partnerstwa dystrybucyjnego<br />Według typu partnera
  subtitle: Różni dystrybutorzy zapewniają różne mocne strony wejścia na rynek – infrastruktura regionalna, zasięg handlu elektronicznego, specjalistyczny handel detaliczny lub portfolio wielu marek. Tworzymy warunki partnerstwa, poziomy cenowe i poziomy wsparcia, aby dopasować je do profilu każdego partnera.
  items:
    - title: Regionalni dystrybutorzy morscy
      subtitle: Dystrybucja B2B wyłączna terytorialnie
      description: Uznani dystrybutorzy z infrastrukturą magazynową, sieciami dealerów i możliwościami logistycznymi obsługującymi dealerów morskich, sprzedawców detalicznych zajmujących się sportami wodnymi i operatorów wypożyczalni na określonym terytorium geograficznym. Potrzebujesz kompletnej linii produktów, chronionych cen i możliwości obsługi kont dealerów w oparciu o lokalne zapasy i wsparcie.
      features:
        - Ekskluzywna ochrona terytorium przy minimalnych zobowiązaniach
        - Ceny hurtowe na cały katalog z kwartalnymi rabatami za wolumen
        - Program konsygnacji lokalnych zapasów dla szybko rotujących SKU
        - Szkolenia sieci dealerskiej i programy marketingu co-branding
    - title: Handel elektroniczny i sprzedawcy internetowi
      subtitle: Cyfrowe kanały dystrybucji
      description: Sprzedawcy internetowi sprzedający sprzęt do sportów wodnych za pośrednictwem Amazon, eBay lub własnych platform handlu elektronicznego. Szybkość wprowadzenia produktu na rynek, konkurencyjne ceny i logistyka skierowana bezpośrednio do konsumenta mają kluczowe znaczenie. Potrzebujesz partnera, który może realizować indywidualne zamówienia pod Twoją marką, zapewniając szybką realizację i zerowe ryzyko związane z zapasami.
      features:
        - 'Program dropshippingu: realizacja bezpośrednio z fabryki pod Twoją marką'
        - Feed API stanów magazynowych w czasie rzeczywistym dla Twojej platformy e-commerce
        - Integracja z Amazon Seller Central z obsługą EAN/UPC
        - Logistyka zwrotów i obsługa roszczeń gwarancyjnych wliczone
    - title: Sprzedawcy specjalistycznych sportów wodnych
      subtitle: Partnerzy salonów stacjonarnych
      description: Fizyczne sklepy detaliczne specjalizujące się w sprzęcie do sportów wodnych — obsługujące lokalnych wioślarzy, wędkarzy i żeglarzy, oferując sprzedaż osobistą, pokazy i obsługę posprzedażną. Potrzebujesz opakowań zoptymalizowanych pod kątem sprzedaży detalicznej, programów jednostek demonstracyjnych i materiałów w punktach sprzedaży, które przekonają klientów.
      features:
        - 'Program demo: deski ekspozycyjne do showroomu w promocyjnej cenie'
        - Opakowania gotowe do sprzedaży detalicznej z designem pudeł zoptymalizowanym pod półkę
        - Ekspozytory POS, tabele porównawcze i przewodniki dla kupujących
        - Szkolenia i program certyfikacji personelu w sklepach
    - title: Dystrybutorzy wielu marek i domów towarowych
      subtitle: Szeroka dystrybucja artykułów sportowych
      description: Wielcy dystrybutorzy obsługujący domy towarowe, sklepy wielkopowierzchniowe i sieci artykułów sportowych posiadające katalogi wielu marek. Spójność, zgodność z dokumentacją i zgodność z dostawcą są najważniejsze — każdy SKU musi spełniać specyficzne dla sprzedawcy detalicznego standardy dotyczące opakowania, etykietowania i jakości.
      features:
        - 'Dokumentacja compliance dla sieci handlowych: specyfikacja opakowań, kody kreskowe, etykietowanie'
        - Integracja EDI/ASN z systemami zamówień głównych sieci handlowych
        - Zapasy zarządzane przez dostawcę i programy automatycznego uzupełniania
        - Dedykowany opiekun konta z SLA odpowiedzi w 24 godziny
