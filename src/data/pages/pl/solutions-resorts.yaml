hero:
  tagline: Hotele, kurorty i hotelarstwo
  title: Premiumowe doświadczenia nad wodą<br />Dla hoteli, ośrodków wypoczynkowych i klubów jachtowych
  subtitle: Gotowe programy sportów wodnych dla hoteli nadmorskich, prywatnych wysp, klubów plażowych i klubów jachtowych — od sprzętu dla gości i systemów bezpieczeństwa po szkolenia personelu i projektowanie programów.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Paddle Board Overstock SUP deski do aktywności nad wodą w ośrodkach wypoczynkowych
direct_answer: Paddle Board Overstock współpracuje z hotelami, ośrodkami wypoczynkowymi, prywatnymi wyspami, klubami plażowymi i klubami jachtowymi na całym świecie, aby tworzyć premiumowe doświadczenia nad wodą. Nasze rozwiązania obejmują floty do wynajmu SUP, sprzęt do wycieczek z przewodnikiem, kompletne systemy bezpieczeństwa oraz markowe wyposażenie dla każdej nieruchomości. Każdy element sprzętu może być oznaczony logo Twojej nieruchomości i schematem kolorów. Oferujemy również szkolenia dla personelu, konsultacje w zakresie projektowania programów oraz planowanie wymiany floty, aby zapewnić spójną jakość przez cały sezon.
solution_offerings:
  - title: Pakiet standardowy ośrodka
    subtitle: Dla małych i średnich obiektów (50–150 pokoi)
    badge: Popular
    features:
      - title: Flota gościnna
        description: 20–50 SUPs w kolorach i z logo ośrodka
      - title: Infrastruktura bezpieczeństwa
        description: Stanowiska ratowników, liny bojowe, oznakowanie bezpieczeństwa i punkty pierwszej pomocy
      - title: Przechowywanie i konserwacja
        description: Systemy stojaków, stacje napełniania i listy kontrolne codziennych inspekcji
      - title: Szkolenie personelu
        description: Informacje na miejscu dla personelu zajmującego się obsługą sprzętu i bezpieczeństwem gości
      - title: Uruchom wsparcie
        description: Podręcznik programu zawierający szablony cen, formularze rezygnacji i harmonogramy działań
    cta_text: Zaprojektuj moje rozwiązanie dla ośrodka
    cta_href: /contact
  - title: Pakiet Resort Premium
    subtitle: Dla luksusowych nieruchomości i operacji na dużą skalę
    badge: Premium
    features:
      - title: Flota premium
        description: 50–100+ SUPs z pełną indywidualizacją
      - title: Zaawansowane bezpieczeństwo
        description: Wieże ratowników, system radiowy, tablica ratunkowa, AED i plan działania w sytuacjach awaryjnych
      - title: Doświadczenie gościa
        description: Kiosk do odprawy, ekspozycja sprzętu, przebieralnie, przechowalnia przy plaży
      - title: Program dochodowy
        description: Przewodnik po dynamicznych cenach, szkolenia z zakresu sprzedaży dodatkowej, strategie łączenia pakietów
      - title: Wsparcie sezonowe
        description: Przechowywanie poza sezonem, kontrola na koniec sezonu, zamawianie odświeżenia
    cta_text: Ulepsz doświadczenia w ośrodku
    cta_href: /contact
