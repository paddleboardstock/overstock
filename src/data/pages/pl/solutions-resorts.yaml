testimonial:
  content: Aquafarer zaprojektował i wyposażył cały nasz program zajęć na plaży w trzech obiektach wypoczynkowych. 80 desek SUP, 40 kajaków, infrastruktura bezpieczeństwa i szkolenie personelu – wszystko dostarczone w jednej przesyłce. Udział naszych gości w zajęciach wodnych wzrósł w pierwszym sezonie o 60%.
  name: Zofia Laurent
  title: Dyrektor ds. obsługi gości, Azure Bay Resorts — Phuket, Tajlandia
content_segments:
  tagline: Profile kurortów
  title: Rozwiązania hotelowe na nabrzeżu<br />Według typu obiektu
  subtitle: Każdy ośrodek wypoczynkowy ma unikalny profil gości, mieszankę zajęć i rytm operacyjny – od butikowych eko-domków po rozległe luksusowe kurorty przy plaży. Projektujemy programy sportów wodnych dopasowane do klasy obiektu i oczekiwań gości.
  items:
    - title: Luksusowe kurorty przy plaży
      subtitle: Transfery VIP, zajęcia wodne, wrażenia gości premium
      description: Wysokiej klasy obiekty przy plaży — Four Seasons, Aman i podobne grupy luksusowe — w których sporty wodne są głównym udogodnieniem dla gości, generującym satysfakcję i przychody dodatkowe. Flota musi wyglądać premium, oferować różnorodność w zależności od grup wiekowych i poziomów umiejętności oraz bezproblemowo integrować się z istniejącymi w ośrodku systemami concierge i rezerwacji. Oczekiwania gości dotyczące wyglądu są niezwykle wysokie — stan i prezentacja sprzętu bezpośrednio wpływają na pięciogwiazdkowe recenzje.
      features:
        - 'Flota premium z marką: deski SUP, kajaki, rowery wodne i małe tendery RIB'
        - 'Prezentacja gotowa dla gości: kolory dopasowane do ośrodka, branding z logo, zaaranżowana ekspozycja sprzętu'
        - Mały luksusowy RIB do transferów gości VIP z niestandardową tapicerką i dopasowaniem kolorów
        - 'Zintegrowana infrastruktura bezpieczeństwa: liny bojowe, stanowiska ratowników, AED'
        - 'Zarządzanie przychodami: szablony dynamicznych cen, szkolenia z zakresu sprzedaży dodatkowej, łączenie pakietów'
    - title: Prywatne kurorty na wyspie
      subtitle: Transport gości w każdych warunkach pogodowych — zero przestojów, absolutna niezawodność
      description: Prywatne kurorty na wyspach działają w odległych lokalizacjach, gdzie łódź stanowi jedyne połączenie z lądem. Codzienny transfer gości, dostawy zaopatrzenia i ewakuacja medyczna w nagłych wypadkach zależą od jednego statku – wszelkie przestoje mają bezpośredni wpływ na doświadczenia gości i funkcjonowanie ośrodka. Operatorzy ci potrzebują łodzi, która będzie działać niezawodnie w każdych warunkach pogodowych, wymaga minimalnej konserwacji i jest wyposażona w systemy rezerwowe zapewniające niezawodność w sytuacjach krytycznych. Łódź musi się także pięknie prezentować, gdy na wyspę przypłyną goście.
      features:
        - Konfiguracja RIB na każdą pogodę z pełną osłoną przed warunkami atmosferycznymi i wzmocnionymi pontonami
        - Zabezpieczenie w postaci silnika bliźniaczego lub zapasowego dla operacji bez przestojów
        - Konstrukcja Hypalon klasy komercyjnej na 5-8 lat eksploatacji w odległych lokalizacjach
        - Konstrukcja łatwa w konserwacji z dostępnymi komponentami do serwisu na miejscu
        - Niestandardowy branding ośrodka i premium tapicerka dopasowana do estetyki wyspy
    - title: Kurorty nad jeziorem i ekologiczne
      subtitle: Doświadczenia gości zintegrowane z naturą
      description: Obiekty nad jeziorem, eko-domki i miejsca wypoczynku na łonie natury oferujące ciche zajęcia wodne o niskim wpływie na środowisko, które uzupełniają środowisko naturalne. Jeśli to możliwe, sprzęt powinien być niezmotoryzowany, łatwy do przechowywania w hangarach dla łodzi o ograniczonej przestrzeni i cichy w użyciu, aby zapewnić wszystkim gościom wrażenia otoczenia.
      features:
        - 'Flota niemotoryzowana: deski SUP, kajaki, kanadyjki i rowery wodne'
        - Ciche stacje napełniania z pompą elektryczną do korzystania przez gości na żądanie
        - Ekologiczne materiały i opakowania zgodne z marką zrównoważonego rozwoju
        - W zestawie stojaki magazynowe i systemy organizacji hangarów dla łodzi
    - title: Kluby plażowe
      subtitle: Transfery gości, rozrywka, małe luksusowe RIB-y
      description: Kluby plażowe działają w środowisku pełnym energii i skupionym na grafice, w którym sprzęt stanowi część atmosfery. Potrzebują małych, luksusowych RIB-ów do transferu gości z pobliskich hoteli lub doków oraz zabawek wodnych do rozrywki dla gości — holowania skuterów wodnych, dmuchanych zjeżdżalni i desek wiosłowych. Flota musi wyglądać stylowo, być łatwa w obsłudze i wytrzymywać codzienne użytkowanie przez gości o różnym poziomie umiejętności. Pamięć masowa i szybkie wdrażanie mają kluczowe znaczenie w godzinach szczytu.
      features:
        - Kompaktowy luksusowy RIB (3,3-4,3 m) do transferów gości i usług tender
        - 'Zabawki wodne: nadmuchiwane pontony holowane, deski SUP, kajaki do rozrywki gości'
        - Niestandardowy kolor i branding zgodny z identyfikacją wizualną klubu plażowego
        - Systemy szybkiego wodowania i wydobywania dla operacji o dużej rotacji
        - Trwała konstrukcja Hypalon do codziennej ekspozycji na słoną wodę i UV
    - title: Prywatne kluby członkowskie i kluby jachtowe
      subtitle: Transport portowy, przetargi członkowskie, ekskluzywne sporty wodne
      description: Prywatne kluby, w których sporty wodne i transport łodzią są raczej korzyścią dla członków niż źródłem przychodów. Sprzęt musi spełniać wyższe standardy estetyczne, być dostępny na żądanie dla członków i wymagać minimalnego nadzoru personelu. Kluby jachtowe marinowe szczególnie potrzebują ofert na transport portowy — przenoszenie członków między dokiem, miejscem cumowania i brzegiem. Przechowywanie i konserwacja powinny być niewidoczne dla członków.
      features:
        - Tendery RIB wysokiej klasy do transportu portowego i usługi transferu członków
        - 'Sprzęt premium: pokłady EVA, niestandardowe kolory członków, tapicerka markowa'
        - System samoobsługowego wypożyczania dla dostępu członków bez personelu
        - Przechowywanie poza sezonem i coroczny program odświeżania
    - title: Hotele nastawione na przygodę i aktywność
      subtitle: Wycieczki z przewodnikiem, joga SUP, wycieczki snorkelingowe, zajęcia grupowe
      description: Obiekty pozycjonujące się jako miejsca przygód — oferujące wycieczki z przewodnikiem, jogę SUP, wiosła o zachodzie słońca, wycieczki z rurką i zajęcia grupowe. Flota musi obsługiwać zarówno modele bezpłatnego wynajmu, jak i programy z przewodnikiem, a sprzęt umożliwia płynne przejście między samodzielnym użytkowaniem przez gości a wycieczkami prowadzonymi przez instruktora. Obiekty te wymagają trwałego sprzętu do obsługi wysokiej częstotliwości i łatwego czyszczenia pomiędzy grupami gości.
      features:
        - Wszechstronna mieszana flota obsługująca modele wypożyczeń + wycieczek z przewodnikiem
        - Kajaki dwuosobowe i wyjątkowo stabilne platformy SUP do zajęć grupowych
        - 'Sprzęt dla przewodników: deski instruktorskie, wodoodporne skrzynki, wodoszczelna łączność'
        - 'Sezonowa rotacja sprzętu: letnia flota → program zimowego przechowywania'
        - Trwała konstrukcja przeznaczona do codziennego użytku przez gości przy minimalnej konserwacji
