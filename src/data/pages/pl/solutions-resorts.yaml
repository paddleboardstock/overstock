testimonial:
  content: Paddle Board Overstock zaprojektował i wyposażył cały nasz program aktywności plażowych w trzech ośrodkach. 120 SUPs, infrastruktura bezpieczeństwa i szkolenie personelu — wszystko dostarczone w jednej przesyłce. Udział gości w aktywnościach wodnych wzrósł o 60% w pierwszym sezonie.
  name: Zofia Laurent
  title: Dyrektor ds. obsługi gości, Azure Bay Resorts — Phuket, Tajlandia
content_segments:
  tagline: Profile kurortów
  title: Rozwiązania gościnności nad wodą<br />Według typu obiektu
  subtitle: Każdy ośrodek wypoczynkowy ma unikalny profil gości, mieszankę zajęć i rytm operacyjny – od butikowych eko-domków po rozległe luksusowe kurorty przy plaży. Projektujemy programy sportów wodnych dopasowane do klasy obiektu i oczekiwań gości.
  items:
    - title: Luksusowe kurorty przy plaży
      subtitle: Transfery VIP, zajęcia wodne, wrażenia gości premium
      description: Wysokiej klasy obiekty przy plaży — Four Seasons, Aman i podobne grupy luksusowe — w których sporty wodne są głównym udogodnieniem dla gości, generującym satysfakcję i przychody dodatkowe. Flota musi wyglądać premium, oferować różnorodność w zależności od grup wiekowych i poziomów umiejętności oraz bezproblemowo integrować się z istniejącymi w ośrodku systemami concierge i rezerwacji. Oczekiwania gości dotyczące wyglądu są niezwykle wysokie — stan i prezentacja sprzętu bezpośrednio wpływają na pięciogwiazdkowe recenzje.
      features:
        - Premium marka floty SUPs w dopasowanych kolorach ośrodka
        - 'Prezentacja gotowa dla gości: dopasowane kolory ośrodka, branding logo, ustawiona ekspozycja sprzętu'
        - Deski artystyczne w serii podpisowej dla premium doświadczeń gości i momentów do zdjęć
        - 'Zintegrowana infrastruktura bezpieczeństwa: boje, stanowiska ratowników, AED'
        - 'Zarządzanie przychodami: dynamiczne szablony cen, szkolenia w zakresie sprzedaży dodatkowej, pakiety usług'
    - title: Prywatne kurorty na wyspie
      subtitle: Ciche, samowystarczalne aktywności wodne dla gości
      description: 'Prywatne wyspiarskie kurorty działają w odległych lokalizacjach, gdzie logistyka jest złożona i każda dostawa ma znaczenie. Atrakcje wodne dla gości muszą być samowystarczalne: sprzęt, który magazynuje kompaktowo, nadmuchuje się na żądanie, wymaga minimalnej konserwacji i prezentuje się pięknie podczas przybycia gości. Planujemy programy flotowe wokół okien na wodnosamoloty i transport morski, a nasza trwała konstrukcja zapewnia sprzęt gotowy dla gości przez długie sezony bez wsparcia z lądu.'
      features:
        - Kompaktowa flota nadmuchiwana — statki i zaopatrzenie efektywnie na odległych wyspach
        - Konstrukcje o charakterze komercyjnym PVC przeznaczone do wielorocznych użytku gości
        - Łatwa konserwacja na miejscu dzięki dołączonym zestawom naprawczym i wideoprzewodnikom
        - Personalizowane brandingi resortu pasujące do estetyki wyspy
    - title: Kurorty nad jeziorem i ekologiczne
      subtitle: Doświadczenia gości zintegrowane z naturą
      description: Nieruchomości nad jeziorem, eko-lodge i ośrodki przyrodnicze oferują ciche, niskowpływowe aktywności wodne, które uzupełniają naturalne środowisko. Sprzęt powinien być niezmotoryzowany, gdzie to możliwe, łatwy do przechowywania tam, gdzie jest ograniczona przestrzeń, i cichy w użytkowaniu, aby zachować atmosferę dla wszystkich gości.
      features:
        - Flota bez silników SUP w serii sztuki inspirowanej naturą
        - Ciche elektryczne stacje pomp pomp do użytku na żądanie przez gości
        - Ekologiczne materiały i opakowania zgodne z brandingiem zrównoważonego rozwoju
        - Wśród nich znajdowały się regały magazynowe i systemy organizacji przy nabrzeżu
    - title: Kluby plażowe
      subtitle: Rozrywka gości i atmosfera nad wodą
      description: Kluby plażowe działają w dynamicznym, wizualnie skupionym środowisku, gdzie sprzęt jest częścią atmosfery. Potrzebują stylowych desków do rozrywki gości, SUP wypożyczalni do aktywności na plaży oraz sprzętu wyglądającego równie dobrze jak sam obiekt. Flota musi być łatwa w obsłudze, wytrzymać codzienne użytkowanie przez gości o różnym poziomie umiejętności i szybko rozmieszczać się w godzinach szczytu.
      features:
        - Charakterystyczne serie sztuki SUPs , które jednocześnie pełnią funkcję dekoracji miejsca
        - Flota gotowa do wynajęcia SUP do rozrywki gości
        - Indywidualny kolor i branding dopasowany do wizualnej tożsamości klubu plażowego
        - Systemy szybkiego startu i odzysku do operacji o dużym obrotie
        - UV- odporna konstrukcja na codzienne narażenie na słoną wodę
    - title: Prywatne kluby członkowskie i kluby jachtowe
      subtitle: Członkowie sportów wodnych i ekskluzywnych programów kajakarskich
      description: Kluby prywatne, gdzie sporty wodne są korzyścią dla członków, a nie źródłem dochodów. Sprzęt musi spełniać wyższe standardy estetyczne, być dostępny na żądanie dla członków i wymagać minimalnego nadzoru personelu. Kluby jachtów marina używają SUP markowych flot do rekreacji członków wokół portu. Przechowywanie i konserwacja powinny być niewidoczne dla członków.
      features:
        - SUP Floty premium marki dla sportów wodnych członków
        - 'Wyposażenie premium: EVA pokłady, niestandardowe kolory członków, markowa tapicerka'
        - System samoobsługowego kasu dla członków bez udziału personelu
        - Magazynowanie poza sezonem i coroczny program odświeżania
    - title: Hotele nastawione na przygodę i aktywność
      subtitle: Wycieczki z przewodnikiem, joga SUP, wycieczki snorkelingowe, zajęcia grupowe
      description: Obiekty pozycjonujące się jako miejsca przygód — oferujące wycieczki z przewodnikiem, jogę SUP, wiosła o zachodzie słońca, wycieczki z rurką i zajęcia grupowe. Flota musi obsługiwać zarówno modele bezpłatnego wynajmu, jak i programy z przewodnikiem, a sprzęt umożliwia płynne przejście między samodzielnym użytkowaniem przez gości a wycieczkami prowadzonymi przez instruktora. Obiekty te wymagają trwałego sprzętu do obsługi wysokiej częstotliwości i łatwego czyszczenia pomiędzy grupami gości.
      features:
        - Wszechstronna mieszana flota wspierająca modele wycieczek z przewodnikiem +
        - Ekstra-stabilne platformy SUP do zajęć grupowych
        - 'Sprzęt przewodników: tablice instruktorów, wodoodporne pudełka, wodoodporne systemy komunikacji'
        - 'Sezonowa rotacja sprzętu: letnia flota → program przechowywania zimowego'
        - Trwała konstrukcja przeznaczona do codziennego użytkowania przez gości przy minimalnej konserwacji
