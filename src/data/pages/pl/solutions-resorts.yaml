hero:
  tagline: Hotele, kurorty i hotelarstwo
  title: Premium atrakcje na nabrzeżu<br />dla hoteli, kurortów i klubów jachtowych
  subtitle: Programy sportów wodnych pod klucz dla hoteli przy plaży, prywatnych kurortów na wyspie, klubów plażowych i klubów jachtowych — od sprzętu dla gości i ofert RIB po systemy bezpieczeństwa i szkolenia personelu.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Pontony Aquafarer do zajęć na nabrzeżu kurortu
direct_answer: Aquafarer współpracuje z hotelami, kurortami, prywatnymi wyspami, klubami plażowymi i klubami jachtowymi na całym świecie, aby zapewnić najwyższej jakości atrakcje na nabrzeżu. Nasze rozwiązania obejmują flotę wypożyczalni SUP, kajaki wycieczkowe z przewodnikiem, przetargowe RIB-y do transportu gości, małe luksusowe RIB-y do transferów do klubów plażowych oraz kompletne systemy bezpieczeństwa. Każdy element wyposażenia może zostać oznaczony logo Twojej nieruchomości i kolorystyką. Zapewniamy również szkolenia personelu, konsultacje dotyczące projektowania programów i planowanie wymiany floty, aby zapewnić stałą jakość przez cały sezon.
solution_offerings:
  - title: Pakiet standardowy ośrodka
    subtitle: Dla małych i średnich obiektów (50–150 pokoi)
    badge: Popular
    features:
      - title: Flota gościnna
        description: 20–50 desek SUP i kajaków w kolorach i logo kurortu
      - title: Infrastruktura bezpieczeństwa
        description: Stanowiska ratowników, liny bojowe, oznakowanie bezpieczeństwa i punkty pierwszej pomocy
      - title: Przechowywanie i konserwacja
        description: Systemy stojaków, stacje napełniania i listy kontrolne codziennych inspekcji
      - title: Szkolenie personelu
        description: Informacje na miejscu dla personelu zajmującego się obsługą sprzętu i bezpieczeństwem gości
      - title: Uruchom wsparcie
        description: Podręcznik programu zawierający szablony cen, formularze rezygnacji i harmonogramy działań
    cta_text: Zaprojektuj rozwiązanie dla swojego ośrodka
    cta_href: /contact
  - title: Pakiet Resort Premium
    subtitle: Dla luksusowych nieruchomości i operacji na dużą skalę
    badge: Premium
    features:
      - title: Flota premium
        description: 50–100+ SUPów, kajaków, rowerów wodnych i łodzi typu RIB z pełną personalizacją
      - title: Zaawansowane bezpieczeństwo
        description: Wieże ratowników, system radiowy, tablica ratunkowa, AED i plan działania w sytuacjach awaryjnych
      - title: Doświadczenie gościa
        description: Kiosk do odprawy, ekspozycja sprzętu, przebieralnie, przechowalnia przy plaży
      - title: Program dochodowy
        description: Przewodnik po dynamicznych cenach, szkolenia z zakresu sprzedaży dodatkowej, strategie łączenia pakietów
      - title: Wsparcie sezonowe
        description: Przechowywanie poza sezonem, kontrola na koniec sezonu, zamawianie odświeżenia
    cta_text: Ulepsz doświadczenie w ośrodku
    cta_href: /contact
