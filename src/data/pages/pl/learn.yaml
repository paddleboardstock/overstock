hero:
  tagline: Wiedza o eksploracji wody
  title: Uczyć się
  subtitle: |
    Przewodniki, samouczki i dogłębne analizy — wszystko, czego potrzebujesz, aby eksplorować<br />
    pływaj z pewnością. Od wyboru swojego pierwszego SUP do opanowania zaawansowanych technik.
  taglineSection: Wiedza dla każdego wioślarza. Od początkującego do profesjonalisty.
featured:
  tagline: Polecane tematy
  title: Rozpocznij swoją podróż edukacyjną
  subtitle: Niezależnie od tego, czy jesteś nowicjuszem w sportach wodnych, czy chcesz się rozwijać, nasze przewodniki mają wszystko, czego potrzebujesz.
  items:
    - title: SUP Podstawy
      description: Wszystko, co początkujący powinien wiedzieć — typy desek, dobór wiosła, postawa i wskazówki na pierwszy dzień.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Nadmuchiwana vs twarda deska
      description: Który jest odpowiedni dla Ciebie? Porównujemy przenośność, wydajność, trwałość i koszt jeden obok drugiego.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Bezpieczeństwo nad wodą
      description: Podstawowa wiedza o bezpieczeństwie, którą powinien posiadać każdy wioślarz — pogoda, kamizelki ratunkowe, samoratowanie i inne.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Przewodnik po materiałach
      description: Drop-stitch rdzenie, PVC laminaty, EVA pianka pokładowa — zrozum, z czego zrobiona jest twoja deska.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Przewodnik po rozmiarach
      description: Znajdź odpowiednią długość, szerokość i objętość deski dopasowaną do swojej wagi, umiejętności i stylu wiosłowania.
      icon: tabler:ruler
      href: /size-guide
    - title: Techniki średniozaawansowane
      description: Podnieś poziom swojego wiosłowania dzięki zaawansowanym pociągnięciom, technikom skręcania i radzeniu sobie na wzburzonej wodzie.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
