hero:
  tagline: Wykres wiedzy
  title: Wiedza o eksploracji wody
  subtitle: |
    Strukturalna baza wiedzy obejmująca technologię nadmuchiwanych SUP,<br />
    bezpieczeństwo na wodzie, inżynieria desek i planowanie przygód.
  taglineSection: Odkrywaj. Ucz się. Idź z pewnością.
clusters:
  tagline: Klastry wiedzy
  title: Eksploruj według tematu
  subtitle: Dogłębne analizy technologii, bezpieczeństwa i umiejętności stojących za każdym produktem Paddle Board Overstock.
  items:
    - title: SUP Wiedza
      description: Od wyboru swojej pierwszej deski po zaawansowane techniki turystyki — wszystko o paddle boardingu stojącym.
      icon: tabler:lifebuoy
      topics:
        - Jak wybrać swoją pierwszą dmuchaną SUP
        - Najlepszy rozmiar SUP dla początkujących
        - Jak trudne jest paddleboarding?
        - Porównanie deski dmuchanej i twardej
        - SUP lista kontrolna bezpieczeństwa
    - title: Technologia Płyt
      description: Techniczne dogłębne analizy rdzeni drop-stitch, laminatów PVC, szyn i zaworów — jak projektowane są nadmuchiwane SUPs.
      icon: tabler:anchor
      topics:
        - Jak są wykonane nadmuchiwane SUPs
        - PVC warstwy laminatu wyjaśnione
        - Konstrukcja szyn i szwów
        - Drop-stitch dogłębne zanurzenie w technologię
        - wyjaśnienie grafiki talii EVA
    - title: Wiedza o bezpieczeństwie
      description: Podstawowa wiedza o bezpieczeństwie dla każdego wioślarza — od wyboru PFD po odczytywanie pogody i techniki samoewakuacji.
      icon: tabler:shield
      topics:
        - SUP lista kontrolna bezpieczeństwa
        - Potrzebujesz kamizelki ratunkowej?
        - Przewodnik bezpieczeństwa wiosłowania po oceanie
        - Bezpieczeństwo na rzece i prądach dla wioślarzy
        - Świadomość warunków pogodowych i wodnych
    - title: Technologia
      description: Inżynieria stojąca za produktami Paddle Board Overstock — materiały, metody konstrukcji i testy jakości.
      icon: tabler:microscope
      topics:
        - Technologia klasy morskiej PVC
        - Wyjaśnienie rdzenia Drop-stitch
        - Dlaczego PSI jest ważne dla dmuchanych SUPs
        - Spawanie RF a łączenie klejowe
        - Testy jakości na każdej desce
    - title: Wiedza Klubowa i Wynajmu
      description: Praktyczne przewodniki dotyczące prowadzenia programu SUP — od operacji wynajmu po floty ośrodków i klubów.
      icon: tabler:briefcase
      topics:
        - Jak rozpocząć działalność związaną z wynajmem SUP
        - Budowa uzdrowiskowego centrum sportów wodnych
        - Rozmiar floty desek wiosłowych dla klubów
        - Nadmuchiwane vs twarde SUP do użytku komercyjnego
        - Najlepsze deski SUP do flot wynajmowych
        - Strategie przychodów ze sportów wodnych w kurortach
        - Przewodnik konserwacji sprzętu komercyjnego
