hero:
  tagline: Wyposażenie
  title: Sprzęt i Maszyny Produkcyjne
  subtitle: Sprzęt przemysłowy do cięcia, spawania, drukowania i montażu
  back_label: Powrót do Fabryki
  back_link: /factory
categories:
  - title: Cięcie i Przygotowanie Materiału
    items:
      - name: PVC Automatyczna maszyna tnąca
        spec: Sterowane CNC, 6,5 m × 2,5 m, dokładność 0,1 mm
        desc: Komputerowo sterowana automatyczna maszyna do cięcia tkanin PVC i drop-stitch. Oprogramowanie do rozmieszczenia elementów optymalizuje wykorzystanie materiału do mniej niż 5% odpadów.
      - name: Rozwijarka tkanin
        spec: Maksymalna szerokość 3 m, podawanie sterowane napięciem
        desc: Układa tkaninę w jednej lub wielu warstwach z kontrolowanym napięciem, aby zapobiec zniekształceniom przed cięciem.
  - title: Spawanie i klejenie
    items:
      - name: Maszyna do uszczelniania termicznego
        spec: Spawanie gorącym powietrzem, zmienne 200–600 °C, 0,5–5 m/min
        desc: Maszyna do zgrzewania gorącym powietrzem do łączenia i spawania laminatów PVC, taśm szynowych oraz szwów komór. Używana do klejenia, zgrzewania i łączenia rdzeni drop-stitch.
      - name: Prasa dielektryczna RF
        spec: 15 kW, płyta 2000 × 600 mm
        desc: Prasa do zgrzewania radiowo-falowego do głównych szwów podłużnych, połączeń poprzeczka–rura oraz produkcji dużych komór.
      - name: Spawarka RF sterowana CNC
        spec: 8 kW, stolik XY 2500 × 1200 mm
        desc: Programowalna spawarka do szwów krzywoliniowych dla skomplikowanych kształtów, tłoczenia logo i precyzyjnych łatek.
  - title: Dekorowanie deski i wykończenia
    items:
      - name: EVA Maszyna do cięcia pokładów
        spec: Cięcie nożem CNC, szerokość 2 m
        desc: Precyzyjne cięcie paneli piankowych pokładu EVA dla wzorów serii artystycznej. Każdy panel jest wycinany w kształt zapewniający bezszwowe dopasowanie całego pokładu.
      - name: Prasa do laminowania pokładów
        spec: Sterowanie temperaturą i ciśnieniem
        desc: Łączy panele pokładu EVA z powierzchnią deski zapewniając spójne przyleganie na całym obszarze pokładu.
  - title: SUP Druk i dekoracja
    items:
      - name: Drukarka cyfrowa
        spec: Drukarka atramentowa o wysokiej rozdzielczości, szerokość do 2 m
        desc: Cyfrowy druk bezpośrednio na tkaninę dla SUP pełnokolorowych grafik tarasowych. Drukuje niestandardowe wzory, gradienty i obrazy o jakości fotograficznej za pomocą UV wodoodpornych tuszów na bazie wody.
      - name: Maszyna sitodruku
        spec: Rejestracja manualna i półautomatyczna, wielokolorowa
        desc: Sitodruk do SUP logotypów kartonowych, znaków marek i powtarzających się wzorów. Zapewnia trwałe, nieprzezroczyste wydruki z żywą sytością kolorów.
  - title: Montaż końcowy
    items:
      - name: Stacja momentu obrotowego zaworu
        spec: Kalibrowany, 10-cyklowy test funkcji
        desc: Instaluje i dokręca zawory napompowujące, a następnie testuje każdy zawór przez 10 cykli otwierania/zamykania.
      - name: Pudełko na płetwy i zestaw D-Ring
        spec: Dopasowane do szablonu, utwardzone klejem
        desc: Pozycje i łączą skrzynki z płetwami, pierścienie D oraz uchwyty w dokładnych lokalizacjach pokładów zgodnie ze specyfikacją modelu.
  - title: Testowanie i kontrola jakości
    items:
      - name: Uniwersalny Tester Rozciągania
        spec: Pojemność 50 kN
        desc: Testy siły pękania, wydłużania przy przerwaniu i propagacji rozdarcia dla partii tkanin.
      - name: Testowa Platforma Pomiarowa Utrzymania Powietrza
        spec: Programowalny, 30-minutowy utrzymywający ciśnienie
        desc: Automatyczny test utrzymania ciśnienia dla każdej komory rury przed montażem.
      - name: Tester oklejania szwów
        spec: Zmotoryzowane peelingowanie o 180° przy prędkości 100 mm/min
        desc: Testy wytrzymałości na osuszanie szwów spoiwowych i łączonych według wewnętrznego protokołu.
      - name: Komora wietrzenia ksenonu łukowego
        spec: Ekspozycja 2000 h
        desc: UV Testy odpornościowe na zmianę koloru i utrzymanie siły.
