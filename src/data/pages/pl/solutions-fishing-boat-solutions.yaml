content_challenge:
  tagline: Wyzwanie
  title: Łodzie wędkarskie wymagają<br />stabilności, zasięgu i trwałości
  subtitle: Niezależnie od tego, czy obsługujesz komercyjne statki rybackie, zarządzasz flotą spółdzielczą, czy prowadzisz czartery rybackie – Twoja łódź musi działać niezawodnie każdego dnia.
  paragraphs:
    - Łodzie wędkarskie potrzebują stabilnych platform do pracy z żyłkami, obsługi połowu i bezpiecznego poruszania się po pokładzie. Łodzie pneumatyczne i RIB oferują naturalną stabilność dzięki konstrukcji balonów — znaczącą przewagę nad sztywnymi kadłubami o podobnej długości.
    - Efektywność paliwowa ma znaczenie w przypadku działalności połowowej, w której koszty operacyjne bezpośrednio wpływają na rentowność. RIBy i pontony są lżejsze od równoważnych łodzi sztywnych, wymagają mniej mocy i spalają mniej paliwa – co ma kluczowe znaczenie dla operatorów komercyjnych codziennie eksploatujących łodzie i spółdzielni zarządzających budżetami floty.
    - Trwałość w środowisku morskim jest niezbędna. Słona woda, narażenie na promieniowanie UV i ciągłe użytkowanie wymagają materiałów, które wytrzymają trudne warunki bez degradacji. W przypadku operatorów komercyjnych i spółdzielczych niezawodność ma bezpośredni wpływ na dochody — zepsuta łódź oznacza stracone dni połowowe.
    - Konfiguracje wędkarskie Paddle Board Overstock obejmują uchwyty na wędki, echosondy, studnie na przynęty, studnie dla żywych zwierząt i rozwiązania do obsługi ładunków przeznaczone do poważnych zastosowań połowowych w działalności komercyjnej, kooperacyjnej i rekreacyjnej.
content_solution:
  tagline: Nasze rozwiązanie
  title: Konfiguracje gotowe do wędkowania
  subtitle: Każdą łódź wędkarską Paddle Board Overstock można skonfigurować pod konkretne zastosowanie wędkarskie.
  list:
    - Montaż uchwytu na wędki — zamontowany fabrycznie lub gotowy do późniejszej instalacji
    - Płyta montażowa echosondy/GPS w pozycji konsoli
    - Opcje zbiornika na przynęty lub żyworódki dla operatorów czarterowych i komercyjnych
    - Konfiguracje chłodni/przechowywania do obsługi połowu
    - Kadłub deep-V do żeglugi pełnomorskiej — stabilny na postoju, płynny w ruchu
    - Opcje balonów PVC lub Hypalon — Hypalon przy przedłużonej ekspozycji na UV
    - Zakres silników zaburtowych od 15 KM do 115 KM w zależności od modelu i zastosowania
content_segments:
  tagline: Profile wędkarskie
  title: Rozwiązania w zakresie nadmuchiwanych łodzi rybackich<br />Według rodzaju operatora
  subtitle: Od przybrzeżnego rybołówstwa sportowego po komercyjne takle — różne operacje połowowe wymagają różnych konfiguracji kadłuba, zakresów mocy i ustawień na pokładzie. Każdą łódź dostosowujemy do łowiska, wód i stylu pracy.
  items:
    - title: Komercyjne firmy rybackie
      subtitle: Łodzie robocze floty do codziennych operacji połowowych, obsługi sieci, transportu połowów
      description: Komercyjne przedsiębiorstwa rybackie korzystają z łodzi roboczych do zakładania i wydobywania sieci, obsługi pułapek, takli i transportu połowów. Łodzie te pracują codziennie w środowisku słonowodnym i muszą wytrzymywać duże obciążenia, ciągłą obsługę pokładu i długie godziny pracy. Oszczędność paliwa i niskie koszty utrzymania mają kluczowe znaczenie dla rentowności floty. Statek musi zapewniać stabilne platformy robocze dla załogi obsługującej sprzęt i połowy w zmiennych warunkach morskich.
      features:
        - Płaski układ pokładu do obsługi sieci, układania pułapek i przechowywania ryb
        - Oszczędny silnik zaburtowy 40-115 HP zapewniający niskie dzienne koszty eksploatacji
        - Wytrzymałe rurki Hypalon zapewniające odporność na ścieranie w codziennym użytkowaniu
        - Wzmocnione listwy trące dla częstego kontaktu doku i statku
        - Samonośny pokład umożliwiający łatwe mycie po operacjach
        - Ceny flotowe i spójne specyfikacje dla operatorów obsługujących wiele statków
    - title: Czarterowi operatorzy rybaccy
      subtitle: Komfort dla wielu pasażerów, obsługa połowów, certyfikat bezpieczeństwa
      description: Operatorzy obsługujący czartery połowowe na pół dnia i na cały dzień — od przybrzeżnego połowu rafowego po połowy denne na morzu. Twoja łódź potrzebuje siedzeń dla pasażerów posiadających certyfikaty bezpieczeństwa, wystarczającej przestrzeni na pokładzie dla wielu wędkarzy oraz zintegrowanych zbiorników na żywe zwierzęta, w których przynęta i złowione ryby będą świeże przez cały rejs. Komfort gości ma bezpośredni wpływ na recenzje podróży, ponowne rezerwacje i oceny online.
      features:
        - Konsola sterownicza z amortyzowanymi fotelami kubełkowymi
        - Fabrycznie instalowane uchwyty na wędki (4–8 pozycji)
        - Zasięg silnika zaburtowego 60–115 HP dla prędkości przelotowych na morzu
        - CE Certyfikat kategorii C lub B w zakresie komercyjnych przewozów pasażerskich
        - Bimini lub osłona przeciwsłoneczna T-top zapewniająca wygodę gości podczas dłuższych wycieczek
    - title: Rybacy rzemieślniczy i komercyjni na małą skalę
      subtitle: Niezawodne łodzie robocze do codziennego użytku
      description: Niezależni rybacy, których głównym źródłem dochodu jest łódź – zakładanie sieci, zajmowanie się pułapkami na ryby lub obsługa połowów w pobliżu brzegu. Twoim priorytetem jest oszczędność paliwa, prosta konserwacja, którą możesz wykonać samodzielnie, oraz łódź, która poradzi sobie z umiarkowanymi ładunkami połowu i sprzętu bez utraty stabilności.
      features:
        - Oszczędny silnik zaburtowy 15–40 HP zapewniający niskie koszty eksploatacji
        - Rury Hypalon CSM zapewniające zwiększoną odporność na promieniowanie UV i ścieranie
        - Płaski układ pokładu do obsługi sieci i przechowywania ryb
        - Łatwe lądowanie na plaży dzięki nadmuchiwanej osłonie stępki
    - title: Spółdzielnie rybackie
      subtitle: Zbiór połowów, transport członków, dystrybucja zaopatrzenia
      description: Spółdzielnie rybackie obsługują floty społecznościowe, których zadaniem jest zbieranie połowów od członków rybaków, transport zaopatrzenia do odległych społeczności rybackich i dystrybucja zbiorów na rynki. Te łodzie robocze wymagają dużej ładowności, niezawodnej codziennej pracy i łatwej konserwacji w odległych lokalizacjach. Spółdzielnie często działają w regionach rozwijających się, gdzie dostępność części i serwis są ograniczone, co sprawia, że ​​proste konfiguracje silników zaburtowych i trwała konstrukcja są niezbędne.
      features:
        - Wysoka ładowność do transportu połowów i zaopatrzenia
        - Prosta konfiguracja silnika zaburtowego ułatwiająca serwisowanie na miejscu
        - Wytrzymała konstrukcja PVC lub Hypalon zapewniająca elastyczność budżetową
        - Płaski pokład z punktami mocowania do zabezpieczenia ładunku
        - Oszczędne działanie, minimalizujące koszty operacyjne w ramach współpracy
    - title: Miłośnicy sportów i wędkarstwa
      subtitle: Wydajność i styl dla poważnych wędkarzy
      description: Doświadczeni wędkarze poszukujący wydajnej platformy wędkarskiej, która zapewni prędkość na odległych łowiskach, stabilne pozycje do walki w stójce oraz doskonałe dopasowanie i wykończenie. Łódź musi czuć się jak w domu, niezależnie od tego, czy płynie dwie mile od brzegu w stronę rafy, czy też eksploruje odległe rozlewiska ujścia rzek.
      features:
        - Kadłub o głębokim V RIB zapewnia płynną jazdę w chopie
        - Płyta montażowa echosondy/GPS okablowana fabrycznie na konsoli
        - Baitwell i chłodnica zintegrowane z modułem tylnego siedzenia
        - Niestandardowe opcje kolorów pokładu EVA pasujące do grafiki łodzi/rury
    - title: Przewodniki wędkarskie i organizatorzy wycieczek ekologicznych
      subtitle: Wycieczki wędkarskie z przewodnikiem dla odwiedzających wędkarzy
      description: Przewodnicy, którzy zabierają małe grupy odwiedzających wędkarzy do produktywnych miejsc połowowych – często łącząc wędkarstwo z elementami ekoturystyki, takimi jak obserwowanie ptaków lub eksploracja lasów namorzynowych. Łódź musi pływać sucho i wygodnie dla gości nieprzyzwyczajonych do małych łodzi, z łatwym wejściem na pokład i możliwością zacienienia.
      features:
        - Fabrycznie zamontowany blat bimini lub punkty mocowania T-top
        - Gładka drabinka wejściowa ułatwiająca ponowne wejście na pokład
        - Cichy, 4-suwowy silnik zaburtowy minimalizujący zakłócenia
        - Suche schowki na telefony gości, portfele, aparaty fotograficzne
