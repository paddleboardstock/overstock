hero:
  tagline: Laboratorium Kontroli Jakości
  title: Laboratorium Testowe i Zapewnienie Jakości
  subtitle: Niezależne laboratorium jakości — każda jednostka testowana przed wysyłką
intro: Paddle Board Overstock Prowadzi dedykowane laboratorium kontroli jakości, które działa niezależnie od produkcji. Każda partia surowca i każda gotowa płyta przechodzi udokumentowane protokoły inspekcyjne przed wprowadzeniem na sprzedaż. Nasz zespół kontroli jakości raportuje bezpośrednio do zarządu, zapewniając bezstronne decyzje jakościowe.
highlights:
  - value: 100%
    label: Urządzenia przetestowane ciśnieniowo
    detail: Każda komnata, każda rada
  - value: 48 h
    label: Czas trwania testu zatrzymania powietrza
    detail: Przy ciśnieniu znamionowym 1,25×
  - value: '&lt;5%'
    label: Maksymalny dozwolony spadek ciśnienia
    detail: Ponad 24-godzinny okres oczekiwania
  - value: 99.3%
    label: Bezwadowa szybkość
    detail: Wysyłki z 12 miesięcy
test_procedures:
  - title: Inspekcja surowców
    description: Każda napływająca partia PVC drop-stitch , tkanin, EVA pianki i okuć jest testowana przed przyjęciem. Weryfikowane są wytrzymałość na rozciąganie, odporność na rozdarcia i UV odporność. Materiały niezgodne z normami są kwarantannowe i zwracane.
    standards:
      - Wytrzymałość na rozciąganie (350 N/cm min)
      - Odporność na rozdarcia
      - UV Opór (1 000 h)
  - title: Punkty kontrolne kontroli jakości w trakcie procesu
    description: Operatorzy produkcji przeprowadzają samokontrolę na każdym etapie. Audytorzy kontroli jakości przeprowadzają losowe pobieranie próbek przez całą zmianę. Testy oszulowania spaw wykonuje się co 50 jednostek. Kontrole wymiarowe odbywają się co 20. panel.
    standards:
      - Test peel co 50 jednostek
      - Wewnętrzna lista kontrolna 100 punktów
      - Audyty losowego próbkowania
  - title: 48-godzinny test utrzymania powietrza
    description: Każda komora rury jest napompowana do 125% ciśnienia znamionowego i utrzymywane przez 48 godzin. Czujniki ciśnienia rejestrują się nieprzerwanie z kompensacją temperatury. Każda komora przekraczająca spadek ciśnienia o 5% uruchamia automatyczną ponowną inspekcję partii.
    standards:
      - 1,25x nominalne utrzymanie ciśnienia
      - <5% maksymalnego spadku ciśnienia
  - title: Testy obciążenia i wyważenia
    description: Gotowe deski są testowane pod kątem maksymalnej dopuszczalnej pojemności stabilności, wolnej burty i właściwości pilotażowej. Każda deska przechodzi testy wodne przed ostateczną akceptacją inspekcji.
    standards:
      - Weryfikacja obciążenia 1,25x
      - Badanie wody
equipment:
  - name: Uniwersalna maszyna wytrzymałościowa (rozciąganie)
    spec: Pojemność 5 kN
  - name: Tester zaniku ciśnienia
    spec: Wielokanałowy, 0–50 psi, rejestrowanie danych
  - name: UV Komora starzeniowa
    spec: UVA-340, cykle 1000 h
  - name: Miernik grubości (cyfrowy)
    spec: Rozdzielczość 0,01 mm
  - name: Tester odrywania (spawanie)
    spec: Zmoto­ryzowany, pojemność 50 N
  - name: Komora temperaturowa
    spec: -40 °C do +100 °C
  - name: Zbiornik detekcji wycieków
    spec: 6 m × 2 m, oświetlony
