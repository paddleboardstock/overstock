hero:
  tagline: Styl życia
  title: The Paddle Board Overstock<br />Styl życia
  subtitle: Stworzone dla tych, którzy żyją na wodzie — od weekendowych odkrywców po codziennych wioślarzy, którzy odliczają dni do kolejnej sesji.
values:
  - icon: 🌊
    title: Narodzone na Wodzie
    desc: Każdy projekt zaczyna się od zrozumienia, jak zachowuje się woda. Projektujemy od krawędzi warunków do wnętrza — ponieważ ocean jest naszym nauczycielem, a nie miejscem pracy.
  - icon: 🔧
    title: Stworzone, by Przetrwać
    desc: Najbardziej zrównoważonym produktem jest ten, którego nie trzeba wymieniać. Materiały klasy morskiej, drop-stitch rdzenie oceniane do 15 PSI i szwy, które przetrwają sezon.
  - icon: 🏆
    title: Dostępne przez Projekt
    desc: Sporty wodne nie powinny być luksusem. Wydajność klasy profesjonalnej w cenie, która ma sens dla rodzin, przewodników i codziennych wioślarzy — nie tylko dla profesjonalistów.
  - icon: 🌍
    title: Globalna społeczność
    desc: 'Od wybrzeża Weihai po jeziora w Europie, rzeki w Azji Południowo-Wschodniej i zatoki w Amerykach — nasi klienci mają jedno wspólne: miłość do bycia na wodzie.'
  - icon: ♻️
    title: Odpowiedzialna Produkcja
    desc: CNC-optymalizowane rozmieszczenie części powoduje, że odpady materiałów są mniejsze niż 5%. Trwała konstrukcja redukuje cykle wymiany. Budujemy z myślą o długowieczności, bo to jest najbardziej zrównoważony wybór.
  - icon: 🤝
    title: Wsparcie, które Trwa
    desc: Deski, które zbudowaliśmy lata temu, wciąż kontaktują się z nami po części zamienne. Nasza średnia odpowiedź gwarancyjna to 24 godziny. Nie znikamy po sprzedaży — jesteśmy tu przez całe życie produktu.
