comparison_matrix:
  title: OEM czy ODM — który model pasuje do Twojego projektu?
  subtitle: Cztery tryby współpracy, każdy o różnym poziomie zaangażowania fabryki i kontroli marki
  columns:
    - header: Tryb współpracy
    - header: Rola Twojej marki
    - header: Rola Aquafarera
  rows:
    - option: Produkcja OEM
      standard: Podaj markę, specyfikacje i wymagania dotyczące zgodności
      premium: Buduj zgodnie ze specyfikacją, korzystając z naszych istniejących form i linii produkcyjnych
    - option: Dostosowanie ODM
      standard: Wybierz model podstawowy, dostosuj funkcje i branding
      premium: Dostosuj sprawdzoną platformę RIB do żądanych modyfikacji
    - option: Pół-niestandardowy RIB
      standard: Zdefiniuj długość kadłuba, materiał rur, układ pokładu i wyposażenie
      premium: Zmodyfikuj istniejący kadłub za pomocą niestandardowej konfiguracji rur i planu pokładu
    - option: Pełny rozwój niestandardowy
      standard: Dostarcz koncepcję i wymagania rynku docelowego
      premium: Projekt od podstaw — niestandardowy kadłub, forma i pełna dokumentacja
content_customization:
  tagline: Co można dostosować
  title: Opcje dostosowywania RIB
  subtitle: Każdy element łodzi RIB można dostosować do Twojego zastosowania, rynku i wymagań marki.
  items:
    - title: Kadłub i konstrukcje
      description: Długość kadłuba (2,5–8,5 m), materiał kadłuba (włókno szklane GRP lub aluminium morskie), kolor kadłuba (żelkot lub malowany), profil stępki (głębokie V, umiarkowane V, płaskie), typ pawęży (zamknięta pawęż ze wspornikiem lub studnią) i wzmocnienie konstrukcyjne dla wymagań obciążeń komercyjnych.
      icon: tabler:sailboat
    - title: Rurka i kołnierz
      description: Materiał rurki (0,9–1,2 mm PVC lub 1,4–1,7 mm Hypalon/CSM), średnica rurki (40–55 cm), liczba komór (3–7), typ zaworu (Halkey-Roberts, Leafield D7 lub Boston), kolor rurki (standardowy lub niestandardowy) oraz konfiguracja stożka/stożka kołnierza.
      icon: tabler:circle
    - title: Układ talii i konsoli
      description: Konsola środkowa, konsola boczna lub sterowanie rumplem. Układ siedzeń (fotele dżokejowe, siedzenia kanapowe, siedzenia zagłówkowe). Pokrycie tarasu (pianka EVA imitująca drewno tekowe, farba antypoślizgowa lub goły materiał GRP). Punkty mocowania sprzętu, poręcze i pozycje pierścieni typu D.
      icon: tabler:layout-dashboard
    - title: Elektryka i nawigacja
      description: Światła nawigacyjne (LED), system pomp zęzowych, zarządzanie akumulatorami, instalacja radia VHF, montaż GPS/plotera nawigacyjnego, porty ładowania USB i konfiguracja panelu przełączników.
      icon: tabler:bolt
    - title: Marka i grafika
      description: Grafika kadłuba i rur (sitodruk, termotransfer, druk cyfrowy UV), umieszczanie logo, indywidualne schematy kolorów, oznaczenia identyfikacyjne i niestandardowa dokumentacja właściciela z Twoją marką.
      icon: tabler:palette
    - title: Bezpieczeństwo i zgodność
      description: Ocena kategorii projektowej (A/B/C/D dla RCD), system tłumienia pożaru, specyfikacja układu paliwowego (zbiornik przenośny, zbiornik stały, zbiornik pod pokładem) i pakiet dokumentacji zgodności dla rynku docelowego.
      icon: tabler:shield
content_applications:
  tagline: Konfiguracje aplikacji
  title: Konfiguracje RIB<br />Według aplikacji
  subtitle: Różne misje wymagają różnych konfiguracji. Oto sprawdzone konfiguracje dla najpopularniejszych zastosowań RIB.
  items:
    - title: Ratownictwo i patrolowanie
      description: Kadłub o głębokim kształcie litery V, rury Hypalon, pokład z funkcją samoczynnego ratowania, wzmocnione siedzenia, uchwyty, światła nawigacyjne i wytrzymałe pierścienie typu D. Konstrukcja RCD kategorii B lub C. Ognioodporny układ paliwowy i elektryczna klasa komercyjna.
      icon: tabler:lifebuoy
    - title: Wsparcie nurkowania
      description: Szeroka belka, tylna drabinka do wsiadania, miejsca na stojaki na zbiorniki, dodatkowe pierścienie D, mocowanie flagi nurkowej, wzmocniona pawęż dla podwójnych silników zaburtowych i antypoślizgowe pokrycie z pianki EVA na całym pokładzie.
      icon: tabler:mask
    - title: Turystyka i handel
      description: Układ certyfikowany dla pasażerów z kanapami, osłoną przeciwsłoneczną/bimini, poręczami, suchym schowkiem i systemem dwóch akumulatorów. RCD kategorii C. Zaprojektowany dla floty kurortowej i czarterowej.
      icon: tabler:beach
    - title: Rybacki
      description: Otwarty układ pokładu, umiejscowienie uchwytów na wędki, zbiornik na żywą przynętę, uchwyt do echosondy, uchwyt na silnik do trolingu, wzmocniona pawęż i przenośny układ paliwowy. Opcje konsoli środkowej lub konsoli bocznej.
      icon: tabler:fish
    - title: Przetarg na wypoczynek i jacht
      description: Lekki kadłub, rury PCV, wygodne siedzenia, teleskopowy rumpel lub kompaktowa konsola, punkty podnoszenia żurawika i wyjmowany zbiornik paliwa. RCD kategorii C lub D.
      icon: tabler:sailboat
    - title: Profesjonalna łódź robocza
      description: Opcja kadłuba aluminiowego, wytrzymałe wzmocnienie, hydrauliczny układ kierowniczy, elektryka klasy komercyjnej, łuk radarowy i punkty integracji wyposażenia specyficznego dla misji. Zgodność niestandardowa dla każdego projektu.
      icon: tabler:anchor
process_steps:
  title: 7-etapowy proces rozwoju OEM/ODM RIB
  subtitle: Od opisu projektu po obsługę posprzedażną — zdefiniowany przepływ pracy z jasnymi kamieniami milowymi i rezultatami
  steps:
    - number: '01'
      title: Opis projektu i wymagania
      description: Zdefiniuj docelowe zastosowanie, rozmiar kadłuba, materiał rurki, wymagania zgodności i potrzeby związane z brandingiem. Oceniamy wykonalność i potwierdzamy model współpracy (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 dni
    - number: '02'
      title: Przegląd techniczny i wykonalność
      description: Zespół inżynierów sprawdza wykonalność konstrukcji, obliczenia stabilności i pływalności, ścieżkę zgodności oraz dostępność materiałów. Identyfikujemy istniejące formy lub wymagania dotyczące form niestandardowych.
      timeline: 5–7 dni
    - number: '03'
      title: Propozycja i wycena
      description: Otrzymaj szczegółową ofertę zawierającą specyfikacje, renderingi 3D lub rysunki ogólne, zakres zgodności, harmonogram i ceny jednostkowe w oparciu o poziomy wolumenu i MOQ.
      timeline: 5–7 dni
    - number: '04'
      title: Potwierdzenie projektu i pobieranie próbek
      description: Zatwierdź ostateczną wersję GA, układ pokładu i konfigurację rurek. Produkujemy próbkę przedprodukcyjną z kolorami Twojej marki, logo i określonymi materiałami do fizycznej kontroli.
      timeline: 15–20 dni
    - number: '05'
      title: Zatwierdzenie próbki i protokół kontroli jakości
      description: 'Sprawdź i zatwierdź próbkę. Zdefiniuj protokół kontroli jakości produkcji: próba ciśnieniowa (1,25x / 24–48 godz.), kontrole wymiarowe i lista kontrolna dokumentacji zgodności dla każdego kadłuba.'
      timeline: 3–5 dni
    - number: '06'
      title: Produkcja masowa i kontrola jakości
      description: Pełna seria produkcyjna ze 100-punktową listą kontrolną kontroli jakości na jednostkę. Inspekcje w trakcie procesu, próby ciśnieniowe i identyfikowalność na poziomie seryjnym. Dokumentacja CE/ISO przygotowywana równolegle.
      timeline: 30–45 dni
    - number: '07'
      title: Pakowanie, wysyłka i obsługa posprzedażna
      description: Opakowania niestandardowe (standardowe, gotowe do sprzedaży detalicznej lub na paletach), dokumentacja eksportowa, załadunek kontenerów i logistyka. W komplecie zestawy części zamiennych i dokumentacja serwisowa.
      timeline: 7–14 dni
certifications:
  title: Zgodność i certyfikaty dla łodzi RIB
  subtitle: Do każdego niestandardowego zamówienia RIB dołączona jest dokumentacja zgodności dotycząca konkretnego modelu
  items:
    - name: CE 2013/53/UE
      description: Zgodność z RCD według modelu i kategorii projektowej — DoC, tabliczka producenta, instrukcja obsługi w zestawie
      badge: CE
    - name: ISO 9001:2015
      description: Certyfikowany przez SGS system zarządzania jakością obejmujący projektowanie, produkcję i dystrybucję
      badge: ISO
    - name: EN ISO 6185
      description: Standard konstrukcji pontonów — stabilność, pływalność i wyciąganie człowieka za burtę
      badge: 6185
    - name: EN ISO 14945
      description: Tabliczka znamionowa producenta — trwale oznaczona informacja identyfikacyjna i pojemność
      badge: 14945
    - name: BSCI
      description: Audyt zgodności społecznej w zakresie etycznej produkcji – wymagany przez sprzedawców detalicznych w UE
      badge: BSCI
    - name: ZASIĘG
      description: Zgodność UE z wymogami bezpieczeństwa chemicznego dla PVC, Hypalonu, klejów i powłok
      badge: REACH
faq:
  title: RIB OEM/ODM — często zadawane pytania
  questions:
    - q: Jaka jest różnica między OEM i ODM dla łodzi RIB?
      a: 'OEM (Original Equipment Manufacturing): podajesz szczegółowe specyfikacje, a my budujemy Twój projekt. ODM (Original Design Manufacturing): wybierasz sprawdzoną platformę Aquafarer RIB, a my dostosowujemy ją do pożądanych funkcji i marki. ODM jest szybszy i tańszy; OEM zapewnia maksymalną kontrolę nad projektem.'
    - q: Czy mogę dostosować kształt i rozmiar kadłuba RIB?
      a: Tak. Oferujemy półniestandardowe modyfikacje istniejących form kadłuba (różne układy pokładów, konfiguracje rur) oraz w pełni niestandardowe opracowywanie kadłuba za pomocą nowych form obrabianych CNC. Projekty półniestandardowe mogą zaczynać się od 2-5 jednostek; pełny zwyczaj zazwyczaj wymaga większych zobowiązań.
    - q: Jakie materiały rurek są dostępne dla niestandardowych RIBów?
      a: Oferujemy PVC o grubości 0,9–1,2 mm do zastosowań rekreacyjnych i lekkich obiektów komercyjnych oraz Hypalon/CSM o grubości 1,4–1,7 mm do zastosowań profesjonalnych, ratowniczych i komercyjnych wymagających doskonałej odporności na promieniowanie UV i ozon (żywotność 10–15 lat w porównaniu z 5–8 lat w przypadku PVC).
    - q: Czy możesz skonfigurować RIBy do konkretnych zastosowań, takich jak ratownictwo, nurkowanie lub wędkarstwo?
      a: Tak. We maintain proven configuration templates for rescue/patrol, diving support, tourism/charter, fishing, yacht tender, and professional workboat applications. Każdy szablon zawiera zalecany typ kadłuba, materiał rur, układ pokładu i wyposażenie, które następnie dostosowujemy dokładnie do Twoich wymagań.
    - q: Jakich informacji potrzebujesz do wyceny OEM/ODM RIB?
      a: Docelowe zastosowanie, pożądana długość kadłuba, preferowany materiał rurki (PVC lub Hypalon), przybliżona ilość i harmonogram dostaw, wymagania zgodności rynku docelowego oraz wszelkie produkty i specyfikacje referencyjne. Im więcej szczegółów podasz, tym szybsza i dokładniejsza będzie nasza wycena.
    - q: Jakie jest MOQ dla niestandardowych łodzi RIB?
      a: W przypadku istniejących form kadłuba ze standardowymi modyfikacjami MOQ zaczyna się od 2-5 sztuk na projekt. W przypadku form niestandardowych i pełnego rozwoju niestandardowego MOQ zależy od złożoności projektu — zazwyczaj 10–20 jednostek w przypadku częściowo niestandardowych i ponad 30 w przypadku pełnego niestandardowego z nowym oprzyrządowaniem.
    - q: Kto jest właścicielem niestandardowych form i rysunków?
      a: Formy opracowane przy użyciu podstawowych projektów Aquafarer pozostają własnością Aquafarer. W pełni niestandardowe formy zlecone i opłacone przez klienta mogą zostać przeniesione na własność klienta zgodnie z warunkami umowy. Wszystkie warunki własności formy są dokumentowane przed rozpoczęciem projektu.
    - q: Jak pakowane są niestandardowe RIB-y do eksportu?
      a: 'Standard: kołyska na zamówienie + folia stretch do załadunku kontenera. Premium: opakowanie gotowe do sprzedaży detalicznej, pakowane próżniowo lub na paletach. Oferujemy wysyłkę FOB Qingdao, CIF i DDP. W cenie pełna dokumentacja eksportowa i odprawa celna.'
