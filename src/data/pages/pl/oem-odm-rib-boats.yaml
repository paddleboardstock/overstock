content_service_modules:
  tagline: Moduły usług
  title: OEM/ODM Moduły serwisowe<br />
  subtitle: Każdy projekt łączy w sobie odpowiednie moduły usług. Nie każdy projekt wymaga każdego modułu — uwzględniamy tylko to, czego wymaga Twój projekt.
  items:
    - title: Przegląd inżynieryjny i wykonalność
      description: 'Ocena platformy kadłuba, sprawdzenie wykonalności konstrukcji, weryfikacja stabilności i pływalności, identyfikacja ścieżki zgodności i potwierdzenie dostępności materiałów. Wynik: raport wykonalności z rekomendacją typu „Go/No Go”.'
      icon: tabler:math-function
    - title: Projekt i konfiguracja
      description: 'Rysunek GA, układ pokładu, konfiguracja rur, pozycje konsoli i siedzeń, plan montażu sprzętu oraz wybór koloru/materiału. Dane wyjściowe: zatwierdzona specyfikacja GA i konfiguracji.'
      icon: tabler:ruler
    - title: Próbka i prototyp
      description: Próbka przedprodukcyjna z zatwierdzonymi kolorami, logo i określonymi materiałami do kontroli fizycznej. Zawiera przykładowy protokół zatwierdzenia, listę kontrolną inspekcji i proces żądania zmiany.
      icon: tabler:3d-cube-sphere
    - title: Produkcja i kontrola jakości
      description: Produkcja masowa ze 100-punktową listą kontrolną kontroli jakości na jednostkę, inspekcjami w trakcie procesu, próbą ciśnieniową (1,25x / 24–48 godz.) i identyfikowalnością na poziomie seryjnym. CE/ISO dokumentacja przygotowywana równolegle.
      icon: tabler:clipboard-check
    - title: Marka i opakowanie
      description: Aplikacja logo marki własnej, niestandardowa grafika kadłuba i rur, dokumentacja właściciela marki, opakowanie gotowe do sprzedaży detalicznej lub opakowanie na paletach oraz przygotowanie zestawu części zamiennych.
      icon: tabler:palette
    - title: Eksport i dokumentacja
      description: Opakowanie eksportowe, plan załadunku kontenera, dokumentacja FOB/CIF/DDP, dokumenty dotyczące zgodności dla rynku docelowego i protokół komunikacji po dostawie.
      icon: tabler:world
content_risk_control:
  tagline: Kontrola ryzyka i dostaw
  title: Zarządzanie ryzykiem projektu i <br /> dostawą
  subtitle: Profesjonalni nabywcy OEM/ODM dbają o kontrolę ryzyka w równym stopniu, jak o jakość produktu. Oto jak sobie z tym radzimy.
  items:
    - title: Definicja zakresu i własności
      description: 'Przed rozpoczęciem prac rozwojowych określamy na piśmie: zakres dostosowania, wymagania dotyczące narzędzi, kryteria zatwierdzania próbek, własność rysunków i form oraz obowiązki związane z dokumentacją. Nie ma dwuznaczności co do tego, kto jest właścicielem czego.'
      icon: tabler:file-text
    - title: Proces kontroli zmian
      description: Wszystkie zmiany specyfikacji po zatwierdzeniu projektu podlegają udokumentowanemu procesowi żądania zmiany z oceną wpływu (koszt, harmonogram, zgodność). Żadne niezatwierdzone modyfikacje nie wchodzą do produkcji.
      icon: tabler:arrows-diff
    - title: Gwarancja spójności partii
      description: 50. jednostka odpowiada pierwszej zatwierdzonej próbce. Zatwierdzone specyfikacje zostają zamrożone, parametry materiałów i procesów zablokowane, a punkty kontrolne w procesie weryfikują spójność w całej serii produkcyjnej.
      icon: tabler:repeat
    - title: Przejrzystość dostaw i wydajności
      description: Czasy realizacji są podawane w oparciu o rzeczywistą zdolność produkcyjną, poziom zapasów materiałów i bieżące obciążenie zamówieniami, a nie cele aspiracyjne. Harmonogram produkcji z datami kluczowych etapów dostarczanymi dla każdego zamówienia.
      icon: tabler:calendar-stats

