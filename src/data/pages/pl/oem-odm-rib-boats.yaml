hero:
  tagline: Produkcja RIB na zamówienie
  title: Niestandardowe usługi OEM i ODM dla łodzi RIB
  subtitle: Od sprawdzonych platform po specjalnie zbudowane jednostki pływające — Aquafarer świadczy usługi OEM i ODM specyficzne dla RIB dla marek, dealerów i profesjonalnych operatorów, którzy potrzebują niestandardowych konfiguracji kadłuba, materiałów rur, układów pokładów i dokumentacji zgodności dla swoich rynków docelowych.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Produkcja OEM łodzi RIB na zamówienie w firmie Aquafarer
direct_answer: Aquafarer oferuje dostosowanie OEM i ODM do specyficznych RIB z fabryki w Qingdao posiadającej certyfikat CE – w tym niestandardowe długości kadłuba, materiały rur (PVC lub Hypalon/CSM), układy pokładów, konfiguracje konsoli i siedzeń oraz pełną dokumentację zgodności RCD 2013/53/UE. MOQ zaczyna się od 2-5 jednostek dla modeli RIB.
