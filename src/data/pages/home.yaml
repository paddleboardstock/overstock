faqs:
  title: B2B Procurement FAQ
  subtitle: 'Common questions from brands, distributors, and commercial operators about OEM/ODM manufacturing with Aquafarer.'
  columns: 2
  items:
    - title: Are you a manufacturer or trading company?
      description: 'We are a vertically integrated factory with full control over quality, materials, and lead times. Business license and production scope verifiable during factory audit.'
      icon: tabler:building-factory
      category: all
    - title: What is your OEM/ODM process?
      description: 'Requirements review (48h) to proposal to prototype (7-14 days) to production (30-45 days FOB Qingdao). Full engineering support, compliance documentation, and per-hull traceability throughout.'
      icon: tabler:route
      category: all
    - title: What are your MOQ requirements?
      description: 'RIB boats: 2-5 units per model (existing mold), 200+ for custom molds. SUP boards: 5-10 units per SKU. Mixed-model container orders available. Sample orders at 2-5 units for evaluation.'
      icon: tabler:sort-ascending
      category: all
    - title: Which customization options are available?
      description: 'Hull design, tube material (PVC or Hypalon/CSM), tube diameter, console layout, seating, steering, fuel system, deck layout, brand colors, logo graphics, EVA pad design, retail packaging, and owner manual branding.'
      icon: tabler:adjustments
      category: all
    - title: Which compliance documents can you provide for my market?
      description: 'CE DoC per 2013/53/EU, UKCA marking, ISO 9001 certificate (SGS), BSCI audit report, REACH compliance, material test reports, pressure test logs, and model-specific builder plate data. Market-specific documentation on request.'
      icon: tabler:file-certificate
      category: all
    - title: What is the sampling and production lead time?
      description: 'Pre-production samples: 7-14 working days. Standard production: 30-45 days FOB Qingdao. Rush production available at additional cost. Peak season (March-June) may extend lead times.'
      icon: tabler:clock
      category: all
    - title: Can I arrange a factory audit or live video tour?
      description: 'Yes. On-site factory audits at our Qingdao facility welcome with 3-5 days notice. Live video tours via WhatsApp/Zoom available immediately. Third-party inspections (SGS, BV, TÜV) accommodated.'
      icon: tabler:video
      category: all
    - title: What quality inspections are completed before shipment?
      description: '1.25x rated pressure hold test (24-48h), seam peel testing, 100-point final inspection checklist, dimensional verification, cosmetic inspection, compliance documentation verification, and packaging integrity check. All per ISO 9001 procedures.'
      icon: tabler:clipboard-check
      category: all

