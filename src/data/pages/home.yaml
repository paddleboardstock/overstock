features:
  id: features
  tagline: Why Buy From Paddle Board Overstock
  title: 'Real Factory,<br />Real Savings'
  subtitle: 'Factory-direct overstock and clearance SUP packages — certified quality without the retail markup.'
  columns: 2
  items:
    - title: Up to 60% Off Retail
      description: 'We sell factory overstock and clearance batches direct — no middlemen, no retail markup. The same boards that sell for full price elsewhere, at clearance prices here.'
      icon: tabler:rocket
    - title: Complete Packages
      description: 'Every SUP comes as a complete package: board, travel backpack, hand pump, adjustable paddle, removable fin, coil leash, and repair kit.'
      icon: tabler:clipboard-list
    - title: Certified Quality
      description: '13 CE-certified SUP models per applicable EU directives. Every board is 100% pressure-tested at 1.25x rated PSI before it ships. 99.3% defect-free rate per AQL 2.5.'
      icon: tabler:certificate
    - title: No MOQ — Order One Board
      description: 'Overstock clearance means single-unit orders welcome. Add a board to the cart, check out, done. No minimum order, no quotation process.'
      icon: tabler:adjustments
    - title: Fast Worldwide Shipping
      description: 'In-stock orders ship from Weihai within 2-3 business days. Tracked delivery to 50+ countries across the EU, North America, Asia-Pacific, and beyond.'
      icon: tabler:truck-delivery
    - title: 2-Year SUP Warranty
      description: 'Every SUP board and accessory is covered for 2 years — drop-stitch seams, inflation valves, and accessories included. Claims are resolved in days, not weeks.'
      icon: tabler:lifebuoy

