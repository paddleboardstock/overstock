faqs:
  title: SUP Ordering & Product FAQ
  subtitle: 'Common questions about our clearance SUP boards, ordering, payment, shipping, and warranty.'
  columns: 2
  items:
    - title: Is SUP hard to learn?
      description: 'Not at all. Most beginners stand up and paddle within their first session. Our all-around SUP boards feature extra-wide stable platforms designed specifically for first-time paddlers. Start on calm water and you will be cruising in minutes.'
      icon: tabler:swimming
      category: sup
    - title: What is the weight limit?
      description: 'Our all-around SUPs support up to 220 lbs and the touring and yoga platforms support up to 250 lbs. Every product page lists the exact rider weight capacity so you can match the board to your needs.'
      icon: tabler:adjustments
      category: sup
    - title: Can I travel with an inflatable SUP?
      description: 'Absolutely. Every Paddle Board Overstock board packs into a backpack-sized carrying case. At just 18-22 lbs, it is easy to carry to the beach, lake, or through airport terminals. Check your airline baggage policy before travel.'
      icon: tabler:truck-delivery
      category: sup
    - title: What comes in the box?
      description: 'Every Paddle Board Overstock SUP includes the board, a travel backpack, hand pump, adjustable paddle, removable fin, coil leash, and repair kit.'
      icon: tabler:clipboard-list
      category: sup
    - title: Why are your prices lower than retail?
      description: 'We sell factory overstock and clearance batches direct from our own production facility in Weihai, China — no middlemen, no retail markup. That means complete SUP packages at up to 60% off typical retail prices, with the same CE-certified quality.'
      icon: tabler:certificate
      category: orders
    - title: How do I place an order and pay?
      description: 'Add your SUP package to the cart and check out securely with Stripe or PayPal. We accept all major credit and debit cards. Every order is confirmed by email with a full invoice.'
      icon: tabler:file-text
      category: orders
    - title: Do you ship worldwide?
      description: 'Yes. We ship to 50+ countries across the EU, North America, Asia-Pacific, the Middle East, and Africa. In-stock orders typically ship within 2-3 business days with tracking provided for every parcel.'
      icon: tabler:route
      category: orders
    - title: What warranty do SUP boards include?
      description: 'Every SUP board and accessory is covered by a 2-year warranty — including the board itself, drop-stitch seams, and inflation valves. Claims are resolved in days, not weeks: file online and we repair or replace.'
      icon: tabler:lifebuoy
      category: orders

