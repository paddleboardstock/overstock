content_customer_types:
  tagline: Who We Serve
  title: 'Built for B2B Buyers<br />— Not Retail Shoppers'
  subtitle: 'Aquafarer manufactures for four customer types. Each has different priorities, and we address them all.'
  items:
    - title: 'Brand Owners / Private Label'
      description: 'Custom product design, private-label graphics, compliance documentation under your brand, and dedicated engineering support from concept to container.'
      icon: tabler:palette
      cta: 'Request OEM/ODM Quote'
      cta_href: /request-quotation
    - title: 'Distributors / Wholesalers'
      description: 'Territory protection, competitive wholesale pricing, marketing support kits, product training, and full compliance documentation for your market.'
      icon: tabler:world
      cta: 'Apply for Dealership'
      cta_href: /dealers-distributors
    - title: 'Resorts / Rental Operators'
      description: 'Commercial-grade durability, fleet sizing advice, mixed-model container orders, spare parts strategy, and resort-branded equipment packages.'
      icon: tabler:beach
      cta: 'Get a Commercial Package'
      cta_href: /solutions/resorts
    - title: 'Rescue / Government / Professional'
      description: 'Hypalon/CSM construction, SOLAS compliance options, project-specific certification, tender documentation support, and NDA-protected engineering.'
      icon: tabler:shield
      cta: 'Discuss a Project'
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: OEM/ODM Capability
  title: 'What You Get<br />with Aquafarer'
  subtitle: 'Direct factory access with full engineering, quality, and compliance support — not a trading company.'
  columns: 2
  items:
    - title: OEM/ODM Customization
      description: 'Custom hull design, tube material (PVC or Hypalon/CSM), console layout, seating, branding, colors, and packaging. From minor modifications to full custom engineering.'
      icon: tabler:adjustments
    - title: Low MOQ, Fast Sampling
      description: 'RIB: 2-5 units (existing mold). SUP: 5-10 units per SKU. Custom molds: 200+ units. Pre-production samples with your branding in 7-14 days.'
      icon: tabler:rocket
    - title: Production-Ready Quality
      description: 'Every unit pressure-tested at 1.25x rated PSI for 24-48 hours. 99.3% defect-free rate per AQL 2.5 / ISO 2859. 100-point quality checklist per hull.'
      icon: tabler:certificate
    - title: Full Compliance Documentation
      description: 'CE per 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI social audit, REACH compliance, UKCA marking. Model-specific DoC and builder plate data included.'
      icon: tabler:file-certificate
    - title: 30-45 Day Lead Time
      description: 'Standard production 30-45 days FOB Qingdao. Prototypes 7-14 days. Rush production available. Container loading plans and ISPM-15 crating included.'
      icon: tabler:truck-delivery
    - title: After-Sales & Spare Parts
      description: '5-year warranty on boats/kayaks/RIBs, 2-year on SUP/accessories. Spare parts supply with priority shipping. Warranty claim processing support.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Product Categories
  title: '5 Categories,<br />64 CE-Certified Models'
  subtitle: 'From 2.4m RIB tenders to 15ft SUP boards — all manufactured in our Qingdao ISO 9001 facility.'
  items:
    - title: 'RIB Boats'
      description: '2.4m to 7.0m with aluminum or GRP hulls. PVC or Hypalon/CSM tubes. CE per 2013/53/EU. Patrol, diving, rescue, and commercial configurations.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: 'Inflatable Boats'
      description: '2.0m to 5.0m with aluminum floor, plywood floor, or air-deck options. Fishing, recreation, and tender models.'
      icon: tabler:sailboat
      link: /products
    - title: 'SUP Boards'
      description: '9ft to 15ft in 4-inch and 6-inch Drop-Stitch. All-round, touring, yoga, and fishing models. Commercial-grade available.'
      icon: tabler:swimming
      link: /products
    - title: 'Kayaks'
      description: '1-person to 3-person inflatable kayaks. Recreational and touring models with Drop-Stitch floor options.'
      icon: tabler:kayak
      link: /products
    - title: 'Safety Accessories'
      description: 'CE-certified life vests, throw ropes, repair kits, pumps, and navigation lights. USCG Type III/V approved PFDs.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Factory Strength
  title: 'Audit-Ready Manufacturing<br />in Qingdao'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12,000 m² ISO 9001 Facility — Real Manufacturer, Not a Trading Company</h3>
  items:
    - title: '6 Dedicated Production Lines'
      description: 'Separate RIB, inflatable boat, SUP, kayak, safety equipment, and OEM/ODM lines. Each with dedicated QC checkpoints and production planning.'
    - title: '100% Pressure Tested'
      description: 'Every inflatable chamber pressurized to 1.25x rated PSI and held for 24-48 hours. Test results linked to hull serial number (HIN).'
    - title: 'Per-Hull Traceability'
      description: 'HIN-level production records with 21+ data fields per hull: material batch, welder ID, pressure test result, final configuration, and delivery destination.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 12,000 m² ISO 9001 manufacturing facility in Qingdao with RIB production lines

content_compliance:
  tagline: Compliance & Quality Proof
  title: 'Documented Evidence,<br />Not Just Claims'
  subtitle: 'Every compliance claim is backed by model-specific documentation available for your verification.'
  items:
    - title: 'ISO 9001:2015 (SGS)'
      description: 'Quality management system certified by TÜV Rheinland/SGS. Annual surveillance audits. Documented QC processes from incoming material to shipment release.'
      icon: tabler:certificate
    - title: 'CE per 2013/53/EU (RCD)'
      description: '64 models with model-specific Declarations of Conformity. Conformity assessment per applicable modules. HIN registration and builder plate data for every hull.'
      icon: tabler:file-certificate
    - title: 'BSCI Social Compliance'
      description: 'Annual BSCI audit by SGS. Verified ethical labor practices, workplace safety, and environmental management across our facility.'
      icon: tabler:users
    - title: 'REACH & UKCA'
      description: 'All PVC and adhesive materials comply with EU REACH regulation. UKCA marking available for UK market. Material safety data sheets on request.'
      icon: tabler:shield-check

steps:
  title: 'OEM/ODM Process — From Brief to Container'
  items:
    - title: 'Step 1: <span class="font-medium">Requirements</span>'
      description: 'Share your product specs, target market, quantity, and compliance requirements. Our engineering team reviews within 48 hours.'
      icon: tabler:file-text
    - title: 'Step 2: <span class="font-medium">Proposal</span>'
      description: 'Receive a detailed proposal with specifications, material options, MOQ, pricing, lead time, and compliance scope for your market.'
      icon: tabler:clipboard-list
    - title: 'Step 3: <span class="font-medium">Prototype</span>'
      description: 'Pre-production sample with your branding in 7-14 days. Full quality testing at 1.25x rated pressure. Sample cost credited toward production.'
      icon: tabler:settings
    - title: 'Step 4: <span class="font-medium">Production</span>'
      description: '30-45 day production FOB Qingdao after sample approval. In-process QC checkpoints, pressure testing, and 100-point final inspection on every unit.'
      icon: tabler:building-factory
    - title: 'Step 5: <span class="font-medium">Delivery</span>'
      description: 'Container loading plan, ISPM-15 wooden crating, compliance documentation package, and FOB Qingdao shipment with full export paperwork.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer OEM/ODM inflatable boat manufacturing process from design to container shipment

