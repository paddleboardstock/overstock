hero_text:
  tagline: Resources
  title: 'Download Center & Buyer Guides'
  subtitle: 'Access product catalogs, OEM guides, buyer checklists, and technical documentation to help you make informed procurement decisions.'
features3_downloads:
  tagline: Downloads
  title: 'Product Documentation<br />& Buyer Resources'
  isBeforeContent: false
  columns: 2
  items:
    - title: '2026 Marine Product Catalog'
      description: 'Complete product range including RIB boats, inflatable boats, SUP boards, kayaks, and accessories. Specifications, configurations, and options. PDF format.'
      icon: tabler:file-text
    - title: 'OEM Manufacturing Guide'
      description: 'Everything you need to know about OEM/ODM partnerships: process overview, minimum order quantities, customization options, quality control, and shipping.'
      icon: tabler:building-factory
    - title: 'RIB Boat Buyer Guide'
      description: 'How to choose the right RIB: hull materials, tube materials, engine selection, size considerations, and configuration options for different applications.'
      icon: tabler:file-description
    - title: 'SUP Supplier Checklist'
      description: 'Key considerations when selecting a SUP board manufacturer: quality indicators, certification requirements, MOQ considerations, and what to look for in a factory audit.'
      icon: tabler:clipboard-check
    - title: 'Inflatable Boat Material Guide'
      description: 'PVC vs Hypalon: comparison of durability, UV resistance, lifespan, repair options, and cost considerations for different marine applications.'
      icon: tabler:files
    - title: 'Custom Manufacturing Brief Template'
      description: 'Download our product brief template. Fill in your requirements and return it to us for a same-week quotation and feasibility assessment.'
      icon: tabler:template
faqs:
  title: Frequently Asked Questions
  subtitle: 'Common questions about our products, manufacturing process, and partnership model.'
  columns: 2
  items:
    - title: What is the minimum order quantity?
      description: 'MOQ varies by product category. RIB boats typically start from 10 units per model. SUP boards from 50 units. Contact our sales team for product-specific MOQ information.'
      icon: tabler:help-circle
    - title: Can I get samples before placing an order?
      description: 'Yes. Paddle Board Overstock provides sample production for evaluation before mass production. Sample costs are negotiable and often credited toward the first production order.'
      icon: tabler:package
    - title: What payment terms are available?
      description: 'Standard terms are 30% deposit with order, 70% before shipment. LC terms available for qualifying customers. Contact our finance team to discuss arrangements.'
      icon: tabler:currency-dollar
    - title: How long does production take?
      description: 'Typical lead times: RIB boats 30-45 days, SUP boards 20-30 days, inflatable boats 25-35 days. Custom development adds 15-30 days for prototyping.'
      icon: tabler:calendar-clock
    - title: What certifications do your products carry?
      description: 'CE certification for EU markets, US Coast Guard approved manufacturing, ISO quality system, BSCI compliance, and REACH material compliance.'
      icon: tabler:certificate
    - title: Do you offer custom packaging and branding?
      description: 'Yes. We provide custom packaging with your logo, colors, and brand identity. MOQ for custom packaging depends on the product category.'
      icon: tabler:color-swatch
cta:
  title: 'Need help finding the right resource?'
  subtitle: 'Contact our team for personalized guidance on product selection, OEM partnerships, or technical specifications.'
  actions:
    - variant: primary
      text: Contact our team
      href: /contact
