hero:
  tagline: Our Team
  title: 'The People Behind Aquafarer<br />— Engineering Freedom on Water'
  subtitle: 'Founded in 2012 in Qingdao, China, Aquafarer was built by marine engineers, material scientists, and water sports enthusiasts who believed in making professional-grade inflatable watercraft accessible worldwide.'
  image:
    src: /images/team-all.webp
    alt: Aquafarer full team photo — engineering, production, and leadership
founding:
  tagline: Our Founding
  title: 'From a Coastal Workshop<br />to a 12,000 m² Facility'
  subtitle: 'Aquafarer was founded by a team of marine engineers with decades of combined experience in inflatable boat design, PVC/Hypalon fabrication, and global marine equipment manufacturing.'
  items:
    - title: 'Founded: 2012'
      description: 'Established in Qingdao, China — a major maritime hub with deep shipbuilding heritage.'
      icon: tabler:calendar
    - title: '200-300 Employees'
      description: 'Including 50+ R&D engineers, quality control specialists, and production technicians.'
      icon: tabler:users
    - title: '12,000 m² Facility'
      description: 'Dedicated manufacturing plant with 6 production lines for RIBs, inflatable boats, and SUP boards.'
      icon: tabler:building-factory
    - title: '50+ Countries Served'
      description: 'Exporting to Europe, Americas, Middle East, Asia-Pacific, and Africa.'
      icon: tabler:globe
