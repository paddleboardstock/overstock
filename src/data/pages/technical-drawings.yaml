content_tiers:
  tagline: Download Tiers
  title: 'Four Access Levels<br />— The Right Detail for the Right Stage'
  subtitle: 'We provide procurement-level drawings, not manufacturing-level files. Each tier matches a different project stage.'
  items:
    - title: 'Tier 1 — Public PDF'
      description: 'General arrangement (GA), 4-view dimension drawing, and deck layout in PDF format. Available for free download. Sufficient for project planning, space allocation, and preliminary specification review.'
      icon: tabler:file-type-pdf
    - title: 'Tier 2 — Light Form DXF/DWG'
      description: '2D CAD files (DXF or DWG) for planning-level layout integration. Requires a short qualification form (company name, project type, intended use). No structural or manufacturing data included.'
      icon: tabler:file-code
    - title: 'Tier 3 — Project Application STEP/IGES'
      description: '3D model files (STEP or IGES) for system integration, outfitting design, or naval architecture coordination. Requires project application with scope, timeline, and purchase intent. Subject to approval.'
      icon: tabler:cube
    - title: 'Tier 4 — NDA Engineering'
      description: 'Hull structural drawings, lamination schedules, tube cutting expansions, and mold data. Available only under NDA with confirmed orders. These are manufacturing-level files — not for public distribution.'
      icon: tabler:lock

content_included:
  tagline: What Is Included
  title: 'Drawing Contents<br />Per Model'
  subtitle: 'Each model has a standard drawing package covering the essential planning information for B2B buyers and project engineers.'
  items:
    - title: 'General Arrangement (GA)'
      description: 'Side profile, top view, and cross-section showing hull form, tube position, console location, seating, fuel system, and key dimensions (LOA, beam, tube diameter, deadrise angle). Revision status and copyright noted on title block.'
      icon: tabler:layout
    - title: '4-View Dimension Drawing'
      description: 'Side, front, rear, and top views with overall dimensions for transport planning (height on trailer, beam for container, weight for lifting). Includes operational and transport configurations.'
      icon: tabler:ruler-2
    - title: 'Deck Layout & Equipment Plan'
      description: 'Top-down deck view showing console base, seat positions, D-ring locations, navigation light positions, bilge pump access, battery/fuel compartment, and equipment mounting points. Limited precision on proprietary interfaces.'
      icon: tabler:map
    - title: 'Transport & Packaging Drawing'
      description: 'Container loading plan, cradle dimensions, weight distribution, and lifting point positions for logistics planning. Includes standard and custom packaging options.'
      icon: tabler:truck

content_protection:
  tagline: IP Protection
  title: 'What We Do Not Share<br />& Why'
  subtitle: 'Protecting our engineering IP ensures we can continue investing in R&D while still providing everything buyers need for project planning.'
  items:
    - title: 'Hull Mold Core Data'
      description: 'Plug and mold geometry, CNC tool paths, and lamination templates are proprietary manufacturing assets. They are not shared at any access tier outside confirmed NDA contracts.'
      icon: tabler:ban
    - title: 'Tube Cutting Expansions'
      description: 'Flat-pattern cutting files for tube fabric are manufacturing-level data. Available only under NDA with confirmed production orders and shared only with the contracting party.'
      icon: tabler:ban
    - title: 'Structural Calculations'
      description: 'Detailed stress analysis, FEA results, and laminate schedules are compliance-sensitive documents shared only with Notified Bodies and NDA-bound clients during the conformity assessment process.'
      icon: tabler:ban
    - title: 'Competitor Screening'
      description: 'We reserve the right to decline CAD access requests that appear to be from competitors, students without project context, or parties without legitimate procurement intent.'
      icon: tabler:shield

