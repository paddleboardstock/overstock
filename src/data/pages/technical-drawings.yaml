hero:
  tagline: Technical Drawings & CAD
  title: 'RIB & Inflatable Boat<br />Technical Drawings & CAD Downloads'
  subtitle: 'Planning-level GA drawings, dimension sheets, and deck layouts for project evaluation and specification. Access technical drawings at the right level — from public PDFs to project-level STEP files.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB boat technical drawings and CAD downloads

direct_answer: 'Aquafarer provides procurement-level technical drawings for RIB boats and inflatable watercraft — including general arrangement (GA) PDFs, dimension sheets, and deck layout drawings. Higher-detail formats (DXF/DWG, STEP/IGES) are available upon qualified inquiry or project application.'

