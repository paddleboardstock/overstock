content_version_control:
  tagline: Version Control
  title: 'Drawing Version<br />Management'
  subtitle: 'Every drawing follows a controlled revision system. Always verify you have the current revision before using drawings for project planning.'
  items:
    - title: 'Revision Tracking'
      description: 'Each drawing carries a revision code (Rev-A, Rev-B, Rev-C), issue date, last-reviewed date, applicable model/configuration, units, file size, and format. Only the "Current" revision is available for download.'
      icon: tabler:git-branch
    - title: 'Drawing Status Notice'
      description: 'All public drawings are marked "Preliminary layout only — not for construction, certification, or production use. Dimensions subject to final specification and order confirmation." This protects both parties from misapplication.'
      icon: tabler:alert-circle
    - title: 'Update Notifications'
      description: 'When a model specification changes, the drawing revision is updated and previous versions are marked "Superseded." Registered users who downloaded DXF/DWG packs are notified of significant updates via email.'
      icon: tabler:bell

faq:
  title: Technical Drawings — Frequently Asked Questions
  questions:
    - q: Are the GA PDFs really free?
      a: 'Yes. General arrangement PDFs for our main models are available at no cost — complete the short qualification form below and the download link is delivered by email within 1 business day. They contain planning-level information sufficient for project evaluation, space allocation, and preliminary specification review.'
    - q: How do I access DXF/DWG files?
      a: 'Complete the short qualification form on the download page with your company name, project type, and intended use. Approved requests receive a download link via email within 1 business day.'
    - q: Can I get STEP/IGES 3D models?
      a: 'STEP or IGES 3D model files are available through our project application process. Provide your project scope, integration requirements, timeline, and purchase intent. Subject to approval — typically within 3-5 business days.'
    - q: Why do you restrict access to higher-detail files?
      a: 'Hull geometry, mold data, and structural calculations represent years of R&D investment and are core manufacturing IP. We provide everything needed for procurement planning and project integration while protecting our ability to continue investing in new product development.'
    - q: Do the drawings include manufacturing details?
      a: 'No. Public and light-form drawings contain procurement-level information for planning and specification. Manufacturing-level details (lamination schedules, tool paths, cutting expansions) are shared only under NDA with confirmed orders.'
    - q: Are drawings available for custom or semi-custom RIB configurations?
      a: 'Custom project drawings are prepared as part of the OEM/ODM development process. If you are evaluating a custom RIB project, contact us with your requirements and we will provide project-specific GA drawings as part of the proposal.'

