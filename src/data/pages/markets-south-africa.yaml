overview_section:
  tagline: Market Overview
  title: The South African SUP Market
  paragraphs:
    - South Africa has the most mature board-sports market on the continent. Cape Town pairs world-class downwind runs and flat-water lagoons with a deep surf culture; Durban runs warm-water beaches year-round; the Garden Route's knysna lagoons and Plettenberg Bay are made for recreational paddling. A well-established retail infrastructure and a genuine local paddling community — from SUP surfers to flat-water fitness paddlers — set this market apart.
    - Buyers here are seasoned: surf shops with real retail floors, paddle schools with fleets, and adventure operators combining SUP with kayaking and cycling tours. They evaluate gear like professionals — construction, warranty, and repairability — and they order in small, deliberate batches of 5–20 boards, mixing rental-grade all-arounders with premium editions for the retail wall.
  customer_types:
    - title: Surf & Paddle Shops
      description: Established Cape Town and Durban retailers adding or expanding SUP lines for the local paddling community.
    - title: Paddle Schools & Rentals
      description: Schools and rental fleets on lagoons and calm-water beaches refreshing boards on a real replacement cycle.
    - title: Adventure Operators
      description: Garden Route and Western Cape operators adding SUP to multi-activity adventure offerings.
shipping_section:
  title: Ship to South Africa
  paragraphs:
    - Orders ship from Weihai, China. Express air freight carries samples and 1–3 board orders into Johannesburg and Cape Town; consolidated sea freight serves 5–20 board wholesale orders through Durban, Cape Town, and other ports. Transit estimates for your destination are included in your quote.
    - We provide the commercial invoice and packing list clearance requires, with correct HS codes and declared values. Import duties and VAT are payable by the importer under South African rules.
  customs_note: SARS clearance is documentation-driven — confirm current duty and VAT treatment for inflatable sports equipment with your clearing agent before ordering. We supply complete, consistent paperwork and respond quickly to broker requests.
faq_section:
  title: South Africa FAQ
  items:
    - q: Do the boards suit Cape Town's mixed conditions?
      a: Yes. All-around models handle lagoon flat water and calm coastal days, and the range includes touring-oriented boards for longer paddles. For open-ocean downwind runs, experienced paddlers should discuss their specific use case with us before ordering.
    - q: What does a shop order look like?
      a: "Typically 5–20 boards: a base of all-around models for lessons and rentals plus premium art editions for the retail wall — mixed models, one shipment, priced by total quantity."
    - q: How is freight quoted to South Africa?
      a: Express air into Johannesburg or Cape Town for samples and small orders; consolidated sea freight to Durban or Cape Town for wholesale quantities. Both are itemized in your quote with estimated transit times.
    - q: Who handles import duties and VAT?
      a: You do, as the importer, through your clearing agent under SARS rules. We provide the commercial invoice and packing list with correct HS codes and declared values.
