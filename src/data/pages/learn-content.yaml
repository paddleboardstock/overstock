materials:
  intro_p1: The performance, durability, and safety of an inflatable paddle board depend almost entirely on the materials used in its construction. From the laminate that forms the hull to the threads that give a SUP board its rigidity, every material choice affects how the product performs on the water and how long it lasts.
  intro_p2: 'This guide covers the three core materials used in modern inflatable paddle boards: the PVC laminate, the drop-stitch core, and EVA foam decking. Understanding these materials will help you choose the right board for your needs and maintain it for maximum lifespan.'
  labels:
    advantages: Advantages
    limitations: Limitations
    best_for: 'Best for:'
  items:
    - name: PVC (Polyvinyl Chloride)
      summary: The industry standard for inflatable SUPs. Multi-layer laminated fabric offers excellent strength-to-weight ratio at an accessible price point.
      pros:
        - Excellent value for money
        - Lightweight and easy to handle
        - Good UV resistance with proper coatings
        - Wide range of colors and finishes
        - Easy to repair with PVC patches and solvent adhesive
      cons:
        - Typical lifespan of 7-10 years with proper care
        - Less flexible in cold temperatures
        - Lower chemical resistance
        - Can develop plasticizer migration over time
      best_for: Recreational and touring SUPs, family paddling, seasonal use, freshwater and coastal environments.
    - name: Drop-Stitch Core
      summary: The technology that revolutionized inflatable SUPs. Thousands of polyester threads connect the top and bottom fabric layers, allowing high-pressure inflation for rigid, hard-shell performance.
      pros:
        - Extremely rigid at 12-20 PSI
        - Lightweight — 18-30 lbs for full-size board
        - Folds flat for storage and travel
        - Excellent impact resistance
        - Consistent performance across temperature ranges
      cons:
        - Requires high-pressure pump
        - Puncture repair more complex than single-layer
        - Higher manufacturing cost than standard inflatables
        - Pressure loss over time requires periodic topping up
      best_for: Stand-up paddle boards and any gear that needs rigid performance with inflatable portability.
    - name: EVA Foam Deck
      summary: Closed-cell EVA (ethylene-vinyl acetate) foam used for traction pads on SUP boards. Provides cushioning, grip, and thermal insulation — and carries the art-series designs.
      pros:
        - Excellent non-slip grip wet or dry
        - Cushioning reduces fatigue on long paddles
        - Thermal insulation from cold deck surface
        - UV and saltwater resistant
        - Available in multi-color block piecing and laser-engraved designs
      cons:
        - Can wear with heavy use over 2-3 years
        - Must be properly bonded to prevent delamination
        - Not structural — does not affect rigidity
        - Adds slight weight (200-400 g per board)
      best_for: SUP deck traction, art-series deck designs, and any surface needing slip-resistant footing.
  selection:
    title: Material Selection Guide
    subtitle: 'Choose the right material based on your primary use case:'
    headers:
      - Use Case
      - Recommended Material
      - Why
    rows:
      - - Recreational SUP paddling
        - Drop-stitch PVC
        - Lightweight, rigid, affordable — ideal balance for casual paddlers
      - - Family & beginner paddling
        - Wide drop-stitch PVC (32"+)
        - Stable and forgiving — confidence for first-time paddlers
      - - Fishing & gear-heavy paddling
        - Wide drop-stitch PVC with full EVA deck
        - Extra stability for standing and casting, high volume for tackle
      - - Rental fleet SUP boards
        - Drop-stitch PVC + EVA deck
        - Durable, repairable, good value for high-turnover usage
      - - Touring & longer paddles
        - Drop-stitch PVC (~11 ft)
        - Better tracking and glide efficiency for distance
      - - Yoga & fitness paddling
        - Wide drop-stitch PVC with full EVA deck
        - Stable, comfortable platform for poses and workouts
