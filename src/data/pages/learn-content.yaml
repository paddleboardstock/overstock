materials:
  intro_p1: The performance, durability, and safety of an inflatable watercraft depend almost entirely on the materials used in its construction. From the fabric that forms the tubes to the threads that give a SUP board its rigidity, every material choice affects how the product performs on the water and how long it lasts.
  intro_p2: 'This guide covers the four core materials used in modern inflatable watercraft: PVC fabric, Hypalon CSM rubber, drop-stitch core construction, and EVA foam decking. Understanding these materials will help you choose the right product for your needs and maintain it for maximum lifespan.'
  labels:
    advantages: Advantages
    limitations: Limitations
    best_for: 'Best for:'
  items:
    - name: PVC (Polyvinyl Chloride)
      summary: The industry standard for recreational inflatable boats and SUPs. Multi-layer laminated fabric offers excellent strength-to-weight ratio at an accessible price point.
      pros:
        - Affordable — 30-50% cheaper than Hypalon
        - Lightweight and easy to handle
        - Good UV resistance with proper coatings
        - Wide range of colors and finishes
        - Easy to repair with PVC patches and solvent adhesive
      cons:
        - Shorter lifespan than Hypalon (7-10 years)
        - Less flexible in cold temperatures
        - Lower chemical resistance
        - Can develop plasticizer migration over time
      best_for: Recreational SUPs, budget-friendly boats, rental fleets, seasonal use, freshwater and coastal environments.
    - name: Hypalon (CSM Rubber)
      summary: Premium synthetic rubber material known for exceptional durability, UV resistance, and longevity. The gold standard for commercial and military-grade inflatable boats.
      pros:
        - Exceptional UV and ozone resistance
        - Lifespan of 15-20 years with proper care
        - Excellent cold-weather flexibility
        - Superior chemical and oil resistance
        - Retains color longer than PVC
      cons:
        - Significantly more expensive than PVC
        - Heavier fabric weight
        - Fewer color options
        - Repairs require specialized adhesives
        - Fewer manufacturing facilities worldwide
      best_for: Commercial RIBs, search and rescue, military applications, tropical climates, long-term fleet ownership.
    - name: Drop-Stitch Core
      summary: The technology that revolutionized inflatable SUPs. Thousands of polyester threads connect the top and bottom fabric layers, allowing high-pressure inflation for rigid, hard-shell performance.
      pros:
        - Extremely rigid at 12-20 PSI
        - Lightweight — 18-30 lbs for full-size board
        - Folds flat for storage and travel
        - Excellent impact resistance
        - Consistent performance across temperature ranges
      cons:
        - Requires high-pressure pump
        - Puncture repair more complex than single-layer
        - Higher manufacturing cost than standard inflatables
        - Pressure loss over time requires periodic topping up
      best_for: Stand-up paddle boards, kayaks, air decks for inflatable boats, any application requiring rigid performance with inflatable portability.
    - name: EVA Foam Deck
      summary: Closed-cell EVA (ethylene-vinyl acetate) foam used for traction pads on SUP boards and boat decks. Provides cushioning, grip, and thermal insulation.
      pros:
        - Excellent non-slip grip wet or dry
        - Cushioning reduces fatigue on long paddles
        - Thermal insulation from cold deck surface
        - UV and saltwater resistant
        - Available in multi-color block piecing and laser-engraved designs
      cons:
        - Can wear with heavy use over 2-3 years
        - Must be properly bonded to prevent delamination
        - Not structural — does not affect rigidity
        - Adds slight weight (200-400 g per board)
      best_for: SUP deck traction, boat deck padding, kayak seat comfort, any surface requiring slip-resistant footing.
  selection:
    title: Material Selection Guide
    subtitle: 'Choose the right material based on your primary use case:'
    headers:
      - Use Case
      - Recommended Material
      - Why
    rows:
      - - Recreational SUP paddling
        - Drop-stitch PVC
        - Lightweight, rigid, affordable — ideal balance for casual paddlers
      - - Family dinghy / lake boat
        - PVC (1100 denier)
        - Cost-effective, easy to repair, sufficient durability for recreational use
      - - Commercial RIB / patrol boat
        - Hypalon CSM
        - Maximum UV resistance, 15-20 year lifespan, chemical/oil resistance
      - - Rental fleet SUP boards
        - Drop-stitch PVC + EVA deck
        - Durable, repairable, good value for high-turnover usage
      - - Search & rescue operations
        - Hypalon CSM
        - Reliability in extreme conditions, cold flexibility, chemical resistance
      - - Touring / expedition kayak
        - Drop-stitch PVC
        - Rigid performance with packable portability for travel
