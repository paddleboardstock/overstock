hero:
  tagline: Marine Expertise
  title: 'Decades of Marine Engineering<br />in Every Hull'
  subtitle: 'Paddle Board Overstock combines deep material science, precision manufacturing, and real-world testing to produce watercraft that perform when it matters.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock marine engineering and R&D team at work
expertise_materials:
  tagline: Material Science
  title: 'Choosing the Right Material<br />for Every Application'
  subtitle: 'We work with three core materials — each selected for specific use cases and performance requirements.'
  columns: 3
  items:
    - title: Marine-Grade PVC
      description: '1100 denier PVC fabric — our most versatile material. UV-stabilized, abrasion-resistant, and REACH compliant. Ideal for recreational boats, SUP boards, and kayaks where weight and cost efficiency matter.'
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: 'Superior chemical resistance and UV stability. Hypalon boats can last 15-20 years with proper care. Recommended for commercial, rescue, and military applications where long-term durability is critical.'
      icon: tabler:shield
    - title: Fiberglass & Aluminum
      description: 'Deep-V fiberglass hulls for RIBs and patrol boats — wave-slicing performance in rough conditions. Aluminum hulls for heavy-duty commercial workboats requiring maximum strength and load capacity.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Manufacturing Capabilities
  title: 'Precision Manufacturing<br />at Every Step'
  subtitle: 'Our 12,000 m² facility is equipped with specialized machinery for every stage of production.'
  columns: 2
  items:
    - title: CNC Cutting
      description: 'Computer-controlled cutting ensures precise, repeatable fabric panels with minimal waste. Every piece fits exactly as designed.'
      icon: tabler:cpu
    - title: High-Frequency Welding
      description: 'Industrial HF welding creates seams stronger than the base material. Consistent temperature and pressure control ensures air-tight seals across every production run.'
      icon: tabler:bolt
    - title: Drop Stitch Core Assembly
      description: 'Thousands of polyester threads connect top and bottom fabric layers, allowing high-pressure inflation (15-20 PSI) for rigid, stable SUP boards and floors.'
      icon: tabler:building-arch
    - title: Pressure Testing
      description: 'Every inflatable product is pressure-tested before shipping. RIB tubes are tested at 1.25x rated pressure — if it holds there, it will perform on the water.'
      icon: tabler:wind
    - title: Seam Strength Testing
      description: 'Random samples from each production batch undergo destructive seam strength testing. Results are logged and traceable to specific production runs.'
      icon: tabler:files
    - title: Water Testing
      description: 'Every RIB model undergoes sea trials before certification. Real-world testing in coastal conditions validates performance, handling, and stability.'
      icon: tabler:ripple
expertise_design:
  tagline: Design & Engineering
  title: 'Engineered for Real Conditions'
  subtitle: 'Our design philosophy starts with how the boat will be used — then builds the engineering around that use case.'
  items:
    - title: Deep-V Hull Design
      description: "Our fiberglass hulls feature calculated deadrise angles optimized for each model's length and intended use. Steeper V for rough-water performance, shallower for stability."
    - title: Multi-Chamber Safety
      description: 'Every boat features 3-7 independent air chambers. If one compartment is compromised, the remaining chambers keep the boat afloat and operational.'
    - title: Ergonomic Layout
      description: 'Console position, tube height, and seat placement are designed around operator comfort during extended use — whether patrolling, fishing, or transporting.'
    - title: Custom Configuration
      description: 'Tube colors, console configuration, fuel capacity, accessory mounts — each model can be customized to match specific operational requirements.'
cta:
  title: 'Have a specific application in mind?'
  subtitle: 'Our engineering team can advise on material selection, design, and manufacturing for your project.'
  actions:
    - variant: primary
      text: Ask our engineers
      href: /contact
    - text: View product range
      href: /products
