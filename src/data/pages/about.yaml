hero:
  tagline: About us
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock factory and workshop
  title: |
    About <span class="text-accent dark:text-white">Paddle Board Overstock</span>
  subtitle: "Brand-new inflatable SUP boards at overstock and clearance prices — backed by our own Weihai manufacturing since 2012, mixed-model wholesale for small retailers, and flexible worldwide shipping."
stats:
  title: By the numbers
  columns: 4
  stats:
    - title: Annual production capacity
      amount: 15,000 units
    - title: Countries shipped
      amount: 50+
    - title: Boards pressure-tested
      amount: 100%
    - title: R&D engineers
      amount: 14+
features3_what_we_build:
  title: What we build
  subtitle: A focused product line that we know inside out — no half-finished experiments, no badge-engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: Inflatable SUP boards
      description: All-around and touring SUPs from 10' to 12 ft. Stable, rigid, and complete with pump, paddle, and leash.
      icon: tabler:swimming
    - title: Art series decks
      description: Signature EVA deck artwork — Cheetah Surge, Tropical Breeze, Medusa Glow, and more.
      icon: tabler:hexagons
    - title: Complete packages
      description: "Every board ships as a full kit: board, backpack, pump, paddle, fin, leash, and repair kit."
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Accessories
      description: Pumps, paddles, leashes, repair kits, and dry-bags. All matched to our boards.
      icon: tabler:tool
    - title: Care & repair
      description: In-house repair support, spare parts, and maintenance guidance to keep your board on the water for years.
      icon: tabler:settings
    - title: Club & rental fleets
      description: Bulk outfitting for clubs, schools, and rental fleets with direct factory support.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Board design and engineering discussion
steps2_values:
  title: Our values
  subtitle: Three principles that have shaped every product since day one.
  items:
    - title: Build like it carries your family
      description: Every board, seam, and valve is treated as if our own families will use it.
      icon: tabler:heart
    - title: Engineer before we sell
      description: If a spec is wrong, we change the spec — never the customer.
      icon: tabler:settings
    - title: Support that outlasts the warranty
      description: Boards we built years ago still call us for spare parts, and we still pick up.
      icon: tabler:headset
steps2_milestones:
  title: Milestones
  subtitle: A short version of the Paddle Board Overstock story.
  isReversed: true
  items:
    - title: Founded in Weihai
      description: A coastal workshop dedicated to drop-stitch inflatable SUP boards.
      icon: tabler:building-factory
    - title: 12,000 m² production campus
      description: Expanded to a dedicated facility with RF welding and drop-stitch production capacity.
      icon: tabler:circle-check
    - title: International export programme
      description: Now shipping to 50+ countries with express and sea freight options.
      icon: tabler:world
    - title: Overstock & wholesale focus
      description: In September 2026, brand operations moved from Qingdao Vatrad Group to Weihai Dongjilian Co., Ltd.; the Weihai manufacturing hub continues R&D, production, and factory-direct shipping.
      icon: tabler:building-skyscraper
features2_locations:
  title: Our locations
  tagline: Find us
  columns: 3
  items:
    - title: Headquarters & workshop
      description: Coastal industrial park, building 4 — open Mon–Fri for visits by appointment.
    - title: EU service centre
      description: Mediterranean port — refit, repair and warranty support for European customers.
    - title: APAC partner network
      description: Authorised service partners in Australia, Japan, Singapore and Hong Kong.
brand_hub_tagline: Brand
brand_hub_title: Explore Our Brand
brand_hub_subtitle: Dive deeper into our marine engineering expertise, global presence, and the principles that drive us.
brand_hub_cards:
  - title: Marine Expertise
    desc: Decades of material science, precision manufacturing, and real-world testing — from drop-stitch cores to welded seams and art-series decks.
    link: /brand-marine-expertise
    link_label: Learn more →
  - title: Why Paddle Board Overstock
    desc: Factory-direct pricing, 100% pressure-tested boards, and a 2-year warranty — built for paddlers, families, and water sports lovers.
    link: /brand-why-paddleboardoverstock
    link_label: Learn more →
