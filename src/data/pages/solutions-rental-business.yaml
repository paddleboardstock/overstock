content_segments:
  tagline: Rental Profiles
  title: 'Water Sports Rental Solutions<br />By Operator Type'
  subtitle: 'Different rental operations have different needs — from small beachside SUP rentals to large-scale resort water sports centers. We tailor our equipment packages and support model accordingly.'
  items:
    - title: Beach & Lakeside SUP Rentals
      subtitle: High-volume, low-complexity operations
      description: 'Operators renting stand-up paddle boards and kayaks directly to beachgoers and lake visitors. Your priority is minimizing turnaround time between rentals, keeping equipment in rotation, and managing seasonal demand spikes with a small storage footprint.'
      features:
        - 'Inflatable SUP fleets that pack flat — no dock or trailer needed'
        - 'Commercial-grade PVC rated for 100+ rental cycles per season'
        - 'Quick-dry, UV-resistant fabric for same-day re-rental readiness'
        - 'Color-coded board ranges for easy fleet identification'
    - title: Resort & Hotel Water Sports Centers
      subtitle: Guest experience and brand alignment
      description: "Resorts and hotels offering water sports as an on-site amenity. Equipment needs to look premium, perform reliably across beginner-to-intermediate guests, and integrate with the resort's existing activity booking and billing workflows."
      features:
        - 'Custom-branded SUP boards and life vests matching resort colors'
        - 'Mixed fleet: SUPs, kayaks, pedal boats, and small RIB tenders'
        - 'Quiet, fuel-free electric pump solutions for on-beach inflation'
        - 'Staff training and maintenance onboarding included'
    - title: Boat & RIB Rental Operators
      subtitle: Commercial-grade vessel rental fleets
      description: 'Operators renting powered vessels — RIB tenders, inflatable boats, and small runabouts — by the hour or half-day. Your fleet must meet marine safety regulations, withstand heavy guest use, and minimize mechanical downtime between charters.'
      features:
        - 'RIB packages with 30–90 HP outboard-ready transoms'
        - 'Marine-grade plywood floor panels for long-term structural integrity'
        - 'Quick-launch valve systems for faster turnover'
        - 'Spare parts kit + on-call technical support SLA'
    - title: Tour & Adventure Operators
      subtitle: Guided excursion fleets
      description: 'Operators running guided water sports tours — SUP safaris, cave kayaking, snorkeling excursions, or island-hopping RIB tours. Equipment must be stable enough for novice tour guests, quick to clean between groups, and durable enough for daily guided use in diverse water conditions.'
      features:
        - 'Extra-stable SUP platforms (32" wide+) for first-time riders'
        - 'Tandem kayak options for couple/group tour configurations'
        - 'Built-in cargo capacity for snorkel gear, dry bags, and coolers'
        - 'CE + USCG compliance documentation for commercial operations'

