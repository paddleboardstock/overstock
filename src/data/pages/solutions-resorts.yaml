content_segments:
  tagline: Resort Profiles
  title: 'Waterfront Hospitality Solutions<br />By Property Type'
  subtitle: 'Every resort property has a unique guest profile, activity mix, and operational rhythm — from boutique eco-lodges to sprawling luxury beachfront resorts. We design water sports programs that match the property class and guest expectations.'
  items:
    - title: Beachfront Luxury Resorts
      subtitle: 'VIP transfers, water activities, premium guest experience'
      description: "High-end beachfront properties — Four Seasons, Aman, and similar luxury groups — where water sports are a marquee guest amenity driving satisfaction scores and ancillary revenue. The fleet must look premium, offer variety across age groups and ability levels, and integrate seamlessly with the resort's existing concierge and booking systems. Guest appearance expectations are extremely high — equipment condition and presentation directly affects 5-star reviews."
      features:
        - 'Premium branded fleet: SUPs, kayaks, pedal boats, and small RIB tenders'
        - 'Guest-ready presentation: matching resort colors, logo branding, staged equipment display'
        - 'Small luxury RIB for VIP guest transfers with custom upholstery and color matching'
        - 'Integrated safety infrastructure: buoy lines, lifeguard stations, AED'
        - 'Revenue management: dynamic pricing templates, upsell training, package bundling'
    - title: Private Island Resorts
      subtitle: 'All-weather guest transport — zero downtime, absolute reliability'
      description: 'Private island resorts operate in remote locations where the boat is the only connection to the mainland. Daily guest transfers, supply runs, and emergency medical evacuations depend on a single vessel — any downtime directly impacts the guest experience and resort operations. These operators need a boat that runs reliably in all weather conditions, requires minimal maintenance, and has backup systems for mission-critical dependability. The boat must also present beautifully as guests arrive at the island.'
      features:
        - 'All-weather RIB configuration with full weather enclosure and heavy-duty tubes'
        - 'Twin-engine or backup engine provision for zero-downtime operations'
        - 'Commercial-grade Hypalon construction for 5-8 year lifespan in remote service'
        - 'Easy-maintenance design with accessible components for on-site servicing'
        - 'Custom resort branding and premium upholstery matching island aesthetics'
    - title: Lakeside & Eco Resorts
      subtitle: Nature-integrated guest experiences
      description: 'Lakeside properties, eco-lodges, and nature retreats offering quiet, low-impact water activities that complement the natural environment. Equipment should be non-motorized where possible, easy to store in limited-space boathouses, and quiet in use to preserve the ambient experience for all guests.'
      features:
        - 'Non-motorized fleet: SUPs, kayaks, canoes, and paddle boats'
        - 'Quiet electric pump inflation stations for on-demand guest use'
        - 'Eco-friendly materials and packaging aligned with sustainability branding'
        - 'Storage racks and boathouse organization systems included'
    - title: Beach Clubs
      subtitle: 'Guest transfers, entertainment, small luxury RIBs'
      description: 'Beach clubs operate a high-energy, visually-focused environment where equipment is part of the atmosphere. They need small luxury RIBs for guest transfers from nearby hotels or docks, and water toys for guest entertainment — jet ski towing, inflatable slides, and paddle boards. The fleet must look stylish, be easy to operate, and withstand daily use by guests with varying skill levels. Storage and quick deployment are critical during peak hours.'
      features:
        - 'Compact luxury RIB (3.3-4.3m) for guest transfers and tender service'
        - 'Water toys: towable inflatables, SUP boards, kayaks for guest entertainment'
        - 'Custom color and branding matching beach club visual identity'
        - 'Quick-launch and retrieval systems for high-turnover operations'
        - 'Durable Hypalon construction for daily saltwater exposure and UV'
    - title: Private Members Clubs & Yacht Clubs
      subtitle: 'Harbor transport, member tenders, exclusive water sports'
      description: 'Private clubs where water sports and boat transport are a member benefit rather than a revenue driver. Equipment must meet higher aesthetic standards, be available on demand for members, and require minimal staff supervision. Marina yacht clubs specifically need tenders for harbor transport — moving members between dock, mooring, and shore. Storage and maintenance should be invisible to members.'
      features:
        - 'High-end RIB tenders for harbor transport and member transfer service'
        - 'Premium equipment: EVA decks, custom member colors, branded upholstery'
        - 'Self-service check-out system for member access without staff'
        - 'Off-season storage and annual refresh program'
    - title: Adventure & Activity-Focused Hotels
      subtitle: 'Guided tours, SUP yoga, snorkeling excursions, group activities'
      description: 'Properties positioning themselves as adventure destinations — offering guided tours, SUP yoga, sunset paddles, snorkeling excursions, and group activities. The fleet needs to support both free rental and guided program models, with equipment that transitions seamlessly between guest self-use and instructor-led tours. These properties need durable equipment for high-frequency turnover, with easy cleaning between guest groups.'
      features:
        - 'Versatile mixed fleet supporting rental + guided tour models'
        - 'Tandem kayaks and extra-stable SUP platforms for group activities'
        - 'Guide equipment: instructor boards, dry boxes, waterproof comms'
        - 'Seasonal equipment rotation: summer fleet → winter storage program'
        - 'Durable construction rated for daily guest use with minimal maintenance'

