testimonial:
  content: Paddle Board Overstock designed and equipped our entire beach activity program across three resort properties. 120 SUPs, safety infrastructure, and staff training — all delivered in one shipment. Our guest participation in water activities increased by 60% in the first season.
  name: Sophie Laurent
  title: Director of Guest Experience, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Resort Profiles
  title: Waterfront Hospitality Solutions<br />By Property Type
  subtitle: Every resort property has a unique guest profile, activity mix, and operational rhythm — from boutique eco-lodges to sprawling luxury beachfront resorts. We design water sports programs that match the property class and guest expectations.
  items:
    - title: Beachfront Luxury Resorts
      subtitle: VIP transfers, water activities, premium guest experience
      description: High-end beachfront properties — Four Seasons, Aman, and similar luxury groups — where water sports are a marquee guest amenity driving satisfaction scores and ancillary revenue. The fleet must look premium, offer variety across age groups and ability levels, and integrate seamlessly with the resort's existing concierge and booking systems. Guest appearance expectations are extremely high — equipment condition and presentation directly affects 5-star reviews.
      features:
        - Premium branded fleet of SUPs in matching resort colors
        - "Guest-ready presentation: matching resort colors, logo branding, staged equipment display"
        - Signature art-series boards for premium guest experiences and photo moments
        - "Integrated safety infrastructure: buoy lines, lifeguard stations, AED"
        - "Revenue management: dynamic pricing templates, upsell training, package bundling"
    - title: Private Island Resorts
      subtitle: Quiet, self-sufficient guest water activities
      description: "Private island resorts operate in remote locations where logistics are complex and every delivery counts. Guest water activities need to be self-sufficient: equipment that stores compactly, inflates on demand, requires minimal maintenance, and presents beautifully as guests arrive. We plan fleet programs around seaplane and sea freight windows, and our durable construction keeps equipment guest-ready across long seasons without mainland support."
      features:
        - Compact inflatable fleet — ships and stores efficiently on remote islands
        - Commercial-grade PVC construction for multi-season guest use
        - Easy on-site maintenance with included repair kits and video guidance
        - Custom resort branding matching island aesthetics
    - title: Lakeside & Eco Resorts
      subtitle: Nature-integrated guest experiences
      description: Lakeside properties, eco-lodges, and nature retreats offering quiet, low-impact water activities that complement the natural environment. Equipment should be non-motorized where possible, easy to store where space is limited, and quiet in use to preserve the ambient experience for all guests.
      features:
        - Non-motorized SUP fleet in nature-inspired art series
        - Quiet electric pump inflation stations for on-demand guest use
        - Eco-friendly materials and packaging aligned with sustainability branding
        - Storage racks and dockside organization systems included
    - title: Beach Clubs
      subtitle: Guest entertainment and waterfront atmosphere
      description: Beach clubs operate a high-energy, visually-focused environment where equipment is part of the atmosphere. They need stylish paddle boards for guest entertainment, SUP rentals for beachside activities, and equipment that looks as good as the venue itself. The fleet must be easy to operate, withstand daily use by guests with varying skill levels, and deploy quickly during peak hours.
      features:
        - Signature art-series SUPs that double as venue décor
        - Rental-ready SUP fleet for guest entertainment
        - Custom color and branding matching beach club visual identity
        - Quick-launch and retrieval systems for high-turnover operations
        - UV-resistant construction for daily saltwater exposure
    - title: Private Members Clubs & Yacht Clubs
      subtitle: Member water sports and exclusive paddling programs
      description: Private clubs where water sports are a member benefit rather than a revenue driver. Equipment must meet higher aesthetic standards, be available on demand for members, and require minimal staff supervision. Marina yacht clubs use branded SUP fleets for member recreation around the harbor. Storage and maintenance should be invisible to members.
      features:
        - Premium branded SUP fleets for member water sports
        - "Premium equipment: EVA decks, custom member colors, branded upholstery"
        - Self-service check-out system for member access without staff
        - Off-season storage and annual refresh program
    - title: Adventure & Activity-Focused Hotels
      subtitle: Guided tours, SUP yoga, snorkeling excursions, group activities
      description: Properties positioning themselves as adventure destinations — offering guided tours, SUP yoga, sunset paddles, snorkeling excursions, and group activities. The fleet needs to support both free rental and guided program models, with equipment that transitions seamlessly between guest self-use and instructor-led tours. These properties need durable equipment for high-frequency turnover, with easy cleaning between guest groups.
      features:
        - Versatile mixed fleet supporting rental + guided tour models
        - Extra-stable SUP platforms for group activities
        - "Guide equipment: instructor boards, dry boxes, waterproof comms"
        - "Seasonal equipment rotation: summer fleet → winter storage program"
        - Durable construction rated for daily guest use with minimal maintenance
