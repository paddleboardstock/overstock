testimonial:
  quote: What sold me was the construction. Fusion-welded seams instead of glue, a drop-stitch core that feels solid at 15 PSI, and no wobble when I step back to turn. Two years in, zero issues.
  author: Marta Keller
  title: Verified buyer
  company: Lake touring paddler
  location: Germany
sections:
  - title: Drop-Stitch Core
    standard: 12-15 PSI operating pressure
    description: Thousands of internal polyester threads connect the top and bottom layers, creating a rigid structure at 12-15 PSI. This is the same technology used in professional paddle boards. Our drop-stitch density is optimized per model for the ideal balance of rigidity and weight.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS Core Diagram
  - title: Marine-Grade PVC
    standard: Fusion-welded | UV / saltwater / abrasion tested
    description: Multi-layer laminated PVC fabric rated for marine environments. Each layer is fusion-welded rather than glued, eliminating delamination risks. Tested for UV resistance (1,000+ hours), saltwater corrosion, and abrasion.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC Layer
  - title: EVA Deck System
    standard: Grippy, comfortable, art-series patterns
    description: Full-deck EVA foam provides grip, cushioning, and the signature art-series look. Precision-cut panels are laid into seamless patterns — no printed graphics to scratch off, no wax needed.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: EVA Deck
  - title: Triple-Layer Rail System
    standard: Fusion bonded | Over-built at the highest-stress zone
    description: Rail bands are triple-layer fusion bonded and wrapped around the board's edge — the highest-stress zone on any inflatable. This is where cheap boards fail first; ours are over-built.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Rail System
