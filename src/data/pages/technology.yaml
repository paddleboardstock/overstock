sections:
  - title: Drop-Stitch Core
    standard: 12-15 PSI operating pressure
    description: Thousands of internal polyester threads connect the top and bottom layers, creating a rigid structure at 12-15 PSI. This is the same technology used in professional paddle boards and inflatable racing boats. Our drop-stitch density is optimized per model for the ideal balance of rigidity and weight.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS Core Diagram
  - title: Marine-Grade PVC
    standard: Fusion-welded | UV / saltwater / abrasion tested
    description: Multi-layer laminated PVC fabric rated for marine environments. Each layer is fusion-welded rather than glued, eliminating delamination risks. Tested for UV resistance (ASTM G154, 1,000+ hours), saltwater corrosion (ISO 9227), and abrasion (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC Layer
  - title: Hypalon Tubes
    standard: 'CSM rubber | UV / chemical / extreme-temp resistant'
    description: Used on RIB models, Hypalon (CSM) rubber provides superior UV and chemical resistance compared to standard PVC. Hypalon tubes maintain flexibility in extreme temperatures and resist degradation from fuel and oil exposure. All seams are hand-laid by certified technicians.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Air Deck Floor
    standard: High-pressure inflatable | Replaces plywood/aluminum
    description: High-pressure inflatable floor system replacing traditional plywood or aluminum slat floors. Reduces setup time, overall weight, and storage volume while providing adequate rigidity for standing, fishing, and walking. Tested to support 200+ kg distributed load.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Air Deck

