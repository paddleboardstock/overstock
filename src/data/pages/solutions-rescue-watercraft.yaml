content_challenge:
  tagline: The Challenge
  title: 'Rescue Operations Demand<br />Uncompromising Reliability'
  subtitle: 'Search and rescue organizations operate under extreme safety responsibility — every boat failure carries unacceptable consequences.'
  paragraphs:
    - 'In rescue operations, the margin between success and failure is measured in minutes. The boat must be ready to launch immediately, operate in rough conditions, and return safely with passengers. Safety responsibility is absolute — a mechanical failure during a rescue mission is not a repair cost, it is a life lost.'
    - 'SAR boats need high speed to reach victims quickly, combined with exceptional stability for safe recovery operations. They must carry rescue equipment, medical supplies, and communication gear — often in limited deck space. Boats operating in government service also need long service life (10-15+ years) to justify public procurement budgets.'
    - 'Visibility, both for the operator and for searching, is critical. Console design must provide 360-degree visibility, and the boat should be highly visible to aircraft and other vessels.'
    - 'Paddle Board Overstock rescue RIBs are engineered from the keel up for these requirements — with self-bailing decks, reinforced hulls, navigation suites, and tow posts standard on patrol models.'
content_solution:
  tagline: Our Solution
  title: 'Purpose-Built Rescue RIBs'
  subtitle: 'Every Paddle Board Overstock rescue boat is designed to meet or exceed SOLAS and national SAR standards.'
  list:
    - 'Self-bailing deck — water drains automatically for stability during recovery operations'
    - 'Reinforced deep-V hull — rough-water capability with predictable handling at speed'
    - 'Full navigation light suite — operational day and night in all weather conditions'
    - 'Tow post and tow line — ready for vessel tow or rescue sled operations'
    - 'Equipment mounting plates — radio, searchlight, siren, and medical equipment'
    - 'Multiple engine configurations — single outboard or twin-engine redundancy'
    - 'High-visibility tube colors — orange, yellow, or red for maximum visibility'
content_segments:
  tagline: Rescue Profiles
  title: 'Search & Rescue Watercraft Solutions<br />By Organization Type'
  subtitle: 'Different rescue organizations operate under different mandates, budget cycles, and operating environments — from coastal volunteer crews to national coast guard fleets. We configure every rescue RIB to match the mission profile.'
  items:
    - title: Coast Guard & Government SAR Agencies
      subtitle: 'Absolute safety responsibility — mission-critical fleet standards'
      description: 'Government SAR agencies carry the highest safety responsibility in maritime operations. Every boat must perform flawlessly in extreme conditions — equipment failure during a rescue mission is not an option. Procurement decisions are driven by total cost of ownership over 10-15 year service life, not upfront price. Agencies need vessels that survive years of coastal patrol, meet stringent national standards, and deliver consistent performance across distributed stations. Comprehensive compliance documentation and multi-year service agreements are mandatory.'
      features:
        - 'SOLAS and national SAR standards compliance documentation package'
        - 'Fleet-wide parts commonality — reduce station-level inventory complexity'
        - 'Twin-engine configuration for mission-critical redundancy'
        - '10-15 year service life design with scheduled maintenance programs'
        - 'All-weather capability — reinforced deep-V hull for rough sea states'
    - title: Lifeguard & Beach Rescue Services
      subtitle: Quick-launch, shallow-water operations
      description: 'Municipal and beach-front lifeguard services needing rapid-response vessels that can launch through surf zones, operate in shallow inshore waters, and reach swimmers or distressed craft within minutes. Equipment must be lightweight enough for beach towing by a small vehicle or manually.'
      features:
        - 'Shallow-draft RIB hull for surf zone and inshore operation'
        - 'Beach-launch capable with bow lifting handle and keel guard'
        - 'Integrated rescue sled or rescue swimmer platform'
        - 'High-visibility orange or yellow tube colors standard'
    - title: Fire Rescue Departments
      subtitle: 'Fire pump integration, equipment mounting, rapid response'
      description: 'Fire rescue marine units respond to waterfront structure fires, vessel fires, and water-based rescue incidents. These boats must carry fire pumps, monitors, hose storage, and breathing apparatus — all integrated into a stable, fast-response platform. Departments also use these vessels for flood response and mutual-aid operations. Console layouts must accommodate pump controls, radio systems, and emergency lighting without compromising deck space for crew movement.'
      features:
        - 'Bow-mounted fire monitor with pump integration package'
        - 'Dedicated equipment mounting for fire pump, hose storage, and BA sets'
        - 'Console layout configurable for pump controls, radio, and emergency lighting'
        - 'Self-bailing deck for firefighting water runoff and stability'
        - 'Night operations package: searchlight, scene lighting, blue/red light bar'
    - title: Marine Police & Port Security
      subtitle: 'Interdiction, patrol, boarding operations'
      description: 'Marine law enforcement units require vessels capable of high-speed pursuit, suspect vessel boarding, and port security patrol. These boats must have secure storage for enforcement gear and weapons, communication integration with shore command, and sufficient deck space for boarding team operations. Night operations capability and low-profile approach are essential for interdiction missions.'
      features:
        - 'High-speed pursuit capability — planing hull with 40+ knot top speed'
        - 'Secure weapon locker and enforcement gear storage compartments'
        - 'Console integration for police radio, MDT, and comms systems'
        - 'Night operations package: IR spotlight, FLIR mount, covert lighting'
        - 'Reinforced boarding platform with non-slip surface'
        - 'Blue/red emergency lighting and siren system'
    - title: Volunteer SAR & Non-Profit Organizations
      subtitle: Grant-funded, community-based coastal and lake operations
      description: 'Community-based rescue groups operate in lakes, rivers, and coastal areas where government SAR coverage is limited. Often funded by donations or government grants, these organizations need maximum capability per dollar — a reliable, low-maintenance vessel that volunteers can operate safely with minimal dedicated training. Grant procurement cycles mean boats must meet compliance requirements while staying within fixed budgets.'
      features:
        - 'Single-outboard configuration optimized for lower acquisition and operating cost'
        - 'PVC construction for lower maintenance and easy field repair'
        - 'Multi-function console minimizing electronic complexity for volunteer operators'
        - 'Grant-compliance documentation package for funding applications'
        - 'Lightweight design for beach launching without dedicated trailer or crane'
    - title: Flood Rescue & Disaster Response
      subtitle: 'Inland flooding, shallow water, debris-laden environments'
      description: 'Flood rescue is a distinct operational profile — boats operate in flooded urban areas, debris-filled currents, and extremely shallow water where submerged obstacles are invisible. Operators need vessels that can navigate flooded streets, push through debris, and extract victims from buildings and vehicles. Shallow-draft capability is critical, as is the ability to operate in current with snag hazards. These boats are often deployed by fire departments, civil defense, and disaster relief NGOs.'
      features:
        - 'Ultra-shallow draft hull — operate in 30-50 cm of water'
        - 'Debris-deflecting bow and reinforced tube protection for submerged obstacles'
        - 'Self-bailing deck for floodwater runoff and victim recovery'
        - 'High-visibility orange or yellow tubes for aerial reconnaissance visibility'
        - 'Lightweight design for helicopter transport and road deployment'
        - 'Reinforced lifting points for hoist and rope rescue operations'

