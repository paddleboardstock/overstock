stories:
  - title: How a Mediterranean Resort Built a Profitable SUP Rental Business
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5-star beach resort — Greece
    problem: The resort needed premium guest water activities to increase satisfaction scores and create a new revenue stream, but lacked equipment, safety infrastructure, and staff expertise.
    solution: Aquafarer delivered 50 custom-branded SUP boards with resort colors and logo, complete safety system including lifeguard station and buoy lines, and a 3-day staff training program covering equipment handling, guest instruction, and safety protocols.
    result:
      - '300+ weekly guest activities booked within the first month'
      - 'Guest satisfaction scores for water activities: 4.8/5'
      - 'New annual ancillary revenue: $180K'
      - 'Zero safety incidents in first operating season'
      - 'Equipment replacement cost reduced 40% vs previous supplier'
    quote:
      text: "Aquafarer didn't just deliver boards — they helped us build a complete guest experience. Our water sports program went from zero to resort highlight in one season."
      author: 'Resort General Manager'
    cta_text: Build Your Resort Solution
    cta_href: '/solutions/resorts'

  - title: How an Australian Startup Built a Water Brand in 90 Days
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: First-time entrepreneur — Australia
    problem: An outdoor enthusiast wanted to launch his own SUP brand for the Australian market but had no manufacturing experience, no supplier relationships, and limited capital.
    solution: Aquafarer's Brand Launch Package provided product selection consultation, custom logo and color design, branded retail packaging with hang tags, CE certification documentation, and FOB shipping to Sydney.
    result:
      - 'First shipment of 200 boards delivered in 75 days from first contact'
      - 'Brand launched on Shopify + Amazon AU within 2 weeks of arrival'
      - 'Initial inventory sold out in 45 days'
      - 'Average margin: 55% on retail pricing'
      - 'Second order: 500 units placed within 60 days of launch'
    quote:
      text: 'I had the brand idea but zero manufacturing knowledge. Aquafarer literally held my hand through the entire process — from picking the right board design to unboxing my first shipment. 90 days from dream to delivery.'
      author: 'Founder, Australian SUP Brand'
    cta_text: Launch Your Brand
    cta_href: '/solutions/entrepreneurs'

  - title: How a Thai Beach Club Scaled From 10 to 80 Boards
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Water sports club — Thailand
    problem: A small beachside SUP club in Phuket needed to scale from a hobby operation to a professional rental business serving tourists, but couldn't find a reliable equipment supplier with consistent quality and pricing.
    solution: Starting with Aquafarer's Club Starter Package (10 boards, paddles, safety gear, branding), the club grew through the Premium Package program over 18 months.
    result:
      - 'Scaled from 10 to 80 boards in 18 months with consistent quality and pricing'
      - 'Added kayak and pedal boat rentals using same supplier'
      - 'Custom club branding increased brand recognition among tourists'
      - 'Maintenance costs reduced 60% vs previous budget equipment'
      - 'Now serving 150+ daily rentals during peak season'
    quote:
      text: 'The Club Starter Package was the perfect entry point. As our business grew, Aquafarer grew with us — same quality, same pricing, no surprises.'
      author: 'Club Owner, Phuket'
    cta_text: Start Your Club Package
    cta_href: '/solutions/clubs'

  - title: How a Caribbean Resort Chain Standardized Water Sports Across 5 Properties
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Resort chain — Caribbean
    problem: A luxury resort chain with 5 properties needed consistent water sports equipment quality and branding across all locations, with centralized procurement and seasonal replacement planning.
    solution: Aquafarer delivered a multi-property fleet of 300 SUPs and 100 kayaks with unified branding, shared spare parts inventory, and annual replacement schedule with volume pricing.
    result:
      - 'Standardized guest experience across all 5 properties'
      - '30% cost reduction through consolidated purchasing and volume pricing'
      - 'Centralized spare parts inventory reduced downtime by 80%'
      - 'Annual equipment refresh program eliminated end-of-season scramble'
      - 'Guest water sports participation increased 45% year-over-year'
    cta_text: Design Your Resort Program
    cta_href: '/solutions/resorts'

