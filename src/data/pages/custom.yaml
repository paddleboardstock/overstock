hero:
  tagline: Aquafarer Custom Lab
  title: Design Your Own<br />Watercraft
  subtitle: OEM, ODM, private label, and custom branding services for businesses worldwide. From a single prototype to full production runs.
  cta: Start your project
  footer_link: /contact

steps_section:
  tagline: How it works
  title: From concept to production
  subtitle: Four steps from your idea to a finished, sea-ready product.
  steps:
    - num: '01'
      title: Choose Your Board
      desc: Select from our core models — SUP, kayak, dinghy, or RIB. Pick size, material, and colour.
    - num: '02'
      title: Upload Your Design
      desc: Send us your logo, artwork, or brand guidelines. Our design team prepares a digital proof.
    - num: '03'
      title: AI Mockup Review
      desc: View a photorealistic AI-generated mockup of your custom board before production begins.
    - num: '04'
      title: Production & Delivery
      desc: Once approved, your order enters our ISO-certified production line. Lead times from 30 days.

services_section:
  tagline: Services
  title: Manufacturing services for global brands
  subtitle: Flexible engagement models — from contract manufacturing to full-service brand building.
  items:
    - title: OEM Manufacturing
      desc: We produce your designs to spec — your IP, your drawings, your quality standards. Full NDA protection.
      icon: ⚙️
    - title: ODM Solutions
      desc: Choose from 50+ proven platforms and customise size, colour, graphics, and packaging.
      icon: '🎨'
    - title: Private Label
      desc: Your brand on our products — logo, packaging, hang tags, manuals. Retail-ready out of the box.
      icon: 🏷️
    - title: Custom Branding
      desc: Deck pad printing, hull graphics, tube decals, and custom labels — full brand integration.
      icon: ✨

capabilities_section:
  tagline: Capabilities
  title: Production & customisation capabilities
  subtitle: Everything you need to know before placing your order.
  capabilities:
    - label: Order volume
      value: MOQ 5–10 units (SUP/kayak), 2–5 units (RIB)
    - label: Lead time
      value: 30–45 days standard; 15–20 days for prototypes
    - label: Customisation
      value: Size, shape, colour, graphics, packaging, hardware
    - label: Materials
      value: PVC, Hypalon, drop-stitch, fiberglass, aluminium
    - label: Printing
      value: Digital (CMYK), screen printing, heat transfer, sublimation
    - label: Certification
      value: CE, ISO 9001, BSCI, UKCA (support for global compliance)

why_section:
  tagline: Why Aquafarer
  title: One factory. One standard. Zero compromises.
  points:
    - text: 12,000 sqm integrated manufacturing facility
      highlight: 12,000 sqm
    - text: 200-300 skilled workers and engineers
      highlight: 200-300
    - text: 15,000 boats produced annually
      highlight: 15,000
    - text: ISO 9001 certified quality management
      highlight: ISO 9001
    - text: CE certified products for EU market
      highlight: CE
  cta: View factory details
  cta_link: /factory
  contact:
    title: Ready to discuss your project?
    desc: Our team responds within 24 hours with a preliminary quote.
