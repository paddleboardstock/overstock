hero:
  tagline: Guides
  title: New to SUP?
  subtitle: Practical guides to help you choose, use, and enjoy inflatable water sports equipment.

size_guide:
  tagline: Size & Specs
  title: Find the Right Size for Your Needs
  desc: Compare product dimensions, weight capacities, and recommended uses. Whether you need a touring SUP, a compact kayak, or a commercial RIB — our size guide helps you choose the right fit.
  link_label: 'Full size guide with product specs →'
  link: /size-guide
  cards:
    - title: SUP Boards
      desc: Choose length based on your weight and intended use. Wider boards (32"+) offer more stability. Longer boards (11–12 ft) track better for touring.
    - title: Kayaks
      desc: Single kayaks (9 ft) for solo travel and rivers. Tandem kayaks (12 ft) for two paddlers or one with gear. Always check weight capacity.
    - title: Dinghies & RIBs
      desc: Choose length by passenger count and use. Larger RIBs (4.5 m+) for offshore and rescue. Smaller dinghies (2.7 m) as tenders and fishing platforms.
