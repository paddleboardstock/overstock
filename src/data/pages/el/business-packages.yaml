faq:
  title: Συχνές ερωτήσεις για το πακέτο
  questions:
    - q: Ποια είναι η ελάχιστη ποσότητα παραγγελίας για πακέτα;
      a: Το πακέτο Club Starter έχει τουλάχιστον 10 μονάδες. Τα πακέτα Resort και Brand προσαρμόζονται στις ανάγκες σας με ευέλικτα MOQ.
    - q: Πόσος χρόνος διαρκεί η παράδοση;
      a: Η τυπική παραγωγή είναι 30–45 ημέρες από την επιβεβαίωση της παραγγελίας. Η ταχεία παραγωγή είναι διαθέσιμη με επιπλέον χρέωση.
    - q: Μπορώ να προσαρμόσω τα χρώματα και την επωνυμία του εξοπλισμού;
      a: Ναί. Όλα τα πακέτα περιλαμβάνουν πλήρη προσαρμογή — χρώματα σανίδων, εκτυπώσεις λογότυπων και σχεδιασμό συσκευασίας.
    - q: Παρέχετε υποστήριξη μετά την πώληση;
      a: Ναί. Κάθε πακέτο περιλαμβάνει πρόσβαση στους διαδικτυακούς μας οδηγούς συντήρησης, εκπαιδευτικά βίντεο και σύστημα παραγγελιών ανταλλακτικών.
