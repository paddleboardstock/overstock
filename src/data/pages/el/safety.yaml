hero:
  tagline: Ασφάλεια
  title: Πρότυπα Ασφαλείας και Πιστοποίηση
  subtitle: Κάθε προϊόν Paddle Board Overstock υποβάλλεται σε αυστηρές δοκιμές και 64 μοντέλα με πιστοποίηση CE πληρούν τα διεθνή πρότυπα ασφαλείας για ψυχαγωγική και επαγγελματική χρήση. Εργοστάσιο πιστοποιημένο ISO 9001.
