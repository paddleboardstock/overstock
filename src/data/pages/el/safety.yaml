certifications:
  - title: Πιστοποίηση CE (ΕΕ 2016/425)
    standard: Κανονισμός ΠΜΕ (ΕΕ) 2016/425 | EN ISO 12402
    description: Όλος ο εξοπλισμός ασφαλείας Paddle Board Overstock συμμορφώνεται με τις απαιτήσεις σήμανσης CE σύμφωνα με τον Ευρωπαϊκό Κανονισμό για τα Μέσα Ατομικής Προστασίας. Κάθε προϊόν δοκιμάζεται ανεξάρτητα από την TÜV Rheinland, ευρωπαϊκό οργανισμό κοινοποίησης. Τα φουσκωτά σκάφη και τα RIB μας πληρούν τις απαιτήσεις των κατηγοριών C και D της Οδηγίας Σκαφών Αναψυχής 2013/53/ΕΕ (RCD).
    body: Η πιστοποίηση CE καλύπτει τις βασικές απαιτήσεις υγείας και ασφάλειας για μέτρα ατομικής πλεύσης και φουσκωτά σκάφη. Η TÜV Rheinland ελέγχει ετησίως τη μονάδα παραγωγής μας για να επιβεβαιώνει τη συνεχή συμμόρφωση.
  - title: SOLAS — ασφάλεια της ζωής στη θάλασσα
    standard: SOLAS Κεφάλαιο III | Κώδικας LSA
    description: Το Life Vest Pro συμμορφώνεται με τους κανονισμούς SOLAS για υπεράκτιες και εμπορικές θαλάσσιες επιχειρήσεις. Δοκιμασμένο για διατήρηση επάρκειας πλεύσης επί 24 ώρες, αυτόματο φούσκωμα κατά την βύθιση και απόδοση σε καταστάσεις θάλασσας έως ένταση 5. Πληροί τις απαιτήσεις του Κεφαλαίου III για σωσίβια σε εμπορικά σκάφη.
    body: Η έγκριση SOLAS απαιτεί ανεξάρτητες δοκιμές από οργανισμό κοινοποίησης για επάρκεια πλεύσης, αντοχή, ορατότητα και αυτόματη ενεργοποίηση. Το Life Vest Pro έχει πλήρη έγκριση τύπου SOLAS με πιστοποίηση MED.
  - title: USCG Τύπου III / Τύπου V
    standard: 46 CFR Μέρος 160 | Έγκριση USCG
    description: Επιλεγμένα σωσίβια Paddle Board Overstock πληρούν την ταξινόμηση του Λιμενικού Σώματος των Ηνωμένων Πολιτειών για συσκευές τύπου III (βοήθημα πλεύσης) και τύπου V (ειδική χρήση). Κατάλληλα για προστατευμένα ύδατα, παράκτια ναυσιπλοΐα και εμπορικές επιχειρήσεις που απαιτούν PFD εγκεκριμένα από το USCG.
    body: Η έγκριση USCG απαιτεί δοκιμές από ανεξάρτητο εργαστήριο αναγνωρισμένο από το Λιμενικό. Η έγκριση τύπου V περιλαμβάνει υβριδικά φουσκωτά σχέδια που απαιτούν χειροκίνητη ή αυτόματη ενεργοποίηση.
  - title: Κοινωνική Συμμόρφωση BSCI
    standard: Κώδικας Δεοντολογίας amfori BSCI
    description: Το εργοστάσιό μας ελέγχεται ετησίως σύμφωνα με την πρωτοβουλία amfori Business Social Compliance Initiative (BSCI). Αυτό επαληθεύει ηθικές εργασιακές πρακτικές, ασφάλεια στον χώρο εργασίας, δίκαιες ώρες εργασίας και περιβαλλοντική διαχείριση σε όλη τη μονάδα παραγωγής των 12.000 m².
    body: Η συμμόρφωση BSCI είναι προϋπόθεση για Ευρωπαίους λιανοπωλητές και εισαγωγείς. Η τρέχουσα βαθμολογία μας στο BSCI είναι "C" (Καλή), ελεγμένη από την SGS.
  - title: Συμμόρφωση REACH και RoHS
    standard: Κανονισμός ΕΕ REACH (ΕΚ) 1907/2006 | Οδηγία RoHS 2011/65/ΕΕ
    description: Όλες οι ενώσεις PVC, οι κόλλες και οι επικαλύψεις που χρησιμοποιούνται στα προϊόντα Paddle Board Overstock συμμορφώνονται με τους ευρωπαϊκούς κανονισμούς χημικής ασφάλειας REACH και τους περιορισμούς RoHS για επικίνδυνες ουσίες. Τα ενημερωτικά έντυπα ασφάλειας υλικών (MSDS) είναι διαθέσιμα για κάθε γραμμή προϊόντων.
    body: Η συμμόρφωση REACH διασφαλίζει ότι δεν υπάρχουν περιορισμένες ουσίες SVHC πάνω από τα όρια. Τακτικές δοκιμές σε εργαστήρια τρίτων επαληθεύουν τη συνεχή συμμόρφωση για κάθε παρτίδα παραγωγής.
  - title: Διαχείριση Ποιότητας ISO 9001:2015
    standard: ISO 9001:2015 | Πιστοποιημένο από TÜV Rheinland
    description: Το σύστημα διαχείρισης ποιότητάς μας είναι πιστοποιημένο ISO 9001:2015 από την TÜV Rheinland και καλύπτει τον σχεδιασμό, την παραγωγή, τις δοκιμές και την εξυπηρέτηση μετά την πώληση. Ετήσιοι έλεγχοι παρακολούθησης διασφαλίζουν συνεχή βελτίωση και έλεγχο διεργασιών.
    body: Η πιστοποίηση ISO 9001 απαιτεί τεκμηριωμένες πολιτικές ποιότητας, εσωτερικούς ελέγχους, αναθεωρήσεις διοίκησης, διαδικασίες διορθωτικών ενεργειών και ιχνηλάσιμες εγγραφές παραγωγής.
testimonial:
  quote: Έχουμε προμηθευτεί εξοπλισμό ασφαλείας από πολλούς προμηθευτές στην Ασία. Η Paddle Board Overstock είναι ο μόνος κατασκευαστής που παρείχε εκ των προτέρων πλήρη τεκμηρίωση CE, πιστοποιητικά SOLAS και αναφορές δοκιμών τρίτων — χωρίς να του το ζητήσουμε.
  author: Erik Lindström
  title: Υπεύθυνος ασφάλειας
  company: Baltic Marine Supply
  location: Φινλανδία
content_overpressure:
  tagline: Ασφάλεια υπερπίεσης
  title: Διαχείριση Πίεσης Σωλήνων RIB<br />σε Ζεστά Κλίματα
  subtitle: Η πίεση στους φουσκωτούς σωλήνες αυξάνεται με τη θερμοκρασία. Η κατανόηση και διαχείριση της υπερπίεσης αποτρέπει ζημιές και διασφαλίζει ασφαλή λειτουργία σε τροπικά και ερημικά περιβάλλοντα.
  items:
    - title: Βαλβίδες Αποφόρτισης Πίεσης Boyle
      description: Οι σωλήνες RIB της Paddle Board Overstock είναι εξοπλισμένοι με βαλβίδες αποφόρτισης υπερπίεσης που απελευθερώνουν αυτόματα την περίσσεια πίεσης πάνω από το ονομαστικό μέγιστο. Αποτρέπει την καταπόνηση των ραφών και πιθανή έκρηξη σωλήνα από ηλιακή θέρμανση.
      icon: tabler:gauge
    - title: Αλλαγή Πίεσης από Πρωί έως Μεσημέρι
      description: Ένας σωλήνας φουσκωμένος στα 3,5 PSI στους 20 °C μπορεί να φτάσει τα 4,5+ PSI με ηλιακή έκθεση στους 40 °C. Σε ζεστά κλίματα φουσκώνετε πάντα στο κατώτερο άκρο της συνιστώμενης περιοχής και αφήστε τη βαλβίδα αποφόρτισης να διαχειριστεί την περίσσεια πίεσης.
      icon: tabler:sun
    - title: Συνιστώμενες Πιέσεις Λειτουργίας
      description: 'Σωλήνες PVC: λειτουργία 3,0-3,5 PSI, μέγιστο 4,5 PSI. Σωλήνες Hypalon: λειτουργία 3,5-4,0 PSI, μέγιστο 5,0 PSI. Δοκιμάζετε πάντα στο 1,25x του ονομαστικού (4,4 PSI για PVC, 5,0 PSI για Hypalon) σύμφωνα με τα πρότυπα QC της Paddle Board Overstock.'
      icon: tabler:chart-bar
    - title: Βέλτιστες Πρακτικές Ηλιακής Έκθεσης
      description: Φυλάτε τα RIB σε σκιασμένες περιοχές όταν δεν χρησιμοποιούνται. Χρησιμοποιείτε θήκες προστασίας UV για παρατεταμένη πρόσδεση. Ελέγχετε και ρυθμίζετε την πίεση των σωλήνων πριν και μετά τις ώρες αιχμής του ήλιου. Ποτέ μην υπερβαίνετε τη μέγιστη ονομαστική πίεση.
      icon: tabler:umbrella
    - title: Αποφόρτιση Έκτακτης Ανάγκης
      description: Αν ο σωλήνας φαίνεται υπερβολικά σκληρός ή η βαλβίδα αποφόρτισης απελευθερώνει αέρα, απελευθερώστε αέρα μέσω της βαλβίδας Halkey-Roberts ή της στρατιωτικής βαλβίδας μέχρι η πίεση να επιστρέψει στην περιοχή λειτουργίας. Κρατάτε πάντα μανόμετρο για ακριβείς ενδείξεις.
      icon: tabler:alert-circle
