content_customer_types:
  tagline: Ποιον εξυπηρετούμε
  title: 'Σχεδιασμένο για αγοραστές B2B<br />— όχι για καταναλωτές'
  subtitle: 'Η Aquafarer κατασκευάζει για τέσσερις τύπους πελατών. Ο καθένας έχει διαφορετικές προτεραιότητες — και εμείς τις καλύπτουμε όλες.'
  items:
    - title: Ιδιοκτήτες brands / Private Label
      description: 'Σχεδιασμός προϊόντος κατά παραγγελία, γραφικά private label, τεκμηρίωση συμμόρφωσης με το δικό σας brand και αποκλειστική υποστήριξη μηχανικών από την ιδέα έως το container.'
      icon: tabler:palette
      cta: Ζητήστε προσφορά OEM/ODM
      cta_href: /request-quotation
    - title: Διανομείς / Χονδρέμποροι
      description: 'Προστασία περιοχής, ανταγωνιστικές χονδρικές τιμές, πακέτα υποστήριξης marketing, εκπαίδευση προϊόντων και πλήρης τεκμηρίωση συμμόρφωσης για την αγορά σας.'
      icon: tabler:world
      cta: Αιτηθείτε αντιπροσωπεία
      cta_href: /dealers-distributors
    - title: Θέρετρα / Εταιρείες ενοικίασης
      description: 'Αντοχή εμπορικής κατηγορίας, συμβουλές για το μέγεθος στόλου, παραγγελίες container με μικτά μοντέλα, στρατηγική ανταλλακτικών και πακέτα εξοπλισμού με το branding του θέρετρου.'
      icon: tabler:beach
      cta: Ζητήστε εμπορικό πακέτο
      cta_href: /solutions/resorts
    - title: Διάσωση / Δημόσιο / Επαγγελματίες
      description: 'Κατασκευή Hypalon/CSM, επιλογές συμμόρφωσης SOLAS, πιστοποίηση κατά έργο, υποστήριξη τεκμηρίωσης διαγωνισμών και μηχανική υπό NDA.'
      icon: tabler:shield
      cta: Συζητήστε ένα έργο
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: Δυνατότητες OEM/ODM
  title: 'Τι αποκτάτε<br />με την Aquafarer'
  subtitle: 'Άμεση πρόσβαση στο εργοστάσιο με πλήρη υποστήριξη μηχανικής, ποιότητας και συμμόρφωσης — όχι μια εμπορική εταιρεία.'
  columns: 2
  items:
    - title: Προσαρμογή OEM/ODM
      description: 'Σχεδιασμός κύτους κατά παραγγελία, υλικό σωλήνων (PVC ή Hypalon/CSM), διάταξη κονσόλας, καθίσματα, branding, χρώματα και συσκευασία. Από μικρές τροποποιήσεις έως πλήρως προσαρμοσμένη κατασκευή.'
      icon: tabler:adjustments
    - title: Χαμηλό MOQ, γρήγορα δείγματα
      description: 'RIB: 2–5 μονάδες (υπάρχουσα μήτρα). SUP: 5–10 μονάδες ανά SKU. Δικές μας μήτρες: 200+ μονάδες. Προπαραγωγικά δείγματα με το branding σας σε 7–14 ημέρες.'
      icon: tabler:rocket
    - title: Ποιότητα έτοιμη για παραγωγή
      description: 'Κάθε μονάδα δοκιμάζεται σε πίεση 1,25× της ονομαστικής PSI για 24–48 ώρες. 99,3% χωρίς ελαττώματα κατά AQL 2,5 / ISO 2859. Λίστα ελέγχου ποιότητας 100 σημείων ανά κύτος.'
      icon: tabler:certificate
    - title: Πλήρης τεκμηρίωση συμμόρφωσης
      description: 'CE σύμφωνα με 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI κοινωνικός έλεγχος, συμμόρφωση REACH, σήμανση UKCA. Περιλαμβάνονται δήλωση συμμόρφωσης ανά μοντέλο και στοιχεία πινακίδας κατασκευαστή.'
      icon: tabler:file-certificate
    - title: Χρόνος παράδοσης 30–45 ημερών
      description: 'Τυπική παραγωγή 30–45 ημέρες FOB Qingdao. Πρωτότυπα σε 7–14 ημέρες. Διατίθεται επιταχυνόμενη παραγωγή. Περιλαμβάνονται σχέδια φόρτωσης container και συσκευασία ISPM-15.'
      icon: tabler:truck-delivery
    - title: After-sales & ανταλλακτικά
      description: '5 χρόνια εγγύηση σε βάρκες/καγιάκ/RIB, 2 χρόνια σε SUP/αξεσουάρ. Προμήθεια ανταλλακτικών με προτεραιότητα αποστολής. Υποστήριξη διεκπεραίωσης αξιώσεων εγγύησης.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Κατηγορίες προϊόντων
  title: '5 κατηγορίες,<br />64 μοντέλα με πιστοποίηση CE'
  subtitle: 'Από RIB tender 2,4 m έως SUP 15 ποδών — όλα κατασκευασμένα στην μονάδα ISO 9001 στο Qingdao.'
  items:
    - title: Σκάφη RIB
      description: '2,4 m έως 7,0 m με κύτος αλουμινίου ή GRP. Σωλήνες PVC ή Hypalon/CSM. CE σύμφωνα με 2013/53/EU. Διαμορφώσεις περιπολίας, καταδύσεων, διάσωσης και εμπορικές.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Φουσκωτές βάρκες
      description: '2,0 m έως 5,0 m με δάπεδο αλουμινίου, δάπεδο κόντρα πλακέ ή air-deck. Μοντέλα ψαρέματος, αναψυχής και tender.'
      icon: tabler:sailboat
      link: /products
    - title: SUP
      description: '9 έως 15 πόδια σε Drop-Stitch 4 και 6 ιντσών. Μοντέλα all-round, touring, yoga και ψαρέματος. Διατίθενται και εμπορικής κατηγορίας.'
      icon: tabler:swimming
      link: /products
    - title: Καγιάκ
      description: 'Φουσκωτά καγιάκ για 1 έως 3 άτομα. Μοντέλα αναψυχής και touring με δάπεδο Drop-Stitch.'
      icon: tabler:kayak
      link: /products
    - title: Αξεσουάρ ασφαλείας
      description: 'Πιστοποιημένα CE σωσίβια γιλέκα, σχοινιά ρίψης, κιτ επισκευής, αντλίες και φώτα πλοήγησης. Εγκεκριμένα από USCG γιλέκα τύπου III/V.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Δύναμη εργοστασίου
  title: 'Παραγωγή έτοιμη για έλεγχο<br />στο Qingdao'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Μονάδα ISO 9001 εκτάσεων 12.000 m² — πραγματικός κατασκευαστής, όχι εμπορική εταιρεία</h3>
  items:
    - title: 6 εξειδικευμένες γραμμές παραγωγής
      description: 'Ξεχωριστές γραμμές για RIB, φουσκωτές βάρκες, SUP, καγιάκ, εξοπλισμό ασφαλείας και OEM/ODM. Κάθε μία με δικά της σημεία ελέγχου QC και σχεδιασμό παραγωγής.'
    - title: 100% δοκιμές πίεσης
      description: 'Κάθε φουσκωτός θάλαμος πιέζεται στο 1,25× της ονομαστικής PSI και διατηρείται για 24–48 ώρες. Τα αποτελέσματα συνδέονται με τον αριθμό ταυτότητας του κύτους (HIN).'
    - title: Ιχνηλασιμότητα ανά κύτος
      description: 'Αρχεία παραγωγής σε επίπεδο HIN με 21+ πεδία δεδομένων ανά κύτος: παρτίδα υλικού, ID συγκολλητή, αποτέλεσμα δοκιμής πίεσης, τελική διαμόρφωση και προορισμός παράδοσης.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Η μονάδα ISO 9001 εκτάσεων 12.000 m² της Aquafarer στο Qingdao με γραμμές παραγωγής RIB

content_compliance:
  tagline: Συμμόρφωση & αποδείξεις ποιότητας
  title: 'Τεκμηριωμένα στοιχεία,<br />όχι απλώς ισχυρισμοί'
  subtitle: 'Κάθε ισχυρισμός συμμόρφωσης τεκμηριώνεται με τεκμηρίωση ανά μοντέλο, διαθέσιμη για επαλήθευση.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Σύστημα διαχείρισης ποιότητας πιστοποιημένο από TÜV Rheinland/SGS. Ετήσιοι έλεγχοι επιτήρησης. Τεκμηριωμένες διαδικασίες QC από την παραλαβή υλικών έως την αποστολή.'
      icon: tabler:certificate
    - title: CE σύμφωνα με 2013/53/EU (RCD)
      description: '64 μοντέλα με δήλωση συμμόρφωσης για κάθε μοντέλο. Αξιολόγηση συμμόρφωσης σύμφωνα με τις εφαρμοστέες ενότητες. Καταχώρηση HIN και στοιχεία πινακίδας κατασκευαστή για κάθε κύτος.'
      icon: tabler:file-certificate
    - title: Κοινωνικός έλεγχος BSCI
      description: 'Ετήσιος έλεγχος BSCI από την SGS. Επαληθευμένες ηθικές εργασιακές πρακτικές, ασφάλεια στον χώρο εργασίας και περιβαλλοντική διαχείριση σε όλη τη μονάδα.'
      icon: tabler:users
    - title: REACH & UKCA
      description: 'Όλα τα υλικά PVC και οι κόλλες συμμορφώνονται με τον κανονισμό REACH της ΕΕ. Διατίθεται σήμανση UKCA για τη βρετανική αγορά. Δελτία δεδομένων ασφάλειας κατόπιν αιτήματος.'
      icon: tabler:shield-check

steps:
  title: Η διαδικασία OEM/ODM — από την περιγραφή έως το container
  items:
    - title: 'Βήμα 1: <span class="font-medium">Απαιτήσεις</span>'
      description: 'Μοιραστείτε τις προδιαγραφές του προϊόντος, την αγορά-στόχο, τις ποσότητες και τις απαιτήσεις συμμόρφωσης. Η ομάδα μηχανικών μας απαντά εντός 48 ωρών.'
      icon: tabler:file-text
    - title: 'Βήμα 2: <span class="font-medium">Προσφορά</span>'
      description: 'Λαμβάνετε αναλυτική προσφορά με προδιαγραφές, επιλογές υλικών, MOQ, τιμές, χρόνο παράδοσης και πεδίο συμμόρφωσης για την αγορά σας.'
      icon: tabler:clipboard-list
    - title: 'Βήμα 3: <span class="font-medium">Πρωτότυπο</span>'
      description: 'Προπαραγωγικό δείγμα με το branding σας σε 7–14 ημέρες. Πλήρεις δοκιμές ποιότητας σε πίεση 1,25× της ονομαστικής. Το κόστος του δείγματος πιστώνεται στην παραγωγή.'
      icon: tabler:settings
    - title: 'Βήμα 4: <span class="font-medium">Παραγωγή</span>'
      description: 'Παραγωγή 30–45 ημερών FOB Qingdao μετά την έγκριση του δείγματος. Σημεία ελέγχου QC κατά τη διάρκεια, δοκιμές πίεσης και τελικός έλεγχος 100 σημείων σε κάθε μονάδα.'
      icon: tabler:building-factory
    - title: 'Βήμα 5: <span class="font-medium">Παράδοση</span>'
      description: 'Σχέδιο φόρτωσης container, ξύλινη συσκευασία ISPM-15, πακέτο τεκμηρίωσης συμμόρφωσης και αποστολή FOB Qingdao με πλήρη εξαγωγικά έγγραφα.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Η διαδικασία κατασκευής OEM/ODM φουσκωτών βαρκών της Aquafarer — από τον σχεδιασμό έως την αποστολή container

blog_latest:
  title: Άρθρα κλάδου & τεχνικές αναλύσεις
  information: |
    Οδηγοί συμμόρφωσης RCD, άρθρα για τη διαδικασία OEM/ODM, συγκρίσεις υλικών
    και πόροι για επιθεώρηση εργοστασίου από την ομάδα μηχανικών της Aquafarer.

faqs:
  title: Συχνές ερωτήσεις για B2B αγορές
  subtitle: 'Συνηθισμένες ερωτήσεις από brands, διανομείς και εμπορικούς χειριστές για την κατασκευή OEM/ODM με την Aquafarer.'
  columns: 2
  items:
    - title: Είστε κατασκευαστής ή εμπορική εταιρεία;
      description: 'Είμαστε κάθετα ολοκληρωμένο εργοστάσιο με πλήρη έλεγχο ποιότητας, υλικών και χρόνων παράδοσης. Η επιχειρηματική άδεια και το αντικείμενο παραγωγής επαληθεύονται κατά τον έλεγχο του εργοστασίου.'
      icon: tabler:building-factory
      category: all
    - title: Πώς λειτουργεί η διαδικασία OEM/ODM;
      description: 'Από την αξιολόγηση απαιτήσεων (48 ώρες) στην προσφορά, το πρωτότυπο (7–14 ημέρες) και την παραγωγή (30–45 ημέρες FOB Qingdao). Πλήρης υποστήριξη μηχανικής, τεκμηρίωση συμμόρφωσης και ιχνηλασιμότητα ανά κύτος σε κάθε στάδιο.'
      icon: tabler:route
      category: all
    - title: Ποιες είναι οι απαιτήσεις MOQ;
      description: 'Σκάφη RIB: 2–5 μονάδες ανά μοντέλο (υπάρχουσα μήτρα), 200+ για δικές μας μήτρες. SUP: 5–10 μονάδες ανά SKU. Διατίθενται παραγγελίες container με μικτά μοντέλα. Παραγγελίες δειγμάτων από 2–5 μονάδες για αξιολόγηση.'
      icon: tabler:sort-ascending
      category: all
    - title: Ποιες επιλογές προσαρμογής είναι διαθέσιμες;
      description: 'Σχεδιασμός κύτους, υλικό σωλήνων (PVC ή Hypalon/CSM), διάμετρος σωλήνων, διάταξη κονσόλας, καθίσματα, τιμόνι, σύστημα καυσίμων, διάταξη καταστρώματος, χρώματα brand, γραφικά λογοτύπου, σχεδιασμός EVA pad, συσκευασία λιανικής και branding του εγχειριδίου.'
      icon: tabler:adjustments
      category: all
    - title: Ποια έγγραφα συμμόρφωσης μπορείτε να παρέχετε για την αγορά μου;
      description: 'Δήλωση συμμόρφωσης CE σύμφωνα με 2013/53/EU, σήμανση UKCA, πιστοποιητικό ISO 9001 (SGS), αναφορά ελέγχου BSCI, συμμόρφωση REACH, αναφορές δοκιμών υλικών, αρχεία δοκιμών πίεσης και στοιχεία πινακίδας κατασκευαστή ανά μοντέλο. Τεκμηρίωση κατά αγορά κατόπιν αιτήματος.'
      icon: tabler:file-certificate
      category: all
    - title: Ποιος είναι ο χρόνος παράδοσης δειγμάτων και παραγωγής;
      description: 'Προπαραγωγικά δείγματα: 7–14 εργάσιμες ημέρες. Τυπική παραγωγή: 30–45 ημέρες FOB Qingdao. Διατίθεται επιταχυνόμενη παραγωγή με επιπλέον κόστος. Σε περιόδους αιχμής (Μάρτιος–Ιούνιος) οι χρόνοι μπορεί να παραταθούν.'
      icon: tabler:clock
      category: all
    - title: Μπορώ να κανονίσω έλεγχο εργοστασίου ή ζωντανή βιντεοξενάγηση;
      description: 'Ναι. Επιτόπιοι έλεγχοι στη μονάδα μας στο Qingdao είναι ευπρόσδεκτοι με προειδοποίηση 3–5 ημερών. Ζωντανές βιντεοξενάγησεις μέσω WhatsApp/Zoom είναι διαθέσιμες άμεσα. Υποστηρίζονται επιθεωρήσεις τρίτων (SGS, BV, TÜV).'
      icon: tabler:video
      category: all
    - title: Ποιοι έλεγχοι ποιότητας ολοκληρώνονται πριν την αποστολή;
      description: 'Δοκιμή διατήρησης πίεσης στο 1,25× της ονομαστικής (24–48 ώρες), δοκιμή αποκόλλησης ραφών, λίστα τελικού ελέγχου 100 σημείων, διαστατικός έλεγχος, αισθητικός έλεγχος, επαλήθευση τεκμηρίωσης συμμόρφωσης και έλεγχος ακεραιότητας συσκευασίας. Όλα σύμφωνα με διαδικασίες ISO 9001.'
      icon: tabler:clipboard-check
      category: all

