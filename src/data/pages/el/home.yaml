content_customer_types:
  tagline: Σε ποιους παρέχουμε υπηρεσίες
  title: Πίνακες για όλους<br />Τύπος Κωπηλάτη
  subtitle: Είτε είναι η πρώτη σας συνεδρία είτε η πεντηκοστή, υπάρχει μια επιτροπή έγκρισης που ταιριάζει με τον τρόπο που κωπηλατείτε.
  items:
    - title: Αρχάριοι
      description: Εξαιρετικά φαρδιές, σταθερές σανίδες παντού που κάνουν την πρώτη σας συνεδρία εύκολη — οι περισσότεροι αρχάριοι σηκώνονται όρθιοι μέσα σε λίγα λεπτά.
      icon: tabler:swimming
      cta: Αγοράστε φιλικά για SUPsαρχάριους
      cta_href: /supboard
    - title: Οικογένειες
      description: Σταθερές σανίδες που μπορεί να μοιραστεί όλη η οικογένεια, καθώς και ελαφρύτερα παιδικά μοντέλα — εξοπλισμός που συσκευάζεται στο αυτοκίνητο και φουσκώνει μέσα σε λίγα λεπτά.
      icon: tabler:beach
      cta: Αγοράστε οικογενειακά πακέτα
      cta_href: /products
    - title: Κωπηλάτες Touring & Fitness
      description: Μεγαλύτερες, πιο γρήγορες σανίδες περιήγησης και πλατφόρμες γιόγκα σε όλο το κατάστρωμα για κωπηλάτες που διανύουν την απόσταση.
      icon: tabler:route
      cta: Αγοράστε σανίδες περιήγησης και γιόγκα
      cta_href: /supboard
    - title: Ψαράδες
      description: Εξαιρετικά σταθερές πλατφόρμες με βάσεις ταχυτήτων και χώρο για ψυγείο — χυτό από ένα ήσυχο, επίπεδο κατάστρωμα.
      icon: tabler:lifebuoy
      cta: Κατάστημα Ψάρεμα SUPs
      cta_href: /products
features:
  id: features
  tagline: Γιατί να αγοράσετε από Paddle Board Overstock
  title: Πραγματικό εργοστάσιο,<br />Πραγματική εξοικονόμηση
  subtitle: Πακέτα υπερβολικού αποθέματος και εκκαθάρισης απευθείας από SUP το εργοστάσιο — πιστοποιημένη ποιότητα χωρίς σήμανση λιανικής.
  columns: 2
  items:
    - title: Έκπτωση έως και 60% στο λιανικό εμπόριο
      description: Πουλάμε εργοστασιακά πλεονάζοντα αποθέματα και παρτίδες εκκαθάρισης απευθείας — χωρίς μεσάζοντες, χωρίς σήμανση λιανικής. Οι ίδιες σανίδες που πωλούνται σε πλήρη τιμή αλλού, σε τιμές εκκαθάρισης εδώ.
      icon: tabler:rocket
    - title: Ολοκληρωμένα Πακέτα
      description: 'Κάθε ένα SUP έρχεται ως πλήρες πακέτο: σανίδα, σακίδιο ταξιδιού, αντλία χειρός, ρυθμιζόμενο κουπί, αφαιρούμενο πτερύγιο, λουρί πηνίου και κιτ επισκευής.'
      icon: tabler:clipboard-list
    - title: Πιστοποιημένη Ποιότητα
      description: 13 CEπιστοποιημένα SUP μοντέλα σύμφωνα με τις ισχύουσες οδηγίες της ΕΕ. Κάθε πλακέτα ελέγχεται 100% υπό πίεση σε ονομαστική τιμή 1,25x PSI πριν από την αποστολή της. Ποσοστό 99,3% χωρίς ελαττώματα ανά AQL 2,5.
      icon: tabler:certificate
    - title: Όχι MOQ — Παραγγελία ενός πίνακα
      description: Η εκκαθάριση υπερβολικού αποθέματος σημαίνει ευπρόσδεκτες παραγγελίες μιας μονάδας. Προσθέστε έναν πίνακα στο καλάθι, κάντε check out, τελειώσατε. Χωρίς ελάχιστη παραγγελία, χωρίς διαδικασία προσφοράς.
      icon: tabler:adjustments
    - title: Γρήγορη αποστολή σε όλο τον κόσμο
      description: Οι παραγγελίες σε απόθεμα αποστέλλονται από το Weihai εντός 2-3 εργάσιμων ημερών. Παρακολούθηση παράδοσης σε 50+ χώρες σε όλη την ΕΕ, τη Βόρεια Αμερική, την Ασία-Ειρηνικό και όχι μόνο.
      icon: tabler:truck-delivery
    - title: Εγγύηση 2 ετών SUP
      description: Κάθε SUP πλακέτα και αξεσουάρ καλύπτεται για 2 χρόνια — drop-stitch περιλαμβάνονται ραφές, βαλβίδες φουσκώματος και αξεσουάρ. Οι αξιώσεις επιλύονται σε ημέρες, όχι σε εβδομάδες.
      icon: tabler:lifebuoy
content_categories:
  tagline: Κατηγορίες Προϊόντων
  title: Μία σειρά προϊόντων,<br />Έγινε σωστά
  subtitle: Φουσκωτές SUP σανίδες και αξεσουάρ — όλα κατασκευασμένα στις εγκαταστάσεις μας Weihai ISO 9001.
  items:
    - title: Πίνακες SUP
      description: Φουσκωτό SUPs παντού από 9 έως 12 πόδια. Σταθερό, ανθεκτικό και πλήρες με αντλία, κουπί, λουρί και σακίδιο.
      icon: tabler:swimming
      link: /supboard
    - title: Περιήγηση SUPs
      description: Μακρύτερες, ταχύτερες σανίδες με περιγράμματα περιήγησης για λίμνες, ποτάμια και παράκτια εξερεύνηση.
      icon: tabler:route
      link: /supboard
    - title: Γιόγκα & Γυμναστική SUPs
      description: Εξαιρετικά φαρδιές, εξαιρετικά σταθερές πλατφόρμες με μαξιλαράκια καταστρώματος σε όλο το μήκος για γιόγκα και προπονήσεις στο νερό.
      icon: tabler:users
      link: /supboard
    - title: Παιδιά SUPs
      description: Ελαφρύτερες, πιο κοντές σανίδες μεγέθους για παιδιά — η ίδια drop-stitch ποιότητα σε συσκευασία φιλική προς τα παιδιά.
      icon: tabler:lifebuoy
      link: /products
    - title: Αξεσουάρ
      description: Αντλίες, κουπιά, σωσίβια, λουριά, κιτ επισκευής και ανταλλακτικά για κάθε σανίδα που πουλάμε.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Εργοστασιακή αντοχή
  title: Γιατί οι τιμές εκκαθάρισης μας<br />Είναι αληθινά
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Πραγματικό εργοστάσιο, πραγματική εξοικονόμηση — Κάθε σανίδα αποστέλλεται από τις εγκαταστάσεις μας στο Weihai</h3>
  items:
    - title: Ίδιες γραμμές παραγωγής με μεγάλες μάρκες
      description: Το εργοστάσιό μας 12.000 m² στο Weihai κατασκευάζει σανίδες για διεθνείς μάρκες και τις δικές μας παρτίδες πλεονάζοντος αποθέματος στις ίδιες γραμμές με τα ίδια υλικά.
    - title: 100% δοκιμασμένη πίεση
      description: Κάθε πλακέτα είναι υπό πίεση στο 1,25x PSI και διατηρείται πριν από την αποστολή της. Ποσοστό 99,3% χωρίς ελαττώματα ανά AQL 2,5 / ISO 2859.
    - title: Χωρίς μεσάζοντες
      description: Οι σανίδες αποστέλλονται απευθείας από το εργοστάσιο στην πόρτα σας. Χωρίς σήμανση διανομέα, χωρίς σήμανση λιανικής — έτσι η τιμολόγηση εκκαθάρισης παραμένει έως και 60% κάτω από τη λιανική.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Εργοστάσιο Weihai 12.000 m² με φουσκωτές SUP γραμμές παραγωγής
content_compliance:
  tagline: Συμμόρφωση & Απόδειξη Ποιότητας
  title: Πιστοποιημένη Ποιότητα,<br />Τεκμηριωμένο
  subtitle: Κάθε αξίωση συμμόρφωσης υποστηρίζεται από πιστοποιητικά και τεκμηρίωση για συγκεκριμένο μοντέλο που είναι διαθέσιμα για την επαλήθευσή σας.
  items:
    - title: του προτύπου ISO 9001:2015
      description: Σύστημα διαχείρισης ποιότητας πιστοποιημένο από τη TÜV Rheinland/SGS. Ετήσιοι έλεγχοι επιτήρησης. Τεκμηριωμένες διαδικασίες QC από το εισερχόμενο υλικό έως την απελευθέρωση της αποστολής.
      icon: tabler:certificate
    - title: CE Πιστοποιημένο
      description: 13 CEπιστοποιημένα SUP μοντέλα σύμφωνα με τις ισχύουσες οδηγίες της ΕΕ, το καθένα με δήλωση συμμόρφωσης για συγκεκριμένο μοντέλο και δεδομένα πινακίδας κατασκευαστή.
      icon: tabler:file-certificate
    - title: REACH UKCA&
      description: Όλα PVC τα συγκολλητικά υλικά συμμορφώνονται με REACH τον κανονισμό της ΕΕ.UKCA σήμανση διαθέσιμη για την αγορά του Ηνωμένου Βασιλείου. Δελτία δεδομένων ασφαλείας υλικού κατόπιν αιτήματος.
      icon: tabler:shield-check
    - title: Εγγύηση 2 ετών SUP
      description: Κάθε SUP πλακέτα και αξεσουάρ καλύπτεται για 2 χρόνια — drop-stitch περιλαμβάνονται ραφές, βαλβίδες φουσκώματος και αξεσουάρ. Οι αξιώσεις επιλύθηκαν γρήγορα.
      icon: tabler:lifebuoy
steps:
  title: Από το ταμείο στο νερό — Πώς αποστέλλεται η παραγγελία σας
  items:
    - title: Βήμα 1:<span class="font-medium">Επιλέξτε τον πίνακα σας</span>
      description: Επιλέξτε ανάμεσα σε μοντέλα all-around, touring, γιόγκα και παιδιά. Οι οδηγοί αγοράς μας σάς βοηθούν να ταιριάξετε το μέγεθος και το στυλ της σανίδας με την κωπηλασία σας.
      icon: tabler:clipboard-list
    - title: Βήμα 2:<span class="font-medium">Ασφαλής ολοκλήρωση αγοράς</span>
      description: Πληρώστε με ασφάλεια με Stripe ή PayPal. Δεκτές όλες οι σημαντικές πιστωτικές και χρεωστικές κάρτες. Δεν απαιτείται λογαριασμός — η επιβεβαίωση παραγγελίας προσγειώνεται στα εισερχόμενά σας.
      icon: tabler:file-text
    - title: Βήμα 3:<span class="font-medium">Επιθεώρηση ποιότητας</span>
      description: Κάθε πλακέτα ελέγχεται 100% υπό πίεση σε βαθμολογία 1,25x PSI και ελέγχεται σε μια πλήρη λίστα ελέγχου ποιότητας πριν συσκευαστεί.
      icon: tabler:settings
    - title: Βήμα 4:<span class="font-medium">Γρήγορη αποστολή</span>
      description: Οι παραγγελίες σε απόθεμα αποστέλλονται από το εργοστάσιό μας στο Weihai εντός 2-3 εργάσιμων ημερών. Διατίθεται βιαστικός χειρισμός για επείγουσες παραγγελίες.
      icon: tabler:building-factory
    - title: Βήμα 5:<span class="font-medium">Παρακολούθηση παράδοσης</span>
      description: Παρακολούθηση αποστολής σε όλο τον κόσμο σε 50+ χώρες. Η 2ετής εγγύηση και η ανταποκρινόμενη υποστήριξη μετά την πώληση ξεκινούν την ημέρα άφιξης της πλακέτας σας.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP Διαδικασία παραγγελίας από την ασφαλή ολοκλήρωση αγοράς έως την παρακολούθηση της παράδοσης σε όλο τον κόσμο
blog_latest:
  title: SUP Οδηγοί & Τεχνικές Πληροφορίες
  information: |
    Οδηγοί αγοράς, τεχνική κωπηλασίας, βασικά στοιχεία ασφαλείας και κατασκευή
    έρευνα από την Paddle Board Overstock ομάδα.
faqs:
  title: SUP Συχνές ερωτήσεις για παραγγελίες και προϊόντα
  subtitle: Συνήθεις ερωτήσεις σχετικά με SUP τους πίνακες εκκαθάρισης, την παραγγελία, την πληρωμή, την αποστολή και την εγγύηση.
  columns: 2
  items:
    - title: Είναι SUP δύσκολο να μάθεις;
      description: Καθόλου. Οι περισσότεροι αρχάριοι σηκώνονται όρθιοι και κωπηλατούν στην πρώτη τους συνεδρία. Οι ολόπλευρες SUP σανίδες μας διαθέτουν εξαιρετικά φαρδιές σταθερές πλατφόρμες σχεδιασμένες ειδικά για κωπηλάτες για πρώτη φορά. Ξεκινήστε σε ήρεμα νερά και θα ταξιδέψετε σε λίγα λεπτά.
      icon: tabler:swimming
      category: sup
    - title: Ποιο είναι το όριο βάρους;
      description: Η ολοκληρωμένη υποστήριξή μας SUPs έως και 220 λίβρες και οι πλατφόρμες περιήγησης και γιόγκα υποστηρίζουν έως και 250 λίβρες. Κάθε σελίδα προϊόντος παραθέτει την ακριβή χωρητικότητα βάρους του αναβάτη, ώστε να μπορείτε να ταιριάξετε τη σανίδα στις ανάγκες σας.
      icon: tabler:adjustments
      category: sup
    - title: Μπορώ να ταξιδέψω με φουσκωτόSUP;
      description: Απολύτως. Paddle Board Overstock Κάθε σανίδα συσκευάζεται σε μια θήκη μεταφοράς μεγέθους σακιδίου. Με βάρος μόλις 18-22 λίβρες, είναι εύκολο να το μεταφέρετε στην παραλία, στη λίμνη ή στους τερματικούς σταθμούς του αεροδρομίου. Ελέγξτε την πολιτική αποσκευών της αεροπορικής σας εταιρείας πριν ταξιδέψετε.
      icon: tabler:truck-delivery
      category: sup
    - title: Τι έρχεται στο κουτί?
      description: Κάθε ένα Paddle Board Overstock SUP περιλαμβάνει τη σανίδα, ένα σακίδιο ταξιδιού, μια αντλία χειρός, ρυθμιζόμενο κουπί, αφαιρούμενο πτερύγιο, λουρί πηνίου και κιτ επισκευής.
      icon: tabler:clipboard-list
      category: sup
    - title: Γιατί οι τιμές σας είναι χαμηλότερες από τη λιανική;
      description: Πουλάμε εργοστασιακά πλεονάζοντα αποθέματα και παρτίδες εκκαθάρισης απευθείας από τη δική μας μονάδα παραγωγής στο Weihai της Κίνας — χωρίς μεσάζοντες, χωρίς σήμανση λιανικής. Αυτό σημαίνει πλήρη SUP πακέτα με έκπτωση έως και 60% στις τυπικές τιμές λιανικής, με την ίδια CEπιστοποιημένη ποιότητα.
      icon: tabler:certificate
      category: orders
    - title: Πώς μπορώ να κάνω μια παραγγελία και να πληρώσω;
      description: Προσθέστε SUP το πακέτο σας στο καλάθι και ελέγξτε το με ασφάλεια με Stripe ή PayPal. Δεχόμαστε όλες τις μεγάλες πιστωτικές και χρεωστικές κάρτες. Κάθε παραγγελία επιβεβαιώνεται μέσω email με πλήρες τιμολόγιο.
      icon: tabler:file-text
      category: orders
    - title: Στέλνετε σε όλο τον κόσμο;
      description: Ναί. Στέλνουμε σε 50+ χώρες σε όλη την ΕΕ, τη Βόρεια Αμερική, την Ασία-Ειρηνικό, τη Μέση Ανατολή και την Αφρική. Οι παραγγελίες σε απόθεμα συνήθως αποστέλλονται εντός 2-3 εργάσιμων ημερών με παρακολούθηση για κάθε δέμα.
      icon: tabler:route
      category: orders
    - title: Τι εγγύηση SUP περιλαμβάνουν οι σανίδες;
      description: 'Κάθε SUP πλακέτα και αξεσουάρ καλύπτεται από εγγύηση 2 ετών — συμπεριλαμβανομένης της ίδιας της πλακέτας, των drop-stitch ραφών και των βαλβίδων φουσκώματος. Οι αξιώσεις επιλύονται σε ημέρες, όχι σε εβδομάδες: υποβάλετε ηλεκτρονικά και επισκευάζουμε ή αντικαθιστούμε.'
      icon: tabler:lifebuoy
      category: orders
