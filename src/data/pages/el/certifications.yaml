hero:
  tagline: Πιστοποιήσεις & Πρότυπα
  title: 'Πιστοποιήσεις Ποιότητας<br />& Πρότυπα Συμμόρφωσης'
  subtitle: 'Τα προϊόντα Aquafarer κατασκευάζονται σύμφωνα με τα διεθνή πρότυπα ναυτικής ασφάλειας, τα συστήματα διαχείρισης ποιότητας και τους περιβαλλοντικούς κανονισμούς.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Πιστοποιήσεις ποιότητας και τεκμηρίωση συμμόρφωσης της Aquafarer
content_certifications:
  tagline: Οι Πιστοποιήσεις μας
  title: 'Πιστοποιημένη Ποιότητα,<br />Αναγνωρισμένη Παγκοσμίως'
  subtitle: '64 μοντέλα με πιστοποίηση CE και πιστοποιήσεις σε όλο το εργοστάσιο αποδεικνύουν τη δέσμευσή μας για ποιότητα, ασφάλεια και περιβαλλοντική ευθύνη.'
  items:
    - title: 'Πιστοποίηση CE'
      description: '64 μοντέλα με πιστοποίηση CE συμμορφώνονται με τις ευρωπαϊκές απαιτήσεις σήμανσης CE για σκάφη αναψυχής, διασφαλίζοντας ότι τηρούνται τα πρότυπα ασφάλειας, υγείας και περιβαλλοντικής προστασίας.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Το σύστημα διαχείρισης ποιότητάς μας είναι πιστοποιημένο κατά ISO 9001:2015 και καλύπτει τον σχεδιασμό, την κατασκευή και τη διανομή φουσκωτών σκαφών και ναυτικού εξοπλισμού.'
      icon: tabler:clipboard-check
    - title: 'Σήμανση UKCA'
      description: 'Τα προϊόντα που πωλούνται στη βρετανική αγορά φέρουν σήμανση UKCA, επιβεβαιώνοντας συμμόρφωση με τους βρετανικούς κανονισμούς για ναυτικό εξοπλισμό και σκάφη αναψυχής.'
      icon: tabler:shield
    - title: 'Συμμόρφωση BSCI'
      description: 'Η Aquafarer ελέγχεται σύμφωνα με το BSCI (Business Social Compliance Initiative), αποδεικνύοντας ηθικές πρακτικές παραγωγής, δίκαιες συνθήκες εργασίας και υπευθυνότητα στην εφοδιαστική αλυσίδα.'
      icon: tabler:heart-handshake
    - title: 'Συμμόρφωση REACH'
      description: 'Όλα τα υλικά που χρησιμοποιούνται στα προϊόντα Aquafarer συμμορφώνονται με τον κανονισμό REACH της ΕΕ για χημική ασφάλεια, εξασφαλίζοντας ότι δεν υπάρχουν περιορισμένες ουσίες στο PVC, το Hypalon ή τα εξαρτήματά μας.'
      icon: tabler:flask
    - title: 'Δοκιμές Υλικών'
      description: 'Οι ιστοί δοκιμάζονται για αντοχή σε εφελκυσμό, αντίσταση σε σχίσιμο, υποβάθμιση UV και απόδοση σε ψυχρή ρηγμάτωση. Κάθε παρτίδα παραγωγής λαμβάνεται δείγμα και επαληθεύεται.'
      icon: tabler:test-pipe
content_factory:
  tagline: Πρότυπα Εργοστασίου
  title: 'Αριστεία Κατασκευής<br />— Βασισμένο σε Προδιαγραφές'
  subtitle: 'Η μονάδα μας των 12,000 m² λειτουργεί με αυστηρά πρωτόκολλα ελέγχου ποιότητας σε κάθε στάδιο της παραγωγής.'
  list:
    - 'Έλεγχος Εισερχόμενων Υλικών: όλες οι πρώτες ύλες — ύφασμα PVC, Hypalon, αλουμίνιο, κόντρα πλακέ, κόλλες — δοκιμάζονται έναντι προδιαγραφών πριν εισέλθουν στην παραγωγή.'
    - 'Έλεγχος Ποιότητας εντός Διαδικασίας: κάθε στάδιο παραγωγής έχει τεκμηριωμένα σημεία ελέγχου QC. Η αντοχή συγκόλλησης, η ευθυγράμμιση ραφών, η εγκατάσταση βαλβίδων και η ροπή σφιξίματος επαληθεύονται εντός γραμμής.'
    - 'Δοκιμή πίεσης: Κάθε φουσκωτός θάλαμος δοκιμάζεται πίεση σε 1,25× ονομαστική πίεση για 24-48 ώρες. Το ποσοστό διαρροής πρέπει να είναι μηδενικό για την επιτυχή βαθμολογία.'
    - 'Τελικός Έλεγχος: τα ολοκληρωμένα προϊόντα ελέγχονται για διαστατική ακρίβεια, αισθητική φινίρισμα, πληρότητα εξαρτημάτων και ακεραιότητα συσκευασίας πριν την αποστολή.'
    - 'Ανιχνευσιμότητα Παρτίδας: κάθε προϊόν φέρει σειριακό αριθμό συνδεδεμένο με τα αρχεία της παρτίδας παραγωγής, επιτρέποντας πλήρη ανιχνευσιμότητα από την πρώτη ύλη έως το τελικό προϊόν.'
content_safety:
  tagline: Πρότυπα Ναυτικής Ασφάλειας
  title: 'Ασφάλεια Πρώτα<br />— Σχεδιασμένο για Αξιόπιστη Λειτουργία'
  subtitle: 'Τα προϊόντα Aquafarer σχεδιάζονται και δοκιμάζονται ώστε να πληρούν τα διεθνή πρότυπα ναυτικής ασφάλειας για εμπορική και ψυχαγωγική χρήση.'
  items:
    - title: 'ISO 6185'
      description: 'Οι φουσκωτές βάρκες συμμορφώνονται με τα πρότυπα ISO 6185 για κατασκευή, ευστάθεια, άνωση και χωρητικότητα φορτίου.'
      icon: tabler:sailboat
    - title: 'Πρότυπα ABYC'
      description: 'Τα ηλεκτρικά συστήματα και τα συστήματα καυσίμου ακολουθούν τα πρότυπα ABYC (American Boat & Yacht Council) για ασφαλή εγκατάσταση και λειτουργία.'
      icon: tabler:bolt
    - title: 'Συμμόρφωση SOLAS'
      description: 'Ο εξοπλισμός ασφάλειας και τα σωσίβια μέσα πληρούν τις απαιτήσεις SOLAS (Safety of Life at Sea) όπου εφαρμόζεται.'
      icon: tabler:lifebuoy
cta:
  title: 'Χρειάζεστε πιστοποιημένα προϊόντα για το έργο σας;'
  subtitle: 'Επικοινωνήστε με την ομάδα μας για να συζητήσουμε απαιτήσεις πιστοποίησης, τεκμηρίωση και συμμόρφωση για την αγορά σας.'
  actions:
    - variant: primary
      text: Ζητήστε έγγραφα πιστοποίησης
      href: /contact
    - text: Δείτε τη σελίδα ποιότητάς μας
      href: /quality
