content_challenge:
  tagline: Η Πρόκληση
  title: Τα Αλιευτικά Χρειάζονται<br />Σταθερότητα, Ακτίνα Ενέργειας και Ανθεκτικότητα
  subtitle: Είτε εκμεταλλεύεστε εμπορικά αλιευτικά σκάφη, είτε διαχειρίζεστε έναν συνεταιριστικό στόλο είτε εκτελείτε ναυλώσεις αλιείας — το σκάφος σας πρέπει να αποδίδει αξιόπιστα καθημερινά.
  paragraphs:
    - Τα αλιευτικά σκάφη χρειάζονται σταθερές πλατφόρμες για την εργασία με τις γραμμές, τον χειρισμό της αλίευσης και την ασφαλή κίνηση στο κατάστρωμα. Τα φουσκωτά και τα RIB προσφέρουν εγγενή σταθερότητα μέσω του σχεδιασμού των σωλήνων — σημαντικό πλεονέκτημα έναντι άκαμπτων γάστρων παρόμοιου μήκους.
    - Η απόδοση καυσίμου έχει σημασία για τις αλιευτικές δραστηριότητες όπου το λειτουργικό κόστος επηρεάζει άμεσα την κερδοφορία. Τα RIB και τα φουσκωτά σκάφη είναι ελαφρύτερα από τα ισοδύναμα άκαμπτα σκάφη, απαιτούν λιγότερη ισχύ και καίνε λιγότερα καύσιμα — κρίσιμα για τους εμπορικούς φορείς εκμετάλλευσης που εκτελούν καθημερινά σκάφη και τους συνεταιρισμούς που διαχειρίζονται τους προϋπολογισμούς του στόλου.
    - Η ανθεκτικότητα σε θαλάσσια περιβάλλοντα είναι απαραίτητη. Το αλμυρό νερό, η έκθεση στην υπεριώδη ακτινοβολία και η συνεχής χρήση απαιτούν υλικά που αντέχουν σε σκληρές συνθήκες χωρίς υποβάθμιση. Για τους εμπορικούς και συνεταιριστικούς φορείς, η αξιοπιστία επηρεάζει άμεσα το εισόδημα — ένα σπασμένο σκάφος σημαίνει χαμένες ημέρες ψαρέματος.
    - Οι διαμορφώσεις ψαρέματος Paddle Board Overstock περιλαμβάνουν βάσεις για καλάμια, ψαροντάδες, πηγάδια δολωμάτων, ζωντανά φρεάτια και λύσεις διαχείρισης φορτίου που έχουν σχεδιαστεί για σοβαρές εφαρμογές αλιείας σε εμπορικές, συνεταιριστικές και ψυχαγωγικές δραστηριότητες.
content_solution:
  tagline: Η Λύση μας
  title: Ρυθμίσεις Έτοιμες για Αλιεία
  subtitle: Κάθε αλιευτικό σκάφος Paddle Board Overstock μπορεί να διαμορφωθεί για τη συγκεκριμένη αλιευτική σας εφαρμογή.
  list:
    - Τοποθέτηση βάσης καλαμιού — εργοστασιακά εγκατεστημένη ή έτοιμη για μετέπειτα τοποθέτηση
    - Πλάκα τοποθέτησης ιχθυοβολέα/GPS στη θέση της κονσόλας
    - Επιλογές δεξαμενής δολώματος ή ζωντανής δεξαμενής για ναυλωμένες και εμπορικές επιχειρήσεις
    - Ρυθμίσεις ψυγείου/αποθήκευσης για τον χειρισμό της αλίευσης
    - Γάστρο deep-V για δυνατότητες ανοιχτής θαλάσσης — σταθερό σε στάση, ομαλό σε ταχύτητα
    - Επιλογές σωλήνων PVC ή Hypalon — Hypalon για παρατεταμένη έκθεση σε UV
    - Εύρος εξωλέμβιων από 15 HP έως 115 HP ανάλογα με το μοντέλο και την εφαρμογή
content_segments:
  tagline: Προφίλ Ψαρέματος
  title: Λύσεις για φουσκωτά ψαροκάικα<br />Ανά τύπο χειριστή
  subtitle: Από το παράκτιο αθλητικό ψάρεμα μέχρι το εμπορικό παραγάδι — διαφορετικές αλιευτικές δραστηριότητες απαιτούν διαφορετικές διαμορφώσεις γάστρας, εύρος ισχύος και ρυθμίσεις στο κατάστρωμα. Προσαρμόζουμε κάθε σκάφος για να ταιριάζει με την αλιεία, τα νερά και το στυλ εργασίας.
  items:
    - title: Εμπορικές Εταιρείες Αλιείας
      subtitle: Σκάφη εργασίας στόλου για καθημερινές αλιευτικές δραστηριότητες, χειρισμό διχτυών, μεταφορά αλιευμάτων
      description: Οι εμπορικές αλιευτικές εταιρείες λειτουργούν σκάφη εργασίας για το στήσιμο και την ανάκτηση διχτυών, τη συντήρηση παγίδων, το παραγάδι και τη μεταφορά αλιευμάτων. Αυτά τα σκάφη εργάζονται καθημερινά σε περιβάλλοντα με θαλασσινό νερό και πρέπει να αντέχουν βαριά φορτία, συνεχή χειρισμό στο κατάστρωμα και πολλές ώρες λειτουργίας. Η απόδοση καυσίμου και η χαμηλή συντήρηση είναι κρίσιμα για την κερδοφορία του στόλου. Το σκάφος πρέπει να παρέχει σταθερές πλατφόρμες εργασίας για το χειρισμό των εργαλείων και των αλιευμάτων του πληρώματος σε διάφορες συνθήκες θάλασσας.
      features:
        - Επίπεδη διάταξη καταστρώματος για χειρισμό διχτυών, στοίβαξη παγίδων και αποθήκευση ψαριών
        - Εξωλέμβια 40-115 HP οικονομίας καυσίμου για χαμηλό ημερήσιο κόστος λειτουργίας
        - Σωλήνες βαρέως τύπου Hypalon για αντοχή στην τριβή σε καθημερινή χρήση
        - Ενισχυμένες λωρίδες τριβής για συχνή επαφή αποβάθρας και σκάφους
        - Αυτοδιατηρούμενο κατάστρωμα για εύκολο πλύσιμο μετά τις εργασίες
        - Τιμολόγηση στόλου και σταθερές προδιαγραφές για φορείς εκμετάλλευσης πολλών σκαφών
    - title: Χάρτες αλιείας
      subtitle: Άνεση πολλών επιβατών, χειρισμός αλιευμάτων, πιστοποιημένη ασφάλεια
      description: Φορείς που εκτελούν μισή ημέρα και ολοήμερη ναύλωση αλιείας — από ψάρεμα παράκτιων υφάλων έως ψάρεμα ανοικτής θαλάσσης. Το σκάφος σας χρειάζεται καθίσματα επιβατών με πιστοποιητικά ασφαλείας, άφθονο χώρο στο κατάστρωμα για πολλούς ψαράδες και ενσωματωμένα ζωντανά φρεάτια για τη διατήρηση του δολώματος και των αλιευμάτων φρέσκα σε όλη τη διάρκεια του ταξιδιού. Η άνεση των επισκεπτών επηρεάζει άμεσα τις κριτικές ταξιδιών, τις επαναλαμβανόμενες κρατήσεις και τις διαδικτυακές αξιολογήσεις.
      features:
        - Κονσόλα διεύθυνσης με μπάκετ καθίσματα που απορροφούν τους κραδασμούς
        - Εργοστασιακά τοποθετημένες ράβδοι (4–8 θέσεις)
        - Εύρος εξωλέμβιας 60–115 HP για ταχύτητες πλεύσης ανοικτής θαλάσσης
        - CE Πιστοποίηση κατηγορίας Γ ή Β για εμπορικές επιβατικές μεταφορές
        - Bimini ή T-top σκίαστρο για άνεση επισκεπτών σε εκτεταμένα ταξίδια
    - title: Βιοτεχνικοί & Εμπορικοί Ψαράδες Μικρής Κλίμακας
      subtitle: Αξιόπιστα σκάφη εργασίας για καθημερινή ζωή
      description: Ανεξάρτητοι ψαράδες που βασίζονται στο σκάφος τους ως κύρια πηγή εισοδήματός τους — στήνοντας δίχτυα, φροντίζοντας παγίδες ψαριών ή χειραγωγώντας κοντά στην ακτή. Η προτεραιότητά σας είναι η οικονομία καυσίμου, η απλή συντήρηση που μπορείτε να κάνετε μόνοι σας και ένα σκάφος που χειρίζεται μέτρια φορτία αλιευμάτων και εργαλείων χωρίς να θυσιάζει τη σταθερότητα.
      features:
        - Απόδοση καυσίμου 15–40 HP εξωλέμβια για χαμηλό κόστος λειτουργίας
        - Hypalon CSM σωλήνες για εκτεταμένη αντοχή στην υπεριώδη ακτινοβολία και την τριβή
        - Επίπεδη διάταξη καταστρώματος για χειρισμό διχτυών και αποθήκευση ψαριών
        - Δυνατότητα εύκολης προσγείωσης στην παραλία με φουσκωτή προστασία καρίνας
    - title: Αλιευτικοί Συνεταιρισμοί
      subtitle: Συλλογή αλιευμάτων, μεταφορά μελών, διανομή προμηθειών
      description: Οι αλιευτικοί συνεταιρισμοί λειτουργούν στόλους με βάση την κοινότητα για τη συλλογή αλιευμάτων από αλιείς μέλη, τη μεταφορά προμηθειών σε απομακρυσμένες αλιευτικές κοινότητες και τη διανομή της σοδειάς στις αγορές. Αυτά τα σκάφη εργασίας χρειάζονται υψηλή χωρητικότητα ωφέλιμου φορτίου, αξιόπιστη καθημερινή λειτουργία και εύκολη συντήρηση σε απομακρυσμένες τοποθεσίες. Οι συνεταιρισμοί δραστηριοποιούνται συχνά σε αναπτυσσόμενες περιοχές όπου η διαθεσιμότητα ανταλλακτικών και η πρόσβαση σε υπηρεσίες είναι περιορισμένες, καθιστώντας τις απλές εξωλέμβιες διαμορφώσεις και την ανθεκτική κατασκευή απαραίτητες.
      features:
        - Υψηλή χωρητικότητα ωφέλιμου φορτίου για τη μεταφορά αλιευμάτων και προμηθειών
        - Απλή διαμόρφωση εξωλέμβιας για εύκολη επιτόπια συντήρηση
        - Κατασκευή βαρέως τύπου PVC ή Hypalon για ευελιξία προϋπολογισμού
        - Επίπεδο κατάστρωμα με σημεία πρόσδεσης για ασφάλιση φορτίου
        - Λειτουργία με αποδοτική κατανάλωση καυσίμου ελαχιστοποιώντας το συνεταιριστικό λειτουργικό κόστος
    - title: Λάτρεις του αθλητισμού και του ψαρέματος παιχνιδιών
      subtitle: Απόδοση και στυλ για σοβαρούς ψαράδες
      description: Έμπειροι ψαράδες που αναζητούν μια ικανή πλατφόρμα ψαρέματος που προσφέρει ταχύτητα σε μακρινά εδάφη, σταθερές θέσεις όρθιας μάχης και κορυφαία εφαρμογή και φινίρισμα. Το σκάφος πρέπει να αισθάνεται σαν στο σπίτι του είτε τρέχει δύο μίλια από την ακτή σε έναν ύφαλο είτε εξερευνά απομακρυσμένα τέλματα εκβολών ποταμών.
      features:
        - Γάστρα Deep-V RIB για ομαλή οδήγηση στην μπριζόλα
        - Η πλάκα στήριξης Fishfinder/GPS είναι προ-καλωδιωμένη στην κονσόλα
        - Δόλωμα και ψυγείο ενσωματωμένα στη μονάδα πίσω καθίσματος
        - Προσαρμοσμένες επιλογές χρωμάτων EVA καταστρώματος που ταιριάζουν με γραφικά σκάφους/σωλήνες
    - title: Οδηγός ψαρέματος & Eco-Tour Operators
      subtitle: Καθοδηγούμενες εμπειρίες ψαρέματος για επισκέπτες ψαράδες
      description: Οδηγοί που μεταφέρουν μικρές ομάδες επισκεπτών ψαράδων σε παραγωγικά σημεία ψαρέματος — συχνά συνδυάζουν το ψάρεμα με στοιχεία οικολογικού τουρισμού, όπως παρατήρηση πουλιών ή εξερεύνηση μαγγροβίων. Το σκάφος πρέπει να οδηγεί στεγνό και άνετο για επισκέπτες που δεν είναι συνηθισμένοι σε μικρά σκάφη, με εύκολη επιβίβαση και επιλογές σκιάς.
      features:
        - Bimini top ή T-top σημεία στήριξης εργοστασιακά εγκατεστημένα
        - Ομαλή σκάλα επιβίβασης για εύκολη επανεπιβίβαση
        - Αθόρυβη τετράχρονη εξωλέμβια για ελαχιστοποίηση της ενόχλησης
        - Αποθηκευτικοί χώροι αποθήκευσης για τηλέφωνα επισκεπτών, πορτοφόλια, κάμερες
