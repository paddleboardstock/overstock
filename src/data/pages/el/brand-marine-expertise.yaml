hero:
  tagline: Ναυτιλιακή τεχνογνωσία
  title: 'Δεκαετίες ναυτικής μηχανικής<br />σε κάθε γάστρα'
  subtitle: 'Η Paddle Board Overstock συνδυάζει βαθιά επιστήμη υλικών, ακριβή κατασκευή και δοκιμές στον πραγματικό κόσμο για να παράγει σκάφη που αποδίδουν όταν μετράει.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Η ομάδα ναυτικής μηχανικής και R&D της Paddle Board Overstock στη δουλειά
expertise_materials:
  tagline: Επιστήμη υλικών
  title: 'Επιλογή του σωστού υλικού<br />για κάθε εφαρμογή'
  subtitle: 'Δουλεύουμε με τρία βασικά υλικά — το καθένα επιλεγμένο για συγκεκριμένες χρήσεις και απαιτήσεις απόδοσης.'
  columns: 3
  items:
    - title: PVC ναυτικού βαθμού
      description: 'Ύφασμα PVC 1100 denier — το πιο ευέλικτο υλικό μας. Ευσταθές στην UV, ανθεκτικό στη φθορά και σύμφωνο με τον κανονισμό REACH. Ιδανικό για σκάφη αναψυχής, SUP και καγιάκ όπου μετράνε το βάρος και η οικονομικότητα.'
      icon: tabler:droplet
    - title: Hypalon/CSM Premium
      description: 'Ανώτερη χημική αντοχή και σταθερότητα στην UV. Τα σκάφη Hypalon μπορούν να αντέξουν 15-20 χρόνια με σωστή φροντίδα. Προτείνεται για εμπορικές, διασωστικές και στρατιωτικές εφαρμογές όπου η μακροχρόνια ανθεκτικότητα είναι κρίσιμη.'
      icon: tabler:shield
    - title: Ίνες γυαλιού και αλουμίνιο
      description: 'Γάστρες από ίνες γυαλιού με βαθύ V για RIB και σκάφη περιπολίας — απόδοση που κόβει τα κύματα σε δύσκολες συνθήκες. Γάστρες αλουμινίου για βαριά επαγγελματικά σκάφη εργασίας που απαιτούν μέγιστη αντοχή και χωρητικότητα φορτίου.'
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Δυνατότητες παραγωγής
  title: 'Ακριβής κατασκευή<br />σε κάθε βήμα'
  subtitle: 'Η μονάδα μας των 12.000 m² είναι εξοπλισμένη με εξειδικευμένα μηχανήματα για κάθε στάδιο παραγωγής.'
  columns: 2
  items:
    - title: Κοπή CNC
      description: 'Η ελεγχόμενη από υπολογιστή κοπή εξασφαλίζει ακριβή, επαναλήψιμα πανιά υφάσματος με ελάχιστα απόβλητα. Κάθε κομμάτι ταιριάζει ακριβώς όπως σχεδιάστηκε.'
      icon: tabler:cpu
    - title: Συγκόλληση υψηλής συχνότητας
      description: 'Η βιομηχανική συγκόλληση HF δημιουργεί ραφές ισχυρότερες από το βασικό υλικό. Σταθερός έλεγχος θερμοκρασίας και πίεσης εξασφαλίζει αεροστεγείς ενώσεις σε κάθε παρτίδα παραγωγής.'
      icon: tabler:bolt
    - title: Συναρμολόγηση πυρήνα drop-stitch
      description: 'Χιλιάδες νήματα πολυεστέρα συνδέουν την επάνω και την κάτω στρώση υφάσματος, επιτρέποντας φούσκωμα υψηλής πίεσης (15-20 PSI) για άκαμπτες, σταθερές σανίδες SUP και δάπεδα.'
      icon: tabler:building-arch
    - title: Δοκιμή πίεσης
      description: 'Κάθε φουσκωτό προϊόν δοκιμάζεται σε πίεση πριν την αποστολή. Οι σωλήνες RIB δοκιμάζονται στο 1,25x της ονομαστικής πίεσης — αν αντέξει εκεί, θα αποδώσει στο νερό.'
      icon: tabler:wind
    - title: Δοκιμή αντοχής ραφών
      description: 'Τυχαία δείγματα από κάθε παρτίδα παραγωγής υποβάλλονται σε καταστροφικές δοκιμές αντοχής ραφών. Τα αποτελέσματα καταγράφονται και ανιχνεύονται σε συγκεκριμένες παρτίδες.'
      icon: tabler:files
    - title: Δοκιμή στο νερό
      description: 'Κάθε μοντέλο RIB υφίσταται θαλάσσιες δοκιμές πριν την πιστοποίηση. Οι δοκιμές σε πραγματικές παράκτιες συνθήκες επικυρώνουν την απόδοση, τον χειρισμό και τη σταθερότητα.'
      icon: tabler:ripple
expertise_design:
  tagline: Σχεδιασμός & μηχανική
  title: 'Μηχανική για πραγματικές συνθήκες'
  subtitle: 'Η φιλοσοφία σχεδιασμού μας ξεκινά από το πώς θα χρησιμοποιηθεί το σκάφος — και μετά χτίζει τη μηχανική γύρω από αυτή τη χρήση.'
  items:
    - title: Σχεδιασμός γάστρας βαθέος V
      description: "Οι γάστρες μας από ίνες γυαλιού διαθέτουν υπολογισμένες γωνίες V, βελτιστοποιημένες για το μήκος και τη χρήση κάθε μοντέλου. Πιο απότομο V για απόδοση σε τρικυμία, πιο ρηχό για σταθερότητα."
    - title: Ασφάλεια πολλαπλών θαλάμων
      description: 'Κάθε σκάφος διαθέτει 3-7 ανεξάρτητους θαλάμους αέρα. Αν ένας θάλαμος καταστραφεί, οι υπόλοιποι κρατούν το σκάφος να επιπλέει και λειτουργικό.'
    - title: Εργονομική διάταξη
      description: 'Η θέση κονσόλας, το ύψος σωλήνα και η τοποθέτηση καθισμάτων σχεδιάζονται γύρω από την άνεση του χειριστή σε παρατεταμένη χρήση — είτε σε περιπολία, ψάρεμα ή μεταφορά.'
    - title: Προσαρμοσμένη διαμόρφωση
      description: 'Χρώματα σωλήνων, διαμόρφωση κονσόλας, χωρητικότητα καυσίμου, βάσεις αξεσουάρ — κάθε μοντέλο μπορεί να προσαρμοστεί σε συγκεκριμένες λειτουργικές απαιτήσεις.'
cta:
  title: 'Έχετε μια συγκεκριμένη εφαρμογή στο μυαλό;'
  subtitle: 'Η ομάδα μηχανικών μας μπορεί να σας συμβουλεύσει για την επιλογή υλικών, το σχεδιασμό και την κατασκευή του έργου σας.'
  actions:
    - variant: primary
      text: Ρωτήστε τους μηχανικούς μας
      href: /contact
    - text: Δείτε τη γκάμα προϊόντων
      href: /products
