reasons:
  tagline: Η Aquafarer Διαφορά
  title: Τι μας ξεχωρίζει
  isBeforeContent: false
  columns: 3
  items:
    - title: Πραγματική Κατασκευή, Όχι Εμπόριο
      description: Είμαστε ιδιοκτήτες και λειτουργούμε ένα εργοστάσιο 12.000 μ². Όταν συνεργάζεστε με την Aquafarer, εργάζεστε απευθείας με τους ανθρώπους που σχεδιάζουν, μηχανολογούν και κατασκευάζουν τα προϊόντα σας — χωρίς μεσάζοντες.
      icon: tabler:building-factory
    - title: Προσέγγιση που καθοδηγείται από τη μηχανική
      description: Η διαδικασία σχεδίασής μας ξεκινά με τη χρήση της περίπτωσης, όχι με την κατηγορία προϊόντος. Βελτιστοποιούμε το σχήμα του σκάφους, την επιλογή υλικού και τη διαμόρφωση με βάση το πώς θα χρησιμοποιείται πραγματικά ο εξοπλισμός σε εμπορικά περιβάλλοντα.
      icon: tabler:engine
    - title: Πιστοποιημένη Ποιότητα
      description: CE πιστοποιημένα, ISO σύστημα ποιότητας, BSCI συμμορφούμενα, REACH συμμορφούμενα, USCG Σωσίβια τύπου III/V εγκεκριμένα· όλα τα προϊόντα πληρούν τα εφαρμοστέα διεθνή πρότυπα.
      icon: tabler:certificate
    - title: Ευέλικτο OEM/ODM
      description: Χρώματα σωλήνων, διάταξη κονσόλας, εμπορική σήμανση, συσκευασία — προσαρμόζουμε σύμφωνα με τις προδιαγραφές σας. Χωρίς πίεση για ελάχιστη παραγγελία. Ξεκινήστε με ένα πρωτότυπο, αναπτυχθείτε με σιγουριά.
      icon: tabler:adjustments
    - title: Παγκόσμια εφοδιαστική
      description: Αποθήκη στις ΗΠΑ στην Καλιφόρνια, άμεση αποστολή από την Τσινγκντάο, αεροπορική μεταφορά για επείγοντα παραγγελίες. Διαχειριζόμαστε τα τελωνειακά έγγραφα και τα έγγραφα παγκοσμίως.
      icon: tabler:truck-delivery
    - title: Υποστήριξη διάρκειας ζωής
      description: Υποστηρίζουμε σκάφη που κατασκευάσαμε πριν από 20 χρόνια. Γνήσια ανταλλακτικά, τεχνικές συμβουλές, καθοδήγηση για επισκευές — η ομάδα μας είναι διαθέσιμη όταν μας χρειάζεστε, όπου κι αν βρίσκεστε.
      icon: tabler:lifebuoy
testimonials:
  tagline: Αξιοποιείται από επώνυμες μάρκες παγκοσμίως
  title: Τι Λένε οι Συνεργάτες μας
  items:
    - content: Έχουμε συνεργαστεί με αρκετούς κατασκευαστές στην Κίνα, αλλά Aquafarer ξεχωρίζει για την τεχνική υποστήριξή τους και την σταθερή ποιότητα. Αντιμετωπίζουν το εμπορικό μας σήμα σαν να ήταν δικό τους.
      name: — OEM Συνεργάτης, Ευρωπαϊκή Μάρκα Θαλάσσιων Αθλημάτων
    - content: Τα Hypalon RIBs τους είναι σε υπηρεσία με τον στόλο μας για πάνω από 5 χρόνια. Ελάχιστη συντήρηση, εξαιρετική αντοχή UV. Η 5ετής εγγύηση στα σωλήνες μας δίνει εμπιστοσύνη.
      name: — Διαχειριστής Στόλου, Ομάδα Θέρετρων Μέσης Ανατολής
    - content: Η ομάδα Aquafarer μας βοήθησε να αναπτύξουμε έναν προσαρμοσμένο σχεδιασμό πλακέτας SUP από την ιδέα έως την παραγωγή σε 90 ημέρες. Η ποιότητα ξεπέρασε τις προσδοκίες μας.
      name: — Διανομέας, Australian Watersports
    - content: Ως ιδιοκτήτης μικρής επιχείρησης, ανησυχούσα για MOQs. Το Aquafarer συνεργάστηκε με τον προϋπολογισμό μου και με βοήθησε να ξεκινήσω το brand μου με μόλις 50 πίνακες. Τώρα παραγγέλνω 500.
      name: — Ιδρυτής Μάρκας, ΗΠΑ SUP Εταιρεία Ενοικιάσεων
