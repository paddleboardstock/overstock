hero:
  tagline: Γιατί Aquafarer
  title: Κατασκευασμένο διαφορετικά. Κατασκευασμένο για επιχειρήσεις.<br />Ο συνεργάτης πίσω από τις υδάτινες περιπέτειες παγκοσμίως
  subtitle: Όχι απλώς ένας κατασκευαστής — ένας επιχειρηματικός συνεργάτης που σχεδιάζει, μηχανολογεί και παραδίδει εξοπλισμό επαγγελματικού επιπέδου για συλλόγους, θέρετρα, λειτουργούς ενοικίασης και αναδυόμενες μάρκες νερού.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Ποιότητα και τεχνογνωσία κατασκευής
pillars:
  tagline: Τρεις Στήλες της Συνεργασίας
  title: Γιατί οι εταιρείες νερού στον κόσμο επιλέγουν Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Σχεδιασμένο για επαγγελματική χρήση
      description: Ο εξοπλισμός μας έχει σχεδιαστεί για καθημερινή ενοικίαση, όχι για ψυχαγωγία τα Σαββατοκύριακα. Επαγγελματικού επιπέδου PVC, ενισχυμένοι drop-stitch πυρήνες, UV-σταθερές Hypalon επιλογές και υλικό δοκιμασμένο στο πεδίο σημαίνουν χαμηλότερη συντήρηση, μεγαλύτερη διάρκεια ζωής και υψηλότερο ROI για τη λειτουργία σας.
      icon: tabler:building-factory
      callToAction:
        text: Δείτε τη γραμμή εμπορικών προϊόντων
        href: /products
    - title: Από την Ιδέα στην Αγορά
      description: 'Ξεκινήστε το εμπορικό σας σήμα υδάτινων σπορ σε 90 ημέρες. Σας καθοδηγούμε σε κάθε βήμα: επικύρωση της ιδέας, επιλογή προϊόντος, πρωτότυπο, παραγωγή, σχεδιασμός συσκευασίας και παγκόσμια αποστολή. Χωρίς πίεση για ελάχιστη παραγγελία — ξεκινήστε μικρά, αναπτυχθείτε με αυτοπεποίθηση.'
      icon: tabler:rocket
      callToAction:
        text: Ξεκινήστε το ταξίδι της μάρκας σας
        href: /oem-odm-blueprint
    - title: Κατασκευασμένο για παγκόσμιες συνθήκες
      description: 'Προϊόντα βελτιστοποιημένα για κάθε κλίμα: συνθέσεις για κρύο νερό PVC για την Ευρώπη, υλικά ανθεκτικά σε UV για τη Μέση Ανατολή και την Αυστραλία, θεραπείες κατά της υγρασίας για τη Νοτιοανατολική Ασία. Κάθε αποστολή είναι ρυθμισμένη σύμφωνα με το περιβάλλον προορισμού της.'
      icon: tabler:world
