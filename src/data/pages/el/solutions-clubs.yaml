hero:
  tagline: Σύλλογοι Θαλάσσιων Σπορ
  title: Εξοπλισμός & Λύσεις<br />Για Καμπίνες & Εκπαιδευτικά Κέντρα
  subtitle: Ολοκληρωμένα πακέτα εργαλείων, εξοπλισμός εκπαιδευτών, επωνυμία και υποστήριξη συντήρησης για κλαμπ SUP, λέσχες καγιάκ, σχολές σέρφινγκ και προπονητικά κέντρα θαλάσσιων σπορ οποιουδήποτε μεγέθους.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Πίνακες Aquafarer SUP για κλαμπ θαλάσσιων σπορ και ενοικιαζόμενους στόλους
direct_answer: Η Aquafarer παρέχει ολοκληρωμένες λύσεις εξοπλισμού για κλαμπ και προπονητικά κέντρα θαλάσσιων σπορ σε όλο τον κόσμο. Τα πακέτα κλαμπ μας περιλαμβάνουν σανίδες SUP, καγιάκ, κουπιά, αντλίες, κιτ επισκευής και εξοπλισμό ασφαλείας σε ανταγωνιστικές τιμές χονδρικής με χαμηλά MOQ. Κάθε πακέτο μπορεί να προσαρμοστεί με λογότυπα κλαμπ, επώνυμα χρώματα και εξατομικευμένη συσκευασία. Παρέχουμε επίσης εκπαίδευση συντήρησης, υποστήριξη ανταλλακτικών και προγράμματα εναλλαγής εξοπλισμού για να μεγιστοποιήσετε τη διάρκεια ζωής του στόλου σας.
solution_offerings:
  - title: Club Starter πακέτο
    subtitle: Για ανερχόμενους συλλόγους με 10–30 μέλη
    badge: Best Seller
    features:
      - title: Βασικός Εξοπλισμός
        description: 10–30 σανίδες SUP ή καγιάκ με ταιριαστά κουπιά, αντλίες και κιτ επισκευής
      - title: Εξοπλισμός Ασφαλείας
        description: Σωσίβια, σφυρίχτρα, σετ λουριών σε κλαμπ χρώματα για κάθε σανίδα
      - title: Εξοπλισμός εκπαιδευτή
        description: Πίνακες ειδικά για προπονητές με αντιολισθητικά καταστρώματα και επιπλέον σταθερότητα
      - title: Πακέτο επωνυμίας
        description: Προσαρμοσμένη εκτύπωση λογότυπου σε σανίδες, κουπιά και συσκευασία
      - title: Εκπαιδευτικό Υλικό
        description: Οδηγοί μαθημάτων για αρχάριους, πρωτόκολλα ασφαλείας και λίστες ελέγχου συντήρησης
    cta_text: 'Δημιουργήστε το πακέτο του συλλόγου μου'
    cta_href: /contact
  - title: Club Premium πακέτο
    subtitle: Για εγκατεστημένους συλλόγους και φορείς πολλαπλών τοποθεσιών
    badge: Professional
    features:
      - title: Πλήρης Στόλος
        description: 30–100 μικτός στόλος SUP, καγιάκ και αξεσουάρ
      - title: Προηγμένο Σύστημα Ασφαλείας
        description: Παρακολούθηση εξοπλισμού RFID, εφαρμογή αναφοράς ζημιών, σήμανση ασφαλείας
      - title: Εκπαίδευση Προσωπικού
        description: Επιτόπου εργαστήριο πιστοποίησης εκπαιδευτών και συντήρησης εξοπλισμού
      - title: Υποστήριξη Μάρκετινγκ
        description: Επαγγελματική φωτογραφία, μπροσούρες και πρότυπα κοινωνικών μέσων
      - title: Πρόγραμμα αντικατάστασης
        description: Ετήσια ανανέωση εξοπλισμού σε μειωμένες τιμές με επιλογές ανταλλαγής
    cta_text: 'Αναπτύξτε τον σύλλογό μου'
    cta_href: /contact
