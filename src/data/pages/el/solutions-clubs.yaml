testimonial:
  content: Ξεκινήσαμε με το Club Starter Package για τη σχολή μας σερφ στην Πορτογαλία. 20 σανίδες, κουπιά, γιλέκα — όλα έφτασαν μέσα σε 3 εβδομάδες. Μετά από δύο σεζόν, αναβαθμίσαμε στο πακέτο Pro. Η προσαρμοσμένη επωνυμία με το λογότυπό μας άλλαξε το παιχνίδι για την επαγγελματική μας εικόνα.
  name: Ρικάρντο Σάντος
  title: Ιδιοκτήτης, Algarve Surf Academy — Λάγος, Πορτογαλία
content_segments:
  tagline: Προφίλ Λέσχης
  title: Λύσεις συλλόγων για θαλάσσια σπορ<br />Ανά τύπο συλλόγου
  subtitle: Από πανεπιστημιακές λέσχες κωπηλασίας έως αποκλειστικές ιδιωτικές λέσχες γιοτ — κάθε τύπος λέσχης έχει μοναδικές ανάγκες εξοπλισμού, πρότυπα χρήσης και δομές προϋπολογισμού. Προσαρμόζουμε κάθε πακέτο ώστε να ταιριάζει με το μοντέλο του club.
  items:
    - title: Πανεπιστημιακές & Κολλεγιακές Λέσχες Κωπηλασίας
      subtitle: Μαθητικοί στόλοι υψηλής χρήσης
      description: Φοιτητές ή υποστηριζόμενες από ιδρύματα λέσχες κωπηλασίας που λειτουργούν προγράμματα SUP και καγιάκ για πανεπιστημιακά τμήματα αναψυχής. Ο εξοπλισμός αντιμετωπίζει χρήση υψηλής συχνότητας και υψηλού κύκλου εργασιών σε πολλαπλά επίπεδα δεξιοτήτων κάθε εξάμηνο. Η ανθεκτικότητα και η εύκολη επισκευή είναι ζωτικής σημασίας, παράλληλα με τις φιλικές προς τον προϋπολογισμό τιμές για τις φοιτητικές οργανώσεις.
      features:
        - 'Πολύ ανθεκτική κατασκευή PVC για κύκλους φοιτητικής χρήσης'
        - 'Χρωματική κωδικοποίηση σειρών σανίδων ανά επίπεδο για εύκολη διαχείριση στόλου'
        - 'Κιτ επισκευής + υποστήριξη βίντεο κατόπιν αιτήματος σε κάθε παραγγελία'
        - 'Ειδικές τιμές για φοιτητικές οργανώσεις και πληρωμή ανά εξάμηνο'
    - title: Κωπηλασία κοινότητας και κοινωνικές λέσχες
      subtitle: Ψυχαγωγικοί σύλλογοι με γνώμονα τα μέλη
      description: Κλαμπ με βάση την κοινότητα που προσφέρουν εμπειρίες SUP, καγιάκ και κοινωνικής κωπηλασίας στα μέλη. Ο εξοπλισμός πρέπει να εξισορροπεί την απόδοση και την άνεση για ένα ευρύ φάσμα ηλικιών, με επωνυμία που ενισχύει την ταυτότητα του συλλόγου και την υπερηφάνεια των μελών. Η αποδοτικότητα αποθήκευσης είναι το κλειδί για κλαμπ που λειτουργούν από περιορισμένη πρόσβαση στην προκυμαία.
      features:
        - 'Μικτός στόλος: SUP όλων των χρήσεων, σανίδες touring και ψυχαγωγικά kayak'
        - 'Πλήρης εταιρική ταυτότητα συλλόγου: προσαρμοσμένα χρώματα, εκτύπωση λογοτύπου, σωσίβια με το λογότυπο'
        - 'Συμπαγείς λύσεις αποθήκευσης για φουσκωτό εξοπλισμό'
        - 'Σετ έναρξης για αύξηση μελών: κάρτες παραπομπής, φωτογράφιση με την ταυτότητα του συλλόγου'
    - title: Σχολές Surf & Ακαδημίες Σερφ Καγιάκ
      subtitle: Παράκτιες επιδόσεις και προπονητική
      description: Σχολές που επικεντρώνονται στο Surf διδάσκουν δεξιότητες SUP surfing, surf kayak και wave riding. Ο εξοπλισμός πρέπει να λειτουργεί σε συνθήκες σερφ — ευέλικτο, ανταποκρινόμενο και αρκετά ανθεκτικό ώστε να χειρίζεται επαναλαμβανόμενα σκουπίδια, τριβή άμμου και έκθεση σε αλμυρό νερό χωρίς ταχεία υποβάθμιση.
      features:
        - 'Κοντύτερα, φαρδύτερα σχήματα SUP βελτιστοποιημένα για ελιγμούς στο κύμα'
        - 'Ενισχυμένη κατασκευή rails για αντοχή σε κρούσεις στα κύματα'
        - 'Εξοπλισμός ασφαλείας για σερφ: σπειροειδή leash, επιλογές μαλακών πτερυγίων'
        - 'Πρόγραμμα αντικατάστασης στόλου με εποχιακές εκπτώσεις ανταλλαγής'
    - title: Εταιρικοί & Ιδιωτικοί Yacht Clubs
      subtitle: Εμπειρίες μελών Premium
      description: Αποκλειστικά ιδιωτικά κλαμπ που προσφέρουν θαλάσσια σπορ ως εξαιρετική άνεση για τα μέλη. Τα πρότυπα εξοπλισμού είναι υψηλά — η αισθητική, η ευθυγράμμιση της επωνυμίας και η παρουσίαση που είναι έτοιμη για τους επισκέπτες είναι εξίσου σημαντικά με την απόδοση. Οι προσδοκίες υπηρεσιών περιλαμβάνουν παράδοση λευκών γαντιών, προσαρμοσμένες λύσεις αποθήκευσης και υποστήριξη σε επίπεδο θυρωρού.
      features:
        - 'Σανίδες premium φινιρίσματος με EVA υφής ξύλου και μεταλλικές λεπτομέρειες'
        - 'Εξατομικευμένη αντιστοίχιση χρωμάτων σύμφωνα με τις κατευθυντήριες γραμμές του συλλόγου'
        - 'Παράδοση τύπου concierge: προσφουσκωμένες, στημένες και επισημασμένες για κάθε σεζόν'
        - 'Αποκλειστικός διαχειριστής λογαριασμού με προτεραιότητα SLA απόκρισης'
