features3_reasons:
  tagline: Γιατί να επιλέξετε την Paddle Board Overstock
  title: 'Επτά λόγοι για να γίνετε συνεργάτης μας'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Πραγματική κατασκευή, όχι εμπόριο'
      description: 'Είμαστε ιδιοκτήτες και διαχειριζόμαστε εργοστάσιο 12.000 m². Συνεργαζόμενοι με την Paddle Board Overstock, εργάζεστε απευθείας με τους ανθρώπους που σχεδιάζουν, μηχανουργούν και κατασκευάζουν τα προϊόντα σας — χωρίς μεσάζοντες.'
      icon: tabler:building-factory
    - title: '2. Προσέγγιση με βάση τη μηχανική'
      description: 'Η διαδικασία σχεδιασμού μας ξεκινά από τη χρήση, όχι από την κατηγορία προϊόντος. Βελτιστοποιούμε το σχήμα της γάστρας, την επιλογή υλικών και τη διαμόρφωση με βάση το πώς θα χρησιμοποιηθεί πραγματικά η βάρκα.'
      icon: tabler:engine
    - title: '3. Πιστοποιημένη ποιότητα'
      description: 'Πιστοποίηση CE, σύστημα ποιότητας ISO, συμμόρφωση BSCI, συμμόρφωση REACH, έγκριση USCG. Τα 64 μοντέλα μας με πιστοποίηση CE πληρούν τα διεθνή πρότυπα — όχι απλώς ισχυρισμοί.'
      icon: tabler:certificate
    - title: '4. Ευέλικτο OEM/ODM'
      description: 'Χρώματα σωλήνων, διάταξη κονσόλας, επωνυμία, συσκευασία — προσαρμόζουμε όλα στις προδιαγραφές σας. Καμία πίεση ελάχιστης παραγγελίας. Ξεκινήστε με ένα πρωτότυπο και κλιμακώστε με σιγουριά.'
      icon: tabler:adjustments
    - title: '5. Παγκόσμια εφοδιαστική'
      description: 'Αποθήκη στις ΗΠΑ στην Καλιφόρνια, απευθείας αποστολές από Qingdao, αεροπορικές μεταφορές για επείγουσες παραγγελίες. Αναλαμβάνουμε τα τελωνειακά έγγραφα και την τεκμηρίωση.'
      icon: tabler:truck-delivery
    - title: '6. Υποστήριξη εφ'' όρου ζωής'
      description: 'Υποστηρίζουμε σκάφη που κατασκευάσαμε πριν από 20 χρόνια. Γνήσια ανταλλακτικά, τεχνικές συμβουλές, καθοδήγηση επισκευής — η ομάδα μας είναι διαθέσιμη όταν μας χρειάζεστε.'
      icon: tabler:lifebuoy
    - title: '7. Ειλικρινείς προδιαγραφές'
      description: 'Πραγματική φορτωτική ικανότητα, πραγματικές διαστάσεις, πραγματικό βάρος. Χωρίς διαφημιστικές υπερβολές. Όσα δημοσιεύουμε είναι όσα λαμβάνετε — επιβεβαιωμένο από ανεξάρτητες δοκιμές.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Εμπιστοσύνη από μάρκες παγκοσμίως
  title: Τι λένε οι συνεργάτες μας
  items:
    - content: 'Έχουμε συνεργαστεί με αρκετούς κατασκευαστές στην Κίνα, αλλά η Paddle Board Overstock ξεχωρίζει για τη μηχανική υποστήριξη και τη συνεπή ποιότητα. Αντιμετωπίζουν τη μάρκα μας ως δική τους.'
      name: '— Συνεργάτης OEM, ευρωπαϊκή μάρκα θαλάσσιων σπορ'
    - content: 'Τα Hypalon RIB τους βρίσκονται σε υπηρεσία στον στόλο μας πάνω από 5 χρόνια. Ελάχιστη συντήρηση, εξαιρετική αντοχή στην UV. Η εγγύηση 5 ετών στους σωλήνες μάς δίνει σιγουριά.'
      name: '— Χειριστής στόλου, όμιλος θέρετρων στη Μέση Ανατολή'
    - content: 'Η ομάδα της Paddle Board Overstock μάς βοήθησε να αναπτύξουμε ένα προσαρμοσμένο σχέδιο SUP board από την ιδέα έως την παραγωγή σε 90 ημέρες. Η ποιότητα ξεπέρασε τις προσδοκίες μας.'
      name: '— Διανομέας, αυστραλιανά θαλάσσια σπορ'
cta:
  title: 'Έτοιμοι να νιώσετε τη διαφορά;'
  subtitle: 'Επικοινωνήστε με την ομάδα μας για να συζητήσουμε το έργο σας. Χωρίς δέσμευση — μόνο ειλικρινείς συμβουλές για την κατασκευή.'
  actions:
    - variant: primary
      text: Μιλήστε με την ομάδα μας
      href: /contact
    - text: Λήψη καταλόγου προϊόντων
      href: /resources
