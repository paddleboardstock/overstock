hero:
  tagline: Σχετικά με την εταιρεία
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Εργαστήριο Aquafarer
  title: |
    Ναυτική μηχανική <br />
    σε στιλ <span class="text-accent dark:text-white">Aquafarer</span>
  subtitle: 'Ξεκινήσαμε σε ένα παραθαλάσσιο εργαστήριο με ένα σκάφος και μια ακλόνητη πεποίθηση: τα θαλάσσια προϊόντα πρέπει να σχεδιάζονται σαν να εξαρτώνται ζωές από αυτά – γιατί έτσι είναι. Σήμερα, εξάγουμε σε 40+ χώρες, αλλά κάθε γάστρα περνά ακόμα από τα ίδια χέρια που ίδρυσαν την εταιρεία.'

stats:
  title: Με αριθμούς
  columns: 4
  stats:
    - title: Παραδοθείσες γάστρες
      amount: '2,400+'
    - title: Χώρες παράδοσης
      amount: '50+'
    - title: Συνολική εμπειρία (έτη)
      amount: '60'
    - title: Μέσος χρόνος απόκρισης (ώρες)
      amount: '24'

features3_what_we_build:
  title: Τι κατασκευάζουμε
  subtitle: Μια εστιασμένη σειρά προϊόντων που γνωρίζουμε άριστα – χωρίς μισές λύσεις ή badge engineering.
  columns: 3
  isBeforeContent: true
  items:
    - title: Σκάφη RIB
      description: RIB με αλουμινένια γάστρα από 3,3 m έως 7,5 m. Σχεδιασμένα για περιπολία, καταδύσεις, ψάρεμα και οικογενειακή χρήση.
      icon: tabler:ship
    - title: Φουσκωτά σκάφη
      description: Φουσκωτά σκάφη από PVC και Hypalon από 2,4 m έως 4,2 m. Ελαφριά, ανθεκτικά και εύκολα στην αποθήκευση.
      icon: tabler:speedboat
    - title: Tender superyacht
      description: Συμπαγή RIB υψηλών προδιαγραφών, κατασκευασμένα κατά παραγγελία για το σχέδιο του μητρικού σκάφους.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Αξεσουάρ
      description: Ιμάντες, αντλίες, καλύμματα, αδιάβροχες τσάντες, δοχεία καυσίμου και ηλεκτρονικά. Όλα συμβατά με τα σκάφη μας.
      icon: tabler:package
    - title: Τροποποιήσεις και επισκευές
      description: Επισκευή φουσκωτών διαμερισμάτων, αναβάθμιση ηλεκτρονικών και αντικατάσταση κινητήρων.
      icon: tabler:tool
    - title: Προϊόντα κατά παραγγελία
      description: Σχεδιασμός για εμπορικούς, επιστημονικούς και στρατιωτικούς πελάτες.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Σκάφος κατά παραγγελία

steps2_values:
  title: Οι αξίες μας
  subtitle: Τρεις αρχές που διαμορφώνουν κάθε προϊόν από την πρώτη μέρα.
  items:
    - title: Χτίζε σαν να είναι η οικογένειά σου στο σκάφος
      description: Κάθε γάστρα, κάθε συγκόλληση και κάθε εξάρτημα αντιμετωπίζονται σαν να προορίζονται για τις δικές μας οικογένειες.
      icon: tabler:heart
    - title: Μηχανική πριν από την πώληση
      description: Αν η προδιαγραφή είναι λάθος, αλλάζουμε την προδιαγραφή – ποτέ τον πελάτη.
      icon: tabler:settings
    - title: Υποστήριξη πέρα από την εγγύηση
      description: Γάστρες είκοσι ετών ακόμα τηλεφωνούν για ανταλλακτικά – και ακόμα απαντάμε.
      icon: tabler:headset

steps2_milestones:
  title: Ορόσημα
  subtitle: Η σύντομη έκδοση της ιστορίας της Aquafarer.
  isReversed: true
  items:
    - title: Ιδρύθηκε σε παραθαλάσσιο εργαστήριο
      description: Δύο ναυπηγοί μηχανικοί με μία φρέζα CNC και μια ακλόνητη ιδέα.
      icon: tabler:building-factory
    - title: Πρώτες 1.000 παραδοθείσες γάστρες
      description: Επιτεύχθηκε τον έβδομο χρόνο, κυρίως μέσω από στόμα σε στόμα και πιστών πελατών.
      icon: tabler:circle-check
    - title: Διεθνές πρόγραμμα εξαγωγών
      description: Παραδόσεις σε 40+ χώρες με τοπικούς συνεργάτες σέρβις σε πέντε ηπείρους.
      icon: tabler:world

features2_locations:
  title: Οι τοποθεσίες μας
  tagline: Πού να μας βρείτε
  columns: 3
  items:
    - title: Έδρα και εργαστήριο
      description: Παραθαλάσσιο βιομηχανικό πάρκο, κτίριο 4 – ανοιχτά Δευτ-Παρ για επισκέψεις κατόπιν ραντεβού.
    - title: Κέντρο σέρβις ΕΕ
      description: Μεσογειακό λιμάνι – τροποποιήσεις, επισκευές και υποστήριξη εγγύησης για Ευρωπαίους πελάτες.
    - title: Δίκτυο συνεργατών APAC
      description: Εξουσιοδοτημένοι συνεργάτες σέρβις στην Αυστραλία, Ιαπωνία, Σιγκαπούρη και Χονγκ Κονγκ.
brand_hub_tagline: 'Η μάρκα μας'
brand_hub_title: 'Εξερευνήστε τη μάρκα μας'
brand_hub_subtitle: 'Εμβαθύνετε στη ναυπηγική μας τεχνογνωσία, την παγκόσμια παρουσία μας και τις αρχές που μας κινητοποιούν.'

brand_hub_cards:
  - title: 'Ναυτική τεχνογνωσία'
    desc: 'Δεκαετίες επιστήμης υλικών, ακριβούς κατασκευής και δοκιμών σε πραγματικές συνθήκες — από την κατασκευή PVC/Hypalon έως τον σχεδιασμό βαθιών V σκαφών και την τεχνολογία drop-stitch.'
    link: /brand-marine-expertise
    link_label: 'Μάθετε περισσότερα →'
  - title: 'Παγκόσμια παρουσία'
    desc: 'Αποστολές σε 50+ χώρες από την εγκατάστασή μας στο Qingdao με εξουσιοδοτημένους συνεργάτες σέρβις σε Ευρώπη, Ασία-Ειρηνικό και Αμερική.'
    link: /brand-global-presence
    link_label: 'Μάθετε περισσότερα →'
  - title: 'Γιατί Aquafarer'
    desc: 'Κάθετη ενοποίηση, διπλή πιστοποίηση (ISO 9001 + BSCI), συμμόρφωση CE και χαμηλά ελάχιστα όρια παραγγελίας — σχεδιασμένα για μάρκες, διανομείς και κυβερνητικούς οργανισμούς.'
    link: /brand-why-aquafarer
    link_label: 'Μάθετε περισσότερα →'

production_section:
  tagline: 'Παραγωγική Αριστεία'
  title: 'Διασφαλίζοντας Άψογη Κατασκευή'
  description: 'Η γραμμή παραγωγής της Aquafarer είναι αφιερωμένη στην κατασκευή φουσκωτών προϊόντων υψηλής ποιότητας, ανθεκτικών και υψηλών επιδόσεων.'
  cards:
    - title: 'Έμπειρη Ομάδα Τεχνικών'
      items:
        - 'Επαγγελματική γνώση PVC, Hypalon και ναυτικών υλικών'
        - 'Άρτια κατασκευαστική τεχνογνωσία στην κοπή, τη συγκόλληση και την τοποθέτηση εξαρτημάτων'
        - 'Συνεχής εκπαίδευση στις νεότερες τεχνολογίες παραγωγής'
    - title: 'Προηγμένος Εξοπλισμός Παραγωγής'
      items:
        - 'Μηχανήματα κοπής CNC για ακριβή κοπή υφασμάτων με ελάχιστο σφάλμα'
        - 'Θερμή/ψυχρή συγκόλληση υψηλής ακρίβειας για στεγανές και ανθεκτικές ραφές'
        - 'Επαγγελματικός εξοπλισμός δοκιμών στεγανότητας και αντοχής σε εφελκυσμό'
    - title: 'Ωριμό Σύστημα Διοίκησης'
      items:
        - 'Τυποποιημένες διαδικασίες παραγωγής με σαφή πρότυπα ποιότητας'
        - 'Φιλοσοφία lean παραγωγής που μειώνει τα απόβλητα και βελτιώνει την αποδοτικότητα'
        - 'Αποτελεσματική διαχείριση εφοδιαστικής με αξιόπιστους προμηθευτές'
    - title: 'Αυστηρός Έλεγχος Ποιότητας'
      items:
        - 'Πιστοποιημένο σύστημα διαχείρισης ποιότητας'
        - 'Πολλαπλός έλεγχος: πρώτες ύλες, ενδιάμεσος, τελικός'
        - 'Αυστηρές δοκιμές στεγανότητας και αντοχής πριν την αποστολή'

global_ops_section:
  tagline: 'Παγκόσμια Επιχειρησιακή Αρχιτεκτονική'
  title_html: 'Μία μάρκα, <span class="text-white/90">δύο κόμβοι</span>'
  description_html: 'Από τον Σεπτέμβριο του 2026, η Aquafarer λειτουργεί από την <strong class="text-white">Aquafarer LLC</strong> (Νέο Μεξικό, ΗΠΑ) — την παγκόσμια οντότητα για διανομή, εμπορικές πωλήσεις B2B, συμβάσεις, τιμολόγηση και υποστήριξη μετά την πώληση. Η R&D, η παραγωγή και ο έλεγχος ποιότητας παραμένουν στο <strong class="text-white">Κέντρο Παραγωγής Aquafarer Qingdao</strong>, που αποστέλλει κάθε παραγγελία απευθείας από το εργοστάσιο, FOB Qingdao. Η μετάβαση άλλαξε ποιος υπογράφει το συμβόλαιό σας — όχι ποιος κατασκευάζει τη βάρκα σας.'
  stats:
    - value: '2,400+'
      label: 'Κύτορες παραδόθηκαν παγκοσμίως'
    - value: '50+'
      label: 'Χώρες εξαγωγής'
    - value: '10+'
      label: 'Έτη κατασκευής'
