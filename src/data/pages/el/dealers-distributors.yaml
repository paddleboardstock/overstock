hero:
  tagline: Πρόγραμμα Αντιπροσωπείας
  title: Γίνετε Aquafarer<br />Διανομέας
  subtitle: Συνεργαστείτε με έναν κατασκευαστή RIB και φουσκωτών σκαφών με πιστοποίηση CE που εξυπηρετεί 50+ χώρες. Προστασία εδάφους, υποστήριξη μάρκετινγκ και ανταγωνιστική τιμολόγηση για καθιερωμένους ναυτιλιακούς διανομείς.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Πρόγραμμα αντιπροσώπων και διανομέων Aquafarer
direct_answer: Η Aquafarer προσφέρει συνεργασίες αντιπροσωπείας και διανομής με προστασία της περιοχής, ανταγωνιστικές τιμές χονδρικής, κιτ υποστήριξης μάρκετινγκ και πλήρη τεκμηρίωση συμμόρφωσης (CE, ISO 9001, BSCI). Το MOQ ξεκινά από 10-20 μονάδες ανά παραγγελία με αποκλειστική διαχείριση λογαριασμού.
stats:
  - value: 50+
    label: Εξυπηρετούμενες χώρες
    detail: Παγκόσμιο δίκτυο διανομής
  - value: 64
    label: Μοντέλα με πιστοποίηση CE
    detail: RIB, φουσκωτό, SUP, ασφάλεια
  - value: 30-45
    label: Ώρα παράδοσης ημέρας
    detail: FOB Qingdao
  - value: 10-20
    label: Διανομέας MOQ
    detail: Ανά παραγγελία, μικτά μοντέλα
content_benefits:
  tagline: Οφέλη εταιρικής σχέσης
  title: Γιατί οι Διανομείς<br />Επιλέγουν το Aquafarer
  subtitle: Μια συνεργασία σχεδιασμένη για ναυτιλιακούς διανομείς που χρειάζονται αξιόπιστο εφοδιασμό, ανταγωνιστικά περιθώρια κέρδους και επαγγελματική υποστήριξη.
  items:
    - title: Προστασία της επικράτειας
      description: Αποκλειστικά ή ημι-αποκλειστικά δικαιώματα επικράτειας για ειδικευμένους διανομείς. Χαρτογράφηση αγοράς και διαχείριση διενέξεων καναλιών για την προστασία της επένδυσής σας στην οικοδόμηση της επωνυμίας Aquafarer στην περιοχή σας.
      icon: tabler:map-pin
    - title: Ανταγωνιστική Χονδρική Τιμολόγηση
      description: Διαβαθμισμένη τιμολόγηση με βάση τις ετήσιες δεσμεύσεις όγκου. Δομή τιμολόγησης που προστατεύει το περιθώριο κέρδους με εγγυήσεις εκ των προτέρων τιμής και διαφανείς αναλύσεις κόστους (βάση FOB Qingdao).
      icon: tabler:currency-dollar
    - title: Κιτ υποστήριξης μάρκετινγκ
      description: Επαγγελματική φωτογραφία προϊόντων, φύλλα προδιαγραφών, πρότυπα τεκμηρίωσης συμμόρφωσης, περιεχόμενο μέσων κοινωνικής δικτύωσης και υλικό μάρκετινγκ με κοινό σήμα. Ενημερώνεται ετησίως με νέα λανσαρίσματα προϊόντων.
      icon: tabler:photo
    - title: Τεχνική Εκπαίδευση
      description: Εκπαίδευση προϊόντων για την ομάδα πωλήσεών σας (εικονική ή επιτόπια), εκπαίδευση συντήρησης και επισκευής για τους τεχνικούς σέρβις σας και οδηγούς για συχνές ερωτήσεις και αντιμετώπιση προβλημάτων για τους πελάτες.
      icon: tabler:school
    - title: Ανταλλακτικά & Μεταπώληση
      description: Προμήθεια αποκλειστικών ανταλλακτικών με προτεραιότητα αποστολής. Διατίθενται τμήματα σωλήνων αντικατάστασης, βαλβίδες, πτερύγια και κιτ επισκευής για γρήγορη εκπλήρωση παραγγελιών. Υποστήριξη διεκπεραίωσης αξίωσης εγγύησης.
      icon: tabler:tool
    - title: Τεκμηρίωση Συμμόρφωσης
      description: 'Πλήρες πακέτο τεκμηρίωσης συμμόρφωσης για την αγορά σας: CE DoC, δεδομένα πινακίδας κατασκευής, εγχειρίδια κατόχου και ρυθμιστική υποστήριξη εγγραφής. Εξαλείφει το βάρος συμμόρφωσής σας.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Τι ψάχνουμε
  title: Διανομέας<br />Απαιτήσεις
  subtitle: Αναζητούμε συνεργάτες που μπορούν να εκπροσωπήσουν και να υποστηρίξουν επαγγελματικά τα προϊόντα Aquafarer στην επικράτειά τους.
  items:
    - title: Γνώση Περιοχής & Αγοράς
      description: Καθιερωμένη παρουσία στην αγορά της θάλασσας, των θαλάσσιων σπορ ή της υπαίθριας αναψυχής. Κατανόηση των τοπικών κανονισμών, των προτιμήσεων των καταναλωτών και των καναλιών διανομής προϊόντων σκαφών.
      icon: tabler:target
    - title: Εμπειρία στον κλάδο
      description: Τουλάχιστον 2 χρόνια εμπειρία στη διανομή ναυτικού, υπαίθριου ή αθλητικού εξοπλισμού. Αποδεδειγμένο ιστορικό με διεθνείς επωνυμίες και δραστηριότητες χονδρικής B2B.
      icon: tabler:briefcase
    - title: Εκθεσιακός χώρος ή Αποθήκη
      description: Φυσική εγκατάσταση για προβολή προϊόντων, αποθήκευση αποθεμάτων και εξυπηρέτηση πελατών. Δυνατότητα διατήρησης αποθέματος μονάδων επίδειξης και ανταλλακτικών για την περιοχή σας.
      icon: tabler:building-store
    - title: Δέσμευση στα πρότυπα επωνυμίας
      description: Προθυμία να διατηρήσουμε τα πρότυπα παρουσίασης της επωνυμίας Aquafarer, να παρέχουμε υποστήριξη πελατών σύμφωνα με τα πρωτόκολλα υπηρεσιών μας και να συμμετέχουμε σε ετήσιες ενημερώσεις εκπαίδευσης προϊόντων.
      icon: tabler:star
content_process:
  tagline: Διαδικασία Αίτησης
  title: Αντιπρόσωπος 4 βημάτων<br />Διαδικασία εφαρμογής
  subtitle: Από την αρχική έρευνα έως την πρώτη αποστολή — μια απλή διαδικασία επιβίβασης.
  steps:
    - number: '01'
      title: Αρχική Διερεύνηση & Προσόντα
      description: Υποβάλετε την αίτηση διανομέα σας με τα στοιχεία της εταιρείας, την περιοχή ενδιαφέροντος, τις τρέχουσες σειρές προϊόντων και τις ετήσιες εκτιμήσεις όγκου. Κάνουμε έλεγχο εντός 5 εργάσιμων ημερών.
      timeline: 5 μέρες
    - number: '02'
      title: Επιχειρηματική κριτική και όροι
      description: Εικονική συνάντηση για να συζητήσετε τη στρατηγική της περιοχής, τα επίπεδα τιμολόγησης και τους όρους συνεργασίας. Ελέγξτε τις απαιτήσεις τεκμηρίωσης συμμόρφωσης για την αγορά σας. Υπογραφή NDA εάν χρειάζεται.
      timeline: 1-2 εβδομάδες
    - number: '03'
      title: Δείγμα Παραγγελίας & Αξιολόγησης
      description: Τοποθετήστε μια αρχική παραγγελία δείγματος (2-5 μονάδες) σε τιμή διανομέα για αξιολόγηση αγοράς και εκπαίδευση ομάδας. Περιλαμβάνεται πλήρης τεκμηρίωση συμμόρφωσης και προετοιμασία επίδειξης.
      timeline: 30-45 ημέρες
    - number: '04'
      title: Εκκίνηση και Υποστήριξη Συνεργασίας
      description: Πρώτη παραγγελία εμπορευματοκιβωτίων με ενεργοποιημένη την προστασία εδάφους. Παραδόθηκε κιτ μάρκετινγκ, εκπαιδεύτηκε η ομάδα πωλήσεων και ανατέθηκε αποκλειστικός διαχειριστής λογαριασμού. Συνεχείς τριμηνιαίες επιχειρηματικές αξιολογήσεις.
      timeline: Σε εξέλιξη
content_application_docs:
  tagline: Δικαιολογητικά αίτησης
  title: Απαιτούμενα δικαιολογητικά<br />για αίτηση αντιπροσωπείας
  subtitle: Για να αιτηθείτε μια αντιπροσωπεία Aquafarer, προετοιμάστε τα παρακάτω δικαιολογητικά και πληροφορίες για την ομάδα ελέγχου μας.
  items:
    - title: Πιστοποιητικό Εγγραφής Επιχείρησης
      description: Έγκυρο έγγραφο εγγραφής εταιρείας που δείχνει την επωνυμία, τη δηλωμένη διεύθυνση και το αντικείμενο δραστηριότητας που καλύπτει τη διανομή θαλάσσιου, αθλητικού ή εξοπλισμού υπαίθρου.
      icon: tabler:file-text
    - title: Σχέδιο Εδαφικής Κάλυψης
      description: Γεωγραφική περιοχή ενδιαφέροντος, υπάρχον δίκτυο λιανικής ή διανομής, στοχευμένα τμήματα πελατών και προτεινόμενος ετήσιος όγκος ανά κατηγορία προϊόντος (RIB, SUP, καγιάκ).
      icon: tabler:map
    - title: Δυνατότητα Εκθεσιακού Χώρου ή Αποθήκης
      description: Φυσική εγκατάσταση για έκθεση προϊόντων, αποθήκευση αποθεμάτων και εξυπηρέτηση πελατών. Φωτογραφίες ή κάτοψη που δείχνουν την περιοχή επίδειξης και τη χωρητικότητα αποθήκευσης ανταλλακτικών.
      icon: tabler:building
    - title: Δήλωση Οικονομικής Ικανότητας
      description: 'Τραπεζική βεβαίωση ή οικονομικές καταστάσεις που επιβεβαιώνουν τη δυνατότητα τοποθέτησης αρχικής παραγγελίας container και διατήρησης αποθεμάτων. Ελάχιστη αρχική παραγγελία: ένα container 20 ποδών (10-20 μονάδες, ανάμεικτα μοντέλα).'
      icon: tabler:coin
    - title: Δυνατότητα Υποστήριξης Μετά την Πώληση
      description: Τεχνικοί service εκπαιδευμένοι ή εκπαιδεύσιμοι στη συντήρηση και επισκευή φουσκωτών σκαφών. Δυνατότητα διεκπεραίωσης απαιτήσεων εγγύησης και δέσμευση για απόθεμα ανταλλακτικών.
      icon: tabler:tool
    - title: Συστάσεις Προηγούμενων Επωνυμιών
      description: Λίστα θαλάσσιων ή αθλητικών επωνυμιών που διανέμονται τώρα ή στο παρελθόν. Συστάσεις επαφών διαθέσιμες κατόπιν αμοιβαίας συμφωνίας. Νέες επιχειρήσεις χωρίς προηγούμενη εμπειρία διανομής μπορούν να πληρούν τις προϋποθέσεις με ισχυρότερη οικονομική δέσμευση.
      icon: tabler:users
faq:
  title: Πρόγραμμα αντιπροσωπείας — Συχνές ερωτήσεις
  questions:
    - q: Ποια είναι η ελάχιστη ποσότητα παραγγελίας για τους διανομείς;
      a: Το MOQ του διανομέα ξεκινά από 10-20 μονάδες ανά παραγγελία, με ευελιξία για μικτά μοντέλα (RIB, φουσκωτό, SUP). Οι αρχικές παραγγελίες δειγμάτων 2-5 μονάδων είναι διαθέσιμες σε τιμές διανομέα για αξιολόγηση αγοράς.
    - q: Προσφέρετε αποκλειστικά δικαιώματα επικράτειας;
      a: Διατίθενται αποκλειστικά δικαιώματα επικράτειας για πιστοποιημένους διανομείς που πληρούν τις ετήσιες δεσμεύσεις όγκου και διατηρούν τα πρότυπα επωνυμίας. Διατίθενται επίσης ημι-αποκλειστικές και μη αποκλειστικές ρυθμίσεις για τις αναδυόμενες αγορές.
    - q: Τι υποστήριξη μάρκετινγκ παρέχετε;
      a: Παρέχουμε ένα ολοκληρωμένο κιτ μάρκετινγκ που περιλαμβάνει επαγγελματικές φωτογραφίες προϊόντων, φύλλα προδιαγραφών, πρότυπα τεκμηρίωσης συμμόρφωσης, βιβλιοθήκη περιεχομένου μέσων κοινωνικής δικτύωσης και υλικό συνεπώνυμης επωνυμίας. Ενημερώνεται ετησίως με νέα λανσαρίσματα προϊόντων.
    - q: Πώς αντιμετωπίζονται οι αξιώσεις εγγύησης;
      a: 'Οι διανομείς χρησιμεύουν ως το πρώτο σημείο επαφής για αξιώσεις εγγύησης. Παρέχουμε σαφή κριτήρια εγγύησης, πρωτόκολλα τεκμηρίωσης φωτογραφιών και γρήγορη αντικατάσταση ή επεξεργασία πιστώσεων. Όροι εγγύησης: 5 χρόνια περιορισμένη σε ύφασμα/ραφές/γάστρα σωλήνων σκάφους. 2 χρόνια σε SUP και αξεσουάρ.'
    - q: Μπορώ να τοποθετήσω προϊόντα Aquafarer με ιδιωτική ετικέτα με τη δική μου επωνυμία;
      a: Ναι, μέσω του προγράμματος OEM/ODM μας. Οι επιλογές ιδιωτικής ετικέτας περιλαμβάνουν προσαρμοσμένα γραφικά σωλήνα, επωνυμία κονσόλας, συσκευασία λιανικής και τεκμηρίωση συμμόρφωσης με την επωνυμία σας. Δείτε τη σελίδα υπηρεσιών OEM/ODM για λεπτομέρειες.
    - q: Ποια τεκμηρίωση συμμόρφωσης περιλαμβάνεται για τους διανομείς;
      a: Κάθε αποστολή περιλαμβάνει DoC CE για συγκεκριμένο μοντέλο, δεδομένα πινακίδας κατασκευής, εγχειρίδια κατόχου και τεκμηρίωση αποστολής. Παρέχουμε επίσης ρυθμιστική υποστήριξη εγγραφής για την επικράτειά σας και βοηθάμε με τυχόν τοπικές απαιτήσεις συμμόρφωσης.
