content_capability:
  tagline: Μηχανική ικανότητα
  title: Τι Παρέχει η Ομάδα Μηχανικών μας<br />
  subtitle: Η μηχανική Aquafarer καλύπτει ολόκληρο τον κύκλο ζωής του προϊόντος — από την έρευνα αγοράς και τον σχεδιασμό ιδέας έως την κατασκευή πρωτοτύπων, τις δοκιμές και τη μαζική παραγωγή.
  items:
    - title: Βιομηχανικός Σχεδιασμός
      description: Η ομάδα βιομηχανικού σχεδιασμού μας εργάζεται βάσει των απαιτήσεων των πελατών, της έρευνας αγοράς και της ανάλυσης ανταγωνισμού για να αναπτύξει έννοιες προϊόντων που εξισορροπούν την αισθητική, τη λειτουργικότητα και τη δυνατότητα κατασκευής. Παράγουμε δισδιάστατα σκίτσα, τρισδιάστατες αποδόσεις και έγγραφα προδιαγραφών για έλεγχο από τον πελάτη πριν από τη δέσμευση για την επεξεργασία εργαλείων.
      features:
        - Ανάπτυξη εννοιών και μελέτες σκοπιμότητας
        - Σχέδια σχεδιασμού 2D και απεικονίσεις 3D
        - Επιλογή και προδιαγραφές υλικών
        - Ανάλυση σχεδιασμού για παραγωγή (DFM)
        - Εργονομική αξιολόγηση και αξιολόγηση ασφάλειας
    - title: Δομική Μηχανική
      description: Οι δομικοί μηχανικοί μας ειδικεύονται στην αρχιτεκτονική φουσκωτών σκαφών — σχεδιασμός κύτους, διαμόρφωση θαλάμου σωλήνων, μηχανική πυρήνα πτώσης βελονιάς και κατανομή φορτίου. Κάθε σχέδιο αναλύεται για δομική ακεραιότητα, βελτιστοποίηση βάρους και συμμόρφωση με τα σχετικά πρότυπα (CE, ISO, AS).
      features:
        - Σχεδιασμός κύτους deep-V από ίνες γυαλιού με υπολογισμένες γωνίες V
        - Διαμόρφωση σωλήνων πολλαπλών θαλάμων για ασφάλεια και πλευστότητα
        - Προδιαγραφές πυρήνα drop-stitch και βελτιστοποίηση πυκνότητας
        - Ανάλυση πεπερασμένων στοιχείων για φέροντα στοιχεία
        - Υπολογισμοί κατανομής βάρους και ευστάθειας
    - title: Τρισδιάστατη Μοντελοποίηση & CAD
      description: Όλα τα σχέδια προϊόντων αναπτύσσονται σε τρισδιάστατο CAD πριν ξεκινήσει η κατασκευή πρωτοτύπων. Οι μηχανικοί μας χρησιμοποιούν το SolidWorks και το Rhino 3D για τη μοντελοποίηση προϊόντων, επιτρέποντας στους πελάτες να ελέγχουν κάθε λεπτομέρεια — από το προφίλ του σωλήνα έως τη διάταξη της κονσόλας — προτού δεσμευτούν στην παραγωγή.
      features:
        - Πλήρης τρισδιάστατη μοντελοποίηση CAD σε SolidWorks και Rhino 3D
        - Φωτορεαλιστικές απεικονίσεις για παρουσιάσεις σε πελάτες
        - Πακέτα τεχνικών σχεδίων για την παραγωγή
        - Σχεδιασμός καλουπιών και εργαλείων από τρισδιάστατα μοντέλα
        - Άμεση μεταφορά δεδομένων από CAD σε CNC για ακριβή κοπή
    - title: Πρωτότυπα & Δοκιμές
      description: Πριν από τη μαζική παραγωγή, κάθε νέο προϊόν περνάει από το στάδιο του πρωτοτύπου. Κατασκευάζουμε λειτουργικά πρωτότυπα για αξιολόγηση πελατών και, στη συνέχεια, τα υποβάλλουμε στο πλήρες πρωτόκολλο δοκιμών μας - δοκιμή πίεσης, δοκιμή σταθερότητας, δοκιμή φορτίου και δοκιμές νερού. Οι επαναλήψεις σχεδιασμού στο στάδιο του πρωτοτύπου είναι γρήγορες και οικονομικά αποδοτικές.
      features:
        - Γρήγορα εργαλεία πρωτοτύπων (παράδοση σε 15-20 ημέρες)
        - Λειτουργικό πρωτότυπο για αξιολόγηση σε πραγματικές συνθήκες
        - Πλήρες πρωτόκολλο δοκιμών πριν την έγκριση παραγωγής
        - Επαναληπτική βελτίωση του σχεδιασμού με βάση τα αποτελέσματα δοκιμών
        - Ορόσημο έγκρισης από τον πελάτη πριν τα εργαλεία παραγωγής
    - title: Προσαρμοσμένη ενσωμάτωση αξεσουάρ
      description: Πολλά έργα OEM απαιτούν ενσωμάτωση αξεσουάρ που παρέχονται από τον πελάτη ή τρίτων - προσαρμοσμένες κονσόλες, εξειδικευμένα καθίσματα, ηλεκτρονικά συστήματα, βάσεις εξοπλισμού κατάδυσης ή στοιχεία επωνυμίας. Η ομάδα μηχανικών μας διαχειρίζεται τον σχεδιασμό ενσωμάτωσης, τη δομική προσαρμογή και την επικύρωση ποιότητας όλων των εξαρτημάτων.
      features:
        - Σχεδιασμός κονσόλας και διάταξη του πίνακα οργάνων
        - Ενσωμάτωση προσαρμοσμένων καθισμάτων και ταπετσαριών
        - Σχεδιασμός και καλωδίωση ηλεκτρονικών συστημάτων
        - Συστήματα στήριξης εξοπλισμού κατάδυσης και διάσωσης
        - Προδιαγραφές εφαρμογής εμπορικού σήματος και γραφικών
content_process:
  tagline: Διαδικασία Ανάπτυξης
  title: Από την ιδέα<br />στην παραγωγή
  subtitle: Η διαδικασία ανάπτυξης προϊόντων μας ακολουθεί μια δομημένη ροή εργασίας 6 σταδίων που έχει σχεδιαστεί για να ελαχιστοποιεί τον κίνδυνο, να συμπιέζει τα χρονοδιαγράμματα και να διασφαλίζει την ετοιμότητα κατασκευής από την πρώτη μέρα.
  stages:
    - stage: '01'
      title: Απαιτήσεις & Έρευνα
      duration: 1-2 εβδομάδες
      description: Συνεργαζόμαστε με τον πελάτη για να καθορίσουμε τις προδιαγραφές προϊόντων, τις απαιτήσεις της αγοράς-στόχου, τις ανάγκες συμμόρφωσης με τους κανονισμούς και τους εμπορικούς στόχους. Αυτό το στάδιο δημιουργεί ένα Έγγραφο Απαιτήσεων Προϊόντος (PRD) που καθοδηγεί όλες τις επόμενες εργασίες.
      deliverables: PRD, ανάλυση αγοράς, ανταγωνιστικό σημείο αναφοράς, προκαταρκτική εκτίμηση κόστους
    - stage: '02'
      title: Σχεδιασμός concept
      duration: 2-3 εβδομάδες
      description: Η ομάδα βιομηχανικού σχεδιασμού αναπτύσσει ιδέες προϊόντων με βάση το PRD. Παρουσιάζονται πολλαπλές επιλογές σχεδίασης με τρισδιάστατες αποδόσεις, προτάσεις υλικών και αρχικές μηχανολογικές αξιολογήσεις. Ο πελάτης επιλέγει κατεύθυνση για λεπτομερή ανάπτυξη.
      deliverables: Τρισδιάστατες ερμηνείες, προδιαγραφές υλικών, λογική σχεδίασης, προκαταρκτική BOM
    - stage: '03'
      title: Λεπτομερής Μηχανική
      duration: 2-4 εβδομάδες
      description: Η επιλεγμένη ιδέα είναι πλήρως σχεδιασμένη — Τρισδιάστατη μοντελοποίηση CAD, δομική ανάλυση, διαμόρφωση σωλήνα, σχεδιασμός κύτους, ενσωμάτωση εξαρτημάτων και τεκμηρίωση παραγωγής. Όλες οι διαστάσεις, τα υλικά και οι διαδικασίες καθορίζονται για εργαλεία.
      deliverables: Πλήρες τρισδιάστατο μοντέλο CAD, μηχανικά σχέδια, τελικό BOM, προδιαγραφές εργαλείων, σχέδιο QC
    - stage: '04'
      title: Πρωτοτυποποίηση
      duration: 2-3 εβδομάδες
      description: Παράγεται πρωτότυπο εργαλείο και κατασκευάζονται λειτουργικά δείγματα. Ο πελάτης εξετάζει το πρωτότυπο σύμφωνα με τις προδιαγραφές PRD. Η δοκιμή διεξάγεται σύμφωνα με το συμφωνημένο πρωτόκολλο. Οι προσαρμογές σχεδιασμού γίνονται με βάση την ανατροφοδότηση πριν από την κατασκευή εργαλείων.
      deliverables: Λειτουργικό πρωτότυπο, έκθεση δοκιμής, αρχείο καταγραφής αναθεώρησης σχεδίου, έγγραφο υπογραφής πελάτη
    - stage: '05'
      title: Εργαλεία Παραγωγής
      duration: 2-3 εβδομάδες
      description: Μόλις εγκριθεί το πρωτότυπο, τίθενται σε λειτουργία τα εργαλεία παραγωγής — καλούπια, εξαρτήματα συγκόλλησης, προγράμματα κοπής, εξαρτήματα συναρμολόγησης. Η τεκμηρίωση QC και τα κριτήρια επιθεώρησης έχουν οριστικοποιηθεί. Πραγματοποιήθηκε δοκιμαστική εκτέλεση για επικύρωση διαδικασίας.
      deliverables: Εργαλεία παραγωγής, τεκμηρίωση διαδικασίας, σχέδιο επιθεώρησης QC, έκθεση δοκιμής
    - stage: '06'
      title: Μαζική Παραγωγή & QC
      duration: Σε εξέλιξη
      description: Η πλήρης παραγωγή ξεκινά με QC εντός της διαδικασίας σε κάθε στάδιο. Τα πρώτα είδη επιθεωρούνται και εγκρίνονται πριν από την κυκλοφορία των παρτίδων. Συνεχής παρακολούθηση ποιότητας, παρακολούθηση ελαττωμάτων και συνεχής βελτίωση σε όλη τη διάρκεια του κύκλου ζωής της παραγωγής.
      deliverables: Πρόγραμμα παραγωγής, αναφορές QC, αρχεία ιχνηλασιμότητας παρτίδων, τεκμηρίωση αποστολής
content_customization:
  tagline: Επιλογές προσαρμογής
  title: Τι μπορεί να είναι<br />Προσαρμοσμένο
  subtitle: Σχεδόν κάθε πτυχή των προϊόντων μας μπορεί να προσαρμοστεί ώστε να ανταποκρίνεται στις απαιτήσεις των πελατών. Παρακάτω είναι οι πιο συνηθισμένες κατηγορίες προσαρμογής.
  columns: 3
  items:
    - title: Σκάφος & Δομή
      description: Προσαρμοσμένο μήκος κύτους, πλάτος δέσμης, γωνία νεκρής στάθμης, διάμετρος σωλήνα, διαμόρφωση θαλάμου και ποιότητα υλικού.
      icon: tabler:sailboat
    - title: Χρώματα & Γραφικά
      description: Χρώμα σωλήνα (PVC/Hypalon), χρώμα gelcoat γάστρας, χρώμα κονσόλας, γραφικά καταστρώματος, τοποθέτηση λογότυπου και σχεδιασμός συσκευασίας.
      icon: tabler:palette
    - title: Κονσόλα & Χειριστήρια
      description: Κεντρική κονσόλα, πλαϊνή κονσόλα ή τιμόνι. Προσαρμοσμένη διάταξη πίνακα οργάνων, τοποθέτηση διακόπτη και θέση τιμονιού.
      icon: tabler:steering-wheel
    - title: Καθίσματα & Ταπετσαρίες
      description: Καθίσματα αναβάτη, καθίσματα πάγκου, ταπετσαρίες πολυτελείας, ταιριασμένες ραφές στο χρώμα, αναδιπλούμενες ή αφαιρούμενες διαμορφώσεις.
      icon: tabler:armchair
    - title: Αξεσουάρ & Εξοπλισμός
      description: Σκάλες κατάδυσης, σχάρες δεξαμενών, πυλώνες ρυμούλκησης, T-tops, κορυφές Bimini, συστήματα ήχου, ηλεκτρονικά πλοήγησης και εξοπλισμός ασφαλείας.
      icon: tabler:backpack
    - title: Συσκευασία & Branding
      description: Προσαρμοσμένες συσκευασίες λιανικής, κουτιά ιδιωτικής ετικέτας, χαρτοκιβώτια αποστολής με σήματα μάρκας, αναρτημένες ετικέτες και εγχειρίδια χρήστη στη γλώσσα πελάτη.
      icon: tabler:box
content_industries:
  tagline: Εφαρμογές Βιομηχανίας
  title: Μηχανικές Λύσεις<br />ανά Βιομηχανία
  subtitle: Η ομάδα μηχανικών μας έχει αναπτύξει προϊόντα για ένα ευρύ φάσμα θαλάσσιων εφαρμογών — καθεμία με ξεχωριστές απαιτήσεις και κριτήρια απόδοσης.
  columns: 3
  items:
    - title: Καταδυτικές Επιχειρήσεις
      description: Ενισχυμένα καταστρώματα, ενσωμάτωση σκάλας κατάδυσης, συστήματα αποθήκευσης δεξαμενών και σταθερές πλατφόρμες για εμπορικά κέντρα καταδύσεων σε όλο τον κόσμο.
      icon: tabler:lifebuoy
    - title: Διάσωσης & Έκτακτης Ανάγκης
      description: Σχέδια γάστρας υψηλής ταχύτητας, καταστρώματα αυτόματης αποθήκευσης, συστήματα στερέωσης εξοπλισμού και διαμορφώσεις ασφαλείας πολλαπλών θαλάμων για λειτουργίες SAR.
      icon: tabler:alert-triangle
    - title: Θαλάσσιος Τουρισμός
      description: Διατάξεις άνεσης επιβατών, ενσωμάτωση σκίαστρου, συστήματα επιβίβασης και διαμορφώσεις εξοικονόμησης καυσίμου για λειτουργίες μεταφοράς σε νησί.
      icon: tabler:beach
    - title: Tenders για γιοτ
      description: Συμπαγείς σχεδιασμοί για αποθήκευση δαχτυλιδιών, επιλογές πολυτελούς φινιρίσματος, ταιριαστά χρώματα μητρικού πλοίου και χαρακτηριστικά ρυμούλκησης υψηλής απόδοσης.
      icon: tabler:sailboat
    - title: Αλιεία & Υδατοκαλλιέργεια
      description: Διαμορφώσεις επίπεδων καταστρωμάτων, ενσωμάτωση livewell, διατάξεις συγκράτησης ράβδων, ανθεκτικό στη διάβρωση υλικό για συνεχή έκθεση σε αλμυρό νερό.
      icon: tabler:fish
    - title: Λιμενική & Βιομηχανική
      description: Ενίσχυση κύτους βαρέως τύπου, διατάξεις σκαφών εργασίας, διαμορφώσεις μεταφοράς προσωπικού και ενσωμάτωση εξοπλισμού για υπεράκτιες λειτουργίες.
      icon: tabler:ship
cta:
  title: Ξεκινήστε το έργο ανάπτυξης του προϊόντος σας
  subtitle: Μοιραστείτε τις απαιτήσεις προϊόντος, την αγορά-στόχο και το χρονοδιάγραμμα — η ομάδα μηχανικών μας θα απαντήσει με μια πρόταση ανάπτυξης και εκτίμηση κόστους εντός 48 ωρών.
  actions:
    - variant: primary
      text: Ξεκινήστε το έργο σας
      href: /contact
    - text: Προβολή σχεδίου OEM/ODM
      href: /oem-odm-blueprint
