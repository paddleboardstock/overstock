hero:
  tagline: Τεχνικά Σχέδια & CAD
  title: RIB & Φουσκωτό Σκάφος<br />Τεχνικά Σχέδια & Λήψεις CAD
  subtitle: Σχέδια GA σε επίπεδο σχεδιασμού, φύλλα διαστάσεων και διατάξεις καταστρώματος για αξιολόγηση και προδιαγραφή έργου. Αποκτήστε πρόσβαση σε τεχνικά σχέδια στο σωστό επίπεδο — από δημόσια αρχεία PDF έως αρχεία STEP σε επίπεδο έργου.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Τεχνικά σχέδια σκαφών RIB και λήψεις CAD
direct_answer: Η Paddle Board Overstock παρέχει τεχνικά σχέδια σε επίπεδο προμηθειών για σκάφη RIB και φουσκωτά σκάφη — συμπεριλαμβανομένων PDF γενικής διάταξης (GA), φύλλων διαστάσεων και σχεδίων διάταξης καταστρώματος. Μορφές υψηλότερης λεπτομέρειας (DXF/DWG, STEP/IGES) είναι διαθέσιμες κατόπιν ειδικής έρευνας ή αίτησης έργου.
