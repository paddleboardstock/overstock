content_version_control:
  tagline: Έλεγχος εκδόσεων
  title: Έκδοση σχεδίασης<br />Διαχείριση
  subtitle: Κάθε σχέδιο ακολουθεί ένα σύστημα ελεγχόμενης αναθεώρησης. Επαληθεύετε πάντα ότι διαθέτετε την τρέχουσα αναθεώρηση πριν χρησιμοποιήσετε τα σχέδια για τον προγραμματισμό του έργου.
  items:
    - title: Παρακολούθηση αναθεωρήσεων
      description: Κάθε σχέδιο φέρει έναν κωδικό αναθεώρησης (Rev-A, Rev-B, Rev-C), ημερομηνία έκδοσης, ημερομηνία τελευταίας εξέτασης, ισχύον μοντέλο/διαμόρφωση, μονάδες, μέγεθος αρχείου και μορφή. Μόνο η "Τρέχουσα" αναθεώρηση είναι διαθέσιμη για λήψη.
      icon: tabler:git-branch
    - title: Ειδοποίηση κατάστασης σχεδίου
      description: Όλα τα δημόσια σχέδια φέρουν την ένδειξη "Μόνο προκαταρκτική διάταξη — όχι για χρήση κατασκευής, πιστοποίησης ή παραγωγής. Οι διαστάσεις υπόκεινται σε τελικές προδιαγραφές και επιβεβαίωση παραγγελίας." Αυτό προστατεύει και τα δύο μέρη από εσφαλμένη εφαρμογή.
      icon: tabler:alert-circle
    - title: Ενημέρωση ειδοποιήσεων
      description: Όταν αλλάζει μια προδιαγραφή μοντέλου, η αναθεώρηση του σχεδίου ενημερώνεται και οι προηγούμενες εκδόσεις επισημαίνονται με την ένδειξη "Υπακολούθησε". Οι εγγεγραμμένοι χρήστες που κατέβασαν πακέτα DXF/DWG ειδοποιούνται για σημαντικές ενημερώσεις μέσω email.
      icon: tabler:bell

