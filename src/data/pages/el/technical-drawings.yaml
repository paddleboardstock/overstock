content_tiers:
  tagline: Λήψη Tiers
  title: Τέσσερα επίπεδα πρόσβασης<br />— Η σωστή λεπτομέρεια για το σωστό στάδιο
  subtitle: Παρέχουμε σχέδια σε επίπεδο προμήθειας, όχι αρχεία σε επίπεδο κατασκευής. Κάθε επίπεδο ταιριάζει με ένα διαφορετικό στάδιο έργου.
  items:
    - title: Βαθμίδα 1 — Δημόσιο PDF
      description: Γενική διάταξη (GA), σχέδιο διαστάσεων 4 προβολών και διάταξη καταστρώματος σε μορφή PDF. Διαθέσιμο για δωρεάν λήψη. Επαρκές για σχεδιασμό έργου, κατανομή χώρου και προκαταρκτική αναθεώρηση προδιαγραφών.
      icon: tabler:file-type-pdf
    - title: Βαθμίδα 2 — Φως DXF/DWG
      description: Αρχεία 2D CAD (DXF ή DWG) για ενσωμάτωση διάταξης σε επίπεδο σχεδιασμού. Απαιτεί μια σύντομη φόρμα πιστοποίησης (επωνυμία εταιρείας, τύπος έργου, χρήση για την οποία προορίζεται). Δεν περιλαμβάνονται δομικά ή κατασκευαστικά δεδομένα.
      icon: tabler:file-code
    - title: Βαθμίδα 3 — Εφαρμογή έργου STEP/IGES
      description: Αρχεία τρισδιάστατων μοντέλων (STEP ή IGES) για ενοποίηση συστήματος, σχεδιασμό εξοπλισμού ή συντονισμό ναυτικής αρχιτεκτονικής. Απαιτεί εφαρμογή έργου με εύρος, χρονοδιάγραμμα και πρόθεση αγοράς. Με την επιφύλαξη έγκρισης.
      icon: tabler:cube
    - title: Βαθμίδα 4 — Μηχανική NDA
      description: Δομικά σχέδια γάστρας, χρονοδιαγράμματα πλαστικοποίησης, επεκτάσεις κοπής σωλήνων και δεδομένα καλουπιού. Διατίθεται μόνο στο NDA με επιβεβαιωμένες παραγγελίες. Αυτά είναι αρχεία σε επίπεδο παραγωγής — όχι για δημόσια διανομή.
      icon: tabler:lock
content_included:
  tagline: Τι Περιλαμβάνεται
  title: Περιεχόμενα σχεδίασης<br />Ανά μοντέλο
  subtitle: Κάθε μοντέλο έχει ένα τυπικό πακέτο σχεδίων που καλύπτει τις βασικές πληροφορίες σχεδιασμού για αγοραστές B2B και μηχανικούς έργου.
  items:
    - title: Γενική ρύθμιση (GA)
      description: Πλαϊνό προφίλ, κάτοψη και διατομή που δείχνει τη μορφή του κύτους, τη θέση του σωλήνα, τη θέση της κονσόλας, τα καθίσματα, το σύστημα καυσίμου και τις βασικές διαστάσεις (LOA, δοκός, διάμετρος σωλήνα, γωνία νεκρού καθίσματος). Κατάσταση αναθεώρησης και πνευματικά δικαιώματα σημειώνονται στο μπλοκ τίτλου.
      icon: tabler:layout
    - title: 4-Προβολή σχεδίου διαστάσεων
      description: Πλαϊνή, μπροστινή, πίσω και πάνω όψη με συνολικές διαστάσεις για σχεδιασμό μεταφοράς (ύψος στο τρέιλερ, δοκός για κοντέινερ, βάρος για ανύψωση). Περιλαμβάνει διαμορφώσεις λειτουργίας και μεταφοράς.
      icon: tabler:ruler-2
    - title: Διάταξη Καταστρώματος & Σχέδιο Εξοπλισμού
      description: Προβολή καταστρώματος από πάνω προς τα κάτω που δείχνει τη βάση της κονσόλας, τις θέσεις των καθισμάτων, τις θέσεις των δακτυλίων D, τις θέσεις των φώτων πλοήγησης, την πρόσβαση στην αντλία υδροσυλλεκτών, τη θήκη μπαταρίας/καυσίμου και σημεία στερέωσης εξοπλισμού. Περιορισμένη ακρίβεια στις ιδιόκτητες διεπαφές.
      icon: tabler:map
    - title: Σχέδιο μεταφοράς & συσκευασίας
      description: Σχέδιο φόρτωσης εμπορευματοκιβωτίων, διαστάσεις βάσης, κατανομή βάρους και θέσεις σημείων ανύψωσης για σχεδιασμό εφοδιαστικής. Περιλαμβάνει τυπικές και προσαρμοσμένες επιλογές συσκευασίας.
      icon: tabler:truck
content_protection:
  tagline: Προστασία IP
  title: Τι δεν μοιραζόμαστε<br />& Γιατί
  subtitle: Η προστασία της IP μηχανικής μας διασφαλίζει ότι μπορούμε να συνεχίσουμε να επενδύουμε στην Ε&Α παρέχοντας παράλληλα όλα όσα χρειάζονται οι αγοραστές για τον σχεδιασμό του έργου.
  items:
    - title: Δεδομένα πυρήνων Hull Mold
      description: Η γεωμετρία βυσμάτων και καλουπιών, οι διαδρομές εργαλείων CNC και τα πρότυπα πλαστικοποίησης είναι ιδιόκτητα στοιχεία παραγωγής. Δεν κοινοποιούνται σε κανένα επίπεδο πρόσβασης εκτός των επιβεβαιωμένων συμβάσεων NDA.
      icon: tabler:ban
    - title: Επεκτάσεις κοπής σωλήνων
      description: Τα αρχεία κοπής επίπεδης σχεδίασης για ύφασμα σωλήνα είναι δεδομένα σε επίπεδο κατασκευής. Διατίθεται μόνο στο NDA με επιβεβαιωμένες παραγγελίες παραγωγής και κοινόχρηστο μόνο με το συμβαλλόμενο μέρος.
      icon: tabler:ban
    - title: Δομικοί Υπολογισμοί
      description: Η λεπτομερής ανάλυση καταπόνησης, τα αποτελέσματα FEA και τα χρονοδιαγράμματα laminate είναι έγγραφα ευαίσθητα στη συμμόρφωση που κοινοποιούνται μόνο σε Κοινοποιημένους Φορείς και πελάτες που συνδέονται με το NDA κατά τη διαδικασία αξιολόγησης της συμμόρφωσης.
      icon: tabler:ban
    - title: Έλεγχος ανταγωνιστών
      description: Διατηρούμε το δικαίωμα να απορρίψουμε αιτήματα πρόσβασης CAD που φαίνεται να προέρχονται από ανταγωνιστές, φοιτητές χωρίς πλαίσιο έργου ή μέρη χωρίς νόμιμη πρόθεση προμήθειας.
      icon: tabler:shield
content_models:
  tagline: Διαθέσιμα μοντέλα
  title: Τεχνικό Σχέδιο<br />Διαθεσιμότητα ανά μοντέλο
  subtitle: Διατίθενται λήψεις PDF GA για τα κύρια μοντέλα μας RIB και φουσκωτών σκαφών. Επικοινωνήστε μαζί μας για συγκεκριμένα σχέδια μοντέλων που δεν αναφέρονται.
  items:
    - title: AF580 RIB
      description: RIB 5,8 m, γάστρα GRP deep-V, σωλήνες Hypalon ή PVC, κεντρική κονσόλα. Διατίθενται GA, διαστάσεις, διάταξη καταστρώματος και σχέδιο μεταφοράς. Κατηγορία σχεδίου Γ.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: RIB 5,2 m, γάστρα GRP μέτριας V, σωλήνες Hypalon ή PVC, πλαϊνή ή κεντρική κονσόλα. Διαθέσιμα GA και διαστάσεις. Κατηγορία σχεδίου Γ.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: RIB 4,3 m, γάστρα GRP, σωλήνες PVC, βραχίονα ή κονσόλα. Διαθέσιμα GA και διαστάσεις. Κατηγορία Σχεδίου Γ/Δ.
      icon: tabler:sailboat
    - title: Φουσκωτό σκάφος AF380
      description: Φουσκωτή λέμβος 3,8 m, δάπεδο αλουμινίου, σωλήνες PVC. Διατίθενται διαστάσεις GA και συσκευασίας. Συμβατό με το πρότυπο EN ISO 6185.
      icon: tabler:sailboat
    - title: Φουσκωτό σκάφος AF320
      description: Φουσκωτό σκάφος 3,2 m, δάπεδο air deck, σωλήνες PVC. Διατίθενται διαστάσεις GA και συσκευασίας. Συμβατό με το πρότυπο EN ISO 6185.
      icon: tabler:sailboat
faq:
  title: Τεχνικά Σχέδια — Συχνές Ερωτήσεις
  questions:
    - q: Είναι πραγματικά δωρεάν τα GA PDF για λήψη;
      a: Ναί. Τα PDF γενικής διάταξης για τα κύρια μοντέλα μας διατίθενται χωρίς κόστος. Περιέχουν πληροφορίες σε επίπεδο σχεδιασμού επαρκείς για την αξιολόγηση του έργου, την κατανομή χώρου και την προκαταρκτική αναθεώρηση προδιαγραφών.
    - q: Πώς μπορώ να αποκτήσω πρόσβαση σε αρχεία DXF/DWG;
      a: Συμπληρώστε τη σύντομη φόρμα πιστοποίησης στη σελίδα λήψης με το όνομα της εταιρείας σας, τον τύπο του έργου και την προβλεπόμενη χρήση. Τα εγκεκριμένα αιτήματα λαμβάνουν έναν σύνδεσμο λήψης μέσω email εντός 1 εργάσιμης ημέρας.
    - q: Μπορώ να πάρω μοντέλα STEP/IGES 3D;
      a: Τα αρχεία μοντέλου STEP ή IGES 3D είναι διαθέσιμα μέσω της διαδικασίας εφαρμογής του έργου μας. Δώστε το εύρος του έργου σας, τις απαιτήσεις ενσωμάτωσης, το χρονοδιάγραμμα και την πρόθεση αγοράς. Υπόκειται σε έγκριση — συνήθως εντός 3-5 εργάσιμων ημερών.
    - q: Γιατί περιορίζετε την πρόσβαση σε αρχεία με μεγαλύτερη λεπτομέρεια;
      a: Η γεωμετρία του κύτους, τα δεδομένα καλουπιού και οι δομικοί υπολογισμοί αντιπροσωπεύουν χρόνια επενδύσεων σε Ε&Α και αποτελούν βασική IP κατασκευής. Παρέχουμε ό,τι χρειάζεται για τον προγραμματισμό προμηθειών και την ενσωμάτωση έργων, ενώ προστατεύουμε την ικανότητά μας να συνεχίσουμε να επενδύουμε στην ανάπτυξη νέων προϊόντων.
    - q: Περιλαμβάνουν τα σχέδια λεπτομέρειες κατασκευής;
      a: Όχι. Τα δημόσια σχέδια και τα σχέδια φωτεινής μορφής περιέχουν πληροφορίες σε επίπεδο προμήθειας για σχεδιασμό και προδιαγραφές. Οι λεπτομέρειες σε επίπεδο κατασκευής (χρονοδιαγράμματα πλαστικοποίησης, διαδρομές εργαλείων, επεκτάσεις κοπής) κοινοποιούνται μόνο στο NDA με επιβεβαιωμένες παραγγελίες.
    - q: Είναι διαθέσιμα σχέδια για προσαρμοσμένες ή ημι-προσαρμοσμένες διαμορφώσεις RIB;
      a: Τα προσαρμοσμένα σχέδια έργων προετοιμάζονται ως μέρος της διαδικασίας ανάπτυξης OEM/ODM. Εάν αξιολογείτε ένα προσαρμοσμένο έργο RIB, επικοινωνήστε μαζί μας με τις απαιτήσεις σας και θα παρέχουμε σχέδια GA για συγκεκριμένο έργο ως μέρος της πρότασης.
