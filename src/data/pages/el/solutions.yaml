features3_solutions:
  tagline: Λύσεις
  title: Ο επιχειρηματικός συνεργάτης σας για το Water Adventure<br />
  isBeforeContent: false
  columns: 3
  items:
    - title: Σύλλογοι Θαλάσσιων Σπορ
      description: Ολοκληρωμένα πακέτα εξοπλισμού, προσαρμοσμένη επωνυμία και προγράμματα συντήρησης για SUP κλαμπ, λέσχες καγιάκ, σχολές σέρφινγκ και κέντρα εκπαίδευσης.
      icon: tabler:users
      link: /solutions/clubs
    - title: RIB για θαλάσσια σπορ
      description: Κατασκευασμένα RIB για σχολές ιστιοπλοΐας, κέντρα θαλάσσιων σπορ και οργανώσεις εκδηλώσεων. Προπονητικά σκάφη, ρυμουλκούμενα και σκάφη Marshal για επαγγελματικά θαλάσσια σπορ.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Θέρετρα & Ξενοδοχεία
      description: Premium προγράμματα θαλάσσιων σπορ με εξοπλισμό στόλου, συστήματα ασφαλείας, εκπαίδευση προσωπικού και διαχείριση εσόδων για καταλύματα φιλοξενίας.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Επιχειρηματίες μάρκας νερού
      description: Ιδιωτική ετικέτα OEM/ODM κατασκευή με χαμηλά MOQ, προσαρμοσμένο σχεδιασμό προϊόντων, συσκευασία και παγκόσμια αποστολή για νέους ιδιοκτήτες επωνυμίας.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Σκάφη καταδυτικού κέντρου
      description: Σταθερές πλατφόρμες RIB με εύκολη είσοδο/έξοδο, αποθήκευση εξοπλισμού και διαμορφώσεις κινητήρων βελτιστοποιημένες για επιχειρήσεις κατάδυσης.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Σκάφη Διάσωσης και Έκτακτης Ανάγκης
      description: Υψηλής ταχύτητας RIB και φουσκωτά σκάφη σχεδιασμένα για έρευνα και διάσωση, αντίδραση σε καταστάσεις έκτακτης ανάγκης και επιχειρήσεις ακτοφυλακής.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Λύσεις Tender για Γιοτ
      description: Συμπαγή και κομψά tenders RIB που συμπληρώνουν σούπερ γιοτ και σκάφη αναψυχής. Εύκολη αποθήκευση, ισχυρές επιδόσεις.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Λύσεις Αλιευτικών Σκαφών
      description: Σταθερά και ανθεκτικά φουσκωτά σκάφη και RIB διαμορφωμένα για εμπορικές και ψυχαγωγικές αλιευτικές επιχειρήσεις.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Εξοπλισμός Θαλάσσιου Τουρισμού
      description: Φουσκωτά σκάφη έτοιμα για στόλο, σανίδες SUP και καγιάκ για θέρετρα, οργανισμούς περιηγήσεων και επιχειρήσεις ενοικίασης θαλασσίων σπορ.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: RIB για υπεράκτια ενέργεια
      description: RIB βαρέως τύπου για υποστήριξη πλατφόρμας πετρελαίου και φυσικού αερίου, μεταφορά πληρώματος αιολικού πάρκου, επιθεώρηση υποθαλάσσιων καλωδίων και θαλάσσια κατασκευή.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Σκάφη εργασίας Υδατοκαλλιέργειας
      description: Ανθεκτικά στη διάβρωση RIB για ιχθυοκαλλιέργεια, καλλιέργεια μαργαριταριών και εκτροφή ωκεανών. Hypalon σωλήνες, υλικό από ανοξείδωτο χάλυβα, ανθεκτικότητα καθημερινής χρήσης.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Θαλάσσια Έρευνα & Έρευνα
      description: Σταθερά RIBs έτοιμα για όργανα για ωκεανογραφική έρευνα, περιβαλλοντική παρακολούθηση, δειγματοληψία ποιότητας νερού και πανεπιστημιακά προγράμματα διδασκαλίας.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Εμπορικά Σκάφη Εργασίας
      description: Ενισχυμένα RIB για περιπολία, τοπογραφικές μετρήσεις, μεταφορές και υπεράκτια logistics. Κατασκευασμένα για τις αυστηρές απαιτήσεις εμπορικών επιχειρήσεων.
      icon: tabler:ship
      link: /commercial-workboats
