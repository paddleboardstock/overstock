hero:
  tagline: Η Ομάδα μας
  title: 'Οι άνθρωποι πίσω από την Paddle Board Overstock<br />— μηχανική για ελευθερία στο νερό'
  subtitle: 'Ιδρυμένη το 2012 στο Qingdao της Κίνας, η Paddle Board Overstock δημιουργήθηκε από ναυπηγούς μηχανικούς, επιστήμονες υλικών και λάτρεις των θαλάσσιων σπορ που πίστευαν ότι τα επαγγελματικά φουσκωτά σκάφη πρέπει να είναι προσιτά σε όλο τον κόσμο.'
  image:
    src: /images/team-all.webp
    alt: Ομαδική φωτογραφία όλης της ομάδας της Paddle Board Overstock — μηχανική, παραγωγή και διοίκηση
founding:
  tagline: Η Ίδρυσή μας
  title: 'Από ένα εργαστήριο στην ακτή<br />σε μια εγκατάσταση 12,000 m²'
  subtitle: 'Η Paddle Board Overstock ιδρύθηκε από μια ομάδα ναυπηγών μηχανικών με δεκαετίες σωρευμένης εμπειρίας στον σχεδιασμό φουσκωτών σκαφών, στην κατεργασία PVC/Hypalon και στην παγκόσμια παραγωγή ναυτικού εξοπλισμού.'
  items:
    - title: "Ίδρυση: 2012"
      description: 'Εδρα στο Qingdao της Κίνας — σημαντικό ναυτικό κόμβο με βαθιά ναυπηγική παράδοση.'
      icon: tabler:calendar
    - title: 200-300 εργαζόμενοι
      description: 'Συμπεριλαμβανομένων 50+ μηχανικών R&D, ειδικών ποιοτικού ελέγχου και τεχνικών παραγωγής.'
      icon: tabler:users
    - title: Εγκατάσταση 12,000 m²
      description: 'Ιδιόκτητο εργοστάσιο με 6 γραμμές παραγωγής για σκάφη RIB, φουσκωτές βάρκες και σανίδες SUP.'
      icon: tabler:building-factory
    - title: 'Εξυπηρέτηση άνω των 50 χωρών'
      description: 'Εξαγωγές στην Ευρώπη, την Αμερική, τη Μέση Ανατολή, την Ασία-Ειρηνικό και την Αφρική.'
      icon: tabler:globe
leadership:
  tagline: Ηγεσία
  title: 'Διοίκηση και μηχανική ηγεσία'
  subtitle: 'Η ηγετική μας ομάδα συνδυάζει βαθιά εξειδίκευση στη ναυτική μηχανική, το διεθνές εμπόριο και τη διαχείριση ποιότητας.'
  columns: 3
  items:
    - title: Ιδρυτής και Διευθύνων Σύμβουλος
      name: 'Toby Liu'
      description: 'Πάνω από 15 χρόνια στη ναυτική κατασκευή. Ηγήθηκε προηγουμένως της R&D σε μεγάλο Κινέζο κατασκευαστή σκαφών. Κάτοχος πολλαπλών διπλωμάτων ευρεσιτεχνίας στον σχεδιασμό φουσκωτών σκαφών.'
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Πρώτος Μηχανικός
      name: 'Zhang Wei'
      description: 'Πάνω από 20 χρόνια σε κατεργασία PVC/Hypalon και σχεδιασμό κάρων deep-V. Πρώην τεχνικός διευθυντής σε ευρωπαϊκή εταιρεία ναυτικής μηχανικής.'
      icon: tabler:engine
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: Υπεύθυνος Έρευνας & Ανάπτυξης
      name: 'Chen Ming'
      description: 'Διδακτορικό στην Επιστήμη των Υλικών. Εξειδικευμένος στην τεχνολογία drop-stitch και στην υψηλής συχνότητας συγκόλληση. Πάνω από 10 χρόνια σε υφασμάτινα σύνθετα υλικά.'
      icon: tabler:flask
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: Διευθυντής Παραγωγής
      name: 'Liu Qiang'
      description: 'Πάνω από 18 χρόνια σε lean κατασκευή και βελτιστοποίηση γραμμών παραγωγής. Six Sigma Black Belt. Εφάρμοσε συστήματα ποιότητας ISO 9001.'
      icon: tabler:settings
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: Υπεύθυνος Ποιότητας
      name: 'Wang Fang'
      description: 'Πάνω από 12 χρόνια σε ναυτικό ποιοτικό έλεγχο. Πιστοποιημένος ελεγκτής CE και ISO. Επιβλέπει τις δοκιμές κάθε παρτίδας παραγωγής.'
      icon: tabler:shield-check
      image: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E'
    - title: 'Διευθυντής Πωλήσεων και Λειτουργιών'
      name: 'Helen Lee'
      description: 'Πάνω από 15 χρόνια σε διεθνές B2B εμπόριο. Διαχείρισε συνεργασίες OEM/ODM σε περισσότερες από 30 χώρες. Μιλά άπταιστα 4 γλώσσες.'
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Φιλοσοφία Σχεδιασμού
  title: 'Σχεδιασμός καθοδηγούμενος από τη μηχανική<br />— κάθε λεπτομέρεια μετράει'
  subtitle: 'Η μηχανική μας φιλοσοφία βασίζεται σε τρεις αρχές που καθοδηγούν κάθε προϊόν που κατασκευάζουμε.'
  list:
    - 'Αξιοπιστία πάνω απ'' όλα: Κάθε προϊόν Paddle Board Overstock δοκιμάζεται να αντέχει σε πραγματικές συνθήκες — από επιχειρήσεις διάσωσης σε κρύα νερά μέχρι ενοικιάσεις σε τροπικά θέρετρα. Υπερκαλύπτουμε τις προδιαγραφές εκεί όπου μετράει περισσότερο.'
    - 'Ακρίβεια κατασκευής: Οι εγκαταστάσεις μας χρησιμοποιούν κοπή CNC, υψηλής συχνότητας συγκόλληση και αυτοματοποιημένες δοκιμές πίεσης. Κάθε ραφή, κάθε βαλβίδα, κάθε εξάρτημα πληροί τεκμηριωμένες προδιαγραφές.'
    - 'Συνεχής καινοτομία: Η ομάδα R&D μας αξιολογεί συνεχώς νέα υλικά, μεθόδους παραγωγής και βελτιώσεις σχεδιασμού. Δεν περιμένουμε τα προβλήματα — τα προβλέπουμε.'
cta:
  title: 'Θέλετε να συζητήσετε ένα έργο με την ομάδα μας;'
  subtitle: 'Οι μηχανικοί μας είναι έτοιμοι να σας συμβουλεύσουν για την επιλογή προϊόντων, την προσαρμογή και τις συνεργασίες OEM/ODM.'
  actions:
    - variant: primary
      text: Επικοινωνήστε με την ομάδα μας
      href: /contact
    - text: Δείτε τα προϊόντα μας
      href: /products
