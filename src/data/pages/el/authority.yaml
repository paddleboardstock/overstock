hero:
  tagline: Κέντρο Αρχών
  title: Γιατί το Aquafarer;<br />Η εμπιστοσύνη χτίστηκε πάνω από μια δεκαετία
  subtitle: Κάθε σκάφος που κατασκευάζουμε φέρει το βάρος 10+ ετών ναυτικής μηχανικής, πιστοποιημένων συστημάτων ποιότητας και χιλιάδων επιτυχημένων λειτουργιών παγκοσμίως. Αυτός είναι ο λόγος που οι επαγγελματίες του κλάδου επιλέγουν το Aquafarer.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Κατασκευαστική μονάδα και ομάδα μηχανικής Aquafarer Marine
stats:
  title: Ο Aquafarer με τους αριθμούς
  stats:
    - title: Χρόνια λειτουργίας
      amount: Since 2012
    - title: Μηχανικοί Ε&Α
      amount: 50+
    - title: Εξυπηρετούμενες χώρες
      amount: 50+
    - title: Παραδόθηκε εξοπλισμός
      amount: 15,000+
features3_brand:
  tagline: Ποιοι Είμαστε
  title: Θεμέλια Μάρκας<br />& Κληρονομιά
  subtitle: Η ιστορία, η τεχνογνωσία και η παγκόσμια απήχηση που καθορίζουν την Aquafarer ως έναν αξιόπιστο κατασκευαστή ναυτιλιακού εξοπλισμού.
  isBeforeContent: false
  columns: 3
  items:
    - title: Σχετικά με το Aquafarer
      description: Ιδρύθηκε το 2012 στο Qingdao της Κίνας. Από ένα παράκτιο εργαστήριο σε μια εγκατάσταση 12.000 m² — η πλήρης ιστορία του Aquafarer.
      icon: tabler:building-factory
      link: /about
    - title: Ιστορία επωνυμίας
      description: Πώς μια ομάδα μηχανικών ναυτιλίας ξεκίνησε να κάνει φουσκωτά σκάφη επαγγελματικής ποιότητας προσβάσιμα σε όλο τον κόσμο.
      icon: tabler:book
      link: /brand-story
    - title: Εμπειρογνωμοσύνη στη Ναυτιλιακή Βιομηχανία
      description: Βαθιά επιστήμη υλικών, κατασκευή ακριβείας και πραγματικές δοκιμές — δεκαετίες θαλάσσιας μηχανικής σε κάθε κύτος.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Παγκόσμια Παρουσία
      description: Εξυπηρετεί 50+ χώρες σε κάθε ήπειρο. Περιφερειακή εμπειρογνωμοσύνη για τοπικές ρυθμιστικές απαιτήσεις και προτιμήσεις της αγοράς.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Γιατί Aquafarer
      description: Τι μας ξεχωρίζει — ποιότητα, προσαρμογή, άμεση εργοστασιακή τιμολόγηση και υποστήριξη από άκρο σε άκρο για εμπορικούς φορείς.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Η ομάδα μας
      description: Γνωρίστε την ηγεσία — ναυτικούς μηχανικούς, επιστήμονες υλικών και ειδικούς στον τομέα της κατασκευής που οδηγούν το Aquafarer προς τα εμπρός.
      icon: tabler:users
      link: /brand/team
    - title: Ομάδα Μηχανικών
      description: 78+ συνδυασμένα έτη Ε&Α, 40+ πλατφόρμες, 12 πιστοποιήσεις, 1200+ έργα OEM. Η τεχνική ομάδα πίσω από κάθε προϊόν.
      icon: tabler:engine
      link: /engineering-team
    - title: Κέντρο Ε&Α
      description: Μηχανική κύτους, συγκόλληση ραδιοσυχνοτήτων, εργαστήριο PVC, πρωτότυπα, δεξαμενή δοκιμών και εργαστήριο ποιότητας — η πλήρης μας εγκατάσταση έρευνας και ανάπτυξης.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Εμπιστοσύνη & Ποιότητα
  title: Πιστοποιήσεις, Ποιότητα<br />& Απόδειξη
  subtitle: Ανεξάρτητες πιστοποιήσεις, αυστηρές δοκιμές και πραγματικά στοιχεία που αποδεικνύουν τη δέσμευσή μας στην ποιότητα.
  isBeforeContent: false
  columns: 3
  items:
    - title: Πιστοποιήσεις
      description: CE, ISO 9001, UKCA, BSCI, REACH — πλήρης τεκμηρίωση πιστοποίησης και συμμόρφωση για τις παγκόσμιες αγορές.
      icon: tabler:shield-check
      link: /certifications
    - title: Ποιότητα & Δοκιμές
      description: Κάθε προϊόν ελέγχεται υπό πίεση πριν από την αποστολή. Αντοχή ραφής, αντοχή στην υπεριώδη ακτινοβολία, άνωση — επαληθεύεται σε κάθε στάδιο.
      icon: tabler:clipboard-check
      link: /quality
    - title: Στοιχεία & Απόδειξη
      description: Αποτελέσματα δοκιμών, φωτογραφίες ανάπτυξης, αναφορές επιθεώρησης τρίτων και μελέτες περιπτώσεων που επικυρώνουν την ποιότητα του Aquafarer.
      icon: tabler:file-check
      link: /evidence
    - title: Γράφημα Γνώσης
      description: Εξερευνήστε το γράφημα οντοτήτων Aquafarer — προϊόντα, τεχνολογίες, πιστοποιήσεις και σχέσεις σε μια συνδεδεμένη βάση γνώσεων.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Ηγεσία
  title: Γνωρίστε την ομάδα<br />Πίσω από το Aquafarer
  subtitle: Βιομηχανική τεχνογνωσία που καλύπτει τη ναυτική μηχανική, την επιστήμη των υλικών, τη διαχείριση ποιότητας και το παγκόσμιο εμπόριο B2B.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Ιδρυτής & Διευθύνων Σύμβουλος
      description: 15+ χρόνια στη ναυπηγική βιομηχανία. Προηγουμένως ηγήθηκε έρευνας και ανάπτυξης σε μεγάλο κινεζικό κατασκευαστή σκαφών. Κατέχει πολλαπλές πατέντες σε σχέδιο φουσκωτής βάρκας.
      icon: tabler:crown
    - title: Zhang Wei — Αρχιμηχανικός
      description: 20+ χρόνια στην κατασκευή PVC/Hypalon και στο σχεδιασμό γάστρας βαθιάς V. Πρώην τεχνικός διευθυντής σε ευρωπαϊκή εταιρεία ναυτικών μηχανικών.
      icon: tabler:engine
    - title: Chen Ming — Επικεφαλής Ε&Α
      description: Διδακτορικό στην Επιστήμη των Υλικών. Εξειδικεύεται στην τεχνολογία σταγόνας-βελονιάς και στη συγκόλληση υψηλής συχνότητας. 10+ χρόνια σε σύνθετα υφάσματα.
      icon: tabler:flask
    - title: Liu Qiang — Διευθυντής Παραγωγής
      description: 18+ χρόνια στη λιτή κατασκευή. Μαύρη ζώνη Six Sigma. Εφαρμόστηκαν συστήματα ποιότητας ISO 9001 σε όλες τις γραμμές παραγωγής.
      icon: tabler:settings
    - title: Wang Fang — Υπεύθυνος ποιότητας
      description: 12+ χρόνια στον ποιοτικό έλεγχο της θάλασσας. Πιστοποιημένος ελεγκτής CE και ISO. Επιβλέπει τις δοκιμές για κάθε παρτίδα παραγωγής.
      icon: tabler:shield-check
    - title: Helen Lee - Διευθύντρια Πωλήσεων
      description: 15+ χρόνια στο διεθνές εμπόριο B2B. Διαχείριση συνεργασιών OEM/ODM σε 30+ χώρες. Μιλάει άπταιστα 4 γλώσσες.
      icon: tabler:briefcase
