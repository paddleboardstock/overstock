hero:
  title: Οδηγός μεγεθών και προδιαγραφών
  subtitle: Διαστάσεις, χωρητικότητες και προτεινόμενες χρήσεις για κάθε προϊόν Paddle Board Overstock.

categories:
  inflatable: Φουσκωτά SUP και καγιάκ σχεδιασμένα για φορητότητα χωρίς συμβιβασμούς στην απόδοση. Επίλεξε το σωστό μέγεθος για το βάρος και το στυλ κωπηλασίας σου.
  rib: Φουσκωτά σκάφη με άκαμπτη γάστρα για παράκτια πλοήγηση, περιπολίες και επαγγελματικές θαλάσσιες επιχειρήσεις. Διάλεξε βάσει μήκους και ισχύος κινητήρα.
  accessory: Αξεσουάρ και εξοπλισμός ασφαλείας για να συμπληρώσεις τον θαλάσσιο εξοπλισμό σου. Universal μεγέθη με πολλαπλές επιλογές.

