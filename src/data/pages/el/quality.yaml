tests:
  - title: Δοκιμή πίεσης
    standard: ISO 6185-1 | Εσωτερική προδιαγραφή AF-PT-001
    description: Οι φουσκωτοί θάλαμοι υπόκεινται σε πίεση 1,25 φορές το συνιστώμενο όριο λειτουργίας και διατηρούνται για 30 λεπτά. Η αποσύνθεση πίεσης μετράται για να επικυρώσει την αεροστεγανότητα και τη δομική ακεραιότητα των υλικών και των ραφών.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Δοκιμή κρούσης
    standard: Εσωτερική προδιαγραφή AF-IT-002
    description: Τα προϊόντα υπόκεινται σε ελεγχόμενες κρούσεις από τυποποιημένα βάρη πτώσης και συσκευές εκκρεμούς. Αυτό αξιολογεί την αντίσταση στη διάτρηση, τη διάδοση σε σχίσιμο και τη δομική ανθεκτικότητα σε συγκρούσεις με εμπόδια, αποβάθρες και συντρίμμια.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: Δοκιμή αντοχής στην υπεριώδη ακτινοβολία
    standard: ASTM G154 | ISO 4892-3
    description: Τα δείγματα υλικού εκτίθενται σε λαμπτήρες UVA-340 σε θαλάμους επιταχυνόμενης διάβρωσης για 1.000+ ώρες. Μετράμε την αλλαγή χρώματος (Δέλτα Ε), τη διατήρηση της στιλπνότητας και την απώλεια αντοχής σε εφελκυσμό για να επικυρώσουμε τα πακέτα σταθεροποιητών υπεριώδους ακτινοβολίας.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Δοκιμή αντίστασης στην τριβή
    standard: ASTM D751 (Taber) | ISO 5470-1
    description: Τα δείγματα υλικών υποβάλλονται σε λειαντικούς τροχούς CS-10 κάτω από φορτία 500 g/1.000 g για 1.000 κύκλους. Η απώλεια μάζας και η οπτική διαβάθμιση φθοράς καθορίζουν την ανθεκτικότητα της επίστρωσης έναντι άμμου, χαλίκι και επαναλαμβανόμενης εκτόξευσης.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Δοκιμή απόδοσης σε χαμηλή θερμοκρασία
    standard: Εσωτερική προδιαγραφή AF-LT-003 | MIL-STD-810G
    description: Τα συναρμολογημένα προϊόντα και τα κουπόνια υλικών προετοιμάζονται στους -20°C, -10°C και 0°C για 24 ώρες και στη συνέχεια ελέγχονται με ευκαμψία. Επαληθεύουμε ότι τα PVC και Hypalon παραμένουν εύκαμπτα χωρίς ρωγμές ή αποκόλληση.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Δοκιμή άνωσης & ικανότητας φορτίου
    standard: ISO 6185-1 | ISO 12402
    description: Τα προϊόντα φορτώνονται σταδιακά σε 1,25x ονομαστική χωρητικότητα σε ελεγχόμενη πισίνα. Καταγράφονται εξάλων, σταθερότητα και απόδοση αυτοστραγγίσεως. Η ονομαστική χωρητικότητα κάθε μοντέλου επαληθεύεται μαθηματικά και εμπειρικά.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Δοκιμή ελιγμών
    standard: Εσωτερική προδιαγραφή AF-MT-004
    description: Οι δοκιμές στο νερό μετρούν την ακτίνα στροφής, την επιτάχυνση, τον χρόνο πλανίσματος και την απόκριση κουπιών/κινητήρα σε μια σειρά συνθηκών φορτίου. Τα χαρακτηριστικά χειρισμού του πραγματικού κόσμου επικυρώνονται έναντι των στόχων σχεδιασμού.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Δοκιμή στεγανότητας
    standard: ISO 6185-1 §7.3 | Εσωτερική προδιαγραφή AF-WT-005
    description: Κάθε συναρμολογημένο προϊόν ελέγχεται με ψεκασμό στα 0,5 bar σε όλες τις ραφές, τις βαλβίδες και τα εξαρτήματα. Μια δοκιμή βύθισης υπό πίεση 5 λεπτών επικυρώνει τη στεγανότητα του θαλάμου και της βαλβίδας. Πρότυπο μηδενικής διαρροής πριν από την αποστολή.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
