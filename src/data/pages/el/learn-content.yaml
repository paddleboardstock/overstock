articles:
  sup:
    - title: Βασικά SUP — οδηγός για αρχάριους
      desc: 'Όλα όσα πρέπει να γνωρίζει ένας αρχάριος: τύποι σανίδων, μέγεθος κουπιού, στάση και συμβουλές για την πρώτη μέρα.'
    - title: Οδηγός μεγεθών SUP
      desc: Βρείτε το σωστό μήκος, πλάτος και όγκο της σανίδας για το βάρος, το επίπεδο και το στυλ κωπηλασίας σας.
    - title: Φουσκωτό ή σκληρό SUP
      desc: Ποιο σας ταιριάζει; Φορητότητα, απόδοση, αντοχή και κόστος σε σύγκριση.
    - title: Ενδιάμεσες τεχνικές
      desc: Αναβαθμίστε την κωπηλασία σας με προχωρημένες κινήσεις κουπιού, τεχνικές στροφής και χειρισμό σε τραχιά νερά.
    - title: Πώς να επιλέξετε φουσκωτό SUP
      desc: 'Οι βασικοί παράγοντες: κατασκευή, πάχος, διάταξη πτερωτών και περιλαμβανόμενα αξεσουάρ.'
    - title: Ασφάλεια στο νερό
      desc: 'Απαραίτητες γνώσεις ασφάλειας: ανάγνωση καιρού, επιλογή σωσίβου (PFD), αυτοδιάσωση και ομαδική κωπηλασία.'
  inflatable-boat:
    - title: Αναφορά υλικών
      desc: PVC, Hypalon, drop-stitch, τιμές denier — κατανοήστε από τι αποτελείται ο φουσκωτός εξοπλισμός σας.
    - title: Σύγκριση PVC vs Hypalon
      desc: Η οριστική σύγκριση των υφασμάτων PVC και Hypalon για φουσκωτά σκάφη — αντοχή, αντίσταση UV και κόστος.
    - title: Ο πυρήνας drop-stitch εξηγείται
      desc: Πώς χιλιάδες εσωτερικές κλωστές δημιουργούν άκαμπτη πλατφόρμα στα 12-15 PSI για φουσκωτά SUP υψηλών επιδόσεων.
    - title: Επισκόπηση φουσκωτής τεχνολογίας
      desc: Πώς κατασκευάζονται τα φουσκωτά σκάφη και τα SUP — από τη διάταξη υλικών έως τα συστήματα βαλβίδων και τη συγκόλληση ραφών.
    - title: Οδηγός για σκάφη RIB (άκαμπτο κύτος)
      desc: Όλα για την κατασκευή RIB, τους τύπους κύτους, τα υλικά σωλήνων και την επιλογή του κατάλληλου RIB για τις ανάγκες σας.
    - title: Φουσκωτό σκάφος vs RIB
      desc: Οι βασικές διαφορές μεταξύ των παραδοσιακών φουσκωτών λέμβων και των σκαφών με άκαμπτο κύτος ανά χρήση.
  water-safety:
    - title: Οδηγός ασφάλειας στο νερό
      desc: Απαραίτητες γνώσεις ασφάλειας για κάθε κωπηλάτη — καιρός, σωσίβια (PFD), αυτοδιάσωση και πρωτόκολλα ομαδικής κωπηλασίας.
    - title: Οδηγός σωσίβων και PFD
      desc: Πώς να επιλέξετε το σωστό μέσο επίπλευσης για SUP, καγιάκ, σκάφη και επαγγελματική χρήση.
    - title: Checklist ασφάλειας SUP
      desc: Η λίστα ελέγχου ασφάλειας πριν την είσοδο στο νερό που πρέπει να ακολουθεί κάθε paddleboarder.
    - title: Ασφάλεια στην κωπηλασία σε κρύο νερό
      desc: Απαραίτητες προφυλάξεις, εξοπλισμός και τεχνικές για κωπηλασία σε κρύο νερό.
    - title: Σφάλματα αρχαρίων στην κωπηλασία
      desc: Συχνά λάθη των αρχαρίων και πώς να τα αποφύγετε για μια ασφαλέστερη και πιο ευχάριστη εμπειρία.
    - title: Πιστοποίηση CE εξηγείται
      desc: Τι σημαίνει η πιστοποίηση CE για τα φουσκωτά σκάφη — πρότυπα, δοκιμές και γιατί έχει σημασία για την ασφάλεια.
ui:
  read_guide: Διαβάστε τον οδηγό →
  card_tech: Ναυτική μηχανική ασφάλειας και δοκιμές υλικών
  card_products: Εξερευνήστε τον πλήρη κατάλογο προϊόντων Paddle Board Overstock
  card_trust: Συμμόρφωση CE, ISO και BSCI
materials:
  intro_p1: Οι επιδόσεις, η αντοχή και η ασφάλεια ενός φουσκωτού σκάφους εξαρτώνται σχεδόν εξ ολοκλήρου από τα υλικά που χρησιμοποιούνται στην κατασκευή του. Από το ύφασμα που σχηματίζει τους σωλήνες έως τις κλωστές που δίνουν σε μια σανίδα SUP την ακαμψία της — κάθε επιλογή υλικού επηρεάζει τη συμπεριφορά του προϊόντος στο νερό και τη διάρκεια ζωής του.
  intro_p2: 'Αυτός ο οδηγός καλύπτει τα τέσσερα βασικά υλικά που χρησιμοποιούνται στα σύγχρονα φουσκωτά σκάφη: ύφασμα PVC, καουτσούκ Hypalon CSM, κατασκευή με πυρήνα drop-stitch και καταστρώματα από αφρό EVA. Η κατανόηση αυτών των υλικών θα σας βοηθήσει να επιλέξετε το κατάλληλο προϊόν για τις ανάγκες σας και να το συντηρείτε για μέγιστη διάρκεια ζωής.'
  labels:
    advantages: Πλεονεκτήματα
    limitations: Περιορισμοί
    best_for: 'Καλύτερο για:'
  items:
    - name: PVC (πολυβινυλοχλωρίδιο)
      summary: Το πρότυπο του κλάδου για φουσκωτά σκάφη και SUP αναψυχής. Το πολυστιβάδες ελασματωμένο ύφασμα προσφέρει άριστη αναλογία αντοχής-βάρους σε προσιτή τιμή.
      pros:
        - Προσιτό — 30-50 % φθηνότερο από το Hypalon
        - Ελαφρύ και εύκολο στο χειρισμό
        - Καλή αντίσταση UV με κατάλληλα επικαλύμματα
        - Μεγάλη γκάμα χρωμάτων και φινιρισμάτων
        - Εύκολη επισκευή με μπαλώματα PVC και κόλλα διαλύτη
      cons:
        - Συντομότερη διάρκεια ζωής από το Hypalon (7-10 έτη)
        - Λιγότερο εύκαμπτο σε χαμηλές θερμοκρασίες
        - Χαμηλότερη χημική αντίσταση
        - Μπορεί να εμφανίσει μετανάστευση πλαστικοποιητών με τον χρόνο
      best_for: SUP αναψυχής, οικονομικά σκάφη, στόλοι ενοικίασης, εποχιακή χρήση, γλυκά και παράκτια νερά.
    - name: Hypalon (καουτσούκ CSM)
      summary: Premium συνθετικό καουτσούκ γνωστό για εξαιρετική αντοχή, αντίσταση UV και μακροχρόνια διάρκεια ζωής. Το χρυσό πρότυπο για εμπορικά και στρατιωτικά φουσκωτά σκάφη.
      pros:
        - Εξαιρετική αντίσταση σε UV και όζον
        - Διάρκεια ζωής 15-20 έτη με σωστή φροντίδα
        - Εξαιρετική ευκαμψία σε κρύο καιρό
        - Υπερτερούσα αντίσταση σε χημικά και πετρέλαιο
        - Διατηρεί το χρώμα περισσότερο από το PVC
      cons:
        - Αισθητά ακριβότερο από το PVC
        - Βαρύτερο ύφασμα
        - Λιγότερες επιλογές χρωμάτων
        - Οι επισκευές απαιτούν εξειδικευμένες κόλλες
        - Λιγότερες παραγωγικές μονάδες παγκοσμίως
      best_for: Εμπορικά RIB, έρευνα και διάσωση, στρατιωτικές εφαρμογές, τροπικά κλίματα, μακροχρόνια ιδιοκτησία στόλου.
    - name: Πυρήνας drop-stitch
      summary: Η τεχνολογία που άλλαξε ριζικά τα φουσκωτά SUP. Χιλιάδες κλωστές πολυεστέρα συνδέουν την πάνω και την κάτω στρώση υφάσματος, επιτρέποντας φούσκωμα υψηλής πίεσης για επιδόσεις σκληρής σανίδας.
      pros:
        - Εξαιρετικά άκαμπτος στα 12-20 PSI
        - Ελαφρύς — 18-30 lbs για σανίδα πλήρους μεγέθους
        - Διπλώνει επίπεδα για αποθήκευση και ταξίδια
        - Άριστη αντίσταση σε κρούσεις
        - Σταθερές επιδόσεις σε όλο το εύρος θερμοκρασιών
      cons:
        - Απαιτεί αντλία υψηλής πίεσης
        - Η επισκευή τρημάτων είναι πιο σύνθετη από ό,τι στις μονοστιβάδες κατασκευές
        - Υψηλότερο κόστος παραγωγής από τα τυπικά φουσκωτά
        - Η απώλεια πίεσης με τον χρόνο απαιτεί περιοδικό συμπλήρωμα
      best_for: Σανίδες stand-up paddle, καγιάκ, αεροκαταστρώματα για φουσκωτά σκάφη — κάθε εφαρμογή που απαιτεί ακαμψία με φορητότητα φουσκωτού.
    - name: Κατάστρωμα από αφρό EVA
      summary: Αφρός EVA κλειστών κυττάρων (αιθυλενιο-βινυλικό οξικό) που χρησιμοποιείται για επιθέματα πρόσφυσης σε σανίδες SUP και καταστρώματα σκαφών. Προσφέρει απορρόφηση κραδασμών, πρόσφυση και θερμική μόνωση.
      pros:
        - Άριστη αντιολισθητική πρόσφυση, βρεγμένη ή στεγνή
        - Η απορρόφηση κραδασμών μειώνει την κούραση στις μεγάλες διαδρομές κωπηλασίας
        - Θερμική μόνωση από το κρύο κατάστρωμα
        - Ανθεκτικός σε UV και αλμυρό νερό
        - Διαθέσιμο σε πολυχρωματικές συνθέσεις και σχέδια χαραγμένα με λέιζερ
      cons:
        - Μπορεί να φθαρεί με βαριά χρήση σε 2-3 έτη
        - Πρέπει να κολληθεί σωστά για αποφυγή αποφλοίωσης
        - Μη δομικό — δεν επηρεάζει την ακαμψία
        - Προσθέτει ελαφρύ βάρος (200-400 g ανά σανίδα)
      best_for: Πρόσφυση καταστρώματος SUP, επένδυση καταστρώματος σκάφους, άνεση καθίσματος καγιάκ — κάθε επιφάνεια που απαιτεί αντιολισθητική στήριξη.
  selection:
    title: Οδηγός επιλογής υλικών
    subtitle: 'Επιλέξτε το σωστό υλικό με βάση την κύρια χρήση σας:'
    headers:
      - Χρήση
      - Προτεινόμενο υλικό
      - Γιατί
    rows:
      - - Κωπηλατική SUP αναψυχής
        - PVC drop-stitch
        - Ελαφρύ, άκαμπτο, προσιτό — ιδανική ισορροπία για περιστασιακούς κωπηλάτες
      - - Οικογενειακή λέμβος / σκάφος λίμνης
        - PVC (1100 denier)
        - Οικονομικό, εύκολο στην επισκευή, επαρκής αντοχή για χρήση αναψυχής
      - - Εμπορικό RIB / σκάφος περιπολίας
        - Hypalon CSM
        - Μέγιστη αντίσταση UV, διάρκεια ζωής 15-20 έτη, αντίσταση σε χημικά και πετρέλαιο
      - - Στόλος σανίδων SUP ενοικίασης
        - PVC drop-stitch + κατάστρωμα EVA
        - Ανθεκτικό, επισκευάσιμο, καλή αξία για έντονη χρήση
      - - Επιχειρήσεις έρευνας και διάσωσης
        - Hypalon CSM
        - Αξιοπιστία σε ακραίες συνθήκες, ευκαμψία στο κρύο, χημική αντίσταση
      - - Καγιάκ touring / αποστολής
        - PVC drop-stitch
        - Άκαμπτες επιδόσεις με συσκευασιμότητα για ταξίδια
  deep_dive:
    title: Εξειδικευμένοι οδηγοί
    topics:
      - title: PVC θαλάσσιας ποιότητας
        desc: Πολυστιβάδες ελασματωμένο ύφασμα PVC — αντίσταση UV, δοκιμές τριβής και τιμές denier εξηγημένες.
      - title: Σύγκριση PVC vs Hypalon
        desc: Η οριστική σύγκριση των δύο κυρίαρχων υλικών των φουσκωτών σκαφών — κόστος, διάρκεια ζωής, αντίσταση UV.
      - title: Πυρήνας drop-stitch
        desc: Πώς χιλιάδες εσωτερικές κλωστές δημιουργούν άκαμπτες φουσκωτές κατασκευές υψηλής πίεσης στα 12-15 PSI.
      - title: Τεχνολογία συγκόλλησης RF
        desc: Η συγκόλληση υψηλής συχνότητας δημιουργεί ισχυρές, ομοιόμορφες ραφές — πώς λειτουργεί και γιατί έχει σημασία.
      - title: PSI και επιδόσεις
        desc: Γιατί η πίεση αέρα μετράει για φουσκωτά SUP και σκάφη — ακαμψία, χωρητικότητα φορτίου και ποιότητα πλεύσης.
      - title: Δοκιμές ποιότητας
        desc: Δοκιμές πίεσης, δοκιμές επίπλευσης, γήρανση UV και καταστροφικές δοκιμές — η διαδικασία ποιότητάς μας.
      - title: Καταστρώματα από αφρό EVA
        desc: Επιθέματα από αφρό EVA κλειστών κυττάρων — πρόσφυση, άνεση και αντοχή για καταστρώματα SUP και σκαφών.
      - title: Φροντίδα υλικών
        desc: Καθαρισμός, προστασία UV, πρόληψη μούχλας και βέλτιστες πρακτικές αποθήκευσης φουσκωτών προϊόντων.
