factory_details:
  - label: Μέγεθος εγκατάστασης
    value: 12.000 τ.μ. (130.000 ft²) ολοκληρωμένη πανεπιστημιούπολη στη Ζώνη Οικονομικής Ανάπτυξης του Qingdao
  - label: Ετήσια δυναμικότητα
    value: 15.000 σκάφη, συμπεριλαμβανομένων SUP, καγιάκ, dinghy, RIB και εξοπλισμού ασφαλείας
  - label: Ομάδα Ε&Α
    value: Πάνω από 25 μηχανικοί σε σχεδιασμό προϊόντων, επιστήμη υλικών και μηχανική ποιότητας
  - label: Βασικός εξοπλισμός
    value: Τραπέζια κοπής CNC, μηχανές συγκόλλησης RF, μηχανές συγκόλλησης θερμού αέρα, ψηφιακοί εκτυπωτές, καλούπια fiberglass, σταθμοί δοκιμής στεγανότητας
  - label: Γραμμές παραγωγής
    value: '6 αποκλειστικές γραμμές: κοπή PVC, συγκόλληση σωλήνων, στρώση γάστρας fiberglass, συναρμολόγηση SUP, συναρμολόγηση RIB, τελικός ποιοτικός έλεγχος'
  - label: Ετήσιος όγκος εξαγωγών
    value: Πάνω από 8 εκατ. δολάρια εξάγονται σε περισσότερες από 50 χώρες στην Ευρώπη, Αμερική, Ασία-Ειρηνικό και Μέση Ανατολή

