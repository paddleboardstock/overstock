  subtitle: Ευέλικτες παραγωγικές συνεργασίες για επιχειρήσεις κάθε μεγέθους.

certifications_section:
  tagline: Πιστοποιήσεις
  title: Παραγωγή πιστοποιημένη CE και ISO
  subtitle: Τα 64 μοντέλα μας με πιστοποίηση CE πληρούν διεθνή πρότυπα ασφαλείας και ποιότητας.

values:
  - title: Ποιότητα πρώτα
    desc: Κάθε σκάφος που φεύγει από το εργοστάσιό μας υποβάλλεται υποχρεωτικά σε δοκιμές συγκράτησης αέρα, αποκόλλησης ραφών και συστημάτων πριν την αποστολή.
  - title: Κάθετη ολοκλήρωση
    desc: Ελέγχουμε κάθε στάδιο — από την κοπή PVC έως την τελική συναρμολόγηση — εξαλείφοντας τις αναποτελεσματικότητες των υπεργολάβων και διασφαλίζοντας σταθερή ποιότητα.
  - title: Ασφάλεια ως πρότυπο
    desc: Η πιστοποίηση CE είναι η βάση όσων κατασκευάζουμε. Τα 64 μοντέλα μας με πιστοποίηση CE πληρούν τα ευρωπαϊκά πρότυπα ασφαλείας για ψυχαγωγική και επαγγελματική χρήση.
  - title: Επικεντρωμένοι στον συνεργάτη
    desc: Χτίζουμε μακροχρόνιες σχέσεις με συνεργάτες OEM, ODM και ιδιωτικής ετικέτας μέσω διαφάνειας, αξιοπιστίας και κοινής ανάπτυξης.

services:
  - title: Παραγωγή OEM
    desc: Παράγουμε σύμφωνα με τις προδιαγραφές σας. Μοιραστείτε τα σχέδιά σας και η μηχανική μας ομάδα θα αναλάβει την πρωτοτυποποίηση, την εργαλειοθήκη και την παραγωγή.
  - title: Λύσεις ODM
    desc: Ξεκινήστε από τις δοκιμασμένες πλατφόρμες σχεδιασμού μας. Προσαρμόστε μέγεθος, χρώμα, γραφικά και συσκευασία για να δημιουργήσετε μια μοναδική σειρά προϊόντων.
  - title: Ιδιωτική ετικέτα
    desc: Η επωνυμία σας, το λογότυπό σας, η συσκευασία σας. Τα προϊόντα φτάνουν έτοιμα προς πώληση με πλήρη ενσωμάτωση επωνυμίας.
  - title: Προσαρμοσμένη επωνυμία
    desc: Εκτύπωση καταστρώματος, γραφικά γάστρας, αυτοκόλλητα σωλήνων και προσαρμοσμένες ετικέτες — συνεπής παρουσία επωνυμίας σε κάθε επιφάνεια.

certifications:
  - name: Πιστοποιητικό CE
    desc: Τα σκάφη και οι πλωτές συσκευές μας συμμορφώνονται με την Οδηγία της ΕΕ για τα Ψυχαγωγικά Σκάφη (2013/53/EU) και τα σχετικά εναρμονισμένα πρότυπα.
    scope: Σκάφη και πλωτές συσκευές
  - name:
    desc: Πιστοποιημένο σύστημα διαχείρισης ποιότητας για σχεδιασμό, παραγωγή και διανομή φουσκωτών σκαφών.
    scope: Ολόκληρη η εγκατάσταση
  - name:
    desc: Φουσκωτά σκάφη — απαιτήσεις ασφαλείας και απόδοσης για ενισχυμένα και άκαμπτα φουσκωτά σκάφη.
    scope: Γραμμές RIB και φουσκωτών

