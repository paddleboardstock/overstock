hero:
  tagline: Σχετικά με εμάς
  title: 'Σχετικά με το {SITE}'
  subtitle: Κάθετα ολοκληρωμένος κατασκευαστής θαλάσσιου εξοπλισμού — από πρώτη ύλη έως έτοιμο σκάφος

intro:
  - 'Η Paddle Board Overstock ιδρύθηκε το 2012 με μία αποστολή: να σχεδιάζει και να κατασκευάζει θαλάσσιο εξοπλισμό που αποδίδει εξίσου καλά στο νερό όσο και στην έκθεση ποιότητας. Αυτό που ξεκίνησε ως ένα εργαστήριο επικεντρωμένο σε σανίδες SUP, εξελίχθηκε σε μια ολοκληρωμένη παραγωγική μονάδα 12.000 τ.μ. στη Ζώνη Οικονομικής Ανάπτυξης του Qingdao, παράγοντας φουσκωτά σκάφη, RIB, καγιάκ, σανίδες SUP, εξοπλισμό ασφαλείας και αξεσουάρ για πελάτες σε περισσότερες από 50 χώρες.'
  - Σήμερα, η Paddle Board Overstock λειτουργεί ως εργοστασιακή μάρκα — σχεδιάζουμε, μηχανολογούμε, δημιουργούμε πρωτότυπα, παράγουμε και δοκιμάζουμε τα πάντα κάτω από μία στέγη. Αυτή η κάθετη ολοκλήρωση μας δίνει άμεσο έλεγχο στην επιλογή υλικών, την ποιότητα κατασκευής και τα χρονοδιαγράμματα παράδοσης. Κάθε σκάφος κατασκευάζεται από τους ανθρώπους μας, με τον εξοπλισμό μας, σύμφωνα με τα πρότυπά μας.
  - Εξυπηρετούμε ψυχαγωγικούς χρήστες, επαγγελματίες χειριστές, κρατικούς φορείς και συνεργάτες επωνυμιών παγκοσμίως. Τα προγράμματα OEM και ODM μας βοηθούν τις εταιρείες να ξεκινήσουν τις δικές τους σειρές προϊόντων χωρίς να επενδύσουν σε εργοστασιακή υποδομή. Είτε χρειάζεστε ένα μεμονωμένο πρωτότυπο είτε μια πλήρη σειρά παραγωγής, η ομάδα μας σας καθοδηγεί από τη σύλληψη έως την παράδοση έτοιμη για τη θάλασσα.

