content_system:
  tagline: Επισκόπηση Συστήματος Ποιοτικού Ελέγχου
  title: Ολοκληρωμένο Πλαίσιο Ελέγχου Ποιότητας
  subtitle: Το σύστημα Ελέγχου Ποιότητας μας λειτουργεί ανεξάρτητα από την παραγωγή και αναφέρει απευθείας στη διοίκηση. Κανένα παρτίδα δεν αποστέλλεται χωρίς υπογεγραμμένη έγκριση ποιότητας από το εργαστήριο ποιοτικού ελέγχου.
  items:
    - title: Ανεξάρτητο Εργαστήριο Ποιότητας
      description: Το εργαστήριό μας για την ποιότητα λειτουργεί ως ξεχωριστή μονάδα από την παραγωγή. Οι ελεγκτές ποιότητας αναφέρονται στον Διευθυντή Ποιότητας, όχι στον Διευθυντή Παραγωγής. Αυτή η οργανωτική ανεξαρτησία εξασφαλίζει ότι οι αποφάσεις για την ποιότητα παίρνονται αντικειμενικά — οι προθεσμίες παραγωγής δεν παραβλέπουν ποτέ τις απαιτήσεις ποιότητας.
      features:
        - Αναφέρεται απευθείας στη διοίκηση, ανεξάρτητα από την παραγωγή
        - Εξουσιοδοτημένος να σταματήσει την παραγωγή λόγω προβλημάτων ποιότητας
        - 12 αφοσιωμένοι επιθεωρητές ποιοτικού ελέγχου σε όλα τα στάδια
        - Όλος ο εξοπλισμός δοκιμών βαθμονομείται ετησίως
    - title: Ιχνηλασιμότητα Παρτίδας
      description: Κάθε παρτίδα πρώτης ύλης ανατίθεται με έναν μοναδικό αριθμό παρτίδας στο σύστημα ERP μας. Από την άφιξη της ύλης μέχρι την παραγωγή και το τελικό προϊόν, το δελτίο υλικών κάθε σκάφους συνδέεται με τις αρχικές παρτίδες του προμηθευτή. Αυτό επιτρέπει πλήρη ιχνηλασιμότητα προς τα πίσω για οποιαδήποτε ερώτηση ποιότητας ή συμμόρφωσης.
      features:
        - Παρακολούθηση παρτίδων βασισμένη σε ERP από το υλικό μέχρι το τελικό προϊόν
        - Φυσικές ετικέτες παρτίδας σε κάθε εντολή εργασίας
        - 100% κάλυψη υλικών — PVC, Hypalon, υλικό, συγκολλητικά
        - Αρχεία διατηρούνται για 10 χρόνια (CE απαίτηση 2013/53/ΕΕ)
    - title: Πρότυπα & Συμμόρφωση
      description: Οι διαδικασίες ελέγχου ποιότητας μας ευθυγραμμίζονται με τα διεθνή πρότυπα. Τα προϊόντα είναι CE πιστοποιημένα σύμφωνα με την Οδηγία της ΕΕ για τα Αναψυχικά Σκάφη 2013/53/ΕΕ. Το σύστημα διαχείρισης ποιότητας μας είναι ISO πιστοποιημένο με ISO 9001. Η κοινωνική συμμόρφωση διατηρείται μέσω της BSCI πιστοποίησης.
      features:
        - Πιστοποίηση CE (ΕΕ 2013/53/ΕΕ)
        - ISO 9001:2015 διαχείριση ποιότητας
        - BSCI πιστοποίηση κοινωνικής συμμόρφωσης
        - REACH και συμμόρφωση υλικών RoHS
        - Πιστοποίηση UKCA μετά το Brexit
content_inspection:
  tagline: Στάδια Επιθεώρησης
  title: Διαδικασία Επιθεώρησης Έξι Σταδίων
  subtitle: Κάθε προϊόν περνά μέσα από 6 στάδια επιθεώρησης με καταγραμμένα σημεία ελέγχου ποιότητας. Τα ελαττώματα εντοπίζονται νωρίς, οι διορθωτικές ενέργειες είναι άμεσες και κάθε παρτίδα είναι πλήρως ιχνηλάσιμη.
  stages:
    - stage: '1'
      title: Έλεγχος Εισερχόμενου Υλικού
      description: Όλα τα εισερχόμενα υλικά καταγράφονται με αριθμό παρτίδας/φύρας και τίθενται σε καραντίνα μέχρι την έγκριση του Τμήματος Ποιοτικού Ελέγχου. Οι ρολά/κουβάρια υφάσματος PVC/Hypalon δοκιμάζονται για αντοχή σε εφελκυσμό (ASTM D751), αντοχή σε σχίσιμο (ISO 4674) και πάχος. Οι Drop-stitch πυρήνες, βαλβίδες, συγκολλητικά και εξαρτήματα ελέγχονται οπτικά και μετριούνται σύμφωνα με τις προδιαγραφές.
      checks: Τάση θραύσης ASTM D751, αντοχή σε σχίσιμο ISO 4674, πάχος μετρητή, ιξώδες κόλλας, έλεγχος οπτικών ατελειών
      threshold: 100% των παρτίδων που δοκιμάστηκαν. Απορρίψτε εάν υπάρχει εφελκυσμός < 90% των προδιαγραφών, σχίσιμο < προδιαγραφών ελάχ. ή οποιοδήποτε οπτικό ελάττωμα
    - stage: '2'
      title: Ποιοτικός Έλεγχος σε Διαδικασία — Κοπή & Προετοιμασία
      description: Τα πάνελ κοπής CNC ελέγχονται διαστασιακά σε σχέση με τα αρχεία πηγής CAD κάθε 20ό πάνελ. Η ποιότητα των ακμών ελέγχεται για ξεφτισμένα άκρα, ανομοιόμορφες κοπές ή διαστασιακή απόκλιση. Ο αριθμός των πάνελ επαληθεύεται σε σχέση με τη BOM για κάθε παρτίδα παραγωγής πριν τα υλικά μετακινηθούν στη συγκόλληση.
      checks: Έλεγχος διαστάσεων σε αρχεία CAD DXF, επιθεώρηση ποιότητας άκρων, επαλήθευση πλήθους πίνακα
      threshold: Ανοχή ±0,5 χλστ. Απορρίψτε την παρτίδα αν >2% εκτός ανοχών
    - stage: '3'
      title: Έλεγχος Ποιότητας σε Διαδικασία — Ηλεκτροσυγκόλληση & Συγκόλληση
      description: Κατά την παραγωγή, η ποιότητα των συγκολλήσεων παρακολουθείται συνεχώς. Δοκιμές αποφλοίωσης (ASTM D751) διεξάγονται σε δείγματα κάθε 50 μονάδες. Το πλάτος της συγκόλλησης μετράται σύμφωνα με τις προδιαγραφές. Τα αρχεία θερμοκρασίας θερμού αέρα εξετάζονται για συνέπεια. Κάθε ραφή ελέγχεται οπτικά υπό οπίσθιο φωτισμό για κανάλια ή κενά.
      checks: Δοκιμή απολέπισης ASTM D751 κάθε 50 μονάδες, μέτρηση πλάτους συγκόλλησης, ανασκόπηση καταγραφής θερμοκρασίας θερμού αέρα, επιθεώρηση ραφής με φωτισμό από πίσω
      threshold: Ελάχιστη αντοχή αποφλοίωσης 8 N/cm. Ανοχή πλάτους συγκόλλησης ±1mm. Οποιοδήποτε ορατό κανάλι = απόρριψη
    - stage: '4'
      title: Ποιοτικός Έλεγχος Συναρμολόγησης
      description: Κάθε μονάδα ακολουθεί μια λίστα ελέγχου συναρμολόγησης 100 σημείων που εγκρίνεται από τον υπεύθυνο της ομάδας. Η λειτουργία της βαλβίδας ελέγχεται μέσω 10 κύκλων ανοίγματος/κλεισίματος. Η ροπή των εξαρτημάτων ελέγχεται. Ο οπτικός έλεγχος καλύπτει το φινίρισμα της επιφάνειας, την ομοιομορφία χρώματος, τη τοποθέτηση ετικετών και την πληρότητα των αξεσουάρ.
      checks: Λίστα ελέγχου 100 σημείων ανά μονάδα, δοκιμή λειτουργίας βαλβίδας, επαλήθευση ροπής υλικού, οπτικός έλεγχος
      threshold: 'Πολιτική μηδενικών ελαττωμάτων σε κρίσιμα για την ασφάλεια είδη (βαλβίδες, δακτύλιοι D, λαβές). Μικρά καλλυντικά: AQL 2,5 (ISO 2859)'
    - stage: '5'
      title: Δοκιμή πίεσης
      description: Κάθε θάλαμος φουσκώνεται μέχρι 1,25× της ονομαστικής πίεσης και διατηρείται για 24-48 ώρες. Οι αισθητήρες πίεσης καταγράφουν συνεχώς κατά τη διάρκεια της περιόδου διατήρησης. Οι αναγνώσεις με αντιστάθμιση θερμοκρασίας εξασφαλίζουν ακρίβεια. Οποιοσδήποτε θάλαμος παρουσιάζει πτώση πίεσης μεγαλύτερη από 5% απορρίπτεται και αποστέλλεται για επανέλεγχο των ραφών με επανέλεγχο 100% ολόκληρης της παραγωγικής παρτίδας.
      checks: 24-48ωρη καταγραφή πίεσης, επαλήθευση βαθμονόμησης αισθητήρα καθημερινά, μέτρηση με αντιστάθμιση θερμοκρασίας, επανέλεγχος ραφής μετά την επισκευή
      threshold: Μέγιστη πτώση πίεσης 5% σε 24 ώρες σε σταθερή θερμοκρασία. Υπέρβαση = 100% επανέλεγχος ολόκληρης της παρτίδας
    - stage: '6'
      title: Τελικός Έλεγχος & Απελευθέρωση Αποστολής
      description: Τελικός οπτικός και λειτουργικός έλεγχος πριν τη συσκευασία. Ελέγχονται για επιφανειακά ελαττώματα, ομοιομορφία χρώματος, επαλήθευση ετικέτας/κωδικού BIN, ακεραιότητα συσκευασίας και πληρότητα αξεσουάρ σύμφωνα με την παραγγελία του πελάτη. Οι μονάδες συσκευάζονται σε κενό, τοποθετούνται σε κουτιά και παλετοποιούνται. Απαιτείται τελική έγκριση QC πριν οποιοδήποτε προϊόν φύγει από το εργοστάσιο.
      checks: Πλήρης οπτική επιθεώρηση, λίστα ελέγχου αξεσουάρ ανά SKU, δοκιμή πτώσης συσκευασίας (τυχαίο δείγμα 1μ), επαλήθευση σάρωσης ετικέτας/γραμμωτού κώδικα
      threshold: AQL 2,5 κύριες δυσλειτουργίες, AQL 4,0 δευτερεύουσες. Μηδενική ανοχή σε ελαττώματα ασφαλείας. Το 100% των μονάδων ελέγχθηκε οπτικά
content_equipment:
  tagline: Εξοπλισμός Δοκιμών
  title: Εξοπλισμός Εργαστηρίου Ποιοτικού Ελέγχου
  subtitle: Το εργαστήριο ποιότητας μας είναι εξοπλισμένο με εξειδικευμένο εξοπλισμό δοκιμών για την επαλήθευση υλικών, την ακεραιότητα των συγκολλήσεων και την επικύρωση απόδοσης προϊόντων.
  columns: 3
  items:
    - title: Μηχανή Δοκιμής Τάσης
      description: Μετρά την αντοχή σε εφελκυσμό και την επιμήκυνση του υφάσματος σύμφωνα με το ASTM D751. Χρησιμοποιείται για τον έλεγχο εισερχόμενης ποιότητας όλων των παρτίδων υφασμάτων PVC, Hypalon και drop-stitch.
      icon: tabler:scale
    - title: Θάλαμος Θερμοκρασίας
      description: Περιβαλλοντική κοιλότητα για δοκιμές αντοχής UV (ASTM G154) και δοκιμές ευκαμψίας σε χαμηλές θερμοκρασίες. Προσομοιώνει ακραίες λειτουργικές συνθήκες.
      icon: tabler:temperature
    - title: Αισθητήρες και Καταγραφείς Πίεσης
      description: Ψηφιακοί αισθητήρες πίεσης με συνεχή καταγραφή δεδομένων για δοκιμές διατήρησης αέρα 24-48 ωρών. Με θερμοκρασιακή αντιστάθμιση για ακρίβεια.
      icon: tabler:wind
    - title: Στάση Δοκιμής Αποκόλλησης
      description: Εξοπλισμός δοκιμών απολέπισης βαθμονομημένος για επαλήθευση της αντοχής των ραφών συγκόλλησης. Τυχαία δείγματα από κάθε παρτίδα παραγωγής.
      icon: tabler:files
    - title: Δεξαμενή Ανίχνευσης Διαρροών
      description: Δεξαμενή νερού για υποβρύχιο έλεγχο διαρροών σε φουσκωμένους θαλάμους. Οπτική ανίχνευση φυσαλίδων για επαλήθευση της ακεραιότητας ραφής και βαλβίδας.
      icon: tabler:ripple
    - title: Εργαλεία Επιθεώρησης
      description: Εργαλεία μέτρησης βαθμονομημένα — μετρητές πάχους, κλειδιά ροπής, διαστάσιμοι κλήμακες, δοκιμαστές σκληρότητας για σταθμούς ποιοτικού ελέγχου παραγωγής.
      icon: tabler:tools
content_metrics:
  tagline: Απόδοση QC
  title: Δείκτες Ποιοτικού Ελέγχου
  subtitle: Πραγματικά δεδομένα επιτυχίας/αποτυχίας από τη γραμμή παραγωγής μας. Αυτές οι μετρήσεις παρακολουθούνται καθημερινά και επανεξετάζονται μηνιαίως από τη διοίκηση.
  columns: 3
  items:
    - title: 100% Μονάδες Δοκιμασμένες
      description: Κάθε θάλαμος κάθε σκάφους δοκιμάζεται υπό πίεση πριν από την αποστολή. Καμία δειγματοληψία — 100% έλεγχος στην ακεραιότητα της πίεσης.
      icon: tabler:check
    - title: <Πτώση Πίεσης 5%
      description: Μέγιστη επιτρεπόμενη απώλεια πίεσης σε 24-48 ώρες σε 1,25× της ονομαστικής πίεσης. Οποιοδήποτε θάλαμο υπερβαίνει αυτό το όριο ενεργοποιεί επανέλεγχο παρτίδας.
      icon: tabler:gauge
    - title: AQL 2,5
      description: Αποδεκτό Επίπεδο Ποιότητας για σημαντικά ελαττώματα σύμφωνα με το πρότυπο δειγματοληψίας ISO 2859. Μηδενική ανοχή για ελαττώματα κρίσιμα για την ασφάλεια.
      icon: tabler:clipboard-check
    - title: Κράτηση 24-48 Ωρών
      description: 'Η διάρκεια διατήρησης της πίεσης διαφέρει ανά κατηγορία προϊόντος. RIB θάλαμοι: 48 ώρες. SUP και φουσκωτές βάρκες: 24-48 ώρες.'
      icon: tabler:clock
    - title: 1,25× Δοκιμαστική Πίεση
      description: Περιθώριο ασφαλείας σε κάθε θάλαμο — δοκιμάζεται στο 25% πάνω από την ονομαστική πίεση για να διασφαλιστεί το περιθώριο πάνω από τις μέγιστες συνθήκες λειτουργίας.
      icon: tabler:arrow-up
    - title: 0% Ελαττώματα Ασφαλείας
      description: Πολιτική μηδενικής ανοχής σε ελαττώματα κρίσιμη για την ασφάλεια — βαλβίδες, D-δακτύλιοι, ραφές και θάλαμοι πλευστότητας. Οποιοδήποτε ελάττωμα = 100% επανέλεγχος.
      icon: tabler:shield
cta:
  title: Ζητήστε τεκμηρίωση ποιότητας
  subtitle: Παρέχουμε πλήρη πακέτα τεκμηρίωσης ποιότητας, συμπεριλαμβανομένων εκθέσεων δοκιμών, πιστοποιήσεων υλικών και δηλώσεων συμμόρφωσης με κάθε αποστολή. Επικοινωνήστε μαζί μας για δείγματα.
  actions:
    - variant: primary
      text: Ζητήστε τεκμηρίωση QC
      href: /contact
    - text: Προβολή πρωτοκόλλων δοκιμών
      href: /quality
