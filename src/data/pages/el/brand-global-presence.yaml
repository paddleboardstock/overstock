hero:
  tagline: Παγκόσμια παρουσία
  title: 'Παρέχουμε υπηρεσίες σε 50+ χώρες<br />σε όλες τις ηπείρους'
  subtitle: 'Από ευρωπαίους χειριστές παράκτιων περιπόλων έως Αυστραλούς διανομείς θαλάσσιων σπορ και ομάδες διάσωσης της Μέσης Ανατολής — οι βάρκες Paddle Board Overstock πλέουν στα νερά όλου του κόσμου.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Παγκόσμια ναυτική παραγωγή και διανομή της Paddle Board Overstock
stats:
  title: Παγκόσμια εμβέλεια
  stats:
    - title: Χώρες
      amount: '50+'
    - title: Εξαγωγικές αγορές
      amount: Ευρώπη, Αμερική, Ασία, Μέση Ανατολή, Ωκεανία
    - title: Παραγωγή
      amount: Qingdao, China
    - title: Αποθήκη στις ΗΠΑ
      amount: Montclair, CA
features3_markets:
  tagline: Βασικές αγορές
  title: 'Περιφερειακή εξειδίκευση<br />για τοπικές απαιτήσεις'
  subtitle: 'Κατανοούμε ότι οι διαφορετικές αγορές έχουν διαφορετικές ρυθμιστικές απαιτήσεις, προτιμήσεις και περιπτώσεις χρήσης.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Ευρώπη και Ηνωμένο Βασίλειο
      description: 'Προϊόντα με πιστοποίηση CE σύμφωνα με τα πρότυπα EN ISO 6185. Ισχυρή ζήτηση για σκάφη RIB, φουσκωτές βάρκες και σανίδες SUP στις αγορές της ΕΕ. Οι Βρετανοί διανομείς εκτιμούν τη γρήγορη εξυπηρέτησή μας.'
      icon: tabler:map-pin
    - title: Βόρεια Αμερική
      description: 'Παραγωγή εγκεκριμένη από το US Coast Guard. Αποθήκη στις ΗΠΑ στο Μοντκλαιρ της Καλιφόρνια για γρήγορη παράδοση στη Δυτική Ακτή. Αυξανόμενη ζήτηση για ψαρόβαρκες, σκάφη διάσωσης και ψυχαγωγικά SUP.'
      icon: tabler:map-pin
    - title: Αυστραλία και Ωκεανία
      description: 'Ισχυρή αγορά για σκάφη RIB και φουσκωτά tenders. Οι Αυστραλοί διανομείς εκτιμούν τις βάρκες Hypalon για την αντοχή τους στην UV κάτω από έντονο ήλιο. Γρήγορη αποστολή από την μονάδα μας στην Ασία.'
      icon: tabler:map-pin
    - title: Μέση Ανατολή
      description: 'Αυξανόμενη ζήτηση για περιπολικά και σκάφη διάσωσης. Τα RIB μας με αλουμινένιο κύτος είναι δημοφιλή σε χειριστές ακτοφυλακής και ασφάλειας. Προσαρμοσμένες διαμορφώσεις για περιβάλλοντα υψηλών θερμοκρασιών.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Δίκτυο διανομής
  title: 'Συνεργασίες με διανομείς<br />σε όλο τον κόσμο'
  subtitle: 'Συνεργαζόμαστε με καθιερωμένους διανομείς ναυτικού εξοπλισμού, μάρκες OEM και κυβερνητικούς φορείς προμηθειών.'
  isBeforeContent: false
  columns: 3
  items:
    - title: Συνεργασίες OEM/ODM
      description: 'Κατασκευή ιδιωτικής ετικέτας (private label) για παγκόσμιες μάρκες θαλάσσιων σπορ. Αναλαμβάνουμε τα πάντα, από τον σχεδιασμό έως την παραγωγή και το drop-shipping.'
      icon: tabler:building
    - title: Δίκτυο διανομέων
      description: 'Εγκεκριμένοι διανομείς σε πάνω από 20 χώρες διατηρούν αποθέματα και παρέχουν τοπική υποστήριξη. Υποδεχόμαστε ερωτήματα από νέους διανομείς.'
      icon: tabler:users
    - title: Κυβέρνηση και θεσμικοί οργανισμοί
      description: 'Απευθείας προμήθεια σε ακτοφυλακές, οργανισμούς έρευνας και διάσωσης και στρατιωτικά προγράμματα προμηθειών. Συμμόρφωση με τις απαιτήσεις θεσμικών προμηθειών.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Παγκόσμια εφοδιαστική και υποστήριξη'
  subtitle: 'Από το εργοστάσιο στον προορισμό — διαχειριζόμαστε ολόκληρη την εφοδιαστική αλυσίδα.'
  items:
    - title: Επιλογές αποστολής
      description: 'Θαλάσσιες μεταφορές (FOB Qingdao), αερομεταφορές για επείγουσες παραγγελίες και ταχυμεταφορές για δείγματα και ανταλλακτικά.'
      icon: tabler:truck-delivery
    - title: Αποθήκη στις ΗΠΑ
      description: 'Αποθέματα στο Μοντκλαιρ της Καλιφόρνια για γρήγορη παράδοση σε όλη τη Βόρεια Αμερική. Δυτική Ακτή: 2-3 ημέρες, Κέντρο: 3-4 ημέρες, Ανατολική Ακτή: 4-5 ημέρες.'
      icon: tabler:building-warehouse
    - title: Ανταλλακτικά
      description: 'Γνήσια ανταλλακτικά και αναλώσιμα Paddle Board Overstock σε απόθεμα όλο τον χρόνο. Τα συνήθη ανταλλακτικά αποστέλλονται εντός 24 ωρών.'
      icon: tabler:package
    - title: Τεχνική υποστήριξη
      description: 'Απευθείας γραμμή με την ομάδα μηχανικών μας για τεχνικά ερωτήματα, συμβουλές επισκευής και υποστήριξη ανακατασκευής. Υποστηρίζουμε βάρκες που κατασκευάσαμε πριν από 20 χρόνια.'
      icon: tabler:headset
cta:
  title: 'Θέλετε να γίνετε διανομέας;'
  subtitle: 'Επεκτείνουμε ενεργά το δίκτυο διανομής μας. Επικοινωνήστε με την ομάδα εξαγωγών μας για να συζητήσετε ευκαιρίες συνεργασίας.'
  actions:
    - variant: primary
      text: Ερώτημα συνεργασίας
      href: /contact
    - text: Δείτε τη γκάμα προϊόντων μας
      href: /products
