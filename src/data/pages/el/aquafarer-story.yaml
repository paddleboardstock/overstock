hero:
  tagline: Η ιστορία μας
  title: Aquafarer — Μηχανική Ελευθερία στο νερό
  subtitle: 'Από ένα παράκτιο εργαστήριο σε έναν παγκόσμιο ναυτιλιακό κατασκευαστή — το ταξίδι μας βασίζεται σε μια πεισματική πεποίθηση: τα σκάφη πρέπει να κατασκευάζονται όπως έχουν σημασία, επειδή έχουν.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Εργοστάσιο και ναυτική μονάδα παραγωγής της Aquafarer στο Qingdao
