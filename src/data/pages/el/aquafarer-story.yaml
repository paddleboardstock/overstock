timeline:
  - year: '2012'
    title: Θεμέλιο θαλάσσιας κατασκευής
    body: Το Aquafarer ξεκίνησε ως ένα εξειδικευμένο εργαστήριο φουσκωτών σκαφών στην Qingdao της Κίνας, αφοσιωμένο στη θαλάσσια χειροτεχνία και την κατασκευή φουσκωτών σκαφών. Η αρχική εστίαση ήταν η κατασκευή αξιόπιστων φουσκωτών προϊόντων μέσω πρακτικής εμπειρίας μηχανικής και πειθαρχίας στην κατασκευή.
  - year: '2015'
    title: Πρώτη Εξαγωγή & Πιστοποίηση CE
    body: Οι αρχικές παραγγελίες εξαγωγής έφτασαν στην Ιαπωνία και την Κορέα. Η πιστοποίηση CE επιτεύχθηκε για τις βασικές σειρές προϊόντων, σηματοδοτώντας την είσοδο του Aquafarer στις διεθνείς αγορές. Η εταιρεία άρχισε να εξυπηρετεί εμπορικούς και ψυχαγωγικούς χρήστες πέρα ​​από την Κίνα.
  - year: '2018'
    title: Επέκταση εργοστασίου
    body: Μεταφέρθηκε σε μονάδα παραγωγής 12.000 m². Προστέθηκαν γραμμές συγκόλλησης ραδιοσυχνοτήτων και ικανότητα παραγωγής σταγόνας βελονιάς, επιτρέποντας μεγαλύτερης κλίμακας παραγωγή και βελτιωμένα συστήματα ποιοτικού ελέγχου.
  - year: '2020'
    title: Ιδρύθηκε Κέντρο Ε&Α
    body: Άνοιξε ένα αποκλειστικό κέντρο Ε&Α με PVC εργαστήριο υφασμάτων, υδροδυναμική δεξαμενή δοκιμών και στούντιο προσομοίωσης CAD/FEA. Η ανάπτυξη προϊόντων επεκτάθηκε για να επικεντρωθεί στην ελαφριά κατασκευή, τη βελτιωμένη ανθεκτικότητα και τη σχεδίαση με επίκεντρο τον χρήστη.
  - year: '2022'
    title: Πιστοποίηση & Παγκόσμια Ανάπτυξη
    body: Πέτυχε πιστοποίηση ISO 9001. Επεκτάθηκε σε 14 μηχανικούς Ε&Α και 200+ εργαζόμενους. Τα προϊόντα έφτασαν σε πελάτες σε όλη την Ευρώπη, την Αμερική και την Ασία-Ειρηνικό μέσω συνεργασιών διανομέων και OEM.
  - year: '2024'
    title: Στούντιο Καινοτομίας & Σχεδιασμού
    body: Κυκλοφόρησε στούντιο σχεδίασης και καινοτομίας πλήρους εξυπηρέτησης για προσαρμοσμένα έργα ODM, από την ιδέα μέχρι την παραγωγή. Ενισχυμένες επαγγελματικές θαλάσσιες εφαρμογές, συμπεριλαμβανομένων διασώσεων, εμπορικών και κρατικών διαγωνισμών.
  - year: '2026'
    title: Χτίζοντας το μέλλον της εξερεύνησης του νερού
    body: Σήμερα, η Aquafarer συνεχίζει να αναπτύσσει φουσκωτά σκάφη, συστήματα SUP και προσαρμοσμένες θαλάσσιες λύσεις — συνδέοντας ανθρώπους και οργανισμούς με τα νερά του κόσμου. Εξυπηρετούνται 50+ χώρες, 15.000 μονάδες ετήσια χωρητικότητα.
content_founding:
  tagline: Η Αρχή
  title: Γεννημένος στην προκυμαία
  subtitle: 'Το Aquafarer ξεκίνησε σε ένα παράκτιο εργαστήριο το Qingdao με ένα σκάφος και ένα όραμα: να κατασκευάσει φουσκωτά σκάφη που θα μπορούσαν να χειριστούν πραγματικές θαλάσσιες συνθήκες.'
  paragraphs:
    - Το 2012, οι ιδρυτές μας είδαν ένα κενό στην αγορά — τα περισσότερα φουσκωτά σκάφη ήταν είτε προσιτά αλλά αναξιόπιστα, είτε υψηλής ποιότητας αλλά απαγορευτικά ακριβά. Πίστευαν ότι υπήρχε χώρος για έναν κατασκευαστή που παρείχε και ποιότητα και αξία.
    - Η πρώτη γάστρα κατασκευάστηκε με το χέρι, δοκιμάστηκε σε τοπικά ύδατα και βελτιώθηκε με βάση την πραγματική ανατροφοδότηση από ψαράδες και μικρούς εμπορικούς φορείς. Αυτός ο βρόχος ανατροφοδότησης — κατασκευή, δοκιμή, ακρόαση, βελτίωση — παραμένει σήμερα στον πυρήνα της φιλοσοφίας της μηχανικής μας.
    - Μέχρι το 2015, η είδηση ​​είχε ξεπεράσει τις Qingdao. Οι διεθνείς διανομείς άρχισαν να ζητούν δείγματα. Αυτό που ξεκίνησε ως τοπικό εργαστήριο έγινε παγκόσμιος προμηθευτής.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Πρώιμο παραγωγικό εργαστήριο και παραγωγή της Aquafarer
content_growth:
  tagline: Ανάπτυξη & Καινοτομία
  title: Από Συνεργείο έως Εγκατάσταση 12.000 m²
  subtitle: Η συνεχής επένδυση σε ανθρώπους, εξοπλισμό και διεργασίες έχει μεταμορφώσει το Aquafarer σε μια σύγχρονη ναυτιλιακή μονάδα παραγωγής.
  paragraphs:
    - Καθώς αυξανόταν η ζήτηση, τόσο αυξανόταν και οι εγκαταστάσεις μας. Επεκταθήκαμε από ένα μικρό εργαστήριο σε ένα εργοστάσιο 12.000 m² με αποκλειστικές γραμμές παραγωγής για RIB σκάφη, φουσκωτά σκάφη, SUP σανίδες και αξεσουάρ.
    - Επενδύσαμε σε μηχανές κοπής CNC, εξοπλισμό συγκόλλησης υψηλής συχνότητας, γραμμές παραγωγής drop stitch και ολοκληρωμένες εγκαταστάσεις δοκιμών — επιτρέποντάς μας να ελέγχουμε κάθε πτυχή της ποιότητας παραγωγής.
    - Σήμερα, η ομάδα μας των 200-300 περιλαμβάνει ναυτικούς μηχανικούς, επιστήμονες υλικών, ειδικούς στον ποιοτικό έλεγχο και ειδικευμένους τεχνίτες — πολλοί από τους οποίους ήταν με το Aquafarer από τις πρώτες μέρες.
founder:
  tagline: Γνωρίστε τον ιδρυτή
  title: Κατασκευάστηκε από έναν Waterman
  subtitle: Ο ιδρυτής David Chen συνδυάζει την τεχνογνωσία στην κατασκευή και το πάθος της ζωής για τα θαλάσσια σπορ — ένας συνδυασμός που καθορίζει τον τρόπο με τον οποίο το Aquafarer προσεγγίζει την ανάπτυξη προϊόντων.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — ιδρυτής της Aquafarer
  story:
    - Ο David Chen μεγάλωσε στην ακτή του Qingdao, όπου η θάλασσα δεν ήταν προορισμός διακοπών αλλά τρόπος ζωής. Πέρασε τα νιάτα του κάνοντας καγιάκ, ιστιοπλοΐα και ψάρεμα στην Κίτρινη Θάλασσα - εμπειρίες που του έδωσαν μια διαισθητική κατανόηση του τι χρειάζονται τα σκάφη για να αντέξουν.
    - Πριν ιδρύσει το Aquafarer, ο David πέρασε μια δεκαετία στη ναυτιλιακή βιομηχανία, εργαζόμενος σε επίπεδο παραγωγής, ποιότητας και διεθνούς εμπορίου. Διαχειρίστηκε OEM προγράμματα για ευρωπαϊκές και βορειοαμερικανικές μάρκες, μαθαίνοντας από πρώτο χέρι τα πρότυπα και τις προσδοκίες των παγκόσμιων αγορών.
    - 'Το 2012, ίδρυσε το Aquafarer με μια απλή αποστολή: να κατασκευάσει φουσκωτά σκάφη που θα εμπιστευόταν με τη δική του οικογένεια στο νερό. Αυτό το προσωπικό πρότυπο — θα το χρησιμοποιούσα; — παραμένει η τελική δοκιμή για κάθε προϊόν που φεύγει από το εργοστάσιο.'
    - Σήμερα, ο David ηγείται της στρατηγικής προϊόντων και επιβλέπει την ομάδα Έρευνας και Ανάπτυξης, εξετάζοντας προσωπικά νέα σχέδια και δοκιμάζοντας πρωτότυπα στα ανοιχτά Qingdao. Πιστεύει ότι τα εξαιρετικά προϊόντα προέρχονται από την κατανόηση τόσο της μηχανικής όσο και της εμπειρίας.
philosophy:
  tagline: Φιλοσοφία Μάρκας
  title: Μηχανική Ελευθερία στο νερό
  body: Η ελευθερία στο νερό δεν αφορά μόνο την κίνηση. Αντιπροσωπεύει την ανακάλυψη νέων τόπων, τη δημιουργία υπαίθριων εμπειριών, τη σύνδεση των ανθρώπων με τη φύση και τη διευκόλυνση επαγγελματικών αποστολών. Η μηχανική καθιστά δυνατή αυτή την ελευθερία.
  pillars:
    - title: Πρώτα η αξιοπιστία
      body: Τα υδάτινα περιβάλλοντα απαιτούν εμπιστοσύνη. Τα προϊόντα Aquafarer έχουν σχεδιαστεί με γνώμονα τη σταθερότητα, την ανθεκτικότητα, την ασφάλεια και τη σταθερή απόδοση.
    - title: Ανθρωποκεντρικός σχεδιασμός
      body: Τα προϊόντα πρέπει να εξυπηρετούν τους ανθρώπους και όχι την τεχνολογία. Κάθε σχεδιαστική απόφαση ξεκινά με την κατανόηση του τρόπου με τον οποίο οι άνθρωποι χρησιμοποιούν τα σκάφη, πού εξερευνούν και ποιες προκλήσεις αντιμετωπίζουν.
    - title: Προσβάσιμη Εξερεύνηση
      body: Το νερό δεν πρέπει να ανήκει μόνο σε ειδικούς. Το Aquafarer δημιουργεί εξοπλισμό που επιτρέπει σε περισσότερους ανθρώπους να βιώνουν με ασφάλεια ποτάμια, λίμνες, ωκεανούς και παράκτια περιβάλλοντα.
    - title: Συνεχής Καινοτομία
      body: Καινοτομία δεν είναι μόνο η δημιουργία νέων προϊόντων. Βελτιώνει κάθε λεπτομέρεια — υλικά, δομές, κατασκευή και εμπειρία χρήστη.
engineeringDna:
  tagline: Μηχανικό DNA
  title: Πώς Aquafarer δημιουργεί προϊόντα
  areas:
    - title: Επιστήμη των Υλικών
      body: Το Aquafarer επικεντρώνεται στην επιλογή κατάλληλων υλικών για διαφορετικά θαλάσσια περιβάλλοντα. Τα βασικά ζητήματα περιλαμβάνουν την αντοχή στην τριβή, την αντοχή στην υπεριώδη ακτινοβολία, τη σταθερότητα στην πίεση και τη μακροπρόθεσμη αντοχή.
      items:
        - Αντοχή στην τριβή
        - Αντοχή στην υπεριώδη ακτινοβολία
        - Σταθερότητα Πίεσης
        - Μακροχρόνια Ανθεκτικότητα
    - title: Δομική Μηχανική
      body: Τα φουσκωτά σκάφη απαιτούν ακριβή ισορροπία μεταξύ ακαμψίας, βάρους, φορητότητας και σταθερότητας. Η μηχανική Aquafarer επικεντρώνεται στη βελτιστοποίηση αυτών των παραγόντων μέσω της τεχνολογίας πυρήνων σταγόνας βελονιάς και της προηγμένης κατασκευής ραφών.
      items:
        - Ακαμψία
        - Βελτιστοποίηση βάρους
        - Φορητότητα
        - Σταθερότητα
    - title: Ακρίβεια κατασκευής
      body: 'Κάθε προϊόν περνά από ελεγχόμενες διαδικασίες: προετοιμασία υλικού, κοπή ακριβείας, συγκόλληση και συγκόλληση, συναρμολόγηση, έλεγχος ποιότητας και επαλήθευση απόδοσης.'
      items:
        - Προετοιμασία υλικού
        - Κοπή Ακριβείας
        - Συγκόλληση & Συγκόλληση
        - Συναρμολόγηση & QC
    - title: Μηχανική Σεναρίων Χρήστη
      body: Τα προϊόντα αναπτύσσονται γύρω από πραγματικές εφαρμογές — αναψυχή, περιπέτεια και επαγγελματική χρήση — διασφαλίζοντας ότι κάθε σχέδιο ανταποκρίνεται στις συγκεκριμένες απαιτήσεις του προβλεπόμενου περιβάλλοντος.
      items:
        - Αναψυχή
        - Περιπέτεια
        - Επαγγελματική χρήση
        - Εμπορικός
trustSignals:
  tagline: Σήματα εμπιστοσύνης
  title: Γιατί το Aquafarer είναι αξιόπιστος συνεργάτης
  manufacturing:
    title: Κατασκευαστική ικανότητα
    body: Εγκατάσταση παραγωγής 12.000 m² με 200-300 ειδικευμένους εργάτες και 14+ μηχανικούς Ε&Α. ISO 9001 πιστοποιημένο σύστημα διαχείρισης ποιότητας. Ετήσια παραγωγή 15.000 μονάδων φουσκωτών σκαφών που εξυπηρετούν 50+ χώρες.
    stats:
      - label: Μέγεθος Εγκαταστάσεων
        value: 12.000 m²
      - label: Εργατικό δυναμικό
        value: 200-300
      - label: Μηχανικοί Ε&Α
        value: 14+
      - label: Ετήσια χωρητικότητα
        value: "15.000"
  quality:
    title: Δέσμευση για την ποιότητα
    body: Από την επιθεώρηση υλικού έως την τελική δοκιμή, η Aquafarer διατηρεί συστηματικές διαδικασίες ποιότητας για την παροχή αξιόπιστων θαλάσσιων προϊόντων. Κάθε μονάδα υποβάλλεται σε δοκιμή πίεσης, επιθεώρηση ραφής και επαλήθευση απόδοσης πριν από την αποστολή.
    items:
      - CE Πιστοποιημένο — Όλα τα προϊόντα πληρούν τα ευρωπαϊκά πρότυπα ασφαλείας
      - ISO 9001:2015 — Πιστοποιημένο σύστημα διαχείρισης ποιότητας
      - UKCA Επισημασμένο — Συμμόρφωση στην αγορά του Ηνωμένου Βασιλείου
  global:
    title: Παγκόσμια Παρουσία
    body: Το Aquafarer εξυπηρετεί πελάτες σε πολλές παγκόσμιες αγορές, υποστηρίζοντας διανομείς, επωνυμίες εξωτερικού χώρου και επαγγελματίες ναυτικούς χρήστες σε 50+ χώρες σε Ευρώπη, Ασία-Ειρηνικό, Αμερική, Μέση Ανατολή και Αφρική.
comparison:
  tagline: Τοποθέτηση επωνυμίας
  title: Aquafarer στην Αγορά
  position: Κατασκευαστής θαλάσσιων σκαφών με επίκεντρο τη μηχανική που συνδυάζει την τεχνογνωσία στα φουσκωτά σκάφη με την πλήρη ικανότητα OEM/ODM, προσαρμοσμένες λύσεις και βαθιά εμπειρία κατασκευής.
  strengths:
    - Εξειδίκευση στη μηχανική φουσκωτών σκαφών
    - Πλήρης ικανότητα κατασκευής OEM/ODM
    - Ανάπτυξη και σχεδιασμός προσαρμοσμένων προϊόντων
    - 12.000 m² ISO 9001 πιστοποιημένη εγκατάσταση παραγωγής
  bestFor:
    - Χρήστες υπαίθριας αναψυχής που αναζητούν αξιόπιστα φουσκωτά σκάφη
    - Ναυτιλιακές εταιρείες που απαιτούν εξοπλισμό εμπορικής ποιότητας
    - Οι συνεργάτες της επωνυμίας χρειάζονται OEM/ODM παραγωγή
    - Επαγγελματικές οργανώσεις διάσωσης και περιπολίας
