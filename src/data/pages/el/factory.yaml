testing_section:
  tagline: Έλεγχος Ποιότητας
  title: Διαδικασία Δοκιμών & Διασφάλισης Ποιότητας
  description: Κάθε σκάφος υποβάλλεται σε υποχρεωτικές δοκιμές πριν από την αποστολή. Το εργαστήριο ποιότητάς μας λειτουργεί ανεξάρτητα από την παραγωγή και αναφέρεται απευθείας στη διοίκηση.
  steps:
    - title: Έλεγχος Πρώτων Υλών
      desc: Τα υφάσματα PVC, Hypalon και drop-stitch υποβάλλονται σε δοκιμές εφελκυσμού, διάδοσης σχισίματος και επαλήθευσης αντοχής στην UV πριν οποιαδήποτε παρτίδα εισέλθει στην παραγωγή.
    - title: Δοκιμή Διατήρησης Αέρα 48 Ωρών
      desc: Κάθε θάλαμος του σωλήνα φουσκώνει στο 125 % της ονομαστικής πίεσης και διατηρείται για 48 ώρες. Πτώση πίεσης άνω του 5 % προκαλεί αυτόματη απόρριψη και επανέλεγχο των ραφών.
    - title: Δοκιμές Φορτίου & Ισορροπίας
      desc: Τα ολοκληρωμένα σκάφη φορτώνονται στη μέγιστη ονομαστική χωρητικότητα και δοκιμάζονται σε ευστάθεια, ελεύθερο ύψος και χειρισμό. Κάθε σκάφος δοκιμάζεται στο νερό πριν από την τελική επιθεώρηση.
case_studies:
  tagline: Έργα OEM
  title: Μελέτες Περίπτωσης Συνεργασιών Brands & OEM
  description: Από την ιδέα στο κοντέινερ — πώς βοηθάμε παγκόσμιες μάρκες να ξεκινήσουν και να κλιμακώσουν τις σειρές φουσκωτών σκαφών τους.
  labels:
    challenge: Πρόκληση
    solution: Λύση
    result: Αποτέλεσμα
  cards:
    - challenge: Ένας ευρωπαίος λιανοπωλητής εξοπλισμού outdoor χρειαζόταν μια σειρά SUP ιδιωτικής ετικέτας με μοναδικά γραφικά καταστρώματος, φιλικό προς το περιβάλλον PVC και έτοιμη για λιανική πώληση συσκευασία — όλα παραδομένα σε 60 ημέρες.
      solution: Αναπτύξαμε προσαρμοσμένα αρχεία ψηφιακής εκτύπωσης, προμηθευτήκαμε PVC συμβατό με το REACH και μειώσαμε τη δειγματοληψία από 3 σε 1 γύρο τοποθετώντας την ομάδα σχεδιασμού στο εργοστάσιό μας στο Qingdao.
      result: 55 ημέρες από την υπογεγραμμένη παραγγελία έως το FOB. 2.400 μονάδες σε 4 SKU. Επανάληψη παραγγελίας πριν φτάσει το πρώτο κοντέινερ.
    - challenge: Αμερικανική εταιρεία θαλάσσιων σπορ ξεκίνησε να δραστηριοποιείται χρειαζόμενη ένα kayak drop-stitch υψηλών επιδόσεων με προσαρμοσμένο σχήμα γάστρας, συσκευασία co-brand και πιστοποίηση BSCI για διάθεση σε λιανική.
      solution: Τροποποιήσαμε το υπάρχον καλούπι kayak drop-stitch με αλλαγμένο προφίλ rocker, αναπτύξαμε το σχέδιο συσκευασίας co-brand και παρείχαμε πλήρη τεκμηρίωση ελέγχου BSCI.
      result: Επιτυχής καταχώριση σε 3 μεγάλες αμερικανικές αλυσίδες outdoor. 5.000+ μονάδες τον πρώτο χρόνο με ποσοστό πωλήσεων 98 %.
    - challenge: Ένας αυστραλός διανομέας απαιτούσε σειρά RIB με πιστοποίηση CE, προσαρμοσμένα χρώματα σωλήνων, επιλογή αναβάθμισης σε Hypalon και συμμόρφωση με το αυστραλιανό πρότυπο AS 1799.
      solution: Παράγαμε δείγματα προπαραγωγής με 4 παραλλαγές χρώματος σωλήνων, προμηθευτήκαμε CSM Hypalon από Ιάπωνα προμηθευτή και συντονίσαμε δοκιμές συμμόρφωσης AS 1799 από τρίτους.
      result: Σειρά 3 μοντέλων RIB κυκλοφόρησε στην αγορά AU/NZ. Ακολούθησε κέρδος κρατικού διαγωνισμού για 12 περιπολικά RIB.
production_flow:
  tagline: Ροή παραγωγής
  title: Από το υλικό στο τελικό σκάφος
  subtitle: Κάθε σκάφος περνά από 6 στάδια παραγωγής με σημεία ελέγχου QC σε κάθε βήμα. Χωρίς συντομεύσεις, χωρίς επιθεωρήσεις που παραλείφθηκαν.
  stages:
    - stage: '01'
      title: Λήψη υλικού & Εισερχόμενο QC
      description: Όλα τα εισερχόμενα υλικά καταγράφονται με αριθμό παρτίδας/παρτίδας στο σύστημα ERP μας. PVC ρολά υφάσματος, πυρήνες βελονιάς, βαλβίδες, κόλλες και υλικό τίθενται σε καραντίνα μέχρι την υπογραφή QC.
      qc_check: Αντοχή σε εφελκυσμό (ASTM D751), αντοχή σε σχίσιμο (ISO 4674), μετρητής πάχους, ιξώδες κόλλας, σάρωση οπτικών ελαττωμάτων
      qc_threshold: 100% των παρτίδων που δοκιμάστηκαν. Απορρίψτε εάν υπάρχει εφελκυσμός < 90% των προδιαγραφών, σχίσιμο < προδιαγραφών ελάχ. ή οποιοδήποτε οπτικό ελάττωμα
      responsibility: Εισερχόμενη ομάδα QC (3 επιθεωρητές)
    - stage: '02'
      title: CNC Κοπή & Προετοιμασία Υλικού
      description: Η βελτιστοποιημένη ένθεση για υπολογιστή απλώνει πάνελ σε PVC απόθεμα για να ελαχιστοποιήσει τα απόβλητα. Οι αυτόματες μηχανές κοπής CNC διατηρούν ακρίβεια θέσης 0,1 mm.
      qc_check: Έλεγχος διαστάσεων σε αρχεία CAD DXF, επιθεώρηση ποιότητας άκρων, επαλήθευση πλήθους πίνακα
      qc_threshold: Κάθε 20ο πάνελ μετράται. Ανοχή ±0,5 mm. Απορρίψτε την παρτίδα εάν είναι >2% εκτός ανοχής
      responsibility: Μόλυβδος εργαστηρίου κοπής
    - stage: '03'
      title: Συγκόλληση & Συγκόλληση σταγονοβελονιάς
      description: Οι πυρήνες σταγόνας βελονιάς συνδέονται με εξωτερικά ελάσματα PVC χρησιμοποιώντας πλαστικοποίηση θερμότητας. Οι θάλαμοι σωλήνων είναι συγκολλημένοι με RF ή με θερμό αέρα. Οι λωρίδες σιδηροτροχιών συνδέονται με τήξη τριπλής στρώσης.
      qc_check: Δοκιμή αποφλοίωσης κάθε 50 μονάδες (ASTM D751), μέτρηση πλάτους συγκόλλησης, ανασκόπηση του αρχείου καταγραφής θερμοκρασίας ζεστού αέρα, οπτική επιθεώρηση ραφής υπό οπίσθιο φωτισμό
      qc_threshold: Δύναμη απολέπισης min 8 N/cm. Ανοχή πλάτους συγκόλλησης ±1 mm. Οποιαδήποτε ορατή διοχέτευση = απόρριψη
      responsibility: QC συγκόλλησης (2 επιθεωρητές ανά βάρδια)
    - stage: '04'
      title: Συναρμολόγηση & εξοπλισμός
      description: 'Τα σκάφη μετακινούνται στην τελική συναρμολόγηση όπου όλα τα εξαρτήματα συνδυάζονται: γάστρα + σωλήνες, εγκατεστημένες βαλβίδες, δακτύλιοι D, λαβές, κουτιά πτερυγίων και τοποθέτηση τσάντας μεταφοράς. Κάθε μονάδα ακολουθεί μια λίστα ελέγχου συναρμολόγησης 100 σημείων.'
      qc_check: Σημείωση λίστας ελέγχου 100 σημείων ανά μονάδα, δοκιμή λειτουργίας βαλβίδας (10 κύκλοι ανοίγματος/κλεισίματος), επαλήθευση ροπής υλικού, οπτική επιθεώρηση
      qc_threshold: 'Πολιτική μηδενικών ελαττωμάτων σε κρίσιμα για την ασφάλεια είδη (βαλβίδες, δακτύλιοι D, λαβές). Μικρά καλλυντικά: AQL 2,5 (ISO 2859)'
      responsibility: Μολύβδου ομάδας συναρμολόγησης + γραμμή QC
    - stage: '05'
      title: Δοκιμή πίεσης & Διατήρηση Ποιότητας
      description: Κάθε θάλαμος φουσκώνεται σε 1,25× ονομαστική πίεση (συνήθως 20–25 PSI) και διατηρείται για 24–48 ώρες. Οι αισθητήρες πίεσης καταγράφονται συνεχώς. Οι θάλαμοι που υπερβαίνουν το 5% πτώση πίεσης απορρίπτονται και αποστέλλονται για επανέλεγχο της ραφής.
      qc_check: 24ωρο αρχείο καταγραφής διατήρησης πίεσης, βαθμονόμηση αισθητήρα που επαληθεύεται καθημερινά, ένδειξη πίεσης με αντιστάθμιση θερμοκρασίας, επανέλεγχος ραφής μετά την επισκευή
      qc_threshold: Μέγιστη πτώση πίεσης 5% για 24 ώρες σε σταθερή θερμοκρασία. Οποιοσδήποτε θάλαμος υπερβαίνει αυτό = 100% επανέλεγχος ολόκληρης της παρτίδας παραγωγής
      responsibility: Εργαστήριο ποιότητας (ανεξάρτητο από την παραγωγή, αναφορές στη διοίκηση)
    - stage: '06'
      title: Τελική Επιθεώρηση & Συσκευασία
      description: Τελικός οπτικός και λειτουργικός έλεγχος. Ελαττώματα επιφάνειας, συνέπεια χρώματος, επαλήθευση ετικέτας/BIN, ακεραιότητα συσκευασίας και πληρότητα αξεσουάρ. Οι μονάδες συσκευάζονται σε κενό, συσκευάζονται σε κουτί και παλετοποιούνται για φόρτωση εμπορευματοκιβωτίων.
      qc_check: Πλήρης οπτική επιθεώρηση, λίστα ελέγχου αξεσουάρ ανά SKU, δοκιμή πτώσης συσκευασίας (1 m, τυχαίο δείγμα), επαλήθευση σάρωσης ετικέτας/γραμμικού κώδικα
      qc_threshold: AQL 2,5 για μεγάλα ελαττώματα, AQL 4,0 για δευτερεύοντα. Μηδενική ανοχή σε ελαττώματα ασφαλείας. Το 100% των μονάδων ελέγχεται οπτικά
      responsibility: Ομάδα τελικού QC (4 επιθεωρητές) + επικεφαλής ομάδας συσκευασίας
workforce:
  tagline: Οι δικοί μας άνθρωποι
  title: Εργατικό Δυναμικό & Εξειδίκευση
  engineers: 25+
  engineers_detail: Μηχανικοί σε Ε&Α, σχεδιασμό καλουπιών, εργαστήριο υλικών και μηχανική παραγωγής. Μέσος όρος 7+ ετών στην κατασκευή φουσκωτών.
  shift_pattern: 2 βάρδιες/ημέρα (07:00–15:30, 15:30–00:00). Προαιρετική νυχτερινή βάρδια για επείγουσες παραγγελίες.
  training: Μηνιαία εκπαίδευση QC, τριμηνιαίες ασκήσεις ασφαλείας, ετήσια αξιολόγηση δεξιοτήτων. Οι νέες προσλήψεις ολοκληρώνουν την εισαγωγή 40 ωρών πριν εργαστούν στη γραμμή παραγωγής.
  departments:
    - name: Ε&Α & μηχανική
      count: 25+
      role: Σχεδιασμός προϊόντων, μηχανική καλουπιών, εργαστήριο υλικών
