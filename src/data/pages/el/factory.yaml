hero:
  tagline: Εργοστάσιο
  title: Εργοστάσιο & Κατασκευή
  subtitle: 12.000 m2 ολοκληρωμένης κατασκευής — από πρώτη ύλη σε έτοιμο σκάφος
intro:
  - Ως εργοστασιακή μάρκα του **Paddle Board Overstock Qingdao Manufacturing Hub**, η Paddle Board Overstock ελέγχει κάθε στάδιο παραγωγής. Η εγκατάστασή μας στη Ζώνη Οικονομικής Ανάπτυξης Qingdao εκτείνεται σε 12.000 τετραγωνικά μέτρα και φιλοξενεί εξειδικευμένα εργαστήρια.
  - Ενσωματώνοντας σχεδιασμό, μηχανική, πρωτοτυποποίηση, κατασκευή και δοκιμές υπό την ίδια στέγη, διατηρούμε άμεσο έλεγχο της ποιότητας κατασκευής.
