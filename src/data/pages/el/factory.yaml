qc_section:
  tagline: Ποιοτικός Έλεγχος
  title: Διαδικασία Δοκιμών & Διασφάλισης Ποιότητας
  subtitle: Κάθε σκάφος υποβάλλεται σε υποχρεωτική δοκιμή πριν την αποστολή.
  steps:
    - step: '1'
      title: Επιθεώρηση Πρώτων Υλών
      desc: PVC, Hypalon και drop-stitch υφάσματα υποβάλλονται σε δοκιμή εφελκυσμού και UV αντοχής.
    - step: '2'
      title: 48ωρη Δοκιμή Συγκράτησης Αέρα
      desc: Κάθε θάλαμος φουσκώνεται στο 125% της ονομαστικής πίεσης και διατηρείται για 48 ώρες.
    - step: '3'
      title: Δοκιμή Φορτίου & Ισορροπίας
      desc: Τα έτοιμα σκάφη φορτώνονται στη μέγιστη χωρητικότητα και δοκιμάζονται.
oem_section:
  tagline: OEM Έργα
  title: Μελέτες Περιπτώσεων Συνεργασίας
  subtitle: Από τη σύλληψη στο κοντέινερ — πώς βοηθάμε παγκόσμιες μάρκες.
  cases:
    - challenge: Ευρωπαίος λιανοπωλητής χρειαζόταν ιδιωτικής ετικέτας SUP σειρά.
      solution: Αναπτύξαμε προσαρμοσμένα αρχεία ψηφιακής εκτύπωσης.
      result: 55 ημέρες από PO σε FOB. 2.400 μονάδες.
    - challenge: Αμερικανική startup ήθελε καγιάκ drop-stitch υψηλών επιδόσεων.
      solution: Προσαρμόσαμε υπάρχον καλούπι καγιάκ.
      result: 5.000+ μονάδες πρώτο έτος.
    - challenge: Αυστραλός διανομέας ήθελε πιστοποιημένη CE σειρά RIB.
      solution: Παραγωγή προ-παραγωγής δειγμάτων με 4 χρώματα.
      result: 3-μοντέλο σειρά RIB στην αγορά AU/NZ.
faq_section:
  tagline: ΣΣΕ
  title: Συχνές Ερωτήσεις B2B & OEM
  questions:
    - q: Ποια είναι η ελάχιστη ποσότητα παραγγελίας (MOQ) για OEM SUP;
      a: Το MOQ ξεκινά από 5–10 μονάδες για τυπικά μοντέλα.
    - q: Η Paddle Board Overstock διαθέτει πιστοποίηση BSCI;
      a: Ναι. Το εργοστάσιό μας διατηρεί έγκυρη πιστοποίηση BSCI.
    - q: Ποιος είναι ο τυπικός χρόνος παράδοσης OEM;
      a: 30–45 ημέρες από επιβεβαίωση PO.
    - q: Μπορείτε να αποστείλετε FOB Qingdao ή CIF;
      a: Ναι. Αποστέλλουμε FOB Qingdao, CIF και DDP.
b2b_moq: 'Τυπικό MOQ: 5–10 μονάδες ανά μοντέλο (SUP/καγιάκ). RIB MOQ: 2–5 μονάδες.'
