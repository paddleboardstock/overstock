    - title: Τελική Συναρμολόγηση
      description: Γραμμή συναρμολόγησης όπου ενώνονται κύτη υαλονήματος και σωλήνες PVC.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Ποιοτικός Έλεγχος & Επιθεώρηση
      description: Κάθε έτοιμο σκάφος υποβάλλεται σε υποχρεωτική δοκιμή συγκράτησης αέρα.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
