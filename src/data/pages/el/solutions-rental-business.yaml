testimonial:
  content: Νοίκιαζα 5 σανίδες από ένα τοπικό κατάστημα και έχανα το 60% των εσόδων μου σε αυτές. Η Paddle Board Overstock με βοήθησε να φτιάξω τον δικό μου στόλο με 15 SUP. Ο υπολογιστής απόδοσης επένδυσης που παρείχαν έδειξε ότι θα έσπαγα σε 4 μήνες — στην πραγματικότητα χρειάστηκαν 3. Τώρα επεκτείνω σε 30 σανίδες και προσθέτω καγιάκ.
  name: Daniel Okonkwo
  title: Ιδιοκτήτης, Lakeland SUP Rentals — Οντάριο, Καναδάς
content_segments:
  tagline: Προφίλ Ενοικίασης
  title: Λύσεις ενοικίασης θαλάσσιων σπορ<br />Ανά τύπο χειριστή
  subtitle: Διαφορετικές επιχειρήσεις ενοικίασης έχουν διαφορετικές ανάγκες — από μικρές παραθαλάσσιες ενοικιάσεις SUP μέχρι μεγάλης κλίμακας κέντρα θαλάσσιων σπορ θέρετρου. Προσαρμόζουμε τα πακέτα εξοπλισμού μας και υποστηρίζουμε το μοντέλο ανάλογα.
  items:
    - title: Ενοικιαζόμενα Beach & Lakeside SUP
      subtitle: Λειτουργίες μεγάλου όγκου, χαμηλής πολυπλοκότητας
      description: Χειριστές που νοικιάζουν stand-up paddle boards και καγιάκ απευθείας σε παραθαλάσσιους και επισκέπτες της λίμνης. Η προτεραιότητά σας είναι η ελαχιστοποίηση του χρόνου διεκπεραίωσης μεταξύ των ενοικιάσεων, η διατήρηση του εξοπλισμού σε εναλλαγή και η διαχείριση των εποχικών αυξήσεων της ζήτησης με μικρό αποτύπωμα αποθήκευσης.
      features:
        - Στόλοι φουσκωτών SUP που διπλώνουν επίπεδα — χωρίς ανάγκη αποβάθρας ή ρυμουλκούμενου
        - PVC εμπορικής ποιότητας με στοιχεία για πάνω από 100 κύκλους ενοικίασης ανά σεζόν
        - Ύφασμα ταχύτητας στεγνώματος και ανθεκτικό στις UV για διαθεσιμότητα εκ νέου ενοικίασης αυθημερόν
        - Σειρές σανίδων με χρωματική κωδικοποίηση για εύκολη αναγνώριση στόλου
    - title: Resort & Hotel Κέντρα Θαλάσσιων Σπορ
      subtitle: Εμπειρία επισκεπτών και ευθυγράμμιση επωνυμίας
      description: Θέρετρα και ξενοδοχεία που προσφέρουν θαλάσσια σπορ ως ανέσεις στις εγκαταστάσεις. Ο εξοπλισμός πρέπει να είναι κορυφαίος, να έχει αξιόπιστη απόδοση μεταξύ αρχαρίων έως μεσαίων επισκεπτών και να ενσωματώνεται με τις υπάρχουσες ροές εργασιών κρατήσεων και χρέωσης δραστηριοτήτων του θερέτρου.
      features:
        - Σανίδες SUP και σωσίβια με προσαρμοσμένη επωνυμία στα χρώματα του θέρετρου
        - 'Μικτός στόλος: SUP, καγιάκ, πετάλες και μικρά tenders RIB'
        - Ήπιες, χωρίς καύσιμα ηλεκτρικές αντλίες για φούσκωμα στην παραλία
        - Περιλαμβάνεται εκπαίδευση προσωπικού και εισαγωγή στη συντήρηση
    - title: Χειριστές ενοικίασης σκαφών & RIB
      subtitle: Στόλος ενοικίασης σκαφών εμπορικής κατηγορίας
      description: Χειριστές που νοικιάζουν μηχανοκίνητα πλοία — προσφορές RIB, φουσκωτά σκάφη και μικρά δρομάκια — ανά ώρα ή μισή ημέρα. Ο στόλος σας πρέπει να πληροί τους κανονισμούς ναυτικής ασφάλειας, να αντέχει τη βαριά χρήση από τους επισκέπτες και να ελαχιστοποιεί τον μηχανικό χρόνο διακοπής λειτουργίας μεταξύ ναυλώσεων.
      features:
        - Πακέτα RIB με πρύμνες έτοιμες για εξωλέμβιους 30–90 ίππων
        - Πάνελ δαπέδου από κόντρα πλακέ ναυτικής ποιότητας για μακροπρόθεσμη δομική ακεραιότητα
        - Συστήματα βαλβίδων ταχείας εκκίνησης για ταχύτερη εναλλαγή
        - Κιτ ανταλλακτικών + τεχνική υποστήριξη SLA κατ' απαίτηση
    - title: Οργανωτές περιηγήσεων και περιπέτειας
      subtitle: Εκδρομικοί στόλοι με οδηγό
      description: Χειριστές που εκτελούν ξεναγήσεις για θαλάσσια σπορ — σαφάρι SUP, καγιάκ σε σπήλαια, εκδρομές για κολύμβηση με αναπνευστήρα ή περιηγήσεις RIB με πεζοπορία σε νησί. Ο εξοπλισμός πρέπει να είναι αρκετά σταθερός για τους αρχάριους επισκέπτες της περιοδείας, να καθαρίζεται γρήγορα μεταξύ των ομάδων και να είναι αρκετά ανθεκτικός για καθημερινή καθοδηγούμενη χρήση σε διαφορετικές συνθήκες νερού.
      features:
        - Υπερσταθερές πλατφόρμες SUP (πλάτος 82 cm και άνω) για αρχαρίους
        - Επιλογές διθέσιων καγιάκ για διαμορφώσεις περιηγήσεων ζευγαριών ή ομάδων
        - Ενσωματωμένη χωρητικότητα φορτίου για εξοπλισμό snorkeling, αδιάβροχες τσάντες και ψυγεία
        - Τεκμηρίωση συμμόρφωσης CE + USCG για εμπορικές δραστηριότητες
cta:
  title: Είστε έτοιμοι να δημιουργήσετε τον στόλο ενοικίασής σας;
  subtitle: Πείτε μας για την τοποθεσία και τον όγκο των επισκεπτών σας — θα σχεδιάσουμε έναν στόλο ενοικίασης βελτιστοποιημένο για την αγορά σας.
  actions:
    - variant: primary
      text: Λάβετε πρόταση ενοικίασης
      href: /contact
    - text: Συγκρίνετε επιχειρηματικά πακέτα
      href: /business-packages
    - text: Προβολή Ιστοριών επιτυχίας
      href: /success-stories
