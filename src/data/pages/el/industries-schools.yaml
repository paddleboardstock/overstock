hero:
  tagline: Σχολές & Προπονητικά Κέντρα Θαλάσσιων Σπορ
  title: Λύσεις Εξοπλισμού<br />Για Σχολές SUP & Καγιάκ
  subtitle: Αξιόπιστος εξοπλισμός εμπορικής ποιότητας για σχολές κωπηλασίας, εκπαίδευση σερφ, εκπαίδευση καγιάκ και προγράμματα εκπαίδευσης θαλάσσιων σπορ σε οποιαδήποτε κλίμακα.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Πίνακες Paddle Board Overstock SUP για σχολεία και εκπαιδευτικά κέντρα
direct_answer: Η Paddle Board Overstock προμηθεύει σχολές SUP και καγιάκ σε όλο τον κόσμο με πίνακες εμπορικής ποιότητας, εξοπλισμό ασφαλείας και πακέτα εκπαιδευτών. Ο εξοπλισμός μας είναι κατασκευασμένος για καθημερινή εκπαιδευτική χρήση — παχύτερο PVC, ενισχυμένοι πυρήνες σταγόνας βελονιάς και σταθερά σχέδια γάστρας που δίνουν στους αρχάριους αυτοπεποίθηση και στους εκπαιδευτές αξιοπιστία. Τα πακέτα περιλαμβάνουν προσαρμοσμένη επωνυμία, προγράμματα ανταλλακτικών και εκπαιδευτικούς πόρους.
solution_offerings:
  - title: Πακέτο Εκκίνησης Σχολείου
    subtitle: Για νέα προγράμματα και μικρά εκπαιδευτικά κέντρα
    badge: Popular
    features:
      - title: Σανίδες Μαθητών
        description: 10–25 ολόπλευρες σανίδες SUP ή ψυχαγωγικά καγιάκ με σταθερές πλατφόρμες για μαθήματα αρχαρίων
      - title: Σανίδες Εκπαιδευτών
        description: Πιο φαρδύς, μακρύτερες σανίδες με επιπλέον σταθερότητα και αντιολισθητικά καταστρώματα EVA για προπόνηση
      - title: Εξοπλισμός Ασφαλείας
        description: Σωσίβια, λουριά, σφυρίχτρες και ριχτάρια σε ταιριαστά χρώματα
      - title: Αποθήκευση & Μεταφορά
        description: Στοιβαζόμενες σανίδες, βάσεις για καγιάκ με επένδυση και κούκλες μεταφοράς
      - title: Υποστήριξη Προγράμματος Σπουδών
        description: Πρότυπα μαθημάτων, λίστες ελέγχου ασφαλείας και οδηγοί προόδου δεξιοτήτων
    cta_text: Ξεκινήστε το σχολικό μου πακέτο
    cta_href: /contact
  - title: Πακέτο School Premium
    subtitle: Για καθιερωμένα σχολεία και φορείς πολλαπλών προγραμμάτων
    badge: Best Value
    features:
      - title: Πλήρης Στόλος
        description: 25–50 σανίδες ή καγιάκ με μικτό στόλο (γύρω-γύρω, τουριστικά, νεανικά μεγέθη)
      - title: Στόλος εκπαιδευτών
        description: 3–5 εξειδικευμένες πλακέτες εκπαιδευτή με ενσωματωμένες βάσεις συστήματος ήχου
      - title: Σταθμός Ασφαλείας
        description: Κεντρικός σταθμός εργαλείων ασφαλείας με PFD, ραδιόφωνα, πρώτες βοήθειες και σήμανση
      - title: Πακέτο επωνυμίας
        description: Εκτύπωση πλήρους λογότυπου σε σανίδες, κουπιά, PFD και στολές
      - title: Πρόγραμμα Συντήρησης
        description: Τριμηνιαία κιτ συντήρησης, πακέτα ανταλλακτικών και εκπαίδευση επισκευής
    cta_text: Δημιουργήστε το πακέτο Premium
    cta_href: /contact
  - title: Σχολικό Πακέτο Franchise
    subtitle: Για αλυσίδες πολλαπλών τοποθεσιών και χειριστές franchise
    badge: Enterprise
    features:
      - title: Τυποποίηση στόλου
        description: Πανομοιότυπος εξοπλισμός σε όλες τις τοποθεσίες για συνεπή εμπειρία μαθητή
      - title: Κεντρική Παραγγελία
        description: Ενοποιημένες παραγγελίες, μαζική τιμολόγηση και κεντρική διαχείριση ανταλλακτικών
      - title: Εκπαίδευση εκπαιδευτών
        description: Πιστοποίηση χειρισμού και συντήρησης εξοπλισμού για όλους τους εκπαιδευτές
      - title: συνδημιουργία επωνυμίας (Co-branding)
        description: Κοινή επωνυμία με επιλογές κοινής επωνυμίας franchise + Paddle Board Overstock
      - title: Υποστήριξη επέκτασης
        description: Συμβουλευτική κλιμάκωσης, πρόβλεψη εξοπλισμού και ρύθμιση νέας τοποθεσίας
    cta_text: Συζητήστε το πλάνο franchise
    cta_href: /contact
benefits:
  - title: Κατασκευασμένο για καθημερινή διδασκαλία
    description: Πιο παχύ PVC και ενισχυμένες ράγες αντέχουν την καθημερινή χρήση των μαθητών, τις πτώσεις στην άμμο και τις βραχώδεις προσγειώσεις.
    icon: tabler:shield
  - title: Σταθερές πλατφόρμες μάθησης
    description: Οι φαρδιές γάστρες και τα πιο επίπεδα rockers δίνουν στους αρχάριους αυτοπεποίθηση. Οι εκπαιδευτές εστιάζουν στη διδασκαλία και όχι στον εξοπλισμό.
    icon: tabler:scale
  - title: Εύκολη αποθήκευση & μεταφορά
    description: Καταστήματα φουσκωτών ντιζάιν σε μικρούς χώρους. Οι ξεφουσκωμένες σανίδες ταιριάζουν σε στάνταρ πορτμπαγκάζ οχημάτων για φορητή διδασκαλία.
    icon: tabler:box-seam
  - title: Προσαρμοσμένη επωνυμία
    description: Σχολικά λογότυπα και χρώματα σε κάθε πίνακα. Η επωνυμία σας, η ταυτότητά σας — όχι γενικός εξοπλισμός ενοικίασης.
    icon: tabler:brush
content_segments:
  tagline: Σχολικά Προφίλ
  title: Λύσεις εκπαίδευσης για θαλάσσια σπορ<br />Ανά τύπο προγράμματος
  subtitle: Τα σχολεία κωπηλασίας, οι ακαδημίες σερφ, τα πανεπιστημιακά προγράμματα και οι χειριστές franchise αντιμετωπίζουν το καθένα διαφορετικές επιχειρησιακές προκλήσεις — από την ενσωμάτωση του προγράμματος σπουδών έως την τυποποίηση του στόλου πολλαπλών τοποθεσιών. Διαμορφώνουμε πακέτα εξοπλισμού ώστε να ταιριάζουν με το εκπαιδευτικό μοντέλο.
  items:
    - title: Ανεξάρτητες Σχολές SUP & Καγιάκ
      subtitle: Εκπαιδευτικά κέντρα που λειτουργούν από ιδιοκτήτες
      description: Μικρά έως μεσαίου μεγέθους σχολεία που διευθύνονται από ιδιοκτήτες-εκπαιδευτές που προσφέρουν μαθήματα SUP, εκπαίδευση καγιάκ και μαθήματα πιστοποίησης. Ο εξοπλισμός πρέπει να είναι αρκετά ανθεκτικός για καθημερινή εκπαιδευτική χρήση, οικονομικά προσιτός για έναν προϋπολογισμό μικρής επιχείρησης και αρκετά ευέλικτος ώστε να εξυπηρετεί αρχάριους έως μέσους μαθητές σε έναν μόνο στόλο.
      features:
        - Σταθερές πολυχρηστικές σανίδες SUP και καγιάκ αναψυχής για μαθήματα αρχαρίων
        - Σανίδες ειδικά για εκπαιδευτές με επιπλέον σταθερότητα για διδασκαλία από το νερό
        - Πρότυπα σχεδίων μαθημάτων και οδηγοί προόδου δεξιοτήτων περιλαμβάνονται
        - Ετήσιο πρόγραμμα ανανέωσης εξοπλισμού με εκπτώσεις ανταλλαγής
    - title: Προγράμματα Ψυχαγωγίας Πανεπιστημίων & Κολλεγίων
      subtitle: Μεγάλοι στόλοι μαθητών αναψυχής
      description: Πανεπιστημιακά τμήματα αναψυχής λειτουργούν κλαμπ κωπηλασίας, προγράμματα ενοικίασης και εκπαιδευτικά μαθήματα ως μέρος των προσφορών αναψυχής στην πανεπιστημιούπολη. Ο εξοπλισμός αντιμετωπίζει τη μέγιστη χρήση κατά τη διάρκεια των εξαμήνων, απαιτεί εύκολα συστήματα check-in/check-out και πρέπει να αντέχει σε ποικίλα επίπεδα δεξιοτήτων από φοιτητές για πρώτη φορά έως προχωρημένους κωπηλάτες.
      features:
        - Κατασκευή PVC υψηλής αντοχής πιστοποιημένη για θεσμικούς κύκλους χρήσης
        - Χρωματικά κωδικοποιημένοι στόλοι ανά επίπεδο δεξιοτήτων για εύκολη διαχείριση
        - Συμβατότητα με συστήματα παρακολούθησης αποθεμάτων βάσει RFID ή αυτοκόλλητων
        - Χονδρικές τιμές με εξαμηνιαίες παραγγελίες και όρους πληρωμής
    - title: Σχολές Surf & Ακαδημίες Surf
      subtitle: Προγράμματα εκπαίδευσης για παράκτια σέρφινγκ
      description: Σχολές σέρφινγκ που διδάσκουν δεξιότητες SUP surfing, prone paddle και surf kayak σε περιβάλλοντα ωκεανού. Ο εξοπλισμός πρέπει να ανταποκρίνεται στις συνθήκες της ζώνης σερφ — αντοχή σε κρούση, ανοχή στην άμμο και στο αλμυρό νερό και εύκολο ξέβγαλμα και επιστροφή μεταξύ των ωριαίων μαθημάτων.
      features:
        - Σχήματα ειδικά για σερφ με ενισχυμένες ράγες και κατασκευή ανθεκτική σε κρούσεις
        - Επιλογές μαλακών πτερυγίων και τυλιγμένων leash για την ασφάλεια των μαθητών
        - Ύφασμα γρήγορου ξεπλυσμού που στεγνώνει μεταξύ των σειρών μαθημάτων
        - Πρόγραμμα αντικατάστασης στόλου με επιθεώρηση και ανανέωση στο τέλος της σεζόν
    - title: Αλυσίδες Franchise & Multi-Location
      subtitle: Τυποποιημένος εξοπλισμός σε όλες τις τοποθεσίες
      description: Χειριστές πολλαπλών τοποθεσιών που εκτελούν τυποποιημένα προγράμματα εκπαίδευσης σε πολλές πόλεις ή περιοχές. Η συνοχή του στόλου σε όλες τις τοποθεσίες είναι πρωταρχικής σημασίας - κάθε μαθητής πρέπει να έχει την ίδια εμπειρία εξοπλισμού ανεξάρτητα από την τοποθεσία franchise που επισκέπτεται. Η κεντρική παραγγελία, η ομοιομορφία επωνυμίας και η υποστήριξη κλιμάκωσης είναι απαραίτητα.
      features:
        - Πανομοιότυπες προδιαγραφές στόλου σε όλες τις τοποθεσίες franchise
        - Κεντροποιημένες ενοποιημένες παραγγελίες με τιμές όγκου
        - 'Επιλογές co-branding: μάρκα franchise + co-branding Paddle Board Overstock'
        - 'Κιτ έναρξης νέας τοποθεσίας: εξοπλισμός, σήμανση και αρχικό απόθεμα'
cta:
  title: Είστε έτοιμοι να εξοπλίσετε το σχολείο σας;
  subtitle: Επικοινωνήστε με την ομάδα μας για ένα προσαρμοσμένο σχέδιο εξοπλισμού. Συνεργαζόμαστε με σχολεία όλων των μεγεθών.
  actions:
    - variant: primary
      text: Μιλήστε με την ομάδα μας
      href: /contact
    - text: Δείτε τον κατάλογο προϊόντων
      href: /products
