content_founding:
  tagline: Η αρχή
  title: 'Γεννήθηκε Στο Μέρος του Νερού'
  subtitle: 'Το Aquafarer ξεκίνησε σε ένα παράκτιο εργαστήριο στο Qingdao με ένα σκάφος και ένα όραμα: να κατασκευάσει φουσκωτά σκάφη που αντέχουν πραγματικές θαλάσσιες συνθήκες.'
  paragraphs:
    - 'Το 2012 οι ιδρυτές μας είδαν ένα κενό στην αγορά — τα περισσότερα φουσκωτά σκάφη ήταν είτε προσιτά αλλά αναξιόπιστα, είτε υψηλής ποιότητας αλλά απαγορευτικά ακριβά. Πίστευαν ότι υπήρχε χώρος για έναν κατασκευαστή που θα προσέφερε τόσο ποιότητα όσο και αξία.'
    - 'Το πρώτο γάστρο κατασκευάστηκε στο χέρι, δοκιμάστηκε σε τοπικά ύδατα και βελτιώθηκε με βάση πραγματικά σχόλια από ψαράδες και μικρούς εμπορικούς λειτουργούς. Αυτός ο κύκλος ανατροφοδότησης — κατασκευή, δοκιμή, ακρόαση, βελτίωση — παραμένει στον πυρήνα της μηχανικής μας φιλοσοφίας.'
    - 'Μέχρι το 2015 η φήμη είχε εξαπλωθεί πέρα από το Qingdao. Διεθνείς διανομείς άρχισαν να ζητούν δείγματα. Αυτό που ξεκίνησε ως τοπικό εργαστήριο γινόταν παγκόσμιος προμηθευτής.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Πρώιμο παραγωγικό εργαστήριο και παραγωγή της Aquafarer
content_growth:
  tagline: Ανάπτυξη & καινοτομία
  title: 'Από Εργαστήριο σε Εγκατάσταση 12.000 m²'
  subtitle: 'Η συνεχής επένδυση σε ανθρώπους, εξοπλισμό και διαδικασίες έχει μετατρέψει το Aquafarer σε μια σύγχρονη ναυπηγική μονάδα παραγωγής.'
  paragraphs:
    - 'Καθώς η ζήτηση μεγάλωνε, μεγάλωνε και η μονάδα μας. Επεκταθήκαμε από ένα μικρό εργαστήριο σε ένα εργοστάσιο 12.000 m² με αποκλειστικές γραμμές παραγωγής για σκάφη RIB, φουσκωτά σκάφη, σανίδες SUP και αξεσουάρ.'
    - 'Επενδύσαμε σε μηχανές κοπής CNC, εξοπλισμό συγκόλλησης υψηλής συχνότητας, γραμμές παραγωγής drop stitch και ολοκληρωμένα συστήματα δοκιμών — επιτρέποντάς μας να ελέγχουμε κάθε πτυχή της ποιότητας παραγωγής.'
    - 'Σήμερα, η ομάδα μας 200-300 ατόμων περιλαμβάνει ναυπηγούς μηχανικούς, επιστήμονες υλικών, ειδικούς ελέγχου ποιότητας και έμπειρους τεχνίτες — πολλοί από τους οποίους είναι στο Aquafarer από τα πρώτα χρόνια.'
content_mission:
  tagline: Η αποστολή μας
  title: 'Ελευθερία Στο Νερό, Με Σχεδιασμό'
  subtitle: 'Κάθε προϊόν Aquafarer σχεδιάζεται για να βοηθά τους ανθρώπους να εξερευνούν, να εργάζονται και να ευδοκιμούν στο νερό — με αξιοπιστία, ασφάλεια και προσιτή τιμή.'
  list:
    - 'Σχεδιασμός σκαφών που αποδίδουν σε πραγματικές θαλάσσιες συνθήκες — όχι μόνο στο χαρτί'
    - 'Δημιουργία διαχρονικών συνεργασιών με διανομείς και brands μέσω αξιόπιστης υπηρεσίας OEM/ODM'
    - 'Συνεχής βελτίωση των διαδικασιών παραγωγής μας για καλύτερη αξία'
    - 'Υποστήριξη κάθε προϊόντος με γνήσια ανταλλακτικά και τεχνική εξειδίκευση'
cta:
  title: 'Έτοιμοι να συνεργαστείτε με έναν κατασκευαστή<br />που νοιάζεται για την ποιότητα;'
  subtitle: 'Επικοινωνήστε με την ομάδα μας για να συζητήσετε το έργο OEM/ODM — χωρίς πίεση ελάχιστης παραγγελίας, μόνο ειλικρινείς συμβουλές.'
  actions:
    - variant: primary
      text: Ξεκινήστε μια συζήτηση
      href: /contact
    - text: Εξερευνήστε τα προϊόντα μας
      href: /products
