hero:
  tagline: Η ιστορία μας
  title: 'Aquafarer — Ελευθερία Στο Νερό, Με Σχεδιασμό'
  subtitle: 'Από ένα παράκτιο εργαστήριο σε έναν παγκόσμιο ναυτικό κατασκευαστή — το ταξίδι μας βασίζεται σε μια πεισματική πεποίθηση: τα σκάφη πρέπει να σχεδιάζονται σαν να έχει σημασία, γιατί έχει.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Εργοστάσιο και ναυτική μονάδα παραγωγής της Aquafarer στο Qingdao
