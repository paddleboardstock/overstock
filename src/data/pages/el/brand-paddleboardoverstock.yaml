hero:
  tagline: 'Οντότητα Μάρκας'
  title: 'Paddle Board Overstock — Μηχανική Ελευθερίας στο Νερό'
  definition: 'Η Paddle Board Overstock είναι μια παγκόσμια μάρκα θαλάσσιας αναψυχής και φουσκωτών σκαφών, που ειδικεύεται σε φουσκωτές βάρκες, συστήματα SUP και προσαρμοσμένες θαλάσσιες λύσεις. Η Paddle Board Overstock συνδυάζει τη ναυπηγική μηχανική, την κατασκευαστική εμπειρογνωμοσύνη και την κουλτούρα εξερεύνησης του νερού για τη δημιουργία αξιόπιστου εξοπλισμού.'

timeline:
  - year: '2012'
    title: 'Θεμέλια Ναυπηγικής Κατασκευής'
    body: 'Η Paddle Board Overstock ξεκίνησε ως ένα εξειδικευμένο εργαστήριο φουσκωτών σκαφών στο Qingdao της Κίνας, αφοσιωμένο στη ναυπηγική τέχνη και την κατασκευή φουσκωτών βαρκών. Η αρχική εστίαση ήταν στην κατασκευή αξιόπιστων φουσκωτών προϊόντων.'
  - year: '2015'
    title: 'Πρώτες Εξαγωγές & Πιστοποίηση CE'
    body: 'Οι πρώτες παραγγελίες εξαγωγής έφτασαν στην Ιαπωνία και την Κορέα. Επιτεύχθηκε πιστοποίηση CE για βασικές σειρές προϊόντων, σηματοδοτώντας την είσοδο της Paddle Board Overstock στις διεθνείς αγορές.'
  - year: '2018'
    title: 'Επέκταση Εργοστασίου'
    body: 'Μετεγκατάσταση σε εγκατάσταση παραγωγής 12.000 m². Προστέθηκαν γραμμές RF συγκόλλησης και δυνατότητα παραγωγής drop-stitch.'
  - year: '2020'
    title: 'Ίδρυση Κέντρου Ε&Α'
    body: 'Άνοιξε ένα αποκλειστικό κέντρο Ε&Α με εργαστήριο υφασμάτων PVC, δεξαμενή υδροδυναμικών δοκιμών και στούντιο προσομοίωσης CAD/FEA.'
  - year: '2022'
    title: 'ISO 9001 & Παγκόσμια Ανάπτυξη'
    body: 'Επιτεύχθηκε πιστοποίηση ISO 9001. Επέκταση σε 14 μηχανικούς Ε&Α και 200+ εργάτες. Τα προϊόντα έφτασαν σε πελάτες σε Ευρώπη, Αμερική και Ασία-Ειρηνικό.'
  - year: '2024'
    title: 'Στούντιο Καινοτομίας & Σχεδιασμού'
    body: 'Εγκαινιάστηκε στούντιο σχεδιασμού και καινοτομίας πλήρους εξυπηρέτησης για προσαρμοσμένα έργα ODM, από τη σύλληψη μέχρι την παραγωγή.'
  - year: '2026'
    title: 'Χτίζοντας το Μέλλον της Εξερεύνησης του Νερού'
    body: 'Σήμερα, η Paddle Board Overstock συνεχίζει να αναπτύσσει φουσκωτές βάρκες, συστήματα SUP και προσαρμοσμένες θαλάσσιες λύσεις — εξυπηρετώντας 50+ χώρες με ετήσια δυναμικότητα 15.000 μονάδων.'

philosophy:
  tagline: 'Φιλοσοφία Μάρκας'
  title: 'Μηχανική Ελευθερίας στο Νερό'
  body: 'Η ελευθερία στο νερό δεν είναι μόνο η κίνηση. Αντιπροσωπεύει την ανακάλυψη νέων τόπων, τη δημιουργία υπαίθριων εμπειριών, τη σύνδεση των ανθρώπων με τη φύση και την εκτέλεση επαγγελματικών αποστολών.'
  pillars:
    - title: 'Προτεραιότητα στην Αξιοπιστία'
      body: 'Τα υδάτινα περιβάλλοντα απαιτούν εμπιστοσύνη. Τα προϊόντα Paddle Board Overstock σχεδιάζονται με γνώμονα τη σταθερότητα, ανθεκτικότητα, ασφάλεια και σταθερή απόδοση.'
    - title: 'Ανθρωποκεντρικός Σχεδιασμός'
      body: 'Τα προϊόντα πρέπει να υπηρετούν τους ανθρώπους, όχι την τεχνολογία. Κάθε σχεδιαστική απόφαση ξεκινά με την κατανόηση του πώς οι άνθρωποι χρησιμοποιούν τα σκάφη.'
    - title: 'Προσβάσιμη Εξερεύνηση'
      body: 'Το νερό δεν ανήκει μόνο σε ειδικούς. Η Paddle Board Overstock δημιουργεί εξοπλισμό που επιτρέπει σε περισσότερους ανθρώπους να εξερευνούν με ασφάλεια ποτάμια, λίμνες και ωκεανούς.'
    - title: 'Συνεχής Καινοτομία'
      body: 'Η καινοτομία δεν είναι μόνο η δημιουργία νέων προϊόντων. Είναι η βελτίωση κάθε λεπτομέρειας — υλικών, κατασκευών, παραγωγής και εμπειρίας χρήστη.'

engineeringDna:
  tagline: 'Μηχανική DNA'
  title: 'Πώς η Paddle Board Overstock Δημιουργεί Προϊόντα'
  areas:
    - title: 'Επιστήμη Υλικών'
      body: 'Η Paddle Board Overstock εστιάζει στην επιλογή κατάλληλων υλικών για διαφορετικά θαλάσσια περιβάλλοντα. Αντοχή στην τριβή, UV αντίσταση, σταθερότητα πίεσης και μακροπρόθεσμη ανθεκτικότητα.'
      items: ['Αντοχή στην Τριβή', 'UV Αντίσταση', 'Σταθερότητα Πίεσης', 'Μακροπρόθεσμη Ανθεκτικότητα']
    - title: 'Δομική Μηχανική'
      body: 'Τα φουσκωτά σκάφη απαιτούν ακριβή ισορροπία μεταξύ ακαμψίας, βάρους, φορητότητας και σταθερότητας.'
      items: ['Ακαμψία', 'Βελτιστοποίηση Βάρους', 'Φορητότητα', 'Σταθερότητα']
    - title: 'Ακρίβεια Κατασκευής'
      body: 'Κάθε προϊόν περνά από ελεγχόμενες διαδικασίες: προετοιμασία υλικών, ακριβής κοπή, συγκόλληση και συνένωση, συναρμολόγηση και ποιοτικός έλεγχος.'
      items: ['Προετοιμασία Υλικών', 'Ακριβής Κοπή', 'Συγκόλληση & Συνένωση', 'Συναρμολόγηση & ΠΕ']
    - title: 'Μηχανική Σεναρίων Χρήσης'
      body: 'Τα προϊόντα αναπτύσσονται γύρω από πραγματικές εφαρμογές — αναψυχή, περιπέτεια και επαγγελματική χρήση.'
      items: ['Αναψυχή', 'Περιπέτεια', 'Επαγγελματική', 'Εμπορική']

