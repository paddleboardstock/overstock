features3_certifications:
  title: Πιστοποιήσεις & Συμμόρφωση
  subtitle: Κάθε προϊόν δοκιμάζεται ανεξάρτητα· 64 μοντέλα έχουν πιστοποίηση CE σύμφωνα με διεθνή πρότυπα.
  columns: 3
  isBeforeContent: true
  items:
    - title: Πιστοποίηση CE
      description: 64 μοντέλα με πιστοποίηση CE σε SUP, καγιάκ, βοηθητικά σκάφη και RIB πληρούν το ευρωπαϊκό πρότυπο ασφαλείας CE για σκάφη αναψυχής. Κάθε προϊόν υποβάλλεται σε δοκιμή πίεσης, πλευστότητας και φορτίου πριν φύγει από το εργοστάσιο.
      icon: tabler:certificate
    - title: ''
      description: Η εγκατάστασή μας 12.000 m² στο Qingdao λειτουργεί υπό σύστημα διαχείρισης ποιότητας ISO 9001:2015. Κάθε παρτίδα παραγωγής είναι ιχνηλάσιμη και ελεγμένη.
      icon: tabler:clipboard-check
    - title: Κοινωνική Συμμόρφωση BSCI
      description: Είμαστε πιστοποιημένοι BSCI, διασφαλίζοντας ηθικές εργασιακές πρακτικές και περιβαλλοντική ευθύνη.
      icon: tabler:users
    - title: REACH & RoHS
      description: Όλα τα υλικά συμμορφώνονται με τους κανονισμούς REACH και RoHS της ΕΕ. Καμία ουσία υπό περιορισμό.
      icon: tabler:flask
    - title: Εργαστήριο Δοκιμών Υλικών
      description: Εσωτερικό εργαστήριο δοκιμάζει αντοχή εφελκυσμού, UV αντοχή και ακεραιότητα ραφών για κάθε παρτίδα υφάσματος.
      icon: tabler:microscope
    - title: 2ετής Εγγύηση
      description: Κάθε προϊόν Paddle Board Overstock συνοδεύεται από διετή εγγύηση έναντι κατασκευαστικών ελαττωμάτων.
      icon: tabler:shield-check
testimonials:
  tagline: Εμπιστοσύνη Πελατών
  title: Τι λένε οι πελάτες μας
  subtitle: Από αρχάριους κωπηλάτες έως επαγγελματίες χειριστές στόλου.
  items:
    - content: Εξοπλίσαμε ολόκληρο τον στόλο ενοικίασής μας με RIB Paddle Board Overstock. Δύο σεζόν, μηδενικές βλάβες. Η πιστοποίηση CE διευκόλυνε την έγκριση ασφάλισης.
      name: Marco V.
      title: Τουριστικός χειριστής, Κροατία
    - content: Ως πρωτάρης αγοραστής, ανησυχούσα για την ποιότητα. Η τεκμηρίωση και οι αναφορές δοκιμών που μοιράστηκαν μου έδωσαν πλήρη εμπιστοσύνη.
      name: James T.
      title: Κάτοχος SUP Explorer 11, Καναδάς
    - content: Συνεργαζόμαστε με την Paddle Board Overstock για παράκτιες μονάδες περιπολίας. Η διαδικασία QC είναι συνεπής σε κάθε παρτίδα.
      name: Αντιπλοίαρχος Andres
      title: Ναυτικές προμήθειες, Φιλιππίνες
steps2_manufacturing:
  title: Πώς διασφαλίζουμε την ποιότητα
  subtitle: Από την επιθεώρηση πρώτων υλών έως την τελική δοκιμή πίεσης.
  items:
    - title: Επιθεώρηση Πρώτων Υλών
      description: Κάθε ρολό PVC υφάσματος ελέγχεται για πάχος, αντοχή εφελκυσμού και UV αντοχή.
      icon: tabler:search
    - title: Ποιοτικός Έλεγχος Εν Διαδικασία
      description: Οι ραφές συγκόλλησης ελέγχονται σε κάθε σταθμό κατά τη συναρμολόγηση.
      icon: tabler:eye
    - title: Δοκιμή Πίεσης
      description: Κάθε φουσκωτό προϊόν φουσκώνεται στο 1,25x της ονομαστικής PSI και διατηρείται για 24-48 ώρες.
      icon: tabler:wind
    - title: Τελική Επιθεώρηση
      description: Κάθε μονάδα ελέγχεται για φινίρισμα, υλικό και συσκευασία πριν την αποστολή.
      icon: tabler:clipboard-check
faqs_rib:
  title: Συχνές Ερωτήσεις RIB
  subtitle: Συνήθεις ερωτήσεις για τα φουσκωτά σκάφη σκληρού κύτους.
  columns: 2
  items:
    - title: Τι μεγέθη RIB σκαφών προσφέρει η Paddle Board Overstock;
      description: Προσφέρουμε 35 μοντέλα RIB από 2,5 m έως 7,6 m, καλύπτοντας τα πάντα από συμπαγή βοηθητικά έως βαριά εμπορικά και περιπολικά σκάφη.
    - title: Ποια είναι η διαφορά μεταξύ RIB και παραδοσιακής φουσκωτής βάρκας;
      description: Ένα RIB συνδυάζει συμπαγές γυάλινο ή αλουμινένιο κύτος βαθιάς V με φουσκωτούς σωλήνες Hypalon ή PVC. Αυτό δίνει σταθερότητα και χωρητικότητα φορτίου σκληρού σκάφους με απορρόφηση κραδασμών φουσκωτού.
    - title: Ποιες μηχανές είναι συμβατές με τα RIB Paddle Board Overstock;
      description: Τα RIB μας υποστηρίζουν εξωλέμβιες μηχανές από 3 HP έως 250 HP ανάλογα με το μοντέλο.
    - title: Είναι τα RIB Paddle Board Overstock πιστοποιημένα CE;
      description: Ναι. Όλα τα μοντέλα RIB αναψυχής είναι πιστοποιημένα CE σύμφωνα με τα ευρωπαϊκά πρότυπα.
    - title: Ποια είναι η εγγύηση στα RIB σκάφη;
      description: Όλα τα RIB Paddle Board Overstock συνοδεύονται από τυπική ετήσια εγγύηση έναντι κατασκευαστικών ελαττωμάτων.
    - title: Πόσους αεροθαλάμους έχουν τα RIB Paddle Board Overstock;
      description: Τα RIB μας διαθέτουν 3 έως 7 ανεξάρτητους αεροθαλάμους ανάλογα με το μήκος του μοντέλου.
faqs_inflatable:
  title: Συχνές Ερωτήσεις Φουσκωτών
  subtitle: Συνήθεις ερωτήσεις για φουσκωτά βοηθητικά σκάφη, καγιάκ και βάρκες.
  columns: 2
  items:
    - title: Τι υλικά χρησιμοποιούνται στις φουσκωτές βάρκες Paddle Board Overstock;
      description: Χρησιμοποιούμε στρατιωτικής ποιότητας PVC (1100 denier) και premium Hypalon/CSM καουτσούκ. Και τα δύο υλικά είναι UV-σταθεροποιημένα και ανθεκτικά στην τριβή.
    - title: Πόσο διαρκούν οι φουσκωτές βάρκες;
      description: Με σωστή φροντίδα, μια ποιοτική PVC φουσκωτή βάρκα διαρκεί 7–10 χρόνια, ενώ τα μοντέλα Hypalon μπορούν να διαρκέσουν 15–20 χρόνια.
    - title: Τι συντήρηση απαιτείται για μια φουσκωτή βάρκα;
      description: 'Βασική συντήρηση: ξέβγαλμα με γλυκό νερό μετά από κάθε χρήση, στέγνωμα πριν την αποθήκευση, ετήσιος έλεγχος στεγανοποιήσεων βαλβίδων.'
    - title: Μπορούν οι φουσκωτές βάρκες να χρησιμοποιηθούν σε αλμυρό νερό;
      description: Ναι. Όλες οι φουσκωτές βάρκες Paddle Board Overstock είναι σχεδιασμένες για γλυκό και αλμυρό νερό. Συνιστάται ξέβγαλμα με γλυκό νερό.
    - title: Πώς αποθηκεύω μια φουσκωτή βάρκα;
      description: Ξεφουσκώστε, καθαρίστε και στεγνώστε τελείως. Τυλίξτε χαλαρά, αποθηκεύστε σε δροσερό ξηρό μέρος μακριά από άμεσο ηλιακό φως.
    - title: Ποια είναι η χωρητικότητα βάρους των φουσκωτών βαρκών Paddle Board Overstock;
      description: Οι χωρητικότητες βάρους κυμαίνονται από 290 kg για τα μικρότερα μοντέλα έως πάνω από 2000 kg για μεγαλύτερα εμπορικά σκάφη.
faqs_sup:
  title: Συχνές Ερωτήσεις SUP
  subtitle: Συνήθεις ερωτήσεις για τις σανίδες κωπηλασίας όρθιας στάσης.
  columns: 2
  items:
    - title: Τι μεγέθη SUP σανίδων είναι διαθέσιμα;
      description: Προσφέρουμε SUP σανίδες από 9 ft έως 12 ft, συμπεριλαμβανομένων all-round, τουριστικών, γιόγκα και ειδικών σχεδίων.
    - title: Τι είναι η κατασκευή drop-stitch;
      description: Η κατασκευή drop-stitch χρησιμοποιεί χιλιάδες πολυεστερικές κλωστές που συνδέουν τα πάνω και κάτω στρώματα της σανίδας, επιτρέποντάς της να συγκρατεί υψηλή πίεση αέρα.
    - title: Ποιο είναι το όριο βάρους για SUP σανίδες;
      description: Οι SUP σανίδες μας υποστηρίζουν έως 150 kg ανάλογα με το μοντέλο και τον όγκο.
    - title: Προσφέρετε πλήρη πακέτα SUP;
      description: 'Ναι. Κάθε SUP σανίδα αποστέλλεται με πλήρες πακέτο: κουπί αλουμινίου 3 τεμαχίων, χειροκίνητη αντλία υψηλής πίεσης, σχοινί ασφαλείας, σακίδιο ταξιδιού και κιτ επισκευής.'
    - title: Ποια είναι η εγγύηση στις SUP σανίδες;
      description: Όλες οι SUP σανίδες Paddle Board Overstock φέρουν ετήσια εγγύηση έναντι κατασκευαστικών ελαττωμάτων.
    - title: Πόσο χρόνο χρειάζεται για να φουσκώσει μια SUP σανίδα;
      description: Με τη χειροκίνητη αντλία, ένα πλήρες φούσκωμα στα 15 PSI διαρκεί περίπου 8–12 λεπτά.
cta:
  title: Θέλετε να δείτε μόνοι σας τις πιστοποιήσεις;
  subtitle: Ζητήστε το χαρτοφυλάκιο πιστοποιήσεων, τις εκθέσεις ελέγχου εργοστασίου ή τα έγγραφα συμμόρφωσης υλικών.
  actions:
    - variant: primary
      text: Ζητήστε έγγραφα πιστοποίησης
      href: /contact
    - text: Επισκεφθείτε τη σελίδα του εργοστασίου
      href: /factory
features3_lab:
  title: Εργαστήριο Εσωτερικών Δοκιμών & Ποιότητας
  subtitle: Κάθε παρτίδα υλικών και τελικό προϊόν περνά από το εργαστήριο δοκιμών στο χώρο μας πριν αποσταλεί.
  columns: 3
  isBeforeContent: true
  items:
    - title: Δοκιμή αντοχής εφελκυσμού
      description: 'Κάθε ρολό υφάσματος PVC ελέγχεται σύμφωνα με τα πρότυπα ASTM D751. Ελάχιστη απαίτηση: 350 N/cm στημόνι και υφάδι. Οι παρτίδες που απορρίφθηκαν επιστρέφονται στον προμηθευτή — απορρίπτουμε περίπου το 3% των εισερχόμενων υλικών.'
      icon: tabler:scale
    - title: Επιταχυνόμενη γήρανση με υπεριώδη ακτινοβολία
      description: Τα δείγματα υφασμάτων υποβάλλονται σε επιταχυνόμενη διάβρωση QUV 1.000 ωρών (ASTM G154). Η διατήρηση της αντοχής σε εφελκυσμό πρέπει να υπερβαίνει το 80% μετά την έκθεση στην υπεριώδη ακτινοβολία. Προϊόντα που έχουν αξιολογηθεί για 3+ χρόνια χρήσης σε εξωτερικούς χώρους.
      icon: tabler:sun
    - title: Αντοχή ραφών σε αποκόλληση
      description: Οι συγκολλημένες ραφές RF έχουν δοκιμαστεί με ελάχιστη αντοχή αποκόλλησης 5 N/mm (ASTM D751). Χειροκόλλητες ραφές Hypalon δοκιμασμένες στα 3,5 N/mm. Κάθε παρτίδα παραγωγής έχει δείγματα ραφών που έχουν ελεγχθεί και αρχειοθετηθεί καταστροφικά.
      icon: tabler:stack
    - title: Διατήρηση πίεσης 24–48 ωρών
      description: 'Κάθε φουσκωτό προϊόν διογκώθηκε σε 1,25x ονομαστική PSI και παρακολουθήθηκε για 24–48 ώρες. Μέγιστη επιτρεπόμενη πτώση πίεσης: 5%. Τα προϊόντα που αποτυγχάνουν σε αυτήν τη δοκιμή επεξεργάζονται ξανά και δοκιμάζονται ξανά πριν από την αποστολή.'
      icon: tabler:wind
    - title: Δοκιμές κύκλων βανών
      description: Κάθε σχέδιο βαλβίδας υφίσταται 10.000 κύκλους ανοιχτού-κλεισίματος στο εργαστήριό μας. Οι βαλβίδες πρέπει να διατηρούν αεροστεγή σφράγιση σε 1,25x ονομαστική πίεση μετά την ανακύκλωση. Όλες οι βαλβίδες Paddle Board Overstock χαρακτηρίζονται για 5+ χρόνια τακτικής χρήσης.
      icon: tabler:rotate
    - title: Αντίσταση στο κρύο ρωγμή
      description: Υλικά που δοκιμάστηκαν στους -30°C για 4 ώρες ανά ISO 4646. Δεν επιτρέπεται ρωγμή ή ευθραυστότητα. Προϊόντα βαθμολογημένα για χειμερινή αποθήκευση και χρήση σε κρύο νερό σε θερμοκρασία περιβάλλοντος έως -10°C.
      icon: tabler:snowflake

