hero:
  tagline: Πίνακας λύσεων βιομηχανίας
  title: Θαλάσσιες λύσεις βασισμένες σε σενάρια<br />Για επαγγελματικές επιχειρήσεις
  subtitle: Σχεδιασμένα ειδικά σχεδιασμένα φουσκωτά σκάφη και RIB που έχουν διαμορφωθεί για διάσωσης, ενοικίαση στόλου, διαγωνισμούς γιοτ και εφαρμογές εμπορικής αλιείας — το καθένα υποστηρίζεται από τεχνικές προδιαγραφές και επιλογές προσαρμογής.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Επαγγελματικές ναυτιλιακές λύσεις Paddle Board Overstock για διάφορους κλάδους
direct_answer: 'Η Paddle Board Overstock προσφέρει φουσκωτά σκάφη και λύσεις RIB σχεδιασμένες σε σενάριο για εμπορικές θαλάσσιες επιχειρήσεις: σκάφη διάσωσης και περιπολίας με ενισχυμένους σωλήνες Hypalon και ασφάλεια πολλαπλών θαλάμων, ενοικιαζόμενα SUP και καγιάκ με PVC 1,2 mm και συγκολλημένες ραφές θερμού αέρα για χαμηλή ανθεκτικότητα RIB κύτους και διαμορφώσεις ψαρέματος βαρέως τύπου με βάσεις για καλάμια και συστήματα livewell.'
solution_a:
  tagline: Λύση Α
  title: Θαλάσσια διάσωση και<br />εμπορική περιπολία
  subtitle: Υψηλής ταχύτητας, πολλαπλών θαλάμων RIB ασφαλείας για επαγγελματική απόκριση έκτακτης ανάγκης και επιχειρήσεις επιβολής του νόμου.
  badge: Heavy-Duty Series
  description: Τα RIB θαλάσσιας διάσωσης και περιπολίας είναι κατασκευασμένα με ενισχυμένους σωλήνες αέρα Hypalon/PVC υψηλής πυκνότητας που διαθέτουν ανεξάρτητο σχεδιασμό επίπλευσης πολλαπλών θαλάμων. Κάθε σκάφος είναι εξοπλισμένο με αντανακλαστική ταινία επαγγελματικής ποιότητας, γραμμές αρπαγής διάσωσης και βαλβίδες ταχείας φουσκώματος για ετοιμότητα ανάπτυξης. Οι γάστρες από υαλοβάμβακα Deep-V παρέχουν εξαιρετική σταθερότητα σε υψηλές ταχύτητες και σε δύσκολες συνθήκες θάλασσας.
  features:
    - title: Ασφάλεια πολλαπλών θαλάμων
      description: 4–6 ανεξάρτητοι αεροθάλαμοι — κάθε διάτρηση ενός θαλάμου διατηρεί θετική επίπλευση
    - title: Ενισχυμένο ύφασμα σωλήνα
      description: Hypalon CSM 1,2 mm ή PVC 1.680 DTEX με συγκολλημένες ραφές διπλής στρώσης θερμού αέρα
    - title: Επαγγελματικός βαθμός
      description: Ανακλαστική ταινία SOLAS, γραμμές αρπαγής διάσωσης, σχαρές ρυμούλκησης, γραμμή ζωγραφικής ταχείας απελευθέρωσης
    - title: Hull υψηλής ταχύτητας
      description: Deep-V φίμπεργκλας ή γάστρα αλουμινίου με ονομαστική απόδοση 25–45 κόμβων ανάλογα με τη διαμόρφωση
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Υλικό γάστρας
      value: Fiberglass / Αλουμίνιο θαλάσσιας ποιότητας
    - label: Ύφασμα σωλήνα
      value: 1,2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Μέγιστη ταχύτητα
      value: 25–45 κόμβοι
    - label: Ικανότητα
      value: 6-12 άτομα
    - label: Εύρος κινητήρα
      value: 40–200 HP
    - label: Πιστοποίηση
      value: CE / ISO 9001
solution_b:
  tagline: Λύση Β
  title: Ενοικίαση θαλάσσιων σπορ &<br />Εξοπλισμός στόλου θερέτρου
  subtitle: Εξαιρετικά ανθεκτικά, φουσκωτά SUP, καγιάκ και σκάφη χαμηλής συντήρησης κατασκευασμένα για καθημερινή χρήση ενοικίασης σε θέρετρα, κλαμπ και τουριστικές επιχειρήσεις.
  badge: Rental-Grade
  description: Ο ενοικιαζόμενος εξοπλισμός του στόλου μας έχει σχεδιαστεί για την υψηλότερη ανθεκτικότητα και το χαμηλότερο κόστος συντήρησης. Χρησιμοποιούμε ενισχυμένο PVC 1,2 mm με τεχνολογία συγκολλημένης ραφής τριπλής στρώσης θερμού αέρα που αντιστέκεται στην υποβάθμιση της υπεριώδους ακτινοβολίας και τη συχνή ζημιά από σύγκρουση. Η κατασκευή με σταγόνες βελονιές διασφαλίζει ότι οι σανίδες διατηρούν ακαμψία ακόμα και μετά από εκατοντάδες κύκλους ενοικίασης. Όλα τα μοντέλα διαθέτουν ενισχυμένους δακτυλίους D, λωρίδες ράγας ανθεκτικές στην τριβή και βαλβίδες εμπορικής ποιότητας.
  features:
    - title: PVC εμπορικής ποιότητας
      description: Ενισχυμένο PVC 1,2 mm με σταθεροποιητές UV — 3 φορές παχύτερο από υλικά καταναλωτικής ποιότητας
    - title: Συγκολλημένες ραφές θερμού αέρα
      description: Συγκόλληση με σύντηξη τριών στρωμάτων — ισχυρότερη από τη συγκόλληση με κόλλα, ανθίσταται στην αποκόλληση
    - title: Ακαμψία σταγόνας-βελονιάς
      description: 1.680 πυρήνας DTEX με 2 νήματα/τετρ.
    - title: Σχεδιασμός έτοιμος για στόλο
      description: Ενισχυμένοι δακτύλιοι D, εμπορικές βαλβίδες Halkey-Roberts, ιμάντες ράγας ανθεκτικοί στην τριβή
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Υλικό σωλήνα
      value: 1,0–1,2 mm Ενισχυμένο PVC
    - label: Τεχνολογία ραφών
      value: Συγκόλληση με θερμό αέρα τριών στρωμάτων
    - label: Μέγιστη πίεση
      value: 15–20 PSI (μοντέλα σταγόνας βελονιάς)
    - label: Αντοχή στην υπεριώδη ακτινοβολία
      value: 1.000+ ώρες επιταχυνόμενες δοκιμές
    - label: Εγγύηση
      value: 2-5 χρόνια ανάλογα με το μοντέλο
    - label: Συντήρηση
      value: Minimal — ξεπλύνετε και αποθηκεύστε
solution_c:
  tagline: Λύση Γ
  title: Προσφορές σκαφών αναψυχής &<br />πολυτελή σκάφη
  subtitle: Ελαφριά, υψηλής απόδοσης προσφορές RIB σχεδιασμένα για αποθήκευση superyacht και μεταφορά επισκεπτών με πολυτελή εφαρμογή και φινίρισμα.
  badge: Premium Series
  description: Τα τρυφερά RIB για γιοτ μας συνδυάζουν την ελαφριά κατασκευή με την πολυτελή αισθητική. Οι γάστρες από αλουμίνιο ή υαλοβάμβακα Deep-V παρέχουν εξαιρετική ποιότητα κύλισης και εύκολη ανύψωση με δακτύλιο. διατίθεται με γραφικά σωλήνα ταιριάσματος χρώματος, ταπετσαρίες υψηλής ποιότητας και προσαρμοσμένες διατάξεις κονσόλας. Οι συμπαγείς διαστάσεις αποθήκευσης τα καθιστούν ιδανικά για γκαράζ superyacht και αποθήκευση στο κατάστρωμα.
  features:
    - title: Ελαφριά κατασκευή
      description: Οι γάστρες αλουμινίου θαλάσσιας ποιότητας μειώνουν το βάρος κατά 30% σε σχέση με το fiberglass για εύκολη ανύψωση
    - title: Απόδοση Deep-V
      description: Γάστρα 18–22 μοιρών deadrise για ομαλή οδήγηση και εξαιρετική παρακολούθηση
    - title: Πολυτελής εφαρμογή και φινίρισμα
      description: Προσαρμοσμένη ταπετσαρία, σωλήνες που ταιριάζουν στο χρώμα, premium κονσόλα τιμονιού, ανοξείδωτη συσκευασία
    - title: Συμπαγής αποθήκευση
      description: Σχεδιασμένο για γκαράζ superyacht — φουσκωτοί σωλήνες για συμπαγή αποθήκευση
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Τύπος γάστρας
      value: Deep-V Αλουμίνιο / Fiberglass
    - label: Deadrise
      value: 18-22 βαθμοί
    - label: Μέγιστη ταχύτητα
      value: 30–40 κόμβοι
    - label: Ξηρό Βάρος
      value: 120–350 kg (γάστρα αλουμινίου)
    - label: Έτοιμος ο Davit Lift
      value: Ναι — τυπικά σημεία ανύψωσης
    - label: Αποθήκευση
      value: Σωλήνες που φουσκώνουν, στοιβάζονται
