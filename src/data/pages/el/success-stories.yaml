stories:
  - title: Πώς ένα Mediterranean Resort δημιούργησε μια κερδοφόρα επιχείρηση ενοικίασης SUP
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: Παραθαλάσσιο θέρετρο 5 αστέρων — Ελλάδα
    problem: Το θέρετρο χρειαζόταν κορυφαίες υδάτινες δραστηριότητες επισκεπτών για να αυξήσει τις βαθμολογίες ικανοποίησης και να δημιουργήσει μια νέα ροή εσόδων, αλλά δεν διέθετε εξοπλισμό, υποδομή ασφάλειας και τεχνογνωσία του προσωπικού.
    solution: Η Paddle Board Overstock παρέδωσε 50 πίνακες SUP με επώνυμα προϊόντα με χρώματα και λογότυπο θέρετρου, πλήρες σύστημα ασφαλείας που περιλαμβάνει ναυαγοσωστικό σταθμό και γραμμές σημαδούρων και ένα πρόγραμμα εκπαίδευσης προσωπικού 3 ημερών που καλύπτει χειρισμό εξοπλισμού, οδηγίες επισκεπτών και πρωτόκολλα ασφαλείας.
    result:
      - Πάνω από 300 δραστηριότητες επισκεπτών κρατήθηκαν εβδομαδιαία μέσα στον πρώτο μήνα
      - 'Βαθμολογία ικανοποίησης επισκεπτών για τις θαλάσσιες δραστηριότητες: 4,8/5'
      - 'Νέα ετήσια συμπληρωματικά έσοδα: 180 χιλ. $'
      - Μηδενικά περιστατικά ασφαλείας στην πρώτη σεζόν λειτουργίας
      - Κόστος αντικατάστασης εξοπλισμού μειωμένο κατά 40 % σε σχέση με τον προηγούμενο προμηθευτή
    quote:
      text: Το Paddle Board Overstock δεν παρέδωσε απλώς σανίδες - μας βοήθησε να δημιουργήσουμε μια ολοκληρωμένη εμπειρία επισκέπτη. Το πρόγραμμά μας για θαλάσσια σπορ πήγε από το μηδέν στο θέρετρο σε μια σεζόν.
      author: Γενικός Διευθυντής Resort
    cta_text: Φτιάξτε τη λύση για το resort σας
    cta_href: /solutions/resorts
  - title: Πώς μια αυστραλιανή startup έχτισε μια επωνυμία νερού σε 90 ημέρες
    badge: Brand Launch
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    customer: Πρώτη φορά επιχειρηματίας — Αυστραλία
    problem: Ένας λάτρης των εξωτερικών χώρων ήθελε να λανσάρει τη δική του επωνυμία SUP για την αυστραλιανή αγορά, αλλά δεν είχε εμπειρία στην κατασκευή, δεν είχε σχέσεις με προμηθευτές και περιορισμένο κεφάλαιο.
    solution: Το πακέτο εκκίνησης επωνυμίας της Paddle Board Overstock παρείχε συμβουλές επιλογής προϊόντων, προσαρμοσμένο λογότυπο και σχεδιασμό χρώματος, επώνυμες συσκευασίες λιανικής με κολλημένες ετικέτες, τεκμηρίωση πιστοποίησης CE και αποστολή FOB στο Σίδνεϊ.
    result:
      - Πρώτη αποστολή 200 ταμπλό παραδόθηκε σε 75 ημέρες από την πρώτη επαφή
      - Η επωνυμία ξεκίνησε στο Shopify + Amazon AU μέσα σε 2 εβδομάδες από την άφιξη
      - Το αρχικό απόθεμα εξαντλήθηκε σε 45 ημέρες
      - 'Μέσο περιθώριο κέρδους: 55 % στη λιανική τιμή'
      - 'Δεύτερη παραγγελία: 500 μονάδες μέσα σε 60 ημέρες από την έναρξη'
    quote:
      text: Είχα την ιδέα της επωνυμίας αλλά μηδενική γνώση κατασκευής. Το Paddle Board Overstock κυριολεκτικά μου κράτησε το χέρι σε όλη τη διαδικασία — από την επιλογή του σωστού σχεδίου σανίδας μέχρι την αποσυσκευασία της πρώτης μου αποστολής. 90 ημέρες από το όνειρο μέχρι την παράδοση.
      author: Ιδρυτής, αυστραλιανή επωνυμία SUP
    cta_text: Ξεκινήστε την επωνυμία σας
    cta_href: /solutions/entrepreneurs
  - title: Πώς ένα Thai Beach Club κλιμακώθηκε από 10 σε 80 ταμπλό
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Λέσχη θαλάσσιων σπορ — Ταϊλάνδη
    problem: Ένα μικρό παραθαλάσσιο κλαμπ SUP στο Πουκέτ έπρεπε να εξελιχθεί από μια επιχείρηση χόμπι σε μια επαγγελματική επιχείρηση ενοικίασης που εξυπηρετούσε τουρίστες, αλλά δεν μπορούσε να βρει έναν αξιόπιστο προμηθευτή εξοπλισμού με σταθερή ποιότητα και τιμολόγηση.
    solution: Ξεκινώντας με το Paddle Board Overstock's Club Starter Package (10 σανίδες, κουπιά, εξοπλισμός ασφαλείας, επωνυμία), ο σύλλογος αναπτύχθηκε μέσω του προγράμματος Premium Package για 18 μήνες.
    result:
      - Από 10 σε 80 ταμπλό σε 18 μήνες με σταθερή ποιότητα και τιμές
      - Προστέθηκε ενοικίαση καγιάκ και ποδήλατων νερού από τον ίδιο προμηθευτή
      - Το προσαρμοσμένο branding του club αύξησε την αναγνωρισιμότητα της επωνυμίας μεταξύ των τουριστών
      - Κόστη συντήρησης μειωμένα κατά 60 % σε σχέση με τον προηγούμενο οικονομικό εξοπλισμό
      - Πλέον πάνω από 150 ενοικιάσεις ημερησίως στην υψηλή σεζόν
    quote:
      text: Το Club Starter Package ήταν το τέλειο σημείο εισόδου. Καθώς η επιχείρησή μας μεγάλωνε, η Paddle Board Overstock αναπτύχθηκε μαζί μας — ίδια ποιότητα, ίδια τιμολόγηση, χωρίς εκπλήξεις.
      author: Ιδιοκτήτης Λέσχης, Πουκέτ
    cta_text: Ξεκινήστε το πακέτο της λέσχης σας
    cta_href: /solutions/clubs
  - title: Πώς μια αλυσίδα θερέτρου της Καραϊβικής τυποποίησε θαλάσσια σπορ σε 5 ιδιότητες
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    customer: Αλυσίδα θερέτρου - Καραϊβική
    problem: Μια αλυσίδα πολυτελών θέρετρων με 5 ακίνητα χρειαζόταν σταθερή ποιότητα εξοπλισμού θαλάσσιων σπορ και επωνυμία σε όλες τις τοποθεσίες, με κεντρικές προμήθειες και προγραμματισμό εποχιακής αντικατάστασης.
    solution: Η Paddle Board Overstock παρέδωσε έναν στόλο πολλαπλών ακινήτων 300 SUP και 100 καγιάκ με ενοποιημένη επωνυμία, κοινό απόθεμα ανταλλακτικών και ετήσιο πρόγραμμα αντικατάστασης με τιμολόγηση όγκου.
    result:
      - Τυποποιημένη εμπειρία επισκεπτών σε όλες τις 5 ιδιότητες
      - Μείωση κόστους 30 % μέσω ενοποιημένων αγορών και τιμών όγκου
      - Κεντρικοποιημένο απόθεμα ανταλλακτικών μείωσε τις διακοπές λειτουργίας κατά 80 %
      - Το ετήσιο πρόγραμμα ανανέωσης εξοπλισμού εξαφάνισε το κυνηγητό του τέλους της σεζόν
      - Η συμμετοχή των επισκεπτών στα θαλάσσια σπορ αυξήθηκε κατά 45 % σε ετήσια βάση
    cta_text: Σχεδιάστε το πρόγραμμα του resort σας
    cta_href: /solutions/resorts
