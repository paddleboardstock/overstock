content_challenge:
  tagline: Η Πρόκληση
  title: Οι Επιχειρήσεις Διάσωσης Απαιτούν<br />Αδιαπραγμάτευτη Αξιοπιστία
  subtitle: Οι οργανισμοί έρευνας και διάσωσης λειτουργούν με ακραία ευθύνη ασφάλειας — κάθε αστοχία σκάφους έχει απαράδεκτες συνέπειες.
  paragraphs:
    - Στις επιχειρήσεις διάσωσης, το περιθώριο μεταξύ επιτυχίας και αποτυχίας μετράται σε λεπτά. Το σκάφος πρέπει να είναι έτοιμο να ξεκινήσει αμέσως, να λειτουργεί σε δύσκολες συνθήκες και να επιστρέψει με ασφάλεια με τους επιβάτες. Η ευθύνη για την ασφάλεια είναι απόλυτη — μια μηχανική βλάβη κατά τη διάρκεια μιας αποστολής διάσωσης δεν είναι κόστος επισκευής, είναι μια απώλεια ζωής.
    - Τα SAR σκάφη χρειάζονται υψηλή ταχύτητα για να φτάσουν γρήγορα τα θύματα, σε συνδυασμό με εξαιρετική σταθερότητα για ασφαλείς επιχειρήσεις ανάκτησης. Πρέπει να φέρουν εξοπλισμό διάσωσης, ιατρικές προμήθειες και εξοπλισμό επικοινωνίας — συχνά σε περιορισμένο χώρο στο κατάστρωμα. Τα σκάφη που λειτουργούν σε κρατικές υπηρεσίες χρειάζονται επίσης μεγάλη διάρκεια ζωής (10-15+ έτη) για να δικαιολογήσουν τους προϋπολογισμούς των δημοσίων συμβάσεων.
    - Η ορατότητα, τόσο για τον χειριστή όσο και για τις έρευνες, είναι κρίσιμη. Ο σχεδιασμός της κονσόλας πρέπει να παρέχει ορατότητα 360 μοιρών, και το σκάφος πρέπει να είναι ιδιαίτερα ορατό από αεροσκάφη και άλλα σκάφη.
    - Τα RIB διάσωσης της Paddle Board Overstock σχεδιάζονται από την καρίνα και πάνω για αυτές τις απαιτήσεις — με αυτοστραγγιζόμενα καταστρώματα, ενισχυμένα γάστρα, πακέτα πλοήγησης και βάσεις ρυμούλκησης ως στάνταρ στα μοντέλα περιπολίας.
content_solution:
  tagline: Η Λύση μας
  title: RIB Διάσωσης Σχεδιασμένα για Σκοπό
  subtitle: Κάθε σκάφος διάσωσης Paddle Board Overstock σχεδιάζεται ώστε να πληροί ή να υπερβαίνει τα πρότυπα SOLAS και τα εθνικά πρότυπα SAR.
  list:
    - Αυτοστραγγιζόμενο κατάστρωμα — το νερό στραγγίζει αυτόματα για σταθερότητα κατά τις επιχειρήσεις ανάσυρσης
    - Ενισχυμένο γάστρο deep-V — ικανότητα σε τραβιασμένη θάλασσα με προβλέψιμη συμπεριφορά σε ταχύτητα
    - Πλήρες σύνολο φώτων πλοήγησης — λειτουργία μέρα και νύχτα σε όλες τις καιρικές συνθήκες
    - Βάση και σχοινί ρυμούλκησης — έτοιμα για ρυμούλκηση σκαφών ή επιχειρήσεις με έλκηθρα διάσωσης
    - Πλάκες στήριξης εξοπλισμού — ραδιοφώνο, προβολέας αναζήτησης, σειρήνα και ιατροτεχνολογικός εξοπλισμός
    - Πολλαπλές διαμορφώσεις κινητήρων — μονός εξωλέμβιος ή πλεονασμός με δίδυμους κινητήρες
    - Υψηλής ορατότητας χρώματα σωλήνων — πορτοκαλί, κίτρινο ή κόκκινο για μέγιστη ορατότητα
content_segments:
  tagline: Προφίλ διάσωσης
  title: Λύσεις σκαφών αναζήτησης και διάσωσης<br />Ανά τύπο οργανισμού
  subtitle: Διαφορετικοί οργανισμοί διάσωσης λειτουργούν υπό διαφορετικές εντολές, κύκλους προϋπολογισμού και λειτουργικά περιβάλλοντα — από εθελοντικά πληρώματα ακτών έως στόλους της εθνικής ακτοφυλακής. Διαμορφώνουμε κάθε διάσωση RIB ώστε να ταιριάζει με το προφίλ της αποστολής.
  items:
    - title: Λιμενικό Σώμα & Κυβερνητικές SAR Υπηρεσίες
      subtitle: Απόλυτη ευθύνη ασφάλειας — κρίσιμα για την αποστολή πρότυπα στόλου
      description: Οι κρατικοί φορείς SAR φέρουν την υψηλότερη ευθύνη για την ασφάλεια στις θαλάσσιες επιχειρήσεις. Κάθε σκάφος πρέπει να αποδίδει άψογα σε ακραίες συνθήκες — η βλάβη του εξοπλισμού κατά τη διάρκεια μιας αποστολής διάσωσης δεν αποτελεί επιλογή. Οι αποφάσεις προμηθειών καθορίζονται από το συνολικό κόστος ιδιοκτησίας για 10-15 χρόνια διάρκεια ζωής και όχι από την αρχική τιμή. Τα πρακτορεία χρειάζονται σκάφη που επιβιώνουν από χρόνια παράκτιας περιπολίας, πληρούν αυστηρά εθνικά πρότυπα και προσφέρουν σταθερή απόδοση σε όλους τους κατανεμημένους σταθμούς. Η πλήρης τεκμηρίωση συμμόρφωσης και οι πολυετείς συμφωνίες παροχής υπηρεσιών είναι υποχρεωτικές.
      features:
        - Πακέτο τεκμηρίωσης συμμόρφωσης με τα SOLAS και τα εθνικά πρότυπα SAR
        - Κοινότητα ανταλλακτικών σε όλο τον στόλο — μειώστε την πολυπλοκότητα του αποθέματος σε επίπεδο σταθμού
        - Διαμόρφωση διπλού κινητήρα για κρίσιμο πλεονασμό
        - Σχεδιασμός διάρκειας ζωής 10-15 ετών με προγραμματισμένα προγράμματα συντήρησης
        - Δυνατότητα παντός καιρού — ενισχυμένο deep-V κύτος για καταστάσεις θαλασσοταραχής
    - title: Υπηρεσίες Ναυαγοσώστη & Παραλίας Διάσωσης
      subtitle: Λειτουργίες γρήγορης εκτόξευσης, σε ρηχά νερά
      description: Δημοτικές και παραθαλάσσιες υπηρεσίες ναυαγοσωστικής που χρειάζονται σκάφη ταχείας αντίδρασης που μπορούν να εκτοξευθούν μέσα από ζώνες σερφ, να λειτουργήσουν σε ρηχά παράκτια νερά και να φτάσουν σε κολυμβητές ή ταλαιπωρημένα σκάφη μέσα σε λίγα λεπτά. Ο εξοπλισμός πρέπει να είναι αρκετά ελαφρύς για ρυμούλκηση στην παραλία με μικρό όχημα ή χειροκίνητα.
      features:
        - Σκάφος RIB ρηχού βυθίσματος για ζώνη σερφ και λειτουργία στην ξηρά
        - Δυνατότητα εκτόξευσης στην παραλία με λαβή ανύψωσης πλώρης και προστατευτικό καρίνας
        - Ενσωματωμένη πλατφόρμα διάσωσης έλκηθρου ή κολυμβητή διάσωσης
        - Πρότυπο χρωμάτων πορτοκαλί ή κίτρινου σωλήνα υψηλής ορατότητας
    - title: Πυροσβεστικά Τμήματα Διάσωσης
      subtitle: Ενσωμάτωση πυροσβεστικής αντλίας, τοποθέτηση εξοπλισμού, γρήγορη απόκριση
      description: Οι θαλάσσιες μονάδες διάσωσης της πυροσβεστικής ανταποκρίνονται σε πυρκαγιές σε κατασκευές παραθαλάσσιων περιοχών, πυρκαγιές σκαφών και περιστατικά διάσωσης με βάση το νερό. Αυτά τα σκάφη πρέπει να φέρουν πυροσβεστικές αντλίες, οθόνες, σωλήνες αποθήκευσης και αναπνευστικές συσκευές — όλα ενσωματωμένα σε μια σταθερή πλατφόρμα γρήγορης απόκρισης. Τα τμήματα χρησιμοποιούν επίσης αυτά τα πλοία για την αντιμετώπιση των πλημμυρών και τις επιχειρήσεις αμοιβαίας βοήθειας. Οι διατάξεις της κονσόλας πρέπει να διαθέτουν χειριστήρια αντλίας, συστήματα ραδιοφώνου και φωτισμό έκτακτης ανάγκης χωρίς να διακυβεύεται ο χώρος του καταστρώματος για την κίνηση του πληρώματος.
      features:
        - Μόνιτορ πυρκαγιάς με πλώρη με πακέτο ενσωμάτωσης αντλίας
        - Βάση αποκλειστικού εξοπλισμού για πυροσβεστική αντλία, αποθήκευση εύκαμπτων σωλήνων και σετ BA
        - Διάταξη κονσόλας με δυνατότητα διαμόρφωσης για χειριστήρια αντλίας, ραδιόφωνο και φωτισμό έκτακτης ανάγκης
        - Αυτοδιατηρούμενο κατάστρωμα για απορροή και σταθερότητα νερού πυρόσβεσης
        - 'Πακέτο νυχτερινών λειτουργιών: προβολέας, φωτισμός σκηνής, μπλε/κόκκινη φωτεινή γραμμή'
    - title: Ναυτική Αστυνομία & Λιμενική Ασφάλεια
      subtitle: Επιχειρήσεις απαγόρευσης, περιπολίας, επιβίβασης
      description: Οι μονάδες επιβολής του νόμου ναυτικών απαιτούν σκάφη ικανά για καταδίωξη υψηλής ταχύτητας, ύποπτη επιβίβαση σε σκάφος και περιπολία ασφαλείας λιμένα. Αυτά τα σκάφη πρέπει να διαθέτουν ασφαλή αποθήκευση για εξοπλισμό επιβολής και όπλα, ενσωμάτωση επικοινωνίας με την εντολή στην ξηρά και επαρκή χώρο στο κατάστρωμα για τις επιχειρήσεις της ομάδας επιβίβασης. Η ικανότητα νυχτερινών επιχειρήσεων και η προσέγγιση χαμηλού προφίλ είναι απαραίτητες για αποστολές απαγόρευσης.
      features:
        - Δυνατότητα καταδίωξης υψηλής ταχύτητας — πλανάρισμα γάστρας με τελική ταχύτητα 40+ κόμβων
        - Ασφαλίστε το ντουλάπι όπλων και τις θήκες αποθήκευσης εργαλείων επιβολής
        - Ενσωμάτωση κονσόλας για αστυνομικά ραδιόφωνα, MDT και συστήματα επικοινωνίας
        - 'Πακέτο νυχτερινών λειτουργιών: IR σποτ, βάση FLIR, κρυφός φωτισμός'
        - Ενισχυμένη πλατφόρμα επιβίβασης με αντιολισθητική επιφάνεια
        - Μπλε/κόκκινο φωτισμό έκτακτης ανάγκης και σύστημα σειρήνας
    - title: Εθελοντικές SAR & Μη Κερδοσκοπικοί Οργανισμοί
      subtitle: Λειτουργίες παράκτιων και λιμνών που χρηματοδοτούνται από επιχορηγήσεις με βάση την κοινότητα
      description: Ομάδες διάσωσης με βάση την κοινότητα δραστηριοποιούνται σε λίμνες, ποτάμια και παράκτιες περιοχές όπου η κρατική κάλυψη SAR είναι περιορισμένη. Συχνά χρηματοδοτούμενοι από δωρεές ή κρατικές επιχορηγήσεις, αυτοί οι οργανισμοί χρειάζονται μέγιστη ικανότητα ανά δολάριο — ένα αξιόπιστο σκάφος χαμηλής συντήρησης που οι εθελοντές μπορούν να λειτουργήσουν με ασφάλεια με ελάχιστη ειδική εκπαίδευση. Οι κύκλοι προμήθειας επιχορηγήσεων σημαίνουν ότι τα σκάφη πρέπει να πληρούν τις απαιτήσεις συμμόρφωσης ενώ παραμένουν εντός καθορισμένων προϋπολογισμών.
      features:
        - Βελτιστοποιημένη διαμόρφωση μονής εξωλέμβιας για χαμηλότερο κόστος απόκτησης και λειτουργίας
        - PVC κατασκευή για χαμηλότερη συντήρηση και εύκολη επισκευή πεδίου
        - Κονσόλα πολλαπλών λειτουργιών που ελαχιστοποιεί την ηλεκτρονική πολυπλοκότητα για εθελοντές χειριστές
        - Πακέτο τεκμηρίωσης συμμόρφωσης με τις επιχορηγήσεις για αιτήσεις χρηματοδότησης
        - Ελαφρύς σχεδιασμός για εκτόξευση στην παραλία χωρίς ειδικό τρέιλερ ή γερανό
    - title: Πλημμυρική διάσωση και αντιμετώπιση καταστροφών
      subtitle: Εσωτερικές πλημμύρες, ρηχά νερά, περιβάλλοντα γεμάτα συντρίμμια
      description: Η διάσωση από πλημμύρες είναι ένα ξεχωριστό επιχειρησιακό προφίλ — τα σκάφη λειτουργούν σε πλημμυρισμένες αστικές περιοχές, ρεύματα γεμάτα συντρίμμια και εξαιρετικά ρηχά νερά όπου τα βυθισμένα εμπόδια είναι αόρατα. Οι χειριστές χρειάζονται σκάφη που να μπορούν να πλοηγούνται στους πλημμυρισμένους δρόμους, να σπρώχνουν μέσα από συντρίμμια και να εξάγουν θύματα από κτίρια και οχήματα. Η ικανότητα ρηχού βυθίσματος είναι κρίσιμη, όπως και η ικανότητα λειτουργίας σε ρεύμα με κινδύνους εμπλοκής. Αυτά τα σκάφη συχνά αναπτύσσονται από πυροσβεστικές υπηρεσίες, πολιτική άμυνα και ΜΚΟ για την αντιμετώπιση καταστροφών.
      features:
        - Εξαιρετικά ρηχή γάστρα βυθίσματος — λειτουργεί σε 30-50 cm νερού
        - Τόξο που εκτρέπει τα συντρίμμια και ενισχυμένη προστασία σωλήνα για βυθισμένα εμπόδια
        - Αυτοδιατηρούμενο κατάστρωμα για απορροή πλημμυρών και ανάκτηση θυμάτων
        - Πορτοκαλί ή κίτρινοι σωλήνες υψηλής ορατότητας για εναέρια αναγνωριστική ορατότητα
        - Ελαφρύς σχεδιασμός για μεταφορά ελικοπτέρων και οδική ανάπτυξη
        - Ενισχυμένα σημεία ανύψωσης για εργασίες διάσωσης ανυψωτικών και σχοινιών
cta:
  title: Συζητήστε τις απαιτήσεις διάσωσής σας
  subtitle: Η ομάδα μας έχει προμηθεύσει οργανισμούς διάσωσης παγκοσμίως. Κατανοούμε τις απαιτήσεις δημοσίων προμηθειών και μπορούμε να παρέχουμε τεκμηρίωση συμμόρφωσης.
  actions:
    - variant: primary
      text: Μιλήστε με την ομάδα SAR μας
      href: /contact
    - text: Δείτε μοντέλα περιπολίας RIB
      href: /products

