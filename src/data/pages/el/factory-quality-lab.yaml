hero:
  tagline: Εργαστήριο Ελέγχου Ποιότητας
  title: Εργαστήριο Δοκιμών & Διασφάλιση Ποιότητας
  subtitle: Ανεξάρτητο εργαστήριο ποιότητας με διαδικασίες ISO 9001 — κάθε μονάδα δοκιμάζεται πριν την αποστολή

intro: Η Aquafarer διατηρεί ένα ειδικό εργαστήριο ελέγχου ποιότητας που λειτουργεί ανεξάρτητα από την παραγωγή. Κάθε παρτίδα πρώτων υλών και κάθε ολοκληρωμένο σκάφος περνά από τεκμηριωμένα πρωτόκολλα επιθεώρησης πριν την αποδέσμευση. Η ομάδα QC μας αναφέρει απευθείας στη διοίκηση, εξασφαλίζοντας αμερόληπτες αποφάσεις ποιότητας.

highlights:
  - value: 100%
    label: Μονάδες δοκιμασμένες σε πίεση
    detail: Κάθε θάλαμος, κάθε σκάφος
  - value: 48 h
    label: Διάρκεια δοκιμής διατήρησης αέρα
    detail: Σε 1,25× ονομαστική πίεση
  - value: '&lt;5%'
    label: Μέγιστη επιτρεπόμενη πτώση πίεσης
    detail: Κατά τη διάρκεια 24ωρης περιόδου συγκράτησης
  - value: AQL 2.5
    label: Κατώφλι σημαντικών ελαττωμάτων
    detail: Σύμφωνα με δειγματοληψία ISO 2859

test_procedures:
  - title: Έλεγχος Πρώτων Υλών
    description: Κάθε εισερχόμενη παρτίδα PVC, Hypalon, υφάσματος drop-stitch και εξαρτημάτων ελέγχεται πριν την αποδοχή. Επαληθεύονται η αντοχή σε εφελκυσμό (ASTM D751), η αντοχή σε σχίσιμο (ISO 4674) και η αντοχή στην UV ακτινοβολία. Τα μη συμμορφούμενα υλικά τίθενται σε καραντίνα και επιστρέφονται.
    standards:
      - ASTM D751 (εφελκυσμός)
      - ISO 4674 (σχίσιμο)
      - ISO 4892 (UV)
  - title: Σημεία Ελέγχου QC στη Διαδικασία
    description: Οι χειριστές παραγωγής εκτελούν αυτοέλεγχο σε κάθε στάδιο. Οι ελεγκτές QC διενεργούν τυχαία δειγματοληψία καθ' όλη τη διάρκεια της βάρδιας. Δοκιμές αποκόλλησης συγκολλήσεων εκτελούνται κάθε 50 μονάδες. Έλεγχοι διαστάσεων γίνονται σε κάθε 20ό πάνελ.
    standards:
      - ASTM D751 (αποκόλληση)
      - Εσωτερική λίστα ελέγχου 100 σημείων
      - Δειγματοληψία ISO 2859
  - title: Δοκιμή Διατήρησης Αέρα 48 Ωρών
    description: Κάθε θάλαμος σωλήνα φουσκώνει στο 125% της ονομαστικής πίεσης και διατηρείται για 48 ώρες. Οι αισθητήρες πίεσης καταγράφουν συνεχώς με αντιστάθμιση θερμοκρασίας. Κάθε θάλαμος με πτώση πίεσης άνω του 5% ενεργοποιεί αυτόματη επανεπιθεώρηση της παρτίδας.
    standards:
      - ISO 6185
      - CE 2013/53/EU
  - title: Δοκιμές Φορτίου & Ισορροπίας
    description: Τα ολοκληρωμένα σκάφη δοκιμάζονται στη μέγιστη ονομαστική χωρητικότητα για ευστάθεια, ελεύθερο ύψος γάστρας και χειρισμό. Κάθε σκάφος υποβάλλεται σε δοκιμές στο νερό πριν την έγκριση της τελικής επιθεώρησης.
    standards:
      - ISO 12217
      - CE 2013/53/EU

equipment:
  - name: Μηχανή Καθολικών Δοκιμών (εφελκυσμός)
    spec: 5 kN, σύμφωνα με το ASTM D751
  - name: Δοκιμαστής Πτώσης Πίεσης
    spec: Πολλαπλών καναλιών, 0–50 psi, καταγραφή δεδομένων
  - name: Θάλαμος Γήρανσης UV
    spec: ISO 4892, κύκλοι 1,000 h
  - name: Μετρητής Πάχους (ψηφιακός)
    spec: Ανάλυση 0,01 mm
  - name: Δοκιμαστής Αποκόλλησης (συγκόλληση)
    spec: Με κινητήρα, ικανότητα 50 N
  - name: Θάλαμος Θερμοκρασίας
    spec: "-40 °C έως +100 °C"
  - name: Δεξαμενή Ανίχνευσης Διαρροών
    spec: 6 m × 2 m, με φωτισμό
