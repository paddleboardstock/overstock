hero_text:
  tagline: Πόροι
  title: 'Κέντρο Λήψεων & Οδηγοί Αγοραστών'
  subtitle: 'Αποκτήστε πρόσβαση σε καταλόγους προϊόντων, οδηγούς OEM, λίστες ελέγχου αγοραστών και τεχνική τεκμηρίωση για να λαμβάνετε τεκμηριωμένες αγοραστικές αποφάσεις.'
features3_downloads:
  tagline: Λήψεις
  title: 'Τεκμηρίωση προϊόντων<br />και πόροι για αγοραστές'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Κατάλογος ναυτικών προϊόντων 2026'
      description: 'Πλήρης γκάμα προϊόντων που περιλαμβάνει σκάφη RIB, φουσκωτά σκάφη, ταμπλό SUP, καγιάκ και αξεσουάρ. Προδιαγραφές, διαμορφώσεις και επιλογές. Μορφή PDF.'
      icon: tabler:file-text
    - title: 'Οδηγός OEM κατασκευής'
      description: 'Όλα όσα πρέπει να γνωρίζετε για τις συνεργασίες OEM/ODM: επισκόπηση διαδικασίας, ελάχιστες ποσότητες παραγγελίας, επιλογές προσαρμογής, έλεγχος ποιότητας και αποστολή.'
      icon: tabler:building-factory
    - title: 'Οδηγός αγοράς σκαφών RIB'
      description: 'Πώς να επιλέξετε το σωστό RIB: υλικά γάστρας, υλικά σωλήνων, επιλογή κινητήρα, ζητήματα μεγέθους και επιλογές διαμόρφωσης για διαφορετικές εφαρμογές.'
      icon: tabler:file-description
    - title: 'Λίστα ελέγχου προμηθευτή SUP'
      description: 'Σημαντικοί παράγοντες κατά την επιλογή κατασκευαστή ταμπλό SUP: δείκτες ποιότητας, απαιτήσεις πιστοποίησης, ζητήματα MOQ και τι να αναζητάτε σε έλεγχο εργοστασίου.'
      icon: tabler:clipboard-check
    - title: 'Οδηγός υλικών φουσκωτών σκαφών'
      description: 'PVC ή Hypalon: σύγκριση αντοχής, αντίστασης στην UV ακτινοβολία, διάρκειας ζωής, επιλογών επισκευής και κόστους για διαφορετικές θαλάσσιες εφαρμογές.'
      icon: tabler:files
    - title: 'Πρότυπο περιγραφής απαιτήσεων για εξατομικευμένη κατασκευή'
      description: 'Κατεβάστε το πρότυπο περιγραφής προϊόντος μας. Συμπληρώστε τις απαιτήσεις σας και επιστρέψτε το σε εμάς για προσφορά εντός της ίδιας εβδομάδας και αξιολόγηση σκοπιμότητας.'
      icon: tabler:template
faqs:
  title: Συχνές ερωτήσεις
  subtitle: 'Συχνές ερωτήσεις σχετικά με τα προϊόντα μας, τη διαδικασία παραγωγής και το μοντέλο συνεργασίας.'
  columns: 2
  items:
    - title: Ποια είναι η ελάχιστη ποσότητα παραγγελίας;
      description: 'Το MOQ διαφέρει ανά κατηγορία προϊόντος. Τα σκάφη RIB ξεκινούν συνήθως από 10 μονάδες ανά μοντέλο. Τα ταμπλό SUP από 50 μονάδες. Επικοινωνήστε με την ομάδα πωλήσεών μας για πληροφορίες MOQ ανά προϊόν.'
      icon: tabler:help-circle
    - title: Μπορώ να λάβω δείγματα πριν από την τοποθέτηση παραγγελίας;
      description: 'Ναι. Η Aquafarer παρέχει παραγωγή δειγμάτων για αξιολόγηση πριν από τη μαζική παραγωγή. Το κόστος των δειγμάτων είναι διαπραγματεύσιμο και συχνά πιστώνεται στην πρώτη παραγγελία παραγωγής.'
      icon: tabler:package
    - title: Ποιοι όροι πληρωμής είναι διαθέσιμοι;
      description: 'Πρότυποι όροι: 30% προκαταβολή με την παραγγελία, 70% πριν την αποστολή. Όροι LC διαθέσιμοι για εγκεκριμένους πελάτες. Επικοινωνήστε με την οικονομική μας ομάδα για να συζητήσετε ρυθμίσεις.'
      icon: tabler:currency-dollar
    - title: Πόσο διαρκεί η παραγωγή;
      description: 'Τυπικοί χρόνοι παράδοσης: σκάφη RIB 30-45 ημέρες, ταμπλό SUP 20-30 ημέρες, φουσκωτά σκάφη 25-35 ημέρες. Η εξατομικευμένη ανάπτυξη προσθέτει 15-30 ημέρες για δημιουργία πρωτοτύπων.'
      icon: tabler:calendar-clock
    - title: Ποιες πιστοποιήσεις έχουν τα προϊόντα σας;
      description: 'Πιστοποίηση CE για τις αγορές της ΕΕ, κατασκευή εγκεκριμένη από την ακτοφυλακή των ΗΠΑ, σύστημα ποιότητας ISO, συμμόρφωση BSCI και συμμόρφωση υλικών REACH.'
      icon: tabler:certificate
    - title: Παρέχετε εξατομικευμένη συσκευασία και εταιρική ταυτότητα;
      description: 'Ναι. Παρέχουμε εξατομικευμένη συσκευασία με το λογότυπό σας, τα χρώματά σας και την εταιρική σας ταυτότητα. Το MOQ για εξατομικευμένη συσκευασία εξαρτάται από την κατηγορία προϊόντος.'
      icon: tabler:color-swatch
cta:
  title: 'Χρειάζεστε βοήθεια για να βρείτε τον κατάλληλο πόρο;'
  subtitle: 'Επικοινωνήστε με την ομάδα μας για εξατομικευμένη καθοδήγηση σχετικά με την επιλογή προϊόντων, τις συνεργασίες OEM ή τις τεχνικές προδιαγραφές.'
  actions:
    - variant: primary
      text: Επικοινωνήστε με την ομάδα μας
      href: /contact
