hero:
  tagline: Παραγωγική ικανότητα
  title: Παραγωγική Ικανότητα και Ετήσια Παραγωγή
  subtitle: Εγκατάσταση 12.000 m² που παράγει 15.000 σκάφη ετησίως με περιθώριο κλιμάκωσης

intro: Η Aquafarer διαχειρίζεται μία από τις μεγαλύτερες εξειδικευμένες μονάδες παραγωγής φουσκωτών σκαφών στο Qingdao της Κίνας. Το εργοστάσιό μας 12.000 m² είναι οργανωμένο σε έξι εξειδικευμένα εργαστήρια που λειτουργούν παράλληλα, δίνοντάς μας δυνατότητα παραγωγής 15.000 σκαφών ετησίως στις γραμμές SUP, καγιάκ, dinghy, RIB και εξοπλισμού ασφαλείας.

highlights:
  - value: 12,000 m²
    label: Συνολική παραγωγική επιφάνεια
    detail: Σε 6 εξειδικευμένα εργαστήρια
  - value: 15,000
    label: Σκάφη που παράγονται ετησίως
    detail: SUP, καγιάκ, RIB, dinghy, εξοπλισμός ασφαλείας
  - value: 200-300
    label: Εξειδικευμένο προσωπικό
    detail: 25+ μηχανικοί, 2 βάρδιες/ημέρα
  - value: 50+
    label: Χώρες εξαγωγής
    detail: ΕΕ, ΗΠΑ, Αυστραλία, Μέση Ανατολή, Ασία
  - value: 30–45
    label: Τυπικός χρόνος παράδοσης (ημέρες)
    detail: Από επιβεβαίωση PO έως FOB
  - value: 10+
    label: Χρόνια εμπειρίας εξαγωγών
    detail: Από το 2012

workshops:
  - title: Παραγωγή Σανίδων SUP
    description: '4 παράλληλες γραμμές συναρμολόγησης για φουσκωτές σανίδες SUP. Κάθε γραμμή μπορεί να παράγει 50–80 σανίδες ανά βάρδια. Σταθμοί ψηφιακής εκτύπωσης και εκτύπωσης μετάξιου λειτουργούν ταυτόχρονα. Ετήσια δυνατότητα SUP: 8.000+ σανίδες.'
    output: 8.000+ SUP/έτος
  - title: Παραγωγή σκαφών RIB
    description: 'Εξειδικευμένο εργαστήριο σκαφών από fiberglass με 6 σταθμούς καλουπιών για σκάφη RIB έως 7,6 m. Η περιοχή συγκόλλησης και συναρμολόγησης σωλήνων εξυπηρετεί 3–5 RIB ταυτόχρονα. Ετήσια δυνατότητα RIB: 2.000+ σκάφη.'
    output: 2.000+ RIB/έτος
  - title: Φουσκωτό Σκάφος & Dinghy
    description: 'Πολυχρηστικές γραμμές παραγωγής για φουσκωτά σκάφη, καγιάκ και dinghy. Σταθμοί συγκόλλησης θερμού αέρα, πρέσες διηλεκτρικές RF και σταθμοί συναρμολόγησης επαναρυθμίζονται με βάση το μείγμα παραγγελιών. Ετήσια δυνατότητα: 5.000+ μονάδες.'
    output: 5.000+ μονάδες/έτος
  - title: Εξοπλισμός ασφαλείας
    description: 'Ξεχωριστή περιοχή παραγωγής καθαρού δωματίου για σωσίβια και εξοπλισμό ασφαλείας. Εξειδικευμένο ράψιμο, εισαγωγή αφρού και σταθμοί δοκιμών. Ετήσια δυνατότητα σωσιβίων: 50.000+ μονάδες.'
    output: '50.000+ σωσίβια/έτος'

oem_capacity:
  moq: 'SUP: 5–10 μονάδες | RIB: 2–5 μονάδες | Καγιάκ/Dinghy: 10–20 μονάδες | Προσαρμοσμένο καλούπι: 200+ μονάδες'
  lead_time: 'Τυπικά 30–45 ημέρες. Δείγμα 15–20 ημέρες. Επείγουσα παραγωγή διαθέσιμη.'
  payment: 'T/T 30% προκαταβολή + 70% πριν την αποστολή. Γίνονται δεκτά L/C, Western Union.'
