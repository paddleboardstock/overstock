content_customization:
  tagline: Τι μπορεί να προσαρμοστεί
  title: Προσαρμογή RIB<br />Επιλογές
  subtitle: Κάθε στοιχείο ενός σκάφους RIB μπορεί να προσαρμοστεί στις απαιτήσεις της εφαρμογής, της αγοράς και της επωνυμίας σας.
  items:
    - title: Γάστρα & δομή
      description: Μήκος κύτους (2,5–8,5 m), υλικό γάστρας (GRP fiberglass ή θαλάσσιο αλουμίνιο), χρώμα γάστρας (gelcoat ή βαμμένο), προφίλ καρίνας (βαθύ V, μέτριο-V, επίπεδο), τύπος τραβέρσας (κλειστός τραβέρσα με βραχίονα ή φρεάτιο) και δομική ενίσχυση για εμπορικές απαιτήσεις φορτίου.
      icon: tabler:sailboat
    - title: Σωλήνας & Κολάρο
      description: Υλικό σωλήνα (0,9–1,2 mm PVC ή 1,4–1,7 mm Hypalon/CSM), διάμετρος σωλήνα (40–55 cm), αριθμός θαλάμων (3–7), τύπος βαλβίδας (Halkey-Roberts, Leafield D7 ή Boston), χρώμα σωλήνα (τυπικό ή προσαρμοσμένο) και διαμόρφωση κώνου/κωνικού κολάρου.
      icon: tabler:circle
    - title: Διάταξη Deck & Console
      description: Κεντρική κονσόλα, πλαϊνή κονσόλα ή τιμόνι. Διάταξη καθισμάτων (καθίσματα αναβάτη, παγκάκια, ενισχυτικά καθίσματα). Κάλυμμα καταστρώματος (αφρός EVA με όψη τικ, αντιολισθητική βαφή ή γυμνό GRP). Σημεία στερέωσης εξοπλισμού, ράγες λαβής και θέσεις δακτυλίου D.
      icon: tabler:layout-dashboard
    - title: Ηλεκτρολογικά & Πλοήγηση
      description: Φώτα πλοήγησης (LED), σύστημα αντλίας υδροσυλλεκτών, διαχείριση μπαταρίας, εγκατάσταση ραδιοφώνου VHF, τοποθέτηση GPS/χαρτογραφητή, θύρες φόρτισης USB και διαμόρφωση πίνακα διακοπτών.
      icon: tabler:bolt
    - title: Branding & Γραφικά
      description: Γραφικά κύτους και σωλήνων (εκτύπωση οθόνης, μεταφορά θερμότητας, ψηφιακή εκτύπωση UV), τοποθέτηση λογότυπων, προσαρμοσμένοι συνδυασμοί χρωμάτων, σημάνσεις αναγνώρισης και προσαρμοσμένη τεκμηρίωση κατόχου με την επωνυμία σας.
      icon: tabler:palette
    - title: Ασφάλεια & Συμμόρφωση
      description: Βαθμολογία κατηγορίας σχεδιασμού (A/B/C/D ανά RCD), σύστημα πυρόσβεσης, προδιαγραφές συστήματος καυσίμου (φορητή δεξαμενή, σταθερή δεξαμενή, κάτω από το κατάστρωμα) και πακέτο τεκμηρίωσης συμμόρφωσης για την αγορά-στόχο σας.
      icon: tabler:shield
content_applications:
  tagline: Διαμορφώσεις εφαρμογής
  title: Ρυθμίσεις RIB<br />Κατά εφαρμογή
  subtitle: Οι διαφορετικές αποστολές απαιτούν διαφορετικές διαμορφώσεις. Ακολουθούν αποδεδειγμένες ρυθμίσεις για τις πιο κοινές εφαρμογές RIB.
  items:
    - title: Διάσωσης & Περιπολίας
      description: Σκάφος Deep-V, σωλήνες Hypalon, κατάστρωμα αυτόματης αποθήκευσης, ενισχυτικά καθίσματα, χειρολαβές, φώτα πλοήγησης και δακτύλιοι D βαρέως τύπου. Σχεδιασμός RCD Κατηγορία Β ή Γ. Σύστημα καυσίμου ανθεκτικό στη φωτιά και ηλεκτρικά εμπορικής ποιότητας.
      icon: tabler:lifebuoy
    - title: Υποστήριξη κατάδυσης
      description: Ευρεία δοκός, πίσω σκάλα επιβίβασης, θέσεις ράφι ρεζερβουάρ, επιπλέον δακτύλιοι D, βάση σημαίας κατάδυσης, ενισχυμένος τραβέρσα για δύο εξωλέμβιες και αντιολισθητικό κάλυμμα EVA σε όλο το κατάστρωμα.
      icon: tabler:mask
    - title: Τουριστική & Εμπορική
      description: Πιστοποιημένη διάταξη επιβατών με καθίσματα σε πάγκο, σκίαστρο/Bimini, λαβές στήριξης, στεγνό αποθηκευτικό χώρο και σύστημα διπλής μπαταρίας. RCD Κατηγορία Γ. Σχεδιασμένο για επιχειρήσεις θέρετρου και ναυλωμένων στόλων.
      icon: tabler:beach
    - title: Αλιεία
      description: Διάταξη ανοιχτού καταστρώματος, θέσεις συγκράτησης ράβδων, πηγάδι ζωντανού δολώματος, βάση εύρεσης ψαριών, βάση κινητήρα συρτής, ενισχυμένος τραβέρσα και φορητό σύστημα καυσίμου. Επιλογές κεντρικής κονσόλας ή πλευρικής κονσόλας.
      icon: tabler:fish
    - title: Αναψυχή & Yacht Tender
      description: Ελαφρύ κύτος, σωλήνες από PVC, άνετο κάθισμα, τηλεσκοπικό χειριστήριο ή συμπαγής κονσόλα, σημεία ανύψωσης για ραβδώσεις και αφαιρούμενη δεξαμενή καυσίμου. RCD Κατηγορία Γ ή Δ.
      icon: tabler:sailboat
    - title: Επαγγελματικό σκάφος εργασίας
      description: Επιλογή γάστρας από αλουμίνιο, ενίσχυση βαρέως τύπου, υδραυλικό σύστημα διεύθυνσης, ηλεκτρικά εμπορικής ποιότητας, αψίδα ραντάρ και σημεία ενσωμάτωσης εξοπλισμού ειδικά για την αποστολή. Προσαρμοσμένη συμμόρφωση ανά έργο.
      icon: tabler:anchor
process_steps:
  title: Διαδικασία ανάπτυξης RIB OEM/ODM 7 βημάτων
  subtitle: Από σύντομο έργο έως μετά την πώληση — μια καθορισμένη ροή εργασίας με σαφή ορόσημα και παραδοτέα
  steps:
    - number: '01'
      title: Σύνοψη & Απαιτήσεις Έργου
      description: Καθορίστε την εφαρμογή-στόχο, το μέγεθος του κύτους, το υλικό σωλήνα, τις απαιτήσεις συμμόρφωσης και τις ανάγκες επωνυμίας. Αξιολογούμε τη σκοπιμότητα και επιβεβαιώνουμε το μοντέλο συνεργασίας (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3-5 ημέρες
    - number: '02'
      title: Τεχνική Αναθεώρηση & Σκοπιμότητα
      description: Η ομάδα μηχανικών εξετάζει τη δομική σκοπιμότητα, τη σταθερότητα και τους υπολογισμούς άνωσης, τη διαδρομή συμμόρφωσης και τη διαθεσιμότητα υλικών. Εντοπίζουμε υπάρχοντα καλούπια ή προσαρμοσμένες απαιτήσεις καλουπιών.
      timeline: 5-7 ημέρες
    - number: '03'
      title: Πρόταση & Προσφορά
      description: Λάβετε μια λεπτομερή πρόταση που περιλαμβάνει προδιαγραφές, τρισδιάστατες αποδόσεις ή σχέδια GA, εύρος συμμόρφωσης, χρονοδιάγραμμα και τιμολόγηση μονάδας με βάση τις βαθμίδες όγκου και το MOQ.
      timeline: 5-7 ημέρες
    - number: '04'
      title: Επιβεβαίωση Σχεδιασμού & Δειγματοληψία
      description: Εγκρίνετε το τελικό GA, τη διάταξη του καταστρώματος και τη διαμόρφωση σωλήνα. Παράγουμε ένα δείγμα προπαραγωγής με τα χρώματα της επωνυμίας σας, το λογότυπο και τα καθορισμένα υλικά για τη φυσική σας επιθεώρηση.
      timeline: 15-20 ημέρες
    - number: '05'
      title: Δείγμα έγκρισης & πρωτοκόλλου QC
      description: 'Επιθεωρήστε και εγκρίνετε το δείγμα. Καθορίστε το πρωτόκολλο QC παραγωγής: δοκιμή πίεσης (1,25x / 24–48h), έλεγχοι διαστάσεων και λίστα ελέγχου τεκμηρίωσης συμμόρφωσης ανά κύτος.'
      timeline: 3-5 ημέρες
    - number: '06'
      title: Μαζική Παραγωγή & Ποιοτικός Έλεγχος
      description: Πλήρης εκτέλεση παραγωγής με λίστα ελέγχου QC 100 σημείων ανά μονάδα. Επιθεωρήσεις κατά τη διαδικασία, δοκιμή πίεσης και ιχνηλασιμότητα σε σειριακό επίπεδο. Τεκμηρίωση CE/ISO που προετοιμάστηκε παράλληλα.
      timeline: 30-45 ημέρες
    - number: '07'
      title: Συσκευασία, αποστολή & μεταπώληση
      description: Προσαρμοσμένη συσκευασία (τυπική, έτοιμη για λιανική πώληση ή παλετοποιημένη), τεκμηρίωση εξαγωγής, φόρτωση εμπορευματοκιβωτίων και υλικοτεχνική υποστήριξη. Περιλαμβάνονται κιτ ανταλλακτικών και τεκμηρίωση συντήρησης.
      timeline: 7-14 ημέρες
certifications:
  title: Συμμόρφωση & Πιστοποιήσεις για σκάφη RIB
  subtitle: Κάθε προσαρμοσμένη παραγγελία RIB αποστέλλεται με τεκμηρίωση συμμόρφωσης για το συγκεκριμένο μοντέλο
  items:
    - name: CE 2013/53/ΕΕ
      description: Συμμόρφωση RCD ανά μοντέλο και κατηγορία σχεδίασης — Περιλαμβάνεται DoC, πλάκα κατασκευής, εγχειρίδιο κατόχου
      badge: CE
    - name: του προτύπου ISO 9001:2015
      description: Σύστημα διαχείρισης ποιότητας πιστοποιημένο από την SGS που καλύπτει το σχεδιασμό, την παραγωγή και τη διανομή
      badge: ISO
    - name: EN ISO 6185
      description: Πρότυπο κατασκευής φουσκωτών σκαφών — σταθερότητα, άνωση και ανάκτηση από τον άνθρωπο στη θάλασσα
      badge: 6185
    - name: EN ISO 14945:2021
      description: Πρότυπο πινακίδας κατασκευαστή — πληροφορίες αναγνώρισης και χωρητικότητας με μόνιμη σήμανση
      badge: 14945
    - name: BSCI
      description: Έλεγχος κοινωνικής συμμόρφωσης για την ηθική παραγωγή — απαιτείται από τους λιανοπωλητές της ΕΕ
      badge: BSCI
    - name: ΕΚΤΑΣΗ
      description: Συμμόρφωση της ΕΕ για τη χημική ασφάλεια για PVC, Hypalon, κόλλες και επιστρώσεις
      badge: REACH
faq:
  title: RIB OEM/ODM — Συχνές ερωτήσεις
  questions:
    - q: Ποια είναι η διαφορά μεταξύ OEM και ODM για σκάφη RIB;
      a: 'OEM (Original Equipment Manufacturing): παρέχετε λεπτομερείς προδιαγραφές και κατασκευάζουμε το σχέδιό σας. ODM (Original Design Manufacturing): επιλέγετε μια δοκιμασμένη πλατφόρμα Paddle Board Overstock RIB και την προσαρμόζουμε με τα χαρακτηριστικά και την επωνυμία που επιθυμείτε. Το ODM είναι ταχύτερο και χαμηλότερο κόστος. Το OEM προσφέρει μέγιστο έλεγχο σχεδίασης.'
    - q: Μπορώ να προσαρμόσω το σχήμα και το μέγεθος της γάστρας RIB;
      a: Ναί. Προσφέρουμε ημι-προσαρμοσμένες τροποποιήσεις σε υπάρχοντα καλούπια γάστρας (διαφορετικές διατάξεις καταστρώματος, διαμορφώσεις σωλήνων) και πλήρη προσαρμοσμένη ανάπτυξη γάστρας με νέα καλούπια με μηχανική CNC. Τα ημι-προσαρμοσμένα έργα μπορούν να ξεκινήσουν από 2-5 μονάδες. Το πλήρες έθιμο απαιτεί συνήθως υψηλότερες δεσμεύσεις.
    - q: Ποια υλικά σωλήνων είναι διαθέσιμα για προσαρμοσμένα RIB;
      a: Προσφέρουμε PVC 0,9-1,2 mm για ψυχαγωγική και ελαφριά εμπορική χρήση και 1,4-1,7 mm Hypalon/CSM για επαγγελματικές, σωστικές και εμπορικές εφαρμογές που απαιτούν ανώτερη αντοχή στην υπεριώδη ακτινοβολία και το όζον (10-15 χρόνια διάρκεια ζωής έναντι 5-8 χρόνια για το PVC).
    - q: Μπορείτε να διαμορφώσετε τα RIB για συγκεκριμένες εφαρμογές όπως διάσωση, κατάδυση ή ψάρεμα;
      a: Ναί. Διατηρούμε αποδεδειγμένα πρότυπα διαμόρφωσης για εφαρμογές διάσωσης/περιπολίας, υποστήριξης καταδύσεων, τουρισμού/ναύλωσης, ψαρέματος, διαγωνισμού γιοτ και επαγγελματικών σκαφών εργασίας. Κάθε πρότυπο περιλαμβάνει προτεινόμενο τύπο γάστρας, υλικό σωλήνα, διάταξη καταστρώματος και εξοπλισμό — τον οποίο στη συνέχεια προσαρμόζουμε στις ακριβείς απαιτήσεις σας.
    - q: Ποιες πληροφορίες χρειάζεστε για μια προσφορά RIB OEM/ODM;
      a: Εφαρμογή στόχος, επιθυμητό μήκος κύτους, προτίμηση υλικού σωλήνα (PVC ή Hypalon), κατά προσέγγιση ποσότητα και χρονοδιάγραμμα παράδοσης, απαιτήσεις συμμόρφωσης με την αγορά-στόχο και τυχόν προϊόντα ή προδιαγραφές αναφοράς. Όσο περισσότερες λεπτομέρειες παρέχετε, τόσο πιο γρήγορη και ακριβής είναι η προσφορά μας.
    - q: Τι είναι το MOQ για προσαρμοσμένα σκάφη RIB;
      a: Για τα υπάρχοντα καλούπια γάστρας με τυπικές τροποποιήσεις, το MOQ ξεκινά από 2-5 μονάδες ανά σχέδιο. Για προσαρμοσμένα καλούπια και πλήρη προσαρμοσμένη ανάπτυξη, το MOQ εξαρτάται από την πολυπλοκότητα του έργου — συνήθως 10-20 μονάδες για ημι-προσαρμοσμένο και 30+ για πλήρη προσαρμογή με νέα εργαλεία.
    - q: Σε ποιον ανήκει τα προσαρμοσμένα καλούπια και σχέδια;
      a: Τα καλούπια που αναπτύχθηκαν χρησιμοποιώντας σχέδια βάσης Paddle Board Overstock παραμένουν ιδιοκτησία της Paddle Board Overstock. Τα πλήρως προσαρμοσμένα καλούπια που έχουν παραγγελθεί και πληρωθεί από τον πελάτη μπορούν να ανατεθούν στην ιδιοκτησία του πελάτη ανά όρους σύμβασης. Όλοι οι όροι ιδιοκτησίας καλουπιού τεκμηριώνονται πριν από την έναρξη του έργου.
    - q: Πώς συσκευάζονται προσαρμοσμένα RIB για εξαγωγή;
      a: 'Στάνταρ: προσαρμοσμένη βάση + ελαστικό περιτύλιγμα για φόρτωση κοντέινερ. Premium: συσκευασία έτοιμη για λιανική πώληση, συσκευασία κενού αέρος ή παλετοποιημένη. Προσφέρουμε αποστολή FOB Qingdao, CIF και DDP. Περιλαμβάνονται πλήρη έγγραφα εξαγωγής και εκτελωνισμός.'
