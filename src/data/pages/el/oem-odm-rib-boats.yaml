content_service_modules:
  tagline: Ενότητες υπηρεσιών
  title: OEM/ODM Υπηρεσία<br />Ενότητες
  subtitle: Κάθε έργο συνδυάζει τις κατάλληλες ενότητες υπηρεσιών. Δεν χρειάζεται κάθε έργο κάθε ενότητα — καλύπτουμε μόνο ό,τι απαιτεί το έργο σας.
  items:
    - title: Μηχανική Ανασκόπηση & Σκοπιμότητα
      description: 'Αξιολόγηση πλατφόρμας κύτους, έλεγχος δομικής σκοπιμότητας, επαλήθευση ευστάθειας και άνωσης, αναγνώριση διαδρομής συμμόρφωσης και επιβεβαίωση διαθεσιμότητας υλικού. Αποτέλεσμα: έκθεση σκοπιμότητας με σύσταση go/no-go.'
      icon: tabler:math-function
    - title: Σχεδιασμός & Διαμόρφωση
      description: 'Σχέδιο GA, διάταξη καταστρώματος, διαμόρφωση σωλήνα, θέσεις κονσόλας και καθίσματα, σχέδιο τοποθέτησης εξοπλισμού και επιλογή χρώματος/υλικού. Έξοδος: εγκεκριμένη προδιαγραφή GA και διαμόρφωσης.'
      icon: tabler:ruler
    - title: Δείγμα & πρωτότυπο
      description: Δείγμα προπαραγωγής με εγκεκριμένα χρώματα, λογότυπο και καθορισμένα υλικά για φυσική επιθεώρηση. Περιλαμβάνει δείγμα πρωτοκόλλου έγκρισης, λίστα ελέγχου επιθεώρησης και διαδικασία αιτήματος αλλαγής.
      icon: tabler:3d-cube-sphere
    - title: Παραγωγή & έλεγχος ποιότητας
      description: Μαζική παραγωγή με λίστα ελέγχου QC 100 σημείων ανά μονάδα, επιθεωρήσεις κατά τη διαδικασία, δοκιμή πίεσης (1,25x / 24-48h) και ιχνηλασιμότητα σε σειριακό επίπεδο. CE/ISO τεκμηρίωση που προετοιμάστηκε παράλληλα.
      icon: tabler:clipboard-check
    - title: Branding & Συσκευασία
      description: Εφαρμογή λογότυπου ιδιωτικής ετικέτας, προσαρμοσμένα γραφικά κύτους και σωλήνων, τεκμηρίωση επώνυμων ιδιοκτητών, έτοιμη για λιανική ή παλετοποιημένη συσκευασία και προετοιμασία κιτ ανταλλακτικών.
      icon: tabler:palette
    - title: Εξαγωγή & Τεκμηρίωση
      description: Συσκευασία εξαγωγής, σχέδιο φόρτωσης εμπορευματοκιβωτίων, τεκμηρίωση FOB/CIF/DDP, έγγραφα συμμόρφωσης ανά αγορά προορισμού και πρωτόκολλο επικοινωνίας μετά την παράδοση.
      icon: tabler:world
content_risk_control:
  tagline: Έλεγχος κινδύνου & παράδοσης
  title: Κίνδυνος έργου &<br />Διαχείριση παράδοσης
  subtitle: Οι επαγγελματίες αγοραστές OEM/ODM ενδιαφέρονται τόσο για τον έλεγχο κινδύνου όσο και για την ποιότητα του προϊόντος. Να πώς το διαχειριζόμαστε.
  items:
    - title: Πεδίο εφαρμογής & Ορισμός ιδιοκτησίας
      description: 'Πριν ξεκινήσει η ανάπτυξη, ορίζουμε γραπτώς: το εύρος προσαρμογής, τις απαιτήσεις εργαλείων, τα κριτήρια έγκρισης δειγμάτων, την ιδιοκτησία σχεδίων και καλουπιών και τις ευθύνες τεκμηρίωσης. Καμία ασάφεια σχετικά με το ποιος κατέχει τι.'
      icon: tabler:file-text
    - title: Αλλαγή διαδικασίας ελέγχου
      description: Όλες οι αλλαγές προδιαγραφών μετά την επιβεβαίωση σχεδιασμού ακολουθούν μια τεκμηριωμένη διαδικασία αιτήματος αλλαγής με εκτίμηση επιπτώσεων (κόστος, χρονοδιάγραμμα, συμμόρφωση). Δεν εισέρχονται στην παραγωγή μη εγκεκριμένες τροποποιήσεις.
      icon: tabler:arrows-diff
    - title: Εγγύηση συνέπειας παρτίδας
      description: Η 50η μονάδα ταιριάζει με το 1ο εγκεκριμένο δείγμα. Οι εγκεκριμένες προδιαγραφές παγώνουν, οι παράμετροι υλικού και διεργασίας είναι κλειδωμένες και τα σημεία ελέγχου κατά τη διαδικασία επαληθεύουν τη συνέπεια σε όλη τη διάρκεια της παραγωγής.
      icon: tabler:repeat
    - title: Διαφάνεια παράδοσης και χωρητικότητας
      description: Οι χρόνοι παράδοσης αναφέρονται βάσει της πραγματικής παραγωγικής ικανότητας, των επιπέδων αποθεμάτων υλικών και του τρέχοντος φορτίου παραγγελίας — όχι των φιλοδοξιών στόχων. Πρόγραμμα παραγωγής με ημερομηνίες ορόσημων που παρέχονται ανά παραγγελία.
      icon: tabler:calendar-stats

