cta:
  title: Δεν είστε σίγουροι από πού να ξεκινήσετε;
  desc: Κάντε το κουίζ αξιολόγησης δεξιοτήτων μας για να βρείτε τους κατάλληλους οδηγούς και εξοπλισμό για το επίπεδό σας.
  label: Επικοινωνήστε μαζί μας →
  link: /contact

