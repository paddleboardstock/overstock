hero:
  tagline: Aquafarer Ακαδημία
  title: Κέντρο Εκμάθησης
  subtitle: Οδηγοί και σεμινάρια για κάθε επίπεδο δεξιοτήτων — από SUP βασικά έως προηγμένες τεχνικές διάσωσης
categories:
  - level: Αρχάριος
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Βασικά
        desc: Μάθετε τις βασικές αρχές του stand-up paddleboarding - στάση, τεχνική κτύπημα και ισορροπία.
        slug: beginner-sup-guide
      - title: Τεχνικές κουπιών
        desc: Εμπρός διαδρομή, διαδρομή σάρωσης, διαδρομή έλξης και χαμηλό στήριγμα — κατακτήστε τις βασικές κινήσεις του κουπιού.
        slug: sup-paddle-guide
      - title: Πρώτα η ασφάλεια
        desc: Βασικές πρακτικές ασφαλείας, συμπεριλαμβανομένων ελέγχων καιρού, χρήσης PFD, κανόνων λουριών και αυτοδιάσωσης.
        slug: sup-safety-guide
  - level: Ενδιάμεσος
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Τα βασικά για εκδρομές
        desc: Σχεδιασμός πολύωρων κουπιών — πλοήγηση, ενυδάτωση, βηματισμός και ανάγνωση προβλέψεων ανέμου.
        slug: touring-sup-guide
      - title: Ανάγνωση καιρού
        desc: Ερμηνεύστε τις θαλάσσιες προβλέψεις, εντοπίστε μοτίβα σύννεφων και κατανοήστε τις επιπτώσεις του ανέμου στο νερό.
        slug: weather-planning-water-sports
      - title: Βασικά στοιχεία πλοήγησης
        desc: Ανάγνωση γραφήματος, χρήση πυξίδας, σημεία διαδρομής GPS και σχεδιασμός διαδρομής για παράκτια κωπηλασία.
        slug: sup-navigation-guide
      - title: Παλίρροια συνειδητοποίηση
        desc: Κατανόηση των κύκλων παλίρροιας, των ρευμάτων και του τρόπου με τον οποίο επηρεάζουν το χρόνο εκτόξευσης και τη δρομολόγηση.
        slug: understanding-tides
  - level: Προχωρημένος
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Σχεδιασμός πολυήμερου ταξιδιού
        desc: Επιμελητεία αποστολής — επιλογή εξοπλισμού, προγραμματισμός τροφίμων, πρωτόκολλα ασφαλείας και επαφές έκτακτης ανάγκης.
        slug: sup-travel-guide
      - title: Τεχνικές διάσωσης
        desc: Αυτοδιάσωση, Τ-διάσωση, διάσωση εσκιμώων για καγιάκ και πρωτόκολλα ρυμούλκησης για ανοιχτά νερά.
        slug: sup-self-rescue
      - title: Νυχτερινή κωπηλασία
        desc: Πλοήγηση μετά το σκοτάδι — απαιτήσεις φωτισμού, μνήμη διαδρομής, ομαδική επικοινωνία και επίγνωση κινδύνου.
        slug: sup-navigation-guide
  - level: Συντήρηση
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Καθαρισμός & Περιποίηση
        desc: Ξέπλυμα με γλυκό νερό, προστασία από την υπεριώδη ακτινοβολία, πρόληψη μούχλας και σωστές τεχνικές στεγνώματος μετά από κάθε συνεδρία.
        slug: inflatable-sup-maintenance
      - title: Οδηγός αποθήκευσης
        desc: Βέλτιστες πρακτικές για την αποθήκευση φουσκωτών σανίδων και σκαφών — ξεφούσκωμα, δίπλωμα, έλεγχος θερμοκρασίας και διάρκεια ζωής.
        slug: inflatable-sup-storage
      - title: Βασικά στοιχεία επισκευής
        desc: Διορθώστε μικρά τρυπήματα, διαρροές ραφών και προβλήματα βαλβίδων με κιτ επισκευής PVC και τεχνικές επισκευής.
        slug: inflatable-sup-repair
      - title: Συντήρηση Βαλβίδας
        desc: Προσδιορίστε τους τύπους βαλβίδων (Halkey-Roberts, Boston, Leafield), καθαρίστε τα υπολείμματα και αντικαταστήστε τα ελαττωματικά στελέχη.
        slug: inflatable-sup-repair
knowledge_center_tagline: Κέντρο Γνώσης
knowledge_center_title: Οδηγοί Ναυτιλιακού Εξοπλισμού & Βιομηχανίας
knowledge_center_subtitle: Εξειδικευμένες γνώσεις και οδηγοί αγοράς για επαγγελματίες ναυτιλιακούς, χειριστές στόλου και λάτρεις των θαλάσσιων σπορ.
knowledge_sections:
  - title: RIB Γνώση σκάφους
    tagline: Οδηγοί άκαμπτων φουσκωτών σκαφών
    desc: Τα πάντα για τα RIB σκάφη — σχεδιασμός γάστρας, υλικά, επιλογή κινητήρα, συντήρηση και συμβουλές αγοράς για εμπορική και ψυχαγωγική χρήση.
    guides:
      - title: Πώς να επιλέξετε το σωστό RIB σκάφος
        desc: Πλήρης οδηγός για την επιλογή ενός RIB — μέγεθος, ισχύς κινητήρα, υλικό σωλήνα, τύπος κύτους και προβλεπόμενη χρήση.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB εναντίον Φουσκωτό Σκάφος
        desc: Άκαμπτο φουσκωτό σκάφος έναντι παραδοσιακής φουσκωτής λέμβου — σχεδιασμός γάστρας, απόδοση, ανθεκτικότητα και χωρητικότητα σε σύγκριση.
        href: /compare/rib-vs-dinghy
      - title: Εμπορικό RIB vs ψυχαγωγικό RIB
        desc: Σκάφη εμπορικής ποιότητας έναντι ψυχαγωγικών RIB — πρότυπα κατασκευής, υλικά, διάρκεια ζωής, κόστος και πιστοποιήσεις.
        href: /compare/commercial-vs-recreational-rib
      - title: Aluminium vs Fiberglass Hull
        desc: Συγκρίνετε γάστρα αλουμινίου και υαλοβάμβακα για σκάφη RIB σε βάρος, κόστος, ανθεκτικότητα και αντοχή στη διάβρωση.
        href: /compare/aluminum-vs-fiberglass
  - title: Οδηγός φουσκωτών σκαφών
    tagline: Γνώση για φουσκωτά σκάφη
    desc: Πλήρεις οδηγοί για φουσκωτά σκάφη — PVC έναντι Hypalon, μέθοδοι κατασκευής, πρότυπα ασφαλείας και βέλτιστες πρακτικές συντήρησης.
    guides:
      - title: PVC vs Hypalon Οδηγός υλικού
        desc: Οριστική σύγκριση μεταξύ PVC και Hypalon CSM για κατασκευή φουσκωτών σκαφών.
        href: /compare/pvc-vs-hypalon
      - title: Πώς κατασκευάζονται τα φουσκωτά σκάφη
        desc: Διαδικασία κατασκευής — κοπή υλικού, συγκόλληση HF, κατασκευή ραφών, δοκιμή πίεσης και έλεγχος ποιότητας.
        href: /learn/inflatable-technology
      - title: Οδηγός ασφάλειας φουσκωτών σκαφών
        desc: Πρότυπα ασφαλείας, χωρητικότητα φόρτωσης, σωστό φούσκωμα, έλεγχοι πριν από την αναχώρηση και διαδικασίες έκτακτης ανάγκης.
        href: /learn/water-safety
      - title: Συντήρηση φουσκωτών σκαφών
        desc: Καθαρισμός, αποθήκευση, προστασία από την υπεριώδη ακτινοβολία, χειμώνας και επισκευή φουσκωτών σκαφών και RIB.
        href: /v2/inflatable-boat-maintenance
  - title: Γνώση σκάφους
    tagline: Φουσκωτό σκάφος & RIB Hub
    desc: Τεχνικοί οδηγοί που καλύπτουν τύπους φουσκωτών σκαφών, υλικά, μεθόδους κατασκευής, συντήρηση και ασφάλεια — από λέμβους έως RIB.
    guides:
      - title: Τύποι φουσκωτών σκαφών
        desc: Βάρκες, RIB, καγιάκ και προσφορές — μάθετε τις διαφορές και επιλέξτε το σωστό.
        href: /v2/inflatable-boat-buying-guide
      - title: Τεχνολογία Drop-Stitch
        desc: Πώς χιλιάδες εσωτερικά νήματα δημιουργούν άκαμπτες, φουσκωτές δομές υψηλής πίεσης.
        href: /learn/drop-stitch-core
      - title: Αναφορά Υλικών
        desc: Επεξηγήθηκαν PVC βαθμολογίες ντενιέ, βάρη υφασμάτων, αντοχή στην υπεριώδη ακτινοβολία και υλικά θαλάσσιας ποιότητας.
        href: /learn/materials
      - title: RIB εναντίον Dinghy
        desc: Συγκρίνετε άκαμπτα φουσκωτά σκάφη με παραδοσιακές φουσκωτές λέμβους για διαφορετικές περιπτώσεις χρήσης.
        href: /compare/rib-vs-dinghy
  - title: SUP Γνώση
    tagline: Οδηγοί Stand-Up Paddleboard
    desc: Τα πάντα για τις σανίδες SUP — φουσκωτές έναντι άκαμπτων, διαστάσεις σανίδων, τεχνολογία υλικών και συμβουλές ειδικών για όλα τα επίπεδα δεξιοτήτων.
    guides:
      - title: Φουσκωτό εναντίον Σκληρό SUP
        desc: Συγκρίνετε τα iSUP και τις σκληρές εποξειδικές πλακέτες σε φορητότητα, ανθεκτικότητα, απόδοση και αξία.
        href: /learn/sup
      - title: SUP Οδηγός Διαστάσεων Πίνακα
        desc: Πώς το μήκος, το πλάτος και το πάχος επηρεάζουν τη σταθερότητα, την ταχύτητα και την ικανότητα ελιγμών.
        href: /learn/sup
      - title: SUP Συντήρηση & Φροντίδα
        desc: Συμβουλές καθαρισμού, αποθήκευσης, προστασίας από την υπεριώδη ακτινοβολία και επισκευής για φουσκωτές σανίδες SUP.
        href: /v2/inflatable-sup-maintenance
      - title: Επιλέγοντας το πρώτο σας SUP
        desc: Οδηγός για αρχάριους για την επιλογή του σωστού stand-up paddleboard για το βάρος, το επίπεδο δεξιοτήτων και την προβλεπόμενη χρήση σας.
        href: /learn/sup
  - title: Οδηγός Καταδυτικού Εξοπλισμού
    tagline: Γνώση εμπορικών σκαφών κατάδυσης
    desc: Εξειδικευμένοι οδηγοί για καταδυτικά σκάφη, καταδυτικά RIB και εξοπλισμός για καταδυτικά κέντρα, χειριστές καταδύσεων και εμπορικές ομάδες καταδύσεων.
    guides:
      - title: Το καλύτερο RIB σκάφος για καταδυτικά κέντρα
        desc: Πώς να επιλέξετε τη σωστή κατάδυση RIB για το καταδυτικό σας κέντρο — στοιχεία χωρητικότητας, διαμόρφωσης και προϋπολογισμού.
        href: /solutions-diving-center-boats
      - title: Οδηγός διαμόρφωσης Dive RIB
        desc: Βασικά χαρακτηριστικά για καταδυτικά RIBs — σχάρες δεξαμενών, συστήματα σκάλας, πλατφόρμα καταδύσεων και αποθήκευση εξοπλισμού.
        href: /solutions-diving-center-boats
  - title: Οδηγός προσφοράς γιοτ
    tagline: Λύσεις για superyacht και marine tender
    desc: Οδηγοί για την επιλογή της τέλειας προσφοράς γιοτ — φουσκωτές προσφορές, προσφορές RIB, λύσεις αποθήκευσης και τρυφερά αξεσουάρ.
    guides:
      - title: Πώς να επιλέξετε προσφορά γιοτ
        desc: Παράγοντες που πρέπει να λάβετε υπόψη κατά την επιλογή μιας προσφοράς για το γιοτ σας — μέγεθος, υλικό, κινητήρας και αποθήκευση.
        href: /solutions-yacht-tender-solutions
      - title: Φουσκωτά έναντι RIB Προσφορές
        desc: Συγκρίνετε τα φουσκωτά σκάφη με τα άκαμπτα φουσκωτά σκάφη για απόδοση, ανθεκτικότητα και δυνατότητα στοιβασίας.
        href: /compare/rib-vs-dinghy
  - title: Οδηγός Εξοπλισμού Διάσωσης
    tagline: Γνώση σκαφών Έρευνας & Διάσωσης
    desc: Επαγγελματίες οδηγοί σε σκάφη διάσωσης, SAR σκάφη και εξοπλισμός αντιμετώπισης καταστάσεων έκτακτης ανάγκης για την ακτοφυλακή, τους ναυαγοσώστες και τις ομάδες ανακούφισης από καταστροφές.
    guides:
      - title: SAR Οδηγός επιλογής σκαφών
        desc: Πώς να επιλέξετε το σωστό σκάφος έρευνας και διάσωσης — ταχύτητα, χωρητικότητα, ανθεκτικότητα και απαιτήσεις εξειδικευμένου εξοπλισμού.
        href: /solutions-rescue-watercraft
      - title: Εμπορικό RIB για Επιχειρήσεις Διάσωσης
        desc: Γιατί τα RIB εμπορικής ποιότητας είναι η προτιμώμενη επιλογή για επαγγελματικές ομάδες έρευνας και διάσωσης παγκοσμίως.
        href: /use-cases/search-and-rescue
