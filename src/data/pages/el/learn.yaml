hero:
  tagline: 'Γνώση Εξερεύνησης Νερού'
  title: 'Μάθετε'
  subtitle: |
    Οδηγοί, σεμινάρια και βαθιές καταδύσεις — όλα όσα χρειάζεστε για να εξερευνήσετε<br />
    το νερό με αυτοπεποίθηση. Από την επιλογή του πρώτου σας SUP έως προηγμένες τεχνικές.
  taglineSection: 'Γνώση για κάθε κωπηλάτη. Από αρχάριο έως επαγγελματία.'

featured:
  tagline: 'Προτεινόμενα Θέματα'
  title: 'Ξεκινήστε το μαθησιακό σας ταξίδι'
  subtitle: 'Είτε είστε νέος στα θαλάσσια σπορ είτε θέλετε να ανεβείτε επίπεδο, οι οδηγοί μας σας καλύπτουν.'
  items:
    - title: 'Βασικά SUP'
      description: 'Όλα όσα πρέπει να γνωρίζει ένας αρχάριος — τύποι σανίδων, μέγεθος κουπιού, στάση και συμβουλές.'
      icon: 'tabler:lifebuoy'
      href: '/learn/sup'
    - title: 'Φουσκωτό vs Σκληρή Σανίδα'
      description: 'Ποιο είναι κατάλληλο για εσάς; Συγκρίνουμε φορητότητα, απόδοση και ανθεκτικότητα.'
      icon: 'tabler:arrows-left-right'
      href: '/compare/inflatable-vs-hardboard'
    - title: 'Ασφάλεια Νερού'
      description: 'Βασική γνώση ασφαλείας — καιρός, PFD, αυτοδιάσωση και άλλα.'
      icon: 'tabler:shield'
      href: '/learn/water-safety'
    - title: 'Οδηγός Υλικών'
      description: 'PVC vs Hypalon, τεχνολογία drop-stitch — κατανοήστε από τι είναι φτιαγμένος ο εξοπλισμός σας.'
      icon: 'tabler:hexagons'
      href: '/learn/materials'
    - title: 'Οδηγός Μεγέθους SUP'
      description: 'Βρείτε το σωστό μήκος, πλάτος και όγκο σανίδας για εσάς.'
      icon: 'tabler:ruler'
      href: '/size-guide'
    - title: 'Ενδιάμεσες Τεχνικές'
      description: 'Ανεβάστε επίπεδο με προηγμένες κινήσεις και τεχνικές στροφής.'
      icon: 'tabler:ripple'
      href: '/learn/intermediate-techniques'

