hero:
  tagline: Συνεργασίες και Διανομή
  title: 'Γίνετε Συνεργάτης Aquafarer<br />— Παγκόσμιο Δίκτυο Διανομής'
  subtitle: "Συμμετάσχετε στο παγκόσμιο δίκτυο συνεργατών της Aquafarer. Συνεργαζόμαστε με διανομείς θαλάσσιου εξοπλισμού, αντιπροσώπους σκαφών, καταστήματα εξοπλισμού και εταίρους επωνυμιών σε πάνω από 50 χώρες."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Παγκόσμιο δίκτυο συνεργατών και διανομέων της Aquafarer
content_programs:
  tagline: Προγράμματα συνεργατών
  title: 'Προγράμματα Συνεργασίας<br />Δομημένα για Ανάπτυξη'
  subtitle: 'Είτε είστε διανομέας, αντιπρόσωπος ή εταίρος επωνυμίας, η Aquafarer προσφέρει προγράμματα σχεδιασμένα να υποστηρίζουν την επιχείρησή σας.'
  columns: 3
  items:
    - title: Πρόγραμμα διανομέων
      description: 'Αποκλειστική εδαφική διανομή με τιμές όγκου, υποστήριξη μάρκετινγκ και άμεση πρόσβαση στο εργοστάσιο. Απαιτείται ελάχιστη δέσμευση με βάση το μέγεθος της περιοχής.'
      icon: tabler:world
    - title: Πρόγραμμα αντιπροσώπων
      description: 'Απευθείας τιμές αντιπροσώπων, εκπαίδευση προϊόντων, υλικό μάρκετινγκ και υποστήριξη εγγύησης για φυσικά καταστήματα και ηλεκτρονικά καταστήματα.'
      icon: tabler:building-store
    - title: Συνεργασία OEM/ODM
      description: 'Πλήρης παραγωγή OEM και ODM με προσαρμοσμένη επωνυμία, συσκευασία και προδιαγραφές προϊόντων. Από την ιδέα μέχρι το container.'
      icon: tabler:certificate
    - title: Συνεργασία με μάρκες
      description: 'Προγράμματα συγκοινής επωνυμίας, ιδιωτικής ετικέτας και αποκλειστικών μοντέλων για καθιερωμένες επωνυμίες στον χώρο των θαλάσσιων σπορ και της υπαίθριας αναψυχής.'
      icon: tabler:stars
    - title: 'Κυβέρνηση και Θεσμικοί Φορείς'
      description: 'Προγράμματα προτιμώμενου προμηθευτή για κρατικές υπηρεσίες, ακτοφυλακές, στρατό και ανθρωπιστικές οργανώσεις. Τεκμηρίωση έτοιμη για δημόσιους διαγωνισμούς.'
      icon: tabler:building-community
    - title: 'Συνεργάτης για Θέρετρα και Ενοικιάσεις'
      description: 'Τιμές στόλου, συνεπής ποιότητα και προσαρμοσμένη επωνυμία για θέρετρα, κέντρα καταδύσεων και επιχειρήσεις ενοικίασης παγκοσμίως.'
      icon: tabler:sun
content_benefits:
  tagline: Γιατί να συνεργαστείτε μαζί μας
  title: 'Γιατί οι Συνεργάτες Επιλέγουν την Aquafarer'
  subtitle: 'Οι συνεργάτες μας επωφελούνται από πραγματική παραγωγική ικανότητα, συνεπή ποιότητα και άμεση υποστήριξη.'
  list:
    - 'Άμεση Πρόσβαση στο Εργοστάσιο: Συνεργαστείτε απευθείας με την παραγωγική μας ομάδα — χωρίς μεσάζοντες. Αποκτήστε ταχύτερες απαντήσεις, καλύτερες τιμές και πλήρη ορατότητα στην παραγωγή.'
    - 'Έτοιμο για Προσαρμογή: Σημαδέψτε τα προϊόντα σας με προσαρμοσμένα χρώματα, λογότυπα, συσκευασία και προδιαγραφές. Ελάχιστες ποσότητες παραγγελίας προσαρμοσμένες στην αγορά σας.'
    - 'Εγγυημένη Ποιότητα: Πιστοποιημένη παραγωγή ISO 9001 με συμμόρφωση CE, UKCA και BSCI. Κάθε προϊόν δοκιμάζεται πριν την αποστολή.'
    - 'Παγκόσμια Εφοδιαστική: Αποστολές από το Qingdao της Κίνας με επιλογές FOB, CIF και DDP. Αποθήκη στις ΗΠΑ στο Montclair της Καλιφόρνια για διανομή στη Βόρεια Αμερική.'
    - 'Υποστήριξη Μάρκετινγκ: Κατάλογοι προϊόντων, φωτογραφικό υλικό, τεχνική τεκμηρίωση και ψηφιακά στοιχεία για την υποστήριξη των πωλήσεών σας.'
    - 'Εκπαίδευση και Υποστήριξη: Εκπαίδευση προϊόντων για την ομάδα πωλήσεών σας, τεχνική υποστήριξη για τους πελάτες σας και συντονισμός υπηρεσιών εγγύησης.'
content_process:
  tagline: Πώς να Γίνετε Συνεργάτης
  title: 'Απλή Διαδικασία Συνεργασίας'
  subtitle: 'Η διαδικασία συνεργασίας μας είναι απλή — σχεδιασμένη ώστε να ξεκινήσετε γρήγορα την πώληση προϊόντων Aquafarer.'
  items:
    - title: 'Βήμα 1: Υποβολή Αίτησης'
      description: 'Συμπληρώστε τη φόρμα αίτησης συνεργάτη με το προφίλ της εταιρείας σας, την αγορά-στόχο και τα προϊόντα που σας ενδιαφέρουν.'
    - title: 'Βήμα 2: Αξιολόγηση Προσόνων'
      description: 'Η ομάδα συνεργασιών μας εξετάζει την αίτησή σας και επικοινωνεί μαζί σας εντός 3 εργάσιμων ημερών για να συζητήσει ευκαιρίες.'
    - title: 'Βήμα 3: Συμφωνία και Ρύθμιση'
      description: 'Υπογράψτε συμφωνία συνεργασίας, ρυθμίστε τον λογαριασμό σας και λάβετε τιμές συνεργάτη, υλικό μάρκετινγκ και δείγματα προϊόντων.'
    - title: 'Βήμα 4: Εκπαίδευση και Εκκίνηση'
      description: 'Παρέχεται εκπαίδευση προϊόντων, υποστήριξη πωλήσεων και υλικό μάρκετινγκ. Είστε έτοιμοι να ξεκινήσετε τις πωλήσεις.'
cta:
  title: 'Έτοιμοι να γίνετε συνεργάτης της Aquafarer;'
  subtitle: 'Αιτήστε συνεργασία και η ομάδα μας θα απαντήσει εντός 3 εργάσιμων ημερών.'
  actions:
    - variant: primary
      text: Αίτηση συνεργασίας
      href: /contact
    - text: Δείτε τα προϊόντα μας
      href: /products
