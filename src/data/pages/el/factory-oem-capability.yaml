why_us:
  - title: Κάθετη Ενσωμάτωση
    description: Είμαστε ιδιοκτήτες του εργοστασίου, των καλουπιών και της αλυσίδας εφοδιασμού μας — χωρίς μεσάζοντες, χωρίς υπεργολάβους. Αυτό μας δίνει έλεγχο της ποιότητας, του κόστους και της παράδοσης.
  - title: Διπλή πιστοποίηση
    description: Διαχείριση ποιότητας ISO 9001 και πιστοποίηση κοινωνικής συμμόρφωσης BSCI. Εκθέσεις ελέγχου εργοστασίου διαθέσιμες κατόπιν αιτήματος.
  - title: Συμμόρφωση CE
    description: Όλα τα τυπικά μοντέλα φέρουν πιστοποίηση CE 2013/53/EU. Τα προσαρμοσμένα μοντέλα μπορούν να πιστοποιηθούν CE μέσω της καθιερωμένης διαδικασίας μας.
  - title: Χαμηλό MOQ
    description: Ξεκινήστε με μόλις 5 μονάδες για τυπικά μοντέλα. Βοηθάμε τις ανερχόμενες επωνυμίες να ξεκινήσουν χωρίς υπερβολικά αποθέματα.
