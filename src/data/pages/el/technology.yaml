testimonial:
  quote: Αυτό που ξεχωρίζει το Aquafarer είναι η επιστήμη των υλικών τους. Δεν συναρμολογούν απλώς εξαρτήματα — κατασκευάζουν τις ενώσεις PVC, τις παραμέτρους συγκόλλησης και τη δομική διάταξη στο εσωτερικό. Αυτή η κάθετη ολοκλήρωση φαίνεται στο τελικό προϊόν.
  author: Ντέιβιντ Παρκ
  title: Υπεύθυνος Ανάπτυξης Προϊόντων
  company: Bluewater Sports Equipment
  location: Αυστραλία
sections:
  - title: Πυρήνας Drop-Stitch
    standard: Πίεση λειτουργίας 12-15 PSI
    description: Χιλιάδες εσωτερικά νήματα πολυεστέρα συνδέουν το επάνω και το κάτω στρώμα, δημιουργώντας μια άκαμπτη δομή στα 12-15 PSI. Αυτή είναι η ίδια τεχνολογία που χρησιμοποιείται σε επαγγελματικές σανίδες κουπιών και φουσκωτά αγωνιστικά σκάφη. Η πυκνότητα βελονιάς σταγόνας είναι βελτιστοποιημένη ανά μοντέλο για την ιδανική ισορροπία ακαμψίας και βάρους.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: Διάγραμμα πυρήνα drop-stitch
  - title: Ναυτικό βαθμό PVC
    standard: Συγκολλημένο με σύντηξη | Δοκιμασμένο σε UV / αλμυρό νερό / γδάρσιμο
    description: Πολυστρωματικό πολυστρωματικό ύφασμα PVC με βαθμολογία για θαλάσσια περιβάλλοντα. Κάθε στρώμα είναι συγκολλημένο με σύντηξη αντί κολλημένο, εξαλείφοντας τους κινδύνους αποκόλλησης. Δοκιμασμένο για αντοχή στην υπεριώδη ακτινοβολία (ASTM G154, 1.000+ ώρες), διάβρωση θαλασσινού νερού (ISO 9227) και τριβή (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: Στρώμα PVC
  - title: Hypalon Σωλήνες
    standard: CSM καουτσούκ | Ανθεκτικό σε UV / χημικά / ακραίες θερμοκρασίες
    description: Χρησιμοποιείται σε μοντέλα RIB, το Hypalon (CSM) καουτσούκ παρέχει ανώτερη UV και χημική αντοχή σε σύγκριση με το τυπικό PVC. Οι σωλήνες Hypalon διατηρούν την ευελιξία σε ακραίες θερμοκρασίες και αντιστέκονται στην υποβάθμιση από την έκθεση στο καύσιμο και το λάδι. Όλες οι ραφές τοποθετούνται στο χέρι από πιστοποιημένους τεχνικούς.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Δάπεδο Air Deck
    standard: Φουσκωτό υψηλής πίεσης | Αντικαθιστά κόντρα πλακέ/αλουμίνιο
    description: Φουσκωτό σύστημα δαπέδου υψηλής πίεσης που αντικαθιστά τα παραδοσιακά δάπεδα από κόντρα πλακέ ή πηχάκια αλουμινίου. Μειώνει τον χρόνο εγκατάστασης, το συνολικό βάρος και τον όγκο αποθήκευσης ενώ παρέχει επαρκή ακαμψία για την ορθοστασία, το ψάρεμα και το περπάτημα. Δοκιμασμένο για υποστήριξη 200+ kg κατανεμημένου φορτίου.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Δάπεδο αέρα (Air Deck)
