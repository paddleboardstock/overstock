  subtitle: Κάθε πλακέτα Aquafarer έχει κατασκευαστεί με υλικά ακριβείας και μεθόδους κατασκευής που έχουν δοκιμαστεί για θαλάσσια περιβάλλοντα. Κέντρο Έρευνας και Ανάπτυξης 12.000 m² με εσωτερικά πρωτότυπα.
