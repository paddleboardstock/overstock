hero:
  tagline: Συμμόρφωση με CE & RCD
  title: RIB Boat CE Compliance<br />& Τεχνική τεκμηρίωση
  subtitle: Τα σκάφη Paddle Board Overstock RIB και τα φουσκωτά σκάφη έχουν σχεδιαστεί και τεκμηριωθεί για τη συμμόρφωση με την αγορά της ΕΕ σύμφωνα με την Οδηγία 2013/53/ΕΕ για τα σκάφη αναψυχής. Από την αξιολόγηση κινδύνου έως τη δήλωση συμμόρφωσης, παρέχουμε τεκμηρίωση συμμόρφωσης για κάθε μοντέλο για κάθε κύτος.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Τεκμηρίωση και πιστοποίηση συμμόρφωσης CE σκάφους RIB
direct_answer: Το Paddle Board Overstock παρέχει τεκμηρίωση συμμόρφωσης RCD 2013/53/ΕΕ για συγκεκριμένο μοντέλο για σκάφη RIB και φουσκωτά σκάφη, συμπεριλαμβανομένων τεχνικών αρχείων, Δηλώσεων συμμόρφωσης, πινακίδων κατασκευής και εγχειριδίων κατόχου — όλα ευθυγραμμισμένα με τα EN ISO 6185, ISO 12217 και τα ισχύοντα εναρμονισμένα πρότυπα.
