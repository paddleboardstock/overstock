content_scope:
  tagline: Πεδίο συμμόρφωσης
  title: Ποια προϊόντα χρειάζονται<br />συμμόρφωση RCD;
  subtitle: Η οδηγία 2013/53/ΕΕ για τα σκάφη αναψυχής ισχύει για σκάφη αναψυχής με μήκος κύτους μεταξύ 2,5 m και 24 m. Η κατανόηση του πεδίου εφαρμογής είναι το πρώτο βήμα για τη συμμόρφωση.
  items:
    - title: Σκάφη RIB (2,5–24 m)
      description: Τα άκαμπτα φουσκωτά σκάφη με μήκος κύτους από 2,5 m έως 24 m εμπίπτουν στο RCD. Οι κατηγορίες σχεδίασης Α έως Δ ισχύουν ανάλογα με τις επιδιωκόμενες συνθήκες της θάλασσας και τη μέγιστη δύναμη ανέμου.
      icon: tabler:sailboat
    - title: Φουσκωτά σκάφη (κάτω από 2,5 μέτρα)
      description: Τα μικρά φουσκωτά σκάφη και οι λέμβοι κάτω των 2,5 μέτρων ενδέχεται να εξαιρούνται εν μέρει από το RCD, αλλά εξακολουθούν να απαιτούν σήμανση CE σύμφωνα με άλλες ισχύουσες οδηγίες και τα πρότυπα κατασκευής EN ISO 6185.
      icon: tabler:sailboat
    - title: Πλάκες & αξεσουάρ SUP
      description: Τα stand-up paddle boards είναι εκτός του πεδίου εφαρμογής RCD. Ωστόσο, οι συσχετισμένες προσωπικές συσκευές επίπλευσης (PFD) απαιτούν σήμανση CE σύμφωνα με τον Κανονισμό ΜΑΠ (ΕΕ) 2016/425 με έγκριση USCG Type III/V, όπου ισχύει.
      icon: tabler:swimming
    - title: Μερικώς Ολοκληρωμένα Σκάφη
      description: Τα σκάφη που παραδίδονται χωρίς κινητήρα ή συγκεκριμένες εγκαταστάσεις απαιτούν Δήλωση Κατασκευαστή για μερικώς ολοκληρωμένο σκάφος, με πλήρη συμμόρφωση με το RCD που συμπληρώνεται από τον τελικό κατασκευαστή ή εισαγωγέα.
      icon: tabler:tool
content_trust_layers:
  tagline: Σύστημα εμπιστοσύνης τριών επιπέδων
  title: Πληροφορίες συμμόρφωσης<br />— Κοινή χρήση στο σωστό επίπεδο
  subtitle: Δεν ανήκουν όλα τα δεδομένα συμμόρφωσης σε δημόσιο ιστότοπο. Ακολουθούμε μια προσέγγιση τριών επιπέδων που προστατεύει την IP ενώ παράλληλα χτίζει την εμπιστοσύνη των αγοραστών.
  items:
    - title: Επίπεδο 1 — Δημόσιος ιστότοπος
      description: Αναφέρονται πρότυπα, επεξηγούνται οι διαδρομές συμμόρφωσης, παρατίθενται τύποι εγγράφων, εύρος πιστοποίησης ανά οικογένεια μοντέλων. Δεν υπάρχουν πραγματικά πιστοποιητικά, δεδομένα δοκιμών ή ιδιόκτητες λεπτομέρειες μηχανικής.
      icon: tabler:world
    - title: Επίπεδο 2 — Κοινή χρήση μετά την έρευνα
      description: 'Μετά από κατάλληλη έρευνα: ανακατασκευασμένο δείγμα DoC, φωτογραφία πινακίδας κατασκευαστή, λίστα ισχυόντων προτύπων, λίστα ελέγχου συμμόρφωσης και περιλήψεις πιστοποίησης υλικού — κοινοποιημένα με όρους ορθής χρήσης.'
      icon: tabler:mail
    - title: Επίπεδο 3 — NDA / Στάδιο παραγγελίας
      description: Πλήρες τεχνικό αρχείο, εκτιμήσεις κινδύνου, υπολογισμοί σταθερότητας, αναφορές δοκιμών, αρχεία παρτίδας υλικών και τεκμηρίωση ιχνηλασιμότητας παραγωγής — κοινοποιούνται μόνο στο πλαίσιο NDA με επιβεβαιωμένους αγοραστές.
      icon: tabler:lock
content_standards:
  tagline: Ισχύοντα Πρότυπα
  title: Πρότυπα ISO & EN<br /> Κατασκευάζουμε σε
  subtitle: Τα προϊόντα μας έχουν σχεδιαστεί και δοκιμαστεί σύμφωνα με τα εναρμονισμένα πρότυπα σύμφωνα με το RCD. Αναφέρονται τυπικοί αριθμοί και ονόματα. Τα πλήρη τυπικά κείμενα παραμένουν πνευματικά δικαιώματα ISO.
  items:
    - title: EN ISO 6185-3
      description: 'Φουσκωτά σκάφη — Μέρος 3: Σκάφη με μέγιστη ισχύ κινητήρα 15 kW ή περισσότερο. Απαιτήσεις κατασκευής, ευστάθειας, άνωσης και ανάκτησης ανθρώπου στη θάλασσα για RIB.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Φουσκωτά σκάφη — Μέρος 4: Σκάφη με μέγιστη ισχύ κινητήρα 15 kW και μεγαλύτερη ή ίση με 4,5 kW. Πρόσθετες δομικές απαιτήσεις και απαιτήσεις σταθερότητας.'
      icon: tabler:file-text
    - title: Σειρά ISO 12215
      description: Μικρά σκάφη — Κατασκευή γάστρας και σκαλίσματα. Δομική σχεδίαση γάστρας, καταστρώματος και διαφραγμάτων για γάστρα RIB από υαλοβάμβακα και αλουμίνιο.
      icon: tabler:ruler-2
    - title: EN ISO 10240:2020
      description: Μικρή βιοτεχνία — Εγχειρίδιο ιδιοκτήτη. Απαιτούμενο περιεχόμενο και μορφή για το εγχειρίδιο ιδιοκτήτη που συνοδεύει κάθε σκάφος RIB που παραδίδεται στην ΕΕ.
      icon: tabler:book
    - title: EN ISO 14945:2021
      description: Μικρή βιοτεχνία — Πιάτο οικοδόμου. Πληροφορίες που πρέπει να σημειώνονται στην πινακίδα του κατασκευαστή που είναι μόνιμα προσαρτημένη σε κάθε σκάφος.
      icon: tabler:badge
    - title: ISO 8666
      description: Μικρό σκάφος — Κύρια δεδομένα. Τυποποιημένες μετρήσεις και παράμετροι για συνεπείς προδιαγραφές σε όλη την τεκμηρίωση του προϊόντος.
      icon: tabler:dimensions
content_process:
  tagline: Διαδικασία συμμόρφωσης
  title: Συμμόρφωση CE 6-βημάτων<br />Ροή εργασίας
  subtitle: Από το πεδίο εφαρμογής του έργου έως την ιχνηλασιμότητα σε σειριακό επίπεδο — κάθε μοντέλο RIB ακολουθεί μια καθορισμένη διαδρομή συμμόρφωσης.
  steps:
    - number: '01'
      title: Πεδίο εφαρμογής & Ταξινόμηση Έργου
      description: Καθορίστε το μοντέλο RIB, την κατηγορία σχεδίασης (A/B/C/D), τα μέγιστα άτομα, το ωφέλιμο φορτίο, την ισχύ του κινητήρα και την αγορά-στόχο. Προσδιορίστε εάν ισχύει RCD και ποια ενότητα αξιολόγησης συμμόρφωσης απαιτείται.
      timeline: 2-3 ημέρες
    - number: '02'
      title: Αναγνώριση ισχυουσών απαιτήσεων
      description: Προσδιορίστε όλες τις ισχύουσες Βασικές Απαιτήσεις Ασφάλειας από το Παράρτημα I RCD, τα σχετικά εναρμονισμένα πρότυπα (EN ISO 6185, 12215, 10240, 14945) και τυχόν πρόσθετες εθνικές απαιτήσεις για την αγορά-στόχο.
      timeline: 3-5 ημέρες
    - number: '03'
      title: Σχεδιασμός & Τεχνική Τεκμηρίωση
      description: 'Δημιουργήστε το κύριο τεχνικό αρχείο: σχέδια γενικής διάταξης, υπολογισμοί ευστάθειας και άνωσης, εκτίμηση κινδύνου, προδιαγραφές υλικών και ανάλυση ασφάλειας συστημάτων (καύσιμα, ηλεκτρικά, σύστημα διεύθυνσης).'
      timeline: 10-15 ημέρες
    - number: '04'
      title: Επαλήθευση και δοκιμή προϊόντος
      description: Πραγματοποιήστε φυσική επαλήθευση — δοκιμή πίεσης σε ονομαστική πίεση 1,25x για 24–48 ώρες, δοκιμές σταθερότητας και άνωσης, δοκιμές φορτίου και θέση σε λειτουργία συστημάτων. Καταγράψτε όλα τα αποτελέσματα των δοκιμών ανά κύτος.
      timeline: 5-7 ημέρες
    - number: '05'
      title: Τεκμηρίωση σήμανσης & παράδοσης
      description: Τοποθετήστε σήμανση CE, πινακίδα κατασκευής (EN ISO 14945) και HIN/CIN (αριθμός αναγνώρισης γάστρας). Προετοιμάστε τη Δήλωση συμμόρφωσης ΕΕ, το εγχειρίδιο κατόχου (EN ISO 10240) και τη λίστα ελέγχου συμμόρφωσης.
      timeline: 2-3 ημέρες
    - number: '06'
      title: Ιχνηλασιμότητα σε σειριακό επίπεδο
      description: Κάθε κύτος λαμβάνει ένα μοναδικό αρχείο Hull που το συνδέει με το Master Technical File, την παρτίδα παραγωγής, τα πιστοποιητικά υλικού, τα αποτελέσματα δοκιμών και την τελική διαμόρφωση. Τα αρχεία διατηρούνται για 10+ χρόνια ανά RCD.
      timeline: Σε εξέλιξη
content_document_cards:
  tagline: Τύποι εγγράφων
  title: Έγγραφο συμμόρφωσης<br />Κάρτες
  subtitle: Αυτοί είναι οι τύποι εγγράφων που προετοιμάζουμε και διατηρούμε για κάθε μοντέλο RIB με πιστοποίηση CE. Τα δείγματα είναι διαθέσιμα κατόπιν ειδικής έρευνας.
  items:
    - title: Πιστοποιητικό συμμόρφωσης CE / RCD
      description: Πιστοποιητικό για συγκεκριμένο μοντέλο που επιβεβαιώνει ότι το σκάφος πληροί όλες τις ισχύουσες Βασικές Απαιτήσεις Ασφάλειας του RCD 2013/53/EU, που εκδίδεται από τον κατασκευαστή με τη συμμετοχή Κοινοποιημένου Φορέα όπου απαιτείται.
      icon: tabler:certificate
    - title: Δήλωση συμμόρφωσης ΕΕ (DoC)
      description: Υπογεγραμμένη δήλωση από τον κατασκευαστή ή τον εξουσιοδοτημένο αντιπρόσωπο, στην οποία αναφέρονται οι ισχύουσες οδηγίες, τα πρότυπα, η ενότητα συμμόρφωσης και τα στοιχεία του κοινοποιημένου οργανισμού. Απαιτείται για κάθε μοντέλο που διατίθεται στην αγορά της ΕΕ.
      icon: tabler:file-check
    - title: Πλάκα οικοδόμου (EN ISO 14945)
      description: Μόνιμα τοποθετημένη πινακίδα που δείχνει τα μέγιστα άτομα, τη μέγιστη ισχύ κινητήρα, την κατηγορία σχεδιασμού και την ταυτότητα του κατασκευαστή. Πρέπει να παραμένει ευανάγνωστο για τη ζωή του σκάφους.
      icon: tabler:badge
    - title: Εγχειρίδιο κατόχου (EN ISO 10240)
      description: Ολοκληρωμένο εγχειρίδιο που καλύπτει την ασφαλή λειτουργία, τις διαδικασίες έκτακτης ανάγκης, τα προγράμματα συντήρησης και τις προειδοποιήσεις ασφαλείας. Υποχρεωτικό για κάθε RIB που παραδίδεται στην ΕΕ.
      icon: tabler:book
    - title: Εκθέσεις δοκιμών και επιθεώρησης ISO
      description: Αρχεία δοκιμής πίεσης (1,25x / 24–48h), αποτελέσματα δοκιμών σταθερότητας και άνωσης, πιστοποιητικά δοκιμών υλικού και αναφορές επαλήθευσης διαστάσεων — όλα συνδέονται με συγκεκριμένους αριθμούς κύτους.
      icon: tabler:test-pipe
    - title: Αρχεία Ιχνηλασιμότητας Υλικών
      description: Ιχνηλασιμότητα σε επίπεδο παρτίδας για ύφασμα σωλήνων, κόλλες, υαλοβάμβακα και υλικό. Συνδέει κάθε μονάδα παραγωγής με εισερχόμενα πιστοποιητικά υλικού και αποτελέσματα επιθεώρησης IQC.
      icon: tabler:link
    - title: Ποιοτικός έλεγχος και αρχεία QC
      description: Λίστα ελέγχου ποιότητας 100 σημείων ανά μονάδα, εγγραφές QC υπό επεξεργασία, αναφορές μη συμμόρφωσης και διορθωτικές ενέργειες. Μέρος της αλυσίδας ιχνηλασιμότητας παραγωγής.
      icon: tabler:clipboard-check
    - title: Πακέτο εγγράφων έργου
      description: Πακέτο τεκμηρίωσης ανά κύτος, συμπεριλαμβανομένου του τελικού αρχείου διαμόρφωσης, των λεπτομερειών εγκατάστασης κινητήρα και εξοπλισμού, λίστα ελέγχου θέσης σε λειτουργία και τεκμηρίωση παράδοσης.
      icon: tabler:package
content_design_categories:
  tagline: Κατηγορίες σχεδίασης RCD
  title: Κατηγορία σχεδίου A–D<br />— Τι σημαίνουν
  subtitle: Το RCD εκχωρεί κατηγορίες σχεδιασμού με βάση τη μέγιστη δύναμη ανέμου και το σημαντικό ύψος κύματος που έχει σχεδιαστεί να αντέχει το σκάφος.
  items:
    - title: Κατηγορία Α — Ωκεανός
      description: Σχεδιασμένο για εκτεταμένα ταξίδια όπου η δύναμη του ανέμου μπορεί να υπερβαίνει τα 8 μποφόρ (>40 κόμβοι) και το σημαντικό ύψος κύματος μπορεί να υπερβαίνει τα 4 μέτρα. Απαιτεί την πιο αυστηρή δομική επαλήθευση και σταθερότητα.
      icon: tabler:ripple
    - title: Κατηγορία Β — Υπεράκτια
      description: Σχεδιασμένο για υπεράκτια ταξίδια με δύναμη ανέμου έως 8 μποφόρ (≤40 κόμβοι) και σημαντικό ύψος κύματος έως 4 μέτρα. Κατάλληλο για παράκτια και ημιεκτεθειμένα νερά.
      icon: tabler:anchor
    - title: Κατηγορία Γ — Παράκτια
      description: Σχεδιασμένο για παράκτια ταξίδια με δύναμη ανέμου έως 6 μποφόρ (≤27 κόμβοι) και σημαντικό ύψος κύματος έως 2 m. Τα περισσότερα RIB για αναψυχή εμπίπτουν σε αυτήν την κατηγορία.
      icon: tabler:sun
    - title: Κατηγορία Δ — Προφυλαγμένα
      description: Σχεδιασμένο για προστατευμένα νερά με δύναμη ανέμου έως 4 μποφόρ (≤16 κόμβοι) και σημαντικό ύψος κύματος έως 0,3 m. Λίμνες, ποτάμια και προστατευμένα λιμάνια.
      icon: tabler:pool
content_hin:
  tagline: Αναγνώριση Τέχνης
  title: HIN / CIN & Πλάκα οικοδόμου
  subtitle: Κάθε σκάφος RIB απαιτεί έναν αριθμό αναγνώρισης κύτους (HIN) ή έναν αριθμό αναγνώρισης σκάφους (CIN) και μια πινακίδα κατασκευαστή σύμφωνα με τις απαιτήσεις EN ISO 14945 και RCD.
  items:
    - title: Αριθμός Αναγνώρισης Hull (HIN)
      description: Ένας μοναδικός κωδικός 14 χαρακτήρων με μόνιμη σήμανση στη δεξιά πλευρά του καθρέφτη, που κωδικοποιεί τον κωδικό κατασκευαστή (MIC), το έτος μοντέλου, το έτος παραγωγής και τον αριθμό σειράς. Απαιτείται για την είσοδο στην αγορά της ΕΕ.
      icon: tabler:hash
    - title: Αριθμός Αναγνώρισης Τέχνης (CIN)
      description: Σύμφωνα με το EN ISO 10087, ένας κρυφός δευτερεύων αριθμός αναγνώρισης τοποθετημένος σε κρυφή θέση για σκοπούς αντικλεπτικής προστασίας και ιχνηλασιμότητας.
      icon: tabler:eye-off
    - title: Περιεχόμενο πλάκας οικοδόμου
      description: Μέγιστος αριθμός ατόμων, μέγιστη ισχύς κινητήρα (kW), μέγιστο φορτίο (kg), κατηγορία σχεδίασης, όνομα κατασκευαστή και σήμανση CE — όλα εμφανίζονται μόνιμα σε μια ανθεκτική στη διάβρωση πινακίδα.
      icon: tabler:badge
content_tech_file:
  tagline: Δομή Τεχνικού Αρχείου
  title: Κύριο τεχνικό αρχείο<br />&Hull Record
  subtitle: 'Το σύστημα τεκμηρίωσής μας ακολουθεί μια δομή δύο επιπέδων: το Master Technical File για κάθε οικογένεια μοντέλων και μεμονωμένα αρχεία Hull για κάθε σκάφος που παράγεται.'
  items:
    - title: Κύριο τεχνικό αρχείο
      description: 'Περιέχει την πλήρη τεκμηρίωση συμμόρφωσης για μια οικογένεια μοντέλων: γενική διάταξη, εκτίμηση κινδύνου, υπολογισμούς ευστάθειας/πλευστότητας, προδιαγραφές υλικού, ισχύοντα πρότυπα και αρχεία αξιολόγησης συμμόρφωσης. Διατηρήθηκε για 10+ χρόνια.'
      icon: tabler:folder
    - title: Ρεκόρ Hull (Ιχνηλασιμότητα ανά σκάφος)
      description: 'Κάθε κύτος έχει ένα μοναδικό αρχείο που το συνδέει με το κύριο τεχνικό αρχείο: HIN, ημερομηνία παραγωγής, παρτίδα σωλήνων, πιστοποιητικά υλικού, αποτέλεσμα δοκιμής πίεσης, τελική διαμόρφωση, εγκατάσταση κινητήρα και προορισμός παράδοσης.'
      icon: tabler:file-description
    - title: Πακέτο Συμμόρφωσης Πελατών
      description: Πακέτο παράδοσης ανά κύτος, που περιλαμβάνει DoC, φωτογραφία πινακίδας κατασκευαστή, εγχειρίδιο κατόχου, περίληψη δοκιμής και φύλλο τελικής διαμόρφωσης — παρέχεται με κάθε RIB που αποστέλλεται στην ΕΕ.
      icon: tabler:package
faq:
  title: Συμμόρφωση CE — Συχνές ερωτήσεις
  questions:
    - q: Είναι όλα τα σκάφη Paddle Board Overstock RIB πιστοποιημένα CE για την αγορά της ΕΕ;
      a: Τα σκάφη RIB στον κατάλογό μας έχουν σχεδιαστεί και τεκμηριωθεί για συμμόρφωση με το RCD 2013/53/EU σύμφωνα με τις ισχύουσες οδηγίες της ΕΕ. Η σήμανση CE ισχύει για κάθε μοντέλο, ανά διαμόρφωση. Επικοινωνήστε μαζί μας για ένα έγγραφο πεδίου συμμόρφωσης για συγκεκριμένο μοντέλο.
    - q: Ποια είναι η διαφορά μεταξύ της συμμόρφωσης RCD και της σήμανσης CE;
      a: Το RCD (Οδηγία 2013/53/ΕΕ για τα σκάφη αναψυχής) είναι η νομοθεσία της ΕΕ που θέτει Βασικές Απαιτήσεις Ασφάλειας. Η σήμανση CE είναι το οπτικό σύμβολο που τοποθετείται σε ένα προϊόν που έχει αξιολογηθεί και επιβεβαιωθεί ότι πληροί αυτές τις απαιτήσεις. Ένα προϊόν πρέπει να συμμορφώνεται με το RCD για να μπορέσει να φέρει το σήμα CE.
    - q: Παρέχετε Δηλώσεις Συμμόρφωσης με κάθε σκάφος;
      a: Ναί. Κάθε σκάφος RIB που παραδίδεται στην αγορά της ΕΕ περιλαμβάνει μια Δήλωση Συμμόρφωσης ΕΕ για συγκεκριμένο μοντέλο, στην οποία αναφέρονται οι ισχύουσες οδηγίες, τα εναρμονισμένα πρότυπα, η ενότητα αξιολόγησης συμμόρφωσης και τα στοιχεία του κοινοποιημένου οργανισμού.
    - q: Ποια ενότητα αξιολόγησης συμμόρφωσης χρησιμοποιεί το Paddle Board Overstock;
      a: Η ενότητα εξαρτάται από την κατηγορία σχεδιασμού και τον τύπο του σκάφους. Τα περισσότερα μοντέλα RIB στην Κατηγορία Σχεδίασης Γ χρησιμοποιούν Ενότητα Α (εσωτερικός έλεγχος παραγωγής). Για σκάφη κατηγορίας σχεδιασμού A/B ή συγκεκριμένες διαμορφώσεις, η Ενότητα B+C ή B+D μπορεί να εφαρμοστεί με τη συμμετοχή κοινοποιημένου φορέα. Συμβουλεύουμε για την κατάλληλη ενότητα ανά έργο.
    - q: Μπορείτε να μοιραστείτε την τεκμηρίωση συμμόρφωσης προτού υποβάλουμε μια παραγγελία;
      a: Μετά από κατάλληλη έρευνα, κοινοποιούμε ένα έγγραφο εύρους συμμόρφωσης που περιλαμβάνει τα ισχύοντα πρότυπα, τη διαδρομή συμμόρφωσης και τους τύπους εγγράφων που είναι διαθέσιμα για το μοντέλο που αξιολογείτε. Τα πλήρη τεχνικά αρχεία κοινοποιούνται στο NDA μετά την επιβεβαίωση της παραγγελίας.
    - q: Τι είναι ο Αριθμός Αναγνώρισης Hull (HIN) και περιλαμβάνεται;
      a: Το HIN είναι ένα μοναδικό αναγνωριστικό 14 χαρακτήρων που επισημαίνεται μόνιμα σε κάθε σκάφος, που κωδικοποιεί τον κωδικό κατασκευαστή (MIC), την ονομασία μοντέλου, το έτος παραγωγής και τον αριθμό σειράς. Είναι υποχρεωτικό για όλα τα σκάφη RIB που διατίθενται στην αγορά της ΕΕ και περιλαμβάνεται σε κάθε Paddle Board Overstock RIB.
    - q: Πόσο καιρό διατηρούνται τα τεχνικά αρχεία;
      a: Σύμφωνα με τις απαιτήσεις RCD 2013/53/ΕΕ, ο κατασκευαστής πρέπει να διατηρεί τον τεχνικό φάκελο για τουλάχιστον 10 χρόνια από την τελευταία ημερομηνία κυκλοφορίας του προϊόντος στην αγορά. Η Paddle Board Overstock διατηρεί πλήρη τεχνική τεκμηρίωση για όλα τα μοντέλα που παράγονται.
    - q: Βοηθάτε με τις υποχρεώσεις των εισαγωγέων βάσει του RCD;
      a: 'Ναί. Παρέχουμε το πακέτο τεκμηρίωσης που χρειάζονται οι εισαγωγείς της ΕΕ για να εκπληρώσουν τις υποχρεώσεις τους: πρόσβαση σε τεχνικό αρχείο, DoC, πινακίδα κατασκευής, εγχειρίδιο κατόχου και αρχεία ιχνηλασιμότητας προϊόντων. Οι ευθύνες των εισαγωγέων στο πλαίσιο του RCD τεκμηριώνονται σαφώς στον οδηγό συμμόρφωσης.'
cta:
  title: Χρειάζεστε ένα εύρος συμμόρφωσης ΕΕ για συγκεκριμένο μοντέλο;
  subtitle: Ζητήστε μια λεπτομερή λίστα ελέγχου συμμόρφωσης για το μοντέλο RIB και τη διαμόρφωση που αξιολογείτε — συμπεριλαμβανομένων των ισχυόντων προτύπων, της διαδρομής συμμόρφωσης και της διαθέσιμης τεκμηρίωσης.
  actions:
    - variant: primary
      text: Ζητήστε Έγγραφα Συμμόρφωσης
      href: /contact
    - text: Προβολή Πιστοποιήσεων
      href: /certifications
content_material_cert:
  tagline: Πιστοποίηση Υλικού
  title: Ιχνηλασιμότητα υλικού &<br />Απόδειξη Πιστοποίησης
  subtitle: Τα ποιοτικά RIB σκάφη ξεκινούν με ελεγχόμενα υλικά και τεκμηριωμένες διαδικασίες. Ακολουθεί ο τρόπος με τον οποίο οργανώνουμε την πιστοποίηση υλικού για κάθε ομάδα κρίσιμων εξαρτημάτων.
  items:
    - title: Ιχνηλασιμότητα υλικού φουσκωτού σωλήνα
      description: Τα υλικά σωλήνων PVC και CSM/Hypalon επιλέγονται σύμφωνα με την προβλεπόμενη χρήση, τις κλιματικές συνθήκες και την αγορά-στόχο. Τεχνικά δεδομένα προμηθευτή (TDS), πληροφορίες παρτίδας υλικού, ιχνηλασιμότητα παρτίδας υφασμάτων, αναφορές δοκιμών UV και καιρικές συνθήκες και δηλώσεις REACH/SVHC είναι διαθέσιμα εντός του συμφωνηθέντος πεδίου τεκμηρίωσης του έργου.
      icon: tabler:circle
    - title: Ιχνηλασιμότητα θαλάσσιου αλουμινίου
      description: Για έργα RIB κύτους αλουμινίου, οι παρτίδες ποιότητας κράματος, πάχους και υλικού ελέγχονται σύμφωνα με τις εγκεκριμένες προδιαγραφές. Πιστοποιητικά δοκιμής υλικού (MTC/MTR), EN 10204 3.1 τεκμηρίωση, αναφορές χημικής σύνθεσης και μηχανικών ιδιοτήτων και ιχνηλασιμότητα θερμότητας/παρτίδας παρέχονται όπου συμφωνείται.
      icon: tabler:rectangle
    - title: GRP Έλεγχος υλικών και διεργασιών κύτους
      description: Για τα RIB από υαλοβάμβακα, το gelcoat, η ρητίνη, ο οπλισμός από υαλοβάμβακα και τα υλικά πυρήνα διαχειρίζονται μέσω ελεγχόμενων προδιαγραφών. Το υλικό TDS/SDS, τα αρχεία παρτίδας, οι προδιαγραφές laminate και τα αρχεία ωρίμανσης και ελέγχου συνεργείου είναι διαθέσιμα κατόπιν συμφωνίας έργου.
      icon: tabler:layers-subtract
    - title: Υποστήριξη τεκμηρίωσης στοιχείων
      description: Για επιλεγμένα εξαρτήματα — συμπεριλαμβανομένων EVA υλικών καταστρώματος, καθισμάτων, υλικού από ανοξείδωτο χάλυβα, συστημάτων καυσίμου, ηλεκτρικού εξοπλισμού και εξαρτημάτων πλοίων — η ισχύουσα τεκμηρίωση προμηθευτή συντονίζεται με βάση την τελική διαμόρφωση και τις απαιτήσεις της αγοράς προορισμού.
      icon: tabler:package
    - title: Σημείωση Πεδίου Συμμόρφωσης
      description: Τα πιστοποιητικά, οι εκθέσεις δοκιμών και τα έγγραφα συμμόρφωσης ισχύουν μόνο για το συγκεκριμένο μοντέλο προϊόντος, υλικό, εξάρτημα, παρτίδα παραγωγής ή το πεδίο εφαρμογής του έργου που αναφέρεται στο σχετικό έγγραφο. Επικοινωνήστε μαζί μας σχετικά με την αγορά-στόχο, την προβλεπόμενη χρήση και τις τεχνικές απαιτήσεις σας, ώστε να επιβεβαιωθεί το ισχύον πακέτο τεκμηρίωσης πριν από την τοποθέτηση της παραγγελίας.
      icon: tabler:info-circle

