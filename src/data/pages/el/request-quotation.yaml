hero_text:
  tagline: Λάβετε μια προσφορά
  title: Ζητήστε μια προσφορά<br />για το έργο σας
  subtitle: Πείτε μας για τις απαιτήσεις σας και η ομάδα μας θα απαντήσει με μια λεπτομερή προσφορά εντός 2 εργάσιμων ημερών.
steps2_process:
  title: Πώς λειτουργεί
  subtitle: Τέσσερα απλά βήματα από την έρευνα έως την προσφορά.
  items:
    - title: 'Βήμα 1: Υποβάλετε τις απαιτήσεις σας'
      description: Συμπληρώστε την παρακάτω φόρμα με τον τύπο, την ποσότητα και τις προδιαγραφές του προϊόντος σας. Όσο περισσότερες λεπτομέρειες παρέχετε, τόσο πιο ακριβής είναι η προσφορά σας.
      icon: tabler:file-text
    - title: 'Βήμα 2: Ελέγχουμε και συμβουλεύουμε'
      description: Η ομάδα μηχανικών μας εξετάζει τις απαιτήσεις σας και μπορεί να επικοινωνήσει μαζί σας για διευκρινίσεις. Παρέχουμε συστάσεις σχετικά με τη διαμόρφωση και τις επιλογές του προϊόντος.
      icon: tabler:users
    - title: 'Βήμα 3: Λάβετε την προσφορά σας'
      description: Λαμβάνετε μια λεπτομερή προσφορά που περιλαμβάνει τιμολόγηση μονάδας, MOQ, χρόνο παράδοσης, όρους πληρωμής και επιλογές αποστολής. Συνήθως εντός 48 ωρών.
      icon: tabler:currency-dollar
    - title: 'Βήμα 4: Δείγμα & Παραγωγή'
      description: Μετά την αποδοχή της προσφοράς, προχωράμε στην παραγωγή δειγμάτων (εάν υπάρχει) ή απευθείας στη μαζική παραγωγή. Τακτικές ενημερώσεις σε όλη τη διαδικασία.
      icon: tabler:building-factory
content_form:
  tagline: Έντυπο προσφοράς
  title: Πείτε μας για το έργο σας
  subtitle: Όλα τα πεδία με * είναι υποχρεωτικά.
  fields:
    - name: Κατηγορία Προϊόντος
      type: επιλέγω
      options:
        - Σκάφος RIB
        - Φουσκωτή βάρκα
        - Σανίδα SUP
        - Φουσκωτό καγιάκ
        - Σωσίβιο
        - Ναυτικό αξεσουάρ
        - Προσαρμοσμένο OEM/ODM
    - name: Εφαρμογή
      type: επιλέγω
      options:
        - Κέντρο καταδύσεων
        - Ψάρεμα
        - Ναυτικός τουρισμός / Θέρετρο
        - Έρευνα και Διάσωση
        - Tender γιοτ
        - Εμπορικό σκάφος εργασίας
        - Κυβέρνηση / Στρατός
        - OEM / Ιδιωτική ετικέτα
        - Προσωπική / Ψυχαγωγική
        - Άλλο
    - name: Ποσότητα
      type: κείμενο
      placeholder: π.χ. 50 μονάδες
    - name: Αγορά Στόχου
      type: κείμενο
      placeholder: π.χ. Ευρώπη, Βόρεια Αμερική, Μέση Ανατολή
    - name: Χώρα παράδοσης
      type: κείμενο
      placeholder: π.χ. Ιταλία, ΗΑΕ, ΗΠΑ, Αυστραλία
    - name: Προτίμηση υλικού
      type: επιλέγω
      options:
        - Χωρίς προτίμηση
        - PVC ναυτικής ποιότητας (1100 dtex)
        - Hypalon premium / CSM
        - Σκάφος από fiberglass
        - Σκάφος από αλουμίνιο
    - name: Απαίτηση κινητήρα
      type: κείμενο
      placeholder: π.χ. Εξωλέμβια 60 HP, χωρίς κινητήρα, διπλή 115 HP
    - name: Απαιτείται προσαρμογή
      type: κείμενο
      placeholder: π.χ. προσαρμοσμένα χρώματα, επωνυμία/λογότυπο, συσκευασία, ειδικά εξαρτήματα
    - name: Χρονολόγιο
      type: κείμενο
      placeholder: π.χ. παράδοση εντός 90 ημερών
    - name: Πρόσθετες Απαιτήσεις
      type: κείμενο
      placeholder: Περιγράψτε την εφαρμογή σας, τις τεχνικές προδιαγραφές ή τυχόν ειδικές απαιτήσεις — συμπεριλάβετε σχέδια αναφοράς, προδιαγραφές ή συνδέσμους, εάν υπάρχουν
    - name: Προδιαγραφές μεταφόρτωσης
      type: αρχείο
      placeholder: Ανεβάστε το φύλλο προδιαγραφών, το σχέδιο ή το έγγραφο αναφοράς (PDF, DWG, DXF)
    - name: Μεταφόρτωση λογότυπου / έργου τέχνης
      type: αρχείο
      placeholder: Ανεβάστε το λογότυπο ή το έργο τέχνης σας για προσαρμοσμένη επωνυμία (AI, EPS, PNG)
content_rfq_types:
  tagline: Σύστημα RFQ 3 επιπέδων
  title: Επιλέξτε το σωστό<br />Επίπεδο διερεύνησης
  subtitle: Τα διαφορετικά έργα χρειάζονται διαφορετικά επίπεδα λεπτομέρειας. Επιλέξτε τη φόρμα που ταιριάζει με το στάδιο αγοράς σας.
  items:
    - title: Γρήγορη έρευνα
      description: 5-6 πεδία, 30 δευτερόλεπτα. Για αρχική επαφή, γενικές ερωτήσεις ή παρακολούθηση πόρων για λήψη. Απαντάμε εντός 24 ωρών με βασικές πληροφορίες και επόμενα βήματα.
      icon: tabler:bolt
    - title: Τυπική RFQ
      description: 8-10 πεδία, 2 λεπτά. Για συγκεκριμένες προσφορές προϊόντων με επιλογή μοντέλου, ποσότητα και απαιτήσεις παράδοσης. Λάβετε μια λεπτομερή προσφορά εντός 48 ωρών.
      icon: tabler:file-text
    - title: RFQ έργου
      description: 10-14 πεδία, 5 λεπτά. Για RIB, στόλο θερέτρου, διάσωσης ή κυβερνητικά έργα που απαιτούν προσαρμοσμένη διαμόρφωση, τεκμηρίωση συμμόρφωσης και πολυετή προγραμματισμό εφοδιασμού. Ανατέθηκε ειδικός διαχειριστής έργου.
      icon: tabler:clipboard-list
form_quick:
  title: Γρήγορη έρευνα
  subtitle: Γρήγορη επικοινωνία για γενικές ερωτήσεις και αιτήματα αρχικών πληροφοριών.
  fields:
    - name: πλήρες όνομα
      label: Ονοματεπώνυμο
      type: κείμενο
      required: true
      placeholder: Το πλήρες όνομά σας
    - name: email επιχείρησης
      label: Email επιχείρησης
      type: e-mail
      required: true
      placeholder: you@company.com
    - name: όνομα εταιρείας
      label: Όνομα εταιρείας
      type: κείμενο
      required: true
      placeholder: Η εταιρεία σας
    - name: αγοραστής Τύπος
      label: Είμαι ένας...
      type: επιλέγω
      required: true
      options:
        - Διανομέας / Εισαγωγέας
        - Ιδιοκτήτης μάρκας / Ιδιωτική ετικέτα
        - Θέρετρο / Κέντρο θαλάσσιων σπορ
        - Εταιρεία ενοικίασης
        - Κυβέρνηση / Οργανισμός Διάσωσης
        - Επιχείρηση καταδύσεων / ψαρέματος
        - Μηχανικός ναυτιλίας / refit
        - Άλλο
    - name: προϊόν Ενδιαφέρον
      label: Ενδιαφέρον προϊόντος
      type: πολυεπιλογή
      required: true
      options:
        - Σκάφη RIB
        - Φουσκωτές βάρκες
        - Σανίδες SUP
        - Εξοπλισμός ασφαλείας
        - Αξεσουάρ
        - Προσαρμοσμένο OEM/ODM
    - name: μήνυμα
      label: Τι χρειάζεσαι;
      type: κείμενο
      required: false
      placeholder: Σύντομη περιγραφή των απαιτήσεών σας...
form_standard:
  title: Τυπική RFQ
  subtitle: Αναλυτική αίτηση προσφοράς για συγκεκριμένα προϊόντα και ποσότητες.
  fields:
    - name: πλήρες όνομα
      label: Ονοματεπώνυμο
      type: κείμενο
      required: true
    - name: email επιχείρησης
      label: Email επιχείρησης
      type: e-mail
      required: true
    - name: όνομα εταιρείας
      label: Όνομα εταιρείας
      type: κείμενο
      required: true
    - name: αγοραστής Τύπος
      label: Τύπος αγοραστή
      type: επιλέγω
      required: true
    - name: μοντέλο προϊόντος
      label: Μοντέλο / Τύπος προϊόντος
      type: κείμενο
      required: true
      placeholder: π.χ., AF580 RIB, AF380 Φουσκωτό
    - name: ποσότητα
      label: Εκτιμώμενη Ποσότητα
      type: κείμενο
      required: true
      placeholder: π.χ., 10-20 μονάδες
    - name: αγορά στόχου
      label: Αγορά/Περιοχή-στόχος
      type: κείμενο
      required: true
      placeholder: π.χ. ΕΕ, Βόρεια Αμερική, Μέση Ανατολή
    - name: Χρονοδιάγραμμα παράδοσης
      label: Επιθυμητή Παράδοση
      type: επιλέγω
      required: true
      options:
        - Εντός 30 ημερών
        - 30-60 ημέρες
        - 60-90 ημέρες
        - Προγραμματισμός εκ των προτέρων (90+ ημέρες)
        - Απλή έρευνα
    - name: Συμμόρφωση Απαιτείται
      label: Απαιτήσεις συμμόρφωσης
      type: πολυεπιλογή
      required: false
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - USCG
        - ISO 9001
        - BSCI
        - REACH
        - Καμία / Δεν είμαι σίγουρος
    - name: μήνυμα
      label: Πρόσθετες λεπτομέρειες
      type: κείμενο
      required: false
form_project:
  title: RFQ έργου
  subtitle: Ολοκληρωμένη έρευνα έργου για στόλους, τελωνειακές ή κρατικές προμήθειες.
  fields:
    - name: πλήρες όνομα
      label: Ονοματεπώνυμο
      type: κείμενο
      required: true
    - name: email επιχείρησης
      label: Email επιχείρησης
      type: e-mail
      required: true
    - name: όνομα εταιρείας
      label: Όνομα εταιρείας
      type: κείμενο
      required: true
    - name: αγοραστής Τύπος
      label: Τύπος αγοραστή
      type: επιλέγω
      required: true
    - name: Τύπος έργου
      label: Τύπος έργου
      type: επιλέγω
      required: true
      options:
        - Στόλος θερέτρου / ξενοδοχείου
        - Στόλος ενοικίασης
        - Στόλος διάσωσης / περιπόλου
        - Στόλος κέντρου καταδύσεων
        - Κρατικές προμήθειες
        - Ιδιωτική ετικέτα / OEM
        - Παραγγελία αποθέματος αντιπροσώπου
        - Άλλο
    - name: Τύποι σκαφών
      label: Απαιτούνται τύποι σκαφών
      type: πολυεπιλογή
      required: true
      options:
        - Σκάφη RIB
        - Φουσκωτές βάρκες / dinghy
        - Σανίδες SUP
        - Καγιάκ
        - Εξοπλισμός ασφαλείας
    - name: Μέγεθος στόλου
      label: Μέγεθος στόλου / Εύρος ποσότητας
      type: κείμενο
      required: true
      placeholder: π.χ. 20-50 μονάδες σε 12 μήνες
    - name: προσαρμοσμένες απαιτήσεις
      label: Ανάγκες προσαρμοσμένης διαμόρφωσης
      type: κείμενο
      required: false
      placeholder: Μέγεθος κύτους, υλικό σωλήνα, διάταξη καταστρώματος, απαιτήσεις επωνυμίας...
    - name: Συμμόρφωση Απαιτείται
      label: Απαιτήσεις Συμμόρφωσης & Πιστοποίησης
      type: πολυεπιλογή
      required: true
      options:
        - CE / RCD 2013/53/EU
        - UKCA
        - USCG Type III/V
        - ISO 9001
        - BSCI
        - REACH / RoHS
        - Πιστοποίηση τοπικής αγοράς
    - name: αγορά στόχου
      label: Αγορά Στόχου
      type: κείμενο
      required: true
    - name: Εύρος προϋπολογισμού
      label: Εύρος προϋπολογισμού
      type: επιλέγω
      required: false
      options:
        - Κάτω από $10,000
        - $10,000 - $50,000
        - $50,000 - $200,000
        - $200,000+
        - Προτιμώ να μην πω
    - name: Χρονοδιάγραμμα παράδοσης
      label: Χρονοδιάγραμμα έργου
      type: επιλέγω
      required: true
      options:
        - Επείγον (εντός 30 ημερών)
        - Standard (30-60 ημέρες)
        - Προγραμματισμένο (60-90 ημέρες)
        - Μελλοντικός προγραμματισμός (90+ ημέρες)
    - name: μήνυμα
      label: Λεπτομέρειες & Απαιτήσεις Έργου
      type: κείμενο
      required: false
      placeholder: Περιγράψτε το έργο σας, την εφαρμογή σας και τυχόν συγκεκριμένες απαιτήσεις...
cta:
  title: Προτιμάτε να συζητάτε μέσω email;
  subtitle: Στείλτε το ερώτημά σας απευθείας στην ομάδα πωλήσεών μας και θα απαντήσουμε εντός 24 ωρών.
  actions:
    - variant: primary
      text: Στείλτε μας απευθείας email
      href: /contact
