hero:
  tagline: Οδηγοί
  title: Νέος στο SUP;
  subtitle: Πρακτικοί οδηγοί που θα σας βοηθήσουν να επιλέξετε, να χρησιμοποιήσετε και να απολαύσετε φουσκωτό εξοπλισμό θαλάσσιων σπορ.
size_guide:
  tagline: Μέγεθος & Προδιαγραφές
  title: Βρείτε το κατάλληλο μέγεθος για τις ανάγκες σας
  desc: Συγκρίνετε τις διαστάσεις του προϊόντος, τις χωρητικότητες βάρους και τις προτεινόμενες χρήσεις. Είτε χρειάζεστε ένα τουριστικό SUP, ένα συμπαγές καγιάκ ή ένα εμπορικό RIB — ο οδηγός μεγέθους σάς βοηθά να επιλέξετε τη σωστή εφαρμογή.
  link_label: Οδηγός πλήρους μεγέθους με προδιαγραφές προϊόντος →
  link: /size-guide
  cards:
    - title: Πίνακες SUP
      desc: Επιλέξτε μήκος με βάση το βάρος σας και την προβλεπόμενη χρήση. Οι πιο φαρδιές σανίδες (32"+) προσφέρουν μεγαλύτερη σταθερότητα. Οι μεγαλύτερες σανίδες (11–12 πόδια) ακολουθούν καλύτερα για περιηγήσεις.
    - title: Καγιάκ
      desc: Μονά καγιάκ (9 πόδια) για σόλο ταξίδια και ποτάμια. Ταντέμ καγιάκ (12 πόδια) για δύο κωπηλάτες ή έναν με εξοπλισμό. Ελέγχετε πάντα την ικανότητα βάρους.
    - title: Βάρκες & RIB
      desc: Επιλέξτε μήκος ανά αριθμό επιβατών και χρήση. Μεγαλύτερα RIB (4,5 m+) για υπεράκτια και διάσωση. Μικρότερες λέμβοι (2,7 μ.) ως τρυφερές και εξέδρες ψαρέματος.
