rd_services:
  tagline: Προσαρμοσμένη Ε&Α
  title: Υπηρεσίες Ε&Α για συνεργάτες
  services:
    - title: Ανάπτυξη προσαρμοσμένων υλικών
      desc: Αναπτύσσουμε προσαρμοσμένες συνθέσεις υφασμάτων, στοιβάδες laminate και συστήματα κόλλας προσαρμοσμένα στο λειτουργικό σου περιβάλλον και τους στόχους απόδοσης.
    - title: Μηχανική προϊόντος OEM / ODM
      desc: Από σκίτσα ιδεών έως πακέτα μηχανικής έτοιμα για παραγωγή — η ομάδα μας μπορεί να σχεδιάσει, να πρωτοτυπήσει και να δοκιμάσει σκάφη με τη δική σου μάρκα.
    - title: Δοκιμές και πιστοποίηση τρίτων
      desc: Χρησιμοποίησε τις συμβατές με ISO εγκαταστάσεις δοκιμών μας για ανεξάρτητες δοκιμές υλικών, επικύρωση προϊόντων και υποστήριξη πιστοποίησης.
  cta: Συζήτησε τις απαιτήσεις Ε&Α σου →
  cta_link: /contact

vision:
  tagline: Το όραμά μας
  title: Διαμορφώνοντας το μέλλον των θαλάσσιων σπορ
  body: Η Paddle Board Overstock φιλοδοξεί να ηγηθεί της βιομηχανίας φουσκωτών σκαφών και SUP μέσω συνεχούς καινοτομίας, ακλόνητης ποιότητας και σταθερής δέσμευσης στην ασφάλεια και τη βιωσιμότητα — εμπλουτίζοντας τελικά τις εμπειρίες των λάτρεων των θαλάσσιων σπορ παγκοσμίως. Το Κέντρο Ε&Α της Paddle Board Overstock είναι το μέρος όπου το πάθος συναντά την καινοτομία, θέτοντας νέα πρότυπα για τη βιομηχανία θαλάσσιων σπορ.

labs_section:
  tagline: Εργαστήρια
  title: Τα εργαστήριά μας
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: Εργαστήριο υφασμάτων PVC
      description: Συνεχής έρευνα και δοκιμές υφασμάτων σωλήνων PVC και Hypalon για αντοχή εφελκυσμού, αντοχή UV, τριβή και ευκαμψία σε χαμηλές θερμοκρασίες για διασφάλιση μακροπρόθεσμης αξιοπιστίας σε θαλάσσια περιβάλλοντα.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Στούντιο μηχανικής γάστρας
      description: Σχεδιασμός με CAD και ανάλυση πεπερασμένων στοιχείων για γάστρες HDPE, αλουμινίου και υαλοβάμβακα. Κάθε γάστρα προσομοιώνεται ψηφιακά για κατανομή τάσεων και αντοχή σε κρούση πριν από την κατασκευή του πρώτου πρωτοτύπου.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: Κέντρο συγκόλλησης RF
      description: Αποκλειστική εγκατάσταση συγκόλλησης ραδιοσυχνοτήτων με ακριβή έλεγχο θερμοκρασίας και πίεσης, παράγοντας ραφές υψηλής αντοχής και στεγανότητας που υπερβαίνουν τα πρότυπα ISO 6185 για πνευματικά σκάφη.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Υδροδυναμική δεξαμενή δοκιμών
      description: Δοκιμές σε μοντέλα κλίμακας στην εσωτερική μας δεξαμενή δοκιμών για βελτιστοποίηση σχήματος γάστρας, απόδοσης ολίσθησης, σταθερότητας και κατανάλωσης καυσίμου σε διάφορα φορτία και θαλάσσιες συνθήκες.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Εργαστήριο πρωτοτύπων
      description: Εγκατάσταση πρωτοτυποποίησης και εξοπλισμού πλήρους κλίμακας όπου κατασκευάζονται, συναρμολογούνται και δοκιμάζονται νέα μοντέλα. Κάθε πρωτότυπο υποβάλλεται σε τουλάχιστον 20 ώρες δοκιμών στο νερό πριν από την έγκριση παραγωγής.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Εργαστήριο ποιότητας και επιθεώρησης
      description: Αποκλειστικό εργαστήριο διασφάλισης ποιότητας που εκτελεί δοκιμές εφελκυσμού, κύκλους συγκράτησης αέρα, δοκιμές αποκόλλησης ραφών και πιστοποίηση υλικών για να διασφαλίσει ότι κάθε σκάφος που φεύγει από το εργαστήριο πληροί τις δημοσιευμένες προδιαγραφές μας.
      href: /randdcenter/quality-inspection-lab
