hero:
  tagline: Κέντρο Ε&Α
  title: Κέντρο Ε & Α
  subtitle: Εστιασμένοι στην πρόοδο

intro:
  - Το Κέντρο Έρευνας και Ανάπτυξης (Ε&Α) της Paddle Board Overstock είναι η κινητήρια δύναμη πίσω από την αποστολή μας να φέρουμε επανάσταση στον εξοπλισμό θαλάσσιων σπορ. Ενδυναμώνουμε τους λάτρεις των θαλάσσιων σπορ παγκοσμίως με ασφαλέστερα, πιο άνετα και πιο ευχάριστα προϊόντα μέσω αδιάκοπης καινοτομίας σε φουσκωτές σανίδες SUP και σκάφη. Η αφοσιωμένη ομάδα μηχανικών, σχεδιαστών και λάτρεων των θαλάσσιων σπορ διαμορφώνει το μέλλον της βιομηχανίας, ανεβάζοντας συνεχώς τον πήχη της ποιότητας, απόδοσης και βιωσιμότητας.
  - Η εγκατάσταση Ε&Α μας συνδυάζει επιστήμονες υλικών, ναυπηγούς μηχανικούς και μηχανικούς παραγωγής κάτω από μία στέγη. Από τη σύνθεση υφασμάτων και την προσομοίωση γάστρας έως την ανάπτυξη διαδικασιών συγκόλλησης και δοκιμές πλήρους κλίμακας στη θάλασσα — κάθε στάδιο ανάπτυξης προϊόντος καθοδηγείται από δεδομένα και επικυρώνεται μέσω δοκιμών.

mission:
  tagline: Η αποστολή μας
  title: Καινοτομώντας το μέλλον των θαλάσσιων σπορ
  pillars:
    - icon: lightning
      title: Τεχνολογική πρόοδος
      desc: Εισαγωγή νέων υλικών, σχεδίων και διαδικασιών παραγωγής για καλύτερη απόδοση και ανθεκτικότητα προϊόντων.
    - icon: design
      title: Σχεδιασμός με γνώμονα τον χρήστη
      desc: Βαθιά κατανόηση και υπέρβαση των αναγκών των χρηστών μέσω εργονομικού και διαισθητικού σχεδιασμού προϊόντων.
    - icon: globe
      title: Βιώσιμες πρακτικές
      desc: Ελαχιστοποίηση του περιβαλλοντικού μας αποτυπώματος μέσω της χρήσης οικολογικών υλικών και διαδικασιών.
    - icon: shield
      title: Ακλόνητη ασφάλεια
      desc: Διασφάλιση των υψηλότερων προτύπων ασφαλείας μέσω αυστηρών δοκιμών και πιστοποίησης.

pillars:
  - title: Τεχνολογική πρόοδος
    desc: Εισαγωγή νέων υλικών, σχεδίων και διαδικασιών παραγωγής για την παροχή καλύτερης απόδοσης και ανθεκτικότητας προϊόντων.
    icon: tech
  - title: Προηγμένα υλικά
    desc: Έρευνα αιχμής σε PVC, Hypalon, σύνθετα υλικά και βιώσιμες εναλλακτικές για βελτιωμένες ιδιότητες προϊόντων.
    icon: materials
  - title: Βιωσιμότητα
    desc: 'Θεμελιώδης δέσμευση: Είμαστε αφοσιωμένοι στην περιβαλλοντική ευθύνη μέσω βιώσιμης παραγωγής και ανακυκλώσιμων υλικών.'
    icon: sustainability

capabilities:
  tagline: Δυνατότητες
  title: Δυνατότητες Ε&Α
  subtitle: Τέσσερις βασικοί κλάδοι που μας δίνουν πλήρη έλεγχο της ανάπτυξης προϊόντων — από την έρευνα πρώτων υλών έως την τελική πιστοποίηση.
  groups:
    - title: Επιστήμη υλικών και τεχνολογία υφασμάτων
      items:
        - Ανάλυση και βελτιστοποίηση συνθέσεων PVC και Hypalon
        - Ανάπτυξη σταθεροποίησης UV, επιβραδυντικών φλόγας και αντιβακτηριακών πρόσθετων
        - Μηχανική πλαστικοποίησης και πρόσφυσης πολυστρωματικών υφασμάτων
        - Επιταχυνόμενες δοκιμές γήρανσης (UV, θερμικές, υγρασία, αλατονέφωση)
    - title: Μηχανική γάστρας και υδροδυναμική
      items:
        - Παραμετρικός σχεδιασμός 3D γάστρας και βελτιστοποίηση CFD
        - Ανάλυση πεπερασμένων στοιχείων για δομικά φορτία και κρούσεις
        - Δοκιμές σε δεξαμενή ρυμούλκησης με μοντέλα κλίμακας και επικύρωση απόδοσης
        - Ανάπτυξη προσαρμοσμένων γαστρών για ειδικά προφίλ αποστολής
    - title: Τεχνολογία συγκόλλησης και σύνδεσης
      items:
        - Ανάπτυξη και βελτιστοποίηση διεργασιών συγκόλλησης RF (διηλεκτρικής)
        - Μέθοδοι συγκόλλησης θερμού αέρα, θερμής σφήνας και υπερήχων
        - Πιστοποίηση κόλλησης και ταινιών ραφής
        - Μοντελοποίηση αντοχής συγκολλήσεων και πρόβλεψη διάρκειας ζωής
    - title: Δοκιμές, πιστοποίηση και συμμόρφωση
      items:
        - Δοκιμές συμμόρφωσης , και CE
        - Ανεξάρτητες δοκιμές τρίτων και υποστήριξη πιστοποίησης
        - Ανάπτυξη προσαρμοσμένων πρωτοκόλλων δοκιμών για πιστοποίηση προμηθειών
        - Ανάλυση αποτυχιών σε λειτουργία και διερεύνηση βαθύτερων αιτιών

