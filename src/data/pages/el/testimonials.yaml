testimonials:
  - category: συλλόγους
    name: Ρικάρντο Σάντος
    title: Ιδιοκτήτης, Algarve Surf Academy
    location: Λάγος, Πορτογαλία
    content: Ξεκινήσαμε με το Club Starter Package για τη σχολή μας σερφ. 20 σανίδες, κουπιά, γιλέκα — όλα έφτασαν μέσα σε 3 εβδομάδες. Μετά από δύο σεζόν, αναβαθμίσαμε στο πακέτο Pro. Η προσαρμοσμένη επωνυμία με το λογότυπό μας άλλαξε το παιχνίδι για την επαγγελματική μας εικόνα.
    rating: 5
    product: Club Starter πακέτο
    source: solutions/clubs
  - category: συλλόγους
    name: Ιδιοκτήτης Λέσχης
    title: Λέσχη Θαλάσσιων Σπορ
    location: Πουκέτ, Ταϊλάνδη
    content: Το Club Starter Package ήταν το τέλειο σημείο εισόδου. Καθώς η επιχείρησή μας μεγάλωνε, η Paddle Board Overstock αναπτύχθηκε μαζί μας — ίδια ποιότητα, ίδια τιμολόγηση, χωρίς εκπλήξεις. Κλιμακώσαμε από 10 σε 80 σανίδες σε 18 μήνες.
    rating: 5
    product: Club Starter + Πακέτο Premium
    source: success-stories
  - category: θέρετρα
    name: Γενικός Διευθυντής Resort
    title: Παραθαλάσσιο θέρετρο 5 αστέρων
    location: Ελλάδα
    content: Το Paddle Board Overstock δεν παρέδωσε απλώς σανίδες - μας βοήθησε να δημιουργήσουμε μια ολοκληρωμένη εμπειρία επισκέπτη. Το πρόγραμμά μας για θαλάσσια σπορ πήγε από το μηδέν στο θέρετρο σε μια σεζόν. 300+ εβδομαδιαίες κρατήσεις και 180.000 $ σε ετήσια έσοδα.
    rating: 5
    product: Resort Premium Πακέτο
    source: success-stories
  - category: θέρετρα
    name: Σοφί Λοράν
    title: Διευθυντής του Guest Experience, Azure Bay Resorts
    location: Πουκέτ, Ταϊλάνδη
    content: Η Paddle Board Overstock σχεδίασε και εξόπλισε ολόκληρο το πρόγραμμα δραστηριοτήτων στην παραλία σε τρία θέρετρα. 80 SUP, 40 καγιάκ, υποδομές ασφαλείας και εκπαίδευση προσωπικού — όλα παραδίδονται σε μία αποστολή. Η συμμετοχή των καλεσμένων αυξήθηκε κατά 60% την πρώτη σεζόν.
    rating: 5
    product: Resort Premium Πακέτο
    source: solutions/resorts
  - category: επιχειρηματίες
    name: Μάικλ Παρκ
    title: Ιδρυτής, Shoreline Paddle Co.
    location: Καλιφόρνια, ΗΠΑ
    content: Ξεκίνησα την επωνυμία μου SUP με μηδενική εμπειρία στον κλάδο. Η ομάδα του Paddle Board Overstock με καθοδήγησε από την επιλογή προϊόντων μέχρι το σχεδιασμό και τη συσκευασία προσαρμοσμένου λογότυπου. Το πρώτο μου κοντέινερ έφτασε σε 11 εβδομάδες και εξαντλήθηκα σε 3 μήνες στο Amazon.
    rating: 5
    product: Έναρξη έναρξης επωνυμίας
    source: solutions/entrepreneurs
  - category: επιχειρηματίες
    name: Ιδρυτής
    title: Αυστραλιανή μάρκα SUP
    location: Αυστραλία
    content: Είχα την ιδέα της επωνυμίας αλλά μηδενική γνώση κατασκευής. Το Paddle Board Overstock κυριολεκτικά μου κράτησε το χέρι σε όλη τη διαδικασία — από την επιλογή του σωστού σχεδίου σανίδας μέχρι την αποσυσκευασία της πρώτης μου αποστολής. 90 ημέρες από το όνειρο μέχρι την παράδοση.
    rating: 5
    product: Πακέτο εκκίνησης επωνυμίας
    source: success-stories
  - category: ενοικίου
    name: Daniel Okonkwo
    title: Ιδιοκτήτης, Lakeland SUP Rentals
    location: Οντάριο, Καναδάς
    content: Νοίκιαζα 5 σανίδες από ένα τοπικό κατάστημα και έχανα το 60% των εσόδων μου σε αυτές. Η Paddle Board Overstock με βοήθησε να φτιάξω τον δικό μου στόλο με 15 SUP. Ο υπολογιστής απόδοσης επένδυσης έδειξε το νεκρό σημείο σε 4 μήνες — χρειάστηκαν 3. Τώρα επεκτείνω σε 30 πίνακες.
    rating: 5
    product: Κιτ εκκίνησης στόλου
    source: solutions/rental-business
  - category: ενοικίου
    name: Μάρκο Βαλέντι
    title: Διευθυντής Επιχειρήσεων, Adriatic Adventure Tours
    location: Ντουμπρόβνικ, Κροατία
    content: Εξοπλίσαμε ολόκληρο τον ενοικιαζόμενο στόλο μας με Paddle Board Overstock RIB — 12 σκάφη σε τρεις τοποθεσίες. Δύο σεζόν μέσα, μηδέν αποτυχίες. Η τεκμηρίωση πιστοποίησης CE έκανε απρόσκοπτη την ασφαλιστική έγκριση. Η ομάδα μηχανικών τους προσάρμοσε ακόμη και τα χρώματα των σωλήνων.
    rating: 5
    product: Κιτ επέκτασης στόλου
    source: trust
  - category: ενοικίου
    name: Υποπλοίαρχος Andres Reyes
    title: Υπεύθυνος ναυτιλιακών προμηθειών, βοηθός ακτοφυλακής Φιλιππίνων
    location: Μανίλα, Φιλιππίνες
    content: Λειτουργούμε 24 Paddle Board Overstock RIB σε όλο τον στόλο ακτοπλοϊκών περιπολιών μας. Η διαδικασία QC τους είναι συνεπής σε κάθε παρτίδα — ίδια ποιότητα ραφής, ίδια τοποθέτηση βαλβίδων, ίδια ονομαστική πίεση κάθε φορά. Αυτή η επαναληψιμότητα έχει σημασία όταν οι ζωές εξαρτώνται από τον εξοπλισμό.
    rating: 5
    product: Στόλος περιπολίας RIB
    source: trust
  - category: καταναλωτές
    name: Σάρα Κ.
    title: Ιδιοκτήτης για πρώτη φορά SUP
    location: Λίμνη Tahoe, ΗΠΑ
    content: Σταθερό ακόμα και για έναν εντελώς αρχάριο. Το έβγαλα στη λίμνη την πρώτη μου μέρα και δεν έπεσε ποτέ. Η πλήρης συσκευασία με αντλία και κουπί σήμαινε ότι ήμουν στο νερό 20 λεπτά μετά το άνοιγμα του κουτιού.
    rating: 5
    product: SUP Explorer 11
  - category: καταναλωτές
    name: Τζέιμς Θόρντον
    title: Κάτοχος SUP Explorer 11
    location: Βανκούβερ, Καναδάς
    content: Ως αγοραστής για πρώτη φορά, ήμουν νευρικός για την ποιότητα των παραγγελιών από το εξωτερικό. Η τεκμηρίωση ISO και οι αναφορές δοκιμών τρίτων που μοιράστηκαν πριν καν ρωτήσω μου έδωσαν απόλυτη εμπιστοσύνη. Το ταμπλό έφτασε σε 6 ημέρες και ξεπέρασε τις προσδοκίες μου.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: καταναλωτές
    name: Μάικ Ρ.
    title: Καγιάκ αναψυχής
    location: Φλόριντα, ΗΠΑ
    content: Στιβαρή ποιότητα κατασκευής. Χειρίζεται την παράκτια μπριζόλα πολύ καλύτερα από ό,τι περίμενα από ένα φουσκωτό. Το έβαλα στο πορτμπαγκάζ του αυτοκινήτου μου για ένα ταξίδι το Σαββατοκύριακο — φουσκωμένο στη ράμπα σε λιγότερο από 4 λεπτά.
    rating: 5
    product: Φουσκωτό καγιάκ
