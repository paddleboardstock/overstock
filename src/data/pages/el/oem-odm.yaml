process_steps:
  title: Διαδικασία 6 Βημάτων OEM/ODM
  subtitle: Από τη σύντομη περιγραφή σχεδίασης έως το FOB Qingdao — μια ομαλή ροή εργασιών
  steps:
    - number: '01'
      title: Σχέδιο Περιγραφής & 3D CAD Σχεδίαση
      description: Μοιραστείτε τις στοχευμένες προδιαγραφές σας, το προϊόν αναφοράς ή την ιδέα σας. Η ομάδα μηχανικών μας αναπτύσσει λεπτομερή σχέδια CAD και 3D απεικονίσεις για την έγκρισή σας.
      timeline: 3-5 ημέρες
    - number: '02'
      title: Επιλογή Υλικού & Δοκιμή Υφάσματος
      description: Επιλέξτε από υλικά στρατιωτικής ποιότητας PVC (0,9–1,2 mm), Hypalon CSM, ή drop-stitch πυρήνα. Εκτελούμε δοκιμές εφελκυστικής αντοχής, πρόσφυσης επίστρωσης, και UV σταθερότητας.
      timeline: 2-3 ημέρες
    - number: '03'
      title: Ταχεία Κατασκευή Πρωτοτύπων & Παραγωγή Δειγμάτων
      description: Κατασκευάζουμε καλούπια προσαρμοσμένα σε CNC-μηχανή και παράγουμε δείγματα προπαραγωγής με τα χρώματα της μάρκας σας, το λογότυπο και τα καθορισμένα υλικά. Τα δείγματα αποστέλλονται για την έγκρισή σας.
      timeline: 7-14 ημέρες
    - number: '04'
      title: Δοκιμή Υψηλής Πίεσης για 24–48 Ώρες
      description: Κάθε πρωτότυπο υποβάλλεται σε αυστηρές δοκιμές διατήρησης της πίεσης σε 1,25 φορές την ονομαστική πίεση. Πραγματοποιούνται δοκιμές αποκόλλησης ραφής και επαλήθευση διαστάσεων.
      timeline: 1–2 μέρες
    - number: '05'
      title: Έλεγχος Ποιότητας & Συσκευασία CE/ISO
      description: Λίστα ελέγχου ποιότητας 100 σημείων. Κάθε μονάδα ελέγχεται πριν από τη συσκευασία έτοιμη για λιανική πώληση. Περιλαμβάνονται δήλωση συμμόρφωσης CE και αναφορά συμμόρφωσης BSCI.
      timeline: 2-3 ημέρες
    - number: '06'
      title: Αποστολή & Logistics FOB Qingdao
      description: Τα τελικά προϊόντα παλετοποιημένα, τυλιγμένα σε συρρικνωμένη μεμβράνη και φορτωμένα σε κοντέινερ στο λιμάνι Qingdao. Πλήρης εξαγωγική τεκμηρίωση, εκτελωνισμός και παρακολούθηση σε πραγματικό χρόνο.
      timeline: 7-14 ημέρες
