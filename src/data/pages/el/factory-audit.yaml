content_priorities:
  tagline: Τι επαληθεύουν οι πελάτες
  title: 8 πράγματα που επαληθεύουν οι αγοραστές<br />σε κάθε επίσκεψη στο εργοστάσιο
  subtitle: Με βάση τα σχόλια από 50+ αγοραστές χωρών, αυτές είναι οι οκτώ προτεραιότητες που αξιολογούν οι πελάτες πριν υποβάλουν μια παραγγελία B2B.
  items:
    - title: Πραγματικός Κατασκευαστής
      description: 'Είστε το πραγματικό εργοστάσιο, όχι μια εμπορική εταιρεία; Οι αγοραστές ελέγχουν: επιχειρηματική οντότητα, πραγματικός εξοπλισμός παραγωγής, εργαζόμενοι που χειρίζονται μηχανές, τρέχουσες παραγγελίες παραγωγής στο πάτωμα και συνέπεια ιστότοπου-εργαστηρίου.'
      icon: tabler:building-factory
    - title: Προϊόν κατάλληλο για εφαρμογή
      description: Ταιριάζει το RIB στη συγκεκριμένη περίπτωση χρήσης; Οι χειριστές θερέτρου, διάσωσης, καταδύσεων, ψαρέματος και περιπολίας έχουν θεμελιωδώς διαφορετικές απαιτήσεις. Οι αγοραστές αξιολογούν τη διάταξη του καταστρώματος, το υλικό σωλήνα και τις επιλογές εξοπλισμού στο εμφανιζόμενο σκάφος.
      icon: tabler:target
    - title: Ποιοτική Σταθερότητα & Αναπαραγωγιμότητα
      description: Είναι η 50η μονάδα τόσο καλή όσο η 1η; Οι αγοραστές εξετάζουν συστήματα QC, σημεία ελέγχου κατά τη διαδικασία, χειρισμό μη συμμόρφωσης και ζητούν να δουν αρχεία από πολλαπλές σειρές παραγωγής για να επαληθεύσουν τη συνέπεια.
      icon: tabler:repeat
    - title: Αυθεντικότητα εγγράφου συμμόρφωσης
      description: Είναι τα πιστοποιητικά CE ειδικά για το μοντέλο; Το DoC υπογράφεται από υπαρκτό πρόσωπο; Μπορεί να επαληθευτεί η συμμόρφωση ανά αριθμό κύτους; Οι αγοραστές ελέγχουν για γενικές αξιώσεις σε σχέση με την τεκμηρίωση για συγκεκριμένο μοντέλο.
      icon: tabler:file-certificate
    - title: Εκτέλεση προσαρμογής
      description: Μπορεί το εργοστάσιο να παραδώσει πραγματικά προσαρμοσμένες διαμορφώσεις; Οι αγοραστές αναζητούν αποδεικτικά στοιχεία προηγούμενων προσαρμοσμένων έργων, πρωτότυπα δείγματα που εμφανίζονται, μηχανικά σχέδια και τη δυνατότητα να συζητούν επί τόπου τεχνικές τροποποιήσεις.
      icon: tabler:adjustments
    - title: Χρόνος και χωρητικότητα παράδοσης
      description: 'Είναι ρεαλιστικά τα αναφερόμενα χρονοδιαγράμματα; Οι αγοραστές αξιολογούν: τον τρέχοντα όγκο παραγωγής, τη διαθέσιμη δυναμικότητα, το μέγεθος του εργατικού δυναμικού, τα επίπεδα αποθεμάτων υλικών και εάν το εργοστάσιο διαθέτει σύστημα προγραμματισμού παραγωγής.'
      icon: tabler:clock
    - title: Τιμή & Όροι Εμπορίου
      description: 'Οι τιμές είναι διαφανείς; Είναι σαφής η τιμολόγηση FOB; Οι αγοραστές επαληθεύουν: ανάλυση τιμής μονάδας, κόστος εργαλείων, κόστος συσκευασίας και εάν το εργοστάσιο μπορεί να χειριστεί τους όρους DDP ή CIF με την κατάλληλη τεκμηρίωση εξαγωγής.'
      icon: tabler:currency-dollar
    - title: Μεταπωλήσεις & Ανταλλακτικά
      description: 'Τι συμβαίνει μετά την παράδοση; Οι αγοραστές αξιολογούν: διαθεσιμότητα ανταλλακτικών, διαδικασία εγγύησης, τμήματα σωλήνων αντικατάστασης, αντικατάσταση βαλβίδων και εάν το εργοστάσιο διαθέτει τεκμηριωμένο πρωτόκολλο μετά την πώληση.'
      icon: tabler:headset
content_tour:
  tagline: Διαδρομή περιήγησης στο εργοστάσιο
  title: Περιήγηση ελέγχου —<br />Τι θα δείτε
  subtitle: Η τυπική μας περιήγηση στο εργοστάσιο ακολουθεί μια καθορισμένη διαδρομή που έχει σχεδιαστεί για να απαντά σε ερωτήσεις αγοραστών σε κάθε σταθμό.
  items:
    - title: 1. Αίθουσα συνεδριάσεων — Εισαγωγή εταιρείας
      description: Επιχειρηματική άδεια, πιστοποιητικά ISO 9001 και BSCI, άδειες εξαγωγής και ιστορικό εταιρείας. Γρήγορη επισκόπηση των δυνατοτήτων παραγωγής και του πεδίου συμμόρφωσης.
      icon: tabler:users
    - title: 2. Αποθήκη Πρώτων Υλών — Σταθμός IQC
      description: Αρχεία επιθεώρησης εισερχόμενων υλικών, πιστοποιητικά παρτίδας υφασμάτων, κόλλες και δείγματα υλικού. Δείτε πώς ελέγχονται τα υλικά πριν ξεκινήσετε την παραγωγή.
      icon: tabler:building-warehouse
    - title: 3. Κατασκευή σωλήνων — Συγκόλληση με ραδιοσυχνότητες και κόλληση χειρός
      description: Διαδικασία συγκόλλησης ή κόλλησης ζωντανού σωλήνα, επιδείξεις δοκιμής αντοχής ραφής και εγκατάσταση βαλβίδας. Παρατηρήστε θάλαμο προς θάλαμο την κατασκευή και τα σημεία ελέγχου ποιότητας.
      icon: tabler:flame
    - title: 4. Πλαστικοποίηση γάστρας — Εργαστήριο GRP
      description: Διαδικασία τοποθέτησης υαλοβάμβακα, εφαρμογή gelcoat και σκλήρυνση της γάστρας. Δείτε το πρόγραμμα πλαστικοποίησης και τη δομική ενίσχυση για διαφορετικά μοντέλα RIB.
      icon: tabler:layers-subtract
    - title: 5. Συναρμολόγηση & Ένταξη
      description: Σύνδεση σωλήνων κύτους, εγκατάσταση κονσόλας και καθίσματος, ενσωμάτωση ηλεκτρικού συστήματος και συστήματος καυσίμου και τοποθέτηση εξοπλισμού. Παρατηρήστε τη γραμμή παραγωγής σε λειτουργία.
      icon: tabler:tool
    - title: 6. Σταθμός δοκιμής πίεσης
      description: Δοκιμή διατήρησης πίεσης 24-48 ωρών σε ονομαστική πίεση 1,25x. Δείτε τα αρχεία δοκιμών, τους μετρητές πίεσης και τα κριτήρια επιτυχίας/αποτυχίας. Δείτε πώς συνδέονται τα αποτελέσματα των δοκιμών με τους σειριακούς αριθμούς της γάστρας.
      icon: tabler:gauge
    - title: 7. Τελική Επιθεώρηση & QC
      description: Λίστα ελέγχου ποιότητας 100 σημείων ανά μονάδα, επαλήθευση διαστάσεων, αισθητική επιθεώρηση και έλεγχος ακεραιότητας συσκευασίας. Ελέγξτε τα αρχεία καταγραφής μη συμμόρφωσης και τα αρχεία διορθωτικών ενεργειών.
      icon: tabler:clipboard-check
    - title: 8. Αίθουσα εξέτασης εγγράφων
      description: Τεκμηρίωση συμμόρφωσης ανά μοντέλο (DoC, πινακίδα κατασκευής, εγχειρίδιο κατόχου), αρχεία ιχνηλασιμότητας παραγωγής, μητρώο HIN και επίδειξη βάσης δεδομένων παρακολούθησης παρτίδας υλικού.
      icon: tabler:folder
content_qc_chain:
  tagline: Απόδειξη Ποιότητας
  title: Αλυσίδα QC 8 σταδίων<br />— Επαληθεύσιμη σε κάθε βήμα
  subtitle: Η αλυσίδα ποιοτικού ελέγχου μας εκτείνεται από τα εισερχόμενα υλικά έως την τελική αποστολή, με τεκμηριωμένα στοιχεία σε κάθε στάδιο.
  items:
    - title: 'Στάδιο 1: Επιθεώρηση Εισερχόμενου Υλικού'
      description: Κάθε παρτίδα PVC, Hypalon, υαλοβάμβακα, αλουμίνιο, κόλλες και υλικό δοκιμάζεται σύμφωνα με τις προδιαγραφές πριν από την έναρξη της παραγωγής. Αντοχή σε εφελκυσμό, πρόσφυση επίστρωσης και έλεγχοι διαστάσεων σύμφωνα με το AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Στάδιο 2: Συγκόλληση σωλήνων / Κολληση QC'
      description: Δοκιμή αντοχής αποφλοίωσης ραφής ανά παρτίδα παραγωγής. Οι παράμετροι συγκόλλησης RF παρακολουθούνται και καταγράφονται. Οι ραφές με το χέρι ελέγχθηκαν για σταθερή συγκολλητική κάλυψη και χρόνο σκλήρυνσης.
      icon: tabler:flame
    - title: 'Στάδιο 3: Πλαστικοποίηση κύτους QC'
      description: Μέτρηση πάχους gelcoat, επαλήθευση τοποθέτησης υαλοβάμβακα ανά πρόγραμμα laminate και παρακολούθηση χρόνου ωρίμανσης. Οι θέσεις των δομικών οπλισμών επαληθεύονται σε σχέση με τα μηχανικά σχέδια.
      icon: tabler:layers-subtract
    - title: 'Στάδιο 4: Συναρμολόγηση & Ενσωμάτωση QC'
      description: Ακεραιότητα άρθρωσης σωλήνα κύτους, ροπή στερέωσης κονσόλας και καθίσματος, ηλεκτρική συνέχεια και δοκιμή διαρροής συστήματος καυσίμου. Κάθε σημείο εγκατάστασης επαληθεύεται με βάση τη λίστα ελέγχου συναρμολόγησης για το συγκεκριμένο μοντέλο.
      icon: tabler:tool
    - title: 'Στάδιο 5: Δοκιμή διατήρησης πίεσης'
      description: Κάθε φουσκωτός θάλαμος έχει πίεση σε 1,25x ονομαστική PSI και διατηρείται για 24-48 ώρες. Καταγράφεται πτώση πίεσης ανά θάλαμο. Το κατώφλι επιτυχίας/αποτυχίας τεκμηριώθηκε. Συνδέεται με τον σειριακό αριθμό της γάστρας.
      icon: tabler:gauge
    - title: 'Στάδιο 6: Τελική Επιθεώρηση'
      description: Λίστα ελέγχου ποιότητας 100 σημείων που καλύπτει την ακρίβεια διαστάσεων, το καλλυντικό φινίρισμα, την πληρότητα των αξεσουάρ, το πακέτο τεκμηρίωσης και την ακεραιότητα της συσκευασίας. Ανεξάρτητο από την ομάδα παραγωγής.
      icon: tabler:clipboard-check
    - title: 'Στάδιο 7: Τεκμηρίωση συμμόρφωσης'
      description: DoC για συγκεκριμένο μοντέλο, επαλήθευση πινακίδας κατασκευής, πληρότητα εγχειριδίου ιδιοκτήτη και καταχώριση μητρώου HIN. Όλα τα έγγραφα συμμόρφωσης προετοιμάζονται και επαληθεύονται πριν από την αποδέσμευση της αποστολής.
      icon: tabler:file-certificate
    - title: 'Στάδιο 8: Αποδέσμευση αποστολής & Ιχνηλασιμότητα'
      description: Η τελική έκδοση απαιτεί να περάσουν όλα τα στάδια QC, να ολοκληρωθεί η τεκμηρίωση συμμόρφωσης και να επαληθευτεί η τεκμηρίωση αποστολής. Το αρχείο Hull έκλεισε και αρχειοθετήθηκε για διατήρηση 10+ ετών.
      icon: tabler:truck
content_traceability:
  tagline: Ιχνηλασιμότητα παραγωγής
  title: → Παράδοση αρχείου HIN → Master File<br /> →Hull Record
  subtitle: Κάθε σκάφος RIB φέρει έναν μοναδικό Αριθμό Αναγνώρισης Hull που συνδέεται με μια πλήρη αλυσίδα καταγραφής παραγωγής και συμμόρφωσης.
  items:
    - title: Αριθμός Αναγνώρισης Hull (HIN)
      description: Μοναδικό αναγνωριστικό 14 χαρακτήρων με μόνιμη σήμανση σε κάθε σκάφος. Κωδικοποιεί τον κωδικό κατασκευαστή (MIC), την ονομασία μοντέλου, το έτος παραγωγής και τον αριθμό σειράς. Το κλειδί που ξεκλειδώνει την πλήρη αλυσίδα ιχνηλασιμότητας.
      icon: tabler:hash
    - title: Κύριο τεχνικό αρχείο
      description: Η τεκμηρίωση συμμόρφωσης και μηχανικής για την οικογένεια μοντέλων. Περιέχει σχέδια GA, εκτίμηση κινδύνου, υπολογισμούς σταθερότητας, προδιαγραφές υλικών και ισχύοντα πρότυπα. Συνδέεται με όλες τις γάστρες αυτού του μοντέλου.
      icon: tabler:folder
    - title: Ατομικό ρεκόρ Hull
      description: 'Ρεκόρ παραγωγής ανά κύτος: HIN, ημερομηνία παραγωγής, παρτίδα σωλήνων, πιστοποιητικά υλικού, αποτέλεσμα δοκιμής πίεσης, τελική διαμόρφωση, προδιαγραφές κινητήρα, αποτελέσματα λίστας ελέγχου ποιότητας και προορισμός παράδοσης. 21+ πεδία δεδομένων ανά κύτος.'
      icon: tabler:file-description
    - title: Πακέτο Συμμόρφωσης Πελατών
      description: Πακέτο παράδοσης ανά κύτος που περιλαμβάνει DoC, φωτογραφία πλάκας κατασκευής, εγχειρίδιο κατόχου, λίστα ελέγχου συμμόρφωσης και φύλλο τελικής διαμόρφωσης. Αποστέλλεται με το σκάφος και αρχειοθετείται στο εργοστάσιο για 10+ χρόνια.
      icon: tabler:package
content_red_flags:
  tagline: Παγίδες ελέγχου
  title: Red Flags Buyers<br />Εύκολα εντοπισμός
  subtitle: Κοινά ζητήματα που υπονομεύουν την εμπιστοσύνη των αγοραστών κατά τους ελέγχους του εργοστασίου. Απευθυνόμαστε προληπτικά στον καθένα.
  items:
    - title: Γενικές αξιώσεις CE χωρίς πεδίο εφαρμογής μοντέλου
      description: '"Όλα τα προϊόντα με πιστοποίηση CE" χωρίς να διευκρινίζεται ποια οδηγία, ποια μοντέλα και ποια ενότητα συμμόρφωσης. Κόκκινη σημαία: υποδηλώνει ότι η συμμόρφωση είναι επιφανειακή και όχι ανά μοντέλο, ανά διαμόρφωση.'
      icon: tabler:alert-triangle
    - title: Δεν υπάρχουν αποδεικτικά στοιχεία φυσικής εξέτασης
      description: 'Ισχυρισμοί δοκιμής πίεσης χωρίς καταγραφές δοκιμών, μετρητές ή δοκιμαστικό σταθμό ορατό στο δάπεδο του εργοστασίου. Κόκκινη σημαία: οι ισχυρισμοί ποιότητας δεν μπορούν να επαληθευτούν κατά τη διάρκεια της επίσκεψης.'
      icon: tabler:alert-triangle
    - title: Λείπει η ιχνηλασιμότητα του υλικού
      description: 'Καμία καταγραφή παρτίδων, καμία εισερχόμενη επιθεώρηση ή καμία σύνδεση μεταξύ πιστοποιητικών υλικών και τελικών προϊόντων. Κόκκινη σημαία: δεν υπάρχει τρόπος εντοπισμού ζητημάτων ποιότητας στην πηγή.'
      icon: tabler:alert-triangle
    - title: Γενική Τεκμηρίωση
      description: 'Ένα έγγραφο που καλύπτει όλα τα μοντέλα, δεν υπάρχουν εγγραφές ειδικά για το HIN ή έγγραφα συμμόρφωσης "πρότυπο". Red flag: η συμμόρφωση δεν συνδέεται με μεμονωμένες μονάδες παραγωγής.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Αποστολή και συσκευασία
  title: Φόρτωση και ξυλοκιβωτισμός<br />σκαφών RIB σε container
  subtitle: Οι λύσεις αποστολής μας προστατεύουν την επένδυσή σας από το Qingdao έως το λιμάνι προορισμού. Σχέδια φόρτωσης container και προδιαγραφές συσκευασίας διαθέσιμες για κάθε μοντέλο.
  items:
    - title: Διαμορφώσεις container 20 ποδών
      description: 'Τυπικό container 20 ποδών: 1-2 σκάφη RIB (4,0-5,5 m) φωλιασμένα με διαχωρισμένο κατάστρωμα και σωλήνες, ή 8-12 σανίδες SUP. Διαθέσιμες μικτές διαμορφώσεις RIB + SUP. Αναλυτικό σχέδιο φόρτωσης παρέχεται με κάθε παραγγελία.'
      icon: tabler:box
    - title: Διαμορφώσεις container 40 ποδών
      description: 'Τυπικό container 40 ποδών: 2-4 σκάφη RIB (έως 7,0 m) με φωλιασμένα γάστρα και στοιβαγμένους σωλήνες, ή 20-30 σανίδες SUP. Container 40 ποδών HQ διαθέσιμο για ψηλότερα μοντέλα RIB. Η βελτιστοποιημένη ως προς τον όγκο συσκευασία μειώνει το κόστος αποστολής ανά μονάδα.'
      icon: tabler:container
    - title: Ξυλοκιβώτια για γάστρα RIB
      description: Γάστρα από αλουμίνιο και GRP συσκευασμένα σε ξύλινα κιβώτια κατά παραγγελία με αφρούλες προστασίας, φράγμα υγρασίας και χαλύβδινες λωρίδες. Διαστάσεις και βάρος κιβωτίων ανά μοντέλο διαθέσιμα για Logistics σχεδιασμό. Πιστοποίηση θερμικώς επεξεργασμένου ξύλου ISPM-15 περιλαμβάνεται.
      icon: tabler:wood
    - title: Συσκευασία με διαχωρισμό σωλήνων και καταστρώματος
      description: Σωλήνες αποφουσκωμένοι και διπλωμένοι ξεχωριστά από τα γάστρα για εξοικονόμηση χώρου. Πλάκες καταστρώματος, κονσόλες και καθίσματα συσκευασμένα σε προστατευτικό περιτύλιγμα με κιτ σκληραγωγίας συναρμολόγησης. Οδηγίες επανασυναρμολόγησης περιλαμβάνονται σε κάθε αποστολή.
      icon: tabler:package
    - title: Προστασία από υγρασία και διάβρωση
      description: Αντιδιαβρωτικό χαρτί VCI για εξαρτήματα αλουμινίου, σακουλάκια πυριτίου αποξηραντικού και σακούλες σκληραγωγίας υπό κενό. Αποτρέπει ζημιές συμπύκνωσης κατά τη θαλάσσια διαμετακόμιση 30-45 ημερών.
      icon: tabler:droplet-off
    - title: Τεκμηρίωση FOB Qingdao
      description: Τιμολόγιο φορτώσεως, εμπορικό τιμολόγιο, λίστα συσκευασίας, πιστοποιητικό προέλευσης και τεκμηρίωση συμμόρφωσης ανά αποστολή. Διαθέσιμη ενοποίηση FCL και LCL. Υποστήριξη τεκμηρίωσης τελωνείων για αγορές ΕΕ, ΗΠΑ και Μέσης Ανατολής.
      icon: tabler:file-text
faq:
  title: Έλεγχος εργοστασίου — Συχνές ερωτήσεις
  questions:
    - q: Μπορώ να επισκεφτώ το εργοστάσιο αυτοπροσώπως;
      a: Ναί. Καλωσορίζουμε τους επιτόπιους ελέγχους στο εργοστάσιο στις εγκαταστάσεις μας στο Qingdao έκτασης 12.000 m². Η τυπική μας περιήγηση καλύπτει 8 σταθμούς από την αποθήκη πρώτων υλών μέχρι την αίθουσα ελέγχου εγγράφων. Διατίθενται επίσης εικονικές ξεναγήσεις στο εργοστάσιο μέσω βιντεοκλήσης για την αρχική πιστοποίηση.
    - q: Δέχεστε ελέγχους τρίτων (BSCI, SMETA, SGS);
      a: Ναί. Διατηρούμε την πιστοποίηση BSCI (Intertek) και καλωσορίζουμε πρωτόκολλα ελέγχου ειδικά για πελάτες. Μπορούμε επίσης να κανονίσουμε επιθεωρήσεις SGS ή TÜV κατόπιν αιτήματος. Οι εκθέσεις ελέγχου είναι διαθέσιμες στο NDA.
    - q: Μπορώ να δω δοκιμή πίεσης κατά τη διάρκεια της επίσκεψης;
      a: Ο σταθμός δοκιμών πίεσης είναι μέρος της τυπικής διαδρομής περιήγησης. Ανάλογα με το χρονοδιάγραμμα παραγωγής, μπορείτε να παρατηρήσετε δοκιμές ενεργής πίεσης με ενδείξεις μετρητή και αρχεία δοκιμών. Τα αρχεία καταγραφής δοκιμής πίεσης ανά κύτος είναι πάντα διαθέσιμα για έλεγχο.
    - q: Πώς χειρίζεστε τα μη συμμορφούμενα προϊόντα;
      a: Οι μονάδες που δεν συμμορφώνονται διαχωρίζονται, τεκμηριώνονται και εξετάζονται σύμφωνα με τη διαδικασία διορθωτικής δράσης ISO 9001. Πραγματοποιείται ανάλυση της βασικής αιτίας, εφαρμόζονται διορθωτικές ενέργειες και διατηρούνται αρχεία. Οι αγοραστές μπορούν να ελέγξουν το αρχείο καταγραφής NCR κατά τη διάρκεια των ελέγχων.
    - q: Ποια τεκμηρίωση συμμόρφωσης είναι διαθέσιμη για έλεγχο;
      a: 'Κατά τη διάρκεια του ελέγχου, μπορείτε να ελέγξετε: δείγματα DoC για συγκεκριμένο μοντέλο, προδιαγραφές πινακίδων κατασκευής, μητρώο HIN, προσχέδια εγχειριδίων κατόχου, λίστες ισχυόντων προτύπων και αρχεία αξιολόγησης συμμόρφωσης ανά οικογένεια μοντέλων.'
    - q: Πώς μπορώ να κλείσω μια εικονική περιήγηση στο εργοστάσιο;
      a: Επικοινωνήστε με την ομάδα πωλήσεών μας για να προγραμματίσετε μια ζωντανή περιήγηση βίντεο μέσω WhatsApp, Zoom ή Teams. Ακολουθούμε την ίδια διαδρομή 8 σταθμών και μπορούμε να επικεντρωθούμε σε συγκεκριμένες περιοχές με βάση τα ενδιαφέροντά σας. Η τυπική εικονική περιήγηση είναι 45-60 λεπτά.
    - q: Είναι το εργοστάσιο ο πραγματικός κατασκευαστής ή εμπορική εταιρεία;
      a: Η Paddle Board Overstock είναι ο πραγματικός κατασκευαστής. Λειτουργούμε το εργοστάσιο στο Laixi, Qingdao. Η επαγγελματική άδεια, το εύρος κατασκευής και η φυσική παραγωγή είναι όλα επαληθεύσιμα κατά τη διάρκεια του ελέγχου.
    - q: Τι αρχεία ποιότητας μπορώ να ελέγξω;
      a: Αρχεία επιθεώρησης εισερχόμενων υλικών, σημεία ελέγχου QC κατά τη διαδικασία, αρχεία καταγραφής δοκιμών πίεσης, λίστες ελέγχου τελικής επιθεώρησης 100 σημείων, αναφορές μη συμμόρφωσης, αρχεία διορθωτικών ενεργειών και αρχεία ιχνηλασιμότητας ανά κύτος. Όλα διατηρούνται σύμφωνα με τις απαιτήσεις του ISO 9001.
