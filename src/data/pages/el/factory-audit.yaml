content_audit_evidence:
  tagline: Αποδεικτικά στοιχεία επαλήθευσης
  title: Αποδεικτικά ελέγχου<br />Μπορείτε να επαληθεύσετε επιτόπου
  subtitle: Κατά τη διάρκεια επισκέψεων στο εργοστάσιο, οι πελάτες μπορούν να επαληθεύσουν συγκεκριμένα στοιχεία σε κάθε περιοχή παραγωγής. Εδώ είναι τι πρέπει να αναζητήσετε — και τι προετοιμάζουμε για κάθε έλεγχο.
  areas:
    - area: Αποθήκη Πρώτων Υλών
      what_to_verify: Είναι τα υλικά σταθερά; Υπάρχει ανάμειξη κατά παρτίδες;
      evidence: Εισερχόμενα αρχεία επιθεώρησης, ετικέτες παρτίδων, αποθήκευση FIFO, λίστα έγκρισης προμηθευτών, πιστοποιητικά υλικών (PVC, Hypalon, υαλοβάμβακα, αλουμίνιο, κόλλες, υλικό)
      icon: tabler:building-warehouse
    - area: Παραγωγή σωλήνων
      what_to_verify: Πώς είναι εγγυημένη η αντοχή και η αεροστεγανότητα της ραφής;
      evidence: Κάρτες διεργασίας, επιβεβαίωση πρώτου άρθρου, αρχεία δοκιμής πίεσης ανά θάλαμο, αρχεία καταγραφής επισκευής και επανελέγχου, αρχεία εγκατάστασης βαλβίδων
      icon: tabler:flame
    - area: Παραγωγή γάστρας
      what_to_verify: Πώς ελέγχεται η δομική συνέπεια;
      evidence: Έγγραφα ελεγχόμενης διαδικασίας, σημεία ελέγχου ποιότητας, αρίθμηση ημιτελών προϊόντων, μετρήσεις πάχους gelcoat, επαλήθευση προγράμματος πλαστικοποίησης
      icon: tabler:layers-subtract
    - area: Περιοχή συναρμολόγησης
      what_to_verify: Πώς αποτρέπεται η εσφαλμένη συναρμολόγηση των προαιρετικών εξαρτημάτων;
      evidence: BOM, εντολές εργασίας, λίστες ελέγχου διαμόρφωσης, κάρτες επιθεώρησης σταθμών εργασίας, έλεγχοι ροπής και λειτουργικότητας ανά μοντέλο
      icon: tabler:tool
    - area: Σταθμός δοκιμών
      what_to_verify: Πώς επιβεβαιώνετε ότι το σκάφος είναι καλό πριν από την παράδοση;
      evidence: Διαδικασίες δοκιμής, λίστα οργάνων, αρχεία βαθμονόμησης, αρχεία καταγραφής δοκιμής πίεσης (1,25x / 24-48h), λίστες ελέγχου λειτουργικών δοκιμών, τεκμηριωμένα κριτήρια επιτυχίας/αποτυχίας
      icon: tabler:gauge
    - area: Περιοχή μη συμμόρφωσης
      what_to_verify: Πώς αντιμετωπίζονται τα ελαττώματα;
      evidence: Ετικέτες απομόνωσης, αρχεία καταγραφής NCR, ανάλυση βασικής αιτίας, αρχεία έγκρισης εκ νέου εργασιών, παρακολούθηση CAPA (Διορθωτική και προληπτική δράση)
      icon: tabler:alert-triangle
    - area: Αποθήκη Τελικών Ειδών
      what_to_verify: Πώς αποτρέπετε την εσφαλμένη αποστολή και τη ζημιά;
      evidence: Ετικέτες τελικών προϊόντων, αρχεία αντιστοίχισης παραγγελιών, πρότυπα συσκευασίας, αρχεία επιθεώρησης πριν από την αποστολή
      icon: tabler:box
    - area: Ανταλλακτικά & Μεταπώληση
      what_to_verify: Μπορείτε να υποστηρίξετε τη μακροπρόθεσμη μετά την πώληση;
      evidence: Λίστα κοινών ανταλλακτικών, στρατηγική απογραφής, σύστημα αρίθμησης ανταλλακτικών, τεκμηρίωση διαδικασίας εγγύησης, σεμινάρια συντήρησης
      icon: tabler:headset
content_closing_script:
  tagline: Έλεγχος κατά παραγγελία
  title: Από την επίσκεψη στο εργοστάσιο<br />στο επιβεβαιωμένο έργο
  subtitle: Ένας επιτυχημένος έλεγχος δεν πρέπει να τελειώνει με φωτογραφίες και χειραψία. Πριν φύγουμε, διασφαλίζουμε ότι τεκμηριώνονται τρία εμπορικά αποτελέσματα.
  items:
    - title: Επιβεβαιώστε την τεχνική διαμόρφωση
      description: Συμφωνήστε για το μοντέλο, την εφαρμογή, τις βασικές επιλογές, την αγορά-στόχο, την εκτιμώμενη ποσότητα και το χρονοδιάγραμμα παράδοσης — όλα τεκμηριωμένα πριν από την αναχώρηση.
      icon: tabler:checklist
    - title: Επιβεβαιώστε τα έγγραφα του επόμενου βήματος
      description: 'Καθορίστε τι παρέχει στη συνέχεια το Paddle Board Overstock: αναθεωρημένο GA, λίστα ρυθμίσεων, προσφορά, λίστα ελέγχου εγγράφων, σχέδιο δείγματος ή NDA — με συγκεκριμένα χρονοδιαγράμματα.'
      icon: tabler:file-plus
    - title: Επιβεβαίωση αμοιβαίου χρονοδιαγράμματος
      description: Αναθεωρημένη διαμόρφωση και προκαταρκτική προσφορά εντός 3 εργάσιμων ημερών. Επιβεβαίωση δείγματος ή εμφάνισης εντός 7 ημερών. Μηχανικός έλεγχος ή επιθεώρηση από τρίτους εντός 14 ημερών. Ημερομηνία επόμενης συνάντησης και τα αρμόδια μέρη κλειδωμένα.
      icon: tabler:calendar

