testimonial:
  content: Η Paddle Board Overstock σχεδίασε και εξόπλισε ολόκληρο το πρόγραμμα δραστηριοτήτων στην παραλία σε τρία θέρετρα. 80 SUP, 40 καγιάκ, υποδομές ασφαλείας και εκπαίδευση προσωπικού — όλα παραδίδονται σε μία αποστολή. Η συμμετοχή των καλεσμένων μας σε θαλάσσιες δραστηριότητες αυξήθηκε κατά 60% την πρώτη σεζόν.
  name: Σοφί Λοράν
  title: Διευθυντής του Guest Experience, Azure Bay Resorts — Πουκέτ, Ταϊλάνδη
content_segments:
  tagline: Προφίλ θερέτρου
  title: Waterfront Hospitality Solutions<br />Κατά τύπο ακινήτου
  subtitle: Κάθε θέρετρο έχει μοναδικό προφίλ επισκεπτών, συνδυασμό δραστηριοτήτων και λειτουργικό ρυθμό — από boutique οικολογικές κατοικίες μέχρι πολυτελή παραθαλάσσια θέρετρα. Σχεδιάζουμε προγράμματα θαλάσσιων σπορ που ταιριάζουν με την κατηγορία ιδιοκτησίας και τις προσδοκίες των επισκεπτών.
  items:
    - title: Παραθαλάσσια πολυτελή θέρετρα
      subtitle: Μεταφορές VIP, θαλάσσιες δραστηριότητες, premium εμπειρία επισκεπτών
      description: Παραθαλάσσια ακίνητα υψηλών προδιαγραφών — Four Seasons, Aman και παρόμοια πολυτελή γκρουπ — όπου τα θαλάσσια σπορ είναι μια απίστευτη άνεση των επισκεπτών που οδηγούν σε βαθμολογίες ικανοποίησης και βοηθητικά έσοδα. Ο στόλος πρέπει να είναι κορυφαίος, να προσφέρει ποικιλία μεταξύ ηλικιακών ομάδων και επιπέδων ικανότητας και να ενσωματώνεται άψογα με τα υπάρχοντα συστήματα θυρωρείου και κρατήσεων του θέρετρου. Οι προσδοκίες εμφάνισης επισκεπτών είναι εξαιρετικά υψηλές — η κατάσταση του εξοπλισμού και η παρουσίαση επηρεάζουν άμεσα τις κριτικές 5 αστέρων.
      features:
        - 'Premium στόλος με επωνυμία: SUP, καγιάκ, θαλάσσια ποδήλατα και μικρά τέντερ RIB'
        - 'Παρουσίαση έτοιμη για επισκέπτες: χρώματα σε αρμονία με το θέρετρο, επωνυμία με λογότυπο, σκηνοθετημένη έκθεση εξοπλισμού'
        - Μικρό πολυτελές RIB για μεταφορές VIP επισκεπτών με προσαρμοσμένη ταπετσαρία και αντίστοιχα χρώματα
        - 'Ενσωματωμένη υποδομή ασφάλειας: γραμμές σημαδούρων, ναυαγοσωστικές βάσεις, AED'
        - 'Διαχείριση εσόδων: πρότυπα δυναμικής τιμολόγησης, εκπαίδευση upsell, ομαδοποίηση πακέτων'
    - title: Ιδιωτικά Νησιωτικά Θέρετρα
      subtitle: Μεταφορά επισκεπτών παντός καιρού — μηδενικός χρόνος διακοπής λειτουργίας, απόλυτη αξιοπιστία
      description: Ιδιωτικά νησιωτικά θέρετρα λειτουργούν σε απομακρυσμένες τοποθεσίες όπου το σκάφος είναι η μόνη σύνδεση με την ηπειρωτική χώρα. Οι καθημερινές μεταφορές επισκεπτών, οι διαδρομές προμηθειών και οι επείγουσες ιατρικές εκκενώσεις εξαρτώνται από ένα μόνο σκάφος - οποιοσδήποτε χρόνος διακοπής επηρεάζει άμεσα την εμπειρία των επισκεπτών και τις λειτουργίες του θέρετρου. Αυτοί οι χειριστές χρειάζονται ένα σκάφος που να λειτουργεί αξιόπιστα σε όλες τις καιρικές συνθήκες, να απαιτεί ελάχιστη συντήρηση και να διαθέτει εφεδρικά συστήματα για αξιοπιστία κρίσιμης σημασίας. Το σκάφος πρέπει επίσης να παρουσιάζεται όμορφα καθώς οι επισκέπτες φτάνουν στο νησί.
      features:
        - Διαμόρφωση RIB για όλες τις καιρικές συνθήκες με πλήρη καιρική προστασία και ενισχυμένους σωλήνες
        - Πρόβλεψη διπλού κινητήρα ή εφεδρικού κινητήρα για λειτουργία χωρίς διακοπές
        - Κατασκευή Hypalon εμπορικής κλάσης για διάρκεια ζωής 5-8 ετών σε απομακρυσμένη λειτουργία
        - Σχεδιασμός εύκολης συντήρησης με προσβάσιμα εξαρτήματα για επιτόδια συντήρηση
        - Προσαρμοσμένη επωνυμία θέρετρου και premium ταπετσαρία σε αρμονία με την αισθητική του νησιού
    - title: Παραλίμνια & Οικολογικά Θέρετρα
      subtitle: Εμπειρίες επισκεπτών ενσωματωμένες στη φύση
      description: Παραλίμνιες ιδιοκτησίες, οικολογικές κατοικίες και καταφύγια στη φύση που προσφέρουν ήσυχες υδάτινες δραστηριότητες χαμηλής επιρροής που συμπληρώνουν το φυσικό περιβάλλον. Ο εξοπλισμός θα πρέπει να είναι μη μηχανοκίνητος, όπου είναι δυνατόν, να αποθηκεύεται εύκολα σε σκάφη περιορισμένου χώρου και να είναι αθόρυβος στη χρήση για να διατηρείται η ατμοσφαιρική εμπειρία για όλους τους επισκέπτες.
      features:
        - 'Μη μηχανοκίνητος στόλος: SUP, καγιάκ, κανό και θαλάσσια ποδήλατα'
        - Ήσυχοι σταθμοί φουσκώματος με ηλεκτρική αντλία για χρήση από τους επισκέπτες κατόπιν ζήτησης
        - Οικολογικά υλικά και συσκευασίες σε συμφωνία με την επωνυμία βιωσιμότητας
        - Περιλαμβάνονται ράφια αποθήκευσης και συστήματα οργάνωσης βαρκαποθήκης
    - title: Beach Club
      subtitle: Μεταφορές επισκεπτών, ψυχαγωγία, μικρά πολυτελή RIB
      description: Τα beach club λειτουργούν ένα περιβάλλον υψηλής ενέργειας, εστιασμένο στην οπτική γωνία, όπου ο εξοπλισμός είναι μέρος της ατμόσφαιρας. Χρειάζονται μικρά πολυτελή RIB για τη μεταφορά των επισκεπτών από κοντινά ξενοδοχεία ή αποβάθρες και παιχνίδια νερού για την ψυχαγωγία των επισκεπτών — ρυμούλκηση τζετ σκι, φουσκωτές τσουλήθρες και σανίδες κουπιών. Ο στόλος πρέπει να φαίνεται κομψός, να είναι εύκολος στη χρήση και να αντέχει την καθημερινή χρήση από επισκέπτες με διαφορετικά επίπεδα δεξιοτήτων. Η αποθήκευση και η γρήγορη ανάπτυξη είναι κρίσιμες κατά τις ώρες αιχμής.
      features:
        - Συμπαγές πολυτελές RIB (3,3-4,3 m) για μεταφορές επισκεπτών και υπηρεσία τέντερ
        - 'Ναυτικά παιχνίδια: φουσκωτά ρυμουλκούμενα, σανίδες SUP, καγιάκ για διασκέδαση επισκεπτών'
        - Προσαρμοσμένο χρώμα και επωνυμία σε αρμονία με την οπτική ταυτότητα του beach club
        - Συστήματα ταχείας καθέλκυσης και ανέλκυσης για λειτουργίες υψηλής εναλλαγής
        - Ανθεκτική κατασκευή Hypalon για καθημερινή έκθεση σε αλμυρό νερό και UV
    - title: Ιδιωτικοί Σύλλογοι Μελών & Γιοτ Λέσχες
      subtitle: Λιμενική μεταφορά, διαγωνισμοί μελών, αποκλειστικά θαλάσσια σπορ
      description: Οι ιδιωτικοί σύλλογοι όπου τα θαλάσσια σπορ και οι μεταφορές με σκάφος είναι όφελος των μελών και όχι παράγοντας εσόδων. Ο εξοπλισμός πρέπει να πληροί υψηλότερα αισθητικά πρότυπα, να είναι διαθέσιμος για τα μέλη κατόπιν ζήτησης και να απαιτεί ελάχιστη επίβλεψη προσωπικού. Οι γιοτ λέσχες Marina χρειάζονται ειδικά προσφορές για μεταφορά στο λιμάνι — μετακίνηση μελών μεταξύ αποβάθρας, ελλιμενισμού και ακτής. Η αποθήκευση και η συντήρηση πρέπει να είναι αόρατες στα μέλη.
      features:
        - Τέντερ RIB υψηλής κατηγορίας για λιμενικές μεταφορές και υπηρεσία μεταφοράς μελών
        - 'Εξοπλισμός premium: καταστρώματα EVA, προσαρμοσμένα χρώματα μελών, ταπετσαρία με επωνυμία'
        - Σύστημα αυτοεξυπηρέτησης παραλαβής για πρόσβαση μελών χωρίς προσωπικό
        - Αποθήκευση εκτός σεζόν και ετήσιο πρόγραμμα ανανέωσης
    - title: Ξενοδοχεία με επίκεντρο την περιπέτεια και τη δραστηριότητα
      subtitle: Ξεναγήσεις, SUP yoga, εκδρομές για κολύμβηση με αναπνευστήρα, ομαδικές δραστηριότητες
      description: Ιδιότητες που τοποθετούνται ως προορισμοί περιπέτειας — προσφέροντας ξεναγήσεις, γιόγκα SUP, κουπιά για ηλιοβασίλεμα, εκδρομές για κολύμβηση με αναπνευστήρα και ομαδικές δραστηριότητες. Ο στόλος πρέπει να υποστηρίζει τόσο δωρεάν ενοικίαση όσο και μοντέλα προγραμμάτων με καθοδήγηση, με εξοπλισμό που εναλλάσσεται απρόσκοπτα μεταξύ επισκεπτών και ξεναγήσεων που καθοδηγούνται από εκπαιδευτές. Αυτές οι ιδιοκτησίες χρειάζονται ανθεκτικό εξοπλισμό για τζίρο υψηλής συχνότητας, με εύκολο καθάρισμα μεταξύ ομάδων επισκεπτών.
      features:
        - Ευέλικτος μικτός στόλος που υποστηρίζει μοντέλα ενοικίασης + καθοδηγούμενων ξεναγήσεων
        - Καγιάκ δύο θέσεων και υπερσταθερές πλατφόρμες SUP για ομαδικές δραστηριότητες
        - 'Εξοπλισμός οδηγών: σανίδες εκπαιδευτών, αδιάβροχα κουτιά, αδιάβροχες επικοινωνίες'
        - 'Εποχιακή εναλλαγή εξοπλισμού: στόλος καλοκαιριού → πρόγραμμα χειμερινής αποθήκευσης'
        - Ανθεκτική κατασκευή πιστοποιημένη για καθημερινή χρήση από επισκέπτες με ελάχιστη συντήρηση
