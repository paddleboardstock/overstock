hero:
  tagline: Ξενοδοχεία, Θέρετρα & Φιλοξενία
  title: Premium Waterfront Experiences<br />Για ξενοδοχεία, θέρετρα και Yacht Club
  subtitle: Προγράμματα θαλάσσιων σπορ με το κλειδί στο χέρι για παραθαλάσσια ξενοδοχεία, ιδιωτικά νησιωτικά θέρετρα, παραλιακά κλαμπ και γιοτ κλαμπ — από εξοπλισμό επισκεπτών και προσφορές RIB μέχρι συστήματα ασφαλείας και εκπαίδευση προσωπικού.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Φουσκωτά σκάφη Paddle Board Overstock για δραστηριότητες παραθαλάσσιου θέρετρου
direct_answer: Η Paddle Board Overstock συνεργάζεται με ξενοδοχεία, θέρετρα, ιδιωτικά νησιά, παραλιακά κλαμπ και γιοτ κλαμπ σε όλο τον κόσμο για να δημιουργήσει κορυφαίες εμπειρίες στη θάλασσα. Οι λύσεις μας περιλαμβάνουν ενοικιαζόμενους στόλους SUP, καγιάκ ξεναγήσεων, τρυφερά RIB για μεταφορά επισκεπτών, μικρά πολυτελή RIB για μεταφορές beach club και πλήρη συστήματα ασφαλείας. Κάθε κομμάτι του εξοπλισμού μπορεί να είναι επώνυμα με το λογότυπο της ιδιοκτησίας σας και το χρωματικό σχέδιο. Παρέχουμε επίσης εκπαίδευση προσωπικού, συμβουλευτική σχεδιασμού προγραμμάτων και σχεδιασμό αντικατάστασης στόλου για να διασφαλίσουμε σταθερή ποιότητα σε όλες τις εποχές.
solution_offerings:
  - title: Standard Πακέτο Resort
    subtitle: Για ακίνητα μικρού έως μεσαίου μεγέθους (50–150 δωμάτια)
    badge: Popular
    features:
      - title: Στόλος Επισκεπτών
        description: 20–50 SUP και καγιάκ με χρώματα και λογότυπα με επώνυμα θέρετρα
      - title: Υποδομή Ασφάλειας
        description: Ναυαγοσωστικές βάσεις, γραμμές σημαδούρων, σήμανση ασφαλείας και σταθμοί πρώτων βοηθειών
      - title: Αποθήκευση & Συντήρηση
        description: Συστήματα ραφιών, σταθμοί φουσκώματος και λίστες ελέγχου καθημερινών επιθεωρήσεων
      - title: Εκπαίδευση Προσωπικού
        description: Επιτόπιος προσανατολισμός για δραστηριότητες του προσωπικού σχετικά με το χειρισμό του εξοπλισμού και την ασφάλεια των επισκεπτών
      - title: Εκκίνηση Υποστήριξης
        description: Προγραμματίστε το playbook με πρότυπα τιμολόγησης, φόρμες απαλλαγής και χρονοδιαγράμματα δραστηριοτήτων
    cta_text: Σχεδιάστε τη λύση για το θέρετρό σας
    cta_href: /contact
  - title: Resort Premium Πακέτο
    subtitle: Για πολυτελή ακίνητα και επιχειρήσεις μεγάλης κλίμακας
    badge: Premium
    features:
      - title: Premium Στόλος
        description: 50–100+ SUP, καγιάκ, θαλάσσια ποδήλατα και τρυφερά RIB με πλήρη προσαρμογή
      - title: Προηγμένη ασφάλεια
        description: Ναυαγοσωστικοί πύργοι, ραδιοσύστημα, πίνακας διάσωσης, AED και σχέδιο δράσης έκτακτης ανάγκης
      - title: Εμπειρία επισκέπτη
        description: Περίπτερο check-in, οθόνη εξοπλισμού, καμπάνες αλλαγών, αποθήκη στην παραλία
      - title: Πρόγραμμα εσόδων
        description: Δυναμικός οδηγός τιμολόγησης, εκπαίδευση upsell, στρατηγικές ομαδοποίησης πακέτων
      - title: Εποχιακή Υποστήριξη
        description: Αποθήκευση εκτός σεζόν, επιθεώρηση στο τέλος της σεζόν, παραγγελία ανανέωσης
    cta_text: Αναβαθμίστε την εμπειρία του θέρετρου
    cta_href: /contact
benefits:
