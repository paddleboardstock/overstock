hero:
  tagline: Water Sports Schools & Training Centers
  title: 'Equipment Solutions<br />For SUP & Kayak Schools'
  subtitle: 'Reliable, commercial-grade equipment for paddle schools, surf instruction, kayak training, and water sports education programs at any scale.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP boards for schools and training centers

direct_answer: 'Aquafarer supplies SUP and kayak schools worldwide with commercial-grade boards, safety equipment, and instructor packages. Our equipment is built for daily instructional use — thicker PVC, reinforced drop-stitch cores, and stable hull designs that give beginners confidence and instructors reliability. Packages include custom branding, spare parts programs, and training resources.'

solution_offerings:
  - title: School Starter Package
    subtitle: For new programs and small training centers
    badge: Popular
    features:
      - title: Student Boards
        description: 10–25 all-around SUP boards or recreational kayaks with stable platforms for beginner lessons
      - title: Instructor Boards
        description: Wider, longer boards with extra stability and non-slip EVA decks for coaching
      - title: Safety Equipment
        description: Life vests, leashes, whistles, and throw bags in matching colors
      - title: Storage & Transport
        description: Stackable board racks, padded kayak cradles, and transport dollies
      - title: Curriculum Support
        description: Lesson templates, safety checklists, and skill progression guides
    cta_text: Start My School Package
    cta_href: '/contact'

  - title: School Premium Package
    subtitle: For established schools and multi-program operators
    badge: Best Value
    features:
      - title: Full Fleet
        description: 25–50 boards or kayaks with mixed fleet (all-around, touring, youth sizes)
      - title: Instructor Fleet
        description: 3–5 specialized instructor boards with built-in sound system mounts
      - title: Safety Station
        description: Centralized safety gear station with PFDs, radios, first aid, and signage
      - title: Branding Package
        description: Full logo printing on boards, paddles, PFDs, and uniforms
      - title: Maintenance Program
        description: Quarterly maintenance kits, spare part bundles, and repair training
    cta_text: Build Premium Package
    cta_href: '/contact'

  - title: School Franchise Package
    subtitle: For multi-location chains and franchise operators
    badge: Enterprise
    features:
      - title: Fleet Standardization
        description: Identical equipment across all locations for consistent student experience
      - title: Central Ordering
        description: Consolidated ordering, bulk pricing, and centralized spare parts management
      - title: Instructor Training
        description: Equipment handling and maintenance certification for all instructors
      - title: Co-Branding
        description: Joint branding with franchise + Aquafarer co-branding options
      - title: Expansion Support
        description: Scaling consultation, equipment forecasting, and new location setup
    cta_text: Discuss Franchise Plan
    cta_href: '/contact'

benefits:
  - title: Built for Daily Instruction
    description: Thicker PVC and reinforced rails withstand daily student use, drops on sand, and rocky landings.
    icon: tabler:shield
  - title: Stable Learning Platforms
    description: Wider hulls and flatter rockers give beginners confidence. Instructors focus on teaching, not equipment.
    icon: tabler:scale
  - title: Easy Storage & Transport
    description: Inflatable design stores in small spaces. Deflated boards fit in standard vehicle trunks for mobile teaching.
    icon: tabler:box-seam
  - title: Custom Branding
    description: School logos and colors on every board. Your brand, your identity — not generic rental gear.
    icon: tabler:brush

content_segments:
  tagline: School Profiles
  title: 'Water Sports Education Solutions<br />By Program Type'
  subtitle: 'Paddle schools, surf academies, university programs, and franchise operators each face different operational challenges — from curriculum integration to multi-location fleet standardization. We configure equipment packages to match the educational model.'
  items:
    - title: Independent SUP & Kayak Schools
      subtitle: Owner-operated training centers
      description: 'Small to mid-size schools run by owner-instructors offering SUP lessons, kayak training, and certification courses. Equipment must be durable enough for daily instructional use, affordable for a small business budget, and versatile enough to serve beginners through intermediate students in a single fleet.'
      features:
        - 'Stable all-around SUP boards and recreational kayaks for beginner lessons'
        - 'Instructor-specific boards with extra stability for coaching from water'
        - 'Lesson plan templates and skill progression guides included'
        - 'Annual equipment refresh program with trade-in discounts'
    - title: University & College Recreation Programs
      subtitle: Large-scale student recreation fleets
      description: 'University recreation departments operating paddle clubs, rental programs, and instructional courses as part of campus recreation offerings. Equipment faces peak usage during semesters, requires easy check-in/check-out systems, and must withstand varied skill levels from first-time students to advanced paddlers.'
      features:
        - 'High-durability PVC construction rated for institutional use cycles'
        - 'Color-coded fleets by skill level for easy management'
        - 'RFID or sticker-based inventory tracking system compatibility'
        - 'Bulk pricing with semester-based ordering and payment terms'
    - title: Surf Schools & Surf Academies
      subtitle: Coastal surf instruction programs
      description: 'Surf schools teaching SUP surfing, prone paddle, and surf kayak skills in ocean environments. Equipment must handle surf zone conditions — impact resistance, sand and saltwater tolerance, and easy rinse-and-return turnover between hourly lessons.'
      features:
        - 'Surf-specific shapes with reinforced rails and impact-resistant construction'
        - 'Soft-fin options and coiled leashes for student safety'
        - 'Quick-rinse fabric that dries between lesson rotations'
        - 'Fleet replacement program with end-of-season inspection and refresh'
    - title: Franchise & Multi-Location Chains
      subtitle: Standardized equipment across locations
      description: 'Multi-location operators running standardized training programs across multiple cities or regions. Fleet consistency across locations is paramount — every student should have the same equipment experience regardless of which franchise location they visit. Centralized ordering, branded uniformity, and scaling support are essential.'
      features:
        - 'Identical fleet specifications across all franchise locations'
        - 'Centralized consolidated ordering with volume pricing'
        - 'Co-branding options: franchise brand + Aquafarer co-brand'
        - 'New location setup kit: equipment, signage, and opening inventory'

