timeline:
  - year: '2012'
    title: 'Marine Manufacturing Foundation'
    body: 'Paddle Board Overstock began as a specialized inflatable watercraft workshop in Qingdao, China, committed to marine craftsmanship and inflatable boat manufacturing. The early focus was building reliable inflatable products through practical engineering experience and manufacturing discipline.'
  - year: '2015'
    title: 'First Export & CE Certification'
    body: "Initial export orders reached Japan and Korea. CE certification was achieved for core product lines, marking Paddle Board Overstock's entry into international markets. The company began serving commercial and recreational users beyond China."
  - year: '2018'
    title: 'Factory Expansion'
    body: 'Relocated to a 12,000 m² production facility. Added RF welding lines and drop-stitch production capacity, enabling larger-scale manufacturing and improved quality control systems.'
  - year: '2020'
    title: 'R&D Center Established'
    body: 'Opened a dedicated R&D center with PVC fabric lab, hydrodynamic test tank, and CAD/FEA simulation studio. Product development expanded to focus on lightweight construction, improved durability, and user-centered design.'
  - year: '2022'
    title: 'Certification & Global Growth'
    body: 'Achieved ISO 9001 certification. Expanded to 14 R&D engineers and 200+ workers. Products reached customers across Europe, Americas, and Asia-Pacific through distributor and OEM partnerships.'
  - year: '2024'
    title: 'Innovation & Design Studio'
    body: 'Launched full-service design and innovation studio for custom ODM projects, from concept to production. Strengthened professional marine applications including rescue, commercial, and government tenders.'
  - year: '2026'
    title: 'Building The Future Of Water Exploration'
    body: "Today, Paddle Board Overstock continues to develop inflatable boats, SUP systems, and customized marine solutions — connecting people and organizations with the world's waters. 50+ countries served, 15,000 units annual capacity."

content_founding:
  tagline: The Beginning
  title: 'Born on the Waterfront'
  subtitle: 'Paddle Board Overstock started in a coastal workshop in Qingdao with one boat and a vision: to build inflatable watercraft that could handle real marine conditions.'
  paragraphs:
    - 'In 2012, our founders saw a gap in the market — most inflatable boats were either affordable but unreliable, or high-quality but prohibitively expensive. They believed there was room for a manufacturer that delivered both quality and value.'
    - 'The first hull was built by hand, tested in local waters, and refined based on real feedback from fishermen and small commercial operators. That feedback loop — build, test, listen, improve — remains at the core of our engineering philosophy today.'
    - 'By 2015, word had spread beyond Qingdao. International distributors began requesting samples. What started as a local workshop was becoming a global supplier.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock early production workshop and manufacturing

content_growth:
  tagline: Growth & Innovation
  title: 'From Workshop to 12,000 m² Facility'
  subtitle: 'Continuous investment in people, equipment, and process has transformed Paddle Board Overstock into a modern marine manufacturing facility.'
  paragraphs:
    - 'As demand grew, so did our facility. We expanded from a small workshop to a 12,000 m² factory with dedicated production lines for RIB boats, inflatable boats, SUP boards, and accessories.'
    - 'We invested in CNC cutting machines, high-frequency welding equipment, drop stitch production lines, and comprehensive testing rigs — allowing us to control every aspect of production quality.'
    - 'Today, our team of 200-300 includes marine engineers, material scientists, quality control specialists, and skilled craftspeople — many of whom have been with Paddle Board Overstock since the early days.'

founder:
  tagline: 'Meet The Founder'
  title: 'Built by a Waterman'
  subtitle: 'Founder David Chen brings together manufacturing expertise and a lifelong passion for water sports — a combination that defines how Paddle Board Overstock approaches product development.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Founder of Paddle Board Overstock
  story:
    - 'David Chen grew up on the coast of Qingdao, where the sea was not a vacation destination but a way of life. He spent his youth kayaking, sailing, and fishing in the Yellow Sea — experiences that gave him an intuitive understanding of what watercraft need to endure.'
    - 'Before founding Paddle Board Overstock, David spent a decade in marine manufacturing, working across production, quality, and international trade. He managed OEM programs for European and North American brands, learning the standards and expectations of global markets first-hand.'
    - 'In 2012, he founded Paddle Board Overstock with a simple mission: build inflatable watercraft that he would trust with his own family on the water. That personal standard — would I use this? — remains the final test for every product that leaves the factory.'
    - 'Today, David leads product strategy and oversees the R&D team, personally reviewing new designs and testing prototypes on the waters off Qingdao. He believes that great products come from understanding both the engineering and the experience.'

philosophy:
  tagline: 'Brand Philosophy'
  title: 'Engineering Freedom On Water'
  body: 'Freedom on water is not only about movement. It represents discovering new places, creating outdoor experiences, connecting people with nature, and enabling professional missions. Engineering makes that freedom possible.'
  pillars:
    - title: 'Reliability First'
      body: 'Water environments demand trust. Paddle Board Overstock products are designed around stability, durability, safety, and consistent performance.'
    - title: 'Human-Centered Design'
      body: 'Products should serve people, not technology. Every design decision begins with understanding how people use watercraft, where they explore, and what challenges they face.'
    - title: 'Accessible Exploration'
      body: 'Water should not belong only to experts. Paddle Board Overstock creates equipment that allows more people to safely experience rivers, lakes, oceans, and coastal environments.'
    - title: 'Continuous Innovation'
      body: 'Innovation is not only creating new products. It is improving every detail — materials, structures, manufacturing, and user experience.'

engineeringDna:
  tagline: 'Engineering DNA'
  title: 'How Paddle Board Overstock Creates Products'
  areas:
    - title: 'Material Science'
      body: 'Paddle Board Overstock focuses on selecting appropriate materials for different marine environments. Key considerations include abrasion resistance, UV resistance, pressure stability, and long-term durability.'
      items: ['Abrasion Resistance', 'UV Resistance', 'Pressure Stability', 'Long-Term Durability']
    - title: 'Structural Engineering'
      body: 'Inflatable watercraft require precise balance between rigidity, weight, portability, and stability. Paddle Board Overstock engineering focuses on optimizing these factors through drop-stitch core technology and advanced seam construction.'
      items: ['Rigidity', 'Weight Optimization', 'Portability', 'Stability']
    - title: 'Manufacturing Precision'
      body: 'Every product goes through controlled processes: material preparation, precision cutting, welding and bonding, assembly, quality inspection, and performance verification.'
      items: ['Material Prep', 'Precision Cutting', 'Welding & Bonding', 'Assembly & QC']
    - title: 'User Scenario Engineering'
      body: 'Products are developed around real applications — recreation, adventure, and professional use — ensuring each design meets the specific demands of its intended environment.'
      items: ['Recreation', 'Adventure', 'Professional', 'Commercial']

