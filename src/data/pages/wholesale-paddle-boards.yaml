hero:
  tagline: Wholesale SUP Boards
  title: Wholesale Inflatable Paddle Boards<br />for Small Businesses
  subtitle: Brand-new overstock SUP boards in small-business-friendly quantities. Order 5–20 boards, mix any models in one shipment, and choose express air or sea freight to 50+ countries.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Wholesale inflatable SUP boards from Paddle Board Overstock ready for shipment
direct_answer: Paddle Board Overstock supplies brand-new overstock inflatable SUP boards to small retailers worldwide. There is no large minimum order — a wholesale order starts at just 5 boards, and you can mix any in-stock models in a single order. Boards ship from our Weihai, China base by express air freight (1–3 boards, samples, or urgent restocks) or consolidated sea freight (5–20 board retailer orders). Every board is 100% pressure-tested before dispatch and covered by our 2-Year SUP Warranty.
tldr_points:
  - "Low MOQ: wholesale orders start at 5 boards — sized for small shops, not container loads"
  - "Mixed model orders: combine any in-stock SUP models in one shipment"
  - "Two shipping options: express air freight for 1–3 boards, sea freight for 5–20 board orders"
  - "Brand-new stock: 100% pressure-tested, 99.3% final-inspection pass rate, 2-Year SUP Warranty"
why_retailers:
  title: Why Small Retailers Choose Overstock SUP Boards
  subtitle: You do not need a warehouse or a container budget to buy at wholesale prices.
  items:
    - title: Small-Business-Friendly Quantities
      description: Traditional wholesale demands hundreds of units per order. Our overstock model is built for independent shops — start with 5 boards and grow your order as your store grows.
    - title: Real Wholesale Pricing Without the Volume Commitment
      description: Because we sell overstock inventory — surplus production and carefully sourced stock from selected partner factories — you get volume-level unit pricing without the volume-level risk.
    - title: Mix Models to Match Your Customers
      description: Beach shops, lake outfitters, and city stores serve different paddlers. Mix all-around, touring, and surf-style SUP models in one order so your shelf matches your local demand.
    - title: Brand-New, Never Used
      description: Every board in our overstock inventory is brand-new and unused — not seconds, not returns. Each board is 100% pressure-tested before it leaves the warehouse.
    - title: Fast, Flexible International Shipping
      description: Express air freight gets 1–3 boards or sample orders to your door quickly; consolidated sea freight keeps the per-board cost low on 5–20 board retailer orders.
    - title: Backed by a Real Warranty
      description: Wholesale does not mean unsupported. Every SUP board carries our 2-Year SUP Warranty, the same coverage we give every customer in 50+ countries.
pricing_section:
  tagline: Wholesale Pricing
  title: Simple, Transparent Wholesale Pricing
  subtitle: Pricing is quoted per order based on the models, quantities, and shipping method you choose. No hidden fees — the quote you receive is the price you pay.
  points:
    - title: Tiered by Quantity
      description: Unit prices step down as order size goes up. A 10-board order prices better per board than a 5-board order; a 20-board order better still.
    - title: Mixed Models Count Toward One Total
      description: Your discount tier is based on the total number of boards in the order — not per model. Mixing 4 different models × 3 boards each counts as a 12-board order.
    - title: Quoted With Shipping Options
      description: Every quote includes both express and sea freight options with estimated transit times, so you can choose the speed-to-cost balance that fits your restock timeline.
    - title: No Account or Membership Required
      description: There is no wholesale club to join and no annual fee. Request a quote, confirm the order, and we ship.
