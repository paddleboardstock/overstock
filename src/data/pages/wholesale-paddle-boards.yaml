how_to_order:
  tagline: How It Works
  title: How to Place a Wholesale Order
  steps:
    - title: Browse the Inventory
      description: Review the 11 in-stock models above or use the mixed-model selector to draft a combination that fits your customers.
    - title: Request a Quote
      description: Send us the models, estimated quantities, your country, and preferred shipping speed using the inquiry form below. We reply with unit pricing and shipping options.
    - title: Confirm and Pay
      description: Approve the final quote — models, quantities, freight method, and total. Payment terms are confirmed at quoting.
    - title: We Test, Pack, and Ship
      description: Every board is 100% pressure-tested, packed with its full accessory kit, and dispatched from Weihai. You receive tracking for the full journey.
