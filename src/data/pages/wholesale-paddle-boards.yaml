faq_section:
  title: Wholesale FAQ
  items:
    - q: What is the minimum wholesale order?
      a: Five boards. Our overstock model is built for small retailers — you do not need to fill a container to get wholesale pricing.
    - q: Can I mix different SUP models in one wholesale order?
      a: Yes. Mixed model orders are one of the biggest advantages of buying overstock stock — combine any in-stock models in a single shipment, and the total board count determines your pricing tier. See our mixed model wholesale page for details.
    - q: Are the boards brand-new?
      a: Yes. Every board is brand-new, unused overstock inventory — never seconds, refurbs, or customer returns. Each board is 100% pressure-tested before dispatch.
    - q: How much cheaper is wholesale than retail?
      a: Wholesale unit pricing is quoted per order based on models and quantities, and is meaningfully below the retail prices listed above. Request a quote for your target mix and we will price it exactly.
    - q: Which shipping method should I choose?
      a: Express air freight suits 1–3 boards, samples, and urgent restocks. Consolidated sea freight is the economical choice for 5–20 board retailer orders. We quote both options with every inquiry.
    - q: What warranty do wholesale boards carry?
      a: The same 2-Year SUP Warranty we give every customer, in every one of the 50+ countries we ship to.
    - q: Do you ship to my country?
      a: We currently ship to more than 50 countries, with regional guides for Latin America, Southeast Asia, Africa, the Middle East, and key markets including Mexico, Brazil, the Philippines, Indonesia, Thailand, South Africa, Kenya, and the UAE. Ask in your quote request and we will confirm current service to your address.
