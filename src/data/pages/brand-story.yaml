content_founding:
  tagline: The Beginning
  title: 'Born on the Waterfront'
  subtitle: 'Paddle Board Overstock started in a coastal workshop in Qingdao with one boat and a vision: to build inflatable watercraft that could handle real marine conditions.'
  paragraphs:
    - 'In 2012, our founders saw a gap in the market — most inflatable boats were either affordable but unreliable, or high-quality but prohibitively expensive. They believed there was room for a manufacturer that delivered both quality and value.'
    - 'The first hull was built by hand, tested in local waters, and refined based on real feedback from fishermen and small commercial operators. That feedback loop — build, test, listen, improve — remains at the core of our engineering philosophy today.'
    - 'By 2015, word had spread beyond Qingdao. International distributors began requesting samples. What started as a local workshop was becoming a global supplier.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock early production workshop and manufacturing
content_growth:
  tagline: Growth & Innovation
  title: 'From Workshop to 12,000 m² Facility'
  subtitle: 'Continuous investment in people, equipment, and process has transformed Paddle Board Overstock into a modern marine manufacturing facility.'
  paragraphs:
    - 'As demand grew, so did our facility. We expanded from a small workshop to a 12,000 m² factory with dedicated production lines for RIB boats, inflatable boats, SUP boards, and accessories.'
    - 'We invested in CNC cutting machines, high-frequency welding equipment, drop stitch production lines, and comprehensive testing rigs — allowing us to control every aspect of production quality.'
    - 'Today, our team of 200-300 includes marine engineers, material scientists, quality control specialists, and skilled craftspeople — many of whom have been with Paddle Board Overstock since the early days.'
content_mission:
  tagline: Our Mission
  title: 'Engineering Freedom On Water'
  subtitle: 'Every Paddle Board Overstock product is designed to help people explore, work, and thrive on the water — reliably, safely, and affordably.'
  list:
    - 'Design watercraft that performs in real marine conditions — not just on paper'
    - 'Build lasting partnerships with distributors and brands through reliable OEM/ODM service'
    - 'Continuously improve our manufacturing processes to deliver better value'
    - 'Support every product with genuine spare parts and technical expertise'
