    icon: tabler:building-factory
  - title: Competitive Margins
    description: Wholesale pricing with volume discounts, rebate programs, and protected territories.
    icon: tabler:coin
  - title: Marketing Support
    description: Professional product assets, localized brochures, and co-branded marketing campaigns.
    icon: tabler:chart-bar
  - title: Logistics Partnership
    description: Coordinated shipping, customs support, and local warehouse options to reduce your logistics costs.
    icon: tabler:truck-delivery

content_segments:
  tagline: Partner Profiles
  title: 'Distribution Partnership Models<br />By Partner Type'
  subtitle: 'Different distributors bring different go-to-market strengths — regional infrastructure, e-commerce reach, specialty retail, or multi-brand portfolios. We structure partnership terms, pricing tiers, and support levels to match each partner profile.'
  items:
    - title: Regional Marine Distributors
      subtitle: Territory-exclusive B2B distribution
      description: 'Established distributors with warehouse infrastructure, dealer networks, and logistics capabilities serving marine dealers, water sports retailers, and rental operators within a defined geographic territory. You need a complete product line, protected pricing, and the ability to service dealer accounts with local stock and support.'
      features:
        - 'Exclusive territory protection with minimum commitment terms'
        - 'Full catalog wholesale pricing with quarterly volume rebates'
        - 'Local stock consignment program for fast-moving SKUs'
        - 'Dealer network training and co-branded marketing programs'
    - title: E-Commerce & Online Retailers
      subtitle: Digital-first distribution channels
      description: 'Online retailers selling water sports equipment through Amazon, eBay, or their own e-commerce platforms. Speed-to-market, competitive pricing, and direct-to-consumer logistics are critical. You need a partner who can drop-ship individual orders under your brand with fast fulfillment and zero inventory risk.'
      features:
        - 'Drop-ship program: factory-direct fulfillment with your branding'
        - 'Real-time inventory API feed for your e-commerce platform'
        - 'Amazon Seller Central integration with EAN/UPC support'
        - 'Return logistics and warranty claim processing included'
    - title: Specialty Water Sports Retailers
      subtitle: Brick-and-mortar showroom partners
      description: 'Physical retail stores specializing in water sports equipment — serving local paddlers, anglers, and boaters with in-person sales, demonstrations, and after-sales service. You need retail-optimized packaging, demo unit programs, and point-of-sale materials that convert walk-in customers.'
      features:
        - 'Demo unit program: discounted showroom display boards'
        - 'Retail-ready packaging with shelf-optimized box design'
        - 'Point-of-sale displays, comparison charts, and buyer guides'
        - 'In-store staff training and certification program'
    - title: Multi-Brand & Department Store Distributors
      subtitle: Broad-line sporting goods distribution
      description: 'Large-scale distributors serving department stores, big-box retailers, and sporting goods chains with multi-brand catalogs. Consistency, compliance documentation, and vendor compliance are paramount — every SKU must meet retailer-specific packaging, labeling, and quality standards.'
      features:
        - 'Retailer compliance documentation: packaging spec, barcode, labeling'
        - 'EDI/ASN integration for major retailer ordering systems'
        - 'Vendor-managed inventory and automatic replenishment programs'
        - 'Dedicated account management with 24-hour response SLA'

