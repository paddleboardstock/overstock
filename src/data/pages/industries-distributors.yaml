hero:
  tagline: Water Sports Distributors & Wholesale
  title: 'Wholesale Partnership<br />For Water Sports Distributors'
  subtitle: 'Become an Aquafarer distribution partner. Access our full product catalog, exclusive wholesale pricing, drop-ship support, and dedicated account management.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer factory and wholesale distribution

direct_answer: 'Aquafarer offers comprehensive wholesale partnerships for water sports distributors worldwide. Partners receive wholesale pricing on the full product catalog, dedicated account management, marketing materials, and logistics support. We offer drop-ship capabilities, private labeling, and flexible minimum order quantities to match your business model.'

solution_offerings:
  - title: Distributor Starter
    subtitle: For new partnerships and regional distributors
    badge: Popular
    features:
      - title: Full Catalog Access
        description: Wholesale pricing on all SUP boards, kayaks, RIBs, and accessories
      - title: Dedicated Account Manager
        description: Single point of contact for orders, support, and product information
      - title: Marketing Materials
        description: Product photos, spec sheets, brochures, and digital assets in your language
      - title: Logistics Support
        description: Shipping coordination, customs documentation, and warehouse delivery
      - title: Sample Program
        description: Discounted sample orders for showroom displays and dealer demonstrations
    cta_text: Apply for Partnership
    cta_href: '/contact'

  - title: Distributor Premium
    subtitle: For established distributors with multi-country coverage
    badge: Best Value
    features:
      - title: Tiered Pricing
        description: Volume-based pricing tiers with quarterly rebate programs
      - title: Exclusive Territory
        description: Protected distribution rights for your region or country
      - title: Drop-Ship Program
        description: Direct ship to your customers from our warehouses with your branding
      - title: Private Labeling
        description: Full OEM/ODM support for your own brand — boards, boats, and accessories
      - title: Priority Support
        description: 48-hour response guarantee, dedicated logistics coordinator, and expedited orders
    cta_text: Upgrade Partnership
    cta_href: '/contact'

  - title: Master Distributor
    subtitle: For large-scale regional and national distributors
    badge: Enterprise
    features:
      - title: Strategic Partnership
        description: Joint business planning, market development funds, and co-marketing programs
      - title: Custom Product Development
        description: Exclusive product designs and specifications for your market
      - title: Local Warehouse Support
        description: Inventory consignment, local spare parts stock, and regional service center setup
      - title: Dealer Network Support
        description: Training programs, certification courses, and dealer locator integration
      - title: Annual Partner Summit
        description: Strategy meetings, product previews, and network building with global partners
    cta_text: Explore Master Partnership
    cta_href: '/contact'

