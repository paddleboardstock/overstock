timeline:
  - year: '2012'
    title: Temelj morske proizvodnje
    body: Paddle Board Overstock se je začel kot specializirana delavnica za napihljiva plovila v Qingdau, Kitajska, predan pomorski obrtni proizvodnji in izdelavi napihljivih čolnov. Prvotni poudarek je bil gradnja zanesljivih napihljivih izdelkov skozi praktične izkušnje in disciplinirano proizvodnjo.
  - year: '2015'
    title: Prvi izvoz in CE certificiranje
    body: Začetna izvozna naročila so dosegla Japonsko in Korejo. CE certifikat je bil dosežen za osnovne produktne linije, kar je označevalo vstop Paddle Board Overstock na mednarodne trge. Podjetje je začelo služiti komercialnim in rekreativnim uporabnikom zunaj Kitajske.
  - year: '2018'
    title: Širitev tovarne
    body: Preselitev v proizvodni obrat površine 12.000 m². Dodane linije za RF varjenje in proizvodna zmogljivost drop-stitch, kar omogoča večjo proizvodnjo in izboljšane sisteme nadzora kakovosti.
  - year: '2020'
    title: Vzpostavitev R&R centra
    body: Odprt posvečen R&R center z PVC laboratorijem za tkanine, hidrodinamičnim testnim bazenom in CAD/FEA simulacijskim studiem. Razvoj izdelkov se je razširil z osredotočenjem na lahkotno konstrukcijo, boljšo vzdržljivost in uporabniku prijazno zasnovo.
  - year: '2022'
    title: Certifikacija in globalna rast
    body: Dosežen ISO certifikat 9001. Število R&R inženirjev se je povečalo na 14 in 200+ delavcev. Izdelki so dosegli stranke po Evropi, Ameriki in Azijsko-pacifiški regiji preko distributerjev in OEM partnerstev.
  - year: '2024'
    title: Studio za inovacije in dizajn
    body: Vzpostavljen celoviti studio za dizajn in inovacije za prilagojene ODM projekte, od koncepta do proizvodnje. Krepljenje profesionalnih pomorskih aplikacij, vključno z reševanjem, komercialnimi in vladnimi razpisi.
  - year: '2026'
    title: Gradnja prihodnosti raziskovanja vode
    body: Danes Paddle Board Overstock nadaljuje z razvojem napihljivih čolnov, SUP sistemov in prilagojenih morskih rešitev — povezovanje ljudi in organizacij z vodami sveta. 50+ držav oskrbovanih, letna zmogljivost 15.000 enot.
content_founding:
  tagline: Začetek
  title: Rojen ob obali
  subtitle: 'Paddle Board Overstock se je začel v obalni delavnici v Qingdau z enim čolnom in vizijo: zgraditi napihljiva plovila, ki bi se obnesla v resničnih morskih pogojih.'
  paragraphs:
    - Leta 2012 so naši ustanovitelji prepoznali vrzel na trgu — večina napihljivih čolnov je bila bodisi poceni, a nezanesljiva, ali visoko kakovostna, a neznosno draga. Verjeli so, da obstaja prostor za proizvajalca, ki nudi tako kakovost kot tudi vrednost.
    - Prvi trup je bil ročno izdelan, preizkušen v lokalnih vodah in izpopolnjen na podlagi resničnih povratnih informacij ribičev in malih komercialnih operaterjev. Ta povratna zanka — zgradi, testiraj, poslušaj, izboljšaj — ostaja še danes jedro naše inženirske filozofije.
    - Do leta 2015 se je novica razširila tudi izven Qingdaoja. Mednarodni distributerji so začeli zahtevati vzorce. Kar se je začelo kot lokalna delavnica, je postalo globalni dobavitelj.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Zgodnja proizvodna delavnica in proizvodnja
content_growth:
  tagline: Rast in inovacije
  title: Od delavnice do 12.000 m² Objekt
  subtitle: Neprekinjene naložbe v ljudi, opremo in procese so se preoblikovale Paddle Board Overstock v sodoben pomorski proizvodni obrat.
  paragraphs:
    - Z rastjo povpraševanja se je povečal tudi naš obrat. Razširili smo se iz majhne delavnice v tovarno velikosti 12.000 m² z namenskimi proizvodnimi linijami za RIB čolne, napihljive čolne, SUP deske in dodatke.
    - Vlagali smo v CNC rezalne stroje, visokofrekvenčno varilno opremo, proizvodne linije za drop stitch in celovite testne naprave — kar nam je omogočilo nadzor nad vsakim vidikom kakovosti proizvodnje.
    - Danes naša ekipa šteje 200-300 ljudi, pomorski inženirji, znanstveniki za materiale, strokovnjaki za nadzor kakovosti in usposobljeni obrtniki — mnogi med njimi so z nami Paddle Board Overstock že od samih začetkov.
founder:
  tagline: Spoznajte ustanovitelja
  title: Zgradil ga je vodar
  subtitle: Ustanovitelj David Chen združuje proizvodno strokovnost in življenjsko strast do vodnih športov — kombinacija, ki določa, kako Paddle Board Overstock pristopa k razvoju izdelkov.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — ustanovitelj Paddle Board Overstock
  story:
    - David Chen je odraščal ob obali Qingdaoja, kjer morje ni bilo počitniška destinacija, temveč način življenja. Mladost je preživel s kajakaštvom, jadranjem in ribolovom v Rumenem morju — izkušnje, ki so mu intuitivno pokazale, kaj morajo plovila prenesti.
    - Pred ustanovitvijo Paddle Board Overstockje David desetletje delal v pomorski proizvodnji, kjer je delal na področju proizvodnje, kakovosti in mednarodne trgovine. Vodil OEM je programe za evropske in severnoameriške blagovne znamke ter se iz prve roke učil standardov in pričakovanj svetovnih trgov.
    - 'Leta 2012 je ustanovil Paddle Board Overstock z enostavnim poslanstvom: izdelati napihljiva plovila, ki bi jim zaupal svoji družini na vodi. Ta osebni standard — ali bi to uporabil? — ostaja zadnji preizkus za vsak izdelek, ki zapusti tovarno.'
    - Danes David vodi strategijo izdelkov in nadzoruje ekipo za raziskave in razvoj, osebno pregleduje nove zasnove in testira prototipe na vodah ob Qingdaoju. Verjame, da odlični izdelki izhajajo iz razumevanja tako inženiringa kot izkušenj.
philosophy:
  tagline: Filozofija blagovne znamke
  title: Inženirska svoboda na vodi
  body: Svoboda na vodi ni le gibanje. Pomeni odkrivanje novih krajev, ustvarjanje zunanjih izkušenj, povezovanje ljudi z naravo in omogočanje profesionalnih misij. Inženirstvo to svobodo omogoča.
  pillars:
    - title: Zanesljivost na prvem mestu
      body: Vodna okolja zahtevajo zaupanje.Paddle Board Overstock Izdelki so zasnovani za stabilnost, vzdržljivost, varnost in dosledno delovanje.
    - title: Oblikovanje, osredotočeno na človeka
      body: Izdelki naj služijo ljudem, ne tehnologiji. Vsaka oblikovalska odločitev se začne z razumevanjem, kako ljudje uporabljajo plovila, kje raziskujejo in s kakšnimi izzivi se soočajo.
    - title: Dostopno raziskovanje
      body: Voda ne bi smela pripadati le strokovnjakom.Paddle Board Overstock ustvarja opremo, ki omogoča več ljudem varno izkušnjo rek, jezer, oceanov in obalnih okolij.
    - title: Neprekinjene inovacije
      body: Inovacija ni le ustvarjanje novih izdelkov. Izboljšuje vsak detajl — materiale, strukture, proizvodnjo in uporabniško izkušnjo.
engineeringDna:
  tagline: Inženirska DNK
  title: Kako Paddle Board Overstock ustvarja izdelke
  areas:
    - title: Materialna znanost
      body: Paddle Board Overstock se osredotoča na izbiro primernih materialov za različna morska okolja. Ključni dejavniki vključujejo odpornost proti abraziji, UV odpornost, stabilnost pod pritiskom in dolgotrajno vzdržljivost.
      items:
        - Odpornost proti abraziji
        - UV Odpornost
        - Stabilnost pod pritiskom
        - Dolgotrajna vzdržljivost
    - title: Strukturno inženirstvo
      body: Napihljiva plovila zahtevajo natančno ravnovesje med togostjo, težo, prenosljivostjo in stabilnostjo. Paddle Board Overstock inženirstvo se osredotoča na optimizacijo teh dejavnikov z uporabo drop-stitch osnovne tehnologije in napredne konstrukcije šivov.
      items:
        - Togost
        - Optimizacija teže
        - Prenosljivost
        - Stabilnost
    - title: Natančnost izdelave
      body: 'Vsak izdelek gre skozi nadzorovane procese: priprava materiala, natančno rezanje, varjenje in lepljenje, sestavljanje, pregled kakovosti in preverjanje zmogljivosti.'
      items:
        - Priprava materiala
        - Natančno rezanje
        - Varjenje in lepljenje
        - Sestava in kontrola kakovosti
    - title: Inženirstvo uporabniških scenarijev
      body: Izdelki so razviti okoli resničnih uporab — rekreacija, avantura in profesionalna uporaba — kar zagotavlja, da vsak dizajn ustreza specifičnim zahtevam svojega namerovanega okolja.
      items:
        - Rekreacija
        - Avantura
        - Professional
        - Komercialno
trustSignals:
  tagline: Signali zaupanja
  title: Zakaj je Paddle Board Overstock zanesljiv partner
  manufacturing:
    title: Proizvodna zmogljivost
    body: Proizvodni obrat površine 12.000 m² z 200-300 usposobljenimi delavci in 14+ raziskovalno-razvojnimi inženirji. ISO 9001 certificiran sistem vodenja kakovosti. Letna proizvodnja 15.000 enot napihljivih plovil za 50+ držav.
    stats:
      - label: Velikost obrata
        value: 12,000 m²
      - label: Delovna sila
        value: 200-300
      - label: R&R inženirji
        value: 14+
      - label: Letna zmogljivost
        value: 15,000
  quality:
    title: Zavezanost kakovosti
    body: Od pregleda materiala do končnega testiranja, Paddle Board Overstock vzdržuje sistematične procese kakovosti za zagotavljanje zanesljivih morskih izdelkov. Vsaka enota je pred pošiljanjem podvržena preizkusu tlaka, pregledu šivov in preverjanju delovanja.
    items:
      - CE Certificirano — 64 modelov ustreza evropskim varnostnim standardom
      - ISO 9001:2015 — Certificiran sistem vodenja kakovosti
      - UKCA Oznaka CE — skladnost z britanskim trgom
  global:
    title: Globalna prisotnost
    body: Paddle Board Overstock služi strankam na večih globalnih trgih, podpira distributerje, zunanje blagovne znamke in profesionalne morske uporabnike v 50+ državah po Evropi, Azijsko-pacifiški regiji, Ameriki, Bližnjem vzhodu in Afriki.
