  tagline: Naša zgodba
  title: Paddle Board Overstock — Inženiring svobode na vodi
  subtitle: 'Od obalne delavnice do globalnega proizvajalca morskih plovil — naša pot temelji na trdni veri: vodna plovila bi morala biti zasnovana, kot da so pomembna, ker so.'
