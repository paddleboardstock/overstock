testimonial:
  content: Najemal sem 5 desk v lokalni trgovini in izgubil 60 % prihodkov zaradi njih.Paddle Board Overstock Pomagali so mi zgraditi svojo floto s 15 deskamiSUPs. Kalkulator, ki ROI so mi ga dali, je pokazal, da bom v 4 mesecih dosegel ničle — dejansko je trajalo 3. Zdaj širim na 30 desk in dodajam kajake.
  name: Daniel Okonkwo
  title: Lastnik, Lakeland SUP Rentals — Ontario, Kanada
content_segments:
  tagline: Profili najema
  title: Rešitve za najem vodnih športov<br />Po tipu operaterja
  subtitle: Različne najemne dejavnosti imajo različne potrebe — od SUP majhnih najemov ob plaži do velikih letoviščnih centrov za vodne športe. Prilagodimo naše pakete opreme in model podpore temu primerno.
  items:
    - title: SUP Najem plaže in ob jezeru
      subtitle: Operacije z velikim obsegom in nizko kompleksnostjo
      description: Operaterji, ki neposredno najemajo stoječe veslaške deske in kajake obiskovalcem plaže in obiskovalcem jezera. Vaša prednostna naloga je čim manj časa za odhod med najemi, ohranjanje opreme v rotaciji in upravljanje sezonskih skokov povpraševanja z majhnim skladiščnim prostorom.
      features:
        - SUP Napihljive flote, ki se zložijo ravno — brez potrebe po pomolu ali prikolici
        - Komercialni razred PVC , ocenjen za 100+ najemnih ciklov na sezono
        - UVHitro sušeča, odporna tkanina za pripravljenost na ponovni izposojo isti dan
        - Barvno kodirani razponi plošč za enostavno identifikacijo flote
    - title: Centri za vodne športe v letoviščih in hotelih
      subtitle: Izkušnja gostov in usklajenost z blagovno znamko
      description: Letovišča in hoteli, ki ponujajo vodne športe kot storitev na kraju samem. Oprema mora izgledati prestižno, zanesljivo delovati za goste začetnike in srednje zahtevne ter se vključevati v obstoječe rezervacijske in obračunske procese letovišča.
      features:
        - Oprema po meri z blagovno znamko SUP in rešilni jopiči v barvah letovišča
        - 'Mešana flota: SUPs, kajaki, pedalini in majhni čolni za vleko RIB'
        - Tihe, brezgorivne električne črpalke za napihovanje na plaži
        - Vključeno usposabljanje osebja in uvod v vzdrževanje
    - title: Najem čolnov in RIB
      subtitle: Poslovna flota za najem plovil
      description: Operaterji, ki izdajajo plovila z motorji — RIB čolne za vleko, napihljive čolne in majhne motorne čolne — na uro ali pol dneva. Vaša flota mora ustrezati pomorskim varnostnim predpisom, prenesti intenzivno uporabo gostov in zmanjšati mehanski izpad med najemi.
      features:
        - RIB paketi s 30–90 HP transomov pripravljenih za zunanje motorje
        - Plošče iz pomorske vezane plošče za dolgoročno strukturno vzdržljivost
        - Sistemi hitrega zagona ventilov za hitrejšo menjava
        - Komplet nadomestnih delov + na klic SLA tehnična podpora
    - title: Turistični in avanturistični operaterji
      subtitle: Flote za vodene izlete
      description: Operaterji, ki izvajajo vodene ture z vodnimi športi — SUP safariji, kajakiranje v jamah, izleti s potapljanjem z masko ali ture po otokih RIB. Oprema mora biti dovolj stabilna za začetnike, hitra za čiščenje med skupinami in dovolj vzdržljiva za vsakodnevno vodeno uporabo v različnih vodnih razmerah.
      features:
        - Izjemno stabilne SUP platforme (32" široke +) za začetnike
        - Možnosti tandem kajaka za pare / skupinske ture
        - Vgrajena kapaciteta za prtljažnik za snorkel opremo, vodoodporne torbe in hladilnike
        - CE + USCG dokumentacija skladnosti za komercialno delovanje
