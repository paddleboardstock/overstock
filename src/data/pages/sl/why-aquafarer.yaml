hero:
  tagline: Zakaj Aquafarer
  title: Zasnovano drugače. Zasnovano za poslovanje.<br />Partner za vodne avanture po vsem svetu
  subtitle: Ne le proizvajalec — poslovni partner, ki načrtuje, inženirsko oblikuje in dobavlja opremo komercialne kakovosti za klube, letovišča, najemnike in rastoče blagovne znamke na področju vode.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer kakovost in strokovnost proizvodnje
pillars:
  tagline: Tri stebra partnerstva
  title: Zakaj svetovna vodna podjetja izbirajo Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Zasnovano za komercialno uporabo
      description: Naša oprema je zasnovana za dnevni najem, ne za vikend rekreacijo. Oprema komercialne kakovosti PVC, ojačana jedra drop-stitch, UV-stabilne Hypalon možnosti in preizkušana strojna oprema pomenijo nižje stroške vzdrževanja, daljšo življenjsko dobo in večjo ROI za vaše poslovanje.
      icon: tabler:building-factory
      callToAction:
        text: Oglejte si komercialno linijo izdelkov
        href: /products
    - title: Od ideje do trga
      description: 'Zaženite svojo blagovno znamko vodnih športov v 90 dneh. Vodimo vas skozi vsak korak: potrjevanje koncepta, izbira izdelka, prototip, proizvodnja, oblikovanje embalaže in globalna dostava. Brez pritiska minimalnega naročila — začnite majhno, razširite se samozavestno.'
      icon: tabler:rocket
      callToAction:
        text: Začnite pot svoje blagovne znamke
        href: /oem-odm-blueprint
    - title: Zasnovano za svetovne pogoje
      description: 'Izdelki, optimizirani za vsak podnebni pas: formulation cold-water PVC za Evropo, material specifičnih proti UV za Bližnji vzhod in Avstralijo, anti-vlažni tretmaji za jugovzhodno Azijo. Vsako pošiljko kalibriramo glede na okolje ciljne destinacije.'
      icon: tabler:world
