reasons:
  tagline: Razlika Aquafarer
  title: Kaj nas loči
  isBeforeContent: false
  columns: 3
  items:
    - title: Prava proizvodnja, ne trgovanje
      description: Imamo in upravljamo 12.000 m² veliko tovarno. Ko sodelujete s Aquafarer, delate neposredno z ljudmi, ki načrtujejo, inženirsko oblikujejo in gradijo vaše izdelke — brez posrednikov.
      icon: tabler:building-factory
    - title: Inženirsko vodeno pristop
      description: Naš proces oblikovanja se začne s primerom uporabe, ne s kategorijo izdelka. Oblikujemo obliko trupa, izbiro materialov in konfiguracijo glede na dejansko uporabo opreme v komercialnem okolju.
      icon: tabler:engine
    - title: Certificirana kakovost
      description: CE certificirano, ISO kakovostni sistem, BSCI skladno, REACH skladno, rešilni jopiči odobreni Tip III/V; vsi izdelki izpolnjujejo veljavne mednarodne standarde.
      icon: tabler:certificate
    - title: Fleksibilno OEM/ODM
      description: Barve cevi, razporeditev konzole, blagovna znamka, embalaža — prilagodimo jih po vaših specifikacijah. Brez pritiska minimalnega naročila. Začnite s prototipom, razširite poslovanje samozavestno.
      icon: tabler:adjustments
    - title: Globalna logistika
      description: Skladišče v ZDA v Kaliforniji, neposredna pošiljka iz Qingdaoa, letalski prevoz za nujna naročila. Skrbimo za carinske formalnosti in dokumentacijo po vsem svetu.
      icon: tabler:truck-delivery
    - title: Celoživljenjska podpora
      description: Podpiramo čolne, ki smo jih izdelali pred 20 leti. Originalni rezervni deli, tehnični nasveti, navodila za popravilo — naša ekipa je na voljo, ko nas potrebujete, kjerkoli ste.
      icon: tabler:lifebuoy
testimonials:
  tagline: Zaupanje blagovnih znamk po celem svetu
  title: Kaj pravijo naši partnerji
  items:
    - content: Sodelovali smo z več proizvajalci na Kitajskem, vendar Aquafarer izstopa po inženirski podpori in dosledni kakovosti. Na našo blagovno znamko gledajo kot na svojo.
      name: — OEM Partner, evropska blagovna znamka vodnih športov
    - content: Njihove Hypalon RIBs so v uporabi v naši floti že več kot 5 let. Minimalno vzdrževanje, odlična odpornost na UV. 5-letna garancija na cevi nam daje zaupanje.
      name: — Operater flote, skupina letovišč na Bližnjem vzhodu
    - content: Ekipa Aquafarer nam je pomagala razviti prilagojeno zasnovo deske SUP od koncepta do proizvodnje v 90 dneh. Kakovost je presegla naša pričakovanja.
      name: — Distributer, avstralski vodni športi
    - content: Kot lastnik malega podjetja sem se bal glede MOQs. Aquafarer sta sodelovala z mojim proračunom in mi pomagala lansirati blagovno znamko z le 50 deskami. Zdaj naročam 500.
      name: — Ustanovitelj blagovne znamke, ameriško podjetje za izposojo SUP
cta:
  title: Pripravljeni za izgradnjo vašega vodnega posla?
  subtitle: Kontaktirajte našo ekipo za brezplačno svetovanje. Brez obveznosti — le iskren nasvet o opremi in proizvodnji.
  actions:
    - variant: primary
      text: Pogovorite se z našo ekipo
      href: /contact
    - text: Prenesite katalog izdelkov
      href: /resources
