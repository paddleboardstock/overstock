content_customization:
  tagline: Kaj je mogoče prilagoditi
  title: RIB Prilagajanje<br />Možnosti
  subtitle: Vsak element RIB čolna je mogoče prilagoditi vaši aplikaciji, tržnim in blagovnim znamkam.
  items:
    - title: Trup in konstrukcije
      description: Dolžina trupa (2,5–8,5 m), material trupa (GRP steklena vlakna ali aluminij pomorske kakovosti), barva trupa (gelcoat ali pobarvan), profil kobilice (globoko V, zmerno-V, ravno), krmni tip (zaprti krmni del z nosilcem ali jamico) ter strukturna ojačitev za komercialne obremenitve.
      icon: tabler:sailboat
    - title: Cev in ovratnik
      description: Material cevi (0,9–1,2 mm PVC ali 1,4–1,7 mm Hypalon/CSM), premer cevi (40–55 cm), število komor (3–7), vrsta ventila (Halkey-Roberts, Leafield D7 ali Boston), barva cevi (standardna ali prilagojena) in konfiguracija stožca/stožca ovratnika.
      icon: tabler:circle
    - title: Postavitev palube in konzole
      description: Sredinska konzola, stranska konzola ali krmilno krmiljenje. Razporeditev sedežev (sedeži za jahača, klopi, sedeži za oporo). Pokrivanje palube (EVAvidez penastega tikovine, protidrseča barva ali goli GRP). Točke za pritrditev opreme, držala in položaji D-obroča.
      icon: tabler:layout-dashboard
    - title: Elektrika in navigacija
      description: Navigacijske luči (LED), sistem črpalke za vodo, upravljanje baterij, namestitev VHF radia, namestitev GPS/kartplotterja, USB polnilni priključki in konfiguracija stikalne plošče.
      icon: tabler:bolt
    - title: Blagovna znamka in grafika
      description: Grafika trupa in cevi (sitotisk, toplotni prenos, UV digitalni tisk), postavitev logotipa, unikatne barvne sheme, identifikacijske oznake in dokumentacija lastnika po meri z vašo blagovno znamko.
      icon: tabler:palette
    - title: Varnost in skladnost
      description: Ocena kategorij zasnove (A/B/C/D poRCD), sistem za gašenje požara, specifikacije gorivnega sistema (prenosni rezervoar, fiksni rezervoar, podpaluba) in paket dokumentacije o skladnosti za vaš ciljni trg.
      icon: tabler:shield
content_applications:
  tagline: Konfiguracije aplikacij
  title: RIB Konfiguracije<br />Po uporabi
  subtitle: Različne misije zahtevajo različne konfiguracije. Tukaj so preverjene postavitve za RIB najpogostejše aplikacije.
  items:
    - title: Reševanje in patrulja
      description: Globoko-V trup, Hypalon cevi, samoizločna paluba, sedeži za oporo, ročaji, navigacijske luči in robustni D-obročki.RCD Oblikovalska kategorija B ali C. Požarno odporen gorivni sistem in komercialna električna oprema.
      icon: tabler:lifebuoy
    - title: Podpora potapljanju
      description: Široka širina, zadnja lestev za vkrcanje, položaji nosilca za tanke, dodatni D-obroči, nosilec za potapljaško zastavo, ojačana krma za dvojna zunanja krova in EVA protidrseča prevleka celotne palube.
      icon: tabler:mask
    - title: Turizem in trgovina
      description: Potniško certificirana postavitev s klopmi, senčnikom/Bimini, ograjalnimi ograjali, suhim shranjevanjem in sistemom z dvema baterijama.RCD Kategorija C. Zasnovano za upravljanje letovišč in čarterskih flot.
      icon: tabler:beach
    - title: Ribolov
      description: Odprta postavitev palube, položaji držalcev palice, živi vabni vodnjak, nosilec za iskanje rib, nosilec za trolling motor, ojačana krma in prenosni gorivni sistem. Možnosti sredinske konzole ali stranske konzole.
      icon: tabler:fish
    - title: Prosti čas in tender za jahte
      description: Lahka lupina, PVC cevi, udobna sedišča, teleskopski krmni drog ali kompaktna konzola, točke za dvig na davitu in odstranljiv rezervoar za gorivo. RCD Kategorija C ali D.
      icon: tabler:sailboat
    - title: Profesionalno delovno plovilo
      description: Možnost aluminijaste lupine, ojačitve za težke pogoje, hidravlično krmiljenje, električna oprema v komercialni kakovosti, radarska lokacija in točke za integracijo opreme po meri. Skladnost po meri za vsak projekt.
      icon: tabler:anchor
process_steps:
  title: 7-stopenjski RIB OEM/ODM razvojni proces
  subtitle: Od projektnega povzetka do poprodajne podpore — določen potek dela z jasnimi mejniki in dobavami
  steps:
    - number: '01'
      title: Projektni povzetek in zahteve
      description: Določite ciljno uporabo, velikost lupine, material cevi, zahteve glede skladnosti in potrebe po blagovni znamki. Ocenimo izvedljivost in potrdimo model sodelovanja (OEM/ODM/Pol-po-meri/Popolnoma po meri).
      timeline: 3–5 dni
    - number: '02'
      title: Tehnična preglednost in izvedljivost
      description: Inženirska ekipa pregleda strukturno izvedljivost, izračune stabilnosti in plovnosti, potek skladnosti ter razpoložljivost materialov. Ugotovimo obstoječe kalupe ali zahteve za izdelavo novih kalupov.
      timeline: 5–7 dni
    - number: '03'
      title: Predlog in ponudba
      description: Prejmite podroben predlog, ki vključuje specifikacije, 3D upodobitve ali GA risbe, obseg skladnosti, časovni načrt in enotno ceno glede na količinske stopnje in MOQ.
      timeline: 5–7 dni
    - number: '04'
      title: Potrditev dizajna in izdelava vzorca
      description: Potrdite končni GA, razporeditev palube in konfiguracijo cevi. Izdelamo pred-proizvodni vzorec z vašimi barvami blagovne znamke, logotipom in določenimi materiali za vašo fizično preiskavo.
      timeline: 15–20 dni
    - number: '05'
      title: Potrditev vzorca in QC protokol
      description: 'Preglejte in potrdite vzorec. Določite proizvodni protokol QC: preizkus tlaka (1,25x / 24–48h), dimenzijske kontrole in kontrolni seznam dokumentacije o skladnosti za vsako lupino.'
      timeline: 3–5 dni
    - number: '06'
      title: Serijska proizvodnja in nadzor kakovosti
      description: Polna proizvodnja z 100-točkovnim QC seznamom za vsako enoto. In-procesni pregledi, preizkusi tlaka in sledljivost na nivoju serij. CE/ISO dokumentacija pripravljena vzporedno.
      timeline: 30–45 dni
    - number: '07'
      title: Pakiranje, pošiljanje in poprodajna podpora
      description: Pakiranje po meri (standardno, pripravljeno za maloprodajo ali na paletah), izvozna dokumentacija, nakladanje kontejnerjev in logistika. Vključeni komplet nadomestnih delov in dokumentacija za vzdrževanje.
      timeline: 7–14 dni
certifications:
  title: Skladnost in certifikati za RIB plovila
  subtitle: Vsako naročilo po meri RIB je opremljeno z dokumentacijo o skladnosti za določen model
  items:
    - name: CE 2013/53/EU
      description: RCD skladnost po modelu in oblikovni kategoriji — DoC, plošča graditelja, uporabniški priročnik vključeni
      badge: CE
    - name: ISO 9001:2015
      description: Sistem upravljanja kakovosti, certificiran po SGS načrtovanju, proizvodnji in distribuciji
      badge: ISO
    - name: EN ISO 6185
      description: Standard za konstrukcijo napihljivih čolnov — stabilnost, vzgon in reševanje človeka čez krov
      badge: 6185
    - name: EN ISO 14945
      description: Standard za gradbene plošče — trajno označene podatke o identifikaciji in kapaciteti
      badge: 14945
    - name: BSCI
      description: Revizija socialne skladnosti za etično proizvodnjo — zahtevana s strani prodajalcev EU
      badge: BSCI
    - name: REACH
      description: EU skladnost s kemijsko PVCHypalonvarnostjo za , , lepila in premaze
      badge: REACH
content_service_modules:
  tagline: Servisni moduli
  title: OEM/ODM Služba<br />Moduli
  subtitle: Vsak projekt združuje prave servisne module. Ne potrebuje vsak projekt vseh modulov — upoštevamo le tisto, kar vaš projekt zahteva.
  items:
    - title: Inženirski pregled in izvedljivost
      description: 'Ocena platforme trupa, preverjanje strukturne izvedljivosti, preverjanje stabilnosti in vzgona, identifikacija poti skladnosti ter potrditev razpoložljivosti materialov. Rezultat: poročilo o izvedljivosti s priporočilom za go/no-go.'
      icon: tabler:math-function
    - title: Oblikovanje in konfiguracija
      description: 'GA risba, postavitev palube, konfiguracija cevi, položaji konzol in sedežev, načrt namestitve opreme ter izbira barve/materiala. Izhod: odobrena GA in konfiguracijska specifikacija.'
      icon: tabler:ruler
    - title: Vzorec in prototip
      description: Predprodukcijski vzorec z odobrenimi barvami, logotipom in določenimi materiali za fizični pregled. Vključuje protokol za odobritev vzorcev, kontrolni seznam za pregled in postopek zahteve za spremembe.
      icon: tabler:3d-cube-sphere
    - title: Proizvodnja in kontrola kakovosti
      description: Množična proizvodnja s 100-točkovnim kontrolnim seznamom QC na enoto, pregledi med procesom, testiranje tlaka (1,25x / 24-48h) in sledljivost na serijski ravni. CE/ISO dokumentacija pripravljena vzporedno.
      icon: tabler:clipboard-check
    - title: Blagovna znamka in embalaža
      description: Uporaba logotipa za zasebno blagovno znamko, unikatna grafika trupa in cevi, dokumentacija lastnika z blagovno znamko, embalaža pripravljena za prodajo ali paletizacijo ter priprava kompletov rezervnih delov.
      icon: tabler:palette
    - title: Izvoz in dokumentacija
      description: Izvozno pakiranje, načrt nalaganja kontejnerjev, FOBCIFDDP // dokumentacija, dokumentacija za skladnost glede na ciljni trg in protokol za komunikacijo po dostavi.
      icon: tabler:world
content_risk_control:
  tagline: Nadzor tveganja in izvedbe
  title: Projektno tveganje in<br />Upravljanje dostave
  subtitle: Strokovnjaki OEM/ODM kupci skrbijo za nadzor tveganj prav toliko kot za kakovost izdelka. Tako to upravljamo.
  items:
    - title: Opredelitev obsega in lastništva
      description: 'Pred začetkom razvoja pisno opredelimo: obseg prilagajanja, zahteve po orodjih, merila za odobritev vzorcev, lastništvo risb in kalupov ter odgovornosti za dokumentacijo. Ni dvomov glede tega, kdo kaj ima v lasti.'
      icon: tabler:file-text
    - title: Proces nadzora sprememb
      description: Vse spremembe specifikacij po potrditvi zasnove sledijo dokumentiranemu postopku zahteve za spremembe z oceno vpliva (stroški, časovni okvir, skladnost). Nobene neodobrene spremembe ne vstopijo v proizvodnjo.
      icon: tabler:arrows-diff
    - title: Garancija konsistentnosti serije
      description: 50. enota se ujema s prvim odobrenim vzorcem. Odobrene specifikacije so zamrznjene, materialni in procesni parametri so zaklenjeni, kontrolne točke med procesom pa preverjajo skladnost skozi celotno proizvodno serijo.
      icon: tabler:repeat
    - title: Izvedba in preglednost zmogljivosti
      description: Dobovni časi se navajajo na podlagi dejanske proizvodne zmogljivosti, zalog materiala in trenutne količine naročil — ne na podlagi aspiracijskih ciljev. Proizvodni urnik z datumi mejnikov za vsako naročilo.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Pogosta vprašanja
  questions:
    - q: Kakšna je razlika med OEM ODM in za RIB čolne?
      a: 'OEM (Proizvodnja originalne opreme): vi zagotovite podrobne specifikacije in mi izdelamo vaš načrt.ODM (Originalni dizajn Proizvodnja): izberete Aquafarer RIB preverjeno platformo in jo prilagodimo z vašimi želenimi funkcijami in blagovno znamko.ODM je hitrejša in cenejša;OEM nudi največji nadzor nad oblikovanjem.'
    - q: Ali lahko prilagodim RIB obliko in velikost trupa?
      a: Da. Ponujamo pol-prilagojene prilagoditve obstoječih kalupov trupa (drugačna postavitev palube, konfiguracije cevi) in popoln razvoj trupa po meri z novimi CNCstrojno obdelanimi kalupi. Pol-prilagojeni projekti se lahko začnejo pri 2-5 enotah; popolnoma prilagojeni običajno zahtevajo večje zaveze.
    - q: Kateri materiali cevi so na voljo za izdelavo po meriRIBs?
      a: Ponujamo 0,9-1,2 mm PVC za rekreativno in lahko komercialno uporabo, ter 1,4-1,7 mm HypalonCSM za profesionalne, reševalne in komercialne aplikacije, ki zahtevajo UV vrhunsko odpornost na ozon (življenjska doba 10-15 let v primerjavi s 5-8 leti za PVC).
    - q: Ali lahko nastaviš RIBs za specifične aplikacije, kot so reševanje, potapljanje ali ribolov?
      a: Da. Vzdržujemo preverjene konfiguracijske predloge za reševanje/patruljiranje, potapljaško podporo, turizem/čarter, ribolov, oskrbo jaht in profesionalne aplikacije za delo na čolnih. Vsaka predloga vključuje priporočeno vrsto trupa, material cevi, postavitev palube in opremo — ki jo nato prilagodimo vašim natančnim zahtevam.
    - q: Katere informacije potrebujete za RIB OEMODM / ponudbo?
      a: Ciljna aplikacija, želena dolžina trupa, preferenca materiala cevi (PVCali ), Hypalonpribližna količina in urnik dobave, zahteve glede skladnosti na ciljnem trgu ter vsi referenčni izdelki ali specifikacije. Več podrobnosti kot podate, hitrejša in natančnejša je naša ponudba.
    - q: Kaj je MOQ za ladje po meri?RIB
      a: Za obstoječe kalupe trupa s standardnimi modifikacijami se začne MOQ pri 2-5 enotah na dizajn. Za izdelavo po meri in popoln razvoj po meri je MOQ odvisno od zahtevnosti projekta — običajno 10-20 enot za pol-prilagojene in 30 za popolnoma prilagojene z+ novim orodjem.
    - q: Kdo je lastnik unikatnih kalupov in risb?
      a: Kalupi, razviti z Aquafarer osnovnimi vzorci Aquafarer , ostanejo lastništvo. Popolnoma po meri izdelani kalupi, ki jih naročnik naroči in plača, se lahko prenesejo v lastništvo naročnika po pogodbenih pogojih. Vsi pogoji lastništva kalupa so dokumentirani pred začetkom projekta.
    - q: Kako so RIBs prilagojeni paketi za izvoz?
      a: 'Standard: prilagojena + raztegljiva folija za nalaganje v posode. Premium: embalaža pripravljena za prodajo, vakuumsko pakiranje ali paletizirano. Ponujamo FOB Qingdao CIFin DDP pošiljanje. Vključena je popolna izvozna dokumentacija in carinsko dovoljenje.'
