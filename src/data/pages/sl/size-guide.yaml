how_to_choose:
  title: Kako izbrati pravo velikost
  cards:
    - title: SUP Deske
      description: Izberite dolžino glede na svojo težo in predvideno uporabo. Širše deske (32"+) nudijo večjo stabilnost. Daljše deske (11–12 ft) bolje sledijo na turi. Težji veslači potrebujejo deske z večjo prostornino.
    - title: Kajaki
      description: Enosedi kajaki (9 ft) so najboljši za solo potovanja in reke. Tandem kajaki (12 ft) ustrezajo dvema veslačema ali enemu odraslemu z opremo. Preverite nosilnost za skupno obremenitev, vključno z opremo.
    - title: Čolni in RIBs
      description: Izberite dolžino gumenjaka glede na število potnikov in predvideno uporabo. Večji RIBs (4,5 m+) so primerni za odprto morje in reševalne akcije. Manjši gumenjaki (2,7 m) služijo kot pomožna plovila in ribiške platforme.
