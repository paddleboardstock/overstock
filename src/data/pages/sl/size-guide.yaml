hero:
  title: Vodnik po velikosti in specifikacijah
  subtitle: Dimenzije, zmogljivosti in priporočene uporabe za vsak Aquafarer izdelek.
categories:
  inflatable: Napihljivi SUPs in kajaki, zasnovani za prenosnost, brez žrtvovanja zmogljivosti. Ujemajte pravo velikost s svojo težo in slogom veslanja.
  rib: Trdih lupin napihljivi čolni za obalno plovbo, patruljiranje in profesionalne morske operacije. Izbirajte glede na dolžino in zmogljivost motorja.
  accessory: Dodatki in varnostna oprema, ki dopolnjujejo vaše plovilo. Univerzalne velikosti z več možnostmi.
table:
  headers:
    product: Izdelek
