      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: Filozofija oblikovanja
  title: Oblikovanje pod vodstvom inženiringa<br />— Vsak detajl je pomemben
  subtitle: Naša inženirska filozofija temelji na treh principih, ki usmerjajo vsak izdelek, ki ga izdelamo.
  list:
    - 'Zanesljivost na prvem mestu: Vsak izdelek Aquafarer je testiran, da prenese pogoje iz resničnega sveta — od reševalnih operacij v hladni vodi do najemov v tropskih letoviščih. Kjer je pomembno, preveč načrtujemo.'
    - 'Natančnost proizvodnje: Naši objekti uporabljajo CNC rezanje, visokofrekvenčno varjenje in avtomatizirano testiranje tlaka. Vsak šiv, vsak ventil, vsaka spojka ustreza dokumentiranim specifikacijam.'
    - 'Stalna inovacija: Naša R&D ekipa nenehno ocenjuje nove materiale, proizvodne metode in izboljšave dizajna. Ne čakamo na težave — jih predvidevamo.'
