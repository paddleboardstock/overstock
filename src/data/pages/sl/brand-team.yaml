      description: Doktorat iz materialne znanosti. Specializira se za tehnologijo drop-stitch in visokofrekvenčne varilne procese. 10+ let izkušenj s tekstilnimi kompoziti.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Direktor proizvodnje
      name: Liu Qiang
      description: 18 let izkušenj v vitki proizvodnji in optimizaciji proizvodnih linij. Six Sigma Black Belt. Uvedel sistem kakovosti ISO 9001.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Vodja kakovosti
      name: Wang Fang
      description: 12+ let v nadzoru kakovosti v pomorstvu. Certificirani CE in ISO revizor. Nadzoruje testiranje vsake proizvodne serije.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Direktor prodaje in operacij
      name: Helen Lee
      description: 15+ let v mednarodni B2B trgovini. Upravljala OEM/ODM partnerstva v 30+ državah. Poliglotka, tekoče govori 4 jezike.
