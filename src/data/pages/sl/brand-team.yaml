hero:
  tagline: Naša ekipa
  title: Ljudje za Aquafarer<br />— Inženirstvo svobode na vodi
  subtitle: Ustanovljen leta 2012 v Qingdau, na Kitajskem, je Aquafarer nastal pod vodstvom pomorskih inženirjev, materialnih znanstvenikov in navdušencev nad vodnimi športi, ki so verjeli v omogočanje dostopa do napihljivih vodnih plovil profesionalne kakovosti po vsem svetu.
  image:
    src: /images/team-all.webp
    alt: Aquafarer skupinska fotografija celotne ekipe — inženiring, proizvodnja in vodstvo
founding:
  tagline: Naše ustanovitev
  title: Iz obalne delavnice<br />v objektu velikosti 12.000 m²
  subtitle: Aquafarer so ustanovili ekipa pomorskih inženirjev z več desetletji skupnih izkušenj na področju oblikovanja napihljivih čolnov, proizvodnje PVC/Hypalon in svetovne proizvodnje pomorske opreme.
  items:
    - title: 'Ustanovljeno: 2012'
      description: Ustanovljeno v Qingdau na Kitajskem — pomembnem pomorskem središču z dolgoletno ladjedelniško tradicijo.
      icon: tabler:calendar
    - title: 200-300 zaposlenih
      description: Vključuje 50+ inženirjev za raziskave in razvoj, strokovnjakov za kontrolo kakovosti ter proizvodne tehnike.
      icon: tabler:users
    - title: Objekt 12.000 m²
      description: Namenska proizvodna tovarna s 6 proizvodnimi linijami za RIBs, napihljive čolne in SUP deske.
      icon: tabler:building-factory
    - title: 50+ držav, ki jih oskrbujemo
      description: Izvoz v Evropo, Amerike, Bližnji vzhod, Azijsko-pacifiško območje in Afriko.
      icon: tabler:globe
leadership:
  tagline: Vodstvo
  title: Upravljanje in vodstvo v inženirstvu
  subtitle: Naša vodstvena ekipa združuje poglobljeno strokovno znanje iz pomorskega inženirstva, mednarodne trgovine in upravljanja kakovosti.
  columns: 3
  items:
    - title: Ustanovitelj in izvršni direktor
      name: Toby Liu
      description: 15+ let v morski proizvodnji. Prej vodil raziskave in razvoj pri velikem kitajskem proizvajalcu čolnov. Ima več patentov na področju oblikovanja napihljivih čolnov.
      icon: tabler:crown
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-toby-liu-team.webp
    - title: Glavni inženir
      name: Zhang Wei
      description: 20+ let v PVC/Hypalon izdelavi in oblikovanju trupa z globokim V. Nekdanji tehnični direktor pri evropskem podjetju za morske inženiring.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
