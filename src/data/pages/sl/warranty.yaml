label: Garancija
headline: Aquafarer Omejena garancija proizvajalca
subtitle: Aquafarer Stoji za kvaliteto vsakega napihljivega morskega izdelka, ki ga proizvajamo. Ta omejena garancija določa pogoje in kritje za Aquafarer vaš izdelek.
seo:
  headline: Aquafarer Garancija na napihljive čolne — 5-letna omejena garancija | Aquafarer
  description: Aquafarer Ponuja 5-letno omejeno garancijo na primarno cevno tkanino, spoje in strukturno celovitost trupa iz steklenih vlaken. Vključuje tudi napihovalne ventile in tovarniško vgrajene dodatke. Popolni pogoji za Aquafarer garancijo na napihljive čolne.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Ta omejena garancija velja za Aquafarer nove blagovne znamke napihljivih morskih izdelkov Aquafarer Aquafarer , kupljenih neposredno pri pooblaščenem prodajalcu ali prodajalcu. Datum začetka veljavnosti je preverljiv datum prvotnega maloprodajnega nakupa.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garancija in trajanje</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Integriteta primarne cevi (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Strukturna celovitost ohišja iz steklenih vlaken</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Sposobnost zadrževanja zraka na napihljivem spoju cevi</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 let</h3>
        <p class="text-sm text-gray-600 mt-1">Funkcionalnost napihovalnega ventila</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 leto</h3>
        <p class="text-sm text-gray-600 mt-1">Tovarniško nameščeni dodatki in pomožni priključki</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 leto*</h3>
        <p class="text-sm text-gray-600 mt-1">Komercialna, najemna ali flotna uporaba — vse komponente</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Komercialna, državna, čarterska, najemna ali izobraževalna uporaba skrajša garancijo na 1 leto. Uporaba pri dirkah ali tekmovanjih garancijo popolnoma razveljavi.</p>
  </div>

  <h2>Kaj je zajeto</h2>
  <h3>Primarna tkanina iz cevi (5 let)</h3>
  <p>Aquafarer zagotavlja glavno cevno tkanino proti propadanju poroznosti, ki bistveno ogrozi sposobnost izdelka za vzdrževanje operativnega napihnjevanja. To velja za CSM Hypalon() prevlečeno tkanino in vse druge cevne materiale, uporabljene v proizvodnji.</p>

  <h3>Strukturna celovitost trupa iz steklenih vlaken (5 let)</h3>
  <p>Za izdelke s plastično ohišjem ojačanim s steklenimi vlakni je FRPosnovna kompozitna struktura zagotovljena pred strukturnimi okvarami zaradi napak v materialih ali izdelavi.</p>

  <h3>Sposobnost zadrževanja zraka v napihljivem spoju cevi (5 let)</h3>
  <p>Spoji napihljivih cevi, če so bili povezani med proizvodnjo, so zaščiteni pred proizvodnimi napakami, ki povzročajo znatno uhajanje zraka skozi šiv. Periodični pregledi in vzdrževanje ustreznih napihovalnih tlakov so pogoji kritja.</p>

  <h3>Funkcionalnost napihovalnega ventila (5 let)</h3>
  <p>Zračni ventili, ki so bili prvotno nameščeni, Aquafarer so zaščiteni zaradi proizvodnih napak v materialih ali izdelavi, ki preprečujejo, da bi ventil zadrževal zrak po načrtu.</p>

  <h3>Tovarniško nameščeni dodatki (1 leto)</h3>
  <p>Komponente in oprema, Aquafarer izdelane in prvotno nameščene v tovarni, so za eno leto zaščitene pred napakami v materialu in izdelavi. To izključuje izdelke tretjih oseb, ki so zajete le z ustreznimi garancijami proizvajalca.</p>

  <h2>Kaj ni zajeto</h2>
  <ul>
    <li>Kozmetične napake, kot so razbarvanost, madeži, bledenje, kreda ali kakršnakoli sprememba videza</li>
    <li>Predrtine, reze, trganja, raztrganine ali druge fizične poškodbe</li>
    <li>Razpokanje, razpoke, obraba, odrgnine ali propadanje zaradi trenja ali stika</li>
    <li>Razgradnja zaradi izpostavljenosti svetlobi UV, vremenskih vplivov ali atmosferskih pogojev</li>
    <li>Poškodbe zaradi stika z gorivi, topili, kislinami, alkalijami ali kemikalijami</li>
    <li>Škoda zaradi malomarnosti, nepravilne uporabe, zlorabe, nesreče ali običajne obrabe</li>
    <li>Težave z gelcoatom ali površino barve (mehurčki, razpoke, sprememba barve, bledenje)</li>
    <li>Poškodbe zaradi udarca, stresa, neprimerne podpore ali prevoza s prikolico</li>
    <li>Poškodbe zaradi nepravilnega napihovanja/spuščanja ali uporabe nepriznanih naprav za napihovanje</li>
    <li>Oprema, sestavni deli ali sistemi tretjih oseb (kriti s strani njihovih proizvajalcev)</li>
  </ul>

  <h2>Obveznost proizvajalca in pravno sredstvo</h2>
  <p>Edina in izključna obveznost Aquafarer je popravilo ali zamenjava, po izbiri Aquafarer, katerega koli sestavnega dela, ki se ugotovi kot pomanjkljiv zaradi materiala ali izdelave in je zajeto v tej garanciji. Popravila ali zamenjave izvaja Aquafarer ali pooblaščena servisna enota, ki jo določi. Sestavni deli, ki so popravljeni ali zamenjani, so zajeti le za neiztekli del prvotnega garancijskega obdobja.</p>

  <h2>Pogoji garancije</h2>
  <ul>
    <li><strong>Registracija:</strong>Izdelek mora biti ustrezno registriran, kot je določeno v pogojih garancije.</li>
    <li><strong>Vzdrževanje:</strong>Izdelek je treba vzdrževati v skladu z objavljenimi smernicami Aquafarer, vključno s periodičnim pregledom in vzdrževanjem ustreznega tlaka napihnjenosti.</li>
    <li><strong>Sodelovanje:</strong>Kupec mora v vseh zadevah, ki se nanašajo na garancijske zahtevke, v celoti in takoj sodelovati z Aquafarer.</li>
    <li><strong>Prvotni kupec:</strong>Ta garancija velja izključno za prvotnega končnega kupca in ni prenosljiva.</li>
  </ul>

  <h2>Komercialna uporaba</h2>
  <p>Če se izdelek uporablja za komercialne, državne, neprofitne, čarterske, najemne, učne ali kakršne koli druge namene, razen za zasebno rekreativno uporabo, se garancijsko obdobje za vse komponente zmanjša na eno (1) leto od prvotnega datuma maloprodajne kupnje. Uporaba v dirkah, tekmovanjih v hitrosti ali vzdržljivosti takoj in dokončno razveljavi garancijo v celoti.</p>

  <h2>Kako uveljaviti garancijo</h2>
  <p>Kontaktirajte Aquafarer ali pooblaščeni servis s potrdilom o nakupu in podrobnim opisom težave. Aquafarer bo pregledal zahtevek in dal navodila za pregled in servis.</p>
  <p>Za poizvedbe glede garancijskega servisa nas prosimo kontaktirajte preko našega<a href="/contact" class="text-sky-600 underline">kontaktna stran</a>z vašo številko naročila in podatki o izdelku.</p>

  <h2>Predmeti tretjih oseb</h2>
  <p>Oprema, komponente ali sistemi, ki jih proizvajajo tretje osebe (tudi če jih namesti Aquafarer), so zajeti izključno s katero koli garancijo, ki jo ponuja njihov ustrezni proizvajalec. Aquafarer izrecno odklanja kakršno koli garancijsko odgovornost za takšne izdelke tretjih oseb.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  To izjava o garanciji je povzetek celotne Aquafarer omejene garancije proizvajalca. Celoten pravni dokument o garanciji ureja vse pogoje in določila garancije. Specifikacije so lahko spremenjene brez predhodnega obvestila. Aquafarer je tovarna znamke Aquafarer Qingdao Manufacturing Hub.
  </p>
