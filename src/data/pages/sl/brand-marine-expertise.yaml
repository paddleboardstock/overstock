hero:
  tagline: Mornarska strokovnost
  title: Desetletja pomorskega inženirstva<br />v vsakem trupu
  subtitle: Paddle Board Overstock združuje globoko znanje o materialih, natančno proizvodnjo in testiranje v praksi, da proizvaja plovila, ki delujejo, ko je to pomembno.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock ekipa pomorskega inženirstva in R&R pri delu
expertise_materials:
  tagline: Materialna znanost
  title: Izbira pravega materiala<br />za vsako uporabo
  subtitle: Delamo s tremi osnovnimi materiali — vsak je izbran za specifične primere uporabe in zahteve po zmogljivosti.
  columns: 3
  items:
    - title: Mornarska kakovost PVC
      description: 1100 denier PVC tkanina — naš najbolj vsestranski material. UV-stabiliziran, odporen proti obrabi in skladen z REACH. Idealno za rekreativne čolne, SUP deske in kajake, kjer sta pomembna teža in stroškovna učinkovitost.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Izjemna odpornost proti kemikalijam in stabilnost UV. Hypalon čolni lahko z ustrezno nego zdržijo 15-20 let. Priporočeno za komercialne, reševalne in vojaške aplikacije, kjer je dolgotrajna vzdržljivost ključna.
      icon: tabler:shield
    - title: Fiberglass in aluminij
      description: Trupi iz steklenih vlaken Deep-V za RIBs in patruljne čolne — odlična zmogljivost rezanja valov v težkih razmerah. Aluminijasti trupi za težka komercialna delovna plovila, ki zahtevajo največjo trdnost in nosilnost.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Proizvodne zmogljivosti
  title: Natančna izdelava<br />v vsakem koraku
  subtitle: Naš obrat velikosti 12.000 m² je opremljen s specializiranimi napravami za vsako stopnjo proizvodnje.
  columns: 2
  items:
    - title: CNC Rezanje
      description: Računalniško nadzorovano rezanje zagotavlja natančne in ponovljive tkaninske panele z minimalnimi odpadki. Vsak kos se popolnoma prilega temu, kot je načrtovano.
      icon: tabler:cpu
    - title: Visokofrekvenčno varjenje
      description: Industrijsko HF varjenje ustvarja šive, močnejše od osnovnega materiala. Dosledna kontrola temperature in tlaka zagotavlja zračnost vseh zvarov v vsakem proizvodnem ciklu.
      icon: tabler:bolt
    - title: Sestavljanje jedra Drop Stitch
      description: Tisoči poliester niti povezujejo zgornje in spodnje plasti tkanine, kar omogoča inflacijo pod visokim pritiskom (15-20 PSI) za trde in stabilne SUP deske ter tla.
      icon: tabler:building-arch
    - title: Testiranje tlaka
      description: Vsak napihljiv izdelek se pred pošiljanjem testira pod pritiskom. RIB cevi se testirajo pri 1,25-kratni nazivni vrednosti — če zdržijo, bodo delovale na vodi.
      icon: tabler:wind
    - title: Preizkušanje moči šivov
      description: Naključni vzorci iz vsake proizvodne serije se podvržejo uničevalnemu testiranju moči šivov. Rezultati se beležijo in so sledljivi do specifičnih proizvodnih serij.
      icon: tabler:files
    - title: Testiranje na vodi
      description: Vsak RIB model opravi pomorske preizkuse pred certificiranjem. Testiranje v realnih pogojih na obali potrjuje zmogljivost, upravljanje in stabilnost.
      icon: tabler:ripple
expertise_design:
  tagline: Oblikovanje in inženiring
  title: Zasnovano za resnične pogoje
  subtitle: Naša filozofija oblikovanja se začne s tem, kako bo čoln uporabljen — nato pa okoli te uporabe gradimo inženirstvo.
  items:
    - title: Kobilica z globokim V-profilom
      description: Naši stekleni kobilci imajo izračunane kote deadrise, optimizirane za dolžino in namen vsakega modela. Strmejši V za delovanje v razburkani vodi, plitvejši za stabilnost.
    - title: Večpredelčna varnost
      description: Vsaka čoln ima 3-7 neodvisnih zračnih komor. Če je ena komora poškodovana, preostale komore omogočajo, da čoln ostane na vodi in delujoč.
    - title: Ergonomska postavitev
      description: Položaj konzole, višina cevi in namestitev sedeža so zasnovani glede na udobje uporabnika med daljšo uporabo — ne glede na to, ali patruljira, ribari ali prevaža.
    - title: Prilagojena konfiguracija
      description: Barve cevi, konfiguracija konzole, kapaciteta goriva, nosilci dodatne opreme — vsak model je mogoče prilagoditi tako, da ustreza specifičnim operativnim zahtevam.
cta:
  title: Imate v mislih določeno aplikacijo?
  subtitle: Naša inženirska ekipa lahko svetuje glede izbire materiala, oblikovanja in proizvodnje za vaš projekt.
  actions:
    - variant: primary
      text: Vprašajte naše inženirje
      href: /contact
    - text: Oglejte si ponudbo izdelkov
      href: /products
