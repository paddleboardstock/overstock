stories:
  tagline: Zgodbe raziskovalcev
  title: Prava doživetja pravih ljudi
  subtitle: Poslušajte veslače, družine in strokovnjake, ki uporabljajo opremo Aquafarer na vodi.
  items:
    - name: Sarah in Mike
      title: SUP lastniki Explorer 11, Kanada
      content: Naše Explorer 11 smo vzeli na tedenski potep po parku Algonquin. Odlično so se spopadli s prenašanjem čolnov in prečkanjem jezer. drop-stitch konstrukcija je pomenila, da smo jih lahko napihnili do 15 PSI in dobili trdno desko z zmogljivostjo, ki jo nudi zložljiva deska.
      image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
      location: Algonquin Park, Kanada
    - name: Carlos R.
      title: Jahač Cheetah Surge, Španija
      content: Cheetah Surge je moja prva izbira za obalno križarjenje. Živahna zasnova pritegne poglede na plaži, stabilnost pa mi daje samozavest v rahlih valovih. Odlično se obnaša, ne glede na to, ali potujem ali pa samo uživam ob sončnem zahodu.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Španija
    - name: Lina in družina
      title: Veslači Flowing Lotus, Švedska
      content: Družinska vikend doživetja na arhipelagu. The Flowing Lotus je dovolj stabilen, da lahko moja hči stoji nanj, medtem ko jaz veslam. Napihne se v manj kot 10 minutah — prikolica ni potrebna, samo čista družinska zabava na vodi.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-flowing-lotus-1.webp
      location: Stockholmski arhipelag, Švedska
    - name: Lt. Cmdr. Andres
      title: Raziskovalec Ocean Voyager, Filipini
      content: Svoj Ocean Voyager uporabljam za dolge obalne izlete okoli Palawana. Po mesecih dnevne uporabe v tropskih razmerah deska še vedno deluje kot nova. Oblika za turne vožnje prereže valove, ki bi ustavili manjše deske.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipini
    - name: Emma T.
      title: Tropical Breeze prvič, Avstralija
      content: Nikoli prej nisem bil na SUP. Tropical Breeze je tako stabilen, da sem se pri prvem poskusu počutil samozavestno. Zdaj veslam vsako vikend. Krivulja učenja je praktično nič — in deska izgleda osupljivo na vodi.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Avstralija
