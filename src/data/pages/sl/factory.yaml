    - challenge: Evropski zunanji trgovec je potreboval linijo zasebne blagovne SUP znamke z edinstvenimi grafikami za terase, okolju PVCprijazno in embalažo, pripravljeno za prodajo — vse to dostavljeno v 60 dneh.
