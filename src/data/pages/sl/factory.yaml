hero:
  tagline: Tovarna
  title: Tovarna in proizvodnja
  subtitle: 12.000 m² integrirane proizvodnje — od surovega materiala do končne čolna
intro:
  - Kot blagovna znamka tovarne **Aquafarer Qingdao Manufacturing Hub**, Aquafarer nadzoruje vsak korak proizvodnje — od prihoda surovin PVC in steklenih vlaken do končne pred-dobavne kontrole končnega čolna. Naša proizvodna enota v Qingdaoski coni gospodarskega razvoja obsega 12.000 kvadratnih metrov in vključuje specializirane delavnice za PVC rezanje, toplotno zatesnjevanje cevi, proizvodnjo trupov iz steklenih vlaken RIB, SUP digitalni tisk, končno montažo in testiranje kakovosti.
  - Z integracijo oblikovanja, inženiringa, izdelave prototipov, proizvodnje in testiranja pod eno streho odpravimo neučinkovitosti pogodbenega proizvodnega procesa in ohranjamo neposreden nadzor nad kakovostjo izdelave, izbiro materialov in časovnimi roki dostave. Vsak čoln, ki zapusti našo delavnico, je izdelan z našimi ljudmi, na naši opremi, po naših standardih.
