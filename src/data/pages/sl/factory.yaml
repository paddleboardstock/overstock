qc_section:
  tagline: Nadzor kakovosti
  title: Postopek testiranja in zagotavljanja kakovosti
  subtitle: Vsak čoln je pred odhodom obvezno testiran. Naš laboratorij za kakovost deluje neodvisno od proizvodnje in poroča neposredno vodstvu.
  steps:
    - step: '1'
      title: Pregled surovin
      desc: PVC, Hypalon, in drop-stitch tkanine prestanejo natezno testiranje (ASTM D751), širjenje trganja in UV preverjanje odpornosti, preden katera koli serija vstopi v proizvodnjo.
    - step: '2'
      title: 48-urni test zadrževanja zraka
      desc: Vsaka cevna komora se napihne na 125 % nazivnega tlaka in zadrži 48 ur. Padec tlaka nad 5 % sproži samodejno zavrnitev in ponovni pregled spoja.
    - step: '3'
      title: Testiranje obremenitve in ravnotežja
      desc: Dokončani čolni so naloženi do največje nazivne kapacitete in testirani glede stabilnosti, prostega krova in vodljivosti. Vsako plovilo je pred končnim pregledom testirano na vodi.
oem_section:
  tagline: OEM Projekti
  title: Študije primerov blagovnih znamk in OEM partnerstev
  subtitle: Od koncepta do kontejnerja — kako pomagamo globalnim blagovnim znamkam lansirati in širiti njihove linije napihljivih plovil.
  cases:
    - challenge: Evropski zunanji trgovec je potreboval linijo zasebne blagovne SUP znamke z edinstvenimi grafikami za terase, okolju PVCprijazno in embalažo, pripravljeno za prodajo — vse to dostavljeno v 60 dneh.
      solution: Razvili smo prilagojene digitalne tiskarske datoteke, pridobili REACHskladne in PVCstisnili vzorce iz 3 krogov v 1, tako da smo oblikovalsko ekipo združili v našo tovarno v Qingdaou.
      result: 55 dni od podpisanega PO do FOB. 2.400 enot v 4 SKU-jih. Ponovno naročilo je bilo oddano pred prihodom prvega kontejnerja.
    - challenge: Ameriški startup za vodne športe je potreboval visokozmogljiv drop-stitch kajak s prilagojeno obliko trupa, skupno embalažo in BSCI certifikatom za prodajo na drobno.
      solution: Prilagodil drop-stitch obstoječi kalup za kajak s spremenjenim profilom rockerja, razvil skupno embalažo in zagotovil BSCI celovito revizijsko dokumentacijo.
      result: Uspešno uvrščen v 3 večje ameriške verige za zunanje aktivnosti. 5.000+ enot v prvem letu z 98 % stopnjo prodaje.
    - challenge: Avstralski distributer je zahteval CERIB -certificiran štedilnik z unikatnimi barvami cevi, Hypalon možnostjo nadgradnje in skladnost z avstralskim standardom AS 1799.
      solution: Izdelali so predproizvodne vzorce s štirimi barvnimi različicami cevi, pridobljenimi CSM Hypalon od japonskega dobavitelja, in usklajevali testiranje skladnosti s standardom AS 1799 s tretjo osebo.
      result: Serija treh modelov RIB , predstavljena na trgu Avstralije/NZ. Sledila je zmaga na vladnem razpisu za 12 patrulj.RIBs
faq_section:
  tagline: Pogosta vprašanja
  title: '& B2B OEM Pogosta vprašanja'
  questions:
    - q: Kakšna je minimalna količina naročila (MOQ) za OEM SUP napihljive deske?
      a: MOQ za standardne modele se začne pri 5–10 enotah OEM . Prilagojeni kalupi in projekti zasebne blagovne znamke zahtevajo najmanj 200 enot, odvisno od zahtevnosti. Za lansiranja novih znamk so na voljo preizkusna naročila in vzorčne serije.
    - q: Ali Aquafarer ima BSCI certifikat?
      a: Da. Naša tovarna vzdržuje BSCI veljavno potrdilo o socialni skladnosti (revizijsko poročilo je na voljo na zahtevo). Prav tako hranimo ISO 9001:2015 za upravljanje kakovosti, 64 naših modelov izdelkov pa ima CE certifikat (TÜVRheinland).REACH in RoHS dokumentacijo o skladnosti, ki je priložena vsaki OEM pošiljki.
    - q: Kakšen je običajen dobavni čas za OEM naročilo?
      a: Standardni dobavni rok je 30–45 dni od potrjenega naročila in depozita. Razvoj po meri dodaja 15–20 dni za orodje. Nudimo pospešeno proizvodnjo za nujna naročila in sezonske konice v predpoletnem obdobju (jan.–mar.).
    - q: Ali lahko pošljete FOB Qingdao ali CIF v naš pristanišče?
      a: Da. Pošiljamo v FOB Qingdao, CIF večja svetovna pristanišča in DDP za kvalificirane partnerje. Naša logistična ekipa upravlja rezervacijo kontejnerjev, izvozno dokumentacijo in carinjenje. Pošiljamo v 50+ držav po trgih EU, ZDA, AV in Azije.
b2b_moq: 'Standard MOQ: 5–10 enot na model (SUP/kajak/drop-stitch). RIB MOQ: 2–5 enot. Preizkusna naročila so dobrodošla za nova partnerstva.'
production_flow:
  tagline: Proizvodni tok
  title: Od materiala do končne čolna
  subtitle: Vsaka ladja gre skozi 6 proizvodnih stopenj s kontrolnimi točkami QC na vsakem koraku. Nobenih bližnjic, nobenih preskočenih pregledov.
  stages:
    - stage: '01'
      title: Prejem materiala in vhodna kontrola kakovosti
      description: Vsi prihajajoči materiali so evidentirani po serijski/lot številki v našem sistemu ERP. PVC tkanin, drop-stitch jeder, ventili, lepila in strojna oprema so v karanteni do odobritve QC.
      qc_check: Vlečna trdnost (ASTM D751), odpornost proti trganju (ISO 4674), merilnik debeline, viskoznost lepila, pregled vizualnih napak
      qc_threshold: 100 % serij testiranih. Zavrnite, če je natezna trdnost < 90 % specifikacije, trganje < minimalne specifikacije ali kakršnakoli vizualna napaka
      responsibility: Prihajajoča ekipa za kontrolo kakovosti (3 inšpektorji)
    - stage: '02'
      title: CNC Rezanje in priprava materiala
      description: Računalniško optimizirano razporejanje postavi plošče na PVC zalogo, da se zmanjša odpadek. Samodejne CNC rezalne naprave vzdržujejo pozicijsko natančnost 0,1 mm.
      qc_check: Dimenzijska kontrola proti CAD DXF datotekam, pregled kakovosti robov, preverjanje števila panelov
      qc_threshold: Izmerjen je vsak 20. panel. Toleranca ±0,5 mm. Zavrnite serijo, če je >2 % izven tolerance
      responsibility: Vodja delavnice za rezanje
    - stage: '03'
      title: Varjenje in Drop-Stitch lepljenje
      description: Drop-stitch jedra so zunanjemu PVC laminatu pritrjena s termo-laminacijo. Cevi so varjene z RF ali vročim zrakom. Tirne vezi so tridimenzionalno združene s fuzijo.
      qc_check: Preizkus odlepljanja na vsakih 50 enot (ASTM D751), merjenje širine varjenja, pregled dnevnika temperature vročega zraka, vizualni pregled šiva pod backlight svetlobo
      qc_threshold: Minimalna natezna trdnost lupine 8 N/cm. Toleranca širine zvara ±1 mm. Vsak vidni kanal = zavrni
      responsibility: Kakovost varjenja (2 inšpektorja na izmeno)
    - stage: '04'
      title: Sestavljanje in napeljevanje
      description: 'Čolni se premaknejo na končno montažo, kjer se sestavijo vsi deli: trup + cevi, nameščeni ventili, D-obročki, ročaji, škatle za plavuti in namestitev torbe za prenašanje. Vsaka enota sledi 100-točkovnemu seznamu za montažo.'
      qc_check: Podpis 100-točkovnega kontrolnega seznama za enoto, preizkus delovanja ventila (10 ciklov odpiranja/zapiranja), preverjanje navora strojne opreme, vizualni pregled
      qc_threshold: 'Politika ničelnih napak pri varnostno kritičnih elementih (ventili, D-obroči, ročaji). Manjše kozmetične napake: AQL 2,5 (ISO 2859)'
      responsibility: Vodja montažne ekipe + kontrola kakovosti na liniji
    - stage: '05'
      title: Preizkušanje tlaka in zadrževanje kakovosti
      description: Vsaka komora je napihnjena na 1,25-kratno nazivno tlakovno vrednost (običajno 20–25 PSI) in vzdrževana 24–48 ur. Tlačni senzorji beležijo neprekinjeno. Komore, pri katerih pride do več kot 5-odstotnega padca tlaka, so zavrnjene in poslane na ponovni pregled šivov.
      qc_check: 24-urna beležka o vzdrževanju tlaka, kalibracija senzorja preverjena vsak dan, temperaturno kompenzirana meritve tlaka, ponovni test šiva po popravilu
      qc_threshold: Največ 5 % padca tlaka v 24 urah pri stabilni temperaturi. Vsaka komora, ki to preseže = 100 % ponovni pregled celotne proizvodne serije.
      responsibility: Laboratorij za kakovost (neodvisen od proizvodnje, prijavlja se vodstvu)
    - stage: '06'
      title: Končni pregled in pakiranje
      description: Končni vizualni in funkcionalni pregled. Površinske napake, barvna skladnost, preverjanje etikete/BIN, integriteta embalaže in popolnost dodatkov. Enote so vakuumsko pakirane, zložene v škatle in paletirane za natovarjanje v kontejner.
      qc_check: Popoln vizualni pregled, seznam dodatkov po SKU, test padca embalaže (1 m, naključni vzorec), preverjanje branja etikete/črtne kode
      qc_threshold: AQL 2,5 za večje napake, AQL 4,0 za manjše. Ni tolerance za varnostne napake. 100 % enot je vizualno pregledanih.
      responsibility: Končna ekipa QC (4 inšpektorji) + Vodja pakiranje ekipe
