workshops_section:
  tagline: Delavnice
  title: Proizvodne delavnice
  workshops:
    - title: PVC Rezanje in priprava materiala
      description: Avtomatske CNC rezalne naprave obdelujejo PVC, Hypalon in drop-stitch tkanine z natančnostjo do pod-milimetrske. Računalniško optimizirano gnezdenje zmanjšuje odpadke materiala in zagotavlja, da vsak panel ustreza dimenzijskim specifikacijam pred varjenjem.
      image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    - title: Varjenje cevi in toplotno tesnjenje
      description: Posebna varilna delavnica z napravami za toplotno tesnjenje in RF dielektričnimi prešami. Toplotni tesnilniki z vročim zrakom spajajo in fuzionirajo PVC cevi, medtem ko RF varovi ustvarjajo visoko trdnostne zračnog tesne šive, ki presegajo zahteve ISO 9001.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    - title: RIB Proizvodnja trupa — steklena vlakna
      description: RIB čolnovi trupi so izdelani z ročno metodo polaganja steklenih vlaken z uporabo poliester in vinilester smol. Vsaka plast je ročno zavita in vakuumsko pakirana za neprekinjeno kakovost. Kabina za nanos gelcoata zagotavlja visokosijajni, UV odporen morski zaključek.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-warehouse-storage.webp
    - title: SUP Tiskanje in dekoracija
      description: SUP deske so okrašene z digitalnim tiskom za polnobarvne grafike in sitotiskom za logotipe in ponavljajoče se vzorce. Digitalni tiskalniki ustvarjajo fotokakovostne dizajne krovov, medtem ko sitotisk nudi trajne, žive blagovne znamke.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    - title: Končna montaža in opremanje
      description: Montažna linija, kjer se trupi iz steklenih vlaken in PVC cevi združijo, motorji namestijo, krmiljenje in kontrolni sistemi povežejo in električni sistemi ožičijo. Vsak čoln sledi 100-točkovnemu kontrolnemu seznamu montaže, ki ga potrdi vodja ekipe.
      image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    - title: Preizkušanje in pregled kakovosti
      description: Vsak dokončan čoln prestane obvezno preizkušanje zadrževanja zraka, preverjanje ločevanja šivov in popolno sistemsko preverjanje pred pošiljanjem. Naš laboratorij za kakovost deluje neodvisno od proizvodnje in poroča neposredno upravi.
      image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
