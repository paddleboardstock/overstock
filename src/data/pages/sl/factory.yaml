material_traceability:
  tagline: Sledenje
  title: Sledenje materialom in kontrola serij
  description: Vsaki seriji surovine je dodeljena edinstvena številka serije v našem ERP sistemu. Od prihoda, preko proizvodnje do končnega izdelka, se seznam materialov vsakega čolna poveže z izvorno serijo dobavitelja. To omogoča popolno sledenje navzgor za vsako vprašanje glede kakovosti ali skladnosti.
  system: Po meri ERP (interni sistem) + fizične oznake na vsaki delovni nalogi
  coverage: 100 % proizvodnih materialov — PVC, Hypalon, drop-stitch tkanina, lepila, ventili, strojna oprema, embalaža
  records_retained: 10 let (po zahtevi CE 2013/53/EU)
  suppliers:
    - material: Morski razred PVC
      source: Kitajski in korejski dobavitelji
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch tkanina
      source: Lastna tkanina + zunanji partner
      certified: Notranja QC + dobavitelja ISO 9001
    - material: Ventili in strojna oprema
      source: Chinese OEM suppliers
      certified: ISO 9001, certifikati materialov po serijah
