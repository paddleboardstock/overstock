rd_services:
  tagline: Prilagojen R&D
  title: R&D storitve za partnerje
  services:
    - title: Prilagojen razvoj materialov
      desc: Razvijamo prilagojene tkaninske formulacije, laminate in lepilne sisteme, prilagojene vašemu delovnemu okolju in ciljem zmogljivosti.
    - title: OEM / ODM Produktno inženirstvo
      desc: Od skic koncepta do inženirskih paketov pripravljenih za proizvodnjo — naša ekipa lahko oblikuje, prototipira in potrdi čolne pod vašo blagovno znamko.
    - title: Neodvisno testiranje in certificiranje tretjih oseb
      desc: Uporabite naše ISO-skladne testne obrate za neodvisno testiranje materialov, potrjevanje izdelkov in podporo pri certificiranju.
  cta: Posvetujte se o vaših zahtevah za R&D →
  cta_link: /contact
vision:
  tagline: Naša vizija
  title: Oblikovanje prihodnosti vodnih športov
  body: Paddle Board Overstock si prizadeva voditi industrijo napihljivih čolnov in SUP skozi stalne inovacije, neomajno kakovost in trdno zavezanost varnosti ter trajnosti — kar na koncu bogati izkušnje ljubiteljev vodnih športov po vsem svetu. Paddle Board Overstock Raziskovalno-razvojni center je kraj, kjer strast sreča inovacije in postavlja nove standarde v industriji vodnih športov.
labs_section:
  tagline: Laboratoriji
  title: Naše laboratorije
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: PVC Laboratorij za tkanine
      description: Neprekinjeno raziskovanje in testiranje tkanin PVC in Hypalon za cevi glede natezne trdnosti, odpornosti UV, obrabe in fleksibilnosti pri nizkih temperaturah, da se zagotovi dolgoročna zanesljivost v morskih okoljih.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Študio za inženiring trupa
      description: CAD-podprto oblikovanje in analiza končnih elementov HDPE, aluminijastih in steklenih trupov. Vsak trup je digitalno simuliran glede porazdelitve napetosti in odpornosti na udarce, preden je izdelan prvi prototip.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: Center RF-varjenja
      description: Posvečena RF-varilna naprava s preciznim nadzorom temperature in tlaka, ki proizvaja visoko trdne, zračno neprepustne šive, skladne s standardi morske industrije za napihljive plovila.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Hidrodinamični testni rezervoar
      description: Testiranje modelov v našem notranjem rezervoarju za optimizacijo oblike trupa, plovne zmogljivosti, stabilnosti in učinkovitosti porabe goriva za različne obremenitve in morske pogoje.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Delavnica za prototipe
      description: Polnoprstno prototipiranje in opremljanje, kjer so novi modeli zgrajeni, montirani in preizkušeni na vodi. Vsak prototip prestane najmanj 20-urno testiranje v vodi pred odobritvijo proizvodnje.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Laboratorij za kakovost in inšpekcijo
      description: Posvečen laboratorij za zagotavljanje kakovosti, kjer se izvajajo testi natezne trdnosti, cikli za zadrževanje zraka, testi luščenja šivov in certificiranje materialov, da se zagotovi, da vsak čoln, ki zapusti delavnico, ustreza našim objavljenim specifikacijam.
      href: /randdcenter/quality-inspection-lab
