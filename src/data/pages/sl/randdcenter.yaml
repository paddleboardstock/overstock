hero:
  tagline: R&R Center
  title: Center za raziskave in razvoj
  subtitle: Osredotočeno na napredek
intro:
  - Raziskovalni in razvojni center (R&D) Paddle Board Overstock je gonilna sila naše misije za revolucioniranje opreme za vodne športe. Water sports navdušence po vsem svetu opremljamo z varnejšimi, udobnejšimi in bolj zabavnimi izdelki skozi neprestano inovacijo v napihljivih stojnih veslaših deska (SUPs) in čolnih. Naša predana ekipa inženirjev, oblikovalcev in strastnih strokovnjakov za vodne športe oblikuje prihodnost industrije, stalno dviguje standarde kakovosti, zmogljivosti in trajnosti.
  - Naša R&D enota združuje materialne znanstvenike, ladjedelce in proizvodne inženirje pod eno streho. Od formulacije tkanin in simulacije trupa do razvoja varilnih procesov in celovitih poskusov na morju, je vsak korak razvoja izdelka vodeno z podatki in preverjeno s testiranjem.
mission:
  tagline: Naše poslanstvo
  title: Inoviranje prihodnosti vodnih športov
  pillars:
    - icon: lightning
      title: Tehnološki napredek
      desc: Pioneering novih materialov, oblik in proizvodnje za vrhunsko zmogljivost in dolgo življenjsko dobo izdelkov.
    - icon: design
      title: Uporabniku prijazna zasnova
      desc: Globoko razumevanje in preseganje potreb uporabnikov preko ergonomske in intuitivne zasnove izdelkov.
    - icon: globe
      title: Trajnostne prakse
      desc: Minimiziranje našega okoljskega vpliva z uporabo ekološko prijaznih materialov in procesov.
    - icon: shield
      title: Neomajna varnost
      desc: Zagotavljanje najvišjih standardov varnosti skozi rigorozno testiranje in certificiranje.
pillars:
  - title: Tehnološki napredek
    desc: Pioneering novih materialov, oblik in proizvodnih procesov za zagotavljanje vrhunske zmogljivosti izdelkov in dolge življenjske dobe.
    icon: tech
  - title: Napredni materiali
    desc: Preučevanje najsodobnejših PVC, Hypalon, kompozitov in trajnostnih alternativ za izboljšane lastnosti izdelkov.
    icon: materials
  - title: Trajnost
    desc: 'Osrednja zaveza: Zavezani smo k varovanju okolja preko trajnostne proizvodnje in reciklabilnih materialov.'
    icon: sustainability
capabilities:
  tagline: Sposobnosti
  title: R&D sposobnosti
  subtitle: Štiri glavne discipline, ki nam omogočajo popoln nadzor nad razvojem izdelka — od raziskav surovin do končne certificiranja.
  groups:
    - title: Materialna znanost in tehnologija tkanin
      items:
        - Analiza in optimizacija formulacij PVC in Hypalon
        - Razvoj stabilizacije UV, odpornosti proti ognju in protimikrobnih dodatkov
        - Večplastna laminacija tkanin in inženiring adhezije
        - Pospešeno staranje (UV, termično, vlaga, slana razpršitev)
    - title: Inženiring trupa & hidrodinamika
      items:
        - Parametrično 3D oblikovanje trupa in CFD optimizacija
        - Analiza s končnimi elementi za strukturne in udarne obremenitve
        - Testiranje v vlečni posodi s skalirnimi modeli in potrjevanje zmogljivosti
        - Razvoj posebnih trupov za posebne profle misij
    - title: Tehnologija varjenja in povezovanja
      items:
        - Razvoj in optimizacija RF dielektričnega procesa varjenja
        - Metode vročega zraka, vročega žleba in ultrazvočnega varjenja
        - Kvalifikacija lepilnega povezovanja in trakov
        - Modeliranje trdnosti zvara in napovedovanje življenjske dobe
    - title: Testiranje, certificiranje in skladnost
      items:
        - Upravljanje kakovosti in testiranje skladnosti CE
        - Podpora neodvisnega testiranja in certificiranja s strani tretje osebe
        - Razvoj prilagojenega testnega protokola za kvalifikacijo pri nabavi
        - Analiza okvar v uporabi in ugotavljanje osnovnega vzroka
