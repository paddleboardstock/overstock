testimonial:
  quote: Tisto, kar Aquafarer ločuje, je njihova materialna znanost. Ne sestavljajo le komponent — razvijajo PVC spojine, parametre varjenja in strukturne sloje v hiši. Ta vertikalna integracija se kaže v končnem izdelku.
  author: David Park
  title: Vodja razvoja izdelkov
  company: Bluewater Sports Equipment
  location: Avstralija
sections:
  - title: Drop-Stitch Jedro
    standard: 12-15 PSI delovni tlak
    description: Tisoče notranjih poliestrskih niti povezuje zgornjo in spodnjo plast ter ustvarja rigidno strukturo pri 12-15 PSI. To je ista tehnologija, ki se uporablja pri profesionalnih sup deskah in napihljivih dirkalnih čolnih. Naša drop-stitch gostota je optimizirana po modelu za idealno ravnovesje med togostjo in težo.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: DS diagram jedra
  - title: Morski razred PVC
    standard: Spojeno z varjenjem | UV / morska voda / preizkušeno na obrabo
    description: Večplastna laminirana PVC tkanina, ocenjena za morske pogoje. Vsak sloj je spojen z varjenjem namesto z lepljenjem, s čimer se odpravlja tveganje za delaminacijo. Preizkušeno za odpornost proti UV (ASTM G154, 1.000+ ur), korozijo zaradi morske vode (ISO 9227) in obrabo (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC plast
  - title: Hypalon Cevi
    standard: CSM guma | UV / kemična / odporna na ekstremne temperature
    description: Uporablja se pri RIB modelih, Hypalon (CSM) guma nudi superiorno UV in kemično odpornost v primerjavi s standardno PVC. Hypalon cevi ohranijo fleksibilnost pri ekstremnih temperaturah in odporne so na razgradnjo zaradi stika z gorivi in olji. Vse šive ročno postavljajo certificirani tehniki.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Zračni tla
    standard: Visokotlačni napihljivi | Nadomešča leseno/alu podlago
    description: Visokotlačni napihljivi podni sistem, ki nadomešča tradicionalne lesene ali aluminijaste letvene talne obloge. Zmanjša čas postavitve, skupno težo in volumen shranjevanja, hkrati pa zagotavlja dovolj togosti za stoječe delo, ribolov in hojo. Preizkušen za podporo 200+ kg razporejene obremenitve.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Zračni pod
