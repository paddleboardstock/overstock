intro:
  - 'Aquafarer Ustanovljen je bil leta 2012 z enim samim poslanstvom: oblikovati in proizvajati opremo za vodne športe, ki se na vodi obnese enako dobro kot v poročilu o kakovosti. Kar se je začelo kot SUP osredotočena delavnica za deske, se je razvilo v integrirano proizvodno tovarno velikosti 12.000 kvadratnih metrov v območju gospodarskega razvoja Qingdao, kjer proizvajajo napihljive čolne, RIBskajake, SUP deske, varnostno opremo in dodatke za stranke v 50+ državah.'
  - Danes Aquafarer deluje kot tovarniška blagovna znamka — vse pod eno streho oblikujemo, projektiramo, prototipiziramo, proizvajamo in testiramo. Ta vertikalna integracija nam daje neposreden nadzor nad izbiro materialov, kakovostjo izdelave in časovnimi okviri dostave. Vsak čoln zgradijo naši ljudje, na naši opremi, po naših standardih.
  - Služimo rekreativnim uporabnikom, komercialnim operaterjem, vladnim agencijam in partnerjem blagovnih znamk po vsem svetu. Naši OEM ODM programi pomagajo podjetjem lansirati lastne produktne linije brez vlaganja v tovarniško infrastrukturo. Ne glede na to, ali potrebujete en sam prototip ali celotno proizvodno serijo, vas naša ekipa vodi od koncepta do dostave, pripravljene za plovbo.
