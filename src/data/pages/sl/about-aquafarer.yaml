values:
  - title: Kakovost na prvem mestu
    desc: Vsaka ladja, ki zapusti našo tovarno, prestane obvezne teste zadrževanja zraka, luščenja šivov in sistemske teste pred odpremo.
  - title: Vertikalna integracija
    desc: Nadzorujemo vsak korak — od PVC rezanja do končne montaže — s čimer odpravimo neučinkovitosti izvajalcev in zagotavljamo konstantno kakovost.
  - title: Varnost kot standard
    desc: CE certifikacija je bistvena za to, kar izdelujemo. Naši 64 CE-certificirani modeli izpolnjujejo varnostne standarde EU za rekreativno in komercialno uporabo.
  - title: Osredotočeno na partnerja
    desc: Z OEM, ODM in partnerji zasebnih znamk gradimo dolgoročne odnose z uporabo transparentnosti, zanesljivosti in skupne rasti.
services:
  - title: OEM Proizvodnja
    desc: Izdelujemo po vaših specifikacijah. Delite svoje risbe, naš inženirski tim pa poskrbi za prototipe, orodja in proizvodnjo.
  - title: ODM Rešitve
    desc: Začnite z našimi preverjenimi platformnimi modeli. Prilagodite velikost, barvo, grafiko in embalažo za ustvarjanje svoje edinstvene produktne linije.
  - title: Zasebna znamka
    desc: Vaše ime blagovne znamke, vaš logotip, vaša embalaža. Izdelki so pripravljeni za maloprodajo z popolno integracijo blagovne znamke.
  - title: Prilagojena blagovna znamka
    desc: Tisk na palubne blazine, grafike trupa, nalepke na cevih in prilagojene oznake — stalna prisotnost blagovne znamke na vseh površinah.
certifications:
  - name: CE Certifikacija
    desc: Naše ladje in plovila so v skladu z Direktivo EU o rekreativnih plovilih (2013/53/EU) in relevantnimi usklajenimi standardi.
    scope: Ladje in plovila
  - name: null
    desc: Sistem upravljanja kakovosti certificiran za načrtovanje, proizvodnjo in distribucijo napihljivih plovil.
    scope: Celotna naprava
  - name: null
    desc: Napihljive ladje — zahteve glede varnosti in zmogljivosti za ojačane in trdo-bočne napihljive ladje.
    scope: RIB & napihljive linije
