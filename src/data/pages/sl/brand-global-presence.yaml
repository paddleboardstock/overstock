hero:
  tagline: Globalna prisotnost
  title: Postrežba v 50+ državah<br />Po vseh kontinentih
  subtitle: Od evropskih operaterjev obalnega patruljiranja do avstralskih distributerjev vodnih športov in ekip za reševanje na Bližnjem vzhodu — Aquafarer čolni so prisotni na vodah po vsem svetu.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer globalno pomorsko proizvodnjo in distribucijo
stats:
  title: Globalni doseg
  stats:
    - title: Države
      amount: 50+
    - title: Izvozna tržišča
      amount: Evropa, Amerike, Azija, Bližnji vzhod, Oceanija
    - title: Proizvodnja
      amount: Qingdao, Kitajska
    - title: Zaloga v ZDA
      amount: Montclair, CA
features3_markets:
  tagline: Ključna tržišča
  title: Regionalna strokovnost<br />où lokalne zahteve
  subtitle: Razumemo, da imajo različna tržišča različne regulativne zahteve, preference in primere uporabe.
  isBeforeContent: false
  columns: 4
  items:
    - title: Evropa in VB
      description: CE-certificirani izdelki, ki ustrezajo standardom EN ISO 6185. Močno povpraševanje po RIBs, napihljivih čolnih in SUP deskah po celotni EU. Distributerji v VB cenijo naš hitro odzivni čas.
      icon: tabler:map-pin
    - title: Severna Amerika
      description: Proizvodnja odobrena s strani ameriške obalne straže. Zaloga v ZDA v Montclair, CA za hitro dostavo na zahodni obali. Naraščajoče povpraševanje po ribiških čolnih, reševalnih plovilih in rekreacijskih SUPs.
      icon: tabler:map-pin
    - title: Avstralija in Oceanija
      description: Močno tržišče za RIB čolne in napihljive pramce. Avstralski distributerji cenijo naše Hypalon čolne zaradi odpornosti UV na hude sončne razmere. Hitro pošiljanje iz naše azijske proizvodnje.
      icon: tabler:map-pin
    - title: Bližnji vzhod
      description: Naraščajoče povpraševanje po patruljnih in reševalnih čolnih. Naši aluminijasti trupni RIBs so priljubljeni pri obalnih stražah in varnostnih operaterjih. Prilagojene konfiguracije za visoke temperature.
      icon: tabler:map-pin
features3_distribution:
  tagline: Distribucijsko omrežje
  title: Sodelovanje z distributerji<br />Po svetu
  subtitle: Sodelujemo z uveljavljenimi distributerji pomorske opreme, OEM blagovnimi znamkami in vladnimi nabavnimi agencijami.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM partnerstva
      description: Proizvodnja izdelkov pod lastno blagovno znamko za svetovne blagovne znamke vodnih športov. Poskrbimo za vse od oblikovanja do proizvodnje in dostave neposredno k stranki.
      icon: tabler:building
    - title: Omrežje distributerjev
      description: Pooblaščeni distributerji v 20+ državah imajo zalogo in nudijo lokalno podporo. Dobrodošli so novi povpraševanja distributerjev.
      icon: tabler:users
    - title: Vladni in institucionalni naročniki
      description: Neposredna dobava obalni straži, organizacijam za iskanje in reševanje ter vojaškim nabavnim programom. Skladnost z zahtevami institucionalnega naročanja.
      icon: tabler:building-community
steps2_logistics:
  title: Globalna logistika in podpora
  subtitle: Od tovarne do cilja — upravljamo celotno dobavno verigo.
  items:
    - title: Možnosti pošiljanja
      description: Pomorski prevoz (FOB Qingdao), zračni prevoz za nujna naročila in ekspresna kurirska dostava za vzorce in rezervne dele.
      icon: tabler:truck-delivery
    - title: Zaloga v ZDA
      description: 'Zaloga v Montclair, CA za hitro dostavo po vsej Severni Ameriki. Zahodna obala: 2-3 dni, Srednja: 3-4 dni, Vzhodna obala: 4-5 dni.'
      icon: tabler:building-warehouse
    - title: Rezervni deli
      description: Pravi Aquafarer rezervni deli in potrošni materiali na zalogi skozi vse leto. Pogosti deli se pošiljajo v 24 urah.
      icon: tabler:package
    - title: Tehnična podpora
      description: Neposredna povezava z našo inženirsko ekipo za tehnična vprašanja, nasvete za popravilo in podporo pri rekonstrukcijah. Podpiramo čolne, ki smo jih izdelali pred 20 leti.
      icon: tabler:headset
cta:
  title: Želite postati distributer?
  subtitle: Aktivno širimo naše distribucijsko omrežje. Kontaktirajte našo izvozni ekipo za pogovor o priložnostih partnerstva.
  actions:
    - variant: primary
      text: Povpraševanje po partnerstvu
      href: /contact
    - text: Oglejte si našo ponudbo izdelkov
      href: /products
