features3_certifications:
  title: Certifikati in skladnost
  subtitle: Vsak izdelek je neodvisno testiran; 64 modelov ima CE certifikat v skladu z mednarodnimi standardi.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE Certifikat
      description: 64 modelov s certifikatom CE med SUPs, kajaki, čolni in RIBs izpolnjuje evropski varnostni standard CE za rekreativne plovce. Vsak izdelek je pred zapustitvijo tovarne podvržen preizkušanju tlaka, plovnosti in obremenitve.
      icon: tabler:certificate
    - title: ''
      description: Naša 12.000 m² velika proizvodna enota v Qingdau deluje pod sistemom upravljanja kakovosti ISO 9001. Vsaka proizvodna serija je sledljiva, dokumentirana in pregledana.
      icon: tabler:clipboard-check
    - title: BSCI Družbena skladnost
      description: Smo BSCI-certificirani, kar zagotavlja etične delovne prakse, varne delovne pogoje in okoljsko odgovornost po celotni naši dobavni verigi.
      icon: tabler:users
    - title: REACH & RoHS
      description: Vsi materiali — PVC, Hypalon, EVA pena, lepila — so v skladu z uredbami EU REACH in RoHS. Brez omejenih snovi, brez kompromisov.
      icon: tabler:flask
    - title: Laboratorij za preizkušanje materialov
      description: Notranji laboratorij za materiale preizkuša natezno trdnost, odpornost na UV, integriteto šivov in odpornost proti obrabi za vsak serijo tkanine pred proizvodnjo.
      icon: tabler:microscope
    - title: 5-letna garancija na čoln
      description: Aquafarer čolni imajo 5-letno omejeno garancijo na tkanino cevi, šive in trup. SUP deske in dodatki imajo 2-letno garancijo. Stojimo za tem, kar izdelamo.
      icon: tabler:shield-check
testimonials:
  tagline: Zaupanje strank
  title: Kaj pravijo naši kupci
  subtitle: Od začetnikov veslačev do profesionalnih upravljavcev flote — poglejte, zakaj zaupajo Aquafarer.
  items:
    - content: Celotno floto najemnih vozil smo opremili z Aquafarer RIBs — 12 čolni na treh lokacijah. Dve sezoni, brez okvar. CE Certifikacijska dokumentacija je omogočila brezhibno odobritev zavarovanja. Njihova inženirska ekipa je celo prilagodila barve cevi, da so ustrezale naši blagovni znamki.
      name: Marco Valenti
      title: Direktor operacij, Adriatic Adventure Tours — Dubrovnik, Hrvaška
    - content: Kot prvi kupec sem bil nervozen glede kakovosti pri naročanju iz tujine. Dokumentacija ISO in poročila tretjih oseb, ki so mi jih posredovali, še preden sem jih sploh vprašal, so mi dala popolno zaupanje. Deska je prisla v 6 dneh in je presegla moja pričakovanja.
      name: James Thornton
      title: SUP Lastnik Explorer 11 — Vancouver, Kanada
    - content: Upravljamo 24 Aquafarer RIBs po celotni patruljni floti ob obali. Njihov QC proces je dosleden v vsakem paketu — enaka kakovost šiva, enaka postavitev ventilov, enaka ocena tlaka vsakič. Ta ponovljivost je pomembna, ko so življenja odvisna od opreme.
      name: Poročnik komandir Andres Reyes
      title: Pomorski nabavni častnik, Filipinska obalna straža — Manila, Filipini
features3_lab:
  title: Interno testiranje in laboratorij za kakovost
  subtitle: Vsaka serija materiala in končni izdelek gre skozi naš laboratorij za testiranje na kraju samem, preden odpre.
  columns: 3
  isBeforeContent: true
  items:
    - title: Testiranje natezne trdnosti
      description: 'Vsak PVC valj tkanine je testiran v skladu s standardi ASTM D751. Minimalna zahteva: 350 N/cm osnova in pretka. Zavrnjene serije se vrnejo dobavitelju — mi zavrnemo približno 3 % prejetih materialov.'
      icon: tabler:scale
    - title: UV Pospešeno staranje
      description: Vzorci tkanin so podvrženi 1.000-urnemu QUV pospešenemu vremenskemu preperevanju (ASTM G154). Ohranjanje natezne trdnosti mora po izpostavljenosti presegati 80 %. UV Izdelki, ocenjeni za+ 3 leta zunanje uporabe.
      icon: tabler:sun
    - title: Trdnost luščenja šiva
      description: RF varjeni šivi so bili testirani z minimalno odpornostjo 5 N/mm (ASTM D751). Ročno lepljeni šivi so bili testirani Hypalon pri 3,5 N/mm. Vsaka proizvodna serija ima vzorce šivov, ki so bili destruktivno testirani in arhivirani.
      icon: tabler:stack
    - title: 24–48-urno zadrževanje tlaka
      description: 'Vsak napihljiv izdelek napihnjen na 1,25x ocenjen PSI in nadzorovan 24–48 ur. Največja dovoljena padca tlaka: 5 %. Izdelki, ki na tem testu ne uspejo, se pred pošiljanjem ponovno predelajo in testirajo.'
      icon: tabler:wind
    - title: Testiranje cikla ventilov
      description: Vsaka zasnova ventilov v našem laboratoriju opravi 10.000 ciklov odprto-zapiranega. Ventili morajo po ciklih ohranjati nepredušen tlak pri 1,25x nazivnem tlaku. Vsi Aquafarer ventili so ocenjeni za 5+ let redne uporabe.
      icon: tabler:rotate
    - title: Odpornost proti hladnim razpokam
      description: Materiali so testirani pri -30°C 4 ure po ISO 4646. Razpoke ali krhkost niso dovoljena. Izdelki, namenjeni za zimsko shranjevanje in uporabo v hladni vodi do -10°C temperature okolja.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Kako zagotavljamo kakovost
  subtitle: Od pregleda surovin do končnega testiranja tlaka — vsak izdelek gre skozi strogo verigo kakovosti.
  items:
    - title: Pregled surovin
      description: Vsak zvitek PVC blaga je pred vstopom v proizvodnjo testiran glede debeline, natezne trdnosti in UV odpornosti.
      icon: tabler:search
    - title: Preverjanje kakovosti v procesu
      description: Na vsaki postaji med sestavljanjem se pregledujejo spoji varilnih spojev, vgradnje ventilov in vezji komor.
      icon: tabler:eye
    - title: Testiranje tlaka
      description: Vsak napihljiv izdelek se napihne na 1,25x oceno PSI in hrani 24–48 ur, da se preveri zadrževanje zraka in celovitost šivov.
      icon: tabler:wind
    - title: Končni pregled
      description: Vsaka enota je pregledana na zaključek, strojno opremo in embalažo, preden je odobrena za pošiljanje. Serijski vzorci gredo v naš laboratorij na destruktivno testiranje.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Pogosta vprašanja o čolnih
  subtitle: Pogosta vprašanja o naših napihljivih čolnih s trdim trupom.
  columns: 2
  items:
    - title: Kakšne velikosti RIB čolnov Aquafarer ponuja?
      description: Ponujamo 35 RIB modelov dolžine od 2,5 m do 7,6 m, ki pokrivajo vse od kompaktnih tenderjev do težkih komercialnih in patruljnih plovil. Vsak model je na voljo z več konfiguracijskimi možnostmi.
    - title: Kakšna je razlika med RIB napihljivim čolnom in tradicionalnim čolnom?
      description: (RIBNapihljiv čoln s trdim trupom) združuje trdno trup iz steklenih vlaken ali aluminija z globokim V-čolnom z napihljivim Hypalon čolnom ali PVC cevmi. To vam zagotavlja stabilnost in nosilnost trdega čolna z absorpcijo udarcev in vzgonom napihljivega čolna.
    - title: Kateri pogoni so združljivi z Aquafarer RIBsnjimi?
      description: Naša RIBs podpora izvenkrmnim motorjem je od 3 HP do 250 HP , odvisno od modela. Vsaka stran izdelka navaja največjo nazivno moč motorja. Priporočamo, da se posvetujete s svojim prodajalcem za idealno ujemanje.
    - title: So Aquafarer RIBs CE certificirani?
      description: Da. RIB Vsi rekreativni modeli so CE certificirani po veljavnih evropskih standardih za rekreativna plovila. Komercialni in patruljni modeli izpolnjujejo dodatne zahteve glede stabilnosti in obremenitve.
    - title: Kakšna je garancija za RIB čolne?
      description: Vsi Aquafarer RIBs imajo 5-letno omejeno garancijo na cevno tkanino, šive in trup; napihovalni ventili so kriti 5 let; tovarniško vgrajeni dodatki so kriti za 1 leto.
    - title: Koliko zračnih komor Aquafarer RIBs imamo?
      description: Naša RIBs oprema vključuje 3 do 7 neodvisnih zračnih komor, odvisno od dolžine modela. Ta večkomorna zasnova zagotavlja, da čoln ostane na vodi, tudi če je en predel ogrožen.
faqs_inflatable:
  title: Pogosta vprašanja o napihljivih čolnih
  subtitle: Pogosta vprašanja o naših napihljivih čolnih, kajakih in čolnih.
  columns: 2
  items:
    - title: Kateri materiali se uporabljajo v Aquafarer napihljivih čolnih?
      description: Uporabljamo vojaško kakovost PVC (1100 denierjev) in premium Hypalon/CSM gumo, odvisno od modela. Oba materiala sta UVstabilizirana, odporna na obrabo in skladna z REACH RoHS EU ter predpisi.
    - title: Kako dolgo zdržijo napihljivi čolni?
      description: Ob ustrezni negi PVC kakovosten napihljiv čoln zdrži 7–10 let, Hypalon medtem ko modeli lahko zdržijo 15–20 let. Redno čiščenje UV , zaščita in ustrezno shranjevanje bistveno podaljšajo življenjsko dobo.
    - title: Kakšno vzdrževanje je potrebno za napihljiv čoln?
      description: Osnovno vzdrževanje vključuje izpiranje s svežo vodo po vsaki uporabi (še posebej v slani vodi), sušenje pred shranjevanjem, letno preverjanje tesnil ventilov in nanašanje UV zaščitnega sredstva na cevi. Izogibajte se dolgotrajni izpostavljenosti soncu, kadar se cevi ne uporabljajo.
    - title: Ali se napihljivi čolni lahko uporabljajo v slani vodi?
      description: Da. Aquafarer Vsi napihljivi čolni so zasnovani tako za uporabo v sladki kot morski vodi. Priporočamo, da jo po izpostavljenosti slani vodi temeljito izperete s sladko vodo in temeljito posušite, da preprečite korozijo in kristalizacijo tkanine.
    - title: Kako shranim napihljiv čoln?
      description: Pred shranjevanjem čoln popolnoma izpraznite, očistite in posušite. Valjajte ga ohlapno (izogibajte se tesnim prepogibom), shranjujte na hladnem in suhem mestu, stran od neposredne sončne svetlobe, in se izogibajte betonskim tlakom, da preprečite vpijanje vlage.
    - title: Kakšna je nosilnost Aquafarer napihljivih čolnov?
      description: Kapacitete teže segajo od 290 kg za naše najmanjše modele do več kot 2000 kg za večja komercialna plovila. Vsaka stran izdelka navaja največjo nosilnost za vaš specifični model.
faqs_sup:
  title: SUP Pogosta vprašanja o deski
  subtitle: Pogosta vprašanja o naših stojnih sup deskah.
  columns: 2
  items:
    - title: Katere SUP velikosti desk so na voljo?
      description: Ponujamo SUP deske od 9 ft do 12 ft, vključno z univerzalnimi, turističnimi, za jogo in specialnimi dizajni. Naši najbolje prodajani modeli vključujejo Tropical Breeze (10 ft) in Ocean Voyager (11 ft).
    - title: Kaj je drop-stitch konstrukcija?
      description: Drop-stitch konstrukcija uporablja tisoče poliestrskih niti, ki povezujejo zgornjo in spodnjo plast deske, kar ji omogoča, da prenese visok zračni tlak (15–20 PSI) in zagotavlja trdno, stabilno platformo. To je industrijski standard za premium napihljive SUPs.
    - title: Kakšna je omejitev teže za SUP deske?
      description: Naše SUP deske podpirajo do 150 kg, odvisno od modela in volumna. Leviathan Wake deska je naš model z največjo nosilnostjo, zasnovana za večje uporabnike in za jogo.
    - title: Ali nudite kompletne SUP pakete?
      description: Da. Vsaka SUP deska se pošilja s celotnim paketom, ki vključuje 3-delno aluminijasto veslo, tlačilko za visok tlak, varovalno vrvico, potovalni nahrbtnik in komplet za popravilo. Nekateri modeli vključujejo tudi odstranljiv komplet plavuti.
    - title: Kakšna je garancija za SUP deske?
      description: Vse Aquafarer SUP deske imajo 2-letno garancijo proti proizvodnim napakam, vključno s poškodbami šivov, napakami ventilov in ločevanjem materiala pri normalni uporabi.
    - title: Koliko časa traja napihovanje SUP deske?
      description: Z uporabo priložene ročne tlačilke, polno napihovanje do 15 PSI traja približno 8–12 minut. Za hitrejše napihovanje priporočamo našo Aquafarer 12V električno tlačilko, ki napihne desko v manj kot 4 minutah.
