testimonial:
  content: Začeli smo s paketom Club Starter za našo šolo surfanja na Portugalskem. 20 desk, vesla, jopičev — vse je prispelo v 3 tednih. Po dveh sezonah smo nadgradili na paket Pro. Prilagojeno blagovno označevanje z našim logotipom je močno izboljšalo naš profesionalni videz.
  name: Ricardo Santos
  title: Lastnik, Algarve Surf Academy — Lagos, Portugalska
content_segments:
  tagline: Profili klubov
  title: Rešitve za vodne športne klube<br />Po tipu kluba
  subtitle: Od univerzitetnih veslaških klubov do ekskluzivnih zasebnih jahtnih klubov — vsak tip kluba ima edinstvene potrebe po opremi, vzorce uporabe in proračunske strukture. Vsak paket prilagodimo modelu kluba.
  items:
    - title: Univerzitetni in fakultetni veslaški klubi
      subtitle: Najbolj intenzivno uporabljane študentske flote
      description: Študentsko vodeni ali institucionalno podprti veslaški klubi, ki izvajajo programe SUP in kajaka za univerzitetne oddelke za rekreacijo. Oprema je izpostavljena visoko frekventni uporabi in hitremu obratu med več ravnmi sposobnosti vsak semester. Ključna sta vzdržljivost in enostavna popravila, skupaj s prijaznimi cenami za študentske organizacije.
      features:
        - Izjemno odporna PVC konstrukcija ocenjena za cikle uporabe študentov
        - Barvno kodirane serije desk po ravneh sposobnosti za lažje upravljanje flote
        - Komplet za popravilo + z video podporo v vsakem naročilu
        - Popusti za študentske organizacije in plačilni pogoji na semester
    - title: Skupnostni veslaški in družabni klubi
      subtitle: Rekreativni klubi, ki temeljijo na članstvu
      description: Klubi, ki temeljijo na skupnosti, ponujajo SUPčlanom izkušnje s kajakom in družabnim veslanjem. Oprema mora uravnotežiti zmogljivost in udobje za širok starostni razpon, z blagovno znamko, ki krepi identiteto kluba in ponos članov. Učinkovitost shranjevanja je ključna za klube, ki delujejo z omejenega dostopa do vode.
      features:
        - 'Mešana flota: vsestranskiSUPs, turistične deske in rekreativni kajaci'
        - 'Polna klubska znamka: prilagojene barve, tisk logotipov, blagovne znamke PFD'
        - Kompaktne rešitve za shranjevanje napihljive opreme
        - 'Začetni komplet za rast članstva: priporočilne kartice, blagovne znamke fotografije'
    - title: Šole surfanja in akademije za surf kajak
      subtitle: Obalna uspešnost in trenersko delo
      description: Šole, osredotočene na surfanje, poučujejo SUP deskanje, surf kajakaštvo in spretnosti vožnje z valovi. Oprema mora delovati v valovskih pogojih — okretna, odzivna in dovolj trpežna, da prenese ponavljajoče se padanje, obrabo peska in izpostavljenost slani vodi brez hitre degradacije.
      features:
        - SUP Krajše, širše oblike, optimizirane za okretnost v valovih
        - Ojačana tirna konstrukcija za odpornost na udarce v valovih
        - 'Varnostna oprema specifična za surfanje: zviti povodci, možnosti mehkih plavuti'
        - Program zamenjave voznega parka s sezonskimi popusti pri zamenjavi
    - title: Korporativni in zasebni jadralni klubi
      subtitle: Premium izkušnje članov
      description: Ekskluzivni zasebni klubi, ki ponujajo vodne športe kot vrhunsko ugodnost za člane. Standardi opreme so visoki — estetika, usklajenost blagovne znamke in gostom pripravljena predstavitev so prav tako pomembni kot zmogljivost. Pričakovanja storitev vključujejo dostavo z belimi rokavicami, rešitve za shranjevanje po meri in podporo na ravni concierge.
      features:
        - Vrhunske deske z lesenim EVA vzorcem in kovinskimi poudarki
        - Prilagojeno ujemanje barv s smernicami blagovne znamke kluba
        - 'Concierge dostava: vnaprej napihnjena, postavljena in označena za vsako sezono'
        - Namensko upravljanje računov s SLA za prioritetni odziv
