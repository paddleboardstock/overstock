content_segments:
  tagline: Profili partnerjev
  title: Modeli distribucijskega partnerstva<br />Po tipu partnerja
  subtitle: Različni distributerji prinašajo različne prednosti na trg — regionalna infrastruktura, dosegljivost e-trgovine, specializirana maloprodaja ali portfelji z več blagovnimi znamkami. Struktiramo pogoje partnerstva, cenovne nivoje in stopnje podpore, da ustrezajo vsakemu profilu partnerja.
  items:
    - title: Regionalni distributerji za morsko opremo
      subtitle: Ekskluzivna distribucija na ozemlju B2B
      description: Vzpostavljeni distributerji z infrastrukturo skladišč, mrežami distributerjev in logističnimi zmogljivostmi, ki oskrbujejo trgovce z morsko opremo, trgovce z vodnimi športi in najemodajalce znotraj določenega geografskega območja. Potrebujete celotno linijo izdelkov, zaščiteno cenovno politiko in zmožnost servisiranja računov distributerjev z lokalnimi zalogami in podporo.
      features:
        - Ekskluzivna zaščita teritorija z minimalnimi obveznostmi
        - Polni katalog veleprodajnih cen z četrtletnimi količinskimi rabati
        - Program lokalnih zalog na komisijo za hitro prodajane SKU-je
        - Usposabljanje trgovcev in trženjski programi s skupno blagovno znamko
    - title: E-trgovina in spletni prodajalci
      subtitle: Distribucijski kanali, usmerjeni na digitalno prvo pristop
      description: Spletni prodajalci, ki prodajajo opremo za vodne športe preko Amazon, eBay ali svojih e-trgovinskih platform. Hitrost na trgu, konkurenčne cene in logistika neposredno do potrošnika so ključni. Potrebujete partnerja, ki lahko pošilja posamezna naročila pod vašo blagovno znamko z hitro izpolnitvijo in brez tveganja zalog.
      features:
        - 'Drop-ship program: izpolnitev neposredno iz tovarne z vašo blagovno znamko'
        - API v realnem času za zalogo na vaši e-trgovinski platformi
        - Integracija Amazon Seller Central z EAN/UPC podporo
        - Vključena logistika vračil in obdelava zahtevkov za garancijo
    - title: Specializirani trgovci z opremo za vodne športe
      subtitle: Partnerji fizičnih razstavnih prostorov
      description: Fizične trgovine, specializirane za opremo za vodne športe — za lokalne veslače, ribiče in uporabnike čolnov s prodajo v živo, demonstracijami in servisom po prodaji. Potrebujete pakiranje, optimizirano za maloprodajo, programe demo enot in prodajne materiale, ki povečajo konverzijo strank v trgovini.
      features:
        - 'Program demo enot: znižani razstavni modeli v showroom-u'
        - Pakiranje pripravljeno za maloprodajo z dizajnom škatel, optimiziranim za police
        - Prodajni prikazi, primerjalne tabele in vodiči za kupce
        - Usposabljanje in certifikacija osebja v trgovini
    - title: Distribucija več blagovnih znamk in veleblagovnic
      subtitle: Distribucija širokega spektra športne opreme
      description: Veliki distributerji, ki oskrbujejo veleblagovnice, trgovske verige in verige športnih trgovin z več blagovnimi znamkami v katalogu. Doslednost, dokumentacija o skladnosti in skladnost dobaviteljev so od ključnega pomena — vsaka SKU mora izpolnjevati specifične zahteve trgovca glede pakiranja, označevanja in standardov kakovosti.
      features:
        - 'Dokumentacija o skladnosti trgovca: specifikacija pakiranja, črtna koda, označevanje'
        - EDI/ASN integracija za naročevalske sisteme glavnih trgovcev
        - Programi za zalogo, ki jih upravlja dobavitelj, in samodejno dopolnjevanje
        - Posvečen upravljavec računa z 24-urno odzivnostjo
