        description: Ekskluzivne zasnove izdelkov in specifikacije za vaš trg
      - title: Podpora lokalnega skladišča
        description: Konsignacija zalog, lokalne zaloge rezervnih delov in vzpostavitev regionalnega servisnega centra
      - title: Podpora mreži distributerjev
        description: Programi usposabljanja, certifikacijski tečaji in integracija iskalnika distributerjev
