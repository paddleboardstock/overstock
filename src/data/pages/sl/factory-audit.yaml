content_priorities:
  tagline: Kaj stranke preverjajo
  title: 8 stvari, ki jih kupci preverijo<br />ob vsakem obisku tovarne
  subtitle: Na podlagi povratnih informacij 50+ državnih kupcev so to osem prednostnih nalog, ki jih stranke ocenjujejo pred oddajo B2B naročila.
  items:
    - title: Pravi proizvajalec
      description: 'Ali ste dejanska tovarna, ne trgovinsko podjetje? Kupci preverjajo: poslovni subjekt, resnično proizvodno opremo, zaposlene, ki upravljajo stroje, trenutno proizvodna naročila na tleh in skladnost med spletno stranjo in delavnico.'
      icon: tabler:building-factory
    - title: Primernost izdelka za uporabo
      description: Ali RIB ustreza njihovemu specifičnemu primeru uporabe? Operaterji letovišč, reševalnih služb, potapljanja, ribolova in patrulj imajo temeljno različne zahteve. Kupci ocenjujejo postavitev krova, material cevke in možnosti opreme na prikazani ladji.
      icon: tabler:target
    - title: Kakovostna stabilnost in ponovljivost
      description: Ali je 50. enota enako dobra kot 1.? Kupci preučujejo sisteme nadzora kakovosti, kontrolne točke med procesom, ravnanje z neskladnostmi in zahtevajo vpogled v zapise več proizvodnih serij, da preverijo doslednost.
      icon: tabler:repeat
    - title: Pristnost dokumenta o skladnosti
      description: So CE certifikati specifični za model? Ali je DoC podpisal prava oseba? Ali je skladnost mogoče preveriti po številki trupa? Kupci preverjajo splošne trditve v primerjavi z dokumentacijo, specifično za model.
      icon: tabler:file-certificate
    - title: Izvajanje prilagajanja
      description: Ali lahko tovarna dejansko dostavi prilagojene konfiguracije? Kupci iščejo dokaze o preteklih prilagojenih projektih, razstavne prototipne vzorce, tehnične risbe in možnost neposrednega pogovora o tehničnih spremembah.
      icon: tabler:adjustments
    - title: Čas izvedbe in zmogljivost
      description: 'Ali so navedeni časovni okviri realni? Kupci ocenjujejo: trenutni obseg proizvodnje, razpoložljive zmogljivosti, velikost delovne sile, zaloge materiala in ali ima tovarna sistem načrtovanja proizvodnje.'
      icon: tabler:clock
    - title: Cena in trgovinski pogoji
      description: 'Ali so cene pregledne? Ali FOB so cene jasne? Kupci preverjajo: razčlenitev enotne cene, stroške orodja, stroške embalaže in ali tovarna lahko obvlada DDP ali CIF se strinja z ustrezno izvozno dokumentacijo.'
      icon: tabler:currency-dollar
    - title: Poprodaja in rezervni deli
      description: 'Kaj se zgodi po dostavi? Kupci ocenjujejo: razpoložljivost rezervnih delov, postopek garancije, dele zamenjave cevi, zamenjavo ventilov in ali ima tovarna dokumentiran poprodajni protokol.'
      icon: tabler:headset
content_tour:
  tagline: Trasa po tovarni
  title: Revizijski ogled —<br />Kaj boš videl
  subtitle: Naš standardni ogled tovarne sledi jasno določeni poti, zasnovani tako, da odgovarja na vprašanja kupcev na vsaki postaji.
  items:
    - title: 1. Sejna soba — predstavitev podjetja
      description: Poslovna licenca, ISO 9001 in BSCI certifikati, izvozne licence in zgodovina podjetja. Hiter pregled proizvodnih zmogljivosti in obsega skladnosti.
      icon: tabler:users
    - title: 2. Skladišče surovin — IQC postaja
      description: Zapisi o pregledu vhodnih materialov, potrdila o serijah tkanin, lepila in vzorci strojne opreme. Oglejte si, kako se materiali testirajo pred vstopom v proizvodnjo.
      icon: tabler:building-warehouse
    - title: 3. Izdelava cevi — RF varjenje in ročno lepljenje
      description: Postopek varjenja ali lepljenja živih cevi, demonstracije testiranja trdnosti spoja in namestitev ventilov. Opazujte gradnjo po komorah in kontrolne točke kakovosti.
      icon: tabler:flame
    - title: 4. Laminacija trupa — delavnica za GRP
      description: Postopek polaganja steklenih vlaken, nanašanje gelcoata in strjevanje trupa. Oglejte si razpored laminacije in strukturne ojačitve za RIB različne modele.
      icon: tabler:layers-subtract
    - title: 5. Sestavljanje in integracija
      description: Spajanje cevi trupa, namestitev konzole in sedežev, integracija električnega in gorivnega sistema ter montaža opreme. Opazujte proizvodno linijo v delovanju.
      icon: tabler:tool
    - title: 6. Postaja za preizkušanje tlaka
      description: 24-48-urni test vzdrževanja tlaka pri nazivnem tlaku 1,25x. Oglejte si zapise testov, merilnike tlaka in kriterije za uspeh/neuspeh. Oglejte si, kako so rezultati testov povezani s serijskimi številkami trupa.
      icon: tabler:gauge
    - title: 7. Končni pregled in kontrola kakovosti
      description: 100-točkovni kontrolni seznam kakovosti na enoto, dimenzijsko preverjanje, kozmetični pregled in pregled integritete embalaže. Pregled dnevnikov neskladnosti in evidenc o korektivnih ukrepih.
      icon: tabler:clipboard-check
    - title: 8. Soba za pregled dokumentov
      description: Dokumentacija skladnosti za vsak model (DoC, gradbena plošča, uporabniški priročnik), zapisi o sledljivosti proizvodnje, HIN register in demonstracija baze podatkov o sledenju serijskim materialom.
      icon: tabler:folder
content_qc_chain:
  tagline: Kakovostni dokazi
  title: 8-stopenjska veriga QC<br />— Preverljivo na vsakem koraku
  subtitle: Naša veriga nadzora kakovosti poteka od vhodnih materialov do končne pošiljke, z dokumentiranimi dokazi v vsaki fazi.
  items:
    - title: 'Faza 1: Pregled vhodnega materiala'
      description: Vsaka serija , , PVCHypalonsteklenih vlaken, aluminija, lepil in strojne opreme je testirana po specifikacijah pred vstopom v proizvodnjo. Preverjanje natezne trdnosti, oprijema premaza in dimenzij po AQL 2,5/ISO2859.
      icon: tabler:package
    - title: '2. faza: Varjenje cevi / Kontrola lepljenja'
      description: Testiranje trdnosti luščenja šivov na proizvodno serijo. RF varilni parametri so bili spremljani in beleženi. Ročno lepljeni šivi so preverjali dosledno pokritost lepila in čas strjevanja.
      icon: tabler:flame
    - title: 'Faza 3: Kontrola kakovosti laminacije trupa'
      description: Merjenje debeline gelcoata, preverjanje polaganja steklenih vlaken po načrtu laminata in spremljanje časa strjevanja. Položaji strukturne ojačitve preverjeni glede na inženirske načrte.
      icon: tabler:layers-subtract
    - title: 'Faza 4: Sestavljanje in integracija QC'
      description: Celovitost spoja cevi trupa, navor montaže konzole in sedežev, električna kontinuiteta ter test puščanja gorivnega sistema. Vsaka namestitev je bila preverjena glede na kontrolni seznam sestave, specifičen za model.
      icon: tabler:tool
    - title: 'Faza 5: Test zadrževanja pritiska'
      description: Vsaka napihljiva komora pod pritiskom na 1,25x nazivno vrednost PSI in zadržana 24-48 ur. Zabeležen je padec tlaka na komoro. Meja uspešnosti/neuspeha dokumentirana. Povezano s serijsko številko trupa.
      icon: tabler:gauge
    - title: 'Faza 6: Končni pregled'
      description: 100-točkovni kontrolni seznam kakovosti, ki zajema dimenzijsko natančnost, estetsko zaključek, popolnost dodatkov, dokumentacijski paket in integriteto embalaže. Neodvisno od proizvodne ekipe.
      icon: tabler:clipboard-check
    - title: '7. faza: Dokumentacija o skladnosti'
      description: DoC, specifičen za model, preverjanje tablic proizvajalca, popolnost uporabniškega priročnika in vnos v HIN register. Vsi dokumenti o skladnosti pripravljeni in preverjeni pred izdajo pošiljke.
      icon: tabler:file-certificate
    - title: 'Faza 8: Sprostitev pošiljke in sledljivost'
      description: Končna izdaja zahteva, da so vse faze kontrole kakovosti uspešno opravljene, dokumentacija skladnosti izpolnjena in potrjena transportna dokumentacija. Zapis trupa je zaprt in arhiviran za 10+ let hrani.
      icon: tabler:truck
content_traceability:
  tagline: Sledljivost proizvodnje
  title: → HIN Master File →<br />Dostava rekordov trupa →
  subtitle: Vsaka RIB ladja nosi edinstveno številko identifikacije trupa, povezano s popolno verigo proizvodnih in skladnih zapisov.
  items:
    - title: Številka identifikacije trupa (HIN)
      description: 14-znakovni edinstveni identifikator, trajno označen na vsakem čolnu. Kodira kodo proizvajalca (MIC), oznako modela, leto proizvodnje in serijsko številko. Ključ, ki odklene celotno verigo sledljivosti.
      icon: tabler:hash
    - title: Glavna tehnična datoteka
      description: Dokumentacija o skladnosti in inženiringu za družino modelov. Vsebuje GA risbe, oceno tveganja, izračune stabilnosti, specifikacije materialov in ustrezne standarde. Povezan je z vsemi trupi tega modela.
      icon: tabler:folder
    - title: Posamezni rekord trupa
      description: 'Proizvodni zapis za vsak trup: HIN, datum proizvodnje, serija cevi, certifikati materiala, rezultat preizkusa tlaka, končna konfiguracija, specifikacija motorja, rezultati kontrolnega seznama kakovosti in destinacija dostave. 21+ podatkovnih polj na trup.'
      icon: tabler:file-description
    - title: Paket za skladnost strank
      description: Paket dostave po trupu, ki vključuje DoC, fotografijo plošče proizvajalca, priročnik za lastnika, kontrolni seznam skladnosti in končni konfiguracijski list. Poslan skupaj z ladjo in arhiviran v tovarni že 10+ let.
      icon: tabler:package
content_red_flags:
  tagline: Pasti revizije
  title: Kupci z rdečimi zastavami<br />Enostavno opaziti
  subtitle: Pogoste težave, ki zmanjšujejo zaupanje kupcev med pregledi tovarn. Vsako od njih proaktivno rešujemo.
  items:
    - title: Nepodprti CE zahtevki brez obsega modela
      description: '„Vsi izdelki CE certificirani“ brez navedbe, katero direktivo, kateri modeli in kateri modul skladnosti. Rdeča zastava: nakazuje, da je skladnost površinska in ne po posameznem modelu, po posamezni konfiguraciji.'
      icon: tabler:alert-triangle
    - title: Brez dokazov fizičnih testiranj
      description: 'Trditve o preizkusu tlaka brez zapisov testov, merilnikov ali testne postaje, vidne na tovarniški površini. Rdeča luč: med obiskom ni mogoče preveriti trditev o kakovosti.'
      icon: tabler:alert-triangle
    - title: Manjkajoča sledljivost materiala
      description: 'Brez serijskih zapisov, brez vhodnega pregleda ali brez povezave med certifikati materiala in končnimi izdelki. Opozorilo: ni mogoče slediti težavam s kakovostjo do vira.'
      icon: tabler:alert-triangle
    - title: Splošna dokumentacija
      description: 'En DoC, ki zajema vse modele, brez zapisov, specifičnih za HIN, ali „predloge“ dokumentov skladnosti. Rdeča zastava: skladnost ni povezana z posameznimi proizvodnimi enotami.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Pošiljanje in pakiranje
  title: RIB Ladijski zaboj<br />Nakladanje in pakiranje v zaboje
  subtitle: Naše rešitve za pošiljanje varujejo vašo naložbo od Qingdaoa do pristanišča destinacije. Na voljo so načrti nakladanja kontejnerjev in specifikacije zabojev za vsak model.
  items:
    - title: Konfiguracije 20‑ft kontejnerjev
      description: 'Standardni 20ft kontejner: 1-2 RIB čolna (4,0-5,5 m) vstavljena z ločeno palubo in cevmi, ali 8-12 SUP deske. Na voljo so mešane RIB + SUP konfiguracije. Podroben načrt natovora je zagotovljen za vsak naročilo.'
      icon: tabler:box
    - title: Konfiguracije 40‑ft kontejnerjev
      description: 'Standardni 40-palčni kontejner: 2-4 RIB čolnov (do 7,0 m) z vstavljeni trupoma in zložljivimi cevmi, ali 20-30 SUP desk. Na voljo je 40-palčni HQ za višje RIB modele. Pakiranje, optimizirano po prostornini, znižuje stroške po pošiljani za enoto.'
      icon: tabler:container
    - title: Lesena embalaža za trupe RIB
      description: Aluminijasti in GRP trupovi zapakirani v lesenih škatlah po meri s penasto oblazinjenjem, prepreko za vlago in jeklenimi trakovi. Dimenzije škatel in teža po modelu so na voljo za logistično načrtovanje. Vključena je certifikacija ISPM-15 za toplotno obdelano leseno embalažo.
      icon: tabler:wood
    - title: Pakiranje za ločevanje cevi in palube
      description: Cevke so bile izpraznjene in zložene ločeno od trupa za učinkovito uporabo prostora. Palubne plošče, konzole in sedeži so pakirani v zaščitno embalažo skupaj s kompleti strojne opreme za montažo. Navodila za ponovno sestavljanje so priložena vsaki pošiljki.
      icon: tabler:package
    - title: Zaščita pred vlago in korozijo
      description: VCI papir proti koroziji za aluminijaste komponente, paketi s silikagelom kot sušilcem in vakuumsko zaprte vrečke s strojno opremo. Preprečuje poškodbe zaradi kondenzacije med 30-45 dnevnim pomorskim prevozom.
      icon: tabler:droplet-off
    - title: FOB Dokumentacija Qingdao
      description: Tovorni list, komercialni račun, seznam pakiranja, potrdilo o izvoru in dokumentacija o skladnosti za vsako pošiljko. Na voljo konsolidacija FCL in LCL. Podpora za carinsko dokumentacijo za trge EU, ZDA in Bližnjega vzhoda.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Verifikacni dokazi
  title: Revizijski dokazi<br />Lahko preverite na lokaciji
  subtitle: Med obiski v tovarni lahko stranke preverijo določene dokaze na vsakem proizvodnem področju. Tukaj je, na kaj morate biti pozorni — in na kaj se pripravimo pri vsakem pregledu.
  areas:
    - area: Skladišče surovin
      what_to_verify: Ali so materiali stabilni? Ali prihaja do mešanja serij?
      evidence: Zapisi prihajajoče kontrole, oznake serij, FIFO skladiščenje, seznam odobrenih dobaviteljev, certifikati materialov (PVC, Hypalon, steklena vlakna, aluminij, lepila, kovinska oprema)
      icon: tabler:building-warehouse
    - area: Proizvodnja cevi
      what_to_verify: Kako je zagotovljena trdnost šivov in zračna tesnost?
      evidence: Kartice procesov, potrditve prvega vzorca, zapisi preskusov tlaka po komorah, dnevniki popravila in ponovnega preskušanja, zapisi namestitve ventilov
      icon: tabler:flame
    - area: Proizvodnja trupa
      what_to_verify: Kako se nadzoruje strukturna doslednost?
      evidence: Dokumenti o nadzorovanih procesih, kontrolne točke kakovosti, oštevilčevanje polizdelkov, meritve debeline gelcoata, preverjanje razporeda laminacije
      icon: tabler:layers-subtract
    - area: Zbirno območje
      what_to_verify: Kako se prepreči napačna montaža izbirnih delov?
      evidence: BOM, delovni nalogi, kontrolni seznami konfiguracije, kartice za pregled delovnega mesta, preverjanje navorov in funkcionalnosti po modelu
      icon: tabler:tool
    - area: Testna postaja
      what_to_verify: Kako potrdite, da je čoln v redu pred dostavo?
      evidence: Preskusni postopki, seznam instrumentov, zapisi o kalibraciji, zapisi preskusov tlaka (1,25x / 24-48 h), kontrolni seznami funkcionalnih preskusov, dokumentirani kriteriji za uspeh/neuspeh
      icon: tabler:gauge
    - area: Področje neskladnosti
      what_to_verify: Kako se obravnavajo napake?
      evidence: Oznake izolacije, dnevnik NCK, analiza vzroka, zapisi o odobritvi popravil, sledenje CAPA (korektivnim in preventivnim ukrepom)
      icon: tabler:alert-triangle
    - area: Skladišče končnih izdelkov
      what_to_verify: Kako preprečiti napačno pošiljanje in škodo?
      evidence: Oznake končnih izdelkov, zapisi ujemanja naročil, standardi pakiranja, zapisi predpošiljne kontrole
      icon: tabler:box
    - area: Rezervni deli in poprodajne storitve
      what_to_verify: Ali lahko nudite dolgoročno podporo po prodaji?
      evidence: Seznam običajnih nadomestnih delov, strategija zalog, sistem številčenja delov, dokumentacija o postopku garancije, navodila za vzdrževanje
      icon: tabler:headset
content_closing_script:
  tagline: Revizija po naročilu
  title: Od obiska tovarne<br />v potrjeni projekt
  subtitle: Uspešen pregled ne bi smel končati s fotografijami in rokovanjem. Pred odhodom zagotovimo, da so dokumentirani trije poslovni rezultati.
  items:
    - title: Potrdi tehnično konfiguracijo
      description: Dogovorite se o modelu, aplikaciji, ključnih možnostih, ciljnem trgu, ocenjeni količini in urniku dostave — vse dokumentirano pred odhodom.
      icon: tabler:checklist
    - title: Potrdi dokumente za naslednji korak
      description: 'Določite, kaj Aquafarer zagotavlja naslednje: revidiran GA, seznam konfiguracij, ponudba, kontrolni seznam dokumentov, vzorčni načrt ali NDA — s specifičnimi časovnimi okviri.'
      icon: tabler:file-plus
    - title: Potrdite medsebojni časovni okvir
      description: Revidirana konfiguracija in predhodna ponudba v 3 delovnih dneh. Potrditev vzorca ali videza v 7 dneh. Inženirski pregled ali inšpekcija tretje osebe v 14 dneh. Naslednji datum sestanka in odgovorne osebe so določeni.
      icon: tabler:calendar
faq:
  title: Pregled tovarne — Pogosto zastavljena vprašanja
  questions:
    - q: Ali lahko osebno obiščem tovarno?
      a: Da. Dobrodošli ste na inšpekcijskih obiskih naše tovarne Qingdao s površino 12.000 m². Naša standardna tura zajema 8 postaj, od skladišča surovin do sobe za pregled dokumentov. Za začetno kvalifikacijo so na voljo tudi virtualni ogledi tovarne preko video klica.
    - q: Ali sprejemate inšpekcije tretjih oseb (BSCI, SMETA, SGS)?
      a: Da. Ohranili smo BSCI certifikat (Intertek) in sprejemamo protokole inšpekcij po meri naročnika. Na zahtevo lahko uredimo tudi SGS ali TÜV inšpekcije. Poročila o inšpekcijah so na voljo pod NDA.
    - q: Ali si lahko ogledam preizkus tlaka med obiskom?
      a: Naša postaja za preizkus tlaka je del standardne ture. Glede na proizvodni urnik lahko opazujete aktivne preizkuse tlaka z odčitki merilnikov in evidenco testov. Dnevniki preizkusa tlaka za posamezna trupa so vedno na voljo za pregled.
    - q: Kako obravnavate nepravilne izdelke?
      a: Nepravilne enote so ločene, dokumentirane in pregledane v skladu z našim ISO 9001 procesom korektivnih ukrepov. Izvede se analiza osnovnega vzroka, izvedeni so korektivni ukrepi, in dokumenti se vzdržujejo. Kupci lahko med inšpekcijami pregledajo naš NCR dnevnik.
    - q: Katera dokumentacija skladnosti je na voljo za pregled?
      a: 'Med auditom lahko pregledate: vzorce DoC po modelu, specifikacije graditeljske plošče, HIN register, osnutke priročnika lastnika, sezname veljavnih standardov in evidence ocenjevanja skladnosti po družini modelov.'
    - q: Kako rezerviram virtualni ogled tovarne?
      a: Kontaktirajte naš prodajni tim za načrtovanje live video ogleda preko WhatsApp, Zoom ali Teams. Sledimo isti poti 8 postaj in se lahko osredotočimo na specifična področja glede na vaše interese. Tipičen virtualni ogled traja 45-60 minut.
    - q: Ali je tovarna dejanski proizvajalec ali trgovsko podjetje?
      a: Aquafarer je dejanski proizvajalec. Obratujemo tovarno v Laixi, Qingdao. Poslovna licenca, obseg proizvodnje in fizična proizvodnja so vsi preverljivi med inšpekcijo.
    - q: Katere kakovostne evidence lahko pregledam?
      a: Evidenca pregleda prihajajočega materiala, kontrolne točke QC med procesom, dnevniki preizkusov tlaka, kontrolni seznami 100-točkovnega končnega pregleda, poročila o neskladnostih, evidence korektivnih ukrepov in sledenje po trupih. Vse se vodi v skladu z zahtevami ISO 9001.
