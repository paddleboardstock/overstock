hero:
  tagline: Revizija tovarne in dokazi
  title: Priprava na revizijo tovarne<br />& Kakovostni dokazi
  subtitle: Vse, kar B2B kupci preverijo med obiskom tovarne — od pristnosti proizvodnje in dokumentacije skladnosti do sledljivosti proizvodnje in sistemov nadzora kakovosti. Vedno pripravljeno na revizijo.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer priprava na tovarniški pregled in dokazila o kakovosti
direct_answer: Aquafarer vzdržuje 12.000 m² veliko proizvodno enoto v Qingdau, pripravljeno na revizijo, z dokumentiranimi QC procesi, sledljivostjo materialov, proizvodnimi zapisi na ravni HIN in dokumentacijo o skladnosti za vsak trup. Za kvalificirane kupce so na voljo ogledi tovarne na lokaciji in virtualno.
