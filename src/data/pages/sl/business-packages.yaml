faq:
  title: Pogosto zastavljena vprašanja o paketu
  questions:
    - q: Kakšno je najmanjše naročilo za pakete?
      a: Klubski začetni paket ima minimalno 10 enot. Paketi Resort in Brand so prilagojeni vašim potrebam z fleksibilnim MOQs.
    - q: Koliko časa traja dostava?
      a: Standardna proizvodnja traja 30–45 dni od potrditve naročila. Pospešena proizvodnja je na voljo za dodatno pristojbino.
    - q: Ali lahko prilagodim barve opreme in blagovno znamko?
      a: Da. Vsi paketi vključujejo polno prilagoditev — barve desk, tisk logotipa in oblikovanje pakiranja.
    - q: Ali nudite podporo po prodaji?
      a: Da. Vsak paket vključuje dostop do naših spletnih vodnikov za vzdrževanje, video vodičev in sistema za naročanje rezervnih delov.
