hero:
  tagline: Življenjski slog
  title: Paddle Board Overstock<br />Življenjski slog
  subtitle: Zasnovano za tiste, ki živijo ob vodi — od vikend raziskovalcev do komercialnih upravljavcev, ki se vsak dan zanašajo na svojo opremo.
values:
  - icon: 🌊
    title: Rojeni na vodi
    desc: Vsaka zasnova se začne s tem, da razumemo, kako se voda obnaša. Oblikujemo od roba pogojev navznoter — ker je ocean naš učitelj, ne naše delovno okolje.
  - icon: 🔧
    title: Zasnovano za trajnost
    desc: Najbolj trajnostni izdelek je tisti, ki ga ni treba zamenjati. Materiali morske kakovosti, drop-stitch jedra ocenjeno do 15 PSI in šivi, ki preživijo sezono.
  - icon: 🏆
    title: Dostopno po zasnovi
    desc: Vodna športna oprema ne bi smela biti luksuz. Profesionalna zmogljivost po ceni, ki je primerna za družine, vodnike in majhne upravljavce — ne le za komercialne flote.
  - icon: 🌍
    title: Globalna skupnost
    desc: 'Od obale Qingdaoa do jezer v Evropi, rek v jugovzhodni Aziji in zalivov v Ameriki — naši kupci imajo nekaj skupnega: ljubezen do bivanja na vodi.'
  - icon: ♻️
    title: Odgovorna proizvodnja
    desc: CNC-optimizirano gnezdenje zmanjša odpad materiala pod 5 %. Trajna konstrukcija zmanjšuje cikle zamenjave. Gradimo za dolgo življenjsko dobo, ker je to najbolj trajnostna izbira.
  - icon: 🤝
    title: Podpora, ki traja
    desc: Dvajset let stari trupovi nas še vedno pokličejo za nadomestne dele. Naš povprečni odziv za garancijo je 24 ur. Po prodaji ne izginevamo — tukaj smo za celotno življenje izdelka.
