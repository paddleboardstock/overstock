hero:
  tagline: Postopek
  title: Proizvodni proces
  subtitle: Od surovin do plovila, pripravljenega na morje — vsak korak je pod našim nadzorom
  back_label: Nazaj v tovarno
  back_link: /factory
intro: Za razliko od blagovnih znamk, ki proizvodnjo oddajajo zunanjim tovarnam, Aquafarer imajo v lasti in upravljajo celotno proizvodno verigo. Ta vertikalna integracija nam omogoča strogo kontrolo kakovosti v vsaki fazi, hitro odzivanje na prilagojene zahteve in zagotavljanje dosledne kakovosti izdelkov iz serije v serijo. Tako se v naši tovarni gradi čoln.
steps:
  - step: '01'
    title: Prejem in pregled materiala
    description: Vsaka prejeta serija PVC tkanine, steklenih vlaken, smole in strojne opreme se pregleda glede na specifikacije. Vzorci tkanin se pred začetkom proizvodnje testirajo na natezno trdnost, enakomerno debelino in UV odpornost. Neskladni materiali se izolirajo in vrnejo.
    duration: 1–2 dni
  - step: '02'
    title: PVC Samodejno rezanje
    description: Odobrene tkanine se položijo na CNC avtomatski rezalni stroj in režejo z natančnostjo pod milimetri. Računalniško optimizirano gnezdenje razporedi panele tako, da zmanjšajo odpadke — običajno pod 5%. Izrezane plošče so označene po modelu čolna in komori ter nato združene za prenos v varilnico.
    duration: 2–4 ure na komplet za čoln
  - step: '03'
    title: Toplotno tesnjenje in varjenje cevi
    description: Plošče se pritrdijo in lepijo z uporabo toplotnih tesnilnih strojev z vročim zračnim varjenjem pri nadzorovanih temperaturah 200–600 °C. Glavni spoji so ojačani z RF dielektričnim varjenjem za nepredušne, visoko trdne spoje. Končane komore se napihnejo na 1,25× delovni tlak za 30-minutno validacijo zadrževanja zraka.
    duration: 1–2 dni na ladjo
  - step: '04'
    title: Oblikovanje trupa iz steklenih vlaken RIB
    description: RIB Trupi čolnov so izdelani z ročno polaganjem steklenih vlaken. Plasti steklenih vlaken in tkanih rovingov se ročno valjajo s poliestrsko ali vinilestersko smolo v natančnih kalupih. Vsaka plast je vakuumsko zapakirana za dosledno kakovost laminata. Trup je zaključen z gelcoatom za visokosijajno, UVodporno morsko površino.
    duration: 2–4 dni na trup
  - step: '05'
    title: SUP Tiskanje in dekoracija
    description: SUP Grafika na deskah se uporablja z digitalnim tiskom za barvne foto-kakovostne dizajne, sitotisk pa za trpežne logotipe in ponavljajoče se vzorce. Tiskovi so utrjeni in zapečateni zaradi UV odpornosti na obrabo.
    duration: 1–2 dni
  - step: '06'
    title: Končna montaža in opremanje
    description: Steklena vlakna in PVC cevni sklopi so povezani na proizvodni liniji. Motor je nameščen, krmiljenje in krmiljenje plina sta povezana, nameščen je gorivni sistem, celoten električni snop pa je ožičen. Vsak čoln sledi 100-točkovnemu kontrolnemu seznamu sestavljanja z obveznim podpisom na vsaki stopnji.
    duration: 2–3 dni
  - step: '07'
    title: Preizkušanje in pregled kakovosti
    description: 'Vsaka dokončana ladja prestane obvezno kakovostno preverjanje: test zadrževanja zraka v komori, preverjanje delovanja sistemov, preverjanje navora pritrdilnih elementov in estetski pregled. Izdelave po meri in prototipi prav tako prejmejo preizkuse na morju, ki zajemajo hitrost, vodljivost, stabilnost in vzdržljivost.'
    duration: 1–2 dni
  - step: '08'
    title: Pakiranje in pošiljanje
    description: Čolni se izpraznijo, prepognejo po postopku, zapakirajo v robustne tkane vreče ali vezane zaboje in naložijo za pošiljanje. Vsak paket je označen z modelom, serijsko številko in ciljem. Usklajujemo se s špediterji za pošiljke FCL in LCL kontejnerjev po vsem svetu.
    duration: 1 dan
