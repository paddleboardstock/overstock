content_challenge:
  tagline: Izziv
  title: Potrebe ribiških čolnov<br />Stabilnost, doseg in vzdržljivost
  subtitle: Ne glede na to, ali upravljate komercialne ribiške ladje, vodite zadružno floto ali izvajate ribiške čarterje — vaš čoln mora vsak dan zanesljivo delovati.
  paragraphs:
    - Ribiški čolni potrebujejo stabilne platforme za rokovanje z vrvmi, upravljanje ulova in varno gibanje po krovu. Napihljivi čolni in RIBs nudijo prirojeno stabilnost zaradi zasnove cevi — pomembna prednost pred trdimi trupovi podobne dolžine.
    - Učinkovitost porabe goriva je pomembna za ribiške operacije, kjer stroški poslovanja neposredno vplivajo na dobiček. RIBs in napihljivi čolni so lažji od enakovrednih trdih čolnov, zahtevajo manj moči in porabijo manj goriva — ključno za komercialne operaterje, ki čolne uporabljajo vsak dan, in zadruge, ki upravljajo proračune flote.
    - Vzdržljivost v morskih okoljih je bistvena. Slana voda, izpostavljenost UV in stalna uporaba zahtevajo materiale, ki prenesejo težke pogoje brez poslabšanja. Za komercialne in zadružne operaterje zanesljivost neposredno vpliva na dohodek — pokvarjen čoln pomeni izgubljene ribiške dni.
    - Aquafarer ribiške konfiguracije vključujejo nosilce palic, odkrivala rib, posode za vabo, žive posode in rešitve za rokovanje z tovorom, zasnovane za resne ribiške aplikacije v komercialnih, zadružnih in rekreativnih operacijah.
content_solution:
  tagline: Naša rešitev
  title: Ribiško pripravljene konfiguracije
  subtitle: Vsak Aquafarer ribiški čoln se lahko konfigurira za vašo specifično ribiško aplikacijo.
  list:
    - Montaža nosilca palic — v tovarni nameščeno ali pripravljeno za naknadno montažo
    - Plošča za montažo fishfinderja/GPS na položaju konzole
    - Možnosti posod za vabo ali žive posode za čarter in komercialne operaterje
    - Konfiguracije hladilnika/shranjevanja za ravnanje z ulovom
    - Trup Deep-V za morsko sposobnost — stabilen v mirovanju, gladek pri hitrosti
    - PVC ali Hypalon cevne možnosti — Hypalon za UV daljšo osvetlitev
    - Izvenkrmni motorji se gibljejo od 15 HP do 115, HP odvisno od modela in uporabe
content_segments:
  tagline: Ribiški profili
  title: Rešitve za napihljive ribiške čolne<br />Po tipu operaterja
  subtitle: Od obalnega športnega ribolova do komercialnega longlininga — različne ribiške operacije zahtevajo različne konfiguracije trupa, dosege moči in postavitve na krovu. Vsak čoln prilagodimo ribolovu, vodam in načinu dela.
  items:
    - title: Komercialna ribiška podjetja
      subtitle: Flotni delovni čolni za vsakodnevne ribolovne operacije, rokovanje z mrežami, prevoz ulova
      description: Komercialna ribiška podjetja upravljajo delovne čolne za polaganje in pridobivanje mrež, vzdrževanje pasti, vztrajanje in prevoz ulova. Ta plovila delujejo vsak dan v morskih okoljih in morajo prenesti težke tovore, stalno ravnanje na palubi ter dolge delovne ure. Varčnost porabe goriva in nizko vzdrževanje sta ključna za dobičkonosnost flote. Plovilo mora zagotavljati stabilne delovne platforme za opremo za rokovanje posadke in ulov v različnih morskih razmerah.
      features:
        - Razporeditev ravne ploščadi za rokovanje z mrežami, zlaganje pasti in shranjevanje rib
        - Varčevalni 40-115 HP izvenkrmni motor za nizke dnevne obratovalne stroške
        - Hypalon Močne cevi za odpornost proti obrabi pri vsakodnevni uporabi
        - Ojačane drgnjene trake za pogost stik med pristaniščem in ladjo
        - Samoizčrpavajoča paluba za enostavno pranje po operacijah
        - Cene flote in dosledne specifikacije za večplovilne operaterje
    - title: Operaterji najemnega ribolova
      subtitle: Udobje za več potnikov, obvladovanje zaklepov, varnostno certificirano
      description: Upravljavci izvajajo polovične in celodnevne ribolovne čarterje — od ribolova na obalnih grebenih do ribolova na dnu na morju. Vaša ladja potrebuje sedeže za potnike z varnostnimi certifikati, dovolj prostora na palubi za več ribičev in integrirane vodnjake za ohranjanje svežine vabe in ulova skozi celotno potovanje. Udobje gostov neposredno vpliva na ocene izletov, ponovne rezervacije in spletne ocene.
      features:
        - Krmiljenje na konzoli z amortizirajočimi športnimi sedeži
        - Tovarniško nameščeni držalniki palic (4–8 položajev)
        - 60–115 HP izvenkrmnega dosega za hitrosti križarjenja na morju
        - CE Certifikacija kategorije C ali B za komercialne potniške operacije
        - Bimini ali T-top senčilo za udobje gostov na daljših potovanjih
    - title: Obrtni in mali komercialni ribiči
      subtitle: Zanesljivi delovni čolni za vsakodnevno preživetje
      description: Neodvisni ribiči, ki se zanašajo na svoj čoln kot glavni vir dohodka — postavljanje mrež, skrb za ribje pasti ali ročno postavljanje rib blizu obale. Vaša prioriteta je varčnost z gorivom, preprosto vzdrževanje, ki ga lahko opravite sami, in čoln, ki sprejme zmerne količine ulova in opreme, ne da bi pri tem žrtvoval stabilnost.
      features:
        - Varčevalni motor 15–40 za HP nizke obratovalne stroške
        - Hypalon CSM Cevi za UV podaljšano in odpornost proti obrabi
        - Razporeditev ravne palube za rokovanje z mrežami in shranjevanje rib
        - Enostavna možnost pristanka na plaži z napihljivo zaščito kobilice
    - title: Ribiške zadruge
      subtitle: Zbiranje ulova, prevoz članov, distribucija oskrbe
      description: Ribiške zadruge upravljajo s skupnostnimi flotami za zbiranje ulova od članov ribičev, prevoz zalog do oddaljenih ribiških skupnosti in distribucijo ulova na trge. Te delovne ladje potrebujejo visoko nosilnost, zanesljivo dnevno delovanje in enostavno vzdrževanje na oddaljenih lokacijah. Zadruge pogosto delujejo v razvijajočih se regijah, kjer je dostopnost rezervnih delov in servisnih storitev omejena, zato so preproste konfiguracije zunajkrmnih motorjev in trpežna gradnja nujna.
      features:
        - Visoka nosilnost za prevoz ulova in zalog
        - Preprosta zunanja konfiguracija za enostavno vzdrževanje na kraju samem
        - Težka PVC ali Hypalon konstrukcija za proračunsko prilagodljivost
        - Ravni tovorni prostor s pritrdilnimi točkami za zavarovanje tovora
        - Gorivno učinkovito delovanje, ki zmanjšuje skupne stroške delovanja
    - title: Športni in ribolovni navdušenci
      subtitle: Učinkovitost in slog za resne ribiče
      description: Izkušeni ribiči, ki iščejo sposobno ribiško plovilo, ki omogoča hitro doseganje oddaljenih območij, stabilne stoječe boječe položaje in vrhunsko obdelavo ter opremo. Čoln mora biti domač tako pri vožnji dvema miljama stran od obale do grebena kot pri raziskovanju oddaljenih estuarijskih zalivov.
      features:
        - Globok V-haj RIB trup za gladko vožnjo po valovih
        - Plošča za nosilec Fishfinder/GPS, že ožičena na konzoli
        - Baitwell in hladilnik integrirana v modul zadnjega sedeža
        - Prilagojene možnosti barve palube EVA, ki ustrezajo grafiki čolna/cevi
    - title: Vodnik za ribolov in ekološki turistični ponudniki
      subtitle: Vodene ribolovne izkušnje za obiskovalne ribiče
      description: Vodniki, ki vodijo majhne skupine obiskovalcev-ribičev na produktivna ribiška mesta — pogosto združujejo ribolov z elementi ekoturizma, kot so opazovanje ptic ali raziskovanje mangrov. Čoln mora pluti suho in udobno za goste, ki niso vajeni majhnih čolnov, z enostavnim vkrcanjem in možnostmi sence.
      features:
        - Točke za pritrditev Bimini strehe ali T-strehe, nameščene v tovarni
        - Gladek vstopni lestvi za enostavno ponovno vkrcanje
        - Tiho 4-taktno zunanje motorno pogonsko napravo za zmanjšanje motenj
        - Suhi predali za shranjevanje za gostove telefone, denarnice, kamere
