content_challenge:
  tagline: Izziv
  title: Zakaj potrebujejo potapljaški centri<br />Čolni po meri
  subtitle: Potapljaške operacije postavljajo edinstvene zahteve za plovila — zahteve, ki jih splošna plovila pogosto ne izpolnjujejo.
  paragraphs:
    - Komercialni potapljaški centri delujejo 200-300 dni na leto in izvajajo 3-5 potapljaških izletov dnevno. Vsak izlet zahteva prevoz 10-20 potapljaških jeklenk, polne BCD opreme, regulatorjev, plavuti, mask, varnostne opreme, opreme inštruktorja ter potnikov. Splošni čoln tega operativnega intenzivnega obsega preprosto ne more obvladati.
    - '**Omejen prostor na krovu** — Večina rekreativnih čolnov je zasnovana za hitrost in udobje potnikov, ne za ravnanje z opremo. Ko si rezervoarji, oprema in potapljači delijo isti prostor, se čas priprave podaljša, gibanje oteži, tveganja za varnost pa se povečajo.'
    - '**Težavno vkrcavanje potapljačev** — Mednarodni turistični obiskovalci, prvi potapljači in starejši popotniki potrebujejo varen, enostaven vstop in izstop. Visok položaj vkrcavanja, omejena opora z rokami in nestabilne platforme povzročajo neprijetnosti in nevarnosti — še posebej, ko potapljači nosijo 30 kg opreme.'
    - '**Korozija zaradi slane vode in UV poškodbe** — Tropska okolja pospešujejo propadanje materiala. Standardne PVC cevi lahko zbledijo, puščajo in zahtevajo zamenjavo v 3 letih. Korozija kovinskih komponent povečuje stroške vzdrževanja in čas izpada delovanja.'
    - '**Stabilnost v mirovanju** — Potapljači potrebujejo stabilno platformo pri opremljanju, vstopu v vodo in hoji nazaj na krov. Nezadostna stabilnost ustvarja varnostna tveganja in negativno vpliva na uporabniško izkušnjo.'
    - '**Visoki obratovalni stroški** — Učinkovitost porabe goriva je pomembna pri vsakodnevnem opravljanju več voženj. Čoln, ki porabi več goriva, neposredno zmanjšuje dobiček. Komercialni potapljaški operaterji dajejo večji pomen dnevnim obratovalnim stroškom kot največji hitrosti.'
content_solution:
  tagline: Naša rešitev
  title: Oblikovano okoli resničnega<br />Potapljaške operacije
  subtitle: Vsaka Paddle Board Overstock potapljaška RIB je zasnovana za specifične potrebe komercialnih potapljaških centrov — ne prilagojena iz oblikovane rekreativne ladje.
  list:
    - Velika delovna razporeditev krova — zasnovana za shranjevanje potapljaških jeklenk, pripravo opreme in gibanje potapljačev, ne le za sedeže potnikov
    - Profesionalni potapljaški lestevni sistem z ograjami iz nerjavnega jekla — široko, nizko stopnišče za varen in enostaven vstop in izstop potapljačev
    - Izjemno široke Hypalon ali PVC cevi — zagotavljajo stabilno platformo za vkrcanje in izboljšujejo plovnost, ko se potapljači premikajo po krovu
    - Integrirani skladiščni regali za rezervoarje — ohranjajo nizko težo, prost krov in opremo organizirano za hitrejšo obravnavo poti
    - EVA Površina krova proti drsu — zmanjšuje tveganje zdrsa, ko je krov moker in se potapljači premikajo v težki opremi
    - Konzola je nameščena za jasno vidljivost potapljačev v vodi — ključno za nadzor varnosti inštruktorjev
    - Možnosti motorja od 40 HP do 115 HP — enojna ali dvovalna konfiguracija, optimizirana za varčnost porabe goriva na več dnevnih vožnjah
    - Pomorska gradnja — težki cevni UV materiali z odpornostjo na slano vodo, ojačana konstrukcija za vsakodnevno komercialno uporabo
    - Prilagojene konfiguracije potapljaške lestve in platforme — prilagojene vaši delovni globini vode in profilu potapljača
    - Montažne plošče za sonar, GPS in komunikacijsko opremo
content_models:
  tagline: Priporočeni modeli
  title: RIB Potapljaške konfiguracije
  subtitle: Naši RIB najbolj priljubljeni modeli potapljanja — vsak je na voljo s prilagojeno konfiguracijo, specifično za potapljanje.
  items:
    - title: RIB 500 Diver
      description: '5,0 m steklena vlakna RIB z lestvijo za potapljanje, nosilci za rezervoarje, protidrsečo palubo in 60 metrov zunanjimi plovili HP . Idealno za majhne potapljaške šole in operacije z zaščitenimi vodami, ki izvajajo 1-2 vožnje na dan. Kapaciteta: 8 oseb.'
    - title: RIB 520 Diver
      description: '5,2 m RIB z izboljšano stabilnostjo, podaljšanim dosegom rezervoarja za gorivo, potapljaško lestve, skladiščem rezervoarjev in HP motorjem 90. Primeren za obalne potapljaške centre, ki izvajajo več dnevnih izletov. Kapaciteta: 10 oseb.'
    - title: RIB 550 Diver
      description: '5,5 m RIB z veliko postavitvijo palube, profesionalno potapljaško lestevjo, nosilci za rezervoarje in težkimi cevmi. Zasnovano za potapljaške operacije v letoviščih z mešanimi skupinami potnikov. Kapaciteta: 10 oseb.'
    - title: RIB 580 Diver Pro
      description: '5,8 m težka z RIB možnostjo dvomotorja, integrirano potapljaško platformo, popolno navigacijsko opremo in maksimalnim prostorom na palubi. Za profesionalne potapljaške operacije v izpostavljenih vodah, ki potekajo 3-5 voženj dnevno. Kapaciteta: 12 oseb.'
content_dive_resorts:
  tagline: Za potapljaške letovišča
  title: Premium Dive RIBs<br />Za gostinske dejavnosti letovišč
  subtitle: Luksuzno potapljanje RIBs , zasnovano za udobje gostov, podobo blagovne znamke in kapaciteto v vrhuncu sezone — kjer je izkušnja z ladjo pomembna prav toliko kot sam potop.
  paragraphs:
    - Potapljaška letovišča so temeljno drugačna od komercialnih potapljaških centrov. Vaši gostje so turisti, ki plačujejo za popolno vrhunsko izkušnjo — in čoln je ključni del te izkušnje. Funkcionalen delovni čoln, ki izgleda industrijsko ali neudoben, ustvarja opazno razliko med kakovostjo letovišča in izkušnjo na vodi.
    - '**Problem vrzeli v izkušnjah** — Gost, ki biva v petzvezdični suiti z vrhunsko kulinariko in profesionalno storitvijo, ne bi smel stopiti na starajoči se aluminijasti čoln s trdimi klopmi in brez sence. Ta kontrast škoduje zaznavi luksuza, ki si jo je vaš resort skrbno zgradil. Ladja ni le prevoz — je mobilna podaljšek vaše blagovne znamke.'
    - '**Podoba blagovne znamke kot konkurenčna prednost** — Vsak potapljaški izlet je stična točka blagovne znamke. Premium RIB z unikatnimi barvami letovišč, integriranimi logotipi in usklajenim oblazinjenjem postane plavajoči ambasador blagovne znamke. Gostje ga fotografirajo, delijo na družbenih omrežjih in si ga zapomnijo. Na konkurenčnih destinacijah, kot so Maldivi, Bali ali Karibi, je kakovost čolna lahko odločilni dejavnik za ponovne rezervacije.'
    - '**Udobje poganja zadovoljstvo in ocene** — Dolge vožnje do potapljaških lokacij v tropski vročini bi morale biti prijetne, ne izčrpavajoče. Premium sedeži z ergonomskimi naslonjali, zaščito pred senčniki T-top ali Bimini, gladko deskanje preko širokih potapljaških lestev in stabilna platforma za počitek neposredno vplivajo na ocene zadovoljstva gostov, spletne ocene in stopnje vračil. VIP gostje, starejši popotniki in družine so še posebej občutljivi na udobje.'
    - '**Kapaciteta in prihodki v času največje sezone** — V visoki sezoni (božič, spomladanske počitnice, poletje) lahko potapljaške operacije potekajo 4-6 izletov dnevno z zaporednimi skupinami gostov. Potrebujete čoln, ki zna obvladati intenzivnost, ne da bi ogrozil izkušnjo. Hitra obdelava, zanesljivo delovanje in minimalni izpadi neposredno vplivajo na prihodke in ugled. En sam izpad plovila med tednom največje konice lahko stane več deset tisoč izgubljenih rezervacij.'
    - '**Prilagoditev kot razlika** — Paddle Board Overstock Premium Dive RIBs so popolnoma prilagodljivi: barvne sheme in grafika trupa z blagovno znamko letovišča, prilagojena postavitev logotipov, vrhunska oblazinjenja v barvah letovišča, T-top ali Bimini senčila, vrhunski morski zvočni sistemi, nedrseča plošča v slogu tikovine EVA , integrirano shranjevanje potapljaškega rezervoarja in široke potapljaške lestve z ograjami. Vaš čoln postane brezhiben del izkušnje letovišča.'
    - '**Poslovni primer** — Premija RIB stane višje na začetku, a prinaša donose z večjim zadovoljstvom gostov, močnejšo percepcijo blagovne znamke, večjim ponovnim naročilom, možnostjo zaračunavanja premij, zmanjšanim vzdrževalnim izpadom in daljšo življenjsko dobo v tropskih morskih razmerah. Gre za naložbo v izkušnjo gostov, ne za obratovalne stroške.'
content_diving_profiles:
  tagline: Profili potapljaških centrov
  title: Vrste potapljaških centrov<br />Gradimo za
  subtitle: Različne potapljaške operacije zahtevajo različne konfiguracije čolnov. Vsako prilagodimo RIB specifičnim potrebam vašega potapljaškega podjetja.
  items:
    - title: Potapljaške šole in izobraževalni centri
      subtitle: Rekreativno potapljanje, certifikacijski tečaji, dnevni turistični izleti
      description: Ti centri delujejo skozi vse leto v tropskih destinacijah, vsak dan izvajajo več izletov za mednarodne turiste in študente s certifikati. Čoln je središče vsakodnevnega delovanja — mora prevažati težko opremo, pogosto vkrcavanje potnikov in dolge ure v slani vodi. Vsaka ura izpada pomeni odpovedane potope in izgubljene prihodke.
      features:
        - Velika delovna paluba za 10-20 potapljaških jeklenk, BCD-jev in potniške opreme
        - Široka potapljaška lestev z ograjami iz nerjavečega jekla za enostavno vkrcanje
        - Ekstra Hypalon široke cevi za stabilno platformo med vstopom/izstopom potapljačev
        - EVA Nedrseča površina ploščadi za varnost, ko je ploščad mokra
        - Varčne konfiguracije štiritaktnih motorjev za obratovanje 200+ dni na leto
        - Težka ali PVC Hypalon konstrukcija za vzdržljivost tropskih morskih voda
        - Skladiščni regali za rezervoarje so integrirani v postavitev palube, ne pa naknadno vgrajeni
    - title: Komercialni in industrijski potapljaški operaterji
      subtitle: Vzdrževanje pristanišč, podvodni pregled, pomorsko inženirstvo
      description: Ti profesionalni upravljavci delajo na projektih pomorske infrastrukture — pregledi pristanišč, podvodna popravila, polaganje kablov in obalno inženirstvo. Njihova ladja je mobilna delovna platforma, ne le prevoz. Posadka potrebuje prostor za orodja, opremo za pregled in potapljaške sisteme. Zanesljivost je ključna, saj so projektni urniki fiksni, zamude pa drage.
      features:
        - Izboljšana stabilnost za varne delovne pogoje na odprti vodi
        - Ojačan trup za težke obremenitve in pogoste operacije
        - Velika odprta paluba, prilagojena za shranjevanje orodij in pripravo opreme
        - Profesionalno sedenje za udobje posadke med dolgimi operacijami na morju
        - Možnosti redundance motorja za operativno varnost
        - Celoten navigacijski sistem, vključno z GPS, sonarjem in komunikacijsko opremo
        - Prilagojene konfiguracije potapljaške platforme in lestve za industrijsko uporabo
    - title: Podporne in ekspedicijske ladje za oskrbo na krovu
      subtitle: Večdnevni potapljaški safariji, odprave na oddaljene atole, raziskovalna podpora
      description: Operaterji za bivanje na krovu in ekspedicijske ekipe potrebujejo kompaktne, zanesljive RIBs , ki jih je mogoče vsak dan spuščati in pridobivati. Ti čolni služijo kot oskrbovalci za matične ladje, prevažajo potapljače do grebenov, prevažajo opremo in nudijo nujno podporo na oddaljenih lokacijah. Morajo biti dovolj robustni za prečkanje odprte vode, hkrati pa kompaktni za shranjevanje na krovu.
      features:
        - Kompaktna zasnova (4,5-5,5 m) za izstrelitev in shranjevanje na krovu z davitom
        - Ojačan trup za pogosta izkrcanja na obali in plovbo po grebenih
        - Težke dvigovalne točke za vsakodnevne operacije z žerjavom ali dvigačem
        - Potapljaška lestev z nizkim profilom za enostaven vstop in izstop iz vode
        - Vzdržljivi materiali cevi, odporni na dolgotrajno izpostavljenost soncu in soli
        - Doseg goriva za 50+ navtičnih milj med točenjem goriva
        - Možnosti hitrega napihnjevanja/izpraznjevanja cevi za prostorsko učinkovito shranjevanje
    - title: Potapljaški resort in gostinske dejavnosti
      subtitle: Potapljanje v letovišču, VIP storitve za goste, prevozi z otoka
      description: Ti upravljavci so namenjeni turistom, ki pričakujejo vrhunsko izkušnjo. Čoln mora uravnotežiti operativno učinkovitost z udobjem gostov in prepoznavnostjo blagovne znamke. Za razliko od čisto komercialnih upravljavcev resortni potapljaški centri potrebujejo čolne, ki izgledajo dobro, vozijo udobno in odražajo kakovost nepremičnine — hkrati pa zanesljivo izvajajo vsakodnevne potapljaške operacije.
      features:
        - Premium sedeži z ergonomskimi naslonjali za udobje gostov
        - T-top ali Bimini zaščita pred tropskim soncem
        - Prilagojene barvne sheme in integracija logotipov, ki se ujemajo z blagovno znamko resorta
        - Široka potapljaška lestev z ograjami za enostavno vkrcanje gostov
        - EVA Tikovina za vrhunski videz in nedrsečo varnost
        - Tiha konfiguracija motorja za minimalne motnje hrupa
        - Vgrajen hladilnik za gostujoče pijače in brisače
content_segments:
  tagline: Profili potapljaških letovišč
  title: Vrste letovišč, ki jih služimo<br />S RIB prilagojenimi rešitvami
  subtitle: Vsako potapljaško letovišče je drugačno. RIB Oblikujemo konfiguracije glede na tip vašega resorta, profil gostov in delovno okolje.
  items:
    - title: Luksuzna otočna potapljaška letovišča
      subtitle: Maldivi, Fidži, Bora Bora, Karibi
      description: Ta letovišča so namenjena popotnikom z visokim premoženjem, ki pričakujejo, da bo vsak detajl odražal razkošje. Čoln mora ustrezati nepremičnini — unikatne barve letovišča, integrirana blagovna znamka, vrhunska sedišča in popolna zaščita pred soncem so neizpodbitni. Gostje pogosto fotografirajo čoln za družbena omrežja, zaradi česar je prepoznaven blagovni adut.
      features:
        - Popolnoma prilagojena barva trupa in grafika, ujemajoča se z resort VI
        - Vrhunska oblazinjenja z usklajeno barvno paleto letovišča
        - T-top ali hardtop sončna senčila z integriranim zvočnim sistemom
        - Široka potapljaška lestev z ograjami za enostavno vkrcanje v resort opravi
        - Hladilni hladilnik za premium pijače in brisače
        - EVA Tikovina za razkošen videz in nedrsečo varnost
        - Tiha konfiguracija motorja za minimalne motnje hrupa
    - title: Butični ekološki potapljaški resorti
      subtitle: Nepremičnine ob plaži, eko-lodge, osredotočene na trajnost
      description: Manjše nepremičnine na oddaljenih obalnih območjih, ki poudarjajo okoljsko odgovornost in pristne izkušnje. Ta letovišča potrebujejo zanesljive, nizko vzdrževane čolne, ki lahko delujejo samostojno z omejeno tehnično podporo. Učinkovitost porabe goriva in vzdržljivost sta pomembnejša od največje hitrosti. Čoln mora odražati naravno okolje.
      features:
        - Varčne 4-taktne zunanje konfiguracije
        - Hypalon Težke cevi za dolgo življenjsko dobo na oddaljenih lokacijah
        - Sončno združljiv električni sistem za polnjenje izven omrežja
        - Kompaktna postavitev terase za 8-10 gostov z minimalnim okoljskim odtisom
        - Enostavna zasnova vzdrževanja — dostopne komponente za lokalno vzdrževanje
        - Nevtralne barvne možnosti, ki se zlijejo z naravnim okoljem
        - Lahka konstrukcija za pristajanje na obalo in plovbo v plitvi vodi
    - title: Premium prevozniki na krovu
      subtitle: Večdnevni potapljaški safariji, ekspedicijsko potapljanje, oddaljeni atoli
      description: 'Upravljavci živega plovila potrebujejo oskrbovalne čolne, ki opravljajo več vlog: prevoz potapljačev do grebenov, prevoz opreme, nujna podpora in izleti gostov. RIB Morajo biti dovolj kompaktni, da jih lahko shranimo na krovu ali vlečejo, hkrati pa dovolj sposobni za prečkanje odprtih voda v različnih pogojih. Dnevno spuščanje in pobiranje zahtevata robustno konstrukcijo.'
      features:
        - Kompaktna zasnova (4,5-5,5 m) za shranjevanje na krovu ali vleko za živim na krovu
        - Ojačan trup za pogosta izkrcanja na obali in plovbo po grebenih
        - Možnosti hitrega napihnjevanja/izpraznjevanja cevi za učinkovitost shranjevanja
        - Potapljaška lestev z nizkim profilom za enostavno vkrcanje iz vode
        - Težke dvigalne točke za dvigovalne sisteme z dvigači ali žerjavom
        - Doseg goriva za 50+ navtičnih milj med točenjem goriva
        - Vzdržljivi materiali cevi, odporni na sonce, sol in izpostavljenost gorivu
    - title: VIP zasebne čarterske operacije
      subtitle: Ultra-luksuzni zasebni otoki, slavni gostje, korporativni čarterji
      description: Najvišja stopnja hotelske gostoljubnosti, kjer je vsak detajl personaliziran, pričakovanja pa so skrajna. Ladja mora biti brezhibna, tiha kot šepet in z brezhibno postrežbo. Zasebnost, udobje in estetska popolnost so najpomembnejši. Ti naročniki niso občutljivi na ceno, so pa izjemno občutljivi na kakovost.
      features:
        - Ultra-premium sedeži z izdelavo po meri in ogrevanimi možnostmi
        - Motorni prostor z dušenjem zvoka za skoraj neslišno križarjenje
        - Popolna možnost ohišja za zasebnost in zaščito pred vremenskimi vplivi
        - Integriran zabavni sistem z zvočniki pomorske kakovosti
        - Prilagojen mokri bar ali postaja za osvežitev
        - Kopalnica/garderoba za zasebnost
        - Namenska postaja za posadko s komunikacijami in navigacijo
        - Ujemajoča se oprema — usklajena matična ladja in podpora RIB
content_benefits:
  tagline: Ključne prednosti
  title: Zakaj Paddle Board Overstock za<br />Potapljaške operacije
  subtitle: Posebej zasnovan potapljaški RIBs, ki mu zaupajo komercialna potapljaška središča v 30+ državah — namenjen vsakodnevni uporabi, ne občasni uporabi.
  list:
    - Zgrajen za 200-300 delovnih dni na leto — ne vikend čoln, ampak vsakodnevna delovna platforma
    - Hypalon ali vojaški razred PVC cevi — največja trpežnost v tropskih slanih vodah z UV odpornostjo
    - Široka zasnova cevi zagotavlja stabilno vkrcanje za opremljene potapljače — varnejši vstop in izstop za vse ravni izkušenj
    - Razporeditev palube optimizirana za delo z opremo — rezervoarji, oprema in potniki imajo vsak svoj prostor
    - Prilagojene konfiguracije potapljaških lest in platform — ni standardne rešitve, vsak čoln je prilagojen vašim operacijam
    - Možnosti redundance motorja (enojni/dvojniki) — varnost pri delovanju, ko so potapljači v vodi
    - Nižji dnevni obratovalni stroški — optimizirana poraba goriva in zmanjšane zahteve po vzdrževanju
    - 'Hitra dostava: 30-60 dni od naročila do pošiljke za standardne konfiguracije'
