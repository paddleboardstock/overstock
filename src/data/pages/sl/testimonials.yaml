testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Lastnik, Algarve Surf Academy
    location: Lagos, Portugalska
    content: Začeli smo s paketom Club Starter za našo šolo surfa. 20 desk, vesla, jopiči — vse je prispelo v treh tednih. Po dveh sezonah smo nadgradili na Pro paket. Prilagojena znamka z našim logotipom je bila pravi preboj za naš profesionalni vtis.
    rating: 5
    product: Paket Club Starter
    source: solutions/clubs
  - category: clubs
    name: Lastnik kluba
    title: Klub vodnih športov
    location: Phuket, Tajska
    content: Paket Club Starter je bil popolna začetna točka. Ko se je naše podjetje razvilo, je Paddle Board Overstock rasel z nami — ista kakovost, iste cene, brez presenečenj. Razširili smo od 10 do 80 desk v 18 mesecih.
    rating: 5
    product: Club Starter + Premium paket
    source: success-stories
  - category: resorts
    name: Generalni direktor letovišča
    title: Letovišče s 5 zvezdicami
    location: Grčija
    content: Paddle Board Overstock ni le dostavil deske — pomagal nam je zgraditi popolno gostinsko izkušnjo. Naš program vodnih športov je iz nič postal vrhunec letovišča v eni sezoni. 300+ tedenskih rezervacij in 180.000 $ letnega prihodka.
    rating: 5
    product: Premium paket letovišča
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Direktorica izkušenj gostov, Azure Bay Resorts
    location: Phuket, Tajska
    content: Paddle Board Overstock je zasnoval in opremil celoten program aktivnosti na plaži v treh resortih. 80 SUPs, 40 kajakov, varnostna infrastruktura in usposabljanje zaposlenih — vse dostavljeno v eni pošiljki. Sodelovanje gostov se je v prvi sezoni povečalo za 60%.
    rating: 5
    product: Premium paket letovišča
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Ustanovitelj, Shoreline Paddle Co.
    location: Kalifornija, ZDA
    content: Svoj SUP brand sem zagnal brez izkušenj v industriji. Ekipa Paddle Board Overstock me je vodila od izbire izdelka do oblikovanja logotipa po meri in pakiranja. Moj prvi kontejner je prispel v 11 tednih, vse sem prodal v 3 mesecih na Amazonu.
    rating: 5
    product: Zagon začetniškega branda
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Ustanovitelj
    title: Avstralski SUP brand
    location: Avstralija
    content: Imel sem idejo za znamko, vendar nič znanja o proizvodnji. Paddle Board Overstock mi je praktično držal roko skozi celoten proces — od izbire pravega dizajna plošče do razpakiranja prve pošiljke. 90 dni od sanj do dostave.
    rating: 5
    product: Paket za zagon branda
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: Lastnik, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Najemal sem 5 deske v lokalni trgovini in izgubljal 60% prihodkov zanje. Paddle Board Overstock mi je pomagal zgraditi svoj lasten flotil 15 SUPs. Kalkulator ROI je pokazal izenačenje stroškov v 4 mesecih — trajalo je 3. Zdaj širim na 30 desk.
    rating: 5
    product: Komplet za začetek flote
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Direktor operacij, Adriatic Adventure Tours
    location: Dubrovnik, Hrvaška
    content: Celotno floto za najem smo opremili z Paddle Board Overstock RIBs — 12 čolnov na treh lokacijah. Po dveh sezonah brez okvar. Dokumentacija za certifikat CE je omogočila enostavno odobritev zavarovanja. Njihova ekipa inženirjev je celo prilagodila barve plovil.
    rating: 5
    product: Komplet za razširitev flote
    source: trust
  - category: rental
    name: Lt. Commander Andres Reyes
    title: Upravitelj pomorske nabave, pomočnik obalne straže Filipinov
    location: Manila, Filipini
    content: Upravljamo 24 Paddle Board Overstock RIBs po celotni patruljni floti ob obali. Njihov QC proces je dosleden v vsakem paketu — enaka kakovost šiva, enaka postavitev ventilov, enaka ocena tlaka vsakič. Ta ponovljivost je pomembna, ko so življenja odvisna od opreme.
    rating: 5
    product: Flota patruljnih čolnov RIB
    source: trust
  - category: consumers
    name: Sarah K.
    title: Prva lastnica SUP
    location: Lake Tahoe, ZDA
    content: Stabilen tudi za popolnega začetnika. Prvi dan sem ga odpeljal na jezero in nikoli nisem padel. Celoten paket s črpalko in veslom je pomenil, da sem bil na vodi 20 minut po odprtju škatle.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Lastnik Explorer 11
    location: Vancouver, Kanada
    content: Kot prvi kupec sem bil nervozen glede kakovosti pri naročanju iz tujine. Dokumentacija ISO in poročila tretjih oseb, ki so mi jih posredovali, še preden sem jih sploh vprašal, so mi dala popolno zaupanje. Deska je prisla v 6 dneh in je presegla moja pričakovanja.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Rekreativni kajakaš
    location: Florida, ZDA
    content: Trdna kakovost izdelave. Obvladuje obalni val veliko bolje, kot sem pričakoval od napihljivega kajaka. Spravil sem ga v prtljažnik avtomobila za vikend izlet — napihnil ga na rampi v manj kot 4 minutah.
    rating: 5
    product: Napihljivi kajak
