hero:
  tagline: Znanje o raziskovanju vode
  title: Učiti se
  subtitle: |
    Vodniki, tutoriji in poglobljeni pregledi — vse, kar potrebujete za raziskovanje<br />
    plavati z zaupanjem. Od izbire vašega prvega SUP do obvladovanja naprednih tehnik.
  taglineSection: Znanje za vsakega veslača. Od začetnika do strokovnjaka.
featured:
  tagline: Izpostavljene teme
  title: Začnite svoje učenje
  subtitle: Ne glede na to, ali ste novi v vodnih športih ali želite nadgraditi svoje spretnosti, vas naši vodniki pokrivajo.
  items:
    - title: SUP Osnove
      description: Vse, kar začetnik mora vedeti — vrste deske, velikosti loparja, drža in nasveti za prvi dan.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Napihljiva proti trdi deski
      description: Kateri je pravi za vas? Primerjamo prenosljivost, zmogljivost, vzdržljivost in stroške drug ob drugem.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Varnost na vodi
      description: Osnovno varnostno znanje, ki ga mora imeti vsak veslač — vreme, rešilni jopiči, samopomoč in še več.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Vodnik po materialih
      description: PVC proti Hypalon, drop-stitch tehnologija, ocene zavračalcev — razumite, iz česa je vaša oprema narejena.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Vodnik po velikosti
      description: Poiščite pravilno dolžino, širino in prostornino deske glede na vašo težo, spretnost in stil veslanja.
      icon: tabler:ruler
      href: /size-guide
    - title: Srednje tehnike
      description: Izboljšajte svoje veslanje z naprednimi udarci, tehnikami obračanja in obvladovanjem divjih voda.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
