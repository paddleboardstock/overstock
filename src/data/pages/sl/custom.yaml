hero:
  tagline: Paddle Board Overstock Prilagojena delavnica
  title: Oblikujte svoj lasten<br />Vodna plovila
  subtitle: OEM, ODM, storitve zasebne oznake in prilagojene blagovne znamke za podjetja po vsem svetu. Od enega prototipa do polnih proizvodnih serij.
  cta: Začni svoj projekt
  footer_link: /contact
steps_section:
  tagline: Kako deluje
  title: Od koncepta do proizvodnje
  subtitle: Štirje koraki od vaše ideje do končnega izdelka, pripravljenega na morje.
  steps:
    - num: '01'
      title: Izberite svojo desko
      desc: Izberite med našimi osnovnimi modeli — SUP, kajak, čoln ali RIB. Izberite velikost, material in barvo.
    - num: '02'
      title: Naložite svoj dizajn
      desc: Pošljite nam svoj logotip, umetniško delo ali smernice blagovne znamke. Naša oblikovalska ekipa pripravi digitalno potrdilo.
    - num: '03'
      title: Pregled AI makete
      desc: Oglejte si fotorealistično AI-generirano maketo vaše prilagojene deske, preden se začne proizvodnja.
    - num: '04'
      title: Proizvodnja in dostava
      desc: Ko je odobreno, vaš naročilo vstopi v našo proizvodno linijo certificirano s ISO. Čas izvedbe od 30 dni.
services_section:
  tagline: Storitve
  title: Proizvodne storitve za globalne blagovne znamke
  subtitle: Fleksibilni modeli sodelovanja — od pogodbene proizvodnje do celovite izgradnje blagovne znamke.
  items:
    - title: OEM Proizvodnja
      desc: Izdelujemo vaše dizajne po specifikacijah — vaša intelektualna lastnina, vaši načrti, vaši standardi kakovosti. Polna zaščita NDA.
      icon: ⚙️
    - title: ODM Rešitve
      desc: Izberite med 50+ preverjenimi platformami in prilagodite velikost, barvo, grafiko in embalažo.
      icon: 🎨
    - title: Zasebna znamka
      desc: Vaša blagovna znamka na naših izdelkih — logotip, embalaža, obeski, priročniki. Pripravljeno za prodajo takoj po razpakiranju.
      icon: 🏷️
    - title: Prilagojena blagovna znamka
      desc: Tiskanje podloge deske, grafike trupa, nalepke za cevi in prilagojene etikete — popolna integracija blagovne znamke.
      icon: ✨
capabilities_section:
  tagline: Sposobnosti
  title: Možnosti proizvodnje in prilagoditve
  subtitle: Vse, kar morate vedeti pred oddajo naročila.
  capabilities:
    - label: Obseg naročila
      value: MOQ 5–10 enot (SUP/kajak), 2–5 enot (RIB)
    - label: Dobavni rok
      value: 30–45 dni standardno; 15–20 dni za prototipe
    - label: Prilagoditev
      value: Velikost, oblika, barva, grafika, embalaža, strojna oprema
    - label: Materiali
      value: PVC, Hypalon, drop-stitch, steklena vlakna, aluminij
    - label: Tisk
      value: Digitalni (CMYK), sitotisk, prenos s toploto, sublimacija
    - label: Certifikacija
      value: CE, ISO 9001, BSCI, UKCA (podpora za globalno skladnost)
