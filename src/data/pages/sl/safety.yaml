certifications:
  - title: CE Certificiranje (EU 2016/425)
    standard: Uredba o osebni zaščitni opremi (EU) 2016/425 | EN ISO 12402
    description: Vsa Aquafarer varnostna oprema izpolnjuje CE zahteve glede označevanja po Evropski uredbi o osebni zaščitni opremi. Vsak izdelek je neodvisno testiran TÜV s strani Rheinlanda, evropskega pooblaščenega organa. Naši napihljivi čolni izpolnjujejo RIBs zahteve Direktiv o rekreacijskih plovilih 2013/53/EU (RCD) kategorije C in D.
    body: CE Certificiranje zajema bistvene zahteve glede zdravja in varnosti za osebne plavalne naprave in napihljiva plovila.TÜV Rheinland vsako leto izvaja revizijo našega proizvodnega obrata, da preveri stalno skladnost.
  - title: SOLAS — Varnost življenja na morju
    standard: SOLAS Poglavje III | LSA koda
    description: Rešilni jopič Pro izpolnjuje SOLAS predpise za offshore in komercialne pomorske operacije. Preizkušen za 24-urno zadrževanje plovnosti, samodejno napihovanje ob potopitvi in zmogljivost v morskih stanjih do sile 5. Izpolnjuje zahteve poglavja III za rešilne jopiče na komercialnih plovilih.
    body: SOLAS Odobritev zahteva neodvisno testiranje s strani obveščenega organa za plovnost, trdnost, vidljivost in samodejno aktivacijo. Naš LifeVest Pro ima SOLAS popolno tipno odobritev z MED certifikatom.
  - title: USCG Tip III / Tip V
    standard: 46 CFR del 160 |USCG Odobritev
    description: Izbrani Aquafarer rešilni jopiči ustrezajo klasifikaciji Obalne straže Združenih držav za naprave tipa III (plavalna pomoč) in tipa V (posebna uporaba). Primerni so za zaščitene vode, obalne plovbe in komercialne operacije, ki zahtevajo USCGodobrene PFD.
    body: USCG Odobritev zahteva testiranje v neodvisnem laboratoriju, priznanem pri CG. Odobritev tipa V vključuje hibridne napihljive zasnove, ki zahtevajo ročno ali samodejno aktivacijo.
  - title: BSCI Družbena skladnost
    standard: BSCI Amfori kodeks ravnanja
    description: Naša tovarna je vsako leto revidirana v okviru Amfori Business Social Compliance Initiative (BSCI). Ta preverja etične delovne prakse, varnost na delovnem mestu, pošten delovni čas in okoljsko upravljanje v naši proizvodni enoti velikosti 12.000 m².
    body: BSCI skladnost je pogoj za evropske trgovce in uvoznike. Naša BSCI trenutna ocena je "C" (Dobro), revidirana s strani SGS.
  - title: REACH & RoHS Skladnost
    standard: Uredba EU REACH (ES) 1907/2006 |RoHS Direktiva 2011/65/EU
    description: Vse PVC spojine, lepila in premazi, uporabljeni v Aquafarer izdelkih, so skladni s REACH predpisi EU o kemični varnosti in RoHS omejitvami glede nevarnih snovi. Za vsako linijo izdelkov so na voljo varnostni listi materialov (MSDS).
    body: REACH skladnost zagotavlja, da nobene omejene snovi SVHC ne presegajo mejnih mej. Redni laboratorijski testi tretjih oseb potrjujejo stalno skladnost za vsako proizvodno serijo.
  - title: ISO 9001:2015 Upravljanje kakovosti
    standard: ISO 9001:2015 |TÜV Porenje certificirano
    description: Naš sistem za upravljanje kakovosti je certificiran ISO 9001:2015 s strani TÜV Rheinlanda in zajema načrtovanje, proizvodnjo, testiranje in poprodajne storitve. Letni nadzorni pregledi zagotavljajo stalno izboljševanje in nadzor procesov.
    body: ISO Certifikacija 9001 zahteva dokumentirane politike kakovosti, notranje revizije, preglede vodstva, postopke korektivnih ukrepov in sledljive proizvodne evidence.
testimonial:
  quote: Varnostno opremo smo pridobili od več dobaviteljev po vsej Aziji.Aquafarer Je edini proizvajalec, ki je vnaprej zagotovil CE popolno dokumentacijo, SOLAS certifikate in testna poročila tretjih oseb — brez da bi ga prosili.
  author: Erik Lindström
  title: Varnostni uradnik
  company: Baltska pomorska oskrba
  location: Finska
content_overpressure:
  tagline: Varnost nad pretlakom
  title: RIB Tlak v cevi<br />Upravljanje v vročih podnebjih
  subtitle: Tlak v napihljivih ceveh narašča s temperaturo. Razumevanje in upravljanje prekomernega tlaka preprečujeta škodo in zagotavlja varno delovanje v tropskih in puščavskih okoljih.
  items:
    - title: Boyleovi ventili za sprostitev tlaka
      description: Aquafarer RIB Cevi so opremljene z ventili za sprostitev prekomernega tlaka, ki samodejno izpustijo presežek tlaka nad nazivno najvišjo vrednostjo. Preprečujejo napetost šivov in morebitno počenje cevi zaradi sončnega segrevanja.
      icon: tabler:gauge
    - title: Sprememba tlaka od jutra do poldneva
      description: Cev, napihnjena na 3,5 °C PSI pri 20°C, lahko doseže 4,5 pri+ PSI izpostavljenosti soncu pri 40°C. V vročih podnebjih vedno napihnite na spodnjo mejo priporočenega območja in pustite, da ventil za sprostitev obvladuje presežek tlaka.
      icon: tabler:sun
    - title: Priporočeni obratovalni tlaki
      description: 'PVC Cevi: 3,0-3,5 delovne PSI , 4,5 PSI maksimalno. Hypalon Cevi: 3,5-4,0 delovne PSI , PSI 5,0 maksimalno. Vedno merite na 1,25x (4,4 PSI za PVC, 5,0 PSI zaHypalon) po Aquafarer standardih QC.'
      icon: tabler:chart-bar
    - title: Najboljše prakse za izpostavljenost soncu
      description: Shranjujte RIBs jih na senčnih mestih, kadar jih ne uporabljate. Za UVdaljše privezovanje uporabljajte zaščitne pokrove. Preverite in prilagodite tlak v cevi pred in po največjih sončnih urah. Nikoli ne presegajte največjega nazivnega tlaka.
      icon: tabler:umbrella
    - title: Nujna dekompresija
      description: Če se cev zdi pretrda ali se ventil za sprostitev prezračuje, spustite zrak skozi Halkey-Roberts ali vojaški ventil, dokler se tlak ne vrne v delovno območje. Za natančne meritve imejte s seboj merilnik tlaka.
      icon: tabler:alert-circle
