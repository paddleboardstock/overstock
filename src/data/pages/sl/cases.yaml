features3_cases:
  tagline: Izpostavljeni primeri
  title: Prilagojene rešitve<br />Za resnične izzive
  isBeforeContent: false
  columns: 3
  items:
    - title: Dnevna nadgradnja delovanja Bali Diving Center
      customer: Potapljaški center Blue Ocean
      country: Indonezija
      industry: Komercialni potapljaški center
      challenge: Potapljaški center Blue Ocean na Baliju je upravljal starejšo potapljaško ladjo iz steklenih vlaken z omejenim prostorom na palubi, težavnim vkrcavanjem potapljačev in zahtevnim vzdrževanjem v tropskih morskih razmerah. Nalaganje opreme je bilo prenatrpano, čas priprave dolg, nestabilna platforma pa je povzročala varnostne skrbi za mednarodne turiste — vključno z začetniki in starejšimi popotniki. Center vsak dan organizira 3-5 potapljaških izletov, 200+ dni na leto.
      solution: Aquafarer zagotovil je prilagojeno 6,8-metrsko profesionalno potapljaško RIB napravo z razširjeno postavitvijo palube, optimizirano za shranjevanje potapljaške opreme, široko lestev iz nerjavečega jekla, Hypalon cevi za UV odpornost na slano vodo, nedrsečo površino palube in rešitev za shranjevanje rezervoarjev. Konfiguracija je bila zasnovana glede na vsakodnevni delovni tok potapljaškega centra — ni temeljila na standardni postavitvi rekreativnega čolna.
      product: 6,8 m Profesionalni skoki RIBv vodo
      results: Večje delovno območje je izboljšalo učinkovitost priprave opreme. Potapljači so izkusili varnejše in lažje vkrcavanje. Zahteve po vzdrževanju so se bistveno zmanjšale. Center je pridobil zmogljivosti za obravnavo več strank v času največje sezone z večjim zaupanjem. RIB To je postalo temelj vsakodnevnih potapljaških operacij.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Naša potapljaška ladja ni le prevoz. Je temelj našega vsakodnevnega delovanja.Aquafarer RIB Daje naši ekipi več samozavesti, ko vsak dan organiziramo več potapljaških izletov.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center RIB Profesionalna nadgradnja
      customer: Potapljaški center Ocean Explorer
      country: Tajska
      industry: Komercialni potapljaški center
      challenge: Potapljaški center Ocean Explorer v Phuketu na Tajskem je moral nadgraditi tradicionalni potapljaški čoln iz steklenih vlaken, ki ni mogel zadovoljiti naraščajočega povpraševanja strank. Omejen prostor na palubi je oteževal pripravo opreme. Težavno vkrcanje je povzročalo varnostne izzive za mednarodne turiste. Visoke zahteve po vzdrževanju v tropskih morskih razmerah so povečale obratovalne stroške. Center izvaja več dnevnih plovb, 200+ dni na leto.
      solution: Aquafarer dostavila prilagojeno 6,8-metrsko komercialno potapljaško RIB napravo z optimizirano delovno postavitvijo palube za shranjevanje potapljaških jeklenk, pripravo opreme in premikanje potapljačev. Značilnosti so vključevale široko potapljaško lestev z nerjavečimi jeklenimi ograjami, robustno cevno konstrukcijo z UVodpornimi materiali, protidrseča tla, rešitev za shranjevanje rezervoarjev, profesionalno konzolo in sedeže za potnike — vse konfigurirano za komercialne potapljaške operacije.
      product: 6,8 m Komercialno skakanje RIBv vodo
      results: Večja površina palube je omogočila hitrejšo organizacijo opreme in učinkovitejši vsakodnevni delovni proces. Udobje in varnost pri vkrcanju strank sta se znatno izboljšali. Vzdrževalni izpadi so se zmanjšali zaradi pomorske gradnje. Potapljaški center je lahko v največji sezoni oskrboval več strank in samozavestno razširil profesionalne potapljaške storitve.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Za potapljaški center čoln ni le prevoz. Je pomemben del našega vsakodnevnega delovanja.Aquafarer RIB Naši ekipi daje zaupanje, da lahko vsak dan izvedemo več potapljaških izletov z večjo varnostjo in učinkovitostjo.
      icon: tabler:lifebuoy
    - title: Flota evropskih potapljaških centrov
      customer: BlueMed potapljaški centri
      country: Grčija
      industry: Potapljanje in morski turizem
      challenge: Zahtevalo je 12 potapljaških centrov, konfiguriranih RIBs za verigo potapljaških centrov na več grških otokih. Vsaka ladja je potrebovala prilagojeno potapljaško lestev, skladišče za 8 rezervoarjev in stabilno platformo za vstop potapljačev na odprti vodi. Flota je morala prispeti v 60 dneh za začetek turistične sezone.
      solution: Izdelali so RIB 12.520 potapljaških modelov z integriranimi nosilci za rezervoarje, potapljaškimi lestvami in ekstra Hypalon širokimi cevmi za stabilnost pri vkrcanju. Vsaka ladja je bila označena z barvno shemo kupčeve flote. Vseh 12 plovil je bilo preizkušenih s tlakom in odpeljanih iz Qingdaa v 55 dneh.
      product: RIB 520 Dive
      results: Vseh 12 čolnov je bilo dostavljenih pravočasno za turistično sezono. Flota je v vsakodnevnem obratovanju že 18+ mesecev brez nobenih okvar materiala. Stranka je v drugem letu naročila še 6 dodatnih enot.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: RIB 520 Dive je hrbtenica naših vsakodnevnih potapljaških operacij. Stabilnost v mirovanju je odlična, razporeditev rezervoarjev pa ohranja krov čist in varen za naše goste.
      icon: tabler:lifebuoy
    - title: OEM Avstralski program distributerjev
      customer: Pacific Watersports Pty Ltd
      country: Avstralija
      industry: OEM/ODM Proizvodnja
      challenge: Avstralski distributer je potreboval SUP zasebno znamko kartona po konkurenčnih cenah, da bi konkuriral kitajskim blagovnim znamkam, ki prodajajo neposredno potrošnikom. Zahtevalo je 8 edinstvenih modelov, ki so pokrivali od začetnikov do naprednih, z lastno grafiko, po meri narejeno embalažo in dropshippingom v prodajalne.
      solution: Razvili smo 8 SUP modelov (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) z ekskluzivnim avstralskim grafičnim paketom. Posebna maloprodajna embalaža z QR kodami, ki povezujejo z video posnetki nastavitve. Logistika dropshippinga, konfigurirana iz Qingdao neposredno v avstralske trgovine.
      product: SUP Custom Line (8 modelov)
      results: Koncept do prve pošiljke v 90 dneh. Maloprodajna stopnja 85 % v prvi sezoni. Distributer je razširil partnerstvo z vključitvijo linije napihljivih čolnov v drugem letu.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Aquafarer Celotno linijo smo dostavili SUP v 90 dneh — od začetnega oblikovanja do prodajne prodaje. Kakovost se ujema z blagovnimi znamkami, ki se prodajajo po dvakrat višji ceni.
      icon: tabler:arrows-exchange
    - title: Bližnjevzhodna oskrba z reševalnimi čolni
      customer: Nacionalna uprava za civilno zaščito
      country: Združeni arabski emirati
      industry: Iskanje in reševanje
      challenge: Organizacija civilne zaščite je potrebovala 20 patrulj, pripravljenih RIBs za obalno iskanje in reševanje, varnost pristanišč in odziv na poplave. Zahtevala je samoizločne palube, popolne navigacijske sisteme (GPS, radar, VHF), visoko vidne oranžne cevi in skladnost z lokalnimi pomorskimi predpisi.
      solution: Dobavljenih je bilo 20 RIB modelov 450 Patrol z samoizločljivimi palubami, Garmin navigacijskimi sistemi, LED reflektorji, SOLAS odsevnim trakom in Hypalon visoko vidnimi oranžnimi cevmi. Vsak čoln je bil CEcertificiran in testiran po ISO standardih 6185. Dokumentacijski paket je vključeval potrdila o skladnosti za lokalno registracijo.
      product: RIB 450. patrulja
      results: Flota je razporejena na 5 obalnih postaj. Plovila so delovala v ekstremni vročini (45°C+) brez poslabšanja cevi. Doseg patruljiranja in učinkovitost porabe goriva sta presegli specifikacije za 12 %.
      image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp
      quote: RIB 450. patrulja je presegla naše operativne zahteve. V ekstremnih vročinskih razmerah Hypalon cevi po UV 24 mesecih vsakodnevne uporabe ne kažejo znakov propadanja.
      icon: tabler:alert-triangle
    - title: OEM Evropsko partnerstvo blagovnih znamk
      customer: North Sea Marine Equipment BV
      country: Nizozemska
      industry: OEM/ODM Proizvodnja
      challenge: Uveljavljena evropska pomorska znamka je želela razširiti poslovanje RIB na trg brez vlaganja v proizvodne zmogljivosti. Potrebovali so partnerja z belo blagovno znamko, ki bi lahko proizvedel 5 RIB modelov (3,9 milijona do 6,2 milijona) z zasebno blagovno znamko, CE certificiranjem in ekskluzivnimi pravicami do distribucije v EU.
      solution: Vzpostavljen je bil dogovor o proizvodnji z belo etiketo za 5 RIB modelov. Vsak model je bil označen z logotipi strank in barvno shemo.CE Za vsak model je bila pripravljena certifikacijska dokumentacija. Ekskluzivne pravice do distribucije v EU so bile podeljene z minimalnimi naročilnimi obveznostmi. Tehnična dokumentacija in katalog rezervnih delov sta bila zagotovljena za lokalno servisno mrežo.
      product: RIB Custom Line (5 modelov)
      results: Podpisana večletna pogodba. Prva proizvodna serija 50 enot je bila odposlana v 75 dneh. Blagovna znamka je bila predstavljena na METSTRADE z pozitivnim sprejemom prodajalcev.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Sodelovanje nam Aquafarer je omogočilo, da smo vstopili RIB na trg brez gradnje tovarne — zagotovili so popolno celovito rešitev s CE certifikati in dokumentacijo za podporo prodajalcem.
      icon: tabler:building
    - title: Flota karibskih letovišč
      customer: Paradise Island Resorts Ltd
      country: Bahami
      industry: Morski turizem in gostinstvo
      challenge: 'Luksuzno letovišče je potrebovalo celoten vozni park opreme za vodne športe za goste: 40 SUP desk za vodene oglede, 20 kajakov za raziskovanje lagune, 10 napihljivih čolnov za prevoze gostov in ribolovne izlete ter dodatke. Vsa oprema je potrebovala posebno blagovno znamko letovišča in je morala biti dostavljena pred vrhuncem turistične sezone.'
      solution: 'Izdelali smo celoten paket vodnih športov: 40 SUP desk Voyager (model All-Around), 20 Explorer kajakov, 10 AirDeck napihljivih čolnov 360, poleg PFD-jev, vesla, črpalk in kompletov za popravila. Vsa oprema je natisnjena z logotipom letovišča in tropsko barvno shemo. Kontejnerska pošiljka s celotnim inventarjem.'
      product: Celoten paket vodnih športov (70+ enot)
      results: Flota je prispela 6 tednov pred vrhuncem sezone. Ocene zadovoljstva gostov z vodnimi športi so se v primerjavi z letom prej povečale za 40 %. Oprema je zdržala 3 sezone z le rutinskim vzdrževanjem.
      image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
      quote: Pristop popolnega paketa je pomenil, da smo prejeli vse, kar smo potrebovali, v eni pošiljki — deske, kajaka, čolne in dodatke, vse z blagovno znamko in pripravljeno za uporabo gostov. Naši gostje obožujejo kakovost opreme.
      icon: tabler:beach
    - title: Nadgradnja komercialnega potapljaškega centra v Queenslandu RIB
      customer: Komercialni potapljaški center
      country: Avstralija
      industry: Komercialno potapljanje in pomorske storitve
      challenge: Komercialni potapljaški center s sedežem v Queenslandu, specializiran za inšpekcijo pomorske infrastrukture, vzdrževanje pristanišč in podvodna popravila, je upravljal starajočo se delovno ladjo. Z naraščajočim povpraševanjem po projektu je staro plovilo postalo breme — pogosto vzdrževanje je povzročalo motnje v urnikih, postavitev ni bila zasnovana za sodobne potapljaške operacije (omejen prostor za jeklenke, orodje in opremo), udobje posadke med dolgimi operacijami pa je bilo slabo. Podjetje je potrebovalo plovilo, ki bi lahko podpiralo njihove profesionalne operacije vsak delovni dan.
      solution: Aquafarer Izvedli so podrobno operativno analizo potapljaškega delovnega procesa strank, tipičnega trajanja projekta, velikosti posadke in zahtev po opremi. Na podlagi te analize Aquafarer so zagotovili prilagojenega strokovnjaka RIB s funkcionalno postavitvijo palube, optimizirano za pripravo opreme in premikanje potapljačev, profesionalnimi sedeži za daljša obdobja prevoza, izboljšano stabilnostjo za varnejši vstop in izstop potapljačev ter funkcijami podpore pri potapljanju, integriranimi v zasnovo.
      product: Profesionalno potapljanje RIBpo meri
      results: Novi RIB je postal zanesljiva vsakodnevna platforma za delo. Priprava opreme je bila hitrejša z optimizirano postavitvijo. Posadka je poročala o izboljšanem udobju in varnosti med dolgimi operacijami. Profesionalen videz čolna je okrepil zaupanje strank pri sodelovanju z upravljavci pristanišč in pomorskimi izvajalci. Potapljaški center je pridobil plovilo, ki je ustrezalo profesionalnosti njihove storitve.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Potrebovali smo čoln, ki bi podpiral naše poslovanje vsak dan, ne le plovilo za prevoz. Aquafarer je sodeloval z nami, da bi razumel naše operativne zahteve, in zagotovil RIB rešitev, ki ustreza našemu delovnemu toku komercialnega potapljanja.
      icon: tabler:lifebuoy
    - title: Pogodba o obalnem patruljiranju ZDA
      customer: Agencija za obalno varnost Atlantika
      country: Združene države
      industry: Pomorska varnost in izvrševanje zakonov
      challenge: Ameriška obalna varnostna agencija je potrebovala težko plovilo za patruljiranje RIBs za operacije prestrezanja na odprtih vodah. Potrebovala je konfiguracijo z dvema motorjema za redundanco, oklepno konzolo za zaščito posadke, vojaške specifikacije elektronike (šifrirana komunikacija, FLIR, radar) ter skladnost s predpisi ameriške obalne straže.
      solution: Konstruiran RIB 600 Patrol z dvojno konfiguracijo zunanjih motorjev 115 HP, oklepanim krmilnim pultom z balistično zaščito, FLIR toplotno sliko, šifrirano VHF/UHF komunikacijo in integriranimi točkami za montažo orožja. Trup ojačan za manevre v visokih hitrostih. Vsa elektronika integrirana in preizkušena v tovarni. Priložena dokumentacija o skladnosti USCG.
      product: RIB 600 Patrulja (Dvojni motor)
      results: Čolni so dosegli najvišjo hitrost 52 vozlov med sprejemnimi preizkusi. Agencija je poročala o 95-odstotni stopnji pripravljenosti za misije v prvih 12 mesecih. Oddano je bilo dodatno naročilo za 8 enot.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Dvokrak RIB 600 našim posadkam zagotavlja hitrost in redundantnost, potrebno za operacije prestrezanja na odprtem morju. Oklepna konzola nudi ključno zaščito, ne da bi ogrozila zmogljivost.
      icon: tabler:shield
