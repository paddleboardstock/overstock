hero:
  tagline: Program zastopstva
  title: Postanite Aquafarer<br />Distributer
  subtitle: Sodelujte z CE-certificiranim proizvajalcem RIB in napihljivih vodnih plovil, ki deluje v 50+ državah. Zaščita ozemlja, marketinška podpora in konkurenčne cene za uveljavljene morske distributerje.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer program prodajalcev in distributerjev
direct_answer: Aquafarer ponuja partnerske odnose za prodajalce in distributerje z zaščito ozemlja, konkurenčnimi veleprodajnimi cenami, marketinškimi podporni kompleti in popolno dokumentacijo skladnosti (CE, ISO 9001, BSCI). MOQ se začne pri 10-20 enotah na naročilo z namenskim upravljanjem računa.
