content_benefits:
  tagline: Koristi partnerstva
  title: Zakaj distributerji<br />Izberite Aquafarer
  subtitle: Partnerstvo, zasnovano za distribucijske podjetja v pomorstvu, ki potrebujejo zanesljivo oskrbo, konkurenčne marže in profesionalno podporo.
  items:
    - title: Zaščita ozemlja
      description: Ekskluzivne ali pol-ekskluzivne teritorijalne pravice za kvalificirane distributerje. Kartiranje trga in upravljanje konfliktov kanalov za zaščito vaše naložbe v izgradnjo blagovne znamke Aquafarer v vaši regiji.
      icon: tabler:map-pin
    - title: Konkurencne veleprodajne cene
      description: Donična določitev cen na podlagi letnih količinskih obveznosti. Cenovna struktura za zaščito marže z vnaprejšnjimi cenovnimi zagotovili in preglednimi razčlenitvami stroškov (FOB osnovna cena Qingdao).
      icon: tabler:currency-dollar
    - title: Komplet za marketinško podporo
      description: Profesionalna produktna fotografija, tehnični listi, predloge dokumentacije o skladnosti, vsebine za družbena omrežja in souporabljeni marketinški materiali. Posodablja se vsako leto z novimi lansiranji izdelkov.
      icon: tabler:photo
    - title: Tehnično usposabljanje
      description: Usposabljanje za vaš prodajni tim (virtualno ali na lokaciji), usposabljanje za vzdrževanje in popravilo za vaše servisne tehnike ter pogosta vprašanja in vodiči za odpravljanje težav za stranke.
      icon: tabler:school
    - title: Rezervni deli in poprodajne storitve
      description: Namenska dobava rezervnih delov s prioritetno dostavo. Na voljo so zamenljivi deli cevi, ventili, rebra in kompleti za popravilo za hitro izpolnitev naročil. Podpora pri obdelavi zahtevkov za garancijo.
      icon: tabler:tool
    - title: Dokumentacija o skladnosti
      description: 'Celoten paket dokumentacije za skladnost za vaš trg: CE DoC, podatki s ploščice proizvajalca, uporabniški priročniki in podporo pri registraciji za regulativo. Odpravlja vašo težo skladnosti.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Kaj iščemo
  title: Distributer<br />Zahteve
  subtitle: Iščemo partnerje, ki lahko profesionalno zastopajo Aquafarer in podpirajo izdelke na svojem območju.
  items:
    - title: Znanje o ozemlju in trgu
      description: Uveljavljena prisotnost na trgu morja, vodnih športov ali rekreacije na prostem. Razumevanje lokalnih predpisov, potrošniških preferenc in distribucijskih kanalov za izdelke za plovila.
      icon: tabler:target
    - title: Izkušnje v industriji
      description: Najmanj 2 leti izkušenj z distribucijo pomorske, zunanje ali športne opreme. Dokazana uspešnost pri mednarodnih blagovnih znamkah in B2B veleprodaji.
      icon: tabler:briefcase
    - title: Razstavni salon ali skladišče
      description: Fizični objekti za razstavljanje izdelkov, skladiščenje zalog in podporo strankam. Možnost vzdrževanja demo enot in zalog rezervnih delov za vaše območje.
      icon: tabler:building-store
    - title: Zavezanost standardom blagovne znamke
      description: Pripravljenost ohranjati Aquafarer standarde predstavitve blagovne znamke, nuditi podporo strankam v skladu z našimi servisnimi protokoli in sodelovati pri letnih posodobitvah o izobraženju izdelkov.
      icon: tabler:star
content_process:
  tagline: Postopek prijave
  title: 4-stopenjski prodajalec<br />Postopek prijave
  subtitle: Od začetnega povpraševanja do prve pošiljke — preprost postopek uvajanja.
  steps:
    - number: '01'
      title: Začetna poizvedba in kvalifikacija
      description: Pošljite svojo vlogo distributerja s podatki o podjetju, območjem zanimanja, trenutnimi produktnimi linijami in letnimi ocenami obsega. Pregledamo v 5 delovnih dneh.
      timeline: 5 dni
    - number: '02'
      title: Poslovni pregled in pogoji
      description: Virtualni sestanek za razpravo o strategiji teritorija, cenovnih stopnjah in pogojih partnerstva. Pregled zahtev za dokumentacijo skladnosti za vaš trg.NDA Podpis, če je potrebno.
      timeline: 1-2 tedna
    - number: '03'
      title: Vzorčni vrstni red in ocena
      description: Oddajte začetno vzorčno naročilo (2-5 enot) pri distributerju za oceno trga in usposabljanje ekipe. Vključena je popolna dokumentacija o skladnosti in priprava na demonstracijo.
      timeline: 30-45 dni
    - number: '04'
      title: Začetek in podpora partnerstvu
      description: Prvo naročilo kontejnerja z aktivirano zaščito ozemlja. Marketinški komplet dostavljen, prodajna ekipa usposobljena in dodeljen namenski vodja računa. Stalni četrtletni poslovni pregledi.
      timeline: V teku
content_application_docs:
  tagline: Prijavni dokumenti
  title: Potrebni dokumenti<br />za uporabo pri prodajalcu
  subtitle: Za prijavo na Aquafarer prodajalca prosimo, da pripravite naslednje dokumente in informacije za našo ocenjevalno ekipo.
  items:
    - title: Potrdilo o registraciji podjetja
      description: Veljaven dokument o registraciji podjetja, ki prikazuje ime pravne osebe, registrirani naslov in obseg poslovanja, ki zajema distribucijo pomorske, športne ali zunanje opreme.
      icon: tabler:file-text
    - title: Načrt pokritosti ozemlja
      description: Geografsko območje zanimanja, obstoječa maloprodajna ali distribucijska mreža, ciljni segmenti strank in predlagani letni obseg po kategorijah izdelkov (RIB, SUP, kayak).
      icon: tabler:map
    - title: Zmogljivost razstavnega prostora ali skladišča
      description: Fizični objekti za razstavljanje izdelkov, skladiščenje zalog in podporo strankam. Fotografije ali tlorisi prikazujejo prostor za demonstracijo in kapaciteto skladiščenja rezervnih delov.
      icon: tabler:building
    - title: Izjava o finančnih zmožnostih
      description: 'Bančna referenca ali finančni izkaz, ki potrjuje sposobnost oddaje začetnega naročila kontejnerja in vzdrževanja zalog. Minimalno začetno naročilo: en 20 čevljev dolg kontejner (10-20 enot mešanih modelov).'
      icon: tabler:coin
    - title: Kapaciteta poprodajne podpore
      description: Servisni tehniki, usposobljeni ali usposobljeni za vzdrževanje in popravilo napihljivih čolnov. Možnost obdelave garancijskih zahtevkov in zaloga rezervnih delov.
      icon: tabler:tool
    - title: Prejšnje reference blagovnih znamk
      description: Seznam trenutnih ali preteklih blagovnih znamk pomorske/športne opreme, ki so razdeljene. Kontaktne reference so na voljo ob medsebojnem dogovoru. Zagonska podjetja brez predhodnih izkušenj z distribucijo lahko izpolnjujejo pogoje z močnejšo finančno zavezo.
      icon: tabler:users
faq:
  title: Program prodajalcev — Pogosto zastavljena vprašanja
  questions:
    - q: Kakšna je minimalna količina naročila za distributerje?
      a: Distributer MOQ začne pri 10-20 enotah na naročilo, z večjo prilagodljivostjo za mešane modele (RIB, napihljivi, SUP). Začetna vzorčna naročila 2-5 enot so na voljo po cenah distributerja za tržno oceno.
    - q: Ali ponujate ekskluzivne pravice do ozemlja?
      a: Ekskluzivne teritorialne pravice so na voljo kvalificiranim distributerjem, ki izpolnjujejo letne količinske obveznosti in vzdržujejo standarde blagovne znamke. Na voljo so tudi polekskluzivne in neekskluzivne pogodbe za nastajajoče trge.
    - q: Kakšno marketinško podporo nudite?
      a: Nudimo celovit marketinški komplet, ki vključuje profesionalno fotografijo izdelkov, specifikacijske liste, predloge za dokumentacijo skladnosti, knjižnico vsebin na družbenih omrežjih in materiale s skupno blagovno znamko. Vsako leto se posodablja z novimi lansiranji izdelkov.
    - q: Kako se obravnavajo garancijski zahtevki?
      a: 'Distributerji so prva kontaktna točka za garancijske zahtevke. Zagotavljamo jasna jamstvena merila, protokole fotografske dokumentacije ter hitro zamenjavo ali obdelavo kreditov. Garancijski pogoji: 5-letna omejitev za tkanino/šive/trup ladijskih cevi; 2 leti in SUP dodatke.'
    - q: Ali lahko izdelke pod lastno blagovno znamko prodajam pod Aquafarer svojo blagovno znamko?
      a: Da, preko OEMODM našega / programa. Možnosti zasebne blagovne znamke vključujejo unikatne tube grafike, blagovno znamko konzol, maloprodajno embalažo in dokumentacijo skladnosti pod vašim imenom blagovne znamke. Za podrobnosti si oglejte OEMODM našo stran / storitve.
    - q: Kakšna dokumentacija o skladnosti je priložena distributerjem?
      a: Vsaka pošiljka vključuje CE modelno specifične DoC, podatke o tablicah proizvajalca, priročnike za lastnike in transportno dokumentacijo. Prav tako nudimo podporo pri regulativni registraciji za vaše ozemlje in pomagamo pri lokalnih zahtevah skladnosti.
