hero:
  tagline: Blagovna znamka
  title: Aquafarer — Inženiring svobode na vodi
  definition: Aquafarer je globalna blagovna znamka za morske rekreacije in napihljive plovil, specializirana za napihljive čolne, SUP sisteme ter prilagojene rešitve za morje. Aquafarer združuje pomorsko inženirstvo, proizvodno strokovnost in kulturo raziskovanja vode, da ustvarja zanesljivo opremo za rekreativne uporabnike, profesionalne operaterje in globalne OEM partnerje.
timeline:
  - year: '2012'
    title: Temelj morske proizvodnje
    body: Aquafarer se je začel kot specializirana delavnica za napihljiva plovila v Qingdau, Kitajska, predan pomorski obrtni proizvodnji in izdelavi napihljivih čolnov. Prvotni poudarek je bil gradnja zanesljivih napihljivih izdelkov skozi praktične izkušnje in disciplinirano proizvodnjo.
  - year: '2015'
    title: Prvi izvoz in CE certificiranje
    body: Začetna izvozna naročila so dosegla Japonsko in Korejo. CE certifikat je bil dosežen za osnovne produktne linije, kar je označevalo vstop Aquafarer na mednarodne trge. Podjetje je začelo služiti komercialnim in rekreativnim uporabnikom zunaj Kitajske.
  - year: '2018'
    title: Širitev tovarne
    body: Preselitev v proizvodni obrat površine 12.000 m². Dodane linije za RF varjenje in proizvodna zmogljivost drop-stitch, kar omogoča večjo proizvodnjo in izboljšane sisteme nadzora kakovosti.
  - year: '2020'
    title: Vzpostavitev R&R centra
    body: Odprt posvečen R&R center z PVC laboratorijem za tkanine, hidrodinamičnim testnim bazenom in CAD/FEA simulacijskim studiem. Razvoj izdelkov se je razširil z osredotočenjem na lahkotno konstrukcijo, boljšo vzdržljivost in uporabniku prijazno zasnovo.
  - year: '2022'
    title: ISO Certifikat ISO 9001 in globalna rast
    body: Dosežen ISO certifikat 9001. Število R&R inženirjev se je povečalo na 14 in 200+ delavcev. Izdelki so dosegli stranke po Evropi, Ameriki in Azijsko-pacifiški regiji preko distributerjev in OEM partnerstev.
  - year: '2024'
    title: Studio za inovacije in dizajn
    body: Vzpostavljen celoviti studio za dizajn in inovacije za prilagojene ODM projekte, od koncepta do proizvodnje. Krepljenje profesionalnih pomorskih aplikacij, vključno z reševanjem, komercialnimi in vladnimi razpisi.
  - year: '2026'
    title: Gradnja prihodnosti raziskovanja vode
    body: Danes Aquafarer nadaljuje z razvojem napihljivih čolnov, SUP sistemov in prilagojenih morskih rešitev — povezovanje ljudi in organizacij z vodami sveta. 50+ držav oskrbovanih, letna zmogljivost 15.000 enot.
philosophy:
  tagline: Filozofija blagovne znamke
  title: Inženirska svoboda na vodi
  body: Svoboda na vodi ni le gibanje. Pomeni odkrivanje novih krajev, ustvarjanje zunanjih izkušenj, povezovanje ljudi z naravo in omogočanje profesionalnih misij. Inženirstvo to svobodo omogoča.
  pillars:
    - title: Zanesljivost na prvem mestu
      body: Vodna okolja zahtevajo zaupanje.Aquafarer Izdelki so zasnovani za stabilnost, vzdržljivost, varnost in dosledno delovanje.
    - title: Oblikovanje, osredotočeno na človeka
      body: Izdelki naj služijo ljudem, ne tehnologiji. Vsaka oblikovalska odločitev se začne z razumevanjem, kako ljudje uporabljajo plovila, kje raziskujejo in s kakšnimi izzivi se soočajo.
    - title: Dostopno raziskovanje
      body: Voda ne bi smela pripadati le strokovnjakom.Aquafarer ustvarja opremo, ki omogoča več ljudem varno izkušnjo rek, jezer, oceanov in obalnih okolij.
    - title: Neprekinjene inovacije
      body: Inovacija ni le ustvarjanje novih izdelkov. Izboljšuje vsak detajl — materiale, strukture, proizvodnjo in uporabniško izkušnjo.
engineeringDna:
  tagline: Inženirska DNK
  title: Kako Aquafarer ustvarja izdelke
  areas:
    - title: Materialna znanost
      body: Aquafarer se osredotoča na izbiro primernih materialov za različna morska okolja. Ključni dejavniki vključujejo odpornost proti abraziji, UV odpornost, stabilnost pod pritiskom in dolgotrajno vzdržljivost.
      items:
        - Odpornost proti abraziji
        - UV Odpornost
        - Stabilnost pod pritiskom
        - Dolgotrajna vzdržljivost
    - title: Strukturno inženirstvo
      body: Napihljiva plovila zahtevajo natančno ravnovesje med togostjo, težo, prenosljivostjo in stabilnostjo. Aquafarer inženirstvo se osredotoča na optimizacijo teh dejavnikov z uporabo drop-stitch osnovne tehnologije in napredne konstrukcije šivov.
      items:
        - Togost
        - Optimizacija teže
        - Prenosljivost
        - Stabilnost
    - title: Natančnost izdelave
      body: 'Vsak izdelek gre skozi nadzorovane procese: priprava materiala, natančno rezanje, varjenje in lepljenje, sestavljanje, pregled kakovosti in preverjanje zmogljivosti.'
      items:
        - Priprava materiala
        - Natančno rezanje
        - Varjenje in lepljenje
        - Sestava in kontrola kakovosti
    - title: Inženirstvo uporabniških scenarijev
      body: Izdelki so razviti okoli resničnih uporab — rekreacija, avantura in profesionalna uporaba — kar zagotavlja, da vsak dizajn ustreza specifičnim zahtevam svojega namerovanega okolja.
      items:
        - Rekreacija
        - Avantura
        - Professional
        - Komercialno
