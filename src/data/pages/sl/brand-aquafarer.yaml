trustSignals:
  tagline: Signali zaupanja
  title: Zakaj je Aquafarer zanesljiv partner
  manufacturing:
    title: Proizvodna zmogljivost
    body: Proizvodni obrat površine 12.000 m² z 200-300 usposobljenimi delavci in 14+ raziskovalno-razvojnimi inženirji. ISO 9001 certificiran sistem vodenja kakovosti. Letna proizvodnja 15.000 enot napihljivih plovil za 50+ držav.
    stats:
      - label: Velikost obrata
        value: 12,000 m²
      - label: Delovna sila
        value: 200-300
      - label: R&R inženirji
        value: 14+
      - label: Letna zmogljivost
        value: 15,000
  quality:
    title: Zavezanost kakovosti
    body: Od pregleda materiala do končnega testiranja, Aquafarer vzdržuje sistematične procese kakovosti za zagotavljanje zanesljivih morskih izdelkov. Vsaka enota je pred pošiljanjem podvržena preizkusu tlaka, pregledu šivov in preverjanju delovanja.
    items:
      - CE Certificirano — 64 modelov ustreza evropskim varnostnim standardom
      - ISO 9001:2015 — Certificiran sistem vodenja kakovosti
      - UKCA Oznaka CE — skladnost z britanskim trgom
  global:
    title: Globalna prisotnost
    body: Aquafarer služi strankam na večih globalnih trgih, podpira distributerje, zunanje blagovne znamke in profesionalne morske uporabnike v 50+ državah po Evropi, Azijsko-pacifiški regiji, Ameriki, Bližnjem vzhodu in Afriki.
comparison:
  tagline: Pozicioniranje blagovne znamke
  title: Aquafarer na trgu
  position: Pomorski proizvajalec s poudarkom na inženiringu, ki združuje strokovno znanje o napihljivih plovilih s polno OEM/ODM zmogljivostjo, prilagojenim razvojem in 12+ let izkušenj z izvozno proizvodnjo.
  strengths:
    - Strokovno znanje o inženirstvu napihljivih plovil
    - Polna proizvodna zmogljivost OEM/ODM
    - Razvoj in oblikovanje po meri izdelka
    - 12.000 m² proizvodni obrat z certifikatom ISO
  bestFor:
    - Uporabniki zunanjih rekreacij, ki iščejo zanesljive napihljive plovil
    - Morski operaterji, ki potrebujejo opremo za komercialno uporabo
    - Partnerji blagovnih znamk, ki potrebujejo OEM/ODM proizvodnjo
    - Profesionalne reševalne in patruljne organizacije
