hero:
  tagline: Partnerji in distribucija
  title: Postanite Aquafarer partner<br />— Globalno distribucijsko omrežje
  subtitle: Pridružite se Aquafarerglobalni partnerski mreži. Sodelujemo z pomorskimi distributerji, prodajalci čolnov, prodajalci opreme in partnerji blagovnih znamk v 50+ državah.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer Globalna mreža partnerjev in distributerjev
content_programs:
  tagline: Partnerski programi
  title: Partnerski programi<br />Zgrajeni za rast
  subtitle: Ne glede na to, ali ste distributer, prodajalec ali partner blagovne znamke, Aquafarer ponuja programe, zasnovane za podporo vašemu podjetju.
  columns: 3
  items:
    - title: Program distributerjev
      description: Ekskluzivna distribucija ozemlja z množično ceno, marketinško podporo in neposreden dostop do tovarne. Minimalna obveza glede na velikost ozemlja.
      icon: tabler:world
    - title: Program prodajalcev
      description: Neposredno določanje cen pri prodajalcih, usposabljanje za izdelke, marketinški materiali in garancijska podpora za prodajne lokacije in spletne trgovine.
      icon: tabler:building-store
    - title: OEM/ODM Partnerstvo
      description: Polna storitev OEM in ODM proizvodnja z lastno blagovno znamko, embalažo in specifikacijami izdelka. Od koncepta do embalaže.
      icon: tabler:certificate
    - title: Partnerstvo z blagovno znamko
      description: Programi so-blagovnih znamk, zasebnih blagovnih znamk in ekskluzivnih modelov za uveljavljene blagovne znamke na področju morske in zunanje rekreacije.
      icon: tabler:stars
    - title: Vladni in institucionalni naročniki
      description: Programi prednostnih dobaviteljev za vladne agencije, obalno stražo, vojsko in humanitarne organizacije. Dokumentacija, pripravljena za razpise.
      icon: tabler:building-community
    - title: Partner za letovišče in najem
      description: Cene flote, dosledna kakovost in prilagojena blagovna znamka za letovišča, potapljaške centre in najemne operacije po vsem svetu.
      icon: tabler:sun
content_benefits:
  tagline: Zakaj sodelovati z nami
  title: Zakaj partnerji izberejo Aquafarer
  subtitle: Naši partnerji imajo koristi od resničnih proizvodnih zmogljivosti, dosledne kakovosti in odzivne podpore.
  list:
    - 'Neposreden dostop do tovarne: Sodelujte neposredno z našo proizvodno ekipo — brez posrednikov. Pridobite hitrejše odzive, boljše cene in popoln vpogled v proizvodnjo.'
    - 'Pripravljeni na prilagajanje: Blagovne znamke svojih izdelkov uporabite z unikatnimi barvami, logotipi, embalažo in specifikacijami. Minimalne količine naročil, prilagojene vašemu trgu.'
    - 'Kakovost zagotovljena: ISO 9001 certificirana proizvodnja z CE, UKCA, in BSCI skladnostjo. Vsak izdelek testiran pred pošiljanjem.'
    - 'Globalna logistika: Pošiljanje iz Qingdao na Kitajskem z FOB, CIF, in DDP opcijami. Ameriško skladišče v Montclairu, CA za distribucijo v Severni Ameriki.'
    - 'Marketinška podpora: Katalogi izdelkov, fotografije, tehnična dokumentacija in digitalni materiali za podporo vašim prodajnim prizadevanjem.'
    - 'Usposabljanje in podpora: Usposabljanje za izdelke za vašo prodajno ekipo, tehnična podpora za vaše stranke in koordinacija garancijskih storitev.'
content_process:
  tagline: Kako postati partner
  title: Preprost postopek partnerstva
  subtitle: Naš postopek partnerstva je preprost — zasnovan tako, da vam omogoči hitro prodajo Aquafarer izdelkov.
  items:
    - title: 'Korak 1: Oddaja prijave'
      description: Izpolnite naš obrazec za prijavo partnerja s podrobnostmi o vašem podjetju, ciljnem trgu in interesih za izdelke.
    - title: 'Korak 2: Pregled kvalifikacij'
      description: Naša ekipa za partnerstva pregleda vašo prijavo in vas kontaktira v roku 3 delovnih dni, da se pogovori o priložnostih.
    - title: 'Korak 3: Pogodba in nastavitev'
      description: Podpišite partnersko pogodbo, nastavite svoj račun ter prejmete partnerske cene, marketinške materiale in vzorce izdelkov.
    - title: 'Korak 4: Usposabljanje in zagon'
      description: Nudimo usposabljanje za izdelke, podporo pri prodaji in marketinške materiale. Pripravljeni ste začeti prodajati.
cta:
  title: Ste pripravljeni postati Aquafarer partner?
  subtitle: Prijavite se za partnerstvo in naša ekipa vam bo odgovorila v roku 3 delovnih dni.
  actions:
    - variant: primary
      text: Prijavite se za partnerstvo
      href: /contact
    - text: Oglejte si naše izdelke
      href: /products
