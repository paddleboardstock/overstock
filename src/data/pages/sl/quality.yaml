tests:
  - title: Testiranje tlaka
    standard: ISO 6185-1 | Notranja specifikacija AF-PT-001
    description: Napihljive komore so pod tlakom napolnjene na 1,25-kratnik priporočene delovne meje in zadržane 30 minut. Zmanjšanje tlaka se meri za potrditev zračne tesnosti in strukturne celovitosti materialov in spojev.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
  - title: Testiranje udarcev
    standard: Notranja specifikacija AF-IT-002
    description: Izdelki so izpostavljeni nadzorovanim udarcem s standardiziranimi utežmi za padec in nihalnimi napravami. To ocenjuje odpornost proti preluknjanju, širjenje trganja in strukturno odpornost proti trkom z ovirami, pomoli in ostanki.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
  - title: UV Testiranje upornosti
    standard: ASTM G154 |ISO 4892-3
    description: Vzorce materialov izpostavimo UVA-340 svetilkam v pospešenih vremenskih komorah za 1.000+ ur. Merimo spremembe barve (Delta E), zadrževanje sijaja in izgubo natezne trdnosti, da potrdimo UV pakete stabilizatorjev.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
  - title: Testiranje odpornosti proti obrabi
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: Vzorce materialov podvržejo abrazivnim kolesom CS-10 pod obremenitvami 500g/1.000g v obdobju 1.000 ciklov. Izguba mase in vizualno ocenjevanje obrabe določata obstojnost premaza proti pesku, gramozu in ponavljajočemu se izstrelitvi.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pvc-material-testing.webp
  - title: Testiranje zmogljivosti pri nizkih temperaturah
    standard: Notranja specifikacija AF-LT-003 | MIL-STD-810G
    description: Sestavljeni izdelki in materialni kuponi so kondicionirani pri -20°C, -10°C in 0°C 24 ur, nato pa se testirajo z upogibanjem. To preverimo PVC in Hypalon ostanemo prožni brez razpok ali delaminacije.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-exterior.webp
  - title: Testiranje vzgona in nosilnosti
    standard: ISO 6185-1 |ISO 12402
    description: Izdelki se postopoma nalagajo do 1,25-krat nazivne kapacitete v nadzorovanem bazenu. Beležijo se zmogljivosti z odprtim bokom, stabilnost in samoizčrpavanje. Vsaka modelna ocenjena kapaciteta je matematično in empirično preverjena.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-stock-boat-inventory.webp
  - title: Testiranje manevriranja
    standard: Notranja specifikacija AF-MT-004
    description: Preizkusi na vodi merijo radij zavijanja, pospešek, čas načrtovanja in odziv vesla/motorja v različnih pogojih obremenitve. Lastnosti upravljanja v realnem svetu se preverjajo glede na načrtovane cilje.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-dolphin-wave-1.webp
  - title: Testiranje vodotesnosti
    standard: ISO 6185-1 §7.3 | Notranja specifikacija AF-WT-005
    description: Vsak sestavljen izdelek je testiran s pršenjem pri 0,5 bara na vseh spojih, ventilih in priključkih. 5-minutni tlačni potopni test potrdi vodotesnost komore in ventila. Standard brez puščanja pred pošiljanjem.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department-2.webp
