content_challenge:
  tagline: Izziv
  title: Tenderji za jahte zahtevajo<br />Zmogljivost in predstavitev
  subtitle: Jadranski tender ni le čoln — je podaljšek matične ladje in znak kakovosti.
  paragraphs:
    - Lastniki jaht in kapetani potrebujejo tenderje, ki se dobro obnesejo, se kompaktno shranjujejo in lepo predstavijo. Tender naj dopolnjuje estetiko jahte, hkrati pa zagotavlja zanesljiv prevoz za goste in posadko.
    - '**Shranjevanje je ključnega pomena** — Tender mora ustrezati na krovu, v garaži ali na davitu. Teža je pomembna za sisteme za izstavljanje in dvig. Aquafarer RIBs nudijo odlične razmerje med močjo in težo s kompaktno prostorsko zasnovo.'
    - '**Pričakovanja glede zmogljivosti so visoka** — Gostje pričakujejo gladko, suho vožnjo pri prevozu na obalo. Motorne možnosti morajo uravnotežiti hitrost, doseg in raven hrupa za vrhunsko izkušnjo. Za najemne operacije tender deluje vsak dan in mora zdržati pogosto uporabo.'
    - '**Izgled je pomemben** — Neujemajoč se ali obrabljen tender zmanjšuje celotno predstavitev jahte. Prilagojene barve cev, oblazinjenje in blagovna znamka zagotavljajo, da tender izgleda kot del jahte.'
content_solution:
  tagline: Naša rešitev
  title: Konfiguracije tenderjev<br />Za vsako jadrno aplikacijo
  subtitle: Aquafarer RIB tenderji se lahko prilagodijo tako, da ustrezajo vaši ladji, vrsti operacije in zahtevam po shranjevanju — od specifikacij graditelja superjaht do flotnih programov za najem.
  list:
    - Prilagojene barve cev za ujemanje ali dopolnjevanje matične ladje — vsaka RAL barva je na voljo za Hypalon ali PVC cevi
    - Prilagojeno oblazinjenje in šivanje — vrhunski morski vinil z usklajevanjem barv in vezenjem logotipa
    - Krmilna konsola ali krmilo — izbira glede na vzorec uporabe in preference operaterja
    - Fiberglass globoko-V trup za gladko, suho vožnjo v različnih morskih pogojih
    - Kompaktno skladiščenje — zložljivo ali zloženo za skladiščenje na palubi, v garaži, omari ali davetskemu sistemu
    - Hypalon cevi za UV odpornost in dolgoročno ohranjanje videza
    - Standardne točke za dvigovanje in vlečne obroče na vseh modelih
    - Izbirna prevleka premca, polna prevleka in zaščitni obrabni ščitniki
    - 'Razpon motorjev: 15 HP do 60 HP — zunajkrmni ali krmilni motor'
    - OEM/možnost zasebnega označevanja za graditelje jaht in prodajalce na morju
content_segments:
  tagline: Profil kupcev
  title: Rešitve za jadranske tenderje<br />Po vrsti kupca
  subtitle: Različni segmenti jadrnice industrije imajo edinstvene zahteve. Aquafarer konfigurira tenderje, da ustrezajo vsaki uporabi.
  items:
    - title: Graditelji superjaht
      subtitle: OEM integracija tenderja — prilagojene dimenzije, barve in materiali
      description: 'Graditelji jaht se soočajo s ponavljajočim izzivom: vsako novo plovilo ima edinstvene dimenzijske omejitve, omejitve teže in estetska pričakovanja. Tender se mora popolnoma integrirati s sistemom davet matične plovbe, se prilegati natančnim dimenzijam garaže in ustrezati oblikovnemu jeziku večmilijonske jahte. Vsaka neujemanje — napačna barva cevi, nepravilna namestitev točke za dvigovanje, nezdružljiva teža — povzroči zamude pri dostavi in negativno vpliva na graditelja. Aquafarer sodeluje neposredno s skupinami za nabavo in oblikovanje graditelja, da zagotovi tenderje z lastnimi RAL barvami cevi, ujemajočo se oblazinjenjem, označenimi konzolnimi ploščami in celotnimi OEM dokumentacijskimi paketi.'
      features:
        - Prilagojene dimenzijske specifikacije, ki ustrezajo omejitvam garaže in daveta
        - Katera koli RAL barva cevi in ujemajoče se oblazinjenje — predloženi vzorci za odobritev oblikovanja
        - OEM blagovna znamka na konzoli, cevi in naslonih sedežev
        - Preverjanje točk dvigovanja in prileganja daveta za vsak model
        - Teža trupa optimizirana za določene sisteme izstrelitve in vračanja
        - Časovni načrt množičnih dobav usklajen s proizvodnimi roki
    - title: Upravniška podjetja za jadrnice
      subtitle: Standardizirani tenderji za floto — globalna podpora, minimalni izpadi
      description: Upravniška podjetja nadzorujejo več jaht, ki delujejo po Sredozemlju, Karibih, Južnem Pacifiku in drugod. Njihova osnovna potreba je zanesljivost — pokvarjen tender v oddaljenem pristanišču pomeni nadure posadke, pritožbe gostov in drage nadomestitve v zadnjem trenutku. Standardizirane specifikacije flote zmanjšajo čas usposabljanja posadke na plovilih in poenostavijo upravljanje rezervnih delov. Aquafarer ponuja cene za več plovil v floti, dosledne specifikacije pri naročilih in globalno podporo rezervnih delov za upravna podjetja z plovili v več regijah.
      features:
        - Standardizirane specifikacije za celotno upravljano floto
        - Zamenljivi rezervni deli za vse tenderje flote
        - Cene flote in količinski popusti za naročila več enot
        - Globalna razpoložljivost rezervnih delov — hitra dostava v katerokoli pristanišče
        - Dosledna dokumentacija za servis in vzdrževanje za posadko
        - Usklajevanje dobave več enot na različne lokacije plovil
    - title: Operatorji za najem jaht
      subtitle: Visokofrekventno dnevno poslovanje — vzdržljivost brez kompromisov pri videzu
      description: 'Tenderji za najem se soočajo z najzahtevnejšim operativnim urnikom v jadralni industriji: dnevni prevozi gostov, izleti na kopno, podpora vodnim športom in oskrbovanje pristanišč — pogosto 200+ operacij na sezono najema. Tender mora izgledati brezhibno ob vsakem predaji gostov, hkrati pa prenesti neprekinjeno vkrcavanje, izpostavljenost slani vodi in delovne ure motorja. Poslabšanje videza je neposredna poslovna težava — obrabljen tender vpliva na ocene gostov in cene najema.Aquafarer Konfigurirajte tenderje za najem z nadgradnjo oblazinjenja, Hypalon težkimi cevmi in ojačanimi površinami za rokovanje za dolgoročno vzdržljivost, ki ohranja kakovost predstavitev.'
      features:
        - Hypalon Težke cevi — življenjska doba 5-8 let v dnevni čarterski službi
        - Ojačane stopnice za vkrcanje in vrvi za prijem za pogosto uporabo
        - Vrhunska vinilna oblazinjenja odporna na madeže — enostavno čiščenje med najemi
        - Enostavne čistilne površine proti drsenju
        - Zanesljivi izvenkrmni paketi z enostavnim dostopom do storitev za kratek čas
        - Materiali kozmetične kakovosti, ki ohranjajo videz skozi sezone najema
    - title: Prodajalci in posredniki za jahte
      subtitle: Zanesljiva oskrba tenderjev za dokončanje plovila in preprodajno vrednost
      description: Prodajalci in posredniki potrebujejo stabilno zalogo kakovostnih tenderov, ki dopolnjujejo plovila, ki jih prodajajo — kar ustreza pozicioniranju blagovne znamke in izboljšuje izkušnjo kupca. Nedosledna zamuda pri tenderju ali dobavi lahko zamakne predajo jahte ali zmanjša predstavitev ponudbe. Prodajalci zahtevajo dosledno kakovost med serijami, zanesljive dobavne roke in konkurenčne cene, da ohranijo marže.Aquafarer Ponuja programe zalog prodajalcev s sezonskim urnikom dostave, možnostmi so-blagovne znamke za razstavo v salonih in prednostno razporeditvijo v času največje sezone.
      features:
        - Programi skladiščenja zalog z modeli na zahtevo
        - Sezonsko urnik dostave usklajen s koledarjem predaje
        - Skupno blagovno znamko prodajalca na konzoli in ceveh za razstavljanje v razstavnem prostoru
        - Dosledna kakovost in specifikacije pri vseh naročilih serij
        - Konkurenčne cene pri prodajalcih z razredom na podlagi obsega
