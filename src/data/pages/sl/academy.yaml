hero:
  tagline: Paddle Board Overstock Akademija
  title: Učilni center
  subtitle: Vodniki in priročniki za vse ravni znanja — od SUP osnov do naprednih tehnik reševanja
categories:
  - level: Začetnik
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Osnove
        desc: Naučite se temeljev supanja — drža, tehnika veslanja in ravnotežje.
        slug: beginner-sup-guide
      - title: Tehnike veslanja
        desc: Sprednji zamah, krožni zamah, vlečni zamah in nizka opora — osvojite osnovne veslaške gibe.
        slug: sup-paddle-guide
      - title: Varnost na prvem mestu
        desc: Osnovne varnostne prakse, vključno s preverjanjem vremena, PFD uporabo, pravili o vrvi in samozdravljenjem.
        slug: sup-safety-guide
  - level: Srednja raven
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Osnove turnega veslanja
        desc: Načrtovanje večurnih izletov — navigacija, hidracijo, ritem in branje vremenskih napovedi.
        slug: touring-sup-guide
      - title: Branje vremena
        desc: Interpretacija morskih napovedi, prepoznavanje vzorcev oblakov in razumevanje vpliva vetra na vodo.
        slug: weather-planning-water-sports
      - title: Osnove navigacije
        desc: Branje zemljevidov, uporaba kompasa, GPS točk in načrtovanje poti za obalno veslanje.
        slug: sup-navigation-guide
      - title: Zavedanje plime in oseke
        desc: Razumevanje plimskih ciklov, tokov in kako vplivajo na čas izplutja in načrtovanje poti.
        slug: understanding-tides
  - level: Napredno
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Načrtovanje večdnevnih izletov
        desc: Logistika ekspedicije — izbira opreme, načrtovanje hrane, varnostni protokoli in stiki v sili.
        slug: sup-travel-guide
      - title: Reševalne tehnike
        desc: Samoreševanje, T-reševanje, eskimsko reševanje za kajake in protokoli vleke na odprtem morju.
        slug: sup-self-rescue
      - title: Nočno veslanje
        desc: Navigacija po temi — zahteve glede osvetlitve, pomnjenje poti, komunikacija v skupini in zavedanje o nevarnostih.
        slug: sup-navigation-guide
  - level: Vzdrževanje
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Čiščenje in nega
        desc: Izplakovanje s sladko vodo, UV zaščita, preprečevanje plesni in pravilne tehnike sušenja po vsaki seji.
        slug: inflatable-sup-maintenance
      - title: Vodnik za shranjevanje
        desc: Najboljša praksa za shranjevanje napihljivih desk in čolnov — praznjenje, zlaganje, nadzor temperature in življenjska doba.
        slug: inflatable-sup-storage
      - title: Osnove popravila
        desc: Popravite majhne preboje, puščanje šivov in težave z ventili s popravili PVC in tehnikami zastiči.
        slug: inflatable-sup-repair
      - title: Vzdrževanje ventilov
        desc: Prepoznajte vrste ventilov (Halkey-Roberts, Boston, Leafield), očistite odpadke in zamenjajte okvarjene ventile.
        slug: inflatable-sup-repair
knowledge_center_tagline: Center za znanje
knowledge_center_title: Vodoodporna oprema in industrijski vodiči
knowledge_center_subtitle: Strokovno znanje in nakupni vodiči za morske strokovnjake, operaterje flot in navdušence nad vodnimi športi.
knowledge_sections:
  - title: RIB Znanje o čolnih
    tagline: Vodniki za čolne z rigidnim napihljivim trupom
    desc: Vse o RIB čolnih — oblikovanje trupa, materiali, izbira motorja, vzdrževanje in nasveti za nakup za komercialno in rekreativno uporabo.
    guides:
      - title: Kako izbrati pravi RIB čoln
        desc: Celovit vodič za izbiro RIB — velikost, moč motorja, material tube, tip trupa in predvidena uporaba.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB proti napihljivemu čolnu
        desc: Čoln z rigidnim napihljivim trupom proti tradicionalnemu napihljivemu čolnu — primerjava oblikovanja trupa, zmogljivosti, vzdržljivosti in kapacitete.
        href: /compare/rib-vs-dinghy
      - title: Komercialni RIB proti rekreativnim RIB
        desc: Čolni komercialne kakovosti proti rekreativnim RIB — standardi gradnje, materiali, življenjska doba, stroški in certifikati.
        href: /compare/commercial-vs-recreational-rib
      - title: Aluminij proti steklenim vlaknom
        desc: Primerjava aluminijastih in steklenih trupov za RIB čolne glede teže, stroškov, vzdržljivosti in odpornosti proti koroziji.
        href: /compare/aluminum-vs-fiberglass
  - title: Vodič po napihljivih čolnih
    tagline: Znanje o napihljivih plovilih
    desc: Celoviti vodiči o napihljivih čolnih — PVC proti Hypalon, metode gradnje, varnostni standardi in najboljša praksa vzdrževanja.
    guides:
      - title: PVC proti Hypalon Vodič po materialih
        desc: Definitivna primerjava med PVC in Hypalon CSM za gradnjo napihljivih čolnov.
        href: /compare/pvc-vs-hypalon
      - title: Kako so narejeni napihljivi čolni
        desc: Proizvodni proces — rezanje materiala, HF varjenje, gradnja šivov, preizkušanje tlaka in nadzor kakovosti.
        href: /learn/inflatable-technology
      - title: Varnostni vodič za napihljive čolne
        desc: Varnostni standardi, nosilnost, pravilno napihovanje, predhodni pregledi in postopki v sili.
        href: /learn/water-safety
      - title: Vzdrževanje napihljivih čolnov
        desc: Čiščenje, shranjevanje, zaščita UV, zimska priprava in popravilo napihljivih čolnov ter RIBs.
        href: /v2/inflatable-boat-maintenance
  - title: Znanje o Čolnih
    tagline: Napihljivi Čolni & RIB Središče
    desc: Tehnični vodiči, ki pokrivajo vrste napihljivih čolnov, materiale, metode gradnje, vzdrževanje in varnost — od čolničkov do RIBs.
    guides:
      - title: Vrste Napihljivih Čolnov
        desc: Čolnički, RIBs, kajaki in pomožni čolni — spoznajte razlike in izberite pravega.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch Tehnologija
        desc: Kako tisoči notranjih šivov ustvarjajo trdne, visokotlačne napihljive konstrukcije.
        href: /learn/drop-stitch-core
      - title: Referenca Materialov
        desc: PVC nazivna gostota, teža tkanin, UV odpornost in razloženi materiali morske kakovosti.
        href: /learn/materials
      - title: RIB proti Čolničku
        desc: Primerjava trdih napihljivih čolnov s tradicionalnimi napihljivimi čolnički za različne namene uporabe.
        href: /compare/rib-vs-dinghy
  - title: SUP Znanje
    tagline: Vodiči za Stand-Up Paddleboarde
    desc: Vse o SUP deskah — napihljive proti trdim, dimenzije desk, tehnologija materialov in strokovni nasveti za vse ravni spretnosti.
    guides:
      - title: Napihljiva proti Trdi SUP
        desc: Primerjava iSUP desk in trdih epoksi desk glede prenosljivosti, vzdržljivosti, zmogljivosti in vrednosti.
        href: /learn/sup
      - title: SUP Vodič po Dimenzijah Deske
        desc: Kako dolžina, širina in debelina vplivajo na stabilnost, hitrost in manevriranje.
        href: /learn/sup
      - title: SUP Vzdrževanje in Skrb
        desc: Čiščenje, shranjevanje, UV zaščita in nasveti za popravilo napihljivih SUP desk.
        href: /v2/inflatable-sup-maintenance
      - title: Izbira Vaše Prve SUP
        desc: Vodnik za začetnike pri izbiri pravega stand-up paddleboarda glede na vašo težo, raven spretnosti in predvideno uporabo.
        href: /learn/sup
  - title: Vodič za Potapljaško Oprema
    tagline: Znanje o Komercialnih Potapljaških Čolnih
    desc: Specializirani vodiči o potapljaških čolnih, potapljaških RIBs in opremi za potapljaške centre, operaterje potapljanja in komercialne potapljaške ekipe.
    guides:
      - title: Najboljši RIB Čoln za Potapljaške Centre
        desc: Kako izbrati pravi potapljaški RIB za vaš potapljaški center — kapaciteta, konfiguracija in proračunski vidiki.
        href: /solutions-diving-center-boats
      - title: Vodič za Konfiguracijo Potapljaškega RIB
        desc: Ključne lastnosti za potapljaški RIBs — nosilci jeklenk, sistemi lestve, potapljaška platforma in shranjevanje opreme.
        href: /solutions-diving-center-boats
  - title: Vodič za Jadranske Pomožne Čolne
    tagline: Rešitve za superjahte in pomožne čolne
    desc: Vodniki za izbiro popolnega pomožnega čolna za jahto — napihljivi čolni, RIB čolni, rešitve za shranjevanje in pribor za čolne.
    guides:
      - title: Kako izbrati pomožni čoln za jahto
        desc: Dejavniki, ki jih je treba upoštevati pri izbiri pomožnega čolna za vašo jahto — velikost, material, motor in shranjevanje.
        href: /solutions-yacht-tender-solutions
      - title: Napihljivi proti RIB čolnom
        desc: Primerjajte napihljive pomožne čolne z trdo napihljivimi čolni glede zmogljivosti, vzdržljivosti in možnosti shranjevanja.
        href: /compare/rib-vs-dinghy
  - title: Vodnik za reševalno opremo
    tagline: Znanje o iskalno-reševalnih plovilih
    desc: Profesionalni vodniki o reševalnih čolnih, SAR plovilih in opremi za izredne razmere za obalno stražo, reševalce in ekipe za pomoč ob naravnih nesrečah.
    guides:
      - title: Vodnik za izbiro SAR čolna
        desc: Kako izbrati pravi iskalno-reševalni čoln — hitrost, kapaciteta, vzdržljivost in zahteve po specializirani opremi.
        href: /solutions-rescue-watercraft
      - title: Komercialni RIB za reševalne operacije
        desc: Zakaj so komercialne RIBs prednostna izbira za profesionalne iskalno-reševalne ekipe po vsem svetu.
        href: /use-cases/search-and-rescue
