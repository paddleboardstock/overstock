hero:
  tagline: Inženirska bela knjiga
  title: Drop-Stitch Tehnologija in znanost o materialih:<br />Inženirstvo sodobnih napihljivih plovil
  subtitle: Avtoritativni tehnični referenčni vir, ki pokriva drop-stitch osnovno konstrukcijo, primerjavo PVC s Hypalon materiali, testiranje togosti visokotlačnih posod ter standarde proizvodnje plovil.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-design-discussion-lab.webp
    alt: Aquafarer R&R laboratorij — testiranje materialov in inženirstvo
direct_answer: Drop-stitch tehnologija uporablja tisoče notranjih poliestrskih niti, ki povezujejo zgornje in spodnje plasti tkanine napihljivega jedra. Ko se napihne na 15–20 PSI, te niti delujejo kot natezna členica, preprečujejo napihovanje in ustvarjajo trdno strukturo, primerljivo s konstrukcijo s trdo lupino. V kombinaciji z naprednimi PVC ali Hypalon premazi tkanine in RF varjenjem to omogoča prenosna, visoko zmogljiva napihljiva plovila, primerno za profesionalno, komercialno in rekreativno uporabo.
section_drop_stitch:
  title: Drop-Stitch Strukturno inženirstvo
  subtitle: Kako tisoče niti preoblikuje fleksibilno tkanino v trdno strukturo
  content: |
    Drop-stitch (znan tudi kot "drop-stitch tkanina" ali "drop-stitch jedro") predstavlja preboj v inženirstvu napihljivih struktur. Princip je zavajajoče preprost: tisoče posameznih poliestrskih niti se hkrati vtkajo v dve ločeni plasti osnovne tkanine, povezujoč zgornje in spodnje panele pod 90-stopinjskim kotom.

    Ko je zaprta komora pod tlakom, notranji zračni tlak deluje enakomerno v vse smeri — poskuša razmakniti zgornje in spodnje panele v cilindrično obliko. Tisoče drop-stitch niti upirajo temu razmikanju, prenašajo obremenitev v natezno silo po osi niti. Rezultat je raven, trden panel, ki zdrži 15–20 PSI notranjega tlaka.

    Pri 20 PSI panel 1 m² drop-stitch doživi približno 14.000 kg skupne notranje sile — vendar matrična mreža niti ostane popolnoma ravna. To daje drop-stitch strukturam razmerje med močjo in težo, ki se lahko kosa s tradicionalnimi togimi materiali.
