section_testing:
  title: Preizkusi in varnostni protokoli
  subtitle: Kakovostni okvir Aquafarer za vsak proizvodni bat
  protocols:
    - title: 1,25-kratni preizkus zadrževanja nazivnega tlaka
      description: Vsaka sestavljena posoda je napihnjena do 1,25-kratnika nazivnega delovnega tlaka in zadržana 24–48 ur. Vsak padec tlaka, ki presega 2 %, sproži zavrnitev in predelavo.
      standard: ISO 6185
    - title: Preizkus odpornosti šiva na luščenje
      description: Vzorce varjenih in lepljenih šivov iz vsake proizvodne serije preizkusimo glede odpornosti na luščenje z uporabo kalibrirane napetostne opreme. Zahtevana minimalna odpornost na luščenje je 4 kN/m.
      standard: ISO 2411
    - title: Preizkus natezne trdnosti tkanine
      description: Vhodne tkanine iz rol podvržemo preizkusu natezne trdnosti in razteznosti tako po vrti kot po vezni smeri. Meja zavrnitve je pod 3.000 N/5cm za PVC.
      standard: ISO 1421
    - title: UV Pospešeno vremensko staranje
      description: Vzorce materiala izpostavimo 1.000 + uram pospešenega UV izpostavljanja v QUV testnih komorah. Dovoljena največja izguba natezne trdnosti je 15%.
      standard: ASTM G154
    - title: Integriteta ventilov in priključkov
      description: Vsaka sestava ventila je preizkušena glede tesnjenja pri 1,25-kratniku nazivnega tlaka. Povratni ventili so preizkušeni glede delovanja tesnila samo v eno smer.
      standard: ISO 12402
section_manufacturing:
  title: Proizvodni standardi in certifikati kakovosti
  subtitle: Skladnost z industrijskimi standardi za dostop do svetovnega trga
  standards:
    - name: ISO 9001:2015
      body: SGS Certificirano
      scope: Sistem upravljanja kakovosti pri oblikovanju, proizvodnji in dobavi
    - name: CE 2013/53/EU
      body: Obvesteno telo EU
      scope: Direktiva o plovilih za prosti čas — oblikovanje trupa, stabilnost, plovnost, emisije
    - name: BSCI
      body: Amfori
      scope: Družbena skladnost — varnost delavcev, poštena delovna praksa, varstvo okolja
    - name: ISO 6185
      body: Mednarodni standard
      scope: Napihljivi čolni — konstrukcija, stabilnost, plovnost, preskus tlaka
    - name: REACH
      body: Uredba EU
      scope: Varnost kemikalij — omejene snovi v materialih in premazi
section_faq:
  title: Tehnična pogosta vprašanja
  questions:
    - q: Kako se drop-stitch primerja s tradicionalno trdo konstrukcijo?
      a: Sodobni drop-stitch jedri pri 20 PSI dosežejo 85–90 % trdnosti primerljivih trdo-strukturiranih EPS/paljenih steklo vlaken, hkrati pa so popolnoma izpustljiva za transport. Kompromis je nekoliko večja teža in manjša končna togost — vendar je za večino rekreativnih in komercialnih uporab razlika nepomembna.
    - q: Katera gostota niti se šteje za vrhunsko kakovost?
      a: Vrhunska drop-stitch tkanina uporablja 2 niti na kvadratni palec (približno 3.100 niti na m²) tkaljene iz 1.680 DTEX poliester niti. Osnovne tkanine uporabljajo 1 nit na kvadratni palec s 1.100 DTEX nitmi.
    - q: Ali se Hypalon lahko varijo kot PVC?
      a: Ne. Hypalon/CSM se ne da RF-variti. Sestavljati jih je treba z ročno nanesenim kontaktnim lepilom, kar naredi proizvodnjo bolj delovno intenzivno in šive odvisne od spretnosti izvajalca. PVC se lahko RF-varijo ali vroče zračno varijo za dosledno, avtomatizirano kakovost šiva.
    - q: Kateri je največji varen tlak za napihljive čolne?
      a: Standardni napihljivi čolni imajo tlak 8–12 PSI. Drop-stitch dna imajo tlak 12–20 PSI. Visokotlačna drop-stitch jedra (SUPs) lahko delujejo pri 20–25 PSI. Vsak izdelek vključuje ventil za sproščanje tlaka, kalibriran za preprečevanje prekomernega napihovanja.
    - q: Koliko časa traja izdelava po meri napihljivega čolna?
      a: Standardna proizvodnja OEM traja 30–45 dni od potrditve naročila do FOB Qingdao. Razvoj kalupa po meri doda 15–20 dni za izdelavo prototipa in testiranje.
