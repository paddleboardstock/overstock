hero:
  tagline: Proizvodna zmogljivost
  title: Proizvodna zmogljivost in letna proizvodnja
  subtitle: 12.000 m² objekt, ki proizvaja 15.000 čolnov letno z možnostjo povečanja
intro: Aquafarer upravlja eno največjih specializiranih tovarn za napihljive čolne v Qingdau, Kitajska. Naša tovarna s površino 12.000 m² je organizirana v šest specializiranih delavnic, ki delujejo vzporedno, kar nam omogoča letno proizvodnjo 15.000 čolnov v linijah SUP, kajakov, čolnov, RIB in varnostne opreme.
highlights:
  - value: 12,000 m²
    label: Skupna proizvodna površina
    detail: V šestih specializiranih delavnicah
  - value: 15,000
    label: Ladje, proizvedene letno
    detail: SUPs, kajaki, RIBs, čolni, varnostna oprema
  - value: 200-300
    label: Usposobljena delovna sila
    detail: 25+ inženirjev, 2 izmeni/dan
  - value: 50+
    label: Izvozne države
    detail: EU, ZDA, AV, Bližnji vzhod, Azija
  - value: 30–45
    label: Standardni čas izvedbe (dni)
    detail: Od potrditve naročila do FOB
  - value: 10+
    label: Leta izkušenj z izvozom
    detail: Od leta 2012
workshops:
  - title: SUP Proizvodnja plošč
    description: '4 vzporedne montažne linije za napihljive SUP plošče. Vsaka linija lahko proizvede 50–80 plošč na izmeno. Digitalni tisk in sitotisk potekata vzporedno. Letna kapaciteta SUP: 8.000+ plošč.'
    output: 8.000+ SUPs/leto
  - title: RIB Proizvodnja čolnov
    description: 'Posebna delavnica za steklena trupa z 6 kalupnimi postajami za RIB trupe do 7,6 m. Območje za varjenje cevi in montažo obravnava 3–5 RIBs hkrati. Letna kapaciteta RIB: 2.000+ čolnov.'
    output: 2.000+ RIBs/leto
  - title: Napihljivi čolni in čolnki
    description: 'Večnamenske proizvodne linije za napihljive čolne, kajake in čolnke. Postaje za vroče zračno varjenje, RF dielektrične preše in montažne delovne postaje se prirejajo glede na mešanico naročil. Letna zmogljivost: 5.000+ enot.'
    output: 5.000+ enot/leto
  - title: Varnostna oprema
    description: 'Posebno čisto-prostorsko proizvodno območje za rešilne jopiče in varnostno opremo. Posebne postaje za šivanje, vstavljanje pene in testiranje. Letna kapaciteta rešilnih jopičev: 50.000+ enot.'
    output: 50.000+ rešilnih jopičev/leto
oem_capacity:
  moq: 'SUP: 5–10 enot | RIB: 2–5 enot | Kajak/Čoln: 10–20 enot | Po meri kalup: 200+ enot'
  lead_time: Standardno 30–45 dni. Vzorec 15–20 dni. Pospešena izvedba je možna.
  payment: T/T 30% pologa + 70% pred pošiljko. Sprejemamo L/C, Western Union.
