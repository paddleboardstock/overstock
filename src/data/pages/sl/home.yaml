      icon: tabler:shield
      cta: Razpravljajte o projektu
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM Zmogljivosti
  title: Kar dobiš<br />Paddle Board Overstockz
  subtitle: Neposreden dostop do tovarne s popolno inženirsko, kakovostno in skladnostno podporo — ne trgovsko podjetje.
  columns: 2
  items:
    - title: OEM/ODM Prilagajanje
      description: Prilagojena zasnova trupa, material cevi (PVCali Hypalon/CSM), razporeditev konzole, sedeži, blagovna znamka, barve in embalaža. Od manjših sprememb do popolnega inženiringa po meri.
      icon: tabler:adjustments
    - title: NizkoMOQ, hitro vzorčenje
      description: 'RIB: 2-5 enot (obstoječi kalup). SUP: 5-10 enot na SKU. Prilagojeni kalupi: 200+ enot. Predprodukcijski vzorci z vašo blagovno znamko v 7-14 dneh.'
      icon: tabler:rocket
    - title: Kakovost pripravljena za proizvodnjo
      description: Vsaka enota je bila preizkušena s tlakom 1,25x, ocenjena PSI za 24-48 ur. 99,3 % brezhibna stopnja na AQL 2,5 / ISO 2859. 100-točkovni kontrolni seznam kakovosti na trup.
      icon: tabler:certificate
    - title: Popolna dokumentacija o skladnosti
      description: CE po 2013/53/EU (RCD), ISO 9001:2015 (SGS), BSCI socialni reviziji, REACH skladnosti, UKCA označevanju. Vključeni so podatki o modelno specifičnih DoC in ploščah proizvajalcev.
      icon: tabler:file-certificate
    - title: Rok za pripravo 30-45 dni
      description: Standardna proizvodnja 30-45 dni FOB Qingdao. Prototipi 7-14 dni. Na voljo je hitra proizvodnja. Načrti za natovarjanje kontejnerjev in zaboje ISPM-15 so vključeni.
      icon: tabler:truck-delivery
    - title: Poprodaja in rezervni deli
      description: 5-letna garancija na čolne/kajakeRIBs/, 2 leti na SUP/dodatke. Dobava rezervnih delov s prednostno dostavo. Podpora pri obravnavi garancijskih zahtevkov.
      icon: tabler:lifebuoy
content_categories:
  tagline: Kategorije izdelkov
  title: 5 kategorij,<br />64 CE-Certificirani modeli
  subtitle: Od RIB 2,4 milijona tenderjev do 15 čevljev SUP dolgih desk — vse izdelano v ISO naši tovarni Qingdao 9001.
  items:
    - title: RIB Čolni
      description: 2,4 m do 7,0 m z aluminijastimi ali GRP trupi. PVC ali Hypalon/CSM cevi. CE po 2013/53/EU. Patruljne, potapljaške, reševalne in komercialne konfiguracije.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Napihljivi čolni
      description: 2,0 m do 5,0 m z aluminijastim dnom, leseno dno ali možnostjo zračnega dna. Modeli za ribolov, rekreacijo in pomožne čolne.
      icon: tabler:sailboat
      link: /products
    - title: SUP Deske
      description: 9 ft do 15 ft v 4-palčnih in 6-palčnih Drop-Stitch. Vsestranski, turistični, joga in ribolovni modeli. Na voljo tudi komercialne izvedbe.
      icon: tabler:swimming
      link: /products
    - title: Kajaki
      description: Napihljivi kajaki za 1 do 3 osebe. Rekreativni in turistični modeli z Drop-Stitch možnosti dna.
      icon: tabler:kayak
      link: /products
    - title: Varnostna oprema
      description: Reševalni jopiči s certifikatom CE, vrvi za metanje, kompleti za popravilo, črpalke in navigacijske luči. PFD-ji tip III/V, odobreni USCG.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Moč tovarne
  title: Proizvodnja pripravljena na revizijo<br />v Qingdau
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12.000 m² ISO 9001 objekt — Pravi proizvajalec, ne trgovsko podjetje</h3>
  items:
    - title: 6 namensko opremljenih proizvodnih linij
      description: Ločene linije RIB, napihljivi čolni, SUP, kajaki, varnostna oprema in OEM/ODM. Vsaka z namensko QC kontrolno točko in načrtovanjem proizvodnje.
    - title: 100% preizkušeno s pritiskom
      description: Vsaka napihljiva komora je napolnjena s pritiskom 1,25x ocenjenega PSI in vzdržana 24-48 ur. Rezultati testov povezani s serijsko številko trupa (HIN).
    - title: Sledenje po trupih
      description: 'Proizvodna dokumentacija na nivoju HIN z 21 + podatkovnimi polji na trup: serija materiala, ID varilca, rezultat preizkusa pritiska, končna konfiguracija in ciljna destinacija.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12.000 m² ISO 9001 proizvodni obrat v Qingdau z RIB proizvodnimi linijami
content_compliance:
  tagline: Skladnost in dokaz kakovosti
  title: Dokumentirani dokazi,<br />ne le trditve
  subtitle: Vsaka trditev o skladnosti je podprta z dokumentacijo, specifično za model, ki je na voljo za vašo verifikacijo.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Sistem vodenja kakovosti certificiran s strani TÜV Rheinland/SGS. Letne nadzorne revizije. Dokumentirani procesi QC od vhodnega materiala do odpreme.
      icon: tabler:certificate
    - title: CE po 2013/53/EU (RCD)
      description: 64 modelov z deklaracijami o skladnosti, specifičnimi za model. Presoja skladnosti po veljavnih modulih. Registracija HIN in podatki o ploščici proizvajalca za vsak trup.
      icon: tabler:file-certificate
    - title: BSCI Družbena skladnost
      description: Letni BSCI pregled s strani SGS. Preverjene etične delovne prakse, varnost na delovnem mestu in upravljanje z okoljem po celotnem našem objektu.
      icon: tabler:users
    - title: REACH & UKCA
      description: Vsi PVC in lepilni materiali so skladni z REACH uredbo EU. Za britanski trg je na voljo oznaka UKCA. Varnostni listi materialov so na voljo na zahtevo.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Proces — Od kratke predstavitve do kontejnerja
  items:
    - title: Korak 1:<span class="font-medium">Zahteve</span>
      description: Delite specifikacije vašega izdelka, ciljni trg, količino in zahteve glede skladnosti. Naša inženirska ekipa pregleda v 48 urah.
      icon: tabler:file-text
    - title: Korak 2:<span class="font-medium">Predlog</span>
      description: Prejmite podrobno ponudbo s specifikacijami, možnostmi materiala, MOQ, cenami, časom dobave in obsegom skladnosti za vaš trg.
      icon: tabler:clipboard-list
    - title: Korak 3:<span class="font-medium">Prototip</span>
      description: Predprodukcijski vzorec z vašo blagovno znamko v 7–14 dneh. Popolno testiranje kakovosti pri 1,25-kratni nazivni tlaki. Stroški vzorca se upoštevajo pri proizvodnji.
      icon: tabler:settings
    - title: Korak 4:<span class="font-medium">Proizvodnja</span>
      description: 30-45 dni proizvodnje v Qingdaou po odobritvi vzorca. Kontrolne točke med proizvodnim procesom, testiranje tlaka in 100-točkovni končni pregled vsake enote.
      icon: tabler:building-factory
    - title: Korak 5:<span class="font-medium">Dostava</span>
      description: Načrt nakladanja zabojnika, leseni zaboji ISPM-15, paket dokumentacije o skladnosti in FOB pošiljka iz Qingdaoa s celotno izvozni dokumentacijo.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock OEM/ODM proces izdelave napihljivega čolna od zasnove do pošiljke v kontejnerju
blog_latest:
  title: Industrijski in tehnični vpogledi
  information: |
    RCD vodniki za skladnost, OEM/ODM članki o postopkih, primerjave materialov,
    in sredstva za inšpekcijo tovarn iz inženirske ekipe Paddle Board Overstock.
faqs:
  title: B2B Pogosta vprašanja o nabavi
  subtitle: Pogosta vprašanja blagovnih znamk, distributerjev in komercialnih operaterjev o proizvodnji OEM/ODM z Paddle Board Overstock.
  columns: 2
  items:
    - title: Ali ste proizvajalec ali trgovsko podjetje?
      description: Smo vertikalno integrirana tovarna s popolnim nadzorom nad kakovostjo, materiali in dobavnimi roki. Poslovna licenca in obseg proizvodnje sta preverljiva med inšpekcijskim pregledom tovarne.
      icon: tabler:building-factory
      category: all
    - title: Kakšen je vaš OEM/ODM proces?
      description: Pregled zahtev (48 ur) do predloga za prototip (7-14 dni) do proizvodnje (30-45 dni FOB Qingdao). Popolna inženirska podpora, dokumentacija skladnosti in sledljivost po vsaki trupi skozi celoten proces.
      icon: tabler:route
      category: all
    - title: Kakšne so vaše MOQ zahteve?
      description: 'RIB čolni: 2-5 enot na model (obstoječa kalup), 200+ za prilagojene kalupe. SUP deske: 5-10 enot na SKU. Na voljo so naročila zabojnikov z mešanimi modeli. Naročila vzorcev: 2-5 enot za oceno.'
      icon: tabler:sort-ascending
      category: all
    - title: Katera možnost prilagoditve je na voljo?
      description: Oblikovanje trupa, material cevi (PVC ali Hypalon/CSM), premer cevi, postavitev konzole, sedišča, krmiljenje, sistem za gorivo, postavitev krova, barve blagovne znamke, grafika logotipa, EVA dizajn podloge, maloprodajna embalaža in označevanje uporabniškega priročnika.
      icon: tabler:adjustments
      category: all
    - title: Katere dokumente o skladnosti lahko zagotovite za moj trg?
      description: CE DoC po 2013/53/EU, UKCA označevanje, ISO 9001 certifikat (SGS), BSCI revizijsko poročilo, REACH skladnost, poročila o testiranju materiala, zapisi o preizkusu tlaka in podatki o ploščici graditelja za posamezen model. Dokumentacija specifična za trg na zahtevo.
      icon: tabler:file-certificate
      category: all
    - title: Kateri je čas priprave vzorcev in proizvodnje?
      description: 'Vzorci pred proizvodnjo: 7-14 delovnih dni. Standardna proizvodnja: 30-45 dni FOB Qingdao. Hitra proizvodnja na dodatne stroške. V sezoni vrha (marec-junij) se lahko podaljša čas izvedbe.'
      icon: tabler:clock
      category: all
    - title: Ali lahko uredim revizijo tovarne ali ogled v živo preko video klica?
      description: Da. Revizije na lokaciji naši tovarni v Qingdau s predhodnim obvestilom 3-5 dni so dobrodošle. Ogledi v živo preko WhatsApp/Zoom so na voljo takoj. Tretjeosebne inšpekcije (SGS, BV, TÜV) so možne.
      icon: tabler:video
      category: all
    - title: Kateri pregledi kakovosti so opravljeni pred odpremo?
      description: 1,25x preskus zadrževanja tlaka (24-48h), test lukenj v šivu, 100-točkovni zaključni pregled, preverjanje dimenzij, kozmetični pregled, preverjanje dokumentacije o skladnosti in pregled integritete embalaže. Vse po postopkih ISO 9001.
      icon: tabler:clipboard-check
      category: all
