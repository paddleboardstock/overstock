      description: Hlevske deske, ki jih lahko deli cela družina, poleg lažjih otroških modelov — opreme, ki jo spravite v avto in se napihne v nekaj minutah.
      icon: tabler:beach
      cta: Nakupujte družinske pakete
      cta_href: /products
    - title: Veslači za turne in fitnes
      description: Daljše, hitrejše deske za turo in joga platforme s polno palubo za veslače, ki preživijo celotno razdaljo.
      icon: tabler:route
      cta: Nakupujte deske za turneje in jogo
      cta_href: /supboard
    - title: Ribiči
      description: Ultra-stabilne platforme z nosilci opreme in prostorom za hladilnik — metanje z mirne, ravne palube.
      icon: tabler:lifebuoy
      cta: Nakup ribolova SUPs
      cta_href: /products
features:
  id: features
  tagline: Zakaj kupiti pri Paddle Board Overstock
  title: Real Factory,<br />Resnični prihranki
  subtitle: SUP Tovarniško neposredni paketi zalog in razprodaje — certificirana kakovost brez maloprodajne marže.
  columns: 2
  items:
    - title: Do 60 % popusta na maloprodajo
      description: Prodajamo tovarniške zaloge in razprodajne serije neposredno — brez posrednikov, brez maloprodajne marže. Iste deske, ki jih drugje prodajajo po polni ceni, tukaj po razprodaji.
      icon: tabler:rocket
    - title: Popolni paketi
      description: 'Vsak SUP je na voljo kot popoln paket: deska, potovalni nahrbtnik, ročna črpalka, nastavljiva lopatica, odstranljiva plavut, povodec za tuljavo in komplet za popravilo.'
      icon: tabler:clipboard-list
    - title: Certificirana kakovost
      description: 13 CEmodelov s certifikatom po SUP veljavnih direktivah EU. Vsaka plošča je pred pošiljanjem 100 % testirana pod tlakom z oceno 1,25x PSI . 99,3 % brezhibna stopnja na AQL 2,5.
      icon: tabler:certificate
    - title: Ne MOQ — Prva tabla za ukaz
      description: Razprodaja presežnih zalog pomeni, da so posamezna naročila dobrodošla. Dodajte tablo v košarico, odkupite, urejeno. Brez minimalnega naročila, brez postopka ponudbe.
      icon: tabler:adjustments
    - title: Hitra svetovna dostava
      description: Naročila na zalogi iz Weihai so odposlana v 2-3 delovnih dneh. Sledenje dostavi v 50+ držav po EU, Severni Ameriki, Aziji in Pacifiku in širše.
      icon: tabler:truck-delivery
    - title: 2-letna SUP garancija
      description: SUP Vsaka plošča in pripomoček sta krita za 2 leti — drop-stitch vključeni so šivi, napihovalni ventili in dodatki. Zahtevki se rešujejo v dneh, ne tednih.
      icon: tabler:lifebuoy
