content_customer_types:
  tagline: Komu služimo
  title: Zgrajeno za kupce B2B<br />— Ne maloprodajni kupci
  subtitle: Paddle Board Overstock proizvaja za štiri vrste strank. Vsaka ima različne prioritete, in vse jih naslovimo.
  items:
    - title: Lastniki blagovnih znamk / Lastna znamka
      description: Prilagojena zasnova izdelkov, grafike za zasebno blagovno znamko, dokumentacija o skladnosti pod vašo znamko in namensko inženirsko podporo od koncepta do kontejnerja.
      icon: tabler:palette
      cta: Zahteva OEM/ODM Ponudba
      cta_href: /request-quotation
    - title: Distributerji / veletrgovci
      description: Zaščita ozemlja, konkurenčne veleprodajne cene, marketinški podporni kompleti, usposabljanje za izdelke in popolna dokumentacija skladnosti za vaš trg.
      icon: tabler:world
      cta: Prijavite se za prodajalca
      cta_href: /dealers-distributors
    - title: Letovišča / upravljavci najema
      description: Vzdržljivost komercialne kakovosti, nasveti glede velikosti voznega parka, naročila mešanih modelov kontejnerjev, strategija rezervnih delov in paketi opreme z blagovno znamko letovišč.
