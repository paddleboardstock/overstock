  tagline: Kategorije izdelkov
  title: Ena linija izdelkov,<br />Narejeno prav
  subtitle: SUP Napihljive deske in dodatki — vse izdelano v ISO naši ustanovi Weihai 9001.
  items:
    - title: SUP Deske
      description: Vsestransko napihljiv SUPs od 9 do 12 čevljev. Stabilen, trpežen in popoln s črpalko, veslom, povodcem in nahrbtnikom.
      icon: tabler:swimming
      link: /supboard
    - title: Turistični SUPs
      description: Daljše, hitrejše deske s turističnimi oblikami za jezera, reke in obalni raziskovanje.
      icon: tabler:route
      link: /supboard
    - title: Joga in fitnes SUPs
      description: Široke, ultra stabilne platforme s celotno dolžino podlog za jogo in vadbo na vodi.
      icon: tabler:users
      link: /supboard
    - title: Otroci SUPs
      description: Lažje, krajše deske velikosti za otroke — enaka drop-stitch kakovost v paketu prijaznem otrokom.
      icon: tabler:lifebuoy
      link: /products
    - title: Dodatki
      description: Črpalke, vesla, rešilni jopiči, povodci, komplet za popravilo in nadomestni deli za vsako desko, ki jo prodajamo.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Moč tovarne
  title: Zakaj so naše razprodajne cene<br />resnične
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Prava tovarna, prave prihranke — vsaka deska odpošljena iz našega obrata v Weihai</h3>
  items:
    - title: Isti proizvodni trakovi kot pri glavnih blagovnih znamkah
      description: Naša tovarna v Weihaiu, 12.000 m², izdeluje deske za mednarodne blagovne znamke in naše lastne zaloge na enakih proizvodnih linijah z enakimi materiali.
    - title: 100% preizkušeno s pritiskom
      description: Vsaka deska je napolnjena na 1,25x priporočen PSI in zadržana pred pošiljanjem. 99,3 % brezhibnost po AQL 2.5 / ISO 2859.
    - title: Brez posrednikov
      description: Deske se pošiljajo neposredno iz tovarne na vaš naslov. Brez marže distributerja, brez maloprodajne marže — tako so razprodajne cene do 60 % nižje od maloprodajnih.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12.000 m² tovarna Weihai z napihljivimi SUP proizvodnimi linijami
content_compliance:
  tagline: Skladnost in dokaz kakovosti
  title: Certificirana kakovost,<br />Dokumentirano
  subtitle: Vsaka trditev o skladnosti je podprta s certifikati in dokumentacijo specifično za model, ki je na voljo za vašo preverbo.
  items:
    - title: ISO 9001:2015
      description: Sistem vodenja kakovosti certificiran s strani TÜV Rheinland/SGS. Letne nadzorne revizije. Dokumentirani procesi QC od vhodnega materiala do odpreme.
      icon: tabler:certificate
    - title: CE Certificirano
      description: 13 CE-certificiranih SUP modelov po veljavnih direktivah EU, vsak z izjavo o skladnosti in podatki o ploščici proizvajalca.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Vsi PVC in lepilni materiali so v skladu z uredbo EU REACH. Oznaka UKCA je na voljo za britanski trg. Varnostni listi za materiale na zahtevo.
      icon: tabler:shield-check
    - title: 2-letna SUP garancija
      description: Vsaka SUP deska in pripomočki so pokriti 2 leti — drop-stitch šivi, ventili za napihovanje in pripomočki vključeni. Zahtevki se rešujejo hitro.
      icon: tabler:lifebuoy
steps:
  title: Od blagajne do vode — Kako vaš naročilo prispe
  items:
    - title: Korak 1:<span class="font-medium">Izberi svojo desko</span>
      description: Izberite med modeli all-around, touring, yoga in za otroke. Naši vodiči za nakup vam pomagajo uskladiti velikost in slog deske z vašim veslanjem.
      icon: tabler:clipboard-list
    - title: Korak 2:<span class="font-medium">Varno nakupovanje</span>
      description: Plačajte varno s Stripe ali PayPal. Sprejemamo vse glavne kreditne in debetne kartice. Račun niso potrebni — potrditev naročila boste prejeli v svoj poštni predal.
      icon: tabler:file-text
    - title: Korak 3:<span class="font-medium">Inšpekcija kakovosti</span>
      description: Vsaka plošča je 100 % preizkušena pod pritiskom pri 1,25-kratni nazivni vrednosti PSI in preverjena glede celotnega kontrolnega seznama kakovosti, preden je zapakirana.
      icon: tabler:settings
    - title: Korak 4:<span class="font-medium">Hitra pošiljka</span>
      description: Naročila, ki so na zalogi, se pošiljajo iz naše tovarne v Wehaiju v roku 2-3 delovnih dni. Za nujna naročila je na voljo hitra obdelava.
      icon: tabler:building-factory
    - title: Korak 5:<span class="font-medium">Spremljana dostava</span>
      description: Sledenje svetovni dostavi v 50+ držav. Vaša 2-letna garancija in odzivna poprodajna podpora se začnejo na dan, ko vaš deska prispe.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP postopek naročila od varne blagajne do sledljive svetovne dostave
blog_latest:
  title: SUP Vodniki in tehnični vpogledi
  information: |
    Nakupni vodiči, tehnika veslanja, osnovna varnost in gradnja
