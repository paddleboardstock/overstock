faqs:
  title: SUP Naročanje in Pogosto zastavljena vprašanja o izdelku
  subtitle: Pogosta vprašanja o naših razprodajnih SUP ploščah, naročanju, plačilu, pošiljanju in garanciji.
  columns: 2
  items:
    - title: Se je SUP težko naučiti?
      description: Sploh ne. Večina začetnikov vstane in vesla že v svoji prvi seji. Naše vsestranske SUP deske imajo izjemno široke stabilne platforme, posebej zasnovane za prve veslače. Začnite na mirni vodi in kmalu boste veslali brez težav.
      icon: tabler:swimming
      category: sup
    - title: Kakšna je omejitev teže?
      description: Naša vsestranska SUPs podpira do 220 lbs, platforme za turne in jogo pa do 250 lbs. Vsaka stran izdelka navaja natančno nosilnost jahača, tako da lahko desko prilagodite svojim potrebam.
      icon: tabler:adjustments
      category: sup
    - title: Ali lahko potujem z gumenjakom SUP?
      description: Absolutno. Vsaka Paddle Board Overstock deska se prilega v torbo velikosti nahrbtnika. Pri teži le 18-22 funtov jo je enostavno nositi na plažo, ob jezero ali skozi terminale letališča. Pred potovanjem preverite politiko prtljage vaše letalske družbe.
      icon: tabler:truck-delivery
      category: sup
    - title: Kaj je v škatli?
      description: Vsak Paddle Board Overstock SUP vključuje desko, potovalni nahrbtnik, ročno tlačilko, nastavljivo veslo, snemljivo plavut, navojni povodec in komplet za popravilo.
      icon: tabler:clipboard-list
      category: sup
    - title: Zakaj so vaše cene nižje od maloprodajnih?
      description: Prodajamo presežke in razprodaje tovora neposredno iz naše lastne proizvodne enote v Weihaiu na Kitajskem — brez posrednikov, brez maloprodajne marže. To pomeni popolne SUP pakete do 60 % ceneje od običajnih maloprodajnih cen, z enako CE-certificirano kakovostjo.
      icon: tabler:certificate
      category: orders
    - title: Kako oddam naročilo in plačam?
      description: Dodajte svoj SUP paket v košarico in varno plačajte s Stripe ali PayPal. Sprejemamo vse večje kreditne in debetne kartice. Vsako naročilo je potrjeno po e-pošti s celotnim računom.
      icon: tabler:file-text
      category: orders
    - title: Ali pošiljate po vsem svetu?
      description: Da. Pošiljamo v 50+ držav po celotni EU, Severni Ameriki, Azijsko-Pacifiški regiji, Bližnjem vzhodu in Afriki. Naročila, ki so na zalogi, običajno odpremimo v 2-3 delovnih dneh, za vsak paket pa je zagotovljeno sledenje.
      icon: tabler:route
      category: orders
    - title: Kakšno garancijo vključujejo SUP plošče?
      description: 'Vsaka SUP deska in dodatna oprema ima 2-letno garancijo — vključno z desko, drop-stitch šivi in ventili za napihovanje. Zahteve se rešujejo v dneh, ne tednih: vložite jih prek spleta in mi popravimo ali zamenjamo.'
      icon: tabler:lifebuoy
      category: orders
