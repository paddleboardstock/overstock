content_customer_types:
  tagline: Komu služimo
  title: Deske za vsak<br />tip veslača
  subtitle: Ne glede na to, ali je to vaša prva seja ali petdeseta, obstaja razprodajna deska, ki ustreza vašemu načinu veslanja.
  items:
    - title: Za začetnike
      description: Dodatno široke, stabilne vseobsegajoče deske, ki olajšajo vašo prvo sejo — večina začetnikov stoji že v nekaj minutah.
      icon: tabler:swimming
      cta: Nakupujte prijazno do začetnikov SUPs
      cta_href: /supboard
