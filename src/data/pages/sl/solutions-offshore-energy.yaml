content_challenge:
  tagline: Izziv
  title: Zahteve Offshore Energije<br />Zanesljivost v ekstremnih pogojih
  subtitle: Operacije offshore energije postavljajo opremo na rob — ekstremno vreme, oddaljene lokacije, neprekinjeni delovni cikli in ničelna toleranca za odpovedi.
  paragraphs:
    - Offshore energetska industrija deluje v najbolj zahtevnih morskih okoljih na svetu. Delovne ladje podpirajo platforme za olje in plin, postavitve vetrnih turbin, podmorske kabelske operacije in projekte morske gradnje — pogosto v odprtih oceanskih razmerah z omejenimi vremenskimi okni. Odpoved opreme ni le draga, ampak tudi nevarna.
    - '**Varnost je najvišja prioriteta** — Ladje za prevoz posadke morajo delovati varno v morskem stanju, ki bi ustavilo druge operacije. Stabilnost ob prenosu, zanesljive zmogljivosti motorja v vseh vremenskih pogojih in robustna konstrukcija za ponavljajoče se privezovanje ob offshore strukturah so obvezne zahteve.'
    - '**Sposobnost vseh vremenskih pogojev je ključna** — Offshore vetrne farme in naftne ploščadi delujejo skozi vse leto. Delovne ladje morajo delovati v visokih valovih, močnem vetru in omejeni vidljivosti. Dnevne in nočne operacije zahtevajo popolne navigacijske sisteme in zanesljive svetlobne sisteme.'
    - '**Sektor offshore vetra hitro raste** — Po vsem svetu se namešča na tisoče novih turbin, vsaka potrebuje redni prevoz posadke, transport orodij in podporo pri vzdrževanju. To ustvarja trajno povpraševanje po namenjenih ladjah za prevoz posadke (CTV) in podpornih RIBs.'
    - Aquafarer offshore energija RIBs je zasnovana z ojačanimi globokimi V trupom, težkimi Hypalon cevmi, popolnimi navigacijskimi sistemi in varnostnimi sistemi, zasnovanimi za ekstremne pogoje offshore operacij.
content_solution:
  tagline: Naša rešitev
  title: Namenjeno Offshore RIBs<br />Za energetsko industrijo
  subtitle: Vsaka Aquafarer offshore energija RIB je zasnovana za varen in zanesljiv obrat v ekstremnih morskih pogojih — od Severnega morja do jugovzhodne Azije.
  list:
    - Ojačan globoki V trup za učinkovito delovanje v neugodnih vodah in predvidljivo upravljanje
    - Težke Hypalon cevi z UV in odpornostjo proti kemikalijam za daljšo offshore uporabo
    - Strojna oprema iz nerjavečega jekla 316 — brez korozije pri stalni izpostavljenosti slani vodi
    - 'Popoln navigacijski paket: GPS, radar, VHF, nočne navigacijske luči — standardno na offshore modelih'
    - Samopraznilna paluba za varen obrat v pogojih nalivanja morja
    - Več konfiguracij motorjev — enojni ali dvojni zunajkrmni motor za redundanco misije
    - Vlečna objemka in težka privezna oprema za rokovanje s platformami in plovci
    - Cevni deli v barvah visoke vidljivosti za prepoznavanje v offshore deloviščih
content_segments:
  tagline: Energijski profili
  title: Rešitve za offshore energijo<br />Po vrsti uporabe
  subtitle: Različni sektorji offshore energije imajo edinstvene zahteve za delovne čolne — od podpore platformam RIBs do CTV-jev za vetrne elektrarne do plovil za podvodne inšpekcije.
  items:
    - title: Podpora platformam za nafto in plin na morju
      subtitle: Prevoz posadke, dobava opreme, varnostna rezerva platforme
      description: Naftne in plinske platforme zahtevajo dnevno menjavo posadke, transport opreme in zalog ter pokrivanje varnostne rezerve. Delovni čolni morajo varno delovati okoli struktur platforme, v močnem toku in spremenljivih morskih pogojih ter vzdrževati natančno držanje položaja med prenosom oseb po lestvi ali hodniku. Ekstremno okolje — ogljikovodiki, kemikalije, stalni solni razpršil — zahteva odpornost na korozijo in zanesljivo delovanje.
      features:
        - Konfiguracija za prevoz posadke z varnim dostopom in ograjami
        - Cevni deli odporni proti koroziji Hypalon in oprema iz nerjavečega jekla 316
        - Ojačane zaščitne letve za pogoste stike s platformnimi odbijači
        - Samoprazneča ploščad za odvečno naftno vodo in kemično pranje
        - Rezervoar za gorivo velike kapacitete za podaljšan offshore doseg
        - Opcija dvojnega motorja za kritično redundanco misije
    - title: Operacije na vetrnih elektrarnah na morju
      subtitle: Prevoz posadke, vzdrževanje turbin, transport orodij
      description: Offshore veter je hitro rastoč sektor v pomorski energiji. Operaterji potrebujejo plovila za prevoz posadke (CTV), ki lahko varno prevažajo tehnike do platform za dostop do turbin v morskih pogojih do 1,5 m značilne višine valov. Stabilnost med prenosom, sposobnost delovanja v vseh vremenskih pogojih in zanesljivo vsakodnevno delovanje so ključni. Servisna plovila za vetrne elektrarne delujejo po strogih časovnih načrtih — kateri koli izpad podaljša uvajanje ali vzdrževanje turbin in neposredno vpliva na prihodke od proizvodnje energije.
      features:
        - Optimizirana oblika trupa za stabilen prevoz posadke pri osnovi turbine
        - Vstop v obliki Deep-V za udobno plovbo v offshore chop-u in valovanju
        - Popolna zaščita pred vremenom — zaprta konzola ali krmilnica za udobje posadke
        - Prostor na krovu za orodja, rezervne dele in servisno opremo
        - Paket za nočno delo za daljše izmene v zimskih časih z omejeno svetlobo
        - Tiho delovanje zunanjega motorja za minimalen hrupni vpliv na morsko okolje
    - title: Podpora podvodnim kablom in cevovodom
      subtitle: Inšpekcija, vzdrževanje, podpora ROV, preverjanje
      description: Operaterji podvodnih kablov in cevovodov potrebujejo delovne čolne za inšpekcijo poti, podporo pri vzdrževanju, operacije ROV in meritve. Ta plovila zahtevajo stabilne platforme za spuščanje in dvigovanje podvodne opreme, natančno manevriranje pri nizki hitrosti za sledenje kablov in zanesljivo delovanje v obalnih in offshore okoljih. Stabilnost čolna je odločilnega pomena za natančnost sonarskih in merilnih naprav.
      features:
        - Stabilna platforma pri nizki hitrosti za sledenje kablom in merilne operacije
        - Odprt razpored krova za namestitev ROV, kolute kablov in merilno opremo
        - Oprema za montažne plošče za sonar, GPS in merilno instrumentacijo
        - Nizkonivojski trup za minimalno motenje morskega dna med inšpekcijo
        - Natančno manevriranje pri nizki hitrosti z odzivnim zunajkrmnim krmiljenjem
    - title: Podpora pomorskega inženiringa in gradnje
      subtitle: Prevoz oseb, oskrba z materialom, potapljaška podpora
      description: Pomorski inženiring izvajalci, ki delajo na gradnji pristanišč, zaščiti obale in projektih na odprtem morju, potrebujejo vsestranske delovne čolne za prevoz oseb med gradbenimi plovili in obalo, oskrbo z materiali in orodji, potapljaško podporo in pregled krajev. Ti čolni delujejo v aktivnih gradbenih območjih z več plovili, omejenim manevrskim prostorom in spremenljivimi razmerami na morju. Trajnost in vsestranskost sta ključni.
      features:
        - Večnamenski razpored palube za osebje, materiale in potapljaško opremo
        - Potapljaška lestev in montaža opreme za potapljaške podporne operacije
        - Trpežni čepi in vlečni steber za manevriranje na gradbišču
        - Robustna gradnja Hypalon za odpornost proti gradbenim ostankom in abraziji
        - Fleksibilne konfiguracije sedežev — prevoz posadke ali način tovora
