content_founding:
  tagline: Začetek
  title: Rojen ob obali
  subtitle: 'Paddle Board Overstock se je začel v obalni delavnici v Qingdau z enim čolnom in vizijo: zgraditi napihljiva plovila, ki bi se obnesla v resničnih morskih pogojih.'
  paragraphs:
    - Leta 2012 so naši ustanovitelji prepoznali vrzel na trgu — večina napihljivih čolnov je bila bodisi poceni, a nezanesljiva, ali visoko kakovostna, a neznosno draga. Verjeli so, da obstaja prostor za proizvajalca, ki nudi tako kakovost kot tudi vrednost.
    - Prvi trup je bil ročno izdelan, preizkušen v lokalnih vodah in izpopolnjen na podlagi resničnih povratnih informacij ribičev in malih komercialnih operaterjev. Ta povratna zanka — zgradi, testiraj, poslušaj, izboljšaj — ostaja še danes jedro naše inženirske filozofije.
    - Do leta 2015 se je novica razširila tudi izven Qingdaoja. Mednarodni distributerji so začeli zahtevati vzorce. Kar se je začelo kot lokalna delavnica, je postalo globalni dobavitelj.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Zgodnja proizvodna delavnica in proizvodnja
content_growth:
  tagline: Rast in inovacije
  title: Od delavnice do 12.000 m² Objekt
  subtitle: Neprekinjene naložbe v ljudi, opremo in procese so se preoblikovale Paddle Board Overstock v sodoben pomorski proizvodni obrat.
  paragraphs:
    - Z rastjo povpraševanja se je povečal tudi naš obrat. Razširili smo se iz majhne delavnice v tovarno velikosti 12.000 m² z namenskimi proizvodnimi linijami za RIB čolne, napihljive čolne, SUP deske in dodatke.
    - Vlagali smo v CNC rezalne stroje, visokofrekvenčno varilno opremo, proizvodne linije za drop stitch in celovite testne naprave — kar nam je omogočilo nadzor nad vsakim vidikom kakovosti proizvodnje.
    - Danes naša ekipa šteje 200-300 ljudi, pomorski inženirji, znanstveniki za materiale, strokovnjaki za nadzor kakovosti in usposobljeni obrtniki — mnogi med njimi so z nami Paddle Board Overstock že od samih začetkov.
content_mission:
  tagline: Naše poslanstvo
  title: Inženirska svoboda na vodi
  subtitle: Vsak Paddle Board Overstock izdelek je zasnovan tako, da ljudem omogoča raziskovanje, delo in uspevanje na vodi — zanesljivo, varno in dostopno.
  list:
    - Oblikujte plovila, ki delujejo v resničnih morskih razmerah — ne le na papirju
    - Vzpostavite trajna partnerstva z distributerji in blagovnimi znamkami preko zanesljive OEM/ODM storitve
    - Nenehno izboljšujte naše proizvodne procese, da zagotovimo boljšo vrednost
    - Podprite vsak izdelek z originalnimi nadomestnimi deli in tehničnim znanjem
