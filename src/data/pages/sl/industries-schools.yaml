        description: 25–50 desk ali kajakov z mešano floto (vse vrste, za ture, mladinske velikosti)
      - title: Inštruktor flote
        description: 3–5 specializiranih plošč za inštruktorje z vgrajenimi nosilci za zvočni sistem
      - title: Varnostna postaja
        description: Centralizirana postaja za varnostno opremo s PFD-ji, radijskimi sprejemniki, prvo pomočjo in oznakami
      - title: Paket blagovne znamke
        description: Polno tiskanje logotipa na deske, vesla, PFD-je in uniforme
      - title: Program vzdrževanja
