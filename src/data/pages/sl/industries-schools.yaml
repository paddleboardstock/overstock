benefits:
  - title: Zasnovano za vsakodnevno poučevanje
    description: Deblejši PVC in okrepljene vodila prenesejo vsakodnevno uporabo s strani učencev, padec na pesek in skalnata pristajališča.
    icon: tabler:shield
  - title: Stabilne učne platforme
    description: Širši trupi in bolj ravni rockerji zagotavljajo samozavest začetnikom. Inštruktorji se lahko osredotočijo na poučevanje, ne na opremo.
    icon: tabler:scale
  - title: Enostavno shranjevanje in transport
    description: Napihljiva zasnova se shranjuje v majhnih prostorih. Izpuhane deske se prilegajo standardnim prtljažnikom za mobilno poučevanje.
    icon: tabler:box-seam
  - title: Prilagojena blagovna znamka
    description: Logotipi in barve šole na vsaki deski. Vaša blagovna znamka, vaša identiteta — ne generična oprema za najem.
    icon: tabler:brush
content_segments:
  tagline: Profili šole
  title: Rešitve za izobraževanje na področju vodnih športov<br />Po vrsti programa
  subtitle: Šole supanja, surf akademije, univerzitetni programi in operaterji franšiz se soočajo z različnimi operativnimi izzivi — od integracije kurikuluma do standardizacije flote na več lokacijah. Oprema se konfigurira tako, da ustreza izobraževalnemu modelu.
  items:
    - title: Neodvisne SUP in kajak šole
      subtitle: Usposabljalni centri v lasti lastnika
      description: Majhne do srednje velike šole, ki jih vodijo lastniki-inštruktorji in ponujajo SUP lekcije, trening kajaka in certificirane tečaje. Oprema mora biti dovolj vzdržljiva za vsakodnevno poučevanje, cenovno dostopna za proračun majhnega podjetja in dovolj vsestranska, da služi začetnikom do srednje zahtevnih učencev v eni floti.
      features:
        - Stabilne univerzalne SUP deske in rekreativni kajaki za začetniške lekcije
        - Deske za inštruktorje z dodatno stabilnostjo za poučevanje s vode
        - Vključeni predlogi učnih načrtov in vodiči za napredovanje veščin
        - Letni program obnove opreme z možnostjo zamenjave in popusti
    - title: Univerzitetni & kolidž programi rekreacije
      subtitle: Velike flote študentske rekreacije
      description: Univerzitetni oddelki za rekreacijo, ki upravljajo klube za veslanje, programe najema in učne tečaje kot del ponudbe kampusne rekreacije. Oprema je najbolj obremenjena med semestri, zahteva enostavne sisteme za prevzem in vračanje ter mora prenesti različne ravni spretnosti od začetnikov do naprednih veslačev.
      features:
        - Visoka odpornost PVC konstrukcije ocenjena za institucionalne uporabe
        - Flote s kodiranjem po barvi glede na raven veščin za enostavno upravljanje
        - Združljivo z RFID ali nalepkami za sledenje zalog
        - Nakup v večjih količinah z naročili in plačilnimi pogoji po semestrih
    - title: Šole surfanja & Surf akademije
      subtitle: Obalni programi surfanja
      description: Šole surfanja, ki učijo SUP surfanje, veslanje v ležečem položaju in surf kajak veščine v oceanu. Oprema mora vzdržati pogoje v surf coni — odpornost na udarce, tolerantnost proti pesku in slani ter enostavno izpiranje in vračanje med urnimi lekcijami.
      features:
        - Oblike, specifične za surf, z ojačanimi robovi in konstrukcijo odpornejšo proti udarcem
        - Možnosti mehkih plavuti in zvite vrvi za varnost študentov
        - Tkanina, ki se hitro spere in osuši med rotacijami lekcij
        - Program zamenjave flote z inšpekcijo in obnovo ob koncu sezone
    - title: Franšize & verige z več lokacijami
      subtitle: Standardizirana oprema med vsemi lokacijami
      description: Operaterji z več lokacijami, ki izvajajo standardizirane programe usposabljanja v več mestih ali regijah. Konsistentnost flote med lokacijami je ključna — vsak študent naj ima enako izkušnjo z opremo ne glede na to, katero lokacijo franšize obišče. Centralizirano naročanje, blagovna enotnost in podpora pri razširitvi so bistveni.
      features:
        - Enake specifikacije flote na vseh franšiznih lokacijah
        - Centralizirano združeno naročanje z količinskimi cenami
        - 'Možnosti skupne blagovne znamke: franšizna znamka + Paddle Board Overstock skupna blagovna znamka'
        - 'Komplet za vzpostavitev nove lokacije: oprema, signalizacija in začetni inventar'
