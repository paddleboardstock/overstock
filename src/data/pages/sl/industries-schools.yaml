        description: Enaka oprema na vseh lokacijah za dosledno izkušnjo učencev
      - title: Centralno naročanje
        description: Združeno naročanje, količinski popusti in centralizirano upravljanje rezervnih delov
      - title: Usposabljanje inštruktorjev
        description: Certifikat za rokovanje z opremo in vzdrževanje za vse inštruktorje
      - title: Skupno blagovno znamčenje
        description: Skupno blagovno znamčenje franšize + Paddle Board Overstock možnosti skupnega blagovnega znamčenja
      - title: Podpora pri širitvi
        description: Konsultacije glede širitve, napovedovanje opreme in postavitev novih lokacij
    cta_text: Razprava o franšiznem načrtu
