hero:
  tagline: Šole vodnih športov in centri za usposabljanje
  title: Oprema Rešitve<br />Za SUP in šole kajaka
  subtitle: Zanesljiva, komercialna oprema za šole veslanja, poučevanje surfanja, vadbo kajaka in izobraževalne programe za vodne športe na katerikoli ravni.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP table za šole in izobraževalne centre
direct_answer: Paddle Board Overstock dobavlja SUP in šole kajaka po vsem svetu s komercialnimi deskami, varnostno opremo in paketi za inštruktorje. Naša oprema je zasnovana za vsakodnevno poučevanje — debelejše PVC, ojačana drop-stitch jedra in stabilne zasnove trupa, ki začetnikom dajejo samozavest, inštruktorjem pa zanesljivost. Paketi vključujejo prilagojeno blagovno znamko, programe rezervnih delov in učne vire.
solution_offerings:
  - title: Šolski začetni paket
    subtitle: Za nove programe in majhne izobraževalne centre
    badge: Popular
    features:
      - title: Študentski odbori
        description: 10–25 splošnih SUP desk ali rekreativnih kajakov z stabilnimi platformami za začetniške tečaje
      - title: Odbori inštruktorjev
        description: Širše, daljše deske z dodatno stabilnostjo in nezdrsno EVA površino za trenerstvo
      - title: Varnostna oprema
        description: Rešilni jopiči, povodci, piščalke in vreče za metanje v ujemajočih se barvah
      - title: Shranjevanje in prevoz
        description: Zlagalne stojala za deske, oblazinjeni nosilci za kajake in transportna vozička
      - title: Podpora učnim načrtom
        description: Predloge lekcij, varnostni kontrolni seznami in vodiči za napredovanje veščin
    cta_text: Začni moj šolski paket
    cta_href: /contact
  - title: Šolski premijski paket
    subtitle: Za uveljavljene šole in operaterje z več programi
    badge: Best Value
    features:
