why_us:
  - title: Vertikalna integracija
    description: Lastimo tovarno, kalupe in dobavno verigo — brez posrednikov, brez podizvajalcev. To nam omogoča nadzor nad kakovostjo, stroški in dobavo.
  - title: Dvojna certifikacija
    description: ISO 9001 certifikat sistema vodenja kakovosti in BSCI certifikat družbene skladnosti. Poročila o reviziji tovarne so na voljo na zahtevo.
  - title: CE Skladnost
    description: Vsi standardni modeli imajo CE certifikat 2013/53/EU. Prilagojeni modeli se lahko CE certificirajo po našem uveljavljenem postopku.
  - title: Nizko MOQ
    description: Začnite s samo 5 enotami za standardne modele. Pomagamo rastočim blagovnim znamkam pri lansiranju brez prekomerne zaloge.
