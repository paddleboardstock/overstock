hero:
  tagline: OEM/ODM Proizvodnja
  title: OEM in proizvodnja pod lastno znamko
  subtitle: Od koncepta do kontejnerja — prilagodite vsak detajl svoje linije napihljivih plovil
intro: Paddle Board Overstock ponuja celovite OEM in ODM storitve za blagovne znamke, distributerje in vladne agencije po vsem svetu. Z 10+ leti izkušenj z izvozom in 12.000 m² ISO tovarne s certifikatoma 9001 & BSCI upravljamo vse od oblikovanja izdelka in razvoja kalupov do proizvodnje v velikem obsegu, pakiranja in logistike.
