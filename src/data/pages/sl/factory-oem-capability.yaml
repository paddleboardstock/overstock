services:
  - title: Oblikovanje izdelkov in inženiring
    description: Naša interna R&D ekipa dela z vašim konceptom ali specifikacijo za izdelavo CAD risb, 3D modelov in prototipov. Ponujamo oblikovanje kalupov, optimizacijo oblik trupov in nasvete pri izbiri materialov.
  - title: Prilagojeno blagovno znamčenje in grafika
    description: Barvno digitalno tiskanje, sitotisk, vtiskovanje in možnosti etiket. Razvijamo grafike palub specifične za blagovno znamko, oznake na cevovodih in embalažo pripravljeno za maloprodajo.
  - title: Prilagoditev materialov in specifikacij
    description: Izberite med PVC (standardni, okolju prijazni, negorljivi), Hypalon/CSM, drop-stitch in hibridnimi konstrukcijami. Prilagojene barve cevi, teže tkanin in možnosti ojačitev.
  - title: Pakiranje in logistika
    description: Prilagojena maloprodajna embalaža, škatle pod lastno znamko, vakuumsko pakiranje, paletiranje in natovarjanje kontejnerjev. FOB Qingdao, CIF ali DDP pogoji pošiljanja na voljo.
