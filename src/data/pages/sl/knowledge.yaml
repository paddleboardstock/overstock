hero:
  tagline: Graf znanja
  title: Znanje o raziskovanju vode
  subtitle: |
    Strukturirana zbirka znanja, ki pokriva tehnologijo napihljivih SUP,<br />
    varenost na vodi, inženirstvo čolnov in načrtovanje avantur.
  taglineSection: Raziščite. Učite se. Pojdite samozavestno.
clusters:
  tagline: Znanje grozdi
  title: Raziščite po temi
  subtitle: Poglobljeni vpogledi v tehnologijo, varnost in veščine za vsak Aquafarer izdelek.
  items:
    - title: SUP Znanje
      description: Od izbire vaše prve deske do naprednih tehnik turnih voženj — vse o deskanju na stoje.
      icon: tabler:lifebuoy
      topics:
        - Kako izbrati svojo prvo napihljivo SUP
        - Najboljša velikost SUP za začetnike
        - Kako težko je veslanje na deski?
        - Primerjava napihljive in trde deske
        - SUP kontrolni seznam varnosti
    - title: Znanje o Čolnih
      description: Tehnični vodiči za napihljive čolne, RIBs, čolničke in kajake — inženiring, materiali in delovanje.
      icon: tabler:sailboat
      topics:
        - Razlaga vrst napihljivih čolnov
        - PVC proti Hypalon primerjava
        - RIB proti Dinghy primerjava
        - Poglobljena analiza tehnologije
        - Priročnik za materialno znanost v marinah
    - title: Varnostno znanje
      description: Osnovno varnostno znanje za vsakega veslača — od izbire PFD do branja vremena in tehnik samopomoči.
      icon: tabler:shield
      topics:
        - SUP kontrolni seznam varnosti
        - Ali potrebujete reševalni jopič?
        - Varnostni vodnik za veslanje po oceanu
        - Varnost na reki za napihljive kajake
        - Zavedanje o vremenu in vodnih razmerah
    - title: Tehnologija
      description: Inženiring za proizvode Aquafarer — materiali, metode izdelave in preskušanje kakovosti.
      icon: tabler:microscope
      topics:
        - Tehnologija pomorske ravni PVC
        - Drop-stitch Core pojasnjeno
        - Zakaj PSI je pomembno za napihljive naprave SUPs
        - RF varjenje proti lepljivemu lepljenju
        - Testiranje kakovosti in certificiranje
    - title: Poslovno znanje
      description: Komercialni vodniki za gradnjo in širjenje vašega podjetja z vodnimi športi — od najema do blagovne znamke z lastno blagovno znamko.
      icon: tabler:briefcase
      topics:
        - Kako začeti SUP najemniško podjetje
        - Gradnja letovišča za vodne športe
        - Velikost flote paddleboardov za klube
        - Napihljivo proti trdo SUP za komercialno uporabo
        - Najboljši material za kajake za najem flot
        - Začetek zasebne blagovne znamke vode
        - Strategije prihodkov od vodnih športov v letoviščih
        - Vodnik za vzdrževanje komercialne opreme
