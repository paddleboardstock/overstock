hero:
  tagline: Certifikati in standardi
  title: Certifikati kakovosti<br />& standardi skladnosti
  subtitle: Aquafarer izdelki so proizvedeni v skladu z mednarodnimi standardi za varnost na morju, sistemi vodenja kakovosti in okoljskimi predpisi.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Aquafarer certifikati kakovosti in dokumentacija o skladnosti
content_certifications:
  tagline: Naše certifikati
  title: Certificirana kakovost,<br />Svetovno priznano
  subtitle: 64 modelov s certifikatom CE in certifikati za celotno tovarno dokazujejo našo zavezanost kakovosti, varnosti in okoljski odgovornosti.
  items:
    - title: CE Certificiran
      description: 64 CE-certificirani modeli izpolnjujejo evropske zahteve označevanja CE za rekreativne plovila, s čimer je zagotovljeno izpolnjevanje standardov varnosti, zdravja in varstva okolja.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Naš sistem upravljanja kakovosti je certificiran po ISO 9001:2015 in pokriva načrtovanje, proizvodnjo ter distribucijo napihljivih vodnih plovil in morske opreme.
      icon: tabler:clipboard-check
    - title: UKCA Označeno
      description: Izdelki, prodajani na trgu Združenega kraljestva, nosijo označbo UKCA, ki potrjuje skladnost z ukrepi Združenega kraljestva za pomorsko opremo in osebna vodna plovila.
      icon: tabler:shield
    - title: BSCI Skladen
      description: Aquafarer je revidiran po BSCI (Iniciativa za poslovno družbeno skladnost), kar dokazuje etične proizvodne prakse, poštene delovne pogoje in odgovornost v dobavni verigi.
      icon: tabler:heart-handshake
    - title: REACH Skladen
      description: Vsi materiali, uporabljeni v izdelkih Aquafarer, so v skladu z uredbami EU REACH o kemijski varnosti, kar zagotavlja, da v naših PVC, Hypalon ali komponentah ni prepovedanih snovi.
      icon: tabler:flask
    - title: Preizkušanje materialov
      description: Tkanine se preizkušajo glede natezne trdnosti, odpornosti proti trganju, UV razgradnje in delovanja pri hladnih razpokah. Vsaka proizvodna serija je vzorčena in preverjena.
      icon: tabler:test-pipe
content_factory:
  tagline: Tovarniški standardi
  title: Odličnost v proizvodnji<br />— Zgrajeno po specifikacijah
  subtitle: Naš objekt velik 12.000 m² deluje po strogo nadzorovanih protokolih kakovosti v vsakem proizvodnem koraku.
  list:
    - 'Inšpekcija vhodnega materiala: Vsi surovini — PVC tkanina, Hypalon, aluminij, vezane plošče, lepila — se testirajo glede na specifikacije pred vstopom v proizvodnjo.'
    - 'Nadzor kakovosti med procesom: Vsaka proizvodna faza ima dokumentirane kontrolne točke QC. Moč varov, poravnava šivov, namestitev ventilov in navor priključkov se preverjajo v procesu.'
    - 'Preskus tlaka: Vsaka napihljiva komora je preskušena s tlakom 1,25-kratnim nazivnim tlakom 24–48 ur. Hitrost puščanja mora biti znotraj sprejemljivih meja v skladu z ISO 6185.'
    - 'Končni pregled: Končni izdelki so pred pošiljanjem pregledani za dimenzijsko natančnost, estetsko obdelavo, popolnost dodatkov in integriteto pakiranja.'
    - 'Sledenje serij: Vsak izdelek ima serijsko številko, povezano z zapisi proizvodne serije, kar omogoča popolno sledljivost od surovine do končnih izdelkov.'
content_safety:
  tagline: Standardi za pomorsko varnost
  title: Varnost na prvem mestu<br />— Oblikovani za zanesljivo delovanje
  subtitle: Aquafarer izdelki so zasnovani in preizkušeni, da izpolnjujejo mednarodne standarde pomorske varnosti za komercialno in rekreativno uporabo.
  items:
    - title: ISO 6185
      description: Napihljivi čolni so v skladu s standardom ISO 6185 glede konstrukcije, stabilnosti, plovnosti in nosilnosti.
      icon: tabler:sailboat
    - title: ABYC standardi
      description: Električni sistemi in sistemi za gorivo sledijo ABYC (American Boat & Yacht Council) standardom za varno namestitev in delovanje.
      icon: tabler:bolt
    - title: SOLAS Skladnost
      description: Varnostna oprema in naprave za reševanje življenja izpolnjujejo zahteve SOLAS (Varstvo življenja na morju), kjer je to primerno.
      icon: tabler:lifebuoy
