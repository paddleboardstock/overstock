hero:
  tagline: Center za avtoriteto
  title: Zakaj Paddle Board Overstock?<br />Zaupanje, ki je raslo več kot desetletje
  subtitle: Vsaka čoln, ki ga izdelamo, nosi težo 10+ let pomorskega inženiringa, certificiranih sistemov kakovosti in tisoče uspešnih operacij po vsem svetu. Zaradi tega industrijski strokovnjaki izberejo Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock pomorska proizvodna enota in inženirska ekipa
