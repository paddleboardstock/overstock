features3_brand:
  tagline: Kdo smo
  title: Temelj blagovne znamke<br />in dediščina
  subtitle: Zgodba, strokovnost in globalni doseg, ki definirajo Paddle Board Overstock kot zaupanja vrednega proizvajalca pomorske opreme.
  isBeforeContent: false
  columns: 3
  items:
    - title: O Paddle Board Overstock
      description: Ustanovljeno leta 2012 v Qingdauu na Kitajskem. Od obalne delavnice do 12.000 m² objekta — celotna zgodba Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: Zgodba blagovne znamke
      description: Kako je ekipa pomorskih inženirjev začela omogočati profesionalno kakovost napihljivih plovil po vsem svetu.
      icon: tabler:book
      link: /brand-story
    - title: Strokovnost v pomorski industriji
      description: Globoka materialna znanost, natančna proizvodnja in testiranje v resničnem okolju — desetletja pomorskega inženiringa v vsakem trupu.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globalna prisotnost
      description: Služimo 50+ državah na vseh celinah. Regionalna strokovnost za lokalne regulativne zahteve in tržne preference.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Zakaj Paddle Board Overstock
      description: Kaj nas ločuje — kakovost, prilagoditev, neposredne tovarniške cene in celovita podpora za komercialne operaterje.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Naša ekipa
      description: Spoznajte vodstvo — pomorski inženirji, materialni znanstveniki in proizvodni strokovnjaki, ki poganjajo Paddle Board Overstock naprej.
      icon: tabler:users
      link: /brand/team
    - title: Inženirska ekipa
      description: 78+ skupnih let R&R, 40+ platform, 12 certificiranj, 1200+ OEM projektov. Tehnična ekipa za vsak izdelek.
      icon: tabler:engine
      link: /engineering-team
    - title: R&R Center
      description: Inženiring trupa, RF varjenje, PVC laboratorij, prototipiranje, testni rezervoar in laboratorij za kakovost — naš celoten raziskovalno-razvojni obrat.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Zaupanje in kakovost
  title: Certifikati, kakovost<br />in dokazila
  subtitle: Neodvisni certifikati, strog preskus in resnični dokazi, ki kažejo našo zavezanost kakovosti.
  isBeforeContent: false
  columns: 3
  items:
    - title: Certifikati
      description: CE, ISO 9001, UKCA, BSCI, REACH — popolna dokumentacija certifikata in skladnost za globalne trge.
      icon: tabler:shield-check
      link: /certifications
    - title: Kakovost in testiranje
      description: Vsak izdelek je pred odpremo preizkušen pod pritiskom. Trdnost šivov, odpornost UV, plovnost — preverjeno na vsaki stopnji.
      icon: tabler:clipboard-check
      link: /quality
    - title: Dokazi in dokazila
      description: Rezultati testov, fotografije uporabe, poročila tretjih oseb in študije primerov, ki potrjujejo kakovost Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Graf znanja
      description: Raziskujte graf entitet Paddle Board Overstock — izdelki, tehnologije, certifikati in povezave v povezani podatkovni bazi znanja.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Vodstvo
  title: Spoznajte ekipo<br />Za Paddle Board Overstock
  subtitle: Strokovno znanje v industriji, ki zajema morski inženiring, znanost o materialih, upravljanje kakovosti in globalno B2B trgovino.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — ustanovitelj in izvršni direktor
      description: 15+ let v morski proizvodnji. Prej vodil raziskave in razvoj pri velikem kitajskem proizvajalcu čolnov. Ima več patentov na področju oblikovanja napihljivih čolnov.
      icon: tabler:crown
    - title: Zhang Wei — glavni inženir
      description: 20+ let v PVC/Hypalon izdelavi in oblikovanju trupa z globokim V. Nekdanji tehnični direktor pri evropskem podjetju za morske inženiring.
      icon: tabler:engine
    - title: Chen Ming — vodja R&R
      description: Doktor znanosti o materialih. Specializiran za drop-stitch tehnologijo in visokofrekvenčno varjenje. 10+ let v tekstilnih kompozitih.
      icon: tabler:flask
    - title: Liu Qiang — direktor proizvodnje
      description: 18+ let v vitki proizvodnji. Six Sigma Black Belt. Uvedel sisteme kakovosti ISO 9001 na vseh proizvodnih linijah.
      icon: tabler:settings
    - title: Wang Fang — vodja kakovosti
      description: 12+ let v nadzoru kakovosti v pomorstvu. Certificirani CE in ISO revizor. Nadzoruje testiranje vsake proizvodne serije.
      icon: tabler:shield-check
    - title: Helen Lee — direktorica prodaje
      description: 15+ let v mednarodni B2B trgovini. Upravljala OEM/ODM partnerstva v 30+ državah. Poliglotka, tekoče govori 4 jezike.
      icon: tabler:briefcase
