hero:
  tagline: Oprema
  title: Proizvodna oprema in stroji
  subtitle: Industrijska oprema za rezanje, varjenje, tiskanje in montažo
  back_label: Nazaj v tovarno
  back_link: /factory
categories:
  - title: Rezanje in priprava materiala
    items:
      - name: Avtomatska PVC rezalna naprava
        spec: CNC-nadzorovano, 6,5 m × 2,5 m, natančnost 0,1 mm
        desc: Računalniško krmiljen avtomatski rezalni stroj za PVC, Hypalon in drop-stitch tkanine. Programska oprema za razporejanje optimizira izrabo materiala na manj kot 5 % odpadkov.
      - name: Razporednik tkanin
        spec: Maksimalna širina 3 m, napetostno nadzorovano hranjenje
        desc: Polaga tkanino v enem ali več slojih z nadzorovano napetostjo, da prepreči distorzijo pred rezanjem.
  - title: Varjenje in lepljenje cevi
    items:
      - name: Naprava za toplotno tesnjenje
        spec: Toplo-zračno varjenje, nastavljivo 200–600 °C, 0,5–5 m/min
        desc: Toplo-zračni stroj za varjenje in lepljenje šivov PVC in Hypalon cevi. Uporablja se za pritrditev, tesnjenje in spajanje komor cevi ter plavajočih spojev.
      - name: Dielektrični RF stiskalnik
        spec: 15 kW, delovna plošča 2000 × 600 mm
        desc: Radiofrekvenčni stiskalnik za glavni vzdolžni šiv, spoje med prečnikom in cevjo ter izdelavo velikih komor.
      - name: CNC-nadzorovan RF varilec
        spec: 8 kW, XY miza 2500 × 1200 mm
        desc: Programabilno varjenje ukrivljenih šivov za kompleksne geometrije, vtiskovanje logotipov in natančno obdelavo obližev.
  - title: RIB proizvodnja trupa
    items:
      - name: Kalupi za ročno polaganje steklenih vlaken
        spec: Več modelov za RIB trupe do dolžine 6 m
        desc: Tradicionalno ročno polaganje kompozitov iz steklenih vlaken z uporabo poliester in vinil-ester smol. Vsak sloj je ročno valjan in vakuumsko pakiran za enotno kakovost in trdnost laminata.
      - name: Kabina za nanos gelcoata
        spec: Temperatura nadzorovana, filtrirana ventilacija zraka
        desc: Nanos gelcoata za RIB trupe. Zagotavlja visokosijajni, UV-odporen zaključek z natančno kontrolo debeline.
      - name: CNC rezkalni stroj (5-osni)
        spec: 3 m × 2 m × 1 m delovni obseg, vreteno vodeno z vodo
        desc: Obdelava vstavkov v trupu, kalupov konzol, podnožij sedežev in prilagojenih nosilcev.
  - title: SUP Tiskanje in dekoracija
    items:
      - name: Digitalni tiskalnik
        spec: Visokoločljivostni brizgalni šejt, do 2 m širine tiska
        desc: Neposredno tiskanje na tkanino za SUP barvno grafiko na palubi. Tiska po meri vzorce, prelive in slike fotografije z UVvodo odpornimi črnili.
      - name: Sitotiskarski stroj
        spec: Ročna in polavtomatska, večbarvna registracija
        desc: Sitotisk za SUP logotipe na kartonu, znamke in ponavljajoče se vzorce. Omogoča trpežne, neprosojne tiskane odtise z živahno nasičenostjo barv.
  - title: Sestavljanje in napeljevanje
    items:
      - name: Motorni dvigalo
        spec: Nosilnost 500 kg, nastavljiva razpiralna palica
        desc: Varna namestitev zunanjih motorjev od 2,5 do 60 KM.
      - name: Konzolni model okvirja
        spec: Nastavljiva višina in kot
        desc: Prednastavitev krmiljenja, plina in instrumentnih plošč pred namestitvijo.
      - name: Hidravlični krmilnik za cevi
        spec: Do 1" ID, digitalni merilnik tlaka
        desc: Hidravlične cevi za krmiljenje po meri z zamaknjenimi priključki.
      - name: Električna vezna plošča
        spec: 3 m × 1,5 m, vnaprej natisnjene sheme ožičenja
        desc: Sestavljanje in testiranje celotnih električnih snopov izven ladje.
  - title: Testiranje in nadzor kakovosti
    items:
      - name: Univerzalni natezni tester
        spec: 50 kN, / ASTM D751
        desc: Testiranje sile lomljenja, raztezanja ob prelomu in širjenja trganja pri serijah tkanin.
      - name: Testna naprava za zadrževanje zraka
        spec: Programabilno, 30-minutno zadrževanje pritiska
        desc: Avtomatiziran test zadrževanja tlaka za vsako komoro cevi pred sestavljanjem.
      - name: Preizkuševalec luščenja šivov
        spec: Motorizirano 180° luščenje pri 100 mm/min
        desc: Testiranje trdnosti zvarov in lepjenih šivov po ISO 6185.
      - name: Komora za staranje s ksenonskim lokom
        spec: 2000 ur izpostavljenosti
        desc: Testiranje odpornosti UV za spremembe barve in ohranitev trdnosti.
