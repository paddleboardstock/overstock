faq:
  title: OEM/ODM — Pogosto zastavljena vprašanja
  questions:
    - q: Kakšna je minimalna količina naročila (MOQ) za po meri napihljive SUPs?
      a: Za standardne modele z obstoječimi kalupi se začne MOQ pri 5–10 enotah na dizajn. Za popolnoma prilagojene kalupe in orodja MOQ je običajno 200+ enot. Sodelujemo s startupi in novimi blagovnimi znamkami, da najdemo izvedljive vstopne točke.
    - q: Kako dolgo OEM traja postopek vzorčenja?
      a: Standardni prototipni vzorci so dokončani v 7–14 delovnih dneh po odobritvi zasnove. Naročila na hitro lahko razdelijo na 5–7 dni za dodatno pristojbino.
    - q: Kakšna je razlika med in PVC Hypalon za napihljive čolne?
      a: PVC je lažja, cenovno ugodnejša in nudi odlično prilagodljivost v hladnem vremenu.Hypalon (CSM) nudi UV vrhunsko odpornost proti ozonu ter daljšo življenjsko dobo (10–15 let v primerjavi s 5–8 leti). Priporočamo PVC za večino rekreacijskih aplikacij in Hypalon za komercialno/profesionalno uporabo.
    - q: Ali lahko prilagodite obliko in dizajn napihljivke?
      a: Da. Naša raziskovalna in razvojna ekipa lahko razvije po meri izdelane kalupe za katerokoli obliko trupa, obris deske ali konfiguracijo cevi. Uporabljamo CNCobdelane aluminijaste kalupe za natančnost in doslednost.
    - q: Ali nudite storitve revizije tovarn?
      a: Pozdravljamo inšpekcijske preglede tovarn na kraju samem in s strani tretjih oseb v našem 12.000 m² velikem objektu v Qingdaou. Vzdržujemo ISO 9001 in BSCI certifikate ter lahko delimo revizijska poročila o NDA.
    - q: Kakšne pogoje pošiljanja ponujate?
      a: Ponujamo FOB Qingdao (standard CIFDDP ) in pogoje pošiljanja. V vseh naročilih so vključeni tudi natovarjanje kontejnerjev in popolna izvozna dokumentacija OEM .
content_profiles:
  tagline: Profili blagovnih znamk
  title: / OEM Proizvodnja z lastno blagovno znamko<br />Po vrsti stranke
  subtitle: Različni profili blagovnih znamk prinašajo posebne zahteve — naše storitve prilagajamo OEMODM vašemu poslovnemu modelu, obsegu in strategiji vstopa na trg.
  items:
    - title: Zagonske blagovne znamke vodnih plovil
      subtitle: MOQNizko, hitro zagon
      description: Podjetniki in ustanovitelji, ki lansirajo svojo prvo linijo SUPs, kajakov ali napihljivih čolnov. Potrebujete proizvodnega partnerja, ki vašo blagovno znamko obravnava kot svojo — z nizkimi začetnimi pragovi, fleksibilnimi velikostmi serij in praktičnimi oblikovnimi navodili na vsakem koraku.
      features:
        - MOQ tako nizko kot 50–100 enot na SKU, ne tisoče
        - Obstoječa knjižnica kalupov, da se izognete stroškom orodij
        - 'Celoten paket blagovne znamke: logotip, tubusne grafike, embalaža, obešene oznake'
        - Potek dela z vzorcem najprej — odobrite pred proizvodnjo
    - title: Uveljavljene pomorske blagovne znamke
      subtitle: OEM skaliranje z CE/ISO skladnostjo
      description: Obstoječe blagovne znamke čolnov, oklopnih plovil ali morskih dodatkov dodajajo napihljiva plovila v svoj portfelj. Potrebujete dosledno kakovost pri vseh proizvodnih serijah, skladnost z regulativami za globalne trge in možnost so-inženiringa prilagojenih trupov ali oblik cevi.
      features:
        - Prilagojeno 3D inženirstvo kalupov za lastniške zasnove
        - CE 2013/53/EU, UKCAUSCG , dokumentacija o skladnosti
        - BSCI Poročila socialnih revizij za skladnost trgovcev
        - Namensko upravljanje računov + prednostne proizvodne kapacitete
    - title: DTC & E-trgovina Blagovne znamke
      subtitle: Embalaža pripravljena za maloprodajo v velikem obsegu
      description: Blagovne znamke, ki prodajajo predvsem preko Amazon, Shopify ali lastnih spletnih trgovin. Embalaža, doživetje razpakiranja in dosledna kakovost enot so ključni. Potrebujete tovarno, ki razume dinamiko hitrosti prodaje in stopnje vračil v e-trgovini.
      features:
        - Oblikovanje škatel pripravljeno za maloprodajo + tiskanje kartic za vstavljanje
        - Vakuumsko pakiranje / paletiranje za stroškovno učinkovito pošiljanje
        - EAN / UPC črtna koda in dokumentacija pripravljena za carino
        - Konsolidacija mešanih zabojnikov za optimizacijo končne cene
    - title: Življenjski slog in blagovne znamke na prostem
      subtitle: Oblikovanje bele etikete + razširitev kategorije
      description: Oblačila, oprema za na prostem ali potovalne blagovne znamke, ki vstopajo v kategorijo vodnih športov pod lastno etiketo. Morda nimate strokovnega znanja o morskih inženiringu v hiši — zato potrebujete partnerja, ki vas lahko vodi od koncepta do kontejnerja z minimalnimi težavami.
      features:
        - Raziskava trendov in vizualne table konceptov
        - Skupne omejene izdaje in sezonske barvne kombinacije
        - Cikel od oblikovanja do vzorca v 10–14 delovnih dneh
        - 'Celovita logistika: tovarna → skladišče → potrošnik'
