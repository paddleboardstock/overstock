process_steps:
  title: 6-stopenjski OEM/ODM postopek
  subtitle: Od oblikovalskega povzetka do FOB Qingdao — poenostavljena delovna procedura
  steps:
    - number: '01'
      title: Oblikovalski povzetek in 3D CAD modeliranje
      description: Delite svoje ciljne specifikacije, referenčni izdelek ali koncept. Naša inženirska ekipa razvije podrobne CAD risbe in 3D upodobitve za vašo odobritev.
      timeline: 3–5 dni
    - number: '02'
      title: Izbira materiala & testiranje tkanin
      description: Izberite med vojaško kakovostjo PVC (0,9–1,2 mm), Hypalon CSM ali drop-stitch osnovnimi tkaninami. Izvedemo teste natezne trdnosti, oprijema prevleke in stabilnosti UV.
      timeline: 2–3 dni
    - number: '03'
      title: Hitra izdelava prototipov & proizvodnja vzorcev
      description: CNC-strojimo po meri kalupe in proizvedemo predprodukcijske vzorce z vašimi barvami blagovne znamke, logotipom in določenimi materiali. Vzorci se pošljejo za vašo odobritev.
      timeline: 7–14 dni
    - number: '04'
      title: 24–48-urna preizkušnja vzdrževanja visokega tlaka
      description: Vsak prototip gre skozi stroge teste zadrževanja tlaka pri 1,25x nazivnega tlaka. Izvedeni so testi luščenja šivov in preverjanje dimenzij.
      timeline: 1–2 dni
    - number: '05'
      title: CE/ISO Inšpekcija kakovosti in pakiranje
      description: 100-točkovni kontrolni seznam kakovosti. Vsaka enota je pregledana pred embalažo, pripravljeno za maloprodajo. Vključena CE izjava o skladnosti in BSCI poročilo o skladnosti.
      timeline: 2–3 dni
    - number: '06'
      title: FOB Qingdao pošiljanje in logistika
      description: Končni izdelki so paletirani, oviti v streč folijo in naloženi v kontejner v pristanišču Qingdao. Vsa izvozna dokumentacija, carinjenje in sledenje v realnem času.
      timeline: 7–14 dni
