content_challenge:
  tagline: Izziv
  title: Zahteve akvakulture<br />Oprema odporna na slano vodo
  subtitle: Ribogojnice, farme biserov in morski reje delujejo v najbolj kemično agresivnem morskemu okolju — dolgotrajna izpostavljenost slani vodi, ostanki goriva in hrane ter neprekinjena vsakodnevna uporaba.
  paragraphs:
    - Akvakulturne operacije potekajo 365 dni v letu na izpostavljenih obalnih in odprtomorskih območjih. Delovne ladje, uporabljene za pregled kletk, prevoz hrane, vzdrževanje vrst biserov in servisiranje opreme, so stalno izpostavljene slani vodi, UV izpostavljenosti in kemičnemu stiku z gorivi, ribjo hrano in sredstvi proti biofoulingu.
    - '**Korozija je glavni sovražnik** — standardna morska oprema se v teh pogojih hitro poškoduje. Zunanji motorji, okvirji prikolic in okrasni elementi trupa potrebujejo stalno zamenjavo. Operaterji potrebujejo čolne, izdelane iz materialov odpornih proti koroziji, ki lahko preživijo leta v tem okolju brez poslabšanja.'
    - '**Dnevna zanesljivost je ključna** — pokvarjen delovni čoln pomeni zamujene urnike hranjenja, zamujene žetve in drage izgube v proizvodnji. Za farme biserov lahko en dan zamujenega pregleda pomeni znatno škodo pridelka. V ribogojnicah zamujeno hranjenje vpliva na stopnje rasti in donosnost.'
    - Aquafarer akvakultura RIBs so zasnovane z odpornimi proti koroziji elementi, močnimi Hypalon cevmi in ojačanimi trupovi, posebej zasnovanimi za zahtevne pogoje pridelave rib, gojenja biserov in morskega reje.
content_solution:
  tagline: Naša rešitev
  title: Po meri izdelano RIBs<br />Za industrijo akvakulture
  subtitle: Vsaka Aquafarer delovna ladja za akvakulturo je zasnovana tako, da prenese agresivno slanovodno okolje in hkrati zagotavlja zanesljivo vsakodnevno delovanje.
  list:
    - Cevovje pomorskega standarda — vrhunska odpornost proti UV, slani vodi, gorivom in kemikalijam ribje hrane
    - 316 nerjaveče jeklo po celotni ladji — brez rje ob dolgotrajni izpostavljenosti slani vodi
    - Ojačane zaščite trupa in kobilice za ponavljajoče se stike z dokom in kletkami
    - Samocedilna paluba za enostavno čiščenje in odtok po prevozu hrane in žetvi
    - Konfiguracija ravne palube za prenašanje vreč za krmo, zabojnikov za žetek in opreme
    - Zunanje konfiguracije od 15 HP do 60 HP — optimizirane za uporabnost v primerjavi z varčnostjo goriva
    - Barvne cevi z visoko vidnostjo omogočajo enostavno opazovanje na velikih kmetijskih površinah
content_segments:
  tagline: Profili akvakulture
  title: Workboat Solutions<br />Po vrsti akvakulture
  subtitle: Različni akvakulturni obrati imajo različne zahteve delovnih čolnov — od majhnih agilnih RIBs za pregled ribjih kletk do stabilnih transportnih platform za gojenje biserov in težkih delovnih čolnov za morsko živinorejo.
  items:
    - title: Ribogojstvo
      subtitle: Pregled kletke, prevoz krme, podpora žetvi
      description: Morske ribogojnice upravljajo kletke na izpostavljenih obalnih in obalnih območjih. Delovni čolni se vsakodnevno uporabljajo za pregled mrež v kletkah, hranjenje, podporo pri ulovu in vzdrževanje opreme. Glavni izziv je korozija — čolni so nenehno izpostavljeni slani vodi, ostankom krme in gorivu. Zanesljiv delovni čoln je nujen, saj zamujeno hranjenje ali zamujeni ulov neposredno vpliva na proizvodnjo in dobičkonosnost.
      features:
        - 'Paket za agresivno okolje: 316 nerjavečih jeklenih elementov, komponente iz morskih zlitin'
        - Razporeditev ravne palube za prevoz vreč za krmo in zabojnikov za žetek
        - Samoizčrpavajoča paluba za enostavno pranje po operacijah
        - Hypalon cevi s kemično odpornim premazom za izpostavljenost krmi in gorivu
        - Ojačane drgne trake za pogost stik kletke in pomola
    - title: Obratovanje za pridelavo biserov
      subtitle: Stabilni transport za pregled in obiranje biserne vrvi
      description: Biserne farme zahtevajo stabilne, zanesljive delovne čolne za vsakodnevni prevoz med bisernimi linijami, pregled mrež za ostrige in nabiranje ulova. Te operacije potekajo na oddaljenih obalnih območjih z omejeno vzdrževalno infrastrukturo. Čoln mora biti dovolj stabilen, da lahko posadka dela z njega med pregledom bisernih vrvic, z enostavnim vkrcavanjem in dovolj prostora na krovu za prevoz ubranih ostrig, mrež in zalog. Zanesljivost in enostavno vzdrževanje sta ključna na oddaljenih kmetijskih lokacijah.
      features:
        - Stabilna zasnova trupa za stoječo posadko med pregledom biserne vrvi
        - Ravna paluba z nedrsečo površino za varno gibanje posadke
        - Nizek nadvod za enostaven dostop do mrež za ostrige in nabiranje
        - Preprosta zunanja konfiguracija za enostavno vzdrževanje na kraju samem
        - Proti koroziji odporna cev in strojni paket za neprekinjeno izpostavljenost slani vodi
    - title: Oceansko rejstvo in izboljšave morja
      subtitle: Prevoz mladoletnikov, vzdrževanje kletk, podpora spremljanju
      description: Oceanske rejne dejavnosti vključujejo spuščanje mladostnikov v upravljana morska okolja, spremljanje rasti in vzdrževanje izboljšavnih struktur. Delovni čolni morajo prevažati živo mladostno živino v prezračenih kontejnerjih, prevažati nadzorno opremo in dostopati do plitvih obalnih izpustnih mest. Oblikovanje trupa mora uravnotežiti nosilnost s plitvim ugrezom za dostop do plaže in estuarij.
      features:
        - Prostor na palubi za prezračene kontejnerje za prevoz mladoletnikov in opremo za spremljanje
        - Plitek ugrez za dostop do območij izpusta plaže in estuarija
        - Enostavno pristajanje na plaži — ojačana zaščita kobilice in premca
        - Pritrdilne točke opreme za spremljanje elektronike in vzorčne opreme
        - Robe Hypalon za težke razmere za vzdržljivost v pogojih mešanega peska in morske vode
