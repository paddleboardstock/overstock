features3_what_we_build:
  title: Kar gradimo
  subtitle: Osredotočena linija izdelkov, ki jo poznamo do potankosti — brez nedokončanih poskusov, brez preobleke blagovne znamke.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB čolni
      description: Aluminijasto trup RIBs od 3,3 m do 7,5 m. Namenjeno za patruljiranje, potapljanje, ribolov in družinsko uporabo.
      icon: tabler:ship
    - title: Napihljivi čolni
      description: PVC in Hypalon napihljive čolne od 2,4 m do 4,2 m. Lahki, trpežni in enostavni za shranjevanje.
      icon: tabler:speedboat
    - title: Tenderski čolni za superjahte
      description: Kompakten, visoko zmogljiv RIBs, po meri izdelan, da se ujema z videzom vaše matične ladje.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Dodatki
      description: Vesla, črpalke, pokrovi, suhi torbice, rezervoarji za gorivo in elektronika. Vse usklajeno z našimi čolni.
      icon: tabler:package
    - title: Prenova in popravilo
      description: Notranja zamenjava cevi, prenova elektronike in nadgradnje motorja.
      icon: tabler:tool
    - title: Prilagojene izdelave
      description: Oblikovanje po posameznem projektu za komercialne, znanstvene in vojaške stranke.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Razprava o oblikovanju in inženirstvu čolnov
steps2_values:
  title: Naše vrednote
  subtitle: Tri načela, ki so oblikovala vsak izdelek od prvega dne.
  items:
    - title: Zgrajeno, kot da nosi vašo družino
      description: Vsako trup, var in pritrdilni element obravnavamo, kot da bi ga uporabljale naše lastne družine.
      icon: tabler:heart
    - title: Inženir, preden prodamo
      description: Če je specifikacija napačna, spremenimo specifikacijo — nikoli kupca.
      icon: tabler:settings
    - title: Podpora, ki presega garancijo
      description: Dvajset let stari trupovi nas še vedno kličejo za nadomestne dele, in mi še vedno odgovorimo.
      icon: tabler:headset
steps2_milestones:
  title: Mejniki
  subtitle: Kratka različica zgodbe Aquafarer.
  isReversed: true
  items:
    - title: Ustanovljeno v obalni delavnici
      description: Začeli sta ga dva pomorska arhitekta z CNC mlinom in trmo idejo.
      icon: tabler:building-factory
    - title: Prvih 1.000 trupov dostavljenih
      description: Doseženo v našem sedmem letu, večinoma preko ustnega priporočila in ponovnih strank.
      icon: tabler:circle-check
    - title: Mednarodni izvozni program
      description: Zdaj pošiljamo v 50+ držav s partnerji za lokalno podporo na petih celinah.
      icon: tabler:world
    - title: Nova globalna operativna struktura
      description: Septembra 2026 so se operacije blagovne znamke preselile iz skupine Qingdao Vatrad v Aquafarer LLC (New Mexico, ZDA); proizvodni center v Qingdau še naprej izvaja raziskave in razvoj, proizvodnjo ter neposredni izvoz iz tovarne.
      icon: tabler:building-skyscraper
features2_locations:
  title: Naše lokacije
  tagline: Najdite nas
  columns: 3
  items:
    - title: Sedež in delavnica
      description: Obalni industrijski park, stavba 4 — odprto od ponedeljka do petka za obiske po dogovoru.
    - title: EU storitveni center
      description: Sredozemsko pristanišče — prenova, popravilo in podporna garancija za evropske stranke.
    - title: APAC partnerska mreža
      description: Pooblaščeni servisni partnerji v Avstraliji, na Japonskem, v Singapurju in Hongkongu.
brand_hub_tagline: Blagovna znamka
brand_hub_title: Raziščite našo znamko
brand_hub_subtitle: Poglobite se v naše znanje o pomorskem inženiringu, globalno prisotnost in načela, ki nas vodijo.
brand_hub_cards:
  - title: Morska strokovnost
    desc: Desetletja materialne znanosti, natančne proizvodnje in testiranja v resničnem svetu — od PVC/Hypalon izdelave do oblikovanja trupa z globokim V in drop-stitch tehnologije.
    link: /brand-marine-expertise
    link_label: Izvedite več →
  - title: Globalna prisotnost
    desc: Pošiljanje v 50+ držav iz našega obrata v Qingdau s pooblaščenimi partnerji za servis po vsej Evropi, regiji Azija-Pacifik in Ameriki.
    link: /brand-global-presence
    link_label: Izvedite več →
  - title: Zakaj Aquafarer
    desc: Vertikalna integracija, dvojna certifikacija (ISO 9001 + BSCI), CE skladnost in nizki MOQs — zasnovano za blagovne znamke, distributerje in vladne agencije.
    link: /brand-why-aquafarer
    link_label: Izvedite več →
production_section:
  tagline: Odličnost proizvodnje
  title: Zagotavljanje izjemne izdelave
  description: Aquafarer proizvodna linija je namenjena proizvodnji visokokakovostnih, trpežnih in visokozmogljivih izdelkov iz napihljivih čolnov.
  cards:
    - title: Izkušena tehniška ekipa
      items:
        - Strokovno znanje o PVC, Hypalon in morskih materialih
        - Natančna izdelava pri rezanju, lepljenju in montaži dodatkov
        - Neprekinjeno usposabljanje za obvladovanje najnovejših proizvodnih tehnologij
    - title: Napredna proizvodna oprema
      items:
        - CNC rezalna oprema za natančno rezanje tkanin z minimalnimi napakami
        - Visoko natančno toplotno/hladno lepljenje za nepropustne, trpežne šive
        - Strokovna oprema za preverjanje neprepustnosti in natezne trdnosti
    - title: Zrel sistem upravljanja
      items:
        - Standardizirani proizvodni procesi s jasnimi standardi kakovosti
        - Filozofija vitke proizvodnje za zmanjšanje odpadkov in izboljšanje učinkovitosti
        - Učinkovito upravljanje dobavne verige z zanesljivimi dobaviteljskimi partnerji
    - title: Stroga kontrola kakovosti
      items:
        - certificiran sistem upravljanja kakovosti
        - 'Večstopenjski pregled: surovine, v procesu, končni izhod'
        - Stroga preskusna preverjanja neprepustnosti in vzdržljivosti pred pošiljanjem
global_ops_section:
  tagline: Globalna operativna arhitektura
  title_html: Ena blagovna znamka,<span class="text-white/90">dva središča</span>
  description_html: Od septembra 2026 Aquafarer upravlja<strong class="text-white">Aquafarer LLC</strong>(New Mexico, ZDA) — globalna enota za distribucijo, komercialno B2B prodajo, pogodbe, izstavitev računov in poprodajne storitve. R&R, proizvodnja in kontrola kakovosti ostajajo na<strong class="text-white">Aquafarer proizvodnem središču Qingdao</strong>, ki pošilja vsako naročilo neposredno iz tovarne, FOB Qingdao. Prehod je spremenil, kdo podpiše vašo pogodbo — ne kdo gradi vaš čoln.
  stats:
    - value: 2,400+
      label: Trupi dostavljeni po svetu
    - value: 50+
      label: Izvožene države
    - value: 10+
      label: Leta proizvodnje
