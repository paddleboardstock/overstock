hero:
  tagline: O nas
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer tovarna in delavnica
  title: |
    Pomorsko inženirstvo<br />
    zgradil<span class="text-accent dark:text-white">Aquafarer</span>pot
  subtitle: 'Začeli smo v obalni delavnici z enim čolnom in trdovratnim prepričanjem: morski izdelki naj bodo zasnovani tako, kot da so pomembni, ker dejansko so. Danes pošiljamo v več kot 50 držav, a vsak trup še vedno gre skozi iste roke, ki so začele podjetje.'
stats:
  title: Po številkah
