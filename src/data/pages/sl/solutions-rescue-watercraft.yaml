content_challenge:
  tagline: Izziv
  title: Zahteve reševalnih operacij<br />Nepogrešljiva zanesljivost
  subtitle: Organizacije za iskanje in reševanje delujejo pod izjemno odgovornostjo za varnost — vsak okvarjen čoln prinaša nesprejemljive posledice.
  paragraphs:
    - Pri reševalnih operacijah se razlika med uspehom in neuspehom meri v minutah. Čoln mora biti pripravljen za takojšen izhod, delovati v neugodnih pogojih in varno vrniti potnike. Odgovornost za varnost je absolutna — mehanska okvara med reševalno misijo ni strošek popravila, temveč izgubljeno življenje.
    - SAR čolni potrebujejo visoko hitrost, da hitro dosežejo žrtve, skupaj z izjemno stabilnostjo za varno reševanje. Morajo imeti reševalno opremo, medicinske pripomočke in komunikacijsko opremo — pogosto na omejenem prostoru na krovu. Čolni, ki delujejo v državnih službah, potrebujejo tudi dolgo življenjsko dobo (10-15+ let), da upravičijo javne nabavne proračune.
    - Vidnost, tako za upravljavca kot za iskanje, je ključna. Oblikovanje konzole mora omogočiti 360-stopinjsko vidljivost, čoln pa mora biti visoko viden za letala in druga plovila.
    - Paddle Board Overstock reševalni RIBs so zasnovani od kobilice navzgor za te zahteve — s samozbiranimi krovi, ojačanimi trupi, navigacijskimi kompleti in vlečnimi stebri kot standard pri patruljnih modelih.
content_solution:
  tagline: Naša rešitev
  title: Posebno zasnovani reševalni RIBs
  subtitle: Vsak Paddle Board Overstock reševalni čoln je zasnovan, da izpolnjuje ali presega SOLAS in nacionalne SAR standarde.
  list:
    - Samozbiralni krov — voda se samodejno odvaja za stabilnost med reševalnimi operacijami
    - Ojačan trup v obliki globokega V — sposobnost delovanja v grobih vodah s predvidljivim upravljanjem pri visoki hitrosti
    - Celoten komplet navigacijskih luči — delovanje podnevi in ponoči v vseh vremenskih razmerah
    - Vlečni steber in vlečna vrv — pripravljen za vleko plovil ali operacije z reševalnimi sanmi
    - Plošče za montažo opreme — radijski sprejemnik, iskalna svetilka, sirena in medicinska oprema
    - Več konfiguracij motorja — en sam zunanji motor ali dvojna redundanca motorjev
    - tube barve z visoko vidnostjo — oranžna, rumena ali rdeča za največjo vidnost
content_segments:
  tagline: Reševalni profili
  title: Reševalne rešitve za vodna plovila<br />Po vrsti organizacije
  subtitle: Različne reševalne organizacije delujejo pod različnimi mandati, proračunskimi cikli in operativnim okoljem — od obmorskih prostovoljskih posadk do nacionalnih flotov obalnih straž. Vsako reševalno RIB konfiguriramo tako, da ustreza profilu misije.
  items:
    - title: Obalna straža in vladne SAR agencije
      subtitle: Absolutna odgovornost za varnost — standardi flote, kritični za poslanstvo
      description: Vladne SAR agencije nosijo najvišjo odgovornost za varnost pri morskih operacijah. Vsako plovilo mora delovati brezhibno v ekstremnih pogojih — odpoved opreme med reševalno misijo ni sprejemljiva. Odločitve o nabavi temeljijo na celotnih stroških lastništva v obdobju 10–15 let delovne dobe, ne na začetni ceni. Agencije potrebujejo plovila, ki preživijo leta obalnega patruljiranja, izpolnjujejo stroge nacionalne standarde in zagotavljajo dosledno zmogljivost v razpršenih postajah. Celovita dokumentacija o skladnosti in večletne servisne pogodbe so obvezne.
      features:
        - SOLAS in dokumentacijski paket skladnosti z nacionalnimi SAR standardi
        - Enotnost delov v floti — zmanjšanje kompleksnosti zalog na nivoju postaje
        - Dvojna konfiguracija motorja za kritično redundanco
        - Oblikovanje za 10–15 let delovne dobe z načrtovanim vzdrževanjem
        - Vse vremenske sposobnosti — ojačano trup globokega V za zahtevno morsko stanje
    - title: Reševalne službe reševalcev na plaži
      subtitle: Hitro lansiranje, plovbe v plitvih vodah
      description: Občinske in plažne reševalne službe, ki potrebujejo plovila za hitro posredovanje, ki lahko izplujejo skozi valovne cone, delujejo v plitvih priobalnih vodah in v nekaj minutah dosežejo plavalce ali plovila v stiski. Oprema mora biti dovolj lahka, da jo lahko vleče majhno vozilo ali ročno premika po plaži.
      features:
        - Plitvotrawirani RIB trup za delovanje v valovni coni in priobalju
        - Možnost lansiranja z plaže z ročajem na krmi in zaščito kobilice
        - Integrirana reševalna sani ali platforma za reševalca-plavalca
        - Standardne barve tube z visoko vidnostjo, oranžna ali rumena
    - title: Gasilci na morju
      subtitle: Integracija gasilnega črpalnega sistema, montaža opreme, hitro posredovanje
      description: Pomorske gasilske enote se odzivajo na požare na obalnih objektih, požare plovil in vodne reševalne intervencije. Ta plovila morajo prevažati gasilske črpalke, monitorje, shranjevanje cevi in dihalne aparate — vse integrirano v stabilno, hitro odzivno platformo. Enote uporabljajo ta plovila tudi za poplavne intervencije in operacije medsebojne pomoči. Postavitve konzol morajo omogočiti nadzor črpalk, radijske sisteme in nujno razsvetljavo, brez zmanjšanja prostora na krovu za gibanje posadke.
      features:
        - Monitor za gašenje na krmi s paketom integracije črpalke
        - Posebna montaža opreme za gasilni črpalni sistem, shranjevanje cevi in kompleti BA
        - Postavitev konzole nastavljiva za nadzor črpalk, radio in nujno razsvetljavo
        - Samopraznilni krov za odvod vode pri gašenju in stabilnost
        - 'Paket za nočne operacije: reflektor, osvetlitev prizorišča, modro/rdeča luč'
    - title: Pomorska policija in pristaniška varnost
      subtitle: Prestrezanje, patruljiranje, vkrcanje
      description: Pomorske enote za izvrševanje zakonov potrebujejo plovila, sposobna hitrega zasledovanja, vkrcanja na osumljena plovila in patruljiranja za varnost pristanišč. Te ladje morajo imeti varno shranjevanje za opremo in orožje za izvrševanje, komunikacijsko integracijo s kopenskim poveljstvom ter dovolj prostora na palubi za operacije ekip za vkrcanje. Sposobnost nočnih operacij in nizki pristop sta bistvena za misije preprečevanja.
      features:
        - Sposobnost zasledovanja pri visokih hitrostih — plantažni trup z+ največjo hitrostjo 40 vozlov
        - Varni predali za orožje in opremo za izvrševanje
        - Integracija konzol za policijski radio, MDT in komunikacijske sisteme
        - 'Paket za nočne operacije: IR reflektor, FLIR nosilec, prikrita razsvetljava'
        - Ojačana deska za vkrcanje z nedrsečo površino
        - Modro/rdeč sistem za nujno razsvetljavo in sireno
    - title: Prostovoljne SAR in neprofitne organizacije
      subtitle: S financiranjem, skupnostno osnovane obalne in jezerske operacije
      description: Reševalne skupine, ki temeljijo na skupnosti, delujejo v jezerih, rekah in obalnih območjih, kjer je vladna pokritost SAR omejena. Pogosto financirane z donacijami ali državnimi subvencijami, te organizacije potrebujejo največjo zmogljivost na dolar — zanesljivo, nizko vzdrževanje plovilo, ki ga prostovoljci lahko varno upravljajo z minimalnim namenskim usposabljanjem. Cikli pridobivanja donacij pomenijo, da morajo čolni izpolnjevati zahteve skladnosti ob fiksnih proračunih.
      features:
        - Konfiguracija z enim izvenkrmnim motorjem, optimizirana za nižje stroške nabave in obratovanja
        - PVC Gradnja za manj vzdrževanja in lažje terensko popravilo
        - Večfunkcijska konzola, ki zmanjšuje elektronsko kompleksnost za prostovoljne operaterje
        - Paket dokumentacije o skladnosti z nepovratnimi sredstvi za vloge za financiranje
        - Lahka zasnova za izstrelitev na plažo brez namenske prikolice ali žerjava
    - title: Reševanje ob poplavah in odziv na nesreče
      subtitle: Notranje poplave, plitva voda, okolja polna odpadkov
      description: Reševanje ob poplavah je poseben operativni profil — čolni delujejo v poplavljenih urbanih območjih, tokovih polnih ostankov in izjemno plitvih vodah, kjer so potopljene ovire nevidne. Operaterji potrebujejo plovila, ki lahko plujejo po poplavljenih ulicah, prebijajo ruševine in izvlečejo žrtve iz stavb in vozil. Sposobnost plitvega ugreza je ključna, prav tako sposobnost delovanja v toku ob nevarnostih zapletov. Te čolne pogosto uporabljajo gasilci, civilna zaščita in nevladne organizacije za pomoč ob nesrečah.
      features:
        - Zelo plitek trup — deluje v 30-50 cm vode
        - Premec, ki odbija ostanke, in ojačana cevna zaščita pred potopljenimi ovirami
        - Samozasipna ploščad za odtekanje poplavne vode in reševanje žrtev
        - Visoko vidne oranžne ali rumene cevi za zračno izvidniško vidnost
        - Lahka zasnova za helikopterski prevoz in cestno uporabo
        - Ojačane dvigovalne točke za reševanje z dvigali in vrvjo
