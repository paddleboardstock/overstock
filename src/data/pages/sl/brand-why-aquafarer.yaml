features3_reasons:
  tagline: Zakaj izbrati Aquafarer
  title: Sedem razlogov, da postanete naš partner
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Prava proizvodnja, ne trgovina
      description: Lastimo in upravljamo tovarno velikosti 12.000 m². Ko sodelujete s Aquafarer, delate neposredno z ljudmi, ki načrtujejo, konstruirajo in izdelujejo vaše izdelke — brez posrednikov.
      icon: tabler:building-factory
    - title: 2. Pristop, ki ga vodi inženirstvo
      description: Naš proces oblikovanja se začenja z uporabo primera, ne z vrsto izdelka. Optimiziramo obliko trupa, izbiro materiala in konfiguracijo glede na to, kako bo čoln dejansko uporabljen.
      icon: tabler:engine
    - title: 3. Certificirana kakovost
      description: CE certificiran, ISO sistem kakovosti, BSCI skladen, REACH skladen, USCG odobren. Naši 64 modeli, certificirani po CE, izpolnjujejo mednarodne standarde — ne le trditve.
      icon: tabler:certificate
    - title: 4. Fleksibilen OEM/ODM
      description: Barve tub, postavitev konzole, blagovna znamka, embalaža — prilagodimo po vaših specifikacijah. Brez pritiska minimalnega naročila. Začnite s prototipom, razširite s samozavestjo.
      icon: tabler:adjustments
    - title: 5. Globalna logistika
      description: Ameriško skladišče v Kaliforniji, neposredna pošiljka iz Qingdao, zračna dostava za nujna naročila. Za vas uredimo carinske papirje in dokumentacijo.
      icon: tabler:truck-delivery
    - title: 6. Podpora za vse življenje
      description: Podpiramo čolne, ki smo jih zgradili pred 20 leti. Pravi nadomestni deli, tehnični nasveti, navodila za popravilo — naša ekipa je na voljo, ko nas potrebujete.
      icon: tabler:lifebuoy
    - title: 7. Poštene specifikacije
      description: Prave ocene obremenitve, prave dimenzije, prava teža. Brez marketinške napihnjenosti. Kar objavimo, je tisto, kar dobite — preverjeno z neodvisnimi preizkusi.
      icon: tabler:ruler-measure
testimonials:
  tagline: Zaupajo jim blagovne znamke po vsem svetu
  title: Kaj pravijo naši partnerji
  items:
    - content: Sodelovali smo z več proizvajalci na Kitajskem, vendar Aquafarer izstopa zaradi njihove tehnične podpore in dosledne kakovosti. Naš blagovni znamko obravnavajo kot svojo lastno.
      name: — OEM Partner, evropska blagovna znamka vodnih športov
    - content: Njihovi Hypalon RIBs so že več kot 5 let v uporabi v našem flotilnem parku. Minimalno vzdrževanje, odličen UV odpor. 5-letna garancija na tube nam daje zaupanje.
      name: — Operater flote, skupina resortov na Bližnjem vzhodu
    - content: Ekipa Aquafarer nam je pomagala razviti prilagojeno SUP desko od koncepta do proizvodnje v 90 dneh. Kakovost je presegla naša pričakovanja.
      name: — Distributer, avstralski vodni športi
