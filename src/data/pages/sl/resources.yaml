hero_text:
  tagline: Viri
  title: Prenosni center in vodiči za kupce
  subtitle: Dostop do katalogov izdelkov, OEM vodičev, kontrolnih seznamov za kupce in tehnične dokumentacije, ki vam pomagajo sprejemati informirane odločitve o nabavi.
features3_downloads:
  tagline: Prenosi
  title: Dokumentacija izdelkov<br />in viri za kupce
  isBeforeContent: false
  columns: 2
  items:
    - title: Marine Product Catalog 2026
      description: Celoten izbor izdelkov, vključno z RIB čolni, napihljivimi čolni, SUP deskami, kajaki in dodatki. Specifikacije, konfiguracije in možnosti. Format PDF.
      icon: tabler:file-text
    - title: OEM Vodič za proizvodnjo
      description: 'Vse, kar morate vedeti o OEM/ODM partnerstvih: pregled postopka, minimalne količine naročila, možnosti prilagajanja, nadzor kakovosti in pošiljanje.'
      icon: tabler:building-factory
    - title: RIB Vodič za kupce čolnov
      description: 'Kako izbrati pravi RIB: materiali trupa, materiali cevi, izbira motorja, razmislek o velikosti in možnosti konfiguracije za različne uporabe.'
      icon: tabler:file-description
    - title: SUP Kontrolni seznam dobavitelja
      description: 'Ključni premisleki pri izbiri proizvajalca SUP desk: kazalniki kakovosti, zahteve po certifikatu, MOQ premisleki in na kaj paziti med revizijo tovarne.'
      icon: tabler:clipboard-check
    - title: Vodič po materialih napihljivih čolnov
      description: 'PVC proti Hypalon: primerjava vzdržljivosti, odpornosti na UV, življenjske dobe, možnosti popravil in stroškov za različne pomorske uporabe.'
      icon: tabler:files
    - title: Predloga za prilagojeno proizvodnjo
      description: Prenesite našo predlogo produktnega opisa. Izpolnite svoje zahteve in nam jo vrnite za ponudbo in oceno izvedljivosti v istem tednu.
      icon: tabler:template
faqs:
  title: Pogosta vprašanja
  subtitle: Pogosta vprašanja o naših izdelkih, proizvodnem procesu in modelu partnerstva.
  columns: 2
  items:
    - title: Kakšna je minimalna količina naročila?
      description: MOQ se razlikuje glede na kategorijo izdelka. RIB čolni običajno začnejo od 10 enot na model. SUP deske od 50 enot. Za konkretne informacije o MOQ se obrnite na naš prodajni tim.
      icon: tabler:help-circle
    - title: Ali lahko dobim vzorce pred oddajo naročila?
      description: Da. Paddle Board Overstock omogoča izdelavo vzorcev za oceno pred množično proizvodnjo. Stroški vzorcev so predmet dogovora in se pogosto priznajo kot kredit pri prvem naročilu proizvodnje.
      icon: tabler:package
    - title: Katere pogoje plačila ponujate?
      description: Standardni pogoji so 30 % pologa ob naročilu, 70 % pred pošiljko. LC pogoji so na voljo za upravičene stranke. Obrnite se na naš finančni tim za dogovor.
      icon: tabler:currency-dollar
    - title: Koliko časa traja proizvodnja?
      description: 'Tipični roki: RIB čolni 30-45 dni, SUP deske 20-30 dni, napihljivi čolni 25-35 dni. Prilagojena izdelava doda 15-30 dni za izdelavo prototipa.'
      icon: tabler:calendar-clock
    - title: Katere certifikate imajo vaši izdelki?
      description: CE certifikat za trge EU, proizvodnja odobrena s strani US Coast Guard, ISO sistem kakovosti, BSCI skladnost in REACH skladnost materialov.
      icon: tabler:certificate
    - title: Ali ponujate prilagojeno embalažo in blagovno znamko?
      description: Da. Nudimo prilagojeno embalažo z vašim logotipom, barvami in identiteto blagovne znamke. MOQ za prilagojeno embalažo je odvisen od kategorije izdelka.
      icon: tabler:color-swatch
cta:
  title: Potrebujete pomoč pri iskanju pravega vira?
  subtitle: Kontaktirajte našo ekipo za osebno svetovanje pri izbiri izdelkov, OEM partnerstvih ali tehničnih specifikacijah.
  actions:
    - variant: primary
      text: Kontaktirajte našo ekipo
      href: /contact
