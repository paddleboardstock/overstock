hero:
  tagline: Vodniki
  title: Novi v SUP?
  subtitle: Praktični vodniki, ki vam pomagajo izbrati, uporabljati in uživati v napihljivih vodnih športnih pripomočkih.
size_guide:
  tagline: Velikost in specifikacije
  title: Najdite pravo velikost glede na vaše potrebe
  desc: Primerjajte dimenzije izdelkov, nosilnost in priporočeno uporabo. Ne glede na to, ali potrebujete touring SUP, kompakten kajak ali komercialni RIB — naš vodič po velikostih vam pomaga izbrati pravilen izbor.
  link_label: Celoten vodič po velikostih z specifikacijami izdelkov →
  link: /size-guide
  cards:
    - title: SUP Deske
      desc: Izberite dolžino glede na vašo težo in predvideno uporabo. Širše deske (32"+) nudijo večjo stabilnost. Daljše deske (11–12 ft) bolje sledijo pri turizmu.
    - title: Kajaki
      desc: Samostojni kajaki (9 ft) za solo potovanja in reke. Tandem kajaki (12 ft) za dva veslača ali enega z opremo. Vedno preverite nosilnost.
    - title: Čolni in RIBs
      desc: Izberite dolžino glede na število potnikov in uporabo. Večji RIBs (4,5 m +) za odprto morje in reševanje. Manjši čolni (2,7 m) kot pomožni čolni in ribiške platforme.
