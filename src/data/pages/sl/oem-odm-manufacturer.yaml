breadcrumb: OEM/ODM Proizvajalec
tldr:
  summary: Aquafarer je proizvajalec OEM/ODM neposredno iz tovarne. 12.000 m² ISO 9001:2015 objekt, 15.000 enot letne proizvodnje, CE/BSCI/REACH/UKCA skladnost, nizka MOQs od 2-10 enot.
  points:
    - 12.000 m² ISO 9001:2015 certificirani objekt v Qingdau
    - 15.000 enot letne zmogljivosti s 200-300 usposobljenimi delavci
    - CE skladnost 2013/53/EU, UKCA, BSCI, REACH
    - 'Nizka MOQs: 2-5 enot (RIB), 5-10 enot (SUP) za standardne modele'
    - 50+ izvozne države z FOB Qingdao pošiljanjem
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015 certificirano
      desc: SGS-revidiran sistem vodenja kakovosti na vseh proizvodnih linijah.
      variant: cert
    - icon: ⭐
      title: CE & UKCA skladno
      desc: Popolna skladnost z zahtevami EU 2013/53/EU in britanskimi označevalnimi zahtevami.
      variant: cert
    - icon: ⭐
      title: BSCI Socialni pregled
      desc: Preverjene etične delovne prakse in standardi delovnega mesta.
      variant: standard
    - icon: ⭐
      title: Nizka MOQ od 2 enot
      desc: 'Standardni RIB modeli od 2-5 enot, SUP od 5-10 enot. Prilagojena kalupa: 200+.'
      variant: standard
process_section:
  eyebrow: Naš postopek
  title: Končni OEM/ODM delovni tok
  subtitle: Od oblikovalskega povzetka do nalaganja kontejnerja — šest korakov do vaše privatne oznake napihljivih vodnih plovil.
  steps:
    - step: '01'
      title: Specifikacija in oblikovalski povzetek
      desc: Delite vaše ciljne specifikacije, CAD risbe ali referenčni izdelek. Naša inženirska ekipa pregleda materiale, dimenzije in zahteve skladnosti (CE, BSCI) pred oddajo ponudbe.
    - step: '02'
      title: 3D prototipiranje kalupov
      desc: Oblikujemo in CNC-strojimo prilagojene kalupe za SUP deske, trupove kajakov in RIB komponente. Prototipni vzorci izdelani v 15–20 delovnih dneh za vašo odobritev.
    - step: '03'
      title: Izbira materiala in proizvodnja vzorcev
      desc: Izberite med vojaško kakovostnimi PVC (0,9 mm–1,2 mm), Hypalon CSM ali drop-stitch osnovnimi tkaninami. Izdelamo predprodukcijske vzorce z vašimi barvami blagovne znamke, logotipom in embalažo za odobritev.
    - step: '04'
      title: CE Revidiranje tovarne in skladnost
      desc: Vsako OEM naročilo vključuje dokumentacijo o skladnosti — CE izjava o skladnosti, ISO 9001 sledljivost, BSCI socialno poročilo o skladnosti in REACH deklaracije materialov.
    - step: '05'
      title: Serijska proizvodnja in vmesna kontrola kakovosti
      desc: Proizvodni obroki sledijo naši kontrolni listi z 100 točkami kakovosti. Vsaka enota je podvržena 24-urnemu testiranju zadrževanja tlaka, testiranju luščenja šivov in vizualnemu pregledu pred pakiranjem.
    - step: '06'
      title: FOB Qingdao logistika in pošiljanje
      desc: Končni izdelki so paletizirani, zaščiteni s folijo in naloženi v kontejner v pristanišču Qingdao. Zagotovimo vso izvozno dokumentacijo, carinsko razjasnitev in spremljanje pošiljke v realnem času.
capabilities_section:
  eyebrow: Proizvodne zmogljivosti
  title: Kaj gradimo
  subtitle: Šest ključnih proizvodnih zmogljivosti za B2B globalne partnerje.
  items:
    - title: Drop-Stitch SUP Proizvodnja plošč
      desc: Laminacija jedra po celotni dolžini drop-stitch za toge, visokotlačne (15–20PSI) stoječe veslaške deske. Prilagojena dolžina, širina, debelina, profil rockerja in grafična zasnova.
    - title: PVC Proizvodnja napihljivih čolnov
      desc: Visokofrekvenčni varjeni PVC čolni, tenderji in športni čolni. Večkomorne konfiguracije, talne možnosti (letve, zračna paluba, zvitki) in integracija dodatkov.
    - title: Hypalon RIB Izdelava čolnov
      desc: Hypalon CSM Komercialne cevi, pritrjene na steklena ali aluminijasta globoka V trupa. Dolžine 3,3 m do 6,0 m za patruljne, reševalne, turnejske in potapljaške operacije.
    - title: Lastna blagovna znamka in lastna blagovna znamka
      desc: 'Popolna storitev zasebne blagovne znamke: toplotni prenos ali sitotisk z logotipom po meri, embalaža z blagovno znamko (škatle, prenosne torbe), uporabniški priročniki v vašem jeziku ter črtna koda/UPCregistracija.'
    - title: Oblikovanje kalupov in orodij po meri
      desc: Notranja 3D CAD/CAM inženirska ekipa. Oblikujemo in izdelujemo po meri izdelane aluminijaste in kompozitne kalupe za edinstvene oblike trupa, konfiguracije palube in točke za pritrditev dodatkov.
    - title: OEM Dodatki in oprema
      desc: Rešilni jopiči (CE12402), dvojne črpalke, karbonske/najlonske lopatice, kompleti za popravila, torbice za prenašanje in sklopi povodca. Popolna oprema in paketna embalaža za prodajno predstavitev.
experience_section:
  eyebrow: Izkušnje v resničnem svetu
  title: Partnerstva, ki so gradila blagovne znamke
  subtitle: Resnične zgodbe blagovnih znamk in organizacij, ki so sodelovale Aquafarer na področju OEMODM / proizvodnje.
  stories:
    - quote: Prišli Aquafarer smo k sebi s skico na prtičku in seznamom zahtev. Osem mesecev kasneje smo imeli izdelek, pripravljen za proizvodnjo, ki je že v CE prvem poskusu prestal certifikat.
      narrative: Evropski startup z SUP inovativno zasnovo, ki je pristopil Aquafarer za ODM proizvodnjo. Aquafarer Ekipa za raziskave in razvoj je koncept popeljala skozi CAD načrtovanje, strukturno analizo FEA, hidrodinamično simulacijo, izdelavo kalupov, izdelavo prototipov in proizvodno orodje. Ustanovitelj startupa je med procesom trikrat obiskal Qingdao. Končni izdelek je prestal CE certifikacijo brez kakršnihkoli sprememb — kar ustanovitelj pripisuje temu, da Aquafarerje inženirska ekipa od začetka razumela evropske regulativne zahteve.
      context: SUP Evropska predstavitev blagovne znamke, 2023–2024
      source: Brand Founder
    - quote: Raven NDA zaščite in varnosti intelektualne lastnine Aquafarer nam daje zaupanje, da delimo naše lastniške zasnove. Naši intelektualni lastnini obravnavajo, kot da bi bila njihova lastna.
      narrative: Ameriško podjetje za pomorsko opremo z lastniško tehnologijo ventilov je potrebovalo proizvodnega partnerja, ki bi lahko zaščitil njihovo intelektualno lastnino med obsežno proizvodnjo. Po reviziji petih kitajskih proizvajalcev so izbrali Aquafarer na podlagi tovarniških protokolov za zaščito intelektualne lastnine, varnega ravnanja z oblikovalskimi datotekami in pripravljenosti na podpis strogih NDA-jev. Partnerstvo je v štirih letih proizvedlo tri linije izdelkov brez nobenih incidentov intelektualne lastnine.
      context: Ameriško podjetje za pomorsko opremo, OEM partnerstvo od leta 2021
      source: Podpredsednik operacij
