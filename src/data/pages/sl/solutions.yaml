features3_solutions:
  tagline: Rešitve
  title: Vaša vodna pustolovščina<br />Poslovni partner
  isBeforeContent: false
  columns: 3
  items:
    - title: Klubi vodnih športov
      description: Celoviti paketi opreme, prilagojena blagovna znamka in programi vzdrževanja za SUP klube, kajak klube, šole deskanja in vadbene centre.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vodna športna RIBs
      description: Namensko zasnovani RIBs za šole jadranja, centre vodnih športov in organizacije dogodkov. Trenerski čolni, vlečni čolni in čolni za varovanje za profesionalne vodne športe.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Letovišča in hoteli
      description: Premijski programi vodnih športov z opremo flote, varnostnimi sistemi, usposabljanjem osebja in upravljanjem prihodkov za gostinske objekte.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Podjetniki z vodnimi znamkami
      description: Proizvodnja lastne blagovne znamke OEM/ODM z nizkimi MOQs, prilagojenim oblikovanjem izdelkov, pakiranjem in globalnim pošiljanjem za nove lastnike znamk.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Čolni za potapljaške centre
      description: Stabilne platforme RIB z enostavnim vstopom/izstopom, shranjevanjem opreme in konfiguracijami motorjev, optimiziranimi za potapljaške operacije.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Reševalni in nujni vodni plovila
      description: Hitri RIBs in napihljivi čolni, zasnovani za iskanje in reševanje, nujno posredovanje in obalno stražo.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Rešitve za tenderje jahte
      description: Kompaktni, elegantni RIB tenderji, ki dopolnjujejo superjahte in rekreativne plovila. Enostavno shranjevanje, močne zmogljivosti.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Ribiške čolne
      description: Stabilni, trpežni napihljivi čolni in RIBs konfigurirani za komercialno in rekreativno ribištvo.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Oprema za pomorski turizem
      description: Inflatable čolni, SUP deske in kajaki, pripravljeni za floto, za letovišča, turistične operaterje in podjetja za izposojo vodnih športov.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Oddaljena energija RIBs
      description: Težka RIBs za podporo na naftnih in plinskih platformah, prevoz posadk v vetrnih elektrarnah, inšpektiranje podmorskih kablov ter pomorsko gradbeništvo.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Delo v akvakulturi
      description: Korozijsko odporna RIBs za ribištvo, pridelavo biserov in oceanarstvo. Hypalon cevi, oprema iz nerjavečega jekla, vzdržljivost za vsakodnevno uporabo.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Pomorsko raziskovanje in meritve
      description: Stabilna, instrumentom pripravljena RIBs za oceanografske raziskave, spremljanje okolja, vzorčenje kakovosti vode in pedagoške programe na univerzah.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Komercialni delovni čolni
      description: Težka RIBs za patruljiranje, merjenje, transport in logistiko na morju. Zgrajeni za zahtevne pogoje komercialnega poslovanja.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Niste prepričani, katera pot ustreza vašemu podjetju?
