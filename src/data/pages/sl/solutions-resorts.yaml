testimonial:
  content: Paddle Board Overstock je zasnoval in opremil celoten program beach aktivnosti na treh objektih letovišč. 80 SUPs, 40 kajakov, varnostna infrastruktura in usposabljanje osebja — vse dostavljeno v eni pošiljki. Udeležba gostov pri vodnih aktivnostih se je v prvi sezoni povečala za 60 %.
  name: Sophie Laurent
  title: Direktorica izkušenj gostov, Azure Bay Resorts — Phuket, Tajska
content_segments:
  tagline: Profili letovišč
  title: Rešitve gostoljubja ob obali<br />Po tipu objekta
  subtitle: Vsako letovišče ima edinstven profil gostov, kombinacijo aktivnosti in operativni ritem — od ekskluzivnih eko-lodž do velikih luksuznih letovišč ob plaži. Oblikujemo programe vodnih športov, ki ustrezajo razredu objekta in pričakovanjem gostov.
  items:
    - title: Luksuzna letovišča ob plaži
      subtitle: VIP prevozi, vodne aktivnosti, premium izkušnja gostov
      description: Visoke luksuzne obalne nepremičnine — Four Seasons, Aman in podobne luksuzne skupine — kjer so vodni športi glavna gostinska storitev, ki dviguje ocene zadovoljstva in dodatne prihodke. Flota mora izgledati premium, nuditi raznolikost za različne starostne skupine in stopnje sposobnosti ter se brezhibno integrirati z obstoječimi storitvami concierge in rezervacijskimi sistemi letovišča. Pričakovanja glede videza gostov so izjemno visoka — stanje in predstavitev opreme neposredno vpliva na 5-zvezdične ocene.
      features:
        - 'Premium blagovna znamka flote: SUPs, kajaki, pedalini in manjši čolni RIB'
        - 'Predstavitev pripravljena za goste: usklajene barve letovišča, logotip, postavljena oprema'
        - Mali luksuzni RIB za VIP prevoze gostov z naročeniško oblazinjenje in ujemajoče se barve
        - 'Integrirana varnostna infrastruktura: plavajoče varovalne vrvi, postaje rešiteljev, AED'
        - 'Upravljanje prihodkov: predloge za dinamično določanje cen, usposabljanje za dodatno prodajo, paketi'
    - title: Letovišča na zasebnih otokih
      subtitle: Prevoz gostov v vseh vremenskih razmerah — brez izpadov, popolna zanesljivost
      description: Zasebna otoška letovišča delujejo na odročnih lokacijah, kjer je čoln edina povezava s celino. Dnevni prevozi gostov, oskrbovalni prevozi in nujne medicinske evakuacije so odvisni od enega plovila — vsak izpad neposredno vpliva na izkušnjo gostov in delovanje letovišča. Ti upravljavci potrebujejo čoln, ki zanesljivo deluje v vseh vremenskih razmerah, zahteva minimalno vzdrževanje in ima rezervne sisteme za kritično zanesljivost. Čoln mora prav tako odlično delovati, ko gostje prispejo na otok.
      features:
        - Konfiguracija za vse vremenske razmere RIB s popolnim ohišjem in cevmi za težke razmere
        - Zagotavljanje dvomotornih ali rezervnih motorjev za delovanje brez izpadov
        - Hypalon Komercialna gradnja z življenjsko dobo 5–8 let v oddaljeni uporabi
        - Enostavna zasnova za vzdrževanje z dostopnimi komponentami za vzdrževanje na kraju samem
        - Lastna blagovna znamka letovišča in vrhunska oblazinjenja, ki se ujemata z otoško estetiko
    - title: Jezerska in ekološka letovišča
      subtitle: Izkušnje gostov, ki so povezane z naravo
      description: Objekti ob jezeru, eko-koče in naravni oddihi ponujajo mirne, nizko vplivne vodne aktivnosti, ki dopolnjujejo naravno okolje. Oprema naj bo tam, kjer je mogoče, nemotorna, enostavna za shranjevanje v čolnarnah z omejenim prostorom in tiha v uporabi, da ohrani ambientalno izkušnjo za vse goste.
      features:
        - 'Nemotorizirana flota: SUPs, kajaka, kanuje in pedalnih čolnov'
        - Tihe električne črpalke za napihovanje za uporabo na zahtevo gostov
        - Okolju prijazni materiali in embalaža so usklajeni s trajnostno blagovno znamko
        - Vključeni so bili skladiščni regali in sistemi organizacije čolnarne
    - title: Plažni klubi
      subtitle: Prevozi gostov, zabava, majhen luksuz RIBs
      description: Plažni klubi delujejo v energičnem, vizualno osredotočenem okolju, kjer je oprema del vzdušja. Potrebujejo majhen luksuz RIBs za prevoze gostov iz bližnjih hotelov ali pristanišč ter vodne igrače za zabavo gostov — vleko vodnih skuterjev, napihljive tobogane in veslaške deske. Flota mora izgledati elegantno, biti enostavna za upravljanje in prenesti vsakodnevno uporabo gostov z različnimi stopnjami znanja. Shranjevanje in hitra namestitev sta ključna v času največje konice.
      features:
        - Kompaktna luksuzna RIB (3,3-4,3 m) za prevoze gostov in storitev s tenderji
        - 'Vodne igrače: vlečne napihljivke, SUP deske, kajaki za zabavo gostov'
        - Prilagojena barva in blagovna znamka, ki se ujemata z vizualno identiteto beach cluba
        - Sistemi za hitro zagonitev in pridobivanje za operacije z veliko prometom
        - Hypalon Vzdržljiva konstrukcija za vsakodnevno izpostavljenost slani vodi in UV
    - title: Zasebni članski klubi in jadralni klubi
      subtitle: Prevoz v pristanišču, članski tenderji, ekskluzivni vodni športi
      description: Zasebni klubi, kjer so vodni športi in prevoz čolnov korist za člane, ne pa vir prihodkov. Oprema mora izpolnjevati višje estetske standarde, biti na voljo članom na zahtevo in zahtevati minimalen nadzor osebja. Marinski jadralni klubi posebej potrebujejo tenderje za prevoz v pristanišču — premikanje članov med pomolom, privezom in obalo. Shranjevanje in vzdrževanje naj bosta članom nevidna.
      features:
        - RIB Vrhunski tenderji za prevoz v pristanišču in prevoz članov
        - 'Premium oprema: EVA palube, unikatne barve članov, blagovno oblazinjenje'
        - Samopostrežni sistem za dostop članov brez osebja
        - Izven sezone shranjevanje in letni program osvežitve
    - title: Hoteli, osredotočeni na pustolovščine in aktivnosti
      subtitle: Vodeni ogledi, SUP joga, izleti s potapljanjem z masko, skupinske aktivnosti
      description: Nepremičnine, ki se pozicionirajo kot destinacije za avanturo — ponujajo vodene oglede, SUP jogo, vožnjo ob sončnem zahodu, izlete s potapljanjem z masko in skupinske aktivnosti. Flota mora podpirati tako modele prostega najema kot vodene programe, z opremo, ki se brezhibno preklaplja med uporabo gostov samih in izletom pod vodstvom inštruktorja. Te nepremičnine potrebujejo robustno opremo za visoko frekventno uporabo, z enostavnim čiščenjem med skupinami gostov.
      features:
        - Vsestranka mešana flota, ki podpira modele najema in + vodenih izletov
        - Dvodnevni kajaki in ekstra stabilne SUP platforme za skupinske aktivnosti
        - 'Oprema za vodiča: inštruktorjevi deski, suhi zaboji, vodoodporna komunikacija'
        - 'Sezonska rotacija opreme: poletna flota → zimski skladiščni program'
        - Trpežna konstrukcija ocenjena za vsakodnevno uporabo gostov z minimalnim vzdrževanjem
