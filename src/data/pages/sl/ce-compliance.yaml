content_scope:
  tagline: Obseg skladnosti
  title: Kateri izdelki potrebujejo<br />RCD Skladnost?
  subtitle: Direktiva o rekreacijskih plovilih 2013/53/EU se uporablja za rekreativna plovila z dolžino trupa med 2,5 m in 24 m. Razumevanje obsega je prvi korak k skladnosti.
  items:
    - title: RIB Čolni (2,5–24 m)
      description: Trdno napihljivi čolni z dolžino trupa od 2,5 m do 24 m spadajo pod RCD. Kategorije oblikovanja A do D se uporabljajo glede na predvidene morski pogoje in največjo silo vetra.
      icon: tabler:sailboat
    - title: Napihljivi čolni (pod 2,5 m)
      description: Mali napihljivi čolni in čolnički pod 2,5 m so lahko delno izvzeti iz RCD, vendar še vedno zahtevajo CE označevanje po drugih ustreznih direktivah in standardih gradnje EN ISO 6185.
      icon: tabler:sailboat
    - title: SUP Deske in dodatki
      description: Deske za stoječe veslanje niso zajete v RCD obsegu. Vendar pa zahtevajo pripadajoče osebne plavalne naprave (PFD) CE označevanje po Uredbi o Osebni Opremljenosti (EU) 2016/425 s USCG odobritvijo Tip III/V, kjer je to primerno.
      icon: tabler:swimming
    - title: Delno dokončani čolni
      description: Čolni, dostavljeni brez motorja ali posebnih instalacij, zahtevajo Izjavo graditelja za delno dokončano plovilo, pri čemer polna RCD skladnost pripada končnemu graditelju ali uvozniku.
      icon: tabler:tool
content_trust_layers:
  tagline: Sistem zaupanja s tremi plastmi
  title: Informacije o skladnosti<br />— Deljeno na pravi ravni
  subtitle: Vsi podatki o skladnosti ne sodijo na javno spletno stran. Uporabljamo pristop s tremi plastmi, ki ščiti intelektualno lastnino in hkrati gradi zaupanje kupcev.
  items:
    - title: Plast 1 — Javna spletna stran
      description: Navedeni standardi, pojasnjene poti usklajenosti, navedene vrste dokumentov, obseg certificiranja po družinah modelov. Brez dejanskih certifikatov, testnih podatkov ali lastniških inženirskih podrobnosti.
      icon: tabler:world
    - title: Plast 2 — Deljenje po povpraševanju
      description: 'Po kvalificiranem poizvedovanju: prikazan vzorec DoC, fotografija graditeljske ploščice, seznam veljavnih standardov, kontrolni seznam skladnosti in povzetki certifikatov materialov — deljeno pod pogoji poštene uporabe.'
      icon: tabler:mail
    - title: Plast 3 — NDA / Faza naročila
      description: Celotna tehnična dokumentacija, ocene tveganja, izračuni stabilnosti, testni izvidi, zapisi o serijah materiala in dokumentacija o sledljivosti proizvodnje — deljeno le pod NDA s potrjenimi kupci.
      icon: tabler:lock
content_standards:
  tagline: Uveljavljivi standardi
  title: ISO & EN standardi<br />Gradimo, da
  subtitle: Naši izdelki so zasnovani in testirani v skladu s harmoniziranimi standardi po RCD. Navedene so številke in imena standardov; celotna besedila standardov ostajajo zaščitena z avtorskimi pravicami ISO.
  items:
    - title: EN ISO 6185-3
      description: 'Napihljivi čolni — Del 3: Čolni z največjo močjo motorja 15 kW ali več. Zahteve glede konstrukcije, stabilnosti, plovnosti in reševanja osebe, ki je padla v vodo, za RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Napihljivi čolni — Del 4: Čolni z največjo motorno močjo 15 kW in večjo ali enako 4,5 kW. Dodatne zahteve glede konstrukcije in stabilnosti.'
      icon: tabler:file-text
    - title: ISO Serija 12215
      description: Majhni plovila — Konstrukcija trupa in mere. Strukturna zasnova trupa, krovov in pregrad za steklena in aluminijasta plovila RIB.
      icon: tabler:ruler-2
    - title: SL ISO 10240
      description: Mala plovila — Navodila za lastnika. Zahtevana vsebina in oblika navodil za lastnika, ki spremljajo vsak RIB čoln, dostavljen v EU.
      icon: tabler:book
    - title: EN ISO 14945
      description: Majhna plovila — ploščica graditelja. Informacije, ki jih je treba označiti na ploščici graditelja, trajno pritrjeni na vsakem plovilu.
      icon: tabler:badge
    - title: ISO 8666
      description: Majhne ladje — Glavni podatki. Standardizirane meritve in parametri za dosledno specifikacijo v vsej dokumentaciji izdelkov.
      icon: tabler:dimensions
content_process:
  tagline: Postopek skladnosti
  title: 6-stopenjsko CE skladnost<br />Delovni tok
  subtitle: Od obsega projekta do sledljivosti na serijski ravni — vsak RIB model sledi določenemu skladnostnemu poti.
  steps:
    - number: '01'
      title: Obseg in klasifikacija projekta
      description: Določite RIB model, kategorijo zasnove (A/B/C/D), največ oseb, nosilnost, moč motorja in ciljni trg. Določite, ali RCD velja in kateri modul za ocenjevanje skladnosti je zahtevan.
      timeline: 2–3 dni
    - number: '02'
      title: Identifikacija ustreznih zahtev
      description: Identificirajte vse ustrezne bistvene varnostne zahteve iz RCD Priloge I, ustrezne usklajene standarde (EN ISO 6185, 12215, 10240, 14945) in vse dodatne nacionalne zahteve za ciljni trg.
      timeline: 3–5 dni
    - number: '03'
      title: Oblikovanje in tehnična dokumentacija
      description: 'Ustvarite glavno tehnično datoteko: splošne načrte razporeditve, izračune stabilnosti in plovnosti, oceno tveganja, specifikacije materialov ter analizo varnosti sistemov (gorivo, elektrika, krmiljenje).'
      timeline: 10–15 dni
    - number: '04'
      title: Preverjanje in testiranje izdelkov
      description: Izvedite fizično preverjanje — testiranje tlaka pri 1,25x nazivnem tlaku za 24–48 ur, teste stabilnosti in vzgona, preizkuse obremenitve ter zagon sistemov. Zabeležite vse rezultate testov po trupu.
      timeline: 5–7 dni
    - number: '05'
      title: Označevanje in dokumentacija za dostavo
      description: Oznaka pripon, CE tablica graditelja (EN ISO 14945) in HIN/CIN (identifikacijska številka trupa). Pripravite Deklaracijo skladnosti EU, uporabniški priročnik (EN ISO 10240) in kontrolni seznam skladnosti.
      timeline: 2–3 dni
    - number: '06'
      title: Sledljivost na serijski ravni
      description: Vsak trup prejme edinstven zapis trupa, ki ga povezuje z glavno tehnično datoteko, proizvodno serijo, materialnimi certifikati, rezultati testov in končno konfiguracijo. Zapisi se hranijo 10+ let RCDvsak.
      timeline: V teku
content_document_cards:
  tagline: Vrste dokumentov
  title: Dokument o skladnosti<br />Karte
  subtitle: To so vrste dokumentov, ki jih pripravljamo in vzdržujemo za CERIB vsak -certificiran model. Vzorci so na voljo ob kvalificiranem povpraševanju.
  items:
    - title: CE / RCD Potrdilo o skladnosti
      description: Certifikat, specifičen za model, ki potrjuje, da plovilo izpolnjuje vse veljavne bistvene varnostne zahteve RCD za leto 2013/53/EU, izdan s strani proizvajalca ob sodelovanju obveščenega organa, kjer je to potrebno.
      icon: tabler:certificate
    - title: Deklaracija EU o skladnosti (DoC)
      description: Podpisana izjava proizvajalca ali pooblaščenega predstavnika, ki navaja veljavne direktive, standarde, modul za skladnost in podrobnosti o obveščenem telesu. Zahtevano za vsak model, ki je predstavljen na trgu EU.
      icon: tabler:file-check
    - title: Gradbena tablica (EN ISO 14945)
      description: Trajno pritrjena tablica z največjim številom oseb, največjo močjo motorja, kategorijo zasnove in identifikacijo proizvajalca. Mora ostati berljiva skozi celotno življenjsko dobo plovila.
      icon: tabler:badge
    - title: Uporabniški priročnik (EN ISO 10240)
      description: Celovit priročnik, ki pokriva varno delovanje, postopke v izrednih razmerah, vzdrževalne urnike in varnostna opozorila. Obvezno za vsako RIB dostavljeno v EU.
      icon: tabler:book
    - title: ISO Poročila o testiranju in inšpekciji
      description: Zapisi o preizkusih tlaka (1,25x / 24–48h), rezultati testov stabilnosti in plovnosti, certifikati o materialnih testih ter poročila o preverjanju dimenzij — vse povezano s specifičnimi številkami trupov.
      icon: tabler:test-pipe
    - title: Zapisniki sledljivosti materiala
      description: Sledljivost na ravni serije za tkanino cevi, lepila, steklena vlakna in strojno opremo. Povezuje vsako proizvodno enoto z certifikati vhodnega materiala in rezultati IQC inšpekcij.
      icon: tabler:link
    - title: Zapisniki kvalitete in nadzora kakovosti
      description: 100-točkovni kontrolni seznam kakovosti na enoto, evidence QC med postopkom, poročila o neusklajenosti in korektivni ukrepi. Del verige sledljivosti proizvodnje.
      icon: tabler:clipboard-check
    - title: Paket projektne dokumentacije
      description: Dokumentacijski paket za posamezno trupelo, vključno s končnim zapisnikom konfiguracije, podrobnostmi o vgradnji motorja in opreme, kontrolnim seznamom ob zagonu in dokumentacijo o dostavi.
      icon: tabler:package
content_design_categories:
  tagline: RCD Kategorije dizajna
  title: Kategorija dizajna A–D<br />— Kaj pomenijo
  subtitle: RCD določa kategorije dizajna glede na največjo silo vetra in pomembno višino valov, ki ji je plovilo zasnovano vzdržati.
  items:
    - title: Kategorija A — Ocean
      description: Zasnovano za dolge plovbe, kjer lahko sila vetra preseže Beaufort 8 (>40 vozlov) in pomembna višina valov preseže 4 m. Zahteva najstrožjo verificiranje strukture in stabilnosti.
      icon: tabler:ripple
    - title: Kategorija B — Offshore
      description: Zasnovano za obalno plovbo z vetrom do Beaufort 8 (≤40 vozlov) in pomembno višino valov do 4 m. Primerna za obalne in pol-izpostavljene vode.
      icon: tabler:anchor
    - title: Kategorija C — Obalna
      description: Zasnovano za obalne plovbe z vetrom do Beaufort 6 (≤27 vozlov) in pomembno višino valov do 2 m. Večina rekreativnih RIBs spada v to kategorijo.
      icon: tabler:sun
    - title: Kategorija D — Zavetišče
      description: Zasnovano za zavetišča z vetrom do Beaufort 4 (≤16 vozlov) in pomembno višino valov do 0,3 m. Jezera, reke in zaščitene pristanišča.
      icon: tabler:pool
content_hin:
  tagline: Identifikacija plovila
  title: HIN / CIN & ploščica proizvajalca
  subtitle: Vsako plovilo RIB zahteva številko identifikacije trupa (HIN) ali številko identifikacije plovila (CIN) in ploščico proizvajalca po EN ISO 14945 in zahtevah RCD.
  items:
    - title: Številka identifikacije trupa (HIN)
      description: Edinstvena 14-znakovna koda, trajno označena na desni strani krme, ki kodira proizvodni šifro (MIC), leto modela, leto proizvodnje in serijsko številko. Zahtevano za vstop na trg EU.
      icon: tabler:hash
    - title: Številka identifikacije plovila (CIN)
      description: Po EN ISO 10087, skrita sekundarna identifikacijska številka, nameščena na skriti lokaciji za namene proti kraji in sledljivosti.
      icon: tabler:eye-off
    - title: Vsebina ploščice graditelja
      description: Največje število oseb, največja moč motorja (kW), največja obremenitev (kg), kategorija dizajna, ime proizvajalca in označitev CE — vse trajno prikazano na ploščici odporni proti koroziji.
      icon: tabler:badge
content_tech_file:
  tagline: Struktura tehnične dokumentacije
  title: Glavna tehnična datoteka<br />& Zapisnik trupa
  subtitle: 'Naš dokumentacijski sistem sledi dvostopenjski strukturi: glavni tehnični dosje za vsako družino modelov in posamezni zapisi trupa za vsako proizvedeno plovilo.'
  items:
    - title: Glavna tehnična datoteka
      description: 'Vsebuje popolno dokumentacijo skladnosti za modelno družino: splošno razporeditev, oceno tveganja, izračune stabilnosti/plovnosti, specifikacije materialov, veljavne standarde in evidence o oceni skladnosti. Hrani se 10+ let.'
      icon: tabler:folder
    - title: Zapis trupa (sledljivost po čolnu)
      description: 'Vsak trup ima edinstven zapis, ki ga povezuje z glavno tehnično datoteko: HIN, datum proizvodnje, serija cevi, certifikati materiala, rezultat preizkusa tlaka, končna konfiguracija, namestitev motorja in destinacija dostave.'
      icon: tabler:file-description
    - title: Paket za skladnost strank
      description: Paket za dostavo po trupu, vključno z DoC, fotografijo plošče proizvajalca, priročnikom za lastnika, povzetkom testa in končnim konfiguracijskim listom — priloženi vsaki RIB pošiljki v EU.
      icon: tabler:package
content_material_cert:
  tagline: Certificiranje materialov
  title: Sledljivost materiala &<br />Dokazi o certifikaciji
  subtitle: RIB Kakovostni čolni začnejo z nadzorovanimi materiali in dokumentiranimi postopki. Spodaj je opisano, kako organiziramo certifikacijo materialov za vsako skupino ključnih komponent.
  items:
    - title: Sledljivost materiala napihljivih cevi
      description: PVC CSMHypalon in/cevni materiali so izbrani glede na predvideno uporabo, podnebne razmere in ciljni trg. Podatki o tehničnih dobaviteljih (TDS), informacije o serijah materialov, sledljivost serij tkanin UV in poročila o testih proti vremenskim vplivom ter REACH/SVHC deklaracije so na voljo znotraj dogovorjenega obsega projektne dokumentacije.
      icon: tabler:circle
    - title: Sledljivost pomorskega aluminija
      description: Pri projektih aluminijastih trupov RIB se razred zlitine, debeline in serije materialov nadzorujejo v skladu z odobreno specifikacijo. Certifikati za testiranje materialov (MTC/MTR), EN 10204 3.1 dokumentacija, poročila o kemijski sestavi in mehanskih lastnostih ter sledljivost toplote/serij so na voljo tam, kjer je dogovorjeno.
      icon: tabler:rectangle
    - title: GRP material in procesni nadzor trupa
      description: Za ohišje iz steklenih vlaken RIBsse gelcoat, smola, steklena vlakna in jedrni materiali upravljajo po nadzorovanih specifikacijah. Materialni TDS/SDS, serijski zapisi, laminatne specifikacije ter zapisi o utrjevanju in nadzoru delavnice so na voljo po dogovoru o projektu.
      icon: tabler:layers-subtract
    - title: Podpora dokumentaciji komponent
      description: Za izbrane komponente — vključno EVA z materiali za palubo, sedeži, nerjavečo jekleno strojno opremo, gorivnimi sistemi, električno opremo in pomorskimi dodatki — se ustrezna dokumentacija dobaviteljev usklajuje glede na končno konfiguracijo in zahteve ciljnega trga.
      icon: tabler:package
    - title: Obvestilo o obsegu skladnosti
      description: Certifikati, testna poročila in dokumenti o skladnosti veljajo le za specifični model izdelka, material, komponento, proizvodno serijo ali obseg projekta, naveden v ustreznem dokumentu. Kontaktirajte nas s svojim ciljnim trgom, namenom uporabe in tehničnimi zahtevami, da se ustrezni dokumentacijski paket potrdi pred oddajo naročila.
      icon: tabler:info-circle
faq:
  title: CE Skladnost — Pogosto zastavljena vprašanja
  questions:
    - q: Ali so Aquafarer RIB vsi čolni CE certificirani za trg EU?
      a: RIB čolni v našem katalogu so zasnovani in dokumentirani za RCD skladnost 2013/53/EU v skladu z veljavnimi smernicami EU.CE Označevanje velja za vsak model in konfiguracijo. Kontaktirajte nas za dokument o skladnosti specifičen za model.
    - q: Kakšna je razlika med RCD skladnostjo in CE označevanjem?
      a: RCD (Direktiva o rekreativnih plovilih 2013/53/EU) je zakonodaja EU, ki določa bistvene varnostne zahteve.CE Označevanje je vizualni simbol, ki je bil na izdelku, ki je bil ocenjen in potrjen kot izpolnjevanje teh zahtev. Izdelek mora izpolnjevati zahteve RCD , preden lahko CE nosi oznako.
    - q: Ali za vsak čoln priložite Izjave o skladnosti?
      a: Da. Vsako RIB plovilo, dostavljeno na trg EU, vključuje modelno specifično Deklaracijo o skladnosti EU, ki navaja veljavne direktive, usklajene standarde, modul za ocenjevanje skladnosti in podrobnosti o obveščenem telesu.
    - q: Kateri modul za ocenjevanje skladnosti Aquafarer uporablja?
      a: Modul je odvisen od kategorije zasnove in vrste čolna. Večina RIB modelov v kategoriji C uporablja modul A (notranji proizvodni nadzor). Za čolne kategorije A/B ali specifične konfiguracije se lahko uporablja modul B+C ali B+D ob sodelovanju obveščenega organa. Svetujemo glede ustreznega modula za vsak projekt.
    - q: Ali lahko pred oddajo naročila posredujete dokumentacijo o skladnosti?
      a: Po kvalificiranem povpraševanju delimo dokument o obsegu skladnosti, ki navaja veljavne standarde, pot skladnosti in vrste dokumentov, ki so na voljo za model, ki ga ocenjujete. Celotne tehnične datoteke so na voljo pod NDA po potrditvi naročila.
    - q: Kaj je identifikacijska številka trupa (HIN) in ali je vključena?
      a: HIN je 14-znakovni edinstveni identifikator, trajno označen na vsakem čolnu, ki kodira proizvodno kodo (MIC), oznako modela, proizvodno leto in serijsko številko. Obvezen je za vse RIB čolne, ki so uvrščeni na trg EU, in je vključen na vsak Aquafarer RIB.
    - q: Kako dolgo se tehnične datoteke hranijo?
      a: V skladu RCD z zahtevami 2013/53/EU mora proizvajalec tehnično dokumentacijo hraniti vsaj 10 let od zadnjega datuma uvrstitve izdelka na trg.Aquafarer vzdržuje popolno tehnično dokumentacijo za vse proizvedene modele.
    - q: Ali pomagate pri obveznostih uvoznika po RCD?
      a: 'Da. Zagotavljamo dokumentacijo, ki jo uvozniki v EU potrebujejo za izpolnitev svojih obveznosti: dostop do tehničnih datotek, DoC, tablico proizvajalca, priročnik za uporabo in evidence sledljivosti izdelkov. Odgovornosti uvoznikov po tem so RCD jasno dokumentirane v našem vodiču za skladnost.'
