      icon: tabler:news
    - title: Telefon
      description: +1 279 732 3333 (ZDA HQ) · +86 13305324192 (tovarna)
      icon: tabler:headset
    - title: E-pošta
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Svetovna pisarna in obračun
      description: Paddle Board Overstock d.o.o., Novi Mehiko, Združene države
      icon: tabler:map-pin
