content_challenge:
  tagline: Izziv
  title: Zahteve morskih raziskav<br />Stabilne platforme, pripravljene za instrumente
  subtitle: Znanstvene delovne ladje morajo zagotavljati stabilno platformo za občutljivo instrumentacijo, tiho delovanje, da ne motijo divjih živali, in prilagodljive postavitve za različno raziskovalno opremo.
  paragraphs:
    - Morske raziskave in spremljanje okolja zahtevajo delovne ladje, ki služijo kot mobilni laboratoriji. Za razliko od komercialnih ali rekreativnih plovil, mora raziskovalna RIBs omogočati uporabo občutljivih elektronskih instrumentov, opreme za vzorčenje vode in sedimenta ter včasih transport živih vzorcev — vse to ob vzdrževanju stabilne platforme za natančno zbiranje podatkov.
    - '**Stabilnost platforme je ključnega pomena** — sonarji, odmevni merilniki in CTD (prevodnost, temperatura, globina) profilerji zahtevajo stabilen trup tako v mirovanju kot pri počasni hitrosti. Preveč valov ali gibanje trupa vnašata šum v znanstvene podatke. Globok-V trup z dobrimi stabilnostnimi lastnostmi je bistven.'
    - '**Integracija instrumentov** — raziskovalna plovila potrebujejo pritrdilne točke za GPS antene, sonar transducerje, roke za vzorčenje in opremo za beleženje podatkov. Konzola mora omogočati več zaslonov, distribucijo električne energije za instrumente in varno shranjevanje občutljive elektronike.'
    - '**Tiho delovanje** — za morske biološke raziskave in spremljanje okolja lahko hrup motorja in vibracije trupa prestrašijo morski živali in ogrozijo opazovanje vedenja. Tihe konfiguracije zunanjih motorjev in zasnove trupov z zmanjšanimi vibracijami so pomembne za raziskovalne aplikacije.'
    - Paddle Board Overstock raziskovalna RIBs so zasnovana s stabilnimi trupnimi platformami, integriranimi sistemi za pritrditev opreme in tihimi konfiguracijami zunanjih motorjev za znanstvene in okoljske aplikacije.
content_solution:
  tagline: Naša rešitev
  title: Specifične raziskovalne RIBs<br />Za znanost in okoljsko delo
  subtitle: Vsaka Paddle Board Overstock raziskovalna RIB je konfigurirana kot stabilna, prilagodljiva platforma za znanstveno instrumentacijo in opremo za terensko vzorčenje.
  list:
    - Trup iz steklenih vlaken z globokim-V in odlično stabilnostjo v mirovanju in pri počasnih raziskovalnih hitrostih
    - Ravna postavitev krova z montažnimi ploščami za sonar, GPS in vzorčno opremo
    - Konzola konfigurirana za več zaslonov — ploter, sonar, beležilec podatkov
    - 12V in 24V pomožna distribucija napajanja za znanstvene instrumente
    - Tihi štiritaktni zunanji motor — minimalne vibracije in hrup za preglede divjih živali
    - Opcijska zasnova trupa z nizkim valom za minimalne motnje med zbiranjem podatkov
    - Prilagojene barve cevi za blagovno znamko raziskovalnih institucij in identifikacijo voznega parka
content_segments:
  tagline: Raziskovalni profili
  title: Rešitve za morsko znanost<br />Po vrsti aplikacije
  subtitle: Različne raziskovalne aplikacije imajo edinstvene zahteve po plovilih — od univerzitetnih učnih platform do plovil za okoljske raziskave in spremljanja kakovosti vodeRIBs.
  items:
    - title: Univerzitetni programi morskih znanosti
      subtitle: Učne platforme, študentske ekskurzije, obalne raziskave
      description: Univerze za morske vede in oddelki za oceanografijo potrebujejo zanesljive, vsestranske delovne čolne za poučevanje terenskih predmetov, študentskih raziskovalnih projektov in obalnih pregledov, ki jih vodijo profesorji. Čoln mora biti enostaven za upravljanje za študente pod nadzorom, dovolj stabilen za praktično uporabo instrumentov in dovolj trpežen za pogosto uporabo več uporabnikov v različnih študijskih obdobjih. Zaradi proračunskih omejitev v akademskem okolju sta stroškovna učinkovitost in nizko vzdrževanje pomembna.
      features:
        - Stabilna platforma za študentsko vadbo nameščanja in reševanja instrumentov
        - Enostavno upravljanje — konfiguracija s krmilom ali eno-konzolno konfiguracijo za nadzorovano uporabo učencev
        - Hypalon Vzdržljive cevi za pogosta pristajanja na plaži in rokovanje s študenti
        - Montaža opreme za sonar učne ravni, secchi disk in opremo za vzorčenje
        - PVC Stroškovno učinkovita možnost za akademske programe z omejenim proračunom
    - title: Inštituti za morske raziskave
      subtitle: Pregled RIBs z integracijo instrumentov, GPS, opremo za vzorčenje
      description: Specializirane morske raziskovalne organizacije, ki izvajajo obalne in obalne preglede, potrebujejo profesionalno RIBs konfigurirane preglede z integrirano instrumentacijo. Ta plovila nosijo sonarne sisteme za batimetrično kartiranje, CTD profilere za analizo vodnega stolpca, vzorčevalce sedimentov in opremo za biološko zbiranje. Plovilo mora zagotavljati stabilno platformo pri počasnih hitrostih raziskav, imeti dovolj prostora na palubi za namestitev opreme in zagotavljati čisto 12V/24V napajanje za elektroniko.
      features:
        - Vgrajena montaža sonarnega pretvornika — konfiguracija skozi trup ali krmo
        - Namestitev GPS antene in integracija konzole za navigacijo geodetske stopnje
        - Območje za namestitev CTD in vodnih vzorčevalcev z varnimi pritrdilnimi točkami
        - 12V/24V pomožna distribucija napajanja za instrumente in podatkovne beležnike
        - Stabilna pri nizki hitrosti (3-6 vozlov) za natančnost geodetskih linij
        - Opcijski A-okvir ali davit za namestitev težje opreme za vzorčenje
    - title: Okoljski nadzor in varstvo narave
      subtitle: Ekološke raziskave, opazovanje divjih živali, ocenjevanje habitatov
      description: Okoljske nevladne organizacije, vladne agencije in organizacije za varstvo narave izvajajo morske ekološke raziskave, spremljanje populacij divjih živali in ocene habitatov. Te operacije zahtevajo tihe, nizko vplivne ladje, ki se lahko približajo občutljivim habitatom, ne da bi motile divje živali. Čolni morajo imeti s seboj kamero, GPS za transektno kartiranje ter opremo za zbiranje vode in sedimentov. Nizka valovitost in minimalen hrup motorja sta ključna za vedenjske opazovalne študije.
      features:
        - Tih štiritaktni zunanji motor — minimalno motenje morskih živali
        - Stabilna opazovalna platforma za fotografsko in video dokumentacijo
        - Montaža opreme za kamere, GPS sledilce in terenske računalnike
        - Plitek ugrez za dostop do obalnih mokrišč, mangrovov in estuarijev
        - Površine krovov in cevi, enostavne za čiščenje med lokacijami
    - title: Spremljanje in testiranje kakovosti vode
      subtitle: Redni odvzemi vzorcev, spremljanje onesnaževal, nadzor skladnosti
      description: Organizacije za spremljanje kakovosti vode izvajajo redne odvzeme vzorcev v obalnih območjih, pristaniščih in vodnih poteh v notranjosti, da spremljajo raven onesnaženja, cvetenje alg in skladnost z okoljskimi predpisi. Za te operacije so potrebne učinkovite in zanesljive ladje za ponavljajoče obiske fiksnih vzorčnih postaj. Plovilo mora nositi opremo za odvzem vzorcev, hladilnike za ohranjanje vzorcev in terensko testno opremo — s preprostim pranjem krova med vzorčnimi postajami, da se prepreči križno onesnaževanje.
      features:
        - Dodeljeno območje vzorčne postaje s hladilnikom in shranjevanjem opreme
        - Krov in cevi enostavni za čiščenje med lokacijami
        - Integracija GPS za natančen povratek na fiksne koordinate vzorčenja
        - Kompaktna velikost za dostop do omejenih vodnih poti in ozkih kanalov
        - Gorivo varčen zunajkrmni motor za stroškovno učinkovite redne odvzeme vzorcev
