articles:
  sup:
    - title: SUP Osnove — Vodnik za začetnike
      desc: Vse, kar začetnik mora vedeti — vrste deske, velikosti loparja, drža in nasveti za prvi dan.
    - title: SUP Vodnik po velikosti
      desc: Poiščite pravilno dolžino, širino in prostornino deske glede na vašo težo, spretnost in stil veslanja.
    - title: Napihljiva proti trdi deski
      desc: Kaj je pravo za vas? Primerjava prenosljivosti, zmogljivosti, vzdržljivosti in stroškov.
    - title: Srednje tehnike
      desc: Izboljšajte svoje veslanje z naprednimi udarci, tehnikami obračanja in obvladovanjem divjih voda.
    - title: Kako izbrati napihljiv SUP
      desc: Preučite ključne dejavnike — konstrukcija, debelina, namestitev plavutk in vključeni dodatki.
    - title: Varnost na vodi
      desc: Osnovno varnostno znanje, vključno z branjem vremena, izbiro PFD, samoreševanjem in skupinskim veslanjem.
  inflatable-boat:
    - title: Referenca Materialov
      desc: PVC, Hypalon, drop-stitch, ocene denier — razumeti, iz česa je narejena vaša napihljiva oprema.
    - title: PVC proti Hypalon
      desc: Končna primerjava tkanin PVC in Hypalon za napihljive čolne — vzdržljivost, odpornost UV in cena.
    - title: Drop-Stitch osnovno pojasnjeno
      desc: Kako tisoči notranjih niti ustvarjajo trdno ploščad pri 12-15 PSI za visokozmogljive napihljive SUPs.
    - title: Pregled napihljive tehnologije
      desc: Kako so zgrajeni napihljivi čolni in SUPs — od polaganja materiala do ventilskih sistemov in varjenja šivov.
    - title: Vodnik po trdnih napihljivih čolnih (RIB)
      desc: Vse o konstrukciji RIB, vrstah trupa, materialih cevi in izbiri pravega RIB za vaše potrebe.
    - title: Napihljivi čoln proti RIB
      desc: Ključne razlike med tradicionalnimi napihljivimi čolni in trdimi napihljivimi čolni za različne namene.
  water-safety:
    - title: Vodnik za varnost na vodi
      desc: Osnovno varnostno znanje za vsakega veslača — vreme, PFD-ji, samoreševanje in protokoli skupinskega veslanja.
    - title: Vodnik po rešilnem jopiču in PFD
      desc: Kako izbrati pravi osebni plavalni pripomoček za SUP, kajakaštvo, čolnarjenje in strokovno uporabo.
    - title: Varnostni kontrolni seznam SUP
      desc: Kontrolni seznam varnosti pred lansiranjem, ki ga mora upoštevati vsak veslač na stoječo desko pred vkrcanjem na vodo.
    - title: Varnost pri veslanju v hladni vodi
      desc: Nujni previdnostni ukrepi, oprema in tehnike za veslanje v hladnih vodnih razmerah.
    - title: Napake začetnikov pri veslanju
      desc: Pogoste napake, ki jih naredijo začetniki pri veslanju, in kako se jim izogniti za varnejšo in prijetnejšo izkušnjo.
    - title: CE Pojasnjena certifikacija
      desc: Kaj pomeni certifikacija CE za napihljiva plovila — standardi, testiranje in zakaj je pomembna za varnost.
