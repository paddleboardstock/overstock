  read_guide: Preberite vodnik →
  card_tech: Inženiring morske varnosti in testiranje materialov
  card_products: Raziščite celoten katalog izdelkov Aquafarer
  card_trust: Skladnost CE, ISO in BSCI
materials:
  intro_p1: Uspešnost, vzdržljivost in varnost napihljivih plovil je skoraj povsem odvisna od materialov, uporabljenih pri njihovi izdelavi. Od tkanine, ki tvori cevi, do niti, ki daje SUP deski trdnost, vsak izbor materiala vpliva na delovanje izdelka na vodi in njegovo življenjsko dobo.
  intro_p2: 'Ta vodič pokriva štiri osnovne materiale, uporabljene v sodobnih napihljivih plovilih: PVC tkanina, Hypalon CSM guma, drop-stitch jedrna konstrukcija in EVA pena za krov. Razumevanje teh materialov vam bo pomagalo izbrati pravi izdelek za vaše potrebe in ga vzdrževati za čim daljšo življenjsko dobo.'
  labels:
    advantages: Prednosti
    limitations: Omejitve
    best_for: 'Najbolje za:'
  items:
    - name: PVC (polivinilklorid)
      summary: Industrijski standard za rekreativne napihljive čolne in SUPs. Večplastna laminirana tkanina ponuja odlično razmerje med močjo in težo po dostopni ceni.
      pros:
        - Dostopno — 30-50 % ceneje od Hypalon
        - Lahko in enostavno za rokovanje
        - Dobra odpornost na UV s primernimi premazi
        - Širok izbor barv in zaključkov
        - Enostavno popravljanje s PVC obliži in topilno lepilo
      cons:
        - Krajša življenjska doba kot Hypalon (7-10 let)
        - Manj fleksibilna pri nizkih temperaturah
        - Nižja kemična odpornost
        - Sčasoma se lahko razvije migracija plastičnegaizerja
      best_for: Rekreativni SUPs, ugodni čolni, najemne flote, sezonska uporaba, sladkovodne in obalne razmere.
    - name: Hypalon (CSM guma)
      summary: Premium sintetični gumijasti material, znan po izjemni vzdržljivosti, odpornosti na UV in dolgo življenjsko dobo. Zlati standard za komercialne in vojaške napihljive čolne.
      pros:
        - Izjemna odpornost na UV in ozon
        - Življenjska doba 15-20 let ob ustreznem vzdrževanju
        - Odlična prilagodljivost na nizke temperature
        - Odlična odpornost na kemikalije in olje
        - Barvo ohranja dlje kot PVC
      cons:
        - Znatno dražji kot PVC
        - Teža tkanine večja
        - Manj možnosti barv
        - Popravila zahtevajo specializirana lepila
        - Manj proizvodnih obratov po svetu
      best_for: Komercialna uporaba RIBs, iskalno-reševalne operacije, vojaške aplikacije, tropske klime, dolgoročno lastništvo flot.
    - name: Drop-Stitch jedro
      summary: Tehnologija, ki je revolucionirala napihljive SUPs. Tisoče poliester niti povezuje zgornje in spodnje plasti tkanine, kar omogoča napihovanje pod visokim tlakom za trdno, trdo lupinsko izvedbo.
      pros:
        - Izjemno trdo pri 12-20 PSI
        - Lahko — 18-30 lb za popolno desko
        - Zloži se ravno za shranjevanje in potovanja
        - Odporen na udarce
        - Dosledna zmogljivost pri različnih temperaturnih razponih
      cons:
        - Zahteva črpalko za visok pritisk
        - Popravilo predrtja bolj kompleksno kot pri enoplastnih
        - Višji proizvodni stroški kot pri standardnih napihljivih
        - Sčasoma izguba tlaka zahteva občasno dopolnjevanje
      best_for: Deske za stoječe veslanje, kajaki, zračne palube za napihljive čolne, katerakoli uporaba, ki zahteva trdno zmogljivost z napihljivo prenosljivostjo.
    - name: EVA penasta paluba
      summary: Zaprto-celična EVA (etilen-vinil acetat) pena, uporabljena za proti-zaščitne blazinice na SUP deskah in palubah čolnov. Nudi oblazinjenje, oprijem in toplotno izolacijo.
      pros:
        - Odličen oprijem na mokrem ali suhem
        - Oblazinjenje zmanjšuje utrujenost pri dolgih veslanjih
        - Toplotna izolacija pred hladno površino palube
        - UV in odpornost na slano vodo
        - Na voljo v večbarvnih blokih in laserjem izrezanih dizajnih
      cons:
        - Zmore obtežno uporabo 2-3 leta
        - Mora biti pravilno pritrjeno, da se prepreči razslojevanje
        - Ni strukturno — ne vpliva na togost
        - Doda rahlo težo (200–400 g na desko)
      best_for: SUP oprijem na palubi, oblazinjenje čolna, udobje sedeža kajaka, vsaka površina, ki zahteva nedrsno podlago.
  selection:
    title: Vodnik za izbiro materiala
    subtitle: 'Izberite pravi material glede na primarno uporabo:'
    headers:
      - Primer uporabe
      - Priporočen material
      - Zakaj
    rows:
      - - Rekreativno SUP veslanje
        - Drop-stitch PVC
        - Lahek, tog, ugoden — idealno ravnovesje za ljubiteljske veslače
      - - Družinski čoln / jezerski čoln
        - PVC (1100 denier)
        - Stroškovno učinkovit, enostaven za popravilo, zadostna vzdržljivost za rekreativno uporabo
      - - Komercialni RIB / patruljni čoln
        - Hypalon CSM
        - Največja odpornost UV, življenjska doba 15–20 let, odpornost na kemikalije/olje
      - - Deske za najem flotil SUP
        - Drop-stitch PVC + EVA paluba
        - Vzdržljivo, popravljivo, dobra vrednost za pogoste menjave
      - - Operacije iskanja in reševanja
        - Hypalon CSM
        - Zanesljivost v ekstremnih pogojih, prožnost pri mrazu, odpornost na kemikalije
      - - Turistični / ekspedicijski kajak
        - Drop-stitch PVC
        - Togost pri zmogljivosti z zložljivo prenosljivostjo za potovanja
  deep_dive:
    title: Poglobljeni vodiči
    topics:
      - title: Mornarska kakovost PVC
        desc: Večplastna laminirana tkanina PVC — odporna proti UV, testi obrabe in razlage ocen denier.
      - title: PVC proti Hypalon
        desc: Definitivna primerjava dveh prevladujočih materialov za napihljive čolne — cena, življenjska doba, odpornost UV.
      - title: Drop-Stitch jedro
        desc: Kako tisoče notranjih niti ustvarja tog, visokotlačni napihljivi strukturi pri 12–15 PSI.
      - title: RF varilna tehnologija
        desc: Visokofrekvenčno varjenje ustvarja močne, konsistentne šive — kako deluje in zakaj je pomembno.
      - title: PSI & zmogljivost
        desc: Zakaj je zračni tlak pomemben za napihljive SUPs in čolne — trdnost, nosilnost in udobje vožnje.
      - title: Testiranje kakovosti
        desc: Preizkušanje tlaka, testi plovnosti, UV staranje in destruktivno testiranje — naš proces zagotavljanja kakovosti.
      - title: EVA Peneče palube
        desc: Podloge iz pene s zaprtimi celicami EVA — oprijem, udobje in vzdržljivost za SUP in čolnarske palube.
      - title: Nega materialov
        desc: Čiščenje, UV zaščita, preprečevanje plesni in najboljše prakse skladiščenja za napihljive izdelke.
