hero:
  tagline: Matrika industrijskih rešitev
  title: Rešitve za pomorstvo po scenarijih<br />Za profesionalne operacije
  subtitle: Napihljiva plovila in RIBs, zasnovana za reševanje, najem flote, jahte in komercialni ribičiji — vsaka podprta s tehničnimi specifikacijami in možnostmi prilagoditve.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock profesionalne pomorske rešitve za različne industrije
direct_answer: 'Paddle Board Overstock zagotavlja napihljiva plovila in RIB rešitve, zasnovane po scenarijih, za komercialne pomorske operacije: reševalne in patruljne čolne z ojačanimi Hypalon cevi in večkomorno varnostjo, najem flote SUPs in kajake z 1,2 mm PVC in z varjenimi šivi z vročim zrakom za nizko vzdrževanje in trajnost, luksuzne jadrnice z globokim V aluminijastim trupom RIBs ter težke ribiške konfiguracije z držali za ribiške palice in sistemi za živo ribo.'
solution_a:
  tagline: Rešitev A
  title: Pomorsko reševanje &<br />Komercialni nadzor
  subtitle: Hitri, večkomorni varnostni RIBs za profesionalno nujno pomoč in policijske operacije.
  badge: Heavy-Duty Series
  description: Naša pomorska reševalna in patruljna RIBs so zgrajena z ojačanimi cevi iz visokodensega Hypalon/PVC, ki imajo večkomorno neodvisno zasnovo plovnosti. Vsako plovilo je opremljeno s profesionalno odsevno nalepko, reševalnimi vrvmi in ventili za hitro napihovanje za pripravljenost na uporabo. Trupi iz steklenih vlaken Deep-V zagotavljajo izjemno stabilnost pri visokih hitrostih in v neugodnih razmerah na morju.
  features:
    - title: Večkomorna varnost
      description: 4–6 neodvisnih zračnih komor — predrtje katere koli posamezne komore ohranja pozitivno plovnost
    - title: Ojačana cevna tkanina
      description: 1,2 mm Hypalon CSM ali 1.680 DTEX PVC z dvojnim slojem šivov, varjenih z vročim zrakom
    - title: Profesionalna kakovost
      description: SOLAS odsevna nalepka, reševalne vrvi, privezni škripi, vrv za hitro spuščanje
    - title: Hitrostni trup
      description: Trup Deep-V iz steklenih vlaken ali aluminija, ocenjen za 25–45 vozlov, odvisno od konfiguracije
  recommended_models:
    - RIB 450 Patrulja
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Material trupa
      value: Steklena vlakna / aluminij pomorske kakovosti
    - label: Tkanina cevi
      value: 1,2 mm Hypalon CSM / 1.680 DTEX PVC
    - label: Največja hitrost
      value: 25–45 vozlov
    - label: Kapaciteta
      value: 6–12 oseb
    - label: Razpon motorjev
      value: 40–200 HP
    - label: Certificiranje
      value: CE / ISO 9001
solution_b:
  tagline: Rešitev B
  title: Najem vodnih športov in<br />Oprema letoviščnega voznega parka
  subtitle: Izjemno trpežni, enostavni napihljivi SUPskajaki, kajaki in čolni, izdelani za vsakodnevno uporabo v letoviščih, klubih in turističnih operacijah.
  badge: Rental-Grade
  description: Naša oprema za najem voznega parka je zasnovana za najvišjo vzdržljivost in najnižje stroške vzdrževanja. Uporabljamo 1,2 mm ojačano PVC s trojno plastjo vročega zračnega varjenega šiva, ki je odporna na UV propadanje in pogoste poškodbe zaradi trkov.Drop-stitch Konstrukcija zagotavlja, da deske ohranjajo togost tudi po stotinah ciklov najema. Vsi modeli imajo ojačane D-obroče, odporne tirnice proti obrabi in komercialne ventile.
  features:
    - title: Komercialni razred PVC
      description: 1,2 mm ojačano PVC s UV stabilizatorji — 3x debelejše od potrošniških materialov
    - title: Spoji z vročim zrakom
      description: Troslojno tavno varjenje — močnejše od lepljivih veziv, odporno na delaminacijo
    - title: Drop-Stitch Togost
      description: 1.680 DTEX jeder z 2 navojem/kvadratni in — ocenjeno na 20 PSI za trdoto, podobno trdi plošči
    - title: Zasnova pripravljena za vozni park
      description: Ojačani D-obroči, komercialni Halkey-Roberts ventili, odporni tirni trakovi
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Material cevi
      value: 1,0–1,2 mm ojačano PVC
    - label: Tehnologija šivov
      value: Troplastno vroče varjenje
    - label: Maksimalni tlak
      value: 15–20 PSI (drop-stitchmodeli)
    - label: UV Upor
      value: 1.000+ ur pospešenega testiranja
    - label: Garancija
      value: 2–5 let, odvisno od modela
    - label: Vzdrževanje
      value: Minimalno — sperite in shranite
solution_c:
  tagline: Rešitev C
  title: Jahte Tenderji &<br />Luksuzna plovila
  subtitle: Lahki, visoko zmogljivi RIB tenderji, zasnovani za shranjevanje superjaht in prevoz gostov z luksuzno opremo in dodelavo.
  badge: Premium Series
  description: Naši jadrni tenderji RIBs združujejo lahkotno konstrukcijo z luksuzno estetiko. Globoke V aluminijaste ali steklenoplastične trupe zagotavljajo izjemno kakovost vožnje in enostavno dvigovanje z davitom. Na voljo z grafiko na ceveh ujemajočih barv, vrhunsko oblazinjenostjo in prilagojenimi razporeditvami konzole. Kompaktne dimenzije za shranjevanje jih naredijo idealne za garaže superjaht in shranjevanje na krovu.
  features:
    - title: Lahka konstrukcija
      description: Trupi iz aluminija morske kakovosti zmanjšajo težo za 30% v primerjavi s stekleno plastiko za enostavno dvigovanje
    - title: Globoko V zmogljivost
      description: Trup z naklonom 18–22 stopinj za gladko vožnjo po razburkanem morju in odlično sledljivost
    - title: Luksuzna dodelava
      description: Prilagojeno oblazinjenje, cevi ujemajočih barv, vrhunska konzola, komplet iz nerjavečega jekla
    - title: Kompaktno shranjevanje
      description: Zasnovano za garaže superjaht — napihljive cevi za kompaktno shranjevanje
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Vrsta trupa
      value: Globoko V aluminij / steklenoplastika
    - label: Naklon trupa
      value: 18–22 stopinj
    - label: Največja hitrost
      value: 30–40 vozlov
    - label: Suha teža
      value: 120–350 kg (aluminijasti trup)
    - label: Pripravljeno za dvig z davitom
      value: Da — dvigovalne točke standardne
    - label: Shranjevanje
      value: Napihljive cevi, zložljive
