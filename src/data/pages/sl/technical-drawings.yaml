hero:
  tagline: Tehnične risbe in CAD
  title: RIB & Napihljiv čoln<br />Tehnične risbe in CAD prenosi
  subtitle: Načrti na ravni GA, dimenzijski listi in postavitve palub za oceno in specifikacijo projektov. Dostop do tehničnih risb na pravi ravni — od javnih PDF-jev do datotek STEP na ravni projekta.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: RIB Tehnične risbe čolnov in prenosi CAD
direct_answer: Paddle Board Overstock zagotavlja tehnične risbe na ravni nabave za RIB čolne in napihljiva plovila — vključno z PDF-ji splošne razporeditve (GA), dimenzijskimi listi in risbami postavitve palube. Na voljo so tudi bolj podrobni formati (DXF/DWG, STEP/IGES) ob kvalificiranem povpraševanju ali prijavi na projekt.
stats:
  - value: GA PDF
    label: Brezplačen prenos
