content_tiers:
  tagline: Stopnje prenosa
  title: Štiri dostopne ravni<br />— Prava podrobnost za pravi oder
  subtitle: Nudimo risbe na ravni nabave, ne datotek na ravni proizvodnje. Vsaka stopnja ustreza različnemu stadiju projekta.
  items:
    - title: Tier 1 — Javni PDF
      description: Splošna razporeditev (GA), risba dimenzij s 4 pogledi in postavitev ploščadi v PDF formatu. Na voljo za brezplačen prenos. Zadostuje za načrtovanje projektov, dodeljevanje prostora in predhodni pregled specifikacij.
      icon: tabler:file-type-pdf
    - title: Stopnja 2 — Lahka oblika DXF/DWG
      description: 2D CAD datoteke (DXF ali DWG) za integracijo postavitve na ravni načrtovanja. Zahteva kratek obrazec za kvalifikacijo (ime podjetja, vrsta projekta, namen uporabe). Ni vključenih strukturnih ali proizvodnih podatkov.
      icon: tabler:file-code
    - title: Stopnja 3 — Projekt Application STEP/IGES
      description: 3D modelne datoteke (STEP ali IGES) za integracijo sistema, načrtovanje opremljanja ali koordinacijo ladjedelniške arhitekture. Zahteva projektno prijavo z obsegom, časovnim okvirom in namenom nakupa. Podvrženo odobritvi.
      icon: tabler:cube
    - title: Stopnja 4 — NDA Inženirstvo
      description: Strukturni načrti trupa, načrti laminacije, razširitve rezanja cevi in podatki o kalupih. Na voljo le NDA pod potrjenimi naročili. To so datoteke na ravni proizvodnje — niso namenjene javni distribuciji.
      icon: tabler:lock
content_included:
  tagline: Kaj je vključeno
  title: Vsebina risb<br />Na model
  subtitle: Vsak model ima standardni paket risb, ki pokriva osnovne informacije za načrtovanje za kupce B2B in projektne inženirje.
  items:
    - title: Splošna postavitev (GA)
      description: Bočni profil, pogled od zgoraj in prečni prerez, ki prikazuje obliko trupa, položaj cevke, lokacijo konzole, sedeže, sistem za gorivo in ključne dimenzije (LOA, širina, premer cevi, kot deadrise). Status revizije in avtorska pravica sta navedena v naslovnem bloku.
      icon: tabler:layout
    - title: 4-pogledna dimenzijska risba
      description: Bočni, sprednji, zadnji in pogled od zgoraj z vsemi dimenzijami za načrtovanje transporta (višina na prikolici, širina za kontejner, teža za dvig). Vključene operativne in transportne konfiguracije.
      icon: tabler:ruler-2
    - title: Razpored palube in načrt opreme
      description: Pogled palube od zgoraj, ki prikazuje osnovo konzole, položaje sedežev, lokacije D-obročev, položaje navigacijske luči, dostop do črpalke za iztakanje, prostor za baterijo/gorivo in točke za montažo opreme. Omejena natančnost pri lastniških vmesnikih.
      icon: tabler:map
    - title: Risba transporta in pakiranja
      description: Načrt nalaganja v kontejner, dimenzije nosilcev, porazdelitev teže in položaji dvigal za logistično načrtovanje. Vključuje standardne in prilagojene možnosti pakiranja.
      icon: tabler:truck
content_protection:
  tagline: Zaščita IP
  title: Kaj ne delimo<br />in zakaj
  subtitle: Zaščita našega inženirskega IP nam omogoča, da še naprej vlagamo v R&R, hkrati pa zagotavljamo vse, kar kupci potrebujejo za načrtovanje projektov.
  items:
    - title: Podatki jedra kalupa trupa
      description: Geometrija vtiča in kalupa, CNC poti orodij ter laminacijski predlogi so lastniški proizvodni viri. Ne delijo se na nobeni ravni dostopa zunaj potrjenih NDA pogodb.
      icon: tabler:ban
    - title: Širjenje rezanja cevi
      description: Datoteke za rezanje ravnih vzorcev za cevni material so podatki na proizvodni ravni. Na voljo samo pod NDA z potrjenimi proizvodnimi naročili in delijo se le s pogodbeno stranko.
      icon: tabler:ban
    - title: Strukturni izračuni
      description: Podrobne analize napetosti, rezultati FEM in laminacijski načrti so dokumenti, občutljivi na skladnost, ki se delijo samo z obveščenimi organi in NDA-vezanimi strankami med postopkom ocenjevanja skladnosti.
      icon: tabler:ban
    - title: Preverjanje konkurence
      description: Pridržujemo si pravico, da zavrnemo zahteve za dostop do CAD, za katere se zdi, da prihajajo od konkurentov, študentov brez konteksta projekta ali strank brez zakonitih namenov nabave.
      icon: tabler:shield
content_models:
  tagline: Na voljo modeli
  title: Tehnična risba<br />Razpoložljivost po modelu
  subtitle: PDF prenosi GA so na voljo za naše glavne modele RIB in napihljive čolne. Za specifične modele, ki niso na seznamu, nas kontaktirajte.
  items:
    - title: AF580 RIB
      description: 5,8 m RIB, trup GRP deep-V, Hypalon ali PVC cevi, sredinska konzola. Na voljo GA, dimenzije, razpored palube in transportni načrt. Kategorija dizajna C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, GRP trup z zmerno V obliko, Hypalon ali PVC cevke, stranski ali sredinski konzolni upravljavec. GA in dimenzije so na voljo. Kategorija oblikovanja C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, GRP trup, PVC cevke, krmilo ali konzola. GA in dimenzije so na voljo. Kategorija oblikovanja C/D.
      icon: tabler:sailboat
    - title: AF380 Napihljiva Čoln
      description: 3,8 m napihljiva gumenjak, aluminijasto dno, PVC cevke. GA in dimenzije pakiranja so na voljo. V skladu z EN ISO 6185.
      icon: tabler:sailboat
    - title: AF320 Napihljiva Čoln
      description: 3,2 m napihljiv čoln, zračni talni pod, PVC cevke. GA in dimenzije pakiranja so na voljo. V skladu z EN ISO 6185.
      icon: tabler:sailboat
