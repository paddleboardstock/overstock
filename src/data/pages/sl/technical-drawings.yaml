content_version_control:
  tagline: Nadzor različic
  title: Verzija risbe<br />Upravljanje
  subtitle: Vsaka risba sledi sistemu nadzorovanih revizij. Vedno preverite, ali imate trenutno revizijo, preden risbe uporabite za načrtovanje projekta.
  items:
    - title: Spremljanje sprememb
      description: Vsaka risba nosi kodo revizije (Rev-A, Rev-B, Rev-C), datum izdaje, datum zadnjega pregleda, ustrezen model/konfiguracijo, enote, velikost datoteke in format. Samo "Trenutna" revizija je na voljo za prenos.
      icon: tabler:git-branch
    - title: Obvestilo o statusu risbe
      description: Vse javne risbe so označene z "Samo predhodna postavitev — ni za gradnjo, certificiranje ali proizvodno uporabo. Dimenzije so predmet končne specifikacije in potrditve naročila." To ščiti obe strani pred napačno uporabo.
      icon: tabler:alert-circle
    - title: Obvestila o posodobitvah
      description: Ko se spremeni specifikacija modela, se posodobi revizija risbe, prejšnje različice pa so označene kot »Zamenjano«. Registrirani uporabniki, ki so prenesli pakete DXF/DWG, so o pomembnih posodobitvah obveščeni po e-pošti.
      icon: tabler:bell
faq:
  title: Tehnične risbe — Pogosto zastavljena vprašanja
  questions:
    - q: Ali so GA PDF-ji res brezplačni?
      a: Da. PDF-ji splošne razporeditve za naše glavne modele so na voljo brezplačno — izpolnite spodnji kratek obrazec za kvalifikacijo in povezava za prenos bo poslana po e-pošti v roku enega delovnega dne. Vsebujejo informacije na ravni načrtovanja, dovolj za oceno projekta, razporeditev prostora in predhodni pregled specifikacij.
    - q: Kako dostopam do datotek DXF/DWG?
      a: Izpolnite kratek obrazec za kvalifikacijo na strani za prenos s svojim imenom podjetja, vrsto projekta in predvideno uporabo. Odobrene zahteve prejmejo povezavo za prenos po e-pošti v roku enega delovnega dne.
    - q: Ali lahko dobim STEP/IGES 3D modele?
      a: Datoteke 3D modelov STEP ali IGES so na voljo preko našega postopka prijave projekta. Navedite obseg svojega projekta, zahteve za integracijo, časovni okvir in namero o nakupu. Podvrženo odobritvi — običajno v 3-5 delovnih dneh.
    - q: Zakaj omejujete dostop do datotek z več podrobnostmi?
      a: Geometrija trupa, podatki o kalupih in strukturni izračuni predstavljajo večletne naložbe v raziskave in razvoj ter so ključna proizvodna intelektualna lastnina. Zagotavljamo vse, kar je potrebno za načrtovanje nabave in integracijo projektov, ob tem pa ščitimo našo sposobnost za nadaljnje vlaganje v razvoj novih izdelkov.
    - q: Ali risbe vključujejo proizvodne podrobnosti?
      a: Ne. Javni in risbe lahke oblike vsebujejo podatke na ravni nabave za načrtovanje in specifikacijo. Podrobnosti na ravni proizvodnje (razporedi laminacij, poti orodij, širjenja rezanja) se delijo le pod NDA z potrjenimi naročili.
    - q: Ali so risbe na voljo za prilagojene ali pol-prilagojene RIB konfiguracije?
      a: Prilagojene projektne risbe se pripravijo kot del procesa razvoja OEM/ODM. Če ocenjujete prilagojen projekt RIB, nas kontaktirajte z vašimi zahtevami in zagotovili vam bomo projektno-specifične GA risbe kot del predloga.
