content_capability:
  tagline: Inženirska zmogljivost
  title: Kaj naše inženirstvo<br />Ekipa dostavi
  subtitle: Paddle Board Overstock inženirstvo pokriva celoten življenjski cikel izdelka — od raziskav trga in konceptualnega oblikovanja do izdelave prototipov, testiranja in množične proizvodnje.
  items:
    - title: Industrijsko oblikovanje
      description: Naša ekipa za industrijsko oblikovanje deluje na podlagi zahtev strank, raziskav trga in analize konkurence, da razvije koncepte izdelkov, ki uravnotežijo estetiko, funkcionalnost in možnost izdelave. Pripravimo 2D skice, 3D upodobitve in specifikacijske dokumente za pregled strank, preden se odločimo za izdelavo orodij.
      features:
        - Razvoj koncepta in študije izvedljivosti
        - 2D tehnične risbe in 3D upodobitve
        - Izbira materiala in specifikacija
        - Analiza oblikovanja za proizvodnjo (DFM)
        - Ergonomska in varnostna ocena
    - title: Strukturno inženirstvo
      description: Naši strukturni inženirji se specializirajo za arhitekturo napihljivih čolnov — oblikovanje trupa, konfiguracija komor cevi, inženiring jedra drop-stitch in porazdelitev bremen. Vsak dizajn je analiziran glede strukturne celovitosti, optimizacije teže in skladnosti z relevantnimi standardi (CE, ISO, AS).
      features:
        - Oblika trupov iz steklenih vlaken z globokim V in izračunanimi koti odklona
        - Konfiguracija cevi z več komorami za varnost in plovnost
        - Drop-stitch jedrna specifikacija in optimizacija gostote
        - Analiza končnih elementov za nosilne komponente
        - Izračuni porazdelitve teže in stabilnosti
    - title: 3D modeliranje in CAD
      description: Vsi produktni dizajni so razviti v 3D CAD pred začetkom izdelave prototipnega orodja. Naši inženirji uporabljajo SolidWorks in Rhino 3D za modeliranje izdelkov, kar omogoča strankam, da pregledajo vsak detajl — od profila cevi do postavitve konzole — preden se odločijo za proizvodnjo.
      features:
        - Polno 3D CAD modeliranje v SolidWorks in Rhino 3D
        - Fotorealistično upodabljanje za predstavitve strankam
        - Tehnične risbe za proizvodnjo
        - Oblikovanje kalupov in orodij iz 3D modelov
        - Neposreden prenos podatkov iz CAD v CNC za natančno rezanje
    - title: Prototipiranje in testiranje
      description: Pred masovno proizvodnjo vsak nov izdelek prestane fazo prototipa. Za oceno stranke izdelamo funkcionalne prototipe, nato pa jih podvržemo našemu celotnemu testnemu protokolu — preizkušanju tlaka, preizkušanju stabilnosti, preizkušanju obremenitve in vodnim preizkusom. Oblikovalne iteracije v fazi prototipa so hitre in stroškovno učinkovite.
      features:
        - Orodja za hitro prototipiranje (15-20 dni za izvedbo)
        - Funkcionalni prototip za evalvacijo v realnem svetu
        - Polni preizkusni protokol pred potrditvijo proizvodnje
        - Iterativno izpopolnjevanje oblikovanja na podlagi rezultatov testov
        - Mejnica odobritve stranke pred izdelavo orodij za proizvodnjo
    - title: Integracija po meri dodatkov
      description: Mnogi OEM projekti zahtevajo integracijo dodatkov, ki jih zagotovi stranka ali tretja oseba — po meri izdelane konzole, specializirana sedišča, elektronski sistemi, nosilci za potapljaško opremo ali elementi blagovne znamke. Naša inženirska ekipa upravlja z oblikovanjem integracije, strukturno prilagoditvijo in preverjanjem kakovosti vseh dodatkov.
      features:
        - Oblikovanje konzole in razporeditev instrumentne plošče
        - Integracija po meri sedežev in oblazinjenja
        - Elektronsko načrtovanje sistemov in ožičenje
        - Sistemi za montažo opreme za potapljanje in reševanje
        - Specifikacije blagovne znamke in grafične uporabe
content_process:
  tagline: Razvojni proces
  title: Od koncepta<br />v proizvodnjo
  subtitle: Naš proces razvoja izdelkov sledi strukturiranemu šeststopenjskemu delovnemu toku, zasnovanemu za zmanjšanje tveganja, skrajšanje časovnih rokov in zagotavljanje pripravljenosti proizvodnje od prvega dne.
  stages:
    - stage: '01'
      title: Zahteve in raziskave
      duration: 1-2 tedna
      description: Sodelujemo s stranko pri določanju specifikacij izdelka, zahtev ciljnega trga, potreb po skladnosti z zakonodajo in komercialnih ciljev. Ta faza prinese Dokument o zahtevah izdelka (PRD), ki usmerja vse nadaljnje delo.
      deliverables: PRD, analiza trga, konkurenčni primerjalni pregled, preliminarna ocena stroškov
    - stage: '02'
      title: Konceptni dizajn
      duration: 2-3 tedne
      description: Industrijska oblikovalska ekipa razvija koncepte izdelkov na podlagi PRD. Na voljo je več možnosti načrtovanja s 3D vizualizacijami, priporočili materialov in začetnimi inženirskimi ocenami. Naročnik izbere smer za podroben razvoj.
      deliverables: 3D konceptualne upodobitve, specifikacije materialov, utemeljitve zasnove, preliminarni BOM
    - stage: '03'
      title: Podrobno inženirstvo
      duration: 2-4 tedne
      description: Izbrani koncept je popolnoma inženirski — 3D CAD modeliranje, strukturna analiza, konfiguracija cevi, načrtovanje trupa, integracija dodatkov in proizvodna dokumentacija. Vse dimenzije, materiali in postopki so določeni za orodja.
      deliverables: Celoten 3D CAD model, inženirske risbe, končni BOM, specifikacije orodij, QC načrt
    - stage: '04'
      title: Prototipiranje
      duration: 2-3 tedne
      description: Izdelajo se prototipna orodja in izdelajo funkcionalni vzorci. Naročnik pregleda prototip glede na specifikacije PRD. Testiranje poteka po dogovorjenem protokolu. Prilagoditve zasnove se izvajajo na podlagi povratnih informacij pred izdelavo proizvodnih orodij.
      deliverables: Funkcionalni prototip, testno poročilo, dnevnik revizij zasnove, dokument o podpisu naročnika
    - stage: '05'
      title: Proizvodna orodja
      duration: 2-3 tedne
      description: Ko je prototip odobren, se zaženejo proizvodna orodja — kalupi, varilne priprave, programi rezanja, montažni pritrdilni elementi. Dokumentacija kakovosti in kriteriji za inšpekcijo so dokončni. Izveden je preizkus za validacijo procesov.
      deliverables: Proizvodna orodja, dokumentacija procesov, načrt inšpekcije QC, poročilo o preizkusu
    - stage: '06'
      title: Množična proizvodnja in kontrola kakovosti
      duration: V teku
      description: Polna proizvodnja se začne s kontrolo kakovosti med procesom v vsaki fazi. Prvi izdelki so pregledani in odobreni pred izdajo serij. Nenehno spremljanje kakovosti, sledenje napakam in neprekinjeno izboljševanje skozi celoten življenjski cikel proizvodnje.
      deliverables: Proizvodni načrt, poročila o kontroli kakovosti, zapisi o sledljivosti serij, dokumentacija za pošiljanje
content_customization:
  tagline: Možnosti prilagajanja
  title: Kaj je lahko<br />Prilagojeno
  subtitle: Skoraj vsak vidik naših izdelkov je mogoče prilagoditi zahtevam strank. Spodaj so najpogostejše kategorije prilagoditev.
  columns: 3
  items:
    - title: Trup in struktura
      description: Prilagojena dolžina trupa, širina širine, kot mrtvega dviga, premer cevi, konfiguracija komore in kakovost materiala.
      icon: tabler:sailboat
    - title: Barve in grafika
      description: Barva cevi (PVC/Hypalon), barva gelcoata trupa, barva konzole, grafika palube, postavitev logotipa in oblikovanje embalaže.
      icon: tabler:palette
    - title: Konzola in kontrole
      description: Sredinska konzola, stranska konzola ali krmilno krmiljenje. Prilagojena razporeditev instrumentne plošče, položaj stikal in položaj krmila.
      icon: tabler:steering-wheel
    - title: Sedeži in oblazinjenje
      description: Jockey sedeži, klopi, luksuzna oblazinjenost, barvno usklajeni šivi, zložljive ali odstranljive konfiguracije.
      icon: tabler:armchair
    - title: Dodatki in oprema
      description: Potapljaške lestve, nosilci rezervoarjev, vlečni stebri, T-topi, Bimini vrhovi, zvočni sistemi, navigacijska elektronika in varnostna oprema.
      icon: tabler:backpack
    - title: Embalaža in blagovna znamka
      description: Prilagojena maloprodajna embalaža, škatle z zasebno znamko, pošiljke kartonov z blagovnimi oznakami, obeski in uporabniški priročniki v jeziku naročnika.
      icon: tabler:box
content_industries:
  tagline: Industrijske uporabe
  title: Inženirske rešitve<br />po industriji
  subtitle: Naša inženirska ekipa je razvila izdelke za širok spekter morskih aplikacij — vsaka z različnimi zahtevami in kriteriji zmogljivosti.
  columns: 3
  items:
    - title: Potapljaške operacije
      description: Ojačane plošče, integracija potapljaške lestve, sistemi za shranjevanje jeklenk in stabilne platforme za komercialne potapljaške centre po vsem svetu.
      icon: tabler:lifebuoy
    - title: Reševanje in nujne primere
      description: Oblike trupa za visoke hitrosti, samopraznilne kocke, sistemi za montažo opreme in večkomorni varnostni sistemi za SAR operacije.
      icon: tabler:alert-triangle
    - title: Morski turizem
      description: Postavitve za udobje potnikov, integracija senčnikov, vkrcajni sistemi in konfiguracije z nizko porabo goriva za operacije prenosa na otoke.
      icon: tabler:beach
    - title: Jahtni tenderji
      description: Kompaktne zasnove za shranjevanje davitov, možnosti luksuzne obdelave, usklajene barve matičnega plovila in visokozmogljive vlečne karakteristike.
      icon: tabler:sailboat
    - title: Ribolov in akvakultura
      description: Konfiguracije ravnih palub, integracija živega rezervoarja, postavitve držalcev palic, okovje odporen proti koroziji za stalno izpostavljenost slani vodi.
      icon: tabler:fish
    - title: Luka in industrijski
      description: Okrepitev trupa za težka bremena, postavitve delovnih čolnov, konfiguracije za prevoz oseb in integracija opreme za offshore operacije.
      icon: tabler:ship
