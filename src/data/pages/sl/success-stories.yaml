hero:
  tagline: Uspešne zgodbe
  title: Pravi rezultati od<br />Water Business Builders
  subtitle: Oglejte si, kako so klubi, letovišča in podjetniki po vsem svetu zgradili dobičkonosne dejavnosti vodnih športov z Aquafarer opremo in podporo.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer zgodbe o uspehu strank
stories:
  - title: Kako je sredozemsko letovišče zgradilo dobičkonosno poslovanje zSUP najemom
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5-zvezdično obmorsko letovišče — Grčija
    problem: Letovišče je potrebovalo vrhunske aktivnosti za goste na vodi, da bi povečalo ocene zadovoljstva in ustvarilo nov vir dohodka, vendar so jim manjkali oprema, varnostna infrastruktura in strokovno znanje osebja.
    solution: Aquafarer je dostavil 50 plošč SUP po meri z barvami in logotipom letovišča, celoten varnostni sistem vključno z reševalno postajo in plavalnimi linijami ter tridnevni program usposabljanja osebja, ki je zajemal rokovanje z opremo, poučevanje gostov in varnostne protokole.
    result:
      - 300+ tedenskih aktivnosti za goste rezerviranih v prvem mesecu
      - 'Ocene zadovoljstva gostov za vodne aktivnosti: 4,8/5'
      - 'Novi letni dodatni prihodki: 180 tisoč $'
      - Brez varnostnih incidentov v prvi sezoni obratovanja
      - Stroški zamenjave opreme znižani za 40 % v primerjavi s prejšnjim dobaviteljem
    quote:
      text: Aquafarer ni le dostavil plošč — pomagal nam je zgraditi celotno izkušnjo za goste. Naš program vodnih športov se je v eni sezoni prelevil iz nič v vrhunec letovišča.
      author: Generalni direktor letovišča
    cta_text: Zgradite rešitev za vaše letovišče
    cta_href: /solutions/resorts
  - title: Kako je avstralski startup v 90 dneh zgradil vodno znamko
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Podjetnik začetnik — Avstralija
    problem: Nadobudni ljubitelj aktivnosti na prostem je želel lansirati svojo SUP znamko za avstralski trg, vendar ni imel izkušenj v proizvodnji, nobenih odnosov z dobavitelji in omejen kapital.
    solution: Paket za lansiranje znamke Aquafarer je zagotovil svetovanje pri izbiri izdelkov, oblikovanje logotipa in barv po meri, embalažo za maloprodajo z oznakami, CE dokumentacijo o certifikaciji in FOB pošiljanje v Sydney.
    result:
      - Prva pošiljka 200 plošč dostavljena v 75 dneh po prvem stiku
      - Znamka lansirana na Shopify + Amazon AU v dveh tednih po prihodu
      - Začetni zalogi je zmanjkalo v 45 dneh
      - 'Povprečna marža: 55 % maloprodajne cene'
      - 'Drugo naročilo: 500 enot naročenih v 60 dneh po lansiranju'
    quote:
      text: Imel sem idejo za znamko, vendar nič znanja o proizvodnji. Aquafarer mi je praktično držal roko skozi celoten proces — od izbire pravega dizajna plošče do razpakiranja prve pošiljke. 90 dni od sanj do dostave.
      author: Ustanovitelj, avstralska SUP znamka
    cta_text: Lansirajte svojo znamko
    cta_href: /solutions/entrepreneurs
  - title: Kako je tajski obmorski klub razširil svoj nabor od 10 do 80 plošč
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Klub vodnih športov — Tajska
    problem: Majhen obmorski SUP klub v Phuketu je moral preiti iz hobijskega delovanja na profesionalno prodajo opreme za turiste, vendar ni mogel najti zanesljivega dobavitelja z dosledno kakovostjo in cenami.
    solution: Začetek s Klubskim začetnim paketom Aquafarer (10 deske, vesla, varnostna oprema, blagovna znamka) je klubu omogočil rast preko programa Premium paket v 18 mesecih.
    result:
      - Povečali so število desk s 10 na 80 v 18 mesecih z dosledno kakovostjo in cenami
      - Dodali so najem kajakov in pedalnih čolnov z istim dobaviteljem
      - Prilagojena blagovna znamka kluba je povečala prepoznavnost med turisti
      - Stroški vzdrževanja so bili 60% nižji v primerjavi s prejšnjo opremo
      - Zdaj nudijo 150+ dnevnih najemov v sezonskem vrhu
    quote:
      text: Klubski začetni paket je bil popolna vstopna točka. Ko je naše podjetje raslo, je Aquafarer rasel z nami — enaka kakovost, enake cene, nobenih presenečenj.
      author: Lastnik kluba, Phuket
    cta_text: Začnite s svojim klubskim paketom
    cta_href: /solutions/clubs
  - title: Kako je veriga karibskih letovišč standardizirala vodne športe na 5 lokacijah
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Veriga letovišč — Karibi
    problem: Luksuzna veriga letovišč s 5 lokacijami je potrebovala enotno kakovost opreme za vodne športe in blagovno znamko na vseh lokacijah, s centraliziranimi nabavami in sezonskim načrtovanjem zamenjav.
    solution: Aquafarer je zagotovil floto več enot z 300 SUPs in 100 kajaki z enotno blagovno znamko, skupnim zalogami rezervnih delov in letnim načrtom zamenjav po količinskih cenah.
    result:
      - Standardizirali gostovsko izkušnjo na vseh 5 lokacijah
      - 30% zmanjšanje stroškov s konsolidiranim nakupom in količinskim popustom
      - Centralizirana zaloga rezervnih delov je zmanjšala izpade za 80%
      - Letni program osvežitve opreme je odpravil sezonski kaos
      - Udeležba gostov na vodnih športih se je povečala za 45% na letni ravni
    cta_text: Naredite svoj program letovišča
    cta_href: /solutions/resorts
