hero:
  tagline: Mixed Model Wholesale
  title: Mixed Model Wholesale Paddle Boards —<br />Mix Different SUP Models in One Order
  subtitle: Why lock your budget into one model? Combine any in-stock SUP boards — all-around, touring, surf, and art editions — in a single wholesale order, with a total as low as 5 boards.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: A mixed order of different inflatable SUP board models from Paddle Board Overstock
direct_answer: Mixed model wholesale lets a small retailer order several different SUP models in one consolidated shipment instead of a bulk quantity of a single board. At Paddle Board Overstock, any in-stock models can be combined, the order minimum is 5 boards total, and the total quantity determines the pricing tier. Mixed orders ship from Weihai, China by express air freight (1–3 boards) or consolidated sea freight (5–20 boards) to 50+ countries, and every board is 100% pressure-tested and covered by the 2-Year SUP Warranty.
tldr_points:
  - "Mix any in-stock SUP models in one order — no per-model minimums"
  - "Total order quantity (not per-model quantity) sets your pricing tier"
  - "Start at 5 boards total — built for small retailers, not container loads"
  - "One consolidated shipment: one freight cost, one customs clearance, one delivery"
why_mixed:
  tagline: Why Mixed?
  title: Mix & Match. Buy More Variety. Spend Less.
  subtitle: A shelf of identical boards serves one kind of paddler. A mixed order turns the same budget into a full product line.
  items:
    - title: More Variety on Your Shelf
      description: Combine all-around boards for beginners, touring boards for adventurers, and surf-style boards for riders — one order covers your whole customer range.
    - title: Lower Risk per Model
      description: Instead of betting your season on one model, order 2–4 of each. If one model outsells the rest, restock it next order with real sales data.
    - title: Test What Sells in Your Market
      description: Every beach, lake, and city has different demand. A mixed first order is the cheapest market research there is — stock six models, see which ones move.
    - title: Better Margins on Art Editions
      description: Premium art-series boards (Leviathan Wake, Medusa Glow, Ocean Voyager) carry higher retails. Mix a few into a base of all-around boards to lift your average margin.
    - title: One Consolidated Shipment
      description: One mixed order means one freight booking, one customs clearance, and one delivery — instead of five separate shipments from five separate suppliers.
how_it_works:
  tagline: How It Works
  title: How a Mixed Model Order Works
  steps:
    - title: Pick Your Mix
      description: Choose the models and quantities for your market — or use the selector below to draft a combination and see the board count and total value update live.
    - title: Request a Quote
      description: Send us the mix. We confirm current stock for every model and quote unit pricing plus express and sea freight options to your country.
    - title: Confirm the Order
      description: Approve the final quote — models, quantities, freight, total. We lock the stock and schedule dispatch from Weihai.
    - title: We Test Every Board
      description: Each board in your mixed order is 100% pressure-tested to 15 PSI before packing — same standard for every model, whether it is an entry all-arounder or an art edition.
    - title: One Delivery to Your Door
      description: The full mixed order ships together — express air for small orders, consolidated sea freight for 5–20 boards — with tracking door to door.
