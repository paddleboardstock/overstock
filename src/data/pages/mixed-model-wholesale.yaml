who_benefits:
  tagline: Who Can Benefit
  title: Who Mixed Model Wholesale Is For
  items:
    - title: First-Time Importers
      description: Testing the SUP category with a spread of models instead of committing to one bulk SKU.
    - title: Seasonal Beach Retailers
      description: Shops that need beginner boards for tourists and premium editions for locals — in the same restock order.
    - title: Online Sellers
      description: Listing several models at once to learn which artwork, length, and use case converts best.
    - title: Rental Fleets & Schools
      description: Fleets that need varied board sizes for different rider weights and lesson types, not a single-spec fleet.
faq_section:
  title: Mixed Model FAQ
  items:
    - q: Is there a minimum quantity per model?
      a: No. The 5-board minimum applies to the total order, not to each model. You could order 5 different models, one board each.
    - q: Does mixing models change the price?
      a: Wholesale unit pricing is quoted per model, but your pricing tier improves with the total board count — mixing models does not penalize you.
    - q: Can I mix boards and accessories?
      a: Yes — spare paddles, pumps, and repair kits can be added to a mixed order. Ask in your inquiry.
    - q: How do I know which models suit my market?
      a: Send us a note about your customers (coastal or inland, tourists or locals, beginners or riders) in the inquiry form and we will recommend a mix.
