articles:
  sup:
    - title: SUP Alapok — Kezdő útmutató
      desc: Minden, amit egy kezdőnek tudnia kell — deszkafajták, ütőméretek, testtartás és első napi tippek.
    - title: SUP Méret útmutató
      desc: Találd meg a megfelelő deszkahosszt, szélességet és térfogatot a súlyodhoz, képességedhez és evezési stílusodhoz.
    - title: Felfújható vs kemény tábla
      desc: Mi a megfelelő számodra? Hordozhatóság, teljesítmény, tartósság és költség összehasonlítása.
    - title: Köztes technikák
      desc: Fejleszd evezésedet haladó lapátfogásokkal, kanyarodási technikákkal és hullámos vízen való irányítással.
    - title: Hogyan válassz felfújható SUP-t
      desc: A legfontosabb tényezők áttekintése — szerkezet, vastagság, uszony elrendezés és tartozékok.
    - title: Vízbiztonság
      desc: Alapvető biztonsági ismeretek, beleértve az időjárás olvasását, PFD kiválasztását, önmentést és csoportos evezést.
  inflatable-boat:
    - title: Anyagreferencia
      desc: Drop-stitch magok, PVC laminátok, EVA fedélhab és denier értékelések — értsd meg, miből áll a deszkád.
    - title: EVA Deszkaművészet magyarázata
      desc: Hogyan vágják ki a több színű EVA blokkokat formára, és rakják össze kézzel darabolt pakli művészetté, hosszú élettartamú színteljesítménnyel.
    - title: Drop-Stitch A Magyarázat
      desc: Hogyan hoznak létre több ezer belső szálat egy merev platformot 15 PSI -on a nagy teljesítményű felfújható SUPs számára.
    - title: Felfújható technológia áttekintése
      desc: Hogyan készülnek a felfújható paddle boardok — az anyagrétegezéstől a szeleprendszerekig és a varráshegesztésig.
    - title: Élszegély- és varráskonstrukció
      desc: Hogyan tartják a hármas rétegű élszegélyek és az RF-hegesztett varratok a deszkát teljes nyomáson légmentesen.
    - title: Miért számít a 15 PSI
      desc: Hogyan nyitja meg a légnyomás a csomagolható felfújható deszkából a merev, kemény deszka teljesítményt.
  water-safety:
    - title: Vízbiztonsági útmutató
      desc: Alapvető biztonsági ismeretek minden evező számára — időjárás, mentőmellények, önmentés és csoportos evezési protokollok.
    - title: Mentőmellény & PFD útmutató
      desc: Hogyan válasszuk ki a megfelelő személyi mentőmellényt a stand-up paddle boardozáshoz — felhajtóerő minősítések, illeszkedés és kényelem.
    - title: SUP Biztonsági ellenőrzőlista
      desc: Előindítási biztonsági ellenőrzőlista, amit minden álló eveződeszkásnak követnie kell, mielőtt vízre lép.
    - title: Hideg vízi evezés biztonsága
      desc: Alapvető óvintézkedések, felszerelések és technikák a hideg vízi evezéshez.
    - title: Kezdő evezési hibák
      desc: Gyakori hibák, amelyeket az első alkalommal evezők elkövetnek, és hogyan lehet elkerülni őket a biztonságosabb és élvezetesebb élmény érdekében.
    - title: Póráz és PFD Biztonsági Szabályok
      desc: Amikor a póráz elengedhetetlen, mely PFD típusok működnek SUP számára, és a biztonsági felszerelés, amit minden evezősnek magánál kell hogy hordjon.
ui:
  read_guide: Olvassa el az útmutatót →
  card_tech: Biztonsági mérnöki munka és anyagvizsgálat
  card_products: Fedezze fel a teljes Paddle Board Overstock termékkatalógust
  card_trust: Gyárilag tesztelt minőség 2 év garanciával
materials:
  intro_p1: Egy felfújható paddle board teljesítménye, tartóssága és biztonsága szinte teljes mértékben az anyagoktól függ, amelyekből készült. A hajót alkotó lamináttól kezdve a szálakon át, amelyek merevséget adnak egy SUP deszkának, minden anyagválasztás befolyásolja a termék vízen való viselkedését és élettartamát.
  intro_p2: 'Ez az útmutató a modern felfújható paddle boardok három fő anyagát tárgyalja: a PVC laminátumot, a drop-stitch magot és a EVA habburkolatot. Ezeknek az anyagoknak a megértése segít kiválasztani a megfelelő deszkát az igényeidhez, és a karbantartással maximalizálni az élettartamot.'
  labels:
    advantages: Előnyök
    limitations: Korlátozások
    best_for: 'A legjobb:'
  items:
    - name: PVC (Polivinil-klorid)
      summary: A felfújható SUPs ipari szabványa. A többrétegű laminált szövet kiváló szilárdság-súly arányt kínál megfizethető áron.
      pros:
        - Kiváló ár-érték arány
        - Könnyű és könnyen kezelhető
        - Jó UV ellenállás a megfelelő bevonatokkal
        - Széles szín- és kivitelezési választék
        - Könnyen javítható PVC javítófoltokkal és oldószeres ragasztóval
      cons:
        - Átlagos élettartam 7-10 év megfelelő gondozás mellett
        - Kevésbé rugalmas hideg hőmérsékleten
        - Alacsonyabb vegyi ellenállás
        - Az idő múlásával plasztifikálószer-kivándorlás léphet fel
      best_for: Szabadidős és túra SUPs, családi evezés, szezonális használat, édesvízi és tengerparti környezetben.
    - name: Drop-Stitch mag
      summary: A technológia, amely forradalmasította a felfújható SUPs-t. Ezernyi poliészter szál köti össze a felső és alsó textilréteget, lehetővé téve a nagy nyomású felfújást a merev, kemény héjszerű teljesítmény érdekében.
      pros:
        - Rendkívül merev 12-20 PSI
        - Könnyű — teljes méretű deszka esetén 18-30 font
        - Összehajtható laposan tároláshoz és utazáshoz
        - Kiváló ütésállóság
        - Konzisztens teljesítmény a hőmérséklet-ingadozások között
      cons:
        - Nagy nyomású pumpát igényel
        - A lyukjavítás bonyolultabb, mint az egyrétegű deszkák esetében
        - Magasabb gyártási költség, mint a hagyományos felfújhatóknál
        - Az idővel bekövetkező nyomáscsökkenés rendszeres utántöltést igényel
      best_for: Álló evezős deszkák és minden felszerelés, amely merev teljesítményt igényel felfújható hordozhatósággal.
    - name: EVA Habfedélzet
      summary: Zárt sejtszerkezetű EVA (etilén-vinil-acetát) hab, amelyet SUP deszkák tapadófelületein használnak. Párnázást, tapadást és hőszigetelést biztosít — és hordozza az art-sorozat dizájnjait.
      pros:
        - Kiváló csúszásmentes tapadás nedves vagy száraz állapotban
        - A párnázás csökkenti a fáradtságot hosszú evezések során
        - Hőszigetelés a hideg fedélzetről
        - UV és sós vízzel szemben ellenálló
        - Többszínű blokkos darabolásban és lézergravírozott mintákkal elérhető
      cons:
        - Erős használat mellett 2-3 évig viselhető
        - Megfelelően kell ragasztani a rétegleválás megelőzésére
        - Nem szerkezeti — nem befolyásolja a merevséget
        - Néhány grammal növeli a súlyt (200–400 g laponta)
      best_for: SUP fedélzet tapadás, art-sorozat fedélzet dizájnok és minden felület, amely csúszásmentes talajfogást igényel.
  selection:
    title: Anyagválasztási útmutató
    subtitle: 'Válassza ki a megfelelő anyagot a fő felhasználási terület alapján:'
    headers:
      - Használati eset
      - Ajánlott anyag
      - Miért
    rows:
      - - Szabadidős SUP evezés
        - Drop-stitch PVC
        - Könnyű, merev, megfizethető — ideális egyensúly alkalmi evezősöknek
      - - Családi és kezdő evezés
        - Széles drop-stitch PVC (32"+)
        - Stabil és megbocsátó — magabiztosság kezdő evezőknek
      - - Horgászat és felszerelésben gazdag evezés
        - Széles drop-stitch PVC teljes EVA fedélzettel
        - Extra stabilitás álláshoz és dobáshoz, nagy térfogat a felszerelésnek
      - - Bérelhető flották SUP deszkái
        - Drop-stitch PVC + EVA fedél
        - Tartós, javítható, jó ár-érték arány magas forgású használathoz
      - - Túrázás és hosszabb evezések
        - Drop-stitch PVC (~11 láb)
        - Jobb iránytartás és csúszási hatékonyság távolságra
      - - Jóga és fitnesz evezés
        - Széles drop-stitch PVC teljes EVA fedélzettel
        - Stabil, kényelmes platform pózokhoz és edzésekhez
  deep_dive:
    title: Mély merítés útmutatók
    topics:
      - title: Tengeri minőségű PVC
        desc: Többrétegű laminált PVC szövet — UV ellenállás, kopásvizsgálat és denier besorolások magyarázata.
      - title: PVC Laminált rétegek
        desc: Hogyan egyensúlyozza a többrétegű laminált PVC az erőt, súlyt és UV ellenállást.
      - title: Drop-Stitch mag
        desc: Hogyan hoznak létre ezrek a belső szálakból merev, nagy nyomású felfújható struktúrákat 15 PSI alatt.
      - title: RF hegesztési technológia
        desc: A nagyfrekvenciás hegesztés erős, egyenletes varratokat hoz létre — hogyan működik és miért fontos.
      - title: PSI & Teljesítmény
        desc: Miért fontos a légnyomás a felfújható SUPs esetében — merevség, súlykapacitás és utazási minőség.
      - title: Minőség ellenőrzés
        desc: Nyomáspróba, felhajtóerő tesztek, UV öregedés és destruktív tesztek — a mi minőségi folyamatunk.
      - title: EVA Habfedélzetek
        desc: Zárt sejtes EVA hab fedélzeti párnák — tapadás, kényelem és tartósság SUP fedélzetekhez.
      - title: Anyagápolás
        desc: Tisztítás, UV védelem, penészmegelőzés és tárolási bevált gyakorlatok felfújható termékekhez.
