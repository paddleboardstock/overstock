articles:
  sup:
    - title: SUP Alapok — Kezdő útmutató
      desc: Minden, amit egy kezdőnek tudnia kell — deszkafajták, ütőméretek, testtartás és első napi tippek.
    - title: SUP Méret útmutató
      desc: Találd meg a megfelelő deszkahosszt, szélességet és térfogatot a súlyodhoz, képességedhez és evezési stílusodhoz.
    - title: Felfújható vs kemény tábla
      desc: Mi a megfelelő számodra? Hordozhatóság, teljesítmény, tartósság és költség összehasonlítása.
    - title: Köztes technikák
      desc: Fejleszd evezésedet haladó lapátfogásokkal, kanyarodási technikákkal és hullámos vízen való irányítással.
    - title: Hogyan válassz felfújható SUP-t
      desc: A legfontosabb tényezők áttekintése — szerkezet, vastagság, uszony elrendezés és tartozékok.
    - title: Vízbiztonság
      desc: Alapvető biztonsági ismeretek, beleértve az időjárás olvasását, PFD kiválasztását, önmentést és csoportos evezést.
  inflatable-boat:
    - title: Anyagreferencia
      desc: PVC, Hypalon, drop-stitch, denier besorolások — értsd meg, miből készül a felfújható felszerelésed.
    - title: PVC vs Hypalon
      desc: A PVC és Hypalon szövetek végleges összehasonlítása felfújható hajókhoz — tartósság, UV ellenállás és költség.
    - title: Drop-Stitch A Magyarázat
      desc: Hogyan hoznak létre ezrek belső szálak merev platformot 12–15 PSI-nél nagy teljesítményű felfújható SUPs számára.
    - title: Felfújható technológia áttekintése
      desc: Hogyan épülnek a felfújható hajók és SUPs — az anyagrétegezéstől a szeleprendszerekig és a varráshegesztésig.
    - title: Rögzített Felfújható Hajó (RIB) útmutató
      desc: Minden a RIB szerkezetről, a hajótest típusokról, a csőanyagokról és a számodra megfelelő RIB kiválasztásáról.
    - title: Felfújható hajó vs RIB
      desc: Kulcsfontosságú különbségek a hagyományos felfújható csónakok és a merev testű felfújható hajók között különböző felhasználási esetekre.
  water-safety:
    - title: Vízbiztonsági útmutató
      desc: Alapvető biztonsági ismeretek minden evező számára — időjárás, mentőmellények, önmentés és csoportos evezési protokollok.
    - title: Mentőmellény & PFD útmutató
      desc: Hogyan válassz megfelelő személyi mentőfelszerelést SUP, kajakozás, hajózás és professzionális használatra.
    - title: SUP Biztonsági ellenőrzőlista
      desc: Előindítási biztonsági ellenőrzőlista, amit minden álló eveződeszkásnak követnie kell, mielőtt vízre lép.
    - title: Hideg vízi evezés biztonsága
      desc: Alapvető óvintézkedések, felszerelések és technikák a hideg vízi evezéshez.
    - title: Kezdő evezési hibák
      desc: Gyakori hibák, amelyeket az első alkalommal evezők elkövetnek, és hogyan lehet elkerülni őket a biztonságosabb és élvezetesebb élmény érdekében.
    - title: CE Tanúsítvány magyarázata
      desc: Mit jelent a CE tanúsítvány a felfújható vízi járművek esetében — a szabványok, tesztelések és miért fontos ez a biztonság szempontjából.
ui:
  read_guide: Olvassa el az útmutatót →
  card_tech: Tengeri biztonsági mérnöki munka és anyagvizsgálat
  card_products: Fedezze fel a teljes Aquafarer termékkatalógust
  card_trust: CE, ISO és BSCI megfelelőség
materials:
  intro_p1: Egy felfújható vízi jármű teljesítménye, tartóssága és biztonsága szinte teljes mértékben a gyártás során használt anyagoktól függ. A csöveket alkotó szövettől a SUP deszka merevségét adó fonalakig minden anyagválasztás befolyásolja a termék vízen nyújtott teljesítményét és élettartamát.
  intro_p2: 'Ez az útmutató a modern felfújható vízi járművek négy alapvető anyagát tárgyalja: PVC szövet, Hypalon CSM gumi, drop-stitch magkonstrukció és EVA habfedélzet. Ezeknek az anyagoknak a megértése segít a megfelelő termék kiválasztásában és annak maximális élettartamú karbantartásában.'
  labels:
    advantages: Előnyök
    limitations: Korlátozások
    best_for: 'A legjobb:'
  items:
    - name: PVC (Polivinil-klorid)
      summary: A rekreációs felfújható hajók és SUPs ipari szabványa. A többrétegű laminált szövet kiváló szilárdság-súly arányt kínál elérhető áron.
      pros:
        - Megfizethető — 30-50%-kal olcsóbb, mint a Hypalon
        - Könnyű és könnyen kezelhető
        - Jó UV ellenállás a megfelelő bevonatokkal
        - Széles szín- és kivitelezési választék
        - Könnyen javítható PVC javítófoltokkal és oldószeres ragasztóval
      cons:
        - Rövidebb élettartam, mint a Hypalon (7-10 év)
        - Kevésbé rugalmas hideg hőmérsékleten
        - Alacsonyabb vegyi ellenállás
        - Az idő múlásával plasztifikálószer-kivándorlás léphet fel
      best_for: Rekreációs SUPs, költséghatékony hajók, bérflották, szezonális használat, édesvízi és part menti környezet.
    - name: Hypalon (CSM Gumi)
      summary: Prémium szintetikus gumianyag, amely kivételes tartósságáról, UV ellenállásáról és hosszú élettartamáról ismert. Az aranystandard a kereskedelmi és katonai minőségű felfújható hajóknál.
      pros:
        - Kivételes UV és ózon ellenállás
        - 15-20 éves élettartam megfelelő gondozás mellett
        - Kiváló hideg időben való rugalmasság
        - Kiemelkedő vegyi- és olajállóság
        - A színt hosszabb ideig megőrzi, mint a PVC
      cons:
        - Jelentősen drágább, mint a PVC
        - Nehéz szövet
        - Kevesebb színválaszték
        - A javítás speciális ragasztókat igényel
        - Világszerte kevesebb gyártóhely
      best_for: Kereskedelmi RIBs, keresés-mentés, katonai alkalmazások, trópusi éghajlat, hosszú távú flottahasználat.
    - name: Drop-Stitch Mag
      summary: A technológia, amely forradalmasította a felfújható SUPs-t. Ezernyi poliészter szál köti össze a felső és alsó textilréteget, lehetővé téve a nagy nyomású felfújást a merev, kemény héjszerű teljesítmény érdekében.
      pros:
        - Rendkívül merev 12-20 PSI
        - Könnyű — teljes méretű deszka esetén 18-30 font
        - Összehajtható laposan tároláshoz és utazáshoz
        - Kiváló ütésállóság
        - Konzisztens teljesítmény a hőmérséklet-ingadozások között
      cons:
        - Nagy nyomású pumpát igényel
        - A lyukjavítás bonyolultabb, mint az egyrétegű deszkák esetében
        - Magasabb gyártási költség, mint a hagyományos felfújhatóknál
        - Az idővel bekövetkező nyomáscsökkenés rendszeres utántöltést igényel
      best_for: Állítható evezős deszkák, kajakok, felfújható hajók levegőpadlója, minden olyan alkalmazás, amely merev teljesítményt igényel felfújható hordozhatósággal.
    - name: EVA Habfedélzet
      summary: Zárt cellás EVA (etilén-vinil-acetát) hab, amely tapadásnövelő párnákhoz használatos SUP deszkákon és hajófedélzeteken. Párnázást, tapadást és hőszigetelést biztosít.
      pros:
        - Kiváló csúszásmentes tapadás nedves vagy száraz állapotban
        - A párnázás csökkenti a fáradtságot hosszú evezések során
        - Hőszigetelés a hideg fedélzetről
        - UV és sós vízzel szemben ellenálló
        - Többszínű blokkos darabolásban és lézergravírozott mintákkal elérhető
      cons:
        - Erős használat mellett 2-3 évig viselhető
        - Megfelelően kell ragasztani a rétegleválás megelőzésére
        - Nem szerkezeti — nem befolyásolja a merevséget
        - Néhány grammal növeli a súlyt (200–400 g laponta)
      best_for: SUP fedél tapadás, csónakfedél párnázat, kajakülés kényelem, bármilyen felület, amely csúszásmentes talajt igényel.
  selection:
    title: Anyagválasztási útmutató
    subtitle: 'Válassza ki a megfelelő anyagot a fő felhasználási terület alapján:'
    headers:
      - Használati eset
      - Ajánlott anyag
      - Miért
    rows:
      - - Szabadidős SUP evezés
        - Drop-stitch PVC
        - Könnyű, merev, megfizethető — ideális egyensúly alkalmi evezősöknek
      - - Családi kishajó / tóhajó
        - PVC (1100 denier)
        - Költséghatékony, könnyen javítható, elegendő tartósság szabadidős használathoz
      - - Kereskedelmi RIB / járőr csónak
        - Hypalon CSM
        - Maximális UV ellenállás, 15–20 éves élettartam, vegyi/olajállóság
      - - Bérelhető flották SUP deszkái
        - Drop-stitch PVC + EVA fedél
        - Tartós, javítható, jó ár-érték arány magas forgású használathoz
      - - Keresés és mentés műveletek
        - Hypalon CSM
        - Megbízhatóság extrém körülmények között, hidegben is rugalmas, vegyi ellenálló
      - - Túra / expedíciós kajak
        - Drop-stitch PVC
        - Merev teljesítmény csomagolható hordozhatósággal utazáshoz
  deep_dive:
    title: Mély merítés útmutatók
    topics:
      - title: Tengeri minőségű PVC
        desc: Többrétegű laminált PVC szövet — UV ellenállás, kopásvizsgálat és denier besorolások magyarázata.
      - title: PVC vs Hypalon
        desc: A két domináns felfújható csónak anyag végleges összehasonlítása — költség, élettartam, UV ellenállás.
      - title: Drop-Stitch Mag
        desc: Hogyan hoznak létre több ezer belső szálak merev, nagy nyomású felfújható szerkezeteket 12–15 PSI nyomásnál.
      - title: RF hegesztési technológia
        desc: A nagyfrekvenciás hegesztés erős, egyenletes varratokat hoz létre — hogyan működik és miért fontos.
      - title: PSI & Teljesítmény
        desc: Miért számít a légnyomás a felfújható SUPs és csónakok esetében — merevség, teherbírás és menetkomfort.
      - title: Minőség ellenőrzés
        desc: Nyomáspróba, felhajtóerő tesztek, UV öregedés és destruktív tesztek — a mi minőségi folyamatunk.
      - title: EVA Habfedélzetek
        desc: Zárt cellás EVA habfedélzet párnák — tapadás, kényelem és tartósság SUP és csónakfedélzetek számára.
      - title: Anyagápolás
        desc: Tisztítás, UV védelem, penészmegelőzés és tárolási bevált gyakorlatok felfújható termékekhez.
