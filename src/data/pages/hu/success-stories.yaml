stories:
  - title: Hogyan épített egy mediterrán üdülőhely SUP nyereséges bérleti vállalkozást
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5 csillagos tengerparti üdülőhely — Görögország
    problem: Az üdülőhelynek prémium vendégvízi tevékenységekre volt szüksége az elégedettségi pontszámok növelése és új bevételi forrás létrehozása érdekében, de hiányzott a felszerelés, biztonsági infrastruktúra és a személyzeti szakértelem.
    solution: Aquafarer 50 egyedi márkájú SUP táblát szállítottak le üdülő színeivel és logóval, teljes biztonsági rendszert beleértve a mentőállomást és bójavonalakkal, valamint egy háromnapos személyzeti képzési programot, amely magában foglalja a felszereléskezelést, vendégoktatást és biztonsági protokollokat.
    result:
      - Az+ első hónapban 300 heti vendégprogram van lefoglalva
      - 'Vendégelégedettségi pontszám vízi tevékenységek esetén: 4,8/5'
      - 'Új éves kiegészítő bevétel: $180K'
      - Nulla biztonsági incidens az első működési szezonban
      - A berendezéscsere költsége 40%-kal csökkent az előző beszállítóhoz képest
    quote:
      text: Aquafarer Nem csak a táblákat szállították — segítettek teljes vendégélményt teremteni. Vízi sportprogramunk egy szezon alatt nulláról a resort fénypontjává vált.
      author: Üdülőhely általános igazgatója
    cta_text: Építsd meg üdülőmegoldásodat
    cta_href: /solutions/resorts
  - title: Hogyan épített egy ausztrál startup 90 nap alatt vízmárkát
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Első vállalkozó — Ausztrália
    problem: Egy szabadtéri rajongó saját SUP márkáját akarta elindítani az ausztrál piacra, de nem rendelkezett gyártási tapasztalattal, nem volt beszállítói kapcsolata és korlátozott tőkéje.
    solution: AquafarerA Brand Launch Package termékválasztási tanácsadást, egyedi logó- és színtervezést, márkázott kiskereskedelmi csomagolást lógott címkékkel, CE tanúsítási dokumentációt és FOB szállítást biztosított Sydney-be.
    result:
      - Az első szállítmány, 200 deszkolat, 75 napon belül kézbesítettek az első kapcsolatfelvételtől
      - A márka a + Shopify Amazon AU-n két héten belül indult az érkezése után
      - Az első készlet 45 nap alatt elfogyott
      - 'Átlagos árár: 55% kiskereskedelmi áron'
      - 'Második rendelés: 500 egység leadása után 60 napon belül'
    quote:
      text: Megvolt a márkaötletem, de semmi gyártási ismeretem nem volt.Aquafarer Szó szerint végig fogtam a kezemet az egész folyamat során — a megfelelő deszkelau kiválasztásától az első szállítmány kibontásáig. 90 nap az álomtól a szállításig.
      author: Alapító, az Australian SUP Brand
    cta_text: Indítsd el a márkádat
    cta_href: /solutions/entrepreneurs
  - title: Hogyan nőtt egy thai strandklub 10-ről 80 táblára
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Vízi sport klub — Thaiföld
    problem: Egy kis, tengerparti SUP klub Phuketben szükségszerűen átalakult hobbi üzemeltetésből professzionális turistákat kiszolgáló bérlő üzletté, de nem talált megbízható felszerelésbeszállítót, amely következetes minőséget és árazást kínál.
    solution: A Aquafarer Klub Kezdőcsomag (10 deszka, evezők, biztonsági felszerelés, márkajelzés) segítségével a klub a Premium Package programon keresztül 18 hónap alatt nőtt.
    result:
      - 18 hónap alatt 10-ről 80 deszkára növekedett a következetes minőség és árazás mellett
      - Kajak és pedálos csónak bérlés hozzáadva ugyanazon beszállítóval
      - Az egyedi klubmárkázás növelte a turisták körében a márkaismertséget
      - A karbantartási költségek 60%-kal csökkentek az előző költségvetési felszerzéshez képest
      - Jelenleg napi 150+ bérlést szolgál ki a csúcsszezonban
    quote:
      text: A Klub Kezdőcsomag tökéletes bevezető pont volt. Ahogy növekedett az üzletünk, Aquafarer is velünk nőtt — ugyanaz a minőség, ugyanaz az árazás, semmilyen meglepetés nélkül.
      author: A klub tulajdonosa, Phuket
    cta_text: Indítsd el a Klubcsomagod
    cta_href: /solutions/clubs
  - title: Hogyan szabványosított egy Karib-térségi üdülőhely lánc vízi sportokat 5 ingatlanán
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Üdülőhely lánc — Karib-tenger
    problem: Egy luxus üdülőhely lánc 5 ingatlannal következetes vízi sport felszerelési minőséget és márkajelzést igényelt minden helyszínen, központosított beszerzéssel és szezonális cseretervezéssel.
    solution: Aquafarer egy több ingatlant átfogó flottát biztosított 300 SUPs és 100 kajakkal egységes márkajelzéssel, közös pótalkatrész készlettel és éves cseremenetrenddel, mennyiségi árazással.
    result:
      - Egységesített vendégélmény az összes 5 ingatlanon
      - 30%-os költségcsökkenés az összevont vásárlás és mennyiségi árazás által
      - Központosított pótalkatrész készlet 80%-kal csökkentette a leállásokat
      - Éves felszerelés-frissítési program megszüntette a szezon végi kapkodást
      - A vendégek vízi sport részvétele 45%-kal nőtt év/év alapon
    cta_text: Tervezd meg üdülőhely programodat
    cta_href: /solutions/resorts
