features3_certifications:
  title: Tanúsítványok és megfelelőség
  subtitle: Minden terméket külön-külön tesztelnek; 64 modellt CE tanúsítanak nemzetközi szabványok szerint.
  columns: 3
  isBeforeContent: true
  items:
    - title: CE tanúsítás
      description: 64 CE tanúsítvánnyal rendelkező modell a SUPs, kajakok, csónakok és RIBs kategóriákban megfelel az európai CE biztonsági szabványnak a szabadidős vízijárművek számára. Minden termék nyomás-, felhajtóerő- és terhelésvizsgálaton megy keresztül, mielőtt elhagyja a gyárat.
      icon: tabler:certificate
    - title: ''
      description: A 12 000 m²-es cangdói létesítményünk egy ISO 9001-es minőségirányítási rendszer alatt működik. Minden gyártási tétel nyomon követhető, dokumentált és ellenőrzött.
      icon: tabler:clipboard-check
    - title: BSCI Társadalmi megfelelőség
      description: Mi BSCI tanúsítvánnyal rendelkezünk, biztosítva az etikus munkagyakorlatokat, a biztonságos munkakörülményeket és a környezeti felelősségvállalást az egész ellátási láncunkban.
      icon: tabler:users
    - title: REACH & RoHS
      description: Minden anyag — PVC, Hypalon, EVA hab, ragasztók — megfelel az EU REACH és RoHS előírásainak. Nincs korlátozott anyag, nincs kompromisszum.
      icon: tabler:flask
    - title: Anyagvizsgáló labor
      description: A házon belüli anyaglaboratórium minden anyagcsomag esetében a gyártás előtt teszteli a szakítószilárdságot, UV ellenállást, a varratok épségét és a kopásállóságot.
      icon: tabler:microscope
    - title: 5 év hajógarancia
      description: Paddle Board Overstock hajókra 5 éves korlátozott garancia vonatkozik a csőszövetre, varratokra és a hajótestre. SUP deszkákra és kiegészítőkre 2 éves garancia érvényes. Kiállunk amellett, amit építünk.
      icon: tabler:shield-check
testimonials:
  tagline: Ügyfélbizalom
  title: Mit mondanak az ügyfeleink
  subtitle: Az első alkalommal evezőkétől a profi flottakezelőkig — nézze meg, miért bíznak a Paddle Board Overstock-ban.
  items:
    - content: Teljes bérflottánkat felszereltük Paddle Board Overstock RIBs termékekkel – 12 hajó három helyszínen. Két szezon után nulla meghibásodás. A CE tanúsítványi dokumentáció az biztosítási jóváhagyást gördülékennyé tette. Mérnöki csapatuk még a csövek színét is az márkánkhoz igazította.
      name: Marco Valenti
      title: Műveleti igazgató, Adriatic Adventure Tours — Dubrovnik, Horvátország
    - content: Első vásárlóként ideges voltam a minőség miatt, hogy külföldről rendelem. A ISO dokumentáció és a harmadik fél tesztjelentései, amiket még csak nem is kértem, teljes bizalmat adtak. A deszka 6 nap alatt megérkezett, és felülmúlta a várakozásaimat.
      name: James Thornton
      title: SUP Explorer 11 tulajdonos — Vancouver, Kanada
    - content: A part menti járőrhajó-flottánkban 24 Paddle Board Overstock RIBs működik. A QG folyamatuk minden tételnél következetes — ugyanaz a varrásminőség, ugyanaz a szelep elhelyezés, mindig ugyanaz a nyomásérték. Ez a reprodukálhatóság fontos, amikor életek függenek a felszereléstől.
      name: Lt. Commander Andres Reyes
      title: Tengeri beszerzési tiszt, Fülöp-szigeteki Parti Őrség segédcsapata — Manila, Fülöp-szigetek
features3_lab:
  title: Belső tesztelés és minőségi labor
  subtitle: Minden anyagsorozatot és készterméket a helyszíni teszt laborunkban vizsgálnak, mielőtt kiszállításra kerülne.
  columns: 3
  isBeforeContent: true
  items:
    - title: Húzóerő-teszt
      description: 'Minden PVC szövetgörgőt az ASTM D751 szabvány szerint tesztelünk. Minimális követelmény: 350 N/cm szövött és vetülék irányban. Elutasított anyagok visszakerülnek a beszállítóhoz — körülbelül a bejövő anyagok 3%-át utasítjuk el.'
      icon: tabler:scale
    - title: UV Gyorsított öregedés
      description: A szövetsampolyok 1000 órás QUV gyorsított öregedésen esnek át (ASTM G154). A húzóerő megtartásának az UV kitettség után 80%-ot meg kell haladnia. A termékek 3+ év kültéri használatra minősítettek.
      icon: tabler:sun
    - title: Varratfelhúzási szilárdság
      description: RF-hegesztett varratok minimális 5 N/mm felhúzási szilárdságra tesztelve (ASTM D751). Kézzel ragasztott Hypalon varratok 3,5 N/mm-en tesztelve. Minden gyártási tétel varratmintái destruktív tesztek alá kerülnek és archiválva.
      icon: tabler:stack
    - title: 24–48 órás nyomásfenntartás
      description: 'Minden felfújható terméket 1,25x névleges PSI nyomásra fújunk fel, és 24–48 órán keresztül figyelünk. Maximális megengedett nyomáscsökkenés: 5%. A teszten elbukó termékeket átdolgozzák és újratesztelik a szállítás előtt.'
      icon: tabler:wind
    - title: Szelepcsere-teszt
      description: Minden szelepdizájnt 10 000 nyitás-zárás cikluson tesztelünk laborunkban. A szelepeknek 1,25x névleges nyomáson is légmentes zárást kell biztosítani a ciklus után. Minden Paddle Board Overstock szelep 5+ év rendszeres használatra minősítve.
      icon: tabler:rotate
    - title: Hidegtörés ellenállás
      description: Az anyagokat -30°C-on, 4 órán keresztül teszteljük ISO 4646 szerint. Repedés vagy ridegedés nem megengedett. A termékek téli tárolásra és hideg vízi használatra minősítettek, legfeljebb -10°C környezeti hőmérsékletig.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Hogyan biztosítjuk a minőséget
  subtitle: A nyersanyag-ellenőrzéstől a végső nyomástesztig minden termék szigorú minőségi láncon megy keresztül.
  items:
    - title: Nyersanyag-ellenőrzés
      description: Minden PVC szövetgörget tesztelve van vastagság, húzóerő és UV ellenállás szempontjából, mielőtt a gyártásba kerülne.
      icon: tabler:search
    - title: Folyamat közbeni minőségellenőrzés
      description: A hegesztett varratokat, szelepek telepítését és a kamrák kapcsolatát minden állomáson ellenőrizzük az összeszerelés során.
      icon: tabler:eye
    - title: Nyomáspróba
      description: Minden felfújható terméket 1,25-szeres felfújásra PSI fújnak, és 24–48 órán át tartják a levegő visszatartásának és a varrás integritásának ellenőrzésére.
      icon: tabler:wind
    - title: Végső ellenőrzés
      description: Minden egységet átvizsgálnak a befejezés, a hardver és a csomagolás szempontjából, mielőtt engedélyezik a szállításra. A tételmintákat a laborunkba küldik romboló tesztelésre.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Hajó GYIK
  subtitle: Gyakori kérdések a merev törzsű felfújható csónakjainkról.
  columns: 2
  items:
    - title: Milyen méretű RIB Paddle Board Overstock hajók kínálnak?
      description: 35 RIB modellt kínálunk, amelyek hossza 2,5 m-től 7,6 m-ig terjed, a kompakt tenderektől a nehézteheri kereskedelmi és járőrhajókig. Minden modell több konfigurációs opcióval érhető el.
    - title: Mi a különbség a RIB hagyományos felfújható csónak és a hagyományos felfújható csónak között?
      description: A RIB (merevtestű felfújható hajó) egy szilárd üvegszálas vagy alumínium mély-V törzset és Hypalon felfújható csöveket kombinál PVC . Ez biztosítja a kemény hajó stabilitását és teherbírásságát, valamint a felfújható lökéselnyelést és felhajtóerőt.
    - title: Milyen motorokkal Paddle Board Overstock RIBskompatibilisek?
      description: RIBs Támogató külső motorok HP 3-tól 250-ig HP terjednek, modelltől függően. Minden termékoldal felsorolja a maximális motorteljesítményt. Javasoljuk, hogy konzultáljon az üzletfeleddel az ideális párosításért.
    - title: Tanúsítottak Paddle Board Overstock RIBs CE vagytok?
      description: Igen. Minden RIB szabadidős modell CE az adott európai vízi járművek szabványai szerint tanúsított. A kereskedelmi és járőr modellek további stabilitási és terhelési követelményeknek felelnek meg.
    - title: Milyen a RIB garancia a hajókra?
      description: Mindegyik Paddle Board Overstock RIBs 5 éves korlátozott garanciával rendelkezik csőanyagra, varrásokra és törzsre; a felfújó szelepek 5 évre védettek; gyárilag telepített kiegészítők 1 évre védek.
    - title: Hány Paddle Board Overstock RIBs légkamra van még?
      description: A modell RIBs hosszától függően 3-7 független légkamrá található. Ez a többkamrás kialakítás biztosítja, hogy a hajó vízen marad, még akkor is, ha egy rekesz sérül.
faqs_inflatable:
  title: Fújható csónakok GYIK
  subtitle: Gyakori kérdések felfújható csónakjainkról, kajakjainkról és hajóinkról.
  columns: 2
  items:
    - title: Milyen anyagokat használnak Paddle Board Overstock felfújható csónakokban?
      description: Mi katonai minőségű PVC (1100 denier) és prémium Hypalon/CSM gumit használunk, modelltől függően. Mindkét anyag UVstabilizált, szilzilációálló, és megfelel az REACH EU-nak és RoHS a szabályozásnak.
    - title: Mennyi ideig bírják a felfújható csónakok?
      description: Megfelelő gondozással egy PVC minőségi felfújható csónak 7–10 évig bír, míg Hypalon a modellek 15–20 évig is kibírják. A rendszeres tisztítás, UV védelem és megfelelő tárolás jelentősen meghosszabbítja a használati időt.
    - title: Milyen karbantartás szükséges egy felfújható csónakhoz?
      description: Az alapvető karbantartás magában foglalja a friss vízzel öblítést minden használat után (különösen sós vízben), a tárolás előtti szárítást, évente ellenőrizni a szelep tömítéseit, valamint a UV csövek védőszerének alkalmazását. Kerüld a hosszan tartó napfényt, amikor nem használod.
    - title: Használható-e felfújható csónakok sós vízben?
      description: Igen. Minden Paddle Board Overstock felfújható csónak édesvízi és sós víz használatra van tervezve. Javasoljuk, hogy friss vízzel öblítsd le, és alaposan szárítsd sós víz után, hogy elkerüljék a korróziót és a szövet sószott kristályosodását.
    - title: Hogyan tárolhatom a felfújható csónakot?
      description: Légyszi, tisztítsd és szárítsd meg teljesen a hajót tárolás előtt. Lazán gurulj (kerüld a szoros redőket), tárold hűs, száraz helyen, távol a közvetlen napfénytől, és tartsd távol a betonpadlótól, hogy ne szívja el a nedvességet.
    - title: Mekkora a Paddle Board Overstock felfújható csónakok súlya?
      description: A súlykapacitások 290 kg-tól kezdődnek a legkisebb modelljeinknél, és több mint 2000 kg-ig terjednek a nagyobb kereskedelmi járművek esetében. Minden termékoldal feltünteti az adott modell maximális teherbírását.
faqs_sup:
  title: SUP Deszka GYIK
  subtitle: Gyakori kérdések az álló evezős deszkáinkról.
  columns: 2
  items:
    - title: Milyen SUP deszkaméretek érhetők el?
      description: 9 ft-tól 12 ft-ig kínálunk SUP deszkákat, beleértve a mindennapi használatra, túrázásra, jógára és speciális célokra tervezett modelleket. Legnépszerűbb modelljeink a Tropical Breeze (10 ft) és az Ocean Voyager (11 ft).
    - title: Mi a drop-stitch kivitelezés?
      description: A Drop-stitch kivitelezés ezer műszálas poliészter szálat használ, amelyek a deszka felső és alsó rétegeit összekötik, lehetővé téve a magas levegőnyomás (15–20 PSI) megtartását, valamint egy merev és stabil platform kialakítását. Ez az iparági szabvány a prémium felfújható SUPs modelleknél.
    - title: Mi a súlyhatár a SUP deszkáknál?
      description: A SUP deszkáink modell és térfogat függvényében akár 150 kg-ot is elbírnak. A Leviathan Wake deszka a legnagyobb teherbírású modellünk, nagyobb súlyú felhasználókra és jógára tervezve.
    - title: Kínálnak teljes SUP csomagokat?
      description: Igen. Minden SUP deszka teljes csomaggal szállítva érkezik, amely tartalmaz egy 3 részes alumínium evezőt, nagy nyomású kézi pumpát, tekercs zsinórt, utazótáskát és javító készletet. Egyes modellekhez levehető uszonykészlet is tartozik.
    - title: Mi a garancia a SUP deszkákra?
      description: Minden Paddle Board Overstock SUP deszka 2 év garanciával rendelkezik gyártási hibákra, beleértve a varrat hibákat, szelep hibákat és az anyag leválást normál használat mellett.
    - title: Mennyi ideig tart egy SUP deszka felfújása?
      description: A mellékelt kézi pumpa használatával teljes felfújás 15 PSI nyomásra kb. 8–12 percig tart. Gyorsabb felfújáshoz ajánljuk a Paddle Board Overstock 12V-os elektromos pumpát, amely kevesebb mint 4 perc alatt felfújja a deszkát.
cta:
  title: Szeretné látni a tanúsítványokat személyesen?
  subtitle: Kérje tanúsítványcsomagunkat, gyári audit riportjainkat vagy az anyagok megfelelőségi dokumentációját. Nincs szükség NDA.
  actions:
    - variant: primary
      text: Tanúsítási dokumentumok kérése
      href: /contact
    - text: Látogasson el a gyár oldalunkra
      href: /factory
