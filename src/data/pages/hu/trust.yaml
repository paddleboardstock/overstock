features3_certifications:
  title: Minőség és tesztelés
  subtitle: Minden táblát a saját laborunkban tesztelünk, mielőtt elküldik — valós számok, valódi rekordok, marketingállítások nélkül.
  columns: 3
  isBeforeContent: true
  items:
    - title: Saját gyárunkban építettek
      description: Tulajdonunk van és üzemeltetünk egy 12 000 m²-es Weihai létesítményt. Minden gyártási tétel nyomon követhető, dokumentálható és ellenőrizhető — nincs kiszervezett titokzatos gyártás.
      icon: tabler:building-factory
    - title: Anyagvizsgáló labor
      description: A házon belüli anyaglaboratórium minden anyagcsomag esetében a gyártás előtt teszteli a szakítószilárdságot, UV ellenállást, a varratok épségét és a kopásállóságot.
      icon: tabler:microscope
    - title: Tengerészgyalogos anyagok
      description: UV- PVC stabilizált, drop-stitch magok és EVA fedélzeti hab — kiválasztva és tesztelve napsó, só és bántalmazás szezonjaira.
      icon: tabler:flask
    - title: 2 éves SUP garancia
      description: Paddle Board Overstock SUP táblák 2 év garanciával rendelkeznek a gyártási hibák, beleértve a varratok, szelepek és anyagréteg leválás ellen. Kiállunk azért, amit készítünk.
      icon: tabler:shield-check
testimonials:
  tagline: Ügyfélbizalom
  title: Mit mondanak az ügyfeleink
  subtitle: Az első alkalommal evezőknek és a tapasztalt felfedezőknek — nézd meg, miért bíznak a Paddle Board Overstock.
  items:
    - content: Első vásárlóként ideges voltam, hogy külföldről rendeljek. A csapat minden kérdésre valódi fotókkal és tesztfeljegyzésekkel válaszolt, mielőtt egyáltalán megkérdeztem volna. A tábla 6 nap alatt megérkezett, és túlmutatta az elvárásaimat.
      name: James Thornton
      title: SUP Explorer 11 tulajdonos — Vancouver, Kanada
features3_lab:
  title: Belső tesztelés és minőségi labor
  subtitle: Minden anyagsorozatot és készterméket a helyszíni teszt laborunkban vizsgálnak, mielőtt kiszállításra kerülne.
  columns: 3
  isBeforeContent: true
  items:
    - title: Húzóerő-teszt
      description: 'Minden PVC anyag tekercset a házon belül tesztelnek a húzószilárdság szempontjából. Minimum követelmény: 350 N/cm horzsa és övék. Az elutasított adagokat visszaküldjük a beszállítónak — mi a beérkező anyagok körülbelül 3%-át utasítjuk el.'
      icon: tabler:scale
    - title: UV Gyorsított öregedés
      description: Az anyagminták 1000 órás UV gyorsított időjárási hatáson esnek át. A húzószilárdságnak 80%-ot+ kell tartania expozíció után. A termékek 3+ évig alkalmasak kültéri használatra.
      icon: tabler:sun
    - title: Varratfelhúzási szilárdság
      description: A hegesztett varrásokat 5 N/mm minimális hámlási szilárdsággal tesztelik. Minden gyártási tételhez varrásmintákat romboló módon tesztelnek és archiválnak.
      icon: tabler:stack
    - title: 24–48 órás nyomásfenntartás
      description: 'Minden felfújható terméket 1,25x névleges PSI nyomásra fújunk fel, és 24–48 órán keresztül figyelünk. Maximális megengedett nyomáscsökkenés: 5%. A teszten elbukó termékeket átdolgozzák és újratesztelik a szállítás előtt.'
      icon: tabler:wind
    - title: Szelepcsere-teszt
      description: Minden szelepdizájnt 10 000 nyitás-zárás ciklusnak vetünk alá laboratóriumunkban. A szelepeknek a ciklusok után is légmentesen kell zárniuk 1,25-szörös névleges nyomáson. Minden Paddle Board Overstock szelepet 5+ éves rendszeres használatra minősítenek.
      icon: tabler:rotate
    - title: Hidegtörés ellenállás
      description: Az anyagokat 4 órán át -30°C-on tesztelik. Nem tört meg vagy törékeny hatás. A termékek téli tárolásra és hidegvízhasználatra minősítettek -10°C környezeti hőmérsékletig.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Hogyan biztosítjuk a minőséget
  subtitle: A nyersanyag-ellenőrzéstől a végső nyomástesztig minden termék szigorú minőségi láncon megy keresztül.
  items:
    - title: Nyersanyag-ellenőrzés
      description: Minden PVC szövetgörget tesztelve van vastagság, húzóerő és UV ellenállás szempontjából, mielőtt a gyártásba kerülne.
      icon: tabler:search
    - title: Folyamat közbeni minőségellenőrzés
      description: A hegesztett varratokat, szelepek telepítését és a kamrák kapcsolatát minden állomáson ellenőrizzük az összeszerelés során.
      icon: tabler:eye
    - title: Nyomáspróba
      description: Minden felfújható terméket 1,25-szeres felfújásra PSI fújnak, és 24–48 órán át tartják a levegő visszatartásának és a varrás integritásának ellenőrzésére.
      icon: tabler:wind
    - title: Végső ellenőrzés
      description: Minden egységet átvizsgálnak a befejezés, a hardver és a csomagolás szempontjából, mielőtt engedélyezik a szállításra. A tételmintákat a laborunkba küldik romboló tesztelésre.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Deszka GYIK
  subtitle: Gyakori kérdések az álló evezős deszkáinkról.
  columns: 2
  items:
    - title: Milyen SUP deszkaméretek érhetők el?
      description: 9 ft-tól 12 ft-ig kínálunk SUP deszkákat, beleértve a mindennapi használatra, túrázásra, jógára és speciális célokra tervezett modelleket. Legnépszerűbb modelljeink a Tropical Breeze (10 ft) és az Ocean Voyager (11 ft).
    - title: Mi a drop-stitch kivitelezés?
      description: A Drop-stitch kivitelezés ezer műszálas poliészter szálat használ, amelyek a deszka felső és alsó rétegeit összekötik, lehetővé téve a magas levegőnyomás (15–20 PSI) megtartását, valamint egy merev és stabil platform kialakítását. Ez az iparági szabvány a prémium felfújható SUPs modelleknél.
    - title: Mi a súlyhatár a SUP deszkáknál?
      description: A SUP deszkáink modell és térfogat függvényében akár 150 kg-ot is elbírnak. A Leviathan Wake deszka a legnagyobb teherbírású modellünk, nagyobb súlyú felhasználókra és jógára tervezve.
    - title: Kínálnak teljes SUP csomagokat?
      description: Igen. Minden SUP deszka teljes csomaggal szállítva érkezik, amely tartalmaz egy 3 részes alumínium evezőt, nagy nyomású kézi pumpát, tekercs zsinórt, utazótáskát és javító készletet. Egyes modellekhez levehető uszonykészlet is tartozik.
    - title: Mi a garancia a SUP deszkákra?
      description: Minden Paddle Board Overstock SUP deszkára 2 éves gyártási hibák elleni jótállás vonatkozik, beleértve a varrás hibáját, a szelep hibáit és az anyag rétegződését normál használat mellett.
    - title: Mennyi ideig tart egy SUP deszka felfújása?
      description: A mellékelt kézi pumpa használatával a teljes felfújás 15 PSI-ig körülbelül 8–12 percet vesz igénybe. Gyorsabb felfújáshoz javasoljuk a Paddle Board Overstock 12V-os elektromos pumpánkat, amely kevesebb mint 4 perc alatt fúj fel egy deszkát.
