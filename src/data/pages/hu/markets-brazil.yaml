overview_section:
  tagline: Piaci áttekintés
  title: A brazil SUP piac
  paragraphs:
    - Brazília az egyik legtermészetesebb stand-up evezőpiac a Földön. A strandkultúra nemzeti kultúra — a Rio lagúnáinál lévő Stand Up Paddle színtértől és Florianópolis hullámos és lapos vízi keverékétől egészen az északkeleti meleg, nyugodt vizekig Ceará, Pernambuco és Bahia területén. Az evezőiskolák, lagúna bérlések, valamint széllel és SUP szörfös közösségek mind egy hatalmas, sportőrült közösségből vonzódnak.
    - A brazil vevők általában tulajdonos által működtetett vállalkozások — lagúna menti bérleti standok, tengerparti iskolák, szörfboltok, amelyek SUP vonalakat adnak, és növekvő hazai e-kereskedelmi eladók. Kis adagokban rendelnek (5–20 deszkot), és fontosak a mindennapi használathoz való tartósság, valamint az árversenyképesség egy jelentős importköltségekkel rendelkező piacon.
  customer_types:
    - title: Lagoon és Beach Iskolák
      description: Iskolák és bérbeadók Rio lagúnáiban és az északkeleti régió nyugodt vízi partjain órákat és óránként béreltek ki.
    - title: Szörfüzletek
      description: Már bevált szörfkereskedők kínáltak síkvizet és SUP túrákat a helyi evezős közösség számára.
    - title: Online eladók
      description: Hazai e-kereskedelmi eladók SUP importálnak készleteket Brazília hatalmas belső piacának kiszolgálására.
shipping_section:
  title: Hajó Brazíliába
  paragraphs:
    - A rendelések Weihaiból, Kínából szállítják. Az expressz légiszállítás mintákat és 1–3 fedélzeti megrendelést szállít Brazília főbb repülőtereire; a konszolidált tengeri áruszállítás 5–20 fedélzeti nagykereskedelmi megrendelést szolgál ki olyan kikötőken, mint Santos és más tengerparti kapuk. A célpont tranzit becslése is benne van az ajánlatban.
    - Biztosítjuk a kereskedelmi számlát és a csomagolási listát az átigazoláshoz, helyes HS-kódokkal és bejelentett értékekkel. Az importőr fizeti az importőr vámokat és adókat a brazil szabályok szerint.
  customs_note: Brazília sportcikkekre kisződő importadói jelentősek, és termékosztályozástól függően változnak. Rendelés előtt ellenőrizze a jelenlegi vámot, az áfát és az állami szintű díjakat a vámbrókernél (despachante) — teljes dokumentációt biztosítunk, de nem csomagoljuk be az importadókat a fuvarozási árajánlatokba.
faq_section:
  title: Brazília GYIK
  items:
    - q: Kezelhetők-e portugál árajánlatok és támogatás?
      a: Igen — portugál nyelvű vevőkkel dolgozunk. Kérdezze meg a kérdését, és mi kezeljük az árajánlatát és a rendelését portugál nyelven.
    - q: Benne vannak Brazília importadói az áraidban?
      a: Nem. Az importvámok, az ÁFA és az állami szintű adók a brazil szabályok szerint az importőr felelőssége. Világosan és külön árajánlatot adunk a bizottsági árazásról és a szállításról, valamint biztosítjuk a szükséges papírmunkát, amire szüksége van a kimerült szerelmeseinek.
    - q: Milyen egy első rendelés egy brazil tengerparti iskola számára?
      a: 'Jellemzően 5–15 deszka: tartós, mindenre alkalmas modellek leckékhez és óradíjas bérléshez, plusz néhány prémium kiadás kiskereskedelmi bemutatásra. Vegyes modellek egy szállítmányban, az ár a teljes mennyiség alapján.'
    - q: Szállítanak tengeri úton Brazíliába?
      a: Igen — összekapcsolt tengeri szállítás brazil kikötőkbe 5–20 deszkás nagykereskedelmi rendelésekhez, az árajánlat a rendeltetési hely alapján történik. Gyors légi szállítás mintákhoz és sürgős kis rendelésekhez elérhető.
