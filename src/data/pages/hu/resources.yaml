hero_text:
  tagline: Erőforrás
  title: Letöltő Központ & Vásárlói Útmutatók
  subtitle: Termékkatalógusokhoz, OEM útmutatókhoz, vásárlói ellenőrző listákhoz és műszaki dokumentációkhoz férhet hozzá, hogy informált beszerzési döntéseket hozhasson.
features3_downloads:
  tagline: Letöltések
  title: Termékdokumentáció<br />& Vásárlói Források
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026-os Tengerészeti Termékkatalógus
      description: Teljes termékválaszték RIB hajókat, felfújható hajókat, SUP deszkákat, kajakokat és kiegészítőket tartalmaz. Műszaki adatok, konfigurációk és opciók. PDF formátumban.
      icon: tabler:file-text
    - title: OEM Gyártási Útmutató
      description: 'Mindent, amit tudnia kell a OEM/ODM partnerségekről: folyamatáttekintés, minimális rendelési mennyiségek, testreszabási lehetőségek, minőségellenőrzés és szállítás.'
      icon: tabler:building-factory
    - title: RIB Hajóvásárlói Útmutató
      description: 'Hogyan válasszuk ki a megfelelő RIB-t: hajótest anyagok, cső anyagok, motorválasztás, méret szempontok, és konfigurációs lehetőségek különböző alkalmazásokhoz.'
      icon: tabler:file-description
    - title: SUP Beszállítói Ellenőrző Lista
      description: 'Fő szempontok egy SUP deszka gyártó kiválasztásánál: minőségi jelzők, tanúsítási követelmények, MOQ szempontok, és mire figyeljünk a gyári ellenőrzés során.'
      icon: tabler:clipboard-check
    - title: Felfújható Hajó Anyag Útmutató
      description: 'PVC vs Hypalon: tartósság, UV ellenállás, élettartam, javítási lehetőségek és költség szempontok összehasonlítása különféle tengeri alkalmazásokhoz.'
      icon: tabler:files
    - title: Egyedi Gyártási Brief Sablon
      description: Töltse le termék brief sablonunkat. Töltse ki az Ön igényeivel és küldje vissza nekünk a tárgyhéten történő árajánlat és megvalósíthatósági értékelés érdekében.
      icon: tabler:template
faqs:
  title: Gyakran Ismételt Kérdések
  subtitle: Gyakori kérdések termékeinkről, gyártási folyamatunkról és partnerségi modellünkről.
  columns: 2
  items:
    - title: Mi a minimális rendelési mennyiség?
      description: MOQ termékkategóriánként változik. RIB hajók típustól függően általában 10 egységtől kezdődnek modellenként. SUP deszkák 50 egységtől. Termékspecifikus MOQ információkért lépjen kapcsolatba értékesítési csapatunkkal.
      icon: tabler:help-circle
    - title: Kaphatok mintát rendelés előtt?
      description: Igen. Paddle Board Overstock mintagyártást biztosít az értékeléshez a sorozatgyártás előtt. A minták költségei alku tárgyát képezhetik és gyakran beszámítanak az első gyártási megrendelésbe.
      icon: tabler:package
    - title: Milyen fizetési feltételek állnak rendelkezésre?
      description: 'A standard feltételek: 30% előleg a megrendeléskor, 70% szállítás előtt. LC feltételek elérhetők jogosult ügyfelek számára. Lépjen kapcsolatba pénzügyi csapatunkkal a részletek egyeztetéséhez.'
      icon: tabler:currency-dollar
    - title: Mennyi ideig tart a gyártás?
      description: 'Tipikus átfutási idők: RIB hajók 30-45 nap, SUP deszkák 20-30 nap, felfújható hajók 25-35 nap. Az egyedi fejlesztés 15-30 napot ad a prototípushoz.'
      icon: tabler:calendar-clock
    - title: Milyen tanúsítványokkal rendelkeznek termékeik?
      description: CE tanúsítás az EU piacokra, az Egyesült Államok Parti Őrsége jóváhagyta gyártás, ISO minőségirányítási rendszer, BSCI megfelelőség és REACH anyagmegfelelőség.
      icon: tabler:certificate
    - title: Kínálnak testreszabott csomagolást és márkázást?
      description: Igen. Biztosítunk testreszabott csomagolást a logójával, színeivel és márkaidentitásával. MOQ a testreszabott csomagolás esetében a termékkategóriától függ.
      icon: tabler:color-swatch
