hero_text:
  tagline: Erőforrás
  title: Letöltőközpont és evezési útmutatók
  subtitle: Termékkatalógusok, vásárlási útmutatók és gondozási útmutatók, amelyek segítenek kiválasztani, használni és élvezni a SUP felfújható deszkát.
features3_downloads:
  tagline: Letöltések
  title: Termékdokumentáció<br />& Evezős Erőforrások
  isBeforeContent: false
  columns: 2
  items:
    - title: 2026-os SUP termékkatalógus
      description: 'A teljes Paddle Board Overstock SUP választék: mindenféle táblák, művészeti sorozatok és kiegészítők, teljes specifikációkkal és csomagolási tartalommal. PDF formátumban.'
      icon: tabler:file-text
    - title: Fújható SUP vevői útmutató
      description: 'Hogyan válasszuk ki az első deszkát: hosszúság, szélesség, vastagság, térfogat, a versenyző súlyának egyezése, és hogy melyik deszka formája illik az evezőstílusodhoz.'
      icon: tabler:file-description
    - title: SUP Méret és Illeszkedés útmutató
      description: Igazítsd a deszka térfogatát és méretét a súlyodhoz és tudásszintedhez, és adott konkrét programokra vonatkozó ajánlásokat a szabadidős, túrázási, jóga és fitnesz módon.
      icon: tabler:clipboard-check
    - title: Igazgatósági gondozási és karbantartási útmutató
      description: 'Tartsd a boardodat úgy, mint újon: tisztítás, szárítás, tárolás, UV védelem, szelepkarbantartás és kisebb javítási utasítások.'
      icon: tabler:tool
    - title: Fújható deszka anyagok útmutatója
      description: PVC a szerkezet, drop-stitch a magok, a EVA fedélzeti párnák, és hogy mit jelent a 15 PSI merevség a teljesítmény és tartósság szempontjából.
      icon: tabler:files
    - title: A kezdet SUP
      description: 'Első alkalommal evezős alapok: felfújás, hordozás, indítás, alapvető mozdulatok és biztonsági alapok, hogy az első napon is felállj.'
      icon: tabler:swimming
faqs:
  title: Gyakran Ismételt Kérdések
  subtitle: Gyakori kérdések a deszkáinkról, rendelésről és a vízre való fellépésről.
  columns: 2
  items:
    - title: Mi van benne a boardomhoz?
      description: Minden teljes csomag tartalmazza a deszkát, állítható lapát, nagy áramlású szivattyút, pórázt, javítókészletet és hátizsákot. Az Evezők és Szivattyú Készlet külön is elérhető.
      icon: tabler:package
    - title: Mennyi ideig tart az infláció?
      description: A mellékelt nagy áramlású szivattyúval a legtöbb evező 8-12 perc alatt eléri a teljes nyomást. Az elektromos szivattyúk is működnek — csak állj meg a szelep közelében nyomtatott névnyomásnál.
      icon: tabler:clock
    - title: Hogyan válasszam ki a megfelelő táblát?
      description: 'Kezdd a súlyoddal és a evezési stílusoddal: a kezdők és családok szeretik a széles, stabil platformokat, mint az SUP Explorer 11; a jógázók a teljes fedélzeli tapadást kedvelik; a túraevezők merev, áramvonalas formákat szeretnének. Csapatunk örömmel ajánlja.'
      icon: tabler:help-circle
    - title: Milyen fizetési módokat fogadsz el?
      description: Elfogadunk nagyobb hitelkártyákat, PayPal-ot és banki átutalásokat. Minden ár tartalmazza a teljes csomagot — nincsenek rejtett extrák.
      icon: tabler:currency-dollar
    - title: Mennyi ideig tart a szállítás?
      description: A rendelések a gyárunkból érkeznek, és általában 5-10 munkanapon belül érkeznek meg, régiótól függően. Minden rendeléshez követés biztosított.
      icon: tabler:truck-delivery
    - title: A táblámra vonatkozik a garancia?
      description: Igen — minden táblát gyártási hibák ellen biztosítunk, és minden egységet a gyárból való kilépés előtt 24-48 órán keresztül 1,25-szörös névleges nyomásra nyomáspróbának vetünk alá. A garanciakövetelés arányunk 2% alatt van.
      icon: tabler:shield-check
cta:
