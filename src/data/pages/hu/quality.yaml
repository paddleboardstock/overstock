tests:
  - title: Nyomáspróba
    standard: ISO 6185-1 | Belső specifikáció AF-PT-001
    description: A felfújható kamrákat a javasolt működési határ 1,25-szeresére nyomás alá helyezik, és 30 percig tartják őket. A nyomáscsökkenést mérik az anyagok és varratok légzáródásának és szerkezeti integritásának igazolására.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
  - title: Hatásvizsgálat
    standard: Belső specifikáció AF-IT-002
    description: A termékeket szabályozott ütközéseknek teszik ki szabványosított ejtősúlyok és inga berendezések által. Ez értékeli a szúrásállóságot, a szakadások terjedését és a szerkezeti ellenálló képességeket az akadályokkal, dokkokkal és törmelékekkel való ütközésekkel szemben.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
  - title: UV Ellenállási teszt
    standard: ASTM G154 |ISO 4892-3
    description: Az anyagmintákat 1000 órán át UVA-340 lámpáknak teszik ki gyorsított időjárásálló+ kamrákban. A színváltozást (Delta E), fényvisszatartást és húzószilárdságvesztést mérjük a UV stabilizátor csomagok validálására.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
  - title: Csiszsolódási ellenállás vizsgálat
    standard: ASTM D751 (Taber) |ISO 5470-1
    description: Az anyagmintákat CS-10 csiszoló kerekeknek vetik alá 500g/1 000g terhelés alatt 1 000 cikluson át. A tömegveszteség és a vizuális kopás határozza meg a bevonat tartósságát a homokkal, kavicssal és ismétlődő indításokkal szemben.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pvc-material-testing.webp
  - title: Alacsony hőmérsékletű teljesítménytesztelés
    standard: Belső specifikáció AF-LT-003 | MIL-STD-810G
    description: Az összeszerelt termékeket és anyagkuponokat 24 órán át -20°C, -10°C és 0°C hőmérsékleten kondicionálják, majd rugalmas tesztet végeznek. Ezt PVC ellenőrizzük, és Hypalon rugalmasak maradunk repedés vagy delamináció nélkül.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-exterior.webp
  - title: Felhajtóerő és teherbírás-teszt
    standard: ISO 6185-1 |ISO 12402
    description: A termékeket fokozatosan töltik be 1,25-szeres névleges kapacitásra egy kontrollált medencében. A szabadfedélzet, stabilitás és önleszívó teljesítmény rögzítésre kerül. Minden modell minősített kapacitása matematikailag és empirikusan igazolt.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-stock-boat-inventory.webp
  - title: Manőverezhetőségi tesztek
    standard: Belső specifikáció AF-MT-004
    description: A vízi tesztek a fordulási sugarat, gyorsulást, síkozási időt és az evező/motor válaszát mérőzik különböző terhelési körülmények között. A valós kezelési jellemzőket a tervezési célpontok alapján validálják.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-dolphin-wave-1.webp
  - title: Vízzáróság vizsgálata
    standard: ISO 6185-1 §7.3 | Belső specifikáció AF-WT-005
    description: Minden összeszerelt terméket 0,5 bar nyomáson permeteznek minden varráson, szelepen és csatlakozón. Egy 5 perces nyomásos merülési teszt igazolja a kamra és szelep vízzárultságát. Null szivárgás szabvány a szállítás előtt.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department-2.webp
testing_section:
  tagline: Tesztelési eljárások
  title: Szigorú tesztelés minden szakaszban
commitment:
  title: Elkötelezettségünk
  body: Ezekkel a szigorú tesztelési eljárásokkal a {SITE} biztosítja ügyfeleinknek a biztosítékot, hogy felfújható SUPs hajóink és hajóink nemcsak kiváló teljesítményűek, hanem tartósan is kiépítettek — így számtalan élvezetes és biztonságos kalandot biztosítva a vízen. Minőségi laboratóriumunk a gyártástól függetlenül működik, és közvetlenül a vezetőségnek jelent.
  cta: Tesztelési dokumentáció kérése
  cta_link: /contact
