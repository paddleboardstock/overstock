stories:
  tagline: Felfedezői történetek
  title: Valódi kalandok valódi emberektől
  subtitle: Hallgasson a evezősökre, családokra és szakemberekre, akik Paddle Board Overstock felszerelést használnak a vízen.
  items:
    - name: Sarah és Mike
      title: SUP Explorer 11 tulajdonosok, Kanada
      content: Elvittük az Explorer 11-einket egy egyhetes utazásra az Algonquin Parkon keresztül. Gyönyörűen kezelték a hordozásokat és a tóátkeléseket. A drop-stitch kialakítás lehetővé tette, hogy 15 PSI-ra fújjuk fel, és keménydeszka-szintű teljesítményt kapjunk egy összecsukható deszkától.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Algonquin Park, Kanada
    - name: Carlos R.
      title: Cheetah Surge lovas, Spanyolország
      content: A Cheetah Surge számomra a tengerparti hajókázáshoz az első választás. A vibráló kialakítás felhívja a figyelmet a parton, a stabilitás pedig magabiztosságot ad a kisebb hullámokon. Gyönyörűen irányítható, legyen szó túrázásról vagy egyszerűen csak a naplemente élvezetéről.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Spanyolország
    - name: Lina és családja
      title: Áramló Lótusz evezősök, Svédország
      content: Hétvégi családi kalandok a szigetcsoportban. A Flowing Lotus elég stabil ahhoz, hogy a lányom megállhasson rajta, miközben én evezek. 10 perc alatt felfújható — utánfutó nélkül, csak tiszta családi szórakozás a vízen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Stockholmi-szigetvilág, Svédország
    - name: Andres D.
      title: Ocean Voyager felfedező, Fülöp-szigetek
      content: A Ocean Voyageremet hosszú távú part menti túrákra használom Palawan környékén. Hónapok napi használata után trópusi körülmények között a deszka még mindig úgy teljesít, mintha új lenne. A túraforma átvág a hullámzáson, ami a gyengébb deszkákat megállítaná.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Fülöp-szigetek
    - name: Emma T.
      title: Tropical Breeze először, Ausztrália
      content: Soha nem ültem még SUP -on. A Tropical Breeze annyira stabil, hogy az első próbálkozásomkor is magabiztosságot éreztem. Most minden hétvégén evezek. A tanulási görbe gyakorlatilag nulla — és a deszka fantasztikusan néz ki a vízen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Aranypart, Ausztrália
