content_founding:
  tagline: A kezdet
  title: A Waterparton született
  subtitle: 'Egy Paddle Board Overstock tengerparti műhelyben kezdtem Qingdaóban, egyetlen hajóval és egy vízióval: felfújható vízijárművek építése, amelyek képesek kezelni a valódi tengeri körülményeket.'
  paragraphs:
    - 2012-ben alapítóink piaci rést láttak — a legtöbb felfújható hajó vagy megfizethető, de megbízhatatlan, vagy magas minőségű, de túlzott drága volt. Úgy vélték, van hely egy olyan gyártónak, amely egyszerre kínál minőséget és értéket.
    - Az első hajótestet kézzel építették, helyi vizeken tesztelték, és a halászok és kis kereskedelmi üzemeltetők valódi visszajelzései alapján finomították. Ez a visszacsatolási kör — építés, tesztelés, hallgatás, fejlesztés — ma is mérnöki filozófiánk középpontjában áll.
    - 2015-re a hír túlmutatott Qingdaón. Nemzetközi forgalmazók elkezdtek mintákat kérni. Ami helyi műhelyként indult, globális beszállítóvá vált.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Korai gyártási műhely és gyártás
content_growth:
  tagline: Növekedés és innováció
  title: Műhelytől 12 000 m²-es létesítményig
  subtitle: Folyamatos beruházás az emberekbe, berendezésekbe és folyamatokba modern Paddle Board Overstock tengeri gyártóüzemmé alakult.
  paragraphs:
    - Ahogy nőtt a kereslet, úgy nőtt a létesítményünk is. Egy kis műhelyből egy 12 000 m²-es gyárká bővültünk, ahol külön gyártósorokkal rendelkeztek RIB hajók, felfújható csónakok, SUP deszkák és kiegészítők számára.
    - CNC Vágógépekbe, nagyfrekvenciás hegesztőgépekbe, drop stitch gyártósorokba és átfogó tesztgépekbe fektettünk be — lehetővé téve, hogy a gyártás minőségének minden aspektusát ellenőrizzük.
    - Ma 200-300 fős csapatunk tengeri mérnökökből, anyagtudósokból, minőségellenőrzési szakemberekből és tapasztalt kézművesekből áll — akik közül Paddle Board Overstock sokan már a kezdetektől fogva dolgoznak náluk.
content_mission:
  tagline: Küldetésünk
  title: Mérnöki szabadság a vízen
  subtitle: Minden Paddle Board Overstock terméket úgy tervezünk, hogy segítsen az embereknek felfedezni, dolgozni és boldogulni a vízen — megbízhatóan, biztonságosan és megfizethető módon.
  list:
    - Olyan vízi járműveket tervezni, amelyek valós tengeri körülmények között is teljesítenek — nem csak papíron
    - Tartós partnerségeket építsen a forgalmazókkal és márkákkal megbízható OEM/ODM szolgáltatáson keresztül
    - Folyamatosan javítsa gyártási folyamatait a jobb érték biztosítása érdekében
    - Minden terméket eredeti pótalkatrészekkel és műszaki szakértelemmel támogasson
