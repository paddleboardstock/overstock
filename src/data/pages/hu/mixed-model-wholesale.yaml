hero:
  tagline: Vegyes modell nagykereskedelmi kereskedelem
  title: Vegyes modell nagykereskedelmi lapozódeszkák —<br />Keverd össze különböző SUP modelleket egy sorrendben
  subtitle: Miért zárnád le a költségvetésedet egyetlen modellre? Egyesítsd a készleten lévő SUP boardokat — mindenhol, turnézó, surf és art kiadásokat — egyetlen nagykereskedelmi rendelésben, összesen akár 5 deszkával.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Különböző SUP felfújható deszkák vegyes sorrendje Paddle Board Overstock
direct_answer: A vegyes modell nagykereskedelmi szolgáltatás lehetővé teszi, hogy egy kis kiskereskedő több különböző SUP modellt rendeljen egy konszolidált szállítmányban, nem pedig egyetlen táblát tömegesen. Paddle Board OverstockA piacon bármely készleten lévő modell kombinálható, a minimum rendelés összesen 5 deszka lesz, és az összes mennyiség határozza meg az árszintet. A vegyes rendelések Weihaiból, Kínából gyorsgyorsszállítással (1–3 fedélly) vagy konszolidált tengeri szállítmánysal (5–20 fedély) 50+ országba szállítják, és minden deszka 100%-ban nyomásteszttel van tesztelve és 2 éves SUP garanciával van védve.
tldr_points:
  - Keverd össze a készleten lévő SUP modelleket egy rendelésben — nem a modellenként minimális
  - A teljes rendelésmennyiség (nem modellenként) határozza meg az árképzési szintet
  - Összesen 5 deszkával kezdjük — kis kiskereskedőknek készült, nem konténerrakontézésekre
  - 'Egy konszolidált szállítmány: egy fuvarköltség, egy vámellenőrzés, egy kézbesítés'
why_mixed:
  tagline: Miért a kevert?
  title: Keverd össze. Vegyél több változatosságot. Költsd kevesebbet.
  subtitle: Egy polc azonos deszkákból álló egyfajta evező számára. Egy vegyes rendelés ugyanazt a költségvetést teljes termékcsaláddá alakítja.
  items:
    - title: Több változatosság a polcodon
      description: Kombináld a kezdők számára használható deszkákat, kalandoroknak szóló túradeszkákat és surf-stílusú deszkákat a motorosoknak — egy rendelés lefedi az egész vásárlói kínálatodat.
    - title: Alacsonyabb kockázat modellenként
      description: Ahelyett, hogy egy modellre fogadnál a szezonban, rendelj 2–4-et mindegyikből. Ha az egyik modell többet ad, a következő rendelésben valódi értékesítési adatokkal töltsd fel.
    - title: Tesztelje, mi ad el a piacodon
      description: Minden strand, tó és város más-más kereslettel rendelkezik. A vegyes első rendelés a legolcsóbb piaci kutatás — tettázd meg hat modellt, nézd meg, melyikek mozognak.
    - title: Jobb marzsok az Art Editions kiadásokban
      description: A prémium művészeti sorozatú táblák (Leviathan Wake, Medusa Glow, Ocean Voyager) magasabb kiskereskedelmi árakat kínálnak. Keverj néhány alapot egy alapba, hogy emeld az átlagos haszonszerzést.
    - title: Egy egyesített szállítmány
      description: Egy vegyes rendelés egy áruszállítást, egy vámellenőrzést és egy szállítást jelent — nem pedig öt különálló szállítmányt öt külön beszállítótól.
how_it_works:
  tagline: Hogyan Működik
  title: Hogyan működik a vegyes modell rendelés
  steps:
    - title: Válassz a saját keverékedet
      description: Válaszd ki a piacodhoz tartozó modelleket és mennyiségeket — vagy használd az alábbi választót, hogy összefoglalj egy kombinációt, és nézd meg élőben a boardszámot és az összérték frissítését.
    - title: Kérjen árajánlatot
      description: Küldd el nekünk a keveréket. Minden modell és árajánlat árát megerősítjük, valamint expressz és tengeri szállítási lehetőségeket is megerősítünk az országodba.
    - title: Erősítse meg a parancsot
      description: Jóváhagyjuk a végső ajánlatot — modellek, mennyiségek, áruszám, összesített. Lezárjuk a készletet és ütemezzük a küldést Weihai-tól.
    - title: Minden táblát tesztelünk
      description: Minden egyes lapot a vegyes rendelésedben 100%-os nyomásteszt PSI 15-ig kap csomagolás előtt — minden modellnél ugyanaz a szabvány, legyen az belépő általános vagy művészeti kiadás.
    - title: Egy kézbesítés az ajtódhoz
      description: A teljes vegyes rendelés együtt szállít — kis rendelések esetén expressz légi, 5–20 fedélzet konszolidált tengeri áruszállítás — házról házra követéssel.
