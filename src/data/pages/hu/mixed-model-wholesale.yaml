who_benefits:
  tagline: Kik profitálhatnak
  title: Kinek a vegyes modell nagykereskedelmi forgalmazása
  items:
    - title: Első importőrök
      description: A SUP kategória tesztelése modellek széles választékával ahelyett, hogy egy tömeges SKU mennyiségre köteleződnék el.
    - title: Szezonális tengerparti kiskereskedők
      description: Olyan boltok, amelyeknek kezdő táblák vannak a turistáknak, prémium kiadások pedig helyieknek – ugyanazzal a készlet sorrendben.
    - title: Online eladók
      description: Több modellt sorolj egyszerre, hogy megtudd, melyik grafika, hosszúság és felhasználási eset válik a legjobban.
    - title: Bérlő flották és iskolák
      description: Olyan flották, amelyeknek különböző méretű deszkeszméretekre van szükségük különböző versenyzői súlyok és lecketípusok miatt, nem egy egységes specifikációs flottára.
faq_section:
  title: Vegyes modell GYIK
  items:
    - q: Van egy minimális mennyiség egy modellenként?
      a: Nem. Az 5 deszkás minimum a teljes rendelésre vonatkozik, nem minden modellre. Rendelhetsz 5 különböző modellt, egy-egy táblát mindegyikenként.
    - q: A modellek keverése megváltoztatja az árat?
      a: A nagykereskedelmi egységárakat modellenként árulják, de az árképzésed a teljes deszkoszám növekedésével javul — a modellek keverése nem büntet.
    - q: Keverhetem a táblákat és kiegészítőket?
      a: Igen — tartalék lapátok, szivattyúk és javítókészletek is hozzáadhatók vegyes sorrendhez. Kérdezd meg a kérdésedben.
    - q: Honnan tudhatom, mely modellek passzolnak a piacomhoz?
      a: Küldjön nekünk egy üzenetet ügyfeleiről (part menti vagy belföldi, turisták vagy helyiek, kezdők vagy utasok) a kérdői űrlapon, és mi ajánlunk egy keveréket.
