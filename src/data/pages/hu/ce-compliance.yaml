content_scope:
  tagline: Megfelelőség Hatálya
  title: Mely Termékeknek Kell<br />RCD Megfelelniük?
  subtitle: A Szabadidős Hajózási Irányelv 2013/53/EU olyan szabadidős hajókra vonatkozik, melyek hajóteste 2,5 m és 24 m közötti hosszúságú. A hatály megértése az első lépés a megfelelőség felé.
  items:
    - title: RIB Hajók (2,5–24 m)
      description: A 2,5 m és 24 m hosszúság közötti merev felfújható hajók RCD hatálya alá tartoznak. A tervezési kategóriák A-tól D-ig terjednek, a tervezett tengeri körülmények és a maximális szélsebesség függvényében.
      icon: tabler:sailboat
    - title: Felfújható Hajók (2,5 m alatt)
      description: A 2,5 m alatti kis felfújható hajók és csónakok részben mentesülhetnek RCD alól, de még mindig szükséges a CE jelölés más alkalmazandó irányelvek és az EN ISO 6185 építési szabványok szerint.
      icon: tabler:sailboat
    - title: SUP Deszkák & Tartozékok
      description: A stand-up paddle deszkák nincsenek RCD hatálya alatt. Azonban a hozzájuk tartozó személyi úszómellények (PFD) a PPE rendelet (EU) 2016/425 szerint kötelező CE jelölést igényelnek, ahol alkalmazható, III/V típusú engedéllyel.
      icon: tabler:swimming
    - title: Részlegesen Kész Hajók
      description: A motor vagy speciális szerelések nélküli hajókat részlegesen kész jármű tartalmi nyilatkozattal kell ellátni, a teljes RCD megfelelőség a végső gyártó vagy behozó feladata.
      icon: tabler:tool
content_trust_layers:
  tagline: Háromrétegű Bizalom Rendszer
  title: Megfelelőségi információk<br />— A megfelelő szinten megosztva
  subtitle: Nem minden megfelelőségi adat tartozik nyilvános weboldalra. Háromrétegű megközelítést követünk, amely védi a szellemi tulajdont, miközben növeli a vásárlói bizalmat.
  items:
    - title: 1. réteg — Nyilvános weboldal
      description: Szabványok hivatkozva, megfelelőségi útvonalak magyarázatok, dokumentumtípusok felsorolva, tanúsítási keret modellcsaládonként. Nincsenek tényleges tanúsítványok, tesztadatok vagy saját mérnöki részletek.
      icon: tabler:world
    - title: 2. réteg — Lekérdezés utáni megosztás
      description: 'Egy minősített vizsgálat után: kitakarított DoC minta, az építő lemezképe, alkalmazandó szabványlista, megfelelőségi ellenőrzőlista, valamint anyag-tanúsítási összefoglalók — amelyeket tisztességes felhasználási feltételek szerint osztanak meg.'
      icon: tabler:mail
    - title: 3. réteg — NDA / Sorrendi szakasz
      description: Teljes műszaki fájl, kockázatértékelések, stabilitási számítások, tesztjelentések, anyagtételi nyilvántartások és a termelés nyomon követhetőségi dokumentációja — csak az NDA alá tartozó hitelezett vevőkkel osztják meg.
      icon: tabler:lock
content_standards:
  tagline: Alkalmazandó szabványok
  title: ISO & EN szabványok<br />Építünk
  subtitle: Termékeinket a harmonizált szabványok szerint tervezik és teszteljük RCD. A szabvány számokra és nevekre hivatkoznak; a teljes szabványos szövegek ISO szerzői jog alatt maradnak.
  items:
    - title: EN ISO 6185-3
      description: 'Fújható csónakok — 3. rész: Hajók, amelyek maximális motorteljesítménye 15 kW vagy annál nagyobb. Építés, stabilitás, felhajtóerő és ember-víz visszanyerési követelmények RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Fújható csónakok — 4. rész: Hajók, amelyek maximális motorteljesítménye 15 kW, és meghaladja vagy meghaladja 4,5 kW-ot. További szerkezeti és stabilitási követelmények.'
      icon: tabler:file-text
    - title: ISO 12215 sorozat
      description: Kishajók — Törzs építése és skantlingek. Üvegszálas és alumínium hajótestek hajótestein, fedélzetének és válaszfalainak szerkezeti RIB tervezése.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Kishajók — Használati útmutató. Az EU-ban szállított hajókhoz tartozó használati útmutató szükséges tartalma és RIB formátuma.
      icon: tabler:book
    - title: EN ISO 14945
      description: Kis hajó — Építői tányér. Az információt a gyártó tábláján kell jelölni, amely véglegesen minden járműhöz rögzítve van.
      icon: tabler:badge
    - title: ISO 8666
      description: Kishajók — Fő adatok. Szabványosított mérések és paraméterek az egységes specifikáció érdekében minden termékdokumentációban.
      icon: tabler:dimensions
content_process:
  tagline: Megfelelőségi folyamat
  title: 6 CE lépéses megfelelés<br />Munkafolyamat
  subtitle: A projekt terjedelmetől a sorozatos szintű nyomon követhetőségig — minden RIB modell egy meghatározott megfelelőségi útvonalat követ.
  steps:
    - number: '01'
      title: Projekt terjedelmei és osztályozása
      description: Határozza meg RIB a modellt, a tervezési kategóriát (A/B/C/D), maximális létszámot, hasznos terhet, motorteljesítményt és célpiacot. Határozza meg, hogy RCD alkalmazható-e rá, és melyik megfelelőségértékelési modul szükséges.
      timeline: 2–3 nap
    - number: '02'
      title: Alkalmazandó követelmények azonosítása
      description: Azonosítani az összes releváns alapvető biztonsági követelményt RCD az I. mellékletből, a releváns harmonizált szabványokból (EN ISO 6185, 12215, 10240, 14945), valamint a célpiacra vonatkozó további nemzeti követelményekből.
      timeline: 3–5 nap
    - number: '03'
      title: Tervezés és műszaki dokumentáció
      description: 'Készítse el a Fő Műszaki Fájlt: általános elrendezési rajzok, stabilitási és felhajtóerő-számítások, kockázatértékelés, anyagspecifikációk és rendszerbiztonsági elemzések (üzemanyag, elektromos, kormányzás).'
      timeline: 10–15 nap
    - number: '04'
      title: Termékellenőrzés és tesztelés
      description: Fizikai ellenőrzés – nyomásvizsgálat 1,25-szeres névleges nyomáson 24–48 órán át, stabilitási és felhajtóerő-tesztek, terhelési tesztek, valamint rendszerek üzembe helyezése. Minden teszteredményt rögzítsünk hajószáronként.
      timeline: 5–7 nap
    - number: '05'
      title: Jelölés és kézbesítési dokumentáció
      description: CE Csatolási jelölés, építői lemez (EN ISO 14945) és HIN/CIN (hajótest azonosító száma) készítse el. Készítse el az EU megfelelőségi nyilatkozatát, a használati útmutatót (EN ISO 10240) és a megfelelőségi ellenőrzőlistát.
      timeline: 2–3 nap
    - number: '06'
      title: Sorozatszintű nyomon követhetőség
      description: Minden hajótest egyedi Törzs Nyilvántartást kap, amely összeköti a Master Technical File-tal, gyártási tétellel, anyagtanúsítványokkal, teszteredményekkel és végső konfigurációval. A nyilvántartások 10+ évig megőrzhetők RCD.
      timeline: Folyamatban
content_document_cards:
  tagline: Dokumentumtípusok
  title: Megfelelőségi dokumentum<br />Kártyák
  subtitle: Ezek azok a dokumentumtípusok, amelyeket minden CEtanúsított modellhez készítünk és RIB karbantartatunk. A minták megfelelő lekérdezés után elérhetők.
  items:
    - title: CE / RCD Megfelelőségi tanúsítvány
      description: Modellspecifikus tanúsítvány, amely igazolja, hogy a jármű megfelel a RCD 2013/53/EU összes alapvető biztonsági követelményének, amelyet a gyártó kiad, ha szükséges, az értesített testület részvételével.
      icon: tabler:certificate
    - title: Az EU konformitási nyilatkozata (DoC)
      description: A gyártó vagy az illetékes képviselő által aláírt nyilatkozat, amely tartalmazza az alkalmazandó irányelveket, szabványokat, megfelelőségi modult és a Értesített Testület adatait. Minden EU-piacon megjelenő modellhez kötelező.
      icon: tabler:file-check
    - title: Építő tábla (EN ISO 14945)
      description: Állandóan rögzített lemez, amely a maximális létszámot, maximális motorteljesítményt, tervezési kategóriát és gyártóazonosítót mutatja. A jármű élettartama alatt olvashatónak kell maradnia.
      icon: tabler:badge
    - title: Használati útmutató (EN ISO 10240)
      description: Átfogó kézikönyv, amely a biztonságos működést, vészhelyzeti eljárásokat, karbantartási ütemterveket és biztonsági figyelmeztetéseket tartalmazza. Minden RIB EU-ban szállított példánynál kötelező.
      icon: tabler:book
    - title: ISO Teszt- és ellenőrzési jelentések
      description: Nyomásteszt nyilvántartások (1,25x / 24–48h), stabilitási és felhajtóképesség-teszt eredményei, anyagteszt tanúsítványok és méretellenőrzési jelentések — mind konkrét hajótestszámokhoz kapcsolódnak.
      icon: tabler:test-pipe
    - title: Anyag Nyomon Követési Rekordok
      description: Csőszövet, ragasztók, üvegszál és hardver tételszintű nyomon követése. Minden gyártóegységet összekapcsol a beérkező anyagtanúsítványokkal és az IQC ellenőrzési eredményekkel.
      icon: tabler:link
    - title: Minőségellenőrzés és minőségellenőrzési nyilvántartások
      description: 100 pontos minőségellenőrzőlista, folyamatban lévő minőségellenőrzési nyilvántartások, nem megfelelőségi jelentések és korrekciós intézkedések. A termelési nyomon követhetőségi lánc része.
      icon: tabler:clipboard-check
    - title: Projekt dokumentumcsomag
      description: Hajótestenkénti dokumentáció tartalmazza a végleges konfigurációs nyilvántartást, a motor- és berendezések telepítési részleteit, a szolgálatba állítási ellenőrzőlistát és a szállítási dokumentációt.
      icon: tabler:package
content_design_categories:
  tagline: RCD tervezési kategóriák
  title: Tervezési kategória A–D<br />— Mit jelentenek
  subtitle: A RCD tervezési kategóriákat a maximális szélerő és a jelentős hullámmagasság alapján osztják meg, amelyeket a jármű kibír.
  items:
    - title: A kategória — Óceán
      description: Hosszabb utazásokra tervezték, ahol a szélerő meghaladhatja a Beaufort 8-at (>40 csomó), és jelentős hullámmagasság meghaladhatja a 4 métert. A legszigorúbb szerkezeti és stabilitási ellenőrzést igényel.
      icon: tabler:ripple
    - title: B kategória — Tengeri
      description: Olyan tengerparti utazásokra tervezték, amelyeknek szélereje Beaufort 8-ig (≤40 csomó), és jelentős hullámmagasság akár 4 m is. Alkalmas part menti és félig fedett vizekre.
      icon: tabler:anchor
    - title: C kategória — Partközeli
      description: A part menti utazásokra tervezték, szélerővel akár Beaufort 6 (≤27 csomó), hullámmagassága pedig akár 2 m is legyen. A legtöbb szabadidős RIBs cél ebbe a kategóriába esik.
      icon: tabler:sun
    - title: D kategória — Védett
      description: Védett vizekre tervezték, szélerővel a Beaufort 4-ig (≤16 csomó), és jelentős hullámmagasság akár 0,3 m-ig is. Tavak, folyók és védett kikötők.
      icon: tabler:pool
content_hin:
  tagline: Jármű azonosítása
  title: HIN / CIN és építő lemez
  subtitle: Minden RIB hajónak szüksége van hajótestazonosító számra (HIN) vagy hajóazonosító számra (CIN), valamint egy építői rendszámra az ISO EN 14945 és RCD követelmények szerint.
  items:
    - title: Hajótest azonosító száma (HIN)
      description: Egy egyedi, 14 karakteres kód, amely állandóan a kereszt jobb oldalán van jelölve, kódolva a gyártó kódját (MIC), modellévet, gyártási évet és sorozatszámot. Szükséges az EU piacra lépéshez.
      icon: tabler:hash
    - title: Járműazonosító szám (CIN)
      description: Az EN ISO 10087 szerint egy rejtett másodlagos azonosító szám, amelyet rejtett helyen helyeznek el lopásgátlás és nyomon követhetőség céljából.
      icon: tabler:eye-off
    - title: Építőlemez tartalom
      description: Maximális létszám, maximális motorteljesítmény (kW), maximális terhelés (kg), tervezési kategória, gyártó neve és CE jelölés — mind állandóan látható egy korrózióálló lemezen.
      icon: tabler:badge
