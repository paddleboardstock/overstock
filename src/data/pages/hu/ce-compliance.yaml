      icon: tabler:package
content_material_cert:
  tagline: Anyagtanúsítás
  title: Anyag nyomon követése &<br />Tanúsítási bizonyítékok
  subtitle: RIB A minőségi hajók kontrollált anyagokkal és dokumentált folyamatokkal kezdődnek. Az alábbiakban bemutatjuk, hogyan szervezzük az anyagtanúsítványt minden kritikus komponenscsoport számára.
  items:
    - title: Fújható csőanyag nyomon követése
      description: PVC CSMHypalon és / cső anyagokat a tervezett felhasználás, éghajlati viszonyok és célpiac alapján választják ki. A beszállítói műszaki adatok (TDS), anyag tétel adatai, a szövet kötetének UV nyomon követhetősége, valamint időjárási tesztjelentések, valamint REACH/SVHC nyilatkozatok elérhetők a megegyezett projektdokumentáció keretein belül.
      icon: tabler:circle
    - title: Tengeri alumínium nyomkövetés
      description: Alumínium törzs RIB projektek esetén az ötvözet minőségét, vastagságát és anyagadagjait az engedélyezett specifikációk szerint szabályozzák. Anyagteszt tanúsítványok (MTC/MTR), EN 10204 3.1 dokumentáció, kémiai összetételi és mechanikai tulajdonságok jelentések, valamint hő/tétel nyomon követhetősége biztosított a megállapodás helyén.
      icon: tabler:rectangle
    - title: GRP hajótest anyag és folyamatvezérlés
      description: Üvegszálas RIBshajótest, gélbevonat, gyanta, üvegszál megerősítés és maganyagok esetén kontrollált specifikációk alapján kezelhetők. Az anyag TDS/SDS, tételi nyilvántartások, laminált specifikációk, valamint a keményítő és műhely vezérlő nyilvántartásai a projekt megállapodás alapján elérhetők.
      icon: tabler:layers-subtract
    - title: Komponensdokumentáció támogatása
      description: Kiválasztott alkatrészek – beleértve a EVA fedélzeti anyagokat, üléseket, rozsdamentes acél hardvert, üzemanyagrendszereket, elektromos berendezéseket és tengeri kiegészítőket – esetében a beszállítói dokumentációt a végső konfiguráció és a célpiac követelményei alapján koordinálják.
      icon: tabler:package
    - title: Megfelelőségi Hatáskör Értesítés
      description: A tanúsítványok, tesztjelentések és megfelelőségi dokumentumok csak a vonatkozó dokumentumban megadott termékmodellre, anyagra, alkatrészre, gyártási tételre vagy projekt hatókörére vonatkoznak. Vegye fel velünk a kapcsolatot a célpiacával, célcélú felhasználásával és műszaki követelményeivel, hogy a megfelelő dokumentációs csomag még a megrendelés előtt megerősíthető lehessen.
      icon: tabler:info-circle
faq:
  title: CE Megfelelőség — Gyakran Ismételt Kérdések
  questions:
    - q: Minden Paddle Board Overstock RIB hajó CE tanúsított az EU piacára?
      a: RIB a katalógusunkban szereplő hajókat a RCD vonatkozó EU-irányelvek szerint tervezik és dokumentálták a 2013/53/EU megfelelőség érdekében.CE A jelölés modellenként, konfigurációnként érvényes. Vegye fel velünk a kapcsolatot egy modellspecifikus megfelelőségi hatókördokumentumért.
    - q: Mi a különbség RCD a megfelelőség és CE a jelölés között?
      a: RCD (Rekreációs Járművekről szóló irányelv 2013/53/EU) az EU jogszabálya, amely alapvető biztonsági követelményeket állapít meg.CE A jelölés az a vizuális szimbólum, amelyet egy olyan terméken helyeznek el, amelyet értékeltek és megerősítettek, hogy megfelel ezeknek a követelményeknek. A terméknek meg kell felelnie a RCD követelményeknek, mielőtt viselheti a CE jelzést.
    - q: Minden hajóhoz megadod a megfelelőségi nyilatkozatot?
      a: Igen. Minden RIB hajó, amelyet az EU piacára szállítanak, tartalmaz egy modell-specifikus EU Megfelelőségi Nyilatkozatot, amely felsorolja a vonatkozó irányelveket, a harmonizált szabványokat, a megfelelőségértékelési modult és a Notifikált Testület adatait.
    - q: Paddle Board Overstock melyik megfelelőségértékelési modult használja?
      a: A modul a tervezési kategóriától és a hajótípustól függ. A C tervezési kategóriába tartozó legtöbb RIB modell a Modul A-t (belső gyártásellenőrzés) használja. Az A/B tervezési kategóriájú hajók vagy bizonyos konfigurációk esetében a Modul B+C vagy B+D alkalmazható a Notified Body bevonásával. Tanácsot adunk az adott projekthez megfelelő modulról.
    - q: Meg tudja osztani a megfelelőségi dokumentációt, mielőtt leadnánk a rendelést?
      a: Egy alapos vizsgálat után megosztunk egy megfelelőségi hatókör dokumentumot, amely tartalmazza az alkalmazandó szabványokat, a megfelelőségi útvonalat és a rendelkezésre álló dokumentumtípusokat az Ön által értékelt modellhez. A teljes műszaki fájlokat a NDA alatt osztjuk meg a megrendelés visszaigazolása után.
    - q: Mi az a hajótestazonosító szám (HIN), és szerepel benne?
      a: A HIN egy 14 karakterből álló egyedi azonosító, amely állandóan fel van tüntetve minden hajón, és kódolja a gyártó kódját (MIC), a modellmegnevezést, a gyártási évet és a sorozatszámot. Minden RIB hajó esetében, amelyet az EU piacán helyeznek el, kötelező, és minden Paddle Board Overstock RIB-n szerepel.
    - q: Mennyi ideig őrzik a műszaki fájlokat?
      a: A 2013/53/EU követelményeinek megfelelően a gyártónak legalább 10 évig meg kell őriznie a műszaki dokumentációt a termék utolsó piaci forgalomba helyezésétől számítva. Paddle Board Overstock teljes műszaki dokumentációt tart fenn az összes legyártott modellről.
    - q: Segít az importőr kötelezettségeinek teljesítésében a RCD alapján?
      a: 'Igen. Biztosítjuk azt a dokumentációs csomagot, amire az EU behozóknak szükségük van az kötelezettségeik teljesítéséhez: a műszaki fájlhoz való hozzáférést, a megfelelőségi nyilatkozatot (DoC), a gyártói táblát, a használati utasítást és a termék nyomon követhetőségi nyilvántartásait. A RCD szerinti importőri kötelezettségek világosan dokumentálva vannak az megfelelőségi útmutatónkban.'
