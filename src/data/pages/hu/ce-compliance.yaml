      icon: tabler:folder
    - title: Hajótestrekord (hajónként nyomon követhetőség)
      description: 'Minden hajótestnek egyedi nyilvántartása van, amely összekapcsolja a Master Technical File-hez: HIN, gyártási dátum, csőparti, anyagtanúsítványok, nyomásteszt eredmény, végső konfiguráció, motor telepítése és szállítási cél.'
