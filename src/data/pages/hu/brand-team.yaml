hero:
  tagline: Csapatunk
  title: Az Emberek a Paddle Board Overstock mögött<br />— Mérnöki szabadság a vízen
  subtitle: 2012-ben alapították Weihai-ban, Kínában, a Paddle Board Overstock-t tengeri mérnökök, anyagtudósok és vízi sportok rajongói, akik hittek abban, hogy a professzionális szintű felfújható SUP deszkák világszerte elérhetővé tehetők.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock teljes csapatfotó — mérnöki, gyártási és vezetői csapat
founding:
  tagline: Alapításunk
  title: Egy part menti műhelyből<br />egy 12 000 m²-es létesítményhez
  subtitle: A Paddle Board Overstock-t egy olyan tengeri mérnökökből álló csapat alapította, akiknek több évtizedes összesített tapasztalata van a felfújható SUP tervezésében, a drop-stitch kivitelezésében és a globális vízi sport gyártásában.
  items:
    - title: 'Alapítva: 2012'
      description: Weiheiben, Kínában alapítva — egy fontos tengeri központ, mély hajóépítési hagyományokkal.
      icon: tabler:calendar
    - title: 200-300 alkalmazott
      description: Összesen 14+ K+F mérnök, minőségellenőrzési szakember és gyártótechnikus dolgozik náluk.
      icon: tabler:users
    - title: 12 000 m² létesítmény
      description: Dedikált gyártóüzem 6 termelősorral a SUP deszkák és tartozékaik gyártásához.
      icon: tabler:building-factory
    - title: 50+ kiszolgált ország
      description: Exportálás Európába, Amerikába, a Közel-Keletre, Ázsia és Csendes-óceáni térségbe, valamint Afrikába.
      icon: tabler:globe
leadership:
  tagline: Vezetés
  title: Vezetés és mérnöki irányítás
  subtitle: Vezetői csapatunk mély szakértelmet hoz a hajózási mérnöki területen, a nemzetközi kereskedelemben és a minőségirányításban.
  columns: 3
  items:
    - title: Alapító és vezérigazgató
      name: Toby Liu
      description: 15+ év tapasztalat a tengeri iparban. Korábban K+F vezető volt egy jelentős kínai tengeri gyártónál. Több szabadalom birtokosa a felfújható termékek tervezésében.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Főmérnök
      name: Zhang Wei
      description: 20+ év tapasztalat a polimer feldolgozás és felfújható szerkezetek tervezése terén. Korábban műszaki igazgató volt egy európai tengeri mérnöki cégnél.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: K+F igazgató
      name: Chen Ming
      description: Anyagtudományi PhD. drop-stitch technológiára és nagyfrekvenciás hegesztési folyamatokra specializálódott. 10+ év textil kompozit anyagokban.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Termelési igazgató
      name: Liu Qiang
      description: 18+ évnyi lean gyártás és gyártási vonal optimalizálás. A minőségi rendszereket építettük ki a 99,3%-os hibamentes arányunk mögött.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Minőségirányítási vezető
      name: Wang Fang
      description: 12+ év tengeri minőségellenőrzés. Minden gyártási tételnél nyomás-, varrási és terhelés-tesztelést felügyeli a kibocsátás előtt.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Értékesítési és Műveleti Igazgató
      name: Helen Lee
      description: 15+ évig dolgozik nemzetközi e-kereskedelemben és logisztikaban. 50 országban szállít táblákat+ evezőknek. 4 nyelven folyékonyan beszél.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Tervezési filozófia
  title: Mérnöki vezérelt tervezés<br />— Minden részlet számít
  subtitle: Mérnöki filozófiánk három alapelvre épül, amelyek minden általunk készített terméket irányítanak.
  list:
    - 'Megbízhatóság elsőként: Minden Paddle Board Overstock terméket tesztelnek, hogy bírja a valós körülményeket — a hidegvízi expedícióktól a trópusi tengerparti bérlésekig. Ott dolgozunk túl, ahol a legfontosabb az számít.'
    - 'Gyártási precizitás: Létesítményeink CNC vágást, nagyfrekvenciás hegesztést és automatizált nyomáspróbát alkalmaznak. Minden varrat, szelep és csatlakozás megfelel a dokumentált előírásoknak.'
    - 'Folyamatos innováció: K+F csapatunk folyamatosan értékeli az új anyagokat, gyártási módszereket és tervezési fejlesztéseket. Nem várunk a problémákra — előre látjuk azokat.'
