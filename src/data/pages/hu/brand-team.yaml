hero:
  tagline: Our Team
  title: The People Behind Paddle Board Overstock<br />— Engineering Freedom on Water
  subtitle: Founded in 2012 in Weihai, China, Paddle Board Overstock was built by marine engineers, material scientists, and water sports enthusiasts who believed in making professional-grade inflatable paddle boards accessible worldwide.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock full team photo — engineering, production, and leadership
founding:
  tagline: Our Founding
  title: From a Coastal Workshop<br />to a 12,000 m² Facility
  subtitle: Paddle Board Overstock was founded by a team of marine engineers with decades of combined experience in inflatable SUP design, drop-stitch construction, and global water sports manufacturing.
  items:
    - title: "Founded: 2012"
      description: Established in Weihai, China — a major maritime hub with deep shipbuilding heritage.
      icon: tabler:calendar
    - title: 200-300 Employees
      description: Including 50+ R&D engineers, quality control specialists, and production technicians.
      icon: tabler:users
    - title: 12,000 m² Facility
      description: Dedicated manufacturing plant with 6 production lines for SUP boards and accessories.
      icon: tabler:building-factory
    - title: 50+ Countries Served
      description: Exporting to Europe, Americas, Middle East, Asia-Pacific, and Africa.
      icon: tabler:globe
