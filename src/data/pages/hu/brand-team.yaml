hero:
  tagline: Csapatunk
  title: Az Aquafarer mögött álló emberek<br />— Mérnöki szabadság a vízen
  subtitle: 2012-ben alapították Kínában, Qingdaóban, a Aquafarer-t tengermérnökök, anyagtudósok és vízisport-rajongók hozták létre, akik hittek abban, hogy a professzionális minőségű felfújható vízijárművek világszerte hozzáférhetővé tehetők.
  image:
    src: /images/team-all.webp
    alt: Aquafarer teljes csapatfotó — mérnöki, gyártási és vezetői
founding:
  tagline: Alapításunk
  title: Egy part menti műhelyből<br />egy 12 000 m²-es létesítményhez
  subtitle: Aquafarer-t egy tengeri mérnökökből álló csapat alapította, akik évtizedes közös tapasztalattal rendelkeznek felfújható hajók tervezésében, PVC/Hypalon gyártásában és globális tengeri berendezések gyártásában.
  items:
    - title: 'Alapítva: 2012'
      description: Kínában, Qingdaóban alapították — egy jelentős tengeri központban, gazdag hajóépítési örökséggel.
      icon: tabler:calendar
    - title: 200-300 alkalmazott
      description: Összesen 50+ K+F mérnököt, minőségellenőrzési szakértőt és termelési technikust.
      icon: tabler:users
    - title: 12 000 m² létesítmény
      description: Kizárólagos gyártóüzem 6 gyártósorral RIBs, felfújható hajók és SUP deszkák számára.
      icon: tabler:building-factory
    - title: 50+ kiszolgált ország
      description: Exportálás Európába, Amerikába, a Közel-Keletre, Ázsia és Csendes-óceáni térségbe, valamint Afrikába.
      icon: tabler:globe
leadership:
  tagline: Vezetés
  title: Vezetés és mérnöki irányítás
  subtitle: Vezetői csapatunk mély szakértelmet hoz a hajózási mérnöki területen, a nemzetközi kereskedelemben és a minőségirányításban.
  columns: 3
  items:
    - title: Alapító és vezérigazgató
      name: Toby Liu
      description: 15+ évig dolgozik tengeri gyártásban. Korábban egy nagy kínai hajógyártónál vezette az R&D-t. Több szabadalmat is birtokolt felfújható hajótervezésben.
      icon: tabler:crown
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-toby-liu-team.webp
    - title: Főmérnök
      name: Zhang Wei
      description: 20+ év PVCHypalon gyártási és mély-V hajótest tervezés területén. Korábbi műszaki igazgató egy európai tengerészmérnöki cégnél.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: K+F igazgató
      name: Chen Ming
      description: Anyagtudományi PhD. drop-stitch technológiára és nagyfrekvenciás hegesztési folyamatokra specializálódott. 10+ év textil kompozit anyagokban.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Termelési igazgató
      name: Liu Qiang
      description: 18 év tapasztalat a könnyűszerkezetes gyártásban és a gyártósori optimalizálásban. Six Sigma Fekete Öv. Megvalósított ISO 9001 minőségügyi rendszereket.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Minőségirányítási vezető
      name: Wang Fang
      description: 12+ évig dolgozik tengeri minőségellenőrzésben. CE Tanúsított és ISO auditor. Minden gyártási tétel tesztelését felügyeli.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Értékesítési és Műveleti Igazgató
      name: Helen Lee
      description: 15+ év nemzetközi B2B kereskedelemben. OEMMenedzselt /ODM partnerségek 30+ országban. 4 nyelven folyékonyan beszél.
      icon: tabler:briefcase
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: Tervezési filozófia
  title: Mérnöki vezérelt tervezés<br />— Minden részlet számít
  subtitle: Mérnöki filozófiánk három alapelvre épül, amelyek minden általunk készített terméket irányítanak.
  list:
    - 'Elsősorban megbízhatóság: Minden Aquafarer terméket valós körülmények között tesztelünk — a hidegvízi mentőműveletektől a trópusi üdülőhelyi bérlésekig. Ahol a legnagyobb jelentősége van, ott túlmérnökelünk.'
    - 'Gyártási precizitás: Létesítményeink CNC vágást, nagyfrekvenciás hegesztést és automatizált nyomáspróbát alkalmaznak. Minden varrat, szelep és csatlakozás megfelel a dokumentált előírásoknak.'
    - 'Folyamatos innováció: K+F csapatunk folyamatosan értékeli az új anyagokat, gyártási módszereket és tervezési fejlesztéseket. Nem várunk a problémákra — előre látjuk azokat.'
