hero:
  tagline: Partnerek és forgalmazás
  title: Legyen Aquafarer partner<br />— Globális terjesztési hálózat
  subtitle: Csatlakozzon Aquafarer globális partnerhálózatához. 50+ országban dolgozunk tengeri forgalmazókkal, hajókereskedőkkel, felszerelés-kiskereskedőkkel és márkapartnerekkel.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarer globális partner- és forgalmazói hálózat
content_programs:
  tagline: Partnerprogramok
  title: Partnerprogramok<br />Növekedésre tervezve
  subtitle: Legyen Ön forgalmazó, kereskedő vagy márkapartner, Aquafarer olyan programokat kínál, amelyek az Ön vállalkozását támogatják.
  columns: 3
  items:
    - title: Forgalmazói program
      description: Exkluzív területi terjesztés mennyiségi kedvezményekkel, marketingtámogatással és közvetlen gyári hozzáféréssel. Minimális elköteleződés szükséges a terület nagyságától függően.
      icon: tabler:world
    - title: Kereskedői program
      description: Közvetlen kereskedői árak, termékképzés, marketinganyagok és garanciális támogatás kiskereskedelmi helyszínek és online áruházak számára.
      icon: tabler:building-store
    - title: OEM/ODM partnerség
      description: Teljes körű OEM és ODM gyártás egyedi márkázással, csomagolással és termékspecifikációval. A koncepciótól a konténerig.
      icon: tabler:certificate
    - title: Márkapartnerség
      description: Közös márkázás, saját márkás termék és exkluzív modellprogramok a tengerészeti és szabadtéri szabadidős szférában már ismert márkák számára.
      icon: tabler:stars
    - title: Kormányzati és intézményi
      description: Előnyben részesített beszállítói programok kormányzati ügynökségek, parti őrség, hadsereg és humanitárius szervezetek számára. Tenderre kész dokumentáció.
      icon: tabler:building-community
    - title: Üdülőhely- és bérbérlő partner
      description: Flottaárak, következetes minőség és egyedi márkázás üdülőhelyek, búvárközpontok és bérlési műveletek számára világszerte.
      icon: tabler:sun
content_benefits:
  tagline: Miért érdemes partnernek lenni velünk
  title: Miért választják partnereink a Aquafarer-t
  subtitle: Partnereink kihasználhatják az igazi gyártási képességeket, a következetes minőséget és az ügyfélbarát támogatást.
  list:
    - 'Közvetlen gyári hozzáférés: Dolgozzon közvetlenül a gyártási csapatunkkal — közvetítők nélkül. Gyorsabb válaszok, jobb árak és teljes láthatóság a gyártásban.'
    - 'Testreszabásra kész: Márkázza termékeit egyedi színekkel, logókkal, csomagolással és specifikációval. Minimális rendelési mennyiségek a piacához igazítva.'
    - 'Minőség garantált: ISO 9001 tanúsított gyártás CE, UKCA és BSCI megfelelőséggel. Minden terméket ellenőrzünk szállítás előtt.'
    - 'Globális logisztika: Szállítás Qingdaoból, Kínából FOB, CIF és DDP opciókkal. Amerikai raktár Montclair, CA, Észak-Amerikai terjesztéshez.'
    - 'Marketingtámogatás: Termékkatalógusok, fényképezés, műszaki dokumentáció és digitális eszközök az értékesítési tevékenység támogatására.'
    - 'Képzés és támogatás: Termékképzés az értékesítési csapat számára, műszaki támogatás ügyfelei számára, és garanciális szolgáltatás koordináció.'
content_process:
  tagline: Hogyan lehet partner
  title: Egyszerű Partnerségi Folyamat
  subtitle: A partnerségi folyamatunk egyszerű — úgy lett kialakítva, hogy gyorsan elkezdhessen Aquafarer termékeket értékesíteni.
  items:
    - title: '1. lépés: Jelentkezés beküldése'
      description: Töltse ki a partneri jelentkezési űrlapunkat a cégprofiljával, célpiacával és termékérdeklődési körével.
    - title: '2. lépés: Jogosultság ellenőrzése'
      description: A partnerségi csapatunk áttekinti a jelentkezését, és 3 munkanapon belül felveszi Önnel a kapcsolatot a lehetőségek megbeszélése érdekében.
    - title: '3. lépés: Megállapodás és beállítás'
      description: Írja alá a partneri megállapodást, állítsa be fiókját, és kapja meg a partneri árazást, marketinganyagokat és termékmintákat.
    - title: '4. lépés: Képzés és indulás'
      description: Termékképzést, értékesítési támogatást és marketinganyagot biztosítunk. Készen áll a termékek értékesítésének megkezdésére.
cta:
  title: Készen áll, hogy Aquafarer partner legyen?
  subtitle: Jelentkezzen partneri programra, és csapatunk 3 munkanapon belül válaszol.
  actions:
