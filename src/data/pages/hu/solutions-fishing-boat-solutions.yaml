content_challenge:
  tagline: A kihívás
  title: Halászhajók szüksége van<br />Stabilitás, hatótávolság és tartósság
  subtitle: Akár kereskedelmi halászhajókat üzemeltetsz, kooperatív flottát irányítasz, vagy horgásztúrákat üzemeltetsz — a hajódnak megbízhatóan kell működnie minden nap.
  paragraphs:
    - A halászhajóknak stabil platformokra van szükségük a zsinórok kezeléséhez, a fogás kezeléséhez és a fedélzeten biztonságos mozgáshoz. Fújhatók, és RIBs csövkialakításuk révén veleszületett stabilitást biztosítanak — jelentős előny a hasonló hosszúságú merev testekhez képest.
    - Az üzemanyag-hatékonyság fontos a halászati műveletek számára, ahol az üzemeltetési költségek közvetlenül befolyásolják a nyereségességet.RIBs Felfújható hajók könnyebbek, mint az egyenértékű merev hajók, kevesebb energiát igényelnek és kevesebb üzemanyagot égnek el – ami kritikus a napi hajókat üzemeltető kereskedelmi üzemeltetők és a flottaköltségvetést kezelő szövetkezetek számára.
    - A tengeri környezetben a tartósság elengedhetetlen. A sós víz, UV az expozíció és a folyamatos használat olyan anyagokat igényel, amelyek képesek kibírni a zord körülményeket degradálás nélkül. A kereskedelmi és szövetkezeti üzemeltetők számára a megbízhatóság közvetlenül befolyásolja a bevételt — egy eltört hajó halásznapok elvesztését jelenti.
    - Paddle Board Overstock A horgászkonfigurációk közé tartoznak bottartók, halkeresők, csalikutak, élőkútok és rakománykezelő megoldások, amelyeket komolyabb horgászati alkalmazásokhoz terveztek kereskedelmi, szövetkezeti és szabadidős tevékenységekben.
content_solution:
  tagline: Megoldásunk
  title: Horgászatra alkalmas konfigurációk
  subtitle: Minden Paddle Board Overstock halászhajó konfigurálható az Ön egyedi horgászati alkalmazásához.
  list:
    - Rúdtartó rögzítés — gyárilag telepített vagy utángyártható telepítésre
    - Halkereső/GPS rögzítőlap konzol pozícióban
    - Csali-kút vagy élőkút opciók charter- és kereskedelmi üzemeltetők számára
    - Hűtő/tároló konfigurációk fogások kezelésére
    - Mély-V törzs a tengeri képességhez — nyugalékban stabil, sebességnél sima
    - PVC vagy Hypalon csőopciók — Hypalon UV hosszabb expozícióhoz
    - A külső motorok modelltől és alkalmazástól függően 15 HP és 115 között mozognak HP
content_segments:
  tagline: Horgászprofilok
  title: Fújható horgászhajó megoldások<br />Operátortípus szerint
  subtitle: A part menti sporthorgászattól a kereskedelmi hosszúvonalon át — különböző halászati műveletek eltérő hajótest-konfigurációkat, teljesítménytartományokat és fedélzeti beállításokat igényelnek. Minden hajót úgy szabunk, hogy illeszkedjen a halászathoz, a vizekhez és a munkastílushoz.
  items:
    - title: Kereskedelmi halászati cégek
      subtitle: Flotta munkahajók napi halászati műveletekhez, hálókezeléshez, fogásszállításhoz
      description: A kereskedelmi halászcégek munkahajókat üzemeltetnek háló beállítására és visszanyerésére, csapdaszervizre, hosszúvonalra és fogásszállításra. Ezek a hajók naponta sós vízi környezetben dolgoznak, és nehéz terheket, folyamatos fedélzeti kezelést és hosszú üzemidőt kell viselniük. Az üzemanyag-hatékonyság és az alacsony karbantartás kritikus a flotta jövedelmezőségéhez. A hajónak stabil munkaplatformokat kell biztosítania a személyzet felszerelésének és fogásának változó tengeri körülmények között.
      features:
        - Lapos fedélzeti elrendezés hálókezeléshez, csapdák halmozmozásához és haltárolásához
        - Üzemanyag-takarékos 40-115 HP külső motor, alacsony napi üzemeltetési költség
        - Nehéz csövek Hypalon a mindennapi használatban a súrolás elleni védelemre
        - Megerősített dörzsölőslétesek gyakori dokk- és hajóérintkezéshez
        - Önmagát besülő fedélzet a könnyű lemosáshoz a műtét után
        - Flottaárképzés és következetes specifikációk többhajós üzemeltetők számára
    - title: Charter horgászüzemeltetők
      subtitle: Többutas kényelme, fogáskezelés, biztonsági tanúsítvánnyal
      description: Üzemeltetők fél napos és egész napos horgásztúrákat üzemeltetnek — a part menti zátonyhalászattól a tengeri fenékhorgászatig. A hajónak szüksége van biztonsági minősítésű utasülésekre, bőséges fedélzeti helyre több horgász számára, valamint integrált élőkútra, hogy a csalit és a fogást frissen tartsák az út során. A vendégek kényelme közvetlenül befolyásolja az utazási értékeléseket, ismétlődő foglalásokat és az online értékeléseket.
      features:
        - Konzolkormány lüntetéselnyelő vödörülésekkel
        - Gyárilag telepített rúdtartók (4–8 pozíció)
        - 60–115 HP külső hatótávolság a tengeri hajózási sebességekhez
        - CE C vagy B kategóriájú minősítés kereskedelmi utasszállításokhoz
        - Bimini vagy T-top napellenjő a vendégek kényelméért hosszabb utazásokon
    - title: Kézműves és kisléptékű kereskedelmi halászok
      subtitle: Megbízható munkahajók a mindennapi megélhetéshez
      description: Független halászok, akik a hajójukra támaszkodnak elsődleges jövedelemforrásként — hálók állítására, halcsapdák gondozására vagy kézi behajtásra a parthoz. Az elsődleges prioritásod az üzemanyag-takerékosság, az egyszerű karbantartás, amit magad is végezhetsz, és egy olyan hajó, amely közepes mennyiségű fogást és felszerelést kezel anélkül, hogy feláldozná a stabilitást.
      features:
        - Üzemanyag-takarékos 15–40 HP külső motor alacsony üzemeltetési költséggel
        - Hypalon CSM csövek a hosszabb UV és csiszsolási ellenálláshoz
        - Lapos fedélzetes elrendezés hálókezeléshez és haltároláshoz
        - Könnyű partraszállási képesség felfújható gerincvédelemmel
    - title: Halasztási szövetkezetek
      subtitle: Fogásgyűjtés, tagok szállítása, ellátmányelosztás
      description: A halászati szövetkezetek közösségi alapon működő flottákat üzemeltetnek a taghalászoktól származó fogások begyűjtésére, a felszerelések távoli halászati közösségekhez történő szállítására, és a termés piacokra történő eljuttatására. Ezeknek a munkahajóknak nagy teherbírásra, megbízható napi üzemelésre, valamint könnyű karbantartásra van szükségük távoli helyeken. A szövetkezetek gyakran fejlődő régiókban működnek, ahol a pótalkatrész-ellátás és a szervizháttér korlátozott, ezért egyszerű külmotor-konfigurációkra és tartós kivitelezésre van szükség.
      features:
        - Nagy teherbírás a zsákmány és az ellátmány szállítására
        - Egyszerű külső szerkezet a helyszíni karbantartás megkönnyítéséhez
        - Masszív PVC vagy Hypalon kivitel a költségvetési rugalmasság érdekében
        - Lapos rakfelület rögzítőpontokkal az áru rögzítéséhez
        - Üzemanyag-takarékos működés, amely minimalizálja az együttműködési működési költségeket
    - title: Sport- és horgászatrajongók
      subtitle: Teljesítmény és stílus komoly horgászok számára
      description: Tapasztalt horgászok számára, akik egy olyan képes horgászhajót keresnek, amely gyorsan elvisz a távoli helyekre, stabil álló harcpozíciókat biztosít, és prémium kivitelezést kínál. A hajónak otthonosnak kell éreznie magát, akár két mérföldnyire a parttól egy zátonyhoz hajózva, akár távoli torkolati mellékágakat felfedezve.
      features:
        - Mély-V RIB hajótest a sima utazáshoz hullámzó vízen
        - Halradar/GPS tartólemez előre bekötve a konzolon
        - Csali-tartó és hűtő a hátsó ülés moduljába integrálva
        - Egyedi EVA pakli színválaszték a hajó/cső grafikájához igazítva
    - title: Horgászvezetők és ökotúra-üzemeltetők
      subtitle: Vezetett horgászatok látogató horgászok számára
      description: Az idegenvezetők kis csoportokat visznek látogató horgászokból termékeny horgászhelyekre — gyakran a horgászatot ökoturisztikai elemekkel, mint például madármegfigyelés vagy mangrove felfedezés kombinálva. A hajónak száraznak és kényelmesnek kell lennie a kis hajókhoz nem szokott vendégek számára, könnyű beszállási lehetőséggel és árnyékos helyekkel.
      features:
        - Bimini tető vagy T-tető rögzítési pontok gyárilag felszerelve
        - Simán működő beszállólétra a könnyű újra-felszálláshoz
        - Csendes 4 ütemű külmotor a zavarás minimalizálása érdekében
        - Száraz tárolórekeszek vendéghívók, pénztárcák, fényképezőgépek számára
