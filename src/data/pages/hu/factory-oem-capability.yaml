services:
  - title: Terméktervezés és mérnöki munka
    description: Saját Kutatás-fejlesztési csapatunk az Ön koncepciójával vagy specifikációjával dolgozik ki CAD rajzokat, 3D modelleket és prototípusokat. Formátervezést, hajótest-forma optimalizálást és anyagválasztási útmutatást kínálunk.
  - title: Egyedi márkaépítés és grafika
    description: Teljes színű digitális nyomtatás, szitanyomás, dombornyomás és címkék lehetőségei. Márkaspecifikus fedélzetgrafikát, cső márkázást és kiskereskedelmi csomagolást fejlesztünk.
  - title: Anyag és specifikáció testreszabása
    description: PVC Válassz (standard, környezetbarát, tűzálló), Hypalon/CSMdrop-stitch, és hibrid konstrukciók közül. Egyedi csőszínek, anyagsúlyok és megerősítési lehetőségek.
  - title: Csomagolás és logisztika
    description: Egyedi kiskereskedelmi csomagolás, privát címkés dobozok, vákuumcsomagolás, raklapozás és konténerrakodás.FOB QingdaoCIF, vagy DDP szállítási feltételek elérhetők.
