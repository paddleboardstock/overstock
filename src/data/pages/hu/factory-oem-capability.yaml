why_us:
  - title: Vertikális integráció
    description: Saját gyárral, formákkal és ellátási lánccal rendelkezünk — nincsenek közvetítők, nincsenek alvállalkozók. Ez lehetővé teszi számunkra a minőség, a költség és a szállítás ellenőrzését.
  - title: Kettős tanúsítás
    description: ISO 9001 minőségirányítási és BSCI társadalmi megfelelőségi tanúsítvány. A gyári audit jelentések kérésre elérhetők.
  - title: CE Megfelelőség
    description: Minden standard modell CE 2013/53/EU tanúsítással rendelkezik. Egyedi modellek CE tanúsíthatók a bevált folyamatunkon keresztül.
  - title: Alacsony MOQ
    description: Standard modelleknél akár 5 egységgel is kezdhet. Segítünk a feltörekvő márkáknak a piacra lépésben anélkül, hogy túl sok készletet köteleződnének el.
