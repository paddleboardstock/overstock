hero:
  tagline: OEM/ODM Gyártás
  title: OEM & Private Label gyártás
  subtitle: A koncepciótól a konténerig — szabd meg minden részletet a felfújható vízi jármű vonaladnak
intro: Aquafarer Átfogó OEM és ODM szolgáltatásokat kínál márkák, forgalmazók és kormányzati szervek számára világszerte. 10+ év exporttapasztalattal és 12 000 m²-es, ISO 9001-es és BSCI tanúsított gyárral mindent intézünk a terméktervezéstől és forma fejlesztésétől a teljes körű gyártásig, csomagoláson és logisztikán át.
