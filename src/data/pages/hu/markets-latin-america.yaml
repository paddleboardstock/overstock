overview_section:
  tagline: Piaci áttekintés
  title: A latin-amerikai SUP piac
  paragraphs:
    - Latin-Amerika a világ egyik leggyorsabban növekvő stand-up evezős piaca. A hosszú partvonalak két óceánon, a jól megalapozott tengerparti turizmus gazdasága és az erős deszatasport-kultúra révén a független kiskereskedők Tulumtól Florianópolisig egyre növekvő ügyfélkört biztosítanak – turisták, akik veszik az első órájukat, a hétvégi evezősök, valamint egy növekvő helyi SUP verseny- és szörfközösség.
    - The retail landscape is dominated by small and mid-sized independent shops: tengerparti evezőiskolák, amelyek árulják a bérletet, szörfüzletek SUP vonalakat adnak, és online eladók, akik először importálnak közvetlenül egymást. Ezek a vállalkozások ritkán igényelnek egyetlen modellt tartalmazó konténercsomagot — rendelésenként 5–20 deszkára van szükségük, keverve kezdőbarát mindenoldalú modelleket és néhány prémium kiadást.
  customer_types:
    - title: Beach Town kiskereskedők
      description: Üdülővárosokban turistákat kiszolgáló üzletek — tartós kezdő táblákra van szükségük mennyiségben, valamint néhány prémium modellre kiállításra és eladásra.
    - title: Evezőiskolák és bérlő flották
      description: Az iskolák párosítják az órákat a kiskereskedelemmel, a bérlő flották pedig minden szezonban frissítik a táblákat vegyes modelles rendelésekkel.
    - title: Online eladók
      description: A spanyol és portugál nyelvű e-kereskedelmi eladók SUP konténerméretarány nélkül vezetik be a kategóriát a nemzeti piacukra.
shipping_section:
  title: Hajózás Latin-Amerikába
  paragraphs:
    - A rendelések Weihai-i logisztikai bázisunkról szállítják. Expressz légi áruszállító ruhák minták, 1–3 fedélzeti megrendelés és sürgős újratöltés; a konszolidált tengeri áruszállítás a gazdaságos útvonal 5–20 fedélzetes nagykereskedelmi megrendelésekhez a régió főbb kikötőibe.
    - Teljes és pontos exportpapírokat biztosítunk — kereskedelmi számlát és csomagoláslistát — hogy a vámellenőrzés zökkenőmentes legyen. Az importvámokat és adókat az Ön országa határozza meg, és az importőr fizeti őket; soha nem csomagolunk homályos "adók beleértve" ígéreteket a szállítási árajánlatba.
  customs_note: Az importszabályok és vámok jelentősen eltérnek latin-amerikai országokban. Vásárlás előtt ellenőrizze országának jelenlegi importrendszerét felfújható vízisportfelszerelés tekintetében, és kérjen tőlünk bármilyen további dokumentumot, amire a brókered szüksége van.
faq_section:
  title: Latin-Amerika GYIK
  items:
    - q: Kaphatok árajánlatot spanyolul vagy portugálul?
      a: Csapatunk Latin-Amerikában dolgozik vásárlókkal, és képes árajánlatokat és rendelési megerősítéseket kezelni spanyol és portugál anyanyelvű ügyfelek számára. Kérdezze meg a kérdését.
    - q: Küldök az én országomba Latin-Amerikába?
      a: A régióban szállítunk szállítást — Mexikóba, Brazíliába, Kolumbiába, Peruba, Chilébe, Argentínába, Ecuadorba és azon túl. Erősítse meg pontos célját az ajánlatkérésében, és ellenőrizzük a jelenlegi áruszállítási szolgáltatást.
    - q: Mi a nagykereskedelmi minimuma a latin-amerikai kiskereskedők számára?
      a: Összesen öt deszka, bármely raktáron lévő modell kombinálható. Ez a mennyiség határozza meg az árkategóriádat — egy szállításban kombinálhatók az all-around, túra- és művészeti kiadások.
    - q: Ki fizeti az importvámot az én országomban?
      a: Te, mint az importőr, az országod szabályai szerint. Mi biztosítjuk a helyes, teljes dokumentációt (kereskedelmi számla, csomaglista), így a vámkezelés kiszámítható — lásd nemzetközi szállítási oldalunkat a teljes információért.
