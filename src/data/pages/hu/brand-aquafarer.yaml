trustSignals:
  tagline: Bizalmi jelek
  title: Miért megbízható partner a Aquafarer
  manufacturing:
    title: Gyártási képesség
    body: '12 000 m²-es gyártó létesítmény 200-300 képzett munkással és 14+ K+F mérnökkel. ISO 9001 tanúsított minőségirányítási rendszert alkalmaz. Éves termelés: 15 000 felfújható vízi jármű egység, amely 50+ országot szolgál ki.'
    stats:
      - label: Létesítmény mérete
        value: 12,000 m²
      - label: Munkaerő
        value: 200-300
      - label: Kutatási és fejlesztési mérnökök
        value: 14+
      - label: Éves kapacitás
        value: 15,000
  quality:
    title: Minőség iránti elkötelezettség
    body: Az anyagvizsgálattól a végső tesztelésig a Aquafarer rendszerszintű minőségi folyamatokat tart fenn, hogy megbízható tengeri termékeket szállítson. Minden egységet nyomáspróbának, varratellenőrzésnek és teljesítményellenőrzésnek vetnek alá a szállítás előtt.
    items:
      - CE Tanúsított — 64 modell felel meg az európai biztonsági előírásoknak
      - ISO 9001:2015 — Minőségirányítási rendszer tanúsítva
      - UKCA Megjelölt — az Egyesült Királyság piacának megfelelőség
  global:
    title: Globális jelenlét
    body: Aquafarer ügyfeleket szolgál ki több globális piacon, támogatva a forgalmazókat, kültéri márkákat és professzionális tengeri felhasználókat 50+ országban Európában, Ázsia-Csendes-óceán térségében, Amerikában, a Közel-Keleten és Afrikában.
comparison:
  tagline: Márkamenedzsment
  title: Aquafarer a piacon
  position: Mérnöki fókuszú tengeri gyártó, amely az felfújható vízi járművek szakértelmét ötvözi a teljes OEM/ODM képességgel, egyedi fejlesztéssel és 12+ éves export termelési tapasztalattal.
  strengths:
    - Felfújható vízi járművek mérnöki szaktudása
    - Teljes OEM/ODM gyártási kapacitás
    - Egyedi termékfejlesztés és tervezés
    - 12 000 m² ISO-tanúsítvánnyal rendelkező gyártó létesítmény
  bestFor:
    - Szabadtéri szórakozást kereső felhasználók, akik megbízható felfújható vízijárműveket keresnek
    - Tengeri üzemeltetők, akik kereskedelmi minőségű berendezést igényelnek
    - Márkapartnereknek, akiknek OEM/ODM gyártásra van szükségük
    - Professzionális mentő- és járőröző szervezetek
