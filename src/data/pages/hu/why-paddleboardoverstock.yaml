hero:
  tagline: Miért Paddle Board Overstock
  title: Másképp építettek. Tartósnak építettek.<br />A Water Adventures világméretű táblái
  subtitle: Nem csupán egy gyár – egy evezősekből és mérnökökből álló csapat, akik prémium felfújható deszkákat terveznek, tesztelnek és SUP építenek családoknak, kalandoroknak és kluboknak világszerte.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock gyártási minőség és szakértelem
pillars:
  tagline: Három minőségi pillér
  title: Miért választják az evezősök világszerte Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Kereskedelmi Használatra Tervezve
      description: A deszkákat évekig tartó rendszeres evezésre terveztük. Kereskedelmi PVC minőségű, drop-stitch megerősített magok, UV stabil anyagok és tereptesztelt hardverek alacsonyabb karbantartást és hosszabb élettartamot jelentenek a vízen.
      icon: tabler:building-factory
      callToAction:
        text: Tekintse meg a kereskedelmi termékvonalat
        href: /products
    - title: Tesztelve a szabványokon túl
      description: Minden lapot 24-48 órán át felfújunk a névnyomásának 1,25-szeresére felfújva, mielőtt elhagyná a gyárunkat — 100%-ban nyomástesztelve, 99,3%-ban hibátlan. A deszkelapod már a vízbe érve bizonyított, hogy szilárd.
      icon: tabler:shield-check
      callToAction:
        text: Nézd meg, hogyan tesztelünk
        href: /quality
    - title: Globális Körülményekre Tervezve
      description: 'Termékek optimalizálva minden éghajlatra: hidegvíz PVC formulák Európának, UV-álló anyagok a Közel-Keletre és Ausztráliába, páramentes kezelések Délkelet-Ázsiának. Minden szállítmány a rendeltetési helyének környezeti feltételeihez van kalibrálva.'
      icon: tabler:world
