reasons:
  tagline: A Paddle Board Overstock különbség
  title: Mi Tesz Minket Különlegessé
  isBeforeContent: false
  columns: 3
  items:
    - title: Valódi Gyártás, Nem Kereskedés
      description: Saját tulajdonban lévő és működtetett 12 000 m²-es gyárunk van. Amikor a Paddle Board Overstock-val működik együtt, közvetlenül azokkal az emberekkel dolgozik, akik megtervezik, megmérnöklik és legyártják a termékeit — közvetítők nélkül.
      icon: tabler:building-factory
    - title: Mérnöki Alapú Hozzáállás
      description: A tervezési folyamatunk a felhasználási esettől indul, nem a termékkategóriától. Optimalizáljuk a hajótest alakját, az anyagválasztást és a konfigurációt annak megfelelően, hogyan fogják a deszka tényleges használatát a vízen alkalmazni.
      icon: tabler:engine
    - title: Bizonyított minőség
      description: Minden lapot 24-48 órán át nyomásteszten kell 1,25-szeres a névleges nyomásnak a szállítás előtt, és a szállítmányaink 99,3%-a hibátlanul érkezik — garanciánk támogatásával.
      icon: tabler:award
    - title: Evezős Első Tervezés
      description: 'Minden modell azzal kezdődik, hogyan evezsz: stabil platformok kezdőknek, áramvonalas formák túrákhoz, és teljes méretű deszkolók jógához. Valódi evezőknek tervezünk, nem bemutatóterem specifikációinak.'
      icon: tabler:adjustments
    - title: Globális logisztika
      description: Amerikai raktár Kaliforniában, közvetlen szállítás Weihaitól, légi fuvar sürgős rendelésekhez. Világszerte intézzük a vámügyintézést és a dokumentációt.
      icon: tabler:truck-delivery
    - title: Élettartam támogatás
      description: A 20 évvel ezelőtt épített deszkák mögött állunk. Valódi alkatrészek, műszaki tanácsok, javítási tanácsadás — csapatunk ott van, amikor szüksége van ránk, bárhol is vagy.
      icon: tabler:lifebuoy
testimonials:
  tagline: A Paddlers Worldwide bizalma
  title: Mit mondanak az evezők
  items:
    - content: Az én Ocean Voyagerem mindent elbírt a nyugodt tóreggelektől a hullámos tengerparti délutánokig. Két szezon után még mindig úgy néz ki és utazik, mint új.
      name: — Rekreációs evező, Kalifornia
    - content: Ideges voltam, amikor az első felfújható deszkámat online vettem, de a minőség már a felfújáskor nyilvánvaló volt. Merev, stabil és gyönyörűen befejezett.
      name: — Első SUP tulajdonos, Németország
    - content: Minden nyári hétvégén családként evezünk. Három deszkálat, nulla probléma, és a gyerekek imádják a fényes dizájntokat.
      name: — Családi evező, Ausztrália
    - content: A nyomásteszt nem marketingbeszéd — a boardom teljes nyomáson kőkemény, és egy év heti evezés után nem nyújt nyúlást.
      name: — Weekly Paddler, Hollandia
cta:
  title: Készen állsz, hogy megtaláld a tökéletes deszkát?
  subtitle: Beszélj evezős szakértőinkkel őszinte tanácsokért a megfelelő deszka kiválasztásához — nincs nyomás, csak valódi segítség.
  actions:
    - variant: primary
      text: Beszéljen csapatunkkal
      href: /contact
    - text: Termékkatalógus letöltése
      href: /resources
