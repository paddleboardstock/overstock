reasons:
  tagline: A Paddle Board Overstock Különbség
  title: Mi Tesz Minket Különlegessé
  isBeforeContent: false
  columns: 3
  items:
    - title: Valódi Gyártás, Nem Kereskedés
      description: Miénk és üzemeltetésünk alatt áll egy 12 000 m²-es gyár. Amikor a Paddle Board Overstock-val működik együtt, közvetlenül azokkal a személyekkel dolgozik, akik megtervezik, megépítik és legyártják termékeit — közvetítők nélkül.
      icon: tabler:building-factory
    - title: Mérnöki Alapú Hozzáállás
      description: Tervezési folyamatunk a felhasználási esetből indul, nem a termékkategóriából. Optimalizáljuk a hajótest formáját, az anyagválasztást és a konfigurációt arra, hogy a felszerelés hogyan lesz ténylegesen használva kereskedelmi környezetben.
      icon: tabler:engine
    - title: Tanúsított Minőség
      description: CE tanúsított, ISO minőségirányítási rendszer, BSCI előírásoknak megfelelő, REACH szabványoknak megfelelő, USCG III/V típusú jóváhagyott mentőmellények; minden termék megfelel a vonatkozó nemzetközi szabványoknak.
      icon: tabler:certificate
    - title: Rugalmas OEM/ODM
      description: Csőszínek, konzol elrendezés, márkajelzés, csomagolás — az Ön specifikációi szerint testreszabjuk. Nincs minimális rendelési nyomás. Kezdje egy prototípussal, majd növekedjen magabiztosan.
      icon: tabler:adjustments
    - title: Globális logisztika
      description: US raktár Kaliforniában, közvetlen szállítás Qingdaóból, légi fuvar sürgős rendelésekhez. Világszerte intézzük a vámügyintézést és a dokumentációt.
      icon: tabler:truck-delivery
    - title: Élettartam támogatás
      description: Támogatjuk a 20 évvel ezelőtt épített hajókat is. Eredeti alkatrészek, műszaki tanácsadás, javítási útmutatás — csapatunk rendelkezésedre áll, amikor szükséged van rá, bárhol is vagy.
      icon: tabler:lifebuoy
testimonials:
  tagline: Világszerte márkák által megbízható
  title: Mit mondanak partnereink
  items:
    - content: Több kínai gyártóval dolgoztunk együtt, de a Paddle Board Overstock kiemelkedik mérnöki támogatásával és következetes minőségével. A márkánkat a sajátjaként kezelik.
      name: — OEM Partner, európai vízisport márka
    - content: A Hypalon RIBs több mint 5 éve szolgál flottánkban. Minimális karbantartás, kiváló UV ellenállás. A csövekre vonatkozó 5 éves garancia bizalmat ad.
      name: — Flottakezelő, Közel-Keleti üdülőcsoport
    - content: A Paddle Board Overstock csapata segített nekünk egyedi SUP designt fejleszteni a koncepciótól a gyártásig 90 nap alatt. A minőség felülmúlta az elvárásainkat.
      name: — Disztribútor, ausztrál vízisportok
    - content: Kisvállalkozóként aggódtam a MOQs miatt. Paddle Board Overstock alkalmazkodott a költségvetésemhez és segített elindítani a márkámat mindössze 50 deszkával. Most 500-at rendelek.
      name: — Márka alapító, US SUP bérbeadó cég
cta:
