content_challenge:
  tagline: A kihívás
  title: Tengeri energiaigények<br />Extrém környezeti megbízhatóság
  subtitle: A tengeri energia-műveletek a berendezéseket a határokig nyomják — szélsőséges időjárás, távoli helyek, folyamatos munkakör és nulla hibahiba.
  paragraphs:
    - A tengeri energiaipar a Föld legigényesebb tengeri környezetében működik. A munkahajók támogatják az olaj- és gázplatformokat, szélturbinák telepítését, tengeralatti kábelüzemeltetést és tengeri építési projekteket – gyakran nyílt tengeri körülmények között, korlátozott időjárási ablakokkal. A berendezések meghibásodása nemcsak költséges, hanem veszélyes is.
    - '**A legmagasabb prioritás a biztonság** — A személyzet áthelyező hajóinak biztonságosan kell működniük olyan tengeri államokban, amelyek más műveleteket megállítanának. A stabilitás az áthelyezési ponton, megbízható motorteljesítmény minden időjárási körülmények között, valamint a robusztus szerkezet a tengeri szerkezetek ismétlődő dokkolásához kötelező követelmények.'
    - '**Az időjárási körülmények között elengedhetetlen** — A tengeri szélerőművek és olajplatformok egész évben működnek. A munkahajóknak erős tengeren, erős szélben és korlátozott látótávolságon kell teljesíteniük. A nappali és éjszakai műveletekhez teljes navigációs rendszerek és megbízható világítási rendszerek szükségesek.'
    - '**A tengeri szélenergia szektor gyorsan növekszik** — Világszerte több ezer új turbinát telepítenek, amelyek mindegyike rendszeres személyzeti áthelyezést, szerszámszállítást és karbantartási támogatást igényel. Ez tartós keresletet teremt a kifejezetten erre célra épített személyzetátalakító hajókra (CTV-k) és támogatásraRIBs.'
    - Aquafarer A tengeri energia RIBs megerősített mély-V törzsekkel, nehéz Hypalon teherbírás csövekkel, teljes navigációs rendszerekkel és biztonsági rendszerekkel van tervezve, amelyeket a tengeri energia extrém körülményekhez terveztek.
content_solution:
  tagline: Megoldásunk
  title: Kifejezetten a tenger feletti RIBsépítés<br />Az energiaipar számára
  subtitle: Minden Aquafarer tengeri energia biztonságos RIB , megbízható üzemmódra van tervezve extrém tengeri körülmények között — az Északi-tengertől Délkelet-Ázsiáig.
  list:
    - Megerősített mély-V törzs a durva vízi teljesítményhez és kiszámítható kezelhetőséghez
    - Nehéz Hypalon tekologikus csövek UV és kémiai ellenállás hosszabb tengeri szolgálathoz
    - 316 rozsdamentes acél szerelvény — folyamatos sós víz alatt nincs korrózió
    - 'Teljes navigációs készlet: GPS, radar, VHF, éjszakai navigációs lámpák — alapfelszereltség az offshore modelleken'
    - Önállóvás fedélzet biztonságos használathoz a beszállási tengeri körülmények között
    - Többmotoros konfigurációk — egy- vagy kettős külső motoros küldetés redundanciához
    - Vontatóoszlop és nehéz teher csatók platform- és bója kezeléséhez
    - Nagy láthatóságú csőszínek az azonosításhoz tengeri munkaterületeken
content_segments:
  tagline: Energiaprofilok
  title: Offshore Energy Solutions<br />Alkalmazási típus szerint
  subtitle: A különböző tengeri energiaszektoroknak egyedi munkahajó-igényei vannak — a RIBs platformtámogatástól a szélerőművek CTV-iig és tengeralatti ellenőrző hajókon.
  items:
    - title: Tengeri olaj- és gázplatform-támogatás
      subtitle: Személyzet áthelyezése, felszerelésellátás, peron biztonsági készenlétje
      description: Az olaj- és gázplatformok napi személyzetcserét, felszerelés- és ellátmányszállítást, valamint biztonsági készenléti ellátást igényelnek. A munkahajóknak biztonságosan kell közlekedniük a platformszerkezetek körül, erős áramlatok és változó tengeri állapotok között, és pontos állomást kell tartaniuk a személyzet létrán vagy átjárón történő áthelyezése során. Az extrém környezet — szénhidrogének, vegyi anyagok, folyamatos sópermet — korrózióálló építést és megbízható teljesítményt igényel.
      features:
        - Személyzet áthelyezési konfigurációja biztonságos beszállási hozzáféréssel és korlátokkal
        - Korrózióálló Hypalon csövek és 316 rozsdamentes acél hardver
        - Megerősített dörzsölősítő sávok a platformon gyakori sárvédő-érintkezéshez
        - Önmagát felszívó fedélzet olajos vízhez és vegyi lemosáshoz
        - Nagy kapacitású üzemanyagtartály a tengeri üzemtávolság hosszabb hatótávolságához
        - Kétmotoros opció a küldetéskritikus redundancia érdekében
    - title: Tengeri szélerőművek üzemeltetése
      subtitle: Személyzet áthelyezése, turbina karbantartása, szerszámszállítás
      description: A tengeri szélenergia a leggyorsabban növekvő ágazat a tengeri energia szempontjából. Az üzemeltetőknek személyzetátalakító hajókra (CTV) van szükségük, amelyek biztonságosan tudják áthelyezni a technikusokat turbina hozzáférési platformokra tengeri államokban, akár 1,5 méteres hullámmagasságig. A stabilitás az átvitel alatt, az időjárási körülmények között használható képesség és a megbízható napi működés kulcsfontosságú. A szélerőművek szolgáltató hajói szoros ütemtervben működnek — bármilyen leállás a turbina üzembe helyezését vagy karbantartását késlelteti az áramtermelési bevételeket.
      features:
        - Optimalizált hajótest forma stabil személyzet áthelyezéséhez a turbina alapján
        - Mély-V bejárat kényelmes utazáshoz a tengeri hullámzás és hullámzás területén
        - Teljes időjárás-védelem — zárt konzol vagy kormánytér a személyzet kényelméért
        - Fedélzeti tér szerszámok, alkatrészek és szervizberendezések számára
        - Éjszakai üzemeltetési csomag hosszabb, nappali fényű, korlátozott téli műszakokhoz
        - Csendes külső működés a tengeri környezetre gyakorolt minimális zajhatás érdekében
    - title: Tengeralatti kábel és csővezeték támogatás
      subtitle: Ellenőrzés, karbantartás, ROV-támogatás, felmérés
      description: A tengeralatti kábel- és csővezeték-üzemeltetőknek munkahajókra van szükségük az útvonal-ellenőrzéshez, karbantartási támogatáshoz, ROV-műveletekhez és felmérési feladatokhoz. Ezek a hajók stabil platformokra van szükségük a víz alatti berendezések telepítéséhez és visszanyeréséhez, precíz alacsony sebességű manőverezéshez a kábelkövetéshez, valamint megbízható működésre part menti és tengeri környezetekben. A hajóstabilitás kritikus a szonár- és felmérőberendezések pontosságához.
      features:
        - Stabil platform lassú sebességgel kábelkövetéshez és felmérési műveletekhez
        - Nyitott fedélzeti elrendezés ROV telepítéshez, kábeltekercsekhez és felmérő felszerelésekhez
        - Felszerelés-lerakó lapok szonár, GPS és felmérő műszerek számára
        - Alacsony hullámkeltésű hajótest a tengerfenék minimális zavarásához ellenőrzés közben
        - Precíz, alacsony sebességű manőverezés érzékeny külmotoros kormányzással
    - title: Tengerészeti mérnöki és építési támogatás
      subtitle: Személyszállítás, anyagellátás, búvár támogatás
      description: A kikötőépítkezéseken, partszakasz-védelmi és offshore telepítési projekteken dolgozó tengerészeti mérnöki vállalkozóknak sokoldalú munkahajókra van szükségük a személyszállításhoz az építőmunkások és a part között, az anyagok és szerszámok szállításához, a búvárok támogatásához és helyszíni felmérésekhez. Ezek a hajók aktív építkezési zónákban működnek, ahol több hajó is van, a manőverezési tér korlátozott, és a tenger állapota változó. A tartósság és a sokoldalúság kiemelt fontosságú.
      features:
        - Többcélú fedélzet elrendezés személyzet, anyagok és búvárfelszerelés számára
        - Búvárlétra és felszerelés-felrakási lehetőség a búvártámogató műveletekhez
        - Erős kikötőboglyák és vontatópont az építkezési terület manőverezéséhez
        - Masszív Hypalon kivitel az építési törmelék és kopásállóság érdekében
        - Rugalmas üléskonfigurációk — személyzet szállítása vagy teher mód
