content_priorities:
  tagline: Amit az ügyfelek ellenőriznek
  title: 8 dolog, amit a vásárlók ellenőriznek<br />minden gyárlátogatásnál
  subtitle: Az 50+ ország vásárlóinak visszajelzései alapján ezek a nyolc prioritás, amelyeket az ügyfelek figyelembe vesznek, mielőtt B2B rendelést adnának.
  items:
    - title: Valódi gyártó
      description: 'Te vagy a tényleges gyár, nem egy kereskedőcég? A vásárlók ellenőrzik: a gazdasági szervezetet, a valódi termelőberendezéseket, a gépeket üzemeltető munkavállalókat, a gyártósoron lévő aktuális termelési megrendeléseket, és a weboldal-műhely összhangját.'
      icon: tabler:building-factory
    - title: Termékalkalmasság az alkalmazáshoz
      description: Illeszkedik a RIB a konkrét felhasználási esetükhöz? A kiránduló-, mentő-, búvár-, horgászó- és járőröző üzemeltetők alapvetően különböző követelményekkel rendelkeznek. A vásárlók a bemutatott hajón értékelik a fedélzeti elrendezést, a cső anyagát és a felszerelési lehetőségeket.
      icon: tabler:target
    - title: Minőségi stabilitás és reprodukálhatóság
      description: Az 50. egység ugyanolyan jó, mint az 1.? A vásárlók megvizsgálják a minőségellenőrzési rendszereket, a folyamat közbeni ellenőrzési pontokat, a nemmegfelelőségek kezelését, és kérik, hogy láthassák több gyártási sorozat feljegyzéseit a következetesség ellenőrzéséhez.
      icon: tabler:repeat
    - title: Megfelelőségi dokumentum hitelessége
      description: A CE tanúsítványok modellspecifikusak? A DoC-t valódi személy írja alá? Ellenőrizhető a megfelelőség a hajótest számánként? A vevők ellenőrzik a általános állításokat a modell-specifikus dokumentációval szemben.
      icon: tabler:file-certificate
    - title: Testreszabás végrehajtása
      description: A gyár valóban képes-e szállítani egyedi konfigurációkat? A vásárlók az előző egyedi projektek bizonyítékait, bemutatott prototípus mintákat, mérnöki rajzokat, valamint a helyszínen történő technikai módosítások megbeszélésének képességét keresik.
      icon: tabler:adjustments
    - title: Átfutási idő és kapacitás
      description: 'A megadott határidők reálisak? A vevők értékelik: a jelenlegi termelési volumenet, a rendelkezésre álló kapacitást, a munkaerő létszámát, az anyagkészleteket, valamint azt, hogy a gyárban van-e termeléstervező rendszer.'
      icon: tabler:clock
    - title: Ár és kereskedelmi feltételek
      description: 'Átláthatóak az árak? FOB Világos az árazás? A vevők ellenőrizik: az egységár bontását, szerszámköltségeket, csomagolási költségeket, valamint hogy a gyár képes vagy tudja-e DDP CIF kezelni a megfelelő exportdokumentációt.'
      icon: tabler:currency-dollar
    - title: Értékesítés utáni termékek és pótalkatrészek
      description: 'Mi történik a szállítás után? A vevők értékelik: a pótalkatrészek elérhetőségét, garanciális folyamatot, csőcsere szakaszokat, szelepcserét, valamint hogy a gyárnak van-e dokumentált értékesítési protokollja.'
      icon: tabler:headset
content_tour:
  tagline: Gyári túraútvonal
  title: Audit Tour —<br />Amit látni fog
  subtitle: A szokásos gyári túránk egy meghatározott útvonalat követ, amely minden állomáson a vevők kérdéseire válaszol.
  items:
    - title: 1. Tárgyalóterem — Társaság bemutatkozása
      description: Üzleti engedély, ISO 9001 és BSCI tanúsítványok, exportengedélyek, valamint vállalati történet. Gyors áttekintés a termelési képességekről és a megfelelőségi keretekről.
      icon: tabler:users
    - title: 2. Nyersanyag-raktár — IQC állomás
      description: Beérkező anyagellenőrzési nyilvántartások, anyag tételi tanúsítványok, ragasztók és hardverminták. Tekintse meg, hogyan tesztelik az anyagokat a gyártás előtt.
      icon: tabler:building-warehouse
    - title: 3. Csőgyártás — RF hegesztés és kézi ragasztás
      description: Élő csőhegesztés vagy ragasztási eljárás, varrásszilárdsági tesztek és szelep telepítés. Kamránként történő építés és minőségellenőrzési pontok megfigyelése.
      icon: tabler:flame
    - title: 4. Hajótest laminálás — GRP műhely
      description: Üvegszál lefektetési folyamat, géllakos felhelyezés és hajótest keményedése. Lásd a laminálási menetrendet és a szerkezeti megerősítést különböző RIB modellekhez.
      icon: tabler:layers-subtract
    - title: 5. Összeszerelés és integráció
      description: Hajótest-cső csatlakozás, konzol- és ülésrendszer telepítése, elektromos és üzemanyagrendszer integrációja, valamint berendezések rögzítése. Figyelje meg a gyártósort működés közben.
      icon: tabler:tool
    - title: 6. Nyomástesztállomás
      description: 24-48 órás nyomástartó teszt 1,25-szeres névleges nyomásnál. Tekintse meg a tesztadatokat, nyomásmérőket és átmenés/sikertelenség kritériumait. Nézze meg, hogyan kapcsolódnak a teszteredmények a hajótest sorozatszámaival.
      icon: tabler:gauge
    - title: 7. Végső ellenőrzés és minőségellenőrzés
      description: 100 pontos minőségellenőrzőlista, egységenként, méretellenőrzés, kozmetikai ellenőrzés és csomagolási integritás-ellenőrzés. Átnézze a nem megfelelőségi naplókat és a korrekciós eljárási nyilvántartásokat.
      icon: tabler:clipboard-check
    - title: 8. Dokumentumátvizsgáló terem
      description: Megfelelőségi dokumentáció modellenként (DoC, építőlemez, használati kézikönyv), gyártási nyomon követhetőségi nyilvántartások, HIN nyilvántartás és anyagtétel követő adatbázis demonstrációja.
      icon: tabler:folder
content_qc_chain:
  tagline: Minőségi bizonyítékok
  title: 8 fokozatú QC lánc<br />— Minden lépésnél ellenőrizhető
  subtitle: Minőségellenőrzési láncunk a beérkező anyagoktól a végső szállítmányig terjed, minden szakaszban dokumentált bizonyítékokkal rendelkezik.
  items:
    - title: '1. szakasz: Beérkező anyagok ellenőrzése'
      description: Minden PVC, Hypalon, üvegszál, alumínium, ragasztó és hardver tételét a gyártás előtt a specifikációk szerint teszteljük. Húzószilárdság, bevonattapadás és méretellenőrzések AQL 2,5/ISO2859 szerint.
      icon: tabler:package
    - title: '2. szakasz: Csőhegesztés / ragasztás minőségellenőrzés'
      description: Varráslevágási szilárdsági teszt gyártási tételenként. RF hegesztési paramétereket figyelnek és rögzítettek. Kézzel ragasztott varrások ellenőrizték a ragasztó egyenletes fedettségét és kikötési idejét.
      icon: tabler:flame
    - title: '3. szakasz: Hajótest laminálás minőségellenőrzése'
      description: Gelbevonat vastagságmérése, üvegszál lefektetés ellenőrzése laminált terv szerint, valamint a kötési idő ellenőrzése. A szerkezeti megerősítések pozíciói mérnöki rajzok alapján igazoltak.
      icon: tabler:layers-subtract
    - title: '4. szakasz: Összeszerelés és integráció minőségellenőrzése'
      description: Test-cső ízület, konzol- és ülésrögzítési nyomaték, elektromos folytonosság és üzemanyagrendszer szivárgásvizsgálata. Minden beszerelési pontot ellenőriztek a modellspecifikus összeszerelési ellenőrző lista alapján.
      icon: tabler:tool
    - title: '5. szakasz: Nyomástartó teszt'
      description: Minden felfújható kamrát 1,25x nyomásra helyeztek PSI és 24-48 órán át tartották. Nyomásesést rögzítenek kamránként. Átmenés/sikertelenség küszöbérték dokumentálva. Összekapcsolva a hajótest sorozatszámával.
      icon: tabler:gauge
    - title: '6. szakasz: Végső ellenőrzés'
      description: 100 pontos minőségellenőrzőlista, amely a méretpontosságot, a kozmetikai felületet, a kiegészítők teljességét, dokumentációs csomagolást és csomagolási integritást tartalmaz. Független a gyártócsapattól.
      icon: tabler:clipboard-check
    - title: '7. szakasz: Megfelelőségi dokumentáció'
      description: Modellspecifikus DoC, gyártó lemez ellenőrzés, tulajdonosi kézikönyv teljessége és HIN nyilvántartás bejegyzése. Minden megfelelőségi dokumentum a szállítás kiadása előtt készül és ellenőrizhető.
      icon: tabler:file-certificate
    - title: '8. szakasz: Szállítmány szabadítása és nyomon követhetősége'
      description: A végső kiadáshoz minden minőségellenőrzési szakasz teljesítése szükséges, a megfelelőségi dokumentáció befejezése és a hajózási dokumentáció ellenőrzése. A hajótestnyilvántartás zárva és archiválva 10+ év megőrzésre kerül.
      icon: tabler:truck
content_traceability:
  tagline: Gyártási nyomon követhetőség
  title: HIN → Master File →<br />Hajótest-rekord → szállítás
  subtitle: Minden RIB hajó egyedi hajótestazonosító számot hordoz, amely egy teljes gyártási és megfelelőségi nyilvántartási lánchoz kapcsolódik.
  items:
    - title: Hajótest azonosító száma (HIN)
      description: 14 karakteres egyedi azonosító állandóan minden hajón megjelölve. Kódolja a gyártó kódját (MIC), a modelljelzést, a gyártási évet és a sorozatszámot. Ez a kulcs feloldja a teljes nyomon követhetőségi láncot.
      icon: tabler:hash
    - title: Mester műszaki fájl
      description: A modellcsalád megfelelőségi és mérnöki dokumentációja. Tartalmazza a GA rajzokat, kockázatértékelést, stabilitási számításokat, anyagspecifikációkat és alkalmazandó szabványokat. Kapcsolódik az adott modell összes hajótestéhez.
      icon: tabler:folder
    - title: Egyéni hajótest-rekord
      description: 'Hajótestenként: HIN, gyártási dátum, csőparti, anyagtanúsítványok, nyomásteszt eredmény, végső konfiguráció, motorspecifikáció, minőségellenőrző lista eredmények és szállítási cél. 21+ adatmező hajószáronként.'
      icon: tabler:file-description
    - title: Ügyfél-megfelelőségi csomag
      description: Hajótest szerint szállítási csomag, beleértve a DoC-t, a gyártó lemez fotóját, használati kézikönyvet, megfelelőségi ellenőrzőlistát és végleges konfigurációs lapot. A hajóval együtt szállították, és 10 évig archiválva maradtak a+ gyárban.
      icon: tabler:package
content_red_flags:
  tagline: Audit buktatói
  title: Red Flags vásárlók<br />Könnyen észrevehető
  subtitle: Gyakori problémák, amelyek aláássák a vásárlói bizalmat a gyári auditok során. Mindegyiket proaktívan kezeljük.
  items:
    - title: Általános CE igények modell hatókör nélkül
      description: '"Minden termék CE tanúsítva" anélkül, hogy megadná a pontos irányelvet, melyik modellt és melyik megfelelőségi modult. Figyelmeztető jel: azt sugallja, hogy a megfelelőség felszínes, nem pedig modellenként, konfigurációnként történik.'
      icon: tabler:alert-triangle
    - title: Nincs fizikai vizsgálati bizonyíték
      description: 'Nyomásteszt állítások tesztfeljegyzések, mérőeszközök vagy tesztállomások nélkül, amelyek láthatóak a gyári padlón. Figyelmeztető jel: a minőségi igények nem ellenőrizhetők a látogatás során.'
      icon: tabler:alert-triangle
    - title: Hiányzó anyag nyomon követése
      description: 'Nincs tételi nyilvántartás, nincs bejövő ellenőrzés, vagy nincs kapcsolat az anyagtanúsítványok és a késztermékek között. Figyelmeztető jel: nincs mód a minőségi problémák forrására való visszakövetésére.'
      icon: tabler:alert-triangle
    - title: Általános dokumentáció
      description: 'Egy DoC minden modellt lefed, HIN-specifikus nyilvántartás vagy "sablon" megfelelőségi dokumentum nélkül. Figyelmeztető jel: a megfelelőség nem kötött az egyes gyártóegységekhez.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Szállítás és csomagolás
  title: RIB Hajókonténer<br />Rakodás és ládák
  subtitle: Szállítási megoldásaink megvédik befektetését Qingdao-tól a célállomásig. Minden modellhez elérhető konténerrakodó tervek és ládák specifikációi.
  items:
    - title: 20 láb konténerkonfigurációk
      description: 'Szabványos 20 lábas konténer: 1-2 RIB hajó (4,0-5,5 m) egymás el, fedélzet és csövek elkülönítve, vagy 8-12 SUP deszka. Vegyes RIB + SUP konfigurációk elérhetők. Részletes betöltési terv rendelésenként biztosított.'
      icon: tabler:box
    - title: 40 lábas konténer konfigurációk
      description: 'Szabványos 40 lábas konténer: 2-4 RIB hajó (akár 7,0 m) egymásba helyezett hajótestekkel és csövekkel egymásra rakva, vagy 20-30 SUP deszka. 40 láb HQ magasabb RIB modellekhez is elérhető. A térfogatoptimalizált csomagolás csökkenti az egységenkénti szállítási költséget.'
      icon: tabler:container
    - title: Fa láda a RIB hajótestekhez
      description: Alumínium és GRP hajótestek egyedi felszerelésű fa ládákba van berendezve, habpárnázással, nedvességzáróval és acélszalaggal. A láda méretei és tömege modellenként logisztikai tervezéshez elérhető. ISPM-15 hőkezelésű fa tanúsítvány is benne van.
      icon: tabler:wood
    - title: Cső- és fedélzetesszétválasztás csomagolása
      description: A csöveket elkülönítik és széthajtogatták a hajótestektől a helyhatékonyság érdekében. Fedélzeti lemezek, konzolok és ülések védőcsomagolásba csomagolva, rögzítő hardverkészletekkel. Minden szállítmányhoz az újraszerelési utasítások mellékelhetők.
      icon: tabler:package
    - title: Nedvesség- és korrózióvédelem
      description: VCI korróziógátló papír alumínium alkatrészekhez, szilíciumgél szűrőcsomagokhoz és vákuumzárt hardverzsákokhoz. Megakadályozza a kondenzációs károkat 30-45 napos óceáni utazás során.
      icon: tabler:droplet-off
    - title: FOB Qingdao dokumentáció
      description: Szállítmánylevél, kereskedelmi számla, csomagoláslista, származási igazolás és megfelelőségi dokumentáció szállítmányonként. FCL és LCL konszolidáció elérhető. Vámdokumentáció támogatása az EU, USA és a Közel-Kelet piacaiban.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Ellenőrzési bizonyítékok
  title: Audit bizonyítékok<br />Helyszínen ellenőrizheted
  subtitle: A gyárlátogatások során az ügyfelek minden gyártási területen ellenőrizhetik a konkrét bizonyítékokat. Íme, mire érdemes figyelni — és mit készítünk elő minden auditra.
  areas:
    - area: Nyersanyag-raktár
      what_to_verify: Stabilak az anyagok? Van adag keverés?
      evidence: Beérkező ellenőrzési nyilvántartások, tételcímkék, FIFO tárolás, beszállítói jóváhagyási lista, anyagtanúsítványok (PVC, Hypalon, üvegszál, alumínium, ragasztók, hardver)
      icon: tabler:building-warehouse
    - area: Csőgyártás
      what_to_verify: Hogyan garantálja a varrás szilárdsága és légzáródása?
      evidence: Folyamatkártyák, első cikk megerősítése, nyomásteszt nyilvántartások kamraként, javítási és újratesztnaplók, szelep-beszerelési nyilvántartások
      icon: tabler:flame
    - area: Hajótestgyártás
      what_to_verify: Hogyan szabályozzák a szerkezeti konzisztenciát?
      evidence: Ellenőrzött folyamatdokumentumok, minőségellenőrző pontok, félkész termékszámozás, gellakt vastagságmérések, laminálási menetrend ellenőrzése
      icon: tabler:layers-subtract
    - area: Gyűlési terület
      what_to_verify: Hogyan kerülik meg az opcionális alkatrészek összeállítását?
      evidence: BOM, munkamegrendelések, konfigurációs ellenőrzőlisták, munkaállomás-ellenőrző kártyák, nyomaték- és funkcionális ellenőrzések modellenként
      icon: tabler:tool
    - area: Tesztállomás
      what_to_verify: Hogyan lehet megbizonyosodni róla, hogy a hajó rendben van, mielőtt kézbesítik?
      evidence: Teszteljárások, műszerlista, kalibrációs nyilvántartások, nyomásteszt naplók (1,25x / 24-48h), funkcionális tesztlisták, dokumentált átmenés/siker kritériumok
      icon: tabler:gauge
    - area: Nem megfelelőségi terület
      what_to_verify: Hogyan kezelik a hibákat?
      evidence: Izolációs címkék, NCR naplók, gyökérok elemzés, átdolgozási jóváhagyási nyilvántartások, CAPA (korrekciós és megelőző intézkedések) követése
      icon: tabler:alert-triangle
    - area: Készáru raktár
      what_to_verify: Hogyan kerüli meg a téves szállítást és a károkat?
      evidence: Késztermék címkék, rendelési egyeztetési nyilvántartások, csomagolási szabványok, feladás előtti ellenőrzési nyilvántartások
      icon: tabler:box
    - area: Pótrészek és értékesítés utáni szolgáltatások
      what_to_verify: Tudsz hosszú távú utóértékesítést támogatni?
      evidence: Gyakori alkatrészlista, készletstratégia, alkatrészszámozási rendszer, garanciális folyamat dokumentációja, karbantartási oktatóanyagok
      icon: tabler:headset
content_closing_script:
  tagline: Audit rendelésre
  title: Gyárlátogatásból<br />Megerősített projekthez
  subtitle: Egy sikeres audit nem érhet véget fotókkal és kézfogással. Indulás előtt gondoskodunk arról, hogy három kereskedelmi eredmény dokumentáljuk.
  items:
    - title: Műszaki konfiguráció megerősítése
      description: Egyezzenek meg a modellben, alkalmazásban, kulcsfontosságú opciókban, a célpiacon, a becsült mennyiségben és a szállítási ütemtervben — mindezt dokumentálják indulás előtt.
      icon: tabler:checklist
    - title: Erősítse meg a következő lépés dokumentumokat
      description: 'Határozd meg, mi Paddle Board Overstock biztosít ezután: módosított GA, konfigurációlista, árajánlat, dokumentumellenőrzőlista, mintaterv, vagy NDA — konkrét idővonalakkal.'
      icon: tabler:file-plus
    - title: Erősítse meg a kölcsönös idővonalat
      description: Módosított konfiguráció és előzetes árajánlat 3 munkanapon belül. Minta- vagy megjelenési igazolás 7 napon belül. Mérnöki felülvizsgálat vagy harmadik fél ellenőrzése 14 napon belül. A következő találkozó időpontja és a felelős felek lezárva.
      icon: tabler:calendar
faq:
  title: Gyári audit — Gyakran Ismételt Kérdések
  questions:
    - q: El tudom látogatni a gyárat személyesen?
      a: Igen. Szívesen látjuk a helyszíni gyári auditokat 12 000 m²-es Qingdao létesítményünkben. Szokásos túránk 8 állomást fed le a nyersanyag-raktártól a dokumentumátvizsgáló teremig. Virtuális gyári túrák videóhíváson keresztül is elérhetők az első minősítéshez.
    - q: Elfogadod a harmadik féltől származó auditokat (BSCI, SMETA, SGS)?
      a: Igen. BSCI Tanúsítást (Intertek) tartunk fenn, és szívesen fogadjuk az ügyfélspecifikus auditi protokollokat. SGS TÜV Kérésre is szervezhetünk ellenőrzéseket vagy ellenőrzéseket. Az auditjelentések elérhetők NDAa .
    - q: Láthatom a nyomásvizsgálatot a látogatás során?
      a: Nyomásteszt állomásunk a szokásos túraútvonal része. A gyártási ütemezéstől függően aktív nyomásteszteket is megfigyelhetsz mérő mérésekkel és tesztrekordokkal. A nyomásteszt naplók hajótestenként mindig elérhetők áttekintésre.
    - q: Hogyan kezeled a nem megfelelőségi termékeket?
      a: A nem megfelelő egységeket elkülönítik, dokumentálják és felülvizsgálják a ISO 9001-es korrekciós eljárásunk szerint. Gyökérok elemzést végeznek, korrekciós intézkedéseket vezetnek be, és nyilvántartást vezetnek. A vevők áttekinthetik NCR naplónkat az auditok során.
    - q: Milyen megfelelőségi dokumentáció áll rendelkezésre felülvizsgálatra?
      a: 'Az audit során áttekintheted: modellspecifikus DoC mintákat, gyártó lemez specifikációkat, HIN nyilvántartást, tulajdonosi kézikönyv vázlatokat, alkalmazandó szabványlistákat és megfelelőségértékelési nyilvántartásokat modellcsaládonként.'
    - q: Hogyan foglalhatok virtuális gyári túrát?
      a: Vegye fel a kapcsolatot értékesítési csapatunkkal, hogy élő videótúrát egyeztess WhatsAppon, Zoomon vagy Teams-en keresztül. Ugyanazt a 8 állomásos útvonalat követjük, és az érdeklődési köreid alapján koncentrálhatunk. A tipikus virtuális túra 45-60 perc.
    - q: A gyár a tényleges gyártó vagy egy kereskedelmi vállalat?
      a: Paddle Board Overstock a tényleges gyártó. A gyárat Laixiben, Qingdaóban üzemeltetjük. Az üzleti engedély, a gyártási kapacitás és a fizikai termelés mind ellenőrizhetők az audit során.
    - q: Milyen minőségű lemezeket tudok átnézni?
      a: Beérkező anyagellenőrzési nyilvántartások, folyamatban lévő minőségellenőrzési pontok, nyomástesztnaplók, 100 pontos végső ellenőrzési listák, megfelelőségi jelentések, korrekciós intézkedési nyilvántartások, valamint hajótest szerint nyomon követhetőségi nyilvántartások. Mind a ISO 9001-es követelmények szerint karbantartják.
