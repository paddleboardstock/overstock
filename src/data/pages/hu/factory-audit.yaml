hero:
  tagline: Gyári audit és bizonyíték
  title: Gyáraudit előkészítése<br />& Minőségi Bizonyíték
  subtitle: Mindent, amit a B2B vásárlók ellenőriznek egy gyárlátogatás során — a gyártás hitelességétől és a megfelelőségi dokumentációtól a termelés nyomon követhetőségéig és a minőségellenőrzési rendszerekig. Audit-kész, minden nap.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock gyári audit előkészítése és minőségi bizonyíték
direct_answer: Paddle Board Overstock fenntart egy auditálásra kész, 12 000 m²-es qingdaói létesítményt dokumentált minőségellenőrzési folyamatokkal, anyagnyomon követéssel, HIN-szintű gyártási nyilvántartásokkal és minden hajótesten vonatkozó megfelelőségi dokumentációval. Helyszíni és virtuális gyárlátogatások állnak rendelkezésre az arra jogosult vásárlók számára.
stats:
  - value: 12,000 m²
    label: ISO 9001 létesítmény
    detail: Qingdao gyártó kampusz
  - value: 6
    label: Termelősorok
    detail: Dedikált RIB, SIB, SUP vonalak
  - value: 100%
    label: Nyomáspróbázott
    detail: Minden egység, 1,25x / 24-48 óra
  - value: HIN
    label: Per-Hull nyomonkövethetőség
