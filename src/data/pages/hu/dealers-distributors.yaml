content_benefits:
  tagline: Partnerségi előnyök
  title: Miért forgalmazók<br />Válassza Paddle Board Overstock
  subtitle: Egy partnerség, amelyet olyan tengeri forgalmazók számára terveztek, akik megbízható ellátásra, versenyképes árrésekre és professzionális támogatásra van szükségük.
  items:
    - title: Területvédelem
      description: Exkluzív vagy félig exkluzív területi jogok a jogosult forgalmazók számára. Piacfeltérképezés és csatornás konfliktuskezelés a befektetése védelme érdekében a Paddle Board Overstock márka kiépítésében az Ön régiójában.
      icon: tabler:map-pin
    - title: Versenyképes nagykereskedelmi árképzés
      description: Fokozatos árazás az éves volumenkötelezettségek alapján. Nyereségvédő árképzési struktúra előzetes árgaranciákkal és átlátható költségbontásokkal (FOB Qingdao alapon).
      icon: tabler:currency-dollar
    - title: Marketingtámogatási csomag
      description: Professzionális termékfotózás, műszaki adatlapok, megfelelőségi dokumentációs sablonok, közösségi média tartalom és közös márkájú marketinganyagok. Évente frissítve az új termékbevezetésekhez.
      icon: tabler:photo
    - title: Műszaki képzés
      description: Termékképzés az értékesítési csapat számára (virtuális vagy helyszíni), karbantartási és javítási képzés a szerviztechnikusok számára, valamint ügyfélorientált GYIK és hibaelhárítási útmutatók.
      icon: tabler:school
    - title: Pótrészek és értékesítés utáni szolgáltatások
      description: Kizárólagos pótalkatrész-ellátás prioritásos szállítással. Csőszakaszok, szelepek, bordák és javítókészletek elérhetők gyors megrendelés-teljesítéshez. Garanciális igények feldolgozásának támogatása.
      icon: tabler:tool
    - title: Megfelelőségi dokumentáció
      description: 'Teljes megfelelőségi dokumentációs csomag az Ön piacára: CE Megfelelőségi nyilatkozat, gyártói adattábla, kezelési útmutatók és szabályozási regisztrációs támogatás. Megszünteti a megfelelőségi terhet.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Amire Figyelünk
  title: Forgalmazó<br />Követelmények
  subtitle: Olyan partnereket keresünk, akik szakmailag képesek képviselni és támogatni a Paddle Board Overstock termékeket a saját területükön.
  items:
    - title: Terület- és Piaci Ismeretek
      description: Meglévő jelenlét a tengeri, vízi sport vagy szabadtéri rekreációs piacon. A helyi szabályozások, fogyasztói preferenciák és vízijármű-termékek értékesítési csatornáinak ismerete.
      icon: tabler:target
    - title: Ipari Tapasztalat
      description: Minimum 2 éves tapasztalat tengeri, szabadtéri vagy sporteszközök forgalmazásában. Bizonyított tapasztalat nemzetközi márkákkal és B2B nagykereskedelmi működéssel.
      icon: tabler:briefcase
    - title: Bemutatóterem vagy Raktár
      description: Fizikai létesítmény a termékbemutatáshoz, készlet tárolásához és ügyfélszolgálathoz. Képesség a demo egységek és pótalkatrészek készletének fenntartására a területeden.
      icon: tabler:building-store
    - title: Elkötelezettség a Márka Szabványai Iránt
      description: Készség a Paddle Board Overstock márka bemutatási szabványainak betartására, ügyféltámogatás nyújtására a szolgáltatási protokolljaink szerint, és az éves termékképzési frissítésekben való részvételre.
      icon: tabler:star
content_process:
  tagline: Jelentkezési Folyamat
  title: 4-Lépéses Forgalmazói<br />Jelentkezési Folyamat
  subtitle: Az első érdeklődéstől az első szállításig — egységes és egyszerű belépési folyamat.
  steps:
    - number: '01'
      title: Kezdeti Érdeklődés és Kvalifikáció
      description: Nyújtsa be forgalmazói jelentkezését a cégadataival, a kívánt területtel, a jelenlegi termékvonalakkal és az éves forgalmi becslésekkel. Áttekintést 5 munkanapon belül végzünk.
      timeline: 5 nap
    - number: '02'
      title: Üzleti Áttekintés és Feltételek
      description: Virtuális megbeszélés a területi stratégiáról, árkategóriákról és partnerségi feltételekről. Áttekintjük a helyi piacra vonatkozó megfelelőségi dokumentáció követelményeit. NDA aláírás szükség esetén.
      timeline: 1-2 hét
    - number: '03'
      title: Minta Rendelés és Értékelés
      description: Helyezzen el egy kezdeti minta rendelést (2–5 egység) forgalmazói áron a piac értékelésére és a csapat képzésére. Teljes megfelelőségi dokumentáció és demo előkészítés biztosított.
      timeline: 30-45 nap
    - number: '04'
      title: Partnerség Indítása és Támogatása
      description: Első konténer rendelés a területi védelem aktiválásával. Marketing csomag leszállítása, értékesítési csapat képzése, és dedikált fiókkezelő kijelölése. Folyamatos negyedéves üzleti áttekintések.
      timeline: Folyamatban
content_application_docs:
  tagline: Jelentkezési Dokumentumok
  title: Szükséges Dokumentumok<br />Forgalmazói jelentkezéshez
  subtitle: Ahhoz, hogy Paddle Board Overstock márkakereskedést nyújtson be, kérjük, készítse elő a következő dokumentumokat és információkat az áttekintő csapatunk számára.
  items:
    - title: Üzleti regisztrációs kivonat
      description: Érvényes cégnyilvántartási dokumentum, amely tartalmazza a jogi személy nevét, bejegyzett címét és üzleti tevékenységi körét, amely magában foglalja a tengeri, sport- vagy kültéri felszerelés forgalmazását.
      icon: tabler:file-text
    - title: Területi lefedettségi terv
      description: Földrajzi terület, meglévő kiskereskedelmi vagy elosztóhálózat, célzott ügyfélszegmensek és a javasolt éves volument termékkategóriák szerint (RIB, SUP, kajak).
      icon: tabler:map
    - title: Bemutatóterem vagy raktár képesség
      description: Fizikai létesítmény termékbemutatásra, készlettárolásra és ügyfélszolgálatra. Fotók vagy alaprajzok bemutatják a bemutatóterületet és alkatrésztároló kapacitást.
      icon: tabler:building
    - title: Pénzügyi Képességek Nyilatkozat
      description: 'Banki referencia vagy pénzügyi kimutatás, amely igazolja, hogy az első konténerrendelés lehessen adni és készlet fenntartani. Minimum első rendelés: egy 20 lábas konténer (10-20 egység vegyes modell).'
      icon: tabler:coin
    - title: Értékesítés utáni támogatási kapacitás
      description: Szerviztechnikusok, akik kiképzettek vagy képzettek a felfújható hajó karbantartására és javítására. Garanciális igényfeldolgozási képesség és alkatrészkészlet elköteleződése.
      icon: tabler:tool
    - title: Korábbi márkautalások
      description: A jelenleg vagy korábbi tengeri/sportfelszerelés márkák listája, amelyeket forgalmaznak. Kapcsolati hivatkozások kölcsönös megállapodás alapján elérhetők. Azok a startupok, akiknek nincs előzetes terjesztési tapasztalatuk, erősebb pénzügyi kötelezettséggel jogosultak lehetnek.
      icon: tabler:users
faq:
  title: Kereskedési program — Gyakran Ismételt Kérdések
  questions:
    - q: Mi a minimális rendelési mennyiség a forgalmazók számára?
      a: A forgalmazó MOQ 10-20 egységtől kezd rendelésenként, rugalmas vegyes modellekhez (RIBfelfújható, SUP). Kezdeti 2-5 egységes mintarendelések elérhetők forgalmazó áron piaci értékeléshez.
    - q: Kizárólagos területi jogokat kínálnak?
      a: Kizárólagos területi jogok elérhetők azok számára, akik megfelelnek az éves volumen-kötelezettségeknek és tartják fenn a márkaszabványokat. Félig exkluzív és nem exkluzív megállapodások is elérhetők a feltörekvő piacoknál.
    - q: Milyen marketingtámogatást nyújtatok?
      a: Átfogó marketing készletet biztosítunk, amely professzionális termékfotózást, specifikációs lapokat, megfelelőségi dokumentációs sablonokat, közösségi média tartalomkönyvtárat és társmárkás anyagokat tartalmaz. Évente frissülünk új termékbevezetésekkel.
    - q: Hogyan kezelik a garanciális igényeket?
      a: 'A forgalmazók a garanciális igények első kapcsolatpontjai. Világos garanciái feltételeket, fényképes dokumentációs protokollokat, gyors cserét vagy hitelfeldolgozást biztosítunk. Garanciaidő: 5 év korlátozott a hajócsöves anyag/varrások/törzs esetén; 2 év SUP és kiegészítők.'
    - q: Használhatom Paddle Board Overstock a saját márkám alatt saját márkás termékeket?
      a: Igen, a OEMmi /ODM programunkon keresztül. A privát címkés opciók közé tartozik az egyedi csőgrafika, konzol márkaépítés, kiskereskedelmi csomagolás és megfelelőségi dokumentáció a márkaneved alatt. OEMRészletekért lásd a /ODM services oldalunkat.
    - q: Milyen megfelelőségi dokumentáció van benne a forgalmazók számára?
      a: Minden szállítmány tartalmaz modellspecifikus CE DoC-t, gyártói plataadatokat, tulajdonosi kézikönyveket és szállítási dokumentációt. Emellett szabályozási regisztrációs támogatást nyújtunk területére, és segítünk bármilyen helyi megfelelőségi követelményekben.
