hero:
  tagline: Folyamat
  title: Gyártási folyamat
  subtitle: A nyersanyagtól a tengerre kész deszkán át — minden lépés a mi irányításunk alatt áll
  back_label: Vissza a gyárhoz
  back_link: /factory
intro: Ellentétben a márkákkal, amelyek harmadik fél gyárainak szervezik a termelést, Paddle Board Overstock ők birtokolják és üzemeltetik az egész gyártóláncot. Ez a vertikális integráció lehetővé teszi, hogy minden szakaszban szigorú minőségellenőrzést tartsunk, és sorozatról adásra következetes minőségű terméket biztosítsunk. Íme, hogyan építik a gyárunkban a tábla.
steps:
  - step: '01'
    title: Anyag átvétele és ellenőrzése
    description: Minden beérkező PVC anyag-, drop-stitch mag-, EVA hab- és hardver adag vizsgálatot a specifikációk szerint ellenőriznek. Az anyagmintákat a gyártás előtt megvizsgálják a húzószilárdság, vastagság egyenletessége és UV ellenállás szempontjából. A nem megfelelőségi anyagokat karanténba helyezik és visszaküldik.
    duration: 1–2 nap
  - step: '02'
    title: Automatikus PVC vágás
    description: Az engedélyezett anyagokat az automatikus CNC vágógépre helyezik, és milliméter alatti pontossággal vágják. A számítógéppel optimalizált fészkelés a paneleket úgy rendezi el, hogy minimalizálja a hulladékot — általában 5% alatt. A vágott paneleket deszkelapmodell és kamra szerint jelölik, majd összekötik a hegesztőműhelybe történő átszállításhoz.
    duration: 2–4 óra egy deszkeszlap-készletenként
  - step: '03'
    title: Cső hőtömítés és hegesztés
    description: A paneleket hőtömítő gépekkel, hőlevegős hegesztéssel, 200–600 °C közötti szabályozott hőmérsékleten rögzítik és összekötik. A fő varrásokat RF dielektromos hegesztéssel erősítik meg légmentes, nagy szilárdságú csatlakozások érdekében. A kész kamrákat 1,25× munkanyomásra fújják fel 30 perces légtartási ellenőrzés érdekében.
    duration: 1–2 nap minden táblaként
  - step: '04'
    title: Deck Art és EVA Finishing
    description: 'Az art series deckek itt jelennek meg: precízen vágott EVA habpaneleket teljes fedélzeti mintázatba raknak, összekötnek és kézzel vágnak. Tapadós, kényelmes és tartós — minden művészeti sorozat deszkának jellegzetes megjelenése.'
    duration: 1–2 nap
  - step: '05'
    title: SUP Nyomtatás és Díszítés
    description: SUP A deszkás grafikákat digitális nyomtatással alkalmazzák teljes színes fotóminőségű mintákhoz, míg szitanyomást tartós logók és ismétlődő minták esetén. A nyomatokat megkeményítik és lezárják a UV koplódás elleni védelem érdekében.
    duration: 1–2 nap
  - step: '06'
    title: Végszerelés és Árbocozás
    description: 'A táblák megkapják végső alkatrészeiket: a szelepeket megtorzítják és funkcióval tesztelték, D-gyűrűket, fogantyúkat és uszonydobozokat szerelnek fel, valamint a póráz rögzítése rögzítve van. Minden deszka egy 100 pontos összeszerelési ellenőrzőlistát követ, minden lépésnél kötelező jóváhagyással.'
    duration: 2–3 nap
  - step: '07'
    title: Minőségellenőrzés és Vizsgálat
    description: 'Minden elkészült deszka kötelező minőségi vizsgálaton esik át: kamra légtartási teszten, rendszerek működésének ellenőrzése, rögzítő nyomatékellenőrzés és kozmetikai ellenőrzés. Az egyedi és prototípus építések vízben is részt vesznek tengeri tesztekben, amelyek sebességet, kezelhetőséget, stabilitást és állóképességet foglalnak magukban.'
    duration: 1–2 nap
  - step: '08'
    title: Csomagolás és szállítás
    description: A deszkákat leürítik, feltekerzik, és utazási hátizsákba csomagolják pumpával, lapáttal, uszonysal, pórázsal és javítókészlettel, majd dobozba csomagolják futár és teherszállítás céljából. Minden csomagot modell, sorozatszám és célállomás jelöl fel. Világszerte 50+ országba szállítunk.
    duration: 1 nap
