hero:
  tagline: Process
  title: Manufacturing Process
  subtitle: From raw material to sea-ready board — every step under our control
  back_label: Back to Factory
  back_link: /factory
intro: Unlike brands that outsource production to third-party factories, Paddle Board Overstock owns and operates its entire manufacturing chain. This vertical integration allows us to maintain strict quality control at every stage and deliver consistent product quality batch after batch. Here is how a board is built in our facility.
steps:
  - step: "01"
    title: Material Receipt & Inspection
    description: Every incoming batch of PVC fabric, drop-stitch core, EVA foam, and hardware is inspected against specification. Fabric samples are tested for tensile strength, thickness uniformity, and UV resistance before release to production. Non-conforming materials are quarantined and returned.
    duration: 1–2 days
  - step: "02"
    title: Automatic PVC Cutting
    description: Approved fabrics are laid on the automatic CNC cutting machine and cut with sub-millimetre accuracy. Computer-optimised nesting arranges panels to minimise waste — typically below 5%. Cut panels are labelled by board model and chamber, then bundled for transfer to the welding workshop.
    duration: 2–4 hours per board kit
  - step: "03"
    title: Tube Heat Sealing & Welding
    description: Panels are tacked and bonded using heat sealing machines with hot-air welding at controlled temperatures of 200–600 °C. Main seams are reinforced with RF dielectric welding for airtight, high-strength joints. Completed chambers are inflated to 1.25× working pressure for 30-minute air-retention validation.
    duration: 1–2 days per board
  - step: "04"
    title: Deck Art & EVA Finishing
    description: "Art-series decks take shape here: precision-cut EVA foam panels are laid into full-deck patterns, bonded, and trimmed by hand. Grippy, comfortable, and durable — the signature look of every art-series board."
    duration: 1–2 days
  - step: "05"
    title: SUP Printing & Decoration
    description: SUP board deck graphics are applied using digital printing for full-colour photo-quality designs, and screen printing for durable logos and repeating patterns. Prints are cured and sealed for UV and abrasion resistance.
    duration: 1–2 days
  - step: "06"
    title: Final Assembly & Rigging
    description: "Boards receive their final components: valves are torqued and function-tested, D-rings, handles, and fin boxes are fitted, and the leash attachment is secured. Each board follows a 100-point assembly checklist with mandatory sign-off at each stage."
    duration: 2–3 days
  - step: "07"
    title: Quality Testing & Inspection
    description: "Every completed board undergoes mandatory quality gate: chamber air-retention test, systems function check, fastener torque verification, and cosmetic inspection. Custom and prototype builds also receive in-water sea trials covering speed, handling, stability, and endurance."
    duration: 1–2 days
  - step: "08"
    title: Packing & Shipping
    description: Boards are deflated, rolled, and packed in travel backpacks with pump, paddle, fin, leash, and repair kit, then boxed for courier and freight shipping. Each package is labelled with model, serial number, and destination. We ship to 50+ countries worldwide.
    duration: 1 day
