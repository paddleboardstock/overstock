hero:
  tagline: Folyamat
  title: Gyártási folyamat
  subtitle: A nyersanyagtól a tengerre kész hajóig — minden lépés a mi irányításunk alatt áll
  back_label: Vissza a gyárhoz
  back_link: /factory
intro: Ellentétben a márkákkal, amelyek a gyártást harmadik fél gyárakba szervezik, Aquafarer ők birtokolják és üzemeltetik az egész gyártóláncot. Ez a vertikális integráció lehetővé teszi, hogy minden szakaszban szigorú minőségellenőrzést tartsunk, gyorsan reagáljunk az egyedi igényekre, és folyamatosan szállítsuk a termékminőséget adásról részre. Íme, hogyan építik a hajót a létesítményünkben.
steps:
  - step: '01'
    title: Anyag átvétele és ellenőrzése
    description: Minden beérkező PVC anyag-, üvegszálas szőnyeg-, gyanta- és hardverpartit a specifikációk szerint ellenőriznek. Az anyagmintákat a gyártás előtt megvizsgálják a húzószilárdság, vastagság egyenletessége és UV ellenállás szempontjából. A nem megfelelőségi anyagokat karanténba helyezik és visszaküldik.
    duration: 1–2 nap
  - step: '02'
    title: Automatikus PVC vágás
    description: Az engedélyezett anyagokat az automata CNC vágógépre helyezik, és milliméter alatti pontossággal vágják. A számítógéppel optimalizált fészkelés a paneleket úgy rendezi, hogy minimalizálja a hulladékot — általában 5% alatt. A vágott paneleket hajómodell és kamra szerint címkézik, majd összekötik a hegesztőműhelybe történő átszállításhoz.
    duration: 2–4 óra hajónként
  - step: '03'
    title: Cső hőtömítés és hegesztés
    description: A paneleket hőtömítő gépekkel, hőlevegős hegesztéssel, 200–600 °C közötti szabályozott hőmérsékleten rögzítik és összekötik. A fő varrásokat RF dielektromos hegesztéssel erősítik meg légmentes, nagy szilárdságú csatlakozások érdekében. A kész kamrákat 1,25× munkanyomásra fújják fel 30 perces légtartási ellenőrzés érdekében.
    duration: 1–2 nap hajónként
  - step: '04'
    title: Üvegszálas RIB hajótest díszléc
    description: RIB A hajótesteket kézzel lefektetett üvegszálas díszlécből készítik. Az üvegszálas szőnyegrétegeket és szőtt rovás rétegeit kézzel tekerik poliészter vagy vinilester gyantával precíziós formákban. Minden réteget vákuumos zsákokkal töltenek be az egyenletes laminált minőség érdekében. A hajótest gélbevonattal van kialakítva, hogy fényes, UVellenálló tengeri felületet kapjon.
    duration: 2–4 nap hajótestenként
  - step: '05'
    title: SUP Nyomtatás és Díszítés
    description: SUP A deszkás grafikákat digitális nyomtatással alkalmazzák teljes színes fotóminőségű mintákhoz, míg szitanyomást tartós logók és ismétlődő minták esetén. A nyomatokat megkeményítik és lezárják a UV koplódás elleni védelem érdekében.
    duration: 1–2 nap
  - step: '06'
    title: Végszerelés és Árbocozás
    description: Az üvegszálas hajótestek és PVC csőszerkezetek az összeszerelő vonalon vannak összekapcsolva. A motor fel van szerelve, kormányzási és gázkart kapcsolva áll, üzemanyagrendszert szerelnek be, és a teljes elektromos köteget bekötik. Minden hajó egy 100 pontos összeszerelési listát követ, minden szakaszban kötelező jóváhagyással.
    duration: 2–3 nap
  - step: '07'
    title: Minőségellenőrzés és Vizsgálat
    description: 'Minden kész hajó kötelező minőségi vizsgálaton esik át: kamra légvisszatartási teszten, rendszerek működésének ellenőrzése, rögzítő nyomatékellenőrzés és kozmetikai ellenőrzés. Az egyedi és prototípus hajók vízi tengeri próbákat is kapnak, amelyek sebességet, kezelhetőséget, stabilitást és állóképességet fednek le.'
    duration: 1–2 nap
  - step: '08'
    title: Csomagolás és szállítás
    description: A hajókat lefújják, eljárás szerint hajtogatják, nehéz teherformú szőtt zsákokba vagy rétegelt lemez ládákba csomagolják, és felrakják a szállításhoz. Minden csomagot modellvel, sorozatszámmal és célállomással jelölnek fel. Világszerte koordinálunk a fuvarszállítókkal az FCL és LCL konténerszállítások ügyében.
    duration: 1 nap
