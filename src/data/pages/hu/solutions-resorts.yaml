testimonial:
  content: Paddle Board Overstock megtervezte és felszerelte teljes strandprogramunkat három üdülőhelyen. 120 SUPs, biztonsági infrastruktúra és személyzeti képzés — mind egy szállításban. Vendégeink részvétele a vízi tevékenységekben 60%-kal nőtt az első szezonban.
  name: Sophie Laurent
  title: Vendégélmény igazgatója, Azure Bay Resorts — Phuket, Thaiföld
content_segments:
  tagline: Üdülő profilok
  title: Waterfront Hospitality Solutions<br />Tulajdonságtípus szerint
  subtitle: Minden üdülőhelynek egyedi vendégprofilja, tevékenységi összetétele és működési ritmusa van — a butik-öko-lodge-októl a kiterjedt luxus tengerparti üdülőhelyekig. Vízisport-programokat tervezünk, amelyek megfelelnek az ingatlanosztálynak és a vendégek elvárásainak.
  items:
    - title: Tengerparti luxusüdülőhelyek
      subtitle: VIP transzferek, vízi programok, prémium vendégélmény
      description: A csúcskategóriás tengerparti ingatlanok — Four Seasons, Aman és hasonló luxuscsoportok — ahol a vízi sportok kiemelt vendégkínálatot jelentenek, ami elégedettséget és kiegészítő bevételeket eredményez. A flottának prémium megjelenése van, korosztályok és képességek szerint változatosságot kell kínálnia, és zökkenőmentesen integrálódnia kell az üdülő meglévő concierge és foglalási rendszereivel. A vendégek megjelenése rendkívül magas – a felszerelés állapota és megjelenése közvetlenül befolyásolja az ötcsillagos értékeléseket.
      features:
        - Prémium márkájú SUPs flottánk az üdülőhely színeivel megegyező kivitelben
        - 'Vendégek előre készült előadása: egyező üdülő színei, logó márkajelzés, színpadi felszerelés bemutatása'
        - Aláírás művészeti sorozatú deszkák prémium vendégélményekhez és fotózási pillanatokhoz
        - 'Integrált biztonsági infrastruktúra: bójavonalak, vízimentőállomások, AED'
        - 'Bevételmenedzsment: dinamikus árképzések, plussell képzések, csomagcsomagolás'
    - title: Magánszigeti üdülőhelyek
      subtitle: Csendes, önellátó vendégvízi tevékenységek
      description: 'A magánszigeti üdülőhelyek távoli helyeken működnek, ahol a logisztika összetett, és minden kézbesítés számít. A vendégvízi tevékenységeknek önellátónak kell lenniük: olyan berendezések, amelyek kompaktan tárolják, igény szerint felfújódnak, minimális karbantartást igényelnek, és gyönyörűen jelennek meg, amikor a vendégek megérkeznek. Flottaprogramokat tervezünk hidroplán- és tengeri áruablakok körül, és tartós szerkezetünk hosszú szezonokon át vendégkészen tartja a berendezéseket szárazföldi támogatás nélkül.'
      features:
        - Kompakt felfújható flotta — hajók és raktárok hatékonyan távoli szigeteken
        - Kereskedelmi szintű PVC építkezés többévados vendéghasználatra
        - Egyszerű helyszíni karbantartás a hozzá tartozó javítási készletekkel és videóútmutatással
        - Egyedi üdülő márkaépítés, amely illeszkedik a sziget esztétikájához
    - title: Tóparti és Eco üdülőhelyek
      subtitle: Természetbe integrált vendégélmények
      description: Tóparti ingatlanok, öko-lodge-ok és természetvédelmi helyek csendes, alacsony terhelésű vízi tevékenységeket kínálnak, amelyek kiegészítik a természeti környezetet. A berendezéseknek lehetőség szerint nem motorosnak kell lenniük, könnyen tárolhatónak kell lenniük a korlátozott helyeken, és csendesnek kell lenniük használatban, hogy minden vendég számára megőrizze a környezeti élményt.
      features:
        - Nem motoros SUP flotta a természet ihlette művészeti sorozatokban
        - Csendes elektromos szivattyús felfújó állomások igény szerinti vendéghasználatra
        - Környezetbarát anyagok és csomagolás, amelyek összhangban vannak a fenntarthatósági márkaépítéssel
        - A tároló állcok és a dokkparti szervezőrendszerek között szerepeltek
    - title: Strandklubok
      subtitle: Vendég szórakoztatás és vízparti hangulat
      description: A strandklubok energikus, vizuális központú környezetet működtetnek, ahol a felszerelés a légkör része. Stílusos lapozódeszkákra van szükségük a vendégek szórakoztatásához, SUP bérlésre a tengerparti tevékenységekhez, és olyan felszerelésekre, amelyek ugyanolyan jól néznek ki, mint maga a helyszín. A flottának könnyen kezelhetőnek kell lennie, bírnia kell a különböző szintű vendégek napi használatát, és gyorsan kell telepítenie a csúcsidőkben.
      features:
        - A jellegzetes művészeti SUPs sorozatok, amelyek egyben a helyszín dekorációja is
        - Bérelésre kész SUP flotta vendégszórakoztatáshoz
        - Egyedi szín és márkaépítés, amely a strandklub vizuális identitásához illeszkedik
        - Gyorsindítási és visszanyerési rendszerek nagy fluktuációjú műveletekhez
        - UV- ellenálló szerkezet a napi sós víz elleni kitettséghez
    - title: Magántagi klubok és jachtklubok
      subtitle: Tagok vízi sportok és exkluzív evezőprogramok
      description: A magánklubok, ahol a vízi sportok tagjai számára előnyösek, nem pedig bevételi tényezők. A felszerelésnek magasabb esztétikai követelményeknek kell felelnie a tagok számára, igény szerint elérhetőnek kell lenniük, és minimális személyzeti felügyeletet kell követelni. A kikötő jachtklubok márkázott SUP flottákat használnak a kikötő körüli tagok szabadidejéhez. A tárolás és karbantartás láthatatlannak kell lennie a tagok számára.
      features:
        - Premium SUP márkájú flották a tagvízi sportokhoz
        - 'Prémium felszerelés: EVA teraszok, egyedi tagszínek, márkás kárpitok'
        - Önkiszolgáló kiadórendszer a tagokhoz személyzet nélkül való hozzáféréshez
        - Szezonon kívüli tárolás és éves frissítési program
    - title: Kaland- és tevékenységközpontú szállodák
      subtitle: Vezetett túrák, SUP jóga, snorkeling kirándulások, csoportos tevékenységek
      description: Ingatlanok, amelyek kaland célpontként pozícionálják magukat — vezetett túrákat, SUP jógát, naplemente evezéseket, snorkeling kirándulásokat és csoportos tevékenységeket kínálnak. A flottának támogatnia kell mind a szabad kölcsönzési, mind a vezetett programmodelleket, olyan felszereléssel, amely zökkenőmentesen átválthat a vendég önálló használata és az oktató által vezetett túrák között. Ezeknek az ingatlanoknak tartós felszerelésre van szükségük a nagy forgalmú csoportokhoz, amelyeket könnyen lehet tisztítani a vendégcsoportok között.
      features:
        - Sokoldalú vegyes flotta, amely támogatja a kölcsönzési + vezetett túramodelleket
        - Extra stabil SUP platformok csoportos tevékenységekhez
        - 'Oktató felszerelés: oktató deszkák, vízhatlan dobozok, vízálló kommunikáció'
        - 'Szezonális felszerelésforgatás: nyári flotta → téli tárolási program'
        - Tartós kivitelezés, amely a napi vendéghasználatot minimalizált karbantartással is elviseli
