      - title: Tárolás és karbantartás
        description: Polcrendszerek, felfújási állomások és napi ellenőrző listák
      - title: Személyzeti Képzés
        description: A tevékenységek személyzetének helyszíni tájékoztatása a felszerelés kezeléséről és a vendégbiztonságról
      - title: Indítási támogatás
        description: Program kézikönyv árazási sablonokkal, felelősségvállalási nyomtatványokkal és tevékenységi ütemtervekkel
    cta_text: Tervezze meg üdülőhelyi megoldásomat
