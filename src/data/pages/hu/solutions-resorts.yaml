testimonial:
  content: Aquafarer Megterveztük és felszereltük az egész strandprogramunkat három üdülő ingatlanban. 80SUPs, 40 kajak, biztonsági infrastruktúra és személyzeti képzés — mind egy szállítmányban szállított. Vendégeink részvétele a vízi tevékenységekben 60%-kal nőtt az első szezonban.
  name: Sophie Laurent
  title: Vendégélmény igazgatója, Azure Bay Resorts — Phuket, Thaiföld
content_segments:
  tagline: Üdülő profilok
  title: Waterfront Hospitality Solutions<br />Tulajdonságtípus szerint
  subtitle: Minden üdülőhelynek egyedi vendégprofilja, tevékenységi összetétele és működési ritmusa van — a butik-öko-lodge-októl a kiterjedt luxus tengerparti üdülőhelyekig. Vízisport-programokat tervezünk, amelyek megfelelnek az ingatlanosztálynak és a vendégek elvárásainak.
  items:
    - title: Tengerparti luxusüdülőhelyek
      subtitle: VIP transzferek, vízi programok, prémium vendégélmény
      description: A csúcskategóriás tengerparti ingatlanok — Four Seasons, Aman és hasonló luxuscsoportok — ahol a vízi sportok kiemelt vendégkínálatot jelentenek, ami elégedettséget és kiegészítő bevételeket eredményez. A flottának prémium megjelenése van, korosztályok és képességek szerint változatosságot kell kínálnia, és zökkenőmentesen integrálódnia kell az üdülő meglévő concierge és foglalási rendszereivel. A vendégek megjelenése rendkívül magas – a felszerelés állapota és megjelenése közvetlenül befolyásolja az ötcsillagos értékeléseket.
      features:
        - 'Premium márkájú flották: SUPs, kajakok, pedálhajók és kis RIB tenderek'
        - 'Vendégek előre készült előadása: egyező üdülő színei, logó márkajelzés, színpadi felszerelés bemutatása'
        - Kis RIB luxus VIP vendégtranszferek számára, egyedi kárpitozással és színpárosítással
        - 'Integrált biztonsági infrastruktúra: bójavonalak, vízimentőállomások, AED'
        - 'Bevételmenedzsment: dinamikus árképzések, plussell képzések, csomagcsomagolás'
    - title: Magánszigeti üdülőhelyek
      subtitle: Minden időjárási körülmények között vendégszállítás — nulla állásidő, abszolút megbízhatóság
      description: A magánszigeti üdülőhelyek távoli helyeken működnek, ahol a hajó az egyetlen kapcsolat a szárazföldhöz. A napi vendégszállítások, az ellátmányozások és a sürgősségi orvosi evakuálások egyetlen hajón múlnak — bármilyen leállás közvetlenül befolyásolja a vendégélményt és az üdülő működését. Ezeknek az üzemeltetőknek olyan hajóra van szükségük, amely megbízhatóan közlekedik minden időjárási körülmények között, minimális karbantartást igényel, és tartalék rendszerekkel rendelkezik a kritikus megbízhatóság érdekében. A hajónak gyönyörűen kell megjelennie, amikor a vendégek megérkeznek a szigetre.
      features:
        - Időjárási körülmények között RIB használható konfiguráció teljes időjárási záróval és nehéz tekologikus csövekkel
        - Kétmotoros vagy tartalék motor kialakítás nulla leállás nélküli műveletekhez
        - Kereskedelmi szintű Hypalon építkezés 5-8 éves élettartammal távoli szolgálatban
        - Könnyen karbantartott tervezés elérhető alkatrészekkel a helyszíni karbantartáshoz
        - Egyedi üdülő márka és prémium kárpitozás, amely a szigethez illő stílus
    - title: Tóparti és Eco üdülőhelyek
      subtitle: Természetbe integrált vendégélmények
      description: Tóparti ingatlanok, öko-lodge-ok és természetvédelmi helyek csendes, alacsony terhelésű vízi tevékenységeket kínálnak, amelyek kiegészítik a természeti környezetet. A felszereléseknek lehetőség szerint nem motorosnak kell lenniük, könnyen tárolhatók korlátozott helyű csónakházakban, és csendesek legyenek használatban, hogy minden vendég számára megőrizze a környezeti élményt.
      features:
        - 'Nem motorizált flották: SUPs, kajakok, kenuk és evezőcsónakok'
        - Csendes elektromos szivattyús felfújó állomások igény szerinti vendéghasználatra
        - Környezetbarát anyagok és csomagolás, amelyek összhangban vannak a fenntarthatósági márkaépítéssel
        - A tárolóállcok és hajóház szervezési rendszerei közé tartoztak
    - title: Strandklubok
      subtitle: Vendégszállítás, szórakozás, kis luxus RIBs
      description: A strandklubok energikus, vizuális központú környezetet működtetnek, ahol a felszerelés része a légkörnek. Kis luxusra RIBs van szükségük vendégtranszferekhez a közeli szállodákból vagy dokkokról, valamint vízjátékokra a vendégek szórakoztatására — jetski-vontatás, felfújható csúszdák és lapozódeszka. A flottának stílusosnak kell kinéznie, könnyen kezelhetőnek lennie, és elviselnie kell a különböző szintű vendégek napi használatát. A tárolás és a gyors telepítés kritikus a csúcsidőkben.
      features:
        - Kompakt RIB luxus (3,3-4,3 m) vendégtranszferekhez és tenderi szolgáltatáshoz
        - 'Vízjátékok: vontatható felfújható gépek, SUP deszkák, kajakok vendégek szórakoztatására'
        - Egyedi szín és márkaépítés, amely a strandklub vizuális identitásához illeszkedik
        - Gyorsindítási és visszanyerési rendszerek nagy fluktuációjú műveletekhez
        - Tartós Hypalon szerkezet a napi sós víz elleni kitettséghez és UV
    - title: Magántagi klubok és jachtklubok
      subtitle: Kikötői közlekedés, tagi pályázatok, exkluzív vízi sportok
      description: Magánklubok, ahol a vízi sportok és hajószállítás tagjainak előnyét képezik, nem pedig bevételi tényezőt. A felszerelésnek magasabb esztétikai követelményeknek kell megfelelnie, igény szerint elérhetőnek kell lennie a tagok számára, és minimális személyzeti felügyeletet kell követelni. A marina jachtkluboknak kifejezetten szükségük van tenderekre a kikötői szállításhoz — a tagok mozgása a dokk, kikötőhely és a part között. A tárolás és karbantartás láthatatlannak kell lennie a tagok számára.
      features:
        - Magas kategóriás RIB tenderek kikötői szállításra és tagáthelyezési szolgáltatásokra
        - 'Prémium felszerelés: EVA teraszok, egyedi tagszínek, márkás kárpitok'
        - Önkiszolgáló kiadórendszer a tagokhoz személyzet nélkül való hozzáféréshez
        - Szezonon kívüli tárolás és éves frissítési program
    - title: Kaland- és tevékenységközpontú szállodák
      subtitle: Vezetett túrák, SUP jóga, snorkeling kirándulások, csoportos tevékenységek
      description: Ingatlanok, amelyek kaland célpontként pozícionálják magukat — vezetett túrákat, SUP jógát, naplemente evezéseket, snorkeling kirándulásokat és csoportos tevékenységeket kínálnak. A flottának támogatnia kell mind a szabad kölcsönzési, mind a vezetett programmodelleket, olyan felszereléssel, amely zökkenőmentesen átválthat a vendég önálló használata és az oktató által vezetett túrák között. Ezeknek az ingatlanoknak tartós felszerelésre van szükségük a nagy forgalmú csoportokhoz, amelyeket könnyen lehet tisztítani a vendégcsoportok között.
      features:
        - Sokoldalú vegyes flotta, amely támogatja a kölcsönzési + vezetett túramodelleket
        - Tandem kajakok és extra stabil SUP platformok csoportos tevékenységekhez
        - 'Oktató felszerelés: oktató deszkák, vízhatlan dobozok, vízálló kommunikáció'
        - 'Szezonális felszerelésforgatás: nyári flotta → téli tárolási program'
        - Tartós kivitelezés, amely a napi vendéghasználatot minimalizált karbantartással is elviseli
