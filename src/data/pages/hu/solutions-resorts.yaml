  - 'Üdülőhelyi standard: 20–50 SUP tábla üdülőhelyi márkajelzéssel, biztonsági infrastruktúra, személyzeti képzés'
  - 'Üdülőhelyi prémium: 50–100+ flottával vendégélményt támogató rendszerek, bevételi programok, szezonális támogatás'
  - 'Teljes biztonsági megfelelés: vízimentő állomások, bójasorok, AED, vészhelyzeti akciótervek'
  - Éves 50–200 ezer dollár kiegészítő bevétel hozzáadása professzionálisan menedzselt vízi sport programmal
