features3_markets:
  tagline: Főbb piacok
  title: Regionális szakértelem<br />Helyi igények
  subtitle: Tudjuk, hogy a különböző piacoknak eltérő szabályozási követelményei, preferenciái és felhasználási lehetőségei vannak.
  isBeforeContent: false
  columns: 4
  items:
    - title: Európa és Egyesült Királyság
      description: CE-tanúsított termékek, amelyek megfelelnek az EN ISO 6185 szabványoknak. Erős kereslet RIBsa felfújható csónakok és SUP deszka iránt az EU piacaiban. Az Egyesült Királyság forgalmazói értékelik gyors felkészülésünket.
      icon: tabler:map-pin
    - title: Észak-Amerika
      description: Az amerikai parti őrség jóváhagyta a gyártást. Az amerikai raktár Montclairben, Kaliforniában a gyors nyugati parti szállításhoz. Növekvő kereslet a halászhajók, mentőhajók és SUPsszabadidős eszközök iránt.
      icon: tabler:map-pin
    - title: Ausztrália és Óceánia
      description: Erős piac a RIB hajók és felfújható tenderek számára. Az ausztrál forgalmazók nagyra Hypalon értékelik hajóinkat a UV zord napsütésben való ellenállásuk miatt. Gyors szállítás ázsiai létesítményünkből.
      icon: tabler:map-pin
    - title: Közel-Kelet
      description: Növekvő kereslet a járőr- és mentőhajók iránt. Alumínium törzsünk RIBs népszerű a parti őrség és biztonsági üzemeltetők körében. Egyedi konfigurációk magas hőmérsékletű környezethez.
      icon: tabler:map-pin
features3_distribution:
  tagline: Terjesztési hálózat
  title: Partnerség a forgalmazókkal<br />Világszerte
  subtitle: Jól ismert tengeri felszerelés forgalmazókkal, OEM márkákkal és kormányzati beszerzési ügynökségekkel dolgozunk együtt.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM Partnerségek
      description: Saját márkájú gyártás a globális vízisport márkák számára. Mi intézzük mindent a tervezéstől a gyártáson át a közvetlen szállításig.
      icon: tabler:building
    - title: Forgalmazói hálózat
      description: A 20+ országban működő hivatalos forgalmazók készlettel rendelkeznek és helyi támogatást nyújtanak. Új forgalmazói megkereséseket szívesen fogadunk.
      icon: tabler:users
    - title: Kormányzati és intézményi
      description: Közvetlen ellátás a parti őrségeknek, kereső-mentő szervezeteknek és katonai beszerzési programoknak. Megfelelés az intézményi beszerzési követelményeknek.
      icon: tabler:building-community
steps2_logistics:
  title: Globális Logisztika és Támogatás
  subtitle: A gyártótól a célállomásig — mi kezeljük az egész ellátási láncot.
  items:
    - title: Szállítási lehetőségek
      description: Tengeri szállítás (FOB Qingdao), légi szállítás sürgős rendelésekhez, valamint gyorsposta mintákhoz és pótalkatrészekhez.
      icon: tabler:truck-delivery
    - title: USA raktár
      description: 'Készlet Montclair-ben, Kaliforniában gyors szállításhoz Észak-Amerika-szerte. Nyugati part: 2-3 nap, Közép: 3-4 nap, Keleti part: 4-5 nap.'
      icon: tabler:building-warehouse
    - title: Pótrészek
      description: Eredeti Paddle Board Overstock pótalkatrészek és fogyóanyagok egész évben raktáron. A gyakori alkatrészek 24 órán belül szállíthatók.
      icon: tabler:package
    - title: Műszaki támogatás
      description: Közvetlen vonal a mérnöki csapatunkhoz műszaki kérdések, javítási tanácsok és átalakítási támogatás céljából. Támogatjuk azokat a hajókat, amelyeket 20 évvel ezelőtt építettünk.
      icon: tabler:headset
cta:
  title: Szeretnél forgalmazóvá válni?
  subtitle: Aktívan bővítjük értékesítési hálózatunkat. Lépjen kapcsolatba exportcsapatunkkal, hogy megvitassák az együttműködési lehetőségeket.
  actions:
