hero:
  tagline: A mi történetünk
  title: Aquafarer — Mérnöki szabadság a vízen
  subtitle: 'Egy part menti műhelytől egy globális tengeri gyártóig — utunkban egy makacs meggyőződésre épül: a vízi járműveket úgy kell megtervezni, mintha számítanának, mert valóban számítanának.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer Gyár és tengeri gyártóüzem Qingdaóban
