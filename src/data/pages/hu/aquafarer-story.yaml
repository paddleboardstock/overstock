timeline:
  - year: '2012'
    title: Tengeri Gyártási Alapítvány
    body: A Aquafarer cég egy speciális felfújható vízi járműműhelyként indult Qingdaóban, Kínában, amely elkötelezett a tengeri kézművesség és felfújható hajógyártás mellett. A kezdeti fókusz a megbízható felfújható termékek fejlesztésén dolgozott gyakorlati mérnöki tapasztalat és gyártási fegyelem alapján.
  - year: '2015'
    title: Első export és CE tanúsítás
    body: Az első exportmegrendelések Japánba és Koreába érkeztek.CE A fő termékvonalak tanúsítását érték el, ami Aquafarera nemzetközi piacokra való belépést jelzi. A vállalat Kínán túl is kiszolgálta a kereskedelmi és szabadidős felhasználókat.
  - year: '2018'
    title: Gyárbővítés
    body: Egy 12 000 m²-es gyártóüzembe költöztették. RF hegesztővonalak és drop-stitch gyártási kapacitás bővített, lehetővé téve a nagyobb gyártást és a minőségellenőrzési rendszerek fejlesztését.
  - year: '2020'
    title: Kutatás-fejlesztési központ létrehozása
    body: Dedikált Kutatás-Fejlesztési központot nyitottunk PVC textillaborral, hidrodinamikai teszttartálysal és CAD/FEA szimulációs stúdióval. A termékfejlesztés kiterjedt a könnyű szerkezetre, a jobb tartósságra és a felhasználóközpontú tervezésre.
  - year: '2022'
    title: Tanúsítvány és globális növekedés
    body: ISO 9001-es minősítést értek el. Bővítették 14 T&D mérnököt és 200+ munkást. A termékek eljutottak az ügyfelekhez Európa, Amerika és Ázsiai-Csendes-óceáni térségen forgalmazók és OEM partnerségek révén.
  - year: '2024'
    title: Innováció és Tervezés Stúdió
    body: Teljes körű tervezési és innovációs stúdiót indított egyedi ODM projektekhez, a koncepciótól a gyártásig. Megerősítette a professzionális tengeri alkalmazásokat, beleértve a mentő-, kereskedelmi és kormányzati pályázatokat.
  - year: '2026'
    title: A vízkutatás jövőjének építése
    body: Ma Aquafarer továbbra is fejleszti a felfújható csónakokat, SUP rendszereket és testreszabott tengeri megoldásokat — összekötve az embereket és szervezeteket a világ vizeivel. 50+ ország szolgált szolgálatot, évi 15 000 egység kapacitásával.
content_founding:
  tagline: A kezdet
  title: A Waterparton született
  subtitle: 'Egy Aquafarer tengerparti műhelyben kezdtem Qingdaóban, egyetlen hajóval és egy vízióval: felfújható vízijárművek építése, amelyek képesek kezelni a valódi tengeri körülményeket.'
  paragraphs:
    - 2012-ben alapítóink piaci rést láttak — a legtöbb felfújható hajó vagy megfizethető, de megbízhatatlan, vagy magas minőségű, de túlzott drága volt. Úgy vélték, van hely egy olyan gyártónak, amely egyszerre kínál minőséget és értéket.
    - Az első hajótestet kézzel építették, helyi vizeken tesztelték, és a halászok és kis kereskedelmi üzemeltetők valódi visszajelzései alapján finomították. Ez a visszacsatolási kör — építés, tesztelés, hallgatás, fejlesztés — ma is mérnöki filozófiánk középpontjában áll.
    - 2015-re a hír túlmutatott Qingdaón. Nemzetközi forgalmazók elkezdtek mintákat kérni. Ami helyi műhelyként indult, globális beszállítóvá vált.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer Korai gyártási műhely és gyártás
content_growth:
  tagline: Növekedés és innováció
  title: Műhelytől 12 000 m²-es létesítményig
  subtitle: Folyamatos beruházás az emberekbe, berendezésekbe és folyamatokba modern Aquafarer tengeri gyártóüzemmé alakult.
  paragraphs:
    - Ahogy nőtt a kereslet, úgy nőtt a létesítményünk is. Egy kis műhelyből egy 12 000 m²-es gyárká bővültünk, ahol külön gyártósorokkal rendelkeztek RIB hajók, felfújható csónakok, SUP deszkák és kiegészítők számára.
    - CNC Vágógépekbe, nagyfrekvenciás hegesztőgépekbe, drop stitch gyártósorokba és átfogó tesztgépekbe fektettünk be — lehetővé téve, hogy a gyártás minőségének minden aspektusát ellenőrizzük.
    - Ma 200-300 fős csapatunk tengeri mérnökökből, anyagtudósokból, minőségellenőrzési szakemberekből és tapasztalt kézművesekből áll — akik közül Aquafarer sokan már a kezdetektől fogva dolgoznak náluk.
founder:
  tagline: Ismerd meg az alapítót
  title: Egy vízész által épített
  subtitle: David Chen alapító egyesíti a gyártási szakértelmet és a vízi sportok iránti élethosszig tartó szenvedélyét – ez a kombináció meghatározza, hogyan Aquafarer közelítjük meg a termékfejlesztést.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — Alapítója Aquafarer
  story:
    - David Chen a Qingdao partvidékén nőtt fel, ahol a tenger nem nyaralási hely volt, hanem életmód. Fiatalkorát kajakozással, vitorlázással és horgászattal töltötte a Sárga-tengeren — olyan élmények, amelyek intuitív megértést adtak neki arról, mit kell elviselniük a vízi járműveknek.
    - Alapítása Aquafarerelőtt David egy évtizedet töltött tengeri gyártásban, ahol a termelés, minőség és nemzetközi kereskedelem területén dolgozott. Európai OEM és észak-amerikai márkák programjait vezette, első kézből tanulva meg a globális piacok szabványait és elvárásait.
    - '2012-ben Aquafarer alapította egy egyszerű küldetéssel: felfújható vízi járműveket építsen, amelyeket a saját családjával bízna meg a vízen. Ez a személyes szabvány — használnám ezt? — továbbra is minden termék végső próbája marad, amely elhagyja a gyárat.'
    - Ma David vezeti a termékstratégiát és felügyeli az R&D csapatot, személyesen vizsgálja át az új terveket és teszteli a prototípusokat a Qingdao mellett. Úgy véli, hogy a nagyszerű termékek mind a mérnöki munka, mind a tapasztalat megértéséből származnak.
philosophy:
  tagline: Márkafilozófia
  title: Mérnöki szabadság a vízen
  body: A vízi szabadság nem csupán a mozgásról szól. Ez új helyek felfedezését, szabadtéri élmények létrehozását, az emberek természettel való összekapcsolását és szakmai missziók lehetővé tételét jelenti. A mérnöki munka teszi lehetővé ezt a szabadságot.
  pillars:
    - title: Elsőként megbízhatóság
      body: A vízi környezetek bizalmat követelnek meg.Aquafarer A termékek stabilitásra, tartósságra, biztonságra és következetes teljesítményre épülnek.
    - title: Emberközpontú tervezés
      body: A termékeknek az embereket kell szolgálniuk, nem pedig a technológiát. Minden tervezési döntés azzal kezdődik, hogy megértsük, hogyan használják az emberek a vízi járműveket, hol járnak fel, és milyen kihívásokkal szembesülnek.
    - title: Elérhető felfedezés
      body: A víz nem csak a szakértőké kellene tartozni.Aquafarer olyan berendezéseket hoz létre, amelyek lehetővé teszik, hogy több ember biztonságosan tapasztalhasson folyókat, tavakat, óceánokat és part menti környezeteket.
    - title: Folyamatos innováció
      body: Az innováció nemcsak új termékek létrehozását jelenti. Minden részletet javít — anyagokat, szerkezeteket, gyártást és felhasználói élményt.
engineeringDna:
  tagline: Mérnöki DNS
  title: Hogyan Aquafarer készít termékeket
  areas:
    - title: Anyagtudomány
      body: Aquafarer a különböző tengeri környezetekhez megfelelő anyagok kiválasztására összpontosít. A legfontosabb szempontok közé tartozik a kopásállóság, a UV ellenállás, a nyomásstabilitás és a hosszú távú tartósság.
      items:
        - Kopásállóság
        - UV-állóság
        - Nyomásstabilitás
        - Hosszú távú tartósság
    - title: Szerkezetmérnöki munka
      body: A felfújható vízi járművekhez precíz egyensúlyt kell találni a merevség, súly, hordozhatóság és stabilitás között. Aquafarer mérnöki munka a tényezők optimalizálására összpontosít drop-stitch alaptechnológián és fejlett varráskonstrukción keresztül.
      items:
        - Merevség
        - Súlyoptimalizálás
        - Hordozhatóság
        - Stabilitás
    - title: Gyártási precizitás
      body: 'Minden termék ellenőrzött folyamatokon megy keresztül: anyagelőkészítés, precíz vágás, hegesztés és ragasztás, összeszerelés, minőségellenőrzés és teljesítményellenőrzés.'
      items:
        - Anyagelőkészítés
        - Precíz vágás
        - Hegesztés és ragasztás
        - Összeszerelés és minőségellenőrzés
    - title: Felhasználói forgatókönyv mérnöki munka
      body: A termékeket valós alkalmazások köré fejlesztik — szabadidős, kalandos és professzionális használatra — biztosítva, hogy minden terv megfeleljen a célzott környezet specifikus igényeinek.
      items:
        - Szabadidő
        - Kaland
        - Professional
        - Kereskedelmi
