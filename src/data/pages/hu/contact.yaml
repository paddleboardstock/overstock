hero_text:
  tagline: Kapcsolat
  title: LÉPJEN KAPCSOLATBA
contact_form:
  id: form
  title: Küldjön nekünk üzenetet
  subtitle: Rendelési kérdések, méretválasztási tanácsok vagy terméktámogatás esetén írjon nekünk. Egy munkanapon belül válaszolunk.
  email_to: info@paddleboardoverstock.com
  submit_button: Kérdés küldése → Árajánlat kérés
  success_message: Köszönjük! Üzenete megérkezett a postafiókunkba. Egy munkanapon belül válaszolunk.
  error_message: Üzenete küldése sikertelen volt. Kérjük, próbálja újra, vagy küldjön közvetlenül e-mailt.
  default_country_code: '+1'
  captcha:
    label: 'Spam elleni védelem: kérjük, oldja meg a következőt'
  fields:
    - name: keresztnév
      label: Keresztnév
      row: 1
    - name: vezetéknév
      label: Vezetéknév
      row: 1
    - name: cég neve
      label: Cégnév
      row: 2
    - name: address
      label: Cím
      row: 3
    - name: zip
      label: Irányítószám
      row: 4
    - name: country
      label: Ország
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: rendelési mennyiség
      label: Becsült rendelési mennyiség
      row: 6
      type: select
      options:
        - value: ''
          label: Hány deszkát szeretne vásárolni?...
        - value: one
          label: Csak egy deszka
        - value: 2-4
          label: 2–4 deszka
        - value: 5-plus
          label: 5+ deszka (család, klub vagy kölcsönzés)
    - name: customization
      label: Miben tudunk segíteni?
      row: 7
      type: select
      options:
        - value: ''
          label: Válasszon témát...
        - value: none
          label: Általános termékkérdés
        - value: sizing
          label: Segítség a megfelelő deszka kiválasztásában
        - value: order
          label: Rendelés, fizetés vagy szállítás
        - value: warranty
          label: Garancia vagy javítási támogatás
    - name: termékÉrdeklődés
      label: Érdeklődési termékkategóriák
      row: 8
      type: select
      options:
        - value: ''
          label: Válasszon termékkategóriát...
        - value: all
          label: Minden termék / Teljes katalógus
        - value: sup
          label: SUP Deszkák / Paddleboardok
        - value: packages
          label: Teljes SUP csomagok
        - value: accessory
          label: Kiegészítők (szivattyúk, evezők, táskák)
    - name: subject
      label: Tárgy
      row: 9
    - name: message
      label: Üzenet
      row: 10
      type: textarea
      rows: 6
