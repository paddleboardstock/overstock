    - title: Műszaki támogatás
      description: Garancia, javítások, alkatrészek és üzemeltetési kérdések.
      icon: tabler:tool
    - title: Sajtó és partnerségek
      description: Médiacsomagok, szponzoráció és ipari együttműködés.
      icon: tabler:news
    - title: Telefon
      description: +1 279 732 3333 (US HQ) · +86 13305324192 (gyár)
      icon: tabler:headset
    - title: Email
      description: info@aquafarer.com
      icon: tabler:mail
    - title: Globális központ & Számlázás
      description: Aquafarer LLC, New Mexico, Egyesült Államok
      icon: tabler:map-pin
