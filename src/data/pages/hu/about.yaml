hero:
  tagline: Rólunk
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock gyár és műhely
  title: <span class="text-accent dark:text-white">A lapáttábla-feleslegről</span>
  subtitle: Vadonatúj felfújható SUP-táblák túlraktározási és kiárusítási áron — 2012 óta saját Weihai-gyártásunk, kiskereskedőknek szánt vegyes modell nagykereskedésünk és világszerte rugalmas szállításunk támogatásával.
stats:
  title: Számokban
  columns: 4
  stats:
    - title: Éves termelési kapacitás
      amount: 15 000 egység
    - title: Országok, ahová szállítunk
      amount: 50+
    - title: Táblák nyomásvizsgálata
      amount: 100%
    - title: Kutatás-fejlesztési mérnökök
      amount: 14+
features3_what_we_build:
  title: Amit építünk
  subtitle: Egy fókuszált termékvonal, amelyet belülről kifelé ismerünk — nincs félkész kísérlet, nincs jelvény-alapú tervezés.
  columns: 3
  isBeforeContent: true
  items:
    - title: Felfújható SUP DESZKÁK
      description: Teljes körű és túrázó SUP-ok 10 lábtól 12 lábig. Stabil, merev, szivattyúval, evezővel és pórázzal.
      icon: tabler:swimming
    - title: Művészi sorozat fedélzetei
      description: Signature EVA fedélzeti grafika — Cheetah Surge, Tropical Breeze, Medusa Glow és még sok más.
      icon: tabler:hexagons
    - title: Teljes csomagok
      description: 'Minden deszka teljes készletként érkezik: deszka, hátizsák, szivattyú, evező, uszony, póráz és javítókészlet.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Kiegészítők
      description: Szivattyúk, lapátok, pórázok, javítókészletek és szárazzsákok. Mindegyik egyezik a tábláinkkal.
      icon: tabler:tool
    - title: Ápolás és javítás
      description: Házon belüli javítási támogatás, pótalkatrészek és karbantartási útmutatás, hogy a deszka évekig a vízen maradjon.
      icon: tabler:settings
    - title: Klub- és bérjárműflották
      description: Csoportos felszerelés klubok, iskolák és bérelhető flották számára közvetlen gyári támogatással.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Táblatervezés és mérnöki megbeszélés
steps2_values:
  title: Értékeink
  subtitle: Három alapelv, amely minden termékünket formálta az első naptól.
  items:
    - title: Építs úgy, mintha a családodat vinnéd
      description: Minden deszkát, varratot és szelepet úgy kezelünk, mintha a saját családunk használná.
      icon: tabler:heart
    - title: Mérnököt hívunk, mielőtt eladnánk
      description: Ha egy műszaki előírás hibás, akkor mi változtatjuk meg az előírást — soha a vásárlót.
      icon: tabler:settings
    - title: Támogatás, ami túléli a garanciát
      description: Az évekkel ezelőtt épített táblák még mindig hívnak minket pótalkatrészekért, és még mindig felveszünk.
      icon: tabler:headset
steps2_milestones:
  title: Mérföldkövek
  subtitle: A Paddle Board Overstock történet rövid változata.
  isReversed: true
  items:
    - title: Alapítva Weihaiban
      description: Egy tengerparti műhely, amelyet a felfújható SUP deszkáknak szenteltek.
      icon: tabler:building-factory
    - title: 12 000 m² -es termelési campus
      description: Egy külön létesítményre bővítve RF hegesztési és cseppöltő gyártási kapacitással.
      icon: tabler:circle-check
    - title: Nemzetközi exportprogram
      description: Most már több mint50 országba szállítunk expressz és tengeri szállítási lehetőségekkel.
      icon: tabler:world
    - title: Overstock és nagykereskedelmi fókusz
      description: 2026 szeptemberében a márkaműveletek a Qingdao Vatrad Csoportból a Weihai Dongjilian Co., Ltd.-be költöztek; a Weihai gyártóközpont folytatja a K + F-t, a termelést és a gyár közvetlen szállítását.
      icon: tabler:building-skyscraper
features2_locations:
  title: Telephelyeink
  tagline: Találjon meg minket
  columns: 3
  items:
    - title: Székhely és műhely
      description: Tengeri ipari park, 4-es épület — hétfőtől péntekig látogatható egyeztetés alapján.
    - title: EU szolgáltató központ
      description: Mediterrán kikötő — átalakítás, javítás és garanciális támogatás európai ügyfeleknek.
    - title: APAC partnerhálózat
      description: Autorizált szervizpartnerek Ausztráliában, Japánban, Szingapúrban és Hongkongban.
brand_hub_tagline: Márka
brand_hub_title: Fedezze fel a márkánkat
brand_hub_subtitle: Mélyebben merüljön el tengeri mérnöki szakértelmünkben, globális jelenlétünkben és azokat az elveket, amelyek minket vezérelnek.
brand_hub_cards:
  - title: Tengeri szakértelem
    desc: Évtizedes anyagtudomány, precíziós gyártás és valós tesztelés — a cseppvarratos magoktól a hegesztett varratokig és a művészi sorozatú fedélzetekig.
    link: /brand-marine-expertise
    link_label: További információ →
  - title: Miért Paddle Board Overstock
    desc: Gyári közvetlen árak, 100% nyomás alatt tesztelt táblák és 2 év garancia — evezők, családok és vízi sportok szerelmeseinek.
    link: /brand-why-paddleboardoverstock
    link_label: További információ →
