hero:
  tagline: Rólunk
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer gyár és műhely
  title: |
    Hajózási mérnöki munka,<br />
    építettük a<span class="text-accent dark:text-white">Aquafarer</span>módon
  subtitle: 'Egy tengerparti műhelyben kezdtünk egy hajóval és egy makacs hittel: a tengeri termékeket úgy kell megtervezni, mintha számítana, mert számít. Ma már több mint 50 országba szállítunk, de minden hajótest még mindig ugyanazokon a kezeken megy át, akik elindították a céget.'
stats:
  title: Számokban
  columns: 4
  stats:
    - title: Kiszállított hajótestek
      amount: 2,400+
    - title: Országok, ahová szállítunk
      amount: 50+
    - title: Összesített tapasztalat évei
      amount: '60'
    - title: Átlagos garanciális válaszidő (órában)
      amount: '24'
features3_what_we_build:
  title: Amit építünk
  subtitle: Egy fókuszált termékvonal, amelyet belülről kifelé ismerünk — nincs félkész kísérlet, nincs jelvény-alapú tervezés.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB hajók
      description: Alumínium-hullámú RIBs 3,3 m-től 7,5 m-ig. Tervezve járőrözésre, búvárkodásra, horgászatra és családi használatra.
      icon: tabler:ship
    - title: Felfújható hajók
      description: PVC és Hypalon felfújható csónakok 2,4 m-től 4,2 m-ig. Könnyűek, erősek és könnyen tárolhatók.
      icon: tabler:speedboat
    - title: Szuperjacht tender hajók
      description: Kompakt, nagy teljesítményű RIBs egyedi építés a főhajó kinézetéhez illesztve.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Kiegészítők
      description: Evezők, pumpák, huzatok, szárazzsákok, üzemanyagtartályok és elektronika. Mind a hajóinkhoz illesztve.
      icon: tabler:package
    - title: Felújítás és javítás
      description: Helyben történő csőcsere, elektronikai retrofit és motorkorszerűsítés.
      icon: tabler:tool
    - title: Egyedi építések
      description: Projektalapú tervezés kereskedelmi, tudományos és katonai ügyfelek számára.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Hajótervezés és mérnöki beszélgetés
steps2_values:
  title: Értékeink
  subtitle: Három alapelv, amely minden termékünket formálta az első naptól.
  items:
    - title: Építs úgy, mintha a családodat vinnéd
      description: Minden hajótesten, hegesztésen és rögzítőelemen úgy bánunk, mintha a saját családunk használná azt.
      icon: tabler:heart
    - title: Mérnököt hívunk, mielőtt eladnánk
      description: Ha egy műszaki előírás hibás, akkor mi változtatjuk meg az előírást — soha a vásárlót.
      icon: tabler:settings
    - title: Támogatás, ami túléli a garanciát
      description: Húsz éves hajótestek is hívnak alkatrészért, és mi még mindig felvesszük a telefont.
      icon: tabler:headset
steps2_milestones:
  title: Mérföldkövek
  subtitle: A Aquafarer történet rövid változata.
  isReversed: true
  items:
    - title: Tengeri műhelyben alapítva
      description: Két hajótervező által indítva egy CNC malommal és egy makacs ötlettel.
      icon: tabler:building-factory
    - title: Az első 1 000 hajótest leszállítva
      description: A hetedik évünkben értük el, főként szájról szájra terjedő ajánlások és visszatérő ügyfelek révén.
      icon: tabler:circle-check
    - title: Nemzetközi exportprogram
      description: Most 50+ országba szállítunk, helyi támogató partnerekkel öt kontinensen.
      icon: tabler:world
    - title: Új globális működési struktúra
      description: 2026 szeptemberében a márka működése a Qingdao Vatrad Grouptól átkerült a Aquafarer LLC-hez (New Mexico, USA); a qingdaoi gyártóközpont továbbra is R&D-t, gyártást és közvetlen exportot végez.
      icon: tabler:building-skyscraper
features2_locations:
  title: Telephelyeink
  tagline: Találjon meg minket
  columns: 3
  items:
    - title: Székhely és műhely
      description: Tengeri ipari park, 4-es épület — hétfőtől péntekig látogatható egyeztetés alapján.
    - title: EU szolgáltató központ
      description: Mediterrán kikötő — átalakítás, javítás és garanciális támogatás európai ügyfeleknek.
    - title: APAC partnerhálózat
      description: Autorizált szervizpartnerek Ausztráliában, Japánban, Szingapúrban és Hongkongban.
brand_hub_tagline: Márka
brand_hub_title: Fedezze fel a márkánkat
brand_hub_subtitle: Mélyebben merüljön el tengeri mérnöki szakértelmünkben, globális jelenlétünkben és azokat az elveket, amelyek minket vezérelnek.
brand_hub_cards:
  - title: Tengeri szakértelem
    desc: Évtizedek anyagtudományban, precíziós gyártásban és gyakorlati tesztelésben — a PVC/Hypalon gyártástól a deep-V hajótest tervezéséig és a drop-stitch technológiáig.
    link: /brand-marine-expertise
    link_label: További információ →
  - title: Globális jelenlét
    desc: Szállítás 50+ országba a qingdaói telephelyünkről, engedélyezett szolgáltató partnerekkel együtt Európában, Ázsia-Csendes-óceáni régióban és az Amerikában.
    link: /brand-global-presence
    link_label: További információ →
  - title: Miért Aquafarer
    desc: Vertikális integráció, kettős tanúsítvány (ISO 9001 + BSCI), CE megfelelőség és alacsony MOQs — márkák, forgalmazók és kormányzati ügynökségek számára építve.
    link: /brand-why-aquafarer
    link_label: További információ →
production_section:
  tagline: Termelési kiválóság
  title: A kiváló mestermunka biztosítása
  description: Aquafarer gyártósor a magas minőségű, tartós és nagy teljesítményű felfújható hajótermékek előállításának szentelt.
  cards:
    - title: Tapasztalt technikus csapat
      items:
        - PVC, Hypalon és tengeri anyagok szakmai ismerete
        - Precíz kivitelezés vágásban, ragasztásban és kiegészítők felszerelésében
        - Folyamatos képzés a legújabb gyártástechnológiák elsajátítására
    - title: Fejlett gyártóberendezés
      items:
        - CNC vágóberendezés a szövet precíz vágásához minimális hibával
        - Nagy pontosságú hő-/hidegragasztás a légmentes, tartós varratokhoz
        - Professzionális légzárósági és szakítószilárdsági vizsgálóberendezés
    - title: Érett Menedzsment Rendszer
      items:
        - Szabványosított termelési folyamatok világos minőségi szabványokkal
        - A karcsú termelési filozófia, amely csökkenti a pazarlást és javítja a hatékonyságot
        - Hatékony ellátási lánc menedzsment megbízható beszállítói partnerségekkel
    - title: Szigorú minőségellenőrzés
      items:
        - tanúsított minőségirányítási rendszer
        - 'Többlépcsős ellenőrzés: alapanyag, folyamatban lévő, végső kimenő'
        - Szigorú légzárósági és tartóssági tesztelés szállítás előtt
global_ops_section:
  tagline: Globális Műveleti Architektúra
  title_html: Egy márka,<span class="text-white/90">két központ</span>
  description_html: 2026 szeptemberétől Aquafarer-t üzemelteti<strong class="text-white">Aquafarer Kft.</strong>(Új-Mexikó, USA) — a globális egység az értékesítés, a kereskedelmi B2B eladások, szerződések, számlázás és az értékesítés utáni szolgáltatások terén. A K+F, a gyártás és a minőségellenőrzés továbbra is a<strong class="text-white">Aquafarer Qingdaói Gyártóközpont</strong>, amely minden rendelést közvetlenül a gyárból szállít, FOB Csingtao. Az átmenet azt változtatta meg, hogy ki írja alá a szerződését — nem azt, hogy ki építi a hajóját.
  stats:
    - value: 2,400+
      label: A hajótesteket világszerte szállították
    - value: 50+
      label: Országok exportálták
    - value: 10+
      label: Gyártási évek
