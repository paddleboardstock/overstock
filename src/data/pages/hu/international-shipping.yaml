process_section:
  tagline: Hogyan működik a szállítás
  title: Raktárunktól az ajtóig
  steps:
    - title: Árajánlat a teherszállítási opciókkal
      description: Minden árajánlat részletesen felsorolja a célállomásod szállítási lehetőségeit — expressz és tengeri — becsült átmeneti időkkel együtt, így semmi sem dől el helyetted.
    - title: Minőségellenőrzés és csomagolás
      description: A deszkák 100%-ban nyomástesztet végeznek, majd szivattyúval, lapáttal, pórázsal, uszonysal, hátizsákkal és javítókészlettel vannak csomagolva — ugyanazzal a teljes csomaggal, amit forgalmazunk.
    - title: Üzenet Weihaiból
      description: A szállítmányod a választott szállítási módszerrel hagyja el logisztikai bázisunkat, és a házról házra követést ugyanazon a napon osztjuk meg Önnel.
    - title: Vámellenőrzés
      description: Biztosítjuk az importhoz szükséges kereskedelmi számlát és csomagolási listát. Az importár vámjai és adói az importőr felelőssége az Ön országában — lásd az alábbi vám részt.
    - title: Szállítás és ellenőrzés
      description: Ellenőrizze a szállítását érkezéskor. Ha bármi sérült vagy hiányzik, vegye fel velünk a kapcsolatot fotókkal és rendelési számával – lásd az alábbi elveszett és sérült kötvényünket.
customs_section:
  tagline: Vámok és vámok
  title: Vám- és importadók
  subtitle: A fuvarozási felelősségeket egyértelműen tartjuk, nem pedig homályos ígéreteket teszünk. Pontosan itt van a felelős miért.
  items:
    - title: Mit tárgyalunk
      description: Az Ön ajánlata tartalmazza a szállítási költséget a célállomásig, és mi készítjük és biztosítjuk az összes exportdokumentumot — kereskedelmi számlát, csomagolási listát és szállítmánykövetést.
    - title: Mit fed az importőr
      description: Az importári vámokat, ÁFA/GST-t és bármilyen célország-adót az importőr (Ön vagy vállalkozása) fizeti az Ön országának szabályai szerint. Nem csomagolunk homályos adóígéreteket a szállítmányozási ajánlatainkba.
    - title: Vámellenőrzési támogatás
      description: Papírmunkánk teljes és következetes — helyes HS kódok, bejelentett értékek és testületi előírások — ez teszi lehetővé a kizárás zökkenőmentességét. Ha a brókernek vagy a vámhivatalnak további dokumentációra van szüksége, mi biztosítjuk azt.
    - title: Ellenőrizd a helyi árakat rendelés előtt
      description: A felfújható vízisport-eszközök vámárai országonként eltérnek. Ellenőrizd országod importszabályait, vagy kérdezze meg a kérdésedben — regionális piaci útmutatóink tartalmazzák a vámjegyzeteket a kulcsfontosságú piacokról.
lost_damaged:
  title: Elveszett vagy sérült szállítmányok
  description: Vizsgáld meg a szállításodat, amikor megérkezik. Ritka esetben, ha egy tábla sérülten érkezik vagy egy csomag hiányzik, lépj velünk minél előbb a rendelési számlájával, valamint a csomagolásról és a lapról készült tiszta fotókkal együtt. Minden esetet külön-külön értékelünk — az esettől függően, ez alkatrészcserét, cserékártyát vagy visszatérítést jelent az érintett termékért. A gyártási hibákat külön fedezi a 2 éves SUP garancia.
destinations_section:
  tagline: Ahol szállítunk
  title: 50+ ország és a növekedés
  description: Világszerte szállítunk, részletes útmutatókkal a kulcsfontosságú regionális piacainkhoz. Minden piaci útmutató tartalmazza a helyi vásárlótípusokat, szállítási jegyzeteket és vámtippeket az adott régióra.
  regions_label: Regionális útmutatók
  countries_label: Országvezetők
faq_section:
  title: Szállítási GYIK
  items:
    - q: Mennyi ideig tart az expressz szállítás?
      a: Az expressz tranzit idő a célállomástól függ — minden kérdésnél megadjuk az országod becsült átjárási idejét, mielőtt bármit is elköteleznél.
    - q: Mennyi ideig tart a tengeri szállítás?
      a: A tengeri áruszállítás a célállomás kikötőjétől és a vitorlázási menetrendtől függően változik. A rendeléshez egy becsült időablakot adunk a célállomására, és a szállítás indulásakor követést kapsz.
    - q: Melyik szállítási módot válasszam?
      a: Expressz 1–3 fedélyre, mintákra vagy sürgős újratöltésre. Tengeri áruszállítás 5–20 fedélyes nagykereskedelmi megrendelésekre, ahol a fedélta-díj fontosabb, mint a sebesség. Mindkettőt árajánlatba hozzuk, hogy összehasonlíthassátok.
    - q: Benne vannak az importvámok és adók a szállítási költségben?
      a: Nem. A szállítmányozást külön árverik, az importvámok, az ÁFA/GST és a céladók az importőr felelőssége az Ön országának szabályai szerint. Teljes körű és pontos papírmunkát biztosítunk, hogy az áradás zökkenőmentes legyen.
    - q: Szállítanak az én országomba?
      a: 50+ országba szállítunk. Tekintse meg az alábbi regionális és országos útmutatóinkat, vagy egyszerűen kérdezze meg a kérdését — megerősítjük a jelenlegi szolgáltatást az Ön címére.
    - q: Nyomon követhetem a rendelésemet?
      a: Igen. Minden szállítmány – akár expressz vagy tengeren – házról házra követést is tartalmaz, amelyet a kiküldés napján megosztunk Önnel.
