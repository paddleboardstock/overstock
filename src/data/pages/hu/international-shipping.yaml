hero:
  tagline: Nemzetközi hajózás
  title: Nemzetközi hajózás —<br />Expressz és tengeri áruszállítás 50+ országba
  subtitle: Minden rendelés a kínai Weihai-i logisztikai bázisunkról szállít. Válassz expressz légi szállítást mintákhoz és sürgős feltöltésekhez, vagy konszolidált tengeri árut kisvállalati nagykereskedelmi megrendelésekhez.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Nemzetközi szállításra csomagolt deszkákat
direct_answer: Paddle Board Overstock több mint 50 országba szállít Weihaiból, Kínából. Az expressz légiszállítás 1–3 deszkót, mintarendeléseket és sürgős újratöltéseket szállít; a konszolidált tengeri szállítás gazdaságos opció 5–20 fedélzetes nagykereskedelmi megrendelésekhez. Minden szállítmány házról házra követést tartalmaz, és minden deszka 100%-ban nyomástesztet kap, és teljes kiegészítő készlettel csomagolja a szállítás előtt.
tldr_points:
  - 'Expressz légi szállítás: 1–3 fedélzet, minták, sürgős készletpótlás — a leggyorsabb opció'
  - 'Tengeri áruszállítás: 5–20 fedélzeti nagykereskedelmi megrendelés — a legalacsonyabb fedélyere jutó áruköltség'
  - Házról házra követés minden szállítmányról 50+ országba
  - A teherszállítás, biztosítás, vámellenőrzés és importvámok részletesen szerepelnek az ajánlatodban — nincs homályos, mindent beső ígéretek
from_china:
  tagline: Kínai szállítás
  title: Honnan érkeznek a parancsok
  description: Minden megrendelés Weihai-i logisztikai bázisunkról érkezik — amely termelési és raktározási tevékenységünk szíve. A Weihai egy jelentős tengerparti kikötőváros Shandong tartományban, közvetlen tengeri és légi szállítási kapcsolattal, ami versenyképessé teszi a tranzitidőt és a szállítási költségeket Ázsia, Amerikák, Afrika, Európa és Közel-Kelet célpontjai számára.
modes_section:
  tagline: Két lehetőség
  title: Expressz szállítás vagy tengeri áruszállítás
  subtitle: A megfelelő szállítási módszer attól függ, milyen gyorsan kell a táblák, és hányat rendelsz. Mindkét opciót minden kérdéshez felajánlják.
  express:
    name: A opció — Expressz szállítás
    best_for: Legjobb 1–3 táblához, mintákhoz és sürgős feltöltésekhez
    description: Az Air Express napok alatt eljuttatja a kis rendeléseket és a mintatáblákat az ajtódhoz, nem hetek alatt. Ideális, ha egy modellt tesztelsz nagyobb rendelés előtt, vagy egy bestsellert a szezon közepén újratöltesz.
    features:
      - 1–3 alap, egyedi modell vagy vegyes modellminták
      - A két lehetőség közül a leggyorsabb közlekedés — célpontonként árajánlat
      - Házról házra történő követés egy nagy gyorsgyorsszállítóval
      - 'Tipikus felhasználás: minták, sürgős készletfelvételek, kis első rendelések'
  sea:
    name: B opció — Tengeri áruszállítás
    best_for: Legjobb 5–20 deszkos nagykereskedelmi és kiskereskedelmi rendelésekhez
    description: A konszolidált tengeri szállítás a gazdaságos választás kisvállalkozások nagykereskedelmi megrendeléseihez. A táblákat egy egyesített szállítmányban csomagolják össze Weihai-tól, így a fedélzetenkénti szállítási költség alacsonyan marad.
    features:
      - 5–20 board kiskereskedelmi és nagykereskedelmi megrendelések
      - A két lehetőség közül a legalacsonyabb fedélzetenkénti szállítási költség
      - Konszolidált csomagolás — egy szállítmány, egy árvétel
      - 'Tipikus felhasználás: szezonális újrakészletek, vegyes modellű nagykereskedelmi megrendelések'
