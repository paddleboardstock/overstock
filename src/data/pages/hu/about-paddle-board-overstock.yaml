team_section:
  tagline: A csapat
  title: Az emberek a táblák mögött
  description: A weihai bázisunk otthont ad egy 14 főből álló kutatás-fejlesztési csapatnak, amely az anyagokra, a szerkezeti tervezésre és a gyártási folyamatokra fókuszál. Körülöttük működik a szélesebb csapat, amely a minőségellenőrzést, a készletkezelést, a logisztikát és az ügyféltámogatást végzi — ugyanazok az emberek, függetlenül attól, hogy egy vagy húsz kártyát vásárol.
