hero:
  tagline: Körülbelül
  title: A Paddle Board Overstockről
  subtitle: 2012 óta vadonatúj SUP felfújható deszkákat adunk 50 ország evezőihez és+ kiskereskedőihez — túlzott készlet, tisztességes árazás és egy olyan garanciával, amit valóban betartunk.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock vadonatúj SUP felfújható deszkák
direct_answer: Paddle Board Overstock egy vízi sportfelszerelés márka, amelyet 2012-ben alapítottak, és székhelye Weihai-ban, Kínában található. Új felfújható SUP deszkákat árulunk túlzott készletből — saját gyártóbázisunkból származó többlettermelésből és a partnergyárakból gondosan kiválasztott készletből — közvetlenül az evezősöknek és 50+ országban működő kis kiskereskedőknek. Minden deszka 100%-ban nyomás alatt tesztelve, 2 éves SUP garanciával rendelkezik, és expressz vagy tengeri szállítással szállítjuk.
tldr_points:
  - 2012-ben alapították, Weihai-ban, Kínában működnek — a világ egyik kulcsfontosságú SUP gyártási központja
  - 'Túlzott készlet modell: vadonatúj táblák a kiskereskedelmi ár alatt, közvetítők nélkül'
  - 'A készlet vegyes forrásból áll: a bázisunkból származó többlettermelés plusz átvizsgált partnergyári készlet'
  - 50+ országban szolgált, 99,3% végső ellenőrzési átmenési arány, 2 éves SUP garancia
story_section:
  tagline: A mi történetünk
  title: Miért adunk el túlkészletet
  paragraphs:
    - Paddle Board Overstock 2012-ben kezdődött Weihaiban, Kínában — egy tengerparti városban Shandong tartományban, amely a világ egyik legfontosabb felfújható SUP gyártóközpontjává nőtte ki magát. Ebből az alapból több mint egy évtizedet töltöttünk felfújható lapozódeszkák készítésével és világszerte szállításával.
    - Along the way we noticed something that shapes everything we do today: Minden gyártási szezon vadonatúj, tökéletes táblákat hagy maga után — felesleges példányokat, törölt rendeléseket, tavalyi színeket. Eközben a világ független kiskereskedői kizárták a nagykereskedelmi forgalmat, mert a hagyományos beszállítók konténerméretű rendeléseket követeltek.
    - Ez a hiány a mi üzletünk. Ha eladjuk a túlkészletet — a saját Weihai bázisunkból származó többlettermelést, valamint gondosan kiválasztott készletet a partnergyáraktól — vadonatúj deszkákat kínálhatunk jóval a szokásos kiskereskedelmi érték alatt, olyan mennyiségben, amelyek megfelelnek egyetlen evezős vagy öttáblás bolti rendelésnek. Semmi sem másodkéz, semmi sem második; egyszerűen csak egy készlet érdemli meg egy vásárlót, nem pedig raktárt.
model_section:
  tagline: Üzleti modellünk
  title: Hogyan működik a túlkészlet modell
  items:
    - title: Vadonatúj, sosem használt
      description: Minden eladott deszka vadonatúj és használatlan. A túlkészlet felesleges és felesleges készletet jelent — nem visszaküldést, nem felújítottat, nem másodszámot.
    - title: Vegyes forrású készlet
      description: Készletünk a saját Weihai gyártóbázisunkból származó többlettermelést kombinálja a partnergyárakból kiválasztott készletekkel, amelyeket ugyanabban a minőségi sávban tartunk. A források vegyesek; a szabványok nem.
    - title: Kiskereskedelmi ár alatti ár
      description: A túlzott készlet beszerzése olóbbba kerül, így neked is kevesebbbe kerül a vásárlás. Nincs felfújt listaár, nincs hamis kedvezmény — csak őszinte árazás a valódi készleten.
    - title: Kisvállalkozásoknak barát nagykereskedelmi üzlet
      description: A nagykereskedelem 5 deszkoládával kezdődik, nem konténerrakományként. A kiskereskedők bármelyik készleten lévő modellt egy rendelésben összekeverhetnek, és gyors- vagy tengeri szállítást választhatnak.
    - title: Közvetlen szállítás
      description: A rendelések közvetlenül a Weihai logisztikai bázisunkból érkeznek az ajtódhoz 50+ országban — expressen mintákra és kisebb rendelésekre, konszolidált tengeri áruszállítás nagykereskedelemre.
quality_section:
  tagline: Minőség és garancia
  title: Minden tábla mögötti minőség
  subtitle: A túlzott készletárazás soha nem jelent lazzat szabványokat. Minden tábla – bármi is legyen a forrása – ugyanazon a folyamaton megy keresztül, mielőtt elküldik.
  items:
    - title: 100% nyomáson tesztelt
      description: Minden egyes deszkát felpumpálnak és 15 PSI nyomáson tesztelnek az elküldés előtt. Egyetlen deszka sem kerül tesztelés nélkül kiszállításra, függetlenül attól, hogy honnan származik a készlete.
    - title: Túlterhelés tesztelve 1,25-szörösre
      description: A termelési sorozatainkból származó táblákat a névleges nyomáson túl mintatesztnek vetjük alá — 1,25-szörös üzemi nyomáson tartjuk 24–48 órán át, hogy ellenőrizzük a varratokat, a szelepeket és a drop-stitch kivitelezést.
    - title: 99,3%-os végső ellenőrzési átmeneti arány
      description: A végső ellenőrzési folyamatunk során a panelek 99,3%-a hibamentesként kerül át — és az a kis rész, amelyik nem felel meg, soha nem kerül a túlzott készletbe.
    - title: 2 éves SUP garancia
      description: Minden SUP tábla 2 éves SUP garanciával rendelkezik, amely a gyártási hibákra terjed ki. Ugyanez a garancia vonatkozik minden ügyfelünkre mindenik 50+ piacunkon.
