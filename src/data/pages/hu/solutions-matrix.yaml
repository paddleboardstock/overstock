hero:
  tagline: Ipari megoldások mátrix
  title: Forgatókönyv-alapú tengeri megoldások<br />Szakmai műveletek miatt
  subtitle: Kifejezetten felfújható vízi járművek, amelyeket RIBs mentő, bérelő flotta, jacht-tender és kereskedelmi horgászat alkalmazásokra konfiguráltak — mindkettőt technikai specifikációk és testreszabási lehetőségek támogatják.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer Professzionális tengeri megoldások különböző iparágak számára
direct_answer: 'Aquafarer Szcenáriózus által tervezett felfújható vízi járműveket és RIB megoldásokat nyújt kereskedelmi tengeri műveletekhez: mentő- és járőrhajók Hypalon megerősített csövekkel és többkamrás biztonsággal, bérelhető SUPs flották és kajakok 1,2 PVC mm-es és forró levegő hegesztett varratokkal az alacsony karbantartási tartósság érdekében, luxus jacht-tenderek mély V alumínium RIBstörzstel, valamint nehézteherbírás horgászhajók bottartókkal és élőkút rendszerekkel.'
solution_a:
  tagline: Megoldás A
  title: Tengeri mentés és<br />Kereskedelmi járőrség
  subtitle: Nagy sebességű, többkamrás biztonsági RIBs rendszer professzionális vészhelyzeti reagálás és rendvédelmi műveletek számára.
  badge: Heavy-Duty Series
  description: Tengeri mentő- és járőrszolgálatunk RIBs megerősített, nagy Hypalonsűrűségű /PVC légcsövekkel van felszerelve, többkamrás, független levonzási kialakítással. Minden hajó professzionális minőségű tükrözőszalaggal, mentőkapaszkodó kötélekkel és gyors felfújható szelepekkel van felszerelve a kivetési készenléthez. A mély V üvegszálas hajótestek kivételes stabilitást biztosítanak nagy sebességen és viharos tengeri körülmények között.
  features:
    - title: Többrekeszes biztonság
      description: 4–6 független légkamra — bármely egykamrú dúr pozitív lebegést biztosít
    - title: Megerősített csőszövet
      description: 1,2 Hypalon CSM mm vagy 1 680 DTEX PVC kétrétegű, forró levegős hegesztett varrásokkal
    - title: Professzionális osztály
      description: SOLAS Tükröző szalag, mentőkapaszkodó zsinór, vontató csat, gyorskioldó festőzsinór
    - title: Nagy sebességű hajótest
      description: Mély V üvegszálas vagy alumínium hajótest 25–45 csomós sebességre van besítve a konfigurációtól függően
  recommended_models:
    - RIB 450-es járőr
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Hajótest anyaga
      value: Üvegszál / tengerészgyalogos alumínium
    - label: Csőszövet
      value: 1,2 mm Hypalon CSM / 1 680 DTEX PVC
    - label: Maximális sebesség
      value: 25–45 csomó
    - label: Kapacitás
      value: 6–12 fő
    - label: Motor Tartomány
      value: 40–200 HP
    - label: Tanúsítvány
      value: CE / ISO 9001
solution_b:
  tagline: Megoldás B
  title: Vízi Sportok Bérlése &<br />Üdülőhelyi Hajóflotta Felszerelés
  subtitle: Ultratartós, alacsony karbantartású felfújható SUPs, kajakok és hajók, amelyek napi bérlésre készültek üdülőhelyeken, klubokban és túraműveletekben.
  badge: Rental-Grade
  description: Bérlési flottánk felszerelését a legnagyobb tartósság és legalacsonyabb karbantartási költség érdekében terveztük. 1,2 mm-es megerősített PVC-at használunk hármas rétegű forrólevegős hegesztett varrattal, ami ellenáll a UV romlásának és a gyakori ütközési károknak. A Drop-stitch kialakítás biztosítja, hogy a deszkák merevségüket megtartsák még több száz bérlési ciklus után is. Minden modell megerősített D-gyűrűkkel, kopásálló oldalpántokkal és kereskedelmi minőségű szelepekkel rendelkezik.
  features:
    - title: Kereskedelmi Minőségű PVC
      description: 1,2 mm-es megerősített PVC UV stabilizátorokkal — háromszor vastagabb, mint a fogyasztói minőségű anyagok
    - title: Forrólevegős Hegesztett Varratok
      description: Hármas rétegű fúziós hegesztés — erősebb, mint a ragasztott kötés, ellenáll a rétegelválásnak
    - title: Drop-Stitch Merevség
      description: 1,680 DTEX mag 2 szál / négyzethüvelyk — 20 PSI-ig értékelve, hasonlóan kemény deszka merevségéhez
    - title: Flottára Kész Kialakítás
      description: Megerősített D-gyűrűk, kereskedelmi Halkey-Roberts szelepek, kopásálló oldalpántok
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Cső anyaga
      value: 1,0–1,2 mm-es megerősített PVC
    - label: Varrat Technológia
      value: Hármas rétegű forrólevegős hegesztés
    - label: Maximális Nyomás
      value: 15–20 PSI (drop-stitch modellek)
    - label: UV-állóság
      value: 1,000+ órás gyorsított teszt
    - label: Garancia
      value: 2–5 év a modelltől függően
    - label: Karbantartás
      value: Minimális — öblítse le és tárolja
solution_c:
  tagline: C megoldás
  title: Jacht kishajók &<br />Luxus vízi járművek
  subtitle: Könnyű, nagy teljesítményű RIB kishajók, amelyeket szuperjachttároláshoz és vendégszállításhoz terveztek, luxus kivitelben.
  badge: Premium Series
  description: Jacht kishajóink RIBs ötvözik a könnyű szerkezetet a luxus esztétikával. Mély-V alumínium vagy üvegszálas hajók kivételes utazási élményt és könnyű daruzási lehetőséget biztosítanak. Elérhetők színben illeszkedő csőgrafikával, prémium kárpitozással és egyedi konzol elrendezéssel. Kompakt tárolási méreteik ideálissá teszik őket szuperjacht garázsokban és fedélzeti tárolásra.
  features:
    - title: Könnyű szerkezet
      description: Hajóipari alumíniumtestek 30%-kal csökkentik a súlyt az üvegszálhoz képest, így könnyű emelhetőséget biztosítanak
    - title: Mély-V teljesítmény
      description: 18–22 fokos hajófenék-süllyedés sima utazásért dobálódzó vízen és kiváló kezelhetőségért
    - title: Luxus kivitel
      description: Egyedi kárpitozás, színben illeszkedő csövek, prémium kormánykonzol, rozsdamentes csomag
    - title: Kompakt tárolás
      description: Szuperjacht garázsokhoz tervezve — felfújható csövek a kompakt tároláshoz
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Hajótest típus
      value: Mély-V alumínium / üvegszál
    - label: Hajófenék süllyedés
      value: 18–22 fok
    - label: Maximális sebesség
      value: 30–40 csomó
    - label: Saját tömeg
      value: 120–350 kg (alumínium test)
    - label: Daruval emelésre előkészítve
      value: Igen — emelési pontok szabványosak
    - label: Tárolás
      value: Felfújható csövek, egymásra rakhatók
