hero:
  tagline: Minőségellenőrző Laboratórium
  title: Tesztlaboratórium & Minőségbiztosítás
  subtitle: Független minőségellenőrző laboratórium — minden egység tesztelve a kiszállítás előtt
intro: Paddle Board Overstock egy dedikált minőségellenőrző laboratóriumot működtet, amely független a gyártástól. Minden nyersanyag- és késztermék-sorozat dokumentált ellenőrzési protokollokon megy keresztül a kiadás előtt. Minőségellenőrzési csapatunk közvetlenül a vezetőségnek jelent, biztosítva az elfogulatlan minőségi döntéseket.
highlights:
  - value: 100%
    label: Egységek nyomáspróbája
    detail: Minden kamra, minden deszka
  - value: 48 h
    label: Légtartó képesség teszt hossza
    detail: 1,25× névleges nyomáson
  - value: <5%
    label: Maximálisan megengedett nyomáscsökkenés
    detail: 24 órás tartás alatt
  - value: 99.3%
    label: Hibámentes sebesség
    detail: Az elmúlt 12 hónap szállításai
test_procedures:
  - title: Nyersanyag-ellenőrzés
    description: Minden beérkező PVC, drop-stitch szövet-, EVA hab- és hardver-sorozatot tesztelnek az átvétel előtt. Ellenőrzik a szakítószilárdságot, a szakítószilárdságot és a UV ellenállást. A nem megfelelő anyagokat karanténba helyezik és visszaküldik.
    standards:
      - Szakítószilárdság (min. 350 N/cm)
      - Szakadásállóság
      - UV ellenállás (1 000 óra)
  - title: Folyamatközi QC Ellenőrzési Pontok
    description: A termelési operátorok minden szakaszban önellenőrzést végeznek. A QC auditorok véletlenszerű mintavételt végeznek a műszak során. A hegesztett illesztések leválasztási tesztjét 50 egységenként végzik. Méretellenőrzés minden 20. panel esetén történik.
    standards:
      - Elválasztási teszt minden 50. egységnél
      - Belső 100-pontos ellenőrzőlista
      - Véletlenszerű mintavételes ellenőrzés
  - title: 48 órás légtartási teszt
    description: Minden csőkamrát 125%-os névleges nyomásra felfújnak és 48 órán át tartanak. A nyomásérzékelők folyamatosan logolnak hőmérséklet-kompenzációval. Bármely kamra, amely 5%-nál nagyobb nyomáscsökkenést mutat, automatikus tétel újbóli ellenőrzést vált ki.
    standards:
      - 1,25× névleges nyomás megtartása
      - '&lt;5% maximális nyomáscsökkenés'
  - title: Terhelés- és egyensúlyvizsgálat
    description: A kész deszkákat a maximális névleges kapacitás mellett tesztelik a stabilitás, a szabad rész és a kezelhetőség szempontjából. Minden deszkát víztesztelésnek vetnek alá a végső ellenőrzési jóváhagyás előtt.
    standards:
      - 1,25× névleges terhelés ellenőrzés
      - Vízmintázás
equipment:
  - name: Univerzális vizsgáló gép (húzó)
    spec: 5 kN kapacitás
  - name: Nyomáscsökkenés-tesztelő
    spec: Többcsatornás, 0–50 psi, adatnaplózás
  - name: UV Időjárásállósági kamra
    spec: UVA-340, 1,000 órás ciklusok
  - name: Vastagságmérő (digitális)
    spec: 0,01 mm felbontás
  - name: Húzópróba készülék (hegesztés)
    spec: Motoros, 50 N kapacitás
  - name: Hőmérsékletkamra
    spec: -40 °C-tól +100 °C-ig
  - name: Szivárgásérzékelő tartály
    spec: 6 m × 2 m, világított
tldr:
  summary: 'Az Paddle Board Overstock minőségi laboratórium függetlenül működik a termeléstől, húzási, hántolási, UV és nyomáspróbákat végez dokumentált belső protokollok szerint. Az egységek 100%-a 1,25-szörös névleges nyomáson történő nyomáspróbán megy keresztül. Hibamentes arány: 99,3% az elmúlt 12 hónap szállításaiban.'
  points:
    - Független laboratórium a torzítatlan minőségellenőrzés érdekében a termeléstől elkülönítve
    - 100%-os nyomáspróba egységenként 1,25-szörös névleges nyomáson, 24-48 órás tartással
    - Minden vizsgálatot dokumentált belső protokollok szabályoznak
    - A múlt 12 hónap szállításaiban 99,3%-os hibamentességi arány
    - Minden egységet 6 lépcsős minőségellenőrzésnek vetnek alá a szállítás előtt
