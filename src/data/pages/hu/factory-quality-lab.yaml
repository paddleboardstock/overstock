hero:
  tagline: Quality Control Laboratory
  title: Testing Laboratory & Quality Assurance
  subtitle: Independent quality lab — every unit tested before shipment
intro: Paddle Board Overstock operates a dedicated quality control laboratory that operates independently from production. Every batch of raw material and every finished board passes through documented inspection protocols before release. Our QC team reports directly to management, ensuring impartial quality decisions.
highlights:
  - value: 100%
    label: Units pressure-tested
    detail: Every chamber, every board
  - value: 48 h
    label: Air retention test duration
    detail: At 1.25× rated pressure
  - value: "&lt;5%"
    label: Max allowed pressure drop
    detail: Over 24-hour hold period
  - value: 99.3%
    label: Defect-free rate
    detail: Trailing 12-month shipments
test_procedures:
  - title: Raw Material Inspection
    description: Every incoming batch of PVC, drop-stitch fabric, EVA foam, and hardware is tested before acceptance. Tensile strength, tear resistance, and UV resistance are verified. Non-conforming materials are quarantined and returned.
    standards:
      - Tensile strength (350 N/cm min)
      - Tear resistance
      - UV resistance (1,000 h)
  - title: In-Process QC Checkpoints
    description: Production operators perform self-inspection at each stage. QC auditors conduct random sampling throughout the shift. Weld peel tests are performed every 50 units. Dimensional checks happen every 20th panel.
    standards:
      - Peel test every 50 units
      - Internal 100-point checklist
      - Random sampling audits
  - title: 48-Hour Air Retention Test
    description: Every tube chamber is inflated to 125% of rated pressure and held for 48 hours. Pressure sensors log continuously with temperature compensation. Any chamber exceeding 5% pressure drop triggers automatic batch re-inspection.
    standards:
      - 1.25x rated pressure hold
      - <5% max pressure drop
  - title: Load & Balance Testing
    description: Completed boards are tested at maximum rated capacity for stability, freeboard, and handling. Each board undergoes water testing before final inspection approval.
    standards:
      - 1.25x rated load verification
      - Water testing
equipment:
  - name: Universal Testing Machine (tensile)
