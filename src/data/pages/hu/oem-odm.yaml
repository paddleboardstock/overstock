process_steps:
  title: 6 lépéses OEM/ODM folyamat
  subtitle: A tervezési összefoglalótól FOB Qingdaóig — egy áramvonalas munkafolyamat
  steps:
    - number: '01'
      title: Tervezési összefoglaló és 3D CAD modellezés
      description: Ossza meg célzott specifikációit, referencia termékét vagy koncepcióját. Mérnöki csapatunk részletes CAD rajzokat és 3D látványterveket készít jóváhagyásra.
      timeline: 3–5 nap
    - number: '02'
      title: Anyagválasztás és szövettesztelés
      description: Válasszon katonai minőségű PVC (0,9–1,2 mm), Hypalon CSM, vagy drop-stitch mag anyagokat. Elvégezzük a szakítószilárdsági, bevonat tapadás és UV stabilitási teszteket.
      timeline: 2–3 nap
    - number: '03'
      title: Gyors prototípus készítés és minta gyártás
      description: CNC-gépparkkal készítünk egyedi formákat és előgyártási mintákat a márkájának színeivel, logójával és meghatározott anyagaival. A minták jóváhagyásra kerülnek kiszállításra.
      timeline: 7–14 nap
    - number: '04'
      title: 24–48 órás nagy nyomással tartási teszt
      description: Minden prototípust alapos nyomásmegőrzési tesztnek vetünk alá 1,25-szörös névleges nyomáson. Varratválás teszteket és méretellenőrzést végzünk.
      timeline: 1–2 nap
    - number: '05'
      title: CE/ISO Minőség-ellenőrzés és csomagolás
      description: 100 pontos minőségellenőrző lista. Minden egységet ellenőriznek, mielőtt kiskereskedelmi csomagolásra kerülne. CE megfelelőségi nyilatkozat és BSCI megfelelőségi jelentés mellékelve.
      timeline: 2–3 nap
    - number: '06'
      title: FOB Qingdao Szállítás és Logisztika
      description: A késztermékeket raklapokra helyezik, zsugorfóliázzák és konténerbe rakodják a qingdaoi kikötőben. Teljes export dokumentáció, vámkezelés és valós idejű nyomon követés.
      timeline: 7–14 nap
