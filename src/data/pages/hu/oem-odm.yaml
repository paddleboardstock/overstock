faq:
  title: OEM/ODM — GYIK
  questions:
    - q: Mi a minimum rendelési mennyiség (MOQ) egyedi felfújható SUPs esetén?
      a: Szabványos modellek meglévő formákkal kezdve MOQ 5–10 egységből indul egy tervben. Teljesen egyedi formák és szerszámok MOQ esetén általában 200+ egység. Startupokkal és feltörekvő márkákkal dolgozunk együtt, hogy megvalósítható belépési pontokat találjunk.
    - q: Mi MOQ a lehetőség RIB az egyedi hajókra?
      a: RIB A modellek 2–5 egységből kezdődnek meglévő formákkal, míg a teljesen egyedi RIB formák nagyobb elkötelezettségeket igényelnek. Startupokkal és már beismert márkákkal dolgozunk együtt, hogy megvalósítható belépési pontokat találjunk.
    - q: Mennyi OEM ideig tart a mintavételi folyamat?
      a: A szabványos prototípus mintákat a tervezési jóváhagyás után 7–14 munkanapon belül elkészítik. A gyorsrendelések 5–7 napra is előtérbe kerülhetnek további díj ellenében.
    - q: Mi a különbség a PVC Hypalon felfújható csónakok között és között?
      a: PVC könnyebb, megfizethetőbb, és kiváló rugalmasságot biztosít hideg időjárás ellen.Hypalon (CSM) kiváló UV és ózonellenálló képességeket biztosít, hosszabb élettartammal (10–15 év, vs. 5–8 év). PVC Ajánljuk a legtöbb szabadidős célra, valamint Hypalon kereskedelmi/professzionális használatra.
    - q: Személyre tudod szabni a felfújható formáját és dizájnját?
      a: Igen. Kutatás-fejlesztési csapatunk egyedi formákat tud fejleszteni bármilyen hajótestformához, deszka körvonalhoz vagy csőkonfigurációhoz. A CNCprecizitás és következetesség érdekében -megmunkált alumínium formákat használunk.
    - q: Gyári audit szolgáltatásokat nyújtasz?
      a: Szívesen látjuk a helyszíni és harmadik féltől származó gyári auditokat 12 000 m²-es Qingdao létesítményünkben. Fenntartjuk ISO a 9001-es telefonszámot és BSCI a tanúsítványokat, valamint megoszthatjuk az NDAauditjelentéseket.
    - q: Milyen szállítási feltételeket kínáltok?
      a: FOB Kínálunk Qingdao (szabványos) CIFés DDP szállítási feltételeket. Minden rendeléshez konténerrakodás és teljes exportdokumentáció szerepel OEM .
