        - Egyedi 3D forma mérnökség saját fejlesztésű tervekhez
        - CE 2013/53/EU, UKCAUSCG , megfelelőségi dokumentáció
        - BSCI Társadalmi auditjelentések a kiskereskedők megfelelőségéről
        - Dedikált fiókkezelés + prioritásos gyártási időpontok
    - title: DTC és e-kereskedelmi márkák
      subtitle: Kiskereskedelmi kész csomagolás nagy tételben
      description: Online első márkák, amelyek Amazonon, Shopify-on vagy saját webáruházukon keresztül értékesítenek. A csomagolás, a kibontási élmény és az egységminőség következetessége kritikus. Szüksége van egy olyan gyárra, amely érti az e-kereskedelem sebesség- és visszaküldési arányának dinamikáját.
      features:
        - Kiskereskedelmi kész doboz tervezés + betétkártya nyomtatás
        - Vákuumcsomagolás / raklapozás költséghatékony szállításhoz
        - EAN / UPC vonalkód és vámra kész dokumentáció
        - Vegyes konténer konszolidáció a leszállított költség optimalizálására
    - title: Bérleti és vendéglátói szolgáltatók
      subtitle: Flotta-minőségű kivitelezés üdülőknek és bérleti vállalkozásoknak
      description: Az üdülők, vízisport központok és bérleti szolgáltatók tartós, szervizelhető flottákat igényelnek következetes márkajelzéssel. Flotta árazást, vegyes modellkonténereket és pótalkatrész-támogatást biztosítunk évekig tartó működéshez.
