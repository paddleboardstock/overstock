  title: OEM / Private Label gyártás<br />Ügyféltípus szerint
  subtitle: A különböző márkaprofiloknak eltérő igényeik vannak — szolgáltatásainkat az Ön OEMODM üzleti modelljéhez, méretéhez és piacra lépési stratégiájához igazítjuk.
  items:
    - title: Startup vízi járművek márkák
      subtitle: AlacsonyMOQ, gyors felhajtás
      description: Vállalkozók és alapítók indítják el első RIB SUPshajósorozatukat, vagyis felfújható csónakjaikat. Olyan gyártópartnerre van szükséged, aki a márkádat sajátjának tekinti — alacsony belépési küszöbértékekkel, rugalmas adagméretekkel, és minden lépésnél kézzel a tervezési útmutatással.
      features:
        - MOQ akár 2–5 egység (RIB) / 5–10 egység SUP(SKU)
        - Meglévő penészkönyvtár a szerszámozási költségek elkerüléséhez
        - 'Teljes márkacsomag: logó, csőgrafika, csomagolás, felakasztó címkék'
        - Minta-első munkafolyamat — jóváhagyás a gyártás előtt
    - title: Megalapozott tengeri márkák
      subtitle: OEM CESkálázázd /ISO megfelelés
      description: Meglévő hajó-, PWC- vagy tengeri kiegészítő márkák felfújható vízi járműveket adnak portfóliójukba. Következetes minőségre van szükség a gyártási sorozatok között, szabályozási megfelelésre a globális piacokon, valamint a testreszabott hajótestek vagy csőformák társmérnöki képességére.
