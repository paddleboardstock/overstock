hero:
  tagline: A mi történetünk
  title: Paddle Board Overstock — Mérnöki Szabadság a Vizen
  subtitle: 'Egy part menti műhelytől egy globális tengeri gyártóig — utunkba egy makacs hitre épül: az eveződeszkákat úgy kell megtervezni, mintha számítanának, mert valóban számítanának.'
  image:
