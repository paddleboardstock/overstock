timeline:
  - year: '2012'
    title: Tengeri Gyártási Alapítvány
    body: A Paddle Board Overstock cég egy speciális felfújható lapozóasztalként indult Weihaiban, Kínában, amely elkötelezett a tengeri kézművesség és a deszkagyártás iránt. A kezdeti fókusz a megbízható felfújható termékek fejlesztése volt gyakorlati mérnöki tapasztalat és gyártási fegyelem révén.
  - year: '2015'
    title: Első exportok
    body: Az első exportmegrendelések eljutottak Japánba és Koreába, ami Paddle Board Overstock a nemzetközi piacokra való belépést jelentette. A vállalat Kínán kívül is evezőseket és vízi sportrajongókat kezdett kiszolgálni.
  - year: '2018'
    title: Gyárbővítés
    body: Egy 12 000 m²-es gyártóüzembe költöztették. RF hegesztővonalak és drop-stitch gyártási kapacitás bővített, lehetővé téve a nagyobb gyártást és a minőségellenőrzési rendszerek fejlesztését.
  - year: '2020'
    title: Kutatás-fejlesztési központ létrehozása
    body: Dedikált Kutatás-Fejlesztési központot nyitottunk PVC textillaborral, hidrodinamikai teszttartálysal és CAD/FEA szimulációs stúdióval. A termékfejlesztés kiterjedt a könnyű szerkezetre, a jobb tartósságra és a felhasználóközpontú tervezésre.
  - year: '2022'
    title: Globális növekedés
    body: 14 kutatási és fejlesztési mérnökre és 200+ dolgozóra bővültek. A deszkák eljutottak evezősökhöz Európa, Amerika és Ázsiai-Csendes-óceáni térségben, 50+ országba szállítva.
  - year: '2024'
    title: Innováció és Tervezés Stúdió
    body: Teljes körű tervezési és innovációs stúdiót indítottunk új deszkelapsorozatokhoz, a koncepciótól a gyártásig. Bővítettük jellegzetes művészeti sorozat pakliainkat és turnézó platformjainkat.
  - year: '2026'
    title: A vízkutatás jövőjének építése
    body: Ma Paddle Board Overstock is folyamatosan SUP fejleszti a felfújható deszkákat, evezőeszközöket és testreszabott tengeri megoldásokat — összekötve az embereket és szervezeteket a világ vizeivel. 50+ ország szolgált szolgálatot, évente 15 000 egység kapacitással.
content_founding:
  tagline: A kezdet
  title: A Waterparton született
  subtitle: 'Paddle Board Overstock egy tengerparti műhelyben kezdtem Weihaiban, egy deszkával és egy vízióval: felfújható lapátdeszkákat építeni, amelyek képesek kezelni a valódi tengeri körülményeket.'
  paragraphs:
    - 2012-ben alapítóink piaci rést láttak — a legtöbb felfújható deszkák vagy megfizethető, de megbízhatatlan, vagy magas minőségű, de megfizethetetlenül drága volt. Úgy vélték, van hely egy olyan gyártónak, amely egyszerre nyújt minőséget és értéket.
    - Az első hajótestet kézzel építették, helyi vizeken tesztelték, és a halászok és kis kereskedelmi üzemeltetők valódi visszajelzései alapján finomították. Ez a visszacsatolási kör — építés, tesztelés, hallgatás, fejlesztés — ma is mérnöki filozófiánk középpontjában áll.
    - 2015-re a hír túljutott Weihai-n. Ázsiai evezősök és vízisportboltok elkezdték kérni a táblákat. Ami helyi műhelyként indult, az globális márkává vált.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock korai gyártóműhely és gyártás
content_growth:
  tagline: Növekedés és innováció
  title: Műhelytől 12 000 m²-es létesítményig
  subtitle: A folyamatos befektetés az emberekbe, a berendezésekbe és a folyamatokba Paddle Board Overstock-t modern tengeri gyártóüzemmé alakította.
  paragraphs:
    - Ahogy nőtt a kereslet, úgy nőtt a létesítményünk is. Egy kis műhelyből egy 12 000 m²-es gyárká bővültünk, ahol deszkák SUP , kiegészítők és biztonsági felszerelések gyártási vonalai voltak.
    - CNC Vágógépekbe, nagyfrekvenciás hegesztőgépekbe, drop stitch gyártósorokba és átfogó tesztgépekbe fektettünk be — lehetővé téve, hogy a gyártás minőségének minden aspektusát ellenőrizzük.
    - Ma 200-300 fős csapatunk tengeri mérnökökből, anyagtudósokból, minőségellenőrzési szakemberekből és képzett kézművesekből áll — sokan közülük Paddle Board Overstock-nál vannak a kezdetektől fogva.
founder:
  tagline: Ismerd meg az alapítót
  title: Egy vízész által épített
  subtitle: A társalapító, David Chen ötvözi a gyártási szakértelmet és az élethosszig tartó szenvedélyt a vízi sportok iránt — ez a kombináció határozza meg, hogyan közelíti meg a Paddle Board Overstock a termékfejlesztést.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — a Paddle Board Overstock alapítója
  story:
    - David Chen Weihai partvidékén nőtt fel, ahol a tenger nem nyaralási hely volt, hanem életmód. Fiatalkorát evezéssel, vitorlázással és horgászattal töltötte a Sárga-tengeren — ezek az élmények intuitív megértést adtak számára arról, mit kell elviselniük a lapátdeszkáknak.
    - Alapítása előtt David Paddle Board Overstock egy évtizedet töltött tengeri gyártásban, ahol a termelés, minőség és nemzetközi kereskedelem területén dolgozott. Termelési és minőségi programokat vezetett európai és észak-amerikai piacokon, első kézből tanulva meg a globális evezők elvárásait.
    - '2012-ben Paddle Board Overstock alapította egy egyszerű küldetéssel: felfújható lapátdeszkákat építsen, amelyeket a saját családjával bízna meg a vízen. Ez a személyes szabvány — használnám ezt? — továbbra is a végső teszt minden termékhez, amely elhagyja a gyárat.'
    - Ma David a termékstratégiát vezeti és felügyeli a K+F csapatot, személyesen vizsgálva az új terveket és tesztelve a prototípusokat a weihai partjainál. Úgy véli, hogy a nagyszerű termékek abból születnek, ha megértjük mind a mérnöki munkát, mind a felhasználói élményt.
philosophy:
  tagline: Márkafilozófia
  title: Mérnöki szabadság a vízen
  body: A vízi szabadság nem csupán a mozgásról szól. Ez új helyek felfedezését, szabadtéri élmények létrehozását, az emberek természettel való összekapcsolását és szakmai missziók lehetővé tételét jelenti. A mérnöki munka teszi lehetővé ezt a szabadságot.
  pillars:
    - title: Elsőként megbízhatóság
      body: A vízi környezetek bizalmat igényelnek. Paddle Board Overstock termékei a stabilitás, tartósság, biztonság és következetes teljesítmény köré vannak tervezve.
    - title: Emberközpontú tervezés
      body: A termékeknek az embereket kell szolgálniuk, nem pedig a technológiát. Minden tervezési döntés azzal kezdődik, hogy megértjük, hogyan használják az emberek a boardjukat, hol fedeznek fel, és milyen kihívásokkal szembesülnek.
    - title: Elérhető felfedezés
      body: A víznek nemcsak a szakértőkhöz kell tartoznia. Paddle Board Overstock olyan felszerelést készít, amely lehetővé teszi több ember számára a folyók, tavak, óceánok és tengerparti környezetek biztonságos megtapasztalását.
    - title: Folyamatos innováció
      body: Az innováció nemcsak új termékek létrehozását jelenti. Minden részletet javít — anyagokat, szerkezeteket, gyártást és felhasználói élményt.
engineeringDna:
  tagline: Mérnöki DNS
  title: Hogyan készít Paddle Board Overstock termékeket
  areas:
    - title: Anyagtudomány
      body: Paddle Board Overstock a különböző tengeri környezetekhez megfelelő anyagok kiválasztására összpontosít. A legfontosabb szempontok közé tartozik a kopásállóság, a UV ellenállás, a nyomásállóság és a hosszú távú tartósság.
      items:
        - Kopásállóság
        - UV-állóság
        - Nyomásstabilitás
        - Hosszú távú tartósság
    - title: Szerkezetmérnöki munka
      body: A felfújható SUP-ok pontos egyensúlyt igényelnek a merevség, a súly, a hordozhatóság és a stabilitás között. Paddle Board Overstock mérnöki munkája a drop-stitch alaptechnológia és a fejlett varráskialakítás révén optimalizálja ezeket a tényezőket.
      items:
        - Merevség
        - Súlyoptimalizálás
        - Hordozhatóság
        - Stabilitás
    - title: Gyártási precizitás
      body: 'Minden termék ellenőrzött folyamatokon megy keresztül: anyagelőkészítés, precíz vágás, hegesztés és ragasztás, összeszerelés, minőségellenőrzés és teljesítményellenőrzés.'
      items:
        - Anyagelőkészítés
        - Precíz vágás
        - Hegesztés és ragasztás
        - Összeszerelés és minőségellenőrzés
    - title: Felhasználói forgatókönyv mérnöki munka
      body: A termékeket valós evezős alkalmazások köré fejlesztik — szabadidő, kaland, család és túrázás — biztosítva, hogy minden kialakítás megfeleljen a tervezett környezet konkrét igényeinek.
      items:
        - Szabadidő
        - Kaland
        - Család
        - Turné
