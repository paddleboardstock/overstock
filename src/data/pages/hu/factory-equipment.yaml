hero:
  tagline: Felszerelések
  title: Gyártási Berendezések és Gépészet
  subtitle: Ipari szintű berendezések vágáshoz, hegesztéshez, nyomtatáshoz és összeszereléshez
  back_label: Vissza a gyárhoz
  back_link: /factory
categories:
  - title: Vágás és Anyagelőkészítés
    items:
      - name: Automata PVC Vágógép
        spec: CNC-vezérelt, 6,5 m × 2,5 m, 0,1 mm pontosság
        desc: Számítógép által vezérelt automata vágógép PVC és drop-stitch szövetekhez. A sorolási szoftver az anyaghasználatot 5% alatti hulladékra optimalizálja.
      - name: Szövetterítő
        spec: 3 m maximális szélesség, feszültség-vezérelt adagolás
        desc: A szövetet egy vagy több rétegben teríti, a feszültség kontrollált, hogy vágás előtt elkerülje az eltorzulást.
  - title: Hegesztés és ragasztás
    items:
      - name: Hőzáró Gép
        spec: Forró levegős hegesztés, 200–600 °C változtatható, 0,5–5 m/perc
        desc: Forrólevegős hőhegesztő gép PVC laminátumok, sínszalagok és kamraszegélyek ragasztására és hegesztésére. Használják drop-stitch magillesztések rögzítésére, zárására és egyesítésére.
      - name: Dielektromos RF sajtó
        spec: 15 kW, 2000 × 600 mm-es lap
        desc: Rádiófrekvenciás hegesztőprés fő hosszanti varratokhoz, kereszt-tubus csatlakozásokhoz és nagy kamrák gyártásához.
      - name: CNC-Vezérelt RF Hegesztő
        spec: 8 kW, XY asztal 2500 × 1200 mm
        desc: Programozható görbe varrat hegesztés összetett geometriai alakzatokhoz, logó dombornyomáshoz és precíz foltragasztáshoz.
  - title: Pakli művészet és befejezés
    items:
      - name: EVA Fedélvágó gép
        spec: CNC késes vágás, 2 m szélesség
        desc: Precíziós vágás EVA fedélhab panelekből művészeti sorozatú fedélmintákhoz. Minden panel formára van vágva a tökéletes, illesztésmentes teljes fedélhez.
      - name: Fedél laminálógép
        spec: Hőmérséklet- és nyomásszabályozott
        desc: EVA fedélpanelek a deszka felületéhez való rögzítése állandó tapadással a teljes fedélterületen.
  - title: SUP Nyomtatás és Díszítés
    items:
      - name: Digitális Nyomtató
        spec: Nagy felbontású tintasugaras nyomtatás, maximum 2 m nyomtatási szélesség
        desc: Közvetlen szövetre történő digitális nyomtatás teljes színű SUP fedélzeti grafikákhoz. Egyedi mintákat, színátmeneteket és fényképminőségű képeket nyomtat UV-álló vízbázisú tintákkal.
      - name: Sitanyomó gép
        spec: Kézi és félautomata, többszínű igazítás
        desc: Szitanyomás SUP deszka logókhoz, márkajelekhez és ismétlődő mintákhoz. Tartós, átlátszatlan nyomatokat biztosít élénk színsűrűséggel.
  - title: Végszerelés
    items:
      - name: Szelepnyomaték állomás
        spec: Kalibrált, 10 ciklusos funkcióteszt
        desc: Felszereli és meghúzza a felfújási szelepeket, majd minden szelepet 10 nyit/zár cikluson keresztül funkciót tesztel.
      - name: Uszonydoboz és D-gyűrű beállító
        spec: Jig-gel igazított, ragasztóval kikeményített
        desc: Az uszonydobozokat, D-gyűrűket és fogantyúkat a modell specifikáció szerint pontos deck-helyekre pozícionálja és rögzíti.
  - title: Tesztelés és minőségellenőrzés
    items:
      - name: Univerzális szakítógép
        spec: 50 kN kapacitás
        desc: Szövetminták szakítószilárdságának, szakadásnál való nyúlásának és szakadási terjedésének vizsgálata.
      - name: Légtartó képesség vizsgáló állomás
        spec: Programozható, 30 perces nyomásfenntartás
        desc: Automatizált nyomásfenntartási teszt minden csőkamrán az összeszerelés előtt.
      - name: Varratfelhúzó tesztelő
        spec: Motoros, 180°-os felhúzás 100 mm/perc sebességgel
        desc: Hegesztett és ragasztott varrat-húzóerő tesztelés belső protokoll szerint.
      - name: Xenon-ív időjárásállósági kamra
        spec: 2000 órás expozíció
        desc: UV ellenállásvizsgálat a színváltozás és szilárdság megtartása szempontjából.
cta:
  title: Érdekel egy gyárlátogatás?
  desc: Látogatókat üdvözlünk a weihai létesítményünkben. Tekintse meg berendezéseinket és folyamatainkat személyesen.
  label: Időpontfoglalás →
  link: /contact
tldr:
  summary: Paddle Board Overstock 12 000 m² termelési területtel rendelkezik, amely automata PVC vágógépekkel, nagyfrekvenciás RF hegesztőkkel, EVA fedélvágó és -finishelő állomásokkal, hőzáró sajtókkal és végszerelő berendezésekkel van felszerelve. Minden tábla 1,25-szörös névleges nyomáspróbán megy át.
  points:
    - Automatikus PVC vágás CNC pontossággal
    - Nagyfrekvenciás RF hegesztés a varrat integritásáért
    - EVA fedélvágó és kézi finishelő állomások
    - Szelepnyomaték és bordás doboz összeállító berendezések
    - 1,25-szörös névleges nyomáspróba a táblák 100%-án
