testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Tulajdonos, Algarve Surf Akadémia
    location: Lagos, Portugália
    content: Surf iskolánkhoz a Club Starter Csomaggal kezdtünk. 20 deszka, evezők, mellények — minden 3 héten belül megérkezett. Két szezon után a Pro Csomagra váltottunk. Az a testreszabott logós márkajelzés valódi változást hozott professzionális megjelenésünkben.
    rating: 5
    product: Klub Kezdő Csomag
    source: solutions/clubs
  - category: clubs
    name: Klubtulajdonos
    title: Vízisport Klub
    location: Phuket, Thaiföld
    content: A Club Starter Csomag volt a tökéletes belépési pont. Amint növekedett vállalkozásunk, a Paddle Board Overstock is velünk nőtt — ugyanaz a minőség, ugyanaz az ár, semmi meglepetés. 18 hónap alatt a 10 deszkáról 80-ra skáláztunk.
    rating: 5
    product: Club Starter + Prémium csomag
    source: success-stories
  - category: resorts
    name: Üdülőhely általános igazgatója
    title: 5 csillagos tengerparti üdülőhely
    location: Görögország
    content: A Paddle Board Overstock nemcsak deszkákat szállított — segítettek egy teljes vendégélmény kialakításában. A vízisport programunk nulláról az üdülőhely egyik fő látványosságává vált egy szezon alatt. 300+ heti foglalás és évi 180 000 USD bevétel.
    rating: 5
    product: Üdülőhely Prémium Csomag
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: A vendégélmény igazgatója, Azure Bay Resorts
    location: Phuket, Thaiföld
    content: Paddle Board Overstock tervezte meg és szerelte fel az egész tengerparti programunkat három üdülőhelyen. 80 SUPs, 40 kajak, biztonsági infrastruktúra és személyzeti képzés — mindez egyetlen szállítmányban érkezett. Az első szezonban a vendégek részvétele 60%-kal nőtt.
    rating: 5
    product: Üdülőhely Prémium Csomag
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Alapító, Shoreline Paddle Co.
    location: Kalifornia, USA
    content: Zero iparági tapasztalattal indítottam a SUP márkámat. Paddle Board Overstock csapata végigvezetett a termékválasztástól a saját logó tervezéséig és a csomagolásig. Az első konténerem 11 hét alatt érkezett, és 3 hónap alatt elfogyott az Amazonon.
    rating: 5
    product: Starter márka bevezetése
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Alapító
    title: Ausztrál SUP Márka
    location: Ausztrália
    content: Megvolt a márkaötletem, de semmi gyártási ismeretem nem volt.Paddle Board Overstock Szó szerint végig fogtam a kezemet az egész folyamat során — a megfelelő deszkelau kiválasztásától az első szállítmány kibontásáig. 90 nap az álomtól a szállításig.
    rating: 5
    product: Márkaindítási csomag
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: Tulajdonos, Lakeland SUP Bérlés
    location: Ontario, Kanada
    content: Egy helyi boltból béreltem 5 deszkát, és ezzel 60%-át elvesztettem a bevételemnek. Paddle Board Overstock segített saját flottát építeni 15 SUPs-ből. A ROI kalkulátor 4 hónapban számolta a nullszaldót — ez 3 hónap alatt sikerült. Most 30 deszkára bővítek.
    rating: 5
    product: Flotta Kezdőcsomag
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Műveleti igazgató, Adriatic Adventure Tours
    location: Dubrovnik, Horvátország
    content: Az egész bérflottánkat Paddle Board Overstock RIBs szerelte fel — 12 hajó három helyszínen. Két szezon után nulla meghibásodás. A CE minősítési dokumentáció megkönnyítette a biztosítási jóváhagyást. A mérnöki csapatuk még az csövek színét is testreszabta.
    rating: 5
    product: Flottabővítő készlet
    source: trust
  - category: rental
    name: Lt. Commander Andres Reyes
    title: Tengerészeti beszerzési tiszt, Filippínó Partiőrség
    location: Manila, Fülöp-szigetek
    content: A part menti járőrhajó-flottánkban 24 Paddle Board Overstock RIBs működik. A QG folyamatuk minden tételnél következetes — ugyanaz a varrásminőség, ugyanaz a szelep elhelyezés, mindig ugyanaz a nyomásérték. Ez a reprodukálhatóság fontos, amikor életek függenek a felszereléstől.
    rating: 5
    product: RIB Járőrflotta
    source: trust
  - category: consumers
    name: Sarah K.
    title: Első SUP tulajdonos
    location: Lake Tahoe, USA
    content: Stabil még egy teljesen kezdő számára is. Az első nap kivittem a tóra, és soha nem estem el. A teljes csomag pumpával és lapáttal azt jelentette, hogy húsz perccel a doboz felnyitása után már a vízen voltam.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Explorer 11 tulajdonos
    location: Vancouver, Kanada
    content: Első vásárlóként ideges voltam a minőség miatt, hogy külföldről rendelem. A ISO dokumentáció és a harmadik fél tesztjelentései, amiket még csak nem is kértem, teljes bizalmat adtak. A deszka 6 nap alatt megérkezett, és felülmúlta a várakozásaimat.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Szabadidős kajakos
    location: Florida, USA
    content: Masszív építési minőség. Sokkal jobban kezeli a parti hullámzást, mint vártam egy felfújhatótól. A csomagtartómban vittem egy hétvégi kiruccanásra – kevesebb mint 4 perc alatt felfújtam a rámpánál.
    rating: 5
    product: Felfújható kajak
