testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Tulajdonos, Algarve Surf Akadémia
    location: Lagos, Portugália
    content: Surf iskolánkhoz a Club Starter Csomaggal kezdtünk. 20 deszka, evezők, mellények — minden 3 héten belül megérkezett. Két szezon után a Pro Csomagra váltottunk. Az a testreszabott logós márkajelzés valódi változást hozott professzionális megjelenésünkben.
    rating: 5
    product: Klub Kezdő Csomag
    source: solutions/clubs
  - category: clubs
    name: Klubtulajdonos
    title: Vízisport Klub
    location: Phuket, Thaiföld
    content: A Club Starter csomag tökéletes belépési pont volt. Ahogy üzletünk nőtt, Paddle Board Overstock velünk nőtt — ugyanaz a minőség, ugyanaz az ár, meglepetések nélkül. 18 hónap alatt 10-ről 80 deszkára bővítettünk.
    rating: 5
    product: Club Starter + Prémium csomag
    source: success-stories
  - category: resorts
    name: Üdülőhely általános igazgatója
    title: 5 csillagos tengerparti üdülőhely
    location: Görögország
    content: Paddle Board Overstock nem csak deszkákat szállított — segítettek egy teljes vendégélmény kialakításában. Vízi sport programunk egy szezon alatt a semmiről az üdülőhely kiemelt programjává vált. Heti 300+ foglalás és évi 180 000 dollár bevétel.
    rating: 5
    product: Üdülőhely Prémium Csomag
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: A vendégélmény igazgatója, Azure Bay Resorts
    location: Phuket, Thaiföld
    content: Paddle Board Overstock Három üdülő területén tervezte és szerelte fel teljes tengerparti programunkat. 120 SUPs, biztonsági infrastruktúra és személyzeti képzés — mind egyetlen szállítmányban szállítva. A vendégek részvétele 60%-kal nőtt az első szezonban.
    rating: 5
    product: Üdülőhely Prémium Csomag
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: Tulajdonos, Lakeland SUP Bérlés
    location: Ontario, Kanada
    content: 5 deszkát béreltem egy helyi boltból, és a bevételem 60%-át elveszítettem velük. Paddle Board Overstock segített saját 15 SUPs flottám felépítésében. A ROI kalkulátor 4 hónapra jelezte a megtérülést — ehhez nekem 3 hónap kellett. Most 30 deszkára bővítek.
    rating: 5
    product: Flotta Kezdőcsomag
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Műveleti igazgató, Adriatic Adventure Tours
    location: Dubrovnik, Horvátország
    content: Az egész SUP bérleti flottánkat Paddle Board Overstock deszkákkal szereltük fel — 30 deszka három helyszínen. Két szezon telt, nulla hiba. Az összes tétel következetes minősége megkönnyítette a választást, és csapatuk még a színeket is a márkánkhoz igazította.
    rating: 5
    product: Bérleti flottacsomag
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Tulajdonos, Lake Garda SUP Rentals
    location: Garda-tó, Olaszország
    content: A bérbeadó tábláink naponta ötször indulnak ki csúcsszezonban. A váltás Paddle Board Overstock óta a kárpanaszok majdnem nullára csökkentek, és a vásárlók folyton kérdezik, hol lehet saját deszkát vásárolni.
    rating: 5
    product: Bérleti flottacsomag
    source: solutions/rental-business
  - category: consumers
    name: Sarah K.
    title: Első SUP tulajdonos
    location: Lake Tahoe, USA
    content: Stabil még egy teljesen kezdő számára is. Az első nap kivittem a tóra, és soha nem estem el. A teljes csomag pumpával és lapáttal azt jelentette, hogy húsz perccel a doboz felnyitása után már a vízen voltam.
    rating: 5
    product: SUP Felfedező 11
  - category: consumers
    name: James Thornton
    title: SUP Explorer 11 tulajdonos
    location: Vancouver, Kanada
    content: Első vásárlóként ideges voltam, hogy külföldről rendeljek. Az építési minőség már a doboz kibontásakor önmagáért szólt — merev, hibátlan varrások, és mindössze 6 nap alatt megérkezett.
    rating: 5
    product: SUP Felfedező 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Hétvégi evezős
    location: Florida, USA
    content: Masszív építési minőség. Sokkal jobban kezeli a parti hullámzást, mint vártam egy felfújhatótól. A csomagtartómban vittem egy hétvégi kiruccanásra – kevesebb mint 4 perc alatt felfújtam a rámpánál.
    rating: 5
    product: SUP Trópusi szellő
