hero:
  tagline: Körülbelül
  title: A {SITE} témáról
  subtitle: Függőlegesen integrált vízisport-gyártó — a nyersanyagtól a kész hajóig
intro:
  - 'Paddle Board Overstock 2012-ben alapították egyetlen küldetéssel: olyan vízi sportfelszerelések tervezése és gyártása, amelyek ugyanolyan jól teljesítenek a vízen, mint a minőségi jelentésben. Ami kezdetben SUP fókuszált deszkeszműhelyként indult, egy 12 000 négyzetméteres integrált gyártóüzemmé nőtte ki magát a Qingdao Gazdasági Fejlesztési Zónában, amely felfújható csónakokat, RIBskajakokat, SUP deszkákat, biztonsági felszereléseket és kiegészítőket gyárt 50+ ország ügyfelei számára.'
  - Ma Paddle Board Overstock gyári márkaként működik — mindent egy fedél alatt tervezünk, tervezünk, prototípusozunk, gyártunk és tesztelünk. Ez a vertikális integráció közvetlen irányítást ad az anyagválasztás, az építési minőség és a szállítási határidők felett. Minden hajót a mi embereink, a felszerelésünkön, a saját szabványainkhoz igazítva építünk.
  - Világszerte szórakoztató felhasználókat, kereskedelmi szolgáltatókat, kormányzati szerveket és márkapartnereket szolgálunk ki. OEM ODM Programjaink segítik a vállalkozásokat saját termékvonalaik elindításában anélkül, hogy befektetnének a gyári infrastruktúrába. Akár egyetlen prototípusra, akár teljes gyártási sorozatra van szüksége, csapatunk a koncepciótól a tengeri szállításig vezet.
