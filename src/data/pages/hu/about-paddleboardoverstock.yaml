values:
  - title: Minőség mindenekelőtt
    desc: Minden hajó, amely elhagyja a gyárat, kötelező légzáró, varrásvizsgálati és rendszerellenőrzési teszteken megy keresztül szállítás előtt.
  - title: Vertikális integráció
    desc: Minden folyamatot irányítunk — a PVC vágástól a végszerelésig — kiküszöbölve az alvállalkozói hatékonyságvesztést és biztosítva a következetes minőséget.
  - title: Biztonság alapértelmezésként
    desc: A CE tanúsítvány alapvető része annak, amit építünk. 64 CE-tanúsított modellünk megfelel az EU biztonsági előírásainak szabadidős és kereskedelmi használatra.
  - title: Partnerközpontú
    desc: Hosszú távú kapcsolatokat építünk OEM, ODM és private-label partnerekkel átláthatóság, megbízhatóság és közös növekedés révén.
services:
  - title: OEM gyártás
    desc: Az Ön specifikációi alapján gyártunk. Ossza meg rajzait, és mérnöki csapatunk kezeli a prototípust, a szerszámkészítést és a gyártást.
  - title: ODM megoldások
    desc: Kezdje bizonyított platformterveinkből. Testreszabhatja a méretet, színt, grafikát és csomagolást, hogy egyedi termékvonalat hozzon létre.
  - title: Saját márka
    desc: Az Ön márkája, az Ön logója, az Ön csomagolása. A termékek kiskereskedelmi kész állapotban érkeznek teljes márkaintegrációval.
  - title: Egyedi márkázás
    desc: Fedélzeti párnanyomtatás, hajótesten grafika, cső matricák és egyedi címkék — következetes márkajelenlét minden felületen.
certifications:
  - name: CE tanúsítás
    desc: Hajóink és vízi járműveink megfelelnek az EU Szabadidős Hajók irányelvének (2013/53/EU) és a vonatkozó harmonizált szabványoknak.
    scope: Hajók és vízi járművek
  - name: null
    desc: Minőségirányítási rendszerrel tanúsított a felfújható vízi járművek tervezésére, gyártására és forgalmazására.
    scope: Teljes létesítmény
  - name: null
    desc: Felfújható hajók — biztonsági és teljesítménykövetelmények megerősített és merev testű felfújható hajók esetén.
    scope: RIB & felfújható modellek
