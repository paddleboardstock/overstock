content_challenge:
  tagline: A kihívás
  title: Tengeri kutatási igények<br />Stabil, műszerre alkalmas platformok
  subtitle: A tudományos munkahajóknak stabil platformot kell biztosítaniuk érzékeny műszerek számára, csendes működést biztosítaniuk kell a vadon élő állatok zavarásának elkerülése érdekében, valamint rugalmas elrendezést kell biztosítaniuk a különféle kutatóberendezések számára.
  paragraphs:
    - A tengeri kutatás és a környezeti megfigyelés munkahajókat igényel, amelyek mozgó laboratóriumként szolgálnak. A kereskedelmi vagy szabadidős hajókkal ellentétben a kutatásnak RIBs érzékeny elektronikus műszereket, víz- és üledékmintázó berendezéseket, valamint néha élő példányszállítást kell biztosítania — mindezt ugyanúgy fenntartva a stabil platformot a pontos adatgyűjtéshez.
    - '**A platform stabilitása kritikus** — A szonár, visszhanghangolók és CTD (vezetőképesség, hőmérséklet, mélység) profilerekhez stabil hajótest szükséges nyugalmi állapotban és lassú sebességben. A túlzott hullám- vagy hajótestmozgás zajt hoz a tudományos adatokba. Egy mély-V hajótest, amely jó stabilitási tulajdonságokkal rendelkezik, elengedhetetlen.'
    - '**Műszerintegráció** — A kutatóhajóknak szükségük van GPS antenna, szonártranszdukátorok, mintavételi karok és adatnaplózó berendezések rögzítési pontjaira. A konzoltérnek több kijelzőt, műszerek energiaelosztását és érzékeny elektronikai eszközök biztonságos tárolását kell biztosítania.'
    - '**Csendes működés** — Tengeri biológiai felmérések és környezeti monitoring esetén a motorzaj és a hajótest rezgése megijesztheti a tengeri élővilágot, és veszélyeztetheti a viselkedési megfigyeléseket. A csendes külső szerkezetek és csökkentett rezgésű hajótest-tervek fontosak a kutatási alkalmazásokhoz.'
    - Paddle Board Overstock RIBs A kutatásokat stabil hajótestplatformokkal, integrált berendezés-rögzítő rendszerekkel és csendes külső szerkezetekkel tervezték tudományos és környezeti megfigyelő alkalmazásokhoz.
content_solution:
  tagline: Megoldásunk
  title: Célra épített kutatás RIBs<br />Tudományos és környezetvédelmi munkáért
  subtitle: Minden Paddle Board Overstock kutatás stabil RIB , testreszabható platformként van beállítva tudományos műszerek és terepmintázó berendezések számára.
  list:
    - Mély-V üvegszálas hajótest kiváló stabilitással nyugalmi állapotban és lassú felmérő sebességgel
    - Lapos fedélzetes elrendezés szonár, GPS és mintavételi eszközök szerelő lemezeivel
    - Konzol több kijelzőre konfigurálva — plotter, szonger, adatlogger
    - 12V és 24V kiegészítő energiaelosztás tudományos műszerekhez
    - Csendes 4-ütemű külső motor — minimális rezgés és zaj a vadon élő állatok felméréséhez
    - Opcionális alacsony hullámvölgyű hajótest kialakítás a minimális zavar érdekében az adatgyűjtés során
    - Egyedi csőszínek kutatóintézetek márkázásához és flottaazonosításához
content_segments:
  tagline: Kutatási profilok
  title: Tengertudományi megoldások<br />Alkalmazási típus szerint
  subtitle: Különböző kutatási alkalmazásoknak egyedi hajóigényei vannak — az egyetemi oktatási platformoktól a környezeti felmérő hajókon át a vízminőség RIBsmonitorozásig.
  items:
    - title: Egyetemi Tengertudományi Programok
      subtitle: Oktatási platformok, diákkirándulások, part menti kutatások
      description: A tengertudományi egyetemeknek és oceanográfiai tanszékeknek megbízható, sokoldalú munkahajókra van szükségük terepi kurzusok, hallgatói kutatási projektek és oktatók által vezetett part menti felmérések oktatásához. A hajónak könnyen kezelhetőnek kell lennie a felügyelet alatt álló hallgatók számára, elég stabilnak kell lennie a kézi műszerek telepítéséhez, és elég tartósnak kell lennie ahhoz, hogy több felhasználó is gyakran használja őket az akadémiai időszakok között. Az akadémiai környezetben a költségvetési korlátok fontossá teszik a költséghatékonyságot és az alacsony karbantartási igényt.
      features:
        - Stabil platform a diákok műszerhasználatához és helyreállításához
        - Egyszerű működés — tiller vagy egykonzolos konfiguráció felügyelt diákhasználathoz
        - Tartós Hypalon csövek gyakori partraszállásokhoz és diákok kezeléséhez
        - Felszerelés felszerelése tanári szintű szonárhoz, secchi lemezhez és mintavételező berendezésekhez
        - Költséghatékony PVC megoldás a költségvetési szűkös akadémiai programokhoz
    - title: Tengeri Kutatóintézetek
      subtitle: Felmérés RIBs műszer-integrációval, GPS-szel, mintavételi eszközökkel
      description: A parti és tengeri felméréseket végző dedikált tengeri kutató szervezeteknek professzionális felmérő felmérő eszközökkel kell rendelkeznie RIBs . Ezek a hajók szonárrendszereket hordoznak a batimetrikus térképezéshez, CTD profilereket vízoszlop-elemzéshez, üledékmintákat és biológiai gyűjtő berendezéseket. A hajónak stabil platformot kell biztosítania lassú felmérési sebességgel, bőven fedélzeti helyet biztosítania a berendezések telepítéséhez, és tiszta 12V/24V energiát biztosítani az elektronika számára.
      features:
        - Integrált szonárátadó rögzítés — átmenő vagy kereszt konfiguráció
        - GPS antenna rögzítése és konzolintegráció a felmérési szintű navigációhoz
        - CTD és vízmintavételi terület biztonságos rögzítési pontokkal
        - 12V/24V segédenergia-elosztás műszerekhez és adatloggerekhez
        - Stabil lassú sebességnél (3-6 csomó) a felmérő vonal pontosságához
        - Opcionális A-keret vagy davit nehezebb mintavételi berendezések telepítéséhez
    - title: Környezeti figyelés és védelem
      subtitle: Ökológiai felmérések, vadon élő állatok megfigyelése, élőhely-értékelés
      description: Környezetvédelmi civil szervezetek, kormányzati szervek és természetvédelmi szervezetek végeznek tengeri ökológiai felméréseket, vadállomány-monitorozást és élőhelyértékeléseket. Ezek a műveletek csendes, alacsony hatású hajókat igényelnek, amelyek érzékeny élőhelyekhez közelíthetnek anélkül, hogy zavarnák a vadon élő állatokat. A hajóknak kamerafelszerelést, GPS-et kell hordozniuk a transekt térképezéshez, valamint mintavételi felszerelést a víz- és üledékgyűjtéshez. Az alacsony hullámzás és a minimális motorzaj kritikus a viselkedési megfigyelés vizsgálatához.
      features:
        - Csendes négyütemű külső motor — minimális zavar a tengeri élővilágra
        - Stabil megfigyelőplatform fényképezéshez és videódokumentációhoz
        - Felszerelés rögzítése kamerarendszerek, GPS követők és terepi számítógépek számára
        - Sekély merülés a part menti vizes élőhelyek, mangrove erdők és folyótorkolatok eléréséhez
        - Könnyen tisztítható fedélzet és csőfelületek a helyek közötti fertőtlenítéshez
    - title: Vízminőség-ellenőrzés és tesztelés
      subtitle: Rendszeres mintavételi utak, szennyezőanyag-követés, megfelelőség ellenőrzés
      description: A vízminőség-ellenőrzéssel foglalkozó szervezetek rendszeres mintavételi utakat végeznek a part menti zónákban, kikötőkben és belvízi útvonalakon a szennyezőanyag-szintek, algavirágzások és a környezetvédelmi előírásoknak való megfelelés nyomon követésére. Ezek a műveletek hatékony, megbízható hajókat igényelnek az állandó mintavételi pontok ismételt látogatásához. A hajónak szállítania kell a mintavételi felszerelést, hűtőt a minták megőrzéséhez, és terepi tesztelő eszközöket – a mintavételi helyek közötti könnyű fedélzettisztítás lehetőségével a keresztfertőzés megelőzésére.
      features:
        - Dedikált mintavételi állomás terület hűtővel és felszerelés tárolásra
        - Könnyen tisztítható fedélzet és csőfelületek a helyek közötti fertőtlenítéshez
        - GPS integráció a pontos visszatérés érdekében a rögzített koordinátákhoz
        - Kompakt méret a korlátozott víziutak és a keskeny csatornák eléréséhez
        - Üzemanyag-takarékos külmotor a költséghatékony rendszeres mintavételi utakhoz
