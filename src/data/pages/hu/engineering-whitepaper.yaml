section_testing:
  title: Tesztelés és biztonsági protokollok
  subtitle: Aquafarer minőségbiztosítási keretrendszere minden gyártási tételre
  protocols:
    - title: 1,25x névleges nyomás tartó teszt
      description: Minden összeszerelt tartályt felfújnak 1,25-szörös névleges üzemnyomására, és 24–48 órán keresztül tartják. Bármely 2%-ot meghaladó nyomáscsökkenés elutasítást és újramunkálást vált ki.
      standard: ISO 6185
    - title: Varrási húzóerő teszt
      description: Minden gyártási tételből származó hegesztett és ragasztott varratsz samples-et kalibrált húzóberendezéssel tesztelik a húzóerőre. Minimum 4 kN/m húzóerő szükséges.
      standard: ISO 2411
    - title: Szövet szakítógép teszt
      description: A beérkező szövethengereket szakítóerő- és nyúlásvizsgálatnak vetik alá mind vetülati, mind bevetési irányban. Elutasítási küszöbérték PVC esetén 3 000 N/5 cm alatti.
      standard: ISO 1421
    - title: UV Gyorsított időjárásállóság
      description: Az anyagmintákat 1 000+ óra gyorsított UV hatásnak teszik ki QUV tesztkamrákban. Maximális 15%-os szakítószilárdság-veszteség megengedett.
      standard: ASTM G154
    - title: Szelep és szerelvény integritás
      description: Minden szelep összeszerelést az 1,25-szörös névleges nyomáson tesztelnek a tömítettség szempontjából. Visszacsapó szelepeknél az egyirányú zárás teljesítményét tesztelik.
      standard: ISO 12402
