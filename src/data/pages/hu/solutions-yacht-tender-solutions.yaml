content_challenge:
  tagline: A kihívás
  title: Jacht-tenderek szükségesek<br />Előadás és bemutatás
  subtitle: A jacht-tender több, mint egy csónaka — az anyahajó kiterjesztése és a minőség kinyilvánulása.
  paragraphs:
    - A jachttulajdonosoknak és kapitányoknak olyan tenderekre van szükségük, amelyek jól teljesítenek, kompaktan tárolják és gyönyörűen jelennek meg. A tendernek kiegészítie kell a jacht esztétikáját, miközben megbízható szállítást biztosít a vendégek és a legénység számára.
    - '**A tárolás kritikus** — A tendernek a fedélzeten, garázsban vagy daviton kell elhelyezni. A súly számít a kilövő- és visszanyerő rendszereknél.Aquafarer RIBs Kiváló teljesítmény-súly arányt kínálnak kompakt tárolási profilokkal.'
    - '**A teljesítményelvárások magasak** — A vendégek sima, száraz utazást várnak a partra szállításkor. A motoropcióknak egyensúlyban kell tartaniuk a sebességet, a hatótávolságot és a zajszintet a prémium élmény érdekében. Charterjáratoknál a tender naponta közlekedik, és ellenállnia kell a gyakori használatnak.'
    - '**A megjelenés számít** — Egy össze nem illő vagy kopott tender rontja a jacht általános megjelenését. Az egyedi csőszínek, kárpitozás és márkajelzés biztosítja, hogy a tender úgy nézzen ki, mintha a helye lenne.'
content_solution:
  tagline: Megoldásunk
  title: Tender konfigurációk<br />Minden jacht-kérelemhez
  subtitle: Aquafarer RIB A tenderek testreszabhatók a hajód, üzemeltetési típusa és tárolási igényeidhez — a szuperjacht-építő specifikációitól a charter flottaprogramokig.
  list:
    - Egyedi csőszínek, amelyek illeszkednek vagy kiegészítik az anyaéreket — bármilyen RAL szín elérhető Hypalon vagy PVC tubus
    - Egyedi kárpitozás és varrás — prémium tengeri minőségű vinil színpárosítással és logóhímzéssel
    - Konzol- vagy kormányzó irányítás — a használati mintázat és az üzemeltető preferenciája alapján válassz
    - Üvegszálas mély-V törzs a sima, száraz utazáshoz változó tengeri körülmények között
    - Kompakt tárolás — lefúvódik vagy fészkel, hogy a teraszgarázs, szekrény vagy damacstároló legyen
    - Hypalon csövek az UV ellenállás és hosszú távú megjelenés megőrzése érdekében
    - Minden modellen felszerelő pontok és vontatógyűrűk standard
    - Opcionális íjvédő, teljes fedél és védő dörzsölővédő védők
    - 'Motorválaszték: HP 15-től HP 60-ig — külső vagy kormányzós konfigurációk'
    - OEM/privát címkézés elérhető jachtépítők és tengeri kereskedők számára
content_segments:
  tagline: Ügyfélprofilok
  title: Jacht tender megoldások<br />Ügyféltípus szerint
  subtitle: A különböző jachtipari szegmenseknek egyedi követelményei vannak.Aquafarer Konfigurálja a tendereket az egyes alkalmazásokhoz igazítva.
  items:
    - title: Szuperjacht-építők
      subtitle: OEM Tender integráció — egyedi méretek, színek és anyagok
      description: 'A jachtépítők visszatérő kihívással néznek szembe: minden új hajónak egyedi méretkorlátai, súlykorlátai és esztétikai elvárásai vannak. A tendernek tökéletesen integrálnia kell az anyahajó davit rendszerével, pontos garázsméretekhez kell illeszkednie, és illeszkednie kell egy többmillió eurós jacht tervezési nyelvéhez. Bármilyen összesvetlenség — rossz csőszín, rossz emelési pont elhelyezés, összeegyeztethetetlen súly — késlelteti a szállítást, és rossz fényt vet a gyártóra.Aquafarer Közvetlenül együttműködik a gyártó beszerzési és tervezőcsapataival, hogy egyedi RAL csőszínekkel, hozzáillő kárpitokkal, márkázott konzolpanelekkel és teljes OEM dokumentációs csomagokkal szállítsák a tendereket.'
      features:
        - Egyedi dimenzióspecifikációk, amelyek megfelelnek a garázs és díszfalat korlátoknak
        - Bármilyen RAL cső színe és hozzá illő kárpit — tervezési jóváhagyási minták is rendelkezésre állnak
        - OEM Márkajelzés konzolon, cső- és üléstámlákon
        - Emelési pont és davit illeszkedés validálása minden modellhez
        - Testsúly optimalizált meghatározott indítási és visszanyerési rendszerekhez
        - Tömeges szállítási ütemezés a gyártási határidőkkel összhangban
    - title: Jachtkezelő cégek
      subtitle: Flottaszabványosított tenderek — globális támogatás, minimális leállás
      description: A menedzsment cégek több jachtot felügyelnek a Földközi-tengeren, a Karib-térségen, a Dél-csendes-óceánon és azon túl is. Alapvető szükségletük a megbízhatóság — egy elromlott tender egy távoli kikötőben a legénység túlóráját, vendégpanaszokat és drága, utolsó pillanatos cseréket jelent. A szabványosított flottaspecifikációk csökkentik a személyzet képzési idejét a hajókon át, és egyszerűsítik a pótalkatrész-kezelést.Aquafarer Több hajós flotta árazást, következetes specifikációkat kínál a megrendelések között, valamint globális tartalék támogatást a menedzsment cégek számára, akiknek több régióban hajóik vannak.
      features:
        - Szabványosított specifikációk az egész menedzselt flottában
        - Cserélhető alkatrészek minden flottatender között
        - Flottaár és volumenbeli kedvezmények többegységes megrendelésekhez
        - Globális alkatrész elérhetőség — gyors szállítás bármely kikötőbe
        - Következetes szerviz- és karbantartási dokumentáció a legénység számára
        - Többegységes szállítási koordináció különböző hajóhelyekre
    - title: Jacht-bérlők üzemeltetők
      subtitle: Nagy gyakoriságú napi műveletek — tartósság anélkül, hogy a megjelenést rombolnánk
      description: 'A charter tendereknek a jacht-iparban a legszigorúbb üzemeltetési menetrend kell megküzdeniük: napi vendégáthelyezések, partraszállások, vízi sporttámogatás és kikötői tenderezés — gyakran 200+ művelet charter szezononként. A tendernek minden vendégátadásnál tisztának kell kinéznie, miközben folyamatos beszállást, sós víz hatást és motormunkaidőt kell kibírnia. A megjelenés romlása közvetlen üzleti szempont — egy kopott tender befolyásolja a vendégértékeléseket és a charter díjakat.Aquafarer Frissített kárpitokkal, nehéz Hypalon csövekkel és megerősített kezelési területekkel konfigurálja a charter tendereket a hosszú távú tartósság érdekében, amely megőrzi a bemutatási minőséget.'
      features:
        - Nehéz Hypalon tekologikus csövek — napi bérlejáratban 5-8 éves élettartam
        - Megerősített beszállólépcsők és kezelhető kapaszkodó kötélek gyakori használatra
        - Prémium foltálló vinyl kárpitozás — könnyű tisztítás a charter autók között
        - Könnyen tisztítható, csúszómentes fedélzeti felületek
        - Megbízható külső csomagok könnyű szervizhozzáféréssel a szoros átállás érdekében
        - Kozmetikai minőségű anyagok, amelyek megjelenésüket a charter szezonok során is megőrzik
    - title: Jachtkereskedők és brókerek
      subtitle: Megbízható tenderellátás a hajó befejezéséhez és az újraértékesítési értékhez
      description: A kereskedőknek és brókereknek stabil minőségi tenderkészletre van szükségük, amely kiegészíti az eladott hajókat — illeszkedve a márkapozicionációhoz és javítva a vásárlói élményt. Egy következetlen tender vagy szállítási késés késleltetheti a jacht átadását vagy csökkentheti a listázás bemutatását. A kereskedők következetes minőséget követelnek a különböző tételekben, megbízható előreszállítási idők és versenyképes árazás igényei a haszonkulcs fenntartásához. KereskedőiAquafarer készletprogramokat kínálnak szezonális szállítási ütemezéssel, közös márkázási lehetőségeket a bemutatótermek bemutatásához, valamint prioritási elosztást a csúcsszezonban.
      features:
        - Készletkészlet-készlet programok igény szerint elérhető modellekkel
        - Szezonális szállítási ütemezés a átadási naptárhoz igazítva
        - Kereskedői társmárkázás konzolon és csöveken a bemutatóteremekhez
        - Következetes minőség és specifikáció minden tételi megrendelésre vonatkozóan
        - Versenyképes kereskedői árképzés volumenalapú szinttel
