hero:
  tagline: Tengeri szakértelem
  title: Évtizedes tengeri mérnöki tapasztalat<br />minden deszkában
  subtitle: Paddle Board Overstock ötvözi a fejlett anyagtudományt, a precíziós gyártást és a valós tesztelést, hogy olyan deszkákat állítson elő, amelyek akkor is teljesítenek, amikor számít.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock tengeri mérnöki és K+F csapat munka közben
expertise_materials:
  tagline: Anyagtudomány
  title: A megfelelő anyag kiválasztása<br />minden alkalmazáshoz
  subtitle: Három alapanyagot használunk — mindegyiket bizonyos felhasználási esetek és teljesítménykövetelmények szerint választottuk ki.
  columns: 3
  items:
    - title: Tengeri minőségű PVC
      description: 1100 denier PVC szövet — a legváltozatosabb anyagunk. UV-stabilizált, kopásálló és időtálló. Ideális SUP deszkákhoz, ahol a súly, a merevség és a költséghatékonyság számít.
      icon: tabler:droplet
    - title: Drop-Stitch mag
      description: Több ezer poliészter szál köti össze a felső és alsó szövetréteget, lehetővé téve a nagy nyomású felfújást (15 PSI), így merev, stabil utazást biztosít, amely mégis feltekerhető egy hátizsákba.
      icon: tabler:building-arch
    - title: EVA Deck hab
      description: Barázdált, nagy sűrűségű EVA hab teljes hosszában tapadást, ütéscsillapítást a leesésekhez és vásznat biztosít a jellegzetes művészi sorozatú deszkáinkhoz.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Gyártási képességek
  title: Precíziós gyártás<br />minden lépésnél
  subtitle: 12 000 m²-es létesítményünk speciális gépekkel van felszerelve a termelés minden szakaszához.
  columns: 2
  items:
    - title: CNC Vágás
      description: Számítógép vezérelt vágás biztosítja a pontos, ismételhető szövetpanelek kialakítását minimális hulladékkal. Minden darab pontosan illeszkedik a tervezett módon.
      icon: tabler:cpu
    - title: Nagyfrekvenciás hegesztés
      description: Ipari HF hegesztés olyan varratokat hoz létre, amelyek erősebbek az alapanyagnál. A hőmérséklet és nyomás állandó szabályozása légmentes tömítéseket biztosít minden gyártási folyamat során.
      icon: tabler:bolt
    - title: Drop Stitch mag összeállítás
      description: Több ezer poliészter szál köti össze a felső és alsó szövetrétegeket, lehetővé téve a magas nyomású felfújást (15-20 PSI), így merev, stabil SUP deszkákat és padlókat kapunk.
      icon: tabler:building-arch
    - title: Nyomáspróba
      description: Minden deszkát nyomáspróbának vetünk alá szállítás előtt, 1,25-szörös névleges nyomáson tartva — ha ott megtartja, a vízen is teljesít majd.
      icon: tabler:wind
    - title: Varraterő-teszt
      description: Az egyes gyártási tételekből véletlenszerű mintákat pusztító varraterő-tesztnek vetünk alá. Az eredményeket rögzítjük és nyomon követhetővé tesszük a konkrét gyártási tételekig.
      icon: tabler:files
    - title: Vízpróba
      description: Minden deszka kialakítás valós vízi próbákon esik át. A valós evezés part menti körülmények között igazolja a teljesítményt, kezelhetőséget és stabilitást.
      icon: tabler:ripple
expertise_design:
  tagline: Tervezés és Mérnöki munka
  title: Valódi körülményekre tervezve
  subtitle: A tervezési filozófiánk azzal kezdődik, hogyan fogják használni a plakot — majd a mérnöki megoldást erre a felhasználási esetre építjük.
  items:
    - title: Tábla alakja és körvonala
      description: A hossz, szélesség és rocker minden modell céljához van hangolva — hosszabb túra körvonalak a sikláshoz, szélesebb alapformák a stabilitáshoz és jógához.
    - title: Sín- és gerincmegerősítés
      description: Megerősített sínek és középső gerincek merevséget adnak és elnylik az ütéseket — azokon a helyeken, ahol a deszkák szezonról szezonra kapják a legtöbb visszaesést.
    - title: A fedélzet elrendezése és vontatása
      description: Az állásterület, a fogantyú elhelyezése, a D-gyűrűs tartók és a tapadászónák valódi evezős pózok köré vannak kialakítva — legyen az hajózás, horgászat vagy jóga gyakorlása.
    - title: Art & Color sorozat
      description: A fedélzeti grafikák, színsémák és kiegészítők – minden sorozat egy egyedi evezős személyiséghez van tervezve.
