hero:
  tagline: Tengeri Szakértelem
  title: Évtizedes tengeri mérnöki tapasztalat<br />minden hajótestben
  subtitle: Aquafarer mély anyagtudományt, precíz gyártást és valós körülmények közötti tesztelést ötvöz, hogy vízi járműveket hozzon létre, amelyek akkor teljesítenek, amikor számít.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer tengeri mérnöki és K+F csapat munka közben
expertise_materials:
  tagline: Anyagtudomány
  title: A megfelelő anyag kiválasztása<br />minden alkalmazáshoz
  subtitle: Három alapanyagot használunk — mindegyiket bizonyos felhasználási esetek és teljesítménykövetelmények szerint választottuk ki.
  columns: 3
  items:
    - title: Tengeri minőségű PVC
      description: 1100 denier PVC szövet — leginkább sokoldalú anyagunk. UV-stabilizált, kopásálló és REACH kompatibilis. Ideális szabadidős hajókhoz, SUP deszkákhoz és kajakokhoz, ahol a súly- és költséghatékonyság számít.
      icon: tabler:droplet
    - title: Prémium Hypalon/CSM
      description: Kiemelkedő vegyszerállóság és UV stabilitás. Hypalon hajók megfelelő karbantartás mellett 15-20 évig is kibírják. Ajánlott kereskedelmi, mentő- és katonai alkalmazásokhoz, ahol a hosszú távú tartósság kritikus.
      icon: tabler:shield
    - title: Üvegszál & Alumínium
      description: Mély-V üvegszálas hajótestek RIBs és járőr hajók számára — hullámvágó teljesítmény durva körülmények között. Alumínium hajótestek nehéz teherhajókhoz, ahol maximális szilárdság és teherbírás szükséges.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Gyártási képességek
  title: Precíziós gyártás<br />minden lépésnél
  subtitle: 12 000 m²-es létesítményünk speciális gépekkel van felszerelve a termelés minden szakaszához.
  columns: 2
  items:
    - title: CNC Vágás
      description: Számítógép vezérelt vágás biztosítja a pontos, ismételhető szövetpanelek kialakítását minimális hulladékkal. Minden darab pontosan illeszkedik a tervezett módon.
      icon: tabler:cpu
    - title: Nagyfrekvenciás hegesztés
      description: Ipari HF hegesztés olyan varratokat hoz létre, amelyek erősebbek az alapanyagnál. A hőmérséklet és nyomás állandó szabályozása légmentes tömítéseket biztosít minden gyártási folyamat során.
      icon: tabler:bolt
    - title: Drop Stitch mag összeállítás
      description: Több ezer poliészter szál köti össze a felső és alsó szövetrétegeket, lehetővé téve a magas nyomású felfújást (15-20 PSI), így merev, stabil SUP deszkákat és padlókat kapunk.
      icon: tabler:building-arch
    - title: Nyomáspróba
      description: Minden felfújható terméket nyomáspróbának vetünk alá szállítás előtt. RIB csöveket 1,25x névleges nyomáson teszteljük — ha ott kibírja, a vízen is jól fog teljesíteni.
      icon: tabler:wind
    - title: Varraterő-teszt
      description: Az egyes gyártási tételekből véletlenszerű mintákat pusztító varraterő-tesztnek vetünk alá. Az eredményeket rögzítjük és nyomon követhetővé tesszük a konkrét gyártási tételekig.
      icon: tabler:files
    - title: Vízpróba
      description: Minden RIB modellt tengeri próbákon tesztelnek a tanúsítás előtt. A valós körülmények közötti tesztelés part menti környezetben igazolja a teljesítményt, a kezelhetőséget és a stabilitást.
      icon: tabler:ripple
expertise_design:
  tagline: Tervezés és Mérnöki munka
  title: Valódi körülményekre tervezve
  subtitle: A tervezési filozófiánk azzal kezdődik, hogy hogyan fogják használni a hajót — majd a mérnöki munkát ehhez a felhasználási esethez igazítjuk.
  items:
    - title: Mély-V hajótest kialakítás
      description: Üvegszálas hajótestjeink számított deadrise szögekkel rendelkeznek, melyeket az egyes modellek hosszához és tervezett használatához optimalizáltak. Meredekebb V a hullámos vízen való teljesítményhez, laposabb a stabilitásért.
    - title: Többrekeszes biztonság
      description: Minden hajó 3-7 független légrekesszel rendelkezik. Ha egy rekesz megsérül, a fennmaradó rekeszek a hajót a vízen tartják és működőképesek maradnak.
    - title: Ergonomikus elrendezés
      description: A konzol pozíciója, a cső magassága és az ülés elhelyezése az üzemeltető kényelme alapján lett kialakítva hosszabb használat során — legyen szó járőrözésről, horgászatról vagy szállításról.
    - title: Egyedi konfiguráció
      description: A csőszínek, a konzol konfigurációja, az üzemanyagtartály kapacitása, a kiegészítő tartók — minden modellt testre lehet szabni az adott működési követelményeknek megfelelően.
cta:
  title: Van konkrét alkalmazás a fejedben?
  subtitle: Mérnöki csapatunk tanácsot tud adni az anyagválasztásra, a tervezésre és a gyártásra vonatkozóan a projektje számára.
  actions:
    - variant: primary
      text: Kérdezze meg a mérnökeinket
      href: /contact
    - text: Termékkínálat megtekintése
      href: /products
