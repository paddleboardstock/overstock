content_segments:
  tagline: Partnerprofilok
  title: Forgalmazói partnerségi modellek<br />Partner típus szerint
  subtitle: Különböző forgalmazók különböző piacra lépési erősségekkel rendelkeznek — regionális infrastruktúra, e-kereskedelmi elérés, speciális kiskereskedelem vagy többmárkás portfóliók. Mi a partnerségi feltételeket, árkategóriákat és támogatási szinteket úgy alakítjuk, hogy megfeleljenek minden partnerprofilnak.
  items:
    - title: Regionális tengeri forgalmazók
      subtitle: Területileg kizárólagos B2B forgalmazás
      description: Bevált forgalmazók raktár-infrastruktúrával, forgalmazói hálózatokkal és logisztikai képességekkel, akik tengeri forgalmazókat, vízisport-kereskedőket és kölcsönző üzemeltetőket szolgálnak ki egy meghatározott földrajzi területen. Teljes termékvonalra, védett árakra és a lehetőségre van szüksége, hogy helyi készlettel és támogatással szolgálja ki a forgalmazói számlákat.
      features:
        - Kizárólagos területvédelem minimális kötelezettségi feltételekkel
        - Teljes katalógusban nagykereskedelmi árképzés negyedéves árvisszatérítésekkel
        - Helyi készletszállítási program gyorsan változó SKU-khoz
        - Kereskedői hálózat képzés és társmárkás marketing programok
    - title: E-kereskedelem és online kiskereskedők
      subtitle: Digitális-elsődleges terjesztési csatornák
      description: Online kiskereskedők árulnak vízisport-eszközöket Amazonon, eBay-en vagy saját e-kereskedelmi platformjaikon keresztül. A gyors piacra lépés, versenyképes árképzés és közvetlen fogyasztói logisztika kulcsfontosságú. Olyan partnerre van szükséged, aki egyedi rendeléseket tud dropshipping-be küldeni a márkád alatt, gyors teljesítéssel és nulla készletkockázattal.
      features:
        - 'Drop-ship program: gyári közvetlen teljesítés a márkáddal'
        - Valós idejű készlet API feed az e-kereskedelmi platformod számára
        - Amazon Seller Central EANintegrációja /UPC támogatás
        - A visszaküldési logisztika és a garanciaigény-feldolgozás is magában foglalja
    - title: Speciális vízsport-kiskereskedők
      subtitle: Hagyományos bemutatópartnerek
      description: Fizikai kiskereskedelmi üzletek, amelyek vízi sportfelszerelésekre specializálódtak — helyi evezősök, horgászok és hajósok számára személyes értékesítéssel, bemutatókat és utáni szolgáltatást nyújtva. Szükséged van a kiskereskedelemhez optimalizált csomagolásra, bemutató egységprogramokra és értékesítési anyagokra, amelyek a walk-in vásárlókat is átalakítják.
      features:
        - 'Bemutató egységprogram: kedvezményes bemutatótermek kijelzők'
        - Kiskereskedelmi kész csomagolás polcra optimalizált doboztervezéssel
        - Értékesítési pontok kijelzők, összehasonlító táblázatok és vevői útmutatók
        - Bolti személyzet képzési és tanúsítási program
    - title: Többmárkás és áruház-forgalmazók
      subtitle: Szélesvonalú sporteszközök terjesztése
      description: Nagyszabású forgalmazók, amelyek áruházaknak, nagyáruházaknak és sportcikkláncoknak szolgálnak ki többmárkás katalógusokkal. A következetesség, a megfelelőségi dokumentáció és a beszállítók betartása kiemelten fontos — SKU mindegyiknek megfelelnie kell a kereskedő-specifikus csomagolásnak, címkézésnek és minőségi szabványoknak.
      features:
        - 'Kiskereskedői megfelelőségi dokumentáció: csomagolási specifikáció, vonalkód, címkézés'
        - EDI/ASN integráció a nagyobb kiskereskedői rendelési rendszerekhez
        - Szállító által kezelt készlet és automatikus utánpótlási programok
        - Dedikált fiókkezelés 24 órás válaszadási SLA-val
