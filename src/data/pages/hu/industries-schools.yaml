hero:
  tagline: Vízi Sport Iskolák & Képzési Központok
  title: Felszerelés Megoldások<br />SUP & Kajak Iskolák részére
  subtitle: Megbízható, kereskedelmi minőségű felszerelés evezőiskolák, szörfoktatás, kajak képzés és vízi sport oktatási programok minden méretéhez.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP deszkák iskolák és képzési központok számára
direct_answer: Aquafarer ellát SUP és kajak iskolákat világszerte kereskedelmi minőségű deszkákkal, biztonsági felszereléssel és oktatói csomagokkal. Felszereléseink napi oktatási használatra készültek — vastagabb PVC, megerősített drop-stitch magok és stabil hajótest kialakítások, amelyek magabiztosságot adnak a kezdőknek és megbízhatóságot az oktatóknak. A csomagok tartalmaznak egyedi márkajelzést, pótalkatrész programokat és képzési anyagokat.
solution_offerings:
  - title: Iskolakezdő Csomag
    subtitle: Új programok és kis képzési központok számára
    badge: Popular
    features:
      - title: Tanuló Deszkák
        description: 10–25 univerzális SUP deszka vagy szabadidős kajak stabil platformokkal a kezdő órákhoz
      - title: Oktató Deszkák
        description: Szélesebb, hosszabb deszkák extra stabilitással és csúszásmentes EVA fedélzettel az oktatáshoz
      - title: Biztonsági berendezések
        description: Mentőmellények, pórázok, sípok és dobózsákok azonos színben
      - title: Tárolás & Szállítás
        description: Egymásra rakható deszkatartók, párnázott kajak tartók és szállító kocsik
      - title: Tananyag Támogatás
        description: Óravázlatok, biztonsági ellenőrző listák és készségfejlesztési útmutatók
    cta_text: Indítsd El Az Iskolám Csomag
    cta_href: /contact
  - title: Iskola Prémium Csomag
    subtitle: Már megalapított iskolák és több programot működtető szervezetek számára
    badge: Best Value
    features:
      - title: Teljes Flotta
        description: 25–50 deszka vagy kajak vegyes flottával (univerzális, túra, ifjúsági méretek)
      - title: Oktatói Flotta
        description: 3–5 speciális oktatói deszka beépített hangrendszer tartóval
      - title: Biztonsági Állomás
        description: Központosított biztonsági felszerelés állomás PFD-kkel, rádiókkal, elsősegély készletekkel és jelzésekkel
      - title: Márkázási Csomag
        description: Teljes logó nyomtatás a deszkákon, evezőkön, PFD-ken és egyenruhákon
      - title: Karbantartási Program
        description: Negyedéves karbantartási készletek, alkatrészcsomagok és javítási képzés
    cta_text: Build Premium csomag
    cta_href: /contact
  - title: Iskolai franchise csomag
    subtitle: Többhelyszínes láncok és franchise üzemeltetők számára
    badge: Enterprise
    features:
      - title: Flottaszabványosítás
        description: Azonos felszerelés minden helyszínen a következetes diákélmény érdekében
      - title: Központi sorrend
        description: Konszolidált rendelés, tömeges árképzés és központosított alkatrész-menedzsment
      - title: Oktatóképzés
        description: Felszereléskezelési és karbantartási tanúsítvány minden oktató számára
      - title: Társbranding
        description: Közös márkaépítés franchise + Aquafarer társbranding opciókkal
      - title: Bővítés támogatása
        description: Skálázási tanácsadás, berendezés-előrejelzés és új helyszín kialakítása
    cta_text: Beszélgess a franchise tervről
    cta_href: /contact
benefits:
  - title: A napi oktatásra készült
    description: PVC Vastagabb és megerősített sínek bírják a napi diákhasználatot, a homokokra való leeséseket és a sziklás leszállásokat.
    icon: tabler:shield
  - title: Stabil tanulási platformok
    description: Szélesebb testek és laposabb rocker-ek magabiztosságot adnak a kezdőknek. Az oktatók a tanításra koncentrálnak, nem felszerelésre.
    icon: tabler:scale
  - title: Könnyű tárolás és szállítás
    description: Felfújható dizmón tárolt tárolók kis helyiségekben. A leeresztett deszkák a szabványos járműcsomagtartókba illeszkednek mobil oktatáshoz.
    icon: tabler:box-seam
  - title: Egyedi márkázás
    description: Minden táblán iskolai logók és színek. A márkád, az identitásod — nem általános bérlési felszerelés.
    icon: tabler:brush
content_segments:
  tagline: Iskolai profilok
  title: Vízsport-oktatási megoldások<br />Programtípus szerint
  subtitle: Az evezőiskolák, szörfakadémiák, egyetemi programok és franchise-üzemeltetők mind más működési kihívásokkal néznek szembe — a tanterv integrációjától a többhelyszínes flottaszabványosításig. A felszereléscsomagokat az oktatási modellhez igazítjuk.
  items:
    - title: Független SUP és kajak iskolák
      subtitle: Tulajdonos által működtetett képzési központok
      description: Kis és közepes méretű iskolák, amelyeket tulajdonos-oktatók SUP működtetnek, és tanfolyamokat, kajakképzéseket és tanúsítási tanfolyamokat kínálnak. A felszerelésnek elég tartósnak kell lennie a napi oktatáshoz, megfizethetőnek kell lennie egy kisvállalkozás költségvetéséhez, és elég sokoldalúnak kell lennie ahhoz, hogy egy flottában kezdőktől középhaladó diákokig kiszolgálhassák.
      features:
        - Stabil, SUP mindenoldalú deszkák és szabadidős kajakok kezdő órákhoz
        - Oktató-specifikus deszkák extra stabilitással vízről való edzéshez
        - Óraterv sablonok és készségfejlesztési útmutatók is tartalmaznak
        - Éves felszerelésfrissítési program cserekedvezményekkel
    - title: Egyetemi és főiskolai szabadidős programok
      subtitle: Nagyszabású diákrekreációs flották
      description: Az egyetemi szabadidős tanszékek evezőklubokat, kölcsönzési programokat és oktatási tanfolyamokat működtetnek a campus szabadidős kínálatának részeként. A felszerelések a félévek alatt a leggyakoribb használatnak számítanak, könnyű be- és kijelentkezési rendszert igényelnek, és különböző készségszinteket kell viselniük az első hallgatóktól a haladó evezőkig.
      features:
        - Nagy PVC tartósságú szerkezet, intézményi használati ciklusokra minősített
        - Színkódolt flották készségszint szerint a könnyű kezelés érdekében
        - RFID vagy matrica alapú készletkövető rendszer kompatibilitása
        - Tömeges árképzés féléves rendeléssel és fizetési feltételekkel
    - title: Szörfiskolák és Szörfakadémiák
      subtitle: Parti szörfoktatási programok
      description: Szörfiskolák SUP tanítják a szörfözést, a fekvő evezést és a szörfkajak technikáit óceáni környezetben. A felszerelésnek kezelniük kell a szörfövezeti körülményeket — az ütközésállóságot, homok- és sósvíz-tűrést, valamint az óránként végzett könnyű öblítés-visszaadást.
      features:
        - Hullámzásra specifikus formák megerősített sínekkel és ütésálló szerkezettel
        - Puha uszonyú opciók és tekercses pórázok a diákok biztonsága érdekében
        - Gyorsan öblíthető anyag, amely leszárad az órák között
        - Flottacsereprogram szezon végi ellenőrzéssel és frissítéssel
    - title: Franchise és több helyszínre működő láncok
      subtitle: Szabványosított berendezések különböző helyszíneken
      description: Több helyszíni üzemeltető, akik több városban vagy régióban futtatnak szabványosított képzési programokat. A flotta egységessége helyszínenként kiemelt fontosságú — minden diáknak ugyanazt a felszerelési élményt kell élveznie, függetlenül attól, melyik franchise helyszínt látogatja. A központosított rendelés, a márkázott egységesség és a skálázási támogatás elengedhetetlen.
      features:
        - Azonos flottaspecifikációk minden franchise helyszínen
        - Központosított konszolidált rendelés volumenárazással
        - 'Közös márkaépítési lehetőségek: franchise márka + Aquafarer közös márka'
        - 'Új helyszínbeállítási készlet: felszerelés, táblák és nyitókészlet'
