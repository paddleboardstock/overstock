hero:
  tagline: K+F Központ
  title: Kutatási és fejlesztési központ
  subtitle: A fejlődésre fókuszált
intro:
  - AquafarerA Kutatás-Fejlesztési (R&D) Központ a vízisport-felszerelések forradalmasításának mozgatórugója. A vízisport-rajongóknak világszerte biztonságosabb, kényelmesebb és élvezetesebb termékeket kínálunk a felfújható felfújható lapodeszkák SUPs() és hajók folyamatos innovációjával. Elkötelezett mérnökök, tervezők és szenvedélyes vízsport-szakértők csapatunk alakítja az iparág jövőjét, folyamatosan emelve a minőség, teljesítmény és fenntarthatóság mércéjét.
  - Kutatás-fejlesztési létesítményünk egy fedél alatt gyűjti össze anyagtudósokat, hajóépítészeket és gyártásmérnököket. A szövet kialakításától és hajótest-szimulációtól kezdve a hegesztési folyamatfejlesztésen át a teljes körű tengeri próbákon át a termékfejlesztés minden szakaszát adatok vezérlik, és teszteléssel validálják.
mission:
  tagline: Küldetésünk
  title: A vízsportok jövőjének innovációja
  pillars:
    - icon: lightning
      title: Technológiai fejlődés
      desc: Úttörő új anyagok, dizájnok és gyártás terén a kiváló termékteljesítmény és hosszú élettartam érdekében.
    - icon: design
      title: Felhasználóközpontú tervezés
      desc: A felhasználói igények mély megértése és túlmutatása ergonikus és intuitív terméktervezéssel.
    - icon: globe
      title: Fenntartható gyakorlatok
      desc: Környezeti lábnyomunk minimalizálása környezetbarát anyagok és eljárások alkalmazásával.
    - icon: shield
      title: Kompromisszummentes biztonság
      desc: A legmagasabb biztonsági előírások biztosítása szigorú teszteléssel és tanúsítással.
pillars:
  - title: Technológiai fejlődés
    desc: Úttörő új anyagok, tervezések és gyártási folyamatok bevezetése, hogy kiváló termékteljesítményt és hosszú élettartamot biztosítsunk.
    icon: tech
  - title: Fejlett anyagok
    desc: A PVClegmodernebb, , Hypalonkompozitok és fenntartható alternatívák kutatása a termékjellemzők javítása érdekében.
    icon: materials
  - title: Fenntarthatóság
    desc: 'Alapvető elkötelezettség: Elkötelezettek vagyunk a környezetvédelem mellett fenntartható gyártás és újrahasznosítható anyagok révén.'
    icon: sustainability
capabilities:
  tagline: Képességek
  title: Kutatási és fejlesztési képességek
  subtitle: Négy alapvető tudományág, amelyek végpontig irányítják a termékfejlesztést — a nyersanyag-kutatástól a végső tanúsításig.
  groups:
    - title: Anyagtudomány és Textiltechnológia
      items:
        - PVC valamint Hypalon a formuláció elemzése és optimalizálása
        - UV stabilizáció, lángvisszatartóság és antimikrobiális adalékok fejlesztése
        - Többrétegű anyaglamináció és tapadási mérnökség
        - Gyorsított öregedési tesztek (UVhő, páratartalom, sóspray)
    - title: Hajótestmérnökség és hidrodinamika
      items:
        - Paraméteres 3D hajótesttervezés és CFD optimalizálás
        - Végeselemes analízis szerkezeti és ütközési terhelésekre
        - Méretarányos vontatómedence tesztelés és teljesítményellenőrzés
        - Egyedi hajótest fejlesztés különleges küldetésprofilokhoz
    - title: Hegesztés és csomópont-technológia
      items:
        - RF dielektromos hegesztési folyamat fejlesztés és optimalizálás
        - Forrólevegős, forróéles és ultrahangos hegesztési módszerek
        - Ragasztott kötés és varratzsín minősítés
        - Hegesztési szilárdság modellezése és élettartam előrejelzés
    - title: Tesztelés, minősítés és megfelelőség
      items:
        - Minőségirányítás és CE megfelelőségi tesztelés
        - Független harmadik fél általi tesztelés és tanúsítási támogatás
        - Egyedi tesztprotokoll fejlesztés beszerzési kvalifikációhoz
        - Üzemben bekövetkező hibák elemzése és okfeltárás
