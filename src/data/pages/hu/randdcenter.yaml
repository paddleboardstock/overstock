vision:
  tagline: Látásmódunk
  title: A vízsportok jövőjének formálása
  body: Aquafarer arra törekszik, hogy vezesse a fújható hajót és SUP az ipart folyamatos innovációval, rendíthetetlen minőséggel, valamint a biztonság és fenntarthatóság iránti rendíthetetlen elkötelezettséggel — végső soron gazdagítva a vízsport-rajongók tapasztalatait világszerte. Aquafarer Az R&D Center az, ahol a szenvedély találkozik az innovációval, új mércéket állítva fel a vízisportok iparágában.
labs_section:
  tagline: Laborok
  title: Laboratóriumaink
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC Anyaglabor
      description: Folyamatos kutatás és tesztelés PVC Hypalon a csövek szöveteinek húzószilárdsága, UV ellenállása, elsparzódása és alacsony hőmérsékleti rugalmassága érdekében, hogy hosszú távú megbízhatóságot biztosítsanak a tengeri környezetben.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Hull Mérnöki Stúdió
      description: CAD-alapú tervezés és véges elem elemzése HDPE, alumínium és üvegszálas hajótestek esetében. Minden hajótest digitálisan szimulálható a feszültségeloszlás és az ütközésellenállás szempontjából, mielőtt az első prototípus megépülne.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: RF Hegesztőközpont
      description: Dedikált rádiófrekvenciás hegesztőüzem precíziós hőmérséklet- és nyomásszabályozással, amely nagy szilárdságú, légzáró varrásokat készít, amelyek megfelelnek a felfújható hajók tengeri ipari szabványainak.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Hidrodinamikai teszttartály
      description: Méretarányos tesztek a házi teszttartályunkban, hogy optimalizálják a hajótest formáját, síkozási teljesítményét, stabilitását és üzemanyag-hatékonyságát különböző terhelés- és tengeri körülmények között.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototípus műhely
      description: Teljes méretű prototípus és riggelési létesítmény, ahol új modelleket építenek, szerelnek és tengeren tesztelnek. Minden prototípus legalább 20 órás vízi tesztprogramon megy keresztül a gyártási jóváhagyás előtt.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Minőségi és Ellenőrzési Labor
      description: Dedikált minőségbiztosítási laboratórium, amely húzólésvizsgálatot, levegővisszatartási ciklust, varrat-lehúzási teszteket és anyagtanúsítást végez, hogy minden műhelyből távozó hajó megfeleljen a közzétett előírásainknak.
      href: /randdcenter/quality-inspection-lab
