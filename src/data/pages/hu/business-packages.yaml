faq:
  title: Csomag FAQ
  questions:
    - q: Mi a csomagok minimális rendelési mennyisége?
      a: A Club Starter Csomag minimális mennyisége 10 darab. A Resort és Márka csomagok az Ön igényeihez igazíthatók rugalmas MOQs mellett.
    - q: Mennyi ideig tart a szállítás?
      a: A standard gyártás 30–45 nap a rendelés megerősítésétől számítva. A gyorsított gyártás további díj ellenében elérhető.
    - q: Testreszabhatom a felszerelés színeit és márkáját?
      a: Igen. Minden csomag teljes testreszabást tartalmaz — tábla színek, logó nyomatok és csomagolás tervezése.
    - q: Biztosítanak-e értékesítés utáni támogatást?
      a: Igen. Minden csomag hozzáférést biztosít online karbantartási útmutatóinkhoz, videó oktatóanyagokhoz és pótalkatrész-rendelési rendszerünkhöz.
