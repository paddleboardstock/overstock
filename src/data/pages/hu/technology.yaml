sections:
  - title: Drop-Stitch Mag
    standard: 12-15 PSI működési nyomás
    description: Többezer belső poliészter szál köti össze a felső és az alsó rétegeket, merev szerkezetet hozva létre 12-15 PSI-en. Ugyanezt a technológiát használják professzionális paddle boardok és felfújható versenyhajók esetében. A drop-stitch sűrűség modellenként optimalizált a merevség és a súly ideális egyensúlyához.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: DS magdiagram
  - title: Tengeri minőségű PVC
    standard: Fúziós hegesztés | UV / sós víz / kopás tesztelt
    description: Többrétegű laminált PVC szövet tengeri környezethez. Minden réteg fúzióval hegesztett, nem ragasztott, így megszűnik a delaminációs kockázat. Tesztelve UV ellenállásra (ASTM G154, 1000+ óra), sós víz korrózió (ISO 9227) és kopás (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: PVC réteg
  - title: Hypalon csövek
    standard: CSM gumi | UV / vegyszer / extrém hőmérséklet ellenálló
    description: Használt RIB modelleken, Hypalon (CSM) gumi kiemelkedő UV és vegyszer ellenállást biztosít a standard PVC-hez képest. A Hypalon csövek extrém hőmérsékleten is megőrzik rugalmasságukat, és ellenállnak az üzemanyag- és olajhatásoknak. Minden varratot tanúsított technikus kézzel helyez.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Air Deck padló
    standard: Nagy nyomású felfújható | Helyettesíti a rétegelt lemezt/alumíniumot
    description: Nagy nyomású felfújható padló rendszer, amely a hagyományos rétegelt lemez vagy alumínium léc padlókat helyettesíti. Csökkenti a beállítási időt, az összsúlyt és a tárolási térfogatot, miközben megfelelő merevséget biztosít álláshoz, horgászathoz és sétához. Tesztelve 200 kg elosztott terhelés támogatására.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Légialap
