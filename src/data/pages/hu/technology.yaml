testimonial:
  quote: Amitől megvásároltam, az az építés. Összeforrasztott varratok ragasztás helyett, egy drop-stitch mag, amely 12-15 PSI fokon szilárdnak tűnik, és nincs billegés, amikor hátralépek, hogy forduljak. Két év után, nullás probléma.
  author: Marta Keller
  title: Ellenőrzött vásárló
  company: Tavi túra evezős
  location: Németország
sections:
  - title: Drop-Stitch mag
    standard: 12-15 PSI működési nyomás
    description: Több ezer belső poliészter szál köti össze a felső és alsó réteget, merev struktúrát hozva létre 12-15 PSI-on. Ez ugyanaz a technológia, amelyet a professzionális lapátos deszkákhoz használnak. drop-stitch sűrűségünket modell szerint optimalizáltuk az ideális merevség és súly arányára.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS magdiagram
  - title: Tengeri minőségű PVC
    standard: Fúziós hegesztés | UV / sós víz / kopás tesztelt
    description: Többrétegű laminált PVC szövet, amely tengeri környezetre van minősítve. Minden réteget a ragasztás helyett összeolvasztottak, így kiküszöbölve a rétegleválás kockázatát. Tesztelve UV ellenállásra (1,000+ óra), sós víz korrózió és kopás ellen.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC réteg
  - title: EVA Fedélrendszer
    standard: Tapadós, kényelmes, art-sorozat minták
    description: Teljes fedél EVA hab biztosít tapadást, párnázást és a jellegzetes art-sorozat megjelenést. A precízen vágott panelek illesztve vannak varratmentes mintába — nincs nyomtatott grafika, ami lepattanhat, nincs szükség viaszra.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: EVA Fedél
  - title: Hármas rétegű peremrendszer
    standard: Fúziós kötésű | A legnagyobb igénybevételnek kitett zónában túlméretezett
    description: A peremszalagok háromrétegű fúziós kötésűek, és a deszka szélére vannak tekerve — ez a legnagyobb igénybevételnek kitett zóna bármely felfújható deszkán. Itt hibásodnak meg először az olcsó deszkák; a miénk túlméretezett.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Peremrendszer
