overview_section:
  tagline: Piaci áttekintés
  title: A mexikói SUP piac
  paragraphs:
    - Mexikó két legnagyobb tengerparti turisztikai partvonalat kínál. A karibi oldal — Cancún, Playa del Carmen, Tulum, Cozumel — sík, meleg, türkiz vizet kínál, amely gyakorlatilag állóban evezhető, míg a csendes-óceáni oldal — Puerto Vallarta, Sayulita, Los Cabos — ötvözi a szörfkultúrát védett öblékkel, amelyek ideálisak órákra és bérlésre. Az egész évben tartó turizmus állandóan tartja a keresletet, és a növekvő mexikói evezős közösség helyi boltokat kínál a látogatások között.
    - The typical buyer here is a small beach business: egy evezős iskola, amely deszkákat árul diákjainak, egy butik SUP hotel, amely növeli vendégélményét, egy szörfbolt, amely sík vízré bővül, vagy egy online eladó, amely a hazai piacot szolgálja. A rendelések 5–20 deszkát kínálnak, amelyek tartós, mindenképp használható modelleket kínálnak órákra és bérlésre, valamint néhány prémium kiadást kiskereskedelmi kiállításra.
  customer_types:
    - title: Karib-tengerparti üzemeltetők
      description: A parkparkok és bérleti standok Cancúnban, Tulumban és Playa del Carmenben szolgálják ki a napi turistaigényt.
    - title: Boutique szállodák
      description: Kis szállodák és vendégházak kompakt SUP vegyes flottával vendégprogramokat adnak hozzá.
    - title: Online eladók
      description: Mexikói e-kereskedelmi eladók importálják első SUP készletüket a hazai piacra.
shipping_section:
  title: Hajó Mexikóba
  paragraphs:
    - A rendelések Weihaiból, Kínából szállítják. Az expressz légi áruszállítás gyorsan szállít mintákat és 1–3 felfedőrendelést Mexikóvárosba és az üdülőrepülőterekre; a konszolidált tengeri áruszállítás 5–20 fedélzeti nagykereskedelmi megrendelést szolgál ki Mexikó Csendes-óceáni és öböl-öböl kikötőin. Mindkét opció árajánlatot kap, becsült átszállítási időkkel a célállomás számára.
    - Biztosítjuk a kereskedelmi számlát és csomagolási listát, amelyekre a vámbrókernek szüksége van, helyes HS-kódokkal és bejelentett értékekkel. Az importőr fizeti az importőr vámját és adóját a mexikói szabályok szerint.
  customs_note: Mexikó sportfelszerelések importrendszere brókervezérelt — egyeztessen meg ügynökével, hogy megrendelés előtt ellenőrizze a jelenlegi vámot és adókezelést. Teljes és következetes dokumentációt biztosítunk a zökkenőmentes kizárás érdekében.
faq_section:
  title: Mexikó GYIK
  items:
    - q: Elérhető-e az ajánlatok és a támogatás spanyolul is?
      a: Igen — spanyolul beszélő vevőkkel dolgozunk Latin-Amerikában. Kérdezze meg a kérdését, és mi kezeljük az árajánlatát és rendelését spanyolul.
    - q: Milyen egy első rendelés egy tulum- vagy cancúni boltban?
      a: 'A legtöbb 5–10 táblával indul: kezdőbarát, mindenképű modellek alapja a turistapiacra, valamint egy-két prémium műalkotás kiállításra és kiskereskedelmi értékesítésre. Vegyes modellek, egy szállítmány, teljes mennyiség szerinti árak.'
    - q: Hogyan jutnak el a táblák Mexikóba?
      a: Levegőszállítás minták és sürgős kis megrendelések esetén; konszolidált tengeri fuvar nagykereskedelmi mennyiségekre, kikötőnkénti árajánlattal. Mindkettőt tételesen feltüntetjük az árajánlatban a becsült szállítási időkkel.
    - q: Ki intézi a mexikói importvámot?
      a: Ön, mint importőr, a vámügynökén keresztül. Mi biztosítjuk a kereskedelmi számlát és a csomagolási listát a helyes HS kódokkal, így az Ön ügynöke kiszámítható módon lebonyolíthatja a szállítmány vámkezelését.
