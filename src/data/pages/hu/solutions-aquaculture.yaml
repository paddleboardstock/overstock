content_challenge:
  tagline: A kihívás
  title: Akvakultúra igényei<br />Sós vízhez álló felszerelés
  subtitle: A halfarmok, gyöngyültetvények és óceáni ranchok a legkémiailag agresszívebb tengeri környezetben működnek — hosszan tartó sós vízi kitettség, üzemanyag- és takarmánymaradványok, valamint folyamatos napi használat.
  paragraphs:
    - Az akvakultúra műveletei évente 365 napon működnek a kitett part menti és tengeri környezetekben. A ketrec ellenőrzésére, takarmányszállításra, gyöngyzsinór-karbantartásra és berendezések karbantartására használt munkahajók folyamatos sós víz bemerülésnek, UV kitettségnek és vegyi érintkezésnek vannak szembesülnek üzemanyagokkal, haltakarmányokkal és szennyeződésellenes kezelésekkel.
    - '**A korrózió a fő ellenség** — A szabványos tengeri felszerelés gyorsan romlik ezekben a körülményekben. A külső motorokat, utánfutó vázakat és hajótest szerelvényeket folyamatosan cserélni kell. Az üzemeltetőknek olyan hajókra van szükségük, amelyeket korrózióálló, korrózióálló anyagokból építettek, és amelyek évekig képesek ebben a környezetben túlélni anélkül, hogy megromlnának.'
    - '**A napi megbízhatóság kritikus** — Egy meghibásodott munkahajó elmaradt etetési ütemtervet, késleltetett betakarítást és drága termelésveszteségeket jelent. A gyöngyfarmok esetében egyetlen napos kimaradt ellenőrzés jelentős terméskárokat okozhat. A halfarmok esetében a késleltetett etetés befolyásolja a növekedési ütemet és a jövedelmezőséget.'
    - Paddle Board Overstock Az akvakultúrát RIBs korrózióálló hardverekkel, nehéz Hypalon csövekkel és megerősített hajótestekkel tervezték, amelyeket kifejezetten a haltenyésztés, gyöngytermesztés és óceáni tenyésztés igényes körülményekhez terveztek.
content_solution:
  tagline: Megoldásunk
  title: Kifejezetten Épített RIBs<br />Az akvakultúra iparának
  subtitle: Minden Paddle Board Overstock akvakultúra munkahajó úgy van tervezve, hogy ellenállja az agresszív sós vízi környezeteket, miközben megbízható napi teljesítményt nyújt.
  list:
    - Tengerészeti minőségű Hypalon csövek — kiváló ellenállás UVa sós víz, üzemanyagok és haltakarmány vegyszerei ellen
    - 316 rozsdamentes acél szerelvény végig — nincs rozsda hosszan tartó sós víz hatása alatt
    - Megerősített dörzsölősztesek és gerincvédő ismétlődő dokk- és ketreckontaktushoz
    - Önállóan elhúzható terasz a könnyű mosáshoz és vízelvezetéshez a takarmányszállítás és betakarítás után
    - Lapos fedélzeti konfiguráció takarmányzsákok, betakarító tartályok és felszerelések szállításához
    - Külső szerkezetek HP 15-től HP 60-ig — optimalizálva a hasznos teher és az üzemanyag-hatékonyság arányára
    - Jól látható csőszínek a nagy mezőgazdasági területeken való könnyű észleléshez
content_segments:
  tagline: Akvakultúra profilok
  title: Munkahajó megoldások<br />Akvakultúra típus szerint
  subtitle: A különböző akvakultúra műveleteknek eltérő munkahajó igényei vannak — a kis agilis RIBs halketrec-ellenőrzéshez a stabil szállító platformokig gyöngytenyésztéshez és a nehézteherautós munkahajókig az óceáni tenyésztéshez.
  items:
    - title: Haltenyésztési tevékenységek
      subtitle: Ketrec ellenőrzése, takarmányszállítás, betakarítási támogatás
      description: A tengeri halfarmok ketreceket üzemeltetnek kitett part menti és tengeri területeken. A munkahajókat naponta használják ketrechálók ellenőrzésére, etetési műveletekre, betakarítási támogatásra és berendezések karbantartására. A fő kihívás a korrózió — a hajók folyamatosan sós víznek, haltakarmánymaradványoknak és üzemanyagnak vannak kitéve. Egy megbízható munkahajó elengedhetetlen, mert a kimaradt táplálás vagy késleltetett betakarítás közvetlenül befolyásolja a termelési eredményt és a nyereségességet.
      features:
        - 'Agresszív környezeti csomag: 316 rozsdamentes acél hardver, tengeri minőségű ötvözet alkatrészek'
        - Lapos fedélzeti elrendezés takarmányzsák és betakarítási láda szállításához
        - Önmagát besülő fedélzet a könnyű lemosáshoz a műtét után
        - Hypalon csövek, amelyek vegyszerálló bevonattal rendelkeznek táplálkozáshoz és üzemanyag-expozícióhoz
        - Megerősített dörzsölősléçek a gyakori ketrec- és dokkkapcsolathoz
    - title: Gyöngygazdálkodási műveletek
      subtitle: Stabil szállítás gyöngyvonal ellenőrzéséhez és betakarításához
      description: A gyöngyfarmokhoz stabil, megbízható munkahajók szükségesek a gyöngykötelek napi szállításához, osztrigahálók ellenőrzéséhez és betakarításhoz. Ezek a műveletek távoli part menti helyeken zajlanak, ahol korlátozott karbantartási infrastruktúra van. A hajónak elég stabilnak kell lennie ahhoz, hogy a legénység dolgozhasson a gyöngykötélek ellenőrzése közben, könnyű beszállással és bőséges fedélzeti térlel a betakarított osztriga, hálók és ellátmány szállítására. A megbízhatóság és a könnyű karbantartás kritikus a távoli farmhelyeken.
      features:
        - Stabil törzstervezés álló személyzet számára a gyöngykötél ellenőrzése során
        - Sík fedélzet csúszásmentes felülettel a személyzet biztonságos mozgásához
        - Alacsony szabaddeszkán könnyű osztrigaháló és betakarítás lehetősége
        - Egyszerű külső szerkezet a helyszíni karbantartás megkönnyítéséhez
        - Korrózióálló cső és hardvercsomag folyamatos sósvíz-kitettséghez
    - title: Óceángazdálkodás és tengeri fejlesztés
      subtitle: Fiatalkorú szállítás, ketrec karbantartása, megfigyelési támogatás
      description: Az óceáni tenyésztési műveletek közé tartozik a fiatal állatok kezelt tengeri környezetbe való beengedése, növekedés monitorozása és javító szerkezetek karbantartása. A munkahajóknak élő fiatal állatokat kell szállítaniuk légződő konténerekben, megfigyelő berendezéseket hordozniuk, és hozzáférést kell elérniük sekély part menti szabadon engedő helyekre. A hajótest tervezésének egyensúlyban kell egyensúlyoznia a teherbírással és a sekély merüléssel a part- és torkolathoz való hozzáféréshez.
      features:
        - Fedélzeti tér a szellőztetett fiatal szállító konténerek és megfigyelő eszközök számára
        - Sekély huzat a strand és torkolati kibocsátási területhez
        - Könnyű partraszállás — megerősített gerinc- és orrvédelem
        - Elektronikai és mintavételi eszközök rögzítési pontjai
        - Különösen erős Hypalon csövek tartósságért kevert homok- és tengervíz körülmények között
