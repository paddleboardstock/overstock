content_challenge:
  tagline: A kihívás
  title: Mentőakciók iránti igény<br />Kompromisszummentes megbízhatóság
  subtitle: A kereső- és mentőszervezetek rendkívüli biztonsági felelősséggel működnek — minden hajóhiba elfogadhatatlan következményekkel jár.
  paragraphs:
    - A mentési műveletek során a siker és a kudarc közötti különbséget percekben kell mérni. A hajónak azonnal készen kell állnia a vízrebocsátásra, durva körülmények között kell működnie, és biztonságosan visszatérnie kell az utasokkal. A biztonsági felelősség abszolút — egy mechanikai hiba a mentési küldetés során nem javítási költség, hanem életvesztés.
    - A SAR-hajóknak nagy sebességre van szükségük ahhoz, hogy gyorsan elérjék az áldozatokat, és kivételes stabilitással együtt kell a biztonságos mentési műveletekhez. Mentőfelszerelést, orvosi felszerelést és kommunikációs felszerelést kell hordozniuk — gyakran korlátozott fedélzeti helyen. A kormányzati szolgálatban lévő hajóknak hosszú élettartamra (10-15+ évre) van szükségük ahhoz, hogy igazolják a közbeszerzési költségvetést.
    - A láthatóság mind a kezelő, mind a keresés szempontjából kritikus. A konzoltervezésnek 360 fokos látótávolságot kell biztosítania, és a hajónak jól láthatónak kell lennie a repülőgépek és más hajók számára.
    - A Paddle Board Overstock mentési egységeket RIBs a gerinctől felfelé tervezik ezekhez a követelményekhez — önmagát beugró fedélzetek, megerősített hajótestek, navigációs rendszerek és vontató oszlopok a járőrmodelleken alapfelszereltséggel.
content_solution:
  tagline: Megoldásunk
  title: Kifejezetten Épített Mentés RIBs
  subtitle: Minden Paddle Board Overstock mentőhajót úgy terveztek, hogy megfeleljen vagy túlszárnyalja SOLAS az országos SAR-szabványokat.
  list:
    - Önállóvás fedélzet — a víz automatikusan lefolyik a stabilitás érdekében a helyreállítási műveletek során
    - Megerősített mély-V törzs — mérges vízi képesség, kiszámítható kezelhetőséggel nagy sebességnél
    - Teljes navigációs lámpakészlet — éjjel-nappal működőképes minden időjárási körülmények között
    - Vontatóoszlop és vontató kötél — készen áll a hajóvontatásra vagy mentőszán műveletekre
    - Felszerelés rögzítőtáblák — rádió, reflektor, sziréna és orvosi berendezések
    - Több motorkonfiguráció — egymotoros vagy kétmotoros redundancia
    - Nagy láthatóságú csőszínek — narancs, sárga vagy piros a maximális láthatóság érdekében
content_segments:
  tagline: Mentőprofilok
  title: Kereső- és mentővízi járművek megoldásai<br />Szervezeti típus szerint
  subtitle: Különböző mentőszervezetek különböző megbízások, költségvetési ciklusok és működési környezetek szerint működnek — a part menti önkéntes legénységektől a nemzeti parti őrség flottáiig. Minden mentést úgy konfigurálunk RIB , hogy illeszkedjen a küldetés profiljához.
  items:
    - title: Parti Őrség és Kormányzati Kutatás-Végrehajtási Ügynökségek
      subtitle: Abszolút biztonsági felelősség — küldetéskritikus flottaszabványok
      description: A kormányzati SAR-ügynökségek viselik a legmagasabb biztonsági felelősséget a tengeri műveletek során. Minden hajónak hibátlanul kell teljesítenie extrém körülmények között — a mentőakció során meghibásodás nem opció. A beszerzési döntéseket a 10-15 éves élettartam alatt összesen a tulajdonlási költség határozza meg, nem az előzetes ár. Az ügynökségeknek olyan hajókra van szükségük, amelyek évekig túlélik a part menti járőrözést, megfelelnek a szigorú nemzeti szabványoknak, és következetes teljesítményt nyújtanak az elosztott állomásokon. Átfogó megfelelőségi dokumentáció és többéves szolgáltatási megállapodások kötelezőek.
      features:
        - SOLAS valamint nemzeti SAR szabványoknak megfelelési dokumentáció csomagja
        - A flotta-szintű alkatrész közös – csökkentse az állomásszintű készlet összetettségét
        - Kétmotoros konfiguráció a kritikus redundancia érdekében
        - 10-15 éves élettartam-tervezés ütemezett karbantartási programokkal
        - Minden időjárási körülmények között alkalmas – megerősített mély-V törzs viharos tengeri állapotokhoz
    - title: Életmentő és Tengerparti Mentőszolgálat
      subtitle: Gyorsindítás, sekély vízi műveletek
      description: Az önkormányzati és tengerparti mentőszolgálatoknak gyors reagálású hajókat kell használniuk, amelyek képesek átindulni a hullámzónákon, sekély partközeli vizeken működni, és perceken belül elérni az úszókat vagy a bajba jutott hajókat. A felszerelésnek elég könnyűnek kell lennie ahhoz, hogy kis járművel vagy kézzel vontatható legyen a parton.
      features:
        - Sekély RIB merülésű törzs a szörfös zónához és partközeli műveletekhez
        - Partraszállásra alkalmas, orr emelő fogantyúval és gerincvédővel
        - Integrált mentőszán vagy úszóplatform
        - Jól látható narancssárga vagy sárga csőszínek szabványos
    - title: Tűzoltóvédelmi osztályok
      subtitle: Tűzszivattyú integráció, berendezések beszerelése, gyors reagálás
      description: A tűzmentő tengeri egységek reagálnak a vízparti szerkezeti tüzekre, hajótüzekre és vízi mentőeseményekre. Ezekben a hajókban tűzoltó szivattyúkat, monitorokat, tömlőtárolókat és légzőkészülékeket kell hordozniuk — mindezt egy stabil, gyors reagáló platformba integrálják. Az osztályok ezeket a hajókat árvízvédelmi és kölcsönös segélyakciókra is használják. A konzolok elrendezésének biztosítaniuk kell a szivattyúvezérlést, rádiórendszereket és vészvilágítást anélkül, hogy veszélyeztetnék a fedélzeti területet a személyzet mozgásához.
      features:
        - Orrra szerelt tűzérzékelő szivattyú integrációs csomaggal
        - Dedikált berendezés szerelvények tűzoltószivattyúhoz, tömlőtároláshoz és BA készletekhez
        - Konzolelrendezés konfigurálható szivattyúvezérléshez, rádióhoz és vészvilágításhoz
        - Önállóan felmerülő fedélzet tűzoltó víz lefolyásához és stabilitásához
        - 'Éjszakai műveleti csomag: reflektor, jelenetvilágítás, kék/piros fénysáv'
    - title: Tengerészeti rendőrség és kikötőbiztonság
      subtitle: Megtiltás, járőrözés, beszállási műveletek
      description: A tengerészeti rendvédelmi egységeknek olyan hajókat kell megkérniük, amelyek képesek nagy sebességű üldözésre, gyanús hajó beszállásra és kikötői biztonsági járőrözésre. Ezeknek a hajóknak biztonságos tárolásra van szükség az ellenőrző felszerelés és fegyverek számára, kommunikációs integrációval a partparancsnoksággal, valamint elegendő fedélzeti térséggel a beszállási csapatok műveleteihez. Az éjszakai műveleti képesség és alacsony profilú megközelítés elengedhetetlen az eltiltó küldetésekhez.
      features:
        - Nagy sebességű üldözési képesség — 40 csomós végsebességgel síkozó hajótest+
        - Biztosítsd a fegyverszekrény és a végrehajtó felszerelés tárolórekesek
        - Konzolintegráció rendőrségi rádió, MDT és kommunikációs rendszerek számára
        - 'Éjszakai műveleti csomag: IR reflektor, FLIR tartó, rejtett világítás'
        - Megerősített felszállásplatform csúszásmentes felülettel
        - Kék/piros vészvilágítás és sziréna rendszer
    - title: Önkéntes SAR és nonprofit szervezetek
      subtitle: Támogatással finanszírozott, közösségi alapú part menti és tói műveletek
      description: Közösségi mentőcsoportok tavakban, folyókban és part menti területeken működnek, ahol a kormányzati kutatás-végrehajtási lefedettség korlátozott. Gyakran adományokból vagy állami támogatásokból finanszírozzák ezeket a szervezeteket, amelyek dolláronként maximális kapacitásra van szükségük — egy megbízható, alacsony karbantartást igénylő hajóra, amelyet önkéntesek biztonságosan tudnak használni minimális dedikált képzéssel. A támogatási beszerzési ciklusok azt jelentik, hogy a hajóknak megfelelniük kell a megfelelőségi követelményeknek, miközben a fix költségvetésen belül kell maradniuk.
      features:
        - Egymotoros konfiguráció, optimalizálva az alacsonyabb beszerzési és üzemeltetési költségekre
        - PVC Építés alacsonyabb karbantartást és könnyű terepi javítást biztosít
        - Többfunkciós konzol, amely minimalizálja az elektronikus bonyolultságot az önkéntes operátorok számára
        - Támogatási megfelelőségi dokumentáció a finanszírozási pályázatokhoz
        - Könnyű kialakítás partraszállásra dedikált utánfutó vagy daru nélkül
    - title: Árvízmentés és katasztrófakezelés
      subtitle: Belföldi áradások, sekély víz, törmelékekkel teli környezetek
      description: Az árvízmentés egy különálló működési profil — a hajók elárasztott városi területeken, törmeléktel teli áramlatokban és rendkívül sekély vízben működnek, ahol a víz alatti akadályok láthatatlanok. Az üzemeltetőknek olyan hajókra van szükségük, amelyek képesek elárasztott utcákon navigálni, áttörni a törmelékeket, és kimenteni az áldozatokat az épületekből és járművekből. A sekély merülési képesség kritikus, akárcsak az áramlatban való működés képessége akadozó veszélyekkel. Ezeket a hajókat gyakran alkalmazzák tűzoltóságok, polgárvédelem és katasztrófaelhárító civil szervezetek.
      features:
        - Ultrasekély merülés — 30-50 cm mély vízben működik
        - Törmelékhajtó orr és megerősített csővédelem a víz alatti akadályok esetén
        - Önmagát megtisztító fedélzet árvízvíz lefolyásához és az áldozatok kiépüléséhez
        - Nagy láthatóságú narancssárga vagy sárga csövek a légi felderítéshez
        - Könnyű kialakítás helikopter szállításához és közúti telepítéshez
        - Megerősített emelőpontok a felemelő- és kötélmentési műveletekhez
