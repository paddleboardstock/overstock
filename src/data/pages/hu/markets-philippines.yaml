overview_section:
  tagline: Piaci áttekintés
  title: A Fülöp-szigeteki SUP Piac
  paragraphs:
    - Több mint hétezer szigettel a Fülöp-szigetek az állóban evezésre épülnek. Az El Nido és Coron lagúnái, Siargao laza szörf- és sziget-hangulata, Boracay strandklub energiája, valamint Cebu merülő- és vízsportos gazdasága mind folyamatos keresletet teremtenek — a turistáktól kezdve, akik napfelkeltekében eveznek egy mészkő lagúnában, SUP egészen a helyiekig, akik fitnesz és jóga közösségeket építenek Manilában és azon túl.
    - The buyers are typically resort and tour operators: szigeti üdülőhelyek, amelyek vendégtevékenységet adnak hozzá, amely nem igényel üzemanyagot, motort és engedélyt; szigetek közötti túraszervezők bővítik kínálatukat; és kis boltok, amelyek a hazai evezős közösséget szolgálják ki. A rendelések kicsik — 5–20 deszkával — és keverednek a stabil, mindenre ható deszkákkal az első alkalommal indulók, valamint néhány prémium kiadás az üdülőház megjelenéséhez.
  customer_types:
    - title: Szigeti üdülőhelyek
      description: Palawan, Siargao és Boracay üdülőhelyek SUP vendégprogramokat adnak hozzá kompakt vegyes flottával.
    - title: Utazásszervezők
      description: Sziget-ugráló és lagúna túraszervezők evezőező megállókat adnak az útvonalaikhoz.
    - title: Helyi boltok és iskolák
      description: Városi iskolák és üzletek, amelyek a növekvő filippínó evezős és SUP jóga közösséget szolgálják ki.
shipping_section:
  title: Hajó a Fülöp-szigetekre
  paragraphs:
    - A rendelések Weihaiból, Kínából szállítanak. Expressz légi áruszállítás gyorsan szállítja mintákat és 1–3 fedélzeti megrendelést Manilába és Cebuba; a konszolidált tengeri áruszállítás 5–20 fedélzeti nagykereskedelmi megrendelést szolgál ki Manilán és más Fülöp-szigeteki kikötőkön keresztül. A célállomás tranzit becslése – metró vagy tartományi – szerepel az árajánlatban.
    - Megadjuk a kereskedelmi számlák és csomagolási listák engedélyezéséhez szükséges követelményeket, helyes HS kódokkal és bejelentett értékekkel. Az importőr fizeti az importőr vámokat és adókat a Fülöp-szigeteki szabályok szerint.
  customs_note: Tartományi célok esetén a végső szállítás a kikötőből vagy repülőtérről a háztól házig tartó árajánlat részeként kerül feltüntetésre. Erősítse meg a sportfelszerelések aktuális importvámi kezelését a brókerével; teljes dokumentációt biztosítunk.
faq_section:
  title: Fülöp-szigetek GYIK
  items:
    - q: Mennyi ideig tart a szállítás a Fülöp-szigetekre?
      a: Ez a módszertől függ. Gyorsgyorsjárati légi áruszállítás Manilába vagy Cebuba a leggyorsabb választás mintákhoz és 1–3 fedélzeti megrendeléshez; 5–20 bevonóban nagykereskedelmi megrendelést kínál, és árajánlatot kap a kikötő tranzitablakával. Mindkét becslést részletesen felsorolják az ajánlatodban, mielőtt elkötelezi magát.
    - q: Elérhetik a táblák olyan tartományi szigeteket, mint Palawan vagy Siargao?
      a: Igen — a tartományi célállomásokra történő háztól házig szállítást a fuvarbecslés részének tekintjük, a beérkezési kikötőből vagy repülőtérről induló belföldi logisztikai szolgáltatás igénybevételével. Kérjük, vegye figyelembe a becslést és az opciókat a megkeresésében, és mi konkrétan árazni fogjuk azt.
    - q: Milyen egy üdülőhely kezdő flottája?
      a: 'Általában 5–10 deszka: stabil, mindenre alkalmas modellek vendégórákhoz és szabad evezéshez, plusz egy-két prémium művészeti kiadás a tengerparti használatra. Vegyes modellek, egy szállítmány, az összmennyiség alapján árazva.'
    - q: A deszkák megfelelnek lagúna és zátony-síkság használatra?
      a: Igen — a nyugodt, sekély, meleg víz pontosan az az állapot, amire az all-round felfújható SUP deszkákat tervezték, és a rugalmas uszony és a tartós drop-stitch kivitel jól kezelik a zátonyon és a parton történő leszállásokat.
