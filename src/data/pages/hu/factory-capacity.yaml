intro: Paddle Board Overstock Weihai egyik legnagyobb dedikált SUP felfújható deszkelapgyártó üzemét üzemelteti Weihai-ban, Kínában. 12 000 m²-es gyárunk hat speciális műhelyre van szervezve, amelyek párhuzamosan működnek, így évente 15 000 deszkát tudunk gyártani mindenképpen, turnézó és művészeti SUP sorozatokban.
