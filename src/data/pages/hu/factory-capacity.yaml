hero:
  tagline: Termelési kapacitás
  title: Gyártási kapacitás és éves termelés
  subtitle: 12 000 m²-es létesítmény, évi 15 000 hajó előállítására, bővíthető
intro: Paddle Board Overstock Kínában, Qingdaóban üzemelteti az egyik legnagyobb, kifejezetten gumihajó-gyártásra szánt létesítményt. 12 000 m²-es üzemünk hat, párhuzamosan működő speciális műhelyre van felosztva, amely lehetővé teszi, hogy évente 15 000 hajót gyártsunk SUP, kajak, csónak, RIB és biztonsági felszerelés vonalon.
highlights:
  - value: 12,000 m²
    label: Teljes gyártási terület
    detail: 6 speciális műhelyen keresztül
  - value: 15,000
    label: Évente gyártott hajók
    detail: SUPs, kajakok, RIBs, csónakok, biztonsági felszerelés
  - value: 200-300
    label: Képzett munkaerő
    detail: 25+ mérnök, 2 műszak/nap
  - value: 50+
    label: Exportországok
    detail: EU, USA, AU, Közel-Kelet, Ázsia
  - value: 30–45
    label: Standard átfutási idő (nap)
    detail: Megrendelés megerősítésétől FOB.
  - value: 10+
    label: Évek tapasztalata az exportban
    detail: 2012 óta
workshops:
  - title: SUP Deszka gyártás
    description: '4 párhuzamos összeszerelő sor a felfújható SUP deszkákhoz. Soronként 50–80 deszkát lehet gyártani műszakonként. Digitális nyomtató és szitanyomó állomások párhuzamosan működnek. Éves SUP kapacitás: 8 000+ deszka.'
    output: 8 000+ SUPs/év
  - title: RIB Hajógyártás
    description: 'Dedikált üvegszálas hajótest műhely 6 formaállomással, RIB hajótestek akár 7,6 m hosszúságig. Csőhegesztő és összeszerelő terület 3–5 RIBs egyidejű kezelésére. Éves RIB kapacitás: 2 000+ hajó.'
    output: 2 000+ RIBs/év
  - title: Felfújható hajó és csónak
    description: 'Többcélú gyártósorok felfújható hajók, kajakok és csónakok számára. Meleglevegős hegesztőállomások, RF dielektromos sajtók és összeszerelő munkaállomások a megrendelés összetételének megfelelően konfigurálhatók. Éves kapacitás: 5 000+ egység.'
    output: 5 000+ egység/év
  - title: Biztonsági berendezések
    description: 'Külön tisztatéri gyártóterület mellények és biztonsági felszerelés számára. Dedikált varró, habbetöltő és tesztelő állomások. Éves mentőmellény kapacitás: 50 000+ egység.'
    output: 50 000+ mentőmellény/év
oem_capacity:
  moq: 'SUP: 5–10 egység | RIB: 2–5 egység | Kajak/Csónak: 10–20 egység | Egyedi forma: 200+ egység'
  lead_time: Szokásos 30–45 nap. Minta 15–20 nap. Gyors szállítás elérhető.
  payment: T/T 30% előleg + 70% szállítás előtt. L/C, Western Union elfogadva.
