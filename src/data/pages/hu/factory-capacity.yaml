workshops:
  - title: SUP Deszka gyártás
    description: '4 párhuzamos összeszerelő sor a felfújható SUP deszkákhoz. Soronként 50–80 deszkát lehet gyártani műszakonként. Digitális nyomtató és szitanyomó állomások párhuzamosan működnek. Éves SUP kapacitás: 8 000+ deszka.'
    output: 8 000+ SUPs/év
  - title: Deck Art és EVA Finishing
    description: Dedikált befejező műhely művészeti sorozatú deckekhez. Precíz EVA vágás, kézzel elrakott fedélzeti minták és végső díszítés. Az éves kapacitás lefedi a teljes művészeti sorozat kínálatát.
    output: Teljes művészeti sorozat kínálata
  - title: Drop-Stitch Laminálás
    description: 'A hőlaminációs vonalak a drop-stitch magokat a külső PVC laminátokhoz kötik. A sínsávok háromrétegű fúziós kötésekkel rendelkeznek a légzárószilárdság érdekében. Éves kapacitás: 15 000+ mag.'
    output: 15 000+ mag/év
  - title: Kiegészítők és csomagolás
    description: Kiegészítők összeszerelési és csomagolási vonalak szivattyúkhoz, lapátokhoz, pórázokhoz és javítókészletekhez. A deszkák vákuummal pakolnak, dobozolnak és raklaposak vannak világméretű szállításhoz.
    output: Teljes csomagok, szállításra kész
tldr:
  summary: Paddle Board Overstock évente 15 000 evezőtáblát gyárt saját, 12 000 m²-es üzemében Weihai-ban, Kínában. 200–300 képzett munkás dolgozik 2 műszakban, közvetlenül az evezősöknek értékesítve 50+ országban.
  points:
    - 12 000 m²-es gyártóegység Weihai-ban
    - Évente 15 000 tábla készül
    - 200–300 képzett munkás, naponta 2 műszak
    - Raktáron lévő rendelések kiszállítása 2-3 munkanap alatt
    - Minden deszkára 2 éves garancia
