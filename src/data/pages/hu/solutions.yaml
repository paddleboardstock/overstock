features3_solutions:
  tagline: Megoldások
  title: A te vízi kalandod<br />Üzleti partner
  isBeforeContent: false
  columns: 3
  items:
    - title: Vízi sport klubok
      description: Teljes felszereléscsomagok, egyedi márkajelzés és karbantartási programok SUP klubok, kajakklubok, szörfiskolák és edzőközpontok számára.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vízi sportok RIBs
      description: Célzottan készített RIBs vitorlás iskolák, vízi sport központok és rendezvényszervezők számára. Edzőhajók, vontatóhajók és felügyelő hajók professzionális vízisportokhoz.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Üdülőhelyek és szállodák
      description: Prémium vízi sport programok flottával, biztonsági rendszerekkel, személyzetképzéssel és bevételkezeléssel a vendéglátó egységek számára.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Vízi márkavállalkozók
      description: Privát márkás OEM/ODM gyártás alacsony MOQs-vel, egyedi terméktervezéssel, csomagolással és globális szállítással új márkatulajdonosok számára.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Búvárközponti hajók
      description: Stabil RIB platformok könnyű be- és kiszállással, felszereléstartóval és merülési műveletekre optimalizált motorbeállításokkal.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Mentő- és vészhelyzeti vízijárművek
      description: Nagy sebességű RIBs és felfújható hajók, amelyek kutató-mentő, vészhelyzeti beavatkozási és parti őrségi műveletekre készültek.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Jacht tender megoldások
      description: Kompakt, stílusos RIB tenderhajók, amelyek kiegészítik a szuperjachtokat és szabadidős hajókat. Könnyű tárolás, erőteljes teljesítmény.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Horgászcsónak megoldások
      description: Stabil, tartós felfújható hajók és RIBs, amelyek kereskedelmi és szabadidős horgászati műveletekhez vannak konfigurálva.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Tengeri turizmus felszerelés
      description: Flottára kész felfújható hajók, SUP deszkák és kajakok üdülőhelyek, túraszervezők és vízi sportok kölcsönző üzletek számára.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Tengeri energia RIBs
      description: Nehéz teherbírású RIBs olaj- és gázplatform támogatásához, szélerőmű személyzet szállításához, tenger alatti kábel ellenőrzéshez és tengeri építkezéshez.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Akvakultúrás munkahajók
      description: Korrózióálló RIBs halgazdaságok, gyöngytenyésztés és óceáni gazdálkodás számára. Hypalon csövek, rozsdamentes acél hardverek, mindennapi használatra tervezett tartósság.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Tengeri kutatás és felmérés
      description: Stabil, műszereknek alkalmas RIBs oceanográfiai kutatáshoz, környezeti megfigyeléshez, vízminőség mintavételhez és egyetemi oktatási programokhoz.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Kereskedelmi munkahajók
      description: Nehéz teherbírású RIBs járőrözéshez, felméréshez, szállításhoz és tengeri logisztikához. A kereskedelmi működés szigorú követelményeihez tervezve.
      icon: tabler:ship
      link: /commercial-workboats
