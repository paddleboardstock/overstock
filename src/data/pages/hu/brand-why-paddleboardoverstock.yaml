features3_reasons:
  tagline: Miért válassza a Paddle Board Overstock-t
  title: Hét ok, hogy velünk működj együtt
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Valódi gyártás, nem kereskedés
      description: We own and operate a 12,000 m² factory. When you buy from Paddle Board Overstock, you buy directly from the people who design, engineer, and build your board — no middlemen, no retail markup.
      icon: tabler:building-factory
    - title: 2. Mérnöki vezérelt megközelítés
      description: Our design process starts with the use case, not the product category. We optimize hull shape, material selection, and configuration for how the board will actually be used.
      icon: tabler:engine
    - title: 3. Proven Quality
      description: Every board is 100% pressure-tested at 1.25x rated PSI before it ships. A 99.3% defect-free rate — measured on every batch, not just claimed.
      icon: tabler:shield-check
    - title: 4. Paddler-First Design
      description: 'Deck art, color series, accessory mounts, and complete packages — boards designed around real paddling: touring, yoga, fishing, fitness, and family fun.'
      icon: tabler:swimming
    - title: 5. Globális logisztika
      description: Direct shipping from our Weihai factory to paddlers in 50+ countries, with full tracking and customs handling.
      icon: tabler:truck-delivery
    - title: 6. Élettartam Támogatás
      description: We support boards we built years ago. Genuine spare parts, technical advice, repair guidance — our team is available when you need us.
      icon: tabler:lifebuoy
    - title: 7. Őszinte specifikációk
      description: Valódi teherbírás, valódi méretek, valódi súly. Nincs marketinges felfújás. Amit közzéteszünk, azt kapja — független teszteléssel ellenőrizve.
      icon: tabler:ruler-measure
