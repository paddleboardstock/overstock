features3_reasons:
  tagline: Miért válassza a Paddle Board Overstock-t
  title: Hét ok, hogy velünk működj együtt
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Valódi gyártás, nem kereskedés
      description: 12 000 m²-es gyárat birtokolunk és üzemeltetünk. Amikor a Paddle Board Overstock-től vásárol, közvetlenül azoktól az emberektől vásárol, akik megtervezik, megépítik és összeállítják a deszkát — nincsenek közvetítők, nincsenek kiskereskedelmi felárak.
      icon: tabler:building-factory
    - title: 2. Mérnöki vezérelt megközelítés
      description: A tervezési folyamatunk a felhasználási esettel kezdődik, nem a termékkategóriával. Optimalizáljuk a hajótest alakját, az anyagválasztást és a konfigurációt arra, hogyan fogják a deszkát ténylegesen használni.
      icon: tabler:engine
    - title: 3. Bizonyított minőség
      description: Minden deszkát 100%-ban nyomáspróbának vetünk alá 1,25-szörös PSI értékig, mielőtt szállítjuk. 99,3%-os hibamentességi arány — minden tételnél mérve, nem csak ígérve.
      icon: tabler:shield-check
    - title: 4. Kajakos-központú tervezés
      description: 'Fedélzeti grafika, színsorozatok, kiegészítő rögzítők és teljes csomagok — a deszkák valódi evezésre tervezve: túrázás, jóga, horgászat, fitnesz és családi szórakozás.'
      icon: tabler:swimming
    - title: 5. Globális logisztika
      description: Közvetlen szállítás a weihai gyárunkból a kajakosoknak 50+ országba, teljes nyomkövetéssel és vámkezeléssel.
      icon: tabler:truck-delivery
    - title: 6. Élettartam Támogatás
      description: Támogatjuk az évekkel ezelőtt épített deszkáinkat. Eredeti pótalkatrészek, műszaki tanácsok, javítási útmutatás — csapatunk rendelkezésre áll, amikor szüksége van rá.
      icon: tabler:lifebuoy
    - title: 7. Őszinte specifikációk
      description: Valódi teherbírás, valódi méretek, valódi súly. Nincs marketinges felfújás. Amit közzéteszünk, azt kapja — független teszteléssel ellenőrizve.
      icon: tabler:ruler-measure
testimonials:
  tagline: Világszerte márkák által megbízható
  title: Mit mondanak partnereink
  items:
    - content: A deszkám gyáriszinten, minden a dobozban, érkezett. Két szezon heti evezés után is tökéletesen tartja a levegőt.
      name: — Sarah M., Hétvégi kajakos, Florida
    - content: Hetekig összehasonlítottam a műszaki adatokat vásárlás előtt. A Paddle Board Overstock volt az egyetlen márka, ami valódi súlyokat és nyomásértékeket tett közzé. Amit ők feltüntetnek, az jelenik meg.
      name: — Tomasz K., Túra kajakos, Lengyelország
    - content: Az egész család most evez. Egy deszkával kezdtük és néggyel végződtünk — a minőség könnyű döntést tett.
      name: — Angela R., Családi kajakos, Ausztrália
