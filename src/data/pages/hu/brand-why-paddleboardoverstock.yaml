features3_reasons:
  tagline: Miért válassza a Paddle Board Overstock?
  title: Hét ok, hogy velünk működj együtt
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Valódi gyártás, nem kereskedés
      description: Miénk és üzemeltetésünk alatt áll egy 12 000 m²-es gyár. Amikor a Paddle Board Overstock-val működik együtt, közvetlenül azokkal a személyekkel dolgozik, akik megtervezik, megépítik és legyártják termékeit — közvetítők nélkül.
      icon: tabler:building-factory
    - title: 2. Mérnöki vezérelt megközelítés
      description: A tervezési folyamatunk a használati esetből indul ki, nem a termékkategóriából. Optimalizáljuk a hajótest alakját, az anyagválasztást és a konfigurációt annak alapján, hogy a hajót valójában hogyan fogják használni.
      icon: tabler:engine
    - title: 3. Tanúsított minőség
      description: CE tanúsított, ISO minőségirányítási rendszer, BSCI megfelel, REACH megfelel, USCG jóváhagyott. 64 CE-tanúsított modellünk megfelel a nemzetközi szabványoknak — nem csak állítások.
      icon: tabler:certificate
    - title: 4. Rugalmas OEM/ODM
      description: Csőszínek, konzol elrendezés, márkajelzés, csomagolás — az Ön specifikációi szerint testreszabjuk. Nincs minimális rendelési nyomás. Kezdje egy prototípussal, majd növekedjen magabiztosan.
      icon: tabler:adjustments
    - title: 5. Globális logisztika
      description: US raktár Kaliforniában, közvetlen szállítás Qingdaóból, légi fuvar sürgős rendelésekhez. Mi intézzük a vámügyi papírmunkát és a dokumentációt.
      icon: tabler:truck-delivery
    - title: 6. Élettartam Támogatás
      description: Támogatjuk azokat a hajókat, amelyeket 20 éve építettünk. Eredeti pótalkatrészek, műszaki tanácsadás, javítási útmutatás — csapatunk rendelkezésre áll, amikor szükséged van ránk.
      icon: tabler:lifebuoy
    - title: 7. Őszinte specifikációk
      description: Valódi teherbírás, valódi méretek, valódi súly. Nincs marketinges felfújás. Amit közzéteszünk, azt kapja — független teszteléssel ellenőrizve.
      icon: tabler:ruler-measure
testimonials:
  tagline: Világszerte márkák által megbízható
  title: Mit mondanak partnereink
  items:
    - content: Több kínai gyártóval dolgoztunk együtt, de a Paddle Board Overstock kiemelkedik mérnöki támogatásával és következetes minőségével. A márkánkat a sajátjaként kezelik.
      name: — OEM Partner, európai vízisport márka
    - content: A Hypalon RIBs több mint 5 éve szolgál flottánkban. Minimális karbantartás, kiváló UV ellenállás. A csövekre vonatkozó 5 éves garancia bizalmat ad.
      name: — Flottakezelő, Közel-Keleti üdülőcsoport
    - content: A Paddle Board Overstock csapata segített nekünk egyedi SUP designt fejleszteni a koncepciótól a gyártásig 90 nap alatt. A minőség felülmúlta az elvárásainkat.
      name: — Disztribútor, ausztrál vízisportok
