features3_cases:
  tagline: Kiemelt esetek
  title: Egyedi megoldások<br />Valódi kihívások
  isBeforeContent: false
  columns: 3
  items:
    - title: Bali Búvárközpont napi működési fejlesztése
      customer: Blue Ocean Diving Center
      country: Indonézia
      industry: Kereskedelmi Búvárközpont
      challenge: A bali Blue Ocean Diving Center egy régebbi, üvegszálas búvárhajót üzemeltetett, korlátozott fedélzeti helygel, nehéz búvárbeszállással és magas karbantartással trópusi sós vízi körülmények között. A felszerelés betöltése zsúfolt volt, hosszú volt a felkészülési idő, és az instabil platform biztonsági aggályokat okozott a nemzetközi turisták számára – beleértve az első búvárokat és idősebb utazókat is. A központ naponta 3-5 búvártúrát szervez, évente 200+ napon.
      solution: Paddle Board Overstock Egyedi, 6,8 méteres professzionális búvárt RIB szállított, kibővített fedélzeti elrendezéssel, amely optimalizált a búvárfelszerelés tárolására, széles rozsdamentes acél merülőlétrával, nehézteherbírású Hypalon UV csövekkel és sós víz ellenállással, csúszásmentes fedélzeti felülettel és tartálytároló megoldással. A konfigurációt a búvárközpont napi munkafolyamata alapján tervezték — nem egy szabványos szabadidős hajóelrendezésen alapult.
      product: 6,8 m profi búvár RIB
      results: A nagyobb munkaterület javította a berendezések előkészítésének hatékonyságát. A búvárok biztonságosabb és könnyebb beszállást tapasztaltak. A karbantartási igények jelentősen csökkentek. A központ egyre nagyobb magabiztossággal tudott több vendéget kezelni a csúcsszezonban. RIB Ez lett a napi búvárműveletek alapja.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Búvárhajónk nemcsak közlekedés. Ez a mindennapi működésünk alapja.Paddle Board Overstock RIB Csapatunknak nagyobb önbizalmat ad, ha naponta több búvártúrát is szervezünk.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center Professzionális RIB Fejlesztés
      customer: Ocean Explorer Búvárközpont
      country: Thaiföld
      industry: Kereskedelmi Búvárközpont
      challenge: A thaiföldi Phuketi Ocean Explorer Diving Center hagyományos üvegszálas búvárhajóról kellett frissíteni, amely nem tudott lépést tartani a növekvő vásárlóigényekkel. A korlátozott fedélzeti hely miatt a felszerelés előkészítése nem volt hatékony. A nehéz fedélzeti beszállás biztonsági kihívásokat okozott a nemzetközi turisták számára. A trópusi sós vízi körülmények között magas karbantartási igények növelték az üzemeltetési költségeket. A központ évente több napi utazást üzemeltet, 200+ napon.
      solution: Paddle Board Overstock Testreszabott 6,8 méteres kereskedelmi búvárt RIB szállított, optimalizált munkafedélzeti elrendezéssel búvártartály tárolására, felszerelés előkészítésére és búvár mozgására. A jellemzők között szerepelt széles búvárlétra rozsdamentes acél korlátokkal, nehéz csőszerkezet UVellenálló anyagokkal, csúszásmentes padló, tartálytároló megoldás, professzionális konzol és utasülések — mind kereskedelmi búvári műveletekre konfigurálva.
      product: 6,8 m kereskedelmi búvár RIB
      results: A nagyobb fedélzeti terület gyorsabb berendezésszervezést és hatékonyabb napi munkafolyamatot eredményezett. Az ügyfelek beszállási kényelme és biztonsága jelentősen javult. A karbantartási leállások csökkentek a tengeri szintű építés miatt. A búvárközpont több ügyfelet tudott kiszolgálni a csúcsszezonban, és magabiztosan bővíthette a professzionális búvárszolgáltatásokat.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Egy búvárközpont számára a hajó nem csupán közlekedés. Fontos része a napi működésünknek.Paddle Board Overstock RIB Csapatunknak magabiztosságot ad arra, hogy naponta több búvárutat is lebonyolítsanak jobb biztonsággal és hatékonysággal.
      icon: tabler:lifebuoy
    - title: Európai Búvárközpont Flotta
      customer: BlueMed búvárközpontok
      country: Görögország
      industry: Búvár- és tengeri turizmus
      challenge: 12 merülőt kellett RIBs konfigurálni egy búvárközpontok láncolatához több görög szigeten. Minden hajónak egyedi merülőlétrára, 8 tartályos tárolóra és stabil platformra volt szükség a nyílt vízi búvárok belépéséhez. A flottának 60 napon belül meg kellett érkeznie a turistaszezon kezdetéhez.
      solution: 12 RIB darab 520 Dive modellt gyártottak integrált tartálytartókkal, merülőlétrával és extra széles Hypalon csövekkel a beszállás stabilitása érdekében. Minden hajót az ügyfélflotta festésével jelölték. Mind a 12 hajót nyomásnyomás alatt tesztelték, és 55 napon belül szállították Qingdaóból.
      product: RIB 520-as merülés
      results: Mind a 12 hajót időben szállították a turistaszezonra. A flotta 18+ hónapja működik napi rendszerben, anyagi hiba nélkül. Az ügyfél a második évben további 6 egységet rendelt.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB Az 520-as merülés a napi búvárműveleteink gerincét képezte. A stabilitás nyugalmi állapotban kiváló, és a tartálytároló elrendezés tisztán és biztonságosan tartja a fedélzetet vendégeink számára.
      icon: tabler:lifebuoy
    - title: Ausztrál OEM Forgalmazó Program
      customer: Pacific Watersports Pty Ltd
      country: Ausztrália
      industry: OEM/ODM Gyártás
      challenge: Az ausztrál forgalmazónak szüksége volt egy magáncímkés SUP board-sorozatra, versenyképes áron, hogy versenyezzen a kínai közvetlen fogyasztói márkákkal. 8 egyedi modellre volt szükség, kezdőtől haladóig, egyedi grafikával, egyedi csomagolással és bedobó szállítással a kiskereskedelmi üzletekbe.
      solution: 8 SUP modellt fejlesztettek ki (All-around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) exkluzív ausztrál grafikai csomaggal. Egyedi kiskereskedelmi csomagolás QR-kódokkal, amelyek a beállítási videókhoz kapcsolódnak. Drop-ship logisztika közvetlenül Qingdao-tól az ausztrál kiskereskedelmi boltokhoz konfigurálva.
      product: Custom SUP Line (8 modell)
      results: Koncepció az első szállítmányhoz 90 nap múlva. Kiskereskedelmi átadási arány 85% az első szezonban. A forgalmazó kibővítette a partnerséget, hogy a második évben felfújható hajóvonalat is bevonjon.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: A teljes Paddle Board Overstock SUP termékvonalat 90 nap alatt szállították — az első tervezéstől a kiskereskedelmi szintig. A minőség megegyezik a kétszeres árkategóriával eladott márkák között.
      icon: tabler:arrows-exchange
    - title: Közel-Keleti mentőhajó ellátás
      customer: Nemzeti Polgári Védelmi Hatóság
      country: Az Egyesült Arab Emírségek
      industry: Keresés és mentés
      challenge: A polgári védelmi szervezetnek 20 járőrszolgálatra kész hajóra RIBs volt szüksége a part menti keresés és mentés, kikötői biztonság és árvízkezelés érdekében. Önállóan kimerülő fedélzeteket, teljes navigációs rendszereket (GPS, radar, VHF), nagy láthatóságú narancssárga csöveket, valamint a helyi tengeri szabályozások betartását kellett előírni.
      solution: 20 RIB darab 450 Patrol modellt szállítottak önmagát lepattanó fedélzetekkel, Garmin navigációs készletekkel, LED keresőlámpákkal, SOLAS tükrözőszalaggal és jól látható Hypalon narancssárga csövekkel. Minden hajó CEtanúsított és 6185 szabvány szerint tesztelve ISO volt. A dokumentáció tartalmazta a helyi regisztrációs megfelelőségi tanúsítványokat.
      product: RIB 450-es járőr
      results: A flotta öt part menti állomáson állomásozott. A hajók extrém hőségben (45°C+) működtek, cső elromlás nélkül. A járőr hatótávolsága és az üzemanyag-hatékonyság 12%-kal meghaladta a specifikációkat.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: A RIB 450-es járőr túlteljesítette működési követelményeinket. Extrém hőségben a Hypalon csövek UV 24 hónap napi használat után nem mutatnak romlást.
      icon: tabler:alert-triangle
    - title: Európai OEM márkapartnerség
      customer: North Sea Marine Equipment BV
      country: Hollandia
      industry: OEM/ODM Gyártás
      challenge: A bevezetett európai tengeri márka a RIB piacra akart terjeszkedni anélkül, hogy gyártóüzemekbe fektetett volna. Szükségük volt egy fehércímkés partnerre, aki képes 5 RIB modellt (3,9 m-től 6,2 millióig) gyártani, magánmárkázással, CE tanúsítással és exkluzív EU-terjesztési joggal.
      solution: Fehér címkés gyártási megállapodás kötött 5 RIB modellre. Minden modell ügyféllogóval és színsémával van ellátva. MindenCE modellhez elkészült tanúsítványi dokumentáció. Kizárólagos EU-terjesztési jogok, minimális rendelési kötelezettséggel. Műszaki dokumentáció és alkatrészkatalógus biztosított a helyi szolgáltató hálózat számára.
      product: Custom RIB Line (5 modell)
      results: Többéves megállapodás aláírt. Az első 50 darabból álló gyártási sorozat 75 napon belül érkezett. A márka a METSTRADE-en indult pozitív kereskedői fogadtatással.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: A velük való együttműködés Paddle Board Overstock lehetővé tette, hogy gyár építése nélkül RIB is belépjünk a piacra — ők egy teljes kulcsfordító megoldást szállítottak CE tanúsítványokkal és kereskedői támogatási dokumentációval.
      icon: tabler:building
    - title: Karib-tengeri üdülőflotta
      customer: Paradise Island Resorts Ltd
      country: Bahamák
      industry: Tengeri turizmus és vendéglátás
      challenge: 'A luxusüdülőhelynek teljes vízisport-felszerelés flottára volt szüksége vendégprogramokhoz: 40 SUP deszka vezetett túrákhoz, 20 kajakot a lagúna felfedezéséhez, 10 felfújható hajót vendégszállításhoz és horgásztúrákhoz, valamint kiegészítőket. Minden felszerelést egyedi üdülő márkajelzésre szorultak, és a turistaszezon csúcspont előtt kellett kézbesíteni.'
      solution: 'Teljes vízisportcsomagot gyártottak: 40 SUP Voyager deszka (All-Around modell), 20 Explorer kaja, 10 AirDeck darab 360 fújható csónak, plusz PFD-k, lapátok, szivattyúk és javítókészletek. Minden felszerelés kinyomtatott üdülő logóval és trópusi színvilággal. Konténeres szállítmány teljes készletnyilvántartással.'
      product: Teljes vízi sportcsomag (70+ egység)
      results: A flotta 6 héttel a csúcsszezon előtt érkezett. A vízi sportok vendégelégedettségi pontszáma évről évre 40%-kal nőtt. A felszerelés 3 szezonon át bírta meg, csak rutin karbantartással.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: A teljes csomagolás megközelítése azt jelentette, hogy mindent megkaptunk egy szállítmányban — deszkák, kajakok, hajók és kiegészítők, mind márkázottak és vendéghasználatra készek. Vendégeink imádják a felszerelés minőségét.
      icon: tabler:beach
    - title: Queensland Kereskedelmi Búvárközpont RIB fejlesztése
      customer: Kereskedelmi Búvárközpont
      country: Ausztrália
      industry: Kereskedelmi búvár- és tengeri szolgáltatások
      challenge: Egy queenslandi kereskedelmi búvárközpont, amely tengeri infrastruktúra ellenőrzésére, kikötői karbantartásra és víz alatti javításokra specializálódott, egy öregedő munkahajót üzemeltetett. Ahogy a projekt iránti kereslet nőtt, a régi hajó teherréssé vált — a gyakori karbantartás ütemezési zavarokat okozott, az elrendezés nem volt modern búvárfeladatokra (korlátozott hely a hengereknek, szerszámoknak és felszereléseknek), és a hosszú üzemeltetés során a személyzet kényelme gyenge volt. A vállalatnak szüksége volt egy olyan hajóra, amely minden munkanap támogatni tudja szakmai működésüket.
      solution: részletes Paddle Board Overstock operatív elemzést végzett az ügyfél búvármunkafolyamatáról, a projekt tipikus időtartamáról, a személyzet létszámáról és a felszerelésigényekről. Ezen elemzés alapján Paddle Board Overstock személyre szabott RIB szakembert szállítottak be, amely a berendezések előkészítésére és a búvár mozgására optimalizált funkcionális fedélzeti elrendezéssel, hosszabb szállítási idők professzionális üléseivel, biztonságosabb búvár belépés és kilépés érdekében, valamint a tervezésbe integrált búvártámogató funkciókkal
      product: Egyedi profi búvár RIB
      results: Az új RIB megbízható napi munkaplatformgá vált. A berendezések előkészítése gyorsabbá vált az optimalizált elrendezéssel. A legénység a hosszú üzemek során javult a kényelemről és biztonságról. A hajó professzionális megjelenése megerősítette az ügyfelek bizalmát a kikötői üzemeltetőkkel és tengeri vállalkozókkal való együttműködés során. A búvárközpont olyan hajót kapott, amely megfelelt a szolgáltatásuk professzionalizmusának.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Olyan hajóra volt szükségünk, amely minden nap képes támogatni az üzletünket, nem csak szállítási eszköz. Paddle Board Overstock együtt dolgozott velünk, hogy megértse az üzemeltetési követelményeinket, és nyújtott egy RIB megoldást, amely illeszkedik a kereskedelmi búvármunkafolyamatunkhoz.
      icon: tabler:lifebuoy
    - title: Amerikai partszakasz-őrség szerződése
      customer: Atlanti Partbiztonsági Ügynökség
      country: Amerikai Egyesült Államok
      industry: Tengeri biztonság és jogérvényesítés
      challenge: Az amerikai partszakasz-őrség ügynöksége nagy teljesítményű járőrhajókat igényelt nyílt vízi elfogó műveletekhez. Kettős motoros konfigurációra volt szükség a redundancia érdekében, páncélozott konzolra a személyzet védelme érdekében, katonai szabványú elektronikai eszközökre (titkosított kommunikáció, FLIR, radar), és az amerikai partszakasz-őrség előírásainak való megfelelésre.
      solution: Megterveztük a RIB 600 Patrolt kettős 115 HP külsőmotoros konfigurációval, páncélozott konzol balisztikus védelemmel, FLIR hőképalkotással, titkosított VHF/UHF kommunikációval és integrált fegyverrögzítő pontokkal. A hajótest megerősítve a nagy sebességű elfogó manőverekhez. Minden elektronika integrálva és gyárban tesztelve. USCG megfelelőségi dokumentáció biztosítva.
      product: RIB 600 Patrol (Kettős motor)
      results: A hajók 52 csomós végsebességet értek el az átvételi próbák során. Az ügynökség az első 12 hónapban 95%-os bevethetőségi arányt jelentett. További 8 egység megrendelése történt.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: A kettős motoros RIB 600 megadja személyzetünknek a sebességet és a redundanciát, amely szükséges a nyílt vízi elfogó műveletekhez. A páncélozott konzol alapvető védelmet nyújt anélkül, hogy a teljesítményt kompromittálná.
      icon: tabler:shield
