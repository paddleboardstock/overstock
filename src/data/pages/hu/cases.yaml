hero:
  tagline: Esettanulmányok
  title: Igazi evezők, valódi történetek<br />— Paddle Board Overstock a gyakorlatban
  subtitle: Nézd meg, hogyan jutnak a vízre a világ minden táján a Paddle Board Overstock fújható SUP deszkákkal.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
