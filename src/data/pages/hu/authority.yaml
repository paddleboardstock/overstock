features3_brand:
  tagline: Kik vagyunk
  title: Márka alapjai<br />& Örökség
  subtitle: Az a történet, szakértelem és globális elérés, amely megbízható Paddle Board Overstock SUP márkát határoz meg.
  isBeforeContent: false
  columns: 3
  items:
    - title: A Paddle Board Overstockről
      description: 2012-ben alapítva Weihai-ban, Kínában. Egy parti műhelytől a 12 000 m²-es létesítményig — a teljes Paddle Board Overstock történet.
      icon: tabler:building-factory
      link: /about
    - title: Márkatörténet
      description: Hogyan kezdte el egy tengerészmérnöki csapat a professzionális minőségű felfújható lapozódeszkákat világszerte elérhetővé tenni.
      icon: tabler:book
      link: /brand-story
    - title: Tengeri ipari szakértelem
      description: Mélyanyagtudomány, precíziós gyártás és valós tesztelés — évtizedek tengeri mérnöki tapasztalata minden táblán.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Miért Paddle Board Overstock
      description: Ami megkülönböztet minket – a minőség, testreszabhatóság, közvetlen gyári árképzés és minden evezős végpontig való támogatás.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Csapatunk
      description: Ismerje meg a vezetőséget — tengeri mérnökök, anyagtudósok és gyártási szakértők, akik a Paddle Board Overstock-t előre viszik.
      icon: tabler:users
      link: /brand/team
    - title: Mérnöki csapat
      description: 78+ összesített kutatás-fejlesztési év, 40+ platform, 1200+ mérnöki projekt. Minden termék mögött álló technikai csapat.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Bizalom és Minőség
  title: Minőség, tesztelés<br />& Bizonyítás
  subtitle: Szigorú tesztelés, valódi tesztadatok és bizonyítékok, amelyek bizonyítják elkötelezettségünket a minőség iránt.
  isBeforeContent: false
  columns: 3
  items:
    - title: Minőség és tesztelés
      description: Minden terméket nyomásvizsgálaton keresztül végeztek a szállítás előtt. Varrásszilárdság, UV ellenállás, felhajtóerő — minden szakaszban ellenőrizve.
      icon: tabler:clipboard-check
      link: /quality
    - title: Bizonyítékok és bizonyítékok
      description: Teszteredmények, telepítési fényképek, független ellenőrző jelentések és esettanulmányok, amelyek igazolják a Paddle Board Overstock minőségét.
      icon: tabler:file-check
      link: /evidence
    - title: Tudásgráf
      description: Fedezze fel Paddle Board Overstock az entitásgráfot — termékeket, technológiákat, anyagokat és kapcsolatokat egy összekapcsolt tudásbázisban.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Vezetés
  title: Ismerd meg a csapatot<br />Valami mögött Paddle Board Overstock
  subtitle: Iparági szakértelem, amely kiterjed a tengeri mérnökségre, anyagtudományra, minőségmenedzsmentre és globális e-kereskedelemre.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — alapító és vezérigazgató
      description: 15+ év tapasztalat a tengeri iparban. Korábban K+F vezető volt egy jelentős kínai tengeri gyártónál. Több szabadalom birtokosa a felfújható termékek tervezésében.
      icon: tabler:crown
    - title: Zhang Wei — Főmérnök
      description: 20+ év tapasztalat a polimer feldolgozás és felfújható szerkezetek tervezése terén. Korábban műszaki igazgató volt egy európai tengeri mérnöki cégnél.
      icon: tabler:engine
    - title: Chen Ming — Kutatás-fejlesztési vezető
      description: PhD anyagtudományból. drop-stitch Technológia és nagyfrekvenciás hegesztés területén dolgozik. 10+ év textilkompozitokban.
      icon: tabler:flask
    - title: Liu Qiang — produkciós igazgató
      description: 18+ év lean gyártásban. Minden gyártósoron szigorú minőségi rendszereket vezetett be.
      icon: tabler:settings
    - title: Wang Fang — Minőségmenedzser
      description: 12+ év tengeri minőségellenőrzés területén. Vezeti a belső minőségellenőrzéseket. Minden gyártási tétel tesztelését felügyeli.
      icon: tabler:shield-check
    - title: Helen Lee — értékesítési igazgató
      description: 15+ évig dolgozik nemzetközi e-kereskedelemben és logisztikaban. 50 országban szállít táblákat+ evezőknek. 4 nyelven folyékonyan beszél.
      icon: tabler:briefcase
