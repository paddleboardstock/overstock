features3_brand:
  tagline: Kik vagyunk
  title: Márka alapjai<br />& Örökség
  subtitle: A történet, a szakértelem és a globális elérés, amelyek Paddle Board Overstock-t megbízható tengeri felszerelés gyártóként jellemzik.
  isBeforeContent: false
  columns: 3
  items:
    - title: Körülbelül Paddle Board Overstock
      description: 2012-ben alapítva Kínában, Qingdaóban. Egy tengerparti műhelytől egy 12 000 m²-es létesítményig — az egész Paddle Board Overstock történet.
      icon: tabler:building-factory
      link: /about
    - title: Márkatörténet
      description: Hogyan indult el egy tengerészmérnök csapat, hogy a professzionális minőségű felfújható vízi járműveket világszerte elérhetővé tegye.
      icon: tabler:book
      link: /brand-story
    - title: Tengeri ipari szakértelem
      description: Mély anyagtudomány, precíziós gyártás és valós tesztelés — évtizedek óta tartó hajózási mérnöki munka minden hajótestben.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globális jelenlét
      description: 50+ országban szolgálunk minden kontinensen. Regionális szakértelem a helyi szabályozási követelmények és piaci preferenciák terén.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Miért Paddle Board Overstock
      description: Ami megkülönböztet minket — minőség, testreszabás, közvetlen gyári árak és teljes körű támogatás kereskedelmi üzemeltetők számára.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Csapatunk
      description: Ismerje meg a vezetőséget — tengerészmérnököket, anyagtudósokat és gyártási szakértőket, akik előre viszik a Paddle Board Overstock-t.
      icon: tabler:users
      link: /brand/team
    - title: Mérnöki csapat
      description: 78+ egyesített K+F év, 40+ platform, 12 tanúsítvány, 1200+ OEM projekt. A műszaki csapat minden termék mögött.
      icon: tabler:engine
      link: /engineering-team
    - title: K+F Központ
      description: Hajótest mérnöki, RF hegesztés, PVC labor, prototípuskészítés, teszttartály és minőségi labor — teljes kutatási és fejlesztési létesítményünk.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Bizalom és Minőség
  title: Tanúsítványok, Minőség<br />& Bizonyítás
  subtitle: Független tanúsítványok, szigorú tesztelés és valódi bizonyítékok, amelyek bizonyítják elkötelezettségünket a minőség iránt.
  isBeforeContent: false
  columns: 3
  items:
    - title: Tanúsítványok
      description: CE, ISO 9001, UKCA, BSCIREACH , — teljes tanúsítási dokumentáció és megfelelőség a globális piacokra.
      icon: tabler:shield-check
      link: /certifications
    - title: Minőség és tesztelés
      description: Minden terméket nyomásvizsgálaton keresztül végeztek a szállítás előtt. Varrásszilárdság, UV ellenállás, felhajtóerő — minden szakaszban ellenőrizve.
      icon: tabler:clipboard-check
      link: /quality
    - title: Bizonyítékok és bizonyítékok
      description: Teszteredmények, telepítési fotók, harmadik fél által készített ellenőrzési jelentések és Paddle Board Overstock esettanulmányok a minőség igazolására.
      icon: tabler:file-check
      link: /evidence
    - title: Tudásgráf
      description: Fedezze fel Paddle Board Overstock az entitásgrafikont — termékeket, technológiákat, tanúsítványokat és kapcsolatokat egy összekapcsolt tudásbázisban.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Vezetés
  title: Ismerd meg a csapatot<br />Hátul Paddle Board Overstock
  subtitle: Iparági szakértelem, amely a tengeri mérnökséget, anyagtudományt, minőségmenedzsmentet és globális B2B kereskedelmet is magában foglalja.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — alapító és vezérigazgató
      description: 15+ évig dolgozik tengeri gyártásban. Korábban egy nagy kínai hajógyártónál vezette az R&D-t. Több szabadalmat is birtokolt felfújható hajótervezésben.
      icon: tabler:crown
    - title: Zhang Wei — Főmérnök
      description: 20+ év PVCHypalon gyártási és mély-V hajótest tervezés területén. Korábbi műszaki igazgató egy európai tengerészmérnöki cégnél.
      icon: tabler:engine
    - title: Chen Ming — Kutatás-fejlesztési vezető
      description: PhD anyagtudományból. drop-stitch Technológia és nagyfrekvenciás hegesztés területén dolgozik. 10+ év textilkompozitokban.
      icon: tabler:flask
    - title: Liu Qiang — produkciós igazgató
      description: 18+ év lean gyártásban. Six Sigma Black Belt. ISO 9001 minőségi rendszereket vezett be minden gyártósoron.
      icon: tabler:settings
    - title: Wang Fang — Minőségmenedzser
      description: 12+ évig dolgozik tengeri minőségellenőrzésben. CE Tanúsított és ISO auditor. Minden gyártási tétel tesztelését felügyeli.
      icon: tabler:shield-check
    - title: Helen Lee — értékesítési igazgató
      description: 15+ év nemzetközi B2B kereskedelemben. OEMMenedzselt /ODM partnerségek 30+ országban. 4 nyelven folyékonyan beszél.
      icon: tabler:briefcase
