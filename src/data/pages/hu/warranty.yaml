body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Ez a korlátozott garancia az új Paddle Board Overstock , márkázott felfújható SUP deszkákra vonatkozik Paddle Board Overstock , amelyeket közvetlenül az online áruházból vásárolnak. Az érvényességi dátum az eredeti vásárlás igazolható dátuma.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Garancia és időtartam</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 év</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch Mag és fedélzet szerkezete</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 év</h3>
          <p class="text-sm text-gray-600 mt-1">Sín- és varratépítés</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 év</h3>
          <p class="text-sm text-gray-600 mt-1">Felfújó szelep funkcionalitás</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 év</h3>
          <p class="text-sm text-gray-600 mt-1">Mellékelt kiegészítők (pumpa, lapát, póráz, uszony)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 év*</h3>
          <p class="text-sm text-gray-600 mt-1">Kereskedelmi, bérlési vagy flottahasználat — minden összetevő</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Kereskedelmi, bérelhető vagy flottahasználat esetén a garancia 1 évre csökken. Verseny- vagy versenyhasználat teljesen érvényteleníti a garanciát.</p>
    </div>

    <h2>Mit fednek le</h2>
    <h3>Drop-Stitch Mag és fedélzet szerkezete (2 év)</h3>
    <p>drop-stitch A panel belső magja és külső szerkezete védett a gyártási hibák ellen, amelyek veszélyeztetik az alap működési inflációjának és merevségének fenntartásának képességét.</p>

    <h3>Sín- és varratlanépítés (2 év)</h3>
    <p>A varrások és a háromrétegű síncsíkok, amelyek a gyártás során össze vannak kötve, biztonságosak a gyártási hibák ellen, amelyek jelentős légszivárgáshoz vezetnek a varraton keresztül. A megfelelő felfújási nyomás időszakos ellenőrzése és fenntartása a fedezet feltételei.</p>

    <h3>Felfújó szelep funkcionalitása (2 év)</h3>
    <p>A felfújható szelepek, amelyeket eredetileg Paddle Board Overstock telepített, gyártási hibák ellen vannak garantálva az anyagban vagy a kivitelezésben, amelyek megakadályoznák a szelep levegőtartó képességét az előírt módon.</p>

    <h3>Mellékelt kiegészítők (2 év)</h3>
    <p>A szivattyú, állítható lapát, póráz, levehető ussza és egyéb alkatrészek, amelyek a board csomagban vannak, garanciát nyújtanak az anyagi és kidolgozottsági hibák ellen.</p>

    <h2>Mi nincs lefedve</h2>
    <ul>
      <li>Kozmetikai hibák, mint például elszíneződés, foltosodás, kréta, vagy bármilyen megjelenésbeli változás</li>
      <li>Szúrások, vágások, szakadások, szakadások vagy egyéb fizikai sérülések</li>
      <li>Dőlés, repedés, kopás, karcolás vagy súrlódás vagy érintkezés okozta romlás</li>
      <li>Fényhatás, időjárási vagy légköri körülmények okozta károsodás UV</li>
      <li>Oldószerekkel, savakkal, lúgokkal vagy vegyi anyagokkal való érintkezésből eredő károsodás</li>
      <li>Károk gondatlanságból, helytelen használatból, visszaélésből, balesetből vagy normál kopásból</li>
      <li>Sérülések ütközés, stressz, nem megfelelő támogatás vagy szállítás okozta károk</li>
      <li>Károk a helytelen infláció/defláció vagy nem jóváhagyott inflációs eszközök használata miatt</li>
      <li>Harmadik féltől származó berendezések, alkatrészek vagy rendszerek (amelyeket a gyártók fedez)</li>
    </ul>

    <h2>Gyártói kötelezettség és jogorvoslat</h2>
    <p>Paddle Board OverstockA kizárólagos kötelezettsége a választás szerint bármely olyan alkatrész javítása vagy cseréje, Paddle Board Overstock amelyet anyagi vagy kidolgozottsági hibának ítélnek és amely a garancia fedezi. A javításokat vagy cseréket a Paddle Board Overstock kijelölt szerviz végzi. A javítás vagy cserék csak az eredeti garanciális időszak lejáratlan részére garanciális érvényesek.</p>

    <h2>A garancia feltételei</h2>
    <ul>
      <li><strong>Karbantartás:</strong>A terméket a Paddle Board Overstock közzétett útmutatásai szerint kell karbantartani, beleértve az alkalmazandó nyomásértékek rendszeres ellenőrzését és karbantartását.</li>
      <li><strong>Együttműködés:</strong>A vásárlónak teljes mértékben és haladéktalanul együtt kell működnie Paddle Board Overstock-vel minden, a garanciális igényekkel kapcsolatos ügyben.</li>
      <li><strong>Eredeti vásárló:</strong>Ez a garancia kizárólag az eredeti végfelhasználó vásárlóra vonatkozik, és nem átruházható.</li>
    </ul>

    <h2>Kereskedelmi használat</h2>
    <p>Ha a terméket kereskedelmi, bérlési vagy flotta célokra használják, az összes alkatrészre vonatkozó garanciaidő az eredeti vásárlási dátumtól számított egy (1) évre csökken. Versenyzési, gyorsasági vagy állóképességi versenyeken való használat azonnal és visszavonhatatlanul teljesen érvényteleníti a garanciát.</p>

    <h2>Hogyan lehet garanciális igényt benyújtani</h2>
    <p>Vegye fel a Paddle Board Overstock kapcsolatot a vásárlási igazolással és a probléma részletes leírásával.Paddle Board Overstock Átnézi az igényt, és utasításokat ad az ellenőrzéshez és a szervizhez.</p>
    <p>Garanciális szolgáltatási kérdések esetén kérjük, vegye fel velünk a kapcsolatot a<a href="/contact" class="text-sky-600 underline">Kapcsolatfelvételi oldal</a>A rendelési számoddal és a termékadataival.</p>

