  Ez a garancianyilatkozat a teljes Paddle Board Overstock gyártói korlátozott garanciát összefoglalója. A teljes jogi garanciális dokumentum szabályozza az összes garanciát és feltételt. A specifikációk előzetes értesítés nélkül változhatnak.Paddle Board Overstock a Paddle Board Overstock Weihai Manufacturing Hub gyári márkája.
