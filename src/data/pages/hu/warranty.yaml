label: Garancia
headline: Paddle Board Overstock Gyártó Korlátozott Garancia
subtitle: Minden Paddle Board Overstock felfújható tengeri termék minősége mögött áll. Ez a korlátozott garancia meghatározza az Ön termékének feltételeit és Paddle Board Overstock fedezetét.
seo:
  headline: Paddle Board Overstock Fújható hajógarancia — 5 éves korlátos garancia | Paddle Board Overstock
  description: Paddle Board Overstock 5 éves korlátozott garanciát kínál az elsődleges csőszövetre, varrásokra és üvegszálas hajótest szerkezeti szilárdságára. Kifedi a fújható szelepeket és gyárilag telepített kiegészítőket is. Teljes feltételek a Paddle Board Overstock felfújható hajó garanciára.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Ez a korlátozott garancia az új Paddle Board Overstock , márkázott felfújható tengeri termékekre vonatkozik, amelyeket közvetlenül Paddle Board Overstock egy hivatalos Paddle Board Overstock kereskedőtől vagy kereskedőtől vásároltak. Az érvényességi dátum az eredeti kiskereskedelmi vásárlás igazolható dátuma.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Garancia és időtartam</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 év</h3>
        <p class="text-sm text-gray-600 mt-1">Elsődleges csőszövet integritás (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 év</h3>
        <p class="text-sm text-gray-600 mt-1">Üvegszálas hajótest szerkezeti integritása</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 év</h3>
        <p class="text-sm text-gray-600 mt-1">Felfújható csővarrás légtartási képesség</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 év</h3>
        <p class="text-sm text-gray-600 mt-1">Felfújó szelep funkcionalitás</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 év</h3>
        <p class="text-sm text-gray-600 mt-1">Gyárilag telepített kiegészítők és segédberendezések</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 év*</h3>
        <p class="text-sm text-gray-600 mt-1">Kereskedelmi, bérlési vagy flottahasználat — minden összetevő</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Kereskedelmi, állami, charter, bérlési vagy oktató használat 1 évre csökkenti a garanciát. Verseny- vagy versenyhasználat teljesen érvényteleníti a garanciát.</p>
  </div>

  <h2>Mit fednek le</h2>
  <h3>Elsődleges csőanyag (5 év)</h3>
  <p>Paddle Board Overstock Biztosítja a fő csőanyagot a porozitás károsodása ellen, amely jelentősen veszélyezteti a termék működési inflációjának fenntartását. Ez CSM vonatkozik (Hypalon) a bevonatos anyagra és minden más, gyártásban használt csőanyagra.</p>

  <h3>Üvegszál hajótest szerkezeti integritása (5 év)</h3>
  <p>Az üvegszálas műanyag (FRP) testtel rendelkező termékek esetében az alapvető kompozit szerkezet garantált a szerkezeti hibák vagy a kivitelezés hibái miatt.</p>

  <h3>Fújható csővarrás légtartási képesség (5 év)</h3>
  <p>A felfújható csövek varratai, amelyek a gyártás során összekötöttek, biztonságosak a gyártási hibák ellen, amelyek jelentős légszivárgáshoz vezetnek a varraton. A megfelelő felfújási nyomás időszakos ellenőrzése és fenntartása a fedezet feltételei.</p>

  <h3>Felfújó szelep funkcionalitása (5 év)</h3>
  <p>Az eredetileg beszerelt légfelfújó Paddle Board Overstock szelepek biztosítottak olyan gyártási hibák ellen, amelyek megakadályozzák a szelep a levegőt a tervezés szerint megtartásában.</p>

  <h3>Gyárilag telepített kiegészítők (1 év)</h3>
  <p>A Paddle Board Overstock gyárban gyártott és eredetileg ott telepített alkatrészek és szerelvények egy évig garanciát kapnak az anyag- és kidolgozottsági hibák ellen. Ez kizárja a harmadik féltől származó termékeket, amelyeket csak a gyártói garanciák fedeznek.</p>

  <h2>Mi nincs lefedve</h2>
  <ul>
    <li>Kozmetikai hibák, mint például elszíneződés, foltosodás, kréta, vagy bármilyen megjelenésbeli változás</li>
    <li>Szúrások, vágások, szakadások, szakadások vagy egyéb fizikai sérülések</li>
    <li>Dőlés, repedés, kopás, karcolás vagy súrlódás vagy érintkezés okozta romlás</li>
    <li>Fényhatás, időjárási vagy légköri körülmények okozta károsodás UV</li>
    <li>Károsodás üzemanyaggal, oldószerekkel, savakkal, lúgásokkal vagy vegyi anyagokkal való érintkezésből</li>
    <li>Károk gondatlanságból, helytelen használatból, visszaélésből, balesetből vagy normál kopásból</li>
    <li>Gellakos vagy festék felületi problémák (hólyagosodás, dőlése, elszíneződés, fakulás)</li>
    <li>Sérülések ütközés, stressz, nem megfelelő támogatás vagy pótkocsi miatti károk</li>
    <li>Károk a helytelen infláció/defláció vagy nem jóváhagyott inflációs eszközök használata miatt</li>
    <li>Harmadik féltől származó berendezések, alkatrészek vagy rendszerek (amelyeket a gyártók fedez)</li>
  </ul>

  <h2>Gyártói kötelezettség és jogorvoslat</h2>
  <p>Paddle Board OverstockAz egyetlen és kizárólagos kötelezettsége a választás szerint bármely olyan alkatrész javítása vagy cseréje, Paddle Board Overstockamelyet anyagi vagy kidolgozottsági hibának minősítenek, és amely a garancia hatálya alá tartozik. A javításokat vagy cseréket az Paddle Board Overstock általa kijelölt hivatalos szervizintézmény végzi. A javításra vagy cserére csak az eredeti garanciaidő lejáratlan részére garancia vonatkozik.</p>

  <h2>A garancia feltételei</h2>
  <ul>
    <li><strong>Regisztráció:</strong>A terméket megfelelően kell regisztrálni a garancia feltételei szerint.</li>
    <li><strong>Karbantartás:</strong>A terméket a közzétett irányelvek szerint kell karbantartaniPaddle Board Overstock, beleértve az időszakos ellenőrzést és a megfelelő inflációs nyomás fenntartását.</li>
    <li><strong>Együttműködés:</strong>A vásárlónak teljes mértékben és gyorsan kell együttműködnie Paddle Board Overstock minden garanciális igényekkel kapcsolatos ügyben.</li>
    <li><strong>Eredeti vásárló:</strong>Ez a garancia kizárólag az eredeti végfelhasználó vásárlóra vonatkozik, és nem átruházható.</li>
  </ul>

  <h2>Kereskedelmi használat</h2>
  <p>Ha a terméket kereskedelmi, kormányzati, nonprofit, charter, bérlés, oktatási vagy bármilyen más célra használják, mint magán szabadidős célokra, az összes alkatrészre vonatkozó garanciaidő az eredeti kiskereskedelmi vásárlástól számított egy (1) évre csökken. Versenyzési, gyorsasági vagy állóképességi versenyeken történő használat azonnal és visszavonhatatlanul teljesen érvényteleníti a garanciát.</p>

  <h2>Hogyan lehet garanciális igényt benyújtani</h2>
  <p>Vegye fel a Paddle Board Overstock kapcsolatot vagy a hivatalos kereskedőt a vásárlási igazolással és a probléma részletes leírásával.Paddle Board Overstock Átnézi az igényt, és utasításokat ad az ellenőrzésre és szervizre.</p>
  <p>Garanciális szolgáltatási kérdések esetén kérjük, vegye fel velünk a kapcsolatot a<a href="/contact" class="text-sky-600 underline">Kapcsolatfelvételi oldal</a>A rendelési számoddal és a termékadataival.</p>

  <h2>Harmadik fél tárgyak</h2>
  <p>A harmadik felek által gyártott berendezések, alkatrészek vagy rendszerek (még ha a gyártó által telepítve Paddle Board Overstockis) kizárólag a gyártójuk által nyújtott garanciák hatálya alá tartoznak.Paddle Board Overstock Kifejezetten elutasítja a garanciális felelősséget az ilyen harmadik fél termékei esetén.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Ez a garancianyilatkozat a teljes Paddle Board Overstock gyártói korlátozott garanciának összefoglalója. A teljes jogi garanciális dokumentum szabályozza az összes garanciát és feltételt. A specifikációk előzetes értesítés nélkül változhatnak.Paddle Board Overstock a Paddle Board Overstock Qingdao Manufacturing Hub gyári márkája.
  </p>
