content_workshop:
  isReversed: true
  tagline: Gyár ereje
  title: Miért az ár kiszállítási árai<br />Valósak
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Valódi gyár, valódi megtakarítás — minden fedélzet a Weihai üzemünkből szállít</h3>
  items:
    - title: Ugyanazok a gyártósorok, mint a nagy márkák
      description: 12 000 m²-es Weihai gyárunk nemzetközi márkáknak készít deszkákat, és saját túlkészleteinket ugyanazon a vonalon, ugyanazokkal az anyagokkal.
    - title: 100% nyomás teszt
      description: Minden deszka 1,25x besorolásra nyomás PSI alatt van, és szállítás előtt tartják. 99,3% hibamentes arány AQL 2,5 / ISO 2859-enként.
    - title: Nincs közvetítők
      description: A táblák közvetlenül gyárilag az ajtóhoz szállítják. Nincs forgalmazói ár, nincs kiskereskedelmi ár – így marad az árfolyam 60%-kal a kiskereskedelmi ár alatt.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12 000 m²-es Weihai gyár felfújható SUP gyártósorokkal
