  tagline: Megfelelőség és minőségellenőrzés
  title: Minősített minőség,<br />Dokumentált
  subtitle: Minden megfelelőségi igényt tanúsítványok és modellspecifikus dokumentációk alátámasztanak az ellenőrzéshez.
  items:
    - title: ISO 9001:2015
      description: Minőségirányítási rendszer TÜV , amelyet a Rheinland tanúsított. SGSÉves felügyeleti auditok. Dokumentált minőségellenőrzési folyamatok a bejövő anyagtól a szállítmány kibocsátásáig.
      icon: tabler:certificate
    - title: CE Tanúsítvánnyal rendelkezik
