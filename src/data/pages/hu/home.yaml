  title: Iparági és műszaki betekintések
  information: |
    RCD megfelelőségi OEMútmutatók, /ODM folyamatcikkek, anyagösszehasonlítások,
    valamint a mérnöki csapat gyári ellenőrzési Paddle Board Overstock erőforrásait.
faqs:
  title: B2B Beszerzési GYIK
  subtitle: Gyakori kérdések márkáktól, forgalmazóktól és kereskedelmi szolgáltatóktól a OEMODM gyártással Paddle Board Overstockkapcsolatban.
  columns: 2
  items:
    - title: Gyártó vagy kereskedő cég vagy?
      description: Vertikálisan integrált üzem vagyunk, teljes kontroll a minőség, az anyagok és az előszállítási idők felett. Az üzleti engedély és a termelési terület a gyári audit során ellenőrizhető.
      icon: tabler:building-factory
      category: all
    - title: Mi a OEMteODM / folyamatod?
      description: Követelmények felülvizsgálata (48 órá) a prototípus javaslatáig (7-14 nap) és gyártásig (30-45 FOB nap, Qingdao). Teljes mérnöki támogatás, megfelelőségi dokumentáció és hajótest minden egyes hajó szerinti nyomon követhetősége.
      icon: tabler:route
      category: all
    - title: Mik MOQ a követelmények?
      description: 'RIB hajók: 2-5 egység modellenként (létező forma), 200+ egyedi formák esetén. SUP lapok: 5-10 egység SKU-ként. Vegyes modellű konténer megrendelések elérhetők. Mintamegrendelések 2-5 egység a kiértékeléshez.'
      icon: tabler:sort-ascending
      category: all
    - title: Milyen testreszabási lehetőségek állnak rendelkezésre?
      description: Hajótest kialakítása, cső anyaga (PVC vagy Hypalon/CSM), cső átmérője, konzol elrendezése, ülések, kormányzás, üzemanyagrendszer, fedélzet kialakítása, márkaszínek, logó grafikák, EVA pad kialakítása, kiskereskedelmi csomagolás és tulajdonosi kézikönyv márkázása.
      icon: tabler:adjustments
      category: all
    - title: Milyen megfelelőségi dokumentumokat tud nyújtani a piacom számára?
      description: CE 2013/53/EU szerinti DoC, UKCA jelölés, ISO 9001 tanúsítvány (SGS), BSCI auditrőszermény, REACH megfelelőség, anyagvizsgálati jelentések, nyomáspróba naplók és modell specifikus gyártói adatlap. Piac specifikus dokumentáció kérésre.
      icon: tabler:file-certificate
      category: all
    - title: Mennyi a mintavételi és gyártási átfutási idő?
      description: 'Előgyártási minták: 7-14 munkanap. Szabványos gyártás: 30-45 nap FOB Qingdao. Gyorsított gyártás elérhető felár ellenében. Főszezon (március-június) meghosszabbíthatja a gyártási határidőt.'
      icon: tabler:clock
      category: all
    - title: Szervezhetek-e gyári auditot vagy élő videós túrát?
      description: Igen. A qingdaoi üzemünkben történő helyszíni gyári auditok 3-5 napos előzetes értesítéssel lehetségesek. Élő videós túrák WhatsApp/Zoom-on keresztül azonnal elérhetők. Harmadik fél általi ellenőrzések (SGS, BV, TÜV) biztosítottak.
      icon: tabler:video
      category: all
    - title: Milyen minőségi ellenőrzéseket végeznek a szállítás előtt?
      description: 1,25-szörös névleges nyomásos nyomáspróba (24-48 óra), varratfelhúzási vizsgálat, 100 pontos végső ellenőrző lista, méretellenőrzés, esztétikai vizsgálat, megfelelőségi dokumentáció ellenőrzése és csomagolás integritásának ellenőrzése. Mind a ISO 9001 eljárások szerint.
      icon: tabler:clipboard-check
      category: all
