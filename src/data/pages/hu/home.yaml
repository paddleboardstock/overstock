    - title: 5. lépés:<span class="font-medium">Szállítás</span>
      description: Konténerrakodó terv, ISPM-15 fa rekedencia, megfelelőségi dokumentáció csomag és FOB Qingdao szállítmány teljes exportpapírokkal.
