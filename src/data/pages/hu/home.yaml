faqs:
  title: SUP Rendelés és termék GYIK
  subtitle: Gyakori kérdések a kiárusítási SUP tábláinkról, megrendelésről, fizetésről, szállításról és garanciáról.
  columns: 2
  items:
    - title: Nehéz megtanulni a SUP-t?
      description: Egyáltalán nem. A legtöbb kezdő már az első órájában feláll és evez. Minden célra alkalmas SUP deszkáink extra széles, stabil platformmal rendelkeznek, amelyet kifejezetten kezdő evezők számára terveztek. Kezdj nyugodt vízen, és perceken belül már evezni fogsz.
      icon: tabler:swimming
      category: sup
    - title: Mi a súlyhatár?
      description: Mindenoldalú SUPs támogatásunk akár 220 fontig, míg a kiránduló és jóga platformok támogatása akár 250 fontig terjed. Minden termékoldalon feltüntetjük a pontos felhasználói súlykorlátot, így a deszkát az igényeidhez igazíthatod.
      icon: tabler:adjustments
      category: sup
    - title: Utazhatok egy felfújható SUP-vel?
      description: Abszolút. Minden Paddle Board Overstock tábla egy hátizsák méretű hordtáskába csomagolható. Mindössze 18-22 font súlyú, így könnyen vihető a strandra, a tóhoz vagy a repülőtéri terminálokon keresztül. Utazás előtt ellenőrizze a légitársaság poggyászszabályzatát.
      icon: tabler:truck-delivery
      category: sup
    - title: Mi kerül a dobozba?
      description: Minden Paddle Board Overstock SUP tartalmazza a deszkát, egy utazó hátizsákot, kézipumpát, állítható evezőt, levehető uszonyt, tekercselt pórázt és javítókészletet.
      icon: tabler:clipboard-list
      category: sup
    - title: Miért alacsonyabbak az árak, mint a kiskereskedelmi árak?
      description: Gyári felesleget és leárazott tételeket árulunk közvetlenül a saját weihai, kínai gyártóüzemünkből — közvetítők nélkül, kiskereskedelmi felár nélkül. Ez azt jelenti, hogy teljes SUP csomagokat kínálunk akár 60%-kal alacsonyabb áron a tipikus kiskereskedelmi árakhoz képest, azonos CE-tanúsítvánnyal rendelkező minőségben.
      icon: tabler:certificate
      category: orders
    - title: Hogyan adhatok le rendelést és fizethetek?
      description: Add hozzá a SUP csomagodat a kosárhoz, és fizess biztonságosan Stripe vagy PayPal segítségével. Minden nagyobb hitel- és betéti kártyát elfogadunk. Minden rendelést e-mailben megerősítünk teljes számlával.
      icon: tabler:file-text
      category: orders
    - title: Világszerte szállítanak?
      description: Igen. Szállítunk 50+ országba az EU-n belül, Észak-Amerikában, az Ázsia-Csendes-óceáni régióban, a Közel-Keleten és Afrikában. A raktáron lévő megrendelések általában 2-3 munkanapon belül szállításra kerülnek, minden csomaghoz nyomon követést biztosítunk.
      icon: tabler:route
      category: orders
    - title: Milyen garanciát tartalmaznak a SUP táblák?
      description: 'Minden SUP deszka és tartozék 2 éves garanciával rendelkezik — beleértve magát a deszkát, a drop-stitch varratokat és a felfújó szelepeket. A reklamációkat napok alatt kezeljük, nem hetek alatt: nyújtsa be online, és mi javítjuk vagy kicseréljük.'
      icon: tabler:lifebuoy
      category: orders
