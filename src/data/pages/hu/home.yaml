features:
  id: features
  tagline: OEM/ODM Képesség
  title: Amit Megkap<br />Paddle Board Overstock segítségével
  subtitle: Hozzáférés közvetlenül a gyárhoz teljes mérnöki, minőségi és megfelelőségi támogatással – nem egy kereskedő cég.
  columns: 2
  items:
    - title: OEM/ODM Testreszabás
      description: Egyedi törzs kialakítás, csőanyag (PVC vagy Hypalon/CSM), konzol elrendezés, ülések, márkajelzés, színek és csomagolás. A kisebb módosításoktól a teljes egyedi mérnöki megoldásokig.
      icon: tabler:adjustments
    - title: Alacsony MOQ, Gyors Mintavétel
      description: 'RIB: 2-5 egység (létező forma). SUP: 5-10 egység per SKU. Egyedi formák: 200+ egység. Előgyártási minták a márkázásával 7-14 nap alatt.'
      icon: tabler:rocket
    - title: Gyártásra Kész Minőség
      description: Minden egységet 1,25x névleges PSI-on 24-48 óráig nyomáspróbára teszünk. 99,3%-os hibátlan arány per AQL 2,5 / ISO 2859. 100 pontos minőség-ellenőrző lista minden törzshöz.
      icon: tabler:certificate
    - title: Teljes Megfelelőségi Dokumentáció
      description: CE a 2013/53/EU szerint (RCD), ISO 9001:2015 (SGS), BSCI társadalmi audit, REACH megfelelőség, UKCA jelölés. Modell-specific DoC és gyártói adatok tartalmazva.
      icon: tabler:file-certificate
    - title: 30-45 Napos Átfutási Idő
      description: Standard gyártás 30-45 nap FOB Qingdao. Prototípusok 7-14 nap. Gyorsított gyártás elérhető. Konténer betöltési tervek és ISPM-15 raklapozás biztosított.
      icon: tabler:truck-delivery
    - title: Értékesítés Utáni Támogatás & Pótalkatrészek
      description: 5 év garancia csónakokra/kajakokra/RIBs, 2 év SUP/kiegészítők. Pótalkatrész ellátás prioritással. Garanciális igények feldolgozásának támogatása.
      icon: tabler:lifebuoy
