    - title: 2 éves SUP garancia
      description: Minden SUP deszkát és kiegészítőt két évig fedeztek — drop-stitch varrások, felfújó szelepek és kiegészítők is beletartoznak. A kárigények gyorsan megoldottak.
      icon: tabler:lifebuoy
steps:
  title: A pénztártól a vízig — Hogyan szállítják a rendelését
  items:
    - title: 1. lépés:<span class="font-medium">Válaszd ki a tábládat</span>
      description: Választhatsz a mindenre jó, túrázós, jóga és gyerek modellek közül. Vásárlási útmutatóink segítenek a deszka méretének és stílusának kiválasztásában a evezésedhez.
      icon: tabler:clipboard-list
    - title: 2. lépés:<span class="font-medium">Biztonságos fizetés</span>
      description: Fizessen biztonságosan a Stripe vagy a PayPal segítségével. Minden jelentős hitel- és bankkártyát elfogadunk. Fiókra nincs szükség — a megrendelés visszaigazolása a postaládájába érkezik.
      icon: tabler:file-text
    - title: 3. lépés:<span class="font-medium">Minőségellenőrzés</span>
      description: Minden panelt 100%-ban nyomáspróbának vetnek alá 1,25-szörös névleges PSI értéken, és átvizsgálnak egy teljes minőségellenőrző listával, mielőtt becsomagolják.
      icon: tabler:settings
    - title: 4. lépés:<span class="font-medium">Gyors kiszállítás</span>
      description: A raktáron lévő megrendelések a weihai gyárunkból 2-3 munkanapon belül szállítódnak. Sürgősségi kezelés elérhető sürgős megrendelésekhez.
      icon: tabler:building-factory
    - title: 5. lépés:<span class="font-medium">Követett szállítás</span>
      description: Világszerte 50+ országba nyomon követett szállítás. Két év garanciája és gyors ügyfélszolgálata a nap kezdetén érvényes, amikor a deszkája megérkezik.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP rendelési folyamat a biztonságos fizetéstől a nyomon követett világméretű kiszállításig
blog_latest:
  title: SUP Útmutatók és műszaki betekintések
  information: |
    Vásárlási útmutatók, evezéstechnika, biztonsági alapok és kivitelezés
