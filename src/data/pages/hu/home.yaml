content_compliance:
  tagline: Megfelelőség és minőségellenőrzés
  title: Dokumentált bizonyítékok,<br />Nem csak állítások
  subtitle: Minden megfelelőségi igényt modellspecifikus dokumentáció alátámaszt, amely az Ön ellenőrzéséhez elérhető.
  items:
