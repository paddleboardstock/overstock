features:
  id: features
  tagline: Miért vásároljon a Paddle Board Overstock-tól
  title: Valódi gyár,<br />valódi megtakarítás
  subtitle: Gyárilag közvetlen raktárkészlet és SUP-csomagok – bizonyított minőség kiskereskedelmi felár nélkül.
  columns: 2
  items:
    - title: Akár 60% kedvezmény a kiskereskedelmi árhoz képest
      description: Gyári túlkészleteket és kiárusítási tételeket közvetlenül értékesítünk — közvetítők nélkül, kiskereskedelmi árrés nélkül. Ugyanazok a lapok, amelyek máshol teljes áron kaphatók, itt kiárusítási áron.
      icon: tabler:rocket
    - title: Teljes csomagok
      description: 'Minden SUP teljes csomagként érkezik: lap, utazótáska, kézi pumpa, állítható evező, levehető uszony, spirálosan feltekert póráz és javítókészlet.'
      icon: tabler:clipboard-list
    - title: Bizonyított minőség
      description: Szállítás előtt minden táblát 100%-os nyomáspróbával végeznek 1,25-szeres névleges PSI-vel. 99,3%-os hibamentesség minden tételnél.
      icon: tabler:shield-check
    - title: Nincs minimális rendelés
      description: Vásárolja meg pontosan azt, amire szüksége van. Tegyen egy táblát a kosárba, nézze meg, kész – nincs minimum, nincs árajánlattétel, nincs várakozás.
      icon: tabler:adjustments
    - title: Gyors szállítás világszerte
      description: A készleten lévő rendeléseket 2-3 munkanapon belül szállítjuk Weihakből. Nyomon követett szállítás 50+ országba az EU-ban, Észak-Amerikában, Ázsia-Csendes-óceáni térségben és azon túl.
      icon: tabler:truck-delivery
    - title: 2 éves SUP garancia
      description: Minden SUP tábla és kiegészítő 2 évre van lefedve — drop-stitch varratok, szelepek és kiegészítők is beleértve. A kárigényeket napokon belül intézik, nem heteken.
      icon: tabler:lifebuoy
