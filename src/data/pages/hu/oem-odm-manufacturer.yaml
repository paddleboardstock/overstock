process_section:
  eyebrow: Folyamatunk
  title: Végponttól végpontig OEM/ODM munkafolyamat
  subtitle: A tervezési összefoglalótól a konténerbe rakodásig — hat lépés a saját márkás felfújható vízijárművedhez.
  steps:
    - step: '01'
      title: Specifikáció & Tervezési összefoglaló
      desc: Ossza meg cél specifikációit, CAD rajzait vagy referencia termékét. Mérnöki csapatunk felülvizsgálja az anyagokat, méreteket és a megfelelőségi követelményeket (CE, BSCI) az árajánlat előtt.
    - step: '02'
      title: 3D Forma prototípuskészítés
      desc: Tervezünk és CNC-gépezzük az egyedi formákat SUP deszkákhoz, kajaktestekhez és RIB alkatrészekhez. A prototípus minták 15–20 munkanapon belül készülnek jóváhagyásra.
    - step: '03'
      title: Anyagválasztás & Minta gyártás
      desc: Választhat katonai minőségű PVC (0,9mm–1,2mm), Hypalon CSM vagy drop-stitch mag szövetek közül. Előgyártási mintákat készítünk az Ön márkaszíneivel, logójával és csomagolásával jóváhagyás céljából.
    - step: '04'
      title: CE Gyári audit & Megfelelőség
      desc: Minden OEM rendelés tartalmaz megfelelőségi dokumentációt — CE megfelelőségi nyilatkozat, ISO 9001 nyomonkövethetőségi nyilvántartások, BSCI szociális megfelelőségi jelentés és REACH anyagnyilatkozatok.
    - step: '05'
      title: Tömegtermelés & Soros QC
      desc: A gyártási sorozatok követik 100 pontos minőségellenőrzési listánkat. Minden egységet 24 órás nyomástartó tesztnek, varrat-peeling tesztnek és vizuális ellenőrzésnek vetünk alá csomagolás előtt.
    - step: '06'
      title: FOB Qingdao Logisztika & Szállítás
      desc: A késztermékeket raklapokra helyezzük, fóliázzuk, és konténerbe töltjük a Qingdao kikötőben. Kezeljük az összes export dokumentációt, vámkezelést és valós idejű szállítási nyomon követést biztosítunk.
capabilities_section:
  eyebrow: Gyártási képességek
  title: Mit építünk
  subtitle: Hat magtermelési kapacitás globális B2B partnerek számára.
  items:
    - title: Drop-Stitch SUP Táblagyártás
      desc: Teljes hosszúságú drop-stitch maglaminálás merev, nagy nyomású (15–20 PSIf) álló lapátlemezekhez. Egyedi hosszúság, szélesség, vastagság, biletező profil és grafikai tervezés.
    - title: PVC Fújható csónak gyártása
      desc: Nagyfrekvenciás hegesztett PVC csónakok, tenderek és sporthajók. Több kamra konfiguráció, padlóopciók (léc, légfedélzetes, feltekerhető), valamint kiegészítők integrációja.
    - title: Hypalon RIB Hajógyártás
      desc: Kereskedelmi minőségű Hypalon CSM csövek, amelyeket üvegszálas vagy alumínium mély V törzsekhez rögzítettek. 3,3 m-től 6,0 m-ig terjednek járőrözésre, mentésre, túra- és búvárműveletekre.
    - title: Private Label és egyedi márkaépítés
      desc: 'Teljes privatcímkés szolgáltatás: egyedi logó hőátvitel vagy szitanyomás, márkás csomagolás (kiskereskedelmi dobozok, hordozózsákok), felhasználói kézikönyvek a saját nyelvén, valamint vonalkód/UPCregisztráció.'
    - title: Egyedi forma és szerszámtervezés
      desc: Házon belüli 3D CAD/CAM mérnöki csapat. Egyedi alumínium és kompozit formákat tervezünk és gyártunk egyedi hajótestformákhoz, fedélzeti konfigurációkhoz és kiegészítők rögzítési pontjaihoz.
    - title: OEM Kiegészítők és felszerelés
      desc: Mentőmellények (CE12402), kétfunkciós pumpák, szén/nejlon lapátok, javítókészletek, hordzsákok és pórázösszeállítások. Teljes készlet és csomagcsomagolás a kiskereskedelmi megjelenéshez.
experience_section:
  eyebrow: Valós tapasztalat
  title: Partnerségek, amelyek márkákat építettek
  subtitle: Valódi történetek olyan márkáktól és szervezetektől, amelyek Paddle Board Overstock együttműködtek a OEMgyártás /ODM gyártás terén.
  stories:
    - quote: Egy Paddle Board Overstock szalvétán rajzolt vázlattal és egy követelmények listájával érkeztünk. Nyolc hónappal később már az első próbálkozásra készült termékünk átment CE a tanúsítvánnyal.
      narrative: Egy európai startup, amely új SUP tervezéssel készült, a Paddle Board Overstock ODM gyártáshoz közeledett. Az Paddle Board Overstock R&D csapat a koncepciót CAD tervezésen, FEA szerkezetelemzésen, hidrodinamikai szimuláción, formákészítésen, prototípus gyártásán és gyártási szerszámokon keresztül vitte végig. A startup alapítója háromszor látogatott meg Qingdaóba a folyamat során. A végtermék CE módosítás nélkül átment a tanúsításon – ezt az alapító annak tulajdonítja, hogy Paddle Board Overstocka mérnöki csapat már a kezdetektől fogva érti az európai szabályozási követelményeket.
      context: Európai SUP márkabevezetés, 2023-2024
      source: Brand Founder
    - quote: A NDA védelem és az IP biztonság szintje Paddle Board Overstock magabiztosságot ad nekünk, hogy megoszthassuk saját fejlesztéseinket. Úgy kezelik az IP-nket, mintha az sajátjuk lenne.
      narrative: Egy amerikai székhelyű tengeri berendezésgyártó cég, amely saját szeleptechnológiát alkalmaz, olyan gyártópartnerre volt szükség, aki képes megvédeni szellemi tulajdonukat, miközben nagy léptékben gyártanak. Öt kínai gyártó auditálása után a Paddle Board Overstock gyár IP-védelmi protokolljai, biztonságos tervezési fájlkezelése és szigorú NDA-k aláírásának hajlandósága alapján választották a választást. A partnerség négy év alatt három termékvonalat hozott létre nulla IP-incidens nélkül.
      context: Amerikai tengerészeti felszerelés vállalat, OEM partnerség 2021 óta
      source: Műveleti igazgató
