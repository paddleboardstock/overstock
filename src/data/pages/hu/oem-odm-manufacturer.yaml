breadcrumb: OEM/ODM Gyártó
tldr:
  summary: Paddle Board Overstock közvetlenül a gyártótól származó OEM/ODM gyártó. 12 000 m² ISO 9001:2015 létesítmény, 15 000 egység éves termelés, CE/BSCI/REACH/UKCA megfelelőség, alacsony MOQs 2-10 egységtől.
  points:
    - 12 000 m² ISO 9001:2015 tanúsított Qingdao létesítmény
    - 15 000 egység éves kapacitás 200-300 képzett munkással
    - CE 2013/53/EU, UKCA, BSCI, REACH megfelelőség
    - 'Alacsony MOQs: 2-5 egység (RIB), 5-10 egység (SUP) szabványos modellek esetén'
    - 50+ export ország FOB Qingdao szállítással
