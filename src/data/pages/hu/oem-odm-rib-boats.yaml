content_customization:
  tagline: Mit lehet testreszabni
  title: RIB Testreszabás<br />Lehetőségek
  subtitle: A hajó minden eleme RIB testreszabható az Ön alkalmazásához, piacához és márkájához.
  items:
    - title: Hajótest és szerkezet
      description: A hajótest hossza (2,5–8,5 m), a hajótest anyaga (GRP üvegszál vagy tengeri minőségű alumínium), a hajótest színe (gelbevonat vagy festett), gerincprofil (mély V, közepes V, lapos), kereszt típus (zárt kereszt tartóval vagy kúttal), valamint szerkezeti megerősítés a kereskedelmi terhelési igényekhez.
      icon: tabler:sailboat
    - title: Cső és nyakörv
      description: Csőanyag (0,9–1,2 PVC mm vagy 1,4–1,7 Hypalonmm /CSM), csőátmérő (40–55 cm), kamrák száma (3–7), szeleptípus (Halkey-Roberts, Leafield D7 vagy Boston), cső színe (szabványos vagy egyedi), valamint gallérkúp/kúpos konfiguráció.
      icon: tabler:circle
    - title: Deck és konzol elrendezése
      description: Középkonzol, oldalsó konzol vagy kormányzó kormányzás. Üléselrendezés (jsokéülések, padok, támaszülések). Fedélzet (EVAhab teak kinézetű, csúszómentes festék vagy csupasz GRP). Felszerelés rögzítési pontjai, kapaszkodósínek és D-gyűrűs pozíciók.
      icon: tabler:layout-dashboard
    - title: Elektromos és navigációs
      description: Navigációs lámpák (LED), bilge szivattyú rendszer, akkumulátorkezelés, VHF rádió telepítés, GPS/térképplotter rögzítés, USB töltőportok és kapcsolópanel konfiguráció.
      icon: tabler:bolt
    - title: Márkaépítés és grafika
      description: Törzs- és csőgrafika (szitanyomás, hőátadás, UV digitális nyomtatás), logó elhelyezés, egyedi színsémák, azonosító jelölések, valamint egyedi tulajdonosi dokumentáció a márkádhoz.
      icon: tabler:palette
    - title: Biztonság és megfelelőség
      description: Tervezési kategória minősítés (A/B/C/D per RCDszerint), tűzoltó rendszer, üzemanyag-rendszer specifikáció (hordozható tartály, fix tartály, fedélzet alatt), valamint megfelelőségi dokumentáció a célpiac számára.
      icon: tabler:shield
content_applications:
  tagline: Alkalmazás konfigurációk
  title: RIB Konfigurációk<br />Alkalmazás szerint
  subtitle: A különböző küldetések eltérő konfigurációkat igényelnek. Íme a leggyakoribb alkalmazásokhoz bevált RIB beállítások.
  items:
    - title: Mentés és járőrözés
      description: Mély V test, Hypalon csövek, önálló fedélzete, támaszülések, fogakodó fogantyúk, navigációs lámpák és nehézteherbírás D-gyűrűk.RCD Tervezés B vagy C kategóriá. Tűzálló üzemanyagrendszer és kereskedelmi minőségű elektromos.
      icon: tabler:lifebuoy
    - title: Búvártámogatás
      description: Széles gerenda, hátsó beszállási létra, harckocsi állványhelyek, extra D-gyűrűk, merülőzászló tartó, megerősített főkapaszka iker külső motorokhoz, valamint csúszásmentes teljes EVA fedélzeti fedélzet.
      icon: tabler:mask
    - title: Turizmus és kereskedelmi
      description: Utasok számára tanúsított elrendezés padülésekkel, napárnyék/Biminivel, fogasínekkel, száraztárolással és kettős akkumulátorrendszerrel.RCD C kategória. Üdülő- és charter flotta üzemeltetésére tervezték.
      icon: tabler:beach
    - title: Halászat
      description: Nyitott fedélzeti elrendezés, bottartó pozíciók, élő csali, halkereső tartó, trollómotortartó, megerősített kereszt és hordozható üzemanyagrendszer. Középkonzol vagy oldalkonzol opciók.
      icon: tabler:fish
    - title: Szabadidő és jacht tender
      description: Könnyű test, PVC csövek, kényelmes ülések, teleszkópos kormánykar vagy kompakt konzol, emelési pontok davitra, valamint eltávolítható üzemanyagtank. RCD C vagy D kategória.
      icon: tabler:sailboat
    - title: Professzionális munkahajó
      description: Alumínium test opció, erősített szerkezet, hidraulikus kormányzás, kereskedelmi minőségű elektromos rendszer, radarív és küldetés-specifikus felszerelés integrációs pontok. Egyedi megfelelőség projekt szerint.
      icon: tabler:anchor
process_steps:
  title: 7-lépéses RIB OEM/ODM fejlesztési folyamat
  subtitle: A projekt áttekintésétől az értékesítés utáni szolgáltatásig — meghatározott munkafolyamat világos mérföldkövekkel és teljesítési pontokkal
  steps:
    - number: '01'
      title: Projekt áttekintés és követelmények
      description: Határozza meg a célalkalmazást, a hajótest méretét, a cső anyagát, a megfelelőségi követelményeket és a márkaigényeket. Felmérjük a kivitelezhetőséget és megerősítjük az együttműködési modellt (OEM/ODM/Félig egyedi/ Teljesen egyedi).
      timeline: 3–5 nap
    - number: '02'
      title: Műszaki felülvizsgálat és kivitelezhetőség
      description: A mérnöki csapat áttekinti a szerkezeti kivitelezhetőséget, a stabilitás és a felhajtóerő számításokat, a megfelelőségi irányt, és az anyagelérhetőséget. Megállapítjuk a meglévő formákat vagy az egyedi forma igényeket.
      timeline: 5–7 nap
    - number: '03'
      title: Ajánlat és árajánlat
      description: Részletes javaslatot kap, beleértve a specifikációkat, 3D rendereléseket vagy GA rajzokat, a megfelelőségi hatókört, az idővonalat és az egységárakat a mennyiségi szintek és MOQ alapján.
      timeline: 5–7 nap
    - number: '04'
      title: Tervezés jóváhagyása és mintakészítés
      description: Jóváhagyja a végső GA-t, fedélzet elrendezést és cső konfigurációt. Előállítunk egy előgyártási mintát az Ön márkaszíneivel, logójával és meghatározott anyagokkal, fizikai ellenőrzés céljából.
      timeline: 15–20 nap
    - number: '05'
      title: Minta jóváhagyása és QC protokoll
      description: 'Ellenőrizze és hagyja jóvá a mintát. Határozza meg a gyártási QC protokollt: nyomáspróba (1,25x / 24–48 óra), méretellenőrzések és a megfelelőségi dokumentációs ellenőrző lista hajónként.'
      timeline: 3–5 nap
    - number: '06'
      title: Tömeggyártás és minőségellenőrzés
      description: Teljes termelési futam 100 pontos QC ellenőrző listával egységenként. Folyamat közbeni ellenőrzések, nyomáspróba és sorozatszintű nyomonkövethetőség. CE/ISO dokumentáció párhuzamosan elkészítve.
      timeline: 30–45 nap
    - number: '07'
      title: Csomagolás, szállítás és értékesítés utáni szolgáltatás
      description: Egyedi csomagolás (standard, kiskereskedelmi, vagy raklapos), export dokumentáció, konténer betöltés és logisztika. Tartalmaz pótalkatrész-készleteket és karbantartási dokumentációt.
      timeline: 7–14 nap
