content_service_modules:
  tagline: Szolgáltatási modulok
  title: OEM/ODM Szolgálat<br />Modulok
  subtitle: Minden projekt a megfelelő szolgáltatási modulokat egyesíti. Nem minden projektnek kell minden modulra szüksége — mi csak azt vizsgáljuk, amire a te projekted szüksége van.
  items:
    - title: Mérnöki áttekintés és megvalósíthatóság
      description: 'Hajótest platformjának értékelése, szerkezeti megvalósíthatóság-ellenőrzés, stabilitás- és felhajtóképesség-ellenőrzés, megfelelőségi útvonal azonosítása, valamint anyag rendelkezésre állásának igazolása. Kimenet: megvalósíthatósági jelentés be/nem engedélyezési ajánlással.'
      icon: tabler:math-function
    - title: Tervezés és konfiguráció
      description: 'GA rajz, fedélzeti elrendezés, cső konfiguráció, konzol- és üléspozíciók, berendezések rögzítési terve, valamint szín/anyag kiválasztása. Kimenet: jóváhagyott GA és konfigurációs specifikáció.'
      icon: tabler:ruler
    - title: Példa és prototípus
      description: Előkészítő minta jóváhagyott színekkel, logóval és meghatározott anyagokkal a fizikai ellenőrzéshez. Tartalmazza a mintajóváhagyási protokollt, az ellenőrzési listát és a módosítási kérelmezési folyamatot.
      icon: tabler:3d-cube-sphere
    - title: Gyártás és minőségellenőrzés
      description: Tömeggyártás 100 pontos minőségellenőrzési listával egységenként, folyamatban lévő ellenőrzésekkel, nyomásteszteléssel (1,25x / 24-48 órás) és sorozatos szintű nyomon követhetőséggel. CE/ISO párhuzamosan készült dokumentáció.
      icon: tabler:clipboard-check
    - title: Márkaépítés és csomagolás
      description: Privatcímkés logó alkalmazás, egyedi hajótest és cső grafika, márkázott tulajdonosi dokumentáció, kiskereskedelmi vagy raklapos csomagolás, valamint tartalék alkatrészkészletek előkészítése.
      icon: tabler:palette
    - title: Export és dokumentáció
      description: Exportcsomagolás, konténer betöltési terv, FOB/CIF/DDP dokumentáció, megfelelőségi papírok célpiac szerint, valamint a szállítás utáni kommunikációs protokoll.
      icon: tabler:world
content_risk_control:
  tagline: Kockázat- és szállítási irányítás
  title: Projekt Risk &<br />Szállítási menedzsment
  subtitle: A OEMszakemberek /ODM vevők ugyanúgy törődnek a kockázatkezeléssel, mint a termékminőséggel. Íme, hogyan kezeljük ezt.
  items:
    - title: Hatáskör és tulajdonjog meghatározása
      description: 'A fejlesztés előtt írásban meghatározzuk: testreszabási keretet, szerszámhasználati követelményeket, mintajóváhagyási kritériumokat, rajzok és formák tulajdonjogát, valamint dokumentációs felelősségeket. Nincs egyértelmű abban, ki mit birtokol.'
      icon: tabler:file-text
    - title: Változásirányítási folyamat
      description: Minden specifikációs változás a tervezés megerősítése után dokumentált módosításkérési folyamatot követ hatásértékeléssel (költség, idővonal, megfelelőség). Nincs jóváhagyatlan módosítás gyártásban.
      icon: tabler:arrows-diff
    - title: Köteg konzisztencia garancia
      description: Az 50. egység megegyezik az első jóváhagyott mintával. Az engedélyezett specifikációkat lefagyasztják, az anyag- és folyamatparaméterek rögzítettek, és a folyamatban lévő ellenőrző pontok ellenőrzik a gyártási folyamat során a következetességet.
      icon: tabler:repeat
    - title: Szállítási és kapacitás átláthatósága
      description: Az előszállítási idők a tényleges termelési kapacitás, az anyagkészlet és a jelenlegi rendelési terhelés alapján vannak felidézve – nem a célpontok alapján. Gyártási menetrend, amelynek mérföldkövei a rendelésenként megadják a dátumokat.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Gyakran Ismételt Kérdések
  questions:
    - q: Mi a különbség a OEM ODM hajók között és között RIB ?
      a: 'OEM (Eredeti berendezésgyártás): részletes specifikációkat adsz meg, mi pedig elkészítjük a tervedet.ODM (Eredeti tervezési gyártás): Ön egy bevált Aquafarer RIB platformot választ, amit a kívánt jellemzőkkel és márkával szabunk ki.ODM gyorsabb és alacsonyabb költségű;OEM maximális tervezési irányítást biztosít.'
    - q: Testreszabhatom a RIB hajótest formáját és méretét?
      a: Igen. Félig egyedi módosításokat kínálunk meglévő hajótestformákhoz (különböző fedélzeti elrendezések, csőkonfigurációk), valamint teljes egyedi hajótestfejlesztést újCNC, megmunkált formákkal. A félig egyedi projektek kezdődhetnek 2-5 egységgel; a teljes egyedi projektek általában nagyobb elkötelezettséget igényelnek.
    - q: Milyen csövek vannak elérhetők egyedi RIBseszközökhöz?
      a: 0,9-1,2 mm PVC kínálunk szabadidős és könnyű kereskedelmi használatra, valamint 1,4-1,7 mm HypalonCSM / profi, mentő- és kereskedelmi alkalmazásokhoz, amelyek kiváló UV és ózonellenálló igényt igényelnek (10-15 éves élettartam, szemben 5-8 év).PVC
    - q: Be tudsz RIBs állítani speciális alkalmazásokhoz, mint például mentés, búvárkodás vagy horgászat?
      a: Igen. Bevált konfigurációs sablonokat tartunk fenn mentés/járőrözés, búvártámogatás, turizmus/charter, horgászat, jacht-tender és professzionális munkahajó alkalmazások számára. Minden sablon tartalmaz ajánlott hajótesttípust, csőanyagot, fedélzeti elrendezést és felszerelést — amelyeket aztán az Ön igényeihez igazítunk.
    - q: Milyen információra van szükséged egy RIB OEM/ODM idézéshez?
      a: Célalkalmazás esetén a kívánt hajótesthossz, csőanyag-preferencia (PVCvagyHypalon), a közelítő mennyiség és szállítási ütemterv, a célpiac megfelelőségi követelményei, valamint bármilyen referencia termékek vagy specifikációk. Minél több részletet adsz be, annál gyorsabb és pontosabb az árajánlatunk.
    - q: Mi MOQ a lehetőség RIB az egyedi hajókra?
      a: A meglévő törzsformáknál szabványos módosításokkal MOQ 2-5 egységgel kezdődik tervenként. Egyedi formák és teljes egyedi fejlesztés esetén MOQ a projekt összetettségétől függ — általában 10-20 egység félig egyedi, 30+ egység teljesen egyedi új szerszámokkal.
    - q: Kié az egyedi formák és rajzok?
      a: Az alaptervekkel kifejlesztett formák Aquafarer Aquafarer továbbra is tulajdon maradnak. Az ügyfél által megrendelt és fizetett teljesen egyedi formák szerződés feltételei szerint a vevő tulajdonához rendelhetők. Minden penésztulajdonlási feltételt a projekt kezdete előtt dokumentálnak.
    - q: Hogyan RIBs csomagolnak egyedi exportra csomagolva?
      a: 'Szabvány: egyedi bölcső + stretch-wrap konténerrakodáshoz. Premium: kiskereskedelmi csomagolás, vákuumpakolás vagy raklapos csomagolás. FOB Qingdao CIFés DDP szállítást kínálunk. Teljes exportdokumentáció és vámellenőrzés is beletartozik.'
