        - Kompakt kialakítás (4,5-5,5 m) fedélzeti tárolásra vagy a lakófedélzet mögött történő vontatásra
        - Megerősített törzs gyakori partraszállásokhoz és zátonyhajózáshoz
        - Gyors felfújás/leeresztő csőopciók a tárolás hatékonysága érdekében
        - Alacsony profilú búvárlétra a vízből való könnyű felszálláshoz
        - Nehéz emelőpontok davit vagy daru indítórendszerekhez
