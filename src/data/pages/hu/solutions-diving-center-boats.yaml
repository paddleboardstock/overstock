  title: Kereskedelmi hajók RIB<br />Búvárközpontok és napi működés
  subtitle: Stabil, tágas platformok, amelyeket napi többjáratos búvárműveletekre terveztek — nagy felszerelésű fedélzetekkel, búvárbarát beszállási rendszerekkel és tengeri szintű tartóssággal trópusi sós vízi környezetekhez.
