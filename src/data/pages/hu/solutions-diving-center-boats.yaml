        - Kompakt teraszrendezés 8-10 vendég számára, minimális környezeti lábnyomtal
        - Egyszerű karbantartási tervezés — elérhető alkatrészek helyi karbantartáshoz
        - Semleges színválaszték, amelyek jól illeszkednek a természetes környezethez
        - Könnyű szerkezet partraszálláshoz és sekély vízi műveletekhez
    - title: Premium Liveaboard operátorok
      subtitle: Többnapos búvárszafarik, expedíciós búvárkodás, távoli atollok
      description: 'A fedélzeti üzemeltetőknek olyan kiszolgáló hajókra van szükségük, amelyek több szerepet töltenek be: búvárszállítást zátonyokra, felszerelésszállítást, vészhelyzeti támogatást és vendégkirándulásokat. Elég RIB kompaktnak kell lenniük ahhoz, hogy fedélzeten tárolják vagy vontatják, ugyanakkor elég alkalmasnak kell lenniük nyílt vízi átkelésekre különböző körülmények között. A napi vízrebocsátás és visszanyerés masszív építkezést igényel.'
