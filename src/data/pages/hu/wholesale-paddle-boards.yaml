who_section:
  tagline: Kit szállítunk
  title: Független vízsport-vállalkozások számára épült
  items:
    - title: Strand és szörfüzletek
      description: Kis tengerparti kereskedők, akiknek szezononként 5–15 deszkára van szükségük, keverve a turisták számára készült általános modelleket és a helyieknek szánt szörfstílusú deszkákat.
    - title: Online eladók
      description: Az e-kereskedelmi boltok és piactéri eladók tesztelik SUP a kategóriát anélkül, hogy egyetlen modell teljes konténerét kötnék el.
    - title: Bérlő flották és iskolák
      description: Bérlési műveletek és SUP iskolák töltik fel a flottát — tartós deszkák, vegyes modellek különböző méretű ügyfelek kiszolgálására, valamint garanciális tartalékosok.
    - title: Üdülőhelyek és túraszervezők
      description: Szállodák, szigeti üdülőhelyek és túraszervezők kis SUP kezdeti flottákkal és könnyű szezonális feltöltéssel bővítik tevékenységi kínálatukat.
