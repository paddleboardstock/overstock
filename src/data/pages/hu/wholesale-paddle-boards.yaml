  tagline: Hogyan Működik
  title: Hogyan kell nagykereskedelmi rendelést leadni
  steps:
    - title: Böngészd a készletet
      description: Nézd át a fenti 11 készleten lévő modellt, vagy használd a vegyes modellválasztót, hogy olyan kombinációt készíts, amely megfelel ügyfeleidnek.
    - title: Kérjen árajánlatot
      description: Küldd el nekünk a modelleket, becsült mennyiségeket, országodat és a kívánt szállítási sebességet az alábbi kérdőformán keresztül. Válaszolunk az egységárakkal és a szállítási lehetőségekkel.
    - title: Megerősítés és kifizetés
      description: Hagyd jóvá a végső ajánlatot — modellek, mennyiségek, szállítási módszer és összérték. A fizetési feltételeket az árajánlat alapján megerősítik.
    - title: Tesztelünk, csomagolunk és szállítunk
      description: Minden deszka 100%-ban nyomásteszttel van ellátva, teljes kiegészítő készlettel van csomagolva, és Weihai-ból érkezik. A teljes út követését kapod.
