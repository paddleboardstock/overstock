faq_section:
  title: Nagykereskedelmi GYIK
  items:
    - q: Mi a minimális nagykereskedelmi rendelés?
      a: Öt tábla. A túlzott készletünk kis kiskereskedőknek készült — nem kell tartályt tölteni ahhoz, hogy nagykereskedelmi árakat kapj.
    - q: Keverhetek különböző SUP modelleket egy nagykereskedelmi rendelésben?
      a: Igen. A vegyes modellrendelések az egyik legnagyobb előnye a túlzott készlet vásárlásának — ha egyetlen szállítmányban összevonod a készleten lévő modelleket, a teljes deszkeszcsatorna határozza meg az árszintedet. Részletekért lásd vegyes modell nagykereskedelmi oldalunkat.
    - q: A táblák vadonatújak?
      a: Igen. Minden tábla vadonatúj, fel nem használt, többletkészlet — soha nem másodpéldány, felújított vagy visszaküldött. Minden táblát 100%-ban nyomáspróbának vetünk alá a szállítás előtt.
    - q: Mennyivel olcsóbb a nagykereskedelmi árazás a kiskereskedelmi árnál?
      a: A nagykereskedelmi egységárakat rendelésenként adjuk meg a modellek és mennyiségek alapján, és jelentősen alacsonyabbak a fent feltüntetett kiskereskedelmi áraknál. Kérjen árajánlatot a kívánt keverékhez, és pontos árat adunk.
    - q: Melyik szállítási módot válasszam?
      a: Az expressz légi fuvar 1–3 tábla, mintadarabok és sürgős készletfeltöltés esetén ideális. A konszolidált tengeri fuvar gazdaságos választás 5–20 tábla kiskereskedelmi rendeléshez. Minden lekérdezéshez mindkét lehetőséget árajánlatként megadjuk.
    - q: Milyen garanciát vállalnak a nagykereskedelmi táblák?
      a: Ugyanaz a 2 éves SUP garancia, amelyet minden ügyfelünknek adunk, az összes 50+ országban, ahová szállítunk.
    - q: Szállítanak az én országomba?
      a: Jelenleg több mint 50 országba szállítunk, regionális útmutatókkal Latin-Amerikára, Délkelet-Ázsiára, Afrikára, a Közel-Keletre, valamint kulcsfontosságú piacokra, beleértve Mexikót, Brazíliát, a Fülöp-szigeteket, Indonéziát, Thaiföldet, Dél-Afrikát, Kenyát és az Egyesült Arab Emírségeket. Kérdezze meg az árajánlatkérésnél, és megerősítjük a jelenlegi szolgáltatást az Ön címére.
