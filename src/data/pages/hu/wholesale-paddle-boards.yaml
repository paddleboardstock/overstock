  tagline: Jelenlegi készlet
  title: Elérhető termékek és aktuális készlet
  subtitle: Az alábbi 11 termék mind a jelenlegi túlkészlet. Az állapotok vadonatújak; a készletek hetente változnak, ezért erősítsd meg a rendelkezésre állást az ajánlatkérésedben.
  table_labels:
