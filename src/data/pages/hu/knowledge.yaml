hero:
  tagline: Tudásgráf
  title: Vízkutatási Tudás
  subtitle: |
    Egy strukturált tudásbázis a felfújható SUP technológiáról,<br />
    vízbiztonság, hajómérnökség és kalandtervezés.
  taglineSection: Fedezd fel. Tanulj. Menj magabiztosan.
clusters:
  tagline: Tudás klaszterek
  title: Böngésszen téma szerint
  subtitle: Mély merülések a technológia, a biztonság és a készségek mögött, amelyek minden Paddle Board Overstock terméket jellemeznek.
  items:
    - title: SUP Tudás
      description: Az első deszkád kiválasztásától a haladó túrázási technikákig — minden, ami a szabadon álló eveződeszkázásról szól.
      icon: tabler:lifebuoy
      topics:
        - Hogyan válassza ki az első felfújható SUP-ját
        - A SUP legjobb mérete kezdőknek
        - Mennyire nehéz a vízi evezés állva?
        - Felfújható vs kemény deszka összehasonlítás
        - SUP biztonsági ellenőrzőlista
    - title: Hajóismeret
      description: Műszaki útmutatók felfújható csónakokról, RIBs, kishajókról és kajakokról — mérnöki ismeretek, anyagok és működtetés.
      icon: tabler:sailboat
      topics:
        - A felfújható csónak típusai magyarázata
        - PVC vs Hypalon összehasonlítása
        - RIB vs Dinghy összehasonlítás
        - Drop-stitch technológiai mélyreható elemzés
        - Tengeri anyagtudományi útmutató
    - title: Biztonsági ismeretek
      description: Alapvető biztonsági ismeretek minden evezős számára — a PFD kiválasztásától az időjárás olvasásán át az önmentő technikákig.
      icon: tabler:shield
      topics:
        - SUP biztonsági ellenőrzőlista
        - Szükséged van mentőmellényre?
        - Óceáni evezés biztonsági útmutató
        - Folyóbiztonság felfújható kajakokhoz
        - Időjárási és vízállapot-tudatosság
    - title: Technológia
      description: A Paddle Board Overstock termékek mögötti mérnöki munka — anyagok, építési módszerek és minőségellenőrzés.
      icon: tabler:microscope
      topics:
        - Tengerészgyalogos PVC technológia
        - Drop-stitch A Core magyarázatát
        - Miért PSI fontos a felfújható SUPsgép
        - RF hegesztés vs ragasztókötés
        - Minőségellenőrzés és tanúsítás
    - title: Üzleti ismeretek
      description: Kereskedelmi útmutatók vízi sportüzlet építéséhez és bővítéséhez — a bérlési műveletektől a saját márkás márkázásig.
      icon: tabler:briefcase
      topics:
        - Hogyan indítsunk SUP bérleti vállalkozást
        - Üdülőhelyi vízi sportközpont építése
        - Ütődeszka flotta méretezése klubokhoz
        - Felfújható vs kemény SUP kereskedelmi használatra
        - A legjobb kajak alapanyag bérelhető flottákra
        - Saját márkás vízmárka indítása
        - Üdülőhelyek vízi sportjai bevételi stratégiák
        - Kereskedelmi berendezések karbantartási útmutató
