hero:
  tagline: Tanúsítványok és szabványok
  title: Minőségi tanúsítványok<br />& Megfelelőségi szabványok
  subtitle: Paddle Board Overstock A termékeket a nemzetközi tengeri biztonsági szabványok, minőségirányítási rendszerek és környezetvédelmi előírások szerint gyártják.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock Minőségi tanúsítványok és megfelelőségi dokumentáció
content_certifications:
  tagline: Tanúsítványaink
  title: Minősített minőség,<br />Világszerte elismert
  subtitle: 64 CEtanúsított modellek és gyárszintű tanúsítványok bizonyítják elkötelezettségünket a minőség, biztonság és környezeti felelősségvállalás iránt.
  items:
    - title: CE Minősített
      description: A 64 CEtanúsított modellek megfelelnek az európai CE jelölési követelményeknek a szabadidős vízi járművek esetében, biztosítva a biztonsági, egészségügyi és környezetvédelmi szabványok teljesülését.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Minőségirányítási rendszerünk ISO 9001:2015 minősítéssel rendelkezik, amely felfújható vízi járművek és tengeri berendezések tervezését, gyártását és elosztását foglalja lehetővé.
      icon: tabler:clipboard-check
    - title: UKCA Megjelölve
      description: Az Egyesült Királyság piacán értékesített termékek UKCA jelölést viselnek, amely igazolja, hogy megfelelnek az Egyesült Királyság tengeri felszerelésekre és személyes vízi járművekre vonatkozó előírásoknak.
      icon: tabler:shield
    - title: BSCI Megfelelőség
      description: Paddle Board Overstock BSCI (Business Social Compliance Initiative) auditált, bemutatva az etikus gyártási gyakorlatokat, a tisztességes munkakörülményeket és az ellátási lánc felelősséget.
      icon: tabler:heart-handshake
    - title: REACH Megfelelő
      description: Minden termékben használt anyag Paddle Board Overstock megfelel az EU REACH kémiai biztonsági előírásainak, így biztosítva, hogy ne legyenek korlátozott anyagok a PVCmi , Hypalon, vagy az összetevőkben.
      icon: tabler:flask
    - title: Anyagtesztelés
      description: A szöveteket a húzószilárdság, szakadásellenállás, UV lebomlás és hideg repedés-teljesítmény szempontjából tesztelik. Minden gyártási adagot mintavétel és ellenőrzés alatt áll.
      icon: tabler:test-pipe
content_factory:
  tagline: Gyári szabványok
  title: Gyártási kiválóság<br />— Specifikáció szerint épült
  subtitle: 12 000 m²-es létesítményünk szigorú minőségellenőrzési protokollok szerint működik a termelés minden szakaszában.
  list:
    - 'Beérkező anyagellenőrzés: Minden nyersanyagot — PVC anyag, Hypalonalumínium, rétegelt lemez, ragasztó — a gyártás előtt a specifikációk szerint tesztelnek.'
    - 'Folyamatban lévő minőségellenőrzés: Minden gyártási szakaszban dokumentált minőségellenőrzési pontok vannak. A hegesztési szilárdság, a varrás igazítása, a szelep telepítése és a rögzítési nyomatékot sorban ellenőrzik.'
    - 'Nyomásvizsgálat: Minden felfújható kamrát 1,25× névnyomáson tesztelik 24–48 órán át. A szivárgás rátájának elfogadható határon kell lennie a ISO 6185 szerint.'
    - 'Végső ellenőrzés: A kész termékeket a szállítás előtt átvizsgálják a méretpontosság, a kozmetikai felület, a kiegészítők teljessége és a csomagolás integritása szempontjából.'
    - 'Kötesen nyomon követhetőség: Minden termék sorozatszámot hordoz, amely a gyártási tétel nyilvántartásokhoz kapcsolódik, így a nyersanyagtól a késztermékekig való teljes nyomon követhetőség érhető el.'
content_safety:
  tagline: Tengeri biztonsági szabványok
  title: Biztonság az első<br />— Megbízható működésre tervezve
  subtitle: A Paddle Board Overstock termékeket úgy tervezték és tesztelték, hogy megfeleljenek a nemzetközi tengeri biztonsági szabványoknak kereskedelmi és rekreációs felhasználásra.
  items:
    - title: ISO 6185
      description: A felfújható hajók megfelelnek a ISO 6185 szabványoknak a szerkezet, stabilitás, felhajtóerő és teherbírás tekintetében.
      icon: tabler:sailboat
    - title: ABYC Szabványok
      description: Az elektromos és üzemanyagrendszerek az ABYC (American Boat & Yacht Council) szabványai szerint vannak telepítve és működtetve, biztonságos használatra.
      icon: tabler:bolt
    - title: SOLAS Megfelelőség
      description: A biztonsági felszerelések és életmentő eszközök a SOLAS (Életbiztonság a tengeren) követelményeknek felelnek meg, ahol alkalmazható.
      icon: tabler:lifebuoy
