testimonial:
  content: Elindítottam a SUP márkámat iparági tapasztalat nélkül. Aquafarer csapata végigvezetett a termékválasztástól a saját logó és csomagolás tervezéséig. Az első konténer 11 hét alatt érkezett meg, és 3 hónap alatt teltház lett az Amazonon. Most rendelem a harmadik konténert.
  name: Michael Park
  title: Alapító, Shoreline Paddle Co. — Kalifornia, USA
content_segments:
  tagline: Vállalkozói profilok
  title: Vízisport márka indítása<br />Vállalkozó típus szerint
  subtitle: Különböző alapítók különböző erősségekkel rendelkeznek — e-kereskedelem szakértelem, iparági kapcsolatok, tartalom elérése vagy értékesítési infrastruktúra. A OEM/ODM indítási programot az induló helyzethez és a növekedési ambícióhoz igazítjuk.
  items:
    - title: Amazon FBA & E-kereskedelem eladók
      subtitle: Adatalapú, gyorsan növekvő márkáképítők
      description: Tapasztalt online eladók, akik vízisport termékeket indítanak el Amazonon, Walmarton vagy saját Shopify áruházukban. Tudja, hogyan kell optimalizálni a listázásokat, kezelni a PPC-t és olvasni a kategória adatokat — de szüksége van egy gyártó partnerre, aki érti az e-kereskedelem tempóját, a visszaküldési arányokat és a szezonális keresletingadozásokat.
      features:
        - Kiskereskedelmi kész csomagolás, optimalizálva FBA méretkorlátokhoz
        - EAN/UPC vonalkód-generálás és Amazon-kompatibilis dokumentáció
        - Alacsony MOQ (2–5 egység per RIB SKU, 5–10 per SUP) a kereslet teszteléséhez a bővítés előtt
        - Vegyes konténerkonszolidáció az egységre jutó költség optimalizálásához
    - title: Fitness & szabadtéri életmód influencerek
      subtitle: Közönség-első márkateremtők
      description: Tartalomkészítők, fitnesz edzők és szabadtéri személyiségek, akiknek aktív közönségük van, és készen állnak arra, hogy életmód márkába fektessenek be. Ön hozza a közösséget és a márkatörténetet — mi kezeljük a termékfejlesztést, a megfelelőséget, a csomagolást és a logisztikát, így Ön a tartalomra és az átváltásra tud koncentrálni.
      features:
        - 'Gyorsváltású egyedi márkaépítés: 2 hetes mintakör logóval + színekkel'
        - Közös márkázású limitált kiadások és szezonális színvariációk
        - Életmód fotó- és videótartalom készítési támogatás
        - 'Közvetlen fogyasztói kiszolgálás: gyári → ügyfél drop shipping'
    - title: Regionális Disztribútorok Közvetlen Fogyasztói Értékesítésbe
      subtitle: B2B üzemeltetők saját márkájuk elindításával
      description: Már megalapozott tengeri vagy szabadtéri felszerelés-disztribútorok, akik saját márkát kívánnak indítani a harmadik fél termékeinek értékesítése mellett vagy helyett. Már rendelkezik raktári infrastruktúrával, logisztikai kapcsolatokkal és ügyfélbázissal — szüksége van egy gyári partnerre, aki képes privát címkés minőséget szállítani nagy mennyiségben.
      features:
        - Exkluzív terméktervek az Ön piaci területére
        - Teljes OEM formafejlesztés saját formákhoz és specifikációkhoz
        - Helyi megfelelőségi dokumentáció (CE, UKCA, USCG) az Ön régiójához
        - 'Közös márkázású csomagolás: disztribútor márkája + Aquafarer minőségi jelzés'
    - title: Első márkát indítók
      subtitle: Végigvezetett márkaalkotás az elejétől a végéig
      description: Szenvedélyes vállalkozók, akiknek nulla vízi sport ipari tapasztalatuk van, és saját márkát szeretnének építeni a semmiből. Olyan partnerre van szükségük, aki minden lépésnél kézen fogja őket — a termékválasztástól és név adásától a csomagolás tervezésén és az első konténer logisztikáján keresztül — tiszta ütemtervekkel és átlátható árazással.
      features:
        - Tanácsadói termékválasztás 50+ bizonyított alaptervről
        - 'Márkaidentitás-csomag: névadás, logó, színpaletta, csomagolástervezés'
        - 60–90 napos ütemterv a koncepciótól az első szállításig
        - Dedikált projektmenedzser az első márkatulajdonosok számára
