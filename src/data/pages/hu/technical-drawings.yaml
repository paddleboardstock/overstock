content_tiers:
  tagline: Letöltési szintek
  title: Négy hozzáférési szint<br />— A megfelelő részlet a megfelelő szakaszhoz
  subtitle: Beszerzési szintű rajzokat biztosítunk, nem gyártási szintű fájlokat. Minden szint más-más projektfázishoz igazodik.
  items:
    - title: Szint 1 — Nyilvános PDF
      description: Általános elrendezés (GA), 4 nézetes méretrajz és fedélzeti elrendezés PDF formátumban. Ingyenes letöltésre elérhető. Elég a projekttervezéshez, helyelosztáshoz és előzetes specifikáció áttekintéshez.
      icon: tabler:file-type-pdf
    - title: Szint 2 — Könnyített DXF/DWG
      description: 2D CAD fájlok (DXF vagy DWG) tervezési szintű elrendezés beillesztéséhez. Rövid jogosultsági űrlap kitöltését igényli (cég neve, projekt típusa, tervezett felhasználás). Nincs benne szerkezeti vagy gyártási adat.
      icon: tabler:file-code
    - title: Szint 3 — Projektkérelem STEP/IGES
      description: 3D modell fájlok (STEP vagy IGES) rendszerintegrációhoz, berendezéstervezéshez vagy hajózási koordinációhoz. Projektkérelmet igényel, beleértve a projekt terjedelmét, ütemtervét és vételi szándékot. Jóváhagyás függvénye.
      icon: tabler:cube
    - title: Szint 4 — NDA Mérnöki
      description: Hajószerkezeti rajzok, laminálási ütemezések, csővágási kiterjedések és öntőforma adatok. Csak NDA alatt, megerősített megrendelésekkel elérhető. Ezek gyártási szintű fájlok — nem nyilvános terjesztésre.
      icon: tabler:lock
content_included:
  tagline: Mi van benne
  title: Rajz tartalma<br />Modellenként
  subtitle: Minden modellnek van egy szabványos B2B rajzcsomagja, amely tartalmazza a vevők és projektmérnökök számára az alapvető tervezési információkat.
  items:
    - title: Általános elrendezés (GA)
      description: Oldalprofil, felülnézet és keresztmetszet a hajótest alakját, csőállását, konzol helyét, üléshelyét, üzemanyagrendszerét és kulcsméreteket (LOA, gerenda, csőátmérő, deadrise szög) mutatja be. A módosítás állapota és szerzői joga a címblokkon szerepel.
      icon: tabler:layout
    - title: 4-nézetű dimenziórajz
      description: Oldal, elöl, hátulról és felülnézet, összesített méretekkel a szállítási tervezéshez (magasság a pótkocsin, gerenda a konténerben, súly emeléshez). Tartalmazza az üzemeltetési és szállítási konfigurációkat.
      icon: tabler:ruler-2
    - title: Fedélzeti elrendezés és felszerelésterv
      description: Felülről lefelé néző fedélzeti nézet, amely a konzol alapja, üléspozíciók, D-gyűrű helye, navigációs lámpa pozíciója, bilge szivattyú hozzáférése, akkumulátor/üzemanyag-rekesz és felszerelés beszerelési pontjai látható. Korlátozott pontosság a saját interfészeken.
      icon: tabler:map
    - title: Szállítási és csomagolási rajz
      description: Konténerrakodó terv, a bölcső méretei, súlyelosztása és az emelési pontok pozíciói logisztikai tervezéshez. Tartalmazza a szabványos és egyedi csomagolási lehetőségeket.
      icon: tabler:truck
content_protection:
  tagline: IP-védelem
  title: Amit nem osztunk meg<br />& Miért
  subtitle: Mérnöki szellemi tulajdonunk védelme biztosítja, hogy továbbra is befektethessünk az R&D-be, miközben továbbra is mindent biztosítunk, amire a vevők a projekttervezéshez szükségük van.
  items:
    - title: Törzs penészmag adatok
      description: A dugó- és forma geometriája, CNC szerszámpályák és laminálási sablonok saját fejlesztésű eszközök. Ezek nem oszthatók meg semmilyen hozzáférési szinten, kivéve NDA a megerősített szerződéseket.
      icon: tabler:ban
    - title: Csővágó bővítések
      description: A csőszövet lapos mintás vágási fájljai gyártási szintű adatok. Csak NDA megerősített gyártási megrendelések alapján elérhetők, és csak a szerződéses féllel osztják meg.
      icon: tabler:ban
    - title: Szerkezeti számítások
      description: A részletes stresszelemzés, az FEA eredmények és a laminált ütemtervek megfelelőségi érzékeny dokumentumok, amelyeket csak a Értesített Testületekkel és NDAa kötött ügyfelekkel osztanak meg a megfelelőségértékelési folyamat során.
      icon: tabler:ban
    - title: Versenytárs szűrése
      description: Fenntartjuk a jogot, hogy elutasítsuk azokat a CAD hozzáférési kérelmeket, amelyek úgy tűnik, versenytársaktól, projektkontextus nélküli hallgatóktól vagy olyan felektől, akiknek jogos beszerzési szándékuk van.
      icon: tabler:shield
