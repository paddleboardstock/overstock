content_version_control:
  tagline: Verziókezelés
  title: Rajzos változat<br />Vezetés
  subtitle: Minden rajz egy kontrollált átdolgozási rendszert követ. Mindig ellenőrizd, hogy a jelenlegi módosításod megvan, mielőtt a rajzokat projekttervezéshez használnád.
  items:
    - title: Módosításkövetés
      description: Minden rajz tartalmaz egy átdolgozó kódot (Rev-A, Rev-B, Rev-C), kiadás dátumát, utolsó átvizsgált dátumot, az adott modellt/konfigurációt, egységeket, fájlméretet és formátumot. Csak a "Current" verzió érhető el letölthetőnek.
      icon: tabler:git-branch
    - title: Rajzolási állapot értesítés
      description: Minden nyilvános rajz "Csak előzetes eligazítás – nem építésre, tanúsításra vagy gyártási célra" jelöléssel. A méreteket végleges specifikáció és megrendelés jóváhagyása alá vonják." Ez mindkét felet megvédi a helytelen alkalmazástól.
      icon: tabler:alert-circle
    - title: Frissítési értesítések
      description: Amikor egy modellspecifikáció megváltozik, a rajz módosítása frissül, és a korábbi verziókat "Felülírva" jelölik. Azok a regisztrált felhasználók, akik DXF/DWG csomagokat töltöttek le, e-mailben értesítik a jelentős frissítéseket.
      icon: tabler:bell
faq:
  title: Műszaki rajzok — Gyakran Ismételt Kérdések
  questions:
    - q: A GA PDF-ek tényleg ingyenesek?
      a: Igen. Fő modelljeink általános elrendezésű PDF-jei ingyenesen elérhetők — töltsd ki az alábbi rövid minősítési űrlapot, és a letöltési link e-mailben érkezik 1 munkanapon belül. Ezek tervezési szintű információkat tartalmaznak, amelyek elegendőek a projektértékeléshez, a helyfoglaláshoz és az előzetes specifikációk felülvizsgálatához.
    - q: Hogyan férjek hozzá a DXF/DWG fájlokhoz?
      a: Töltse ki a letöltési oldalon található rövid minősítési űrlapot a cég nevével, projekttípusával és célos felhasználásával. Az jóváhagyott kérelmekhez 1 munkanapon belül e-mailben érkezik letöltési link.
    - q: Szerezhetek STEP/IGES 3D modelleket?
      a: A STEP vagy IGES 3D modellfájlok elérhetők a projekt jelentkezési folyamatunkon keresztül. Adja meg projekt hatókörét, integrációs követelményeit, idővonalát és vásárlási szándékát. Jóváhagyás feltétele – általában 3-5 munkanapon belül.
    - q: Miért korlátozod a nagyobb részletgazdag fájlok hozzáférését?
      a: A hajótest geometriája, a forma adatok és szerkezeti számítások évek kutatási és fejlesztési beruházásait képviselik, és a gyártás alap IP-jei. Mindent biztosítunk, ami szükséges a beszerzési tervezéshez és a projektintegrációhoz, miközben védjük a lehetőségünket, hogy továbbra is befektethessünk új termékfejlesztésbe.
    - q: Tartalmaznak a rajzok gyártási részleteket?
      a: Nem. A nyilvános és könnyű formás rajzok beszerzési szintű információkat tartalmaznak tervezéshez és specifikációhoz. A gyártási szintű részleteket (laminálási táblázatok, szerszámutak, vágási bővítések) csak a NDA megerősített megrendelések alatt osztják meg.
    - q: Elérhetők rajzok egyedi vagy félig egyedi RIB konfigurációkhoz?
      a: Egyedi projektrajzokat készítenek a OEMODM fejlesztési folyamat részeként. Ha egyedi RIB projektet értékel, vegye fel velünk a kapcsolatot a követelményeivel, és a javaslat részeként projektspecifikus GA rajzokat is biztosítunk.
