hero:
  tagline: Műszaki rajzok és CAD
  title: RIB & Felfújható Hajó<br />Műszaki rajzok és CAD letöltések
  subtitle: Projektértékeléshez és műszaki specifikációkhoz készült tervezési szintű GA rajzok, méretlapok és fedélzeti elrendezések. Hozzáférés a megfelelő szintű műszaki rajzokhoz — nyilvános PDF-ekről a projekt szintű STEP fájlokig.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB hajó műszaki rajzok és CAD letöltések
direct_answer: Aquafarer beszerzési szintű műszaki rajzokat biztosít RIB hajókhoz és felfújható vízi járművekhez — beleértve az általános elrendezés (GA) PDF-eket, méretlapokat és fedélzeti elrendezés rajzokat. Részletesebb formátumok (DXF/DWG, STEP/IGES) elérhetők jogosult érdeklődés vagy projektkérelem esetén.
