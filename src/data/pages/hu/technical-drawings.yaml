    - title: AF320 Felfújható Hajó
      description: 3,2 m-es felfújható hajó, levegőpadlószint, PVC csövek. GA és csomagolási méretek elérhetők. EN ISO 6185 szabványnak megfelelő.
      icon: tabler:sailboat
