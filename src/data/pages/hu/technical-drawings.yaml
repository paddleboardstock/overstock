  title: Műszaki rajzolás<br />Elérhetőség modell szerint
  subtitle: GA PDF letöltések elérhetők fő RIB és felfújható csónakmodellekhez. Keresse velünk a feltüntetésben szereplő modellrajzokat.
  items:
    - title: AF580 RIB
      description: 5,8 RIBm, GRP mély-V törzs Hypalon vagy PVC csövek, középkonzol. GA, méretek, fedélzeti elrendezés és szállítási terv elérhető. Tervezési kategória C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, GRP közepes V-test, Hypalon vagy PVC csövek, oldalsó vagy középkonzol. GA és méretek elérhetők. Tervezési kategória C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, GRP test, PVC csövek, kormánykar vagy konzol. GA és méretek elérhetők. Tervezési kategória C/D.
