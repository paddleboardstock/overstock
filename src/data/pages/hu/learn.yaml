hero:
  tagline: Vízkutatási Tudás
  title: Tanul
  subtitle: |
    Útmutatók, oktatások és mélyreható elemzések — minden, amire szükséged van a felfedezéshez<br />
    vízzel magabiztosan. Az első SUP kiválasztásától a fejlett technikák elsajátításáig.
  taglineSection: Tudás minden evezős számára. Kezdőtől a profiig.
featured:
  tagline: Kiemelt témák
  title: Kezdd el a tanulási utadat
  subtitle: Akár új vagy a vízi sportok terén, akár előrébb szeretnél lépni, útmutatóink segítenek neked.
  items:
    - title: SUP Alapok
      description: Minden, amit egy kezdőnek tudnia kell — deszkafajták, ütőméretek, testtartás és első napi tippek.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Felfújható vs kemény tábla
      description: Melyik a megfelelő számodra? Összehasonlítjuk a hordozhatóságot, a teljesítményt, a tartósságot és a költséget egymás mellett.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Vízbiztonság
      description: Alapvető biztonsági ismeretek, amelyeket minden evezőnek ismernie kell — időjárás, mentőmellények, önmentés és még sok más.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Anyagok Útmutató
      description: PVC vs Hypalon, drop-stitch technológia, tagadó besorolások — értsd meg, miből készül a felszerelésed.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Méret útmutató
      description: Találd meg a megfelelő deszkahosszt, szélességet és térfogatot a súlyodhoz, képességedhez és evezési stílusodhoz.
      icon: tabler:ruler
      href: /size-guide
    - title: Köztes technikák
      description: Fejleszd evezésedet haladó lapátfogásokkal, kanyarodási technikákkal és hullámos vízen való irányítással.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
