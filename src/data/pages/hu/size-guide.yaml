how_to_choose:
  title: Hogyan válasszuk ki a megfelelő méretet
  cards:
    - title: Mindenoldalú SUP táblák
      description: ~11 láb hosszú all-round deszkáink (32" széles, 6 hüvelyk drop-stitch) egyensúlyt kínálnak a stabilitás, sebesség és kapacitás között. Illessze a deszka térfogatát a testsúlyához — a nehezebb evezők nagyobb térfogatot igényelnek.
    - title: Szélesség és Vastagság
      description: A szélesebb deszkák (32"+) nagyobb stabilitást nyújtanak kezdőknek, jógázáshoz és horgászathoz. 6 hüvelyk vastagság 15 PSI biztosítja a fedélzet merevségét az evező és a felszerelés alatt.
    - title: Csomagok és kiegészítők
      description: Minden deszka teljes csomagként kerül kiszállításra — deszka, utazótáska, kézipumpa, állítható evező, levehető uszony, csigás póráz és javítókészlet. Ellenőrizze a maximális terhelhetőséget a lovasra és a felszerelésre vonatkozóan.
