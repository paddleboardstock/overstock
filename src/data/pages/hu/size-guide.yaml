how_to_choose:
  title: Hogyan válasszuk ki a megfelelő méretet
  cards:
    - title: SUP Táblák
      description: A hossz kiválasztása a súlyod és a tervezett használat alapján. Szélesebb deszkák (32"+) nagyobb stabilitást kínálnak. Hosszabb deszkák (11-12 láb) jobban követik az irányt túrázásnál. A nehezebb evezők nagyobb űrtartalmú deszkákat igényelnek.
    - title: Kajakok
      description: Az együléses kajakok (9 láb) a legjobbak egyéni utazáshoz és folyóknál. A tandem kajakok (12 láb) két evezőst vagy egy felnőttet felszereléssel tudnak fogadni. Ellenőrizd a teljes súlykapacitást, beleértve a felszerelést is.
    - title: Csónakok & RIBs
      description: Válaszd ki a csónak hosszát az utasok száma és a tervezett használat alapján. A nagyobb RIBs (4,5 m+) nyílt tengeri és mentési célokra alkalmasak. A kisebb csónakok (2,7 m) tenderként és horgászplatformként működnek.
