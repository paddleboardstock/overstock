hero:
  title: Méret- és specifikációs útmutató
  subtitle: Méretek, kapacitások és az ajánlott felhasználások minden Paddle Board Overstock termékhez.
categories:
  inflatable: Felfújható SUPs és kajakok, amelyek hordozhatóságra készültek a teljesítmény feláldozása nélkül. Válaszd ki a megfelelő méretet a súlyod és az evezési stílusod alapján.
  rib: Kemény-hullámos felfújható hajók a parti navigációhoz, járőrözéshez és professzionális tengeri műveletekhez. Hossza és motor kapacitása alapján válassz.
  accessory: Kiegészítők és biztonsági felszerelések a vízi járművekhez. Univerzális méretezés több opcióval.
