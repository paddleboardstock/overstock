hero:
  tagline: Életmód
  title: A Aquafarer<br />Életmód
  subtitle: Azoknak készült, akik a vízen élnek — a hétvégi felfedezőktől a kereskedelmi üzemeltetőkig, akik mindennap a felszerelésükre támaszkodnak.
values:
  - icon: 🌊
    title: A vízen született
    desc: Minden tervezés azzal kezdődik, hogy megértsük, hogyan viselkedik a víz. A körülmények peremétől a belső irányba tervezünk — mert az óceán a tanítónk, nem a munkahelyünk.
  - icon: 🔧
    title: Tartósan építve
    desc: A legfenntarthatóbb termék az, amelyet nem kell cserélni. Tengeri minőségű anyagok, drop-stitch magok 15 PSIig minősítve, és varratok, amelyek túlélnek egy szezont.
  - icon: 🏆
    title: Tervezésből adódó hozzáférhetőség
    desc: A vízi sportoknak nem szabad luxusnak lenniük. Professzionális minőségű teljesítmény olyan áron, amely elfogadható családok, túravezetők és kis üzemeltetők számára — nem csak kereskedelmi flottáknak.
  - icon: 🌍
    title: Globális közösség
    desc: 'A qingdaoi partoktól az európai tavakon, a délkelet-ázsiai folyókon és az amerikai öblökön keresztül — ügyfeleink egy közös dolgot osztanak meg: a vízen való lét iránti szeretetet.'
  - icon: ♻️
    title: Felelős gyártás
    desc: A CNC-optimalizált elrendezés az anyagpazarlást 5% alá csökkenti. Tartós kivitelezés csökkenti a csereciklusokat. Hosszú élettartamra tervezünk, mert ez a legfenntarthatóbb választás.
  - icon: 🤝
    title: Tartós támogatás
    desc: A húszéves hajótesteink még mindig tőlünk kérnek pótalkatrészt. A garanciális válaszunk átlaga 24 óra. Nem tűnünk el az eladás után — a termék élettartama alatt itt vagyunk.
