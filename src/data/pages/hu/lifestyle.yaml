hero:
  tagline: Életmód
  title: A Paddle Board Overstock<br />Életmód
  subtitle: Azoknak készült, akik a vízen élnek — a hétvégi felfedezőktől a napi evezőkig, akik számolják a napokat az egyes alkalmak között.
values:
  - icon: 🌊
    title: A vízen született
    desc: Minden tervezés azzal kezdődik, hogy megértsük, hogyan viselkedik a víz. A körülmények peremétől a belső irányba tervezünk — mert az óceán a tanítónk, nem a munkahelyünk.
  - icon: 🔧
    title: Tartósan építve
    desc: A legfenntarthatóbb termék az, amelyet nem kell cserélni. Tengeri minőségű anyagok, drop-stitch magok 15 PSIig minősítve, és varratok, amelyek túlélnek egy szezont.
  - icon: 🏆
    title: Tervezéssel elérhető
    desc: A vízi sport nem lehet luxus. Professzionális szintű teljesítmény, olyan áron, ami ésszerű a családok, túravezetők és mindennapi evezők számára — nem csak profiknak.
  - icon: 🌍
    title: Globális közösség
    desc: 'Weihai tengerpartjától az európai tavakig, Délkelet-Ázsia folyóin át, az amerikai öblökig – ügyfeleinknek egy közös vonása van: a vízen való lét szeretete.'
  - icon: ♻️
    title: Felelős gyártás
    desc: A CNC-optimalizált elrendezés az anyagpazarlást 5% alá csökkenti. Tartós kivitelezés csökkenti a csereciklusokat. Hosszú élettartamra tervezünk, mert ez a legfenntarthatóbb választás.
  - icon: 🤝
    title: Tartós támogatás
    desc: Az évek óta épített deszkák még mindig hozzánk fordulnak alkatrészért. A garanciális ügyintézésünk átlagosan 24 órán belül történik. Nem tűnünk el az eladás után — a termék élettartama alatt itt vagyunk.
