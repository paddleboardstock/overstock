content_system:
  tagline: Minőségellenőrzési rendszer áttekintése
  title: Integrált minőség<br />Irányítási keretrendszer
  subtitle: A minőségellenőrzési rendszerünk függetlenül működik a termeléstől, és közvetlenül a vezetőségnek jelent. Egyetlen tétel sem kerül kiszállításra a minőségi labor aláírt minőségengedélye nélkül.
  items:
    - title: Független Minőségellenőrző Labor
      description: Minőségellenőrző laboratóriumunk külön funkcióként működik a termeléstől. A minőségellenőrzési ellenőrök a minőségvezetőnek jelentenek, nem a termelési igazgatónak. Ez a szervezeti függetlenség biztosítja, hogy a minőséggel kapcsolatos döntések objektíven szülessenek — a termelési határidők soha nem írják felül a minőségi követelményeket.
      features:
        - Közvetlenül a menedzsmentnek jelent, a termeléstől függetlenül
        - Fel van hatalmazva a termelés leállítására minőségi problémák esetén
        - 12 elkötelezett minőségellenőrzési ellenőr minden szakaszban
        - Minden tesztberendezést évente kalibrálnak
    - title: Tétel nyomonkövethetősége
      description: Minden nyersanyag-szállítmányhoz egyedi tételszámot rendelünk a ERP rendszerünkben. Az anyag beérkezésétől a gyártáson át a kész termékig minden tábla anyagjegyzéke visszakövethető az eredeti beszállítói tételekre. Ez lehetővé teszi a teljes upstream nyomon követhetőséget bármilyen minőségi vagy megfelelőségi kérdés esetén.
      features:
        - ERP-alapú tételkövetés az anyagtól a késztermékig
        - Fizikai sorozatcímkék minden munkarenden
        - 100%-os anyagborítás — PVC, drop-stitch, EVA hab, alkatrészek, ragasztók
        - A feljegyzések 10 évig megőrzésre kerülnek
    - title: Minőségirányítás
      description: Minőségellenőrzési (QC) eljárásaink dokumentált belső protokollokat követnek. A teszteredmények rögzítésre kerülnek, visszakövethetők, és független minőségi laborunk felülvizsgálja őket. A múlt 12 hónap szállításaiban 99,3%-os hibamentességi arány.
      features:
        - Dokumentált belső QC protokollok, évente felülvizsgálva
        - A múlt 12 hónap szállításaiban 99,3%-os hibamentességi arány
        - Nulla tolerancia a biztonságkritikus hibákkal szemben
        - A feljegyzések 10 évig megőrzésre kerülnek
content_inspection:
  tagline: Ellenőrzési szakaszok
  title: Hatfokozatú<br />Ellenőrzési folyamat
  subtitle: Minden termék 6 ellenőrzési szakaszon megy keresztül, dokumentált minőségellenőrzési pontokkal. A hibákat korán észlelik, a korrekciós intézkedések azonnal megérkeznek, és minden tétel teljesen nyomon követhető.
  stages:
    - stage: '1'
      title: Beérkező anyagellenőrzés
      description: Minden beérkező anyagot tételszám/lottószám szerint rögzítenek és elkülönítenek a minőségellenőrzés jóváhagyásáig. PVC szövetgörgőket szakítószilárdság, szakítószilárdság és vastagság szempontjából tesztelik. Drop-stitch magok, szelepek, ragasztók és szerelvények vizuálisan ellenőrizve vannak, és a specifikációkhoz mérten mérve.
      checks: Húzószilárdság, szakadásellenállás, vastagságmérő, ragasztó viszkozitás, vizuális hibavizsgálat
      threshold: A tesztelt minták 100%-a. Utasítsa el, ha a szakítószilárdság < 90% a specifikációnak, a szakítószilárdság < a specifikáció minimumának, vagy bármilyen vizuális hiba található
    - stage: '2'
      title: Folyamatban lévő minőségellenőrzés — vágás és előkészítés
      description: CNC-a vágott paneleket minden 20. panelen CAD forrásfájlokkal mérik át. Az élminőséget ellenőrizik a kopás, egyenetlen vágások vagy dimenziós elcsúszás után. A panelek számát minden gyártási tételnél a BOM alapján ellenőrzik, mielőtt az anyagok hegesztésre kerülnek.
      checks: Méretellenőrzés a CAD DXF fájlokhoz képest, élminőség-ellenőrzés, panelszám ellenőrzés
      threshold: Tolerancia ±0,5mm. A adag elutasítása, ha >2% túlzott a toleranciától
    - stage: '3'
      title: Folyamatban lévő minőségellenőrzés — Hegesztés és kötés
      description: A gyártás során a hegesztés minőségét folyamatosan figyelik. Hámlasztási teszteket végeznek mintákon minden 50 egységnél. A hegesztés szélességét a specifikációhoz mérik. A meleglevegős hőmérséklet naplókat az állandóság szempontjából ellenőrzik. Minden varratot vizuálisan ellenőriznek hátsó világítás mellett csatornázódás vagy üregek szempontjából.
      checks: Hámlasztási teszt minden 50 egységnél, hegesztés szélesség mérése, meleglevegős hőmérséklet napló ellenőrzése, hátsó világítás varratellenőrzés
      threshold: Hámozási szilárdság minimum 8 N/cm. Hegesztési szélesség ±tűrőképesség 1mm. Bármilyen látható csatornázás = visszautasítás
    - stage: '4'
      title: Összeszerelés minőségellenőrzés
      description: Minden egység egy 100 pontos összeszerelési ellenőrzőlistát követi, amelyet a csapatvezető írt alá. A szelepfunkciót 10 nyitás-zárás ciklus alatt tesztelik. A hardver nyomatékot ellenőrzik. A vizuális ellenőrzés a felületfelületet, színkonzisztenciát, címkék elhelyezését és a kiegészítő teljességét vizsgálja.
      checks: 100 pontos ellenőrzőlista, szelepfunkció teszt, hardveres nyomatékellenőrzés, vizuális ellenőrzés
      threshold: 'Nulla-hiba politika a biztonságkritikus elemekre (szelepek, D-gyűrűk, fogantyúk). Apró kozmetikai hiba: 99,3%-os hibamentességi cél'
    - stage: '5'
      title: Nyomáspróba
      description: Minden kamrát felfújnak 1,25× névnyomásra, és 24-48 órán át tartják meg. A nyomásérzékelők folyamatosan naplózzák a várakozási időszak alatt. A hőmérséklet-kompenzált mérések biztosítják a pontosságot. Bármely kamrá, amely meghaladja az 5%-os nyomásesést, elutasítják, és az egész gyártási adag 100%-os újratesztelésével újravizsgálásra kerülnek.
      checks: 24-48 órás nyomástartó napló, naponta ellenőrizve az érzékelő kalibrációja, hőmérséklet-kompenzált mérés, varrás újravizsgálata javítás után
      threshold: Maximális 5% nyomásesés 24 órán át stabil hőmérsékleten. Túlteljesítés = 100%-os újrateszt az egész adagot
    - stage: '6'
      title: Végső ellenőrzés és szállítási kiadás
      description: Végső vizuális és funkcionális ellenőrzés csomagolás előtt. A felületi hibákat, színkonzisztenciát, címkézés/BIN ellenőrzést, csomagolási integritást és a kiegészítők teljességét ellenőrzik az ügyfélrendelés alapján. Az egységeket vákuumba csomagolják, dobozba helyezik és raklapba helyezik. A végleges minőségellenőrzés szükséges, mielőtt bármely termék elhagyja a gyárat.
      checks: Teljes vizuális ellenőrzés, kiegészítő lista a SKU szerint, csomagolás ejtési teszt (1 m véletlenszerű minta), címke/barcode ellenőrzés
      threshold: Nulla tolerancia a biztonsági hibákkal szemben. 99,3%-os hibamentességi cél. Az egységek 100%-át vizuálisan ellenőrizik
content_equipment:
  tagline: Tesztelő berendezések
  title: QC Labor<br />Felszerelések
  subtitle: Minőségellenőrző laborunk speciális tesztelő berendezésekkel felszerelt az anyagellenőrzés, a hegesztési integritás és a termék teljesítményének validálása céljából.
  columns: 3
  items:
    - title: Húzószilárdság vizsgáló gép
      description: A szövet szakítószilárdságát és nyúlását méri a belső tesztprotokoll szerint. A beérkező összes PVC és drop-stitch szövetszállítmány QA ellenőrzéséhez használják.
      icon: tabler:scale
    - title: Hőmérsékletkamra
      description: Környezeti kamra UV ellenállás teszteléséhez és alacsony hőmérsékleti rugalmasság vizsgálathoz. Szimulálja a szélsőséges működési körülményeket.
      icon: tabler:temperature
    - title: Nyomásérzékelők és adatrögzítők
      description: Digitális nyomásérzékelők folyamatos adatnaplózással 24-48 órás levegőtartó tesztekhez. Pontosság érdekében hőmérséklet-kompenzált.
      icon: tabler:wind
    - title: Húzópróba berendezés
      description: Kalibrált húzóteszt berendezés a hegesztett varratok szilárdságának ellenőrzésére. Véletlenszerű minták minden gyártási tételből.
      icon: tabler:files
    - title: Szivárgásérzékelő tartály
      description: Vízmedence a felfújt kamrák merített szivárgás teszteléséhez. Vizuális buborékészlelés a varrat és szelep integritásának ellenőrzésére.
      icon: tabler:ripple
    - title: Ellenőrző Eszközök
      description: Kalibrált mérőeszközök — vastagságmérők, nyomatékkulcsok, méretmérő csavarhúzók, keménységmérők a gyártási QC állomásokhoz.
      icon: tabler:tools
content_metrics:
  tagline: QC Teljesítmény
  title: Minőségellenőrzés<br />Metrikák
  subtitle: Valós siker/kudarc adatok a gyártósorról. Ezeket a metrikákat napi szinten figyeljük és havonta felülvizsgálja a vezetőség.
  columns: 3
  items:
    - title: 100% Tesztelt Egységek
      description: Minden tábla minden kamrája nyomáspróbán esik át a szállítás előtt. Nincs mintavétel — 100%-os ellenőrzés a nyomástartóságra.
      icon: tabler:check
    - title: <5% Nyomáscsökkenés
      description: Maximálisan megengedett nyomásvesztés 24-48 órán át 1,25× névleges nyomáson. Bármely kamra, ami ezt a határt túllépi, tétel újratesztelését váltja ki.
      icon: tabler:gauge
    - title: 99,3% hibamentes
      description: Hibamentes arány az elmúlt 12 hónap szállítmányai alapján. Nulla tolerancia a biztonságkritikus hibákra.
      icon: tabler:clipboard-check
    - title: 24-48 Órás Tartás
      description: A táblákat 24-48 óráig tartják, a modell és a tétel függvényében. A nyomásérzékelők folyamatosan naplóznak az egész tartási időszak alatt.
      icon: tabler:clock
    - title: 1,25× Tesztnyomás
      description: Biztonsági tartalék minden kamránál — a tesztelés a névleges nyomás 25%-ával magasabb értéken történik, hogy a maximális működési feltételek feletti tartalék biztosított legyen.
      icon: tabler:arrow-up
    - title: 0% biztonsági hibák
      description: Zéró tolerancia a biztonságkritikus hibákkal szemben — szelepek, D-gyűrűk, varratok és úsztató kamrák. Bármilyen hiba = 100%-os újbóli ellenőrzés.
      icon: tabler:shield
cta:
  title: Minőségi dokumentáció igénylése
  subtitle: Minden szállítmányhoz teljes minőségű dokumentációs csomagokat biztosítunk, beleértve a tesztjelentéseket és ellenőrzési jegyzőkönyveket. Vegye fel velünk a kapcsolatot mintákért.
  actions:
    - variant: primary
      text: QC dokumentáció igénylése
      href: /contact
    - text: Tesztelési protokollok megtekintése
      href: /quality
