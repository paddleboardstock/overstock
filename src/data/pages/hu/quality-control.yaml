  subtitle: Többlépcsős ellenőrzési folyamat, amely lefedi a beérkező anyagokat, a gyártás folyamatban lévő szakaszait, a nyomáspróbákat, a végszerelést és a kiszállítás előtti ellenőrzést. Minden tétel nyomon követhető, minden teszt rögzítésre kerül.
