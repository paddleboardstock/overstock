workshops_section:
  tagline: Műhelyek
  title: Gyártó Műhelyek
  workshops:
    - title: PVC Vágás és Anyagelőkészítés
      description: Az automata CNC vágógépek PVC drop-stitch szubmilliméteres pontossággal dolgoznak és dolgoznak fel. A számítógéppel optimalizált fészkelés minimalizálja az anyagpazarlást, és biztosítja, hogy minden panel megfelel a méretszabványoknak a hegesztés előtt.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Hegesztés és hőtömítés
      description: Dedikált hegesztőműhely hőtömítő gépekkel és RF dielektromos sajtóművekkel. A meleglevegős hegesztők ragasztják és drop-stitch biztosítják a magrétegeket és a sínszalagokat, míg az RF hegesztők nagy szilárdságú légzárkózó varrásokat eredményeznek.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Deck Art és EVA Finishing
      description: 'Az Art Series deckek itt formálódnak: precízen vágott EVA habpaneleket teljes fedélzeti mintázatba raknak, kézzel rögzítik és vágnak egy tapadós, kényelmes és tartós felület érdekében — ez minden művészeti sorozat deszkának védjegye.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: SUP Nyomtatás és Díszítés
      description: SUP deszkákat digitális nyomtatással dekoráljuk teljes színű grafikákhoz és szitanyomással logókhoz és ismétlődő mintákhoz. A digitális nyomtatók fotóminőségű fedélterveket készítenek, míg a szitanyomás tartós, élénk márkajelzéseket ad.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Végszerelés és Árbocozás
      description: Összeszerelő vonal, ahol a deszkák kapják a szelepeket, D-gyűrűket, fogantyúkat, uszonyokat és pórázrögzítőket. Minden deszka egy 100 pontos összeszerelési ellenőrzőlistát követ, amelyet a csapatvezető írt alá.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Minőségellenőrzés és Vizsgálat
      description: Minden elkészült deszkolatot kötelező légtartási teszten, varrás-lehúzás ellenőrzésen és teljes rendszerellenőrzésen esik át a szállítás előtt. Minőségi laborunk a gyártástól függetlenül működik, és közvetlenül a vezetőségnek jelent.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
