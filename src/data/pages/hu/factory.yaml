workshops_section:
  tagline: Műhelyek
  title: Gyártó Műhelyek
  workshops:
    - title: PVC Vágás és Anyagelőkészítés
      description: Automata CNC vágógépek PVC, Hypalon és drop-stitch anyagokat dolgoznak fel szubmilliméter pontossággal. A számítógéppel optimalizált elrendezés minimalizálja az anyagveszteséget, és biztosítja, hogy minden panel megfeleljen a méret-specifikációknak hegesztés előtt.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Csőhegesztés és Hőzárás
      description: Külön hegesztőműhely hőzáró gépekkel és RF dielektromos sajtolókkal. A forrólevegős hőzárók összekötik és összeolvasztják a PVC csőkamrákat, míg az RF hegesztések nagy szilárdságú, légzáró varratokat hoznak létre, amelyek meghaladják a ISO 9001 követelményeket.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: RIB Hajótest Gyártás — Üvegszál
      description: RIB hajótestek kézi rétegfelviteles üvegszál öntéssel készülnek poliészter és vinilészter gyanta rendszerben. Minden réteg kézzel van hengerezve és vákuumzsákba helyezve az állandó minőség érdekében. A gelcoat permetező kabin magas fényű, UV-tűrő tengeri felületet biztosít.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: SUP Nyomtatás és Díszítés
      description: SUP deszkákat digitális nyomtatással dekoráljuk teljes színű grafikákhoz és szitanyomással logókhoz és ismétlődő mintákhoz. A digitális nyomtatók fotóminőségű fedélterveket készítenek, míg a szitanyomás tartós, élénk márkajelzéseket ad.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Végszerelés és Árbocozás
      description: Összeszerelő sor, ahol az üvegszálas hajótesteket és a PVC csöveket összeillesztik, a motorokat felszerelik, a kormányzást és a vezérlést csatlakoztatják, és az elektromos rendszereket bekötik. Minden hajó egy 100-pontos összeszerelési ellenőrzőlistát követ, amelyet a csapatvezető hagy jóvá.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Minőségellenőrzés és Vizsgálat
      description: Minden elkészült hajón kötelező légzárási vizsgálat, varratfelhúzás ellenőrzés és teljes rendszerellenőrzés történik szállítás előtt. Minőségi laborunk függetlenül működik a gyártástól és közvetlenül a vezetőségnek jelent.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
