material_traceability:
  tagline: Nyomonkövethetőség
  title: Anyagkövetés és tétel ellenőrzés
  description: Minden nyersanyag-szállítmányhoz egyedi tételszámot rendelünk a ERP rendszerünkben. A beérkezéstől a gyártáson át a késztermékig minden tábla anyagjegyzéke visszakövethető az eredeti beszállítói tételhez. Ez lehetővé teszi a teljes felső szintű nyomon követhetőséget minden minőségi vizsgálat esetén.
  system: Egyedi ERP (belső rendszer) + fizikai tételcímkék minden munkarendelésen
  coverage: 100% a gyártási anyagokból — PVC, drop-stitch szövet, EVA hab, ragasztók, szelepek, szerelvények, csomagolás
  records_retained: 10 év
