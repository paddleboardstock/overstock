material_traceability:
  tagline: Nyomonkövethetőség
  title: Anyagkövetés és tétel ellenőrzés
  description: Minden nyersanyag tételhez egyedi tételszámot rendelünk ERP rendszerünkben. Az érkezéstől a gyártáson át a késztermékig minden hajó anyagjegyzéke visszavezethető az eredeti beszállítói tételhez. Ez lehetővé teszi a teljes upstream nyomonkövethetőséget bármilyen minőségi vagy megfelelőségi vizsgálat esetén.
  system: Egyedi ERP (belső rendszer) + fizikai tételcímkék minden munkarendelésen
  coverage: A gyártáshoz felhasznált anyagok 100%-a — PVC, Hypalon, drop-stitch szövet, ragasztók, szelepek, fémalkatrészek, csomagolás
  records_retained: 10 év (CE 2013/53/EU követelmény szerint)
  suppliers:
    - material: Tengeri minőségű PVC
      source: Kínai és koreai beszállítók
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch szövet
      source: Belső szövés + külső partner
      certified: Belső QC + beszállító ISO 9001
    - material: Szelepek és fémalkatrészek
      source: Chinese OEM suppliers
      certified: ISO 9001, anyagbizonyítványok tételenként
