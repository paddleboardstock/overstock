hero:
  tagline: Gyár
  title: Gyár és Gyártás
  subtitle: 12 000 m² integrált gyártás — az alapanyagtól a kész hajóig
intro:
  - A **Paddle Board Overstock Qingdao Gyártó Központ** gyártmány márkájaként a Paddle Board Overstock az előállítás minden szakaszát ellenőrzi — az alapanyagok és üvegszál anyagok megérkezésétől kezdve a kész hajó végső átvételi ellenőrzéséig. A Qingdao Gazdasági Fejlesztési Zónában található gyártóüzemünk 12 000 négyzetmétert foglal el, és külön műhelyeket biztosít PVC vágáshoz, cső hőzáráshoz, üvegszál RIB hajótest gyártáshoz, SUP digitális nyomtatáshoz, végső összeszereléshez és minőségellenőrzéshez.
  - A tervezés, mérnöki munka, prototípus készítés, gyártás és tesztelés egy tető alatt történő integrálásával kiküszöböljük a szerződéses gyártás hatékonysági hiányosságait, és közvetlen irányítást tartunk a gyártási minőség, az anyagválasztás és a szállítási határidők fölött. Minden hajót, amely elhagyja műhelyünket, a mi munkatársaink, a mi berendezéseinken, a mi szabványaink szerint készítenek.
