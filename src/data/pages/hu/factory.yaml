hero:
  tagline: Gyár
  title: Gyár és Gyártás
  subtitle: 12 000 m2 integrált gyártás — a nyersanyagtól a kész deszkáig
intro:
  - A **Paddle Board Overstock Weihai Manufacturing Hub** gyári márkájaként minden Paddle Board Overstock termelési szakaszt irányít — a nyersanyagok PVC drop-stitch érkezésétől a kész lemez végleges elő-átvizsgálásáig. Gyártóüzemünk a Weihai Gazdaságfejlesztési Övezetben 12 000 négyzetmétert foglal magában, és dedikált műhelyeket foglal el PVC vágásra, hőtömítésre és hegesztésre, fedélzeti művészeti befejezésre, végső összeszerelésre és minőségellenőrzésre.
  - Azáltal, hogy a tervezést, a mérnöki munkát, a prototípust, a gyártást és a tesztelést egy fedél alatt integráljuk, megszüntetjük a szerződéses gyártás hatékonyságát, és közvetlen irányítást gyakorolunk az építési minőség, az anyagválasztás és a szállítási határidők felett. Minden deszkolat, amely elhagyja műhelyünket, munkatársaink által építik fel a saját felszerelésünkre, a mi szabványaink szerint.
