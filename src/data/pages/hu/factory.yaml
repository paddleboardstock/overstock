qc_section:
  tagline: Minőségellenőrzés
  title: Tesztelési és minőségbiztosítási folyamat
  subtitle: Minden hajó kötelező tesztelésen esik át a szállítás előtt. Minőségi laborunk függetlenül működik a gyártástól, és közvetlenül a vezetőségnek jelent.
  steps:
    - step: '1'
      title: Nyersanyag-ellenőrzés
      desc: PVC, Hypalon, és drop-stitch az anyagok húzódombon (ASTM D751), szakadási terjedésen és UV ellenállás ellenőrzésén esnek át, mielőtt bármely tétel gyártásba kerülne.
    - step: '2'
      title: 48 órás légtartási teszt
      desc: Minden csőkamrát a névnyomás 125%-ára fújnak fel, és 48 órán át tartják fenn. 5%-os nyomáscsökkenés automatikus kizárást és varrás-újraellenőrzést vált ki.
    - step: '3'
      title: Terhelés- és egyensúlyvizsgálat
      desc: A kész hajókat maximális beszállító kapacitásra rakodnak, és stabilitás, szabadborzalt és kezelhetőség szempontjából tesztelik. Minden hajót vízvizsgálaton keresztül tesztelnek a végső ellenőrzés előtt.
oem_section:
  tagline: OEM Projektek
  title: Márka- és OEM partnerségi esettanulmányok
  subtitle: A koncepciótól a konténerig — hogyan segítünk a globális márkáknak felfújható vízi járművek bevezetésében és bővítésében.
  cases:
    - challenge: Az európai kültéri kiskereskedőnek szüksége volt egy egyedi SUP teraszgrafikával, környezetbarát PVCés kiskereskedelmi forgalomra kész csomagolással – mindezt 60 nap alatt szállították.
      solution: Egyedi digitális nyomtatott fájlokat fejlesztettünk, REACHforrásból származó és tömörített PVCmintavételt 3 körből 1-ig a tervezőcsapat együtt a Qingdao gyárunkban helyeztük el.
      result: 55 nap az aláírt PO-tól FOBa 2 400 egységhez 4 SKU-ban. Ismétlődő rendelés az első konténer érkezése előtt.
    - challenge: Az amerikai vízsport-startupnak nagy teljesítményű drop-stitch kajakra volt szüksége, egyedi törzsformával, társmárkás csomagolással és BSCI kiskereskedelmi elhelyezéshez szükséges minősítéssel.
      solution: Átalakítottam a meglévő drop-stitch kajakformát módosított hintóprofilral, kifejlesztettük a közös márkájú csomagolási grafikát, és teljes BSCI auditdokumentációt biztosítottunk.
      result: Sikeresen jegyzett három nagy amerikai szabadtéri láncban. 5 000+ egység az első évben, 98%-os eladási rágalmal.
    - challenge: Az ausztrál forgalmazó egy CE-tanúsított RIB sorozatot követelt egyedi csőszínekkel, Hypalon frissítési lehetőséggel és az ausztrál AS 1799 szabványnak való megfeleléssel.
      solution: Előgyártási mintákat készítettek 4 csőszínes változattal, CSM Hypalon japán beszállítótól szerezve, és koordinálták a harmadik féltől származó AS 1799 megfelelőségi teszteket.
      result: 3 RIB modelles sorozat indult az AU/NZ piacon. Ezt követte a kormányzati pályázat 12 RIBsjárőrözésre.
faq_section:
  tagline: GYIK
  title: B2B & OEM Gyakran Ismételt Kérdések
  questions:
    - q: Mi a minimális rendelési mennyiség (MOQ) OEM felfújható SUP deszkáknál?
      a: MOQ A standard modelleknél 5–10 darabtól kezd OEM . Az egyedi formák és a privát márkás projektek minimum 200 egységet igényelnek, a komplexitástól függően. Új márkabevezetésekhez próbarendelések és mintapéldányok is elérhetők.
    - q: Paddle Board Overstock Van BSCI képesítése?
      a: Igen. Gyárunk érvényes BSCI társadalmi megfelelőségi tanúsítványt tart fenn (az audit jelentés kérésre elérhető). Emellett ISO a 9001:2015-ös minőségirányítási tanúsítványt is birtokoljuk, és 64 termékmodellünk rendelkezik CE tanúsítvánnyal (TÜVRheinland).REACH valamint RoHS minden szállítmányhoz biztosított megfelelőségi dokumentáció OEM .
    - q: Mennyi a tipikus előreszállítási idő egy OEM rendeléshez?
      a: A szabványos átfutási idő a megerősített megrendeléstől és előlegről számítva 30–45 nap. Az egyedi szerszámkészítés 15–20 nappal növeli a szerszámkészítési időt. Sürgős megrendelések és szezonális csúcsidőszakok (jan–már) esetén gyorsított gyártást kínálunk.
    - q: Tudod szállítani FOB Qingdaóból vagy CIF-ból a mi kikötőnkbe?
      a: Igen. Szállítunk FOB Qingdaoba, CIF főbb globális kikötőkbe, és DDP a jogosult partnereknek. Logisztikai csapatunk kezeli a konténerfoglalást, a kivitelhez szükséges dokumentációt és a vámszolgáltatásokat. 50+ országba szállítunk az EU, az USA, Ausztrália és az ázsiai piacokon.
b2b_moq: 'Standard MOQ: 5–10 egység modelltől függően (SUP/kajak/drop-stitch). RIB MOQ: 2–5 egység. Próbarendelések üdvözlendők új partnerségek esetén.'
production_flow:
  tagline: Termelési folyamat
  title: Anyagtól a kész hajóig
  subtitle: Minden hajó 6 gyártási fázison megy keresztül, minden lépésnél minőségellenőrzési pontokkal. Nincsenek rövidítések, nincsenek kihagyott ellenőrzések.
  stages:
    - stage: '01'
      title: Anyagfelvétel és bejövő minőségellenőrzés
      description: Minden beérkező anyagot tétel/sorozatszám alapján rögzítenek a ERP rendszerünkben. PVC szövethengerek, drop-stitch magok, szelepek, ragasztók és hardverek karanténban maradnak a minőségellenőrzés jóváhagyásáig.
      qc_check: Szakítószilárdság (ASTM D751), szakítószilárdság (ISO 4674), vastagságmérő, ragasztó viszkozitás, vizuális hibakeresés
      qc_threshold: A tesztelt minták 100%-a. Utasítsa el, ha a szakítószilárdság < 90% a specifikációnak, a szakítószilárdság < a specifikáció minimumának, vagy bármilyen vizuális hiba található
      responsibility: Beérkező QC csapat (3 ellenőr)
    - stage: '02'
      title: CNC Vágás és anyagelőkészítés
      description: A számítógép-optimalizált elrendezés a paneleket PVC alapanyagra helyezi a hulladék minimalizálása érdekében. Az automatikus CNC vágógépek 0,1 mm-es pozíciós pontosságot biztosítanak.
      qc_check: Méretellenőrzés a CAD DXF fájlokhoz képest, élminőség-ellenőrzés, panelszám ellenőrzés
      qc_threshold: Minden 20. panelt mérve. Tűrés ±0,5 mm. A tételeét el kell utasítani, ha a tűrésen kívüli arány >2%
      responsibility: Vágó műhely vezető
    - stage: '03'
      title: Hegesztés és Drop-Stitch Kötés
      description: Drop-stitch magokat külső PVC rétegekkel hőlaminálással kötik össze. A csőkamrákat RF-hegesztéssel vagy forró levegős hegesztéssel készítik. A sínszalagok háromrétegű fúziós kötőréteggel vannak összekapcsolva.
      qc_check: 50 egységenként hámlásvizsgálat (ASTM D751), hegesztési szélesség mérése, forró levegő hőmérséklet-napló átnézése, vizuális varratellenőrzés háttérvilágítás alatt
      qc_threshold: Minimum hámlási szilárdság 8 N/cm. Hegesztési szélesség tűrése ±1 mm. Bármilyen látható csatornázódás = elutasítás
      responsibility: Hegesztési minőségellenőrzés (2 ellenőr műszakonként)
    - stage: '04'
      title: Összeszerelés és felszerelés
      description: 'A csónakok a végszereléshez kerülnek, ahol minden alkatrészt összeillesztenek: a hajótestet + csövekkel, szelepekkel felszerelve, D-gyűrűkkel, fogantyúkkal, perselydobozokkal és hordtáskával. Minden egység egy 100 pontos szerelési ellenőrzőlistát követ.'
      qc_check: Egységenként 100 pontos ellenőrzőlista aláírás, szelep működés teszt (10 nyitás/zárás ciklus), hardver nyomaték ellenőrzés, vizuális ellenőrzés
      qc_threshold: 'Zéró hibás politika a biztonságkritikus elemeknél (szelepek, D-gyűrűk, fogantyúk). Kis kozmetikai hiba: AQL 2,5 (ISO 2859)'
      responsibility: Összeszerelő csapat vezető + sor QC
    - stage: '05'
      title: Nyomáspróba és minőségi tartás
      description: Minden kamrát az előírt nyomás 1,25-szeresére fújnak fel (általában 20–25 PSI) és 24–48 órán keresztül tartják. A nyomásérzékelők folyamatosan rögzítenek. Azok a kamrák, amelyeknél a nyomás 5%-nál többet esik, elutasításra kerülnek és varratújraellenőrzésre küldik őket.
      qc_check: 24 órás nyomás fenntartási napló, érzékelő kalibráció naponta ellenőrizve, hőmérséklet-kompenzált nyomásérték, varrat újratesztelése javítás után
      qc_threshold: Max 5% nyomáscsökkenés 24 órán belül stabil hőmérséklet mellett. Bármely kamra, amely ezt meghaladja = az egész gyártási tétel 100%-os újratesztelése
      responsibility: Minőségellenőrző labor (független a gyártástól, a menedzsmentnek jelent)
    - stage: '06'
      title: Végső ellenőrzés és csomagolás
      description: Végső vizuális és funkcionális ellenőrzés. Felületi hibák, színkonzisztencia, címke/BIN ellenőrzés, csomagolás épsége és kiegészítők teljessége. Az egységek vákuumcsomagolva, dobozolva és raklapra helyezve a konténerbetöltéshez.
      qc_check: Teljes vizuális ellenőrzés, kiegészítő lista SKU szerint, csomagolás ejtési teszt (1 m, véletlenszerű minta), címke/ vonalkód ellenőrzés
      qc_threshold: AQL 2,5 a súlyos hibákra, AQL 4,0 a kisebb hibákra. Zéró tolerancia a biztonsági hibákra. Az egységek 100%-a vizuálisan ellenőrzött
      responsibility: Végső QC csapat (4 ellenőr) + Csomagoló csapat vezetője
