testimonial:
  content: Portugáli szörfiskolánkhoz a Club Starter csomaggal kezdtünk. 20 deszka, lapátok, mellények — minden 3 héten belül megérkezett. Két szezon után a Pro csomagra váltottunk. A testreszabott márkajelzés a logónkkal nagy változást hozott a professzionális megjelenésünkben.
  name: Ricardo Santos
  title: Tulajdonos, Algarve Surf Akadémia — Lagos, Portugália
content_segments:
  tagline: Klubprofilok
  title: Vízi Sport Klub Megoldások<br />Klub típusa szerint
  subtitle: Az egyetemi evezőkluboktól a kizárólagos magányacht-klubokig — minden típusú klubnak egyedi felszerelési igényei, használati szokásai és költségvetési struktúrái vannak. Minden csomagot a klub modelljéhez igazítunk.
  items:
    - title: Egyetemi és főiskolai evezőklubok
      subtitle: Nagy használatú hallgatói flották
      description: Hallgatói vezetéssel vagy intézményi támogatással működő evezőklubok, amelyek SUP és kajak programokat kínálnak egyetemi szabadidős osztályok részére. A felszerelés gyakori, gyorsan cserélődő használatnak van kitéve különböző készségszinteken minden félévben. A tartósság és a könnyű javíthatóság kritikus, emellett a hallgatói szervezetek számára költségbarát árképzés is fontos.
      features:
        - Különösen tartós PVC kivitel, amelyet a diákhasználati ciklusokra terveztek
        - Színkódolt tábla készségszint szerint a könnyű flottakezeléshez
        - Javító készlet +, hívásra elérhető videótámogatás minden rendeléshez
        - Hallgatói szervezeti kedvezményes árak és féléves alapú fizetési feltételek
    - title: Közösségi evezős és társasági klubok
      subtitle: Tagságvezérelt szabadidős klubok
      description: Közösségi alapú klubok, amelyek SUPkajaki- és társas evezési élményeket kínálnak a tagoknak. A felszerelésnek egyensúlyban kell lennie a teljesítmény és a kényelem széles korosztály számára, a márkaépítéssel, amely elősegíti a klub identitását és a tagok büszkeségét. A tárolás hatékonysága kulcsfontosságú azoknak a kluboknak, amelyek korlátozott vízparti hozzáférésből működnek.
      features:
        - 'Vegyes flotta: összetettSUPs, túradeszkák és szabadidős kajakok'
        - 'Teljes klubmárkaépítés: egyedi színek, logónyomtatás, márkázott PFD-k'
        - Kompakt tárolómegoldások felfújható berendezésekhez
        - 'Tagságnövekedési kezdőkészlet: ajánlókártyák, márkázott fotózás'
    - title: Szörfiskolák és Szörfkajak Akadémiák
      subtitle: Coastal teljesítmény és edzői pályafutás
      description: Szörfösre fókuszáló SUP iskolák, ahol szörfözést, kajakozást és hullámlovaglást tanítanak. A felszerelésnek a szörfözési körülmények között kell működnie — manőverezőnek, érzékenynek és elég tartósnak ahhoz, hogy elviselje az ismétlődő pusztulásokat, homokkopást és sós víz kitettséget gyors romlás nélkül.
      features:
        - Rövidebb, szélesebb SUP formák, optimalizálva a hullámos manőverezésre
        - Megerősített sínszerkezet a hullámokban történő ütközésellenállás érdekében
        - 'Szörfösre specifikus biztonsági felszerelések: tekercses pórázok, puha uszony opciók'
        - Flottacsereprogram szezonális bevált kedvezményekkel
    - title: Vállalati és magán jachtklubok
      subtitle: Premium tagi élmények
      description: Exkluzív magánklubok kínálnak vízi sportokat prémium szolgáltatásként a tagok számára. A felszerelések színvonala magas — az esztétika, a márka összehangolása és a vendégek számára kész megjelenítés ugyanolyan fontosak, mint a teljesítmény. A szolgáltatási elvárások közé tartozik a fehér kesztyűs kézbesítés, az egyedi tárolási megoldások és a concierge szintű támogatás.
      features:
        - Prémium felületű deszkák faerezéssel EVA és fémes díszítésekkel
        - Egyedi színpárosítás a klubmárka irányelveihez
        - 'Concierge kiszállítás: előre felfújva, színpadi és minden évszakhoz igazítva'
        - Dedikált számlakezelés prioritási válasz SLA-val
