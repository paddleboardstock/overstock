hero:
  tagline: Vízi sport klubok
  title: Felszerelés és Megoldások<br />Evezős Kluboknak és Oktatóközpontoknak
  subtitle: Teljes felszerelési csomagok, oktatói eszközök, márkajelzés és karbantartási támogatás SUP klubok, kajakklubok, szörfiskolák és bármilyen méretű vízisport oktatóközpontok számára.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP deszkák vízisport klubok és kölcsönzőflották számára
direct_answer: Aquafarer teljes körű felszerelési megoldásokat kínál vízisport klubok és oktatóközpontok számára világszerte. Klubcsomagjaink SUP deszkákat, kajakokat, evezőket, pumpákat, javítókészleteket és biztonsági felszerelést tartalmaznak versenyképes nagykereskedelmi áron alacsony MOQs mellett. Minden csomag testreszabható klublogókkal, márkázott színekkel és személyre szabott csomagolással. Ezen kívül karbantartási képzést, pótalkatrész-támogatást és felszerelésrotációs programokat is biztosítunk a flotta élettartamának maximalizálása érdekében.
