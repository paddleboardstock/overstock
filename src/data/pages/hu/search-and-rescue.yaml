headline: Kiváló felfújható csónakok keresési és mentési műveletekhez
subtitle: Aquafarer ez a SAR felfújható hajók szabványát állítja fel — a kompromisszummentes megbízhatóságra, tartósságra és teljesítményre, amelyet az életmentő küldetések megkövetelnek.
