hero:
  tagline: Paddle Board Overstock Egyéni Labor
  title: Tervezd meg saját magad<br />Vízi jármű
  subtitle: OEM, ODM, saját márkás és egyedi arculatépítési szolgáltatások vállalkozásoknak világszerte. Az egyetlen prototípustól a teljes gyártási sorozatokig.
  cta: Indítsd el a projekted
  footer_link: /contact
steps_section:
  tagline: Hogyan működik
  title: A koncepciótól a gyártásig
  subtitle: Négy lépés az ötletedtől a kész, tengerre kész termékig.
  steps:
    - num: '01'
      title: Válaszd ki a tábládat
      desc: Válasszon alapmodelljeink közül — SUP, kenu, csónak, vagy RIB. Válassza ki a méretet, az anyagot és a színt.
    - num: '02'
      title: Töltsd fel a dizájnodat
      desc: Küldje el nekünk a logóját, grafikáját vagy márkaútmutatóját. A tervezőcsapatunk elkészít egy digitális példányt.
    - num: '03'
      title: AI makett áttekintés
      desc: Tekintse meg a fotórealisztikus, mesterséges intelligencia által készített makettet az egyedi táblájáról, mielőtt megkezdődne a gyártás.
    - num: '04'
      title: Termelés és szállítás
      desc: Miután jóváhagyásra kerül, a rendelésed belép a ISO-tanúsított gyártósorunkra. A szállítási határidők 30 napról indulnak.
services_section:
  tagline: Szolgáltatások
  title: Gyártási szolgáltatások globális márkák számára
  subtitle: Rugalmas együttműködési modellek — a szerződéses gyártástól a teljes körű márkaépítésig.
  items:
    - title: OEM gyártás
      desc: A terveid szerint gyártjuk — a te szellemi tulajdonod, a te rajzaid, a te minőségi szabványaid. Teljes NDA védelem.
      icon: ⚙️
    - title: ODM megoldások
      desc: Válasszon az 50+ bevált platform közül, és testre szabhatja a méretet, színt, grafikát és csomagolást.
      icon: 🎨
    - title: Saját márka
      desc: A márkád a termékeinken — logó, csomagolás, akasztós címkék, használati útmutatók. Közvetlenül a dobozból kész a kiskereskedelmi értékesítésre.
      icon: 🏷️
    - title: Egyedi márkázás
      desc: Pályanyomtatás a fedélzeten, törzs grafikák, csőmatricák és egyedi címkék — teljes márka integráció.
      icon: ✨
capabilities_section:
  tagline: Képességek
  title: Gyártási és testreszabási képességek
  subtitle: Minden, amit tudnod kell a rendelés leadása előtt.
  capabilities:
    - label: Rendelési mennyiség
      value: MOQ 5–10 darab (SUP/kajak), 2–5 darab (RIB)
    - label: Átfutási idő
      value: 30–45 nap standard; 15–20 nap prototípusok esetén
    - label: Testreszabás
      value: Méret, forma, szín, grafika, csomagolás, hardver
    - label: Anyagok
      value: PVC, Hypalon, drop-stitch, üvegszál, alumínium
    - label: Nyomtatás
      value: Digitális (CMYK), szitanyomás, hőátvitel, szublimáció
    - label: Tanúsítvány
      value: CE, ISO 9001, BSCI, UKCA (támogatás a globális megfeleléshez)
why_section:
  tagline: Miért Paddle Board Overstock
  title: Egy gyár. Egy szabvány. Zéró kompromisszum.
  points:
    - text: 12 000 nm integrált gyártóüzem
      highlight: 12 000 nm
    - text: 200-300 képzett munkás és mérnök
      highlight: 200-300
    - text: Évente 15 000 hajó gyártása
      highlight: 15,000
    - text: ISO 9001 tanúsított minőségirányítás
      highlight: ISO 9001
    - text: CE EU-piacra tanúsított termékek
      highlight: CE
  cta: Gyári részletek megtekintése
  cta_link: /factory
  contact:
    title: Készen áll a projekt megbeszélésére?
    desc: Csapatunk 24 órán belül válaszol előzetes árajánlattal.
