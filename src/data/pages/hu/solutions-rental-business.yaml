testimonial:
  content: Egy helyi boltból béreltem 5 deszkát, és a bevételem 60%-át elvesztettem nekik. Aquafarer segített nekem felépíteni a saját, 15 SUPs-ból álló flottámat. Az általuk biztosított ROI kalkulátor azt mutatta, hogy 4 hónap alatt érek el nullszaldót – valójában 3 hónap alatt sikerült. Most 30 deszkára bővítek, és kajakokat is hozzáadok.
  name: Daniel Okonkwo
  title: Tulajdonos, Lakeland SUP Kiadó — Ontario, Kanada
content_segments:
  tagline: Bérleti profilok
  title: Vízi sporteszköz kölcsönző megoldások<br />Operátortípus szerint
  subtitle: A különböző bérlési műveleteknek különböző igényeik vannak — a kis tengerparti SUP bérlésektől a nagyszabású üdülőhelyi vízisport központokig. Ennek megfelelően testre szabjuk a felszereléscsomagjainkat és a támogatási modellünket.
  items:
    - title: Tengerparti és tóparti SUP bérlések
      subtitle: Nagy volumenű, alacsony összetettségű műveletek
      description: Üzemeltetők, akik SUP deszkákat és kajakokat közvetlenül a strandoló kirándulóknak és a tó látogatóinak bérbe adnak. Az Ön elsődleges célja a bérbeadások közötti átfutási idő minimalizálása, a felszerelés folyamatos forgásban tartása, valamint az éves csúcsidőszakok kezelésének biztosítása kis tárolási területtel.
      features:
        - Felfújható SUP flották, amelyek laposan csomagolhatók – kikötő vagy utánfutó nélkül
        - Kereskedelmi minőségű PVC, amely 100+ bérlési ciklusra van értékelve szezononként
        - Gyorsan száradó, UV-álló anyag az aznapi újra bérbeadásra való felkészüléshez
        - Színkódolt táblatartományok az egyszerű flottazonosításhoz
    - title: Üdülőhelyek és Szállodák Vízisport Központjai
      subtitle: Vendégélmény és márkaösszhang
      description: Üdülőhelyek és hotelek, amelyek vízi sportokat kínálnak a helyszíni szolgáltatás részeként. A felszerelésnek prémium kinézetűnek kell lennie, megbízhatóan kell működnie kezdő és középhaladó vendégek számára, és integrálódnia kell az üdülőhely meglévő tevékenységfoglalási és számlázási folyamataival.
      features:
        - Egyedi márkájú SUP deszkák és mentőmellények az üdülőhely színeivel
        - 'Vegyes flotta: SUPs, kajakok, pedálcsónakok és kis RIB hajíhajók'
        - Csendes, üzemanyag-mentes elektromos pumpamegoldások partmenti felfújásra
        - Dolgozói képzés és karbantartási bevezetés biztosított
    - title: Csónak és RIB bérbeadók
      subtitle: Kereskedelmi minőségű hajóbérleti flották
      description: Motoros hajókat — RIB hajúhajók, gumicsónakok és kis motorcsónakok — órára vagy fél napra bérbe adó üzemeltetők. A flottának meg kell felelnie a tengeri biztonsági előírásoknak, el kell viselnie a sok vendéghasználatot, és minimalizálnia kell a műszaki leállásokat a bérlések között.
      features:
        - RIB csomagok 30–90 HP külmotorra kész hátsó rész esetén
        - Tengeri minőségű rétegelt lemez padlópanelek a hosszú távú szerkezeti integritás érdekében
        - Gyorsindító szelep rendszerek a gyorsabb átfutás érdekében
        - Pótalkatrész készlet + rendelkezésre álló technikai támogatási SLA
    - title: Túra és kaland üzemeltetők
      subtitle: Vezetett kirándulási flották
      description: Üzemeltetők, akik vezetett vízi sport túrákat szerveznek — SUP szafarik, barlangkajakozás, snorkeling kirándulások vagy szigettúrák RIB. A felszerelésnek elég stabilnak kell lennie a kezdő túravendégek számára, gyorsan tisztíthatónak kell lennie a csoportok között, és elég tartósnak a napi vezetett használat során a különböző vízi körülmények között.
      features:
        - Extra-stabil SUP platformok (32" széles +) kezdő lovasok számára
        - Tandem kajak opciók páros/csoportos túra konfigurációkhoz
        - Beépített tárolókapacitás snorkeling felszerelés, vízhatlan táskák és hűtőszekrények számára
        - CE + USCG megfelelőségi dokumentáció kereskedelmi működéshez
