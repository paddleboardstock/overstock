certifications:
  - title: CE Tanúsítvány (EU 2016/425)
    standard: PPE rendelet (EU) 2016/425 | EN ISO 12402
    description: Minden Aquafarer biztonsági eszköz megfelel CE az Európai Személyi Védőfelszerelésről szóló rendelet szerinti jelölési követelményeknek. Minden terméket önállóan tesztelnek TÜV a Rheinland, egy európai értesített testület. Fújható csónakjaink RIBs megfelelnek a 2013/53/EU () Recreational Craft Directive RCDC és D kategóriás előírásainak.
    body: CE A tanúsítás alapvető egészségügyi és biztonsági követelményeket fed le a személyes flotációs eszközök és felfújható vízi járművek esetében.TÜV A Rheinland évente auditálja termelési létesítményünket, hogy ellenőrizze a folyamatos megfelelést.
  - title: SOLAS — Életbiztonság a tengeren
    standard: SOLAS III. fejezet | LSA kódex
    description: A Life Vest Pro megfelel a SOLAS tengeri és kereskedelmi hajózási műveletekre vonatkozó előírásoknak. Tesztelték 24 órás felhajtóképesség-megtartásra, az automatikus felfújásra merüléskor, valamint teljesítményre tengeri állapotban 5-ös erőig. Megfelel a III. fejezet követelményeinek a mentőmellényekre a kereskedelmi hajókon.
    body: SOLAS A jóváhagyáshoz független vizsgálatot igényel egy értesített testület által a felhajtóerő, erősség, láthatóság és automatikus aktiválás szempontjából. Life Vest Pro-nk teljes SOLAS típusjóváhagyással rendelkezik MED tanúsítvánnyal.
  - title: USCG III. típus / V típus
    standard: 46 CFR 160. rész |USCG Jóváhagyás
    description: Kiválasztott Aquafarer mentőmellények megfelelnek az Egyesült Államok Parti Őrségének minősítésének, amelyek a III. típusú (úszósegítő) és V típusú (speciális használatú) eszközök tekintetében. Alkalmasak védett vizekre, part menti hajózásra és kereskedelmi műveletekre, amelyek USCGjóváhagyott PFD-ket igényelnek.
    body: USCG a jóváhagyás CG-által elismert független laboratóriumban végzett tesztelést igényel. V típusú jóváhagyás magában foglalja a hibrid felfújható terveket, amelyek kézi vagy automatikus aktiválást igényelnek.
  - title: BSCI Társadalmi megfelelőség
    standard: BSCI amfori Magatartási Kódex
    description: Gyárunkat évente auditálják az amfori Business Social Compliance Initiative (BSCI). Ez igazolja az etikus munkaügyi gyakorlatokat, a munkahelyi biztonságot, a tisztességes munkaidőt és a környezetgazdálkodást 12 000 m²-es termelési létesítményünkben.
    body: A BSCI megfelelőség előfeltétele az európai kiskereskedők és importőrök számára. Jelenlegi BSCI értékelésünk "C" (Jó), amelyet az SGSáltala auditált.
  - title: REACH & RoHS Megfelelőség
    standard: REACH EU-rendelet (EK) 1907/2006 |RoHS 2011/65/EU irányelv
    description: Minden PVC termékekben használt vegyület, ragasztó és bevonat Aquafarer megfelel az EU REACH vegyi biztonsági előírásainak és RoHS veszélyes anyagok előírásainak. Minden termékvonalhoz elérhetők anyagbiztonsági adatlapok (MSDS).
    body: REACH a megfelelőség biztosítja, hogy ne legyen korlátozott SVHC anyagok a küszöbérték felett. A rendszeres harmadik féltől származó laboratóriumi tesztek minden gyártási tételnél ellenőrizik a folyamatos megfelelést.
  - title: ISO 9001:2015 Minőségirányítás
    standard: ISO 9001:2015 |TÜV Rheinland Tanúsított
    description: Minőségirányítási rendszerünk ISO a Rheinland által 9001:2015 minősítéssel TÜV rendelkezik, amely a tervezést, gyártást, tesztelést és értékesítés utáni szolgáltatást kap. Az éves felügyeleti auditok folyamatos fejlesztést és folyamatirányítást biztosítanak.
    body: ISO A 9001-es tanúsításhoz dokumentált minőségi szabályzatok, belső auditok, vezetői felülvizsgálatok, korrekciós eljárások és nyomon követhető gyártási nyilvántartások követelményei szükségesek.
testimonial:
  quote: Több beszállítótól szereztünk biztonsági felszerelést Ázsiából.Aquafarer Ez az egyetlen gyártó, amely előzetes CE dokumentációt, SOLAS tanúsítványokat és harmadik fél tesztjelentéseket adott — anélkül, hogy megkérnék volna.
  author: Erik Lindström
  title: Biztonsági tiszt
  company: Balti-tengeri utánpótlás
  location: Finnország
content_overpressure:
  tagline: Túlnyomás biztonsági
  title: RIB Csőnyomás<br />Menedzsment forró éghajlaton
  subtitle: A felfújható csőnyomás hőmérséklettel nő. A túlnyomás megértése és kezelése megakadályozza a károkat, és biztosítja a biztonságos működést trópusi és sivatagi környezetekben.
  items:
    - title: Boyle nyomáscsökkentő szelepek
      description: Aquafarer RIB A csöveket túlnyomáscsökkentő szelepekkel szerelték fel, amelyek automatikusan levezetik a túlzott nyomást a megadott maximum felett. Megakadályozza a varrásfeszültséget és a cső esetleges kitörését a napmelegedés miatt.
      icon: tabler:gauge
    - title: Reggeltől délig tartó nyomásváltozás
      description: Egy 20°C-on 3,5-re felfújt cső PSI + PSI 40°C-os napfény mellett elérheti 4,5-öt. Mindig fújd fel a javasolt tartomány alsó végére meleg éghajlaton, és hagyd, hogy a mentőszelep kezelje a túlzott nyomást.
      icon: tabler:sun
    - title: Ajánlott működési nyomások
      description: 'PVC csövek: 3,0-3,5 PSI üzemmódban, 4,5 PSI max. Hypalon csövek: 3,5-4,0 PSI üzemmódban, PSI 5,0 max. Mindig teszteljük 1,25x besorolással (4,4 PSI PVCesetén, 5,0 PSI Hypalonesetén) a Aquafarer QC szabványok szerint.'
      icon: tabler:chart-bar
    - title: Napfény legjobb gyakorlatai
      description: Árnyékos RIBs helyeken tárolj, ha nem használod. UVHasználj védőfedéleket hosszabb kikötéshez. Ellenőrizd és állítsd be a csőnyomást a napfény csúcsideje előtt és után. Soha ne lépd túl a maximális névnyomást.
      icon: tabler:umbrella
    - title: Vészhelyzeti nyomáscsökkentés
      description: Ha a cső túl keménynek érzi magát, vagy a kimentő szelep szellőzik, engedje ki a levegőt a Halkey-Roberts vagy katonai szelepen keresztül, amíg a nyomás vissza nem tér a működési tartományba. Vigyél magaddal egy nyomásmérőt a pontos mérésekhez.
      icon: tabler:alert-circle
