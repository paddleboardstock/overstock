testimonial:
  quote: Átnéztem a deszkámmal érkezett nyomáspróba naplót, és két kérdést küldtem a támogatásnak a nyári hőmérsékleten történő felfújással kapcsolatban. Ugyanazon a napon valós számokkal válaszoltak. Ez többet jelent, mint bármi, amit valaha bármelyik bolt tett volna értem.
  author: Sofia Marchetti
  title: Ellenőrzött vásárló
  company: Tengeri evezős
  location: Olaszország
content_overpressure:
  tagline: Nyomásbiztonság
  title: Deszka nyomás<br />Menedzsment forró éghajlaton
  subtitle: A felfújható deszka nyomása hőmérséklettel nő. A túlnyomás megértése és kezelése védi a deszkát és minden alkalmat biztonságossá tesz.
  items:
    - title: Miért nő a nyomás
      description: A levegő hő hatására tágul. Egy deszka, amelyet 20°C-on 15 PSI-ra fújtak, 40°C-os napon 1-2 PSI-ra emelkedhet — ugyanaz a fizika, ami miatt egy hűvös reggeli deszka délre kövekként keménynek tűnik.
      icon: tabler:gauge
    - title: Ajánlott működési nyomás
      description: Fújd 12-15 PSI-ra, ahogy a szelepnél fel van tüntetve. A névleges tartomány kiegyensúlyozza a merevséget, a biztonságot és a varratok élettartamát — a több nem jobb.
      icon: tabler:chart-bar
    - title: Forró éghajlatú legjobb gyakorlatok
      description: Fújd a tartomány alsó végére a forró napokon. Engedj ki egy kis levegőt hosszan tartó napsugárzás előtt, és soha ne hagyd teljesen felfújt deszkát tűző napon a parton.
      icon: tabler:sun
    - title: Napfény és tárolás
      description: Tárold a deszkákat árnyékban és részben leeresztett állapotban, amikor nem használod. Használj deszkazsákot UV védelmére. Öblítsd le és szárítsd meg feltekerés előtt a tárolásra.
      icon: tabler:umbrella
    - title: Ha a deszka kőkeménynek érződik
      description: Engedj ki levegőt a szelepen keresztül, amíg a deszka vissza nem tér a névleges tartományba. Vidd magaddal a mérőt a pumpánál a pontos olvasáshoz — a túlfújt deszka feleslegesen terheli a varratokat.
      icon: tabler:alert-circle
