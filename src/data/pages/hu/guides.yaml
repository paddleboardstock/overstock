hero:
  tagline: Útmutatók
  title: Új a SUP számára?
  subtitle: Gyakorlati útmutatók a felfújható vízisport-eszközök kiválasztásához, használatához és élvezetéhez.
size_guide:
  tagline: Méret & Műszaki Adatok
  title: Találd meg a neked megfelelő méretet
  desc: Hasonlítsa össze a deszkák méreteit, súlykapacitását és ajánlott felhasználását. Akár egy stabil, mindenre alkalmas deszkát, akár egy gyorsabb túraformát szeretne — méretkalauzunk segít kiválasztani a megfelelő méretet.
  link_label: Teljes méret útmutató termékműszaki adatokkal →
  link: /size-guide
  cards:
    - title: Mindenoldalú SUP táblák
      desc: Körülbelül 11 láb hosszú deszkáink (32 hüvelyk szélesek) egyensúlyban tartják a stabilitást, a sebességet és a kapacitást. A 6 hüvelyk drop-stitch mag 15 PSI-nál mereven tartja a fedélzetet minden szintű evezős számára.
    - title: Szélesség és stabilitás
      desc: A szélesebb deszkák (32"+) nagyobb stabilitást kínálnak kezdőknek, jógához és horgászathoz. A 6 hüvelykes vastagság növeli a merevséget és a teherbírást a lovas és a felszerelés számára.
    - title: Csomagok és kiegészítők
      desc: Minden deszka teljes csomagként kerül kiszállításra — deszka, utazótáska, kézipumpa, állítható evező, levehető uszony, csigás póráz és javítókészlet. Ellenőrizze a maximális terhelhetőséget a lovasra és a felszerelésre vonatkozóan.
