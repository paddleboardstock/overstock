hero:
  tagline: Útmutatók
  title: Új a SUP számára?
  subtitle: Gyakorlati útmutatók a felfújható vízisport-eszközök kiválasztásához, használatához és élvezetéhez.
size_guide:
  tagline: Méret & Műszaki Adatok
  title: Találd meg a neked megfelelő méretet
  desc: Hasonlítsd össze a termék méreteit, teherbírását és ajánlott felhasználását. Akár egy túrakajakra, egy kompakt kajakra, vagy egy kereskedelmi RIB-ra van szükséged — méret útmutatónk segít a megfelelő választásban.
  link_label: Teljes méret útmutató termékműszaki adatokkal →
  link: /size-guide
  cards:
    - title: SUP Táblák
      desc: A hosszúságot a testsúlyod és a tervezett használat alapján válaszd. Szélesebb deszkák (32"+) nagyobb stabilitást biztosítanak. Hosszabb deszkák (11–12 ft) jobb nyomon követést kínálnak túrázás közben.
    - title: Kajakok
      desc: Egyes kajakok (9 ft) egyedüli utazásokhoz és folyókhoz. Kétszemélyes kajakok (12 ft) két evezőshöz vagy egy személyhez felszereléssel. Mindig ellenőrizd a teherbírást.
    - title: Csónakok & RIBs
      desc: A hosszúságot az utasok száma és a felhasználás alapján válaszd. Nagyobb RIBs (4,5 m+) offshore és mentési célokra. Kisebb csónakok (2,7 m) tenderként és horgászplatformként.
