testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Owner, Algarve Surf Academy
    location: Lagos, Portugal
    content: 'We started with the Club Starter Package for our surf school. 20 boards, paddles, vests — everything arrived within 3 weeks. After two seasons, we upgraded to the Pro Package. The custom branding with our logo was a game-changer for our professional image.'
    rating: 5
    product: Club Starter Package
    source: solutions/clubs

  - category: clubs
    name: Club Owner
    title: Water Sports Club
    location: Phuket, Thailand
    content: 'The Club Starter Package was the perfect entry point. As our business grew, Aquafarer grew with us — same quality, same pricing, no surprises. We scaled from 10 to 80 boards in 18 months.'
