reasons:
  tagline: The Aquafarer Difference
  title: What Sets Us Apart
  isBeforeContent: false
  columns: 3
  items:
    - title: Real Manufacturing, Not Trading
      description: 'We own and operate a 12,000 m² factory. When you partner with Aquafarer, you work directly with the people who design, engineer, and build your products — no middlemen.'
      icon: tabler:building-factory
    - title: Engineering-Led Approach
      description: 'Our design process starts with the use case, not the product category. We optimize hull shape, material selection, and configuration for how the equipment will actually be used in commercial environments.'
      icon: tabler:engine
    - title: Certified Quality
      description: 'CE certified, ISO quality system, BSCI compliant, REACH compliant, USCG Type III/V approved life vests; all products meet applicable international standards.'
      icon: tabler:certificate
    - title: Flexible OEM/ODM
      description: 'Tube colors, console layout, branding, packaging — we customize to your specifications. No minimum order pressure. Start with a prototype, scale with confidence.'
      icon: tabler:adjustments
    - title: Global Logistics
      description: 'US warehouse in California, direct shipping from Qingdao, air freight for urgent orders. We handle customs paperwork and documentation worldwide.'
      icon: tabler:truck-delivery
    - title: Lifetime Support
      description: 'We support boats we built 20 years ago. Genuine spare parts, technical advice, repair guidance — our team is available when you need us, wherever you are.'
      icon: tabler:lifebuoy

testimonials:
  tagline: Trusted by Brands Worldwide
  title: What Our Partners Say
  items:
    - content: 'We have worked with several manufacturers in China, but Aquafarer stands out for their engineering support and consistent quality. They treat our brand as their own.'
      name: '— OEM Partner, European Water Sports Brand'
    - content: 'Their Hypalon RIBs have been in service with our fleet for over 5 years. Minimal maintenance, excellent UV resistance. The 5-year warranty on tubes gives us confidence.'
      name: '— Fleet Operator, Middle East Resort Group'
    - content: 'The Aquafarer team helped us develop a custom SUP board design from concept to production in 90 days. The quality exceeded our expectations.'
      name: '— Distributor, Australian Watersports'
    - content: 'As a small business owner, I was worried about MOQs. Aquafarer worked with my budget and helped me launch my brand with just 50 boards. Now I am ordering 500.'
      name: '— Brand Founder, US SUP Rental Company'

cta:
  title: 'Ready to build your water business?'
  subtitle: 'Contact our team for a free consultation. No commitment — just honest advice about equipment and manufacturing.'
  actions:
