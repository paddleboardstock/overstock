hero:
  tagline: Why Aquafarer
  title: 'Built Different. Built for Business.<br />The Partner Behind Water Adventures Worldwide'
  subtitle: 'Not just a manufacturer — a business partner that designs, engineers, and delivers commercial-grade equipment for clubs, resorts, rental operators, and emerging water brands.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer manufacturing quality and expertise

pillars:
  tagline: Three Pillars of Partnership
  title: Why the World's Water Businesses Choose Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Designed For Commercial Use
      description: 'Our equipment is engineered for daily rental, not weekend recreation. Commercial-grade PVC, reinforced drop-stitch cores, UV-stable Hypalon options, and field-tested hardware mean lower maintenance, longer lifespan, and higher ROI for your operation.'
      icon: tabler:building-factory
      callToAction:
        text: See commercial product line
        href: /products
    - title: From Idea To Market
      description: 'Launch your water sports brand in 90 days. We guide you through every step: concept validation, product selection, prototype, production, packaging design, and global shipping. No minimum order pressure — start small, scale with confidence.'
      icon: tabler:rocket
      callToAction:
        text: Start your brand journey
        href: /oem-odm-blueprint
    - title: Built For Global Conditions
      description: 'Products optimized for every climate: cold-water PVC formulations for Europe, UV-resistant materials for the Middle East and Australia, anti-humidity treatments for Southeast Asia. Each shipment is calibrated to its destination environment.'
      icon: tabler:world

