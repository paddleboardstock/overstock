hero:
  tagline: Kumppanuudet ja jakelu
  title: 'Ryhdy Aquafarer-kumppaniksi<br />— maailmanlaajuinen jakeluverkosto'
  subtitle: "Liity Aquafarerin maailmanlaajuiseen kumppaniverkostoon. Työskentelemme merivälineiden jakelijoiden, venemaalijoiden, varusteliikkeiden ja brändikumppanien kanssa yli 50 maassa."
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sales-office.webp
    alt: Aquafarerin maailmanlaajuinen kumppani- ja jakelijaverkosto
content_programs:
  tagline: Kumppanuusohjelmat
  title: 'Kumppanuusohjelmat<br />kasvua varten'
  subtitle: 'Oletpa jakelija, jälleenmyyjä tai brändikumppani, Aquafarer tarjoaa liiketoimintaasi tukevia ohjelmia.'
  columns: 3
  items:
    - title: Jakelijaohjelma
      description: 'Eksklusiivinen aluejakelu volyymihinnoilla, markkinointituelleella ja suoralla pääsyllä tehtaalle. Vähimmäissitoumus alueen koon mukaan.'
      icon: tabler:world
    - title: Jälleenmyyjäohjelma
      description: 'Suorat jälleenmyyntihinnat, tuotekoulutus, markkinointimateriaali ja takuutuki kivijalkaliikkeille ja verkkokaupoille.'
      icon: tabler:building-store
    - title: OEM/ODM-kumppanuus
      description: 'Täysipalveluinen OEM- ja ODM-valmistus räätälöidyllä brändäyksellä, pakkauksilla ja tuotespesifikaatioilla. Konseptista konttiin.'
      icon: tabler:certificate
    - title: Brändikumppanuus
      description: 'Yhteisbrändäys-, private label- ja eksklusiivisten mallien ohjelmat vakiintuneille brändeille meri- ja ulkoilusektorilla.'
      icon: tabler:stars
    - title: 'Julkishallinto ja instituatiot'
      description: 'Suosittujen toimittajien ohjelmat viranomaisille, rannikkovartiostoille, armeijalle ja humanitaarisille järjestöille. Tarjousvalmis dokumentaatio.'
      icon: tabler:building-community
    - title: 'Lomakeskusten ja vuokrauksen kumppani'
      description: 'Laivastohinnat, johdonmukainen laatu ja räätälöity brändäys lomakeskuksille, sukelluskeskuksille ja vuokrausliikkeille ympäri maailmaa.'
      icon: tabler:sun
content_benefits:
  tagline: Miksi kumppaniksi kanssamme
  title: 'Miksi kumppanit valitsevat Aquafarerin'
  subtitle: 'Kumppanimme hyötyvät todellisesta valmistuskyvystä, johdonmukaisesta laadusta ja nopeasta tuesta.'
  list:
    - 'Suora pääsy tehtaalle: Työskentele suoraan valmistustiimimme kanssa — ilman välittäjiä. Saat nopeammat vastaukset, paremmat hinnat ja täyden näkyvyyden tuotantoon.'
    - 'Valmis räätälöintiin: Brändää tuotteesi omilla väreillä, logoilla, pakkauksilla ja spesifikaatioilla. Minimointimäärät räätälöityinä markkinallesi.'
    - 'Taattu laatu: ISO 9001 -sertifioitu tuotanto CE-, UKCA- ja BSCI-vaatimustenmukaisuudella. Jokainen tuote testataan ennen lähetystä.'
    - 'Maailmanlaajuinen logistiikka: Lähetys Qingdaosta, Kiinasta FOB-, CIF- ja DDP-ehdoin. Varasto Yhdysvalloissa Montclairissä, Kaliforniassa Pohjois-Amerikan jakeluun.'
    - 'Markkinointituki: Tuotekatalogit, valokuvaus, tekninen dokumentaatio ja digitaaliset aineistot myynnintukisi.'
    - 'Koulutus ja tuki: Tuotekoulutus myyntitiimillesi, tekninen tuki asiakkaillesi ja takuupalveluiden koordinointi.'
content_process:
  tagline: Miten ryhdyt kumppaniksi
  title: 'Yksinkertainen kumppanuusprosessi'
  subtitle: 'Kumppanuusprosessimme on suoraviivainen — suunniteltu niin, että aloitat Aquafarer-tuotteiden myynnin nopeasti.'
  items:
    - title: 'Vaihe 1: Jätä hakemus'
      description: 'Täytä kumppanihakemuslomakkeemme yritysprofiilillasi, kohdemarkkinallasi ja kiinnostuksenkohteillasi.'
    - title: 'Vaihe 2: Kelpoisuuden arviointi'
      description: 'Kumppanuustiimimme arvioi hakemuksesi ja ottaa yhteyttä 3 arkipäivän kuluessa keskustellakseen mahdollisuuksista.'
    - title: 'Vaihe 3: Sopimus ja käyttöönotto'
      description: 'Allekirjoita kumppanuussopimus, perusta tilisi ja vastaanota kumppanihinnat, markkinointimateriaali ja tuutenäytteet.'
    - title: 'Vaihe 4: Koulutus ja lanseeraus'
      description: 'Tuotekoulutus, myyntituki ja markkinointimateriaali toimitetaan. Olet valmis aloittamaan myynnin.'
cta:
  title: 'Valmis ryhtymään Aquafarer-kumppaniksi?'
  subtitle: 'Hae kumppanuutta ja tiimimme vastaa 3 arkipäivän kuluessa.'
  actions:
    - variant: primary
      text: Hae kumppanuutta
      href: /contact
    - text: Katso tuotteemme
      href: /products
