testimonials:
  - category: klubeja
    name: Ricardo Santos
    title: Omistaja, Algarve Surf Academy
    location: Lagos, Portugali
    content: Aloitimme surffauskoulumme Club Starter -paketilla. 20 lautaa, meloja, liivejä – kaikki tuli perille 3 viikossa. Kahden kauden jälkeen päivitimme Pro-pakettiin. Räätälöity brändäys logollamme muutti ammattikuvaamme.
    rating: 5
    product: Klubin aloituspaketti
    source: solutions/clubs
  - category: klubeja
    name: Klubin omistaja
    title: Vesiurheiluklubi
    location: Phuket, Thaimaa
    content: Klubin aloituspaketti oli täydellinen lähtökohta. Liiketoimintamme kasvaessa Aquafarer kasvoi kanssamme – sama laatu, sama hinta, ei yllätyksiä. Skaalasimme 10:stä 80 tauluun 18 kuukaudessa.
    rating: 5
    product: Club Starter + Premium -paketti
    source: success-stories
  - category: lomakohteet
    name: Lomakeskuksen pääjohtaja
    title: 5 tähden Beach Resort
    location: Kreikka
    content: Aquafarer ei vain toimittanut lautoja – ne auttoivat meitä rakentamaan täydellisen vieraskokemuksen. Vesiurheiluohjelmamme eteni nollasta lomakohteen kohokohtaksi yhden kauden aikana. Yli 300 viikoittaista varausta ja 180 000 dollarin vuositulot.
    rating: 5
    product: Resort Premium -paketti
    source: success-stories
  - category: lomakohteet
    name: Sophie Laurent
    title: Vieraskokemuksen johtaja, Azure Bay Resorts
    location: Phuket, Thaimaa
    content: Aquafarer suunnitteli ja varusteli koko rantaaktiviteettiohjelmamme kolmessa lomakohteessa. 80 SUPia, 40 kajakkia, turvallisuusinfrastruktuuri ja henkilöstön koulutus – kaikki toimitetaan yhdessä lähetyksessä. Vieraiden osallistuminen kasvoi 60 % ensimmäisen kauden aikana.
    rating: 5
    product: Resort Premium -paketti
    source: solutions/resorts
  - category: yrittäjiä
    name: Michael Park
    title: Shoreline Paddle Co:n perustaja.
    location: Kalifornia, Yhdysvallat
    content: Julkaisin SUP-brändini ilman kokemusta alalta. Aquafarerin tiimi ohjasi minut tuotevalinnasta yksilölliseen logosuunnitteluun ja pakkaamiseen. Ensimmäinen konttini saapui 11 viikossa ja myin loppuun 3 kuukaudessa Amazonissa.
    rating: 5
    product: Aloitusbrändin julkaisu
    source: solutions/entrepreneurs
  - category: yrittäjiä
    name: Perustaja
    title: Australialainen SUP-merkki
    location: Australia
    content: Minulla oli brändi-idea, mutta nolla valmistustietoa. Aquafarer piti kädestäni kirjaimellisesti koko prosessin ajan – oikean laudan suunnittelusta ensimmäisen lähetykseni purkamiseen. 90 päivää unelmasta toimitukseen.
    rating: 5
    product: Brändin julkaisupaketti
    source: success-stories
  - category: vuokraus
    name: Daniel Okonkwo
    title: Omistaja, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Vuokrasin 5 taulua paikallisesta kaupasta ja menetin 60 % tuloistani heille. Aquafarer auttoi minua rakentamaan oman 15 SUP-laivastoni. ROI-laskin osoitti kannattavuuden 4 kuukaudessa – se kesti 3. Nyt olen laajentamassa 30 tauluun.
    rating: 5
    product: Fleet-aloituspakkaus
    source: solutions/rental-business
  - category: vuokraus
    name: Marco Valenti
    title: Toimintajohtaja, Adriatic Adventure Tours
    location: Dubrovnik, Kroatia
    content: Varustimme koko vuokrakalustomme Aquafarer RIB:illä – 12 venettä kolmessa paikassa. Kaksi kautta, nolla epäonnistumista. CE-sertifiointidokumentaatio teki vakuutusten hyväksymisestä saumattoman. Heidän suunnittelutiiminsä jopa räätälöi putkien värejä.
    rating: 5
    product: Laivaston laajennussarja
    source: trust
  - category: vuokraus
    name: Komentajaluutnantti Andres Reyes
    title: Maritime Procurement Officer, Filippiinien rannikkovartioston avustaja
    location: Manila, Filippiinit
    content: Käytämme 24 Aquafarer RIB:tä rannikkovartiolaivastossamme. Niiden laadunvalvontaprosessi on johdonmukainen jokaisessa erässä – sama sauman laatu, sama venttiilin sijoitus, sama paineluokitus joka kerta. Toistettavuudella on merkitystä, kun elämä riippuu laitteista.
    rating: 5
    product: RIB-partiolaivasto
    source: trust
  - category: kuluttajat
    name: Sarah K.
    title: Ensimmäinen SUP-omistaja
    location: Lake Tahoe, Yhdysvallat
    content: Vakaa jopa aloittelijalle. Vein sen järvelle ensimmäisenä päivänä, enkä koskaan pudonnut. Täydellinen paketti pumpulla ja melalla tarkoitti, että olin vedessä 20 minuuttia laatikon avaamisen jälkeen.
    rating: 5
    product: SUP Explorer 11
  - category: kuluttajat
    name: James Thornton
    title: SUP Explorer 11 Omistaja
    location: Vancouver, Kanada
    content: Ensimmäistä kertaa ostajana olin hermostunut laadukkaista tilauksista ulkomailta. ISO-dokumentaatio ja kolmannen osapuolen testiraportit, jotka he jakoivat ennen kuin edes kysyin, antoivat minulle täydellisen luottamuksen. Lauta saapui 6 päivässä ja ylitti odotukseni.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: kuluttajat
    name: Mike R.
    title: Vapaa-ajan meloija
    location: Florida, Yhdysvallat
    content: Vankka rakennuslaatu. Käsittelee rannikon kyljystä paremmin kuin odotin puhallettavalta. Pakkasin sen auton tavaratilaan viikonloppumatkaa varten - ilmalla rampilla alle 4 minuutissa.
    rating: 5
    product: Puhallettava kajakki
