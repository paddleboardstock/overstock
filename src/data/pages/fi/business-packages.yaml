faq:
  title: Paketin UKK
  questions:
    - q: Mikä on pakettien vähimmäistilausmäärä?
      a: Klubin aloituspaketissa on vähintään 10 yksikköä. Resort- ja Brand-paketit räätälöidään tarpeidesi mukaan joustavilla MOQ-ratkaisuilla.
    - q: Kauanko toimitus kestää?
      a: Vakiotuotanto on 30–45 päivää tilausvahvistuksesta. Nopeutettu tuotanto on saatavilla lisämaksusta.
    - q: Voinko mukauttaa laitteiden värejä ja tuotemerkkiä?
      a: Kyllä. Kaikki paketit sisältävät täyden räätälöinnin – taulun värit, logopainatukset ja pakkaussuunnittelun.
    - q: Tarjoatko myynnin jälkeistä tukea?
      a: Kyllä. Jokainen paketti sisältää pääsyn online-huoltooppaihimme, opetusvideoihimme ja varaosien tilausjärjestelmäämme.
