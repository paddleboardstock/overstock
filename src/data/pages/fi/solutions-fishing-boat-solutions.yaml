content_challenge:
  tagline: Haaste
  title: Kalastusveneet tarvitsevat<br />vakautta, toimintamatkaa ja kestävyyttä
  subtitle: Käytätpä kaupallisia kalastusaluksia, hallinnoit yhteistoiminnallista laivastoa tai harjoitat kalastusrahoitusta – veneesi on toimittava luotettavasti joka päivä.
  paragraphs:
    - Kalastusveneet tarvitsevat vakaita alustoja siimojen käsittelyyn, saaliin käsittelyyn ja turvalliseen liikkumiseen kannella. Ilmapallot ja RIB:t tarjoavat luontaista vakautta putkirakenteensa ansiosta — merkittävä etu samanpituisiin jäykkärunkoisiin veneisiin verrattuna.
    - Polttoainetehokkuudella on merkitystä kalastustoiminnassa, jossa käyttökustannukset vaikuttavat suoraan kannattavuuteen. RIB-veneet ja kumiveneet ovat kevyempiä kuin vastaavat jäykät veneet, jotka vaativat vähemmän tehoa ja kuluttavat vähemmän polttoainetta. Tämä on tärkeää kaupallisille toimijoille, jotka käyttävät veneitä päivittäin, ja osuuskunnille, jotka hallinnoivat laivastobudjettia.
    - Kestävyys meriympäristöissä on välttämätöntä. Suolavesi, UV-altistus ja jatkuva käyttö vaativat materiaaleja, jotka kestävät ankarat olosuhteet hajoamatta. Kaupallisille ja osuustoiminnallisille toimijoille luotettavuus vaikuttaa suoraan tuloihin – rikkinäinen vene tarkoittaa menetettyjä kalastuspäiviä.
    - Paddle Board Overstock-kalastuskokoonpanot sisältävät vavanpitimet, kalakaikut, syöttikuopat, asusteet ja lastinkäsittelyratkaisut, jotka on suunniteltu vakaviin kalastussovelluksiin kaupallisiin, osuuskunta- ja virkistystarkoituksiin.
content_solution:
  tagline: Ratkaisumme
  title: Kalastukseen valmiit kokoonpanot
  subtitle: Jokainen Paddle Board Overstockin kalastusvene voidaan konfiguroida omaan kalastuskäyttöösi.
  list:
    - Vavankannattimen kiinnitys — tehdasasennettuna tai valmiina jälkiasennukseen
    - Kalakaikuluotaimen/GPS:n kiinnityslevy konsolin kohdalla
    - Syöttiastian tai elävän saalisastian vaihtoehdot vuokra- ja kaupallisille toimijoille
    - Jäähdytys-/säilytyskokoonpanot saaliin käsittelyyn
    - Deep-V-runko avomerikykyyn — vakaa paikallaan, sulava vauhdissa
    - PVC- tai Hypalon-putkivaihtoehdot — Hypalon pitkäaikaiseen UV-altistukseen
    - Perämoottorivalikoima 15 HV:stä 115 HV:iin mallista ja käyttötarkoituksesta riippuen
content_segments:
  tagline: Kalastusprofiilit
  title: Puhallettavat kalastusveneratkaisut<br />Käyttäjätyypin mukaan
  subtitle: Rannikkourheilukalastuksesta kaupalliseen pitkäsiimaan – erilaiset kalastustoiminnot vaativat erilaisia ​​runkokokoonpanoja, tehoalueita ja kannella olevia asetuksia. Räätälöimme jokaisen veneen kalastuksen, vesien ja työskentelytavan mukaan.
  items:
    - title: Kaupalliset kalastusyritykset
      subtitle: Laivaston työveneet päivittäiseen kalastustoimintaan, verkkojen käsittelyyn, saaliiden kuljetukseen
      description: Kaupalliset kalastusyritykset käyttävät työveneitä verkkojen asettamiseen ja noutoon, ansojen huoltoon, pitkäsiimaan ja saaliiden kuljettamiseen. Nämä veneet toimivat joka päivä suolaisen veden ympäristöissä ja niiden on kestettävä raskaita kuormia, jatkuvaa kannenkäsittelyä ja pitkiä käyttötunteja. Polttoainetehokkuus ja vähäinen huoltotarve ovat kriittisiä kaluston kannattavuuden kannalta. Aluksella on oltava vakaat työtasot miehistön pyydysten ja saaliiden käsittelyä varten vaihtelevissa meriolosuhteissa.
      features:
        - Tasainen asettelu verkon käsittelyyn, pyydysten pinoamiseen ja kalan varastointiin
        - Polttoainetehokas 40-115 HP perämoottori alhaiset päivittäiset käyttökustannukset
        - Raskaat Hypalon putket kestävät kulutusta päivittäisessä käytössä
        - Vahvistetut hankausnauhat toistuvaan laituriin ja alukseen kosketukseen
        - Itsestään nouseva kansi helpottaa pesua käytön jälkeen
        - Laivaston hinnoittelu ja yhdenmukaiset tekniset tiedot usean aluksen operaattoreille
    - title: Tilauskalastusoperaattorit
      subtitle: Monen matkustajan mukavuus, saaliiden käsittely, turvallisuussertifioitu
      description: Toimijat, jotka harjoittavat puolen päivän ja koko päivän kalastusta - rannikkoriuttakalastuksesta offshore-pohjakalastukseen. Veneesi tarvitsee matkustajaistuimia, joissa on turvallisuustodistukset, runsaasti kansitilaa useille kalastajille ja integroidut asuinpaikat, jotka pitävät syötin ja saaliin tuoreena koko matkan ajan. Vieraiden mukavuus vaikuttaa suoraan matka-arvosteluihin, toistuviin varauksiin ja online-arvioihin.
      features:
        - Konsoliohjaus iskuja vaimentavilla kauhaistuimilla
        - Tehdasasennetut tangonpitimet (4-8 asentoa)
        - 60–115 HP perämoottorit offshore-risteilynopeuksille
        - CE C- tai B-luokan todistus kaupalliseen matkustajaliikenteeseen
        - Bimini tai T-top aurinkosuoja vieraiden mukavuuteen pitkillä matkoilla
    - title: Käsityöläiset ja pienimuotoiset kaupalliset kalastajat
      subtitle: Luotettavat työveneet päivittäiseen toimeentuloon
      description: Riippumattomat kalastajat, jotka luottavat veneeseensä ensisijaisena tulonlähteenä – verkkojen laskemisessa, pyydysten hoidossa tai rantojen käsittelyssä. Prioriteettisi on polttoainetalous, yksinkertainen huolto, jonka voit suorittaa itse, ja vene, joka käsittelee kohtuullisia saalis- ja varustekuormia vakaudesta tinkimättä.
      features:
        - Polttoainetehokas 15–40 HP perämoottori alhaisilla käyttökustannuksilla
        - Hypalon CSM putket pidennettyyn UV- ja kulutuskestävyyteen
        - Tasainen asettelu verkon käsittelyyn ja kalan varastointiin
        - Helppo laskeutuminen rannalle puhallettavalla kölisuojalla
    - title: Kalastusosuuskunnat
      subtitle: Saaliiden keräys, jäsenkuljetus, tarvikkeiden jakelu
      description: Kalastusosuuskunnat käyttävät yhteisöpohjaisia ​​laivastoja kerätäkseen jäsenkalastajien saaliita, kuljettaakseen tarvikkeita syrjäisille kalastusyhteisöille ja jakaakseen satoa markkinoille. Nämä työveneet tarvitsevat suuren hyötykuorman, luotettavan päivittäisen käytön ja helpon huollon syrjäisissä paikoissa. Osuuskunnat toimivat usein kehittyvillä alueilla, joilla osien saatavuus ja huoltoon pääsy ovat rajalliset, mikä tekee yksinkertaisista perämoottoreista ja kestävästä rakenteesta olennaista.
      features:
        - Suuri hyötykuorma saaliiden ja tarvikkeiden nostamiseen
        - Yksinkertainen perämoottorin kokoonpano helpottaa huoltoa paikan päällä
        - Raskas PVC tai Hypalon -rakenne budjetin joustavuuden vuoksi
        - Tasainen kansi kiinnityspisteillä lastin kiinnittämiseen
        - Polttoainetehokas toiminta minimoi yhteistyökustannukset
    - title: Urheilu- ja pelikalastusharrastajat
      subtitle: Suorituskykyä ja tyyliä vakavalle kalastajalle
      description: Kokeneet kalastajat etsivät tehokasta kalastusalustaa, joka tarjoaa nopeuden kaukaisille alueille, vakaat seisomataisteluasennot ja ensiluokkaisen istuvuuden ja viimeistelyn. Veneen täytyy tuntea olonsa kotoisaksi, juokseepa sitten kaksi mailia merestä riutalle tai tutkii syrjäisiä suistoalueen suvantoalueita.
      features:
        - Deep-V RIB runko tasaiseen ajoon chop
        - Fishfinder/GPS-asennuslevy esijohdotettu konsoliin
        - Baitwell ja jäähdytin integroitu takaistuinmoduuliin
        - Mukautetut EVA kannen värivaihtoehdot, jotka vastaavat veneen/putkien grafiikkaa
    - title: Kalastusopas ja ekomatkanjärjestäjät
      subtitle: Ohjattuja kalastuselämyksiä vieraileville kalastajille
      description: Oppaita, jotka vievät pieniä ryhmiä vierailevia kalastajia tuottaville kalastuspaikoille – yhdistävät usein kalastuksen ekomatkailun elementteihin, kuten lintujen tarkkailuun tai mangrovemetsäilyyn. Veneen tulee ajaa kuivana ja mukavasti vieraille, jotka eivät ole tottuneet pieniin veneisiin, ja siinä on helppo nousta ja varjo.
      features:
        - Bimini yläosa tai T-top kiinnityspisteitä tehtaalla asennettuna
        - Sileät sisääntulotikkaat helpottavat nousua
        - Hiljainen 4-tahtinen perämoottori minimoi häiriöt
        - Kuivat säilytyslokerot vieraspuhelimille, lompakoille, kameroille
