hero:
  tagline: Oppaat
  title: Uusi SUP-käyttäjä?
  subtitle: Käytännön oppaita, joiden avulla voit valita, käyttää ja nauttia puhallettavista vesiurheiluvälineistä.
size_guide:
  tagline: Koko & Tekniset tiedot
  title: Löydä tarpeisiisi sopiva koko
  desc: Vertaa tuotteiden mittoja, painokapasiteettia ja suositeltuja käyttötarkoituksia. Tarvitsetpa sitten retki-SUP:n, kompaktin kajakin tai kaupallisen RIB:n – kokooppaamme auttaa sinua valitsemaan oikean istuvuuden.
  link_label: Täysikokoinen opas tuotetietoineen →
  link: /size-guide
  cards:
    - title: SUP-laudat
      desc: Valitse pituus painosi ja käyttötarkoituksen mukaan. Leveämmät laudat (32"+) tarjoavat enemmän vakautta. Pidemmät laudat (11–12 ft) kulkevat paremmin vaelluksissa.
    - title: Kajakit
      desc: Yksittäiset kajakit (9 jalkaa) yksin matkustamiseen ja jokiin. Tandem-kajakit (12 jalkaa) kahdelle melojille tai yhdelle varusteineen. Tarkista aina painokapasiteetti.
    - title: Joillat ja RIB:t
      desc: Valitse pituus matkustajamäärän ja käytön mukaan. Suuremmat RIB:t (4,5 m+) offshore- ja pelastustöihin. Pienemmät veneet (2,7 m) tarjouksiksi ja kalastusalustoiksi.
