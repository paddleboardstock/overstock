services:
  - title: Tuotesuunnittelu ja insinööntityö
    description: Sisäinen R&D-tiimimme työskentelee ideasi tai spesifikaatiosi pohjalta kehittäen CAD-piirustuksia, 3D-malleja ja prototyyppejä. Tarjoamme muottisuunnittelua, rungon muodon optimointia ja materiaalivalinnan ohjausta.
  - title: Räätälöity brändäys ja grafiikka
    description: Täysväriset digipainot, silkkipainot, kohopainot ja tarra-asetukset. Kehitämme brändikohtaisen kansigrafiikan, putkien brändäyksen ja vähittäismyyntivalmiin pakkauksen.
  - title: Materiaalien ja spesifikaatioiden räätälöinti
    description: Valitse PVC (vakio, ympäristöystävällinen, liekinkestävä), Hypalon/CSM, drop-stitch ja hybridirakenteet väliltä. Räätälöidyt putkien värit, kankaan painot ja vahvistusvaihtoehdot.
  - title: Pakkaus ja logistiikka
    description: Räätälöity vähittäispakkaus, private label -pahvit, tyhjiöpakkaus, lavitus ja konttilaajus. Toimitusehdot FOB Qingdao, CIF tai DDP saatavilla.

