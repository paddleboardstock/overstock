why_us:
  - title: Pystysuuntainen integraatio
    description: Omistamme tehtaamme, muottimme ja toimitusketjumme — ei välittäjiä, ei alihankkijoita. Tämä antaa meille hallinnan laatuun, kustannuksiin ja toimituksiin.
  - title: Kaksoissertifointi
    description: ISO 9001 -laadunhallinta ja BSCI-yhteiskuntavastuusertifiointi. Tehtaan auditointiraportit saatavilla pyynnöstä.
  - title: CE-vaatimustenmukaisuus
    description: Kaikki vakiomallit kantavat CE 2013/53/EU -sertifiointia. Räätälöidyt mallit voidaan CE-sertifioida vakiintuneen prosessimme kautta.
  - title: Matala MOQ
    description: Aloita vain 5 yksiköstä vakiomalleille. Autamme nousevia brändejä käynnistymään ilman liiallista varastositoumusta.
