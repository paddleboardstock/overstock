hero:
  tagline: Teollisuuden ratkaisumatriisi
  title: Skenaariopohjaiset meriratkaisut<br />ammattimaisiin toimiin
  subtitle: Tarkoituksenmukaisesti suunnitellut ilmatäytteiset vesikulkuneuvot ja RIB:t, jotka on konfiguroitu pelastus-, vuokralaivasto-, huvipurjehduksiin ja kaupalliseen kalastussovelluksiin – jokaisella on tekniset tiedot ja mukautusvaihtoehdot.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    alt: Aquafarer ammattimaiset meriratkaisut eri teollisuudenaloille
direct_answer: 'Aquafarer toimittaa skenaario-suunniteltuja puhallettavia vesikulkuneuvoja ja RIB-ratkaisuja kaupalliseen merenkulkuun: pelastus- ja partioveneet vahvistetuilla Hypalon-putkilla ja monikammioturvallisilla, vuokrakaluston SUP-veneitä ja kajakkeja 1,2 mm:n PVC:llä ja kuumailmahitsatuilla saumoilla, joilla on vähän huoltoa vaativa kestävyys, ylelliset syvällä RIB-V-kalastusveneet ja raskaat RIB-V-huviveneet. pidikkeet ja asuinkaivojärjestelmät.'
solution_a:
  tagline: Ratkaisu A
  title: Marine Rescue &<br />kaupallinen partio
  subtitle: Nopeat, monikammioiset turva-RIB:t ammattimaiseen hätäapuun ja lainvalvontaoperaatioihin.
  badge: Heavy-Duty Series
  description: Meripelastus- ja partio-RIB:mme on valmistettu vahvistetuista korkeatiheyksistä Hypalon/PVC-ilmaputkista, joissa on monikammioinen riippumaton kelluntarakenne. Jokainen alus on varustettu ammattitason heijastinteipillä, pelastustarranauhalla ja nopeasti täyttyvillä venttiileillä käyttöönottovalmiutta varten. Deep-V lasikuiturungot tarjoavat poikkeuksellisen vakauden suurilla nopeuksilla ja ankarissa meriolosuhteissa.
  features:
    - title: Monikammioinen turvallisuus
      description: 4–6 itsenäistä ilmakammiota – mikä tahansa yksittäisen kammion puhkeaminen ylläpitää positiivista kelluntakykyä
    - title: Vahvistettu putkikangas
      description: 1,2 mm Hypalon CSM tai 1 680 DTEX PVC kaksikerroksisilla kuumailmahitsaussaumilla
    - title: Ammattitaso
      description: SOLAS heijastinnauha, pelastustarranauhat, hinauskiinnikkeet, pikairrotettava maalausköysi
    - title: High Speed Hull
      description: Deep-V lasikuitu- tai alumiinirunko, 25–45 solmua kokoonpanosta riippuen
  recommended_models:
    - RIB 450 Patrol
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Rungon materiaali
      value: Lasikuitu / merilaatuinen alumiini
    - label: Putken kangas
      value: 1,2 mm Hypalon CSM / 1 680 DTEX PVC
    - label: Max nopeus
      value: 25-45 solmua
    - label: Kapasiteetti
      value: 6-12 henkilöä
    - label: Moottorivalikoima
      value: 40-200 hv
    - label: Sertifiointi
      value: CE / iso 9001
solution_b:
  tagline: Ratkaisu B
  title: Vesiurheilun vuokraus ja<br />lomakohteiden laivaston varusteet
  subtitle: Erittäin kestävät, vähän huoltoa vaativat puhallettavat SUP-laitteet, kajakit ja veneet, jotka on suunniteltu päivittäiseen vuokraukseen lomakeskuksissa, klubeissa ja kiertoajeluissa.
  badge: Rental-Grade
  description: Vuokrakalustomme on suunniteltu kestäviksi ja alhaisiksi ylläpitokustannuksiksi. Käytämme 1,2 mm vahvistettua PVC:tä kolmikerroksisella kuumailmahitsaussaumatekniikalla, joka kestää UV-hajoamista ja toistuvia törmäysvaurioita. Drop-stitch-rakenne varmistaa, että levyt säilyttävät jäykkyyden jopa satojen vuokrausjaksojen jälkeen. Kaikissa malleissa on vahvistetut D-renkaat, kulutusta kestävät kiskonauhat ja kaupalliset venttiilit.
  features:
    - title: Kaupallinen PVC
      description: 1,2 mm vahvistettu PVC UV-stabilisaattoreilla – 3x paksumpi kuin kuluttajalaatuiset materiaalit
    - title: Kuumalla ilmalla hitsatut saumat
      description: Kolmikerroksinen sulahitsaus – vahvempi kuin liimaliitos, kestää delaminaatiota
    - title: Drop-stitch-jäykkyys
      description: 1 680 DTEX-ydin, 2 kierrettä/neliö tuumaa – mitoitettu 20 PSI:iin kovalevyn kaltaiseen jäykkyyteen
    - title: Laivastovalmis muotoilu
      description: Vahvistetut D-renkaat, kaupalliset Halkey-Roberts-venttiilit, kulutusta kestävät kiskonauhat
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Putken materiaali
      value: 1,0–1,2 mm vahvistettu PVC
    - label: Saumatekniikka
      value: Kolmikerroksinen kuumailmahitsaus
    - label: Max paine
      value: 15–20 PSI (pudotusommelmallit)
    - label: UV-kestävyys
      value: Yli 1000 tunnin nopeutettu testaus
    - label: Takuu
      value: 2-5 vuotta mallista riippuen
    - label: Huolto
      value: Minimaalinen - huuhtele ja säilytä
solution_c:
  tagline: Ratkaisu C
  title: Yacht Tenders &<br />Ylelliset vesikulkuneuvot
  subtitle: Kevyet, korkean suorituskyvyn RIB-tarrat, jotka on suunniteltu superjahtien varastointiin ja vieraiden kuljettamiseen ylellisellä istuvuudella ja viimeistelyllä.
  badge: Premium Series
  description: Huviveneiden RIB:issämme yhdistyvät kevyt rakenne ja ylellisyys. Deep-V alumiini- tai lasikuiturungot tarjoavat poikkeuksellisen ajolaadun ja helpon taavetin noston. saatavana värisovitetulla putkigrafiikalla, ensiluokkaisella verhoilulla ja mukautetuilla konsoliasetteluilla. Kompaktit säilytysmitat tekevät niistä ihanteellisia superjahtien autotalliin ja kansisäilytykseen.
  features:
    - title: Kevyt rakenne
      description: Merikäyttöiset alumiinirungot vähentävät painoa 30 % lasikuituun verrattuna helpottaen nostoa
    - title: Deep-V -suorituskyky
      description: 18–22 asteen nousurunko takaa tasaisen ajon ja erinomaisen seurannan
    - title: Ylellinen istuvuus ja viimeistely
      description: Räätälöity verhoilu, värisovitetut putket, ensiluokkainen ruorikonsoli, ruostumaton pakkaus
    - title: Kompakti säilytystila
      description: Suunniteltu superjahtiautotalleihin – tyhjennettävät putket kompaktiin säilytykseen
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Rungon tyyppi
      value: Deep-V alumiini / lasikuitu
    - label: Deadrise
      value: 18-22 astetta
    - label: Max nopeus
      value: 30-40 solmua
    - label: Kuiva paino
      value: 120-350 kg (alumiinirunko)
    - label: Davit Lift valmis
      value: Kyllä – vakiona nostopisteet
    - label: Varastointi
      value: Tyhjennettävät putket, pinottavat
