breadcrumb: OEM/ODM-valmistaja
tldr:
  summary: Paddle Board Overstock on suoraan tehtaalta toimiva OEM/ODM-valmistaja. 12 000 m²:n ISO 9001:2015-sertifioitu tehdas, 15 000 yksikön vuosituotanto, CE/BSCI/REACH/UKCA-vaatimustenmukaisuus, pienet minimitilausmäärät 2-10 yksiköstä.
  points:
    - 12 000 m²:n ISO 9001:2015-sertifioitu tehdas Qingdaossa
    - 15 000 yksikön vuosikapasiteetti 200-300 ammattitaitoisella työntekijällä
    - CE 2013/53/EU-, UKCA-, BSCI- ja REACH-vaatimustenmukaisuus
    - 'Pienet minimimäärät: 2-5 yksikköä (RIB), 5-10 yksikköä (SUP) vakiomalleille'
    - Vienti yli 50 maahan, FOB Qingdao -toimitus
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015-sertifioitu
      desc: SGS:n auditoin laadunhallintajärjestelmä kaikilla tuotantolinjoilla.
      variant: cert
    - icon: ⭐
      title: CE- ja UKCA-vaatimustenmukaisuus
      desc: Täysi vaatimustenmukaisuus EU 2013/53/EU:n ja Ison-Britannian merkintävaatimusten kanssa.
      variant: cert
    - icon: ⭐
      title: BSCI-sosiaalinen auditointi
      desc: Vahvistetut eettiset työskentelykäytännöt ja työpaikkastandardit.
      variant: standard
    - icon: ⭐
      title: Pieni minimimäärä 2 yksiköstä
      desc: 'Vakio-RIB-mallit 2-5 yksiköstä, SUP 5-10 yksiköstä. Räätälöity muotti: 200+.'
      variant: standard
process_section:
  eyebrow: Prosessimme
  title: Kattava OEM/ODM-työnkulku
  subtitle: Suunnittelubriefistä konttiin lastaukseen — kuusi vaihetta omaa merkkiäsi kantavaan täytettävään vesikalustoon.
  steps:
    - step: '01'
      title: Määrittely ja suunnittelubrief
      desc: Jaa kohdemäärityksesi, CAD-piirustuksesi tai referenssituote. Suunnittelutiimimme tarkistaa materiaalit, mitat ja vaatimustenmukaisuusvaatimukset (CE, BSCI) ennen tarjousta.
    - step: '02'
      title: 3D-muottien prototyypitys
      desc: Suunnittelemme ja CNC-koneistoamme räätälöidyt muotit SUP-lautoille, kajakkien rungoille ja RIB-osille. Prototyyppinäytteet valmistetaan 15-20 työpäivässä hyväksyttäväksesi.
    - step: '03'
      title: Materiaalin valinta ja näytteiden valmistus
      desc: Valitse sotilasluokan PVC (0,9-1,2 mm), Hypalon CSM tai drop-stitch-ydinaineet. Valmistamme esisarjanäytteet brändisi väreillä, logolla ja pakkauksilla hyväksyttäväksi.
    - step: '04'
      title: CE-tehdasauditointi ja vaatimustenmukaisuus
      desc: Jokainen OEM-tilaus sisältää vaatimustenmukaisuusdokumentaation — CE-vaatimustenmukaisuusvakuutuksen, ISO 9001-jäljitettävyystietueet, BSCI-sosiaalisen vastuun raportin ja REACH-ainevakuutukset.
    - step: '05'
      title: Sarjatuotanto ja linjanlaajuinen laadunvalvonta
      desc: Tuotantoerät noudattavat 100 pisteen laadunvalvontalistaa. Jokainen yksikkö läpikäy 24 tunnin paineenpidontestauksen, saumojen kuorintatestin ja visuaalisen tarkastuksen ennen pakkausta.
    - step: '06'
      title: FOB Qingdao -logistiikka ja kuljetus
      desc: Valmiit tuotteet lavitetaan, kalvopakataan ja konttilastataan Qingdaon satamassa. Hoidamme kaikki vientiasiakirjat, tulliselvitykset ja tarjoamme reaaliaikaisen lähetystenseurannan.
capabilities_section:
  eyebrow: Valmistuskyvykkyydet
  title: Mitä valmistamme
  subtitle: Kuusi keskeistä valmistuskyvykkyyttä globaaleille B2B-kumppaneille.
  items:
    - title: Drop-stitch SUP-lautojen valmistus
      desc: Koko pituudelta drop-stitch-ydinlaminointi jäykille, korkeapaineisille (15-20 PSI) melontalautoille. Räätälöity pituus, leveys, paksuus, rocker-profiili ja graafinen suunnittelu.
    - title: PVC-ponttoniveneiden valmistus
      desc: Suurtaajuushitsatut PVC-jollat, tenderit ja urheiluveneet. Useita ilmakamarioita, lattiaratkaisuja (listat, ilmaponttoni, rullattava) ja lisävarusteiden integrointi.
    - title: Hypalon-RIB-veneiden valmistus
      desc: Kaupallisen luokan Hypalon CSM -putket lasikuitu- tai alumiinirunkoihin syvällä V-mallilla. Pituudet 3,3 m:stä 6,0 m:ään partio-, pelastus-, risteily- ja sukellusoperaatioihin.
    - title: Oma merkki ja räätälöity brändäys
      desc: 'Täysi private label -palvelu: räätälöity logo lämpösiirto- tai silkkimenetelmällä, brändätty pakkaus (myyntipakkaukset, kantopussit), käyttöohjeet omalla kielelläsi sekä viivakoodi-/UPC-rekisteröinti.'
    - title: Räätälöityjen muottien ja työkalujen suunnittelu
      desc: Oma 3D CAD/CAM-suunnittelutiimi. Suunnittelemme ja valmistamme räätälöityjä alumiini- ja komposiittimuotteja ainutlaatuisiin runkomuotoihin, kansiratkaisuihin ja lisävarustekiinnityksiin.
    - title: OEM-lisävarusteet ja paketointi
      desc: Pelastusliivit (CE 12402), kaksoistoimiset pumput, hiili/nylon-melat, korjaussarjat, kantopussit ja talutushihnat. Täysi paketointi ja nippupakkaukset myyntivalmista esittelyä varten.
experience_section:
  eyebrow: Käytännön kokemus
  title: Kumppanuudet, jotka rakensivat brändejä
  subtitle: Tositarinoita brändeistä ja organisaatioista, jotka valitsivat Paddle Board Overstockin OEM/ODM-valmistajakseen.
  stories:
    - quote: Tulimme Paddle Board Overstockille luonnoksella servetillä ja listalla vaatimuksia. Kahdeksan kuukautta myöhemmin meillä oli tuotantovalmis tuote, joka läpäisi CE-sertifioinnin ensimmäisellä yrityksellä.
      narrative: Eurooppalainen startup uudella SUP-mallilla kääntyi Paddle Board Overstockin puoleen ODM-valmistusta varten. Paddle Board Overstockin R&D-tiimi vei konseptin CAD-suunnittelun, FEA-rakenneanalyysin, hydrodynaamisen simuloinnin, muotin valmistuksen, prototyypin rakentamisen ja tuotantotyökalujen läpi.Startupin perustaja kävi Qingdaossa kolme kertaa prosessin aikana. Lopputuote läpäisi CE-sertifioinnin ilman muutoksia — tulos, jonka perustaja johtaa Paddle Board Overstockin suunnittelutiimin kyvystä ymmärtää Euroopan sääntelyvaatimukset alusta alkaen.
      context: Eurooppalaisen SUP-brändin lanseeraus, 2023-2024
      source: Brändin perustaja
    - quote: NDA-suojan ja IP-turvallisuuden taso Paddle Board Overstockilla antaa meille luottamusta jakaa omistukselliset suunnitelmat. He kohtelevat IP:tämme kuin omaansa.
      narrative: Yhdysvaltalainen merenkulkulaitteita valmistava yritys omistuksellisella venttiiliteknologialla tarvitsi valmistuskumppanin, joka voisi suojella sen IP:tä ja tuottaa samalla suuressa mittakaavassa. Auditoituaan viisi kiinalaista valmistajaa se valitsi Paddle Board Overstockin tehtaan IP-suojaprotokollien, suunnittelutiedostojen turvallisen käsittelyn ja tiukkojen NDA-sopimusten allekirjoitusvalmiuden perusteella. Kumppanuus on tuottanut kolme tuotesarjaa neljässä vuodessa ilman ainuttakaan IP-välikohtausta.
      context: Yhdysvaltalainen merenkulkulaitteiden yritys, OEM-kumppanuus vuodesta 2021
      source: Operatiivinen varajohtaja
