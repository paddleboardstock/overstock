philosophy:
  tagline: Suunnittelufilosofia
  title: 'Insinöörilähtöinen suunnittelu<br />— jokainen yksityiskohta merkitsee'
  subtitle: 'Insinöörifilosofiamme nojaa kolmeen periaatteeseen, jotka ohjaavat kaikkea valmistamaamme.'
  list:
    - 'Luotettavuus ensin: Jokainen Paddle Board Overstock-tuote testataan kestämään todellisia olosuhteita — kylmän veden pelastustehtävistä trooppisten lomakeskusten vuokraukseen. Suunnittelemme varmuutta sinne, missä sillä on eniten merkitystä.'
    - 'Valmistustarkkuus: Laitoksemme käyttävät CNC-leikkausta, suurtaajuushitsausta ja automatisoituja painetestejä. Jokainen sauma, jokainen venttiili ja jokainen liitin täyttää dokumentoidut vaatimustasot.'
    - 'Jatkuva kehittäminen: T&K-tiimimme arvioi jatkuvasti uusia materiaaleja, tuotantomenetelmiä ja suunnitteluparannuksia. Emme odota ongelmia — ennakomme ne.'
cta:
  title: 'Haluatko keskustella projektista tiimimme kanssa?'
  subtitle: 'Insinöörimme ovat valmiina neuvomaan tuotevalinnoissa, räätälöinnissä ja OEM/ODM-kumppanuuksissa.'
  actions:
    - variant: primary
      text: Ota yhteys tiimiimme
      href: /contact
    - text: Katso tuotteemme
      href: /products
