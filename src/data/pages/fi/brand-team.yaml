hero:
  tagline: Tiimimme
  title: 'Paddle Board Overstockin tekijät<br />— insinööritaitoa vapaudeksi vedessä'
  subtitle: 'Vuonna 2012 Kiinan Qingdaossa perustettu Paddle Board Overstock syntyi meri-insinöörien, materiaalitieteilijöiden ja vesiurheilun harrastajien toiveesta tehdä ammattitason ilmatäytteiset alukset saataville kaikkialle maailmaan.'
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstockin koko tiimin kuva — suunnittelu, tuotanto ja johto
founding:
  tagline: Perustamisemme
  title: 'Rannikon pajasta<br />12,000 m²:n tuotantolaitokseksi'
  subtitle: 'Paddle Board Overstockin perusti meri-insinöörien joukko, jolla on yhteensä vuosikymmenten kokemus ilmatäytteisten veneiden suunnittelusta, PVC/Hypalon-käsittelystä ja merenkulkuvälineiden maailmanlaajuisesta valmistuksesta.'
  items:
    - title: "Perustettu: 2012"
      description: 'Perustettu Kiinan Qingdaoon — merkittävä merenkulkukeskus syvällä laivanrakennusperinteellä.'
      icon: tabler:calendar
    - title: 200-300 työntekijää
      description: 'Mukaan lukien yli 50 T&K-insinööriä, laadunvalvonnan asiantuntijoita ja tuotantoteknikkoja.'
      icon: tabler:users
    - title: Tuotantolaitos 12,000 m²
      description: 'Oma tehdas, jossa 6 tuotantolinjaa RIB-veneille, ilmatäytteisille veneille ja SUP-lautoille.'
      icon: tabler:building-factory
    - title: 'Yli 50 maata'
      description: 'Vientiä Eurooppaan, Amerikkaan, Lähi-itään, Aasia-Tyynenmeren alueelle ja Afrikkaan.'
      icon: tabler:globe
