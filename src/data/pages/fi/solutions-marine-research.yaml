content_challenge:
  tagline: Haaste
  title: Merentutkimus vaatii<br />vakaat, laitevalmiit alustat
  subtitle: Tieteellisten työveneiden on tarjottava vakaa alusta herkälle instrumentoinnille, hiljainen toiminta villieläinten häiritsemisen välttämiseksi ja joustavat asettelut erilaisille tutkimuslaitteille.
  paragraphs:
    - Meren tutkimus ja ympäristövalvonta edellyttävät työveneitä, jotka toimivat liikkuvina laboratorioina. Toisin kuin kaupalliset tai vapaa-ajan veneet, tutkimus-RIB:t on varustettava herkällä elektronisella instrumentoinnilla, vesi- ja sedimenttinäytteiden ottoon tarkoitetuilla laitteilla ja joskus elävien näytteiden kuljetukseen — samalla kun vene tarjoaa vakaan alustan tarkan tiedonkeruun kannalta.
    - '**Alustan vakaus on ratkaisevaa** — Sonarit, kaikuluotaimet ja CTD-profiililaitteet (johtavuus, lämpötila, syvyys) vaativat vakaan rungon paikallaan ollessa ja hitaassa vauhdissa. Liiallinen köliveto tai rungon liike tuottaa häiriötä tieteelliseen dataan. Hyvien vakausominaisuuksien omaava syvä-V-runko on välttämätön.'
    - '**Instrumenttien integrointi** — Tutkimusalukset tarvitsevat kiinnityspisteitä GPS-antenneille, sonarin lähettimille, näytteenottokäsivarsille ja datan kirjauslaitteille. Konsolitilan on mahdutettava useita näyttöjä, instrumenttien virranjakelu ja turvallinen säilytys herkälle elektroniikalle.'
    - '**Hiljainen käynti** — Meribiologian kenttätutkimuksissa ja ympäristövalvonnassa moottorin melu ja rungon tärinä voivat pelästyttää merieläimet ja heikentää käytöshavaintoja. Hiljaiset perämoottoriratkaisut ja pienitärinäiset rungorakenteet ovat tärkeitä tutkimuskäytössä.'
    - Paddle Board Overstockin tutkimus-RIB:t suunnitellaan vakailla runkoalustoilla, integroiduilla laitteiden kiinnitysjärjestelmillä ja hiljaisilla perämoottoriratkaisuilla tieteellisiin ja ympäristövalvontasovelluksiin.
content_solution:
  tagline: Ratkaisumme
  title: Tarkoituksenmukaiset tutkimus-RIB:t<br />Tiede- ja ympäristötyöhön
  subtitle: Jokainen Paddle Board Overstock-tutkimus RIB on konfiguroitu vakaaksi, muokattavaksi alustaksi tieteellisille instrumenteille ja kenttänäytteenottolaitteille.
  list:
    - Lasikuituinen syvä-V-runko erinomaisella paikallaan pidettävyydellä ja hitaissa tutkimusnopeuksissa
    - Tasainen kansiratkaisu laitteiden kiinnityslevyillä sonarille, GPS:lle ja näytteenottovälineille
    - Konsoli usean näytön käyttöön — karttaplotteri, kaikuluotain, dataloggeri
    - 12 V:n ja 24 V:n lisävirranjakelu tieteellisille instrumenteille
    - Hiljainen 4-tahtinen perämoottori — minimaalinen tärinä ja melu eläinlaskentoihin
    - Valinnainen matalan kölivodon runkoratkaisu minimaaliseen häiriöön tiedonkeruun aikana
    - Räätälöidyt putkien värit tutkimuslaitosten brändäykseen ja laivaston tunnistamiseen
content_segments:
  tagline: Tutkimusprofiilit
  title: Meritieteen ratkaisut<br />sovellustyypin mukaan
  subtitle: Eri tutkimussovelluksilla on ainutlaatuiset alusvaatimukset – yliopistojen opetusaluksista ympäristönmittausaluksiin ja vedenlaadun seurantaaluksiin.
  items:
    - title: Yliopiston meritieteen ohjelmat
      subtitle: Opetusalustat, opiskelijoiden opintomatkat, rannikkotutkimus
      description: Meritieteen yliopistot ja valtameren laitokset tarvitsevat luotettavia ja monipuolisia työveneitä kenttäkurssien, opiskelijoiden tutkimusprojektien ja tiedekunnan vetämien rannikkotutkimusten opettamiseen. Veneen on oltava helppokäyttöinen valvonnan alaisena opiskelijoille, riittävän vakaa käytännön instrumenttien käyttöä varten ja riittävän kestävä useiden käyttäjien toistuvaan käyttöön akateemisesti. Budjettirajoitukset akateemisissa ympäristöissä tekevät kustannustehokkuudesta ja alhaisesta ylläpidosta tärkeitä näkökohtia.
      features:
        - Vakaa alusta opiskelijoiden instrumenttien lasku- ja nostoharjoittelua varten
        - Helppo käyttö — peräsin- tai yksittäiskonsoliratkaisu ohjattuun opiskelijakäyttöön
        - Kestävät Hypalon-putket toistuviin rantautumisiin ja opiskelijoiden käsittelyyn
        - Laitteiden kiinnitys opetustason sonarille, Secchi-levylle ja näytteenottovälineille
        - Kustannustehokas PVC-vaihtoehto tiukalla budjetilla toimiville akateemisille ohjelmille
    - title: Merentutkimuslaitokset
      subtitle: Tutki RIB:t instrumenttien integraatiolla, GPS:llä, näytteenottolaitteistolla
      description: Rannikko- ja offshore-tutkimuksia suorittavat merentutkimusorganisaatiot tarvitsevat ammattimaisesti konfiguroidut tutkimus-RIB:t integroiduilla instrumenteilla. Näissä aluksissa on kaikuluotainjärjestelmät syvyysmetristä kartoitusta varten, CTD-profiililaitteet vesipatsaan analysointiin, sedimenttinäytteenottimet ja biologiset keräyslaitteet. Veneen on tarjottava vakaa alusta hitailla mittausnopeuksilla, siinä on oltava runsaasti kansitilaa laitteiden käyttöönottamista varten ja tarjottava puhdasta 12 V/24 V virtaa elektroniikalle.
      features:
        - Integroitu sonarinlähettimen kiinnitys — rungon läpi tai peräpeiliin asennettuna
        - GPS-antennin kiinnitys ja konsoli-integrointi tutkimusluokan navigointiin
        - CTD-laitteen ja vesinäytteenottimen laskualue turvallisilla kiinnityspisteillä
        - 12 V/24 V:n apuvirranjakelu instrumenteille ja dataloggereille
        - Vakaa hitaassa vauhdissa (3–6 solmua) tutkimuslinjojen tarkkuuden varmistamiseksi
        - Valinnainen A-kehys tai davit raskaampien näytteenottolaitteiden laskemiseen
    - title: Ympäristön seuranta ja suojelu
      subtitle: Ekologiset tutkimukset, villieläinten havainnointi, elinympäristön arviointi
      description: Ympäristöjärjestöt, valtion virastot ja luonnonsuojelujärjestöt tekevät meriekologisia tutkimuksia, villieläinpopulaatioiden seurantaa ja elinympäristöarvioita. Nämä toiminnot vaativat hiljaisia, vähän iskeviä aluksia, jotka voivat lähestyä herkkiä elinympäristöjä häiritsemättä villieläimiä. Veneissä on oltava kameralaitteet, GPS transektikartoitusta varten sekä näytteenottovälineet veden ja sedimentin keräämistä varten. Matala herätys ja minimaalinen moottorin melu ovat kriittisiä käyttäytymishavaintotutkimuksissa.
      features:
        - Hiljainen 4-tahtinen perämoottori — minimaalinen häirintä merieläimistölle
        - Vakaa tarkkailualusta valokuvaus- ja videodokumentointiin
        - Laitteiden kiinnitys kamerajärjestelmille, GPS-seuraajille ja kenttäkoneille
        - Matala syväys rannikon kosteikkojen, mangrovemetsien ja suistojen saavuttamiseen
        - Helppopuhdistuvat kansi- ja putkipinnat puhdistukseen kohteiden välillä
    - title: Veden laadun valvonta ja testaus
      subtitle: Säännölliset näytteenottoajot, epäpuhtauksien seuranta, vaatimustenmukaisuuden seuranta
      description: Vedenlaadun seurantaorganisaatiot suorittavat säännöllisiä näytteenottoajoja rannikkoalueilla, satamissa ja sisävesiväylissä seuratakseen pilaantumistasoja, leväkukintoja ja ympäristömääräysten noudattamista. Nämä toiminnot tarvitsevat tehokkaita ja luotettavia veneitä toistuvia käyntejä varten kiinteillä näytteenottoasemilla. Aluksella on oltava näytteenottolaitteet, jäähdyttimet näytteiden säilytystä varten ja kenttätestausvälineet – kansi on helppo pestä näytteenottopaikkojen välillä ristikontaminaation estämiseksi.
      features:
        - Erillinen näytteenottoasema-alue jäähdytyslaatikolla ja laitesäilytystilalla
        - Kansi- ja putkipinnat, jotka on helppo puhdistaa kohteiden välillä
        - GPS-integraatio tarkkaan paluuseen kiinteisiin näytteenottokoordinaatteihin
        - Kompakti koko rajoitettujen vesiväylien ja kapeiden kanavien saavuttamiseen
        - Polttoainetehokas perämoottori kustannustehokkaisiin säännöllisiin näytteenottoajoihin
