timeline:
  - year: '2012'
    title: Merivalmistuksen perusta
    body: Aquafarer aloitti erikoistuneena puhallettavien vesikulkuneuvojen työpajana Qingdao, Kiinassa, ja se on sitoutunut merenkulun käsityötaitoon ja kumiveneiden valmistukseen. Alkuvaiheessa keskityttiin luotettavien puhallettavien tuotteiden rakentamiseen käytännön suunnittelukokemuksen ja valmistuskurin avulla.
  - year: '2015'
    title: Ensimmäinen vienti ja CE sertifiointi
    body: Alkuperäiset vientitilaukset saapuivat Japaniin ja Koreaan. CE-sertifikaatti saavutettiin ydintuotelinjoille, mikä merkitsi Aquafarer:n tuloa kansainvälisille markkinoille. Yritys alkoi palvella kaupallisia ja vapaa-ajan käyttäjiä Kiinan ulkopuolella.
  - year: '2018'
    title: Tehtaan laajennus
    body: Siirretty 12 000 m²:n tuotantotilaan. Lisätty RF-hitsauslinjoja ja pudotusommeltuotantokapasiteettia, mikä mahdollistaa suuremman mittakaavan valmistuksen ja paremmat laadunvalvontajärjestelmät.
  - year: '2020'
    title: T&K-keskus perustettu
    body: Avattiin oma T&K-keskus, jossa on PVC kangaslaboratorio, hydrodynaaminen testisäiliö ja CAD/FEA-simulaatiostudio. Tuotekehitys laajeni keskittymään kevyeen rakenteeseen, parempaan kestävyyteen ja käyttäjälähtöiseen suunnitteluun.
  - year: '2022'
    title: Sertifiointi ja globaali kasvu
    body: Saavutettu ISO 9001 sertifikaatti. Laajennettiin 14 T&K-insinööriin ja yli 200 työntekijään. Tuotteet saavuttivat asiakkaat kaikkialla Euroopassa, Amerikassa sekä Aasian ja Tyynenmeren alueella jakelijoiden ja OEM kumppanuuksien kautta.
  - year: '2024'
    title: Innovaatio & Design Studio
    body: Lanseerattiin täyden palvelun suunnittelu- ja innovaatiostudio räätälöityihin ODM-projekteihin, konseptista tuotantoon. Vahvistetut ammattikäyttöiset merisovellukset, mukaan lukien pelastus-, kaupalliset ja valtion tarjouskilpailut.
  - year: '2026'
    title: Vesitutkimuksen tulevaisuuden rakentaminen
    body: Nykyään Aquafarer jatkaa puhallettavien veneiden, SUP-järjestelmien ja räätälöityjen meriratkaisujen kehittämistä, jotka yhdistävät ihmiset ja organisaatiot maailman vesiin. Yli 50 maata palvellaan, 15 000 yksikköä vuodessa.
content_founding:
  tagline: Alku
  title: Syntynyt Waterfrontilla
  subtitle: 'Aquafarer alkoi rannikkopajassa vuonna Qingdao yhdellä veneellä ja visiolla: rakentaa puhallettavia vesikulkuneuvoja, jotka selviävät todellisista meriolosuhteista.'
  paragraphs:
    - Vuonna 2012 perustajamme näkivät aukon markkinoilla – useimmat kumiveneet olivat joko edullisia mutta epäluotettavia tai korkealaatuisia, mutta kohtuuttoman kalliita. He uskoivat, että oli tilaa valmistajalle, joka tarjosi sekä laatua että arvoa.
    - Ensimmäinen runko rakennettiin käsin, testattiin paikallisilla vesillä ja jalostettiin kalastajien ja pienten kaupallisten toimijoiden todellisen palautteen perusteella. Tämä palautesilmukka – rakenna, testaa, kuuntele, paranna – on edelleen suunnittelufilosofiamme ytimessä tänään.
    - Vuoteen 2015 mennessä sana oli levinnyt Qingdao:n ulkopuolelle. Kansainväliset jakelijat alkoivat pyytää näytteitä. Paikallisesta työpajasta oli tulossa globaali toimittaja.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarerin varhainen tuotantopaja ja valmistus
content_growth:
  tagline: Kasvu ja innovaatiot
  title: Työpajasta 12 000 m²:n tilaan
  subtitle: Jatkuvat investoinnit ihmisiin, laitteisiin ja prosesseihin ovat muuttaneet Aquafarer nykyaikaiseksi laivojen tuotantolaitokseksi.
  paragraphs:
    - Kysynnän kasvaessa laitoksemme kasvoi. Laajensimme pienestä työpajasta 12 000 m²:n tehtaaksi, jossa on omat tuotantolinjat RIB veneille, puhallettaville veneille, SUP laudille ja tarvikkeille.
    - Investoimme CNC-leikkauskoneisiin, suurtaajuushitsauslaitteisiin, drop stitch-tuotantolinjoihin ja kattaviin testauslaitteisiin, joiden avulla pystymme valvomaan kaikkia tuotannon laadun näkökohtia.
    - Nykyään 200–300 hengen tiimiimme kuuluu meriinsinöörejä, materiaalitieteilijöitä, laadunvalvontaasiantuntijoita ja taitavia käsityöläisiä – joista monet ovat olleet Aquafarer:n palveluksessa alkuajoista lähtien.
founder:
  tagline: Tapaa perustaja
  title: Vesimiehen rakentama
  subtitle: Perustaja David Chen yhdistää valmistusosaamisen ja elinikäisen intohimon vesiurheiluun – yhdistelmä, joka määrittää, miten Aquafarer lähestyy tuotekehitystä.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-meeting-overseas.webp
    alt: David Chen — Aquafarerin perustaja
  story:
    - David Chen varttui Qingdao rannikolla, jossa meri ei ollut lomakohde vaan elämäntapa. Hän vietti nuoruutensa meloen, purjehtien ja kalastaen Keltaisellamerellä – kokemuksia, jotka antoivat hänelle intuitiivisen käsityksen siitä, mitä vesikulkuneuvojen on kestettävä.
    - Ennen vuoden Aquafarer perustamista David vietti vuosikymmenen laivateollisuudessa työskennellen tuotannon, laadun ja kansainvälisen kaupan parissa. Hän johti OEM ohjelmia eurooppalaisille ja pohjoisamerikkalaisille brändeille, oppien maailmanlaajuisten markkinoiden standardit ja odotukset omakohtaisesti.
    - 'Vuonna 2012 hän perusti yrityksen Aquafarer yksinkertaisella tehtävällä: rakentaa puhallettavia vesikulkuneuvoja, joihin hän luottaisi oman perheensä kanssa vesillä. Tuo henkilökohtainen standardi – käyttäisinkö tätä? — on viimeinen testi jokaiselle tehtaalta lähtevälle tuotteelle.'
    - Nykyään David johtaa tuotestrategiaa ja valvoo T&K-tiimiä, tarkastaen henkilökohtaisesti uusia malleja ja testaamalla prototyyppejä vesillä Qingdao. Hän uskoo, että upeat tuotteet syntyvät ymmärtämällä sekä suunnittelua että kokemusta.
philosophy:
  tagline: Brändifilosofia
  title: Engineering Freedom on Water
  body: Vapaus vedessä ei ole vain liikkumista. Se edustaa uusien paikkojen löytämistä, ulkoilmaelämysten luomista, ihmisten yhdistämistä luontoon ja ammattitehtävien mahdollistamista. Tekniikka mahdollistaa tämän vapauden.
  pillars:
    - title: Luotettavuus ensin
      body: Vesiympäristö vaatii luottamusta. Aquafarer tuotteet on suunniteltu vakauden, kestävyyden, turvallisuuden ja tasaisen suorituskyvyn ympärille.
    - title: Ihmiskeskeinen suunnittelu
      body: Tuotteiden tulee palvella ihmisiä, ei teknologiaa. Jokainen suunnittelupäätös alkaa ymmärtämällä, miten ihmiset käyttävät vesikulkuneuvoja, missä he tutkivat ja mitä haasteita he kohtaavat.
    - title: Esteetön tutkimus
      body: Vesi ei saa kuulua vain asiantuntijoille. Aquafarer luo laitteita, joiden avulla useammat ihmiset voivat kokea turvallisesti jokia, järviä, valtameriä ja rannikkoympäristöjä.
    - title: Jatkuva innovaatio
      body: Innovaatio ei ole vain uusien tuotteiden luomista. Se parantaa jokaista yksityiskohtaa – materiaaleja, rakenteita, valmistusta ja käyttökokemusta.
engineeringDna:
  tagline: Tekninen DNA
  title: Kuinka Aquafarer luo tuotteita
  areas:
    - title: Materiaalitiede
      body: Aquafarer keskittyy sopivien materiaalien valintaan erilaisiin meriympäristöihin. Keskeisiä näkökohtia ovat kulutuskestävyys, UV-kestävyys, paineenkestävyys ja pitkäaikainen kestävyys.
      items:
        - Kulutuskestävyys
        - UV-kestävyys
        - Paineen vakaus
        - Pitkäaikainen kestävyys
    - title: Rakennustekniikka
      body: Ilmatäytteiset vesikulkuneuvot vaativat tarkan tasapainon jäykkyyden, painon, kannettavuuden ja vakauden välillä. Aquafarer suunnittelu keskittyy näiden tekijöiden optimointiin drop-stitch-ydinteknologian ja edistyneen saumarakenteen avulla.
      items:
        - Jäykkyys
        - Painon optimointi
        - Siirrettävyys
        - Vakaus
    - title: Valmistuksen tarkkuus
      body: 'Jokainen tuote käy läpi kontrolloidut prosessit: materiaalin valmistelu, tarkkuusleikkaus, hitsaus ja liimaus, kokoonpano, laaduntarkastus ja suorituskyvyn tarkastus.'
      items:
        - Materiaalin valmistelu
        - Tarkkuusleikkaus
        - Hitsaus & Liimaus
        - Kokoonpano & QC
    - title: Käyttäjän skenaarion suunnittelu
      body: Tuotteet on kehitetty todellisten sovellusten ympärille – virkistys, seikkailu ja ammattikäyttö – varmistaen, että jokainen malli vastaa aiotun ympäristön erityisvaatimuksia.
      items:
        - Virkistys
        - Seikkailu
        - Ammattikäyttö
        - kaupallinen
trustSignals:
  tagline: Luottamussignaalit
  title: Miksi Aquafarer on luotettava kumppani?
  manufacturing:
    title: Valmistuskyky
    body: 12 000 m²:n tuotantolaitos, jossa on 200-300 ammattitaitoista työntekijää ja 14+ T&K-insinööriä. ISO 9001 sertifioitu laadunhallintajärjestelmä. Vuosituotanto 15 000 puhallettavaa vesikulkuneuvoyksikköä palvelee yli 50 maata.
    stats:
      - label: Tilan koko
        value: 12 000 m²
      - label: Työvoima
        value: 200-300
      - label: T&K-insinöörit
        value: 14+
      - label: Vuotuinen kapasiteetti
        value: 15 000
  quality:
    title: Laatuun sitoutuminen
    body: Materiaalitarkastuksesta lopputestaukseen Aquafarer ylläpitää systemaattisia laatuprosesseja toimittaakseen luotettavia merituotteita. Jokaiselle yksikölle suoritetaan painetestaus, saumatarkastus ja suorituskyvyn tarkastus ennen toimitusta.
    items:
      - CE Sertifioitu — 64 mallia täyttää eurooppalaiset turvallisuusstandardit
      - ISO 9001:2015 — Laadunhallintajärjestelmä sertifioitu
      - UKCA Merkitty — Yhdistyneen kuningaskunnan markkinoiden vaatimustenmukaisuus
  global:
    title: Globaali läsnäolo
    body: Aquafarer palvelee asiakkaita useilla maailmanlaajuisilla markkinoilla tukemalla jakelijoita, ulkoilubrändejä ja ammattikäyttäjiä yli 50 maassa Euroopassa, Aasian ja Tyynenmeren alueella, Amerikassa, Lähi-idässä ja Afrikassa.
