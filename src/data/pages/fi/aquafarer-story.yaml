  tagline: Meidän tarinamme
  title: Aquafarer — Insinööritaidon vapaus vedessä
  subtitle: 'Rannikkopajasta maailmanlaajuiseksi laivavalmistajaksi – matkamme perustuu itsepäiseen uskomukseen: vesikulkuneuvot tulee suunnitella niin kuin niillä on merkitystä, koska ne tekevät.'
  image:
