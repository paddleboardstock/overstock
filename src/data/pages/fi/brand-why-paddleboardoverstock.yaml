features3_reasons:
  tagline: Miksi valita Paddle Board Overstock
  title: 'Seitsemän syytä ryhtyä kumppaniksemme'
  isBeforeContent: false
  columns: 3
  items:
    - title: '1. Oikeaa valmistusta, ei kaupankäyntiä'
      description: 'Omistamme ja operoimme 12 000 m²:n tehtaan. Kun teet yhteistyötä Paddle Board Overstockin kanssa, työskentelet suoraan ihmisten kanssa, jotka suunnittelevat, kehittävät ja valmistavat tuotteesi — ilman välikäsiä.'
      icon: tabler:building-factory
    - title: '2. Insinöörilähtöinen lähestymistapa'
      description: 'Suunnitteluprosessimme alkaa käyttötarkoituksesta, ei tuotekategoriasta. Optimoimme rungon muodon, materiaalivalinnat ja kokoonpanon sen mukaan, miten venettä todella käytetään.'
      icon: tabler:engine
    - title: '3. Sertifioitu laatu'
      description: 'CE-sertifiointi, ISO-laadunhallintajärjestelmä, BSCI- ja REACH-vaatimustenmukaisuus, USCG-hyväksyntä. 64 CE-sertifioitua malliamme täyttää kansainväliset standardit — eivät vain lupauksia.'
      icon: tabler:certificate
    - title: '4. Joustava OEM/ODM'
      description: 'Putkien värit, konsolin layout, brändäys, pakkaus — räätälöimme vaatimustesi mukaan. Ei vähimmäistilauspainetta. Aloita prototyypistä ja laajenna luottavaisesti.'
      icon: tabler:adjustments
    - title: '5. Globaali logistiikka'
      description: 'Yhdysvaltain varasto Kaliforniassa, suoratoimitukset Qingdaosta, lentorahti kiireellisille tilauksille. Hoidamme tulliasiakirjat ja dokumentaation.'
      icon: tabler:truck-delivery
    - title: '6. Elinikäinen tuki'
      description: 'Tuemme veneitä, jotka rakensimme 20 vuotta sitten. Aitoja varaosia, teknistä neuvontaa, korjausohjeita — tiimimme on käytettävissäsi tarvitessasi.'
      icon: tabler:lifebuoy
    - title: '7. Rehelliset tekniset tiedot'
      description: 'Todelliset kuormitusarvot, todelliset mitat, todellinen paino. Ei markkinoinnin liioittelua. Mitä julkaisemme, sen saat — riippumattomien testien varmentamaa.'
      icon: tabler:ruler-measure
testimonials:
  tagline: Brändien luottama ympäri maailmaa
  title: Mitä kumppanimme sanovat
  items:
    - content: 'Olemme työskennelleet useiden kiinalaisten valmistajien kanssa, mutta Paddle Board Overstock erottuu insinöörituellaan ja tasaisella laadullaan. He kohtelevat brändiämme kuin omaansa.'
      name: '— OEM-kumppani, eurooppalainen vesiurheilubrändi'
    - content: 'Heidän Hypalon-RIB-veneensä ovat olleet käytössä laivastossamme yli 5 vuotta. Minimaalinen huolto, erinomainen UV-kestävyys. Putkien 5 vuoden takuu antaa meille luottamusta.'
      name: '— Laivaston operaattori, Lähi-idän lomakeskusryhmä'
    - content: 'Paddle Board Overstockin tiimi auttoi meitä kehittämään räätälöidyn SUP-laudan suunnittelun konseptista tuotantoon 90 päivässä. Laatu ylitti odotuksemme.'
      name: '— Jakelija, australialainen vesiurheilu'
cta:
  title: 'Valmiit kokemaan eron?'
  subtitle: 'Ota yhteyttä tiimimme kanssa keskustellaksesi projektistasi. Ei sitoumuksia — vain rehellisiä neuvoja valmistuksesta.'
  actions:
    - variant: primary
      text: Puhu tiimimme kanssa
      href: /contact
    - text: Lataa tuotekatalogi
