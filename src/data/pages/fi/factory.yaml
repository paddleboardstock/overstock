case_studies:
  tagline: OEM-projektit
  title: Brändi- ja OEM-kumppanuuksien tapaustutkimukset
  description: Konseptista konttiin — miten autamme globaaleja brändejä käynnistämään ja skaalaamaan täytettävien alusten tuotelinjojaan.
  labels:
    challenge: Haaste
    solution: Ratkaisu
    result: Tulos
  cards:
    - challenge: Eurooppalainen ulkoiluvälineitä myyvä vähittäiskauppias tarvitsi yksityisbrändätyn SUP-tuotelinjan ainutlaatuisilla kansigrafiikoilla, ympäristöystävällisellä PVC:llä ja myyntivalmiilla pakkauksilla — kaikki toimitettuna 60 päivässä.
      solution: Kehitimme räätälöidyt digitaaliset painotiedostot, hankimme REACH-yhteensopivaa PVC:tä ja lyhensimme näytteistyön 3 kierroksesta yhteen sijoittamalla suunnittelutiimin Qingdaon tehtaallemme.
      result: 55 päivää allekirjoitetusta tilauksesta FOB-toimitukseen. 2 400 yksikköä 4 SKU:n läpi. Uusintatilaus tehty ennen ensimmäisen kontin saapumista.
    - challenge: Yhdysvaltalainen vesiurheilualan startup tarvitsi suorituskykyisen drop-stitch-kajakin räätälöidyllä runkomuodolla, yhteisbrändätyllä pakkauksella ja BSCI-sertifioinnilla vähittäismyyntiin.
      solution: Muokkasimme olemassa olevaa drop-stitch-kajakin muottia muunnetulla rocker-profiililla, kehitimme yhteisbrändätyn pakkauksen grafiikan ja toimitimme täydellisen BSCI-auditointidokumentaation.
      result: Listautuminen onnistuneesti kolmeen suureen yhdysvaltalaiseen outdoor-ketjuun. Yli 5 000 yksikköä ensimmäisenä vuonna 98 %:n myyntiasteella.
    - challenge: Australialainen jakelija vaati CE-sertifioitua RIB-mallistoa räätälöidyillä putkien väreillä, Hypalon-päivitysvaihtoehdolla ja Australian standardin AS 1799 mukaisuudella.
      solution: Valmistimme esituotantonäytteet neljällä putkivärivaihtoehdolla, hankimme CSM Hypalonia japanilaiselta toimittajalta ja koordinoimme kolmannen osapuolen suorittamat AS 1799 -vaatimustestaukset.
      result: Kolmen mallin RIB-mallisto lanseerattiin AU/NZ-markkinoille. Sitä seurasi voitto julkisesta tarjouskilpailusta 12 partio-RIB:stä.
production_flow:
  tagline: Tuotantoprosessi
  title: Materiaalista valmiiksi veneeksi
  subtitle: Jokainen vene kulkee 6 tuotantovaiheen läpi, ja jokaisessa vaiheessa on QC-tarkastuspisteet. Ei oikoteitä, ei ohitettuja tarkastuksia.
  stages:
    - stage: '01'
      title: Materiaalin vastaanotto ja saapuvan laadunvalvonta
      description: Kaikki saapuvat materiaalit kirjataan eränumeroittain ERP-järjestelmäämme. PVC kangasrullat, pudotusommelsydämet, venttiilit, liimat ja laitteistot ovat karanteenissa QC:n allekirjoittamiseen asti.
      qc_check: Vetolujuus (ASTM D751), repäisylujuus (ISO 4674), paksuusmittari, liiman viskositeetti, visuaalisen vian skannaus
      qc_threshold: 100 % eristä testattu. Hylkää, jos vetolujuus < 90 % spesifikaatiosta, repeytys < spesifikaatiomin tai mikä tahansa visuaalinen vika
      responsibility: Tuleva laadunvalvontatiimi (3 tarkastajaa)
    - stage: '02'
      title: CNC-leikkaus ja materiaalien valmistelu
      description: Tietokoneella optimoitu sisäkkäisyys asettaa paneelit PVC varastolle jätteen minimoimiseksi. Automaattiset CNC-leikkauskoneet säilyttävät 0,1 mm:n paikannustarkkuuden.
      qc_check: Mittojen tarkistus CAD DXF -tiedostoja vastaan, reunan laadun tarkastus, paneelien määrän tarkistus
      qc_threshold: Joka 20. mittauspaneeli. Toleranssi ±0,5 mm. Hylkää erä, jos > 2 % toleranssin ulkopuolella
      responsibility: Leikkauspajan johtaja
    - stage: '03'
      title: Hitsaus ja pudotuspistoliimaus
      description: Drop-stitch-ytimet liimataan ulompiin PVC-laminaatteihin lämpölaminoinnilla. Putkikammiot ovat RF- tai kuumailmahitsattuja. Kiskon nauhat ovat kolmikerroksisia fuusioliitoksia.
      qc_check: Kuorintatesti 50 yksikön välein (ASTM D751), hitsin leveyden mittaus, kuuman ilman lämpötilan lokin tarkistus, visuaalinen sauman tarkastus taustavalossa
      qc_threshold: Kuorintalujuus min 8 N/cm. Hitsauksen leveyden toleranssi ±1 mm. Kaikki näkyvä kanavointi = hylkää
      responsibility: Hitsaus QC (2 tarkastajaa per vuoro)
    - stage: '04'
      title: Kokoonpano ja varustelu
      description: 'Veneet siirtyvät lopulliseen kokoonpanoon, jossa kaikki komponentit yhdistetään: runko + putket, venttiilit asennettu, D-renkaat, kahvat, evälaatikot ja kantolaukun kiinnitys. Jokainen yksikkö noudattaa 100 pisteen kokoonpanon tarkistuslistaa.'
      qc_check: 100 pisteen tarkistuslista yksikköä kohti, venttiilin toimintatesti (10 auki/kiinni sykliä), laitteiston vääntömomentin tarkistus, silmämääräinen tarkastus
      qc_threshold: 'Nollavikoja koskeva käytäntö turvallisuuden kannalta kriittisille kohteille (venttiilit, D-renkaat, kahvat). Pienet kosmeettiset tuotteet: AQL 2,5 (ISO 2859)'
      responsibility: Kokoonpanoryhmän johto + linja QC
    - stage: '05'
      title: Painetestaus ja laadunvarmistus
      description: Jokainen kammio täytetään 1,25-kertaiseen nimellispaineeseen (tyypillisesti 20–25 PSI) ja pidetään 24–48 tuntia. Paineanturit kirjautuvat jatkuvasti. Kammiot, joiden painehäviö ylittää 5 %, hylätään ja lähetetään sauman uudelleentarkastukseen.
      qc_check: 24 tunnin paineenpitoloki, anturin kalibrointi tarkistettu päivittäin, lämpötilakompensoitu painelukema, sauman uusintatesti korjauksen jälkeen
      qc_threshold: Max 5 % painehäviö 24 tunnin aikana vakaassa lämpötilassa. Tämän ylittävä kammio = 100 %:n uusintatesti koko tuotantoerästä
      responsibility: Laatulaboratorio (tuotannosta riippumaton, raportoi johdolle)
    - stage: '06'
      title: Lopputarkastus ja pakkaus
      description: Viimeinen visuaalinen ja toiminnallinen tarkastus. Pintaviat, värin yhtenäisyys, etiketin/BIN-tarkastus, pakkauksen eheys ja lisävarusteiden täydellisyys. Yksiköt on tyhjiöpakattu, laatikoitu ja lavattu konttien lastausta varten.
      qc_check: Täydellinen visuaalinen tarkastus, tarvikkeiden tarkistuslista SKU-kohtaisesti, pakkauksen pudotustesti (1 m, satunnaisnäyte), etiketin/viivakoodin skannaustarkastus
      qc_threshold: AQL 2,5 suurista vioista, AQL 4,0 vähäisistä vioista. Nollatoleranssi turvallisuusvirheille. 100 % yksiköistä silmämääräisesti tarkastettu
      responsibility: Lopullinen laadunvalvontatiimi (4 tarkastajaa) + pakkausryhmän johto
