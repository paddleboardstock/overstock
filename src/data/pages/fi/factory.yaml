material_traceability:
  tagline: Jäljitettävyys
  title: Materiaalin seuranta ja erän valvonta
  description: Jokaiselle raaka-aineerälle on määritetty yksilöllinen eränumero ERP-järjestelmässämme. Jokaisen veneen materiaaliluettelo linkittyy takaisin alkuperäiseen toimittajaerään saapumisesta tuotantoon ja valmiiseen tuotteeseen. Tämä mahdollistaa täyden jäljitettävyyden kaikissa laatu- tai vaatimustenmukaisuuskyselyissä.
  system: Mukautettu ERP (sisäinen järjestelmä) + fyysiset erätunnisteet jokaisessa työtilauksessa
  coverage: 100 % tuotantomateriaaleista — PVC, Hypalon, drop-stitch-kangas, liimat, venttiilit, laitteistot, pakkaukset
  records_retained: 10 vuotta (per CE 2013/53/EU vaatimus)
