qc_section:
  tagline: Laadunvalvonta
  title: Testaus- ja laadunvarmistusprosessi
  subtitle: Jokainen vene käy läpi pakollisen testauksen ennen lähetystä. Laatulaboratoriomme toimii riippumattomana tuotannosta ja raportoi suoraan johdolle.
  steps:
    - step: '1'
      title: Raaka-aineen tarkastus
      desc: PVC-, Hypalon- ja drop-stitch-kankaat käyvät läpi vetolujuustestauksen (ASTM D751), repeämän leviämisen ja UV-kestävyyden varmistuksen ennen kuin mikään erä menee tuotantoon.
    - step: '2'
      title: 48 tunnin ilmanpysyvyystesti
      desc: Jokainen putkikammio täytetään 125 %:iin nimellispaineesta ja pidetään 48 tuntia. Yli 5 %:n paineen lasku aiheuttaa automaattisen hylkäyksen ja sauman uudelleentarkastuksen.
    - step: '3'
      title: Kuorma- ja tasapainotestaus
      desc: Valmiit veneet kuormitetaan enimmäiskantavuuteen ja testataan vakauden, vapaan laidan ja käsiteltävyyden osalta. Jokainen alus vesitestataan ennen lopullista tarkastusta.
oem_section:
  tagline: OEM-projektit
  title: Brändi- ja OEM-kumppanuustapaustutkimukset
  subtitle: Konseptista konttiin — kuinka autamme maailmanlaajuisia brändejä lanseeraamaan ja skaalaamaan kumiveneiden tuotelinjojaan.
  cases:
    - challenge: Eurooppalainen ulkoilukauppias tarvitsi oman etiketin SUP-tuotelinjan ainutlaatuisella kansigrafiikalla, ympäristöystävällisellä PVC:llä ja vähittäismyyntivalmiilla pakkauksella — kaikki toimitettuna 60 päivässä.
      solution: Kehitimme r??t?l?idyt digitaalitulostustiedostot, hankimme REACH-yhteensopivan PVC:n ja tiivistimme näytteenoton 3 kierroksesta 1:een sijoittamalla suunnittelutiimin Qingdaon tehtaallemme.
      result: 55 päiviä allekirjoitetusta ostotilauksesta FOB:hen. 2 400 yksikköä 4 tuotekoodilla. Uusintatilaus tehtiin ennen ensimmäisen kontin saapumista.
    - challenge: Yhdysvaltalainen vesiliikuntastartup tarvitsi suorituskykyisen drop-stitch-kajakin r??t?l?idyllä rungon muodolla, yhteisbrändätyllä pakkauksella ja BSCI-sertifioinnilla vähittäismyyntiä varten.
      solution: Mukautimme olemassa olevaa drop-stitch-kajakkimuottia modifioidulla keulanprofiililla, kehitimme yhteisbrändätyn pakkausgrafiikan ja toimitimme täydellisen BSCI-auditointidokumentaation.
      result: Listattu onnistuneesti 3 suuressa yhdysvaltalaisessa ulkoiluketjussa. Yli 5 000 yksikköä ensimmäisenä vuonna 98 %:n myyntiläpäisyasteella.
    - challenge: Australialainen jakelija tarvitsi CE-sertifioidun RIB-venemalliston r??t?l?idyillä putkiväreillä, Hypalon-päivitysvaihtoehdolla ja Australian standardin AS 1799 vaatimustenmukaisuudella.
      solution: Tuotimme esituotantonäytteet 4 putkivärivaihtoehdolla, hankimme CSM-Hypalonin japanilaiselta toimittajalta ja koordinoimme kolmannen osapuolen AS 1799 -vaatimustenmukaisuustestauksen.
      result: 3-mallin RIB-mallisto lanseerattiin AU/NZ-markkinoilla. Seurasi valtion tarjousvoitto 12 partio-RIB-veneestä.
faq_section:
  tagline: UKK
  title: B2B- ja OEM-usein kysytyt kysymykset
  questions:
    - q: Mikä on vähimmäistilausmäärä (MOQ) OEM-kumisille SUP-laudoille?
      a: MOQ alkaa 5–10 yksiköstä vakio-OEM-malleille. Räätälöidyt muotit ja oman etiketin projektit vaativat vähintään 200 yksikköä riippuen monimutkaisuudesta. Koetilaukset ja näyte-erät ovat saatavilla uusille brändilanseerauksille.
    - q: Onko Aquafarerilla BSCI-sertifiointia
      a: Kyllä. Tehtaallamme on voimassa oleva BSCI-sosiaalinen vaatimustenmukaisuussertifiointi (auditointiraportti saatavilla pyynnöstä). Meillä on myös ISO 9001:2015 laadunhallinnalle, ja 64 tuotemalliamme on CE-sertifioitu (TÜV Rheinland). REACH- ja RoHS-vaatimustenmukaisuusdokumentaatio toimitetaan jokaisen OEM-toimituksen mukana.
    - q: Mikä on tyypillinen toimitusaika OEM-tilaukselle?
      a: Vakiotoimitusaika on 30–45 päiviä vahvistetusta ostotilauksesta ja käsirahasta. Räätälöityjen muottien kehitys lisää 15–20 päiviä työkalujen valmistukseen. Tarjoamme nopeutettua tuotantoa kiireellisille tilauksille ja sesonkikiireille ennen kesään (tammi°Cmaaliskuu).
    - q: Voitteko toimittaa FOB Qingdao tai CIF satamaamme?
      a: Kyllä. Toimitamme FOB Qingdao, CIF tärkeimpiin maailmansatamiin ja DDP päteville kumppaneille. Logistiikkatiimimme hoitaa konttivarauksen, vientidokumentaation ja tulliselvityksen. Toimitamme yli 50 maahan EU:n, USA:n, AU:n ja Aasian markkinoilla.
b2b_moq: 'Vakio-MOQ: 5–10 yksikköä per malli (SUP/kajakki/drop-stitch). RIB-MOQ: 2–5 yksikköä. Koetilaukset tervetulleita uusille kumppanuuksille.'
