hero:
  tagline: Tehdas
  title: Tehdas ja tuotanto
  subtitle: 12 000 m2 integroitua tuotantoa — raaka-aineesta valmiiseen veneeseen
intro:
  - Aquafarer Qingdao Manufacturing Hubin tehdasbrändinä Aquafarer hallitsee jokaista tuotannon vaihetta — raaka-PVC:n ja lasikuitumateriaalien saapumisesta valmiin veneen lopulliseen esitarkastukseen. Tuotantolaitoksemme Qingdaon talouskehitysalueella kattaa 12 000 neliömetriä ja sisältää erilliset työpajat PVC-leikkaukselle, putkien kuumasaumaukselle, lasikuituisten RIB-runkojen tuotannolle, SUP-digitaalipainatukselle, loppukokoonpanolle ja laaduntestaukselle.
  - Yhdistämällä suunnittelun, insinöörityön, prototyyppauksen, valmistuksen ja testauksen saman katon alle eliminoimme sopimusvalmistuksen tehottomuudet ja säilytämme suoran hallinnan rakennuslaadussa, materiaalivalinnassa ja toimitusaikatauluissa. Jokainen työpajaltamme lähtevä vene on rakennettu meidän ihmistemme toimesta, meidän laitteillamme, meidän standardeillamme.
