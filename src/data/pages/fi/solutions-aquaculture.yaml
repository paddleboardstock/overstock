content_challenge:
  tagline: Haaste
  title: Vesiviljely vaatii<br />suolaveden kestäviä laitteita
  subtitle: Kala-, helmi- ja valtameren karjatilat toimivat kemiallisesti aggressiivisimmassa meriympäristössä – pitkäaikainen altistuminen suolaiselle vedelle, polttoaine- ja rehujäämät ja jatkuva päivittäinen käyttö.
  paragraphs:
    - Vesiviljelytoiminnot pyörivät 365 päivää vuodessa alttiissa rannikko- ja avomeriympäristöissä. Häkkien tarkastukseen, rehun kuljettamiseen, helmilinjojen huoltoon ja laitteiden kunnossapitoon käytettävät työveneet altistuvat jatkuvasti suolavedelle ja UV-säteilylle sekä polttoaineiden, kalarehun ja antifouling-käsittelyjen aiheuttamille kemikaaleille.
    - '**Korroosio on päävihollinen** — Tavallinen merikäyttöön tarkoitettu kalusto kuluu näissä olosuhteissa nopeasti. Perämoottorit, perävaunujen rungot ja rungon kiinnikkeet vaativat jatkuvaa vaihtamista. Operaattorit tarvitsevat veneitä, jotka on rakennettu korroosiota kestävistä materiaaleista ja jotka kestävät vuosia tässä ympäristössä heikkenemättä.'
    - '**Päivittäinen luotettavuus on kriittistä** — Rikkoontunut työvene tarkoittaa pitämättä jääneitä ruokinta-aikatauluja, viivästyneitä sadonkorjuita ja kalliita tuotantotappioita. Helmiviljelyillä yksi pitämättä jäänyt tarkastuspäivä voi merkitä merkittäviä vahinkoja sadolle. Kalaviljelyillä viivästynyt ruokinta vaikuttaa kasvunopeuksiin ja kannattavuuteen.'
    - Aquafarerin vesiviljely-RIB:t on suunniteltu korroosiota kestävillä kiinnikkeillä, erittäin kestävillä Hypalon-putkilla ja lujitetuilla rungoilla, jotka on rakennettu erityisesti kalanviljelyn, helmiviljelyn ja avomeriviljelyn vaativiin olosuhteisiin.
content_solution:
  tagline: Ratkaisumme
  title: Tarkoitukseen rakennetut RIB:t<br />vesiviljelyteollisuudelle
  subtitle: Jokainen Aquafarer-vesiviljelytyövene on suunniteltu kestämään aggressiivisia suolaisen veden ympäristöjä samalla, kun se tarjoaa luotettavaa päivittäistä suorituskykyä.
  list:
    - Merikäyttöön tarkoitetut Hypalon-putket — ylivoimainen kestävyys UV-säteilyä, suolavettä, polttoaineita ja kalarehun kemikaaleja vastaan
    - Ruostumattoman 316-teräksen kiinnikkeet koko veneessä — ei ruostetta pitkäaikaisessa suolavesialtistuksessa
    - Vahvistetut hankauslistat ja kölisuoja toistuvaa laituri- ja häkkikontaktia varten
    - Itsestään tyhjenevä kansi helppoon pesuun ja valumiseen rehukuljetusten ja sadonkorjuutöiden jälkeen
    - Tasainen kansirakenne rehusäkkien, sadonkorjuualtaiden ja laitteiden kuljettamiseen
    - Perämoottorikonfiguraatiot 15–60 hv — optimoitu hyötykuorman ja polttoainetehokkuuden suhteen
    - Hyvän näkyvyyden putkivärivaihtoehdot helppoa havaitsemista varten suurilla viljelyalueilla
content_segments:
  tagline: Vesiviljelyprofiilit
  title: Työveneratkaisut<br />vesiviljelytyypin mukaan
  subtitle: Eri vesiviljelytoiminnoilla on erilaiset työvenevaatimukset – pienistä ketteristä RIB-alustasta kalahäkkien tarkastukseen, vakaaseen kuljetusalustaan helmenviljelyyn ja raskaisiin työveneisiin valtameriviljelyyn.
  items:
    - title: Kalanviljelytoiminnot
      subtitle: Häkkitarkastus, rehukuljetus, sadonkorjuutuki
      description: Meren kalanviljelylaitokset käyttävät häkkejä rannikko- ja offshore-alueilla. Työveneitä käytetään päivittäin häkkiverkkojen tarkastukseen, ruokintatoimintoihin, sadonkorjuun tukemiseen ja laitteiden huoltoon. Ensisijainen haaste on korroosio – veneet altistuvat jatkuvasti suolavedelle, kalanrehujäämille ja polttoaineelle. Luotettava työvene on välttämätön, koska ruokinnan väliin jääminen tai viivästynyt sadonkorjuu vaikuttavat suoraan tuotannon tuotantoon ja kannattavuuteen.
      features:
        - 'Vaativaan ympäristöön tarkoitettu paketti: ruostumattoman 316-teräksen kiinnikkeet, merikäyttöön soveltuvat seoskomponentit'
        - Tasainen kansiratkaisu rehusäkkien ja sadonkorjuualtaiden kuljetukseen
        - Itsestään tyhjenevä kansi helppoon huuhteluun työtehtävien jälkeen
        - Hypalon-putket kemikaaleja kestävällä pinnoitteella rehun ja polttoaineiden aiheuttamaan altistukseen
        - Vahvistetut hankauslistat usein toistuvaan häkki- ja laituriyhteyteen
    - title: Helmiviljelytoiminta
      subtitle: Vakaa kuljetus helmilinjan tarkastusta ja sadonkorjuuta varten
      description: Helmitilat tarvitsevat vakaat, luotettavat työveneet päivittäiseen helmilinjojen väliseen kuljetukseen, osteriverkkojen tarkastukseen ja sadonkeräykseen. Nämä toiminnot suoritetaan syrjäisillä rannikkoalueilla, joilla on rajoitettu kunnossapitoinfrastruktuuri. Veneen on oltava riittävän vakaa, jotta miehistö voi työskennellä tarkastellessaan helmiäimiä, ja siinä on oltava helppo nousta ja runsaasti kansitilaa korjattujen osterien, verkkojen ja tarvikkeiden kuljettamiseen. Luotettavuus ja helppo huolto ovat tärkeitä syrjäisillä maatiloilla.
      features:
        - Vakaa runkorakenne seisovalle miehistölle helmilinjojen tarkastuksessa
        - Tasainen kansi liukuestepinnalla miehistön turvallista liikkumista varten
        - Matala laidas helppoon pääsyyn osteriverkkoihin ja sadonkorjuuseen
        - Yksinkertainen perämoottorirakenne helppoa huoltoa varten paikan päällä
        - Korroosiota kestävä putki- ja kiinnikepaketti jatkuvaa suolavesialtistusta varten
    - title: Avomeriviljely ja meriympäristön parantaminen
      subtitle: Kalapoikasten kuljetus, häkkihuolto, seurantatuki
      description: Merenviljelytoimintaan kuuluu nuorten kaluston vapauttaminen hallittuihin meriympäristöihin, kasvun seuranta ja tehostamisrakenteiden huolto. Työveneiden on kuljetettava eläviä nuoria eläimiä ilmastetuissa säiliöissä, kuljetettava valvontalaitteita ja päästävä matalille rannikon päästöpaikoille. Rungon suunnittelussa on tasapainotettava kantavuus ja matala syväys rannalle ja suistoon pääsyä varten.
      features:
        - Kansitilaa ilmastoiduille kalapoikasten kuljetussäiliöille ja seurantavälineille
        - Matala syväys helppoon pääsyyn rantojen ja suistojen istutuspaikoille
        - Helppo rantautuminen — vahvistettu köli ja keulasuoja
        - Kiinnityspisteet seurantaelektroniikalle ja näytteenottovälineille
        - Erittäin kestävät Hypalon-putket, jotka kestävät hiekan ja meriveden sekoittumista
