process_steps:
  title: 6-vaiheinen OEM/ODM prosessi
  subtitle: Suunnittelutehtävästä Qingdaon FOB:iin — virtaviivaistettu työnkulku
  steps:
    - number: '01'
      title: Suunnitteluohje & 3D CAD -mallinnus
      description: Jaa kohdespesifikaatiosi, viiteaineistosi tai konseptisi. Insinööritiimimme laatii yksityiskohtaisia CAD-piirustuksia ja 3D-mallinnuksia hyväksyntääsi varten.
      timeline: 3-5 päivää
    - number: '02'
      title: Materiaalin valinta ja kankaan testaus
      description: Valitse sotilastason PVC (0,9–1,2 mm), Hypalon CSM tai drop-stitch ytimeen perustuvista kankaista. Suoritamme vetolujuus-, pinnoitteen tarttuvuus- ja UV vakaustestit.
      timeline: 2-3 päivää
    - number: '03'
      title: Nopea prototypointi ja näytetuotanto
      description: Me CNC-kone muovaamme räätälöityjä muotteja ja tuotamme esituotannon näytteitä brändisi väreillä, logolla ja määritellyillä materiaaleilla. Näytteet lähetetään hyväksyttäväksi.
      timeline: 7-14 päivää
    - number: '04'
      title: 24–48 tunnin korkeapaineinen pidätesti
      description: Jokainen prototyyppi käy läpi tiukan paineenkestotestin 1,25-kertaisella nimellispainetta suuremmalla paineella. Saumojen irtoamiskokeita ja mittojen tarkistuksia suoritetaan.
      timeline: 1–2 päivää
    - number: '05'
      title: CE/ISO Laadunvalvonta & Pakkaminen
      description: 100-pisteen laatutarkistuslista. Jokainen yksikkö tarkastetaan ennen vähittäismyyntivalmiiseen pakkaukseen laittamista. CE vaatimustenmukaisuusvakuutus ja BSCI vaatimustenmukaisuusraportti sisältyvät.
      timeline: 2-3 päivää
    - number: '06'
      title: FOB Qingdao Lähetys ja Logistiikka
      description: Valmiit tuotteet lavatettuina, kutistekelmuun käärittyinä ja konttiin lastattuina Qingdaon satamassa. Täydelliset vientiasiakirjat, tulliselvitys ja reaaliaikainen seuranta.
      timeline: 7-14 päivää
