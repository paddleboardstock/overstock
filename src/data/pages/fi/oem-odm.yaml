faq:
  title: OEM/ODM — Usein Kysytyt Kysymykset
  questions:
    - q: Mikä on mukautettujen ilmalla täytettävien SUPs minimimäärä (MOQ)?
      a: Vakio malleille, joilla on olemassa olevat muotit, MOQ alkaa 5–10 yksiköstä per malli. Täysin räätälöityjen muottien ja työkalujen osalta MOQ on tyypillisesti 200 yksikköä. Teemme yhteistyötä startupien ja nousevien brändien kanssa löytääksemme toteuttamiskelpoisia sisäänpääsypisteitä.
    - q: Mikä on mukautettujen RIB-veneiden MOQ?
      a: RIB-mallit alkavat 2–5 yksiköstä per malli olemassa olevien muottien kanssa, kun taas täysin räätälöidyt RIB-muotit vaativat suurempia sitoumuksia. Teemme yhteistyötä startupien ja vakiintuneiden brändien kanssa löytääksemme toteuttamiskelpoisia lähtöpisteitä.
    - q: Kuinka kauan OEM näytteen käsittely kestää?
      a: Vakio prototyyppinäytteet valmistuvat 7–14 työpäivän kuluessa suunnittelun hyväksymisestä. Pikatoimitukset voidaan priorisoida 5–7 päivään lisämaksusta.
    - q: Mikä on ero PVC ja Hypalon välillä ilmatäytteisissä veneissä?
      a: PVC on kevyempi, edullisempi ja tarjoaa erinomaisen kylmän sään joustavuuden. Hypalon (CSM) tarjoaa paremman UV- ja otsoninkestävyyden pidemmällä käyttöiällä (10–15 vuotta vs 5–8 vuotta). Suosittelemme PVC useimpiin vapaa-ajan sovelluksiin ja Hypalon kaupalliseen/professionaaliseen käyttöön.
    - q: Voitko mukauttaa ilmapatjan muodon ja suunnittelun?
      a: Kyllä. Tutkimus- ja kehitystiimimme voi kehittää räätälöityjä muotteja mihin tahansa runkomuotoon, laudansuunnitteluun tai putkikokoonpanoon. Käytämme CNC-koneistettuja alumiinimuotteja tarkkuuden ja johdonmukaisuuden takaamiseksi.
    - q: Tarjoatteko tehdastarkastuspalveluja?
      a: Tervetuloa paikan päällä tehtäviin ja kolmansien osapuolten tehtaiden auditointeihin 12 000 m²:n Qingdaon laitoksessamme. Meillä on ISO 9001- ja BSCI-sertifikaatit, ja voimme jakaa auditointiraportteja NDA:n nojalla.
    - q: Mitä toimitusehtoja tarjoatte?
      a: Tarjoamme FOB Qingdao (vakio), CIF- ja DDP-toimitusehdot. Konttien lastaus ja täydelliset vientiasiakirjat sisältyvät kaikkiin OEM tilauksiin.
content_profiles:
  tagline: Brändiprofiilit
  title: OEM / Yksityismerkkivalmistus<br /> Asiakastyypin mukaan
  subtitle: Eri brändiprofiilit tuovat mukanaan erilaisia vaatimuksia — räätälöimme OEM/ODM -palvelumme vastaamaan liiketoimintamalliasi, mittakaavaasi ja markkinoillemenostrategiaasi.
  items:
    - title: Uudet vesikulkuneuvomerkit
      subtitle: Matala MOQ, nopea nousu
      description: Yrittäjät ja perustajat, jotka lanseeraavat ensimmäisen sarjansa RIB-veneitä, SUPs tai kumiveneitä. Tarvitset valmistuskumppanin, joka kohtelee brändiäsi kuin omaansa — matalilla aloituskynnyksillä, joustavilla eräkokoilla ja käytännönläheisellä suunnitteluohjauksella koko prosessin ajan.
      features:
        - MOQ niin vähän kuin 2–5 yksikköä (RIB) / 5–10 yksikköä (SUP) per SKU
        - Ennakkoluotu muottikirjasto työkalukustannusten välttämiseksi
        - 'Täydellinen brändäyspaketti: logo, putkigrafiikat, pakkaus, ripustettavat tunnisteet'
        - Näyte-ensimmäinen työnkulku — hyväksy ennen tuotantoa
    - title: Vakiintuneet merimerkit
      subtitle: OEM skaala CE/ISO noudattamisen kanssa
      description: Nykyiset vene-, PWC- tai meritarvikebrändit lisäämässä täytettäviä vesikulkuneuvoja tuotevalikoimaansa. Tarvitset johdonmukaisen laadun tuotantosarjojen välillä, säädösten noudattamisen globaalille markkinoille ja kyvyn yhteissuunnitella räätälöityjä runkoja tai putkimuotoja.
      features:
        - Räätälöity 3D-muottisuunnittelu omia malleja varten
        - CE 2013/53/EU, UKCA, USCG vaatimustenmukaisuuden asiakirjat
        - BSCI sosiaaliset tarkastusraportit jälleenmyyjän vaatimustenmukaisuudesta
        - Omistettu tilinhallinta + ensisijaiset tuotantoaikapaikat
    - title: DTC- ja verkkokauppabrändit
      subtitle: Vähittäismyyntikelpoinen pakkaus laajassa mittakaavassa
      description: Verkkopainotteiset brändit, jotka myyvät Amazonin, Shopifyn tai omien verkkokauppojensa kautta. Pakkaus, tuotteen purku kokemus ja yhdenmukainen yksikkölaatu ovat kriittisiä. Tarvitset tehtaan, joka ymmärtää verkkokaupan nopeuden ja palautusasteen dynamiikan.
      features:
        - Vähittäiskauppavalmis laatikkosuunnittelu + kortin lisääminen painettuna
        - Tyhjiöpakkaus / lavastus kustannustehokasta lähettämistä varten
        - EAN / UPC viivakoodi ja tullivalmiit asiakirjat
        - Sekoitettujen konttien yhdistäminen maahantuontikustannusten optimoimiseksi
    - title: Vuokraus- ja vieraanvaraisuusoperaattorit
      subtitle: Laivastotason rakennukset lomakeskuksille ja vuokrausyrityksille
      description: Kohteet, vesihiihtokeskukset ja vuokrausyritykset tarvitsevat kestäviä, huollettavia ajoneuvokantoja, joissa on yhtenäinen brändi. Tarjoamme ajoneuvokantahinnat, sekamalliset kontit ja varaosatuki vuosien käyttöä varten.
      features:
        - Laivaston hinnoittelu sekamallisten konttitilausten osalta
        - Kestäviä kaupallisen luokan putki- ja tasovaihtoehtoja
        - Varaosakotelot ja huoltotekninen koulutus
        - Yhtenäinen brändäys SUP:ssä, RIB:ssä ja kajakkilaivastossa
