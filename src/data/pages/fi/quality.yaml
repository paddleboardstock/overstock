tests:
  - title: Painetestaus
    standard: ISO 6185-1 | Sisäiset tiedot AF-PT-001
    description: Ilmatäytteiset kammiot paineistetaan 1,25 kertaa suositeltuun käyttörajaan ja niitä pidetään 30 minuuttia. Paineen aleneminen mitataan materiaalien ja saumojen ilmatiiviyden ja rakenteellisen eheyden vahvistamiseksi.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pressure-testing.webp
  - title: Vaikutustestaus
    standard: Sisäiset tiedot AF-IT-002
    description: Tuotteisiin kohdistuu standardoitujen pudotuspainojen ja heilurilaitteiden hallittuja iskuja. Tämä arvioi puhkaisun kestävyyden, repeytymisen etenemisen ja rakenteellisen kestävyyden törmäyksiä vastaan ​​esteiden, telakoiden ja roskien kanssa.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
  - title: UV-kestävyystestaus
    standard: ASTM G154 | ISO 4892-3
    description: Materiaalinäytteet altistetaan UVA-340-lampuille kiihdytetyissä sääkammioissa yli 1000 tunnin ajan. Mittaamme värinmuutosta (Delta E), kiillon säilymistä ja vetolujuuden menetystä UV-stabilisaattoripakkausten validoimiseksi.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
  - title: Kulutuskestävyystestaus
    standard: ASTM D751 (Taber) | ISO 5470-1
    description: Materiaalinäytteet altistetaan CS-10-hiomapyörille 500 g/1 000 g kuormituksella 1 000 syklin ajan. Massahäviö ja visuaalinen kulumisluokitus määrittävät pinnoitteen kestävyyden hiekkaa, soraa ja toistuvaa laukaisua vastaan.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-pvc-material-testing.webp
  - title: Suorituskykytestaus matalassa lämpötilassa
    standard: Sisäiset tiedot AF-LT-003 | MIL-STD-810G
    description: Kokoonpantuja tuotteita ja materiaalikuponkeja käsitellään -20 °C:ssa, -10 °C:ssa ja 0 °C:ssa 24 tunnin ajan, minkä jälkeen ne joustotestataan. Varmistamme, että PVC ja Hypalon pysyvät joustavina ilman halkeilua tai delaminaatiota.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-exterior.webp
  - title: Kelluvuuden ja kuormituskyvyn testaus
    standard: ISO 6185-1 | ISO 12402
    description: Tuotteita ladataan asteittain 1,25-kertaiseen nimelliskapasiteettiin valvotussa poolissa. Varalaita, vakaus ja itsestään tyhjenevä suorituskyky kirjataan. Jokaisen mallin nimelliskapasiteetti on matemaattisesti ja empiirisesti varmennettu.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-stock-boat-inventory.webp
  - title: Ohjattavuuden testaus
    standard: Sisäiset tiedot AF-MT-004
    description: Vesikokeet mittaavat kääntösäteen, kiihtyvyyden, höyläysajan ja melan/moottorin vasteen erilaisissa kuormitusolosuhteissa. Tosimaailman käsittelyominaisuudet validoidaan suunnittelutavoitteisiin nähden.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-dolphin-wave-1.webp
  - title: Vesitiiviystestaus
    standard: ISO 6185-1 §7.3 | Sisäiset tiedot AF-WT-005
    description: Jokainen koottu tuote on suihkutestattu 0,5 baarin paineessa kaikki saumat, venttiilit ja liittimet. 5 minuutin paineistettu upotustesti vahvistaa kammion ja venttiilin vesitiiviyden. Nollavuotostandardi ennen toimitusta.
    image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department-2.webp
