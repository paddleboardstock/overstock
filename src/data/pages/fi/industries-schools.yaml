benefits:
  - title: Rakennettu päivittäistä opetusta varten
    description: Paksumpi PVC ja vahvistetut kiskot kestävät päivittäistä opiskelijoiden käyttöä, putoamista hiekalle ja kivisiä laskuja.
    icon: tabler:shield
  - title: Vakaat oppimisalustat
    description: Leveämmät rungot ja litteämmät rokkarit antavat aloittelijalle itseluottamusta. Ohjaajat keskittyvät opetukseen, eivät välineisiin.
    icon: tabler:scale
  - title: Helppo varastointi ja kuljetus
    description: Ilmatäytteiset designliikkeet pienissä tiloissa. Tyhjennetyt taulut sopivat tavallisiin ajoneuvojen tavaratilaan liikkuvaa opetusta varten.
    icon: tabler:box-seam
  - title: Mukautettu brändäys
    description: Koulun logot ja värit jokaisella taululla. Brändisi, identiteettisi – ei yleisiä vuokravarusteita.
    icon: tabler:brush
content_segments:
  tagline: Koulun profiilit
  title: Vesiurheilukoulutusratkaisut<br />Ohjelmatyypin mukaan
  subtitle: Paddle-koulut, surffausakatemiat, yliopisto-ohjelmat ja franchising-operaattorit kohtaavat erilaisia toiminnallisia haasteita – opetussuunnitelmien integroinnista useiden toimipisteiden kaluston standardointiin. Konfiguroimme laitepaketit koulutusmallin mukaan.
  items:
    - title: Riippumattomat SUP- ja kajakkikoulut
      subtitle: Omistajan ylläpitämät koulutuskeskukset
      description: Pienet ja keskikokoiset koulut, joita ylläpitävät omistajaohjaajat ja jotka tarjoavat SUP-tunteja, kajakkikoulutusta ja sertifiointikursseja. Laitteiden tulee olla riittävän kestäviä päivittäiseen opetuskäyttöön, kohtuuhintaisia pienyrityksen budjetilla ja riittävän monipuolisia palvelemaan aloittelijoita keskitason opiskelijoihin yhdessä laivastossa.
      features:
        - Vakaat monikäyttöiset SUP-laudat ja virkistyskajakit aloittelijatunneille
        - Ohjaajille tarkoitetut laudat lisävakaudella vesiohjaukseen
        - Tuntisuunnitelmapohjat ja taitotason kehitysoppaat sisältyvät
        - Vuotuinen välineiden uusintaohjelma vaihtohyvityksillä
    - title: Yliopistojen ja korkeakoulujen virkistysohjelmat
      subtitle: Laajat opiskelijoiden vapaa-ajan laivastot
      description: Yliopistojen virkistysosastot, jotka järjestävät melontakerhoja, vuokraohjelmia ja opetuskursseja osana kampuksen virkistystarjontaa. Laitteet ovat kovassa käytössä lukukausien aikana, vaativat helppoja sisään-/uloskirjautumisjärjestelmiä, ja niiden on kestettävä erilaisia taitotasoja ensikertalaisista edistyneisiin melontajiin.
      features:
        - Korkean kestävyyden PVC-rakenne luokiteltu oppilaitoskäyttösykleihin
        - Värikoodatut kalustot taitotason mukaan helppoa hallintaa varten
        - Yhteensopivuus RFID- tai tarrapeusteisten varastoseurantajärjestelmien kanssa
        - Tukkuhinnat lukukausiperusteisilla tilauksilla ja maksuehdoilla
    - title: Surffauskoulut ja surffausakatemiat
      subtitle: Rannikkosurffauksen opetusohjelmat
      description: Surffauskoulut, joissa opetetaan SUP-surffausta, makuumeloa ja surffauskajakkitaitoja valtameriympäristöissä. Laitteiden tulee kestää surffausalueen olosuhteet – iskunkestävyys, hiekan ja suolaveden sieto sekä helppo huuhtelu- ja palautuskierto tuntituntien välillä.
      features:
        - Surfaukseen suunnitellut muodot vahvistetuilla reunoilla ja iskunkestävällä rakenteella
        - Pehmeiden evien ja kierreleashien vaihtoehdot oppilaiden turvallisuudeksi
        - Nopeasti huuhteltava kangas, joka kuivuu tuntivuorojen välissä
        - Kaluston vaihto-ohjelma kaudenlopun tarkastuksella ja uudistuksella
    - title: Franchising- ja monipaikkaketjut
      subtitle: Standardoidut laitteet eri paikoissa
      description: Usealla toimipaikalla toimivat operaattorit, jotka suorittavat standardoituja koulutusohjelmia useissa kaupungeissa tai alueilla. Laivaston johdonmukaisuus eri paikoissa on ensiarvoisen tärkeää – jokaisella opiskelijalla tulee olla sama laitekokemus riippumatta siitä, missä franchising-alueella hän vierailee. Keskitetty tilaus, tuotemerkkien yhtenäisyys ja skaalaustuki ovat tärkeitä.
      features:
        - Identtiset kalustomääritykset kaikissa franchise-toimipisteissä
        - Keskitetyt yhdistetyt tilaukset volyymihinnoin
        - 'Yhteisbrändäysvaihtoehdot: franchisemerkki + Aquafarer-yhteisbrändäys'
        - 'Uuden toimipisteen aloituspaketti: välineet, kyltit ja avausvarasto'
