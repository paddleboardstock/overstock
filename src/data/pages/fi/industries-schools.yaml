hero:
  tagline: Vesiurheilukoulut ja koulutuskeskukset
  title: Varustusratkaisut<br />SUP- ja kajakkikouluille
  subtitle: Luotettavat kaupalliset laitteet melakouluihin, surffausopetukseen, kajakkikoulutukseen ja vesiurheilukoulutusohjelmiin missä tahansa mittakaavassa.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP-laudat kouluihin ja koulutuskeskuksiin
direct_answer: Aquafarer toimittaa SUP- ja kajakkikouluille maailmanlaajuisesti kaupallisia lautoja, turvavarusteita ja ohjaajapaketteja. Laitteemme on suunniteltu päivittäiseen opetuskäyttöön – paksumpi PVC, vahvistetut drop-stitch-ytimet ja vakaa runkorakenne, joka antaa aloittelijoille luottamusta ja ohjaajien luotettavuutta. Paketit sisältävät mukautetun tuotemerkin, varaosaohjelmia ja koulutusresursseja.
