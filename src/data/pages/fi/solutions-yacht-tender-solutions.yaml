content_challenge:
  tagline: Haaste
  title: Jahtitenderit vaativat<br />suorituskykyä ja tyylikkyyttä
  subtitle: Jahtitender on enemmän kuin apuvene — se on emäaluksen jatke ja laadun ilmentymä.
  paragraphs:
    - Huviveneiden omistajat ja kapteenit tarvitsevat tarjouksia, jotka toimivat hyvin, säilytetään tiiviisti ja esitellään kauniisti. Tarjouksen tulee täydentää jahdin estetiikkaa ja tarjota luotettavaa kuljetusta vieraille ja miehistölle.
    - '**Säilytys on kriittistä** — Tarjouksen tulee mahtua kannelle, autotalliin tai taaveteille. Painolla on väliä laukaisu- ja palautusjärjestelmissä. Paddle Board Overstock RIB:t tarjoavat erinomaiset teho-painosuhteet pienikokoisilla säilytysprofiileilla.'
    - '**Suorituskykyodotukset ovat korkeat** — Vieraat odottavat sujuvaa ja kuivaa ajoa, kun heidät siirretään rantaan. Moottorivaihtoehtojen on tasapainotettava nopeutta, kantamaa ja melutasoa ensiluokkaisen kokemuksen saavuttamiseksi. Tilauslentoja varten tarjouskilpailu järjestetään päivittäin ja sen on kestettävä toistuvaa käyttöä.'
    - '**Ulkomuodolla on väliä** — Yhteensopimaton tai kulunut tarjous heikentää jahdin yleistä esittelyä. Mukautetut putken värit, verhoilu ja brändäys varmistavat, että tarjous näyttää kuuluvalta.'
content_solution:
  tagline: Ratkaisumme
  title: Tarjouskokoonpanot<br />jokaiseen huvivenesovellukseen
  subtitle: Paddle Board Overstock RIB tarjoukset voidaan räätälöidä vastaamaan alustasi, toimintatyyppiäsi ja varastointivaatimuksiasi – superjahtien rakentajien teknisistä tiedoista charter-laivastoohjelmiin.
  list:
    - Mukautetut putkien värit, jotka sopivat yhteen tai täydentävät emoastiaa – mikä tahansa RAL-väri saatavilla Hypalon tai PVC putkille
    - Mukautettu verhoilu ja ompeleet – ensiluokkainen merivinyyli, jossa värisovitus ja logokirjonta
    - Konsoli- tai ohjauspyöräohjaus – valitse käyttötavan ja kuljettajan mieltymysten perusteella
    - Lasikuiturunko deep-V tasaiseen, kuivaan ajoon vaihtelevissa meriolosuhteissa
    - Kompakti säilytystila – tyhjennys tai pesii kansitalliin, kaappiin tai taavettivarastointiin
    - Hypalon putket UV-kestävyyttä ja pitkäaikaista ulkonäön säilyttämistä varten
    - Nostopisteet ja vetorenkaat vakiona kaikissa malleissa
    - Valinnainen jousisuojus, täysi kansi ja suojaavat hankaussuojat
    - 'Moottorialue: 15 HP - 60 HP — perämoottori- tai ohjausaisakokoonpanot'
    - OEM/yksityinen merkintä saatavilla huviveneen rakentajille ja laivakauppiaille
content_segments:
  tagline: Asiakasprofiilit
  title: Huvitarjousratkaisut<br />Asiakastyypin mukaan
  subtitle: Eri huviveneteollisuuden segmenteillä on ainutlaatuiset vaatimukset. Paddle Board Overstock määrittää tarjoukset vastaamaan jokaista sovellusta.
  items:
    - title: Superjahtien rakentajat
      subtitle: OEM tarjousintegrointi – mukautetut mitat, värit ja materiaalit
      description: 'Jahtien rakentajat kohtaavat toistuvan haasteen: jokaisella uudella aluksella on ainutlaatuiset mittarajoitukset, painorajoitukset ja esteettiset odotukset. Tarjouksen tulee integroitua täydellisesti emoaluksen taavettijärjestelmään, sopia autotallin tarkkoihin mittoihin ja vastata usean miljoonan euron jahdin suunnittelukieltä. Kaikki epäsuhta - väärä putken väri, väärä nostopisteen sijoitus, yhteensopimaton paino - viivästyttää toimitusta ja heijastuu huonosti rakentajaan. Paddle Board Overstock työskentelee suoraan rakentajien hankinta- ja suunnittelutiimien kanssa toimittaakseen tarjoukset mukautetuilla RAL-putkien väreillä, yhteensopivalla verhoilulla, merkkikonsolipaneeleilla ja täydellisillä OEM dokumentaatiopaketeilla.'
      features:
        - Mukautetut mittatiedot, jotka vastaavat autotalli- ja taavettirajoituksia
        - Mikä tahansa RAL-putkien väri ja vastaava verhoilu – mallihyväksyntänäytteet toimitetaan
        - OEM brändäys konsolissa, putkessa ja selkänojassa
        - Nostopisteen ja taavetin sovituksen validointi jokaiselle mallille
        - Rungon paino on optimoitu tiettyjä laukaisu- ja palautusjärjestelmiä varten
        - Joukkotoimituksen ajoitus tuotantoaikataulujen mukaisesti
    - title: Yacht Management Companyt
      subtitle: Laivaston standardisoidut tarjouskilpailut – maailmanlaajuinen tuki, minimaaliset seisokit
      description: Hallinnointiyhtiöt valvovat useita Välimerellä, Karibialla, Etelä-Tyynenmerellä ja muualla liikennöiviä jahteja. Niiden keskeinen tarve on luotettavuus – rikkinäinen tarjous etäsatamassa tarkoittaa miehistön ylitöitä, vieraiden valituksia ja kalliita viime hetken vaihtoja. Standardoidut laivaston tekniset tiedot vähentävät miehistön koulutusaikaa aluksissa ja yksinkertaistavat varaosien hallintaa. Paddle Board Overstock tarjoaa usean aluksen laivaston hinnoittelun, johdonmukaiset tekniset tiedot eri tilauksissa ja maailmanlaajuisen varaosatuen hallinnointiyrityksille, joilla on aluksia useilla alueilla.
      features:
        - Standardoidut tekniset tiedot koko hallittavalle kalustolle
        - Vaihdettavat varaosat kaikissa kalustotarjouksissa
        - Laivaston hinnoittelu ja volyymialennukset usean yksikön tilauksille
        - Varaosien saatavuus maailmanlaajuisesti – nopea toimitus mihin tahansa satamaan
        - Yhdenmukainen huolto- ja huoltodokumentaatio miehistölle
        - Monen yksikön toimituskoordinointi eri aluspaikkoihin
    - title: Yacht Charter -operaattorit
      subtitle: Päivittäiset suuret taajuudet - kestävyys ulkonäöstä tinkimättä
      description: 'Tilaushuutokaupat kohtaavat jahtiteollisuuden rankaisimman toimintasuunnitelman: päivittäiset vieraskuljetukset, maamatkat, vesiurheilun tuki ja satamakilpailut – usein yli 200 operaatiota per charter-kausi. Tarjouksen tulee näyttää turmeltumattomalta jokaisessa vieraan luovutuksessa, samalla kun se kestää jatkuvan nousemisen, suolaveden altistuksen ja moottoritunnit. Ulkonäön huononeminen on suora liiketoiminnallinen huolenaihe – kulunut tarjous vaikuttaa asiakkaiden arvosteluihin ja charter-hintoihin. Paddle Board Overstock konfiguroi tilauskilpailut päivitetyillä verhoiluilla, raskailla Hypalon putkilla ja vahvistetuilla käsittelyalueilla pitkäaikaisen kestävyyden takaamiseksi, joka säilyttää esityksen laadun.'
      features:
        - Raskaat Hypalon putket – 5-8 vuoden käyttöikä päivittäisessä tilauslentoliikenteessä
        - Vahvistetut kulkuportaat ja käsittelykööt toistuvaan käyttöön
        - Ensiluokkainen likaa hylkivä vinyyliverhoilu – helppo puhdistaa tilausten välillä
        - Helposti puhdistettavat liukumattomat kansipinnat
        - Luotettavat perämoottoripaketit, joissa on helppo pääsy huoltoon tiukan kierron takaamiseksi
        - Kosmeettiset materiaalit, jotka säilyttävät ulkonäön tilauskausien ajan
    - title: Huviveneiden jälleenmyyjät ja välittäjät
      subtitle: Luotettava tarjouskilpailu aluksen valmistumiseen ja jälleenmyyntiarvoon
      description: Jälleenmyyjät ja välittäjät tarvitsevat vakaan tarjonnan laadukkaita tarjouskilpailuja, jotka täydentävät heidän myymiään aluksia – vastaavat tuotemerkin asemointia ja parantavat ostajan kokemusta. Epäjohdonmukainen tarjous tai toimitusten viivästyminen voi viivästyttää jahdin luovutusta tai heikentää listan esittelyä. Jälleenmyyjät vaativat tasaista laatua eri erissä, luotettavia läpimenoaikoja ja kilpailukykyisiä hintoja säilyttääkseen katteet. Paddle Board Overstock tarjoaa jälleenmyyjien inventaario-ohjelmia, joissa on kausiluonteinen toimitusaikataulu, yhteisbrändäysvaihtoehdot esittelytilojen esittelyyn ja prioriteettijako sesongin aikana.
      features:
        - Varaston varastointiohjelmat saatavilla olevilla malleilla
        - Kausittainen toimitusaikataulu linjassa luovutuskalenterin kanssa
        - Jälleenmyyjän yhteisbrändäys konsolissa ja putkissa esittelytilaa varten
        - Tasainen laatu ja spesifikaatiot kaikissa erätilauksissa
        - Kilpailukykyinen jälleenmyyjähinnoittelu volyymiin perustuvalla tasolla
