        hypalon: Erinomainen (laaja kemikaalivalikoima)
section_testing:
  title: Testaus- ja turvallisuusprotokollat
  subtitle: Paddle Board Overstockin laadunvarmistuskehys jokaiselle tuotantoerälle
  protocols:
    - title: 1,25x nimellispaineen pitotesti
      description: Jokainen koottu astia täytetään 1,25-kertaiseksi sen nimelliskäyttöpaineeseen ja pidetään 24–48 tuntia. Kaikki yli 2 %:n painehäviöt laukaisevat hylkäämisen ja uudelleentyöskentelyn.
      standard: Iso 6185
    - title: Sauman kuoriutumislujuustesti
      description: Jokaisen tuotantoerän hitsaus- ja liimasaumanäytteiden kuoriutumislujuus testataan kalibroidulla kiristyslaitteistolla. Vähintään 4 kN/m kuoriutumisvastus vaaditaan.
      standard: Iso 2411
    - title: Kankaan vetokoe
      description: Saapuvat kangasrullat käyvät läpi vetolujuus- ja venymätestauksen sekä loimi- että kudesuunnassa. PVC:n hylkäyskynnys alle 3 000 N/5 cm.
      standard: Iso 1421
    - title: UV-kiihdytetty sää
      description: Materiaalinäytteet altistetaan yli 1 000 tunnin nopeutetulle UV-altistukselle QUV-testikammioissa. Suurin sallittu vetolujuuden menetys 15 %.
      standard: ASTM G154
    - title: Venttiilin ja liitoksen eheys
      description: Jokaisen venttiilikokoonpanon tiivisteen eheys testataan 1,25-kertaisella nimellispaineella. Takaisinvuotoventtiilien yksisuuntaisen tiivisteen suorituskyky on testattu.
      standard: Iso 12402
