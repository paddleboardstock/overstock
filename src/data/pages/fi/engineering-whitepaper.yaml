section_faq:
  title: Tekniset UKK
  questions:
    - q: Miten pudotusommel verrattuna perinteiseen kovakuoriseen rakenteeseen?
      a: Nykyaikaiset drop-stitch-ytimet 20 PSI:n paineella saavuttavat 85–90 % vastaavien EPS-vaahto-/lasikuitukuorien jäykkyydestä ja ovat täysin tyhjennettävissä kuljetusta varten. Kompromissi on hieman suurempi paino ja pienempi lopullinen jäykkyys - mutta useimmissa virkistys- ja kaupallisissa sovelluksissa ero on mitätön.
    - q: Mikä kierteiden tiheys katsotaan korkealaatuiseksi?
      a: Ensiluokkaisissa drop-stitch-kankaissa käytetään 2 lankaa neliötuumalla (noin 3 100 lankaa per m²), jotka on kudottu 1 680 DTEX-polyesterilangasta. Aloitustason kankaissa käytetään 1 lankaa neliömetriä kohden 1 100 DTEX-langalla.
    - q: Voiko Hypalonia hitsata kuten PVC:tä?
      a: Ei. Hypalonia/CSM:ää ei voi RF-hitsata. Se on koottava käsin levitettävällä kontaktisementillä, mikä tekee tuotannosta työvoimavaltaisemman ja saumat riippuvaisia käyttäjän taidoista. PVC voidaan hitsata RF- tai kuumailmahitsauksella tasaisen, automatisoidun saumanlaadun saavuttamiseksi.
    - q: Mikä on kumiveneiden suurin turvallinen paine?
      a: Tavalliset puhallettavat veneputket toimivat 8–12 PSI:n paineella. Droptitch-lattiat toimivat 12–20 PSI:n paineella. Korkeapaineiset drop-stitch-ytimet (SUP:t) voivat toimia 20–25 PSI:n paineella. Jokainen tuote sisältää paineenalennusventtiilit, jotka on kalibroitu estämään liiallinen täyttyminen.
    - q: Kuinka kauan mukautetun kumiveneen valmistaminen kestää?
      a: OEM-standardituotanto kestää 30–45 päivää tilausvahvistuksesta FOB Qingdaoon. Räätälöity muotin kehitys lisää 15–20 päivää prototyyppien tuotantoon ja testaukseen.
