hero:
  tagline: Tuotantokapasiteetti
  title: Tuotantokapasiteetti ja vuosituotanto
  subtitle: 12 000 m²:n tehdas tuottaa 15 000 venettä vuodessa ja kasvunvaraa

intro: Aquafarer hallinnoi yhtä Qingdaon, Kiinan suurimmista ilmastettavien veneiden valmistukseen erikoistuneista tehtaista. 12 000 m²:n tehtaamme on jaettu kuuteen erikoistuneeseen työpajaan, jotka toimivat rinnakkain, mikä antaa meille kapasiteettia tuottaa 15 000 venettä vuodessa SUP-, kajakki-, jolla-, RIB- ja turvavarustelinjoilla.

highlights:
  - value: 12,000 m²
    label: Kokonaistuotantopinta-ala
    detail: 6 erikoistuneessa työpajassa
  - value: 15,000
    label: Vuosittain valmistetut veneet
    detail: SUP:t, kajakit, RIB:t, jollat, turvavarusteet
  - value: 200-300
    label: Ammattitaitoinen henkilöstö
    detail: Yli 25 insinööriä, 2 vuoroa/päivä
  - value: 50+
    label: Vientimaat
    detail: EU, USA, AU, Lähi-itä, Aasia
  - value: 30–45
    label: Vakiotuotantoaika (päivää)
    detail: PO-vahvistuksesta FOB-tilaan
  - value: 10+
    label: Vuosia vientikokemusta
    detail: Vuodesta 2012

workshops:
  - title: SUP-lautatuotanto
    description: '4 rinnakkaista kokoonpanolinjaa ilmastettaville SUP-lautoille. Jokainen linja voi tuottaa 50–80 lautaa per vuoro. Digitaalipaino- ja silkkipainoasemat toimivat samanaikaisesti. Vuosittainen SUP-kapasiteetti: yli 8 000 lautaa.'
    output: 8 000+ SUP-lautaa/vuosi
  - title: RIB-venetuotanto
    description: 'Erillinen lasikuiturunkotyöpaja, jossa 6 muottiasemaa jopa 7,6 m RIB-runkoihin. Putkien hitsaus- ja kokoonpanoalue käsittelee 3–5 RIB:ää samanaikaisesti. Vuosittainen RIB-kapasiteetti: yli 2 000 venettä.'
    output: 2 000+ RIB-venettä/vuosi
  - title: Ilmastettava vene ja jolla
    description: 'Monikäyttöiset tuotantolinjat ilmastettaville veneille, kajakeille ja jollille. Kuuman ilman hitsausasemat, RF-dielektriset puristimet ja kokoonpanotyöasemat muokataan tilausmukaisesti. Vuosikapasiteetti: yli 5 000 yksikköä.'
    output: 5 000+ yksikköä/vuosi
  - title: Turvavarusteet
    description: 'Erillinen puhtashuonetuotantoalue pelastusliiveille ja turvavarusteille. Erillinen ompelu, vaahtolisäys ja testausasemat. Vuosittainen liivikapasiteetti: yli 50 000 yksikköä.'
    output: 'Yli 50 000 pelastusliiviä/vuosi'

oem_capacity:
  moq: 'SUP: 5–10 yksikköä | RIB: 2–5 yksikköä | Kajakki/jolla: 10–20 yksikköä | Räätälöity muotti: 200+ yksikköä'
  lead_time: 'Vakio 30–45 päivää. Näyte 15–20 päivää. Kiireellinen tuotanto mahdollinen.'
  payment: 'T/T 30% ennakko + 70% ennen toimitusta. L/C, Western Union hyväksytään.'
