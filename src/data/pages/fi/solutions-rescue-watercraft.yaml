content_challenge:
  tagline: Haaste
  title: Pelastusoperaatiot vaativat<br />kompromisseja sietämätöntä luotettavuutta
  subtitle: Etsintä- ja pelastusorganisaatiot toimivat äärimmäisen turvallisuusvastuun alaisina – jokaisella veneen epäonnistumisella on sietämättömät seuraukset.
  paragraphs:
    - Pelastusoperaatioissa onnistumisen ja epäonnistumisen välinen marginaali mitataan minuuteissa. Veneen on oltava valmis laskeutumaan välittömästi vesille, toimimaan ankarissa olosuhteissa ja palata turvallisesti matkustajien kanssa. Turvallisuusvastuu on ehdoton – mekaaninen vika pelastustehtävän aikana ei ole korjauskustannus, se on menetetty henki.
    - SAR veneet tarvitsevat suurta nopeutta saavuttaakseen uhrit nopeasti, yhdistettynä poikkeukselliseen vakauteen turvallisiin palautusoperaatioihin. Heillä on oltava pelastusvarusteita, lääkintätarvikkeita ja viestintävälineitä – usein rajoitetussa kansitilassa. Valtion palveluksessa toimivat veneet tarvitsevat myös pitkän käyttöiän (10-15+ vuotta) perustellakseen julkisten hankintojen budjetteja.
    - Näkyvyys sekä käyttäjälle että etsintöihin on kriittistä. Konsolin muotoilun on tarjottava 360 asteen näkyvyys, ja veneen on oltava hyvin havaittavissa lentokoneista ja muista aluksista.
    - Aquafarerin pelastus-RIB:t on suunniteltu kölistä ylöspäin näihin vaatimuksiin — itsetyhjenevät kansirakenteet, vahvistetut rungot, navigointipaketteineen ja hinaustelineineen vakiona partiomalleissa.
content_solution:
  tagline: Ratkaisumme
  title: Tarkoitukseen suunnitellut pelastus-RIB:t
  subtitle: Jokainen Aquafarerin pelastusvene on suunniteltu täyttämään tai ylittämään SOLAS- ja kansalliset SAR-vaatimukset.
  list:
    - Itsetyhjenevä kansi — vesi valuu automaattisesti ulos vakauden takaamiseksi nosto-operaatioissa
    - Vahvistettu deep-V-runko — kyky karkeassa vedessä ennustettavalla käyttäytymisellä suurissa nopeuksissa
    - Täydellinen navigointivalojen sarja — käyttö päivin ja öin kaikissa sääoloissa
    - Hinausteline ja hinausköysi — valmiina alusten hinaukseen tai pelastuskelkkakäyttöön
    - Varusteiden kiinnityslevyt — radio, etsintävalaisin, sireeni ja lääkintävarusteet
    - Useita moottorikonfiguraatioita — yksi perämoottori tai kaksoismoottorin varmuus
    - Korkean näkyvyyden putkivärit — oranssi, keltainen tai punainen maksiminäkyvyyden takaamiseksi
content_segments:
  tagline: Pelastusprofiilit
  title: Vesikulkuneuvojen etsintä- ja pelastusratkaisut<br />Organisaatiotyypin mukaan
  subtitle: Eri pelastusorganisaatiot toimivat eri toimeksiannoilla, budjettijaksoilla ja toimintaympäristöissä – rannikkoalueiden vapaaehtoistyöntekijöistä kansallisiin rannikkovartioston laivastoihin. Määritämme jokaisen pelastuksen RIB vastaamaan tehtäväprofiilia.
  items:
    - title: Rannikkovartiosto ja hallitus SAR virastot
      subtitle: Absoluuttinen turvallisuusvastuu – toiminnan kannalta kriittiset laivaston standardit
      description: Valtion SAR virastoilla on korkein turvallisuusvastuu merenkulun toiminnassa. Jokaisen veneen on toimittava virheettömästi äärimmäisissä olosuhteissa – laitteistovika pelastustehtävän aikana ei ole vaihtoehto. Hankintapäätökset perustuvat 10-15 vuoden käyttöiän kokonaiskustannuksiin, ei ennakkohintaan. Toimistot tarvitsevat aluksia, jotka selviävät vuosien rannikkopartiosta, täyttävät tiukat kansalliset standardit ja tarjoavat tasaisen suorituskyvyn hajautetuilla asemilla. Kattava vaatimustenmukaisuusdokumentaatio ja monivuotiset palvelusopimukset ovat pakollisia.
      features:
        - SOLAS ja kansallisten SAR standardien noudattamisasiakirjapaketti
        - Koko kaluston osien yhteisyys – vähennä asematason varaston monimutkaisuutta
        - Kaksimoottorinen kokoonpano toiminnan kriittiseen redundanssiin
        - 10-15 vuoden käyttöikä suunnittelu ajoitetuilla huolto-ohjelmilla
        - Kyky jokasään – vahvistettu deep-V runko kovaa merialuetta varten
    - title: Hengenpelastaja- ja rantapelastuspalvelut
      subtitle: Pikakäynnistys matalassa vedessä
      description: Kunnalliset ja ranta-alueen hengenpelastajapalvelut tarvitsevat nopean toiminnan aluksia, jotka voivat laskea vesille surffausalueiden läpi, toimia matalissa rannikkovesissä ja saavuttaa uimarit tai hädässä olevat alukset muutamassa minuutissa. Varusteiden tulee olla riittävän kevyitä rantahinaukseen pienellä ajoneuvolla tai käsin.
      features:
        - Matala syväys RIB runko surffausalueelle ja rannikkokäyttöön
        - Rantalaukaisumahdollisuus keulan nostokahvalla ja kölisuojalla
        - Integroitu pelastuskelkka tai pelastusuimalava
        - Korkean näkyvyyden oranssi tai keltainen putken värit vakiona
    - title: Pelastuslaitokset
      subtitle: Palopumppujen integrointi, laitteiden asennus, nopea reagointi
      description: Pelastuslaitokset reagoivat rantarakenteiden tulipaloihin, aluspaloihin ja vesipelastustapahtumiin. Näissä veneissä on oltava palopumput, monitorit, letkujen säilytyslaitteet ja hengityslaitteet – kaikki integroituna vakaalle, nopealle alustalle. Osastot käyttävät näitä aluksia myös tulvatorjuntaan ja keskinäiseen apuun. Konsoliasetteluissa on oltava pumppuohjaimet, radiojärjestelmät ja hätävalaistus vaarantamatta kannen tilaa miehistön liikkumiselle.
      features:
        - Keulaan asennettu palovartija pumppuintegraatiopaketilla
        - Erikoisvarustekiinnitys palopumpulle, letkuvarastolle ja BA-sarjoille
        - Konsolin asettelu konfiguroitavissa pumpun ohjaimia, radiota ja hätävaloa varten
        - Itsekiinnittyvä kansi sammutusveden valumiseen ja vakauteen
        - 'Yöoperaatiopaketti: valonheitin, kohtausvalaistus, sininen/punainen valopalkki'
    - title: Meripoliisi ja satamaturvallisuus
      subtitle: Kielto, partio, lennolle pääsy
      description: Merilainvalvontayksiköt vaativat aluksia, jotka pystyvät takaa-ajoon suurella nopeudella, epäilyttävistä aluksille pääsystä ja sataman turvapartiosta. Näissä veneissä on oltava turvallinen säilytystila valvontavarusteille ja aseille, kommunikaatiointegraatio maakomentoon ja riittävästi kansitilaa joukkueen toimintaan. Yöoperaatiokyky ja matalan profiilin lähestymistapa ovat välttämättömiä estotehtävissä.
      features:
        - Nopea takaa-ajokyky — höylättävä runko yli 40 solmun huippunopeudella
        - Turvalliset asekaapit ja valvontavarusteiden säilytyslokerot
        - Konsoliintegraatio poliisiradiolle, MDT- ja viestintäjärjestelmille
        - 'Yöoperaatiopaketti: IR-kohdevalo, FLIR-kiinnitys, peitetty valaistus'
        - Vahvistettu nousutaso liukumattomalla pinnalla
        - Sininen/punainen hätävalo ja sireenijärjestelmä
    - title: Vapaaehtoistyö SAR ja voittoa tavoittelemattomat järjestöt
      subtitle: Avustuksella rahoitettu, yhteisöllinen rannikko- ja järvitoiminta
      description: Yhteisölliset pelastusryhmät toimivat järvissä, joissa ja rannikkoalueilla, joilla valtion SAR kattavuus on rajoitettu. Usein lahjoituksilla tai valtion avustuksilla rahoitetut organisaatiot tarvitsevat maksimaalisen kyvyn dollaria kohden – luotettavan, vähän huoltoa vaativan aluksen, jota vapaaehtoiset voivat käyttää turvallisesti vähäisellä koulutuksella. Avustusten hankintasyklit tarkoittavat, että veneiden on täytettävä vaatimustenmukaisuusvaatimukset ja pysyttävä kiinteiden budjettien sisällä.
      features:
        - Yhden perämoottorin kokoonpano optimoitu alhaisemmille hankinta- ja käyttökustannuksille
        - PVC rakenne vähentää huoltoa ja helppoa kenttäkorjausta
        - Monitoimikonsoli, joka minimoi elektronisen monimutkaisuuden vapaaehtoistyöntekijöille
        - Apurahoitushakemusten asiakirjapaketti
        - Kevyt muotoilu rannalle laskemiseen ilman erityistä perävaunua tai nosturia
    - title: Tulvapelastus ja katastrofiapu
      subtitle: Sisämaan tulvat, matala vesi, roskat täynnä ympäristö
      description: Tulvapelastus on erillinen toimintaprofiili – veneet toimivat tulvilla olevilla kaupunkialueilla, roskien täyttämillä virroilla ja erittäin matalassa vedessä, jossa vedenalaiset esteet ovat näkymättömiä. Operaattorit tarvitsevat aluksia, jotka voivat navigoida tulvivilla kaduilla, työntää roskia ja poistaa uhreja rakennuksista ja ajoneuvoista. Matalan vedon kyky on kriittinen, samoin kuin kyky toimia virrassa, jossa on jumiutumisvaarat. Näitä veneitä käyttävät usein palokunnat, väestönsuojelu ja katastrofiavun kansalaisjärjestöt.
      features:
        - Erittäin matala syväysrunko - toimii 30-50 cm vedessä
        - Roskia hylkivä keula ja vahvistettu putkisuojaus upotettuja esteitä varten
        - Itsestään palautuva kansi tulvavesien valumiseen ja uhrien toipumiseen
        - Korkean näkyvyyden oranssit tai keltaiset putket ilmatiedustelunäkyvyyteen
        - Kevyt rakenne helikopterikuljetukseen ja maantiekäyttöön
        - Vahvistetut nostopisteet nosto- ja köysipelastustöihin
