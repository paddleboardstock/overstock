hero_text:
  tagline: Resurssit
  title: 'Latauskeskus & ostajan oppaat'
  subtitle: 'Pääset tuotekatalogeihin, OEM-oppaisiin, ostajan tarkistuslistoihin ja tekniseen dokumentaatioon, jotka auttavat sinua tekemään perusteltuja hankintapäätöksiä.'
features3_downloads:
  tagline: Lataukset
  title: 'Tuotedokumentaatio<br />ja ostajan resurssit'
  isBeforeContent: false
  columns: 2
  items:
    - title: 'Merituotteiden katalogi 2026'
      description: 'Täysi tuotevalikoima mukaan lukien RIB-veneet, kumiveneet, SUP-laudat, kajakit ja varusteet. Tekniset tiedot, varustelut ja vaihtoehdot. PDF-muoto.'
      icon: tabler:file-text
    - title: 'OEM-valmistuksen opas'
      description: 'Kaikki mitä sinun täytyy tietää OEM/ODM-kumppanuuksista: prosessin yleiskatsaus, vähimmäistilausmäärät, räätälöintivaihtoehdot, laadunvalvonta ja toimitus.'
      icon: tabler:building-factory
    - title: 'RIB-veneiden ostajan opas'
      description: 'Miten valitset oikean RIB-veneen: rungon materiaalit, putkien materiaalit, moottorin valinta, kokohuomiot ja varusteluvaihtoehdot eri käyttötarkoituksiin.'
      icon: tabler:file-description
    - title: 'SUP-toimittajan tarkistuslista'
      description: 'Tärkeimmät huomiot SUP-lautavalmistajaa valittaessa: laatuindikaattorit, sertifiointivaatimukset, MOQ-seikat ja mihin kannattaa kiinnittää huomiota tehdasauditoinnissa.'
      icon: tabler:clipboard-check
    - title: 'Kumiveneiden materiaaliopas'
      description: 'PVC vai Hypalon: kestävyyden, UV-sietoisuuden, käyttöiän, korjausvaihtoehtojen ja kustannusten vertailu eri merikäyttötarkoituksiin.'
      icon: tabler:files
    - title: 'Toimeksiantopohja räätälöityyn valmistukseen'
      description: 'Lataa tuotteen toimeksiantopohjamme. Täytä vaatimuksesi ja palauta se meille, niin saat tarjouksen saman viikon aikana ja toteutettavuusarvion.'
      icon: tabler:template
faqs:
  title: Usein kysytyt kysymykset
  subtitle: 'Yleisiä kysymyksiä tuotteistamme, valmistusprosessista ja kumppanuusmallista.'
  columns: 2
  items:
    - title: Mikä on vähimmäistilausmäärä?
      description: 'MOQ vaihtelee tuoteryhmän mukaan. RIB-veneet alkavat yleensä 10 kappaleesta per malli. SUP-laudat 50 kappaleesta. Ota yhteyttä myyntitiimiimme tuotekohtaisiin MOQ-tietoihin.'
      icon: tabler:help-circle
    - title: Voinko saada näytteitä ennen tilauksen tekemistä?
      description: 'Kyllä. Paddle Board Overstock tarjoaa näytetuotantoa arviointia varten ennen sarjavalmistusta. Näytteiden kustannukset ovat neuvoteltavissa ja ne hyvitetään usein ensimmäisestä tuotantotilauksesta.'
      icon: tabler:package
    - title: Mitkä maksuehdot ovat käytettävissä?
      description: 'Vakioidut ehdot: 30% ennakkomaksu tilauksen yhteydessä, 70% ennen toimitusta. LC-ehdot ovat saatavilla hyväksytyille asiakkaille. Ota yhteyttä taloushallintoomme keskustellaksesi järjestelyistä.'
      icon: tabler:currency-dollar
    - title: Kauanko tuotanto kestää?
      description: 'Tyypilliset toimitusajat: RIB-veneet 30-45 päivää, SUP-laudat 20-30 päivää, kumiveneet 25-35 päivää. Räätälöity kehitys lisää 15-30 päivää prototyyppien valmistukseen.'
      icon: tabler:calendar-clock
    - title: Mitä sertifiointeja tuotteillanne on?
      description: 'CE-sertifiointi EU-markkinoille, Yhdysvaltain rannikkovartioston hyväksymä valmistus, ISO-laatujärjestelmä, BSCI-vaatimustenmukaisuus ja REACH-materiaalivaatimustenmukaisuus.'
      icon: tabler:certificate
    - title: Tarjoatteko räätälöityä pakkausta ja brändäystä?
      description: 'Kyllä. Tarjoamme räätälöityä pakkausta logollanne, väreillänne ja brändi-identiteetillänne. Räätälöidyn pakkauksen MOQ riippuu tuoteryhmästä.'
      icon: tabler:color-swatch
cta:
  title: 'Tarvitsetko apua oikean resurssin löytämisessä?'
  subtitle: 'Ota yhteyttä tiimiimme henkilökohtaiseen ohjaukseen tuotevalinnoissa, OEM-kumppanuuksissa tai teknisissä määrityksissä.'
  actions:
    - variant: primary
      text: Ota yhteyttä tiimiimme
      href: /contact
