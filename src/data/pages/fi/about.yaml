hero:
  tagline: Meistä
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock-tehdas ja työpaja
  title: |
    Meritekniikkaa, <br />
    rakennettu <span class="text-accent dark:text-white">Paddle Board Overstock</span>-tavalla
  subtitle: 'Aloitimme rannikkopajassa yhdellä veneellä ja itsepäisellä uskomuksella: merituotteiden tulee olla suunniteltuja huolella, koska ne ovat tärkeitä. Nykyään toimitamme yli 40 maahan, mutta jokainen runko kulkee edelleen samojen käsien läpi, jotka perustivat yrityksen.'

stats:
  title: Lukuina
  columns: 4
  stats:
    - title: Toimitettuja runkoja
      amount: '2,400+'
    - title: Maita, joihin toimitetaan
      amount: '50+'
    - title: Yhdistetty kokemus vuosina
      amount: '60'
    - title: Keskimääräinen takuuvaste (tunteja)
      amount: '24'

features3_what_we_build:
  title: Mitä rakennamme
  subtitle: Keskittynyt tuotevalikoima, jonka tunnemme perusteellisesti — ei puolivalmiita kokeiluja, ei merkkituotteiden uudelleenbrändäystä.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB-veneet
      description: Alumiinirunkoiset RIB-veneet 3,3 m – 7,5 m. Suunniteltu partiointiin, sukellukseen, kalastukseen ja perhekäyttöön.
      icon: tabler:ship
    - title: Kumiveneet
      description: PVC- ja Hypalon-kumiveneet 2,4 m – 4,2 m. Kevyitä, kestäviä ja helppoja säilyttää.
      icon: tabler:speedboat
    - title: Superjahtien tenderit
      description: Kompaktit, huippuluokan RIB-veneet, jotka on rakennettu vastaamaan emoaluksesi ilmettä.
      icon: tabler:crown

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Varusteet
      description: Airot, pumput, suojat, kuivalaukut, polttoainesäiliöt ja elektroniikka. Kaikki yhteensopivia veneidemme kanssa.
      icon: tabler:package
    - title: Kunnostus ja korjaus
      description: Oma putkien vaihto, elektroniikan päivitys ja moottoripäivitykset.
      icon: tabler:tool
    - title: Räätälöidyt rakennusprojektit
      description: Projekti kerrallaan suunnittelua kaupallisiin, tieteellisiin ja sotilaallisiin tarpeisiin.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Veneen suunnittelu- ja insinöörityökeskustelu

steps2_values:
  title: Arvomme
  subtitle: Kolme periaatetta, jotka ovat muokanneet jokaista tuotetta ensimmäisestä päivästä lähtien.
  items:
    - title: Rakenna kuin se kantaisi perhettäsi
      description: Jokaista runkoa, hitsiä ja kiinnitintä käsitellään kuin oma perheemme käyttäisi sitä.
      icon: tabler:heart
    - title: Suunnittele ennen kuin myymme
      description: Jos määrittely on väärä, muutamme määrittelyä — emme koskaan asiakasta.
      icon: tabler:settings
    - title: Tuki, joka kestää takuuta pidempään
      description: Kaksikymmentä vuotta vanhat rungot soittavat edelleen meille varaosia varten, ja vastaamme yhä.
      icon: tabler:headset

steps2_milestones:
  title: Virstanpylväät
  subtitle: Lyhyt versio Paddle Board Overstockin tarinasta.
  isReversed: true
  items:
    - title: Perustettu rannikkopajassa
      description: Kahden laivainsinöörin perustama, CNC-koneella ja itsepäisellä idealla.
      icon: tabler:building-factory
    - title: Ensimmäiset 1 000 runkoa toimitettu
      description: Saavutettu seitsemäntenä vuotena, pääasiassa puskaradion ja toistuvien asiakkaiden kautta.
      icon: tabler:circle-check
    - title: Kansainvälinen vientiohjelma
      description: Toimitamme nyt yli 40 maahan, paikallisia tukikumppaneita viidellä mantereella.
      icon: tabler:world

features2_locations:
  title: Toimipisteemme
  tagline: Löydä meidät
  columns: 3
  items:
    - title: Pääkonttori ja työpaja
      description: Rannikon teollisuuspuisto, rakennus 4 — avoinna ma–pe vierailuille sopimuksen mukaan.
    - title: EU-huoltokeskus
      description: Välimeren satama — kunnostus, korjaus ja takuutuki Euroopan asiakkaille.
    - title: APAC-kumppaniverkosto
      description: Valtuutetut huoltokumppanit Australiassa, Japanissa, Singaporessa ja Hongkongissa.
brand_hub_tagline: 'Brändi'
brand_hub_title: 'Tutustu brändiimme'
brand_hub_subtitle: 'Sukeltaudu syvemmälle merenkulkutekniikan osaamiseemme, maailmanlaajuiseen läsnäoloomme ja periaatteisiimme.'

brand_hub_cards:
  - title: 'Merenkulkualan osaaminen'
    desc: 'Vuosikymmenten materiaalitiede, tarkkuusvalmistus ja todelliset testit — PVC/Hypalon-valmistuksesta syvään V-runkosuunnitteluun ja drop-stitch-tekniikkaan.'
    link: /brand-marine-expertise
    link_label: 'Lue lisää →'
  - title: 'Maailmanlaajuinen läsnäolo'
    desc: 'Toimitukset yli 50 maahan Qingdaon tehtaaltamme valtuutettujen huoltopartnerien kera Euroopassa, Aasian-Tyynenmeren alueella ja Amerikoissa.'
    link: /brand-global-presence
    link_label: 'Lue lisää →'
  - title: 'Miksi Paddle Board Overstock'
    desc: 'Pystyintegraatio, kaksoissertifiointi (ISO 9001 + BSCI), CE-vaatimustenmukaisuus ja pienet vähimmäistilauskoot — tehty brändeille, jakelijoille ja viranomaisille.'
    link: /brand-why-paddleboardoverstock
    link_label: 'Lue lisää →'

production_section:
  tagline: 'Tuotannon huippuosaaminen'
  title: 'Varmistaen poikkeuksellinen työnlaatu'
  description: 'Paddle Board Overstockin tuotantolinja on omistettu korkealaatuisten, kestävien ja suorituskykyisten ilmattavien tuotteiden valmistukseen.'
  cards:
    - title: 'Kokenut teknikkojen tiimi'
      items:
        - 'Ammattitaitoinen tuntemus PVC:stä, Hypalonista ja merimateriaaleista'
        - 'Tarkka käsityö leikkauksessa, liimauksessa ja tarvikkeiden asennuksessa'
        - 'Jatkuva koulutus uusimpien tuotantoteknologioiden hallitsemiseksi'
    - title: 'Edistynyt tuotantokalusto'
      items:
        - 'CNC-leikkurit tarkkaan kankaan leikkaukseen minimaalisella virheellä'
        - 'Suurtaajuinen kuuma/kylmäliimaus ilmaväliä pitäviin, kestäviin saumoihin'
        - 'Ammattimaiset ilmantiiviys- ja vetolujuustestauslaitteet'
    - title: 'Kypsä johtamisjärjestelmä'
      items:
        - 'Standardoidut tuotantoprosessit selkeillä laatustandardeilla'
        - 'Lean-tuotantofilosofia, joka vähentää hukkaa ja parantaa tehokkuutta'
        - 'Tehokas toimitusketjun hallinta luotettavilla toimittajakumppanuuksilla'
    - title: 'Tiukka laadunvalvonta'
      items:
        - 'Sertifioitu laadunhallintajärjestelmä'
        - 'Monivaiheinen tarkastus: raaka-aineet, valmistuksen aikana, lopputarkastus'
        - 'Tiukat ilmantiiviys- ja kestävyystestit ennen toimitusta'

global_ops_section:
  tagline: 'Globaali toimintarkkitehtuuri'
  title_html: 'Yksi brändi, <span class="text-white/90">kaksi keskusta</span>'
  description_html: 'Syyskuusta 2026 lähtien Paddle Board Overstockia on operoinut <strong class="text-white">Weihai Dongjilian Co., Ltd.</strong> (New Mexico, Yhdysvallat) — globaali yksikkö, joka vastaa jakelusta, kaupallisesta B2B-myynnistä, sopimuksista, laskutuksesta ja myynnin jälkeisistä palveluista. R&D, tuotanto ja laadunvalvonta pysyvät <strong class="text-white">Paddle Board Overstockin Qingdaon tuotantokeskuksessa</strong>, joka toimittaa jokaisen tilauksen suoraan tehtaalta, FOB Qingdao. Siirtymä muutti sitä, kuka allekirjoittaa sopimuksesi — ei sitä, kuka rakentaa veneesi.'
  stats:
    - value: '2,400+'
      label: 'Toimitetut rungot maailmanlaajuisesti'
    - value: '50+'
      label: 'Vientimaita'
    - value: '10+'
      label: 'Valmistusvuosia'
