faq:
  title: Tekniset piirustukset – Usein kysytyt kysymykset
  questions:
    - q: Ovatko GA-pdf-tiedostot todella ladattavissa ilmaiseksi?
      a: Kyllä. Päämalleidemme yleisjärjestely PDF-tiedostot ovat saatavilla ilmaiseksi. Ne sisältävät suunnittelutason tietoa, joka riittää projektin arviointiin, tilanjakoon ja alustavaan spesifikaatioon.
    - q: Kuinka pääsen DXF/DWG-tiedostoihin?
      a: Täytä lataussivulla oleva lyhyt kelpoisuuslomake ja ilmoita yrityksesi nimi, projektityyppi ja käyttötarkoitus. Hyväksytyt pyynnöt saavat latauslinkin sähköpostitse 1 arkipäivän kuluessa.
    - q: Voinko saada STEP/IGES 3D -malleja?
      a: STEP- tai IGES-3D-mallitiedostot ovat saatavilla projektihakuprosessimme kautta. Ilmoita projektin laajuus, integrointivaatimukset, aikajana ja ostoaikeet. Edellyttää hyväksyntää – yleensä 3–5 arkipäivän kuluessa.
    - q: Miksi rajoitat pääsyä yksityiskohtaisempiin tiedostoihin?
      a: Rungon geometria, muottitiedot ja rakennelaskelmat edustavat vuosien T&K-investointeja ja ovat ydinvalmistuksen IP. Tarjoamme kaiken tarvittavan hankintojen suunnitteluun ja projektien integrointiin ja turvaamme samalla kykymme jatkaa panostusta uusien tuotteiden kehittämiseen.
    - q: Sisältääkö piirustukset valmistustiedot?
      a: Ei. Julkiset ja kevyet piirustukset sisältävät hankintatason tietoa suunnittelua ja määrittelyä varten. Valmistustason tiedot (laminointiaikataulut, työkaluradat, leikkauslaajennukset) jaetaan vain NDA:ssa vahvistettujen tilausten kanssa.
    - q: Onko piirustuksia saatavilla mukautetuille tai puoliksi mukautetuille RIB-kokoonpanoille?
      a: Räätälöidyt projektipiirustukset valmistetaan osana OEM/ODM-kehitysprosessia. Jos arvioit mukautettua RIB-projektia, ota meihin yhteyttä ja kerro tarpeistasi, niin toimitamme projektikohtaiset GA-piirustukset osana ehdotusta.
