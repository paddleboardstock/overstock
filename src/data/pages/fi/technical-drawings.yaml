content_version_control:
  tagline: Versiohallinta
  title: Piirustusversio<br />hallinta
  subtitle: Jokainen piirustus noudattaa valvottua tarkistusjärjestelmää. Varmista aina, että sinulla on nykyinen versio, ennen kuin käytät piirustuksia projektin suunnitteluun.
  items:
    - title: Revisionseuranta
      description: Jokaisessa piirustuksessa on versiokoodi (Rev-A, Rev-B, Rev-C), julkaisupäivämäärä, viimeisin tarkistuspäivämäärä, sovellettava malli/kokoonpano, yksiköt, tiedostokoko ja muoto. Vain "Nykyinen" versio on ladattavissa.
      icon: tabler:git-branch
    - title: Piirustustilailmoitus
      description: Kaikki julkiset piirustukset on merkitty "Vain alustava layout - ei rakennus-, sertifiointi- tai tuotantokäyttöön. Mitat ovat lopullisen määrityksen ja tilausvahvistuksen alaisia." Tämä suojaa molempia osapuolia väärinkäytöltä.
      icon: tabler:alert-circle
    - title: Päivitä ilmoitukset
      description: Kun mallispesifikaatio muuttuu, piirustuksen versio päivitetään ja aiemmat versiot merkitään "Korvattu". DXF/DWG-paketteja ladaneille rekisteröityneille käyttäjille ilmoitetaan merkittävistä päivityksistä sähköpostitse.
      icon: tabler:bell

