hero:
  tagline: Tekniset piirustukset ja CAD
  title: RIB- ja kumivene<br />Tekniset piirustukset ja CAD-lataukset
  subtitle: Suunnittelutason GA-piirustukset, mittataulukot ja kansiasettelut projektin arviointia ja määrittelyä varten. Käytä teknisiä piirustuksia oikealla tasolla – julkisista PDF-tiedostoista projektitason STEP-tiedostoihin.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: RIB-veneen tekniset piirustukset ja CAD-lataukset
direct_answer: Aquafarer tarjoaa hankintatason teknisiä piirustuksia RIB-veneisiin ja puhallettaviin vesikulkuneuvoihin – mukaan lukien yleisjärjestelyn (GA) PDF-tiedostot, mittasivut ja kansien layoutpiirustukset. Yksityiskohtaisemmat tiedostot (DXF/DWG, STEP/IGES) ovat saatavilla pätevästä tiedustelusta tai projektihakemuksesta.
