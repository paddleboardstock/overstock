content_tiers:
  tagline: Lataa tasot
  title: Neljä pääsytasoa<br />— Oikea yksityiskohta oikeaan vaiheeseen
  subtitle: Tarjoamme hankintatason piirustuksia, emme valmistustason tiedostoja. Each tier matches a different project stage.
  items:
    - title: Taso 1 – Julkinen PDF
      description: Yleisjärjestely (GA), 4-näkymän mittapiirustus ja kansiasettelu PDF-muodossa. Saatavilla ilmaiseksi ladattavaksi. Riittää projektin suunnitteluun, tilanjakoon ja alustavaan erittelyn tarkasteluun.
      icon: tabler:file-type-pdf
    - title: Taso 2 — Kevyt muoto DXF/DWG
      description: 2D CAD-tiedostot (DXF tai DWG) suunnittelutason asetteluintegraatioon. Vaatii lyhyen kelpoisuuslomakkeen (yrityksen nimi, projektin tyyppi, käyttötarkoitus). Ei sisällä rakenne- tai valmistustietoja.
      icon: tabler:file-code
    - title: Taso 3 – Projektihakemus STEP/IGES
      description: 3D-mallitiedostot (STEP tai IGES) järjestelmäintegraatioon, varustelusuunnitteluun tai laivaston arkkitehtuurin koordinointiin. Edellyttää hankehakemusta, jossa on laajuus, aikajana ja ostoaike. Edellyttää hyväksyntää.
      icon: tabler:cube
    - title: Taso 4 – NDA Engineering
      description: Rungon rakennepiirustukset, laminointiaikataulut, putkenleikkauslaajennukset ja muottitiedot. Saatavilla vain NDA:lla vahvistetuilla tilauksilla. Nämä ovat valmistustason tiedostoja – ei julkiseen jakeluun.
      icon: tabler:lock
content_included:
  tagline: Mitä sisältyy
  title: Piirustuksen sisältö<br />Malleittain
  subtitle: Jokaisessa mallissa on vakiopiirustuspaketti, joka sisältää olennaiset suunnittelutiedot B2B-ostajien ja projektiinsinöörien tarpeisiin.
  items:
    - title: Yleinen järjestely (GA)
      description: Sivuprofiili, ylhäältä katsottuna ja poikkileikkaus, jossa näkyy rungon muoto, putken sijainti, konsolin sijainti, istuin, polttoainejärjestelmä ja avainmitat (LOA, palkki, putken halkaisija, nousukulma). Tarkistuksen tila ja tekijänoikeudet on merkitty otsikkolohkoon.
      icon: tabler:layout
    - title: 4-näkymän mittapiirustus
      description: Näkymät sivulta, edestä, takaa ja ylhäältä yleismitoilla kuljetuksen suunnittelua varten (perävaunun korkeus, kontin palkki, nostopaino). Sisältää käyttö- ja kuljetuskokoonpanot.
      icon: tabler:ruler-2
    - title: Kannen asettelu ja varustussuunnitelma
      description: Kannen ylhäältä alas näkymä, jossa näkyy konsolin pohja, istuinasennot, D-renkaiden sijainnit, navigointivalojen asennot, pilssipumpun pääsy, akku-/polttoainelokero ja laitteiden kiinnityskohdat. Rajoitettu tarkkuus omistetuissa liitännöissä.
      icon: tabler:map
    - title: Kuljetus- ja pakkauspiirustus
      description: Kontin lastaussuunnitelma, kehdon mitat, painon jakautuminen ja nostopisteiden asennot logistiikan suunnittelua varten. Sisältää vakio- ja mukautetut pakkausvaihtoehdot.
      icon: tabler:truck
content_protection:
  tagline: IP-suojaus
  title: Mitä emme jaa<br />ja miksi
  subtitle: Insinööri-IP:n suojaaminen varmistaa, että voimme jatkaa t&k-investointeja ja samalla tarjota ostajille kaiken tarvittavan projektin suunnitteluun.
  items:
    - title: Rungon muotin ydintiedot
      description: Plug and mold -geometria, CNC-työkaluradat ja laminointimallit ovat valmistajan omaisuutta. Niitä ei jaeta millään käyttöoikeustasolla vahvistettujen NDA-sopimusten ulkopuolella.
      icon: tabler:ban
    - title: Putkenleikkauslaajennukset
      description: Putkikankaan litteäkuvioiset leikkaustiedostot ovat valmistustason tietoja. Saatavilla vain NDA:lla vahvistetuilla tuotantotilauksilla ja jaettu vain sopimuspuolen kanssa.
      icon: tabler:ban
    - title: Rakenteelliset laskelmat
      description: Yksityiskohtainen stressianalyysi, FEA-tulokset ja laminaattiaikataulut ovat vaatimustenmukaisuuden kannalta arkaluonteisia asiakirjoja, jotka jaetaan vain ilmoitettujen laitosten ja NDA-sidosten asiakkaiden kanssa vaatimustenmukaisuuden arviointiprosessin aikana.
      icon: tabler:ban
    - title: Kilpailijoiden seulonta
      description: Pidätämme oikeuden hylätä CAD-käyttöoikeuspyynnöt, jotka näyttävät tulevan kilpailijoilta, opiskelijoilta ilman projektikontekstia tai osapuolilta, joilla ei ole laillista hankintaa.
      icon: tabler:shield
