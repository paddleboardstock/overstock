hero:
  tagline: Turvallisuus
  title: Turvallisuusstandardit ja sertifiointi
  subtitle: Jokainen Paddle Board Overstock-tuote läpäisee tiukat testit, ja 64 CE-sertifioitua mallia täyttää kansainväliset turvallisuusstandardit virkistys- ja ammattikäyttöön. ISO 9001 -sertifioitu tehdas.
trust_bar:
  items:
    - value: CE 6185
      label: Sertifioidut vapaa-ajan veneet
      sub: Testannut TÜV Rheinland
    - value: SOLAS
      label: Täyttää offshore-turvallisuusvaatimukset
      sub: Kelluvuus varmistettu 24 tunnin ajan
    - value: ISO 9001
      label: Laadunhallinta
      sub: Auditoitu TÜV Rheinlandin toimesta
    - value: 99,3 %
      label: Virheetön osuus
      sub: AQL 2.5 standardin ISO 2859 mukaisesti
certifications:
  - title: CE-sertifiointi (EU 2016/425)
    standard: Suojainasetus (EU) 2016/425 | EN ISO 12402
    description: Kaikki Paddle Board Overstockin turvavarusteet täyttävät CE-merkintävaatimukset Euroopan henkilökohtaisia suojaimia koskevan asetuksen mukaisesti. Jokainen tuote testataan riippumattomasti TÜV Rheinlandin toimesta, joka on eurooppalainen ilmoitettu laitos. Ilmapurret ja RIB-veneemme täyttävät vapaa-ajan veneiden direktiivin 2013/53/EU (RCD) C- ja D-luokkien vaatimukset.
    body: CE-sertifiointi kattaa henkilökohtaisten pelastusvälineiden ja ilmapurteiden olennaiset terveys- ja turvallisuusvaatimukset. TÜV Rheinland auditoi tuotantolaitoksemme vuosittain varmistaakseen jatkuvan vaatimustenmukaisuuden.
  - title: SOLAS — ihmisten turvallisuus merellä
    standard: SOLAS luku III | LSA-koodi
    description: Life Vest Pro täyttää SOLAS-määräykset avomeri- ja kaupallisissa merioperaatioissa. Testattu 24 tunnin kelluvuuden säilyttämisen, automaattisen täyttymisen upotuksessa ja suorituskyvyn osalta meritilanteissa jopa voimaan 5 asti. Täyttää luvun III vaatimukset pelastusliiveille kaupallisilla aluksilla.
    body: SOLAS-hyväksyntä edellyttää ilmoitetun laitoksen riippumattomia testejä kelluvuudelle, lujuudelle, näkyvyydelle ja automaattiselle aktivoinnille. Life Vest Pro -liivimme on täysin SOLAS-tyyppihyväksytty ja MED-sertifioitu.
  - title: USCG tyyppi III / tyyppi V
    standard: 46 CFR osa 160 | USCG-hyväksyntä
    description: Valikoidut Paddle Board Overstockin pelastusliivit täyttävät Yhdysvaltain rannikkovartoston luokituksen tyyppi III (kelluntatuki) ja tyyppi V (erityiskäyttö) laitteille. Soveltuvat suojaisiin vesistöihin, rannikkopurjehdukseen ja kaupallisiin operaatioihin, jotka edellyttävät USCG-hyväksyttyjä pelastusliivejä (PFD).
    body: USCG-hyväksyntä edellyttää rannikkovartoston tunnustaman riippumattoman laboratorion suorittamia testejä. Tyyppi V -hyväksyntä kattaa hybridi-ilmapohjaiset rakenteet, jotka vaativat manuaalisen tai automaattisen aktivoinnin.
  - title: BSCI-yhteiskuntavastuu
    standard: amfori BSCI toimintakoodi
    description: Tehtaamme auditoi vuosittain amforin Business Social Compliance Initiative (BSCI) -aloitteen mukaisesti. Tämä varmistaa eettiset työskentelykäytännöt, työturvallisuuden, oikeudenmukaiset työajat ja ympäristöhallinnan 12 000 m²:n tuotantolaitoksessamme.
    body: BSCI-vaatimustenmukaisuus on edellytys eurooppalaisille jälleenmyyjille ja maahantuojille. Nykyinen BSCI-luokituksemme on "C" (Hyvä), auditoijana SGS.
  - title: REACH- ja RoHS-vaatimustenmukaisuus
    standard: EU:n REACH-asetus (EY) 1907/2006 | RoHS-direktiivi 2011/65/EU
    description: Kaikki Paddle Board Overstock-tuotteissa käytettävät PVC-yhdisteet, liimat ja pinnoitteet täyttävät EU:n REACH-kemikaaliturvallisuusmääräykset ja RoHS-rajoitukset vaarallisille aineille. Materiaalin turvallisuustietolehdet (MSDS) ovat saatavilla jokaisesta tuotelinjasta.
    body: REACH-vaatimustenmukaisuus varmistaa, ettei rajoitettujen SVHC-aineiden pitoisuudet ylitä raja-arvoja. Säännölliset kolmannen osapuolen laboratoriotestit varmistavat jatkuvan vaatimustenmukaisuuden jokaiselle tuote-erälle.
  - title: ISO 9001:2015 laadunhallinta
    standard: ISO 9001:2015 | Sertifioinut TÜV Rheinland
    description: Laadunhallintajärjestelmämme on TÜV Rheinlandin sertifioima ISO 9001:2015 -standardin mukaisesti, ja se kattaa suunnittelun, tuotannon, testauksen ja jälkimarkkinapalvelut. Vuosittaiset valvonta-auditoinnit varmistavat jatkuvan parantamisen ja prosessien hallinnan.
    body: ISO 9001 -sertifiointi edellyttää dokumentoituja laadunpolitiikkoja, sisäisiä auditointeja, johdon katsauksia, korjaavien toimien menettelyjä ja jäljitettäviä tuotantotietueita.
testimonial:
  quote: Olemme hankkineet turvavarusteita useilta toimittajilta Aasiasta. Paddle Board Overstock on ainoa valmistaja, joka toimitti täydellisen CE-dokumentaation, SOLAS-sertifikaatit ja kolmannen osapuolen testiraportit etukäteen — ilman että pyysimme.
  author: Erik Lindström
  title: Turvallisuusvastaava
  company: Baltic Marine Supply
  location: Suomi
content_overpressure:
  tagline: Turvallisuus ylipaineessa
  title: RIB-putkien paineenhallinta<br />kuumissa ilmastoissa
  subtitle: Ilmapatjan paine nousee lämpötilan mukana. Ylipaineen ymmärtäminen ja hallinta estää vaurioita ja varmistaa turvallisen käytön trooppisissa ja aavikkoympäristöissä.
  items:
    - title: Boyle ylipaineventtiilit
      description: Paddle Board Overstockin RIB-putket on varustettu ylipaineventtiileillä, jotka purkavat automaattisesti ylimääräisen paineen nimellismaksimin yläpuolelta. Estää saumojen rasitusta ja putken mahdollisen puhkeamisen auringonlämmityksen vuoksi.
      icon: tabler:gauge
    - title: Paineen muutos aamusta keskipäivään
      description: Putki, joka on pumpattu 3,5 PSI:in 20 °C:ssa, voi saavuttaa 4,5+ PSI:n 40 °C:n auringonpaisteessa. Pumpaa kuumissa ilmastoissa aina suositellun alueen alarajaan ja anna ylipaineventtiilin hoitaa ylimääräinen paine.
      icon: tabler:sun
    - title: Suositellut käyttöpaineet
      description: 'PVC-putket: käyttö 3,0-3,5 PSI, enintään 4,5 PSI. Hypalon-putket: käyttö 3,5-4,0 PSI, enintään 5,0 PSI. Testaa aina 1,25-kertaisella nimellispaineella (4,4 PSI PVC:lle, 5,0 PSI Hypalonille) Paddle Board Overstockin QC-standardien mukaisesti.'
      icon: tabler:chart-bar
    - title: Parhaat käytännöt auringonvalolle
      description: Säilytä RIB-veneet varjossa, kun ne eivät ole käytössä. Käytä UV-suojuksia pitkäaikaisessa kiinnityksessä. Tarkista ja säädä putken paine ennen aurinkotunteja ja niiden jälkeen. Älä koskaan ylitä enimmäisnimellispainetta.
      icon: tabler:umbrella
    - title: Hätäpaineenpurku
      description: Jos putki tuntuu liian kovalta tai ylipaineventtiili päästää ilmaa, päästä ilmaa ulos Halkey-Roberts- tai sotilasventtiilin kautta, kunnes paine palaa käyttöalueelle. Pidä mukanasi painemittaria tarkkoja lukemia varten.
      icon: tabler:alert-circle
