testimonial:
  content: Paddle Board Overstock suunnitteli ja varusteli koko rantaaktiviteettiohjelmamme kolmessa lomakohteessa. 80 SUPia, 40 kajakkia, turvallisuusinfrastruktuuri ja henkilöstön koulutus – kaikki toimitetaan yhdessä lähetyksessä. Vieraamme osallistuminen vesiaktiviteetteihin kasvoi 60 % ensimmäisen kauden aikana.
  name: Sophie Laurent
  title: Vieraskokemuksen johtaja, Azure Bay Resorts – Phuket, Thaimaa
content_segments:
  tagline: Lomakeskuksen profiilit
  title: Waterfront Hospitality Solutions<br />kiinteistötyypin mukaan
  subtitle: Jokaisella lomakeskuksen kiinteistöllä on ainutlaatuinen vierasprofiili, aktiviteetit ja toimintarytmi – putiikeista ekomoheista suuriin ylellisiin rantalomakohteisiin. Suunnittelemme vesiurheiluohjelmia, jotka vastaavat kiinteistöluokkaa ja vieraiden odotuksia.
  items:
    - title: Ylelliset rannan lomakeskukset
      subtitle: VIP-kuljetukset, vesiaktiviteetteja, ensiluokkainen vieraskokemus
      description: Huippuluokan rantakiinteistöt – Four Seasons, Aman ja vastaavat luksusryhmät – joissa vesiurheilu on vieraiden telttaviihde, joka lisää tyytyväisyyspisteitä ja lisätuloja. Laivaston tulee näyttää ensiluokkaiselta, tarjota vaihtelua ikäryhmien ja kykytasojen välillä ja integroitua saumattomasti lomakeskuksen olemassa oleviin concierge- ja varausjärjestelmiin. Vieraiden esiintymisodotukset ovat erittäin korkeat – laitteiden kunto ja esitys vaikuttavat suoraan 5 tähden arvosteluihin.
      features:
        - 'Premium-brändätty laivasto: SUP-laudat, kajakit, polkuveneet ja pienet RIB-tenderit'
        - 'Vieraita varten valmis esittely: lomakeskuksen väreihin sopivat värit, logobrändäys, lavastettu varusteesittely'
        - Pieni luksus-RIB VIP-vieraskuljetuksiin räätälöidyllä verhouksella ja värien sovituksella
        - 'Integroitu turvallisuusinfrastruktuuri: poijulinjat, hengenpelastusasemat, AED'
        - 'Tulojen hallinta: dynaamisen hinnoittelun mallipohjat, lisämyyntikoulutus, pakettien niputtaminen'
    - title: Yksityiset saaren lomakeskukset
      subtitle: Vieraskuljetus jokasään – ei seisokkeja, ehdoton luotettavuus
      description: Yksityiset saarikeskukset toimivat syrjäisillä paikoilla, joissa vene on ainoa yhteys mantereelle. Päivittäiset vieraiden siirrot, toimitusajot ja hätätilanteessa tapahtuvat lääketieteelliset evakuoinnit riippuvat yhdestä aluksesta – kaikki seisokit vaikuttavat suoraan vieraiden kokemuksiin ja lomakeskuksen toimintaan. Nämä kuljettajat tarvitsevat veneen, joka kulkee luotettavasti kaikissa sääolosuhteissa, vaatii vähän huoltoa ja jossa on varajärjestelmät kriittisen luotettavuuden takaamiseksi. Veneen on myös esitettävä kauniisti vieraiden saapuessa saarelle.
      features:
        - Kaikkiin sääolosuhteisiin soveltuva RIB-kokoonpano täydellä sääsuojalla ja vahvistetuilla ponttoneilla
        - Kaksoismoottorin tai varamoottorin käyttömahdollisuus toimintaan ilman seisokkeja
        - Kaupallisen luokan Hypalon-rakenne 5-8 vuoden käyttöikään syrjäisissä olosuhteissa
        - Helppohuoltoinen rakenne helposti saavutettavilla osilla paikan päällä tehtävää huoltoa varten
        - Räätälöity lomakeskusbrändäys ja premium-verhous saaren estetiikkaan sopivana
    - title: Järvenrannan lomakeskukset ja ekolomakeskukset
      subtitle: Luontoon integroituja vieraselämyksiä
      description: Järvenvarren kiinteistöjä, ekomoja ja luontokohteita, jotka tarjoavat hiljaisia, vähävaikutteisia vesiaktiviteetteja, jotka täydentävät luontoa. Laitteiden tulee mahdollisuuksien mukaan olla moottoroitumattomia, helposti varastoitavissa rajoitetun tilan venevajassa ja hiljaisia käytössä, jotta ympäristökokemus säilyy kaikille vieraille.
      features:
        - 'Moottoroimaton laivasto: SUP-laudat, kajakit, kanootit ja polkuveneet'
        - Hiljaiset täyttöasemat sähköpumpulla vieraiden käyttöön tarvittaessa
        - Ympäristöystävälliset materiaalit ja pakkaukset kestävän kehityksen brändäyksen mukaisesti
        - Toimitukseen sisältyvät varastointitelineet ja venevajan järjestelyjärjestelmät
    - title: Rantaklubit
      subtitle: Vieraskuljetukset, viihde, pienet ylelliset RIB:t
      description: Rantaklubit toimivat energiatehokkaassa, visuaalisesti keskittyneessä ympäristössä, jossa laitteet ovat osa tunnelmaa. He tarvitsevat pieniä ylellisiä RIB-kortteja vieraiden kuljetuksiin läheisiltä hotelleilta tai telakoilta ja vesileluja vieraiden viihteeseen – vesiskootterihinaus, puhallettavat liukumäet ja melontalaudat. Laivaston tulee näyttää tyylikkäältä, olla helppokäyttöistä ja kestää päivittäistä käyttöä eritasoisille vieraille. Varastointi ja nopea käyttöönotto ovat tärkeitä ruuhka-aikoina.
      features:
        - Kompakti luksus-RIB (3,3-4,3 m) vieraskuljetuksiin ja tenderpalveluun
        - 'Vesilelut: hinattavat ilmaponttonit, SUP-laudat ja kajakit vieraiden viihteeksi'
        - Räätälöity väri ja brändäys rantaklubin visuaalisen identiteetin mukaisesti
        - Nopeat vesillelasku- ja nostojärjestelmät suuren läpivirtauksen toimintaan
        - Kestävä Hypalon-rakenne päivittäiseen suolavedelle ja UV-säteilylle altistumiseen
    - title: Yksityiset jäsenklubit ja pursiseurat
      subtitle: Satamakuljetukset, jäsentarjoukset, eksklusiiviset vesiurheilulajit
      description: Yksityiset seurat, joissa vesiurheilu ja venekuljetus ovat jäseniä, eivät tuo tuloja. Laitteiden on täytettävä korkeammat esteettiset vaatimukset, oltava jäsenten saatavilla pyynnöstä ja vaadittava mahdollisimman vähän henkilökunnan valvontaa. Marinan pursiseurat tarvitsevat tarjouskilpailuja erityisesti satamakuljetuksiin – jäsenten siirtämiseen laiturin, kiinnityspaikan ja rannan välillä. Varastoinnin ja huollon tulee olla jäsenille näkymättömiä.
      features:
        - Korkealuokkaiset RIB-tenderit satamakuljetuksiin ja jäsenten kuljetuspalveluun
        - 'Premium-varusteet: EVA-kannet, jäsenille räätälöidyt värit, brändätty verhous'
        - Itsepalvelun lainausjärjestelmä jäsenten pääsyyn ilman henkilökuntaa
        - Sesongin ulkopuolella varastointi ja vuosittainen päivitysohjelma
    - title: Seikkailu- ja aktiviteettikeskeiset hotellit
      subtitle: Opastettuja kierroksia, SUP-joogaa, snorklausretkiä, ryhmätoimintaa
      description: Kiinteistöt, jotka asettuvat seikkailukohteiksi – tarjoavat opastettuja kierroksia, SUP-joogaa, auringonlaskumeloja, snorklausretkiä ja ryhmätoimintaa. Laivaston on tuettava sekä ilmaisia vuokra- että opastettuja ohjelmamalleja varusteilla, jotka siirtyvät saumattomasti vieraiden omakäytön ja ohjaajan johtamien kierrosten välillä. Nämä kiinteistöt tarvitsevat kestäviä laitteita korkeataajuiseen kiertoon, helppo puhdistaa vierasryhmien välillä.
      features:
        - Monipuolinen sekalaivasto tukemassa vuokraus- + opastettujen kierrosten malleja
        - Tandem-kajakit ja erittäin vakaat SUP-laudat ryhmäaktiviteetteihin
        - 'Oppaan varusteet: ohjaajalaudat, vesitiiviit säilytyslaatikot, vesitiivis viestintälaitteisto'
        - 'Vuodenaikainen kalustokierrätys: kesälaivasto → talvisäilytysohjelma'
        - Kestävä rakenne suunniteltu päivittäiseen vieraskäyttöön minimaalisella huollolla
