hero:
  tagline: Vesiurheiluseurat
  title: Laitteet ja ratkaisut<br />melakerhoille ja koulutuskeskuksille
  subtitle: Täydelliset varustepaketit, ohjaajavarusteet, brändäys ja ylläpitotuki kaikenkokoisille SUP-seuroille, kajakkiseuroille, surffauskouluille ja vesiurheilun koulutuskeskuksille.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP-laudat vesiurheiluseuroille ja vuokralaivastoille
direct_answer: Aquafarer tarjoaa kokonaisvaltaisia laiteratkaisuja vesiurheiluseuroille ja koulutuskeskuksille maailmanlaajuisesti. Klubipakettimme sisältävät SUP-laudat, kajakit, melat, pumput, korjaussarjat ja turvavarusteet kilpailukykyiseen tukkuhintaan alhaisilla MOQ-arvoilla. Jokainen paketti voidaan räätälöidä klubin logoilla, merkkiväreillä ja yksilöllisillä pakkauksilla. Tarjoamme myös huoltokoulutusta, varaosatukea ja laitteiden kiertoohjelmia kalustosi käyttöiän maksimoimiseksi.
solution_offerings:
  - title: Klubin aloituspaketti
    subtitle: Nouseville klubeille, joissa on 10–30 jäsentä
    badge: Best Seller
    features:
      - title: Ydinlaitteet
        description: 10–30 SUP-lautaa tai kajakkia vastaavilla meloilla, pumpuilla ja korjaussarjoilla
      - title: Turvavarusteet
        description: Pelastusliivit, pillit, talutushihnasarjat klubin väreissä joka laudalle
      - title: Ohjaajan laitteet
        description: Linja-autokohtaiset laudat, joissa on luistamattomat kannet ja lisävakaus
      - title: Brändäyspaketti
        description: Räätälöity logopainatus tauluihin, meloihin ja pakkauksiin
      - title: Koulutusmateriaalit
        description: Aloittelijan oppituntioppaat, turvallisuusprotokollat ja huollon tarkistuslistat
    cta_text: 'Kokoa seurapakettini'
    cta_href: /contact
  - title: Club Premium -paketti
    subtitle: Vakiintuneille seuroille ja useilla toimipaikoilla toimiville toimijoille
    badge: Professional
    features:
      - title: Täysi laivasto
        description: 30–100 sekoitettua SUP-kalustoa, kajakkeja ja tarvikkeita
      - title: Edistyksellinen turvajärjestelmä
        description: RFID-laitteiden seuranta, vahinkoilmoitussovellus, turvakyltit
      - title: Henkilökunnan koulutus
        description: Paikan päällä ohjaajan sertifiointi ja laitehuoltotyöpaja
      - title: Markkinoinnin tuki
        description: Ammattimainen valokuvaus, esitteet ja sosiaalisen median mallit
      - title: Korvausohjelma
        description: Vuosittainen laitteiden päivitys alennettuun hintaan vaihtomahdollisuuksilla
    cta_text: 'Laajenna seurani'
    cta_href: /contact
