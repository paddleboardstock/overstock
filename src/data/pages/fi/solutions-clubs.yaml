testimonial:
  content: Aloitimme Portugalin surffauskoulumme Club Starter -paketilla. 20 lautaa, meloja, liivejä – kaikki tuli perille 3 viikossa. Kahden kauden jälkeen päivitimme Pro-pakettiin. Räätälöity brändäys logollamme muutti ammattikuvaamme.
  name: Ricardo Santos
  title: Omistaja, Algarve Surf Academy - Lagos, Portugali
content_segments:
  tagline: Klubiprofiilit
  title: Vesiurheiluseuraratkaisut<br />klubityypin mukaan
  subtitle: Yliopistoseuroista eksklusiivisiin yksityisiin huviveneseuroihin – jokaisella kerhotyypillä on ainutlaatuiset varustetarpeet, käyttötavat ja budjettirakenteet. Räätälöimme jokaisen paketin seuran malliin sopivaksi.
  items:
    - title: Yliopistojen ja korkeakoulujen melontaklubit
      subtitle: Korkean käytön opiskelijalaivastot
      description: Opiskelijoiden tai oppilaitosten tukemat melontaseurat, jotka tarjoavat SUP- ja kajakkiohjelmia yliopistojen virkistysosastoille. Laitteita käytetään usein useilla taitotasoilla joka lukukausi. Kestävyys ja helppo korjattavuus ovat kriittisiä, sekä opiskelijaorganisaatioille edulliset hinnat.
      features:
        - 'Erittäin kestävä PVC-rakenne, suunniteltu opiskelijakäyttöön'
        - 'Värikoodatut laudasarjat taitotasojen mukaan helppoa laivaston hallintaa varten'
        - 'Korjaussarja + videotuki pyynnöstä jokaisen tilauksen mukana'
        - 'Alennushinnat opiskelijajärjestöille ja lukukausittainen maksu'
    - title: Yhteisölliset melonta- ja sosiaaliklubit
      subtitle: Jäsenlähtöiset virkistyskerhot
      description: Yhteisöpohjaiset seurat tarjoavat jäsenille SUP-, kajakki- ja sosiaalisia melontakokemuksia. Varusteiden on tasapainotettava suorituskykyä ja mukavuutta laajalla ikäryhmällä, ja tuotemerkin tulee edistää klubin identiteettiä ja jäsenten ylpeyttä. Varastoinnin tehokkuus on avainasemassa klubeille, jotka toimivat rajoitetulla rantayhteydellä.
      features:
        - 'Sekalaivasto: monikäyttö-SUP:t, retkilaudat ja harrastekajakit'
        - 'Täysi seuran brändäys: mukautetut värit, logopainatus, brändäytetyt pelastusliivit'
        - 'Kompaktit säilytysratkaisut ilmatäytettävälle varusteelle'
        - 'Jäsenkasvun aloituspaketti: suosittelukortit, brändätty kuvaus'
    - title: Surffauskoulut ja surffauskajakkiakatemiat
      subtitle: Rannikkoesitys ja valmennus
      description: Surffaukseen keskittyvät koulut, joissa opetetaan SUP-surffausta, surffausmelontaa ja aaltoratsastustaitoja. Laitteiden on toimittava surffausolosuhteissa – ohjattavia, herkkiä ja riittävän kestäviä kestämään toistuvia pyyhkiä, hiekkaa ja suolavettä ilman nopeaa hajoamista.
      features:
        - 'Lyhyemmät, leveämmät SUP-muodot optimoitu aaltojen ohjailtavuuteen'
        - 'Vahvistettu reunojen rakenne iskujen kestoon aalloissa'
        - 'Surffaukseen suunniteltu turvavaruste: kierreleashit, pehmeiden evien vaihtoehdot'
        - 'Laivaston uusintaohjelma kausialennuksin vaihdossa'
    - title: Yritykset ja yksityiset huviveneseurat
      subtitle: Premium-jäsenkokemukset
      description: Eksklusiiviset yksityisklubit, jotka tarjoavat vesiurheilua jäsenilleen. Laitteiden standardit ovat korkeat – estetiikka, brändin linjaus ja vieraille sopiva esitys ovat yhtä tärkeitä kuin suorituskyky. Palveluodotukset sisältävät valkoisen käsineen toimituksen, mukautetut säilytysratkaisut ja concierge-tason tuen.
      features:
        - 'Premium-viimeistelyllä varustetut laudat puusyy-EVA:lla ja metallisilla yksityiskohdilla'
        - 'Värien mukautus seuran brändiohjeistuksen mukaan'
        - 'Concierge-toimitus: esitäytettynä, valmisteltuna ja merkittynä joka kautta varten'
        - 'Oma asiakkuudenhallija ensisijaisella vaste-SLA:lla'
