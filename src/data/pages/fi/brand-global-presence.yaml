hero:
  tagline: Maailmanlaajuinen läsnäolo
  title: 'Toimimme yli 50 maassa<br />kaikissa maanosissa'
  subtitle: 'Eurooppalaisista rannikkopartioinnin operaattoreista Australian vesiurheilujakelijoihin ja Lähi-idän pelastustiimeihin — Paddle Board Overstock-veneet liikkuvat vesillä ympäri maailmaa.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstockin maailmanlaajuinen merituotanto ja jakelu
stats:
  title: Maailmanlaajuinen kattavuus
  stats:
    - title: Maat
      amount: '50+'
    - title: Vientimarkkinat
      amount: Eurooppa, Amerikka, Aasia, Lähi-itä, Oseania
    - title: Tuotanto
      amount: Qingdao, China
    - title: Varasto Yhdysvalloissa
      amount: Montclair, CA
features3_markets:
  tagline: Avainmarkkinat
  title: 'Alueellinen osaaminen<br />paikallisiin vaatimuksiin'
  subtitle: 'Ymmärrämme, että eri markkinoilla on erilaiset sääntelyvaatimukset, mieltymykset ja käyttötarkoitukset.'
  isBeforeContent: false
  columns: 4
  items:
    - title: Eurooppa ja Iso-Britannia
      description: 'CE-sertifioidut tuotteet, jotka täyttävät EN ISO 6185 -standardit. Vahva kysyntä RIB-veneisiin, ilmatäytteisiin veneisiin ja SUP-lautoihin EU-markkinoilla. Britannian jakelijat arvostavat nopeaa toimitustamme.'
      icon: tabler:map-pin
    - title: Pohjois-Amerikka
      description: 'US Coast Guardin hyväksymä valmistus. Yhdysvaltain varasto Montclairissa, Kaliforniassa nopeita toimituksia länsirannikolle. Kasvava kysyntä kalastusveneisiin, pelastusveneisiin ja vapaa-ajan SUP-lautoihin.'
      icon: tabler:map-pin
    - title: Australia ja Oseania
      description: 'Vahva markkina RIB-veneille ja ilmatäytteisille tender-veneille. Australian jakelijat arvostavat Hypalon-veneitämme UV-keston ansiosta ankaran auringon alla. Nopea toimitus Aasian yksiköstämme.'
      icon: tabler:map-pin
    - title: Lähi-itä
      description: 'Kasvava kysyntä partio- ja pelastusveneisiin. Alumiinirunkoiset RIB-veneemme ovat suosittuja rannikkovartioston ja turvallisuusoperaattorien keskuudessa. Räätälöidyt kokoonpanot korkean lämpötilan ympäristöihin.'
      icon: tabler:map-pin
features3_distribution:
  tagline: Jakeluverkosto
  title: 'Yhteistyö jakelijoiden kanssa<br />ympäri maailmaa'
  subtitle: 'Teemme yhteistyötä vakiintuneiden merenkulkuvälineiden jakelijoiden, OEM-merkkien ja julkishankintaorganisaatioiden kanssa.'
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM-kumppanuudet
      description: 'Private label -valmistus maailmanlaajuisille vesiurheilumerkeille. Hoidamme kaiken suunnittelusta tuotantoon ja dropshippingiin.'
      icon: tabler:building
    - title: Jälleenmyyjäverkosto
      description: 'Valtuutetut jakelijat yli 20 maassa pitävät varastoa ja tarjoavat paikallista tukea. Uusien jakelijoiden yhteydenotot ovat tervetulleita.'
      icon: tabler:users
    - title: Viranomaiset ja julkisyhteisöt
      description: 'Suoratoimituksia rannikkovartiostoille, pelastusorganisaatioille ja sotilashankintaohjelmille. Vaatimustenmukaisuus julkishankintavaatimusten kanssa.'
      icon: tabler:building-community
steps2_logistics:
  title: 'Maailmanlaajuinen logistiikka ja tuki'
  subtitle: 'Tehaalta määränpäähän — hallinnoimme koko toimitusketjua.'
  items:
    - title: Toimitusvaihtoehdot
      description: 'Merirahti (FOB Qingdao), lentorahti kiireellisille tilauksille ja pikakuriiri näytteille ja varaosille.'
      icon: tabler:truck-delivery
    - title: Varasto Yhdysvalloissa
      description: 'Varastoa Montclairissa, Kaliforniassa nopeita toimituksia varten koko Pohjois-Amerikkaan. Länsirannikko: 2-3 päivää, keskialueet: 3-4 päivää, itärannikko: 4-5 päivää.'
      icon: tabler:building-warehouse
    - title: Varaosat
      description: 'Aidot Paddle Board Overstock-varaosat ja kulutustarvikkeet varastossa ympäri vuoden. Yleisimmät osat lähetetään 24 tunnin kuluessa.'
      icon: tabler:package
    - title: Tekninen tuki
      description: 'Suora yhteys insinööritiimiimme teknisiin kysymyksiin, korjausneuvontaan ja modernisointitukeen. Tukemme kattaa veneet, jotka rakensimme 20 vuotta sitten.'
      icon: tabler:headset
cta:
  title: 'Haluatko tulla jakelijaksi?'
  subtitle: 'Laajennamme jakeluverkostoamme aktiivisesti. Ota yhteyttä vientitiimiimme keskustellaksesi kumppanuusmahdollisuuksista.'
  actions:
    - variant: primary
      text: Yhteistyöpyyntö
      href: /contact
    - text: Katso tuotevalikoimamme
      href: /products
