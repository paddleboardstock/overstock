hero:
  tagline: 'Tuotemerkki'
  title: 'Aquafarer — Insinööritaito tuo vapauden vesille'
  definition: 'Aquafarer on maailmanlaajuinen merenkulun vapaa-ajan ja kumiveneiden tuotemerkki, joka on erikoistunut kumiveneisiin, SUP-lautoihin ja räätälöityihin merenkulun ratkaisuihin. Aquafarer yhdistää meritekniikan, valmistusosaamisen ja vesilläliikkumisen kulttuurin luodakseen luotettavia varusteita vapaa-ajan käyttäjille, ammattioperaattoreille ja maailmanlaajuisille OEM-kumppaneille.'

timeline:
  - year: '2012'
    title: 'Merenkulun valmistuksen perusta'
    body: 'Aquafarer aloitti erikoistuneena kumivenepajana Qingdaossa, Kiinassa, sitoutuneena merenkulun käsityöhön ja kumiveneiden valmistukseen. Alkuvaiheen keskittyminen oli luotettavien kumituotteiden rakentamiseen käytännön teknisen kokemuksen ja valmistuskurin kautta.'
  - year: '2015'
    title: 'Ensimmäinen vienti ja CE-sertifiointi'
    body: 'Ensimmäiset vientitilaukset saavuttivat Japanin ja Korean. CE-sertifiointi saavutettiin ydintuotelinjoille, mikä merkitsi Aquafarerin pääsyä kansainvälisille markkinoille. Yritys alkoi palvella kaupallisia ja vapaa-ajan käyttäjiä Kiinan ulkopuolella.'
  - year: '2018'
    title: 'Tehtaan laajennus'
    body: 'Muutto 12 000 m² tuotantolaitokseen. Lisättiin RF-hitsauslinjoja ja drop-stitch -tuotantokapasiteettia, mikä mahdollisti suuremman mittakaavan valmistuksen ja parannetut laadunvalvontajärjestelmät.'
  - year: '2020'
    title: 'T&K-keskuksen perustaminen'
    body: 'Avaittiin oma T&K-keskus, jossa PVC-kangaslaboratorio, hydrodynaaminen testaussäiliö ja CAD/FEA-simulaatiostudio. Tuotekehitys laajeni keskittymään kevyeen rakenteeseen, parannettuun kestävyyteen ja käyttäjäkeskeiseen suunnitteluun.'
  - year: '2022'
    title: 'ISO 9001 & Globaali kasvu'
    body: 'Saavutettiin ISO 9001-sertifiointi. Laajennettiin 14 T&K-insinööriin ja 200+ työntekijään. Tuotteet saavuttivat asiakkaita Euroopassa, Amerikassa ja Aasian ja Tyynenmeren alueella jakelija- ja OEM-kumppanuuksien kautta.'
  - year: '2024'
    title: 'Innovaatio- ja designstudio'
    body: 'Käynnistettiin täyden palvelun suunnittelu- ja innovaatiostudio räätälöityihin ODM-projekteihin konseptista tuotantoon. Vahvistettiin ammattimaisia merenkulun sovelluksia, mukaan lukien pelastus-, kaupalliset ja hallituksen tarjouskilpailut.'
  - year: '2026'
    title: 'Vesilläliikkumisen tulevaisuuden rakentaminen'
    body: 'Tänään Aquafarer jatkaa kumiveneiden, SUP-lautojen ja räätälöityjen merenkulun ratkaisujen kehittämistä — yhdistäen ihmisiä ja organisaatioita maailman vesiin. 50+ maata palveltuna, 15 000 yksikön vuosikapasiteetti.'

philosophy:
  tagline: 'Tuotemerkkifilosofia'
  title: 'Insinööritaito tuo vapauden vesille'
  body: 'Vapaus vesillä ei ole vain liikkumista. Se edustaa uusien paikkojen löytämistä, ulkoilmaelämysten luomista, ihmisten yhdistämistä luontoon ja ammattimaisten tehtävien mahdollistamista. Tekniikka tekee siitä vapaudesta mahdollisen.'
  pillars:
    - title: 'Luotettavuus ensin'
      body: 'Vesiympäristöt vaativat luottamusta. Aquafarerin tuotteet on suunniteltu vakauden, kestävyyden, turvallisuuden ja johdonmukaisen suorituskyvyn ympärille.'
    - title: 'Ihmiskeskeinen suunnittelu'
      body: 'Tuotteiden tulisi palvella ihmisiä, ei teknologiaa. Jokainen suunnittelupäätös alkaa ymmärtämällä, miten ihmiset käyttävät vesikulkuneuvoja, missä he tutkivat ja mitä haasteita he kohtaavat.'
    - title: 'Saavutettava tutkimusmatkailu'
      body: 'Veden ei pitäisi kuulua vain asiantuntijoille. Aquafarer luo varusteita, joiden avulla yhä useammat ihmiset voivat turvallisesti kokea jokia, järviä, merta ja rannikkoalueita.'
    - title: 'Jatkuva innovaatio'
      body: 'Innovaatio ei ole vain uusien tuotteiden luomista. Se on jokaisen yksityiskohdan parantamista — materiaalien, rakenteiden, valmistuksen ja käyttäjäkokemuksen.'

engineeringDna:
  tagline: 'Tekninen DNA'
  title: 'Miten Aquafarer luo tuotteita'
  areas:
    - title: 'Materiaalitiede'
      body: 'Aquafarer keskittyy sopivien materiaalien valintaan eri merenkulkuympäristöihin. Keskeisiä näkökohtia ovat kulutuskestävyys, UV-kestävyys, painevakaus ja pitkäaikainen kestävyys.'
      items: ['Kulutuskestävyys', 'UV-kestävyys', 'Painevakaus', 'Pitkäaikainen kestävyys']
    - title: 'Rakennetekniikka'
      body: 'Kumiveneet vaativat tarkkaa tasapainoa jäykkyyden, painon, kannettavuuden ja vakauden välillä. Aquafarerin tekniikka keskittyy näiden tekijöiden optimointiin drop-stitch -ydinteknologian ja edistyneen saumarakenteen avulla.'
      items: ['Jäykkyys', 'Painon optimointi', 'Kannettavuus', 'Vakaus']
    - title: 'Valmistustarkkuus'
      body: 'Jokainen tuote käy läpi valvottuja prosesseja: materiaalin valmistelu, tarkkuusleikkaus, hitsaus ja liimaus, kokoonpano, laaduntarkastus ja suorituskyvyn varmistus.'
      items: ['Materiaalin valmistelu', 'Tarkkuusleikkaus', 'Hitsaus ja liimaus', 'Kokoonpano ja QC']
    - title: 'Käyttäjäskenaariotekniikka'
      body: 'Tuotteita kehitetään todellisten sovellusten ympärillä — vapaa-aika, seikkailu ja ammattikäyttö — varmistaen, että jokainen muotoilu täyttää sen käyttötarkoituksen erityisvaatimukset.'
      items: ['Vapaa-aika', 'Seikkailu', 'Ammattilainen', 'Kaupallinen']

