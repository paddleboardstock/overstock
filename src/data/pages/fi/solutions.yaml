features3_solutions:
  tagline: Ratkaisut
  title: Vesiseikkailusi<br />liikekumppanisi
  isBeforeContent: false
  columns: 3
  items:
    - title: Vesiurheiluseurat
      description: Täydelliset varustepaketit, mukautetut tuotemerkit ja huolto-ohjelmat SUP-seuroille, kajakkiseuroille, surffauskouluille ja koulutuskeskuksille.
      icon: tabler:users
      link: /solutions/clubs
    - title: Vesiurheilun RIB:t
      description: Tarkoituksenmukaiset RIB:t purjehduskouluille, vesiurheilukeskuksille ja tapahtumaorganisaatioille. Linja-autot, hinausveneet ja marsalkkaveneet ammattimaiseen vesiurheiluun.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Lomakeskukset ja hotellit
      description: Laadukkaat vesiurheiluohjelmat, joissa on laivaston laitteita, turvajärjestelmiä, henkilöstön koulutusta ja tulonhallintaa majoitustiloihin.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Vesibrändiyrittäjät
      description: Yksityinen tuotemerkki OEM/ODM -valmistus alhaisilla MOQ-määrillä, räätälöity tuotesuunnittelu, pakkaukset ja maailmanlaajuinen toimitus uusille brändinomistajille.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Sukelluskeskuksen veneet
      description: Vakaat RIB-alustat helppolla nousulla/laskulla, varusteiden säilytyksellä ja moottorikonfiguraatioilla, jotka on optimoitu sukellusoperaatioihin.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Pelastus- ja Hätäalukset
      description: Nopeat RIB:t ja ilmapallot, jotka on suunniteltu etsintä- ja pelastustehtäviin, hätätilanteiden hoitoon ja rannikkovartioston operaatioihin.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Tender-ratkaisut Jahdeille
      description: Kompaktit ja tyylikkäät RIB-tenderit, jotka täydentävät superyachtejä ja vapaa-ajansaluksia. Helppo säilytys, tehokas suorituskyky.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Kalastusveneeratkaisut
      description: Vakaat ja kestävät ilmapallot ja RIB:t, jotka on konfiguroitu kaupallisiin ja vapaa-ajan kalastusoperaatioihin.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Merimatkailun Varusteet
      description: Laivastovalmiit ilmapallot, SUP-laudat ja kajakit lomakohteille, kiertueoperaattoreille ja vesilajien vuokraamoille.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Offshore-energian RIB:t
      description: Raskaat RIB:t öljy- ja kaasulauttojen tukemiseen, tuulipuiston miehistön siirtoon, merenalaisten kaapelien tarkastukseen ja laivojen rakentamiseen.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Vesiviljelytyöveneet
      description: Korroosionkestävät RIB:t kalanviljelyyn, helmien viljelyyn ja valtameriviljelyyn. Hypalon putket, ruostumattomasta teräksestä valmistetut laitteistot, päivittäisen käytön kestävyys.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Merentutkimus ja kartoitus
      description: Vakaat instrumenttivalmiit RIB:t valtameritutkimukseen, ympäristön seurantaan, vedenlaadun näytteenottoon ja yliopistojen opetusohjelmiin.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Kaupalliset Työalukset
      description: Raskaat RIB:t partiointiin, mittaukseen, kuljetukseen ja avomerilogistiikkaan. Rakennettu kaupallisen toiminnan tiukkojen vaatimusten mukaisesti.
      icon: tabler:ship
      link: /commercial-workboats
