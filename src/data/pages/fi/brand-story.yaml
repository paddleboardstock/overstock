content_founding:
  tagline: Alku
  title: 'Synnyin rannikolla'
  subtitle: 'Paddle Board Overstock aloitti Qingdaon rannikkopajassa yhdellä veneellä ja näkemyksellä: rakentaa ilmalla täytettäviä vesikulkuneuvoja, jotka kestävät oikeita meriolosuhteita.'
  paragraphs:
    - 'Vuonna 2012 perustajamme näkivät markkinaraon — useimmat ilmapallot olivat joko edullisia mutta epäluotettavia, tai laadukkaita mutta kohtuuttoman kalliita. He uskoivat, että tilaa oli valmistajalle, joka toimitti sekä laatua että vastinetta.'
    - 'Ensimmäinen runko rakennettiin käsin, testattiin paikallisissa vesissä ja hiottiin kalastajilta ja pieniltä kaupallisilta toimijoilta saadun todellisen palautteen perusteella. Tuo palautesilmukka — rakenna, testaa, kuuntele, paranna — on edelleen suunnittelufilosofiamme ydin.'
    - 'Vuoteen 2015 mennessä sana oli levinnyt Qingdaon ulkopuolelle. Kansainväliset jälleenmyyjät alkoivat pyytää näytteitä. Paikallisena pajana aloittanut yritys oli muuttumassa globaaliksi toimittajaksi.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstockin varhainen tuotantopaja ja valmistus
content_growth:
  tagline: Kasvu ja innovaatiot
  title: 'Pajasta 12 000 m²:n tehtaaksi'
  subtitle: 'Jatkuva investointi ihmisiin, laitteisiin ja prosesseihin on muuttanut Paddle Board Overstockin moderniksi meriteollisuuden tuotantolaitokseksi.'
  paragraphs:
    - 'Kysynnän kasvaessa laitosmme kasvoi. Laajensimme pienestä pajasta 12 000 m²:n tehtaaksi, jossa on omat tuotantolinjat RIB-veneille, ilmapalloille, SUP-laudoille ja tarvikkeille.'
    - 'Investoimme CNC-leikkureisiin, suurtaajuushitsauslaitteisiin, drop stitch -tuotantolinjoihin ja kattaviin testausjärjestelmiin — mikä mahdollistaa tuotantolaadun jokaisen osa-alueen hallinnan.'
    - 'Tänään 200–300 hengen tiimimme koostuu meri-insinööreistä, materiaalitieteilijöistä, laadunvalvonnan asiantuntijoista ja taitavista käsityöläisistä — monet heistä ovat olleet Paddle Board Overstockilla ensimmäisistä päivistä lähtien.'
content_mission:
  tagline: Tehtävämme
  title: 'Vapaus Vedelle, Suunniteltuna'
  subtitle: 'Jokainen Paddle Board Overstock-tuote on suunniteltu auttamaan ihmisiä tutkimaan, työskentelemään ja menestymään vedellä — luotettavasti, turvallisesti ja edullisesti.'
  list:
    - 'Suunnitella vesikulkuneuvoja, jotka toimivat oikeissa meriolosuhteissa — ei vain paperilla'
    - 'Rakentaa kestäviä kumppanuuksia jälleenmyyjien ja brändien kanssa luotettavan OEM/ODM-palvelun kautta'
    - 'Parantaa tuotantoprosessejamme jatkuvasti paremman vastineen tuottamiseksi'
    - 'Tukea jokaista tuotetta aidoilla varaosilla ja teknisellä asiantuntemuksella'
