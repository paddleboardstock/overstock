content_capability:
  tagline: Suunnittelukyky
  title: Mitä suunnittelijamme<br />tiimimme tarjoaa
  subtitle: Aquafarer-suunnittelu kattaa tuotteen koko elinkaaren – markkinatutkimuksesta ja konseptisuunnittelusta prototyyppien valmistukseen, testaukseen ja massatuotantoon.
  items:
    - title: Teollinen muotoilu
      description: Teollinen suunnittelutiimimme työskentelee asiakkaiden vaatimusten, markkinatutkimuksen ja kilpailuanalyysin pohjalta kehittääkseen tuotekonsepteja, jotka tasapainottavat estetiikkaa, toimivuutta ja valmistettavuutta. Tuotamme 2D-luonnoksia, 3D-renderöityjä ja spesifikaatiodokumentteja asiakkaan tarkastettavaksi ennen työkaluihin sitoutumista.
      features:
        - Konseptin kehitys ja toteutettavuusselvitykset
        - 2D-suunnittelupiirustukset ja 3D-visualisoinnit
        - Materiaalien valinta ja määrittely
        - Valmistukseen suunnattu suunnittelu (DFM-analyysi)
        - Ergonominen ja turvallisuusarviointi
    - title: Rakennetekniikka
      description: Rakennusinsinöörimme ovat erikoistuneet puhallettavien veneiden arkkitehtuuriin — rungon suunnitteluun, putkikammioiden kokoonpanoon, pudotusommeltekniikan suunnitteluun ja kuormanjakoon. Jokainen malli analysoidaan rakenteellisen eheyden, painon optimoinnin ja asiaankuuluvien standardien (CE, ISO, AS) noudattamisen suhteen.
      features:
        - Deep-V lasikuiturunkojen suunnittelu lasketuilla V-kulmilla
        - Monikammioinen putkikonfiguraatio turvallisuuden ja kelluvuuden takaamiseksi
        - Drop-stitch-ytimen määrittely ja tiheyden optimointi
        - Elementtimenetelmäanalyysi kuormaa kantaville komponenteille
        - Painonjaon ja vakauden laskelmat
    - title: 3D-mallinnus ja CAD
      description: Kaikki tuotesuunnittelut kehitetään 3D CAD:ssä ennen prototyyppityökalujen aloittamista. Suunnittelijamme käyttävät SolidWorksia ja Rhino 3D:tä tuotteiden mallintamiseen, jolloin asiakkaat voivat tarkastella kaikkia yksityiskohtia – putken profiilista konsolin asetteluun – ennen tuotantoon sitoutumista.
      features:
        - Täydellinen 3D-CAD-mallinnus SolidWorksilla ja Rhino 3D:llä
        - Valokuvarealistiset visualisoinnit asiakasesityksiin
        - Tekniset piirustuspaketit tuotantoon
        - Muottien ja työkalujen suunnittelu 3D-malleista
        - Suora CAD-CNC-tiedonsiirto tarkkaan leikkaukseen
    - title: Prototyyppi ja testaus
      description: Ennen massatuotantoa jokainen uusi tuote käy läpi prototyyppivaiheen. Rakennamme toimivia prototyyppejä asiakkaan arviointia varten ja kohdistamme niihin sitten täyden testausprotokollamme – painetestauksen, vakavuustestauksen, kuormitustestauksen ja vesikokeet. Suunnittelu iteraatiot prototyyppivaiheessa ovat nopeita ja kustannustehokkaita.
      features:
        - Nopeat prototyyppityökalut (15-20 päivän toimitusaika)
        - Toimiva prototyyppi todellisten olosuhteiden arviointiin
        - Täydellinen testausprotokolla ennen tuotannon hyväksyntää
        - Iteratiivinen suunnittelun viimeistely testitulosten perusteella
        - Asiakkaan hyväksyntävaihe ennen tuotantotyökaluja
    - title: Mukautettu lisävarusteiden integrointi
      description: Monet OEM-projektit edellyttävät asiakkaan toimittamien tai kolmannen osapuolen lisävarusteiden integrointia – mukautettuja konsoleita, erikoisistuimia, elektronisia järjestelmiä, sukellusvarusteiden kiinnikkeitä tai tuotemerkkielementtejä. Suunnittelutiimimme hoitaa kaikkien lisävarusteiden integrointisuunnittelun, rakenteellisen mukautuksen ja laadunvarmistuksen.
      features:
        - Konsolien suunnittelu ja mittaristojen sijoittelu
        - Räätälöityjen istuimien ja verhoilun integrointi
        - Elektroniikkajärjestelmien suunnittelu ja johdotus
        - Sukellus- ja pelastusvarusteiden kiinnitysjärjestelmät
        - Brändäyksen ja grafiikan asennuksen tekniset määritykset
content_process:
  tagline: Kehitysprosessi
  title: Konseptista<br />tuotantoon
  subtitle: Tuotekehitysprosessimme noudattaa jäsenneltyä 6-vaiheista työnkulkua, joka on suunniteltu minimoimaan riskit, tiivistämään aikajanat ja varmistamaan valmistusvalmius ensimmäisestä päivästä lähtien.
  stages:
    - stage: '01'
      title: Vaatimukset ja tutkimus
      duration: 1-2 viikkoa
      description: Työskentelemme asiakkaan kanssa määritelläksemme tuotespesifikaatiot, kohdemarkkinoiden vaatimukset, säädöstenmukaisuustarpeet ja kaupalliset tavoitteet. Tässä vaiheessa tuotetaan tuotevaatimusasiakirja (PRD), joka ohjaa kaikkea myöhempää työtä.
      deliverables: PRD, markkina-analyysi, kilpailukykyinen vertailuarvo, alustava kustannusarvio
    - stage: '02'
      title: Konseptisuunnittelu
      duration: 2-3 viikkoa
      description: Teollinen suunnittelutiimi kehittää tuotekonsepteja PRD:n pohjalta. Useita suunnitteluvaihtoehtoja esitetään 3D-mallinnusten, materiaalisuositusten ja alustavien teknisten arvioiden kanssa. Asiakas valitsee suunnan yksityiskohtaista kehitystä varten.
      deliverables: 3D-konseptirenderöinnit, materiaalispesifikaatiot, suunnittelun perustelut, alustava tuoterakenne
    - stage: '03'
      title: Yksityiskohtainen suunnittelu
      duration: 2-4 viikkoa
      description: Valittu konsepti on täysin suunniteltu – 3D CAD-mallinnus, rakenneanalyysi, putken konfigurointi, rungon suunnittelu, lisävarusteiden integrointi ja tuotantodokumentaatio. Kaikki mitat, materiaalit ja prosessit on määritelty työkaluja varten.
      deliverables: Täysi 3D-CAD-malli, suunnittelupiirustukset, lopullinen tuoteluettelo, työkaluspesifikaatiot, laadunvalvontasuunnitelma
    - stage: '04'
      title: Prototyyppien tekeminen
      duration: 2-3 viikkoa
      description: Valmistetaan prototyyppityökaluja ja rakennetaan toimivia näytteitä. Asiakas arvioi prototyypin PRD-spesifikaatioiden mukaisesti. Testaus suoritetaan sovitun protokollan mukaan. Suunnittelusäädöt tehdään palautteen perusteella ennen tuotantotyökaluja.
      deliverables: Toimiva prototyyppi, testiraportti, suunnittelun tarkistusloki, asiakkaan kirjautumisasiakirja
    - stage: '05'
      title: Tuotantotyökalut
      duration: 2-3 viikkoa
      description: Kun prototyyppi on hyväksytty, tuotantotyökalut otetaan käyttöön - muotit, hitsausjyrsit, leikkausohjelmat, kokoonpanolaitteet. Laadunvalvontadokumentaatio ja tarkastuskriteerit on viimeistelty. Prosessin validointia varten suoritettu koekäyttö.
      deliverables: Tuotantotyökalut, prosessidokumentaatio, QC-tarkastussuunnitelma, koekäyttöraportti
    - stage: '06'
      title: Massatuotanto ja laadunvalvonta
      duration: Meneillään
      description: Täysi tuotanto alkaa prosessin sisäisellä laadunvarmistuksella joka vaiheessa. Ensimmäiset tuotteet tarkastetaan ja hyväksytään ennen erän vapauttamista. Jatkuva laadunvalvonta, vikojen seuranta ja jatkuva parantaminen koko tuotannon elinkaaren ajan.
      deliverables: Tuotantoaikataulu, laadunvalvontaraportit, erän jäljitettävyystiedot, lähetysasiakirjat
content_customization:
  tagline: Räätälöintiasetukset
  title: Mitä voidaan<br />muokata
  subtitle: Lähes kaikki tuotteemme osat voidaan räätälöidä asiakkaan tarpeiden mukaan. Alla on yleisimmät mukautusluokat.
  columns: 3
  items:
    - title: Runko ja rakenne
      description: Mukautettu rungon pituus, palkin leveys, nousukulma, putken halkaisija, kammion kokoonpano ja materiaaliluokka.
      icon: tabler:sailboat
    - title: Värit & Grafiikka
      description: Putken väri (PVC/Hypalon), rungon gelcoat-väri, konsolin väri, kansigrafiikka, logon sijoitus ja pakkaussuunnittelu.
      icon: tabler:palette
    - title: Konsoli ja säätimet
      description: Keskikonsoli, sivukonsoli tai ohjaustanko. Mukautettu kojetaulun asettelu, kytkimien sijoitus ja ruorin asento.
      icon: tabler:steering-wheel
    - title: Istuimet ja verhoilu
      description: Jockey-istuimet, penkkiistuimet, ylelliset verhoilut, väriin sopivat tikkaukset, taitettavat tai irrotettavat kokoonpanot.
      icon: tabler:armchair
    - title: Tarvikkeet ja varusteet
      description: Sukellustikkaat, säiliötelineet, hinauspylväät, T-topit, Bimini-topit, äänijärjestelmät, navigointielektroniikka ja turvalaitteet.
      icon: tabler:backpack
    - title: Pakkaus ja brändäys
      description: Räätälöidyt vähittäismyyntipakkaukset, omien merkkien laatikot, pakkauslaatikot, joissa on tuotemerkit, ripustuslaput ja käyttöoppaat asiakkaan kielellä.
      icon: tabler:box
content_industries:
  tagline: Teollisuuden sovellukset
  title: Teollisuuden suunnitteluratkaisut<br />
  subtitle: Suunnittelutiimimme on kehittänyt tuotteita monenlaisiin merisovelluksiin – jokaisella on omat vaatimukset ja suorituskykykriteerit.
  columns: 3
  items:
    - title: Sukellustoiminnot
      description: Vahvistetut kannet, sukellusportaiden integrointi, säiliöiden säilytysjärjestelmät ja vakaat alustat kaupallisiin sukelluskeskuksiin maailmanlaajuisesti.
      icon: tabler:lifebuoy
    - title: Pelastus ja hätätilanteet
      description: Nopeat runkomallit, itseohjautuvat kannet, laitteiden kiinnitysjärjestelmät ja monikammioiset turvallisuuskokoonpanot SAR-operaatioita varten.
      icon: tabler:alert-triangle
    - title: Merimatkailu
      description: Matkustajien mukavuutta lisäävät asettelut, aurinkosuojan integrointi, lennolle pääsyjärjestelmät ja polttoainetehokkaat konfiguraatiot saarisiirtotoimintoihin.
      icon: tabler:beach
    - title: Tenderit jahteille
      description: Kompaktit mallit taavettivarastointiin, ylelliset viimeistelyvaihtoehdot, yhteensopivat emolaivojen värit ja tehokkaat hinausominaisuudet.
      icon: tabler:sailboat
    - title: Kalastus ja vesiviljely
      description: Tasaiset kokoonpanot, asuinkiinnitys, sauvan pidikkeiden asettelut, korroosionkestävät laitteistot jatkuvaan suolaveden altistukseen.
      icon: tabler:fish
    - title: Satama ja teollisuus
      description: Raskaaseen käyttöön tarkoitettu rungon vahvistaminen, työveneen asettelut, henkilöstön kuljetuskokoonpanot ja laitteiden integrointi offshore-toimintoihin.
      icon: tabler:ship
