reasons:
  tagline: Paddle Board Overstock ero
  title: Mikä erottaa meidät muista
  isBeforeContent: false
  columns: 3
  items:
    - title: Todellista valmistusta, ei kaupankäyntiä
      description: Omistamme ja pyöritämme 12 000 m²:n tehdasta. Kun teet yhteistyötä Paddle Board Overstock:n kanssa, työskentelet suoraan niiden ihmisten kanssa, jotka suunnittelevat, rakentavat ja valmistavat tuotteesi — ilman välikäsiä.
      icon: tabler:building-factory
    - title: Insinöörijohdettu lähestymistapa
      description: Suunnitteluprosessimme alkaa käyttötapauksesta, ei tuotekategoriasta. Optimoimme rungon muodon, materiaalivalinnat ja kokoonpanon sen mukaan, miten laitetta todella käytetään kaupallisissa ympäristöissä.
      icon: tabler:engine
    - title: Sertifioitu laatu
      description: CE sertifioitu, ISO laatujärjestelmä, BSCI vaatimusten mukainen, REACH vaatimusten mukainen, USCG tyyppi III/V hyväksytyt pelastusliivit; kaikki tuotteet täyttävät sovellettavat kansainväliset standardit.
      icon: tabler:certificate
    - title: Joustava OEM/ODM
      description: Putkivärit, konsolin ulkoasu, brändäys, pakkaukset — räätälöimme ne määrittelyjesi mukaan. Ei minimimäärän painetta. Aloita prototyypillä, skaalaa luottavaisin mielin.
      icon: tabler:adjustments
    - title: Globaali logistiikka
      description: Yhdysvaltain varasto Kaliforniassa, suora toimitus Qingdaosta, lentorahti kiireellisille tilauksille. Me hoidamme tullimuodollisuudet ja asiakirjat maailmanlaajuisesti.
      icon: tabler:truck-delivery
    - title: Elinikäinen tuki
      description: Tuemme 20 vuotta sitten rakentamiamme veneitä. Aitoja varaosia, teknistä neuvontaa, korjausohjeita — tiimimme on käytettävissä, kun tarvitset meitä, missä tahansa oletkin.
      icon: tabler:lifebuoy
testimonials:
  tagline: Luotettu ympäri maailmaa olevien brändien toimesta
  title: Mitä kumppanimme sanovat
  items:
    - content: Olemme työskennelleet useiden valmistajien kanssa Kiinassa, mutta Paddle Board Overstock erottuu edukseen insinöörituen ja tasaisen laadun ansiosta. He kohtelevat brändiämme kuin se olisi heidän omaansa.
      name: — OEM Kumppani, eurooppalainen vesiliikuntabrändi
    - content: Heidän Hypalon RIBs on ollut palveluksessa laivastossamme yli 5 vuotta. Vähäinen huolto, erinomainen UV-kestävyys. Putkien 5 vuoden takuu antaa meille luottamusta.
      name: — Laivaston operaattori, Lähi-idän lomakeskusryhmä
    - content: Paddle Board Overstock-tiimi auttoi meitä kehittämään räätälöidyn SUP-levyn suunnittelun konseptista tuotantoon 90 päivässä. Laatu ylitti odotuksemme.
      name: — Jakelija, Australian vesilajit
    - content: Pienenä yrityksen omistajana olin huolissani MOQs. Paddle Board Overstock työskenteli budjettini kanssa ja auttoi minua lanseeraamaan brändini vain 50 laudalla. Nyt tilaan 500.
      name: — Brändin perustaja, Yhdysvallat SUP Vuokrausyritys
cta:
  title: Valmiina rakentamaan vesiliiketoimintaasi?
  subtitle: Ota yhteyttä tiimiimme ilmaista konsultointia varten. Ei sitoumuksia — vain rehellisiä neuvoja laitteista ja valmistuksesta.
  actions:
    - variant: primary
      text: Keskustele tiimimme kanssa
      href: /contact
    - text: Lataa tuotekatalogi
      href: /resources
