materials:
  intro_p1: Puhallettavan vesikulkuneuvon suorituskyky, kestävyys ja turvallisuus riippuvat lähes kokonaan sen valmistuksessa käytetyistä materiaaleista. Kankaasta, joka muodostaa putket, lankoihin, jotka antavat SUP-laudalle jäykkyyden — jokainen materiaalivalinta vaikuttaa tuotteen käyttäytymiseen vedessä ja sen käyttöikään.
  intro_p2: 'Tämä opas kattaa neljä keskeistä materiaalia, joita käytetään nykyaikaisissa puhallettavissa vesikulkuneuvoissa: PVC-kangas, Hypalon CSM-kummi, drop-stitch-ydinrakenne ja EVA-vaahtopinnit. Näiden materiaalien ymmärtäminen auttaa sinua valitsemaan tarpeisiisi sopivan tuotteen ja huoltamaan sitä maksimaalisen käyttöiän saavuttamiseksi.'
  labels:
    advantages: Edut
    limitations: Rajoitukset
    best_for: 'Paras käyttötarkoitus:'
  items:
    - name: PVC (polyvinyylikloridi)
      summary: Teollisuusstandardi virkistyskäyttöön tarkoitetuissa puhallettavissa veneissä ja SUP-lautoissa. Monikerroksinen laminerattu kangas tarjoaa erinomaisen lujuuden ja painon suhteen edulliseen hintaan.
      pros:
        - Edullinen — 30-50 % halvempi kuin Hypalon
        - Kevyt ja helppo käsitellä
        - Hyvä UV-kestävyys oikeilla pinnoitteilla
        - Laaja väri- ja viimeistelyvalikoima
        - Helppo korjata PVC-korjausliusoilla ja liuotinpohjaisella liimalla
      cons:
        - Lyhyempi käyttöikä kuin Hypalonilla (7-10 vuotta)
        - Vähemmän joustava kylmissä lämpötiloissa
        - Heikompi kemikaalinkesto
        - Voi kehittää pehmittimen vaellusta ajan myötä
      best_for: Virkistys-SUP-laudat, edulliset veneet, vuokrauslaivastot, kausikäyttö, makea vesi ja rannikkoympäristöt.
    - name: Hypalon (CSM-kummi)
      summary: Premium-synteettinen kummi, joka tunnetaan poikkeuksellisesta kestävyydestä, UV-kestävyydestä ja pitkästä käyttöiästä. Kultainen standardi kaupallisille ja sotilaskäyttöön tarkoitetuille puhallettaville veneille.
      pros:
        - Poikkeuksellinen UV- ja otsoninkesto
        - Käyttöikä 15-20 vuotta oikein hoidettuna
        - Erinomainen notkeus kylmissä olosuhteissa
        - Ylivoimainen kemikaali- ja öljynkesto
        - Säilyttää värinsä pidempään kuin PVC
      cons:
        - Huomattavasti kalliimpi kuin PVC
        - Raskaampi kangas
        - Vähemmän värivaihtoehtoja
        - Korjaukset vaativat erikoisliimoja
        - Vähemmän tuotantolaitoksia maailmassa
      best_for: Kaupalliset RIB-veneet, etsintä- ja pelastustehtävät, sotilaskäyttö, trooppiset ilmastot, pitkäaikainen laivaston omistus.
    - name: Drop-stitch-ydin
      summary: Teknologia, joka mullisti puhallettavat SUP-laudat. Tuhannet polyesterilangat yhdistävät kankaan ylä- ja alakerrokset mahdollistaen korkeapaineisen puhalluksen kovalaudan suorituskykyyn.
      pros:
        - Erittäin jäykkä 12-20 PSI:ssä
        - Kevyt — 18-30 lbs täysikokoisesta laudasta
        - Taittuu litteäksi säilytystä ja matkustamista varten
        - Erinomainen iskunkestävyys
        - Tasainen suorituskyky kaikissa lämpötiloissa
      cons:
        - Vaatii korkeapainepumpun
        - Reikien korjaus on monimutkaisempaa kuin yksikerroksisissa rakenteissa
        - Korkeampi valmistuskustannus kuin tavallisissa puhallettavissa tuotteissa
        - Paineen lasku ajan myötä vaatii säännöllistä täydennystä
      best_for: Stand up -paddle-laudat, kajakit, puhallettavien veneiden ilmapinnit — kaikki käyttötarkoitukset, joissa vaaditaan jäykkyyttä ja puhallettavaa kannettavuutta.
    - name: EVA-vaahtopinta
      summary: Suljetun solurakenteen EVA-vaahto (etyleeni-vinyyliasetaatti), jota käytetään tartuntapatoihin SUP-lautoilla ja venepinnoilla. Tarjoaa vaimennusta, pitoa ja lämpöeristystä.
      pros:
        - Erinomainen liukumaton pito märkänä ja kuivana
        - Vaimennus vähentää väsymystä pitkillä melontaretkillä
        - Lämpöeristys kylmää pintaa vasten
        - UV- ja merivedenkestävä
        - Saatavilla monivärisinä somitelmina ja laserkaiverrettuina kuvioina
      cons:
        - Voi kulua raskaassa käytössä 2-3 vuoden kuluttua
        - On liimattava oikein delaminaation välttämiseksi
        - Ei rakenteellinen — ei vaikuta jäykkyyteen
        - Lisää hieman painoa (200-400 g per lauta)
      best_for: SUP-laudan pintatarraus, venerungon pinnoitus, kajakin istuimen mukavuus — kaikki pinnat, jotka vaativat liukumattoman tuen.
  selection:
    title: Materiaalinvalintaopas
    subtitle: 'Valitse oikea materiaali ensisijaisen käyttötarkoituksesi perusteella:'
    headers:
      - Käyttötarkoitus
      - Suositeltu materiaali
      - Miksi
    rows:
      - - Virkistys-SUP-melonta
        - Drop-stitch-PVC
        - Kevyt, jäykkä, edullinen — ihanteellinen tasapaino satunnaisille melojille
      - - Perhevene / järvivene
        - PVC (1100 denier)
        - Kustannustehokas, helppo korjata, riittävä kestävyys virkistyskäyttöön
      - - Kaupallinen RIB / partiovene
        - Hypalon CSM
        - Maksimaalinen UV-kestävyys, 15-20 vuoden käyttöikä, kemikaali-/öljynkesto
      - - Vuokrauslaivaston SUP-laudat
        - Drop-stitch PVC + EVA-pinta
        - Kestävä, korjattava, hyvä hinta-laatusuhde runsaassa käytössä
      - - Etsintä- ja pelastusoperaatiot
        - Hypalon CSM
        - Luotettavuus äärimmäisissä olosuhteissa, notkeus kylmässä, kemikaalinkesto
      - - Retki-/retkeilykajakki
        - Drop-stitch-PVC
        - Jäykkä suorituskyky pakattavalla kannettavuudella matkustamiseen
  deep_dive:
    title: Syventävät oppaat
    topics:
      - title: Merikelpoinen PVC
        desc: Monikerroksinen laminerattu PVC-kangas — UV-kestävyys, kulumiskokeet ja denier-arvot selitettyinä.
      - title: PVC vs Hypalon -vertailu
        desc: Puhallettavien veneiden kahden hallitsevan materiaalin perusteellinen vertailu — kustannukset, käyttöikä, UV-kestävyys.
      - title: Drop-stitch-ydin
        desc: Miten tuhannet sisäiset langat luovat jäykkiä korkeapaineisia puhallettavia rakenteita 12-15 PSI:ssä.
      - title: RF-hitsausteknologia
        desc: Suurtaajuushitsaus luo vahvoja ja tasaisia saumoja — miten se toimii ja miksi se on tärkeää.
      - title: PSI ja suorituskyky
        desc: Miksi ilmanpaine merkitsee puhallettaville SUP-lautoille ja veneille — jäykkyys, kuormakapasiteetti ja ajomukavuus.
      - title: Laatutestaus
        desc: Painekokeet, kelluntakokeet, UV- vanheneminen ja tuhoiskokeet — laatuprosessimme.
      - title: EVA-vaahtopinnit
        desc: Suljetun solurakenteen EVA-vaahdosta tehdyt tartuntapaikat — pito, mukavuus ja kestävyys SUP- ja venepinnoille.
      - title: Materiaalien hoito
        desc: Puhdistus, UV-suoja, homeen ehkäisy ja puhallettavien tuotteiden säilytyksen parhaat käytännöt.
