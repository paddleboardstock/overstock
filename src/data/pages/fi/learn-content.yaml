articles:
  sup:
    - title: SUP:n perusteet — opas aloittelijoille
      desc: 'Kaikki, mitä aloittelijan tulee tietää: laudan tyypit, melan koko, asento ja vinkit ensimmäiselle päivälle.'
    - title: SUP-koko-opas
      desc: Löydä oikea pituus, leveys ja tilavuus painosi, taitosi ja melontatyyliisi sopivaksi.
    - title: Puhallettava vai kova lauta
      desc: Kumpi sopii sinulle? Kannettavuus, suorituskyky, kestävyys ja kustannukset vertailtuna.
    - title: Keskitason tekniikat
      desc: Kehitä melontaa edistyneillä melonlyönneillä, kääntötekniikoilla ja kuohkean veden käsittelyllä.
    - title: Miten valitset puhallettavan SUP-laudan
      desc: 'Tärkeimmät tekijät: rakenne, paksuus, evien kokoonpano ja mukana toimitettavat varusteet.'
    - title: Vesiturvallisuus
      desc: 'Välttämätöntä turvallisuustietoa: sään lukeminen, pelastusliivin (PFD) valinta, itsepelastus ja ryhmämelonta.'
  inflatable-boat:
    - title: Materiaalikatsaus
      desc: PVC, Hypalon, drop-stitch, denier-arvot — ymmärrä, mistä puhallettava varusteesi on tehty.
    - title: PVC vs Hypalon -vertailu
      desc: Puhallettavien veneiden PVC- ja Hypalon-kankaiden perusteellinen vertailu — kestävyys, UV-kestävyys ja kustannukset.
    - title: Drop-stitch-ydin selitetty
      desc: Miten tuhannet sisäiset langat luovat jäykän alustan 12-15 PSI:ssä suurtehoisiin puhallettaviin SUP-lautoihin.
    - title: Yleiskatsaus puhallettavaan tekniikkaan
      desc: Miten puhallettavat veneet ja SUP-laudat rakennetaan — materiaalikerroksista venttiilijärjestelmiin ja saumojen hitsaukseen.
    - title: RIB-veneiden (jäykkärunkoinen vene) opas
      desc: Kaikki RIB-rakenteesta, runkotyypeistä, putkien materiaaleista ja oikean RIB-veneen valinnasta tarpeisiisi.
    - title: Puhallettava vene vs RIB
      desc: Keskeiset erot perinteisten puhallettavien veneiden ja jäykkärunkoisten veneiden välillä käyttötarkoituksen mukaan.
  water-safety:
    - title: Vesiturvallisuusopas
      desc: Välttämätöntä turvallisuustietoa jokaiselle melojalle — sää, pelastusliivit (PFD), itsepelastus ja ryhmämelontan protokollat.
    - title: Pelastusliivi- ja PFD-opas
      desc: Miten valitset oikean kelluntavälineen SUP-melontaan, kajakkiin, veneilyyn ja ammattikäyttöön.
    - title: SUP:n turvallisuuschecklist
      desc: Turvallisuuschecklist ennen vesille lähtöä, jota jokaisen stand up -paddlaajan tulisi noudattaa.
    - title: Turvallinen melonta kylmässä vedessä
      desc: Välttämättömät varotoimet, varusteet ja tekniikat melontaan kylmän veden olosuhteissa.
    - title: Aloittelijoiden virheet melonnassa
      desc: Yleiset virheet, joita ensimmäistä kertaa melojat tekevät, ja miten välttää ne turvallisemman ja miellyttävämmän kokemuksen saamiseksi.
    - title: CE-sertifiointi selitetty
      desc: Mitä CE-sertifiointi tarkoittaa puhallettaville vesikulkuneuvoille — standardit, testit ja miksi se on tärkeää turvallisuudelle.
