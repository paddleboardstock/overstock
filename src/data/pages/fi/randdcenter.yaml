hero:
  tagline: T&K-keskus
  title: T & K -keskus
  subtitle: Keskittynyt edistykseen

intro:
  - Paddle Board Overstockin tutkimus- ja kehityskeskus (T&K) on voima, joka ohjaa missiotamme mullistaa vesiurheiluvälineet. Mahdollistamme vesiurheilun harrastajille maailmanlaajuisesti turvallisempia, mukavempia ja nautinnollisempia tuotteita hellittämättömän innovoinnin kautta kumisissa seisomalaudoissa (SUP) ja veneissä. Omistautunut insinööri-, suunnittelija- ja intohimoisien vesiurheilun asiantuntijoiden tiimimme muokkaa teollisuudenalan tulevaisuutta, nostaen jatkuvasti laadun, suorituskyvyn ja kestävyyden rimaa.
  - T&K-tilamme kokoaa yhteen materiaalitieteilijät, laiva-arkkitehdit ja tuotantoinsinöörit saman katon alle. Kankaanformuloinnista ja runkosimulaatiosta hitsausprosessien kehittämiseen ja täysimittaisiin merikokeisiin — jokainen tuotekehityksen vaihe on datalla ohjattu ja testauksella validoitu.

mission:
  tagline: Missiomme
  title: Innovaatioita vesiurheilun tulevaisuuteen
  pillars:
    - icon: lightning
      title: Teknologinen edistys
      desc: Uraauurtavia uusia materiaaleja, muotoiluja ja valmistusta paremman tuotteen suorituskyvyn ja pitkäikäisyyden saavuttamiseksi.
    - icon: design
      title: Käyttäjäkeskeinen muotoilu
      desc: Käyttäjien tarpeiden syvällinen ymmärtäminen ja ylittäminen ergonomisen ja intuitiivisen tuotesuunnittelun avulla.
    - icon: globe
      title: Kestävät käytännöt
      desc: Ympäristöjalanjälkemme minimointi käyttämällä ympäristöystävällisiä materiaaleja ja prosesseja.
    - icon: shield
      title: Tinkimätön turvallisuus
      desc: Korkeimpien turvallisuusstandardien varmistaminen tiukan testauksen ja sertifioinnin avulla.

pillars:
  - title: Teknologinen edistys
    desc: Uraauurtavia uusia materiaaleja, muotoiluja ja valmistusprosesseja paremman tuotteen suorituskyvyn ja pitkäikäisyyden toimittamiseksi.
    icon: tech
  - title: Kehittyneet materiaalit
    desc: Huippuluokan PVC:n, Hypalonin, komposiittien ja kestävien vaihtoehtojen tutkiminen parannettujen tuoteominaisuuksien saavuttamiseksi.
    icon: materials
  - title: Kestävyys
    desc: 'Keskeinen sitoumus: Olemme omistautuneet ympäristövastuullisuuteen kestävän valmistuksen ja kierrätettävien materiaalien kautta.'
    icon: sustainability

capabilities:
  tagline: Kyvykkyydet
  title: T&K-kyvykkyydet
  subtitle: Neljä keskeistä osaamisaluetta, jotka antavat meille täyden hallinnan tuotekehityksestä — raaka-ainetutkimuksesta lopulliseen sertifiointiin.
  groups:
    - title: Materiaalitiede ja kangasteknologia
      items:
        - PVC- ja Hypalon-formulointianalyysi ja optimointi
        - UV-stabilointi, palonestoaine- ja antimikrobisten lisäaineiden kehitys
        - Monikerroskankaan laminointi- ja adheesiotekniikka
        - Nopeutettu ikääntymistestaus (UV, lämpö, kosteus, suolasumu)
    - title: Runkosuunnittelu ja hydrodynamiikka
      items:
        - Parametrinen 3D-runkosuunnittelu ja CFD-optimointi
        - Elementtimenetelmäanalyysi rakenne- ja iskukuormille
        - Pienoismallin allastestaus ja suorituskyvyn validointi
        - Mukautettu runkokehitys erityisiä tehtäväprofiileja varten
    - title: Hitsaus- ja liitosteknologia
      items:
        - RF-dielektrisen hitsausprosessin kehitys ja optimointi
        - Kuumailma-, kuumakiila- ja ultraäänihitsausmenetelmät
        - Liimojen ja saumanauhojen kelpuutus
        - Hitsauslujuuden mallinnus ja käyttöiän ennustus
    - title: Testaus, sertifiointi ja vaatimustenmukaisuus
      items:
        - Laadunhallinta ja CE-vaatimustenmukaisuustestaus
        - Riippumaton kolmannen osapuolen testaus- ja sertifiointituki
        - Mukautettu testausprotokollakehitys hankintakelpuutukseen
        - Käytönaikainen vika-analyysi ja perussyyn tutkimus

