rd_services:
  tagline: Mukautettu T&K
  title: T&K-palvelut kumppaneille
  services:
    - title: Mukautettu materiaalikehitys
      desc: Kehitämme mukautettuja kangasformulaatioita, laminaattipinoja ja liimajärjestelmiä, jotka on räätälöity käyttöympäristöösi ja suorituskykytavoitteisiisi.
    - title: OEM / ODM -tuotesuunnittelu
      desc: Konseptiluonnoksista tuotantovalmiisiin suunnittelupaketteihin — tiimimme voi suunnitella, prototypoida ja validoida veneitä brändisi alla.
    - title: Kolmannen osapuolen testaus ja sertifiointi
      desc: Käytä ISO-yhteensopivia testilaitoksiamme riippumatomaan materiaalitestaukseen, tuotevalidointiin ja sertifiointitukeen.
  cta: Keskustele T&K-tarpeistasi →
  cta_link: /contact

vision:
  tagline: Visiomme
  title: Muokkaamme vesiurheilun tulevaisuutta
  body: Paddle Board Overstock pyrkii johtamaan kumivene- ja SUP-teollisuutta jatkuvan innovoinnin, horjumattoman laadun ja lujan sitoutumisen turvallisuuteen ja kestävyyteen avulla — rikastaen viime kädessä vesiurheilun harrastajien kokemuksia maailmanlaajuisesti. Paddle Board Overstockin T&K-keskus on paikka, jossa intohimo kohtaa innovaation, asettaen uusia standardeja vesiurheiluteollisuudelle.

labs_section:
  tagline: Laboratoriot
  title: Laboratoriomme
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: PVC-kangaslaboratorio
      description: Jatkuva PVC- ja Hypalon-putkikankaiden tutkimus ja testaus vetolujuuden, UV-kestävyyden, kulumisen ja matalan lämpötilan joustavuuden osalta pitkäaikaisen luotettavuuden varmistamiseksi meriympäristöissä.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Runkosuunnittelustudio
      description: CAD-pohjainen muotoilu ja HDPE-, alumiini- ja lasikuituisten runkojen elementtimenetelmäanalyysi. Jokainen runko simuloidaan digitaalisesti jännityksen jakautumisen ja iskunkestävyyden osalta ennen ensimmäisen prototyypin rakentamista.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: RF-hitsauskeskus
      description: Erillinen radiotaajuushitsauslaitos tarkalla lämpötila- ja paineohjauksella, tuottaen lujia, ilmatiiviitä saumoja, jotka ylittävät industristandardit täytettäville aluksille.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Hydrodynaaminen testiallas
      description: Pienoismallitestaus omassa testialtaassamme rungon muodon, liukunopeuden, vakauden ja polttoainetehokkuuden optimoimiseksi eri kuorma- ja meriolosuhteissa.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Prototyyppiverstas
      description: Täysimittainen prototyyppi- ja varustelulaitos, jossa uusia malleja rakennetaan, varustellaan ja koeajetaan. Jokainen prototyyppi käy läpi vähintään 20 tunnin vesitestiohjelman ennen tuotantohyväksyntää.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Laatu- ja tarkastuslaboratorio
      description: Erillinen laadunvarmistuslaboratorio, joka suorittaa vetotestausta, ilmanpysyvyyssykliä, sauman irrotustestejä ja materiaalisertifiointia varmistaakseen, että jokainen verstalta lähtevä vene täyttää julkaistut spesifikaatiomme.
      href: /randdcenter/quality-inspection-lab
