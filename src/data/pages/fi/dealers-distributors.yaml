content_benefits:
  tagline: Kumppanuuden edut
  title: Miksi jakelijat<br />valitsevat Aquafarerin
  subtitle: Kumppanuus on suunniteltu merenkulun jakelijoille, jotka tarvitsevat luotettavaa toimitusta, kilpailukykyisiä katteita ja ammattitaitoista tukea.
  items:
    - title: Alueen suojelu
      description: Pätevien jakelijoiden yksinoikeudelliset tai osittain yksinomaiset alueoikeudet. Markkinakartoitus ja kanavien konfliktien hallinta suojaamaan sijoituksesi Aquafarer-brändin rakentamiseen alueellasi.
      icon: tabler:map-pin
    - title: Kilpailukykyinen tukkuhinta
      description: Porrastettu hinnoittelu perustuu vuotuisiin volyymisitoumuksiin. Marginaalia suojaava hinnoittelurakenne ennakkohintatakuilla ja läpinäkyvillä kustannuserittelyillä (FOB Qingdao -peruste).
      icon: tabler:currency-dollar
    - title: Markkinoinnin tukipaketti
      description: Ammattimainen tuotekuvaus, tekniset tiedot, vaatimustenmukaisuusdokumentaatiomallit, sosiaalisen median sisältö ja yhteisbrändätyt markkinointimateriaalit. Päivitetään vuosittain uusilla tuotelanseerauksilla.
      icon: tabler:photo
    - title: Tekninen koulutus
      description: Tuotekoulutus myyntitiimillesi (virtuaalinen tai paikan päällä), huolto- ja korjauskoulutus huoltoteknikoillesi sekä asiakkaille suunnatut usein kysytyt kysymykset ja vianetsintäoppaat.
      icon: tabler:school
    - title: Varaosat ja jälkimyynti
      description: Erillinen varaosien toimitus etusijalla. Vaihtoputkiosat, venttiilit, rivat ja korjaussarjat saatavilla nopeaa tilausten täyttämistä varten. Warranty claim processing support.
      icon: tabler:tool
    - title: Vaatimustenmukaisuusdokumentaatio
      description: 'Täysi vaatimustenmukaisuusdokumentaatiopaketti markkinoillesi: CE-vaatimustenmukaisuustodistus, rakennuskilven tiedot, omistajan käsikirjat ja viranomaisrekisteröintituki. Poistaa noudattamistasistasi.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Mitä etsimme
  title: Jakelijan<br />vaatimukset
  subtitle: Etsimme kumppaneita, jotka voivat ammattimaisesti edustaa ja tukea Aquafarer-tuotteita alueellaan.
  items:
    - title: Alue- ja markkinatieto
      description: Vakiintunut läsnäolo meri-, vesiurheilu- tai ulkoilumarkkinoilla. Paikallisten säädösten, kuluttajien mieltymysten ja vesikulkuneuvojen jakelukanavien ymmärtäminen.
      icon: tabler:target
    - title: Alan kokemus
      description: Vähintään 2 vuoden kokemus meri-, ulkoilu- tai urheiluvälineiden jakelusta. Todistettu kokemus kansainvälisten tuotemerkkien ja B2B-tukkukaupan kanssa.
      icon: tabler:briefcase
    - title: Showroom tai varasto
      description: Fyysinen tila tuotteiden esittelyyn, varaston varastointiin ja asiakaspalveluun. Kyky ylläpitää demoyksiköitä ja varaosavarastoa alueellasi.
      icon: tabler:building-store
    - title: Sitoutuminen tuotemerkkistandardeihin
      description: Halukkuus ylläpitää Aquafarer-tuotemerkin esittelystandardeja, tarjota asiakastukea palveluprotokollamme mukaisesti ja osallistua vuosittaisiin tuotekoulutuspäivityksiin.
      icon: tabler:star
content_process:
  tagline: Hakemusprosessi
  title: 4-vaiheinen jälleenmyyjä<br />hakuprosessi
  subtitle: Alustavasta tiedustelusta ensimmäiseen lähetykseen – yksinkertainen käyttöönottoprosessi.
  steps:
    - number: '01'
      title: Alkukysely ja pätevyys
      description: Lähetä jakelijahakemuksesi yrityksen tiedot, kiinnostuksen kohteena oleva alue, nykyiset tuotelinjat ja vuosiarviot. Tarkistamme 5 arkipäivän kuluessa.
      timeline: 5 päivää
    - number: '02'
      title: Liiketoimintakatsaus ja ehdot
      description: Virtuaalinen kokous, jossa keskustellaan aluestrategiasta, hinnoittelutasoista ja kumppanuusehdoista. Tarkista markkinasi vaatimustenmukaisuusdokumentaatiovaatimukset. NDA-allekirjoitus tarvittaessa.
      timeline: 1-2 viikkoa
    - number: '03'
      title: Mallitilaus ja arviointi
      description: Tee ensimmäinen näytetilaus (2-5 yksikköä) jakelijahinnoin markkinoiden arviointia ja tiimikoulutusta varten. Mukana täydellinen vaatimustenmukaisuusdokumentaatio ja esittelyn valmistelu.
      timeline: 30-45 päivää
    - number: '04'
      title: Kumppanuuden käynnistäminen ja tuki
      description: Ensimmäinen konttitilaus, jossa alueen suojaus on aktivoitu. Markkinointipaketti toimitettu, myyntitiimi koulutettu ja omistettu asiakaspäällikkö on määrätty. Jatkuvat neljännesvuosittaiset yrityskatsaukset.
      timeline: Meneillään
content_application_docs:
  tagline: Hakemusasiakirjat
  title: Vaihdemyyntihakemukseen<br />tarvittavat asiakirjat
  subtitle: Hakeaksesi Aquafarerin vaihdemyyntisopimusta valmistele seuraavat asiakirjat ja tiedot arviointitiimillemme.
  items:
    - title: Yrityksen rekisteröintitodistus
      description: Voimassa oleva yrityksen rekisteröintiasiakirja, josta käyvät ilmi yrityksen juridinen nimi, rekisteröity osoite ja toimiala, joka kattaa meri-, urheilu- tai ulkoiluvälineiden jakelun.
      icon: tabler:file-text
    - title: Aluekattavuussuunnitelma
      description: Kiinnostava maantieteellinen alue, olemassa oleva vähittäis- tai jakeluverkosto, kohderyhmät sekä ehdotettu vuosivolyymi tuotekategorioittain (RIB, SUP, kajakki).
      icon: tabler:map
    - title: Showroom- tai varastokapasiteetti
      description: Fyysiset tilat tuote-esittelyyn, varastointiin ja asiakaspalveluun. Valokuvat tai pohjapiirrokset, jotka osoittavat demoalueen ja varaosien varastokapasiteetin.
      icon: tabler:building
    - title: Vakuus taloudellisesta suorituskyvystä
      description: 'Pankkireferenssi tai tilinpäätös, joka vahvistaa kyvyn tehdä alkutilaus konttikauppana ja ylläpitää varastoa. Vähimmäisalkutilaus: yksi 20 jalan kontti (10–20 yksikköä, sekoitettuja malleja).'
      icon: tabler:coin
    - title: Jälkimarkkinatuen kapasiteetti
      description: Huoltomiehet, jotka on koulutettu tai koulutettavissa ilmastettavien veneiden huoltoon ja korjaukseen. Kyky käsitellä takuuvaatimukset ja sitoutuminen varaosavarastoon.
      icon: tabler:tool
    - title: Aiempien brändien referenssit
      description: Luettelo tällä hetkellä tai aiemmin jakeluista meri- tai urheiluvälinebrändeistä. Yhteystietoreferenssit saatavilla molemminpuolisella sopimuksella. Startupit ilman aiempaa jakelukokemusta voivat täyttää kriteerit vahvemmalla taloudellisella sitoumuksella.
      icon: tabler:users
faq:
  title: Jälleenmyyntiohjelma – Usein kysyttyjä kysymyksiä
  questions:
    - q: Mikä on jakelijoiden vähimmäistilausmäärä?
      a: Jakelijan MOQ alkaa 10-20 yksiköstä tilausta kohti, ja se on joustava sekamalleille (RIB, puhallettava, SUP). Ensimmäiset 2-5 yksikön näytetilaukset ovat saatavilla jakelijahinnoin markkina-arviointia varten.
    - q: Tarjoatko yksinoikeuksia alueille?
      a: Yksinomaiset alueoikeudet ovat saatavilla päteville jakelijoille, jotka täyttävät vuosittaiset volyymisitoumukset ja ylläpitävät tuotemerkkistandardeja. Puolieksklusiivisia ja ei-yksinoikeudellisia järjestelyjä on myös saatavilla kehittyville markkinoille.
    - q: Millaista markkinointitukea tarjoat?
      a: Tarjoamme kattavan markkinointipaketin, joka sisältää ammattimaisia tuotevalokuvia, tekniset tiedot, vaatimustenmukaisuusdokumentaatiomallit, sosiaalisen median sisältökirjaston ja yhteisbrändättyjä materiaaleja. Päivitetään vuosittain uusilla tuotelanseerauksilla.
    - q: Miten takuuvaateet käsitellään?
      a: 'Jälleenmyyjät toimivat ensimmäisenä yhteyspisteenä takuuvaatimuksissa. Tarjoamme selkeät takuuehdot, valokuvadokumentaatioprotokollat ja nopean vaihto- tai luottokäsittelyn. Takuuehdot: 5 vuoden rajoitettu veneen putkikankaalle/saumoille/rungolle; 2 vuoden SUP ja tarvikkeet.'
    - q: Voinko merkitä Aquafarer-tuotteita yksityisellä tuotemerkilläni?
      a: Kyllä, OEM/ODM-ohjelmamme kautta. Yksityisten merkkien vaihtoehtoja ovat mukautettu putkigrafiikka, konsolibrändi, vähittäismyyntipakkaus ja vaatimustenmukaisuusdokumentaatio tuotemerkkisi alla. Katso lisätietoja OEM/ODM-palvelusivultamme.
    - q: Mitä vaatimustenmukaisuusasiakirjoja jakelijoille sisältyy?
      a: Jokainen lähetys sisältää mallikohtaisen CE DoC:n, rakennuskilven tiedot, omistajan käsikirjat ja lähetysasiakirjat. Tarjoamme myös rekisteröintitukea alueellasi ja autamme paikallisten vaatimustenmukaisuusvaatimusten täyttämisessä.
