hero:
  tagline: 'Vesilläliikkumisen tietämys'
  title: 'Opi'
  subtitle: |
    Oppaita, tutoriaaleja ja syväsukelluksia — kaikki mitä tarvitset vesillä<br />
    liikkumiseen luottavaisesti. Ensimmäisen SUPin valinnasta edistyneiden tekniikoiden hallintaan.
  taglineSection: 'Tietoa jokaiselle melojalle. Aloittelijasta ammattilaiseen.'

featured:
  tagline: 'Esitellyt aiheet'
  title: 'Aloita oppimismatkasi'
  subtitle: 'Olitpa uusi vesiliikunnan parissa tai haluat nostaa taitotasoasi, oppaamme auttavat.'
  items:
    - title: 'SUP-perusteet'
      description: 'Kaikki mitä aloittelijan tarvitsee tietää — lautatyypit, melakoko, asento ja vinkit ensimmäiselle päivälle.'
      icon: 'tabler:lifebuoy'
      href: '/learn/sup'
    - title: 'Kumilauta vs kova lauta'
      description: 'Kumpi sopii sinulle? Vertaamme kannettavuutta, suorituskykyä, kestävyyttä ja hintaa rinnakkain.'
      icon: 'tabler:arrows-left-right'
      href: '/compare/inflatable-vs-hardboard'
    - title: 'Vesiturvallisuus'
      description: 'Olennaista turvallisuustietoa, joka jokaisen melojan tulisi hallita — sää, pelastusliivit, itsensä pelastaminen ja paljon muuta.'
      icon: 'tabler:shield'
      href: '/learn/water-safety'
    - title: 'Materiaaliopas'
      description: 'PVC vs Hypalon, drop-stitch -teknologia, denier-luokitukset — ymmärrä mistä varusteesi on tehty.'
      icon: 'tabler:hexagons'
      href: '/learn/materials'
    - title: 'SUP-koko-opas'
      description: 'Löydä oikea laudan pituus, leveys ja tilavuus painollesi, taidoillesi ja melontatyylillesi.'
      icon: 'tabler:ruler'
      href: '/size-guide'
    - title: 'Keskitasoiset tekniikat'
      description: 'Paranna melontaasi edistyneillä vedoilla, kääntymistekniikoilla ja käsittelyllä epävakaassa vedessä.'
      icon: 'tabler:ripple'
      href: '/learn/intermediate-techniques'

