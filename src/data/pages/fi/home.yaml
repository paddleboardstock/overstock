content_customer_types:
  tagline: Ketä Palvelemme
  title: Lautoja kaikille<br />Eräänlainen meloja
  subtitle: Olipa kyseessä ensimmäinen tai viideskymmeneskin istuntosi, on olemassa kynnyslauta, joka sopii siihen, miten melot.
  items:
    - title: Aloittelijat
      description: Erityisen leveät, vakaat monipuoliset laudat, jotka tekevät ensimmäisestä kerrastasi helpon — useimmat aloittelijat nousevat ylös minuuttien sisällä.
      icon: tabler:swimming
