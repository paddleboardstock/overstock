content_customer_types:
  tagline: Kenelle valmistamme
  title: 'Suunniteltu B2B-ostajille<br />— ei kuluttajille'
  subtitle: 'Paddle Board Overstock valmistaa neljälle asiakastyypille. Kaikilla on erilaiset prioriteetit — ja me vastaamme kaikkiin.'
  items:
    - title: Brändien omistajat / Private Label
      description: 'Räätälöity tuotesuunnittelu, private label -grafiikka, vaatimustenmukaisuusdokumentaatio brändisi alla ja dedikoitu insinöörituki ideasta konttiin asti.'
      icon: tabler:palette
      cta: Pyydä OEM/ODM-tarjous
      cta_href: /request-quotation
    - title: Jakelijat / Tukkukauppiaat
      description: 'Alueensuoja, kilpailukykyiset tukkuhinnat, markkinointipaketit, tuotekoulutus ja kattava vaatimustenmukaisuusdokumentaatio markkinoillesi.'
      icon: tabler:world
      cta: Hae jälleenmyyjäksi
      cta_href: /dealers-distributors
    - title: Lomakeskukset / Vuokraamot
      description: 'Kaupallisen luokan kestävyys, neuvonta laivaston koosta, sekatilauskontit, varaosastrategia ja lomakeskuksen brändätyt varustepaketit.'
      icon: tabler:beach
      cta: Pyydä kaupallinen paketti
      cta_href: /solutions/resorts
    - title: Pelastus / Julkinen sektori / Ammattikäyttö
      description: 'Hypalon/CSM-rakenne, SOLAS-vaatimustenmukaisuusvaihtoehdot, projektiokohtainen sertifiointi, tarjousdokumentaation tuki ja suunnittelu NDA:n turvin.'
      icon: tabler:shield
      cta: Keskustele projektista
      cta_href: /solutions/rescue-watercraft

features:
  id: features
  tagline: OEM/ODM-valmiudet
  title: 'Mitä saat<br />Paddle Board Overstockilta'
  subtitle: 'Suora pääsy tehtaaseen täydellisellä suunnittelu-, laatu- ja vaatimustenmukaisuustuella — ei välitysyritys.'
  columns: 2
  items:
    - title: OEM/ODM-räätälöinti
      description: 'Räätälöity runkosuunnittelu, putkimateriaali (PVC tai Hypalon/CSM), konsolin sijoitus, istuimet, brändäys, värit ja pakkaus. Pienistä muutoksista täysin räätälöityyn rakenteeseen.'
      icon: tabler:adjustments
    - title: Matala MOQ, nopeat näytteet
      description: 'RIB: 2–5 yksikköä (olemassa oleva muotti). SUP: 5–10 yksikköä per SKU. Omat muotit: 200+ yksikköä. Esituotantonäytteet brändäykselläsi 7–14 päivässä.'
      icon: tabler:rocket
    - title: Tuotantokelpoinen laatu
      description: 'Jokainen yksikkö painetestataan 1,25-kertaisella nimellispaineella (PSI) 24–48 tunnin ajan. 99,3 % virheettömiä AQL 2,5 / ISO 2859 -standardin mukaisesti. 100 kohdan laatutarkistuslista joka rungolle.'
      icon: tabler:certificate
    - title: Kattava vaatimustenmukaisuusdokumentaatio
      description: 'CE direktiivin 2013/53/EU (RCD) mukaisesti, ISO 9001:2015 (SGS), BSCI-sosiaalinen auditointi, REACH-vaatimustenmukaisuus, UKCA-merkintä. Mukana mallikohtainen vaatimustenmukaisuusvakuutus ja valmistajakilven tiedot.'
      icon: tabler:file-certificate
    - title: 30–45 päivän toimitusaika
      description: 'Vakiotuotanto 30–45 päivää FOB Qingdao. Prototyypit 7–14 päivässä. Kiireellinen tuotanto mahdollinen. Konttien lastaussuunnitelmat ja ISPM-15-pakkaus sisältyvät.'
      icon: tabler:truck-delivery
    - title: Jälkimyynti & varaosat
      description: '5 vuoden takuu veneisiin/kajakkeihin/RIB-veneisiin, 2 vuoden takuu SUP-lautoihin/tarvikkeisiin. Varaosatoimitukset etuoikeutetulla lähetyksellä. Takuvaatimusten käsittelyn tuki.'
      icon: tabler:lifebuoy

content_categories:
  tagline: Tuotekategoriat
  title: '5 kategoriaa,<br />64 CE-sertifioitua mallia'
  subtitle: '2,4 metrin RIB-tendereistä 15 jalan SUP-lautoihin — kaikki valmistettu Qingdaon ISO 9001 -laitoksellamme.'
  items:
    - title: RIB-veneet
      description: '2,4 m–7,0 m alumiini- tai GRP-rungolla. PVC- tai Hypalon/CSM-putket. CE direktiivin 2013/53/EU mukaisesti. Partio-, sukellus-, pelastus- ja kaupallisia kokoonpanoja.'
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Kumiveneet
      description: '2,0 m–5,0 m alumiinilattialla, vanerilattialla tai ilmapohjalla. Kalastus-, vapaa-ajan ja tender-malleja.'
      icon: tabler:sailboat
      link: /products
    - title: SUP-laudat
      description: '9–15 jalkaa 4 ja 6 tuuman Drop-Stitch-rakenteella. Allround-, retki-, jooga- ja kalastusmalleja. Saatavilla myös kaupalliseen käyttöön.'
      icon: tabler:swimming
      link: /products
    - title: Kajakit
      description: '1–3 hengen täytettävät kajakit. Vapaa-ajan ja retkimallit Drop-Stitch-pohjalla.'
      icon: tabler:kayak
      link: /products
    - title: Turvallisuustarvikkeet
      description: 'CE-sertifioidut pelastusliivit, heittoköydet, korjaussarjat, pumput ja navigointivalot. USCG tyyppi III/V -hyväksytyt pelastusliivit.'
      icon: tabler:lifebuoy
      link: /products

content_workshop:
  isReversed: true
  tagline: Tehtaan vahvuus
  title: 'Auditointivalmis tuotanto<br />Qingdaossa'
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12 000 m²:n ISO 9001 -laitos — oikea valmistaja, ei välitysyritys</h3>
  items:
    - title: 6 erikoistunutta tuotantolinjaa
      description: 'Erilliset linjat RIB-veneille, kumiveneille, SUP-lautoille, kajakeille, turvallisuusvarusteille ja OEM/ODM:lle. Jokaisessa omat QC-tarkistuspisteet ja tuotannonsuunnittelu.'
    - title: 100 % painetestattu
      description: 'Jokainen täytettävä kammio paineistetaan 1,25-kertaiseen nimellispaineeseen (PSI) ja pidetään 24–48 tunnin ajan. Testitulokset liitetään rungon tunnistennumeroon (HIN).'
    - title: Rungon kohtainen jäljitettävyys
      description: 'HIN-tason tuotantorekisterit 21+ kentällä joka rungolle: materiaalierä, hitsaajan ID, painetestin tulos, lopullinen kokoonpano ja toimituskohde.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstockin 12 000 m²:n ISO 9001 -valmistuslaitos Qingdaossa RIB-tuotantolinjoineen

content_compliance:
  tagline: Vaatimustenmukaisuus & laatunäyttö
  title: 'Dokumentoituja näyttöjä,<br />ei pelkkiä väitteitä'
  subtitle: 'Jokainen vaatimustenmukaisuusväite tuetaan mallikohtaisella dokumentaatiolla, jonka voit vahvistaa itse.'
  items:
    - title: ISO 9001:2015 (SGS)
      description: 'Laadunhallintajärjestelmä, jonka on sertifioinut TÜV Rheinland/SGS. Vuosittaiset valvonta-auditoinnit. Dokumentoidut QC-prosessit materiaalien vastaanotosta lähetyksen vapauttamiseen.'
      icon: tabler:certificate
    - title: CE direktiivin 2013/53/EU (RCD) mukaisesti
      description: '64 mallia mallikohtaisilla vaatimustenmukaisuusvakuutuksilla. Vaatimustenmukaisuuden arviointi sovellettavien moduulien mukaisesti. HIN-rekisteröinti ja valmistajakilven tiedot jokaisesta rungosta.'
      icon: tabler:file-certificate
    - title: BSCI-sosiaalinen auditointi
      description: 'Vuosittainen BSCI-auditointi SGS:n suorittamana. Vahvistetut eettiset työskentelykäytännöt, työturvallisuus ja ympäristöhallinta koko laitoksessamme.'
      icon: tabler:users
    - title: REACH & UKCA
      description: 'Kaikki PVC- ja liimamateriaalit täyttävät EU:n REACH-asetuksen vaatimukset. UKCA-merkintä saatavilla Yhdistyneen kuningaskunnan markkinoille. Käyttöturvallisuustiedotteet pyynnöstä.'
      icon: tabler:shield-check

steps:
  title: OEM/ODM-prosessi — toimeksiannosta konttiin
  items:
    - title: 'Vaihe 1: <span class="font-medium">Vaatimukset</span>'
      description: 'Jaa tuotteen tekniset tiedot, kohdemarkkina, määrät ja vaatimustenmukaisuusvaatimukset. Suunnittelutiimimme käsittelee pyynnön 48 tunnin kuluessa.'
      icon: tabler:file-text
    - title: 'Vaihe 2: <span class="font-medium">Tarjous</span>'
      description: 'Saat yksityiskohtaisen tarjouksen, joka sisältää tekniset tiedot, materiaalivaihtoehdot, MOQ:n, hinnat, toimitusajan ja vaatimustenmukaisuuden laajuuden markkinoillesi.'
      icon: tabler:clipboard-list
    - title: 'Vaihe 3: <span class="font-medium">Prototyyppi</span>'
      description: 'Esituotantonäyte brändäykselläsi 7–14 päivässä. Täydelliset laatutestit 1,25-kertaisella nimellispaineella. Näytteen kulu hyvitetään tuotannosta.'
      icon: tabler:settings
    - title: 'Vaihe 4: <span class="font-medium">Tuotanto</span>'
      description: '30–45 päivän tuotanto FOB Qingdao näytteen hyväksynnän jälkeen. Prosessin aikaiset QC-tarkistuspisteet, painetestit ja 100 kohdan lopputarkastus jokaisesta yksiköstä.'
      icon: tabler:building-factory
    - title: 'Vaihe 5: <span class="font-medium">Toimitus</span>'
      description: 'Kontin lastaussuunnitelma, ISPM-15-puupakkaus, vaatimustenmukaisuusdokumentaatiopaketti ja FOB Qingdao -lähetys täydellisillä vientiasiakirjoilla.'
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstockin OEM/ODM-valmistusprosessi kumiveneille — suunnittelusta konttitoimitukseen

blog_latest:
  title: Näkemyksiä toimialalta ja tekniikasta
  information: |
    RCD-vaatimustenmukaisuusoppaat, OEM/ODM-prosessiartikkelit, materiaalivertailut
    ja tehtaantarkastusresurssit Paddle Board Overstockin suunnittelutiimiltä.

faqs:
  title: B2B-hankinnan UKK
  subtitle: 'Brändien, jakelijoiden ja kaupallisten toimijoiden yleisimmät kysymykset OEM/ODM-valmistuksesta Paddle Board Overstockin kanssa.'
  columns: 2
  items:
    - title: Oletteko valmistaja vai välitysyritys?
      description: 'Olemme vertikaalisesti integroitu tehdas, jolla on täysi hallinta laatuun, materiaaleihin ja toimitusaikoihin. Toimilupa ja tuotannon laajuus ovat varmistettavissa tehtaanauditoinnissa.'
      icon: tabler:building-factory
      category: all
    - title: Miten OEM/ODM-prosessinne etenee?
      description: 'Vaatimusten arvioinnista (48 h) tarjoukseen, prototyyppiin (7–14 päivää) ja tuotantoon (30–45 päivää FOB Qingdao). Koko ajan mukana täysi suunnittelutuki, vaatimustenmukaisuusdokumentaatio ja rungon kohtainen jäljitettävyys.'
      icon: tabler:route
      category: all
    - title: Mitkä ovat MOQ-vaatimuksenne?
      description: 'RIB-veneet: 2–5 yksikköä per malli (olemassa oleva muotti), 200+ omille muoteille. SUP-laudat: 5–10 yksikköä per SKU. Sekatilauskontit mahdollisia. Näytetilaukset 2–5 yksiköstä arviointia varten.'
      icon: tabler:sort-ascending
      category: all
    - title: Mitä mukautusvaihtoehtoja on saatavilla?
      description: 'Runkosuunnittelu, putkimateriaali (PVC tai Hypalon/CSM), putken halkaisija, konsolin sijoitus, istuimet, ohjaus, polttoainejärjestelmä, kansirakenne, brändivärit, logografiikka, EVA-maton suunnittelu, vähittäispakkaus ja ohjekirjan brändäys.'
      icon: tabler:adjustments
      category: all
    - title: Mitkä vaatimustenmukaisuusasiakirjat voitte toimittaa markkinoilleni?
      description: 'CE-vaatimustenmukaisuusvakuutus direktiivin 2013/53/EU mukaisesti, UKCA-merkintä, ISO 9001 -sertifikaatti (SGS), BSCI-auditointiraportti, REACH-vaatimustenmukaisuus, materiaalitestiraportit, painetestilokit ja mallikohtaiset valmistajakilven tiedot. Markkinakohtainen dokumentaatio pyynnöstä.'
      icon: tabler:file-certificate
      category: all
    - title: Mikä on näytteiden ja tuotannon toimitusaika?
      description: 'Esituotantonäytteet: 7–14 työpäivää. Vakiotuotanto: 30–45 päivää FOB Qingdao. Kiireellinen tuotanto saatavilla lisämaksusta. Kiireisinä aikoina (maaliskuu–kesäkuu) toimitusajat voivat pidentyä.'
      icon: tabler:clock
      category: all
    - title: Voinko järjestää tehtaanauditoinnin tai live-videokierroksen?
      description: 'Kyllä. Paikan päällä tapahtuvat auditoinnit Qingdaon laitoksessamme ovat tervetulleita 3–5 päivän varoitusajalla. Live-videokierrokset WhatsAppin/Zoomin kautta ovat heti saatavilla. Kolmannen osapuolen tarkastukset (SGS, BV, TÜV) ovat mahdollisia.'
      icon: tabler:video
      category: all
    - title: Mitä laaduntarkastuksia suoritetaan ennen lähetystä?
      description: 'Paineenpitotesti 1,25-kertaisella nimellispaineella (24–48 h), saumojen kuorintatesti, 100 kohdan lopputarkastuslista, mittojen varmistus, kosmeettinen tarkastus, vaatimustenmukaisuusdokumentaation vahvistus ja pakkauksen eheyden tarkistus. Kaikki ISO 9001 -menettelyjen mukaisesti.'
      icon: tabler:clipboard-check
      category: all

