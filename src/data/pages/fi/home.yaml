      cta_href: /supboard
    - title: Perheet
      description: Vakaita lautoja, joita koko perhe voi jakaa, sekä kevyempiä lasten malleja — varusteet, jotka mahtuvat autoon ja täyttyvät minuuteissa.
      icon: tabler:beach
      cta: Osta Perhepaketteja
      cta_href: /products
    - title: Kiertely- ja kuntoiluilijat
      description: Pidemmät, nopeammat kiertelylaudat ja kokolattiajoogatason laudat etäisyyttä kuluttaville melojille.
      icon: tabler:route
      cta: Osta Kiertely- ja Joogalaudat
      cta_href: /supboard
    - title: Kalastajat
      description: Erittäin vakaat tasot varustetelineillä ja tilalla viileälle — heitä siimaa hiljaiselta, tasaiselta kannelta.
      icon: tabler:lifebuoy
      cta: Osta Kalastus SUPs
      cta_href: /products
features:
  id: features
  tagline: Miksi Ostaa Paddle Board Overstock
  title: Aito Tehdas,<br />Aito Säästö
  subtitle: Tehdassuorat ylijäämät ja loppuunmyyntipaketit SUP — sertifioitu laatu ilman vähittäismyyntilisää.
  columns: 2
  items:
    - title: Jopa 60% Alennusta Vähittäishinnasta
      description: Myymme tehtaan ylijäämää ja loppuunmyyntierät suoraan — ilman välikäsiä, ilman vähittäismyyntilisää. Samat laudat, jotka myydään täyteen hintaan muualla, myynnissä poistohintaan täällä.
      icon: tabler:rocket
    - title: Täydelliset Paketit
      description: 'Jokainen SUP tulee täydellisenä pakettina: lauta, matkareppu, käsipumppu, säädettävä mela, irrotettava piikki, rullaletku ja korjaussarja.'
      icon: tabler:clipboard-list
    - title: Sertifioitu laatu
      description: 13 CE-sertifioitua SUP-mallia sovellettavien EU-direktiivien mukaan. Jokainen lauta on 100% paine-testattu 1,25x arvioidusta PSI ennen lähettämistä. 99,3% virheettömyys AQL 2.5 mukaan.
      icon: tabler:certificate
    - title: Ei MOQ — Tilaa Yksi Lauta
      description: Ylijäämän loppuunmyynti tarkoittaa, että yksittäiset tilaukset ovat tervetulleita. Lisää lauta ostoskoriin, viimeistele tilaus, valmis. Ei minimimäärää, ei tarjousprosessia.
      icon: tabler:adjustments
    - title: Nopea Maailmanlaajuinen Toimitus
      description: Varastossa olevat tilaukset lähetetään Weihai’sta 2–3 arkipäivän kuluessa. Seurattava toimitus 50+ maahan EU:ssa, Pohjois-Amerikassa, Aasian ja Tyynenmeren alueella ja muualle.
      icon: tabler:truck-delivery
    - title: 2 vuoden SUP takuu
      description: Jokainen SUP lauta ja lisävaruste on katettu 2 vuoden ajan — drop-stitch saumat, täyttöventtiilit ja lisävarusteet mukaan lukien. Vaatimukset ratkaistaan päivissä, ei viikoissa.
      icon: tabler:lifebuoy
content_categories:
  tagline: Tuotekategoriat
  title: Yksi Tuotelinja,<br />Tehty Oikein
  subtitle: Ilmatäytteiset SUP laudat ja lisävarusteet — kaikki valmistettu Weihai’n ISO 9001-laitoksessamme.
  items:
    - title: SUP-laudat
      description: Kaiken kaikkiaan ilmatäytteinen SUPs 9–12 ft. Vakaa, kestävä ja varustettu pumpulla, mailalla, hihnalla ja repulla.
      icon: tabler:swimming
      link: /supboard
    - title: Kiertue SUPs
      description: Pidemmät, nopeammat laudat, joissa on kiertoraivat järville, joille ja rannikkotutkimukselle.
      icon: tabler:route
      link: /supboard
    - title: Jooga ja kuntoilu SUPs
      description: Erittäin leveät, erittäin vakaat alustat, joissa on täyspitkät kansialustat joogaa ja treenejä varten vedessä.
      icon: tabler:users
      link: /supboard
    - title: Lapset SUPs
      description: Kevyemmät, lyhyemmät laudat lapsille – sama drop-stitch laatu lapsiystävällisessä paketissa.
      icon: tabler:lifebuoy
      link: /products
    - title: Lisävarusteet
      description: Pumput, melat, pelastusliivit, hihnat, korjaussarjat ja varaosat jokaiselle myymäämme laudalle.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Tehtaan vahvuus
  title: Miksi meidän myyntihinnat<br />Ovat todellisia
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Todellinen tehdas, todelliset säästöt — jokainen lauta lähetetään Weihain toimipisteestämme</h3>
  items:
    - title: Samat tuotantolinjat kuin suurilla merkeillä
      description: 12 000 m²:n Weihai-tehtaamme valmistaa kansainvälisille brändeille lautoja sekä omia ylimääräisiä erämme samoilla linjoilla samoilla materiaaleilla.
    - title: 100 % paine testattu
      description: Jokainen lauta on paineistettu 1,25-kertaiseksi PSI ja pidetään valmiina ennen lähtöä. 99,3 % virheetön aste AQL per 2,5 / ISO 2859.
    - title: Ei välikäsiä
      description: Laudat toimitetaan tehtaalta suoraan kotiovellesi. Ei jakelijan hinnankorotusta, ei vähittäismyyntikatetta — näin alennushinnat pysyvät jopa 60 % vähittäishinnan alempana.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock 12 000 m² Weihain tehdas ilmatäytteisillä SUP tuotantolinjoilla
content_compliance:
  tagline: Vaatimustenmukaisuus ja laadunvarmistus
  title: Sertifioitu laatu,<br />Dokumentoitu
  subtitle: Jokainen vaatimustenmukaisuusvaatimus perustuu varmenteisiin ja mallikohtaisiin dokumentaatioihin, jotka ovat saatavilla varmennukseen.
  items:
    - title: EN ISO 9001:2015
      description: Laadunhallintajärjestelmä, sertifioitu TÜV Rheinlandin SGStoimesta. Vuosittaiset valvontaauditoinnit. Dokumentoidut laadunvalvontaprosessit saapuvasta materiaalista lähetyksen vapautukseen.
      icon: tabler:certificate
    - title: CE Sertifioitu
      description: 13 CE-sertifioitua SUP-mallia soveltuvien EU-direktiivien mukaisesti, jokaisella mallikohtainen vaatimustenmukaisuusvakuutus ja valmistajan kilpitiedot.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Kaikki PVC ja liimamateriaalit täyttävät EU REACH :n säädöksen.UKCA merkinnät ovat saatavilla Iso-Britannian markkinoille. Materiaalin turvallisuustiedotteet pyynnöstä.
      icon: tabler:shield-check
    - title: 2 vuoden SUP takuu
      description: Jokainen SUP lauta ja lisävaruste on korvattu kahden vuoden ajan — drop-stitch saumat, täyttöventtiilit ja tarvikkeet mukaan lukien. Korvausvaatimukset ratkaistu nopeasti.
      icon: tabler:lifebuoy
steps:
  title: Kassalta veteen — Kuinka tilauksesi toimitetaan
  items:
    - title: Vaihe 1:<span class="font-medium">Valitse lauta</span>
      description: Valitse all-around-, touring-, jooga- ja lasten malleista. Ostajan oppaamme auttavat sinua valitsemaan lautakoon ja tyylin sopivaksi melontaasi varten.
      icon: tabler:clipboard-list
    - title: Vaihe 2:<span class="font-medium">Turvallinen maksaminen</span>
      description: Maksa turvallisesti Stripellä tai PayPalilla. Kaikki suuret luotto- ja pankkikortit hyväksytään. Tiliä ei tarvita — tilausvahvistus saapuu sähköpostiisi.
      icon: tabler:file-text
    - title: Vaihe 3:<span class="font-medium">Laadunvalvonta</span>
      description: Jokainen levy testataan 100 % paineella 1,25-kertaisella nimellisarvolla PSI ja tarkistetaan täydellistä laatulomaketta vastaan ennen pakkaamista.
      icon: tabler:settings
    - title: Vaihe 4:<span class="font-medium">Nopea lähetys</span>
      description: Varastossa olevat tilaukset lähetetään Weihain tehtaaltamme 2–3 arkipäivän kuluessa. Kiireellisiä tilauksia varten on saatavilla pikakäsittely.
      icon: tabler:building-factory
    - title: Vaihe 5:<span class="font-medium">Seurattu lähetys</span>
      description: Seurattu maailmanlaajuinen toimitus 50+ maahan. 2 vuoden takuu ja nopea jälkimyyntituki alkavat sinä päivänä, kun laudallesi saapuu.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP tilausprosessi turvallisesta kassasta maailmanlaajuiseen seurattuun toimitukseen
blog_latest:
  title: SUP Oppaat ja tekniset näkemykset
  information: |
    Osto-oppaat, melontatekniikka, turvallisuuden perusasiat ja rakentaminen
    tutkimus Paddle Board Overstock-tiimiltä.
faqs:
  title: SUP Tilaus- ja tuotetukikysymykset
  subtitle: Yleisiä kysymyksiä liittyen meidän ale-SUP-lautamme, tilaukseen, maksamiseen, toimitukseen ja takuuseen.
  columns: 2
  items:
    - title: Onko SUP vaikea oppia?
      description: Ei lainkaan. Useimmat aloittelijat nousevat seisomaan ja melaavat ensimmäisen harjoituskertansa aikana. Kaikki monipuoliset SUP lautamme sisältävät erityisen leveät, vakaat alustat, jotka on suunniteltu nimenomaan ensikertalaisille melojille. Aloita tyynellä vedellä, ja olet risteilemässä minuutissa.
      icon: tabler:swimming
      category: sup
    - title: Mikä on painoraja?
      description: Kaikenkattava SUPs-tukemme kestää jopa 220 paunaa ja touring- ja joogatasot kestävät jopa 250 paunaa. Jokaisella tuotesivulla on ilmoitettu tarkka käyttäjän painoraja, jotta voit valita laudat tarpeidesi mukaan.
      icon: tabler:adjustments
      category: sup
    - title: Voinko matkustaa mukana ilmatäytteisen SUP?
      description: Täysin. Jokainen Paddle Board Overstock lauta mahtuu reppukokoiseen kantolaukkuun. Painoltaan vain 18-22 paunaa, se on helppo kantaa rannalle, järvelle tai lentokentän terminaalien läpi. Tarkista lentoyhtiösi matkatavarasäännöt ennen matkaa.
      icon: tabler:truck-delivery
      category: sup
    - title: Mitä laatikossa tulee?
      description: Jokainen Paddle Board Overstock SUP sisältää laudan, matkalaukun, käsipumpun, säädettävän melan, irrotettavan pyrstön, kierrelenkin ja korjaussarjan.
      icon: tabler:clipboard-list
      category: sup
    - title: Miksi hintasi ovat alhaisemmat kuin vähittäismyyntihinnat?
      description: Myymme tehtaan ylijäämä- ja loppuerät suoraan omasta tuotantolaitoksestamme Weihai'ssa, Kiinassa — ilman välikäsiä, ilman jälleenmyyntihintaa. Tämä tarkoittaa täydellisiä SUP-paketteja jopa 60 % alennuksella tavanomaisista vähittäishinnoista, ja samaa CE-sertifioitua laatua.
      icon: tabler:certificate
      category: orders
    - title: Miten teen tilauksen ja maksan?
      description: Lisää SUP-pakettisi ostoskoriin ja maksa turvallisesti Stripellä tai PayPalilla. Hyväksymme kaikki suuret luotto- ja pankkikortit. Jokainen tilaus vahvistetaan sähköpostitse täydellisen laskun kanssa.
      icon: tabler:file-text
      category: orders
    - title: Toimitatteko maailmanlaajuisesti?
      description: Kyllä. Lähetämme 50+ maahan ympäri EU:ta, Pohjois-Amerikkaa, Aasia-Tyyntä valtamerta, Lähi-itää ja Afrikkaa. Varastossa olevat tilaukset toimitetaan tyypillisesti 2–3 arkipäivän kuluessa, ja jokaiselle paketille annetaan seurantatunnus.
      icon: tabler:route
      category: orders
    - title: Minkä takuun SUP-levyt sisältävät?
      description: 'Jokainen SUP-lauta ja lisävaruste kuuluu 2 vuoden takuun piiriin — mukaan lukien itse lauta, drop-stitch-saumat ja täyttöventtiilit. Vaatimukset käsitellään päivissä, ei viikkoina: tee ilmoitus verkossa, niin me korjaamme tai vaihdamme.'
      icon: tabler:lifebuoy
      category: orders
