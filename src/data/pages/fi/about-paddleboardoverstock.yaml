values:
  - title: Laatu ensin
    desc: Jokainen tehtaalta lähtevä vene läpäisee pakollisen ilmanpysyvyyden, sauman vetolujuuden ja järjestelmien testauksen ennen lähetystä.
  - title: Vertikaalinen integraatio
    desc: Hallitsemme jokaista vaihetta — PVC-leikkauksesta loppukokoonpanoon — eliminoiden alihankkijoiden tehottomuuden ja varmistaen tasaisen laadun.
  - title: Turvallisuus on standardi
    desc: CE-sertifiointi on ydin siinä, mitä rakennamme. 64 CE-sertifioitua malliamme täyttää EU:n turvallisuusstandardit virkistys- ja kaupalliseen käyttöön.
  - title: Kumppanikeskeisyys
    desc: Rakennamme pitkäaikaisia suhteita OEM-, ODM- ja yksityisen etiketin kumppaneiden kanssa läpinäkyvyyden, luotettavuuden ja yhteisen kasvun kautta.
services:
  - title: OEM-valmistus
    desc: Valmistamme sinun määrittelyjesi mukaan. Jaa piirustuksesi, ja insinööritiimimme hoitaa prototyyppauksen, työkalujen valmistuksen ja tuotannon.
  - title: ODM-ratkaisut
    desc: Aloita todistetuista alustasuunnitelmistamme. Räätälöi koko, väri, grafiikka ja pakkaus luodaksesi ainutlaatuisen tuotelinjasi.
  - title: Yksityinen etiketti
    desc: Sinun brändisi nimi, logosi, pakkauksesi. Tuotteet saapuvat vähittäismyyntivalmiina täydellä brändi-integraatiolla.
  - title: Räätälöity brändäys
    desc: Kansipohjan painatus, runkografiikka, putkidekalit ja räätälöidyt tarrat — yhtenäinen brändiläsnäolo jokaisella pinnalla.
certifications:
  - name: CE-sertifiointi
    desc: Veneemme ja vesikalustomme täyttävät EU:n virkistysvesialusdirektiivin (2013/53/EU) ja asiaankuuluvat yhdenmukaistetut standardit.
    scope: Veneet ja vesikalusto
  - name: null
    desc: Laadunhallintajärjestelmä sertifioitu kumiveneiden suunnitteluun, valmistukseen ja jakeluun.
