  subtitle: Pystysuunnassa integroitu urheiluvälinevalmistaja — raaka-aineesta valmiiseen veneeseen
intro:
  - 'Paddle Board Overstock perustettiin vuonna 2012 yhdellä tehtävällä: suunnitella ja valmistaa vesiliikuntavarusteita, jotka suoriutuvat yhtä hyvin vedellä kuin laaturaportissa. Se, mikä alkoi keskittyneenä SUP-lautapajana, on kasvanut 12 000 neliömetrin integroiduksi tuotantolaitokseksi Qingdaon talouskehitysalueella, valmistaen kumiveneitä, RIB-veneitä, kajakkeja, SUP-lautoja, turvallisuusvarusteita ja tarvikkeita asiakkaille yli 50 maassa.'
  - Nykyään Paddle Board Overstock toimii tehdasbrändinä — suunnittelemme, insinöörimme, prototyyppaamme, valmistamme ja testaamme kaiken saman katon alla. Tämä vertikaalinen integraatio antaa meille suoran hallinnan materiaalivalinnasta, rakennuslaatuun ja toimitusaikatauluihin. Jokaisen veneen rakentavat meidän ihmiset, meidän laitteillamme, meidän standardeillamme.
  - Palvelemme virkistyskäyttäjiä, kaupallisia toimijoita, valtion virastoja ja brändikumppaneita maailmanlaajuisesti. OEM- ja ODM-ohjelmamme auttavat yrityksiä lanseeraamaan omia tuotelinjojaan ilman investointeja tehdasinfrastruktuuriin. Tarvitsitpa yhden prototyypin tai täyden tuotantoerän, tiimimme ohjaa sinut konseptista merivalmiiseen toimitukseen.
