features3_brand:
  tagline: Keitä olemme
  title: Brändisäätiö ja<br />perintö
  subtitle: Tarina, asiantuntemus ja maailmanlaajuinen kattavuus määrittelevät Aquafarerin luotetuksi laivavarusteiden valmistajaksi.
  isBeforeContent: false
  columns: 3
  items:
    - title: Tietoja Aquafarerista
      description: Perustettu vuonna 2012 Qingdaossa, Kiinassa. Rannikkopajasta 12 000 m²:n tilaan – täydellinen Aquafarer-tarina.
      icon: tabler:building-factory
      link: /about
    - title: Brändin tarina
      description: Meriinsinöörien tiimi päätti tehdä ammattitason puhallettavat vesikulkuneuvot saataville maailmanlaajuisesti.
      icon: tabler:book
      link: /brand-story
    - title: Meriteollisuuden asiantuntemus
      description: Syvä materiaalitiede, tarkkuusvalmistus ja todelliset testaukset – vuosikymmenten venesuunnittelu jokaisessa rungossa.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Globaali läsnäolo
      description: Palvelee yli 50 maata jokaisella mantereella. Alueellista asiantuntemusta paikallisten sääntelyvaatimusten ja markkinapreferenssien osalta.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Miksi Aquafarer
      description: Mikä erottaa meidät muista – laatu, räätälöinti, suora tehdashinnoittelu ja päästä päähän -tuki kaupallisille operaattoreille.
      icon: tabler:star
      link: /brand-why-aquafarer
    - title: Meidän tiimi
      description: Tapaa johto – meriinsinöörit, materiaalitutkijat ja valmistusasiantuntijat, jotka vievät Aquafareria eteenpäin.
      icon: tabler:users
      link: /brand/team
    - title: Insinööritiimi
      description: 78+ yhdistettyä T&K-vuotta, 40+ alustaa, 12 sertifikaattia, 1200+ OEM-projektia. Tekninen tiimi jokaisen tuotteen takana.
      icon: tabler:engine
      link: /engineering-team
    - title: T&K-keskus
      description: Rungon suunnittelu, RF-hitsaus, PVC-laboratorio, prototyyppien valmistus, testisäiliö ja laatulaboratorio – täydellinen tutkimus- ja kehitysyksikkömme.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Luottamus & Laatu
  title: Sertifikaatit, laatu<br />ja todisteet
  subtitle: Riippumattomat sertifioinnit, tiukat testaukset ja todelliset todisteet osoittavat sitoutumisemme laatuun.
  isBeforeContent: false
  columns: 3
  items:
    - title: Sertifikaatit
      description: CE, ISO 9001, UKCA, BSCI, REACH – täydellinen sertifiointidokumentaatio ja vaatimustenmukaisuus maailmanlaajuisille markkinoille.
      icon: tabler:shield-check
      link: /certifications
    - title: Laatu ja testaus
      description: Jokainen tuote painetestattu ennen toimitusta. Sauman lujuus, UV-kestävyys, kelluvuus – tarkastettu joka vaiheessa.
      icon: tabler:clipboard-check
      link: /quality
    - title: Todisteet ja todisteet
      description: Testitulokset, käyttöönottokuvat, kolmannen osapuolen tarkastusraportit ja tapaustutkimukset, jotka vahvistavat Aquafarer-laadun.
      icon: tabler:file-check
      link: /evidence
    - title: Tietograafi
      description: Tutustu Aquafarer-entiteettikaavioon – tuotteisiin, tekniikoihin, sertifiointeihin ja suhteisiin yhdistetyssä tietokannassa.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Johtajuus
  title: Tapaa tiimi<br />Aquafarerin takana
  subtitle: Alan osaamista, joka kattaa meritekniikan, materiaalitieteen, laadunhallinnan ja maailmanlaajuisen B2B-kaupan.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu – perustaja ja toimitusjohtaja
      description: 15+ vuotta laivateollisuudessa. Aiemmin johtanut tutkimus- ja kehitystyötä suuressa kiinalaisessa venevalmistajassa. Sillä on useita patentteja kumiveneen suunnittelussa.
      icon: tabler:crown
    - title: Zhang Wei - pääinsinööri
      description: Yli 20 vuotta PVC/Hypalon-valmistuksessa ja syvän V-rungon suunnittelussa. Entinen tekninen johtaja eurooppalaisessa laivasuunnitteluyrityksessä.
      icon: tabler:engine
    - title: Chen Ming – T&K-johtaja
      description: Materiaalitieteen tohtori. Erikoistunut drop-stitch-tekniikkaan ja suurtaajuushitsaukseen. 10+ vuotta tekstiilikomposiiteissa.
      icon: tabler:flask
    - title: Liu Qiang – tuotantojohtaja
      description: Yli 18 vuotta kevyessä valmistuksessa. Six Sigma musta vyö. Otettiin käyttöön ISO 9001 laatujärjestelmät kaikilla tuotantolinjoilla.
      icon: tabler:settings
    - title: Wang Fang – laatupäällikkö
      description: Yli 12 vuotta merenkulun laadunvalvonnassa. Sertifioitu CE ja ISO auditoija. Valvoo jokaisen tuotanto-erän testausta.
      icon: tabler:shield-check
    - title: Helen Lee – myyntijohtaja
      description: 15+ vuotta kansainvälisessä B2B-kaupassa. Hallinnoi OEM/ODM-kumppanuuksia yli 30 maassa. Sujuva 4 kieltä.
      icon: tabler:briefcase
cta:
  title: Haluatko vahvistaa valtuustietomme?
  subtitle: Ota meihin yhteyttä saadaksesi todistuskopioita, kolmannen osapuolen tarkastusraportteja tai varata tehdaskäynti.
  actions:
    - variant: primary
      text: Pyydä tunnistetiedot
      href: /contact
    - text: Näytä sertifioinnin tiedot
      href: /certifications
