hero:
  tagline: Auktoriteettikeskus
  title: Miksi Aquafarer?<br />Yli vuosikymmenen ajan rakennettu luottamus
  subtitle: Jokainen rakentamamme vene kantaa yli 10 vuoden venesuunnittelun, sertifioitujen laatujärjestelmien ja tuhansien menestyksekkäiden toimintojen painon maailmanlaajuisesti. Tästä syystä alan ammattilaiset valitsevat Aquafarerin.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarerin laivojen tuotantolaitos ja insinööritiimi
