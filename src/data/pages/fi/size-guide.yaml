how_to_choose:
  title: Kuinka valita oikea koko
  cards:
    - title: SUP-laudat
      description: Valitse pituus painosi ja käyttötarkoituksen mukaan. Leveämmät laudat (32"+) tarjoavat enemmän vakautta. Pidemmät laudat (11-12 jalkaa) kulkevat paremmin retkikäytössä. Raskaammat melojat tarvitsevat suurempaa tilavuutta.
    - title: Kajakit
      description: Yksittäiskajakit (9 jalkaa) ovat parhaita yksinmatkailuun ja joille. Tandemkajakit (12 jalkaa) mahtuu kaksi melojaa tai yksi aikuinen varusteineen. Tarkista painokapasiteetti mukaan lukien varusteet.
    - title: Dinghyt ja RIB-veneet
      description: Valitse dinghyn pituus matkustajamäärän ja käyttötarkoituksen mukaan. Suuremmat RIB-veneet (4,5 m+) sopivat merelle ja pelastustehtäviin. Pienemmät dinghyt (2,7 m) toimivat apuveneinä ja kalastusalustana.
