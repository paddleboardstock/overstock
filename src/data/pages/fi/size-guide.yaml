hero:
  title: Koko- ja tekniset tiedot
  subtitle: Mitat, kapasiteetit ja suositellut käyttötarkoitukset jokaiselle Paddle Board Overstock-tuotteelle.

categories:
  inflatable: Kumiveneet ja kajakit suunniteltu kannettavuuteen suorituskyvystä tinkimättä. Valitse oikea koko painosi ja melontatyyliisi sopivaksi.
  rib: Jäykkärunkoiset kumiveneet rannikkonavigointiin, partiointiin ja ammattimaiseen merenkulkuun. Valitse pituuden ja moottoritehon mukaan.
  accessory: Tarvikkeet ja turvavarusteet vesiliikenteen täydennykseksi. Yleiskokoiset useilla vaihtoehdoilla.

