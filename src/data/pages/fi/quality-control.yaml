  title: Laadunvalvontajärjestelmä<br /> OEM merenkulun valmistukseen
  subtitle: Monivaiheinen tarkastusprosessi, joka kattaa saapuvat materiaalit, prosessissa olevan tuotannon, painekoetestauksen, lopullisen kokoonpanon ja ennen lähettämistä tapahtuvan tarkastuksen. Jokainen erä on jäljitettävissä, jokainen testi kirjataan.
