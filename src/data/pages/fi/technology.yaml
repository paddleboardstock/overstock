testimonial:
  quote: Se, mikä erottaa Aquafarer muista, on heidän materiaalitiede. He eivät vain kokoa komponentteja – ne suunnittelevat PVC-yhdisteet, hitsausparametrit ja rakenteiden kokoonpanon talon sisällä. Tämä vertikaalinen integraatio näkyy lopputuotteessa.
  author: David Park
  title: Tuotekehityspäällikkö
  company: Bluewater Sports Equipment
  location: Australia

