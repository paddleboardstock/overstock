hero:
  tagline: Teknologia
  title: Rakennettu suorituskyvylle
  subtitle: Jokainen Aquafarer-lauta on suunniteltu tarkoilla materiaaleilla ja valmistusmenetelmillä, jotka on testattu meriympäristöissä.
sections:
  - title: Tikattu ydin
    description: Tuhannet sisäiset polyesterilangat yhdistävät ylä- ja alakerrokset luoden jäykän rakenteen 12-15 PSI:n paineessa. Tämä on sama tekniikka, jota käytetään ammattimaisissa melontalaudoissa ja kumikilpaveneissä.
    imageAlt: DS-ydin kaavio
    standard: 12-15 PSI käyttöpaine
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
  - title: Sotilasluokan PVC
    description: Monikerroksinen laminoitu PVC-kangas, joka on luokiteltu meriympäristöihin. Jokainen kerros on fuusiohitsattu eikä liimattu, eliminoiden delaminaatioriskit. Testattu UV-kestävyydelle, suolavesikorroosiolle ja hankaukselle.
    imageAlt: PVC-kerros
    standard: Fuusiohitsattu | UV / suolavesi / hankaustestattu
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
  - title: Hypalon-putket
    description: RIB-malleissa käytetty Hypalon (CSM) -kumi tarjoaa ylivoimaisen UV- ja kemikaalikestävyyden verrattuna tavalliseen PVC:hen. Hypalon-putket säilyttävät joustavuutensa äärimmäisissä lämpötiloissa ja kestävät polttoaineen ja öljyn aiheuttamaa heikkenemistä.
    imageAlt: Hypalon
    standard: CSM kumia | UV / kemikaalien / äärimmäisten lämpötilojen kestävä
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
  - title: Ilmakanvilattia
    description: Korkeapaineinen täytettävä lattiasysteemi, joka korvaa perinteiset vaneri- tai alumiinisälelattiat. Vähentää kokoamisaikaa, kokonaispainoa ja säilytystilaa tarjoten samalla riittävän jäykkyyden seisomiseen, kalastukseen ja kävelyyn.
    imageAlt: Ilmakansi
    standard: Korkeapaine puhallettava | Korvaa vanerin/alumiinin
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
