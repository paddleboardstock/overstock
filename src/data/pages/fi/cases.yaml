features3_cases:
  tagline: Suositellut tapaukset
  title: Räätälöidyt ratkaisut<br />todellisiin haasteisiin
  isBeforeContent: false
  columns: 3
  items:
    - title: Balin sukelluskeskuksen päivittäisen toiminnan päivitys
      customer: Blue Ocean -sukelluskeskus
      country: Indonesia
      industry: Kaupallinen sukelluskeskus
      challenge: Blue Ocean Diving Center Balilla käytti vanhaa lasikuitusukellusvenettä, jolla oli rajoitettu kansitila, vaikea sukeltajalle pääsy ja korkea huolto trooppisissa suolaisen veden olosuhteissa. Varusteiden lastaus oli ruuhkaa, valmisteluaika oli pitkä ja epävakaa alusta aiheutti turvallisuushuolia kansainvälisille turisteille - mukaan lukien ensikertalaiset sukeltajat ja vanhemmat matkailijat. Keskus tekee 3-5 sukellusmatkaa päivittäin, yli 200 päivää vuodessa.
      solution: Paddle Board Overstock toimitti räätälöidyn 6,8 metrin ammattisukelluksen RIB laajennetulla kansiasettelulla, joka on optimoitu sukellusvarusteiden säilytykseen, leveät ruostumattomasta teräksestä valmistetut sukellustikkaat, raskaat Hypalon putket UV- ja suolaveden kestävyyttä varten, liukumaton kannen pinta ja säiliön säilytysratkaisu. Kokoonpano suunniteltiin sukelluskeskuksen päivittäisen työnkulun ympärille – ei perustunut tavalliseen huviveneasetteluun.
      product: 6,8 metrin ammattisukellus RIB
      results: Suurempi työalue paransi laitteiden valmistelun tehokkuutta. Sukeltajat kokivat turvallisemman ja helpomman lennolle pääsyn. Huoltovaatimukset vähenivät merkittävästi. Keskus sai kapasiteettia vastaanottaa enemmän asiakkaita sesongin aikana entistä varmemmin. RIB tuli päivittäisen sukellustoiminnan perusta.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Sukellusveneemme ei ole vain kuljetus. Se on jokapäiväisen toimintamme perusta. Paddle Board Overstock RIB antaa tiimillemme lisää itseluottamusta, kun suoritetaan useita sukellusretkiä päivittäin.
      icon: tabler:lifebuoy
    - title: Phuket Dive Center Professional RIB Päivitys
      customer: Ocean Explorer -sukelluskeskus
      country: Thaimaa
      industry: Kaupallinen sukelluskeskus
      challenge: Ocean Explorer -sukelluskeskus Phuketissa Thaimaassa joutui päivittämään perinteisestä lasikuitusukellusveneestä, joka ei pystynyt vastaamaan kasvavaan asiakkaiden kysyntään. Rajoitettu kansitila teki laitteiden valmistelun tehottomaksi. Vaikea nouseminen loi turvallisuushaasteita kansainvälisille matkailijoille. Korkeat huoltovaatimukset trooppisten suolaisen veden olosuhteissa lisäsivät käyttökustannuksia. Keskus tekee useita päivittäisiä matkoja, yli 200 päivää vuodessa.
      solution: Paddle Board Overstock toimitti räätälöidyn 6,8 metrin kaupallisen sukelluslaitteen RIB optimoidulla työkannen asettelulla sukellussäiliöiden varastointia, laitteiden valmistelua ja sukeltajien liikkumista varten. Ominaisuuksiin kuuluvat leveät sukellustikkaat ruostumattomasta teräksestä valmistettavilla kaiteilla, kestävä putkirakenne UV-suojatuista materiaaleista, liukumaton lattia, säiliön säilytysratkaisu, ammattikäyttöön tarkoitettu konsoli ja matkustajaistuimet – kaikki suunniteltu kaupallisiin sukellustoimintoihin.
      product: 6,8 m kaupallinen sukellus RIB
      results: Suurempi kansialue mahdollisti nopeamman laitteiden organisoinnin ja tehokkaamman päivittäisen työnkulun. Asiakkaiden mukavuus ja turvallisuus paranivat merkittävästi. Kunnossapitoseisokit lyhenivät laivatason rakentamisen myötä. Sukelluskeskus voisi palvella enemmän asiakkaita sesonkiaikana ja laajentaa ammattisukelluspalveluita luottavaisin mielin.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Sukelluskeskukselle vene ei ole vain kuljetusväline. Se on tärkeä osa päivittäistä toimintaamme. Paddle Board Overstock RIB antaa tiimillemme luottamusta suorittaa useita sukellusretkiä joka päivä paremmalla turvallisuudella ja tehokkuudella.
      icon: tabler:lifebuoy
    - title: Euroopan sukelluskeskuksen laivasto
      customer: BlueMed-sukelluskeskukset
      country: Kreikka
      industry: Sukellus ja merimatkailu
      challenge: Vaatii 12 sukelluskonfiguroitua RIB:tä sukelluskeskusten ketjuun useiden Kreikan saarten yli. Jokainen vene tarvitsi mukautetut sukellustikkaat, säiliövaraston 8 säiliölle ja vakaan alustan avoveden sukeltajille. Laivaston piti saapua 60 päivän kuluessa matkailukauden alkamiseen.
      solution: Valmistettiin 12 RIB 520 sukellusmallia, joissa on integroidut säiliötelineet, sukellustikkaat ja erittäin leveät Hypalon putket lennolle nousun vakautta varten. Jokainen vene oli merkitty asiakkaan laivaston värillä. Kaikki 12 venettä on painetestattu ja lähetetty paikasta Qingdao 55 päivän sisällä.
      product: RIB 520 Sukellus
      results: Kaikki 12 venettä toimitettiin ajoissa matkailukauden ajaksi. Laivasto on ollut päivittäisessä käytössä yli 18 kuukautta ilman materiaalivikoja. Asiakas tilasi 6 lisäyksikköä toisena vuonna.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB 520 Dive on ollut päivittäisen sukelluksemme selkäranka. Vakaus levossa on erinomainen, ja säiliön säilytysjärjestely pitää kannen puhtaana ja turvallisena vieraillemme.
      icon: tabler:lifebuoy
    - title: Australian jakelija OEM -ohjelma
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: OEM/ODM Valmistus
      challenge: Australialainen jakelija tarvitsi yksityisten merkkien SUP-levyvalikoiman kilpailukykyiseen hintaan kilpaillakseen kiinalaisten suoraan kuluttajille myytävien merkkien kanssa. Vaaditaan 8 ainutlaatuista mallia, jotka kattavat aloittelijasta edistyneeseen, mukautetun grafiikan, mukautetun pakkauksen ja toimituksen vähittäismyyntipisteisiin.
      solution: Kehitetty 8 SUP mallia (All-Around, Touring, Jooga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) ainutlaatuisella australialaisgrafiikkapaketilla. Mukautetut vähittäismyyntipakkaukset QR-koodeilla, jotka linkittävät asennusvideoihin. Drop-ship-logistiikka määritetty osoitteesta Qingdao suoraan Australian vähittäiskauppoihin.
      product: Mukautettu SUP-linja (8 mallia)
      results: Konsepti ensimmäiseen lähetykseen 90 päivässä. Vähittäiskaupan läpimyyntiprosentti 85 % ensimmäisellä kaudella. Jälleenmyyjä laajensi kumppanuutta sisältäen kumivenelinjan vuonna kaksi.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Paddle Board Overstock toimitti täydellisen SUP-sarjan 90 päivässä – alkuperäisestä suunnittelusta myyntikerrokseen. Laatu vastaa brändejä, jotka myyvät kaksinkertaiseen hintaan.
      icon: tabler:arrows-exchange
    - title: Lähi-idän pelastusvenehuolto
      customer: Kansallinen pelastuspalveluviranomainen
      country: Yhdistyneet arabiemiirikunnat
      industry: Etsintä ja pelastus
      challenge: Väestönsuojeluorganisaatio tarvitsi 20 partiovalmiista RIB:tä rannikon etsintään ja pelastustoimiin, satamaturvallisuuteen ja tulvatorjuntaan. Vaaditut itseohjautuvat kannet, täydelliset navigointijärjestelmät (GPS, tutka, VHF), näkyvät oranssit putket ja paikallisten merenkulkumääräysten noudattaminen.
      solution: Mukana 20 RIB 450 Patrol-mallia, joissa on itsekiinnittyvät kannet, Garmin-navigointijärjestelmät, LED-valot, SOLAS heijastinnauha ja näkyvät oranssit Hypalon putket. Jokainen vene oli CE-sertifioitu ja testattu ISO 6185 standardin mukaisesti. Asiakirjapaketti sisälsi vaatimustenmukaisuustodistukset paikallista rekisteröintiä varten.
      product: RIB 450 partio
      results: Laivasto on sijoitettu 5 rannikkoasemalle. Veneet ovat olleet käytössä äärimmäisessä kuumuudessa (45°C+) ilman putken hajoamista. Partiomatka ja polttoainetehokkuus ylittivät vaatimukset 12 %.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: RIB 450 Patrol ylitti toimintavaatimuksemme. Äärimmäisissä lämpöolosuhteissa Hypalon putket eivät osoita merkkejä UV-hajoamisesta 24 kuukauden päivittäisen käytön jälkeen.
      icon: tabler:alert-triangle
    - title: Eurooppalainen OEM brändikumppanuus
      customer: North Sea Marine Equipment BV
      country: Alankomaat
      industry: OEM/ODM Valmistus
      challenge: Vakiintunut eurooppalainen merenkulkubrändi halusi laajentua RIB-markkinoille investoimatta tuotantolaitoksiin. Tarvittiin white-label-kumppani, joka pystyy tuottamaan 5 RIB mallia (3,9–6,2 m) yksityisellä tuotemerkillä, CE-sertifioinnilla ja EU:n yksinoikeudella.
      solution: Tehty valkoisen etiketin valmistussopimus 5 RIB mallille. Jokainen malli on varustettu asiakkaiden logoilla ja värimaailmalla. CE jokaiselle mallille laadittu sertifiointiasiakirja. EU:n yksinomaiset jakeluoikeudet myönnetään vähimmäistilaussitoumuksilla. Tekninen dokumentaatio ja varaosaluettelo toimitetaan paikalliseen huoltoverkostoon.
      product: Mukautettu RIB-linja (5 mallia)
      results: Monivuotinen sopimus allekirjoitettu. Ensimmäinen 50 yksikön tuotantoajo toimitetaan 75 päivässä. Brändi lanseerattiin METSTRADEssa positiivisella jälleenmyyjän vastaanotolla.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Työskentely tuotteen Paddle Board Overstock kanssa antoi meille mahdollisuuden päästä markkinoille RIB rakentamatta tehdasta – he toimittivat täydellisen avaimet käteen -ratkaisun CE sertifioinnilla ja jälleenmyyjän tukidokumentaatiolla.
      icon: tabler:building
    - title: Karibian lomakeskusveneistö
      customer: Paradise Island Resorts Ltd
      country: Bahama
      industry: Merimatkailu ja vieraanvaraisuus
      challenge: 'Ylellinen lomakeskus tarvitsi täydellisen vesiurheiluvälinekannan vieraiden toimintaan: 40 SUP lautaa opastetuille kierroksille, 20 kajakkia laguunien tutkimiseen, 10 puhallettavaa venettä vieraiden kuljetuksiin ja kalastusretkiin sekä tarvikkeita. Kaikki varusteet vaativat mukautetun lomakeskuksen tuotemerkin, ja ne piti toimittaa ennen matkailukauden huippua.'
      solution: 'Valmistettu täydellinen vesiurheilupaketti: 40 SUP Voyager-lautaa (All-Around-malli), 20 Explorer-kajakkia, 10 AirDeck 360 -kumivenettä sekä PFD:t, melat, pumput ja korjaussarjat. Kaikki varusteet painettu lomakeskuksen logolla ja trooppisella värimaailmalla. Konttilähetys, jossa on täydellinen varastoluettelo.'
      product: Täysi vesiurheilupaketti (70+ yksikköä)
      results: Laivasto saapui 6 viikkoa ennen sesonkiaikaa. Vesiurheilun vieraiden tyytyväisyyspisteet nousivat 40 % vuodentakaiseen verrattuna. Laitteet ovat kestäneet 3 kautta vain rutiinihuolloin.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Täydellisen paketin lähestymistapa merkitsi sitä, että saimme kaiken tarvitsemamme yhdessä lähetyksessä – laudat, kajakit, veneet ja tarvikkeet, kaikki merkkituotteita ja valmiina vieraiden käyttöön. Vieraamme rakastavat laitteiden laatua.
      icon: tabler:beach
    - title: Queensland Commercial Diving Center RIB Päivitys
      customer: Kaupallinen sukelluskeskus
      country: Australia
      industry: Kaupalliset sukellus- ja meripalvelut
      challenge: Queenslandissa sijaitseva kaupallinen sukelluskeskus, joka oli erikoistunut meren infrastruktuurin tarkastuksiin, satamahuoltoon ja vedenalaisiin korjausprojekteihin, käytti ikääntyvää työvenettä. Projektien kysynnän kasvaessa vanhasta aluksesta tuli vastuuta – toistuva huolto aiheutti aikatauluhäiriöitä, ulkoasua ei ollut suunniteltu nykyaikaisiin sukellustoimintoihin (tilaa sylintereille, työkaluille ja laitteille rajoitetusti) ja miehistön mukavuus pitkien operaatioiden aikana oli huono. Yritys tarvitsi aluksen, joka voisi tukea heidän ammatillista toimintaansa joka työpäivä.
      solution: Paddle Board Overstock suoritti yksityiskohtaisen operatiivisen analyysin asiakkaan sukellustyönkulusta, tyypillisestä projektin kestosta, miehistön koosta ja varustevaatimuksista. Tämän analyysin perusteella Paddle Board Overstock toimitti räätälöidyn ammattilaisen RIB, jonka toiminnallinen kannen asettelu on optimoitu laitteiden valmistelua ja sukeltajien liikkumista varten, ammattimaiset istuimet pitkiä kuljetusaikoja varten, paranneltu vakaus sukeltajan turvallisempaa sisään- ja poistumista varten sekä suunnitteluun integroidut sukellusta tukevat ominaisuudet.
      product: Räätälöity ammattisukellus RIB
      results: Uudesta RIBsta tuli luotettava päivittäisen työskentelyalusta. Laitteiden valmistelu nopeutui optimoidun layoutin ansiosta. Miehistö ilmoitti parantuneesta mukavuudesta ja turvallisuudesta pitkien lentojen aikana. Veneen ammattimainen ulkonäkö vahvisti asiakkaiden luottamusta toimiessaan satamaoperaattoreiden ja laivaurakoitsijoiden kanssa. Sukelluskeskus sai aluksen, joka vastasi heidän palvelun ammattitaitoaan.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Tarvitsimme veneen, joka voisi tukea liiketoimintaamme joka päivä, ei vain kuljetusalusta. Paddle Board Overstock työskenteli kanssamme ymmärtääkseen toiminnallisia vaatimuksiamme ja toimitti RIB ratkaisun, joka sopii kaupallisen sukellustyönkulkuumme.
      icon: tabler:lifebuoy
    - title: Yhdysvaltain rannikkovartiosopimus
      customer: Atlantin rannikkoturvallisuusvirasto
      country: Yhdysvallat
      industry: Meriturvallisuus ja lainvalvonta
      challenge: Yhdysvaltain rannikkoturvavirasto vaati raskaiden partioiden RIB:itä avoveden sieppausoperaatioihin. Vaadittu kaksimoottorinen kokoonpano redundanssia varten, panssaroitu konsoli miehistön suojaamiseksi, armeija-spesifinen elektroniikka (salattu viestintä, FLIR, tutka) ja Yhdysvaltain rannikkovartioston määräysten noudattaminen.
      solution: Suunniteltu RIB 600 Patrol, jossa on kaksi 115 HP perämoottoria, panssaroitu konsoli ballistisella suojauksella, FLIR-lämpökuvaus, salattu VHF/UHF-tietoliikenne ja integroidut aseiden kiinnityspisteet. Vahvistettu runko nopeita sieppausliikkeitä varten. Kaikki elektroniikka integroitu ja testattu tehtaalla. USCG vaatimustenmukaisuusasiakirjat toimitettu.
      product: RIB 600 Patrol (kaksoismoottori)
      results: Veneet saavuttivat 52 solmun huippunopeuden hyväksymiskokeiden aikana. Virasto ilmoitti 95 prosentin valmiusasteen tehtäviin ensimmäisten 12 kuukauden aikana. Lisätilaus tehty 8 kpl.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Kaksimoottorinen RIB 600 antaa miehistöillemme nopeuden ja redundanssin, joka tarvitaan avoveden sieppausoperaatioihin. Panssaroitu konsoli tarjoaa kriittisen suojan suorituskyvystä tinkimättä.
      icon: tabler:shield
