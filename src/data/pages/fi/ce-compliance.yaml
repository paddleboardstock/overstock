hero:
  tagline: CE- ja RCD-yhteensopivuus
  title: RIB Boat CE -yhteensopivuus<br />ja tekninen dokumentaatio
  subtitle: Paddle Board Overstock RIB -veneet ja puhallettavat vesikulkuneuvot on suunniteltu ja dokumentoitu EU:n markkinoiden mukaisiksi huvivenedirektiivin 2013/53/EU mukaisesti. Tarjoamme jokaiselle rungolle mallikohtaisen vaatimustenmukaisuusasiakirjan riskinarvioinnista vaatimustenmukaisuusvakuutukseen.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: RIB-veneen CE-vaatimustenmukaisuusdokumentaatio ja -sertifikaatti
direct_answer: Paddle Board Overstock tarjoaa mallikohtaisia RCD 2013/53/EU -vaatimustenmukaisuusasiakirjoja RIB-veneille ja puhallettaville vesikulkuneuvoille, mukaan lukien tekniset tiedostot, vaatimustenmukaisuusvakuutukset, rakennuskilvet ja omistajan käsikirjat – kaikki yhdenmukaiset EN ISO 6185:n, ISO 12217:n ja sovellettavien harmonisoitujen standardien kanssa.
