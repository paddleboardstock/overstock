content_scope:
  tagline: Vaatimustenmukaisuuden laajuus
  title: Mitkä tuotteet tarvitsevat<br />RCD-yhteensopivuuden?
  subtitle: Huvivenedirektiivi 2013/53/EU koskee huviveneitä, joiden rungon pituus on 2,5–24 metriä. Laajuuden ymmärtäminen on ensimmäinen askel vaatimustenmukaisuuteen.
  items:
    - title: RIB-veneet (2,5–24 m)
      description: Jäykät puhallettavat veneet, joiden rungon pituus on 2,5–24 m, kuuluvat RCD:n piiriin. Suunnitteluluokat A–D ovat voimassa aiotun meriolosuhteiden ja suurimman tuulenvoimakkuuden mukaan.
      icon: tabler:sailboat
    - title: Kumiveneet (alle 2,5 m)
      description: Pienet alle 2,5 metrin pituiset kumiveneet ja veneet voidaan osittain vapauttaa RCD:stä, mutta vaativat silti CE-merkinnän muiden sovellettavien direktiivien ja EN ISO 6185 -rakennusstandardien mukaisesti.
      icon: tabler:sailboat
    - title: SUP-laudat ja tarvikkeet
      description: Pysyvät melalaudat eivät kuulu RCD:n soveltamisalaan. Kuitenkin niihin liittyvät henkilökohtaiset kelluntalaitteet (PFD) edellyttävät CE-merkintää henkilönsuojaimien asetuksen (EU) 2016/425 mukaisesti ja USCG Type III/V -hyväksyntää tarvittaessa.
      icon: tabler:swimming
    - title: Osittain valmiit veneet
      description: Veneet, jotka toimitetaan ilman moottoria tai erityisiä asennuksia, edellyttävät rakentajan vakuutusta osittain valmiista veneestä, ja lopullinen rakentaja tai maahantuoja täyttää täydellisen RCD-yhteensopivuuden.
      icon: tabler:tool
content_trust_layers:
  tagline: Kolmikerroksinen luottamusjärjestelmä
  title: Vaatimustenmukaisuustiedot<br />— Jaettu oikealla tasolla
  subtitle: Kaikki vaatimustenmukaisuustiedot eivät kuulu julkisille verkkosivustoille. Noudatamme kolmikerroksista lähestymistapaa, joka suojaa IP-osoitteita ja lisää samalla ostajien luottamusta.
  items:
    - title: Taso 1 – julkinen verkkosivusto
      description: Viitatut standardit, vaatimustenmukaisuusreitit selitetty, asiakirjatyypit lueteltu, sertifioinnin laajuus malliperheen mukaan. Ei varsinaisia varmenteita, testitietoja tai omaa teknistä tietoa.
      icon: tabler:world
    - title: Taso 2 — Tiedustelun jälkeinen jakaminen
      description: 'Pätevän tiedustelun jälkeen: muokattu vaatimustenmukaisuustodistusnäyte, rakentajan levykuva, sovellettavien standardien luettelo, vaatimustenmukaisuuden tarkistuslista ja materiaalien sertifiointiyhteenvedot – jaetaan reilun käytön ehdoilla.'
      icon: tabler:mail
    - title: Taso 3 — NDA / tilausvaihe
      description: Täydellinen tekninen tiedosto, riskiarvioinnit, stabiliteettilaskelmat, testiraportit, materiaalierät ja tuotannon jäljitettävyysasiakirjat – jaetaan vain NDA:n puitteissa vahvistettujen ostajien kanssa.
      icon: tabler:lock
content_standards:
  tagline: Sovellettavat standardit
  title: ISO- ja EN-standardit<br />Rakennamme mukaan
  subtitle: Tuotteemme on suunniteltu ja testattu RCD:n harmonisoitujen standardien mukaisesti. Vakionumeroihin ja nimiin viitataan; täydelliset standarditekstit säilyvät ISO-tekijänoikeuksin.
  items:
    - title: EN iso 6185-3
      description: 'Kumiveneet — Osa 3: Veneet, joiden suurin moottoriteho on 15 kW tai enemmän. Rakenne-, vakavuus-, kelluvuus- ja mies yli laidan palautumisvaatimukset RIB:ille.'
      icon: tabler:file-text
    - title: EN iso 6185-4
      description: 'Kumiveneet — Osa 4: Veneet, joiden suurin moottoriteho on 15 kW ja suurempi tai yhtä suuri kuin 4,5 kW. Muut rakenteelliset ja vakavuusvaatimukset.'
      icon: tabler:file-text
    - title: ISO 12215 -sarja
      description: Pienet veneet — Rungon rakenne ja suojukset. Rungon, kannen ja laipioiden rakennesuunnittelu lasikuitu- ja alumiinirungoille.
      icon: tabler:ruler-2
    - title: EN iso 10240
      description: Pienet veneet – Omistajan käsikirja. Jokaisen EU:ssa toimitettavan RIB-veneen mukana tulevan omistajan käsikirjan vaadittu sisältö ja muoto.
      icon: tabler:book
    - title: EN iso 14945
      description: Pieni käsityö — Rakentajan lautanen. Tiedot merkitään jokaiseen veneeseen pysyvästi kiinnitettyyn rakentajan kilveen.
      icon: tabler:badge
    - title: Iso 8666
      description: Pienet veneet — päätiedot. Standardoidut mittaukset ja parametrit takaavat yhdenmukaisen määrityksen kaikissa tuotedokumentaatioissa.
      icon: tabler:dimensions
content_process:
  tagline: Vaatimustenmukaisuusprosessi
  title: 6-vaiheinen CE-yhteensopivuus<br />Työnkulku
  subtitle: Projektin laajuudesta sarjatason jäljitettävyyteen – jokainen RIB-malli noudattaa määritettyä vaatimustenmukaisuuspolkua.
  steps:
    - number: '01'
      title: Projektin laajuus ja luokitus
      description: Määrittele RIB-malli, suunnitteluluokka (A/B/C/D), enimmäishenkilömäärä, hyötykuorma, moottorin teho ja kohdemarkkinat. Selvitä, sovelletaanko RCD:tä ja mikä vaatimustenmukaisuuden arviointimoduuli vaaditaan.
      timeline: 2-3 päivää
    - number: '02'
      title: Sovellettavien vaatimusten tunnistus
      description: Tunnista kaikki sovellettavat olennaiset turvallisuusvaatimukset RCD:n liitteestä I, asiaankuuluvista yhdenmukaistetuista standardeista (EN ISO 6185, 12215, 10240, 14945) ja kaikista kohdemarkkinoita koskevista kansallisista lisävaatimuksista.
      timeline: 3-5 päivää
    - number: '03'
      title: Suunnittelu ja tekninen dokumentaatio
      description: 'Luo tekninen päätiedosto: yleiset järjestelypiirustukset, vakavuus- ja kelluvuuslaskelmat, riskinarviointi, materiaalitiedot ja järjestelmien turvallisuusanalyysi (polttoaine, sähkö, ohjaus).'
      timeline: 10-15 päivää
    - number: '04'
      title: Tuotteen tarkastus ja testaus
      description: Suorita fyysinen tarkastus – painetestaus 1,25-kertaisella nimellispaineella 24–48 tunnin ajan, vakavuus- ja kelluvuustestit, kuormitustestit ja järjestelmien käyttöönotto. Kirjaa ylös kaikki testitulokset runkoa kohden.
      timeline: 5-7 päivää
    - number: '05'
      title: Merkintä- ja toimitusasiakirjat
      description: Kiinnitä CE-merkintä, rakennuskilpi (EN ISO 14945) ja HIN/CIN (rungon tunnusnumero). Valmistele EU-vaatimustenmukaisuusvakuutus, omistajan käsikirja (EN ISO 10240) ja vaatimustenmukaisuuden tarkistuslista.
      timeline: 2-3 päivää
    - number: '06'
      title: Sarjatason jäljitettävyys
      description: Jokainen runko saa ainutlaatuisen runkotietueen, joka yhdistää sen tekniseen päätiedostoon, tuotantoerään, materiaalitodistuksiin, testituloksiin ja lopulliseen kokoonpanoon. Tietueita säilytetään yli 10 vuotta per RCD.
      timeline: Meneillään
content_document_cards:
  tagline: Asiakirjatyypit
  title: Vaatimustenmukaisuusasiakirja<br />kortit
  subtitle: Nämä ovat asiakirjatyyppejä, joita laadimme ja ylläpidämme jokaiselle CE-sertifioidulle RIB-mallille. Näytteet ovat saatavilla pätevän kyselyn perusteella.
  items:
    - title: CE/RCD-vaatimustenmukaisuustodistus
      description: Mallikohtainen sertifikaatti, joka vahvistaa, että vene täyttää kaikki soveltuvat RCD 2013/53/EU olennaiset turvallisuusvaatimukset. Valmistaja on myöntänyt ilmoitetun laitoksen mukana tarvittaessa.
      icon: tabler:certificate
    - title: EU-vaatimustenmukaisuusvakuutus (DoC)
      description: Valmistajan tai valtuutetun edustajan allekirjoittama vakuutus, jossa luetellaan sovellettavat direktiivit, standardit, vaatimustenmukaisuusmoduuli ja ilmoitetun laitoksen tiedot. Vaaditaan jokaisessa EU:n markkinoille saatetussa mallissa.
      icon: tabler:file-check
    - title: Rakennuskilpi (EN ISO 14945)
      description: Pysyvästi kiinnitetty kilpi, jossa näkyy enimmäishenkilömäärä, suurin moottoriteho, suunnitteluluokka ja valmistajan tunniste. On säilytettävä luettavissa veneen käyttöiän ajan.
      icon: tabler:badge
    - title: Käyttöopas (EN ISO 10240)
      description: Kattava käsikirja, joka kattaa turvallisen käytön, hätätoimenpiteet, huoltoaikataulut ja turvallisuusvaroitukset. Pakollinen jokaiselle EU:ssa toimitetulle RIB:lle.
      icon: tabler:book
    - title: ISO-testi- ja tarkastusraportit
      description: Painetestipöytäkirjat (1,25x / 24-48h), vakavuus- ja kelluvuustestitulokset, materiaalitestitodistukset ja mittojen varmennusraportit – kaikki liittyvät tiettyihin rungon numeroihin.
      icon: tabler:test-pipe
    - title: Materiaalin jäljitettävyysasiakirjat
      description: Erätason jäljitettävyys putkikankaille, liima-aineille, lasikuidulle ja laitteistoille. Linkittää jokaisen tuotantoyksikön saapuviin materiaalisertifikaatteihin ja IQC-tarkastustuloksiin.
      icon: tabler:link
    - title: Laaduntarkastus- ja laadunvalvontatiedot
      description: 100 pisteen laaduntarkistuslista yksikköä kohden, prosessinaikaiset QC-tietueet, poikkeamaraportit ja korjaavat toimet. Osa tuotannon jäljitettävyysketjua.
      icon: tabler:clipboard-check
    - title: Projektiasiakirjapaketti
      description: Runkokohtainen dokumentaatiopaketti, joka sisältää lopullisen kokoonpanotietueen, moottorin ja laitteiden asennustiedot, käyttöönoton tarkistuslistan ja toimitusasiakirjat.
      icon: tabler:package
content_design_categories:
  tagline: RCD-suunnittelukategoriat
  title: Suunnitteluluokka A–D<br />— Mitä ne tarkoittavat
  subtitle: RCD määrittää suunnitteluluokat suurimman tuulenvoiman ja merkittävän aallonkorkeuden perusteella, jonka vene on suunniteltu kestämään.
  items:
    - title: Luokka A – Ocean
      description: Suunniteltu pitkille matkoille, joissa tuulen voima voi ylittää Beaufort 8 (>40 solmua) ja merkitsevä aallonkorkeus ylittää 4 metriä. Vaatii tiukimman rakenne- ja vakavuustarkastuksen.
      icon: tabler:ripple
    - title: Luokka B – Offshore
      description: Suunniteltu offshore-matkoille, joissa tuulen voimakkuus on Beaufort 8 (≤40 solmua) ja merkitsevä aallonkorkeus 4 m. Soveltuu rannikko- ja puolivalkoisille vesille.
      icon: tabler:anchor
    - title: Luokka C – Rannikot
      description: Suunniteltu rannikkomatkoille, joiden tuulen voimakkuus on Beaufort 6 (≤27 solmua) ja merkitsevä aallonkorkeus 2 m. Useimmat vapaa-ajan RIB:t kuuluvat tähän luokkaan.
      icon: tabler:sun
    - title: Luokka D – Suojattu
      description: Suunniteltu suojaisille vesille, joiden tuulen voimakkuus on Beaufort 4 (≤16 solmua) ja merkittävä aallonkorkeus 0,3 m asti. Järvet, joet ja suojatut satamat.
      icon: tabler:pool
content_hin:
  tagline: Käsityön tunnistus
  title: HIN / CIN & rakentajan levy
  subtitle: Jokainen RIB-vene vaatii rungon tunnusnumeron (HIN) tai aluksen tunnusnumeron (CIN) ja rakentajan kilven EN ISO 14945:n ja RCD-vaatimusten mukaisesti.
  items:
    - title: Rungon tunnusnumero (HIN)
      description: Ainutlaatuinen 14-merkkinen koodi, joka on pysyvästi merkitty peräpeilin oikealle puolelle, koodattuna valmistajakoodin (MIC), mallivuoden, valmistusvuoden ja sarjanumeron. Vaaditaan EU-markkinoille pääsyä varten.
      icon: tabler:hash
    - title: Veneen tunnusnumero (CIN)
      description: EN ISO 10087:n mukaan piilotettu toissijainen tunnistenumero, joka on sijoitettu piiloon varkaudenesto- ja jäljitettävyystarkoituksiin.
      icon: tabler:eye-off
    - title: Rakennuslevyn sisältö
      description: Suurin henkilömäärä, suurin moottorin teho (kW), enimmäiskuorma (kg), suunnitteluluokka, valmistajan nimi ja CE-merkintä – kaikki pysyvästi esillä korroosionkestävällä levyllä.
      icon: tabler:badge
content_tech_file:
  tagline: Tekninen tiedostorakenne
  title: Master tekninen tiedosto<br /> & runkotietue
  subtitle: 'Dokumentaatiojärjestelmämme noudattaa kaksitasoista rakennetta: tekninen päätiedosto jokaiselle malliperheelle ja yksittäiset runkotiedot jokaisesta tuotetusta veneestä.'
  items:
    - title: Master tekninen tiedosto
      description: 'Sisältää täydellisen malliperheen vaatimustenmukaisuusdokumentaation: yleisjärjestelyn, riskinarvioinnin, vakavuus- ja kelluvuuslaskelmat, materiaalitiedot, sovellettavat standardit ja vaatimustenmukaisuuden arviointitiedot. Säilytetty 10+ vuotta.'
      icon: tabler:folder
    - title: Rungon ennätys (venekohtainen jäljitettävyys)
      description: 'Jokaisella rungolla on ainutlaatuinen tietue, joka yhdistää sen tekniseen päätiedostoon: HIN, valmistuspäivämäärä, putkierä, materiaalitodistukset, painetestin tulos, lopullinen kokoonpano, moottorin asennus ja toimituspaikka.'
      icon: tabler:file-description
    - title: Asiakkaan vaatimustenmukaisuuspaketti
      description: Runkokohtainen toimituspaketti, joka sisältää DoC:n, rakennuskilven valokuvan, omistajan käsikirjan, testin yhteenvedon ja lopullisen konfigurointilomakkeen – joka toimitetaan jokaisen EU:hun toimitetun RIB:n mukana.
      icon: tabler:package
faq:
  title: CE-vaatimustenmukaisuus – usein kysyttyjä kysymyksiä
  questions:
    - q: Ovatko kaikki Paddle Board Overstock RIB -veneet CE-sertifioituja EU:n markkinoille?
      a: Luettelomme RIB-veneet on suunniteltu ja dokumentoitu RCD 2013/53/EU -vaatimusten mukaisiksi sovellettavien EU-direktiivien mukaisesti. CE-merkintä on voimassa malli- ja kokoonpanokohtaisesti. Ota meihin yhteyttä saadaksesi mallikohtaisen vaatimustenmukaisuuden laajuusasiakirjan.
    - q: Mitä eroa on RCD-yhteensopivuuden ja CE-merkinnän välillä?
      a: RCD (huvivenedirektiivi 2013/53/EU) on EU:n lainsäädäntö, joka asettaa olennaiset turvallisuusvaatimukset. CE-merkintä on visuaalinen symboli, joka on sijoitettu tuotteeseen, joka on arvioitu ja vahvistettu täyttävän kyseiset vaatimukset. Tuotteen on oltava RCD:n mukainen, ennen kuin siinä voi olla CE-merkki.
    - q: Toimitatko vaatimustenmukaisuusvakuutukset jokaisen veneen mukana?
      a: Kyllä. Jokaiseen EU:n markkinoille toimitettuun RIB-veneeseen kuuluu mallikohtainen EU-vaatimustenmukaisuusvakuutus, jossa luetellaan sovellettavat direktiivit, harmonisoidut standardit, vaatimustenmukaisuuden arviointimoduuli ja ilmoitetun laitoksen tiedot.
    - q: Mitä vaatimustenmukaisuuden arviointimoduulia Paddle Board Overstock käyttää?
      a: Moduuli riippuu suunnittelukategoriasta ja venetyypistä. Useimmat suunnittelukategorian C RIB-malleista käyttävät moduulia A (sisäinen tuotannonohjaus). Suunnitteluluokan A/B veneisiin tai tiettyihin kokoonpanoihin voidaan soveltaa moduulia B+C tai B+D ilmoitetun laitoksen osallistuessa. Neuvomme sopivasta moduulista projektikohtaisesti.
    - q: Voitko jakaa vaatimustenmukaisuusasiakirjoja ennen tilauksen tekemistä?
      a: Pätevän tiedustelun jälkeen jaamme vaatimustenmukaisuuslaajuusasiakirjan, jossa luetellaan sovellettavat standardit, vaatimustenmukaisuusreitti ja asiakirjatyypit, jotka ovat saatavilla arvioitavalle mallille. Täydelliset tekniset tiedostot jaetaan NDA:n alla tilausvahvistuksen jälkeen.
    - q: Mikä on rungon tunnistenumero (HIN) ja sisältyykö se?
      a: HIN on 14-merkkinen yksilöllinen tunniste, joka on merkitty pysyvästi jokaiseen veneeseen ja joka sisältää valmistajan koodin (MIC), mallimerkinnän, valmistusvuoden ja sarjanumeron. Se on pakollinen kaikille EU:n markkinoille saatetuille RIB-veneille, ja se sisältyy jokaiseen Paddle Board Overstock RIB:iin.
    - q: Kuinka kauan teknisiä tiedostoja säilytetään?
      a: RCD 2013/53/EU -vaatimusten mukaan valmistajan on säilytettävä tekninen tiedosto vähintään 10 vuotta tuotteen viimeisestä markkinoille saattamisesta. Paddle Board Overstock ylläpitää täydellistä teknistä dokumentaatiota kaikista tuotetuista malleista.
    - q: Autatteko RCD:n mukaisten maahantuojien velvoitteiden täyttämisessä?
      a: 'Kyllä. Tarjoamme asiakirjapaketin, jota EU-maahantuojat tarvitsevat täyttääkseen velvoitteensa: pääsy tekniseen tiedostoon, vaatimustenmukaisuustodistukset, rakennuskilpi, omistajan käsikirja ja tuotteen jäljitettävyystiedot. RCD:n mukaiset maahantuojan velvollisuudet on dokumentoitu selkeästi vaatimustenmukaisuusoppaassamme.'
cta:
  title: Tarvitsetko mallikohtaisen EU-vaatimustenmukaisuuden laajuuden?
  subtitle: Pyydä tarkka vaatimustenmukaisuuden tarkistuslista arvioitavalle RIB-mallille ja -kokoonpanolle – mukaan lukien sovellettavat standardit, vaatimustenmukaisuusreitti ja saatavilla olevat asiakirjat.
  actions:
    - variant: primary
      text: Pyydä vaatimustenmukaisuusasiakirjoja
      href: /contact
    - text: Näytä sertifikaatit
      href: /certifications
content_material_cert:
  tagline: Materiaalin sertifiointi
  title: Materiaalin jäljitettävyys ja<br />sertifiointitodistus
  subtitle: Laadukkaat RIB-veneet alkavat valvotuista materiaaleista ja dokumentoiduista prosesseista. Alla kerrotaan, kuinka järjestämme materiaalisertifioinnin kullekin kriittiselle komponenttiryhmälle.
  items:
    - title: Ilmatäytteisen putken materiaalin jäljitettävyys
      description: PVC ja CSM/Hypalon putkimateriaalit valitaan käyttötarkoituksen, ilmasto-olosuhteiden ja kohdemarkkinoiden mukaan. Toimittajan tekniset tiedot (TDS), materiaalierätiedot, kangaserän jäljitettävyys, UV- ja säätestausraportit sekä REACH/SVHC-ilmoitukset ovat saatavilla sovitun projektidokumentaation puitteissa.
      icon: tabler:circle
    - title: Marine-alumiinin jäljitettävyys
      description: Alumiinirungon RIB-projekteissa seoslaatua, paksuutta ja materiaalieriä valvotaan hyväksyttyjen eritelmien mukaisesti. Materiaalitestitodistukset (MTC/MTR), EN 10204 3.1 -dokumentaatio, kemiallisen koostumuksen ja mekaanisten ominaisuuksien raportit sekä lämmön/erän jäljitettävyys toimitetaan sovittaessa.
      icon: tabler:rectangle
    - title: GRP Rungon materiaalin ja prosessin ohjaus
      description: Lasikuiturunkoisten RIB-levyjen gelcoat-, hartsi-, lasikuituvahviste- ja ydinmateriaalit hallitaan valvottujen eritelmien avulla. Materiaali TDS/SDS, erätietueet, laminaatin tekniset tiedot sekä kovettumis- ja työpajan valvontatiedot ovat saatavilla projektisopimuksen mukaan.
      icon: tabler:layers-subtract
    - title: Komponenttien dokumentaation tuki
      description: Valittujen komponenttien osalta – mukaan lukien EVA kansimateriaalit, istuimet, ruostumattomasta teräksestä valmistetut laitteistot, polttoainejärjestelmät, sähkölaitteet ja laivavarusteet – sovellettavat toimittajan asiakirjat koordinoidaan lopullisen kokoonpanon ja kohdemarkkinoiden vaatimusten perusteella.
      icon: tabler:package
    - title: Vaatimustenmukaisuutta koskeva ilmoitus
      description: Sertifikaatit, testiraportit ja vaatimustenmukaisuusasiakirjat koskevat vain kyseisessä asiakirjassa mainittua tiettyä tuotemallia, materiaalia, komponenttia, tuotantoerää tai projektin laajuutta. Ota yhteyttä kohdemarkkinasi, käyttötarkoituksen ja teknisten vaatimusten kanssa, jotta soveltuva dokumentaatiopaketti voidaan vahvistaa ennen tilauksen tekemistä.
      icon: tabler:info-circle

