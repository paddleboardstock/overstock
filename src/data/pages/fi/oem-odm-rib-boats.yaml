content_service_modules:
  tagline: Palvelumoduulit
  title: OEM/ODM Palvelu<br />Moduulit
  subtitle: Jokainen projekti yhdistää oikeat palvelumoduulit. Kaikki projektit eivät tarvitse kaikkia moduuleja – katamme vain sen, mitä projektisi vaatii.
  items:
    - title: Suunnittelukatsaus ja toteutettavuus
      description: 'Rungon alustan arviointi, rakenteellisen toteutettavuuden tarkistus, vakauden ja kelluvuuden tarkastus, vaatimustenmukaisuuspolun tunnistaminen ja materiaalin saatavuuden vahvistus. Tulos: toteutettavuusraportti go/no-go -suosituksella.'
      icon: tabler:math-function
    - title: Suunnittelu ja konfigurointi
      description: 'GA-piirustus, kannen asettelu, putken kokoonpano, konsoli- ja istumapaikat, laitteiden asennussuunnitelma ja väri-/materiaalivalinta. Lähtö: hyväksytty GA ja konfiguraatiospesifikaatio.'
      icon: tabler:ruler
    - title: Näyte ja prototyyppi
      description: Esituotantonäyte hyväksytyillä väreillä, logolla ja määrätyillä materiaaleilla fyysistä tarkastusta varten. Sisältää näytteen hyväksymisprotokollan, tarkastuksen tarkistuslistan ja muutospyyntöprosessin.
      icon: tabler:3d-cube-sphere
    - title: Tuotanto & laadunvalvonta
      description: Massatuotanto 100 pisteen QC-tarkistuslistalla yksikköä kohti, prosessin sisäiset tarkastukset, painetestaus (1,25x / 24-48h) ja sarjatason jäljitettävyys. CE/ISO dokumentaatio valmistetaan rinnakkain.
      icon: tabler:clipboard-check
    - title: Brändäys ja pakkaus
      description: Yksityisten merkkien logosovellus, räätälöity runko- ja putkigrafiikka, merkkituote omistajan dokumentaatio, vähittäismyyntivalmiit tai lavalliset pakkaukset ja varaosien valmistus.
      icon: tabler:palette
    - title: Vienti ja dokumentointi
      description: Vientipakkaus, kontin lastaussuunnitelma, FOB/CIF/DDP asiakirjat, vaatimustenmukaisuuspaperit kohdemarkkinakohtaisesti ja toimituksen jälkeinen viestintäprotokolla.
      icon: tabler:world
content_risk_control:
  tagline: Riskien ja toimitusten valvonta
  title: Projektin riskien ja<br />toimitusten hallinta
  subtitle: Ammattimaiset ostajat OEM/ODM välittävät riskienhallinnasta yhtä paljon kuin tuotteen laadusta. Näin hallitsemme sen.
  items:
    - title: Laajuus ja omistajuuden määritelmä
      description: 'Ennen kehityksen aloittamista määrittelemme kirjallisesti: räätälöinnin laajuuden, työkaluvaatimukset, näytehyväksyntäkriteerit, piirustusten ja muottien omistajuuden sekä dokumentointivastuut. Ei ole epäselvyyttä siitä, kuka omistaa mitä.'
      icon: tabler:file-text
    - title: Muuta ohjausprosessia
      description: Kaikki suunnitteluvahvistuksen jälkeiset spesifikaatiomuutokset noudattavat dokumentoitua muutospyyntöprosessia ja vaikutustenarviointia (kustannus, aikataulu, vaatimustenmukaisuus). Hyväksymättömiä muutoksia ei tule tuotantoon.
      icon: tabler:arrows-diff
    - title: Erän johdonmukaisuuden takuu
      description: 50. yksikkö vastaa ensimmäistä hyväksyttyä näytettä. Hyväksytyt tekniset tiedot jäädytetään, materiaali- ja prosessiparametrit on lukittu, ja prosessin sisäiset tarkistuspisteet varmistavat yhdenmukaisuuden koko tuotantoajon ajan.
      icon: tabler:repeat
    - title: Toimituksen ja kapasiteetin läpinäkyvyys
      description: Toimitusajat on ilmoitettu todellisen tuotantokapasiteetin, materiaalivarastotason ja nykyisen tilausmäärän perusteella – ei tavoitetavoitteiden perusteella. Tuotantoaikataulu ja virstanpylväiden päivämäärät tilauskohtaisesti.
      icon: tabler:calendar-stats

