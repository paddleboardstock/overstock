faq:
  title: RIB OEM/ODM – usein kysyttyjä kysymyksiä
  questions:
    - q: Mitä eroa on RIB-veneiden OEM:n ja ODM:n välillä?
      a: 'OEM (Original Equipment Manufacturing): annat yksityiskohtaiset tekniset tiedot ja rakennamme suunnittelusi. ODM (Original Design Manufacturing): valitset todistetusti toimivan Aquafarer RIB -alustan ja räätälöimme sen haluamillasi ominaisuuksilla ja brändäyksellä. ODM on nopeampi ja edullisempi; OEM tarjoaa maksimaalisen suunnittelun hallinnan.'
    - q: Voinko mukauttaa RIB-rungon muotoa ja kokoa?
      a: Kyllä. Tarjoamme puoliksi räätälöityjä muutoksia olemassa oleviin runkomuotteihin (eri kansiasettelut, putkikokoonpanot) ja täyden räätälöidyn rungon kehittämisen uusilla CNC-koneistetuilla muotilla. Puoliksi räätälöidyt projektit voivat alkaa 2-5 yksiköstä; täysi käytäntö vaatii yleensä korkeampia sitoumuksia.
    - q: Mitä putkimateriaaleja on saatavilla mukautetuille RIB:ille?
      a: Tarjoamme 0,9–1,2 mm:n PVC:tä virkistyskäyttöön ja kevyeen kaupalliseen käyttöön ja 1,4–1,7 mm:n Hypalon/CSM:n ammattikäyttöön, pelastus- ja kaupallisiin sovelluksiin, jotka vaativat erinomaista UV- ja otsoninkestävyyttä (10–15 vuoden käyttöikä vs. 5–8 vuotta PVC:lle).
    - q: Voitko määrittää RIB:t tiettyihin sovelluksiin, kuten pelastus-, sukellus- tai kalastustarkoituksiin?
      a: Kyllä. Ylläpidämme hyväksi havaittuja konfigurointimalleja pelastus-/partio-, sukellustuki-, matkailu-/ charter-, kalastus-, jahtitarjous- ja ammattikäyttöön tarkoitettuja työvenesovelluksia varten. Jokainen malli sisältää suositellun rungon tyypin, putkimateriaalin, kannen asettelun ja varusteet – jotka sitten räätälöimme täsmällisiin tarpeisiisi.
    - q: Mitä tietoja tarvitset RIB OEM/ODM -tarjoukseen?
      a: Kohdesovellus, haluttu rungon pituus, putkimateriaalien mieltymys (PVC tai Hypalon), likimääräinen määrä ja toimitusaikataulu, kohdemarkkinoiden vaatimustenmukaisuusvaatimukset ja mahdolliset referenssituotteet tai tekniset tiedot. Mitä yksityiskohtaisemmin annat, sitä nopeampi ja tarkempi tarjouksemme on.
    - q: Mikä on mukautettujen RIB-veneiden MOQ?
      a: Olemassa oleville runkomuoteille, joissa on vakiomuunnoksia, MOQ alkaa 2-5 yksiköstä mallia kohti. Räätälöityjen muottien ja täydellisen räätälöidyn kehityksen osalta MOQ riippuu projektin monimutkaisuudesta – tyypillisesti 10–20 yksikköä osittain räätälöidyille ja 30+ täysin mukautetuille uusille työkaluille.
    - q: Kuka omistaa mukautetut muotit ja piirustukset?
      a: Aquafarer-pohjamalleilla kehitetyt muotit pysyvät Aquafarerin omaisuutena. Asiakkaan tilaamat ja maksamat täysin räätälöidyt muotit voidaan siirtää asiakkaan omistukseen sopimusehtojen mukaisesti. Kaikki muotin omistusehdot dokumentoidaan ennen projektin aloittamista.
    - q: Miten mukautetut RIB:t pakataan vientiä varten?
      a: 'Vakio: mukautettu kehto + joustava kääre kontin lastausta varten. Premium: vähittäismyyntipakkaus, tyhjiöpakkaus tai lavalla. Tarjoamme FOB Qingdao-, CIF- ja DDP-toimituksia. Mukana täydelliset vientiasiakirjat ja tulliselvitys.'
