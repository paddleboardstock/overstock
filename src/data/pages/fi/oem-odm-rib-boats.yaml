comparison_matrix:
  title: OEM vs. ODM – mikä malli sopii projektiisi?
  subtitle: Neljä yhteistyötilaa, joista jokaisessa on eri tasoinen tehtaan osallistuminen ja brändin hallinta
  columns:
    - header: Yhteistyötila
    - header: Brändin roolisi
    - header: Aquafarerin rooli
  rows:
    - option: OEM-valmistus
      standard: Anna tuotemerkki, tekniset tiedot ja vaatimustenmukaisuusvaatimukset
      premium: Rakenna tarpeidesi mukaan käyttämällä olemassa olevia muottejamme ja tuotantolinjojamme
    - option: ODM-räätälöinti
      standard: Valitse perusmalli, mukauta ominaisuuksia ja brändäystä
      premium: Mukauta hyväksi havaittua RIB-alustaa haluamillasi muokkauksilla
    - option: Semi-custom RIB
      standard: Määritä rungon pituus, putken materiaali, kannen asettelu ja varusteet
      premium: Muokkaa olemassa olevaa runkoa mukautetulla putkikokoonpanolla ja kansisuunnitelmalla
    - option: Täysi mukautettu kehitys
      standard: Tarjoa konsepti ja kohdemarkkinoiden vaatimukset
      premium: Suunnittelu tyhjästä – mukautettu runko, muotti ja täydellinen dokumentaatio
content_customization:
  tagline: Mitä voidaan mukauttaa
  title: RIB-muokkaus<br />vaihtoehdot
  subtitle: Jokainen RIB-veneen elementti voidaan räätälöidä sovelluksesi, markkinoiden ja brändivaatimusten mukaan.
  items:
    - title: Runko ja rakenne
      description: Rungon pituus (2,5–8,5 m), rungon materiaali (GRP-lasikuitu tai merialumiini), rungon väri (gelcoat tai maalattu), köliprofiili (syvä-V, kohtalainen-V, tasainen), peräpeilityyppi (suljettu peräpeili kannakkeella tai kaivolla) ja rakenteellinen vahvistus kaupallisiin kuormitusvaatimuksiin.
      icon: tabler:sailboat
    - title: Putki & kaulus
      description: Putken materiaali (0,9–1,2 mm PVC tai 1,4–1,7 mm Hypalon/CSM), putken halkaisija (40–55 cm), kammioiden lukumäärä (3–7), venttiilityyppi (Halkey-Roberts, Leafield D7 tai Boston), putken väri (vakio tai mukautettu) ja kauluskartio/kartiokokoonpano.
      icon: tabler:circle
    - title: Kannen ja konsolin asettelu
      description: Keskikonsoli, sivukonsoli tai ohjaustanko. Istuinjärjestelyt (jockey-istuimet, penkkipenkit, tukiistuimet). Kannen päällyste (EVA-vaahtomuovi teak-look, liukumaton maali tai paljas GRP). Laitteen kiinnityskohdat, tartuntakiskot ja D-renkaiden paikat.
      icon: tabler:layout-dashboard
    - title: Sähkö & Navigointi
      description: Navigointivalot (LED), pilssipumppujärjestelmä, akunhallinta, VHF-radion asennus, GPS/karttaplotterin kiinnitys, USB-latausportit ja kytkinpaneelin kokoonpano.
      icon: tabler:bolt
    - title: Brändäys & Grafiikka
      description: Runko- ja putkigrafiikka (silkkipainatus, lämmönsiirto, UV-digitaalipainatus), logon sijoittelu, mittatilaustyönä tehdyt värimallit, tunnistemerkinnät ja mukautettu omistajan dokumentaatio brändisi kanssa.
      icon: tabler:palette
    - title: Turvallisuus ja vaatimustenmukaisuus
      description: Suunnitteluluokkaluokitus (A/B/C/D per RCD), palonsammutusjärjestelmä, polttoainejärjestelmän tekniset tiedot (kannettava säiliö, kiinteä säiliö, kannen alla) ja vaatimustenmukaisuusasiakirjapaketti kohdemarkkinoillesi.
      icon: tabler:shield
content_applications:
  tagline: Sovelluksen asetukset
  title: RIB-määritykset<br />sovelluksen mukaan
  subtitle: Eri tehtävät vaativat erilaisia kokoonpanoja. Tässä on todistettuja asetuksia yleisimpiin RIB-sovelluksiin.
  items:
    - title: Pelastus ja partio
      description: Deep-V-runko, Hypalon-putket, itseohjautuva kansi, tukiistuimet, tartuntakahvat, navigointivalot ja raskaat D-renkaat. RCD-suunnitteluluokka B tai C. Palonkestävä polttoainejärjestelmä ja kaupallinen sähkö.
      icon: tabler:lifebuoy
    - title: Sukellustuki
      description: Leveä palkki, takaportaat, säiliötelineiden paikat, ylimääräiset D-renkaat, sukelluslipun kiinnitys, vahvistettu peräpeili kaksoisperämoottoreille ja luistamaton täyskannen EVA-päällyste.
      icon: tabler:mask
    - title: Matkailu ja kauppa
      description: Matkustajien sertifioitu pohjaratkaisu, jossa on penkit, aurinkosuoja/Bimini, tartuntakiskot, kuivavarasto ja kaksoisakkujärjestelmä. RCD-luokka C. Suunniteltu loma- ja tilauslentokoneen toimintaan.
      icon: tabler:beach
    - title: Kalastus
      description: Avokansi asettelu, vavan pidikkeiden paikat, elävän syöttikaivo, kalakaikuteline, uistelumoottoriteline, vahvistettu peräpeili ja kannettava polttoainejärjestelmä. Keskikonsolin tai sivukonsolin vaihtoehdot.
      icon: tabler:fish
    - title: Vapaa-ajan- ja jahtitarjous
      description: Kevyt runko, PVC-putket, mukavat istuimet, teleskooppinen ohjausaisa tai kompakti konsoli, nostopisteet taavetille ja irrotettava polttoainesäiliö. RCD-luokka C tai D.
      icon: tabler:sailboat
    - title: Ammattimainen työvene
      description: Vaihtoehtoinen alumiinirunko, raskaaseen käyttöön tarkoitettu vahvistus, hydraulinen ohjaus, kaupalliset sähkölaitteet, tutkakaari ja tehtäväkohtaiset laitteiden integrointipisteet. Mukautettu vaatimustenmukaisuus projektikohtaisesti.
      icon: tabler:anchor
process_steps:
  title: 7-vaiheinen RIB OEM/ODM -kehitysprosessi
  subtitle: Projektiselosteesta jälkimyyntiin – määritelty työnkulku, jossa on selkeät virstanpylväät ja suoritukset
  steps:
    - number: '01'
      title: Projektitiedote ja vaatimukset
      description: Määrittele kohdesovellus, rungon koko, putkimateriaali, vaatimustenmukaisuusvaatimukset ja brändäystarpeet. Arvioimme toteutettavuuden ja vahvistamme yhteistyömallin (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3-5 päivää
    - number: '02'
      title: Tekninen katsaus ja toteutettavuus
      description: Suunnittelutiimi arvioi rakenteen toteutettavuuden, vakavuus- ja kelluvuuslaskelmat, vaatimustenmukaisuuspolun ja materiaalin saatavuuden. Tunnistamme olemassa olevat muotit tai mukautetut muottivaatimukset.
      timeline: 5-7 päivää
    - number: '03'
      title: Ehdotus ja tarjous
      description: Saat yksityiskohtaisen ehdotuksen, joka sisältää tekniset tiedot, 3D-renderöinnit tai GA-piirustukset, vaatimustenmukaisuuden laajuuden, aikajanan ja yksikköhinnoittelun määrätasojen ja MOQ:n perusteella.
      timeline: 5-7 päivää
    - number: '04'
      title: Suunnittelun vahvistus ja näytteenotto
      description: Hyväksy lopullinen GA, kannen asettelu ja putken kokoonpano. Tuotamme esituotannon näytteen, jossa on tuotemerkkisi värejä, logoa ja määritetyt materiaalit fyysistä tarkastusta varten.
      timeline: 15-20 päivää
    - number: '05'
      title: Hyväksyntä- ja laadunvalvontaprotokollan näyte
      description: 'Tarkista ja hyväksy näyte. Määrittele tuotannon laadunvalvontaprotokolla: painetesti (1,25x / 24–48h), mittatarkistukset ja vaatimustenmukaisuusdokumentaation tarkistuslista runkokohtaisesti.'
      timeline: 3-5 päivää
    - number: '06'
      title: Massatuotanto ja laadunvalvonta
      description: Täysi tuotantoajo 100 pisteen laadunvalvontatarkistuslistalla yksikköä kohti. Prosessin sisäiset tarkastukset, painetestaus ja sarjatason jäljitettävyys. CE/ISO-dokumentaatio laadittu rinnakkain.
      timeline: 30-45 päivää
    - number: '07'
      title: Pakkaus, toimitus ja jälkimyynti
      description: Räätälöidyt pakkaukset (vakio-, vähittäismyyntivalmiit tai lavalliset), vientiasiakirjat, kontin lastaus ja logistiikka. Mukana varaosasarjat ja huoltodokumentaatio.
      timeline: 7-14 päivää
