        description: Tukkuhinnat kaikille SUP-laudoille, kajakkeille, RIB:ille ja tarvikkeille
      - title: Oma tilivastaava
        description: Keskitetty yhteyspiste tilauksia, tukea ja tuotetietoja varten
      - title: Markkinointimateriaalit
        description: Tuotekuvat, tekniset tiedot, esitteet ja digitaaliset resurssit omalla kielelläsi
      - title: Logistiikan tuki
        description: Lähetyksen koordinointi, tulliasiakirjat ja varastotoimitus
      - title: Esimerkkiohjelma
