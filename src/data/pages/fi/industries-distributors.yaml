        description: Volyymiperusteiset hinnoittelutasot ja neljännesvuosittaiset alennusohjelmat
      - title: Eksklusiivinen alue
        description: Suojatut jakeluoikeudet alueellasi tai maassasi
      - title: Drop-Ship-ohjelma
        description: Toimita suoraan asiakkaillesi varastostamme tuotemerkilläsi
      - title: Yksityinen merkintä
        description: Täysi OEM/ODM-tuki omalle tuotemerkillesi – levyille, veneille ja lisävarusteille
