      - title: Räätälöity tuotekehitys
        description: Ainutlaatuiset tuotesuunnittelut ja tekniset tiedot markkinoillesi
      - title: Paikallisen varaston tuki
        description: Varastolähetys, paikallinen varaosavarasto ja alueellisen huoltokeskuksen asennus
      - title: Jälleenmyyjän verkkotuki
        description: Koulutusohjelmat, sertifiointikurssit ja jälleenmyyjien paikantimien integrointi
      - title: Vuosittainen kumppanihuippukokous
