hero:
  tagline: Sertifioinnit & Standardit
  title: 'Laatusertifioinnit<br />& Vaatimustenmukaisuusstandardit'
  subtitle: 'Aquafarer-tuotteet valmistetaan kansainvälisten meriturvallisuusstandardien, laadunhallintajärjestelmien ja ympäristömääräysten mukaisesti.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Aquafarerin laatustodistukset ja vaatimustenmukaisuusdokumentaatio
content_certifications:
  tagline: Sertifiointimme
  title: 'Sertifioitu laatu,<br />maailmanlaajuisesti tunnustettu'
  subtitle: '64 CE-sertifioitua mallia ja koko tehtaan sertifioinnit osoittavat sitoutumisemme laatuun, turvallisuuteen ja ympäristövastuuseen.'
  items:
    - title: 'CE-sertifioitu'
      description: '64 CE-sertifioitua mallia täyttää Euroopan CE-merkintävaatimukset virkistysaluksille, mikä varmistaa turvallisuus-, terveys- ja ympäristönsuojelustandardien täyttymisen.'
      icon: tabler:certificate
    - title: 'ISO 9001:2015'
      description: 'Laadunhallintajärjestelmämme on sertifioitu ISO 9001:2015 -standardin mukaisesti ja kattaa ilmatäytteisten alusten ja merenkulkulaitteiden suunnittelun, valmistuksen ja jakelun.'
      icon: tabler:clipboard-check
    - title: 'UKCA-merkintä'
      description: 'Britannian markkinoilla myytävät tuotteet kantavat UKCA-merkintää, mikä vahvistaa vaatimustenmukaisuuden Yhdistyneen kuningaskunnan määräysten kanssa merenkulkulaitteille ja virkistysaluksille.'
      icon: tabler:shield
    - title: 'BSCI-vaatimustenmukaisuus'
      description: 'Aquafarer on BSCI (Business Social Compliance Initiative) -auditoinnin kohteena, mikä osoittaa eettisiä valmistuskäytäntöjä, reiluja työolosuhteita ja vastuullisuutta toimitusketjussa.'
      icon: tabler:heart-handshake
    - title: 'REACH-vaatimustenmukaisuus'
      description: 'Kaikki Aquafarer-tuotteissa käytetyt materiaalit täyttävät EU:n REACH-asetuksen kemikaaliturvallisuusvaatimukset, mikä varmistaa, että PVC:ssämme, Hypalonissa tai komponenteissamme ei ole rajoitettuja aineita.'
      icon: tabler:flask
    - title: 'Materiaalitestaus'
      description: 'Kankaita testataan vetolujuuden, repeämävastuksen, UV-hajoamisen ja kylmähalkeilusuorituskyvyn osalta. Jokaisesta tuotantoerästä otetaan näytteet ja varmistetaan.'
      icon: tabler:test-pipe
content_factory:
  tagline: Tehdasstandardit
  title: 'Valmistuksen huippuosaaminen<br />— rakennettu spesifikaation mukaan'
  subtitle: '12,000 m²:n tuotantolaitoksemme toimii tiukoilla laadunvalvontaprotokollilla jokaisessa tuotantovaiheessa.'
  list:
    - 'Saapuvien materiaalien tarkastus: kaikki raaka-aineet — PVC-kangas, Hypalon, alumiini, vaneri, liimat — testataan spesifikaatioita vastaan ennen tuotantoon siirtymistä.'
    - 'Laadunvalvonta prosessissa: jokaisella tuotantovaiheella on dokumentoidut QC-tarkistuspisteet. Hitsauksen lujuus, saumojen kohdistus, venttiilien asennus ja liitosten kiristysmomentti varmistetaan linjalla.'
    - 'Painetestaus: Jokainen puhallettava kammio painetestataan 1,25-kertaisella nimellispaineella 24-48 tunnin ajan. Vuotonopeuden on oltava nolla, jotta se läpäisee laadun.'
    - 'Lopputarkastus: valmiit tuotteet tarkastetaan mitallisen tarkkuuden, pinnan viimeistelyn, tarvikkeiden täydellisyyden ja pakkauksen eheyden osalta ennen lähetystä.'
    - 'Eräseuranta: jokainen tuote kantaa sarjanumeroa, joka on linkitetty tuotantoerän kirjauksiin, mikä mahdollistaa täyden jäljitettävyyden raaka-aineesta valmiiseen tuotteeseen.'
content_safety:
  tagline: Meriturvallisuusstandardit
  title: 'Turvallisuus ensin<br />— suunniteltu luotettavaan käyttöön'
  subtitle: 'Aquafarer-tuotteet on suunniteltu ja testattu täyttämään kansainväliset meriturvallisuusstandardit kaupalliseen ja virkistyskäyttöön.'
  items:
    - title: 'ISO 6185'
      description: 'Ilmatäytteiset veneet täyttävät ISO 6185 -standardit rakenteen, vakauden, kelluvuuden ja kuormakapasiteetin osalta.'
      icon: tabler:sailboat
    - title: 'ABYC-standardit'
      description: 'Sähköjärjestelmät ja polttoainejärjestelmät noudattavat ABYC (American Boat & Yacht Council) -standardeja turvallista asennusta ja käyttöä varten.'
      icon: tabler:bolt
    - title: 'SOLAS-vaatimustenmukaisuus'
      description: 'Turvallisuusvarusteet ja pelastusvälineet täyttävät SOLAS (Safety of Life at Sea) -vaatimukset soveltuvin osin.'
      icon: tabler:lifebuoy
cta:
  title: 'Tarvitsetko sertifioituja tuotteita projektiisi?'
