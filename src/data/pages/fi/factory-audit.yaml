content_priorities:
  tagline: Mitä asiakkaat vahvistavat
  title: 8 asiaa, jotka ostajat varmistavat<br />jokaisella tehdaskäynnillä
  subtitle: Yli 50 maan ostajan palautteen perusteella nämä ovat kahdeksan prioriteettia, jotka asiakkaat arvioivat ennen B2B-tilauksen tekemistä.
  items:
    - title: Todellinen Valmistaja
      description: 'Oletko varsinainen tehdas, et kauppayhtiö? Ostajat tarkistavat: toimielimen, todelliset tuotantolaitteet, koneita käyttävät työntekijät, nykyiset tuotantotilaukset lattialla sekä nettisivujen ja työpajan yhteensopivuuden.'
      icon: tabler:building-factory
    - title: Sovellukseen sopiva tuote
      description: Vastaako RIB niiden erityistä käyttötapausta? Loma-, pelastus-, sukellus-, kalastus- ja partiotoiminnan harjoittajilla on olennaisesti erilaiset vaatimukset. Ostajat arvioivat esillä olevan veneen kannen asettelua, putkimateriaalia ja varusteluvaihtoehtoja.
      icon: tabler:target
    - title: Laadun vakaus ja toistettavuus
      description: Onko 50. yksikkö yhtä hyvä kuin 1? Ostajat tarkastelevat laadunvalvontajärjestelmiä, prosessin sisäisiä tarkistuspisteitä, poikkeamien käsittelyä ja pyytävät nähdä tietueita useista tuotantoajoista yhdenmukaisuuden varmistamiseksi.
      icon: tabler:repeat
    - title: Vaatimustenmukaisuusasiakirjan aitous
      description: Ovatko CE-todistukset mallikohtaisia? Onko vaatimustenmukaisuustodistuksen todellinen henkilö allekirjoittanut? Voidaanko vaatimustenmukaisuus varmistaa rungon numeron mukaan? Ostajat tarkistavat yleiset väitteet ja mallikohtaiset asiakirjat.
      icon: tabler:file-certificate
    - title: Räätälöinnin toteutus
      description: Voiko tehdas todella toimittaa mukautettuja kokoonpanoja? Ostajat etsivät todisteita aiemmista räätälöidyistä projekteista, prototyyppinäytteitä esillä, suunnittelupiirustuksia ja kykyä keskustella teknisistä muutoksista paikan päällä.
      icon: tabler:adjustments
    - title: Toimitusaika ja kapasiteetti
      description: 'Ovatko lainatut aikajanat realistisia? Ostajat arvioivat: nykyisen tuotantomäärän, käytettävissä olevan kapasiteetin, työvoiman määrän, materiaalivarastot ja onko tehtaalla tuotannon suunnittelujärjestelmä.'
      icon: tabler:clock
    - title: Hinta ja kauppaehdot
      description: 'Ovatko hinnat läpinäkyviä? Onko FOB-hinnoittelu selvä? Ostajat varmistavat: yksikköhinnan erittelyn, työkalukustannukset, pakkauskustannukset ja sen, pystyykö tehdas käsittelemään DDP tai CIF ehdot asianmukaisilla vientiasiakirjoilla.'
      icon: tabler:currency-dollar
    - title: Jälkimyynti ja varaosat
      description: 'Mitä tapahtuu toimituksen jälkeen? Ostajat arvioivat: varaosien saatavuuden, takuuprosessin, vaihtoputkiosien, venttiilien vaihdon ja onko tehtaalla dokumentoitu huoltopöytäkirja.'
      icon: tabler:headset
content_tour:
  tagline: Tehdaskierrosreitti
  title: Tarkastuskierros –<br />Mitä näet
  subtitle: Tavallinen tehdaskierroksemme seuraa määriteltyä reittiä, joka on suunniteltu vastaamaan ostajien kysymyksiin jokaisella asemalla.
  items:
    - title: 1. Kokoushuone – Yrityksen esittely
      description: Toimilupa, ISO 9001- ja BSCI-sertifikaatit, vientilisenssit ja yrityksen historia. Nopea yleiskatsaus tuotantomahdollisuuksiin ja vaatimustenmukaisuuden laajuuteen.
      icon: tabler:users
    - title: 2. Raaka-ainevarasto — IQC-asema
      description: Saapuvien materiaalien tarkastuspöytäkirjat, kangaserätodistukset, liimat ja laitteistonäytteet. Katso, miten materiaalit testataan ennen tuotantoon siirtymistä.
      icon: tabler:building-warehouse
    - title: 3. Putkien valmistus — RF-hitsaus ja käsinliimaus
      description: Liveputken hitsaus- tai liimausprosessi, sauman lujuustestien esittelyt ja venttiilien asennus. Tarkkaile kammiokohtaista rakennetta ja laaduntarkistuspisteitä.
      icon: tabler:flame
    - title: 4. Rungon laminointi – GRP-työpaja
      description: Lasikuidun levitysprosessi, gelcoatin levitys ja rungon kovetus. Katso eri RIB-mallien laminointiaikataulu ja rakennevahvikkeet.
      icon: tabler:layers-subtract
    - title: 5. Kokoonpano ja integrointi
      description: Rungon putkien liittäminen, konsoli- ja istuinasennus, sähkö- ja polttoainejärjestelmän integrointi sekä laitteiden asennus. Tarkkaile tuotantolinjaa toiminnassa.
      icon: tabler:tool
    - title: 6. Painetestausasema
      description: 24-48 tunnin paineenpitotesti 1,25-kertaisella nimellispaineella. Tarkastele testitietueita, painemittareita ja hyväksymis-/hylkäyskriteerejä. Katso, kuinka testitulokset yhdistetään rungon sarjanumeroihin.
      icon: tabler:gauge
    - title: 7. Lopputarkastus ja laadunvalvonta
      description: 100 pisteen laaduntarkistuslista yksikköä kohden, mittojen tarkastus, kosmeettinen tarkastus ja pakkauksen eheyden tarkistus. Tarkista poikkeamalokit ja korjaustoimenpiteet.
      icon: tabler:clipboard-check
    - title: 8. Asiakirjan tarkistushuone
      description: Mallikohtainen vaatimustenmukaisuusdokumentaatio (DoC, rakennuslevy, omistajan käsikirja), tuotannon jäljitettävyystietueet, HIN-rekisteri ja materiaalierän seurantatietokannan esittely.
      icon: tabler:folder
content_qc_chain:
  tagline: Laatutodistus
  title: 8-vaiheinen laadunvalvontaketju<br />— Todennettavissa joka vaiheessa
  subtitle: Laadunvalvontaketjumme ulottuu saapuvista materiaaleista lopulliseen toimitukseen, ja jokaisessa vaiheessa on dokumentoitu näyttö.
  items:
    - title: 'Vaihe 1: Saapuvan materiaalin tarkastus'
      description: Jokainen PVC-, Hypalon-, lasikuitu-, alumiini-, liima- ja laitteisto-erä testataan eritelmien mukaan ennen tuotantoon siirtymistä. Vetolujuus, pinnoitteen tarttuvuus ja mittatarkistukset AQL 2.5/ISO 2859 mukaan.
      icon: tabler:package
    - title: 'Vaihe 2: Putken hitsaus / liimaus QC'
      description: Sauman kuoriutumislujuuden testaus tuotantoerää kohti. RF-hitsausparametreja valvotaan ja tallennetaan. Käsin liimatut saumat tarkistettiin tasaisen liiman peittävyyden ja kovettumisajan varmistamiseksi.
      icon: tabler:flame
    - title: 'Vaihe 3: Rungon laminoinnin laadunvalvonta'
      description: Geelipinnoitteen paksuuden mittaus, lasikuituasettelun tarkastus laminaattiaikataulun mukaan ja kovettumisajan seuranta. Rakenteelliset vahvistuspaikat tarkistettu teknisten piirustusten perusteella.
      icon: tabler:layers-subtract
    - title: 'Vaihe 4: Kokoonpano ja integrointi QC'
      description: Rungon ja putken liitoksen eheys, konsolin ja istuimen kiinnitysmomentti, sähköinen jatkuvuus ja polttoainejärjestelmän vuototesti. Jokainen asennuskohta on tarkistettu mallikohtaisen kokoonpanon tarkistuslistan perusteella.
      icon: tabler:tool
    - title: 'Vaihe 5: Paineenpitotesti'
      description: Jokainen puhallettava kammio paineistettiin 1,25-kertaiseen PSI-arvoon ja pidettiin 24–48 tuntia. Painehäviö tallennettu kammiota kohti. Hyväksytty/hylätty kynnys dokumentoitu. Linkitetty rungon sarjanumeroon.
      icon: tabler:gauge
    - title: 'Vaihe 6: Lopputarkastus'
      description: 100 pisteen laaduntarkistuslista, joka kattaa mittatarkkuuden, kosmeettisen viimeistelyn, tarvikkeiden täydellisyyden, dokumentaatiopaketin ja pakkauksen eheyden. Riippumaton tuotantotiimistä.
      icon: tabler:clipboard-check
    - title: 'Vaihe 7: Vaatimustenmukaisuusasiakirjat'
      description: Mallikohtainen DoC, rakennuskilven varmistus, omistajan käsikirjan täydellisyys ja HIN-rekisterimerkintä. Kaikki vaatimustenmukaisuusasiakirjat on laadittu ja tarkistettu ennen lähetyksen vapauttamista.
      icon: tabler:file-certificate
    - title: 'Vaihe 8: Lähetyksen vapauttaminen ja jäljitettävyys'
      description: Lopullinen julkaisu edellyttää, että kaikki laadunvalvontavaiheet on läpäissyt, vaatimustenmukaisuusasiakirjat on valmis ja lähetysasiakirjat on tarkistettu. Rungon tietue suljettu ja arkistoitu yli 10 vuoden säilytystä varten.
      icon: tabler:truck
content_traceability:
  tagline: Tuotannon jäljitettävyys
  title: HIN → Päätiedosto →<br />Hull Record → Toimitus
  subtitle: Jokaisella RIB-veneellä on yksilöllinen rungon tunnusnumero, joka on yhdistetty täydelliseen tuotanto- ja vaatimustenmukaisuustietueketjuun.
  items:
    - title: Rungon tunnusnumero (HIN)
      description: Jokaiseen veneeseen pysyvästi merkitty 14-merkkinen yksilöllinen tunniste. Koodaa valmistajakoodin (MIC), mallimerkinnän, valmistusvuoden ja sarjanumeron. Avain, joka avaa koko jäljitettävyysketjun.
      icon: tabler:hash
    - title: Master tekninen tiedosto
      description: Malliperheen vaatimustenmukaisuus ja tekninen dokumentaatio. Sisältää GA-piirustukset, riskiarvioinnin, vakauslaskelmat, materiaalitiedot ja sovellettavat standardit. Yhdistetty kaikkiin kyseisen mallin rungoihin.
      icon: tabler:folder
    - title: Yksittäinen runkoennätys
      description: 'Runkokohtainen tuotantotietue: HIN, valmistuspäivämäärä, putkierä, materiaalitodistukset, painetestin tulos, lopullinen konfiguraatio, moottorin erittely, laadun tarkistuslistan tulokset ja toimituskohde. Yli 21 tietokenttää runkoa kohden.'
      icon: tabler:file-description
    - title: Asiakkaan vaatimustenmukaisuuspaketti
      description: Runkokohtainen toimituspaketti, joka sisältää vaatimustenmukaisuuden, rakennuslevyn valokuvan, omistajan käsikirjan, vaatimustenmukaisuuden tarkistusluettelon ja lopullisen konfigurointilomakkeen. Toimitettu veneen mukana ja arkistoitu tehtaalla yli 10 vuotta.
      icon: tabler:package
content_red_flags:
  tagline: Tarkastuksen sudenkuopat
  title: Punaisten lippujen ostajat<br />löydät helposti
  subtitle: Yleisiä ongelmia, jotka heikentävät ostajien luottamusta tehdastarkastusten aikana. Käsittelemme jokaista proaktiivisesti.
  items:
    - title: Peitto CE-vaatimukset ilman mallin laajuutta
      description: '"Kaikki tuotteet CE-sertifioitu" määrittelemättä mikä direktiivi, mitkä mallit ja mikä vaatimustenmukaisuusmoduuli. Punainen lippu: ehdottaa, että yhteensopivuus on pinnallista pikemminkin kuin malli- ja kokoonpanokohtaista.'
      icon: tabler:alert-triangle
    - title: Ei fyysisiä kokeita
      description: 'Painetestausvaatimukset ilman testipöytäkirjoja, mittareita tai testausasemaa, jotka näkyvät tehtaan kerroksessa. Punainen lippu: laatuvaatimuksia ei voida tarkistaa vierailun aikana.'
      icon: tabler:alert-triangle
    - title: Puuttuva materiaalin jäljitettävyys
      description: 'Ei eräkirjauksia, ei saapuvia tarkastuksia tai ei yhteyttä materiaalitodistusten ja valmiiden tuotteiden välillä. Punainen lippu: laatuongelmia ei voida jäljittää lähteeseen.'
      icon: tabler:alert-triangle
    - title: Yleinen dokumentaatio
      description: 'Yksi DoC, joka kattaa kaikki mallit, ei HIN-kohtaisia tietueita tai "mallipohjaisia" vaatimustenmukaisuusasiakirjoja. Punainen lippu: vaatimustenmukaisuus ei ole sidottu yksittäisiin tuotantoyksiköihin.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Toimitus ja pakkaus
  title: RIB-veneiden konttimerkkaus<br />ja puulaatikkopakkaus
  subtitle: Toimitusratkaisumme suojaavat investointiasi Qingdaosta määräsatamaan. Konttien lastaussuunnitelmat ja pakkausmääritykset saatavilla jokaiselle mallille.
  items:
    - title: 20 jalan konttikonfiguraatiot
      description: 'Vakio-20 jalan kontti: 1-2 RIB-venettä (4,0-5,5 m) sisäkkäin kannella ja putkilla erotettuna, tai 8-12 SUP-lautaa. Sekamuotoiset RIB + SUP-konfiguraatiot saatavilla. Yksityiskohtainen lastaussuunnitelma toimitetaan jokaisen tilauksen mukana.'
      icon: tabler:box
    - title: 40 jalan konttikonfiguraatiot
      description: 'Vakio-40 jalan kontti: 2-4 RIB-venettä (jopa 7,0 m) rungot sisäkkäin ja putket pinottuina, tai 20-30 SUP-lautaa. 40 jalan HQ saatavilla korkeampia RIB-malleja varten. Tilavuudeltaan optimoitu pakkaus alentaa toimituskustannusta yksikköä kohti.'
      icon: tabler:container
    - title: Puulaatikot RIB-runkoihin
      description: Alumiini- ja GRP-rungot pakattuna mittatilaustyönä valmistettuihin puulaatikoihin vaahtopehmusteella, kosteuseristeellä ja teräspannuksella. Laatikoiden mitat ja paino mallikohtaisesti saatavilla logistiikkasuunnittelua varten. ISPM-15-lämpökäsitelty puu -sertifiointi sisältyy.
      icon: tabler:wood
    - title: Pakkaus putkien ja kannen erottelulla
      description: Putket tyhjennettyinä ja taiteltuina erilleen rungoista tilatehokkuuden vuoksi. Kannelaataat, konsolit ja istuimet pakattuina suojakääreeseen kiinnitystarvikkeiden kera. Uudelleenkokoamisohjeet sisältyvät jokaiseen toimitukseen.
      icon: tabler:package
    - title: Suojaus kosteudelta ja korroosiolta
      description: VCI-korroosiosuojapaperi alumiiniosille, silikageelikosteusainepussit ja tyhjiöpaketatut tarvikepussit. Estää kondenssivahingot 30-45 päivän merikuljetuksen aikana.
      icon: tabler:droplet-off
    - title: FOB Qingdao -dokumentaatio
      description: Konossement, kauppalasku, pakkauslista, alkuperäsertifiointi ja vaatimustenmukaisuusdokumentaatio jokaisessa toimituksessa. FCL- ja LCL-konsolidaatio saatavilla. Tullidokumentaation tuki EU-, USA- ja Lähi-itämarkkinoille.
      icon: tabler:file-text
faq:
  title: Tehdastarkastus – usein kysyttyjä kysymyksiä
  questions:
    - q: Voinko vierailla tehtaalla henkilökohtaisesti?
      a: Kyllä. Otamme mielellämme vastaan paikan päällä tehdastarkastukset 12 000 m²:n Qingdaon laitoksessamme. Vakiokierroksemme kattaa 8 asemaa raaka-ainevarastosta asiakirjojen tarkistushuoneeseen. Perustutkintoa varten on saatavilla myös virtuaalisia tehdaskierroksia videopuhelun kautta.
    - q: Hyväksytkö kolmannen osapuolen auditoinnit (BSCI, SMETA, SGS)?
      a: Kyllä. Ylläpidämme BSCI-sertifiointia (Intertek) ja hyväksymme asiakaskohtaiset auditointiprotokollat. Voimme myös järjestää SGS- tai TÜV-tarkastuksia pyynnöstä. Tarkastusraportit ovat saatavilla NDA:ssa.
    - q: Voinko nähdä painetestin käynnin aikana?
      a: Painetestausasemamme on osa vakioreittiä. Tuotantoaikataulusta riippuen voit tarkkailla aktiivisia painetestejä mittarilukemilla ja testimuistiinpanoilla. Runkokohtaiset painetestauslokit ovat aina saatavilla tarkastettavaksi.
    - q: Miten käsittelet vaatimustenvastaisia tuotteita?
      a: Vaatimustenvastaiset yksiköt erotetaan, dokumentoidaan ja tarkistetaan ISO 9001 -korjausprosessimme mukaisesti. Perussyyanalyysi suoritetaan, korjaavat toimenpiteet toteutetaan ja kirjaa ylläpidetään. Ostajat voivat tarkastella NCR-lokiamme auditoinnin aikana.
    - q: Mitä vaatimustenmukaisuusasiakirjoja on saatavilla tarkastettavaksi?
      a: 'Auditoinnin aikana voit tarkastella: mallikohtaisia DoC-näytteitä, rakennuslevyn spesifikaatioita, HIN-rekisteriä, omistajan käsikirjan luonnoksia, sovellettavien standardien luetteloita ja vaatimustenmukaisuuden arviointitietueita malliperhekohtaisesti.'
    - q: Kuinka voin varata virtuaalisen tehdaskierroksen?
      a: Ota yhteyttä myyntitiimiimme varataksesi live-videokierroksen WhatsAppin, Zoomin tai Teamsin kautta. Seuraamme samaa 8 aseman reittiä ja voimme keskittyä tietyille alueille kiinnostuksen kohteidesi perusteella. Tyypillinen virtuaalikierros on 45-60 minuuttia.
    - q: Onko tehdas todellinen valmistaja vai kauppayhtiö?
      a: Aquafarer on todellinen valmistaja. Toimimme tehtaalla Laixissa, Qingdaossa. Toimilupa, valmistuslaajuus ja fyysinen tuotanto ovat kaikki todennettavissa tarkastuksen aikana.
    - q: Mitä laatutietueita voin tarkistaa?
      a: Saapuvat materiaalin tarkastustiedot, prosessinaikaiset QC-tarkastuspisteet, painetestauslokit, 100 pisteen lopputarkastuksen tarkistuslistat, poikkeamaraportit, korjaustoimenpiteet ja runkokohtaiset jäljitettävyystiedot. Kaikki huollettu ISO 9001 vaatimusten mukaisesti.
cta:
  title: Varaa tehdaskierros
  subtitle: Varaa reaaliaikainen videotehdaskierros tai suunnittele vierailu Qingdaon laitokseemme paikan päällä. Katso tuotanto-, laadunvalvontajärjestelmämme ja vaatimustenmukaisuusdokumentaatiomme suoraan.
  actions:
    - variant: primary
      text: Varaa live-tehdasvideokierros
      href: /contact
    - text: Pyydä laadunvarmistuksen tarkistuslista
      href: /contact
content_audit_evidence:
  tagline: Todistustodistus
  title: Tarkastustodistus<br />Voit vahvistaa paikan päällä
  subtitle: Tehdaskäyntien aikana asiakkaat voivat tarkistaa tietyt todisteet kullakin tuotantoalueella. Tässä on mitä etsiä – ja mitä valmistaudumme jokaiseen auditointiin.
  areas:
    - area: Raaka-ainevarasto
      what_to_verify: Ovatko materiaalit stabiileja? Onko eräsekoitusta?
      evidence: Saapuvat tarkastuspöytäkirjat, eräetiketit, FIFO-varasto, toimittajien hyväksyntäluettelo, materiaalitodistukset (PVC, Hypalon, lasikuitu, alumiini, liimat, laitteistot)
      icon: tabler:building-warehouse
    - area: Putkien tuotanto
      what_to_verify: Miten sauman lujuus ja ilmatiiviys taataan?
      evidence: Prosessikortit, ensimmäisen artikkelin vahvistus, painetestitiedot kammiota kohti, korjaus- ja uudelleentestauslokit, venttiilien asennustiedot
      icon: tabler:flame
    - area: Runkotuotanto
      what_to_verify: Miten rakenteellista yhtenäisyyttä valvotaan?
      evidence: Valvotut prosessiasiakirjat, laaduntarkistuspisteet, puolivalmiiden tuotteiden numerointi, gelcoat-paksuuden mittaukset, laminointiaikataulun tarkistus
      icon: tabler:layers-subtract
    - area: Kokoonpanoalue
      what_to_verify: Miten valinnaisten osien väärinkäyttö estetään?
      evidence: BOM, työmääräykset, kokoonpanon tarkistuslistat, työaseman tarkastuskortit, vääntömomentti ja toimintatarkistukset mallikohtaisesti
      icon: tabler:tool
    - area: Testausasema
      what_to_verify: Kuinka varmistat, että vene on hyvä ennen toimitusta?
      evidence: Testausmenettelyt, instrumenttiluettelo, kalibrointitietueet, painetestauslokit (1,25x / 24-48h), toiminnallisten testien tarkistuslistat, hyväksytty/hylätty kriteerit dokumentoitu
      icon: tabler:gauge
    - area: Ei-vaatimustenmukaisuusalue
      what_to_verify: Miten viat käsitellään?
      evidence: Eristystarrat, NCR-lokit, perussyyanalyysi, muokkaushyväksyntätietueet, CAPA-seuranta (korjaava ja ehkäisevä toiminta)
      icon: tabler:alert-triangle
    - area: Valmiiden tuotteiden varasto
      what_to_verify: Kuinka estät virheelliset lähetykset ja vauriot?
      evidence: Valmiiden tuotteiden etiketit, tilausten täsmäytystiedot, pakkausstandardit, kuljetusta edeltävät tarkastukset
      icon: tabler:box
    - area: Varaosat ja jälkimyynti
      what_to_verify: Voitko tukea pitkäaikaista myynninjälkeistä myyntiä?
      evidence: Yleinen varaosaluettelo, varastostrategia, osien numerointijärjestelmä, takuuprosessin dokumentaatio, huolto-opastukset
      icon: tabler:headset
content_closing_script:
  tagline: Tarkastus tilauksesta
  title: Tehdaskäynnistä<br />vahvistettuun projektiin
  subtitle: Onnistunut auditointi ei saa päättyä valokuviin ja kättelyyn. Ennen lähtöä varmistamme, että kolme kaupallista tulosta dokumentoidaan.
  items:
    - title: Vahvista tekniset asetukset
      description: Sovi mallista, sovelluksesta, tärkeimmistä vaihtoehdoista, kohdemarkkinoista, arvioidusta määrästä ja toimitusaikataulusta – kaikki dokumentoidaan ennen lähtöä.
      icon: tabler:checklist
    - title: Vahvista seuraavan vaiheen asiakirjat
