  subtitle: Raaka-ainetarkastuksesta lopulliseen painetestaukseen — jokainen tuote käy läpi tiukan laatuketjun.
  items:
    - title: Raaka-ainetarkastus
      description: Jokainen PVC-kangasrulla testataan paksuuden, vetolujuuden ja UV-kestävyyden suhteen ennen tuotantoon tuloa.
      icon: tabler:search
    - title: Keskeneräinen QC
      description: Hitsaussaumat, venttiiliasennukset ja kammioliitokset tarkastetaan jokaisella asemalla kokoonpanon aikana.
      icon: tabler:eye
    - title: Painetestaus
      description: Jokainen kumituote täytetään 1,25-kertaiseen nimellis-PSI:hen ja pidetään 24-48 tuntia ilmanpysyvyyden ja saumojen eheyden varmistamiseksi.
      icon: tabler:wind
    - title: Lopputarkastus
      description: Jokainen yksikkö tarkastetaan viimeistelyn, laitteiston ja pakkauksen suhteen ennen lähetykseen hyväksymistä. Erien näytteet menevät laboratorioomme tuhoavaa testausta varten.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB-veneen UKK
  subtitle: Yleisiä kysymyksiä jäykkärunkoisista kumiveneistämme.
  columns: 2
  items:
    - title: Minkä kokoisia RIB-veneitä Paddle Board Overstock tarjoaa?
      description: Tarjoamme 35 RIB-mallia 2,5 metristä 7,6 metriin kattaen kaiken kompakteista tendereistä raskaisiin kaupallisiin ja partiointiveneisiin. Jokainen malli on saatavilla useilla kokoonpanovaihtoehdoilla.
    - title: Mikä on ero RIBin ja perinteisen kumiveneen välillä?
      description: RIB (jäykkärunkoinen kumivene) yhdistää kiinteän lasikuitu- tai alumiinirungon syvä-V-muodossa kumisiin Hypalon- tai PVC-putkiin. Tämä antaa sinulle kovan veneen vakauden ja kantavuuden yhdistettynä kumiveneen iskunvaimennukseen ja kelluvuuteen.
    - title: Mitkä moottorit ovat yhteensopivia Paddle Board Overstock RIB-veneiden kanssa?
      description: RIB-veneemme tukevat perämoottoreita 3 HV:sta 250 HV:seen mallista riippuen. Jokainen tuotesivu ilmoittaa suurimman sallitun moottoritehon. Suosittelemme kysymään jälleenmyyjältäsi ihanteellista yhdistelmää.
    - title: Ovatko Paddle Board Overstock RIB-veneet CE-sertifioituja?
      description: Kyllä. Kaikki vapaa-ajan RIB-mallit on CE-sertifioitu sovellettavien eurooppalaisten vapaa-ajan vesikulkuneuvojen standardien mukaisesti. Kaupalliset ja partiointimallit täyttävät lisävakaus- ja kuormitusvaatimukset.
    - title: Mikä on RIB-veneiden takuu?
      description: Kaikki Paddle Board Overstock RIB-veneet toimitetaan vakio yhden vuoden takuulla valmistusvirheitä vastaan, kattaen rungon delaminoitumisen, putkisaumojen pettämisen, venttiiliviat ja laitteisto-ongelmat.
    - title: Kuinka monta ilmakammiota Paddle Board Overstock RIB-veneissä on?
      description: RIB-veneissämme on 3–7 riippumatonta ilmakammiota mallin pituudesta riippuen. Tämä monikammioinen rakenne varmistaa, että vene pysyy pinnalla, vaikka yksi osasto vaurioituisi.
faqs_inflatable:
  title: Kumiveneiden UKK
  subtitle: Yleisiä kysymyksiä kumijollistamme, -kajakeistamme ja -veneistämme.
  columns: 2
  items:
    - title: Mitä materiaaleja Paddle Board Overstockin kumiveneissä käytetään?
      description: Käytämme sotilaslaatuista PVC:tä (1100 denier) ja premium-Hypalon/CSM-kumia mallista riippuen. Molemmat materiaalit ovat UV-stabiloituja, kulutuskestäviä ja EU:n REACH- ja RoHS-määräysten mukaisia.
    - title: Kuinka kauan kumiveneet kestävät?
      description: Asianmukaisella hoidolla laadukas PVC-kumivene kestää 7–10 vuotta, kun taas Hypalon-mallit voivat kestää 15–20 vuotta. Säännöllinen puhdistus, UV-suojaus ja oikea säilytys pidentävät käyttöikää merkittävästi.
    - title: Mitä huoltoa kumivene vaatii?
      description: Perushuoltoon kuuluu huuhtelu makealla vedellä jokaisen käytön jälkeen (etenkin suolavedessä), kuivaus ennen säilytystä, venttiilien tiivisteiden vuosittainen tarkistus ja UV-suojan levittäminen putkiin. Vältä pitkäaikaista altistumista auringolle, kun venettä ei käytetä.
    - title: Voiko kumiveneitä käyttää suolavedessä?
      description: Kyllä. Kaikki Paddle Board Overstockin kumiveneet on suunniteltu käytettäväksi sekä makeassa että suolaisessa vedessä. Suosittelemme huuhtelua makealla vedellä ja perusteellista kuivausta suolavesialtistuksen jälkeen liitoskorroosion ja kankaan suolakiteytymisen estämiseksi.
    - title: Kuinka säilytän kumivenettä?
      description: Tyhjennä ilma, puhdista ja kuivaa vene kokonaan ennen säilytystä. Rullaa löysästi (vältä teräviä taitoksia), säilytä viileässä ja kuivassa paikassa suojassa suoralta auringonvalolta ja pidä betonilattioiden yläpuolella kosteuden imeytymisen estämiseksi.
    - title: Mikä on Paddle Board Overstockin kumiveneiden kantavuus?
      description: Kantavuudet vaihtelevat 290 kilosta pienimmille malleille yli 2000 kiloon suuremmille kaupallisille veneille. Jokainen tuotesivu ilmoittaa enimmäiskuormituksen tietylle mallillesi.
faqs_sup:
  title: SUP-lautojen UKK
  subtitle: Yleisiä kysymyksiä seisomamelontalautailulaudoistamme.
  columns: 2
  items:
    - title: Mitä SUP-lautakokoja on saatavilla?
      description: Tarjoamme SUP-lautoja 9 jalasta 12 jalkaan, mukaan lukien yleiskäyttöiset, retkeily-, jooga- ja erikoismallit. Eniten myyviä mallejamme ovat Tropical Breeze (10 jalkaa) ja Ocean Voyager (11 jalkaa).
    - title: Mikä on drop-stitch -rakenne?
      description: Drop-stitch -rakenne käyttää tuhansia polyesterilankoja, jotka yhdistävät laudan ylä- ja alakerroksen, mahdollistaen korkean ilmanpaineen (15–20 PSI) ja jäykän, vakaan alustan. Tämä on alan standardi premium-kumilauta-SUP-laudoille.
    - title: Mikä on SUP-lautojen painoraja?
      description: SUP-lautamme tukevat jopa 150 kg mallista ja tilavuudesta riippuen. Leviathan Wake on suuritehoisin mallimme, suunniteltu suuremmille käyttäjille ja joogakäyttöön.
    - title: Tarjoatteko täydellisiä SUP-paketteja?
      description: Kyllä. Jokainen SUP-lauta toimitetaan täydellisenä pakettina, mukaan lukien 3-osainen alumiinimela, korkeapaineinen käsipumppu, kierrehihna, matkareppu ja korjaussarja. Jotkut mallit sisältävät myös irrotettavan eväsarjan.
    - title: Mikä on SUP-lautojen takuu?
      description: Kaikilla Paddle Board Overstock SUP-laudoilla on yhden vuoden takuu valmistusvirheitä vastaan, mukaan lukien saumojen pettäminen, venttiiliviat ja materiaalin delaminaatio normaalikäytössä.
    - title: Kuinka kauan SUP-laudan täyttäminen kestää?
      description: Mukana tulevalla käsipumpulla täysi täyttö 15 PSI:hen kestää noin 8–12 minuuttia. Nopeampaa täyttöä varten suosittelemme Paddle Board Overstock 12V sähköpumppuamme, joka täyttää laudan alle 4 minuutissa.
