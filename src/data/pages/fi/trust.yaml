features3_lab:
  title: Oma testaus ja laatulaboratorio
  subtitle: Jokainen materiaalierä ja valmis tuote käymme paikan päällä olevan testauslaboratorion läpi ennen toimitusta.
  columns: 3
  isBeforeContent: true
  items:
    - title: Vetolujuuden testaus
      description: 'Jokainen PVC kangasrulla on testattu ASTM D751 -standardien mukaisesti. Vähimmäisvaatimus: 350 N/cm loimi ja kude. Hylätyt erät palautetaan toimittajalle – hylkäämme noin 3 % saapuvista materiaaleista.'
      icon: tabler:scale
    - title: UV-kiihdytetty ikääntyminen
      description: Kangasnäytteet käyvät läpi 1 000 tunnin QUV-kiihdytetty säänkesto (ASTM G154). Vetolujuuden säilymisen tulee olla yli 80 % UV-altistuksen jälkeen. Tuotteet yli 3 vuoden ulkokäyttöön.
      icon: tabler:sun
    - title: Saumojen kuorintalujuus
      description: RF-hitsatut saumat testattu vähintään 5 N/mm kuoriutumislujuudella (ASTM D751). Käsin liimatut Hypalon saumat testattu 3,5 N/mm. Jokaisessa tuotantoerässä on saumanäytteet tuhoavasti testattu ja arkistoitu.
      icon: tabler:stack
    - title: 24–48 tunnin paineen pito
      description: 'Jokainen puhallettava tuote täytettiin 1,25-kertaiseen PSI-arvoon ja sitä valvottiin 24–48 tunnin ajan. Suurin sallittu painehäviö: 5 %. Tuotteet, jotka eivät läpäise tätä testiä, työstetään ja testataan uudelleen ennen lähettämistä.'
      icon: tabler:wind
    - title: Venttiilien syklitestaus
      description: Jokainen venttiilirakenne käy läpi laboratoriossamme 10 000 auki-kiinni -sykliä. Venttiilien on säilytettävä ilmatiivis tiiviste 1,25-kertaisessa nimellispaineessa kierron jälkeen. Kaikki Paddle Board Overstock venttiilit on mitoitettu yli 5 vuoden säännölliseen käyttöön.
      icon: tabler:rotate
    - title: Kylmähalkeilukestävyys
      description: Materiaalit testattu -30°C:ssa 4 tunnin ajan per ISO 4646. Halkeilua tai haurautta ei sallita. Tuotteet, jotka on luokiteltu talvisäilytykseen ja kylmän veden käyttöön -10°C ympäristön lämpötilaan asti.
      icon: tabler:snowflake

