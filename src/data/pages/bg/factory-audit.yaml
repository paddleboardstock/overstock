content_priorities:
  tagline: Какво проверяват клиентите
  title: 8 неща, които купувачите проверяват<br />при всяко посещение на фабриката
  subtitle: Въз основа на обратната връзка от купувачи от 50+ държави, това са осемте приоритета, които клиентите оценяват преди B2B да направят поръчка.
  items:
    - title: Реален производител
      description: 'Вие ли сте истинската фабрика, а не търговска компания? Проверка на купувачи: бизнес субект, реално производствено оборудване, служители, които оперират машини, текущи производствени поръчки на етажа и последователност между уебсайт и работилница.'
      icon: tabler:building-factory
    - title: Пригодност на продукта за приложение
      description: RIB Съответстват ли на конкретния им случай на употреба? Операторите на курорти, спасители, гмуркане, риболов и патрулиране имат фундаментално различни изисквания. Купувачите оценяват разположението на палубата, материала на тръбите и възможностите за оборудване на изложената лодка.
      icon: tabler:target
    - title: Стабилност на качеството и възпроизводимост
      description: Дали 50-ият модул е толкова добър, колкото първият? Купувачите преглеждат системите за контрол на качеството, контролните точки в процеса, обработката на несъответствие и искат да видят записи от множество производствени серии, за да проверят съгласуваността.
      icon: tabler:repeat
    - title: Автентичност на документа за съответствие
      description: Сертификатите специфични за CE модела ли са? Подписан ли е DoC от реално лице? Може ли да се провери съответствието по номер на корпуса? Купувачите проверяват за общи претенции спрямо документиране, специфично за модела.
      icon: tabler:file-certificate
    - title: Изпълнение на персонализация
      description: Може ли фабриката наистина да достави персонализирани конфигурации? Купувачите търсят доказателства за минали персонализирани проекти, прототипни образци на изложба, инженерни чертежи и възможност да обсъждат техническите модификации на място.
      icon: tabler:adjustments
    - title: Време за доставка и капацитет
      description: 'Реалистични ли са посочените срокове? Купувачите оценяват: текущия обем на производството, наличния капацитет, размера на работната сила, нивата на материални запаси и дали фабриката има система за планиране на производството.'
      icon: tabler:clock
    - title: Цени и търговски условия
      description: 'Цените прозрачни ли са? FOB Ценообразуването ясно ли е? Купувачите проверяват: разпределение на единичната цена, разходи за инструменти, разходи за опаковане и дали фабриката може да обработва DDP или CIF условията с подходяща износна документация.'
      icon: tabler:currency-dollar
    - title: Следпродажба и резервни части
      description: 'Какво се случва след доставката? Купувачите оценяват: наличието на резервни части, гаранционния процес, подмяна на тръбични секции, смяна на клапани и дали фабриката има документиран протокол за следпродажба.'
      icon: tabler:headset
content_tour:
  tagline: Маршрут на обиколката на фабриката
  title: Одитно обиколка —<br />Какво ще видите
  subtitle: Нашата стандартна обиколка на фабриката следва определен маршрут, предназначен да отговаря на въпроси на купувачите на всяка станция.
  items:
    - title: 1. Зала за срещи — Въведение в компанията
      description: Бизнес лиценз, ISO 9001 и BSCI сертификати, износни лицензи и история на компанията. Бърз преглед на производствените възможности и обхвата на съответствието.
      icon: tabler:users
    - title: 2. Склад за суровини — станция IQC
      description: Записи за инспекция на входящи материали, сертификати за партиди платове, лепила и проби от хардуер. Вижте как се тестват материалите преди влизане в производството.
      icon: tabler:building-warehouse
    - title: 3. Изработка на тръби — RF заваряване и ръчно лепене
      description: Процес на заваряване или залепване на живи тръби, демонстрации на тестове за здравина на шевовете и монтаж на клапани. Спазвайте конструкцията по камера и контролните точки за качество.
      icon: tabler:flame
    - title: 4. Ламиниране на корпуса — работилница за GRP
      description: Процес на полагане от фибростъкло, нанасяне на гелкоут и втвърдяване на корпуса. Вижте графика за ламиниране и структурното укрепване за различни RIB модели.
      icon: tabler:layers-subtract
    - title: 5. Сглобяване и интеграция
      description: Свързване на корпус-тръба, монтаж на конзоли и седалки, интеграция на електрическата и горивната система, както и монтаж на оборудването. Наблюдавайте производствената линия в експлоатация.
      icon: tabler:tool
    - title: 6. Станция за тестване на налягане
      description: Тест за задържане на налягане 24-48 часа при номинално налягане 1.25x. Вижте тестови записи, манометъри и критерии за преминаване/провал. Вижте как резултатите от тестовете са свързани със серийните номера на корпуса.
      icon: tabler:gauge
    - title: 7. Финална инспекция и контрол
      description: 100-точков контролен списък с качество на единица, проверка на размерите, козметична инспекция и проверка на целостта на опаковките. Прегледайте дневниците за несъответствие и записите за коригиращи действия.
      icon: tabler:clipboard-check
    - title: 8. Стая за преглед на документи
      description: Документация за съответствие по модел (DoC, строителна плоча, ръководство за собственика), записи за проследимост на производството, HIN регистър и демонстрация на база данни за проследяване на партиди материали.
      icon: tabler:folder
content_qc_chain:
  tagline: Качествени доказателства
  title: 8-степенна верига за контрол на качеството<br />— Проверима на всеки етап
  subtitle: Нашата верига за контрол на качеството се простира от входящите материали до крайната пратка, с документирани доказателства на всеки етап.
  items:
    - title: 'Етап 1: Инспекция на входящи материали'
      description: Всяка партида PVC, Hypalon, фибростъкло, алуминий, лепила и хардуер се тества според спецификациите преди влизане в производство. Проверки на якост на опън, адхезия на покритието и размери според AQL 2.5/ISO2859.
      icon: tabler:package
    - title: 'Етап 2: Заваряване на тръби / Залепване на контрол на качеството'
      description: Тестване на здравина на шева на серийна партида. Мониторинг и записване на параметрите на RF заварката. Ръчно залепени шевове са проверени за равномерно покритие на лепилото и време за втвърдяване.
      icon: tabler:flame
    - title: 'Етап 3: Ламинация на корпуса QC'
      description: Измерване на дебелината на гелкоута, проверка на наслагването на фибростъкло според график на ламиниране и мониторинг на времето за втвърдяване. Позициите на структурната армировка са проверени спрямо инженерни чертежи.
      icon: tabler:layers-subtract
    - title: 'Етап 4: Сглобяване и интегриране на качеството'
      description: Тест за цялост на съединението между корпуса и тръбата, въртящ момент на монтаж на конзолата и седалката, електрическа непрекъснатост и тест за течове в горивната система. Всяка точка на монтаж се проверяваше спрямо специфичния за модела контролен списък за сглобяване.
      icon: tabler:tool
    - title: 'Етап 5: Тест за задържане на налягането'
      description: Всяка надуваема камера е пресуризирана до 1.25x PSI и се държи 24-48 часа. Спадът на налягането се записва на камера. Документиран е прагът за преминаване/провал. Свързан със серийния номер на корпуса.
      icon: tabler:gauge
    - title: 'Етап 6: Финална инспекция'
      description: 100-точков контролен списък за качество, обхващащ точност на размерите, козметично покритие, пълнота на аксесоарите, пакета с документация и цялостта на опаковката. Независимо от производствения екип.
      icon: tabler:clipboard-check
    - title: 'Етап 7: Документация за съответствие'
      description: Специфичен за модела DoC, проверка на плочи на производителя, пълнота на ръководството за собственика и запис в регистъра на IN. Всички документи за съответствие са подготвени и проверени преди пускането на пратката.
      icon: tabler:file-certificate
    - title: 'Етап 8: Освобождаване на пратката и проследимост'
      description: Окончателното издание изисква преминаване на всички етапи на QC, попълнена документация за съответствие и проверка на транспортната документация. Корпусният запис е затворен и архивиран за+ 10-годишно съхранение.
      icon: tabler:truck
content_traceability:
  tagline: Проследимост на производството
  title: HIN → Майсторски файл →<br />Запис на корпуса → Доставка
  subtitle: Всяка RIB лодка носи уникален идентификационен номер на корпуса, свързан с пълна верига от производствени и съответстващи записи.
  items:
    - title: Идентификационен номер на корпуса (HIN)
      description: 14-символен уникален идентификатор, постоянно маркиран на всяка лодка. Кодира код на производителя (MIC), обозначение на модела, година на производство и сериен номер. Ключът, който отключва пълната верига за проследяване.
      icon: tabler:hash
    - title: Главен технически файл
      description: Документация за съответствие и инженеринг за семейството модели. Съдържа чертежи на GA, оценка на риска, изчисления за стабилност, спецификации на материалите и приложими стандарти. Свързан с всички корпуси на този модел.
      icon: tabler:folder
    - title: Индивидуален рекорд на корпуса
      description: 'Производствен запис по корпус: HIN, дата на производство, партида тръби, сертификати за материали, резултат от теста под налягане, крайна конфигурация, спецификация на двигателя, резултати от контролния списък за качество и дестинация за доставка. 21+ полета данни за корпус.'
      icon: tabler:file-description
    - title: Пакет за съответствие с клиентите
      description: Пакет за доставка по корпус, включително DoC, снимка на плоча на строителя, ръководство за собственика, контролен списък за съответствие и окончателен конфигурационен лист. Доставен с лодката и архивиран във фабриката за 10+ години.
      icon: tabler:package
content_red_flags:
  tagline: Одитни капани
  title: Червени флагове Купувачи<br />Лесно забележимо
  subtitle: Чести проблеми, които подкопават доверието на купувачите по време на одити във фабриката. Ние проактивно се справяме с всеки един от тях.
  items:
    - title: Общи CE претенции без обхват на модела
      description: '"Всички продукти CE са сертифицирани" без да се уточнява коя директива, кои модели и кой модул за съответствие. Червен флаг: предполага, че съответствието е повърхностно, а не за всеки модел, по конфигурация.'
      icon: tabler:alert-triangle
    - title: Няма доказателства за физически тестове
      description: 'Твърдения за тестове под налягане без тестови записи, манометъри или тестова станция, видими на производствения етаж. Червен флаг: твърденията за качество не могат да бъдат потвърдени по време на посещението.'
      icon: tabler:alert-triangle
    - title: Проследимост на липсващи материали
      description: 'Няма партидни записи, няма входяща инспекция или няма връзка между сертификатите за материали и готовите продукти. Червен флаг: няма начин да се проследят проблеми с качеството до източника.'
      icon: tabler:alert-triangle
    - title: Обща документация
      description: 'Един DoC, покриващ всички модели, без специфични за HIN записи или "шаблонни" документи за съответствие. Червен флаг: съответствието не е обвързано с отделни производствени единици.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Доставка и опаковане
  title: RIB Контейнер за лодка<br />Зареждане и опаковане
  subtitle: Нашите транспортни решения защитават вашата инвестиция от Циндао до пристанището на дестинацията. Планове за товарене на контейнери и спецификации за опаковане са налични за всеки модел.
  items:
    - title: Конфигурации на контейнери с дължина 20 фута
      description: 'Стандартен контейнер с дължина 20 фута: 1-2 RIB лодки (4.0-5.5 м), разположени с отделени палуба и тръби, или 8-12 SUP дъски. Налични са смесени RIB + SUP конфигурации. Подробен план за товарене се предоставя при всяка поръчка.'
      icon: tabler:box
    - title: 40-футови конфигурации на контейнери
      description: 'Стандартен контейнер с дължина 40 фута: 2-4 RIB лодки (до 7.0 м) с корпуси, разположени и подредени тръби, или 20-30 SUP дъски. 40-футова HQ е налична за по-високи RIB модели. Оптимизираното по обем опаковане намалява разходите за доставка на единица.'
      icon: tabler:container
    - title: Дървена клетка за RIB корпуси
      description: Корпуси от алуминий и GRP са опаковани в дървени сандъци по поръчка с пяна, влагоизолация и стоманени ленти. Размери и тегло на сандъка по модел са налични за логистично планиране. Включена е сертификация за термично обработена дървесина ISPM-15.
      icon: tabler:wood
    - title: Разделяне на тръби и палуби
      description: Тръбите се спускат и сгъват отделно от корпусите за икономия на пространството. Палубните плочи, конзолите и седалките са опаковани в защитно покритие с монтажни комплекти за хардуер. Инструкции за сглобяване са включени при всяка пратка.
      icon: tabler:package
    - title: Защита от влага и корозия
      description: VCI антикорозионна хартия за алуминиеви компоненти, пакети за изсушаване със силикагел и вакуумно запечатани хардуерни торбички. Предотвратява увреждане от кондензация по време на 30-45 дни преминаване през океана.
      icon: tabler:droplet-off
    - title: FOB Документация на Циндао
      description: Товарни листове, търговска фактура, списък за опаковане, сертификат за произход и документация за съответствие на пратка. Налична консолидация на FCL и LCL. Поддръжка на митническа документация за пазарите в ЕС, САЩ и Близкия изток.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Доказателства за потвърждение
  title: Одиторски доказателства<br />Можете да проверите на място
  subtitle: По време на посещения във фабриката клиентите могат да проверят конкретни доказателства във всяка производствена зона. Ето какво да търсите — и какво подготвяме за всеки одит.
  areas:
    - area: Склад за суровини
      what_to_verify: Стабилни ли са материалите? Има ли партидно смесване?
      evidence: Входящи инспекционни записи, етикети на партиди, съхранение на FIFO, списък с одобрение от доставчици, сертификати за материали (PVCHypalon, , фибростъкло, алуминий, лепила, хардуер)
      icon: tabler:building-warehouse
    - area: Производство на тръби
      what_to_verify: Как е гарантирана здравината и въздушната непропускливост на шева?
      evidence: Процесни карти, потвърждение от първа статия, записи за тестове на налягане в камера, дневници за ремонт и повторни тестове, записи за монтаж на клапани
      icon: tabler:flame
    - area: Производство на корпуса
      what_to_verify: Как се контролира структурната последователност?
      evidence: Документи за контролирани процеси, контролни точки за качество, номериране на полуфабрикатни продукти, измервания на дебелината на гелкоута, проверка на графика за ламиниране
      icon: tabler:layers-subtract
    - area: Сборна зона
      what_to_verify: Как се предотвратява неправилно сглобяване на опционални части?
      evidence: BOM, работни поръчки, контролни списъци за конфигурация, карти за инспекция на работни станции, проверки на въртящ момент и функционалност по модел
      icon: tabler:tool
    - area: Тестова станция
      what_to_verify: Как се потвърждава, че лодката е добра преди доставката?
      evidence: Тестови процедури, списък с инструменти, калибрационни записи, записи за тестване под налягане (1.25x / 24-48 часа), функционални тестови списъци, документирани критерии за преминаване/провалване
      icon: tabler:gauge
    - area: Зона на несъответствие
      what_to_verify: Как се обработват дефектите?
      evidence: Изолационни етикети, NCR логове, анализ на основната причина, записи за одобрение на преработки, проследяване на CAPA (коригиращи и превантивни действия)
      icon: tabler:alert-triangle
    - area: Склад за готови стоки
      what_to_verify: Как да предотвратите неправилна доставка и щети?
      evidence: Етикети на готови продукти, записи за съвпадение на поръчки, стандарти за опаковане, записи за предварителна инспекция
      icon: tabler:box
    - area: Резервни части и следпродажбено обслужване
      what_to_verify: Можете ли да подкрепите дългосрочни следпродажбени сделки?
      evidence: Общ списък с резервни части, стратегия за инвентара, система за номериране на части, документация за гаранционния процес, уроци по поддръжка
      icon: tabler:headset
content_closing_script:
  tagline: Одит по поръчка
  title: От посещение на фабриката<br />към потвърден проект
  subtitle: Успешният одит не трябва да завършва със снимки и ръкостискане. Преди да си тръгнем, гарантираме, че три търговски резултата са документирани.
  items:
    - title: Потвърдете техническата конфигурация
      description: Договорете се за модел, приложение, ключови опции, целеви пазар, очаквано количество и график за доставка — всичко документирано преди заминаване.
      icon: tabler:checklist
    - title: Потвърдете документи за следващата стъпка
      description: 'Определете какво Paddle Board Overstock предлага следващо: ревизирана GA, конфигурационен списък, оферта, контролен списък с документи, примерен план или NDA — с конкретни срокове.'
      icon: tabler:file-plus
    - title: Потвърдете взаимната времева линия
      description: Ревизирана конфигурация и предварителна оферта в рамките на 3 работни дни. Потвърждение на образец или външен вид в рамките на 7 дни. Инженерен преглед или инспекция от трета страна в рамките на 14 дни. Следващата дата на срещата и отговорните страни са заключени.
      icon: tabler:calendar
faq:
  title: Одит във фабриката — Често задавани въпроси
  questions:
    - q: Мога ли да посетя фабриката лично?
      a: Да. Приветстваме одитите на място във фабриката в нашето съоръжение от 12 000 м² в Циндао. Стандартният ни тур обхваща 8 станции – от склад за суровини до зала за преглед на документи. Виртуални обиколки на фабриката чрез видео разговор също са налични за първоначална квалификация.
    - q: Приемате ли одити от трети страни (BSCI, SMETA, SGS)?
      a: Да. Поддържаме BSCI сертификация (Intertek) и приветстваме протоколи за одит, специфични за клиента. Можем също да SGS TÜV организираме инспекции по заявка. Одитните доклади са достъпни под NDA.
    - q: Мога ли да видя тестване под налягане по време на посещението?
      a: Нашата станция за изпитване на налягане е част от стандартния маршрут на обиколката. В зависимост от производствения график може да наблюдавате активни изпитвания на налягане с показания на манометри и записки от тестовете. Дневниците на изпитванията на налягане за всяко корпус винаги са на разположение за преглед.
    - q: Как се справяте с продукти, които не отговарят на изискванията?
      a: Неотговарящите единици се отделят, документират и преглеждат съгласно нашия процес за корективни действия ISO 9001. Извършва се анализ на основните причини, прилагат се корективни действия и се поддържат записи. Купувачите могат да прегледат нашия регистър на НЕК по време на одити.
    - q: Каква документация за съответствие е налична за преглед?
      a: 'По време на одита можете да прегледате: проби от декларации за съответствие (DoC) специфични за модела, спецификациите на табелката на производителя, регистъра HIN, черновки на ръководства за собственика, списъци с приложими стандарти и записи за оценка на съответствието за всяко семейство модели.'
    - q: Как да резервирам виртуална обиколка на фабриката?
      a: Свържете се с нашия екип по продажбите, за да насрочите жива видео обиколка чрез WhatsApp, Zoom или Teams. Следваме същия маршрут с 8 станции и можем да се съсредоточим върху конкретни области според вашите интереси. Типичната виртуална обиколка е 45-60 минути.
    - q: Заводът действително ли е производителят или е търговска компания?
      a: Paddle Board Overstock е действителният производител. Ние управляваме фабриката в Лайси, Циндао. Бизнес лицензът, обхватът на производството и физическото производство могат да бъдат проверени по време на одита.
    - q: Кои документи за качество мога да прегледам?
      a: Записи за инспекция на постъпващи материали, контролни точки за качество по време на производствения процес, регистри на тестове за налягане, контролни списъци за крайна инспекция с 100 точки, доклади за несъответствия, записи за корективни действия и записи за проследимост на всяко корпусно изделие. Всички се поддържат в съответствие с изискванията на ISO 9001.
