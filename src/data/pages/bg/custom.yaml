hero:
  tagline: Aquafarer Персонализирана лаборатория
  title: Дизайнирай сам<br />Водно средство
  subtitle: OEM, ODM, услуги за частен етикет и персонализирано брандиране за бизнеси по целия свят. От един прототип до пълни производствени серии.
  cta: Започнете проекта си
  footer_link: /contact
steps_section:
  tagline: Как работи
  title: От концепция до производство
  subtitle: Четири стъпки от вашата идея до готов продукт, подходящ за употреба на вода.
  steps:
    - num: '01'
      title: Изберете вашата дъска
      desc: Изберете от нашите основни модели — SUP, каяк, дингy или RIB. Изберете размер, материал и цвят.
    - num: '02'
      title: Качете вашия дизайн
      desc: Изпратете ни вашето лого, арт творба или насоки за бранда. Нашият дизайн екип подготвя дигитален предварителен преглед.
    - num: '03'
      title: Преглед на AI макет
      desc: Вижте фотореалистичен макет, генериран с AI, на вашата персонализирана дъска преди започване на производството.
    - num: '04'
      title: Производство и доставка
      desc: След одобрение, вашата поръчка влиза в нашата ISO-сертифицирана производствена линия. Срокове от 30 дни.
services_section:
  tagline: Услуги
  title: Производствени услуги за глобални марки
  subtitle: Гъвкави модели на сътрудничество — от договорно производство до пълно изграждане на бранд.
  items:
    - title: Производство по OEM
      desc: Произвеждаме вашите дизайни по спецификация — вашата интелектуална собственост, вашите чертежи, вашите стандарти за качество. Пълна NDA защита.
      icon: ⚙️
    - title: ODM Решения
      desc: Изберете от 50+ доказани платформи и персонализирайте размер, цвят, графики и опаковка.
      icon: 🎨
    - title: Частна Марка
      desc: Вашата марка на нашите продукти — лого, опаковка, етикети, инструкции. Готови за продажба веднага.
      icon: 🏷️
    - title: Персонализирано брандиране
      desc: Печат на подложки на палубата, графики на корпуса, стикери за тръби и персонализирани етикети — пълна интеграция на бранда.
      icon: ✨
capabilities_section:
  tagline: Възможности
  title: Производствени и персонализирани възможности
  subtitle: Всичко, което трябва да знаете преди да направите поръчка.
  capabilities:
    - label: Обем на поръчката
      value: MOQ 5–10 единици (SUP/каяк), 2–5 единици (RIB)
    - label: Време за изработка
      value: 30–45 дни стандартно; 15–20 дни за прототипи
    - label: Персонализация
      value: Размер, форма, цвят, графики, опаковка, хардуер
    - label: Материали
      value: PVC, Hypalon, drop-stitch, стъклопласт, алуминий
    - label: Печат
      value: Дигитален (CMYK), ситопечат, термопренос, сублимиране
    - label: Сертификация
      value: CE, ISO 9001, BSCI, UKCA (подкрепа за глобално съответствие)
why_section:
  tagline: Защо Aquafarer
  title: Една фабрика. Един стандарт. Нула компромиси.
  points:
    - text: 12 000 кв.м интегрирано производствено съоръжение
      highlight: 12 000 кв.м
    - text: 200–300 квалифицирани работници и инженери
      highlight: 200-300
    - text: 15 000 лодки произведени годишно
      highlight: 15,000
    - text: ISO 9001 сертифицирано управление на качеството
      highlight: ISO 9001
    - text: CE сертифицирани продукти за пазара на ЕС
      highlight: CE
  cta: Вижте подробности за фабриката
  cta_link: /factory
  contact:
    title: Готови ли сте да обсъдим вашия проект?
    desc: Нашият екип отговаря в рамките на 24 часа с предварителна оферта.
