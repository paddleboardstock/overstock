hero:
  tagline: Партньори и дистрибуция
  title: Станете Paddle Board Overstock партньор<br />— Глобална дистрибуционна мрежа
  subtitle: Присъединете се към глобалната партньорска мрежа на Paddle Board Overstock. Работим с морски дистрибутори, търговци на лодки, търговци на оборудване и бранд партньори в 50+ държави.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sales-office.webp
    alt: Paddle Board Overstock глобална партньорска и дистрибуторска мрежа
content_programs:
  tagline: Програми за партньори
  title: Програми за партньори<br />Създадено за растеж
  subtitle: Независимо дали сте дистрибутор, търговец или бранд партньор, Paddle Board Overstock предлага програми, създадени за подпомагане на вашия бизнес.
  columns: 3
  items:
    - title: Програма за дистрибутори
      description: Ексклузивно разпределение на територия с обемни цени, маркетингова подкрепа и директен достъп до фабриката. Минимален ангажимент в зависимост от размера на територията.
      icon: tabler:world
    - title: Програма за търговци
      description: Директни цени за търговци, обучение за продуктите, маркетингови материали и съдействие при гаранционното обслужване за магазини и онлайн магазини.
      icon: tabler:building-store
    - title: OEM/ODM партньорство
      description: Пълно сервизно OEM и ODM производство с персонализирано брандиране, опаковане и продуктови спецификации. От концепция до контейнер.
      icon: tabler:certificate
    - title: Бранд партньорство
      description: Съвместно брандиране, частна марка и ексклузивни модели за утвърдени брандове в морската и развлекателната индустрия на открито.
      icon: tabler:stars
    - title: Правителствени и институционални
      description: Програми за предпочитани доставчици за правителствени агенции, брегова охрана, военни и хуманитарни организации. Документация готова за търгове.
      icon: tabler:building-community
    - title: Партньори за курорти и наеми
      description: Цени за флоти, постоянна качествена продукция и персонализирано брандиране за курорти, центрове за гмуркане и операции за наемане по света.
      icon: tabler:sun
content_benefits:
  tagline: Защо да бъдете партньор с нас
  title: Защо партньорите избират Paddle Board Overstock
  subtitle: Нашите партньори се възползват от реални производствени възможности, постоянна качествена продукция и отзивчива поддръжка.
  list:
    - 'Директен достъп до фабриката: Работете директно с нашия производствен екип — без посредници. Получавайте по-бързи отговори, по-добри цени и пълна видимост на производството.'
    - 'Готовност за персонализация: Брандирайте продуктите си с персонализирани цветове, лога, опаковки и спецификации. Минималните количества поръчка са съобразени с вашия пазар.'
    - 'Гарантирано качество: ISO сертифицирано производство по ISO 9001 с CE, UKCA и BSCI съответствие. Всеки продукт е тестван преди изпращане.'
    - 'Глобална логистика: Доставки от Цингдао, Китай с опции FOB, CIF и DDP. Склад в САЩ в Монтклеър, Калифорния за разпространение в Северна Америка.'
    - 'Маркетингова подкрепа: Каталози на продукти, фотография, техническа документация и дигитални носители за подпомагане на вашите продажби.'
    - 'Обучение и поддръжка: Обучение за продуктите за вашия търговски екип, техническа поддръжка за вашите клиенти и координация на гаранционното обслужване.'
content_process:
  tagline: Как да станете партньор
  title: Прост процес за партньорство
  subtitle: Нашият процес на партньорство е ясен и прост — създаден да стартирате продажбите на продукти Paddle Board Overstock бързо.
  items:
    - title: 'Стъпка 1: Подайте заявление'
      description: Попълнете нашата форма за кандидатстване за партньорство с профила на вашата компания, целевия пазар и интересите към продуктите.
    - title: 'Стъпка 2: Преглед на квалификацията'
      description: Екипът ни за партньорства преглежда вашето заявление и ще се свърже с вас в рамките на 3 работни дни, за да обсъди възможностите.
    - title: 'Стъпка 3: Споразумение и настройка'
      description: Подпишете партньорско споразумение, настройте вашия акаунт и получете партньорски цени, маркетингови материали и продуктовите мостри.
    - title: 'Стъпка 4: Обучение и стартиране'
      description: Предоставя се продуктово обучение, търговска подкрепа и маркетингови материали. Вие сте готови да започнете да продавате.
cta:
  title: Готови ли сте да станете партньор на Paddle Board Overstock?
  subtitle: Кандидатствайте за партньорство и нашият екип ще отговори в рамките на 3 работни дни.
  actions:
    - variant: primary
      text: Кандидатствайте за партньорство
      href: /contact
    - text: Вижте нашите продукти
      href: /products
