  - Обслужване на плажната култура на Бразилия от Рио до Североизтока
  - Експресен въздушен или консолидиран морски товар от Вейхай, Китай
  - 100% тестван под налягане, 2-годишна SUP гаранция на всяка платка
overview_section:
  tagline: Обзор на пазара
  title: SUP Бразилският пазар
  paragraphs:
    - Бразилия е един от най-естествените пазари за гребане на място на Земята. Плажната култура е национална култура — от сцената на Stand Up Paddle по лагуните на Рио и смесицата от сърф и плоска вода във Флорианополис до топлите, спокойни води на североизток в Сеара, Пернамбуко и Баия. Училищата по гребане, наемите на лагуни и общностите за спускане по вятъра и SUP сърфа са всички от огромна, спортна популация.
    - Бразилските купувачи обикновено са бизнеси, управлявани от собственици — щандове за наем край лагуната, плажни училища, магазини за сърф SUP добавят опашки и нарастващи вътрешни продавачи в електронна търговия. Те поръчват на малки партиди (5–20 дъски) и се интересуват от издръжливостта за ежедневна употреба и ценовата конкуренция на пазар с значителни разходи за внос.
  customer_types:
    - title: Лагуни и плажни училища
      description: Училища и оператори на наеми по лагуните на Рио и спокойните плажове на североизтока, които предлагат уроци и наеми на час.
    - title: Сърф магазини
      description: Утвърдени сърф търговци добавят спокойни води и SUP турнета за местната гребна общност.
    - title: Онлайн продавачи
      description: Вътрешни електронни търговци внасят SUP стоки, за да обслужват огромния вътрешен пазар на Бразилия.
shipping_section:
  title: Кораб до Бразилия
  paragraphs:
    - Поръчките се изпращат от Вейхай, Китай. Експресният въздушен товар превозва мостри и 1–3 бордови поръчки до големите летища в Бразилия; консолидирани морски товари обслужват 5–20 поръчки на едро на борда през пристанища като Сантос и други крайбрежни портове. Оценките за транзита за вашата дестинация са включени във вашата оферта.
    - Ние предоставяме търговската фактура и списъка за опаковане, необходими за разчистване, с коректни HS кодове и декларирани стойности. Вносните мита и данъци се плащат от вносителя според бразилските правила.
  customs_note: Вносните данъци върху спортни стоки в Бразилия са значителни и варират според класификацията на продукта. Потвърдете текущите мита, ДДС и всички щатски такси с вашия митнически брокер (despachante) преди поръчка — ние предоставяме пълна документация, но не включваме вносните данъци в оферти за товар.
faq_section:
  title: Често задавани въпроси за Бразилия
  items:
    - q: Могат ли цитати и подкрепа да се обработват на португалски?
      a: Да — работим с португалоговорящи купувачи. Попитайте в запитването си и ние ще обработим вашата оферта и поръчка на португалски.
    - q: Включени ли са бразилските вносни данъци в цените ви?
      a: Не. Вносните мита, ДДС и щатските данъци са отговорност на вносителя според бразилските правила. Ние цитираме цените на борда и транспорта ясно и отделно, и предоставяме необходимите документи за вашата деспачанта.
    - q: Как изглежда първа поръчка за бразилско плажно училище?
      a: 'Обикновено 5–15 дъски: здрави универсални модели за уроци и почасово наемане, плюс няколко премиум издания за търговски дисплей. Смесени модели в една пратка, цената се определя според общото количество.'
    - q: Изпращате ли морски транспорт до Бразилия?
      a: Да — консолидираният морски транспорт обслужва бразилските пристанища за едро поръчки от 5–20 дъски, с цена според дестинацията. Експресен въздушен транспорт е наличен за мостри и спешни малки поръчки.
