reasons:
  tagline: Разликата на Paddle Board Overstock
  title: Какво ни отличава
  isBeforeContent: false
  columns: 3
  items:
    - title: Реално производство, не търговия
      description: Ние притежаваме и управляваме фабрика с площ 12 000 м². Когато партнирате с Paddle Board Overstock, работите директно с хората, които проектират, инженерят и изграждат вашите продукти — без посредници.
      icon: tabler:building-factory
    - title: Подход воден от инженеринг
      description: Нашият процес на проектиране започва с конкретния случай на употреба, а не с продуктовата категория. Оптимизираме формата на корпуса, избора на материал и конфигурацията за това как дъската реално ще се използва във водата.
      icon: tabler:engine
    - title: Доказано качество
      description: Всяка платка се тества под налягане до 1.25 пъти номиналното налягане за 24-48 часа преди изпращане, а 99.3% от пратките ни пристигат без дефекти — подкрепени от гаранцията.
      icon: tabler:award
    - title: Дизайн на Падлър Фърст
      description: 'Всеки модел започва с начина, по който гребете: стабилни платформи за начинаещи, аеродинамични форми за туринг и пълноразмерни палуби за йога. Проектираме за истински гребци, не за изложбени спецификации.'
      icon: tabler:adjustments
    - title: Глобална логистика
      description: Склад в САЩ в Калифорния, директна доставка от Вейхай, въздушен транспорт за спешни поръчки. Ние се занимаваме с митнически документи и документация по целия свят.
      icon: tabler:truck-delivery
    - title: Поддръжка за цял живот
      description: Стоим зад дъски, които сме изработили преди 20 години. Оригинални резервни части, технически съвети, насоки за ремонт — нашият екип е там, когато имате нужда от нас, където и да сте.
      icon: tabler:lifebuoy
testimonials:
  tagline: Доверен от гребци по целия свят
  title: Какво казват гребците
  items:
    - content: My Ocean Voyager е обработил всичко – от спокойни сутрини край езерото до бурни крайбрежни следобеди. След два сезона, все още изглежда и се кара като нов.
      name: — Рекреационен Падлър, Калифорния
    - content: Бях нервен да купя първата си надуваема дъска онлайн, но качеството беше очевидно в момента, в който я надувах. Твърда, стабилна и красиво завършена.
      name: — Първи SUP собственик, Германия
    - content: Гребаме като семейство всеки летен уикенд. Три дъски, никакви проблеми, а децата обожават ярките дизайни.
      name: — Семейство Падлър, Австралия
    - content: Тестовете под налягане не са маркетингови приказки — дъската ми е стабилна на пълен натиск и не показва разтягане след година седмично гребане.
      name: — Weekly Paddler, Нидерландия
