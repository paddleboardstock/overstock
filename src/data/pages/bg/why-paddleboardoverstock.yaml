hero:
  tagline: Защо Paddle Board Overstock
  title: Построен по различен начин. Създаден да издържи.<br />Бордовете зад Water Adventures по целия свят
  subtitle: Не просто фабрика — екип от гребци и инженери, които проектират, тестват и изграждат премиум SUP надуваеми дъски за семейства, авантюристи и клубове по целия свят.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock качество на производството и експертиза
pillars:
  tagline: Три стълба на качеството
  title: Защо гребците по целия свят избират Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Проектиран за търговска употреба
      description: Нашите дъски са проектирани за години на редовно гребане. PVC Комерсиално класни, drop-stitch подсилени ядра, UV стабилни материали и тестван хардуер означават по-ниска поддръжка и по-дълъг живот на водата.
      icon: tabler:building-factory
      callToAction:
        text: Вижте търговската продуктова линия
        href: /products
    - title: Тествани над стандартите
      description: Всяка платка се напомпва до 1.25 пъти номиналното налягане за 24-48 часа преди да напусне фабриката ни — 100% тестван под налягане, 99.3% без дефекти. Вашата платка е доказана като здрава още преди да попадне във водата.
      icon: tabler:shield-check
      callToAction:
        text: Виж как тестваме
        href: /quality
    - title: Създаден за глобални условия
      description: 'Продукти оптимизирани за всеки климат: формулировки за студена вода PVC за Европа, материали устойчиви на UV за Близкия изток и Австралия, обработки против влага за Югоизточна Азия. Всяка пратка е калибрирана за своята дестинационна среда.'
      icon: tabler:world
