features3_reasons:
  tagline: Защо да изберете Paddle Board Overstock
  title: Седем причини да си партнирате с нас
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Реално производство, не търговия
      description: Притежаваме и управляваме фабрика от 12 000 m². Когато си партнирате Paddle Board Overstockс , вие работите директно с хората, които проектират, инженерстват и изграждат вашите продукти — без посредници.
      icon: tabler:building-factory
    - title: 2. Инженерно-воден подход
      description: Нашият процес на проектиране започва с конкретния случай, а не с продуктовата категория. Оптимизираме формата на корпуса, избора на материали и конфигурацията за начина, по който лодката реално ще бъде използвана.
      icon: tabler:engine
    - title: 3. Сертифицирано качество
      description: CE сертифицирани, ISO система за качество, BSCI съответстващи, REACH съответстващи, USCG одобрени. Нашите 64 CEсертифицирани модела отговарят на международните стандарти — не само на претенции.
      icon: tabler:certificate
    - title: 4. Гъвкав OEM/ODM
      description: Цветовете на тръбите, разположението на конзолата, брандирането, опаковката — персонализираме според вашите спецификации. Няма минимален натиск за поръчка. Започнете с прототип, мащабирайте с увереност.
      icon: tabler:adjustments
    - title: 5. Глобална логистика
      description: Американски склад в Калифорния, директна доставка от Циндао, въздушен товар за спешни поръчки. Ние се занимаваме с митническа документация и документи.
      icon: tabler:truck-delivery
    - title: 6. Подкрепа през целия живот
      description: Подкрепяме лодки, които построихме преди 20 години. Оригинални резервни части, технически съвети, насоки за ремонт — нашият екип е на разположение, когато имате нужда от нас.
      icon: tabler:lifebuoy
    - title: 7. Честни спецификации
      description: Реални рейтинги на натоварване, реални размери, реално тегло. Няма маркетингова инфлация. Това, което публикуваме, е това, което получавате — проверено от независими тестове.
      icon: tabler:ruler-measure
testimonials:
  tagline: Доверено от брандове по целия свят
  title: Какво казват нашите партньори
  items:
    - content: Работили сме с няколко производителя в Китай, но Paddle Board Overstock се отличават с инженерната си подкрепа и постоянното качество. Те третират нашата марка като своя.
      name: — OEM Партньор, Европейска марка за водни спортове
    - content: Те Hypalon RIBs са в експлоатация с нашия автопарк повече от 5 години. Минимална поддръжка, UV отлична устойчивост. 5-годишната гаранция на тръбите ни дава увереност.
      name: — Оператор на флота, Middle East Resort Group
    - content: Екипът Paddle Board Overstock ни помогна да разработим персонализиран дизайн на платка SUP от концепция до производство за 90 дни. Качеството надмина очакванията ни.
      name: — Дистрибутор, Australian Watersports
