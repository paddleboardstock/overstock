features3_reasons:
  tagline: Защо да изберете Paddle Board Overstock
  title: Седем причини да си партнирате с нас
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Реално производство, не търговия
      description: Притежаваме и управляваме фабрика от 12 000 m². Когато купувате от Paddle Board Overstock, купувате директно от хората, които проектират, проектират и изработват вашата платка — без посредници, без надценка за търговия на дребно.
      icon: tabler:building-factory
    - title: 2. Инженерно-воден подход
      description: Нашият процес на проектиране започва с конкретния случай, а не с продуктовата категория. Оптимизираме формата на корпуса, избора на материал и конфигурацията за начина, по който дъската реално ще се използва.
      icon: tabler:engine
    - title: 3. Доказано качество
      description: Всяка платка е 100% тествана под налягане с оценка 1.25x PSI преди да бъде изпратена. 99.3% процент без дефекти — измерван на всяка партида, не само за заявена.
      icon: tabler:shield-check
    - title: 4. Дизайн на Падлър Първи
      description: 'Изкуство на палубата, цветови серии, аксесоари и пълни пакети — дъски, проектирани около истинско гребане: туризъм, йога, риболов, фитнес и семейни забавления.'
      icon: tabler:swimming
    - title: 5. Глобална логистика
      description: Директна доставка от нашата фабрика във Weihai до гребци в 50+ държави, с пълно проследяване и митническа обработка.
      icon: tabler:truck-delivery
    - title: 6. Подкрепа през целия живот
      description: Подкрепяме платки, които сме сглобили преди години. Оригинални резервни части, технически съвети, насоки за ремонт — нашият екип е на разположение, когато имате нужда от нас.
      icon: tabler:lifebuoy
    - title: 7. Честни спецификации
      description: Реални рейтинги на натоварване, реални размери, реално тегло. Няма маркетингова инфлация. Това, което публикуваме, е това, което получавате — проверено от независими тестове.
      icon: tabler:ruler-measure
testimonials:
  tagline: Доверено от брандове по целия свят
  title: Какво казват нашите партньори
  items:
    - content: Дъската ми пристигна фабрично прясно с всичко в кутията. Два сезона седмично гребане и все още държи въздуха перфектно.
      name: — Сара М., Уикенд Падлър, Флорида
    - content: Сравних спецификациите седмици преди да купя.Paddle Board Overstock Беше единствената марка, която публикуваше реални тежести и реални натоварвания. Това, което изброяват, е това, което се показва.
      name: — Томаш К., туринг гребец, Полша
    - content: Сега цялото семейство гребе. Започнахме с една дъска и завършихме с четири — качеството направи избора лесен.
      name: — Анджела Р., семеен гребец, Австралия
