content_challenge:
  tagline: Предизвикателството
  title: Изисквания на офшорната енергетика<br />Надеждност в екстремни условия
  subtitle: Офшорните енергийни операции тласкат оборудването до крайност — екстремни метеорологични условия, отдалечени локации, непрекъснати работни цикли и нулева толерантност към повреди.
  paragraphs:
    - Офшорната енергийна индустрия оперира в най-взискателните морски среди на Земята. Работните лодки поддържат нефтени и газови платформи, инсталации на вятърни турбини, подводни кабели и морски строителни проекти — често при открито море с ограничени метеорологични прозорци. Повредата на оборудването не е само скъпа, но и опасна.
    - '**Безопасността е най-висок приоритет** — Корабите за прехвърляне на екипаж трябва да оперират безопасно в морски състояния, които биха спрели други операции. Стабилността в момента на прехвърляне, надеждна работа на двигателя при всякакви метеорологични условия и здрава конструкция за многократно акостиране срещу офшорни структури са задължителни изисквания.'
    - '**Способността за издържане на всякакви метеорологични условия е от съществено значение** — Офшорните вятърни паркове и нефтени платформи работят целогодишно. Работните лодки трябва да работят при тежко море, силен вятър и ограничена видимост. Дневните и нощните операции изискват пълни навигационни системи и надеждни осветителни системи.'
    - '**Секторът на офшорната вятърна енергия расте бързо** — Хиляди нови турбини се инсталират по целия свят, всяка от които изисква редовен трансфер на екипаж, транспорт на инструменти и поддръжка. Това създава устойчиво търсене на специално построени кораби за прехвърляне на екипаж (CTV) и поддръжкаRIBs.'
    - Paddle Board Overstock RIBs Офшорната енергия е проектирана с подсилени дълбоко-V корпуси, Hypalon тежкотоварни тръби, пълни навигационни комплекси и системи за безопасност, проектирани за екстремни условия на офшорни енергийни операции.
content_solution:
  tagline: Нашето решение
  title: Специално построен офшорен RIBs<br />За енергийната индустрия
  subtitle: Paddle Board Overstock Всяка офшорна енергия RIB е проектирана за безопасна и надеждна работа при екстремни морски условия — от Северно море до Югоизточна Азия.
  list:
    - Подсилен корпус с дълбока V форма за работа при бурни води и предвидимо управление
    - Hypalon Тежкотоварни тръби с UV химическа устойчивост за продължителна офшорна служба
    - 316 Hardware от неръждаема стомана — няма корозия при непрекъснато излагане на солена вода
    - 'Пълен навигационен комплект: GPS, радар, VHF, нощни навигационни светлини — стандартно за офшорните модели'
    - Самоизпускаща се палуба за безопасна експлоатация при морски условия
    - Конфигурации с множество двигатели — единични или двойни външни за излишък на мисията
    - Теглетелен стълб и здрави шипове за работа с платформа и буй
    - Цветове на тръбите с висока видимост за идентификация на офшорни работни обекти
content_segments:
  tagline: Енергийни профили
  title: Офшорни енергийни решения<br />По тип на приложението
  subtitle: Различните офшорни енергийни сектори имат уникални изисквания за работни лодки — от поддръжка RIBs на платформата до CTV на вятърни паркове и подводни инспекционни кораби.
  items:
    - title: Поддръжка на офшорни нефтени и газови платформи
      subtitle: Прехвърляне на екипаж, снабдяване с оборудване, готовност за безопасност на платформата
      description: Нефтените и газовите платформи изискват ежедневна смяна на екипажа, транспорт на оборудване и доставки, както и покритие за безопасност. Работните лодки трябва да оперират безопасно около структури на платформите, при силни течения и променливи морски състояния, и да поддържат прецизно поддържане на станцията по време на прехвърляне на персонала чрез стълба или проход. Екстремната среда — въглеводороди, химикали, постоянен солен спрей — изисква устойчивост на корозия конструкция и надеждна работа.
      features:
        - Конфигурация за прехвърляне на екипажа с безопасен достъп за качване и парапети
        - Тръби, устойчиви на Hypalon корозия, и 316 от неръждаема стомана
        - Подсилени триещи ленти за чести контакти с калниците на платформата
        - Самоизпускаща се тераса за мазна вода и химическо измиване
        - Резервоар за гориво с голям капацитет за удължен офшорен оперативен обхват
        - Опция за двудвигателен двигател за критично важна излишност
    - title: Операции на офшорни вятърни паркове
      subtitle: Прехвърляне на екипаж, поддръжка на турбина, транспорт на инструменти
      description: Офшорната вятърна енергия е най-бързо развиващият се сектор в морската енергетика. Операторите се нуждаят от кораби за трансфер на екипаж (CTV), които могат безопасно да прехвърлят техници на платформи за достъп до турбини в морски щати с височина на вълната до 1,5 м. Стабилността по време на прехвърляне, способността за всички метеорологични условия и надеждната ежедневна експлоатация са от решаващо значение. Корабите за обслужване на вятърни паркове работят по стегнати графици — всяко прекъсване забавя пускането в експлоатация или поддръжката на турбината, което пряко влияе на приходите от производство на енергия.
      features:
        - Оптимизирана форма на корпуса за стабилен трансфер на екипажа в турбинната база
        - Deep-V вход за комфортно каране в офшорни вълни и вълни
        - Пълна защита от атмосферни условия — затворена конзола или рулевата кабина за комфорт на екипажа
        - Пространство на палубата за инструменти, резервни части и сервизно оборудване
        - Пакет за нощни операции за удължени зимни смени с ограничено през деня
        - Тиха работа на извънбордови двигатели за минимално въздействие на шума върху морската среда
    - title: Подводен кабел и поддръжка на тръбопроводи
      subtitle: Инспекция, поддръжка, поддръжка на ROV, проучване
      description: Операторите на подводни кабели и тръбопроводи се нуждаят от работни лодки за инспекция на маршрути, поддръжка, експлоатация на ROV и изследователски задачи. Тези съдове изискват стабилни платформи за разполагане и възстановяване на подводно оборудване, прецизно маневриране при ниска скорост за проследяване на кабели и надеждна работа в крайбрежна и офшорна среда. Стабилността на лодката е критична за точността на сонарното и измервателното оборудване.
      features:
        - Стабилна платформа на ниска скорост за проследяване на кабели и проучвания
        - Отворена платформа за разполагане на ROV, кабелни шпули и оборудване за проучване
        - Монтажни плочи за оборудване за сонар, GPS и геодезическа апаратура
        - Дизайн на корпуса с ниска вълна за минимално нарушаване на морското дъно по време на инспекция
        - Прецизно маневриране при ниски скорости с отзивчиво външно управление
    - title: Морско инженерство и строителна поддръжка
      subtitle: Транспорт на персонал, снабдяване с материали, подкрепа при гмуркане
      description: Морските инженерни изпълнители, работещи по пристанищно строителство, крайбрежна защита и офшорни инсталации, се нуждаят от гъвкави работни лодки за транспорт на персонал между строителни съдове и брега, доставка на материали и инструменти, подкрепа при гмуркане и проучвания на обекта. Тези лодки оперират в активни строителни зони с множество съдове, ограничено пространство за маневриране и променливи морски условия. Издръжливостта и гъвкавостта са от първостепенно значение.
      features:
        - Многофункционално разположение на палубата за персонал, материали и гмуркаческо оборудване
        - Монтиране на гмуркателна стълба и оборудване за операции по поддръжка на гмуркане
        - Тежкотоварни клеми и теглич за маневриране на строителен обект
        - Здрава Hypalon конструкция за устойчивост на строителни отпадъци и абразия
        - Гъвкави конфигурации на седалките — транспорт на екип или товарен режим
