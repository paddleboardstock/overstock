hero:
  tagline: Център за научноизследователска и развойна дейност
  title: Център за НИРД
  subtitle: Фокусиран върху напредъка
intro:
  - Изследователският и развоен (R&D) център на Paddle Board Overstock е движещата сила зад нашата мисия да революционизираме оборудването за водни спортове. Ние предоставяме на любителите на водните спортове по целия свят по-безопасни, по-удобни и по-приятни продукти чрез непрекъснати иновации в надуваемите сърфове с гребла (SUPs) и лодки. Нашият отдаден екип от инженери, дизайнери и страстни експерти по водни спортове формира бъдещето на индустрията, постоянно повишавайки стандарта за качество, представяне и устойчивост.
  - Нашият изследователски и развоен център обединява материални учени, морски архитекти и производствени инженери под един покрив. От формулирането на материали и симулацията на корпуса до разработката на заваръчни процеси и пълномащабни морски изпитания, всеки етап от разработката на продукта се управлява от данни и се валидира чрез тестове.
mission:
  tagline: Нашата мисия
  title: Иновиране на бъдещето на водните спортове
  pillars:
    - icon: lightning
      title: Технологичен напредък
      desc: Предпоставяне на нови материали, дизайни и производство за превъзходна производителност и дълготрайност на продуктите.
    - icon: design
      title: Дизайн, насочен към потребителя
      desc: Дълбоко разбиране и надхвърляне на потребителските нужди чрез ергономичен и интуитивен продуктов дизайн.
    - icon: globe
      title: Устойчиви практики
      desc: Минимизиране на нашия екологичен отпечатък чрез използване на екологично чисти материали и процеси.
    - icon: shield
      title: Безкомпромисна безопасност
      desc: Осигуряване на най-високите стандарти за безопасност чрез стриктно тестване и сертификация.
pillars:
  - title: Технологичен напредък
    desc: Разработване на новаторски материали, дизайни и производствени процеси за постигане на по-висока производителност и дълготрайност на продуктите.
    icon: tech
  - title: Напреднали материали
    desc: Изследване на съвременни PVC, Hypalon, композити и устойчиви алтернативи за подобрени характеристики на продукта.
    icon: materials
  - title: Устойчивост
    desc: 'Основно ангажиране: Посветени сме на опазването на околната среда чрез устойчиво производство и рециклируеми материали.'
    icon: sustainability
capabilities:
  tagline: Възможности
  title: Възможности за научноизследователска и развойна дейност
  subtitle: Четири основни дисциплини, които ни дават пълен контрол върху разработването на продукта — от изследване на суровините до окончателната сертификация.
  groups:
    - title: Научни материали и текстилни технологии
      items:
        - Анализ и оптимизация на формулировките на PVC и Hypalon
        - UV разработване на добавки за стабилизация, устойчивост на пламък и антимикробна защита
        - Инженерство на ламиниране и залепване на многослойни тъкани
        - Тестване на ускорено стареене (UV, термично, влажност, солен спрей)
    - title: Конструкция на корпуси и хидродинамика
      items:
        - Параметричен 3D дизайн на корпус и оптимизация чрез CFD
        - Анализ с крайни елементи за структурни и ударни натоварвания
        - Тестване на мащабни модели в опитна резервоарна среда и валидиране на представянето
        - Разработване на специални корпуси за специфични мисии
    - title: Технология на заваряване и съединяване
      items:
        - Разработка и оптимизация на RF диелектричен заваръчен процес
        - Методи за заваряване с горещ въздух, горещ клин и ултразвук
        - Квалификация на адхезивно свързване и лента за шевове
        - Моделиране на здравината на заварките и прогнозиране на експлоатационния им живот
    - title: Тестване, сертификация и съответствие
      items:
        - Управление на качеството и тестове за съответствие с CE
        - Подкрепа за независими тестове и сертификация от трета страна
        - Разработка на персонализирани протоколи за тестване за квалификация на доставки
        - Анализ на повреди по време на експлоатация и изследване на основните причини
