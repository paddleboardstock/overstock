rd_services:
  tagline: Персонализирани R&D
  title: Услуги за изследвания и разработки за партньори
  services:
    - title: Разработка на персонализирани материали
      desc: Разработваме персонализирани формули за тъкани, ламинирани конструкции и адхезивни системи, съобразени с вашата работна среда и целите за ефективност.
    - title: OEM / ODM Продуктово инженерство
      desc: От концептуални скици до инженерни пакети, готови за производство — нашият екип може да проектира, изработи прототип и валидира лодки под вашата марка.
    - title: Тестване и сертификация от трета страна
      desc: Използвайте нашите тестови съоръжения, съвместими с ISO, за независимо тестване на материали, валидиране на продукти и подкрепа при сертификация.
  cta: Обсъдете вашите изисквания за R&D →
  cta_link: /contact
vision:
  tagline: Нашето виждане
  title: Оформяне на бъдещето на водните спортове
  body: Paddle Board Overstock се стреми да води индустрията на надуваемите лодки и SUP чрез непрекъснати иновации, непоколебимо качество и твърда ангажираност към безопасността и устойчивостта — в крайна сметка обогатявайки преживяванията на любителите на водни спортове по целия свят. Изследователският и развоен център Paddle Board Overstock е мястото, където страстта среща иновациите, поставяйки нови стандарти за индустрията на водните спортове.
labs_section:
  tagline: Лаборатории
  title: Нашите лаборатории
  labs:
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/randd/paddleboardoverstock-pvc-material-lab.webp
      title: PVC Лаборатория за тъкани
      description: Непрекъснати изследвания и тестове на PVC и Hypalon тъканите за тръби относно якост на опън, устойчивост на UV, износване и гъвкавост при ниски температури, за да се осигури дългосрочна надеждност в морска среда.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
      title: Студио за проектиране на корпуси
      description: Проектиране, управлявано от CAD, и анализ с крайни елементи на корпуси от HDPE, алуминий и стъклопласт. Всеки корпус се симулира цифрово за разпределение на напрежението и устойчивост на удари преди да се изгради първият прототип.
      href: /randdcenter/hull-engineering
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing-3.webp
      title: Център за радиочестотно заваряване
      description: Специализирано съоръжение за радиочестотно заваряване с прецизен контрол на температурата и налягането, произвеждащо здрави, непропускливи шевове, които отговарят на стандартите на морската индустрия за надуваеми плавателни съдове.
      href: /randdcenter/rf-welding
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-original.webp
      title: Хидродинамичен тестов резервоар
      description: Тестване на модели в мащаб в нашия вътрешен тестов резервоар за оптимизиране на формата на корпуса, плувните характеристики, стабилността и ефективността на горивото при различни натоварвания и морски условия.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      title: Прототипна работилница
      description: Пълномащабно прототипиране и оборудване, където се изграждат, оборудват и изпитват нови модели на вода. Всеки прототип преминава минимална 20-часова водна тестова програма преди одобрение за производство.
      href: /randdcenter/prototype-workshop
    - image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
      title: Лаборатория за качество и инспекция
      description: Посветена лаборатория за осигуряване на качество, извършваща тестове за якост на опън, цикли на задържане на въздуха, тестове за разлепване на шевове и сертифициране на материали, за да се гарантира, че всяка лодка, напускаща работилницата, отговаря на публикуваните ни спецификации.
      href: /randdcenter/quality-inspection-lab
