hero:
  tagline: Нашият екип
  title: Хората зад Paddle Board Overstock<br />— Инженерство на свободата върху вода
  subtitle: Основана през 2012 година в Уейхай, Китай, Paddle Board Overstock е създадена от морски инженери, материални учени и ентусиасти на водни спортове, които вярваха в това да направят надуваемите плавателни дъски от професионален клас достъпни по целия свят.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock пълна снимка на екипа — инженеринг, производство и ръководство
founding:
  tagline: Нашето основание
  title: От крайбрежна работилница<br />до съоръжение от 12 000 м²
  subtitle: Paddle Board Overstock е основана от екип от морски инженери с десетилетия комбиниран опит в проектирането на надуваеми SUP, конструирането на drop-stitch и глобалното производство за водни спортове.
  items:
    - title: 'Основана: 2012 г.'
      description: Основана във Вейхай, Китай — голям морски център с дълбоко корабостроително наследство.
      icon: tabler:calendar
    - title: 200-300 служители
      description: Включително 14+ инженери R&D, специалисти по контрол на качеството и производствени техници.
      icon: tabler:users
    - title: Съоръжение 12 000 м²
      description: Посветен производствен завод с 6 производствени линии за SUP дъски и аксесоари.
      icon: tabler:building-factory
    - title: 50+ обслужвани страни
      description: Експорт към Европа, Америка, Близкия изток, Азиатско-тихоокеанския регион и Африка.
      icon: tabler:globe
leadership:
  tagline: Ръководство
  title: Ръководство и инженерно лидерство
  subtitle: Нашият управленски екип обединява дълбоки знания в морското инженерство, международната търговия и управлението на качеството.
  columns: 3
  items:
    - title: Основател и главен изпълнителен директор
      name: Тоби Лиу
      description: 15+ години в морското производство. Преди това ръководи R&D в голям китайски производител на морска техника. Притежава множество патенти в дизайна на надуваеми продукти.
      icon: tabler:crown
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-toby-liu-team.webp
    - title: Главен инженер
      name: Чжан Вей
      description: 20+ години в обработката на полимери и проектирането на надуваеми конструкции. Бивш технически директор в европейска морска инженерна фирма.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Ръководител на НИРД
      name: Чен Мин
      description: Доктор по наука за материалите. Специализира в drop-stitch технология и процеси на високочестотно заваряване. 10+ години опит с текстилни композити.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Директор производство
      name: Лиу Цян
      description: 18+ години в сферата на бережливото производство и оптимизацията на производствените линии. Изградил е системите за качество зад нашия 99,3% бездефектен резултат.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Мениджър качеството
      name: Уанг Фанг
      description: 12+ години в морския контрол на качеството. Наблюдава тестовете за налягане, шевове и натоварване за всяка производствена партида преди пускане.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Директор продажби и операции
      name: Хелън Лий
      description: 15+ години в международната електронна търговия и логистика. Доставя дъски на гребци в 50+ страни. Владее 4 езика.
      icon: tabler:briefcase
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-helen-contact-sales.webp
philosophy:
  tagline: Философия на дизайна
  title: Проектиране, водено от инженерството<br />— Всеки детайл е важен
  subtitle: Нашата инженерна философия се основава на три принципа, които ръководят всеки продукт, който създаваме.
  list:
    - 'Надеждност на първо място: Всеки Paddle Board Overstock продукт е тестван да издържа на реални условия — от експедиции в студена вода до наеми на тропически плажове. Усъвършенстваме проектирането там, където е най-важно.'
    - 'Прецизност в производството: Нашите съоръжения използват CNC рязане, високочестотно заваряване и автоматизирано тестване на налягането. Всеки шев, всяка клапа, всяка връзка отговарят на документираните спецификации.'
    - 'Непрекъсната иновация: Нашият екип за НИРД непрекъснато оценява нови материали, производствени методи и подобрения в дизайна. Не чакаме проблеми — ние ги предвиждаме.'
