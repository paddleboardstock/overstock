hero:
  tagline: Нашият екип
  title: Хората зад Aquafarer<br />— Инженерство на свободата върху вода
  subtitle: Основана през 2012 г. в Циндао, Китай, Aquafarer е създадена от морски инженери, специалисти по материали и любители на водни спортове, които вярват в това да направят професионални надуваеми водни плавателни съдове достъпни по целия свят.
  image:
    src: /images/team-all.webp
    alt: Aquafarer пълна снимка на екипа — инженеринг, производство и ръководство
founding:
  tagline: Нашето основание
  title: От крайбрежна работилница<br />до съоръжение от 12 000 м²
  subtitle: Aquafarer е основана от екип морски инженери с десетилетия комбиниран опит в дизайна на надуваеми лодки, PVC/Hypalon производството и световното производство на морско оборудване.
  items:
    - title: 'Основана: 2012 г.'
      description: Учредена в Циндао, Китай — важен морски център с дълбока корабостроителна традиция.
      icon: tabler:calendar
    - title: 200-300 служители
      description: Включително 50+ инженери за НИРД, специалисти по контрол на качеството и производствени техници.
      icon: tabler:users
    - title: Съоръжение 12 000 м²
      description: Специализиран завод с 6 производствени линии за RIBs, надуваеми лодки и SUP дъски.
      icon: tabler:building-factory
    - title: 50+ обслужвани страни
      description: Експорт към Европа, Америка, Близкия изток, Азиатско-тихоокеанския регион и Африка.
      icon: tabler:globe
leadership:
  tagline: Ръководство
  title: Ръководство и инженерно лидерство
  subtitle: Нашият управленски екип обединява дълбоки знания в морското инженерство, международната търговия и управлението на качеството.
  columns: 3
  items:
    - title: Основател и главен изпълнителен директор
      name: Тоби Лиу
      description: 15+ години в морското производство. Преди това е ръководил научноизследователска и развойна дейност в голям китайски производител на лодки. Притежава множество патенти за проектиране на надуваеми лодки.
      icon: tabler:crown
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-toby-liu-team.webp
    - title: Главен инженер
      name: Чжан Вей
      description: 20+ години в PVCHypalon / изработка и проектиране на корпуси с дълбоки V. Бивш технически директор в европейска морска инженерна фирма.
      icon: tabler:engine
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
