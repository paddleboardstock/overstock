      description: Доктор по наука за материалите. Специализира в drop-stitch технология и процеси на високочестотно заваряване. 10+ години опит с текстилни композити.
      icon: tabler:flask
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Директор производство
      name: Лиу Цян
      description: 18+ години опит в оптимизация на производството и производствените линии. Six Sigma Черен колан. Внедрил системи за качество ISO 9001.
      icon: tabler:settings
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Мениджър качеството
      name: Уанг Фанг
      description: 12+ години в морския контрол на качеството. CE Сертифициран и ISO одитор. Наблюдава тестването за всяка производствена партида.
      icon: tabler:shield-check
      image: data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"%3E%3Ccircle cx="64" cy="64" r="64" fill="%23e5e7eb"/%3E%3Ccircle cx="64" cy="48" r="18" fill="%239ca3af"/%3E%3Cellipse cx="64" cy="100" rx="32" ry="20" fill="%239ca3af"/%3E%3C/svg%3E
    - title: Директор продажби и операции
      name: Хелън Лий
      description: 15+ години в B2B международната търговия. OEMУправляван /ODM партньорства в 30+ държави. Владее свободно 4 езика.
      icon: tabler:briefcase
      image: https://assets.aquafarer.com/images/aquafarer/team/aquafarer-helen-contact-sales.webp
philosophy:
  tagline: Философия на дизайна
  title: Проектиране, водено от инженерството<br />— Всеки детайл е важен
  subtitle: Нашата инженерна философия се основава на три принципа, които ръководят всеки продукт, който създаваме.
  list:
    - 'Надеждност на първо място: Всеки Aquafarer продукт се тества, за да издържи на условията на реалния свят — от операции за спасяване в студена вода до наем в тропически курорти. Прекомерно инженерно проектираме там, където е най-важно.'
    - 'Прецизност в производството: Нашите съоръжения използват CNC рязане, високочестотно заваряване и автоматизирано тестване на налягането. Всеки шев, всяка клапа, всяка връзка отговарят на документираните спецификации.'
    - 'Непрекъсната иновация: Нашият екип за НИРД непрекъснато оценява нови материали, производствени методи и подобрения в дизайна. Не чакаме проблеми — ние ги предвиждаме.'
cta:
  title: Искате ли да обсъдите проект с нашия екип?
