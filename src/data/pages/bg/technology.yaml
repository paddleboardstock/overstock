testimonial:
  quote: Това, което Paddle Board Overstock се отличава, е тяхната материалознание. Те не просто сглобяват компоненти — те проектират PVC съединенията, параметрите на заварката и структурното полагане вътрешно. Тази вертикална интеграция се вижда в крайния продукт.
  author: Дейвид Парк
  title: Мениджър продуктово развитие
  company: Спортно оборудване Bluewater
  location: Австралия
sections:
  - title: Drop-Stitch Ядро
    standard: Работно налягане 12-15 PSI
    description: Хиляди вътрешни полиестерни нишки свързват горния и долния слой, създавайки твърда структура при 12-15 PSIсантиметри. Това е същата технология, използвана в професионални гребни дъски и надуваеми състезателни лодки. drop-stitch Плътността ни е оптимизирана за всеки модел за идеалния баланс между твърдост и тегло.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS Основна Диаграма
  - title: Морско качество PVC
    standard: Заварен с фузия |UV / тест за солена вода / абразия
    description: Многослойна PVC ламинирана тъкан, сертифицирана за морска среда. Всеки слой е заварен чрез фузия, а не залепен, което елиминира риска от деламинация. Тестван за UV устойчивост (ASTM G154, 1 000+ часа), корозия от солена вода (ISO9227) и абразия (ASTM D751).
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC Слой
  - title: Hypalon Тръби
    standard: CSM гума |UV / химически / устойчива на екстремни температури
    description: Използвани при RIB модели Hypalon , (CSM) каучукът осигурява по-добра UV и химическа устойчивост в сравнение със PVCстандартните .Hypalon Тръбите запазват гъвкавост при екстремни температури и устояват на деградация от излагане на гориво и масло. Всички шевове се полагат ръчно от сертифицирани техници.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Под на въздушната палуба
    standard: Високонапорна надуваема машина | Заменя шперплат/алуминий
    description: Високонапорна система за надуваеми подове, заменяща традиционните шперплат или алуминиеви летви подове. Намалява времето за монтаж, общото тегло и капацитета на съхранение, като осигурява достатъчна твърдост за стоене, риболов и ходене. Тествано да поддържа разпределено натоварване от 200 кг+.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-air-deck.webp
    imageAlt: Въздушна палуба
