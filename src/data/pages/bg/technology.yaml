testimonial:
  quote: Това, което ме спечели, беше конструкцията. Шевове, заварени чрез фузия вместо с лепило, drop-stitch ядро, което се усеща стабилно при 15 PSI, и никакво люлеене, когато се стъпя назад, за да завъртя. Две години по-късно, нула проблеми.
  author: Марта Келер
  title: Проверен купувач
  company: Туристически гребец по езера
  location: Германия
sections:
  - title: Drop-Stitch ядро
    standard: Работно налягане 12-15 PSI
    description: Хиляди вътрешни полиестерни нишки свързват горния и долния слой, създавайки твърда структура при 12-15 PSI. Това е същата технология, използвана в професионалните падъл бордове. Нашата drop-stitch плътност е оптимизирана за всеки модел за идеален баланс между твърдост и тегло.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: DS Основна Диаграма
  - title: Морско качество PVC
    standard: Заварен с фузия |UV / тест за солена вода / абразия
    description: Многостепенна ламинирана PVC тъкан, сертифицирана за морски условия. Всеки слой е заварен с фузия, а не залепен, елиминирайки рисковете от деламиниране. Тествана за UV устойчивост (1,000+ часа), корозия от солена вода и износване.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: PVC Слой
  - title: EVA Дековa система
    standard: Неплъзгащи, удобни, арт-серия мотиви
    description: Цялостният дeков EVA пяна предоставя сцепление, омекотяване и характерния вид на арт-серията. Прецизно изрязани панели са поставени в безшевни модели — няма отпечатани графики, които да се надраскат, не е нужен восък.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: EVA Дек
  - title: Тройно-слойна релсова система
    standard: Фюжън свързани | Прекомерно подсилени в зоната с най-голямо натоварване
    description: Релсовите ленти са тройно фюжън свързани и обвиват ръба на дъската — зоната с най-голямо натоварване при всяка надуваема дъска. Тук евтините дъски се чупят първи; нашите са прекомерно подсилени.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Релсова система
