content_version_control:
  tagline: Контрол на версиите
  title: Версия на чертежа<br />Управление
  subtitle: Всяка чертеж следва контролирана система за ревизии. Винаги проверявайте, че имате текущата версия, преди да използвате чертежи за планиране на проект.
  items:
    - title: Проследяване на ревизии
      description: Всеки чертеж носи код за ревизия (Rev-A, Rev-B, Rev-C), дата на издаване, дата на последен преглед, приложим модел/конфигурация, единици, размер на файла и формат. Само "Текущата" версия е достъпна за изтегляне.
      icon: tabler:git-branch
    - title: Уведомление за статус на чертеж
      description: Всички публични чертежи са маркирани като "Само предварително оформление — не за строителство, сертифициране или производствена употреба. Размерите подлежат на окончателна спецификация и потвърждение на поръчката." Това предпазва и двете страни от неправилно прилагане.
      icon: tabler:alert-circle
    - title: Известия за актуализации
      description: Когато спецификацията на модела се промени, ревизията на чертежа се актуализира и предишните версии се маркират като "Заменени". Регистрираните потребители, които са изтеглили DXF/DWG пакети, получават уведомления за значителни актуализации по имейл.
      icon: tabler:bell
faq:
  title: Технически чертежи — Често задавани въпроси
  questions:
    - q: Дали GA PDF файловете наистина са безплатни?
      a: Да. Общи PDF файлове за основните ни модели са налични безплатно — попълнете краткия формуляр за квалификация по-долу и линкът за изтегляне ще бъде доставен по имейл в рамките на 1 работен ден. Те съдържат информация на ниво планиране, достатъчна за оценка на проекта, разпределение на пространство и предварителен преглед на спецификациите.
    - q: Как да достъпя DXF/DWG файлове?
      a: Попълнете краткия формуляр за квалификация на страницата за изтегляне с името на вашата компания, типа проект и предназначението за употреба. Одобрените заявки получават линк за изтегляне по имейл в рамките на 1 работен ден.
    - q: Мога ли да получа STEP/IGES 3D модели?
      a: STEP или IGES 3D файлове са достъпни чрез нашия процес на кандидатстване за проекти. Посочете обхвата на проекта, изискванията за интеграция, срока и намерението за покупка. Подлежат на одобрение — обикновено в рамките на 3-5 работни дни.
    - q: Защо ограничавате достъпа до файлове с по-висока детайлност?
      a: Геометрията на корпуса, данните за формата и структурните изчисления представляват години инвестиции в научноизследователска и развойна дейност и са основна интелектуална собственост в производството. Ние предоставяме всичко необходимо за планиране на поръчки и интеграция на проекти, като същевременно защитаваме способността си да продължим да инвестираме в разработване на нови продукти.
    - q: Включват ли чертежите производствени детайли?
      a: Не. Публичните и светлинните чертежи съдържат информация на ниво доставки за планиране и спецификация. Детайли на производствено ниво (графици за ламиниране, пътища на инструменти, разширения за рязане) се споделят само NDA с потвърдени поръчки.
    - q: Има ли чертежи за персонализирани или RIB полуперсонализирани конфигурации?
      a: Персонализираните чертежи на проекта се подготвят като част от OEMODM процеса на разработка. Ако оценявате RIB персонализиран проект, свържете се с нас с вашите изисквания и ние ще предоставим специфични за проекта чертежи на GA като част от предложението.
