      description: 5,8 RIBм, GRP дълбоко-V корпус Hypalon или PVC тръби, централна конзола. Налични са GA, размери, разположение на палубата и транспортен план. Категория проектиране C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 RIBм, GRP средно-V корпус Hypalon , или PVC тръби, странична или централна конзола. GA и налични размери. Дизайн категория C.
