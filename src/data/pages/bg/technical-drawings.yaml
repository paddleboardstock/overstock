hero:
  tagline: Технически чертежи и CAD
  title: RIB & Надуваема лодка<br />Технически чертежи & CAD изтегляния
  subtitle: Планови чертежи на ниво планиране, листове с размери и оформления на палуби за оценка и спецификация на проекти. Достъп до технически чертежи на правилното ниво — от публични PDF файлове до STEP файлове на ниво проект.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: RIB технически чертежи на лодки и CAD изтегляния
direct_answer: Paddle Board Overstock предоставя технически чертежи на ниво снабдяване за RIB лодки и надуваеми плавателни съдове — включително PDF файлове с обща подредба (GA), листове с размери и чертежи за разположение на палубата. Формати с по-висока детайлност (DXF/DWG, STEP/IGES) са достъпни при квалифицирано запитване или заявка за проект.
stats:
  - value: GA PDF
    label: Безплатно изтегляне
    detail: Обща подредба по модел
  - value: DXF/DWG
    label: Достъп до светлинна форма
    detail: 2D CAD на ниво планиране
  - value: STEP/IGES
    label: Приложение на проекта
    detail: 3D модел за интеграция
  - value: NDA Само
    label: Структурни чертежи
    detail: Ламиниране на корпуса, данни за мухли
content_tiers:
  tagline: Нива за изтегляне
  title: Четири нива на достъп<br />— Подходящата подробност за съответния етап
  subtitle: Предоставяме чертежи на ниво снабдяване, а не файлове на производствено ниво. Всяко ниво съответства на различен етап на проект.
  items:
    - title: Ниво 1 — Публичен PDF
      description: Общо подреждане (GA), чертеж на размери с 4 вида и оформление на палубата в PDF формат. Достъпно за безплатно изтегляне. Достатъчно за планиране на проекти, разпределение на пространство и преглед на предварителни спецификации.
      icon: tabler:file-type-pdf
    - title: Ниво 2 — Лека форма DXF/DWG
      description: 2D CAD файлове (DXF или DWG) за интеграция на разпределение на ниво планиране. Изисква кратък формуляр за квалификация (име на компания, тип проект, предназначена употреба). Не са включени структурни или производствени данни.
      icon: tabler:file-code
    - title: Ниво 3 — Проектно приложение STEP/IGES
      description: 3D файлове с модели (STEP или IGES) за интеграция на системата, дизайн на оборудване или координация на корабна архитектура. Изисква кандидатстване на проект с обхват, график и намерение за покупка. Подлежа на одобрение.
      icon: tabler:cube
    - title: Ниво 4 — NDA Инженерство
      description: Структурни чертежи на корпуса, графици за ламиниране, разширения за рязане на тръби и данни за формата. Достъпни само NDA с потвърдени поръчки. Това са файлове на производствено ниво — не за публично разпространение.
      icon: tabler:lock
content_included:
  tagline: Какво включва
  title: Съдържание на чертежите<br />По модел
  subtitle: Всеки модел има стандартен чертежен пакет, който обхваща основната информация за планиране за B2B купувачите и проектните инженери.
  items:
    - title: Обща организация (GA)
      description: Страничен профил, изглед отгоре и напречно сечение, показващи форма на корпуса, позиция на тръбата, разположение на конзолата, седалки, горивна система и ключови размери (LOA, греда, диаметър на тръбата, ъгъл на дедрайз). Статус на ревизия и авторски права са отбелязани на заглавния блок.
      icon: tabler:layout
    - title: Чертеж на размерност с 4 гледни точки
      description: Гледки отстрани, отпред, назад и отгоре с общи размери за планиране на транспорта (височина на ремаркето, греда за контейнер, тежест за повдигане). Включва оперативни и транспортни конфигурации.
      icon: tabler:ruler-2
    - title: Разположение на палубата и план за оборудване
      description: Изглед отгоре към палубата, показващ основата на конзолата, позициите на седалките, позициите на D-пръстена, позициите на навигационните светлини, достъпа до помпата за трюма, отделението за батерии/гориво и точките за монтаж на оборудването. Ограничена прецизност на патентованите интерфейси.
      icon: tabler:map
    - title: Транспорт и опаковъчно чертане
      description: План за товарене на контейнери, размери на люлката, разпределение на теглото и позиции на повдигащите точки за логистично планиране. Включва стандартни и персонализирани опаковъчни опции.
      icon: tabler:truck
content_protection:
  tagline: Защита на интелектуалната собственост
  title: Какво не споделяме<br />и защо
  subtitle: Защитата на нашата инженерна интелектуална собственост гарантира, че можем да продължим да инвестираме в научноизследователска и развойна дейност, като същевременно осигуряваме всичко необходимо на купувачите за планиране на проекти.
  items:
    - title: Данни за ядрото на корпуса
      description: Геометрията на щепселите и калъпите, CNC пътеките на инструментите и шаблоните за ламиниране са патентовани производствени активи. Те не се споделят на нито едно ниво за достъп извън NDA потвърдени договори.
      icon: tabler:ban
    - title: Разширения с рязане на тръби
      description: Файловете за рязане с плосък модел за тръбни тъкани са данни на производствено ниво. Достъпни са само NDA с потвърдени производствени поръчки и се споделят само с договорната страна.
      icon: tabler:ban
    - title: Структурни изчисления
      description: Подробният анализ на напрежението, резултатите от FEA и графиците за ламиниране са документи, чувствителни към съответствието, които се споделят само с уведомени органи и NDAобвързани клиенти по време на процеса на оценка на съответствието.
      icon: tabler:ban
    - title: Подбор на състезатели
      description: Запазваме си правото да отказваме заявки за CAD достъп, които изглеждат от конкуренти, студенти без контекст на проекта или страни без легитимно намерение за снабдяване.
      icon: tabler:shield
content_models:
  tagline: Налични модели
  title: Технически чертеж<br />Наличност по модел
  subtitle: GA PDF файлове са налични за нашите основни RIB и надуваеми модели лодки. Свържете се с нас за конкретни чертежи на модела, които не са в списъка.
