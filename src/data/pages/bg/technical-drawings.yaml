    - title: AF430 RIB
      description: 4,3 RIBм, корпус от GRP, PVC тръби, култиватор или конзола. GA и налични размери. Категория проектиране C/D.
      icon: tabler:sailboat
    - title: Надуваема лодка AF380
      description: 3,8 м надуваема лодка, алуминиев под, PVC тръби. Налични GA и размери на опаковката. ISO Съответства на EN 6185.
      icon: tabler:sailboat
    - title: AF320 Надуваема лодка
      description: 3.2 м надуваема лодка, въздушен под, PVC тръби. Налични общи размери и опаковки. Съответства на EN ISO 6185.
      icon: tabler:sailboat
