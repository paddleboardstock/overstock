features3_certifications:
  title: Качество и тестване
  subtitle: Всяка платка се тества в нашата собствена лаборатория преди да бъде изпратена — реални числа, реални записи, без маркетингови твърдения.
  columns: 3
  isBeforeContent: true
  items:
    - title: Изградено в нашата собствена фабрика
      description: Притежаваме и управляваме съоръжение във Weihai с площ от 12 000 m². Всяка производствена партида е проследима, документирана и инспектирана — без аутсорсване на мистериозно производство.
      icon: tabler:building-factory
    - title: Лаборатория за тестване на материали
      description: Вътрешната лаборатория за материали тества якостта на опън, UV устойчивостта, целостта на шевовете и абразията за всяка партида плат преди производството.
      icon: tabler:microscope
    - title: Морски материали
      description: UV- PVC стабилизирана, drop-stitch сърцевина и EVA пяна на палубата — избрани и тествани за сезони на слънце, сол и злоупотреба.
      icon: tabler:flask
    - title: 2-годишна SUP гаранция
      description: Paddle Board Overstock SUP дъските са покрити от 2-годишна гаранция срещу производствени дефекти, включително шевове, клапани и разслояване на материала. Ние стоим зад това, което изграждаме.
      icon: tabler:shield-check
testimonials:
  tagline: Доверие на клиентите
  title: Какво казват нашите клиенти
  subtitle: От начинаещи гребци до опитни изследователи — вижте защо те имат доверие на Paddle Board Overstock.
  items:
    - content: Като купувач за първи път, бях нервен относно поръчката от чужбина. Екипът отговори на всеки въпрос с реални снимки и тестови записи, преди дори да попитам. Платката пристигна за 6 дни и надмина очакванията ми.
      name: Джеймс Торнтън
      title: SUP Собственик на Explorer 11 — Ванкувър, Канада
features3_lab:
  title: Вътрешни тестове и лаборатория за контрол на качеството
  subtitle: Всяка партида материал и крайният продукт преминава през нашата лаборатория за тестове на място преди изпращане.
  columns: 3
  isBeforeContent: true
  items:
    - title: Тест за якост на опън
      description: 'Всяка PVC ролка плат се тества за якост на опън вътрешно. Минимално изискване: 350 N/cm основи и вътък. Отхвърлените партиди се връщат на доставчика — отхвърляме приблизително 3% от входящите материали.'
      icon: tabler:scale
    - title: UV Ускорено стареене
      description: Образците от плат преминават през ускорено изветряне в продължение на 1000 UV часа. Якостта на опън трябва да запази 80%+ след излагане. Продукти, сертифицирани за 3+ години външна употреба.
      icon: tabler:sun
    - title: Якост на разлепване на шев
      description: Заварените шевове се тестват до минимална якост на обелване от 5 N/mm. Всяка производствена партида има проби от шевове, които са разрушително тествани и архивирани.
      icon: tabler:stack
    - title: Задържане на налягане за 24–48 часа
      description: 'Всеки надуваем продукт се надува до 1.25x номинално PSI и се наблюдава за 24–48 часа. Максимално допустимо спадане на налягането: 5%. Продукти, които не преминават този тест, се преработват и тестват отново преди изпращане.'
      icon: tabler:wind
    - title: Тест за цикли на клапан
      description: Всеки дизайн на клапан преминава през 10 000 цикъла отваряне-затваряне в нашата лаборатория. Клапаните трябва да поддържат въздушно-херметично уплътнение при 1,25x номинално налягане след циклиране. Всички Paddle Board Overstock клапани са оценени за 5+ години редовна употреба.
      icon: tabler:rotate
    - title: Устойчивост на студени пукнатини
      description: Материалите се тестват при -30°C в продължение на 4 часа. Не се допускат пукнатини или чупливост. Продукти, предназначени за зимно съхранение и използване в студена вода до -10°C при околна температура.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Как гарантираме качеството
  subtitle: От проверка на суровините до финално тестване на налягането — всеки продукт преминава през строг контрол на качеството.
  items:
    - title: Инспекция на суровини
      description: Всяка ролка PVC плат се тества за дебелина, якост на опън и UV устойчивост преди постъпване в производство.
      icon: tabler:search
    - title: Контрол по време на процеса
      description: Заваръчни шевове, инсталиране на клапани и свързвания на камери се инспектират на всяка станция по време на сглобяването.
      icon: tabler:eye
    - title: Тестване на налягане
      description: Всеки надуваем продукт се надува до 1.25x номинално PSI и се задържа за 24–48 часа, за да се провери задържане на въздуха и целостта на шевовете.
      icon: tabler:wind
    - title: Финална инспекция
      description: Всяко устройство се проверява за завършек, хардуер и опаковане преди одобрение за изпращане. Пробите от партиди отиват в нашата лаборатория за деструктивни тестове.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP Често задавани въпроси на борда
  subtitle: Чести въпроси относно нашите изправени дъски за гребане.
  columns: 2
  items:
    - title: Какви SUP размери дъски са налични?
      description: Предлагаме SUP дъски от 9 фута до 12 фута, включително универсални, туристически, йога и специални дизайни. Нашите най-продавани модели включват Tropical Breeze (10 фута) и Ocean Voyager (11 фута).
    - title: Какво представлява drop-stitch конструкцията?
      description: Drop-stitch конструкцията използва хиляди полиестерни нишки, свързващи горния и долния слой на дъската, което ѝ позволява да издържа на високо налягане на въздуха (15–20 PSI) и да осигури твърда, стабилна платформа. Това е индустриалният стандарт за премиум надуваеми SUPs.
    - title: Какъв е максималният тегловен лимит за SUP дъски?
      description: Нашите SUP дъски поддържат до 150 кг в зависимост от модела и обема. Leviathan Wake е нашият модел с най-голям капацитет, проектиран за по-едри карачи и за използване при йога.
    - title: Предлагате ли пълни SUP пакети?
      description: Да. Всяка SUP дъска се доставя с пълен пакет, включващ 3-частна алуминиева гребло, ръчна помпа с високо налягане, каишка за крак, туристическа раница и комплект за ремонт. Някои модели включват и комплект за сваляемо перо.
    - title: Каква е гаранцията на SUP дъските?
      description: Всички Paddle Board Overstock SUP дъски имат 2-годишна гаранция срещу производствени дефекти, включително повреда на шевовете, дефекти на клапаните и деламинация на материала при нормална употреба.
    - title: Колко време отнема да се надуе SUP дъска?
      description: Използвайки включената ръчна помпа, пълното надуване до 15 PSI отнема приблизително 8–12 минути. За по-бързо надуване препоръчваме нашата Paddle Board Overstock 12V електрическа помпа, която надува борд за по-малко от 4 минути.
