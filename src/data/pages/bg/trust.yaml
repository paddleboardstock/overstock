features3_certifications:
  title: Сертификати и съответствие
  subtitle: Всеки продукт е независимо тестван; 64 модела са CE сертифицирани по международни стандарти.
  columns: 3
  isBeforeContent: true
  items:
    - title: Сертификация CE
      description: 64 CEсертифицирани модела за SUPsкаякове, динги и RIBs отговарят на европейския CE стандарт за безопасност за развлекателни водни съдове. Всеки продукт преминава през тестове за налягане, плаваемост и натоварване преди напускане на фабриката.
      icon: tabler:certificate
    - title: ''
      description: Нашето съоръжение от 12 000 м² в Циндао работи по ISO система за управление на качеството 9001. Всяка производствена партида е проследима, документирана и инспектирана.
      icon: tabler:clipboard-check
    - title: BSCI Социално съответствие
      description: Ние сме BSCIсертифицирани, гарантирайки етични трудови практики, безопасни условия на труд и екологична отговорност по цялата ни верига за доставки.
      icon: tabler:users
    - title: REACH & RoHS
      description: Всички материали — PVCHypalon, , EVA пяна, лепила — отговарят на изискванията на REACH ЕС и RoHS регулациите. Без ограничени вещества, без компромиси.
      icon: tabler:flask
    - title: Лаборатория за тестване на материали
      description: Вътрешната лаборатория за материали тества якостта на опън, UV устойчивостта, целостта на шевовете и абразията за всяка партида плат преди производството.
      icon: tabler:microscope
    - title: 5-годишна гаранция за лодка
      description: Paddle Board Overstock Лодките са покрити с 5-годишна ограничена гаранция за тръбни платове, шевове и корпус.SUP Дъските и аксесоарите имат 2-годишна гаранция. Ние стоим зад това, което строим.
      icon: tabler:shield-check
testimonials:
  tagline: Доверие на клиентите
  title: Какво казват нашите клиенти
  subtitle: От гребци за първи път до професионални оператори на флот — вижте защо имат довериеPaddle Board Overstock.
  items:
    - content: Оборудвахме целия си флот под наем с Paddle Board Overstock RIBs — 12 лодки на три локации. След два сезона, без повреди. CE Сертификационната документация направи одобрението на застраховката безпроблемно. Техният инженерен екип дори персонализира цветовете на тръбите според нашата марка.
      name: Марко Валенти
      title: Оперативен директор, Adriatic Adventure Tours — Дубровник, Хърватия
    - content: Като първи купувач, се притеснявах за качеството при поръчка от чужбина. Документацията ISO и докладите от независими тестове, които споделиха, още преди да попитам, ми дадоха пълно доверие. Бордът пристигна за 6 дни и надмина очакванията ми.
      name: Джеймс Торнтън
      title: SUP Собственик на Explorer 11 — Ванкувър, Канада
    - content: Опериме 24 Paddle Board Overstock RIBs в нашия флот за крайбрежен патрул. Техният QC процес е последователен за всяка партида — същото качество на шева, същото разположение на вентилите, същият налягане всеки път. Тази повторяемост има значение, когато животи зависят от оборудването.
      name: Лейт. командер Андрес Рейес
      title: Морски служител по снабдяване, Филипинска брегова охрана — Манила, Филипини
features3_lab:
  title: Вътрешни тестове и лаборатория за контрол на качеството
  subtitle: Всяка партида материал и крайният продукт преминава през нашата лаборатория за тестове на място преди изпращане.
  columns: 3
  isBeforeContent: true
  items:
    - title: Тест за якост на опън
      description: 'Всеки PVC ролка плат се тества според стандартите ASTM D751. Минимално изискване: 350 N/cm по основа и плисе. Отхвърлените партиди се връщат на доставчика — отхвърляме приблизително 3% от постъпващите материали.'
      icon: tabler:scale
    - title: UV Ускорено стареене
      description: Образци плат преминават 1,000-часово ускорено излагане на атмосферни условия QUV (ASTM G154). Задържането на якостта на опън трябва да надвишава 80% след UV излагане. Продукти с рейтинг за 3+ години употреба на открито.
      icon: tabler:sun
    - title: Якост на разлепване на шев
      description: RF заварени шевове се тестват с минимална якост на разлепване 5 N/mm (ASTM D751). Ръчни шевове с лепило Hypalon се тестват с 3.5 N/mm. Всяка производствена партида има проби на шевовете, тествани деструктивно и архивирани.
      icon: tabler:stack
    - title: Задържане на налягане за 24–48 часа
      description: 'Всеки надуваем продукт се надува до 1.25x номинално PSI и се наблюдава за 24–48 часа. Максимално допустимо спадане на налягането: 5%. Продукти, които не преминават този тест, се преработват и тестват отново преди изпращане.'
      icon: tabler:wind
    - title: Тест за цикли на клапан
      description: Всяка конструкция на клапан преминава 10,000 цикъла отваряне-затваряне в нашата лаборатория. Клапаните трябва да запазят въздушна херметичност при 1.25x номинално налягане след циклиране. Всички Paddle Board Overstock клапани са с рейтинг за 5+ години редовна употреба.
      icon: tabler:rotate
    - title: Устойчивост на студени пукнатини
      description: Материалите се тестват при -30°C за 4 часа според ISO 4646. Няма позволени пукнатини или крехкост. Продукти с рейтинг за зимно съхранение и употреба във студена вода до -10°C околна температура.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Как гарантираме качеството
  subtitle: От проверка на суровините до финално тестване на налягането — всеки продукт преминава през строг контрол на качеството.
  items:
    - title: Инспекция на суровини
      description: Всяка ролка PVC плат се тества за дебелина, якост на опън и UV устойчивост преди постъпване в производство.
      icon: tabler:search
    - title: Контрол по време на процеса
      description: Заваръчни шевове, инсталиране на клапани и свързвания на камери се инспектират на всяка станция по време на сглобяването.
      icon: tabler:eye
    - title: Тестване на налягане
      description: Всеки надуваем продукт се надува до 1.25x номинално PSI и се задържа за 24–48 часа, за да се провери задържане на въздуха и целостта на шевовете.
      icon: tabler:wind
    - title: Финална инспекция
      description: Всяко устройство се проверява за завършек, хардуер и опаковане преди одобрение за изпращане. Пробите от партиди отиват в нашата лаборатория за деструктивни тестове.
      icon: tabler:clipboard-check
faqs_rib:
  title: RIB Често задавани въпроси за лодки
  subtitle: Чести въпроси относно нашите надуваеми лодки с твърд корпус.
  columns: 2
  items:
    - title: Какви размери RIB Paddle Board Overstock лодки предлага?
      description: Предлагаме 35 RIB модела с дължина от 2,5 м до 7,6 м, обхващащи всичко – от компактни тендери до тежкотоварни търговски и патрулни плавателни съдове. Всеки модел е наличен с множество конфигурации.
    - title: Каква е разликата RIB между надуваема лодка и традиционна надуваема лодка?
      description: (RIBRigid-hull Inflatable Boat) комбинира масивен корпус от фибростъкло или алуминий с дълбоки V корпуси с Hypalon надуваеми или PVC тръбни съдове. Това ви дава стабилността и товароносимостта на твърда лодка с амортисьорството и плавучестта на надуваема лодка.
    - title: С какви двигатели Paddle Board Overstock RIBsса съвместими?
      description: RIBs Поддържаме извънбордови двигатели от 3 HP до 250 HP в зависимост от модела. Всяка продуктова страница показва максималната номинална мощност на двигателя. Препоръчваме да се консултирате с вашия дилър за идеалното съвпадение.
    - title: Paddle Board Overstock RIBs CE Сертифицирани ли сте?
      description: Да. Всички RIB развлекателни модели са CE сертифицирани по приложимите европейски стандарти за рекреационни водни съдове. Търговските и патрулните модели отговарят на допълнителни изисквания за стабилност и товароносимост.
    - title: Каква е гаранцията на RIB лодките?
      description: Paddle Board Overstock RIBs Всички идват с 5-годишна ограничена гаранция за тръбната тъкан, шевовете и корпуса; клапани за надуване покрити за 5 години; фабрично инсталирани аксесоари за 1 година.
    - title: Колко въздушни Paddle Board Overstock RIBs камери имате?
      description: RIBs Разполагаме с 3 до 7 независими въздушни камери в зависимост от дължината на модела. Този многокамерен дизайн гарантира, че лодката остава на повърхността дори ако едно отделение е компрометирано.
faqs_inflatable:
  title: Често задавани въпроси за надуваеми лодки
  subtitle: Чести въпроси относно нашите надуваеми лодки, каяци и лодки.
  columns: 2
  items:
    - title: Какви материали се използват в Paddle Board Overstock надуваеми лодки?
      description: Използваме военен PVC клас (1100 денье) и Hypalonпремиум /CSM каучук, в зависимост от модела. И двата материала са UVстабилизирани, устойчиви на абразия и съответстват на REACH ЕС и RoHS регулациите.
    - title: Колко издържат надуваемите лодки?
      description: При правилна грижа качествената PVC надуваема лодка издържа 7–10 години, докато Hypalon моделите могат да издържат 15–20 години. Редовното почистване, UV защита и правилното съхранение значително удължават експлоатационния живот.
    - title: Каква поддръжка е необходима за надуваема лодка?
      description: Основната поддръжка включва изплакване с прясна вода след всяка употреба (особено в солена вода), сушене преди съхранение, ежегодна проверка на уплътненията на клапаните и UV нанасяне на защитни средства върху тръбите. Избягвайте продължително излагане на слънце, когато не се използвате.
    - title: Могат ли надуваеми лодки да се използват в солена вода?
      description: Да. Paddle Board Overstock Всички надуваеми лодки са проектирани както за сладководна, така и за солена вода. Препоръчваме изплакване с прясна вода и обилно сушене след излагане на солена вода, за да се предотврати корозия и кристализация на солта на тъканта.
    - title: Как да съхранявам надуваема лодка?
      description: Спуснете, почистете и изсушете лодката напълно преди съхранение. Навивайте небрежно (избягвайте стегнати гънки), съхранявайте на хладно и сухо място, далеч от пряка слънчева светлина, и дръжте далеч от бетонни подове, за да предотвратите отвеждане на влага.
    - title: Какъв е капацитетът на Paddle Board Overstock надуваемите лодки?
      description: Теглото варира от 290 кг за най-малките ни модели до над 2000 кг за по-големи търговски съдове. Всяка страница на продукта показва максималния товароносен рейтинг за вашия конкретен модел.
faqs_sup:
  title: SUP Често задавани въпроси на борда
  subtitle: Чести въпроси относно нашите изправени дъски за гребане.
  columns: 2
  items:
    - title: Какви SUP размери дъски са налични?
      description: Предлагаме SUP дъски от 9 фута до 12 фута, включително универсални, туристически, йога и специални дизайни. Нашите най-продавани модели включват Tropical Breeze (10 фута) и Ocean Voyager (11 фута).
    - title: Какво представлява drop-stitch конструкцията?
      description: Drop-stitch конструкцията използва хиляди полиестерни нишки, свързващи горния и долния слой на дъската, което ѝ позволява да издържа на високо налягане на въздуха (15–20 PSI) и да осигури твърда, стабилна платформа. Това е индустриалният стандарт за премиум надуваеми SUPs.
    - title: Какъв е максималният тегловен лимит за SUP дъски?
      description: Нашите SUP дъски поддържат до 150 кг в зависимост от модела и обема. Leviathan Wake е нашият модел с най-голям капацитет, проектиран за по-едри карачи и за използване при йога.
    - title: Предлагате ли пълни SUP пакети?
      description: Да. Всяка SUP дъска се доставя с пълен пакет, включващ 3-частна алуминиева гребло, ръчна помпа с високо налягане, каишка за крак, туристическа раница и комплект за ремонт. Някои модели включват и комплект за сваляемо перо.
    - title: Каква е гаранцията на SUP дъските?
      description: Всички Paddle Board Overstock SUP дъски имат 2-годишна гаранция срещу производствени дефекти, включително дефекти по шевовете, клапаните и разслояване на материала при нормална употреба.
    - title: Колко време отнема да се надуе SUP дъска?
      description: С помощта на включената ръчна помпа, пълното напомпване до 15 PSI отнема приблизително 8–12 минути. За по-бързо напомпване препоръчваме нашата Paddle Board Overstock 12V електрическа помпа, която напомпва дъска за по-малко от 4 минути.
