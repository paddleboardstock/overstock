hero:
  tagline: За нас
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock фабрика и работилница
  title: |
    Морско инженерство,<br />
    изградихме<span class="text-accent dark:text-white">Paddle Board Overstock</span>начин
  subtitle: 'Започнахме в крайбрежна работилница с една лодка и упорита вяра: морските продукти трябва да се проектират така, сякаш имат значение, защото наистина имат. Днес доставяме в над 50 страни, но всяко корпуса все още преминава през същите ръце, които стартираха компанията.'
stats:
  title: По цифри
  columns: 4
  stats:
    - title: Доставени корпуси
      amount: 2,400+
    - title: Страни, в които се доставя
      amount: 50+
    - title: Години на комбиниран опит
      amount: '60'
    - title: Средно време за реакция по гаранция (часове)
      amount: '24'
features3_what_we_build:
  title: Какво строим
  subtitle: Фокусирана продуктова линия, която познаваме до най-малкия детайл — без недовършени експерименти, без брандиране.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB лодки
      description: Алуминиеви корпуси RIBs от 3,3 м до 7,5 м. Проектирани за патрулиране, гмуркане, риболов и семейна употреба.
      icon: tabler:ship
    - title: Надуваеми лодки
      description: PVC и Hypalon надуваеми дингита от 2,4 м до 4,2 м. Лек, здрав и лесен за прибиране.
      icon: tabler:speedboat
    - title: Тендъри за суперяхти
      description: Компактни, високоспецифични RIBs индивидуално изработени, за да съответстват на визията на вашия основен кораб.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Аксесоари
      description: Гребла, помпи, калъфи, сухи торби, резервоари за гориво и електроника. Всички съвместими с нашите лодки.
      icon: tabler:package
    - title: Ремонт и преоборудване
      description: Смяна на тръби, обновяване на електрониката и ъпгрейд на двигателите в къщата.
      icon: tabler:tool
    - title: Индивидуални изработки
      description: Дизайн проект по проект за търговски, научни и военни клиенти.
      icon: tabler:hammer
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Дискусия за дизайна и инженерството на лодки
steps2_values:
  title: Нашите ценности
  subtitle: Три принципа, които са формирали всеки продукт от първия ден.
  items:
    - title: Стройте така, сякаш носи вашето семейство
      description: Всяка обвивка, заварка и крепеж се третира сякаш нашите собствени семейства ще го използват.
      icon: tabler:heart
    - title: Инженерство преди продажба
      description: Ако някоя спецификация е грешна, променяме спецификацията — никога клиента.
      icon: tabler:settings
    - title: Поддръжка, която надживява гаранцията
      description: Двадесетгодишни обвивки все още ни се обаждат за резервни части и ние все още отговаряме.
      icon: tabler:headset
steps2_milestones:
  title: Постижения
  subtitle: Кратка версия на историята на Paddle Board Overstock.
  isReversed: true
  items:
    - title: Основана в крайморска работилница
      description: Създадена от двама военноморски архитекти с CNC мелница и твърдоглава идея.
      icon: tabler:building-factory
    - title: Първите 1 000 обвивки доставени
      description: Достигнато през седмата ни година, предимно чрез слух и повторни клиенти.
      icon: tabler:circle-check
    - title: Международна програма за износ
      description: Вече изпращаме в 50+ държави с локализирани партньори за поддръжка на пет континента.
      icon: tabler:world
    - title: Нова глобална оперативна структура
      description: През септември 2026 г. операциите на марката преминават от Qingdao Vatrad Group към Weihai Dongjilian Co., Ltd. (Ню Мексико, САЩ); производственият център в Циндао продължава с R&D, производство и директен износ от фабриката.
      icon: tabler:building-skyscraper
features2_locations:
  title: Нашите локации
  tagline: Намерете ни
  columns: 3
  items:
    - title: Главен офис и работилница
      description: Крайморски индустриален парк, сграда 4 — отворено Пон–Пет за посещения с предварителна уговорка.
    - title: Сервизен център в ЕС
      description: Средиземноморско пристанище — обновяване, ремонт и поддръжка по гаранция за европейски клиенти.
    - title: Партньорска мрежа APAC
      description: Удостоверени сервизни партньори в Австралия, Япония, Сингапур и Хонконг.
brand_hub_tagline: Марка
brand_hub_title: Разгледайте нашата марка
brand_hub_subtitle: Вдълбочете се в нашата експертиза в морското инженерство, глобално присъствие и принципите, които ни движат.
brand_hub_cards:
  - title: Морска експертиза
    desc: Десетилетия в науката за материалите, прецизно производство и тестване в реални условия — от PVC/Hypalon производство до дизайн на deep-V обвивки и drop-stitch технологии.
    link: /brand-marine-expertise
    link_label: Научете повече →
  - title: Глобално присъствие
    desc: Доставка до 50+ държави от нашето съоръжение в Циндао с оторизирани партньори в Европа, Азиатско-тихоокеанския регион и Америка.
    link: /brand-global-presence
    link_label: Научете повече →
  - title: Защо Paddle Board Overstock
    desc: Вертикална интеграция, двойна сертификация (ISO9001 + BSCI), CE съответствие и ниско MOQs ниво — създадени за марки, дистрибутори и държавни агенции.
    link: /brand-why-paddleboardoverstock
    link_label: Научете повече →
production_section:
  tagline: Изключителност в продукцията
  title: Осигуряване на изящно майсторство
  description: Paddle Board Overstock Производствената линия е посветена на производството на висококачествени, издръжливи и високопроизводителни надуваеми лодки продукти.
  cards:
    - title: Екип от опитни техници
      items:
        - Професионални познания по PVCHypalon, , и морски материали
        - Прецизно майсторство при рязане, свързване и монтаж на аксесоари
        - Непрекъснато обучение за усвояване на най-новите производствени технологии
    - title: Оборудване за напреднало производство
      items:
        - оборудване CNC за прецизно рязане на плат с минимална грешка
        - Високопрецизно топло/студено свързване за херметични, издръжливи шевове
        - Професионално оборудване за херметичност и тестване на опън
    - title: Система за зрял управленски процес
      items:
        - Стандартизирани производствени процеси с ясни стандарти за качество
        - Философия на lean производството за намаляване на отпадъците и подобряване на ефективността
        - Ефективно управление на веригата за доставки с надеждни партньорства с доставчици
    - title: Строг контрол на качеството
      items:
        - Сертифицирана система за управление на качеството
        - 'Многостепенна инспекция: суровина, в процес, окончателен изход'
        - Строги тестове за херметичност и издръжливост преди изпращане
global_ops_section:
  tagline: Глобална оперативна архитектура
  title_html: Една марка,<span class="text-white/90">Два хъба</span>
  description_html: От септември 2026 г. се Paddle Board Overstock оперира от<strong class="text-white">Paddle Board Overstock ООД</strong>(Ню Мексико, САЩ) — глобалната организация за дистрибуция, B2B търговски продажби, договори, фактуриране и следпродажба. Научноизследователска и развойна дейност, производство и контрол на качеството остават на<strong class="text-white">Paddle Board Overstock Производствен център в Циндао</strong>, която изпраща всяка поръчка директно от фабриката, FOB Циндао. Преходът промени кой подписва договора ти — не кой строи лодката ти.
  stats:
    - value: 2,400+
      label: Плавателни корпуси, доставяни по целия свят
    - value: 50+
      label: Страни, износители
    - value: 10+
      label: Години на производство
