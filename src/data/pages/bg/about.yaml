hero:
  tagline: За нас
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock фабрика и работилница
  title: Относно излишъка от <span class="text-accent dark:text-white">дъска за гребане</span>
  subtitle: Чисто нови надуваеми SUP плоскости на цени с излишък от запаси и клирънс — подкрепени от собственото ни производство на Weihai от 2012 г., смесен модел на едро за малки търговци на дребно и гъвкава доставка в световен мащаб.
stats:
  title: По цифри
  columns: 4
  stats:
    - title: Годишен производствен капацитет
      amount: 15 000 единици
    - title: Страни, в които се доставя
      amount: 50+
    - title: Изпитвани под налягане платки
      amount: 100%
    - title: Инженери по научноизследователска и развойна дейност
      amount: 14+
features3_what_we_build:
  title: Какво строим
  subtitle: Фокусирана продуктова линия, която познаваме до най-малкия детайл — без недовършени експерименти, без брандиране.
  columns: 3
  isBeforeContent: true
  items:
    - title: Надуваеми SUP ПЛОСКОСТИ
      description: Обиколни и туристически SUP от 10' до 12 фута. Стабилен, твърд и снабден с помпа, гребло и каишка.
      icon: tabler:swimming
    - title: Палуби от арт сериите
      description: Картина на ЕВА — Cheetah Surge, Tropical Breeze, Medusa Glow и др.
      icon: tabler:hexagons
    - title: Пълни пакети
      description: 'Всеки борд се доставя като пълен комплект: борд, раница, помпа, гребло, перка, каишка и комплект за ремонт.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Аксесоари
      description: Помпи, гребла, каишки, ремонтни комплекти и сухи торбички. Всичко съвпадаше с нашите дъски.
      icon: tabler:tool
    - title: Грижа и ремонт
      description: Вътрешна поддръжка за ремонт, резервни части и указания за поддръжка, за да поддържате дъската си във водата в продължение на години.
      icon: tabler:settings
    - title: Автопаркове за клубове и коли под наем
      description: Групово оборудване за клубове, училища и автопаркове под наем с директна фабрична поддръжка.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Дизайн на дъската и инженерна дискусия
steps2_values:
  title: Нашите ценности
  subtitle: Три принципа, които са формирали всеки продукт от първия ден.
  items:
    - title: Стройте така, сякаш носи вашето семейство
      description: Всяка дъска, шев и клапан се третира така, сякаш нашите собствени семейства ще го използват.
      icon: tabler:heart
    - title: Инженерство преди продажба
      description: Ако някоя спецификация е грешна, променяме спецификацията — никога клиента.
      icon: tabler:settings
    - title: Поддръжка, която надживява гаранцията
      description: Таблата, които построихме преди години, все още ни викат за резервни части, а ние все още вдигаме.
      icon: tabler:headset
steps2_milestones:
  title: Постижения
  subtitle: Кратка версия на историята на Paddle Board Overstock.
  isReversed: true
  items:
    - title: Основана във Вейхай
      description: Брегова работилница, посветена на надуваеми SUP ДЪСКИ С капков бод.
      icon: tabler:building-factory
    - title: 12 000 м² производствен корпус
      description: Разширено до специално съоръжение с RF заваряване и производствен капацитет за капков бод.
      icon: tabler:circle-check
    - title: Международна програма за износ
      description: Сега доставка до над 50 държави с експресни и морски товари.
      icon: tabler:world
    - title: Излишък от запаси и фокус на едро
      description: През септември 2026 г. операциите на марката се преместват от Qingdao Vatrad Group в Weihai Dongjilian Co., Ltd.; производственият център на Weihai продължава научноизследователската и развойна дейност, производството и фабрично - директната доставка.
      icon: tabler:building-skyscraper
features2_locations:
  title: Нашите локации
  tagline: Намерете ни
  columns: 3
  items:
    - title: Главен офис и работилница
      description: Крайморски индустриален парк, сграда 4 — отворено Пон–Пет за посещения с предварителна уговорка.
    - title: Сервизен център в ЕС
      description: Средиземноморско пристанище — обновяване, ремонт и поддръжка по гаранция за европейски клиенти.
    - title: Партньорска мрежа APAC
      description: Удостоверени сервизни партньори в Австралия, Япония, Сингапур и Хонконг.
brand_hub_tagline: Марка
brand_hub_title: Разгледайте нашата марка
brand_hub_subtitle: Вдълбочете се в нашата експертиза в морското инженерство, глобално присъствие и принципите, които ни движат.
brand_hub_cards:
  - title: Морска експертиза
    desc: Десетилетия на материалознание, прецизно производство и тестване в реалния свят — от сърцевини на капков бод до заварени шевове и палуби от серията Art.
    link: /brand-marine-expertise
    link_label: Научете повече →
  - title: Защо Paddle Board Overstock
    desc: Фабрично директно ценообразуване, 100% плоскости, тествани под налягане, и 2 — годишна гаранция — създадени за гребци, семейства и любители на водните спортове.
    link: /brand-why-paddleboardoverstock
    link_label: Научете повече →
