hero:
  tagline: Училища и тренировъчни центрове за водни спортове
  title: Оборудване Решения<br />За SUP и училища по каяк
  subtitle: Надеждно, търговско оборудване за училища по гребане, уроци по сърф, обучение по каяк и програми за образование по водни спортове на всякакъв мащаб.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP дъски за училища и тренировъчни центрове
direct_answer: Paddle Board Overstock доставя на SUP и каяк училища по целия свят професионални бордове, предпазно оборудване и пакети за инструктори. Нашето оборудване е създадено за ежедневна учебна употреба — по-дебели PVC, подсилени drop-stitch сърцевини и стабилни корпусни дизайни, които дават увереност на начинаещите и надеждност на инструкторите. Пакетите включват персонализирано брандиране, програми за резервни части и обучителни ресурси.
solution_offerings:
  - title: Пакет за започване на училище
    subtitle: За нови програми и малки обучителни центрове
    badge: Popular
    features:
      - title: Студентски съвети
        description: 10–25 универсални SUP дъски или развлекателни каяци с стабилни платформи за уроци за начинаещи
      - title: Инструкторски табла
        description: По-широки, по-дълги дъски с допълнителна стабилност и нехлъзгащи се EVA палуби за обучение
      - title: Предпазно оборудване
        description: Спасителни жилетки, каишки, свирки и торби за хвърляне в съвпадащи цветове
      - title: Съхранение и транспорт
        description: Стелажи за дъски с възможност за нареждане един върху друг, паднати кошници за каяци и транспортни колички
      - title: Подкрепа за учебната програма
        description: Шаблони за уроци, списъци за проверка на безопасността и ръководства за развитие на уменията
    cta_text: Стартирай пакета ми за училище
    cta_href: /contact
  - title: Премиум пакет за училище
    subtitle: За утвърдени училища и оператори с множество програми
    badge: Best Value
    features:
      - title: Пълен флот
        description: 25–50 дъски или каяци с миксиран флот (универсални, туристически, за младежки размери)
      - title: Флотилия на инструкторите
        description: 3–5 специализирани табла за инструктори с вградени стойки за звукова система
      - title: Станция за безопасност
        description: Централизирана станция за безопасност с лични предпазни средства, радиостанции, първа помощ и табели
      - title: Пакет за брандинг
        description: Пълно отпечатване на лого върху дъски, гребла, спасителни жилетки и униформи
      - title: Програма за поддръжка
        description: Квартални комплекти за поддръжка, комплекти резервни части и обучение за ремонт
    cta_text: Създаване на премиум пакет
    cta_href: /contact
  - title: Пакет за училищен франчайз
    subtitle: За вериги с няколко обекта и оператори на франчайз
    badge: Enterprise
    features:
      - title: Стандартизация на флота
        description: Същото оборудване на всички локации за последователно изживяване на студентите
      - title: Централизирано поръчване
        description: Консолидирани поръчки, цени на едро и централизирано управление на резервни части
      - title: Обучение на инструктори
        description: Сертификация за работа с оборудване и поддръжка за всички инструктори
      - title: Съвместно брандиране
        description: Съвместно брандиране с франчайз + Paddle Board Overstock опции за сътрудничество в брандирането
      - title: Подкрепа за разширяване
        description: Консултации за разрастване, прогнозиране на оборудване и настройка на нови локации
    cta_text: Обсъждане на франчайз план
    cta_href: /contact
benefits:
  - title: Създадено за ежедневни уроци
    description: По-дебели PVC и подсилени релси издържат на ежедневна употреба от студенти, падания върху пясък и каменисти терени.
    icon: tabler:shield
  - title: Стабилни учебни платформи
    description: По-широки корпуси и по-плоски рокери дават увереност на начинаещите. Инструкторите се концентрират върху обучението, а не върху оборудването.
    icon: tabler:scale
  - title: Лесно съхранение и транспорт
    description: Надуваемият дизайн се съхранява на малки пространства. Сгънати дъски се побират в стандартни багажници за мобилно обучение.
    icon: tabler:box-seam
  - title: Персонализирано брандиране
    description: Лога и цветове на училището на всяка дъска. Вашата марка, вашата идентичност — а не стандартно наето оборудване.
    icon: tabler:brush
content_segments:
  tagline: Профили на училища
  title: Образователни решения за водни спортове<br />По вид програма
  subtitle: Училища по гребане, сърф академии, университетски програми и франчайз оператори се сблъскват с различни оперативни предизвикателства — от интеграция на учебната програма до стандартизация на флота на няколко локации. Ние конфигурираме пакети с оборудване, съобразени с образователния модел.
  items:
    - title: Независими SUP и училища по каяк
      subtitle: Тренировъчни центрове, управлявани от собственици
      description: Малки до средни училища, управлявани от инструктори-собственици, предлагат SUP уроци, обучение по каяк и сертификационни курсове. Оборудването трябва да бъде достатъчно издръжливо за ежедневна учебна употреба, достъпно за бюджет на малък бизнес и достатъчно универсално, за да обслужва начинаещи до студенти със средно ниво в един флот.
      features:
        - Стабилни универсални SUP дъски и развлекателни каяци за начинаещи
        - Дъски за инструктори с допълнителна стабилност за обучение от водата
        - Включени шаблони за учебни планове и ръководства за прогресия на уменията
        - Годишна програма за обновяване на оборудването с отстъпки при замяна
    - title: Програми за отдих в университети и колежи
      subtitle: Големи флотилии за студентски развлекателни дейности
      description: Университетските отдели за отдих, които управляват клубове по гребане, програми за наемане и учебни курсове като част от предлаганите услуги за отдих в кампуса. Оборудването достига пиково използване през семестрите, изисква лесни системи за записване/връщане и трябва да издържа на разнообразни нива на умения от студенти за първи път до напреднали гребци.
      features:
        - Високоустойчива PVC конструкция, оценена за цикли на институционална употреба
        - Флотилии с цветово кодиране по ниво на умения за лесно управление
        - Съвместимост на система за проследяване на инвентара чрез RFID или стикери
        - Обемни цени с поръчки и условия за плащане на семестриална основа
    - title: Училища по сърф и академии по сърф
      subtitle: Програми за обучение по сърфинг на крайбрежието
      description: Училища по сърф, които преподават умения по SUP сърф, гребане в легнало положение и сърф каяк в океански условия. Екипировката трябва да издържа на условията в зоната на вълните — устойчивост на удари, поносимост на пясък и солена вода, и лесно изплакване и връщане между часовите уроци.
      features:
        - Форми, специално за сърф, с подсилени ръбове и удароустойчива конструкция
        - Меки плавници и навити каишки за безопасността на учениците
        - Тъкан с бързо изплакване, която изсъхва между смяната на уроците
        - Програма за подмяна на флота с инспекция и освежаване в края на сезона
    - title: Франчайз и вериги с множество обекти
      subtitle: Стандартизирано оборудване на различни локации
      description: Оператори с множество локации, които провеждат стандартизирани обучителни програми в няколко града или региона. Последователността на флота във всички локации е от първостепенно значение — всеки ученик трябва да има една и съща опитност с оборудването, независимо на коя франчайз локация се намира. Централизираното поръчване, брандираната униформеност и подкрепата за разширяване са съществени.
      features:
        - Идентични спецификации на автопарка във всички франчайз локации
        - Централизирано консолидирано поръчване с обемно ценообразуване
        - 'Възможности за съвместно брандиране: франчайз бранд + Paddle Board Overstock съвместен бранд'
        - 'Комплект за настройка на ново място: оборудване, знаци и начален инвентар'
