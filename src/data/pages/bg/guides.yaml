hero:
  tagline: Ръководства
  title: Нов в SUP?
  subtitle: Практически ръководства, които да ви помогнат да изберете, използвате и се насладите на надуваемо оборудване за водни спортове.
size_guide:
  tagline: Размер & Спецификации
  title: Намерете подходящия размер за вашите нужди
  desc: Сравнете размерите на продуктите, капацитета им за тегло и препоръчителното им предназначение. Независимо дали имате нужда от туристически SUP, компактен каяк или търговски RIB — нашето ръководство за размери ще ви помогне да изберете правилния.
  link_label: Пълно ръководство с продуктови спецификации →
  link: /size-guide
  cards:
    - title: SUP Дъски
      desc: Изберете дължината според вашето тегло и предназначение. По-широките дъски (32"+) предлагат по-голяма стабилност. По-дългите дъски (11–12 фута) се движат по-добре при туризъм.
    - title: Каяци
      desc: Единични каяци (9 фута) за пътувания на един човек и реки. Двойни каяци (12 фута) за двама гребци или един с екипировка. Винаги проверявайте капацитета за тегло.
    - title: Дингита & RIBs
      desc: Изберете дължината според броя на пътниците и предназначението. По-големи RIBs (4.5 м+) за морски условия и спасяване. По-малки дингита (2.7 м) като помощни лодки и платформи за риболов.
