hero:
  tagline: Ръководства
  title: Нов в SUP?
  subtitle: Практически ръководства, които да ви помогнат да изберете, използвате и се насладите на надуваемо оборудване за водни спортове.
size_guide:
  tagline: Размер & Спецификации
  title: Намерете подходящия размер за вашите нужди
  desc: Сравнете размерите на дъските, капацитета на теглото и препоръчителните приложения. Независимо дали искате стабилна универсална дъска или по-бърза туристическа форма — нашето ръководство за размерите ще ви помогне да изберете правилния вариант.
  link_label: Пълно ръководство с продуктови спецификации →
  link: /size-guide
  cards:
    - title: Всестранни SUP платки
      desc: Нашите дъски с дължина около 11 фута (32" широки) съчетават стабилност, скорост и капацитет. Ядрото с дебелина 6 инча drop-stitch при 15 PSI поддържа палубата твърда за гребци на всяко ниво.
    - title: Ширина и стабилност
      desc: Широките дъски (32"+) предлагат повече стабилност за начинаещи, йога и риболов. Дебелината от 6 инча добавя твърдост и товароносимост за сърфиста и екипировката му.
    - title: Пакети и аксесоари
      desc: Всяка дъска се доставя като пълен комплект — дъска, туристическа раница, ръчна помпа, регулируемо гребло, подвижно перо, каишка с бримка и комплект за ремонт. Проверете максималното натоварване за ездача плюс екипировката.
