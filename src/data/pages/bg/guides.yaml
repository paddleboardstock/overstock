hero:
  tagline: Guides
  title: New to SUP?
  subtitle: Practical guides to help you choose, use, and enjoy inflatable water sports equipment.

size_guide:
  tagline: Size & Specs
  title: Find the Right Size for Your Needs
  desc: Compare board dimensions, weight capacities, and recommended uses. Whether you want a stable all-around board or a faster touring shape — our size guide helps you choose the right fit.
  link_label: 'Full size guide with product specs →'
  link: /size-guide
  cards:
    - title: All-Around SUP Boards
      desc: Our ~11 ft boards (32" wide) balance stability, speed, and capacity. The 6-inch drop-stitch core at 15 PSI keeps the deck rigid for paddlers of every level.
    - title: Width & Stability
      desc: Wider boards (32"+) offer more stability for beginners, yoga, and fishing. 6-inch thickness adds rigidity and weight capacity for rider plus gear.
    - title: Packages & Accessories
      desc: Every board ships as a complete package — board, travel backpack, hand pump, adjustable paddle, removable fin, coil leash, and repair kit. Check max load for rider plus gear.
