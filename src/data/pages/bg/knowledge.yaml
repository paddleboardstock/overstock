hero:
  tagline: Графика на знанието
  title: Знания за изследване на водата
  subtitle: |
    Структурирана база от знания, обхващаща технологията на надуваемите SUP,<br />
    водна безопасност, инженеринг на бордовете и планиране на приключения.
  taglineSection: Изследвай. Научи. Действай с увереност.
clusters:
  tagline: Клъстъри на знанията
  title: Разгледайте по тема
  subtitle: Задълбочени анализи на технологиите, безопасността и уменията зад всеки Paddle Board Overstock продукт.
  items:
    - title: SUP Знание
      description: От избора на първата ти дъска до напреднали техники за туринг — всичко за стандъп падъл бординга.
      icon: tabler:lifebuoy
      topics:
        - Как да изберете първия си надуваем SUP
        - Най-добрият размер SUP за начинаещи
        - Колко труден е падъл бордингът?
        - Сравнение между надуваеми и твърди дъски
        - Списък за безопасност SUP
    - title: Технология на борда
      description: Технически задълбочени анализи на drop-stitch ядра, PVC ламинирани повърхности, ръбове и клапани — как се проектират надуваемите SUPs.
      icon: tabler:anchor
      topics:
        - Как се произвеждат надуваемите SUPs
        - Обяснение на слоевете на PVC ламинат
        - Конструкция на ръбове и шевове
        - Дълбок анализ на технологията Drop-stitch
        - Обяснение на декора на EVA
    - title: Знания за безопасност
      description: Основни знания за безопасност за всеки гребец — от избора на PFD до четене на метеорологичните условия и техники за самоспасяване.
      icon: tabler:shield
      topics:
        - Списък за безопасност SUP
        - Имаш нужда от спасителна жилетка?
        - Наръчник за безопасно гребане в океана
        - Безопасност при реки и течения за гребци
        - Осъзнаване на метеорологичните и водните условия
    - title: Технологии
      description: Инженерингът зад продуктите Paddle Board Overstock — материали, методи на конструкция и тестове за качество.
      icon: tabler:microscope
      topics:
        - Технология PVC за морски условия
        - Обяснение на сърцевината на Drop-stitch
        - Защо PSI е важно за надуваеми устройства SUPs
        - RF заваряване срещу лепилно свързване
        - Тестване на качеството на всяка дъска
    - title: Знания за клуб и наем
      description: Практически ръководства за управление на програма SUP — от операции с наем до автопаркове на курорти и клубове.
      icon: tabler:briefcase
      topics:
        - Как да започнете SUP бизнес с наеми
        - Изграждане на курортен воден спортен център
        - Размери на флота за дъски за клубове
        - Надуваеми срещу твърди SUP за търговска употреба
        - Най-добрите дъски SUP за автопаркове за наем
        - Стратегии за приходи от водни спортове на курорти
        - Ръководство за поддръжка на търговско оборудване
