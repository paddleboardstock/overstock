hero:
  tagline: Филипини
  title: SUP Едрови платки за<br />Филипински бизнеси
  subtitle: Островни курорти, плажни клубове и оператори на гребла от Ел Нидо и Сиаргао до Боракай — чисто нови излишни бордове от 5 броя, смесени модели, доставени от Китай.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Излишни SUP бордове за курорти и оператори на гребла на филипинските острови
direct_answer: Paddle Board Overstock доставя чисто нови надуваеми дъски с излишък SUP на филипински бизнеси — островни курорти в Палаван и Сиаргао, плажни клубове в Боракай и Себу, оператори за наем и тур, както и малки търговци на дребно. Поръчките на едро започват от 5 дъски с комбинирани модели в една пратка, изпратени от Вейхай, Китай чрез експресен въздушен товар или консолидиран морски транспорт. Всяка дъска е 100% тествана под налягане и е покрита с 2-годишната SUP гаранция.
tldr_points:
  - Търговия на едро от 5 дъски — смесени модели, оценени според общото количество
  - Обслужване на островни курорти и плажни клубове из целия Филипински архипелаг
  - Експресен въздушен или консолидиран морски товар от Вейхай, Китай
  - 100% тестван под налягане, 2-годишна SUP гаранция на всяка платка
overview_section:
  tagline: Обзор на пазара
  title: SUP Филипинският пазар
  paragraphs:
    - С над седем хиляди острова, Филипините са създадени за гребане на място. Лагуните на Ел Нидо и Корон, спокойната сърф и островна сцена на Сиаргао, енергията на плажния клуб в Боракай и икономиката на гмуркане и водни спортове в Себу създават стабилно търсене — от туристи, които гребат на изгрев в варовикова лагуна, до местни SUP , които изграждат фитнес и йога общности в Манила и отвъд.
    - The buyers are typically resort and tour operators: островни курорти, които добавят дейност за гости, която не изисква гориво, двигател и лиценз; туроператори, обикалящи острови, разширяват офертата си; и малки магазини, обслужващи местната гребна общност. Поръчките са малки — 5–20 дъски — и се смесват между стабилни универсални дъски за начинаещи и няколко премиум издания за визията на курорта.
  customer_types:
    - title: Островни курорти
      description: Курортите Palawan, Siargao и Boracay добавят SUP гостоприемни програми с компактни смесени автопаркове.
    - title: Туроператори
      description: Операторите на турове по острови и лагуни добавят спирки за гребане към своите маршрути.
    - title: Местни магазини и училища
      description: Градски училища и магазини, обслужващи нарастващата филипинска общност по гребане и SUP йога.
shipping_section:
  title: Кораб до Филипините
  paragraphs:
    - Поръчките се изпращат от Вейхай, Китай. Експресният въздушен товар пренася мостри и 1–3 бордови поръчки бързо до Манила и Себу; консолидирани морски товари обслужват 5–20 бордови поръчки на едро през Манила и други филипински пристанища. Оценките за транзит за вашата дестинация — метро Манила или провинциално — са включени във вашата оферта.
    - Ние предоставяме търговската фактура и списъка за опаковане, необходими за одобрение на списъка, с коректни HS кодове и декларирани стойности. Вносните мита и данъци се плащат от вносителя според филипинските правила.
  customs_note: За провинциални дестинации крайната доставка от пристанището или летището се цитира като част от офертата от врата до врата. Потвърдете текущото вносно мито за спортно оборудване с вашия брокер; ние предоставяме пълна документация.
faq_section:
  title: Често задавани въпроси за Филипините
  items:
    - q: Колко време отнема доставката до Филипините?
      a: Зависи от метода. Експресният въздушен товар до Манила или Себу е най-бързият вариант за мостри и 1–3 поръчки на борда; консолидирани морски товари покриват поръчки на едро от 5 до 20 борда и се оферира с транзитен прозорец за вашето пристанище. И двете оценки са изброени в вашата оферта преди да се ангажирате.
    - q: Могат ли бордовете да достигнат до провинциални острови като Палаван или Сиаргао?
      a: Да — доставка от врата до врата до провинциални дестинации се цитира като част от превозната оценка, използвайки последваща вътрешна логистика от пристанището или летището на пристигане. Обърнете внимание на оценката и опциите във вашето запитване и ние ще го ценообразуваме конкретно.
    - q: Как изглежда началният флот на курорт?
      a: 'Обикновено 5–10 дъски: стабилни универсални модели за уроци за гости и свободно гребане, плюс една или две премиум художествени версии за плажната ивица. Смесени модели, една пратка, ценообразуване по общо количество.'
    - q: Подходящи ли са дъските за лагунно и рифово използване?
      a: Да — спокойни, плитки, топли води са точно това, за което са проектирани всички универсални надуваеми SUP дъски, а гъвкавото перо и издръжливата конструкция drop-stitch се справят добре с рифови и плажни приземявания.
