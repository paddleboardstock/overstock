hero:
  tagline: Paddle Board Overstock Академия
  title: Център за обучение
  subtitle: Ръководства и уроци за всяко ниво на умения — от SUP основи до напреднали техники за спасяване
categories:
  - level: Начинаещ
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Основи
        desc: Научете основите на стоящото гребане с падъл — стойка, техника на гребането и баланс.
        slug: beginner-sup-guide
      - title: Техники на гребане
        desc: Напредък, обхватно гребане, странично гребане и ниска защита — усвоете основните движения с падъл.
        slug: sup-paddle-guide
      - title: Безопасност на първо място
        desc: Основни практики за безопасност, включително проверка на времето, PFD използване, правила за каишка и самоспасяване.
        slug: sup-safety-guide
  - level: Междинен
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Основи на туризма
        desc: Планиране на многочасови гребания — навигация, хидратация, темпо и четене на прогнози за вятър.
        slug: touring-sup-guide
      - title: Четене на времето
        desc: Интерпретиране на морски прогнози, идентифициране на облачни модели и разбиране на влиянието на вятъра върху водата.
        slug: weather-planning-water-sports
      - title: Навигационни основи
        desc: Четене на карти, използване на компас, GPS точки и планиране на маршрут за прибрежно гребане.
        slug: sup-navigation-guide
      - title: Осъзнаване на приливи и отливи
        desc: Разбиране на цикъла на приливите, теченията и как те влияят на времето за тръгване и маршрути.
        slug: understanding-tides
  - level: Разширено
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Планиране на многодневни пътувания
        desc: Логистика на експедиции — избор на екипировка, планиране на храна, протоколи за безопасност и контакти за спешни случаи.
        slug: sup-travel-guide
      - title: Техники за спасяване
        desc: Протоколи за самоспасяване, Т-спасяване и теглене в открити води.
        slug: sup-self-rescue
      - title: Нощно гребане
        desc: Навигация след тъмно — изисквания за осветление, запаметяване на маршрута, комуникация в групата и осъзнаване на опасности.
        slug: sup-navigation-guide
  - level: Поддръжка
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Почистване и поддръжка
        desc: Изплакване със сладка вода, UV защита, предотвратяване на мухъл и правилни техники за сушене след всяка сесия.
        slug: inflatable-sup-maintenance
      - title: Ръководство за съхранение
        desc: Най-добри практики за съхранение на надуваеми дъски — изпразване на въздуха, сгъване, контрол на температурата и срок на годност.
        slug: inflatable-sup-storage
      - title: Основи на ремонта
        desc: Поправете малки пробиви, течове по шевовете и проблеми с клапаните с PVC комплекти за ремонт и техники за лепене.
        slug: inflatable-sup-repair
      - title: Поддръжка на клапани
        desc: Идентифицирайте типовете клапани (Halkey-Roberts, Boston, Leafield), почиствайте отломки и подменяйте дефектни стъбла.
        slug: inflatable-sup-repair
knowledge_center_tagline: Център за знания
knowledge_center_title: Ръководства и знания за падъл борд
knowledge_center_subtitle: Експертни ръководства и съвети за покупка за хора, каращи падъл борд на всяко ниво.
knowledge_sections:
  - title: Технология и строителство на плочи
    tagline: Вътре във вашата падъл дъска
    desc: Как се изграждат надуваемите падъл бордове — drop-stitch сърцевини, слоеве ламиниране, EVA палуби и фабрично налягане тестване.
    guides:
      - title: Как се правят падъл бордове
        desc: От рязане и ламиниране на материалите до 100% тест за налягане — вижте как всяка дъска напуска фабриката.
        href: /factory/process
      - title: Drop-Stitch Core технология
        desc: Как хиляди вътрешни нишки създават твърда, високо налягане надуваема структура.
        href: /learn/drop-stitch-core
      - title: Справочник за материали
        desc: PVC рейтинги на дение, тегла на тъканите, UV устойчивост и обяснение на материалите за палубата.
        href: /learn/materials
      - title: Технология за надуваеми дъски
        desc: Заварени шевове, строителство на релси и клапанни системи, които поддържат борда ви твърд и херметичен.
        href: /learn/inflatable-technology
  - title: Ръководства за закупуване
    tagline: Изберете правилната дъска
    desc: Всичко, от което се нуждаете, за да изберете първия си — или следващия — надуваем SUP, от размерите до конструкцията.
    guides:
      - title: Как да изберете надуваема SUP
        desc: Ключовите фактори — конструкция, дебелина, конфигурация на плавниците и включени аксесоари.
        href: /guides/how-to-choose-your-sup/
      - title: Какво е падълбординг на стойка?
        desc: Приятно въведение в спорта, оборудването и защо надуваемите дъски улесняват започването.
        href: /guides/what-is-sup
      - title: Надуваема срещу твърда дъска
        desc: Сравнете iSUP и твърди епоксидни бордове по отношение на преносимост, издръжливост, производителност и стойност.
        href: /compare/inflatable-vs-hardboard
      - title: SUP Ръководство за размери
        desc: Намерете правилната дължина, ширина и обем на дъската за вашето тегло, умения и стил на гребане.
        href: /size-guide
  - title: Умения и безопасност
    tagline: Гребете с увереност
    desc: Практически знания за всяка сесия — основи за начинаещи, безопасност във водата, грижа и ремонт.
    guides:
      - title: SUP Основи — Ръководство за начинаещи
        desc: Всичко, което един начинаещ трябва да знае — видове дъски, размер на греблото, стойка и съвети за първия ден.
        href: /v2/beginner-sup-guide
      - title: Основи на водната безопасност
        desc: Проверка на времето, избор на PFD, правила за повод, самопомощ и най-добри практики при групово гребане.
        href: /learn/water-safety
      - title: Поддръжка и грижи SUP
        desc: Почистване, съхранение, защита на UV и съвети за грижа за надуваеми SUP бордове.
        href: /v2/inflatable-sup-maintenance
      - title: Основи на ремонта на бордове
        desc: Поправете малки пробиви, течове по шевовете и проблеми с клапаните с PVC комплекти за ремонт и техники за лепене.
        href: /v2/inflatable-sup-repair
