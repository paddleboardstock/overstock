hero:
  tagline: Aquafarer Академия
  title: Център за обучение
  subtitle: Ръководства и уроци за всяко ниво на умения — от SUP основи до напреднали техники за спасяване
categories:
  - level: Начинаещ
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Основи
        desc: Научете основите на стоящото гребане с падъл — стойка, техника на гребането и баланс.
        slug: beginner-sup-guide
      - title: Техники на гребане
        desc: Напредък, обхватно гребане, странично гребане и ниска защита — усвоете основните движения с падъл.
        slug: sup-paddle-guide
      - title: Безопасност на първо място
        desc: Основни практики за безопасност, включително проверка на времето, PFD използване, правила за каишка и самоспасяване.
        slug: sup-safety-guide
  - level: Междинен
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Основи на туризма
        desc: Планиране на многочасови гребания — навигация, хидратация, темпо и четене на прогнози за вятър.
        slug: touring-sup-guide
      - title: Четене на времето
        desc: Интерпретиране на морски прогнози, идентифициране на облачни модели и разбиране на влиянието на вятъра върху водата.
        slug: weather-planning-water-sports
      - title: Навигационни основи
        desc: Четене на карти, използване на компас, GPS точки и планиране на маршрут за прибрежно гребане.
        slug: sup-navigation-guide
      - title: Осъзнаване на приливи и отливи
        desc: Разбиране на цикъла на приливите, теченията и как те влияят на времето за тръгване и маршрути.
        slug: understanding-tides
  - level: Разширено
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Планиране на многодневни пътувания
        desc: Логистика на експедиции — избор на екипировка, планиране на храна, протоколи за безопасност и контакти за спешни случаи.
        slug: sup-travel-guide
      - title: Техники за спасяване
        desc: Самоспасяване, T-спасяване, ескимоско спасяване за каяци и протоколи за теглене на открита вода.
        slug: sup-self-rescue
      - title: Нощно гребане
        desc: Навигация след тъмно — изисквания за осветление, запаметяване на маршрута, комуникация в групата и осъзнаване на опасности.
        slug: sup-navigation-guide
  - level: Поддръжка
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Почистване и поддръжка
        desc: Изплакване със сладка вода, UV защита, предотвратяване на мухъл и правилни техники за сушене след всяка сесия.
        slug: inflatable-sup-maintenance
      - title: Ръководство за съхранение
        desc: Най-добри практики за съхранение на надуваеми дъски и лодки — изпразване от въздух, сгъване, контрол на температурата и срок на годност.
        slug: inflatable-sup-storage
      - title: Основи на ремонта
        desc: Поправете малки пробиви, течове по шевовете и проблеми с клапаните с PVC комплекти за ремонт и техники за лепене.
        slug: inflatable-sup-repair
      - title: Поддръжка на клапани
        desc: Идентифицирайте типовете клапани (Halkey-Roberts, Boston, Leafield), почиствайте отломки и подменяйте дефектни стъбла.
        slug: inflatable-sup-repair
knowledge_center_tagline: Център за знания
knowledge_center_title: Морско оборудване и индустриални ръководства
knowledge_center_subtitle: Експертни знания и ръководства за покупка за морски професионалисти, оператори на флоти и любители на водни спортове.
knowledge_sections:
  - title: RIB Морски знания
    tagline: Ръководства за твърдо-надуваеми лодки
    desc: Всичко за RIB лодки — дизайн на корпуса, материали, избор на двигател, поддръжка и съвети за покупка за търговска и развлекателна употреба.
    guides:
      - title: Как да изберем правилната RIB лодка
        desc: Пълно ръководство за избора на RIB — размер, мощност на двигателя, материал на тръбите, тип корпус и предназначение.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB срещу надуваема лодка
        desc: Твърдо-надуваеми лодки срещу традиционна надуваема лодка — сравнение на дизайн на корпуса, производителност, издържливост и вместимост.
        href: /compare/rib-vs-dinghy
      - title: Търговски RIB срещу развлекателен RIB
        desc: Търговски срещу развлекателни RIB лодки — стандарти за конструкция, материали, живот на продукта, цена и сертификации.
        href: /compare/commercial-vs-recreational-rib
      - title: Алуминиев срещу фибростъклов корпус
        desc: Сравнение между алуминиеви и фибростъклови корпуси за RIB лодки по отношение на тегло, разходи, издръжливост и устойчивост на корозия.
        href: /compare/aluminum-vs-fiberglass
  - title: Ръководство за надуваеми лодки
    tagline: Знания за надуваеми плавателни съдове
    desc: Комплексни ръководства за надуваеми лодки — PVC срещу Hypalon, методи на конструкция, стандарти за безопасност и най-добри практики за поддръжка.
    guides:
      - title: PVC срещу Hypalon Материално ръководство
        desc: Окончателно сравнение между PVC и Hypalon CSM за конструкция на надуваеми лодки.
        href: /compare/pvc-vs-hypalon
      - title: Как се правят надуваемите лодки
        desc: Процес на производство — рязане на материали, ВЧ заваряване, конструкция на шевове, тест за налягане и контрол на качеството.
        href: /learn/inflatable-technology
      - title: Ръководство за безопасност на надуваеми лодки
        desc: Стандарти за безопасност, товароносимост, правилно надуване, проверки преди отпътуване и аварийни процедури.
        href: /learn/water-safety
      - title: Поддръжка на надуваеми лодки
        desc: Почистване, съхранение, защита на UV, зимуване и ремонт на надуваеми лодки и RIBs.
        href: /v2/inflatable-boat-maintenance
  - title: Знания за лодки
    tagline: Надуваеми лодки & RIB Хъб
    desc: Технически ръководства, обхващащи видове надуваеми лодки, материали, методи на конструиране, поддръжка и безопасност — от дингита до RIBs.
    guides:
      - title: Видове надуваеми лодки
        desc: Дингита, RIBs, каяци и помощни лодки — научете разликите и изберете правилната.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch Технология
        desc: Как хиляди вътрешни нишки създават твърди, високонапорни надуваеми структури.
        href: /learn/drop-stitch-core
      - title: Справочник за материали
        desc: Рейтинг на дение PVC, тегло на плат, устойчивост на UV и материали с морски клас, обяснени.
        href: /learn/materials
      - title: RIB срещу лодка
        desc: Сравнете твърди надуваеми лодки с традиционните надуваеми дингита за различни цели.
        href: /compare/rib-vs-dinghy
  - title: SUP Знание
    tagline: Ръководства за стоящи на гребло бордове
    desc: Всичко за SUP бордове — надуваеми срещу твърди, размери на борда, технологични материали и експертни съвети за всички нива на умения.
    guides:
      - title: Надуваеми срещу твърди SUP
        desc: Сравнете iSUP и твърди епоксидни бордове по отношение на преносимост, издръжливост, производителност и стойност.
        href: /learn/sup
      - title: Ръководство за размери на SUP борд
        desc: Как дължината, ширината и дебелината влияят на стабилността, скоростта и маневреността.
        href: /learn/sup
      - title: Поддръжка и грижи SUP
        desc: Съвети за почистване, съхранение, защита от UV и ремонт за надуваеми SUP бордове.
        href: /v2/inflatable-sup-maintenance
      - title: Избор на първи SUP
        desc: Ръководство за начинаещи за избор на подходящ стоящ на гребло борд според вашето тегло, ниво на умения и предназначение.
        href: /learn/sup
  - title: Ръководство за водолазно оборудване
    tagline: Знания за търговски водолазни лодки
    desc: Специализирани ръководства за водолазни лодки, водолазни RIBs и оборудване за водолазни центрове, оператори на водолазни услуги и търговски водолазни екипи.
    guides:
      - title: Най-добрата RIB лодка за водолазни центрове
        desc: Как да изберете правилната водолазна RIB за вашия водолазен център — капацитет, конфигурация и бюджетни съображения.
        href: /solutions-diving-center-boats
      - title: Ръководство за конфигурация на водолазна RIB
        desc: Основни функции за водолазна RIBs — стойки за бутилки, стъпаловидни системи, платформа за водолази и съхранение на оборудване.
        href: /solutions-diving-center-boats
  - title: Ръководство за помощни лодки за яхти
    tagline: Решения за Суперяхти и Морски Тендери
    desc: Ръководства за избор на перфектен яхтен тендер — надуваеми тендери, RIB тендери, решения за съхранение и аксесоари за тендери.
    guides:
      - title: Как да изберете яхтен тендер
        desc: Фактори, които трябва да се вземат предвид при избора на тендер за вашата яхта — размер, материал, двигател и съхранение.
        href: /solutions-yacht-tender-solutions
      - title: Надуваеми срещу RIB Тендери
        desc: Сравнете надуваемите лодки-тендери с твърдонадуваемите лодки за производителност, издръжливост и възможности за съхранение.
        href: /compare/rib-vs-dinghy
  - title: Ръководство за спасително оборудване
    tagline: Знания за спасителни водни плавателни съдове
    desc: Професионални ръководства за спасителни лодки, SAR водни съдове и оборудване за спешни ситуации за брегова охрана, спасители и екипи за бедствия.
    guides:
      - title: Ръководство за избор на SAR лодка
        desc: Как да изберете правилната спасителна и издирвателна лодка — скорост, капацитет, издръжливост и изисквания за специализирано оборудване.
        href: /solutions-rescue-watercraft
      - title: Комерсиални RIB за спасителни операции
        desc: Защо комерсиалните RIBs са предпочитаният избор за професионални екипи за издирване и спасяване по целия свят.
        href: /use-cases/search-and-rescue
