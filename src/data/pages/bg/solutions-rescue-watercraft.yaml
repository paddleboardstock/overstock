content_challenge:
  tagline: Предизвикателството
  title: Операциите по спасяване изискват<br />Безкомпромисна надеждност
  subtitle: Организациите за търсене и спасяване действат при крайна отговорност за безопасност — всяка повреда на лодка носи неприемливи последствия.
  paragraphs:
    - При спасителни операции границата между успех и провал се измерва в минути. Лодката трябва да е готова за незабавно пускане, да оперира при лоши условия и да се връща безопасно с пътниците. Отговорността за безопасността е абсолютна — механична повреда по време на спасителна мисия не е разход за ремонт, а изгубен живот.
    - SAR лодките се нуждаят от висока скорост за бързо достигане до жертвите, комбинирана с изключителна стабилност за безопасни операции по възстановяване. Те трябва да разполагат с спасително оборудване, медицински принадлежности и комуникационна техника — често на ограничено пространство на палубата. Лодките, опериращи в държавна служба, също се нуждаят от дълъг експлоатационен живот (10-15+ години), за да оправдаят бюджетите за обществени поръчки.
    - Визуалната видимост, както за оператора, така и при търсенето, е критична. Конзолната конструкция трябва да осигурява 360-градусова видимост, а лодката трябва да бъде високо видима за въздушни средства и други съдове.
    - Paddle Board Overstock спасителните RIBs са проектирани от кила нагоре за тези изисквания — с автоматично отводняващи се палуби, подсилени корпуса, навигационни комплекти и стандартни куки за теглене на патрулните модели.
content_solution:
  tagline: Нашето решение
  title: Специално Проектирани Спасителни RIBs
  subtitle: Всяка Paddle Board Overstock спасителна лодка е проектирана да отговаря или да надвишава SOLAS и националните SAR стандарти.
  list:
    - Самоотводняваща палуба — водата се оттича автоматично за стабилност по време на операции по възстановяване
    - Подсилен дълбок-V корпус — възможност за работа при бурни води с предсказуемо управление при скорост
    - Пълен навигационен комплект осветление — работа ден и нощ при всякакви метеорологични условия
    - Кука за теглене и влекача — готови за теглене на съд или спасителна шейна
    - Пласти за монтиране на оборудване — радио, прожектор, сирена и медицинско оборудване
    - Множество конфигурации на двигателя — един външен двигател или двойна излишност на двигателя
    - Цветове на тръбите с висока видимост — оранжево, жълто или червено за максимална видимост
content_segments:
  tagline: Профили на спасителните лодки
  title: Решения за водни съдове за търсене и спасяване<br />По тип на организация
  subtitle: Различните спасителни организации оперират при различни мандати, бюджетни цикли и оперативни среди — от крайбрежни доброволчески екипи до национални флоти на бреговата охрана. Настройваме всяка спасителна RIB според профила на мисията.
  items:
    - title: Брегова охрана и държавни SAR агенции
      subtitle: Абсолютна отговорност за безопасност — стандарти за флота, критичен за мисията
      description: Държавните SAR агенции носят най-висока отговорност за безопасност в морските операции. Всяка лодка трябва да работи безупречно при екстремни условия — повреда на оборудването по време на спасителна мисия не е опция. Решенията за снабдяване се определят от общата цена на собственост над 10-15 години експлоатационен живот, а не от предварителна цена. Агенциите се нуждаят от плавателни съдове, които издържат години на крайбрежно патрулиране, отговарят на строги национални стандарти и осигуряват постоянна производителност между разпределените станции. Задължителни са изчерпателна документация за съответствие и многогодишни договори за обслужване.
      features:
        - SOLAS и национален пакет документация за съответствие със стандартите за SAR
        - Обща характеристика на частите в целия флот — намаляване на сложността на инвентара на ниво станция
        - Конфигурация на двудвигателни двигатели за критична излишност при мисията
        - Проектиране на експлоатационен живот за 10-15 години с планови програми за поддръжка
        - Способност за всепогодни условия — подсилен корпус с дълбока V форма за бурни морски условия
    - title: Спасителни и плажни спасителни служби
      subtitle: Бързи изстрелвания, операции в плитки води
      description: Общинските и крайбрежните спасителни служби се нуждаят от бързи кораби, които могат да се изстрелват през зони на вълни, да оперират в плитки крайбрежни води и да достигнат плувци или бедни плавателни съдове за минути. Оборудването трябва да е достатъчно леко за теглене на плажа с малко превозно средство или ръчно.
      features:
        - Корпус с плитко RIB газене за зона на вълна и крайбрежна експлоатация
        - С възможност за излизане от плажа с дръжка за повдигане на носа и защита на кила
        - Интегрирана спасителна шейна или платформа за спасителни плувци
        - Стандартни оранжеви или жълти оранжеви или жълти цветове на тръбите с висока видимост
    - title: Пожарни спасителни служби
      subtitle: Интеграция на пожарна помпа, монтаж на оборудване, бърза реакция
      description: Морските пожарни спасителни части реагират на пожари по крайбрежни сгради, пожари по плавателни съдове и инциденти при водно спасяване. Тези лодки трябва да носят пожарни помпи, монитори, маркучи за съхранение и дихателни апарати — всичко това интегрирано в стабилна, бърза платформа. Отделите използват тези съдове и за операции по реакция при наводнения и взаимопомощ. Конзолните разположения трябва да включват контрол на помпи, радиосистеми и аварийно осветление, без да се компрометира палубното пространство за движение на екипажа.
      features:
        - Монтиран на носа пожарен монитор с пакет за интеграция на помпи
        - Специално оборудване за монтиране на пожарни помпи, маркучи и BA комплекти
        - Конзолното разпределение може да се конфигурира за контрол на помпи, радио и аварийно осветление
        - Самоизпускаща се палуба за оттичане на вода и стабилност на пожарогасене
        - 'Пакет за нощни операции: прожектор, осветление на сцената, синьо/червена лента'
    - title: Морска полиция и пристанищна охрана
      subtitle: Операции по пресичане, патрулиране, абордаж
      description: Морските правоохранителни звена се нуждаят от съдове, способни на преследване с висока скорост, абордаж на подозрителни съдове и охрана на пристанищните патрули. Тези лодки трябва да имат сигурно съхранение на оборудване и оръжия за прилагане, комуникационна интеграция с командването на брега и достатъчно място на палубата за операции на екипите за абордаж. Възможностите за нощни операции и нископрофилният подход са от съществено значение за мисии по пресичане.
      features:
        - Възможност за преследване на висока скорост — планиране на корпуса с+ максимална скорост 40 възела
        - Обезопасени оръжейния шкаф и отделенията за съхранение на екипировка
        - Конзолна интеграция за полицейски радиостанции, MDT и комуникационни системи
        - 'Пакет за нощни операции: IR прожектор, FLIR монтаж, тайно осветление'
        - Подсилена платформа за качване с неплъзгаща се повърхност
        - Синьо/червено аварийно осветление и сирена
    - title: Доброволчески спасителни дейности и неправителствени организации
      subtitle: Финансирани с грантове, базирани в общността крайбрежни и езерни операции
      description: Спасителни групи, базирани в общността, работят в езера, реки и крайбрежни райони, където държавното SAR покритие е ограничено. Често финансирани чрез дарения или държавни грантове, тези организации се нуждаят от максимални възможности на долар — надежден, нископоддържащ съд, който доброволците могат да управляват безопасно с минимално специализирано обучение. Циклите на набиране на грантове означават, че лодките трябва да отговарят на изискванията за съответствие, като същевременно се придържат към фиксирани бюджети.
      features:
        - Конфигурация с един извънбордов двигател, оптимизирана за по-ниски разходи за придобиване и експлоатация
        - PVC Строителство за по-ниска поддръжка и лесен ремонт на терен
        - Многофункционална конзола, минимизираща електронната сложност за доброволните оператори
        - Пакет документация за съответствие с грантове за заявления за финансиране
        - Лек дизайн за спускане на вода на плажа без специален ремарке или кран
    - title: Спасителна служба при наводнения и реакция при бедствия
      subtitle: Вътрешни наводнения, плитка вода, среди, пълни с отломки
      description: Спасяването при наводнения е отличителен оперативен профил — лодките оперират в наводнени градски райони, течения, пълни с отломки, и изключително плитки води, където потопените препятствия са невидими. Операторите се нуждаят от плавателни съдове, които могат да се движат по наводнени улици, да пробиват отломки и да изваждат жертви от сгради и превозни средства. Способността за плитко газене е критична, както и способността да се оперират при течението с опасност от закачване. Тези лодки често се използват от пожарни служби, гражданска отбрана и неправителствени организации за помощ при бедствия.
      features:
        - Корпус с ултраплитко газене — работи при 30-50 см дълбочина
        - Нос, който отклонява отломки, и подсилена защита на тръбите за потопени препятствия
        - Самоизпускаща се палуба за оттичане на наводнение и възстановяване на жертви
        - Оранжеви или жълти тръби с висока видимост за въздушно разузнаване
        - Лек дизайн за транспорт с хеликоптери и разполагане по пътища
        - Подсилени повдигащи точки за спасителни операции с повдигане и въже
