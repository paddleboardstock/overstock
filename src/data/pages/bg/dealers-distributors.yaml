hero:
  tagline: Програма за дилъри
  title: Станете Paddle Board Overstock<br />Дистрибутор
  subtitle: Партнирайте с CE-сертифицирано RIB и производител на надуваеми водни плавателни средства, обслужващ 50+ страни. Защита на територията, маркетингова подкрепа и конкурентни цени за установени морски дистрибутори.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock програма за дилъри и дистрибутори
direct_answer: Paddle Board Overstock предлага дилърски и дистрибуторски партньорства с защита на територията, конкурентни цени на едро, комплекти за маркетингова подкрепа и пълна документация за съответствие (CE, ISO 9001, BSCI). MOQ започва от 10-20 единици на поръчка с посветено управление на акаунта.
