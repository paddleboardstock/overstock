content_benefits:
  tagline: Предимства на партньорството
  title: Защо дистрибутори<br />Изберете Paddle Board Overstock
  subtitle: Партньорство, предназначено за морски дистрибутори, които се нуждаят от надеждно снабдяване, конкурентни маржове и професионална подкрепа.
  items:
    - title: Защита на територия
      description: Ексклузивни или полуісклузивни териториални права за квалифицирани дистрибутори. Картиране на пазара и управление на конфликтите в каналите, за да защитите инвестицията си при изграждане на марката Paddle Board Overstock във вашия регион.
      icon: tabler:map-pin
    - title: Конкурентни цени на едро
      description: Ценова структура на слоеве въз основа на годишни обеми. Ценова структура, защитаваща маржа, с предварителни гаранции за цени и прозрачни разбивки на разходите (FOB база Циндао).
      icon: tabler:currency-dollar
    - title: Комплект за маркетингова подкрепа
      description: Професионална продуктова фотография, спецификации, шаблони за документация за съответствие, съдържание за социални мрежи и съвместни маркетингови материали. Актуализира се ежегодно с нови продуктови лансирания.
      icon: tabler:photo
    - title: Техническо обучение
      description: Обучение за продуктите за вашия търговски екип (виртуално или на място), обучение за поддръжка и ремонт за вашите сервизни техници, както и ръководства с често задавани въпроси и отстраняване на неизправности за клиентите.
      icon: tabler:school
    - title: Резервни части и следпродажбено обслужване
      description: Посветено снабдяване с резервни части с приоритетно изпращане. Налични са резервни секции на тръби, клапани, плавници и комплекти за ремонт за бързо изпълнение на поръчки. Подкрепа при обработка на гаранционни искове.
      icon: tabler:tool
    - title: Документация за съответствие
      description: 'Пълен пакет документация за съответствие за вашия пазар: CE DoC, данни от строителната плоча, ръководства за собствениците и подкрепа за регулаторна регистрация. Премахва вашето бреме по съответствие.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Какво търсим
  title: Дистрибутор<br />Изисквания
  subtitle: Търсим партньори, които могат професионално да представят и поддържат продуктите Paddle Board Overstock във тяхната територия.
  items:
    - title: Територия и познания за пазара
      description: Установено присъствие на морския пазар, пазара на водни спортове или на открито развлекателни дейности. Разбиране на местните регулации, потребителските предпочитания и каналите за дистрибуция на водни продукти.
      icon: tabler:target
    - title: Опит в индустрията
      description: Минимум 2 години опит в дистрибуция на морско, спортно или открито оборудване. Доказан опит с международни марки и B2B едро операции.
      icon: tabler:briefcase
    - title: Шоурум или склад
      description: Физическо помещение за показване на продукти, съхраняване на инвентар и обслужване на клиенти. Способност за поддържане на демонстрационни единици и запас от резервни части за вашата територия.
      icon: tabler:building-store
    - title: Ангажимент към стандартите на марката
      description: Готовност да поддържате стандартите за представяне на марката Paddle Board Overstock, да предоставяте клиентска поддръжка според нашите сервизни протоколи и да участвате в ежегодни обучения по продукти.
      icon: tabler:star
content_process:
  tagline: Процес на кандидатстване
  title: 4-стъпков дилър<br />Процес на кандидатстване
  subtitle: От първоначално запитване до първата доставка — ясен и опростен процес на въвеждане.
  steps:
    - number: '01'
      title: Първоначално запитване и квалификация
      description: Изпратете вашата кандидатура за дистрибутор с данни за компанията, интересуваната територия, текущи продуктови линии и годишни прогнози за обем. Преглеждаме в рамките на 5 работни дни.
      timeline: 5 дни
    - number: '02'
      title: Преглед на бизнеса и условията
      description: Виртуална среща за обсъждане на стратегията за територията, ценови нива и партньорски условия. Преглед на изискванията за съответствие с документация за вашия пазар. NDA подписване при нужда.
      timeline: 1-2 седмици
    - number: '03'
      title: Пробна поръчка и оценка
      description: Направете първоначална пробна поръчка (2-5 единици) на дистрибуторски цени за пазарна оценка и обучение на екипа. Включена пълна документация за съответствие и подготовка на демонстрациите.
      timeline: 30-45 дни
    - number: '04'
      title: Стартиране на партньорство и поддръжка
      description: Първа поръчка на контейнер с активирана защита на територията. Доставен маркетингов комплект, обучен търговски екип и назначен специален акаунт мениджър. Постоянни тримесечни прегледи на бизнеса.
      timeline: Продължава
content_application_docs:
  tagline: Документи за кандидатстване
  title: Необходими документи<br />за кандидатстване за дилър
  subtitle: За да кандидатствате за Paddle Board Overstock дилърство, моля, подгответе следните документи и информация за нашия екип за преглед.
  items:
    - title: Свидетелство за регистрация на бизнеса
      description: Валиден документ за регистрация на компанията, показващ името на юридическото лице, регистрирания адрес и обхвата на бизнеса, обхващащ дистрибуция на морско, спортно или открито оборудване.
      icon: tabler:file-text
    - title: План за покритие на територията
      description: Географска територия на интерес, съществуващи търговски или дистрибуционни мрежи, целеви клиентски сегменти и предложен годишен обем по продуктови категории (RIB, SUP, каяк).
      icon: tabler:map
    - title: Възможности за шоурум или склад
      description: Физическо съоръжение за изложба на продукти, съхранение на инвентар и обслужване на клиенти. Снимки или планове на етажите, показващи демонстрационна зона и капацитет за съхранение на резервни части.
      icon: tabler:building
    - title: Отчет за финансовата способност
      description: 'Банкова референция или финансов отчет, потвърждаващи способността за първоначална поръчка от контейнери и поддържане на инвентара. Минимална първоначална поръчка: един контейнер с дължина 20 фута (10-20 единици смесени модели).'
      icon: tabler:coin
    - title: Капацитет за следпродажбена поддръжка
      description: Сервизни техници, обучени или обучавани за поддръжка и ремонт на надуваеми лодки. Възможност за обработка на гаранционни претенции и ангажимент за инвентар на резервни части.
      icon: tabler:tool
    - title: Предишни препратки към марката
      description: Списък с настоящи или предишни марки морско/спортно оборудване, разпространявани. Контактните референции са налични при взаимно съгласие. Стартиращи компании без предишен опит в дистрибуцията могат да се квалифицират с по-силен финансов ангажимент.
      icon: tabler:users
faq:
  title: Дилърска програма — Често задавани въпроси
  questions:
    - q: Какъв е минималният брой поръчки за дистрибуторите?
      a: Дистрибуторът MOQ започва от 10-20 единици на поръчка, с гъвкавост за смесени модели (RIB, надуваеми, SUP). Първоначалните пробни поръчки от 2-5 единици са налични на цени от дистрибутора за пазарна оценка.
    - q: Предлагате ли изключителни териториални права?
      a: Ексклузивни териториални права са достъпни за квалифицирани дистрибутори, които изпълняват годишни ангажименти за обем и поддържат стандартите на марката. Полу-ексклузивни и неексклузивни споразумения са налични и за развиващите се пазари.
    - q: Каква маркетингова подкрепа предоставяте?
      a: Предлагаме цялостен маркетингов комплект, включващ професионална продуктова фотография, спецификационни листове, шаблони за документация за съответствие, библиотека със съдържание за социални медии и материали с ко-брандиране. Актуализирани ежегодно с нови продуктови пускания.
    - q: Как се обработват гаранционните претенции?
      a: 'Дистрибуторите са първата точка за контакт при гаранционни претенции. Ние предоставяме ясни гаранционни критерии, протоколи за фотодокументация и бърза подмяна или обработка на кредит. Гаранционни условия: 5 години ограничение за плат/шевове/корпус на лодкови тръби; 2 години SUP и аксесоари.'
    - q: Мога ли да Paddle Board Overstock продавам продукти с частна марка под собствената си марка?
      a: Да, чрез нашата OEMODM / програма. Опциите за частна марка включват персонализирани лампови графики, брандиране на конзоли, опаковки в търговията на дребно и документация за съответствие под вашата марка. Вижте нашата OEMODM страница / услуги за подробности.
    - q: Каква документация за съответствие е включена за дистрибуторите?
      a: Всяка пратка включва специфичен CE за модела DoC, данни за табели на производителя, ръководства за собственика и документация за доставка. Също така предоставяме регулаторна регистрационна поддръжка за вашата територия и подпомагаме всички местни изисквания за съответствие.
