content_customer_types:
  tagline: Кого обслужваме
  title: Създадено за B2B купувачи<br />— Не търговци на дребно
  subtitle: Paddle Board Overstock произвежда за четири типа клиенти. Всеки има различни приоритети и ние се грижим за всички тях.
  items:
    - title: Собственици на марки / Частна марка
      description: Персонализиран дизайн на продукта, графики с частна марка, документация за съответствие под вашата марка и специализирана инженерна поддръжка от концепцията до контейнера.
      icon: tabler:palette
      cta: Искане на оферта OEM/ODM
      cta_href: /request-quotation
    - title: Дистрибутори / Търговци на едро
      description: Защита на територията, конкурентни цени на едро, комплекти за маркетингово подпомагане, обучение за продукта и пълна документация за съответствие за вашия пазар.
      icon: tabler:world
      cta: Кандидатствайте за дилърство
      cta_href: /dealers-distributors
    - title: Курорти / Оператори под наем
      description: Търговска издръжливост, съвети за размерите на флота, поръчки на контейнери с различни модели, стратегия за резервни части и оборудване с марка на курорта.
      icon: tabler:beach
      cta: Вземете търговски пакет
      cta_href: /solutions/resorts
    - title: Спасител / Правителство / Професионален
      description: Hypalon/CSM конструкция, SOLAS опции за съответствие, проектно-специфична сертификация, подкрепа за документация за търгове и NDA-защитено инженерство.
      icon: tabler:shield
      cta: Обсъдете проект
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: OEM/ODM Възможност
  title: Какво получавате<br />с Paddle Board Overstock
  subtitle: Директен достъп до фабриката с пълна инженерна, качествена и съвместимостна подкрепа — не търговска компания.
  columns: 2
  items:
    - title: OEM/ODM Персонализиране
      description: Персонализиран дизайн на корпуса, материал на тръбата (PVC или Hypalon/CSM), оформление на конзолата, седалки, брандиране, цветове и опаковане. От малки модификации до пълно персонализирано инженерство.
      icon: tabler:adjustments
    - title: Нисък MOQ, Бързо вземане на проби
      description: 'RIB: 2-5 единици (съществуваща форма). SUP: 5-10 единици на SKU. Персонализирани форми: 200+ единици. Пробни образци за предпроизводство с вашето лого за 7-14 дни.'
      icon: tabler:rocket
    - title: Качество, готово за производство
      description: Всяко устройство е тествано за налягане при 1,25x номинално PSI за 24-48 часа. 99,3% безотказна степен според AQL 2,5 / ISO 2859. 100-точков списък за контрол на качеството за всяка обвивка.
      icon: tabler:certificate
    - title: Пълна документация за съответствие
      description: CE съгласно 2013/53/ЕС (RCD), ISO 9001:2015 (SGS), BSCI социален одит, REACH съответствие, UKCA маркировка. Включени са данни за декларацията за съответствие и табелата на производителя, специфични за модела.
      icon: tabler:file-certificate
    - title: Срок на изпълнение 30-45 дни
      description: Стандартно производство 30-45 дни FOB Циндао. Прототипи 7-14 дни. Налично ускорено производство. Планове за товарене на контейнери и опаковане според ISPM-15 включени.
      icon: tabler:truck-delivery
    - title: Следпродажбено обслужване и резервни части
      description: 5-годишна гаранция за лодки/каяци/RIBs, 2-годишна за SUP/аксесоари. Доставка на резервни части с приоритетна доставка. Поддръжка при обработка на гаранционни искове.
      icon: tabler:lifebuoy
content_categories:
  tagline: Категории продукти
  title: 5 категории,<br />64 CE-Сертифицирани модели
  subtitle: От 2,4 м RIB тендъри до 15 фута SUP дъски — всички произведени в нашето съоръжение Qingdao ISO 9001.
  items:
    - title: RIB Лодки
      description: 2,4 м до 7,0 м с алуминиеви или GRP корпуси.PVC или Hypalon/CSM тръби.CE според 2013/53/EU. Патрулни, гмуркане, спасителни и търговски конфигурации.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Надуваеми лодки
      description: 2,0 м до 5,0 м с алуминиеви подове, шперплат или въздушни палуби. Модели за риболов, отдих и тендери.
      icon: tabler:sailboat
      link: /products
    - title: SUP Дъски
      description: 9 фута до 15 фута в 4-инчови и 6-инчови Drop-Stitchмодели. Универсални, туристически, йога и риболовни модели. Налични са търговски модели.
      icon: tabler:swimming
      link: /products
    - title: Каяци
      description: Надуваеми каяци за 1 до 3 души. Развлекателни и туристически модели с Drop-Stitch възможности за под.
      icon: tabler:kayak
      link: /products
    - title: Аксесоари за безопасност
      description: CE- сертифицирани спасителни жилетки, въжета за хвърляне, ремонтни комплекти, помпи и навигационни светлини.USCG Одобрени PFD от тип III/V.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Фабрична здравина
  title: Производство, готово за одит<br />в Циндао
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12 000 m² ISO 9001 съоръжение — реален производител, не търговска компания</h3>
  items:
    - title: 6 специализирани производствени линии
      description: RIBОтделна, надуваема SUPлодка, каяк, защитно оборудване иOEM/ODM/ линии. Всяка с отделни контролни точки за контрол на качеството и планиране на производството.
    - title: 100% тест под налягане
      description: Всяка надуваема камера се пресуризира до 1.25x PSI и се държи 24-48 часа. Резултатите от тестовете са свързани със серийния номер на корпуса (HIN).
    - title: Проследимост по корпус
      description: 'Производствени записи на ниво HIN с 21+ полета данни на корпус: партида материал, идентификация на заварчица, резултат от тест под налягане, крайна конфигурация и място за доставка.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock ISO Производствено съоръжение 9001 от 12 000 м² в Циндао с RIB производствени линии
content_compliance:
  tagline: Съответствие и доказателство за качество
  title: Документирани доказателства,<br />Не само претенции
  subtitle: Всяко твърдение за съответствие е подкрепено с документация, специфична за модела, достъпна за вашата проверка.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Система за управление на качеството, сертифицирана от TÜV Rheinland/SGS. Годишни одити за наблюдение. Документирани процеси на контрол на качеството от входящия материал до освобождаването на пратки.
      icon: tabler:certificate
    - title: CE за 2013/53/ЕС (RCD)
      description: 64 модела с моделно-специфични декларации за съответствие. Оценка на съответствието по приложими модули. HIN регистрация и данни за табели на строителя за всеки корпус.
      icon: tabler:file-certificate
    - title: BSCI Социално съответствие
      description: Годишен BSCI одит от SGS. Проверени етични трудови практики, безопасност на работното място и управление на околната среда във всички наши съоръжения.
      icon: tabler:users
    - title: REACH & UKCA
      description: Всички PVC и лепилни материали са в съответствие с регламентите на ЕС REACH. Маркировка UKCA налична за пазара във Великобритания. Листовете с информация за безопасност на материалите са налични при поискване.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Процес — От Бриф до Контейнер
  items:
    - title: Стъпка 1:<span class="font-medium">Изисквания</span>
      description: Споделете спецификациите на продукта си, целевия пазар, количеството и изискванията за съответствие. Нашият инженерен екип ще направи преглед в рамките на 48 часа.
      icon: tabler:file-text
    - title: Стъпка 2:<span class="font-medium">Предложение</span>
      description: Получете подробна оферта с технически спецификации, възможности за материали, MOQ, цени, срок за изпълнение и обхват на съответствие за вашия пазар.
      icon: tabler:clipboard-list
    - title: Стъпка 3:<span class="font-medium">Прототип</span>
      description: Предпроизводствен образец с вашето брандиране за 7-14 дни. Пълно тестване на качеството при 1,25 пъти номиналното налягане. Разходите за образеца се кредитлват към производството.
      icon: tabler:settings
    - title: Стъпка 4:<span class="font-medium">Производство</span>
      description: Производство 30-45 дни FOB в Цингдао след одобрение на пробата. Контрол на качеството по време на процеса, тест за налягане и 100-точкова крайна проверка на всяко устройство.
      icon: tabler:building-factory
    - title: Стъпка 5:<span class="font-medium">Доставка</span>
      description: План за товарене на контейнера, дървени каси по ISPM-15, пакет с документи за съответствие и FOB пратка от Циндао с пълен комплект износни документи.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock OEM/ODM производствен процес на надуваема лодка от проектиране до изпращане в контейнер
blog_latest:
  title: Индустриални и технически прозрения
  information: |
    RCD насоки за съответствие, OEM/ODM статии за процеси, сравнения на материали,
    и ресурси за инспекция на фабрики от инженерния екип на Paddle Board Overstock.
faqs:
  title: B2B Често задавани въпроси за закупуване
  subtitle: Често задавани въпроси от брандове, дистрибутори и търговски оператори относно производството на OEM/ODM с Paddle Board Overstock.
  columns: 2
  items:
    - title: Вие производител ли сте или търговска компания?
      description: Ние сме вертикално интегрирана фабрика с пълен контрол върху качеството, материалите и сроковете за изпълнение. Лицензът за бизнес и обхватът на производството могат да бъдат проверени по време на одит на фабриката.
      icon: tabler:building-factory
      category: all
    - title: Какъв е вашият OEM/ODM процес?
      description: Преглед на изискванията (48ч) към предложение за прототип (7-14 дни) към производство (30-45 дни FOB Циндао). Пълна инженерна поддръжка, документация за съответствие и проследимост на всяка обвивка през целия процес.
      icon: tabler:route
      category: all
    - title: Какви са вашите MOQ изисквания?
      description: 'RIB лодки: 2-5 броя на модел (съществуваща форма), 200+ за поръчки с персонализирани форми. SUP дъски: 5-10 броя на SKU. Възможни са поръчки за контейнери с различни модели. Пробни поръчки от 2-5 броя за оценка.'
      icon: tabler:sort-ascending
      category: all
    - title: Кои опции за персонализиране са налични?
      description: Дизайн на корпуса, материал на тръбата (PVC или Hypalon/CSM), диаметър на тръбата, оформление на конзолата, седалки, управление, горивна система, оформление на палубата, цветове на марката, графики на логото, дизайн на EVA подложка, търговска опаковка и брандиране на ръководството за собственика.
      icon: tabler:adjustments
      category: all
    - title: Кои документи за съответствие можете да предоставите за моя пазар?
      description: CE DoC съгласно 2013/53/EU, UKCA маркировка, ISO сертификат 9001 (SGS), BSCI доклад от одит, REACH съответствие, доклади от тестове на материали, журнали за тестове под налягане и данни за табелка на конкретен модел. Документация за конкретен пазар – при поискване.
      icon: tabler:file-certificate
      category: all
    - title: Какво е времето за изработка на проби и производство?
      description: 'Примерки преди производство: 7-14 работни дни. Стандартно производство: 30-45 дни FOB Циндао. Бързо производство е налично срещу допълнително заплащане. Пиков сезон (март-юни) може да удължи сроковете за изпълнение.'
      icon: tabler:clock
      category: all
    - title: Мога ли да уредя одит на фабриката или виртуален видео тур?
      description: Да. Одити на производствените мощности на място в нашето съоръжение в Циндао са възможни с предварително известие от 3-5 дни. Живи видеотурове чрез WhatsApp/Zoom са налични веднага. Приемат се инспекции от трети страни (SGS, BV, TÜV).
      icon: tabler:video
      category: all
    - title: Какви проверки на качеството се извършват преди изпращане?
      description: Тест за задържане на налягане с оценка 1,25x (24-48 ч), тестване на отделяне на шевовете, контролен списък за финална инспекция от 100 точки, проверка на размерите, козметична инспекция, проверка на документи за съответствие и проверка на целостта на опаковката. Всичко според процедурите ISO 9001.
      icon: tabler:clipboard-check
      category: all
