content_customer_types:
  tagline: Кого обслужваме
  title: Дъски за всеки<br />вид гребец
  subtitle: Независимо дали е първата ви сесия или петдесетата, има дъска от разпродажбата, съобразена с начина, по който гребете.
  items:
    - title: Начинаещи
      description: Допълнително широки, стабилни универсални дъски, които правят първата ви сесия лесна — повечето начинаещи застават на дъската в рамките на минути.
      icon: tabler:swimming
      cta: Пазарувайте за начинаещи SUPs
      cta_href: /supboard
    - title: Семейства
      description: Стабилни дъски, които цялото семейство може да използва, плюс по-леки модели за деца — оборудване, което се побира в колата и се надува за минути.
      icon: tabler:beach
      cta: Пазарувайте семейни пакети
      cta_href: /products
    - title: Туринг и фитнес гребци
      description: По-дълги, по-бързи туринг дъски и пълнодекови йога платформи за гребци, които изминават разстояния.
      icon: tabler:route
      cta: Пазарувайте туринг и йога дъски
      cta_href: /supboard
    - title: Рибари
      description: Изключително стабилни платформи с крепежи за оборудване и място за куфарче — риболов от тиха, равна палуба.
      icon: tabler:lifebuoy
      cta: Пазарувайте риболовно оборудване SUPs
      cta_href: /products
features:
  id: features
  tagline: Защо да купите от Paddle Board Overstock
  title: Истинска фабрика,<br />Истински спестявания
  subtitle: Фабрично директни излишъци и разпродажбни SUP пакети — сертифицирано качество без търговска надценка.
  columns: 2
  items:
    - title: До 60% отстъпка от търговската цена
      description: Продаваме директно фабрични излишъци и разпродажби — без посредници, без търговска надценка. Същите дъски, които се продават на пълна цена другаде, тук на цени от разпродажба.
      icon: tabler:rocket
    - title: Комплектни пакети
      description: 'Всеки SUP идва като комплект: дъска, пътна раница, ръчна помпа, регулируемо гребло, подвижен перо, навита маска и комплект за ремонт.'
      icon: tabler:clipboard-list
    - title: Сертифицирано качество
      description: 13 CE-сертифицирани SUP модела съгласно приложимите директиви на ЕС. Всяка дъска е 100% тествана под налягане при 1,25x номинално PSI преди изпращане. Степен на дефектност 99,3% по AQL 2.5.
      icon: tabler:certificate
    - title: Без MOQ — Поръчайте една дъска
      description: Изчистване на излишъци означава, че са добре дошли единични поръчки. Добавете дъска в количката, завършете поръчката, готово. Няма минимална поръчка, няма процес на оферта.
      icon: tabler:adjustments
    - title: Бърза световна доставка
      description: Складови поръчки се изпращат от Вейхай в рамките на 2-3 работни дни. Доставка с проследяване до 50+ страни в ЕС, Северна Америка, Азия-Тихоокеански регион и други.
      icon: tabler:truck-delivery
    - title: 2-годишна SUP гаранция
      description: Всяка SUP дъска и аксесоар има 2 години гаранция — включително drop-stitch шевове, клапани за надуване и аксесоари. Исковете се решават за дни, а не за седмици.
      icon: tabler:lifebuoy
content_categories:
  tagline: Категории продукти
  title: Една продуктова линия,<br />Изпълнена правилно
  subtitle: Надуваеми SUP дъски и аксесоари — всички произведени в нашия завод във Вейхай ISO 9001.
  items:
    - title: SUP Дъски
      description: Многофункционален надуваем SUPs от 9 до 12 фута. Стабилен, издръжлив и се предлага с помпа, гребло, повод и раница.
      icon: tabler:swimming
      link: /supboard
    - title: Обиколка SUPs
      description: По-дълги, по-бързи дъски с обширни контури за туризъм по езера, реки и крайбрежие.
      icon: tabler:route
      link: /supboard
    - title: Йога и фитнес SUPs
      description: Допълнително широки, ултра-стабилни платформи с покрития на цялата дължина за йога и тренировки върху водата.
      icon: tabler:users
      link: /supboard
    - title: Деца SUPs
      description: По-леки, по-къси дъски с размери за деца — същото drop-stitch качество в опаковка, удобна за деца.
      icon: tabler:lifebuoy
      link: /products
    - title: Аксесоари
      description: Помпи, весла, спасителни жилетки, стойки, комплекти за ремонт и резервни части за всяка дъска, която продаваме.
      icon: tabler:adjustments
      link: /accessory
content_workshop:
  isReversed: true
  tagline: Фабрична здравина
  title: Защо нашите разпродажни цени<br />Са реални
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Истинска фабрика, истински спестявания — всяка платка се изпраща от нашето съоръжение във Вейхай</h3>
  items:
    - title: Същите производствени линии като големите марки
      description: Нашата фабрика в Уейхай с площ от 12 000 м² произвежда платки за международни марки и собствените ни излишни партиди на същите линии със същите материали.
    - title: 100% тест под налягане
      description: Всяка платка се подлага на налягане до 1.25x номиналното PSI и се задържа преди да бъде изпратена. Процент на бездефектност 99.3% на AQL 2.5 / ISO 2859.
    - title: Без посредници
      description: Дъските се доставят от завода директно до вашата врата. Без наценка от дистрибутор, без търговска наценка — така цените на разпродажба остават до 60% по-ниски от търговската цена.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock фабрика в Уейхай с площ 12 000 м² с производствени линии за надуваеми SUP
content_compliance:
  tagline: Съответствие и доказателство за качество
  title: Сертифицирано качество,<br />Документирано
  subtitle: Всяко твърдение за съответствие е подкрепено от сертификати и документация, специфична за модела, налична за вашата проверка.
  items:
    - title: ISO 9001:2015
      description: Система за управление на качеството, сертифицирана от TÜV Rheinland/SGS. Годишни одити за наблюдение. Документирани процеси на контрол на качеството от входящия материал до освобождаването на пратки.
      icon: tabler:certificate
    - title: CE Сертифицирано
      description: 13 CE-сертифицирани SUP модела според приложимите директиви на ЕС, всеки с модел-специфична Декларация за съответствие и данни от табелката на производителя.
      icon: tabler:file-certificate
    - title: REACH & UKCA
      description: Всички PVC и лепилни материали отговарят на регламентите на ЕС REACH. UKCA маркировка налична за пазара на Обединеното кралство. Информационни листове за безопасност на материалите се предоставят при поискване.
      icon: tabler:shield-check
    - title: 2-годишна SUP гаранция
      description: Всеки SUP борд и аксесоар са покрити за 2 години — включително drop-stitch шевове, въздушни клапани и аксесоари. Претенциите се уреждат бързо.
      icon: tabler:lifebuoy
steps:
  title: От Касата до Водата — Как се Доставя Вашата Поръчка
  items:
    - title: Стъпка 1:<span class="font-medium">Изберете вашата дъска</span>
      description: Избирайте между модели за обща употреба, туризъм, йога и за деца. Нашите ръководства за покупки ви помагат да съчетаете размера и стила на дъската с вашето гребане.
      icon: tabler:clipboard-list
    - title: Стъпка 2:<span class="font-medium">Сигурно плащане</span>
      description: Плащайте сигурно с Stripe или PayPal. Приемат се всички основни кредитни и дебитни карти. Не е необходим акаунт — потвърждението на поръчката пристига във вашата поща.
      icon: tabler:file-text
    - title: Стъпка 3:<span class="font-medium">Инспекция на качеството</span>
      description: Всяка дъска е тествана под налягане на 100% при 1,25x от номиналния PSI и проверена спрямо пълен списък за контрол на качеството, преди да бъде опакована.
      icon: tabler:settings
    - title: Стъпка 4:<span class="font-medium">Бързо изпращане</span>
      description: Поръчките, налични на склад, се изпращат от нашата фабрика в Уейхай в рамките на 2-3 работни дни. Налично е експресно обслужване за спешни поръчки.
      icon: tabler:building-factory
    - title: Стъпка 5:<span class="font-medium">Проследена доставка</span>
      description: Проследява се световна доставка до 50+ държави. Вашата 2-годишна гаранция и отзивчива следпродажбена поддръжка започват от деня, в който вашата дъска пристигне.
      icon: tabler:truck-delivery
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: Paddle Board Overstock SUP процес на поръчка от сигурно плащане до проследима доставка по целия свят
blog_latest:
  title: SUP Ръководства и технически анализи
  information: |
    Ръководства за закупуване, техника на гребане, основни правила за безопасност и конструкция
