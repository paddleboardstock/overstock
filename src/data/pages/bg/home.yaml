faqs:
  title: SUP Поръчки и често задавани въпроси за продуктите
  subtitle: Чести въпроси относно нашите разпродажбени SUP платки, поръчки, плащане, доставка и гаранция.
  columns: 2
  items:
    - title: SUP трудно ли е да се научи?
      description: Изобщо не. Повечето начинаещи застават и гребат още в първата си сесия. Нашите многофункционални SUP дъски имат допълнително широки стабилни платформи, специално проектирани за начинаещи гребци. Започнете на спокойна вода и скоро ще се движите уверено.
      icon: tabler:swimming
      category: суп
    - title: Каква е границата на теглото?
      description: Нашата универсална SUPs поддържа до 220 фунта, а платформите за туринг и йога поддържат до 250 фунта. Всяка страница на продукта посочва точния капацитет на теглото на ездача, за да можете да съобразите дъската с вашите нужди.
      icon: tabler:adjustments
      category: суп
    - title: Мога ли да пътувам с надуваема лодка SUP?
      description: Абсолютно. Всеки Paddle Board Overstock борд се побира в калъф с размер на раница. С тегло едва 18-22 lbs, той е лесен за носене до плажа, езерото или през терминалите на летището. Проверете правилата на вашата авиокомпания за багаж преди пътуване.
      icon: tabler:truck-delivery
      category: суп
    - title: Какво идва в кутията?
      description: Всеки Paddle Board Overstock SUP включва борда, туристическа раница, ръчна помпа, регулируемо гребло, подвижно перо, бимини каишка и комплект за ремонт.
      icon: tabler:clipboard-list
      category: суп
    - title: Защо вашите цени са по-ниски от розничните?
      description: Ние продаваме излишък от фабрика — чисто нови платки, останали от завършени производствени поръчки — произхождащи от собствената ни производствена база Weihai и избрани производствени партньори. Без надценки на дребно и без посредници означава пълни SUP пакети с до 60% отстъпка от обичайните цени на дребно, със същото качество, тествано под налягане.
      icon: tabler:shield-check
      category: поръчки
    - title: Как да направя поръчка и да платя?
      description: Добавете вашия SUP пакет в количката и завършете поръчката сигурно чрез Stripe или PayPal. Приемаме всички основни кредитни и дебитни карти. Всяка поръчка се потвърждава по имейл с пълен фактурен документ.
      icon: tabler:file-text
      category: поръчки
    - title: Доставяте ли по целия свят?
      description: Да. Доставяме до 50+ страни в ЕС, Северна Америка, Азиатско-Тихоокеанския регион, Близкия изток и Африка. Поръчките налични на склад обикновено се изпращат в рамките на 2-3 работни дни с предоставен номер за проследяване за всяка пратка.
      icon: tabler:route
      category: поръчки
    - title: Каква гаранция включват SUP платки?
      description: 'Всяка SUP платка и аксесоар се покрива от 2-годишна гаранция — включително самата платка, drop-stitch шевове и инфлационни клапани. Исковете се разрешават за дни, а не за седмици: подайте онлайн и ние ремонтираме или заменяме.'
      icon: tabler:lifebuoy
      category: поръчки
