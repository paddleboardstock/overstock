testimonial:
  quote: Проверих дневника на теста под налягане, който дойде с дъската, и изпратих имейл на поддръжката два въпроса за инфлацията в летните жеги. Те отговориха с реални числа същия ден. Това е повече, отколкото който и да е магазин някога е направил за мен.
  author: София Маркети
  title: Проверен купувач
  company: Крайбрежен гребец
  location: Италия
content_overpressure:
  tagline: Безопасност при налягане
  title: Натиск върху борда<br />Мениджмънт в горещи климатични условия
  subtitle: Налягането на надуваемата дъска се увеличава с температурата. Разбирането и управлението на свръхналягането защитава дъската и прави всяка сесия безопасна.
  items:
    - title: Защо налягането се повишава
      description: Въздухът се разширява с топлината. Дъска, напомпана до 15 PSI при 20°C, може да се изкачи с 1-2 PSI в 40°C слънце — същата физика, която кара хладната сутрешна дъска да изглежда твърда като камък до обяд.
      icon: tabler:gauge
    - title: Препоръчително работно налягане
      description: Напомнете до 12-15 PSI, както е отпечатано близо до клапана. Номиналният диапазон балансира твърдостта, безопасността и живота на шева — повече не е по-добре.
      icon: tabler:chart-bar
    - title: Добри практики за горещ климат
      description: Надувайте до долната граница на диапазона в горещи дни. Пуснете малко въздух преди продължително излагане на слънце и никога не оставяйте напълно надута дъска да се пече на плажа.
      icon: tabler:sun
    - title: Излагане на слънце и съхранение
      description: Съхранявайте дъските с сенка и частично спукани, когато не се използват. Използвайте торбичка за UV защита за бордове. Изплакнете и подсушете преди да навиете за съхранение.
      icon: tabler:umbrella
    - title: Ако дъската е твърда като камък
      description: Пуснете въздух през клапана, докато платката се върне в номиналния диапазон. Дръжте манометъра на помпата за точни показания — прекалено надутата дъска натоварва шевовете излишно.
      icon: tabler:alert-circle
