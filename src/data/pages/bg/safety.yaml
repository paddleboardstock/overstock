certifications:
  - title: CE Сертификация (ЕС 2016/425)
    standard: Регламент за ЛПС (ЕС) 2016/425 | EN ISO 12402
    description: Цялото Aquafarer оборудване за безопасност отговаря CE на изискванията за маркиране съгласно Европейския регламент за лични предпазни средства. Всеки продукт се тества независимо от TÜV Rheinland, европейски уведомен орган. Нашите надуваеми лодки RIBs отговарят на изискванията на Директивата за развлекателни плавателни съдове 2013/53/EU (RCD) категория C и D.
    body: CE Сертификацията обхваща основни изисквания за здраве и безопасност за лични плавателни устройства и надуваеми водни съдове.TÜV Rheinland провежда ежегодно одит на нашето производствено съоръжение, за да провери текущото съответствие.
  - title: SOLAS — Безопасност на живота в морето
    standard: SOLAS Глава III | Кодекс на LSA
    description: Спасителната жилетка Pro отговаря SOLAS на регулациите за офшорни и търговски морски операции. Тествана за 24-часово задържане на плаваемост, автоматично надуване при потапяне и производителност в морски условия до Сила 5. Отговаря на изискванията по Глава III за спасителни жилетки на търговски съдове.
    body: SOLAS одобрението изисква независимо тестване от уведомен орган за плаваемост, здравина, видимост и автоматично активиране. Нашият Life Vest Pro предлага пълно SOLAS типово одобрение с MED сертификат.
  - title: USCG Тип III / Тип V
    standard: 46 CFR Част 160 |USCG Одобрение
    description: Избрани Aquafarer спасителни жилетки отговарят на класификацията на Бреговата охрана на САЩ за Тип III (помощ за плаване) и Тип V (специално предназначение). Подходящи за защитени води, крайбрежни круизи и търговски операции, USCGизискващи одобрени PFD.
    body: USCG одобрението изисква тестване от независима лаборатория, призната от CG. Одобрението от тип V включва хибридни надуваеми конструкции, които изискват ръчно или автоматично активиране.
  - title: BSCI Социално съответствие
    standard: Кодекс на поведение на амфори BSCI
    description: Нашата фабрика се одитира ежегодно по инициативата за социално съответствие на бизнеса (BSCIamfori). Това проверява етичните трудови практики, безопасността на работното място, справедливото работно време и екологичното управление в цялото ни производствено съоръжение от 12 000 m².
    body: BSCI Съответствието е предпоставка за европейските търговци на дребно и вносители. BSCI Нашият текущ рейтинг е "C" (Добро), одит от SGS.
  - title: REACH & RoHS Съответствие
    standard: Регламент на REACH ЕС (ЕС) 1907/2006 |RoHS Директива 2011/65/ЕС
    description: Всички PVC съединения, лепила и покрития, използвани в Aquafarer продуктите, отговарят REACH на регулациите за химическа безопасност на ЕС и RoHS ограниченията за опасни вещества. За всяка продуктова линия са налични информационни листове за безопасност на материалите (MSDS).
    body: REACH Съответствието гарантира, че няма ограничени SVHC вещества над праговите граници. Редовните лабораторни тестове от трети страни потвърждават текущото съответствие за всяка производствена партида.
  - title: ISO 9001:2015 Управление на качеството
    standard: ISO 9001:2015 |TÜV Райнланд сертифициран
    description: Нашата система за управление на качеството е ISO сертифицирана 9001:2015 от TÜV Rheinland, обхващаща дизайн, производство, тестване и следпродажбено обслужване. Годишните одити за наблюдение гарантират непрекъснато подобрение и контрол на процесите.
    body: ISO Сертификацията 9001 изисква документирани политики за качество, вътрешни одити, управленски прегледи, процедури за коригиращи действия и проследими производствени записи.
testimonial:
  quote: Осигурили сме защитно оборудване от множество доставчици в цяла Азия.Aquafarer е единственият производител, който е предоставил пълна CE документация, SOLAS сертификати и доклади от трети страни — без да бъде поискан.
  author: Ерик Линдстрьом
  title: Офицер по безопасността
  company: Балтийско морско снабдяване
  location: Финландия
content_overpressure:
  tagline: Безопасност при свръхналягане
  title: RIB Налягане на тръбата<br />Мениджмънт в горещи климатични условия
  subtitle: Налягането в надуваемите тръби се увеличава с температурата. Разбирането и управлението на свръхналягането предотвратява повреди и осигурява безопасна работа в тропически и пустинни среди.
  items:
    - title: Бойл клапани за облекчаване на налягането
      description: Aquafarer RIB Тръбите са оборудвани с клапани за облекчаване на налягането, които автоматично изпускат излишното налягане над номиналното максимално. Предотвратява напрежението на шевовете и потенциално спукване на тръбите при слънчево нагряване.
      icon: tabler:gauge
    - title: Промяна на налягането от сутрин до обяд
      description: Тръба, напомпана до 3.5 PSI при 20°C, може да достигне 4.5+ PSI при 40°C слънчева експозиция. Винаги надувайте до долната граница на препоръчителния диапазон в горещи климатични условия и оставете предпазния клапан да управлява излишното налягане.
      icon: tabler:sun
    - title: Препоръчителни работни налягания
      description: 'PVC тръби: 3.0-3.5 PSI работещи, 4.5 PSI макс. Hypalon лампи: 3.5-4.0 PSI работещи, 5.0 PSI макс. Винаги тествайте при 1.25x номинално (4.4 PSI за PVC, 5.0 PSI Hypalonза ) според Aquafarer QC стандартите.'
      icon: tabler:chart-bar
    - title: Добри практики за излагане на слънце
      description: Съхранявайте RIBs на сенчести места, когато не се използвате. Използвайте UVзащитни капаци за продължително закотвяне. Проверявайте и регулирайте налягането в тръбата преди и след пиковите слънчеви часове. Никога не надвишавайте максималното номинално налягане.
      icon: tabler:umbrella
    - title: Спешна депресуризация
      description: Ако тръбата се усеща прекалено твърда или клапанът за облекчаване вентилира, пуснете въздух през Halkey-Roberts или военния вентил, докато налягането се върне в работния диапазон. Носете манометър за точни показания.
      icon: tabler:alert-circle
