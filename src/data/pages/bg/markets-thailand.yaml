overview_section:
  tagline: Обзор на пазара
  title: SUP Тайландският пазар
  paragraphs:
    - Thailand's island tourism economy is one of Asia's most established. Phuket's beaches and beach clubs, the dramatic limestone bays of Krabi and Phi Phi, Koh Samui's resort coastline, and Pattaya's weekend crowd create year-round demand for on-water activities — and stand-up paddle is a staple: Гребане при изгрев в равнинни заливи, обиколки на лагуните, програми за гости в хотели и SUP йога класове, които се снимат красиво на фона на варовикови карсти.
    - Buyers are typically established tourism businesses: плажни клубове, които провеждат програми за дейности, островни курорти, оборудващи гости, оператори на турове с дълги опашки и скоростни лодки, добавящи спирка за гребане, и оператори за наемане на натоварени плажове. Сезонността на мусонния сезон на брега на Андаманските острови прави гъвкавите поръчки на малки партиди — по 5–20 борда наведнъж — практичен избор пред контейнерни натоварвания.
  customer_types:
    - title: Плажни клубове и курорти
      description: Плажните клубове и курорти в Пукет и Ко Самуи провеждат гостуващи програми за гребане с компактни смесени флотове.
    - title: Туроператори
      description: Операторите на Krabi, Phi Phi и Phang Nga добавят спирки за гребла към обиколки на островите и лагуните.
    - title: Оператори на наеми
      description: Сергии за отдаване под наем на плажа и училищни освежаващи платки по сезонен цикъл на подмяна.
shipping_section:
  title: Кораб за Тайланд
  paragraphs:
    - Тайланд е един от най-късите товарни маршрути от нашата база във Вейхай, Китай. Експресният въздушен товар превозва мостри и 1–3 бордови поръчки бързо до Банкок и Пукет; консолидирани морски товарни услуги обслужват 5–20 поръчки на едро през Лаем Чабанг и регионални пристанища. Оценките за транзит за вашата дестинация са включени във вашата оферта.
    - Ние предоставяме търговската фактура и списъка за опаковане, необходими за одобрение, с коректни HS кодове и декларирани стойности. Вносните мита и данъците се плащат от вносителя според тайландските правила.
  customs_note: Тайландските митнически процеси за спортно оборудване са добре установени — потвърдете текущото мито и данъчното третиране с вашия брокер преди поръчка. Ние предоставяме пълна и последователна документация за гладко одобрение.
faq_section:
  title: Често задавани въпроси за Тайланд
  items:
    - q: Колко бърз е товарният транспорт от Китай до Тайланд?
      a: Тайланд е една от най-близките ни дестинации за товарни превози от Уейхай. Експресният въздушен транспорт до Банкок или Пукет е най-бързият вариант за мостри и малки поръчки; консолидирани морски товари до Лаем Чабанг се предлагат с транзитен прозорец за поръчки на едро. И двете са изброени в вашата оферта.
    - q: Как изглежда поръчката за стартова поръчка на плажен клуб?
      a: 'Обикновено 5–15 дъски: стабилни универсални модели за уроци и наеми, плюс едно или две премиум арт издания за вид на плажа. Смесени модели, една пратка, цена според общото количество.'
    - q: Подходящи ли са дъските за обиколки на варовиковия залив и лагуните?
      a: Да — спокойните, защитени заливи са точно това, за което са създадени всестранните надуваеми SUP дъски, а здравата drop-stitch конструкция и гъвкавото перо се справят добре с кацания на плажа и понтони.
    - q: Можем ли да поръчаме преди високия сезон?
      a: Да — много тайландски оператори планират едрови доставки преди високия сезон в Андаманското море от ноември до април. Изпратете своя целеви микс и график в запитването и ние ще планираме транспорта съответно.
