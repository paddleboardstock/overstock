how_to_choose:
  title: Как да изберете правилния размер
  cards:
    - title: SUP Дъски
      description: Изберете дължина според теглото и предназначението. По-широките дъски (32"+) осигуряват по-голяма стабилност. По-дългите дъски (11-12 фута) имат по-добро трасиране за туризъм. По-тежки гребци се нуждаят от дъски с по-голям обем.
    - title: Каяци
      description: Единичните каяци (9 фута) са най-подходящи за самостоятелно пътуване и реки. Двойните каяци (12 фута) побират двама гребци или един възрастен с оборудване. Проверете товароносимостта за общото натоварване, включително оборудването.
    - title: Дингита & RIBs
      description: Изберете дължината на шлепа според броя на пътниците и предназначението. По-големите RIBs (4,5 м+) са подходящи за офшорни и спасителни операции. По-малките шлепове (2,7 м) работят като помощни лодки и риболовни платформи.
