hero:
  title: Ръководство за размери и характеристики
  subtitle: Размери, капацитети и препоръчителни употреби за всеки Paddle Board Overstock продукт.
categories:
  SUP: Надуваеми SUP дъски, проектирани за преносимост без да се жертва представянето. Съчетайте правилния размер с вашето тегло и стил на гребане.
  ACCESSORY: Аксесоари и комплекти, които допълват вашата дъска. Универсални размери с множество опции.
