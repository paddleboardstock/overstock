  subtitle: Размери, капацитети и препоръчително използване за всеки Aquafarer продукт.
categories:
  inflatable: Надуваеми SUPs и каяци, проектирани за преносимост без компромис с представянето. Съчетайте правилния размер с вашето тегло и стил на гребане.
  rib: Надуваеми лодки с твърд корпус за крайбрежна навигация, патрулиране и професионални морски операции. Изберете по дължина и мощност на двигателя.
  accessory: Аксесоари и оборудване за безопасност, които допълват водното средство. Универсални размери с множество опции.
