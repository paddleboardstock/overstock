how_to_choose:
  title: Как да изберете правилния размер
  cards:
    - title: Всестранни SUP платки
      description: Нашите ~11-футови универсални дъски (32" широки, 6-инчови drop-stitch) балансират стабилност, скорост и капацитет. Съобразете обема на дъската с вашето тегло — по-тежките гребци се нуждаят от повече обем.
    - title: Ширина и дебелина
      description: По-широките дъски (32"+) предлагат повече стабилност за начинаещи, йога и риболов. 6-инчова дебелина при 15 PSI поддържа палубата твърда под гребеца и оборудването.
    - title: Пакети и аксесоари
      description: Всяка дъска се доставя като пълен комплект — дъска, туристическа раница, ръчна помпа, регулируемо гребло, подвижно перо, каишка с бримка и комплект за ремонт. Проверете максималното натоварване за ездача плюс екипировката.
