process_section:
  tagline: Как работи доставката
  title: От нашия склад до вашата врата
  steps:
    - title: Оферта с опции за транспорт
      description: Всяка оферта показва опциите за транспорт до вашата дестинация — експресни и морски — с приблизително време за транзит, така че нищо да не се решава вместо вас.
    - title: Проверка на качеството и опаковане
      description: Бордовете са тествани на 100% налягане, след което се опаковат с помпа, гребло, въже, плавник, раница и комплект за ремонт — същият пълен пакет, който продаваме на дребно.
    - title: Изпращане от Уейхай
      description: Вашата пратка напуска нашата логистична база с избрания от вас метод на транспорт и проследяването от врата до врата се споделя с вас същия ден.
    - title: Митническо оформяне
      description: Ние предоставяме търговската фактура и товарителницата, от които се нуждаете за внос. Вносните мита и данъци в страната ви са отговорност на вносителя — вижте раздела за митниците по-долу.
    - title: Доставка и проверка
      description: Проверете доставката при пристигане. Ако нещо е повредено или липсва, свържете се с нас с фотографии и номера на поръчката — вижте политиката ни за изгубени и повредени стоки по-долу.
customs_section:
  tagline: Митници и мита
  title: Митнически мита и вносни данъци
  subtitle: Ние правим отговорностите за транспорта ясни, вместо да даваме неясни обещания. Ето точно кой за какво носи отговорност.
  items:
    - title: Какво покриваме ние
      description: Вашата оферта включва разходите за транспорт до вашата дестинация и ние подготвяме и предоставяме всички износни документи — търговска фактура, товарителница и проследяване на пратката.
    - title: Какво покрива вносителят
      description: Вносните мита, ДДС/Данък върху стоките и всички данъци в страната на дестинация се заплащат от вносителя (вие или вашата фирма) според правилата на вашата страна. Ние не включваме неясни обещания за данъци в офертите за транспорт.
    - title: Поддръжка при митническо оформяне
      description: Нашата документация е пълна и последователна — правилни HS кодове, декларирани стойности и спецификации на платката — което е това, което поддържа почистването гладко. Ако вашият брокер или митническа служба се нуждае от допълнителна документация, ние я предоставяме.
    - title: Проверете местните цени преди да поръчате
      description: Тарифите върху надуваемото водно спортно оборудване варират според страната. Проверете правилата за внос във вашата страна или попитайте при запитване — нашите регионални пазарни ръководства включват митнически бележки за ключови пазари.
lost_damaged:
  title: Изгубени или повредени пратки
  description: Проверете доставката си, когато пристигне. В редкия случай, че дъска пристигне повредена или липсва пратка, свържете се с нас възможно най-скоро с номера на поръчката и ясни снимки на опаковката и платката. Оценяваме всеки случай индивидуално — в зависимост от случая, това означава резервна част, платка или възстановяване на сумата за засегнатия артикул. Производствените дефекти се покриват отделно от нашата 2-годишна SUP гаранция.
destinations_section:
  tagline: Къде изпращаме
  title: 50+ държави и броят им
  description: Доставяме по целия свят с подробни ръководства за нашите ключови регионални пазари. Всеки пазарен наръчник обхваща местни типове клиенти, бележки за доставка и митнически съвети за този регион.
  regions_label: Регионални пътеводители
  countries_label: Пътеводители за държави
faq_section:
  title: Често задавани въпроси за корабоплаване
  items:
    - q: Колко време отнема експресната доставка?
      a: Времето за експресния транзит зависи от дестинацията — ние посочваме приблизителното време за транзит за вашата страна при всяко запитване, преди да се ангажирате с нещо.
    - q: Колко време отнема морският транспорт?
      a: Морският товарен транспорт варира според дестинацията, пристанището и графика на плаването. Ние посочваме приблизителен прозорец за вашата дестинация с поръчката ви, а вие получавате проследяване, когато пратката тръгне.
    - q: Кой метод на доставка трябва да избера?
      a: Експрес за 1–3 дъски, мостри или спешни запаси. Морски товари за 5–20 борда на едро поръчки, където цената на дъска е по-важна от скоростта. Даваме оферти и двете, за да можете да сравните.
    - q: Включени ли са вносните мита и данъците в разходите за доставка?
      a: Не. Товарният товар се оферира отделно, а вносните такси, ДДС/ДДС и данъците за дестинация са отговорност на вносителя според правилата на вашата страна. Ние предоставяме пълни и точни документи, за да осигурим гладко преминаване на разчистване.
    - q: Доставяте ли до моята страна?
      a: Доставяме до 50+ държави. Вижте нашите регионални и национални справочници по-долу или просто попитайте в запитването си — ние ще потвърдим текущото обслужване на вашия адрес.
    - q: Мога ли да следя поръчката си?
      a: Да. Всяка пратка — експресна или морска — включва проследяване от врата на врата, което споделяме с вас в деня на изпращането.
