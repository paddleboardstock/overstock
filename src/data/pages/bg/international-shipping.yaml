hero:
  tagline: Международно корабоплаване
  title: Международно корабоплаване —<br />Експресни и морски товари до 50+ държави
  subtitle: Всяка поръчка се изпраща от нашата логистична база във Вейхай, Китай. Изберете експресен въздушен товар за мостри и спешни запаси, или консолидиран морски товар за поръчки на едро от малък бизнес.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP Дъски, опаковани за международна доставка
direct_answer: Paddle Board Overstock изпраща до повече от 50 държави от Вейхай, Китай. Експресният въздушен товар превозва 1–3 борда, пробни поръчки и спешни запаси; консолидираният морски товар е икономичният вариант за поръчки на едро от 5–20 борда. Всяка пратка включва проследяване от врата до врата, като всяка дъска е 100% тествана под налягане и опакована с пълния си комплект аксесоари преди изпращане.
tldr_points:
  - 'Експресен въздушен товар: 1–3 борда, проби, спешно презареждане — най-бързият вариант'
  - 'Морски товари: 5–20 поръчки на едро на борда — най-ниска цена на товар на борд'
  - Проследяване от врата на врата на всяка пратка до 50+ държави
  - Товарните превози, застраховките, митническото оформление и вносните мита са изброени в вашата оферта — без неясни обещания за всичко
from_china:
  tagline: Корабоплаване от Китай
  title: Откъде се изпращат поръчките
  description: Всички поръчки се изпращат от нашата логистична база във Вейхай, Китай — сърцето на нашата производствена и складова дейност. Вейхай е голям крайбрежен пристанищен град в провинция Шандун с директни морски и въздушни товарни връзки, което поддържа времето за транзит и разходите за товара конкурентни за дестинации в Азия, Америка, Африка, Европа и Близкия изток.
modes_section:
  tagline: Два варианта
  title: Експресен транспорт или морски товари
  subtitle: Правилният метод за превоз зависи от това колко бързо ви трябват дъските и колко поръчвате. И двете опции се посочват при всяко запитване.
  express:
    name: Опция А — Експресна доставка
    best_for: Най-добро за 1–3 платки, проби и спешни презареждания
    description: Air Express доставя малки поръчки и пробни бордове до вратата ви за дни, а не седмици. Идеално е, когато тествате модел преди по-голяма поръчка или презареждате бестселър по средата на сезона.
    features:
      - 1–3 платки, единични модели или смесени модели
      - Най-бързият транзит от двата варианта — оферта по дестинация
      - Проследяване от врата до врата с голям експресен превозвач
      - 'Типична употреба: мостри, спешно презареждане, малки първи поръчки'
  sea:
    name: Опция Б — Морски товари
    best_for: Най-добро за поръчки на едро и търговци от 50 дъска
    description: Консолидираният морски транспорт е икономичен избор за поръчки на едро от малък бизнес. Платките се събират в една консолидирана пратка от Weihai, което поддържа ниската цена на товар на борд.
    features:
      - 5–20 поръчки за търговци на дъски и едро
      - Най-ниска цена на товар на борд от двата варианта
      - Консолидирано опаковане — една пратка, едно разчистване
      - 'Типична употреба: сезонни запаси, поръчки на едро от смесени модели'
