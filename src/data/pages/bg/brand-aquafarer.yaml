hero:
  tagline: Марка на компанията
  title: Aquafarer — Инженерна свобода на вода
  definition: Aquafarer е глобална марка за морски развлечения и надуваеми водни съдове, специализирана в надуваеми лодки, SUP системи и персонализирани морски решения. Aquafarer комбинира морско инженерство, производствен опит и култура на водно изследване, за да създаде надеждно оборудване за любителски потребители, професионални оператори и глобални OEM партньори.
timeline:
  - year: '2012'
    title: Фондация за морско производство
    body: започна Aquafarer като специализирана работилница за надуваеми водни съдове в Циндао, Китай, посветена на морското майсторство и производството на надуваеми лодки. Първоначалният фокус беше изграждането на надеждни надуваеми продукти чрез практически инженерен опит и производствена дисциплина.
  - year: '2015'
    title: Първи износ и CE сертифициране
    body: Първоначалните износни поръчки достигнаха Япония и Корея.CE Сертифициране беше постигнато за основните продуктови линии, което отбеляза Aquafarerнавлизането на международните пазари. Компанията започна да обслужва търговски и развлекателни потребители извън Китай.
  - year: '2018'
    title: Разширяване на фабриката
    body: Преместен в производствено съоръжение с площ 12 000 m². Добавени RF заваръчни линии и drop-stitch производствен капацитет, позволявайки по-мащабно производство и подобрени системи за контрол на качеството.
  - year: '2020'
    title: Създаване на изследователски и развоен център
    body: Откри специализиран изследователски и развоен център с PVC лаборатория за тъкани, хидродинамичен тестов резервоар и студио за симулация на CAD/FEA. Разработката на продуктите се разшири с фокус върху лека конструкция, подобрена издръжливост и дизайн, ориентиран към потребителя.
  - year: '2022'
    title: ISO Сертификация 9001 & Глобален растеж
    body: Постигнаха ISO сертификат 9001. Разширени до 14 инженери по научноизследователска и развойна дейност и 200+ служители. Продуктите достигнаха до клиенти в цяла Европа, Америка и Азиатско-тихоокеанския регион чрез дистрибутори и OEM партньорства.
  - year: '2024'
    title: Студио за иновации и дизайн
    body: Стартира пълноценно студио за дизайн и иновации за ODM персонализирани проекти – от концепция до производство. Укрепи професионалните морски приложения, включително спасителни, търговски и държавни търгове.
  - year: '2026'
    title: Изграждане на бъдещето на водните изследвания
    body: Днес Aquafarer продължава да разработва надуваеми лодки, SUP системи и персонализирани морски решения — свързвайки хора и организации с водите на света. 50+ държави обслужват, капацитет 15 000 единици годишно.
philosophy:
  tagline: Философия на марката
  title: Инженерна свобода на вода
  body: Свободата на вода не е само движение. Тя представлява откриване на нови места, създаване на открити преживявания, свързване на хората с природата и осъществяване на професионални мисии. Инженерството прави тази свобода възможна.
  pillars:
    - title: Надеждност на първо място
      body: Водните средиAquafarer изискват доверие. Продуктите са проектирани според стабилност, издръжливост, безопасност и постоянна производителност.
    - title: Дизайн, ориентиран към човека
      body: Продуктите трябва да служат на хората, а не на технологиите. Всяко дизайнерско решение започва с разбирането как хората използват водни превозни средства, къде изследват и с какви предизвикателства се сблъскват.
    - title: Достъпно изследване
      body: Водата не трябва да принадлежи само на експерти.Aquafarer Създава оборудване, което позволява на повече хора безопасно да изживяват реки, езера, океани и крайбрежни среди.
    - title: Непрекъснати иновации
      body: Иновацията не е само създаване на нови продукти. Тя подобрява всеки детайл — материали, конструкции, производство и потребителско изживяване.
engineeringDna:
  tagline: Инженерна ДНК
  title: Aquafarer Как създава продукти
  areas:
    - title: Материалознание
      body: Aquafarer Фокусира се върху избора на подходящи материали за различни морски среди. Ключови съображения включват устойчивост на износване, UV устойчивост, стабилност на налягане и дългосрочна издръжливост.
      items:
        - Устойчивост на абразия
        - UV устойчивост
        - Стабилност на налягането
        - Дългосрочна издръжливост
    - title: Структурно инженерство
      body: Надуваемите плавателни съдове изискват прецизен баланс между твърдост, тегло, преносимост и стабилност. Aquafarer инженерството се фокусира върху оптимизирането на тези фактори чрез drop-stitch основна технология и напреднала конструкция на шевовете.
      items:
        - Твърдост
        - Оптимизация на теглото
        - Преносимост
        - Стабилност
    - title: Точност при производството
      body: 'Всеки продукт преминава през контролирани процеси: подготовка на материалите, прецизно рязане, заваряване и слепване, сглобяване, контрол на качеството и проверка на представянето.'
      items:
        - Подготовка на материалите
        - Прецизно рязане
        - Заваряване и слепване
        - Сглобяване и контрол на качеството
    - title: Инженеринг на потребителските сценарии
      body: Продуктите се разработват около реални приложения — отдих, приключения и професионална употреба — като се гарантира, че всеки дизайн отговаря на специфичните изисквания на предвидената среда.
      items:
        - Отдих
        - Приключения
        - Professional
        - Търговски
