trustSignals:
  tagline: Сигнали за доверие
  title: Защо Aquafarer е надежден партньор
  manufacturing:
    title: Производствени възможности
    body: Производствено съоръжение с площ 12 000 м² с 200-300 квалифицирани работници и 14+ инженери по НИР. ISO сертифицирана система за управление на качеството ISO 9001. Годишно производство на 15 000 надуваеми плавателни съдове, обслужващи 50+ страни.
    stats:
      - label: Размер на съоръжението
        value: 12,000 m²
      - label: Работна сила
        value: 200-300
      - label: Инженери по НИРД
        value: 14+
      - label: Годишен капацитет
        value: 15,000
  quality:
    title: Ангажимент към качеството
    body: От инспекция на материалите до финално тестване, Aquafarer поддържа систематични процеси за качество, за да достави надеждни морски продукти. Всяка единица преминава през тестове на налягането, инспекция на шевовете и проверка на представянето преди изпращане.
    items:
      - CE Сертифициран — 64 модела отговарят на европейските стандарти за безопасност
      - ISO 9001:2015 — Сертифицирана система за управление на качеството
      - UKCA Сертифицирано — съответствие с британския пазар
  global:
    title: Глобално присъствие
    body: Aquafarer обслужва клиенти на множество световни пазари, подкрепяйки дистрибутори, брандове за открито и професионални морски потребители в 50+ страни в Европа, Азиатско-Тихоокеанския регион, Америка, Близкия изток и Африка.
comparison:
  tagline: Позициониране на марката
  title: Aquafarer на пазара
  position: Инженерно ориентиран морски производител, комбиниращ експертиза в надуваеми водни съдове с пълна OEM/ODM способност, индивидуална разработка и 12+ години опит в износното производство.
  strengths:
    - Експертиза в инженерството на надуваеми плавателни съдове
    - Пълна OEM/ODM производствена способност
    - Развитие и дизайн на персонализирани продукти
    - 12 000 м² производствено съоръжение с сертификат ISO
  bestFor:
    - Потребители на открито, търсещи надеждни надуваеми плавателни съдове
    - Морски оператори, изискващи оборудване с търговски стандарт
    - Партньори на марката, нуждаещи се от OEM/ODM производство
    - Професионални спасителни и патрулни организации
