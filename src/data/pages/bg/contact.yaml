hero_text:
  tagline: Контакт
  title: СВЪРЖЕТЕ СЕ С НАС
contact_form:
  id: form
  title: Изпратете ни съобщение
  subtitle: За въпроси относно поръчки, съвети за размер или поддръжка на продукта, свържете се с нас. Отговаряме в рамките на един работен ден.
  email_to: info@paddleboardoverstock.com
  submit_button: Изпратете запитване → Получете оферта
  success_message: Благодарим! Вашето съобщение е получено във входящата ни поща. Ще отговорим в рамките на един работен ден.
  error_message: Нещо се обърка при изпращането на вашето съобщение. Моля, опитайте отново или ни изпратете имейл директно.
  default_country_code: '+1'
  captcha:
    label: 'Антиспам: моля, решете следното'
  fields:
    - name: първоИме
      label: Собствено име
      row: 1
    - name: фамилия
      label: Фамилия
      row: 1
    - name: имеНаФирмата
      label: Име на компанията
      row: 2
    - name: address
      label: Адрес
      row: 3
    - name: zip
      label: Пощенски код
      row: 4
    - name: country
      label: Държава
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: Имейл
      row: 5
      type: email
    - name: tel
      label: Тел
      row: 5
      type: tel
      withCountryCode: true
    - name: обем на поръчката
      label: Прогнозен обем на поръчката
      row: 6
      type: select
      options:
        - value: ''
          label: Колко борда пазарувате?...
        - value: one
          label: Само един борд
        - value: 2-4
          label: 2–4 борда
        - value: 5-plus
          label: 5+ борда (за семейство, клуб или наем)
    - name: customization
      label: С какво можем да помогнем?
      row: 7
      type: select
      options:
        - value: ''
          label: Изберете тема...
        - value: none
          label: Общ въпрос за продукта
        - value: sizing
          label: Помощ при избора на правилния борд
        - value: order
          label: Поръчка, плащане или доставка
        - value: warranty
          label: Гаранция или поддръжка за ремонт
    - name: интерес към продукта
      label: Категории продукти, които представляват интерес
      row: 8
      type: select
      options:
        - value: ''
          label: Изберете категория продукт...
        - value: all
          label: Всички продукти / Пълен каталог
        - value: sup
          label: SUP Дъски / Падълбордове
        - value: packages
          label: Пълни SUP комплекти
        - value: accessory
          label: Аксесоари (помпи, гребла, чанти)
    - name: subject
      label: Тема
      row: 9
    - name: message
      label: Съобщение
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Други начини да ни достигнете
  columns: 3
  items:
    - title: Помощ с поръчки
      description: Въпроси за продукта, съвети за размери и поддръжка на поръчки.
      icon: tabler:shopping-bag
    - title: Техническа поддръжка
      description: Гаранция, ремонти, резервни части и въпроси относно експлоатацията.
      icon: tabler:tool
    - title: Преса и партньорства
      description: Медийни пакети, спонсорство и индустриално сътрудничество.
      icon: tabler:news
    - title: Телефон
      description: +1 279 732 3333 (САЩ главен офис) · +86 13305324192 (фабрика)
      icon: tabler:headset
    - title: Имейл
      description: info@paddleboardoverstock.com
      icon: tabler:mail
    - title: Глобален главен офис и фактуриране
      description: Уейхай Донгджилиан ООД
      icon: tabler:map-pin
map:
  title: Нашето местоположение
  subtitle: Посетете нашия производствен център в Уейхай
  address: Уейхай, Шандонг, Китай
  zoom: 15
