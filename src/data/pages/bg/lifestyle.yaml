hero:
  tagline: начин на живот
  title: The Paddle Board Overstock<br />начин на живот
  subtitle: Създаден за тези, които живеят на вода — от уикенд изследователи до търговски оператори, които разчитат на оборудването си всеки ден.
values:
  - icon: 🌊
    title: Роден на водата
    desc: Всеки дизайн започва с разбирането на поведението на водата. Инженерстваме от ръба на условията навътре — защото океанът е нашият учител, а не работното ни място.
  - icon: 🔧
    title: Построен да издържи
    desc: Най-устойчивият продукт е този, който не се нуждае от подмяна. Морски материали, drop-stitch керни с капацитет 15 PSIи шевове, които издържат през целия сезон.
  - icon: 🏆
    title: Достъпно чрез дизайн
    desc: Водните спортове не трябва да са лукс. Професионално представяне на цена, която има смисъл за семейства, водачи и малки оператори — не само за търговски автопаркове.
  - icon: 🌍
    title: Глобална общност
    desc: 'От крайбрежието на Циндао до езера в Европа, реки в Югоизточна Азия и заливи в Америка — нашите клиенти споделят едно: любов към това да са на водата.'
  - icon: ♻️
    title: Отговорно производство
    desc: CNC-Оптимизираното гнездене намалява материалните отпадъци под 5%. Издръжливата конструкция намалява циклите на подмяна. Строим за дълготрайност, защото това е най-устойчивият избор.
  - icon: 🤝
    title: Подкрепа, която трае
    desc: Двадесетгодишните корпуси все още ни търсят резервни части. Гаранционният ни отговор е средно 24 часа. Не изчезваме след продажбата — тук сме за целия живот на продукта.
