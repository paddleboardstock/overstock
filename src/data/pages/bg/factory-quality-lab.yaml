hero:
  tagline: Лаборатория за контрол на качеството
  title: Тестова лаборатория и осигуряване на качеството
  subtitle: Независима лаборатория за контрол на качеството — всяко устройство се тества преди изпращане
intro: Paddle Board Overstock управлява специализирана лаборатория за контрол на качеството, която работи независимо от производството. Всяка партида суровини и всяка готова дъска преминават през документирани протоколи за инспекция преди пускане в употреба. Екипът за контрол на качеството докладва директно на ръководството, осигурявайки безпристрастни решения за качеството.
highlights:
  - value: 100%
    label: Устройства подложени на тест за налягане
    detail: Всяка камера, всяка дъска
  - value: 48 h
    label: Продължителност на теста за задържане на въздух
    detail: При 1,25× номинално налягане
  - value: <5%
    label: Максимално допустим спад на налягането
    detail: През 24-часов период на задържане
  - value: 99.3%
    label: Бездефектен процент
    detail: Доставки през последните 12 месеца
test_procedures:
  - title: Инспекция на суровини
    description: Всяка постъпила партида PVC, drop-stitch плат, EVA пяна и хардуер се тества преди приемане. Проверяват се якост на опън, устойчивост на разкъсване и устойчивост на UV. Несъответстващите материали се изолират и връщат.
    standards:
      - Якост на опън (минимум 350 N/cm)
      - Устойчивост на разкъсване
      - Устойчивост на UV (1,000 ч)
  - title: Контролни точки по време на процеса
    description: Операторите в производството извършват самоконтрол на всеки етап. Одиторите по КК провеждат случайно пробонабиране през целия работен цикъл. Тестове за отлепване на заварките се извършват на всеки 50 единици. Проверка на размерите се извършва на всеки 20-ти панел.
    standards:
      - Тест на обелване на всеки 50 единици
      - Вътрешен контролен списък с 100 точки
      - Контролни проверки чрез случайна извадка
  - title: 48-часов тест за задържане на въздуха
    description: Всеки отсек на тръбата се напомпва до 125% от номиналното налягане и се поддържа за 48 часа. Датчиците за налягане регистрират непрекъснато с компенсация за температурата. Всяка камера, която надвиши 5% спад на налягането, задейства автоматична повторна инспекция на партидата.
    standards:
      - Задържане на 1.25x номинално налягане
      - Максимална загуба на налягане <5%
  - title: Тестване на натоварване и баланс
    description: Завършените дъски се тестват при максималния номинален капацитет за стабилност, свободен борд и манипулиране. Всяка дъска преминава воден тест преди окончателното одобрение на инспекцията.
    standards:
      - Проверка на натоварването при 1.25x номинално
      - Тестване на вода
equipment:
  - name: Универсална изпитвателна машина (разтегателна)
    spec: Капацитет 5 kN
  - name: Тестер за загуба на налягане
    spec: Много канала, 0–50 psi, с водене на данни
  - name: UV Камера за стареене
    spec: UVA-340, 1 000 ч цикли
  - name: Дебеломер (дигитален)
    spec: Резолюция 0,01 мм
  - name: Тестер за обелване (заварка)
    spec: Моторизиран, капацитет 50 N
  - name: Температурна камера
    spec: -40 °C до + 100 °C
  - name: Резервоар за откриване на течове
    spec: 6 м × 2 м, осветен
