features3_brand:
  tagline: Кои сме ние
  title: Основи на марката<br /> & Наследство
  subtitle: Историята, експертизата и глобалното покритие, които определят Paddle Board Overstock като доверен SUP бранд.
  isBeforeContent: false
  columns: 3
  items:
    - title: За Paddle Board Overstock
      description: Основана през 2012 г. в Уейхай, Китай. От крайбрежна работилница до съоръжение от 12 000 м² — пълната история на Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: История на марката
      description: Как един екип от морски инженери се зае да направи професионални надуваеми бордове за гребане достъпни по целия свят.
      icon: tabler:book
      link: /brand-story
    - title: Експертиза в морската индустрия
      description: Дълбока материална наука, прецизно производство и тестове в реални условия — десетилетия морско инженерство във всеки борд.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Защо Paddle Board Overstock
      description: Какво ни отличава — качество, персонализация, директни фабрични цени и пълна подкрепа за всеки гребец.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Нашият екип
      description: Запознайте се с ръководството — морски инженери, специалисти по материали и експерти по производство, които движат Paddle Board Overstock напред.
      icon: tabler:users
      link: /brand/team
    - title: Инженерен екип
      description: 78+ комбинирани години в научноизследователска и развойна дейност, 40+ платформи, 1 200+ инженерни проекта. Техническият екип зад всеки продукт.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Доверие и качество
  title: Качество, Тестване<br />& Доказателство
  subtitle: Стриктно тестване, реални тестови данни и доказателства, които показват нашата ангажираност към качеството.
  isBeforeContent: false
  columns: 3
  items:
    - title: Качество и тестване
      description: Всеки продукт е тестван под налягане преди изпращане. Здравина на шева, UV устойчивост, плавучест — проверено на всеки етап.
      icon: tabler:clipboard-check
      link: /quality
    - title: Доказателства и доказателства
      description: Резултати от тестове, снимки от внедряване, доклади от инспекции от трети страни и казусни изследвания, потвърждаващи качеството на Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Графика на знанието
      description: Разгледайте графа на обект Paddle Board Overstock — продукти, технологии, материали и взаимоотношения в свързана база от знания.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Ръководство
  title: Запознайте се с екипа<br />Зад Paddle Board Overstock
  subtitle: Отраслова експертиза, обхващаща морско инженерство, наука за материалите, управление на качеството и глобална електронна търговия.
  isBeforeContent: false
  columns: 3
  items:
    - title: Тоби Лю — основател и главен изпълнителен директор
      description: 15+ години в морското производство. Преди това ръководи R&D в голям китайски производител на морска техника. Притежава множество патенти в дизайна на надуваеми продукти.
      icon: tabler:crown
    - title: Чжан Уей — главен инженер
      description: 20+ години в обработката на полимери и проектирането на надуваеми конструкции. Бивш технически директор в европейска морска инженерна фирма.
      icon: tabler:engine
    - title: Чен Минг — ръководител на R&D
      description: Доктор по материалознание. Специализира в drop-stitch технологии и високочестотно заваряване. 10+ години в текстилни композити.
      icon: tabler:flask
    - title: Лю Цян — Директор на продукцията
      description: 18+ години в тясно насочено производство. Въведени стриктни системи за качеството във всички производствени линии.
      icon: tabler:settings
    - title: Уанг Фан — Мениджър по качеството
      description: 12+ години в морския контрол на качеството. Ръководи вътрешни одити на качеството. Надзор върху тестовете за всяка производствена серия.
      icon: tabler:shield-check
    - title: Хелън Лий — Директор продажби
      description: 15+ години в международната електронна търговия и логистика. Доставя дъски на гребци в 50+ страни. Владее 4 езика.
      icon: tabler:briefcase
