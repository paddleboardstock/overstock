features3_brand:
  tagline: Кои сме ние
  title: Основи на марката<br />и наследство
  subtitle: Историята, експертизата и световният обхват, които определят Paddle Board Overstock като доверен производител на морско оборудване.
  isBeforeContent: false
  columns: 3
  items:
    - title: Около Paddle Board Overstock
      description: Основана през 2012 г. в Циндао, Китай. От крайбрежна работилница до съоръжение от 12 000 м² — цялата история на Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: История на марката
      description: Как екип от морски инженери решава да направи професионални надуваеми водни съдове достъпни по целия свят.
      icon: tabler:book
      link: /brand-story
    - title: Експертиза в морската индустрия
      description: Задълбочена материалознание, прецизно производство и реални тестове — десетилетия морско инженерство във всеки корпус.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Глобално присъствие
      description: Обслужваме 50+ държави на всички континенти. Регионална експертиза за местните регулаторни изисквания и пазарни предпочитания.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Защо Paddle Board Overstock
      description: Какво ни отличава — качество, персонализиране, директни заводски цени и пълна поддръжка за търговски оператори.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Нашият екип
      description: Запознайте се с ръководството — морски инженери, материални учени и експерти по производство, които движат Paddle Board Overstock напред.
      icon: tabler:users
      link: /brand/team
    - title: Инженерен екип
      description: 78+ общо години в НИРД, 40+ платформи, 12 сертификата, 1200+ OEM проекта. Техническият екип зад всеки продукт.
      icon: tabler:engine
      link: /engineering-team
    - title: Център за научноизследователска и развойна дейност
      description: Инженерство на корпуси, RF заваряване, PVC лаборатория, прототипиране, тестов резервоар и лаборатория за качество — нашето пълно изследователско и развойно съоръжение.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Доверие и качество
  title: Сертификати, Качество<br />& Доказателство
  subtitle: Независими сертификати, щателни тестове и реални доказателства, които демонстрират нашата ангажираност към качеството.
  isBeforeContent: false
  columns: 3
  items:
    - title: Сертификати
      description: CE, ISO 9001, UKCA, BSCIREACH , — пълна сертификационна документация и съответствие за глобалните пазари.
      icon: tabler:shield-check
      link: /certifications
    - title: Качество и тестване
      description: Всеки продукт е тестван под налягане преди изпращане. Здравина на шева, UV устойчивост, плавучест — проверено на всеки етап.
      icon: tabler:clipboard-check
      link: /quality
    - title: Доказателства и доказателства
      description: Резултати от тестове, снимки от внедряване, доклади за инспекции от трети страни и казуси, Paddle Board Overstock валидиращи качеството.
      icon: tabler:file-check
      link: /evidence
    - title: Графика на знанието
      description: Разгледайте Paddle Board Overstock графа на обекти — продукти, технологии, сертификати и взаимоотношения в свързана база знания.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Ръководство
  title: Запознайте се с екипа<br />Зад Paddle Board Overstock
  subtitle: Експертиза в индустрията, обхващаща морско инженерство, материалознание, управление на качеството и B2B глобална търговия.
  isBeforeContent: false
  columns: 3
  items:
    - title: Тоби Лю — основател и главен изпълнителен директор
      description: 15+ години в морското производство. Преди това е ръководил научноизследователска и развойна дейност в голям китайски производител на лодки. Притежава множество патенти за проектиране на надуваеми лодки.
      icon: tabler:crown
    - title: Чжан Уей — главен инженер
      description: 20+ години в PVCHypalon / изработка и проектиране на корпуси с дълбоки V. Бивш технически директор в европейска морска инженерна фирма.
      icon: tabler:engine
    - title: Чен Минг — ръководител на R&D
      description: Доктор по материалознание. Специализира в drop-stitch технологии и високочестотно заваряване. 10+ години в текстилни композити.
      icon: tabler:flask
    - title: Лю Цян — Директор на продукцията
      description: 18+ години в lean производство. Six Sigma черен колан. Внедрени ISO системи за качество 9001 във всички производствени линии.
      icon: tabler:settings
    - title: Уанг Фан — Мениджър по качеството
      description: 12+ години в морския контрол на качеството. CE Сертифициран и ISO одитор. Наблюдава тестването за всяка производствена партида.
      icon: tabler:shield-check
    - title: Хелън Лий — Директор продажби
      description: 15+ години в B2B международната търговия. OEMУправляван /ODM партньорства в 30+ държави. Владее свободно 4 езика.
      icon: tabler:briefcase
