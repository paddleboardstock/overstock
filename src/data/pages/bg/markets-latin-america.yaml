hero:
  tagline: Латинска Америка
  title: SUP Едрови платки за<br />Латиноамерикански търговци на дребно
  subtitle: Чисто нови излишни падълбоки дъски за плажни магазини, автопаркове под наем и онлайн продавачи в цяла Латинска Америка — от 5 дъски, смесени модели, експресни или морски товари.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Излишни SUP бордове за латиноамерикански търговци на дъски
direct_answer: Paddle Board Overstock доставя чисто нови надуваеми SUP дъски с излишък на малки търговци в Латинска Америка — от Мексико и Бразилия до Колумбия, Перу, Чили и Аржентина. Поръчките на едро започват от 5 дъски с добре дошли смесени модели, а всяка поръчка се изпраща от Вейхай, Китай чрез експресен въздушен товар или консолидиран морски транспорт. Дъските са 100% тествани под налягане и се покриват от 2-годишната SUP гаранция.
tldr_points:
  - Едро от 5 платки — смесени модели в една поръчка, цени според общото количество
  - Експресен въздушен или консолидиран морски товар от Вейхай, Китай
  - Пазари на испански и португалски език, обслужвани в целия регион
  - 100% тестван под налягане, 2-годишна SUP гаранция на всяка платка
overview_section:
  tagline: Обзор на пазара
  title: SUP Латиноамериканският пазар
  paragraphs:
    - Латинска Америка е един от най-бързо растящите пазари за стендъп гребане в света. Дългите крайбрежия на два океана, утвърдените икономики на плажния туризъм и силната култура на бордовите спортове дават на независимите търговци от Тулум до Флорианополис нарастваща база от клиенти — туристи, които взимат първия си урок, уикенд гребци и нарастваща местна SUP общност по състезания и сърф спорт.
    - The retail landscape is dominated by small and mid-sized independent shops: Училища за гребане на плажа, които продават това, което наемат, магазини за сърф SUP добавят линии, а онлайн продавачи за първи път внасят директно. Тези бизнеси рядко се нуждаят от пълни контейнери от един модел — нуждаят се от 5–20 дъски на поръчка, смесени между универсални модели, подходящи за начинаещи, и няколко премиум издания.
  customer_types:
    - title: Търговци в Бийч Таун
      description: Магазините в курортните градове, обслужващи туристи — те се нуждаят от издръжливи дъски за начинаещи в голям обем, плюс няколко премиум модела за изложба и продажба.
    - title: Училища за гребла и флоти под наем
      description: Училищата съчетават уроци с търговия на дребно, а флотилията под наем обновяват дъски всеки сезон с поръчки от смесени модели.
    - title: Онлайн продавачи
      description: Продавачи на електронна търговия на испански и португалски език въвеждат SUP категорията на националния си пазар без риск на мащаб на контейнери.
shipping_section:
  title: Кораб до Латинска Америка
  paragraphs:
    - Поръчките се изпращат от нашата логистична база в Уейхай, Китай. Експресни въздушни костюми, 1–3 бордови поръчки и спешни запаси; консолидираният морски товар е икономичният маршрут за 5–20 поръчки на едро до големи пристанища в региона.
    - Ние предоставяме пълни и точни износни документи — търговска фактура и списък за опаковане — за да поддържаме митническите процедури гладки. Вносните мита и данъците се определят от вашата страна и се плащат от вносителя; никога не включваме неясни обещания "данъци включени" в оферта за товар.
  customs_note: Правилата за внос и митните ставки варират значително в различните латиноамерикански страни. Проверете текущия режим на внос във вашата страна за надуваеми водни спортни уреди преди поръчка и ни помолете за допълнителни документи, които вашият брокер изисква.
faq_section:
  title: Често задавани въпроси в Латинска Америка
  items:
    - q: Може ли да получа оферта на испански или португалски?
      a: Нашият екип работи с купувачи в цяла Латинска Америка и може да обработва оферти и потвърждаване на поръчки за клиенти, говорещи испански и португалски. Попитайте в запитването си.
    - q: Изпращате ли до моята страна в Латинска Америка?
      a: Доставяме в целия регион — Мексико, Бразилия, Колумбия, Перу, Чили, Аржентина, Еквадор и отвъд. Потвърдете точната си дестинация в заявката за оферта и ние ще проверим текущото товарно обслужване.
    - q: Какъв е минималният едро за латиноамерикански търговци на дребно?
      a: Общо пет плочи, като може да се смесват всички налични модели. Този брой определя вашия ценови клас — можете да комбинирате всестранни, туристически и арт издания в една пратка.
    - q: Кой плаща вносните мита в моята страна?
      a: Вие, като вносител, според правилата на вашата страна. Ние предоставяме коректни, пълни документи (търговска фактура, опаковъчен лист), за да е предвидимо преминаването през митницата — вижте нашата страница за международни доставки за пълна информация.
