features3_cases:
  tagline: Избрани случаи
  title: Поръчкови решения<br />За реални предизвикателства
  isBeforeContent: false
  columns: 3
  items:
    - title: Ежедневно обновяване на гмуркаческия център в Бали
      customer: Център за гмуркане Blue Ocean
      country: Индонезия
      industry: Търговски център за гмуркане
      challenge: Blue Ocean Diving Center в Бали оперираше по-стара лодка от фибростъкло с ограничено пространство на палубата, трудно качване на гмуркачи и висока поддръжка в тропически соленови условия. Зареждането на оборудването беше претъпкано, времето за подготовка беше дълго, а нестабилната платформа създаваше проблеми за безопасността на международните туристи — включително за първи път гмуркачи и по-възрастни пътници. Центърът организира 3-5 гмуркащи пътувания дневно, 200+ дни в годината.
      solution: Paddle Board Overstock достави персонализирана 6.8-метрова професионална RIB гмуркаческа с разширена палуба, оптимизирана за съхранение на оборудване за гмуркане, широка неръждаема стоманена стълба за гмуркане, здрави Hypalon тръби за UV устойчивост на солена вода, неплъзгаща се повърхност и решение за съхранение в резервоари. Конфигурацията беше проектирана според ежедневния работен процес на гмуркащия център — не базирана на стандартно разположение на развлекателна лодка.
      product: 6.8 м професионално гмуркане RIB
      results: По-голямата работна площ подобри ефективността на подготовката на оборудването. Водолазите имаха по-безопасно и по-лесно качване на борда. Изискванията за поддръжка намаляха значително. Центърът придоби капацитет да обслужва повече клиенти през пиковия сезон с по-голяма увереност. RIB Това стана основата на ежедневните гмуркащи операции.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Нашата водолазна лодка не е само транспорт. Тя е основата на ежедневната ни дейност.Paddle Board Overstock RIB Дава на екипа ни повече увереност при провеждане на множество гмуркачески пътувания всеки ден.
      icon: tabler:lifebuoy
    - title: Професионален ъпгрейд на Центъра за гмуркане в Пукет RIB
      customer: Център за гмуркане Ocean Explorer
      country: Тайланд
      industry: Търговски център за гмуркане
      challenge: Ocean Explorer Diving Center в Пукет, Тайланд, трябваше да премине от традиционна фибростъклена гмуркателна лодка, която не можеше да отговори на нарастващото търсене от клиенти. Ограниченото пространство на палубата правеше подготовката на оборудването неефективно. Трудното качване създаваше предизвикателства за безопасността за международните туристи. Високите изисквания за поддръжка в тропически солена вода увеличаваха оперативните разходи. Центърът извършва множество ежедневни пътувания, 200+ дни в годината.
      solution: Paddle Board Overstock достави персонализирана 6.8-метрова комерсиална RIB гмуркачка с оптимизирано разпределение на работната палуба за съхранение на водолази, подготовка на оборудване и движение на водолазите. Характеристиките включваха широка водолазна стълба с неръждаеми стоманени парапети, здрава конструкция от тръби с UVустойчиви материали, неплъзгащ под, решение за съхранение на резервоари, професионална конзола и пътнически седалки — всичко това конфигурирано за търговски гмуркащи операции.
      product: 6.8 м Комерсиално гмуркане RIB
      results: По-голямата палубна площ позволи по-бърза организация на оборудването и по-ефективен ежедневен работен процес. Комфортът и безопасността при качване на клиентите значително се подобриха. Времето за поддръжка намали с морско строителство. Центърът за гмуркане можеше да обслужва повече клиенти през пиковия сезон и да разшири професионалните услуги по гмуркане с увереност.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: За гмуркачен център лодката не е просто транспорт. Тя е важна част от ежедневната ни дейност.Paddle Board Overstock RIB Дава увереност на нашия екип да провежда множество гмуркачески пътувания всеки ден с по-добра безопасност и ефективност.
      icon: tabler:lifebuoy
    - title: Флот на Европейския водолазен център
      customer: Dive центрове BlueMed
      country: Гърция
      industry: Гмуркане и морски туризъм
      challenge: Изисквани 12 конфигурирани за гмуркане RIBs за верига от гмуркачески центрове на няколко гръцки острова. Всяка лодка се нуждаеше от индивидуална стълба за гмуркане, място за съхранение на 8 бутилки и стабилна платформа за влизане на водолази в открито море. Флотилията трябваше да пристигне в рамките на 60 дни за началото на туристическия сезон.
      solution: Произведени 12 модела RIB 520 Dive с интегрирани стелажи за бутилки, стълби за гмуркане и допълнително широки Hypalon тръби за стабилност при качване. Всяка лодка беше брандирана с цветовете на флотилията на клиента. Всички 12 лодки бяха тествани за налягане и изпратени от Циндао в рамките на 55 дни.
      product: RIB 520 Гмуркане
      results: Всички 12 лодки бяха доставени навреме за туристическия сезон. Флотилията е в ежедневна експлоатация в продължение на 18+ месеца без никакви материални повреди. Клиентът поръча 6 допълнителни единици през втората година.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: RIB 520 Dive е гръбнакът на ежедневните ни гмуркачески операции. Стабилността в покой е отлична, а разположението на резервоарите за съхранение поддържа палубата чиста и безопасна за нашите гости.
      icon: tabler:lifebuoy
    - title: Австралийска програма за дистрибутори OEM
      customer: Pacific Watersports Pty Ltd
      country: Австралия
      industry: OEM/ODM Производство
      challenge: Австралийският дистрибутор се нуждаеше от SUP частна марка платки на конкурентни цени, за да се конкурира с китайските марки директно към потребителя. Изискваха се 8 уникални модела, обхващащи от начинаещи до напреднали модели, с персонализирана графика, персонализирана опаковка и изпълнение чрез дропшип до търговски обекти.
      solution: Разработени са 8 SUP модела (All-Around, Touring, Yoga, Kids, Sport, Ultra-Compact, Ultra-Stable, Whitewater) с ексклузивен австралийски графичен пакет. Персонализирана опаковка за търговия на дребно с QR кодове, водещи към видеа за настройка. Drop-ship логистика, конфигурирана директно от Циндао към австралийските магазини на дребно.
      product: SUP Custom Line (8 модела)
      results: Концепцията за първа доставка след 90 дни. Процент на продажба на дребно от 85% през първия сезон. Дистрибуторът разшири партньорството, включвайки линия надуваеми лодки през втората година.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: достави Paddle Board Overstock пълна SUP линия за 90 дни — от първоначалния дизайн до търговския етаж. Качеството отговаря на марки, продаващи се на два пъти по-висока цена.
      icon: tabler:arrows-exchange
    - title: Снабдяване с спасителни лодки за Близкия изток
      customer: Национален орган за гражданска отбрана
      country: Обединените арабски емирства
      industry: Търсене и спасяване
      challenge: Организацията за гражданска отбрана се нуждаеше от 20 патрули, RIBs готови за крайбрежно търсене и спасяване, охрана на пристанища и реакция при наводнения. Изискваха се самоизолиращи палуби, пълни навигационни системи (GPS, радар, VHF), оранжеви тръби с висока видимост и съответствие с местните морски регулации.
      solution: Доставени са 20 RIB модела 450 Patrol с палуби за самоизпускане, навигационни комплекти Garmin, LED прожектори, SOLAS отразяваща лента и оранжеви тръби с висока Hypalon видимост. Всяка лодка беше CEсертифицирана и тествана по ISO стандарт 6185. Пакетът с документация включваше сертификати за съответствие за местна регистрация.
      product: RIB Патрул 450
      results: Флотът беше разположен на 5 крайбрежни станции. Лодките оперират при екстремна жега (45°C+) без деградация на тръбите. Обхватът на патрулиране и ефективността на гориво надвишават спецификациите с 12%.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rescue-operations.webp
      quote: RIB Патрулът 450 надмина нашите оперативни изисквания. При екстремни горещи Hypalon условия тръбите не показват признаци на UV деградация след 24 месеца ежедневна употреба.
      icon: tabler:alert-triangle
    - title: OEM Европейско партньорство за бранд
      customer: North Sea Marine Equipment BV
      country: Нидерландия
      industry: OEM/ODM Производство
      challenge: Утвърдената европейска морска марка искаше да се разшири на RIB пазара без да инвестира в производствени мощности. Трябваше партньор с бял етикет, способен да произведе 5 RIB модела (от 3.9 до 6.2 млн) с частна марка, CE сертификация и ексклузивни права за разпространение в ЕС.
      solution: Установен е договор за производство с бял етикет за 5 RIB модела. Всеки модел е брандиран с лога и цветова схема на клиента.CE Изготвяна сертификационна документация за всеки модел. Предоставени са изключителни права за дистрибуция в ЕС с минимални ангажименти по поръчки. Техническа документация и каталог на резервни части, предоставени за местната сервизна мрежа.
      product: RIB Custom Line (5 модела)
      results: Подписано е многогодишно споразумение. Първият производствен тираж от 50 броя беше изпратен в рамките на 75 дни. Марката беше представена на METSTRADE с положителен прием от дилърите.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Работата ни Paddle Board Overstock позволи да RIB навлезем на пазара без да строим фабрика — те предоставиха цялостно решение с CE сертификат и документация за поддръжка на дилърите.
      icon: tabler:building
    - title: Карибски курортен флот
      customer: Парадайз Айлънд Ризортс ООД
      country: Бахамите
      industry: Морски туризъм и хотелиерство
      challenge: 'Луксозният курорт се нуждаеше от пълен флот от водни спортове за дейности на гостите: 40 SUP дъски за екскурзоводни турове, 20 каяка за изследване на лагуните, 10 надуваеми лодки за трансфери на гости и риболовни екскурзии, плюс аксесоари. Цялото оборудване изискваше персонализирано брандиране на курорта и трябваше да бъде доставено преди пиковия туристически сезон.'
      solution: 'Произведен е пълен пакет за водни спортове: 40 SUP дъски Voyager (универсален модел), 20 каяка Explorer, 10 AirDeck надуваеми лодки 360, плюс PFD, гребла, помпи и ремонтни комплекти. Цялото оборудване е отпечатано с лого на курорта и тропическа цветова схема. Контейнеризирана пратка с пълен инвентарен манифест.'
      product: Пълен пакет за водни спортове (70+ единици)
      results: Флотът пристигна 6 седмици преди пиковия сезон. Оценките на гостите за водни спортове се увеличиха с 40% спрямо годината. Оборудването издържа 3 сезона само с рутинна поддръжка.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
      quote: Подходът с пълен пакет означаваше, че получихме всичко необходимо в една пратка — дъски, каяци, лодки и аксесоари, всички брандирани и готови за използване от гостите. Нашите гости обожават качеството на оборудването.
      icon: tabler:beach
    - title: Модернизация на Търговския гмуркачен център в Куинсланд RIB
      customer: Търговски център за гмуркане
      country: Австралия
      industry: Търговски гмуркания и морски услуги
      challenge: Търговски център за гмуркане, базиран в Куинсланд, специализиран в инспекция на морска инфраструктура, поддръжка на пристанища и подводни ремонти, оперираше остарял работен кораб. С нарастването на търсенето на проекта старият кораб стана тежест — честата поддръжка причиняваше прекъсвания в графиците, макетът не беше проектиран за съвременни гмуркащи операции (ограничено място за цилиндри, инструменти и оборудване), а комфортът на екипажа по време на дълги операции беше нисък. Компанията се нуждаеше от плавателен съд, който да поддържа професионалните им операции всеки работен ден.
      solution: Paddle Board Overstock проведе подробен оперативен анализ на гмуркаческия работен процес на клиента, типичната продължителност на проекта, размера на екипажа и изискванията за оборудване. Въз основа на този анализ Paddle Board Overstock беше доставен персонализиран RIB професионалист с функционално разпределение на палубата, оптимизирано за подготовка на оборудване и движение на водолазите, професионални места за по-дълги транспортни периоди, подобрена стабилност за по-безопасно влизане и излизане на водолазите и интегрирани функции за поддръжка на гмуркането.
      product: Персонализирано професионално гмуркане RIB
      results: Новата RIB платформа се превърна в надеждна ежедневна работна платформа. Подготовката на оборудването стана по-бърза с оптимизираното разпределение. Екипажът съобщи за подобрен комфорт и безопасност по време на дълги операции. Професионалният вид на лодката засили увереността на клиентите при работа с пристанищни оператори и морски изпълнители. Гмуркаченият център получи плавателен съд, който отговаряше на професионализма на тяхната услуга.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-450-patrol-boat.webp
      quote: Нуждаехме се от лодка, която да поддържа бизнеса ни всеки ден, а не просто плавателен съд за транспорт.Paddle Board Overstock Работиха с нас, за да разберем оперативните ни изисквания и предоставиха RIB решение, което пасва на нашия търговски гмуркачен работен процес.
      icon: tabler:lifebuoy
    - title: Договор за крайбрежна патрулна служба на САЩ
      customer: Атлантическа агенция за крайбрежна сигурност
      country: САЩ
      industry: Морска сигурност и правоприлагане
      challenge: Американската агенция за крайбрежна сигурност изискваше тежък патрул за операции по RIBs прихващане на открити води. Необходима беше конфигурация на двудвигателен двигател за резервиране, бронирана конзола за защита на екипажа, военна електроника (криптирани комуникации, FLIR, радар) и съответствие с регулациите на Бреговата охрана на САЩ.
      solution: Проектиран RIB 600 Патрул с двойна конфигурация на външни двигатели 115 HP, бронирана конзола с балистична защита, FLIR термално изображение, криптирани VHF/UHF комуникации и интегрирани монтажни точки за оръжие. Корабът е подсилен за маневри при висока скорост. Всичката електроника е интегрирана и тествана във фабриката. Предоставена е документация за съответствие с USCG.
      product: RIB 600 Патрул (с два двигателя)
      results: Лодките достигнаха максимална скорост от 52 възела по време на приелищните изпитания. Агенцията съобщи 95% готовност за мисии през първите 12 месеца. Поръчка за още 8 единици е направена.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
      quote: Двойният двигателен RIB 600 осигурява на екипажите ни необходимата скорост и резервираност за операции по прихващане в открити води. Бронираната конзола предоставя критична защита без да компрометира производителността.
      icon: tabler:shield
