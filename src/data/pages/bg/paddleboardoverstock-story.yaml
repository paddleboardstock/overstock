hero:
  tagline: Нашата история
  title: Paddle Board Overstock — Инженерство на свободата върху вода
  subtitle: 'От крайбрежна работилница до глобален производител на морска екипировка — нашето пътуване е изградено върху упорита вяра: падъл бордовете трябва да се проектират така, сякаш имат значение, защото имат.'
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock фабрика и съоръжение за морско производство в Уейхай
