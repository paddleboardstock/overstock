timeline:
  - year: '2012'
    title: Фондация за морско производство
    body: Paddle Board Overstock започна като специализирана работилница за надуваеми падъл бордове в Уейхай, Китай, ангажирана с морското майсторство и производството на бордове. Първоначалният фокус беше върху създаването на надеждни надуваеми продукти чрез практичен инженеринг и производствена дисциплина.
  - year: '2015'
    title: Първи износи
    body: Първоначалните износни поръчки достигнаха до Япония и Корея, маркирайки навлизането на Paddle Board Overstock на международните пазари. Компанията започна да обслужва гребци и любители на водни спортове извън Китай.
  - year: '2018'
    title: Разширяване на фабриката
    body: Преместен в производствено съоръжение с площ 12 000 m². Добавени RF заваръчни линии и drop-stitch производствен капацитет, позволявайки по-мащабно производство и подобрени системи за контрол на качеството.
  - year: '2020'
    title: Създаване на изследователски и развоен център
    body: Откри специализиран изследователски и развоен център с PVC лаборатория за тъкани, хидродинамичен тестов резервоар и студио за симулация на CAD/FEA. Разработката на продуктите се разшири с фокус върху лека конструкция, подобрена издръжливост и дизайн, ориентиран към потребителя.
  - year: '2022'
    title: Глобален растеж
    body: Разширяване до 14 R&D инженери и 200+ работници. Бордовете достигнаха до гребци в Европа, Америка и Азия-Тихоокеанския регион, като се доставяха в 50+ страни.
  - year: '2024'
    title: Студио за иновации и дизайн
    body: Стартира пълноценна студия за дизайн и иновации за нови серии бордове, от концепцията до производството. Разширихме нашите характерни настилки от арт-серията и платформи за туринг.
  - year: '2026'
    title: Изграждане на бъдещето на водните изследвания
    body: Днес Paddle Board Overstock продължава да разработва надуваеми SUP бордове, гребно оборудване и персонализирани морски решения — свързвайки хора и организации с водите на света. Обслужвани 50+ страни, годишен капацитет от 15 000 единици.
content_founding:
  tagline: Началото
  title: Роден на крайбрежието
  subtitle: 'Paddle Board Overstock започна в крайбрежна работилница в Уейхай с един борд и визия: да създаде надуваеми падъл бордове, които могат да издържат на реални морски условия.'
  paragraphs:
    - През 2012 г. нашите основатели видяха пропуск на пазара — повечето надуваеми бордове бяха или достъпни, но ненадеждни, или висококачествени, но непосилно скъпи. Те вярваха, че има място за производител, който предлага както качество, така и стойност.
    - Първият корпус беше построен на ръка, тестван в местни води и усъвършенстван въз основа на реални отзиви от рибари и малки търговски оператори. Този цикъл на обратна връзка — изграждане, тестване, слушане, подобряване — остава в основата на нашата инженерна философия и днес.
    - До 2015 г. вестта се разпространи извън Уейхай. Рафтери и магазини за водни спортове из цяла Азия започнаха да поръчват дъски. Това, което започна като местна работилница, се превръщаше в глобална марка.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock ранна производствена работилница и производство
content_growth:
  tagline: Растеж и иновации
  title: От работилница до съоръжение от 12 000 м²
  subtitle: Непрекъснатите инвестиции в хора, оборудване и процеси преобразиха Paddle Board Overstock в модерно морско производствено съоръжение.
  paragraphs:
    - С нарастването на търсенето нарасна и нашето производствено съоръжение. Разширихме се от малка работилница до фабрика с размер 12 000 м² с отделни производствени линии за SUP дъски, аксесоари и защитно оборудване.
    - Инвестирахме в CNC машини за рязане, високочестотно заваръчно оборудване, производствени линии с дроп шевове и комплексни тестови платформи — което ни позволи да контролираме всеки аспект на качеството на производството.
    - Днес нашият екип от 200-300 души включва морски инженери, материалознание учени, специалисти по контрол на качеството и квалифицирани майстори — много от които са били с Paddle Board Overstock от самото начало.
founder:
  tagline: Запознайте се с основателя
  title: Построен от воден човек
  subtitle: Основателят Дейвид Чен съчетава производствен експертен опит и дългогодишна страст към водните спортове — комбинация, която определя как Paddle Board Overstock подхожда към развитието на продуктите.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: Дейвид Чен — основател на Paddle Board Overstock
  story:
    - Дейвид Чен израсна на крайбрежието на Уейхай, където морето не беше място за почивка, а начин на живот. Той прекара младостта си в гребане, плаване и риболов в Жълто море — преживявания, които му дадоха интуитивно разбиране за това, на какво трябва да устоят падъл дъските.
    - Преди да основе Paddle Board Overstock, Дейвид прекара десет години в морско производство, работейки в областта на производството, качеството и международната търговия. Той ръководи програми за производство и качество за европейските и северноамериканските пазари, научавайки лично очакванията на глобалните рафтъри.
    - 'През 2012 г. той основа Paddle Board Overstock с проста мисия: да създава надуваеми падъл дъски, на които би се доверил със собственото си семейство във водата. Този личен стандарт — бих ли използвал това? — остава крайната проверка за всеки продукт, който напуска фабриката.'
    - Днес Дейвид ръководи продуктовата стратегия и наблюдава екипа за НИР, лично преглеждайки новите дизайни и тестввайки прототипи на водите край Уейхай. Той вярва, че страхотните продукти идват от разбирането както на инженерството, така и на преживяването.
philosophy:
  tagline: Философия на марката
  title: Инженерна свобода на вода
  body: Свободата на вода не е само движение. Тя представлява откриване на нови места, създаване на открити преживявания, свързване на хората с природата и осъществяване на професионални мисии. Инженерството прави тази свобода възможна.
  pillars:
    - title: Надеждност на първо място
      body: Водните среди изискват доверие. Продуктите на Paddle Board Overstock са проектирани с акцент върху стабилност, издръжливост, безопасност и постоянна производителност.
    - title: Дизайн, ориентиран към човека
      body: Продуктите трябва да служат на хората, а не на технологиите. Всяко дизайнерско решение започва с разбирането как хората използват дъските си, къде изследват и пред какви предизвикателства се изправят.
    - title: Достъпно изследване
      body: Водата не трябва да принадлежи само на експертите. Paddle Board Overstock създава оборудване, което позволява повече хора да преживеят безопасно реки, езера, океани и крайбрежни среди.
    - title: Непрекъснати иновации
      body: Иновацията не е само създаване на нови продукти. Тя подобрява всеки детайл — материали, конструкции, производство и потребителско изживяване.
engineeringDna:
  tagline: Инженерна ДНК
  title: Как Paddle Board Overstock създава продукти
  areas:
    - title: Материалознание
      body: Paddle Board Overstock се фокусира върху избора на подходящи материали за различни морски среди. Основните съображения включват устойчивост на абразия, устойчивост на UV, стабилност под налягане и дългосрочна издръжливост.
      items:
        - Устойчивост на абразия
        - UV устойчивост
        - Стабилност на налягането
        - Дългосрочна издръжливост
    - title: Структурно инженерство
      body: Надуваемите падъл бордове изискват прецизен баланс между твърдост, тегло, преносимост и стабилност. Paddle Board Overstock инженерството се фокусира върху оптимизирането на тези фактори чрез drop-stitch основна технология и усъвършенствана конструкция на шевовете.
      items:
        - Твърдост
        - Оптимизация на теглото
        - Преносимост
        - Стабилност
    - title: Точност при производството
      body: 'Всеки продукт преминава през контролирани процеси: подготовка на материалите, прецизно рязане, заваряване и слепване, сглобяване, контрол на качеството и проверка на представянето.'
      items:
        - Подготовка на материалите
        - Прецизно рязане
        - Заваряване и слепване
        - Сглобяване и контрол на качеството
    - title: Инженеринг на потребителските сценарии
      body: Продуктите се разработват около реални приложения за гребане — развлечение, приключения, семейни и туристически — като се гарантира, че всяко проектиране отговаря на специфичните изисквания на предназначената среда.
      items:
        - Отдих
        - Приключения
        - семейство
        - Обикаляне
