content_scope:
  tagline: Обхват на съответствие
  title: Кои продукти са нужни<br />RCD Съответствие?
  subtitle: Директивата за рекреационни плавателни съдове 2013/53/ЕС се прилага за развлекателни плавателни съдове с дължина на корпуса между 2,5 м и 24 м. Разбирането на обхвата е първата стъпка към спазване.
  items:
    - title: RIB Лодки (2,5–24 м)
      description: Твърди надуваеми лодки с дължина на корпуса от 2,5 м до 24 м попадат под RCD. Категориите на дизайна A до D се прилагат в зависимост от предвидените морски условия и максималната сила на вятъра.
      icon: tabler:sailboat
    - title: Надуваеми лодки (под 2,5 м)
      description: Малки надуваеми лодки и дингита под 2,5 м могат да бъдат частично освободени RCD , но все пак да CE изискват маркировка според други приложими директиви и ISO строителни стандарти EN 6185.
      icon: tabler:sailboat
    - title: SUP Дъски и аксесоари
      description: Изправените гребни дъски са извън RCD обхвата. Въпреки това, свързаните с тях лични плавателни устройства (PFD) CE изискват маркиране съгласно Регламента за PPE (EU) 2016/425 с USCG одобрение от тип III/V, когато е приложимо.
      icon: tabler:swimming
    - title: Частично завършени лодки
      description: Лодки, доставени без двигател или специфични инсталации, изискват декларация от строителя за частично завършени съдове, като пълното RCD съответствие се попълва от крайния строител или вносител.
      icon: tabler:tool
content_trust_layers:
  tagline: Трислойна система за доверие
  title: Информация за съответствие<br />— Споделено на правилното ниво
  subtitle: Не всички данни за съответствие трябва да бъдат на публичен уебсайт. Следваме трислоен подход, който защитава интелектуалната собственост, като същевременно изгражда доверието на купувачите.
  items:
    - title: Слой 1 — Публичен уебсайт
      description: Реферирани стандарти, обяснени маршрути за съответствие, изброени типове документи, обхват на сертификация по моделно семейство. Няма реални сертификати, тестови данни или патентовани инженерни детайли.
      icon: tabler:world
    - title: Слой 2 — Споделяне след разследване
      description: 'След квалифицирано запитване: редактирана проба на DoC, снимка на табелата на строителя, приложим списък със стандарти, контролен списък за съответствие и обобщения на сертифициране на материали — споделени при условията на справедливо използване.'
      icon: tabler:mail
    - title: Слой 3 — NDA / Етап на поръчка
      description: Пълен технически файл, оценки на риска, изчисления за стабилност, тестови доклади, записи за партиди материали и документация за проследимост на производството — споделяни само NDA с потвърдени купувачи.
      icon: tabler:lock
content_standards:
  tagline: Приложими стандарти
  title: ISO & EN стандарти<br />Ние строим за
  subtitle: Нашите продукти се проектират и тестват спрямо хармонизирани стандарти под RCD. Стандартните номера и имена се цитират така; пълните стандартни текстове остават ISO с авторско право.
  items:
    - title: ISO EN 6185-3
      description: 'Надуваеми лодки — Част 3: Лодки с максимална моторна мощност 15 kW или повече. Изисквания за конструкция, стабилност, плавателност и възстановяване на човек зад RIBsборда за .'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Надуваеми лодки — Част 4: Лодки с максимална мощност на двигателя от 15 kW и по-голяма или равна на 4.5 kW. Допълнителни изисквания за конструкция и стабилност.'
      icon: tabler:file-text
    - title: ISO Серия 12215
      description: Малки плавателни съдове — Конструкция на корпуси и скантлинги. Структурно проектиране на корпус, палуба и прегради за корпуси от фибростъкло и алуминий RIB .
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Малки плавателни съдове — Ръководство за собственика. Задължително съдържание и формат за ръководството на собственика, придружаващи всяка RIB лодка, доставена в ЕС.
      icon: tabler:book
    - title: EN ISO 14945
      description: Малък плавателен съд — Плоча на строителя. Информация, която трябва да бъде отбелязана на плочата на строителя, постоянно прикрепена към всеки кораб.
      icon: tabler:badge
    - title: ISO 8666
      description: Малки плавателни съдове — Основни данни. Стандартизирани измервания и параметри за последователна спецификация във всички продуктови документи.
      icon: tabler:dimensions
content_process:
  tagline: Процес на съответствие
  title: 6-степенна CE съвместимост<br />Работен процес
  subtitle: От обхвата на проекта до проследимостта на серийно ниво — всеки RIB модел следва определен път на съответствие.
  steps:
    - number: '01'
      title: Обхват и класификация на проекта
      description: Дефинирайте RIB модела, категорията на дизайна (A/B/C/D), максимален брой участници, полезен товар, мощност на двигателя и целевия пазар. Определете дали RCD се прилага и кой модул за оценка на съответствието е необходим.
      timeline: 2–3 дни
    - number: '02'
      title: Идентификация на приложими изисквания
      description: Идентифицирайте всички приложими основни изисквания за безопасност от RCD Приложение I, съответните хармонизирани стандарти (EN ISO 6185, 12215, 10240, 14945) и всички допълнителни национални изисквания за целевия пазар.
      timeline: 3–5 дни
    - number: '03'
      title: Дизайн и техническа документация
      description: 'Създаване на основния технически файл: общи чертежи на подредбата, изчисления за стабилност и плаваемост, оценка на риска, спецификации на материалите и анализ на системната безопасност (гориво, електричество, управление).'
      timeline: 10–15 дни
    - number: '04'
      title: Проверка и тестване на продукти
      description: Извършване на физическа проверка — тестване на налягане при 1.25x номинално налягане за 24–48 часа, тестове за стабилност и плаваемост, тестове за натоварване и въвеждане в експлоатация на системите. Записвайте всички резултати от тестовете за всеки корпус.
      timeline: 5–7 дни
    - number: '05'
      title: Документация за маркиране и доставка
      description: CE Маркировка на афикс, табела на производителя (EN ISO 14945) и HIN/CIN (идентификационен номер на корпуса). Подгответе Декларация за съответствие на ЕС, ръководство за собственика (EN ISO 10240) и контролен списък за съответствие.
      timeline: 2–3 дни
    - number: '06'
      title: Проследимост на серийно ниво
      description: Всеки корпус получава уникален Корпусен запис, който го свързва с Главния технически файл, производствената партида, сертификатите за материали, резултатите от тестовете и крайната конфигурация. Записите, съхранявани за 10+ години RCDв .
      timeline: Продължава
content_document_cards:
  tagline: Видове документи
  title: Документ за съответствие<br />Карти
  subtitle: Това са типовете документи, които подготвяме и поддържаме за всеки CERIB сертифициран модел. Образци са налични при квалифицирано запитване.
  items:
    - title: CE / RCD Сертификат за съответствие
      description: Сертификат, специфичен за модела, потвърждаващ, че корабът отговаря на всички приложими Основни изисквания за безопасност от RCD 2013/53/ЕС, издаден от производителя с участието на уведомения орган, когато е необходимо.
      icon: tabler:certificate
    - title: Декларация за съответствие на ЕС (DoC)
      description: Подписана декларация от производителя или упълномощен представител, изброяваща приложимите директиви, стандарти, модул за съответствие и данни за уведомения орган. Изисква се за всеки модел, пуснат на пазара на ЕС.
      icon: tabler:file-check
    - title: Табела на строителя (ISOEN 14945)
      description: Постоянно закрепена табелка, показваща максимален брой хора, максимална мощност на двигателя, категория проектиране и идентификация на производителя. Трябва да остане четлива през целия живот на плавателния апарат.
      icon: tabler:badge
    - title: Ръководство на собственика (EN ISO 10240)
      description: Изчерпателен наръчник, обхващащ безопасна експлоатация, аварийни процедури, графици за поддръжка и предупреждения за безопасност. Задължително за всяко RIB доставено в ЕС.
      icon: tabler:book
    - title: ISO Доклади за тестове и инспекции
      description: Записи за тестване под налягане (1.25x / 24–48h), резултати от тестове за стабилност и плаваемост, сертификати за материални тестове и доклади за проверка на размерите — всички свързани с конкретни номера на корпуса.
      icon: tabler:test-pipe
    - title: Записи за проследимост на материалите
      description: Проследимост на ниво партида за тръбни тъкани, лепила, фибростъкло и хардуер. Свързва всяко производствено звено с постъпващи сертификати за материали и резултати от IQC инспекция.
      icon: tabler:link
    - title: Записи за инспекция на качеството и контрол на качеството
      description: 100-точков контролен списък за качество на единица, записи за контрол на качеството в процеса, доклади за несъответствие и коригиращи действия. Част от веригата за проследимост на продукцията.
      icon: tabler:clipboard-check
    - title: Пакет с проектни документи
      description: Пакет документация за всеки корпус, включващ окончателна конфигурационна запис, детайли за инсталация на двигатели и оборудване, контролен списък за въвеждане в експлоатация и документация за доставка.
      icon: tabler:package
content_design_categories:
  tagline: RCD дизайн категории
  title: Категория на дизайна A–D<br />— Какво означават
  subtitle: Той RCD присвоява категории на дизайна въз основа на максималната сила на вятъра и значителната височина на вълната, която апаратът е проектиран да издържа.
  items:
    - title: Категория А — Океан
      description: Проектиран за продължителни пътувания, при които силата на вятъра може да надвиши Beaufort 8 (>40 възела) и значителна височина на вълната може да надвишава 4 м. Изисква най-строга проверка на конструкцията и стабилността.
      icon: tabler:ripple
    - title: Категория B — Офшор
      description: Проектиран за офшорни плавания с вятърна сила до Beaufort 8 (≤40 възела) и значителна височина на вълните до 4 м. Подходящ за крайбрежни и полуоткрити води.
      icon: tabler:anchor
    - title: Категория C — Крайбрежни
      description: Проектиран е за крайбрежни плавания с вятърна сила до Бофорт 6 (≤27 възела) и значителна височина на вълните до 2 м. Повечето развлекателни RIBs дейности попадат в тази категория.
      icon: tabler:sun
    - title: Категория D — Защитени
      description: Проектирана за защитени води с вятърна сила до Бофорт 4 (≤16 възела) и значителна височина на вълните до 0,3 м. Езера, реки и защитени пристанища.
      icon: tabler:pool
content_hin:
  tagline: Идентификация на плавателния съд
  title: HIN / CIN и Builder's Plate
  subtitle: Всяка RIB лодка изисква идентификационен номер на корпуса (HIN) или идентификационен номер на плавателния съд (CIN) и табела на строителя съгласно EN ISO 14945 и RCD изисквания.
  items:
    - title: Идентификационен номер на корпуса (HIN)
      description: Уникален 14-символен код, постоянно маркиран на дясната страна на транца, кодиращ код на производителя (MIC), година на модел, година на производство и сериен номер. Задължително за навлизане на пазара в ЕС.
      icon: tabler:hash
    - title: Идентификационен номер на кораба (CIN)
      description: Според EN ISO 10087, скрит вторичен идентификационен номер, поставен на скрито място с цел предотвратяване на кражба и проследяване.
      icon: tabler:eye-off
    - title: Съдържание на плочите на строителя
      description: Максимален брой хора, максимална мощност на двигателя (kW), максимално натоварване (kg), категория на дизайна, име на производителя и CE маркировка — всичко това се показва постоянно върху плоча, устойчива на корозия.
      icon: tabler:badge
content_tech_file:
  tagline: Техническа структура на файловете
  title: Главен технически файл<br />& Запис на корпуса
  subtitle: 'Нашата документационна система следва двустепенна структура: Главен технически файл за всяко семейство модели и индивидуални регистри на корпуса за всяка произведена лодка.'
  items:
    - title: Главен технически файл
      description: 'Съдържа пълната документация за съответствие на семейство модели: обща подредба, оценка на риска, изчисления за стабилност/плавателност, спецификации на материалите, приложими стандарти и записи за оценка на съответствието. Съхранява се за 10+ години.'
      icon: tabler:folder
    - title: Рекорд на корпуса (проследимост по лодка)
      description: 'Всеки корпус има уникален запис, който го свързва с Главния технически файл: HIN, дата на производство, тръбна партида, сертификати за материали, резултат от теста под налягане, крайна конфигурация, инсталация на двигателя и място на доставка.'
      icon: tabler:file-description
    - title: Пакет за съответствие с клиентите
      description: Пакет за доставка по корпус, включващ DoC, снимка на табелата на строителя, ръководство за собственика, обобщение на тестовете и окончателен конфигурационен лист — предоставян с всеки RIB изпратен в ЕС.
      icon: tabler:package
content_material_cert:
  tagline: Сертифициране на материалите
  title: Проследимост на материалите &<br />Доказателство за сертификация
  subtitle: RIB Качествените лодки започват с контролирани материали и документирани процеси. По-долу е показано как организираме сертифицирането на материали за всяка критична група компоненти.
  items:
    - title: Проследимост на надуваеми тръби
      description: PVC иCSM/Hypalonтръбните материали се избират според предназначеното предназначение, климатичните условия и целевия пазар. Технически данни за доставчици (TDS), информация за партидите материали, проследимост на партидите на UV тъканта, доклади за тестове за атмосферни влияния, както и REACH/SVHC декларации са налични в рамките на договорения обхват на проектната документация.
      icon: tabler:circle
    - title: Проследимост на морски алуминий
      description: За проекти с алуминиев RIB корпус партидите от сплав, дебелината и материалите се контролират според одобрената спецификация. Сертификати за тестване на материал (MTC/MTR), EN 10204 3.1 документация, доклади за химичен състав и механични свойства, както и проследимост на топлина/партиди, се предоставят там, където е договорено.
      icon: tabler:rectangle
    - title: Контрол на материалите и процесите на корпуса от GRP
      description: За корпус от RIBsфибростъкло, гелкоут, смола, фибростъклени арматури и основни материали се управляват чрез контролирани спецификации. Материални TDS/SDS, партидни записи, спецификации на ламинат, както и записи за втвърдяване и контрол в работилницата са достъпни при договор за проекта.
      icon: tabler:layers-subtract
    - title: Поддръжка на документация на компонентите
      description: За избрани компоненти — включително EVA материали за палуби, седалки, хардуер от неръждаема стомана, горивни системи, електрическо оборудване и морски аксесоари — съответната документация на доставчика се координира според крайната конфигурация и изискванията на пазара за дестинация.
      icon: tabler:package
    - title: Уведомление за обхвата на съответствие
      description: Сертификати, тестови доклади и документи за съответствие се отнасят само за конкретния продуктов модел, материал, компонент, производствена партида или обхват на проекта, посочени в съответния документ. Свържете се с нас с вашия целеви пазар, предназначението и техническите изисквания, за да може приложимият пакет документация да бъде потвърден преди поставянето на поръчката.
      icon: tabler:info-circle
faq:
  title: CE Съответствие — Често задавани въпроси
  questions:
    - q: Всички Paddle Board Overstock RIB лодки CE сертифицирани ли са за пазара на ЕС?
      a: RIB Лодките в нашия каталог са проектирани и документирани за RCD съответствие с 2013/53/ЕС съгласно приложимите директиви на ЕС.CE Маркировката се прилага за модел и конфигурация. Свържете се с нас за документ за специфичен обхват на съответствието, специфичен за модела.
    - q: Каква е разликата между RCD съответствие и CE маркиране?
      a: RCD (Директива за рекреационни плавателни съдове 2013/53/EU) е законодателството на ЕС, което определя основни изисквания за безопасност.CE Маркировката е визуалният символ, поставен върху продукт, който е оценен и потвърден да отговаря на тези изисквания. Продуктът трябва да отговаря RCD на условията, преди да може да носи CE марката.
    - q: Предоставяте ли Декларации за съответствие с всяка лодка?
      a: Да. RIB Всяка лодка, доставена на пазара на ЕС, включва моделно-специфична декларация за съответствие на ЕС, в която са изброени приложимите директиви, хармонизирани стандарти, модул за оценка на съответствието и данни за уведомения орган.
    - q: Кой модул за оценка на Paddle Board Overstock съответствието използва?
      a: Модулът зависи от категорията на дизайна и типа на лодката. Повечето RIB модели в Категория C използват Модул A (вътрешен контрол на производството). За лодки от категория Design A/B или специфични конфигурации, може да се+приложи Модул B, C или B+D с участието на Notified Organ. Даваме съвети за подходящия модул за всеки проект.
    - q: Можете ли да споделите документация за съответствие преди да направим поръчка?
      a: След квалифицирано запитване споделяме документ за обхвата на съответствието, който изброява приложимите стандарти, маршрут на съответствие и типове документи, налични за модела, който оценявате. Пълните технически файлове се споделят в NDA раздела след потвърждение на поръчката.
    - q: Какво е Номер на идентификация на корпуса (HIN) и включен ли е той?
      a: HIN е 14-символен уникален идентификатор, който е перманентно маркиран на всяка лодка, кодиращ кода на производителя (MIC), обозначение на модела, година на производство и серийния номер. Той е задължителен за всички RIB лодки, поставени на пазара на ЕС, и е включен във всяка Paddle Board Overstock RIB.
    - q: Колко дълго се съхраняват техническите досиета?
      a: Съгласно изискванията на RCD 2013/53/EU, производителят трябва да съхранява техническото досие поне 10 години от последната дата, когато продуктът е поставен на пазара. Paddle Board Overstock поддържа пълна техническа документация за всички произведени модели.
    - q: Помагате ли с задълженията на вносителя по RCD?
      a: 'Да. Ние предоставяме пакета с документи, от който вносителите в ЕС имат нужда, за да изпълнят своите задължения: достъп до техническото досие, Декларация за съответствие (DoC), табела на производителя, ръководство на собственик и записи за проследимост на продукта. Отговорностите на вносителя по RCD са ясно документирани в нашето ръководство за съответствие.'
