content_system:
  tagline: Преглед на системата за КК
  title: Интегрирано качество<br />Рамка за контрол
  subtitle: Нашата система за КК функционира независимо от производството и докладва директно на ръководството. Нито една партида не се изпраща без подписано качество от лабораторията по качеството.
  items:
    - title: Независима лаборатория по качеството
      description: Нашата лаборатория за качество работи като отделна функция от производството. Инспекторите по КК докладват на мениджъра по качеството, а не на директора на производството. Тази организационна независимост гарантира, че решенията за качеството се вземат обективно — производствените срокове никога не надвишават изискванията за качество.
      features:
        - Докладва директно на ръководството, независимо от производството
        - Упълномощена да спира производството поради проблеми с качеството
        - 12 посветени инспектори по КК на всички етапи
        - Цялото тестово оборудване се калибрира ежегодно
    - title: Проследимост на партидите
      description: Всяка партида суровини получава уникален номер на лот в нашата ERP система. От пристигането на материалите до производството и готовия продукт, всяка фактура на лодката се свързва с оригиналните партиди на доставчика. Това позволява пълна възходяща проследимост за всякакви въпроси за качество или съответствие.
      features:
        - Проследяване на партиди от материал до готов продукт, базирано на ERP
        - Физически етикети на всяка работна поръчка
        - 100% покритие на материалите — PVC, Hypalon, хардуер, лепила
        - Записите се съхраняват за 10 години (изискване CE 2013/53/ЕС)
    - title: Стандарти и съответствие
      description: Процедурите ни за КК са съобразени с международните стандарти. Продуктите са сертифицираниCE по Директива за рекреационни плавателни съдове на ЕС 2013/53/ЕU. Системата ни за управление на качеството е сертифицирана ISO 9001. Социалното съответствие се поддържа чрез сертификат BSCI.
      features:
        - Сертифициране CE (ЕС 2013/53/ЕU)
        - Управление на качеството 9001:2015ISO
        - Сертификация за социално съответствие BSCI
        - Съответствие на материалите REACH и RoHS
        - Сертификация след Брекзит UKCA
content_inspection:
  tagline: Етапи на инспекция
  title: Шестстепенен<br />Процес на инспекция
  subtitle: Всеки продукт преминава през 6 етапа на инспекция с документирани контролни точки за контрол на качеството. Дефектите се откриват рано, коригиращите действия са незабавни и всяка партида е напълно проследима.
  stages:
    - stage: '1'
      title: Инспекция на входящи материали
      description: Всички входящи материали се регистрират по партида/партидски номер и се поставят под карантина до одобрението на QC. PVC/Hypalon Платовите ролки се тестват за якост на опън (ASTM D751), устойчивост на разкъсване (ISO4674) и дебелина.Drop-stitch Керни, клапани, лепила и хардуер се инспектират визуално и измерват според спецификациите.
      checks: Якост на опън ASTM D751, устойчивост на ISO разкъсване 4674, дебеломер, вискозитет на лепилото, визуално сканиране на дефекти
      threshold: 100% от тестваните партиди. Отхвърляйте, ако якостта на опън е < 90% от спецификацията, якостта на разкъсване < минималната спецификация или има някакъв визуален дефект
    - stage: '2'
      title: Контрол на качеството в процес — Рязане и подготовка
      description: CNC-изрязаните панели се проверяват размерно спрямо CAD изходни файлове на всеки 20-ти панел. Качеството на ръбовете се проверява за износване, неравномерни разрези или размерно отклонение. Броят на панелите се проверява спрямо BOM за всяка производствена партида преди материалите да преминат към заваряване.
      checks: Проверка на размерите спрямо CAD DXF файлове, инспекция на качеството на ръбовете, проверка на броя на панелите
      threshold: Толеранс ±0.5 мм. Отхвърлете партида, ако >2% извън толеранс
    - stage: '3'
      title: Контрол на качеството в процеса — Заваряване и свързване
      description: По време на производството качеството на заварката се наблюдава непрекъснато. Тестове за отбелване (ASTM D751) се провеждат върху проби на всеки 50 единици. Ширината на заварката се измерва според спецификациите. Логовете за температура на горещия въздух се преглеждат за последователност. Всеки шев се инспектира визуално под подсветка за канали или празнини.
      checks: Тест за отбелване ASTM D751 на всеки 50 единици, измерване на ширината на заваръчката, преглед на дневника за температурата на горещия въздух, инспекция на шевовете на подсветката
      threshold: Якост на лющене минимум 8 N/cm. Толеранс на ширината на ±заварката 1 mm. Всяко видимо канализиране = отхвърляне
    - stage: '4'
      title: Асемблер QC
      description: Всяка единица следва 100-точков контролен списък за сглобяване, подписан от ръководителя на екипа. Функцията на клапаните се тества през 10 цикъла отваряне/затваряне. Хардуерният въртящ момент се проверява. Визуалната инспекция обхваща повърхностното покритие, цветовата консистенция, разположението на етикетите и пълнотата на аксесоарите.
      checks: 100-точков контролен списък на единица, тест на функцията на клапана, хардуерна проверка на въртящия момент, визуална инспекция
      threshold: 'Политика за нулеви дефекти при критични за безопасността елементи (клапани, D-пръстени, дръжки). Незначителни козметични: AQL 2.5 (ISO 2859)'
    - stage: '5'
      title: Тестване на налягане
      description: Всяка камера се напомпва до номинално налягане 1.25× и се държи 24-48 часа. Сензорите за налягане записват непрекъснато през целия период на задържане. Температурно компенсираните показания гарантират точност. Всяка камера, надвишаваща 5% спад на налягането, се отхвърля и изпраща за повторна инспекция на шевовете с 100% повторен тест на цялата производствена партида.
      checks: 24-48 часа дневник за задържане на налягането, калибрацията на сензора се проверява ежедневно, температурно компенсирано измерване, повторен тест на шева след ремонт
      threshold: Максимален спад от 5% налягане за 24 часа при стабилна температура. Превишаване = 100% повторен тест на цялата партида
    - stage: '6'
      title: Окончателна инспекция и освобождаване на пратката
      description: Финална визуална и функционална инспекция преди опаковане. Повърхностните дефекти, консистенцията на цветовете, проверката на етикети/BIN, целостта на опаковката и пълнотата на аксесоарите се проверяват спрямо поръчката на клиента. Единиците се опаковат във вакуум, опаковат и палетизират. Необходимо е окончателно одобрение за контрол на качеството преди продуктът да напусне фабриката.
      checks: Пълна визуална инспекция, контролен списък на аксесоари SKUна всяка, тест за падане на опаковки (1 м случайна проба), проверка на етикет/баркод сканиране
      threshold: AQL 2.5 сериозни дефекти, AQL 4.0 дребни. Дефекти на безопасността с нулева толерантност. 100% от единиците са визуално инспектирани
content_equipment:
  tagline: Оборудване за тестване
  title: Лаборатория за контрол на качеството<br />Оборудване
  subtitle: Нашата лаборатория за качество е оборудвана със специализирано тестово оборудване за проверка на материали, целостта на заварките и валидиране на изпълнението на продуктите.
  columns: 3
  items:
    - title: Машина за опънни изпитвания
      description: Измерва якостта на опън и удължението на тъканта според ASTM D751. Използва се за входящ контрол на качеството на всички партиди тъкани PVC, Hypalon и drop-stitch.
      icon: tabler:scale
    - title: Температурна камера
      description: Екологична камера за тестване на устойчивост на UV (ASTM G154) и за тестване на гъвкавост при ниски температури. Симулира екстремни условия на експлоатация.
      icon: tabler:temperature
    - title: Сензори за налягане и регистратори
      description: Дигитални сензори за налягане с непрекъснато регистриране на данни за 24-48 часови тестове за задържане на въздух. Компенсирани за температура за точност.
      icon: tabler:wind
    - title: Стенд за тест за белене
      description: Калибрирано оборудване за тестване на обелване за проверка на здравината на заваръчния шев. Произволни проби от всяка производствена партида.
      icon: tabler:files
    - title: Резервоар за откриване на течове
      description: Резервоар за вода за потопено тестуване на утечка на напомпани камери. Визуално откриване на мехури за проверка на целостта на шевовете и вентилите.
      icon: tabler:ripple
    - title: Инспекционни инструменти
      description: Калибрирани измервателни уреди — уреди за измерване на дебелина, динамометрични ключове, шублери за размери, твърдомери за станции за контрол на качеството в производството.
      icon: tabler:tools
content_metrics:
  tagline: QC Производителност
  title: Контрол на качеството<br />Метрики
  subtitle: Истински данни за преминати/неуспешни тестове от нашата производствена линия. Тези показатели се следят ежедневно и се преглеждат месечно от ръководството.
  columns: 3
  items:
    - title: 100% от устройствата са тествани
      description: Всяка камера на всяка лодка се тества за налягане преди изпращане. Няма извадково тестване — 100% проверка на налягането.
      icon: tabler:check
    - title: <5% Загуба на налягане
      description: Максимално допустима загуба на налягане за 24-48 часа при 1,25× номинално налягане. Всяка камера, надвишаваща този праг, задейства повторно тестване на партидата.
      icon: tabler:gauge
    - title: AQL 2.5
      description: Приемливо ниво на качество за основни дефекти съгласно стандарта за вземане на проби ISO 2859. Нулева толерантност към критични за безопасността дефекти.
      icon: tabler:clipboard-check
    - title: Задържане за 24-48 часа
      description: 'Продължителността на задържане на налягането варира в зависимост от категорията на продукта. RIB камери: 48 часа. SUP и надуваеми лодки: 24-48 часа.'
      icon: tabler:clock
    - title: 1.25× тестово налягане
      description: Безопасна граница за всяка камера — тествана при 25% над номиналното налягане, за да се осигури марж над максималните работни условия.
      icon: tabler:arrow-up
    - title: 0% дефекти в безопасността
      description: Политика на нулева толерантност към дефекти, критични за безопасността — клапани, D-пръстени, шевове и камери за плавателност. Всеки дефект = 100% повторна проверка.
      icon: tabler:shield
