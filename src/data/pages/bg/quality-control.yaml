  points:
    - 'Шестстепенен контрол на качеството: проверка на материала, контрол по време на процеса, проверка на заварките, контрол на монтажа, тестване на налягане при 1,25x и 100-точкова финална проверка'
    - 100-точкова финална проверка на всяка платка преди опаковане
    - 100% от единиците преминават 24-48 часова задържка при 1,25x номинално налягане с максимум 5% допустимо понижение
    - AQL 2,5 проби за гарантиране на 99,3% процент без дефекти
    - 'Контрол на заварките: тест за разлепване, проверка на ширината на заварката и инспекция на шева на подсветката на всяко заварено съединение'
