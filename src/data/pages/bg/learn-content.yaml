articles:
  sup:
    - title: SUP Основи — Ръководство за начинаещи
      desc: Всичко, което един начинаещ трябва да знае — видове дъски, размер на греблото, стойка и съвети за първия ден.
    - title: SUP Ръководство за размери
      desc: Намерете правилната дължина, ширина и обем на дъската за вашето тегло, умения и стил на гребане.
    - title: Надуваема срещу твърда дъска
      desc: Кое е подходящо за вас? Сравнение на преносимост, производителност, издръжливост и цена.
    - title: Междинни техники
      desc: Усъвършенствайте гребането си с напреднали удари, техники за завиване и управление в бурни води.
    - title: Как да изберете надуваема SUP
      desc: Навигиране на ключовите фактори — конструкция, дебелина, разположение на перките и включени аксесоари.
    - title: Водна безопасност
      desc: Основни знания за безопасност, включително четене на времето, избор на PFD, самоспасителни техники и групово гребане.
  inflatable-boat:
    - title: Справочник за материали
      desc: Drop-stitch ядра, PVC ламинирани слоеве, EVA пяна за дек и рейтинг на дение — разберете от какво е направена вашата дъска.
    - title: EVA Обяснение на изкуството на дъската
      desc: Как мултицветните EVA блокчета се изрязват по форма и се сглобяват на ръка в детайлни декови рисунки, които никога не избледняват и не се обелват.
    - title: Drop-Stitch Обяснено на съществено ниво
      desc: Как хиляди вътрешни нишки създават твърда платформа при 15 PSI за високопроизводителни надуваеми SUPs.
    - title: Преглед на надуваемата технология
      desc: Как се конструират надуваемите падъл дъски — от полагането на материалите до клапанните системи и заваряването на шевовете.
    - title: Конструкция на ръбовете и шевовете
      desc: Как трислойните ленти на ръбовете и RF-заварените шевове поддържат вашата дъска херметична при пълно налягане.
    - title: Защо 15 PSI е важно
      desc: Как въздушното налягане отключва твърда, твърдодънна производителност от надуваема дъска, която може да се сгъва.
  water-safety:
    - title: Ръководство за водна безопасност
      desc: Основни знания за безопасност за всеки гребец — времето, спасителни жилетки, самоспасителни техники и протоколи за групово гребане.
    - title: Ръководство за спасителни жилетки и PFD
      desc: Как да изберете правилното лично спасително средство за стоящо гребане — рейтинг на плавучест, прилягане и комфорт.
    - title: SUP Контролен списък за безопасност
      desc: Предварителен контролен списък за безопасност, който всеки гребец на стойка трябва да следва преди да влезе във водата.
    - title: Безопасно гребане в студена вода
      desc: Основни предпазни мерки, екипировка и техники за гребане в условия на студена вода.
    - title: Грешки на начинаещи при гребане
      desc: Чести грешки, които допускат начинаещите гребци, и как да ги избегнете за по-безопасно и по-приятно изживяване.
    - title: Повод и PFD правила за безопасност
      desc: Когато поводът е необходим, кои PFD видове работят за SUP и какво е оборудването за безопасност, което всеки гребец трябва да носи.
ui:
  read_guide: Прочетете ръководството →
  card_tech: Инженеринг за безопасност и тестове на материалите
  card_products: Разгледайте пълния каталог на продуктите Paddle Board Overstock
  card_trust: Качество, тествано на фабриката, с 2-годишна гаранция
materials:
  intro_p1: Производителността, издръжливостта и безопасността на надуваема платформа за гребане зависят почти изцяло от материалите, използвани при нейното производство. От ламинирания слой, който формира корпуса, до конците, които придават на SUP платформата нейната твърдост, всеки избор на материал влияе на представянето на продукта във водата и на неговата дълготрайност.
  intro_p2: 'Този наръчник обхваща трите основни материала, използвани в съвременните надуваеми платформи за гребане: PVC ламиниран материал, drop-stitch сърцевина и EVA пенообразен борд. Разбирането на тези материали ще ви помогне да изберете правилната платформа за вашите нужди и да я поддържате за максимален срок на експлоатация.'
  labels:
    advantages: Предимства
    limitations: Ограничения
    best_for: 'Най-добро за:'
  items:
    - name: PVC (Поливинилхлорид)
      summary: Индустриалният стандарт за надуваеми SUPs. Многослойната ламинирана тъкан предлага отлична здравина спрямо теглото на достъпна цена.
      pros:
        - Отлична стойност за парите
        - Лека и лесна за работа
        - Добра UV устойчивост при правилни покрития
        - Широка гама от цветове и завършеци
        - Лесна за ремонт с PVC лепенки и разтворителен адхезив
      cons:
        - Типичен срок на експлоатация от 7-10 години при правилна поддръжка
        - По-малко гъвкава при студени температури
        - По-ниска химическа устойчивост
        - Може с времето да се появи миграция на пластификатор
      best_for: Рекреационни и туристически SUPs, семейно гребане, сезонна употреба, сладководни и крайбрежни среди.
    - name: Drop-Stitch ядро
      summary: Технологията, която революционизира надуваемите SUPs. Хиляди полиестерни нишки свързват горния и долния слой плат, позволявайки високо налягане за твърда, здрава структура.
      pros:
        - Изключително твърд на 12-20 PSI
        - Лек — 18-30 lbs за стандартна дъска
        - Сгъва се плоско за съхранение и пътуване
        - Отлична удароустойчивост
        - Консистентно представяне при различни температури
      cons:
        - Изисква високонапорна помпа
        - Ремонт на пробиване по-сложен от еднослойни
        - По-висока производствена цена от стандартните надуваеми
        - Загуба на налягане с времето изисква периодично допълване
      best_for: Стендъп падъл бордове и всякакво оборудване, което се нуждае от твърда производителност с надуваема портативност.
    - name: EVA Пяна на палубата
      summary: Затворено-клетъчна пяна EVA (етилен-винил ацетат), използвана за тракшън падове на SUP дъски. Осигурява омекотяване, сцепление и топлоизолация — и носи дизайните от арт серията.
      pros:
        - Отлично противохлъзгане при мокро или сухо
        - Омекотяването намалява умората при дълги гребания
        - Термоизолация от студената повърхност на палубата
        - UV и устойчивост на солена вода
        - Налична в многоблокови цветови композиции и лазерно гравирани дизайни
      cons:
        - Може да се износи при интензивна употреба за 2-3 години
        - Трябва да бъде правилно свързан, за да се предотврати деламинация
        - Не е структурен — не влияе на здравината
        - Добавя леко тегло (200-400 г на дъска)
      best_for: SUP сцепление на палубата, дизайни на палубата от арт серия и всяка повърхност, която изисква хлъзгозащитно покритие.
  selection:
    title: Ръководство за избор на материал
    subtitle: 'Изберете правилния материал според основното ви предназначение:'
    headers:
      - Случай на употреба
      - Препоръчан материал
      - Защо
    rows:
      - - Рекреативно SUP гребане
        - Drop-stitch PVC
        - Лек, твърд, достъпен — идеален баланс за случайни гребци
      - - Семейно и за начинаещи гребане
        - Широк drop-stitch PVC (32"+)
        - Стабилен и прощаващ — увереност за начинаещи гребци
      - - Риболов и гребане с тежко оборудване
        - Широк drop-stitch PVC с пълна EVA палуба
        - Допълнителна стабилност за стоене и хвърляне на въдица, голям обем за принадлежности
      - - Дъски за отдаване под наем във флотилия SUP
        - Drop-stitch PVC + EVA палуба
        - Здрав, поправим, добра цена за употреба с голям оборот
      - - Туризъм и по-дълги гребания
        - Drop-stitch PVC (~11 фута)
        - По-добро проследяване и ефективност на плъзгане на разстояние
      - - Йога и фитнес гребане
        - Широк drop-stitch PVC с пълна EVA палуба
        - Стабилна, удобна платформа за пози и тренировки
  deep_dive:
    title: Ръководства за дълбоко гмуркане
    topics:
      - title: Морско качество PVC
        desc: Многослойна ламинирана PVC тъкан — обяснена UV устойчивост, тестове за износване и дение
      - title: PVC Ламинатни слоеве
        desc: Как многослойният ламиниран PVC балансира здравина, тегло и UV устойчивост.
      - title: Drop-Stitch ядро
        desc: Как хиляди вътрешни нишки създават твърди, високопресионни надуваеми структури при 15 PSI.
      - title: Технология за заваряване с РЧ
        desc: Високочестотното заваряване създава здрави, постоянни шевове — как работи и защо е важно.
      - title: PSI и представяне
        desc: Защо въздушното налягане е важно за надуваеми SUPs — твърдост, товароносимост и качество на плаването.
      - title: Тестове за качество
        desc: Тестове за налягане, тестове за плавучест, UV стареене и разрушителни тестове — нашият процес за качество.
      - title: EVA Пяна за палуби
        desc: Полиуретанови сензорни подложки от затворена клетка EVA — сцепление, комфорт и издръжливост за SUP палуби.
      - title: Грижа за материалите
        desc: Почистване, UV защита, предпазване от мухъл и най-добри практики за съхранение на надуваеми продукти.
