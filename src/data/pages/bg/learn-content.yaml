articles:
  sup:
    - title: SUP Основи — Ръководство за начинаещи
      desc: Всичко, което един начинаещ трябва да знае — видове дъски, размер на греблото, стойка и съвети за първия ден.
    - title: SUP Ръководство за размери
      desc: Намерете правилната дължина, ширина и обем на дъската за вашето тегло, умения и стил на гребане.
    - title: Надуваема срещу твърда дъска
      desc: Кое е подходящо за вас? Сравнение на преносимост, производителност, издръжливост и цена.
    - title: Междинни техники
      desc: Усъвършенствайте гребането си с напреднали удари, техники за завиване и управление в бурни води.
    - title: Как да изберете надуваема SUP
      desc: Навигиране на ключовите фактори — конструкция, дебелина, разположение на перките и включени аксесоари.
    - title: Водна безопасност
      desc: Основни знания за безопасност, включително четене на времето, избор на PFD, самоспасителни техники и групово гребане.
  inflatable-boat:
    - title: Справочник за материали
      desc: PVC, Hypalon, drop-stitch, денир оценки — разберете от какви материали е направено вашето надуваемо оборудване.
    - title: PVC срещу Hypalon
      desc: Дефинитивно сравнение на PVC и Hypalon тъкани за надуваеми лодки — издръжливост, UV устойчивост и цена.
    - title: Drop-Stitch Обяснено на съществено ниво
      desc: Как хиляди вътрешни конци създават твърда платформа на 12-15 PSI за високопроизводителни надуваеми SUPs.
    - title: Преглед на надуваемата технология
      desc: Как се конструират надуваемите лодки и SUPs — от подреждане на материалите до клапанни системи и заваряване на шевовете.
    - title: Ръководство за твърда надуваема лодка (RIB)
      desc: Всичко за конструкцията на RIB, типовете корпуси, материалите на тръбите и избора на правилната RIB според вашите нужди.
    - title: Надуваема лодка срещу RIB
      desc: Ключови разлики между традиционните надуваеми гондоли и твърдокорпусните надуваеми лодки за различни случаи на употреба.
  water-safety:
    - title: Ръководство за водна безопасност
      desc: Основни знания за безопасност за всеки гребец — времето, спасителни жилетки, самоспасителни техники и протоколи за групово гребане.
    - title: Ръководство за спасителни жилетки и PFD
      desc: Как да изберете правилното лично спасително средство за SUP, каяк, лодки и професионална употреба.
    - title: SUP Контролен списък за безопасност
      desc: Предварителен контролен списък за безопасност, който всеки гребец на стойка трябва да следва преди да влезе във водата.
    - title: Безопасно гребане в студена вода
      desc: Основни предпазни мерки, екипировка и техники за гребане в условия на студена вода.
    - title: Грешки на начинаещи при гребане
      desc: Чести грешки, които допускат начинаещите гребци, и как да ги избегнете за по-безопасно и по-приятно изживяване.
    - title: CE Обяснена сертификация
      desc: Какво означава CE сертификация за надуваеми водни съдове — стандартите, тестването и защо е важно за безопасността.
ui:
  read_guide: Прочетете ръководството →
  card_tech: Морска безопасност, инженеринг и тестване на материали
  card_products: Разгледайте целия Aquafarer продуктов каталог
  card_trust: CE, ISO и BSCI съответствие
materials:
  intro_p1: Изпълнението, здравината и безопасността на надуваем воден съд зависят почти изцяло от използваните материали при неговото производство. От тъканта, която формира тръбите, до нишките, които придават на SUP дъска нейната твърдост, всеки избор на материал влияе на това как продуктът се държи във водата и колко дълго ще издържи.
  intro_p2: 'Това ръководство обхваща четирите основни материала, използвани в модерните надуваеми водни съдове: PVC тъкан, Hypalon CSM гума, drop-stitch конструкция на сърцевината и EVA пяна за палуба. Разбирането на тези материали ще ви помогне да изберете правилния продукт за вашите нужди и да го поддържате за максимален срок на експлоатация.'
  labels:
    advantages: Предимства
    limitations: Ограничения
    best_for: 'Най-добро за:'
  items:
    - name: PVC (Поливинилхлорид)
      summary: Индустриалният стандарт за развлекателни надуваеми лодки и SUPs. Многослойната ламинирана тъкан предлага отлична якост спрямо теглото на достъпна цена.
      pros:
        - Достъпна — 30-50% по-евтина от Hypalon
        - Лека и лесна за работа
        - Добра UV устойчивост при правилни покрития
        - Широка гама от цветове и завършеци
        - Лесна за ремонт с PVC лепенки и разтворителен адхезив
      cons:
        - По-кратък живот от Hypalon (7-10 години)
        - По-малко гъвкава при студени температури
        - По-ниска химическа устойчивост
        - Може с времето да се появи миграция на пластификатор
      best_for: Развлекателни SUPs, бюджетни лодки, флотилии под наем, сезонна употреба, сладководни и крайбрежни среди.
    - name: Hypalon (CSM Гума)
      summary: Премиум синтетичен гумен материал, известен с изключителна здравина, UV устойчивост и дълготрайност. Златният стандарт за търговски и военни надуваеми лодки.
      pros:
        - Изключителна UV и озонова устойчивост
        - Продължителност на живота 15-20 години при правилна грижа
        - Отлична гъвкавост при студено време
        - Висока устойчивост на химикали и масла
        - Запазва цвета по-дълго от PVC
      cons:
        - Значително по-скъпо от PVC
        - По-тежка тъкан
        - По-малко цветови опции
        - Ремонтите изискват специализирани лепила
        - По-малко производствени съоръжения по света
      best_for: Комерсиални RIBs, търсене и спасяване, военни приложения, тропически климат, дългосрочно притежаване на флот.
    - name: Drop-Stitch Ядро
      summary: Технологията, която революционизира надуваемите SUPs. Хиляди полиестерни нишки свързват горния и долния слой плат, позволявайки високо налягане за твърда, здрава структура.
      pros:
        - Изключително твърд на 12-20 PSI
        - Лек — 18-30 lbs за стандартна дъска
        - Сгъва се плоско за съхранение и пътуване
        - Отлична удароустойчивост
        - Консистентно представяне при различни температури
      cons:
        - Изисква високонапорна помпа
        - Ремонт на пробиване по-сложен от еднослойни
        - По-висока производствена цена от стандартните надуваеми
        - Загуба на налягане с времето изисква периодично допълване
      best_for: Стендъп падъл дъски, каяци, въздушни палуби за надуваеми лодки, всяко приложение, изискващо твърдо представяне с преносимост на надуваемото.
    - name: EVA Пяна на палубата
      summary: Закрито-клетъчна EVA (етилен-винил ацетат) пяна, използвана за гумени подложки на SUP дъски и палуби на лодки. Осигурява омекотяване, сцепление и термоизолация.
      pros:
        - Отлично противохлъзгане при мокро или сухо
        - Омекотяването намалява умората при дълги гребания
        - Термоизолация от студената повърхност на палубата
        - UV и устойчивост на солена вода
        - Налична в многоблокови цветови композиции и лазерно гравирани дизайни
      cons:
        - Може да се износи при интензивна употреба за 2-3 години
        - Трябва да бъде правилно свързан, за да се предотврати деламинация
        - Не е структурен — не влияе на здравината
        - Добавя леко тегло (200-400 г на дъска)
      best_for: SUP сцепление на палубата, подплата на лодки, комфорт на седалката на каяк, всяка повърхност, изискваща противохлъзгащо сцепление.
  selection:
    title: Ръководство за избор на материал
    subtitle: 'Изберете правилния материал според основното ви предназначение:'
    headers:
      - Случай на употреба
      - Препоръчан материал
      - Защо
    rows:
      - - Рекреативно SUP гребане
        - Drop-stitch PVC
        - Лек, твърд, достъпен — идеален баланс за случайни гребци
      - - Семейна лодка / лодка за езеро
        - PVC (1100 дениера)
        - Икономичен, лесен за ремонт, достатъчна издръжливост за рекреативна употреба
      - - Търговска RIB / патрулна лодка
        - Hypalon CSM
        - Максимална UV устойчивост, живот на материала 15-20 години, устойчивост на химически вещества и масла
      - - Дъски за отдаване под наем във флотилия SUP
        - Drop-stitch PVC + EVA палуба
        - Здрав, поправим, добра цена за употреба с голям оборот
      - - Операции по търсене и спасяване
        - Hypalon CSM
        - Надеждност в екстремни условия, гъвкавост при студ, устойчивост на химикали
      - - Каяк за туризъм / експедиции
        - Drop-stitch PVC
        - Твърдо представяне с възможност за опаковане за пътуване
  deep_dive:
    title: Ръководства за дълбоко гмуркане
    topics:
      - title: Морско качество PVC
        desc: Многослойна ламинирана PVC тъкан — обяснена UV устойчивост, тестове за износване и дение
      - title: PVC срещу Hypalon
        desc: Дефинитивно сравнение на двете доминиращи материали за надуваеми лодки — цена, живот, UV устойчивост.
      - title: Drop-Stitch Ядро
        desc: Как хиляди вътрешни нишки създават твърди, високонапорни надуваеми конструкции при 12-15 PSI.
      - title: Технология за заваряване с РЧ
        desc: Високочестотното заваряване създава здрави, постоянни шевове — как работи и защо е важно.
      - title: PSI и представяне
        desc: Защо въздушното налягане е важно за надуваеми SUPs и лодки — твърдост, товароносимост и качество на пътуването.
      - title: Тестове за качество
        desc: Тестове за налягане, тестове за плавучест, UV стареене и разрушителни тестове — нашият процес за качество.
      - title: EVA Пяна за палуби
        desc: Палубни подложки от затворено-пореста EVA пяна — сцепление, комфорт и издръжливост за SUP и лодки.
      - title: Грижа за материалите
        desc: Почистване, UV защита, предпазване от мухъл и най-добри практики за съхранение на надуваеми продукти.
