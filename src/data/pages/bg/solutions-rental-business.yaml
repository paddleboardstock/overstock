testimonial:
  content: Наемах 5 дъски от местен магазин и губех 60% от приходите си за тях. Aquafarer ми помогна да изграда собствен флот от 15 SUPs. Калкулаторът ROI, който ми предоставиха, показваше, че ще стигна точка на равновесие за 4 месеца — всъщност отне 3. Сега разширявам на 30 дъски и добавям каяци.
  name: Даниел Оконкво
  title: Собственик, Lakeland SUP Rentals — Онтарио, Канада
content_segments:
  tagline: Профили на наемите
  title: Решения за наем на водни спортове<br />По тип на оператора
  subtitle: Различните наемни операции имат различни нужди — от малки плажни SUP наеми до големи центрове за водни спортове в курортите. Ние адаптираме нашите пакети оборудване и модел на поддръжка съответно.
  items:
    - title: Плажни и крайезерни SUP наеми
      subtitle: Висок обем, ниска сложност на операциите
      description: Оператори, които отдават наем на stand-up paddle дъски и каяци директно на плажуващите и посетителите на езера. Вашият приоритет е минимизиране на времето между наемите, поддържане на оборудването в ротация и управление на сезонните пикове на търсенето с малък обем за съхранение.
      features:
        - Надуваеми SUP флотове, които се опаковат плоско — не са нужни кейове или ремаркета
        - Комерсиално качествени PVC с рейтинг за 100+ наемни цикъла на сезон
        - Бързосъхнеща, UV-устойчива тъкан за готовност за повторен наем същия ден
        - Цветнокодирани дъски за лесна идентификация на флота
    - title: Центрове за водни спортове в курорти и хотели
      subtitle: Опитът на гостите и съответствие с марката
      description: Курорти и хотели, предлагащи водни спортове като удобство на място. Оборудването трябва да изглежда премиум, да работи надеждно за гости от начинаещи до средно напреднали и да се интегрира с вече съществуващите процеси за резервации и плащания на курорта.
      features:
        - Персонализирани SUP дъски и жилетки в цветовете на курорта
        - 'Смесен флот: SUPs, каяци, педални лодки и малки RIB помощни лодки'
        - Тихи, безгоривни електрически помпи за надуване на плажа
        - Включено обучение на персонала и въвеждане в поддръжката
    - title: Оператори за наем на лодки и RIB
      subtitle: Флотилии за наем на плавателни съдове от търговски клас
      description: Оператори, отдаващи наем на моторни плавателни съдове — RIB помощни лодки, надуваеми лодки и малки моторни лодки — на час или половин ден. Вашият флот трябва да отговаря на морските изисквания за безопасност, да издържа на интензивна употреба от гости и да минимизира машинните престои между чартъри.
      features:
        - RIB пакети с 30–90 HP изводи за извънбордови мотори
        - Панели от морска шперплат за под за дългосрочна структурна цялост
        - Системи за бърз старт за по-бързо обръщане на плавателните съдове
        - Комплект резервни части + техническа поддръжка при повикване SLA
    - title: Оператори за турове и приключения
      subtitle: Флотилии за организирани екскурзии
      description: Оператори, провеждащи водни спортни турове с гид — SUP сафари, каяк из пещери, шнорхелинг екскурзии или обиколки на острови RIB. Оборудването трябва да е достатъчно стабилно за начинаещи участници, бързо за почистване между групите и здраво за ежедневна употреба в разнообразни водни условия.
      features:
        - Допълнително стабилни SUP платформи (32" ширина+) за начинаещи участници
        - Варианти на тандемни каяци за двойки/групови турове
        - Вградена товарна вместимост за шнорхел оборудване, сухи чанти и хладилници
        - CE + USCG документация за съответствие за търговска дейност
