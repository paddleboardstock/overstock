testimonial:
  content: Наемах 5 дъски от местен магазин и губех 60% от приходите си за тях. Paddle Board Overstock ми помогна да изградя собствен флот от 15 SUPs. Калкулаторът ROI, който те предоставиха, показа, че ще наваксам разходите за 4 месеца — всъщност отне 3. Сега разширявам до 30 дъски.
  name: Даниел Оконкво
  title: Собственик, Lakeland SUP Rentals — Онтарио, Канада
content_segments:
  tagline: Профили на наемите
  title: Решения за наем на водни спортове<br />По тип на оператора
  subtitle: Различните наемни операции имат различни нужди — от малки плажни SUP наеми до големи центрове за водни спортове в курортите. Ние адаптираме нашите пакети оборудване и модел на поддръжка съответно.
  items:
    - title: Плажни и крайезерни SUP наеми
      subtitle: Висок обем, ниска сложност на операциите
      description: Оператори, които наемат стоящи падъл дъски директно на плажуващи и посетители на езера. Вашият приоритет е минимизиране на времето между наемите, поддържане на оборудването в ротация и управление на сезонните пикове в търсенето с малка площ за съхранение.
      features:
        - Надуваеми SUP флотове, които се опаковат плоско — не са нужни кейове или ремаркета
        - Комерсиално качествени PVC с рейтинг за 100+ наемни цикъла на сезон
        - Бързосъхнеща, UV-устойчива тъкан за готовност за повторен наем същия ден
        - Цветнокодирани дъски за лесна идентификация на флота
    - title: Центрове за водни спортове в курорти и хотели
      subtitle: Опитът на гостите и съответствие с марката
      description: Курорти и хотели, предлагащи водни спортове като удобство на място. Оборудването трябва да изглежда премиум, да работи надеждно за гости от начинаещи до средно напреднали и да се интегрира с вече съществуващите процеси за резервации и плащания на курорта.
      features:
        - Персонализирани SUP дъски и жилетки в цветовете на курорта
        - 'Смесен флот: всестранен, туристически и арт-серия SUPs'
        - Тихи, безгоривни електрически помпи за надуване на плажа
        - Включено обучение на персонала и въвеждане в поддръжката
    - title: Бутикови и мобилни SUP наеми
      subtitle: Поп-ъп и услуги за наемане с доставка
      description: Оператори, които доставят сърфбордове директно на клиента — доставки на плажа на хотела, поп-ъп станции за наемане на събития и мобилни установки. Екипировката трябва да се разполага бързо, лесна за транспорт и привлекателна на пръв поглед, с гъвкав брой на флота за събития и сезонно търсене.
      features:
        - Пренос на бордове тип раница — не се изисква ремарке
        - Бързо надуване за настройка при поискване за по-малко от 15 минути
        - Привлекателна екипировка, която изглежда премиум на пръв поглед
        - Гъвкав брой на флота за събития и сезонно търсене
    - title: Оператори за турове и приключения
      subtitle: Флотилии за организирани екскурзии
      description: Оператори, които провеждат ръководени водни спортни турове — SUP сафари, шнорхелинг екскурзии и обиколки по крайбрежието. Екипировката трябва да е стабилна за нови гости на тура, лесна за почистване между групите и достатъчно здрава за ежедневно ръководене в различни водни условия.
      features:
        - Допълнително стабилни SUP платформи (32" ширина+) за начинаещи участници
        - Допълнително големи стабилни платформи за снимки на двойки/групи при туровете
        - Вградена товарна вместимост за шнорхел оборудване, сухи чанти и хладилници
        - Пакети с безопасност за комерсиални туроперации
