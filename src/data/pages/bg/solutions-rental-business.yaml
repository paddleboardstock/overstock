        description: Експертен анализ на вашето местоположение, демографски данни за гости и цели за приходи, за да определите размера на вашия автопарк
      - title: Стартова екипировка
        description: 10 SUP дъски с гребла, помпи, спасителни жилетки и ремонтни комплекти — всичко необходимо за изстрелване
      - title: Решения за съхранение
        description: Надуваемите комплекти за оборудване са плоски — не е необходима лодка или ремарке за съхранение
      - title: Съответствие с изискванията за безопасност
        description: Цялото оборудване CE е сертифицирано с търговско качество за ежедневна употреба под наем
      - title: Стартиращ маркетинг
        description: Брандирани фотографски активи и шаблони за менюта под наем, които да ви помогнат да стартирате услугата си
    cta_text: Стартиране на автопарка под наем
    cta_href: /contact
  - title: Комплект за разширяване на флота
    subtitle: За разрастващи дейности с добавяне на капацитет и разнообразие
    badge: Premium
    features:
      - title: Дизайн на смесен флот
        description: Комбинация от SUPsкаяци, надуваеми лодки и RIBs за различни предпочитания на гостите
      - title: Ценообразуване на обема
        description: Нива на едро ценообразуване за автопаркове от 20+ единици с преференциални логистични тарифи
      - title: Персонализирано брандиране
        description: Отпечатване на лого върху оборудване, брандирани спасителни жилетки и персонализирани цветови опции за вашия наем автопарк
      - title: Програма за поддръжка
        description: Комплект резервни части, обучение по ремонт на персонала и директен достъп до техническа поддръжка
      - title: Оптимизация на приходите
        description: Препоръки, базирани на данни, относно ценообразуване, ротация на оборудване и сезонни корекции на флота
    cta_text: Мащабирай своя флот
    cta_href: /contact
