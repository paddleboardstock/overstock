    badge: Premium
    features:
      - title: Дизайн на смесен флот
        description: Смес от всестранни, туристически и арт серии SUPs за задоволяване на разнообразни предпочитания на гостите
      - title: Флийт ценово офериране
        description: Многостепенно ценообразуване за поръчки от 20+ единици с преференциални логистични тарифи
      - title: Персонализирано брандиране
        description: Отпечатване на лого върху оборудване, брандирани спасителни жилетки и персонализирани цветови опции за вашия наем автопарк
      - title: Програма за поддръжка
        description: Комплект резервни части, обучение по ремонт на персонала и директен достъп до техническа поддръжка
