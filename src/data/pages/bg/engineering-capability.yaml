content_capability:
  tagline: Инженерни възможности
  title: Какво Нашето Инженерство<br />Екипът доставя
  subtitle: Инженерството на Aquafarer обхваща целия жизнен цикъл на продукта — от пазарни изследвания и концептуален дизайн до прототипиране, тестване и масово производство.
  items:
    - title: Индустриален дизайн
      description: Нашият екип по индустриален дизайн работи въз основа на изискванията на клиента, пазарни изследвания и конкурентен анализ, за да разработи продуктови концепции, които балансират естетика, функционалност и технология на производство. Ние произвеждаме 2D скици, 3D визуализации и технически спецификационни документи за преглед от клиента преди започване на инструменталната работа.
      features:
        - Разработка на концепции и проучвания за осъществимост
        - 2D дизайнерски чертежи и 3D визуализации
        - Избор на материали и спецификации
        - Анализ на дизайна за производство (DFM)
        - Ергономична и безопасна оценка
    - title: Структурно инженерство
      description: Нашите структурни инженери се специализират в архитектурата на надуваеми лодки — проектиране на корпуса, конфигурация на камерите на тръбите, drop-stitch основно инженерство и разпределение на натоварването. Всеки дизайн се анализира за структурна цялостност, оптимизация на теглото и съответствие с релевантните стандарти (CE, ISO, AS).
      features:
        - Дизайн на корпус от фибростъкло с дълбок V с изчислени ъгли на наклон на дъното
        - Конфигурация с много камери за безопасност и плаваемост
        - Спецификация и оптимизация на плътността на Drop-stitch ядрото
        - Анализ с метод на крайните елементи за носещи компоненти
        - Изчисления на разпределение на теглото и стабилност
    - title: 3D моделиране и CAD
      description: Всички продуктови дизайни се разработват в 3D CAD преди започване на прототипното инструментално производство. Нашите инженери използват SolidWorks и Rhino 3D за моделиране на продуктите, позволявайки на клиентите да прегледат всеки детайл — от профила на тръбата до оформлението на конзолата — преди да се пристъпи към производство.
      features:
        - Пълно 3D CAD моделиране в SolidWorks и Rhino 3D
        - Фотореалистични визуализации за презентации пред клиенти
        - Пакети с технически чертежи за производство
        - Проектиране на матрици и инструменти от 3D модели
        - CAD-към-CNC директен пренос на данни за прецизно рязане
    - title: Прототипиране и тестване
      description: Преди серийното производство всеки нов продукт преминава през етап на прототип. Създаваме функционални прототипи за оценка от клиента, след което ги подлагаме на нашия пълен протокол за тестване — тестове за налягане, тестове за стабилност, тестове на натоварване и водни изпитания. Итерациите на дизайна на етап прототип са бързи и икономични.
      features:
        - Бързо изработване на прототипни инструменти (15-20 дни)
        - Функционален прототип за реална оценка
        - Пълен протокол за тестване преди одобрение за производство
        - Итеративно усъвършенстване на дизайна на база на резултатите от тестовете
        - Милстоун с одобрение от клиента преди производство на инструментите
    - title: Интеграция на персонализирани аксесоари
      description: Много проекти OEM изискват интеграция на аксесоари предоставени от клиента или от трета страна — персонализирани конзоли, специализирани седалки, електронни системи, стойки за оборудване за гмуркане или елементи за брандиране. Нашият инженерен екип управлява проектирането на интеграцията, структурната адаптация и контролът на качеството на всички аксесоари.
      features:
        - Проектиране на конзоли и разположение на приборни табла
        - Интеграция на персонализирани седалки и тапицерия
        - Проектиране на електронни системи и окабеляване
        - Системи за монтаж на оборудване за гмуркане и спасителни системи
        - Спецификации за елементи на брандиране и графични приложения
content_process:
  tagline: Процес на разработка
  title: От концепция<br />в производство
  subtitle: Процесът ни на разработка на продукти следва структуриран работен поток от 6 етапа, предназначен да минимизира риска, да съкрати сроковете и да гарантира готовност за производство от първия ден.
  stages:
    - stage: '01'
      title: Изисквания и изследвания
      duration: 1-2 седмици
      description: Работим с клиента за определяне на спецификации на продукта, изисквания на целевия пазар, нужди от спазване на регулации и търговски цели. Този етап създава Документ за изисквания на продукта (PRD), който насочва цялата следваща работа.
      deliverables: PRD, пазарен анализ, конкурентно сравнение, предварителна оценка на разходите
    - stage: '02'
      title: Концептуален дизайн
      duration: 2-3 седмици
      description: Екипът по индустриален дизайн развива концепции на продукта на база PRD. Представят се множество дизайнерски опции с 3D визуализации, препоръки за материали и първоначални инженерни оценки. Клиентът избира посоката за подробно разработване.
      deliverables: 3D визуализации на концепцията, спецификации на материали, обосновка на дизайна, предварителна спецификация на компонентите (BOM)
    - stage: '03'
      title: Детайлно инженерство
      duration: 2-4 седмици
      description: Избраната концепция се инженерно разработва напълно — 3D CAD моделиране, структурен анализ, конфигурация на тръбите, проектиране на корпус, интеграция на аксесоари и производствена документация. Всички размери, материали и процеси са специфицирани за инструментите.
      deliverables: Пълен 3D CAD модел, инженерни чертежи, окончателен списък с материали (BOM), спецификации на инструментите, план за контрол на качеството (QC)
    - stage: '04'
      title: Прототипиране
      duration: 2-3 седмици
      description: Създават се прототипни инструменти и се изграждат функционални образци. Клиентът преглежда прототипа спрямо спецификациите в PRD. Провеждат се тестове според договорения протокол. Извършват се корекции по дизайна въз основа на обратната връзка преди инструменталното производство.
      deliverables: Функционален прототип, доклад от тестовете, дневник на измененията в дизайна, документ за одобрение от клиента
    - stage: '05'
      title: Производствени инструменти
      duration: 2-3 седмици
      description: След одобрение на прототипа се въвеждат в експлоатация производствени инструменти — калъпи, заваръчни приспособления, програми за рязане, монтажни съоръжения. Документацията за QC и критериите за инспекция се финализират. Провежда се пробна серия за валидация на процеса.
      deliverables: Производствени инструменти, документация за процеса, план за QC инспекция, доклад от пробната серия
    - stage: '06'
      title: Серийно производство и QC
      duration: Продължава
      description: Започва пълно производство с QC на всеки етап. Първите изделия се инспектират и одобряват преди освобождаване на партидата. Постоянен контрол на качеството, проследяване на дефекти и непрекъснато усъвършенстване през целия производствен цикъл.
      deliverables: Производствен график, QC доклади, записи за проследимост на партидите, транспортна документация
content_customization:
  tagline: Опции за персонализиране
  title: Какво може да бъде<br />Персонализиран
  subtitle: Почти всеки аспект от нашите продукти може да бъде персонализиран според изискванията на клиента. По-долу са посочени най-честите категории за персонализация.
  columns: 3
  items:
    - title: Корпус и структура
      description: Персонализирана дължина на корпуса, ширина на гредата, ъгъл на деадрайз, диаметър на тръбата, конфигурация на камерите и клас на материала.
      icon: tabler:sailboat
    - title: Цветове и графики
      description: Цвят на тръбата (PVC/Hypalon), цвят на гелкоата на корпуса, цвят на конзолата, графики на палубата, разположение на логото и дизайн на опаковката.
      icon: tabler:palette
    - title: Конзола и контроли
      description: Централна конзола, странична конзола или кормилно управление с волан. Персонализирано разположение на инструменталния панел, разположение на ключовете и позиция на кормилото.
      icon: tabler:steering-wheel
    - title: Седалки и тапицерия
      description: Седалки тип „жокей“, пейки, луксозна тапицерия, шевове в съответствие с цвета, сгъваема или подвижна конфигурация.
      icon: tabler:armchair
    - title: Аксесоари и оборудване
      description: Стълби за гмуркане, рафтове за бутилки, теглещи пилони, T-топове, Bimini покривала, озвучителни системи, навигационна електроника и спасително оборудване.
      icon: tabler:backpack
    - title: Опаковане и брандиране
      description: Персонализирана търговска опаковка, кутии с частна марка, транспортни кашони с маркировка на бранда, етикети, и ръководства за потребителя на езика на клиента.
      icon: tabler:box
content_industries:
  tagline: Индустриални приложения
  title: Инженерни решения<br />по индустрии
  subtitle: Нашият инженерeн екип е разработил продукти за широк спектър морски приложения — всеки със специфични изисквания и критерии за ефективност.
  columns: 3
  items:
    - title: Операции по гмуркане
      description: Подсилени палуби, интеграция на стълби за гмуркане, системи за съхранение на резервоари и стабилни платформи за търговски центрове за гмуркане по целия свят.
      icon: tabler:lifebuoy
    - title: Спасителни и аварийни операции
      description: Дизайни на корпуса с висока скорост, самопочистващи се палуби, системи за монтиране на оборудване и многокамерни безопасни конфигурации за операции по SAR.
      icon: tabler:alert-triangle
    - title: Морски туризъм
      description: Разпределение за комфорт на пътниците, интеграция на сенници, системи за качване и гориво-ефективни конфигурации за трансфер до островите.
      icon: tabler:beach
    - title: Луксозни яхтени придружители
      description: Компактни дизайни за съхранение на кранове, опции за луксозно оформление, съвпадащи цветове с майчината яхта и високопроизводителни характеристики за теглене.
      icon: tabler:sailboat
    - title: Риболов и аквакултури
      description: Конфигурации с плоска палуба, интеграция на живи резервоари, разпределение на държачи за въдици, антикорозионна хардуерна екипировка за продължително излагане на солена вода.
      icon: tabler:fish
    - title: Пристанищни и индустриални
      description: Укрепване на корпуса за тежки натоварвания, разпределение за работни лодки, конфигурации за превоз на персонал и интеграция на оборудване за офшорни операции.
      icon: tabler:ship
