hero:
  tagline: Производствен капацитет
  title: Производствен капацитет и годишно производство
  subtitle: Фабрика с площ 12 000 м², произвеждаща 15 000 дъски годишно с възможност за разширяване
intro: Paddle Board Overstock управлява едно от най-големите специализирани производства на надуваеми SUP дъски в Вейхай, Китай. Нашата фабрика с площ 12 000 м² е организирана в шест специализирани цеха, работещи паралелно, което ни дава капацитет да произвеждаме 15 000 дъски годишно от серията all-around, touring и art-series SUP.
highlights:
  - value: 12,000 m²
    label: Обща производствена площ
    detail: В 6 специализирани работилници
  - value: 15,000
    label: Годишно произведени дъски
    detail: Всестранни, туристически и художествени серии SUPs
  - value: 200-300
    label: Квалифицирана работна сила
    detail: 25+ инженери, 2 смени/ден
  - value: 50+
    label: Страни износ
    detail: ЕС, САЩ, Австралия, Близък изток, Азия
  - value: 2-3
    label: Работни дни за изпращане
    detail: Поръчките на склад напускат Вейхай бързо
  - value: 10+
    label: Години опит в износ
    detail: От 2012г
workshops:
  - title: SUP Производство на бордове
    description: '4 паралелни монтажни линии за надуваеми SUP бордове. Всяка линия може да произвежда 50–80 бордове на смяна. Станции за дигитален и ситопечат работят едновременно. Годишен капацитет SUP: 8 000+ бордове.'
    output: 8 000+ SUPs/година
  - title: Изкуство на палубата и EVA завършек
    description: Специализиран цех за довършителни работи на art-series дъски. Прецизно EVA рязане, ръчно подредени модели на дъската и финално обтягане. Годишният капацитет покрива целия асортимент от art-series.
    output: Пълен асортимент art-series
  - title: Drop-Stitch Ламиниране
    description: 'Линии за термално ламиниране слепват drop-stitch ядра към външните PVC ламини. Ръбовите ленти са трислойно слепени за херметична здравина. Годишен капацитет: 15 000+ ядра.'
    output: 15 000+ ядра/година
  - title: Аксесоари и опаковане
    description: Линии за сглобяване и опаковане на помпи, гребла, въжета и комплекти за ремонт. Дъските се вакуумират, опаковат в кутии и палетират за световна доставка.
    output: Комплектни пакети, готови за изпращане
tldr:
  summary: Paddle Board Overstock произвежда 15 000 падъл борда годишно в собствената си фабрика от 12 000 м² в Уейхай, Китай. 200-300 квалифицирани работници в 2 смени, продаващи директно на гребците в 50+ страни.
  points:
    - 12 000 м² производствен кампус в Уейхай
    - 15 000 борда произведени на година
    - 200-300 квалифицирани работници, 2 смени на ден
    - Поръчки на склад се изпращат за 2-3 работни дни
    - 2-годишна гаранция за всяка платка
