hero:
  tagline: Производствен капацитет
  title: Производствен капацитет и годишно производство
  subtitle: 12 000 м² съоръжение, произвеждащо 15 000 лодки годишно с възможност за разширяване
intro: Aquafarer управлява едно от най-големите специализирани съоръжения за производство на надуваеми лодки в Циндао, Китай. Нашата фабрика от 12 000 м² е организирана в шест специализирани работилници, работещи паралелно, което ни дава капацитет да произвеждаме 15 000 лодки годишно във SUP, каяк, динги, RIB и линии за защитно оборудване.
highlights:
  - value: 12,000 m²
    label: Обща производствена площ
    detail: В 6 специализирани работилници
  - value: 15,000
    label: Лодки, произвеждани годишно
    detail: SUPs, каяци, RIBs, динги, защитно оборудване
  - value: 200-300
    label: Квалифицирана работна сила
    detail: 25+ инженери, 2 смени/ден
  - value: 50+
    label: Страни износ
    detail: ЕС, САЩ, Австралия, Близък изток, Азия
  - value: 30–45
    label: Стандартно време за изпълнение (дни)
    detail: От потвърждение на поръчката до FOB
  - value: 10+
    label: Години опит в износ
    detail: От 2012г
workshops:
  - title: SUP Производство на бордове
    description: '4 паралелни монтажни линии за надуваеми SUP бордове. Всяка линия може да произвежда 50–80 бордове на смяна. Станции за дигитален и ситопечат работят едновременно. Годишен капацитет SUP: 8 000+ бордове.'
    output: 8 000+ SUPs/година
  - title: RIB Производство на лодки
    description: 'Специализирана работилница за фибростъклени корпуси с 6 форми за RIB корпуси до 7,6 м. Зона за заваряване на тръби и монтаж обработва 3–5 RIBs едновременно. Годишен капацитет RIB: 2 000+ лодки.'
    output: 2 000+ RIBs/година
  - title: Надуваеми лодки и динги
    description: 'Мултифункционални производствени линии за надуваеми лодки, каяци и динги. Станции за горещ въздух, RF диелектрични преси и монтажни работни станции се пренастройват според поръчката. Годишен капацитет: 5 000+ единици.'
    output: 5 000+ единици/година
  - title: Предпазно оборудване
    description: 'Отделно производство в чиста стая за спасителни жилетки и защитно оборудване. Специализирани станции за шиене, вграждане на пяна и тестове. Годишен капацитет на спасителни жилетки: 50 000+ единици.'
    output: 50 000+ спасителни жилетки/година
oem_capacity:
  moq: 'SUP: 5–10 единици | RIB: 2–5 единици | Каяк/Голяма лодка: 10–20 единици | Персонализована форма: 200+ единици'
  lead_time: Стандартно 30–45 дни. Проба 15–20 дни. Възможно бързо изпълнение.
  payment: T/T 30% депозит + 70% преди изпращане. Приемат се L/C, Western Union.
