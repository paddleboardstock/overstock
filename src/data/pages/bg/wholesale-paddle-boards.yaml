hero:
  tagline: SUP Едро бордове
  title: Едро надуваеми гребни дъски<br />за малки предприятия
  subtitle: Чисто нови излишни SUP бордове в малки бизнеси количества. Поръчайте 5–20 дъски, смесете всички модели в една пратка и изберете експресен въздушен или морски товар до 50+ държави.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Едро надуваеми SUP дъски от Paddle Board Overstock готови за изпращане
direct_answer: Paddle Board Overstock доставя чисто нови надуваеми SUP дъски на малки търговци по целия свят. Няма голяма минимална поръчка — поръчката на едро започва само от 5 борда и можете да смесите всички налични модели в една поръчка. Дъските се изпращат от нашата база във Вейхай, Китай, чрез експресен въздушен товар (1–3 дъски, мостри или спешни презареждане) или консолидиран морски товар (5–20 поръчки от търговци на дребно). Всяка дъска е 100% тествана под налягане преди изпращане и е покрита с нашата 2-годишна SUP гаранция.
tldr_points:
  - 'MOQ Нисък: поръчките на едро започват от 5 дъски — размер за малки магазини, не за контейнерни товари'
  - 'Поръчки за смесени модели: комбинирайте всички SUP налични модели в една пратка'
  - 'Два варианта за доставка: експресен въздушен товар за 1–3 борда, морски товари за 5–20 бордови поръчки'
  - 'Чисто нов запас: 100% тестван под налягане, 99.3% успешно преминаване на финална инспекция, 2-годишна SUP гаранция'
why_retailers:
  title: Защо малките търговци избират дъски SUP с излишък
  subtitle: Не ви трябва склад или бюджет за контейнер, за да купувате на едро.
  items:
    - title: Количества, подходящи за малък бизнес
      description: Традиционният едро изисква стотици единици на поръчка. Нашият модел на излишък е създаден за независими магазини — започнете с 5 дъски и увеличавайте поръчката си с растежа на магазина.
    - title: Реално ценообразуване на едро без ангажимент за обем
      description: Тъй като продаваме излишък — излишно производство и внимателно набавени от избрани партньорски фабрики — получаваме ценообразуване на единици на ниво обем без риска на ниво обем.
    - title: Комбинирайте модели, за да съответстват на вашите клиенти
      description: Плажните магазини, магазините за езерна екипировка и градските магазини обслужват различни гребци. Комбинирайте универсални, туристически и сърф SUP модели в една поръчка, така че рафтът ви да отговаря на местното търсене.
    - title: Чисто нов, никога не използван
      description: Всяка дъска в нашия излишък е чисто нова и неизползвана — не секунди, не връщане. Всяка дъска е 100% тествана под налягане преди да напусне склада.
    - title: Бърза и гъвкава международна доставка
      description: Експресният въздушен товар бързо доставя 1–3 дъски или примерни поръчки до вратата ви; консолидираният морски товар поддържа ниската цена на борд при поръчки от 5–20 бордови търговци.
    - title: Подкрепено с реална гаранция
      description: Търговията на едро не означава неподдържана. Всяка SUP платка предлага нашата 2-годишна SUP гаранция, същото покритие, което даваме на всеки клиент в 50+ държави.
pricing_section:
  tagline: Едрови цени
  title: Просто, прозрачно ценообразуване на едро
  subtitle: Цените се посочват за поръчка според моделите, количествата и начина на доставка, който изберете. Няма скрити такси — офертата, която получавате, е цената, която плащате.
  points:
    - title: Разпределени по количество
      description: Цените на единиците спадат с увеличаване на размера на поръчката. Поръчка от 10 платка струва по-добре на плата от поръчка с 5 борда; поръчка от 20 платка е още по-добра.
    - title: Смесените модели се броят към един общ брой
      description: Вашият отстъпка се базира на общия брой дъски в поръчката — не на модел. Смесването на 4 различни модела × по 3 дъски се брои като поръчка от 12 дъски.
    - title: Оферти с опции за доставка
      description: Всяка оферта включва както експресни, така и морски товарни опции с приблизително време за транзит, така че можете да изберете баланса между скоростта и разходите, който отговаря на вашия график за презареждане.
    - title: Не е необходим акаунт или членство
      description: Няма клуб за едро и няма годишна такса. Поискайте оферта, потвърдете поръчката и ние изпращаме.
inventory_section:
  tagline: Текущ инвентар
  title: Налични продукти и текущ инвентар
  subtitle: Всички 11 продукта по-долу са текущи излишни запаси. Условията са напълно нови; нивата на запасите се променят седмично, затова потвърдете наличността си в заявката за оферта.
  table_labels:
    product: Модел
