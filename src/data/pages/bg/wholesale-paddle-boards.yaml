    price: Търговска цена
    action: Свържете се с нас
    condition_value: Ново
    note: Показан за справка е посочена търговската цена. Цената на едро се посочва на поръчка и е по-ниска от тази на дребно.
who_section:
  tagline: Кого доставяме
  title: Построено за независими бизнеси за водни спортове
  items:
    - title: Плажни и сърф магазини
      description: Малки крайбрежни търговци, които се нуждаят от 5–15 дъски на сезон, смесени между универсални модели за туристи и сърф дъски за местните.
    - title: Онлайн продавачи
      description: Магазини за електронна търговия и търговци на пазара тестват SUP категорията без да се ангажират с пълен контейнер от един модел.
    - title: Наемни автопаркове и училища
      description: Операции по наеми и SUP училища, които допълват автопаркове — издръжливи дъски, смесени модели за обслужване на различни размери клиенти и гаранционно осигуряване.
    - title: Курорти и туроператори
      description: Хотели, островни курорти и туроператори SUP допълват дейността си с малки първоначални автопаркове и лесно сезонно презареждане.
how_to_order:
  tagline: Как работи
  title: Как да направите поръчка на едро
  steps:
    - title: Разгледайте инвентара
      description: Прегледайте 11-те налични модела по-горе или използвайте селектора за смесени модели, за да изберете комбинация, която пасва на вашите клиенти.
    - title: Поискайте оферта
      description: Изпратете ни моделите, приблизителните количества, вашата страна и предпочитаната скорост на доставка чрез формуляра за запитване по-долу. Отговаряме с ценообразуване на единица и опции за доставка.
    - title: Потвърдете и платете
      description: Одобрете крайното ценово предложение — модели, количества, метод на доставка и обща сума. Условията за плащане са потвърдени при изготвяне на офертата.
    - title: Ние тестваме, пакетираме и изпращаме
      description: Всеки борд е 100% тестван под налягане, окомплектован с пълния си аксесоарен комплект и изпратен от Вейхай. Получавате проследяване за целия път.
