faq_section:
  title: ЧЗВ за търговия на едро
  items:
    - q: Каква е минималната едрова поръчка?
      a: Пет дъски. Нашият модел за излишни наличности е създаден за малки търговци - не е нужно да пълните контейнер, за да получите цени на едро.
    - q: Мога ли да комбинирам различни SUP модели в една едротна поръчка?
      a: Да. Поръчките с различни модели са едно от най-големите предимства на закупуването на излишни запаси — комбинирайте всички налични модели в една доставка и общият брой платки определя вашата ценова категория. Вижте нашата страница за едро с различни модели за подробности.
    - q: Платките напълно нови ли са?
      a: Да. Всяка платка е напълно нова, неизползвана излишна наличност — никога втора употреба, ремонтирани или върнати от клиенти. Всяка платка преминава 100% тест за налягане преди изпращане.
    - q: Колко по-евтино е на едро в сравнение с дребно?
      a: Цените на едро се посочват на поръчка въз основа на модели и количества и са значително по-ниски от посочените по-горе дребни цени. Изискайте оферта за желаната комбинация и ние ще я ценообразуваме точно.
    - q: Кой метод на доставка трябва да избера?
      a: Експресната въздушна поща е подходяща за 1–3 платки, мостри и спешни презареждания. Консолидираната морска доставка е икономичният избор за поръчки от 5–20 платки за търговци. Предлагаме и двете опции с всяко запитване.
    - q: Каква гаранция имат платките на едро?
      a: Същата 2-годишна SUP гаранция, която даваме на всеки клиент във всички от 50+ страни, до които доставяме.
    - q: Доставяте ли до моята страна?
      a: В момента доставяме до повече от 50 страни, с регионални насоки за Латинска Америка, Югоизточна Азия, Африка, Близкия Изток и ключови пазари, включително Мексико, Бразилия, Филипините, Индонезия, Тайланд, Южна Африка, Кения и ОАЕ. Попитайте при заявка за оферта и ние ще потвърдим настоящата услуга за вашия адрес.
