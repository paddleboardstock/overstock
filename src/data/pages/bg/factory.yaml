hero:
  tagline: Фабрика
  title: Фабрика и производство
  subtitle: 12 000 m2 интегрирано производство — от суровината до готовата лодка
intro:
  - Като фабрична марка на **Paddle Board Overstock Qingdao Manufacturing Hub**, Paddle Board Overstock контролира всяка фаза на производството — от пристигането на суровите PVC и стъклопластовите материали до финалната проверка преди доставка на готовата лодка. Нашето производствено съоръжение в Икономическата зона за развитие на Циндао обхваща 12 000 квадратни метра и включва специализирани работилници за PVC рязане, термосвиване на тръби, производство на стъклопластови RIB корпуси, SUP дигитален печат, финален монтаж и тестване на качеството.
  - Чрез интегриране на дизайн, инженеринг, прототипиране, производство и тестване под един покрив, ние елиминираме неефективността на договорното производство и поддържаме директен контрол върху качеството на изработката, избора на материали и сроковете за доставка. Всяка лодка, която напуска нашата работилница, е построена от нашите хора, на нашето оборудване, според нашите стандарти.
