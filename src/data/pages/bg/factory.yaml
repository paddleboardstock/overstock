  title: Метрики за контрол на качеството
  subtitle: Реални данни за успешни/неуспешни стойности от нашата производствена линия. Нашата лаборатория за качество работи независимо от производството и докладва директно на ръководството.
  stats:
    - value: 100%
      label: Устройства подложени на тест за налягане
      detail: Всеки борд, всяка камара, всяка партида
    - value: <5%
      label: Максимално допустимо налягане
      detail: Повече от 24 ч при 1,25× номинално налягане
    - value: 99.3%
      label: Бездефектен процент
      detail: Според вътрешното QC вземане на проби
    - value: 24–48h
      label: Време на задържане на налягането
      detail: В зависимост от категорията на продукта
    - value: 1.25×
      label: Тестово налягане спрямо номинално
      detail: Марж на безопасност за всяка камера
    - value: 0%
      label: Толеранс при дефекти на безопасността
      detail: Вентили, D-пръстени, шевове, плавучест
