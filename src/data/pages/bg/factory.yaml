hero:
  tagline: Фабрика
  title: Фабрика и производство
  subtitle: 12 000 м² интегрирано производство — от суровината до готовата дъска
intro:
  - Като фабрична марка на **Paddle Board Overstock Weihai Manufacturing Hub**, Paddle Board Overstock контролира всеки етап от производството — от пристигането на суровите PVC и drop-stitch материали до крайната проверка преди доставката на готовата дъска. Нашето производствено съоръжение в Икономическата зона за развитие на Уейхай обхваща 12 000 квадратни метра и разполага с отделни работилници за рязане на PVC, термосвързване и заваряване, завършване на декорация на палубата, окончателно сглобяване и контрол на качеството.
  - Чрез интегриране на проектиране, инженеринг, прототипиране, производство и тестване под един покрив ние елиминираме неефективностите на поръчковото производство и поддържаме директен контрол върху качеството на изработката, избора на материали и сроковете за доставка. Всяка дъска, която напуска нашата работилница, е произведена от нашите хора, на нашето оборудване и според нашите стандарти.
