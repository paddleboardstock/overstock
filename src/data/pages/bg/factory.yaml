qc_section:
  tagline: Контрол на качеството
  title: Процес на тестване и осигуряване на качеството
  subtitle: Всяка лодка преминава задължително тестване преди изпращане. Нашата лаборатория за качество работи независимо от производството и докладва директно на ръководството.
  steps:
    - step: '1'
      title: Инспекция на суровини
      desc: PVC, Hypalon, и drop-stitch тъканите преминават през опън тест (ASTM D751), разпространение на разкъсване и UV проверка на съпротивлението преди всяка партида да влезе в производство.
    - step: '2'
      title: 48-часов тест за задържане на въздуха
      desc: Всяка камера на тръбата се надува до 125% от номиналното налягане и се задържа 48 часа. Спад на налягането над 5% задейства автоматично отхвърляне и повторна инспекция на шевовете.
    - step: '3'
      title: Тестване на натоварване и баланс
      desc: Завършените лодки се натоварват до максимален номинален капацитет и се тестват за стабилност, борд и управляемост. Всеки съд се тества във вода преди финална инспекция.
oem_section:
  tagline: OEM Проекти
  title: OEM Казуси за бранд и партньорство
  subtitle: От концепцията до контейнера — как помагаме на глобалните марки да пуснат и мащабират своите надуваеми водни съдове.
  cases:
    - challenge: Европейският търговец на открито се нуждаеше от SUP частна марка с уникална графика за тераси, екологично PVCчиста и готова за търговия опаковки — всичко доставено в рамките на 60 дни.
      solution: Разработихме персонализирани дигитални печатни файлове, REACHсъпоставихме -съвместими PVCс източника , и стиснахме проби от 3 рунда до 1, като съвместно разположих дизайнерския екип във фабриката ни в Циндао.
      result: 55 дни от подписването на пощата доFOB. 2 400 единици в 4 SKU. Повторна поръчка е направена преди да пристигне първият контейнер.
    - challenge: Американският стартъп за водни спортове се нуждаеше от високопроизводителен drop-stitch каяк с персонализирана форма на корпуса, съвместно брандирана опаковка и BSCI сертификация за продажба на дребно.
      solution: Адаптирахме drop-stitch съществуващата каяк форма с модифициран профил на люлеещия се, разработих съвместно брандирано оформление на опаковки и предоставиха пълна BSCI документация за одит.
      result: Успешно листван в 3 големи американски вериги за дейности на открито. 5 000+ единици през първата година с 98% коефициент на продажба.
    - challenge: Австралийският дистрибутор изискваше CERIB сертифицирана гама с персонализирани цветове на тръбите, Hypalon опция за ъпгрейд и съответствие с австралийския стандарт AS 1799.
      solution: Произвеждаше предпроизводствени проби с 4 цветни варианта на тръби, CSM Hypalon доставени от японски доставчик, и координираше тестове за съответствие с AS 1799 от трети страни.
      result: Серия от 3 модела, RIB пусната на пазара на Австралия/Нова Зеландия. Последва спечелване на държавен търг за 12 RIBsпатрула.
faq_section:
  tagline: ЧЗВ
  title: B2B & OEM Често задавани въпроси
  questions:
    - q: Каква е минималната поръчка (MOQ) за OEM надуваеми SUP дъски?
      a: MOQ започва от 5–10 единици за стандартни OEM модели. Персонализирани форми и проекти с частна марка изискват минимум 200 единици в зависимост от сложността. Пробни поръчки и образци са налични за стартиране на нови марки.
    - q: Дали Paddle Board Overstock притежава BSCI сертификат?
      a: Да. Нашата фабрика поддържа валидна BSCI сертификация за социално съответствие (доклад от одита е на разположение при поискване). Също така притежаваме ISO 9001:2015 за управление на качеството, и 64 от нашите продуктови модели имат CE сертификация (TÜV Rheinland). Документацията за съответствие REACH и RoHS се предоставя с всяка OEM доставка.
    - q: Какво е типичното време за изпълнение на поръчка OEM?
      a: Стандартното време за изпълнение е 30–45 дни от потвърдена поръчка и аванс. Разработването на персонализиран калъп добавя 15–20 дни за инструментална обработка. Предлагаме ускорено производство за спешни поръчки и сезонни натоварвания през предлятното време (януари–март).
    - q: Можете ли да изпратите FOB Цингао или CIF до нашето пристанище?
      a: Да. Ние доставяме до FOB Циндао, CIF основни глобални пристанища и DDP за квалифицирани партньори. Нашият логистичен екип управлява резервацията на контейнери, износната документация и митническото оформяне. Ние доставяме до 50+ държави в целия ЕС, САЩ, Австралия и азиатските пазари.
b2b_moq: 'Стандарт MOQ: 5–10 единици на модел (SUP/каяк/drop-stitch). RIB MOQ: 2–5 единици. Приветстваме пробни поръчки за нови партньорства.'
production_flow:
  tagline: Производствен поток
  title: От материал до готова лодка
  subtitle: Всяка лодка преминава през 6 производствени етапа с контролна проверка на качеството на всяка стъпка. Никакви къси пътища, никакви пропуснати инспекции.
  stages:
    - stage: '01'
      title: Приемане на материали и входящ контрол на качеството
      description: Всички получени материали се записват по партиден/лот номер в нашата ERP система. PVC ролки плат, drop-stitch серпентини, клапани, лепила и хардуер са под карантина до одобрение от QC.
      qc_check: Якост на опън (ASTM D751), устойчивост на скъсване (ISO 4674), дебелина, вискозитет на лепилото, визуална проверка за дефекти
      qc_threshold: 100% от тестваните партиди. Отхвърляйте, ако якостта на опън е < 90% от спецификацията, якостта на разкъсване < минималната спецификация или има някакъв визуален дефект
      responsibility: Входящ екип за контрол на качеството (3 инспектора)
    - stage: '02'
      title: CNC Рязане и подготовка на материала
      description: Компютърно оптимизираното нагласяне подрежда панелите върху PVC материал, за да се минимизира отпадъка. Автоматичните CNC рязачки поддържат позиционна точност от 0,1 мм.
      qc_check: Проверка на размерите спрямо CAD DXF файлове, инспекция на качеството на ръбовете, проверка на броя на панелите
      qc_threshold: Всяко 20-то панелно измерване. Допуск ±0,5 мм. Отхвърлете партидата, ако >2% са извън допуск
      responsibility: Ръководител на работилница за рязане
    - stage: '03'
      title: Заваряване и Drop-Stitch Свързване
      description: Drop-stitch сърцевини са свързани с външни PVC ламинирани слоеве чрез термоламиниране. Камерите на тръбите са RF-заварени или заварени с горещ въздух. Релсовите ленти са трислойно слепени чрез фузионна връзка.
      qc_check: Тест за разслояване на всеки 50 единици (ASTM D751), измерване на ширината на заварката, преглед на записите за температурата на горещ въздух, визуална проверка на шева под подсветка
      qc_threshold: Минимална якост на обелване 8 N/cm. Допуск на ширина на заварката ±1 мм. Всяко видимо канализиране = отхвърляне
      responsibility: Контрол на качеството при заваряване (2 инспектора на смяна)
    - stage: '04'
      title: Сглобяване и въжене
      description: 'Лодките се придвижват до последния монтаж, където се съединяват всички компоненти: корпус, тръби, инсталирани клапани, D-пръстени, дръжки, кутии за плавници и монтаж на носещата чанта. Всяка единица следва 100-точков монтажен контролен списък.'
      qc_check: Подписване на контролен списък с 100 точки за всяко звено, тест на функцията на клапана (10 цикъла отваряне/затваряне), проверка на въртящия момент на хардуера, визуална инспекция
      qc_threshold: 'Политика за нулеви дефекти при критични за безопасността елементи (клапани, D-пръстени, дръжки). Незначителни козметични: AQL 2.5 (ISO 2859)'
      responsibility: Контрол на екипа за + монтажна линия
    - stage: '05'
      title: Тестване на налягане и задържане на качество
      description: Всяка камера се надува до номинално налягане 1.25× (обикновено 20–25PSI) и се задържа за 24–48 часа. Сензорите за налягане записват непрекъснато. Камери с падане на налягането над 5% се отхвърлят и изпращат за повторна инспекция на шевовете.
      qc_check: 24-часов дневник на задържане на налягането, калибрирането на сензора се проверява ежедневно, температурно компенсирано измерване на налягането, повторен тест на шева след ремонт
      qc_threshold: Максимален спад от 5% налягане за 24 часа при стабилна температура. Всяка камера, надвишаваща тази стойност = 100% повторен тест на цялата производствена партида
      responsibility: Лаборатория за качество (независимо от производството, докладва на ръководството)
    - stage: '06'
      title: Финална инспекция и опаковане
      description: Финална визуална и функционална инспекция. Повърхностни дефекти, цветова консистенция, проверка на етикети/контейнери, целостта на опаковката и пълнота на аксесоарите. Единиците се вакуумно опаковани, опаковани и палетизирани за товарене в контейнери.
      qc_check: Пълна визуална инспекция, контролен списък с аксесоари на SKUвсяка, тест за падане на опаковки (1 м, произволна проба), проверка на етикет/баркод сканиране
      qc_threshold: AQL 2.5 за сериозни дефекти, AQL 4.0 за дребни. Нулева толерантност към дефекти при безопасността. 100% от единиците са визуално инспектирани
      responsibility: Финален екип за контрол на качеството (4 инспектори) + Ръководител на екипа за опаковане
workforce:
  tagline: Нашите хора
  title: Работна сила и експертиза
  engineers: 25+
  engineers_detail: Инженери в областта на научноизследователската и развойна дейност, дизайна на форми, лабораторията за материали и производственото инженерство. Средно 7+ години в производството на надуваеми машини.
  shift_pattern: 2 смени на ден (07:00–15:30, 15:30–00:00). Опционална нощна смяна за спешни поръчки.
  training: Месечно обучение по контрол на качеството, тримесечни упражнения по безопасност, годишна оценка на уменията. Новите служители преминават 40-часова въвеждаща процедура преди да започнат работа на производствената линия.
  departments:
    - name: Развойна дейност и инженерство
      count: 25+
      role: Дизайн на продукти, инженерство на калъпи, лаборатория за материали
    - name: Рязане и подготовка на материала
      count: 15
      role: CNC рязане, подготовка на панели, обработка на материали
    - name: Заваряване и ламиниране
      count: 40
      role: RF заваряване, заваряване с горещ въздух, drop-stitch свързване
    - name: RIB Корпус (FRP)
      count: 30
      role: Фибростъклен пласт, гелкоут, вакуумно пакетиране
    - name: Сглобяване и въжене
      count: 35
