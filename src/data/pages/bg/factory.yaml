material_traceability:
  tagline: Проследимост
  title: Проследяване на материали и контрол на партидата
  description: На всяка партида суров материал се присвоява уникален номер на лот в нашата ERP система. От пристигането през производството до крайния продукт, всяка товарителница на лодката е свързана обратно с оригиналната партида на доставчика. Това позволява пълна проследимост нагоре за всяко запитване относно качеството или съответствието.
  system: Персонализирани ERP (вътрешна система) + физически тагове за партида на всяка работна поръчка
  coverage: 100% от производствените материали — PVC, Hypalon, drop-stitch плат, лепила, клапани, хардуер, опаковка
  records_retained: 10 години (според изискването CE 2013/53/ЕС)
  suppliers:
    - material: Морски клас PVC
      source: Китайски и корейски доставчици
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Drop-stitch плат
      source: Вътрешно тъкане + външен партньор
      certified: Вътрешен КК + доставчик ISO 9001
    - material: Вентили и хардуер
      source: Chinese OEM suppliers
      certified: ISO 9001, сертификати за материал за всяка партида
