workshops_section:
  tagline: Работилници
  title: Производствени работилници
  workshops:
    - title: PVC Рязане и подготовка на материали
      description: Автоматични CNC машини за рязане обработват PVC и drop-stitch платове с прецизност под милиметър. Оптимизираното чрез компютър разполагане минимизира загубата на материали и гарантира, че всяка панелна част отговаря на размерните си спецификации преди заваряването.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Заваряване и термосвързване
      description: Специализирана заваръчна работилница с машини за термично запечатване и RF диелектрични преси. Заварчиците с горещ въздух свързват drop-stitch и запалват ламинираните ядра и релсовите ленти, докато RF заварките произвеждат високоякостни херметични шевове.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Изкуство на палубата и EVA завършек
      description: 'Тук се оформят деки от серията Art: прецизно EVA изрязани панели от пяна се полагат в модели с пълна настилка, свързват се и обработват на ръка за захващащ, удобен и издръжлив завършек — характерният вид на всяка дъска от арт серията.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: Печат и декорация
      description: SUP дъските се декорират чрез цифров печат за пълноцветни графики и ситопечат за лога и повтарящи се мотиви. Цифровите принтери произвеждат фото-качествени дизайни за палубата, докато ситопечатът осигурява издръжливи, ярки брандови знаци.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Крайно сглобяване и окомплектоване
      description: Поточната линия, където дъските получават клапаните, D-пръстените, дръжките, стабилизаторите и каишките. Всяка дъска следва 100-точков контролен списък за сглобяване, подписан от ръководителя на екипа.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Тестване и инспекция на качеството
      description: Всяка завършена дъска преминава задължително тестване за задържане на въздух, проверка на лющенето на шевовете и пълна проверка на системата преди изпращане. Нашата лаборатория за качество работи независимо от производството и докладва директно на ръководството.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
