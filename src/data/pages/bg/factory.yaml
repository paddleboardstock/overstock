workshops_section:
  tagline: Работилници
  title: Производствени работилници
  workshops:
    - title: PVC Рязане и подготовка на материали
      description: Автоматични CNC машини за рязане обработват PVC, Hypalon и drop-stitch тъкани с точност до под милиметър. Оптимизираното чрез компютър подреждане минимизира отпадъците от материал и гарантира, че всеки панел отговаря на размерните си спецификации преди заваряване.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Заваряване на тръби и топлинно уплътняване
      description: Специална заваръчна работилница с машини за топлинно уплътняване и RF диелектрични пресове. Горещовъздушните уплътнители свързват и стопяват PVC тръбни камери, докато RF заварките произвеждат здрави, въздухонепроницаеми шевове, които надхвърлят изискванията на ISO 9001.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Производство на корпус — стъклопласт
      description: RIB корпусите на лодки се произвеждат чрез ръчно полагане на стъклопластови форми с полиестерни и винилестерни смоли. Всеки слой се навива на ръка и се вакуумира за постоянна качество. Кабината за пръскане на гелкоут осигурява високогланцев морски финиш, устойчив на UV.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: Печат и декорация
      description: SUP дъските се декорират чрез цифров печат за пълноцветни графики и ситопечат за лога и повтарящи се мотиви. Цифровите принтери произвеждат фото-качествени дизайни за палубата, докато ситопечатът осигурява издръжливи, ярки брандови знаци.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Крайно сглобяване и окомплектоване
      description: Сглобителна линия, където стъклопластовите корпуси и PVC тръби се комбинират, двигателите се монтират, кормилните и контролни системи се свързват и електрическите системи се окабеляват. Всяка лодка следва 100-точков списък за сглобяване, подписан от ръководителя на екипа.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Тестване и инспекция на качеството
      description: Всяка завършена лодка преминава задължително тестване на задържане на въздух, проверка на шевовете и пълна проверка на системите преди доставка. Нашата лаборатория по качество работи независимо от производството и докладва директно на управлението.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
