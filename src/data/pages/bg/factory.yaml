material_traceability:
  tagline: Проследимост
  title: Проследяване на материали и контрол на партидата
  description: На всяка партида суров материал се присвоява уникален номер на партидата в нашата ERP система. От пристигането до производството и крайния продукт, спецификацията на всеки борд се свързва обратно с оригиналната партида на доставчика. Това позволява пълна проследимост нагоре по веригата за всяко запитване относно качеството.
  system: Персонализирани ERP (вътрешна система) + физически тагове за партида на всяка работна поръчка
  coverage: 100% от производствените материали — PVC, drop-stitch плат, EVA пяна, лепила, клапани, хардуер, опаковки
  records_retained: 10 години
