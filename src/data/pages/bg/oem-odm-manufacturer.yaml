breadcrumb: OEM/ODM Производител
tldr:
  summary: Aquafarer е директен производител от фабрика OEM/ODM. 12 000 м² ISO 9001:2015 съоръжение, 15 000 единици годишен капацитет, CE/BSCI/REACH/UKCA съответствие, нисък MOQs от 2-10 единици.
  points:
    - 12 000 м² ISO 9001:2015 сертифицирано съоръжение в Циндао
    - 15 000 единици годишен капацитет с 200-300 квалифицирани работници
    - CE 2013/53/ЕС, UKCA, BSCI, REACH съответствие
    - 'Нисък MOQs: 2-5 единици (RIB), 5-10 единици (SUP) за стандартни модели'
    - 50+ държави за износ с FOB доставка от Циндао
trust_badges:
  badges:
    - icon: ⭐
      title: ISO 9001:2015 сертифицирано
      desc: SGS-аудитирана система за управление на качеството във всички производствени линии.
      variant: cert
    - icon: ⭐
      title: CE & UKCA Съвместимо
      desc: Пълно съответствие с изискванията на ЕС 2013/53/ЕС и маркировките на Великобритания.
      variant: cert
    - icon: ⭐
      title: BSCI Социален Одит
      desc: Проверени етични практики на труд и стандарти на работното място.
      variant: standard
    - icon: ⭐
      title: Нисък MOQ от 2 единици
      desc: 'Стандартни RIB модели от 2-5 единици, SUP от 5-10 единици. Персонализиран калъп: 200+.'
      variant: standard
process_section:
  eyebrow: Нашият процес
  title: Съвкупна OEM/ODM Работна последователност
  subtitle: От дизайнерски бриф до товарене в контейнер — шест стъпки до вашето частно брандирано надуваемо водно средство.
  steps:
    - step: '01'
      title: Спецификация и дизайнерски бриф
      desc: Споделете целевите спецификации, CAD чертежи или референтен продукт. Нашият инженерeн екип преглежда материали, размери и изисквания за съответствие (CE, BSCI) преди да предостави оферта.
    - step: '02'
      title: 3D прототипиране на калъпи
      desc: Ние проектираме и CNC-машинираме персонализирани калъпи за SUP дъски, корпуси на каяци и RIB компоненти. Прототипни образци се произвеждат в рамките на 15–20 работни дни за вашето одобрение.
    - step: '03'
      title: Избор на материали и производство на проби
      desc: Изберете от военен клас PVC (0.9мм–1.2мм), Hypalon CSM, или drop-stitch основни тъкани. Ние произвеждаме пред-производствени проби с вашите фирмени цветове, лого и опаковка за одобрение.
    - step: '04'
      title: CE Фабричен одит и съответствие
      desc: Всяка OEM поръчка включва документи за съответствие — CE декларация за съответствие, ISO 9001 проследими записи, BSCI доклад за социално съответствие и REACH материали декларации.
    - step: '05'
      title: Масово производство и проверка на качеството по време на процеса
      desc: Производствени серии се провеждат според нашия 100-точков контролен списък за качество. Всяка единица преминава 24-часов тест за задържане на налягане, тест за разлепване на шевовете и визуална инспекция преди опаковане.
    - step: '06'
      title: FOB Логистика и доставка от Циндао
      desc: Готовите изделия се палетират, опаковат със свиване и се товарят в контейнер на пристанище Циндао. Ние се грижим за цялата документация за износ, митническо освобождаване и предоставяме проследяване на пратката в реално време.
capabilities_section:
  eyebrow: Производствени възможности
  title: Какво строим
  subtitle: Шест основни производствени възможности за B2B глобални партньори.
  items:
    - title: Drop-Stitch SUP Производство на платки
      desc: drop-stitch Ламиниране с пълно ядро за твърди, високонапорни (15–PSI20) изправени дъски за гребане. Персонализирана дължина, ширина, дебелина, профил на люлеещия се елемент и графичен дизайн.
    - title: PVC Производство на надуваеми лодки
      desc: Високочестотни PVC заварени дингита, тендери и спортни лодки. Множество камерни конфигурации, опции на пода (слат, въздушна палуба, рол-ъп) и интеграция на аксесоари.
    - title: Hypalon RIB Изработка на лодки
      desc: Hypalon CSM Търговски тръби, свързани с корпуси от фибростъкло или алуминиеви дълбоки V. Дължини от 3,3 м до 6,0 м за патрулни, спасителни, обиколки и гмуркане.
    - title: Частна марка и персонализирано брандиране
      desc: 'Пълна услуга с частна марка: индивидуално топлотрансферно лого или ситопечат, брандирана опаковка (кутии за търговия, чанти за носене), ръководства за потребителя на вашия език и баркод/UPCрегистрация.'
    - title: Персонализиран дизайн на калъпи и инструменти
      desc: Вътрешен 3D CAD/CAM инженерен екип. Проектираме и изработваме персонализирани алуминиеви и композитни форми за уникални форми на корпуса, конфигурации на палубата и точки за монтаж на аксесоари.
    - title: OEM Аксесоари и екипировка
      desc: Спасителни жилетки (CE12402), помпи с двойно действие, карбонови/найлонови лопатки, ремонтни комплекти, чанти за носене и каишки. Пълно оборудване и пакетно опаковане за готово представяне в магазина.
experience_section:
  eyebrow: Реален опит
  title: Партньорства, които изграждат брандове
  subtitle: Истински истории от брандове и организации, които си Aquafarer партнираха за OEMODM / производство.
  stories:
    - quote: Събудихме Aquafarer се с скица на салфетка и списък с изисквания. Осем месеца по-късно имахме готов за производство CE продукт, който преминаваше сертификация още при първия опит.
      narrative: Европейски стартъп с SUP новаторски дизайн се Aquafarer обърна за ODM производство. Aquafarer Екипът по R&D премина концепцията през CAD дизайн, структурен анализ на FEA, хидродинамична симулация, създаване на калъпи, изработка на прототипи и производствени инструменти. Основателят на стартъпа посети Циндао три пъти по време на процеса. Крайният продукт премина CE сертификация без никакви промени — резултат, който основателят приписва на Aquafarerразбирането на европейските регулаторни изисквания от инженерния екип от самото начало.
      context: SUP Стартиране на европейската марка, 2023-2024
      source: Brand Founder
    - quote: Нивото NDA на защита и IP Aquafarer сигурност ни дава увереност да споделяме нашите собствени дизайни. Те третират нашия IP като свой собствен.
      narrative: Американска компания за морско оборудване с патентована технология за клапани се нуждаеше от производствен партньор, който да защитава тяхната интелектуална собственост при мащабно производство. След одит на пет китайски производители, те Aquafarer избраха въз основа на протоколите за защита на интелектуалната собственост на фабриката, сигурната обработка на файлове и готовността да подпишат строги NDA. Партньорството е създало три продуктови линии за четири години без инциденти с интелектуална собственост.
      context: Американска компания за морско оборудване, OEM партньорство от 2021 г.
      source: Вицепрезидент на операциите
