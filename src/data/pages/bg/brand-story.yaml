content_founding:
  tagline: Началото
  title: Роден на крайбрежието
  subtitle: 'започна Paddle Board Overstock в крайбрежна работилница в Циндао с една лодка и визия: да се построят надуваеми водни съдове, които да могат да се справят с реални морски условия.'
  paragraphs:
    - През 2012 г. нашите основатели видяха празнина на пазара — повечето надуваеми лодки бяха или достъпни, но ненадеждни, или висококачествени, но прекалено скъпи. Те вярваха, че има място за производител, който предлага както качество, така и стойност.
    - Първият корпус беше построен на ръка, тестван в местни води и усъвършенстван въз основа на реални отзиви от рибари и малки търговски оператори. Този цикъл на обратна връзка — изграждане, тестване, слушане, подобряване — остава в основата на нашата инженерна философия и днес.
    - До 2015 г. новината се разпространи извън Циндао. Международните дистрибутори започнаха да искат мостри. Това, което започна като местна работилница, се превърна в глобален доставчик.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock ранна производствена работилница и производство
content_growth:
  tagline: Растеж и иновации
  title: От работилница до съоръжение от 12 000 м²
  subtitle: Непрекъснатите инвестиции в хора, оборудване и процеси се Paddle Board Overstock превърнаха в модерно морско производствено съоръжение.
  paragraphs:
    - С нарастването на търсенето нараства и нашето съоръжение. Разширихме се от малка работилница до фабрика от 12 000 м² с специализирани производствени линии за RIB лодки, надуваеми лодки, SUP дъски и аксесоари.
    - Инвестирахме в CNC машини за рязане, високочестотно заваръчно оборудване, производствени линии с дроп шевове и комплексни тестови платформи — което ни позволи да контролираме всеки аспект на качеството на производството.
    - Днес нашият екип от 200-300 души включва морски инженери, материаловоди, специалисти по контрол на качеството и квалифицирани майстори — много от които са с Paddle Board Overstock нас от самото начало.
content_mission:
  tagline: Нашата мисия
  title: Инженерна свобода на вода
  subtitle: Всеки продукт Paddle Board Overstock е проектиран да помага на хората да изследват, работят и процъфтяват на водата — надеждно, безопасно и на достъпна цена.
  list:
    - Проектирайте водни съдове, които работят в реални морски условия — не само на теория
    - Изграждайте трайни партньорства с дистрибутори и марки чрез надеждни OEM/ODM услуги
    - Непрекъснато подобрявайте нашите производствени процеси, за да осигурявате по-голяма стойност
    - Подкрепяйте всеки продукт с оригинални резервни части и техническа експертиза
