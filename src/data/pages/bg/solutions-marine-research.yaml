content_challenge:
  tagline: Предизвикателството
  title: Изисквания за морски изследвания<br />Стабилни платформи, готови за инструменти
  subtitle: Научните работни лодки трябва да осигурят стабилна платформа за чувствителни инструменти, тиха работа, за да се избегне безпокойството на дивата природа, и гъвкави разположения за разнообразно научно оборудване.
  paragraphs:
    - Морските изследвания и мониторингът на околната среда изискват работни лодки, които служат като мобилни лаборатории. За разлика от търговски или развлекателни съдове, RIBs изследванията трябва да осигурят чувствителни електронни инструменти, оборудване за вземане на проби от вода и седименти, а понякога и транспорт на живи образци — всичко това като се поддържа стабилна платформа за точно събиране на данни.
    - '**Стабилността на платформата е критична** — Сонар, ехо сондатори и CTD (проводимост, температура, дълбочина) профилери изискват стабилен корпус в покой и при ниска скорост. Прекомерното движение на вълната или корпуса въвежда шум в научните данни. Дълбоко-V корпус с добри стабилностни характеристики е от съществено значение.'
    - '**Интеграция на инструменти** — Изследователските съдове се нуждаят от монтажни точки за GPS антени, сонарни преобразуватели, ръка за вземане на проби и оборудване за записване на данни. Конзолното пространство трябва да побира множество дисплеи, разпределение на захранването за инструментите и сигурно съхранение на чувствителна електроника.'
    - '**Тиха работа** — За морски биологични проучвания и мониторинг на околната среда, шумът от двигателя и вибрациите на корпуса могат да изплашат морския живот и да компрометират поведенческите наблюдения. Тихите външни конфигурации и дизайните на корпуси с намалена вибрация са важни за изследователски приложения.'
    - Paddle Board Overstock RIBs Изследванията са проектирани със стабилни платформи на корпуса, интегрирани системи за монтаж на оборудване и тихи външни конфигурации за научни и екологични приложения за мониторинг.
content_solution:
  tagline: Нашето решение
  title: Изследователски RIBs, създаден специално за<br />Наука и екологична работа
  subtitle: Paddle Board Overstock RIB Всяко изследване е конфигурирано като стабилна, персонализируема платформа за научни инструменти и оборудване за полево вземане на проби.
  list:
    - Корпус от фибростъкло Deep-V с отлична стабилност в покой и при ниски скорости на проучване
    - Плоска платформа с монтажни плочи за сонар, GPS и оборудване за вземане на проби
    - Конзолата е конфигурирана за множество дисплеи — плотер, сондър, регистратор на данни
    - 12V и 24V допълнително разпределение на захранването за научни инструменти
    - Тих 4-тактов извънбордов двигател — минимални вибрации и шум при проучвания на дивата природа
    - Опционален дизайн на корпуса с ниска вълна за минимални смущения по време на събиране на данни
    - Персонализирани цветове на тръбите за брандиране на изследователски институции и идентификация на автопарка
content_segments:
  tagline: Профили на изследванията
  title: Решения за морски науки<br />По тип на приложението
  subtitle: Различните изследователски приложения имат уникални изисквания към съдовете — от университетски учебни платформи до съдове за екологично проучване и мониторинг на качеството на RIBsводата.
  items:
    - title: Университетски програми по морски науки
      subtitle: Учебни платформи, студентски екскурзии, крайбрежни изследвания
      description: Университетите по морски науки и катедрите по океанография се нуждаят от надеждни, универсални работни лодки за преподаване на полеви курсове, студентски изследователски проекти и крайбрежни проучвания, ръководени от преподаватели. Лодката трябва да бъде лесна за управление на студентите под наблюдение, достатъчно стабилна за практическо внедряване на инструменти и достатъчно издръжлива за честа употреба от множество потребители в различни академични срокове. Бюджетните ограничения в академичната среда правят икономичността и ниската поддръжка важни за съображения.
      features:
        - Стабилна платформа за разполагане и практика на възстановяване на студентски инструменти
        - Лесна експлоатация — конфигурация с тилер или единична конзола за наблюдение на ученици
        - Издръжливи Hypalon тръби за чести кацания на плажа и работа със студенти
        - Монтаж на оборудване за учебен сонар, секки диск и оборудване за семплиране
        - Икономичен PVC вариант за академични програми с ограничен бюджет
    - title: Морски изследователски институти
      subtitle: Проучване RIBs с интеграция на инструменти, GPS и оборудване за вземане на проби
      description: Специализирани морски изследователски организации, провеждащи крайбрежни и офшорни проучвания, се нуждаят от професионално конфигурирано RIBs проучване с интегрирана инструментална система. Тези съдове носят сонарни системи за батиметрично картографиране, CTD профилери за анализ на воден стълб, проби на седименти и биологично оборудване за събиране. Лодката трябва да осигури стабилна платформа при ниски скорости на проучване, да разполага с достатъчно пространство на палубата за разполагане на оборудване и да предлага чисто захранване от 12V/24V за електроника.
      features:
        - Интегрирано монтиране на сонарен трансдюсер — конфигурация през корпуса или транца
        - Монтаж на GPS антена и конзолна интеграция за навигация на ниво проучване
        - Зона за разполагане на CTD и воден проба с сигурни точки за свързване
        - 12V/24V спомагателно разпределение на захранването за инструменти и регистратори на данни
        - Стабилен при ниска скорост (3-6 възела) за точност на линията на проучване
        - Опционална A-рамка или клапан за разполагане на по-тежко оборудване за вземане на проби
    - title: Екологичен мониторинг и опазване
      subtitle: Екологични проучвания, наблюдение на дивата природа, оценка на местообитанията
      description: Екологични НПО, държавни агенции и природозащитни организации провеждат морски екологични проучвания, мониторинг на популациите на дивата природа и оценки на местообитанията. Тези операции изискват тихи, нисковъздействия съдове, които могат да се приближат до чувствителни местообитания, без да нарушават дивата природа. Лодките трябва да носят камери, GPS за картографиране на трансекти и оборудване за събиране на вода и седименти. Ниската вълна и минималният шум от двигателя са критични за поведенчески наблюдателни изследвания.
      features:
        - Тих 4-тактов извънбордов двигател — минимално нарушаване на морската фауна
        - Стабилна наблюдателна платформа за фотография и видео документация
        - Монтаж на оборудване за камери, GPS тракери и полеви компютри
        - Плитко газене за достъп до крайбрежни влажни зони, мангрови гори и устия
        - Лесно почистващи повърхности на палуби и тръби за дезактивация между обекти
    - title: Мониторинг и тестване на качеството на водата
      subtitle: Редовни проби, проследяване на замърсители, мониторинг на съответствието
      description: Организациите за мониторинг на качеството на водата извършват редовни проби през крайбрежни зони, пристанища и вътрешни водни пътища, за да следят нивата на замърсяване, цъфтежа на водорасли и спазването на екологичните регулации. Тези операции изискват ефективни и надеждни лодки за многократни посещения на фиксирани станции за вземане на проби. Съдът трябва да носи оборудване за вземане на проби, охладители за съхранение на проби и полеви тестови уреди — с лесно измиване на палубата между местата за вземане на проби, за да се предотврати кръстосано замърсяване.
      features:
        - Специална зона за вземане на проби с охладител и съхранение на оборудване
        - Лесно почистващи се повърхности на палубата и тръбите за дезинфекция между обекти
        - Интеграция с GPS за точно връщане до фиксираните координати на пробите
        - Компактни размери за достъп до ограничени водни пътища и тесни канали
        - Икономичен извънбордов двигател за рентабилни редовни проби
