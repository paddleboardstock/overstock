content_segments:
  tagline: Профили на партньори
  title: Модели на разпределение чрез партньорство<br />Според типа партньор
  subtitle: Различните дистрибутори предлагат различни силни страни за достигане до пазара — регионална инфраструктура, обхват на електронната търговия, специализирана търговия на дребно или портфолио с множество марки. Ние структурираме условията за партньорство, ценовите нива и нивата на подкрепа, за да съответстват на всеки партньорски профил.
  items:
    - title: Регионални морски дистрибутори
      subtitle: Ексклузивно разпределение на териториятаB2B
      description: Утвърдени дистрибутори с инфраструктура от складове, дилърски мрежи и логистични възможности, обслужващи морски дилъри, търговци на водни спортове и оператори на наеми в определена географска територия. Необходима е пълна продуктова линия, защитени цени и възможност за обслужване на дилърски сметки с местен запас и поддръжка.
      features:
        - Ексклузивна защита на територията с минимални ангажиментни условия
        - Цени на едро за пълен каталог с тримесечни обемни отстъпки
        - Програма за консигнация на местния запас за бързо движещи се артикули
        - Обучение на дилърската мрежа и съвместни маркетингови програми
    - title: E-Commerce & Онлайн търговци
      subtitle: Дигитално-ориентирани дистрибуционни канали
      description: Онлайн търговци, продаващи оборудване за водни спортове чрез Amazon, eBay или собствените си електронни търговски платформи. Бързото достигане до пазара, конкурентните цени и директната доставка до клиентите са критични. Необходим ви е партньор, който може да изпълнява индивидуални поръчки под вашата марка с бързо изпълнение и нулев риск от наличности.
      features:
        - 'Програма за дропшипинг: изпълнение директно от фабриката с вашето брандиране'
        - API фийд с реално време на наличностите за вашата електронна търговска платформа
        - Интеграция с Amazon Seller Central с поддръжка EAN/UPC
        - Включена логистика за връщане и обработка на гаранционни искове
    - title: Специализирани търговци на водни спортове
      subtitle: Партньори със шоуруми на физически места
      description: Физически магазини, специализирани в оборудване за водни спортове — обслужващи местни каякари, рибари и лодкари с продажби на място, демонстрации и следпродажбено обслужване. Необходими са опаковки, оптимизирани за търговията на дребно, програми за демонстрационни единици и материали на точката на продажба, които привличат клиентите, влизащи в магазина.
      features:
        - 'Програма за демонстрационни единици: намалени дъски за показване в шоурум'
        - Опаковки, готови за търговия на дребно с дизайн, оптимизиран за рафтове
        - Поставки на точката на продажба, сравнителни таблици и ръководства за купувачи
        - Програма за обучение и сертификация на персонала
    - title: Дистрибутори на много марки и универсални магазини
      subtitle: Разпространение на спортни стоки с широк профил
      description: Големи дистрибутори, обслужващи универсални магазини, големи търговски вериги и магазини за спортни стоки с каталози с много марки. Последователността, документацията за съответствие и съответствието с изискванията на доставчиците са от първостепенно значение — всеки SKU трябва да отговаря на специфичните за търговеца на дребно стандарти за опаковане, етикетиране и качество.
      features:
        - 'Документация за съответствие с търговеца на дребно: спецификации за опаковка, баркод, етикетиране'
        - EDI/ASN интеграция за основните системи за поръчки на търговци
        - Инвентар, управляван от доставчика и програми за автоматично попълване
        - Посветено управление на акаунти с 24-часово SLA за отговор
