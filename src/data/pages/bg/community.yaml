stories:
  tagline: Истории на изследователи
  title: Истински приключения от истински хора
  subtitle: Чуйте каякари, семейства и професионалисти, които използват екипировка Paddle Board Overstock във водата.
  items:
    - name: Сара и Майк
      title: Собственици на SUP Explorer 11, Канада
      content: Взехме нашите Explorer 11 на едноседмично пътуване през парк Алгонкуин. Те се справиха прекрасно с пренасянията и преминаванията на езера. Конструкцията drop-stitch означаваше, че можем да ги надуем до 15 PSI и да получим твърдост като на твърд борд от сгъваема дъска.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      location: Парк Алгонкуин, Канада
    - name: Карлос Р.
      title: Карач на Cheetah Surge, Испания
      content: Cheetah Surge е моят избор за крайбрежно каране. Яркият дизайн привлича погледи на плажа, а стабилността ми дава увереност при леки вълнички. Справя се прекрасно както при туринг, така и когато просто се наслаждавам на залеза.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      location: Коста Брава, Испания
    - name: Лина и семейство
      title: Карачи на Flowing Lotus, Швеция
      content: Семейни уикенд приключения в архипелага. Flowing Lotus е достатъчно стабилна, за да може дъщеря ми да стои върху нея, докато аз греба. Надува се за по-малко от 10 минути — не е нужен ремарке, просто чисто семейно удоволствие на водата.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      location: Архипелага на Стокхолм, Швеция
    - name: Лт. Командир Андрес
      title: Изследовател Ocean Voyager, Филипините
      content: Използвам моя Ocean Voyager за дълги крайбрежни турове около Палаван. След месеци на ежедневно използване в тропически условия, бордът все още се представя като нов. Туристическата форма прорязва вълнички, които биха спрели по-слабите бордове.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      location: Палаван, Филипини
    - name: Ема Т.
      title: Начинаещ Tropical Breeze, Австралия
      content: Никога не бях била на SUP преди. Tropical Breeze е толкова стабилна, че се почувствах уверена още при първия опит. Сега греба всеки уикенд. Кривата на обучение е почти нулева — и бордът изглежда невероятно на водата.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Австралия
