tldr:
  summary: Paddle Board Overstock следва строг многоетапен производствен процес от инспекция на суровините до рязане, заваряване, декорация на палубата и EVA завършване, сглобяване, тестване на налягане при 1,25x номинално налягане и финален контрол на качеството. 100% от дъските са тествани за налягане, 99,3% без дефекти.
  points:
    - 'Инспекция на суровините: тест за опън, скъсване, UV'
    - Автоматично CNC рязане и високочестотно RF заваряване
    - Ръчно сглобена EVA декорация на палубата с блокове без избледняване
    - Задържане на 1,25x номинално налягане за 24-48 часа на всяко изделие
    - 100-точкова финална инспекция на всяка дъска
