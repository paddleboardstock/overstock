hero:
  tagline: Процес
  title: Производствен процес
  subtitle: От суровини до готови за плаване борд — всяка стъпка под наш контрол
  back_label: Обратно във фабриката
  back_link: /factory
intro: За разлика от марки, които възлагат производството на външни фабрики, Paddle Board Overstock притежават и управляват цялата си производствена верига. Тази вертикална интеграция ни позволява да поддържаме строг контрол на качеството на всеки етап и да доставяме последователно качество на продуктите партида след партида. Ето как се изгражда платка в нашето съоръжение.
steps:
  - step: '01'
    title: Получаване и инспекция на материали
    description: Всяка входяща партида PVC плат, drop-stitch сърцевина, EVA пяна и хардуер се проверява според спецификациите. Пробите от плат се тестват за якост на опън, равномерност на дебелината UV и устойчивост преди пускане в производство. Неконформните материали се поставят под карантина и се връщат.
    duration: 1–2 дни
  - step: '02'
    title: Автоматично PVC рязане
    description: Одобрените тъкани се полагат на автоматичната CNC машина за рязане и се режат с подмилиметрова точност. Компютърно оптимизираното вгнездване подрежда панелите така, че да минимизират отпадъците — обикновено под 5%. Изрязаните панели се етикетират по модел на дъска и камера, след което се пакетират за прехвърляне в заваръчната работилница.
    duration: 2–4 часа на комплект за борд
  - step: '03'
    title: Топло уплътняване и заваряване на тръби
    description: Панелите се залепват и свързват с топлинно запечатващи машини с горещ въздух при контролирани температури от 200–600 °C. Основните шевове са подсилени с RF диелектрично заваряване за херметични, високоякостни фуги. Завършените камери се надуват до работно налягане 1.25× за 30-минутна валидация на задържане на въздуха.
    duration: 1–2 дни на дъска
  - step: '04'
    title: Изкуство на палубата и EVA завършек
    description: 'Тук се оформят тестета от серията арт: прецизно EVA изрязани панели от пяна се полагат в модели с пълна настилка, свързват се и обработват на ръка. Сцепливи, удобни и издръжливи — характерният вид на всяка дъска от арт серията.'
    duration: 1–2 дни
  - step: '05'
    title: Печат и декорация
    description: SUP Графиката на платените плочи се прилага чрез дигитален печат за пълноцветни фотокачествени дизайни, а ситопечат за издръжливи лога и повтарящи се шарки. Отпечатъците се втвърдяват и запечатват за UV устойчивост на износване.
    duration: 1–2 дни
  - step: '06'
    title: Крайно сглобяване и окомплектоване
    description: 'Платките получават своите крайни компоненти: клапаните се затягат и се тестват за функционалност, монтират се D-пръстени, дръжки и кутии за перки, а закрепването на каишката е закрепено. Всяка платка следва 100-точков контролен списък за сглобяване с задължително одобрение на всеки етап.'
    duration: 2–3 дни
  - step: '07'
    title: Тестване и инспекция на качеството
    description: 'Всяка завършена платка преминава задължителен контрол за качество: тест за задържане на въздух в камерата, проверка на функциите на системата, проверка на въртящия момент на крепежния елемент и козметична инспекция. Персонализираните и прототипните изработки също преминават морски изпитания във вода, обхващащи скорост, управление, стабилност и издръжливост.'
    duration: 1–2 дни
  - step: '08'
    title: Опаковане и транспортиране
    description: Дъските се изпускат, навиват и опаковат в пътни раници с помпа, гребло, перка, каишка и комплект за ремонт, след което се опаковат за куриерски и товарен транспорт. Всяка пратка е етикетирана с модел, сериен номер и дестинация. Изпращаме до 50+ държави по света.
    duration: 1 ден
