hero:
  tagline: Процес
  title: Производствен процес
  subtitle: От суров материал до готова за море лодка — всяка стъпка под наш контрол
  back_label: Обратно във фабриката
  back_link: /factory
intro: За разлика от марки, които възлагат производството на външни заводи, Paddle Board Overstock притежава и управлява цялата си производствена верига. Тази вертикална интеграция ни позволява да поддържаме строг контрол на качеството на всеки етап, да реагираме бързо на индивидуални изисквания и да доставяме последователно качество на продуктите партида след партида. Ето как се изгражда лодка в нашето съоръжение.
steps:
  - step: '01'
    title: Получаване и инспекция на материали
    description: Всяка входяща партида PVC плат, фибростъклен мат, смола и хардуер се инспектира според спецификациите. Пробите от плат се тестват за якост на опън, равномерност на дебелината и UV устойчивост преди пускане в производство. Неконформните материали се поставят под карантина и се връщат.
    duration: 1–2 дни
  - step: '02'
    title: Автоматично PVC рязане
    description: Одобрените тъкани се полагат на автоматичната CNC машина за рязане и се режат с субмилиметрова точност. Компютърно оптимизираното гнездене подрежда панели така, че да минимизират отпадъците — обикновено под 5%. Изрязаните панели се етикетират по модел на лодка и камера, след което се пакетират за прехвърляне в заваръчната работилница.
    duration: 2–4 часа на комплект за лодка
  - step: '03'
    title: Топло уплътняване и заваряване на тръби
    description: Панелите се залепват и свързват с топлинно запечатващи машини с горещ въздух при контролирани температури от 200–600 °C. Основните шевове са подсилени с RF диелектрично заваряване за херметични, високоякостни фуги. Завършените камери се надуват до работно налягане 1.25× за 30-минутна валидация на задържане на въздуха.
    duration: 1–2 дни на лодка
  - step: '04'
    title: RIB Фибростъклена корнизна конструкция
    description: RIB Корпусите на лодките се произвеждат чрез ръчно полагане на фибростъклени форми. Слоеве от фибростъклен мат и тъкан ровинг се навиват ръчно с полиестерна или винилестрова смола в прецизни форми. Всеки слой е вакуумно опакован за постоянен ламинат. Корпусът е завършен с гелкоут за високолъскава, UVустойчива морска повърхност.
    duration: 2–4 дни на корпус
  - step: '05'
    title: Печат и декорация
    description: SUP Графиката на платените плочи се прилага чрез дигитален печат за пълноцветни фотокачествени дизайни, а ситопечат за издръжливи лога и повтарящи се шарки. Отпечатъците се втвърдяват и запечатват за UV устойчивост на износване.
    duration: 1–2 дни
  - step: '06'
    title: Крайно сглобяване и окомплектоване
    description: Корпуси и PVC тръбни сглобки от фибростъкло се свързват на поточната линия. Двигателят е монтиран, управлението на управлението и газта са свързани, горивната система е инсталирана и пълният електрически сноп е свързан. Всяка лодка следва 100-точков контролен списък за сглобяване с задължително одобрение на всеки етап.
    duration: 2–3 дни
  - step: '07'
    title: Тестване и инспекция на качеството
    description: 'Всяка завършена лодка преминава задължителен контрол за качество: тест за задържане на въздух в камерата, проверка на функционалността на системите, проверка на въртящия момент на крепежния елемент и козметична инспекция. Персонализираните и прототипните изработки също преминават морски изпитания във вода, обхващащи скорост, управление, стабилност и издръжливост.'
    duration: 1–2 дни
  - step: '08'
    title: Опаковане и транспортиране
    description: Лодките се спускат, сгъват по процедура, опаковат се в здрави тъкани торби или сандъци от шперплат и се товарят за транспортиране. Всяка пратка е етикетирана с модел, сериен номер и дестинация. Координираме се с спедитори за FCL и LCL контейнерни доставки по целия свят.
    duration: 1 ден
