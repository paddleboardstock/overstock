hero:
  tagline: Морска експертиза
  title: Десетилетия морско инженерство<br />във всеки корпус
  subtitle: Paddle Board Overstock комбинира дълбоки познания по материалознание, прецизно производство и тестове в реални условия, за да създаде водни съдове, които се представят, когато е важно.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock екип по морско инженерство и научноизследователска и развойна дейност на работа
expertise_materials:
  tagline: Материалознание
  title: Избор на правилния материал<br />за всяко приложение
  subtitle: Работим с три основни материала — всеки избран за специфични случаи на употреба и изисквания за представяне.
  columns: 3
  items:
    - title: Морско качество PVC
      description: Ткан 1100 дениеPVC — нашият най-многофункционален материал. UV-стабилизиран, устойчив на абразия и REACH съответстващ на стандарти. Идеален за развлекателни лодки, SUP бордове и каяци, където теглото и ефективността на разходите са важни.
      icon: tabler:droplet
    - title: Премиум Hypalon/CSM
      description: Супериорна устойчивост на химикали и UV стабилност. Hypalon лодки могат да издържат 15-20 години при правилна грижа. Препоръчва се за търговски, спасителни и военни приложения, където дългосрочната издръжливост е критична.
      icon: tabler:shield
    - title: Фибростъкло и алуминий
      description: Дълбоки V-фибростъклени корпуси за RIBs и патрулни лодки — отлична работа с вълните при груби условия. Алуминиеви корпуси за тежкотоварни търговски работни лодки, изискващи максимална здравина и товароносимост.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Производствени възможности
  title: Прецизно производство<br />на всяка стъпка
  subtitle: Нашето съоръжение от 12 000 м² е оборудвано със специализирани машини за всеки етап от производството.
  columns: 2
  items:
    - title: CNC Рязане
      description: Компютърно контролираното рязане осигурява прецизни, повторяеми панели от тъкан с минимални отпадъци. Всеки елемент пасва точно както е проектиран.
      icon: tabler:cpu
    - title: Високочестотно заваряване
      description: Индустриалното HF заваряване създава шевове, по-силни от основния материал. Постоянният контрол на температурата и налягането осигурява въздушно-непроницаеми уплътнения при всяка производствена серия.
      icon: tabler:bolt
    - title: Сглобяване с Drop Stitch ядро
      description: Хиляди полиестерни нишки свързват горните и долните слоеве тъкан, позволявайки високонапорна инфлация (15-20 PSI) за твърди, стабилни SUP бордове и подове.
      icon: tabler:building-arch
    - title: Тестване на налягане
      description: Всеки надуваем продукт се тества за налягане преди изпращане. RIB тръбите се тестват на 1,25x номинално налягане — ако издържат, ще се представят на вода.
      icon: tabler:wind
    - title: Тестване на здравината на шевовете
      description: Произволни проби от всяка производствена партида преминават разрушително тестване на здравината на шевовете. Резултатите се записват и са проследими към конкретни производствени серии.
      icon: tabler:files
    - title: Тестване във вода
      description: Всеки RIB модел преминава морски тестове преди сертификация. Тестовете в реални условия в крайбрежни води валидират представяне, управление и стабилност.
      icon: tabler:ripple
expertise_design:
  tagline: Дизайн и инженерство
  title: Проектирани за реални условия
  subtitle: Нашата дизайнерска философия започва с начина, по който ще се използва лодката — след това инженерството се изгражда около този случай на употреба.
  items:
    - title: Дълбоководен V-образен корпус
      description: Нашите фибростъклени корпуси имат изчислени ъгли на V-корма, оптимизирани за дължината на всеки модел и предназначението му. По-остър V за работа в бурни води, по-плитък за стабилност.
    - title: Многоkamerна безопасност
      description: Всяка лодка разполага с 3-7 независими въздушни камери. Ако едно отделение бъде повредено, останалите камери поддържат лодката плаваща и функционираща.
    - title: Ергономично оформление
      description: Позицията на конзолата, височината на тръбата и разположението на седалката са проектирани около комфорта на оператора при продължителна употреба — независимо дали е на патрул, риболов или транспорт.
    - title: Персонализирана конфигурация
      description: Цветове на тръбите, конфигурация на конзолата, капацитет на горивото, монтажи за аксесоари — всеки модел може да бъде персонализиран, за да отговаря на специфични оперативни изисквания.
