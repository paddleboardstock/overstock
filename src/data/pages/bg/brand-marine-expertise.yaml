hero:
  tagline: Морска експертиза
  title: Десетилетия морско инженерство<br />във Всеки Борд
  subtitle: Paddle Board Overstock съчетава задълбочени знания в материалознанието, прецизно производство и реални тестове, за да произведе бордове, които представят, когато е важно.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock екип по морско инженерство и R&D в действие
expertise_materials:
  tagline: Материалознание
  title: Избор на правилния материал<br />за всяко приложение
  subtitle: Работим с три основни материала — всеки избран за специфични случаи на употреба и изисквания за представяне.
  columns: 3
  items:
    - title: Морско качество PVC
      description: 1100 дение PVC плат — нашият най-многофункционален материал. UV стабилизиран, устойчив на триене и изпитан във времето. Идеален за SUP бордове, където теглото, твърдостта и ефективността на разходите имат значение.
      icon: tabler:droplet
    - title: Drop-Stitch ядро
      description: Хиляди полиестерни нишки свързват горния и долния слой плат, позволявайки високо налягане на надуване (15 PSI) за твърдо, стабилно каране, което все пак се навива в раница.
      icon: tabler:building-arch
    - title: EVA Пяна за Палуба
      description: Профилирана, високоплътна EVA пяна предоставя пълно дължинно сцепление, омекотяване при падане и платно за нашите отличителни арт-серии бордове.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Производствени възможности
  title: Прецизно производство<br />на всяка стъпка
  subtitle: Нашето съоръжение от 12 000 м² е оборудвано със специализирани машини за всеки етап от производството.
  columns: 2
  items:
    - title: CNC Рязане
      description: Компютърно контролираното рязане осигурява прецизни, повторяеми панели от тъкан с минимални отпадъци. Всеки елемент пасва точно както е проектиран.
      icon: tabler:cpu
    - title: Високочестотно заваряване
      description: Индустриалното HF заваряване създава шевове, по-силни от основния материал. Постоянният контрол на температурата и налягането осигурява въздушно-непроницаеми уплътнения при всяка производствена серия.
      icon: tabler:bolt
    - title: Сглобяване с Drop Stitch ядро
      description: Хиляди полиестерни нишки свързват горните и долните слоеве тъкан, позволявайки високонапорна инфлация (15-20 PSI) за твърди, стабилни SUP бордове и подове.
      icon: tabler:building-arch
    - title: Тестване на налягане
      description: Всеки борд е тестван под налягане преди изпращане, държан на 1,25x номинално налягане — ако издържа там, ще се представи добре върху вода.
      icon: tabler:wind
    - title: Тестване на здравината на шевовете
      description: Произволни проби от всяка производствена партида преминават разрушително тестване на здравината на шевовете. Резултатите се записват и са проследими към конкретни производствени серии.
      icon: tabler:files
    - title: Тестване във вода
      description: Всяко проектиране на дъска преминава през тестове с истинска вода. Карането в реални условия по крайбрежието потвърждава производителността, управлението и стабилността.
      icon: tabler:ripple
expertise_design:
  tagline: Дизайн и инженерство
  title: Проектирани за реални условия
  subtitle: Нашата философия за проектиране започва с това как ще се използва платката — след това изграждаме инженерната част около този сценарий на употреба.
  items:
    - title: Форма и контур на платката
      description: Дължината, ширината и извивката са настроени за предназначението на всеки модел — по-дълги очертания за туринг за плъзгане, по-широки форми за стабилност и йога.
    - title: Подсилване на релса и шина
      description: Подсилените релси и централните греди добавят твърдост и абсорбират ударите — там, където дъските понасят най-много натоварване сезон след сезон.
    - title: Подредба на палубата и сцепление
      description: Зоната за позиция, поставянето на дръжките, монтажите на D-образни пръстени и зоните за сцепление са проектирани около реални пози на гребане — независимо дали се плава спокойно, риболовства или се практикува йога.
    - title: Серия Изкуство и Цвят
      description: Илюстрации на палубата, цветови схеми и монтажи за аксесоари — всяка серия е проектирана да отговаря на различна личност на гребане.
