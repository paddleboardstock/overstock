stories:
  - title: Как един средиземноморски курорт изгражда печеливш бизнес с наеми SUP
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
    customer: 5-звезден морски курорт — Гърция
    problem: Комплексът се нуждаеше от първокласни водни активности за гости, за да увеличи оценките за удовлетвореност и да създаде нов източник на приходи, но нямаше нужното оборудване, безопасна инфраструктура и експертиза на персонала.
    solution: Aquafarer достави 50 персонализирани SUP дъски с цветовете и логото на курорта, пълна система за безопасност, включително пост за спасител и буйови линии, както и 3-дневна програма за обучение на персонала, обхващаща работа с оборудването, инструкции за гости и протоколи за безопасност.
    result:
      - 300+ седмични активности за гости, резервирани през първия месец
      - 'Оценки за удовлетвореността на гостите от водни дейности: 4.8/5'
      - 'Нов годишен допълнителен приход: 180 000 $'
      - Нулеви инциденти със сигурността през първия работен сезон
      - Разходите за подмяна на оборудване намалели с 40% спрямо предишния доставчик
    quote:
      text: Aquafarer не просто доставяха дъски — те ни помогнаха да създадем пълноценно преживяване за гостите. Програмата ни за водни спортове се превърна от нула в основна атракция на курорта за един сезон.
      author: Главен управител на курорт
    cta_text: Създайте вашето курортно решение
    cta_href: /solutions/resorts
  - title: Как австралийски стартъп създаде водна марка за 90 дни
    badge: Brand Launch
    image: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    customer: Предприемач за първи път — Австралия
    problem: Любител на активния отдих искаше да стартира собствена марка SUP за австралийския пазар, но нямаше опит в производството, нямаше връзки с доставчици и разполагаше с ограничен капитал.
    solution: Пакетът за стартиране на марката на Aquafarer включва консултация за избор на продукти, персонализиран дизайн на лого и цветове, брандирана търговска опаковка с етикети, документация за сертификация CE и доставка FOB до Сидни.
    result:
      - Първата пратка от 200 платки беше доставена за 75 дни след първия контакт
      - Марката стартира в Shopify + Amazon AU в рамките на 2 седмици след пристигането
      - Началният инвентар беше изчерпан за 45 дни
      - 'Средна печалба: 55% върху дребни цени'
      - 'Втора поръчка: 500 единици, направени в рамките на 60 дни след старта'
    quote:
      text: Имах идеята за марката, но никакви познания за производството. Aquafarer буквално ме водеше през целия процес — от избора на правилния дизайн на дъската до разопаковането на първата ми пратка. 90 дни от мечтата до доставката.
      author: Основател, австралийски SUP бранд
    cta_text: Стартирайте вашата марка
    cta_href: /solutions/entrepreneurs
  - title: Как тайски плажен клуб се разшири от 10 до 80 дъски
    badge: Water Sports Club
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    customer: Клуб по водни спортове — Тайланд
    problem: Малък клуб на плажа в Пукет трябваше да се разрасне от хоби начинание до професионален бизнес за наеми, обслужващ туристи, но не можеше да намери надежден доставчик на оборудване с постоянни качество и цени.
    solution: Започвайки с Клубния стартов пакет на Aquafarer (10 дъски, гребла, защитно оборудване, брандиране), клубът се разви чрез програмата за Премиум пакети през 18 месеца.
    result:
      - Разширено от 10 до 80 дъски за 18 месеца с постоянни качество и цени
      - Добавено наемане на каяци и педални лодки чрез същия доставчик
      - Персонализирано брандиране на клуба увеличи разпознаваемостта на марката сред туристите
      - Разходите за поддръжка намалени с 60% спрямо предишния бюджет за оборудване
      - Сега обслужваме 150+ дневни наеми по време на високия сезон
    quote:
      text: Пакетът Club Starter беше перфектната входна точка. С растежа на бизнеса ни, Aquafarer растеше заедно с нас — същото качество, същите цени, без изненади.
      author: Собственик на клуб, Пукет
    cta_text: Започнете вашия клубен пакет
    cta_href: /solutions/clubs
  - title: Как една карибска верига курорти стандартизира водните спортове в 5 обекта
    badge: Resort & Hospitality
    image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
    customer: Верига курорти — Кариби
    problem: Луксозна верига с 5 обекта се нуждаеше от последователно качество на оборудването за водни спортове и брандиране във всички локации, с централизирана покупка и планиране на сезонната подмяна.
    solution: Aquafarer достави многообектен флот от 300 SUPs и 100 каяка с унифицирано брандиране, общ инвентар на резервни части и годишен график за подмяна с обемно ценообразуване.
    result:
      - Стандартизирано преживяване за гостите във всички 5 обекта
      - Намаление на разходите с 30% чрез консолидирани покупки и обемно ценообразуване
      - Централизираният инвентар на резервни части намали престоя на техниката с 80%
      - Годишната програма за обновяване на оборудването премахна бързането в края на сезона
      - Участието на гостите във водните спортове се увеличи с 45% на година
    cta_text: Дизайн на програмата на курорта ви
    cta_href: /solutions/resorts
