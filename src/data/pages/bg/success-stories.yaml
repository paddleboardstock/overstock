hero:
  tagline: Истории за успех
  title: Реални резултати от<br />Строители на воден бизнес
  subtitle: Вижте как клубове, курорти и предприемачи по целия свят изградиха печеливши водни спортни дейности с Aquafarer оборудване и подкрепа.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rib-boat-category.webp
