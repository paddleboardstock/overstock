direct_answer: доставя чисто нови надуваеми Paddle Board Overstock дъски с излишък SUP на южноафрикански бизнеси — магазини и училища в Кейптаун, Дърбан и по Гардън Рут, оператори на наем и онлайн продавачи. Поръчките на едро започват от 5 дъски с комбинирани модели в една пратка, изпратени от Вейхай, Китай чрез експресен въздушен товар или консолидиран морски товар. Всяка дъска е 100% тествана под налягане и покрита от 2-годишната SUP гаранция.
tldr_points:
  - Търговия на едро от 5 дъски — смесени модели, оценени според общото количество
  - Обслужване на най-утвърдения пазар за бордови спортове в Африка
  - Експресен въздушен или консолидиран морски товар от Вейхай, Китай
  - 100% тестван под налягане, 2-годишна SUP гаранция на всяка платка
overview_section:
  tagline: Обзор на пазара
  title: SUP Южноафриканският пазар
  paragraphs:
    - Южна Африка има най-зрелия пазар за борд спортове на континента. Кейптаун съчетава световно известни писти по вятъра и лагуни с дълбока сърфна култура; Дърбан поддържа топли плажове през цялата година; лагуните на Книсна и залива Плетенберг на Гардън Рут са създадени за развлекателно гребане. Добре установена търговска инфраструктура и истинска местна гребна общност — от SUP сърфисти до любители на спокойна вода — отличават този пазар.
    - Buyers here are seasoned: Сърф магазини с истински търговски подове, школи по гребане с автопаркове и оператори на приключения, комбинирани SUP с каяк и колоездачни турове. Те оценяват екипировката като професионалисти — строителство, гаранция и ремонтируемост — и поръчват на малки, целенасочени партиди от 5–20 дъски, смесвайки универсални под наем с премиум издания за стената на магазина.
  customer_types:
    - title: Магазини за сърф и гребане
      description: Установени търговци в Кейптаун и Дърбан добавят или SUP разширяват линиите за местната гребна общност.
    - title: Падъл училища и наеми
      description: Училища и флоти под наем на лагуни и спокойни плажове освежават дъски в истински цикъл на подмяна.
    - title: Приключенски оператори
      description: Операторите на Garden Route и Western Cape SUP добавят към многофункционалните приключенски предложения.
shipping_section:
  title: Кораб за Южна Африка
  paragraphs:
    - Поръчките се изпращат от Уейхай, Китай. Експресният въздушен товар превозва мостри и 1–3 бордови поръчки до Йоханесбург и Кейптаун; Консолидирани морски товари обслужват 5–20 поръчки на едро за бордове през Дърбан, Кейптаун и други пристанища. Оценките за транзит за вашата дестинация са включени във вашата оферта.
    - Ние предоставяме търговските сметки и опаковъчния списък, необходими за одобрение, с коректни HS кодове и декларирани стойности. Вносните мита и ДДС се плащат от вносителя според южноафриканските правила.
  customs_note: Проверката на SARS се базира на документи — потвърдете текущото плащане и ДДС за надуваемо спортно оборудване с вашия агент преди поръчка. Ние предоставяме пълни, последователни документи и отговаряме бързо на заявки от брокери.
faq_section:
  title: Често задавани въпроси за Южна Африка
  items:
    - q: Пасват ли дъските на смесените условия в Кейптаун?
      a: Да. Универсалните модели се справят с плоска вода в лагуната и спокойни крайбрежни дни, а гамата включва туристически бордове за по-дълги гребла. За водене по вятъра в открит океан опитни гребци трябва да обсъдят конкретния си случай на употреба с нас преди да поръчат.
    - q: Как изглежда поръчка от магазин?
      a: 'Обикновено 5–20 дъски: основа от универсални модели за уроци и наеми, плюс премиум арт издания за стената в магазина — смесени модели, една пратка, оценена според общото количество.'
    - q: Как се оферира товар за Южна Африка?
      a: Изпратете въздушно до Йоханесбург или Кейптаун за мостри и малки поръчки; обединен морски транспорт до Дърбан или Кейптаун за количества на едро. И двете са изброени в офертата ви с приблизителни срока на транзит.
    - q: Кой се занимава с вносни мита и ДДС?
      a: Вие го правите, като вносител, чрез вашия митнически представител съгласно правилата на SARS. Ние предоставяме търговската фактура и паковъчния лист с правилните HS кодове и декларираните стойности.
