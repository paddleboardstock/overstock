faq:
  title: Често задавани въпроси за пакетите
  questions:
    - q: Какво е минималното количество за поръчка на пакети?
      a: Стартовият пакет Club има минимум 10 броя. Пакетите Resort и Brand се персонализират според вашите нужди с гъвкави MOQs.
    - q: Колко време отнема доставката?
      a: Стандартното производство е 30–45 дни от потвърждението на поръчката. Експресното производство е налично срещу допълнително заплащане.
    - q: Мога ли да персонализирам цветовете и брандирането на оборудването?
      a: Да. Всички пакети включват пълна персонализация — цветове на дъските, отпечатъци на логото и дизайн на опаковката.
    - q: Предоставяте ли следпродажбена поддръжка?
      a: Да. Всеки пакет включва достъп до нашите онлайн ръководства за поддръжка, видео уроци и система за поръчка на резервни части.
