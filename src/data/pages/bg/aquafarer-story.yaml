hero:
  tagline: Нашата история
  title: Aquafarer — Инженерна свобода на вода
  subtitle: 'От крайбрежна работилница до световен морски производител — нашето пътуване е изградено върху упоритата вяра: водните съдове трябва да се проектират така, както имат значение, защото наистина имат значение.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer завод и морско производствено съоръжение в Циндао
