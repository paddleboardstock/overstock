hero:
  tagline: Оборудване
  title: Производствено оборудване и машини
  subtitle: Индустриално оборудване за рязане, заваряване, печат и сглобяване
  back_label: Обратно във фабриката
  back_link: /factory
categories:
  - title: Рязане и подготовка на материали
    items:
      - name: Автоматична PVC машина за рязане
        spec: CNC-контролирано, 6,5 м × 2,5 м, точност 0,1 мм
        desc: Компютърно управлявана автоматична рязателна машина за PVC и drop-stitch тъкани. Софтуерът за гнездене оптимизира използването на материала до по-малко от 5% отпадък.
      - name: Разстилач на плат
        spec: Максимална ширина 3 м, подаване с контролирано напрежение
        desc: Разстила плат в един или няколко пласта с контролирано напрежение, за да се предотврати деформация преди рязането.
  - title: Заваряване и слепване
    items:
      - name: Машина за топлинно уплътняване
        spec: Горещ въздух, променлива 200–600 °C, 0,5–5 м/мин
        desc: Машина за топло въздушно лепене за свързване и заваряване на PVC ламинирани материали, релсови ленти и шевове на камери. Използва се за закрепване, запечатване и сливане на ставите на drop-stitch ядрото.
      - name: Диелектрическа RF преса
        spec: 15 kW, плоча 2000 × 600 мм
        desc: Радиочестотна заваръчна преса за основни надлъжни шевове, съединения трюм-тръба и изработка на големи камери.
      - name: CNC-Контролирана RF заваръчна машина
        spec: 8 kW, XY маса 2500 × 1200 мм
        desc: Програмирано заваряване на извит шев за сложни геометрии, ембосиране на лого и прецизна пачуърк работа.
  - title: Изкуство и завършване на дек
    items:
      - name: EVA Машина за рязане на тераса
        spec: Рязане с нож CNC, ширина 2 м
        desc: Прецизно рязане на EVA панели от пяна за палубата за дизайни на арт серията на палубата. Всеки панел се изрязва по форма за безшевно цялостно пасване на палубата.
      - name: Преса за ламиниране на палубата
        spec: Контролирана температура и налягане
        desc: Свързва EVA палубни панели с повърхността на дъската с постоянна адхезия по цялата площ на палубата.
  - title: Печат и декорация
    items:
      - name: Дигитален принтер
        spec: Високорезолюционен мастиленоструен печат, до 2 м широчина на печат
        desc: Директен дигитален печат върху плат за полноцветни SUP графики на палубата. Печата персонализирани шаблони, градиенти и изображения с качество на фотография с водоразтворими мастила, устойчиви на UV.
      - name: Машина за ситопечат
        spec: Ръчна и полуавтоматична, многопластова регистрация
        desc: Ситопечат за SUP лога на борда, марки на бранда и повтарящи се шаблони. Осигурява издръжливи, непрозрачни отпечатъци с ярка наситеност на цветовете.
  - title: Крайно сглобяване
    items:
      - name: Станция за въртящ момент на клапани
        spec: Калибриран, функционален тест за 10 цикъла
        desc: Монтира и затяга въздушните клапани, след това тества функционално всеки клапан чрез 10 цикъла отваряне/затваряне.
      - name: Сетър за кутии с перки и D-пръстени
        spec: Подравнен по шаблон, с изсъхнал адхезив
        desc: Поставя и свързва кутии с перки, D-пръстени и дръжки на точно определените места на платната според спецификацията на модела.
  - title: Тестване и контрол на качеството
    items:
      - name: Универсален тестер за опън
        spec: Капацитет 50 kN
        desc: Тестване на пробивна сила, удължение при скъсване и разпространение на разкъсване за партиди плат.
      - name: Стенд за тестване на задържане на въздух
        spec: Програмиран, 30 минути задържане на налягане
        desc: Автоматизиран тест за задържане на налягане за всяка камера на тръбата преди сглобяване.
      - name: Тестер за разлепване на шевове
        spec: Моторизиран 180° разлепване при 100 мм/мин
        desc: Тест за якост на заварени и залепени шевове според вътрешен протокол.
      - name: Камера за устойчива на атмосферни влияния със Xenon-Arc
        spec: 2000 часа излагане
        desc: Тестване на устойчивостта UV за промяна на цвета и запазване на якостта.
