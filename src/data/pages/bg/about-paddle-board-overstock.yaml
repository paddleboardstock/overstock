hero:
  tagline: За
  title: За Paddle Board Overstock
  subtitle: От 2012 г. насам предоставяме чисто нови SUP надуваеми дъски в ръцете на гребци и малки търговци в 50+ държави — излишък от наличности, честни цени и гаранция, която всъщност уважаваме.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock Чисто нови SUP надуваеми дъски
direct_answer: Paddle Board Overstock е марка оборудване за водни спортове, основана през 2012 г. и базирана в Уейхай, Китай. Продаваме чисто нови надуваеми SUP дъски от излишни запаси — смес от излишно производство от нашата собствена производствена база и внимателно подбрани наличности от партньорски фабрики — директно на крайни гребци и на малки търговци в 50+ държави. Всяка дъска е 100% тествана на налягане, подкрепена с 2-годишна SUP гаранция и се доставя експресен или морски транспорт.
tldr_points:
  - Основана през 2012 г., със седалище във Вейхай, Китай — един от ключовите SUP световни производствени центрове
  - 'Модел с излишък на стока: чисто нови платки на цени под тези на дребно, без посредници'
  - 'Инвентарът е смесен източник: излишък от нашата база плюс проверен партньор-фабричен запас'
  - 50+ обслужвани държави, 99,3% процент на успешно преминаване на инспекция, 2-годишна SUP гаранция
story_section:
  tagline: Нашата история
  title: Защо продаваме излишък
  paragraphs:
    - започнат Paddle Board Overstock през 2012 г. в Уейхай, Китай — крайбрежен град в провинция Шандун, който се превърна в един от най-важните центрове за производство на надуваеми конструкции в света SUP . От тази база прекарахме повече от десетилетие в производство на надуваеми гребни дъски и тяхното изпращане по целия свят.
    - Along the way we noticed something that shapes everything we do today: Всеки производствен сезон оставя след себе си чисто нови, перфектно добри платки — излишни серии, отменени поръчки, цветовете от миналия сезон. Междувременно независимите търговци на дребно по света бяха изключени от търговията на едро, защото традиционните доставчици изискваха поръчки с размер на контейнери.
    - Тази празнина е нашият бизнес. Като продаваме излишък от запаси — излишно производство от собствената ни база в Weihai, плюс внимателно подбрани стоки от партньорски фабрики — можем да предложим чисто нови дъски на цени значително под типичните на дребно, в количества, които работят за един гребец или поръчка от пет дъски в магазин. Нищо не е втора ръка, нищо не е второ; просто инвентарът заслужава клиент, а не склад.
model_section:
  tagline: Нашият бизнес модел
  title: Как работи моделът на излишъка
  items:
    - title: Чисто нов, никога не използван
      description: Всяка дъска, която продаваме, е чисто нова и неизползвана. Излишък означава излишък и излишък — не връщания, не реновирани, не втори.
    - title: Смесен инвентар
      description: Нашият запас комбинира излишно производство от собствената ни производствена база във Weihai с инвентар, подбран от партньорски фабрики, които държим, на същия стандарт за качество. Източниците са смесени; стандартите не са.
    - title: Ценообразуване под дребно
      description: Излишните запаси ни струват по-евтино, затова ви струва по-малко да купувате. Няма завишена цена, няма фалшиви отстъпки — просто честна цена на реалния инвентар.
    - title: Търговия на едро, подходяща за малък бизнес
      description: Търговията на едро започва от 5 борда, а не от контейнерни товари. Малките търговци могат да смесват всички налични модели в една поръчка и да изберат експресни или морски товари.
    - title: Директна доставка до вас
      description: Поръчките се изпращат директно от нашата логистична база във Weihai до вашата врата в 50+ държави — експресно за мостри и малки поръчки, консолидиран морски товар за едро.
quality_section:
  tagline: Качество и гаранция
  title: Качеството зад всяка дъска
  subtitle: Ценообразуването на излишък никога не означава облекчени стандарти. Всяка дъска — независимо от източника ѝ — преминава един и същ процес преди да бъде изпратена.
  items:
    - title: 100% тестван под налягане
      description: Всяка една дъска се напомпва и се тества под налягане до 15 PSI преди изпращане. Няма бордови кораби без тестване, независимо откъде идва инвентарът им.
    - title: Претоварването е тествано до 1.25x
      description: Платките от нашите производствени серии се тестват на проби над номиналното налягане — задържат се при работно налягане 1.25x за 24–48 часа за проверка на шевовете, клапаните и drop-stitch конструкцията.
    - title: 99.3% процент на успешно преминаване на инспекция
      description: Нашият окончателен процес на инспекция преминава 99.3% от платките като бездефектни — а малката част, която се поврежда, никога не попада в нашия излишък в запасите.
    - title: 2-годишна SUP гаранция
      description: Всяка SUP платка има 2-годишна SUP гаранция, покриваща производствени дефекти. Същата гаранция важи за всеки клиент във всеки от нашите 50+ пазара.
