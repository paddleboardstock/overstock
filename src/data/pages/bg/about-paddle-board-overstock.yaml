team_section:
  tagline: Отборът
  title: Хората зад бордовете
  description: Нашата база във Weihai е дом на екип от 14+ члена от изследователска и развойна дейност, който обхваща материали, структурен дизайн и производствени процеси. Около тях работи по-широкият екип, който управлява контрола на качеството, инвентара, логистиката и подкрепата, която получавате, когато се свържете с нас — същите хора, независимо дали купувате една платка или двадесет.
