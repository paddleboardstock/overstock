hero:
  tagline: Глобално присъствие
  title: Обслужване на 50+ държави<br />На всеки континент
  subtitle: От оператори на европейски крайбрежни патрули до австралийски доставчици на водни спортове и спасителни екипи от Близкия изток — Paddle Board Overstock лодки са по вода по целия свят.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock глобално морско производство и дистрибуция
stats:
  title: Глобален обхват
  stats:
    - title: Страни
      amount: 50+
    - title: Експортни пазари
      amount: Европа, Америка, Азия, Близкия Изток, Океания
    - title: Производство
