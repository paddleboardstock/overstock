features3_markets:
  tagline: Ключови пазари
  title: Регионален опит<br />за местни изисквания
  subtitle: Разбираме, че различните пазари имат различни регулаторни изисквания, предпочитания и случаи на използване.
  isBeforeContent: false
  columns: 4
  items:
    - title: Европа и Великобритания
      description: Продукти, сертифицирани с CE и отговарящи на стандарт EN ISO 6185. Голямо търсене на RIBs, надуваеми лодки и SUP бордове на пазари в ЕС. Разпространителите в UK ценят бързата ни реакция.
      icon: tabler:map-pin
    - title: Северна Америка
      description: Производство, одобрено от Крайбрежната охрана на САЩ. Склад в Montclair, CA за бърза доставка на Западното крайбрежие. Растящо търсене на риболовни лодки, спасителни плавателни съдове и рекреационни SUPs.
      icon: tabler:map-pin
    - title: Австралия и Океания
      description: Силен пазар за RIB лодки и надуваеми помощни лодки. Австралийските дистрибутори ценят нашите Hypalon лодки за UV устойчивост на интензивно слънце. Бърза доставка от нашето азиатско предприятие.
      icon: tabler:map-pin
    - title: Близкия изток
      description: Растящо търсене на патрулни и спасителни лодки. Нашите лодки с алуминиева палуба RIBs са популярни сред операторите на крайбрежната охрана и охранителни служби. Персонализирани конфигурации за среди с високи температури.
      icon: tabler:map-pin
features3_distribution:
  tagline: Мрежа за дистрибуция
  title: Партньорство с дистрибутори<br />по целия свят
  subtitle: Работим с утвърдени дистрибутори на морско оборудване, OEM марки и правителствени агенции за поръчки.
  isBeforeContent: false
  columns: 3
  items:
    - title: OEM/ODM партньорства
      description: Производство под собствена марка за глобални марки водни спортове. Ние се грижим за всичко — от дизайн до производство и доставка.
      icon: tabler:building
    - title: Дистрибуторска мрежа
      description: Упълномощени дистрибутори в 20+ страни разполагат със складова наличност и предоставят местна поддръжка. Нови заявки за дистрибутори са добре дошли.
      icon: tabler:users
    - title: Правителствени и институционални
      description: Директни доставки до крайбрежни охрани, организации за търсене и спасяване и програми за военни поръчки. Спазване на изискванията за институционални поръчки.
      icon: tabler:building-community
steps2_logistics:
  title: Глобална логистика и поддръжка
  subtitle: От завода до дестинацията — ние управляваме цялата верига на доставки.
  items:
    - title: Опции за доставка
      description: Морски транспорт (FOB Циндао), въздушен транспорт за спешни поръчки и експресна куриерска услуга за проби и резервни части.
      icon: tabler:truck-delivery
    - title: Склад в САЩ
      description: 'Склад в Монтклер, Калифорния, за бърза доставка в цяла Северна Америка. Западно крайбрежие: 2-3 дни, Централно: 3-4 дни, Източно крайбрежие: 4-5 дни.'
      icon: tabler:building-warehouse
    - title: Резервни части
      description: Оригинални резервни части и консумативи Paddle Board Overstock в наличност през цялата година. Обичайните части се изпращат в рамките на 24 часа.
      icon: tabler:package
    - title: Техническа поддръжка
      description: Директна линия към нашия инженеринг екип за технически въпроси, съвети за ремонт и поддръжка на преоборудване. Поддържаме лодки, които сме изработили преди 20 години.
      icon: tabler:headset
cta:
  title: Искате да станете дистрибутор?
  subtitle: Активно разширяваме нашата дистрибуторска мрежа. Свържете се с нашия екип за износ, за да обсъдите възможностите за партньорство.
  actions:
    - variant: primary
      text: Запитване за партньорство
      href: /contact
    - text: Вижте нашия продуктов асортимент
      href: /products
