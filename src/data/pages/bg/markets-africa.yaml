  title: SUP Едрови платки за<br />Африкански търговци и оператори
  subtitle: Крайбрежни туристически оператори и търговци на водни спортове в цяла Африка — чисто нови излишни SUP бордове от 5 единици, смесени модели, експресни или морски товарни превози.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
