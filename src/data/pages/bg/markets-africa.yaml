direct_answer: доставя чисто нови надуваеми Paddle Board Overstock SUP дъски с излишък на бизнеси из цяла Африка — от Южна Африка и Кения до Мароко, Гана, Танзания и Египет. Поръчките на едро започват от 5 дъски с комбинирани модели в една пратка, изпращани от Вейхай, Китай чрез експресен въздушен товар или консолидиран морски транспорт. Всяка платка е 100% тествана под налягане и е покрита с 2-годишната SUP гаранция.
tldr_points:
  - Търговия на едро от 5 дъски — смесени модели, оценени според общото количество
  - Обслужване на крайбрежни туристически пазари от Северна Африка до Кейп
  - Експресен въздушен или консолидиран морски товар от Вейхай, Китай
  - 100% тестван под налягане, 2-годишна SUP гаранция на всяка платка
overview_section:
  tagline: Обзор на пазара
  title: SUP Африканският пазар
  paragraphs:
    - Africa's coastline runs tens of thousands of kilometers through wildly different water worlds — the Atlantic surf towns of Morocco and South Africa, the reef-protected lagoons of Kenya and Tanzania, the Red Sea resorts of Egypt, and the growing beach scenes of West Africa. In each of them, stand-up paddle is finding its audience: туристи, търсещи безопасна първа водна дейност, и местни жители, които изграждат истински гребни общности.
    - Бизнесите, които SUP купуват дъски тук, обикновено са малки и предприемчиви — сърф магазини добавят опция за спокойна вода, плажни курорти изграждат програми за активности, оператори на гмуркане и водни спортове разширяват предлагането си, а сафари и плажни хижи, които добавят гребла при залез. Те поръчват малки флоти и имат нужда от дъски, които работят още първия ден и се задържат през сезон след сезон.
  customer_types:
    - title: Крайбрежни курорти и хижи
      description: Плажни курорти и сафари и плажни хижи SUP добавят сесии за гостите — малки смесени флотилии, лесно сезонно презареждане.
    - title: Водни спортове и оператори на гмуркане
      description: Съществуващите оператори добавят SUP наеми и уроци заедно с гмуркане или хвърчила операции.
    - title: Сърф и плажни магазини
      description: Търговците в африканските утвърдени сърф градове се разширяват в спокойни води и SUP турнета за местни жители и туристи.
shipping_section:
  title: Кораб за Африка
  paragraphs:
    - Поръчките се изпращат от Вейхай, Китай. Експресният въздушен товар превозва проби, 1–3 бордови поръчки и спешни запаси до големите африкански летища; консолидирани морски товари обслужват 5–20 поръчки на едро през основните пристанища на региона. И двата варианта са оферирани с приблизително време за транзит за вашата конкретна дестинация.
    - Ние подготвяме пълна експортна документация — търговска фактура и списък за опаковане — и можем да подкрепим вашия брокер с допълнителни документи, изисквани от процеса на одобрение.
  customs_note: Режимите на внос се различават значително между различните африкански страни, а митата върху спортното оборудване се променят периодично. Потвърдете действащите правила с местната власт или клирингов агент преди поръчка; ние предоставяме цялата стандартна документация.
faq_section:
  title: Често задавани въпроси за Африка
  items:
    - q: Кои африкански пазари обслужвате?
      a: Изпращаме през целия континент, с посветени водачи за Южна Африка и Кения — плюс дестинации от Мароко и Египет до Гана и Танзания. Потвърдете местоположението си в заявката за оферта.
    - q: Може ли малка ложа да поръча само няколко борда?
      a: Да — точно за тях е създаден моделът с излишък на запасите. Пет дъски е минимумът, смесените модели са добре дошли, а малките първи автопаркове са често срещани сред клиентите на курорта.
    - q: Как се държат наемите на солена вода и слънце?
      a: Дъските използват drop-stitch PVC конструкция, която ние доставяме на наемни флоти по целия свят. Изплаквайте след използване в солена вода и съхранявайте на сенчесто място, когато е възможно — стандартни грижи, които поддържат наемните дъски в изправност през много сезони.
    - q: Какви са стъпките за плащане и доставка?
      a: Вие заявявате оферта, ние потвърждаваме наличността и цитираме цената на единица плюс варианти за доставка, вие одобрявате крайното предложение, а ние тестваме, опаковаме и изпращаме с проследяване от врата до врата. Условията за плащане се потвърждават при подаване на оферта.
