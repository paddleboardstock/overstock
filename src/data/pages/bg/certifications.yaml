hero:
  tagline: Сертификации и стандарти
  title: Сертификати за качество<br />и стандарти за съответствие
  subtitle: Paddle Board Overstock Продуктите се произвеждат в съответствие с международните стандарти за морска безопасност, системи за управление на качеството и екологични регулации.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: Paddle Board Overstock сертификати за качество и документация за съответствие
content_certifications:
  tagline: Нашите сертификати
  title: Сертифицирано качество,<br />Глобално признато
  subtitle: 64 CE-сертифицирани модела и фабрични сертификати демонстрират нашия ангажимент към качество, безопасност и екологична отговорност.
  items:
    - title: CE Сертифициран
      description: CE64-сертифицирани модела отговарят на европейските CE изисквания за маркиране на рекреационните водни съдове, гарантирайки спазване на стандартите за безопасност, здраве и опазване на околната среда.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Нашата система за управление на качеството е ISO сертифицирана 9001:2015 и обхваща проектиране, производство и дистрибуция на надуваеми водни съдове и морско оборудване.
      icon: tabler:clipboard-check
    - title: UKCA Маркирано
      description: Продуктите, продавани на британския пазар, носят UKCA маркировка, потвърждавайки спазването на британските регулации за морско оборудване и лични водни съдове.
      icon: tabler:shield
    - title: BSCI Съответствие
      description: се одитира Paddle Board Overstock BSCI (Business Social Compliance Initiative), демонстрирайки етични производствени практики, справедливи условия на труд и отговорност за веригата за доставки.
      icon: tabler:heart-handshake
    - title: REACH Съвместим
      description: Всички материали, използвани в Paddle Board Overstock REACH продуктите, отговарят на регулациите на ЕС за химическа безопасност, гарантирайки, че няма ограничени вещества в PVCнашите Hypalonкомпоненти, или компоненти.
      icon: tabler:flask
    - title: Тестване на материали
      description: Тъканите се тестват за якост на опън, устойчивост на разкъсване, UV деградация и студено напукване. Всяка производствена партида се взема и проверява.
      icon: tabler:test-pipe
content_factory:
  tagline: Фабрични стандарти
  title: Производствено съвършенство<br />— Изградено по спецификация
  subtitle: Нашето съоръжение от 12 000 м² работи според строги протоколи за контрол на качеството на всеки етап от производството.
  list:
    - 'Инспекция на входящи материали: Всички суровини — PVC платHypalon, алуминий, шперплат, лепила — се тестват според спецификациите преди влизане в производството.'
    - 'Контрол на качеството в процеса: Всеки производствен етап има документирани контролни точки за контрол на качеството. Здравината на заваръчката, подравняването на шевовете, монтажа на клапаните и въртящия момент на монтажа се проверяват по редови линии.'
    - 'Тестване на налягане: Всяка надуваема камера се тества под налягане при номинално налягане 1.25× за 24–48 часа. Степента на теч трябва да е в допустими граници според ISO 6185.'
    - 'Финална инспекция: Готовите продукти се инспектират за точност на размерите, козметично покритие, пълнота на аксесоарите и цялост на опаковката преди изпращане.'
    - 'Проследимост на партиди: Всеки продукт носи сериен номер, свързан с производствени партидни записи, което позволява пълна проследимост от суровини до готови продукти.'
content_safety:
  tagline: Стандарти за морска безопасност
  title: Безопасност на първо място<br />— Проектиран за надеждна работа
  subtitle: Paddle Board Overstock Продуктите са проектирани и тествани да отговарят на международните стандарти за морска безопасност за търговска и развлекателна употреба.
  items:
    - title: ISO 6185
      description: Надуваемите лодки отговарят на стандартите ISO 6185 за конструкция, стабилност, плавучест и товароносимост.
      icon: tabler:sailboat
    - title: Стандарти на ABYC
      description: Електрическите системи и горивните системи следват стандартите на ABYC (Американски съвет за лодки и яхти) за безопасен монтаж и експлоатация.
      icon: tabler:bolt
    - title: SOLAS Съответствие
      description: Съоръженията за безопасност и средствата за спасяване отговарят на изискванията на SOLAS (Безопасност на живота на море), където е приложимо.
      icon: tabler:lifebuoy
