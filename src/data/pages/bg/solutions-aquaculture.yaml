content_challenge:
  tagline: Предизвикателството
  title: Изисквания на Аквакултурата<br />Солено-устойчива Техника
  subtitle: Рибните ферми, перлените ферми и океанските ранчота работят в най-химически агресивната морска среда — продължително излагане на солена вода, остатъци от гориво и фураж, както и непрекъсната ежедневна употреба.
  paragraphs:
    - Аквакултурните операции се провеждат 365 дни в годината в открити крайбрежни и офшорни среди. Работните лодки, използвани за инспекция на клетки, транспорт на фураж, поддръжка на перлени линии и обслужване на оборудване, се сблъскват с постоянно потапяне в солена вода, UV излагане и химически контакт с горива, фураж за риба и антизамърсяващи обработки.
    - '**Корозията е основният враг** — Стандартното морско оборудване се разрушава бързо при тези условия. Извънбордовите мотори, рамите на ремаркето и корпусните елементи се нуждаят от постоянна подмяна. Операторите се нуждаят от лодки, построени от материали, устойчиви на корозия, които могат да издържат години наред в тази среда без да се влошат.'
    - '**Дневната надеждност е критична** — Повредена работна лодка означава пропуснати графици за хранене, забавени реколти и скъпи загуби в производството. За перлените ферми един ден пропуснат преглед може да означава значителни щети по реколтата. За рибните ферми забавеното хранене влияе на темповете на растеж и рентабилността.'
    - Aquafarer RIBs Аквакултурата е проектирана с корозионно устойчив хардуер, здрави Hypalon тръби и подсилени корпуси, проектирани специално за изискващите условия на рибовъдство, отглеждане на перли и океански животновъдни операции.
content_solution:
  tagline: Нашето решение
  title: Специално Създадена RIBs<br />За Аквакултурната Индустрия
  subtitle: Всяка Aquafarer работна лодка за аквакултури е проектирана да издържа на агресивни соленоводни среди, като същевременно осигурява надеждна ежедневна работа.
  list:
    - Hypalon Морски тръби — превъзходна устойчивост на UV, солена вода, горива и химикали за рибни храни
    - 316 от неръждаема стомана навсякъде — няма ръжда при продължително излагане на солена вода
    - Подсилени триещи ленти и защита за кила за многократен контакт с дока и клетката
    - Самоизпускаща се тераса за лесно измиване и оттичане след транспортиране на фураж и операции по събиране на реколта
    - Конфигурация на плоска палуба за носене на чували за фураж, контейнери за реколта и оборудване
    - Външни конфигурации от 15 HP до 60 HP — оптимизирани за полезен товар спрямо горивната ефективност
    - Опции за цвят на тръбите с висока видимост за лесно забелязване на големи фермерски площи
content_segments:
  tagline: Профили на аквакултурите
  title: Решения за работни лодки<br />Според типа аквакултура
  subtitle: Различните аквакултурни операции имат различни изисквания за работни лодки — от малки agile RIBs за инспекция на рибни клетки до стабилни транспортни платформи за отглеждане на перли и тежкотоварни работни лодки за океанско животновъдство.
  items:
    - title: Рибовъдни дейности
      subtitle: Инспекция на клетки, транспорт на фураж, поддръжка на реколтата
      description: Морските рибни ферми оперират клетки на открити крайбрежни и крайбрежни места. Работните лодки се използват ежедневно за инспекция на мрежите в клетките, операции по хранене, поддръжка на улова и поддръжка на оборудването. Основното предизвикателство е корозията — лодките са постоянно изложени на солена вода, остатъци от рибен фураж и гориво. Надеждната работна лодка е от съществено значение, защото пропуснатата храна или забавеното събиране на добива пряко влияе на производствената продукция и рентабилността.
      features:
        - 'Пакет за агресивна среда: 316 хардуера от неръждаема стомана, компоненти от морска сплав'
        - Плоска платформа за транспорт на торби за фураж и контейнери за реколта
        - Самонапускаща се палуба за лесно измиване след операции
        - Hypalon тръби с химически устойчиво покритие за излагане на подаване и гориво
        - Подсилени триещи ленти за чест контакт в клетката и пристанището
    - title: Операции по отглеждане на перли
      subtitle: Стабилен транспорт за инспекция и добив на перлени линии
      description: Фермите за перли изискват стабилни, надеждни работни лодки за ежедневен транспорт между перлените линии, инспекция на мрежи за стриди и събиране на реколтата. Тези операции се провеждат в отдалечени крайбрежни райони с ограничена инфраструктура за поддръжка. Лодката трябва да е достатъчно стабилна, за да може екипажът да работи по време на инспекция на перлените линии, с лесно качване на борда и достатъчно пространство на палубата за превоз на събрани стриди, мрежи и консумативи. Надеждността и лесната поддръжка са от решаващо значение в отдалечените ферми.
      features:
        - Дизайн на стабилен корпус за изправен екипаж по време на инспекция на перлени линии
        - Плоска палуба с нехлъзгаща се повърхност за безопасно придвижване на екипажа
        - Нисък борд за лесен достъп до мрежата за стриди и реколтата
        - Проста извънбордова конфигурация за лесно обслужване на място
        - Корозионно устойчив корпус на тръби и хардуер за непрекъснато излагане на солена вода
    - title: Океанско животновъдство и морско развитие
      subtitle: Транспорт на непълнолетни, обслужване на клетки, поддръжка на мониторинг
      description: Океанските животновъдни дейности включват пускане на млади запаси в управлявани морски среди, наблюдение на растежа и обслужване на съоръжения за подобрение. Работните лодки трябва да транспортират живи младежки запаси в аерирани контейнери, да превозват мониторингова апаратура и да имат достъп до плитки крайбрежни места за освобождаване. Дизайнът на корпуса трябва да балансира товароносимостта с плитко газене за достъп до плажа и устието.
      features:
        - Пространство на палубата за аерирани контейнери за транспорт на млади и мониторингови уреди
        - Плитък газ за достъп до плажа и местата за освобождаване на устията
        - Лесно акостиране на брега — подсилена защита на кила и носа
        - Монтажни точки за наблюдение на електроника и оборудване за вземане на проби
        - Здрави Hypalon тръби за издръжливост при смесени пясъчни и морски водни условия
