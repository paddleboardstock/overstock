services:
  - title: Проектиране и инженеринг на продукта
    description: Нашият вътрешен R&D екип работи с вашата концепция или спецификация, за да развие CAD чертежи, 3D модели и прототипи. Предлагаме дизайн на матрици, оптимизация на формата на корпуса и насоки за избор на материали.
  - title: Персонализирано брандиране и графики
    description: Пълноцветен дигитален печат, ситопечат, релефен печат и опции за етикети. Разработваме графики за палубата, брандиране на тръби и готови за продажба опаковки, специфични за марката.
  - title: Персонализиране на материали и спецификации
    description: Изберете от PVC (стандартни, екологично чисти, забавящи горенето), Hypalon/CSM, drop-stitch и хибридни конструкции. Персонализирани цветове на тръбите, тежест на тъканите и опции за усилване.
  - title: Опаковане и логистика
    description: Персонализирано търговско опаковане, кутии под частна марка, вакуумно опаковане, подреждане на палети и зареждане на контейнери. FOB Qingdao, CIF или DDP налични условия за доставка.
