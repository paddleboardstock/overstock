why_us:
  - title: Вертикална интеграция
    description: Притежаваме собствена фабрика, калъпи и вериги за доставки — без посредници, без подизпълнители. Това ни дава контрол върху качеството, разходите и доставките.
  - title: Двоен сертификат
    description: ISO Сертификат за управление на качеството ISO 9001 и BSCI сертификат за социално съответствие. Доклади от одити на фабриката са налични при поискване.
  - title: CE Съответствие
    description: Всички стандартни модели притежават CE сертификат съгласно 2013/53/EU. Персонализираните модели могат да бъдат CE сертифицирани чрез нашия утвърден процес.
  - title: Нисък MOQ
    description: Започнете с едва 5 единици за стандартните модели. Ние помагаме на нови марки да стартират без да задължават прекомерно инвентара.
