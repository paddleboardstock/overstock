hero:
  tagline: OEM/ODM Производство
  title: OEM и Производство под Частна Марка
  subtitle: От концепция до контейнер — персонализирайте всеки детайл от вашата линия на надуваеми водни съдове
intro: Paddle Board Overstock предлага цялостни OEM и ODM услуги за марки, дистрибутори и държавни агенции по целия свят. С 10+ години износен опит и фабрика от 12 000 м² ISO, сертифицирана по 9001 и BSCI, ние се занимаваме с всичко - от проектиране на продукта и разработка на матрици до производство в пълен мащаб, опаковане и логистика.
