        - T-топ или твърд покрив с вградена звукова система
        - Широка стълба за гмуркане с парапети за лесно качване в курортно облекло
        - Хладилен хладилник за съхранение на премиум напитки и кърпи
        - EVA Текова настилка за луксозен външен вид и защита от хлъзгане
