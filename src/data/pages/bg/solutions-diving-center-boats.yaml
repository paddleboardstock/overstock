content_challenge:
  tagline: Предизвикателството
  title: Защо Водолазните Центрове Имат Нужда от<br />Лодки, Създадени за Целта
  subtitle: Гмуркателните операции поставят уникални изисквания към водните съдове — изисквания, които универсалните лодки често не успяват да изпълнят.
  paragraphs:
    - Търговските гмуркачки центрове работят 200-300 дни в годината, като извършват 3-5 гмуркания дневно. Всяко пътуване изисква превоз на 10-20 водолазни резервоара, пълно оборудване за BCD, регулатори, плавници, маски, предпазни средства, инструкторско оборудване и пътници. Универсална лодка просто не може да понесе тази оперативна интензивност.
    - '**Ограничено пространство на палубата** — Повечето развлекателни лодки са проектирани за скорост и комфорт на пътниците, а не за управление на оборудването. Когато резервоарите, оборудването и водолазите споделят едно и също пространство, времето за подготовка се увеличава, движението става трудно и рисковете за безопасността растат.'
    - '**Трудно качване на гмуркачите** — Международни туристи, гмуркачи за първи път и по-възрастни пътешественици се нуждаят от безопасно и лесно влизане и излизане. Висока позиция за качване, ограничена опора на ръцете и нестабилни платформи създават дискомфорт и опасности за безопасността — особено когато водолазите носят 30 кг оборудване.'
    - '**Корозия и повреди от солена UV вода** — Тропическите среди ускоряват деградацията на материала. Стандартните PVC тръби могат да избледнеят, да течат и да изискват подмяна в рамките на 3 години. Корозията на метални компоненти увеличава разходите за поддръжка и оперативните периоди на престой.'
    - '**Стабилност в покой** — Водолазите се нуждаят от стабилна платформа при изкачване, влизане във водата и връщане на борда. Недостатъчната стабилност създава рискове за безопасността и негативно влияе на клиентското изживяване.'
    - '**Високи оперативни разходи** — Горивната ефективност е важна при извършване на няколко курса всеки ден. Лодка, която консумира повече гориво, директно намалява печалбите си. Търговските оператори на гмуркане се интересуват повече от ежедневните оперативни разходи, отколкото от максималната скорост.'
content_solution:
  tagline: Нашето решение
  title: Проектирани около Реалността<br />Операции по гмуркане
  subtitle: Всяко Paddle Board Overstock RIB гмуркане е конфигурирано според специфичните нужди на търговските гмуркачески центрове — не е адаптирано от дизайн на рекреационни лодки.
  list:
    - Голяма работна палуба — проектирана за съхранение на водолази, подготовка на оборудване и движение на водолази, не само за пътнически места
    - Професионална система за водолазни стълби с неръждаеми парапети — широка, нискостъпаловидна борда за безопасно и лесно влизане и излизане на водолазите
    - Екстра широки Hypalon или PVC тръби — осигуряват стабилна платформа за качване и подобряват плавателността, когато водолазите се движат по палубата
    - Интегрирани рафтове за съхранение на резервоари — поддържат ниско тегло, палубата е чиста, а оборудването е организирано за по-бързо пътуване
    - EVA Нехлъзгаща се повърхност на палубата — намалява риска от подхлъзване, когато палубата е мокра и водолазите се движат с тежко оборудване
    - Конзолата е позиционирана за ясна видимост на водолазите във водата — критично за наблюдение на безопасността на инструкторите
    - Опции за двигатели от 40 HP до 115 HP — единична или двойна конфигурация, оптимизирана за икономия на гориво при няколко ежедневни пътувания
    - Морска конструкция — здрави тръбни материали с UV устойчивост на солена вода, подсилена конструкция за ежедневна търговска употреба
    - Персонализирани конфигурации на стълби и платформи за гмуркане — съобразени с работната ви дълбочина на водата и профила на гмуркача
    - Монтажни плочи за оборудване за сонар, GPS и комуникационно оборудване
