    - title: Бутикови еко-гмуркачески курорти
      subtitle: Крайбрежни имоти, еко-хижи, фокусирани върху устойчивостта
      description: По-малки имоти в отдалечени крайбрежни райони, които акцентират върху екологичната отговорност и автентичните преживявания. Тези курорти се нуждаят от надеждни, нископоддържащи лодки, които могат да работят независимо с ограничена техническа подкрепа. Икономията на гориво и издръжливостта имат по-голямо значение от максималната скорост. Лодката трябва да отразява природната среда.
      features:
        - Икономични конфигурации на 4-тактови извънбордови двигатели
        - Hypalon Тежкотоварни тръби за дълъг експлоатационен живот на отдалечени места
        - Слънчево съвместима електрическа система за зареждане извън мрежата
        - Компактно оформление на тераса за 8-10 гости с минимален екологичен отпечатък
        - Лесен дизайн за поддръжка — достъпни компоненти за локално обслужване
        - Неутрални цветове, които се сливат с естествената среда
        - Лека конструкция за плажиране и плитки води
    - title: Премиум оператори на LiveAtboard
      subtitle: Многодневни сафарии с гмуркане, експедиционно гмуркане, отдалечени атоли
      description: 'Операторите на борда на борда се нуждаят от тендерни лодки, които изпълняват няколко функции: транспорт на водолази до рифове, превоз на оборудване, аварийна поддръжка и екскурзии на гости. RIB Те трябва да са достатъчно компактни, за да се съхраняват на палубата или да се теглят, но и достатъчно способни за прекосяване на открити води при различни условия. Ежедневното пускане и възстановяване изискват здрава конструкция.'
      features:
        - Компактен дизайн (4.5-5.5 м) за съхранение на палубата или теглене зад жив борд
        - Подсилен корпус за чести плажни десанти и навигация по рифове
        - Опции за бързо надуване/спускане на тръбите за ефективност на съхранение
        - Стълба за гмуркачи с нисък профил за лесно качване от вода
        - Здрави точки за повдигане за системи за пускане с лебедка или кран
        - Пробег на горивото за 50+ морски мили между презареждането
        - Издръжливи материали на тръбите, устойчиви на слънце, сол и горива
    - title: VIP Частни Чартерни Операции
      subtitle: Ултра-луксозни частни острови, известни гости, корпоративни чартъри
      description: Най-високото ниво на хотелско обслужване, където всеки детайл е персонализиран и очакванията са изключително високи. Лодката трябва да бъде безупречна, почти безшумна и обслужвана с безупречно обслужване. Поверителността, комфортът и естетическото съвършенство са от първостепенно значение. Тези клиенти не са чувствителни към цената, но са изключително взискателни към качеството.
      features:
        - Ултра-премиум седалки с персонализирани шевове и опции за отопление
        - Звукопоглъщащо двигателно отделение за почти тихо плаване
        - Възможност за пълно затваряне за поверителност и защита от време
        - Интегрирана развлекателна система с морско-устойчиви говорители
        - Персонализиран бар или станция за освежителни напитки
        - Пространство за баня/смяна за поверителност
        - Посветена станция за екипажа с комуникации и навигация
        - Съвпадащ комплект надуваема лодка — координирана майка-лодка и поддържаща лодка
content_benefits:
  tagline: Основни Предимства
  title: Защо Paddle Board Overstock за<br />Операции по гмуркане
  subtitle: Специално проектиран гмуркачески RIBs, доверен от търговски гмуркачески центрове в 30 + държави — изграден за ежедневна експлоатация, а не за случайна употреба.
  list:
    - Проектиран за 200-300 работни дни годишно — не лодка за уикенд, а ежедневна работна платформа
    - Hypalon или военен клас PVC тръби — максимална издръжливост в тропически солени води с UV устойчивост
    - Широката конструкция на тръбите осигурява стабилна платформа за качване за оборудвани гмуркачи — по-безопасно влизане и излизане за всички нива на опит
    - Разпределението на палубата е оптимизирано за работен поток на оборудването — бутилки, екипировка и пътници имат отделено пространство
    - Персонализирани конфигурации на стълба и платформа за гмуркачи — няма стандартно решение, всяка лодка е съобразена с вашата операция
    - Опции за резервиране на двигателите (единичен/двойка) — оперативна безопасност когато гмуркачите са във водата
    - По-ниски ежедневни разходи за експлоатация — оптимизирана горивна ефективност и намалени изисквания за поддръжка
    - 'Бърза доставка: 30-60 дни от поръчката до изпращане за стандартни конфигурации'
