        hypalon: Отличен (присъщ)
      - property: Устойчивост на абразия
        pvc: добре
        hypalon: Много добър
      - property: Якост на опън
        pvc: 3,000–5,000 N/5 см
        hypalon: 2,500–4,000 N/5 см
      - property: Тегло на м²
        pvc: 850–1,200 g
        hypalon: 1,100–1,500 g
      - property: Студена гъвкавост
        pvc: -30°C
        hypalon: -20°C
      - property: Начин на съединяване
        pvc: RF заваряване / Горещовъздушно заваряване
        hypalon: Ръчно лепене (контактен цимент)
      - property: Ремонтопригодност
        pvc: Лесно (термозаваряване или лепило)
        hypalon: Изисква CSM лепило
