        pvc: Широк (пълен цветови спектър)
        hypalon: Ограничен (основни цветове)
      - property: Химическа устойчивост
        pvc: Добро (степени устойчиви на гориво/масло)
        hypalon: Отлично (широк химически диапазон)
section_testing:
  title: Протоколи за тестване и безопасност
  subtitle: Кадрова рамка за осигуряване на качеството на Aquafarer за всяка производствена партида
  protocols:
    - title: Тест на задържане на 1,25x номинално налягане
      description: Всеки сглобен съд се надува до 1,25 пъти номиналното работно налягане и се задържа за 24–48 часа. Всеки спад на налягането над 2% води до отхвърляне и повторна работа.
      standard: ISO 6185
    - title: Тест за сцепление на шева при обелване
      description: Образци на заварени и залепени шевове от всяка производствена партида се тестват за сила на обелване с калибрирано опъново оборудване. Минимална устойчивост на обелване 4 kN/m.
      standard: ISO 2411
    - title: Тест за опън на тъканта
      description: Входящите ролки плат се подлагат на тест за якост на опън и удължение както по основата, така и по пъпката. Порог за отхвърляне под 3000 N/5cm за PVC.
      standard: ISO 1421
    - title: UV Ускорено състаряване
      description: Образци на материалите се подлагат на 1,000+ часа ускорено UV експониране в QUV тестови камери. Максимална загуба на якост на опън 15%.
      standard: ASTM G154
    - title: Цялосност на клапани и фитинги
      description: Всяка клапанова агрегатура се тества за цялост на уплътнението при 1,25 пъти номинално налягане. Клапаните с обратно преграждане се тестват за еднопосочно уплътнение.
      standard: ISO 12402
section_manufacturing:
  title: Стандарти за производство и сертификати за качество
  subtitle: Съответствие със стандартите на индустрията за достъп до глобалния пазар
  standards:
    - name: ISO 9001:2015
      body: SGS Сертифицирано
      scope: Система за управление на качеството при проектиране, производство и доставка
    - name: CE 2013/53/ЕС
      body: Известен орган на ЕС
      scope: Директива за развлекателни плавателни съдове — дизайн на корпус, стабилност, плаваемост, емисии
    - name: BSCI
      body: Амфори
      scope: Социално съответствие — безопасност на работниците, справедлива трудова практика, управление на околната среда
    - name: ISO 6185
      body: Международен стандарт
      scope: Плуващи лодки — конструкция, стабилност, плаваемост, тестове за налягане
    - name: REACH
      body: Регламент на ЕС
      scope: Химическа безопасност — ограничени вещества в материали и покрития
section_faq:
  title: Технически често задавани въпроси
  questions:
    - q: Как drop-stitch се сравнява с традиционната твърда конструкция?
      a: Модерните ядра drop-stitch при 20 PSI достигат 85–90% от твърдостта на сравними твърди корпуси от EPS пяна/стъклопласт, като същевременно могат напълно да се дефлират за транспорт. Компромисът е леко по-високо тегло и по-ниска крайна твърдост — но за повечето развлекателни и търговски приложения разликата е незначителна.
    - q: Каква плътност на нишките се счита за премиум качество?
      a: Премиум тъкани drop-stitch използват 2 нишки на квадратен инч (приблизително 3 100 нишки на м²), изтъкани от 1 680 DTEX полиестерни конци. Входните нива тъкани използват 1 нишка на кв. инч с 1 100 DTEX конци.
    - q: Може ли Hypalon да се заварява като PVC?
      a: Не. Hypalon/CSM не могат да се заваряват с RF. Те трябва да се сглобяват с ръчно нанасяно контактно лепило, което прави производството по-трудоемко и шевовете зависещи от уменията на оператора. PVC може да се заварява с RF или с горещ въздух за постоянна, автоматизирана качество на шева.
    - q: Какво е максималното безопасно налягане за надуваеми лодки?
      a: Стандартните тръби за надуваеми лодки работят при 8–12 PSI. Подовете Drop-stitch работят при 12–20 PSI. Високонапорните ядра drop-stitch (SUPs) могат да работят при 20–25 PSI. Всеки продукт включва клапани за разтоварване на налягането, калибрирани да предотвратят презапълване.
    - q: Колко време отнема производството на персонализирана надуваема лодка?
      a: Стандартното производство OEM отнема 30–45 дни от потвърждение на поръчката до FOB Циндао. Разработването на персонализирана форма добавя 15–20 дни за производство на прототип и тестване.
