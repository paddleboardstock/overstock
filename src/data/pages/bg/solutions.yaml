features3_solutions:
  tagline: Решения
  title: Вашето Водно Приключение<br />Бизнес Партньор
  isBeforeContent: false
  columns: 3
  items:
    - title: Клубове по водни спортове
      description: Комплектни пакети оборудване, персонализирано брандиране и програми за поддръжка за SUP клубове, каяк клубове, училища по сърф и тренировъчни центрове.
      icon: tabler:users
      link: /solutions/clubs
    - title: Водни спортове RIBs
      description: Оборудване, създадено специално заRIBs училища по ветроходство, центрове за водни спортове и организации на събития. Треньорски лодки, влекачи и офицерски плавателни съдове за професионални водни спортове.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Курорти и хотели
      description: Премиум програми за водни спортове с флота от оборудване, системи за безопасност, обучение на персонала и управление на приходи за хотелиерски обекти.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Предприемачи с водни брандове
      description: Производство под собствена марка OEM/ODM с ниски MOQs, персонализиран дизайн на продукта, опаковка и глобална доставка за нови собственици на бранд.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Лодки за дайвинг центрове
      description: Стабилни RIB платформи с лесен вход/изход, съхранение на оборудване и двигателни конфигурации, оптимизирани за дайвинг операции.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Спасителни и аварийни водни съдове
      description: Високоскоростни RIBs и надуваеми лодки, проектирани за търсене и спасяване, аварийни реакции и операции на бреговата охрана.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Решения за яхтени тендери
      description: Компактни, стилни RIB тендери, които допълват суперяхти и развлекателни плавателни съдове. Лесно съхранение, мощни показатели.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Решения за риболовни лодки
      description: Стабилни, издръжливи надуваеми лодки и RIBs, конфигурирани за търговски и любителски риболов.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Оборудване за морски туризъм
      description: Надуваеми лодки, готови за флот, SUP дъски и каяци за курорти, туроператори и бизнеси за наем на водни спортове.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Енергетика в открито море RIBs
      description: Тежкотоварни RIBs за поддръжка на нефтени и газови платформи, трансфер на екипажи до вятърни паркове, инспекция на подводни кабели и морска конструкция.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Рибовъдни работни лодки
      description: Устойчиви на корозия RIBs за рибовъдство, отглеждане на перли и океанско развъждане. Hypalon тръби, хардуер от неръждаема стомана, издръжливост за ежедневна употреба.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Морски изследвания и проучвания
      description: Стабилни готови за инструменти RIBs за океанографски изследвания, мониторинг на околната среда, вземане на проби за качество на водата и университетски учебни програми.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Търговски работни лодки
      description: Тежкотоварни RIBs за патрулиране, проучване, транспорт и офшорна логистика. Проектирани за строгите изисквания на търговските операции.
      icon: tabler:ship
      link: /commercial-workboats
