hero:
  tagline: Защо Aquafarer
  title: Изграден различно. Изграден за бизнеса.<br />Партньорът зад водните приключения по целия свят
  subtitle: Не просто производител — бизнес партньор, който проектира, инженерира и доставя оборудване с търговска степен за клубове, курорти, оператори на наеми и нововъзникващи водни марки.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer производство качество и експертиза
pillars:
  tagline: Три стълба на партньорството
  title: Защо световните водни бизнеси избират Aquafarer
  subtitle: ''
  columns: 3
  items:
    - title: Проектиран за търговска употреба
      description: Нашето оборудване е инженерно разработено за ежедневен наем, а не за уикенд развлечения. Оборудване с търговска степен PVC, подсилени drop-stitch ядра, UV-стабилни Hypalon опции и тестван на полето хардуер означава по-ниска поддръжка, по-дълъг живот и по-висока ROI за вашата дейност.
      icon: tabler:building-factory
      callToAction:
        text: Вижте търговската продуктова линия
        href: /products
    - title: От идея до пазар
      description: 'Стартирайте водния си спортен бранд за 90 дни. Ние ви водим през всяка стъпка: валидиране на концепцията, избор на продукт, прототип, производство, дизайн на опаковката и световна доставка. Без налягане за минимална поръчка — започнете малко, разширявайте с увереност.'
      icon: tabler:rocket
      callToAction:
        text: Започнете пътешествието на своя бранд
        href: /oem-odm-blueprint
    - title: Създаден за глобални условия
      description: 'Продукти оптимизирани за всеки климат: формулировки за студена вода PVC за Европа, материали устойчиви на UV за Близкия изток и Австралия, обработки против влага за Югоизточна Азия. Всяка пратка е калибрирана за своята дестинационна среда.'
      icon: tabler:world
