reasons:
  tagline: Разликата на Aquafarer
  title: Какво ни отличава
  isBeforeContent: false
  columns: 3
  items:
    - title: Реално производство, не търговия
      description: Притежаваме и управляваме фабрика от 12 000 m². Когато си партнирате Aquafarerс , вие работите директно с хората, които проектират, инженерстват и изграждат вашите продукти — без посредници.
      icon: tabler:building-factory
    - title: Подход воден от инженеринг
      description: Нашият процес на проектиране започва с конкретното използване, а не с категорията продукт. Оптимизираме формата на корпуса, избора на материали и конфигурацията за начина, по който оборудването ще се използва на практика в търговски среди.
      icon: tabler:engine
    - title: Сертифицирано качество
      description: CE сертифицирано, ISO система за качество, съвместимо с BSCI, съвместимо с REACH, одобрени спасителни жилетки Тип III/V USCG; всички продукти отговарят на приложимите международни стандарти.
      icon: tabler:certificate
    - title: Гъвкаво OEM/ODM
      description: Цветовете на тръбите, разположението на конзолата, брандирането, опаковката — персонализираме според вашите спецификации. Няма минимален натиск за поръчка. Започнете с прототип, мащабирайте с увереност.
      icon: tabler:adjustments
    - title: Глобална логистика
      description: Склад в САЩ, Калифорния, директна доставка от Циндао, въздушен транспорт за спешни поръчки. Ние обработваме митнически документи и документация по целия свят.
      icon: tabler:truck-delivery
    - title: Поддръжка за цял живот
      description: Ние поддържаме лодки, които сме произвели преди 20 години. Оригинални резервни части, технически съвети, насоки за ремонт — нашият екип е на ваше разположение, когато имате нужда от нас, където и да се намирате.
      icon: tabler:lifebuoy
testimonials:
  tagline: Доверено от брандове по целия свят
  title: Какво казват нашите партньори
  items:
    - content: Работили сме с няколко производителя в Китай, но Aquafarer се отличават с инженерната си подкрепа и постоянното качество. Те третират нашата марка като своя.
      name: — OEM Партньор, Европейска марка за водни спортове
    - content: Те Hypalon RIBs са в експлоатация с нашия автопарк повече от 5 години. Минимална поддръжка, UV отлична устойчивост. 5-годишната гаранция на тръбите ни дава увереност.
      name: — Оператор на флота, Middle East Resort Group
    - content: Екипът Aquafarer ни помогна да разработим персонализиран дизайн на платка SUP от концепция до производство за 90 дни. Качеството надмина очакванията ни.
      name: — Дистрибутор, Australian Watersports
    - content: Като собственик на малък бизнес, бях загрижен за MOQs. Aquafarer работи с моя бюджет и ми помогна да стартирам марката си с само 50 дъски. Сега поръчвам 500.
      name: — Основател на марката, САЩ SUP компания за наем
