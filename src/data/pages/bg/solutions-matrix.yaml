hero:
  tagline: Матрица на индустриалните решения
  title: Сценарийно базирани морски решения<br />За професионални операции
  subtitle: Специално проектирани надуваеми водни съдове, RIBs конфигурирани за спасителни услуги, наемане на флот, яхтени тендери и търговски риболовни приложения — всяко подкрепено от технически спецификации и възможности за персонализация.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock професионални морски решения за разнообразни индустрии
direct_answer: 'Paddle Board Overstock Предоставя надуваеми водни съдове и решения за RIB търговски морски операции: спасителни и патрулни лодки с Hypalon подсилени тръби и многокамерна безопасност, флот под наем SUPs и каяци с 1.2 PVC мм и заварени с горещ въздух шевове за издръжливост при ниска поддръжка, луксозни яхтени тендери с дълбоко-V алуминиев RIBsкорпус и тежки риболовни конфигурации с държачи за въдици и системи за живи отвори.'
solution_a:
  tagline: Решение А
  title: Морско спасяване &<br />Търговски патрул
  subtitle: Високоскоростна, многокамерна безопасност RIBs за професионално реагиране при спешни ситуации и правоприлагане.
  badge: Heavy-Duty Series
  description: Нашето морско спасяване и RIBs патрулиране са изградени с подсилени Hypalonвисокоплътни /PVC въздушни тръби с многокамерна независима плавателна конструкция. Всеки кораб е оборудван с професионална отразяваща лента, спасителни въжета и бързо надуваеми клапани за готовност при разгръщане. Корпусите от фибростъкло с дълбоки V осигуряват изключителна стабилност при високи скорости и при бурни морски условия.
  features:
    - title: Многоkamerна безопасност
      description: 4–6 независими въздушни камери — всяка единична прободна камера поддържа положителна флотация
    - title: Подсилена тръбна тъкан
      description: 1,2 Hypalon CSM мм или 1 680 DTEX PVC с двуслойни фузове, заварени с горещ въздух
    - title: Професионална класа
      description: SOLAS Отразяваща лента, спасителни линии за хващане, теглещи бутове, бързо освобождаваща се въже за боядисване
    - title: Високоскоростен корпус
      description: Корпус от дълбоки V фибростъкло или алуминий с капацитет за 25–45 възела в зависимост от конфигурацията
  recommended_models:
    - RIB Патрул 450
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Материал на корпуса
      value: Фибростъкло / морски алуминий
    - label: Тръбна тъкан
      value: 1,2 мм Hypalon CSM / 1 680 DTEX PVC
    - label: Максимална скорост
      value: 25–45 възела
    - label: Капацитет
      value: 6–12 души
    - label: Диапазон на двигателите
      value: 40–200 HP
    - label: Сертификация
      value: CE / ISO 9001
solution_b:
  tagline: Решение Б
  title: Наем на водни спортове &<br />Екипировка за курортен флот
  subtitle: Изключително издръжливи, с ниска поддръжка надуваеми SUPs, каяци и лодки, предназначени за ежедневен наем в курорти, клубове и туристически операции.
  badge: Rental-Grade
  description: Нашата екипировка за наем е проектирана с най-висока издръжливост и най-ниски разходи за поддръжка. Използваме 1,2 мм подсилен PVC с технология за тройно заваряване на шевове с горещ въздух, която устоява на UV деградация и чести удари. Drop-stitch конструкцията осигурява твърдост на бордовете дори след стотици цикли на наем. Всички модели разполагат с подсилени D-пръстени, устойчиви на износване релсови ленти и клапани от търговски клас.
  features:
    - title: Търговски клас PVC
      description: 1,2 мм подсилен PVC с UV стабилизатори — 3x по-дебел от материалите за потребителски клас
    - title: Шевове, заварени с горещ въздух
      description: Тройно заваряване — по-здраво от лепилото, устоява на разделяне
    - title: Drop-Stitch Твърдост
      description: 1,680 DTEX ядро с 2 нишки/кв. инч — оценен за 20 PSI за твърдост като на твърда дъска
    - title: Дизайн готов за флот
      description: Подсилени D-пръстени, търговски клапани Halkey-Roberts, устойчиви на износване релсови ленти
  recommended_models:
    - SUP Порив на гепарда
    - SUP Океански пътешественик
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Материал на тръбата
      value: 1,0–1,2 мм Подсилен PVC
    - label: Технология на шева
      value: Тройно заваряване с горещ въздух
    - label: Максимално налягане
      value: 15–20 PSI (drop-stitch модели)
    - label: UV устойчивост
      value: 1,000+ часа ускорено тестване
    - label: Гаранция
      value: 2–5 години в зависимост от модела
    - label: Поддръжка
      value: Минимално — изплакване и съхранение
solution_c:
  tagline: Решение C
  title: Яхтени твендъри &<br />Луксозни водни съдове
  subtitle: Леки, RIB високопроизводителни тендери, проектирани за съхранение на суперяхти и транспорт на гости с луксозно монтиране и покритие.
  badge: Premium Series
  description: Нашият яхтен тендер RIBs съчетава лека конструкция с луксозен външен вид. Корпуси от алуминий или фибростъкло Deep-V осигуряват изключително качество на возене и лесно повдигане на капа. Налични са с цветно съответстваща графика на тръбите, премиум тапицерия и персонализирани конзолни конфигурации. Компактните размери за съхранение ги правят идеални за гаражи и съхранение на палуби на суперяхти.
  features:
    - title: Лека конструкция
      description: Морските алуминиеви корпуси намаляват теглото с 30% в сравнение с фибростъкло за лесно повдигане
    - title: Deep-V производителност
      description: 18–22 градуса дедрайз корпус за плавно возене при CHOP и отлично проследяване
    - title: Луксозно прилягане и покритие
      description: Персонализирана тапицерия, тръби с подходящ цвят, премиум конзола за кормило, неръждаема опаковка
    - title: Компактно съхранение
      description: Проектирани за гаражи на суперяхти — спускащи се тръби за компактно съхранение
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Тип корпус
      value: Deep-V алуминий / фибростъкло
    - label: Дедайрайз
      value: 18–22 градуса
    - label: Максимална скорост
      value: 30–40 възела
    - label: Сухо тегло
      value: 120–350 кг (алуминиев корпус)
    - label: Davit Lift е готов
      value: Да — стандарт за повдигащи точки
    - label: Съхранение
      value: Спускаеми тръби, подреждащи се
