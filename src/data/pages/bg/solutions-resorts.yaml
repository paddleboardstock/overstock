testimonial:
  content: Aquafarer Проектирахме и оборудвахме цялата ни програма за плажни дейности в три курортни имота. SUPs80, 40 каяка, инфраструктура за безопасност и обучение на персонала — всичко доставено в една пратка. Участието на гостите във водни дейности се увеличи с 60% през първия сезон.
  name: Софи Лоран
  title: Директор по обслужване на гости, Azure Bay Resorts — Пукет, Тайланд
content_segments:
  tagline: Профили на курорти
  title: Решения за хотелиерство на крайбрежната ивица<br />По тип имот
  subtitle: Всеки курортен имот има уникален профил на гостите, разнообразие от дейности и оперативен ритъм — от бутикови еко-лоджи до обширни луксозни плажни курорти. Ние проектираме програми за водни спортове, които отговарят на класа на имота и очакванията на гостите.
  items:
    - title: Луксозни курорти на плажа
      subtitle: VIP трансфери, водни дейности, премиум преживяване за гости
      description: Луксозни крайбрежни имоти — Four Seasons, Aman и подобни луксозни групи — където водните спортове са водеща атракция за гости, която повишава удовлетвореността и допълнителните приходи. Автопаркът трябва да изглежда премилен, да предлага разнообразие по възрастови групи и нива на умения и да се интегрира безпроблемно с съществуващите системи за консиерж и резервации на курорта. Очакванията за външен вид на гостите са изключително високи — състоянието и представянето на оборудването пряко влияят на 5-звездните отзиви.
      features:
        - 'Флот с премиум марка: SUPs, каяци, педални лодки и малки RIB тендери'
        - 'Презентация, готова за гостите: съвпадащи цветове на курорта, лого брандиране, изложба на сценично оборудване'
        - Малък RIB лукс за трансфери на VIP гости с персонализирана тапицерия и съвпадение на цветовете
        - 'Интегрирана инфраструктура за безопасност: буйни линии, спасителни станции, AED'
        - 'Управление на приходите: динамични шаблони за ценообразуване, обучение за допълнителни продажби, пакетиране на пакети'
    - title: Частни островни курорти
      subtitle: Превоз на гости при всякакви метеорологични условия — нула престои, абсолютна надеждност
      description: Частните островни курорти работят на отдалечени места, където лодката е единствената връзка с континента. Ежедневните трансфери на гости, доставки и спешна медицинска евакуация зависят от един кораб — всяко прекъсване пряко влияе на преживяването на гостите и работата на курорта. Тези оператори се нуждаят от лодка, която работи надеждно при всякакви метеорологични условия, изисква минимална поддръжка и има резервни системи за критична надеждност. Лодката трябва да изглежда красиво при пристигането на гостите на острова.
      features:
        - RIB Конфигурация за всички сезони с пълно климатично покритие и тежкотоварни тръби
        - Осигуряване на двудвигателен или резервен двигател за операции без прекъсвания
        - Hypalon Комерсиално строителство за 5-8 години живот в дистанционна експлоатация
        - Лесен за поддръжка дизайн с достъпни компоненти за обслужване на място
        - Персонализирана марка на курорта и премиум тапицерия, които съответстват на островната естетика
    - title: Езерни и еко курорти
      subtitle: Преживявания на гости, интегрирани с природата
      description: Имоти край езерото, еко-хижи и природни убежища предлагат тихи, нисковъздействияни водни дейности, които допълват природната среда. Оборудването трябва да бъде немоторизирано, където е възможно, лесно за съхранение в лодкарници с ограничено пространство и тихо за използване, за да се запази атмосферата за всички гости.
      features:
        - 'Немоторизиран флот: SUPs, каяци, канута и гребни лодки'
        - Тихи станции за надуване на електрическа помпа за използване от гости при поискване
        - Екологично чисти материали и опаковки, съобразени с брандирането за устойчивост
        - Складови рафтове и системи за организация на лодкарници включваха
    - title: Плажни клубове
      subtitle: Трансфери за гости, забавления, малък лукс RIBs
      description: Плажните клубове работят в енергична, визуално ориентирана среда, където оборудването е част от атмосферата. Те се нуждаят от малък RIBs лукс за трансфери на гости от близки хотели или кейове, както и водни играчки за забавление на гостите — теглене на джет ски, надуваеми пързалки и дъски за гребане. Флотът трябва да изглежда стилно, да е лесен за управление и да издържа на ежедневна употреба от гости с различни нива на умения. Съхранението и бързото разполагане са критични по време на пиковите часове.
      features:
        - Компактен RIB луксозен модел (3.3-4.3 м) за трансфери на гости и обслужване с тендер
        - 'Водни играчки: теглещи се надуваеми съдове, SUP дъски, каяци за забавление на гостите'
        - Персонализиран цвят и брандиране, съответстващи на визуалната идентичност на плажния клуб
        - Системи за бързо изстрелване и извличане за операции с висока текучест
        - Hypalon Издръжлива конструкция за ежедневно излагане на солена вода и UV
    - title: Клубове за частни членове и яхт клубове
      subtitle: Пристанищен транспорт, членски тендери, ексклузивни водни спортове
      description: Частни клубове, където водните спортове и транспортът с лодки са предимство за членовете, а не източник на приходи. Оборудването трябва да отговаря на по-високи естетически стандарти, да е достъпно при поискване за членовете и да изисква минимален надзор от страна на персонала. Яхт клубовете на марината специално се нуждаят от тендери за пристанищен транспорт — преместване на членове между кей, котва и брег. Съхранението и поддръжката трябва да са невидими за членовете.
      features:
        - Висококласни RIB обслужващи кораби за пристанищен транспорт и прехвърляне на членове
        - 'Премиум оборудване: EVA палуби, персонализирани цветове за членове, брандирана тапицерия'
        - Система за самообслужване на плащане за достъп на членове без персонал
        - Програма за съхранение и годишно обновяване извън сезона
    - title: Хотели, ориентирани към приключения и дейности
      subtitle: Обиколки с водач, SUP йога, гмуркане с шнорхел, групови дейности
      description: Имотите се позиционират като дестинации за приключения — предлагайки екскурзоводни обиколки, SUP йога, гребли при залез, гмуркане с шнорхел и групови дейности. Автопаркът трябва да поддържа както модели за безплатен наем, така и с екскурзоводни програми, с оборудване, което безпроблемно преминава между обиколки за самостоятелно ползване на гости и обиколки, водени от инструктор. Тези имоти се нуждаят от издръжливо оборудване за високочестотна смяна на клиенти, с лесно почистване между групите гости.
      features:
        - Универсален смесен автопарк, поддържащ + наемателни модели за екскурзоводни турове под наем
        - Тандемни каяци и екстра-стабилни SUP платформи за групови дейности
        - 'Оборудване за водачи: инструкторски дъски, сухи кутии, водоустойчиви комуникации'
        - 'Сезонна смяна на оборудването: летящ флот → зимна програма за съхранение'
        - Здрава конструкция, проектирана за ежедневна употреба от гости с минимална поддръжка
