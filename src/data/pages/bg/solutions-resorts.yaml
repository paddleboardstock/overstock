  content: Paddle Board Overstock проектира и оборудва цялата ни програма за плажни активности в три ваканционни комплекса. 120 SUPs, инфраструктура за безопасност и обучение на персонала — всичко доставено в една пратка. Участието на нашите гости във водни дейности се увеличи с 60% през първия сезон.
  name: Софи Лоран
  title: Директор по обслужване на гости, Azure Bay Resorts — Пукет, Тайланд
content_segments:
  tagline: Профили на курорти
  title: Решения за хотелиерство на крайбрежната ивица<br />По тип имот
  subtitle: Всеки курортен имот има уникален профил на гостите, разнообразие от дейности и оперативен ритъм — от бутикови еко-лоджи до обширни луксозни плажни курорти. Ние проектираме програми за водни спортове, които отговарят на класа на имота и очакванията на гостите.
  items:
    - title: Луксозни курорти на плажа
      subtitle: VIP трансфери, водни дейности, премиум преживяване за гости
      description: Луксозни крайбрежни имоти — Four Seasons, Aman и подобни луксозни групи — където водните спортове са водеща атракция за гости, която повишава удовлетвореността и допълнителните приходи. Автопаркът трябва да изглежда премилен, да предлага разнообразие по възрастови групи и нива на умения и да се интегрира безпроблемно с съществуващите системи за консиерж и резервации на курорта. Очакванията за външен вид на гостите са изключително високи — състоянието и представянето на оборудването пряко влияят на 5-звездните отзиви.
      features:
        - Премиум флот от SUPs в същите цветове на курорта
        - 'Презентация, готова за гостите: съвпадащи цветове на курорта, лого брандиране, изложба на сценично оборудване'
        - Дъски от серията с подписани произведения за премиум гостоприемство и фотомоменти
        - 'Интегрирана инфраструктура за безопасност: буйни линии, спасителни станции, AED'
        - 'Управление на приходите: динамични шаблони за ценообразуване, обучение за допълнителни продажби, пакетиране на пакети'
    - title: Частни островни курорти
      subtitle: Тихи, самостоятелни водни дейности за гости
      description: 'Частните островни курорти работят в отдалечени места, където логистиката е сложна и всяка доставка има значение. Водните дейности за гости трябва да бъдат самодостатъчни: оборудване, което се съхранява компактно, надува се при поискване, изисква минимална поддръжка и се представя красиво при пристигането на гостите. Планираме флотски програми около прозорците за хидроплани и морски товари, а нашата издръжлива конструкция поддържа оборудването готово за гости през дълги сезони без подкрепа от континента.'
      features:
        - Компактен надуваем флот — кораби и провизии ефективно на отдалечени острови
        - PVC Строителство с търговски клас за многосезонна гостуване
        - Лесна поддръжка на място с включени комплекти за ремонт и видео насоки
        - Персонализирана марка на курорта, съответстваща на островната естетика
    - title: Езерни и еко курорти
      subtitle: Преживявания на гости, интегрирани с природата
      description: Имоти край езерото, еко-хижи и природни убежища предлагат тихи, нисковъздействия водни дейности, които допълват природната среда. Оборудването трябва да бъде немоторизирано, където е възможно, лесно за съхранение при ограничено пространство и тихо при употреба, за да се запази атмосферата за всички гости.
      features:
        - SUP Немоторизиран автопарк в поредицата изкуство, вдъхновени от природата
        - Тихи станции за надуване на електрическа помпа за използване от гости при поискване
        - Екологично чисти материали и опаковки, съобразени с брандирането за устойчивост
        - Складови рафтове и системи за организация на пристанището включваха
    - title: Плажни клубове
      subtitle: Забавление за гости и атмосфера на крайбрежието
      description: Плажните клубове работят в енергична, визуално фокусирана среда, където оборудването е част от атмосферата. Те се нуждаят от стилни дъски за гребане за забавление на гостите, SUP наем за плажни дейности и оборудване, което изглежда толкова добре, колкото самото място. Флотът трябва да е лесен за управление, да издържа на ежедневна употреба от гости с различно ниво на умения и да се разполага бързо в пиковите часове.
      features:
        - Характерни арт SUPs серии, които служат и като декор на мястото
        - SUP Готов за наем автопарк за забавление на гостите
        - Персонализиран цвят и брандиране, съответстващи на визуалната идентичност на плажния клуб
        - Системи за бързо изстрелване и извличане за операции с висока текучест
        - UV-устойчива конструкция за ежедневно излагане на солена вода
    - title: Клубове за частни членове и яхт клубове
      subtitle: Членове на водни спортове и ексклузивни програми по гребане
      description: Частни клубове, където водните спортове са предимство за членовете, а не източник на приходи. Оборудването трябва да отговаря на по-високи естетически стандарти, да бъде налично при поискване за членовете и да изисква минимален надзор от персонала. Яхт клубовете на марината използват брандирани SUP флоти за отдих на членовете около пристанището. Съхранението и поддръжката трябва да са невидими за членовете.
      features:
        - SUP Премиум брандирани автопаркове за водни спортове за членове
        - 'Премиум оборудване: EVA палуби, персонализирани цветове за членове, брандирана тапицерия'
        - Система за самообслужване на плащане за достъп на членове без персонал
        - Програма за съхранение и годишно обновяване извън сезона
    - title: Хотели, ориентирани към приключения и дейности
      subtitle: Обиколки с водач, SUP йога, гмуркане с шнорхел, групови дейности
      description: Имотите се позиционират като дестинации за приключения — предлагайки екскурзоводни обиколки, SUP йога, гребли при залез, гмуркане с шнорхел и групови дейности. Автопаркът трябва да поддържа както модели за безплатен наем, така и с екскурзоводни програми, с оборудване, което безпроблемно преминава между обиколки за самостоятелно ползване на гости и обиколки, водени от инструктор. Тези имоти се нуждаят от издръжливо оборудване за високочестотна смяна на клиенти, с лесно почистване между групите гости.
      features:
        - Универсален смесен автопарк, поддържащ + наемателни модели за екскурзоводни турове под наем
        - Особено стабилни SUP платформи за групови дейности
        - 'Оборудване за водачи: инструкторски дъски, сухи кутии, водоустойчиви комуникации'
        - 'Сезонна смяна на оборудването: летящ флот → зимна програма за съхранение'
        - Здрава конструкция, проектирана за ежедневна употреба от гости с минимална поддръжка
