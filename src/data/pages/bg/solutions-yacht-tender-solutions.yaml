  title: Защо Aquafarer като<br />Вашата яхтена лодка
  subtitle: Премиум яхтени тендери, избрани от собственици, строители, чартърни оператори и дилъри по целия свят.
  list:
    - Лек и компактен при спускане — лесен за съхранение в гараж, шкафче или на терасата
    - Hypalon Конструкция — UV превъзходна устойчивост за съхранение в марината под тропическо слънце
    - Стабилно и комфортно пътуване за трансфери на гости при различни морски условия
    - Персонализирана тапицерия, цветове на тръбите и брандиране, които да паснат перфектно на вашата яхта
    - 'Обхват на външния борт: 15 HP до 60 HP за тендерни и лодкови приложения'
