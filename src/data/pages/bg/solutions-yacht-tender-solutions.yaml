content_challenge:
  tagline: Предизвикателството
  title: Тендърите за яхти изискват<br />Изпълнение и представяне
  subtitle: Яхтен тендърът е повече от малка лодка — той е продължение на основния кораб и израз на качество.
  paragraphs:
    - Собствениците и капитаните на яхти се нуждаят от тендъри, които се представят добре, се съхраняват компактно и изглеждат отлично. Тендърът трябва да допълва естетиката на яхтата, като осигурява надежден транспорт за гостите и екипажа.
    - '**Съхранението е критично** — Тендърът трябва да се побира на палубата, в гараж или на хватачи. Теглото е важно за системите за спускане и изваждане. Aquafarer RIBs осигуряват отлични съотношения мощност-тегло с компактни профили за съхранение.'
    - '**Очакванията за производителност са високи** — Гостите очакват плавно и сухо пътуване при трансфер до брега. Вариантите на двигателя трябва да балансират скоростта, обхвата и нивата на шум за премиум изживяване. За чартърни операции тендърът работи ежедневно и трябва да издържа на честа употреба.'
    - '**Външният вид има значение** — Несъвпадащ или износен тендър намалява общото представяне на яхтата. Персонализирани цветове на тръбите, тапицерия и брандиране гарантират, че тендърът изглежда като част от яхтата.'
content_solution:
  tagline: Нашето решение
  title: Конфигурации на тендери<br />За всяко яхтено приложение
  subtitle: Aquafarer RIB тeндъри могат да бъдат персонализирани, за да съответстват на вашия съд, тип операция и изисквания за съхранение — от спецификации за суперяхтени производители до програми за флоти от чартъри.
  list:
    - Персонализирани цветове на тръбите, за да съвпадат или допълват основния кораб — всеки RAL цвят наличен за Hypalon или PVC тръби
    - Персонализирана тапицерия и шевове — премиум морски винил със съвпадение на цветовете и бродерия на лого
    - Конзолно или кормилно управление — избирате според модел на използване и предпочитания на оператора
    - Фибростъклен корпус deep-V за плавно и сухо пътуване при различни морски условия
    - Компактно съхранение — се изпуска или гнезди за палубен гараж, шкаф или съхранение на хватач
    - Hypalon тръби за UV устойчивост и дългосрочно запазване на външния вид
    - Точки за повдигане и теглене стандартни за всички модели
    - Опционално носово покривало, пълно покривало и защитни ръкави
    - 'Диапазон на двигателя: 15 HP до 60 HP — извънбордови или с кормило конфигурации'
    - OEM/частно брандиране налично за производители на яхти и морски дилъри
content_segments:
  tagline: Профили на клиенти
  title: Решения за яхтени тендери<br />По тип клиент
  subtitle: Различните сегменти на яхтената индустрия имат уникални изисквания.Aquafarer Конфигурира тендерите според всяко приложение.
  items:
    - title: Строители на суперяхти
      subtitle: OEM Интеграция на тендера — персонализирани размери, цветове и материали
      description: 'Строителите на яхти се сблъскват с повтарящото се предизвикателство: всяко ново плавателно средство има уникални размерни ограничения, теглови ограничения и естетически очаквания. Тендерът трябва да се интегрира перфектно със системата на майчиния кораб, да пасва в точни размери на гаража и да отговаря на дизайнерския език на яхта за милиони евро. Всяко несъответствие — грешен цвят на тръбата, неправилно разположение на повдигащите точки, несъвместимо тегло — забавя доставката и се отразява негативно на строителя.Aquafarer Работи директно с екипите по снабдяване и проектиране на строителите, за да достави тендери с персонализирани цветове на RAL тръбите, съвпадащи тапицерии, брандирани панели на конзоли и OEM пълни пакети с документация.'
      features:
        - Персонализирани размерни спецификации, съответстващи на гаражните и клапанните ограничения
        - Всякакъв цвят на RAL тръби и съответстваща тапицерия — предоставени са образци за одобрение на дизайна
        - OEM Брандиране на конзоли, тръби и облегалки на седалките
        - Валидиране на точката за повдигане и напасването на кавита за всеки модел
        - Теглото на корпуса е оптимизирано за определени системи за изстрелване и възстановяване
        - Планирането на доставки на големи епи, съобразено с производствените срокове
    - title: Компании за управление на яхти
      subtitle: Стандартизирани за флота търгове — глобална поддръжка, минимални престои
      description: Управленските компании наблюдават множество яхти, опериращи в Средиземно море, Карибите, Южния Пасифик и отвъд. Основната им нужда е надеждността — повреден тендер в отдалечено пристанище означава извънреден труд на екипажа, оплаквания от гости и скъпи подмяни в последния момент. Стандартизираните спецификации на флота намаляват времето за обучение на екипажа между корабите и опростяват управлението на резервни части.Aquafarer Предлага ценообразуване на флота с няколко плавателни кораба, последователни спецификации при поръчки и глобална поддръжка на резервни части за управленски компании с плавателни съдове в различни региони.
      features:
        - Стандартизирани спецификации за целия управляван автопарк
        - Сменяеми резервни части за всички тендери във флота
        - Ценообразуване на автопарка и отстъпки за обеми при поръчки на няколко единици
        - Глобална наличност на резервни части — бърза доставка до всяко пристанище
        - Последователна документация за обслужване и поддръжка на екипажа
        - Координация на доставката на няколко единици до различни места на плавателни съдове
    - title: Оператори на яхтени чартъри
      subtitle: Високочестотни ежедневни операции — издръжливост без компрометиране на външния вид
      description: 'Чартърните търговци се сблъскват с най-натоварващия оперативен график в яхтената индустрия: ежедневни трансфери на гости, пътувания до брега, подкрепа на водни спортове и пристанищно търгиране — често 200+ операции на чартърен сезон. Тендерът трябва да изглежда безупречно при всяко предаване на гости, като същевременно издържа на непрекъснато качване, излагане на солена вода и часове на двигателя. Влошаването на външния вид е пряко бизнес значение — износеният тендер влияе на отзивите на гостите и цените на чартърите.Aquafarer Конфигурира чартърните търгове с подобрена тапицерия, тежки Hypalon тръби и подсилени зони за управление за дългосрочна издръжливост, която поддържа качеството на представянето.'
      features:
        - Hypalon Тежкотоварни тръби — живот от 5 до 8 години при ежедневна чартърна служба
        - Подсилени стъпала за закачване и въжета за захващане за честа употреба
        - Премиум винилова тапицерия, устойчива на петна — лесно почистване между чартърите
        - Лесно почистващи се нехлъзгащи повърхности на палубата
        - Надеждни външни пакети с лесен достъп до обслужване за стегнат период
        - Козметични материали, които поддържат външен вид през чартърните сезони
    - title: Дилъри и брокери на яхти
      subtitle: Надеждно снабдяване за завършване на кораба и препродажна стойност
      description: Дилърите и брокерите се нуждаят от стабилно предлагане на качествени оферти, които допълват продаваните от тях съдове — съответстващи на позиционирането на марката и подобрявайки изживяването на купувача. Непостоянен търг или забавяне на доставките може да забави предаването на яхта или да намали представянето на обявата. Дилърите се нуждаят от последователно качество във всички партиди, надеждни срокове за доставка и конкурентни цени, за да поддържат маржовете.Aquafarer Предлага програми за инвентар за дилърите с сезонно планиране на доставките, възможности за съвместно брандиране за изложба в шоурума и приоритетно разпределение през пиковите сезони.
      features:
        - Програми за складиране с модели за налични при поискване
        - Сезонното планиране на доставките, съобразено с календара на предаването
        - Дилърско съвместно брандиране на конзоли и тръби за изложбени зали
        - Последователно качество и спецификации при всички партидни поръчки
        - Конкурентно ценообразуване при дилърите с ниво на обем
content_benefits:
