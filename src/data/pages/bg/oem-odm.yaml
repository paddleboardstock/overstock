process_steps:
  title: 6-степенен OEM/ODM процес
  subtitle: От бриф за дизайн до FOB Цингао — оптимизиран работен поток
  steps:
    - number: '01'
      title: Бриф за дизайн и 3D CAD моделиране
      description: Споделете целевите си спецификации, референтен продукт или концепция. Нашият инженеринг екип разработва детайлни CAD чертежи и 3D рендери за вашето одобрение.
      timeline: 3–5 дни
    - number: '02'
      title: Избор на материали и тестване на тъкани
      description: Изберете между военен клас PVC (0.9–1.2 мм), Hypalon CSM или drop-stitch основни тъкани. Ние извършваме тестове за якост на опън, адхезия на покритие и стабилност на UV.
      timeline: 2–3 дни
    - number: '03'
      title: Бързо прототипиране и производство на проби
      description: Ние CNC произвеждаме персонализирани калъпи и създаваме предварителни производствени проби с цветовете на вашата марка, лого и определени материали. Пробите се изпращат за вашето одобрение.
      timeline: 7–14 дни
    - number: '04'
      title: 24–48 часов тест за задържане на високо налягане
      description: Всеки прототип преминава през строги тестове за задържане на налягане при 1,25x номинално налягане. Извършват се тестове за разлепване на шевове и проверка на размерите.
      timeline: 1–2 дни
    - number: '05'
      title: CE/ISO Инспекция на качеството и опаковане
      description: 100-точков списък за проверка на качеството. Всяко устройство се проверява преди опаковане за продажба. Включени са CE декларация за съответствие и BSCI доклад за съответствие.
      timeline: 2–3 дни
    - number: '06'
      title: FOB Кингдао Доставка и Логистика
      description: Готовите стоки се палетират, свиват с разтегателно фолио и се натоварват в контейнери в пристанище Кингдао. Пълна износна документация, митническо оформяне и проследяване в реално време.
      timeline: 7–14 дни
