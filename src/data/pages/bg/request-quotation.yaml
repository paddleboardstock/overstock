hero_text:
  tagline: Вземете оферта
  title: Искане на оферта<br />за Вашия проект
  subtitle: Разкажете ни за вашите изисквания и нашият екип ще отговори с подробна оферта в рамките на 2 работни дни.
steps2_process:
  title: Как работи
  subtitle: Четири прости стъпки от запитване до оферта.
  items:
    - title: 'Стъпка 1: Подайте вашите изисквания'
      description: Попълнете формуляра по-долу с типа продукт, количество и спецификации. Колкото повече подробности предоставите, толкова по-точна ще бъде офертата.
      icon: tabler:file-text
    - title: 'Стъпка 2: Преглеждаме и даваме съвет'
      description: Нашият инженеринг екип преглежда вашите изисквания и може да се свърже с вас за уточнения. Ние предоставяме препоръки относно конфигурацията на продукта и опциите.
      icon: tabler:users
    - title: 'Стъпка 3: Получете вашата оферта'
      description: Получавате подробна оферта, включително единични цени, MOQ, срок на доставка, условия на плащане и опции за доставка. Обикновено в рамките на 48 часа.
      icon: tabler:currency-dollar
    - title: 'Стъпка 4: Проба и производство'
      description: След приемане на офертата, продължаваме с производството на проба (ако е приложимо) или директно с масовото производство. Редовни актуализации по време на целия процес.
      icon: tabler:building-factory
content_form:
  tagline: Формуляр за оферта
  title: Разкажете ни за вашия проект
  subtitle: Всички полета маркирани с * са задължителни.
  fields:
    - name: Продуктова категория
      type: select
      options:
        - RIB Лодка
        - Надуваема лодка
        - SUP дъска
        - Надуваем каяк
        - Спасителна жилетка
        - Морски аксесоар
        - Персонализирано OEM/ODM
    - name: Приложение
      type: select
      options:
        - Дайвинг център
        - Риболов
        - Морски туризъм / курорт
        - Търсене и спасяване
        - Яхтена лодка
        - Търговска работна лодка
        - Правителствена / Военна
        - OEM / Частен бранд
        - Лична / Рекреационна
        - Друго
    - name: Количество
      type: text
      placeholder: напр. 50 единици
    - name: Целеви пазар
      type: text
      placeholder: напр. Европа, Северна Америка, Близкия изток
    - name: Държава за доставка
      type: text
      placeholder: напр. Италия, ОАЕ, САЩ, Австралия
    - name: Предпочитания за материал
      type: select
      options:
        - Без предпочитания
        - Материал за морски условия PVC (1100 dtex)
        - Премиум Hypalon / CSM
        - Корпус от фибростъкло
        - Алуминиев корпус
    - name: Изискване за двигател
      type: text
      placeholder: напр. 60 HP извънбордов, без двигател, двоен 115 HP
    - name: Изисква се персонализация
      type: text
      placeholder: напр. специални цветове, брандиране/лого, опаковка, специални фитинги
    - name: Срок
      type: text
      placeholder: напр. доставка в рамките на 90 дни
    - name: Допълнителни изисквания
      type: textarea
      placeholder: Опишете вашето приложение, технически спецификации или специални изисквания — включително референтни чертежи, спецификации или линкове, ако са налични
    - name: Качване на спецификация
      type: file
      placeholder: Качете вашата спецификация, чертеж или справочен документ (PDF, DWG, DXF)
    - name: Качете Лого / Дизайн
      type: file
      placeholder: Качете вашето лого или дизайн за персонализирано брандиране (AI, EPS, PNG)
content_rfq_types:
  tagline: 3-етапна система за искане на оферта (RFQ)
  title: Изберете правилното<br />ниво на запитване
  subtitle: Различните проекти изискват различни нива на детайлност. Изберете формата, която съответства на етапа на покупката.
  items:
    - title: Бързо запитване
      description: 5-6 полета, 30 секунди. За първоначален контакт, общи въпроси или последващи действия при изтегляне на ресурси. Отговаряме в рамките на 24 часа с основна информация и следващи стъпки.
      icon: tabler:bolt
    - title: Стандартно RFQ
      description: 8-10 полета, 2 минути. За конкретни продуктови оферти с избор на модел, количество и изисквания за доставка. Получавате подробна оферта в рамките на 48 часа.
      icon: tabler:file-text
    - title: Проектно RFQ
      description: 10-14 полета, 5 минути. За RIB, курортен флот, спасителни или правителствени проекти, изискващи персонализирана конфигурация, документация за съответствие и многогодишно планиране на доставките. Назначен е специален проектен мениджър.
      icon: tabler:clipboard-list
form_quick:
  title: Бързо запитване
  subtitle: Бърз контакт за общи въпроси и първоначални заявки за информация.
  fields:
    - name: пълноИме
      label: Пълно име
      type: text
      required: true
      placeholder: Вашето пълно име
    - name: бизнесИмейл
      label: Бизнес имейл
      type: email
      required: true
      placeholder: you@company.com
    - name: имеНаКомпанията
      label: Име на компанията
      type: text
      required: true
      placeholder: Вашата компания
    - name: типКупувач
      label: Аз съм...
      type: select
      required: true
      options:
        - Дистрибутор / Импортьор
        - Собственик на марка / Частна марка
        - Курорт / Воден център
        - Оператор за наем
        - Правителствена / Спасителна агенция
        - Оператор за гмуркане / риболов
        - Морски инженер / Рефитър
        - Друго
    - name: интерескъмпродукта
      label: Интерес към продукта
      type: multiselect
      required: true
      options:
        - RIB Лодки
        - Надуваеми лодки
        - SUP Дъски
        - Предпазно оборудване
        - Аксесоари
        - OEM/ODM Персонализиран
    - name: message
      label: Какво ви е необходимо?
      type: textarea
      required: false
      placeholder: Кратко описание на вашите изисквания...
form_standard:
  title: Стандартно RFQ
  subtitle: Подробна оферта за конкретни продукти и количества.
  fields:
    - name: пълноИме
      label: Пълно име
      type: text
      required: true
    - name: бизнесИмейл
      label: Бизнес имейл
      type: email
      required: true
    - name: имеНаКомпанията
      label: Име на компанията
      type: text
      required: true
    - name: типКупувач
      label: Тип купувач
      type: select
      required: true
    - name: моделнапродукта
      label: Модел / Тип на продукта
      type: text
      required: true
      placeholder: например, AF580 RIB, AF380 надуваем
    - name: quantity
      label: Прогнозно количество
      type: text
      required: true
      placeholder: например, 10-20 единици
    - name: целевимпазар
      label: Целеви пазар / Регион
      type: text
      required: true
      placeholder: например, ЕС, Северна Америка, Близкия изток
    - name: срокнадоставка
      label: Желана доставка
      type: select
      required: true
      options:
        - В рамките на 30 дни
        - 30-60 дни
        - 60-90 дни
        - Планиране предварително (90+ дни)
        - Само проучване
    - name: Изисква се съответствие
      label: Изисквания за съответствие
      type: multiselect
      required: false
      options:
        - CE / RCD 2013/53/ЕС
        - UKCA
        - USCG
        - ISO 9001
        - BSCI
        - REACH
        - Нито едно / Не съм сигурен
    - name: message
      label: Допълнителни подробности
      type: textarea
      required: false
form_project:
  title: Проектно RFQ
  subtitle: Подробно запитване за проект за флот, персонализирана или държавна поръчка.
  fields:
    - name: пълноИме
      label: Пълно име
      type: text
      required: true
    - name: бизнесИмейл
      label: Бизнес имейл
      type: email
      required: true
    - name: имеНаКомпанията
      label: Име на компанията
      type: text
      required: true
    - name: типКупувач
      label: Тип купувач
      type: select
      required: true
    - name: типПроект
      label: Тип проект
      type: select
      required: true
      options:
        - Флот за курорт / хотел
        - Флот под наем
        - Флот за спасителни / патрулни услуги
        - Флот за център по гмуркане
        - Държавна поръчка
        - Собствена марка / OEM
        - Поръчка за склад на дилър
        - Друго
    - name: видовеСъдове
      label: Изисквани видове лодки
      type: multiselect
      required: true
      options:
        - RIB Лодки
        - Надуваеми лодки / понтони
        - SUP Дъски
        - Каяци
        - Предпазно оборудване
    - name: размерФлот
      label: Размер на флота / диапазон на количествата
      type: text
      required: true
      placeholder: например, 20-50 единици за 12 месеца
    - name: специалниИзисквания
      label: Персонализирани нужди от конфигурация
      type: textarea
      required: false
      placeholder: Размер на корпуса, материал на тръбата, оформление на палубата, изисквания за брандиране...
    - name: Изисква се съответствие
      label: Изисквания за съответствие и сертификация
      type: multiselect
      required: true
      options:
        - CE / RCD 2013/53/ЕС
        - UKCA
        - USCG Тип III/V
        - ISO 9001
        - BSCI
        - REACH / RoHS
        - Сертификация за местния пазар
    - name: целевимпазар
      label: Целеви пазар
      type: text
      required: true
    - name: Бюджетен диапазон
      label: Бюджетен диапазон
      type: select
      required: false
      options:
        - Под $10,000
        - $10,000 - $50,000
        - $50,000 - $200,000
        - $200,000+
        - Предпочитам да не казвам
    - name: срокнадоставка
      label: График на проекта
      type: select
      required: true
      options:
        - Спешно (в рамките на 30 дни)
        - Стандартно (30-60 дни)
        - Планирано (60-90 дни)
        - Бъдещо планиране (90+ дни)
    - name: message
      label: Подробности и изисквания за проекта
      type: textarea
      required: false
      placeholder: Опишете вашия проект, приложение и всякакви специфични изисквания...
cta:
  title: Предпочитате да обсъдим по имейл?
  subtitle: Изпратете запитването си директно на нашия екип по продажбите и ние ще отговора в рамките на 24 часа.
  actions:
    - variant: primary
      text: Изпратете ни имейл директно
      href: /contact
