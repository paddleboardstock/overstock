hero_text:
  tagline: Ресурси
  title: Център за изтегляне и наръчници за гребане
  subtitle: Продуктови каталози, ръководства за покупка и инструкции за грижа, които ще ви помогнат да изберете, използвате и се насладите на вашата надуваема SUP дъска.
features3_downloads:
  tagline: Изтегляния
  title: Документация на продукта<br />И ресурси за гребане
  isBeforeContent: false
  columns: 2
  items:
    - title: Продуктов каталог 2026 SUP
      description: 'Цялата гама Paddle Board Overstock SUP: универсални дъски, арт серия и аксесоари с пълни спецификации и съдържание на пакета. Формат PDF.'
      icon: tabler:file-text
    - title: Наръчник за покупка на надуваеми SUP
      description: 'Как да изберете първата си дъска: дължина, ширина, дебелина, обем, съответствие на теглото на гребеца и коя форма на дъската пасва на стила ви на гребане.'
      icon: tabler:file-description
    - title: SUP Ръководство за размер и подходящост
      description: Съчетайте обема и размерите на дъската с вашето тегло и ниво на умения, с препоръки за конкретни дейности като свободно време, туринг, йога и фитнес.
      icon: tabler:clipboard-check
    - title: Наръчник за грижа и поддръжка на дъската
      description: 'Дръжте дъската си като нова: почистване, сушене, съхранение, защита на UV, грижа за клапана и инструкции за леки ремонти.'
      icon: tabler:tool
    - title: Наръчник за материали на надуваемата дъска
      description: Конструкция PVC, ядра drop-stitch, подплати за палубата EVA и какво означават 15 PSI твърдост за представяне и издръжливост.
      icon: tabler:files
    - title: Започване с SUP
      description: 'Основи за начинаещи гребци: надуване, носене, спускане на вода, основни удари и основни мерки за безопасност, за да можете да стоите на дъската още в първия ден.'
      icon: tabler:swimming
faqs:
  title: Често задавани въпроси
  subtitle: Често задавани въпроси за нашите дъски, поръчки и излизане на вода.
  columns: 2
  items:
    - title: Какво включва моята дъска?
      description: Всеки пълен пакет включва дъската, регулируемо гребло, помпа с висок поток, въже, комплект за ремонт и раница. Комплектът Gребло & Помпа също е наличен отделно.
      icon: tabler:package
    - title: Колко време отнема надуването?
      description: С включената помпа с висок поток, повечето гребци достигат пълно налягане за 8-12 минути. Работят и електрически помпи — просто спрете при указаното налягане, отпечатано близо до клапана.
      icon: tabler:clock
    - title: Как да избера правилната дъска?
      description: 'Започнете с теглото си и стила на гребане: начинаещите и семействата обичат широки, стабилни платформи като SUP Explorer 11; йога гребците предпочитат пълни палуби с добро сцепление; туринг гребците искат твърди, аеродинамични форми. Нашият екип с радост ще препоръча.'
      icon: tabler:help-circle
    - title: Какви методи на плащане приемате?
      description: Приемаме основни кредитни карти, PayPal и банков превод. Всички цени включват пълния пакет — без скрити допълнителни разходи.
      icon: tabler:currency-dollar
    - title: Колко време отнема доставката?
      description: Поръчките се изпращат от нашата фабрика и обикновено пристигат в рамките на 5-10 работни дни в зависимост от региона ви. За всяка поръчка се предоставя проследяване.
      icon: tabler:truck-delivery
    - title: Покрива ли моята дъска гаранция?
      description: Да — всяка дъска е покрита срещу производствени дефекти, а всяко устройство се тества под налягане до 1,25 пъти номиналното му налягане за 24-48 часа преди да напусне фабриката. Процентът на нашите гаранционни искове е под 2%.
      icon: tabler:shield-check
cta:
  title: Нуждаете ли се от помощ при избора на подходяща дъска?
  subtitle: Свържете се с нашия екип за честни съвети относно избора на дъска, размерите или въпроси относно поръчката.
  actions:
    - variant: primary
      text: Свържете се с нашия екип
      href: /contact
