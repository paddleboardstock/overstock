hero_text:
  tagline: Ресурси
  title: Център за изтегляне и ръководства за купувачи
  subtitle: Достъп до продуктовите каталози, OEM ръководства, контролни списъци за купувачи и техническа документация, които да ви помогнат да вземете информирано решение за покупка.
features3_downloads:
  tagline: Изтегляния
  title: Документация на продукта<br />& Ресурси за купувачи
  isBeforeContent: false
  columns: 2
  items:
    - title: Каталог на морски продукти 2026
      description: Пълен продуктов асортимент, включително RIB лодки, надуваеми лодки, SUP дъски, каяци и аксесоари. Спецификации, конфигурации и опции. PDF формат.
      icon: tabler:file-text
    - title: OEM Ръководство за производство
      description: 'Всичко, което трябва да знаете за партньорствата с OEM/ODM: преглед на процеса, минимални количества за поръчка, възможности за персонализация, контрол на качеството и доставка.'
      icon: tabler:building-factory
    - title: Ръководство за купувачи на RIB лодки
      description: 'Как да изберете правилната RIB: материали за корпуса, материали за тръбите, избор на двигател, съображения за размер и опции за конфигурация за различни приложения.'
      icon: tabler:file-description
    - title: Контролен списък за SUP доставчици
      description: 'Ключови съображения при избора на производител на SUP дъски: показатели за качество, изисквания за сертификация, MOQ съображения и какво да се търси при одит на фабриката.'
      icon: tabler:clipboard-check
    - title: Ръководство за материали за надуваеми лодки
      description: 'PVC срещу Hypalon: сравнение на издръжливост, UV устойчивост, продължителност на живота, възможности за ремонт и разходни съображения за различни морски приложения.'
      icon: tabler:files
    - title: Шаблон за бриф за персонализирано производство
      description: Изтеглете нашия шаблон за продуктов бриф. Попълнете вашите изисквания и го върнете при нас за оферта и оценка на осъществимостта в същата седмица.
      icon: tabler:template
faqs:
  title: Често задавани въпроси
  subtitle: Често срещани въпроси относно нашите продукти, производствения процес и модел на партньорство.
  columns: 2
  items:
    - title: Какво е минималното количество за поръчка?
      description: MOQ варира в зависимост от продуктовата категория. RIB лодки обикновено започват от 10 единици на модел. SUP дъски от 50 единици. Свържете се с нашия екип по продажби за продуктово-специфична MOQ информация.
      icon: tabler:help-circle
    - title: Мога ли да получа мостри преди да направя поръчка?
      description: Да. Paddle Board Overstock предоставя производство на мостри за оценка преди масовото производство. Разходите за мостри са договаряеми и често се зачитат към първата поръчка.
      icon: tabler:package
    - title: Какви са условията за плащане?
      description: Стандартните условия са 30% депозит при поръчката, 70% преди доставка. LC условията са налични за квалифицирани клиенти. Свържете се с нашия финансов екип, за да обсъдите договореностите.
      icon: tabler:currency-dollar
    - title: Колко време отнема производството?
      description: 'Типични срокове: RIB лодки 30-45 дни, SUP дъски 20-30 дни, надуваеми лодки 25-35 дни. Персонализираното развитие добавя 15-30 дни за прототипиране.'
      icon: tabler:calendar-clock
    - title: Какви сертификати притежават вашите продукти?
      description: Сертификация CE за пазарите на ЕС, производство одобрено от US Coast Guard, ISO система за качество, съответствие с BSCI и съответствие на материалите с REACH.
      icon: tabler:certificate
    - title: Предлагате ли персонализирано опаковане и брандиране?
      description: Да. Ние предоставяме персонализирана опаковка с вашето лого, цветове и идентичност на марката. MOQ за персонализирана опаковка зависи от категорията на продукта.
      icon: tabler:color-swatch
cta:
  title: Нуждаете се от помощ за намиране на правилния ресурс?
  subtitle: Свържете се с нашия екип за персонализирани насоки относно избора на продукт, OEM партньорства или технически спецификации.
  actions:
