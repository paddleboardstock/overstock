testimonial:
  quote: Нивото на документация и проследимост, което Paddle Board Overstock осигурява за тестване на качеството, надвишава това, което сме виждали от китайски производители. Всяка доставка включва пълен тестов доклад с препратки към стандарти и данни за преминаване/неуспех.
  author: Маркус Хансен
  title: Мениджър по снабдяването
  company: Нордик Марин Съплай
  location: Швеция
