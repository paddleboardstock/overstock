commitment:
  title: Нашият ангажимент
  body: Чрез тези строги тестови процедури, {SITE} предоставя на клиентите увереност, че нашите надуваеми SUP дъски не само имат висока производителност, но и са издръжливи — осигурявайки безброй приятни и безопасни приключения на водата. Нашата лаборатория за качество работи независимо от производството и докладва директно на управлението.
  cta: Заявка за документация за тестване
  cta_link: /contact
tldr:
  summary: Paddle Board Overstock управлява програма за тестване на качеството с 8 протокола, обхващащи налягане, удар, UV, износване, ниска температура, плаваемост, маневреност и водоустойчивост. Процент без дефекти от 99,3% за последните 12 месеца на доставки.
  points:
    - '8 протокола за тестване: налягане, удар, UV, износване, ниска температура, плаваемост, маневреност и водоустойчивост'
    - 99,3% без дефекти в доставките за последните 12 месеца
    - Всяко устройство преминава 24-48 часа задържане при 1,25x номинално налягане с максимален допуск за спад 5%
    - UV ускорено стареене на атмосферни влияния (1,000+ часа) и тестване на устойчивост на изотръпване на покритието
testing_note: Всеки тест следва документирани вътрешни протоколи. Резултатите от тестовете се записват, могат да бъдат проследени и се преглеждат от нашата независима лаборатория за качество.
