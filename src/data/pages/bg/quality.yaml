tests:
  - title: Тестване на налягане
    standard: ISO 6185-1 | Вътрешна спецификация AF-PT-001
    description: Надуваемите камери се пресуризират до 1.25 пъти препоръчителния работен лимит и се държат 30 минути. Налягането се измерва, за да се валидира херметичността и структурната целост на материалите и шевовете.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Тестове за въздействие
    standard: Вътрешна спецификация AF-IT-002
    description: Продуктите се подлагат на контролирани удари от стандартизирани тежести за падане и махалови апарати. Това оценява устойчивостта на пробиване, разпространението на разкъсване и структурната устойчивост при сблъсъци с препятствия, докове и отломки.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Тестване на съпротивление
    standard: ASTM G154 |ISO 4892-3
    description: Материалните проби се излагат на лампи UVA-340 в камери за ускорено изветряне за 1 000+ часа. Измерваме промяната на цвета (Delta E), задържането на блясъка и загубата на якост на опън, за да UV валидираме пакетите със стабилизатори.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Тестове за устойчивост на абразия
    standard: ASTM D751 (Табър) |ISO 5470-1
    description: Материалните проби се подлагат на абразивни колела CS-10 под натоварване 500g/1,000g за 1,000 цикъла. Масовата загуба и визуалната оценка на износване определят издръжливостта на покритието срещу пясък, чакъл и многократно пускане.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Тестове за производителност при ниски температури
    standard: Вътрешна спецификация AF-LT-003 | MIL-STD-810G
    description: Сглобените продукти и материални купони се кондиционират на -20°C, -10°C и 0°C за 24 часа, след което се тестват с гъвкавост. Проверяваме PVC това и Hypalon оставаме гъвкави без напукване или деламинация.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Тестове за плавателност и товароносимост
    standard: ISO 6185-1 |ISO 12402
    description: Продуктите се натоварват постепенно до капацитет 1.25x в контролиран басейн. Записват се производителността на свободната борда, стабилността и самоизточването. Номиналният капацитет на всеки модел се проверява математически и емпирично.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-stock-boat-inventory.webp
  - title: Тестове за маневреност
    standard: Вътрешна спецификация AF-MT-004
    description: Водните изпитания измерват радиуса на завиване, ускорението, времето за планиране и реакцията на греблата/мотора при различни условия на натоварване. Реалните характеристики на управление се валидират спрямо проектните цели.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Тестване на водонепроницаемост
    standard: ISO 6185-1 §7.3 | Вътрешна спецификация AF-WT-005
    description: Всеки сглобен продукт се тества със спрей при 0.5 bar на всички шевове, клапани и фитинги. 5-минутен тест за потапяне под налягане валидира водонепроницаемостта на камерата и клапана. Стандарт за нулева теч преди изпращане.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
