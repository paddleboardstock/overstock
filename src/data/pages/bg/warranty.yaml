label: Гаранция
headline: Paddle Board Overstock Ограничена гаранция на производителя
subtitle: Paddle Board Overstock гарантира качеството на всеки надуваем морски продукт, който произвеждаме. Тази Ограничена гаранция определя условията и обхвата за вашия Paddle Board Overstock продукт.
seo:
  headline: Paddle Board Overstock Гаранция за надуваема лодка — 5-годишна ограничена гаранция | Paddle Board Overstock
  description: Paddle Board Overstock предлага 5-годишна ограничена гаранция за основната тъкан на тръбата, шевовете и структурната цялост на корпуса от фибростъкло. Също така покрива въздушни клапани и фабрично инсталирани аксесоари. Пълните условия и положения за Paddle Board Overstock гаранцията на надуваема лодка.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Тази Ограничена Гаранция се прилага за нови надуваеми морски продукти с марка Paddle Board Overstock, закупени директно от Paddle Board Overstock или от оторизиран търговец или дилър Paddle Board Overstock. Датата на влизане в сила е проверима дата на първоначална покупка на дребно.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Гаранционно покритие и продължителност</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 години</h3>
        <p class="text-sm text-gray-600 mt-1">Цялост на основната тръба (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 години</h3>
        <p class="text-sm text-gray-600 mt-1">Структурна цялост на фибростъкленото корпус</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 години</h3>
        <p class="text-sm text-gray-600 mt-1">Способност на шевовете на надуваемата тръба да задържат въздух</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 години</h3>
        <p class="text-sm text-gray-600 mt-1">Функционалност на въздушния клапан</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 година</h3>
        <p class="text-sm text-gray-600 mt-1">Заводски инсталирани аксесоари и допълнителни фитинги</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 година*</h3>
        <p class="text-sm text-gray-600 mt-1">Комерсиална, наемна или флота употреба — всички компоненти</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Комерсиалната, правителствената, чартърната, наемната или учебната употреба намалява гаранцията до 1 година. Състезателна или конкурсна употреба анулира гаранцията изцяло.</p>
  </div>

  <h2>Какво е покрито</h2>
  <h3>Основна тъкан на тръбата (5 години)</h3>
  <p>Paddle Board Overstock гарантира основната тъкан на тръбата срещу порьозност, която значително компрометира способността на продукта да поддържа работно надуване. Това се прилага за CSM (Hypalon) покрита тъкан и всички други материали за тръби, използвани при производството.</p>

  <h3>Структурна цялост на фибростъкления корпус (5 години)</h3>
  <p>За продукти с корпус от фибростъклопласт (FRP), основната композитна структура е с гаранция срещу структурни дефекти поради материални или производствени недостатъци.</p>

  <h3>Способност на шевовете на надуваемата тръба да задържат въздух (5 години)</h3>
  <p>Шевовете на надуваемите тръби, свързани по време на производството, са гарантирани срещу производствени дефекти, които водят до значителна загуба на въздух през шева. Периодичната проверка и поддържането на подходящо налягане са условия за покритие.</p>

  <h3>Функционалност на въздушния клапан (5 години)</h3>
  <p>Въздушните клапани, инсталирани първоначално от Paddle Board Overstock, са гарантирани срещу производствени дефекти в материалите или изработката, които пречат на клапана да задържа въздух според предназначението.</p>

  <h3>Заводски инсталирани аксесоари (1 година)</h3>
  <p>Компоненти и фитинги, произведени от Paddle Board Overstock и първоначално инсталирани на завода, са гарантирани срещу дефекти в материалите и изработката за една година. Това изключва чуждестранни артикули, които се покриват само от съответните гаранции на производителите.</p>

  <h2>Какво не е покрито</h2>
  <ul>
    <li>Козметични недостатъци, включително промяна на цвета, петна, избеляване, бледняване, кредясване или всяка промяна във външния вид</li>
    <li>Пробиви, разрези, разкъсвания, цепнатини или други физически повреди</li>
    <li>Пукнатини, напукване, износване, надраскване или влошаване от триене или контакт</li>
    <li>Разлагане от излагане на UV светлина, атмосферни влияния или атмосферни условия</li>
    <li>Увреждане от контакт с горива, разтворители, киселини, алкали или химикали</li>
    <li>Щети от небрежност, неправилна употреба, злоупотреба, инцидент или нормално износване</li>
    <li>Проблеми с повърхността на гелкоута или боята (балончета, напукване, обезцветяване, избледняване)</li>
    <li>Повреждане от удар, напрежение, неправилна поддръжка или транспортиране с ремарке</li>
    <li>Повреди от неправилно надуване/сваляне на въздуха или използване на неодобрени устройства за надуване</li>
    <li>Оборудване, компоненти или системи на трети страни (покрити от съответните им производители)</li>
  </ul>

  <h2>Задължение и средство за защита на производителя</h2>
  <p>Единственото и изключително задължение на Paddle Board Overstock е ремонтът или подмяната, по избор на Paddle Board Overstock, на всяка част, която се установи като дефектна по отношение на материалите или изработката и е покрита от тази гаранция. Ремонти или подмяна се извършват от Paddle Board Overstock или от негово определено оторизирано сервизно звено. Частите, които са ремонтирани или подменени, се гарантират само за неизминалата част от оригиналния гаранционен период.</p>

  <h2>Условия на гаранцията</h2>
  <ul>
    <li><strong>Регистрация:</strong>Продуктът трябва да бъде правилно регистриран както е изисквано в условията на гаранцията.</li>
    <li><strong>Поддръжка:</strong>Продуктът трябва да се поддържа съгласно публикуваните насоки на Paddle Board Overstock, включително периодична проверка и поддържане на подходящото налягане на въздуха.</li>
    <li><strong>Сътрудничество:</strong>Закупувачът трябва напълно и своевременно да сътрудничи с Paddle Board Overstock по всички въпроси, свързани с искове по гаранцията.</li>
    <li><strong>Първоначален купувач:</strong>Това гаранционно обслужване се предоставя изключително на първоначалния крайния купувач и не може да бъде прехвърляно.</li>
  </ul>

  <h2>Търговска употреба</h2>
  <p>Ако продуктът се използва за търговски, държавни, нестопански, чартърни, рентални, обучителни или каквито и да е други цели освен за лична рекреационна употреба, гаранционният период за всички компоненти се намалява на една (1) година от първоначалната дата на покупка на дребно. Използването в състезания, скоростни или издръжливостни състезания незабавно и безвъзвратно отменя гаранцията изцяло.</p>

  <h2>Как да направите иск за гаранция</h2>
  <p>Свържете се с Paddle Board Overstock или упълномощения си дилър с доказателство за покупка и подробно описание на проблема. Paddle Board Overstock ще прегледа претенцията и ще предостави инструкции за проверка и обслужване.</p>
  <p>За въпроси относно гаранционно обслужване, моля свържете се с нас чрез нашия<a href="/contact" class="text-sky-600 underline">страница за контакти</a>с вашия номер на поръчка и подробности за продукта.</p>

  <h2>Продукти на трети страни</h2>
  <p>Оборудване, компоненти или системи, произведени от трети страни (дори ако са инсталирани от Paddle Board Overstock), са покрити изключително от всяка гаранция, предложена от съответния им производител. Paddle Board Overstock изрично се отказва от каквато и да е гаранционна отговорност за такива артикули на трети страни.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Това заявление за гаранция е резюме на пълната Paddle Board Overstock Ограничена гаранция на производителя. Пълният правен документ за гаранцията регулира всички условия и правила на гаранцията. Спецификациите могат да бъдат променяни без предизвестие. Paddle Board Overstock е фабрична марка на Paddle Board Overstock Производствен център Циндао.
  </p>
