    <h2>Какво е покрито</h2>
    <h3>Drop-Stitch Структура на ядрото и палубата (2 години)</h3>
    <p>Вътрешното drop-stitch ядро и външната структура на платката са защитени срещу производствени дефекти, които компрометират способността на платката да поддържа оперативна инфлация и твърдост.</p>

    <h3>Строителство на релси и пластове (2 години)</h3>
    <p>Шевовете и трислойните релсови ленти, когато са съединени по време на производството, са гарантирани срещу производствени дефекти, които водят до значителен въздушен пропуск през шева. Периодичната инспекция и поддържане на подходящи надуващи налягания са условия на покритие.</p>

    <h3>Функционалност на клапана за надуване (2 години)</h3>
    <p>Въздушните клапани за надуване, първоначално инсталирани от Paddle Board Overstock, са гарантирани срещу производствени дефекти в материала или изработката, които предотвратяват клапанът да задържа въздух според предназначението.</p>

    <h3>Включени аксесоари (2 години)</h3>
    <p>Помпата, регулируемото гребло, каишката, сваляемата перка и другите компоненти, включени в пакета на дъската, са защитени от дефекти в материала и изработката.</p>

    <h2>Какво не е покрито</h2>
    <ul>
      <li>Козметични недостатъци, включително промяна на цвета, петна, избеляване, бледняване, кредясване или всяка промяна във външния вид</li>
      <li>Пробиви, разрези, разкъсвания, цепнатини или други физически повреди</li>
      <li>Пукнатини, напукване, износване, надраскване или влошаване от триене или контакт</li>
      <li>Разлагане от излагане на UV светлина, атмосферни влияния или атмосферни условия</li>
      <li>Увреждане от контакт с разтворители, киселини, алкали или химикали</li>
      <li>Щети от небрежност, неправилна употреба, злоупотреба, инцидент или нормално износване</li>
      <li>Щети от удар, напрежение, неправилна поддръжка или транспорт</li>
      <li>Повреди от неправилно надуване/сваляне на въздуха или използване на неодобрени устройства за надуване</li>
      <li>Оборудване, компоненти или системи на трети страни (покрити от съответните им производители)</li>
    </ul>

    <h2>Задължение на производителя и средство за защита</h2>
    <p>Единственото и изключително задължение на Paddle Board Overstock е да ремонтира или замени, по избор на Paddle Board Overstock, всеки компонент, определен като дефектен по отношение на материалите или изпълнението и покрит от тази гаранция. Ремонти или замени се извършват от Paddle Board Overstock или от посочената от него сервизна станция. Компонентите, които са ремонтирани или заменени, са гарантирани само за неизтеклата част от първоначалния гаранционен период.</p>

    <h2>Условия на гаранцията</h2>
    <ul>
      <li><strong>Поддръжка:</strong>Продуктът трябва да се поддържа в съответствие с публикуваните от Paddle Board Overstock указания, включително периодична проверка и поддръжка на подходящото налягане на въздуха.</li>
      <li><strong>Сътрудничество:</strong>Покупателят трябва напълно и своевременно да сътрудничи с Paddle Board Overstock по всички въпроси, свързани с гаранционни искове.</li>
      <li><strong>Първоначален купувач:</strong>Това гаранционно обслужване се предоставя изключително на първоначалния крайния купувач и не може да бъде прехвърляно.</li>
    </ul>

    <h2>Търговска употреба</h2>
    <p>Ако продуктът се използва за търговски, наемен или автопарк цели, гаранционният период за всички компоненти се намалява на една (1) година от първоначалната дата на покупка. Използването в състезания, скоростни или издръжливостни състезания незабавно и окончателно анулира гаранцията изцяло.</p>

    <h2>Как да направите иск за гаранция</h2>
    <p>Свържете се с Paddle Board Overstock с доказателство за покупка и подробно описание на проблема. Paddle Board Overstock ще прегледа жалбата и ще предостави инструкции за проверка и обслужване.</p>
    <p>За въпроси относно гаранционно обслужване, моля свържете се с нас чрез нашия<a href="/contact" class="text-sky-600 underline">страница за контакти</a>с вашия номер на поръчка и подробности за продукта.</p>

