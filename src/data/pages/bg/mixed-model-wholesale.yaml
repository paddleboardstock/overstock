hero:
  tagline: Смесен модел на едро
  title: Смесени модели едро дъски за гребане —<br />Смесвайте различни SUP модели в един ред
  subtitle: Защо да ограничавате бюджета си само в един модел? Комбинирайте всички налични SUP дъски — универсални, туристически, сърф и арт издания — в една поръчка на едро, като общо са едва 5 борда.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Смесен ред от различни SUP модели надуваеми дъски от Paddle Board Overstock
direct_answer: Смесените модели на едро позволяват на малък търговец да поръча няколко различни SUP модела в една консолидирана пратка, вместо на едро количество от една платка. При Paddle Board Overstock, всички налични модели могат да бъдат комбинирани, минималната поръчка е общо 5 платки, а общото количество определя ценовия клас. Смесените поръчки се изпращат от Вейхай, Китай, чрез експресен въздушен товар (1–3 борда) или консолидиран морски товар (5–20 дъски) до 50+ държави, като всяка дъска е 100% тествана под налягане и покрита с 2-годишната SUP гаранция.
tldr_points:
  - Смесете всички SUP налични модели в една поръчка — без минимални стойности на модел
  - Общото количество на поръчката (не по модел) определя вашия ценови слой
  - Започнете с общо 5 дъски — създадени за малки търговци, не за контейнерни товари
  - 'Една консолидирана пратка: една транспортна сметка, една митническа проверка, една доставка'
why_mixed:
  tagline: Защо смесени?
  title: Смесвай и съчетавай. Купувай повече разнообразие. Харчи по-малко.
  subtitle: Рафт с еднакви дъски служи за един вид гребци. Смесена поръчка превръща същия бюджет в цяла продуктова линия.
  items:
    - title: Още разнообразие на рафта ти
      description: Комбинирайте универсални дъски за начинаещи, туристически дъски за приключенци и сърф дъски за колоездачи — една поръчка покрива целия ви клиентски диапазон.
    - title: По-нисък риск на модел
      description: Вместо да залагате сезона си на един модел, поръчайте по 2–4 от всеки. Ако един модел се продава повече от останалите, презаредете го при следващата поръчка с реални данни за продажбите.
    - title: Тествайте какво се продава на вашия пазар
      description: Всеки плаж, езеро и град имат различно търсене. Смесена първа поръчка е най-евтиното пазарно проучване — застои шест модела, виж кои се преместват.
    - title: По-добри полета при художествени издания
      description: Премиум арт сериите (Leviathan Wake, Medusa Glow, Ocean Voyager) предлагат по-високи цени. Смесете няколко в база от универсални дъски, за да увеличите средния си марж.
    - title: Една консолидирана пратка
      description: Една смесена поръчка означава една резервация на товар, една митническа проверка и една доставка — вместо пет отделни пратки от пет отделни доставчици.
how_it_works:
  tagline: Как работи
  title: Как работи редът на смесения модел
  steps:
    - title: Избери своя микс
      description: Изберете модели и количества за вашия пазар — или използвайте селектора по-долу, за да изберете комбинация и да видите актуализацията на броя на дъските и общата стойност на живо.
    - title: Поискайте оферта
      description: Изпратете ни микса. Потвърждаваме текущите наличности за всеки модел и оферти за единични единици, плюс експресни и морски транспортни опции за вашата страна.
    - title: Потвърдете заповедта
      description: Одобрете крайната оферта — модели, количества, доставка, общо. Заключваме наличността и насрочваме изпращането от Вейхай.
    - title: Тестваме всяка платка
      description: Всяка дъска във вашата смесена поръчка е тествана на 100% за налягане до 15 PSI преди опаковане — същият стандарт за всеки модел, независимо дали е входно ниво универсална или арт издание.
    - title: Една доставка до твоята врата
      description: Пълната смесена поръчка се изпраща заедно — експресна въздушна доставка за малки поръчки, консолидиран морски превоз за 5–20 дъски — с проследяване от врата до врата.
