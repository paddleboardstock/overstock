who_benefits:
  tagline: Кой може да се възползва
  title: За кого е смесеният модел на едро
  items:
    - title: Първи вносители
      description: Тестване на категорията SUP с разнообразие от модели, вместо да се ангажирате с един голям SKU.
    - title: Сезонни плажни търговци
      description: Магазини, които се нуждаят от начални дъски за туристи и премиум издания за местни — в една и съща поръчка за допълнителен запас.
    - title: Онлайн продавачи
      description: Списък с няколко модела едновременно, за да разберете кой дизайн, дължина и вид използване конвертира най-добре.
    - title: Наемни автопаркове и училища
      description: Флотилии, които се нуждаят от различни размери дъски за различно тегло на карачите и типове уроци, а не флотилия с един специфик.
faq_section:
  title: Често задавани въпроси за смесения модел
  items:
    - q: Има ли минимално количество за модел?
      a: Не. Минималната поръчка от 5 дъски се отнася за общата поръчка, а не за всеки модел. Можете да поръчате 5 различни модела, по една дъска от всеки.
    - q: Променя ли смесването на модели цената?
      a: Едро цените на единица се посочват за всеки модел, но вашият ценови диапазон се подобрява с общия брой дъски — смесването на модели не ви наказва.
    - q: Мога ли да смесвам дъски и аксесоари?
      a: Да — резервни гребла, помпи и комплекти за ремонт могат да бъдат добавени към смесена поръчка. Попитайте във вашето запитване.
    - q: Как да разбера кои модели са подходящи за моя пазар?
      a: Изпратете ни информация за вашите клиенти (по крайбрежието или вътрешните райони, туристи или местни, начинаещи или карачи) чрез формата за запитване и ние ще ви препоръчаме микс.
