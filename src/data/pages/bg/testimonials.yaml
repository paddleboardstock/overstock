testimonials:
  - category: clubs
    name: Рикардо Сантос
    title: Собственик, Algarve Surf Academy
    location: Лагос, Португалия
    content: Започнахме с Пакета за Стартиращ Клуб за нашето училище по сърф. 20 дъски, гребла, жилетки — всичко пристигна в рамките на 3 седмици. След два сезона надградихме до Професионалния Пакет. Персонализираното брандиране с нашето лого беше ключово за нашия професионален имидж.
    rating: 5
    product: Пакет Club Starter
    source: solutions/clubs
  - category: clubs
    name: Собственик на клуб
    title: Клуб за водни спортове
    location: Пукет, Тайланд
    content: Пакетът за Стартиращ Клуб беше перфектната входна точка. Докато бизнесът ни растеше, Paddle Board Overstock растеше заедно с нас — същото качество, същи цени, без изненади. Разширихме се от 10 до 80 дъски за 18 месеца.
    rating: 5
    product: Пакет за стартиращ клуб + Премиум пакет
    source: success-stories
  - category: resorts
    name: Главен управител на курорт
    title: 5-звезден плажен курорт
    location: Гърция
    content: Paddle Board Overstock не само достави дъски — те ни помогнаха да създадем пълноценно гостоприемно изживяване. Програмата ни за водни спортове премина от нула до основна атракция на курорта за един сезон. 300+ седмични резервации и $180K годишен приход.
    rating: 5
    product: Пакет Resort Premium
    source: success-stories
  - category: resorts
    name: Софи Лоран
    title: Директор по опита на гостите, Azure Bay Resorts
    location: Пукет, Тайланд
    content: Paddle Board Overstock проектира и оборудва цялата ни програма за плажни активности в три курортни обекта. 80 SUPs, 40 каяка, инфраструктура за безопасност и обучение на персонала — всичко доставено в една пратка. Участието на гостите се увеличи с 60% през първия сезон.
    rating: 5
    product: Пакет Resort Premium
    source: solutions/resorts
  - category: entrepreneurs
    name: Майкъл Парк
    title: Основател, Shoreline Paddle Co.
    location: Калифорния, САЩ
    content: Стартирах моя SUP бранд без никакъв опит в индустрията. Екипът на Paddle Board Overstock ме ръководи от избора на продукт до персонализирания дизайн на логото и опаковката. Първият ми контейнер пристигна за 11 седмици и изчерпах стоката за 3 месеца в Amazon.
    rating: 5
    product: Пускане на марка Starter
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Основател
    title: Австралийски SUP бранд
    location: Австралия
    content: Имах идеята за марката, но никакви познания за производството. Paddle Board Overstock буквално ме водеше през целия процес — от избора на правилния дизайн на дъската до разопаковането на първата ми пратка. 90 дни от мечтата до доставката.
    rating: 5
    product: Пакет Brand Launch
    source: success-stories
  - category: rental
    name: Даниел Оконкво
    title: Собственик, Lakeland SUP Rentals
    location: Онтарио, Канада
    content: Наемах 5 дъски от местен магазин и губех 60% от приходите си за тях. Paddle Board Overstock ми помогна да изградя собствен флот от 15 SUPs. Калькулаторът ROI показваше равновесие за 4 месеца — постигнах го за 3. Сега разширявам до 30 дъски.
    rating: 5
    product: Стартов комплект за флота
    source: solutions/rental-business
  - category: rental
    name: Марко Валенти
    title: Директор операции, Adriatic Adventure Tours
    location: Дубровник, Хърватия
    content: Оборудвахме целия ни наемен флот с Paddle Board Overstock RIBs — 12 лодки в три локации. След два сезона, нулеви повреди. Сертификатната документация CE направи одобрението на застраховката безпроблемно. Тяхният инженеринг екип дори персонализира цветовете на тръбите.
    rating: 5
    product: Комплект за разширяване на флота
    source: trust
  - category: rental
    name: Лейт. командер Андрес Рейес
    title: Офицер по морска снабдителна дейност, Филипинска брегова охрана
    location: Манила, Филипини
    content: Опериме 24 Paddle Board Overstock RIBs в нашия флот за крайбрежен патрул. Техният QC процес е последователен за всяка партида — същото качество на шева, същото разположение на вентилите, същият налягане всеки път. Тази повторяемост има значение, когато животи зависят от оборудването.
    rating: 5
    product: RIB флот патрули
    source: trust
  - category: consumers
    name: Сара К.
    title: Първокласен SUP собственик
    location: Лейк Тахо, САЩ
    content: Стабилна дори за напълно начинаещ. Извадих я на езерото в първия ден и никога не паднах. Пълният комплект с помпа и гребло означаваше, че бях на водата 20 минути след отваряне на кутията.
    rating: 5
    product: SUP Изследовател 11
  - category: consumers
    name: Джеймс Торнтън
    title: SUP Собственик на Explorer 11
    location: Ванкувър, Канада
    content: Като първи купувач, се притеснявах за качеството при поръчка от чужбина. Документацията ISO и докладите от независими тестове, които споделиха, още преди да попитам, ми дадоха пълно доверие. Бордът пристигна за 6 дни и надмина очакванията ми.
    rating: 5
    product: SUP Изследовател 11
    source: trust
  - category: consumers
    name: Майк Р.
    title: Рекреативен каякар
    location: Флорида, САЩ
    content: Солидно качество на изработката. Справя се със морски вълни много по-добре, отколкото очаквах от надуваем. Опаковах го в багажника на колата за уикенд пътуване — наду се на рампата за по-малко от 4 минути.
    rating: 5
    product: Надуваем каяк
