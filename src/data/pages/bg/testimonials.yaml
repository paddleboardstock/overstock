testimonials:
  - category: clubs
    name: Рикардо Сантос
    title: Собственик, Algarve Surf Academy
    location: Лагос, Португалия
    content: Започнахме с Пакета за Стартиращ Клуб за нашето училище по сърф. 20 дъски, гребла, жилетки — всичко пристигна в рамките на 3 седмици. След два сезона надградихме до Професионалния Пакет. Персонализираното брандиране с нашето лого беше ключово за нашия професионален имидж.
    rating: 5
    product: Пакет Club Starter
    source: solutions/clubs
  - category: clubs
    name: Собственик на клуб
    title: Клуб за водни спортове
    location: Пукет, Тайланд
    content: Пакетът за стартиране на клуб беше перфектната отправна точка. С растежа на нашия бизнес, Paddle Board Overstock растеше заедно с нас — същото качество, същите цени, без изненади. Скалирахме от 10 на 80 дъски за 18 месеца.
    rating: 5
    product: Пакет за стартиращ клуб + Премиум пакет
    source: success-stories
  - category: resorts
    name: Главен управител на курорт
    title: 5-звезден плажен курорт
    location: Гърция
    content: Paddle Board Overstock не просто доставяха дъски — те ни помогнаха да изградим цялостно изживяване за гостите. Програмата ни за водни спортове се превърна от нула в акцент на курорта за един сезон. 300+ седмични резервации и 180 000 долара годишен приход.
    rating: 5
    product: Пакет Resort Premium
    source: success-stories
  - category: resorts
    name: Софи Лоран
    title: Директор по опита на гостите, Azure Bay Resorts
    location: Пукет, Тайланд
    content: Paddle Board Overstock проектира и екипира цялата ни програма за плажни активности в три курортни обекта. 120 SUPs, инфраструктура за безопасност и обучение на персонала — всичко доставено в една пратка. Участието на гостите се увеличи с 60% през първия сезон.
    rating: 5
    product: Пакет Resort Premium
    source: solutions/resorts
  - category: rental
    name: Даниел Оконкво
    title: Собственик, Lakeland SUP Rentals
    location: Онтарио, Канада
    content: Наемах 5 дъски от местен магазин и губех 60% от приходите си за тях. Paddle Board Overstock ми помогна да изградя собствен флот от 15 SUPs. Калькулаторът ROI показваше равновесие за 4 месеца — стигнахме го за 3. Сега разширявам до 30 дъски.
    rating: 5
    product: Стартов комплект за флота
    source: solutions/rental-business
  - category: rental
    name: Марко Валенти
    title: Директор операции, Adriatic Adventure Tours
    location: Дубровник, Хърватия
    content: Ние оборудвахме целия си SUP флот от наеми с Paddle Board Overstock дъски — 30 дъски в три локации. Два сезона по-късно, нулеви повреди. Последователното качество във всяка партида направи избора ни лесен, а техният екип дори съчета цветовете с нашата марка.
    rating: 5
    product: Пакет за флотата от наеми
    source: trust
  - category: rental
    name: Елена Маркети
    title: Собственик, Lake Garda SUP Rentals
    location: Лаго ди Гарда, Италия
    content: Нашите дъски за наем излизат по пет пъти на ден през пиковия сезон. Откакто преминахме към Paddle Board Overstock, жалбите за повреди спаднаха почти до нула и клиентите непрекъснато питат къде могат да си купят собствена дъска.
    rating: 5
    product: Пакет за флотата от наеми
    source: solutions/rental-business
  - category: consumers
    name: Сара К.
    title: Първокласен SUP собственик
    location: Лейк Тахо, САЩ
    content: Стабилна дори за напълно начинаещ. Извадих я на езерото в първия ден и никога не паднах. Пълният комплект с помпа и гребло означаваше, че бях на водата 20 минути след отваряне на кутията.
    rating: 5
    product: SUP Изследовател 11
  - category: consumers
    name: Джеймс Торнтън
    title: SUP Собственик на Explorer 11
    location: Ванкувър, Канада
    content: Като първоизползващ клиент, бях нервен да поръчам от чужбина. Качеството на изработка говореше само за себе си моментално, щом разопаковах дъската — твърда, безупречни шевове, и пристигна само за 6 дни.
    rating: 5
    product: SUP Изследовател 11
    source: trust
  - category: consumers
    name: Майк Р.
    title: Уикенд Падълър
    location: Флорида, САЩ
    content: Солидно качество на изработката. Справя се със морски вълни много по-добре, отколкото очаквах от надуваем. Опаковах го в багажника на колата за уикенд пътуване — наду се на рампата за по-малко от 4 минути.
    rating: 5
    product: SUP Tropical Breeze
