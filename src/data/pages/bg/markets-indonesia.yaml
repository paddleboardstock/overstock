hero:
  tagline: Индонезия
  title: SUP Едрови платки за<br />Индонезийски бизнеси
  subtitle: Балийски магазини за водни спортове, островни курорти и оператори из целия архипелаг — чисто нови доски с излишък от 5 единици, смесени модели, доставени от Китай.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Излишни SUP бордове за индонезийски курорти и магазини за водни спортове в Бали
direct_answer: Paddle Board Overstock доставя чисто нови надуваеми SUP дъски с излишък на индонезийски бизнеси — магазини за водни спортове в Бали, островни курорти от Ломбок до Гилис и отвъд, плажни клубове и оператори за наем. Поръчките на едро започват от 5 дъски с комбинирани модели в една пратка, изпратени от Вейхай, Китай чрез експресен въздушен товар или консолидиран морски товар. Всяка дъска е 100% тествана под налягане и е покрита с 2-годишната SUP гаранция.
tldr_points:
  - Търговия на едро от 5 дъски — смесени модели, оценени според общото количество
  - Обслужване на водните спортове и островните курорти на Бали в цялата страна
  - Кратки товарни маршрути Китай–Индонезия, въздушни или морски
  - 100% тестван под налягане, 2-годишна SUP гаранция на всяка платка
overview_section:
  tagline: Обзор на пазара
  title: SUP Индонезийският пазар
  paragraphs:
    - Индонезия е една от големите икономики на водните спортове в Азия, а Бали е нейното биещо сърце. От плажните клубове Семиняк и Чангу до спокойните лагуни Санур и Нуса Дуа, гребните дъски се появяват навсякъде — гребане на изгрев над рифове, SUP йога уроци, обиколки на лагуни и програми за гости в хотели. Отвъд Бали, Ломбок, островите Гили и развиващите се туристически сцени в архипелага следват същия модел.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: UV Издръжливостта, производителността и ремонтируемостта са по-важни от блясъка на каталога. Поръчките са от 5–20 дъски, смесени за уроци, наеми и изложба в магазини.
  customer_types:
    - title: Магазини за водни спортове в Бали
      description: Установени оператори на Sanur, Seminyak и Canggu, SUP добавяйки към линиите за сърф, гмуркане и шнорхел.
    - title: Островни курорти и плажни клубове
      description: Курорти и плажни клубове в Бали, Ломбок и Гилис организират гостуващи гребни и SUP йога програми.
    - title: Туроператори и оператори за наем
      description: Оператори на турове по лагуни и мангрови гори, както и почасови сергии за наем, които сезонно обновяват флота.
shipping_section:
  title: Кораб до Индонезия
  paragraphs:
    - Индонезия е един от най-късите товарни линии от нашата база във Вейхай, Китай. Експресният въздушен товар превозва мостри и 1–3 бордови поръчки бързо до Денпасар и Джакарта; консолидирани морски товари обслужват 5–20 поръчки на едро за бордове през Танджунг Приок, Танджунг Беноа и други пристанища. И двете опции са посочени с приблизително време за транзит до вашата дестинация.
    - Ние предоставяме търговската фактура и листата за опаковане, необходими за одобрение, с коректни HS кодове и декларирани стойности. Вносните такси и данъци се плащат от вносителя според индонезийските правила.
  customs_note: Индонезийското разрешение за спортно оборудване е чувствително към документите — работете с вашия митнически брокер (PPJK), за да потвърдите текущото данъчно и митно третиране. Ние предоставяме пълна, последователна документация и отговаряме бързо на заявки от брокери.
faq_section:
  title: Често задавани въпроси за Индонезия
  items:
    - q: Колко бърз е товарният товар от Китай до Бали?
      a: Индонезия е една от най-близките ни дестинации за товарни превози от Вейхай. Експресният въздушен транспорт до Денпасар или Джакарта е най-бързият вариант за мостри и малки поръчки; консолидирани морски товари се оферта с транзитен прозорец за поръчки на едро. И двете са изброени в вашата оферта.
    - q: Подходящи ли са дъските за ежедневна употреба под наем в UV тропическите райони?
      a: Да — drop-stitch PVC строителните системи са предназначени за ежедневни наеми, които доставяме на автопаркове в 50+ държави. Стандартната грижа (изплакване след солена вода, съхранение в сенка) ги поддържа в експлоатация през много сезони на слънцето на Бали.
    - q: Как изглежда поръчката на магазин за водни спортове?
      a: Обикновено 5–15 дъски, смесени между стабилни универсални модели за уроци и наеми и няколко премиум арт издания за търговски дисплей — една пратка, ценообразуване според общото количество.
    - q: Можете ли да подкрепите нашия PPJK с документация?
      a: Да. Всяка поръчка се изпраща с търговска фактура и опаковъчен лист с правилни HS кодове и декларирани стойности, и ние отговаряме бързо, когато вашият брокер се нуждае от допълнителни документи.
