content_customization:
  tagline: Какво може да се персонализира
  title: RIB Персонализиране<br />Опции
  subtitle: Всеки елемент на RIB лодката може да бъде адаптиран според вашето приложение, пазар и изисквания на марката.
  items:
    - title: Корпус и конструкция
      description: Дължина на корпуса (2,5–8,5 м), материал на корпуса (GRP фибростъкло или морски алуминий), цвят на корпуса (гелкоут или боядисан), профил на кила (дълбок V, умерен V, плосък), тип транец (затворен транец с скоба или кладенец) и структурно укрепване за търговски товарни нужди.
      icon: tabler:sailboat
    - title: Тръба и нашийник
      description: Материал на тръбата (0.9–1.2 PVC mm или 1.4–1.7 HypalonmmCSM/), диаметър на тръбата (40–55 cm), брой камери (3–7), тип клапан (Halkey-Roberts, Leafield D7 или Boston), цвят на тръбата (стандартен или персонализиран) и конфигурация на яка/конус/конус.
      icon: tabler:circle
    - title: Оформление на палубата и конзолата
      description: Централна конзола, странична конзола или кормилно управление. Разположение на седалките (седалки за жокей, пейки, болстър седалки). Покритие на палубата (EVAвид на пяна тиково дърво, нехлъзгаща боя или голо GRP). Точки за монтаж на оборудването, релси за захват и позиции на D-пръстен.
      icon: tabler:layout-dashboard
    - title: Електротехника и навигация
      description: Навигационни светлини (LED), система за помпа за трюма, управление на батерията, инсталация на VHF радио, монтаж на GPS/картплотер, USB портове за зареждане и конфигурация на панела за превключватели.
      icon: tabler:bolt
    - title: Брандиране и графика
      description: Графика с корпус и тръби (ситопечат, топлотрансфер, UV дигитален печат), разположение на логото, персонализирани цветови схеми, идентификационни маркировки и персонализирана документация за собственика с вашата марка.
      icon: tabler:palette
    - title: Безопасност и съответствие
      description: Оценка на проектната категория (A/B/C/D на RCDпример), система за пожарогасене, спецификация на горивната система (преносим резервоар, фиксиран резервоар, подпалуба) и пакет документация за съответствие за вашия целеви пазар.
      icon: tabler:shield
content_applications:
  tagline: Конфигурации на приложения
  title: RIB Конфигурации<br />По приложение
  subtitle: Различните мисии изискват различни конфигурации. Ето доказани конфигурации за най-често RIB срещаните приложения.
  items:
    - title: Спасяване и патрул
      description: Корпус с дълбока V-форма, Hypalon тръби, самоизпускаща се палуба, опорни седалки, дръжки за захват, навигационни светлини и здрави D-пръстени.RCD Дизайн категория B или C. Огнеупорна горивна система и търговски електрически двигатели.
      icon: tabler:lifebuoy
    - title: Гмуркаческа поддръжка
      description: Широка ширина, задна стълба за качване, позиции за багажника на резервоара, допълнителни D-пръстени, монтаж за гмуркане на флаг, подсилен транец за двойни извънбордови кораби и неплъзгащо покритие на цялата палуба EVA .
      icon: tabler:mask
    - title: Туризъм и търговия
      description: Сертифицирана за пътници конфигурация с пейки, слънчеви завеси/бимини, релси, сухо съхранение и двойна батерийна система.RCD Категория C. Проектирана за операции с курорти и чартърни влакове.
      icon: tabler:beach
    - title: Риболов
      description: Разположение на отворената палуба, позиции на държачите на въдицата, гнездо за жива стръв, монтаж за ловец на риба, монтаж за тролинг мотор, подсилен транец и преносима горивна система. Опции за централна или странична конзола.
      icon: tabler:fish
    - title: Кораб за отдих и яхтен тендер
      description: Лек корпус, PVC тръби, удобни седалки, телескопичен кормил или компактна конзола, повдигащи точки за кавит и подвижен резервоар за гориво.RCD Категория C или D.
      icon: tabler:sailboat
    - title: Професионална работна лодка
      description: Опция за алуминиевия корпус, здрава армировка, хидравлично управление, търговски електрически инсталации, радарна арка и точки за интеграция на оборудване, специфични за мисията. Персонализирано съответствие за всеки проект.
      icon: tabler:anchor
process_steps:
  title: 7-стъпков RIB OEM/ODM Процес на разработка
  subtitle: От кратко описание на проекта до следпродажбено време — дефиниран работен процес с ясни етапи и резултати
  steps:
    - number: '01'
      title: Кратко описание и изисквания на проекта
      description: Дефинирайте целевото приложение, размер на корпуса, материал на тръбите, изисквания за съответствие и нужди от брандиране. Оценяваме осъществимостта и потвърждаваме модела за сътрудничество (OEM/ODM/Semi-Custom/Full Custom).
      timeline: 3–5 дни
    - number: '02'
      title: Технически преглед и осъществимост
      description: Инженерният екип преглежда структурната осъществимост, изчисленията за стабилност и плаваемост, пътя на съответствие и наличността на материалите. Идентифицираме съществуващи форми или изисквания за персонализирани форми.
      timeline: 5–7 дни
    - number: '03'
      title: Предложение и оферта
      description: Получи подробно предложение, включващо спецификации, 3D визуализации или GA чертежи, обхват на съответствието, времева рамка и ценообразуване на единиците според обемните нива и MOQ.
      timeline: 5–7 дни
    - number: '04'
      title: Потвърждение на дизайна и вземане на проби
      description: Одобрете окончателната GA, разположението на палубата и конфигурацията на тръбите. Произвеждаме предпроизводствен образец с цветовете на вашата марка, лого и определени материали за вашия физически преглед.
      timeline: 15–20 дни
    - number: '05'
      title: Одобрение на проби и протокол за контрол на качеството
      description: 'Инспектирайте и одобрете пробата. Дефинирайте производствения протокол за контрол на качеството: тест на налягане (1.25x / 24–48h), проверки на размерите и контролен списък за документация за съответствие за всеки корпус.'
      timeline: 3–5 дни
    - number: '06'
      title: Масово производство и контрол на качеството
      description: Пълен производствен цикъл с 100-точков контролен списък за контрол на контрол на единица. Инспекции в процеса, тестване под налягане и серийно проследяване. CE/ISO документация се подготвя паралелно.
      timeline: 30–45 дни
    - number: '07'
      title: Опаковане, изпращане и следпродажба
      description: Персонализирани опаковки (стандартни, готови за търговия на дребно или палетирани), износна документация, товарене на контейнери и логистика. Включени са комплекти резервни части и документация за поддръжка.
      timeline: 7–14 дни
certifications:
  title: Съответствие и сертификации за RIB лодки
  subtitle: Всяка RIB персонализирана поръчка идва с документация за съответствие, специфично за модела
  items:
    - name: CE 2013/53/ЕС
      description: RCD съответствие по модел и дизайн категория — DoC, строителна табела, включено ръководство за собственик
      badge: CE
    - name: ISO 9001:2015
      description: Сертифицирана система за управление на качеството, SGS обхващаща дизайн, производство и дистрибуция
      badge: ISO
    - name: ISO EN 6185
      description: Стандарт за конструкция на надуваема лодка — стабилност, плавучест и възстановяване при падане за борда
      badge: 6185
    - name: EN ISO 14945
      description: Стандарт за табелка на производителя — трайно маркирана идентификация и информация за капацитета
      badge: 14945
    - name: BSCI
      description: Одит за социална отговорност за етично производство — изискван от търговци на дребно в ЕС
      badge: BSCI
    - name: REACH
      description: Съответствие с химическа безопасност на ЕС за PVC, Hypalon, лепила и покрития
      badge: REACH
content_service_modules:
  tagline: Сервизни модули
  title: OEM/ODM Услуга<br />Модули
  subtitle: Всеки проект комбинира правилните сервизни модули. Не всеки проект се нуждае от всеки модул — определяме само това, което вашият проект изисква.
  items:
    - title: Инженерен преглед и осъществимост
      description: 'Оценка на платформата на корпуса, проверка на структурната осъществимост, проверка на стабилността и плавучестта, идентифициране на пътя за съответствие и потвърждение на наличността на материалите. Резултат: доклад за осъществимост с препоръка за продължаване/непродължаване.'
      icon: tabler:math-function
    - title: Проектиране и конфигурация
      description: 'Чертеж GA, оформление на палубата, конфигурация на тръбите, позиции на конзолата и седалки, план за монтаж на оборудване и избор на цветове/материали. Резултат: одобрен GA и спецификация на конфигурацията.'
      icon: tabler:ruler
    - title: Прототип и образец
      description: Предпроизводствен образец с одобрени цветове, лого и посочени материали за физическа проверка. Включва протокол за одобрение на образци, контролен списък за инспекция и процес за заявка за промяна.
      icon: tabler:3d-cube-sphere
    - title: Производство и контрол на качеството
      description: Масово производство с контролен списък от 100 точки за всяка единица, инспекции в процеса на производство, тестове под налягане (1.25x / 24-48ч) и проследимост на серийно ниво. CE/ISO документация се подготвя паралелно.
      icon: tabler:clipboard-check
    - title: Маркиране и опаковане
      description: Прилагане на частно лого, персонализирана графика на корпуса и тръбите, документи за собственика с марка, опаковка готова за търговия на дребно или под палети и подготовка на комплект резервни части.
      icon: tabler:palette
    - title: Експорт и документация
      description: Опаковане за износ, план за зареждане на контейнера, FOB/CIF/DDP документация, документи за съответствие според пазара на дестинация и протокол за комуникация след доставка.
      icon: tabler:world
content_risk_control:
  tagline: Контрол на риска и доставката
  title: Рискове по проекта &<br />Управление на доставките
  subtitle: ПрофесионалнитеOEM/ODM купувачи се интересуват от контрол на риска също толкова, колкото и от качеството на продукта. Ето как го управляваме.
  items:
    - title: Определяне на обхвата и собствеността
      description: 'Преди започване на разработката определяме писмено: обхват на персонализацията, изисквания за инструменти, критерии за одобрение на образци, собственост върху чертежи и матрици и отговорности по документацията. Няма неясноти относно това кой притежава какво.'
      icon: tabler:file-text
    - title: Процес за контрол на промените
      description: Всички промени в спецификациите след потвърждение на дизайна следват документиран процес за заявка за промяна с оценка на въздействието (разходи, срок, съответствие). Никакви неразрешени модификации не постъпват в производството.
      icon: tabler:arrows-diff
    - title: Гаранция за партидна консистентност
      description: 50-тата единица съвпада с първата одобрена проба. Одобрените спецификации се замразяват, параметрите на материала и процеса се заключват, а контролните точки в процеса проверяват последователността през целия производствен цикъл.
      icon: tabler:repeat
    - title: Прозрачност на доставката и капацитета
      description: Сроковете за изпълнение се посочват въз основа на реалния производствен капацитет, нивата на материални запаси и текущото натоварване на поръчки — не на амбициозни цели. График на производството с дати на етапите, предоставени за всяка поръчка.
      icon: tabler:calendar-stats
faq:
  title: RIB OEM/ODM — Често задавани въпроси
  questions:
    - q: Каква е разликата между OEM и ODM за RIB лодки?
      a: 'OEM (Производство на оригинално оборудване): предоставяте подробни спецификации и ние изграждаме вашия дизайн.ODM (Оригинално производство на дизайн): избирате доказана Aquafarer RIB платформа и ние я персонализираме с желаните от вас характеристики и брандиране.ODM е по-бърза и по-евтина;OEM предлага максимален контрол върху дизайна.'
    - q: Мога ли да персонализирам RIB формата и размера на корпуса?
      a: Да. Предлагаме полу-персонализирани модификации на съществуващи корпусни калъпи (различни разположения на палубата, конфигурациите на тръбите) и пълно персонализирано разработване на корпуса с нови CNCмашинно обработени форми. Полу-персонализираните проекти могат да започнат с 2-5 броя; пълният персонализиран обикновено изисква по-високи ангажименти.
    - q: Какви материали за тръби са налични за RIBsперсонализиране?
      a: Предлагаме 0.9-1.2 PVC mm за развлекателна и лека търговска употреба, както и 1.4-1.7 HypalonmmCSM / за професионални, спасителни и търговски приложения, изискващи превъзходна UV устойчивост и озонова устойчивост (10-15 години живот срещу 5-8 години PVCза ).
    - q: Можеш ли да RIBs конфигурираш за конкретни приложения като спасяване, гмуркане или риболов?
      a: Да. Поддържаме доказани конфигурационни шаблони за спасяване/патрулиране, гмуркане, туризъм/чартър, риболов, услуги за яхтени лодки и професионални работни лодки. Всеки шаблон включва препоръчителен тип корпус, материал на тръбите, разположение на палубата и оборудване — които след това персонализираме според вашите точни изисквания.
    - q: Каква информация ви е нужна за RIB OEM/ODM оферта?
      a: Целево приложение, желана дължина на корпуса, предпочитание към материал на тръбите (PVCилиHypalon), приблизително количество и график на доставка, изисквания за съответствие с целевия пазар и всякакви референтни продукти или спецификации. Колкото повече подробности предоставите, толкова по-бърза и по-точна нашата оферта е.
    - q: Какво MOQ е за RIB персонализираните лодки?
      a: За съществуващи форми за корпуса със стандартни модификации, MOQ започва от 2-5 единици на дизайн. За персонализирани форми и пълна индивидуална разработка MOQ зависи от сложността на проекта — обикновено 10-20 единици за полу-персонализирани и 30+ за пълен персонализиран дизайн с нови инструменти.
    - q: Кой притежава персонализираните форми и чертежи?
      a: Формите, разработени с Aquafarer базови дизайни Aquafarer , остават собственост. Напълно персонализирани форми, поръчани и платени от клиента, могат да бъдат възложени на собствеността на клиента според договорните условия. Всички условия за собственост на калъпа се документират преди започване на проекта.
    - q: Как се опаковат по поръчка RIBs за износ?
      a: 'Стандартно: персонализирано + стреч фолио за товарене на контейнери. Премиум: готова за търговска опаковка, вакуумна опаковка или палетизирана. Предлагаме FOB Qingdao CIFи DDP доставка. Включени са пълна износна документация и митнически одобрение.'
