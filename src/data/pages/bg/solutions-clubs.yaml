hero:
  tagline: Клубове по водни спортове
  title: Екипировка и решения<br />За клубове по падъл и тренировъчни центрове
  subtitle: Пълни пакети с екипировка, инструкторско оборудване, брандиране и поддръжка за SUP клубове, каяк клубове, училища за сърф и тренировъчни центрове за водни спортове от всякакъв размер.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP дъски за клубове за водни спортове и наемни флотове
direct_answer: Aquafarer предоставя пълни решения за оборудване за клубове и тренировъчни центрове по водни спортове по целия свят. Нашите клубни пакети включват SUP дъски, каяци, весла, помпи, комплекти за ремонт и защитно оборудване на конкурентни едрови цени с ниско MOQs. Всеки пакет може да бъде персонализиран с лога на клуба, брандирани цветове и индивидуално опаковане. Ние също така предоставяме обучение за поддръжка, поддръжка на резервни части и програми за ротация на оборудването с цел да се удължи животът на вашия флот.
