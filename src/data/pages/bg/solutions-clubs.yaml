testimonial:
  content: Започнахме с Club Starter Package за нашето училище по сърф в Португалия. 20 борда, гребла, жилетки — всичко пристигна за 3 седмици. След два сезона преминахме към Pro Package. Персонализираното брандиране с нашето лого беше решаващ фактор за професионалния ни имидж.
  name: Рикардо Сантос
  title: Собственик, Algarve Surf Academy — Лагос, Португалия
content_segments:
  tagline: Профили на клубове
  title: Решения за клубове по водни спортове<br />По вид клуб
  subtitle: От университетски гребни клубове до ексклузивни частни яхт клубове — всеки тип клуб има уникални нужди от оборудване, модели на използване и бюджетни структури. Ние съобразяваме всеки пакет с модела на клуба.
  items:
    - title: Университетски и колежански гребни клубове
      subtitle: Флотилии с интензивно използване от студенти
      description: Клубове, управлявани от студенти или подкрепяни от институции, предлагащи SUP и каяк програми за университетските отдели по отдих. Оборудването се използва често и се сменя бързо в рамките на различни нива на умения всяко семестър. Издръжливостта и лесната поправка са критични, заедно с бюджетни цени за студентски организации.
      features:
        - Изключително издръжлива PVC конструкция, предназначена за студентски цикли
        - Бордове с различни цветове според нивото на умения за лесно управление на флота
        - Комплект за ремонт + с видеоподдръжка при всяка поръчка
        - Отстъпки за студентски организации и условия на плащане, базирани на семестър
    - title: Обществено-ориентирани и социални гребни клубове
      subtitle: Клубове за отдих, основани на членство
      description: Обществени клубове, предлагащи SUP, каяк и социално гребане за членовете. Оборудването трябва да балансира производителността и комфорта за широк диапазон възрасти, с брандинг, който насърчава идентичността на клуба и гордостта на членовете. Ефективността на съхранение е ключова за клубове с ограничен достъп до водата.
      features:
        - 'Смесен флот: универсални SUPs, туристически бордове и развлекателни каяци'
        - 'Пълно брандиране на клуба: персонализирани цветове, печат на лого, брандирани PFD (спасителни жилетки)'
        - Компактни решения за съхранение на надуваемо оборудване
        - 'Стартов комплект за растеж на членството: карти за препоръки, брандирани фотографии'
    - title: Сърф училища и академии по сърф каяк
      subtitle: Крайбрежна ефективност и обучение
      description: Училища, фокусирани върху сърф, които преподават SUP сърф, сърф каяк и умения за яздене на вълни. Екипировката трябва да функционира при сърф условия — маневрена, отзивчива и достатъчно издръжлива, за да устои на многократни падания, износване от пясък и излагане на солена вода без бързо разрушаване.
      features:
        - Къси, широки SUP форми, оптимизирани за маневриране на сърф
        - Подсилена конструкция на релсата за устойчивост при въздействие във вълни
        - 'Сърф-специфична защитна екипировка: спираловидни каишки, опции със меки перки'
        - Програма за подмяна на флота с сезонни отстъпки при замяна
    - title: Корпоративни и частни яхт клубове
      subtitle: Премиум преживявания за членове
      description: Ексклузивни частни клубове, предлагащи водни спортове като премиум удобство за своите членове. Стандартите за екипировка са високи — естетика, съответствие с бранда и готовност за гостите са също толкова важни, колкото и производителността. Очакванията за обслужване включват доставка с бяло ръкавици, персонализирани решения за съхранение и подпомагане на ниво консиерж.
      features:
        - Премиум дъски с дървена текстура EVA и метални акценти
        - Персонализирано съвпадение на цветовете с правилата на бранда на клуба
        - 'Доставка с консиерж: предварително надути, подредени и етикетирани за всеки сезон'
        - Посветено управление на акаунт с приоритетен SLA отговор
