hero:
  tagline: За
  title: За {SITE}
  subtitle: Вертикално интегриран производител на водни спортове — от суровини до готова лодка
intro:
  - 'Aquafarer основана е през 2012 г. с една мисия: проектиране и производство на оборудване за водни спортове, което се представя толкова добре на вода, колкото и в доклада за качество. Това, което започна като специализирана SUP работилница за дъски, се превърна в интегрирано производствено съоръжение с площ 12 000 квадратни метра в Икономическата зона на Циндао, произвеждащо надуваеми RIBsлодки, каяци, SUP дъски, защитно оборудване и аксесоари за клиенти в 50+ държави.'
  - Днес Aquafarer работи като фабрична марка — проектираме, проектираме, прототипираме, произвеждаме и тестваме всичко под един покрив. Тази вертикална интеграция ни дава пряк контрол върху избора на материали, качеството на изработката и сроковете за доставка. Всяка лодка се изгражда от нашите хора, на нашето оборудване, според нашите стандарти.
  - Обслужваме развлекателни потребители, търговски оператори, държавни агенции и бранд партньори по целия свят. Нашите OEM програми ODM и програми помагат на бизнесите да стартират собствени продуктови линии без да инвестират във фабрична инфраструктура. Независимо дали ви е необходим един прототип или пълен производствен цикъл, нашият екип ви води от концепцията до доставката, готова за море.
