factory_details:
  - label: Размер на съоръжението
    value: Интегриран кампус с площ 12 000 m² (130 000 ft²) в Икономическата зона на Циндао
  - label: Годишен капацитет
    value: 15 000 лодки, включително SUPsкаяци, RIBsдингита и оборудване за безопасност
  - label: Екип за научноизследователска и развойна дейност
    value: 25+ инженери в областта на продуктовия дизайн, материалознанието и качественото инженерство
  - label: Ключово оборудване
    value: CNC маси за рязане, RF диелектрични заварчици, уплътняващи устройства с горещ въздух, дигитални принтери, фибростъклени форми, тестови установки за задържане на въздух
  - label: Производствени линии
    value: '6 специализирани линии: PVC рязане, заваряване на тръби, подреждане на корпуса от фибростъкло, SUP сглобяване, RIB сглобяване, финален контрол на качеството'
  - label: Годишен износен обем
    value: 8 милиона щатски+ долара са изнесени в 50+ държави в Европа, Америка, Азиатско-тихоокеанския регион и Близкия изток
