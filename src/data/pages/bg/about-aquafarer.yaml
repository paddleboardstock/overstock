values:
  - title: Качество на първо място
    desc: Всеки кораб, който излиза от нашата фабрика, преминава задължителни тестове за въздушна пропускливост, разлепване на шева и системи преди изпращането.
  - title: Вертикална интеграция
    desc: Контролираме всеки етап — от рязане на PVC до финално сглобяване — елиминирайки неефективността на изпълнителите и осигурявайки постоянно качество.
  - title: Безопасността като стандарт
    desc: Сертификацията CE е в основата на всичко, което произвеждаме. Нашите 64 модела с CE сертификат отговарят на стандартите за безопасност на ЕС за развлекателна и търговска употреба.
  - title: Партньорски ориентирани
    desc: Изграждаме дългосрочни отношения с OEM, ODM и партньори за частни марки чрез прозрачност, надеждност и общ растеж.
services:
  - title: Производство по OEM
    desc: Произвеждаме според вашите спецификации. Споделете вашите чертежи, а нашият инженеринг екип се грижи за прототипирането, инструментите и производството.
  - title: ODM Решения
    desc: Започнете от нашите доказани платформи. Персонализирайте размер, цвят, графики и опаковка, за да създадете своя уникална продуктова линия.
  - title: Частна Марка
    desc: Вашето име на марката, вашето лого, вашата опаковка. Продуктите пристигат готови за продажба с пълна интеграция на марката.
  - title: Персонализирано брандиране
    desc: Печат на палубни подложки, графики по корпуса, стикери за тръбите и персонализирани етикети — постоянна идентичност на марката на всяка повърхност.
certifications:
  - name: Сертификация CE
    desc: Нашите лодки и водни съдове отговарят на Директива за развлекателни плавателни съдове на ЕС (2013/53/EU) и съответните хармонизирани стандарти.
    scope: Лодки и водни съдове
  - name: null
    desc: Сертифицирана система за управление на качеството за проектиране, производство и разпространение на надуваеми водни съдове.
    scope: Цялото съоръжение
  - name: null
    desc: Надуваеми лодки — изисквания за безопасност и производителност за укрепени и твърдокорпусни надуваеми лодки.
    scope: RIB и надуваеми линии
