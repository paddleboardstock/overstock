hero:
  tagline: Знания за изследване на водата
  title: Научете
  subtitle: |
    Ръководства, уроци и задълбочени анализи — всичко, от което се нуждаете, за да изследвате<br />
    плувайте с увереност. От избора на вашия първи SUP до овладяването на напреднали техники.
  taglineSection: Знания за всеки воден спортсмен. От начинаещи до професионалисти.
featured:
  tagline: Избрани теми
  title: Започнете своето учебно пътуване
  subtitle: Независимо дали сте нови във водните спортове или искате да подобрите уменията си, нашите ръководства са тук за вас.
  items:
    - title: SUP Основи
      description: Всичко, което един начинаещ трябва да знае — видове дъски, размер на греблото, стойка и съвети за първия ден.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Надуваема срещу твърда дъска
      description: Коя е подходяща за вас? Сравняваме преносимост, производителност, издръжливост и цена една до друга.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Водна безопасност
      description: Основни знания за безопасност, които всеки воден спортсмен трябва да има — метеорологични условия, спасителни жилетки, самоспасяване и още.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Ръководство за материали
      description: PVC срещу Hypalon, drop-stitch технология, рейтинг на дение — разберете от какво е изработено оборудването ви.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Ръководство за размери
      description: Намерете правилната дължина, ширина и обем на дъската за вашето тегло, умения и стил на гребане.
      icon: tabler:ruler
      href: /size-guide
    - title: Междинни техники
      description: Усъвършенствайте гребането си с напреднали удари, техники за завиване и управление в бурни води.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
