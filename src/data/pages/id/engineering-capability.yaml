content_capability:
  tagline: Kemampuan Rekayasa
  title: Apa Rekayasa Kami<br />Tim Mengirim
  subtitle: Rekayasa Paddle Board Overstock mencakup seluruh siklus hidup produk — dari riset pasar dan desain konsep hingga pembuatan prototipe, pengujian, dan produksi massal.
  items:
    - title: Desain Industri
      description: Tim desain industri kami bekerja dari kebutuhan pelanggan, riset pasar, dan analisis kompetitif untuk mengembangkan konsep produk yang menyeimbangkan estetika, fungsionalitas, dan kemampuan manufaktur. Kami menghasilkan sketsa 2D, rendering 3D, dan dokumen spesifikasi untuk tinjauan klien sebelum melakukan pembuatan alat.
      features:
        - Pengembangan konsep dan studi kelayakan
        - Gambar desain 2D dan rendering 3D
        - Pemilihan dan spesifikasi material
        - Analisis desain untuk manufaktur (DFM)
        - Evaluasi ergonomi dan keselamatan
    - title: Teknik Struktur
      description: Insinyur struktural kami berspesialisasi dalam arsitektur perahu karet — desain lambung, konfigurasi ruang tabung, drop-stitch rekayasa inti, dan distribusi beban. Setiap desain dianalisis untuk integritas struktural, optimisasi berat, dan kepatuhan terhadap standar terkait (CE, ISO, AS).
      features:
        - Desain lambung fiberglass Deep-V dengan sudut deadrise yang dihitung
        - Konfigurasi tabung multi-ruang untuk keselamatan dan daya apung
        - spesifikasi inti Drop-stitch dan optimisasi kepadatan
        - Analisis elemen hingga untuk komponen penahan beban
        - Perhitungan distribusi berat dan stabilitas
    - title: Pemodelan 3D & CAD
      description: Semua desain produk dikembangkan dalam CAD 3D sebelum pembuatan prototipe dimulai. Insinyur kami menggunakan SolidWorks dan Rhino 3D untuk pemodelan produk, memungkinkan klien meninjau setiap detail — dari profil tabung hingga tata letak konsol — sebelum memutuskan untuk produksi.
      features:
        - Pemodelan CAD 3D penuh di SolidWorks dan Rhino 3D
        - Render fotorealistik untuk presentasi klien
        - Paket gambar teknik untuk produksi
        - Desain cetakan dan peralatan dari model 3D
        - Transfer data langsung CAD-ke-CNC untuk pemotongan presisi
    - title: Pembuatan Prototipe & Pengujian
      description: Sebelum produksi massal, setiap produk baru melewati tahap prototipe. Kami membuat prototipe fungsional untuk evaluasi klien, kemudian mengujinya sesuai dengan protokol pengujian penuh kami — pengujian tekanan, pengujian stabilitas, pengujian beban, dan uji air. Iterasi desain pada tahap prototipe dilakukan dengan cepat dan biaya yang efektif.
      features:
        - Alat prototipe cepat (waktu pengerjaan 15-20 hari)
        - Prototipe fungsional untuk evaluasi di dunia nyata
        - Protokol pengujian lengkap sebelum persetujuan produksi
        - Penyempurnaan desain secara iteratif berdasarkan hasil pengujian
        - Tonggak persetujuan klien sebelum peralatan produksi
    - title: Integrasi Aksesori Kustom
      description: Banyak proyek OEM memerlukan integrasi aksesoris yang disediakan klien atau pihak ketiga — konsol khusus, tempat duduk khusus, sistem elektronik, dudukan peralatan selam, atau elemen merek. Tim teknik kami menangani desain integrasi, adaptasi struktural, dan validasi kualitas dari semua aksesoris.
      features:
        - Desain konsol dan tata letak panel instrumen
        - Integrasi kursi dan pelapis khusus
        - Desain dan pemasangan sistem elektronik
        - Sistem pemasangan peralatan menyelam dan penyelamatan
        - Spesifikasi merek dan aplikasi grafis
content_process:
  tagline: Proses Pengembangan
  title: Dari Konsep<br />ke Produksi
  subtitle: Proses pengembangan produk kami mengikuti alur kerja 6 tahap yang terstruktur yang dirancang untuk meminimalkan risiko, mempercepat waktu, dan memastikan kesiapan manufaktur sejak hari pertama.
  stages:
    - stage: '01'
      title: Persyaratan & Penelitian
      duration: 1-2 minggu
      description: Kami bekerja sama dengan klien untuk menentukan spesifikasi produk, persyaratan pasar target, kebutuhan kepatuhan regulasi, dan tujuan komersial. Tahap ini menghasilkan Dokumen Persyaratan Produk (PRD) yang memandu semua pekerjaan selanjutnya.
      deliverables: PRD, analisis pasar, tolok ukur kompetitif, estimasi biaya awal
    - stage: '02'
      title: Desain Konsep
      duration: 2-3 minggu
      description: Tim desain industri mengembangkan konsep produk berdasarkan PRD. Beberapa opsi desain disajikan dengan rendering 3D, rekomendasi material, dan penilaian teknik awal. Klien memilih arah untuk pengembangan detail.
      deliverables: Rendering konsep 3D, spesifikasi material, alasan desain, BOM awal
    - stage: '03'
      title: Rekayasa Terperinci
      duration: 2-4 minggu
      description: Konsep yang dipilih telah direkayasa sepenuhnya — pemodelan CAD 3D, analisis struktur, konfigurasi tabung, desain lambung, integrasi aksesori, dan dokumentasi produksi. Semua dimensi, material, dan proses ditentukan untuk peralatan.
      deliverables: Model CAD 3D lengkap, gambar teknik, BOM final, spesifikasi alat, rencana QC
    - stage: '04'
      title: Pembuatan prototipe
      duration: 2-3 minggu
      description: Alat prototipe diproduksi dan sampel fungsional dibuat. Klien meninjau prototipe terhadap spesifikasi PRD. Pengujian dilakukan sesuai protokol yang disepakati. Penyesuaian desain dilakukan berdasarkan umpan balik sebelum pembuatan alat produksi.
      deliverables: Prototipe fungsional, laporan uji, catatan revisi desain, dokumen persetujuan klien
    - stage: '05'
      title: Peralatan Produksi
      duration: 2-3 minggu
      description: Setelah prototipe disetujui, peralatan produksi dikembangkan — cetakan, jig pengelasan, program pemotongan, perlengkapan perakitan. Dokumentasi QC dan kriteria inspeksi diselesaikan. Uji coba dilakukan untuk validasi proses.
      deliverables: Peralatan produksi, dokumentasi proses, rencana inspeksi QC, laporan uji coba
    - stage: '06'
      title: Produksi Massal & QC
      duration: Berlaku secara Berkelanjutan
      description: Produksi penuh dimulai dengan QC dalam proses di setiap tahap. Artikel pertama diperiksa dan disetujui sebelum pelepasan batch. Pemantauan kualitas yang berkelanjutan, pelacakan cacat, dan perbaikan terus-menerus sepanjang siklus produksi.
      deliverables: Jadwal produksi, laporan QC, catatan keterlacakan batch, dokumentasi pengiriman
content_customization:
  tagline: Opsi Kustomisasi
  title: Apa yang Bisa Terjadi<br />Disesuaikan
  subtitle: Hampir setiap aspek produk kami dapat disesuaikan untuk memenuhi kebutuhan klien. Berikut adalah kategori kustomisasi yang paling umum.
  columns: 3
  items:
    - title: Lambung & Struktur
      description: Panjang lambung kustom, lebar balok, sudut kemiringan, diameter tabung, konfigurasi ruang, dan tingkat material.
      icon: tabler:sailboat
    - title: Warna & Grafis
      description: Warna tabung (PVC/Hypalon), warna gelcoat lambung, warna konsol, grafik dek, penempatan logo, dan desain kemasan.
      icon: tabler:palette
    - title: Konsol & Kontrol
      description: Konsol tengah, konsol samping, atau kemudi tipe tiller. Tata letak panel instrumen khusus, penempatan saklar, dan posisi kemudi.
      icon: tabler:steering-wheel
    - title: Tempat Duduk & Pelapis
      description: Kursi joki, tempat duduk bangku, pelapis mewah, jahitan yang sesuai warna, konfigurasi lipat atau dapat dilepas.
      icon: tabler:armchair
    - title: Aksesori & Peralatan
      description: Tangga selam, rak tangki, tiang tarik, T-top, atap Bimini, sistem suara, elektronik navigasi, dan peralatan keselamatan.
      icon: tabler:backpack
    - title: Pengemasan & Branding
      description: Kemasan ritel kustom, kotak merek pribadi, karton pengiriman dengan tanda merek, label gantung, dan manual pengguna dalam bahasa klien.
      icon: tabler:box
content_industries:
  tagline: Aplikasi Industri
  title: Solusi Rekayasa<br />berdasarkan Industri
  subtitle: Tim teknik kami telah mengembangkan produk untuk berbagai aplikasi kelautan — masing-masing dengan persyaratan dan kriteria kinerja yang berbeda.
  columns: 3
  items:
    - title: Operasi Menyelam
      description: Dek yang diperkuat, integrasi tangga menyelam, sistem penyimpanan tangki, dan platform stabil untuk pusat penyelaman komersial di seluruh dunia.
      icon: tabler:lifebuoy
    - title: Penyelamatan & Darurat
      description: Desain lambung berkecepatan tinggi, dek pembuangan otomatis, sistem pemasangan peralatan, dan konfigurasi keselamatan multi-ruang untuk operasi SAR.
      icon: tabler:alert-triangle
    - title: Wisata Bahari
      description: Tata letak kenyamanan penumpang, integrasi atap peneduh, sistem naik turun, dan konfigurasi bahan bakar efisien untuk operasional transfer ke pulau.
      icon: tabler:beach
    - title: Perahu Pengantar Yacht
      description: Desain kompak untuk penyimpanan davit, opsi finis mewah, warna yang sesuai dengan kapal induk, dan karakteristik tarik berperforma tinggi.
      icon: tabler:sailboat
    - title: Perikanan & Budidaya Perairan
      description: Konfigurasi dek datar, integrasi livewell, tata letak dudukan tongkat, perangkat keras tahan korosi untuk paparan air laut terus-menerus.
      icon: tabler:fish
    - title: Pelabuhan & Industri
      description: Penguatan lambung berat, tata letak kapal kerja, konfigurasi transportasi personel, dan integrasi peralatan untuk operasi lepas pantai.
      icon: tabler:ship
