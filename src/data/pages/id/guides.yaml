hero:
  tagline: Panduan
  title: Baru mengenal SUP?
  subtitle: Panduan praktis untuk membantu Anda memilih, menggunakan, dan menikmati peralatan olahraga air tiup.
size_guide:
  tagline: Ukuran & Spesifikasi
  title: Temukan Ukuran yang Tepat untuk Kebutuhan Anda
  desc: Bandingkan dimensi papan, kapasitas berat, dan penggunaan yang direkomendasikan. Apakah Anda menginginkan papan serba guna yang stabil atau bentuk touring yang lebih cepat — panduan ukuran kami membantu Anda memilih yang tepat.
  link_label: Panduan ukuran lengkap dengan spesifikasi produk →
  link: /size-guide
  cards:
    - title: Papan Serba Guna SUP
      desc: Papan kami sekitar 11 kaki (~32" lebar) menyeimbangkan stabilitas, kecepatan, dan kapasitas. Inti 6 inci drop-stitch pada 15 PSI menjaga dek tetap kaku untuk pendayung di semua tingkat.
    - title: Lebar & Stabilitas
      desc: Papan yang lebih lebar (32"+) menawarkan lebih banyak stabilitas untuk pemula, yoga, dan memancing. Ketebalan 6 inci menambah kekakuan dan kapasitas berat untuk pengendara beserta peralatannya.
    - title: Paket & Aksesori
      desc: Setiap papan dikirim sebagai paket lengkap — papan, tas perjalanan, pompa tangan, dayung yang dapat diatur, sirip yang bisa dilepas, tali pengaman koil, dan kit perbaikan. Periksa muatan maksimum untuk pengendara beserta peralatannya.
