hero:
  tagline: Panduan
  title: Baru mengenal SUP?
  subtitle: Panduan praktis untuk membantu Anda memilih, menggunakan, dan menikmati peralatan olahraga air tiup.
size_guide:
  tagline: Ukuran & Spesifikasi
  title: Temukan Ukuran yang Tepat untuk Kebutuhan Anda
  desc: Bandingkan dimensi produk, kapasitas berat, dan penggunaan yang disarankan. Baik Anda membutuhkan kayak touring SUP, kayak kompak, atau RIB komersial — panduan ukuran kami membantu Anda memilih yang tepat.
  link_label: Panduan ukuran lengkap dengan spesifikasi produk →
  link: /size-guide
  cards:
    - title: SUP Papan
      desc: Pilih panjang berdasarkan berat dan penggunaan yang dimaksudkan. Papan yang lebih lebar (32"+) menawarkan stabilitas lebih. Papan yang lebih panjang (11–12 ft) lebih baik untuk touring.
    - title: Kayak
      desc: Kayak tunggal (9 ft) untuk perjalanan solo dan sungai. Kayak tandem (12 ft) untuk dua pendayung atau satu dengan peralatan. Selalu periksa kapasitas berat.
    - title: Perahu kecil & RIBs
      desc: Pilih panjang berdasarkan jumlah penumpang dan penggunaan. RIBs yang lebih besar (4,5 m+) untuk lepas pantai dan penyelamatan. Perahu kecil yang lebih kecil (2,7 m) sebagai tender dan platform memancing.
