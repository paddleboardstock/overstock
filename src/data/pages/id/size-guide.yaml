how_to_choose:
  title: Cara Memilih Ukuran yang Tepat
  cards:
    - title: Papan Serba Guna SUP
      description: Papan serbaguna ~11 ft kami (32" lebar, 6 inci drop-stitch) menyeimbangkan stabilitas, kecepatan, dan kapasitas. Sesuaikan volume papan dengan berat badan Anda — pendayung yang lebih berat membutuhkan volume lebih.
    - title: Lebar & Ketebalan
      description: Papan yang lebih lebar (32"+) menawarkan lebih banyak stabilitas untuk pemula, yoga, dan memancing. Ketebalan 6 inci pada 15 PSI menjaga dek kaku di bawah pengendara dan peralatan.
    - title: Paket & Aksesori
      description: Setiap papan dikirim sebagai paket lengkap — papan, tas perjalanan, pompa tangan, dayung yang dapat diatur, sirip yang bisa dilepas, tali pengaman koil, dan kit perbaikan. Periksa muatan maksimum untuk pengendara beserta peralatannya.
