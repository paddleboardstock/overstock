how_to_choose:
  title: Cara Memilih Ukuran yang Tepat
  cards:
    - title: SUP Papan
      description: Pilih panjang berdasarkan berat badan dan tujuan penggunaan. Papan yang lebih lebar (32"+) menawarkan stabilitas lebih. Papan yang lebih panjang (11-12 ft) lebih stabil untuk tur. Pendayung lebih berat membutuhkan papan dengan volume lebih tinggi.
    - title: Kayak
      description: Kayak tunggal (9 ft) paling cocok untuk perjalanan solo dan sungai. Kayak tandem (12 ft) dapat menampung dua pendayung atau satu orang dewasa dengan perlengkapan. Periksa kapasitas berat untuk total beban termasuk perlengkapan.
    - title: Perahu kecil & RIBs
      description: Pilih panjang perahu karet sesuai jumlah penumpang dan tujuan penggunaan. RIBs yang lebih besar (4,5 m+) cocok untuk lepas pantai dan penyelamatan. Perahu karet yang lebih kecil (2,7 m) cocok sebagai perahu pengantar dan platform memancing.
