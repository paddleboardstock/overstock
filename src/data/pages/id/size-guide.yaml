hero:
  title: Panduan Ukuran & Spesifikasi
  subtitle: Dimensi, kapasitas, dan penggunaan yang direkomendasikan untuk setiap produk Paddle Board Overstock.
categories:
  inflatable: Perahu karet SUPs dan kayak yang dapat dipompa dirancang untuk portabilitas tanpa mengorbankan performa. Sesuaikan ukuran yang tepat dengan berat badan dan gaya mendayung Anda.
  rib: Perahu kaku dengan lambung karet untuk navigasi pesisir, patroli, dan operasi laut profesional. Pilih berdasarkan panjang dan kapasitas mesin.
  accessory: Aksesori dan peralatan keselamatan untuk melengkapi perahu Anda. Ukuran universal dengan berbagai pilihan.
