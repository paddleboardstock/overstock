features:
  id: features
  tagline: Kenapa Membeli Dari Paddle Board Overstock
  title: Pabrik Nyata,<br />Penghematan Nyata
  subtitle: Paket SUP yang terlalu banyak menimbun dan mengeluarkan izin dari pabrik — kualitasnya terbukti tanpa markup eceran.
  columns: 2
  items:
    - title: Hingga 60% Off Retail
      description: Kami menjual batch kelebihan stok dan clearance langsung dari pabrik — tanpa perantara, tanpa markup ritel. Papan yang sama yang dijual dengan harga penuh di tempat lain, dijual dengan harga clearance di sini.
      icon: tabler:rocket
    - title: Paket Lengkap
      description: 'Setiap SUP datang sebagai paket lengkap: papan, tas travel, pompa tangan, dayung yang bisa disetel, sirip yang bisa dilepas, tali koil, dan kit perbaikan.'
      icon: tabler:clipboard-list
    - title: Kualitas Terbukti
      description: Setiap papan diuji tekanannya 100% pada PSI dengan nilai 1,25x sebelum dikirimkan. Tingkat bebas cacat 99,3% di setiap batch.
      icon: tabler:shield-check
    - title: Tidak Ada Minimal Pemesanan
      description: Belilah apa yang Anda butuhkan. Tambahkan papan ke troli, check out, selesai — tanpa minimum, tanpa proses penawaran, tanpa menunggu.
      icon: tabler:adjustments
    - title: Pengiriman Cepat ke Seluruh Dunia
      description: Pesanan yang tersedia dikirim dari Weihai dalam 2-3 hari kerja. Pengiriman terpantau ke 50+ negara di seluruh UE, Amerika Utara, Asia-Pasifik, dan lainnya.
      icon: tabler:truck-delivery
    - title: Garansi SUP 2 Tahun
      description: Setiap papan dan aksesoris SUP dilindungi selama 2 tahun — termasuk jahitan drop-stitch, katup inflasi, dan aksesoris. Klaim diselesaikan dalam hitungan hari, bukan minggu.
      icon: tabler:lifebuoy
