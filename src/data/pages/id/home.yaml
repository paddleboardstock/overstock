faqs:
  title: SUP Pemesanan & FAQ Produk
  subtitle: Pertanyaan umum tentang papan SUP diskon kami, pemesanan, pembayaran, pengiriman, dan garansi.
  columns: 2
  items:
    - title: Apakah SUP sulit dipelajari?
      description: Tidak sama sekali. Sebagian besar pemula bisa berdiri dan mendayung dalam sesi pertama mereka. Papan SUP serbaguna kami memiliki platform yang ekstra lebar dan stabil yang dirancang khusus untuk pendayung pemula. Mulailah di perairan yang tenang dan Anda akan bisa melaju dalam beberapa menit.
      icon: tabler:swimming
      category: 'Penopang. '
    - title: Berapa batas beratnya?
      description: Dukungan serba SUPs kami hingga 220 lbs dan platform touring serta yoga mendukung hingga 250 lbs. Setiap halaman produk mencantumkan kapasitas berat pengendara yang tepat sehingga Anda dapat menyesuaikan papan dengan kebutuhan Anda.
      icon: tabler:adjustments
      category: 'Penopang. '
    - title: Bisakah saya bepergian dengan balon SUP?
      description: Tentu saja. Setiap papan Paddle Board Overstock muat dalam tas jinjing seukuran ransel. Dengan berat hanya 18-22 lbs, mudah dibawa ke pantai, danau, atau melewati terminal bandara. Periksa kebijakan bagasi maskapai Anda sebelum bepergian.
      icon: tabler:truck-delivery
      category: 'Penopang. '
    - title: Apa yang ada di dalam kotak?
      description: Setiap Paddle Board Overstock SUP termasuk papan, ransel perjalanan, pompa tangan, dayung yang dapat disesuaikan, sirip yang dapat dilepas, tali pengaman spiral, dan kit perbaikan.
      icon: tabler:clipboard-list
      category: 'Penopang. '
    - title: Mengapa harga Anda lebih rendah daripada harga eceran?
      description: Kami menjual kelebihan stok pabrik — papan baru yang tersisa dari pesanan produksi yang telah selesai — bersumber dari basis manufaktur Weihai kami sendiri dan mitra produksi terpilih. Tanpa markup eceran dan tanpa perantara berarti paket SUP lengkap dengan diskon hingga 60% dari harga eceran pada umumnya, dengan kualitas yang sama dan telah teruji tekanannya.
      icon: tabler:shield-check
      category: pesanan
    - title: Bagaimana saya memesan dan membayar?
      description: Tambahkan paket SUP Anda ke keranjang dan lakukan pembayaran dengan aman menggunakan Stripe atau PayPal. Kami menerima semua kartu kredit dan debit utama. Setiap pesanan dikonfirmasi melalui email dengan faktur lengkap.
      icon: tabler:file-text
      category: pesanan
    - title: Apakah Anda mengirim ke seluruh dunia?
      description: Ya. Kami mengirim ke 50+ negara di seluruh UE, Amerika Utara, Asia-Pasifik, Timur Tengah, dan Afrika. Pesanan yang tersedia biasanya dikirim dalam 2-3 hari kerja dengan pelacakan disediakan untuk setiap paket.
      icon: tabler:route
      category: pesanan
    - title: Garansi apa yang termasuk pada papan SUP?
      description: 'Setiap papan dan aksesori SUP dilindungi oleh garansi 2 tahun — termasuk papan itu sendiri, sambungan drop-stitch, dan katup inflasi. Klaim diselesaikan dalam hitungan hari, bukan minggu: ajukan secara online dan kami akan memperbaiki atau mengganti.'
      icon: tabler:lifebuoy
      category: pesanan
