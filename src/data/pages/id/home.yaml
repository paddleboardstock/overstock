content_customer_types:
  tagline: Siapa yang Kami Layani
  title: Dibuat untuk Pembeli B2B<br />— Bukan Pembeli Eceran
  subtitle: Aquafarer memproduksi untuk empat jenis pelanggan. Masing-masing memiliki prioritas yang berbeda, dan kami menangani semuanya.
  items:
    - title: Pemilik Merek / Label Pribadi
      description: Desain produk khusus, grafis label pribadi, dokumentasi kepatuhan di bawah merek Anda, dan dukungan rekayasa khusus dari konsep hingga kontainer.
      icon: tabler:palette
      cta: Permintaan OEM/ODM Penawaran
      cta_href: /request-quotation
    - title: Distributor / Grosir
      description: Perlindungan wilayah, harga grosir kompetitif, kit dukungan pemasaran, pelatihan produk, dan dokumentasi kepatuhan penuh untuk pasar Anda.
      icon: tabler:world
      cta: Ajukan untuk Keagenan
      cta_href: /dealers-distributors
    - title: Resor / Operator Penyewaan
      description: Daya tahan tingkat komersial, saran ukuran armada, pesanan kontainer model campuran, strategi suku cadang, dan paket peralatan bermerek resor.
      icon: tabler:beach
      cta: Dapatkan Paket Komersial
      cta_href: /solutions/resorts
    - title: Penyelamatan / Pemerintah / Profesional
      description: Konstruksi Hypalon/CSM, opsi kepatuhan SOLAS, sertifikasi khusus proyek, dukungan dokumentasi tender, dan perlindungan engineering NDA.
      icon: tabler:shield
      cta: Diskusikan Proyek
      cta_href: /solutions/rescue-watercraft
features:
  id: features
  tagline: Kapabilitas OEM/ODM
  title: Yang Anda Dapatkan<br />dengan Aquafarer
  subtitle: Akses langsung ke pabrik dengan dukungan penuh teknik, kualitas, dan kepatuhan — bukan perusahaan perdagangan.
  columns: 2
  items:
    - title: Kustomisasi OEM/ODM
      description: Desain lambung kustom, bahan tabung (PVC atau Hypalon/CSM), tata letak konsol, tempat duduk, branding, warna, dan kemasan. Dari modifikasi minor hingga rekayasa kustom penuh.
      icon: tabler:adjustments
    - title: MOQ Rendah, Sampel Cepat
      description: 'RIB: 2-5 unit (cetakan yang ada). SUP: 5-10 unit per SKU. Cetakan kustom: 200+ unit. Sampel pra-produksi dengan branding Anda dalam 7-14 hari.'
      icon: tabler:rocket
    - title: Kualitas Siap Produksi
      description: Setiap unit diuji tekanan pada 1,25x PSI yang ditetapkan selama 24-48 jam. Tingkat bebas cacat 99,3% per AQL 2,5 / ISO 2859. Daftar periksa kualitas 100 poin per lambung.
      icon: tabler:certificate
    - title: Dokumentasi Kepatuhan Penuh
      description: CE sesuai 2013/53/EU (RCD), ISO 9001:2015 (SGS), audit sosial BSCI, kepatuhan REACH, penandaan UKCA. Data DoC dan plat pembuat spesifik model disertakan.
      icon: tabler:file-certificate
    - title: Waktu Tunggu 30-45 Hari
      description: Produksi standar 30-45 hari FOB Qingdao. Prototipe 7-14 hari. Produksi cepat tersedia. Rencana pemuatan kontainer dan pengemasan ISPM-15 termasuk.
      icon: tabler:truck-delivery
    - title: Layanan Purna Jual & Suku Cadang
      description: Garansi 5 tahun untuk perahu/kayak/RIBs, 2 tahun untuk SUP/aksesori. Pasokan suku cadang dengan pengiriman prioritas. Dukungan pemrosesan klaim garansi.
      icon: tabler:lifebuoy
content_categories:
  tagline: Kategori Produk
  title: 5 Kategori,<br />64 Model Bersertifikat CE
  subtitle: Dari tender RIB 2,4 m hingga papan SUP 15 ft — semua diproduksi di fasilitas Qingdao ISO 9001 kami.
  items:
    - title: RIB Perahu
      description: 2,4m hingga 7,0m dengan lambung aluminium atau GRP. Tabung PVC atau Hypalon/CSM. CE sesuai 2013/53/UE. Konfigurasi patroli, menyelam, penyelamatan, dan komersial.
      icon: tabler:sailboat
      link: /oem-odm-rib-boats
    - title: Perahu Karet
      description: 2,0 m hingga 5,0 m dengan pilihan lantai aluminium, lantai tripleks, atau air-deck. Model untuk memancing, rekreasi, dan kapal pendamping.
      icon: tabler:sailboat
      link: /products
    - title: SUP Papan
      description: 9 kaki hingga 15 kaki dalam 4 inci dan 6 inci Drop-Stitch. Model all-round, touring, yoga, dan memancing. Tersedia kelas komersial.
      icon: tabler:swimming
      link: /products
    - title: Kano
      description: Perahu karet tiup untuk 1 orang hingga 3 orang. Model rekreasi dan tur dengan pilihan lantai Drop-Stitch.
      icon: tabler:kayak
      link: /products
    - title: Aksesori Keselamatan
      description: Rompi pelampung bersertifikat CE, tali lempar, kit perbaikan, pompa, dan lampu navigasi. USCG PFD yang disetujui Tipe III/V.
      icon: tabler:lifebuoy
      link: /products
content_workshop:
  isReversed: true
  tagline: Kekuatan Pabrik
  title: Manufaktur Siap Audit<br />di Qingdao
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">12.000 m² ISO Fasilitas 9001 — Produsen Sebenarnya, Bukan Perusahaan Dagang</h3>
  items:
    - title: 6 Jalur Produksi Khusus
      description: Pisahkan RIB, perahu karet, SUP, kayak, peralatan keselamatan, dan garis OEM/ODM. Masing-masing dengan titik pemeriksaan QC dan perencanaan produksi yang khusus.
    - title: 100% Diuji Tekanan
      description: Setiap ruang yang dapat dipompa ditekan hingga 1,25x peringkat PSI dan dipertahankan selama 24-48 jam. Hasil uji dikaitkan dengan nomor seri lambung (HIN).
    - title: Pelacakan Per-Kapal
      description: 'Catatan produksi tingkat HIN dengan 21 bidang data per lambung: batch material, ID pengelas, hasil uji tekanan, konfigurasi akhir, dan tujuan pengiriman.'
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer 12.000 m² ISO fasilitas manufaktur 9001 di Qingdao dengan RIB jalur produksi
content_compliance:
  tagline: Bukti Kepatuhan & Kualitas
  title: Bukti Terdokumentasi<br />Bukan Hanya Klaim
  subtitle: Setiap klaim kepatuhan didukung oleh dokumentasi spesifik model yang tersedia untuk verifikasi Anda.
  items:
    - title: ISO 9001:2015 (SGS)
      description: Sistem manajemen mutu bersertifikat oleh TÜV Rheinland/SGS. Audit pengawasan tahunan. Proses QC terdokumentasi dari bahan masuk hingga pelepasan pengiriman.
      icon: tabler:certificate
    - title: CE sesuai 2013/53/EU (RCD)
      description: 64 model dengan Pernyataan Kesesuaian spesifik model. Penilaian kesesuaian sesuai modul yang berlaku. Registrasi HIN dan data plat pembuat untuk setiap lambung.
      icon: tabler:file-certificate
    - title: BSCI Kepatuhan Sosial
      description: Audit tahunan BSCI oleh SGS. Memverifikasi praktik kerja etis, keselamatan kerja, dan manajemen lingkungan di seluruh fasilitas kami.
      icon: tabler:users
    - title: REACH & UKCA
      description: Semua PVC dan bahan perekat mematuhi regulasi UE REACH. Penandaan UKCA tersedia untuk pasar Inggris. Lembar data keselamatan bahan tersedia atas permintaan.
      icon: tabler:shield-check
steps:
  title: OEM/ODM Proses — Dari Brief ke Kontainer
  items:
    - title: Langkah 1:<span class="font-medium">Persyaratan</span>
      description: Bagikan spesifikasi produk, pasar target, jumlah, dan persyaratan kepatuhan Anda. Tim teknik kami akan meninjau dalam 48 jam.
      icon: tabler:file-text
    - title: Langkah 2:<span class="font-medium">Proposal</span>
      description: Terima proposal rinci dengan spesifikasi, opsi material, MOQ, harga, waktu penyelesaian, dan cakupan kepatuhan untuk pasar Anda.
      icon: tabler:clipboard-list
    - title: Langkah 3:<span class="font-medium">Prototipe</span>
      description: Contoh pra-produksi dengan merek Anda dalam 7-14 hari. Pengujian kualitas penuh pada tekanan 1,25x dari tekanan terukur. Biaya contoh dikreditkan ke produksi.
      icon: tabler:settings
    - title: Langkah 4:<span class="font-medium">Produksi</span>
      description: Produksi 30-45 hari FOB Qingdao setelah persetujuan sampel. Titik pemeriksaan QC dalam proses, pengujian tekanan, dan inspeksi akhir 100 poin pada setiap unit.
      icon: tabler:building-factory
    - title: Langkah 5:<span class="font-medium">Pengiriman</span>
      description: Rencana pemuatan kontainer, kemasan kayu ISPM-15, paket dokumen kepatuhan, dan pengiriman FOB Qingdao dengan seluruh dokumen ekspor.
      icon: tabler:truck-delivery
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Proses pembuatan perahu karet Aquafarer OEM/ODM dari desain hingga pengiriman dalam kontainer
blog_latest:
  title: Wawasan Industri & Teknis
  information: |
    RCD panduan kepatuhan, OEM/ODM artikel proses, perbandingan material,
    dan sumber daya inspeksi pabrik dari tim teknik Aquafarer.
faqs:
  title: B2B FAQ Pengadaan
  subtitle: Pertanyaan umum dari merek, distributor, dan operator komersial tentang manufaktur OEM/ODM dengan Aquafarer.
  columns: 2
  items:
    - title: Apakah Anda seorang produsen atau perusahaan perdagangan?
      description: Kami adalah pabrik terintegrasi secara vertikal dengan kontrol penuh atas kualitas, bahan, dan waktu tunggu. Lisensi usaha dan lingkup produksi dapat diverifikasi selama audit pabrik.
      icon: tabler:building-factory
      category: all
    - title: Apa proses OEM/ODM Anda?
      description: Tinjauan persyaratan (48 jam) hingga proposal ke prototipe (7-14 hari) hingga produksi (30-45 hari FOB Qingdao). Dukungan rekayasa penuh, dokumentasi kepatuhan, dan ketertelusuran per-lambung secara menyeluruh.
      icon: tabler:route
      category: all
    - title: Apa saja MOQ persyaratan Anda?
      description: 'RIB perahu: 2-5 unit per model (cetakan yang ada), 200+ untuk cetakan khusus. SUP papan: 5-10 unit per SKU. Pesanan kontainer dengan model campuran tersedia. Pesanan sampel 2-5 unit untuk evaluasi.'
      icon: tabler:sort-ascending
      category: all
    - title: Opsi kustomisasi apa saja yang tersedia?
      description: Desain lambung, material tabung (PVC atau Hypalon/CSM), diameter tabung, tata letak konsol, tempat duduk, kemudi, sistem bahan bakar, tata letak dek, warna merek, grafik logo, desain pad EVA, kemasan ritel, dan branding manual pemilik.
      icon: tabler:adjustments
      category: all
    - title: Dokumen kepatuhan mana yang bisa Anda berikan untuk pasar saya?
      description: CE DoC sesuai 2013/53/EU, tanda UKCA, sertifikat ISO 9001 (SGS), laporan audit BSCI, kepatuhan REACH, laporan uji material, catatan uji tekanan, dan data plat pembuat spesifik model. Dokumentasi spesifik pasar tersedia atas permintaan.
      icon: tabler:file-certificate
      category: all
    - title: Berapa waktu sampling dan produksi?
      description: 'Sampel pra-produksi: 7-14 hari kerja. Produksi standar: 30-45 hari FOB Qingdao. Produksi cepat tersedia dengan biaya tambahan. Musim puncak (Maret-Juni) dapat memperpanjang waktu produksi.'
      icon: tabler:clock
      category: all
    - title: Bisakah saya mengatur audit pabrik atau tur video langsung?
      description: Ya. Audit pabrik di lokasi di fasilitas Qingdao kami disambut dengan pemberitahuan 3-5 hari sebelumnya. Tur video langsung melalui WhatsApp/Zoom tersedia segera. Inspeksi pihak ketiga (SGS, BV, TÜV) dapat dilakukan.
      icon: tabler:video
      category: all
    - title: Pemeriksaan kualitas apa yang dilakukan sebelum pengiriman?
      description: Uji tahan tekanan 1,25x tekanan nominal (24-48 jam), uji kelunturan jahitan, daftar periksa inspeksi akhir 100 poin, verifikasi dimensi, inspeksi kosmetik, verifikasi dokumentasi kepatuhan, dan pemeriksaan integritas kemasan. Semua sesuai prosedur ISO 9001.
      icon: tabler:clipboard-check
      category: all
