hero:
  tagline: Afrika Selatan
  title: Papan Grosir SUP untuk<br />Pengecer Afrika Selatan
  subtitle: Toko dan operator Cape Town, Durban, dan Garden Route — papan dayung overstock baru dari 5 unit, model campuran, dikirim dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan overstock SUP untuk pengecer dan operator Afrika Selatan
direct_answer: Paddle Board Overstock memasok papan tiup overstock baru SUP untuk bisnis Afrika Selatan — toko dan sekolah di Cape Town, Durban, serta sepanjang Garden Route, operator penyewaan, dan penjual online. Pesanan grosir dimulai dari 5 papan dengan model campuran dalam satu pengiriman, dikirim dari Weihai, China melalui angkutan udara ekspres atau pengiriman laut konsolidasi. Setiap papan telah diuji tekanan 100% dan dilindungi oleh SUP Garansi 2 Tahun.
tldr_points:
  - Grosir dari 5 papan — model campuran, dihargai berdasarkan jumlah total
  - Melayani pasar ritel olahraga papan paling mapan di Afrika
  - Pengiriman udara ekspres atau pengiriman laut konsolidasi dari Weihai, Tiongkok
  - 100% teruji tekanan, SUP Garansi 2 Tahun untuk setiap papan
overview_section:
  tagline: Ikhtisar Pasar
  title: Pasar Afrika Selatan SUP
  paragraphs:
    - Afrika Selatan memiliki pasar olahraga papan paling matang di benua ini. Cape Town memadukan lintasan angin bertingkat dunia dan laguna air datar dengan budaya selancar yang dalam; Durban menjalankan pantai air hangat sepanjang tahun; laguna knysna dan Teluk Plettenberg di Garden Route dibuat untuk dayung rekreasi. Infrastruktur ritel yang mapan dan komunitas dayung lokal yang sejati — mulai dari SUP peselancar hingga pendayung kebugaran air datar — membedakan pasar ini.
    - Buyers here are seasoned: toko selancar dengan lantai ritel nyata, sekolah dayung dengan armada, dan operator petualangan yang dipadukan SUP dengan tur kayak dan bersepeda. Mereka mengevaluasi perlengkapan seperti profesional — konstruksi, garansi, dan perbaikan — dan memesan dalam batch kecil dan sengaja 5–20 papan, mencampur peralatan serba guna kelas sewa dengan edisi premium untuk dinding ritel.
  customer_types:
    - title: Toko Selancar & Dayung
      description: Pengecer mapan di Cape Town dan Durban menambah atau memperluas SUP lini untuk komunitas dayung lokal.
    - title: Sekolah & Sewa Dayung
      description: Sekolah dan armada sewa di laguna dan pantai air tenang, papan penyegaran dalam siklus pengganti yang nyata.
    - title: Operator Petualangan
      description: Operator Garden Route dan Western Cape menambah SUP penawaran petualangan multi-aktivitas.
shipping_section:
  title: Kapal ke Afrika Selatan
  paragraphs:
    - Pesanan dikirim dari Weihai, China. Angkutan udara ekspres membawa sampel dan 1–3 pesanan papan ke Johannesburg dan Cape Town; Consolidated Sea Freight melayani 5–20 pesanan grosir papan melalui Durban, Cape Town, dan pelabuhan lainnya. Perkiraan transit untuk tujuan Anda sudah termasuk dalam penawaran Anda.
    - Kami menyediakan faktur komersial dan persyaratan daftar pengemasan, dengan kode HS yang benar dan nilai yang dideklarasikan. Bea masuk dan PPN harus dibayar oleh importir sesuai aturan Afrika Selatan.
  customs_note: Clearance SARS berbasis dokumentasi — konfirmasi biaya dan perlakuan PPN saat ini untuk peralatan olahraga tiup dengan agen kliring Anda sebelum memesan. Kami menyediakan dokumen lengkap dan konsisten serta merespons permintaan broker dengan cepat.
faq_section:
  title: FAQ Afrika Selatan
  items:
    - q: Apakah papan tersebut cocok dengan kondisi campuran di Cape Town?
      a: Ya. Model serba bisa menangani air datar laguna dan hari-hari pantai yang tenang, serta rangkaian ini mencakup papan touring untuk dayung yang lebih panjang. Untuk lintasan di laut terbuka di bawah angin, pendayung berpengalaman sebaiknya mendiskusikan kasus penggunaan spesifik mereka dengan kami sebelum memesan.
    - q: Seperti apa pesanan toko?
      a: 'Biasanya 5–20 papan: basis model serba guna untuk pelajaran dan sewa plus edisi seni premium untuk dinding ritel — model campuran, satu pengiriman, dihargai berdasarkan jumlah total.'
    - q: Bagaimana pengiriman barang ke Afrika Selatan?
      a: Kirim melalui udara ke Johannesburg atau Cape Town untuk sampel dan pesanan kecil; pengiriman laut gabungan ke Durban atau Cape Town untuk jumlah besar. Keduanya tercantum secara rinci dalam penawaran Anda dengan perkiraan waktu transit.
    - q: Siapa yang menangani bea impor dan PPN?
      a: Anda melakukannya, sebagai importir, melalui agen pabean Anda sesuai peraturan SARS. Kami menyediakan faktur komersial dan daftar kemasan dengan kode HS yang benar dan nilai yang dinyatakan.
