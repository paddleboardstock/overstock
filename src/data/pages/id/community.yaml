stories:
  tagline: Kisah Penjelajah
  title: Petualangan nyata dari orang-orang nyata
  subtitle: Dengarkan dari para pendayung, keluarga, dan profesional yang menggunakan perlengkapan Aquafarer di air.
  items:
    - name: Sarah & Mike
      title: Pemilik SUP Explorer 11, Kanada
      content: Kami membawa Explorer 11 kami dalam perjalanan selama seminggu melalui Taman Algonquin. Mereka menangani portase dan penyeberangan danau dengan indah. Konstruksi drop-stitch berarti kami bisa memompa hingga 15 PSI dan mendapatkan performa papan keras dari papan yang dapat dikemas.
      image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
      location: Taman Algonquin, Kanada
    - name: Carlos R.
      title: Pengendara Cheetah Surge, Spanyol
      content: Cheetah Surge adalah pilihan saya untuk berlayar di pesisir. Desainnya yang cerah menarik perhatian di pantai, dan stabilitasnya memberi saya kepercayaan diri saat ombak ringan. Ia menangani dengan indah baik saat saya berkeliling maupun sekadar menikmati matahari terbenam.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
      location: Costa Brava, Spanyol
    - name: Lina & keluarga
      title: Pendayung Teratai Mengalir, Swedia
      content: Petualangan keluarga akhir pekan di kepulauan. The Flowing Lotus cukup stabil untuk anak perempuan saya berdiri saat saya mendayung. Mengembang dalam waktu kurang dari 10 menit — tidak perlu trailer, hanya kesenangan keluarga murni di atas air.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-flowing-lotus-1.webp
      location: Kepulauan Stockholm, Swedia
    - name: Letnan Komandan Andres
      title: Penjelajah Ocean Voyager, Filipina
      content: Saya menggunakan Ocean Voyager saya untuk tur pesisir jarak jauh di sekitar Palawan. Setelah berbulan-bulan digunakan setiap hari di kondisi tropis, papan ini masih berfungsi seperti baru. Bentuk turinngnya mampu menembus ombak kecil yang akan menghentikan papan lain yang lebih rendah kualitasnya.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      location: Palawan, Filipina
    - name: Emma T.
      title: Tropical Breeze pemula, Australia
      content: Saya belum pernah menaiki SUP sebelumnya. Tropical Breeze sangat stabil sehingga saya merasa percaya diri pada percobaan pertama saya. Sekarang saya dayung setiap akhir pekan. Kurva pembelajarannya hampir nol — dan papan terlihat menakjubkan di atas air.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-tropical-breeze-1.webp
      location: Gold Coast, Australia
