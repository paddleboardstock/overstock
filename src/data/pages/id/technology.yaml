testimonial:
  quote: Yang membuat saya tertarik adalah konstruksinya. Jahitan dilas fusi alih-alih dilem, inti drop-stitch yang terasa kokoh pada 15 PSI, dan tidak goyah saat saya mundur untuk berbelok. Dua tahun kemudian, tidak ada masalah sama sekali.
  author: Marta Keller
  title: Pembeli yang diverifikasi
  company: Penyelancar danau
  location: Jerman
sections:
  - title: Drop-Stitch Inti
    standard: 12-15 PSI tekanan operasi
    description: Ribuan benang poliester internal menghubungkan lapisan atas dan bawah, menciptakan struktur kaku pada 12-15 PSI. Ini adalah teknologi yang sama digunakan pada papan dayung profesional. Kepadatan drop-stitch kami dioptimalkan per model untuk keseimbangan ideal antara kekakuan dan berat.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
    imageAlt: Diagram Inti DS
  - title: Bahan Kelas Laut PVC
    standard: Dijahit fusi | UV / air asin / diuji abrasi
    description: Kain PVC laminasi multilapis yang dinilai untuk lingkungan laut. Setiap lapisan dilas fusi alih-alih dilem, menghilangkan risiko delaminasi. Diuji untuk ketahanan UV (1.000+ jam), korosi air laut, dan abrasi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
    imageAlt: Lapisan PVC
  - title: Sistem Dek EVA
    standard: Pola seri seni yang memiliki genggaman dan nyaman
    description: Busa EVA penuh di dek memberikan genggaman, bantalan, dan tampilan khas seri seni. Panel yang dipotong presisi ditempatkan dalam pola tanpa sambungan — tidak ada grafis cetak yang bisa tergores, tidak perlu waxing.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    imageAlt: Dek EVA
  - title: Sistem Rel Tiga-Lapis
    standard: Fusion bonded | Dibangun berlebih di zona stres tertinggi
    description: Pita rel dilapisi fusion tiga lapis dan dibungkus di tepi papan — zona stres tertinggi pada setiap papan tiup. Ini adalah tempat di mana papan murah biasanya cepat rusak; papan kami dibangun berlebih.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    imageAlt: Sistem Rel
