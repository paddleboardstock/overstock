testimonial:
  quote: Yang membedakan Aquafarer adalah ilmu material mereka. Mereka tidak hanya merakit komponen — mereka merancang PVC senyawa, parameter pengelasan, dan susunan struktur secara internal. Integrasi vertikal ini terlihat pada produk akhir.
  author: David Park
  title: Manajer Pengembangan Produk
  company: Bluewater Sports Equipment
  location: Australia
sections:
  - title: Inti Drop-Stitch
    standard: 12-15 PSI tekanan operasi
    description: Ribuan benang poliester internal menghubungkan lapisan atas dan bawah, menciptakan struktur kaku pada 12-15 PSI. Ini adalah teknologi yang sama yang digunakan pada papan dayung profesional dan perahu balap tiup. Kepadatan drop-stitch kami dioptimalkan per model untuk keseimbangan ideal antara kekakuan dan berat.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
    imageAlt: Diagram Inti DS
  - title: Bahan Kelas Laut PVC
    standard: Dijahit fusi | UV / air asin / diuji abrasi
    description: Kain PVC lapisan ganda dilaminasi dan diperuntukkan untuk lingkungan laut. Setiap lapisan dijahit fusi alih-alih dilem, menghilangkan risiko delaminasi. Diuji untuk ketahanan UV (ASTM G154, 1.000+ jam), korosi air asin (ISO 9227), dan abrasi (ASTM D751).
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
    imageAlt: Lapisan PVC
  - title: Tabung Hypalon
    standard: Karet CSM | UV / tahan kimia / suhu ekstrem
    description: Digunakan pada model RIB, karet Hypalon (CSM) memberikan ketahanan UV dan kimia superior dibandingkan dengan PVC standar. Tabung Hypalon tetap fleksibel pada suhu ekstrem dan tahan degradasi akibat bahan bakar serta paparan oli. Semua jahitan diletakkan secara manual oleh teknisi bersertifikat.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
    imageAlt: Hypalon
  - title: Lantai Dek Udara
    standard: Tiup tekanan tinggi | Mengganti kayu lapis/aluminium
    description: Sistem lantai tiup tekanan tinggi yang menggantikan lantai kayu lapis atau balok aluminium tradisional. Mengurangi waktu pemasangan, berat keseluruhan, dan volume penyimpanan sambil memberikan kekakuan yang memadai untuk berdiri, memancing, dan berjalan. Diuji untuk mendukung beban terdistribusi 200+ kg.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-air-deck.webp
    imageAlt: Lantai Udara
