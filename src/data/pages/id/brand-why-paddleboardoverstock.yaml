features3_reasons:
  tagline: Mengapa Memilih Paddle Board Overstock
  title: Tujuh Alasan untuk Bermitra dengan Kami
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Manufaktur Sungguhan, Bukan Perdagangan
      description: Kami memiliki dan mengoperasikan pabrik seluas 12.000 m². Ketika Anda membeli dari Paddle Board Overstock, Anda membeli langsung dari orang-orang yang merancang, merekayasa, dan membangun papan Anda — tanpa perantara, tanpa markup ritel.
      icon: tabler:building-factory
    - title: 2. Pendekatan Dipimpin oleh Teknik
      description: Proses desain kami dimulai dari kasus penggunaan, bukan kategori produk. Kami mengoptimalkan bentuk lambung, pemilihan material, dan konfigurasi untuk bagaimana papan sebenarnya akan digunakan.
      icon: tabler:engine
    - title: 3. Kualitas Terbukti
      description: Setiap papan diuji tekanan 100% pada rating 1,25x PSI sebelum dikirim. Tingkat tanpa cacat 99,3% — diukur pada setiap batch, bukan hanya yang diklaim.
      icon: tabler:shield-check
    - title: 4. Desain Paddler-First
      description: 'Seni dek, seri warna, dudukan aksesori, dan paket lengkap — papan yang dirancang untuk mendayung sungguhan: tur, yoga, memancing, kebugaran, dan kesenangan keluarga.'
      icon: tabler:swimming
    - title: 5. Logistik Global
      description: Pengiriman langsung dari pabrik kami di Weihai ke para pendayung di 50+ negara, dengan pelacakan lengkap dan penanganan bea cukai.
      icon: tabler:truck-delivery
    - title: 6. Dukungan Seumur Hidup
      description: Kami mendukung papan yang kami buat bertahun-tahun lalu. Suku cadang asli, saran teknis, panduan perbaikan — tim kami siap membantu saat Anda membutuhkan.
      icon: tabler:lifebuoy
    - title: 7. Spesifikasi Jujur
      description: Rating beban nyata, dimensi nyata, berat nyata. Tidak ada pembengkakan pemasaran. Apa yang kami publikasikan adalah apa yang Anda dapatkan — diverifikasi oleh pengujian independen.
      icon: tabler:ruler-measure
testimonials:
  tagline: Dipercaya oleh Merek di Seluruh Dunia
  title: Apa Kata Mitra Kami
  items:
    - content: Papan saya tiba dalam kondisi segar dari pabrik dengan semua barang di dalam kotak. Dua musim mendayung mingguan dan masih menahan udara dengan sempurna.
      name: — Sarah M., Pendayung Akhir Pekan, Florida
    - content: Saya membandingkan spesifikasi selama berminggu-minggu sebelum membeli.Paddle Board Overstock Itu satu-satunya merek yang menerbitkan bobot nyata dan tekanan nyata. Apa yang mereka cantumkan adalah apa yang muncul.
      name: — Tomasz K., Pendayung Touring, Polandia
    - content: Sekarang seluruh keluarga mendayung dayung. Kami mulai dengan satu papan dan akhirnya punya empat — kualitasnya membuat keputusan jadi mudah.
      name: — Angela R., Pendayung Keluarga, Australia
cta:
  title: Siap merasakan perbedaannya?
