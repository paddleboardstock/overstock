  items:
    - content: My board arrived factory-fresh with everything in the box. Two seasons of weekly paddling and it still holds air perfectly.
      name: — Sarah M., Weekend Paddler, Florida
    - content: I compared specs for weeks before buying. Paddle Board Overstock was the only brand publishing real weights and real pressures. What they list is what shows up.
      name: — Tomasz K., Touring Paddler, Poland
    - content: The whole family paddles now. We started with one board and ended up with four — the quality made the decision easy.
      name: — Angela R., Family Paddler, Australia
