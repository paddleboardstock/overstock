process_section:
  tagline: Cara Kerja Pengiriman
  title: Dari Gudang Kami ke Pintu Anda
  steps:
    - title: Kutipan Dengan Opsi Pengiriman
      description: Setiap kutipan merinci opsi pengiriman untuk tujuan Anda — ekspres dan laut — dengan perkiraan waktu transit, sehingga tidak ada yang diputuskan untuk Anda.
    - title: Pemeriksaan Kualitas dan Paket
      description: Papan diuji tekanan 100%, kemudian dikemas dengan pompa, dayung, tali pengaman, sirip, ransel, dan kit perbaikan — paket lengkap yang sama seperti yang kami jual.
    - title: Pengiriman Dari Weihai
      description: Pengiriman Anda meninggalkan basis logistik kami dengan metode pengiriman yang Anda pilih dan pelacakan pintu-ke-pintu dibagikan kepada Anda pada hari yang sama.
    - title: Bea Cukai
      description: Kami menyediakan faktur komersial dan daftar kemasan yang Anda perlukan untuk impor. Bea masuk dan pajak di negara Anda menjadi tanggung jawab importir — lihat bagian bea cukai di bawah.
    - title: Pengiriman dan Pemeriksaan
      description: Periksa pengiriman Anda saat tiba. Jika ada yang rusak atau hilang, hubungi kami dengan foto dan nomor pesanan Anda — lihat kebijakan kami tentang barang hilang dan rusak di bawah.
customs_section:
  tagline: Bea Cukai & Pajak
  title: Bea Cukai dan Pajak Impor
  subtitle: Kami menjaga tanggung jawab pengiriman secara jelas daripada membuat janji yang samar. Berikut adalah siapa yang bertanggung jawab untuk apa.
  items:
    - title: Yang Kami Tangani
      description: Kutipan Anda termasuk biaya pengiriman ke tujuan Anda, dan kami menyiapkan serta menyediakan semua dokumen ekspor — faktur komersial, daftar kemasan, dan pelacakan pengiriman.
    - title: Yang Ditanggung Importir
      description: Bea masuk, VAT/GST, dan pajak negara tujuan lainnya harus dibayar oleh importir (Anda atau bisnis Anda) sesuai aturan negara Anda. Kami tidak menyertakan janji pajak yang samar dalam kutipan pengiriman kami.
    - title: Dukungan Pabean
      description: Dokumen kami lengkap dan konsisten — kode HS yang benar, nilai deklarasi, dan spesifikasi papan — yang menjaga kelancaran proses bea cukai. Jika broker atau kantor bea cukai Anda memerlukan dokumen tambahan, kami menyediakannya.
    - title: Periksa Tarif Lokal Sebelum Memesan
      description: Tarif bea untuk peralatan olahraga air tiup bervariasi menurut negara. Periksa aturan impor di negara Anda atau tanyakan saat mengajukan pertanyaan — panduan pasar regional kami mencakup catatan bea cukai untuk pasar utama.
lost_damaged:
  title: Pengiriman Hilang atau Rusak
  description: Periksa pengiriman Anda saat tiba. Dalam kasus jarang ketika papan tiba rusak atau paket hilang, hubungi kami sesegera mungkin dengan nomor pesanan dan foto jelas dari kemasan dan papan. Kami menilai setiap kasus secara individual — tergantung kasusnya, itu berarti suku cadang pengganti, papan pengganti, atau pengembalian dana untuk item yang terdampak. Cacat manufaktur ditanggung secara terpisah oleh Garansi 2-Tahun SUP kami.
destinations_section:
  tagline: Tempat Kami Mengirim
  title: 50+ Negara dan Bertambah
  description: Kami mengirim ke seluruh dunia, dengan panduan terperinci untuk pasar regional utama kami. Setiap panduan pasar mencakup jenis pelanggan lokal, catatan pengiriman, dan tips bea cukai untuk wilayah tersebut.
  regions_label: Panduan Regional
  countries_label: Panduan Negara
faq_section:
  title: FAQ Pengiriman
  items:
    - q: Berapa lama waktu pengiriman ekspres?
      a: Waktu transit ekspres tergantung tujuan — kami memberikan perkiraan waktu transit untuk negara Anda dengan setiap pertanyaan, sebelum Anda melakukan komitmen.
    - q: Berapa lama waktu pengiriman laut?
      a: Transit pengiriman laut bervariasi menurut pelabuhan tujuan dan jadwal pelayaran. Kami memberikan perkiraan jendela waktu untuk tujuan Anda dengan pesanan Anda, dan Anda akan menerima nomor pelacakan setelah pengiriman berangkat.
    - q: Metode pengiriman mana yang harus saya pilih?
      a: Ekspres untuk 1–3 papan, sampel, atau restock mendesak. Pengiriman laut untuk pesanan grosir 5–20 papan di mana biaya per papan lebih penting daripada kecepatan. Kami memberikan perkiraan kedua metode agar Anda bisa membandingkan.
    - q: Apakah bea dan pajak impor termasuk dalam biaya pengiriman?
      a: Tidak. Biaya pengiriman diberikan secara terpisah dan bea impor, PPN/GST, serta pajak tujuan adalah tanggung jawab importir sesuai aturan negara Anda. Kami menyediakan dokumen lengkap dan akurat untuk menjaga kelancaran proses bea cukai.
    - q: Apakah Anda mengirim ke negara saya?
      a: Kami mengirim ke 50+ negara. Periksa panduan regional dan negara kami di bawah, atau cukup tanyakan dalam pertanyaan Anda — kami akan mengonfirmasi layanan saat ini ke alamat Anda.
    - q: Apakah saya bisa melacak pesanan saya?
      a: Ya. Setiap pengiriman — ekspres atau laut — menyertakan pelacakan dari pintu ke pintu yang kami bagikan kepada Anda pada hari pengiriman.
