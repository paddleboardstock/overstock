hero:
  tagline: Pengiriman Internasional
  title: Pengiriman Internasional —<br />Pengiriman Ekspres & Laut ke 50+ Negara
  subtitle: Setiap pesanan dikirim dari basis logistik kami di Weihai, China. Pilih pengiriman udara ekspres untuk sampel dan restock mendesak, atau pengiriman laut konsolidasi untuk pesanan grosir usaha kecil.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock SUP papan yang dikemas untuk pengiriman internasional
direct_answer: Paddle Board Overstock mengirim ke lebih dari 50 negara dari Weihai, Tiongkok. Pengiriman udara ekspres membawa 1–3 papan, pesanan sampel, dan persediaan ulang mendesak; pengiriman laut konsolidasi adalah opsi ekonomis untuk pesanan grosir 5–20 papan. Setiap pengiriman mencakup pelacakan dari pintu ke pintu, dan setiap papan diuji tekanan 100% serta dikemas dengan kit aksesori lengkap sebelum dikirim.
tldr_points:
  - 'Pengiriman udara ekspres: 1–3 papan, sampel, restock mendesak — pilihan tercepat'
  - 'Pengiriman laut: pesanan grosir 5–20 papan — biaya pengiriman per papan terendah'
  - Pelacakan dari pintu ke pintu pada setiap pengiriman ke 50+ negara
  - Biaya angkutan, asuransi, bea cukai, dan impor dirinci dalam penawaran Anda — tanpa janji yang samar dan lengkap
from_china:
  tagline: Pengiriman dari China
  title: Dari mana pesanan dikirim
  description: Semua pesanan dikirim dari basis logistik kami di Weihai, China — pusat operasi produksi dan pergudangan kami. Weihai adalah kota pelabuhan pesisir utama di provinsi Shandong dengan koneksi langsung ke laut dan udara, yang menjaga waktu transit dan biaya pengiriman tetap kompetitif ke destinasi di Asia, Amerika, Afrika, Eropa, dan Timur Tengah.
modes_section:
  tagline: Dua Pilihan
  title: Pengiriman Ekspres atau Pengiriman Laut
  subtitle: Metode pengiriman yang tepat tergantung pada seberapa cepat Anda membutuhkan papan dan berapa banyak yang Anda pesan. Kedua opsi tersebut dikutip setiap kali ada permintaan.
  express:
    name: Opsi A — Pengiriman Ekspres
    best_for: Terbaik untuk 1–3 papan, sampel, dan restock mendesak
    description: Air Express menerima pesanan kecil dan papan sampel ke pintu Anda dalam hitungan hari, bukan minggu. Ideal saat Anda menguji model sebelum pesanan besar, atau mengisi ulang produk terlaris di tengah musim.
    features:
      - 1–3 papan, model tunggal, atau sampel model campuran
      - Transit tercepat dari dua opsi — dikutip per tujuan
      - Pelacakan dari pintu ke pintu dengan pengangkut ekspres utama
      - 'Penggunaan umum: sampel, persediaan ulang mendesak, pesanan awal kecil'
  sea:
    name: Opsi B — Angkutan Laut
    best_for: Terbaik untuk pesanan grosir dan pengecer 5–20 papan
    description: Pengiriman laut terkonsolidasi adalah pilihan ekonomis untuk pesanan grosir usaha kecil. Papan dikemas dalam satu pengiriman terkonsolidasi dari Weihai, sehingga biaya pengiriman per papan tetap rendah.
    features:
      - Pesanan pengecer dan grosir 5–20 papan
      - Biaya pengiriman per papan terendah dari kedua opsi tersebut
      - Pengemasan terkonsolidasi — satu kiriman, satu pembersihan
      - 'Penggunaan umum: restock musiman, pesanan grosir model campuran'
