content_priorities:
  tagline: Apa yang Diverifikasi Klien
  title: 8 Hal yang Diverifikasi Pembeli<br />di Setiap Kunjungan Pabrik
  subtitle: Berdasarkan umpan balik dari 50+ pembeli negara, ini adalah delapan prioritas yang dinilai klien sebelum melakukan pemesanan B2B.
  items:
    - title: Produsen Asli
      description: 'Apakah Anda pabrik sebenarnya, bukan perusahaan dagang? Pembeli memeriksa: entitas bisnis, peralatan produksi nyata, karyawan yang mengoperasikan mesin, pesanan produksi saat ini di lantai produksi, dan konsistensi situs web-bengkel.'
      icon: tabler:building-factory
    - title: Kesesuaian Produk untuk Aplikasi
      description: Apakah RIB sesuai dengan kasus penggunaan spesifik mereka? Operator resor, penyelamatan, selam, memancing, dan patroli memiliki persyaratan yang sangat berbeda. Pembeli mengevaluasi tata letak dek, bahan tabung, dan opsi peralatan pada kapal yang ditampilkan.
      icon: tabler:target
    - title: Stabilitas & Reproduksibilitas Kualitas
      description: Apakah unit ke-50 sebaik unit pertama? Pembeli memeriksa sistem QC, titik pemeriksaan dalam proses, penanganan ketidaksesuaian, dan meminta untuk melihat catatan dari beberapa proses produksi untuk memverifikasi konsistensi.
      icon: tabler:repeat
    - title: Keaslian Dokumen Kepatuhan
      description: Apakah sertifikat CE khusus untuk model tertentu? Apakah DoC ditandatangani oleh orang asli? Dapatkah kepatuhan diverifikasi berdasarkan nomor lambung? Pembeli memeriksa klaim menyeluruh versus dokumentasi khusus model.
      icon: tabler:file-certificate
    - title: Eksekusi Kustomisasi
      description: Apakah pabrik sebenarnya dapat menyediakan konfigurasi khusus? Pembeli mencari bukti proyek kustom sebelumnya, contoh prototipe yang dipajang, gambar teknik, dan kemampuan untuk membahas modifikasi teknis secara langsung.
      icon: tabler:adjustments
    - title: Waktu Tunggu & Kapasitas
      description: 'Apakah jadwal penawaran realistis? Pembeli menilai: volume produksi saat ini, kapasitas yang tersedia, ukuran tenaga kerja, tingkat stok material, dan apakah pabrik memiliki sistem perencanaan produksi.'
      icon: tabler:clock
    - title: Syarat Harga & Perdagangan
      description: 'Apakah harga transparan? Apakah FOB harga sudah jelas? Pembeli memverifikasi: rincian harga satuan, biaya peralatan, biaya kemasan, dan apakah pabrik dapat menangani dokumen DDP CIF ekspor yang tepat.'
      icon: tabler:currency-dollar
    - title: Suku Cadang Purna Jual & Suku Cadang
      description: 'Apa yang terjadi setelah pengiriman? Pembeli mengevaluasi: ketersediaan suku cadang, proses garansi, bagian tabung pengganti, penggantian katup, dan apakah pabrik memiliki protokol purna jual yang terdokumentasi.'
      icon: tabler:headset
content_tour:
  tagline: Rute Tur Pabrik
  title: Tur Audit —<br />Apa yang akan Anda lihat
  subtitle: Tur pabrik standar kami mengikuti rute yang telah ditentukan untuk menjawab pertanyaan pembeli di setiap stasiun.
  items:
    - title: 1. Ruang Rapat — Pengenalan Perusahaan
      description: Lisensi bisnis, ISO 9001 dan BSCI sertifikat, lisensi ekspor, serta riwayat perusahaan. Ikhtisar cepat tentang kemampuan produksi dan cakupan kepatuhan.
      icon: tabler:users
    - title: 2. Gudang Bahan Baku — Stasiun IQC
      description: Catatan inspeksi material masuk, sertifikat batch kain, perekat, dan sampel perangkat keras. Lihat bagaimana material diuji sebelum memasuki produksi.
      icon: tabler:building-warehouse
    - title: 3. Fabrikasi Tabung — Pengelasan RF & Perekat Tangan
      description: Proses pengelasan atau perekat tabung hidup, demonstrasi uji kekuatan sambungan, dan pemasangan katup. Perhatikan konstruksi kamar demi ruang dan pos pemeriksaan kualitas.
      icon: tabler:flame
    - title: 4. Laminasi Lambung — Bengkel GRP
      description: Proses pemasangan fiberglass, aplikasi gelcoat, dan pengerasan lambung. Lihat jadwal laminasi dan penguatan struktural untuk RIB berbagai model.
      icon: tabler:layers-subtract
    - title: 5. Perakitan & Integrasi
      description: Penyambungan lambung dan tabung, pemasangan konsol dan kursi, integrasi sistem listrik dan bahan bakar, serta pemasangan peralatan. Amati jalur produksi yang sedang beroperasi.
      icon: tabler:tool
    - title: 6. Stasiun Pengujian Tekanan
      description: Uji tahan tekanan 24-48 jam pada tekanan terukur 1,25x. Lihat catatan pengujian, pengukur tekanan, dan kriteria lulus/gagal. Lihat bagaimana hasil uji dikaitkan dengan nomor seri lambung.
      icon: tabler:gauge
    - title: 7. Inspeksi Akhir & QC
      description: Daftar periksa kualitas 100 poin per unit, verifikasi dimensi, inspeksi kosmetik, dan pemeriksaan integritas kemasan. Tinjau log ketidaksesuaian dan catatan tindakan korektif.
      icon: tabler:clipboard-check
    - title: 8. Ruang Tinjauan Dokumen
      description: Dokumentasi kepatuhan per model (DoC, pelat pembuat, manual pemilik), catatan keterlacakan produksi, registri HIN, dan demonstrasi basis data pelacakan batch material.
      icon: tabler:folder
content_qc_chain:
  tagline: Bukti Berkualitas
  title: Rantai QC 8-Tahap<br />— Dapat diverifikasi di setiap langkah
  subtitle: Rantai kontrol kualitas kami berjalan dari bahan masuk hingga pengiriman akhir, dengan bukti terdokumentasi di setiap tahap.
  items:
    - title: 'Tahap 1: Inspeksi Material Masuk'
      description: Setiap batch PVC, Hypalon, fiberglass, aluminium, perekat, dan perangkat keras diuji sesuai spesifikasi sebelum memasuki produksi. Kekuatan tarik, adhesi pelapis, dan pemeriksaan dimensi dilakukan sesuai AQL 2.5/ISO 2859.
      icon: tabler:package
    - title: 'Tahap 2: QC Pengelasan / Perekatan Tabung'
      description: Pengujian kekuatan lepas sambungan per batch produksi. Parameter pengelasan RF dipantau dan dicatat. Sambungan yang direkatkan tangan diperiksa untuk cakupan perekat yang konsisten dan waktu pengerasan.
      icon: tabler:flame
    - title: 'Tahap 3: QC Laminasi Lambung'
      description: Pengukuran ketebalan gelcoat, verifikasi susunan fiberglass sesuai jadwal laminasi, dan pemantauan waktu pengerasan. Posisi penguatan struktural diverifikasi terhadap gambar teknik.
      icon: tabler:layers-subtract
    - title: 'Tahap 4: QC Perakitan & Integrasi'
      description: Integritas sambungan lambung-tabung, torsi pemasangan konsol dan kursi, kontinuitas listrik, dan uji kebocoran sistem bahan bakar. Setiap titik pemasangan diverifikasi terhadap daftar periksa perakitan spesifik model.
      icon: tabler:tool
    - title: 'Tahap 5: Uji Tahan Tekanan'
      description: Setiap ruang inflasi diberi tekanan hingga 1,25x PSI yang tertera dan dipertahankan selama 24-48 jam. Penurunan tekanan dicatat per ruang. Ambang lolos/gagal didokumentasikan. Terhubung ke nomor seri lambung.
      icon: tabler:gauge
    - title: 'Tahap 6: Inspeksi Akhir'
      description: Daftar periksa kualitas 100 poin mencakup akurasi dimensi, hasil kosmetik, kelengkapan aksesori, paket dokumentasi, dan integritas pengemasan. Independen dari tim produksi.
      icon: tabler:clipboard-check
    - title: 'Tahap 7: Dokumentasi Kepatuhan'
      description: DoC spesifik model, verifikasi plat pembuat, kelengkapan manual pemilik, dan entri registrasi HIN. Semua dokumen kepatuhan disiapkan dan diverifikasi sebelum pelepasan pengiriman.
      icon: tabler:file-certificate
    - title: 'Tahap 8: Pelepasan & Jejak Pengiriman'
      description: Pelepasan akhir memerlukan semua tahap QC lulus, dokumentasi kepatuhan lengkap, dan dokumen pengiriman diverifikasi. Rekor lambung ditutup dan diarsipkan selama 10+ tahun.
      icon: tabler:truck
content_traceability:
  tagline: Jejak Produksi
  title: Berkas Induk HIN → →<br />Rekam Lambung → Pengiriman
  subtitle: Setiap perahu RIB membawa Nomor Identifikasi Lambung unik yang terhubung pada rantai rekaman produksi dan kepatuhan lengkap.
  items:
    - title: Nomor Identifikasi Lambung (HIN)
      description: Pengidentifikasi unik 14-karakter ditandai permanen pada setiap perahu. Mengkode kode pabrikan (MIC), penunjukan model, tahun produksi, dan nomor seri. Kunci yang membuka rantai jejak penuh.
      icon: tabler:hash
    - title: Berkas Teknis Master
      description: Dokumentasi kepatuhan dan teknik untuk keluarga model. Berisi gambar GA, penilaian risiko, perhitungan stabilitas, spesifikasi material, dan standar yang berlaku. Terhubung ke semua lambung model itu.
      icon: tabler:folder
    - title: Rekam Lambung Individual
      description: 'Rekam produksi per lambung: HIN, tanggal produksi, batch tabung, sertifikat material, hasil uji tekanan, konfigurasi akhir, spesifikasi mesin, hasil daftar periksa kualitas, dan tujuan pengiriman. 21+ bidang data per lambung.'
      icon: tabler:file-description
    - title: Paket Kepatuhan Pelanggan
      description: Paket pengiriman per lambung termasuk DoC, foto plat pembuat, manual pemilik, daftar periksa kepatuhan, dan lembar konfigurasi akhir. Dikirim bersama perahu dan diarsipkan di pabrik selama 10+ tahun.
      icon: tabler:package
content_red_flags:
  tagline: Jebakan Audit
  title: Bendera Merah Pembeli<br />Mudah Dilihat
  subtitle: Masalah umum yang merusak kepercayaan pembeli selama audit pabrik. Kami secara proaktif menangani masing-masing.
  items:
    - title: CE Klaim Umum Tanpa Ruang Lingkup Model
      description: '"Semua produk CE tersertifikasi" tanpa menentukan arahan mana, model mana, dan modul kesesuaian mana. Tanda bahaya: menunjukkan kepatuhan bersifat dangkal, bukan per model, per konfigurasi.'
      icon: tabler:alert-triangle
    - title: Tidak ada bukti pengujian fisik
      description: 'Klaim uji tekanan tanpa catatan uji, pengukur, atau stasiun uji yang terlihat di lantai pabrik. Tanda bahaya: klaim kualitas tidak dapat diverifikasi selama kunjungan.'
      icon: tabler:alert-triangle
    - title: Keterlacakan Material yang Hilang
      description: 'Tidak ada catatan batch, tidak ada inspeksi masuk, atau tidak ada kaitan antara sertifikat material dan produk jadi. Tanda bahaya: tidak ada cara untuk melacak masalah kualitas ke sumbernya.'
      icon: tabler:alert-triangle
    - title: Dokumentasi Generik
      description: 'Satu DoC yang mencakup semua model, tidak ada catatan spesifik HIN, atau dokumen kepatuhan "template". Tanda bahaya: kepatuhan tidak terikat pada unit produksi individual.'
      icon: tabler:alert-triangle
content_shipping:
  tagline: Pengiriman & Kemasan
  title: RIB Kontainer Perahu<br />Memuat & Membuat Peti
  subtitle: Solusi pengiriman kami melindungi investasi Anda dari Qingdao ke pelabuhan tujuan. Rencana pemuatan kontainer dan spesifikasi peti tersedia untuk setiap model.
  items:
    - title: Konfigurasi Kontainer 20ft
      description: 'Kontainer standar 20ft: 1-2 RIB perahu (4,0-5,5m) bersarang dengan dek dan tabung terpisah, atau 8-12 SUP papan. RIB + SUP Konfigurasi campuran tersedia. Rencana muatan rinci disediakan per pesanan.'
      icon: tabler:box
    - title: Konfigurasi Kontainer 40ft
      description: 'Kontainer standar 40ft: 2-4 RIB kapal (hingga 7,0m) dengan lambung bersarang dan tabung ditumpuk, atau 20-30 SUP papan. HQ 40ft tersedia untuk model yang lebih tinggi RIB . Pengemasan yang dioptimalkan untuk volume mengurangi biaya pengiriman per unit.'
      icon: tabler:container
    - title: Peti Kayu untuk RIB Lambung
      description: Lambung aluminium dan GRP yang dikemas dalam peti kayu khusus dengan bantalan busa, penghalang kelembapan, dan pita baja. Dimensi dan berat peti per model tersedia untuk perencanaan logistik. Sertifikasi kayu ISPM-15 yang diperlakukan dengan panas sudah termasuk.
      icon: tabler:wood
    - title: Pengemasan Pemisahan Tabung & Dek
      description: Tabung dikempis dan dilipat terpisah dari lambung untuk efisiensi ruang. Pelat dek, konsol, dan kursi dikemas dalam pembungkus pelindung dengan kit perangkat keras pemasangan. Petunjuk perakitan kembali disertakan di setiap pengiriman.
      icon: tabler:package
    - title: Perlindungan Kelembapan & Korosi
      description: Kertas anti-korosi VCI untuk komponen aluminium, paket pengering gel silika, dan kantong perangkat keras yang disegel vakum. Mencegah kerusakan akibat kondensasi selama perjalanan laut selama 30-45 hari.
      icon: tabler:droplet-off
    - title: FOB Dokumentasi Qingdao
      description: Bill of Lading, faktur komersial, daftar pengemasan, sertifikat asal, dan dokumentasi kepatuhan per pengiriman. Konsolidasi FCL dan LCL tersedia. Dukungan dokumentasi bea cukai untuk pasar UE, AS, dan Timur Tengah.
      icon: tabler:file-text
content_audit_evidence:
  tagline: Bukti Verifikasi
  title: Bukti Audit<br />Anda Dapat Memverifikasi di Lokasi
  subtitle: Selama kunjungan pabrik, klien dapat memverifikasi bukti spesifik di setiap area produksi. Berikut adalah hal-hal yang perlu dicari — dan apa yang kami siapkan untuk setiap audit.
  areas:
    - area: Gudang Bahan Baku
      what_to_verify: Apakah materialnya stabil? Apakah ada pencampuran batch?
      evidence: Catatan inspeksi masuk, label batch, penyimpanan FIFO, daftar persetujuan pemasok, sertifikat material (PVC, Hypalon, fiberglass, aluminium, perekat, perangkat keras)
      icon: tabler:building-warehouse
    - area: Produksi Tabung
      what_to_verify: Bagaimana kekuatan sambungan dan kekedapan udara dijamin?
      evidence: Kartu proses, konfirmasi artikel pertama, catatan uji tekanan per ruang, log perbaikan dan pengujian ulang, catatan pemasangan katup
      icon: tabler:flame
    - area: Produksi Lambung
      what_to_verify: Bagaimana konsistensi struktural dikontrol?
      evidence: Dokumen proses terkendali, titik pemeriksaan kualitas, penomoran produk setengah jadi, pengukuran ketebalan gelcoat, verifikasi jadwal laminasi
      icon: tabler:layers-subtract
    - area: Area Perakitan
      what_to_verify: Bagaimana bagian opsional dicegah dari kesalahan perakitan?
      evidence: BOM, order kerja, daftar periksa konfigurasi, kartu inspeksi stasiun kerja, pemeriksaan torsi dan fungsi per model
      icon: tabler:tool
    - area: Stasiun Pengujian
      what_to_verify: Bagaimana Anda memastikan kapal dalam kondisi baik sebelum pengiriman?
      evidence: Prosedur uji, daftar instrumen, catatan kalibrasi, log uji tekanan (1,25x / 24-48 jam), daftar periksa uji fungsi, kriteria lulus/gagal yang didokumentasikan
      icon: tabler:gauge
    - area: Area Ketidaksesuaian
      what_to_verify: Bagaimana cacat ditangani?
      evidence: Label isolasi, log NCR, analisis akar penyebab, catatan persetujuan perbaikan, pelacakan CAPA (Tindakan Korektif dan Pencegahan)
      icon: tabler:alert-triangle
    - area: Gudang Barang Jadi
      what_to_verify: Bagaimana Anda mencegah kesalahan pengiriman dan kerusakan?
      evidence: Label produk jadi, catatan pencocokan pesanan, standar pengemasan, catatan inspeksi pra-pengiriman
      icon: tabler:box
    - area: Suku Cadang & Layanan Purna Jual
      what_to_verify: Dapatkah Anda mendukung layanan purna jual jangka panjang?
      evidence: Daftar suku cadang umum, strategi inventaris, sistem penomoran suku cadang, dokumentasi proses garansi, tutorial perawatan
      icon: tabler:headset
content_closing_script:
  tagline: Audit hingga Pesanan
  title: Dari Kunjungan Pabrik<br />hingga Proyek yang Dikonfirmasi
  subtitle: Audit yang berhasil tidak boleh berakhir dengan foto dan berjabat tangan. Sebelum meninggalkan, kami memastikan tiga hasil komersial didokumentasikan.
  items:
    - title: Konfirmasi Konfigurasi Teknis
      description: Setujui model, aplikasi, opsi utama, pasar sasaran, perkiraan jumlah, dan jadwal pengiriman — semua didokumentasikan sebelum keberangkatan.
      icon: tabler:checklist
    - title: Konfirmasi Dokumen Langkah Berikutnya
      description: 'Tentukan apa yang Paddle Board Overstock sediakan selanjutnya: GA yang direvisi, daftar konfigurasi, kutipan, daftar dokumen, rencana contoh, atau NDA — dengan jadwal waktu spesifik.'
      icon: tabler:file-plus
    - title: Konfirmasi Timeline Bersama
      description: Konfigurasi yang direvisi dan kutipan awal dalam 3 hari kerja. Konfirmasi sampel atau tampilan dalam 7 hari. Tinjauan teknik atau inspeksi pihak ketiga dalam 14 hari. Tanggal pertemuan berikutnya dan pihak yang bertanggung jawab dikonfirmasi.
      icon: tabler:calendar
faq:
  title: Audit Pabrik — Pertanyaan yang Sering Diajukan
  questions:
    - q: Bisakah saya mengunjungi pabrik secara langsung?
      a: Ya. Kami menyambut audit pabrik di tempat di fasilitas Qingdao seluas 12.000 m². Tur standar kami mencakup 8 stasiun dari gudang bahan baku hingga ruang tinjauan dokumen. Tur pabrik virtual melalui panggilan video juga tersedia untuk kualifikasi awal.
    - q: Apakah Anda menerima audit pihak ketiga (BSCI, SMETA, SGS)?
      a: Ya. Kami memiliki sertifikasi BSCI (Intertek) dan menyambut protokol audit spesifik pelanggan. Kami juga dapat mengatur inspeksi SGS atau TÜV atas permintaan. Laporan audit tersedia di bawah NDA.
    - q: Bisakah saya melihat pengujian tekanan selama kunjungan?
      a: Stasiun pengujian tekanan kami adalah bagian dari rute tur standar. Tergantung jadwal produksi, Anda dapat mengamati pengujian tekanan aktif dengan pembacaan manometer dan catatan uji. Log uji tekanan per lambung selalu tersedia untuk ditinjau.
    - q: Bagaimana Anda menangani produk yang tidak sesuai?
      a: Unit yang tidak sesuai dipisahkan, didokumentasikan, dan ditinjau sesuai proses tindakan korektif ISO 9001 kami. Analisis akar penyebab dilakukan, tindakan korektif diterapkan, dan catatan dipelihara. Pembeli dapat meninjau log NCR kami selama audit.
    - q: Dokumen kepatuhan apa yang tersedia untuk ditinjau?
      a: 'Selama audit, Anda dapat meninjau: sampel DoC spesifik model, spesifikasi pelat pembuat, registrasi HIN, draf manual pemilik, daftar standar yang berlaku, dan catatan penilaian kesesuaian per keluarga model.'
    - q: Bagaimana cara memesan tur pabrik virtual?
      a: Hubungi tim penjualan kami untuk menjadwalkan tur video langsung melalui WhatsApp, Zoom, atau Teams. Kami mengikuti rute 8 stasiun yang sama dan dapat fokus pada area spesifik berdasarkan minat Anda. Tur virtual tipikal berlangsung 45-60 menit.
    - q: Apakah pabrik ini merupakan produsen asli atau perusahaan perdagangan?
      a: Paddle Board Overstock adalah produsen asli. Kami mengoperasikan pabrik di Laixi, Qingdao. Lisensi bisnis, lingkup manufaktur, dan produksi fisik semuanya dapat diverifikasi selama audit.
    - q: Catatan kualitas apa yang bisa saya tinjau?
      a: Catatan inspeksi material masuk, titik pemeriksaan QC dalam proses, log uji tekanan, checklist inspeksi akhir 100 poin, laporan ketidaksesuaian, catatan tindakan korektif, dan catatan ketertelusuran per lambung. Semua dipelihara sesuai persyaratan ISO 9001.
