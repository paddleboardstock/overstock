direct_answer: menyediakan Paddle Board Overstock papan inflatable overstock baru SUP untuk bisnis Kenya — operator pantai dan resor di Diani, Watamu, Nyali, dan pesisir sekitar Mombasa, serta pengecer dan sekolah yang menjangkau komunitas dayung Nairobi yang terus berkembang. Pesanan grosir dimulai dari 5 papan dengan model campuran dalam satu pengiriman, dikirim dari Weihai, China melalui angkutan udara ekspres atau pengiriman laut konsolidasi. Setiap papan telah diuji tekanan 100% dan dilindungi oleh SUP Garansi 2 Tahun.
tldr_points:
  - Grosir dari 5 papan — model campuran, dihargai berdasarkan jumlah total
  - Melayani pariwisata pantai Samudra Hindia Kenya dan tambahan safari-lodge
  - Pengiriman udara ekspres atau pengiriman laut konsolidasi dari Weihai, Tiongkok
  - 100% teruji tekanan, SUP Garansi 2 Tahun untuk setiap papan
overview_section:
  tagline: Ikhtisar Pasar
  title: SUP Pasar Kenya
  paragraphs:
    - Kenya's coast is one of East Africa's great beach destinations. Diani Beach's white sand and warm lagoon water, Watamu's protected marine park, and the beaches around Mombasa host steady international tourism — and stand-up paddle fits the coast perfectly: Aktivitas air tenang yang cocok untuk tamu resor, hari-hari tanpa angin di sekolah kitesurf, dan dayung saat matahari terbenam di atas terumbu.
    - The country's safari-and-beach tourism structure creates a second, distinctive buyer: penginapan dan perkemahan menambahkan sesi dayung ke menu aktivitas mereka. Antara operator pantai, hotel, sekolah kitesurf dan selam yang memperluas penawaran, serta dunia dayung Nairobi yang kecil namun berkembang, pesanan kecil dan praktis — 5–15 papan model serba guna yang stabil dan tahan lama dengan satu atau dua edisi premium untuk dipajang.
  customer_types:
    - title: Operator Pantai
      description: Operator Diani, Watamu, dan Mombasa menambahkan SUP penyewaan dan pelajaran untuk wisatawan.
    - title: Resor & Lodge Safari dan Pantai
      description: Resor pesisir dan penginapan menambah SUP program tamu dengan armada campuran yang kompak.
    - title: Sekolah Kitesurf & Selam
      description: Sekolah olahraga air yang sudah ada memperluas penawaran mereka dengan dayung air tenang.
shipping_section:
  title: Kapal ke Kenya
  paragraphs:
    - Pesanan dikirim dari Weihai, China. Pengiriman udara ekspres membawa sampel dan 1–3 pesanan papan ke bandara Jomo Kenyatta Nairobi dan pantai; Consolidated Sea Freight melayani 5–20 pesanan grosir papan melalui pelabuhan Mombasa. Perkiraan transit untuk tujuan Anda sudah termasuk dalam penawaran Anda.
    - Kami menyediakan faktur komersial dan daftar pengemasan yang diperlukan untuk izin, dengan kode HS yang benar dan nilai yang dideklarasikan. Bea masuk dan pajak harus dibayar oleh importir sesuai aturan Kenya.
  customs_note: Konfirmasi perlakuan bea dan pajak saat ini untuk peralatan olahraga dengan agen kliring Anda sebelum memesan — struktur tarif Kenya berubah secara berkala. Kami menyediakan dokumentasi lengkap dan konsisten untuk kelancaran pembersihan.
faq_section:
  title: Kenya FAQ
  items:
    - q: Apakah dewan bisa langsung menghubungi Diani atau Waitamu?
      a: Penawaran pengiriman dari pintu ke pintu mencakup destinasi pesisir, menggunakan logistik lanjutan dari bandara kedatangan atau pelabuhan Mombasa. Catat lokasi Anda secara tepat dalam permintaan dan kami akan menentukan harga secara spesifik.
    - q: Seperti apa pesanan starter operator pantai?
      a: 'Biasanya 5–10 papan: model serba guna yang stabil untuk pelajaran dan sewa wisatawan, ditambah satu atau dua edisi premium untuk dipajang. Model campuran, satu pengiriman, dihargai berdasarkan jumlah total.'
    - q: Apakah papan ini cocok untuk laguna hangat dan air datar seperti terumbu?
      a: Ya — kondisi yang tenang, hangat, dan dangkal adalah tepat untuk semua jenis SUPs tiup serbaguna, dan sirip fleksibel serta konstruksi drop-stitch menangani pendaratan di pasir dan dataran karang dengan baik.
    - q: Bagaimana pengiriman barang dikutip ke Kenya?
      a: Pengiriman udara ekspres ke Nairobi atau pantai untuk sampel dan pesanan kecil; pengiriman laut konsolidasi ke Mombasa untuk jumlah grosir. Keduanya dijabarkan dalam kutipan Anda dengan perkiraan waktu pengiriman.
