features3_solutions:
  tagline: Solusi
  title: Petualangan Air Anda<br />Mitra Bisnis
  isBeforeContent: false
  columns: 3
  items:
    - title: Klub Olahraga Air
      description: Paket peralatan lengkap, merek khusus, dan program pemeliharaan untuk klub SUP, klub kayak, sekolah selancar, dan pusat pelatihan.
      icon: tabler:users
      link: /solutions/clubs
    - title: Olahraga Air RIBs
      description: RIBs yang dirancang khusus untuk sekolah layar, pusat olahraga air, dan organisasi acara. Perahu pelatih, perahu tarik, dan perahu marshal untuk olahraga air profesional.
      icon: tabler:speedboat
      link: /solutions/watersports
    - title: Resor & Hotel
      description: Program olahraga air premium dengan armada peralatan, sistem keselamatan, pelatihan staf, dan manajemen pendapatan untuk properti perhotelan.
      icon: tabler:beach
      link: /solutions/resorts
    - title: Wirausahawan Merek Air
      description: Pembuatan OEM/ODM label pribadi dengan MOQs rendah, desain produk khusus, kemasan, dan pengiriman global untuk pemilik merek baru.
      icon: tabler:rocket
      link: /solutions/entrepreneurs
    - title: Perahu Pusat Menyelam
      description: Platform RIB yang stabil dengan akses masuk/keluar yang mudah, penyimpanan peralatan, dan konfigurasi mesin yang dioptimalkan untuk operasi menyelam.
      icon: tabler:lifebuoy
      link: /solutions/diving-center-boats
    - title: Kapal Penyelamatan & Darurat
      description: RIBs dan perahu karet berkinerja tinggi yang dirancang untuk pencarian dan penyelamatan, tanggap darurat, dan operasi penjaga pantai.
      icon: tabler:alert-triangle
      link: /solutions/rescue-watercraft
    - title: Solusi Tender Yacht
      description: Tender RIB yang kompak dan bergaya yang melengkapi superyacht dan kapal rekreasi. Penyimpanan mudah, performa kuat.
      icon: tabler:sailboat
      link: /solutions/yacht-tender-solutions
    - title: Solusi Perahu Memancing
      description: Perahu karet stabil dan tahan lama serta RIBs yang dikonfigurasi untuk operasi memancing komersial dan rekreasi.
      icon: tabler:fish
      link: /solutions/fishing-boat-solutions
    - title: Peralatan Wisata Bahari
      description: Perahu karet siap armada, papan SUP, dan kayak untuk resor, operator tur, dan bisnis penyewaan olahraga air.
      icon: tabler:beach
      link: /solutions/marine-tourism-equipment
    - title: Energi Lepas Pantai RIBs
      description: RIBs berat untuk dukungan platform minyak dan gas, pemindahan kru ladang angin, inspeksi kabel bawah laut, dan konstruksi laut.
      icon: tabler:wind
      link: /solutions/offshore-energy
    - title: Perahu Kerja Akuakultur
      description: RIBs tahan korosi untuk budidaya ikan, kultivasi mutiara, dan peternakan laut. Tabung Hypalon, perangkat keras stainless steel, ketahanan untuk penggunaan sehari-hari.
      icon: tabler:fish
      link: /solutions/aquaculture
    - title: Riset & Survei Kelautan
      description: RIBs stabil siap alat untuk penelitian oseanografi, pemantauan lingkungan, pengambilan sampel kualitas air, dan program pengajaran universitas.
      icon: tabler:microscope
      link: /solutions/marine-research
    - title: Perahu Kerja Komersial
      description: RIBs berat untuk patroli, survei, transportasi, dan logistik lepas pantai. Dibuat untuk tuntutan ketat operasi komersial.
      icon: tabler:ship
      link: /commercial-workboats
cta:
  title: Tidak Yakin Jalur Mana yang Cocok untuk Bisnis Anda?
  subtitle: Ceritakan tentang operasi Anda — kami akan merekomendasikan paket peralatan yang tepat, program merek, atau solusi kustom.
  actions:
    - variant: primary
      text: Dapatkan Konsultasi Gratis
      href: /contact
