hero:
  tagline: Kisah Sukses
  title: Hasil Nyata dari<br />Pengembang Bisnis Air
  subtitle: Lihat bagaimana klub, resor, dan operator penyewaan di seluruh dunia membangun program olahraga air yang berkembang dengan peralatan dan dukungan Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    alt: Paddle Board Overstock kisah sukses pelanggan
stories:
  - title: Bagaimana Resor Mediterania Membangun SUP Bisnis Sewa yang Menguntungkan
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-outdoor-adventure.webp
    customer: Resor pantai bintang 5 — Yunani
    problem: Resor membutuhkan aktivitas air tamu premium untuk meningkatkan skor kepuasan dan menciptakan sumber pendapatan baru, namun kekurangan peralatan, infrastruktur keselamatan, dan keahlian staf.
    solution: Paddle Board Overstock mengirimkan 50 papan SUP yang dirancang khusus dengan warna dan logo resor, sistem keselamatan lengkap termasuk pos penjaga pantai dan garis pelampung, serta program pelatihan staf 3 hari yang mencakup penanganan peralatan, instruksi untuk tamu, dan protokol keselamatan.
    result:
      - 300+ aktivitas tamu mingguan dipesan dalam bulan pertama
      - 'Skor kepuasan tamu untuk aktivitas air: 4,8/5'
      - 'Pendapatan tambahan tahunan baru: $180K'
      - Nol insiden keselamatan di musim operasi pertama
      - Biaya penggantian peralatan dikurangi 40% dibandingkan pemasok sebelumnya
    quote:
      text: Paddle Board Overstock tidak hanya mengirim papan — mereka membantu kami membangun pengalaman tamu yang lengkap. Program olahraga air kami meningkat dari nol menjadi sorotan resor dalam satu musim.
      author: Manajer Umum Resort
    cta_text: Bangun Solusi Resort Anda
    cta_href: /solutions/resorts
  - title: Bagaimana Klub Pantai Thailand Berkembang dari 10 hingga 80 Papan
    badge: Water Sports Club
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Klub olahraga air — Thailand
    problem: Sebuah klub kecil di tepi pantai di Phuket perlu berkembang dari kegiatan hobi menjadi bisnis penyewaan profesional yang melayani wisatawan, tetapi tidak dapat menemukan pemasok peralatan yang dapat diandalkan dengan kualitas dan harga yang konsisten.
    solution: Dimulai dengan Paket Pemula Klub Paddle Board Overstock (10 papan, dayung, perlengkapan keselamatan, branding), klub ini berkembang melalui program Paket Premium selama 18 bulan.
    result:
      - Berkembang dari 10 menjadi 80 papan dalam 18 bulan dengan kualitas dan harga yang konsisten
      - Menambahkan kelas yoga dan kebugaran SUP ke jadwal mingguan
      - Branding klub yang disesuaikan meningkatkan pengenalan merek di antara wisatawan
      - Biaya perawatan berkurang 60% dibandingkan dengan peralatan anggaran sebelumnya
      - Sekarang melayani 150 penyewaan harian selama musim puncak
    quote:
      text: Paket Pemula Klub adalah titik masuk yang sempurna. Seiring pertumbuhan bisnis kami, Paddle Board Overstock tumbuh bersama kami — kualitas sama, harga sama, tidak ada kejutan.
      author: Pemilik Klub, Phuket
    cta_text: Mulai Paket Klub Anda
    cta_href: /solutions/clubs
  - title: Bagaimana Rantai Resor Karibia Menstandarisasi Olahraga Air di 5 Properti
    badge: Resort & Hospitality
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    customer: Rantai resor — Karibia
    problem: Rantai resor mewah dengan 5 properti memerlukan kualitas peralatan olahraga air yang konsisten dan branding di semua lokasi, dengan pengadaan terpusat dan perencanaan penggantian musiman.
    solution: Paddle Board Overstock mengirimkan armada multi-properti berjumlah 400 SUPs dengan merek yang seragam, inventaris suku cadang bersama, dan jadwal penggantian tahunan dengan harga volume.
    result:
      - Standarisasi pengalaman tamu di kelima properti
      - Pengurangan biaya 30% melalui pembelian terpadu dan harga volume
      - Inventaris suku cadang terpusat mengurangi downtime sebesar 80%
      - Program pembaruan peralatan tahunan menghilangkan kekacauan di akhir musim
      - Partisipasi tamu dalam olahraga air meningkat 45% dari tahun ke tahun
    cta_text: Rancang Program Resor Anda
    cta_href: /solutions/resorts
