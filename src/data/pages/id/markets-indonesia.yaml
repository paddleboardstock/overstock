hero:
  tagline: Indonesia
  title: Papan Grosir SUP untuk<br />Bisnis Indonesia
  subtitle: Toko olahraga air Bali, resor pulau, dan operator di seluruh kepulauan — papan overstock baru dari 5 unit, model campuran, dikirim dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Papan kelebihan stok untuk resor Indonesia dan toko olahraga air di Bali
direct_answer: Paddle Board Overstock menyediakan papan tiup overstock baru SUP untuk bisnis Indonesia — toko olahraga air di Bali, resor pulau dari Lombok hingga Gillis dan sekitarnya, klub pantai, dan operator penyewaan. Pesanan grosir dimulai dari 5 papan dengan model campuran dalam satu pengiriman, dikirim dari Weihai, China melalui angkutan udara ekspres atau pengiriman laut konsolidasi. Setiap papan telah diuji tekanan 100% dan dilindungi oleh SUP Garansi 2 Tahun.
tldr_points:
  - Grosir dari 5 papan — model campuran, dihargai berdasarkan jumlah total
  - Melayani ekonomi olahraga air Bali dan resor pulau di seluruh negeri
  - Rute kargo singkat China–Indonesia, udara atau laut
  - 100% teruji tekanan, SUP Garansi 2 Tahun untuk setiap papan
overview_section:
  tagline: Ikhtisar Pasar
  title: SUP Pasar Indonesia
  paragraphs:
    - Indonesia adalah salah satu ekonomi olahraga air terbesar di Asia, dan Bali adalah jantungnya. Dari klub pantai Seminyak dan Canggu hingga laguna tenang Sanur dan Nusa Dua, papan dayung muncul di mana-mana — mendayung matahari terbit di atas terumbu karang, SUP kelas yoga, tur laguna, dan program tamu hotel. Di luar Bali, Lombok, Kepulauan Gili, dan lanskap pariwisata yang berkembang di seluruh kepulauan mengikuti pola yang sama.
    - The buyers are established water sports businesses — shops that already run surf, dive, or snorkel operations and are adding SUP as a low-cost, low-risk activity line — plus villas and resorts equipping guest programs. They know equipment: daya tahan, UV performa, dan kemudahan perbaikan lebih penting daripada kilau katalog. Pesanan terdiri dari 5–20 papan, dicampur untuk pelajaran, penyewaan, dan tampilan ritel.
  customer_types:
    - title: Toko Olahraga Air Bali
      description: Operator Sanur, Seminyak, dan Canggu yang sudah mapan SUP menambah lini selancar, menyelam, dan snorkel.
    - title: Resor Pulau & Klub Pantai
      description: Resor dan klub pantai di Bali, Lombok, dan Gillis mengadakan program paddle tamu dan SUP yoga.
    - title: Operator Tur & Penyewaan
      description: Operator tur laguna dan bakau serta stan sewa setiap jam menyegarkan armada secara musiman.
shipping_section:
  title: Kapal ke Indonesia
  paragraphs:
    - Indonesia adalah salah satu jalur kargo terpendek dari basis kami di Weihai, China. Angkutan udara ekspres membawa sampel dan 1–3 pesanan papan dengan cepat ke Denpasar dan Jakarta; Pengiriman laut konsolidasi melayani 5–20 pesanan grosir papan melalui Tanjung Priok, Tanjung Benoa, dan pelabuhan lainnya. Kedua opsi tersebut dicantumkan dengan perkiraan waktu transit untuk tujuan Anda.
    - Kami menyediakan faktur komersial dan daftar pengemasan yang diperlukan untuk izin, dengan kode HS yang benar dan nilai yang dideklarasikan. Bea masuk dan pajak harus dibayar oleh importir sesuai aturan Indonesia.
  customs_note: Izin Indonesia untuk peralatan olahraga bersifat sensitif terhadap dokumentasi — bekerja sama dengan broker bea cukai Anda (PPJK) untuk mengonfirmasi perlakuan bea dan pajak saat ini. Kami menyediakan dokumen yang lengkap dan konsisten serta merespons permintaan broker dengan cepat.
faq_section:
  title: Indonesia FAQ
  items:
    - q: Seberapa cepat pengiriman dari China ke Bali?
      a: Indonesia adalah salah satu destinasi pengiriman terdekat dari Weihai. Udara ekspres ke Denpasar atau Jakarta adalah pilihan tercepat untuk sampel dan pesanan kecil; pengiriman laut konsolidasi dikutip dengan jendela transit untuk pesanan grosir. Keduanya dirinci dalam penawaran Anda.
    - q: Apakah papan ini cocok untuk digunakan sewa harian di daerah tropis UV?
      a: Ya — drop-stitch PVC konstruksi yang dinilai untuk siklus sewa harian adalah yang kami sediakan ke armada di 50+ negara. Perawatan standar (bilas setelah air garam, penyimpanan teduh) menjaga mereka tetap beroperasi selama banyak musim matahari Bali.
    - q: Seperti apa pesanan toko olahraga air?
      a: Biasanya 5–15 papan dicampur antara model all-around yang stabil untuk pelajaran dan penyewaan serta beberapa edisi seni premium untuk pajangan ritel — satu pengiriman, harga ditentukan berdasarkan jumlah total.
    - q: Bisakah Anda mendukung PPJK kami dengan dokumentasi?
      a: Ya. Setiap pesanan dikirim dengan faktur komersial dan daftar kemasan dengan kode HS dan nilai yang benar, dan kami merespons dengan cepat ketika broker Anda memerlukan dokumen tambahan.
