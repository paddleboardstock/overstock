hero:
  tagline: Paddle Board Overstock Lab Kustom
  title: Rancang Sendiri<br />Kapal
  subtitle: OEM, ODM, label pribadi, dan layanan branding kustom untuk bisnis di seluruh dunia. Dari prototipe tunggal hingga produksi penuh.
  cta: Mulai proyek Anda
  footer_link: /contact
steps_section:
  tagline: Bagaimana cara kerjanya
  title: Dari konsep ke produksi
  subtitle: Empat langkah dari ide Anda menuju produk jadi yang siap digunakan di laut.
  steps:
    - num: '01'
      title: Pilih Papan Anda
      desc: Pilih dari model inti kami — SUP, kayak, perahu karet, atau RIB. Pilih ukuran, bahan, dan warna.
    - num: '02'
      title: Unggah Desain Anda
      desc: Kirimkan kepada kami logo, karya seni, atau panduan merek Anda. Tim desain kami akan menyiapkan bukti digital.
    - num: '03'
      title: Tinjauan Mockup AI
      desc: Lihat mockup fotorealistik yang dihasilkan AI dari papan kustom Anda sebelum produksi dimulai.
    - num: '04'
      title: Produksi & Pengiriman
      desc: Setelah disetujui, pesanan Anda masuk ke jalur produksi bersertifikat ISO kami. Waktu tunggu mulai dari 30 hari.
services_section:
  tagline: Layanan
  title: Layanan manufaktur untuk merek global
  subtitle: Model keterlibatan yang fleksibel — dari manufaktur kontrak hingga pembangunan merek layanan penuh.
  items:
    - title: OEM Manufaktur
      desc: Kami memproduksi desain Anda sesuai spesifikasi — IP Anda, gambar Anda, standar kualitas Anda. Perlindungan penuh NDA.
      icon: ⚙️
    - title: Solusi ODM
      desc: Pilih dari 50+ platform terbukti dan sesuaikan ukuran, warna, grafik, dan kemasan.
      icon: 🎨
    - title: Label Pribadi
      desc: Merek Anda pada produk kami — logo, kemasan, label gantung, manual. Siap dijual langsung dari kotak.
      icon: 🏷️
    - title: Branding Kustom
      desc: Cetakan pad dek, grafis lambung, stiker tabung, dan label kustom — integrasi merek penuh.
      icon: ✨
capabilities_section:
  tagline: Kemampuan
  title: Kemampuan produksi & kustomisasi
  subtitle: Segala yang perlu Anda ketahui sebelum melakukan pemesanan.
  capabilities:
    - label: Volume pesanan
      value: MOQ 5–10 unit (SUP/kayak), 2–5 unit (RIB)
    - label: Waktu tunggu
      value: 30–45 hari standar; 15–20 hari untuk prototipe
    - label: Kustomisasi
      value: Ukuran, bentuk, warna, grafis, kemasan, perangkat keras
    - label: Bahan
      value: PVC, Hypalon, drop-stitch, fiberglass, aluminium
    - label: Pencetakan
      value: Digital (CMYK), sablon, transfer panas, sublimasi
    - label: Sertifikasi
      value: CE, ISO 9001, BSCI, UKCA (mendukung kepatuhan global)
why_section:
  tagline: Mengapa Paddle Board Overstock
  title: Satu pabrik. Satu standar. Tanpa kompromi.
  points:
    - text: Fasilitas manufaktur terintegrasi seluas 12.000 m²
      highlight: 12.000 m²
    - text: 200-300 pekerja terampil dan insinyur
      highlight: 200-300
    - text: 15.000 perahu diproduksi setiap tahun
      highlight: 15,000
    - text: ISO manajemen kualitas bersertifikat 9001
      highlight: ISO 9001
    - text: Produk CE bersertifikat untuk pasar UE
      highlight: CE
  cta: Lihat detail pabrik
  cta_link: /factory
  contact:
    title: Siap untuk mendiskusikan proyek Anda?
    desc: Tim kami merespons dalam 24 jam dengan penawaran awal.
