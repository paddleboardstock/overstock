content_challenge:
  tagline: Tantangan
  title: Kebutuhan Perahu Memancing<br />Stabilitas, Jangkauan & Daya Tahan
  subtitle: Apakah Anda mengoperasikan kapal perikanan komersial, mengelola armada koperasi, atau menjalankan charter memancing — perahu Anda harus dapat berfungsi secara andal setiap hari.
  paragraphs:
    - Perahu memancing membutuhkan platform yang stabil untuk menarik jaring, menangani hasil tangkapan, dan bergerak di dek dengan aman. Inflatable dan RIBs menawarkan stabilitas bawaan melalui desain tabung mereka — keuntungan signifikan dibandingkan lambung kaku dengan panjang serupa.
    - Efisiensi bahan bakar penting untuk operasi memancing di mana biaya operasional langsung memengaruhi profitabilitas. RIBs dan perahu inflatable lebih ringan daripada perahu kaku setara, membutuhkan daya lebih sedikit dan mengonsumsi lebih sedikit bahan bakar — hal ini krusial bagi operator komersial yang menjalankan perahu setiap hari dan koperasi yang mengelola anggaran armada.
    - Daya tahan di lingkungan laut sangat penting. Paparan air asin, UV, dan penggunaan terus-menerus menuntut bahan yang dapat bertahan dalam kondisi keras tanpa degradasi. Bagi operator komersial dan koperasi, keandalan secara langsung memengaruhi pendapatan — perahu rusak berarti kehilangan hari tangkapan.
    - Konfigurasi memancing Aquafarer termasuk dudukan joran, fishfinder, sumur umpan, livewell, dan solusi penanganan kargo yang dirancang untuk aplikasi memancing serius di operasi komersial, koperasi, dan rekreasi.
content_solution:
  tagline: Solusi Kami
  title: Konfigurasi Siap Memancing
  subtitle: Setiap perahu memancing Aquafarer dapat dikonfigurasi untuk aplikasi memancing spesifik Anda.
  list:
    - Pemasangan dudukan joran — dipasang pabrik atau siap untuk pemasangan tambahan
    - Pelat pemasangan Fishfinder/GPS di posisi konsol
    - Opsi bait well atau livewell untuk operator charter dan komersial
    - Konfigurasi pendingin/penyimpanan untuk penanganan hasil tangkapan
    - Lambung Deep-V untuk kemampuan lepas pantai — stabil saat diam, halus saat kecepatan tinggi
    - PVC atau Hypalon pilihan tabung — Hypalon untuk paparan UV yang lebih panjang
    - Rentang luarboard dari 15 HP hingga 115 HP tergantung model dan aplikasi
content_segments:
  tagline: Profil Memancing
  title: Solusi Perahu Memancing Karet Inflatable<br />Berdasarkan Jenis Operator
  subtitle: Dari memancing olahraga di perairan dekat pantai hingga commercial longlining — operasi memancing yang berbeda membutuhkan konfigurasi lambung, rentang daya, dan pengaturan di dek yang berbeda. Kami menyesuaikan setiap perahu agar sesuai dengan perikanan, perairan, dan gaya kerja.
  items:
    - title: Perusahaan Perikanan Komersial
      subtitle: Kapal kerja armada untuk operasi memancing harian, penanganan jaring, transportasi hasil tangkapan
      description: Perusahaan perikanan komersial mengoperasikan kapal kerja untuk pemasangan dan penarikan jaring, servis perangkap, longlining, dan transportasi hasil tangkapan. Kapal-kapal ini bekerja setiap hari di lingkungan air asin dan harus tahan terhadap beban berat, penanganan dek yang konstan, dan jam kerja yang panjang. Efisiensi bahan bakar dan perawatan rendah sangat penting untuk profitabilitas armada. Kapal harus menyediakan platform kerja yang stabil bagi kru dalam menangani peralatan dan tangkapan di berbagai kondisi laut.
      features:
        - Layout dek datar untuk penanganan jaring, penumpukan perangkap, dan penyimpanan ikan
        - Outboard 40-115 HP yang hemat bahan bakar untuk biaya operasi harian rendah
        - Tabung Hypalon yang kuat untuk ketahanan terhadap abrasi dalam penggunaan harian
        - Rubbing strakes yang diperkuat untuk kontak yang sering dengan dermaga dan kapal
        - Dek self-bailing untuk mudah dicuci setelah operasi
        - Harga armada dan spesifikasi konsisten untuk operator multi-kapal
    - title: Operator Memancing Karakter Sewa
      subtitle: Kenyamanan multi-penumpang, penanganan hasil tangkapan, sertifikasi keselamatan
      description: Operator yang menjalankan charter memancing setengah hari dan sehari penuh — dari memancing di terumbu dekat pantai hingga memancing dasar lepas pantai. Perahu Anda memerlukan tempat duduk untuk penumpang dengan sertifikasi keselamatan, ruang dek luas untuk beberapa pemancing, dan livewells terintegrasi untuk menjaga umpan dan hasil tangkapan tetap segar selama perjalanan. Kenyamanan tamu langsung memengaruhi ulasan perjalanan, pemesanan ulang, dan rating online.
      features:
        - Kemudi konsol dengan kursi ember peredam guncangan
        - Pemegang joran terpasang pabrik (4-8 posisi)
        - Rentang outboard 60–115 HP untuk kecepatan jelajah lepas pantai
        - Sertifikasi Kategori C atau B CE untuk operasi penumpang komersial
        - Tenda Bimini atau T-top untuk kenyamanan tamu pada perjalanan panjang
    - title: Nelayan Artisanal & Skala Kecil Komersial
      subtitle: Kapal kerja yang andal untuk mata pencaharian harian
      description: Nelayan independen yang mengandalkan perahu mereka sebagai sumber pendapatan utama — memasang jaring, merawat perangkap ikan, atau memancing tangan di dekat pantai. Prioritas Anda adalah efisiensi bahan bakar, perawatan sederhana yang bisa dilakukan sendiri, dan perahu yang menangani beban tangkapan dan peralatan sedang tanpa mengorbankan stabilitas.
      features:
        - Outboard hemat bahan bakar 15–40 HP untuk biaya operasi rendah
        - Tabung Hypalon CSM untuk paparan UV yang lebih panjang dan ketahanan terhadap abrasi
        - Layout dek datar untuk penanganan jaring dan penyimpanan ikan
        - Kemampuan pendaratan mudah di pantai dengan perlindungan lambung inflatable
    - title: Koperasi Perikanan
      subtitle: Koleksi tangkapan, transportasi anggota, distribusi pasokan
      description: Koperasi perikanan mengoperasikan armada berbasis komunitas untuk mengumpulkan tangkapan dari nelayan anggota, mengangkut pasokan ke komunitas perikanan terpencil, dan mendistribusikan hasil panen ke pasar. Kapal kerja ini membutuhkan kapasitas muatan yang tinggi, operasi harian yang andal, dan perawatan yang mudah di lokasi terpencil. Koperasi sering beroperasi di wilayah berkembang di mana ketersediaan suku cadang dan akses layanan terbatas, sehingga konfigurasi outboard yang sederhana dan konstruksi yang tahan lama sangat penting.
      features:
        - Kapasitas muatan tinggi untuk mengangkut tangkapan dan persediaan
        - Konfigurasi outboard sederhana untuk perawatan mudah di lokasi
        - Konstruksi PVC atau Hypalon yang tahan berat untuk fleksibilitas anggaran
        - Dek datar dengan titik pengikat untuk mengamankan kargo
        - Operasi hemat bahan bakar yang meminimalkan biaya operasional koperasi
    - title: Penggemar Olahraga & Memancing
      subtitle: Performa dan gaya untuk pemancing serius
      description: Pemancing berpengalaman yang mencari platform memancing yang mampu memberikan kecepatan ke lokasi jauh, posisi bertarung berdiri yang stabil, dan kualitas penyelesaian premium. Perahu ini harus terasa nyaman baik saat berlayar dua mil di lepas pantai menuju terumbu maupun menjelajahi perairan estuari terpencil.
      features:
        - Lambung Deep-V RIB untuk perjalanan yang halus di ombak
        - Plat pemasangan Fishfinder/GPS sudah dipasang kabel di konsol
        - Baitwell dan pendingin terintegrasi ke dalam modul kursi belakang
        - Opsi warna dek EVA kustom yang sesuai dengan grafik perahu/tiup
    - title: Panduan Memancing & Operator Wisata Ekowisata
      subtitle: Pengalaman memancing dengan pemandu untuk pemancing yang berkunjung
      description: Pemandu yang membawa kelompok kecil pemancing pengunjung ke lokasi memancing yang produktif — sering menggabungkan memancing dengan elemen ekowisata seperti mengamati burung atau menjelajahi mangrove. Perahu harus tetap kering dan nyaman bagi tamu yang tidak terbiasa dengan perahu kecil, dengan akses naik yang mudah dan pilihan tempat teduh.
      features:
        - Titik pemasangan atap Bimini atau T-top yang dipasang pabrik
        - Tangga naik kapal yang halus untuk naik kembali dengan mudah
        - Kapal motor tempel 4-tak yang tenang untuk meminimalkan gangguan
        - Kompartemen penyimpanan kering untuk telepon tamu, dompet, kamera
