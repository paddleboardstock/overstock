hero:
  tagline: Pusat Penelitian dan Pengembangan
  title: Pusat R & D
  subtitle: Fokus pada Kemajuan
intro:
  - Pusat Penelitian dan Pengembangan (R&D) Aquafarer adalah kekuatan pendorong di balik misi kami untuk merevolusi peralatan olahraga air. Kami memberdayakan para penggemar olahraga air di seluruh dunia dengan produk yang lebih aman, nyaman, dan menyenangkan melalui inovasi tanpa henti dalam papan dayung tiup berdiri (SUPs) dan perahu. Tim kami yang berdedikasi, terdiri dari insinyur, desainer, dan ahli olahraga air yang bersemangat, sedang membentuk masa depan industri ini, secara konsisten meningkatkan standar kualitas, kinerja, dan keberlanjutan.
  - Fasilitas R&D kami mengumpulkan ilmuwan material, arsitek kapal, dan insinyur produksi di bawah satu atap. Mulai dari perumusan bahan dan simulasi lambung kapal hingga pengembangan proses pengelasan dan uji coba laut skala penuh, setiap tahap pengembangan produk didorong oleh data dan divalidasi melalui pengujian.
mission:
  tagline: Misi Kami
  title: Menciptakan Inovasi Masa Depan Olahraga Air
  pillars:
    - icon: lightning
      title: Kemajuan Teknologi
      desc: Menciptakan material, desain, dan manufaktur baru untuk kinerja produk dan umur panjang yang superior.
    - icon: design
      title: Desain Berpusat Pada Pengguna
      desc: Memahami secara mendalam dan melampaui kebutuhan pengguna melalui desain produk yang ergonomis dan intuitif.
    - icon: globe
      title: Praktik Berkelanjutan
      desc: Meminimalkan jejak lingkungan kita dengan memanfaatkan bahan dan proses yang ramah lingkungan.
    - icon: shield
      title: Keselamatan Tanpa Kompromi
      desc: Menjamin standar keselamatan tertinggi melalui pengujian dan sertifikasi yang ketat.
pillars:
  - title: Kemajuan Teknologi
    desc: Merintis bahan, desain, dan proses manufaktur baru untuk memberikan kinerja produk yang superior dan umur panjang.
    icon: tech
  - title: Material Lanjut
    desc: Menyelidiki PVC, Hypalon, komposit, dan alternatif berkelanjutan yang mutakhir untuk meningkatkan karakteristik produk.
    icon: materials
  - title: Keberlanjutan
    desc: 'Komitmen Inti: Kami berkomitmen terhadap pengelolaan lingkungan melalui manufaktur yang berkelanjutan dan bahan yang dapat didaur ulang.'
    icon: sustainability
capabilities:
  tagline: Kemampuan
  title: Kemampuan R&D
  subtitle: Empat disiplin inti yang memberi kita kontrol menyeluruh atas pengembangan produk — dari penelitian bahan baku hingga sertifikasi akhir.
  groups:
    - title: Ilmu Material & Teknologi Kain
      items:
        - Analisis dan optimasi formulasi PVC dan Hypalon
        - pengembangan aditif stabilisasi, tahan api, dan anti-mikroba
        - Rekayasa laminasi dan adhesi kain berlapis banyak
        - Pengujian penuaan dipercepat (UV, termal, kelembapan, semprotan garam)
    - title: Rekayasa Lambung & Hidrodinamika
      items:
        - Desain lambung 3D parametrik dan optimasi CFD
        - Analisis elemen hingga untuk beban struktural dan benturan
        - Pengujian tangki penarik model skala dan validasi kinerja
        - Pengembangan lambung khusus untuk profil misi khusus
    - title: Teknologi Pengelasan & Penyambungan
      items:
        - Pengembangan dan optimisasi proses pengelasan RF dielektrik
        - Metode pengelasan udara panas, pahat panas, dan ultrasonik
        - Kualifikasi perekat dan pita sambungan
        - Pemodelan kekuatan las dan prediksi umur
    - title: Pengujian, Sertifikasi & Kepatuhan
      items:
        - Manajemen kualitas dan pengujian kepatuhan CE
        - Dukungan pengujian dan sertifikasi pihak ketiga independen
        - Pengembangan protokol uji khusus untuk kualifikasi pengadaan
        - Analisis kegagalan dalam layanan dan penyelidikan penyebab utama
