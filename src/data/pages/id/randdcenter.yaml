rd_services:
  tagline: R&D Khusus
  title: Layanan R&D untuk Mitra
  services:
    - title: Pengembangan Material Khusus
      desc: Kami mengembangkan formulasi kain khusus, tumpukan laminasi, dan sistem perekat yang disesuaikan dengan lingkungan operasi dan target kinerja Anda.
    - title: OEM / ODM Rekayasa Produk
      desc: Dari sketsa konsep hingga paket rekayasa siap produksi — tim kami dapat merancang, membuat prototipe, dan memvalidasi kapal di bawah merek Anda.
    - title: Pengujian & Sertifikasi Pihak Ketiga
      desc: Gunakan fasilitas pengujian yang sesuai ISO kami untuk pengujian material independen, validasi produk, dan dukungan sertifikasi.
  cta: Diskusikan kebutuhan R&D Anda →
  cta_link: /contact
vision:
  tagline: Visi Kami
  title: Membentuk Masa Depan Olahraga Air
  body: Aquafarer berusaha memimpin industri perahu karet dan SUP melalui inovasi berkelanjutan, kualitas yang tak tergoyahkan, serta komitmen teguh terhadap keselamatan dan keberlanjutan — pada akhirnya memperkaya pengalaman para penggemar olahraga air di seluruh dunia. Pusat R&D Aquafarer adalah tempat di mana gairah bertemu inovasi, menetapkan standar baru bagi industri olahraga air.
labs_section:
  tagline: Laboratorium
  title: Laboratorium Kami
  labs:
    - image: https://assets.aquafarer.com/images/aquafarer/randd/aquafarer-pvc-material-lab.webp
      title: PVC Lab Kain
      description: Penelitian dan pengujian terus-menerus terhadap kain tabung PVC dan Hypalon untuk kekuatan tarik, ketahanan UV, abrasi, dan fleksibilitas pada suhu rendah guna memastikan keandalan jangka panjang di lingkungan laut.
      href: /randdcenter/pvc-fabric-lab
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
      title: Studio Rekayasa Lambung
      description: Desain berbasis CAD dan analisis elemen hingga pada lambung HDPE, aluminium, dan fiberglass. Setiap lambung disimulasikan secara digital untuk distribusi tekanan dan ketahanan benturan sebelum prototipe pertama dibuat.
      href: /randdcenter/hull-engineering
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-sup-manufacturing-3.webp
      title: Pusat Pengelasan RF
      description: Fasilitas pengelasan frekuensi radio khusus dengan kontrol suhu dan tekanan yang presisi, menghasilkan sambungan yang kuat dan kedap udara yang memenuhi standar industri kelautan untuk kapal tiup.
      href: /randdcenter/rf-welding
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-original.webp
      title: Tangki Uji Hidrodinamika
      description: Pengujian model skala di tangki uji internal kami untuk mengoptimalkan bentuk lambung, kinerja meluncur, stabilitas, dan efisiensi bahan bakar di berbagai kondisi muatan dan laut.
      href: /randdcenter/hydrodynamic-test-tank
    - image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      title: Lokakarya Prototipe
      description: Fasilitas prototyping dan rigging skala penuh di mana model-model baru dibuat, dipasang, dan diuji di laut. Setiap prototipe menjalani program uji di air minimal 20 jam sebelum disetujui untuk produksi.
      href: /randdcenter/prototype-workshop
    - image: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-uv-resistance-testing.webp
      title: Laboratorium Kualitas & Inspeksi
      description: Laboratorium jaminan kualitas khusus yang melakukan pengujian tarik, siklus penahanan udara, pengujian pelepasan jahitan, dan sertifikasi material untuk memastikan setiap perahu yang keluar dari bengkel memenuhi spesifikasi yang kami publikasikan.
      href: /randdcenter/quality-inspection-lab
