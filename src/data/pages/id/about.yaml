hero:
  tagline: Tentang kami
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock pabrik dan bengkel
  title: Tentang <span class="text-accent dark:text-white">Overstock Papan Dayung</span>
  subtitle: Papan SUP tiup baru dengan harga overstock dan clearance — didukung oleh manufaktur Weihai kami sendiri sejak 2012, grosir model campuran untuk pengecer kecil, dan pengiriman ke seluruh dunia yang fleksibel.
stats:
  title: Berdasarkan angka
  columns: 4
  stats:
    - title: Kapasitas produksi tahunan
      amount: 15,000 units
    - title: Negara pengiriman
      amount: 50+
    - title: Tekanan papan yang diuji
      amount: 100%
    - title: Insinyur R&D
      amount: 14+
features3_what_we_build:
  title: Yang kami buat
  subtitle: Lini produk yang fokus dan kami pahami sepenuhnya — tidak ada eksperimen setengah jadi, tidak ada rekayasa lencana.
  columns: 3
  isBeforeContent: true
  items:
    - title: Papan SUP TIUP
      description: Sup all - around dan touring dari 10' hingga 12 kaki. Stabil, kaku, dan lengkap dengan pompa, dayung, dan tali pengikat.
      icon: tabler:swimming
    - title: Dek seri seni
      description: Karya seni dek EVA khas — Cheetah Surge, Tropical Breeze, Medusa Glow, dan banyak lagi.
      icon: tabler:hexagons
    - title: Paket lengkap
      description: 'Setiap papan dikirim sebagai kit lengkap: papan, ransel, pompa, dayung, sirip, tali pengikat, dan kit perbaikan.'
      icon: tabler:package
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Aksesori
      description: Pompa, dayung, tali pengikat, peralatan perbaikan, dan kantong kering. Semua dicocokkan dengan papan kami.
      icon: tabler:tool
    - title: Perawatan & perbaikan
      description: Dukungan perbaikan di rumah, suku cadang, dan panduan pemeliharaan untuk menjaga papan Anda tetap di atas air selama bertahun - tahun.
      icon: tabler:settings
    - title: Armada klub & rental
      description: Perlengkapan massal untuk klub, sekolah, dan armada sewaan dengan dukungan pabrik langsung.
      icon: tabler:users
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-design-discussion-2.webp
    alt: Diskusi desain dan rekayasa papan
steps2_values:
  title: Nilai-nilai kami
  subtitle: Tiga prinsip yang telah membentuk setiap produk sejak hari pertama.
  items:
    - title: Bangun seakan membawa keluarga Anda
      description: Setiap papan, jahitan, dan katup diperlakukan seolah - olah keluarga kita sendiri yang akan menggunakannya.
      icon: tabler:heart
    - title: Insinyur sebelum kami menjual
      description: Jika spesifikasi salah, kami mengubah spesifikasi — bukan pelanggan.
      icon: tabler:settings
    - title: Dukungan yang bertahan lebih lama dari garansi
      description: Papan yang kami buat bertahun - tahun yang lalu masih menghubungi kami untuk suku cadang, dan kami masih mengambilnya.
      icon: tabler:headset
steps2_milestones:
  title: Tonggak Sejarah
  subtitle: Versi singkat dari cerita Paddle Board Overstock.
  isReversed: true
  items:
    - title: Didirikan di Weihai
      description: Bengkel pesisir yang didedikasikan untuk papan SUP tiup drop - stitch.
      icon: tabler:building-factory
    - title: Kampus produksi seluas 12.000 m²
      description: Diperluas ke fasilitas khusus dengan pengelasan RF dan kapasitas produksi drop - stitch.
      icon: tabler:circle-check
    - title: Program ekspor internasional
      description: Sekarang dikirim ke 50+ negara dengan opsi pengiriman ekspres dan laut.
      icon: tabler:world
    - title: Overstock & fokus grosir
      description: Pada bulan September 2026, operasi merek dipindahkan dari Qingdao Vatrad Group ke Weihai Dongjilian Co., Ltd.; pusat manufaktur Weihai melanjutkan R&D, produksi, dan pengiriman langsung pabrik.
      icon: tabler:building-skyscraper
features2_locations:
  title: Lokasi kami
  tagline: Temukan kami
  columns: 3
  items:
    - title: Kantor pusat & bengkel
      description: Taman industri pesisir, gedung 4 — buka Senin–Jumat dengan janji kunjungan.
    - title: Pusat layanan UE
      description: Pelabuhan Mediterania — penyetelan ulang, perbaikan, dan dukungan garansi untuk pelanggan Eropa.
    - title: Jaringan mitra APAC
      description: Mitra layanan resmi di Australia, Jepang, Singapura, dan Hong Kong.
brand_hub_tagline: Merek
brand_hub_title: Jelajahi Merek Kami
brand_hub_subtitle: Selami lebih dalam keahlian teknik kelautan kami, kehadiran global, dan prinsip yang mendorong kami.
brand_hub_cards:
  - title: Keahlian Kelautan
    desc: Dekade ilmu material, manufaktur presisi, dan pengujian dunia nyata — dari inti drop — stitch hingga jahitan yang dilas dan dek seri seni.
    link: /brand-marine-expertise
    link_label: Pelajari lebih lanjut →
  - title: Mengapa Paddle Board Overstock
    desc: Harga langsung pabrik, papan uji tekanan 100%, dan garansi 2 tahun — dibuat untuk pendayung, keluarga, dan pecinta olahraga air.
    link: /brand-why-paddleboardoverstock
    link_label: Pelajari lebih lanjut →
