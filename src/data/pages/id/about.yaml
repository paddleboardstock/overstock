hero:
  tagline: Tentang kami
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-factory-building.webp
    alt: Aquafarer pabrik dan bengkel
  title: |
    Teknik kelautan,<br />
    membangun<span class="text-accent dark:text-white">Aquafarer</span>cara
  subtitle: 'Kami memulai di sebuah bengkel di pantai dengan satu perahu dan keyakinan yang teguh: produk kelautan harus direkayasa seakan sangat penting, karena memang begitu. Saat ini kami mengirim ke lebih dari 50 negara, tetapi setiap lambung tetap melewati tangan yang sama yang memulai perusahaan ini.'
stats:
  title: Berdasarkan angka
  columns: 4
  stats:
    - title: Lambung yang dikirim
      amount: 2,400+
    - title: Negara pengiriman
      amount: 50+
    - title: Tahun pengalaman gabungan
      amount: '60'
    - title: Rata-rata respon garansi (jam)
      amount: '24'
features3_what_we_build:
  title: Yang kami buat
  subtitle: Lini produk yang fokus dan kami pahami sepenuhnya — tidak ada eksperimen setengah jadi, tidak ada rekayasa lencana.
  columns: 3
  isBeforeContent: true
  items:
    - title: RIB perahu
      description: Lambung aluminium RIBs dari 3,3 m hingga 7,5 m. Dirancang untuk patroli, menyelam, memancing, dan penggunaan keluarga.
      icon: tabler:ship
    - title: Perahu karet
      description: PVC dan Hypalon perahu karet dari 2,4 m hingga 4,2 m. Ringan, tangguh, dan mudah disimpan.
      icon: tabler:speedboat
    - title: Tender superyacht
      description: RIBs kompak, spesifikasi tinggi dan dibangun khusus agar sesuai dengan tampilan kapal induk Anda.
      icon: tabler:crown
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Aksesori
      description: Dayung, pompa, penutup, tas kering, tangki bahan bakar, dan elektronik. Semua sesuai dengan perahu kami.
      icon: tabler:package
    - title: Perbaikan & renovasi
      description: Penggantian tabung, retrofit elektronik, dan peningkatan mesin dilakukan di dalam rumah.
      icon: tabler:tool
    - title: Pembuatan khusus
      description: Desain proyek demi proyek untuk pelanggan komersial, ilmiah, dan militer.
      icon: tabler:hammer
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-design-discussion-2.webp
    alt: Diskusi desain dan rekayasa perahu
steps2_values:
  title: Nilai-nilai kami
  subtitle: Tiga prinsip yang telah membentuk setiap produk sejak hari pertama.
  items:
    - title: Bangun seakan membawa keluarga Anda
      description: Setiap lambung, pengelasan, dan pengikat diperlakukan seolah-olah keluarga kami sendiri yang akan menggunakannya.
      icon: tabler:heart
    - title: Insinyur sebelum kami menjual
      description: Jika spesifikasi salah, kami mengubah spesifikasi — bukan pelanggan.
      icon: tabler:settings
    - title: Dukungan yang bertahan lebih lama dari garansi
      description: Lambung berusia dua puluh tahun masih menghubungi kami untuk suku cadang, dan kami masih menanggapi.
      icon: tabler:headset
steps2_milestones:
  title: Tonggak Sejarah
  subtitle: Versi singkat dari cerita Aquafarer.
  isReversed: true
  items:
    - title: Didirikan di bengkel pesisir
      description: Dimulai oleh dua arsitek kapal dengan mesin CNC dan ide keras kepala.
      icon: tabler:building-factory
    - title: 1.000 lambung pertama terkirim
      description: Dicapai pada tahun ketujuh kami, sebagian besar melalui rekomendasi dan pelanggan tetap.
      icon: tabler:circle-check
    - title: Program ekspor internasional
      description: Sekarang mengirim ke 50+ negara dengan mitra dukungan lokal di lima benua.
      icon: tabler:world
    - title: Struktur operasi global baru
      description: Pada September 2026, operasi merek dipindahkan dari Qingdao Vatrad Group ke Aquafarer LLC (New Mexico, AS); pusat manufaktur Qingdao tetap melanjutkan R&D, produksi, dan ekspor langsung dari pabrik.
      icon: tabler:building-skyscraper
features2_locations:
  title: Lokasi kami
  tagline: Temukan kami
  columns: 3
  items:
    - title: Kantor pusat & bengkel
      description: Taman industri pesisir, gedung 4 — buka Senin–Jumat dengan janji kunjungan.
    - title: Pusat layanan UE
      description: Pelabuhan Mediterania — penyetelan ulang, perbaikan, dan dukungan garansi untuk pelanggan Eropa.
    - title: Jaringan mitra APAC
      description: Mitra layanan resmi di Australia, Jepang, Singapura, dan Hong Kong.
brand_hub_tagline: Merek
brand_hub_title: Jelajahi Merek Kami
brand_hub_subtitle: Selami lebih dalam keahlian teknik kelautan kami, kehadiran global, dan prinsip yang mendorong kami.
brand_hub_cards:
  - title: Keahlian Kelautan
    desc: Puluhan tahun ilmu material, manufaktur presisi, dan pengujian dunia nyata — dari fabrikasi PVC/Hypalon hingga desain lambung deep-V dan teknologi drop-stitch.
    link: /brand-marine-expertise
    link_label: Pelajari lebih lanjut →
  - title: Kehadiran Global
    desc: Pengiriman ke 50+ negara dari fasilitas kami di Qingdao dengan mitra layanan resmi di seluruh Eropa, Asia-Pasifik, dan Amerika.
    link: /brand-global-presence
    link_label: Pelajari lebih lanjut →
  - title: Mengapa Aquafarer
    desc: Integrasi vertikal, sertifikasi ganda (ISO 9001 + BSCI), kepatuhan CE, dan MOQs rendah — dibangun untuk merek, distributor, dan lembaga pemerintah.
    link: /brand-why-aquafarer
    link_label: Pelajari lebih lanjut →
production_section:
  tagline: Keunggulan Produksi
  title: Menjamin Keterampilan Kerajinan yang Sempurna
  description: Lini produksi Aquafarer didedikasikan untuk memproduksi produk perahu karet tiup berkualitas tinggi, tahan lama, dan berperforma tinggi.
  cards:
    - title: Tim Teknisi Berpengalaman
      items:
        - Pengetahuan profesional tentang PVC, Hypalon, dan material laut
        - Ketekunan dalam memotong, menyambung, dan pemasangan aksesori
        - Pelatihan berkelanjutan untuk menguasai teknologi produksi terbaru
    - title: Peralatan Produksi Canggih
      items:
        - CNC peralatan pemotong untuk pemotongan kain yang presisi dengan kesalahan minimal
        - Perekat panas/dingin presisi tinggi untuk sambungan yang kedap udara dan tahan lama
        - Peralatan pengujian kedap udara dan tarik profesional
    - title: Sistem Manajemen Matang
      items:
        - Proses produksi yang distandarisasi dengan standar kualitas yang jelas
        - Filosofi produksi ramping yang mengurangi limbah dan meningkatkan efisiensi
        - Manajemen rantai pasok yang efisien dengan kemitraan pemasok yang terpercaya
    - title: Kontrol Kualitas yang Ketat
      items:
        - sistem manajemen mutu bersertifikat
        - 'Pemeriksaan multi-tahap: bahan baku, dalam proses, keluar akhir'
        - Pengujian ketat terhadap kedap udara dan daya tahan sebelum pengiriman
global_ops_section:
  tagline: Arsitektur Operasi Global
  title_html: Satu merek,<span class="text-white/90">dua hub</span>
  description_html: Sejak September 2026, Aquafarer telah dijalankan oleh<strong class="text-white">Aquafarer LLC</strong>(New Mexico, USA) — entitas global untuk distribusi, penjualan komersial B2B, kontrak, penagihan, dan layanan purna jual. R&D, produksi, dan kontrol kualitas tetap berada di<strong class="text-white">Aquafarer Pusat Manufaktur Qingdao</strong>, yang mengirim setiap pesanan langsung dari pabrik, FOB Qingdao. Peralihan ini mengubah siapa yang menandatangani kontrak Anda — bukan siapa yang membuat perahu Anda.
  stats:
    - value: 2,400+
      label: Lambung dikirim secara global
    - value: 50+
      label: Negara-negara yang mengekspor
    - value: 10+
      label: Tahun-tahun pembuatan
