label: Jaminan
headline: Paddle Board Overstock Garansi Terbatas Produsen
subtitle: Paddle Board Overstock menjamin kualitas setiap papan SUP tiup yang kami buat. Garansi Terbatas ini menetapkan syarat dan cakupan untuk papan Paddle Board Overstock Anda.
seo:
  headline: Paddle Board Overstock Garansi SUP — Garansi Terbatas 2 Tahun | Paddle Board Overstock
  description: Paddle Board Overstock menawarkan garansi terbatas 2 tahun yang mencakup sambungan drop-stitch, konstruksi rel, katup inflasi, dan aksesoris yang disertakan pada setiap papan SUP. Syarat dan ketentuan lengkap.
  datePublished: 2024-01-01
  dateModified: 2026-11-02
body: |-
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Garansi Terbatas ini berlaku untuk papan Paddle Board Overstock bermerek baru yang dibeli langsung dari toko online Paddle Board Overstock. Tanggal efektif adalah tanggal verifikasi pembelian asli.
    </p>

    <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
      <h2 class="text-xl font-bold mb-3">Cakupan & Durasi Garansi</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Tahun</h3>
          <p class="text-sm text-gray-600 mt-1">Drop-stitch struktur inti & dek</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Tahun</h3>
          <p class="text-sm text-gray-600 mt-1">Konstruksi Rel & Sambungan</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Tahun</h3>
          <p class="text-sm text-gray-600 mt-1">Fungsi katup inflasi</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-sky-700 dark:text-sky-400">2 Tahun</h3>
          <p class="text-sm text-gray-600 mt-1">Aksesoris yang disertakan (pompa, dayung, tali pengaman, sirip)</p>
        </div>
        <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
          <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Tahun*</h3>
          <p class="text-sm text-gray-600 mt-1">Penggunaan komersial, penyewaan, atau armada — semua komponen</p>
        </div>
      </div>
      <p class="text-xs text-gray-500 mt-4">*Penggunaan komersial, penyewaan, atau armada mengurangi garansi menjadi 1 tahun. Penggunaan untuk balapan atau kompetisi membatalkan garansi sepenuhnya.</p>
    </div>

    <h2>Apa yang Dicakup</h2>
    <h3>Drop-Stitch Struktur Inti & Dek (2 Tahun)</h3>
    <p>Inti drop-stitch internal dan struktur luar papan dijamin terhadap cacat produksi yang mengganggu kemampuan papan untuk mempertahankan inflasi dan kekakuan yang operasional.</p>

    <h3>Konstruksi Rel & Sambungan (2 Tahun)</h3>
    <p>Sambungan dan pita rel tiga lapis, yang digabungkan selama proses produksi, dijamin terhadap cacat produksi yang mengakibatkan kebocoran udara yang signifikan melalui sambungan. Inspeksi berkala dan pemeliharaan tekanan inflasi yang tepat adalah syarat cakupan.</p>

    <h3>Fungsi Katup Inflasi (2 Tahun)</h3>
    <p>Katup inflasi udara yang dipasang oleh Paddle Board Overstock dijamin bebas dari cacat pembuatan pada bahan atau pengerjaan yang mencegah katup menahan udara sesuai desain.</p>

    <h3>Aksesoris yang Disertakan (2 Tahun)</h3>
    <p>Pompa, dayung yang dapat disesuaikan, tali pengaman, sirip yang dapat dilepas, dan komponen lain yang disertakan dengan paket papan Anda dijamin terhadap cacat bahan dan pengerjaan.</p>

    <h2>Apa yang Tidak Dicakup</h2>
    <ul>
      <li>Cacat kosmetik termasuk perubahan warna, noda, memudar, mengapung kapur, atau perubahan tampilan lainnya</li>
      <li>Tusukan, sayatan, robekan, robekan, atau kerusakan fisik lainnya</li>
      <li>Mengalami kekacauan, retak, abrasi, goresan, atau kerusakan akibat gesekan atau kontak</li>
      <li>Degradasi akibat UV paparan cahaya, pelapukan, atau kondisi atmosfer</li>
      <li>Kerusakan akibat kontak dengan pelarut, asam, alkali, atau bahan kimia</li>
      <li>Kerusakan akibat kelalaian, penggunaan yang tidak semestinya, penyalahgunaan, kecelakaan, atau keausan normal</li>
      <li>Kerusakan akibat benturan, tekanan, dukungan yang tidak tepat, atau transportasi</li>
      <li>Kerusakan akibat inflasi/deflasi yang tidak tepat atau penggunaan perangkat inflasi yang tidak disetujui</li>
      <li>Peralatan, komponen, atau sistem pihak ketiga (yang ditanggung oleh produsen masing-masing)</li>
    </ul>

    <h2>Kewajiban &amp; Solusi dari Pabrikan</h2>
    <p>Kewajiban tunggal dan eksklusif Paddle Board Overstock adalah memperbaiki atau mengganti, menurut pilihan Paddle Board Overstock, setiap komponen yang ditentukan cacat dalam bahan atau pengerjaan dan tercakup dalam garansi ini. Perbaikan atau penggantian dilakukan oleh Paddle Board Overstock atau fasilitas layanan yang ditunjuk. Komponen yang diperbaiki atau diganti dijamin hanya untuk sisa masa garansi asli yang belum habis.</p>

    <h2>Ketentuan Garansi</h2>
    <ul>
      <li><strong>Perawatan:</strong>Produk harus dipelihara sesuai dengan pedoman yang dipublikasikan oleh Paddle Board Overstock, termasuk inspeksi berkala dan pemeliharaan tekanan inflasi yang sesuai.</li>
      <li><strong>Kerja sama:</strong>Pembeli harus sepenuhnya dan segera bekerja sama dengan Paddle Board Overstock dalam semua hal yang berkaitan dengan klaim garansi.</li>
      <li><strong>Pembeli Asli:</strong>Garansi ini hanya diberikan kepada pembeli pengguna akhir asli dan tidak dapat dipindahtangankan.</li>
    </ul>

    <h2>Penggunaan Komersial</h2>
    <p>Jika produk digunakan untuk tujuan komersial, sewa, atau armada, periode garansi untuk semua komponen dikurangi menjadi satu (1) tahun sejak tanggal pembelian asli. Penggunaan dalam balapan, kecepatan, atau kompetisi daya tahan segera dan secara permanen membatalkan garansi sepenuhnya.</p>

    <h2>Cara Mengajukan Klaim Garansi</h2>
    <p>Hubungi Paddle Board Overstock dengan bukti pembelian dan deskripsi rinci tentang masalah. Paddle Board Overstock akan meninjau klaim dan memberikan petunjuk untuk inspeksi dan layanan.</p>
    <p>Untuk pertanyaan layanan garansi, silakan hubungi kami melalui<a href="/contact" class="text-sky-600 underline">halaman kontak</a>dengan nomor pesanan dan detail produk Anda.</p>

    <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Pernyataan garansi ini adalah ringkasan dari Garansi Terbatas Pabrikan Paddle Board Overstock yang lengkap. Dokumen garansi hukum penuh mengatur semua syarat dan ketentuan garansi. Spesifikasi dapat berubah tanpa pemberitahuan. Paddle Board Overstock adalah merek pabrik dari Paddle Board Overstock Weihai Manufacturing Hub.
    </p>
