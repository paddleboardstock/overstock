label: Jaminan
headline: Paddle Board Overstock Garansi Terbatas Pabrikan
subtitle: Paddle Board Overstock menjamin kualitas setiap produk laut tiup yang kami buat. Garansi Terbatas ini menetapkan syarat dan cakupan untuk produk Paddle Board Overstock Anda.
seo:
  headline: Paddle Board Overstock Garansi Perahu Tiup — Garansi Terbatas 5 Tahun | Paddle Board Overstock
  description: Paddle Board Overstock menawarkan garansi terbatas 5 tahun untuk kain tabung utama, jahitan, dan integritas struktural lambung fiberglass. Juga mencakup katup inflasi dan aksesori yang dipasang di pabrik. Ketentuan lengkap untuk garansi perahu tiup Paddle Board Overstock.
  datePublished: 2024-01-01
  dateModified: 2026-06-01
body: |
  <p class="text-lg text-gray-600 dark:text-gray-400 mb-8">
  Garansi Terbatas ini berlaku untuk produk laut tiup bermerek Paddle Board Overstock baru yang dibeli langsung dari Paddle Board Overstock atau dari dealer atau pengecer Paddle Board Overstock yang sah. Tanggal berlaku adalah tanggal pembelian ritel asli yang dapat diverifikasi.
  </p>

  <div class="bg-sky-50 dark:bg-gray-900 border border-sky-200 dark:border-gray-800 rounded-xl p-6 mb-10">
    <h2 class="text-xl font-bold mb-3">Cakupan & Durasi Garansi</h2>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Integritas kain tabung utama (CSM/PVC)</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Integritas struktural lambung fiberglass</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Kemampuan jahitan tabung tiup menahan udara</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">5 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Fungsi katup inflasi</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-sky-700 dark:text-sky-400">1 Tahun</h3>
        <p class="text-sm text-gray-600 mt-1">Aksesori dan perlengkapan tambahan pabrik</p>
      </div>
      <div class="bg-white dark:bg-gray-950 rounded-lg p-4 border border-gray-200 dark:border-gray-800">
        <h3 class="font-bold text-amber-700 dark:text-amber-400">1 Tahun*</h3>
        <p class="text-sm text-gray-600 mt-1">Penggunaan komersial, penyewaan, atau armada — semua komponen</p>
      </div>
    </div>
    <p class="text-xs text-gray-500 mt-4">*Penggunaan komersial, pemerintah, charter, penyewaan, atau instruksional mengurangi garansi menjadi 1 tahun. Penggunaan untuk balap atau kompetisi membatalkan garansi sepenuhnya.</p>
  </div>

  <h2>Apa yang Dicakup</h2>
  <h3>Kain Tabung Utama (5 Tahun)</h3>
  <p>Paddle Board Overstock menjamin kain tabung utama terhadap kerusakan porositas yang secara substansial mengurangi kemampuan produk untuk mempertahankan inflasi operasional. Ini berlaku untuk CSM (Hypalon) kain bersalut dan semua bahan kain tabung lainnya yang digunakan dalam pembuatan.</p>

  <h3>Integritas Struktural Lambung Fiberglass (5 Tahun)</h3>
  <p>Untuk produk dengan lambung plastik yang diperkuat fiberglass (FRP), struktur komposit utama dijamin terhadap kegagalan struktural akibat cacat bahan atau pengerjaan.</p>

  <h3>Kemampuan Jahitan Tabung Tiup Menahan Udara (5 Tahun)</h3>
  <p>Jahitan tabung tiup, yang disambungkan selama pembuatan, dijamin terhadap cacat produksi yang menyebabkan kebocoran udara substansial melalui jahitan. Inspeksi berkala dan pemeliharaan tekanan inflasi yang tepat adalah syarat cakupan.</p>

  <h3>Fungsi Katup Inflasi (5 Tahun)</h3>
  <p>Katup inflasi udara yang awalnya dipasang oleh Paddle Board Overstock dijamin terhadap cacat produksi dalam bahan atau pengerjaan yang mencegah katup mempertahankan udara sesuai desainnya.</p>

  <h3>Aksesori yang Dipasang Pabrik (1 Tahun)</h3>
  <p>Komponen dan perlengkapan yang diproduksi oleh Paddle Board Overstock dan awalnya dipasang di pabrik dijamin terhadap cacat bahan dan pengerjaan selama satu tahun. Ini tidak termasuk barang pihak ketiga, yang hanya dijamin oleh garansi pabrikan masing-masing.</p>

  <h2>Apa yang Tidak Dicakup</h2>
  <ul>
    <li>Cacat kosmetik termasuk perubahan warna, noda, memudar, mengapung kapur, atau perubahan tampilan lainnya</li>
    <li>Tusukan, sayatan, robekan, robekan, atau kerusakan fisik lainnya</li>
    <li>Mengalami kekacauan, retak, abrasi, goresan, atau kerusakan akibat gesekan atau kontak</li>
    <li>Degradasi akibat UV paparan cahaya, pelapukan, atau kondisi atmosfer</li>
    <li>Kerusakan akibat kontak dengan bahan bakar, pelarut, asam, alkali, atau bahan kimia</li>
    <li>Kerusakan akibat kelalaian, penggunaan yang tidak semestinya, penyalahgunaan, kecelakaan, atau keausan normal</li>
    <li>Masalah gelcoat atau permukaan cat (melepuh, berkerut, berubah warna, memudar)</li>
    <li>Kerusakan akibat benturan, tekanan, dukungan yang tidak tepat, atau trailer</li>
    <li>Kerusakan akibat inflasi/deflasi yang tidak tepat atau penggunaan perangkat inflasi yang tidak disetujui</li>
    <li>Peralatan, komponen, atau sistem pihak ketiga (yang ditanggung oleh produsen masing-masing)</li>
  </ul>

  <h2>Kewajiban & Solusi Produsen</h2>
  <p>Paddle Board OverstockKewajiban tunggal dan eksklusif adalah perbaikan atau penggantian, atas Paddle Board Overstockpilihan Anda, komponen apa pun yang ditemukan cacat dalam bahan atau pengerjaan dan tercakup dalam garansi ini. Perbaikan atau penggantian dilakukan oleh Paddle Board Overstock atau fasilitas layanan resmi yang ditunjuk. Komponen yang diperbaiki atau diganti hanya dijamin untuk bagian masa garansi asli yang belum berakhir.</p>

  <h2>Ketentuan Garansi</h2>
  <ul>
    <li><strong>Pendaftaran:</strong>Produk harus terdaftar dengan benar sesuai ketentuan garansi.</li>
    <li><strong>Perawatan:</strong>Produk harus dirawat sesuai Paddle Board Overstockdengan pedoman yang dipublikasikan, termasuk inspeksi berkala dan pemeliharaan tekanan inflasi yang sesuai.</li>
    <li><strong>Kerja sama:</strong>Pembeli harus bekerja sama sepenuhnya dan cepat Paddle Board Overstock dalam semua hal yang berkaitan dengan klaim garansi.</li>
    <li><strong>Pembeli Asli:</strong>Garansi ini hanya diberikan kepada pembeli pengguna akhir asli dan tidak dapat dipindahtangankan.</li>
  </ul>

  <h2>Penggunaan Komersial</h2>
  <p>Jika produk digunakan untuk tujuan komersial, pemerintah, nirlaba, charter, sewaan, instruksional, atau tujuan lain selain rekreasi pribadi, masa garansi untuk semua komponen dikurangi menjadi satu (1) tahun sejak tanggal pembelian ritel asli. Penggunaan dalam kompetisi balap, kecepatan, atau ketahanan langsung dan tidak dapat dibatalkan akan membatalkan garansi sepenuhnya.</p>

  <h2>Cara Mengajukan Klaim Garansi</h2>
  <p>Hubungi Paddle Board Overstock atau dealer resmi Anda dengan bukti pembelian dan deskripsi rinci tentang masalah.Paddle Board Overstock akan meninjau klaim dan memberikan instruksi untuk inspeksi dan layanan.</p>
  <p>Untuk pertanyaan layanan garansi, silakan hubungi kami melalui<a href="/contact" class="text-sky-600 underline">halaman kontak</a>dengan nomor pesanan dan detail produk Anda.</p>

  <h2>Item Pihak Ketiga</h2>
  <p>Peralatan, komponen, atau sistem yang diproduksi oleh pihak ketiga (meskipun dipasang oleh Paddle Board Overstock) hanya dilindungi oleh garansi yang ditawarkan oleh produsen masing-masing. secaraPaddle Board Overstock tegas menolak tanggung jawab garansi atas barang pihak ketiga tersebut.</p>

  <p class="text-sm text-gray-500 mt-8 border-t border-gray-200 dark:border-gray-800 pt-6">
  Pernyataan garansi ini adalah ringkasan dari seluruh Paddle Board Overstock Garansi Terbatas Produsen. Dokumen garansi hukum lengkap mengatur semua syarat dan ketentuan garansi. Spesifikasi dapat berubah tanpa pemberitahuan.Paddle Board Overstock adalah merek pabrik dari Paddle Board Overstock Qingdao Manufacturing Hub.
  </p>
