hero:
  tagline: Grafik Pengetahuan
  title: Pengetahuan Eksplorasi Air
  subtitle: |
    Basis pengetahuan terstruktur yang mencakup teknologi SUP tiup,<br />
    keselamatan air, rekayasa papan, dan perencanaan petualangan.
  taglineSection: Jelajahi. Pelajari. Berangkat dengan percaya diri.
clusters:
  tagline: Klaster Pengetahuan
  title: Jelajahi berdasarkan topik
  subtitle: Pembahasan mendalam tentang teknologi, keselamatan, dan keterampilan di balik setiap produk Paddle Board Overstock.
  items:
    - title: SUP Pengetahuan
      description: Dari memilih papan pertama Anda hingga teknik tur tingkat lanjut — semua tentang stand-up paddle boarding.
      icon: tabler:lifebuoy
      topics:
        - Cara memilih SUP tiup pertama Anda
        - Ukuran SUP terbaik untuk pemula
        - Seberapa sulit paddle boarding?
        - Perbandingan papan tiup vs papan keras
        - Daftar periksa keselamatan SUP
    - title: Teknologi Papan
      description: Pembahasan teknis mendalam tentang inti drop-stitch, laminasi PVC, rel, dan katup — bagaimana SUPs yang dapat dipompa dirancang.
      icon: tabler:anchor
      topics:
        - Bagaimana SUPs yang dapat dipompa dibuat
        - Lapisan laminasi PVC dijelaskan
        - Konstruksi rel dan jahitan
        - Pendalaman teknologi Drop-stitch
        - Seni dek EVA dijelaskan
    - title: Pengetahuan Keselamatan
      description: Pengetahuan keselamatan penting untuk setiap pendayung — dari pemilihan PFD hingga membaca cuaca dan teknik penyelamatan diri.
      icon: tabler:shield
      topics:
        - Daftar periksa keselamatan SUP
        - Apakah Anda memerlukan jaket pelampung?
        - Panduan keselamatan paddle di laut
        - Keselamatan sungai dan arus bagi pendayung
        - Kesadaran terhadap kondisi cuaca dan air
    - title: Teknologi
      description: Rekayasa di balik produk Paddle Board Overstock — bahan, metode konstruksi, dan pengujian kualitas.
      icon: tabler:microscope
      topics:
        - Teknologi kelas kelautan PVC
        - Drop-stitch inti dijelaskan
        - Mengapa PSI penting untuk tiup SUPs
        - Pengelasan RF vs perekat perekat
        - Pengujian kualitas pada setiap papan
    - title: Pengetahuan Klub & Sewa
      description: Panduan praktis untuk menjalankan program SUP — dari operasi penyewaan hingga armada resor dan klub.
      icon: tabler:briefcase
      topics:
        - Cara memulai SUP bisnis sewa
        - Membangun pusat olahraga air resor
        - Ukuran armada papan dayung untuk klub
        - Dapat ditiup vs sulit SUP untuk penggunaan komersial
        - Papan SUP terbaik untuk armada sewa
        - Strategi pendapatan olahraga air resor
        - Panduan pemeliharaan peralatan komersial
