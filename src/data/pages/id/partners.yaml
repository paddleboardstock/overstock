hero:
  tagline: Mitra & Distribusi
  title: Menjadi Mitra Paddle Board Overstock<br />— Jaringan Distribusi Global
  subtitle: Bergabunglah dengan jaringan mitra global Paddle Board Overstock. Kami bekerja sama dengan distributor kelautan, dealer perahu, pengecer peralatan, dan mitra merek di 50+ negara.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sales-office.webp
    alt: Paddle Board Overstock jaringan mitra dan distributor global
content_programs:
  tagline: Program Mitra
  title: Program Mitra<br />Dirancang untuk Pertumbuhan
  subtitle: Apakah Anda seorang distributor, dealer, atau mitra merek, Paddle Board Overstock menawarkan program yang dirancang untuk mendukung bisnis Anda.
  columns: 3
  items:
    - title: Program Distributor
      description: Distribusi eksklusif wilayah dengan harga volume, dukungan pemasaran, dan akses langsung ke pabrik. Komitmen minimum diperlukan berdasarkan ukuran wilayah.
      icon: tabler:world
    - title: Program Dealer
      description: Harga dealer langsung, pelatihan produk, materi pemasaran, dan dukungan garansi untuk lokasi ritel dan toko online.
      icon: tabler:building-store
    - title: OEM/ODM Kemitraan
      description: Manufaktur OEM dan ODM layanan penuh dengan penandaan, kemasan, dan spesifikasi produk kustom. Dari konsep hingga kontainer.
      icon: tabler:certificate
    - title: Kemitraan Merek
      description: Co-branding, label pribadi, dan program model eksklusif untuk merek yang sudah mapan di bidang kelautan dan rekreasi luar ruangan.
      icon: tabler:stars
    - title: Pemerintah & Institusi
      description: Program pemasok pilihan untuk lembaga pemerintah, penjaga pantai, militer, dan organisasi kemanusiaan. Dokumentasi siap tender.
      icon: tabler:building-community
    - title: Mitra Resor & Penyewaan
      description: Harga armada, kualitas konsisten, dan penandaan kustom untuk resor, pusat menyelam, dan operasi penyewaan di seluruh dunia.
      icon: tabler:sun
content_benefits:
  tagline: Mengapa Menjadi Mitra Kami
  title: Mengapa Mitra Memilih Paddle Board Overstock
  subtitle: Mitra kami mendapatkan keuntungan dari kemampuan manufaktur nyata, kualitas konsisten, dan dukungan responsif.
  list:
    - 'Akses Langsung ke Pabrik: Bekerja langsung dengan tim manufaktur kami — tanpa perantara. Dapatkan respons lebih cepat, harga lebih baik, dan visibilitas penuh ke produksi.'
    - 'Siap Dikustomisasi: Tandai produk Anda dengan warna, logo, kemasan, dan spesifikasi kustom. Jumlah pesanan minimum disesuaikan dengan pasar Anda.'
    - 'Kualitas Terjamin: Produksi bersertifikat 9001 ISO dengan kepatuhan CE, UKCA, dan BSCI. Setiap produk diuji sebelum pengiriman.'
    - 'Logistik Global: Pengiriman dari Qingdao, China dengan opsi FOB, CIF, dan DDP. Gudang AS di Montclair, CA untuk distribusi Amerika Utara.'
    - 'Dukungan Pemasaran: Katalog produk, fotografi, dokumentasi teknis, dan aset digital untuk mendukung upaya penjualan Anda.'
    - 'Pelatihan & Dukungan: Pelatihan produk untuk tim penjualan Anda, dukungan teknis untuk pelanggan Anda, dan koordinasi layanan garansi.'
content_process:
  tagline: Cara Menjadi Mitra
  title: Proses Kemitraan Sederhana
  subtitle: Proses kemitraan kami sederhana — dirancang untuk membuat Anda mulai menjual produk Paddle Board Overstock dengan cepat.
  items:
    - title: 'Langkah 1: Ajukan Aplikasi'
      description: Lengkapi formulir aplikasi mitra kami dengan profil perusahaan Anda, pasar target, dan minat produk.
    - title: 'Langkah 2: Tinjauan Kualifikasi'
      description: Tim kemitraan kami meninjau aplikasi Anda dan menghubungi Anda dalam 3 hari kerja untuk membahas peluang.
    - title: 'Langkah 3: Perjanjian & Penyiapan'
      description: Tanda tangani perjanjian kemitraan, buat akun Anda, dan terima harga mitra, materi pemasaran, dan sampel produk.
    - title: 'Langkah 4: Pelatihan & Peluncuran'
      description: Pelatihan produk, dukungan penjualan, dan materi pemasaran disediakan. Anda siap untuk mulai menjual.
cta:
  title: Siap menjadi mitra Paddle Board Overstock?
  subtitle: Ajukan kemitraan dan tim kami akan merespons dalam 3 hari kerja.
  actions:
