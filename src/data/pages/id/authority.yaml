hero:
  tagline: Pusat Otoritas
  title: Mengapa Paddle Board Overstock?<br />Kepercayaan Dibangun Selama Satu Dekade
  subtitle: Setiap kapal yang kami bangun membawa bobot dari 10+ tahun rekayasa kelautan, sistem kualitas bersertifikasi, dan ribuan operasi sukses di seluruh dunia. Inilah mengapa para profesional industri memilih Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Fasilitas manufaktur kelautan Paddle Board Overstock dan tim rekayasa
