features3_brand:
  tagline: Siapa Kami
  title: Dasar Merek<br />& Warisan
  subtitle: Cerita, keahlian, dan jangkauan global yang mendefinisikan Paddle Board Overstock sebagai produsen peralatan kelautan yang tepercaya.
  isBeforeContent: false
  columns: 3
  items:
    - title: Tentang Paddle Board Overstock
      description: Didirikan pada 2012 di Qingdao, China. Dari bengkel pesisir hingga fasilitas 12.000 m² — cerita lengkap Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: Kisah Merek
      description: Bagaimana tim insinyur kelautan berusaha membuat kapal karet profesional dapat diakses di seluruh dunia.
      icon: tabler:book
      link: /brand-story
    - title: Keahlian Industri Kelautan
      description: Ilmu bahan yang mendalam, manufaktur presisi, dan uji dunia nyata — dekade rekayasa kelautan di setiap lambung.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Kehadiran Global
      description: Melayani 50+ negara di setiap benua. Keahlian regional untuk memenuhi persyaratan regulasi lokal dan preferensi pasar.
      icon: tabler:globe
      link: /brand-global-presence
    - title: Mengapa Paddle Board Overstock
      description: Yang membedakan kami — kualitas, kustomisasi, harga langsung dari pabrik, dan dukungan menyeluruh untuk operator komersial.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Tim Kami
      description: Temui para pemimpin — insinyur kelautan, ilmuwan bahan, dan ahli manufaktur yang mendorong Paddle Board Overstock maju.
      icon: tabler:users
      link: /brand/team
    - title: Tim Rekayasa
      description: 78+ gabungan tahun R&D, 40+ platform, 12 sertifikasi, 1200+ proyek OEM. Tim teknis di balik setiap produk.
      icon: tabler:engine
      link: /engineering-team
    - title: Pusat Penelitian dan Pengembangan
      description: Rekayasa lambung, pengelasan RF, laboratorium PVC, pembuatan prototipe, tangki uji, dan laboratorium kualitas — fasilitas penelitian dan pengembangan lengkap kami.
      icon: tabler:flask
      link: /randdcenter
features3_trust:
  tagline: Kepercayaan & Kualitas
  title: Sertifikasi, Kualitas<br />& Bukti
  subtitle: Sertifikasi independen, pengujian yang ketat, dan bukti nyata yang menunjukkan komitmen kami terhadap kualitas.
  isBeforeContent: false
  columns: 3
  items:
    - title: Sertifikasi
      description: CE, ISO 9001, UKCA, BSCI, REACH — dokumentasi sertifikasi lengkap dan kepatuhan untuk pasar global.
      icon: tabler:shield-check
      link: /certifications
    - title: Kualitas & Pengujian
      description: Setiap produk diuji tekan sebelum dikirim. Kekuatan jahitan, ketahanan UV, daya apung — diverifikasi di setiap tahap.
      icon: tabler:clipboard-check
      link: /quality
    - title: Bukti & Pembuktian
      description: Hasil uji, foto penerapan, laporan inspeksi pihak ketiga, dan studi kasus yang memvalidasi kualitas Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Grafik Pengetahuan
      description: Jelajahi grafik entitas Paddle Board Overstock — produk, teknologi, sertifikasi, dan hubungan dalam basis pengetahuan yang terhubung.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Kepemimpinan
  title: Temui Tim<br />Di belakang Paddle Board Overstock
  subtitle: Keahlian industri yang mencakup teknik kelautan, ilmu material, manajemen kualitas, dan perdagangan global B2B.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Pendiri & CEO
      description: 15+ tahun dalam manufaktur kelautan. Sebelumnya memimpin R&D di produsen perahu besar Tiongkok. Memegang beberapa paten dalam desain perahu karet.
      icon: tabler:crown
    - title: Zhang Wei — Kepala Insinyur
      description: 20+ tahun dalam pembuatan PVC/Hypalon dan desain lambung deep-V. Mantan direktur teknis di perusahaan rekayasa kelautan Eropa.
      icon: tabler:engine
    - title: Chen Ming — Kepala R&D
      description: PhD dalam Ilmu Material. Spesialis dalam teknologi drop-stitch dan pengelasan frekuensi tinggi. 10+ tahun dalam komposit tekstil.
      icon: tabler:flask
    - title: Liu Qiang — Direktur Produksi
      description: 18+ tahun dalam manufaktur ramping. Six Sigma Black Belt. Menerapkan ISO sistem mutu 9001 di semua lini produksi.
      icon: tabler:settings
    - title: Wang Fang — Manajer Kualitas
      description: 12+ tahun di kontrol kualitas laut. Auditor bersertifikat CE dan ISO. Mengawasi pengujian untuk setiap batch produksi.
      icon: tabler:shield-check
    - title: Helen Lee — Direktur Penjualan
      description: 15+ tahun dalam perdagangan internasional B2B. Mengelola kemitraan OEM/ODM di 30+ negara. Fasih dalam 4 bahasa.
      icon: tabler:briefcase
cta:
  title: Ingin memverifikasi kredensial kami?
  subtitle: Hubungi kami untuk salinan sertifikasi, laporan inspeksi pihak ketiga, atau untuk menjadwalkan kunjungan pabrik.
  actions:
    - variant: primary
      text: Minta kredensial
      href: /contact
    - text: Lihat rincian sertifikasi
      href: /certifications
