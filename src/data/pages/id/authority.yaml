hero:
  tagline: Pusat Otoritas
  title: Mengapa Paddle Board Overstock?<br />Kepercayaan Dibangun Selama Satu Dekade
  subtitle: Setiap papan yang kami buat membawa beban pengalaman 10+ tahun dalam rekayasa kelautan, kontrol kualitas yang ketat, dan ribuan pendayung di perairan di seluruh dunia. Inilah sebabnya pendayung memilih Paddle Board Overstock.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Fasilitas manufaktur kelautan dan tim rekayasa Paddle Board Overstock
stats:
  title: Paddle Board Overstock dalam Angka
  stats:
    - title: Tahun Beroperasi
      amount: Sejak 2012
    - title: Insinyur R&D
      amount: 14+
    - title: Negara yang Dilayani
      amount: 50+
    - title: Unit yang Diproduksi per Tahun
      amount: 15,000+
features3_brand:
  tagline: Siapa Kami
  title: Dasar Merek<br />& Warisan
  subtitle: Cerita, keahlian, dan jangkauan global yang mendefinisikan Paddle Board Overstock sebagai merek SUP yang terpercaya.
  isBeforeContent: false
  columns: 3
  items:
    - title: Tentang Paddle Board Overstock
      description: Didirikan pada tahun 2012 di Weihai, Cina. Dari bengkel pesisir hingga fasilitas seluas 12.000 m² — kisah lengkap Paddle Board Overstock.
      icon: tabler:building-factory
      link: /about
    - title: Kisah Merek
      description: Bagaimana tim insinyur kelautan berusaha membuat papan dayung tiup kelas profesional dapat diakses di seluruh dunia.
      icon: tabler:book
      link: /brand-story
    - title: Keahlian Industri Kelautan
      description: Ilmu material yang mendalam, manufaktur presisi, dan pengujian dunia nyata — puluhan tahun rekayasa kelautan dalam setiap papan.
      icon: tabler:microscope
      link: /brand-marine-expertise
    - title: Mengapa Paddle Board Overstock
      description: Apa yang membedakan kami — kualitas, kustomisasi, harga langsung dari pabrik, dan dukungan end-to-end untuk setiap pendayung.
      icon: tabler:star
      link: /brand-why-paddleboardoverstock
    - title: Tim Kami
      description: Kenali para pemimpin — insinyur kelautan, ilmuwan material, dan ahli manufaktur yang mendorong Paddle Board Overstock maju.
      icon: tabler:users
      link: /brand/team
    - title: Tim Rekayasa
      description: 78+ tahun R&D gabungan, 40+ platform, 1.200+ proyek teknik. Tim teknis di balik setiap produk.
      icon: tabler:engine
      link: /engineering-team
features3_trust:
  tagline: Kepercayaan & Kualitas
  title: Kualitas, Pengujian<br />& Bukti
  subtitle: Pengujian yang ketat, data uji nyata, dan bukti yang menunjukkan komitmen kami terhadap kualitas.
  isBeforeContent: false
  columns: 3
  items:
    - title: Kualitas & Pengujian
      description: Setiap produk diuji tekan sebelum dikirim. Kekuatan jahitan, ketahanan UV, daya apung — diverifikasi di setiap tahap.
      icon: tabler:clipboard-check
      link: /quality
    - title: Bukti & Pembuktian
      description: Hasil pengujian, foto penerapan, laporan inspeksi pihak ketiga, dan studi kasus yang memvalidasi kualitas Paddle Board Overstock.
      icon: tabler:file-check
      link: /evidence
    - title: Grafik Pengetahuan
      description: Jelajahi grafik entitas Paddle Board Overstock — produk, teknologi, material, dan hubungan dalam basis pengetahuan yang terhubung.
      icon: tabler:graph
      link: /knowledge-graph
features3_leadership:
  tagline: Kepemimpinan
  title: Temui Tim<br />Di balik Paddle Board Overstock
  subtitle: Keahlian industri yang mencakup rekayasa kelautan, ilmu material, manajemen kualitas, dan e-commerce global.
  isBeforeContent: false
  columns: 3
  items:
    - title: Toby Liu — Pendiri & CEO
      description: 15+ tahun dalam manufaktur kelautan. Sebelumnya memimpin R&D di produsen kelautan besar di Tiongkok. Memegang beberapa paten dalam desain produk tiup.
      icon: tabler:crown
    - title: Zhang Wei — Kepala Insinyur
      description: 20+ tahun dalam pembuatan polimer dan desain struktur tiup. Mantan direktur teknis di sebuah perusahaan teknik kelautan Eropa.
      icon: tabler:engine
    - title: Chen Ming — Kepala R&D
      description: PhD dalam Ilmu Material. Spesialis dalam teknologi drop-stitch dan pengelasan frekuensi tinggi. 10+ tahun dalam komposit tekstil.
      icon: tabler:flask
    - title: Liu Qiang — Direktur Produksi
      description: 18+ tahun dalam manufaktur ramping. Menerapkan sistem kualitas yang ketat di semua lini produksi.
      icon: tabler:settings
    - title: Wang Fang — Manajer Kualitas
      description: 12+ tahun dalam kontrol kualitas kelautan. Memimpin audit kualitas internal. Mengawasi pengujian untuk setiap batch produksi.
      icon: tabler:shield-check
    - title: Helen Lee — Direktur Penjualan
      description: 15+ tahun dalam e-commerce internasional dan logistik. Mengirim papan ke pendayung di 50+ negara. Lancar berbahasa 4 bahasa.
      icon: tabler:briefcase
cta:
  title: Ingin bukti kualitas kami?
  subtitle: Hubungi kami untuk laporan uji, catatan inspeksi, atau untuk menjadwalkan kunjungan pabrik.
  actions:
    - variant: primary
      text: Minta dokumentasi
      href: /contact
