hero:
  tagline: OEM/ODM Manufaktur
  title: OEM & Manufaktur Label Pribadi
  subtitle: Dari konsep hingga kontainer — sesuaikan setiap detail dari lini perahu karet tiup Anda
intro: Aquafarer menawarkan layanan OEM dan ODM yang komprehensif untuk merek, distributor, dan lembaga pemerintah di seluruh dunia. Dengan pengalaman ekspor selama 10+ tahun dan pabrik seluas 12.000 m² ISO bersertifikat 9001 & BSCI, kami menangani semuanya mulai dari desain produk dan pengembangan cetakan hingga produksi skala penuh, pengemasan, dan logistik.
