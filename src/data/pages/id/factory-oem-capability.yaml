why_us:
  - title: Integrasi Vertikal
    description: Kami memiliki pabrik, cetakan, dan rantai pasokan sendiri — tanpa perantara, tanpa subkontraktor. Ini memberi kami kendali atas kualitas, biaya, dan pengiriman.
  - title: Sertifikasi Ganda
    description: ISO Sertifikasi manajemen kualitas 9001 dan BSCI kepatuhan sosial. Laporan audit pabrik tersedia atas permintaan.
  - title: CE Kepatuhan
    description: Semua model standar memiliki CE sertifikasi 2013/53/EU. Model kustom dapat CE disertifikasi melalui proses yang telah kami tetapkan.
  - title: MOQ Rendah
    description: Mulai dengan sesedikit 5 unit untuk model standar. Kami membantu merek baru meluncurkan tanpa membebani inventaris.
