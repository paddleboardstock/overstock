services:
  - title: Desain & Rekayasa Produk
    description: Tim R&D internal kami bekerja dengan konsep atau spesifikasi Anda untuk mengembangkan gambar CAD, model 3D, dan prototipe. Kami menawarkan desain cetakan, optimisasi bentuk lambung, dan panduan pemilihan bahan.
  - title: Branding & Grafis Kustom
    description: Cetak digital warna penuh, sablon, embossing, dan opsi label. Kami mengembangkan grafis dek spesifik merek, branding tabung, dan kemasan siap jual.
  - title: Kustomisasi Bahan & Spesifikasi
    description: Pilih dari PVC (standar, ramah lingkungan, tahan api), Hypalon/CSM, drop-stitch, dan konstruksi hibrida. Warna tabung kustom, berat kain, dan opsi penguatan.
  - title: Pengemasan & Logistik
    description: Kemasan ritel kustom, kotak label pribadi, kemasan vakum, penumpukan palet, dan pemuatan kontainer. FOB Qingdao, CIF, atau DDP tersedia.
