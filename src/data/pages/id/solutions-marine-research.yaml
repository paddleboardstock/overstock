content_challenge:
  tagline: Tantangan
  title: Tuntutan Penelitian Kelautan<br />Platform Stabil, Siap Instrumen
  subtitle: Kapal kerja ilmiah harus menyediakan platform yang stabil untuk instrumen sensitif, operasi yang tenang agar tidak mengganggu satwa liar, dan tata letak fleksibel untuk berbagai peralatan penelitian.
  paragraphs:
    - Penelitian kelautan dan pemantauan lingkungan membutuhkan kapal kerja yang berfungsi sebagai laboratorium bergerak. Berbeda dengan kapal komersial atau rekreasi, penelitian RIBs harus mampu menampung instrumen elektronik sensitif, peralatan pengambilan sampel air dan sedimen, dan terkadang transportasi spesimen hidup — sambil mempertahankan platform yang stabil untuk pengambilan data yang akurat.
    - '**Stabilitas platform sangat penting** — Sonar, echo sounder, dan profiler CTD (konduktivitas, suhu, kedalaman) membutuhkan lambung yang stabil saat diam dan pada kecepatan lambat. Ombak berlebih atau pergerakan lambung akan memasukkan gangguan pada data ilmiah. Lambung Deep-V dengan karakteristik stabilitas yang baik sangat penting.'
    - '**Integrasi instrumen** — Kapal penelitian membutuhkan titik pemasangan untuk antena GPS, transduser sonar, lengan pengambilan sampel, dan peralatan pencatat data. Ruang konsol harus mampu menampung beberapa tampilan, distribusi daya untuk instrumen, dan penyimpanan aman untuk elektronik sensitif.'
    - '**Operasi tenang** — Untuk survei biologi kelautan dan pemantauan lingkungan, kebisingan mesin dan getaran lambung dapat menakuti kehidupan laut dan mengganggu pengamatan perilaku. Konfigurasi outboard yang tenang dan desain lambung dengan getaran rendah penting untuk aplikasi penelitian.'
    - Aquafarer penelitian RIBs dirancang dengan platform lambung stabil, sistem pemasangan peralatan terintegrasi, dan konfigurasi outboard yang tenang untuk aplikasi ilmiah dan pemantauan lingkungan.
content_solution:
  tagline: Solusi Kami
  title: Penelitian RIBs yang Dirancang Khusus<br />Untuk Ilmu & Kerja Lingkungan
  subtitle: Setiap Aquafarer penelitian RIB dikonfigurasi sebagai platform yang stabil dan dapat disesuaikan untuk instrumen ilmiah dan peralatan pengambilan sampel lapangan.
  list:
    - Lambung fiberglass Deep-V dengan stabilitas luar biasa saat diam dan pada kecepatan survei lambat
    - Tata letak dek datar dengan pelat pemasangan peralatan untuk sonar, GPS, dan peralatan pengambilan sampel
    - Konsol dikonfigurasi untuk beberapa tampilan — plotter, sounder, pencatat data
    - Distribusi daya aksesoris 12V dan 24V untuk instrumen ilmiah
    - Outboard 4-tak yang tenang — getaran dan suara minimal untuk survei satwa liar
    - Desain lambung low-wake opsional untuk gangguan minimal selama pengumpulan data
    - Warna tabung kustom untuk branding institusi penelitian dan identifikasi armada
content_segments:
  tagline: Profil Penelitian
  title: Solusi Ilmu Kelautan<br />Berdasarkan Jenis Aplikasi
  subtitle: Berbagai aplikasi penelitian memiliki kebutuhan kapal yang unik — dari platform pengajaran universitas hingga kapal survei lingkungan hingga pemantauan kualitas air RIBs.
  items:
    - title: Program Ilmu Kelautan Universitas
      subtitle: Platform pengajaran, kunjungan lapangan mahasiswa, penelitian pesisir
      description: Universitas ilmu kelautan dan departemen oseanografi membutuhkan kapal kerja yang andal dan serbaguna untuk pengajaran mata kuliah lapangan, proyek penelitian mahasiswa, dan survei pesisir yang dipimpin fakultas. Kapal harus mudah dioperasikan oleh mahasiswa di bawah pengawasan, cukup stabil untuk pemasangan instrumen langsung, dan tahan lama untuk digunakan secara sering oleh banyak pengguna sepanjang periode akademik. Batas anggaran di lingkungan akademik membuat biaya yang efisien dan perawatan rendah menjadi pertimbangan penting.
      features:
        - Platform stabil untuk praktik pemasangan dan pengambilan instrumen oleh mahasiswa
        - Operasi mudah — konfigurasi kemudi tangan atau konsol tunggal untuk penggunaan mahasiswa dengan pengawasan
        - Tabung Hypalon yang tahan lama untuk pendaratan di pantai yang sering dan penanganan oleh mahasiswa
        - Pemasangan peralatan untuk sonar, disk secchi, dan peralatan sampel tingkat pengajaran
        - Opsi PVC yang hemat biaya untuk program akademik dengan anggaran terbatas
    - title: Institut Penelitian Kelautan
      subtitle: Survei RIBs dengan integrasi instrumen, GPS, peralatan sampling
      description: Organisasi penelitian kelautan yang berdedikasi yang melakukan survei pesisir dan lepas pantai membutuhkan RIBs survei yang dikonfigurasi secara profesional dengan instrumen terintegrasi. Kapal-kapal ini membawa sistem sonar untuk pemetaan batimetri, profiler CTD untuk analisis kolom air, pengambil sampel sedimen, dan peralatan pengumpulan biologis. Kapal harus menyediakan platform yang stabil pada kecepatan survei lambat, memiliki ruang dek yang cukup untuk penempatan peralatan, dan menyediakan daya bersih 12V/24V untuk elektronik.
      features:
        - Pemasangan transduser sonar terintegrasi — melalui lambung atau konfigurasi transom
        - Pemasangan antena GPS dan integrasi konsol untuk navigasi tingkat survei
        - Area penempatan CTD dan pengambil sampel air dengan titik pengikat aman
        - Distribusi daya tambahan 12V/24V untuk instrumen dan perekam data
        - Stabil pada kecepatan lambat (3-6 knot) untuk akurasi jalur survei
        - A-frame atau davit opsional untuk menempatkan peralatan sampel yang lebih berat
    - title: Pemantauan Lingkungan & Konservasi
      subtitle: Survei ekologi, pengamatan satwa liar, penilaian habitat
      description: LSM lingkungan, lembaga pemerintah, dan organisasi konservasi melakukan survei ekologi laut, pemantauan populasi satwa liar, dan penilaian habitat. Operasi ini membutuhkan kapal yang tenang dan berdampak rendah yang dapat mendekati habitat sensitif tanpa mengganggu satwa liar. Kapal perlu membawa peralatan kamera, GPS untuk pemetaan transek, dan peralatan sampling untuk pengambilan air dan sedimen. Gelombang rendah dan suara mesin minimal penting untuk studi pengamatan perilaku.
      features:
        - Outboard 4-tak yang tenang — gangguan minimal terhadap satwa laut
        - Platform pengamatan yang stabil untuk fotografi dan dokumentasi video
        - Pemasangan peralatan untuk rig kamera, pelacak GPS, dan komputer lapangan
        - Draf dangkal untuk mengakses lahan basah pesisir, hutan bakau, dan muara
        - Permukaan dek dan tabung yang mudah dibersihkan untuk dekontaminasi antar lokasi
    - title: Pemantauan & Pengujian Kualitas Air
      subtitle: Perjalanan pengambilan sampel rutin, pelacakan polutan, pemantauan kepatuhan
      description: Organisasi pemantauan kualitas air melakukan perjalanan pengambilan sampel secara rutin di seluruh zona pesisir, pelabuhan, dan perairan pedalaman untuk melacak tingkat polusi, ledakan alga, dan kepatuhan terhadap peraturan lingkungan. Operasi ini membutuhkan perahu yang efisien dan andal untuk kunjungan berulang ke stasiun pengambilan sampel tetap. Kapal harus membawa peralatan pengambilan sampel, pendingin untuk pelestarian sampel, dan peralatan pengujian lapangan — dengan kemudahan mencuci dek di antara lokasi pengambilan sampel untuk mencegah kontaminasi silang.
      features:
        - Area stasiun pengambilan sampel khusus dengan penyimpanan pendingin dan peralatan
        - Permukaan dek dan tabung yang mudah dibersihkan untuk dekontaminasi antar lokasi
        - Integrasi GPS untuk kembali dengan presisi ke koordinat pengambilan sampel tetap
        - Ukuran kompak untuk akses ke perairan terbatas dan saluran sempit
        - Mesin tempel hemat bahan bakar untuk perjalanan pengambilan sampel rutin yang hemat biaya
