testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Pemilik, Algarve Surf Academy
    location: Lagos, Portugal
    content: Kami memulai dengan Paket Pemula Klub untuk sekolah selancar kami. 20 papan, dayung, rompi — semuanya tiba dalam 3 minggu. Setelah dua musim, kami meningkatkan ke Paket Pro. Branding kustom dengan logo kami mengubah citra profesional kami secara signifikan.
    rating: 5
    product: Paket Club Starter
    source: solutions/clubs
  - category: clubs
    name: Pemilik Klub
    title: Klub Olahraga Air
    location: Phuket, Thailand
    content: Paket Pemula Klub adalah titik masuk yang sempurna. Saat bisnis kami tumbuh, Aquafarer tumbuh bersama kami — kualitas sama, harga sama, tidak ada kejutan. Kami meningkat dari 10 menjadi 80 papan dalam 18 bulan.
    rating: 5
    product: Paket Pemula Klub + Paket Premium
    source: success-stories
  - category: resorts
    name: Manajer Umum Resort
    title: Resor Pantai Bintang 5
    location: Yunani
    content: Aquafarer tidak hanya mengirimkan papan — mereka membantu kami membangun pengalaman tamu yang lengkap. Program olahraga air kami naik dari nol menjadi sorotan resor dalam satu musim. 300+ pemesanan mingguan dan $180K pendapatan tahunan.
    rating: 5
    product: Paket Resort Premium
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Direktur Pengalaman Tamu, Azure Bay Resorts
    location: Phuket, Thailand
    content: Aquafarer merancang dan melengkapi seluruh program aktivitas pantai kami di tiga properti resort. 80 SUPs, 40 kayak, infrastruktur keselamatan, dan pelatihan staf — semuanya dikirim dalam satu pengiriman. Partisipasi tamu meningkat 60% pada musim pertama.
    rating: 5
    product: Paket Resort Premium
    source: solutions/resorts
  - category: entrepreneurs
    name: Michael Park
    title: Pendiri, Shoreline Paddle Co.
    location: Kalifornia, AS
    content: Saya meluncurkan merek SUP saya tanpa pengalaman di industri. Tim Aquafarer membimbing saya dari pemilihan produk hingga desain logo khusus dan kemasan. Kontainer pertama saya tiba dalam 11 minggu, dan saya terjual habis dalam 3 bulan di Amazon.
    rating: 5
    product: Peluncuran Merek Pemula
    source: solutions/entrepreneurs
  - category: entrepreneurs
    name: Pendiri
    title: Merek SUP Australia
    location: australia
    content: Saya punya ide merek tapi sama sekali tidak tahu tentang manufaktur. SayaAquafarer benar-benar membimbing tangan saya sepanjang proses — mulai dari memilih desain papan yang tepat hingga membuka kotak pengiriman pertama saya. 90 hari dari mimpi hingga pengiriman.
    rating: 5
    product: Paket Peluncuran Merek
    source: success-stories
  - category: rental
    name: Daniel Okonkwo
    title: Pemilik, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Saya menyewa 5 papan dari toko lokal dan kehilangan 60% pendapatan saya untuk mereka. Aquafarer membantu saya membangun armada saya sendiri dengan 15 SUPs. Kalkulator ROI menunjukkan impas dalam 4 bulan — kenyataannya memakan waktu 3 bulan. Sekarang saya memperluas menjadi 30 papan.
    rating: 5
    product: Paket Pemula Armada
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Direktur Operasional, Adriatic Adventure Tours
    location: Dubrovnik, Kroasia
    content: Kami melengkapi seluruh armada sewa kami dengan Aquafarer RIBs — 12 perahu di tiga lokasi. Dua musim berlalu, nol kegagalan. Dokumentasi sertifikasi CE membuat persetujuan asuransi berjalan lancar. Tim teknisi mereka bahkan menyesuaikan warna tabung.
    rating: 5
    product: Kit Perluasan Armada
    source: trust
  - category: rental
    name: Letnan Komandan Andres Reyes
    title: Petugas Pengadaan Maritim, Philippine Coast Guard Auxiliary
    location: Manila, Filipina
    content: Kami mengoperasikan 24 Aquafarer RIBs di seluruh armada patroli pesisir kami. Proses QC mereka konsisten di setiap batch — kualitas jahitan sama, penempatan katup sama, rating tekanan sama setiap waktu. Konsistensi itu penting ketika nyawa tergantung pada peralatan.
    rating: 5
    product: Armada Patroli RIB
    source: trust
  - category: consumers
    name: Sarah K.
    title: Pemilik SUP untuk pertama kalinya
    location: Danau Tahoe, AS
    content: Stabil bahkan untuk pemula lengkap. Membawanya ke danau di hari pertama saya dan tidak pernah jatuh. Paket lengkap dengan pompa dan dayung membuat saya sudah berada di air 20 menit setelah membuka kotak.
    rating: 5
    product: SUP Explorer 11
  - category: consumers
    name: James Thornton
    title: SUP Pemilik Explorer 11
    location: Vancouver, Kanada
    content: Sebagai pembeli pertama kali, saya gugup tentang kualitas memesan dari luar negeri. Dokumentasi ISO dan laporan uji pihak ketiga yang mereka bagikan sebelum saya meminta memberi saya kepercayaan penuh. Papan tiba dalam 6 hari dan melebihi harapan saya.
    rating: 5
    product: SUP Explorer 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Pengayuh Rekreasi
    location: Florida, AS
    content: Kualitas bangunan solid. Menangani gelombang pesisir jauh lebih baik dari yang saya harapkan dari papan tiup. Memasukkannya ke dalam bagasi mobil untuk perjalanan akhir pekan — mengembangkannya di dermaga dalam kurang dari 4 menit.
    rating: 5
    product: Kayak Tiup
