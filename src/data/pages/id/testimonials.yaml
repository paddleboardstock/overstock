testimonials:
  - category: clubs
    name: Ricardo Santos
    title: Pemilik, Algarve Surf Academy
    location: Lagos, Portugal
    content: Kami memulai dengan Paket Pemula Klub untuk sekolah selancar kami. 20 papan, dayung, rompi — semuanya tiba dalam 3 minggu. Setelah dua musim, kami meningkatkan ke Paket Pro. Branding kustom dengan logo kami mengubah citra profesional kami secara signifikan.
    rating: 5
    product: Paket Club Starter
    source: solutions/clubs
  - category: clubs
    name: Pemilik Klub
    title: Klub Olahraga Air
    location: Phuket, Thailand
    content: Paket Pemula Klub adalah titik masuk yang sempurna. Saat bisnis kami berkembang, Paddle Board Overstock tumbuh bersama kami — kualitas sama, harga sama, tidak ada kejutan. Kami meningkatkan dari 10 menjadi 80 papan dalam 18 bulan.
    rating: 5
    product: Paket Pemula Klub + Paket Premium
    source: success-stories
  - category: resorts
    name: Manajer Umum Resort
    title: Resor Pantai Bintang 5
    location: Yunani
    content: Paddle Board Overstock tidak hanya mengirimkan papan — mereka membantu kami membangun pengalaman tamu yang lengkap. Program olahraga air kami berkembang dari nol menjadi sorotan resor dalam satu musim. 300+ pemesanan mingguan dan $180K pendapatan tahunan.
    rating: 5
    product: Paket Resort Premium
    source: success-stories
  - category: resorts
    name: Sophie Laurent
    title: Direktur Pengalaman Tamu, Azure Bay Resorts
    location: Phuket, Thailand
    content: Paddle Board Overstock merancang dan melengkapi seluruh program aktivitas pantai kami di tiga properti resor. 120 SUPs, infrastruktur keselamatan, dan pelatihan staf — semuanya dikirim dalam satu pengiriman. Partisipasi tamu meningkat 60% di musim pertama.
    rating: 5
    product: Paket Resort Premium
    source: solutions/resorts
  - category: rental
    name: Daniel Okonkwo
    title: Pemilik, Lakeland SUP Rentals
    location: Ontario, Kanada
    content: Saya menyewa 5 papan dari toko lokal dan kehilangan 60% pendapatan saya untuk mereka. Paddle Board Overstock membantu saya membangun armada saya sendiri dengan 15 SUPs. Kalkulator ROI menunjukkan impas dalam 4 bulan — nyata terjadi dalam 3 bulan. Sekarang saya sedang memperluas menjadi 30 papan.
    rating: 5
    product: Paket Pemula Armada
    source: solutions/rental-business
  - category: rental
    name: Marco Valenti
    title: Direktur Operasional, Adriatic Adventure Tours
    location: Dubrovnik, Kroasia
    content: Kami melengkapi seluruh armada sewa SUP kami dengan papan Paddle Board Overstock — 30 papan di tiga lokasi. Dua musim berjalan, tidak ada kegagalan. Kualitas yang konsisten di setiap batch membuat pilihan kami mudah, dan tim mereka bahkan mencocokkan warna dengan merek kami.
    rating: 5
    product: Paket Armada Sewa
    source: trust
  - category: rental
    name: Elena Marchetti
    title: Pemilik, Lake Garda SUP Rentals
    location: Lake Garda, Italia
    content: Papan sewaan kami digunakan lima kali sehari di musim puncak. Sejak beralih ke Paddle Board Overstock, keluhan kerusakan hampir nol, dan pelanggan terus menanyakan di mana mereka bisa membeli papan mereka sendiri.
    rating: 5
    product: Paket Armada Sewa
    source: solutions/rental-business
  - category: consumers
    name: Sarah K.
    title: Pemilik SUP untuk pertama kalinya
    location: Danau Tahoe, AS
    content: Stabil bahkan untuk pemula lengkap. Membawanya ke danau di hari pertama saya dan tidak pernah jatuh. Paket lengkap dengan pompa dan dayung membuat saya sudah berada di air 20 menit setelah membuka kotak.
    rating: 5
    product: SUP Penjelajah 11
  - category: consumers
    name: James Thornton
    title: SUP Pemilik Explorer 11
    location: Vancouver, Kanada
    content: Sebagai pembeli pertama kali, saya gugup memesan dari luar negeri. Kualitas pembuatan berbicara dengan sendirinya saat saya membuka kotaknya — kaku, sambungan sempurna, dan tiba hanya dalam 6 hari.
    rating: 5
    product: SUP Penjelajah 11
    source: trust
  - category: consumers
    name: Mike R.
    title: Paddle Akhir Pekan
    location: Florida, AS
    content: Kualitas bangunan solid. Menangani gelombang pesisir jauh lebih baik dari yang saya harapkan dari papan tiup. Memasukkannya ke dalam bagasi mobil untuk perjalanan akhir pekan — mengembangkannya di dermaga dalam kurang dari 4 menit.
    rating: 5
    product: SUP Angin Tropis
