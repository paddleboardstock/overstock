tldr:
  summary: 'Sistem kontrol kualitas enam tahap: pemeriksaan bahan, QC dalam proses, verifikasi pengelasan, QC perakitan, uji tekanan pada 1,25x nilai nominal, dan inspeksi akhir. Uji tekanan 100% unit. Tingkat bebas cacat 99,3% per AQL 2,5 pengambilan sampel.'
  points:
    - 'Kontrol kualitas enam tahap: pemeriksaan bahan, QC dalam proses, verifikasi pengelasan, QC perakitan, uji tekanan 1,25x, dan inspeksi akhir 100 poin'
    - Inspeksi akhir 100 poin pada setiap papan sebelum dikemas
    - 100% unit menjalani tahanan 24-48 jam pada tekanan 1,25x nilai nominal dengan toleransi penurunan maksimum 5%
    - AQL 2,5 pengambilan sampel memastikan tingkat bebas cacat 99,3%
    - 'QC pengelasan: uji pengelupasan, verifikasi lebar las, dan pemeriksaan jahitan cahaya balik pada setiap sambungan yang dilas'
