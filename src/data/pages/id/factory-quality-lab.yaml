hero:
  tagline: Laboratorium Pengendalian Kualitas
  title: Laboratorium Pengujian & Penjaminan Kualitas
  subtitle: Laboratorium kualitas independen — setiap unit diuji sebelum pengiriman
intro: Paddle Board Overstock mengoperasikan laboratorium kontrol kualitas khusus yang bekerja secara independen dari produksi. Setiap batch bahan baku dan setiap papan jadi melewati protokol inspeksi yang terdokumentasi sebelum dirilis. Tim QC kami melapor langsung ke manajemen, memastikan keputusan kualitas yang tidak memihak.
highlights:
  - value: 100%
    label: Unit diuji tekanan
    detail: Setiap ruang, setiap papan
  - value: 48 h
    label: Durasi uji retensi udara
    detail: Pada tekanan 1,25× rating
  - value: <5%
    label: Penurunan tekanan maksimum yang diizinkan
    detail: Selama periode tahan 24 jam
  - value: 99.3%
    label: Tingkat bebas cacat
    detail: Pengiriman 12 bulan terakhir
test_procedures:
  - title: Inspeksi Bahan Baku
    description: Setiap batch masuk dari PVC, kain drop-stitch, busa EVA, dan perangkat keras diuji sebelum diterima. Kekuatan tarik, ketahanan robek, dan ketahanan UV diverifikasi. Material yang tidak sesuai dikarantina dan dikembalikan.
    standards:
      - Kekuatan tarik (min 350 N/cm)
      - Ketahanan robek
      - Ketahanan UV (1.000 jam)
  - title: Titik Pemeriksaan QC Dalam Proses
    description: Operator produksi melakukan pemeriksaan sendiri pada setiap tahap. Auditor QC melakukan pengambilan sampel acak sepanjang shift. Tes pengelupasan las dilakukan setiap 50 unit. Pemeriksaan dimensi dilakukan setiap panel ke-20.
    standards:
      - Uji pelepasan setiap 50 unit
      - Daftar periksa internal 100 poin
      - Audit pengambilan sampel acak
  - title: Tes Retensi Udara 48 Jam
    description: Setiap ruang tabung dipompa hingga 125% dari tekanan rating dan ditahan selama 48 jam. Sensor tekanan mencatat terus-menerus dengan kompensasi suhu. Setiap ruang yang melebihi penurunan tekanan 5% memicu pemeriksaan ulang batch otomatis.
    standards:
      - Penahanan tekanan 1,25x dari rating
      - Penurunan tekanan maksimum <5%
  - title: Tes Beban & Keseimbangan
    description: Papan yang selesai diuji pada kapasitas maksimum untuk stabilitas, kemiringan bebas, dan penanganan. Setiap papan menjalani uji air sebelum persetujuan inspeksi akhir.
    standards:
      - Verifikasi beban 1,25x dari rating
      - Pengujian air
