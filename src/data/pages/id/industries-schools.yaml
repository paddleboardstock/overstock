hero:
  tagline: Sekolah & Pusat Pelatihan Olahraga Air
  title: Solusi Peralatan<br />Untuk SUP & Sekolah Kayak
  subtitle: Peralatan yang andal dan berstandar komersial untuk sekolah dayung, pelatihan selancar, pelatihan kayak, dan program pendidikan olahraga air dalam skala apa pun.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-sup-allround-board.webp
    alt: Aquafarer SUP Dewan untuk Sekolah dan Pusat Pelatihan
direct_answer: Aquafarer SUP menyediakan perlengkapan dan sekolah kayak di seluruh dunia dengan papan kelas komersial, peralatan keselamatan, dan paket instruktur. Peralatan kami dibuat untuk penggunaan instruksional sehari-hari — inti yang lebih tebal PVCdan diperkuat drop-stitch , serta desain lambung yang stabil yang memberikan kepercayaan diri pemula dan keandalan instruktur. Paket mencakup branding khusus, program suku cadang, dan sumber pelatihan.
solution_offerings:
  - title: Paket Pemula Sekolah
    subtitle: Untuk program baru dan pusat pelatihan kecil
    badge: Popular
    features:
      - title: Dewan Mahasiswa
        description: 10–25 papan serba bisa SUP atau kayak rekreasi dengan platform stabil untuk pelajaran pemula
      - title: Dewan Instruktur
        description: Papan yang lebih lebar dan panjang dengan stabilitas ekstra serta dek anti selip EVA untuk pelatihan
      - title: Peralatan Keamanan
        description: Rompi pelampung, tali, peluit, dan tas lempar dengan warna yang serasi
      - title: Penyimpanan & Transportasi
        description: Rak papan tumpuk, tempat duduk kayak empuk, dan dolly transportasi
      - title: Dukungan Kurikulum
        description: Template pelajaran, daftar periksa keselamatan, dan panduan perkembangan keterampilan
    cta_text: Mulai Paket Sekolah Saya
    cta_href: /contact
  - title: Paket Premium Sekolah
    subtitle: Untuk sekolah yang sudah mapan dan operator multi-program
    badge: Best Value
    features:
      - title: Armada Lengkap
        description: 25–50 papan atau kayak dengan armada campuran (serba bisa, touring, ukuran muda)
      - title: Armada Instruktur
        description: 3–5 papan instruktur khusus dengan dudukan sistem suara bawaan
      - title: Stasiun Keselamatan
        description: Stasiun perlengkapan keselamatan terpusat dengan PFD, radio, pertolongan pertama, dan papan petunjuk
      - title: Paket Branding
        description: Cetakan logo lengkap pada papan, paddle, PFD, dan seragam
      - title: Program Pemeliharaan
        description: Kit perawatan triwulanan, bundel suku cadang, dan pelatihan perbaikan
    cta_text: Bangun Paket Premium
    cta_href: /contact
  - title: Paket Waralaba Sekolah
    subtitle: Untuk jaringan multi-lokasi dan operator waralaba
    badge: Enterprise
    features:
      - title: Standarisasi Armada
        description: Peralatan yang identik di semua lokasi untuk pengalaman siswa yang konsisten
      - title: Pemesan Pusat
        description: Pemesanan terkonsolidasi, harga grosir, dan manajemen suku cadang terpusat
      - title: Pelatihan Instruktur
        description: Sertifikasi penanganan dan perawatan peralatan untuk semua instruktur
      - title: Co-Branding
        description: Branding bersama dengan opsi co-branding waralaba + Aquafarer
      - title: Dukungan Ekspansi
        description: Konsultasi skala, perkiraan peralatan, dan setup lokasi baru
    cta_text: Diskusikan Rencana Waralaba
    cta_href: /contact
benefits:
  - title: Dibuat untuk Instruksi Harian
    description: PVC yang lebih tebal dan rel yang diperkuat mampu menahan penggunaan siswa setiap hari, jatuh di pasir, dan pendaratan berbatu.
    icon: tabler:shield
  - title: Platform Pembelajaran Stabil
    description: Lambung yang lebih lebar dan rocker yang lebih datar memberikan kepercayaan diri bagi pemula. Instruktur dapat fokus mengajar, bukan peralatan.
    icon: tabler:scale
  - title: Mudah Disimpan & Dibawa
    description: Desain tiup dapat disimpan di ruang kecil. Papan yang dikempiskan muat di bagasi kendaraan standar untuk pengajaran mobile.
    icon: tabler:box-seam
  - title: Branding Kustom
    description: Logo dan warna sekolah pada setiap papan. Brand Anda, identitas Anda — bukan peralatan sewa generic.
    icon: tabler:brush
content_segments:
  tagline: Profil Sekolah
  title: Solusi Pendidikan Olahraga Air<br />Berdasarkan Jenis Program
  subtitle: Sekolah dayung, akademi selancar, program universitas, dan operator waralaba masing-masing menghadapi tantangan operasional yang berbeda — dari integrasi kurikulum hingga standarisasi armada multi-lokasi. Kami menyesuaikan paket peralatan agar sesuai dengan model pendidikan.
  items:
    - title: Sekolah SUP & Kayak Independen
      subtitle: Pusat pelatihan yang dioperasikan oleh pemilik
      description: Sekolah kecil hingga menengah yang dijalankan oleh instruktur-pemilik menawarkan pelajaran SUP, pelatihan kayak, dan kursus sertifikasi. Peralatan harus cukup tahan untuk penggunaan instruksional sehari-hari, terjangkau untuk anggaran bisnis kecil, dan cukup serbaguna untuk melayani siswa pemula hingga menengah dalam satu armada.
      features:
        - Papan SUP yang stabil untuk segala kebutuhan dan kayak rekreasi untuk pelajaran pemula
        - Papan khusus instruktur dengan stabilitas tambahan untuk pelatihan di air
        - Termasuk template rencana pelajaran dan panduan perkembangan keterampilan
        - Program pembaruan peralatan tahunan dengan diskon tukar tambah
    - title: Program Rekreasi Universitas & Perguruan Tinggi
      subtitle: Armada rekreasi mahasiswa berskala besar
      description: Departemen rekreasi universitas yang mengoperasikan klub dayung, program penyewaan, dan kursus instruksional sebagai bagian dari penawaran rekreasi kampus. Peralatan digunakan pada puncak pemakaian selama semester, membutuhkan sistem check-in/check-out yang mudah, dan harus tahan terhadap berbagai tingkat keterampilan dari mahasiswa pemula hingga pendayung mahir.
      features:
        - Konstruksi PVC dengan daya tahan tinggi, dinilai untuk siklus penggunaan institusional
        - Armada diberi kode warna berdasarkan tingkat keterampilan untuk manajemen mudah
        - Kompatibilitas dengan sistem pelacakan inventaris berbasis RFID atau stiker
        - Harga grosir dengan pemesanan dan syarat pembayaran berbasis semester
    - title: Sekolah Selancar & Akademi Selancar
      subtitle: Program instruksi selancar pesisir
      description: Sekolah selancar yang mengajarkan keterampilan SUP selancar, dayung tengkurap, dan kayak selancar di lingkungan laut. Peralatan harus tahan terhadap kondisi zona ombak — ketahanan benturan, toleransi pasir dan air asin, serta mudah dibilas dan dikembalikan untuk rotasi pelajaran setiap jam.
      features:
        - Bentuk khusus selancar dengan rail diperkuat dan konstruksi tahan benturan
        - Pilihan sirip lunak dan leash melingkar untuk keselamatan siswa
        - Kain cepat kering yang mengering antara rotasi pelajaran
        - Program penggantian armada dengan inspeksi dan pembaruan akhir musim
    - title: Waralaba & Jaringan Multi-Lokasi
      subtitle: Peralatan standar di semua lokasi
      description: Operator multi-lokasi yang menjalankan program pelatihan standar di beberapa kota atau wilayah. Konsistensi armada di semua lokasi sangat penting — setiap siswa harus mendapatkan pengalaman peralatan yang sama terlepas dari lokasi waralaba yang dikunjungi. Pemesanan terpusat, keseragaman merek, dan dukungan skalabilitas sangat diperlukan.
      features:
        - Spesifikasi armada identik di semua lokasi waralaba
        - Pemesanan terpusat dengan harga volume
        - 'Opsi co-branding: merek waralaba + Aquafarer co-brand'
        - 'Kit setup lokasi baru: peralatan, papan nama, dan inventaris awal'
