materials:
  intro_p1: Performa, daya tahan, dan keselamatan papan dayung tiup hampir sepenuhnya tergantung pada bahan yang digunakan dalam pembuatannya. Dari laminasi yang membentuk lambung hingga benang yang memberi rigiditas pada SUP papan, setiap pilihan bahan memengaruhi bagaimana produk berperforma di air dan seberapa lama produk tersebut bertahan.
  intro_p2: 'Panduan ini mencakup tiga bahan inti yang digunakan dalam papan dayung tiup modern: laminasi PVC, inti drop-stitch, dan dek busa EVA. Memahami bahan-bahan ini akan membantu Anda memilih papan yang tepat sesuai kebutuhan dan merawatnya untuk umur pakai maksimal.'
  labels:
    advantages: Keunggulan
    limitations: Keterbatasan
    best_for: 'Terbaik untuk:'
  items:
    - name: PVC (Polivinil Klorida)
      summary: Standar industri untuk SUPs tiup. Kain laminasi multi-lapis menawarkan rasio kekuatan terhadap berat yang sangat baik dengan harga yang terjangkau.
      pros:
        - Nilai uang yang sangat baik
        - Ringan dan mudah dihandle
        - Tahan terhadap UV dengan pelapis yang tepat
        - Beragam pilihan warna dan finishing
        - Mudah diperbaiki dengan tambalan PVC dan perekat pelarut
      cons:
        - Umur pakai khas 7-10 tahun dengan perawatan yang tepat
        - Kurang fleksibel pada suhu dingin
        - Tahan kimia lebih rendah
        - Dapat mengalami migrasi plasticizer seiring waktu
      best_for: SUPs rekreasi dan tur, kayuh keluarga, penggunaan musiman, lingkungan air tawar dan pesisir.
    - name: Drop-Stitch Inti
      summary: Teknologi yang merevolusi SUPs yang dapat digembungkan. Ribuan benang poliester menghubungkan lapisan kain atas dan bawah, memungkinkan inflasi tekanan tinggi untuk performa kaku dan keras.
      pros:
        - Sangat kaku pada 12-20 PSI
        - Ringan — 18-30 lbs untuk papan ukuran penuh
        - Dapat dilipat datar untuk penyimpanan dan perjalanan
        - Ketahanan benturan yang sangat baik
        - Performa konsisten di berbagai rentang suhu
      cons:
        - Membutuhkan pompa tekanan tinggi
        - Perbaikan bocor lebih kompleks dibanding lapisan tunggal
        - Biaya produksi lebih tinggi dibanding inflatables standar
        - Kehilangan tekanan seiring waktu membutuhkan pengisian ulang secara berkala
      best_for: Papan dayung berdiri dan semua perlengkapan yang membutuhkan kinerja kaku dengan portabilitas tiup.
    - name: Dek Busa EVA
      summary: Busa sel tertutup EVA (etilena-vinil asetat) digunakan untuk bantalan traksi pada papan SUP. Memberikan bantalan, cengkeraman, dan isolasi termal — serta menampilkan desain seri seni.
      pros:
        - Cengkeraman anti-slip yang sangat baik dalam keadaan basah atau kering
        - Bantalan mengurangi kelelahan pada dayungan panjang
        - Isolasi termal dari permukaan dek yang dingin
        - Tahan UV dan air laut
        - Tersedia dalam penyusunan blok multi-warna dan desain laser-ukir
      cons:
        - Dapat digunakan dengan penggunaan berat selama 2-3 tahun
        - Harus terikat dengan baik untuk mencegah delaminasi
        - Bukan struktural — tidak memengaruhi kekakuan
        - Menambah sedikit berat (200-400 g per papan)
      best_for: traksi dek SUP, desain dek seri seni, dan permukaan apa pun yang membutuhkan pijakan anti-selip.
  selection:
    title: Panduan Pemilihan Material
    subtitle: 'Pilih material yang tepat berdasarkan kasus penggunaan utama Anda:'
    headers:
      - Kasus Penggunaan
      - Material yang Direkomendasikan
      - Alasan
    rows:
      - - Bersepeda rekreasi SUP
        - Drop-stitch PVC
        - Ringan, kaku, terjangkau — keseimbangan ideal untuk pendayung santai
      - - Bermain perahu untuk keluarga & pemula
        - Lebar drop-stitch PVC (32"+)
        - Stabil dan memaafkan — memberi rasa percaya diri bagi pendayung pemula
      - - Memancing & mendayung dengan peralatan berat
        - Lebar drop-stitch PVC dengan dek EVA penuh
        - Stabilitas ekstra untuk berdiri dan melempar, volume tinggi untuk peralatan
      - - Papan armada sewa SUP
        - Drop-stitch PVC + EVA dek
        - Tahan lama, dapat diperbaiki, nilai bagus untuk penggunaan dengan pergantian tinggi
      - - Bersepeda & mendayung jarak jauh
        - Drop-stitch PVC (~11 kaki)
        - Pelacakan lebih baik dan efisiensi seluncur untuk jarak jauh
      - - Yoga & mendayung kebugaran
        - Lebar drop-stitch PVC dengan dek EVA penuh
        - Platform stabil dan nyaman untuk pose dan latihan
  deep_dive:
    title: Panduan Penyelaman Mendalam
    topics:
      - title: Bahan Kelas Laut PVC
        desc: Kain PVC berlapis-lapis yang dilaminasi — penjelasan ketahanan UV, uji abrasi, dan peringkat denier.
      - title: PVC Lapisan Laminasi
        desc: Bagaimana PVC berlapis-multi menyeimbangkan kekuatan, berat, dan ketahanan UV.
      - title: Drop-Stitch Inti
        desc: Bagaimana ribuan benang internal menciptakan struktur tiup kaku bertekanan tinggi pada 15 PSI.
      - title: Teknologi Pengelasan RF
        desc: Pengelasan frekuensi tinggi menciptakan jahitan yang kuat dan konsisten — bagaimana cara kerjanya dan mengapa hal ini penting.
      - title: PSI & Performa
        desc: Mengapa tekanan udara penting untuk SUPs tiup — kekakuan, kapasitas berat, dan kualitas perjalanan.
      - title: Pengujian Kualitas
        desc: Pengujian tekanan, uji daya apung, penuaan UV, dan pengujian destruktif — proses kualitas kami.
      - title: EVA Dek Busa
        desc: Pad dek busa sel-sel tertutup EVA — traksi, kenyamanan, dan daya tahan untuk dek SUP.
      - title: Perawatan Material
        desc: Pembersihan, perlindungan UV, pencegahan jamur, dan praktik penyimpanan terbaik untuk produk tiup.
