materials:
  intro_p1: Performa, daya tahan, dan keselamatan kendaraan air tiup sangat bergantung pada material yang digunakan dalam konstruksinya. Dari kain yang membentuk tabung hingga benang yang memberi kekakuan pada papan SUP, setiap pilihan material memengaruhi bagaimana produk berperforma di air dan berapa lama daya tahannya.
  intro_p2: 'Panduan ini mencakup empat material inti yang digunakan dalam kendaraan air tiup modern: kain PVC, karet Hypalon CSM, konstruksi inti drop-stitch, dan dek busa EVA. Memahami material ini akan membantu Anda memilih produk yang tepat sesuai kebutuhan dan merawatnya agar masa pakainya maksimal.'
  labels:
    advantages: Keunggulan
    limitations: Keterbatasan
    best_for: 'Terbaik untuk:'
  items:
    - name: PVC (Polivinil Klorida)
      summary: Standar industri untuk perahu tiup rekreasi dan SUPs. Kain laminasi berlapis-lapis menawarkan rasio kekuatan-terhadap-berat yang sangat baik dengan harga terjangkau.
      pros:
        - Terjangkau — 30-50% lebih murah dari Hypalon
        - Ringan dan mudah dihandle
        - Tahan terhadap UV dengan pelapis yang tepat
        - Beragam pilihan warna dan finishing
        - Mudah diperbaiki dengan tambalan PVC dan perekat pelarut
      cons:
        - Umur lebih pendek dibanding Hypalon (7-10 tahun)
        - Kurang fleksibel pada suhu dingin
        - Tahan kimia lebih rendah
        - Dapat mengalami migrasi plasticizer seiring waktu
      best_for: SUPs rekreasi, perahu ramah anggaran, armada sewa, penggunaan musiman, air tawar dan lingkungan pesisir.
    - name: Hypalon (Karet CSM)
      summary: Material karet sintetis premium yang dikenal karena daya tahan, ketahanan UV, dan umur panjang yang luar biasa. Standar emas untuk perahu tiup komersial dan militer.
      pros:
        - Ketahanan UV dan ozon yang luar biasa
        - Masa pakai 15-20 tahun dengan perawatan yang tepat
        - Fleksibilitas yang sangat baik di cuaca dingin
        - Ketahanan kimia dan minyak yang superior
        - Menjaga warna lebih lama dibanding PVC
      cons:
        - Jauh lebih mahal dibanding PVC
        - Berat kain lebih tinggi
        - Pilihan warna lebih sedikit
        - Perbaikan memerlukan perekat khusus
        - Fasilitas manufaktur lebih sedikit di seluruh dunia
      best_for: Komersial RIBs, pencarian dan penyelamatan, aplikasi militer, iklim tropis, kepemilikan armada jangka panjang.
    - name: Inti Drop-Stitch
      summary: Teknologi yang merevolusi SUPs yang dapat digembungkan. Ribuan benang poliester menghubungkan lapisan kain atas dan bawah, memungkinkan inflasi tekanan tinggi untuk performa kaku dan keras.
      pros:
        - Sangat kaku pada 12-20 PSI
        - Ringan — 18-30 lbs untuk papan ukuran penuh
        - Dapat dilipat datar untuk penyimpanan dan perjalanan
        - Ketahanan benturan yang sangat baik
        - Performa konsisten di berbagai rentang suhu
      cons:
        - Membutuhkan pompa tekanan tinggi
        - Perbaikan bocor lebih kompleks dibanding lapisan tunggal
        - Biaya produksi lebih tinggi dibanding inflatables standar
        - Kehilangan tekanan seiring waktu membutuhkan pengisian ulang secara berkala
      best_for: Papan dayung berdiri, kayak, dek udara untuk perahu tiup, setiap aplikasi yang membutuhkan performa kaku dengan kemudahan portabilitas inflatables.
    - name: Dek Busa EVA
      summary: Busa EVA sel tertutup (etilen-vinil asetat) digunakan untuk bantalan traksi pada papan SUP dan dek perahu. Memberikan bantalan, cengkeraman, dan isolasi termal.
      pros:
        - Cengkeraman anti-slip yang sangat baik dalam keadaan basah atau kering
        - Bantalan mengurangi kelelahan pada dayungan panjang
        - Isolasi termal dari permukaan dek yang dingin
        - Tahan UV dan air laut
        - Tersedia dalam penyusunan blok multi-warna dan desain laser-ukir
      cons:
        - Dapat digunakan dengan penggunaan berat selama 2-3 tahun
        - Harus terikat dengan baik untuk mencegah delaminasi
        - Bukan struktural — tidak memengaruhi kekakuan
        - Menambah sedikit berat (200-400 g per papan)
      best_for: SUP traksi dek, alas dek perahu, kenyamanan tempat duduk kayak, setiap permukaan yang memerlukan pijakan anti-selip.
  selection:
    title: Panduan Pemilihan Material
    subtitle: 'Pilih material yang tepat berdasarkan kasus penggunaan utama Anda:'
    headers:
      - Kasus Penggunaan
      - Material yang Direkomendasikan
      - Alasan
    rows:
      - - Bersepeda rekreasi SUP
        - Drop-stitch PVC
        - Ringan, kaku, terjangkau — keseimbangan ideal untuk pendayung santai
      - - Perahu keluarga / danau
        - PVC (1100 denier)
        - Biaya efektif, mudah diperbaiki, ketahanan cukup untuk penggunaan rekreasi
      - - Perahu komersial RIB / patroli
        - Hypalon CSM
        - Ketahanan UV maksimal, umur 15-20 tahun, tahan terhadap bahan kimia/minyak
      - - Papan armada sewa SUP
        - Drop-stitch PVC + EVA dek
        - Tahan lama, dapat diperbaiki, nilai bagus untuk penggunaan dengan pergantian tinggi
      - - Operasi pencarian & penyelamatan
        - Hypalon CSM
        - Terpercaya dalam kondisi ekstrem, fleksibilitas dingin, tahan bahan kimia
      - - Kayak tur / ekspedisi
        - Drop-stitch PVC
        - Performa kaku dengan portabilitas yang bisa dibawa untuk perjalanan
  deep_dive:
    title: Panduan Penyelaman Mendalam
    topics:
      - title: Bahan Kelas Laut PVC
        desc: Kain PVC berlapis-lapis yang dilaminasi — penjelasan ketahanan UV, uji abrasi, dan peringkat denier.
      - title: PVC vs Hypalon
        desc: Perbandingan definitif dari dua material perahu tiup dominan — biaya, umur, ketahanan UV.
      - title: Inti Drop-Stitch
        desc: Bagaimana ribuan benang internal menciptakan struktur tiup bertekanan tinggi yang kaku pada 12-15 PSI.
      - title: Teknologi Pengelasan RF
        desc: Pengelasan frekuensi tinggi menciptakan jahitan yang kuat dan konsisten — bagaimana cara kerjanya dan mengapa hal ini penting.
      - title: PSI & Performa
        desc: Mengapa tekanan udara penting untuk SUPs dan perahu tiup — kekakuan, kapasitas berat, dan kualitas berkendara.
      - title: Pengujian Kualitas
        desc: Pengujian tekanan, uji daya apung, penuaan UV, dan pengujian destruktif — proses kualitas kami.
      - title: EVA Dek Busa
        desc: Pad dek EVA busa sel tertutup — traksi, kenyamanan, dan daya tahan untuk SUP dan dek perahu.
      - title: Perawatan Material
        desc: Pembersihan, perlindungan UV, pencegahan jamur, dan praktik penyimpanan terbaik untuk produk tiup.
