articles:
  sup:
    - title: SUP Dasar — Panduan Pemula
      desc: Segala yang perlu diketahui pemula — jenis papan, ukuran dayung, posisi berdiri, dan tips hari pertama.
    - title: SUP Panduan Ukuran
      desc: Temukan panjang, lebar, dan volume papan yang tepat untuk berat badan, keterampilan, dan gaya mendayung Anda.
    - title: Papan Tiup vs Papan Keras
      desc: Mana yang tepat untuk Anda? Perbandingan portabilitas, kinerja, ketahanan, dan biaya.
    - title: Teknik Menengah
      desc: Tingkatkan dayungan Anda dengan pukulan yang lebih maju, teknik berbelok, dan penanganan air liar.
    - title: Cara Memilih SUP Inflatable
      desc: Navigasikan faktor kunci — konstruksi, ketebalan, pengaturan sirip, dan aksesori yang disertakan.
    - title: Keamanan Air
      desc: Pengetahuan keselamatan penting termasuk membaca cuaca, pemilihan PFD, penyelamatan diri, dan dayung kelompok.
  inflatable-boat:
    - title: Referensi Material
      desc: PVC, Hypalon, drop-stitch, peringkat denier — pahami bahan apa yang digunakan untuk perlengkapan inflatable Anda.
    - title: PVC vs Hypalon
      desc: Perbandingan definitif kain PVC dan Hypalon untuk perahu karet — ketahanan, ketahanan UV, dan biaya.
    - title: Drop-Stitch Penjelasan Inti
      desc: Bagaimana ribuan benang internal menciptakan platform kaku pada 12-15 PSI untuk SUPs inflatable berkinerja tinggi.
    - title: Tinjauan Teknologi Inflatable
      desc: Bagaimana perahu karet dan SUPs dibuat — dari penyusunan bahan hingga sistem katup dan pengelasan sambungan.
    - title: Panduan Rigid Inflatable Boat (RIB)
      desc: Segalanya tentang konstruksi RIB, jenis lambung, bahan tabung, dan memilih RIB yang tepat untuk kebutuhan Anda.
    - title: Perahu Karet vs RIB
      desc: Perbedaan utama antara perahu dinghy karet tradisional dan perahu karet lambung kaku untuk berbagai penggunaan.
  water-safety:
    - title: Panduan Keamanan Air
      desc: Pengetahuan keselamatan penting untuk setiap pendayung — cuaca, PFD, penyelamatan diri, dan protokol dayung kelompok.
    - title: Panduan Jaket Pelampung & PFD
      desc: Cara memilih alat pelampung pribadi yang tepat untuk SUP, kano, perahu, dan penggunaan profesional.
    - title: SUP Daftar Periksa Keselamatan
      desc: Daftar periksa keselamatan sebelum peluncuran yang harus diikuti setiap peselancar papan dayung sebelum masuk ke air.
    - title: Keselamatan Mendayung di Air Dingin
      desc: Langkah-langkah pencegahan, perlengkapan, dan teknik penting untuk mendayung di kondisi air dingin.
    - title: Kesalahan Mendayung Pemula
      desc: Kesalahan umum yang dilakukan pendayung pemula dan cara menghindarinya untuk pengalaman yang lebih aman dan menyenangkan.
    - title: CE Penjelasan Sertifikasi
      desc: Apa arti sertifikasi CE untuk kendaraan air tiup — standar, pengujian, dan mengapa hal ini penting untuk keselamatan.
