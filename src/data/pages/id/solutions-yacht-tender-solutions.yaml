content_challenge:
  tagline: Tantangan
  title: Tender Yacht Diperlukan<br />Penampilan & Presentasi
  subtitle: Kapal pendukung yacht lebih dari sekadar perahu kecil — ini adalah perpanjangan dari kapal induk dan pernyataan kualitas.
  paragraphs:
    - Pemilik dan kapten kapal pesiar membutuhkan tender yang performa baik, penyimpanan ringkas, dan presentasi yang indah. Tender harus melengkapi estetika yacht sekaligus menyediakan transportasi yang andal bagi tamu dan kru.
    - '**Penyimpanan sangat penting** — Tender harus muat di dek, garasi, atau davit. Berat penting untuk sistem peluncuran dan pemulihan.Aquafarer RIBs Menawarkan rasio daya terhadap berat yang sangat baik dengan profil penyimpanan yang kompak.'
    - '**Ekspektasi performa tinggi** — Tamu mengharapkan perjalanan yang mulus dan kering saat dipindahkan ke darat. Pilihan mesin harus menyeimbangkan kecepatan, jangkauan, dan tingkat kebisingan untuk pengalaman premium. Untuk operasi charter, tender beroperasi setiap hari dan harus tahan terhadap penggunaan sering.'
    - '**Penampilan penting** — Tender yang tidak serasi atau aus mengurangi presentasi yacht secara keseluruhan. Warna tabung kustom, pelapis kain, dan branding memastikan tender terlihat seperti milik kapal pesiar.'
content_solution:
  tagline: Solusi Kami
  title: Konfigurasi tender<br />Untuk Setiap Aplikasi Yacht
  subtitle: Aquafarer RIB tender dapat disesuaikan untuk menyesuaikan dengan kapal, jenis operasi, dan kebutuhan penyimpanan Anda — mulai dari spesifikasi pembuat superyacht hingga program armada charter.
  list:
    - Warna tabung khusus untuk menyesuaikan atau melengkapi pembuluh induk — warna RAL apa pun yang tersedia untuk Hypalon PVC tabung atau tabung
    - Pelapis dan jahitan kustom — vinyl kelas laut premium dengan warna yang serasi dan bordir logo
    - Kemudi konsol atau kemudi — pilih berdasarkan pola penggunaan dan preferensi operator
    - Lambung fiberglass deep-V untuk perjalanan yang halus dan kering dalam berbagai kondisi laut
    - Penyimpanan kompak — dapat dikempiskan atau ditumpuk untuk dek garasi, loker, atau penyimpanan davit
    - Hypalon tabung untuk UV ketahanan dan pelestarian tampilan jangka panjang
    - Titik angkat dan cincin tarik standar di semua model
    - Opsional penutup haluan, penutup penuh, dan pelindung abrasi
    - 'Rentang mesin: 15 HP hingga 60 HP — konfigurasi motor tempel atau tiller'
    - OEM/label pribadi tersedia untuk pembuat kapal pesiar dan dealer maritim
content_segments:
  tagline: Profil Pelanggan
  title: Solusi Tender Yacht<br />Berdasarkan Tipe Pelanggan
  subtitle: Segmen industri kapal pesiar yang berbeda memiliki kebutuhan unik. Aquafarer mengatur tender untuk sesuai dengan setiap aplikasi.
  items:
    - title: Pembuat Superyacht
      subtitle: Integrasi tender OEM — dimensi, warna, dan material khusus
      description: 'Pembuat kapal pesiar menghadapi tantangan berulang: setiap kapal baru memiliki batasan dimensi unik, batas berat, dan ekspektasi estetika. Tender harus terintegrasi sempurna dengan sistem davit kapal induk, pas dalam dimensi garasi yang tepat, dan sesuai dengan bahasa desain kapal pesiar bernilai jutaan euro. Ketidaksesuaian apa pun — warna tabung yang salah, penempatan titik angkat yang tidak tepat, berat yang tidak kompatibel — akan menunda pengiriman dan mencerminkan reputasi pembuat. Aquafarer bekerja langsung dengan tim pengadaan dan desain pembuat untuk mengirim tender dengan warna tabung RAL custom, pelapis yang serasi, panel konsol bermerek, dan paket dokumentasi OEM lengkap.'
      features:
        - Spesifikasi dimensi kustom yang sesuai dengan batasan garasi dan davit
        - Warna tabung RAL apa pun dan pelapis yang serasi — sampel persetujuan desain disediakan
        - Branding OEM pada konsol, tabung, dan sandaran kursi
        - Validasi titik angkat dan pemasangan davit untuk setiap model
        - Berat lambung dioptimalkan untuk sistem peluncuran dan pemulihan yang ditentukan
        - Jadwal pengiriman massal disesuaikan dengan lini produksi
    - title: Perusahaan Manajemen Kapal Pesiar
      subtitle: Tender standar armada — dukungan global, waktu henti minim
      description: Perusahaan manajemen mengawasi beberapa kapal pesiar yang beroperasi di seluruh Mediterania, Karibia, Pasifik Selatan, dan seterusnya. Kebutuhan utama mereka adalah keandalan — tender yang rusak di pelabuhan terpencil berarti lembur awak, keluhan tamu, dan penggantian mendadak mahal. Spesifikasi armada yang distandarisasi mengurangi waktu pelatihan awak di setiap kapal dan mempermudah pengelolaan suku cadang. Aquafarer menawarkan harga armada untuk beberapa kapal, spesifikasi konsisten di seluruh pesanan, dan dukungan suku cadang global untuk perusahaan manajemen dengan kapal di berbagai wilayah.
      features:
        - Spesifikasi standar di seluruh armada yang dikelola
        - Suku cadang saling tukar di semua tender armada
        - Harga armada dan diskon volume untuk pesanan multi-unit
        - Ketersediaan suku cadang global — pengiriman cepat ke pelabuhan mana pun
        - Dokumentasi layanan dan perawatan konsisten untuk awak
        - Koordinasi pengiriman multi-unit ke lokasi kapal yang berbeda
    - title: Operator Sewa Kapal Pesiar
      subtitle: Operasi harian frekuensi tinggi — daya tahan tanpa mengorbankan tampilan
      description: 'tender charter menghadapi jadwal operasional paling berat di industri yacht: transfer tamu harian, perjalanan darat, dukungan olahraga air, dan tender pelabuhan — sering kali 200+ operasi per musim charter. tender harus terlihat bersih untuk setiap serah terima tamu sambil tahan boarding terus-menerus, paparan air asin, dan jam mesin. Penurunan penampilan adalah masalah bisnis langsung — tender yang aus memengaruhi ulasan tamu dan tarif charter.Aquafarer Mengonfigurasi tender charter dengan pelapis yang ditingkatkan, Hypalon tabung tugas berat, dan area penanganan yang diperkuat untuk daya tahan jangka panjang yang menjaga kualitas presentasi.'
      features:
        - Hypalon Tabung tugas berat — masa pakai 5-8 tahun dalam layanan charter harian
        - Tangga naik yang diperkuat dan tali pegangan penanganan untuk penggunaan yang sering
        - Pelapis vinil tahan noda premium — mudah dibersihkan antara sewa
        - Permukaan dek anti selip yang mudah dibersihkan
        - Paket luar yang andal dengan akses layanan mudah untuk waktu yang ketat
        - Material kelas kosmetik yang mempertahankan penampilan selama musim charter
    - title: Dealer & Broker Yacht
      subtitle: Pasokan tender yang andal untuk penyelesaian kapal dan nilai jual kembali
      description: Dealer dan broker membutuhkan pasokan tender berkualitas yang stabil yang melengkapi kapal yang mereka jual — menyesuaikan posisi merek dan meningkatkan pengalaman pembeli. Keterlambatan tender atau pasokan yang tidak konsisten dapat menunda serah terima kapal pesiar atau mengurangi presentasi listing. Dealer membutuhkan kualitas yang konsisten di seluruh batch, waktu pengiriman yang andal, dan harga yang kompetitif untuk menjaga margin.Aquafarer Menawarkan program inventaris dealer dengan penjadwalan pengiriman musiman, opsi co-branding untuk tampilan showroom, dan alokasi prioritas selama musim puncak.
      features:
        - Program persediaan stok dengan model tersedia sesuai permintaan
        - Penjadwalan pengiriman musiman yang disesuaikan dengan kalender serah terima
        - Co-branding dealer pada konsol dan tabung untuk display showroom
        - Kualitas dan spesifikasi yang konsisten di semua pesanan batch
        - Penetapan harga dealer yang kompetitif dengan tingkat berbasis volume
