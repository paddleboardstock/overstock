hero:
  tagline: Pengetahuan Eksplorasi Air
  title: Mempelajari
  subtitle: |
    Panduan, tutorial, dan penjelajahan mendalam — semua yang Anda butuhkan untuk menjelajahi<br />
    berenang dengan percaya diri. Dari memilih SUP pertama Anda hingga menguasai teknik lanjutan.
  taglineSection: Pengetahuan untuk setiap pengayuh. Dari pemula hingga profesional.
featured:
  tagline: Topik Unggulan
  title: Mulailah perjalanan belajar Anda
  subtitle: Apakah Anda baru dalam olahraga air atau ingin meningkatkan kemampuan, panduan kami siap membantu Anda.
  items:
    - title: SUP Dasar-dasar
      description: Segala yang perlu diketahui pemula — jenis papan, ukuran dayung, posisi berdiri, dan tips hari pertama.
      icon: tabler:lifebuoy
      href: /learn/sup
    - title: Papan Tiup vs Papan Keras
      description: Mana yang tepat untuk Anda? Kami membandingkan portabilitas, kinerja, daya tahan, dan biaya secara berdampingan.
      icon: tabler:arrows-left-right
      href: /compare/inflatable-vs-hardboard
    - title: Keamanan Air
      description: Pengetahuan keselamatan penting yang harus dimiliki setiap pendayung — cuaca, PFD, penyelamatan diri, dan lainnya.
      icon: tabler:shield
      href: /learn/water-safety
    - title: Panduan Bahan
      description: PVC vs Hypalon, teknologi drop-stitch, peringkat penolak — pahami dari apa peralatan Anda terbuat.
      icon: tabler:hexagons
      href: /learn/materials
    - title: SUP Panduan Ukuran
      description: Temukan panjang, lebar, dan volume papan yang tepat untuk berat badan, keterampilan, dan gaya mendayung Anda.
      icon: tabler:ruler
      href: /size-guide
    - title: Teknik Menengah
      description: Tingkatkan dayungan Anda dengan pukulan yang lebih maju, teknik berbelok, dan penanganan air liar.
      icon: tabler:ripple
      href: /learn/intermediate-techniques
