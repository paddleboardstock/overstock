hero:
  tagline: Pabrik
  title: Pabrik & Manufaktur
  subtitle: 12.000 m² manufaktur terintegrasi — dari bahan baku hingga papan jadi
intro:
  - Sebagai merek pabrik dari **Paddle Board Overstock Weihai Manufacturing Hub**, Paddle Board Overstock mengontrol setiap tahap produksi — dari kedatangan bahan PVC dan drop-stitch hingga inspeksi pra-pengiriman final papan jadi. Fasilitas manufaktur kami di Kawasan Pengembangan Ekonomi Weihai memiliki luas 12.000 meter persegi dan memiliki bengkel khusus untuk pemotongan PVC, penyegelan panas dan pengelasan, penyelesaian seni dek, perakitan akhir, dan pengujian kualitas.
  - Dengan mengintegrasikan desain, teknik, pembuatan prototipe, manufaktur, dan pengujian di bawah satu atap, kami menghilangkan inefisiensi dari manufaktur kontrak dan mempertahankan kontrol langsung atas kualitas pembuatan, pemilihan bahan, dan jadwal pengiriman. Setiap papan yang keluar dari bengkel kami dibuat oleh orang-orang kami, menggunakan peralatan kami, sesuai standar kami.
