qc_section:
  tagline: Kontrol Kualitas
  title: Proses Pengujian & Jaminan Kualitas
  subtitle: Setiap papan menjalani pengujian wajib sebelum dikirim. Laboratorium kualitas kami beroperasi secara independen dari produksi dan melapor langsung kepada manajemen.
  steps:
    - step: '1'
      title: Inspeksi Bahan Baku
      desc: Kain PVC dan drop-stitch menjalani pengujian tarik, propagasi sobek, dan verifikasi ketahanan UV sebelum setiap batch masuk produksi.
    - step: '2'
      title: Tes Retensi Udara 48 Jam
      desc: Setiap ruang papan dipompa hingga 125% dari tekanan nominal dan dipertahankan selama 48 jam. Penurunan tekanan melebihi 5% memicu penolakan otomatis dan inspeksi ulang sambungan.
    - step: '3'
      title: Tes Beban & Keseimbangan
      desc: Papan yang sudah selesai dimuat hingga kapasitas maksimum yang dinilai dan diuji untuk stabilitas, freeboard, dan penanganan. Setiap papan diuji dengan air sebelum inspeksi akhir.
faq_section:
  tagline: Pertanyaan Umum
  title: Pertanyaan yang Sering Diajukan
  questions:
    - q: Di mana papan paddle Anda dibuat?
      a: Setiap papan dibangun di pabrik kami seluas 12.000 m² di Weihai, China. Kami tidak melakukan outsourcing — desain, material, pengelasan, perakitan, dan pengujian semuanya dilakukan di bawah satu atap, sehingga kualitas tidak pernah bergantung pada pihak ketiga.
    - q: Bagaimana harga Anda bisa jauh lebih rendah daripada ritel?
      a: Kami menjual stok berlebih pabrik dan batch clearance langsung dari fasilitas produksi kami sendiri — tanpa perantara, tanpa kenaikan harga ritel. Artinya, SUP paket lengkap dengan harga ritel hingga 60% pada umumnya, dengan kualitas yang sama yang telah diuji tekanan.
    - q: Apa saja yang termasuk dalam sebuah papan?
      a: 'Setiap SUP pengiriman dalam paket lengkap: papan, ransel perjalanan, pompa tangan, dayung yang dapat disesuaikan, sirip yang dapat dilepas, tali koil, dan perlengkapan perbaikan.'
    - q: Seberapa cepat pesanan dikirim?
      a: Pesanan yang tersedia meninggalkan pabrik kami di Weihai dalam waktu 2-3 hari kerja dengan pengiriman terlacak ke 50+ negara di seluruh UE, Amerika Utara, Asia-Pasifik, dan sekitarnya.
production_flow:
  tagline: Aliran Produksi
  title: Dari Material ke Papan Selesai
  subtitle: Setiap papan melewati 6 tahap produksi dengan pos pemeriksaan QC di setiap langkah. Tidak ada jalan pintas, tidak ada inspeksi yang terlewat.
  stages:
    - stage: '01'
      title: Penerimaan Material & QC Masuk
      description: Semua bahan yang masuk dicatat berdasarkan nomor batch/lot di sistem ERP kami. Gulungan kain PVC, inti drop-stitch, katup, perekat, dan perangkat keras dikarantina sampai persetujuan QC.
      qc_check: Kekuatan tarik, tahan sobek, pengukur ketebalan, viskositas perekat, pemindaian cacat visual
      qc_threshold: 100% dari batch diuji. Tolak jika tarik < 90% dari spesifikasi, sobek < minimum spesifikasi, atau ada cacat visual
      responsibility: Tim QC yang akan datang (3 pemeriksa)
    - stage: '02'
      title: CNC Pemotongan & Persiapan Material
      description: Penyusunan yang dioptimalkan komputer menata panel pada stok PVC untuk meminimalkan limbah. Mesin pemotong CNC otomatis mempertahankan akurasi posisi 0,1 mm.
      qc_check: Pemeriksaan dimensi terhadap file CAD DXF, inspeksi kualitas tepi, verifikasi jumlah panel
      qc_threshold: Setiap panel ke-20 diukur. Toleransi ±0,5 mm. Tolak batch jika >2% di luar toleransi
      responsibility: Pemimpin lokakarya pemotongan
    - stage: '03'
      title: Pengelasan & Drop-Stitch Perekatan
      description: Inti Drop-stitch direkatkan pada laminasi luar PVC menggunakan laminasi panas. Ruang tabung dilas RF atau dilas udara panas. Pita rel direkatkan lapisan tiga dengan fusion bonding.
      qc_check: Uji peel setiap 50 unit, pengukuran lebar las, tinjauan log suhu udara panas, inspeksi sambungan visual di bawah cahaya latar
      qc_threshold: Kekuatan pelepasan minimal 8 N/cm. Toleransi lebar las ±1 mm. Setiap saluran yang terlihat = tolak
      responsibility: Kontrol Kualitas Pengelasan (2 inspektur per shift)
    - stage: '04'
      title: Perakitan & Pemasangan
      description: 'Papan dipindahkan ke perakitan akhir di mana semua komponen dipasang: katup dipasang, cincin D, pegangan, kotak sirip, dan pemasangan tas pembawa. Setiap unit mengikuti daftar periksa perakitan 100 poin.'
      qc_check: Tanda tangan daftar periksa 100 poin per unit, uji fungsi katup (10 siklus buka/tutup), verifikasi torsi perangkat keras, inspeksi visual
      qc_threshold: Kebijakan nol cacat pada barang yang kritis terhadap keselamatan (katup, cincin D, pegangan). Cacat kosmetik kecil dalam batas kosmetik yang ketat
      responsibility: Pemimpin tim perakitan + QC lini
    - stage: '05'
      title: Pengujian Tekanan & Tahan Kualitas
      description: Setiap ruang dipompa hingga 1,25× tekanan terukur (biasanya 20–25 PSI) dan dipertahankan selama 24–48 jam. Sensor tekanan mencatat secara terus-menerus. Ruang yang mengalami penurunan tekanan lebih dari 5% ditolak dan dikirim untuk pemeriksaan ulang jahitan.
      qc_check: Log tekanan 24 jam, kalibrasi sensor diverifikasi setiap hari, pembacaan tekanan yang dikompensasikan suhu, pengujian ulang sambungan setelah perbaikan
      qc_threshold: Penurunan tekanan maksimal 5% selama 24 jam pada suhu stabil. Setiap ruang yang melebihi ini = 100% pengujian ulang seluruh batch produksi.
      responsibility: Laboratorium kualitas (independen dari produksi, melaporkan ke manajemen)
    - stage: '06'
      title: Inspeksi Akhir & Pengemasan
      description: Inspeksi visual dan fungsional akhir. Cacat permukaan, konsistensi warna, verifikasi label/BIN, integritas kemasan, dan kelengkapan aksesori. Unit dikemas dalam vakum, dikotakkan, dan dipaletrisasi untuk pemuatan kontainer.
      qc_check: Inspeksi visual penuh, daftar aksesori per SKU, uji jatuh kemasan (1 m, sampel acak), verifikasi pemindaian label/barcode
      qc_threshold: Toleransi nol terhadap cacat keselamatan. Cacat kosmetik dalam batas yang ketat. 100% unit diperiksa secara visual
      responsibility: Tim QC akhir (4 inspeksi) + pimpinan tim pengemasan
workforce:
  tagline: Orang-orang kami
  title: Tenaga Kerja & Keahlian
  engineers: 25+
  engineers_detail: Insinyur di seluruh R&D, desain cetakan, laboratorium bahan, dan rekayasa produksi. Rata-rata 7+ tahun dalam produksi barang tiup.
  shift_pattern: 2 shift/hari (07:00–15:30, 15:30–00:00). Shift malam opsional untuk pesanan mendesak.
  training: Pelatihan QC bulanan, latihan keselamatan triwulanan, penilaian keterampilan tahunan. Karyawan baru menyelesaikan induksi 40 jam sebelum bekerja di lini produksi.
  departments:
    - name: Litbang & Rekayasa
      count: 25+
      role: Desain produk, rekayasa cetakan, laboratorium bahan
    - name: Pemotongan & Persiapan Bahan
      count: 15
      role: CNC pemotongan, persiapan panel, penanganan bahan
    - name: Pengelasan & Laminasi
      count: 40
      role: Pengelasan RF, pengelasan udara panas, drop-stitch perekat
    - name: Seni dan Finishing Dek
      count: '25'
      role: EVA pemasangan dek, penyelesaian seri seni
    - name: Perakitan & Pemasangan
      count: 35
      role: Perakitan akhir, pemasangan perangkat keras, pemeriksaan sistem
    - name: Kontrol Kualitas
      count: 12
      role: QC masuk, QC dalam proses, inspeksi akhir, pengujian laboratorium
    - name: Logistik & Pengemasan
      count: 20
      role: Pengemasan, pemuatan kontainer, dokumentasi ekspor
    - name: Manajemen & Administrasi
      count: 15
      role: Penjualan, pengadaan, SDM, keuangan, kepatuhan
material_traceability:
  tagline: Penelusuran
  title: Pelacakan Bahan & Kontrol Batch
  description: Setiap batch bahan baku diberikan nomor lot unik dalam sistem ERP kami. Dari kedatangan hingga produksi hingga produk jadi, bill of materials setiap papan terhubung kembali ke batch pemasok asli. Ini memungkinkan ketelusuran hulu penuh untuk setiap pertanyaan kualitas.
  system: Sistem ERP khusus (internal) + tag batch fisik pada setiap perintah kerja
  coverage: 100% bahan produksi — PVC, drop-stitch kain, EVA busa, perekat, katup, perangkat keras, kemasan
  records_retained: 10 tahun
qc_dashboard:
  tagline: QC Menurut Angka
  title: Metrik Pengendalian Mutu
  subtitle: Data lolos/gagal nyata dari jalur produksi kami. Laboratorium kualitas kami beroperasi secara independen dari produksi dan melapor langsung ke manajemen.
  stats:
    - value: 100%
      label: Unit diuji tekanan
      detail: Setiap papan, setiap ruang udara, setiap batch
    - value: <5%
      label: Penurunan tekanan maksimum yang diizinkan
      detail: Selama 24 jam pada 1,25× tekanan tertera
    - value: 99.3%
      label: Tingkat bebas cacat
      detail: Per pengambilan sampel QC internal
    - value: 24–48h
      label: Durasi tahan tekanan
      detail: Tergantung kategori produk
    - value: 1.25×
      label: Tekanan uji vs tekanan tertera
      detail: Margin keselamatan di setiap kompartemen
    - value: 0%
      label: Toleransi pada cacat keselamatan
      detail: Katup, cincin D, jahitan, daya apung
