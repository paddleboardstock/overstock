workshops_section:
  tagline: Workshop
  title: Workshop Manufaktur
  workshops:
    - title: PVC Pemotongan & Persiapan Material
      description: Mesin pemotong CNC otomatis memproses kain PVC dan drop-stitch dengan presisi sub-milimeter. Penempatan optimasi komputer meminimalkan limbah bahan dan memastikan setiap panel memenuhi spesifikasi dimensi sebelum pengelasan.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Pengelasan & Penyegelan Panas
      description: Bengkel pengelasan khusus dengan mesin penyegel panas dan press dielektrik RF. Pengelasan udara panas mengikat dan menyatukan laminasi inti drop-stitch dan pita rel, sementara pengelasan RF menghasilkan sambungan kedap udara dengan kekuatan tinggi.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Seni Dek & EVA Penyelesaian
      description: 'Deck seri seni terbentuk di sini: panel busa EVA yang dipotong presisi ditempatkan dalam pola deck penuh, direkatkan, dan dipangkas dengan tangan untuk hasil akhir yang nyaman, tahan lama, dan memiliki daya cengkram — tampilan khas dari setiap papan seri seni.'
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
    - title: Cetak & Dekorasi SUP
      description: Papan SUP dihias menggunakan cetak digital untuk grafik penuh warna dan screen printing untuk logo serta pola berulang. Printer digital menghasilkan desain dek berkualitas foto, sedangkan screen printing memberikan tanda merek yang tahan lama dan jelas.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Perakitan Akhir & Rigging
      description: Garis perakitan tempat papan menerima katup, cincin D, pegangan, sirip, dan pengikat tali. Setiap papan mengikuti daftar periksa perakitan 100 poin yang ditandatangani oleh pemimpin tim.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Pengujian & Inspeksi Kualitas
      description: Setiap papan yang selesai melewati pengujian daya tahan udara wajib, verifikasi pengelupasan jahitan, dan pemeriksaan sistem lengkap sebelum dikirim. Laboratorium kualitas kami beroperasi secara independen dari produksi dan melapor langsung kepada manajemen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
