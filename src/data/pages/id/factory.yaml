workshops_section:
  tagline: Workshop
  title: Workshop Manufaktur
  workshops:
    - title: PVC Pemotongan & Persiapan Material
      description: Mesin pemotong CNC otomatis memproses kain PVC, Hypalon, dan drop-stitch dengan presisi sub-milimeter. Penataan komputer yang dioptimalkan meminimalkan limbah material dan memastikan setiap panel memenuhi spesifikasi dimensinya sebelum pengelasan.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    - title: Pengelasan Tabung & Penyegelan Panas
      description: Workshop pengelasan khusus dengan mesin penyegel panas dan press dielektrik RF. Penyegel panas udara mengikat dan menyatukan ruang tabung PVC, sementara pengelasan RF menghasilkan jahitan kedap udara dengan kekuatan tinggi yang melebihi persyaratan ISO 9001.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    - title: Produksi Lambung RIB — Fiberglass
      description: Lambung kapal RIB diproduksi menggunakan cetakan fiberglass hand-lay-up dengan sistem resin poliester dan vinilester. Setiap lapisan digulung tangan dan dikemas dalam vakum untuk kualitas yang konsisten. Booth semprot gelcoat menyediakan finishing laut yang mengkilap dan tahan UV.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-warehouse-storage.webp
    - title: Cetak & Dekorasi SUP
      description: Papan SUP dihias menggunakan cetak digital untuk grafik penuh warna dan screen printing untuk logo serta pola berulang. Printer digital menghasilkan desain dek berkualitas foto, sedangkan screen printing memberikan tanda merek yang tahan lama dan jelas.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    - title: Perakitan Akhir & Rigging
      description: Lini perakitan di mana lambung fiberglass dan tabung PVC dipasang, mesin dipasang, kemudi dan kendali dihubungkan, dan sistem kelistrikan diinstal. Setiap kapal mengikuti daftar periksa perakitan 100 poin yang ditandatangani oleh pimpinan tim.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    - title: Pengujian & Inspeksi Kualitas
      description: Setiap kapal yang selesai menjalani pengujian retensi udara wajib, verifikasi pelepasan jahitan, dan pemeriksaan sistem lengkap sebelum pengiriman. Laboratorium kualitas kami beroperasi secara independen dari produksi dan melapor langsung kepada manajemen.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
