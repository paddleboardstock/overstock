qc_section:
  tagline: Kontrol Kualitas
  title: Proses Pengujian & Jaminan Kualitas
  subtitle: Setiap perahu menjalani pengujian wajib sebelum pengiriman. Laboratorium kualitas kami beroperasi secara independen dari produksi dan melapor langsung kepada manajemen.
  steps:
    - step: '1'
      title: Inspeksi Bahan Baku
      desc: Kain PVC, Hypalon, dan drop-stitch menjalani pengujian tarik (ASTM D751), propagasi robek, dan verifikasi ketahanan UV sebelum batch apa pun masuk produksi.
    - step: '2'
      title: Tes Retensi Udara 48 Jam
      desc: Setiap kamar tabung dipompa hingga 125% dari tekanan yang ditentukan dan ditahan selama 48 jam. Penurunan tekanan lebih dari 5% memicu penolakan otomatis dan pemeriksaan kembali sambungan.
    - step: '3'
      title: Tes Beban & Keseimbangan
      desc: Perahu yang selesai dimuat hingga kapasitas maksimum yang ditentukan dan diuji untuk stabilitas, freeboard, dan penanganan. Setiap vessel diuji di air sebelum inspeksi akhir.
oem_section:
  tagline: Proyek OEM
  title: Studi Kasus Merek & Kemitraan OEM
  subtitle: Dari konsep hingga kontainer — bagaimana kami membantu merek global meluncurkan dan mengembangkan lini kapal air karet mereka.
  cases:
    - challenge: Pengecer outdoor Eropa membutuhkan lini SUP label pribadi dengan grafis dek unik, PVC ramah lingkungan, dan kemasan siap ritel — semua selesai dalam 60 hari.
      solution: Mengembangkan file cetak digital kustom, memperoleh PVC yang sesuai REACH, dan mempersingkat sampling dari 3 putaran menjadi 1 dengan menempatkan tim desain di pabrik kami di Qingdao.
      result: 55 hari dari PO yang ditandatangani hingga FOB. 2.400 unit di 4 SKU. Pesanan ulang dilakukan sebelum kontainer pertama tiba.
    - challenge: Startup olahraga air AS membutuhkan kayak drop-stitch berperforma tinggi dengan bentuk lambung kustom, kemasan co-branded, dan sertifikasi BSCI untuk penempatan ritel.
      solution: Memodifikasi cetakan kayak drop-stitch yang ada dengan profil rocker yang dimodifikasi, mengembangkan artwork kemasan co-branded, dan menyediakan dokumentasi audit BSCI lengkap.
      result: Berhasil terdaftar di 3 chain outdoor besar di AS. 5.000 unit + pada tahun pertama dengan tingkat terjual 98%.
    - challenge: Distributor Australia membutuhkan jajaran RIB bersertifikasi CE dengan warna tabung kustom, opsi peningkatan Hypalon, dan kepatuhan dengan Standar Australia AS 1799.
      solution: Membuat sampel pra-produksi dengan 4 variasi warna tabung, memperoleh Hypalon CSM dari pemasok Jepang, dan mengkoordinasikan pengujian kepatuhan AS 1799 pihak ketiga.
      result: Jajaran RIB 3 model diluncurkan di pasar AU/NZ. Diikuti dengan kemenangan tender pemerintah untuk 12 patroli RIBs.
faq_section:
  tagline: Pertanyaan Umum
  title: Pertanyaan yang Sering Diajukan B2B & OEM
  questions:
    - q: Berapa jumlah pesanan minimum (MOQ) untuk papan karet OEM?
      a: MOQ mulai dari 5–10 unit untuk model OEM standar. Cetakan kustom dan proyek label pribadi memerlukan minimum 200 unit tergantung tingkat kompleksitas. Pesanan percobaan dan jalur sampel tersedia untuk peluncuran merek baru.
    - q: Apakah Paddle Board Overstock memiliki sertifikasi BSCI?
      a: Ya. Pabrik kami mempertahankan sertifikasi kepatuhan sosial BSCI yang valid (laporan audit tersedia atas permintaan). Kami juga memiliki ISO 9001:2015 untuk manajemen kualitas, dan 64 model produk kami memiliki sertifikasi CE (TÜV Rheinland). Dokumentasi kepatuhan REACH dan RoHS disediakan dengan setiap pengiriman OEM.
    - q: Berapa waktu tunggu khas untuk pesanan OEM?
      a: Waktu tunggu standar adalah 30–45 hari dari PO yang dikonfirmasi dan deposit. Pengembangan cetakan kustom menambah 15–20 hari untuk pembuatan alat. Kami menawarkan produksi dipercepat untuk pesanan mendesak dan lonjakan musiman selama periode pra-musim panas (Jan–Mar).
    - q: Bisakah Anda mengirim FOB Qingdao atau CIF ke pelabuhan kami?
      a: Ya. Kami mengirim ke FOB Qingdao, CIF pelabuhan global utama, dan DDP untuk mitra yang memenuhi syarat. Tim logistik kami menangani pemesanan kontainer, dokumentasi ekspor, dan bea cukai. Kami mengirim ke 50+ negara di pasar UE, AS, AU, dan Asia.
b2b_moq: 'Standar MOQ: 5–10 unit per model (SUP/kayak/drop-stitch). RIB MOQ: 2–5 unit. Pesanan percobaan diterima untuk kemitraan baru.'
production_flow:
  tagline: Aliran Produksi
  title: Dari Bahan ke Perahu Jadi
  subtitle: Setiap perahu melewati 6 tahap produksi dengan titik pemeriksaan QC di setiap langkah. Tidak ada jalan pintas, tidak ada inspeksi yang dilewatkan.
  stages:
    - stage: '01'
      title: Penerimaan Material & QC Masuk
      description: Semua bahan yang masuk dicatat berdasarkan nomor batch/lot di sistem ERP kami. Gulungan kain PVC, inti drop-stitch, katup, perekat, dan perangkat keras dikarantina sampai persetujuan QC.
      qc_check: Kekuatan tarik (ASTM D751), ketahanan sobek (ISO 4674), pengukur ketebalan, viskositas perekat, pemeriksaan cacat visual
      qc_threshold: 100% dari batch diuji. Tolak jika tarik < 90% dari spesifikasi, sobek < minimum spesifikasi, atau ada cacat visual
      responsibility: Tim QC yang akan datang (3 pemeriksa)
    - stage: '02'
      title: CNC Pemotongan & Persiapan Material
      description: Penyusunan yang dioptimalkan komputer menata panel pada stok PVC untuk meminimalkan limbah. Mesin pemotong CNC otomatis mempertahankan akurasi posisi 0,1 mm.
      qc_check: Pemeriksaan dimensi terhadap file CAD DXF, inspeksi kualitas tepi, verifikasi jumlah panel
      qc_threshold: Setiap panel ke-20 diukur. Toleransi ±0,5 mm. Tolak batch jika >2% di luar toleransi
      responsibility: Pemimpin lokakarya pemotongan
    - stage: '03'
      title: Pengelasan & Drop-Stitch Perekatan
      description: Inti Drop-stitch direkatkan pada laminasi luar PVC menggunakan laminasi panas. Ruang tabung dilas RF atau dilas udara panas. Pita rel direkatkan lapisan tiga dengan fusion bonding.
      qc_check: Uji kelupas setiap 50 unit (ASTM D751), pengukuran lebar las, tinjauan catatan suhu udara panas, inspeksi sambungan secara visual dengan cahaya belakang
      qc_threshold: Kekuatan pelepasan minimal 8 N/cm. Toleransi lebar las ±1 mm. Setiap saluran yang terlihat = tolak
      responsibility: Kontrol Kualitas Pengelasan (2 inspektur per shift)
    - stage: '04'
      title: Perakitan & Pemasangan
      description: 'Perahu dipindahkan ke perakitan akhir di mana semua komponen dipasang: lambung +, tabung, katup dipasang, cincin D, pegangan, kotak sirip, dan pemasangan tas pembawa. Setiap unit mengikuti daftar periksa perakitan 100 poin.'
      qc_check: Tanda tangan daftar periksa 100 poin per unit, uji fungsi katup (10 siklus buka/tutup), verifikasi torsi perangkat keras, inspeksi visual
      qc_threshold: 'Kebijakan nol cacat pada barang kritis keselamatan (katup, cincin D, pegangan). Kosmetik kecil: AQL 2,5 (ISO 2859)'
      responsibility: Pemimpin tim perakitan + QC lini
    - stage: '05'
      title: Pengujian Tekanan & Tahan Kualitas
      description: Setiap ruang dipompa hingga 1,25× tekanan terukur (biasanya 20–25 PSI) dan dipertahankan selama 24–48 jam. Sensor tekanan mencatat secara terus-menerus. Ruang yang mengalami penurunan tekanan lebih dari 5% ditolak dan dikirim untuk pemeriksaan ulang jahitan.
      qc_check: Log tekanan 24 jam, kalibrasi sensor diverifikasi setiap hari, pembacaan tekanan yang dikompensasikan suhu, pengujian ulang sambungan setelah perbaikan
      qc_threshold: Penurunan tekanan maksimal 5% selama 24 jam pada suhu stabil. Setiap ruang yang melebihi ini = 100% pengujian ulang seluruh batch produksi.
      responsibility: Laboratorium kualitas (independen dari produksi, melaporkan ke manajemen)
    - stage: '06'
      title: Inspeksi Akhir & Pengemasan
      description: Inspeksi visual dan fungsional akhir. Cacat permukaan, konsistensi warna, verifikasi label/BIN, integritas kemasan, dan kelengkapan aksesori. Unit dikemas dalam vakum, dikotakkan, dan dipaletrisasi untuk pemuatan kontainer.
      qc_check: Inspeksi visual penuh, daftar aksesori per SKU, uji jatuh kemasan (1 m, sampel acak), verifikasi pemindaian label/barcode
      qc_threshold: AQL 2,5 untuk cacat besar, AQL 4,0 untuk cacat minor. Nol toleransi pada cacat keselamatan. 100% unit diperiksa secara visual
      responsibility: Tim QC akhir (4 inspeksi) + pimpinan tim pengemasan
workforce:
  tagline: Orang-orang kami
  title: Tenaga Kerja & Keahlian
  engineers: 25+
  engineers_detail: Insinyur di seluruh R&D, desain cetakan, laboratorium bahan, dan rekayasa produksi. Rata-rata 7+ tahun dalam produksi barang tiup.
  shift_pattern: 2 shift/hari (07:00–15:30, 15:30–00:00). Shift malam opsional untuk pesanan mendesak.
  training: Pelatihan QC bulanan, latihan keselamatan triwulanan, penilaian keterampilan tahunan. Karyawan baru menyelesaikan induksi 40 jam sebelum bekerja di lini produksi.
  departments:
    - name: Litbang & Rekayasa
      count: 25+
      role: Desain produk, rekayasa cetakan, laboratorium bahan
    - name: Pemotongan & Persiapan Bahan
      count: 15
      role: CNC pemotongan, persiapan panel, penanganan bahan
    - name: Pengelasan & Laminasi
      count: 40
      role: Pengelasan RF, pengelasan udara panas, drop-stitch perekat
    - name: RIB Lambung (FRP)
      count: 30
      role: Lapisan fiberglass, gelcoat, vacuum bagging
    - name: Perakitan & Pemasangan
      count: 35
      role: Perakitan akhir, pemasangan perangkat keras, pemeriksaan sistem
    - name: Kontrol Kualitas
      count: 12
      role: QC masuk, QC dalam proses, inspeksi akhir, pengujian laboratorium
    - name: Logistik & Pengemasan
      count: 20
      role: Pengemasan, pemuatan kontainer, dokumentasi ekspor
    - name: Manajemen & Administrasi
      count: 15
      role: Penjualan, pengadaan, SDM, keuangan, kepatuhan
material_traceability:
  tagline: Penelusuran
  title: Pelacakan Bahan & Kontrol Batch
  description: Setiap batch bahan baku diberi nomor lot unik dalam sistem ERP kami. Dari kedatangan hingga produksi hingga produk jadi, setiap tagihan material kapal terkait kembali ke batch pemasok asli. Ini memungkinkan penelusuran penuh ke hulu untuk setiap pertanyaan kualitas atau kepatuhan.
  system: Sistem ERP khusus (internal) + tag batch fisik pada setiap perintah kerja
  coverage: 100% bahan produksi — PVC, Hypalon, kain drop-stitch, perekat, katup, perangkat keras, kemasan
  records_retained: 10 tahun (sesuai persyaratan CE 2013/53/EU)
  suppliers:
    - material: PVC kelas laut
      source: Pemasok Cina dan Korea
      certified: ISO 9001, REACH, RoHS
    - material: Hypalon (CSM)
      source: Japanese supplier
      certified: ISO 9001, REACH
    - material: Kain Drop-stitch
      source: Tenun internal + mitra eksternal
      certified: QC internal + pemasok ISO 9001
    - material: Katup & Perangkat Keras
      source: Chinese OEM suppliers
      certified: ISO 9001, sertifikat material per batch
qc_dashboard:
  tagline: QC Menurut Angka
  title: Metrik Pengendalian Mutu
  subtitle: Data lolos/gagal nyata dari jalur produksi kami. Laboratorium kualitas kami beroperasi secara independen dari produksi dan melapor langsung ke manajemen.
  stats:
    - value: 100%
      label: Unit diuji tekanan
      detail: Setiap perahu, setiap ruang, setiap batch
    - value: <5%
      label: Penurunan tekanan maksimum yang diizinkan
      detail: Selama 24 jam pada 1,25× tekanan tertera
    - value: AQL 2,5
      label: Ambang cacat utama
      detail: Sesuai standar pengambilan sampel ISO 2859
    - value: 24–48h
      label: Durasi tahan tekanan
      detail: Tergantung pada kategori produk
    - value: 1.25×
      label: Tekanan uji vs tekanan tertera
      detail: Margin keamanan pada setiap ruang
    - value: 0%
      label: Toleransi pada cacat keselamatan
      detail: Katup, cincin D, jahitan, daya apung
