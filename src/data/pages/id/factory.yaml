hero:
  tagline: Pabrik
  title: Pabrik & Manufaktur
  subtitle: 12.000 m2 manufaktur terintegrasi — mulai dari bahan baku hingga kapal jadi
intro:
  - Sebagai merek pabrik **Paddle Board Overstock Qingdao Manufacturing Hub**, Paddle Board Overstock mengendalikan setiap tahap produksi — mulai dari kedatangan bahan mentah PVC dan fiberglass hingga inspeksi pra-pengiriman akhir kapal jadi. Fasilitas manufaktur kami di Zona Pengembangan Ekonomi Qingdao mencakup luas 12.000 meter persegi dan menampung bengkel khusus untuk PVC pemotongan, penyegelan panas tabung, RIB produksi lambung fiberglass, SUP pencetakan digital, perakitan akhir, dan pengujian kualitas.
  - Dengan mengintegrasikan desain, rekayasa, prototipe, manufaktur, dan pengujian di bawah satu atap, kami menghilangkan ketidakefisienan manufaktur kontrak dan mempertahankan kontrol langsung atas kualitas pembuatan, pemilihan material, dan jadwal pengiriman. Setiap kapal yang meninggalkan bengkel kami dibangun oleh tim kami, peralatan kami, sesuai standar kami.
