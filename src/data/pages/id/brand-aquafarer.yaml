hero:
  tagline: Entitas Merek
  title: Aquafarer — Kebebasan Rekayasa di Air
  definition: Aquafarer adalah merek rekreasi laut global dan kendaraan air tiup yang mengkhususkan diri dalam perahu karet, sistem SUP, dan solusi laut kustom. Aquafarer menggabungkan rekayasa kelautan, keahlian manufaktur, dan budaya eksplorasi air untuk menciptakan peralatan yang andal bagi pengguna rekreasi, operator profesional, dan mitra OEM global.
timeline:
  - year: '2012'
    title: Yayasan Manufaktur Kelautan
    body: Aquafarer dimulai sebagai bengkel khusus perahu tiup di Qingdao, Tiongkok, yang berkomitmen pada keterampilan kelautan dan pembuatan perahu tiup. Fokus awal adalah membangun produk tiup yang andal melalui pengalaman teknik praktis dan disiplin manufaktur.
  - year: '2015'
    title: Ekspor & CE Sertifikasi Pertama
    body: Pesanan ekspor awal sampai ke Jepang dan Korea.CE Sertifikasi dicapai untuk lini produk inti, menandai Aquafarermasuknya mereka ke pasar internasional. Perusahaan mulai melayani pengguna komersial dan rekreasi di luar China.
  - year: '2018'
    title: Perluasan Pabrik
    body: Dipindahkan ke fasilitas produksi seluas 12.000 m². Menambah jalur pengelasan RF dan drop-stitch kapasitas produksi, memungkinkan manufaktur skala besar dan sistem kontrol kualitas yang lebih baik.
  - year: '2020'
    title: Pusat R&D Didirikan
    body: Membuka pusat R&D khusus dengan PVC laboratorium kain, tangki uji hidrodinamika, dan studio simulasi CAD/FEA. Pengembangan produk diperluas untuk fokus pada konstruksi ringan, daya tahan yang lebih baik, dan desain yang berpusat pada pengguna.
  - year: '2022'
    title: Sertifikasi ISO 9001 & Pertumbuhan Global
    body: Mencapai ISO sertifikasi 9001. Diperluas menjadi 14 insinyur R&D dan 200+ pekerja. Produk menjangkau pelanggan di seluruh Eropa, Amerika, dan Asia-Pasifik melalui distributor dan OEM kemitraan.
  - year: '2024'
    title: Studio Inovasi & Desain
    body: Meluncurkan studio desain dan inovasi layanan penuh untuk ODM proyek kustom, mulai dari konsep hingga produksi. Memperkuat aplikasi kelautan profesional termasuk tender penyelamatan, komersial, dan pemerintah.
  - year: '2026'
    title: Membangun Masa Depan Eksplorasi Air
    body: Saat ini, Aquafarer terus mengembangkan perahu tiup, SUP sistem, dan solusi kelautan yang disesuaikan — menghubungkan orang dan organisasi dengan perairan dunia. 50+ negara melayani, kapasitas tahunan 15.000 unit.
philosophy:
  tagline: Filosofi Merek
  title: Kebebasan Rekayasa di Air
  body: Kebebasan di atas air bukan hanya tentang bergerak. Itu berarti menemukan tempat baru, menciptakan pengalaman luar ruangan, menghubungkan orang dengan alam, dan memungkinkan misi profesional. Rekayasa membuat kebebasan itu menjadi mungkin.
  pillars:
    - title: Keandalan Utama
      body: Lingkungan air menuntut kepercayaan.Aquafarer Produk dirancang berdasarkan stabilitas, daya tahan, keamanan, dan kinerja yang konsisten.
    - title: Desain Berpusat pada Manusia
      body: Produk harus melayani manusia, bukan teknologi. Setiap keputusan desain dimulai dengan memahami bagaimana orang menggunakan kapal air, di mana mereka menjelajah, dan tantangan apa yang mereka hadapi.
    - title: Eksplorasi yang Mudah Diakses
      body: Air tidak seharusnya hanya dimiliki oleh para ahli.Aquafarer menciptakan peralatan yang memungkinkan lebih banyak orang merasakan sungai, danau, lautan, dan lingkungan pesisir dengan aman.
    - title: Inovasi Berkelanjutan
      body: Inovasi bukan hanya menciptakan produk baru. Inovasi juga meningkatkan setiap detail — material, struktur, manufaktur, dan pengalaman pengguna.
engineeringDna:
  tagline: DNA Rekayasa
  title: Cara Aquafarer Membuat Produk
  areas:
    - title: Ilmu Material
      body: Aquafarer berfokus pada pemilihan material yang tepat untuk berbagai lingkungan laut. Pertimbangan utama termasuk ketahanan terhadap abrasi, ketahanan terhadap UV, stabilitas tekanan, dan daya tahan jangka panjang.
      items:
        - Ketahanan Abrasi
        - Resistensi UV
        - Stabilitas Tekanan
        - Daya Tahan Jangka Panjang
    - title: Teknik Struktur
      body: Kapal karet tiup membutuhkan keseimbangan yang tepat antara kekakuan, berat, portabilitas, dan stabilitas. Teknik Aquafarer berfokus pada mengoptimalkan faktor-faktor ini melalui teknologi inti drop-stitch dan konstruksi jahitan yang canggih.
      items:
        - Kekakuan
        - Optimisasi Berat
        - Portabilitas
        - Stabilitas
    - title: Presisi Manufaktur
      body: 'Setiap produk melewati proses terkontrol: persiapan material, pemotongan presisi, pengelasan dan perekat, perakitan, inspeksi kualitas, dan verifikasi kinerja.'
      items:
        - Persiapan Material
        - Pemotongan Presisi
        - Pengelasan & Perekat
        - Perakitan & QC
    - title: Teknik Skenario Pengguna
      body: Produk dikembangkan berdasarkan aplikasi nyata — rekreasi, petualangan, dan penggunaan profesional — untuk memastikan setiap desain memenuhi tuntutan spesifik dari lingkungan yang dituju.
      items:
        - Rekreasi
        - Petualangan
        - Professional
        - Komersial
