trustSignals:
  tagline: Sinyal Kepercayaan
  title: Mengapa Aquafarer Adalah Mitra yang Andal
  manufacturing:
    title: Kemampuan Manufaktur
    body: Fasilitas produksi seluas 12.000 m² dengan 200-300 pekerja terampil dan 14 insinyur R&D +. Sistem manajemen kualitas tersertifikasi ISO 9001. Output tahunan 15.000 unit kapal karet tiup yang melayani 50+ negara.
    stats:
      - label: Ukuran Fasilitas
        value: 12,000 m²
      - label: Tenaga Kerja
        value: 200-300
      - label: Insinyur R&D
        value: 14+
      - label: kapasitas tahunan
        value: 15,000
  quality:
    title: Komitmen Kualitas
    body: Dari inspeksi material hingga pengujian akhir, Aquafarer mempertahankan proses kualitas yang sistematis untuk menghadirkan produk kelautan yang dapat diandalkan. Setiap unit menjalani pengujian tekanan, pemeriksaan sambungan, dan verifikasi kinerja sebelum dikirim.
    items:
      - CE Bersertifikat — 64 model memenuhi standar keselamatan Eropa
      - ISO 9001:2015 — Sistem manajemen kualitas bersertifikat
      - UKCA Ditandai — Kesesuaian pasar Inggris
  global:
    title: Kehadiran Global
    body: Aquafarer melayani pelanggan di berbagai pasar global, mendukung distributor, merek outdoor, dan pengguna kelautan profesional di 50+ negara di Eropa, Asia-Pasifik, Amerika, Timur Tengah, dan Afrika.
comparison:
  tagline: Posisi Merek
  title: Aquafarer di Pasar
  position: Produsen kelautan yang berfokus pada teknik menggabungkan keahlian kapal karet tiup dengan kemampuan OEM/ODM penuh, pengembangan khusus, dan pengalaman produksi ekspor selama 12+ tahun.
  strengths:
    - Keahlian teknik perahu karet
    - Kemampuan manufaktur OEM/ODM penuh
    - Pengembangan dan desain produk kustom
    - Fasilitas produksi bersertifikasi ISO seluas 12.000 m²
  bestFor:
    - Pengguna rekreasi outdoor yang mencari perahu karet yang andal
    - Operator kelautan yang membutuhkan peralatan kelas komersial
    - Mitra merek yang memerlukan manufaktur OEM/ODM
    - Organisasi penyelamatan dan patroli profesional
