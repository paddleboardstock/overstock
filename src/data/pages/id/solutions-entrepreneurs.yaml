testimonial:
  content: Saya meluncurkan merek SUP saya tanpa pengalaman industri. Tim Aquafarer membimbing saya dari pemilihan produk hingga desain logo dan kemasan kustom. Kontainer pertama saya tiba dalam 11 minggu, dan saya terjual habis dalam 3 bulan di Amazon. Kini saya memesan kontainer ketiga saya.
  name: Michael Park
  title: Pendiri, Shoreline Paddle Co. — California, USA
content_segments:
  tagline: Profil Pengusaha
  title: Peluncuran Merek Olahraga Air<br />Berdasarkan Jenis Pengusaha
  subtitle: Pendiri yang berbeda datang dengan kekuatan yang berbeda — keahlian e-commerce, koneksi industri, jangkauan konten, atau infrastruktur distribusi. Kami menyesuaikan program peluncuran OEM/ODM untuk mencocokkan posisi awal dan ambisi pertumbuhan Anda.
  items:
    - title: Penjual Amazon FBA & E-Commerce
      subtitle: Pembuat merek yang cepat berkembang berbasis data
      description: Penjual online berpengalaman yang meluncurkan produk olahraga air di Amazon, Walmart, atau toko Shopify mereka sendiri. Anda tahu cara mengoptimalkan listing, mengelola PPC, dan membaca data kategori — tetapi Anda membutuhkan mitra manufaktur yang memahami kecepatan e-commerce, tingkat pengembalian, dan fluktuasi permintaan musiman.
      features:
        - Kemasan siap retail yang dioptimalkan untuk batas dimensi FBA
        - Pembuatan kode batang EAN/UPC dan dokumentasi yang sesuai dengan Amazon
        - MOQ rendah (2–5 unit per RIB SKU, 5–10 per SUP) untuk menguji permintaan sebelum memperbesar skala
        - Konsolidasi kontainer campuran untuk mengoptimalkan biaya per unit
    - title: Influencer Kebugaran & Gaya Hidup Outdoor
      subtitle: Pencipta merek yang mengutamakan audiens
      description: Pembuat konten, pelatih kebugaran, dan tokoh outdoor dengan audiens yang terlibat siap membeli merek gaya hidup. Anda membawa komunitas dan cerita merek — kami menangani rekayasa produk, kepatuhan, kemasan, dan logistik sehingga Anda bisa fokus pada konten dan konversi.
      features:
        - 'Branding kustom cepat: siklus sampel 2 minggu dengan + warna logo'
        - Edisi terbatas co-branded dan peluncuran warna musiman
        - Dukungan produksi konten fotografi gaya hidup dan video
        - 'Pemenuhan langsung ke konsumen: → pengiriman langsung ke pelanggan pabrik'
    - title: Distributor Regional Beralih Langsung ke Konsumen
      subtitle: B2B Operator meluncurkan merek mereka sendiri
      description: Distributor peralatan kelautan atau luar ruangan yang sudah mapan yang ingin meluncurkan merek mereka sendiri bersamaan atau sebagai pengganti menjual kembali produk pihak ketiga. Anda sudah memiliki infrastruktur gudang, hubungan logistik, dan basis pelanggan — Anda membutuhkan mitra pabrik yang dapat menghadirkan kualitas private-label dalam skala besar.
      features:
        - Desain produk eksklusif untuk wilayah pasar Anda
        - OEM Pengembangan cetakan penuh untuk bentuk dan spesifikasi khusus
        - Dokumentasi kepatuhan lokal (CE, UKCA, USCG) untuk wilayah Anda
        - 'Kemasan co-branded: + Aquafarer merek distributor merek kualitas'
    - title: Pendiri Merek Pertama Kali
      subtitle: Pembuatan merek terpandu dari ujung ke ujung
      description: Pengusaha yang penuh semangat tanpa pengalaman di industri olahraga air yang ingin membangun merek dari nol. Anda membutuhkan mitra yang membimbing Anda di setiap tahap — mulai dari pemilihan dan penamaan produk hingga desain kemasan dan logistik kontainer pertama — dengan jadwal yang jelas dan harga yang transparan.
      features:
        - Pilihan produk konsultatif dari 50+ desain dasar yang telah terbukti
        - 'Paket identitas merek: penamaan, logo, palet warna, desain kemasan'
        - Garis waktu 60–90 hari dari konsep hingga pengiriman pertama
        - Manajer proyek khusus untuk pemilik merek pertama kali
