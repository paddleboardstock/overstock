hero:
  tagline: Gambar Teknis & CAD
  title: RIB & Perahu Karet<br />Unduhan Gambar Teknis & CAD
  subtitle: Gambar GA tingkat perencanaan, lembar dimensi, dan tata letak dek untuk evaluasi proyek dan spesifikasi. Akses gambar teknis pada tingkat yang sesuai — dari PDF publik hingga file STEP tingkat proyek.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/production-dept.webp
    alt: RIB unduhan gambar teknis perahu dan CAD
direct_answer: Paddle Board Overstock menyediakan gambar teknis tingkat pengadaan untuk perahu RIB dan kendaraan air tiup — termasuk PDF penataan umum (GA), lembar dimensi, dan gambar tata letak dek. Format dengan detail lebih tinggi (DXF/DWG, STEP/IGES) tersedia atas permintaan yang memenuhi syarat atau aplikasi proyek.
stats:
  - value: PDF GA
    label: Unduh Gratis
    detail: Penataan umum per model
  - value: DXF/DWG
    label: Akses Bentuk Ringan
    detail: CAD 2D tingkat perencanaan
  - value: STEP/IGES
    label: Aplikasi Proyek
    detail: Model 3D untuk integrasi
  - value: NDA Saja
