    detail: Laminasi lambung, data cetakan
content_tiers:
  tagline: Tingkat Unduhan
  title: Empat Tingkat Akses<br />— Detail yang Tepat untuk Tahap yang Tepat
  subtitle: Kami menyediakan gambar tingkat pengadaan, bukan file tingkat manufaktur. Setiap tingkat sesuai dengan tahap proyek yang berbeda.
  items:
    - title: Tingkat 1 — PDF Publik
      description: Penataan umum (GA), gambar dimensi 4 pandangan, dan tata letak dek dalam format PDF. Tersedia untuk diunduh gratis. Cukup untuk perencanaan proyek, alokasi ruang, dan tinjauan spesifikasi awal.
      icon: tabler:file-type-pdf
    - title: Tingkat 2 — DXF/DWG Bentuk Ringan
      description: File CAD 2D (DXF atau DWG) untuk integrasi tata letak tingkat perencanaan. Memerlukan formulir kualifikasi singkat (nama perusahaan, jenis proyek, tujuan penggunaan). Tidak termasuk data struktural atau manufaktur.
      icon: tabler:file-code
    - title: Tingkat 3 — STEP/IGES Aplikasi Proyek
      description: File model 3D (STEP atau IGES) untuk integrasi sistem, desain perlengkapan, atau koordinasi arsitektur kapal. Memerlukan aplikasi proyek dengan ruang lingkup, jadwal, dan niat pembelian. Tunduk pada persetujuan.
      icon: tabler:cube
    - title: Tingkat 4 — NDA Teknik
      description: Gambar struktural lambung, jadwal laminasi, perluasan potongan tabung, dan data cetakan. Tersedia hanya di bawah NDA dengan pesanan yang dikonfirmasi. Ini adalah file tingkat manufaktur — tidak untuk distribusi publik.
      icon: tabler:lock
content_included:
  tagline: Apa yang Termasuk
  title: Isi Gambar<br />Per Model
  subtitle: Setiap model memiliki paket gambar standar yang mencakup informasi perencanaan penting untuk pembeli B2B dan insinyur proyek.
  items:
    - title: Pengaturan Umum (GA)
      description: Profil samping, tampak atas, dan penampang menunjukkan bentuk lambung, posisi tabung, lokasi konsol, tempat duduk, sistem bahan bakar, dan dimensi kunci (LOA, lebar, diameter tabung, sudut deadrise). Status revisi dan hak cipta dicatat pada blok judul.
      icon: tabler:layout
    - title: Gambar Dimensi 4-Pandangan
      description: Tampilan samping, depan, belakang, dan atas dengan dimensi keseluruhan untuk perencanaan transportasi (tinggi di trailer, lebar untuk kontainer, berat untuk pengangkatan). Termasuk konfigurasi operasional dan transportasi.
      icon: tabler:ruler-2
    - title: Tata Letak Dek & Rencana Peralatan
      description: Tampilan dek dari atas menunjukkan dasar konsol, posisi kursi, lokasi D-ring, posisi lampu navigasi, akses pompa air bilge, kompartemen baterai/bahan bakar, dan titik pemasangan peralatan. Presisi terbatas pada antarmuka proprietary.
      icon: tabler:map
    - title: Gambar Transportasi & Kemasan
      description: Rencana pemuatan kontainer, dimensi sangkar, distribusi berat, dan posisi titik angkat untuk perencanaan logistik. Termasuk opsi kemasan standar dan kustom.
      icon: tabler:truck
content_protection:
  tagline: Perlindungan IP
  title: Apa yang Tidak Kita Bagikan<br />& Mengapa
  subtitle: Melindungi kekayaan intelektual rekayasa kami memastikan kami dapat terus berinvestasi dalam R&D sambil tetap menyediakan semua yang dibutuhkan pembeli untuk perencanaan proyek.
  items:
    - title: Data Inti Cetakan Lambung
      description: Geometri cetakan dan pasang, CNC jalur alat, dan template laminasi adalah aset manufaktur milik perusahaan. Mereka tidak dibagikan pada tingkat akses mana pun di luar kontrak NDA yang telah dikonfirmasi.
      icon: tabler:ban
    - title: Perluasan Pemotongan Tabung
      description: File pemotongan pola datar untuk kain tabung adalah data tingkat manufaktur. Tersedia hanya di bawah NDA dengan pesanan produksi yang dikonfirmasi dan hanya dibagikan dengan pihak yang mengontrak.
      icon: tabler:ban
    - title: Perhitungan Struktur
      description: Analisis tegangan yang rinci, hasil FEA, dan jadwal laminasi adalah dokumen yang sensitif terhadap kepatuhan yang hanya dibagikan kepada Badan Notifikasi dan klien yang terikat NDA selama proses penilaian kesesuaian.
      icon: tabler:ban
    - title: Penyaringan Pesaing
      description: Kami berhak menolak permintaan akses CAD yang tampaknya berasal dari pesaing, mahasiswa tanpa konteks proyek, atau pihak tanpa niat pengadaan yang sah.
      icon: tabler:shield
content_models:
  tagline: Model Tersedia
  title: Gambar Teknik<br />Ketersediaan menurut Model
  subtitle: Unduhan PDF GA tersedia untuk model RIB utama dan perahu karet kami. Hubungi kami untuk gambar model spesifik yang tidak tercantum.
  items:
    - title: AF580 RIB
      description: 5,8 m RIB, lambung V dalam GRP, Hypalon atau PVC tabung, konsol tengah. GA, dimensi, tata letak dek, dan rencana transportasi tersedia. Kategori Desain C.
      icon: tabler:sailboat
    - title: AF520 RIB
      description: 5,2 m RIB, lambung GRP kecepatan sedang-V, tabung Hypalon atau PVC, konsol samping atau tengah. GA dan dimensi tersedia. Kategori Desain C.
      icon: tabler:sailboat
    - title: AF430 RIB
      description: 4,3 m RIB, lambung GRP, tabung PVC, kemudi tiller atau konsol. GA dan dimensi tersedia. Kategori Desain C/D.
      icon: tabler:sailboat
    - title: Perahu Karet AF380
      description: Perahu karet tiup 3,8 m, lantai aluminium, tabung PVC. Dimensi keseluruhan dan kemasan tersedia. Sesuai EN ISO 6185.
      icon: tabler:sailboat
    - title: Perahu Tiup AF320
      description: Perahu karet 3,2 m, lantai dek udara, tabung PVC. Dimensi GA dan kemasan tersedia. Mematuhi EN ISO 6185.
      icon: tabler:sailboat
