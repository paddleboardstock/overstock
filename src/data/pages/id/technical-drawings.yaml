content_version_control:
  tagline: kontrol versi
  title: Versi Gambar<br />Manajemen
  subtitle: Setiap gambar mengikuti sistem revisi yang terkontrol. Selalu pastikan Anda memiliki revisi terkini sebelum menggunakan gambar untuk perencanaan proyek.
  items:
    - title: Pelacakan Revisi
      description: Setiap gambar membawa kode revisi (Rev-A, Rev-B, Rev-C), tanggal terbitan, tanggal terakhir ditinjau, model/konfigurasi yang berlaku, unit, ukuran file, dan format. Hanya revisi "Saat Ini" yang tersedia untuk diunduh.
      icon: tabler:git-branch
    - title: Pemberitahuan Status Gambar
      description: Semua gambar publik diberi tanda "Hanya tata letak awal — bukan untuk penggunaan konstruksi, sertifikasi, atau produksi. Dimensi tergantung pada spesifikasi akhir dan konfirmasi pesanan." Ini melindungi kedua pihak dari kesalahan aplikasi.
      icon: tabler:alert-circle
    - title: Pembaruan Notifikasi
      description: Ketika spesifikasi model berubah, revisi gambar diperbarui dan versi sebelumnya diberi tanda "Superseded." Pengguna terdaftar yang mengunduh paket DXF/DWG akan diberitahu tentang pembaruan signifikan melalui email.
      icon: tabler:bell
faq:
  title: Gambar Teknis — Pertanyaan yang Sering Diajukan
  questions:
    - q: Apakah PDF GA benar-benar gratis?
      a: Ya. PDF pengaturan umum untuk model utama kami tersedia tanpa biaya — lengkapi formulir kualifikasi singkat di bawah ini dan tautan unduhan akan dikirim melalui email dalam waktu 1 hari kerja. Formulir tersebut berisi informasi tingkat perencanaan yang cukup untuk evaluasi proyek, alokasi ruang, dan tinjauan spesifikasi awal.
    - q: Bagaimana cara mengakses file DXF/DWG?
      a: Lengkapi formulir kualifikasi singkat di halaman unduhan dengan nama perusahaan Anda, jenis proyek, dan tujuan penggunaan. Permintaan yang disetujui akan menerima tautan unduhan melalui email dalam waktu 1 hari kerja.
    - q: Bisakah saya mendapatkan model 3D STEP/IGES?
      a: File model STEP atau IGES 3D tersedia melalui proses aplikasi proyek kami. Berikan ruang lingkup proyek, persyaratan integrasi, jadwal, dan niat pembelian. Dapat disetujui — biasanya dalam waktu 3-5 hari kerja.
    - q: Mengapa Anda membatasi akses ke file dengan detail lebih tinggi?
      a: Geometri lambung, data cetakan, dan perhitungan struktural mewakili investasi R&D bertahun-tahun dan merupakan IP inti manufaktur. Kami menyediakan segala yang dibutuhkan untuk perencanaan pengadaan dan integrasi proyek sambil melindungi kemampuan kami untuk terus berinvestasi dalam pengembangan produk baru.
    - q: Apakah gambar-gambar tersebut mencantumkan detail manufaktur?
      a: Tidak. Gambar publik dan ringan berisi informasi tingkat pengadaan untuk perencanaan dan spesifikasi. Detail tingkat manufaktur (jadwal laminasi, jalur alat, perluasan pemotongan) hanya dibagikan NDA di bawah pesanan yang telah dikonfirmasi.
    - q: Apakah gambar tersedia untuk konfigurasi kustom atau semi-kustom RIB ?
      a: Gambar proyek khusus disiapkan sebagai bagian dari OEMODM proses pengembangan. Jika Anda mengevaluasi RIB proyek kustom, hubungi kami dengan kebutuhan Anda dan kami akan menyediakan gambar GA spesifik proyek sebagai bagian dari proposal.
