hero:
  tagline: Keahlian Kelautan
  title: Puluhan Tahun Rekayasa Kelautan<br />di Setiap Lambung
  subtitle: Aquafarer menggabungkan ilmu material yang mendalam, manufaktur presisi, dan pengujian nyata untuk menghasilkan kendaraan air yang berkinerja saat dibutuhkan.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/factory/aquafarer-production-department.webp
    alt: Aquafarer tim rekayasa kelautan dan R&D sedang bekerja
expertise_materials:
  tagline: Ilmu Material
  title: Memilih Material yang Tepat<br />untuk Setiap Aplikasi
  subtitle: Kami bekerja dengan tiga material inti — masing-masing dipilih untuk kasus penggunaan dan kebutuhan kinerja tertentu.
  columns: 3
  items:
    - title: Bahan Kelas Laut PVC
      description: Kain 1100 denier PVC — material kami yang paling serbaguna. UV-stabil, tahan abrasi, dan sesuai REACH. Ideal untuk perahu rekreasi, papan SUP, dan kayak di mana efisiensi berat dan biaya penting.
      icon: tabler:droplet
    - title: Premium Hypalon/CSM
      description: Ketahanan kimia superior dan stabilitas UV. Perahu Hypalon bisa bertahan 15-20 tahun dengan perawatan yang tepat. Direkomendasikan untuk aplikasi komersial, penyelamatan, dan militer di mana daya tahan jangka panjang sangat penting.
      icon: tabler:shield
    - title: Fiberglass & Aluminium
      description: Lambung fiberglass Deep-V untuk RIBs dan perahu patroli — kinerja memotong gelombang di kondisi kasar. Lambung aluminium untuk perahu kerja komersial berat yang membutuhkan kekuatan maksimum dan kapasitas muatan tinggi.
      icon: tabler:building-arch
expertise_manufacturing:
  tagline: Kemampuan Manufaktur
  title: Manufaktur Presisi<br />di Setiap Tahap
  subtitle: Fasilitas kami seluas 12.000 m² dilengkapi dengan mesin khusus untuk setiap tahap produksi.
  columns: 2
  items:
    - title: Pemotongan CNC
      description: Pemotongan yang dikendalikan komputer memastikan panel kain presisi dan dapat diulang dengan limbah minimal. Setiap potongan pas persis seperti yang dirancang.
      icon: tabler:cpu
    - title: Pengelasan Frekuensi Tinggi
      description: Pengelasan HF industri menciptakan jahitan yang lebih kuat dari bahan dasar. Kontrol suhu dan tekanan yang konsisten memastikan segel kedap udara di setiap produksi.
      icon: tabler:bolt
    - title: Perakitan Inti Drop Stitch
      description: Ribuan benang poliester menghubungkan lapisan kain atas dan bawah, memungkinkan inflasi bertekanan tinggi (15-20 PSI) untuk papan dan lantai SUP yang kaku dan stabil.
      icon: tabler:building-arch
    - title: Pengujian Tekanan
      description: Setiap produk inflasi diuji tekanannya sebelum pengiriman. Tabung RIB diuji pada tekanan 1,25x dari tekanan yang tertera — jika tahan di sana, akan berkinerja di air.
      icon: tabler:wind
    - title: Pengujian Kekuatan Jahitan
      description: Sampel acak dari setiap batch produksi menjalani pengujian kekuatan jahitan secara destruktif. Hasil dicatat dan dapat dilacak ke jalur produksi tertentu.
      icon: tabler:files
    - title: Pengujian di Air
      description: Setiap model RIB menjalani uji coba di laut sebelum disertifikasi. Pengujian di dunia nyata dalam kondisi pesisir memvalidasi kinerja, penanganan, dan stabilitas.
      icon: tabler:ripple
expertise_design:
  tagline: Desain & Rekayasa
  title: Dirancang untuk Kondisi Nyata
  subtitle: Filosofi desain kami dimulai dengan bagaimana perahu akan digunakan — kemudian membangun rekayasa di sekitar kasus penggunaan tersebut.
  items:
    - title: Desain Lambung Deep-V
      description: Lambung fiberglass kami memiliki sudut deadrise yang dihitung dan dioptimalkan untuk panjang dan penggunaan yang dimaksudkan pada setiap model. V lebih curam untuk performa di air kasar, lebih dangkal untuk stabilitas.
    - title: Keselamatan Multi-Kompartemen
      description: Setiap perahu memiliki 3-7 ruang udara independen. Jika satu kompartemen terganggu, ruang yang tersisa menjaga perahu tetap mengapung dan berfungsi.
    - title: Tata Letak Ergonomis
      description: Posisi konsol, tinggi tabung, dan penempatan tempat duduk dirancang untuk kenyamanan operator selama penggunaan jangka panjang — baik saat patroli, memancing, maupun transportasi.
    - title: Konfigurasi Khusus
      description: Warna tabung, konfigurasi konsol, kapasitas bahan bakar, pemasangan aksesori — setiap model dapat disesuaikan untuk memenuhi persyaratan operasional tertentu.
cta:
  title: Memiliki aplikasi khusus dalam pikiran?
  subtitle: Tim rekayasa kami dapat memberikan saran tentang pemilihan bahan, desain, dan manufaktur untuk proyek Anda.
  actions:
