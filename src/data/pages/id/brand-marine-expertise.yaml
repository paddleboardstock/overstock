hero:
  tagline: Keahlian Kelautan
  title: Puluhan Tahun Rekayasa Kelautan<br />di Setiap Papan
  subtitle: Paddle Board Overstock menggabungkan ilmu material yang mendalam, pembuatan presisi, dan pengujian dunia nyata untuk menghasilkan papan yang berkinerja ketika itu penting.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock tim teknik dan R&D kelautan sedang bekerja
expertise_materials:
  tagline: Ilmu Material
  title: Memilih Material yang Tepat<br />untuk Setiap Aplikasi
  subtitle: Kami bekerja dengan tiga material inti — masing-masing dipilih untuk kasus penggunaan dan kebutuhan kinerja tertentu.
  columns: 3
  items:
    - title: Bahan Kelas Laut PVC
      description: Kain PVC 1100 denier — material kami yang paling serbaguna. UV-stabil, tahan abrasi, dan telah teruji waktu. Ideal untuk papan SUP di mana berat, kekakuan, dan efisiensi biaya penting.
      icon: tabler:droplet
    - title: Drop-Stitch Inti
      description: Ribuan benang poliester menghubungkan lapisan kain atas dan bawah, memungkinkan inflasi bertekanan tinggi (15 PSI) untuk pengalaman berkendara yang kaku dan stabil namun tetap dapat digulung menjadi ransel.
      icon: tabler:building-arch
    - title: EVA Busa Deck
      description: Busa EVA beralur dan berdensitas tinggi menyediakan pegangan sepanjang deck, bantalan untuk jatuh, dan kanvas untuk papan art-series khas kami.
      icon: tabler:hexagons
expertise_manufacturing:
  tagline: Kemampuan Manufaktur
  title: Manufaktur Presisi<br />di Setiap Tahap
  subtitle: Fasilitas kami seluas 12.000 m² dilengkapi dengan mesin khusus untuk setiap tahap produksi.
  columns: 2
  items:
    - title: Pemotongan CNC
      description: Pemotongan yang dikendalikan komputer memastikan panel kain presisi dan dapat diulang dengan limbah minimal. Setiap potongan pas persis seperti yang dirancang.
      icon: tabler:cpu
    - title: Pengelasan Frekuensi Tinggi
      description: Pengelasan HF industri menciptakan jahitan yang lebih kuat dari bahan dasar. Kontrol suhu dan tekanan yang konsisten memastikan segel kedap udara di setiap produksi.
      icon: tabler:bolt
    - title: Perakitan Inti Drop Stitch
      description: Ribuan benang poliester menghubungkan lapisan kain atas dan bawah, memungkinkan inflasi bertekanan tinggi (15-20 PSI) untuk papan dan lantai SUP yang kaku dan stabil.
      icon: tabler:building-arch
    - title: Pengujian Tekanan
      description: Setiap papan diuji tekan sebelum pengiriman, ditahan pada tekanan 1,25x dari tekanan yang ditentukan — jika tahan di sana, papan akan berkinerja di atas air.
      icon: tabler:wind
    - title: Pengujian Kekuatan Jahitan
      description: Sampel acak dari setiap batch produksi menjalani pengujian kekuatan jahitan secara destruktif. Hasil dicatat dan dapat dilacak ke jalur produksi tertentu.
      icon: tabler:files
    - title: Pengujian di Air
      description: Setiap desain papan menjalani uji coba dengan air sungguhan. Dayung di kondisi pantai yang nyata memvalidasi kinerja, pengendalian, dan stabilitas.
      icon: tabler:ripple
expertise_design:
  tagline: Desain & Rekayasa
  title: Dirancang untuk Kondisi Nyata
  subtitle: Filosofi desain kami dimulai dengan bagaimana papan akan digunakan — kemudian membangun rekayasa di sekitar kasus penggunaan tersebut.
  items:
    - title: Bentuk & Garis Besar Papan
      description: Panjang, lebar, dan rocker disesuaikan untuk penggunaan masing-masing model — garis besar tur yang lebih panjang untuk meluncur, bentuk papan yang lebih lebar untuk stabilitas dan yoga.
    - title: Penguatan Rel & Balok
      description: Rel kerangka dan batangan tengah yang diperkuat menambah kekakuan dan menyerap benturan — tempat-tempat di mana papan paling banyak mengalami keausan musim demi musim.
    - title: Tata Letak Dek & Traksi
      description: Area posisi berdiri, penempatan pegangan, pemasangan D-ring, dan zona traksi dirancang berdasarkan postur mendayung yang sebenarnya — baik saat bersantai, memancing, atau berlatih yoga.
    - title: Seri Seni & Warna
      description: Ilustrasi dek, skema warna, dan tempat pemasangan aksesori — setiap seri dirancang untuk menyesuaikan dengan kepribadian mendayung yang berbeda.
cta:
  title: Memiliki aplikasi khusus dalam pikiran?
  subtitle: Tim kami dapat membantu Anda memilih papan, ukuran, dan perlengkapan yang tepat sesuai gaya mendayung Anda.
  actions:
    - variant: primary
      text: Tanya insinyur kami
      href: /contact
    - text: Lihat rangkaian produk
      href: /products
