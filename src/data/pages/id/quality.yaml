tests:
  - title: Pengujian Tekanan
    standard: Spesifikasi Internal AF-PT-001
    description: Kamar tiup diberi tekanan hingga 1,25x batas operasional yang direkomendasikan dan ditahan selama 30 menit. Penurunan tekanan diukur untuk memvalidasi kedap udara dan integritas struktural material serta jahitan.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pressure-testing.webp
  - title: Pengujian Benturan
    standard: Spesifikasi Internal AF-IT-002
    description: Produk dikenai benturan terkontrol dari bobot jatuh standar dan alat pendulum. Ini menilai ketahanan tusukan, penyebaran robekan, dan ketahanan struktural terhadap tabrakan dengan rintangan, dermaga, dan puing.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
  - title: UV Pengujian Ketahanan
    standard: Protokol Uji Internal
    description: Sampel material diekspos pada lampu UVA-340 di ruang percepatan pengujian cuaca selama 1.000+ jam. Kami mengukur perubahan warna (Delta E), retensi kilap, dan kehilangan kekuatan tarik untuk memvalidasi paket UV stabilizer.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-uv-resistance-testing.webp
  - title: Pengujian Ketahanan Abrasi
    standard: Protokol Uji Internal
    description: Sampel material dikenai roda abrasif CS-10 dengan beban 500g/1.000g selama 1.000 siklus. Kehilangan massa dan penilaian visual keausan menentukan daya tahan lapisan terhadap pasir, kerikil, dan peluncuran berulang.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-pvc-material-testing.webp
  - title: Pengujian Kinerja Suhu Rendah
    standard: Spesifikasi Internal AF-LT-003
    description: Produk yang dirakit dan kupon material dikondisikan pada -20°C, -10°C, dan 0°C selama 24 jam lalu diuji lentur. Kami memverifikasi bahwa PVC tetap fleksibel tanpa retak atau delaminasi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-exterior.webp
  - title: Pengujian Ketahanan Apung & Kapasitas Beban
    standard: Protokol Uji Internal
    description: Produk diberi beban secara bertahap hingga 1,25x kapasitas tertera di kolam terkontrol. Tinggi bebas air, stabilitas, dan kinerja pengeringan sendiri dicatat. Kapasitas tertera setiap model diverifikasi secara matematis dan empiris.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-2.webp
  - title: Pengujian Manuverabilitas
    standard: Spesifikasi Internal AF-MT-004
    description: Uji di air mengukur jari-jari putar, percepatan, waktu meluncur, dan respons dayung/motor dalam berbagai kondisi beban. Karakteristik pengendalian dunia nyata divalidasi terhadap target desain.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
  - title: Pengujian Kedap Air
    standard: Spesifikasi Internal AF-WT-005
    description: Setiap produk rakitan diuji semprot pada 0,5 bar di semua jahitan, katup, dan fitting. Pengujian perendaman bertekanan selama 5 menit memvalidasi kedap air kamar dan katup. Standar tanpa kebocoran sebelum pengiriman.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department-2.webp
testing_section:
  tagline: Prosedur Pengujian
