content_founding:
  tagline: Awal Mula
  title: Lahir di Tepi Laut
  subtitle: 'Paddle Board Overstock dimulai di bengkel pesisir di Qingdao dengan satu perahu dan visi: membangun kapal tiup yang mampu menangani kondisi laut nyata.'
  paragraphs:
    - Pada tahun 2012, para pendiri kami melihat adanya celah di pasar — sebagian besar perahu tiup terjangkau namun tidak dapat diandalkan, atau berkualitas tinggi namun sangat mahal. Mereka percaya ada ruang bagi produsen yang mampu memberikan kualitas dan nilai sekaligus.
    - Lambung pertama dibangun secara manual, diuji di perairan lokal, dan disempurnakan berdasarkan umpan balik nyata dari para nelayan dan operator komersial kecil. Umpan balik itu — bangun, uji, dengarkan, tingkatkan — tetap menjadi inti filosofi rekayasa kami hingga hari ini.
    - Pada tahun 2015, kabar telah menyebar melampaui Qingdao. Distributor internasional mulai meminta sampel. Apa yang awalnya hanya bengkel lokal kini menjadi pemasok global.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Bengkel produksi awal dan manufaktur
content_growth:
  tagline: Pertumbuhan & Inovasi
  title: Dari Bengkel ke Fasilitas seluas 12.000 m²
  subtitle: Investasi berkelanjutan pada manusia, peralatan, dan proses telah berubah Paddle Board Overstock menjadi fasilitas manufaktur kelautan modern.
  paragraphs:
    - Seiring meningkatnya permintaan, fasilitas kami juga meningkat. Kami berkembang dari bengkel kecil menjadi pabrik seluas 12.000 m² dengan lini produksi khusus untuk RIB kapal, perahu tiup, SUP papan, dan aksesori.
    - Kami berinvestasi pada CNC mesin pemotong, peralatan las frekuensi tinggi, lini produksi drop stitch, dan rig pengujian komprehensif — memungkinkan kami mengendalikan setiap aspek kualitas produksi.
    - Saat ini, tim kami yang terdiri dari 200-300 orang terdiri dari insinyur kelautan, ilmuwan material, spesialis kontrol kualitas, dan pengrajin terampil — banyak di antaranya telah bergabung Paddle Board Overstock sejak masa awal.
content_mission:
  tagline: Misi Kami
  title: Kebebasan Rekayasa di Air
  subtitle: Setiap produk Paddle Board Overstock dirancang untuk membantu orang menjelajahi, bekerja, dan berkembang di air — dengan andal, aman, dan terjangkau.
  list:
    - Mendesain kendaraan air yang berfungsi di kondisi laut yang sebenarnya — bukan hanya di atas kertas
    - Membangun kemitraan yang langgeng dengan distributor dan merek melalui layanan OEM/ODM yang andal
    - Terus meningkatkan proses manufaktur kami untuk memberikan nilai yang lebih baik
    - Mendukung setiap produk dengan suku cadang asli dan keahlian teknis
