hero:
  tagline: Sertifikasi & Standar
  title: Sertifikasi Kualitas<br />& Standar Kepatuhan
  subtitle: Aquafarer produk diproduksi sesuai dengan standar keselamatan laut internasional, sistem manajemen kualitas, dan peraturan lingkungan.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-quality-testing.webp
    alt: Aquafarer sertifikasi kualitas dan dokumentasi kepatuhan
content_certifications:
  tagline: Sertifikasi Kami
  title: Kualitas Bersertifikat,<br />Diakui Secara Global
  subtitle: 64 model CE-bersertifikat dan sertifikasi pabrik secara keseluruhan menunjukkan komitmen kami terhadap kualitas, keselamatan, dan tanggung jawab lingkungan.
  items:
    - title: CE Bersertifikat
      description: 64 model CE-bersertifikat mematuhi persyaratan penandaan CE Eropa untuk kapal rekreasi air, memastikan standar keselamatan, kesehatan, dan perlindungan lingkungan terpenuhi.
      icon: tabler:certificate
    - title: ISO 9001:2015
      description: Sistem manajemen kualitas kami bersertifikat ISO 9001:2015, mencakup desain, pembuatan, dan distribusi perahu karet dan peralatan laut.
      icon: tabler:clipboard-check
    - title: UKCA Ditandai
      description: Produk yang dijual di pasar Inggris membawa penandaan UKCA, yang menegaskan kepatuhan terhadap regulasi Inggris untuk peralatan laut dan perahu pribadi.
      icon: tabler:shield
    - title: BSCI Mematuhi
      description: Aquafarer diaudit oleh BSCI (Business Social Compliance Initiative), menunjukkan praktik manufaktur yang etis, kondisi kerja yang adil, dan tanggung jawab rantai pasokan.
      icon: tabler:heart-handshake
    - title: REACH Sesuai
      description: Semua bahan yang digunakan dalam produk Aquafarer mematuhi peraturan REACH UE untuk keselamatan kimia, memastikan tidak ada zat terbatas dalam PVC, Hypalon, atau komponen kami.
      icon: tabler:flask
    - title: Pengujian Material
      description: Kain diuji untuk kekuatan tarik, ketahanan sobek, degradasi UV, dan kinerja retak dingin. Setiap batch produksi diambil sampelnya dan diverifikasi.
      icon: tabler:test-pipe
content_factory:
  tagline: Standar Pabrik
  title: Keunggulan Manufaktur<br />— Dibangun Sesuai Spesifikasi
  subtitle: Fasilitas kami seluas 12.000 m² beroperasi di bawah protokol pengendalian kualitas yang ketat di setiap tahap produksi.
  list:
    - 'Inspeksi Material Masuk: Semua bahan baku — kain PVC, Hypalon, aluminium, tripleks, perekat — diuji sesuai spesifikasi sebelum masuk proses produksi.'
    - 'Pengendalian Kualitas Dalam Proses: Setiap tahap produksi memiliki titik pemeriksaan QC yang terdokumentasi. Kekuatan las, keselarasan jahitan, pemasangan katup, dan torsi fitting diverifikasi secara langsung.'
    - 'Pengujian Tekanan: Setiap ruang kembung diuji tekan pada 1,25× tekanan nominal selama 24–48 jam. Laju kebocoran harus dalam batas yang dapat diterima sesuai ISO 6185.'
    - 'Inspeksi Akhir: Produk yang selesai diperiksa untuk akurasi dimensi, penyelesaian kosmetik, kelengkapan aksesoris, dan integritas kemasan sebelum dikirim.'
    - 'Pelacakan Batch: Setiap produk memiliki nomor seri yang terkait dengan catatan batch produksi, memungkinkan pelacakan penuh dari bahan baku hingga barang jadi.'
content_safety:
  tagline: Standar Keselamatan Laut
  title: Keselamatan Pertama<br />— Dirancang untuk Operasi yang Andal
  subtitle: Produk Aquafarer dirancang dan diuji untuk memenuhi standar keselamatan laut internasional untuk penggunaan komersial dan rekreasi.
  items:
    - title: ISO 6185
      description: Perahu karet mematuhi standar ISO 6185 untuk konstruksi, stabilitas, daya apung, dan kapasitas muatan.
      icon: tabler:sailboat
    - title: Standar ABYC
      description: Sistem listrik dan sistem bahan bakar mengikuti standar ABYC (American Boat & Yacht Council) untuk instalasi dan operasi yang aman.
      icon: tabler:bolt
    - title: SOLAS Kepatuhan
      description: Peralatan keselamatan dan alat penyelamat memenuhi persyaratan SOLAS (Keselamatan Jiwa di Laut) bila berlaku.
      icon: tabler:lifebuoy
cta:
  title: Perlu produk bersertifikat untuk proyek Anda?
  subtitle: Hubungi tim kami untuk membahas persyaratan sertifikasi, dokumentasi, dan kepatuhan untuk pasar Anda.
  actions:
    - variant: primary
      text: Minta dokumen sertifikasi
      href: /contact
    - text: Lihat halaman kualitas kami
      href: /quality
