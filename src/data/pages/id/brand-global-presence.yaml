hero:
  tagline: Kehadiran Global
  title: Melayani 50+ Negara<br />Di Setiap Benua
  subtitle: Dari operator patroli pesisir Eropa hingga distributor olahraga air Australia hingga tim penyelamat di Timur Tengah — Paddle Board Overstock perahu ada di air di seluruh dunia.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
    alt: Paddle Board Overstock manufaktur dan distribusi kelautan global
stats:
  title: Jangkauan Global
  stats:
    - title: Negara
      amount: 50+
    - title: Pasar Ekspor
      amount: Eropa, Amerika, Asia, Timur Tengah, Oseania
    - title: Produksi
      amount: Qingdao, Tiongkok
    - title: Gudang AS
      amount: Montclair, CA
features3_markets:
  tagline: Pasar Utama
  title: Keahlian Regional<br />untuk Kebutuhan Lokal
  subtitle: Kami memahami bahwa pasar yang berbeda memiliki persyaratan peraturan, preferensi, dan penggunaan yang berbeda.
  isBeforeContent: false
  columns: 4
  items:
    - title: Eropa & Inggris
      description: Produk bersertifikat CE yang memenuhi standar EN ISO 6185. Permintaan kuat untuk RIBs, perahu karet, dan papan SUP di pasar UE. Distributor Inggris menghargai waktu penyelesaian cepat kami.
      icon: tabler:map-pin
    - title: Amerika Utara
      description: Manufaktur disetujui US Coast Guard. Gudang AS di Montclair, CA untuk pengiriman cepat ke Pantai Barat. Permintaan meningkat untuk perahu ikan, kapal penyelamat, dan SUPs rekreasi.
      icon: tabler:map-pin
    - title: Australia & Oseania
      description: Pasar kuat untuk perahu RIB dan tender karet. Distributor Australia menghargai perahu Hypalon kami untuk ketahanan UV dalam kondisi matahari terik. Pengiriman cepat dari fasilitas kami di Asia.
      icon: tabler:map-pin
    - title: Timur Tengah
      description: Permintaan yang berkembang untuk perahu patroli dan penyelamat. RIBs lambung aluminium kami populer di kalangan operator penjaga pantai dan keamanan. Konfigurasi khusus untuk lingkungan bersuhu tinggi.
      icon: tabler:map-pin
features3_distribution:
  tagline: Jaringan Distribusi
  title: Bermitra dengan Distributor<br />Seluruh Dunia
  subtitle: Kami bekerja sama dengan distributor peralatan kelautan yang mapan, merek OEM, dan agen pengadaan pemerintah.
  isBeforeContent: false
  columns: 3
  items:
    - title: Kemitraan OEM/ODM
      description: Manufaktur label pribadi untuk merek olahraga air global. Kami menangani semuanya mulai dari desain hingga produksi hingga pengiriman langsung.
      icon: tabler:building
    - title: Jaringan Distributor
      description: Distributor resmi di 20+ negara menyimpan stok dan memberikan dukungan lokal. Pertanyaan distributor baru dipersilakan.
      icon: tabler:users
    - title: Pemerintah & Institusi
      description: Pasokan langsung ke penjaga pantai, organisasi pencarian dan penyelamatan, dan program pengadaan militer. Mematuhi persyaratan pengadaan institusi.
      icon: tabler:building-community
steps2_logistics:
  title: Logistik & Dukungan Global
  subtitle: Dari pabrik ke tujuan — kami mengelola seluruh rantai pasokan.
  items:
    - title: Opsi Pengiriman
      description: Pengiriman laut (FOB Qingdao), pengiriman udara untuk pesanan mendesak, dan kurir ekspres untuk sampel dan suku cadang.
      icon: tabler:truck-delivery
    - title: Gudang AS
      description: 'Stok disimpan di Montclair, CA untuk pengiriman cepat ke seluruh Amerika Utara. Pantai Barat: 2-3 hari, Tengah: 3-4 hari, Pantai Timur: 4-5 hari.'
      icon: tabler:building-warehouse
    - title: Suku Cadang
      description: Suku cadang asli Paddle Board Overstock dan bahan habis pakai tersedia sepanjang tahun. Suku cadang umum dikirim dalam 24 jam.
      icon: tabler:package
    - title: Dukungan Teknis
      description: Garis langsung ke tim teknik kami untuk pertanyaan teknis, saran perbaikan, dan dukungan refit. Kami mendukung kapal yang kami bangun 20 tahun lalu.
      icon: tabler:headset
cta:
  title: Ingin menjadi distributor?
  subtitle: Kami sedang aktif memperluas jaringan distribusi kami. Hubungi tim ekspor kami untuk mendiskusikan peluang kemitraan.
  actions:
    - variant: primary
      text: Pertanyaan kemitraan
      href: /contact
    - text: Lihat rangkaian produk kami
      href: /products
