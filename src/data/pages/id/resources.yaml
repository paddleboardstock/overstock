hero_text:
  tagline: Sumber daya
  title: Pusat Unduhan & Panduan Pembeli
  subtitle: Akses katalog produk, panduan OEM, daftar periksa pembeli, dan dokumentasi teknis untuk membantu Anda membuat keputusan pengadaan yang tepat.
features3_downloads:
  tagline: Unduhan
  title: Dokumentasi Produk<br />& Sumber Daya untuk Pembeli
  isBeforeContent: false
  columns: 2
  items:
    - title: Katalog Produk Laut 2026
      description: Rangkaian produk lengkap termasuk RIB perahu, perahu karet, papan SUP, kayak, dan aksesori. Spesifikasi, konfigurasi, dan opsi. Format PDF.
      icon: tabler:file-text
    - title: Panduan Manufaktur OEM
      description: 'Segala hal yang perlu Anda ketahui tentang kemitraan OEM/ODM: gambaran proses, jumlah pesanan minimum, opsi kustomisasi, kontrol kualitas, dan pengiriman.'
      icon: tabler:building-factory
    - title: Panduan Pembeli Perahu RIB
      description: 'Cara memilih RIB yang tepat: bahan lambung, bahan tabung, pemilihan mesin, pertimbangan ukuran, dan opsi konfigurasi untuk berbagai aplikasi.'
      icon: tabler:file-description
    - title: Daftar Periksa Pemasok SUP
      description: 'Pertimbangan utama saat memilih produsen papan SUP: indikator kualitas, persyaratan sertifikasi, pertimbangan MOQ, dan apa yang harus diperhatikan dalam audit pabrik.'
      icon: tabler:clipboard-check
    - title: Panduan Bahan Perahu Karet
      description: 'PVC vs Hypalon: perbandingan daya tahan, ketahanan UV, umur pakai, opsi perbaikan, dan pertimbangan biaya untuk berbagai aplikasi laut.'
      icon: tabler:files
    - title: Template Ringkasan Kustomisasi Manufaktur
      description: Unduh template ringkasan produk kami. Isi kebutuhan Anda dan kembalikan kepada kami untuk penawaran dan penilaian kelayakan dalam minggu yang sama.
      icon: tabler:template
faqs:
  title: Pertanyaan yang Sering Diajukan
  subtitle: Pertanyaan umum tentang produk kami, proses manufaktur, dan model kemitraan.
  columns: 2
  items:
    - title: Apa jumlah pesanan minimum?
      description: MOQ bervariasi berdasarkan kategori produk. Perahu RIB biasanya mulai dari 10 unit per model. Papan SUP dari 50 unit. Hubungi tim penjualan kami untuk informasi MOQ spesifik produk.
      icon: tabler:help-circle
    - title: Bisakah saya mendapatkan sampel sebelum memesan?
      description: Ya. Aquafarer menyediakan produksi sampel untuk evaluasi sebelum produksi massal. Biaya sampel dapat dinegosiasikan dan seringkali dikreditkan untuk pesanan produksi pertama.
      icon: tabler:package
    - title: Apa ketentuan pembayaran yang tersedia?
      description: Ketentuan standar adalah 30% deposit saat memesan, 70% sebelum pengiriman. Ketentuan LC tersedia untuk pelanggan yang memenuhi syarat. Hubungi tim keuangan kami untuk membahas pengaturan.
      icon: tabler:currency-dollar
    - title: Berapa lama produksi berlangsung?
      description: 'Waktu tunggu tipikal: perahu RIB 30-45 hari, papan SUP 20-30 hari, perahu karet 25-35 hari. Pengembangan kustom menambah 15-30 hari untuk prototipe.'
      icon: tabler:calendar-clock
    - title: Sertifikasi apa yang dimiliki produk Anda?
      description: Sertifikasi CE untuk pasar UE, produksi disetujui US Coast Guard, sistem kualitas ISO, kepatuhan BSCI, dan kepatuhan bahan REACH.
      icon: tabler:certificate
    - title: Apakah Anda menawarkan kemasan dan branding kustom?
      description: Ya. Kami menyediakan kemasan kustom dengan logo, warna, dan identitas merek Anda. MOQ untuk kemasan kustom tergantung pada kategori produk.
      icon: tabler:color-swatch
cta:
  title: Perlu bantuan menemukan sumber daya yang tepat?
  subtitle: Hubungi tim kami untuk panduan pribadi tentang pemilihan produk, kemitraan OEM, atau spesifikasi teknis.
  actions:
    - variant: primary
      text: Hubungi tim kami
      href: /contact
