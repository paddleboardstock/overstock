hero_text:
  tagline: Sumber daya
  title: Unduh Panduan Pusat & Mendayung
  subtitle: Katalog produk, panduan pembelian, dan petunjuk perawatan untuk membantu Anda memilih, menggunakan, dan menikmati papan tiup Anda SUP .
features3_downloads:
  tagline: Unduhan
  title: Dokumentasi Produk<br />& Sumber Daya Dayung
  isBeforeContent: false
  columns: 2
  items:
    - title: Katalog Produk 2026 SUP
      description: 'Paddle Board Overstock SUP Rangkaian lengkap: papan serba bisa, seri seni, dan aksesori, dengan spesifikasi lengkap dan isi kemasan. Format PDF.'
      icon: tabler:file-text
    - title: Panduan Pembeli Tiup SUP
      description: 'Cara memilih papan pertama Anda: panjang, lebar, ketebalan, volume, pencocokan berat penunggang, dan bentuk papan yang sesuai dengan gaya mendayung Anda.'
      icon: tabler:file-description
    - title: SUP Panduan Ukuran & Pas
      description: Sesuaikan volume dan dimensi papan dengan berat badan dan tingkat keterampilan Anda, dengan rekomendasi aktivitas khusus untuk rekreasi, tur, yoga, dan kebugaran.
      icon: tabler:clipboard-check
    - title: Panduan Perawatan & Pemeliharaan Papan
      description: 'Jaga papan Anda tetap seperti baru: pembersihan, pengeringan, penyimpanan, UV perlindungan, perawatan katup, dan instruksi perbaikan kecil.'
      icon: tabler:tool
    - title: Panduan Material Papan Tiup
      description: PVC konstruksi, drop-stitch inti, EVA pad dek, dan apa PSI arti kekakuan 15 untuk performa dan daya tahan.
      icon: tabler:files
    - title: Memulai dengan SUP
      description: 'Dasar-dasar mendayung pemula: inflasi, membawa daya, meluncur, gerakan dasar, dan kebutuhan keselamatan agar Anda bisa berdiri di hari pertama.'
      icon: tabler:swimming
faqs:
  title: Pertanyaan yang Sering Diajukan
  subtitle: Pertanyaan umum tentang papan kami, pemesanan, dan cara naik ke air.
  columns: 2
  items:
    - title: Apa saja yang termasuk dalam papan saya?
      description: Setiap paket lengkap mencakup papan, dayung yang dapat disesuaikan, pompa aliran tinggi, tali, kit perbaikan, dan ransel. Set Dayung & Pompa juga tersedia terpisah.
      icon: tabler:package
    - title: Berapa lama inflasi berlangsung?
      description: Dengan pompa aliran tinggi yang disertakan, sebagian besar pendayung mencapai tekanan penuh dalam 8-12 menit. Pompa listrik juga berfungsi — cukup berhenti pada tekanan terukur yang tercetak dekat katup.
      icon: tabler:clock
    - title: Bagaimana cara memilih papan yang tepat?
      description: 'Mulailah dengan gaya berat badan dan dayung: pemula dan keluarga menyukai platform lebar dan stabil seperti SUP Explorer 11; pendayung yoga lebih menyukai traksi full-deck; pendayung touring menginginkan bentuk yang kaku dan aerodinamis. Tim kami dengan senang hati merekomendasikan.'
      icon: tabler:help-circle
    - title: Metode pembayaran apa saja yang Anda terima?
      description: Kami menerima kartu kredit utama, PayPal, dan transfer bank. Semua harga sudah termasuk paket lengkap — tanpa tambahan tersembunyi.
      icon: tabler:currency-dollar
    - title: Berapa lama waktu pengiriman?
      description: Pesanan dikirim dari pabrik kami dan biasanya tiba dalam 5-10 hari kerja tergantung wilayah Anda. Pelacakan disediakan untuk setiap pesanan.
      icon: tabler:truck-delivery
    - title: Apakah papan saya dilindungi oleh garansi?
      description: Ya — setiap papan dilindungi dari cacat pembuatan, dan setiap unit diuji tekan hingga 1,25x tekanan yang ditentukan selama 24-48 jam sebelum meninggalkan pabrik. Tingkat klaim garansi kami kurang dari 2%.
      icon: tabler:shield-check
cta:
  title: Perlu bantuan menemukan papan yang tepat?
  subtitle: Hubungi tim kami untuk saran jujur tentang pemilihan papan, ukuran, atau pertanyaan pesanan.
  actions:
    - variant: primary
      text: Hubungi tim kami
      href: /contact
