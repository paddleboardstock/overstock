hero:
  tagline: Paddle Board Overstock Akademi
  title: Pusat Pembelajaran
  subtitle: Panduan dan tutorial untuk setiap tingkat keterampilan — dari dasar SUP hingga teknik penyelamatan tingkat lanjut
categories:
  - level: Pemula
    color: from-green-500 to-emerald-600
    badge: bg-green-100 text-green-700
    guides:
      - title: SUP Dasar-dasar
        desc: Pelajari dasar-dasar stand-up paddleboarding — posisi, teknik dayung, dan keseimbangan.
        slug: beginner-sup-guide
      - title: Teknik Dayung
        desc: Dayung maju, dayung sapu, dayung tarik, dan penjagaan rendah — kuasai gerakan dayung penting.
        slug: sup-paddle-guide
      - title: Keselamatan Pertama
        desc: Praktik keselamatan penting termasuk pemeriksaan cuaca, penggunaan PFD, aturan pengikat, dan penyelamatan diri.
        slug: sup-safety-guide
  - level: Intermediat
    color: from-blue-500 to-indigo-600
    badge: bg-blue-100 text-blue-700
    guides:
      - title: Perlengkapan Touring
        desc: Perencanaan paddle multi-jam — navigasi, hidrasi, kecepatan, dan membaca perkiraan angin.
        slug: touring-sup-guide
      - title: Membaca Cuaca
        desc: Menafsirkan perkiraan cuaca laut, mengenali pola awan, dan memahami efek angin pada air.
        slug: weather-planning-water-sports
      - title: Dasar-Dasar Navigasi
        desc: Membaca peta, penggunaan kompas, titik lokasi GPS, dan perencanaan rute untuk paddling di pesisir.
        slug: sup-navigation-guide
      - title: Pemahaman Pasang Surut
        desc: Memahami siklus pasang surut, arus, dan bagaimana mereka memengaruhi waktu peluncuran dan rute.
        slug: understanding-tides
  - level: Canggih
    color: from-purple-500 to-violet-600
    badge: bg-purple-100 text-purple-700
    guides:
      - title: Perencanaan Perjalanan Multi-Hari
        desc: Logistik ekspedisi — pemilihan perlengkapan, perencanaan makanan, protokol keselamatan, dan kontak darurat.
        slug: sup-travel-guide
      - title: Teknik Penyelamatan
        desc: Penyelamatan diri, T-rescue, penyelamatan eskimo untuk kayak, dan protokol penarikan di perairan terbuka.
        slug: sup-self-rescue
      - title: Paddle Malam
        desc: Navigasi setelah gelap — persyaratan pencahayaan, memori rute, komunikasi kelompok, dan kesadaran bahaya.
        slug: sup-navigation-guide
  - level: Pemeliharaan
    color: from-amber-500 to-orange-600
    badge: bg-amber-100 text-amber-700
    guides:
      - title: Pembersihan & Perawatan
        desc: Pembilasan air tawar, perlindungan UV, pencegahan jamur, dan teknik pengeringan yang tepat setelah setiap sesi.
        slug: inflatable-sup-maintenance
      - title: Panduan Penyimpanan
        desc: Praktik terbaik untuk menyimpan papan dan perahu tiup — pengempisan, pelipatan, pengendalian suhu, dan masa simpan.
        slug: inflatable-sup-storage
      - title: Dasar Perbaikan
        desc: Perbaiki lubang kecil, kebocoran jahitan, dan masalah katup dengan kit perbaikan PVC dan teknik tambal.
        slug: inflatable-sup-repair
      - title: Perawatan Katup
        desc: Identifikasi jenis katup (Halkey-Roberts, Boston, Leafield), bersihkan kotoran, dan ganti batang yang rusak.
        slug: inflatable-sup-repair
knowledge_center_tagline: Pusat Pengetahuan
knowledge_center_title: Peralatan & Panduan Industri Maritim
knowledge_center_subtitle: Pengetahuan ahli dan panduan pembelian untuk profesional maritim, operator armada, dan penggemar olahraga air.
knowledge_sections:
  - title: RIB Pengetahuan Perahu
    tagline: Panduan Rigid Inflatable Boat
    desc: Segala hal tentang perahu RIB — desain lambung, bahan, pemilihan mesin, perawatan, dan saran pembelian untuk penggunaan komersial dan rekreasi.
    guides:
      - title: Cara Memilih Perahu RIB yang Tepat
        desc: Panduan lengkap untuk memilih RIB — ukuran, daya mesin, bahan tabung, jenis lambung, dan penggunaan yang dimaksudkan.
        href: /v2/inflatable-boat-buying-guide
      - title: RIB vs Perahu Tiup
        desc: Rigid inflatable boat vs perahu karet tradisional — desain lambung, performa, daya tahan, dan kapasitas dibandingkan.
        href: /compare/rib-vs-dinghy
      - title: Komersial RIB vs Rekreasi RIB
        desc: Perahu RIB kelas komersial vs rekreasi — standar konstruksi, bahan, umur, biaya, dan sertifikasi.
        href: /compare/commercial-vs-recreational-rib
      - title: Lambung Aluminium vs Fiberglass
        desc: Bandingkan lambung aluminium dan fiberglass untuk perahu RIB berdasarkan berat, biaya, daya tahan, dan ketahanan korosi.
        href: /compare/aluminum-vs-fiberglass
  - title: Panduan Perahu Tiup
    tagline: Pengetahuan Kapal Tiup
    desc: Panduan komprehensif tentang perahu tiup — PVC vs Hypalon, metode konstruksi, standar keselamatan, dan praktik perawatan terbaik.
    guides:
      - title: Panduan Material PVC vs Hypalon
        desc: Perbandingan definitif antara PVC dan Hypalon CSM untuk konstruksi perahu tiup.
        href: /compare/pvc-vs-hypalon
      - title: Cara Membuat Perahu Tiup
        desc: Proses manufaktur — pemotongan material, pengelasan HF, konstruksi jahitan, pengujian tekanan, dan kontrol kualitas.
        href: /learn/inflatable-technology
      - title: Panduan Keselamatan Perahu Tiup
        desc: Standar keselamatan, kapasitas beban, pengisian udara yang tepat, pengecekan sebelum keberangkatan, dan prosedur darurat.
        href: /learn/water-safety
      - title: Perawatan Perahu Tiup
        desc: Pembersihan, penyimpanan, perlindungan UV, winterisasi, dan perbaikan perahu tiup dan RIBs.
        href: /v2/inflatable-boat-maintenance
  - title: Pengetahuan Perahu
    tagline: Perahu Tiup & RIB Hub
    desc: Panduan teknis yang mencakup jenis perahu tiup, material, metode konstruksi, pemeliharaan, dan keselamatan — mulai dari perahu kecil hingga RIBs.
    guides:
      - title: Jenis Perahu Tiup
        desc: Perahu kecil, RIBskayak, dan tender — pelajari perbedaannya dan pilih yang tepat.
        href: /v2/inflatable-boat-buying-guide
      - title: Drop-Stitch Teknologi
        desc: Bagaimana ribuan ulir internal menciptakan struktur tiup yang kaku dan bertekanan tinggi.
        href: /learn/drop-stitch-core
      - title: Referensi Material
        desc: PVC Penjelasan tentang rating denier, berat kain, UV ketahanan, dan material kelas laut.
        href: /learn/materials
      - title: RIB vs Perahu
        desc: Bandingkan perahu tiup kaku dengan perahu tiup tradisional untuk berbagai kasus penggunaan.
        href: /compare/rib-vs-dinghy
  - title: SUP Pengetahuan
    tagline: Panduan Papan Dayung Berdiri
    desc: Segala sesuatu tentang SUP papan — tiup vs kaku, dimensi papan, teknologi material, dan saran ahli untuk semua tingkat keterampilan.
    guides:
      - title: Tiup vs Keras SUP
        desc: Bandingkan iSUP dan papan epoksi keras dari segi portabilitas, daya tahan, performa, dan nilai.
        href: /learn/sup
      - title: SUP Panduan Dimensi Papan
        desc: Bagaimana panjang, lebar, dan ketebalan memengaruhi stabilitas, kecepatan, dan kelincahan.
        href: /learn/sup
      - title: SUP Pemeliharaan & Perawatan
        desc: Tips pembersihan, penyimpanan, UV perlindungan, dan perbaikan untuk papan tiup SUP .
        href: /v2/inflatable-sup-maintenance
      - title: Memilih Yang Pertama SUP
        desc: Panduan pemula untuk memilih papan paddle berdiri yang tepat sesuai dengan berat badan, tingkat keterampilan, dan tujuan penggunaan Anda.
        href: /learn/sup
  - title: Panduan Perlengkapan Menyelam
    tagline: Pengetahuan tentang Perahu Selam Komersial
    desc: Pemandu khusus tentang kapal selam, penyelamanRIBs, dan peralatan untuk pusat selam, operator selam, dan tim penyelaman komersial.
    guides:
      - title: RIB Perahu Terbaik untuk Pusat Selam
        desc: Cara memilih penyelaman yang tepat RIB untuk pusat selam Anda — pertimbangan kapasitas, konfigurasi, dan anggaran.
        href: /solutions-diving-center-boats
      - title: RIB Panduan Konfigurasi Menyelam
        desc: Fitur penting untuk menyelam RIBs — rak tangki, sistem tangga, platform menyelam, dan penyimpanan peralatan.
        href: /solutions-diving-center-boats
  - title: Panduan Tender Yacht
    tagline: Solusi Superyacht & Tender Laut
    desc: Panduan memilih tender kapal pesiar yang sempurna — tender karet, tender RIB, solusi penyimpanan, dan aksesori tender.
    guides:
      - title: Cara Memilih Tender Kapal Pesiar
        desc: Faktor yang perlu dipertimbangkan saat memilih tender untuk kapal pesiar Anda — ukuran, bahan, mesin, dan penyimpanan.
        href: /solutions-yacht-tender-solutions
      - title: Tender Karet vs Tender RIB
        desc: Bandingkan tender perahu karet dengan perahu karet kaku untuk kinerja, daya tahan, dan kemudahan penyimpanan.
        href: /compare/rib-vs-dinghy
  - title: Panduan Peralatan Penyelamatan
    tagline: Pengetahuan Perahu Penyelamatan & SAR
    desc: Panduan profesional tentang perahu penyelamatan, perahu SAR, dan peralatan tanggap darurat untuk penjaga pantai, penjaga keselamatan, dan tim bantuan bencana.
    guides:
      - title: Panduan Pemilihan Perahu SAR
        desc: Cara memilih perahu pencarian dan penyelamatan yang tepat — kecepatan, kapasitas, daya tahan, dan kebutuhan peralatan khusus.
        href: /solutions-rescue-watercraft
      - title: RIB Komersial untuk Operasi Penyelamatan
        desc: Mengapa RIBs tingkat komersial menjadi pilihan utama untuk tim pencarian dan penyelamatan profesional di seluruh dunia.
        href: /use-cases/search-and-rescue
