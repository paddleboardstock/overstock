content_challenge:
  tagline: Tantangan
  title: Kebutuhan Budidaya Perairan<br />Peralatan yang Tahan Air Laut
  subtitle: Kebun ikan, peternakan mutiara, dan peternakan laut beroperasi di lingkungan laut yang paling agresif secara kimia — paparan air laut yang berkepanjangan, residu bahan bakar dan pakan, serta penggunaan sehari-hari yang terus-menerus.
  paragraphs:
    - Operasi budidaya perairan berjalan 365 hari setahun di lingkungan pesisir dan lepas pantai yang terbuka. Kapal kerja yang digunakan untuk inspeksi keramba, transportasi pakan, pemeliharaan tali mutiara, dan perawatan peralatan menghadapi paparan air laut yang konstan, UV paparan, dan kontak kimia dari bahan bakar, pakan ikan, dan perawatan anti-kotoran.
    - '**Korosi adalah musuh utama** — Peralatan laut standar cepat rusak dalam kondisi ini. Mesin tempel, rangka trailer, dan perlengkapan lambung perlu diganti secara terus-menerus. Operator membutuhkan perahu yang dibuat dengan bahan tahan korosi yang bisa bertahan bertahun-tahun di lingkungan ini tanpa menurun kualitasnya.'
    - '**Keandalan harian sangat penting** — Perahu kerja yang rusak berarti jadwal pemberian pakan terlewat, panen tertunda, dan kerugian produksi yang mahal. Untuk peternakan mutiara, satu hari inspeksi yang terlewat dapat berarti kerusakan besar pada hasil. Untuk budidaya ikan, pemberian pakan yang tertunda memengaruhi laju pertumbuhan dan profitabilitas.'
    - Paddle Board Overstock perahu budidaya RIBs dirancang dengan perangkat keras tahan korosi, tabung Hypalon berat, dan lambung yang diperkuat yang dibuat khusus untuk kondisi menuntut operasi budidaya ikan, budidaya mutiara, dan peternakan laut.
content_solution:
  tagline: Solusi Kami
  title: Dirancang Khusus RIBs<br />Untuk Industri Budidaya Perairan
  subtitle: Setiap Paddle Board Overstock kapal kerja budidaya perairan dirancang untuk tahan terhadap lingkungan air laut yang agresif sekaligus memberikan kinerja harian yang andal.
  list:
    - Tabung Hypalon kelas laut — ketahanan superior terhadap UV, air laut, bahan bakar, dan bahan kimia pakan ikan
    - Perangkat keras stainless steel 316 di seluruh bagiannya — tidak berkarat meski terkena air laut dalam waktu lama
    - Rubbing strake dan pelindung lambung yang diperkuat untuk kontak berulang dengan dermaga dan keramba
    - Dek dengan sistem pembuangan sendiri untuk memudahkan pencucian dan pengeringan setelah transportasi pakan dan operasi panen
    - Konfigurasi dek datar untuk membawa karung pakan, wadah panen, dan peralatan
    - Konfigurasi outboard dari 15 HP hingga 60 HP — dioptimalkan untuk muatan vs. efisiensi bahan bakar
    - Pilihan warna tabung yang mudah terlihat untuk penemuan cepat di area pertanian yang luas
content_segments:
  tagline: Profil Akuakultur
  title: Solusi Kapal Kerja<br />Berdasarkan Jenis Akuakultur
  subtitle: Operasi akuakultur yang berbeda memiliki kebutuhan kapal kerja yang berbeda — dari RIBs kecil dan gesit untuk inspeksi kandang ikan hingga platform transportasi yang stabil untuk budidaya mutiara dan kapal kerja berat untuk budidaya laut.
  items:
    - title: Operasi Budidaya Ikan
      subtitle: Inspeksi kandang, transportasi pakan, dukungan panen
      description: Tambak ikan laut mengoperasikan kandang di lokasi pesisir dan lepas pantai yang terbuka. Kapal kerja digunakan setiap hari untuk inspeksi jaring kandang, operasi pemberian pakan, dukungan panen, dan perawatan peralatan. Tantangan utama adalah korosi — kapal terus-menerus terpapar air asin, sisa pakan ikan, dan bahan bakar. Kapal kerja yang andal sangat penting karena pakan yang terlewat atau panen yang tertunda langsung mempengaruhi output produksi dan profitabilitas.
      features:
        - 'Paket lingkungan agresif: perangkat keras stainless steel 316, komponen paduan kelas laut'
        - Tata letak dek datar untuk transportasi karung pakan dan wadah panen
        - Dek self-bailing untuk mudah dicuci setelah operasi
        - Tabung Hypalon dengan lapisan tahan bahan kimia untuk paparan pakan dan bahan bakar
        - Strake penggosokan diperkuat untuk kontak sering dengan kandang dan dermaga
    - title: Operasi Budidaya Mutiara
      subtitle: Transportasi stabil untuk inspeksi lini mutiara dan panen
      description: Budidaya mutiara membutuhkan kapal kerja yang stabil dan andal untuk transportasi harian antara lini mutiara, inspeksi jaring tiram, dan pengumpulan panen. Operasi ini berlangsung di lokasi pesisir terpencil dengan infrastruktur perawatan yang terbatas. Kapal harus cukup stabil untuk pekerja bekerja saat inspeksi lini mutiara, dengan akses naik-turun yang mudah dan dek luas untuk membawa tiram panen, jaring, dan perlengkapan. Keandalan dan pemeliharaan yang mudah sangat penting di lokasi pertanian terpencil.
      features:
        - Desain lambung stabil untuk pekerja berdiri selama inspeksi lini mutiara
        - Dek datar dengan permukaan anti selip untuk pergerakan pekerja yang aman
        - Freeboard rendah untuk akses mudah ke jaring tiram dan panen
        - Konfigurasi outboard sederhana untuk perawatan mudah di lokasi
        - Paket tabung dan perangkat keras tahan korosi untuk paparan air laut terus-menerus
    - title: Budidaya Laut & Pengayaan Laut
      subtitle: Transportasi juvenil, servis kandang, dukungan pemantauan
      description: Operasi budidaya laut melibatkan pelepasan stok juvenil ke lingkungan laut yang dikelola, pemantauan pertumbuhan, dan perawatan struktur pengayaan. Kapal kerja perlu mengangkut stok juvenil hidup dalam wadah ber-aerasi, membawa peralatan pemantauan, dan mengakses lokasi pelepasan pesisir yang dangkal. Desain lambung harus menyeimbangkan kapasitas muat dengan draft dangkal untuk akses ke pantai dan muara.
      features:
        - Ruang dek untuk wadah transportasi juvenil ber-aerasi dan peralatan pemantauan
        - Draft dangkal untuk akses lokasi pelepasan pantai dan muara
        - Pendaratan pantai yang mudah — lambung dan pelindung haluan diperkuat
        - Titik pemasangan peralatan untuk elektronik pemantauan dan alat pengambilan sampel
        - Tabung Hypalon berat untuk daya tahan dalam kondisi pasir campuran dan air laut
