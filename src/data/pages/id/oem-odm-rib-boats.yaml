hero:
  tagline: Pembuatan RIB Khusus
  title: Perahu RIB Khusus OEM<br />& ODM Layanan
  subtitle: Dari platform yang terbukti hingga kapal yang dibangun untuk tujuan tertentu — Aquafarer menyediakan RIB-spesifik OEM dan ODM layanan untuk merek, dealer, dan operator profesional yang membutuhkan konfigurasi lambung khusus, material tabung, tata letak dek, dan dokumentasi kepatuhan untuk pasar sasaran mereka.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Pembuatan perahu RIB khusus di Aquafarer
direct_answer: Aquafarer menawarkan RIB-spesifik OEM dan ODM kustomisasi dari pabrik bersertifikat CE di Qingdao — termasuk panjang lambung khusus, material tabung (PVC atau Hypalon/CSM), tata letak dek, konfigurasi konsol dan tempat duduk, serta dokumentasi kepatuhan penuh RCD 2013/53/EU. MOQ dimulai dari 2-5 unit untuk model RIB.
