comparison_matrix:
  title: OEM vs. ODM — Model Mana yang Cocok untuk Proyek Anda?
  subtitle: Empat mode kolaborasi, masing-masing dengan tingkat keterlibatan pabrik dan kontrol merek yang berbeda
  columns:
    - header: Mode Kolaborasi
    - header: Peran Merek Anda
    - header: Peran Aquafarer
  rows:
    - option: OEM Manufaktur
      standard: Menyediakan merek, spesifikasi, dan persyaratan kepatuhan
      premium: Membangun sesuai spesifikasi Anda menggunakan cetakan dan lini produksi yang ada
    - option: ODM Kustomisasi
      standard: Pilih model dasar, kustomisasi fitur dan merek
      premium: Mengadaptasi platform RIB yang terbukti dengan modifikasi yang Anda inginkan
    - option: Semi-Kustom RIB
      standard: Tentukan panjang lambung, material tabung, tata letak dek, dan peralatan
      premium: Mengubah lambung yang ada dengan konfigurasi tabung khusus dan rencana dek
    - option: Pengembangan Kustom Penuh
      standard: Berikan konsep dan persyaratan pasar sasaran
      premium: Desain dari awal — lambung kustom, cetakan, dan dokumentasi lengkap
content_customization:
  tagline: Apa yang Bisa Disesuaikan
  title: RIB Kustomisasi<br />Opsi
  subtitle: Setiap elemen dari sebuah RIB perahu dapat disesuaikan dengan aplikasi, pasar, dan persyaratan merek Anda.
  items:
    - title: Lambung & Struktural
      description: Panjang lambung (2,5–8,5 m), bahan lambung (fiberglass GRP atau aluminium kelas laut), warna lambung (gelcoat atau dicat), profil lunas (V-dalam, V-sedang, datar), tipe transom (transom tertutup dengan braket atau sumur), dan penguatan struktural untuk persyaratan beban komersial.
      icon: tabler:sailboat
    - title: Tabung & Kerah
      description: Bahan tabung (0,9–1,2 mm PVC atau 1,4–1,7 mm Hypalon/CSM), diameter tabung (40–55 cm), jumlah ruang (3–7), jenis katup (Halkey-Roberts, Leafield D7, atau Boston), warna tabung (standar atau kustom), dan konfigurasi kerah kerucut/taper.
      icon: tabler:circle
    - title: Tata Letak Dek & Konsol
      description: Konsol tengah, konsol samping, atau kemudi tiller. Tata letak tempat duduk (kursi joki, kursi bangku, kursi penyangga). Penutup dek (EVA busa tampilan kayu jati, cat anti selip, atau GRP polos). Titik pemasangan peralatan, pegangan, dan posisi D-ring.
      icon: tabler:layout-dashboard
    - title: Listrik & Navigasi
      description: Lampu navigasi (LED), sistem pompa bak kemudi, manajemen baterai, instalasi radio VHF, pemasangan GPS/chartplotter, port pengisian USB, dan konfigurasi panel saklar.
      icon: tabler:bolt
    - title: Merek & Grafis
      description: Grafik lambung dan tabung (sablon, transfer panas, UV cetak digital), penempatan logo, skema warna khusus, tanda pengenal, dan dokumentasi pemilik khusus dengan merek Anda.
      icon: tabler:palette
    - title: Keselamatan & Kepatuhan
      description: Peringkat kategori desain (A/B/C/D per RCD), sistem pemadaman kebakaran, spesifikasi sistem bahan bakar (tangki portabel, tangki tetap, di bawah dek), dan paket dokumentasi kepatuhan untuk pasar sasaran Anda.
      icon: tabler:shield
content_applications:
  tagline: Konfigurasi Aplikasi
  title: RIB Konfigurasi<br />Berdasarkan Aplikasi
  subtitle: Misi yang berbeda menuntut konfigurasi yang berbeda. Berikut adalah pengaturan yang terbukti untuk aplikasi RIB yang paling umum.
  items:
    - title: Penyelamatan & Patroli
      description: Lambung Deep-V, tabung Hypalon, dek dengan sistem pembuangan sendiri, kursi penyangga, pegangan, lampu navigasi, dan cincin D kelas berat. RCD Kategori Desain B atau C. Sistem bahan bakar tahan api dan kelistrikan kelas komersial.
      icon: tabler:lifebuoy
    - title: Dukungan Menyelam
      description: Balok lebar, tangga naik di belakang, posisi rak tangki, cincin D tambahan, dudukan bendera selam, lambung belakang diperkuat untuk mesin kembar, dan penutup dek penuh anti selip EVA.
      icon: tabler:mask
    - title: Pariwisata & Komersial
      description: Tata letak bersertifikat untuk penumpang dengan tempat duduk bangku, peneduh/Bimini, pegangan, penyimpanan kering, dan sistem baterai ganda. RCD Kategori C. Dirancang untuk operasional resor dan armada sewa.
      icon: tabler:beach
    - title: Penangkapan ikan
      description: Tata letak dek terbuka, posisi tempat joran, kolam umpan hidup, dudukan alat bantu penangkap ikan, dudukan motor trolling, transom yang diperkuat, dan sistem bahan bakar portabel. Pilihan konsol tengah atau konsol samping.
      icon: tabler:fish
    - title: Rekreasi & Kapal Tender Yacht
      description: Lambung ringan, tabung PVC, tempat duduk nyaman, kemudi teleskopik atau konsol kompak, titik pengangkat untuk davit, dan tangki bahan bakar yang dapat dilepas. RCD Kategori C atau D.
      icon: tabler:sailboat
    - title: Kapal Kerja Profesional
      description: Opsi lambung aluminium, penguatan berat, kemudi hidraulik, kelistrikan kelas komersial, lengkungan radar, dan titik integrasi peralatan khusus misi. Kepatuhan khusus per proyek.
      icon: tabler:anchor
process_steps:
  title: Proses Pengembangan 7-Tahap RIB OEM/ODM
  subtitle: Dari brief proyek hingga purna jual — alur kerja yang terdefinisi dengan milestone dan deliverable jelas
  steps:
    - number: '01'
      title: Brief Proyek & Persyaratan
      description: Tentukan aplikasi target, ukuran lambung, bahan tabung, persyaratan kepatuhan, dan kebutuhan branding. Kami menilai kelayakan dan mengonfirmasi model kolaborasi (OEM/ODM/Semi-Kustom/Penuh Kustom).
      timeline: 3–5 hari
    - number: '02'
      title: Ulasan Teknis & Kelayakan
      description: Tim teknik meninjau kelayakan struktural, perhitungan stabilitas dan daya apung, jalur kepatuhan, dan ketersediaan bahan. Kami mengidentifikasi cetakan yang ada atau kebutuhan cetakan khusus.
      timeline: 5–7 hari
    - number: '03'
      title: Proposal & Penawaran Harga
      description: Terima proposal rinci termasuk spesifikasi, rendering 3D atau gambar GA, cakupan kepatuhan, timeline, dan harga unit berdasarkan tingkatan volume dan MOQ.
      timeline: 5–7 hari
    - number: '04'
      title: Konfirmasi Desain & Sampling
      description: Setujui GA akhir, layout dek, dan konfigurasi tabung. Kami menghasilkan sampel pra-produksi dengan warna merek Anda, logo, dan bahan yang ditentukan untuk inspeksi fisik Anda.
      timeline: 15–20 hari
    - number: '05'
      title: Persetujuan Sampel & Protokol QC
      description: 'Periksa dan setujui sampel. Tentukan protokol QC produksi: uji tekanan (1,25x / 24–48 jam), pemeriksaan dimensi, dan daftar dokumen kepatuhan per lambung.'
      timeline: 3–5 hari
    - number: '06'
      title: Produksi Massal & Kontrol Kualitas
      description: Produksi penuh dengan checklist QC 100 poin per unit. Pemeriksaan selama proses, uji tekanan, dan keterlacakan tingkat seri. Dokumentasi CE/ISO disiapkan secara bersamaan.
      timeline: 30–45 hari
    - number: '07'
      title: Pengemasan, Pengiriman & Purna Jual
      description: Pengemasan khusus (standar, siap jual, atau palet), dokumentasi ekspor, pemuatan kontainer, dan logistik. Kit suku cadang dan dokumentasi perawatan termasuk.
      timeline: 7–14 hari
certifications:
  title: Kepatuhan & Sertifikasi untuk Kapal RIB
  subtitle: Setiap pesanan RIB kustom dikirim dengan dokumentasi kepatuhan spesifik model
  items:
    - name: CE 2013/53/UE
      description: Kepatuhan RCD per model dan kategori desain — DoC, plat pembuat, manual pemilik disertakan
      badge: CE
    - name: ISO 9001:2015
      description: Sistem manajemen kualitas bersertifikat oleh SGS yang mencakup desain, produksi, dan distribusi
      badge: ISO
    - name: EN ISO 6185
      description: Standar konstruksi perahu karet — stabilitas, daya apung, dan pemulihan orang yang jatuh ke laut
      badge: 6185
    - name: EN ISO 14945
      description: Standar pelat pembuat — informasi identifikasi dan kapasitas yang ditandai secara permanen
      badge: 14945
    - name: BSCI
      description: Audit kepatuhan sosial untuk manufaktur etis — diwajibkan oleh pengecer UE
      badge: BSCI
    - name: REACH
      description: Kepatuhan keselamatan kimia UE untuk PVC, Hypalon, perekat, dan pelapis
      badge: REACH
content_service_modules:
  tagline: Modul Layanan
  title: Layanan OEM/ODM<br />Modul
  subtitle: Setiap proyek menggabungkan modul layanan yang tepat. Tidak setiap proyek membutuhkan setiap modul — kami hanya menentukan cakupan yang dibutuhkan proyek Anda.
  items:
    - title: Tinjauan Teknik & Kelayakan
      description: 'Penilaian platform lambung, pemeriksaan kelayakan struktural, verifikasi stabilitas dan daya apung, identifikasi jalur kepatuhan, dan konfirmasi ketersediaan material. Output: laporan kelayakan dengan rekomendasi lanjut/tidak lanjut.'
      icon: tabler:math-function
    - title: Desain & Konfigurasi
      description: 'Gambar GA, tata letak dek, konfigurasi tabung, posisi konsol dan tempat duduk, rencana pemasangan peralatan, serta pemilihan warna/material. Keluaran: GA dan spesifikasi konfigurasi yang disetujui.'
      icon: tabler:ruler
    - title: Contoh & Prototipe
      description: Contoh pra-produksi dengan warna, logo, dan bahan yang ditentukan yang telah disetujui untuk pemeriksaan fisik. Termasuk protokol persetujuan sampel, daftar periksa inspeksi, dan proses permintaan perubahan.
      icon: tabler:3d-cube-sphere
    - title: Produksi & QC
      description: Produksi massal dengan daftar periksa QC 100 poin per unit, inspeksi selama proses, pengujian tekanan (1,25x / 24-48 jam), dan keterlacakan tingkat seri. Dokumentasi CE/ISO disiapkan secara paralel.
      icon: tabler:clipboard-check
    - title: Merek & Kemasan
      description: Aplikasi logo merek pribadi, grafik lambung dan tabung kustom, dokumentasi pemilik bermerek, kemasan siap jual atau dipaletkan, dan persiapan kit suku cadang.
      icon: tabler:palette
    - title: Ekspor & Dokumentasi
      description: Pengemasan ekspor, rencana pemuatan kontainer, dokumentasi FOB/CIF/DDP, dokumen kepatuhan sesuai pasar tujuan, dan protokol komunikasi pasca-pengiriman.
      icon: tabler:world
content_risk_control:
  tagline: Kontrol Risiko & Pengiriman
  title: Risiko Proyek &<br />Manajemen Pengiriman
  subtitle: Pembeli profesional OEM/ODM peduli pada pengendalian risiko sama seperti kualitas produk. Inilah cara kami mengelolanya.
  items:
    - title: Definisi Lingkup & Kepemilikan
      description: 'Sebelum pengembangan dimulai, kami mendefinisikan secara tertulis: ruang lingkup kustomisasi, persyaratan alat, kriteria persetujuan sampel, kepemilikan gambar dan cetakan, serta tanggung jawab dokumentasi. Tidak ada ambiguitas tentang siapa yang memiliki apa.'
      icon: tabler:file-text
    - title: Proses Kontrol Perubahan
      description: Semua perubahan spesifikasi setelah konfirmasi desain mengikuti proses permintaan perubahan yang terdokumentasi dengan penilaian dampak (biaya, waktu, kepatuhan). Tidak ada modifikasi yang belum disetujui masuk ke produksi.
      icon: tabler:arrows-diff
    - title: Jaminan Konsistensi Batch
      description: Unit ke-50 cocok dengan sampel pertama yang disetujui. Spesifikasi yang disetujui dibekukan, parameter material dan proses dikunci, dan pos pemeriksaan dalam proses memverifikasi konsistensi sepanjang proses produksi.
      icon: tabler:repeat
    - title: Transparansi Pengiriman & Kapasitas
      description: Waktu tunggu dikutip berdasarkan kapasitas produksi aktual, tingkat stok material, dan beban pesanan saat ini — bukan target aspirasi. Jadwal produksi dengan tanggal tonggak yang diberikan per pesanan.
      icon: tabler:calendar-stats
faq:
  title: / RIB OEMODM — Pertanyaan yang Sering Diajukan
  questions:
    - q: Apa perbedaan antara OEM dan ODM untuk RIB kapal?
      a: '(OEMManufaktur Peralatan Asli): Anda menyediakan spesifikasi rinci dan kami membangun desain Anda.ODM (Manufaktur Desain Asli): Anda memilih platform yang sudah terbukti Aquafarer RIB dan kami sesuaikan dengan fitur dan branding yang Anda inginkan.ODM lebih cepat dan biaya lebih rendah;OEM menawarkan kontrol desain maksimal.'
    - q: Bisakah saya menyesuaikan RIB bentuk dan ukuran lambung?
      a: Ya. Kami menawarkan modifikasi semi-kustom pada cetakan lambung yang sudah ada (tata letak dek yang berbeda, konfigurasi tabung) dan pengembangan lambung khusus penuh dengan CNCcetakan baru yang diproses mesin. Proyek semi-kustom dapat dimulai dari 2-5 unit; kustom penuh biasanya membutuhkan komitmen yang lebih tinggi.
    - q: Bahan tabung apa saja yang tersedia untuk kustomRIBs?
      a: Kami menawarkan 0,9-1,2 mm PVC untuk penggunaan rekreasi dan komersial ringan, serta 1,4-1,7 mm HypalonCSM / untuk aplikasi profesional, penyelamatan, dan komersial yang membutuhkan UV ketahanan ozon unggul (umur 10-15 tahun dibandingkan 5-8 tahun untuk PVC).
    - q: Bisakah Anda RIBs mengonfigurasi untuk aplikasi tertentu seperti penyelamatan, menyelam, atau memancing?
      a: Ya. Kami memelihara template konfigurasi yang terbukti untuk aplikasi penyelamatan/patroli, dukungan menyelam, pariwisata/sewa, memancing, kapal pelayaran, dan perahu kerja profesional. Setiap template mencakup tipe lambung yang direkomendasikan, bahan tabung, tata letak dek, dan peralatan — yang kemudian kami sesuaikan dengan kebutuhan Anda secara tepat.
    - q: Informasi apa yang Anda butuhkan untuk RIB OEMODM penawaran / penawaran?
      a: Aplikasi target, panjang lambung yang diinginkan, preferensi material tabung (PVCatau Hypalon), perkiraan jumlah dan jadwal pengiriman, persyaratan kepatuhan pasar target, serta produk atau spesifikasi referensi apa pun. Semakin detail yang Anda berikan, semakin cepat dan akurat penawaran kami.
    - q: Berapa MOQ untuk perahu RIB kustom?
      a: Untuk cetakan lambung yang sudah ada dengan modifikasi standar, MOQ dimulai dari 2-5 unit per desain. Untuk cetakan kustom dan pengembangan kustom penuh, MOQ tergantung pada kompleksitas proyek — biasanya 10-20 unit untuk semi-kustom dan 30+ unit untuk custom penuh dengan alat baru.
    - q: Siapa pemilik cetakan dan gambar kustom tersebut?
      a: Cetakan yang dikembangkan menggunakan Aquafarer desain dasar tetap Aquafarer menjadi properti. Cetakan yang sepenuhnya disesuaikan dan dibayar oleh klien dapat dialihkan ke kepemilikan klien sesuai dengan ketentuan kontrak. Semua ketentuan kepemilikan cetakan didokumentasikan sebelum proyek dimulai.
    - q: Bagaimana cara RIBs pengemasan khusus untuk ekspor?
      a: 'Standar: stretch-wrap cradle khusus + untuk pemuatan kontainer. Premium: kemasan siap jual, kemasan vakum, atau palet. Kami menawarkan FOB Qingdao, CIF, dan DDP pengiriman. Dokumentasi ekspor lengkap dan bea cukai sudah termasuk.'
