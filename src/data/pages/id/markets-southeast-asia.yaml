hero:
  tagline: Asia Tenggara
  title: Papan Grosir SUP untuk<br />Bisnis Asia Tenggara
  subtitle: Resor pulau, klub pantai, dan toko dayung dari Filipina hingga Bali dan Phuket — papan overstock baru dari 5 unit, model campuran, dikirim dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan overstock SUP untuk resor dan toko dayung di Asia Tenggara
direct_answer: Paddle Board Overstock menyediakan papan tiup overstock baru SUP untuk bisnis di seluruh Asia Tenggara — resor pulau, klub pantai, operator penyewaan, dan pengecer kecil di Filipina, Indonesia, Thailand, Vietnam, Malaysia, dan sekitarnya. Grosir dimulai dari 5 papan dengan model campuran dalam satu pesanan, dikirim dari Weihai, China melalui udara ekspres atau pengiriman laut konsolidasi. Setiap papan telah diuji tekanan 100% dan dilindungi oleh SUP Garansi 2 Tahun.
tldr_points:
  - Grosir model campuran dari 5 papan — dibuat untuk resor dan toko kecil, bukan muatan kontainer
  - Rute barang pendek dari China ke pelabuhan dan bandara Asia Tenggara
  - Papan tinggi yang tahan lama UV dan cocok untuk penggunaan tropis sepanjang tahun
  - 100% teruji tekanan, SUP Garansi 2 Tahun untuk setiap papan
overview_section:
  tagline: Ikhtisar Pasar
  title: Pasar Asia Tenggara SUP
  paragraphs:
    - Southeast Asia is the world's island-hopping playground. From Boracay and El Nido to Bali, Phuket, and Da Nang, millions of tourists take to the water every year — and for many of them, a SUP lesson or hourly rental is their first ocean activity. That creates constant demand from a very specific kind of customer: meja aktivitas resor, operator klub pantai, dan sekolah dayung pulau.
    - Dunia ritel di wilayah ini didominasi oleh bisnis milik sendiri yang melayani wisatawan dan komunitas dayung lokal yang berkembang pesat. Mereka memesan dalam jumlah kecil — 5 hingga 20 papan — dan mereka membutuhkan papan yang bertahan dari UV siklus sewa tropis, air asin, dan harian, bukan prototipe pameran dagang.
  customer_types:
    - title: Resor Pulau & Klub Pantai
      description: Program aktivitas resor menambah SUP daftar mereka, memesan armada campuran yang melayani tamu baru dan tamu yang kembali.
    - title: Operator Sewa & Tur
      description: Operator menjalankan sewa per jam dan tur bakau atau laguna, mengganti papan armada yang aus secara musiman.
    - title: Toko Dayung Lokal
      description: Toko-toko kecil yang melayani komunitas lokal yang berkembang di wilayah ini SUP , mulai dari pendayung akhir pekan hingga SUP kelas yoga.
shipping_section:
  title: Kapal ke Asia Tenggara
  paragraphs:
    - Asia Tenggara adalah salah satu wilayah kargo terdekat kami dari Weihai, China — rute laut pendek dan jalur udara ekspres langsung menjaga waktu transit dan biaya pengiriman tetap ramah. Sampel pakaian pengiriman udara ekspres dan 1–3 pesanan darurat papan; Pengiriman laut konsolidasi adalah pilihan ekonomis untuk pesanan grosir 5–20 papan ke pelabuhan regional utama.
    - Kami menyediakan faktur komersial dan daftar kemasan yang dibutuhkan broker Anda, dengan kode HS yang benar dan nilai yang dideklarasikan. Bea masuk dan pajak sesuai aturan negara Anda dan dibayar oleh importir.
  customs_note: Prosedur bea cukai berbeda-beda di antara anggota AS EAN. Periksa aturan impor perlengkapan olahraga tiup di negara Anda, dan tanyakan dalam permintaan apakah Anda membutuhkan dokumen khusus — kami yang menyiapkannya.
faq_section:
  title: FAQ Asia Tenggara
  items:
    - q: Negara Asia Tenggara mana yang Anda kirim?
      a: Filipina, Indonesia, Thailand, Vietnam, Malaysia, dan lainnya — ditambah panduan negara khusus untuk Filipina, Indonesia, dan Thailand. Konfirmasikan tujuan Anda secara tepat dalam permintaan penawaran Anda.
    - q: Apakah papan ini cocok untuk penggunaan tropis sepanjang tahun?
      a: Ya. Papan ini dibuat dengan drop-stitch PVC konstruksi yang dinilai untuk penggunaan harian dalam kondisi hangat dan tinggi UV — papan yang sama yang kami suplai ke armada sewa di 50+ negara. Perawatan standar (bilas setelah air garam, penyimpanan di tempat teduh) membuatnya tetap aktif selama bertahun-tahun.
    - q: Seperti apa pesanan resor kecil?
      a: 'Biasanya 5–15 papan: dasar dari model all-around yang ramah untuk pemula bagi tamu, ditambah beberapa edisi premium untuk pameran seni, foto, dan penjualan ritel. Model campuran dalam satu pengiriman, harga berdasarkan jumlah total.'
    - q: Seberapa cepat papan bisa sampai ke wilayah Anda?
      a: Asia Tenggara adalah salah satu jalur pengiriman terpendek dari basis kami di Weihai. Pengiriman udara ekspres adalah opsi tercepat untuk sampel dan pesanan kecil; pengiriman laut dihitung per tujuan untuk jumlah grosir. Keduanya dirinci dalam kutipan harga Anda.
