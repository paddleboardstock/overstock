hero:
  tagline: kapasitas produksi
  title: Kapasitas Manufaktur & Output Tahunan
  subtitle: Fasilitas seluas 12.000 m² yang memproduksi 15.000 papan per tahun dengan ruang untuk peningkatan kapasitas
intro: Paddle Board Overstock mengoperasikan salah satu fasilitas manufaktur papan SUP tiup khusus terbesar di Weihai, China. Pabrik kami seluas 12.000 m² terbagi menjadi enam workshop spesialis yang berjalan paralel, memberi kami kapasitas untuk memproduksi 15.000 papan setiap tahun untuk lini all-around, touring, dan art-series SUP.
highlights:
  - value: 12,000 m²
    label: Total lantai manufaktur
    detail: Di 6 bengkel khusus
  - value: 15,000
    label: Papan yang diproduksi setiap tahun
    detail: All-around, touring & art-series SUPs
  - value: 200-300
    label: Tenaga kerja terampil
    detail: 25+ insinyur, 2 shift/hari
  - value: 50+
    label: Negara ekspor
    detail: EU, AS, AU, Timur Tengah, Asia
  - value: 2-3
    label: Hari kerja untuk pengiriman
    detail: Pesanan yang tersedia langsung dikirim dari Weihai
  - value: 10+
    label: Tahun pengalaman ekspor
    detail: Sejak 2012
workshops:
  - title: SUP Produksi Papan
    description: '4 jalur perakitan paralel untuk papan SUP tiup. Setiap jalur dapat memproduksi 50–80 papan per shift. Stasiun cetak digital dan cetak sablon berjalan bersamaan. Kapasitas tahunan SUP: 8.000+ papan.'
    output: 8.000+ SUPs/tahun
  - title: Seni Dek & EVA Penyelesaian
    description: Workshop finishing khusus untuk papan art-series. Pemotongan EVA presisi, pola dek yang ditempel tangan, dan penyelesaian akhir. Kapasitas tahunan mencakup seluruh lini art-series.
    output: Seluruh lini art-series
  - title: Drop-Stitch Laminasi
    description: 'Lini laminasi panas menyatukan inti drop-stitch dengan laminasi luar PVC. Pita sisi disatukan tiga lapis untuk kekuatan kedap udara. Kapasitas tahunan: 15.000+ inti.'
    output: 15.000+ inti/tahun
  - title: Aksesori & Pengemasan
    description: Lini perakitan dan pengepakan aksesori untuk pompa, dayung, tali pengaman, dan kit perbaikan. Papan dikemas vakum, dimasukkan kotak, dan dipaletkan untuk pengiriman ke seluruh dunia.
    output: Paket lengkap, siap dikirim
