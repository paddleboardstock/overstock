workshops:
  - title: SUP Produksi Papan
    description: '4 jalur perakitan paralel untuk papan SUP tiup. Setiap jalur dapat memproduksi 50–80 papan per shift. Stasiun cetak digital dan cetak sablon berjalan bersamaan. Kapasitas tahunan SUP: 8.000+ papan.'
    output: 8.000+ SUPs/tahun
  - title: RIB Produksi Perahu
    description: 'Bengkel lambung fiberglass khusus dengan 6 stasiun cetakan untuk lambung RIB hingga 7,6 m. Area pengelasan dan perakitan tabung menangani 3–5 RIBs secara bersamaan. Kapasitas tahunan RIB: 2.000+ perahu.'
    output: 2.000+ RIBs/tahun
  - title: Perahu Tiup & Dinghy
    description: 'Jalur produksi serbaguna untuk perahu tiup, kayak, dan perahu dinghy. Stasiun pengelasan udara panas, press dielektrik RF, dan stasiun perakitan dikonfigurasi ulang berdasarkan campuran pesanan. Kapasitas tahunan: 5.000+ unit.'
    output: 5.000+ unit/tahun
  - title: Peralatan Keamanan
    description: 'Area produksi bersih terpisah untuk rompi pelampung dan peralatan keselamatan. Stasiun menjahit, penyisipan busa, dan pengujian khusus. Kapasitas tahunan rompi pelampung: 50.000+ unit.'
    output: 50.000+ rompi pelampung/tahun
oem_capacity:
  moq: 'SUP: 5–10 unit | RIB: 2–5 unit | Kayak/Dinghy: 10–20 unit | Cetakan khusus: 200+ unit'
  lead_time: Standar 30–45 hari. Sampel 15–20 hari. Layanan cepat tersedia.
  payment: T/T 30% deposit + 70% sebelum pengiriman. L/C, Western Union diterima.
