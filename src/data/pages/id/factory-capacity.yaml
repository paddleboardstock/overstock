hero:
  tagline: kapasitas produksi
  title: Kapasitas Manufaktur & Output Tahunan
  subtitle: Fasilitas 12.000 m² menghasilkan 15.000 perahu per tahun dengan ruang untuk ekspansi
intro: Paddle Board Overstock mengoperasikan salah satu fasilitas manufaktur perahu karet tiup terbesar di Qingdao, China. Pabrik kami seluas 12.000 m² dibagi menjadi enam bengkel khusus yang beroperasi secara paralel, memberi kami kapasitas untuk memproduksi 15.000 perahu setiap tahun di lini SUP, kayak, perahu karet dinghy, RIB, dan peralatan keselamatan.
