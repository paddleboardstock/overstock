testimonial:
  quote: Saya memeriksa log uji tekanan yang disertakan dengan papan saya dan mengirim email ke dukungan dengan dua pertanyaan tentang pengisian udara di panasnya musim panas. Mereka menjawab dengan angka nyata di hari yang sama. Itu lebih dari yang pernah dilakukan toko manapun untuk saya.
  author: Sofia Marchetti
  title: Pembeli yang diverifikasi
  company: Penyelam pesisir
  location: Italia
content_overpressure:
  tagline: Keselamatan Tekanan
  title: Tekanan Papan<br />Manajemen di Iklim Panas
  subtitle: Tekanan papan tiup meningkat seiring suhu. Memahami dan mengelola tekanan berlebih melindungi papan Anda dan menjaga setiap sesi tetap aman.
  items:
    - title: Mengapa Tekanan Naik
      description: Udara mengembang dengan panas. Papan yang diisi hingga 15 PSI pada 20°C dapat naik 1-2 PSI di bawah sinar matahari 40°C — fisika yang sama membuat papan yang dingin di pagi hari terasa keras seperti batu saat siang.
      icon: tabler:gauge
    - title: Tekanan Operasional yang Dianjurkan
      description: Isi hingga 12-15 PSI, seperti tercetak di dekat katup. Rentang yang ditentukan menyeimbangkan kekakuan, keselamatan, dan umur sambungan — lebih tinggi tidak selalu lebih baik.
      icon: tabler:chart-bar
    - title: Praktik Terbaik untuk Iklim Panas
      description: Isi ke ujung bawah rentang pada hari panas. Lepaskan sedikit udara sebelum paparan matahari yang lama dan jangan pernah meninggalkan papan yang sepenuhnya diisi udara di pantai.
      icon: tabler:sun
    - title: Paparan Matahari & Penyimpanan
      description: Simpan papan di tempat teduh dan sebagian dikempeskan saat tidak digunakan. Gunakan tas papan untuk perlindungan UV. Bilas dan keringkan sebelum digulung untuk penyimpanan.
      icon: tabler:umbrella
    - title: Jika Papan Terasa Keras seperti Batu
      description: Lepaskan udara melalui katup sampai papan kembali ke rentang yang tertera. Bawa pengukur tekanan pada pompa Anda untuk membaca yang akurat — papan yang terlalu diisi dapat menekan sambungan secara berlebihan.
      icon: tabler:alert-circle
