hero:
  tagline: Keamanan
  title: Standar dan Sertifikasi Keselamatan
  subtitle: Setiap produk Aquafarer menjalani pengujian yang ketat, dan 64 model bersertifikasi CE memenuhi standar keselamatan internasional untuk penggunaan rekreasi dan profesional. Pabrik bersertifikasi ISO 9001.
