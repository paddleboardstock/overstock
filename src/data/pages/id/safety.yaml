certifications:
  - title: CE Sertifikasi (EU 2016/425)
    standard: Peraturan PPE (EU) 2016/425 | EN ISO 12402
    description: Semua peralatan keselamatan Aquafarer mematuhi persyaratan penandaan CE berdasarkan Peraturan Peralatan Pelindung Diri Eropa. Setiap produk diuji secara independen oleh TÜV Rheinland, sebuah Badan Notifikasi Eropa. Perahu karet kami dan RIBs memenuhi persyaratan Kategori C dan D dari Direksi Kapal Rekreasi 2013/53/EU (RCD).
    body: CE sertifikasi mencakup persyaratan kesehatan dan keselamatan penting untuk alat pelampung pribadi dan perahu karet. TÜV Rheinland mengaudit fasilitas produksi kami setiap tahun untuk memastikan kepatuhan yang berkelanjutan.
  - title: SOLAS — Keselamatan Jiwa di Laut
    standard: SOLAS Bab III | Kode LSA
    description: Life Vest Pro mematuhi peraturan SOLAS untuk operasi maritim lepas pantai dan komersial. Diuji untuk mempertahankan daya apung selama 24 jam, penginflasian otomatis saat tenggelam, dan performa di kondisi laut hingga Force 5. Memenuhi persyaratan Bab III untuk pelampung di kapal komersial.
    body: SOLAS persetujuan memerlukan pengujian independen oleh badan notifikasi untuk daya apung, kekuatan, visibilitas, dan aktivasi otomatis. Life Vest Pro kami membawa persetujuan tipe penuh SOLAS dengan sertifikasi MED.
  - title: USCG Tipe III / Tipe V
    standard: 46 CFR Bagian 160 | USCG Persetujuan
    description: Beberapa pelampung Aquafarer memenuhi klasifikasi Penjaga Pantai Amerika Serikat untuk perangkat Tipe III (bantuan apung) dan Tipe V (penggunaan khusus). Cocok untuk perairan terlindung, berlayar di pesisir, dan operasi komersial yang memerlukan PFD bersertifikasi USCG.
    body: USCG persetujuan memerlukan pengujian oleh laboratorium independen yang diakui CG. Persetujuan Tipe V mencakup desain hibrida yang dapat diaktifkan secara manual atau otomatis.
  - title: BSCI Kepatuhan Sosial
    standard: amfori BSCI Kode Etik
    description: Pabrik kami diaudit setiap tahun di bawah Inisiatif Kepatuhan Sosial Bisnis amfori (BSCI). Ini memverifikasi praktik tenaga kerja yang etis, keselamatan kerja, jam kerja yang adil, dan manajemen lingkungan di seluruh fasilitas produksi seluas 12.000 m².
    body: BSCI kepatuhan adalah prasyarat bagi pengecer dan importir Eropa. Peringkat BSCI kami saat ini adalah "C" (Baik), diaudit oleh SGS.
  - title: REACH & RoHS Kepatuhan
    standard: Peraturan UE REACH (EC) 1907/2006 |RoHS Direktif 2011/65/UE
    description: Semua PVC senyawa, perekat, dan pelapis yang digunakan dalam Aquafarer produk mematuhi REACH peraturan keselamatan kimia UE dan RoHS pembatasan zat berbahaya. Lembar data keselamatan material (MSDS) tersedia untuk setiap lini produk.
    body: REACH kepatuhan memastikan tidak ada zat SVHC yang dibatasi melebihi batas ambang. Pengujian laboratorium pihak ketiga secara rutin memverifikasi kepatuhan yang berkelanjutan untuk setiap batch produksi.
  - title: ISO 9001:2015 Manajemen Mutu
    standard: ISO 9001:2015 |TÜV Bersertifikat Rheinland
    description: Sistem manajemen mutu kami telah ISO bersertifikat 9001:2015 oleh TÜV Rheinland, mencakup desain, produksi, pengujian, dan layanan purna jual. Audit pengawasan tahunan memastikan perbaikan berkelanjutan dan kontrol proses.
    body: ISO Sertifikasi 9001 memerlukan kebijakan kualitas yang terdokumentasi, audit internal, tinjauan manajemen, prosedur tindakan korektif, dan catatan produksi yang dapat dilacak.
testimonial:
  quote: Kami telah mendapatkan peralatan keselamatan dari berbagai pemasok di seluruh Asia.Aquafarer adalah satu-satunya produsen yang memberikan CE dokumentasi lengkap, SOLAS sertifikat, dan laporan uji pihak ketiga secara langsung — tanpa diminta.
  author: Erik Lindström
  title: petugas keselamatan
  company: Pasokan Laut Baltik
  location: Finlandia
content_overpressure:
  tagline: Keamanan Tekanan Tinggi
  title: RIB Tekanan Tabung<br />Manajemen di Iklim Panas
  subtitle: Tekanan tabung tiup meningkat seiring suhu. Memahami dan mengelola tekanan berlebih mencegah kerusakan dan memastikan operasi yang aman di lingkungan tropis dan gurun.
  items:
    - title: Katup Pelepas Tekanan Boyle
      description: Aquafarer RIB Tabung dilengkapi dengan katup pelepas tekanan berlebih yang secara otomatis melepaskan tekanan berlebih di atas batas maksimum yang ditentukan. Mencegah tekanan sambungan dan potensi pecahnya tabung akibat pemanasan matahari.
      icon: tabler:gauge
    - title: Perubahan Tekanan Pagi ke Siang
      description: Tabung yang dipompa hingga 3,5 PSI pada 20C dapat mencapai 4,5+ PSI pada paparan sinar matahari 40C. Selalu inflasi hingga batas bawah rentang yang direkomendasikan di iklim panas dan biarkan katup pelepas mengelola tekanan berlebih.
      icon: tabler:sun
    - title: Tekanan Operasi yang Direkomendasikan
      description: 'PVC Tabung: 3.0-3.5 operasi, PSI 4.5 PSI maksimal Hypalon tabung: 3.5-4.0 PSI operasi, PSI 5.0 maks. Selalu uji pada rating 1.25x (4.4 PSI untuk PVC, 5.0 PSI untuk Hypalon) sesuai Aquafarer standar QC.'
      icon: tabler:chart-bar
    - title: Praktik Terbaik Paparan Matahari
      description: Simpan RIBs di area teduh saat tidak digunakan. Gunakan UVpenutup pelindung untuk jangkar yang lama. Periksa dan sesuaikan tekanan tabung sebelum dan setelah jam puncak matahari. Jangan pernah melebihi tekanan maksimum yang terukur.
      icon: tabler:umbrella
    - title: Depresurisasi Darurat
      description: Jika tabung terasa terlalu keras atau katup pelepas sedang berventilasi, lepaskan udara melalui katup Halkey-Roberts atau militer hingga tekanan kembali ke jangkauan operasi. Bawa pengukur tekanan untuk pembacaan yang akurat.
      icon: tabler:alert-circle
