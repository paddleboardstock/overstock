process_section:
  eyebrow: Proses Kami
  title: Alur Kerja OEM/ODM End-to-End
  subtitle: Dari brief desain hingga pemuatan kontainer — enam langkah menuju perahu air tiup label pribadi Anda.
  steps:
    - step: '01'
      title: Spesifikasi & Brief Desain
      desc: Bagikan spesifikasi target, gambar CAD, atau produk referensi Anda. Tim teknik kami meninjau bahan, dimensi, dan persyaratan kepatuhan (CE, BSCI) sebelum memberikan penawaran.
    - step: '02'
      title: Prototipe Cetakan 3D
      desc: Kami merancang dan memproduksi mesin cetakan kustom untuk papan SUP, hull kayak, dan komponen RIB. Sampel prototipe diproduksi dalam 15–20 hari kerja untuk persetujuan Anda.
    - step: '03'
      title: Pemilihan Bahan & Produksi Sampel
      desc: Pilih dari bahan kelas militer PVC (0,9mm–1,2mm), Hypalon CSM, atau kain inti drop-stitch. Kami memproduksi sampel pra-produksi dengan warna merek, logo, dan kemasan Anda untuk disetujui.
    - step: '04'
      title: Audit Pabrik & Kepatuhan CE
      desc: Setiap pesanan OEM mencakup dokumentasi kepatuhan — deklarasi kesesuaian CE, catatan jejak 9001 ISO, laporan kepatuhan sosial BSCI, dan deklarasi bahan REACH.
    - step: '05'
      title: Produksi Massal & QC Inline
      desc: Produksi mengikuti daftar periksa kualitas 100 poin kami. Setiap unit menjalani uji tahan tekanan 24 jam, uji kelayakan jahitan, dan inspeksi visual sebelum dikemas.
    - step: '06'
      title: Logistik & Pengiriman FOB Qingdao
      desc: Barang jadi dipalletisasi, dibungkus shrink-wrap, dan dimuat ke dalam kontainer di pelabuhan Qingdao. Kami menangani semua dokumen ekspor, pabean, dan menyediakan pelacakan pengiriman secara real-time.
capabilities_section:
  eyebrow: Kemampuan Manufaktur
  title: Apa yang Kami Bangun
  subtitle: Enam kemampuan produksi inti untuk mitra global B2B.
  items:
    - title: Drop-Stitch SUP Pembuatan Papan
      desc: Laminasi inti drop-stitch sepanjang penuh untuk papan dayung yang kaku dan bertekanan tinggi (15–20 PSI). Panjang, lebar, ketebalan, profil rocker, dan desain grafis kustom.
    - title: PVC Produksi Perahu Inflatable
      desc: Perahu karet PVC yang dilas frekuensi tinggi, perahu tender, dan perahu olahraga. Berbagai konfigurasi ruang, opsi lantai (slat, dek udara, gulung), dan integrasi aksesori.
    - title: Hypalon RIB Fabrikasi Perahu
      desc: Tabung Hypalon CSM kelas komersial yang direkatkan ke lambung fiberglass atau aluminium deep-V. Panjang 3,3 m hingga 6,0 m untuk patroli, penyelamatan, tur, dan operasi menyelam.
    - title: Label Pribadi & Branding Kustom
      desc: 'Layanan label pribadi penuh: logo kustom dengan transfer panas atau sablon, kemasan bermerek (kotak ritel, tas jinjing), manual pengguna dalam bahasa Anda, dan pendaftaran barcode/UPC.'
    - title: Desain Cetakan & Alat Kustom
      desc: Tim rekayasa 3D CAD/CAM internal. Kami merancang dan membuat cetakan aluminium dan komposit kustom untuk bentuk lambung unik, konfigurasi dek, dan titik pemasangan aksesori.
    - title: OEM Aksesori & Kitting
      desc: Rompi pelampung (CE 12402), pompa aksi ganda, dayung karbon/nylon, kit perbaikan, tas jinjing, dan rakitan leash. Kitting penuh dan kemasan bundel siap ritel.
experience_section:
  eyebrow: Pengalaman Dunia Nyata
  title: Kemitraan yang Membangun Merek
  subtitle: Cerita nyata dari merek dan organisasi yang bermitra dengan Paddle Board Overstock untuk manufaktur OEM/ODM.
  stories:
    - quote: Kami datang ke Paddle Board Overstock dengan sketsa di serbet dan daftar persyaratan. Delapan bulan kemudian, kami memiliki produk siap produksi yang lolos sertifikasi CE pada percobaan pertama.
      narrative: Startup Eropa dengan desain SUP baru mendekati Paddle Board Overstock untuk manufaktur ODM. Tim R&D Paddle Board Overstock membawa konsep melalui desain CAD, analisis struktural FEA, simulasi hidrodinamika, pembuatan cetakan, fabrikasi prototipe, dan alat produksi. Pendiri startup mengunjungi Qingdao tiga kali selama proses tersebut. Produk akhir lolos sertifikasi CE tanpa modifikasi — hasil yang pendiri atribusikan pada tim rekayasa Paddle Board Overstock yang memahami persyaratan regulasi Eropa sejak awal.
      context: Peluncuran merek SUP Eropa, 2023-2024
      source: Brand Founder
    - quote: Tingkat perlindungan NDA dan keamanan IP di Paddle Board Overstock memberi kami kepercayaan untuk membagikan desain eksklusif kami. Mereka memperlakukan IP kami seolah milik mereka sendiri.
      narrative: Perusahaan peralatan laut berbasis AS dengan teknologi katup eksklusif membutuhkan mitra manufaktur yang bisa melindungi IP mereka sambil memproduksi dalam skala besar. Setelah memeriksa lima produsen China, mereka memilih Paddle Board Overstock berdasarkan protokol perlindungan IP pabrik, penanganan file desain yang aman, dan kesediaan menandatangani NDA ketat. Kemitraan ini menghasilkan tiga lini produk selama empat tahun tanpa insiden IP.
      context: Perusahaan peralatan laut AS, kemitraan OEM sejak 2021
      source: Wakil Presiden Operasional
