hero:
  tagline: Amerika Latin
  title: Papan Grosir SUP untuk<br />Pengecer Amerika Latin
  subtitle: Papan dayung overstock baru untuk toko pantai, armada sewa, dan penjual online di seluruh Amerika Latin — mulai dari 5 papan, model campuran, ekspres, atau pengiriman laut.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan overstock SUP untuk pengecer paddleboard Amerika Latin
direct_answer: Paddle Board Overstock menyediakan papan tiup overstock baru SUP untuk pengecer kecil di seluruh Amerika Latin — dari Meksiko dan Brasil hingga Kolombia, Peru, Chili, dan Argentina. Pesanan grosir dimulai dari 5 papan dengan model campuran dipersilakan, dan setiap pesanan dikirim dari Weihai, China melalui pengiriman udara ekspres atau pengiriman laut konsolidasi. Papan telah diuji tekanan 100% dan tercakup oleh SUP Garansi 2 Tahun.
tldr_points:
  - Grosir dari 5 papan — model campuran dalam satu pesanan, dihargai berdasarkan jumlah total
  - Pengiriman udara ekspres atau pengiriman laut konsolidasi dari Weihai, Tiongkok
  - Pasar berbahasa Spanyol dan Portugis dilayani di seluruh wilayah
  - 100% teruji tekanan, SUP Garansi 2 Tahun untuk setiap papan
overview_section:
  tagline: Ikhtisar Pasar
  title: Pasar Amerika Latin SUP
  paragraphs:
    - Amerika Latin adalah salah satu pasar stand-up paddle dengan pertumbuhan tercepat di dunia. Garis pantai panjang di dua lautan, ekonomi pariwisata pantai yang mapan, dan budaya olahraga papan yang kuat memberikan para pengecer independen dari Tulum hingga Florianópolis basis pelanggan yang terus berkembang — turis yang mengikuti pelajaran pertama mereka, pendayung akhir pekan, dan SUP komunitas balap serta selancar lokal yang sedang berkembang.
    - The retail landscape is dominated by small and mid-sized independent shops: Sekolah dayung tepi pantai yang menjual apa yang mereka sewa, toko selancar yang menambah SUP garis, dan penjual online yang mengimpor langsung untuk pertama kalinya. Bisnis ini jarang membutuhkan kontainer penuh satu model — mereka membutuhkan 5–20 papan per pesanan, dicampur antara model serba guna yang ramah pemula dan beberapa edisi premium.
  customer_types:
    - title: Pengecer Beach Town
      description: Toko-toko di kota resor yang melayani wisatawan — mereka membutuhkan papan pemula yang tahan lama dalam jumlah besar serta beberapa model premium untuk dipajang dan dijual.
    - title: Sekolah Dayung & Armada Sewa
      description: Sekolah yang menggabungkan pelajaran dengan ritel dan armada sewa menyegarkan papan setiap musim dengan pesanan model campuran.
    - title: Penjual Online
      description: Penjual e-commerce berbahasa Spanyol dan Portugis memperkenalkan SUP kategori ini ke pasar nasional mereka tanpa risiko skala kontainer.
shipping_section:
  title: Kapal ke Amerika Latin
  paragraphs:
    - Pesanan dikirim dari basis logistik kami di Weihai, Tiongkok. Sampel pakaian pengiriman udara ekspres, 1–3 pesanan papan, dan restock mendesak; Pengiriman laut konsolidasi adalah rute ekonomis untuk pesanan grosir 5–20 papan ke pelabuhan utama di seluruh wilayah.
    - Kami menyediakan dokumen ekspor yang lengkap dan akurat — faktur komersial dan daftar pengemasan — untuk menjaga proses bea cukai tetap lancar. Bea masuk dan pajak ditetapkan oleh negara Anda dan dibayar oleh importir; kami tidak pernah menggabungkan janji "termasuk pajak" yang samar ke dalam penawaran pengiriman.
  customs_note: Aturan impor dan tarif bea bervariasi secara signifikan di berbagai negara Amerika Latin. Periksa rezim impor saat ini di negara Anda untuk peralatan olahraga air tiup sebelum memesan, dan tanyakan dokumen tambahan yang dibutuhkan broker Anda.
faq_section:
  title: FAQ Amerika Latin
  items:
    - q: Bisakah saya mendapatkan penawaran dalam bahasa Spanyol atau Portugis?
      a: Tim kami bekerja dengan pembeli di seluruh Amerika Latin dan dapat menangani penawaran serta konfirmasi pesanan untuk pelanggan berbahasa Spanyol dan Portugis. Tanyakan dalam pertanyaan Anda.
    - q: Apakah Anda mengirim ke negara saya di Amerika Latin?
      a: Kami mengirim ke seluruh wilayah — Meksiko, Brasil, Kolombia, Peru, Chili, Argentina, Ekuador, dan lainnya. Konfirmasi tujuan Anda secara tepat dalam permintaan penawaran dan kami akan memverifikasi layanan pengiriman saat ini.
    - q: Berapa minimum grosir untuk pengecer Amerika Latin?
      a: Lima papan total, bisa mencampur model yang tersedia di stok. Total ini menentukan tingkat harga Anda — Anda dapat menggabungkan edisi all-around, touring, dan seni dalam satu pengiriman.
    - q: Siapa yang membayar bea masuk di negara saya?
      a: Anda, sebagai importir, sesuai aturan negara Anda. Kami menyediakan dokumen yang benar dan lengkap (faktur komersial, daftar kemasan) sehingga proses bea cukai dapat diprediksi — lihat halaman pengiriman internasional kami untuk informasi lengkap.
cta:
