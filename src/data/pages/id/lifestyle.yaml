hero:
  tagline: Gaya hidup
  title: The Paddle Board Overstock<br />Gaya hidup
  subtitle: Dibuat untuk mereka yang hidup di atas air — dari penjelajah akhir pekan hingga operator komersial yang mengandalkan perlengkapan mereka setiap hari.
values:
  - icon: 🌊
    title: Lahir di Air
    desc: Setiap desain dimulai dengan memahami bagaimana air berperilaku. Kami merancang dari batas kondisi ke dalam — karena laut adalah guru kami, bukan tempat kerja kami.
  - icon: 🔧
    title: Dibuat untuk Bertahan
    desc: Produk yang paling berkelanjutan adalah yang tidak perlu diganti. Bahan kelas laut, inti drop-stitch yang dinilai hingga 15 PSI, dan jahitan yang lebih tahan lama dari musimnya.
  - icon: 🏆
    title: Dapat Diakses Berdasarkan Desain
    desc: Olahraga air seharusnya bukanlah sebuah kemewahan. Performa tingkat profesional dengan harga yang masuk akal untuk keluarga, pemandu, dan operator kecil — bukan hanya armada komersial.
  - icon: 🌍
    title: Komunitas Global
    desc: 'Dari pantai Qingdao hingga danau-danau di Eropa, sungai-sungai di Asia Tenggara, dan teluk di Amerika — para pelanggan kami memiliki satu kesamaan: cinta untuk berada di atas air.'
  - icon: ♻️
    title: Manufaktur yang Bertanggung Jawab
    desc: CNC-optimasi penempatan memotong limbah material di bawah 5%. Konstruksi yang tahan lama mengurangi siklus penggantian. Kami membangun untuk umur panjang karena itu adalah pilihan yang paling berkelanjutan.
  - icon: 🤝
    title: Dukungan yang Tahan Lama
    desc: Lambung berusia dua puluh tahun masih menghubungi kami untuk suku cadang. Rata-rata respons garansi kami adalah 24 jam. Kami tidak menghilang setelah penjualan — kami ada untuk sepanjang usia produk.
