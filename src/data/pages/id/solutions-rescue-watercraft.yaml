content_challenge:
  tagline: Tantangan
  title: Operasi Penyelamatan Memerlukan<br />Keandalan Tanpa Tawar-menawar
  subtitle: Organisasi pencarian dan penyelamatan beroperasi dengan tanggung jawab keselamatan yang ekstrem — setiap kegagalan kapal membawa konsekuensi yang tidak dapat diterima.
  paragraphs:
    - Dalam operasi penyelamatan, selisih antara keberhasilan dan kegagalan diukur dalam menit. Kapal harus siap diluncurkan segera, beroperasi dalam kondisi berat, dan kembali dengan aman bersama penumpang. Tanggung jawab keselamatan adalah mutlak — kegagalan mekanis selama misi penyelamatan bukan biaya perbaikan, melainkan nyawa yang hilang.
    - Kapal SAR membutuhkan kecepatan tinggi untuk mencapai korban dengan cepat, yang dikombinasikan dengan stabilitas luar biasa untuk operasi pemulihan yang aman. Mereka harus membawa peralatan penyelamat, persediaan medis, dan peralatan komunikasi — sering kali di ruang dek yang terbatas. Kapal yang beroperasi dalam layanan pemerintah juga memerlukan umur layanan panjang (10-15+ tahun) untuk membenarkan anggaran pengadaan publik.
    - Visibilitas, baik untuk operator maupun untuk pencarian, sangat penting. Desain konsol harus menyediakan visibilitas 360 derajat, dan kapal harus sangat terlihat oleh pesawat dan kapal lainnya.
    - Aquafarer kapal penyelamat RIBs dirancang dari dasar hingga untuk persyaratan ini — dengan dek pembuangan otomatis, lambung yang diperkuat, suite navigasi, dan tiang tarik standar pada model patroli.
content_solution:
  tagline: Solusi Kami
  title: Kapal Penyelamat Khusus
  subtitle: Setiap Aquafarer kapal penyelamat dirancang untuk memenuhi atau melampaui SOLAS dan standar SAR nasional.
  list:
    - Dek pembuangan otomatis — air mengalir secara otomatis untuk stabilitas selama operasi pemulihan
    - Lambung V dalam yang diperkuat — kemampuan air bergelombang dengan penanganan yang dapat diprediksi pada kecepatan tinggi
    - Suite lengkap lampu navigasi — operasional siang dan malam dalam semua kondisi cuaca
    - Tiang tarik dan tali tarik — siap untuk menarik kapal atau operasi kereta penyelamat
    - Pelat pemasangan peralatan — radio, lampu sorot, sirene, dan peralatan medis
    - Konfigurasi mesin ganda — redundansi mesin tempel tunggal atau mesin ganda
    - Warna tabung visibilitas tinggi — oranye, kuning, atau merah untuk visibilitas maksimal
content_segments:
  tagline: Profil Penyelamatan
  title: Solusi Kapal Air Pencarian & Penyelamatan<br />Berdasarkan Jenis Organisasi
  subtitle: Berbagai organisasi penyelamatan beroperasi di bawah mandat, siklus anggaran, dan lingkungan operasi yang berbeda — mulai dari kru sukarelawan pesisir hingga armada penjaga pantai nasional. Kami mengonfigurasi setiap penyelamatan RIB agar sesuai dengan profil misi.
  items:
    - title: Badan SAR Penjaga Pantai & Pemerintah
      subtitle: Tanggung jawab keselamatan mutlak — standar armada yang kritis untuk misi
      description: Lembaga SAR pemerintah memikul tanggung jawab keselamatan tertinggi dalam operasi maritim. Setiap kapal harus beroperasi dengan sempurna dalam kondisi ekstrem — kegagalan peralatan selama misi penyelamatan bukanlah pilihan. Keputusan pengadaan didorong oleh total biaya kepemilikan selama masa pakai 10-15 tahun, bukan harga awal. Lembaga membutuhkan kapal yang bertahan bertahun-tahun patroli pesisir, memenuhi standar nasional yang ketat, dan memberikan kinerja konsisten di seluruh stasiun tersebar. Dokumentasi kepatuhan yang komprehensif dan perjanjian layanan multi-tahun wajib.
      features:
        - dan SOLAS paket dokumentasi kepatuhan standar SAR nasional
        - Kesamaan suku cadang di seluruh armada — mengurangi kompleksitas inventaris tingkat stasiun
        - Konfigurasi mesin ganda untuk redundansi misi kritis
        - Desain masa pakai 10-15 tahun dengan program pemeliharaan terjadwal
        - Kemampuan segala cuaca — lambung deep-V yang diperkuat untuk kondisi laut yang kasar
    - title: Layanan Penjaga Pantai & Penyelamatan Pantai
      subtitle: Peluncuran cepat, operasi perairan dangkal
      description: Layanan penjaga pantai kota dan pantai membutuhkan kapal respons cepat yang dapat meluncur melalui zona ombak, beroperasi di perairan dangkal di pesisir, dan mencapai perenang atau kapal yang mengalami masalah dalam hitungan menit. Peralatan harus cukup ringan untuk ditarik pantai dengan kendaraan kecil atau manual.
      features:
        - Lambung dengan draft dangkal RIB untuk operasi zona ombak dan pesisir.
        - Mampu diluncurkan di pantai dengan pegangan pengangkat haluan dan pelindung lunas
        - Kereta luncur penyelamatan terintegrasi atau platform perenang penyelamat
        - Warna tabung oranye atau kuning visibilitas tinggi standar
    - title: Departemen Penyelamatan Pemadam Kebakaran
      subtitle: Integrasi pompa kebakaran, pemasangan peralatan, respons cepat
      description: Unit penyelamat pemadam kebakaran laut merespons kebakaran struktur tepi air, kebakaran kapal, dan insiden penyelamatan berbasis air. Perahu ini harus membawa pompa kebakaran, monitor, penyimpanan selang, dan alat pernapasan — semuanya terintegrasi dalam platform respons cepat yang stabil. Departemen juga menggunakan kapal-kapal ini untuk respons banjir dan operasi bantuan timbal balik. Tata letak konsol harus mengakomodasi kontrol pompa, sistem radio, dan pencahayaan darurat tanpa mengorbankan ruang dek untuk pergerakan kru.
      features:
        - Monitor api yang dipasang di haluan dengan paket integrasi pompa
        - Pemasangan peralatan khusus untuk pompa kebakaran, penyimpanan selang, dan set BA
        - Tata letak konsol dapat dikonfigurasi untuk kontrol pompa, radio, dan pencahayaan darurat
        - Dek self-bailing untuk pemadam kebakaran dan kestabilan air limpasan
        - 'Paket operasi malam: lampu sorot, pencahayaan adegan, bar lampu biru/merah'
    - title: Polisi Laut & Keamanan Pelabuhan
      subtitle: Interdiksi, patroli, operasi boarding
      description: Unit penegak hukum Marinir membutuhkan kapal yang mampu melakukan pengejaran berkecepatan tinggi, menaiki kapal yang dicurigai, dan patroli keamanan pelabuhan. Kapal-kapal ini harus memiliki penyimpanan aman untuk peralatan penegakan dan senjata, integrasi komunikasi dengan komando darat, serta ruang dek yang cukup untuk operasi tim boarding. Kemampuan operasi malam dan pendekatan profil rendah sangat penting untuk misi interdiksi.
      features:
        - Kemampuan pengejaran kecepatan tinggi — lambung planeing dengan+ kecepatan maksimum 40 knot
        - Ruang penyimpanan senjata dan perlengkapan penegakan yang aman
        - Integrasi konsol untuk radio polisi, MDT, dan sistem komunikasi
        - 'Paket operasi malam: lampu sorot IR, dudukan FLIR, pencahayaan tersembunyi'
        - Platform naik yang diperkuat dengan permukaan anti selip
        - Sistem pencahayaan darurat dan sirene biru/merah
    - title: Organisasi SAR & Nirlaba Relawan
      subtitle: Operasi pesisir dan danau berbasis komunitas yang didanai hibah
      description: Kelompok penyelamatan berbasis komunitas beroperasi di danau, sungai, dan daerah pesisir di mana cakupan SAR pemerintah terbatas. Seringkali didanai oleh donasi atau hibah pemerintah, organisasi-organisasi ini membutuhkan kemampuan maksimum per dolar — kapal yang andal dan perawatan rendah yang dapat dioperasikan dengan aman oleh relawan dengan pelatihan khusus minimal. Siklus pengadaan hibah berarti kapal harus memenuhi persyaratan kepatuhan sambil tetap dalam anggaran tetap.
      features:
        - Konfigurasi tempel tunggal yang dioptimalkan untuk biaya akuisisi dan operasional yang lebih rendah
        - PVC konstruksi untuk perawatan lebih rendah dan perbaikan lapangan yang mudah
        - Konsol multifungsi meminimalkan kompleksitas elektronik bagi operator relawan
        - Paket dokumentasi kepatuhan hibah untuk aplikasi pendanaan
        - Desain ringan untuk peluncuran pantai tanpa trailer atau derek khusus
    - title: Penyelamatan Banjir & Respons Bencana
      subtitle: Banjir di pedalaman, air dangkal, lingkungan penuh puing
      description: Penyelamatan banjir adalah profil operasional yang khas — kapal beroperasi di daerah perkotaan yang tergenang air, arus penuh puing, dan air sangat dangkal di mana rintangan yang terendam tidak terlihat. Operator membutuhkan kapal yang dapat menavigasi jalan yang tergenang air, mendorong puing, dan mengeluarkan korban dari bangunan dan kendaraan. Kemampuan draft dangkal sangat penting, begitu juga kemampuan beroperasi di arus dengan bahaya stang. Perahu ini sering dikerahkan oleh departemen pemadam kebakaran, pertahanan sipil, dan LSM bantuan bencana.
      features:
        - Lambung dengan draft sangat dangkal — beroperasi di kedalaman 30-50 cm
        - Perlindungan busur dan tabung penguat untuk membelokkan puing untuk rintangan yang terendam
        - Dek self-bailing untuk limpasan banjir dan pemulihan korban
        - Tabung oranye atau kuning dengan visibilitas tinggi untuk pengintaian udara
        - Desain ringan untuk transportasi helikopter dan penempatan jalan
        - Titik angkat yang diperkuat untuk operasi penyelamatan dengan hoist dan tali
