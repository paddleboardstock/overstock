faq_section:
  title: FAQ Grosir
  items:
    - q: Berapa pesanan minimum untuk grosir?
      a: Lima papan. Model stok berlebih kami dibuat untuk pengecer kecil — Anda tidak perlu mengisi kontainer untuk mendapatkan harga grosir.
    - q: Apakah saya bisa mencampur model SUP berbeda dalam satu pesanan grosir?
      a: Ya. Pesanan model campuran adalah salah satu keuntungan terbesar membeli stok berlebih — gabungkan model apa pun yang tersedia dalam satu pengiriman, dan jumlah total papan menentukan tingkat harga Anda. Lihat halaman grosir model campuran kami untuk detailnya.
    - q: Apakah papan itu benar-benar baru?
      a: Ya. Setiap papan adalah persediaan baru, belum pernah digunakan — bukan barang cacat, rekondisi, atau pengembalian pelanggan. Setiap papan 100% diuji tekanan sebelum dikirim.
    - q: Seberapa lebih murah grosir dibandingkan eceran?
      a: Harga satuan grosir dikutip per pesanan berdasarkan model dan jumlah, dan secara signifikan lebih rendah daripada harga eceran yang tercantum di atas. Minta penawaran untuk campuran target Anda dan kami akan menetapkannya dengan tepat.
    - q: Metode pengiriman mana yang harus saya pilih?
      a: Pengiriman udara ekspres cocok untuk 1–3 papan, sampel, dan pengisian ulang yang mendesak. Pengiriman laut gabungan adalah pilihan ekonomis untuk pesanan pengecer 5–20 papan. Kami memberikan penawaran untuk kedua opsi tersebut dengan setiap pertanyaan.
    - q: Garansi apa yang dimiliki papan grosir?
      a: Garansi 2 Tahun SUP yang sama yang kami berikan kepada setiap pelanggan, di setiap dari 50+ negara tempat kami mengirim.
    - q: Apakah Anda mengirim ke negara saya?
      a: Saat ini kami mengirim ke lebih dari 50 negara, dengan panduan regional untuk Amerika Latin, Asia Tenggara, Afrika, Timur Tengah, dan pasar utama termasuk Meksiko, Brasil, Filipina, Indonesia, Thailand, Afrika Selatan, Kenya, dan UAE. Tanyakan dalam permintaan kutipan Anda dan kami akan mengonfirmasi layanan saat ini ke alamat Anda.
