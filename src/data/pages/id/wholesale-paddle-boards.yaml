      description: Pengecer kecil di pesisir yang membutuhkan 5–15 papan per musim, campuran antara model serbaguna untuk turis dan papan gaya selancar untuk penduduk lokal.
    - title: Penjual Online
      description: Toko e-commerce dan penjual marketplace menguji kategori SUP tanpa harus membeli satu kontainer penuh dari satu model.
    - title: Armada Sewa & Sekolah
      description: Operasi rental dan SUP sekolah menambah armada — papan yang tahan lama, model campuran untuk melayani berbagai ukuran pelanggan, dan dukungan garansi.
    - title: Resor & Operator Tur
      description: Hotel, resor pulau, dan operator tur menambahkan SUP ke dalam jajaran kegiatan mereka dengan armada awal yang kecil dan pengisian ulang musiman yang mudah.
