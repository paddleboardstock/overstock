hero:
  tagline: Papan Grosir SUP
  title: Papan Dayung Tiup Grosir<br />untuk Usaha Kecil
  subtitle: Papan overstock baru SUP dalam jumlah yang ramah untuk bisnis kecil. Pesan 5–20 papan, campur model apa pun dalam satu pengiriman, dan pilih pengiriman ekspres udara atau laut ke 50+ negara.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan tiup grosir SUP siap Paddle Board Overstock dikirim
direct_answer: Paddle Board Overstock menyediakan papan tiup overstock baru SUP untuk pengecer kecil di seluruh dunia. Tidak ada pesanan minimum besar — pesanan grosir dimulai dari hanya 5 papan, dan Anda dapat mencampur model yang tersedia dalam satu pesanan. Papan dikirim dari basis kami di Weihai, China melalui angkutan udara ekspres (1–3 papan, sampel, atau restock mendesak) atau pengiriman laut konsolidasi (5–20 pesanan pengecer papan). Setiap papan telah diuji tekanan 100% sebelum dikirim dan tercakup oleh SUP Garansi 2 Tahun kami.
tldr_points:
  - 'Rendah MOQ: pesanan grosir dimulai dari 5 papan — disesuaikan untuk toko kecil, bukan muatan kontainer'
  - 'Pesanan model campuran: gabungkan semua model yang tersedia SUP dalam satu pengiriman'
  - 'Dua pilihan pengiriman: pengiriman udara ekspres untuk 1–3 papan, pengiriman laut untuk pesanan 5–20 papan.'
  - 'Stok baru: 100% uji tekanan, tingkat kelulusan inspeksi akhir 99,3%, SUP Garansi 2 Tahun'
why_retailers:
  title: Mengapa Retailer Kecil Memilih SUP Papan Overstock
  subtitle: Anda tidak perlu gudang atau anggaran kontainer untuk membeli dengan harga grosir.
  items:
    - title: Jumlah yang Ramah Usaha Kecil
      description: Grosir tradisional menuntut ratusan unit per pesanan. Model overstock kami dirancang untuk toko independen — mulai dengan 5 papan dan tingkatkan pesanan Anda seiring toko Anda berkembang.
    - title: Harga grosir nyata tanpa komitmen volume
      description: Karena kami menjual stok berlebih — produksi surplus dan stok yang diperoleh dengan cermat dari pabrik mitra terpilih — Anda mendapatkan harga unit tingkat volume tanpa risiko volume.
    - title: Campurkan Model Agar Sesuai dengan Pelanggan Anda
      description: Toko pantai, penyedia danau, dan toko kota melayani berbagai pendayung. Campurkan model serba bisa, touring, dan gaya selancar SUP dalam satu urutan agar rak Anda sesuai dengan permintaan lokal.
    - title: Baru, Tidak Pernah Digunakan
      description: Setiap papan dalam inventaris overstock kami adalah baru dan tidak terpakai — bukan detik, bukan pengembalian. Setiap papan diuji tekanan 100% sebelum keluar dari gudang.
    - title: Pengiriman internasional cepat dan fleksibel
      description: Pengiriman udara ekspres akan menerima 1–3 papan atau pesanan sampel dengan cepat ke pintu Anda; Pengiriman laut konsolidasi menjaga biaya per papan tetap rendah pada 5–20 pesanan pengecer papan.
    - title: Didukung oleh Garansi Nyata
      description: Grosir bukan berarti tidak didukung. Setiap SUP papan memiliki SUP Garansi 2 Tahun kami, cakupan yang sama seperti yang kami berikan kepada setiap pelanggan di 50+ negara.
pricing_section:
  tagline: Harga Grosir
  title: Harga grosir yang sederhana dan transparan
  subtitle: Harga dikutip per pesanan berdasarkan model, jumlah, dan metode pengiriman yang Anda pilih. Tidak ada biaya tersembunyi — penawaran yang Anda terima adalah harga yang Anda bayar.
  points:
    - title: Bertingkat berdasarkan Kuantitas
      description: Harga satuan turun seiring bertambahnya ukuran pesanan. Pesanan 10 papan harganya lebih baik per papan dibandingkan pesanan 5 papan; pesanan 20 papan lebih baik lagi.
    - title: Model campuran dihitung untuk satu total
      description: Tingkat diskon Anda didasarkan pada jumlah total papan dalam pesanan — bukan per model. Mencampur 4 model berbeda × 3 papan masing-masing dihitung sebagai pesanan 12 papan.
    - title: Dikutip Dengan Opsi Pengiriman
      description: Setiap penawaran harga mencakup opsi pengiriman ekspres dan laut dengan perkiraan waktu transit, sehingga Anda dapat memilih keseimbangan kecepatan-biaya yang sesuai dengan jadwal pengisian kembali Anda.
    - title: Tidak Perlu Akun atau Keanggotaan
      description: Tidak ada klub grosir untuk bergabung dan tidak ada biaya tahunan. Minta penawaran, konfirmasi pesanan, dan kami akan mengirimkan.
