faq:
  title: FAQ Paket
  questions:
    - q: Berapa jumlah pesanan minimum untuk paket?
      a: Paket Club Starter memiliki minimum 10 unit. Paket Resort dan Merek disesuaikan dengan kebutuhan Anda dengan MOQs yang fleksibel.
    - q: Berapa lama waktu pengiriman?
      a: Produksi standar adalah 30–45 hari dari konfirmasi pesanan. Produksi dipercepat tersedia dengan biaya tambahan.
    - q: Apakah saya bisa menyesuaikan warna dan merek peralatan?
      a: Ya. Semua paket termasuk kustomisasi penuh — warna papan, cetakan logo, dan desain kemasan.
    - q: Apakah Anda menyediakan dukungan purna jual?
      a: Ya. Setiap paket termasuk akses ke panduan pemeliharaan online kami, tutorial video, dan sistem pemesanan suku cadang.
