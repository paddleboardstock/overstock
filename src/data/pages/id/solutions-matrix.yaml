hero:
  tagline: Matriks Solusi Industri
  title: Solusi Kelautan Berbasis Skenario<br />Untuk Operasi Profesional
  subtitle: Kapal karet tiup dan RIBs yang dirancang khusus untuk penyelamatan, armada sewaan, kapal pendukung yacht, dan aplikasi perikanan komersial — masing-masing didukung oleh spesifikasi teknis dan opsi kustomisasi.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/categories/paddleboardoverstock-rib-boat-category.webp
    alt: Paddle Board Overstock solusi kelautan profesional untuk berbagai industri
direct_answer: 'Paddle Board Overstock menyediakan kapal karet tiup dan solusi RIB yang dirancang berdasarkan skenario untuk operasi kelautan komersial: kapal penyelamat dan patroli dengan tabung Hypalon yang diperkuat dan keselamatan multi-ruangan, armada sewaan SUPs dan kayak dengan PVC 1,2 mm dan jahitan las udara panas untuk ketahanan rendah perawatan, kapal pendukung yacht mewah dengan lambung aluminium Deep-V RIBs, dan konfigurasi perikanan berat dengan dudukan joran dan sistem livewell.'
solution_a:
  tagline: Solusi A
  title: Penyelamatan Kelautan &<br />Patroli Komersial
  subtitle: RIBs multi-ruangan berkecepatan tinggi untuk operasi tanggap darurat profesional dan penegakan hukum.
  badge: Heavy-Duty Series
  description: Kapal penyelamatan dan patroli RIBs kami dibangun dengan tabung udara Hypalon/PVC kepadatan tinggi yang diperkuat dengan desain pelampung multi-ruangan independen. Setiap kapal dilengkapi dengan pita reflektif profesional, tali genggam penyelamatan, dan katup pengisian cepat untuk kesiapan penggunaan. Lambung fiberglass Deep-V memberikan stabilitas luar biasa pada kecepatan tinggi dan dalam kondisi laut kasar.
  features:
    - title: Keselamatan Multi-Kompartemen
      description: 4–6 ruangan udara independen — tusukan pada satu ruangan tetap menjaga pelampungan positif
    - title: Kain Tabung yang Diperkuat
      description: Hypalon 1,2 mm CSM atau 1,680 DTEX PVC dengan jahitan las udara panas dua lapis
    - title: Pita Reflektif Kelas Profesional
      description: SOLAS, tali genggam penyelamatan, cleat tarikan, tali peluncur cepat
    - title: Lambung Kecepatan Tinggi
      description: Lambung fiberglass atau aluminium Deep-V dinilai untuk 25–45 knot tergantung konfigurasi
  recommended_models:
    - RIB 450 Patroli
    - RIB 520
    - RIB 600
    - RIB 700
  specifications:
    - label: Bahan Lambung
      value: Fiberglass / Aluminium Kelas Kelautan
    - label: Kain Tabung
      value: Hypalon 1,2 mm CSM / 1,680 DTEX PVC
    - label: Kecepatan Maksimal
      value: 25–45 knot
    - label: Kapasitas
      value: 6–12 orang
    - label: Kisaran Mesin
      value: 40–200 HP
    - label: Sertifikasi
      value: CE / ISO 9001
solution_b:
  tagline: Solusi B
  title: Penyewaan Olahraga Air &<br />Peralatan Armada Resort
  subtitle: Perahu karet tiup, kayak, dan perahu ultra-tahan lama dengan perawatan rendah yang dibuat untuk penggunaan sewa harian di resort, klub, dan operasi tur.
  badge: Rental-Grade
  description: Peralatan armada sewa kami dirancang untuk daya tahan tertinggi dan biaya perawatan terendah. Kami menggunakan PVC 1,2 mm yang diperkuat dengan teknologi jahitan las udara panas tiga lapis yang tahan terhadap kerusakan UV dan tabrakan yang sering terjadi. Konstruksi Drop-stitch memastikan papan tetap kaku bahkan setelah ratusan siklus penyewaan. Semua model dilengkapi cincin D yang diperkuat, pita rel tahan aus, dan katup kelas komersial.
  features:
    - title: Kelas Komersial PVC
      description: PVC 1,2 mm yang diperkuat dengan penstabil UV — 3x lebih tebal dari bahan kelas konsumen
    - title: Jahitan Las Udara Panas
      description: Pengelasan fusi tiga lapis — lebih kuat daripada perekat, tahan delaminasi
    - title: Kekakuan Drop-Stitch
      description: Inti DTEX 1.680 dengan 2 benang/in^2 — dinilai hingga 20 PSI untuk kekakuan seperti papan keras
    - title: Desain Siap Armada
      description: Cincin D yang diperkuat, katup Halkey-Roberts kelas komersial, pita rel tahan aus
  recommended_models:
    - SUP Cheetah Surge
    - SUP Ocean Voyager
    - AirDeck 360
    - RIB 330
  specifications:
    - label: Bahan Tabung
      value: PVC Reinforced 1,0–1,2 mm
    - label: Teknologi Jahitan
      value: Las udara panas tiga lapis
    - label: Tekanan Maksimum
      value: 15–20 PSI (model drop-stitch)
    - label: Resistensi UV
      value: Pengujian Percepatan 1.000+ jam
    - label: Jaminan
      value: 2–5 tahun tergantung model
    - label: Pemeliharaan
      value: Minimal — bilas dan simpan
solution_c:
  tagline: Solusi C
  title: Tender Yacht &<br />Kapal Pesiar Mewah
  subtitle: Tender ringan dan berkinerja tinggi RIB dirancang untuk penyimpanan superyacht dan transportasi tamu dengan kelengkapan dan sentuhan mewah.
  badge: Premium Series
  description: Tender yacht kami RIBs menggabungkan konstruksi ringan dengan estetika mewah. Lambung Deep-V dari aluminium atau fiberglass memberikan kualitas perjalanan yang luar biasa dan mudah diangkat dengan davit. Tersedia dengan grafis tabung yang cocok dengan warna, pelapis premium, dan tata letak konsol kustom. Dimensi penyimpanan yang kompak membuatnya ideal untuk garasi dan penyimpanan dek superyacht.
  features:
    - title: Konstruksi Ringan
      description: Lambung aluminium kelas laut mengurangi berat hingga 30% dibanding fiberglass untuk memudahkan pengangkatan
    - title: Kinerja Deep-V
      description: Lambung deadrise 18–22 derajat untuk perjalanan yang mulus di perairan bergelombang dan manuver yang baik
    - title: Kelengkapan & Sentuhan Mewah
      description: Pelapis kustom, tabung dengan warna sesuai, konsol helm premium, paket stainless
    - title: Penyimpanan Kompak
      description: Dirancang untuk garasi superyacht — tabung bisa dikempiskan untuk penyimpanan kompak
  recommended_models:
    - RIB 330
    - RIB 390
    - RIB 480
    - RIB 520
  specifications:
    - label: Tipe Lambung
      value: Deep-V Aluminium / Fiberglass
    - label: Deadrise
      value: 18–22 derajat
    - label: Kecepatan Maksimal
      value: 30–40 knot
    - label: Berat Kering
      value: 120–350 kg (lambung aluminium)
    - label: Siap Angkat Davit
      value: Ya — titik angkat standar
    - label: Penyimpanan
      value: Tabung bisa dikempiskan, bisa ditumpuk
