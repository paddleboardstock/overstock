hero:
  tagline: Peralatan
  title: Peralatan & Mesin Manufaktur
  subtitle: Peralatan kelas industri untuk pemotongan, pengelasan, pencetakan, dan perakitan
  back_label: Kembali ke Pabrik
  back_link: /factory
categories:
  - title: Pemotongan & Persiapan Bahan
    items:
      - name: Mesin Pemotong PVC Otomatis
        spec: Mesin dikontrol CNC, 6,5 m × 2,5 m, akurasi 0,1 mm
        desc: Mesin pemotong otomatis yang dikendalikan komputer untuk kain PVC, Hypalon, dan drop-stitch. Perangkat lunak penataan (nesting) mengoptimalkan pemanfaatan bahan hingga limbah di bawah 5%.
      - name: Penyebar Kain
        spec: Lebar maks 3 m, umpan dikendalikan ketegangan
        desc: Menyebarkan kain dalam satu atau beberapa lapis dengan ketegangan terkendali untuk mencegah distorsi sebelum pemotongan.
  - title: Pengelasan & Penyambungan Tabung
    items:
      - name: Mesin Penyegel Panas
        spec: Pengelasan udara panas, variabel 200–600 °C, 0,5–5 m/menit
        desc: Mesin penyegelan panas untuk penyambungan dan pengelasan jahitan tabung PVC dan Hypalon. Digunakan untuk penempelan, penyegelan, dan penyatuan ruang tabung serta sambungan pelampung.
      - name: Press RF Dielektrik
        spec: 15 kW, platen 2000 × 600 mm
        desc: Press pengelasan frekuensi radio untuk sambungan longitudinal utama, sambungan transom-ke-tabung, dan fabrikasi ruang besar.
      - name: Pengelasan RF Dikontrol CNC
        spec: 8 kW, meja XY 2500 × 1200 mm
        desc: Pengelasan jahitan melengkung yang dapat diprogram untuk geometris kompleks, emboss logo, dan patchwork presisi.
  - title: Manufaktur Lambung RIB
    items:
      - name: Cetakan Fiberglass Hand-Lay-Up
        spec: Beberapa cetakan untuk lambung RIB hingga 6 m LOA
        desc: Pencetakan fiberglass dengan teknik hand-lay-up tradisional menggunakan sistem resin poliester dan vinilester. Setiap lapisan digulung tangan dan dikemas vakum untuk kualitas laminate dan kekuatan yang konsisten.
      - name: Booth Semprot Gelcoat
        spec: Suhu dikontrol, ventilasi udara tersaring
        desc: Aplikasi gelcoat untuk lambung RIB. Memberikan hasil akhir mengkilap, tahan UV dengan kontrol ketebalan yang presisi.
      - name: Router CNC (5-sumbu)
        spec: Lingkup 3 m × 2 m × 1 m, spindle didinginkan air
        desc: Pengerjaan mesin untuk sisipan lambung, cetakan konsol, basis kursi, dan braket kustom.
  - title: Cetak & Dekorasi SUP
    items:
      - name: Printer Digital
        spec: Inkjet resolusi tinggi, lebar cetak hingga 2 m
        desc: Pencetakan digital langsung ke kain untuk grafis dek SUP berwarna penuh. Mencetak pola kustom, gradasi, dan gambar berkualitas foto dengan tinta berbasis air tahan UV.
      - name: Mesin Sablon
        spec: Manual dan semi-otomatis, registrasi multi-warna
        desc: Sablon untuk logo papan SUP, tanda merek, dan pola berulang. Memberikan cetakan yang tahan lama, buram, dengan saturasi warna yang hidup.
  - title: Perakitan & Pemasangan
    items:
      - name: Dongkrak Mesin
        spec: Kapasitas 500 kg, bar penyebar yang dapat disesuaikan
        desc: Pemasangan aman mesin tempel dari 2,5 hingga 60 hp.
      - name: Bingkai Tiruan Konsol
        spec: Tinggi dan sudut yang dapat disesuaikan
        desc: Pra-pemasangan kemudi, throttle, dan panel instrumen sebelum instalasi.
      - name: Alat Penekan Selang Hidrolik
        spec: Hingga 1" ID, pengukur tekanan digital
        desc: Perakitan selang kemudi hidrolik dengan panjang khusus dan fitting yang diswadg.
      - name: Papan Kabel Listrik
        spec: 3 m × 1,5 m, diagram pengkabelan yang dicetak sebelumnya
        desc: Perakitan dan pengujian kabel kelistrikan lengkap di luar kapal.
  - title: Pengujian & Pengendalian Kualitas
    items:
      - name: Penguji Tarik Universal
        spec: 50 kN, / ASTM D751
        desc: Pengujian gaya patah, pertambahan panjang saat putus, dan penyebaran sobekan untuk batch kain.
      - name: Rig Uji Penahanan Udara
        spec: Dapat diprogram, tahan tekanan selama 30 menit
        desc: Uji tahan tekanan otomatis untuk setiap ruang tabung sebelum perakitan.
      - name: Penguji Pengelupasan Jahitan
        spec: Pengupasan bermotor 180° pada 100 mm/menit
        desc: Pengujian kekuatan lepas sambungan las dan lem sesuai ISO 6185.
      - name: Kamar Perubahan Cuaca Xenon-Arc
        spec: Paparan 2000 jam
        desc: Pengujian ketahanan UV untuk perubahan warna dan retensi kekuatan.
