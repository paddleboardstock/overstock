hero:
  tagline: Tentang
  title: Tentang {SITE}
  subtitle: Sebuah produsen olahraga air yang terintegrasi secara vertikal — dari bahan baku hingga kapal jadi
intro:
  - 'Paddle Board Overstock didirikan pada tahun 2012 dengan satu misi: merancang dan memproduksi peralatan olahraga air yang berkinerja sama baik di air seperti halnya dalam laporan kualitas. Apa yang dimulai sebagai bengkel papan SUP yang fokus telah berkembang menjadi fasilitas manufaktur terintegrasi seluas 12.000 meter persegi di Zona Pengembangan Ekonomi Qingdao, memproduksi kapal karet, RIBs, kayak, papan SUP, peralatan keselamatan, dan aksesori untuk pelanggan di 50+ negara.'
  - Hari ini, Paddle Board Overstock beroperasi sebagai merek pabrik — kami merancang, merekayasa, membuat prototipe, memproduksi, dan menguji semuanya di bawah satu atap. Integrasi vertikal ini memberi kami kontrol langsung atas pemilihan bahan, kualitas pembuatan, dan jadwal pengiriman. Setiap kapal dibangun oleh tim kami, menggunakan peralatan kami, sesuai standar kami.
  - Kami melayani pengguna rekreasi, operator komersial, lembaga pemerintah, dan mitra merek di seluruh dunia. Program OEM dan ODM kami membantu bisnis meluncurkan lini produk mereka sendiri tanpa perlu berinvestasi dalam infrastruktur pabrik. Apakah Anda membutuhkan satu prototipe atau produksi penuh, tim kami membimbing Anda dari konsep hingga pengiriman siap digunakan di air.
