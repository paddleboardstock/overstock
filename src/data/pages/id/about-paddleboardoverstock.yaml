values:
  - title: Kualitas Utama
    desc: Setiap perahu yang keluar dari pabrik kami melewati uji retensi udara, peregangan sambungan, dan sistem wajib sebelum dikirim.
  - title: Integrasi Vertikal
    desc: Kami mengendalikan setiap tahap — dari pemotongan PVC hingga perakitan akhir — menghilangkan ketidakefisienan kontraktor dan memastikan kualitas yang konsisten.
  - title: Keselamatan sebagai Standar
    desc: Sertifikasi CE adalah inti dari apa yang kami bangun. 64 model kami yang bersertifikasi CE memenuhi standar keselamatan UE untuk penggunaan rekreasi dan komersial.
  - title: Berfokus pada Mitra
    desc: Kami membangun hubungan jangka panjang dengan OEM, ODM, dan mitra label pribadi melalui transparansi, keandalan, dan pertumbuhan bersama.
services:
  - title: OEM Manufaktur
    desc: Kami membangun sesuai spesifikasi Anda. Bagikan gambar desain Anda, dan tim teknik kami menangani prototipe, pembuatan alat, dan produksi.
  - title: Solusi ODM
    desc: Mulai dari desain platform terbukti kami. Sesuaikan ukuran, warna, grafis, dan kemasan untuk menciptakan lini produk unik Anda.
  - title: Label Pribadi
    desc: Nama merek Anda, logo Anda, kemasan Anda. Produk tiba siap jual dengan integrasi merek penuh.
  - title: Branding Kustom
    desc: Pencetakan dek, grafis lambung, stiker tabung, dan label kustom — kehadiran merek yang konsisten di setiap permukaan.
certifications:
  - name: Sertifikasi CE
    desc: Perahu dan kendaraan air kami mematuhi EU Recreational Craft Directive (2013/53/EU) dan standar harmonisasi terkait.
