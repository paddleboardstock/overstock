reasons:
  tagline: Perbedaan Paddle Board Overstock
  title: Apa yang Membuat Kami Berbeda
  isBeforeContent: false
  columns: 3
  items:
    - title: Manufaktur Nyata, Bukan Perdagangan
      description: Kami memiliki dan mengoperasikan pabrik seluas 12.000 m². Ketika Anda bermitra dengan Paddle Board Overstock, Anda bekerja langsung dengan orang-orang yang merancang, mengembangkan, dan membuat produk Anda — tanpa perantara.
      icon: tabler:building-factory
    - title: Pendekatan yang Dipimpin Rekayasa
      description: Proses desain kami dimulai dari kasus penggunaan, bukan kategori produk. Kami mengoptimalkan bentuk lambung, pemilihan material, dan konfigurasi untuk bagaimana peralatan akan benar-benar digunakan di lingkungan komersial.
      icon: tabler:engine
    - title: Kualitas Tersertifikasi
      description: Tersertifikasi CE, sistem kualitas ISO, sesuai BSCI, sesuai REACH, rompi keselamatan tipe III/V USCG yang disetujui; semua produk memenuhi standar internasional yang berlaku.
      icon: tabler:certificate
    - title: Fleksibel OEM/ODM
      description: Warna tabung, tata letak konsol, merek, kemasan — kami sesuaikan dengan spesifikasi Anda. Tidak ada tekanan jumlah minimum. Mulai dengan prototipe, berkembang dengan percaya diri.
      icon: tabler:adjustments
    - title: Logistik Global
      description: Gudang AS di California, pengiriman langsung dari Qingdao, pengiriman udara untuk pesanan mendesak. Kami menangani dokumen dan administrasi bea cukai di seluruh dunia.
      icon: tabler:truck-delivery
    - title: Dukungan Seumur Hidup
      description: Kami mendukung perahu yang kami bangun 20 tahun yang lalu. Suku cadang asli, saran teknis, panduan perbaikan — tim kami tersedia saat Anda membutuhkannya, di mana pun Anda berada.
      icon: tabler:lifebuoy
testimonials:
  tagline: Dipercaya oleh Merek di Seluruh Dunia
  title: Apa Kata Mitra Kami
  items:
    - content: Kami telah bekerja dengan beberapa produsen di China, tetapi Paddle Board Overstock menonjol karena dukungan rekayasa mereka dan kualitas yang konsisten. Mereka memperlakukan merek kami seolah-olah itu milik mereka sendiri.
      name: — OEM Mitra, Merek Olahraga Air Eropa
    - content: Hypalon RIBs mereka telah digunakan dalam armada kami selama lebih dari 5 tahun. Pemeliharaan minimal, ketahanan UV yang luar biasa. Garansi 5 tahun pada tabung memberi kami kepercayaan.
      name: — Operator Armada, Grup Resor Timur Tengah
    - content: Tim Paddle Board Overstock membantu kami mengembangkan desain papan SUP kustom dari konsep hingga produksi dalam 90 hari. Kualitasnya melebihi harapan kami.
      name: — Distributor, Olahraga Air Australia
    - content: Sebagai pemilik usaha kecil, saya khawatir tentang MOQs. Paddle Board Overstock menyesuaikan dengan anggaran saya dan membantu saya meluncurkan merek saya hanya dengan 50 papan. Sekarang saya memesan 500.
      name: — Pendiri Merek, Perusahaan Penyewaan SUP AS
