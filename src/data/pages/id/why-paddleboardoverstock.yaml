pillars:
  tagline: Tiga Pilar Kemitraan
  title: Mengapa Bisnis Air di Seluruh Dunia Memilih Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Dirancang Untuk Penggunaan Komersial
      description: Peralatan kami dirancang untuk penyewaan harian, bukan hiburan akhir pekan. PVC kelas komersial, inti drop-stitch yang diperkuat, opsi UV yang stabil Hypalon, dan perangkat keras yang diuji di lapangan berarti pemeliharaan lebih rendah, umur pakai lebih lama, dan ROI lebih tinggi untuk operasional Anda.
      icon: tabler:building-factory
      callToAction:
        text: Lihat lini produk komersial
        href: /products
    - title: Dari Ide ke Pasar
      description: 'Luncurkan merek olahraga air Anda dalam 90 hari. Kami memandu Anda melalui setiap langkah: validasi konsep, pemilihan produk, prototipe, produksi, desain kemasan, dan pengiriman global. Tidak ada tekanan minimum pesanan — mulailah kecil, berkembang dengan percaya diri.'
      icon: tabler:rocket
      callToAction:
        text: Mulai perjalanan merek Anda
        href: /oem-odm-blueprint
    - title: Dibangun Untuk Kondisi Global
      description: 'Produk dioptimalkan untuk setiap iklim: formulasi PVC air dingin untuk Eropa, bahan UV-tahan untuk Timur Tengah dan Australia, perlakuan anti kelembaban untuk Asia Tenggara. Setiap pengiriman dikalibrasi sesuai lingkungan tujuan.'
      icon: tabler:world
