hero:
  tagline: Mengapa Paddle Board Overstock
  title: Dibangun Berbeda. Dibangun untuk Bisnis.<br />Mitra di Balik Petualangan Air di Seluruh Dunia
  subtitle: Bukan hanya produsen — tetapi mitra bisnis yang merancang, merekayasa, dan menyediakan peralatan kelas komersial untuk klub, resor, operator penyewaan, dan merek air yang sedang berkembang.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
