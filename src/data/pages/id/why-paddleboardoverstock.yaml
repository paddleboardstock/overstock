pillars:
  tagline: Tiga Pilar Kualitas
  title: Mengapa Pendayung di Seluruh Dunia Memilih Paddle Board Overstock
  subtitle: ''
  columns: 3
  items:
    - title: Dirancang Untuk Penggunaan Komersial
      description: Papan kami dirancang untuk bertahun-tahun mendayung secara rutin. Inti yang diperkuat dengan kualitas komersial PVC drop-stitch , UV bahan yang stabil, dan perangkat keras yang telah diuji di lapangan berarti perawatan yang lebih rendah dan umur lebih lama di atas air.
      icon: tabler:building-factory
      callToAction:
        text: Lihat lini produk komersial
        href: /products
    - title: Diuji di Luar Standar
      description: Setiap papan dipompa hingga 1,25x tekanan yang ditentukan selama 24-48 jam sebelum keluar dari pabrik kami — 100% teruji tekanan, 99,3% bebas cacat. Papan Anda terbukti tangguh sebelum menyentuh air.
      icon: tabler:shield-check
      callToAction:
        text: Lihat bagaimana kami menguji
        href: /quality
    - title: Dibangun Untuk Kondisi Global
      description: 'Produk dioptimalkan untuk setiap iklim: formulasi PVC air dingin untuk Eropa, bahan UV-tahan untuk Timur Tengah dan Australia, perlakuan anti kelembaban untuk Asia Tenggara. Setiap pengiriman dikalibrasi sesuai lingkungan tujuan.'
      icon: tabler:world
