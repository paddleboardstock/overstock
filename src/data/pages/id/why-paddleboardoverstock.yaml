  title: Dibangun Berbeda. Dibangun untuk Bertahan Lama.<br />Papan di balik petualangan air di seluruh dunia
  subtitle: Bukan sekadar pabrik — tim pendayung dan insinyur yang merancang, menguji, dan membangun papan tiup premium SUP untuk keluarga, petualang, dan klub di seluruh dunia.
  image:
