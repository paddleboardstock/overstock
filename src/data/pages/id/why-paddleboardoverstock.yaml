reasons:
  tagline: Perbedaan Paddle Board Overstock
  title: Apa yang Membuat Kami Berbeda
  isBeforeContent: false
  columns: 3
  items:
    - title: Manufaktur Nyata, Bukan Perdagangan
      description: Kami memiliki dan mengoperasikan pabrik seluas 12.000 m². Ketika Anda bermitra dengan Paddle Board Overstock, Anda bekerja langsung dengan orang-orang yang merancang, merancang teknik, dan membangun produk Anda — tanpa perantara.
      icon: tabler:building-factory
    - title: Pendekatan yang Dipimpin Rekayasa
      description: Proses desain kami dimulai dari kasus penggunaan, bukan kategori produk. Kami mengoptimalkan bentuk lambung, pemilihan material, dan konfigurasi untuk bagaimana papan akan digunakan di atas air.
      icon: tabler:engine
    - title: Kualitas Terbukti
      description: Setiap papan diuji tekanan hingga 1,25x tekanan yang dinilai selama 24-48 jam sebelum pengiriman, dan 99,3% pengiriman kami tiba tanpa cacat — didukung oleh garansi kami.
      icon: tabler:award
    - title: Desain Pendayung Pertama
      description: 'Setiap model dimulai dari cara Anda mendayung: platform yang stabil untuk pemula, bentuk ramping untuk touring, dan dek berukuran penuh untuk yoga. Kami merancang untuk pendayung sejati, bukan spesifikasi showroom.'
      icon: tabler:adjustments
    - title: Logistik Global
      description: Gudang AS di California, pengiriman langsung dari Weihai, pengiriman udara untuk pesanan mendesak. Kami menangani dokumen dan administrasi bea cukai di seluruh dunia.
      icon: tabler:truck-delivery
    - title: Dukungan Seumur Hidup
      description: Kami berdiri di balik papan yang kami buat 20 tahun lalu. Suku cadang asli, saran teknis, panduan perbaikan — tim kami siap membantu saat Anda membutuhkan kami, di mana pun Anda berada.
      icon: tabler:lifebuoy
testimonials:
  tagline: Dipercaya oleh Paddlers di Seluruh Dunia
  title: Apa Kata Para Pendayung
  items:
    - content: Ocean Voyager saya sudah menangani segala sesuatu mulai dari pagi yang tenang di danau hingga sore pesisir yang bergelombang. Dua musim berlalu, mobil ini masih terlihat dan berkendara seperti baru.
      name: — Pendayung Rekreasi, California
    - content: Saya sempat gugup membeli papan tiup pertama saya secara online, tapi kualitasnya langsung terlihat saat saya mengembangkannya. Kaku, stabil, dan selesai dengan indah.
      name: — Pemilik Pertama Kali SUP , Jerman
    - content: Kami mendayung sebagai keluarga setiap akhir pekan musim panas. Tiga papan, tidak ada masalah, dan anak-anak menyukai desain cerahnya.
      name: — Pengayuh Keluarga, Australia
    - content: Pengujian tekanan bukanlah pembicaraan pemasaran — papan saya sangat kokoh pada tekanan penuh dan tidak menunjukkan peregangan setelah setahun mendayung mingguan.
      name: — Weekly Paddler, Belanda
cta:
  title: Siap Menemukan Papan Sempurna Anda?
  subtitle: Bicaralah dengan para ahli dayung kami untuk saran jujur tentang memilih papan yang tepat — tanpa tekanan, hanya bantuan nyata.
  actions:
