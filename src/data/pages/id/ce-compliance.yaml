content_scope:
  tagline: Lingkup Kepatuhan
  title: Produk Mana yang Dibutuhkan<br />RCD Kepatuhan?
  subtitle: Petunjuk Kerajinan Rekreasi 2013/53/EU berlaku untuk kerajinan rekreasi dengan panjang lambung antara 2,5 m dan 24 m. Memahami cakupan adalah langkah pertama untuk kepatuhan.
  items:
    - title: RIB Perahu (2,5–24 m)
      description: Perahu karet kaku dengan panjang lambung dari 2,5 m hingga 24 m termasuk dalam RCD. Kategori desain A hingga D berlaku tergantung pada kondisi laut yang dimaksud dan kekuatan angin maksimum.
      icon: tabler:sailboat
    - title: Perahu Tiup (di bawah 2,5 m)
      description: Perahu karet kecil dan perahu dayung dengan panjang kurang dari 2,5 m mungkin sebagian dibebaskan dari RCD tetapi tetap memerlukan penandaan CE di bawah arahan lain yang berlaku dan standar konstruksi EN ISO 6185.
      icon: tabler:sailboat
    - title: SUP Papan & Aksesori
      description: Papan dayung berdiri (stand-up paddle boards) berada di luar lingkup RCD. Namun, perangkat pelampung pribadi (PFD) terkait memerlukan penandaan CE sesuai dengan Regulasi APD (UE) 2016/425 dengan persetujuan Tipe III/V USCG jika berlaku.
      icon: tabler:swimming
    - title: Perahu yang Sebagian Selesai
      description: Perahu yang dikirim tanpa mesin atau instalasi khusus memerlukan Pernyataan Pembuat untuk perahu yang setengah jadi, dengan kepatuhan penuh RCD yang diselesaikan oleh pembuat akhir atau importir.
      icon: tabler:tool
content_trust_layers:
  tagline: Sistem Kepercayaan Tiga Lapisan
  title: Informasi Kepatuhan<br />— Dibagikan pada Tingkat yang Tepat
  subtitle: Tidak semua data kepatuhan seharusnya ada di situs web publik. Kami mengikuti pendekatan tiga lapis yang melindungi IP sembari membangun kepercayaan pembeli.
  items:
    - title: Lapisan 1 — Situs Web Publik
      description: Standar yang dirujuk, jalur kesesuaian dijelaskan, jenis dokumen dicantumkan, ruang lingkup sertifikasi per keluarga model. Tidak ada sertifikat asli, data uji, atau detail teknik milik pribadi.
      icon: tabler:world
    - title: Lapisan 2 — Berbagi Setelah Pertanyaan
      description: 'Setelah pertanyaan yang memenuhi syarat: contoh DoC yang disunting, foto pelat pembuat, daftar standar yang berlaku, daftar periksa kepatuhan, dan ringkasan sertifikasi material — dibagikan dengan ketentuan penggunaan yang wajar.'
      icon: tabler:mail
    - title: Lapisan 3 — NDA / Tahap Pesanan
      description: Berkas teknis lengkap, penilaian risiko, perhitungan stabilitas, laporan uji, catatan batch material, dan dokumentasi ketertelusuran produksi — dibagikan hanya di bawah NDA dengan pembeli yang telah dikonfirmasi.
      icon: tabler:lock
content_standards:
  tagline: Standar yang Berlaku
  title: ISO & Standar EN<br />Kami Membangun Sesuai
  subtitle: Produk kami dirancang dan diuji sesuai standar yang diharmonisasi di bawah RCD. Nomor dan nama standar dirujuk; teks standar lengkap tetap ISO hak cipta.
  items:
    - title: EN ISO 6185-3
      description: 'Perahu karet tiup — Bagian 3: Perahu dengan daya motor maksimum 15 kW atau lebih. Persyaratan konstruksi, stabilitas, daya apung, dan pemulihan manusia-jatuh-air untuk RIBs.'
      icon: tabler:file-text
    - title: EN ISO 6185-4
      description: 'Perahu karet tiup — Bagian 4: Perahu dengan daya motor maksimum 15 kW dan lebih besar atau sama dengan 4,5 kW. Persyaratan struktural dan stabilitas tambahan.'
      icon: tabler:file-text
    - title: ISO Seri 12215
      description: Kapal kecil — Konstruksi lambung dan ketebalan. Desain struktural lambung, dek, dan sekat untuk lambung RIB fiberglass dan aluminium.
      icon: tabler:ruler-2
    - title: EN ISO 10240
      description: Kapal kecil — Manual pemilik. Konten dan format yang diperlukan untuk manual pemilik yang menyertai setiap perahu RIB yang dikirim di EU.
      icon: tabler:book
    - title: EN ISO 14945
      description: Kapal kecil — Pelat pembuat. Informasi yang harus ditandai pada pelat pembuat yang dipasang secara permanen pada setiap kapal.
      icon: tabler:badge
    - title: ISO 8666
      description: Kapal kecil — Data utama. Pengukuran dan parameter yang distandarisasi untuk spesifikasi yang konsisten di seluruh dokumentasi produk.
      icon: tabler:dimensions
content_process:
  tagline: Proses Kepatuhan
  title: 6-Langkah Kepatuhan CE<br />Alur Kerja
  subtitle: Dari lingkup proyek hingga ketertelusuran tingkat serial — setiap model RIB mengikuti jalur kepatuhan yang telah ditentukan.
  steps:
    - number: '01'
      title: Lingkup Proyek & Klasifikasi
      description: Tentukan model RIB, kategori desain (A/B/C/D), jumlah maksimal orang, muatan, daya mesin, dan pasar target. Tentukan apakah RCD berlaku dan modul penilaian kesesuaian mana yang diperlukan.
      timeline: 2–3 hari
    - number: '02'
      title: Identifikasi Persyaratan yang Berlaku
      description: Identifikasi semua Persyaratan Keamanan Esensial yang berlaku dari RCD Lampiran I, standar terpadu yang relevan (EN ISO 6185, 12215, 10240, 14945), dan setiap persyaratan nasional tambahan untuk pasar target.
      timeline: 3–5 hari
    - number: '03'
      title: Dokumentasi Desain & Teknis
      description: 'Buat Master Technical File: gambar tata letak umum, perhitungan stabilitas dan daya apung, penilaian risiko, spesifikasi material, dan analisis keselamatan sistem (bahan bakar, listrik, kemudi).'
      timeline: 10–15 hari
    - number: '04'
      title: Verifikasi & Pengujian Produk
      description: Lakukan verifikasi fisik — uji tekanan pada 1,25x tekanan nominal selama 24–48 jam, uji stabilitas dan daya apung, uji beban, dan komisioning sistem. Catat semua hasil pengujian per lambung.
      timeline: 5–7 hari
    - number: '05'
      title: Marking & Dokumentasi Pengiriman
      description: Pasang tanda CE, pelat pembuat (EN ISO 14945), dan HIN/CIN (nomor identifikasi lambung). Siapkan Deklarasi Kesesuaian EU, manual pemilik (EN ISO 10240), dan daftar periksa kepatuhan.
      timeline: 2–3 hari
    - number: '06'
      title: Traceability Tingkat Serial
      description: Setiap lambung menerima Rekaman Lambung unik yang menghubungkannya ke Master Technical File, batch produksi, sertifikat material, hasil uji, dan konfigurasi akhir. Rekaman disimpan selama 10+ tahun sesuai RCD.
      timeline: Berlaku secara Berkelanjutan
content_document_cards:
  tagline: Jenis Dokumen
  title: Dokumen Kepatuhan<br />Kartu
  subtitle: Ini adalah jenis dokumen yang kami siapkan dan pertahankan untuk setiap model RIB bersertifikat CE. Contoh tersedia atas permintaan yang memenuhi syarat.
  items:
    - title: Sertifikat Kepatuhan CE / RCD
      description: Sertifikat spesifik model yang menegaskan bahwa kapal memenuhi semua Persyaratan Keamanan Esensial yang berlaku dari RCD 2013/53/EU, diterbitkan oleh produsen dengan keterlibatan Notified Body bila diperlukan.
      icon: tabler:certificate
    - title: Deklarasi Kesesuaian EU (DoC)
      description: Deklarasi yang ditandatangani oleh produsen atau perwakilan yang berwenang, mencantumkan arahan, standar, modul kesesuaian yang berlaku, dan detail Notified Body. Dibutuhkan untuk setiap model yang ditempatkan di pasar EU.
      icon: tabler:file-check
    - title: Pelat Pembuat (EN ISO 14945)
      description: Pelat yang dipasang secara permanen menampilkan jumlah orang maksimal, daya mesin maksimal, kategori desain, dan identifikasi produsen. Harus tetap terbaca selama umur kapal.
      icon: tabler:badge
    - title: Manual Pemilik (EN ISO 10240)
      description: Manual lengkap yang mencakup operasi aman, prosedur darurat, jadwal perawatan, dan peringatan keselamatan. Wajib untuk setiap RIB yang dikirimkan di EU.
      icon: tabler:book
    - title: Laporan Uji & Inspeksi ISO
      description: Catatan uji tekanan (1,25x / 24–48 jam), hasil uji stabilitas dan daya apung, sertifikat uji material, dan laporan verifikasi dimensi — semuanya terhubung dengan nomor lambung tertentu.
      icon: tabler:test-pipe
    - title: Catatan Pelacakan Material
      description: Dapat dilacak pada tingkat batch untuk kain tabung, perekat, serat kaca, dan perangkat keras. Menghubungkan setiap unit produksi dengan sertifikat bahan masuk dan hasil inspeksi IQC.
      icon: tabler:link
    - title: Pemeriksaan Kualitas & Catatan QC
      description: Daftar periksa kualitas 100 poin per unit, catatan QC dalam proses, laporan ketidaksesuaian, dan tindakan korektif. Bagian dari rantai keterlacakan produksi.
      icon: tabler:clipboard-check
    - title: Paket Dokumen Proyek
      description: Paket dokumentasi per-kapal termasuk catatan konfigurasi final, rincian instalasi mesin dan peralatan, daftar periksa komisioning, dan dokumentasi penyerahan.
      icon: tabler:package
content_design_categories:
  tagline: Kategori Desain RCD
  title: Kategori Desain A–D<br />— Apa Maksud Mereka
  subtitle: RCD menetapkan kategori desain berdasarkan kekuatan angin maksimum dan tinggi gelombang signifikan yang dapat ditahan oleh kapal.
  items:
    - title: Kategori A — Laut
      description: Dirancang untuk pelayaran jarak jauh di mana kekuatan angin dapat melebihi Beaufort 8 (>40 knot) dan tinggi gelombang signifikan dapat melebihi 4 m. Memerlukan verifikasi struktural dan stabilitas yang paling ketat.
      icon: tabler:ripple
    - title: Kategori B — Lepas Pantai
      description: Dirancang untuk pelayaran lepas pantai dengan kekuatan angin hingga Beaufort 8 (≤40 knot) dan tinggi gelombang signifikan hingga 4 m. Cocok untuk perairan pesisir dan setengah terbuka.
      icon: tabler:anchor
    - title: Kategori C — Perairan Pantai
      description: Dirancang untuk pelayaran pesisir dengan kekuatan angin hingga Beaufort 6 (≤27 knot) dan tinggi gelombang signifikan hingga 2 m. Sebagian besar RIBs rekreasi termasuk dalam kategori ini.
      icon: tabler:sun
    - title: Kategori D — Berlindung
      description: Dirancang untuk perairan terlindung dengan kekuatan angin hingga Beaufort 4 (≤16 knot) dan tinggi gelombang signifikan hingga 0,3 m. Danau, sungai, dan pelabuhan terlindung.
      icon: tabler:pool
content_hin:
  tagline: Identifikasi Kerajinan
  title: HIN / CIN & Plat Pembuat
  subtitle: Setiap RIB perahu memerlukan Nomor Identifikasi Lambung (HIN) atau Nomor Identifikasi Kapal (CIN) dan pelat pembuat sesuai dengan persyaratan EN ISO 14945 dan RCD.
  items:
    - title: Nomor Identifikasi Lambung (HIN)
      description: Kode unik 14 karakter yang ditandai secara permanen di sisi kanan buritan, mengkodekan kode produsen (MIC), tahun model, tahun produksi, dan nomor seri. Diperlukan untuk masuk pasar UE.
      icon: tabler:hash
    - title: Nomor Identifikasi Pesawat (CIN)
      description: Menurut EN ISO 10087, sebuah nomor identifikasi sekunder tersembunyi yang ditempatkan di lokasi tersembunyi untuk tujuan anti-pencurian dan pelacakan.
      icon: tabler:eye-off
    - title: Isi Pelat Pembuat
      description: Jumlah maksimum orang, daya mesin maksimum (kW), beban maksimum (kg), kategori desain, nama pabrikan, dan tanda CE — semuanya ditampilkan secara permanen pada pelat yang tahan korosi.
      icon: tabler:badge
content_tech_file:
  tagline: Struktur Berkas Teknis
  title: Berkas Teknis Master<br />& Catatan Lambung
  subtitle: 'Sistem dokumentasi kami mengikuti struktur dua tingkat: Master Technical File untuk setiap keluarga model, dan Hull Records individual untuk setiap kapal yang diproduksi.'
  items:
    - title: Berkas Teknis Master
      description: 'Berisi dokumentasi kepatuhan lengkap untuk keluarga model: pengaturan umum, penilaian risiko, perhitungan stabilitas/daya apung, spesifikasi material, standar yang berlaku, dan catatan penilaian kesesuaian. Ditahan selama 10+ tahun.'
      icon: tabler:folder
    - title: Catatan Lambung (Pelacakan Per-Perahu)
      description: 'Setiap lambung memiliki catatan unik yang menghubungkannya dengan Master Technical File: HIN, tanggal produksi, batch tabung, sertifikat material, hasil uji tekanan, konfigurasi akhir, pemasangan mesin, dan tujuan pengiriman.'
      icon: tabler:file-description
    - title: Paket Kepatuhan Pelanggan
      description: Paket pengiriman per lambung termasuk DoC, foto pelat pembuat, buku pemilik, ringkasan uji, dan lembar konfigurasi akhir — disediakan bersama setiap RIB paket yang dikirim ke UE.
      icon: tabler:package
content_material_cert:
  tagline: Sertifikasi Material
  title: Pelacakan Material &<br />Bukti Sertifikasi
  subtitle: Perahu berkualitas RIB dimulai dengan material yang terkontrol dan proses yang terdokumentasi. Berikut adalah cara kami mengatur sertifikasi material untuk setiap kelompok komponen kritis.
  items:
    - title: Keterlacakan Material Tabung Tiup
      description: PVC dan CSM/Hypalon bahan tabung dipilih sesuai dengan tujuan penggunaan, kondisi iklim, dan pasar sasaran. Data teknis pemasok (TDS), informasi batch material, keterlacakan batch kain, UV laporan uji cuacaREACH, dan deklarasi /SVHC tersedia dalam lingkup dokumentasi proyek yang disepakati.
      icon: tabler:circle
    - title: Pelacakan Aluminium Laut
      description: Untuk proyek lambung aluminium RIB , kadar paduan, ketebalan, dan batch material dikendalikan sesuai spesifikasi yang disetujui. Sertifikat uji material (MTC/MTR), EN 10204 3.1 dokumentasi, laporan komposisi kimia dan sifat mekanik, serta pelacakan panas/lot disediakan jika disepakati.
      icon: tabler:rectangle
    - title: Kontrol Material & Proses Lambung GRP
      description: Untuk RIBsfiberglass-hull, gelcoat, resin, fiberglass, penguat dan bahan inti dikelola melalui spesifikasi terkontrol. Material TDS/SDS, batch record, spesifikasi laminasi, serta rekaman pengeringan dan bengkel tersedia setelah proyek disetuai.
      icon: tabler:layers-subtract
    - title: Dukungan Dokumentasi Komponen
      description: Untuk komponen terpilih — termasuk EVA material dek, tempat duduk, perangkat keras baja tahan karat, sistem bahan bakar, peralatan listrik, dan aksesori kelautan — dokumentasi pemasok yang berlaku dikoordinasikan berdasarkan konfigurasi akhir dan persyaratan pasar tujuan.
      icon: tabler:package
    - title: Pemberitahuan Lingkup Kepatuhan
      description: Sertifikat, laporan pengujian, dan dokumen kepatuhan hanya berlaku untuk model produk, material, komponen, batch produksi, atau ruang lingkup proyek spesifik yang tercantum dalam dokumen terkait. Hubungi kami dengan pasar sasaran Anda, tujuan penggunaan, dan persyaratan teknis agar paket dokumentasi yang berlaku dapat dikonfirmasi sebelum pemasangan pesanan.
      icon: tabler:info-circle
faq:
  title: CE Kepatuhan — Pertanyaan yang Sering Diajukan
  questions:
    - q: Apakah semua Paddle Board Overstock RIB kapal CE bersertifikat untuk pasar UE?
      a: RIB Perahu dalam katalog kami dirancang dan didokumentasikan untuk RCD kepatuhan 2013/53/UE sesuai dengan direktif UE yang berlaku.CE Penandaan berlaku berdasarkan per model, per konfigurasi. Hubungi kami untuk dokumen lingkup kepatuhan khusus model.
    - q: Apa perbedaan antara RCD kepatuhan dan CE penandaan?
      a: RCD (Direktif Kapal Rekreasi 2013/53/EU) adalah peraturan Uni Eropa yang menetapkan Persyaratan Keselamatan Esensial.CE Penandaan adalah simbol visual yang ditempatkan pada produk yang telah dinilai dan dikonfirmasi memenuhi persyaratan tersebut. Sebuah produk harus mematuhi ketentuan RCD sebelum dapat membawa tanda tersebut CE .
    - q: Apakah Anda menyediakan Deklarasi Kesesuaian untuk setiap kapal?
      a: Ya. Setiap RIB kapal yang dikirim ke pasar UE menyertakan Pernyataan Kesesuaian UE spesifik model yang mencantumkan direktif yang berlaku, standar yang diselaraskan, modul penilaian kesesuaian, dan rincian Badan Notifikasi.
    - q: Modul penilaian kesesuaian apa yang digunakan Paddle Board Overstock?
      a: Modul tergantung pada kategori desain dan jenis kapal. Sebagian besar model RIB dalam Kategori Desain C menggunakan Modul A (pengendalian produksi internal). Untuk kapal Kategori Desain A/B atau konfigurasi tertentu, Modul B+C atau B+D mungkin berlaku dengan keterlibatan Badan Notifikasi. Kami memberikan saran mengenai modul yang sesuai untuk setiap proyek.
    - q: Bisakah Anda membagikan dokumentasi kepatuhan sebelum kami melakukan pemesanan?
      a: Setelah permintaan yang memenuhi syarat, kami membagikan dokumen ruang lingkup kepatuhan yang mencantumkan standar yang berlaku, jalur kesesuaian, dan jenis dokumen yang tersedia untuk model yang sedang Anda evaluasi. File teknis lengkap dibagikan di bawah NDA setelah konfirmasi pesanan.
    - q: Apa itu Nomor Identifikasi Lambung (HIN) dan apakah disertakan?
      a: HIN adalah pengenal unik 14 karakter yang ditandai secara permanen pada setiap kapal, mengkodekan kode produsen (MIC), penunjukan model, tahun produksi, dan nomor seri. Ini wajib untuk semua kapal RIB yang dipasarkan di UE dan disertakan pada setiap Paddle Board Overstock RIB.
    - q: Berapa lama file teknis disimpan?
      a: Sesuai persyaratan RCD 2013/53/EU, produsen harus menyimpan file teknis selama minimal 10 tahun dari tanggal terakhir produk dipasarkan. Paddle Board Overstock menjaga dokumentasi teknis lengkap untuk semua model yang diproduksi.
    - q: Apakah Anda membantu dengan kewajiban importir di bawah RCD?
      a: 'Ya. Kami menyediakan paket dokumentasi yang dibutuhkan importir UE untuk memenuhi kewajiban mereka: akses file teknis, DoC, papan pembuat, buku panduan pemilik, dan catatan keterlacakan produk. Tanggung jawab importir di bawah RCD dijelaskan dengan jelas dalam panduan kepatuhan kami.'
