hero:
  tagline: Kepatuhan CE & RCD
  title: RIB Kepatuhan Perahu CE<br />& Dokumentasi Teknis
  subtitle: Paddle Board Overstock RIB kapal dan kendaraan air tiup dirancang dan didokumentasikan untuk kepatuhan pasar UE di bawah Direktif Kapal Rekreasi 2013/53/UE. Dari penilaian risiko hingga Pernyataan Kesesuaian, kami menyediakan dokumentasi kepatuhan spesifik model untuk setiap lambung.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-quality-testing.webp
    alt: dokumentasi dan sertifikasi kepatuhan RIB kapal CE
direct_answer: Paddle Board Overstock menyediakan dokumentasi kepatuhan 2013/53/EU spesifik model untuk perahu RIB dan wahana air tiup, termasuk berkas teknis, Pernyataan Kesesuaian, plat pembuat, dan manual pemilik — semuanya sesuai dengan EN ISO 6185, ISO 12217, dan standar harmonisasi yang berlaku.
