content_benefits:
  tagline: Manfaat Kemitraan
  title: Mengapa Distributor<br />Pilih Aquafarer
  subtitle: Kemitraan yang dirancang untuk distributor kelautan yang membutuhkan suplai yang andal, margin kompetitif, dan dukungan profesional.
  items:
    - title: Perlindungan Wilayah
      description: Hak wilayah eksklusif atau semi-eksklusif untuk distributor yang memenuhi syarat. Pemetaan pasar dan manajemen konflik saluran untuk melindungi investasi Anda dalam membangun merek Aquafarer di wilayah Anda.
      icon: tabler:map-pin
    - title: Harga Grosir Kompetitif
      description: Harga bertingkat berdasarkan komitmen volume tahunan. Struktur harga yang melindungi margin dengan jaminan harga di muka dan rincian biaya transparan (FOB basis Qingdao).
      icon: tabler:currency-dollar
    - title: Paket Dukungan Pemasaran
      description: Fotografi produk profesional, lembar spesifikasi, template dokumentasi kepatuhan, konten media sosial, dan materi pemasaran berlogo bersama. Diperbarui setiap tahun dengan peluncuran produk baru.
      icon: tabler:photo
    - title: Pelatihan Teknis
      description: Pelatihan produk untuk tim penjualan Anda (virtual atau di lokasi), pelatihan pemeliharaan dan perbaikan untuk teknisi layanan Anda, dan panduan FAQ serta pemecahan masalah untuk pelanggan.
      icon: tabler:school
    - title: Suku Cadang & Layanan Purna Jual
      description: Pasokan suku cadang khusus dengan pengiriman prioritas. Bagian tabung pengganti, katup, sirip, dan kit perbaikan tersedia untuk pemenuhan pesanan cepat. Dukungan pemrosesan klaim garansi.
      icon: tabler:tool
    - title: Dokumentasi Kepatuhan
      description: 'Paket dokumentasi kepatuhan lengkap untuk pasar Anda: DoC CE, data pelat pembuat, manual pemilik, dan dukungan pendaftaran regulasi. Menghilangkan beban kepatuhan Anda.'
      icon: tabler:file-certificate
content_requirements:
  tagline: Apa yang Kami Cari
  title: Distributor<br />Persyaratan
  subtitle: Kami mencari mitra yang dapat secara profesional mewakili dan mendukung produk Aquafarer di wilayah mereka.
  items:
    - title: Pengetahuan Wilayah & Pasar
      description: Memiliki kehadiran yang mapan di pasar laut, olahraga air, atau rekreasi luar ruangan. Memahami peraturan lokal, preferensi konsumen, dan saluran distribusi untuk produk kapal.
      icon: tabler:target
    - title: Pengalaman Industri
      description: Minimal 2 tahun pengalaman dalam mendistribusikan peralatan laut, luar ruangan, atau olahraga. Memiliki rekam jejak yang terbukti dengan merek internasional dan operasi grosir B2B.
      icon: tabler:briefcase
    - title: Showroom atau Gudang
      description: Fasilitas fisik untuk menampilkan produk, menyimpan inventaris, dan layanan pelanggan. Kemampuan untuk memelihara unit demo dan inventaris suku cadang untuk wilayah Anda.
      icon: tabler:building-store
    - title: Komitmen terhadap Standar Merek
      description: Kesediaan untuk mempertahankan standar presentasi merek Aquafarer, memberikan dukungan pelanggan sesuai protokol layanan kami, dan berpartisipasi dalam pembaruan pelatihan produk tahunan.
      icon: tabler:star
content_process:
  tagline: Proses Aplikasi
  title: Dealer 4 Langkah<br />Proses Aplikasi
  subtitle: Dari pertanyaan awal hingga pengiriman pertama — proses onboarding yang sederhana.
  steps:
    - number: '01'
      title: Pertanyaan Awal & Kualifikasi
      description: Ajukan aplikasi distributor Anda dengan rincian perusahaan, wilayah yang diminati, lini produk saat ini, dan perkiraan volume tahunan. Kami meninjau dalam 5 hari kerja.
      timeline: 5 hari
    - number: '02'
      title: Tinjauan Bisnis & Ketentuan
      description: Pertemuan virtual untuk membahas strategi wilayah, tingkatan harga, dan ketentuan kemitraan. Tinjau persyaratan dokumentasi kepatuhan untuk pasar Anda. NDA penandatanganan jika diperlukan.
      timeline: 1-2 minggu
    - number: '03'
      title: Pesanan Contoh & Evaluasi
      description: Tempatkan pesanan sampel awal (2-5 unit) dengan harga distributor untuk evaluasi pasar dan pelatihan tim. Dokumentasi kepatuhan penuh dan persiapan demo termasuk.
      timeline: 30-45 hari
    - number: '04'
      title: Peluncuran & Dukungan Kemitraan
      description: Pesanan kontainer pertama dengan proteksi wilayah diaktifkan. Kit pemasaran telah dikirim, tim penjualan dilatih, dan manajer akun khusus ditugaskan. Tinjauan bisnis triwulanan sedang berjalan.
      timeline: Berlaku secara Berkelanjutan
content_application_docs:
  tagline: Dokumen Aplikasi
  title: Dokumen yang Diperlukan<br />untuk Aplikasi Dealer
  subtitle: Untuk mengajukan permohonan dealer Aquafarer, harap siapkan dokumen dan informasi berikut untuk tim peninjau kami.
  items:
    - title: Sertifikat Pendaftaran Bisnis
      description: Dokumen pendaftaran perusahaan yang sah yang menunjukkan nama entitas hukum, alamat terdaftar, dan lingkup bisnis yang mencakup distribusi peralatan laut, olahraga, atau luar ruangan.
      icon: tabler:file-text
    - title: Rencana Cakupan Wilayah
      description: Wilayah geografis yang diminati, jaringan ritel atau distribusi yang ada, segmen pelanggan target, dan volume tahunan yang diusulkan berdasarkan kategori produk (RIB, SUP, kayak).
      icon: tabler:map
    - title: Kemampuan Showroom atau Gudang
      description: Fasilitas fisik untuk pameran produk, penyimpanan inventaris, dan layanan pelanggan. Foto atau denah lantai yang menunjukkan area demo dan kapasitas penyimpanan suku cadang.
      icon: tabler:building
    - title: Pernyataan Kemampuan Keuangan
      description: 'Referensi bank atau laporan keuangan yang menegaskan kemampuan untuk melakukan pesanan kontainer awal dan mempertahankan inventaris. Pesanan awal minimum: satu kontainer 20ft (10-20 unit model campuran).'
      icon: tabler:coin
    - title: Kemampuan Dukungan Purna Jual
      description: Teknisi layanan yang terlatih atau dapat dilatih untuk pemeliharaan dan perbaikan perahu karet. Kemampuan pemrosesan klaim garansi dan komitmen inventaris suku cadang.
      icon: tabler:tool
    - title: Referensi Merek Sebelumnya
      description: Daftar merek peralatan laut/olahraga saat ini atau sebelumnya yang didistribusikan. Referensi kontak tersedia atas kesepakatan bersama. Startup tanpa pengalaman distribusi sebelumnya dapat memenuhi syarat dengan komitmen keuangan yang lebih kuat.
      icon: tabler:users
faq:
  title: Program Dealer — Pertanyaan yang Sering Diajukan
  questions:
    - q: Berapa jumlah pesanan minimum untuk distributor?
      a: Distributor MOQ mulai dari 10-20 unit per pesanan, dengan fleksibilitas untuk model campuran (RIB, inflatable, SUP). Pesanan sampel awal 2-5 unit tersedia dengan harga distributor untuk evaluasi pasar.
    - q: Apakah Anda menawarkan hak wilayah eksklusif?
      a: Hak wilayah eksklusif tersedia untuk distributor yang memenuhi komitmen volume tahunan dan menjaga standar merek. Pengaturan semi-eksklusif dan non-eksklusif juga tersedia untuk pasar yang sedang berkembang.
    - q: Dukungan pemasaran apa yang Anda berikan?
      a: Kami menyediakan paket pemasaran komprehensif termasuk fotografi produk profesional, lembar spesifikasi, template dokumentasi kepatuhan, perpustakaan konten media sosial, dan materi bermerek bersama. Diperbarui setiap tahun dengan peluncuran produk baru.
    - q: Bagaimana klaim garansi ditangani?
      a: 'Distributor berfungsi sebagai titik kontak pertama untuk klaim garansi. Kami menyediakan kriteria garansi yang jelas, protokol dokumentasi foto, dan pemrosesan penggantian atau kredit yang cepat. Ketentuan garansi: 5 tahun terbatas pada kain/seam/hull tabung perahu; 2 tahun pada SUP dan aksesori.'
    - q: Bisakah saya memberikan label pribadi pada produk Aquafarer dengan merek saya sendiri?
      a: Ya, melalui program OEM/ODM kami. Opsi label pribadi termasuk grafik tabung khusus, branding konsol, kemasan ritel, dan dokumentasi kepatuhan di bawah nama merek Anda. Lihat halaman layanan OEM/ODM kami untuk detail.
    - q: Dokumentasi kepatuhan apa yang disertakan untuk distributor?
      a: Setiap pengiriman termasuk DoC spesifik model CE, data plat pembuat, manual pemilik, dan dokumentasi pengiriman. Kami juga menyediakan dukungan pendaftaran regulasi untuk wilayah Anda dan membantu dengan persyaratan kepatuhan lokal.
