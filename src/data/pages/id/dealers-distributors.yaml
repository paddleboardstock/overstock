hero:
  tagline: Program Dealer
  title: Menjadi Aquafarer<br />Distributor
  subtitle: Bermitra dengan CE-bersertifikasi RIB dan produsen kendaraan air tiup yang melayani 50+ negara. Perlindungan wilayah, dukungan pemasaran, dan harga kompetitif untuk distributor kelautan yang sudah mapan.
  image:
    src: https://assets.aquafarer.com/images/aquafarer/hero/production-dept.webp
    alt: Aquafarer program dealer dan distributor
direct_answer: Aquafarer menawarkan kemitraan dealer dan distribusi dengan perlindungan wilayah, harga grosir kompetitif, paket dukungan pemasaran, dan dokumentasi kepatuhan lengkap (CE, ISO 9001, BSCI). MOQ dimulai dari 10-20 unit per pesanan dengan manajemen akun khusus.
