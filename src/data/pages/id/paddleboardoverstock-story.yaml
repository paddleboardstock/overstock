hero:
  tagline: Kisah Kami
  title: Paddle Board Overstock — Kebebasan Rekayasa di Air
  subtitle: 'Dari bengkel pesisir hingga produsen kelautan global — perjalanan kami dibangun atas keyakinan yang keras kepala: kapal air harus dirancang seolah-olah mereka berarti, karena memang demikian.'
  image:
