timeline:
  - year: '2012'
    title: Yayasan Manufaktur Kelautan
    body: Paddle Board Overstock dimulai sebagai bengkel papan dayung tiup khusus di Weihai, China, berkomitmen pada kerajinan laut dan pembuatan papan. Fokus awal adalah membangun produk tiup yang andal melalui pengalaman rekayasa praktis dan disiplin manufaktur.
  - year: '2015'
    title: Ekspor Pertama
    body: Pesanan ekspor awal mencapai Jepang dan Korea, menandai masuknya Paddle Board Overstock ke pasar internasional. Perusahaan mulai melayani para pengayuh dan penggemar olahraga air di luar China.
  - year: '2018'
    title: Perluasan Pabrik
    body: Dipindahkan ke fasilitas produksi seluas 12.000 m². Menambah jalur pengelasan RF dan drop-stitch kapasitas produksi, memungkinkan manufaktur skala besar dan sistem kontrol kualitas yang lebih baik.
  - year: '2020'
    title: Pusat R&D Didirikan
    body: Membuka pusat R&D khusus dengan PVC laboratorium kain, tangki uji hidrodinamika, dan studio simulasi CAD/FEA. Pengembangan produk diperluas untuk fokus pada konstruksi ringan, daya tahan yang lebih baik, dan desain yang berpusat pada pengguna.
  - year: '2022'
    title: Pertumbuhan Global
    body: Berkembang menjadi 14 insinyur R&D dan 200+ pekerja. Papan telah menjangkau pengayuh di Eropa, Amerika, dan Asia-Pasifik, dikirim ke 50+ negara.
  - year: '2024'
    title: Studio Inovasi & Desain
    body: Meluncurkan studio desain dan inovasi layanan penuh untuk seri papan baru, dari konsep hingga produksi. Memperluas dek seri seni khas kami dan platform tur.
  - year: '2026'
    title: Membangun Masa Depan Eksplorasi Air
    body: Hari ini, Paddle Board Overstock terus mengembangkan papan SUP tiup, perlengkapan mendayung, dan solusi laut yang disesuaikan — menghubungkan orang dan organisasi dengan perairan dunia. 50+ negara dilayani, kapasitas tahunan 15.000 unit.
content_founding:
  tagline: Awal Mula
  title: Lahir di Tepi Laut
  subtitle: 'Paddle Board Overstock dimulai di bengkel pesisir di Weihai dengan satu papan dan sebuah visi: membangun papan dayung tiup yang dapat menghadapi kondisi laut nyata.'
  paragraphs:
    - Pada tahun 2012, para pendiri kami melihat adanya celah di pasar — kebanyakan papan tiup murah tetapi tidak andal, atau berkualitas tinggi tetapi harganya sangat mahal. Mereka percaya ada ruang bagi produsen yang dapat memberikan kualitas dan nilai sekaligus.
    - Lambung pertama dibangun secara manual, diuji di perairan lokal, dan disempurnakan berdasarkan umpan balik nyata dari para nelayan dan operator komersial kecil. Umpan balik itu — bangun, uji, dengarkan, tingkatkan — tetap menjadi inti filosofi rekayasa kami hingga hari ini.
    - Pada tahun 2015, kabar telah menyebar ke luar Weihai. Para penggemar dayung dan toko olahraga air di seluruh Asia mulai meminta papan. Apa yang dimulai sebagai bengkel lokal mulai menjadi merek global.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock bengkel produksi awal dan manufaktur
content_growth:
  tagline: Pertumbuhan & Inovasi
  title: Dari Bengkel ke Fasilitas seluas 12.000 m²
  subtitle: Investasi berkelanjutan dalam sumber daya manusia, peralatan, dan proses telah mengubah Paddle Board Overstock menjadi fasilitas manufaktur kelautan modern.
  paragraphs:
    - Seiring dengan meningkatnya permintaan, fasilitas kami juga berkembang. Kami memperluas dari bengkel kecil menjadi pabrik seluas 12.000 m² dengan jalur produksi khusus untuk papan SUP, aksesori, dan perlengkapan keselamatan.
    - Kami berinvestasi pada CNC mesin pemotong, peralatan las frekuensi tinggi, lini produksi drop stitch, dan rig pengujian komprehensif — memungkinkan kami mengendalikan setiap aspek kualitas produksi.
    - Saat ini, tim kami yang terdiri dari 200-300 orang mencakup insinyur kelautan, ilmuwan material, spesialis kontrol kualitas, dan pengrajin terampil — banyak di antaranya telah bersama Paddle Board Overstock sejak masa-masa awal.
founder:
  tagline: Temui Pendiri
  title: Dibangun oleh seorang Waterman
  subtitle: Pendiri David Chen menggabungkan keahlian di bidang manufaktur dan hasrat seumur hidup untuk olahraga air — kombinasi yang mendefinisikan bagaimana Paddle Board Overstock mendekati pengembangan produk.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Pendiri Paddle Board Overstock
  story:
    - David Chen tumbuh di pesisir Weihai, di mana laut bukan tujuan liburan tetapi cara hidup. Dia menghabiskan masa mudanya dengan mendayung, berlayar, dan memancing di Laut Kuning — pengalaman yang memberinya pemahaman intuitif tentang apa yang harus ditanggung oleh papan dayung.
    - Sebelum mendirikan Paddle Board Overstock, David menghabiskan satu dekade di bidang manufaktur kelautan, bekerja di produksi, kualitas, dan perdagangan internasional. Dia memimpin program produksi dan kualitas untuk pasar Eropa dan Amerika Utara, mempelajari harapan para penggemar dayung global secara langsung.
    - 'Pada tahun 2012, ia mendirikan Paddle Board Overstock dengan misi sederhana: membuat papan dayung tiup yang dapat ia percayai untuk keluarganya di atas air. Standar pribadi itu — apakah saya akan menggunakan ini? — tetap menjadi uji akhir untuk setiap produk yang keluar dari pabrik.'
    - Hari ini, David memimpin strategi produk dan mengawasi tim R&D, secara pribadi meninjau desain baru dan menguji prototipe di perairan lepas Weihai. Dia percaya bahwa produk yang hebat berasal dari pemahaman baik tentang teknik maupun pengalaman.
philosophy:
  tagline: Filosofi Merek
  title: Kebebasan Rekayasa di Air
  body: Kebebasan di atas air bukan hanya tentang bergerak. Itu berarti menemukan tempat baru, menciptakan pengalaman luar ruangan, menghubungkan orang dengan alam, dan memungkinkan misi profesional. Rekayasa membuat kebebasan itu menjadi mungkin.
  pillars:
    - title: Keandalan Utama
      body: Lingkungan air menuntut kepercayaan. Produk Paddle Board Overstock dirancang dengan mempertimbangkan stabilitas, daya tahan, keselamatan, dan kinerja yang konsisten.
    - title: Desain Berpusat pada Manusia
      body: Produk harus melayani orang, bukan teknologi. Setiap keputusan desain dimulai dengan memahami bagaimana orang menggunakan papan mereka, di mana mereka menjelajah, dan tantangan apa yang mereka hadapi.
    - title: Eksplorasi yang Mudah Diakses
      body: Air tidak seharusnya hanya milik para ahli. Paddle Board Overstock menciptakan peralatan yang memungkinkan lebih banyak orang untuk mengalami sungai, danau, laut, dan lingkungan pesisir dengan aman.
    - title: Inovasi Berkelanjutan
      body: Inovasi bukan hanya menciptakan produk baru. Inovasi juga meningkatkan setiap detail — material, struktur, manufaktur, dan pengalaman pengguna.
engineeringDna:
  tagline: DNA Rekayasa
  title: Bagaimana Paddle Board Overstock Menciptakan Produk
  areas:
    - title: Ilmu Material
      body: Paddle Board Overstock berfokus pada pemilihan bahan yang sesuai untuk berbagai lingkungan laut. Pertimbangan utama meliputi ketahanan terhadap abrasi, ketahanan UV, kestabilan tekanan, dan daya tahan jangka panjang.
      items:
        - Ketahanan Abrasi
        - Resistensi UV
        - Stabilitas Tekanan
        - Daya Tahan Jangka Panjang
    - title: Teknik Struktur
      body: Papan dayung tiup memerlukan keseimbangan yang tepat antara kekakuan, berat, portabilitas, dan stabilitas. Paddle Board Overstock teknik berfokus pada mengoptimalkan faktor-faktor ini melalui teknologi inti drop-stitch dan konstruksi jahitan yang canggih.
      items:
        - Kekakuan
        - Optimisasi Berat
        - Portabilitas
        - Stabilitas
    - title: Presisi Manufaktur
      body: 'Setiap produk melewati proses terkontrol: persiapan material, pemotongan presisi, pengelasan dan perekat, perakitan, inspeksi kualitas, dan verifikasi kinerja.'
      items:
        - Persiapan Material
        - Pemotongan Presisi
        - Pengelasan & Perekat
        - Perakitan & QC
    - title: Teknik Skenario Pengguna
      body: Produk dikembangkan berdasarkan aplikasi dayung nyata — rekreasi, petualangan, keluarga, dan tur — memastikan setiap desain memenuhi tuntutan spesifik dari lingkungan yang ditargetkan.
      items:
        - Rekreasi
        - Petualangan
        - Keluarga
        - Bersepeda Tur
