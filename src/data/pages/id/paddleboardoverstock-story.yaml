timeline:
  - year: '2012'
    title: Yayasan Manufaktur Kelautan
    body: Paddle Board Overstock dimulai sebagai bengkel khusus perahu tiup di Qingdao, Tiongkok, yang berkomitmen pada keterampilan kelautan dan pembuatan perahu tiup. Fokus awal adalah membangun produk tiup yang andal melalui pengalaman teknik praktis dan disiplin manufaktur.
  - year: '2015'
    title: Ekspor & CE Sertifikasi Pertama
    body: Pesanan ekspor awal sampai ke Jepang dan Korea.CE Sertifikasi dicapai untuk lini produk inti, menandai Paddle Board Overstockmasuknya mereka ke pasar internasional. Perusahaan mulai melayani pengguna komersial dan rekreasi di luar China.
  - year: '2018'
    title: Perluasan Pabrik
    body: Dipindahkan ke fasilitas produksi seluas 12.000 m². Menambah jalur pengelasan RF dan drop-stitch kapasitas produksi, memungkinkan manufaktur skala besar dan sistem kontrol kualitas yang lebih baik.
  - year: '2020'
    title: Pusat R&D Didirikan
    body: Membuka pusat R&D khusus dengan PVC laboratorium kain, tangki uji hidrodinamika, dan studio simulasi CAD/FEA. Pengembangan produk diperluas untuk fokus pada konstruksi ringan, daya tahan yang lebih baik, dan desain yang berpusat pada pengguna.
  - year: '2022'
    title: Sertifikasi & Pertumbuhan Global
    body: Mencapai ISO sertifikasi 9001. Diperluas menjadi 14 insinyur R&D dan 200+ pekerja. Produk menjangkau pelanggan di seluruh Eropa, Amerika, dan Asia-Pasifik melalui distributor dan OEM kemitraan.
  - year: '2024'
    title: Studio Inovasi & Desain
    body: Meluncurkan studio desain dan inovasi layanan penuh untuk ODM proyek kustom, mulai dari konsep hingga produksi. Memperkuat aplikasi kelautan profesional termasuk tender penyelamatan, komersial, dan pemerintah.
  - year: '2026'
    title: Membangun Masa Depan Eksplorasi Air
    body: Saat ini, Paddle Board Overstock terus mengembangkan perahu tiup, SUP sistem, dan solusi kelautan yang disesuaikan — menghubungkan orang dan organisasi dengan perairan dunia. 50+ negara melayani, kapasitas tahunan 15.000 unit.
content_founding:
  tagline: Awal Mula
  title: Lahir di Tepi Laut
  subtitle: 'Paddle Board Overstock dimulai di bengkel pesisir di Qingdao dengan satu perahu dan visi: membangun kapal tiup yang mampu menangani kondisi laut nyata.'
  paragraphs:
    - Pada tahun 2012, para pendiri kami melihat adanya celah di pasar — sebagian besar perahu tiup terjangkau namun tidak dapat diandalkan, atau berkualitas tinggi namun sangat mahal. Mereka percaya ada ruang bagi produsen yang mampu memberikan kualitas dan nilai sekaligus.
    - Lambung pertama dibangun secara manual, diuji di perairan lokal, dan disempurnakan berdasarkan umpan balik nyata dari para nelayan dan operator komersial kecil. Umpan balik itu — bangun, uji, dengarkan, tingkatkan — tetap menjadi inti filosofi rekayasa kami hingga hari ini.
    - Pada tahun 2015, kabar telah menyebar melampaui Qingdao. Distributor internasional mulai meminta sampel. Apa yang awalnya hanya bengkel lokal kini menjadi pemasok global.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-production-department.webp
    alt: Paddle Board Overstock Bengkel produksi awal dan manufaktur
content_growth:
  tagline: Pertumbuhan & Inovasi
  title: Dari Bengkel ke Fasilitas seluas 12.000 m²
  subtitle: Investasi berkelanjutan pada manusia, peralatan, dan proses telah berubah Paddle Board Overstock menjadi fasilitas manufaktur kelautan modern.
  paragraphs:
    - Seiring meningkatnya permintaan, fasilitas kami juga meningkat. Kami berkembang dari bengkel kecil menjadi pabrik seluas 12.000 m² dengan lini produksi khusus untuk RIB kapal, perahu tiup, SUP papan, dan aksesori.
    - Kami berinvestasi pada CNC mesin pemotong, peralatan las frekuensi tinggi, lini produksi drop stitch, dan rig pengujian komprehensif — memungkinkan kami mengendalikan setiap aspek kualitas produksi.
    - Saat ini, tim kami yang terdiri dari 200-300 orang terdiri dari insinyur kelautan, ilmuwan material, spesialis kontrol kualitas, dan pengrajin terampil — banyak di antaranya telah bergabung Paddle Board Overstock sejak masa awal.
founder:
  tagline: Temui Pendiri
  title: Dibangun oleh seorang Waterman
  subtitle: Pendiri David Chen menggabungkan keahlian manufaktur dan hasrat seumur hidup terhadap olahraga air — kombinasi yang mendefinisikan bagaimana Paddle Board Overstock pendekatan pengembangan produk.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/team/paddleboardoverstock-meeting-overseas.webp
    alt: David Chen — Pendiri Paddle Board Overstock
  story:
    - David Chen tumbuh di pesisir Qingdao, di mana laut bukanlah tujuan liburan melainkan gaya hidup. Ia menghabiskan masa mudanya dengan kayak, berlayar, dan memancing di Laut Kuning — pengalaman yang memberinya pemahaman intuitif tentang apa yang harus ditanggung oleh perahu air.
    - Sebelum mendirikanPaddle Board Overstock, David menghabiskan satu dekade di manufaktur kelautan, bekerja di bidang produksi, kualitas, dan perdagangan internasional. Ia mengelola OEM program untuk merek-merek Eropa dan Amerika Utara, mempelajari standar dan harapan pasar global secara langsung.
    - 'Pada tahun 2012, ia mendirikan Paddle Board Overstock dengan misi sederhana: membangun kapal tiup yang akan ia percayakan bersama keluarganya di atas air. Standar pribadi itu — apakah saya akan menggunakan ini? — tetap menjadi ujian akhir untuk setiap produk yang keluar dari pabrik.'
    - Saat ini, David memimpin strategi produk dan mengawasi tim R&D, secara pribadi meninjau desain baru dan menguji prototipe di perairan lepas Qingdao. Ia percaya bahwa produk hebat berasal dari pemahaman baik dari rekayasa maupun pengalaman.
philosophy:
  tagline: Filosofi Merek
  title: Kebebasan Rekayasa di Air
  body: Kebebasan di atas air bukan hanya tentang bergerak. Itu berarti menemukan tempat baru, menciptakan pengalaman luar ruangan, menghubungkan orang dengan alam, dan memungkinkan misi profesional. Rekayasa membuat kebebasan itu menjadi mungkin.
  pillars:
    - title: Keandalan Utama
      body: Lingkungan air menuntut kepercayaan.Paddle Board Overstock Produk dirancang berdasarkan stabilitas, daya tahan, keamanan, dan kinerja yang konsisten.
    - title: Desain Berpusat pada Manusia
      body: Produk harus melayani manusia, bukan teknologi. Setiap keputusan desain dimulai dengan memahami bagaimana orang menggunakan kapal air, di mana mereka menjelajah, dan tantangan apa yang mereka hadapi.
    - title: Eksplorasi yang Mudah Diakses
      body: Air tidak seharusnya hanya dimiliki oleh para ahli.Paddle Board Overstock menciptakan peralatan yang memungkinkan lebih banyak orang merasakan sungai, danau, lautan, dan lingkungan pesisir dengan aman.
    - title: Inovasi Berkelanjutan
      body: Inovasi bukan hanya menciptakan produk baru. Inovasi juga meningkatkan setiap detail — material, struktur, manufaktur, dan pengalaman pengguna.
engineeringDna:
  tagline: DNA Rekayasa
  title: Cara Paddle Board Overstock Membuat Produk
  areas:
    - title: Ilmu Material
      body: Paddle Board Overstock berfokus pada pemilihan material yang tepat untuk berbagai lingkungan laut. Pertimbangan utama termasuk ketahanan terhadap abrasi, ketahanan terhadap UV, stabilitas tekanan, dan daya tahan jangka panjang.
      items:
        - Ketahanan Abrasi
        - Resistensi UV
        - Stabilitas Tekanan
        - Daya Tahan Jangka Panjang
    - title: Teknik Struktur
      body: Kapal karet tiup membutuhkan keseimbangan yang tepat antara kekakuan, berat, portabilitas, dan stabilitas. Teknik Paddle Board Overstock berfokus pada mengoptimalkan faktor-faktor ini melalui teknologi inti drop-stitch dan konstruksi jahitan yang canggih.
      items:
        - Kekakuan
        - Optimisasi Berat
        - Portabilitas
        - Stabilitas
    - title: Presisi Manufaktur
      body: 'Setiap produk melewati proses terkontrol: persiapan material, pemotongan presisi, pengelasan dan perekat, perakitan, inspeksi kualitas, dan verifikasi kinerja.'
      items:
        - Persiapan Material
        - Pemotongan Presisi
        - Pengelasan & Perekat
        - Perakitan & QC
    - title: Teknik Skenario Pengguna
      body: Produk dikembangkan berdasarkan aplikasi nyata — rekreasi, petualangan, dan penggunaan profesional — untuk memastikan setiap desain memenuhi tuntutan spesifik dari lingkungan yang dituju.
      items:
        - Rekreasi
        - Petualangan
        - Professional
        - Komersial
