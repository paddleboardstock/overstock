hero:
  tagline: Kisah Kami
  title: Paddle Board Overstock — Rekayasa Kebebasan di Air
  subtitle: 'Dari bengkel pesisir menjadi produsen peralatan laut global — perjalanan kami dibangun atas keyakinan yang teguh: papan dayung harus dirancang seolah mereka penting, karena memang penting.'
