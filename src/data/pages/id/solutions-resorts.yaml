testimonial:
  content: Paddle Board Overstock merancang dan melengkapi seluruh program aktivitas pantai kami di tiga properti resor. 120 SUPs, infrastruktur keselamatan, dan pelatihan staf — semuanya dikirim dalam satu pengiriman. Partisipasi tamu kami dalam aktivitas air meningkat sebesar 60% pada musim pertama.
  name: Sophie Laurent
  title: Direktur Pengalaman Tamu, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Profil Resor
  title: Solusi Perhotelan Tepi Air<br />Berdasarkan Tipe Properti
  subtitle: Setiap properti resor memiliki profil tamu, campuran aktivitas, dan ritme operasional yang unik — dari penginapan eco-boutique hingga resor pantai mewah yang luas. Kami merancang program olahraga air yang sesuai dengan kelas properti dan harapan tamu.
  items:
    - title: Resor Mewah Tepi Pantai
      subtitle: Transfer VIP, aktivitas air, pengalaman tamu premium
      description: Properti pantai mewah tingkat tinggi — Four Seasons, Aman, dan grup mewah serupa — di mana olahraga air menjadi fasilitas utama yang meningkatkan skor kepuasan dan pendapatan tambahan. Armada harus terlihat premium, menawarkan variasi untuk semua usia dan tingkat kemampuan, serta terintegrasi dengan sistem concierge dan pemesanan resor yang ada. Harapan penampilan tamu sangat tinggi — kondisi dan penyajian peralatan secara langsung memengaruhi ulasan bintang 5.
      features:
        - Armada bermerek premium dari SUPs dengan warna resor yang serasi
        - 'Penampilan siap tamu: warna resor yang serasi, merek/logo, tampilan peralatan yang tertata'
        - Papan seri seni khas untuk pengalaman tamu premium dan momen foto
        - 'Infrastruktur keselamatan terintegrasi: tali pelampung, pos penjaga pantai, AED'
        - 'Manajemen pendapatan: template harga dinamis, pelatihan upsell, bundling paket'
    - title: Resor Pulau Pribadi
      subtitle: Aktivitas air tamu yang tenang dan mandiri
      description: 'Resor pulau pribadi beroperasi di lokasi terpencil di mana logistik kompleks dan setiap pengiriman sangat penting. Aktivitas air tamu harus mandiri: peralatan yang disimpan secara ringkas, dapat dipompa sesuai permintaan, membutuhkan perawatan minimal, dan tampil indah saat tamu tiba. Kami merencanakan program armada di sekitar jendela pesawat amfibi dan pengiriman laut, dan konstruksi kami yang tahan lama menjaga peralatan tetap siap untuk tamu selama musim panjang tanpa dukungan daratan.'
      features:
        - Armada tiup yang kompak — mengirim dan menyimpan secara efisien di pulau-pulau terpencil
        - Konstruksi kelas komersial PVC untuk penggunaan tamu multi-musim
        - Perawatan mudah di lokasi dengan kit perbaikan yang disertakan dan panduan video
        - Branding resor kustom yang serasi dengan estetika pulau
    - title: Resor Tepi Danau & Eco
      subtitle: Pengalaman tamu yang terintegrasi dengan alam
      description: Properti tepi danau, eco-lodge, dan tempat peristirahatan alam yang menawarkan aktivitas air yang tenang dan berdampak rendah yang melengkapi lingkungan alami. Peralatan harus tidak bermotor jika memungkinkan, mudah disimpan di tempat yang terbatas, dan tenang digunakan untuk menjaga pengalaman ambient bagi semua tamu.
      features:
        - Armada non-motor SUP dalam seri seni yang terinspirasi dari alam
        - Stasiun inflasi pompa listrik yang tenang untuk penggunaan tamu sesuai permintaan
        - Material dan kemasan ramah lingkungan sesuai dengan branding keberlanjutan
        - Rak penyimpanan dan sistem organisasi di dermaga sudah termasuk
    - title: Klub Pantai
      subtitle: Hiburan tamu dan suasana tepi laut
      description: Klub pantai mengoperasikan lingkungan yang penuh energi dan fokus visual di mana peralatan menjadi bagian dari suasana. Mereka membutuhkan papan dayung bergaya untuk hiburan tamu, SUP penyewaan untuk aktivitas di tepi pantai, dan perlengkapan yang tampilannya sebagus tempat itu sendiri. Armada harus mudah dioperasikan, tahan terhadap penggunaan harian oleh tamu dengan berbagai tingkat keahlian, dan dapat dikerahkan dengan cepat pada jam sibuk.
      features:
        - Seri seni khas SUPs yang juga berfungsi sebagai dekorasi tempat
        - Armada siap SUP sewa untuk hiburan tamu
        - Warna dan branding kustom yang cocok dengan identitas visual klub pantai
        - Sistem peluncuran dan pengambilan cepat untuk operasi dengan pergantian tinggi
        - UV-konstruksi tahan untuk paparan air asin harian
    - title: Klub Anggota Pribadi & Klub Yacht
      subtitle: Anggota olahraga air dan program dayung eksklusif
      description: Klub swasta di mana olahraga air menjadi keuntungan anggota daripada pendorong pendapatan. Peralatan harus memenuhi standar estetika yang lebih tinggi, tersedia sesuai permintaan untuk anggota, dan memerlukan pengawasan staf minimal. Klub yacht marina menggunakan SUP armada bermerek untuk rekreasi anggota di sekitar pelabuhan. Penyimpanan dan perawatan harus tidak terlihat oleh anggota.
      features:
        - Armada bermerek premium SUP untuk olahraga air anggota
        - 'Perlengkapan premium: EVA dek, warna anggota khusus, pelapis bermerek'
        - Sistem check-out swalayan untuk akses anggota tanpa staf
        - Penyimpanan di luar musim dan program penyegaran tahunan
    - title: Hotel Berfokus pada Petualangan & Aktivitas
      subtitle: Tur berpemandu, SUP yoga, perjalanan snorkeling, kegiatan kelompok
      description: Properti yang memposisikan diri sebagai tujuan petualangan — menawarkan tur berpemandu, SUP yoga, dayung saat matahari terbenam, perjalanan snorkeling, dan kegiatan kelompok. Armada perlu mendukung model sewa bebas dan program berpemandu, dengan peralatan yang bisa beralih dengan mulus antara penggunaan mandiri tamu dan tur yang dipimpin instruktur. Properti ini membutuhkan peralatan yang tahan lama untuk penggunaan intensif, dengan pembersihan yang mudah antara kelompok tamu.
      features:
        - Armada campuran serbaguna yang mendukung model sewa + tur berpemandu
        - Platform SUP ekstra-stabil untuk kegiatan kelompok
        - 'Peralatan pemandu: papan instruktur, kotak kedap air, komunikasi tahan air'
        - 'Rotasi peralatan musiman: armada musim panas → program penyimpanan musim dingin'
        - Konstruksi tahan lama yang dinilai untuk penggunaan harian tamu dengan perawatan minimal
