testimonial:
  content: Paddle Board Overstock merancang dan melengkapi seluruh program aktivitas pantai kami di tiga properti resor. 80 SUPs, 40 kayak, infrastruktur keselamatan, dan pelatihan staf — semuanya dikirim dalam satu pengiriman. Partisipasi tamu dalam aktivitas air meningkat sebesar 60% pada musim pertama.
  name: Sophie Laurent
  title: Direktur Pengalaman Tamu, Azure Bay Resorts — Phuket, Thailand
content_segments:
  tagline: Profil Resor
  title: Solusi Perhotelan Tepi Air<br />Berdasarkan Tipe Properti
  subtitle: Setiap properti resor memiliki profil tamu, campuran aktivitas, dan ritme operasional yang unik — dari penginapan eco-boutique hingga resor pantai mewah yang luas. Kami merancang program olahraga air yang sesuai dengan kelas properti dan harapan tamu.
  items:
    - title: Resor Mewah Tepi Pantai
      subtitle: Transfer VIP, aktivitas air, pengalaman tamu premium
      description: Properti pantai mewah tingkat tinggi — Four Seasons, Aman, dan grup mewah serupa — di mana olahraga air menjadi fasilitas utama yang meningkatkan skor kepuasan dan pendapatan tambahan. Armada harus terlihat premium, menawarkan variasi untuk semua usia dan tingkat kemampuan, serta terintegrasi dengan sistem concierge dan pemesanan resor yang ada. Harapan penampilan tamu sangat tinggi — kondisi dan penyajian peralatan secara langsung memengaruhi ulasan bintang 5.
      features:
        - 'Armada bermerek premium: SUPs, kayak, perahu pedal, dan RIB kecil'
        - 'Penampilan siap tamu: warna resor yang serasi, merek/logo, tampilan peralatan yang tertata'
        - RIB kecil mewah untuk transfer tamu VIP dengan pelapis khusus dan kesesuaian warna
        - 'Infrastruktur keselamatan terintegrasi: tali pelampung, pos penjaga pantai, AED'
        - 'Manajemen pendapatan: template harga dinamis, pelatihan upsell, bundling paket'
    - title: Resor Pulau Pribadi
      subtitle: Transportasi tamu segala cuaca — tanpa waktu henti, keandalan mutlak
      description: Resor pulau pribadi beroperasi di lokasi terpencil di mana kapal adalah satu-satunya koneksi ke daratan utama. Transfer tamu harian, pengiriman pasokan, dan evakuasi medis darurat bergantung pada satu kapal — setiap waktu henti langsung memengaruhi pengalaman tamu dan operasi resor. Operator ini membutuhkan kapal yang dapat beroperasi dengan andal dalam segala kondisi cuaca, memerlukan perawatan minimal, dan memiliki sistem cadangan untuk keandalan misi yang kritis. Kapal juga harus tampil indah saat tamu tiba di pulau.
      features:
        - Konfigurasi segala cuaca RIB dengan enclosure cuaca penuh dan tabung tugas berat
        - Penyediaan mesin ganda atau cadangan untuk operasi tanpa waktu henti
        - Konstruksi kelas komersial Hypalon untuk masa pakai 5-8 tahun dalam layanan jarak jauh
        - Desain mudah dirawat dengan komponen yang mudah diakses untuk servis di lokasi
        - Branding resor kustom dan estetika pulau yang serasi dengan pelapis premium
    - title: Resor Tepi Danau & Eco
      subtitle: Pengalaman tamu yang terintegrasi dengan alam
      description: Properti tepi danau, eco-lodge, dan tempat peristirahatan alam yang menawarkan aktivitas air yang tenang dan berdampak rendah yang melengkapi lingkungan alami. Peralatan sebaiknya tidak bermotor jika memungkinkan, mudah disimpan di boathouse dengan ruang terbatas, dan tenang digunakan untuk menjaga pengalaman ambient bagi semua tamu.
      features:
        - 'Armada non-motor: SUPs, kayak, kano, dan perahu dayung'
        - Stasiun inflasi pompa listrik yang tenang untuk penggunaan tamu sesuai permintaan
        - Material dan kemasan ramah lingkungan sesuai dengan branding keberlanjutan
        - Rak penyimpanan dan sistem organisasi rumah perahu termasuk
    - title: Klub Pantai
      subtitle: Transfer tamu, hiburan, kemewahan RIBskecil
      description: Klub pantai mengoperasikan lingkungan yang penuh energi dan fokus visual di mana peralatan menjadi bagian dari suasana. Mereka membutuhkan kemewahan kecil RIBs untuk transfer tamu dari hotel atau dermaga terdekat, serta mainan air untuk hiburan tamu — menarik jet ski, seluncuran tiup, dan papan dayung. Armada harus terlihat bergaya, mudah dioperasikan, dan tahan terhadap penggunaan sehari-hari oleh tamu dengan tingkat keterampilan yang berbeda-beda. Penyimpanan dan penempatan cepat sangat penting selama jam sibuk.
      features:
        - Kemewahan kompak RIB (3,3-4,3m) untuk transfer tamu dan layanan tender
        - 'Mainan air: alat tiup yang dapat ditarik, SUP papan, kayak untuk hiburan tamu'
        - Warna dan branding kustom yang cocok dengan identitas visual klub pantai
        - Sistem peluncuran dan pengambilan cepat untuk operasi dengan pergantian tinggi
        - Konstruksi tahan lama Hypalon untuk paparan air asin harian dan UV
    - title: Klub Anggota Pribadi & Klub Yacht
      subtitle: Transportasi pelabuhan, tender anggota, olahraga air eksklusif
      description: Klub swasta di mana olahraga air dan transportasi perahu menjadi keuntungan anggota, bukan penghasil pendapatan. Peralatan harus memenuhi standar estetika yang lebih tinggi, tersedia sesuai permintaan untuk anggota, dan memerlukan pengawasan staf minimal. Klub yacht marina secara khusus membutuhkan tender untuk transportasi pelabuhan — memindahkan anggota antara dermaga, tambat, dan pantai. Penyimpanan dan pemeliharaan harus tidak terlihat oleh anggota.
      features:
        - Tender kelas atas RIB untuk transportasi pelabuhan dan layanan transfer anggota
        - 'Perlengkapan premium: EVA dek, warna anggota khusus, pelapis bermerek'
        - Sistem check-out swalayan untuk akses anggota tanpa staf
        - Penyimpanan di luar musim dan program penyegaran tahunan
    - title: Hotel Berfokus pada Petualangan & Aktivitas
      subtitle: Tur berpemandu, SUP yoga, perjalanan snorkeling, kegiatan kelompok
      description: Properti yang memposisikan diri sebagai tujuan petualangan — menawarkan tur berpemandu, SUP yoga, dayung saat matahari terbenam, perjalanan snorkeling, dan kegiatan kelompok. Armada perlu mendukung model sewa bebas dan program berpemandu, dengan peralatan yang bisa beralih dengan mulus antara penggunaan mandiri tamu dan tur yang dipimpin instruktur. Properti ini membutuhkan peralatan yang tahan lama untuk penggunaan intensif, dengan pembersihan yang mudah antara kelompok tamu.
      features:
        - Armada campuran serbaguna yang mendukung model sewa + tur berpemandu
        - Kayak tandem dan SUP platform ekstra-stabil untuk kegiatan kelompok
        - 'Peralatan pemandu: papan instruktur, kotak kedap air, komunikasi tahan air'
        - 'Rotasi peralatan musiman: armada musim panas → program penyimpanan musim dingin'
        - Konstruksi tahan lama yang dinilai untuk penggunaan harian tamu dengan perawatan minimal
