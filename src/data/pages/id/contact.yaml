hero_text:
  tagline: Kontak
  title: HUBUNGI KAMI
contact_form:
  id: form
  title: Kirimkan pesan kepada kami
  subtitle: Untuk pertanyaan tentang pesanan, saran ukuran, atau dukungan produk, hubungi kami. Kami akan membalas dalam satu hari kerja.
  email_to: info@paddleboardoverstock.com
  submit_button: Kirim Permintaan → Dapatkan Penawaran
  success_message: Terima kasih! Pesan Anda telah masuk ke kotak masuk kami. Kami akan membalas dalam satu hari kerja.
  error_message: Ada kesalahan saat mengirim pesan Anda. Silakan coba lagi atau kirim email langsung kepada kami.
  default_country_code: '+1'
  captcha:
    label: 'Anti-spam: silakan selesaikan berikut ini'
  fields:
    - name: namaDepan
      label: Nama Depan
      row: 1
    - name: namaBelakang
      label: Nama Belakang
      row: 1
    - name: namaPerusahaan
      label: Nama Perusahaan
      row: 2
    - name: address
      label: Alamat
      row: 3
    - name: zip
      label: Kode Pos
      row: 4
    - name: country
      label: Negara
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: Surel
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: volumePesanan
      label: Perkiraan Volume Pesanan
      row: 6
      type: select
      options:
        - value: ''
          label: Berapa banyak papan yang Anda beli?...
        - value: one
          label: Hanya satu papan
        - value: 2-4
          label: 2–4 papan
        - value: 5-plus
          label: 5+ papan (untuk keluarga, klub, atau penyewaan)
    - name: customization
      label: Apa yang bisa kami bantu?
      row: 7
      type: select
      options:
        - value: ''
          label: Pilih topik...
        - value: none
          label: Pertanyaan umum tentang produk
        - value: sizing
          label: Bantuan memilih papan yang tepat
        - value: order
          label: Pesanan, pembayaran atau pengiriman
        - value: warranty
          label: Dukungan garansi atau perbaikan
    - name: minatProduk
      label: Kategori Produk yang Menarik
      row: 8
      type: select
      options:
        - value: ''
          label: Pilih kategori produk...
        - value: all
          label: Semua produk / Katalog lengkap
        - value: sup
          label: SUP Papan / Papan Dayung
        - value: packages
          label: Paket SUP lengkap
        - value: accessory
          label: Aksesori (pompa, dayung, tas)
    - name: subject
      label: Subjek
      row: 9
    - name: message
      label: Pesan
      row: 10
      type: textarea
      rows: 6
