philosophy:
  tagline: Filosofi Desain
  title: Desain Berbasis Rekayasa<br />— Setiap Detail Penting
  subtitle: Filosofi rekayasa kami berpusat pada tiga prinsip yang membimbing setiap produk yang kami buat.
  list:
    - 'Keandalan Utama: Setiap produk Paddle Board Overstock diuji untuk tahan terhadap kondisi dunia nyata — dari ekspedisi air dingin hingga penyewaan di pantai tropis. Kami merancang secara berlebih di area yang paling penting.'
    - 'Presisi Manufaktur: Fasilitas kami menggunakan pemotongan canggih, pengelasan frekuensi tinggi, dan pengujian tekanan otomatis. Setiap jahitan, setiap katup, setiap sambungan memenuhi spesifikasi yang didokumentasikan.'
    - 'Inovasi Berkelanjutan: Tim R&D kami secara terus-menerus mengevaluasi bahan baru, metode produksi, dan peningkatan desain. Kami tidak menunggu masalah — kami mengantisipasinya.'
cta:
  title: Ingin mendiskusikan proyek dengan tim kami?
