hero:
  tagline: Tim Kami
  title: Orang-Orang di Balik Paddle Board Overstock<br />— Menciptakan Kebebasan dalam Air
  subtitle: Didirikan pada tahun 2012 di Weihai, Cina, Paddle Board Overstock dibangun oleh insinyur kelautan, ilmuwan material, dan penggemar olahraga air yang percaya dalam membuat papan dayung tiup kelas profesional dapat diakses di seluruh dunia.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock foto tim lengkap — teknik, produksi, dan kepemimpinan
founding:
  tagline: Pendiri Kami
  title: Dari Bengkel Pesisir<br />dengan Fasilitas 12.000 m²
  subtitle: Paddle Board Overstock didirikan oleh tim insinyur kelautan dengan pengalaman gabungan puluhan tahun dalam desain SUP tiup, konstruksi drop-stitch, dan manufaktur olahraga air global.
  items:
    - title: 'Didirikan: 2012'
      description: Didirikan di Weihai, Tiongkok — pusat maritim utama dengan warisan pembuatan kapal yang mendalam.
      icon: tabler:calendar
    - title: 200-300 Karyawan
      description: Termasuk 14+ insinyur R&D, spesialis pengendalian kualitas, dan teknisi produksi.
      icon: tabler:users
    - title: Fasilitas 12.000 m²
      description: Pabrik manufaktur khusus dengan 6 lini produksi untuk papan dan aksesori SUP.
      icon: tabler:building-factory
    - title: 50+ Negara Dilayani
      description: Mengekspor ke Eropa, Amerika, Timur Tengah, Asia-Pasifik, dan Afrika.
      icon: tabler:globe
leadership:
  tagline: Kepemimpinan
  title: Manajemen & Kepemimpinan Teknik
