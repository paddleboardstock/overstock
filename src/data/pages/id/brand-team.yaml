hero:
  tagline: Tim Kami
  title: Orang-Orang di Balik Paddle Board Overstock<br />— Menciptakan Kebebasan dalam Air
  subtitle: Didirikan pada 2012 di Qingdao, China, Paddle Board Overstock dibangun oleh insinyur kelautan, ilmuwan material, dan penggemar olahraga air yang percaya dalam membuat perahu tiup profesional dapat diakses secara global.
  image:
    src: /images/team-all.webp
    alt: Paddle Board Overstock foto seluruh tim — teknik, produksi, dan kepemimpinan
founding:
  tagline: Pendiri Kami
  title: Dari Bengkel Pesisir<br />dengan Fasilitas 12.000 m²
  subtitle: Paddle Board Overstock didirikan oleh tim insinyur kelautan dengan pengalaman gabungan puluhan tahun dalam desain perahu karet tiup, fabrikasi PVC/Hypalon, dan manufaktur peralatan kelautan global.
  items:
    - title: 'Didirikan: 2012'
      description: Berdiri di Qingdao, China — pusat maritim utama dengan warisan pembangunan kapal yang mendalam.
      icon: tabler:calendar
    - title: 200-300 Karyawan
      description: Termasuk 50+ insinyur R&D, spesialis pengendalian kualitas, dan teknisi produksi.
      icon: tabler:users
    - title: Fasilitas 12.000 m²
      description: Pabrik manufaktur khusus dengan 6 jalur produksi untuk RIBs, perahu karet tiup, dan papan SUP.
      icon: tabler:building-factory
    - title: 50+ Negara Dilayani
      description: Mengekspor ke Eropa, Amerika, Timur Tengah, Asia-Pasifik, dan Afrika.
      icon: tabler:globe
