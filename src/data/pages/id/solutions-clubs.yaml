testimonial:
  content: Kami memulai dengan Paket Pemula Klub untuk sekolah selancar kami di Portugal. 20 papan, dayung, rompi — semuanya tiba dalam waktu 3 minggu. Setelah dua musim, kami meningkatkan ke Paket Pro. Branding khusus dengan logo kami mengubah permainan untuk citra profesional kami.
  name: Ricardo Santos
  title: Pemilik, Algarve Surf Academy — Lagos, Portugal
content_segments:
  tagline: Profil Klub
  title: Solusi Klub Olahraga Air<br />Berdasarkan Jenis Klub
  subtitle: Dari klub dayung universitas hingga klub kapal pesiar pribadi eksklusif — setiap jenis klub memiliki kebutuhan peralatan, pola penggunaan, dan struktur anggaran yang unik. Kami menyesuaikan setiap paket untuk cocok dengan model klub tersebut.
  items:
    - title: Klub Dayung Universitas & Perguruan Tinggi
      subtitle: Armada mahasiswa dengan penggunaan tinggi
      description: Klub paddle yang dijalankan oleh mahasiswa atau didukung oleh institusi yang menjalankan SUP program untuk departemen rekreasi universitas. Peralatan menghadapi penggunaan yang sering dan berganti-ganti dengan tingkat keterampilan yang berbeda setiap semester. Daya tahan dan kemudahan perbaikan sangat penting, selain harga yang ramah anggaran untuk organisasi mahasiswa.
      features:
        - Konstruksi PVC ekstra-tahan lama yang dinilai untuk siklus penggunaan siswa
        - Rentang papan berkode warna berdasarkan tingkat keterampilan untuk manajemen armada yang mudah
        - Peralatan perbaikan + dukungan video on-call termasuk dengan setiap pesanan
        - Harga diskon untuk organisasi mahasiswa dan ketentuan pembayaran berdasarkan semester
    - title: Klub Dayung & Sosial Komunitas
      subtitle: Klub rekreasi berbasis keanggotaan
      description: Klub berbasis komunitas yang menawarkan SUP dan pengalaman mendayung sosial kepada anggota. Kebutuhan peralatan harus menyeimbangkan performa dan kenyamanan untuk berbagai rentang usia, dengan merek yang membangun identitas klub dan kebanggaan anggota. Efisiensi penyimpanan sangat penting bagi klub yang beroperasi dengan akses tepi air yang terbatas.
      features:
        - 'Armada campuran: SUPs serba guna dan tur'
        - 'Branding penuh klub: warna kustom, pencetakan logo, PFD bermerek'
        - Solusi penyimpanan kompak untuk peralatan tiup
        - 'Kit awal pertumbuhan keanggotaan: kartu referensi, fotografi bermerek'
    - title: Sekolah Selancar & SUP Akademi
      subtitle: Performa pantai dan pelatihan
      description: Sekolah yang berfokus pada selancar mengajarkan keterampilan berselancar SUP dan menaiki gelombang. Peralatan harus berfungsi dalam kondisi ombak — mudah dikendalikan, responsif, dan cukup tahan lama untuk menghadapi jatuh berulang, abrasi pasir, dan paparan air asin tanpa cepat rusak.
      features:
        - Bentuk SUP lebih pendek dan lebih lebar dioptimalkan untuk manuver selancar
        - Konstruksi rel diperkuat untuk ketahanan terhadap benturan di ombak
        - 'Peralatan keselamatan khusus selancar: leash melingkar, pilihan sirip lembut'
        - Program penggantian armada dengan diskon tukar musiman
    - title: Klub Kapal Pesiar Perusahaan & Pribadi
      subtitle: Pengalaman anggota premium
      description: Klub pribadi eksklusif yang menawarkan olahraga air sebagai fasilitas premium bagi anggota. Standar peralatan tinggi — estetika, kesesuaian merek, dan presentasi siap tamu sama pentingnya dengan performa. Harapan layanan mencakup pengiriman layanan tangan putih, solusi penyimpanan kustom, dan dukungan tingkat konsier.
      features:
        - Papan dengan hasil akhir premium dengan EVA serat kayu dan aksen metalik
        - Pencocokan warna kustom dengan panduan merek klub
        - 'Pengiriman konsier: telah ditiup, disiapkan, dan diberi label untuk setiap musim'
        - Manajemen akun khusus dengan SLA respons prioritas
