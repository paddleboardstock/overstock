features3_reasons:
  tagline: Mengapa Memilih Aquafarer
  title: Tujuh Alasan untuk Bermitra dengan Kami
  isBeforeContent: false
  columns: 3
  items:
    - title: 1. Manufaktur Sungguhan, Bukan Perdagangan
      description: Kami memiliki dan mengoperasikan pabrik seluas 12.000 m². Ketika Anda bermitra dengan Aquafarer, Anda bekerja langsung dengan orang-orang yang merancang, mengembangkan, dan membuat produk Anda — tanpa perantara.
      icon: tabler:building-factory
    - title: 2. Pendekatan Dipimpin oleh Teknik
      description: Proses desain kami dimulai dengan kasus penggunaan, bukan kategori produk. Kami mengoptimalkan bentuk lambung, pemilihan material, dan konfigurasi berdasarkan bagaimana perahu akan benar-benar digunakan.
      icon: tabler:engine
    - title: 3. Kualitas Bersertifikat
      description: CE bersertifikat, ISO sistem mutu, BSCI patuh, REACH patuh, USCG disetujui. 64 model CE-bersertifikat kami memenuhi standar internasional — bukan sekadar klaim.
      icon: tabler:certificate
    - title: 4. Fleksibel OEM/ODM
      description: Warna tabung, tata letak konsol, merek, kemasan — kami sesuaikan dengan spesifikasi Anda. Tidak ada tekanan jumlah minimum. Mulai dengan prototipe, berkembang dengan percaya diri.
      icon: tabler:adjustments
    - title: 5. Logistik Global
      description: Gudang AS di California, pengiriman langsung dari Qingdao, pengiriman udara untuk pesanan mendesak. Kami menangani dokumen dan administrasi bea cukai.
      icon: tabler:truck-delivery
    - title: 6. Dukungan Seumur Hidup
      description: Kami mendukung perahu yang kami buat 20 tahun yang lalu. Suku cadang asli, saran teknis, panduan perbaikan — tim kami tersedia saat Anda membutuhkannya.
      icon: tabler:lifebuoy
    - title: 7. Spesifikasi Jujur
      description: Rating beban nyata, dimensi nyata, berat nyata. Tidak ada pembengkakan pemasaran. Apa yang kami publikasikan adalah apa yang Anda dapatkan — diverifikasi oleh pengujian independen.
      icon: tabler:ruler-measure
testimonials:
  tagline: Dipercaya oleh Merek di Seluruh Dunia
  title: Apa Kata Mitra Kami
  items:
    - content: Kami telah bekerja dengan beberapa produsen di China, tetapi Aquafarer menonjol karena dukungan rekayasa mereka dan kualitas yang konsisten. Mereka memperlakukan merek kami seolah-olah itu milik mereka sendiri.
      name: — OEM Mitra, Merek Olahraga Air Eropa
    - content: Hypalon RIBs mereka telah digunakan dalam armada kami selama lebih dari 5 tahun. Pemeliharaan minimal, ketahanan UV yang luar biasa. Garansi 5 tahun pada tabung memberi kami kepercayaan.
      name: — Operator Armada, Grup Resor Timur Tengah
    - content: Tim Aquafarer membantu kami mengembangkan desain papan SUP kustom dari konsep hingga produksi dalam 90 hari. Kualitasnya melebihi harapan kami.
      name: — Distributor, Olahraga Air Australia
cta:
  title: Siap merasakan perbedaannya?
  subtitle: Hubungi tim kami untuk mendiskusikan proyek Anda. Tidak ada kewajiban — hanya saran jujur tentang manufaktur.
  actions:
    - variant: primary
      text: Bicaralah dengan tim kami
      href: /contact
    - text: Unduh katalog produk
      href: /resources
