  tagline: Proses
  title: Proses Manufaktur
  subtitle: Dari bahan mentah hingga papan siap laut — setiap langkah di bawah kendali kami
  back_label: Kembali ke Pabrik
  back_link: /factory
intro: Berbeda dengan merek yang memproduksi melalui pabrik pihak ketiga, Paddle Board Overstock memiliki dan mengoperasikan seluruh rantai produksi sendiri. Integrasi vertikal ini memungkinkan kami menjaga kontrol kualitas yang ketat di setiap tahap dan menghadirkan kualitas produk yang konsisten dari batch ke batch. Berikut adalah cara sebuah papan dibuat di fasilitas kami.
steps:
  - step: '01'
    title: Penerimaan & Pemeriksaan Material
    description: Setiap batch masuk dari kain PVC, inti drop-stitch, busa EVA, dan perangkat keras diperiksa sesuai spesifikasi. Sampel kain diuji kekuatan tarik, keseragaman ketebalan, dan ketahanan UV sebelum dilepas ke produksi. Bahan yang tidak memenuhi standar dikarantina dan dikembalikan.
    duration: 1–2 hari
  - step: '02'
    title: Pemotongan PVC Otomatis
    description: Kain yang disetujui ditempatkan pada mesin pemotong otomatis CNC dan dipotong dengan presisi sub-milimeter. Penataan panel yang dioptimalkan komputer mengatur panel agar limbah minimal — biasanya di bawah 5%. Panel yang dipotong diberi label sesuai model papan dan chamber, kemudian dikemas untuk dikirim ke bengkel pengelasan.
    duration: 2–4 jam per kit papan
  - step: '03'
    title: Penyegelan & Pengelasan Tabung
    description: Panel ditempel dan direkatkan menggunakan mesin penyegelan panas dengan pengelasan udara panas pada suhu terkontrol 200–600 °C. Jahitan utama diperkuat dengan pengelasan dielektrik RF untuk sambungan kedap udara dan kuat. Ruang yang telah selesai disuntik udara hingga 1,25× tekanan kerja selama 30 menit untuk validasi retensi udara.
    duration: 1–2 hari per papan
  - step: '04'
    title: Seni Dek & EVA Penyelesaian
    description: 'Deck seri art terbentuk di sini: panel busa EVA yang dipotong presisi ditempatkan dalam pola full-deck, direkatkan, dan dipangkas dengan tangan. Grippy, nyaman, dan tahan lama — tampilan khas setiap papan seri art.'
    duration: 1–2 hari
  - step: '05'
    title: Cetak & Dekorasi SUP
    description: Grafis dek papan SUP diterapkan menggunakan cetak digital untuk desain berkualitas foto penuh warna, dan sablon untuk logo yang tahan lama serta pola berulang. Cetakan dikeringkan dan disegel untuk ketahanan UV dan abrasi.
    duration: 1–2 hari
  - step: '06'
    title: Perakitan Akhir & Rigging
    description: 'Papan menerima komponen akhir: katup dikencangkan dan diuji fungsinya, D-ring, pegangan, dan kotak sirip dipasang, serta kait leash diamankan. Setiap papan mengikuti daftar periksa 100 poin dengan persetujuan wajib di setiap tahap.'
    duration: 2–3 hari
  - step: '07'
    title: Pengujian & Inspeksi Kualitas
    description: 'Setiap papan yang selesai menjalani quality gate wajib: uji retensi udara chamber, pemeriksaan fungsi sistem, verifikasi torsi pengikat, dan inspeksi kosmetik. Pembuatan custom dan prototipe juga menjalani uji laut menyeluruh yang mencakup kecepatan, handling, stabilitas, dan daya tahan.'
    duration: 1–2 hari
  - step: '08'
    title: Pengemasan & Pengiriman
    description: Papan dikempiskan, digulung, dan dikemas dalam ransel perjalanan dengan pompa, dayung, sirip, leash, dan kit perbaikan, lalu dikotakkan untuk pengiriman kurir dan freight. Setiap paket diberi label dengan model, nomor seri, dan tujuan. Kami mengirim ke 50+ negara di seluruh dunia.
    duration: 1 hari
