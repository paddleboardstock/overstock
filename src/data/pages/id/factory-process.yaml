intro: Berbeda dengan merek yang mengalihdayakan produksi ke pabrik pihak ketiga, Paddle Board Overstock memiliki dan mengoperasikan seluruh rantai produksinya. Integrasi vertikal ini memungkinkan kami menjaga kontrol kualitas yang ketat di setiap tahap, merespons cepat permintaan khusus, dan memberikan kualitas produk yang konsisten dari batch ke batch. Berikut adalah cara kapal dibangun di fasilitas kami.
steps:
  - step: '01'
    title: Penerimaan & Pemeriksaan Material
    description: Setiap batch PVC kain, mat fiberglass, resin, dan perangkat keras yang masuk diperiksa sesuai spesifikasi. Sampel kain diuji kekuatan tarik, keseragaman ketebalan, dan ketahanan UV sebelum dilepaskan ke produksi. Material yang tidak sesuai dikarantina dan dikembalikan.
    duration: 1–2 hari
  - step: '02'
    title: Pemotongan PVC Otomatis
    description: Kain yang disetujui ditempatkan pada mesin pemotong CNC otomatis dan dipotong dengan akurasi sub-milimeter. Penataan panel yang dioptimalkan komputer meminimalkan limbah — biasanya di bawah 5%. Panel yang dipotong diberi label menurut model kapal dan ruang, kemudian dikemas untuk dipindahkan ke bengkel pengelasan.
    duration: 2–4 jam per kit kapal
  - step: '03'
    title: Penyegelan & Pengelasan Tabung
    description: Panel ditempel dan direkatkan menggunakan mesin penyegelan panas dengan pengelasan udara panas pada suhu terkontrol 200–600 °C. Jahitan utama diperkuat dengan pengelasan dielektrik RF untuk sambungan kedap udara dan kuat. Ruang yang telah selesai disuntik udara hingga 1,25× tekanan kerja selama 30 menit untuk validasi retensi udara.
    duration: 1–2 hari per kapal
  - step: '04'
    title: Pencetakan Lambung Fiberglass RIB
    description: Lambung kapal RIB diproduksi menggunakan pencetakan fiberglass hand-lay-up. Lapisan mat fiberglass dan woven roving digulung tangan dengan resin poliester atau vinylester pada cetakan presisi. Setiap lapisan dibungkus vakum untuk kualitas laminasi yang konsisten. Lambung diselesaikan dengan gelcoat untuk permukaan laut yang mengilap dan tahan UV.
    duration: 2–4 hari per lambung
  - step: '05'
    title: Cetak & Dekorasi SUP
    description: Grafis dek papan SUP diterapkan menggunakan cetak digital untuk desain berkualitas foto penuh warna, dan sablon untuk logo yang tahan lama serta pola berulang. Cetakan dikeringkan dan disegel untuk ketahanan UV dan abrasi.
    duration: 1–2 hari
  - step: '06'
    title: Perakitan Akhir & Rigging
    description: Lambung fiberglass dan rakitan tabung PVC dipasangkan di lini perakitan. Mesin dipasang, kontrol kemudi dan throttle dihubungkan, sistem bahan bakar dipasang, dan seluruh kabel listrik dirangkai. Setiap kapal mengikuti daftar periksa perakitan 100 titik dengan tanda tangan wajib di setiap tahap.
    duration: 2–3 hari
  - step: '07'
    title: Pengujian & Inspeksi Kualitas
    description: 'Setiap kapal yang selesai menjalani pintu kualitas wajib: uji retensi udara ruang, pemeriksaan fungsi sistem, verifikasi torsi pengikat, dan inspeksi kosmetik. Pembangunan khusus dan prototipe juga menjalani uji laut di air, mencakup kecepatan, pengendalian, stabilitas, dan daya tahan.'
    duration: 1–2 hari
  - step: '08'
    title: Pengemasan & Pengiriman
    description: Kapal dikempiskan, dilipat sesuai prosedur, dikemas dalam tas rajut atau peti kayu yang kuat, dan dimuat untuk pengiriman. Setiap paket diberi label dengan model, nomor seri, dan tujuan. Kami berkoordinasi dengan pengangkut barang untuk pengiriman kontainer FCL dan LCL ke seluruh dunia.
    duration: 1 hari
