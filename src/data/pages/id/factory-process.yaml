tldr:
  summary: Paddle Board Overstock mengikuti proses manufaktur multi-tahap yang ketat mulai dari pemeriksaan bahan baku hingga pemotongan, pengelasan, seni dek dan penyelesaian EVA, perakitan, pengujian tekanan 1,25x dari tekanan nominal, dan QC akhir. 100% papan diuji tekan, 99,3% bebas cacat.
  points:
    - 'Pemeriksaan bahan baku: uji tarik, robek, UV'
    - Pemotongan CNC otomatis dan pengelasan RF frekuensi tinggi
    - Perakitan tangan EVA seni dek dengan blok anti-pudar
    - Tahan tekanan 1,25x dari tekanan nominal selama 24-48 jam pada setiap unit
    - Pemeriksaan akhir 100 titik pada setiap papan
