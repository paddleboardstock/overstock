who_benefits:
  tagline: Siapa yang Bisa Mendapat Manfaat
  title: Untuk Siapa Grosir Model Campuran
  items:
    - title: Importer Pertama Kali
      description: Menguji kategori SUP dengan berbagai model alih-alih berkomitmen pada satu SKU secara massal.
    - title: Pengecer Musiman Pantai
      description: Toko yang membutuhkan papan pemula untuk turis dan edisi premium untuk penduduk lokal — dalam satu pesanan restock yang sama.
    - title: Penjual Online
      description: Mencantumkan beberapa model sekaligus untuk mengetahui artwork, panjang, dan penggunaan mana yang paling laku.
    - title: Armada Sewa & Sekolah
      description: Armada yang membutuhkan berbagai ukuran papan untuk berat pengendara dan jenis pelajaran yang berbeda, bukan armada dengan spesifikasi tunggal.
faq_section:
  title: FAQ Model Campuran
  items:
    - q: Apakah ada jumlah minimum per model?
      a: Tidak. Minimum 5 papan berlaku untuk total pesanan, bukan untuk setiap model. Anda bisa memesan 5 model berbeda, masing-masing satu papan.
    - q: Apakah mencampur model mengubah harga?
      a: Harga grosir per unit dikutip per model, tetapi tingkat harga Anda meningkat dengan total jumlah papan — mencampur model tidak menghukum Anda.
    - q: Apakah saya bisa mencampur papan dan aksesoris?
      a: Ya — dayung cadangan, pompa, dan kit perbaikan bisa ditambahkan ke pesanan campuran. Tanyakan dalam form permintaan informasi Anda.
    - q: Bagaimana saya tahu model mana yang cocok untuk pasar saya?
      a: Kirimkan catatan tentang pelanggan Anda (pesisir atau pedalaman, turis atau penduduk lokal, pemula atau pengendara) dalam form permintaan, dan kami akan merekomendasikan campuran.
