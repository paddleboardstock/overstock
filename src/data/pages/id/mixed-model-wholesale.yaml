hero:
  tagline: Grosir Model Campuran
  title: Model Campuran Papan Dayung Grosir —<br />Campur SUP Berbagai Model dalam Satu Urutan
  subtitle: Mengapa mengikat anggaran Anda pada satu model? Gabungkan semua papan yang tersedia SUP — edisi all-around, touring, surfing, dan seni — dalam satu pesanan grosir, dengan total serendah 5 papan.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Pesanan campuran dari SUP berbagai model papan tiup dari Paddle Board Overstock
direct_answer: Grosir model campuran memungkinkan pengecer kecil memesan beberapa model berbeda SUP dalam satu pengiriman terpadu, bukan jumlah besar dalam satu papan. Pada Paddle Board Overstock, setiap model yang tersedia dapat digabungkan, pesanan minimum adalah 5 papan total, dan jumlah total menentukan tingkat harga. Pesanan campuran dikirim dari Weihai, China dengan angkutan udara ekspres (1–3 papan) atau pengiriman laut konsolidasi (5–20 papan) ke 50+ negara, dan setiap papan telah diuji tekanan 100% serta tercakup oleh SUP Garansi 2 Tahun.
tldr_points:
  - Campur SUP semua model yang tersedia dalam satu pesanan — tanpa minimum per model
  - Total jumlah pesanan (bukan jumlah per model) menetapkan tingkat harga Anda
  - Mulailah dari total 5 papan — dibuat untuk pengecer kecil, bukan muatan kontainer
  - 'Satu pengiriman terkonsolidasi: satu biaya angkutan, satu proses bea cukai, satu pengiriman'
why_mixed:
  tagline: Mengapa Campuran?
  title: Campur & Cocokkan. Beli Lebih Banyak Variasi. Belanja Lebih Sedikit.
  subtitle: Satu rak papan identik melayani satu jenis paddler. Pesanan campuran mengubah anggaran yang sama menjadi lini produk lengkap.
  items:
    - title: Lebih Banyak Variasi di Rak Anda
      description: Gabungkan papan serba guna untuk pemula, papan touring untuk petualang, dan papan bergaya selancar untuk pesepeda — satu pesanan mencakup seluruh pilihan pelanggan Anda.
    - title: Risiko lebih rendah per Model
      description: Alih-alih bertaruh musim Anda pada satu model, pesan 2–4 dari masing-masing model. Jika satu model terjual lebih banyak dari sisanya, isi ulang pesanan berikutnya dengan data penjualan nyata.
    - title: Uji Apa yang Laku di Pasar Anda
      description: Setiap pantai, danau, dan kota memiliki permintaan yang berbeda. Pesanan pertama campuran adalah riset pasar termurah yang ada — stok enam model, lihat mana yang bergerak.
    - title: Margin Lebih Baik untuk Edisi Seni
      description: Papan seri seni premium (Leviathan Wake, Medusa Glow, Ocean Voyager) menawarkan harga ritel yang lebih tinggi. Campurkan beberapa ke dalam dasar papan serba guna untuk meningkatkan margin rata-rata Anda.
    - title: Satu Pengiriman Terkonsolidasi
      description: Satu pesanan campuran berarti satu pemesanan pengiriman, satu pembersihan bea cukai, dan satu pengiriman — bukan lima pengiriman terpisah dari lima pemasok terpisah.
how_it_works:
  tagline: Cara Kerjanya
  title: Cara Kerja Pesanan Model Campuran
  steps:
    - title: Pilih Campuran Anda
      description: Pilih model dan kuantitas untuk pasar Anda — atau gunakan pemilih di bawah ini untuk menyusun kombinasi dan melihat jumlah papan serta pembaruan nilai total secara langsung.
    - title: Permintaan Penawaran
      description: Kirimkan campuran produk kepada kami. Kami mengonfirmasi stok terkini untuk setiap model dan harga unit penawaran serta opsi pengiriman ekspres dan laut ke negara Anda.
    - title: Konfirmasi Pesanan
      description: Setujui kutipan akhir — model, jumlah, ongkos kirim, total. Kami mengunci stok dan menjadwalkan pengiriman dari Weihai.
    - title: Kami Menguji Setiap Papan
      description: Setiap papan dalam pesanan campuran Anda diuji tekan 100% hingga 15 PSI sebelum dikemas — standar yang sama untuk setiap model, apakah itu model pemula serba guna atau edisi seni.
    - title: Satu Pengiriman ke Pintu Anda
      description: Seluruh pesanan campuran dikirim bersama — udara ekspres untuk pesanan kecil, pengiriman laut terkonsolidasi untuk 5–20 papan — dengan pelacakan dari pintu ke pintu.
