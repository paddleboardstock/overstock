hero:
  tagline: Filipina
  title: Papan Grosir SUP untuk<br />Bisnis Filipina
  subtitle: Resor pulau, klub pantai, dan operator dayung dari El Nido dan Siargao hingga Boracay — papan overstock baru dari 5 unit, model campuran, dikirim dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan overstock SUP untuk resor pulau Filipina dan operator paddle
direct_answer: Paddle Board Overstock memasok papan tiup overstock baru SUP untuk bisnis Filipina — resor pulau di Palawan dan Siargao, klub pantai di Boracay dan Cebu, operator sewa dan tur, serta pengecer kecil. Pesanan grosir dimulai dari 5 papan dengan model campuran dalam satu pengiriman, dikirim dari Weihai, China melalui angkutan udara ekspres atau pengiriman laut konsolidasi. Setiap papan telah diuji tekanan 100% dan dilindungi oleh SUP Garansi 2 Tahun.
tldr_points:
  - Grosir dari 5 papan — model campuran, dihargai berdasarkan jumlah total
  - Melayani resor pulau dan klub pantai di seluruh kepulauan Filipina
  - Pengiriman udara ekspres atau pengiriman laut konsolidasi dari Weihai, Tiongkok
  - 100% teruji tekanan, SUP Garansi 2 Tahun untuk setiap papan
overview_section:
  tagline: Ikhtisar Pasar
  title: SUP Pasar Filipina
  paragraphs:
    - Dengan lebih dari tujuh ribu pulau, Filipina dibangun untuk stand-up paddle. Laguna El Nido dan Coron, suasana surf-and-island yang santai di Siargao, energi klub pantai Boracay, dan ekonomi olahraga selam dan air Cebu semuanya menciptakan permintaan yang stabil — mulai dari wisatawan yang mendayung saat matahari terbit di laguna batu kapur hingga penduduk lokal yang membangun SUP komunitas kebugaran dan yoga di Manila dan sekitarnya.
    - The buyers are typically resort and tour operators: resor pulau yang menambah aktivitas tamu yang tidak membutuhkan bahan bakar, mesin, dan lisensi; operator tur island-hopping yang memperluas penawarannya; dan toko-toko kecil yang melayani komunitas dayung domestik. Pesanan berukuran kecil — 5–20 papan — dan bercampur antara papan serba guna yang stabil untuk pemula dan beberapa edisi premium untuk tampilan resor.
  customer_types:
    - title: Resor Pulau
      description: Resor Palawan, Siargao, dan Boracay menambahkan program tamu SUP dengan armada campuran yang kompak.
    - title: Operator Tur
      description: Operator tur island-hopping dan laguna menambahkan pemberhentian mendayung ke dalam jadwal mereka.
    - title: Toko & Sekolah Lokal
      description: Sekolah dan toko berbasis kota yang melayani komunitas dayung dan yoga Filipina yang terus berkembang SUP .
shipping_section:
  title: Kapal ke Filipina
  paragraphs:
    - Pesanan dikirim dari Weihai, China. Angkutan udara ekspres memindahkan sampel dan 1–3 pesanan papan dengan cepat ke Manila dan Cebu; Consolidated Sea Freight melayani 5–20 pesanan grosir papan melalui Manila dan pelabuhan Filipina lainnya. Perkiraan transit untuk tujuan Anda — metro Manila atau provinsi — sudah termasuk dalam penawaran Anda.
    - Kami menyediakan faktur komersial dan daftar pengepakan yang diperlukan untuk izin, dengan kode HS yang benar dan nilai yang dideklarasikan. Bea masuk dan pajak harus dibayar oleh importir sesuai aturan Filipina.
  customs_note: Untuk tujuan provinsi, pengiriman akhir dari pelabuhan atau bandara dikutip sebagai bagian dari estimasi pintu ke pintu. Konfirmasi perlakuan bea masuk saat ini untuk peralatan olahraga dengan broker Anda; kami menyediakan dokumen lengkap.
faq_section:
  title: FAQ Filipina
  items:
    - q: Berapa lama waktu pengiriman ke Filipina?
      a: Tergantung pada metodenya. Pengiriman udara ekspres ke Manila atau Cebu adalah pilihan tercepat untuk sampel dan 1–3 pesanan papan; pengiriman laut konsolidasi sesuai 5–20 pesanan grosir papan dan diberi kutipan dengan jendela transit untuk pelabuhan Anda. Kedua perkiraan tersebut dirinci dalam penawaran Anda sebelum Anda berkomitmen.
    - q: Apakah dewan dapat mencapai pulau-pulau provinsi seperti Palawan atau Siargao?
      a: Ya — pengiriman dari pintu ke pintu ke tujuan provinsi dikutip sebagai bagian dari perkiraan biaya angkutan, menggunakan logistik domestik lanjutan dari pelabuhan atau bandara kedatangan. Perhatikan perkiraan dan opsi dalam pertanyaan Anda dan kami akan menentukannya harganya secara spesifik.
    - q: Seperti apa tampilan armada pemula di resor?
      a: 'Biasanya 5–10 papan: model stabil serbaguna untuk pelajaran tamu dan berselancar bebas, ditambah satu atau dua edisi seni premium untuk tepi pantai. Model campuran, satu pengiriman, harga berdasarkan jumlah total.'
    - q: Apakah papan-papan tersebut cocok untuk digunakan di laguna dan dataran terumbu?
      a: Ya — kondisi tenang, dangkal, dan berair hangat adalah tepat apa yang dirancang untuk semua papan tiup serbaguna SUP, dan sirip fleksibel serta konstruksi drop-stitch yang tahan lama menangani daratan terumbu dan pantai dengan baik.
