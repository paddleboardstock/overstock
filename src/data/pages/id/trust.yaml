features3_certifications:
  title: Sertifikasi & Kepatuhan
  subtitle: Setiap produk diuji secara independen; 64 model CE bersertifikat sesuai standar internasional.
  columns: 3
  isBeforeContent: true
  items:
    - title: Sertifikasi CE
      description: 64 model bersertifikasi CE di seluruh SUPs, kayak, perahu kecil, dan RIBs memenuhi standar keselamatan CE Eropa untuk kapal rekreasi. Setiap produk menjalani pengujian tekanan, daya apung, dan beban sebelum meninggalkan pabrik.
      icon: tabler:certificate
    - title: ''
      description: Fasilitas kami seluas 12.000 m² di Qingdao beroperasi di bawah sistem manajemen mutu ISO 9001. Setiap batch produksi dapat ditelusuri, didokumentasikan, dan diperiksa.
      icon: tabler:clipboard-check
    - title: BSCI Kepatuhan Sosial
      description: Kami bersertifikasi BSCI, menjamin praktik kerja yang etis, kondisi kerja yang aman, dan tanggung jawab lingkungan di seluruh rantai pasokan kami.
      icon: tabler:users
    - title: REACH & RoHS
      description: Semua bahan — PVC, busa Hypalon, EVA, perekat — mematuhi peraturan REACH dan RoHS Uni Eropa. Tidak ada zat yang dibatasi, tidak ada kompromi.
      icon: tabler:flask
    - title: Laboratorium Pengujian Material
      description: Laboratorium bahan internal menguji kekuatan tarik, ketahanan UV, integritas jahitan, dan abrasi untuk setiap batch kain sebelum produksi.
      icon: tabler:microscope
    - title: Garansi Kapal 5 Tahun
      description: Paddle Board Overstock perahu dilindungi oleh garansi terbatas 5 tahun untuk kain tabung, jahitan, dan lambung. SUP papan dan aksesori dilengkapi dengan garansi 2 tahun. Kami mendukung apa yang kami buat.
      icon: tabler:shield-check
testimonials:
  tagline: Kepercayaan Pelanggan
  title: Apa yang dikatakan pelanggan kami
  subtitle: Dari pendayung pemula hingga operator armada profesional — lihat mengapa mereka mempercayai Paddle Board Overstock.
  items:
    - content: Kami melengkapi seluruh armada sewaan kami dengan Paddle Board Overstock RIBs — 12 kapal di tiga lokasi. Dua musim berjalan, nol kegagalan. Dokumentasi sertifikasi CE membuat persetujuan asuransi menjadi mudah. Tim rekayasa mereka bahkan menyesuaikan warna tabung agar sesuai dengan merek kami.
      name: Marco Valenti
      title: Direktur Operasional, Adriatic Adventure Tours — Dubrovnik, Kroasia
    - content: Sebagai pembeli pertama kali, saya gugup tentang kualitas memesan dari luar negeri. Dokumentasi ISO dan laporan uji pihak ketiga yang mereka bagikan sebelum saya meminta memberi saya kepercayaan penuh. Papan tiba dalam 6 hari dan melebihi harapan saya.
      name: James Thornton
      title: Pemilik SUP Explorer 11 — Vancouver, Kanada
    - content: Kami mengoperasikan 24 Paddle Board Overstock RIBs di seluruh armada patroli pesisir kami. Proses QC mereka konsisten di setiap batch — kualitas jahitan sama, penempatan katup sama, rating tekanan sama setiap waktu. Konsistensi itu penting ketika nyawa tergantung pada peralatan.
      name: Letnan Komandan Andres Reyes
      title: Petugas Pengadaan Maritim, Penjaga Pantai Bantuan Filipina — Manila, Filipina
features3_lab:
  title: Laboratorium Pengujian & Kualitas Internal
  subtitle: Setiap batch bahan dan produk jadi melewati laboratorium pengujian kami di lokasi sebelum dikirim.
  columns: 3
  isBeforeContent: true
  items:
    - title: Pengujian Kekuatan Tarik
      description: 'Setiap gulungan kain PVC diuji sesuai standar ASTM D751. Persyaratan minimum: 350 N/cm warp dan weft. Batch yang ditolak dikembalikan ke pemasok — kami menolak sekitar 3% dari bahan masuk.'
      icon: tabler:scale
    - title: UV Penuaan Dipercepat
      description: Sampel kain menjalani penuaan cuaca dipercepat QUV 1.000 jam (ASTM G154). Retensi kekuatan tarik harus melebihi 80% setelah paparan UV. Produk dinilai tahan 3+ tahun penggunaan luar ruangan.
      icon: tabler:sun
    - title: Kekuatan Perekat Jahitan
      description: Jahitan yang dilas RF diuji dengan kekuatan perekat minimum 5 N/mm (ASTM D751). Jahitan Hypalon yang direkat tangan diuji pada 3,5 N/mm. Setiap batch produksi memiliki sampel jahitan yang diuji secara destruktif dan diarsipkan.
      icon: tabler:stack
    - title: Pengujian Tekanan 24–48 Jam
      description: 'Setiap produk tiup dikembangkan ke 1,25x PSI yang dinilai dan dipantau selama 24–48 jam. Penurunan tekanan maksimum yang diperbolehkan: 5%. Produk yang gagal dalam uji ini diperbaiki dan diuji kembali sebelum dikirim.'
      icon: tabler:wind
    - title: Pengujian Siklus Katup
      description: Setiap desain katup menjalani 10.000 siklus buka-tutup di laboratorium kami. Katup harus mempertahankan segel kedap udara pada 1,25x tekanan yang dinilai setelah siklus. Semua katup Paddle Board Overstock dinilai untuk 5+ tahun penggunaan reguler.
      icon: tabler:rotate
    - title: Ketahanan Retak Dingin
      description: Bahan diuji pada -30°C selama 4 jam sesuai ISO 4646. Tidak ada retak atau pengerasan yang diperbolehkan. Produk dinilai untuk penyimpanan musim dingin dan penggunaan air dingin hingga suhu ambient -10°C.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Bagaimana kami memastikan kualitas
  subtitle: Dari inspeksi bahan baku hingga pengujian tekanan akhir — setiap produk melewati rantai kualitas yang ketat.
  items:
    - title: Inspeksi Bahan Baku
      description: Setiap gulungan kain PVC diuji untuk ketebalan, kekuatan tarik, dan ketahanan UV sebelum memasuki produksi.
      icon: tabler:search
    - title: QC dalam Proses
      description: Jahitan las, pemasangan katup, dan ikatan ruang diperiksa di setiap stasiun selama perakitan.
      icon: tabler:eye
    - title: Pengujian Tekanan
      description: Setiap produk tiup diisi hingga rating 1,25x PSI dan disimpan selama 24–48 jam untuk memastikan retensi udara dan integritas sambungan.
      icon: tabler:wind
    - title: Inspeksi Akhir
      description: Setiap unit diperiksa untuk finishing, perangkat keras, dan kemasan sebelum disetujui untuk pengiriman. Sampel batch dikirim ke laboratorium kami untuk pengujian destruktif.
      icon: tabler:clipboard-check
faqs_rib:
  title: FAQ RIB tentang Perahu
  subtitle: Pertanyaan umum tentang kapal karet lambung kaku kami.
  columns: 2
  items:
    - title: Ukuran RIB kapal apa saja Paddle Board Overstock yang tersedia?
      description: Kami menawarkan 35 RIB model dengan panjang mulai dari 2,5 m hingga 7,6 m, mencakup segala sesuatu mulai dari tender kompak hingga kapal komersial dan patroli berat. Setiap model tersedia dengan berbagai opsi konfigurasi.
    - title: Apa perbedaan antara RIB perahu tiup dan perahu tiup tradisional?
      description: A RIB (Rigid-Hull Inflatable Boat) menggabungkan lambung fiberglass solid atau aluminium deep-V dengan tiup Hypalon atau PVC tabung. Ini memberikan stabilitas dan kapasitas muatan seperti perahu keras dengan penyerapan guncangan dan daya apung seperti perahu tiup.
    - title: Mesin apa saja yang kompatibel Paddle Board Overstock RIBs?
      description: Kami RIBs mendukung mesin tempel dari 3 HP hingga 250 HP tergantung pada modelnya. Setiap halaman produk mencantumkan daya mesin maksimum yang dinilai. Kami menyarankan untuk berkonsultasi dengan dealer Anda untuk kecocokan yang ideal.
    - title: Apakah Paddle Board Overstock RIBs CE sudah bersertifikat?
      description: Ya. Semua model rekreasi RIB telah CE bersertifikat di bawah standar Eropa yang berlaku untuk kendaraan rekreasi. Model komersial dan patroli memenuhi persyaratan stabilitas dan beban tambahan.
    - title: Berapa garansi untuk RIB kapal?
      description: Semua Paddle Board Overstock RIBs dilengkapi dengan garansi terbatas 5 tahun untuk kain tabung, jahitan, dan lambung; katup inflasi ditutup selama 5 tahun; aksesori instalasi pabrik ditanggung selama 1 tahun.
    - title: Berapa banyak ruang udara Paddle Board Overstock RIBs yang ada?
      description: Kami RIBs memiliki 3 hingga 7 ruang udara independen tergantung pada panjang model. Desain multi-ruang ini memastikan kapal tetap mengapung meskipun satu kompartemen terganggu.
faqs_inflatable:
  title: FAQ Perahu Tiup
  subtitle: Pertanyaan umum tentang perahu dinghy, kayak, dan perahu tiup kami.
  columns: 2
  items:
    - title: Bahan apa saja yang digunakan dalam Paddle Board Overstock perahu tiup?
      description: Kami menggunakan standar militer PVC (1100 denier) dan premium Hypalon/CSM karet, tergantung pada modelnya. Kedua material UVtersebut stabil, tahan abrasi, dan sesuai dengan REACH RoHS regulasi Uni Eropa.
    - title: Berapa lama perahu karet bertahan?
      description: Dengan perawatan yang tepat, PVC kapal tiup berkualitas dapat bertahan 7–10 tahun, sementara Hypalon model dapat bertahan 15–20 tahun. Pembersihan rutin, UV perlindungan, dan penyimpanan yang tepat secara signifikan memperpanjang masa pakainya.
    - title: Perawatan apa saja yang diperlukan untuk perahu tiup?
      description: Perawatan dasar meliputi membilas dengan air segar setelah setiap penggunaan (terutama di air asin), mengeringkan sebelum penyimpanan, memeriksa segel katup setiap tahun, dan mengaplikasikan UV pelindung pada tabung. Hindari paparan sinar matahari yang berkepanjangan saat tidak digunakan.
    - title: Apakah perahu tiup dapat digunakan di air asin?
      description: Ya. Semua Paddle Board Overstock perahu tiup dirancang untuk penggunaan air tawar maupun air asin. Kami menyarankan untuk membilas dengan air tawar dan mengeringkan secara menyeluruh setelah paparan air asin untuk mencegah korosi yang dipasang dan kristalisasi garam kain.
    - title: Bagaimana cara menyimpan perahu tiup?
      description: Kempekan, bersihkan, dan keringkan perahu sepenuhnya sebelum penyimpanan. Gulung dengan longgar (hindari lipatan rapat), simpan di tempat yang sejuk dan kering jauh dari sinar matahari langsung, dan hindari lantai beton agar tidak menyerap kelembapan.
    - title: Berapa kapasitas berat Paddle Board Overstock perahu tiup?
      description: Kapasitas berat berkisar dari 290 kg untuk model terkecil kami hingga lebih dari 2000 kg untuk perahu komersial yang lebih besar. Setiap halaman produk mencantumkan peringkat muatan maksimum untuk model spesifik Anda.
faqs_sup:
  title: SUP FAQ Papan
  subtitle: Pertanyaan umum tentang papan dayung berdiri kami.
  columns: 2
  items:
    - title: Ukuran SUP papan apa yang tersedia?
      description: Kami menawarkan SUP papan dari 9 ft hingga 12 ft, termasuk all-round, touring, yoga, dan desain khusus. Model terlaris kami termasuk Tropical Breeze (10 ft) dan Ocean Voyager (11 ft).
    - title: Apa itu konstruksi drop-stitch?
      description: Konstruksi Drop-stitch menggunakan ribuan benang poliester yang menghubungkan lapisan atas dan bawah papan, memungkinkan papan menahan tekanan udara tinggi (15–20 PSI) dan mencapai platform yang kaku serta stabil. Ini adalah standar industri untuk SUPs tiup premium.
    - title: Berapa batas berat untuk papan SUP?
      description: Papan SUP kami mendukung hingga 150 kg tergantung pada model dan volumenya. Papan Leviathan Wake adalah model dengan kapasitas tertinggi, dirancang untuk pengendara yang lebih besar dan penggunaan yoga.
    - title: Apakah Anda menawarkan paket SUP lengkap?
      description: Ya. Setiap papan SUP dikirim dengan paket lengkap termasuk dayung aluminium 3 bagian, pompa tangan bertekanan tinggi, tali pengaman spiral, tas perjalanan, dan kit perbaikan. Beberapa model juga termasuk satu set sirip yang dapat dilepas.
    - title: Apa garansi untuk papan SUP?
      description: Semua papan Paddle Board Overstock SUP hadir dengan garansi 2 tahun terhadap cacat pabrik, termasuk kegagalan jahitan, cacat katup, dan delaminasi material dalam penggunaan normal.
    - title: Berapa lama waktu yang dibutuhkan untuk mengisi papan SUP?
      description: Menggunakan pompa tangan yang disertakan, pengisian penuh hingga 15 PSI memakan waktu sekitar 8–12 menit. Untuk pengisian lebih cepat, kami merekomendasikan pompa listrik 12V Paddle Board Overstock kami, yang dapat mengisi papan dalam kurang dari 4 menit.
