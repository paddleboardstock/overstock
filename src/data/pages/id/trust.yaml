features3_certifications:
  title: Kualitas & Pengujian
  subtitle: Setiap papan diuji di laboratorium kami sendiri sebelum dikirim — angka nyata, catatan nyata, tanpa klaim pemasaran.
  columns: 3
  isBeforeContent: true
  items:
    - title: Dibangun di Pabrik Kami Sendiri
      description: Kami memiliki dan mengoperasikan fasilitas Weihai seluas 12.000 m². Setiap batch produksi dapat dilacak, didokumentasikan, dan diperiksa — tidak ada manufaktur misterius yang dialihdayakan.
      icon: tabler:building-factory
    - title: Laboratorium Pengujian Material
      description: Laboratorium bahan internal menguji kekuatan tarik, ketahanan UV, integritas jahitan, dan abrasi untuk setiap batch kain sebelum produksi.
      icon: tabler:microscope
    - title: Material Kelas Laut
      description: UV-distabilkan PVC, drop-stitch inti, dan EVA busa dek — dipilih dan diuji untuk musim sinar matahari, garam, dan abusuhan.
      icon: tabler:flask
    - title: Garansi SUP 2 Tahun
      description: Paddle Board Overstock SUP papan dilindungi oleh garansi 2 tahun terhadap cacat pabrik, termasuk jahitan, katup, dan delaminasi material. Kami berdiri di belakang apa yang kami buat.
      icon: tabler:shield-check
testimonials:
  tagline: Kepercayaan Pelanggan
  title: Apa yang dikatakan pelanggan kami
  subtitle: Dari orang yang baru mencoba mendayung hingga penjelajah berpengalaman — lihat mengapa mereka mempercayai Paddle Board Overstock.
  items:
    - content: Sebagai pembeli pertama, saya merasa gugup untuk memesan dari luar negeri. Tim menjawab setiap pertanyaan dengan foto asli dan catatan uji sebelum saya bertanya. Papan tersebut tiba dalam 6 hari dan melebihi ekspektasi saya.
      name: James Thornton
      title: Pemilik SUP Explorer 11 — Vancouver, Kanada
features3_lab:
  title: Laboratorium Pengujian & Kualitas Internal
  subtitle: Setiap batch bahan dan produk jadi melewati laboratorium pengujian kami di lokasi sebelum dikirim.
  columns: 3
  isBeforeContent: true
  items:
    - title: Pengujian Kekuatan Tarik
      description: 'Setiap PVC gulungan kain diuji kekuatan tarik di dalam perusahaan. Persyaratan minimum: lungsi dan pakan 350 N/cm. Batch yang ditolak dikembalikan ke pemasok — kami menolak sekitar 3% dari bahan yang masuk.'
      icon: tabler:scale
    - title: UV Penuaan Dipercepat
      description: Sampel kain mengalami pelapukan percepatan selama 1.000 jam UV . Kekuatan tarik harus mempertahankan 80%+ setelah paparan. Produk yang dinilai untuk+ penggunaan luar ruangan selama 3 tahun.
      icon: tabler:sun
    - title: Kekuatan Perekat Jahitan
      description: Jahitan yang dilas diuji hingga kekuatan peel minimum 5 N/mm. Setiap batch produksi memiliki sampel jahitan yang diuji dan diarsipkan secara destruktif.
      icon: tabler:stack
    - title: Pengujian Tekanan 24–48 Jam
      description: 'Setiap produk tiup dikembangkan ke 1,25x PSI yang dinilai dan dipantau selama 24–48 jam. Penurunan tekanan maksimum yang diperbolehkan: 5%. Produk yang gagal dalam uji ini diperbaiki dan diuji kembali sebelum dikirim.'
      icon: tabler:wind
    - title: Pengujian Siklus Katup
      description: Setiap desain katup menjalani 10.000 siklus buka-tutup di laboratorium kami. Katup harus menjaga segel kedap udara pada tekanan 1,25x dari tekanan terukur setelah siklus. Semua katup Paddle Board Overstock memiliki peringkat untuk penggunaan reguler selama 5+ tahun.
      icon: tabler:rotate
    - title: Ketahanan Retak Dingin
      description: Material diuji pada suhu -30°C selama 4 jam. Tidak boleh retak atau rapuh. Produk yang dinilai untuk penyimpanan musim dingin dan penggunaan air dingin hingga suhu sekitar -10°C.
      icon: tabler:snowflake
steps2_manufacturing:
  title: Bagaimana kami memastikan kualitas
  subtitle: Dari inspeksi bahan baku hingga pengujian tekanan akhir — setiap produk melewati rantai kualitas yang ketat.
  items:
    - title: Inspeksi Bahan Baku
      description: Setiap gulungan kain PVC diuji untuk ketebalan, kekuatan tarik, dan ketahanan UV sebelum memasuki produksi.
      icon: tabler:search
    - title: QC dalam Proses
      description: Jahitan las, pemasangan katup, dan ikatan ruang diperiksa di setiap stasiun selama perakitan.
      icon: tabler:eye
    - title: Pengujian Tekanan
      description: Setiap produk tiup diisi hingga rating 1,25x PSI dan disimpan selama 24–48 jam untuk memastikan retensi udara dan integritas sambungan.
      icon: tabler:wind
    - title: Inspeksi Akhir
      description: Setiap unit diperiksa untuk finishing, perangkat keras, dan kemasan sebelum disetujui untuk pengiriman. Sampel batch dikirim ke laboratorium kami untuk pengujian destruktif.
      icon: tabler:clipboard-check
faqs_sup:
  title: SUP FAQ Papan
  subtitle: Pertanyaan umum tentang papan dayung berdiri kami.
  columns: 2
  items:
    - title: Ukuran SUP papan apa yang tersedia?
      description: Kami menawarkan SUP papan dari 9 ft hingga 12 ft, termasuk all-round, touring, yoga, dan desain khusus. Model terlaris kami termasuk Tropical Breeze (10 ft) dan Ocean Voyager (11 ft).
    - title: Apa itu konstruksi drop-stitch?
      description: Konstruksi Drop-stitch menggunakan ribuan benang poliester yang menghubungkan lapisan atas dan bawah papan, memungkinkan papan menahan tekanan udara tinggi (15–20 PSI) dan mencapai platform yang kaku serta stabil. Ini adalah standar industri untuk SUPs tiup premium.
    - title: Berapa batas berat untuk papan SUP?
      description: Papan SUP kami mendukung hingga 150 kg tergantung pada model dan volumenya. Papan Leviathan Wake adalah model dengan kapasitas tertinggi, dirancang untuk pengendara yang lebih besar dan penggunaan yoga.
    - title: Apakah Anda menawarkan paket SUP lengkap?
      description: Ya. Setiap papan SUP dikirim dengan paket lengkap termasuk dayung aluminium 3 bagian, pompa tangan bertekanan tinggi, tali pengaman spiral, tas perjalanan, dan kit perbaikan. Beberapa model juga termasuk satu set sirip yang dapat dilepas.
    - title: Apa garansi untuk papan SUP?
      description: Semua papan Paddle Board Overstock SUP dilengkapi garansi 2 tahun terhadap cacat produksi, termasuk kerusakan sambungan, cacat katup, dan delaminasi material saat digunakan secara normal.
    - title: Berapa lama waktu yang dibutuhkan untuk mengisi papan SUP?
      description: Dengan menggunakan pompa tangan yang disertakan, inflasi penuh hingga 15 PSI memakan waktu sekitar 8–12 menit. Untuk inflasi lebih cepat, kami merekomendasikan pompa listrik 12V Paddle Board Overstock kami, yang dapat mengisi papan dalam waktu kurang dari 4 menit.
