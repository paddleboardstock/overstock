testimonial:
  content: Saya menyewa 5 papan dari toko lokal dan kehilangan 60% dari pendapatan saya kepada mereka. Paddle Board Overstock membantu saya membangun armada saya sendiri yang terdiri dari 15 SUPs. Kalkulator ROI yang mereka berikan menunjukkan saya akan balik modal dalam 4 bulan — kenyataannya hanya butuh 3 bulan. Sekarang saya sedang memperluas menjadi 30 papan dan menambahkan kayak.
  name: Daniel Okonkwo
  title: Pemilik, Lakeland SUP Sewa — Ontario, Kanada
content_segments:
  tagline: Profil Sewa
  title: Solusi Penyewaan Olahraga Air<br />Berdasarkan Jenis Operator
  subtitle: Operasi penyewaan yang berbeda memiliki kebutuhan yang berbeda — dari penyewaan SUP tepi pantai kecil hingga pusat olahraga air resor berskala besar. Kami menyesuaikan paket peralatan dan model dukungan kami sesuai dengan itu.
  items:
    - title: Penyewaan Pantai & Tepi Danau SUP
      subtitle: Operasi volume tinggi, kompleksitas rendah
      description: Operator yang menyewakan papan dayung berdiri dan kayak langsung kepada pengunjung pantai dan danau. Prioritas Anda adalah meminimalkan waktu pergantian antar penyewaan, menjaga peralatan tetap dalam rotasi, dan mengelola lonjakan permintaan musiman dengan jejak penyimpanan yang kecil.
      features:
        - Armada SUP tiup yang dapat dilipat — tidak perlu dermaga atau trailer
        - Berlian komersial PVC dengan peringkat untuk 100+ siklus sewa per musim
        - Kain cepat kering, tahan UV untuk kesiapan penyewaan ulang pada hari yang sama
        - Rentang papan berkode warna untuk memudahkan identifikasi armada
    - title: Pusat Olahraga Air Resor & Hotel
      subtitle: Pengalaman tamu dan keselarasan merek
      description: Resor dan hotel yang menawarkan olahraga air sebagai fasilitas di lokasi. Peralatan harus terlihat premium, berfungsi dengan andal untuk tamu pemula hingga menengah, dan terintegrasi dengan alur kerja pemesanan dan penagihan aktivitas yang sudah ada di resor.
      features:
        - Papan dan pelampung bermerek khusus SUP yang sesuai dengan warna resor
        - 'Armada campuran: SUPs, kayak, perahu dayung, dan kapal kecil RIB'
        - Solusi pompa listrik yang tenang dan bebas bahan bakar untuk pengisian di pantai
        - Pelatihan staf dan pengarahan perawatan termasuk
    - title: Operator Penyewaan Perahu & RIB
      subtitle: Armada kapal sewa kelas komersial
      description: Operator yang menyewakan kapal bertenaga — RIB kapal, perahu karet, dan perahu kecil — per jam atau setengah hari. Armada Anda harus memenuhi peraturan keselamatan laut, tahan terhadap penggunaan tamu yang berat, dan meminimalkan waktu henti mekanis antara penyewaan.
      features:
        - Paket RIB dengan 30–90 HP transom siap outboard
        - Panel lantai plywood kelas laut untuk integritas struktural jangka panjang
        - Sistem katup pelepasan cepat untuk pergantian lebih cepat
        - Kit suku cadang + dukungan teknis on-call SLA
    - title: Operator Tur & Petualangan
      subtitle: Armada tur terpandu
      description: Operator yang menjalankan tur olahraga air terpandu — safari SUP, kayak di gua, snorkeling, atau tur RIB keliling pulau. Peralatan harus cukup stabil untuk tamu baru, mudah dibersihkan di antara kelompok, dan cukup tahan lama untuk digunakan setiap hari dalam berbagai kondisi air.
      features:
        - Platform ekstra stabil SUP (lebar 32"+) untuk pengendara pertama kali
        - Pilihan kayak tandem untuk konfigurasi tur pasangan/kelompok
        - Kapasitas kargo bawaan untuk perlengkapan snorkel, tas kering, dan pendingin
        - Dokumentasi kepatuhan CE + USCG untuk operasi komersial
