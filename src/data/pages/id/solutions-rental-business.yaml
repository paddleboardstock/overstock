testimonial:
  content: Saya menyewa 5 papan dari toko lokal dan kehilangan 60% pendapatan saya kepada mereka. Paddle Board Overstock membantu saya membangun armada sendiri dari 15 SUPs. Kalkulator ROI yang mereka sediakan menunjukkan saya akan impas dalam 4 bulan — sebenarnya hanya butuh 3 bulan. Sekarang saya sedang memperluas menjadi 30 papan.
  name: Daniel Okonkwo
  title: Pemilik, Lakeland SUP Sewa — Ontario, Kanada
content_segments:
  tagline: Profil Sewa
  title: Solusi Penyewaan Olahraga Air<br />Berdasarkan Jenis Operator
  subtitle: Operasi penyewaan yang berbeda memiliki kebutuhan yang berbeda — dari penyewaan SUP tepi pantai kecil hingga pusat olahraga air resor berskala besar. Kami menyesuaikan paket peralatan dan model dukungan kami sesuai dengan itu.
  items:
    - title: Penyewaan Pantai & Tepi Danau SUP
      subtitle: Operasi volume tinggi, kompleksitas rendah
      description: Operator yang menyewakan papan paddle berdiri langsung kepada pengunjung pantai dan danau. Prioritas Anda adalah meminimalkan waktu putar antara penyewaan, menjaga peralatan tetap berotasi, dan mengelola lonjakan permintaan musiman dengan jejak penyimpanan yang kecil.
      features:
        - Armada SUP tiup yang dapat dilipat — tidak perlu dermaga atau trailer
        - Berlian komersial PVC dengan peringkat untuk 100+ siklus sewa per musim
        - Kain cepat kering, tahan UV untuk kesiapan penyewaan ulang pada hari yang sama
        - Rentang papan berkode warna untuk memudahkan identifikasi armada
    - title: Pusat Olahraga Air Resor & Hotel
      subtitle: Pengalaman tamu dan keselarasan merek
      description: Resor dan hotel yang menawarkan olahraga air sebagai fasilitas di lokasi. Peralatan harus terlihat premium, berfungsi dengan andal untuk tamu pemula hingga menengah, dan terintegrasi dengan alur kerja pemesanan dan penagihan aktivitas yang sudah ada di resor.
      features:
        - Papan dan pelampung bermerek khusus SUP yang sesuai dengan warna resor
        - 'Armada campuran: serba bisa, touring, dan seri seni SUPs'
        - Solusi pompa listrik yang tenang dan bebas bahan bakar untuk pengisian di pantai
        - Pelatihan staf dan pengarahan perawatan termasuk
    - title: Penyewaan Boutique & Mobile SUP
      subtitle: Layanan sewa pop-up dan berbasis pengiriman
      description: Operator membawa papan langsung ke pelanggan — pengiriman ke pantai hotel, stasiun sewa pop-up di acara, dan pengaturan mobile. Peralatan harus cepat untuk dipasang, mudah dibawa, dan terlihat menarik pada pandangan pertama, dengan ukuran armada yang fleksibel untuk acara dan permintaan musiman.
      features:
        - Transportasi papan gaya ransel — tidak memerlukan trailer
        - Inflasi cepat untuk pengaturan on-demand dalam waktu kurang dari 15 menit
        - Peralatan yang menarik dan terlihat premium pada pandangan pertama
        - Ukuran armada fleksibel untuk acara dan permintaan musiman
    - title: Operator Tur & Petualangan
      subtitle: Armada tur terpandu
      description: Operator menjalankan tur olahraga air terpanduan — SUP safari, perjalanan snorkeling, dan tur eksplorasi pesisir. Peralatan harus stabil untuk tamu tur pemula, cepat dibersihkan antar grup, dan cukup tahan lama untuk penggunaan harian dengan panduan di berbagai kondisi air.
      features:
        - Platform ekstra stabil SUP (lebar 32"+) untuk pengendara pertama kali
        - Platform stabil ekstra besar untuk foto tur pasangan/grup
        - Kapasitas kargo bawaan untuk perlengkapan snorkel, tas kering, dan pendingin
        - Paket peralatan keselamatan untuk operasi tur komersial
