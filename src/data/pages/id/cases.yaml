features3_cases:
  tagline: Kasus Unggulan
  title: Solusi Kustom<br />Untuk Tantangan Nyata
  isBeforeContent: false
  columns: 3
  items:
    - title: Upgrade Operasi Harian Pusat Selam Bali
      customer: Pusat Menyelam Blue Ocean
      country: Indonesia
      industry: Pusat Menyelam Komersial
      challenge: Blue Ocean Diving Center di Bali mengoperasikan kapal selam fiberglass tua dengan ruang dek terbatas, penyelam yang sulit untuk boarding, dan perawatan tinggi di kondisi air asin tropis. Pemuatan peralatan padat, waktu persiapan lama, dan platform yang tidak stabil menimbulkan kekhawatiran keselamatan bagi wisatawan internasional — termasuk penyelam pertama kali dan pelancong yang lebih tua. Pusat ini menjalankan 3-5 perjalanan menyelam setiap hari, 200+ hari per tahun.
      solution: Aquafarer menyediakan Penyelaman Profesional khusus setinggi 6,8m RIB dengan tata letak dek yang diperluas yang dioptimalkan untuk penyimpanan peralatan scuba, tangga selam baja tahan karat yang lebar, Hypalon tabung tahan air UV asin untuk permukaan dek anti selip, dan solusi penyimpanan tangki. Konfigurasi ini dirancang berdasarkan alur kerja harian pusat selam — tidak berdasarkan tata letak perahu rekreasi standar.
      product: Menyelam RIBProfesional 6,8m
      results: Area kerja yang lebih besar meningkatkan efisiensi persiapan peralatan. Penyelam mengalami proses boarding yang lebih aman dan mudah. Kebutuhan perawatan berkurang secara signifikan. Pusat ini memperoleh kapasitas untuk menangani lebih banyak pelanggan selama musim puncak dengan kepercayaan diri yang lebih tinggi. Pusat RIB ini menjadi fondasi operasi penyelaman harian.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Perahu selam kami bukan hanya transportasi. Ini adalah fondasi dari operasi harian kami.Aquafarer RIB Memberikan tim kami kepercayaan diri lebih saat melakukan beberapa perjalanan menyelam setiap hari.
      icon: tabler:lifebuoy
    - title: Peningkatan Profesional Phuket Dive Center RIB
      customer: Pusat Menyelam Ocean Explorer
      country: Thailand
      industry: Pusat Menyelam Komersial
      challenge: Ocean Explorer Diving Center di Phuket, Thailand, perlu melakukan peningkatan dari kapal selam fiberglass tradisional yang tidak mampu memenuhi permintaan pelanggan yang terus meningkat. Ruang dek yang terbatas membuat persiapan peralatan menjadi tidak efisien. Boarding yang sulit menciptakan tantangan keselamatan bagi wisatawan internasional. Kebutuhan perawatan tinggi di kondisi air asin tropis meningkatkan biaya operasional. Pusat ini mengoperasikan beberapa perjalanan harian, 200+ hari per tahun.
      solution: Aquafarer menyediakan Penyelaman Komersial setinggi 6,8m RIB yang disesuaikan dengan tata letak dek kerja yang dioptimalkan untuk penyimpanan tangki scuba, persiapan peralatan, dan pergerakan penyelam. Fitur-fitur termasuk tangga menyelam lebar dengan pegangan baja tahan karat, konstruksi tabung tahan berat dengan UVbahan tahan selip, lantai anti selip, solusi penyimpanan tangki, konsol profesional, dan tempat duduk penumpang — semuanya dikonfigurasi untuk operasi penyelaman komersial.
      product: Menyelam RIBKomersial 6,8m
      results: Area dek yang lebih besar memungkinkan organisasi peralatan yang lebih cepat dan alur kerja harian yang lebih efisien. Kenyamanan dan keselamatan naik pesawat pelanggan meningkat secara signifikan. Waktu henti perawatan berkurang dengan konstruksi kelas laut. Pusat menyelam dapat melayani lebih banyak pelanggan selama musim puncak dan memperluas layanan menyelam profesional dengan percaya diri.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Bagi pusat selam, perahu bukan sekadar transportasi. Perahu adalah bagian penting dari operasi harian kami.Aquafarer RIB Memberikan kepercayaan diri kepada tim kami untuk menjalankan beberapa perjalanan menyelam setiap hari dengan keamanan dan efisiensi yang lebih baik.
      icon: tabler:lifebuoy
    - title: Armada Pusat Selam Eropa
      customer: Pusat Menyelam BlueMed
      country: Yunani
      industry: Menyelam & Pariwisata Laut
      challenge: Dibutuhkan 12 RIBs yang dikonfigurasi untuk menyelam untuk rangkaian pusat menyelam di berbagai pulau di Yunani. Setiap kapal memerlukan tangga selam khusus, tempat penyimpanan tabung untuk 8 tabung, dan platform yang stabil untuk masuk penyelam di perairan terbuka. Armada harus tiba dalam waktu 60 hari untuk memulai musim wisata.
      solution: Diproduksi 12 model RIB 520 Dive dengan rak tabung terintegrasi, tangga selam, dan tabung Hypalon ekstra lebar untuk stabilitas saat naik ke kapal. Setiap kapal diberi merek dengan desain armada pelanggan. Semua 12 kapal diuji tekanan dan dikirim dari Qingdao dalam 55 hari.
      product: RIB 520 Dive
      results: Semua 12 kapal dikirim tepat waktu untuk musim wisata. Armada telah beroperasi setiap hari selama 18+ bulan tanpa kegagalan material. Pelanggan memesan 6 unit tambahan di tahun kedua.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: RIB 520 Dive telah menjadi tulang punggung operasi menyelam harian kami. Stabilitas saat diam sangat baik, dan tata letak penyimpanan tabung menjaga dek tetap bersih dan aman untuk tamu kami.
      icon: tabler:lifebuoy
    - title: Program Distributor Australia OEM
      customer: Pacific Watersports Pty Ltd
      country: Australia
      industry: OEM/ODM Manufaktur
      challenge: Distributor Australia membutuhkan rangkaian papan SUP label pribadi dengan harga kompetitif untuk bersaing dengan merek Tiongkok langsung ke konsumen. Dibutuhkan 8 model unik mulai dari pemula hingga mahir, dengan grafik khusus, kemasan khusus, dan pemenuhan drop-ship ke toko ritel.
      solution: Dikembangkan 8 model SUP (All-Around, Touring, Yoga, Anak-anak, Sport, Ultra-Compact, Ultra-Stable, Whitewater) dengan paket grafik eksklusif Australia. Kemasan ritel khusus dengan kode QR yang tertaut ke video pemasangan. Logistik drop-ship dikonfigurasi dari Qingdao langsung ke toko ritel Australia.
      product: Garis SUP Khusus (8 model)
      results: Dari konsep hingga pengiriman pertama dalam 90 hari. Tingkat penjualan ritel 85% di musim pertama. Distributor memperluas kemitraan untuk mencakup lini perahu karet pada tahun kedua.
      image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-ocean-voyager-1.webp
      quote: Aquafarer menghasilkan seluruh lini SUP dalam 90 hari — dari desain awal hingga rak ritel. Kualitasnya setara dengan merek yang dijual dengan harga dua kali lipat.
      icon: tabler:arrows-exchange
    - title: Pasokan Perahu Penyelamat Timur Tengah
      customer: Otoritas Pertahanan Sipil Nasional
      country: Uni Emirat Arab
      industry: Pencarian & Penyelamatan
      challenge: Organisasi pertahanan sipil membutuhkan 20 RIBs siap patroli untuk pencarian dan penyelamatan di pantai, keamanan pelabuhan, dan tanggap banjir. Diperlukan dek yang mengalir sendiri, suite navigasi lengkap (GPS, radar, VHF), tabung oranye yang terlihat jelas, dan kepatuhan terhadap peraturan maritim lokal.
      solution: Menyuplai 20 model RIB 450 Patrol dengan dek yang mengalir sendiri, suite navigasi Garmin, lampu sorot LED, pita reflektif SOLAS, dan tabung Hypalon oranye yang terlihat jelas. Setiap kapal bersertifikasi CE dan diuji sesuai standar ISO 6185. Paket dokumentasi termasuk sertifikat kepatuhan untuk pendaftaran lokal.
      product: RIB 450 Patrol
      results: Armada dikerahkan di 5 stasiun pesisir. Kapal telah beroperasi dalam panas ekstrem (45°C+) tanpa degradasi tabung. Jangkauan patroli dan efisiensi bahan bakar melebihi spesifikasi sebesar 12%.
      image: https://assets.aquafarer.com/images/aquafarer/categories/aquafarer-rescue-operations.webp
      quote: RIB 450 Patrol melebihi persyaratan operasional kami. Dalam kondisi panas ekstrem, tabung Hypalon tidak menunjukkan tanda-tanda degradasi UV setelah 24 bulan penggunaan harian.
      icon: tabler:alert-triangle
    - title: Kemitraan Merek Eropa OEM
      customer: North Sea Marine Equipment BV
      country: Belanda
      industry: OEM/ODM Manufaktur
      challenge: Merek peralatan laut Eropa yang sudah mapan ingin berkembang ke pasar RIB tanpa berinvestasi dalam fasilitas manufaktur. Dibutuhkan mitra label putih yang mampu memproduksi 5 model RIB (3,9m hingga 6,2m) dengan merek pribadi, sertifikasi CE, dan hak distribusi eksklusif UE.
      solution: Perjanjian manufaktur white-label untuk 5 model telah ditetapkan RIB . Setiap model diberi merek dengan logo pelanggan dan skema warna.CE Dokumentasi sertifikasi disiapkan untuk setiap model. Hak distribusi eksklusif Uni Eropa diberikan dengan komitmen pesanan minimum. Dokumentasi teknis dan katalog suku cadang disediakan untuk jaringan layanan lokal.
      product: RIB Custom Line (5 model)
      results: Perjanjian multi-tahun ditandatangani. Produksi pertama 50 unit dikirim dalam 75 hari. Merek diluncurkan di METSTRADE dengan penerimaan dealer yang positif.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Bekerja sama Aquafarer memungkinkan kami masuk ke RIB pasar tanpa perlu membangun pabrik — mereka menghadirkan solusi lengkap siap pakai dengan CE sertifikasi dan dokumentasi dukungan dealer.
      icon: tabler:building
    - title: Armada Resor Karibia
      customer: Paradise Island Resorts Ltd
      country: Bahama
      industry: Pariwisata Laut & Perhotelan
      challenge: 'Resor mewah ini membutuhkan armada lengkap perlengkapan olahraga air untuk aktivitas tamu: 40 SUP papan untuk tur berpemandu, 20 kayak untuk eksplorasi laguna, 10 perahu tiup untuk transfer tamu dan wisata memancing, serta aksesori. Semua peralatan memerlukan merek resor khusus dan harus dikirim sebelum musim wisata puncak.'
      solution: 'Memproduksi paket olahraga air lengkap: 40 SUP papan Voyager (model Serba Bisa), 20 kayak Explorer, 10 AirDeck perahu tiup 360, plus PFD, dayung, pompa, dan kit perbaikan. Semua peralatan dicetak dengan logo resor dan skema warna tropis. Pengiriman kontainer dengan manifest inventaris lengkap.'
      product: Paket Olahraga Air Lengkap (70+ unit)
      results: Armada tiba 6 minggu sebelum musim puncak. Skor kepuasan tamu untuk aktivitas olahraga air meningkat 40% dari tahun ke tahun. Peralatan telah bertahan selama 3 musim dengan hanya perawatan rutin.
      image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-outdoor-adventure.webp
      quote: Pendekatan paket lengkap berarti kami menerima semua yang kami butuhkan dalam satu pengiriman — papan, kayak, perahu, dan aksesori yang semuanya bermerek dan siap digunakan oleh tamu. Tamu kami menyukai kualitas perlengkapannya.
      icon: tabler:beach
    - title: Peningkatan Pusat Selam Komersial Queensland RIB
      customer: Pusat Menyelam Komersial
      country: Australia
      industry: Layanan Menyelam & Laut Komersial
      challenge: Sebuah pusat penyelaman komersial yang berbasis di Queensland yang mengkhususkan diri dalam inspeksi infrastruktur laut, pemeliharaan pelabuhan, dan proyek perbaikan bawah air sedang mengoperasikan kapal kerja yang sudah tua. Seiring meningkatnya permintaan proyek, kapal lama menjadi beban — perawatan yang sering menyebabkan gangguan jadwal, tata letaknya tidak dirancang untuk operasi penyelaman modern (ruang terbatas untuk silinder, alat, dan peralatan), serta kenyamanan kru selama operasi panjang sangat buruk. Perusahaan membutuhkan kapal yang dapat mendukung operasi profesional mereka setiap hari berkerja.
      solution: Aquafarer Melakukan analisis operasional mendetail terhadap alur kerja penyelaman pelanggan, durasi proyek tipikal, ukuran kru, dan kebutuhan peralatan. Berdasarkan analisis ini, Aquafarer kami memberikan profesional yang disesuaikan RIB dengan tata letak dek fungsional yang dioptimalkan untuk persiapan peralatan dan pergerakan penyelam, tempat duduk profesional untuk periode transportasi yang lebih lama, stabilitas yang ditingkatkan untuk masuk dan keluar penyelam yang lebih aman, serta fitur dukungan menyelam yang terintegrasi dalam desain.
      product: Menyelam RIBProfesional Kustom
      results: Kapal baru RIB ini menjadi platform kerja harian yang andal. Persiapan peralatan menjadi lebih cepat dengan tata letak yang dioptimalkan. Kru melaporkan peningkatan kenyamanan dan keselamatan selama operasi panjang. Penampilan profesional kapal memperkuat kepercayaan pelanggan saat bekerja dengan operator pelabuhan dan kontraktor kelautan. Pusat penyelaman mendapatkan kapal yang sesuai dengan profesionalisme layanan mereka.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-450-patrol-boat.webp
      quote: Kami membutuhkan perahu yang dapat mendukung bisnis kami setiap hari, bukan hanya sebuah kapal untuk transportasi. Aquafarer bekerja sama dengan kami untuk memahami kebutuhan operasional kami dan memberikan solusi RIB yang sesuai dengan alur kerja menyelam komersial kami.
      icon: tabler:lifebuoy
    - title: Kontrak Patroli Pesisir AS
      customer: Badan Keamanan Pesisir Atlantik
      country: Amerika Serikat
      industry: Keamanan Maritim & Penegakan Hukum
      challenge: Badan keamanan pesisir AS membutuhkan patroli berat RIBs untuk operasi intersepsi perairan terbuka. Dibutuhkan konfigurasi mesin kembar untuk redundansi, konsol berlapis baja untuk perlindungan kru, elektronik spesifikasi militer (komunikasi terenkripsi, FLIR, radar), dan kepatuhan terhadap peraturan Penjaga Pantai AS.
      solution: Dirancang RIB 600 Patrol dengan konfigurasi kapal pesiar kembar 115 HP, konsol berlapis baja dengan perlindungan balistik, pencitraan termal FLIR, komunikasi VHF/UHF terenkripsi, dan titik pemasangan senjata terintegrasi. Lambung diperkuat untuk manuver intersep kecepatan tinggi. Semua elektronik terintegrasi dan diuji di pabrik. Dokumentasi kepatuhan USCG disediakan.
      product: RIB 600 Patroli (Mesin Kembar)
      results: Perahu mencapai kecepatan puncak 52 knot selama uji penerimaan. Badan melaporkan tingkat kesiapan misi 95% selama 12 bulan pertama. Pesanan tambahan dilakukan untuk 8 unit.
      image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
      quote: Mesin kembar RIB 600 memberikan kru kami kecepatan dan redundansi yang diperlukan untuk operasi penangkapan di perairan terbuka. Konsol berlapis baja menyediakan perlindungan penting tanpa mengorbankan performa.
      icon: tabler:shield
