features3_cases:
  tagline: Cerita Unggulan
  title: Papan Asli<br />Untuk Petualangan Sejati
  isBeforeContent: false
  columns: 3
  items:
    - title: Dari Sofa hingga Berdiri di Percobaan Pertama
      customer: Pendayung Pertama Kali
      country: Jerman
      industry: Rekreasi Pemula
      challenge: Anna belum pernah mendayung sebelumnya dan merasa gugup tentang keseimbangan, air dingin, dan terlihat konyol di depan orang lain. Tinggal di apartemen kecil di Munich, dia juga tidak punya tempat untuk menyimpan papan keras dan tidak ada rak atap untuk transportasi.
      solution: SUP Explorer 11 menawarkan platform yang lebar dan stabil yang memaafkan gerakan pertama yang goyah. Paket lengkap — papan, paddle yang dapat disesuaikan, pompa, tali, dan tas — memungkinkan dia membawa semuanya ke danau dengan berjalan kaki. Dari kotak ke air dalam waktu kurang dari 20 menit, tanpa pengalaman yang diperlukan.
      product: SUP Penjelajah 11
      results: Anna berdiri pada percobaan pertamanya dan mendayung selama satu jam tanpa jatuh. Dua bulan kemudian dia mendayung tiga kali seminggu dan bergabung dengan kelompok pertemuan lokal. Papan itu dikemas ke dalam ransel yang muat di lemari lorongnya.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
      quote: Saya berharap hari pertama saya akan berenang di samping papan. Sebaliknya, saya sudah meluncur melintasi danau dalam hitungan menit — saya tidak percaya betapa stabilnya rasanya.
      icon: tabler:school
    - title: Satu papan, dua anak, tidak ada keluhan
      customer: Keluarga Empat
      country: Italia
      industry: Rekreasi Keluarga
      challenge: Marco dan Giulia menginginkan aktivitas musim panas yang benar-benar dijadikan tempat kedua anak mereka meninggalkan layar mereka. Inflatable murah sebelumnya melengkung, bocor di jahitan, dan kempes di tengah dayung — anak-anak kehilangan kepercayaan diri setelah satu kali berenang buruk.
      solution: Seri Tropical Breeze menghadirkan kanvas penuh liburan pulau — sinar matahari, kebun kelapa, dan pemandangan pantai — yang membuat anak-anak ingin segera naik ke air. drop-stitch Inti berjalan kaku pada 15 meter PSI, dan setiap papan diuji tekanan hingga 1,25x tekanan dari tekanan yang dinilai selama 24-48 jam di pabrik sebelum dikirim.
      product: Seri Angin Tropis
      results: Keluarga sekarang mendayung setiap akhir pekan dari Juni hingga September. Setelah satu musim penuh lalu lintas anak, papan tidak menunjukkan stres sambungan atau memudar. Putri mereka mulai meminta papan sendiri untuk ulang tahunnya.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
      quote: Anak-anak berebut giliran siapa yang mendayung. Setelah papan murah yang kami coba sebelumnya, yang ini terasa seperti dibuat untuk bertahan hidup di keluarga kami.
      icon: tabler:users
    - title: Studio Yoga Terapung saat Matahari Terbit
      customer: Praktisi Yoga
      country: Indonesia
      industry: SUP Yoga & Meditasi
      challenge: Putu mengajar yoga di Bali dan ingin membawa latihannya ke air, tetapi percobaan pertamanya menggunakan papan pinjaman terasa licin dan tidak stabil. Menahan pose saat hanyut di perairan terbuka membutuhkan cengkeraman, stabilitas, dan desain yang menenangkan.
      solution: Seri Flowing Lotus memadukan karya seni teratai, koi, dan capung dengan bantalan traksi yang diukir laser yang menjaga tangan dan kaki tetap menempel ke bawah. Garis besar yang lebar dan ketebalan 6 inci menciptakan platform mengambang yang stabil untuk aliran dan meditasi duduk.
      product: Seri Flowing Lotus
      results: Sekarang Putu memimpin kelas yoga kecil saat matahari terbit SUP dua kali seminggu. Murid-muridnya memesan jadwal beberapa minggu sebelumnya, dan papan tersebut telah menjadi ciri khas kelasnya — karya seni itu menjadi setengah dari pemasarannya.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
      quote: Berlatih di atas air mengubah segalanya. Papan cukup stabil untuk pose gagak, dan desain teratai membuat setiap kelas terasa seperti ritual.
      icon: tabler:heart
    - title: Konten yang Tak Pernah Pudar — Secara Literal
      customer: Pembuat Konten Perjalanan
      country: Portugal
      industry: Media Sosial & Pembuatan Konten
      challenge: Miguel memotret konten paddle untuk mencari nafkah. Papan cetak yang dulu ia gunakan kehilangan warnanya dalam satu musim air asin dan matahari — rekamannya mulai terlihat lelah, dan para pengikut memperhatikan pad dek yang mengelupas.
      solution: Cheetah Surge Edition membangun motif cheetah-nya dari potongan blok berwarna-warni yang dipotong mati EVA , bukan dari tinta permukaan. Warna-warna tersebut merupakan bagian dari busa itu sendiri, sehingga air asin, UV, dan lalu lintas pejalan kaki tidak dapat memudar, mengelupas, atau menggores desainnya.
      product: Edisi Cheetah Surge
      results: Setahun penuh pemotretan di pesisir kemudian, papan tersebut tampak seperti baru di depan kamera. Klip matahari terbitnya dari Algarve menjadi konten terbaiknya, dan papan itu sendiri muncul dalam puluhan kolaborasi merek.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
      quote: Papan lama saya menua lebih cepat daripada konten saya. Cheetah terlihat persis seperti hari pertama setelah setahun di laut — pengikut saya terus bertanya filter apa yang saya gunakan. Itu bukan filter. Itu adalah papannya.
      icon: tabler:camera
    - title: Ekspedisi Pesisir Akhir Pekan
      customer: Pendayung Touring Pesisir
      country: australia
      industry: Tur & Eksplorasi
      challenge: Tom ingin mendayung di teluk dan tanjung Gold Coast yang tenang dalam tur berjam-jam, tapi papan ringan dengan anggaran melentur saat berombak dan membuatnya kelelahan setelah satu jam. Dia butuh kekakuan yang bisa dia bawa sendiri ke tempat terpencil.
      solution: Seri Ocean Voyager menggabungkan karya penyu laut berwarna teal tua dan karang dengan inti kaku drop-stitch yang mempertahankan bentuk melalui potongan pantai yang ringan. Dengan berat sekitar 20 lbs di ranselnya, Tom dapat mendaki ke pantai yang tidak bisa dijangkau mobil, mengembangkannya dengan pompa yang disertakan, dan berkeliling selama berjam-jam.
      product: Seri Ocean Voyager
      results: Tom kini telah memetakan sebelas rute pesisir, termasuk penyeberangan pagi penuh yang dulu ia anggap di luar kemampuannya. Papan tetap kaku dari peluncuran hingga makan siang, dan desain penyu laut telah menjadi ciri khasnya di air.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
      quote: Papan kaku terasa seperti papan keras, dan yang ini bisa dibawa seperti ransel. Papan ini membuka seluruh garis pantai yang tidak pernah bisa saya jangkau dengan mobil dan trailer.
      icon: tabler:compass
    - title: Kebugaran Seluruh Tubuh, Tanpa Biaya Gym
      customer: Pendayung Kebugaran
      country: Kanada
      industry: Kebugaran & Pelatihan
      challenge: Priya menginginkan latihan seluruh tubuh dengan dampak rendah yang tidak terasa seperti latihan. Berlari menyakitkan lututnya, dan gym terasa berulang — dia berhenti dari semua rutinitas dalam enam minggu.
      solution: 'Seri Dolphin Wave mengubah olahraga menjadi permainan: mendayung membakar kalori, membangun kekuatan inti dan bahu, serta menantang keseimbangan, sambil melaju melewati pemandangan Vancouver. Deck stabil berukuran 32 inci memaafkan gerakan canggung namun tetap menuntut mikro keseimbangan yang konstan — sebuah gym yang menyamar sebagai papan dayung.'
      product: Seri Dolphin Wave
      results: Priya mendayung lima pagi seminggu sebelum bekerja dan telah menjaga rutinitas itu selama 14 bulan — rekor pribadinya untuk rencana olahraga apa pun. Teman-teman kini bergabung dengan klub dayung mingguannya, dan lututnya belum pernah sebahagia ini.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-dolphin-wave-1.webp
      quote: Saya tidak pernah sekalipun harus memaksa diri untuk mendayung. Latihan ini nyata — saya hanya berhenti menyadarinya karena terlalu sibuk menikmati air.
      icon: tabler:trophy
    - title: Seekor labrador seberat 30 kilo dan satu dek yang sangat stabil
      customer: Pendayung dengan Anjing
      country: Amerika Serikat
      industry: Mendayung dengan Hewan Peliharaan
      challenge: Jake ingin membawa Labrador-nya, Biscuit, ke air, tapi papan sempit lamanya berubah menjadi kapal selam begitu anjing itu melompat ke kapal. Cakar juga merobek dek murah itu dalam hitungan minggu.
      solution: Seri Leviathan Wake menawarkan platform lebar dan bervolume tinggi yang membawa pendayung plus penumpang seberat 30 kilo tanpa terkulai. EVA Dek traksi bertahan dari cakar yang menghancurkan papan sebelumnya, dan totem paus biru memberikan "tempat" yang jelas terlihat untuk Biscuit duduk.
      product: Seri Leviathan Wake
      results: Biscuit sekarang melompat ke kapal atas perintah dan menumpang di haluan seperti boneka. Dua musim panas berlalu, dek tidak menunjukkan kerusakan cakar, dan dayung sungai mereka menjadi konten paling disukai di feed Jake.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-leviathan-wake-1.webp
      quote: Saya membeli papan dan mendapatkan wakil kapal. Dek itu mengabaikan segala sesuatu yang bisa dilemparkan anjing basah besar — secara harfiah.
      icon: tabler:dog
    - title: Anggaran Mahasiswa, Kualitas Harga Penuh
      customer: mahasiswa universitas
      country: Polandia
      industry: Gaya Hidup Mahasiswa
      challenge: Kasia adalah mahasiswa di Gdansk dengan anggaran mahasiswa dan rutinitas musim panas di danau danau musim panas. Setiap papan murah yang dia temukan tipis dan jelek, atau keduanya — dan papan berkualitas harganya lebih mahal daripada anggaran makanannya setiap bulan.
      solution: Seri Medusa Glow memadukan kualitas premium — drop-stitch core, PSI 15 rigidity, karya seni ubur-ubur berwarna hijau mint yang dirakit dari blok die-cut EVA — dengan Paddle Board Overstock harga clearance langsung pabrik yang melewati setiap margin perantara.
      product: Seri Medusa Glow
      results: Kasia membayar kurang dari setengah harga papan premium sebanding yang dijual secara lokal. Papan miliknya bertahan satu musim penuh sesi danau harian dan minggu pantai Baltik, dan tiga teman sekelas memesan sendiri setelah mencoba miliknya.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
      quote: Saya mengharapkan kompromi anggaran mahasiswa. Sebaliknya, saya mendapatkan papan yang menurut teman-teman saya harganya tiga kali lipat — dan papan itu bertahan lebih lama dari dua papan mereka.
      icon: tabler:backpack
    - title: Melepas dari Platform yang Stabil
      customer: Pemancing Akhir Pekan
      country: Amerika Serikat
      industry: SUP Memancing Kasual
      challenge: Devon memancing di perairan belakang yang tenang dan terlalu dangkal untuk dijangkau oleh kapal motor mana pun. Dia membutuhkan kapal dayung yang cukup stabil untuk melempar saat berdiri, cukup kuat untuk mengait dan perlengkapan, dan cukup ringan untuk membawa jalan di sepanjang fajar.
      solution: Seri Mandala Hutan memberinya platform berdiri yang lebar dan kaku untuk melempar, dengan dek hibiscus dan burung kolibri berwarna Tiffany Blue yang tetap sejuk di bawah sinar matahari pagi. Papan ini bisa dikemas seukuran ransel untuk jalur masuk, mengembang dalam hitungan menit di tepi air, dan PVC kulit yang diperkuat terlepas dari kail dan sentuhan sirip.
      product: Seri Mandala Hutan
      results: Devon kini mencapai tiga teluk bertelur yang tidak bisa dipancing oleh orang lain. Tingkat tangkapannya meningkat dua kali lipat selama musim ini, dan papan — dengan kail, stringer, dan semuanya — masih tampak siap untuk musim panas berikutnya.
      image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-jungle-mandala-1.webp
      quote: Berdiri di atas cara SUP saya memancing benar-benar berubah. Papan ini cukup stabil untuk melempar, memasang kail, dan mendaratkan ikan — semua tanpa basah.
      icon: tabler:fish
