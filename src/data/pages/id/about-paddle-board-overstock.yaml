hero:
  tagline: Tentang
  title: Tentang Paddle Board Overstock
  subtitle: Sejak 2012, kami telah menaruh papan SUP tiup baru ke tangan para penggemar dayung dan pengecer kecil di 50+ negara — inventaris surplus, harga jujur, dan garansi yang benar-benar kami hormati.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Paddle Board Overstock papan SUP tiup baru
direct_answer: Paddle Board Overstock adalah merek peralatan olahraga air yang didirikan pada 2012 dan berbasis di Weihai, Tiongkok. Kami menjual papan SUP tiup baru dari inventaris surplus — campuran produksi surplus dari basis manufaktur kami sendiri dan stok yang dipilih dengan cermat dari pabrik mitra — langsung ke para penggemar dayung dan ke pengecer kecil di 50+ negara. Setiap papan melewati uji tekanan 100%, didukung oleh Garansi SUP 2 Tahun, dan dikirim melalui ekspres atau pengiriman laut.
tldr_points:
  - Didirikan 2012, berbasis di Weihai, Tiongkok — salah satu pusat manufaktur SUP utama dunia
  - 'Model surplus: papan baru dengan harga di bawah eceran, tanpa perantara'
  - 'Inventaris sumber campuran: produksi surplus dari basis kami plus stok pabrik mitra yang terverifikasi'
  - 50+ negara dilayani, 99,3% tingkat lolos inspeksi akhir, Garansi SUP 2 Tahun
story_section:
  tagline: Kisah Kami
  title: Mengapa Kami Menjual Surplus
  paragraphs:
    - Paddle Board Overstock dimulai pada 2012 di Weihai, Tiongkok — sebuah kota pesisir di provinsi Shandong yang telah berkembang menjadi salah satu pusat manufaktur SUP tiup paling penting di dunia. Dari basis itu, kami telah menghabiskan lebih dari satu dekade membuat papan dayung tiup dan mengirimkannya ke seluruh dunia.
    - Along the way we noticed something that shapes everything we do today: Setiap musim produksi meninggalkan papan baru yang sempurna — produksi surplus, pesanan yang dibatalkan, warna musim lalu. Sementara itu, pengecer independen di seluruh dunia terkunci dari grosir karena pemasok tradisional menuntut pesanan dalam jumlah kontainer.
    - Kesenjangan itu adalah bisnis kami. Dengan menjual inventaris surplus — produksi surplus dari basis Weihai kami sendiri, ditambah stok yang dipilih dengan cermat dari pabrik mitra — kami dapat menawarkan papan baru dengan harga jauh di bawah eceran biasa, dalam jumlah yang cukup untuk satu penggemar dayung atau pesanan lima papan. Tidak ada yang bekas, tidak ada yang kedua; ini hanyalah inventaris yang pantas mendapatkan pelanggan daripada gudang.
model_section:
  tagline: Model Bisnis Kami
  title: Cara Kerja Model Surplus
  items:
    - title: Baru, Tidak Pernah Digunakan
      description: Setiap papan yang kami jual adalah baru dan belum digunakan. Surplus berarti inventaris lebih dan kelebihan — bukan barang retur, bukan rekondisi, bukan barang kedua.
    - title: Inventaris Sumber Campuran
      description: Stok kami menggabungkan produksi surplus dari basis manufaktur Weihai kami sendiri dengan inventaris yang dipilih dari pabrik mitra, yang kami pertahankan dengan standar kualitas yang sama. Sumber campuran; standar tidak.
    - title: Harga Di Bawah Eceran
      description: Inventaris surplus menghabiskan biaya lebih rendah bagi kami untuk diperoleh, jadi biayanya lebih rendah untuk Anda beli. Tidak ada harga daftar yang dilebihkan, tidak ada diskon palsu — hanya harga jujur untuk inventaris nyata.
    - title: Grosir Ramah Usaha Kecil
      description: Grosir dimulai dari 5 papan, bukan muatan kontainer. Pengecer kecil dapat mencampur model apa pun yang tersedia dalam satu pesanan dan memilih ekspres atau pengiriman laut.
    - title: Pengiriman Langsung ke Anda
      description: Pesanan dikirim langsung dari basis logistik Weihai kami ke pintu Anda di 50+ negara — ekspres untuk sampel dan pesanan kecil, pengiriman laut konsolidasi untuk grosir.
quality_section:
  tagline: Kualitas & Garansi
  title: Kualitas di Balik Setiap Papan
  subtitle: Harga surplus tidak pernah berarti standar dilonggarkan. Setiap papan — apapun sumbernya — melewati proses yang sama sebelum dikirim.
  items:
    - title: 100% Diuji Tekanan
      description: Setiap papan diuji tekanan dan dipompa hingga 15 PSI sebelum dikirim. Tidak ada papan yang dikirim tanpa diuji, terlepas dari dari mana inventarisnya berasal.
    - title: Diuji Beban Berlebih hingga 1,25x
      description: Papan dari produksi kami diuji sampel di atas tekanan yang ditentukan — ditahan pada tekanan kerja 1,25x selama 24–48 jam untuk memverifikasi sambungan, katup, dan konstruksi drop-stitch.
    - title: Tingkat Lulus Inspeksi Akhir 99,3%
      description: Proses inspeksi akhir kami meluluskan 99,3% papan sebagai bebas cacat — dan sebagian kecil yang gagal tidak pernah masuk ke inventaris overstock kami.
    - title: Garansi SUP 2 Tahun
      description: Setiap papan SUP memiliki Garansi SUP 2 Tahun yang mencakup cacat produksi. Garansi yang sama berlaku untuk setiap pelanggan di semua 50+ pasar kami.
