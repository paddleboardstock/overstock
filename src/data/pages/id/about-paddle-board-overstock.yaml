team_section:
  tagline: Tim
  title: Orang-orang di Balik Papan
  description: Kantor kami di Weihai menjadi rumah bagi tim riset dan pengembangan yang kuat berjumlah 14+ yang mencakup material, desain struktural, dan proses produksi. Di sekitar mereka beroperasi tim yang lebih luas yang menangani kontrol kualitas, inventaris, logistik, dan dukungan yang Anda hubungi ketika mengontak kami — orang yang sama, apakah Anda membeli satu papan atau dua puluh.
