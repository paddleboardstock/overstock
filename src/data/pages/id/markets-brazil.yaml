hero:
  tagline: Brasil
  title: Papan Grosir SUP untuk<br />Pengecer Brasil
  subtitle: Untuk toko dan operator dari Rio dan Florianópolis hingga pantai Timur Laut — papan dayung overstock baru dari 5 unit, model campuran, dikirim dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: SUP Papan kelebihan stok untuk pengecer pantai Brasil dan sekolah dayung
direct_answer: Paddle Board Overstock menyediakan papan tiup overstock baru SUP untuk bisnis Brasil — sekolah dayung dan toko di Rio de Janeiro, Florianópolis, serta pantai timur laut, operator penyewaan, dan penjual online. Pesanan grosir dimulai dari 5 papan dengan model campuran dalam satu pengiriman, dikirim dari Weihai, China melalui angkutan ekspres udara atau pengiriman laut konsolidasi. Setiap papan telah diuji tekanan 100% dan tercakup oleh SUP Garansi 2 Tahun.
tldr_points:
  - Grosir dari 5 papan — model campuran, dihargai berdasarkan jumlah total
  - Melayani budaya pantai Brasil dari Rio hingga Timur Laut
  - Pengiriman udara ekspres atau pengiriman laut konsolidasi dari Weihai, Tiongkok
  - 100% teruji tekanan, SUP Garansi 2 Tahun untuk setiap papan
overview_section:
  tagline: Ikhtisar Pasar
  title: SUP Pasar Brasil
  paragraphs:
    - Brasil adalah salah satu pasar stand-up paddle paling alami di dunia. Budaya pantai adalah budaya nasional — mulai dari adegan Stand Up Paddle di laguna Rio dan campuran ombak dan air datar di Florianópolis hingga perairan hangat dan tenang di Timur Laut di Ceará, Pernambuco, dan Bahia. Sekolah dayung, penyewaan laguna, serta komunitas downwind dan SUP surfing semuanya berasal dari populasi besar yang gila olahraga.
    - Pembeli Brasil biasanya adalah bisnis yang dijalankan sendiri — stan sewa di tepi laguna, sekolah pantai, toko selancar yang menambah SUP antrean, dan semakin banyak penjual e-commerce domestik. Mereka memesan dalam jumlah kecil (5–20 papan), dan mereka peduli pada daya tahan untuk penggunaan sehari-hari serta daya saing harga di pasar dengan biaya impor yang berarti.
  customer_types:
    - title: Sekolah Lagoon & Beach
      description: Sekolah dan operator penyewaan di laguna Rio serta pantai air tenang di Timur Laut menyediakan pelajaran dan penyewaan per jam.
    - title: Toko Selancar
      description: Pengecer selancar mapan menambahkan air tenang dan tur SUP untuk komunitas dayung lokal.
    - title: Penjual Online
      description: Penjual e-commerce domestik mengimpor SUP stok untuk melayani pasar internal Brasil yang sangat besar.
shipping_section:
  title: Kapal ke Brasil
  paragraphs:
    - Pesanan dikirim dari Weihai, Tiongkok. Pengiriman udara ekspres membawa sampel dan 1–3 pesanan papan ke bandara-bandara utama Brasil; Pengiriman laut terkonsolidasi melayani 5–20 pesanan grosir papan melalui pelabuhan seperti Santos dan gerbang pesisir lainnya. Perkiraan transit untuk tujuan Anda sudah termasuk dalam penawaran Anda.
    - Kami menyediakan faktur komersial dan daftar pengemasan yang diperlukan untuk pembersihan, dengan kode HS yang benar dan nilai yang dideklarasikan. Bea masuk dan pajak harus dibayar oleh importir sesuai aturan Brasil.
  customs_note: Pajak impor Brasil atas barang olahraga sangat signifikan dan bervariasi menurut klasifikasi produk. Konfirmasi bea masuk, PPN, dan biaya tingkat negara bagian dengan broker bea cukai Anda (despachante) sebelum memesan — kami menyediakan dokumen lengkap tetapi tidak menggabungkan pajak impor ke dalam penawaran ongko.
faq_section:
  title: FAQ Brasil
  items:
    - q: Apakah penawaran dan dukungan dapat ditangani dalam bahasa Portugis?
      a: Ya — kami bekerja dengan pembeli berbahasa Portugis. Tanyakan dalam pertanyaan Anda dan kami akan menangani penawaran dan pesanan Anda dalam bahasa Portugis.
    - q: Apakah pajak impor Brasil sudah termasuk dalam harga Anda?
      a: Tidak. Bea impor, PPN, dan pajak tingkat negara bagian menjadi tanggung jawab importir berdasarkan aturan Brasil. Kami mengutip harga papan dan pengiriman dengan jelas dan terpisah, serta menyediakan dokumen yang dibutuhkan despachante Anda.
    - q: Seperti apa pesanan pertama untuk sekolah pantai Brasil?
      a: 'Biasanya 5–15 papan: model serbaguna yang tahan lama untuk pelajaran dan sewaan per jam, ditambah beberapa edisi premium untuk pajangan ritel. Model campuran dalam satu pengiriman, harga berdasarkan total jumlah.'
    - q: Apakah Anda mengirim melalui laut ke Brasil?
      a: Ya — pengiriman laut konsolidasi melayani pelabuhan Brasil untuk pesanan grosir 5–20 papan, harga dikutip per tujuan. Pengiriman udara ekspres tersedia untuk sampel dan pesanan kecil yang mendesak.
