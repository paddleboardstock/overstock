content_challenge:
  tagline: Tantangan
  title: Kebutuhan Energi Lepas Pantai<br />Keandalan Lingkungan Ekstrem
  subtitle: Operasi energi lepas pantai mendorong peralatan hingga batas maksimal — cuaca ekstrem, lokasi terpencil, siklus tugas terus-menerus, dan toleransi nol terhadap kegagalan.
  paragraphs:
    - Industri energi lepas pantai beroperasi di lingkungan laut yang paling menuntut di dunia. Kapal kerja mendukung platform minyak dan gas, instalasi turbin angin, operasi kabel bawah laut, dan proyek konstruksi laut — sering kali dalam kondisi laut terbuka dengan jendela cuaca yang terbatas. Kegagalan peralatan tidak hanya mahal, tetapi juga berbahaya.
    - '**Keselamatan adalah prioritas tertinggi** — Kapal transfer kru harus beroperasi dengan aman di kondisi laut yang dapat menghentikan operasi lain. Stabilitas di titik transfer, performa mesin yang andal dalam segala cuaca, dan konstruksi yang kokoh untuk docking berulang di atas struktur lepas pantai adalah persyaratan wajib.'
    - '**Kemampuan segala cuaca sangat penting** — Ladang angin lepas pantai dan platform minyak beroperasi sepanjang tahun. Kapal kerja harus mampu menghadapi gelombang besar, angin kencang, dan jarak pandang terbatas. Operasi siang dan malam menuntut suite navigasi lengkap dan sistem pencahayaan yang andal.'
    - '**Sektor angin lepas pantai tumbuh pesat** — Ribuan turbin baru sedang dipasang secara global, masing-masing membutuhkan transfer kru secara rutin, transportasi peralatan, dan dukungan pemeliharaan. Hal ini menciptakan permintaan berkelanjutan untuk kapal transfer kru (CTV) dan dukungan yang dibangun khususRIBs.'
    - Aquafarer energi lepas pantai RIBs dirancang dengan lambung deep-V yang diperkuat, Hypalon tabung tugas berat, suite navigasi lengkap, dan sistem keselamatan yang dirancang untuk kondisi ekstrem operasi energi lepas pantai.
content_solution:
  tagline: Solusi Kami
  title: Lepas pantai RIBsyang dibangun khusus<br />Untuk Industri Energi
  subtitle: Setiap Aquafarer energi lepas pantai RIB dirancang untuk operasi yang aman dan andal dalam kondisi laut ekstrem — dari Laut Utara hingga Asia Tenggara.
  list:
    - Lambung deep-V yang diperkuat untuk performa di air bergelombang dan penanganan yang dapat diprediksi
    - Hypalon Tabung tugas berat UV dengan ketahanan kimia untuk layanan lepas pantai yang diperpanjang
    - Perangkat keras baja tahan karat 316 — tidak ada korosi saat paparan air asin terus-menerus
    - 'Paket navigasi lengkap: GPS, radar, VHF, lampu navigasi malam — standar pada model lepas pantai'
    - Dek self-bailing untuk operasi aman dalam kondisi boarding laut
    - Beberapa konfigurasi mesin — outboard tunggal atau ganda untuk redundansi misi
    - Tiang tarik dan cleat berat untuk penanganan platform dan buoy
    - Warna tabung yang mudah terlihat untuk identifikasi di lokasi kerja lepas pantai
content_segments:
  tagline: Profil Energi
  title: Solusi Energi Lepas Pantai<br />Berdasarkan Jenis Aplikasi
  subtitle: Berbagai sektor energi lepas pantai memiliki kebutuhan kapal kerja yang unik — dari dukungan platform RIBs hingga CTV ladang angin hingga kapal inspeksi bawah laut.
  items:
    - title: Dukungan Platform Minyak & Gas Lepas Pantai
      subtitle: Transfer kru, pasokan peralatan, kesiapsiagaan keselamatan platform
      description: Platform minyak dan gas membutuhkan pergantian kru harian, transportasi peralatan dan pasokan, serta kesiapsiagaan keselamatan. Kapal kerja harus beroperasi dengan aman di sekitar struktur platform, dalam arus kuat dan kondisi laut yang berubah-ubah, serta mempertahankan posisi dengan tepat selama transfer personel melalui tangga atau jembatan gangway. Lingkungan yang ekstrem — hidrokarbon, bahan kimia, semprotan garam terus-menerus — menuntut konstruksi tahan korosi dan kinerja yang andal.
      features:
        - Konfigurasi transfer kru dengan akses naik yang aman dan pegangan
        - Tabung Hypalon tahan korosi dan perangkat keras stainless steel 316
        - Strake penguat untuk kontak sering dengan fender platform
        - Dek self-bailing untuk pembersihan air berminyak dan kimia
        - Tangki bahan bakar kapasitas tinggi untuk jangkauan operasi lepas pantai yang diperpanjang
        - Opsi mesin kembar untuk redundansi misi kritis
    - title: Operasi Ladang Angin Lepas Pantai
      subtitle: Transfer kru, pemeliharaan turbin, transportasi peralatan
      description: Energi angin lepas pantai adalah sektor pertumbuhan tercepat dalam energi laut. Operator membutuhkan kapal transfer kru (CTV) yang dapat mentransfer teknisi ke platform akses turbin dengan aman dalam kondisi laut hingga tinggi gelombang signifikan 1,5 m. Stabilitas selama transfer, kemampuan beroperasi dalam segala cuaca, dan operasi harian yang andal sangat penting. Kapal layanan ladang angin beroperasi sesuai jadwal ketat — setiap downtime menunda pengoperasian atau pemeliharaan turbin, yang langsung mempengaruhi pendapatan produksi energi.
      features:
        - Bentuk lambung yang dioptimalkan untuk transfer kru yang stabil di dasar turbin
        - Masuk Deep-V untuk kenyamanan perjalanan di ombak dan gelombang lepas pantai
        - Perlindungan cuaca penuh — konsol tertutup atau wheelhouse untuk kenyamanan kru
        - Ruang dek untuk peralatan, suku cadang, dan peralatan layanan
        - Paket operasi malam untuk shift musim dingin dengan cahaya terbatas
        - Operasi outboard yang tenang untuk dampak kebisingan minimal pada lingkungan laut
    - title: Dukungan Kabel & Pipa Bawah Laut
      subtitle: Inspeksi, pemeliharaan, dukungan ROV, survei
      description: Operator kabel dan pipa bawah laut membutuhkan kapal kerja untuk inspeksi rute, dukungan pemeliharaan, operasi ROV, dan tugas survei. Kapal-kapal ini memerlukan platform stabil untuk menurunkan dan mengangkat peralatan bawah air, manuver lambat yang presisi untuk pelacakan kabel, dan operasi andal di lingkungan pesisir dan lepas pantai. Stabilitas kapal sangat penting untuk akurasi peralatan sonar dan survei.
      features:
        - Platform stabil pada kecepatan lambat untuk pelacakan kabel dan operasi survei
        - Tata letak dek terbuka untuk penurunan ROV, gulungan kabel, dan peralatan survei
        - Pelat pemasangan peralatan untuk sonar, GPS, dan instrumen survei
        - Desain lambung dengan gelombang rendah untuk meminimalkan gangguan dasar laut selama inspeksi
        - Manuver kecepatan rendah dengan presisi menggunakan kemudi luar yang responsif
    - title: Rekayasa Kelautan & Dukungan Konstruksi
      subtitle: Transportasi personel, pasokan material, dukungan menyelam
      description: Kontraktor teknik kelautan yang bekerja pada pembangunan pelabuhan, perlindungan pantai, dan proyek pemasangan lepas pantai membutuhkan kapal kerja serbaguna untuk transportasi personel antara kapal konstruksi dan darat, pasokan material dan alat, dukungan menyelam, dan survei lokasi. Kapal-kapal ini beroperasi di zona konstruksi aktif dengan banyak kapal, ruang manuver terbatas, dan kondisi laut yang bervariasi. Ketahanan dan keserbagunaan sangat penting.
      features:
        - Tata letak dek serbaguna untuk personel, material, dan peralatan selam
        - Tangga selam dan pemasangan peralatan untuk operasi dukungan menyelam
        - Paku berat dan tiang derek untuk manuver di lokasi konstruksi
        - Konstruksi Hypalon yang tangguh untuk puing konstruksi dan ketahanan terhadap abrasi
        - Konfigurasi tempat duduk yang fleksibel — mode transportasi kru atau kargo
