hero:
  tagline: Timur Tengah
  title: Papan Grosir SUP untuk<br />Pengecer Timur Tengah
  subtitle: Peritel Teluk, klub pantai hotel, dan operator Laut Merah — papan dayung overstock baru dari 5 unit, model campuran, dikirim dari China.
  image:
    src: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-sup-allround-board.webp
    alt: Papan kelebihan stok SUP untuk peritel Timur Tengah dan klub pantai
direct_answer: menyediakan Paddle Board Overstock papan tiup overstock baru SUP untuk bisnis di seluruh Timur Tengah — pengecer dan operator hotel di UAE, Arab Saudi, Qatar, Mesir, dan sekitarnya. Pesanan grosir dimulai dari 5 papan dengan model campuran dalam satu pengiriman, dikirim dari Weihai, China melalui angkutan udara ekspres atau pengiriman laut konsolidasi. Setiap papan telah diuji tekanan 100% dan tercakup oleh SUP Garansi 2 Tahun.
tldr_points:
  - Grosir dari 5 papan — model campuran, dihargai berdasarkan jumlah total
  - Melayani pusat ritel Teluk dan destinasi resor Laut Merah
  - Pengiriman udara ekspres atau pengiriman laut konsolidasi dari Weihai, Tiongkok
  - 100% teruji tekanan, SUP Garansi 2 Tahun untuk setiap papan
overview_section:
  tagline: Ikhtisar Pasar
  title: Pasar Timur Tengah SUP
  paragraphs:
    - The Middle East has built some of the world's most impressive waterfronts — Dubai's beach clubs, Abu Dhabi's mangrove tours, the Red Sea projects transforming Saudi Arabia's west coast, and the established resort scenes of Egypt's Sinai and Hurghada. Across them, stand-up paddle has become a signature activity: mudah diakses, fotogenik, dan cocok untuk air hangat yang tenang hampir sepanjang tahun.
    - Pembeli di sini profesional dan peduli kualitas. Klub pantai hotel rutin memperbarui armada, operator olahraga air membutuhkan papan yang terlihat premium di foto, dan peritel di wilayah ini melayani pendayung ekspatriat serta komunitas lokal yang berkembang pesat. Mereka memesan dalam batch kecil yang sengaja dan mengharapkan dokumentasi yang tepat serta pengiriman tepat waktu.
  customer_types:
    - title: Hotel Klub & Resor Pantai
      description: Operator hotel Teluk SUP menjalankan program tamu, memesan armada campuran kecil dengan edisi seni premium untuk tampilan tepi laut.
    - title: Operator Olahraga Air
      description: Operator tur bakau dan laguna, pusat selaman, serta stan penyewaan pantai di sepanjang pantai Teluk dan Laut Merah.
    - title: Pengecer
      description: Toko dan penjual online yang melayani komunitas ekspatriat dan lokal yang mendayung di UAE, Arab Saudi, Qatar, dan Kuwait.
shipping_section:
  title: Kapal ke Timur Tengah
  paragraphs:
    - Pesanan dikirim dari Weihai, Tiongkok. Angkutan udara ekspres memindahkan sampel dan 1–3 pesanan papan dengan cepat ke pusat-pusat utama di wilayah tersebut; Pengiriman laut konsolidasi melayani 5–20 pesanan grosir papan melalui pelabuhan Teluk dan Laut Merah. Perkiraan transit untuk tujuan Anda disertakan dalam setiap penawaran.
    - Kami menyediakan faktur komersial dan daftar pengepakan yang diperlukan untuk izin pembersihan, dengan nilai deklarasi yang konsisten dan kode HS yang benar — disiplin dokumen yang diharapkan oleh proses bea cukai Teluk.
  customs_note: Prosedur impor di wilayah ini umumnya efisien namun sensitif terhadap dokumen. Konfirmasi perlakuan bea dan pajak saat ini untuk peralatan olahraga di emirat atau negara Anda dengan agen kliring Anda; kami menyediakan semua dokumen standar dengan cepat.
faq_section:
  title: FAQ Timur Tengah
  items:
    - q: Tujuan Timur Tengah mana yang Anda kirim?
      a: UAE, Arab Saudi, Qatar, Kuwait, Bahrain, Oman, Mesir, dan lainnya — lihat panduan khusus UEA kami untuk pasar ritel terbesar di Teluk. Konfirmasikan tujuan Anda dalam permintaan penawaran Anda.
    - q: Apakah papan tersebut mampu menangani panas musim panas di wilayah tersebut?
      a: 'Papan ini tahan panas dengan baik dengan perawatan dasar: simpan dalam keadaan kempes dan teduh selama puncak musim panas, hindari meninggalkan papan yang mengembang di permukaan panas, dan bilas setelah digunakan di air laut. Ini adalah pedoman yang sama yang kami berikan pada armada sewa di 50+ negara.'
    - q: Bisakah kami memesan edisi seni premium untuk hotel di tepi laut?
      a: Ya — edisi seni seperti Leviathan Wake, Medusa Glow, dan Ocean Voyager populer di klub pantai hotel tepat karena terlihat bagus saat difoto. Campurkan dengan papan tamu serba guna dalam satu pesanan.
    - q: Apakah dokumentasi tersedia untuk bea cukai Teluk?
      a: Ya. Setiap pesanan dikirim dengan faktur komersial dan daftar kemasan dengan kode HS dan nilai yang benar, dan kami merespons dengan cepat ketika pialang meminta dokumentasi tambahan.
