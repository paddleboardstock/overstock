faq:
  title: OEM/ODM — Pertanyaan yang Sering Diajukan
  questions:
    - q: Apa jumlah pesanan minimum (MOQ) untuk SUPs inflatable custom?
      a: Untuk model standar dengan cetakan yang sudah ada, MOQ dimulai dari 5–10 unit per desain. Untuk cetakan dan peralatan sepenuhnya khusus, MOQ biasanya 200+ unit. Kami bekerja dengan startup dan merek baru untuk menemukan titik masuk yang layak.
    - q: Berapa MOQ untuk perahu RIB kustom?
      a: Model RIB dimulai dari 2–5 unit per desain dengan cetakan yang ada, sementara cetakan RIB sepenuhnya khusus membutuhkan komitmen yang lebih besar. Kami bekerja dengan startup dan merek yang sudah mapan untuk menemukan titik masuk yang layak.
    - q: Berapa lama proses sampel OEM berlangsung?
      a: Sampel prototipe standar selesai dalam 7–14 hari kerja setelah persetujuan desain. Pesanan mendesak dapat diprioritaskan menjadi 5–7 hari dengan biaya tambahan.
    - q: Apa perbedaan antara PVC dan Hypalon untuk perahu tiup?
      a: PVC lebih ringan, lebih terjangkau, dan menawarkan fleksibilitas yang sangat baik di cuaca dingin. Hypalon (CSM) memberikan UV dan ketahanan ozon yang unggul dengan umur pakai lebih panjang (10–15 tahun vs 5–8 tahun). Kami merekomendasikan PVC untuk sebagian besar aplikasi rekreasi dan Hypalon untuk penggunaan komersial/profesional.
    - q: Apakah bentuk dan desain perahu tiup dapat dikustomisasi?
      a: Ya. Tim R&D kami dapat mengembangkan cetakan khusus untuk bentuk lambung, garis papan, atau konfigurasi tabung apa pun. Kami menggunakan cetakan aluminium CNC-mesin untuk presisi dan konsistensi.
    - q: Apakah Anda menyediakan layanan audit pabrik?
      a: Kami menyambut audit pabrik di lokasi dan oleh pihak ketiga di fasilitas Qingdao seluas 12.000 m². Kami mempertahankan sertifikasi ISO 9001 dan BSCI dan dapat membagikan laporan audit atas NDA.
    - q: Syarat pengiriman apa yang Anda tawarkan?
      a: Kami menawarkan syarat pengiriman FOB Qingdao (standar), CIF, dan DDP. Pengisian kontainer dan dokumentasi ekspor lengkap termasuk dalam semua pesanan OEM.
content_profiles:
  tagline: Profil Merek
  title: OEM / Manufaktur Label Pribadi<br />Berdasarkan Tipe Pelanggan
  subtitle: Profil merek yang berbeda memiliki persyaratan berbeda — kami menyesuaikan layanan OEM/ODM kami untuk mencocokkan model bisnis, skala, dan strategi go-to-market Anda.
  items:
    - title: Merek Perahu Startup
      subtitle: MOQ rendah, peningkatan cepat
      description: Pengusaha dan pendiri yang meluncurkan lini pertama perahu RIB, SUPs, atau perahu tiup. Anda membutuhkan mitra manufaktur yang memperlakukan merek Anda seperti milik mereka sendiri — dengan ambang masuk rendah, ukuran batch fleksibel, dan panduan desain langsung di setiap tahap.
      features:
        - MOQ serendah 2–5 unit (RIB) / 5–10 unit (SUP) per SKU
        - Perpustakaan cetakan yang sudah ada untuk menghindari biaya peralatan
        - 'Paket merek lengkap: logo, grafik tabung, kemasan, gantungan label'
        - Alur kerja berfokus pada sampel — disetujui sebelum produksi
    - title: Merek Laut yang Sudah Mapan
      subtitle: Skala OEM dengan kepatuhan CE/ISO
      description: Merek perahu, PWC, atau aksesori laut yang sudah ada menambahkan perahu tiup ke portofolio mereka. Anda membutuhkan kualitas konsisten di semua produksi, kepatuhan regulasi untuk pasar global, dan kemampuan untuk bersama-sama merancang lambung atau bentuk tabung khusus.
      features:
        - Rekayasa cetakan 3D khusus untuk desain proprietari
        - Dokumentasi kepatuhan CE 2013/53/EU, UKCA, USCG
        - Laporan audit sosial BSCI untuk kepatuhan pengecer
        - Manajemen akun khusus + slot produksi prioritas
    - title: Merek DTC & E-Commerce
      subtitle: Pengemasan siap ritel dalam skala besar
      description: Merek online-first yang menjual melalui Amazon, Shopify, atau toko web mereka sendiri. Pengemasan, pengalaman unboxing, dan kualitas unit yang konsisten sangat penting. Anda membutuhkan pabrik yang memahami dinamika kecepatan dan tingkat pengembalian e-commerce.
      features:
        - Desain kotak siap ritel + percetakan kartu insert
        - Kemasan vakum / paletisasi untuk pengiriman yang hemat biaya
        - EAN / UPC kode batang dan dokumentasi siap bea cukai
        - Konsolidasi kontainer campuran untuk mengoptimalkan biaya total
    - title: Operator Rental & Perhotelan
      subtitle: Konstruksi setara armada untuk resor dan bisnis rental
      description: Resor, pusat olahraga air, dan operator rental membutuhkan armada yang tahan lama, dapat diservis, dengan branding yang konsisten. Kami menyediakan harga armada, kontainer model campuran, dan dukungan suku cadang pengganti untuk bertahun-tahun operasional.
      features:
        - Harga armada untuk pesanan kontainer model campuran
        - Opsi tabung dan dek komersial yang tahan lama
        - Kit suku cadang dan pelatihan pemeliharaan
        - Branding konsisten di seluruh SUP, RIB, dan armada kayak
