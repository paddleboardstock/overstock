process_steps:
  title: Proses 6-Langkah OEM/ODM
  subtitle: Dari brief desain hingga FOB Qingdao — alur kerja yang efisien
  steps:
    - number: '01'
      title: Brief Desain & Pemodelan 3D CAD
      description: Bagikan spesifikasi target, produk referensi, atau konsep Anda. Tim engineering kami mengembangkan gambar CAD detail dan rendering 3D untuk persetujuan Anda.
      timeline: 3–5 hari
    - number: '02'
      title: Pemilihan Material & Pengujian Kain
      description: Pilih dari PVC kelas militer (0,9–1,2 mm), Hypalon CSM, atau drop-stitch kain inti. Kami melakukan pengujian kekuatan tarik, adhesi pelapis, dan stabilitas UV.
      timeline: 2–3 hari
    - number: '03'
      title: Prototyping Cepat & Produksi Sampel
      description: Kami CNC-mesin cetakan khusus dan memproduksi sampel pra-produksi dengan warna merek, logo, dan material yang ditentukan. Sampel dikirim untuk persetujuan Anda.
      timeline: 7–14 hari
    - number: '04'
      title: Tes Tahan Tekanan Tinggi 24–48 Jam
      description: Setiap prototipe menjalani pengujian retensi tekanan yang ketat pada 1,25x tekanan terukur. Tes pengelupasan sambungan dan verifikasi dimensi dilakukan.
      timeline: 1–2 hari
    - number: '05'
      title: CE/ISO Inspeksi Kualitas & Pengemasan
      description: Checklist kualitas 100 poin. Setiap unit diperiksa sebelum dikemas untuk siap dijual. CE deklarasi kesesuaian dan BSCI laporan kepatuhan termasuk.
      timeline: 2–3 hari
    - number: '06'
      title: FOB Pengiriman & Logistik Qingdao
      description: Barang jadi dipallet, dibungkus shrink, dan dimuat ke kontainer di pelabuhan Qingdao. Dokumentasi ekspor lengkap, bea cukai, dan pelacakan real-time.
      timeline: 7–14 hari
