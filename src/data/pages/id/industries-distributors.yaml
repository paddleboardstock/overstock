content_segments:
  tagline: Profil Mitra
  title: Model Kemitraan Distribusi<br />Berdasarkan Jenis Mitra
  subtitle: Berbagai distributor memiliki keunggulan go-to-market yang berbeda — infrastruktur regional, jangkauan e-commerce, ritel spesialis, atau portofolio multi-merek. Kami menyusun syarat kemitraan, tingkatan harga, dan tingkat dukungan untuk menyesuaikan dengan setiap profil mitra.
  items:
    - title: Distributor Marine Regional
      subtitle: Distribusi eksklusif wilayah B2B
      description: Distributor yang sudah mapan dengan infrastruktur gudang, jaringan dealer, dan kemampuan logistik yang melayani dealer marine, retailer olahraga air, dan operator rental dalam wilayah geografis tertentu. Anda memerlukan lini produk lengkap, harga yang dilindungi, dan kemampuan untuk melayani akun dealer dengan stok dan dukungan lokal.
      features:
        - Perlindungan wilayah eksklusif dengan syarat komitmen minimum
        - Harga grosir katalog lengkap dengan rebate volume triwulanan
        - Program konsinyasi stok lokal untuk SKU yang cepat laku
        - Pelatihan jaringan dealer dan program pemasaran dengan merek bersama
    - title: E-Commerce & Pengecer Online
      subtitle: Saluran distribusi digital-first
      description: Pengecer online yang menjual peralatan olahraga air melalui Amazon, eBay, atau platform e-commerce mereka sendiri. Kecepatan ke pasar, harga kompetitif, dan logistik langsung ke konsumen sangat penting. Anda membutuhkan mitra yang dapat mengirimkan pesanan individu dengan merek Anda dengan pemenuhan cepat dan risiko inventaris nol.
      features:
        - 'Program drop-ship: pemenuhan langsung dari pabrik dengan merek Anda'
        - Feed API inventaris real-time untuk platform e-commerce Anda
        - Integrasi Amazon Seller Central dengan dukungan EAN/UPC
        - Termasuk logistik pengembalian dan pemrosesan klaim garansi
    - title: Pengecer Khusus Olahraga Air
      subtitle: Mitra showroom fisik
      description: Toko ritel fisik yang mengkhususkan diri dalam peralatan olahraga air — melayani pendayung, pemancing, dan penggiat kapal lokal dengan penjualan langsung, demonstrasi, dan layanan purna jual. Anda membutuhkan kemasan yang dioptimalkan untuk ritel, program unit demo, dan materi titik penjualan yang mengubah pengunjung menjadi pembeli.
      features:
        - 'Program unit demo: papan pajangan showroom dengan diskon'
        - Kemasan siap ritel dengan desain kotak yang dioptimalkan untuk rak
        - Tampilan titik penjualan, bagan perbandingan, dan panduan pembeli
        - Program pelatihan dan sertifikasi staf di dalam toko
    - title: Distributor Multi-Merek & Department Store
      subtitle: Distribusi barang olahraga lini luas
      description: Distributor skala besar yang melayani department store, pengecer besar, dan jaringan barang olahraga dengan katalog multi-merek. Konsistensi, dokumentasi kepatuhan, dan kepatuhan vendor sangat penting — setiap SKU harus memenuhi standar kemasan, pelabelan, dan kualitas khusus pengecer.
      features:
        - 'Dokumentasi kepatuhan pengecer: spesifikasi kemasan, kode batang, pelabelan'
        - Integrasi EDI/ASN untuk sistem pemesanan pengecer besar
        - Inventaris yang dikelola vendor dan program pengisian otomatis
        - Manajemen akun khusus dengan SLA respons 24 jam
