features3_lab:
  title: 'In-House Testing & Quality Lab'
  subtitle: 'Every material batch and finished product goes through our on-site testing laboratory before it ships.'
  columns: 3
  isBeforeContent: true
  items:
    - title: 'Tensile Strength Testing'
      description: 'Every PVC fabric roll is tested per ASTM D751 standards. Minimum requirement: 350 N/cm warp and weft. Rejected batches are returned to supplier — we reject approximately 3% of incoming materials.'
      icon: 'tabler:scale'
    - title: 'UV Accelerated Aging'
      description: 'Fabric samples undergo 1,000-hour QUV accelerated weathering (ASTM G154). Retention of tensile strength must exceed 80% after UV exposure. Products rated for 3+ years of outdoor use.'
      icon: 'tabler:sun'
    - title: 'Seam Peel Strength'
      description: 'RF welded seams tested at 5 N/mm minimum peel strength (ASTM D751). Hand-glued Hypalon seams tested at 3.5 N/mm. Each production batch has seam samples destructively tested and archived.'
      icon: 'tabler:stack'
    - title: '24–48 Hour Pressure Hold'
      description: 'Every inflatable product inflated to 1.25x rated PSI and monitored for 24–48 hours. Maximum allowable pressure drop: 5%. Products failing this test are reworked and retested before shipment.'
      icon: 'tabler:wind'
    - title: 'Valve Cycle Testing'
      description: 'Every valve design undergoes 10,000 open-close cycles in our lab. Valves must maintain airtight seal at 1.25x rated pressure after cycling. All Aquafarer valves rated for 5+ years of regular use.'
      icon: 'tabler:rotate'
    - title: 'Cold Crack Resistance'
      description: 'Materials tested at -30°C for 4 hours per ISO 4646. No cracking or embrittlement allowed. Products rated for winter storage and cold-water use down to -10°C ambient temperature.'
      icon: 'tabler:snowflake'

steps2_manufacturing:
  title: 'How we ensure quality'
  subtitle: 'From raw material inspection to final pressure testing — every product goes through a rigorous quality chain.'
  items:
    - title: 'Raw Material Inspection'
      description: 'Every roll of PVC fabric is tested for thickness, tensile strength, and UV resistance before entering production.'
      icon: 'tabler:search'
    - title: 'In-Process QC'
      description: 'Weld seams, valve installations, and chamber bonds are inspected at each station during assembly.'
      icon: 'tabler:eye'
    - title: 'Pressure Testing'
      description: 'Every inflatable product is inflated to 1.25x rated PSI and held for 24–48 hours to verify air retention and seam integrity.'
      icon: 'tabler:wind'
    - title: 'Final Inspection'
      description: 'Each unit is inspected for finish, hardware, and packaging before being approved for shipment. Batch samples go to our lab for destructive testing.'
      icon: 'tabler:clipboard-check'

faqs_rib:
  title: 'RIB Boat FAQs'
  subtitle: 'Common questions about our rigid-hull inflatable boats.'
  columns: 2
  items:
    - title: 'What sizes of RIB boats does Aquafarer offer?'
      description: 'We offer 35 RIB models ranging from 2.5 m to 7.6 m, covering everything from compact tenders to heavy-duty commercial and patrol craft. Each model is available with multiple configuration options.'
    - title: 'What is the difference between a RIB and a traditional inflatable boat?'
      description: 'A RIB (Rigid-Hull Inflatable Boat) combines a solid fiberglass or aluminum deep-V hull with inflatable Hypalon or PVC tubes. This gives you the stability and load capacity of a hard boat with the shock absorption and buoyancy of an inflatable.'
    - title: 'What engines are compatible with Aquafarer RIBs?'
      description: 'Our RIBs support outboard engines from 3 HP to 250 HP depending on the model. Each product page lists the maximum rated engine power. We recommend consulting your dealer for the ideal match.'
    - title: 'Are Aquafarer RIBs CE certified?'
      description: 'Yes. All recreational RIB models are CE certified under applicable European standards for recreational watercraft. Commercial and patrol models meet additional stability and load requirements.'
    - title: 'What is the warranty on RIB boats?'
      description: 'All Aquafarer RIBs come with a 5-year limited warranty on tube fabric, seams, and hull; inflation valves covered for 5 years; factory-installed accessories covered for 1 year.'
    - title: 'How many air chambers do Aquafarer RIBs have?'
      description: 'Our RIBs feature 3 to 7 independent air chambers depending on the model length. This multi-chamber design ensures the boat remains afloat even if one compartment is compromised.'

faqs_inflatable:
  title: 'Inflatable Boat FAQs'
  subtitle: 'Common questions about our inflatable dinghies, kayaks, and boats.'
  columns: 2
  items:
    - title: 'What materials are used in Aquafarer inflatable boats?'
      description: 'We use military-grade PVC (1100 denier) and premium Hypalon/CSM rubber, depending on the model. Both materials are UV-stabilized, abrasion-resistant, and compliant with EU REACH and RoHS regulations.'
    - title: 'How long do inflatable boats last?'
      description: 'With proper care, a quality PVC inflatable boat lasts 7–10 years, while Hypalon models can last 15–20 years. Regular cleaning, UV protection, and proper storage significantly extend service life.'
    - title: 'What maintenance is required for an inflatable boat?'
      description: 'Basic maintenance includes rinsing with fresh water after each use (especially in saltwater), drying before storage, checking valve seals annually, and applying UV protectant to tubes. Avoid prolonged sun exposure when not in use.'
    - title: 'Can inflatable boats be used in saltwater?'
      description: 'Yes. All Aquafarer inflatable boats are designed for both freshwater and saltwater use. We recommend rinsing with fresh water and drying thoroughly after saltwater exposure to prevent fitting corrosion and fabric salt crystallization.'
    - title: 'How do I store an inflatable boat?'
      description: 'Deflate, clean, and dry the boat completely before storage. Roll loosely (avoid tight folds), store in a cool dry place away from direct sunlight, and keep off concrete floors to prevent moisture wicking.'
    - title: 'What is the weight capacity of Aquafarer inflatable boats?'
      description: 'Weight capacities range from 290 kg for our smallest models to over 2000 kg for larger commercial craft. Each product page lists the maximum load rating for your specific model.'

faqs_sup:
  title: 'SUP Board FAQs'
  subtitle: 'Common questions about our stand-up paddle boards.'
  columns: 2
  items:
    - title: 'What SUP board sizes are available?'
      description: 'We offer SUP boards from 9 ft to 12 ft, including all-round, touring, yoga, and specialty designs. Our best-selling models include the Tropical Breeze (10 ft) and Ocean Voyager (11 ft).'
    - title: 'What is drop-stitch construction?'
      description: 'Drop-stitch construction uses thousands of polyester threads connecting the top and bottom layers of the board, allowing it to hold high air pressure (15–20 PSI) and achieve a rigid, stable platform. This is the industry standard for premium inflatable SUPs.'
    - title: 'What is the weight limit for SUP boards?'
      description: 'Our SUP boards support up to 150 kg depending on the model and volume. The Leviathan Wake board is our highest-capacity model, designed for larger riders and yoga use.'
    - title: 'Do you offer complete SUP packages?'
      description: 'Yes. Every SUP board ships with a complete package including a 3-piece aluminum paddle, high-pressure hand pump, coil leash, travel backpack, and repair kit. Some models also include a removable fin set.'
    - title: 'What is the warranty on SUP boards?'
      description: 'All Aquafarer SUP boards carry a 2-year warranty against manufacturing defects, including seam failure, valve defects, and material delamination under normal use.'
    - title: 'How long does it take to inflate a SUP board?'
      description: 'Using the included hand pump, a full inflation to 15 PSI takes approximately 8–12 minutes. For faster inflation, we recommend our Aquafarer 12V electric pump, which inflates a board in under 4 minutes.'

