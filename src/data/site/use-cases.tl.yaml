cases:
  - id: beginner
    title: Mga Panimulang Water Sports
    desc: Matatag na SUP board at kayak para sa mga unang beses na gagamit.
    scenario: Isang pamilya na bumibisita sa lawa sa katapusan ng linggo ay nais subukan ang paddle boarding. Kailangan nila ng matatag, madaling ilunsad na kagamitan na may malinaw na gabay sa kaligtasan.
    solution: Ang SUP Explorer 11 ay nagbibigay ng malawak na katatagan para sa mga baguhan. Ang Life Vest Classic ay tinitiyak ang CE-certified na flotation. Ang Dual-Action Pump ay nagpapa-impaw ng parehong board sa loob ng 10 minuto.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Panglabas na Eksplorasyon
    desc: Maaaaring dalhin na kayak at dinghy para sa mga ilog, lawa, at paglalakbay sa baybayin.
    scenario: Isang mahilig sa outdoor ang nagpaplano ng isang linggong paglalakbay sa ilog at kailangan niya ng bangka na madaling i-pack, mai-impaw sa kampo, at kayang harapin ang iba't ibang agos.
    solution: Ang Kayak Lite ay nakakapack sa backpack at mai-impaw sa loob ng 4 minuto. Ang konstruksiyon nitong drop-stitch ay kayang harapin ang mga lawa, mabagal na ilog, at pag-agos sa baybayin.
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: Propesyonal na Operasyon
    desc: Commercial-grade RIBs para sa mga tour operator at emergency response.
    scenario: Isang coastal tour operator ang nangangailangan ng fleet ng matibay na bangka na nagpapatakbo ng araw-araw na biyahe sa iba't ibang kondisyon ng dagat at sumusunod sa regulasyong pangkaligtasan sa komersyo.
    solution: Ang RIB 330 at RIB 450 Patrol ay gumagamit ng fiberglass deep-V hulls na may Hypalon tube para sa tibay sa anumang panahon. Maaaring ipatupad ang maramihang yunit na may pare-parehong pagganap.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: Pang-recreational na Pamilyang Aktibidad
    desc: Maluluwang na dinghy para sa araw na pamamasyal, pangingisda, at water sports.
    scenario: Isang pamilyang may apat na miyembro ang nais ng matatag na bangka para sa weekend lake outings, pangingisda, at paghila ng tubo para sa mga bata.
    solution: Ang AirDeck 360 ay may puwang para sa lima na may pinalakas na air deck floor. Mai-impaw sa lugar ng paglulunsad, maiimbak sa sasakyan, at kayang harapin ang tahimik na lawa at protektadong tubig sa baybayin.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
