cases:
  - id: beginner
    title: Pangunahing Paddling
    desc: Matatag na inflatable SUP boards para sa mga unang beses na paddler.
    scenario: Isang pamilya na bumibisita sa lawa sa katapusan ng linggo ay nais subukan ang paddle boarding. Kailangan nila ng matatag, madaling ilunsad na kagamitan na may malinaw na gabay sa kaligtasan.
    solution: Ang SUP Explorer 11 ay nagbibigay ng malawak na katawan na katatagan para sa mga baguhan. Ang Life Vest Classic ay nagsisiguro ng CE-certified na paglutang. Ang Oars & Pump Set ay nagpapalaki sa board sa ilalim ng 10 minuto.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Touring at Paggalugad
    desc: Pangmalayuang inflatable SUP boards para sa mga lawa, ilog, at pampang na paglalakbay.
    scenario: Isang mahilig sa outdoor ang nagpaplano ng isang linggong paddling trip at kailangan ng board na maipapasok ng maliit, mauumpisahan sa camp, at diretso sa bukas na tubig.
    solution: Ang Ocean Voyager Series ay dumadulas nang mahusay gamit ang touring na hugis at nananatili sa ruta kahit na may hangin at alon. Ang konstruksiyon ng drop-stitch ay lumalaki sa 15 PSI para sa matibay na hard-board.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga at Fitness
    desc: Labas na malapad, matatag na platform para sa yoga, fitness, at pagpapahinga.
    scenario: Isang yoga practitioner ang nais ng floating studio para sa umagang sesyon sa kalmadong tubig, na may sapat na espasyo sa deck para sa bawat pose.
    solution: Ang Flowing Lotus Series ay may full-length na deck pad at malapad na beam para sa walang-aliong mga pose. Maaari rin itong gamitin bilang matatag na platform para sa magaan na fitness workout.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Pang-recreational na Pamilyang Aktibidad
    desc: Kumpletong SUP packages para sa weekend lake days at bakasyon.
    scenario: Isang pamilya na may apat na miyembro ang nais ng matatag na boards para sa weekend lake outings at beach holidays — gamit na mailalagay sa kotse at mauumpisahan sa loob ng ilang minuto.
    solution: Ang Tropical Breeze Series ay isang matatag na all-around board na pwedeng gamitin ng buong pamilya, habang ang Medusa Glow Series ay mas magaan at mas maikli para sa mga bata. Parehong maipapasok sa mga backpack para sa madaling paglalakbay.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
