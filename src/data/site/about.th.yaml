origin:
  tagline: จุดกําเนิดของเรา
  heading: |-
    สร้างอยู่บนผืนน้ํา,<br />
    <span class="text-sky-600">ขับเคลื่อนด้วยจุดมุ่งหมาย</span>
  paragraphs:
    - 'Aquafarer เริ่มต้นในเวิร์กช็อปริมชายฝั่งด้วยเรือลําเดียวและความเชื่อที่ดื้อรั้น: ผลิตภัณฑ์ทางทะเลควรถูกออกแบบให้ดูเหมือนว่ามันสําคัญ — เพราะมันสําคัญจริง ๆ'
    - ผู้ก่อตั้งของเรา ซึ่งเป็นสถาปนิกเรือสองคน มองเห็นอุตสาหกรรมที่ตัดมุม ลดคุณภาพวัสดุ และความปลอดภัยถูกมองว่าเป็นแค่ช่องทําเครื่องหมายพวกเขาสร้างAquafarerตัวเรือลําแรกไม่ใช่เพื่อผลกําไร แต่เพื่อพิสูจน์ว่าอุปกรณ์ทางทะเลที่ราคาย่อมเยาสามารถเชื่อถือได้จริง ๆ
    - ตัวเรือลําแรกยังคงใช้งานอยู่จนถึงทุกวันนี้หลักการนี้ไม่เคยเปลี่ยนแปลง
    - เราไม่ใช่ผู้ผลิตรายใหญ่ที่สุดเราไม่ได้ผลิตสินค้าที่ถูกที่สุดแต่ทุกลําเรือที่ออกจากเวิร์กช็อปของเราต้องผ่านมือเดิมที่เริ่มต้นบริษัท — และเป็นไปตามมาตรฐานเดียวกับที่เรือแรกตั้งไว้
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: Aquafarer เวิร์กช็อปชายฝั่ง
philosophy:
  tagline: ปรัชญาของเรา
  heading: ฝังรากลึกในมหาสมุทร
  description: มหาสมุทรไม่ใช่ที่ทํางานของเรามันคือครูของเราทุกการตัดสินใจออกแบบเริ่มต้นจากการเข้าใจว่าน้ํามีพฤติกรรมอย่างไร สภาพแวดล้อมเปลี่ยนแปลงอย่างไร และอุปกรณ์ต้องตอบสนองอย่างไร
  cards:
    - emoji: 🌊
      title: เคารพน้ํา
      description: น้ําไม่สามารถคาดเดาได้ผลิตภัณฑ์ของเราถูกออกแบบมาเพื่อรับมือกับสภาพที่เลวร้ายที่สุด ไม่ใช่ดีที่สุดถ้าตัวเรือสามารถรับมือกับกระแสน้ําวนได้ มันก็จะรับมือกับทะเลสาบได้ถ้าเสื้อชูชีพใช้งานได้กลางทะเล มันก็ถูกออกแบบเกินความจําเป็นสําหรับแม่น้ํา — และนั่นคือเจตนา
    - emoji: 🔧
      title: สร้างมาเพื่อความคงทน ไม่ใช่เพื่อทดแทน
      description: ผลิตภัณฑ์ที่ยั่งยืนที่สุดคือผลิตภัณฑ์ที่ไม่ต้องเปลี่ยนใหม่เกรดเรือ PVC, Hypalon, และdrop-stitchโครงสร้างถูกเลือกเพื่อความทนทานเรายังคงจัดส่งอะไหล่สําหรับตัวเรือที่เราสร้างเมื่อสิบปีก่อน
    - emoji: 🏆
      title: เข้าถึงได้ตามการออกแบบ
      description: กีฬาทางน้ําไม่ควรเป็นของฟุ่มเฟือยเราพัฒนาผลิตภัณฑ์ที่มอบประสิทธิภาพระดับมืออาชีพในราคาที่เหมาะสมกับครอบครัว ไกด์ และผู้ประกอบการขนาดเล็ก — ไม่ใช่แค่กลุ่มเรือเชิงพาณิชย์เท่านั้น
design:
  tagline: ปรัชญาการออกแบบ
  heading: |-
    ออกแบบมาเพื่อขอบ<br />
    <span class="text-sky-600">ของเงื่อนไข</span>
  paragraphs:
    - Aquafarer ทุกผลิตภัณฑ์เริ่มต้นด้วยคําถามเดียว:<em>สภาพที่แย่ที่สุดที่คนนี้จะต้องเผชิญคืออะไร?</em>เราออกแบบจากขอบเข้าด้านใน ไม่ใช่จากศูนย์กลางออกไปข้างนอก
    - 'แกนของเราdrop-stitchได้รับการจัดอันดับสําหรับ 15 — PSI ไม่ใช่เพราะ 12 ไม่PSIเพียงพอสําหรับทะเลสาบ แต่เพราะบอร์ด 15 สามารถPSIรับมือกับคลื่นกระแทกอย่างกะทันหันโดยไม่งอท่อของเราถูกHypalonออกแบบมาให้ทนทานระดับเชิงพาณิชย์ UV — ไม่ใช่เพราะลูกค้าทุกคนพายในเขตร้อน แต่เพราะการUVเสื่อมสภาพเป็นสาเหตุอันดับ #1 ของความล้มเหลวก่อนเวลา'
    - เราไม่ได้ออกแบบตามราคาที่ตั้งไว้เราออกแบบจนถึงจุดล้มเหลว — แล้วค่อยสร้างให้สูงกว่านั้นมาก
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: Aquafarer การออกแบบและวิศวกรรม
  stats:
    - value: '15'
      label: PSI แกนกลาง<br />การจัดอันดับ
    - value: 1,500+
      label: UV ชั่วโมง<br />ทดสอบแล้ว
    - value: 10yr
      label: ตัวเรือ<br />อายุการใช้งาน
