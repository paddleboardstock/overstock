business_model:
  tagline: รูปแบบธุรกิจของเรา
  heading: สินค้าคงคลังส่วนเกิน ขายโดยตรงจากโรงงาน
  paragraphs:
    - Paddle Board Overstock จําหน่ายบอร์ดเป่าลมใหม่เอี่ยมSUPในราคาสินค้าคงคลังและลดราคา — ลดสูงสุดถึง 60% จากราคาขายปลีกทั่วไปเราจัดหาสินค้าคงคลังส่วนเกินและส่วนเกินในปริมาณ จากนั้นส่งต่อการประหยัดให้กับนักพายเรือและร้านค้าปลีกขนาดเล็ก
    - 'นอกจากการขายปลีกแล้ว เรายังให้บริการผู้ค้าปลีกขนาดเล็กด้วยสินค้าขายส่งแบบผสม: สั่งซื้อบอร์ด 5–20 แผ่น, ผสมรุ่นใดก็ได้ในหนึ่งชุด และจ่ายค่าขายส่งตามจํานวนรวมทุกคําสั่งซื้อจัดส่งตรงจากเว่ยไห่ ประเทศจีน'
sourcing:
  tagline: แหล่งที่มาของสินค้าคงคลังส่วนเกินของเรา
  heading: การจัดหาแบบผสมผสาน มาตรฐานคุณภาพเดียว
  paragraphs:
    - สินค้าคงคลังของเรามาจากสองแหล่ง คือ ล็อตการผลิตส่วนเกินจากโรงงานของเราเองที่เว่ยไห่ และสินค้าคงคลังส่วนเกินที่คัดสรรมาจากพันธมิตรการผลิตรายอื่นที่เราตรวจสอบและทํางานด้วยโดยตรง
    - ทุกแผ่นที่เราขายเป็นของใหม่เอี่ยมและไม่ได้ใช้งานสินค้าคงคลังหมายถึงราคา ไม่ใช่สภาพ
manufacturing:
  tagline: พื้นฐานด้านการผลิตของเรา
  heading: สร้างที่เว่ยไห่ตั้งแต่ปี 2012
  paragraphs:
    - เราผลิตSUPแผ่นเป่าลมในเว่ยไห่ มณฑลซานตงตั้งแต่ปี 2012 โรงงานผลิตของเราขนาด 12,000 ตารางเมตรผลิตได้ถึง 15,000 ชิ้นต่อปี โดยมีทีมงาน 200–300 คน และ+วิศวกรวิจัยและพัฒนา 14 คน
    - 'หลักการออกแบบอย่างหนึ่งที่ไม่เคยเปลี่ยนไปตั้งแต่กระดานแรก: เราออกแบบจนถึงจุดที่ล้มเหลว แล้วค่อยสร้างขึ้นไปเหนือจุดนั้น'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock อาคารโรงงานในเว่ยไห่
  stats:
    - value: '2012'
      label: การผลิตตั้งแต่
    - value: 12,000 ตร.ม.
      label: โรงงานผลิต
    - value: 15,000
      label: จำนวนหน่วยต่อปี
    - value: 14+
      label: วิศวกรวิจัยและพัฒนา
inspection:
  tagline: วิธีที่เราตรวจสอบSUPทุกบอร์ด
  heading: ทุกบอร์ดผ่านการทดสอบ ไม่ได้สุ่มตัวอย่าง
  paragraphs:
    - SUP ทุกแผ่นจะผ่านการทดสอบแรงดัน 100% ที่ 1.25 เท่าของแรงดันที่กําหนดเป็นเวลา 24–48 ชั่วโมงก่อนจะได้รับอนุมัติให้จําหน่ายแผ่นที่เสียจะไม่ถูกจัดส่ง
    - 99.3% ของแผ่นไม้ผ่านการตรวจสอบขั้นสุดท้ายในครั้งแรกส่วนที่เหลือจะถูกซ่อมแซมหรือแยกไว้ — จะไม่ถูกนําไปคํานวณเป็นคําสั่งซื้อ
why_prices_lower:
  tagline: ทําไมราคาของเราถึงต่ํากว่า
  heading: เศรษฐกิจของสินค้าล้นเหลือ ไม่ใช่ตัดมุม
  paragraphs:
    - 'ราคาของเราต่ํากว่าด้วยเหตุผลด้านโครงสร้าง: เราขายสินค้าคงคลังส่วนเกินและสินค้าคงคลังส่วนเกินโดยตรงจาก Weihai โดยไม่มีการบวกราคาขายปลีก ไม่มีชั้นผู้จัดจําหน่าย และไม่มีค่าใช้จ่ายในโชว์รูม'
    - ตัวบอร์ดเองก็มีคุณภาพการผลิตเต็มรูปแบบ — แกนเหมือนกัน drop-stitch เกรดทางทะเลPVCเหมือนกัน การทดสอบเหมือนกับราคาขายปลีกเต็ม
shipping_network:
  tagline: เครือข่ายการจัดส่งระหว่างประเทศของเรา
  heading: ขนส่งทางอากาศด่วนหรือขนส่งทางทะเลแบบรวม
  paragraphs:
    - คําสั่งซื้อจัดส่งจากเว่ยไห่ ประเทศจีนการขนส่งทางอากาศด่วนรับตัวอย่างและคําสั่งซื้อจากบอร์ด 1–3 รายการ;การขนส่งทางทะเลแบบรวมให้บริการคําสั่งซื้อขายส่ง 5–20 บอร์ดไปยัง 50+ ประเทศ
    - ใบเสนอราคาทุกใบจะรวมประมาณค่าขนส่งสําหรับจุดหมายปลายทางของคุณ พร้อมใบแจ้งหนี้เชิงพาณิชย์และรายการบรรจุภัณฑ์ที่จําเป็นสําหรับการผ่านพิธีการศุลกากร
  cards:
    - title: บริการขนส่งทางอากาศด่วน
      description: สำหรับตัวอย่างและคำสั่งซื้อบอร์ด 1–3 ชิ้น — ส่งถึงบ้านอย่างรวดเร็ว คิดราคาแยกตามจุดหมาย
    - title: ค่าขนส่งทางทะเลแบบรวม
      description: สำหรับคำสั่งซื้อขนาดส่งขายส่ง 5–20 กระดาน — การจัดส่งที่คุ้มค่าไปยังท่าเรือหลัก พร้อมระบุราคาตามปลายทาง
warranty_support:
  tagline: การรับประกันและบริการลูกค้า
  heading: การรับประกัน 2 ปี สำหรับทุกบอร์ด
  paragraphs:
    - ทุกบอร์ดมาพร้อมกับการรับประกัน SUP 2 ปี หากพบข้อบกพร่องที่ครอบคลุมภายในระยะเวลาการรับประกัน โปรดติดต่อทีมสนับสนุนของเราและเราจะจัดการให้ถูกต้อง
    - การสนับสนุนจะถูกจัดการโดยทีมเดียวกับที่ดูแลคำสั่งซื้อของคุณ ติดต่อเราได้ทุกเวลาผ่านแบบฟอร์มติดต่อหรือโดยการตอบกลับอีเมลยืนยันคำสั่งซื้อของคุณ
