cases:
  - id: beginner
    title: 'Sport acquatici per principianti'
    desc: 'Tavole SUP e kayak stabili per chi è alle prime armi.'
    scenario: >-
      Una famiglia che passa il weekend al lago vuole provare il paddle
      boarding. Ha bisogno di un'attrezzatura stabile, facile da varare e
      accompagnata da chiare indicazioni di sicurezza.
    solution: >-
      La SUP Explorer 11 offre stabilità a piattaforma larga per i principianti.
      Il Life Vest Classic garantisce galleggiamento certificato CE. La pompa a
      doppia azione gonfia entrambe le tavole in meno di 10 minuti.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp

  - id: river-touring
    title: 'Esplorazione all''aperto'
    desc: 'Kayak e gommoni portatili per fiumi, laghi e uscite in costa.'
    scenario: >-
      Un appassionato di outdoor pianifica una settimana di discesa fluviale e
      ha bisogno di un'imbarcazione che si ripieghi in piccolo volume, si gonfi
      al campo e affronti correnti variabili.
    solution: >-
      Il Kayak Lite sta in uno zaino e si gonfia in meno di 4 minuti. La sua
      costruzione drop-stitch gestisce laghi, fiumi a corrente lenta e pagaiate
      costiere.
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp

  - id: professional-operations
    title: 'Operazioni professionali'
    desc: 'RIB di qualità commerciale per tour operator e interventi di emergenza.'
    scenario: >-
      Un tour operator costiero ha bisogno di una flotta di barche robuste che
      effettui uscite giornaliere in condizioni di mare variabili e rispetti le
      normative di sicurezza commerciali.
    solution: >-
      Le RIB 330 e RIB 450 Patrol utilizzano scafi in vetroresina a V profondo
      con tubolari in Hypalon per una durata in ogni condizione meteo. Più
      unità possono essere impiegate con prestazioni costanti.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp

  - id: family-recreation
    title: 'Ricreazione in famiglia'
    desc: 'Gommoni spaziosi per gite di un giorno, pesca e sport acquatici.'
    scenario: >-
      Una famiglia di quattro persone vuole una barca stabile per i weekend al
      lago, le battute di pesca e il traino di un salvagente per i bambini.
    solution: >-
      La AirDeck 360 ospita fino a cinque persone grazie al pavimento a cuscino
      d'aria rinforzato. Si gonfia sul posto, si ripone in auto e affronta sia i
      laghi tranquilli sia le acque costiere riparate.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp