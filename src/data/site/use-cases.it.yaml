cases:
  - id: beginner
    title: Canottaggio per principianti
    desc: Tavole gonfiabili stabili SUP per principianti del paddle.
    scenario: Una famiglia che visita un lago per il fine settimana vuole provare il paddleboarding. Hanno bisogno di attrezzatura stabile, facile da lanciare e con indicazioni di sicurezza chiare.
    solution: Il SUP Explorer 11 fornisce stabilità a corpo largo per principianti. Il Life Vest Classic garantisce galleggiamento certificato CE. Il Oars & Pump Set gonfia la tavola in meno di 10 minuti.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Touring e Esplorazione
    desc: Tavole gonfiabili a lunga distanza SUP per laghi, fiumi e viaggi costieri.
    scenario: Un appassionato di attività all'aperto pianifica un viaggio di una settimana in paddle e ha bisogno di una tavola che si ripieghi in piccolo, si gonfi al campeggio e scivoli dritta sull'acqua aperta.
    solution: Il Ocean Voyager Series scivola efficacemente con un profilo da touring e mantiene la rotta con vento e chop. La sua costruzione drop-stitch si gonfia fino a 15 PSI per una rigidità del hard-board.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga e Fitness
    desc: Piattaforme extra-larghe e stabili per yoga, fitness e relax.
    scenario: Un praticante di yoga desidera uno studio galleggiante per le sessioni mattutine sull'acqua calma, con abbastanza spazio sul ponte per eseguire ogni posa.
    solution: Il Flowing Lotus Series dispone di un tappetino a tutta lunghezza e di una larghezza del telaio che permette pose senza oscillazioni. Funziona anche come piattaforma stabile per esercizi di fitness leggeri.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Ricreazione familiare
    desc: Pacchetti completi SUP per giornate al lago nel fine settimana e vacanze.
    scenario: Una famiglia di quattro persone vuole tavole stabili per le gite al lago del fine settimana e le vacanze in spiaggia — attrezzatura che si può mettere in macchina e gonfiare in pochi minuti.
    solution: Il Tropical Breeze Series è una tavola stabile e versatile che tutta la famiglia può condividere, mentre il Medusa Glow Series è più leggera e corta per i bambini. Entrambe si possono riporre negli zaini per viaggiare facilmente.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
