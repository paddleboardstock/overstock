badge: Proof & Results
heading: Dokazi
description: Resni primeri, certifikati, testni podatki in fotografije uporabe, ki dokazujejo naše proizvodne zmogljivosti in kakovost izdelkov.
case_studies:
  - id: retail-private-label
    client: Evropski trgovec na prostem
    product: Linija zasebne blagovne znamke SUP
    industry: Malo trgovanje
    challenge: Evropski trgovec na prostem je potreboval linijo zasebne blagovne znamke SUP z edinstvenimi grafičnimi elementi na palubi, okolju prijaznimi PVC in embalažo, primerno za maloprodajo — vse dostavljeno v 60 dneh.
    solution: Razvili smo prilagojene digitalne tiskovne datoteke, zagotovili REACH-skladne PVC in skrajšali število vzorcev z 3 na 1 z umestitvijo oblikovalske ekipe v našo tovarno v Qingdau.
    result: 55 dni od podpisanega naročila do FOB. 2.400 enot v 4 SKU-jih. Ponovno naročilo oddano pred prihodom prvega kontejnerja.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Malo trgovanje
      - SUP
    outcome_metrics:
      - label: Dobavni rok
        value: 55 dni
      - label: Enote
        value: 2,400
      - label: SKU-ji
        value: '4'
  - id: startup-drop-stitch-kayak
    client: Ameriški startup vodnih športov
    product: Drop-Stitch Kajak
    industry: Startup / Malo trgovanje
    challenge: Ameriški startup vodnih športov je potreboval visokozmogljiv drop-stitch kajak s prilagojeno obliko trupa, soubrandirano embalažo in BSCI certifikatom za maloprodajno prodajo.
    solution: Prilagodili smo obstoječi drop-stitch kalup za kajak z modificiranim rocker profilom, razvili soubrandirane embalažne grafike in zagotovili celotno BSCI audit dokumentacijo.
    result: Uspešno uvrščeno v 3 največje ameriške verige trgovin na prostem. 5.000 + enot v prvem letu z 98 % stopnjo prodaje.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Kajak
      - BSCI
    outcome_metrics:
      - label: Maloprodajne verige
        value: '3'
      - label: Enote v prvem letu
        value: 5,000+
      - label: Prodaja
        value: 98%
  - id: australian-rib-distributor
    client: Avstralski distributer
    product: CE-certificiran RIB asortiman
    industry: Morski / Vlada
    challenge: Avstralski distributer je zahteval CE-certificiran RIB asortiman s prilagojenimi barvami cevi, Hypalon možnostjo nadgradnje in skladnostjo z avstralskim standardom AS 1799.
    solution: Pripravili smo predprodukcijske vzorce s 4 barvnimi različicami cevi, zagotovili CSM Hypalon od japonskega dobavitelja in koordinirali testiranje skladnosti s standardom AS 1799 s strani tretje osebe.
    result: 3-modelni RIB razpon lansiran na trg AU/NZ. Sledila je zmaga na vladnem razpisu za 12 patruljnih RIBs.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Vlada
    outcome_metrics:
      - label: Lansirani modeli
        value: '3'
      - label: Pogodba za patruljno plovilo
        value: 12 enot
      - label: Skladnost
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Caribbean Luxury Resort Group
    product: Flota resortov — RIBs, SUP, kajaki
    industry: Gostoljubje / Turizem
    challenge: Skupina 5 resortov je potrebovala enotno floto najemne opreme za vodne športe — RIB razpisi, SUPs in kajaki — z dosledno blagovno znamko, materiali odporni proti UV za tropsko sonce in načrtom zamenjave v 5 letih.
    solution: Oblikovan po meri 3-modelni paket flote z UV stabiliziranimi PVC, grafiko na krovu z blagovno znamko resorta in faznim urnikom dostave. Zagotovljeno usposabljanje osebja in namenski komplet rezervnih delov za vsak resort.
    result: 180 enot dobavljenih v 5 resortih. Ponovno naročilo za 2 novi nepremičnini. 40 % zmanjšanje stroškov na enoto v primerjavi s prejšnjimi dobavitelji.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kajak
      - RIB
      - Gostoljubje
    outcome_metrics:
      - label: Dobavljene enote
        value: 180
      - label: Resorti
        value: '5'
      - label: Zmanjšanje stroškov
        value: 40%
  - id: southeast-asia-search-rescue
    client: Jugo-vzhodna azijska pomorska agencija
    product: Patrolna in reševalna RIB flota
    industry: Vlada / Pomorska varnost
    challenge: Vlada pomorske agencije je potrebovala 20 patruljnih in reševalnih RIBs z ognjeodporno tkanino Hypalon, samopraznilnimi tleh, integriranimi VHF / radijskimi nosilci konzol in skladnostjo s standardi SOLAS poglavja III za reševalna plovila.
    solution: Proizvedli 20 RIBs z CSM Hypalon cevmi, aluminijastimi trupovi pomorskega razreda, visokozmogljivimi vlečnimi očesi in predhodno nameščenimi kompleti navigacijskih luči. Tovarna je pregledala poskusne vožnje. Zagotovljen celoten paket dokumentacije SOLAS.
    result: Pogodba dobavljena v 4 mesecih. Flota nameščena za patruljiranje meja, iskanje in reševanje ter odziv na naravne nesreče na 3 regionalnih bazah.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Vlada
      - SOLAS
    outcome_metrics:
      - label: Patruljno RIBs
        value: '20'
      - label: Dostava
        value: 4 mesece
      - label: Baze
        value: '3'
  - id: european-dtc-ecommerce
    client: Evropska blagovna znamka DTC vodnih športov
    product: Blagovna SUP + linija dodatkov
    industry: Spletna trgovina / Maloprodaja
    challenge: Hitra rastoča DTC blagovna znamka vodnih športov je potrebovala celoten SUP paket (deska, črpalka, veslo, varovalna vrvica, torba) s premium embalažo, zasnovano za izpolnjevanje e-trgovine — neposredno do potrošnika preko DHL/FedEx brez poškodb.
    solution: Razvit je bil skupni proizvodni program z blagovno znamko, z oblikovanjem po meri EPS jedra, lastniško drop-stitch tehnologijo za višji tlak in maloprodajno pripravljene dvojno valovite kartonske škatle z vstavkom za oblazinjenje. Integrirana je bila registracija avtentičnosti in garancije na podlagi QR kode.
    result: 3-modelna SUP linija je bila lansirana v 75 dneh. 15.000+ enot v prvih 12 mesecih. Povprečna ocena 4,8★ na 2.000+ ocen. Stopnja poškodb med prevozom 0,3 %.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-trgovina
    outcome_metrics:
      - label: Modeli
        value: '3'
      - label: Enote
        value: 15,000+
      - label: Povprečna ocena
        value: 4.8★
      - label: Stopnja poškodb
        value: 0.3%
certifications:
  - name: CE
    body: Evropska unija
    desc: Izdelki nosijo CE certifikat v skladu z veljavnimi direktivami EU — rekreacijske plovbe po EN ISO 6185, osebni plavalni pripomočki po EN ISO 12402, kjer je to primerno.
  - name: ISO 9001
    body: SGS / BSI
    desc: Sistem upravljanja kakovosti certificiran za oblikovanje, proizvodnjo in distribucijo napihljivih plovil.
  - name: BSCI
    body: amfori
    desc: Certifikat družbene skladnosti, ki dokazuje etično proizvodnjo, pošteno delo in varnost pri delu.
  - name: REACH
    body: Evropska agencija za kemikalije
    desc: Vsi materiali so skladni z REACH predpisi za kemično varnost. Dokumentacija je priložena vsaki pošiljki.
  - name: RoHS
    body: Evropska unija
    desc: Skladnost z omejitvijo nevarnih snovi pri vseh elektronskih in električnih komponentah.
  - name: AS 1799
    body: Standardi Avstralije
    desc: Avstralski standard za napihljive čolne — testirano in certificirano za komercialno uporabo v vodah AU/NZ.
