- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Surf-Etikette (So wirst du nicht zur Person, die alle meiden)
  description: >-
    Im Line-up gelten Regeln, die niemand aufschreibt. Lerne Vorfahrt, warum
    man beim Snaking angeschrien wird, wie man sich entschuldigt und welche
    Anfängerfehler jeden Localsurfer nerven.
  definition: >-
    Surf-Etikette ist ein ungeschriebener Verhaltenskodex, der Kollisionen
    verhindert und Wellen fair verteilt. Die Kernregel: Der Surfer, der dem
    Peak der brechenden Welle am nächsten ist, hat Vorfahrt.
  tldr: >-
    Der Surfer, der dem Peak der brechenden Welle am nächsten ist, hat
    Vorfahrt. Steig niemandem in die Welle (drop in), snake nicht (um jemanden
    herumpaddeln, um seine Welle zu nehmen) und entschuldige dich immer, wenn
    du einen Fehler machst. Paddle weiträumig um das Line-up herum, behalte
    dein Board unter Kontrolle und sei freundlich – Respekt wird mit Respekt
    erwidert.
  problem: >-
    Du paddelst zu einem vollen Line-up und spürst sofort die Anspannung.
    Surfer schauen dich schräg an, jemand brüllt dich an und du weißt nicht,
    was du falsch gemacht hast. Die soziale Seite des Surfens wirkt
    einschüchternder als die Wellen selbst.
  explanation: >-
    Surf-Etikette existiert, um Kollisionen zu verhindern und Wellen fair zu
    verteilen. Die grundlegende Regel ist die Vorfahrt: Der Surfer, der dem
    Peak (der Stelle, an der die Welle zuerst bricht) am nächsten ist, hat
    Vorrang. Jeder, der von weiter innen auf dieselbe Welle zupaddelt, muss
    abbrechen. Snaking – das Herumpaddeln um einen anderen Surfer, um sich den
    Vorrang zu sichern – gilt als das schwerste Vergehen. Abgesehen von der
    Vorfahrt gibt es im Line-up Erwartungen an Lärm (wenig Schreien),
    Boardkontrolle (dein Board niemals in die Nähe anderer bringen) und
    Freundlichkeit (ein einfaches Nicken wirkt Wunder).
  solution: >-
    Beobachte das Line-up 10 Minuten lang, bevor du rauspaddelst. Erkenne, wer
    die meisten Wellen erwischt – das sind die Surfer, die du respektieren und
    meiden solltest. Bleib weiter innen (in der Weißwasserzone), wenn du noch
    lernst. Paddle weiträumig um das Line-up herum, nicht hindurch. Wenn du
    eine Welle nimmst, schau vor dem Aufstehen in beide Richtungen und stelle
    sicher, dass niemand tiefer positioniert ist.
  recommendation: >-
    Verbringe deine ersten Sessions an einem anfängerfreundlichen Spot mit
    verteilten Menschenmassen. Lerne, die Vorfahrt zu lesen, bevor du dich an
    ein volles Line-up wagst. Wenn du doch jemandem in die Welle steigst,
    entschuldige dich sofort und paddle hinüber – die meisten Surfer
    respektieren einen ehrlichen Fehler.
  faq:
    - q: Was bedeutet „drop in“?
      a: >-
        „Drop in“ bedeutet, eine Welle anzupaddeln und zu reiten, auf die ein
        anderer Surfer bereits Vorfahrt hat. Das ist gefährlich und
        respektlos. Der Surfer, der dem Peak am nächsten ist, gehört die
        Welle; alle anderen müssen abbrechen.
    - q: Was ist Snaking?
      a: >-
        Snaking bedeutet, um einen anderen Surfer herumzupaddeln, der sich
        bereits in Position für eine Welle befindet, sodass man selbst näher
        am Peak landet. Das gilt als extrem schlechte Etikette und kann zu
        Konfrontationen führen.
    - q: Dürfen Anfänger an vollen Spots surfen?
      a: >-
        Ja, aber bleib in der Weißwasserzone und fern vom Peak. Paddle erst in
        den Haupt-Takeoff-Bereich, wenn du zuverlässig Wellen erwischst und
        deine Richtung kontrollierst. Volle Line-ups erfordern Erfahrung, um
        sie sicher zu navigieren.
    - q: Wie entschuldige ich mich im Wasser?
      a: >-
        Ein einfaches Winken, Lächeln und „meine Schuld“ oder „sorry“ reicht.
        Erkenne den Fehler an und paddle von der Person weg. Surfer
        verzeihen ehrliche Fehler meist, besonders wenn man offensichtlich
        noch am Lernen ist.
    - q: Was soll ich tun, wenn mir jemand in die Welle steigt?
      a: >-
        Bei einem klaren Drop-in rufe „wave“ oder „hey“, um die Person zu
        warnen. Wenn sie versehentlich reinrutscht und sich entschuldigt,
        lass es gut sein. Wenn jemand wiederholt einsteigt, paddle hinüber
        und erkläre höflich die Vorfahrt. Vermeide Konfrontationen.
