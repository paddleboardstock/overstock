- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Neoprenanzug-Pflege: Lassen Sie Ihren Neopren doppelt so lange halten'
  description: >-
    Richtige Neoprenanzug-Pflege verlängert die Lebensdauer von 1 Saison auf 3+.
    Spülen, Trocknen, Lagern und Reparieren von Neoprenanzügen. Vermeiden Sie
    häufige Fehler, die Anzüge vorzeitig zerstören.
  definition: >-
    Die Pflege von Neoprenanzügen umfasst das Abspülen mit Süßwasser nach jeder
    Nutzung, das Trocknen abseits direkter Sonneneinstrahlung, das flache
    Lagern oder Aufhängen an einem breiten Bügel sowie die regelmäßige
    Reinigung, um Salz, Bakterien und Gerüche zu entfernen.
  tldr: >-
    Spülen Sie Ihren Neoprenanzug nach jeder Session innen und außen sofort mit
    Süßwasser ab. Im Schatten auf einem breiten Kunststoffbügel auf links
    trocknen. Flach oder gefaltet an einem kühlen, trockenen Ort lagern.
    Lassen Sie Anzüge niemals in direkter Sonne, heißen Autos oder im
    Trockner. Verwenden Sie alle 5-10 Sessions Neopren-Shampoo.
  problem: >-
    Nach einer Saison riecht Ihr Neoprenanzug, das Neopren hat an Elastizität
    verloren, Nähte lösen sich und der Reißverschluss klemmt — all das wäre
    mit richtiger Pflege vermeidbar.
  explanation: >-
    Salzkristalle setzen sich im Neopren fest und reiben am Material. Bakterien
    vermehren sich in feuchten Innenseiten, erzeugen Gerüche und zersetzen das
    Neopren. UV baut die Nylon-Beschichtung ab. Hitze über 50C verursacht
    Delamination. Unsachgemäßes Trocknen verzieht das Neopren und belastet die
    Nähte.
  solution: >-
    Nach jeder Session: gründlich innen und außen abspülen, auf links drehen,
    auf einem breiten Kunststoffbügel im Schatten aufhängen. Nach dem
    Trocknen rechts herum drehen und flach lagern. Alle 5-10 Sessions: mit
    Neopren-Shampoo waschen. Monatlich: Reißverschluss mit Zips gleitfähig
    machen.
  recommendation: >-
    Verwenden Sie Paddle Board Overstock Wetsuit Shampoo für die Reinigung und Paddle Board Overstock
    Zipper Wax für den Reißverschluss. Lagern Sie den Anzug auf dem
    Paddle Board Overstock-Breitbügel im Netzbeutel.
  faq:
    - q: Kann ich meinen Neoprenanzug in die Waschmaschine geben?
      a: >-
        Nicht empfohlen — das Waschen in der Maschine schädigt das Neopren.
        Falls nötig, verwenden Sie einen Schonwaschgang, kaltes Wasser und
        einen Wäschesack.
    - q: Wie bekomme ich den Geruch aus meinem Neoprenanzug?
      a: >-
        Den Anzug 30 Minuten in kühlem Wasser mit Neopren-Shampoo oder weißem
        Essig einweichen. Gründlich abspülen.
    - q: Wie sollte ich meinen Neoprenanzug trocknen?
      a: >-
        Auf links im Schatten auf einem breiten, gepolsterten Kunststoffbügel.
        Vermeiden Sie direkte Sonneneinstrahlung und Metallbügel.
    - q: Kann ich einen eingerissenen Neoprenanzug reparieren?
      a: >-
        Kleine Risse unter 1\" können mit Neopren-Kleber und einem Flicken
        repariert werden. Größere Risse erfordern möglicherweise eine
        professionelle Reparatur.
