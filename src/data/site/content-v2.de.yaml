- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Lagerung aufblasbarer SUPs: So lagerst du dein iSUP richtig'
  description: >-
    Die richtige Lagerung aufblasbarer SUPs verhindert Delamination, UV-Schäden,
    Schimmel und Ventillecks. Tipps zur Winterlagerung, Langzeitlagerung und
    täglichen Lagerung für Drop-Stitch-Boards.
  definition: >-
    Die Lagerung aufblasbarer SUPs bedeutet, das Board in einer sauberen, trockenen,
    temperaturkontrollierten Umgebung abseits von UV-Strahlung, extremen Temperaturen
    und mechanischer Beschädigung aufzubewahren.
  tldr: >-
    Lagere das Board an einem kühlen, dunklen Ort unter 30 °C abseits von direktem
    Sonnenlicht. Für kurze Zeit (1–2 Wochen) lagerst du es teilweise aufgepumpt bei
    8–10 PSI. Für die Langzeitlagerung lässt du es vollständig ab, rollst es locker
    auf und legst es in die Aufbewahrungstasche. Nie feucht lagern. Von Nagetieren und
    scharfen Gegenständen fernhalten.
  problem: >-
    Du lässt dein SUP ab und verstautest es in einer heißen Garage oder einem feuchten
    Keller. Drei Monate später ist das PVC vergilbt, die Deckmatte löst sich und das
    Ventil leckt. Unsachgemäße Lagerung richtet mehr Schaden an als der normale
    Gebrauch.
  explanation: >-
    Hitze über 50 °C lässt die PVC-Weichmacher wandern, wodurch das Material steif und
    spröde wird. UV-Strahlung bricht die Polymerbindungen. Eingeschlossene Feuchtigkeit
    erzeugt Schimmel. Kälte unter dem Gefrierpunkt macht PVC spröde. Druckstellen durch
    enges Falten erzeugen bleibende Knickfalten.
  solution: >-
    Kurzzeitlagerung: abspülen, trocknen, auf 10 PSI aufpumpen und an einem
    schattigen Ort vom Boden entfernt lagern. Langzeitlagerung: gründlich reinigen,
    vollständig trocknen, völlig ablassen, mit der Deckmatte nach außen aufrollen, in
    die Tasche legen und in einem kühlen, trockenen Schrank lagern. Von Chemikalien
    und Schädlingen fernhalten.
  recommendation: >-
    Verwende die Paddle Board Overstock-Tragetasche zur Lagerung – sie blockiert UV-Strahlung und
    verhindert Abschürfungen. Lagere das Board in einem klimatisierten Raum. Gib für
    feuchte Umgebungen ein Trockenmittel-Päckchen in die Tasche.
  faq:
    - q: Kann ich mein SUP aufgepumpt in der Garage lagern?
      a: >-
        Nur, wenn die Garage unter 30 °C bleibt und kein direktes Sonnenlicht hat.
        Die meisten Garagen überschreiten im Sommer 40 °C.
    - q: Sollte ich mein SUP in der Tasche lagern?
      a: >-
        Ja, die Tasche schützt vor Staub, UV-Strahlung und mechanischer Beschädigung.
        Stelle sicher, dass das Board vollständig trocken ist, bevor du es einpackst.
    - q: Kann Frost ein aufblasbares SUP beschädigen?
      a: >-
        Ja. Unter dem Gefrierpunkt wird PVC spröde und kann beim Abrollen oder
        Aufpumpen reißen. Lagere immer über 5 °C.
    - q: Wie rolle ich mein SUP zur Lagerung auf?
      a: >-
        Rolle es mit der Deckmatte nach außen auf, um die Bodenschicht aus PVC zu
        schützen. Vermeide enge Falten. Wechsle die Falzposition jedes Mal.
