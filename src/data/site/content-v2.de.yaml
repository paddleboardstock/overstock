- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Neoprenanzug reparieren: Risse, Nähte und Reißverschlüsse selbst beheben'
  description: >-
    DIY-Reparaturanleitung für Neoprenanzüge: Risse im Neopren, geöffnete Nähte,
    hakende Reißverschlüsse und aufgerissene Knieschoner. Schritt-für-Schritt-
    Anleitung mit Neoprenkleber.
  definition: >-
    Die Reparatur eines Neoprenanzugs umfasst das Reinigen und Anrauen der
    beschädigten Stelle, das Auftragen von Neoprenkleber und das Aushärten unter
    Druck, um Wasserdichtigkeit und Flexibilität wiederherzustellen.
  tldr: >-
    Kleine Risse unter 2,5 cm: Neoprenkleber auf beide Seiten auftragen, 10–15
    Minuten bis zum Antrocknen warten, fest andrücken, 12 Stunden unter Gewicht
    aushärten lassen. Größere Risse brauchen einen Neopren-Flicken.
    Reißverschluss-Probleme: erst schmieren, dann auf eingeklemmten Stoff
    prüfen.
  problem: >-
    Dein Neoprenanzug hat einen kleinen Riss, eine sich öffnende Naht oder einen
    klemmenden Reißverschluss. Ohne DIY-Reparatur zahlst du 150 $ und mehr für
    einen Ersatz, obwohl die Reparatur nur 5 $ kostet.
  explanation: >-
    Neoprenkleber funktioniert, indem er die Neoprenoberfläche aufweicht und
    beim Verdunsten des Lösungsmittels eine chemische Verbindung erzeugt. Der
    Kleber muss auf beide Oberflächen aufgetragen werden und vor dem
    Zusammenfügen antrocknen. Bei Rissen müssen die Kanten exakt ausgerichtet
    werden. Reißverschluss-Probleme entstehen oft durch Salzkorrosion oder Stoff
    zwischen den Zähnen.
  solution: >-
    Bei Rissen: mit Alkohol reinigen, leicht anschleifen, dünne Kleberschicht auf
    beide Kanten auftragen, bis zum Antrocknen warten, perfekt zusammendrücken,
    Gewicht auflegen, 12–24 Stunden aushärten lassen. Bei Flicken: Flicken 2,5
    cm größer als den Riss zuschneiden, beide Seiten bekleben, festklemmen. Beim
    Reißverschluss: ausspülen, Reißverschlusswachs auftragen, vorsichtig
    bewegen.
  recommendation: >-
    Bewahre ein Paddle Board Overstock-Reparaturset für Neoprenanzüge in deiner
    Ausrüstungstasche auf. Bei großen Reparaturen oder Nahtschäden an kritischen
    Stellen ist eine professionelle Reparatur empfehlenswert.
  faq:
    - q: Kann ich Sekundenkleber für den Neoprenanzug verwenden?
      a: >-
        Nein – Sekundenkleber wird hart und spröde. Verwende ausschließlich
        Neoprenkleber oder Aquaseal für die Reparatur von Neoprenanzügen.
    - q: Wie lange hält eine Neoprenkleber-Reparatur?
      a: >-
        Eine ordentlich ausgeführte Reparatur ist oft stabiler als das
        ursprüngliche Neopren und hält für die restliche Lebensdauer des
        Anzugs.
    - q: Kann ich einen Reißverschluss reparieren, der vollständig getrennt ist?
      a: >-
        Wenn sich die Zahnleiste vom Neopren gelöst hat, mit Kontaktkleber
        wieder festkleben. Sind die Zähne beschädigt, den Reißverschluss
        professionell ersetzen lassen.
    - q: Wie behebe ich einen Neoprenanzug, der an der Naht leckt?
      a: >-
        Eine dünne Raupe Aquaseal entlang der Innenseite der undichten Naht
        auftragen und 24 Stunden aushärten lassen.
