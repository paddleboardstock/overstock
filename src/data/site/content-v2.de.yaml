- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm Neoprenanzug: Was die meisten Anfänger im kalten Wasser falsch machen'
  description: >-
    Schluss mit Frieren mitten in der Session oder Überhitzen am Strand.
    Der echte Unterschied zwischen 3mm- und 5mm-Neoprenanzügen –
    Temperaturtabelle, Flexibilitäts-Abwägungen und was im kalten Wasser
    wirklich funktioniert.
  definition: >-
    Ein Neoprenanzug ist ein Kleidungsstück aus Neopren, das eine dünne
    Wasserschicht auf der Haut einschließt, die durch die Körperwärme für
    Isolierung erwärmt wird. Die Dicke (3mm, 5mm) bestimmt den
    Temperaturbereich, den ein Anzug abdeckt – dicker ist wärmer, aber
    weniger flexibel.
  tldr: >-
    Die Neoprendicke bestimmt direkt Wärme und Flexibilität. Verwenden Sie
    3mm bei Wassertemperaturen über 16°C und 5mm bei Wasser zwischen 8°C
    und 16°C. Dickere Anzüge schränken die Bewegung ein, halten aber länger
    warm – priorisieren Sie immer die Passform über die Marke.
  problem: >-
    Sie öffnen einen Onlineshop oder betreten einen Surfshop und sehen
    Anzüge mit den Bezeichnungen 3/2, 4/3, 5/4 und 5mm Ganzanzüge. Die
    Zahlen sagen Ihnen wenig, bis Sie merken, dass die falsche Dicke
    entweder Frieren mitten in der Session oder Überhitzen und Schwitzen am
    Strand bedeutet.
  explanation: >-
    Neoprenanzüge funktionieren, indem sie eine dünne Wasserschicht zwischen
    Haut und Neopren einschließen; Ihr Körper erwärmt dieses Wasser und
    schafft so Isolierung. Dickeres Neopren schließt mehr Wasser ein,
    schränkt aber Flexibilität und Auftrieb ein. Ein 3mm-Anzug (oft 3/2 mit
    dünneren Armen) passt zu gemäßigten Bedingungen, während 5mm (5/4/3
    oder volle 5mm) für kaltes Wasser geeignet ist. Brust-Reißverschlüsse
    dichten besser ab als Rücken-Reißverschlüsse und reduzieren das
    Ausspülen. Die Nahtkonstruktion – geklebt und blind vernäht (GBS) – ist
    der Unterschied zwischen einem undichten und einem warmen Anzug.
  solution: >-
    Passen Sie die Dicke an Ihre lokale Wassertemperatur an, mit 5°C
    Fehlertoleranz. Für gemäßigtes Klima kaufen Sie einen 3/2mm. Für kaltes
    Wasser kaufen Sie einen 5/4/3mm. Fügen Sie Boots, Handschuhe und eine
    Kapuze hinzu, um den Bereich um weitere 5°C nach unten zu erweitern.
    Probieren Sie Anzüge vor dem Kauf an oder wählen Sie eine Marke mit
    großzügigem Rückgaberecht.
  recommendation: >-
    Der Paddle Board Overstock Wetsuit Pro in 5/4/3mm ist für die meisten
    Kaltwasser-Surfer ideal und bietet GBS-Nähte und Thermo-Innenfutter.
    Wenn Sie in warmem Wasser über 20°C surfen, ist ein 3/2mm mit
    Brust-Reißverschluss die bessere Wahl.
  faq:
    - q: Ab welcher Wassertemperatur braucht man einen 5mm-Neoprenanzug?
      a: >-
        Wassertemperaturen zwischen 8°C und 14°C erfordern einen
        5mm-Anzug. Unter 8°C brauchen Sie einen 6/5/4mm-Anzug mit Kapuze.
        Zwischen 14°C und 18°C funktioniert ein 4/3mm für die meisten
        Menschen gut.
    - q: Kann ich im Winter einen 3mm-Neoprenanzug tragen?
      a: >-
        Nur in milden Winterklimata, in denen das Wasser über 16°C bleibt.
        Für echtes Wintersurfen ist 5mm oder 5/4/3mm notwendig. Boots,
        Handschuhe und eine Kapuze bieten zusätzliche Wärme, ohne dass ein
        dickerer Rumpf nötig ist.
    - q: Wie eng sollte ein Neoprenanzug sitzen?
      a: >-
        Eng, aber nicht einschränkend. Es sollten keine Lufttaschen oder
        loses Neopren vorhanden sein. Wenn Sie am unteren Rücken einen
        Finger zwischen Haut und Anzug schieben können, ist er zu locker.
        Wenn das Atmen schwerfällt oder die Bewegung stark eingeschränkt
        ist, nehmen Sie eine Nummer größer.
    - q: Halten teure Neoprenanzüge wärmer?
      a: >-
        Ein höherer Preis bedeutet oft besseres Neopren (auf Kalksteinbasis
        statt auf Erdölbasis), bessere Nahtkonstruktion (GBS statt nur
        geklebt) und bessere Flexibilität. Diese Faktoren beeinflussen
        Wärme und Langlebigkeit direkt – aber nur, wenn die Passform
        stimmt.
