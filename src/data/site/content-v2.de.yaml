- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP-Selbstrettung: So kommst du im tiefen Wasser wieder auf dein Board'
  description: >-
    Jeder SUP-Paddler sollte die Selbstrettung beherrschen. Schritt-für-Schritt-Techniken
    zum Wiederaufsteigen auf dein Board im tiefen Wasser, zum Ziehen des Boards
    ans Ufer und zum Umgang mit verhedderten Leashes.
  definition: >-
    SUP-Selbstrettung ist die Technik, nach einem Sturz im tiefen Wasser wieder auf
    dein Paddle-Board zu steigen — einschließlich Bergung des Boards, Wiederaufstieg
    des Körpers und Wiedergewinnung des Paddels.
  tldr: >-
    Nach dem Sturz: bleibe ruhig, halte das Paddel fest und schwimme zum Board.
    Lege das Paddel quer über das Board. Nutze einen Delphinstoß, um den Oberkörper
    auf das Board zu bringen. Schwinge ein Bein hoch, dann das andere. Knie zuerst,
    dann stehe auf. Übe in ruhigem Wasser, bis es zur automatischen Bewegung wird.
  problem: >-
    Du fällst im tiefen Wasser von deinem SUP und kommst nicht wieder hoch. Das
    Board ist glitschig, du bist erschöpft, und Panik macht sich breit. Ohne
    Kenntnis der Selbstrettungstechnik wird ein simpler Sturz gefährlich.
  explanation: >-
    Die Selbstrettung hat drei Phasen: Bergung (zum Board schwimmen und das Paddel
    holen), Wiederaufstieg (zurück auf das Board) und Weiterfahrt (das Paddeln
    fortsetzen). Die wichtigste Technik ist, das Paddel als Stabilisator zu nutzen
    und mit kräftigen Beinschlägen den Oberkörper auf das Board zu bringen.
  solution: >-
    Phase 1: Schwimme zum Board. Halte das Paddel fest oder hole es zurück. Phase 2:
    Lege das Paddel quer über das Board. Tritt kräftig mit den Beinen, während du
    die Brust zur Boardmitte ziehst. Phase 3: Sobald die Brust auf dem Board liegt,
    schwinge die Beine nacheinander hoch. Phase 4: Knie nieder, verschnaufe und
    stehe dann allmählich auf.
  recommendation: >-
    Übe die Selbstrettung unter kontrollierten Bedingungen, bis du sie ohne
    Nachdenken beherrschst. Das Paddle Board Overstock SUP Explorer 11 bietet guten Deckgrip.
    Die Life Vest Pro gibt zusätzlichen Auftrieb, wenn du in Schwierigkeiten gerätst.
  faq:
    - q: Wie komme ich wieder aufs Board, wenn ich erschöpft bin?
      a: >-
        Bleibe beim Board, um dich über Wasser zu halten. Nutze deine Arme, um die
        Brust auf das Board zu ziehen, auch wenn die Beine nicht mehr effektiv
        treten können. Erhole dich in kniender Position, bevor du aufstehst.
    - q: Was, wenn ich das Paddel verliere?
      a: >-
        Nutze deine Arme, um das Board zum Ufer zu treiben. Bitte einen anderen
        Paddler um Hilfe. Ersetze das verlorene Paddel umgehend.
    - q: Kann ich mich bei Wellen selbst retten?
      a: >-
        Ja — positioniere das Board senkrecht zu den Wellen. Time den Wiederaufstieg
        zwischen den Wellen. Die Leash hält das Board in deiner Nähe.
    - q: Wie gehe ich mit einer verhedderten Leash um?
      a: >-
        Bleibe ruhig, lege dich auf den Rücken und entwirre die Leash langsam. Wenn
        sich die Leash um die Finnen gewickelt hat, musst du die Finnen möglicherweise
        im Wasser entfernen.
