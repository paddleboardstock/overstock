- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP-Hydration und Sonnenschutz: Sicher auf dem Wasser bleiben'
  description: >-
    Wichtige Strategien zu Hydration und Sonnenschutz für SUP-Paddler. Dehydration
    und Sonnenbrand sind die häufigsten SUP-Probleme — so verhinderst du beides bei
    langen Sessions.
  definition: >-
    SUP-Hydration bedeutet, durch regelmäßige Wasseraufnahme während des Paddelns
    den Flüssigkeitshaushalt aufrechtzuerhalten. Sonnenschutz umfasst das Auftragen
    von Sonnencreme mit Lichtschutzfaktor (SPF), schützende Kleidung und die
    zeitliche Planung von Sessions, um starke UV-Strahlung zu vermeiden.
  tldr: >-
    Trinke pro Stunde Paddeln 500 ml Wasser. Nimm mehr mit, als du denkst zu
    brauchen — einen 2-Liter-Trinkbeutel oder mehrere Flaschen. Trage vor dem
    Paddeln wasserfeste Sonnencreme mit SPF 50+ auf und erneuere sie alle 2 Stunden.
    Trage einen Hut, eine Sonnenbrille mit Halteband und Kleidung mit UPF-Schutz.
    Vermeide Paddeln zwischen 11 und 15 Uhr, wenn die UV-Strahlung am stärksten ist.
  problem: >-
    Du hast eine tolle SUP-Session, doch nach einer Stunde bekommst du Kopfschmerzen,
    einen trockenen Mund und deine Haut brennt. Dehydration und Sonnenbrand
    schleichen sich an, weil das Wasser dich kühl hält.
  explanation: >-
    Die Reflexion des Wassers verstärkt die UV-Belastung um bis zu 40 %. Der
    kühlende Effekt von Wasser und Wind überdeckt den Sonnenbrand, bis es zu spät
    ist. Das Schwitzen beim Paddeln erhöht den Flüssigkeitsverlust, und auf dem
    Wasser gibt es oft keine Möglichkeit, Wasser nachzufüllen. Dehydration
    beeinträchtigt Gleichgewicht und Entscheidungsfähigkeit und erhöht das
    Unfallrisiko.
  solution: >-
    Befestige eine Wasserflasche oder einen Trinkbeutel am Bungee-System des Boards.
    Trinke alle 15 Minuten — ob du durstig bist oder nicht. Trage Sonnencreme mit
    SPF 50+ 30 Minuten vor dem Start auf. Trage einen Hut mit breiter Krempe, eine
    polarisierte Sonnenbrille mit Halteband und einen Rash Guard mit UPF 50+.
    Erneuere die Sonnencreme alle 2 Stunden.
  recommendation: >-
    Nutze einen Trinkbeutel, der an den vorderen D-Ringen deines Paddle Board Overstock-SUP
    befestigt wird. Trage einen Rash Guard mit UPF 50+ unter deiner Schwimmweste.
    Verwende eine wasserfeste Sonnencreme, die auch bei Schweiß und Wasser hält.
  faq:
    - q: Wie viel Wasser sollte ich auf eine SUP-Tour mitnehmen?
      a: >-
        Mindestens 1 Liter pro Stunde. Für eine 2-stündige Session bringe 2 Liter
        mit. Bei heißem Wetter mehr. Ein Trinkbeutel funktioniert am besten.
    - q: Welche Sonnencreme ist für SUP am besten?
      a: >-
        Wasserfest, SPF 50+, Breitbandschutz. Mineralische Sonnencremes (Zinkoxid,
        Titandioxid) sind riff-freundlich (reef-safe) und halten länger.
    - q: Reflektiert Wasser wirklich UV-Strahlung?
      a: >-
        Ja — Wasser reflektiert bis zu 40 % der UV-Strahlung, das heißt, UV trifft
        dich von oben und von unten. Das erhöht das Verbrennungsrisiko erheblich.
    - q: Kann ich durch einen Rash Guard einen Sonnenbrand bekommen?
      a: >-
        Standard-Rash Guards bieten nur minimalen UV-Schutz (etwa UPF 10–20).
        Achte auf Kleidung mit UPF 50+ für vollständigen Schutz.
