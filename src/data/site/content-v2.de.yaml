    GBS-Nähte (geklebt und blind genäht) sind der Goldstandard – das Neopren
    wird verklebt und anschließend genäht, ohne bis zur Innenseite zu
    durchstechen, wodurch kein Wasser eindringt. Der Brustreißverschluss nutzt
    einen wasserdichten YKK-Reißverschluss mit Dichtlippe. Kniepolster und eine
    strapazierfähige Außenhaut schützen vor Abrieb durch Paddeln und Sitzen auf
    dem Board.
  solution: >-
    Wählen Sie die Dicke anhand der Wassertemperatur mit dem
    Neoprendicke-Leitfaden. Die 3/2 mm deckt 14–20 °C mit maximaler
    Flexibilität ab. Die 5/4/3 mm deckt 8–16 °C mit Thermofutter für extra
    Wärme ab. Beide umfassen abgedichtete Bündchen, einen tropffreien Kragen
    und eine Schlüsseltasche.
