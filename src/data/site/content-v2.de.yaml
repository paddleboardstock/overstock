- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Ausrüstungs-Guide für Kaltwasser-Surfen (Durch den Winter surfen, ohne zu leiden)
  description: >-
    Lassen Sie nicht zu, dass kaltes Wasser Ihre Saison beendet. Die
    komplette Kaltwasser-Ausrüstung im Detail: Neoprendicke, Boot- und
    Handschuhauswahl, Kapuzenpassform und das Zubehör, das Winter-Sessions
    tatsächlich angenehm macht.
  definition: >-
    Kaltwasser-Surfen erfordert einen vollen Neoprenanzug (5/4/3mm oder
    dicker), Boots, Handschuhe und eine Kapuze. Unter 12°C braucht jeder
    Kontaktpunkt mit dem kalten Wasser Schutz, um Taubheitsgefühle,
    Unterkühlung und Sicherheitsrisiken zu vermeiden.
  tldr: >-
    Kaltwasser-Surfen erfordert einen vollen 5/4/3mm- oder 6/5/4mm-Anzug
    mit Kapuze, 5mm-Boots, 3mm-Handschuhe und eine Kapuze. Die
    Nahtqualität ist wichtiger als die Marke – achten Sie auf geklebte und
    blind vernähte Nähte (GBS). Ein Anzug mit Thermo-Innenfutter bietet
    deutliche Wärme ohne zusätzliche Dicke. Bringen Sie immer zusätzliche
    Wärmeschichten und eine Thermoskanne für die Erholung nach der Session
    mit.
  problem: >-
    Sie wollen den Winter durchsurfen, aber das kalte Wasser betäubt Ihre
    Füße nach 15 Minuten, Ihre Hände können das Board nicht greifen, und
    bei jedem Paddelzug spült Ihnen Ihr Anzug eiskaltes Wasser den Rücken
    hinunter. Ohne die richtige Ausrüstung sind Kaltwasser-Sessions kurz
    und miserable.
  explanation: >-
    Kaltwasser-Surfen (unter 12°C) verlangt mehr als nur einen dicken
    Neoprenanzug. Jeder Kontaktpunkt mit der Kälte braucht Schutz: Boots
    verhindern taube Füße und schützen vor Riff-Schnittwunden, Handschuhe
    erhalten die Handfunktion beim Paddeln, und eine Kapuze verhindert den
    größten Wärmeverlust (über den Kopf gehen 30 Prozent der Körperwärme
    verloren). Die Neoprendicke sollte auf den kältesten Monat abgestimmt
    sein, nicht auf den Durchschnitt. Neben dem Anzug verbessern Zubehör
    wie Stiefelchen mit versiegelten Sohlen und Handschuhe mit
    vorgebogenen Fingern Komfort und Langlebigkeit.
  solution: >-
    Bauen Sie sich ein Kaltwasser-Set in dieser Reihenfolge auf: 5/4/3mm-
    oder 6/5/4mm-Ganzanzug mit GBS-Nähten und Brust-Reißverschluss,
    5mm-Boots mit Gummisohlen, 3mm-Handschuhe (Fäustlinge sind wärmer als
    Fingerhandschuhe) und eine 3mm-Kapuze, die unter den Anzugkragen
    gesteckt wird. Fügen Sie einen Umkleide-Roben für Würde und Wärme auf
    dem Parkplatz hinzu.
  recommendation: >-
    Der Paddle Board Overstock Wetsuit Pro in 5/4/3mm mit integriertem Thermo-Innenfutter
    bewältigt die meisten Kaltwasser-Bedingungen bis hinunter zu 8°C.
    Kombinieren Sie ihn mit 5mm-Paddle Board Overstock-Boots und 3mm-Handschuhen für ein
    komplettes Kaltwasser-Setup. Unter 8°C wechseln Sie auf einen
    6/5/4mm-Anzug mit Kapuze.
  faq:
    - q: Brauche ich wirklich eine Kapuze?
      a: >-
        Ja. Sie verlieren 30 Prozent Ihrer Körperwärme über den Kopf. Eine
        Kapuze verhindert das Ausspülen und hält Ihren Nacken warm. Eine
        3mm-Kapuze bringt mehr Wärme als das Aufrüsten von 5mm auf 6mm
        Rumpfdicke.
    - q: Welche Boot-Dicke brauche ich?
      a: >-
        Für Wasser mit 8-12°C verwenden Sie 5mm-Boots. Bei 12-16°C reichen
        3mm-Boots. Unter 8°C sollten Sie 7mm-Boots erwägen oder Neopren-
        Socken unter 5mm-Boots tragen.
    - q: Wie verhindere ich, dass mein Anzug Wasser einlässt?
      a: >-
        Das Ausspülen passiert, wenn Wasser am Hals, an den Handgelenken
        oder Knöcheln in den Anzug eindringt. Ein
        Brust-Reißverschluss reduziert das Ausspülen am Rücken erheblich.
        Klettverschlüsse an Hals und Knöcheln helfen ebenfalls, aber die
        beste Lösung ist ein gut sitzender Anzug mit GBS-Nähten.
    - q: Kann ich im kalten Wasser einen 3mm-Anzug mit zusätzlichen Schichten verwenden?
      a: >-
        Ein 3mm-Anzug mit Neopren-Weste darunter kann Ihren Bereich um etwa
        3-4°C erweitern, ersetzt aber keinen richtigen 5/4/3mm- oder
        5mm-Anzug. Schichten funktionieren am besten für kurze Sessions
        unter Grenzbedingungen.
