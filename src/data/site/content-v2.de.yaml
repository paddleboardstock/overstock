- slug: sup-safety-guide
  category: guide
  type: safety
  title: 'SUP-Sicherheitsleitfaden: Die wichtigsten Regeln für jeden Paddler'
  description: >-
    Vollständiger SUP-Sicherheitsleitfaden zu Wetterchecks, Ausrüstung,
    Selbstrettung, Vorfahrtsregeln und dem richtigen Verhalten, wenn die
    Bedingungen gefährlich werden. Bleib sicher auf deinem Paddle Board.
  definition: >-
    SUP-Sicherheit umfasst die Planung vor dem Ausflug (Wetter, Gezeiten,
    Ausrüstungschecks), Verhaltensregeln auf dem Wasser (Leash, PFD,
    Navigation) und Notfallverfahren (Selbstrettung, Signalisieren,
    Unterkühlung vermeiden).
  tldr: >-
    Immer Leash und PFD tragen. Windvorhersage prüfen – auflandiger Wind ist
    gefährlich. Zuerst gegen den Wind paddeln, damit der Wind die Rückkehr
    erleichtert. Trillerpfeife, Handy in wasserdichter Hülle und Wasser
    mitführen. Selbstrettung üben. In abgelegenen Gebieten nie allein SUPen.
  problem: >-
    SUP wirkt trügerisch einfach. Anfänger unterschätzen, wie schnell Wind,
    Strömung und Erschöpfung aus einer schönen Session Gefahr machen.
  explanation: >-
    Das Board wirkt im Wind wie ein Segel: Mit dem Wind zu paddeln ist einfach,
    gegen den Wind zurückzukommen aber extrem schwer. Die aufrechte Haltung
    erhöht die Sturzgefahr. Die Erschöpfung tritt schneller ein als beim Kajak.
    Die Leash verhindert die Trennung vom Board. Eine PFD hält dich bei
    Verletzungen über Wasser.
  solution: >-
    Vor dem Ausflug: Wind prüfen (für Anfänger max. 10 Knoten), Richtung prüfen
    (auflandigen Wind vermeiden) und Gezeiten prüfen. Jemandem deine Route
    mitteilen. Auf dem Wasser: bei starkem Wind kniend paddeln. Falls getrennt,
    zum Board zurückschwimmen. Zur Selbstrettung: Paddel quer über das Board
    legen, mit den Beinen strampeln, den Oberkörper aufs Board ziehen, die Beine
    hochschwingen.
  recommendation: >-
    Für SUP die Paddle Board Overstock Life Vest Pro (aufblasbar) verwenden. Die coiled
    SUP-Leash an der Wade befestigen. Selbstrettung bei ruhigen Bedingungen
    üben, bevor du sie brauchst.
  faq:
    - q: Welche Windgeschwindigkeit ist für SUP sicher?
      a: >-
        Anfänger: unter 10 Knoten. Fortgeschrittene: 10–15 Knoten. Profis: 15–20
        Knoten. Über 20 Knoten ist für alle Erfahrungsstufen gefährlich.
    - q: Brauche ich für SUP eine Schwimmweste?
      a: >-
        Ja – in vielen Ländern gesetzlich vorgeschrieben und aus Sicherheitsgründen
        immer empfohlen.
    - q: Was soll ich tun, wenn ich nicht zurück ans Ufer komme?
      a: >-
        Beim Board bleiben (es trägt dich). Mit der Trillerpfeife Signale geben.
        Wenn du auf See getrieben wirst, in einem 45-Grad-Winkel zum Wind
        paddeln.
    - q: Wie übe ich die SUP-Selbstrettung?
      a: >-
        In ruhigem, flachem Wasser: absichtlich ins Wasser fallen, zum Board
        schwimmen und den Wiedereinstieg wiederholt üben.
