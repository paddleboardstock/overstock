- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP mit deinem Hund: Eine vollständige Anleitung'
  description: >-
    Paddle-Boarding mit deinem Hund — Vorbereitung, Sicherheit, Trainingsschritte,
    Ausrüstungsempfehlungen und Tipps für ein tolles Erlebnis für euch beide.
  definition: >-
    SUP mit Hund bedeutet, deinen vierbeinigen Begleiter darin zu trainieren, auf
    einem Paddle-Board das Gleichgewicht zu halten, ihn mit einer
    Hundeschwimmweste auszustatten und gemeinsam sicher zu paddeln.
  tldr: >-
    Beginne mit einem breiten, stabilen SUP (ab 34 Zoll). Besorge deinem Hund eine
    gut sitzende Schwimmweste mit Tragegriff. Stelle das Board zuerst an Land vor,
    dann im flachen Wasser. Starte mit kurzen Sessions und positiver Verstärkung.
    Nimm immer Wasser für deinen Hund mit. Achte auf Anzeichen von Stress oder
    Erschöpfung.
  problem: >-
    Dein Hund liebt Wasser, aber du weißt nicht, wie du ihn sicher an das SUP
    heranführst. Ohne richtiges Training kann ein Hund in Panik geraten, abspringen
    oder das Board zerkratzen.
  explanation: >-
    Hunde haben natürliche Schwimmfähigkeiten, müssen aber erst lernen, dass das
    Board eine sichere Plattform ist. Der Schlüssel ist schrittweise
    Desensibilisierung: Stelle das Board auf festem Boden vor, belohne ruhiges
    Verhalten, gehe dann ins flache Wasser und schließlich ins tiefere Wasser.
  solution: >-
    Beginne an Land: Lass den Hund das Board beschnuppern und darauf laufen (auf
    Gras). Belohne ruhiges Verhalten. Als Nächstes: Lege das Board in sehr flaches
    Wasser, halte es fest und lass den Hund daraufstehen. Belohnen. Danach: Du
    steigst im flachen Wasser auf, und der Hund kommt dazu. Zum Schluss: Paddle
    langsam in ruhigem Wasser.
  recommendation: >-
    Nutze das Paddle Board Overstock SUP Explorer 11 mit seiner stabilen 33-Zoll-Plattform.
    Ergänze eine Hundeschwimmweste (Life Vest). Bringe frisches Wasser und eine
    Schale mit. Starte mit 10-Minuten-Sessions und steigere die Dauer allmählich.
  faq:
    - q: Welche SUP-Größe brauche ich für meinen Hund?
      a: >-
        Ein 33–34 Zoll breites Board bietet mittelgroßen bis großen Hunden
        Stabilität. Kleine Hunde (unter 10 kg) kommen auch mit Boards ab 32 Zoll klar.
    - q: Braucht mein Hund eine Schwimmweste?
      a: >-
        Ja — auch starke Schwimmer brauchen eine Hundeschwimmweste mit Tragegriff,
        um sie im Notfall leicht bergen zu können.
    - q: Wie schütze ich das Board vor Krallen?
      a: >-
        Halte die Krallen deines Hundes kurz. Nutze eine Deck-Pad-Schutzauflage oder
        ein Handtuch. Hunde gewöhnen sich in der Regel daran und kratzen nicht mehr,
        sobald sie sich wohlfühlen.
    - q: Kann jeder Hund SUP lernen?
      a: >-
        Die meisten Hunde können es mit Geduld lernen. Ängstliche Hunde brauchen
        möglicherweise länger. Zwinge einen verängstigten Hund niemals auf das Board —
        das erzeugt negative Assoziationen.
