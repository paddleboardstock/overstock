- slug: understanding-tides
  category: guide
  type: technical
  title: 'Gezeiten verstehen für den Wassersport: Ein praktischer Leitfaden'
  description: >-
    Wie Gezeiten die Bedingungen für SUP, Surfen und Kajak beeinflussen.
    Gezeitenkalender lesen, Spring- und Nipptide verstehen und deine Session
    sicher an den Gezeitenbewegungen ausrichten.
  definition: >-
    Gezeiten sind der tägliche Anstieg und Abfall des Meeresspiegels, verursacht
    durch die Gravitation von Mond und Sonne. Die Tidenhübe variieren je nach
    Ort und Mondphase.
  tldr: >-
    An den meisten Orten gibt es täglich zwei Hoch- und zwei Niedrigwasser.
    Springtiden (Voll-/Neumond) haben größere Hübe und stärkere Strömungen.
    Nipptiden (Halbmond) haben kleinere Hübe. Gezeiten beeinflussen Wassertiefe,
    Wellenform und Strömungsstärke. Beim SUP: zuerst gegen die Strömung paddeln,
    damit sie dir die Rückkehr erleichtert.
  problem: >-
    Du kommst an deinem Hausspot an und findest kaum Surfbedingungen, gefährliche
    Strömungen durch ablaufendes Wasser oder zu flaches Wasser. Ohne
    Gezeitenwissen vergeudest du Fahrten oder paddelst unter gefährlichen
    Bedingungen hinaus.
  explanation: >-
    Gezeiten werden durch die Gravitation des Mondes verursacht. Springtiden
    (Voll- und Neumond) erzeugen die höchsten Hoch- und die niedrigsten
    Niedrigwasser. Nipptiden (Halbmond) erzeugen einen minimalen
    Tidenhub. Gezeitenströme sind zur mittleren Tide am schnellsten und bei
    Hoch- und Niedrigwasser träge. Der Tidenhub reicht von 0,3 m (Mittelmeer)
    bis 16 m (Bucht von Fundy).
  solution: >-
    Vor jeder Session den Gezeitenkalender prüfen. Beim Surfen: Strandbreaks
    funktionieren oft am besten 2–3 Stunden um das Hochwasser herum. Beim SUP:
    in der ersten Hälfte gegen die Strömung paddeln, damit die Strömung die
    Rückkehr unterstützt. Beim Angeln: auflaufendes Wasser drückt die Fische auf
    die Sandbänke.
  recommendation: >-
    NOAA-Gehzeitenvorhersagen oder eine lokale Gezeiten-App nutzen. Die
    Gezeitenvorliebe deines Hausspots ermitteln, indem du die Bedingungen einen
    Monat lang protokollierst.
  faq:
    - q: Was ist eine Springtide?
      a: >-
        Springtiden treten bei Voll- und Neumond auf und erzeugen höhere
        Hochwasser und stärkere Strömungen. Sie kommen zweimal im Monat vor.
    - q: Was ist eine Nipptide?
      a: >-
        Nipptiden treten bei Halbmond auf. Der Tidenhub ist kleiner und die
        Strömungen sind schwächer – gut für Anfänger.
    - q: Sind Niedrigwasser für SUP gefährlich?
      a: >-
        Bei Niedrigwasser können Felsen und Riffe freiliegen. Außerdem wird die
        Wellenenergie auf steileren Sandbänken gebündelt.
    - q: Wie beeinflussen Gezeiten Strömungsrisse?
      a: >-
        Ablaufendes Wasser (Ebbe) verstärkt Strömungsrisse. Auflaufendes Wasser
        (Flut) schwächt sie ab.
