- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Wartung von Schlauchbooten: Schützen Sie Ihre Investition'
  description: >-
    Checkliste für die jährliche Wartung von Schlauchbooten. Reinigung,
    UV-Schutz, Nahtprüfung, Druckmanagement, Motorpflege und
    Winterfestmachung für PVC- und Hypalon-Boote.
  definition: >-
    Die Wartung von Schlauchbooten umfasst Reinigung, UV-Schutz,
    Druckmanagement, die Prüfung von Nähten und Ventilen, Schimmelprävention
    und die richtige Lagerung außerhalb der Saison.
  tldr: >-
    Nach jedem Einsatz im Salzwasser abspülen. Alle 2-3 Monate UV-Schutz
    auftragen. Vor jedem Ausflug den Luftdruck prüfen. Nähte, Ventile und
    Spiegel monatlich kontrollieren. Mit milder Seife reinigen. Außerhalb der
    Saison abgelassen an einem kühlen, trockenen Ort lagern.
  problem: >-
    Sie haben Ihr Schlauchboot eine Saison lang benutzt, und nun wirken die
    Schläuche ausgebleicht, eine Naht schwitzt und der Spiegel fühlt sich
    schwammig an — all das wäre mit routinemäßiger Wartung vermeidbar.
  explanation: >-
    UV-Strahlung baut die Polymer-Matrix ab. Salzwasser kristallisiert in
    Falten und reibt am Gewebe. Schimmel wächst in eingeschlossener
    Feuchtigkeit. Falscher Druck verursacht Materialermüdung. Der Spiegel
    (insbesondere bei Sperrholz) nimmt über die Schraubenlöcher Wasser auf.
  solution: >-
    Nach jeder Nutzung: mit Süßwasser abspülen, trocknen, Druck prüfen.
    Monatlich: Schläuche mit UV-Schutz einreiben, Nähte prüfen, Ventil
    kontrollieren. Jährlich: gründlich reinigen, Spiegel auf Fäulnis prüfen,
    Ventile schmieren, auf Mikrolecks testen.
  recommendation: >-
    Verwenden Sie 303 Aerospace Protectant auf Paddle Board Overstock-Schlauchbooten.
    Entfernen Sie die Ventile und tragen Sie jährlich Silikonfett auf. Lagern
    Sie das Boot mit einem Trockenmittel-Beutel in der Transporttasche.
  faq:
    - q: Kann ich mein Schlauchboot mit Bleichmittel reinigen?
      a: >-
        Nein — Bleichmittel schädigt die Gewebebeschichtung. Verwenden Sie
        milde Seife und warmes Wasser. Bei Schimmel verwenden Sie verdünnten
        weißen Essig.
    - q: Wie oft sollte ich einen UV-Schutz auftragen?
      a: >-
        Alle 2-3 Monate während der Nutzungssaison. In tropischen Klimazonen
        häufiger.
    - q: Muss ich mein Boot zwischen den Einsätzen ablassen?
      a: >-
        Nicht, wenn Sie es wöchentlich nutzen. Lassen Sie es aufgeblasen und
        mit einer UV-Abdeckung liegen. Bei monatlichen Abständen ablassen und
        einlagern.
    - q: Wie pflege ich den Spiegel?
      a: >-
        Schrauben monatlich prüfen. Freiliegende Holzkanten jährlich mit
        Bootslack versiegeln. Ersetzen, wenn weiche Stellen entstehen.
