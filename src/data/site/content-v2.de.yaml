- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Pflege für aufblasbare SUPs: So hält dein Board viele Jahre'
  description: >-
    Die richtige Pflege aufblasbarer SUPs verlängert die Lebensdauer des Boards
    erheblich. Reinigen, Trocknen, Ventilpflege, UV-Schutz und Tipps zur
    saisonalen Lagerung für Drop-Stitch-Paddle-Boards.
  definition: >-
    Die Pflege aufblasbarer SUPs umfasst das Reinigen nach der Benutzung, richtiges
    Trocknen, die Ventilinspektion, UV-Schutz und korrekte Lagerung, um Delamination,
    Schimmel, Materialabbau und Luftverluste zu verhindern.
  tldr: >-
    Spüle dein Board nach jeder Salzwasser-Einheit mit frischem Wasser ab. Trockne es
    vollständig, ehe du es ablässt und lagerst. Prüfe das Ventil auf Schmutz und
    schmiere den O-Ring einmal jährlich. Lagere das Board aufgepumpt (bei halbem PSI)
    an einem kühlen, dunklen Ort. Vermeide längere UV-Einwirkung, die das PVC angreift.
    Kleine Stiche reparierst du sofort mit dem mitgelieferten Reparaturset.
  problem: >-
    Nach einer Saison entwickelt dein aufblasbares SUP langsame Lecks, die Deckmatte
    löst sich an den Rändern und das PVC fühlt sich steifer an. Wer die einfache
    Pflege vernachlässigt, beschleunigt eine vorzeitige Alterung, die sich
    vollständig vermeiden ließe.
  explanation: >-
    PVC baut sich unter UV-Strahlung ab. Salzkristalle aus dem Meerwasser dringen in
    Nähte und Ventile ein und verursachen Mikrolecks. Im Inneren eingeschlossene
    Feuchtigkeit fördert Schimmelbildung, die die Drop-Stitch-Fäden angreift.
    Ventil-O-Ringe trocknen aus und verlieren ihre Dichtfunktion. Schmutz und Sand
    reiben sich in den Klebstoff der Deckmatte und verursachen abstehende Kanten.
  solution: >-
    Nach jeder Einheit: Board, Finnen und Pumpe mit frischem Wasser abspülen.
    Deckmatte abwischen. Ventil öffnen, um eingeschlossenes Wasser ablaufen zu
    lassen. Board vor dem Ablassen im Schatten trocknen. Monatlich: Ventil prüfen und
    Silikongleitmittel auf den O-Ring auftragen. Saisonal: mit milder Seife und Wasser
    waschen und auf Stiche prüfen.
  recommendation: >-
    Befolge die Pflegeanleitung von Paddle Board Overstock, die deinem Board beiliegt. Verwende das
    Reparaturset sofort bei jedem Stich. Lagere das Board in seiner Tasche an einem
    temperaturkontrollierten Ort abseits von direktem Sonnenlicht.
  faq:
    - q: Kann ich mein aufblasbares SUP die ganze Saison aufgepumpt lassen?
      a: >-
        Ja, aber lagere es abseits von direktem Sonnenlicht und bei halbem Maximal-PSI
        (8–10 PSI), um die Nähte zu entlasten. Pumpe es kurz vor der Benutzung voll auf.
    - q: Wie entferne ich Schimmel von meinem SUP?
      a: >-
        Mische milde Seife mit warmem Wasser und schrubbe mit einer weichen Bürste.
        Bei hartnäckigem Schimmel hilft verdünnter weißer Essig (1:4). Vermeide
        Bleichmittel.
    - q: Muss ich das Ventil schmieren?
      a: >-
        Ja, einmal jährlich. Entferne den Ventileinsatz, bringe Silikonfett auf den
        O-Ring auf und setze ihn wieder ein. Das verhindert Luftverluste.
    - q: Wie lagere ich mein SUP im Winter?
      a: >-
        Reinige und trockne es gründlich. Lasse es vollständig ab, rolle es locker auf
        (vermeide enge Falten) und lagere es an einem kühlen, dunklen, trockenen Ort.
        Vermeide Frosttemperaturen.
