- slug: life-jacket-buying-guide
  category: guide
  type: buying-guide
  title: 'Schwimmwesten-Kaufratgeber: Typen, Passform und Ausstattung erklärt'
  description: >-
    Der vollständige Kaufratgeber für Schwimmwesten für den Wassersport.
    PFD-Typen (I bis V), Aufblasbar vs. Schaumstoff, Passformtest und
    spezifische Empfehlungen für SUP, Kajak, Bootfahren und Angeln.
  definition: >-
    Eine Schwimmweste (PFD) ist ein Auftriebsmittel, das den Kopf einer Person
    über Wasser hält. Die Typen werden von der US-Küstenwache anhand von
    Auftrieb und Verwendungszweck reguliert.
  tldr: >-
    Fünf PFD-Typen: Typ I (offshore, 22+ lb), Typ II (küstennah), Typ III
    (Auftriebshilfe, am häufigsten), Typ IV (werfbar), Typ V (Spezialnutzung).
    Aufblasbare Westen sind bequem, benötigen aber die Wartung der
    CO2-Kartusche. Schaumstoffwesten sind wartungsfrei, aber sperriger.
  problem: >-
    Schwimmwesten werden nach Typen und Auftriebswerten kategorisiert, doch
    Geschäfte erklären nicht immer, welcher Typ zu deiner Aktivität passt.
  explanation: >-
    Typ I bietet den meisten Auftrieb und dreht eine bewusstlose Person auf den
    Rücken. Typ II dreht nicht alle Träger auf den Rücken. Typ III erlaubt
    Bewegungsfreiheit für aktive Sportarten. Typ V umfasst aufblasbare
    Bauchgurt-Packs für SUP. Aufblasbare PFDs bieten 33–37 lb Auftrieb und sind
    in entleertem Zustand kompakt.
  solution: >-
    Für SUP: aufblasbarer Bauchgurt-Pack Typ V. Für Kajak: Typ-III-Schaumstoff
    mit hohen Armausschnitten. Für RIB-Bootfahren: Typ-III-Schaumstoff oder
    aufblasbar mit 22+ lb Auftrieb. Für Kinder: Typ-II- oder Typ-III-Schaumstoff
    mit Beinriemen.
  recommendation: >-
    Paddle Board Overstock Life Vest Pro (aufblasbar, Typ V, 33 lb) für SUP und Kajak.
    Paddle Board Overstock Life Vest Classic (Schaumstoff, Typ III, 16,5 lb) für
    RIB-Bootfahren und allgemeine maritime Nutzung.
  faq:
    - q: Welchen PFD-Typ brauche ich für SUP?
      a: >-
        Viele Länder akzeptieren Typ III oder Typ V für SUP. Aufblasbare
        Bauchgurt-Packs sind beliebt. Örtliche Vorschriften prüfen.
    - q: Brauchen aufblasbare PFDs Wartung?
      a: >-
        Ja – CO2-Kartusche jährlich prüfen, Auslösepatrone alle 2–3 Jahre
        ersetzen, nach dem Einsatz im Salzwasser ausspülen.
    - q: Kann ich für SUP eine Schaumstoff-PFD tragen?
      a: >-
        Ja, aber eine mit hohen Armausschnitten wählen. Schaumstoffwesten sind
        sperriger, benötigen aber keine Wartung.
    - q: Welche PFD ist für ein Kind am besten?
      a: >-
        USCG-zugelassene Schaumstoffweste Typ II oder III mit Kragen,
        Beinriemen und leuchtenden Farben. Für Kinder niemals aufblasbare PFDs
        verwenden.
