- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP-Anker-Leitfaden: In Position bleiben beim Angeln oder Fotografieren'
  description: >-
    Kompletter Leitfaden zum Ankern auf dem SUP — Ankertypen (Pilzanker,
    Faltanker, Festmacherstange), Anker-Trolley-Setup, Einsetztechniken und
    Sicherheitsaspekte für das Halten der Position.
  definition: >-
    Ein SUP-Anker ist ein an einem Seil befestigtes Gewicht, das das Board
    gegen Wind und Strömung in Position hält. Übliche Typen sind Pilzanker,
    Faltanker und Festmacherstangen (Stake-Out-Pfähle).
  tldr: >-
    Verwenden Sie einen Pilzanker (1.5–3 lb) für schlammigen oder sandigen
    Grund, einen Faltanker für felsigen Grund oder eine Festmacherstange für
    flaches Wasser mit weichem Grund. Der Anker sollte bei ruhigen Bedingungen
    1.5–3 lb wiegen, bei Wind und Strömung 3–5 lb. Verwenden Sie immer einen
    Anker-Trolley, um die Position anzupassen, und wissen Sie, wann Sie
    loswerfen müssen.
  problem: >-
    Sie finden den perfekten Angelplatz, aber Wind und Strömung treiben Sie
    alle paar Minuten aus der Position. Ohne Anker wird SUP-Angeln und
    -Fotografie zu einem frustrierenden ständigen Neupositionieren.
  explanation: >-
    Ein Anker funktioniert, indem er über den Grund schleift, bis er sich
    verfängt. Pilzanker graben sich in weiche Böden ein und halten gut in Sand
    und Schlamm. Faltanker haben Flunken, die sich in harten oder felsigen
    Grund eingraben. Festmacherstangen funktionieren in flachem Wasser, indem
    sie direkt in den Grund gedrückt werden.
  solution: >-
    Installieren Sie ein Anker-Trolley-System (eine Leine mit einem
    Schiebe-Ring an einer Seite des Boards), um den Befestigungspunkt des
    Ankers zu verstellen. Befestigen Sie 50–75 Fuß Seil am Anker. Setzen Sie
    den Anker oberhalb Ihrer gewünschten Position gegen Wind oder Strömung.
    Verwenden Sie ein Schnelllösesystem, um sich im Notfall loszumachen. Ankern
    Sie niemals bei starker Strömung oder dort, wo Sie den Anker nicht leicht
    wieder einholen können.
  recommendation: >-
    Ein 3-lb-Faltanker mit 50 Fuß Seil funktioniert für die meisten
    SUP-Angelbedingungen. Ergänzen Sie ein Anker-Trolley-System mit den
    D-Ringen Ihres Paddle Board Overstock SUP Explorer 11.
  faq:
    - q: Welche Ankergröße brauche ich fürs SUP?
      a: >-
        1.5–3 lb für ruhige Seen und langsame Flüsse. 3–5 lb für
        Küstengebiete mit Wind oder Strömung. Überdimensionierte Anker sind
        schwer einzuholen.
    - q: Wie viel Ankerleine brauche ich?
      a: >-
        Ein Verhältnis von 5:1 (5 Fuß Leine pro 1 Fuß Wassertiefe) ist
        Standard. Bei 10 Fuß Wassertiefe verwenden Sie 50 Fuß Leine.
    - q: Ist Ankern auf einem SUP gefährlich?
      a: >-
        Nur wenn Sie bei Strömung oder Wind ankern, der stark genug ist, das
        Board zum Kentern zu bringen. Verwenden Sie immer ein Schnelllösesystem,
        das sofort gelöst werden kann.
    - q: Darf ich überall ankern?
      a: >-
        Prüfen Sie die örtlichen Vorschriften. Einige Gebiete beschränken das
        Ankern zum Schutz von Seegras oder Meereslebensräumen. Ankern Sie
        niemals über Korallenriffen.
