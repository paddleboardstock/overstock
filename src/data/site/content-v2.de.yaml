- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP-Größentabelle: Länge, Breite und Volumen erklärt'
  description: >-
    Finden Sie die richtige SUP-Größe basierend auf Ihrem Gewicht, Ihrem
    Können und Ihrem Paddelstil. Die Länge bestimmt den Spurt, die Breite die
    Stabilität und das Volumen die Tragfähigkeit.
  definition: >-
    Die SUP-Größe wird definiert durch Länge (Geschwindigkeit und Gleitverhalten),
    Breite (primäre Stabilität), Dicke (sekundäre Stabilität und Volumen) sowie
    Volumen in Litern (gesamte Tragfähigkeit).
  tldr: >-
    Allround-SUPs: 10'6"–11'6" x 32"–34" x 6" (220–280 L). Touring: 12'–14' x
    30"–32" (280–350 L). Surf: 8'–10' x 30"–32" (140–220 L). Anfänger
    brauchen eine Breite über 32" und ein Volumen, das das Körpergewicht um
    60–80 L übersteigt. Ihr Gewicht in kg plus 60 L ist das Mindestvolumen
    für Stabilität.
  problem: >-
    Jede SUP-Marke listet Boards in Fuß, Zoll und Litern auf, aber ohne zu
    wissen, wie sich diese Maße auf das reale Fahrgefühl übertragen, riskieren
    Sie ein Board, das kippelig oder langsam ist oder Ihr Gewicht nicht
    tragen kann.
  explanation: >-
    Die Länge bestimmt, wie schnell sich das Board paddelt und wie gut es
    geradeaus läuft. Längere Boards (12'+) gleiten zwischen den Zügen und
    halten die Linie. Kürzere Boards (unter 10') drehen leicht, erfordern aber
    häufigere Paddelwechsel. Die Breite bestimmt die primäre Stabilität – die
    Standstabilität. Ein 30"-Board fühlt sich für Anfänger kippelig an; 34"
    fühlt sich an wie ein Steg. Die Dicke bestimmt das Volumen – ein dickeres
    Board schwimmt höher, fängt aber mehr Wind. Das Volumen in Litern ist die
    beste Einzelmetrik: Das beladene Board (Sie plus Ausrüstung) sollte in
    Ruhelage 2–4 Zoll eintauchen.
  solution: >-
    Passen Sie die Boardmaße an drei Faktoren an: Ihr Gewicht (bestimmt das
    Mindestvolumen), Ihre Hauptaktivität (bestimmt die Länge) und Ihr
    Können (bestimmt die Breite). Für Anfänger: Gewicht in kg mal 2,2 ergibt
    die Mindestliterzahl. Für Fortgeschrittene: mal 1,8. Für Geübte: mal 1,4.
  recommendation: >-
    Der Paddle Board Overstock SUP Explorer 11 mit 11' x 33" x 6" und 260 L passt für die
    meisten Rider bis 100 kg beim Allround-Paddeln. Upgraden Sie auf den SUP
    Tour 12 mit 12' x 31" für bessere Touring-Geschwindigkeit und mehr
    Gleitverhalten.
  faq:
    - q: Welche SUP-Größe brauche ich für mein Gewicht?
      a: >-
        Für Rider unter 70 kg: 10–11' x 32" (220–260 L). Für 70–90 kg: 11–12' x
        33" (260–300 L). Für 90–110 kg: 11–12' x 34" (300–350 L). Für über
        110 kg: 12' x 34–36" (350 L+).
    - q: Ist ein längeres SUP schneller?
      a: >-
        Ja. Längere Boards haben ein besseres Längen-Breiten-Verhältnis und
        reduzieren den Widerstand. Ein 14'-Touring-SUP ist bei gleichem
        Paddelaufwand deutlich schneller als ein 11'-Allround-Board.
    - q: Welche SUP-Breite ist für Anfänger stabil?
      a: >-
        33–34 Zoll ist der Sweet Spot für Anfänger bis 90 kg. Unter 32" ist
        gutes Gleichgewicht nötig. Über 34" ist sehr stabil, aber langsamer und
        bei Wind schwerer zu paddeln.
    - q: Kann ich ein Allround-Board für Touren nutzen?
      a: >-
        Ja, für kurze Touren unter 10 km. Bei längeren Distanzen läuft ein
        spezielles Touring-Board besser geradeaus und legt Strecken
        effizienter zurück.
