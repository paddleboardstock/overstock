- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP-Fitness: Ganzkörpertraining auf dem Paddle Board'
  description: >-
    SUP bietet ein Ganzkörpertraining, das kardiovaskuläre Ausdauer,
    Rumpfstabilität und Kraft kombiniert. So strukturieren Sie
    SUP-Fitnesseinheiten, die besten Übungen und die Messung des Fortschritts.
  definition: >-
    SUP-Fitness nutzt die instabile Plattform eines Paddle Boards, um die
    Rumpfstabilisatoren, die Beinmuskulatur und den Oberkörper durch Paddeln,
    Balancieren und Übungen auf dem Board zu beanspruchen.
  tldr: >-
    SUP verbrennt 400–700 Kalorien pro Stunde. Eine einstündige SUP-Einheit
    beansprucht Rumpf, Beine, Rücken, Schultern und Arme.
    Intervall-Paddeln (Sprints + Erholung) maximiert das Cardiotraining.
    Yoga-Positionen auf dem Board verbessern Balance und Flexibilität. Fügen
    Sie SUP-spezifische Kraftübungen wie Kniebeugen und Ausfallschritte auf dem
    Board hinzu.
  problem: >-
    Das Training im Fitnessstudio ist langweilig geworden und Sie möchten eine
    Outdoor-Aktivität, die fit macht und dabei Spaß bereitet. SUP verbindet
    Abenteuer mit echtem Ganzkörpertraining.
  explanation: >-
    Paddeln beansprucht den Latissimus dorsi, die Deltamuskeln, den
    Trapezmuskel und die Rumpfmuskulatur für die Rotation. Das Stehen auf einer
    beweglichen Plattform zwingt die Stabilisatormuskeln von Knöcheln, Knien
    und Hüften zu ständiger Arbeit. Die kardiovaskuläre Belastung durch
    kontinuierliches Paddeln bei moderater Intensität sorgt für aerobes
    Konditionstraining.
  solution: >-
    Strukturieren Sie Ihre Einheiten: 5 Minuten Aufwärmen durch Paddeln, 20
    Minuten gleichmäßiges Paddeln in moderatem Tempo, 15 Minuten
    Intervall-Paddeln (30 Sekunden Sprint, 60 Sekunden locker), 10 Minuten
    Board-Übungen (Kniebeugen, Ausfallschritte, Liegestütze), 5 Minuten
    Abkühlen mit Dehnübungen.
  recommendation: >-
    Nutzen Sie das Paddle Board Overstock SUP Explorer 11 für Fitness-Paddeln. Die stabile
    Plattform ermöglicht es Ihnen, sich auf Technik und Intensität zu
    konzentrieren. Tragen Sie bei intensiven Einheiten die Life Vest Pro für
    die Sicherheit.
  faq:
    - q: Wie viele Kalorien verbrennt SUP?
      a: >-
        400–700 Kalorien pro Stunde, je nach Intensität, Wind und Strömung.
        Intervall-Paddeln erhöht den Kalorienverbrauch.
    - q: Ist SUP gut zum Abnehmen?
      a: >-
        Ja, in Kombination mit richtiger Ernährung. Die Ganzkörperbeanspruchung
        und die gelenkschonende Art machen es für regelmäßiges Training
        nachhaltig.
    - q: Kann ich auf einem SUP Krafttraining machen?
      a: >-
        Ja — Kniebeugen, Ausfallschritte, Liegestütze und Planks auf dem Board
        ergänzen die Kraftübungen um den Balance-Reiz.
    - q: Welche Muskeln trainiert SUP?
      a: >-
        Primär: Rumpf (schräge Bauchmuskeln, Musculus transversus abdominis),
        Rücken (Latissimus, Trapezmuskel), Schultern (Deltamuskeln), Arme
        (Bizeps, Trizeps). Sekundär: Beine (Quadrizeps, ischiokrurale
        Muskulatur, Waden).
