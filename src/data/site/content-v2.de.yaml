    GBS-Nähte (geklebt und blind genäht) verhindern Wassereintritt, ohne die
    Dehnbarkeit zu opfern.
  problem: >-
    Kaltwasser-Neoprenanzüge sind entweder zu einschränkend, zu teuer oder
    lassen kaltes Wasser den Rücken hinunterlaufen. Sie brauchen einen Anzug,
    der Sie durch eine 90-minütige Winter-Session warm hält, ohne sich beim
    Paddeln wie eine Zwangsjacke anzufühlen.
  explanation: >-
    Die meisten Neoprenanzüge der Mittelklasse bestehen aus erdölbasiertem
    Neopren, das steif ist und in kaltem Wasser an Flexibilität verliert. Der
