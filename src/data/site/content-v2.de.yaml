- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Größentabelle für Paddle Boards: Volumen, Länge und Breite für jeden Rider'
  description: >-
    Vollständige Größenberatung für Paddle Boards mit Volumen-Empfehlungen nach Gewicht
    und Aktivität. Inklusive leicht verständlicher Größentabelle für Allround-,
    Touring-, Surf- und Yoga-SUP-Boards.
  definition: >-
    Die Paddle-Board-Größe wird bestimmt durch das Volumen (Tragfähigkeit und
    Auftrieb), die Länge (Geschwindigkeit und Spurtreue), die Breite (Stabilität) und
    die Dicke (Volumenverteilung und Windwiderstand).
  tldr: >-
    Verwende dein Gewicht, um das Mindestvolumen zu ermitteln: 50–70 kg benötigt
    220–260 l, 70–90 kg 260–300 l, 90–110 kg 300–350 l, 110+ kg 350+ l. Für Einsteiger
    addiere 20 % auf diese Werte. Die Breite zählt: 32" ist fortgeschritten,
    33–34" ist einsteigerfreundlich, 35"+ ist sehr stabil.
  problem: >-
    Größenangaben für Paddle Boards verwenden Fuß, Zoll und Liter durcheinander,
    wodurch ein Vergleich zwischen den Marken erschwert wird.
  explanation: >-
    Das Volumen ist die direkteste Kennzahl für die Tragfähigkeit – 1 Liter Süßwasser
    verdrängt 1 kg Gewicht. Ein Board mit 260 l kann theoretisch 260 kg tragen, doch
    die praktische Kapazität ist geringer, weil das Board über dem Wasser liegen muss.
    Dein Gesamtgewicht (Körper plus Ausrüstung) sollte 30–40 % des Board-Volumens
    betragen.
  solution: >-
    Zielvolumen = (Körpergewicht in kg + Ausrüstungsgewicht in kg) x 3. Bei einem
    75-kg-Paddler mit 5 kg Ausrüstung ergibt sich Ziel = 80 x 3 = mindestens 240 l.
    Für Einsteiger multipliziere mit 3,5. Für Fortgeschrittene mit 2,5.
  recommendation: >-
    Das Paddle Board Overstock SUP Explorer 11 (260 l, 11' x 33" x 6") passt für die meisten Rider
    zwischen 50 und 100 kg. Leichtere Rider können auf das AirDeck 270 ausweichen.
    Schwerere Rider sollten sich das SUP Tour 12 (300 l+) oder breitere Boards ansehen.
  faq:
    - q: Ist die Körpergröße für die SUP-Größenwahl wichtig?
      a: >-
        Die Größe ist weniger wichtig als das Gewicht. Ein großer, leichter Rider
        braucht weniger Volumen als ein kleiner, schwerer Rider. Nutze dein Gewicht als
        wichtigsten Faktor für das Volumen.
    - q: Was passiert bei zu viel Volumen?
      a: >-
        Das Board liegt zu hoch und fängt den Wind wie ein Segel. Im Seegang fühlt es
        sich korkig an. Für Einsteiger ist jedoch mehr Volumen besser als zu wenig.
    - q: Was passiert bei zu wenig Volumen?
      a: >-
        Das Board liegt zu tief und erzeugt Widerstand. Beim Paddeln kann die Spitze
        eintauchen (Perlen). Du ermüdest schnell vom Paddeln eines teilweise
        untergetauchten Boards.
    - q: Brauchen aufblasbare Boards eine andere Größenwahl als Hartschalen-Boards?
      a: >-
        Nicht wesentlich. Aufblasbare Boards verdrängen bei 15+ PSI Wasser ähnlich wie
        Hartschalen-Boards. Die Volumen-Empfehlungen gelten für beide Typen gleichermaßen.
