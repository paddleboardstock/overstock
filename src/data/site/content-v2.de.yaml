- slug: sup-navigation-guide
  category: guide
  type: safety
  title: 'SUP-Navigation: Kurs halten und den Weg finden'
  description: >-
    Grundlegende Navigationsfähigkeiten für SUP-Paddler — Karten lesen, Landmarken
    nutzen, Bojensysteme verstehen und GPS sowie Kompass für sicheres Paddeln
    einsetzen.
  definition: >-
    SUP-Navigation umfasst den Einsatz von Landmarken, Karten, GPS sowie das
    Bewusstsein für Wind und Strömung, um sicher zu paddeln und zum Ausgangspunkt
    zurückzukehren.
  tldr: >-
    Wähle beim Geradeauspaddeln immer eine Landmarke am Horizont. Prüfe sie alle
    paar Minuten, um die Drift zu korrigieren. Nutze GPS-Apps auf deinem Telefon in
    wasserdichter Hülle. Lerne die grundlegende Kompassnavigation. Verstehe seitliche
    Bojensysteme (Rot beim Einlaufen an Steuerbord). Hinterlege bei jemandem an
    Land einen Fahrtplan (Float Plan).
  problem: >-
    Du paddlest auf offenem Wasser hinaus, und als du dich umdrehst, sieht die
    Küstenlinie völlig anders aus. Ohne Navigationsfähigkeiten kannst du
    desorientiert werden und in die falsche Richtung paddeln.
  explanation: >-
    Die Navigation auf dem SUP stützt sich auf visuelle Referenzen, weil du nah am
    Wasser bist. Wähle eine markante Landmarke (Gebäude, Baum, Klippe) hinter deinem
    Startpunkt. Nutze sie als Rückpeilung für die Rückkehr. Wind und Strömung
    drücken dich vom Kurs ab — korrigiere fortlaufend. Für längere Touren nutze eine
    GPS-App oder eine GPS-Uhr. Verstehe: Die Küstenlinie sieht vom Wasser anders
    aus als vom Land aus.
  solution: >-
    Vor dem Start: Identifiziere 2–3 Landmarken in unterschiedlichen Entfernungen
    hinter deinem Startpunkt. Nutze eine GPS-App (Google Maps, Gaia GPS) im
    Flugmodus, um Akku zu sparen. Kenne die Wind- und Gezeitenrichtung — paddle
    zuerst gegen Wind und Strömung. Für Überfahrten im offenen Wasser verwende einen
    Kompasskurs.
  recommendation: >-
    Bewahre ein Telefon in wasserdichter Hülle als GPS-Backup auf. Übe die
    Landmarkennavigation in vertrauten Gewässern, bevor du neue Orte erkundest. Die
    Life Vest Pro hat eine Tasche, die für ein Telefon geeignet ist.
  faq:
    - q: Welche Landmarken eignen sich am besten für die SUP-Navigation?
      a: >-
        Markante, dauerhafte Merkmale wie Wassertürme, hohe Gebäude,
        außergewöhnliche Bäume oder markante Klippen. Vermeide Boote oder Fahnen,
        die sich bewegen.
    - q: Wie navigiere ich bei Nebel?
      a: >-
        Paddle bei Nebel nicht hinaus. Wirst du von Nebel überrascht, navigiere
        mit GPS oder Kompass. Blase alle 30 Sekunden in die Signalpfeife. Bleibe
        in Ufernähe.
    - q: Brauche ich für SUP eine Seekarte?
      a: >-
        Für das Paddeln an der Küste hilft eine einfache Karte, Gefahrenstellen,
        Wassertiefen und Fahrwasser zu erkennen. Viele Apps liefern diese
        Informationen.
    - q: Wie navigiere ich um Boote herum?
      a: >-
        Bleibe in flachem Wasser abseits der Fahrrinnen. Trage helle Farben.
        Überquere Fahrrinnen zügig im 90-Grad-Winkel. Stelle Blickkontakt mit den
        Bootsführern her.
