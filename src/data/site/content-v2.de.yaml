- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: 3mm vs. 5mm Neoprenanzug (Was im Kaltswasser-Surfen wirklich funktioniert)
  description: >-
    Die Entscheidung 3mm vs. 5mm hängt von der Wassertemperatur ab, nicht von
    der Lufttemperatur. Temperaturtabelle, Flexibilitätsvergleich und welche
    Stärke dich warm hält, ohne dein Paddeln einzuschränken.
  definition: >-
    Ein 3mm Anzug passt zu Wasser von 14–20°C mit guter Flexibilität. Ein 5mm
    Anzug deckt 8–14°C mit maximaler Wärme, aber reduzierter Beweglichkeit ab.
    Die Wahl ist ein direkter Kompromiss zwischen Wärme und
    Bewegungsfreiheit.
  tldr: >-
    3mm Anzüge sind für Wasser von 14–20°C und bieten maximale
    Flexibilität. 5mm Anzüge sind für 8–14°C gedacht und priorisieren Wärme.
    Entscheide anhand deiner lokalen Wassertemperatur, nicht der
    Lufttemperatur. Wenn du über die Saisons hinweg surfst, besitze beide.
    Wenn du nur einen kaufen kannst, bietet ein 4/3mm den besten Mittelweg.
  problem: >-
    Du brauchst einen Neoprenanzug, kannst dich aber nicht zwischen 3mm und
    5mm entscheiden. Ein 3mm könnte im Winter nicht warm genug sein, ein 5mm
    zu dick und einengend für wärmere Tage. Falsch geraten heißt: entweder den
    Winter durchfrieren oder den Herbst durchschwitzen.
  explanation: >-
    Die Neoprenstärke korreliert direkt mit der Wärme und umgekehrt mit der
    Flexibilität. Ein 3mm Anzug (oft 3/2mm mit dünneren Armen) bietet gute
    Beweglichkeit für Paddeln und Surfen bei milden Bedingungen. Ein 5mm Anzug
    verwendet dickeres Neopren am Rumpf und oft dünnere Panels an Armen und
    Beinen (5/4/3mm), um etwas Flexibilität zu erhalten. Der
    Wärmeunterschied beträgt etwa 6–8°C Bereich. Wichtige Unterschiede: 5mm
    Anzüge brauchen mehr Neoprenmaterial, wiegen etwa 40 Prozent mehr, brauchen
    länger zum Trocknen und sind schwerer auszuziehen. Moderne
    Super-Stretch-Neoprene schließen die Flexibilitätslücke, aber 5mm
    schränkt die Bewegung weiterhin spürbar ein.
  solution: >-
    Ermittle deine kälteste monatliche Durchschnittswassertemperatur anhand
    lokaler Bojendaten. Liegt sie über 16°C, kaufe einen 3/2mm. Liegt sie
    zwischen 12–16°C, kaufe einen 4/3mm. Liegt sie unter 12°C, kaufe einen
    5/4/3mm. Für ganzjähriges Surfen mit einem einzigen Anzug deckt ein
    qualitativ hochwertiger 4/3mm mit Thermo-Futter plus separater Haube,
    Boots und Handschuhen den breitesten Bereich ab.
  recommendation: >-
    Der Paddle Board Overstock Wetsuit Pro in 5/4/3mm bewältigt 8–16°C mit Thermo-Futter,
    das die Wärmelücke eines echten 5mm ausgleicht. Wenn du meist bei milden
    Bedingungen (16–20°C) surfst, bietet der 3/2mm Paddle Board Overstock Wetsuit Pro
    bessere Flexibilität und Komfort.
  faq:
    - q: Kann ich einen 3mm in 10°C warmem Wasser tragen?
      a: >-
        Nur für sehr kurze Sessions (20–30 Minuten) und mit einem
        Thermo-Rash-Guard darunter. Du wirst den Großteil der Session frieren.
        Für 10°C warmes Wasser wird ein 5mm oder 5/4/3mm dringend empfohlen.
    - q: Ist ein 5mm Anzug im Sommer zu warm?
      a: >-
        Wenn die Wassertemperatur im Sommer 18°C überschreitet, führt ein 5mm
        Anzug zu Überhitzung. Du kannst den Anzug mit kühlem Wasser ausspülen,
        aber in den Sommermonaten bist du in einem 3/2mm oder Shorty
        komfortabler.
    - q: Schränkt ein 5mm Anzug das Paddeln ein?
      a: >-
        Ja, spürbar. Das dickere Neopren an den Schultern erfordert mehr
        Kraft pro Paddelschlag. Ein 5/4/3mm Anzug mit dünneren Armen hilft,
        aber du wirst trotzdem schneller ermüden als in einem 3mm Anzug.
    - q: Welcher Anzug ist der beste für ganzjähriges Surfen?
      a: >-
        Ein 4/3mm Ganzkörperanzug mit Front-Reißverschluss und Thermo-Futter
        deckt 12–18°C ab – das ist in vielen gemäßigten Klimazonen ganzjährig
        tragbar. Mit Boots für den Winter surfst du mit einem Anzug im Bereich
        10–18°C.
