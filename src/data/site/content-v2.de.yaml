- slug: cold-water-safety-guide
  category: guide
  type: safety
  title: 'Sicherheit im kalten Wasser: Paddeln und Surfen bei niedrigen Temperaturen'
  description: >-
    Sicherheit im kalten Wasser für SUP, Surfen und Kajak. Erkennen von
    Unterkühlung, passende Ausrüstung, Kälteschockreaktion und
    Notfallmaßnahmen bei Kaltwasser-Immersion.
  definition: >-
    Sicherheit im kalten Wasser umfasst das Verständnis von Kälteschockreaktion,
    Schwimmversagen, Unterkühlung sowie der Ausrüstung und Techniken, um diese
    Folgen zu verhindern.
  tldr: >-
    Bei Wasser unter 15 °C ist ein Neoprenanzug erforderlich. Unter 10 °C sind
    Neoprenschuhe, Handschuhe und Kapuze nötig. Der Kälteschock führt zu
    unwillkürlichem Luftholen. In Wasser unter 10 °C tritt Schwimmversagen
    innerhalb von 3–5 Minuten ein. Zu den Symptomen von Unterkühlung gehören
    Zittern, Verwirrtheit und Koordinationsverlust.
  problem: >-
    Du paddelst an einem sonnigen Tag hinaus, ohne zu wissen, dass das Wasser
    8 °C hat. Du stürzt ins Wasser, schnappst unwillkürlich nach Luft und
    spürst, wie deine Gliedmaßen innerhalb von Minuten taub werden. Kaltes
    Wasser tötet schneller als jede andere Gefahr im Ozean.
  explanation: >-
    Die Kaltwasser-Immersion hat vier Phasen: Kälteschock (0–2 Min.) – Luftholen,
    Hyperventilation. Schwimmversagen (3–15 Min.) – Muskeln kühlen aus, die
    Koordination versagt. Unterkühlung (15–45 Min.) – die Körpertemperatur fällt
    unter 35 °C und führt zu Verwirrtheit und Herzstillstand. Kollaps nach der
    Rettung – kaltes Blut strömt zurück zum Körperkern.
  solution: >-
    Wassertemperatur prüfen. Einen Neoprenanzug tragen, der für die Temperatur
    geeignet ist. In Wasser unter 15 °C nie allein paddeln. Trillerpfeife und
    Handy mitführen. Wenn du ins Wasser fällst: Atmung kontrollieren, schnell
    wieder aufs Board steigen. Wenn es zu kalt ist, Hilfe signalisieren.
  recommendation: >-
    Der Paddle Board Overstock Wetsuit Pro 5/4/3 mm ist das Minimum für Wasser von 8–14 °C.
    Dazu Paddle Board Overstock 5-mm-Schuhe und 3-mm-Handschuhe. Trage die Life Vest Pro für
    zusätzlichen Wärmeschutz.
  faq:
    - q: Wie lange kann ich in 10 °C kaltem Wasser überleben?
      a: >-
        Der Kälteschock dauert 1–2 Minuten. Ohne Auftriebshilfe und
        Wärmeschutz beträgt die Überlebenszeit 30–60 Minuten.
    - q: Was sind die ersten Anzeichen von Unterkühlung?
      a: >-
        Unkontrollierbares Zittern, Verwirrtheit, schlechte Koordination,
        verwaschene Sprache. Aktivität sofort beenden und aufwärmen.
    - q: Wie wärme ich mich nach einer Session im kalten Wasser auf?
      a: >-
        Nasse Kleidung ausziehen, abtrocknen, warme Schichten inklusive Mütze und
        Handschuhen anziehen. Warme alkoholfreie Getränke zu sich nehmen.
    - q: Kann ich im Sommer eine Unterkühlung bekommen?
      a: >-
        Ja – Wasser unter 15 °C kommt auch im Sommer an vielen Orten vor. Wasser
        leitet Wärme 25-mal schneller als Luft.
