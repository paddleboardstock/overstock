- slug: sup-launch-techniques
  category: guide
  type: tutorial
  title: 'SUP-Starttechniken: So beginnst du deine Paddel-Session richtig'
  description: >-
    Richtige SUP-Starttechniken für verschiedene Uferarten — Sandstrände, felsige
    Ufer, Stege und Flussufer. Vermeide den unsicheren Stieg und starte jede Session
    mühelos.
  definition: >-
    Die SUP-Starttechnik ist die Methode des Übergangs vom Ufer ins Wasser, während
    Gleichgewicht und Boardkontrolle erhalten bleiben. Verschiedene Uferarten
    erfordern unterschiedliche Vorgehensweisen.
  tldr: >-
    Sandstrand: Lege das Board an die Wasserkante, steige auf und paddle los.
    Felsiges Ufer: Schiebe das Board durch das flache Wasser, bevor du aufsteigst.
    Steg: Setze dich vom Steg aus auf das Board und stoße dich mit dem Paddel ab.
    Flussufer: Starte schräg flussabwärts. Befestige die Leash immer, bevor du
    ins Wasser gehst.
  problem: >-
    Du pumpst dein Board auf und gehst zur Wasserkante — und merkst dann, dass du
    keine Ahnung hast, wie du aufsteigen sollst, ohne unsicher zu wirken oder sofort
    ins Wasser zu fallen.
  explanation: >-
    Die Starttechnik variiert je nach Uferart. An Sandstränden ist der einfachste
    Weg, das Board parallel zum Ufer im knöcheltiefen Wasser zu positionieren,
    aufzusteigen und gerade loszupaddeln. An felsigen Ufern musst du das Board ins
    knietiefe Wasser schieben, bevor du aufsteigst, um Schäden am Board zu
    vermeiden. An Stegen setzt du dich vom Steg aus auf das Board und stößt dich
    dann ab.
  solution: >-
    Sand-Start: Lege das Board senkrecht zum Ufer, steige mit einem Fuß auf, stoße
    dich mit dem anderen ab, knie nieder und stehe dann auf. Fels-Start: Trage das
    Board ins knietiefe Wasser und steige von hinten auf. Steg-Start: Lege das
    Board parallel zum Steg, setze dich vom Steg aus auf das Board und stoße dich
    sanft ab.
  recommendation: >-
    Übe Starts zunächst unter ruhigen Bedingungen. Die breite Plattform des
    Paddle Board Overstock SUP Explorer 11 erleichtert den Start. Befestige die Leash immer,
    bevor du auf das Board steigst.
  faq:
    - q: Wie starte ich bei Brandung?
      a: >-
        Warte auf eine Pause zwischen den Wellensätzen. Lege das Board ins
        knöcheltiefe Wasser, springe zügig auf und paddle kräftig, um die
        Brandungszone vor dem nächsten Wellensatz zu durchqueren.
    - q: Kann ich an jedem Strand starten?
      a: >-
        Prüfe Zugangspunkte und örtliche Vorschriften. Manche Strände haben
        ausgewiesene Startzonen. Vermeide Startbereiche mit Schwimmern.
    - q: Wie lande ich?
      a: >-
        Nähere dich senkrecht zum Ufer. Steige ins flache Wasser ab, sobald die
        Finnen den Grund berühren. Trage das Board oberhalb der Wasserlinie an Land.
    - q: Was, wenn die Brandung stark ist?
      a: >-
        Time deinen Start zwischen den Wellen. Halte das Board seitlich fest gegen
        die Wellen. Ist die Brandung zu stark, suche einen anderen Startpunkt.
