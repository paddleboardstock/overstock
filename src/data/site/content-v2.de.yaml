- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Was man zum Surfen anzieht (Kommen Sie nicht in Boardshorts, wenn Sie einen 5/4 brauchen)
  description: >-
    Hören Sie auf zu raten, was Sie anziehen sollen. Die Wassertemperatur,
    nicht die Lufttemperatur, bestimmt Ihre Surfkleidung. Komplette
    Schicht-Anleitung von tropischen Rashguards bis zu vollen
    Winter-Setups mit 5/4/3mm.
  definition: >-
    Surfkleidung reicht von Boardshorts und Rashguards im warmen Wasser bis
    zu vollen 5/4/3mm-Neoprenanzügen mit Boots und Kapuze im kalten Wasser.
    Die Wassertemperatur, nicht die Lufttemperatur, bestimmt, was Sie
    brauchen.
  tldr: >-
    Was Sie beim Surfen tragen, hängt ausschließlich von der
    Wassertemperatur ab – nicht von der Lufttemperatur. Rashguards und
    Boardshorts funktionieren über 22°C, Springsuit-Anzüge decken 18-22°C
    ab, volle 3/2mm-Anzüge bewältigen 14-18°C, und unter 14°C ist 5/4/3mm
    mit Boots erforderlich. Tragen Sie immer UV-Schutz und ziehen Sie eine
    Leash und eine Impact-Weste in Betracht.
  problem: >-
    Sie kommen am Strand an und haben keine Ahnung, ob ein Rashguard reicht
    oder ob Sie einen vollen Neoprenanzug brauchen. Die Lufttemperatur ist
    warm, aber das Wasser ist kalt, oder das Wasser fühlt sich okay an,
    aber der Wind ist eisig. Falsche Kleidung bedeutet eine ruinierte
    Session.
  explanation: >-
    Surfkleidung erfüllt drei Zwecke: Wärmeisolierung, UV-Schutz und
    Scheuer-Schutz. Neoprenanzüge werden nach Dicke und Abdeckung bewertet –
    Springsuit-Anzüge (kurze Arme oder Beine) sind für
    Übergangstage gedacht, volle Anzüge für kaltes Wasser. Rashguards
    schützen vor Boardrash und Sonne, bieten aber keinen Wärmewert. Boots,
    Handschuhe und Kapuzen sind kein Zubehör, sondern unverzichtbare
    Ausrüstung für Kaltwasser-Surfen unter 12°C.
  solution: >-
    Prüfen Sie vor dem Losfahren die lokale Boje oder den Live-Bericht zur
    Wassertemperatur. Bauen Sie sich ein Set basierend auf Ihrer kältesten
    typischen Bedingung auf: Rashguard und Shorts für den Sommer, ein
    3/2mm-Ganzanzug für Frühjahr und Herbst, ein 5/4/3mm mit Boots und
    Kapuze für den Winter. Fügen Sie immer eine Leash hinzu und erwägen
    Sie für die Sicherheit eine Auftriebsweste.
  recommendation: >-
    Investieren Sie zuerst in einen guten 3/2mm-Ganzanzug – er deckt den
    breitesten Bedingungsbereich ab. Fügen Sie einen 5/4/3mm-Anzug und
    Boots hinzu, wenn Sie den Winter durchsurfen möchten. Der Paddle Board Overstock
    Wetsuit Pro mit Thermo-Innenfutter überbrückt beide Temperaturbereiche
    effektiv.
  faq:
    - q: Kann ich nur in Boardshorts surfen?
      a: >-
        Ja, in tropischem Wasser über 24°C. Ein Rashguard kann sinnvoll
        sein, um Scheuerstellen an Brust und Armen durch das Paddeln zu
        vermeiden. Wachs oder eine Traktionsauflage auf dem Board hilft,
        das fehlende Grip des Anzugs auszugleichen.
    - q: Brauche ich Surf-Boots?
      a: >-
        Wenn die Wassertemperatur unter 14°C fällt, verhindern Boots
        Taubheitsgefühle und schützen Ihre Füße vor Felsen und
        Riff-Schnittwunden. Sie bieten außerdem besseren Halt auf dem
        Board. Die meisten Surfer in nördlichen Klimazonen tragen Boots
        von November bis März.
    - q: Was ist ein Springsuit?
      a: >-
        Ein Springsuit ist ein Neoprenanzug mit kurzen Armen oder kurzen
        Beinen (oder beidem), der für Wassertemperaturen zwischen 18°C und
        22°C konzipiert ist. Er bietet mehr Wärme als ein Rashguard, aber
        weniger Abdeckung als ein Ganzanzug.
    - q: Sollte ich beim Surfen eine Schwimmweste tragen?
      a: >-
        Keine traditionellen Schwimmwesten, aber eine Impact-Weste oder
        ein Auftriebshilfe kann bei rauen Bedingungen oder als schwacher
        Schwimmer helfen. Paddle Board Overstock Schwimmwesten sind für SUP und
        Kajakfahren konzipiert, können aber Anfängern im Surfen zusätzliches
        Auftriebsvertrauen geben.
