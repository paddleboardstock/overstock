- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Windverhältnisse beim SUP: Wie Wind dein Paddeln beeinflusst'
  description: >-
    Wie Windgeschwindigkeit und -richtung das SUP-Paddeln beeinflussen.
    Auflandigen vs. ablandigen Wind verstehen, Windvorhersagen lesen,
    Paddeltechniken bei Wind und wissen, wann man an Land bleiben sollte.
  definition: >-
    Die Windverhältnisse bestimmen die SUP-Sicherheit. Ablandiger Wind (vom Land
    zum Meer) treibt dich weg. Auflandiger Wind (vom Meer zum Land) treibt dich
    Richtung Ufer. Seitenwind versetzt das Board in Gieren.
  tldr: >-
    Maximale sichere Windgeschwindigkeit für Anfänger: 10 Knoten.
    Fortgeschrittene: 15 Knoten. Profis: 20 Knoten. Ablandiger Wind ist am
    gefährlichsten. Zuerst gegen den Wind paddeln. Bei Seitenwind etwas oberhalb
    des Ziels gegen den Wind paddeln. Bei starkem Wind kniend paddeln, um die
    Angriffsfläche zu verkleinern.
  problem: >-
    Du paddelst bei ruhigen Bedingungen hinaus, doch 30 Minuten später hat der
    Wind aufgefrischt und du kämpfst um die Rückkehr. Wind ist der am meisten
    unterschätzte SUP-Sicherheitsfaktor.
  explanation: >-
    Wind beeinflusst SUP stärker als jedes andere Paddle-Board, weil du stehst
    und so einen Segel-Effekt erzeugst. Ein 10-Knoten-Wind erzeugt bei einem
    stehenden Paddler viel mehr Luftwiderstand als bei einem sitzenden
    Kajakfahrer. Ablandiger Wind treibt dich von der Sicherheit weg. Seitenwind
    lässt das Bug gieren.
  solution: >-
    Vor dem Paddeln Windgeschwindigkeit und -richtung prüfen. Die Beaufortskala
    verwenden: Windstärke 3 (7–10 Knoten) für Anfänger, Windstärke 4 (11–16)
    für Fortgeschrittene. Zuerst gegen den Wind paddeln. Wenn du in ablandigen
    Wind gerätst, in einem 45-Grad-Winkel zum Wind paddeln. Bei starkem Wind
    knien.
  recommendation: >-
    Vor jeder Session eine Windvorhersage-App (Windy, Windfinder) nutzen. Die
    Paddle Board Overstock SUP Tour 12 fährt bei Wind besser geradeaus als breitere Boards.
    Bei windigen Bedingungen kürzere Paddelschläge und höhere Frequenz
    verwenden.
  faq:
    - q: Welche Windrichtung ist für SUP am sichersten?
      a: >-
        Auflandiger Wind (zum Land hin) ist am sichersten – er treibt dich
        zurück. Ablandiger Wind ist am gefährlichsten.
    - q: Wie paddle ich bei Seitenwind?
      a: >-
        Mehr auf der Luvseite paddeln, um das Abtreiben auszugleichen. Das Board
        etwas oberhalb des Ziels ausrichten. Eine tiefere Mittelfinne hilft.
    - q: Kann ich bei 20 Knoten Wind paddeln?
      a: >-
        Nur mit Erfahrung in geschützten Gewässern. Anfänger sollten nicht bei
        mehr als 10 Knoten paddeln.
    - q: Wie wirken sich Windböen auf SUP aus?
      a: >-
        Böen führen zu plötzlichen Gleichgewichtsproblemen. Bei böigen
        Bedingungen tiefer in die Knie gehen und auf plötzliche
        Richtungswechsel gefasst sein.
