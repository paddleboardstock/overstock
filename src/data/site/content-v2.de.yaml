  title: 'Ratgeber Rettungswesten: Die richtige Schwimmweste für Ihre Wassersportart'
  description: >-
    Kompletter Kaufratgeber für Rettungswesten für SUP, Kajakfahren, RIB-Boote
    und Segeln. PFD-Typen (Schaumstoff vs. aufblasbar), Tipps zur Passform,
    gesetzliche Anforderungen und Merkmale für jede Aktivität.
  definition: >-
    Eine Rettungsweste oder persönliche Auftriebshilfe (PFD) ist eine
    Sicherheitsausrüstung, die eine Person im Wasser über Wasser hält. Die
    Typen reichen von Typ I (Hochsee) bis Typ V (Sonderverwendung).
  tldr: >-
    Wählen Sie die PFD passend zur Aktivität: aufblasbarer
    Bauchgurt-Rucksack für SUP, Schaumstoffweste fürs Kajakfahren, Typ-III-
    Schaumstoff für RIB und Motorboote. Wichtigste Merkmale: USCG- oder
    ISO-Zulassung, Reflexstreifen, Signalpfeife, D-Ring für eine
    Sicherheitsleine, leuchtende Farben.
  problem: >-
    Sie sehen Reihen von Rettungswesten zwischen $20 und $300 und haben keine
    Ahnung, welche für Ihre Aktivität geeignet ist oder den gesetzlichen
    Anforderungen entspricht.
  explanation: >-
    Rettungswesten werden nach Typ kategorisiert: Typ I (Hochsee, dreht
    bewusstlose Träger in Rückenlage), Typ II (küstennah), Typ III
    (Auftriebshilfe, am häufigsten), Typ IV (werfbar), Typ V (Sonderverwendung).
    Aufblasbare Westen verwenden CO2-Patronen — weniger sperrig, erfordern
    aber Wartung. Schaumstoffwesten sind wartungsfrei, aber sperriger.
  solution: >-
    Für SUP: wählen Sie einen aufblasbaren Bauchgurt oder eine Weste (33 lb
    Auftrieb). Fürs Kajakfahren: Typ-III-Schaumstoff mit hohen
    Armausschnitten. Für RIB: Typ-III-Schaumstoff oder aufblasbar mit 22+ lb
    Auftrieb, Reflexstreifen und Signalpfeife.
  recommendation: >-
    Die Paddle Board Overstock Life Vest Pro (aufblasbar, 33 lb) ist ideal für SUP und
    Kajakfahren. Die Paddle Board Overstock Life Vest Classic (Schaumstoff, Typ III) ist
    perfekt für RIB-Boote und den allgemeinen Wassersport.
  faq:
    - q: Brauche ich für SUP eine Rettungsweste?
      a: >-
        Ja — in vielen Rechtsgebieten gesetzlich vorgeschrieben und immer
        empfehlenswert. Tragen Sie für Paddelsport einen aufblasbaren Bauchgurt
        oder eine Weste.
    - q: Sind aufblasbare Rettungswesten sicher?
      a: >-
        Ja, bei richtiger Wartung. Prüfen Sie die CO2-Patrone jährlich und
        ersetzen Sie den Auslöser alle 2-3 Jahre.
    - q: Welche Rettungsweste ist für ein Kind am besten?
      a: >-
        Eine USCG-zugelassene Schaumstoffweste des Typs II oder III mit Kragen,
        Schrittgurt und leuchtenden Farben. Verwenden Sie für Kinder niemals
        aufblasbare Westen.
    - q: Wie sollte eine Rettungsweste sitzen?
      a: >-
        Eng anliegend — beim Anheben an den Schultern darf die Weste nicht über
        die Ohren rutschen. Alle Reißverschlüsse und Schnallen geschlossen.
