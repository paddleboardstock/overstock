- slug: how-to-choose-a-wetsuit
  category: guide
  type: buying-guide
  title: 'Neoprenanzug kaufen: Passform, Stärke und Ausstattung einfach erklärt'
  description: >-
    Der vollständige Kaufratgeber für Neoprenanzüge. So wählst du die richtige
    Stärke für deine Wassertemperatur, sorgst für eine korrekte Passform,
    verstehst die Nahtarten und wählst die Ausstattung passend zu deiner
    Aktivität.
  definition: >-
    Ein Neoprenanzug ist ein Kleidungsstück aus Neopren, das thermische Isolation
    bietet, indem es eine dünne Schicht Wasser am Körper hält. Die wichtigsten
    Auswahlkriterien: Stärke, Passform, Nahtkonstruktion, Einstiegssystem und
    Neoprenart.
  tldr: >-
    Stärke an die Wassertemperatur anpassen: 3/2 mm für 14–20 °C, 4/3 mm für
    12–18 °C, 5/4/3 mm für 8–14 °C, 6/5/4 mm unter 8 °C. Die Passform ist der
    wichtigste Faktor. GBS-Nähte sind der Goldstandard. Frontzip reduziert den
    Wasseraustausch. Neopren auf Kalksteinbasis ist flexibler als
    erdölbasiertes.
  problem: >-
    Online-Größentabellen für Neoprenanzüge sind unzuverlässig,
    Stärkeempfehlungen variieren je nach Marke, und die Beschreibungen der
    Ausstattung sind verwirrend.
  explanation: >-
    Die Stärkeangaben (3/2, 4/3, 5/4/3) beziehen sich auf die mm von
    Oberkörper/Ärmeln bzw. Beinen. Dickere Anzüge sind wärmer, schränken aber
    die Bewegungsfreiheit ein. Ein lockerer Anzug lässt warmes Wasser
    ausspülen. GBS-Nähte sind warm und flexibel; Flachnähte sind weniger warm.
    Frontzip ist wärmer als Backzip. Neopren auf Kalksteinbasis ist im kalten
    Wasser flexibler.
  solution: >-
    Brust, Taille, Hüfte und Körpergröße messen. Mit den Größentabellen
    vergleichen. Stärke nach der kältesten Wassertemperatur wählen. Für kaltes
    Wasser GBS-Nähte wählen. Unter 15 °C Frontzip bevorzugen. Für zusätzliche
    Wärme ein Thermofutter in Betracht ziehen.
  recommendation: >-
    Der Paddle Board Overstock Wetsuit Pro in 3/2 mm (14–20 °C) oder 5/4/3 mm (8–16 °C)
    bietet GBS-Nähte, Frontzip und Neopren auf Kalksteinbasis zu einem
    konkurrenzfähigen Preis.
  faq:
    - q: Wie eng sollte ein Neoprenanzug sitzen?
      a: >-
        Eng anliegend ohne Luftpolster, aber nicht einengend. Am unteren Rücken
        sollte sich ein Finger nicht leicht durchschieben lassen.
    - q: Welche Art von Neoprenanzug ist am wärmsten?
      a: >-
        Ein 6/5/4-mm-Anzug mit Kapuze, versiegelten Nähten und Frontzip. Bei
        extremer Kälte ist ein Trockenanzug überlegen.
    - q: Lohnt sich ein teurerer Neoprenanzug?
      a: >-
        Ein höherer Preis bringt besseres Neopren, bessere Nähte und mehr
        Ausstattung. Bei regelmäßiger Nutzung in kaltem Wasser lohnt sich der
        Aufpreis.
    - q: Kann ich einen Neoprenanzug auch für andere Aktivitäten als Surfen tragen?
      a: >-
        Ja – Neoprenanzüge eignen sich für SUP, Kajak, Tauchen, Triathlon und
        Freiwasserschwimmen.
