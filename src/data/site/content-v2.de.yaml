- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Reparatur aufblasbarer SUPs: Stiche, Lecks und Ventilprobleme beheben'
  description: >-
    Anleitung zur eigenen Reparatur aufblasbarer SUPs. So findest du ein langsames
    Leck, flickst einen Stich, tauschst ein Ventil aus und behebst die Delamination
    der Deckmatte mit dem mitgelieferten Reparaturset.
  definition: >-
    Die Reparatur aufblasbarer SUPs umfasst das Auffinden von Lecks per Seifenwasser-
    Test, das Reinigen und Aufrauen der beschädigten Stelle, das Auftragen von
    PVC-Kleber und Flicken sowie das Aushärten unter Druck.
  tldr: >-
    Finde Lecks mit Seifenwasser. Reinige und raue die Stelle um den Stich mit
    Schleifpapier auf. Trage PVC-Kleber sowohl auf den Flicken als auch auf das Board
    auf, warte 5 Minuten, drücke fest an und lass 24 Stunden lang unter Gewicht aushärten.
    Bei Ventillecks prüfst du zuerst den O-Ring. Kleine Stiche unter 1/4" lassen sich
    leicht selbst beheben.
  problem: >-
    Du pumst dein SUP auf und am Morgen hat es Druck verloren. Ohne Reparaturwissen
    droht ein teurer Ersatz für etwas, das wahrscheinlich ein einfacher Stich ist.
  explanation: >-
    Die meisten aufblasbaren SUPs nutzen einen Drop-Stitch-Kern mit äußeren PVC-Lagen.
    Ein Stich durch das äußere PVC erzeugt ein langsames Leck. Standardreparatur:
    reinigen, schleifen, PVC-kompatiblen Kleber auftragen, Flicken unter Gewicht
    andrücken. Ventillecks sind häufiger als Stiche an der Hülle – der O-Ring trocknet
    aus oder Schmutz verhindert die Abdichtung.
  solution: >-
    Pumpe das Board auf Maximal-PSI auf und lausche auf Zischen. Sprühe systematisch
    Seifenwasser auf, besonders rund um Nähte und Ventil. Markiere blasende Stellen.
    Lass ab, reinige mit Alkohol, schleife mit 80er-Körnung, trage PVC-Kleber auf
    Flicken und Board auf, warte, bis er klebrig wird, drücke fest an und belaste
    24 Stunden lang.
  recommendation: >-
    Verwende das Paddle Board Overstock-Reparaturset, das allen Paddle Board Overstock-Boards beiliegt. Nimm das
    Reparaturset immer mit auf Touren. Bei Ventilproblemen kontaktiere den
    Paddle Board Overstock-Support. Bei großen Rissen oder Trennungen entlang der Naht wird eine
    professionelle Reparatur empfohlen.
  faq:
    - q: Kann ich einen großen Riss in meinem aufblasbaren SUP selbst reparieren?
      a: >-
        Risse über 1\" können eine professionelle Reparatur oder einen Flicken auf
        beiden Seiten erfordern. Nähttrennungen entlang des Längsträgers lassen sich
        vor Ort nicht zuverlässig beheben.
    - q: Wie lange hält ein Reparaturflicken?
      a: >-
        Eine sachgemäße Reparatur mit korrekter Technik hält so lange wie das Board.
        Schlechte Haftung durch unzureichende Reinigung führt später zum Versagen.
    - q: Kann ich ein leckendes Ventil reparieren?
      a: >-
        Oft ja. Entferne den Ventileinsatz, prüfe den O-Ring, reinige oder ersetze
        ihn, trage Silikongleitmittel auf und setze ihn wieder ein.
    - q: Was, wenn ich das Leck nicht finde?
      a: >-
        Pumpe auf vollen PSI auf und tauche die Abschnitte nacheinander in eine
        Badewanne oder einen Pool. Lecks, die zu klein zum Finden sind, können
        temperaturebedingt sein.
