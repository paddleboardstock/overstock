- slug: weather-planning-water-sports
  category: guide
  type: safety
  title: 'Wetterplanung für den Wassersport: Vorhersagen lesen wie ein Profi'
  description: >-
    Wie man maritime Wettervorhersagen für SUP, Surfen und Bootfahren liest.
    Wetterfronten, Drucksysteme, Windmuster und Wetterwarnungen verstehen, um
    Sessions sicher zu planen.
  definition: >-
    Wetterplanung bedeutet die Interpretation maritimer Vorhersagen –
    Windgeschwindigkeit und -richtung, Wellenhöhe und -periode,
    Niederschlag, Sicht und Warnungen vor schwerem Wetter.
  tldr: >-
    Vor jeder Session drei Vorhersagen prüfen: Wind, Wellen und Wetter. Ideale
    Bedingungen: leichter ablandiger Wind, mäßige Wellen, hoher oder steigender
    Luftdruck. Vermeiden: Gewitter, starker ablandiger Wind, Nebel und rasch
    fallender Luftdruck.
  problem: >-
    Du fährst an die Küste auf Basis einer 3-Tage-Vorhersage, die gute
    Bedingungen versprochen hat – und findest 25 Knoten Wind und Regen vor.
    Maritimes Wetter ist schwer vorherzusagen.
  explanation: >-
    Hoher Luftdruck bringt stabiles Wetter und leichte Winde. Tiefdruck bringt
    Wind und Stürme. Der Luftdruckgradient bestimmt die Windgeschwindigkeit.
    Kaltfronten bringen plötzliche Winddrehungen. Lokale Effekte wie Seewinde
    können die allgemeine Vorhersage außer Kraft setzen.
  solution: >-
    Mehrere Quellen nutzen: Windy.com, NOAA, lokale Surfcams. 24 Stunden im
    Voraus prüfen und am Morgen erneut kontrollieren. Auf konsistente
    Vorhersagen über die Modelle hinweg achten. Lokale Mikroklimate kennenlernen.
  recommendation: >-
    Windy.com für deine lokalen Spots als Lesezeichen speichern. Ein Handy in
    wasserdichter Hülle mitführen. Beim Bootfahren ein UKW-Funkgerät für
    Wetterdurchsagen mitführen. Im Zweifel an Land bleiben.
  faq:
    - q: Welches Wetter sollte ich für SUP vermeiden?
      a: >-
        Gewitter (Blitzschlag), Nebel (null Sicht), ablandiger Wind über 10
        Knoten, Winde über 20 Knoten, fallender Luftdruck.
    - q: Wie genau sind maritime Vorhersagen?
      a: >-
        3-Tage-Vorhersagen sind etwa zu 80 % genau. Vorhersagen für den nächsten
        Tag sind beim Wind zu über 90 % genau.
    - q: Welche Barometer-Tendenz ist für den Wassersport günstig?
      a: >-
        Steigender oder stabiler Luftdruck deutet auf besser werdende
        Bedingungen hin. Fallender Luftdruck (1+ mb/h) deutet auf einen nahenden
        Sturm hin.
    - q: Kann ich im Nebel SUPen?
      a: >-
        Nicht empfehlenswert. Wenn du in Nebel gerätst, Kompass oder GPS
        verwenden, alle 30 Sekunden in die Trillerpfeife blasen und in Ufernähe
        bleiben.
