- slug: surfboard-size-guide
  category: guide
  type: buying-guide
  title: Surfboard-Größen-Guide (Das Volumen ist, worauf es wirklich ankommt)
  description: >-
    Hören Sie auf, Surfboard-Größen zu raten. Das Volumen in Litern
    bestimmt alles – wie leicht Sie Wellen fangen, wie stabil Sie sich
    fühlen und wie schnell Sie Fortschritte machen. Finden Sie Ihre
    Zielliter in 2 Minuten heraus.
  definition: >-
    Die Surfboard-Größe dreht sich in erster Linie um das Volumen (Liter),
    nicht um die Länge. Das Volumen bestimmt Auftrieb und die Fähigkeit,
    Wellen zu fangen. Längere Boards paddeln schneller; breitere Boards
    sind stabiler; dickere Boards bieten mehr Volumen ohne zusätzliche
    Länge.
  tldr: >-
    Die Surfboard-Größe dreht sich um das Volumen, nicht nur um die Länge.
    Anfänger brauchen 60-80 Liter, Fortgeschrittene 35-55 Liter und
    erfahrene Surfer 20-35 Liter. Nutzen Sie Ihr Gewicht als wichtigsten
    Faktor: Jedes 10 kg benötigt auf Anfängerniveau grob 10-12 Liter
    Volumen.
  problem: >-
    Vor einem Gestell mit Surfboards stehend, auf deren Rails Zahlen wie
    7'2" x 22" x 3" gedruckt sind, haben Sie keine Ahnung, wie sich diese
    Maße im Wasser anfühlen. Kaufen nach Optik oder dem, was ein Freund
    fährt, führt zu einem Board, das entweder zu instabil oder zu schwer
    zu paddeln ist.
  explanation: >-
    Die Größe eines Surfboards lässt sich am besten über drei Dimensionen
    verstehen: Länge (Paddelkraft und Wellenfang), Breite (Stabilität) und
    Dicke (Volumen und Auftrieb). Die Zahl, auf die es wirklich ankommt,
    ist das Volumen in Litern. Schaumstoff-Boards und aufblasbare Boards
    erzielen hohes Volumen über Breite und Dicke statt über übermäßige
    Länge, wodurch sie für Anfänger beherrschbar sind. Mit zunehmender
    Erfahrung reduzieren Sie das Volumen, damit das Board tiefer in die
    Wellenfront einsinkt und reaktionsschneller wendet.
  solution: >-
    Nutzen Sie einen Volumen-zu-Gewicht-Rechner: Teilen Sie für Anfänger
    Ihr Gewicht in kg durch 1,5, um die Zielliter zu erhalten. Für
    Fortgeschrittene teilen Sie durch 2. Fortgeschrittene sollten nach
    Boards mit moderatem Rocker und einem Squash- oder Rund-Tail für
    Vielseitigkeit suchen.
  recommendation: >-
    Der Paddle Board Overstock Surfboard Pro bietet 75 Liter Volumen in einem 10'6"
    Format – ideal für Anfänger bis 90 kg. Leichtere Fahrer können beim
    Fortschreiten auf den SUP Tour 12 verkleinern, um sich wendiger
    anzufühlen.
  faq:
    - q: Spielt die Körpergröße für die Surfboard-Größe eine Rolle?
      a: >-
        Die Körpergröße spielt eine geringere Rolle als das Gewicht. Ein
        großer, leichter Surfer braucht weniger Volumen als ein kleiner,
        schwerer Surfer gleicher Größe. Nutzen Sie das Gewicht als
        primäre Kennzahl und passen Sie es an Fitness und Paddelkraft an.
    - q: Was passiert, wenn mein Board zu viel Volumen hat?
      a: >-
        Zu viel Volumen lässt das Board sich korkig und instabil auf der
        Wellenfront anfühlen. Sie werden Schwierigkeiten haben, die Rail
        für Kurven einzusetzen, und können bei Bottom Turns vom Wasser
        abprallen.
    - q: Was passiert, wenn mein Board zu wenig Volumen hat?
      a: >-
        Sie werden Schwierigkeiten haben, in Wellen zu paddeln, beim
        Takeoff zu tief einsinken und sich schon beim Warten auf dem Board
        instabil fühlen. Anfänger brauchen fast immer mehr Volumen, als sie
        denken.
    - q: Woran erkenne ich, wann ich verkleinern sollte?
      a: >-
        Wenn Sie auf Ihrem aktuellen Board konstant Wellen fangen, sauber
        aufstehen und einfache Kurven fahren können, ist es Zeit, 5-10
        Liter abzubauen. Zu frühes Verkleinern verlangsamt Ihren
        Fortschritt.
