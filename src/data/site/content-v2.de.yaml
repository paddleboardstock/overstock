- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'SUP-Leash-Ratgeber: Gerade vs. Spiral-Leashes einfach erklärt'
  description: >-
    Vollständiger Ratgeber zu SUP-Leashes — gerade vs. spiral, Knöchel vs. Wade,
    Quick-Release-Optionen und wie Sie die richtige Leash für Ihre
    Paddelbedingungen auswählen.
  definition: >-
    Eine SUP-Leash ist ein Seil, das den Paddler mit dem Board verbindet und das
    Auseinandertreiben verhindert. Zu den Typen gehören gerade Leashes (fürs
    Surfen und Flüsse) und Spiral-Leashes (für ruhiges Wasser).
  tldr: >-
    Spiral-Leashes sind am besten für ruhiges Wasser und Fitness-Paddling
    geeignet — sie bleiben vom Board fern und aus dem Wasser. Gerade Leashes
    sind für SUP-Surfen und Flüsse gedacht — sie bieten mehr Bewegungsfreiheit
    und verheddern sich nicht. Die Befestigung an der Wade wird dem Knöchel aus
    Komfortgründen vorgezogen. Quick-Release-Leashes sind beim Paddeln auf
    Flüssen wichtig, um ein Verfangen zu verhindern.
  problem: >-
    Sie haben zusammen mit Ihrem SUP eine Leash gekauft, sind sich aber nicht
    sicher, ob sie der richtige Typ für Ihren Paddelstil ist. Die falsche Leash
    wird schleifen, sich verheddern oder genau dann versagen, wenn Sie sie am
    meisten brauchen.
  explanation: >-
    Gerade Leashes sind einfache Nylon- oder Polyurethan-Seile, die hinter dem
    Board herziehen. Sie funktionieren beim Surfen gut, da sie sich nicht an
    Finnen verheddern. Spiral-Leashes sind spiralförmige Seile, die sich
    zusammenziehen, wenn sie nicht unter Spannung stehen — beim Paddeln bleiben
    sie zusammengerollt auf dem Deck und dehnen sich, wenn Sie stürzen. Sie
    halten die Leash bei ruhigen Bedingungen aus dem Wasser und verringern so
    den Widerstand.
  solution: >-
    Wählen Sie eine Spiral-Leash für ruhiges Wasser, Fitness- und Touring-SUP.
    Der geringere Widerstand hilft, die Geschwindigkeit zu halten, und
    verhindert, dass sich die Leash an Unterwasserobjekten verfängt. Wählen Sie
    eine gerade Leash für SUP-Surfen und Flusspaddeln. Das gerade Design
    verheddert sich seltener an Finnen oder Hindernissen.
  recommendation: >-
    Die SUP-Pakete von Paddle Board Overstock enthalten den passenden Leash-Typ für den
    vorgesehenen Verwendungszweck des Boards. Die Spiral-Leash im
    SUP-Explorer-11-Paket ist hervorragend für Allround-Paddeln geeignet.
  faq:
    - q: 'Soll die Leash an meinem Knöchel oder an meiner Wade befestigt werden?'
      a: >-
        Die Befestigung an der Wade wird beim SUP bevorzugt — sie hält die Leash
        beim Paddeln aus dem Wasser und verringert die Stolpergefahr beim Gehen.
    - q: 'Wie lang sollte eine SUP-Leash sein?'
      a: >-
        8-10' für ruhiges Wasser, 6-8' fürs Surfen. Kürzere Leashes verringern
        den Widerstand, schränken aber die Bewegungsfreiheit auf dem Board ein.
    - q: 'Brauche ich eine Quick-Release-Leash für Flüsse?'
      a: >-
        Ja — beim Fluss-SUP ist eine Quick-Release-Leash oder ein Gürtel
        erforderlich, der sofort gelöst werden kann, um ein Verfangen in
        Strömungshindernissen (Strainers) zu verhindern.
    - q: 'Kann ich eine Surf-Leash für SUP verwenden?'
      a: >-
        Surf-Leashes sind kürzer und dünner. Sie funktionieren beim SUP-Surfen,
        sind aber nicht ideal für das Paddeln auf ruhigem Wasser, wo eine
        längere Spiral-Leash besser ist.
