badge: Proof & Quality
heading: Prove
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Stock di Liquidazione, Controllo Qualità da Rivendita
    product: Ogni tavola Overstock, Riesaminata
    industry: Controllo Qualità
    challenge: Le tavole in eccedenza e in liquidazione provengono da lotti di produzione surplus, quindi gli acquirenti giustamente chiedono se una tavola scontata superi gli stessi controlli di una a prezzo pieno.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: Tasso di difetti dello 0,7% nelle spedizioni in uscita negli ultimi 12 mesi — lo stesso standard si applica sia alle tavole in liquidazione che a quelle in stock ordinario.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Tasso di assenza di difetti
        value: 99.3%
      - label: Copertura Test di Pressione
        value: 100%
      - label: Durata della Tenuta
        value: 24-48h
  - id: pressure-test-regime
    client: La Tenuta di Pressione di 24-48 ore
    product: Ogni Camera, 1,25 volte la Pressione Nominale
    industry: Test del Prodotto
    challenge: Una tavola SUP vive o muore per il suo nucleo e le cuciture drop-stitch, e un rapido controllo di gonfiaggio al termine della linea non è sufficiente a rilevare perdite lente o saldature deboli.
    solution: Ogni tavola viene gonfiata a 1,25 volte la pressione nominale e mantenuta per 24-48 ore, con la caduta di pressione che deve rimanere inferiore al 5%. Valvole, D-ring, cuciture e galleggiabilità vengono controllati senza tolleranza per difetti di sicurezza.
    result: Il 100% della produzione supera questo regime prima dell'imballaggio — nessuna scorciatoia di campionamento, nessuna eccezione.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - Pressione 1,25x
      - Zero Difetti di Sicurezza
    outcome_metrics:
      - label: Pressione di Test
        value: 1.25x
      - label: Caduta Massima di Pressione
        value: <5%
      - label: Unità Testate
        value: 100%
  - id: warranty-claims-support
    client: Una Garanzia che Risponde
    product: Copertura di 2 Anni su Tavole e Accessori SUP
    industry: Servizio Post-Vendita
    challenge: "Acquistare articoli in saldo direttamente dalla fabbrica solleva una domanda legittima: se qualcosa va storto mesi dopo, chi se ne occupa?"
    solution: Ogni tavola viene spedita con una garanzia di 2 anni che copre tavole SUP, giunture drop-stitch, valvole di gonfiaggio e accessori. Le richieste vanno direttamente al nostro team — inviate foto o un breve video e ci occupiamo di tutto noi.
    result: Le richieste di garanzia sono esaminate e risolte dallo stesso team che controlla la produzione — niente giri tra intermediari.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - Garanzia di 2 anni
      - Supporto diretto
      - Accessori coperti
    outcome_metrics:
      - label: Garanzia
        value: 2 anni
      - label: Copertura
        value: Tavola + Accessori
      - label: Supporto
        value: Team diretto
