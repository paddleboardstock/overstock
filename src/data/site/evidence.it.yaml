badge: Prove e risultati
heading: Evidenze
description: Casi di studio reali, certificazioni, dati di test e foto di impiego che dimostrano le nostre capacità produttive e la qualità dei nostri prodotti.

case_studies:
  - id: retail-private-label
    client: Rivenditore europeo di articoli outdoor
    product: Linea SUP a marchio del distributore
    industry: Vendita al dettaglio
    challenge: Un rivenditore europeo di articoli outdoor aveva bisogno di una linea di SUP a marchio del distributore con grafiche esclusive del ponte, PVC ecologico e imballaggio pronto per il negozio, il tutto consegnato in 60 giorni.
    solution: Abbiamo sviluppato i file di stampa digitale personalizzati, reperito PVC conforme alla normativa REACH e ridotto i campioni da 3 a 1 round collocando il team di design presso il nostro stabilimento di Qingdao.
    result: 55 giorni dall'ordine firmato al FOB. 2,400 unità su 4 SKU. Ordine ripetuto prima dell'arrivo del primo container.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags: [OEM, Vendita al dettaglio, SUP]
    outcome_metrics:
      - label: Tempi di consegna
        value: 55 giorni
      - label: Unità
        value: 2,400
      - label: SKU
        value: '4'

  - id: startup-drop-stitch-kayak
    client: Startup statunitense di sport acquatici
    product: Kayak drop-stitch
    industry: Startup / Vendita al dettaglio
    challenge: Una startup statunitense di sport acquatici aveva bisogno di un kayak drop-stitch ad alte prestazioni con forma dello scafo personalizzata, imballaggio in co-branding e certificazione BSCI per la vendita al dettaglio.
    solution: Abbiamo adattato uno stampo drop-stitch esistente con profilo rocker modificato, sviluppato la grafica dell'imballaggio in co-branding e fornito la documentazione completa dell'audit BSCI.
    result: Inserito con successo in 3 grandi catene outdoor statunitensi. Oltre 5,000 unità nel primo anno con un tasso di sell-through del 98%.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags: [OEM, Kayak, BSCI]
    outcome_metrics:
      - label: Catene di vendita al dettaglio
        value: '3'
      - label: Unità nel primo anno
        value: 5,000+
      - label: Sell-through
        value: 98%

  - id: australian-rib-distributor
    client: Distributore australiano
    product: Gamma RIB certificati CE
    industry: Nautica / Settore pubblico
    challenge: Un distributore australiano richiedeva una gamma di RIB certificati CE con colori dei tubolari personalizzati, opzione di upgrade Hypalon e conformità alla norma australiana AS 1799.
    solution: Abbiamo prodotto campioni di pre-produzione in 4 varianti di colore dei tubolari, reperito Hypalon CSM da un fornitore giapponese e coordinato i test di conformità AS 1799 con un ente terzo.
    result: Gamma di 3 modelli RIB lanciata sul mercato AU/NZ. Seguita dall'aggiudicazione di una gara pubblica per 12 RIB da pattuglia.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags: [OEM, RIB, Hypalon, Settore pubblico]
    outcome_metrics:
      - label: Modelli lanciati
        value: '3'
      - label: Contratto imbarcazioni da pattuglia
        value: 12 unità
      - label: Conformità
        value: AS 1799

  - id: caribbean-resort-fleet
    client: Gruppo di resort di lusso dei Caraibi
    product: Flotta per resort — RIB, SUP e kayak
    industry: Ospitalità / Turismo
    challenge: Un gruppo con 5 resort aveva bisogno di una flotta unificata di attrezzature nautiche a noleggio — tender RIB, SUP e kayak — con branding coerente, materiali resistenti ai raggi UV per il sole tropicale e un piano di sostituzione su 5 anni.
    solution: Abbiamo progettato un pacchetto flotta personalizzato di 3 modelli con PVC stabilizzato ai raggi UV, grafiche del ponte con il brand del resort e un calendario di consegna scaglionato. Formazione del personale e kit di ricambi dedicato per ogni resort inclusi.
    result: 180 unità consegnate in 5 resort. Ordine ripetuto per 2 nuove strutture. Riduzione del 40% del costo unitario rispetto ai fornitori precedenti.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags: [OEM, SUP, Kayak, RIB, Ospitalità]
    outcome_metrics:
      - label: Unità consegnate
        value: 180
      - label: Resort
        value: '5'
      - label: Riduzione dei costi
        value: 40%

  - id: southeast-asia-search-rescue
    client: Agenzia marittima del Sud-Est asiatico
    product: Flotta RIB da pattuglia e soccorso
    industry: Settore pubblico / Sicurezza marittima
    challenge: Un'agenzia marittima governativa richiedeva 20 RIB da pattuglia e soccorso con tessuto Hypalon ignifugo, pavimenti autosvuotanti, supporti integrati per console VHF/radio e conformità agli standard per imbarcazioni di salvataggio del capitolo III della SOLAS.
    solution: Fabbricazione di 20 RIB con tubolari in Hypalon CSM, scafi in alluminio di grado marino, golfari di traino rinforzati e pacchetti di luci di navigazione preinstallati. Il team di ispezione dello stabilimento ha assistito alle prove in mare. Fornito il pacchetto documentale SOLAS completo.
    result: Contratto consegnato in 4 mesi. Flotta impiegata per pattugliamento delle frontiere, ricerca e soccorso e risposta alle emergenze su 3 basi regionali.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags: [OEM, RIB, Hypalon, Settore pubblico, SOLAS]
    outcome_metrics:
      - label: RIB da pattuglia
        value: '20'
      - label: Consegna
        value: 4 mesi
      - label: Basi
        value: '3'

  - id: european-dtc-ecommerce
    client: Brand europeo DTC di sport acquatici
    product: Linea SUP con marchio + accessori
    industry: E-commerce / Vendita al dettaglio
    challenge: Un brand DTC di sport acquatici in rapida crescita aveva bisogno di un pacchetto SUP completo (tavola, pompa, pagaia, leash, borsa) con imballaggio premium pensato per l'evasione degli ordini e-commerce, con consegna diretta al consumatore via DHL/FedEx senza danni.
    solution: Abbiamo sviluppato una linea in co-branding con sagomatura personalizzata del nucleo in EPS, tecnologia drop-stitch proprietaria per una pressione più elevata e scatole in cartone ondulato a doppia parete pronte per il negozio con inserti imbottiti. Integrata la registrazione di autenticità e garanzia tramite codice QR.
    result: Linea di 3 modelli SUP lanciata in 75 giorni. Oltre 15,000 unità nei primi 12 mesi. Valutazione media di 4.8★ su oltre 2,000 recensioni. Tasso di danni in transito dello 0.3%.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags: [OEM, SUP, DTC, E-commerce]
    outcome_metrics:
      - label: Modelli
        value: '3'
      - label: Unità
        value: 15,000+
      - label: Valutazione media
        value: 4.8★
      - label: Tasso di danni
        value: 0.3%

certifications:
  - name: CE
    body: Unione Europea
    desc: 64 modelli certificati CE in conformità con le direttive UE applicabili per le imbarcazioni da diporto e i dispositivi di galleggiamento personali.
  - name: ISO 9001
    body: SGS / BSI
    desc: Sistema di gestione della qualità certificato per la progettazione, la produzione e la distribuzione di imbarcazioni gonfiabili.
  - name: BSCI
    body: amfori
    desc: Certificazione di conformità sociale che attesta produzione etica, condizioni di lavoro eque e sicurezza sul posto di lavoro.
  - name: REACH
    body: Agenzia europea per le sostanze chimiche
    desc: Tutti i materiali sono conformi al regolamento REACH per la sicurezza chimica. Documentazione fornita con ogni spedizione.
  - name: RoHS
    body: Unione Europea
    desc: Conformità alla restrizione delle sostanze pericolose in tutti i componenti elettronici ed elettrici.
  - name: AS 1799
    body: Standards Australia
    desc: Norma australiana per imbarcazioni gonfiabili, testata e certificata per l'uso commerciale nelle acque AU/NZ.

