badge: Proof & Results
heading: Bukti
description: Studi kasus nyata, sertifikasi, data uji, dan foto penerapan yang menunjukkan kemampuan manufaktur dan kualitas produk kami.
case_studies:
  - id: retail-private-label
    client: Peritel Outdoor Eropa
    product: Lini Private-Label SUP
    industry: Ritel
    challenge: Peritel outdoor Eropa membutuhkan lini private-label SUP dengan grafis dek unik, PVC ramah lingkungan, dan kemasan siap ritel — semuanya dikirim dalam 60 hari.
    solution: Mengembangkan file cetak digital kustom, memperoleh PVC yang sesuai REACH, dan mempercepat sampling dari 3 putaran menjadi 1 dengan menempatkan tim desain di pabrik kami di Qingdao.
    result: 55 hari dari PO yang ditandatangani hingga FOB. 2.400 unit di 4 SKU. Pesanan ulang dilakukan sebelum kontainer pertama tiba.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Ritel
      - SUP
    outcome_metrics:
      - label: Waktu Tunggu
        value: 55 hari
      - label: Unit
        value: 2,400
      - label: SKU
        value: '4'
  - id: startup-drop-stitch-kayak
    client: Startup Watersports AS
    product: Drop-Stitch Kayak
    industry: Startup / Ritel
    challenge: Startup watersports AS membutuhkan kayak drop-stitch berkinerja tinggi dengan bentuk lambung kustom, kemasan bersama merek, dan sertifikasi BSCI untuk penempatan ritel.
    solution: Menyesuaikan cetakan kayak drop-stitch yang ada dengan profil rocker yang dimodifikasi, mengembangkan artwork kemasan bersama merek, dan menyediakan dokumentasi audit BSCI lengkap.
    result: Berhasil terdaftar di 3 jaringan outdoor utama AS. 5.000+ unit di tahun pertama dengan tingkat penjualan 98%.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Kayak
      - BSCI
    outcome_metrics:
      - label: Rantai Ritel
        value: '3'
      - label: Unit Tahun Pertama
        value: 5,000+
      - label: Tingkat Penjualan
        value: 98%
  - id: australian-rib-distributor
    client: Distributor Australia
    product: Lini RIB Bersertifikasi CE
    industry: Maritim / Pemerintah
    challenge: Distributor Australia memerlukan lini RIB bersertifikasi CE dengan warna tabung kustom, opsi peningkatan Hypalon, dan kepatuhan terhadap Standar Australia AS 1799.
    solution: Memproduksi sampel pra-produksi dengan 4 variasi warna tabung, memperoleh Hypalon CSM dari pemasok Jepang, dan mengoordinasikan pengujian kepatuhan AS 1799 oleh pihak ketiga.
    result: 3-model RIB dijangkau pasar AU/NZ. Diikuti dengan kemenangan tender pemerintah untuk 12 kapal patroli RIBs.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Pemerintah
    outcome_metrics:
      - label: Model Diluncurkan
        value: '3'
      - label: Kontrak Kapal Patroli
        value: 12 unit
      - label: Kepatuhan
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Kelompok Resor Mewah Karibia
    product: Armada Resor — RIBs, SUP, Kayak
    industry: Perhotelan / Pariwisata
    challenge: Sebuah kelompok resor dengan 5 properti membutuhkan armada peralatan olahraga air sewaan yang terpadu — tender RIB, SUPs, dan kayak — dengan merek yang konsisten, bahan tahan UV untuk sinar matahari tropis, dan rencana penggantian 5 tahun.
    solution: Merancang paket armada kustom 3-model dengan UV-stabilized PVC, grafik dek dengan merek resor, dan jadwal pengiriman bertahap. Memberikan pelatihan staf dan kit suku cadang khusus per resor.
    result: 180 unit dikirim ke 5 resor. Pesanan ulang untuk 2 properti baru. Pengurangan biaya per-unit sebesar 40% dibandingkan pemasok sebelumnya.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kayak
      - RIB
      - Perhotelan
    outcome_metrics:
      - label: Unit Terkirim
        value: 180
      - label: Resor
        value: '5'
      - label: Pengurangan Biaya
        value: 40%
  - id: southeast-asia-search-rescue
    client: Badan Maritim Asia Tenggara
    product: Patroli & Penyelamatan RIB Armada
    industry: Pemerintah / Keamanan Maritim
    challenge: Sebuah badan maritim pemerintah membutuhkan 20 kapal patroli dan penyelamatan RIBs dengan kain tahan api Hypalon, lantai self-bailing, dudukan konsol VHF/radio terintegrasi, dan kepatuhan dengan standar kapal penyelamat Bab III SOLAS.
    solution: Membuat 20 RIBs dengan tabung CSM Hypalon, lambung aluminium marine-grade, mata tarik berat, dan paket lampu navigasi pra-terpasang. Tim inspeksi pabrik menyaksikan uji coba laut. Paket dokumentasi SOLAS lengkap disediakan.
    result: Kontrak diselesaikan dalam 4 bulan. Armada diterjunkan untuk patroli perbatasan, pencarian dan penyelamatan, serta respons bencana di 3 basis regional.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Pemerintah
      - SOLAS
    outcome_metrics:
      - label: Patroli RIBs
        value: '20'
      - label: Pengiriman
        value: 4 bulan
      - label: Basis
        value: '3'
  - id: european-dtc-ecommerce
    client: Merek Watersports DTC Eropa
    product: Merek SUP + Lini Aksesori
    industry: E-commerce / Ritel
    challenge: Merek watersports DTC yang berkembang pesat membutuhkan paket lengkap SUP (papan, pompa, dayung, tali pengaman, tas) dengan kemasan premium yang dirancang untuk pemenuhan e-commerce — langsung ke konsumen melalui DHL/FedEx tanpa kerusakan.
    solution: Mengembangkan lini produk co-branded dengan bentuk inti EPS kustom, teknologi drop-stitch proprietary untuk tekanan lebih tinggi, dan kotak bergelombang dinding ganda siap ritel dengan bantalan sisipan. Terintegrasi dengan pendaftaran keaslian dan garansi berbasis kode QR.
    result: Lini SUP 3 model diluncurkan dalam 75 hari. 15.000+ unit dalam 12 bulan pertama. Rating rata-rata 4,8★ dari 2.000+ ulasan. Tingkat kerusakan 0,3% dalam pengiriman.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-commerce
    outcome_metrics:
      - label: Model
        value: '3'
      - label: Unit
        value: 15,000+
      - label: Rating Rata-rata
        value: 4.8★
      - label: Tingkat Kerusakan
        value: 0.3%
certifications:
  - name: CE
    body: Uni Eropa
    desc: Produk membawa sertifikasi CE sesuai direktif UE yang berlaku — kapal rekreasi menurut EN ISO 6185, perangkat pelampung pribadi menurut EN ISO 12402, bila berlaku.
  - name: ISO 9001
    body: SGS / BSI
    desc: Sistem manajemen kualitas bersertifikat untuk desain, manufaktur, dan distribusi kapal karet.
  - name: BSCI
    body: amfori
    desc: Sertifikasi kepatuhan sosial yang menunjukkan manufaktur etis, tenaga kerja yang adil, dan keselamatan tempat kerja.
  - name: REACH
    body: Agen Kimia Eropa
    desc: Semua bahan mematuhi regulasi REACH untuk keselamatan kimia. Dokumentasi diberikan dengan setiap pengiriman.
  - name: RoHS
    body: Uni Eropa
    desc: Kepatuhan pembatasan zat berbahaya pada semua komponen elektronik dan listrik.
  - name: AS 1799
    body: Standar Australia
    desc: Standar Australia untuk perahu karet — diuji dan disertifikasi untuk penggunaan komersial di perairan AU/NZ.
