badge: Proof & Quality
heading: Bukti
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Stok Clearance, QC Setara Ritel
    product: Setiap Papan Overstock, Diperiksa Ulang
    industry: Kontrol Kualitas
    challenge: Papan overstock dan clearance berasal dari produksi surplus, jadi wajar jika pembeli bertanya apakah papan diskon melewati pemeriksaan yang sama seperti papan dengan harga penuh.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: Tingkat bebas cacat 99,3% pada pengiriman keluar selama 12 bulan terakhir — standar yang sama berlaku untuk stok clearance dan ritel.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Tingkat Bebas Cacat
        value: 99.3%
      - label: Cakupan Uji Tekanan
        value: 100%
      - label: Durasi Tahanan
        value: 24-48h
  - id: pressure-test-regime
    client: Tahanan Tekanan 24-48 Jam
    product: Setiap Ruang, 1,25x Tekanan Tertera
    industry: Pengujian Produk
    challenge: Sebuah papan SUP hidup atau mati oleh inti drop-stitch dan sambungannya, dan pemeriksaan inflasi cepat di akhir jalur tidak cukup untuk mendeteksi kebocoran lambat atau lasan yang lemah.
    solution: Setiap papan diinflasi hingga 1,25x tekanan tertera dan ditahan selama 24-48 jam, dengan penurunan tekanan harus tetap di bawah 5%. Katup, D-ring, sambungan, dan daya apung diperiksa tanpa toleransi untuk cacat keselamatan.
    result: 100% produksi melewati rezim ini sebelum dikemas — tidak ada jalan pintas sampling, tidak ada pengecualian.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - Tekanan 1,25x
      - Cacat Keselamatan Nol
    outcome_metrics:
      - label: Tekanan Uji
        value: 1.25x
      - label: Penurunan Tekanan Maks
        value: <5%
      - label: Unit Diuji
        value: 100%
  - id: warranty-claims-support
    client: Garansi yang Menjawab
    product: Cakupan 2 Tahun pada Papan & Aksesori SUP
    industry: Layanan Purna Jual
    challenge: Membeli barang clearance langsung dari pabrik menimbulkan pertanyaan yang wajar — jika sesuatu terjadi beberapa bulan kemudian, siapa yang menanganinya?
    solution: Setiap papan dikirim dengan garansi 2 tahun yang mencakup papan SUP, sambungan drop-stitch, katup inflasi, dan aksesori. Klaim langsung diarahkan ke tim kami — kirim foto atau video pendek dan kami yang menanganinya.
    result: Klaim garansi ditinjau dan diselesaikan oleh tim yang sama yang memeriksa produksi — tanpa perantara.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - Garansi 2 Tahun
      - Dukungan Langsung
      - Aksesori Tercakup
    outcome_metrics:
      - label: Jaminan
        value: 2 tahun
      - label: Cakupan
        value: Papan + Aksesori
      - label: Mendukung
        value: Tim Langsung
