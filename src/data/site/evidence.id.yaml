  - metric: Ambang Cacat Utama
    value: AQL 2.5
    detail: Berdasarkan ISO standar sampling 2859
  - metric: Durasi Tahan Tekanan
    value: 24-48h
    detail: Tergantung kategori produk
  - metric: Margin Tekanan Uji
    value: 1.25x
    detail: Margin keselamatan di setiap kompartemen
  - metric: Toleransi Cacat Keselamatan
    value: 0%
    detail: Katup, cincin D, jahitan, daya apung
