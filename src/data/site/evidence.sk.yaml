badge: Proof & Results
heading: Dôkazy
description: Skutočné prípadové štúdie, certifikáty, testovacie údaje a fotografie z nasadenia, ktoré preukazujú naše výrobné schopnosti a kvalitu produktov.
case_studies:
  - id: retail-private-label
    client: Európsky outdoorový predajca
    product: Súkromná značka SUP linka
    industry: Maloobchod
    challenge: Európsky outdoorový predajca potreboval linku súkromnej značky SUP s unikátnymi grafickými motívmi na palube, ekologickými PVC a balením pripraveným na predaj — všetko dodané do 60 dní.
    solution: Vyvinuté vlastné digitálne tlačové súbory, získané REACH-kompatibilné PVC a znížený počet vzorkovacích kôl z 3 na 1 tým, že sme tím dizajnérov umiestnili priamo v našej továrni v Qingdaou.
    result: 55 dní od podpisu objednávky po FOB. 2 400 jednotiek v 4 SKU. Opakovaná objednávka bola zadaná ešte pred doručením prvého kontajnera.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Maloobchod
      - SUP
    outcome_metrics:
      - label: Doba dodania
        value: 55 dní
      - label: Jednotky
        value: 2,400
      - label: SKUs
        value: '4'
  - id: startup-drop-stitch-kayak
    client: Startup amerických vodných športov
    product: Drop-Stitch Kajak
    industry: Startup / Maloobchod
    challenge: Americký startup vodných športov potreboval vysokovýkonný drop-stitch kajak s vlastným tvarom trupu, spolumarketingovým balením a BSCI certifikáciou pre maloobchodné umiestnenie.
    solution: Upravili sme existujúcu drop-stitch formu kajaku s modifikovaným profilom rockeru, vyvinuli artwork balenia so spolumarketingom a poskytli kompletnú dokumentáciu auditu BSCI.
    result: Úspešne zaradené do 3 hlavných amerických outdoorových reťazcov. 5 000+ jednotiek v prvom roku s 98% mierou predaja.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Kajak
      - BSCI
    outcome_metrics:
      - label: Maloobchodné reťazce
        value: '3'
      - label: Jednotky v prvom roku
        value: 5,000+
      - label: Miera predaja
        value: 98%
  - id: australian-rib-distributor
    client: Austrálsky distribútor
    product: CE-Certifikovaný RIB sortiment
    industry: Marine / Štátne
    challenge: Austrálsky distribútor požadoval CE-certifikovaný RIB sortiment s vlastnými farbami trubiek, možnosťou upgrade Hypalon a v súlade s Austrálskym štandardom AS 1799.
    solution: Vyrobené predprodukčné vzorky so 4 variantmi farieb trubiek, získané CSM Hypalon od japonského dodávateľa a koordinované testovanie zhody s AS 1799 tretími stranami.
    result: 3-modelová RIB rada uvedená na trh v AU/NZ. Nasledovalo víťazstvo vo vládnej zákazke na 12 patrolných RIBs.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Vláda
    outcome_metrics:
      - label: Uvedené modely
        value: '3'
      - label: Zmluva na patrolnú loď
        value: 12 jednotiek
      - label: Súlad
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Skupina karibských luxusných rezortov
    product: Rezortná flotila — RIBs, SUP, kajaky
    industry: Hostiteľstvo / Turizmus
    challenge: Skupina 5 rezortov potrebovala jednotnú flotilu prenajímateľného vodného športového vybavenia — RIB zákaziek, SUPs a kajakov — s konzistentným značkovaním, materiálmi odolnými voči UV pre tropické slnko a päťročným plánom výmeny.
    solution: Navrhnutá vlastná trojmodelová balíková flotila s UV-stabilizovanými PVC, rezortnými deck grafikami a fázovým harmonogramom dodania. Poskytnuté školenie personálu a špeciálny súbor náhradných dielov pre každý rezort.
    result: 180 jednotiek dodaných do 5 rezortov. Opakovaná objednávka pre 2 nové objekty. Zníženie ceny na jednotku o 40 % v porovnaní s predchádzajúcimi dodávateľmi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kajak
      - RIB
      - Hostiteľstvo
    outcome_metrics:
      - label: Dodané jednotky
        value: 180
      - label: Rezorty
        value: '5'
      - label: Zníženie nákladov
        value: 40%
  - id: southeast-asia-search-rescue
    client: Agentúra juhovýchodnej Ázie pre námornú bezpečnosť
    product: Flotila patrolných a záchranných RIB
    industry: Vláda / Námorná bezpečnosť
    challenge: Vládna námorná agentúra požadovala 20 patrolných a záchranných RIBs s ohňovzdornou Hypalon tkaninou, samo-vypúšťacími podlahami, integrovanými konzolovými držiakmi pre VHF/rádio a súladom s normami SOLAS kapitoly III pre záchranné lode.
    solution: Vyrobených 20 RIBs s CSM Hypalon trubkami, trupmi z hliníka námornej kvality, ťažkými ťahacími okami a predinštalovanými balíčkami navigačných svetiel. Továrenský inšpekčný tím sledoval skúšky na mori. Poskytnutý kompletný dokumentačný balík SOLAS.
    result: Zmluva splnená za 4 mesiace. Flotila nasadená pre pohraničnú hliadku, pátranie a záchranu a reakcie pri katastrofách na 3 regionálnych základniach.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Vláda
      - SOLAS
    outcome_metrics:
      - label: Patrolné RIBs
        value: '20'
      - label: Dodanie
        value: 4 mesiace
      - label: Základne
        value: '3'
  - id: european-dtc-ecommerce
    client: Európska značka vodných športov DTC
    product: Značková SUP + doplnková línia
    industry: E-commerce / Retail
    challenge: Rýchlo rastúca značka vodných športov DTC potrebovala kompletný SUP balík (doska, pumpa, pádl, pútko, taška) s prémiovým balením navrhnutým pre e-commerce distribúciu — priamo spotrebiteľovi cez DHL/FedEx bez poškodenia.
    solution: Vyvinutá spoluznačková produktová línia s tvarovaním jadra EPS na mieru, proprietárnou drop-stitch technológiou pre vyšší tlak a maloobchodnými kartónmi s dvojitou stenou a vložkovým polstrovaním. Integrovaná autentifikácia a registrácia záruky pomocou QR kódu.
    result: 3-modelová SUP línia uvedená na trh za 75 dní. 15 000+ kusov za prvých 12 mesiacov. Priemerné hodnotenie 4,8★ z 2 000+ recenzií. 0,3 % miera poškodenia počas tranzitu.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-commerce
    outcome_metrics:
      - label: Modely
        value: '3'
      - label: Jednotky
        value: 15,000+
      - label: Priemerné hodnotenie
        value: 4.8★
      - label: Miera poškodenia
        value: 0.3%
certifications:
  - name: CE
    body: Európska únia
    desc: Produkty nesú CE certifikáciu podľa príslušných smerníc EÚ — rekreačné plavidlá podľa EN ISO 6185, osobné plávacie zariadenia podľa EN ISO 12402, kde je to vhodné.
  - name: ISO 9001
    body: SGS / BSI
    desc: Systém manažmentu kvality certifikovaný pre návrh, výrobu a distribúciu nafukovacích plavidiel.
  - name: BSCI
    body: amfori
    desc: Certifikácia sociálnej zhody preukazujúca etickú výrobu, spravodlivú pracovnú silu a bezpečnosť na pracovisku.
  - name: REACH
    body: Európska chemická agentúra
    desc: Všetky materiály sú v súlade s predpismi REACH pre chemickú bezpečnosť. Dokumentácia dodaná s každou zásielkou.
  - name: RoHS
    body: Európska únia
    desc: Dodržiavanie obmedzenia nebezpečných látok vo všetkých elektronických a elektrických komponentoch.
  - name: AS 1799
    body: Standards Australia
    desc: Austrálska norma pre nafukovacie loďky — testované a certifikované na komerčné použitie v AU/NZ vodách.
