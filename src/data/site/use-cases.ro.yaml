cases:
  - id: beginner
    title: Sporturi nautice pentru începători
    desc: Plăci și caiace stabile pentru utilizatori începători.
    scenario: O familie care vizitează un lac pentru weekend vrea să încerce paddle boarding. Au nevoie de echipamente stabile, ușor de lansat, cu instrucțiuni clare de siguranță.
    solution: Explorer 11 oferă stabilitate datorită corpului său lat pentru începători. Vesta de salvare Classic asigură flotabilitate certificată CE. Pompa cu acțiune dublă umflă ambele plăci în mai puțin de 10 minute.
    products:
      - Explorer 11
      - Vesta de salvare Classic
      - Pompa cu acțiune dublă
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Explorare în aer liber
    desc: Caiace și bărcuțe portabile pentru râuri, lacuri și excursii pe coastă.
    scenario: Un pasionat de activități în aer liber plănuiește o excursie de o săptămână pe râu și are nevoie de o barcă care se împachetează mic, se umflă la tabără și gestionează curenți variabili.
    solution: Kayak Lite se împachetează într-un rucsac și se umflă în mai puțin de 4 minute. Construcția sa drop-stitch face față lacurilor, râurilor lente și paddling-ului pe coastă.
    products:
      - Kayak gonflabil Lite
      - Vâslă din carbon
      - Vesta de salvare Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: Operațiuni profesionale
    desc: Bărci de grad comercial RIBs pentru operatorii de tur și intervenții de urgență.
    scenario: Un operator de tururi de coastă are nevoie de o flotă de bărci durabile care să funcționeze zilnic în diferite condiții de mare și să respecte reglementările de siguranță comerciale.
    solution: 330 și 450 Patrol folosesc catarge din fibră de sticlă cu tuburi Hypalon pentru durabilitate în toate condițiile meteorologice. Mai multe unități pot fi desfășurate cu performanță constantă.
    products:
      - '330'
      - 450 Patrol
      - Vesta de salvare Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: Recreere pentru familie
    desc: Bărci spațioase pentru excursii de o zi, pescuit și sporturi nautice.
    scenario: O familie de patru persoane vrea o barcă stabilă pentru excursii de weekend pe lac, pescuit și tractarea unui tub pentru copii.
    solution: 360 poate găzdui până la cinci persoane cu un podea din aer întărită. Se umflă la locul de lansare, se depozitează în mașină și face față atât lacurilor liniștite, cât și apelor de coastă adăpostite.
    products:
      - '360'
      - Vesta de salvare Classic
      - Pompa cu acțiune dublă
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
