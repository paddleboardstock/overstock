cases:
  - id: beginner
    title: Paddling pentru începători
    desc: Plăci gonflabile stabile SUP pentru cei care practică paddling-ul pentru prima dată.
    scenario: O familie care vizitează un lac pentru weekend vrea să încerce paddle boarding. Au nevoie de echipamente stabile, ușor de lansat, cu instrucțiuni clare de siguranță.
    solution: SUP Explorer 11 oferă stabilitate pentru începători datorită corpului lat. Life Vest Classic asigură flotabilitate certificată CE. Oars & Pump Set umflă placa în mai puțin de 10 minute.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Tur și Explorare
    desc: Plăci gonflabile de lungă distanță SUP pentru lacuri, râuri și excursii pe litoral.
    scenario: Un pasionat de activități în aer liber planifică o excursie de o săptămână pe apă și are nevoie de o placă care se poate împacheta ușor, se umflă la tabără și menține direcția pe apă deschisă.
    solution: Ocean Voyager Series alunecă eficient datorită conturului de touring și menține traiectoria în vânt și valuri. Construcția sa drop-stitch se umflă până la 15 PSI pentru rigiditate asemănătoare unei plăci tari.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga & Fitness
    desc: Platforme extra-late și stabile pentru yoga, fitness și relaxare.
    scenario: Un practicant de yoga dorește un studio plutitor pentru sesiunile de dimineață pe apă calmă, cu suficient spațiu pe punte pentru fiecare postură.
    solution: Flowing Lotus Series are un covoraș de ponton pe toată lungimea și o lățime mare pentru posturi fără balans. Este, de asemenea, o platformă stabilă pentru exerciții ușoare de fitness.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Recreere pentru familie
    desc: Pachete complete SUP pentru zilele de weekend la lac și vacanțe.
    scenario: O familie de patru persoane dorește plăci stabile pentru ieșirile de weekend la lac și vacanțele la plajă — echipament care se poate împacheta în mașină și se umflă în câteva minute.
    solution: Tropical Breeze Series este o placă stabilă, universală, pe care întreaga familie o poate folosi, în timp ce Medusa Glow Series este mai ușoară și mai scurtă pentru copii. Ambele se împachetează în rucsacuri pentru o călătorie ușoară.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
