  title: 'Безопасность на холодной воде: гребля и серфинг в холодных условиях'
  description: Безопасность на холодной воде для SUP, серфинга и каякинга. Распознавание гипотермии, соответствующее снаряжение, реакция на холодовый шок и аварийные процедуры при погружении в холодную воду.
  definition: Безопасность на холодной воде включает понимание реакции на холодовый шок, отказа при плавании, гипотермии, а также оборудования и методов, чтобы предотвратить эти последствия.
  tldr: Вода ниже 15°C требует гидрокостюма. Ниже 10°C требуются ботинки, перчатки и капюшон. Холодовой шок вызывает непроизвольное хватательное дыхание. Отказ в плавании происходит в течение 3-5 минут в воде ниже 10°C. Симптомы гипотермии включают дрожь, спутанность сознания и потерю координации.
  problem: Вы отплываете в солнечный день, не подозревая, что вода имеет температуру 8°C. Вы падаете в воду, невольно делаете вдох и чувствуете, как конечности онемевают через несколько минут. Холодная вода убивает быстрее, чем любая другая опасность в океане.
  explanation: 'Погружение в холодную воду имеет четыре стадии: холодовой шок (0-2 мин) — задыхание, гипервентиляция. Неспособность плавать (3-15 мин) — мышцы охлаждаются, координация нарушается. Гипотермия (15-45 мин) — температура тела падает ниже 35°C, вызывая замешательство и остановку сердца. Коллапс после спасения — холодная кровь возвращается к сердцу.'
  solution: 'Проверьте температуру воды. Наденьте гидрокостюм, соответствующий температуре. Никогда не гребите в одиночку в воде ниже 15°C. Имейте при себе свисток и телефон. Если вы упали в воду: контролируйте дыхание, быстро вернитесь на доску. Если слишком холодно, подайте сигнал о помощи.'
  recommendation: Гидрокостюм Paddle Board Overstock Wetsuit Pro 5/4/3 мм является минимальным для воды 8-14°C. Добавьте Paddle Board Overstock 5 мм ботинки и 3 мм перчатки. Наденьте спасательный жилет Life Vest Pro для дополнительной тепловой защиты.
  faq:
    - q: Как долго я смогу выжить в воде с температурой 10°C?
      a: Холодовой шок длится 1-2 минуты. Без спасательного жилета и термозащиты время выживания составляет 30-60 минут.
    - q: Каковы первые признаки переохлаждения?
      a: Неконтролируемое дрожание, спутанность сознания, плохая координация, невнятная речь. Немедленно прекратите деятельность и согрейтесь.
    - q: Как мне согреться после купания в холодной воде?
      a: Снимите мокрую одежду, вытритесь, наденьте тёплые слои одежды, включая шапку и перчатки. Пейте тёплые безалкогольные напитки.
    - q: Могу ли я получить переохлаждение летом?
      a: Да — вода ниже 15°C встречается во многих местах даже летом. Вода проводит тепло в 25 раз быстрее, чем воздух.
