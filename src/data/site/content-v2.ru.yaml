- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Гидратация и защита от солнца: Будьте в безопасности на воде'
  description: Основные стратегии гидратации и защиты от солнца для гребцов SUP. Обезвоживание и солнечные ожоги — самые распространенные проблемы SUP — как предотвратить их во время длительных сессий.
  definition: SUP гидратация означает поддержание водного баланса во время гребли через регулярное употребление воды. Защита от солнца включает нанесение SPF, ношение защитной одежды и планирование занятий во избежание пиковых UV.
  tldr: Пейте 500 мл воды за каждый час гребли. Берите больше, чем думаете, что нужно — гидратор на 2 литра или несколько бутылок. Нанесите водостойкий солнцезащитный крем SPF 50+ перед греблей и обновляйте каждые 2 часа. Надевайте шляпу, солнечные очки с ремешком и одежду с UPF-фильтром. Избегайте гребли с 11:00 до 15:00, когда UV наиболее сильный.
  problem: У вас отличная SUP сессия, но через час у вас появляется головная боль, сухость во рту и кожа жжет. Обезвоживание и солнечный ожог подкрадываются, потому что вода держит вас в прохладе.
  explanation: Отражение от воды усиливает воздействие UV до 40%. Охлаждающее действие воды и ветра маскирует солнечный ожог, пока не станет слишком поздно. Пот от гребли увеличивает потерю жидкости, а на воде часто нет возможности пополнить запасы воды. Обезвоживание ухудшает баланс и способность принимать решения, увеличивая риск несчастных случаев.
  solution: Прикрепите бутылку с водой или гидратационный мешок к системе бандажей на доске. Пейте каждые 15 минут, независимо от того, испытываете ли жажду. Нанесите солнцезащитный крем SPF 50 за 30 минут до выхода на воду. Наденьте шляпу с широкими полями, поляризованные солнцезащитные очки с ремешком и рашгард с UPF 50. Повторно наносите солнцезащитный крем каждые 2 часа.
  recommendation: Используйте гидратационный баллон, закреплённый на передних D-образных кольцах вашего Paddle Board Overstock SUP. Надевайте рашгард с защитой UPF 50+ под вашим PFD. Используйте водостойкий солнцезащитный крем, который остаётся на коже при потоотделении и контакте с водой.
  faq:
    - q: Сколько воды мне следует взять с собой в SUP поездку?
      a: Минимум 1 литр в час. На сессию в 2 часа возьмите 2 литра. Больше в жаркую погоду. Лучше всего подходит гидратационный баллон.
    - q: Какой тип солнцезащитного крема лучше всего подходит для SUP?
      a: Водостойкий, SPF 50+ широкого спектра действия. Минеральные солнцезащитные средства (оксид цинка, диоксид титана) безопасны для кораллов и держатся дольше.
    - q: Действительно ли вода отражает UV?
      a: Да — вода отражает до 40% UV излучения, что означает, что вы получаете UV сверху и снизу. Это значительно повышает риск ожогов.
    - q: Могу ли я получить солнечный ожог через рашгард?
      a: Стандартные рашгарды обеспечивают минимальную защиту UV (около UPF 10-20). Ищите одежду с рейтингом UPF 50+ для полной защиты.
