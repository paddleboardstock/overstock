  title: 'Понимание приливов для водных видов спорта: Практическое руководство'
  description: Как приливы влияют на SUP, условия для серфинга и каякинга. Чтение таблиц приливов, понимание приливов полнолуния и новолуния, а также планирование вашего занятия с учетом приливных движений для безопасности.
  definition: Приливы — это ежедневное повышение и понижение уровня моря, вызванное гравитационным притяжением Луны и Солнца. Амплитуда приливов варьируется в зависимости от местоположения и лунного цикла.
  tldr: 'Два высоких и два низких прилива ежедневно в большинстве мест. Приливы при солнцестоянии (полнолуние/новолуние) имеют больший размах и более сильные течения. Приливы при квадратуре луны (четверть луны) имеют меньший размах. Прилив влияет на глубину воды, форму волн и силу течения. Для SUP: сначала греби против течения, чтобы оно помогло тебе вернуться.'
  problem: Вы приходите к своему местному пляжу и обнаруживаете почти никакой волны, опасные обратные течения из-за отлива или слишком мелкую воду. Не понимая приливы, вы тратите поездки впустую или гребете в опасных условиях.
  explanation: Приливы вызываются гравитацией Луны. Приливы весенние (полнолуние и новолуние) создают наивысшие верхние и самые низкие нижние уровни. Приливы отливы (четверть Луны) создают минимальный диапазон. Приливные течения самые быстрые в середине прилива, а при высоком и низком приливах они замедлены. Амплитуда приливов варьируется от 0,3 м (Средиземное море) до 16 м (залив Фанди).
  solution: 'Проверяйте график приливов перед каждой сессией. Для серфинга: пляжные волны часто работают лучше всего за 2-3 часа до и после высокого прилива. Для SUP: плывите против течения в первой половине, чтобы течение помогало возвращаться. Для рыбалки: прилив поднимает рыбу на мелководья.'
  recommendation: Используйте прогнозы приливов NOAA или местное приложение для приливов. Узнайте предпочтительный уровень прилива на вашем местном брейке, записывая условия в течение месяца.
  faq:
    - q: Что такое прилив весеннего типа?
      a: Приливные явления во время полнолуния и новолуния вызывают более высокие приливы и более сильные течения. Они происходят дважды в месяц.
    - q: Что такое слабый прилив?
      a: Прини́женные приливы происходят во время четвертей луны. Амплитуда приливов меньше, а течения слабее — это хорошо для начинающих.
    - q: Опасны ли отливы для SUP?
      a: Отлив может обнажать скалы и рифы. Он также концентрирует энергию волн на более крутых песчаных отмелях.
    - q: Как приливы влияют на обратные течения?
      a: Отливы (отход воды) усиливают рип- течения. Приливы (подъем воды) уменьшают силу рип- течений.
