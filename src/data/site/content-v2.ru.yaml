  title: 'Руководство по размеру паддлборда: объём, длина и ширина для каждого райдера'
  description: Полное руководство по размеру паддлборда с рекомендациями по объёму в зависимости от веса и вида активности. Включает удобную таблицу размеров для универсальных, туристических, серфинговых и йогических SUP досок.
  definition: Размер паддлборда определяется объемом (грузоподъемность и плавучесть), длиной (скорость и устойчивость на курсе), шириной (стабильность) и толщиной (распределение объема и сопротивление ветру).
  tldr: 'Используйте вес для определения минимального объема: 50-70 кг требуется 220-260 л, 70-90 кг требуется 260-300 л, 90-110 кг требуется 300-350 л, более 110 кг требуется 350+ л. Для новичков добавьте 20% к этим значениям. Важно учитывать ширину: 32" — средний уровень, 33-34" — подходит для новичков, 35"+ — очень устойчивый.'
  problem: Размеры сап-серфов указываются в футах, дюймах и литрах, что затрудняет сравнение между брендами.
  explanation: Объем является самой прямой метрикой грузоподъемности — 1 литр пресной воды вытесняет 1 кг веса. Доска объемом 260 л теоретически может поддерживать 260 кг, но практическая грузоподъемность ниже, потому что доска должна находиться над водой. Ваш общий вес (тело плюс снаряжение) должен составлять 30-40% от объема доски.
  solution: Целевой объем = (масса тела в кг + масса снаряжения в кг) x 3. Для гребца весом 75 кг с снаряжением 5 кг, целевой объем = 80 x 3 = минимум 240 л. Для новичков умножайте на 3,5. Для продвинутых умножайте на 2,5.
  recommendation: Paddle Board Overstock SUP Explorer 11 (260л, 11' x 33" x 6") подходит большинству райдеров весом 50-100 кг. Более легкие райдеры могут выбрать размер AirDeck 270. Для более тяжелых райдеров стоит рассмотреть SUP Tour 12 (300л+) или более широкие доски.
  faq:
    - q: Имеет ли рост значение для размера SUP?
      a: Рост имеет меньшее значение, чем вес. Высокий легкий райдер требует меньшего объема, чем низкий тяжелый райдер. Используйте вес как основной показатель объема.
    - q: Что происходит при слишком большой громкости?
      a: Доска сидит слишком высоко, ловя ветер как парус. В мелкой рябь кажется «пробковой». Тем не менее, для новичков лишний объем лучше, чем недостаточный.
    - q: Что происходит при слишком маленькой громкости?
      a: Доска сидит слишком глубоко, создавая сопротивление. Нос может нырять во время гребли (пирлинг). Вы быстро устаете от гребли на частично погруженной доске.
    - q: Нужны ли надувные доски другого размера по сравнению с жесткими досками?
      a: Не значительно. Надувные изделия при 15+ PSI вытесняют воду аналогично жестким доскам. Рекомендации по объему применимы одинаково к обоим типам.
