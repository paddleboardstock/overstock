- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Правила этикета серфинга (как не быть человеком, которого все избегают)
  description: В стойке есть свои правила, и никто их не записывает. Узнайте, кто имеет преимущество, почему за извивание на волне вас могут ругать, как извиняться и какие типичные ошибки новичков раздражают всех местных серферов.
  definition: 'Этикет серфинга — это неписаный кодекс поведения, который предотвращает столкновения и обеспечивает справедливое распределение волн. Основное правило: серфер, находящийся ближе всего к гребню ломающейся волны, имеет преимущество.'
  tldr: Сёрфер, находящийся ближе всего к гребню ломящейся волны, имеет преимущество. Не вклинивайтесь в чужую волну, не обгоняйте других (не гребите вокруг кого-то, чтобы забрать его волну) и всегда извиняйтесь, если совершили ошибку. Гребите широко вокруг линии ожидания, держите доску при себе и будьте дружелюбны — уважение заслуживает уважения.
  problem: Вы гребёте к переполненной очереди и сразу же чувствуете напряжение. Серферы смотрят на вас искоса, кто-то кричит на вас, и вы не уверены, что сделали неправильно. Социальная сторона серфинга кажется более пугающей, чем сами волны.
  explanation: 'Этикет на серфинге существует, чтобы предотвращать столкновения и справедливо делить волны. Основное правило — право проезда: приоритет имеет серфер, находящийся ближе всего к пику (месту, где волна начинает ломаться). Любой, кто гребет на эту же волну из более внутренней позиции, должен уступить. «Снейкинг» — обгон другого серфера, чтобы отобрать приоритет — считается самым худшим нарушением. Помимо приоритета, на линии есть ожидания относительно шума (сведите крики к минимуму), контроля доски (никогда не подпускайте свою доску к другим) и доброжелательности (простой кивок может многое значить).'
  solution: Смотрите на линию волн в течение 10 минут перед тем, как грести. Определите, кто ловит больше всего волн — это те серферы, которых нужно уважать и избегать. Если вы учитесь, оставайтесь ближе к берегу (в зоне белой воды). Грести в обход линии волн, а не через неё. Когда вы поймаете волну, смотрите по обе стороны перед тем, как вставать, и убедитесь, что никого нет глубже.
  recommendation: Проведите первые несколько сессий на месте, подходящем для новичков, с редкими людьми на волнах. Научитесь определять приоритет, прежде чем пробовать кататься в многолюдной линии. Если вы случайно влезли на чью-то волну, сразу извинитесь и отплывайте — большинство серферов ценят честную ошибку.
  faq:
    - q: Что зашел?
      a: Врываться означает грести за волной и кататься на ней, хотя у другого серфера уже есть на неё приоритет. Это опасно и неуважительно. Серфер, находящийся ближе всего к гребню, владеет волной; все остальные должны уступить.
    - q: Что такое «снейкинг»?
      a: Снейкинг — это гребля вокруг другого серфера, который уже занял позицию для волны, чтобы оказаться ближе к пику. Это считается крайне плохим этикетом и может привести к конфликту.
    - q: Могут ли новички серфить на переполненных волн?
      a: Да, но оставайтесь в зоне белой воды подальше от пика. Не гребите в основную зону старта, пока не научитесь стабильно ловить волны и контролировать направление. На переполненных линиях подачи требуется опыт, чтобы безопасно ориентироваться.
    - q: Как мне извиниться в воде?
      a: Простого приветствия, улыбки и слов «моя вина» или «извини» достаточно. Признайте ошибку и отплывите от человека. Серферы, как правило, прощают честные ошибки, особенно если видно, что вы явно учитесь.
    - q: Что мне делать, если кто-то заходит ко мне без предупреждения?
      a: Если это явное вторжение, крикните «волна» или «эй», чтобы предупредить их. Если они поймают волну случайно и извинятся, отпустите это. Если кто-то неоднократно вторгается, подплывите и вежливо объясните приоритет. Избегайте конфронтаций.
