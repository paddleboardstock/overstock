- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Обслуживание надувного SUP: сохраняйте вашу доску на долгие годы'
  description: Правильное обслуживание надувных SUP значительно продлевает срок службы доски. Советы по чистке, сушке, уходу за клапаном, защите UV и сезонному хранению drop-stitch для SUP-досок.
  definition: Обслуживание надувного SUP включает очистку после использования, правильную сушку, проверку клапанов, UV защиту и правильное хранение для предотвращения расслоения, плесени, деградации материала и утечек воздуха.
  tldr: Промывайте вашу доску пресной водой после каждой сессии в солёной воде. Полностью высушите перед спуском и хранением. Проверяйте клапан на наличие загрязнений и смазывайте уплотнительное кольцо один раз в год. Храните накачанной (на половину PSI) в прохладном, тёмном месте. Избегайте длительного воздействия UV, которое разрушает PVC. Немедленно заделывайте небольшие проколы с помощью прилагаемого ремонтного комплекта.
  problem: После одного сезона надувная SUP начинает медленно течь, коврик на палубе отшелушивается по краям, а PVC ощущается более жестким. Пренебрежение основным уходом приводит к преждевременному старению, которого можно полностью избежать.
  explanation: PVC разрушается под воздействием UV излучения. Соль из морской воды проникает в швы и клапаны, вызывая микроподтекания. Влага внутри способствует росту плесени, которая поражает нити drop-stitch. Уплотнительные кольца клапанов высыхают и теряют герметичность. Грязь и песок втираются в клей под настилом, вызывая отслоение краев.
  solution: 'После каждого сеанса: промывайте доску, плавники и насос пресной водой. Протрите палубную накладку. Откройте клапан, чтобы слить застрявшую воду. Высушите доску в тени перед сдуванием. Ежемесячно: осматривайте клапан и наносите силиконовую смазку на уплотнительное кольцо. Сезонно: мойте мягким мылом и водой, проверяйте на проколы.'
  recommendation: Следуйте руководству по уходу Paddle Board Overstock, прилагаемому к вашей доске. Немедленно используйте ремонтный комплект при любой прокол. Храните доску в её сумке в месте с контролируемой температурой, вдали от прямых солнечных лучей.
  faq:
    - q: Могу ли я оставить свой надувной SUP надутым на весь сезон?
      a: Да, но храните вдали от прямых солнечных лучей и при половине максимального давления PSI (8-10 PSI), чтобы уменьшить нагрузку на швы. Полностью надуйте непосредственно перед использованием.
    - q: Как мне удалить плесень с моего SUP?
      a: Смешайте мягкое мыло с тёплой водой и почистите мягкой щёткой. Для стойкой плесени используйте раствор белого уксуса, разведённый водой (1:4). Избегайте отбеливателя.
    - q: Мне нужно смазать клапан?
      a: Да, ежегодно. Снимите сердечник клапана, нанесите силиконовую смазку на уплотнительное кольцо и установите обратно. Это предотвращает утечку воздуха.
    - q: Как мне хранить мой SUP на зиму?
      a: Тщательно очистите и высушите. Полностью выпустите воздух, слегка сверните (избегайте сильных сгибов) и храните в прохладном, темном, сухом месте. Избегайте мороза.
