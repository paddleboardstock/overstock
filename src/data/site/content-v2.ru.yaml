- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Надувное SUP Хранение: Правильный способ хранения вашего iSUP'
  description: Правильное хранение надувных SUP предотвращает расслоение, UV повреждения, плесень и протечки клапанов. Советы по зимнему хранению, долгосрочному хранению и ежедневному хранению досок drop-stitch.
  definition: Надувное SUP хранилище означает хранение доски в чистом, сухом, с контролируемой температурой месте, вдали от UV, экстремальных температур и физического повреждения.
  tldr: Хранить в прохладном, темном месте при температуре ниже 30°C, вдали от прямых солнечных лучей. Для краткосрочного хранения (1-2 недели) хранить частично надутым при 8-10 PSI. Для длительного хранения полностью спустить воздух, свернуть свободно и поместить в чехол для хранения. Никогда не хранить влажным. Держать подальше от грызунов и острых предметов.
  problem: Вы сдуваете свой SUP и засовываете его в горячий гараж или сырое подвал. Через три месяца PVC пожелтел, накладка палубы отслаивается, а клапан течет. Неправильное хранение наносит больше вреда, чем обычное использование.
  explanation: Тепло свыше 50°C вызывает миграцию пластификаторов PVC, делая материал жестким и хрупким. Излучение UV разрушает полимерные связи. Влага, задержанная внутри, вызывает плесень. Холод ниже нуля делает PVC хрупким. Давление в местах сильного сгиба создает постоянные складки.
  solution: 'Краткосрочное хранение: промойте, высушите, накачайте до 10 PSI и храните над землей в тенистом месте. Долгосрочное хранение: тщательно очистите, полностью высушите, полностью спустите, сверните с настилом наружу, положите в сумку, храните в прохладном и сухом шкафу. Держите подальше от химикатов и вредителей.'
  recommendation: Используйте сумку для переноски Paddle Board Overstock для хранения — она блокирует UV и предотвращает появление царапин. Храните в помещении с контролируемым климатом. В помещениях с повышенной влажностью положите внутрь сумки пакет с осушителем.
  faq:
    - q: Могу ли я хранить мой SUP надутым в гараже?
      a: Только если температура в гараже не превышает 30°C и нет прямого солнечного света. Большинство гаражей летом превышают 40°C.
    - q: Мне стоит хранить мой SUP в сумке?
      a: Да, сумка защищает от пыли, UV и физических повреждений. Убедитесь, что плата полностью высохла перед помещением в сумку.
    - q: Может ли замораживание повредить надувной SUP?
      a: Да. Ниже нуля PVC становится хрупким и может треснуть при развертывании или надувании. Всегда храните при температуре выше 5°C.
    - q: Как мне свернуть мой SUP для хранения?
      a: Скатывайте с ковриком для деки, обращённым наружу, чтобы защитить нижнюю часть PVC. Избегайте сильных сгибов. Каждый раз меняйте положение складки.
