  title: 'Планирование погоды для водных видов спорта: читайте прогноз как профессионал'
  description: Как читать морские прогнозы погоды для SUP, серфинга и катания на лодках. Понимание фронтов, систем давления, ветровых схем и предупреждений о погоде для планирования безопасных занятий.
  definition: Планирование погоды означает интерпретацию морских прогнозов — скорости и направления ветра, высоты и периода волн, осадков, видимости и предупреждений о сильной непогоде.
  tldr: 'Проверяйте три прогноза перед каждой сессией: ветер, прибой и погода. Лучшие условия: лёгкий оффшорный ветер, умеренный прибой, высокое или растущее давление. Избегайте: гроз, сильного оффшорного ветра, тумана и быстро падающего давления.'
  problem: Вы едете на побережье, основываясь на прогнозе на 3 дня, который обещал хорошие условия, только чтобы обнаружить ветер 25 узлов и дождь. Морскую погоду трудно предсказать.
  explanation: Высокое давление приносит стабильную погоду и лёгкий ветер. Низкое давление приносит ветер и штормы. Градиент давления определяет скорость ветра. Холодные фронты вызывают внезапные изменения направления ветра. Местные явления, такие как морские бризы, могут преобладать над общим прогнозом.
  solution: 'Используйте несколько источников: Windy.com, NOAA, местные камеры сёрфинга. Проверяйте прогноз на 24 часа вперёд и снова утром в день события. Ищите согласованность прогнозов между моделями. Изучайте местные микроклиматы.'
  recommendation: Добавьте Windy.com в закладки для своих мест. Носите телефон в водонепроницаемом чехле. Для лодок имейте при себе радиостанцию VHF для получения метеосводок. В случае сомнений оставайтесь на берегу.
  faq:
    - q: Какую погоду мне следует избегать для SUP?
      a: Грозы (молнии), туман (видимость ноль), ветер с моря более 10 узлов, ветер более 20 узлов, падающее давление.
    - q: Насколько точны морские прогнозы?
      a: Прогнозы на 3 дня примерно на 80% точны. Прогнозы за день до события на 90% точны для ветра.
    - q: Какой барометрический тренд считается хорошим для водных видов спорта?
      a: Растущее или стабильное давление указывает на улучшение погодных условий. Падающее давление (1+ мб/час) указывает на приближение шторма.
    - q: Могу ли я SUP в тумане?
      a: Не рекомендуется. Если вы попали в туман, используйте компас или GPS, свистите каждые 30 секунд и оставайтесь близко к берегу.
