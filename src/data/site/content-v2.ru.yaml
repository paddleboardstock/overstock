  title: 'Ремонт надувных SUP: устранение проколов, утечек и проблем с клапаном'
  description: Самостоятельное руководство по ремонту надувного SUP. Как найти медленную утечку, заделать прокол, заменить клапан и исправить расслаивание палубной накладки с помощью прилагаемого ремонтного набора.
  definition: Ремонт надувного SUP включает обнаружение утечек воздуха с помощью мыльного раствора, очистку и шершавление поврежденной области, нанесение клея PVC и заплаты, а затем отверждение под давлением.
  tldr: Находите утечки с помощью мыльной воды. Очистите и зашкурьте область вокруг прокола наждачной бумагой. Нанесите клей PVC как на заплатку, так и на доску, подождите 5 минут, плотно прижмите и оставьте под грузом на 24 часа для застывания. Для утечек клапана сначала проверьте уплотнительное кольцо. Небольшие проколы до 1/4" легко устранить самостоятельно.
  problem: Вы надуваете свой SUP, и к утру он теряет давление. Без знаний по ремонту вам грозит дорогостоящая замена того, что, вероятно, является простой прокол.
  explanation: 'Большинство надувных SUPs используют сердечник drop-stitch с внешними слоями PVC. Прокол через внешнюю PVC создает медленную утечку. Стандартный ремонт: очистить, отшлифовать, нанести клей, совместимый с PVC, прижать заплатку под давлением. Протечки клапана встречаются чаще, чем проколы панели — уплотнительное кольцо высыхает или мусор мешает плотному закрытию.'
  solution: Надуйте доску до максимума PSI и слушайте шипение. Систематически распыляйте мыльную воду, особенно вокруг швов и клапана. Отметьте места с пузырьками. Сдуйте, очистите спиртом, зашлифуйте шкуркой зернистостью 80, нанесите клей PVC на заплатку и доску, дождитесь пока станет липким, плотно прижмите, положите груз на 24 часа.
  recommendation: Используйте Paddle Board Overstock ремонтный комплект, включённый во все Paddle Board Overstock платы. Всегда берите ремонтный комплект с собой в поездки. При проблемах с клапаном обращайтесь в службу поддержки Paddle Board Overstock. При больших разрывах или расхождении швов рекомендуется профессиональный ремонт.
  faq:
    - q: Могу ли я починить большой разрыв в моей надувной SUP?
      a: Разрывы размером более 1 дюйма могут потребовать профессионального ремонта или заплатки с обеих сторон. Разделения шва вдоль направляющей нельзя надежно отремонтировать в полевых условиях.
    - q: Как долго служит ремонтная заплата?
      a: Правильный ремонт с использованием правильной техники служит весь срок службы доски. Плохое сцепление из-за недостаточной очистки приводит к будущим повреждениям.
    - q: Могу ли я отремонтировать протекающий клапан?
      a: Часто да. Снимите сердцевину клапана, осмотрите уплотнительное кольцо, очистите или замените его, нанесите силиконовую смазку и установите обратно.
    - q: Что если я не смогу найти утечку?
      a: Надуйтесь до полного PSI и последовательно погружайте секции в ванну или бассейн. Утечки, слишком маленькие, чтобы их найти, могут быть связаны с температурой.
