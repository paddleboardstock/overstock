  title: 'SUP Руководство по размерам: длина, ширина и объем объяснены'
  description: Выберите правильный размер SUP исходя из вашего веса, уровня навыков и стиля гребли. Длина определяет курс, ширина — стабильность, а объем — грузоподъемность.
  definition: Размер SUP определяется длиной (скорость и скольжение), шириной (основная стабильность), толщиной (вторичная стабильность и объем) и объемом в литрах (общая грузоподъемность).
  tldr: 'Универсальная доска SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280 л). Туринговая: 12''-14'' x 30"-32" (280-350 л). Серфинг: 8''-10'' x 30"-32" (140-220 л). Начинающим нужна ширина более 32" и объем, превышающий вес тела на 60-80 л. Ваш вес в кг плюс 60 л — минимальная цель по объему для стабильности.'
  problem: Каждый бренд SUP указывает размеры досок в футах, дюймах и литрах, но, не зная, как эти измерения переводятся в реальные ощущения, вы рискуете купить доску, которая будет неустойчивой, медленной или не сможет выдержать ваш вес.
  explanation: 'Длина определяет, насколько быстро доска гребет и как хорошо держит курс по прямой. Длинные доски (12'') скользят между гребками и держат линию. Короткие доски (менее 10'') легко поворачивают, но требуют более частой смены весла. Ширина определяет основную стабильность — устойчивость при стоянии. Доска шириной 30" кажется начинающим шаткой; 34" ощущается как причал. Толщина определяет объем — более толстая доска выше держится на воде, но сильнее ловит ветер. Объем в литрах — лучший единый показатель: загруженная доска (вы и снаряжение) должна погружаться на 5-10 см в состоянии покоя.'
  solution: 'Сопоставьте размеры доски с тремя факторами: вашим весом (определяет минимальный объем), основной деятельностью (определяет длину) и уровнем навыков (определяет ширину). Для начинающих умножьте вес в килограммах на 2,2, чтобы получить минимальное количество литров. Для продвинутых — умножьте на 1,8. Для опытных — умножьте на 1,4.'
  recommendation: Каяк Paddle Board Overstock SUP Explorer 11 размером 11' x 33" x 6" с объемом 260 л подходит большинству гребцов до 100 кг для универсального использования. Переходите на SUP Tour 12 размером 12' x 31" для большей скорости и скольжения при туринговой гребле.
  faq:
    - q: Какой размер SUP мне нужен для моего веса?
      a: 'Для райдеров весом до 70 кг: 10-11'' x 32" (220-260 л). Для 70-90 кг: 11-12'' x 33" (260-300 л). Для 90-110 кг: 11-12'' x 34" (300-350 л). Для более 110 кг: 12'' x 34-36" (350 л+).'
    - q: Является ли более длинный SUP быстрее?
      a: Да. Более длинные доски имеют лучшее соотношение длины и ширины, что снижает сопротивление. 14-футовая туристическая доска SUP значительно быстрее, чем 11-футовая универсальная доска при одинаковых усилиях на греблю.
    - q: Какая SUP ширина стабильна для начинающих?
      a: 33-34 дюйма — это оптимальный размер для начинающих весом до 90 кг. Ниже 32 дюймов требуется хорошее чувство баланса. Выше 34 дюймов очень устойчиво, но медленнее и сложнее грести при ветре.
    - q: Могу ли я использовать универсальную доску для туринга?
      a: Да, для коротких поездок до 10 км. Для больших расстояний специализированная туристическая доска лучше держит курс и эффективнее преодолевает расстояние.
