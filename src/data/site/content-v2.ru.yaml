  category: guide
  type: safety
  title: 'SUP Самоспасение: Как вернуться на доску в глубокой воде'
  description: Каждому SUP гребцу следует освоить самоспасение. Пошаговые техники возвращения на доску в глубокой воде, буксировки её к берегу и справления с запутыванием страховочного шнура.
  definition: SUP самоспасение — это техника повторного посадки на вашу доску для гребли в глубокой воде после падения, включая возврат доски, повторную посадку тела и возвращение весла.
  tldr: 'После падения: сохраняйте спокойствие, держитесь за весло, плывите к доске. Разместите весло поперек доски. Используйте плавник дельфина, чтобы протолкнуть грудь на доску. Поднимите одну ногу, затем другую. Сначала встаньте на колени, затем поднимитесь. Практикуйтесь в спокойной воде, пока это не станет мышечной памятью.'
  problem: Вы падаете с вашего SUP в глубокую воду и не можете вернуться на него. Доска скользкая, вы устали, и возникает паника. Не зная техники самоспасения, простой падение становится опасным.
  explanation: 'Самоспасение имеет три этапа: восстановление (плыть к доске и грести), повторное поднятие на доску (вернуться на доску) и продолжение (возобновить греблю). Ключевая техника заключается в использовании весла как стабилизатора и мощных ударов ногами для продвижения верхней части тела на доску.'
  solution: 'Этап 1: переплыть к доске. Держите весло или достаньте его. Этап 2: разместите весло перпендикулярно через доску. Активно пинайте ногами, одновременно подтягивая грудь к центру доски. Этап 3: как только грудь окажется на доске, поочередно поднимайте ноги. Этап 4: встаньте на колени, отдышитесь, затем постепенно встаньте на ноги.'
  recommendation: Практикуйте само-спасение в контролируемых условиях, пока не сможете делать это автоматически. Используйте Paddle Board Overstock SUP Explorer 11, который имеет хорошее сцепление с палубой. Страховой жилет Pro обеспечивает дополнительную плавучесть, если вам трудно.
  faq:
    - q: Как мне вернуться, если я истощён?
      a: Оставайтесь на доске для плавучести. Используйте руки, чтобы подтянуть грудь на доску, даже если ноги не могут эффективно пинать. Отдыхайте в коленной позиции перед тем, как встать.
    - q: Что если я потеряю весло?
      a: Используйте руки, чтобы грести доской к берегу. Попросите помощи у другого гребца. Немедленно замените потерянную весло.
    - q: Могу ли я самостоятельно спастись в волнах?
      a: Да — расположите доску перпендикулярно волнам. Синхронизируйте повторное взбирание на доску между волнами. Поводок удерживает доску поблизости.
    - q: Как мне справиться с запутанным поводком?
      a: Оставайтесь спокойными, плавайте на спине, медленно распутывайте поводок. Если поводок обернулся вокруг плавников, возможно, потребуется снять плавники прямо в воде.
