  title: Руководство по размерам серфборда (объем — это то, что действительно имеет значение)
  description: Хватит угадывать размеры досок для серфинга. Объем в литрах определяет всё — как легко вы ловите волны, насколько вы чувствуете себя устойчиво и как быстро вы прогрессируете. Найдите свой целевой объем в литрах за 2 минуты.
  definition: Размер серфборда в первую очередь определяется объемом (литры), а не длиной. Объем определяет плавучесть и способность ловить волны. Более длинные доски гребут быстрее; более широкие доски более устойчивы; более толстые доски обеспечивают больший объем без увеличения длины.
  tldr: 'Размер серфборда определяется объемом, а не только длиной. Начинающим требуется 60-80 литров, среднему уровню 35-55 литров, а опытным серферам 20-35 литров. Используйте свой вес в качестве основного фактора: каждые 10 кг требуют примерно 10-12 литров объема на начальном уровне.'
  problem: Стоя перед стойкой с серфбордами, на которых на рельсе напечатаны размеры вроде 7'2" x 22" x 3", вы не имеете понятия, как эти размеры ощущаются в воде. Покупка, основываясь на внешнем виде или том, на чём катается друг, приводит к доске, которая либо слишком нестабильна, либо слишком тяжела для гребли.
  explanation: 'Размер доски для серфинга лучше всего определяется тремя измерениями: длиной (мощность при гребле и ловля волны), шириной (стабильность) и толщиной (объем и плавучесть). Реальное число, которое имеет значение — это объем в литрах. Пенопластовые доски и надувные доски достигают большого объема за счет ширины и толщины, а не чрезмерной длины, что делает их удобными для новичков. По мере вашего совершенствования вы уменьшаете объем, чтобы доска погружалась глубже в водную поверхность волны и поворачивалась более отзывчиво.'
  solution: 'Используйте калькулятор объема к весу: для начинающих разделите свой вес в килограммах на 1,5, чтобы получить целевой объем в литрах. Для продвинутых разделите на 2. Продвинутым следует искать доски со средним рокером и квадратным или круглым хвостом для универсальности.'
  recommendation: Paddle Board Overstock Surfboard Pro предлагает 75 литров объема в комплекте длиной 10'6" — идеально для начинающих весом до 90 кг. Более легкие райдеры могут выбрать SUP Tour 12 для более маневренного ощущения по мере прогресса.
  faq:
    - q: Имеет ли рост значение для размера серфборда?
      a: Рост имеет меньшее значение, чем вес. Высокому, лёгкому серферу требуется меньше объёма, чем низкому, тяжёлому серферу того же роста. Используйте вес как главный показатель и корректируйте его с учётом физической формы и силы гребка.
    - q: Что произойдет, если у моей платы слишком большой объем?
      a: Слишком большой объём делает доску «пробковой» и нестабильной на волне. Вам будет трудно погружать рейл для поворотов, и при нижних поворотах вы можете отскакивать от воды.
    - q: Что произойдет, если у моей платы слишком мало объема?
      a: Вам будет трудно грести, чтобы войти в волны, вы будете слишком глубоко уходить на старте и чувствовать себя нестабильно, просто сидя на доске в ожидании. Начинающим почти всегда требуется больше объема, чем они думают.
    - q: Как мне узнать, когда нужно выбрать меньший размер?
      a: Когда вы можете последовательно ловить волны, плавно вставать и выполнять базовые повороты на вашей текущей доске, пора уменьшить размер на 5-10 литров. Слишком раннее уменьшение размера замедляет ваш прогресс.
