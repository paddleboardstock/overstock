  title: 'SUP Руководство по веслам: Выберите правильное весло для вашего стиля'
  description: Полное руководство по веслам SUP — длина, материалы (алюминий, стекловолокно, карбон), формы лопастей и то, как выбор весла влияет на ваш опыт гребли.
  definition: Весло SUP состоит из ручки (алюминий, стекловолокно или карбон) и лопасти (двустворчатая, черпак или плоская). Длина должна быть на 8-10 дюймов больше вашего роста для обычной гребли.
  tldr: 'Длина весла: на 8-10 дюймов выше вашего роста для универсального использования, на 6-8 дюймов для серфинга, на 10-12 дюймов для туризма. Материалы: алюминий (дешево, тяжело), стекловолокно (средняя цена, хорошая гибкость), карбон (легкий, жесткий, дорогой). Форма лопасти: диэдральная (стабильное движение по прямой), черпаковая (мощность), плоская (универсальная). Регулируемые весла отлично подходят для новичков.'
  problem: В комплекте поставляется весло, которое работает с большинством iSUPs, но оно тяжёлое и неэффективное. Улучшение весла повышает эффективность гребли и удовольствие от неё, но варианты выбора сбивают с толку.
  explanation: 'Длина весла влияет на эффективность гребка — слишком короткое требует наклона вперед, слишком длинное вызывает усталость плеч. Материал определяет вес: карбоновые весла весят 18–24 унции, в то время как алюминиевые — 28–36 унций. Размер лопасти влияет на мощность: более крупные лопасти (более 100 кв. дюймов) обеспечивают большее продвижение за один гребок, но утомляют быстрее. Лопасти с диэдральной формой идут прямо; лопасти с выемкой обеспечивают лучшее захватывание воды.'
  solution: 'Для правильной длины: встаньте с веслом вертикально, поднимите руку вверх — рукоятка весла должна касаться вашего запястья. Для материала: начните с стекловолокна в качестве среднего по весу улучшения. Для лопасти: выберите диэдральную для общего гребка. Для занятий: туристические весла длиннее с меньшими лопастями; серфовые весла короче с более широкими лопастями.'
  recommendation: Углеродное весло Paddle Board Overstock весом 28 унций является лучшим обновлением для частых гребцов. Включённое регулируемое алюминиевое трёхсекционное весло подходит для начинающих и для путешествий.
  faq:
    - q: Какой длины должна быть моя SUP весло?
      a: Измерьте свой рост в дюймах и прибавьте 8-10 для универсальной гребли. Для серфинга прибавьте 6-8. Для туринга прибавьте 10-12.
    - q: Стоит ли карбоновая весло своих денег?
      a: Да, для обычных гребцов — уменьшение веса значительно снижает усталость при долгих заплывах. Для редкого использования стекловолокно — хорошее соотношение цены и качества.
    - q: Что такое регулируемая весло?
      a: Весло из 2 или 3 частей с регулировкой длины, идеально подходит для совместного использования или настройки для разных видов деятельности.
    - q: Как ухаживать за моей веслой?
      a: Промывайте пресной водой после использования в солёной воде. Избегайте езды по нему или хранения на прямом солнце. Проверяйте на сандвичи (соединение) на наличие песка.
