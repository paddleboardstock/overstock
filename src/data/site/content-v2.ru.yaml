  title: 'Paddle Board Overstock SUP Обзор Internet Explorer 11: Полный обзор'
  description: Подробный обзор Paddle Board Overstock SUP Explorer 11 — характеристики, реальная производительность, качество сборки, включенные аксессуары и для кого предназначен этот универсальный надувной SUP.
  definition: Paddle Board Overstock SUP Explorer 11 — это надувная сап-доска размером 11' x 33" x 6" с объемом 260 л, трёхслойным военного класса PVC и максимальным давлением 18 PSI.
  tldr: 'SUP Explorer 11 — это флагманский универсальный iSUP компании Paddle Board Overstock. Длина 11 футов и ширина 33 дюйма обеспечивают баланс стабильности и производительности для райдеров весом 50–100 кг. Основные характеристики: объем 260 л, макс. 18 PSI, трёхслойный PVC, дэнс-максимальная EVA накладка на деку. Цена около $599. Наилучшее для рекреационного заплыва, фитнеса, йоги и начинающего серфинга.'
  problem: Вы хотите один SUP, который делает всё — плавание по спокойной воде, лёгкий туризм, йогу и серфинг для новичков — без необходимости нескольких досок.
  explanation: SUP Explorer 11 использует трёхслойный армейский PVC с высокоплотным drop-stitch для жёсткости при 18 PSI. Планирующий корпус обеспечивает хорошую всестороннюю производительность. Полноразмерная EVA палубная накладка обеспечивает сцепление. Шесть D-образных колец предоставляют точки крепления. Американский футер корсака принимает стандартные плавники. Общий вес составляет 11,5 кг.
  solution: Накачайте до 15-18 PSI, прикрепите прилагаемый центральный плавник, и у вас будет универсальная доска. Ширина 33 дюйма обеспечивает отличную устойчивость. Используйте систему багажной резинки для снаряжения. Рюкзак облегчает транспортировку и хранение.
  recommendation: На $599, надувной SUP Explorer 11 от SUP — это лучшее по соотношению цены и качества универсальное надувное средство в своём классе. Купите его для одной доски, которая справляется со всем. Сочетайте с гидрокостюмом Paddle Board Overstock Wetsuit Pro и спасательным жилетом Life Vest Pro.
  faq:
    - q: Подходит ли SUP Explorer 11 для начинающих?
      a: Да — ширина 33 дюйма и объем 260 л обеспечивают отличную устойчивость. Новички будут чувствовать себя уверенно, стоя и гребя.
    - q: Могу ли я серфить с SUP Explorer 11?
      a: Да, при условиях от начинающего до среднего уровня. Длина 11 футов требует более широких, медленных волн.
    - q: Какой вес может выдержать SUP Explorer 11?
      a: Максимальный вес всадника составляет примерно 100 кг для оптимальной работы. Общая грузоподъемность составляет около 120 кг.
    - q: Что включено в коробку?
      a: Доска, двухкамерный насос, регулируемая весло из 3 частей, рюкзак на колёсах, свернутый поводок, съемное центральное плавник и комплект для ремонта.
