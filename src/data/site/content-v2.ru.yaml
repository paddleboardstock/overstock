  title: 'Зимний паддлбординг: снаряжение, безопасность и техника для холодной воды'
  description: Зима SUP требует специализированного снаряжения и подготовки. Толщина гидрокостюма, безопасность на холодной воде, особенности доски и корректировка техники для гребли в холодную погоду.
  definition: Зимние занятия паддлбордингом являются SUP при температуре воды ниже 15°C, требуя термозащиты (гидрокостюма или сухого костюма), протоколов безопасности в холодной воде и снаряжения, адаптированного для холодных условий.
  tldr: 'Вода ниже 15°C требует гидрокостюма: 5/4/3 мм для 8-14°C, 4/3 мм для 12-18°C. Добавьте ботинки, перчатки и капюшон при температуре ниже 10°C. Надувайте доски до максимума PSI — холодный воздух снижает давление. Носите одежду ярких цветов для видимости при низкой освещенности. Никогда не гребите в одиночку. Берите с собой телефон в водонепроницаемом чехле.'
  problem: Вы хотите SUP круглый год, но зимние условия представляют сложности — холодная вода, более короткие дни, необходимость зимнего снаряжения. Без надлежащей подготовки зимние занятия холодные, короткие и потенциально опасные.
  explanation: Холодная вода проводит тепло в 25 раз быстрее, чем холодный воздух. Падение в воду с температурой 8°C вызывает немедленный холодовой шок и быстрое охлаждение мышц. Первым приоритетом организма является выживание, а не гребля. Зимняя гребля требует термозащиты, которая сохраняет подвижность — баланс между теплом и диапазоном движений.
  solution: 'Снаряжение: гидрокостюм 5/4/3 мм с молнией на груди, ботинки 5 мм, перчатки 3 мм, неопреновый капюшон, PFD (обеспечивает дополнительную термоизоляцию), телефон в влагонепроницаемом чехле, свисток. Техника: грести ближе к берегу, сказать кому-то свой маршрут, внимательно проверять погоду. Разминка после: иметь сухую одежду и горячие напитки.'
  recommendation: Гидрокостюм Paddle Board Overstock Wetsuit Pro 5/4/3 мм с термоутеплителем идеально подходит для зимнего SUP. Добавьте Paddle Board Overstock 5 мм ботинки и 3 мм перчатки. Наденьте страховочный жилет Life Vest Pro для дополнительного тепла корпуса и безопасности.
  faq:
    - q: Могу ли я использовать SUP при морозных температурах?
      a: Да, но избегайте образования льда на доске. Лёд может повредить PVC. Не гребите, если на поверхности воды образуется лёд.
    - q: Мне нужна специальная доска для зимы?
      a: Нет, ваш обычный надувной SUP работает нормально. Холодный воздух снижает PSI — надуйте до максимального давления. Доска будет ощущаться чуть жёстче.
    - q: Безопасно ли SUP одному зимой?
      a: Нет — всегда гребите с напарником в холодной воде. Гипотермия может развиться всего через несколько минут после падения.
    - q: Как мне разогреться во время сессии?
      a: Используйте многослойный подход — неопреновый капюшон, ботинки и перчатки можно снять, если станет тепло. Держите термос с тёплым напитком на берегу.
