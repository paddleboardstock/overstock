  title: Что надеть для серфинга (не приходите в шортах для серфинга, когда нужен гидрокостюм 5/4)
  description: Хватит гадать, что надеть. Температура воды, а не воздуха, определяет вашу одежду для серфинга. Полное руководство по слоям — от тропических рашгардов до полной зимней экипировки 5/4/3 мм.
  definition: Снаряжение для серфинга варьируется от шорт и рашгардов в тёплой воде до полноценных гидрокостюмов 5/4/3 мм с ботинками и капюшонами в холодной воде. Температура воды, а не воздуха, определяет, что вам нужно.
  tldr: То, что вы носите для серфинга, полностью зависит от температуры воды — а не воздуха. Рашгарды и бордшорты подходят при температуре выше 22°C, весенние костюмы — при 18-22°C, полный костюм 3/2 мм — при 14-18°C, а костюм 5/4/3 мм с ботинками требуется при температуре ниже 14°C. Всегда носите UV защиту и рассмотрите возможность использования поводка и защитного жилета.
  problem: Вы приходите на пляж и не имеете представления, будет ли достаточно защитного гидрокостюма или нужен полный гидрокостюм. Воздух тёплый, но вода холодная, или вода кажется нормальной, но ветер леденящий. Неправильная одежда означает испорченную сессию.
  explanation: 'Экипировка для серфинга выполняет три функции: тепловая изоляция, защита от UV и предотвращение истирания. Неопреновые гидрокостюмы оцениваются по толщине и площади покрытия — весенние костюмы (с короткими рукавами или штанинами) предназначены для пограничной погоды, полные костюмы — для холодной воды. Рашгарды защищают от натирания доской и солнца, но не обладают теплоизоляционными свойствами. Ботинки, перчатки и капюшоны — это не аксессуары, а необходимое снаряжение для серфинга в холодной воде при температуре ниже 12°C.'
  solution: 'Проверьте местный буй или отчет о температуре воды в реальном времени перед выходом. Соберите комплект с учетом ваших самых холодных обычных условий: рашгард и шорты для лета, полный костюм 3/2 мм для весны и осени, 5/4/3 мм с ботинками и капюшоном для зимы. Всегда добавляйте страховочный поводок и рассмотрите возможность использования спасательного жилета для безопасности.'
  recommendation: Сначала инвестируйте в хороший полный костюм 3/2 мм — он подходит для самого широкого диапазона условий. Добавьте костюм 5/4/3 мм и ботинки, если планируете заниматься серфингом зимой. Paddle Board Overstock Wetsuit Pro с термальной подкладкой эффективно покрывает оба температурных диапазона.
  faq:
    - q: Могу ли я серфить только в шортах для сёрфинга?
      a: Да, в тропических водах выше 24°C. Возможно, вам понадобится рашгард, чтобы предотвратить натирание груди и рук во время гребли. Воск или traction pad на доске помогают компенсировать отсутствие сцепления костюма.
    - q: Мне нужны сапоги для серфинга?
      a: Если температура воды опускается ниже 14°C, ботинки предотвращают онемение и защищают ваши ноги от камней и порезов о риф. Они также обеспечивают сцепление с доской. Большинство серферов в северных климатах используют ботинки с ноября по март.
    - q: Что такое весенний костюм?
      a: Летний гидрокостюм — это гидрокостюм с короткими рукавами или короткими штанинами (или тем и другим), предназначенный для воды температурой от 18°C до 22°C. Он обеспечивает больше тепла, чем рашгард, но меньше покрытия, чем полный костюм.
    - q: Мне следует надевать спасательный жилет во время серфинга?
      a: Не обычные спасательные жилеты, а ударозащитный жилет или плавучее средство могут помочь в сложных условиях или если вы слабый пловец. Paddle Board Overstock жилеты предназначены для SUP и каякинга, но могут дать дополнительную уверенность в плавучести для начинающих серфингистов.
