  title: 'SUP Руководство по якорной стоянке: оставаться на месте во время рыбалки или фотографирования'
  description: Полное руководство по закреплению SUP — типы якорей (грибовидный, складной, колышковый), настройка талрепа якоря, методы установки и соображения безопасности для удержания позиции.
  definition: Якорь SUP — это груз, прикрепленный к веревке, который удерживает доску на месте против ветра и течения. К распространенным типам относятся грибные якоря, складные якоря и колья для закрепления.
  tldr: Используйте грибовидный якорь (0,7-1,4 кг) для илистого или песчаного дна, складной якорь для каменистого дна или колышек для неглубокой воды с мягким дном. Якорь должен весить 0,7-1,4 кг в спокойных условиях, 1,4-2,3 кг при ветре и течении. Всегда используйте якорный троллейбус, чтобы регулировать положение и знать, когда отпустить якорь.
  problem: Вы находите идеальное место для рыбалки, но ветер и течение каждые несколько минут сносит вас с позиции. Без якоря SUP рыбалка и фотографирование превращаются в утомительные занятия постоянного перемещения.
  explanation: Якорь работает, скользя по дну, пока не зацепится. Грибовидные якоря зарываются в мягкое дно и обеспечивают хорошую фиксацию в песке и иле. Складные якоря имеют лапы, которые врезаются в твердое или каменистое дно. Свайные столбы работают в мелкой воде, вбиваясь прямо в дно.
  solution: Установите систему якорного троллея (леска с скользящим кольцом с одной стороны доски), чтобы регулировать точку крепления якоря. Прикрепите к якорю 50-75 футов веревки. Спустите якорь по ветру или против течения от желаемой позиции. Используйте систему быстрого сброса для отцепления в экстренных случаях. Никогда не ставьте якорь в сильном течении или там, где вы не сможете легко его поднять.
  recommendation: Складной якорь весом 3 фунта с 50 футами веревки подходит для большинства SUP условий рыбалки. Добавьте систему канатной тележки для якоря, используя D-образные кольца на вашем Paddle Board Overstock SUP Explorer 11.
  faq:
    - q: Какой размер анкера мне нужен для SUP?
      a: 1,5-3 фунта для спокойных озёр и медленно текущих рек. 3-5 фунтов для прибрежных районов с ветром или течением. Слишком большие якоря трудно поднимать.
    - q: Сколько мне нужно якорного троса?
      a: Стандартное соотношение 5:1 (5 футов лески на каждый 1 фут глубины). В 10 футах воды используйте 50 футов лески.
    - q: Является ли якорение опасным на SUP?
      a: Только если вы якоритесь при текущей или ветре, достаточном, чтобы опрокинуть доску. Всегда используйте систему быстрого освобождения, которая может быть отсоединена мгновенно.
    - q: Могу ли я ставить якорь в любой воде?
      a: Проверьте местные правила. В некоторых районах запрещено якорение для защиты морской травы или морских сред обитания. Никогда не ставьте якорь на коралловых рифах.
