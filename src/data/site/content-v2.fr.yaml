- slug: types-of-surfboards-explained
  category: guide
  type: technical
  title: Les types de surfboards expliqués (lequel vous convient ?)
  description: >-
    Shortboard, longboard, fish, hybride, mousse — déjà perdu ? Voici chaque
    type de surfboard décomposé par profil d'utilisateur, type de vagues
    requises et lequel acheter en premier.
  definition: >-
    Les principaux types de surfboards sont les longboards (9 pi et plus,
    stables, faciles), les shortboards (5-7 pi, réactifs, avancés), les
    planches en mousse/gonflables (volume élevé, sûres pour débutants) et les
    hybrides (7-9 pi, point médian polyvalent). Chacun convient à différents
    niveaux de compétence et conditions de vagues.
  tldr: >-
    Les quatre principaux types de surfboards sont les shortboards
    (performance, volume faible), les longboards (stables, tranquilles), les
    planches en mousse/gonflables (adaptées aux débutants, volume élevé) et les
    hybrides ou funboards (polyvalence de taille moyenne). Chaque type convient
    à un niveau et un style de surf différents. Choisissez votre planche selon
    votre position dans la courbe d'apprentissage et le type de glisse que vous
    préférez.
  problem: >-
    Les noms des surfboards sont déroutants : mini-mal, egg, fish, gun, hybride,
    retro twin — la liste est longue. Vous voulez savoir quel type de planche
    correspond à votre niveau et à vos vagues locales sans acheter cinq planches
    différentes pour le découvrir.
  explanation: >-
    Les longboards font 9 pieds et plus, sont épaisses et ont un nez arrondi —
    elles attrapent les vagues tôt et pagayent sans effort. Les shortboards font
    5-7 pieds avec un nez pointu et un rocker agressif — ils exigent une pagaie
    puissante et une technique précise mais offrent des performances maximales.
    Les planches en mousse et gonflables imitent les formes des longboards dans
    des formats à volume élevé mais sont plus souples et plus sûres. Les
    hybrides (funboards, eggs) se situent entre 7 et 9 pieds et combinent la
    facilité de pagaie avec la capacité à virer. Les fish sont courtes et larges
    avec une queue swallowtail, conçues pour les petites vagues.
  solution: >-
    Identifiez votre type de vague locale — les beach breaks lents conviennent
    aux longboards et hybrides ; les reef ou point breaks plus raides
    fonctionnent avec les shortboards. Adaptez la planche à la vague, pas à ce
    qui a l'air cool. Les débutants devraient opter par défaut pour une forme de
    longboard à volume élevé, puis explorer des formes plus courtes à mesure que
    leur niveau se développe.
  recommendation: >-
    Pour la plupart des surfeurs, un hybride ou funboard autour de 7'6" à 8'6"
    est le meilleur quiver à planche unique. L'Paddle Board Overstock Surfboard Pro en 10'6"
    est plus long mais offre la stabilité d'un longboard avec la portabilité
    d'un gonflable. Utilisez-le comme planche principale pendant la première
    année.
  faq:
    - q: Quelle est la planche de surf la plus facile à rider ?
      a: >-
        Un longboard (9 pi et plus) ou un gonflable à volume élevé comme
        l'Paddle Board Overstock Surfboard Pro. Ces planches attrapent les vagues tôt et
        offrent une plateforme stable pour apprendre les pop-ups et le transfert
        de poids.
    - q: Quand dois-je passer du longboard au shortboard ?
      a: >-
        Après avoir su attraper régulièrement les vagues vertes, faire des bottom
        turns et trimmer le long de la face de la vague sur votre longboard. Se
        précipiter sur le changement est l'erreur la plus courante — comptez 6 à
        12 mois sur un longboard.
    - q: À quoi sert un fish ?
      a: >-
        Les fish sont conçues pour les petites vagues molles. Leur longueur
        courte et leur outline large génèrent de la vitesse là où un shortboard
        typique calerait. C'est une excellente deuxième planche pour les
        surfeurs intermédiaires.
    - q: Les surfboards gonflables sont-ils bons ?
      a: >-
        Les gonflables modernes à construction drop-stitch rivalisent avec les
        longboards en mousse en rigidité et en performance. Ils sont idéaux pour
        les débutants et les voyageurs car ils se rangent dans un sac à dos et
        sont presque indestructibles.
