- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'Guide de la pagaie SUP : choisir la bonne pagaie pour votre style'
  description: >-
    Guide complet des pagaies SUP — longueur, matériaux (aluminium, fibre de
    verre, carbone), formes de pale et l'impact du choix de la pagaie sur votre
    expérience de pagayage.
  definition: >-
    Une pagaie SUP se compose d'un manche (aluminium, fibre de verre ou
    carbone) et d'une pale (dièdre, cuillère ou plate). Sa longueur doit
    dépasser votre taille de 8 à 10 pouces pour un usage général.
  tldr: >-
    Longueur de pagaie : 8-10 pouces au-dessus de votre taille pour un usage
    polyvalent, 6-8 pour le surf, 10-12 pour l'excursion. Matériaux : aluminium
    (bon marché, lourd), fibre de verre (milieu de gamme, bon couple), carbone
    (léger, rigide, cher). Forme de pale : dièdre (tracé stable), cuillère
    (puissance), plate (polyvalente). Les pagaies réglables sont idéales pour
    les débutants.
  problem: >-
    La pagaie fournie avec la plupart des iSUP fonctionne mais elle est lourde
    et inefficace. Passer à une meilleure pagaie améliore l'efficacité et le
    plaisir de pagayer, mais les options prêtent à confusion.
  explanation: >-
    La longueur de la pagaie affecte l'efficacité de la cadence — trop courte
    elle oblige à se pencher, trop longue elle provoque une fatigue des
    épaules. Le matériau détermine le poids : les pagaies en carbone pèsent de
    18 à 24 oz contre 28 à 36 oz pour l'aluminium. La taille de la pale influe
    sur la puissance : les pales plus grandes (plus de 100 po²) procurent plus
    de propulsion par coup de pagaie mais fatiguent plus vite. Les pales
    dièdres tracent droit ; les pales cuillère offrent une meilleure prise
    d'eau.
  solution: >-
    Pour la bonne longueur : tenez la pagaie verticale et levez le bras — le
    manche de la pagaie doit atteindre votre poignet. Pour le matériau :
    commencez avec de la fibre de verre comme montée en gamme de poids
    intermédiaire. Pour la pale : choisissez un dièdre pour un usage général.
    Selon l'activité : les pagaies d'excursion sont plus longues avec des pales
    plus petites ; les pagaies de surf sont plus courtes avec des pales plus
    larges.
  recommendation: >-
    La pagaie en carbone Paddle Board Overstock à 28 oz est la meilleure amélioration pour
    les pagayeurs assidus. La pagaie aluminium télescopique 3 brins fournie est
    suffisante pour les débutants et les voyages.
  faq:
    - q: Quelle doit être la longueur de ma pagaie SUP ?
      a: >-
        Mesurez votre taille en pouces et ajoutez 8 à 10 pour un pagayage
        polyvalent. Pour le surf, ajoutez 6 à 8. Pour l'excursion, ajoutez 10 à
        12.
    - q: Une pagaie en carbone vaut-elle son prix ?
      a: >-
        Oui pour les pagayeurs réguliers — la réduction de poids diminue
        nettement la fatigue lors des longues séances. Pour un usage
        occasionnel, la fibre de verre offre un bon rapport qualité-prix.
    - q: Qu'est-ce qu'une pagaie réglable ?
      a: >-
        Une pagaie en 2 ou 3 brins avec réglage de longueur, idéale pour être
        partagée entre utilisateurs ou adaptée selon l'activité.
    - q: Comment entretenir ma pagaie ?
      a: >-
        Rincez-la à l'eau douce après une utilisation en eau salée. Évitez de
        rouler dessus ou de la stocker à la chaleur directe. Vérifiez que le
        manchon (jonction) ne contient pas de sable.
