- slug: understanding-tides
  category: guide
  type: technical
  title: 'Comprendre les marées pour les sports nautiques : guide pratique'
  description: >-
    Comment les marées affectent les conditions de SUP, de surf et de kayak.
    Lire les tables de marées, comprendre les marées de vive-eau et de
    mortes-eau et planifier votre sortie en fonction des mouvements de marée
    pour plus de sécurité.
  definition: >-
    Les marées sont la montée et la descente quotidiennes du niveau de la mer
    causées par l'attraction gravitationnelle de la lune et du soleil.
    L'amplitude de marée varie selon le lieu et le cycle lunaire.
  tldr: >-
    Deux marées hautes et deux marées basses par jour dans la plupart des
    endroits. Les marées de vive-eau (pleine lune / nouvelle lune) ont de plus
    grandes amplitudes et des courants plus forts. Les marées de mortes-eau
    (quartier de lune) ont de plus petites amplitudes. La marée influence la
    profondeur de l'eau, la forme des vagues et la force du courant. Pour le
    SUP : pagayez d'abord contre le courant afin qu'il vous aide au retour.
  problem: >-
    Vous arrivez sur votre spot habituel et trouvez très peu de vagues, des
    courants de retour dangereux dus à la marée descendante ou une eau trop peu
    profonde. Sans comprendre les marées, vous gaspillez des sorties ou pagayez
    dans des conditions dangereuses.
  explanation: >-
    Les marées sont causées par la gravité de la lune. Les marées de vive-eau
    (pleine et nouvelle lune) produisent les marées hautes les plus hautes et
    les marées basses les plus basses. Les marées de mortes-eau (quartier de
    lune) produisent une amplitude minimale. Les courants de marée sont les
    plus rapides à mi-marée et quasi nuls à marée haute et basse. L'amplitude
    de marée varie de 0.3m (Méditerranée) à 16m (baie de Fundy).
  solution: >-
    Consultez la table des marées avant chaque sortie. Pour le surf : les
    breaks de plage fonctionnent souvent mieux 2-3 heures avant ou après la
    marée haute. Pour le SUP : pagayez contre le courant pendant la première
    moitié afin qu'il vous aide au retour. Pour la pêche : la marée montante
    pousse les poissons vers les zones peu profondes.
  recommendation: >-
    Utilisez les prédictions de marées NOAA ou une application de marées
    locale. Apprenez la préférence de marée de votre spot en notant les
    conditions pendant un mois.
  faq:
    - q: Qu'est-ce qu'une marée de vive-eau ?
      a: >-
        Les marées de vive-eau se produisent lors des pleines et nouvelles
        lunes, produisant des marées hautes plus hautes et des courants plus
        forts. Elles se produisent deux fois par mois.
    - q: Qu'est-ce qu'une marée de morte-eau ?
      a: >-
        Les marées de mortes-eau se produisent au quartier de lune. L'amplitude
        de marée est plus petite et les courants plus faibles — parfait pour
        les débutants.
    - q: Les marées basses sont-elles dangereuses pour le SUP ?
      a: >-
        La marée basse peut exposer des rochers et des récifs. Elle concentre
        aussi l'énergie des vagues sur des bancs de sable plus abrupts.
    - q: Comment les marées affectent-elles les courants de retour ?
      a: >-
        Les marées descendantes (jusant) renforcent les courants de retour. Les
        marées montantes (flot) réduisent leur intensité.
