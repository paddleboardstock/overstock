  problem: >-
    Les gilets mousse standard sont volumineux et limitent le mouvement de
    pagayage, surtout en SUP où vous avez besoin d'une mobilité complète des bras
    et du torse.
  explanation: >-
    Le Life Vest Pro utilise un système de gonflage au CO2 qui reste compact une
    fois dégonflé et offre 33 lb de flottabilité une fois gonflé. Le design
    profilé repose à plat sur la poitrine, permettant des coups de pagaie sans
    restriction. Le gonflage de secours automatique s'active à l'immersion,
    tandis que la cordelette de déclenchement manuel assure un gonflage
    immédiat. La sangle sous-jambes intégrée empêche le gilet de remonter dans
    l'eau.
  solution: >-
    Portez-le dégonflé pendant la pagaye normale — il est confortable et discret.
    En cas d'urgence, tirez sur la cordelette pour un gonflage immédiat, ou
    comptez sur le secours automatique si vous tombez à l'eau. La flottabilité de
    33 lb offre une flottabilité supérieure même dans des conditions difficiles.
  recommendation: >-
    À 129 $, le Life Vest Pro est le meilleur gilet gonflable pour le SUP et le
    kayak. Il allie confort pendant l'usage actif et flottabilité fiable quand on
    en a besoin.
  faq:
    - q: À quelle fréquence dois-je remplacer la cartouche CO2 ?
      a: >-
        Remplacez-la après chaque gonflage, ou chaque année si la cartouche n'a
        pas été utilisée. Vérifiez la fenêtre de contrôle avant chaque usage.
    - q: Le déclenchement automatique est-il fiable ?
      a: >-
        Oui — l'activation hydrostatique est testée pour se déployer à
        l'immersion en 2-4 secondes. Le déclenchement manuel offre une redondance.
    - q: Comment entretenir le Life Vest Pro ?
      a: >-
        Rincez à l'eau douce après un usage en eau salée. Inspectez la cartouche
        chaque année. Remplacez la bobine tous les 2-3 ans. Rangez dans un
        endroit sec.
    - q: Ce gilet convient-il aux non-nageurs ?
