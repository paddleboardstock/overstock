- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'Auto-Sauvetage en SUP : Comment Remonter sur sa Planche en Eau Profonde'
  description: >-
    Tout pagayeur de SUP devrait maîtriser l'auto-sauvetage. Techniques étape
    par étape pour remonter sur sa planche en eau profonde, la remorquer
    jusqu'au rivage et gérer les nœuds de leash.
  definition: >-
    L'auto-sauvetage en SUP est la technique consistant à remonter sur sa
    planche en eau profonde après une chute, y compris la récupération de la
    planche, la remontée du corps et la récupération de la pagaie.
  tldr: >-
    Après une chute : restez calme, gardez la pagaie en main, nagez jusqu'à la
    planche. Posez la pagaie en travers de la planche. Utilisez un coup de pied
    de dauphin pour propulser le torse sur la planche. Faites passer une jambe,
    puis l'autre. Agenouillez-vous d'abord, puis levez-vous. Entraînez-vous en
    eau calme jusqu'à ce que ce soit un réflexe.
  problem: >-
    Vous tombez de votre SUP en eau profonde et ne parvenez pas à remonter. La
    planche est glissante, vous êtes fatigué et la panique s'installe. Sans
    connaître la technique d'auto-sauvetage, une simple chute devient
    dangereuse.
  explanation: >-
    L'auto-sauvetage comporte trois étapes : la récupération (nager vers la
    planche et récupérer la pagaie), la remontée (remonter sur la planche) et
    la poursuite (reprendre la pagaie). La technique clé consiste à utiliser la
    pagaie comme stabilisateur et à donner de puissants coups de pied pour
    propulser le haut du corps sur la planche.
  solution: >-
    Étape 1 : nagez jusqu'à la planche. Gardez la pagaie en main ou récupérez-
    la. Étape 2 : placez la pagaie perpendiculairement en travers de la planche.
    Donnez des coups de pied vigoureux en tirant le torse vers le centre de la
    planche. Étape 3 : une fois le torse sur la planche, ramenez les jambes une
    à une. Étape 4 : agenouillez-vous, reprenez votre souffle, puis levez-vous
    progressivement.
  recommendation: >-
    Entraînez-vous à l'auto-sauvetage dans des conditions contrôlées jusqu'à
    le faire sans réfléchir. Utilisez l'Paddle Board Overstock SUP Explorer 11 qui dispose
    d'une bonne adhérence sur le pont. Le gilet Life Vest Pro procure une
    flottabilité supplémentaire si vous luttez.
  faq:
    - q: Comment remonter si je suis épuisé ?
      a: >-
        Restez près de la planche pour la flottabilité. Utilisez vos bras pour
        tirer le torse sur la planche, même si vos jambes ne peuvent plus
        donner de coups de pied efficaces. Reposez-vous à genoux avant de vous
        lever.
    - q: Et si je perds la pagaie ?
      a: >-
        Utilisez vos bras pour pagayer la planche jusqu'au rivage. Demandez de
        l'aide à un autre pagayeur. Remplacez immédiatement la pagaie perdue.
    - q: Puis-je m'auto-sauver dans les vagues ?
      a: >-
        Oui — positionnez la planche perpendiculairement aux vagues.
        Chronométrez votre remontée entre deux vagues. Le leash maintient la
        planche à proximité.
    - q: Comment gérer un nœud de leash ?
      a: >-
        Restez calme, allongez-vous sur le dos et dénouez lentement le leash.
        Si le leash est enroulé autour des ailerons, vous devrez peut-être
        retirer les ailerons pendant que vous êtes dans l'eau.
