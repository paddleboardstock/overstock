- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'Guide de l''ancre SUP : rester sur place pour la pêche ou la photo'
  description: >-
    Guide complet de l'ancrage en SUP — types d'ancre (champignon, pliante,
    piquet), installation d'un rail d'ancre, techniques de déploiement et
    considérations de sécurité pour rester en position.
  definition: >-
    Une ancre SUP est un poids attaché à une corde qui maintient la planche en
    position contre le vent et le courant. Les types courants comprennent les
    ancres champignon, les ancres pliantes et les piquets d'ancrage.
  tldr: >-
    Utilisez une ancre champignon (1,5 à 3 lb) pour les fonds vaseux ou
    sableux, une ancre pliante pour les fonds rocheux, ou un piquet pour les
    eaux peu profondes à fond mou. L'ancre doit peser de 1,5 à 3 lb (0,7 à
    1,4 kg) dans des conditions calmes, de 3 à 5 lb (1,4 à 2,3 kg) par vent et
    courant. Utilisez toujours un rail d'ancre pour ajuster la position et
    sachez quand larguer.
  problem: >-
    Vous trouvez le spot de pêche parfait, mais le vent et le courant vous font
    dériver toutes les quelques minutes. Sans ancrage, la pêche et la photo en
    SUP deviennent un exercice frustrant de repositionnement constant.
  explanation: >-
    Une ancre fonctionne en traînant sur le fond jusqu'à ce qu'elle accroche.
    Les ancres champignon s'enfoncent dans les fonds mous et offrent une bonne
    tenue dans le sable et la vase. Les ancres pliantes ont des griffes qui
    s'accrochent aux fonds durs ou rocheux. Les piquets fonctionnent en eau peu
    profonde en s'enfonçant directement dans le fond.
  solution: >-
    Installez un système de rail d'ancre (une ligne avec un anneau coulissant
    sur un côté de la planche) pour ajuster le point d'attache de l'ancre.
    Fixez 50-75 pieds (15 à 23 m) de corde à l'ancre. Déployez-la au vent ou au
    courant de la position souhaitée. Utilisez un système de largage rapide
    pour vous détacher en cas d'urgence. N'ancrez jamais dans un fort courant
    ou là où vous ne pouvez pas facilement récupérer l'ancre.
  recommendation: >-
    Une ancre pliante de 3 lb (1,4 kg) avec 50 pieds (15 m) de corde convient à
    la plupart des situations de pêche en SUP. Ajoutez un système de rail
    d'ancre en utilisant les anneaux en D de votre SUP Explorer 11 Paddle Board Overstock.
  faq:
    - q: De quelle taille d'ancre ai-je besoin en SUP ?
      a: >-
        1,5 à 3 lb (0,7 à 1,4 kg) pour les lacs calmes et les rivières lentes.
        3 à 5 lb (1,4 à 2,3 kg) pour les zones côtières avec vent ou courant.
        Les ancres surdimensionnées sont difficiles à récupérer.
    - q: De combien de corde d'ancre ai-je besoin ?
      a: >-
        Un rapport de 5:1 (5 pieds de corde pour chaque pied de profondeur) est
        la norme. Dans 10 pieds (3 m) d'eau, utilisez 50 pieds (15 m) de corde.
    - q: L'ancrage est-il dangereux sur un SUP ?
      a: >-
        Seulement si vous ancrez dans un courant ou un vent assez fort pour
        faire chavirer la planche. Utilisez toujours un système de largage
        rapide détachable instantanément.
    - q: Puis-je ancrer dans n'importe quelle eau ?
      a: >-
        Vérifiez les réglementations locales. Certaines zones restreignent
        l'ancrage pour protéger les herbiers marins ou les habitats marins.
        N'ancrez jamais sur les récifs coralliens.
