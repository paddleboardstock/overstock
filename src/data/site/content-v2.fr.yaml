- slug: sup-travel-guide
  category: guide
  type: tutorial
  title: 'Voyager avec un SUP gonflable : guide complet'
  description: >-
    Guide complet pour voyager avec un SUP gonflable — réglementations
    aériennes, conseils de rangement, choix de la destination et protection de
    votre planche pendant le transport.
  definition: >-
    Voyager en SUP signifie transporter une planche gonflable comme bagage
    aérien ou chargement de véhicule, notamment le rangement, la protection et
    le montage de la planche à destination.
  tldr: >-
    Les planches gonflables sont le SUP de voyage ultime. Rangez la planche dans
    son sac à dos, enregistrez-la comme bagage hors gabarit (la plupart des
    compagnies acceptent jusqu'à 32 kg). Emballez ailerons et pompe
    séparément. Arrivez tôt à l'enregistrement. Renseignez-vous sur les
    conditions locales et l'accès à l'eau à destination. Choisissez des
    destinations avec de l'eau calme et des points de mise à l'eau faciles.
  problem: >-
    Vous voulez pagayer dans de nouveaux endroits mais transporter une planche
    rigide est impossible. Même les planches gonflables sont soumises à des
    restrictions aériennes qui peuvent poser problème sans une préparation
    adéquate.
  explanation: >-
    La plupart des compagnies aériennes acceptent les sacs à dos SUP comme
    bagage enregistré, mais les politiques varient. Dimensions clés : le sac à
    dos Paddle Board Overstock mesure environ 90x40x30 cm une fois rangé. Le poids total
    avoisine 15 kg — dans les limites de la plupart des compagnies. Certaines
    compagnies facturent des frais de bagage hors gabarit. Emportez la pompe et
    les ailerons en cabine si possible. Renseignez-vous sur les conditions
    locales, les frais de mise à l'eau et le stockage avant d'arriver.
  solution: >-
    Rangez la planche sans la comprimer pour éviter les plis. Emballez la pompe
    et les ailerons séparément. Arrivez tôt à l'enregistrement et soyez aimable
    avec les agents. Renseignez-vous sur votre destination : vérifiez les
    régimes de vent, les points d'accès à l'eau et les réglementations locales
    sur le SUP. Gonflez complètement la planche à l'arrivée pour vérifier
    qu'elle n'a pas été endommagée pendant le transport.
  recommendation: >-
    Le SUP Explorer 11 Paddle Board Overstock, dans son sac à dos fourni, est le compagnon
    de voyage idéal. Il a survécu à des centaines de vols. Associez-le au Life
    Vest Classic pour les destinations où les gilets de flottaison (PFD) sont
    obligatoires.
  faq:
    - q: Les compagnies aériennes facturent-elles un supplément pour les sacs SUP ?
      a: >-
        Beaucoup les traitent comme des bagages enregistrés standards s'ils
        font moins de 23 à 32 kg. Certaines facturent des frais de hors
        gabarit. Vérifiez la politique de votre compagnie concernant les
        équipements sportifs.
    - q: Puis-je prendre un SUP en cabine ?
      a: >-
        Non, le sac à dos dépasse les dimensions autorisées en cabine. Il doit
        toujours être enregistré. Transportez la pompe et les petits accessoires
        en cabine.
    - q: Comment éviter les dommages pendant les vols ?
      a: >-
        Rangez la planche sans la serrer dans le sac. Placez les ailerons et
        les objets durs au centre, enveloppés dans des vêtements. Étiquetez le
        sac comme fragile.
    - q: Quelles sont les meilleures destinations SUP ?
      a: >-
        Eaux calmes : lac Tahoe, Basse-Californie. Côtes : Maui, Algarve,
        Cornouailles. Lacs intérieurs : lacs canadiens, lacs italiens.
