- slug: cold-water-safety-guide
  category: guide
  type: safety
  title: 'Sécurité en eau froide : pagayer et surfer par conditions froides'
  description: >-
    Sécurité en eau froide pour le SUP, le surf et le kayak. Reconnaissance de
    l'hypothermie, équipement adapté, réponse au choc thermique et procédures
    d'urgence en cas d'immersion en eau froide.
  definition: >-
    La sécurité en eau froide implique de comprendre la réponse au choc
    thermique, la défaillance de nage, l'hypothermie ainsi que l'équipement et
    les techniques permettant de prévenir ces issues.
  tldr: >-
    Une eau en dessous de 15C exige une combinaison. En dessous de 10C, il faut
    des bottillons, des gants et une capuche. Le choc thermique provoque des
    aspirations involontaires. La défaillance de nage survient en 3-5 minutes
    dans une eau en dessous de 10C. Les symptômes de l'hypothermie incluent les
    frissons, la confusion et la perte de coordination.
  problem: >-
    Vous pagayez par une journée ensoleillée sans savoir que l'eau est à 8C.
    Vous tombez, aspirez involontairement et sentez vos membres s'engourdir en
    quelques minutes. L'eau froide tue plus vite que tout autre danger
    océanique.
  explanation: >-
    L'immersion en eau froide comporte quatre phases : le choc thermique (0-2
    min) — aspirations, hyperventilation. La défaillance de nage (3-15 min) —
    les muscles refroidissent, la coordination défaille. L'hypothermie (15-45
    min) — la température centrale chute sous 35C, provoquant confusion et
    arrêt cardiaque. L'effondrement post-sauvetage — le sang froid revient vers
    le centre du corps.
  solution: >-
    Vérifiez la température de l'eau. Portez une combinaison adaptée à la
    température. Ne pagayez jamais seul dans une eau en dessous de 15C.
    Emportez un sifflet et un téléphone. Si vous tombez : contrôlez votre
    respiration, remontez rapidement sur la planche. S'il fait trop froid,
    signalez-vous pour obtenir de l'aide.
  recommendation: >-
    La combinaison Paddle Board Overstock Wetsuit Pro 5/4/3mm est le minimum pour une eau de
    8-14C. Ajoutez les bottillons 5mm et les gants 3mm Paddle Board Overstock. Portez la
    Life Vest Pro pour une protection thermique supplémentaire.
  faq:
    - q: Combien de temps puis-je survivre dans une eau à 10C ?
      a: >-
        Le choc thermique dure 1-2 minutes. Sans flottabilité ni protection
        thermique, le temps de survie est de 30-60 minutes.
    - q: Quels sont les premiers signes d'hypothermie ?
      a: >-
        Frissons incontrôlables, confusion, mauvaise coordination, parole
        pâteuse. Arrêtez l'activité et réchauffez-vous immédiatement.
    - q: Comment me réchauffer après une session en eau froide ?
      a: >-
        Retirez l'équipement mouillé, séchez-vous, enfilez des couches chaudes
        avec bonnet et gants. Buvez des boissons chaudes sans alcool.
    - q: Peut-on souffrir d'hypothermie en été ?
      a: >-
        Oui — une eau en dessous de 15C existe dans de nombreux endroits même
        en été. L'eau conduit la chaleur 25 fois plus vite que l'air.
