- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Rangement du SUP gonflable : la bonne façon de ranger votre iSUP'
  description: >-
    Un bon rangement du SUP gonflable évite la délamination, les dommages
    causés par les UV, la moisissure et les fuites de valve. Conseils de
    stockage hivernal, de longue durée et quotidien pour les planches à
    drop-stitch.
  definition: >-
    Ranger un SUP gonflable signifie conserver la planche dans un environnement
    propre, sec et à température contrôlée, à l'abri des UV, des températures
    extrêmes et des dommages physiques.
  tldr: >-
    Rangez la planche dans un endroit frais et sombre, en dessous de 30 °C, à
    l'abri du soleil direct. Pour un stockage court (1 à 2 semaines),
    conservez-la partiellement gonflée à 8-10 PSI. Pour un stockage long,
    dégonflez complètement, roulez sans serrer et placez-la dans le sac de
    rangement. Ne la rangez jamais mouillée. Tenez-la éloignée des rongeurs et
    des objets tranchants.
  problem: >-
    Vous dégonflez votre SUP et le rangez dans un garage chaud ou un sous-sol
    humide. Trois mois plus tard, le PVC a jauni, la mousse de pont se décolle
    et la valve fuit. Un mauvais rangement cause plus de dommages qu'une
    utilisation régulière.
  explanation: >-
    La chaleur supérieure à 50 °C fait migrer les plastifiants du PVC, rendant
    le matériau rigide et cassant. Les rayons UV dégradent les liaisons
    polymères. L'humidité emprisonnée à l'intérieur crée de la moisissure. Le
    froid sous le point de congélation rend le PVC cassant. Les points de
    pression causés par un pliage serré créent des plis permanents.
  solution: >-
    Stockage court : rincez, séchez, gonflez à 10 PSI et rangez hors du sol
    dans un endroit ombragé. Stockage long : nettoyez soigneusement, séchez
    complètement, dégonflez entièrement, roulez avec la mousse de pont vers
    l'extérieur, placez dans le sac et rangez dans un placard frais et sec.
    Tenez éloigné des produits chimiques et des nuisibles.
  recommendation: >-
    Utilisez le sac de transport Paddle Board Overstock pour le rangement — il bloque les UV
    et évite les éraflures. Rangez dans une pièce climatisée. Ajoutez un sachet
    déshydratant dans le sac pour les environnements humides.
  faq:
    - q: Puis-je ranger mon SUP gonflé dans le garage ?
      a: >-
        Seulement si le garage reste sous 30 °C et sans soleil direct. La
        plupart des garages dépassent 40 °C en été.
    - q: Dois-je ranger mon SUP dans son sac ?
      a: >-
        Oui, le sac protège de la poussière, des UV et des dommages physiques.
        Assurez-vous que la planche est complètement sèche avant de la mettre
        dans le sac.
    - q: Le gel peut-il endommager un SUP gonflable ?
      a: >-
        Oui. Sous le point de congélation, le PVC devient cassant et peut se
        fissurer au déroulage ou au gonflage. Rangez toujours au-dessus de
        5 °C.
    - q: Comment rouler mon SUP pour le ranger ?
      a: >-
        Roulez avec la mousse de pont vers l'extérieur pour protéger le PVC du
        dessous. Évitez les plis serrés. Alternez la position du pli à chaque
        fois.
