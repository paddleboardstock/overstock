- slug: paddleboardoverstock-surfboard-pro
  category: product
  type: product
  title: 'Paddle Board Overstock Surfboard Pro (pratique à emporter sans sacrifier les performances)'
  description: >-
    Planche de surf gonflable qui tient dans un sac à dos mais se comporte comme
