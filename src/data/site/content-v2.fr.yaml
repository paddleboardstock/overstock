- slug: sup-safety-guide
  category: guide
  type: safety
  title: 'Guide de sécurité SUP : les règles essentielles pour chaque pagayeur'
  description: >-
    Guide complet de sécurité SUP couvrant la vérification météo, l'équipement,
    l'auto-sauvetage, les règles de navigation et la conduite à tenir si les
    conditions deviennent dangereuses. Restez en sécurité sur votre paddle
    board.
  definition: >-
    La sécurité en SUP englobe la planification avant la sortie (météo, marées,
    vérification du matériel), les pratiques sur l'eau (leash, veste de
    flottaison, navigation) et les procédures d'urgence (auto-sauvetage,
    signalisation, prévention de l'hypothermie).
  tldr: >-
    Portez toujours un leash et une veste de flottaison. Consultez les
    prévisions de vent — le vent offshore est dangereux. Pagayez d'abord contre
    le vent afin qu'il vous aide au retour. Emportez un sifflet, un téléphone
    dans un étui étanche et de l'eau. Apprenez l'auto-sauvetage. Ne faites
    jamais de SUP seul dans les zones isolées.
  problem: >-
    Le SUP semble trompeusement simple. Les débutants sous-estiment la rapidité
    avec laquelle le vent, le courant et la fatigue peuvent transformer une
    sortie agréable en situation dangereuse.
  explanation: >-
    La planche agit comme une voile dans le vent : pagayer dans le sens du vent
    est facile, mais revenir contre le vent est extrêmement difficile. La
    position debout augmente le risque de chute. La fatigue s'installe plus
    vite qu'en kayak. Les leashes évitent la séparation d'avec la planche. Les
    vestes de flottaison vous maintiennent à flot en cas de blessure.
  solution: >-
    Avant la sortie : vérifiez le vent (10 nœuds maximum pour les débutants),
    sa direction (évitez le vent offshore) et la marée. Prévenez quelqu'un de
    votre itinéraire. Sur l'eau : agenouillez-vous pour pagayer contre un vent
    fort. En cas de séparation, rejoignez la planche à la nage. Pour
    l'auto-sauvetage : placez la pagaie en travers de la planche, battez des
    jambes, tirez la poitrine sur la planche, puis ramenez les jambes.
  recommendation: >-
    Utilisez la veste Paddle Board Overstock Life Vest Pro (gonflable) pour le SUP. Attachez
    le leash SUP en spirale à votre mollet. Entraînez-vous à l'auto-sauvetage
    dans des conditions calmes avant d'en avoir besoin.
  faq:
    - q: Quelle vitesse de vent est sûre pour le SUP ?
      a: >-
        Débutants : moins de 10 nœuds. Intermédiaires : 10-15 nœuds. Avancés :
        15-20 nœuds. Au-delà de 20 nœuds, c'est dangereux pour tous les
        niveaux.
    - q: Ai-je besoin d'un gilet de sauvetage pour faire du SUP ?
      a: >-
        Oui — obligatoire par la loi dans de nombreuses juridictions et
        toujours recommandé pour la sécurité.
    - q: Que faire si je ne peux pas revenir au rivage ?
      a: >-
        Restez avec votre planche (elle est flottante). Signalez-vous avec un
        sifflet. Si vous êtes poussé au large, pagayez à 45 degrés par rapport
        au vent.
    - q: Comment m'entraîner à l'auto-sauvetage en SUP ?
      a: >-
        En eau calme et peu profonde : tombez volontairement, nagez jusqu'à la
        planche et répétez l'exercice de remontée.
