  problem: >-
    Les combinaisons pour eau froide sont soit trop restrictives, soit trop
    chères, soit elles laissent l'eau froide couler dans le dos. Vous voulez
    une combinaison qui vous garde au chaud pendant une session d'hiver de
    90 minutes sans donner l'impression d'être dans une camisole quand vous
    pagayez.
  explanation: >-
    La plupart des combinaisons de milieu de gamme utilisent du néoprène à base
