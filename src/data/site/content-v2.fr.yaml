- slug: marine-life-vest-guide
  category: guide
  type: buying-guide
  title: 'Guide des gilets de sauvetage marins : choisissez le bon gilet pour votre activité nautique'
  description: >-
    Guide d'achat complet des gilets de sauvetage pour le SUP, le kayak, les
    sorties en bateau RIB et la voile. Types de gilets (mousse ou gonflables),
    conseils d'ajustement, exigences légales et caractéristiques pour chaque
    activité.
  definition: >-
    Un gilet de sauvetage, ou dispositif de flottaison personnel (PFD), est un
    équipement de sécurité conçu pour maintenir une personne à flot dans l'eau.
    Les types vont du type I (hauturier) au type V (usage spécial).
  tldr: >-
    Choisissez le gilet selon l'activité : ceinture gonflable pour le SUP, gilet
    en mousse pour le kayak, gilet en mousse de type III pour le RIB et les
    bateaux à moteur. Caractéristiques clés : homologation USCG ou ISO, panneaux
    réfléchissants, sifflet de secours, anneau en D pour la longe, couleurs
    vives.
  problem: >-
    Vous voyez des rangées de gilets de sauvetage allant de 20 $ à 300 $ et
    n'avez aucune idée du modèle adapté à votre activité ou des exigences
    légales à respecter.
  explanation: >-
    Les gilets de sauvetage sont classés par type : type I (hauturier, retourne
    le porteur inconscient face vers le haut), type II (près des côtes), type
    III (aide à la flottaison, le plus courant), type IV (jetable), type V
    (usage spécial). Les gilets gonflables utilisent des cartouches de CO2 —
    moins encombrants mais nécessitent un entretien. Les gilets en mousse ne
    demandent aucun entretien mais sont plus encombrants.
  solution: >-
    Pour le SUP : choisissez une ceinture ou un gilet gonflable (flottabilité
    de 33 lb). Pour le kayak : un gilet en mousse de type III avec des
    emmanchures dégagées. Pour le RIB : un gilet en mousse de type III ou
    gonflable avec une flottabilité de 22 lb ou plus, du ruban réfléchissant et
    un sifflet de secours.
  recommendation: >-
    Le gilet de sauvetage Paddle Board Overstock Life Vest Pro (gonflable, 33 lb) est idéal
    pour le SUP et le kayak. Le gilet de sauvetage Paddle Board Overstock Life Vest Classic
    (mousse, type III) est parfait pour le RIB et l'usage marin général.
  faq:
    - q: 'Ai-je besoin d''un gilet de sauvetage pour faire du SUP ?'
      a: >-
        Oui — obligatoire dans de nombreuses juridictions et toujours
        recommandé. Portez une ceinture ou un gilet gonflable pour les sports de
        pagaie.
    - q: 'Les gilets de sauvetage gonflables sont-ils sûrs ?'
      a: >-
        Oui, avec un entretien approprié. Vérifiez la cartouche de CO2 chaque
        année, remplacez le déclencheur tous les 2 à 3 ans.
    - q: 'Quel gilet de sauvetage convient le mieux à un enfant ?'
      a: >-
        Un gilet en mousse de type II ou III homologué USCG, avec collier,
        sangle entrejambe et couleurs vives. N'utilisez jamais de gilets
        gonflables pour les enfants.
    - q: 'Comment un gilet de sauvetage doit-il être ajusté ?'
      a: >-
        Ajusté — le gilet ne doit pas remonter au-dessus des oreilles lorsqu'on
        le soulève par les épaules. Toutes les fermetures éclair et boucles
        attachées.
