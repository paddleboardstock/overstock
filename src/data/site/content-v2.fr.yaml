- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Entretien de la combinaison néoprène : faites durer votre néoprène 2 fois plus longtemps'
  description: >-
    Un entretien adapté prolonge la durée de vie de la combinaison néoprène de
    1 saison à 3 saisons et plus. Conseils de rinçage, de séchage, de stockage
    et de réparation pour les combinaisons en néoprène. Évitez les erreurs
    courantes qui détruisent prématurément les combinaisons.
  definition: >-
    L'entretien d'une combinaison néoprène consiste à la rincer à l'eau douce
    après chaque utilisation, à la sécher à l'abri de la lumière directe du
    soleil, à la stocker à plat ou suspendue sur un cintre large, et à la
    nettoyer périodiquement pour éliminer le sel, les bactéries et les odeurs.
  tldr: >-
    Rincez votre combinaison à l'intérieur et à l'extérieur à l'eau douce
    immédiatement après chaque session. Séchez-la à l'envers à l'ombre sur un
    cintre en plastique large. Rangez-la à plat ou pliée dans un endroit frais
    et sec. Ne laissez jamais les combinaisons en plein soleil, dans des
    voitures chaudes ou au sèche-linge. Utilisez un shampooing pour combinaison
    toutes les 5 à 10 sessions.
  problem: >-
    Après une saison, votre combinaison sent mauvais, le néoprène a perdu son
    élasticité, les coutures se décollent et la fermeture éclair coince — tout
    cela est évitable avec un entretien approprié.
  explanation: >-
    Les cristaux de sel s'incrustent dans le néoprène et abrasent le matériau.
    Les bactéries se multiplient dans les intérieurs humides, produisant des
    odeurs et dégradant le néoprène. Les UV dégradent le revêtement en nylon.
    La chaleur au-dessus de 50 °C provoque le délaminage. Un séchage
    inapproprié déforme le néoprène et sollicite les coutures.
  solution: >-
    Après chaque session : rincez soigneusement à l'intérieur et à l'extérieur,
    retournez la combinaison et suspendez-la sur un cintre en plastique large à
    l'ombre. Une fois sèche, remettez-la à l'endroit et rangez-la à plat.
    Toutes les 5 à 10 sessions : lavez-la avec un shampooing pour combinaison.
    Chaque mois : lubrifiez la fermeture éclair avec de la cire spéciale.
  recommendation: >-
    Utilisez le shampooing Paddle Board Overstock Wetsuit Shampoo pour le nettoyage et la
    cire Paddle Board Overstock Zipper Wax pour l'entretien de la fermeture éclair. Rangez la
    combinaison sur le cintre large Paddle Board Overstock dans le sac en filet.
  faq:
    - q: 'Puis-je mettre ma combinaison dans la machine à laver ?'
      a: >-
        Non recommandé — le lavage en machine endommage le néoprène. Si vous
        devez, utilisez un cycle délicat, de l'eau froide et un sac en filet.
    - q: 'Comment faire disparaître les odeurs de ma combinaison ?'
      a: >-
        Faites-la tremper dans de l'eau fraîche avec du shampooing pour
        combinaison ou du vinaigre blanc pendant 30 minutes. Rincez
        abondamment.
    - q: 'Comment sécher ma combinaison ?'
      a: >-
        À l'envers, à l'ombre, sur un cintre en plastique large et rembourré.
        Évitez la lumière directe du soleil et les cintres métalliques.
    - q: 'Puis-je réparer une combinaison déchirée ?'
      a: >-
        Les petites déchirures de moins de 1 po peuvent être réparées avec de la
        colle néoprène et un patch. Les déchirures plus grandes peuvent
        nécessiter une réparation professionnelle.
