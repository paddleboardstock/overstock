- slug: touring-sup-guide
  category: guide
  type: buying-guide
  title: 'Guide du SUP de randonnée : choisir la bonne planche pour la pagaie longue distance'
  description: >-
    Les SUP de randonnée sont plus longs, plus étroits et conçus pour la vitesse
    et la glisse. Comment choisir une planche de randonnée, l'équipement
    essentiel pour les longues pagaies et la technique pour couvrir la distance
    efficacement.
  definition: >-
    Un SUP de randonnée est une planche longue (12-14'), étroite (30-32'),
    conçue pour une pagaie efficace sur la distance. Ses caractéristiques
    incluent une étrave à déplacement pour fendre l'eau, une ligne de
    flottaison plus longue pour la glisse, et souvent un système de rangement
    bungee.
  tldr: >-
    Les SUP de randonnée privilégient la vitesse et le maintien du cap à la
    stabilité. Longueur minimale de 12' pour l'efficacité, largeur de 30-32"
    pour un équilibre entre glisse et stabilité. Caractéristiques clés : étrave
    à déplacement, ligne droite, configurations d'ailerons multiples.
    Équipement essentiel : gilet de flottabilité (PFD), leash, eau, téléphone
    et système bungee pour le matériel. La technique mise sur des coups de
    pagaie longs et fluides avec rotation du tronc.
  problem: >-
    Pagayer un SUP polyvalent sur un trajet longue distance vous laisse épuisé.
    L'étrave large attrape le clapot, la planche ne maintient pas le cap et
    vous dépensez plus d'énergie à diriger qu'à glisser. Vous avez besoin
    d'une planche conçue pour la distance.
  explanation: >-
    Les SUP de randonnée utilisent une coque à déplacement (étrave pointue) qui
    fend l'eau plutôt que de la chevaucher, réduisant nettement la traînée. La
    ligne de flottaison plus longue augmente la vitesse de coque. Une largeur
    plus réduite diminue la traînée mais exige un meilleur équilibre. Les
    planches de randonnée ont des ailerons plus longs pour la stabilité
    directionnelle. Les planches gonflables de randonnée exigent un PSI plus
    élevé (18-20) pour conserver la rigidité et éviter la flexion qui gaspille
    de l'énergie.
  solution: >-
    Choisissez une planche de randonnée d'au moins 12' de long avec une étrave
    à déplacement. Largeur : 30" pour les pagayeurs expérimentés, 31-32" pour
    les intermédiaires. Recherchez un boîtier d'aileron central plus des
    ailerons latéraux pour la stabilité. Gonflez au PSI maximum indiqué.
    Équipez-vous d'un système de fixation bungee, d'un gilet de flottabilité
    (PFD), d'un sifflet et d'un téléphone dans un étui étanche.
  recommendation: >-
    L'Paddle Board Overstock SUP Tour 12, en 12' x 31" x 6", est une planche gonflable de
    randonnée idéale. Son étrave à déplacement coupe efficacement le clapot, et
    le système bungee maintient l'équipement pour les sorties à la journée.
    Associez-la à la pagaie carbone Paddle Board Overstock pour une pagaie longue distance
    efficace.
  faq:
    - q: Puis-je utiliser une planche polyvalente pour la randonnée ?
      a: >-
        Pour les courtes randonnées de moins de 5 km, oui. Sur de plus longues
        distances, l'étrave large et la ligne de flottaison plus courte vous
        épuiseront plus vite.
    - q: Quelle longueur de SUP de randonnée me faut-il ?
      a: >-
        12' est le minimum pour l'efficacité en randonnée. 12'6" est une bonne
        longueur intermédiaire. 14' est réservé à la course et à la randonnée
        avancée.
    - q: Les SUP de randonnée gonflables sont-ils aussi performants que les planches rigides ?
      a: >-
        Les planches gonflables drop-stitch modernes à PSI élevé se comportent
        de manière similaire aux planches rigides en randonnée. La légère
        flexion peut même être plus confortable dans le clapot.
    - q: Quelle pagaie convient le mieux à la randonnée ?
      a: >-
        Une pagaie légère en carbone ou en fibre de verre avec une pale plus
        grande (100-110 po²) pour la puissance. Une pagaie réglable permet de
        passer de la randonnée au surf.
