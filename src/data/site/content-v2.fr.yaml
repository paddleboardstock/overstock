- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'Le SUP avec Votre Chien : Guide Complet Pas à Pas'
  description: >-
    Pratiquer le paddle avec votre chien — préparation, sécurité, étapes
    d'entraînement, recommandations d'équipement et conseils pour une
    expérience agréable pour vous deux.
  definition: >-
    Le SUP avec chien consiste à apprendre à votre compagnon canin à
    s'équilibrer sur une planche à pagaie, à l'équiper d'un VFI pour chien et à
    pagayer ensemble en toute sécurité.
  tldr: >-
    Commencez avec un SUP large et stable (34"+). Équipez votre chien d'un
    gilet de sauvetage bien ajusté avec poignée. Présentez-lui la planche
    d'abord sur la terre ferme, puis en eau peu profonde. Commencez par des
    sessions courtes avec un renforcement positif. Emportez toujours de l'eau
    pour votre chien. Surveillez les signes de stress ou de fatigue.
  problem: >-
    Votre chien adore l'eau, mais vous ne savez pas comment l'initier au SUP en
    toute sécurité. Sans un entraînement adéquat, un chien peut paniquer,
    sauter à l'eau ou rayer la planche.
  explanation: >-
    Les chiens possèdent des capacités naturelles de nage, mais ils doivent
    apprendre que la planche est une plateforme sûre. La clé est une
    désensibilisation progressive : présentez la planche sur un terrain solide,
    récompensez le comportement calme, puis passez en eau peu profonde, et
    enfin en eau plus profonde.
  solution: >-
    Commencez à terre : laissez le chien renifler et marcher sur la planche
    (sur de l'herbe). Récompensez le comportement calme. Ensuite : placez la
    planche dans une eau très peu profonde, maintenez-la et laissez le chien se
    tenir dessus. Récompensez. Puis : montez sur la planche en eau peu
    profonde et laissez le chien vous rejoindre. Enfin : pagayez lentement en
    eau calme.
  recommendation: >-
    Utilisez l'Paddle Board Overstock SUP Explorer 11 pour sa plateforme stable de 33".
    Équipez votre chien d'un VFI (gilet de sauvetage). Apportez de l'eau fraîche
    et une gamelle. Commencez par des sessions de 10 minutes, puis augmentez
    progressivement.
  faq:
    - q: Quelle taille de SUP me faut-il pour mon chien ?
      a: >-
        Une planche large de 33-34\" offre une bonne stabilité pour les chiens
        de taille moyenne à grande. Les petits chiens (moins de 10 kg) peuvent
        se débrouiller sur des planches de 32\" et plus.
    - q: Mon chien a-t-il besoin d'un gilet de sauvetage ?
      a: >-
        Oui — même les bons nageurs ont besoin d'un VFI pour chien avec
        poignée, facile à saisir en cas d'urgence.
    - q: Comment protéger la planche des griffes ?
      a: >-
        Gardez les griffes de votre chien coupées. Utilisez un protecteur de
        pont ou une serviette. Les chiens s'adaptent généralement et cessent de
        griffer une fois à l'aise.
    - q: Tout chien peut-il apprendre le SUP ?
      a: >-
        La plupart des chiens peuvent apprendre avec de la patience. Les chiens
        anxieux peuvent mettre plus de temps. Ne forcez jamais un chien
        craintif à monter sur la planche — cela créerait des associations
        négatives.
