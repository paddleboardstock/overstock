- slug: sup-navigation-guide
  category: guide
  type: safety
  title: 'Navigation en SUP : Garder le Cap et Trouver Son Chemin'
  description: >-
    Les compétences de navigation de base pour les pagayeurs de SUP — lire les
    cartes, utiliser les repères, comprendre les systèmes de bouées et utiliser
    le GPS et la boussole pour une pagaie en sécurité.
  definition: >-
    La navigation en SUP consiste à utiliser des repères, des cartes, le GPS et
    la connaissance du vent et du courant pour naviguer en sécurité et revenir
    à votre point de départ.
  tldr: >-
    Choisissez toujours un repère à l'horizon lorsque vous pagayez en ligne
    droite. Vérifiez-le toutes les quelques minutes pour corriger la dérive.
    Utilisez des applications GPS sur votre téléphone dans un étui étanche.
    Apprenez les bases de la navigation à la boussole. Comprenez les systèmes
    de bouées latérales (rouge à droite au retour). Déposez un plan de sortie
    auprès de quelqu'un à terre.
  problem: >-
    Vous pagayez en eau libre et, quand vous vous retournez, la ligne du rivage
    paraît complètement différente. Sans compétences de navigation, vous pouvez
    perdre vos repères et pagayer dans la mauvaise direction.
  explanation: >-
    La navigation en SUP repose sur des références visuelles car vous êtes près
    de l'eau. Choisissez un repère distinctif (bâtiment, arbre, falaise) derrière
    votre point de mise à l'eau. Utilisez-le comme relèvement arrière pour le
    retour. Le vent et le courant vous feront dévier de votre cap — corrigez en
    continu. Pour les longs trajets, utilisez une application GPS ou une montre.
    Sachez que le rivage paraît différent depuis l'eau que depuis la terre
    ferme.
  solution: >-
    Avant de partir : identifiez 2 à 3 repères à différentes distances derrière
    votre point de mise à l'eau. Utilisez une application GPS (Google Maps,
    Gaia GPS) en mode avion pour économiser la batterie. Connaissez la direction
    du vent et de la marée — pagayez d'abord contre le vent et le courant. Pour
    les traversées en eau libre, utilisez un relèvement à la boussole.
  recommendation: >-
    Gardez un téléphone dans un étui étanche comme secours GPS. Entraînez-vous
    à la navigation par repères dans des eaux familières avant de vous
    aventurer vers de nouveaux sites. Le gilet Life Vest Pro possède une poche
    adaptée à un téléphone.
  faq:
    - q: Quels repères sont les meilleurs pour la navigation en SUP ?
      a: >-
        Des aménagements distinctifs et permanents comme les châteaux d'eau,
        les immeubles élevés, les arbres remarquables ou les falaises
        proéminentes. Évitez les bateaux ou les drapeaux qui se déplacent.
    - q: Comment naviguer dans le brouillard ?
      a: >-
        Ne partez pas pagayer dans le brouillard. Si vous êtes pris dans le
        brouillard, utilisez un GPS ou une boussole pour naviguer. Sifflez
        toutes les 30 secondes. Restez près de la côte.
    - q: Ai-je besoin d'une carte marine pour le SUP ?
      a: >-
        Pour la pagaie côtière, une simple carte aide à identifier les dangers,
        les profondeurs et les chenaux de navigation. De nombreuses
        applications fournissent ces informations.
    - q: Comment naviguer autour des bateaux ?
      a: >-
        Restez en eau peu profonde, loin des chenaux. Portez des couleurs
        vives. Traversez les chenaux rapidement et à angle droit. Établissez un
        contact visuel avec les pilotes des bateaux.
