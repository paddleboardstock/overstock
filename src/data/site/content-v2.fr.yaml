- slug: how-to-choose-a-wetsuit
  category: guide
  type: buying-guide
  title: 'Comment choisir une combinaison : coupe, épaisseur et caractéristiques expliquées'
  description: >-
    Guide d'achat complet de la combinaison de surf. Comment choisir la bonne
    épaisseur en fonction de la température de l'eau, garantir une coupe
    correcte, comprendre les types de coutures et sélectionner les
    caractéristiques selon votre activité.
  definition: >-
    Une combinaison est un vêtement en néoprène qui assure l'isolation
    thermique en emprisonnant une fine couche d'eau contre la peau. Critères de
    sélection clés : l'épaisseur, la coupe, la construction des coutures, le
    système d'entrée et le type de néoprène.
  tldr: >-
    Adaptez l'épaisseur à la température de l'eau : 3/2mm pour 14-20C, 4/3mm
    pour 12-18C, 5/4/3mm pour 8-14C, 6/5/4mm en dessous de 8C. La coupe est le
    facteur le plus important. Les coutures GBS sont la référence absolue. Le
    zip pectoral minimise les entrées d'eau. Le néoprène calcaire est plus
    souple que le néoprène à base de pétrole.
  problem: >-
    Les tableaux de tailles de combinaisons en ligne sont peu fiables, les
    recommandations d'épaisseur varient selon les marques et les descriptions
    des caractéristiques prêtent à confusion.
  explanation: >-
    Les chiffres d'épaisseur d'une combinaison (3/2, 4/3, 5/4/3) correspondent
    en mm au torse/bras et aux jambes. Les combinaisons plus épaisses sont plus
    chaudes mais limitent les mouvements. Une coupe trop lâche laisse l'eau
    chaude s'échapper. Les coutures GBS sont chaudes et souples ; les coutures
    plates sont moins chaudes. L'entrée par zip pectoral est plus chaude que le
    zip dorsal. Le néoprène calcaire est plus souple en eau froide.
  solution: >-
    Mesurez votre tour de poitrine, votre tour de taille, vos hanches et votre
    taille. Comparez avec les tableaux de tailles. Choisissez l'épaisseur en
    fonction de la température d'eau la plus froide. Optez pour des coutures
    GBS en eau froide. Privilégiez le zip pectoral en dessous de 15C. Envisagez
    une doublure thermique pour plus de chaleur.
  recommendation: >-
    La combinaison Paddle Board Overstock Wetsuit Pro en 3/2mm (14-20C) ou 5/4/3mm (8-16C)
    offre des coutures GBS, un zip pectoral et du néoprène calcaire à un prix
    compétitif.
  faq:
    - q: Quelle doit être la coupe d'une combinaison ?
      a: >-
        Moulante, sans poches d'air, mais sans être restrictive. Un doigt ne
        doit pas glisser facilement dans le bas du dos.
    - q: Quel est le type de combinaison le plus chaud ?
      a: >-
        Un modèle 6/5/4mm avec capuche, coutures scellées et zip pectoral. Pour
        le froid extrême, une combinaison étanche est supérieure.
    - q: Une combinaison plus chère vaut-elle le coup ?
      a: >-
        Un prix plus élevé achète un meilleur néoprène, de meilleures coutures
        et plus de fonctionnalités. Pour une utilisation régulière en eau
        froide, le supplément en vaut la peine.
    - q: Puis-je porter une combinaison pour d'autres activités que le surf ?
      a: >-
        Oui — les combinaisons conviennent au SUP, au kayak, à la plongée, au
        triathlon et à la nage en eau libre.
