- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Guide du matériel de surf en eau froide (surfez tout l'hiver sans souffrir)
  description: >-
    Ne laissez pas l'eau froide mettre fin à votre saison. Analyse complète du
    matériel eau froide : épaisseur de combinaison, choix des chaussons et
    gants, coupe de la cagoule, et les accessoires qui rendent les sessions
    hivernales réellement agréables.
  definition: >-
    Le surf en eau froide exige une combinaison intégrale (5/4/3mm ou plus), des
    chaussons, des gants et une cagoule. Sous 12°C, chaque point de contact avec
    l'eau froide doit être protégé pour prévenir l'engourdissement,
    l'hypothermie et les risques de sécurité.
  tldr: >-
    Le surf en eau froide exige une combinaison intégrale à cagoule 5/4/3mm ou
    6/5/4mm, des chaussons 5mm, des gants 3mm et une cagoule. La qualité des
    coutures compte plus que la marque — recherchez des coutures collées et
    surpiquées à l'aveugle (GBS). Une combinaison à doublure thermique apporte
    une chaleur significative sans épaisseur supplémentaire. Apportez toujours
    des couches thermiques de rechange et un thermos pour la récupération après
    la session.
  problem: >-
    Vous voulez surfer tout l'hiver mais l'eau froide engourdit vos pieds après
    15 minutes, vos mains ne tiennent pas la planche, et votre combinaison
    laisse entrer de l'eau glacée dans le dos à chaque coup de pagaie. Sans le
    bon matériel, les sessions en eau froide sont courtes et misérables.
  explanation: >-
    Le surf en eau froide (sous 12°C) exige bien plus qu'une simple combinaison
    épaisse. Chaque point de contact avec le froid doit être protégé : les
    chaussons évitent l'engourdissement des pieds et protègent contre les
    coupures de récif, les gants maintiennent la fonction des mains pour la
    pagaie, et la cagoule prévient la plus grande perte de chaleur (votre tête
    rayonne 30 % de la chaleur corporelle). L'épaisseur de la combinaison doit
    correspondre au mois le plus froid, pas à la moyenne. Au-delà de la
    combinaison, des accessoires comme des chaussons à semelles scellées et des
    gants à doigts pré-courbés améliorent le confort et la durabilité.
  solution: >-
    Montez un kit eau froide dans cet ordre : combinaison intégrale 5/4/3mm ou
    6/5/4mm avec coutures GBS et zip poitrine, chaussons 5mm à semelles en
    caoutchouc, gants 3mm (les moufles sont plus chaudes que les gants à
    doigts), et une cagoule 3mm qui se glisse sous le col de la combinaison.
    Ajoutez une robe de changement pour la dignité et la chaleur sur le parking.
  recommendation: >-
    La combinaison Paddle Board Overstock Wetsuit Pro en 5/4/3mm avec doublure thermique
    intégrée gère la plupart des conditions d'eau froide jusqu'à 8°C.
    Associez-la aux chaussons Paddle Board Overstock 5mm et aux gants 3mm pour un setup eau
    froide complet. Sous 8°C, passez à une combinaison à cagoule 6/5/4mm.
  faq:
    - q: Ai-je vraiment besoin d'une cagoule ?
      a: >-
        Oui. Vous perdez 30 % de la chaleur corporelle par la tête. Une cagoule
        évite le flushing et garde votre cou au chaud. Une cagoule 3mm apporte
        plus de chaleur que d'augmenter l'épaisseur du torse de 5mm à 6mm.
    - q: Quelle épaisseur de chaussons me faut-il ?
      a: >-
        Pour une eau de 8-12°C, utilisez des chaussons 5mm. Pour 12-16°C, des
        chaussons 3mm suffisent. Sous 8°C, envisagez des chaussons 7mm ou ajoutez
        des chaussettes en néoprène sous des chaussons 5mm.
    - q: Comment empêcher ma combinaison de laisser entrer l'eau ?
      a: >-
        Le flushing se produit quand l'eau entre au niveau du cou, des poignets
        ou des chevilles. Une entrée à zip poitrine réduit considérablement le
        flushing dans le dos. Les fermetures velcro au cou et aux chevilles
        aident aussi, mais la meilleure solution est une combinaison bien
        ajustée avec des coutures GBS.
    - q: Puis-je utiliser une combinaison 3mm en eau froide avec des couches supplémentaires ?
      a: >-
        Une combinaison 3mm avec un gilet en néoprène dessous peut étendre votre
        plage d'environ 3-4°C, mais ce n'est pas un substitut à une vraie
        combinaison 5/4/3mm ou 5mm. La superposition fonctionne le mieux pour
        les sessions courtes dans des conditions limites.
