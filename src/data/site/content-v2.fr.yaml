- slug: sup-pump-guide
  category: guide
  type: buying-guide
  title: 'Guide des pompes SUP : pompes manuelles ou électriques'
  description: >-
    Guide complet des pompes SUP — manuelles à double chambre, à chambre
    unique, et pompes électriques. Comment choisir la meilleure pompe pour
    vos besoins, conseils d'entretien et techniques de gonflage.
  definition: >-
    Une pompe SUP est un dispositif utilisé pour gonfler les paddle boards
    gonflables à la pression requise (généralement 15-20 PSI). Les types
    comprennent les pompes manuelles à chambre unique, les pompes manuelles à
    double chambre et les pompes électriques.
  tldr: >-
    Les pompes manuelles à double chambre sont la norme pour les iSUP de
    qualité — elles gonflent deux fois plus vite qu'une pompe à chambre
    unique. Les pompes électriques gonflent sans effort mais nécessitent une
    batterie et gonflent plus lentement près du PSI maximal. Les pompes
    manuelles sont plus fiables et ne nécessitent pas de batterie. Choisissez
    une pompe manuelle à double chambre pour la fiabilité, une pompe
    électrique pour le confort.
  problem: >-
    Gonfler votre SUP prend trop de temps ou demande trop d'effort. Une pompe
    de mauvaise qualité transforme le gonflage en corvée qui décourage les
    sessions de pagaie improvisées.
  explanation: >-
    Les pompes à chambre unique déplacent l'air uniquement à la descente — il
    faut 10-15 minutes pour gonfler un SUP. Les pompes à double chambre
    utilisent les deux chambres pour un débit élevé au gonflage initial
    (remplissage de la planche), puis passent sur une seule chambre haute
    pression pour la pression finale. Cela réduit le temps de gonflage à 3-5
    minutes. Les pompes électriques utilisent une alimentation 12V et
    gonflent automatiquement, mais ralentissent considérablement à mesure
    que la pression augmente.
  solution: >-
    Pour la plupart des utilisateurs, la pompe à double chambre fournie offre
    le meilleur équilibre entre vitesse, fiabilité et aucune dépendance aux
    batteries. Si vous pratiquez le SUP fréquemment ou avez des limitations
    physiques, envisagez une pompe électrique. Emportez toujours une pompe
    manuelle de secours, même si vous utilisez principalement une pompe
    électrique.
  recommendation: >-
    La pompe à double chambre Paddle Board Overstock fournie avec toutes les planches est
    excellente — elle gonfle à 15 PSI en moins de 4 minutes. Gardez la valve
    lubrifiée et vérifiez le manomètre chaque année.
  faq:
    - q: Quelle est la plus rapide, manuelle ou électrique ?
      a: >-
        Les pompes manuelles à double chambre (3-5 minutes) sont souvent plus
        rapides que les pompes électriques (5-10 minutes), car les pompes
        électriques ralentissent fortement à haute pression.
    - q: Puis-je utiliser une pompe de pneu de voiture pour mon SUP ?
      a: >-
        Non — les pompes à pneu déplacent un faible volume à très haute
        pression. Les pompes SUP nécessitent un volume élevé à pression
        moyenne.
    - q: Comment savoir si ma pompe a besoin d'un entretien ?
      a: >-
        Si le pompage semble plus dur que d'habitude, que la pression
        plafonne avant d'atteindre le PSI maximal, ou que le manomètre
        indique des valeurs incohérentes, vérifiez les joints toriques
        (O-rings) et les raccords de valve.
    - q: Les pompes électriques endommagent-elles la planche ?
      a: >-
        Non, à condition qu'elles disposent d'un arrêt automatique à la
        pression définie. Un gonflage continu au-delà du PSI maximal peut
        endommager les fils de drop-stitch.
