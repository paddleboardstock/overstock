- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Entretien des bateaux gonflables : préservez votre investissement'
  description: >-
    Liste de contrôle annuelle pour l'entretien des bateaux gonflables.
    Nettoyage, protection UV, inspection des soudures, gestion de la pression,
    entretien du moteur et hivernage pour les bateaux en PVC et en Hypalon.
  definition: >-
    L'entretien d'un bateau gonflable comprend le nettoyage, la protection UV,
    la gestion de la pression, l'inspection des soudures et des valves, la
    prévention des moisissures et un stockage adapté hors saison.
  tldr: >-
    Rincez après chaque utilisation en eau salée. Appliquez un protecteur UV
    tous les 2 à 3 mois. Vérifiez la pression de gonflage avant chaque sortie.
    Inspectez les soudures, les valves et le tableau arrière chaque mois.
    Nettoyez avec un savon doux. Rangez dégonflé dans un endroit frais et sec
    hors saison.
  problem: >-
    Vous avez utilisé votre bateau gonflable pendant une saison et les flotteurs
    semblent décolorés, une soudure suinte et le tableau arrière semble
    spongieux — tout cela est évitable grâce à un entretien régulier.
  explanation: >-
    Les rayons UV dégradent la matrice polymère. Le sel cristallise dans les
    plis et abrase le tissu. Les moisissures se développent dans l'humidité
    emprisonnée. Une pression incorrecte provoque la fatigue du matériau. Le
    tableau arrière (surtout en contreplaqué) absorbe l'eau par les trous de
    vis.
  solution: >-
    Après chaque utilisation : rincez à l'eau douce, séchez, vérifiez la
    pression. Chaque mois : appliquez un protecteur UV sur les flotteurs,
    inspectez les soudures, vérifiez la valve. Chaque année : nettoyage en
    profondeur, inspection du tableau arrière à la recherche de pourriture,
    lubrification des valves, test des micro-fuites.
  recommendation: >-
    Utilisez le protecteur 303 Aerospace sur les flotteurs des bateaux
    Paddle Board Overstock. Retirez les valves et appliquez de la graisse silicone chaque
    année. Rangez dans le sac de transport avec un sachet déshydratant.
  faq:
    - q: 'Puis-je utiliser de l''eau de Javel pour nettoyer mon bateau gonflable ?'
      a: >-
        Non — l'eau de Javel endommage le revêtement du tissu. Utilisez un
        savon doux et de l'eau tiède. Pour les moisissures, utilisez du vinaigre
        blanc dilué.
    - q: 'À quelle fréquence dois-je appliquer le protecteur UV ?'
      a: >-
        Tous les 2 à 3 mois pendant la saison d'utilisation. Plus fréquemment
        sous les climats tropicaux.
    - q: 'Dois-je dégonfler mon bateau entre deux utilisations ?'
      a: >-
        Non si vous l'utilisez chaque semaine. Laissez-le gonflé avec une
        housse anti-UV. Pour des périodes d'un mois sans utilisation, dégonflez
        et rangez.
    - q: 'Comment entretenir le tableau arrière ?'
      a: >-
        Vérifiez les boulons chaque mois. Scellez les bords du bois exposé avec
        un vernis marin chaque année. Remplacez si des zones molles
        apparaissent.
