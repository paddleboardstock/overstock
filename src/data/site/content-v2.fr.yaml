- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: 'Combinaison 3mm vs 5mm : ce que la plupart des débutants ratent en eau froide'
  description: >-
    Arrêtez de geler en pleine session ou de surchauffer sur la plage. La vraie
    différence entre les combinaisons 3mm et 5mm — tableau des températures,
    compromis de flexibilité, et ce qui fonctionne réellement pour le surf en
    eau froide.
  definition: >-
    Une combinaison est un vêtement en néoprène qui emprisonne une fine couche
    d'eau contre la peau, réchauffée par la chaleur corporelle pour assurer
    l'isolation. L'épaisseur (3mm, 5mm) détermine la plage de températures
    qu'une combinaison peut gérer — plus elle est épaisse, plus elle est chaude
    mais moins flexible.
  tldr: >-
    L'épaisseur de la combinaison détermine directement la chaleur et la
    flexibilité. Utilisez du 3mm pour une eau au-dessus de 16°C et du 5mm pour
    une eau entre 8°C et 16°C. Les combinaisons plus épaisses restreignent les
    mouvements mais vous gardent au chaud plus longtemps — privilégiez toujours
    la coupe à la marque.
  problem: >-
    Vous ouvrez une boutique en ligne ou entrez dans un surf shop et voyez des
    combinaisons étiquetées 3/2, 4/3, 5/4 et des combinaisons intégrales 5mm.
    Ces chiffres ne signifient pas grand-chose jusqu'à ce que vous réalisiez que
    la mauvaise épaisseur signifie soit geler en pleine session, soit
    surchauffer et transpirer sur la plage.
  explanation: >-
    Les combinaisons fonctionnent en emprisonnant une fine couche d'eau entre
    votre peau et le néoprène ; votre corps réchauffe cette eau, créant une
    isolation. Un néoprène plus épais emprisonne plus d'eau mais restreint la
    flexibilité et la flottabilité. Une combinaison 3mm (souvent 3/2 avec des
    bras plus fins) convient aux conditions douces, tandis que le 5mm (5/4/3 ou
    5mm intégral) convient à l'eau froide. Les entrées par zip poitrine
    s'étanchéifient mieux que le zip dos et réduisent le flushing. La
    construction des coutures — collées et surpiquées à l'aveugle (GBS) — fait
    la différence entre une combinaison qui fuit et une combinaison chaude.
  solution: >-
    Faites correspondre l'épaisseur à la température locale de l'eau avec une
    marge d'erreur de 5°C. Pour les climats tempérés, achetez une 3/2mm. Pour
    l'eau froide, achetez une 5/4/3mm. Ajoutez des chaussons, des gants et une
    cagoule pour étendre votre plage de 5°C supplémentaires vers le bas.
    Essayez les combinaisons avant d'acheter ou choisissez une marque avec une
    politique de retour généreuse.
  recommendation: >-
    La combinaison Paddle Board Overstock Wetsuit Pro en 5/4/3mm est idéale pour la plupart
    des surfeurs en eau froide, avec ses coutures GBS et sa doublure thermique.
    Si vous surfez en eau chaude au-dessus de 20°C, une 3/2mm avec zip poitrine
    est le meilleur choix.
  faq:
    - q: Quelle température de l'eau nécessite une combinaison 5mm ?
      a: >-
        Des températures d'eau entre 8°C et 14°C exigent une combinaison 5mm. En
        dessous de 8°C, il faut une combinaison à cagoule 6/5/4mm. Entre 14°C et
        18°C, une 4/3mm convient à la plupart des gens.
    - q: Puis-je porter une combinaison 3mm en hiver ?
      a: >-
        Seulement dans les climats hivernaux doux où l'eau reste au-dessus de
        16°C. Pour un vrai surf hivernal, une 5mm ou 5/4/3mm est nécessaire. Les
        chaussons, gants et cagoule apportent une chaleur équivalente sans avoir
        besoin d'un torse plus épais.
    - q: À quel point une combinaison doit-elle être ajustée ?
      a: >-
        Ajustée mais pas restrictive. Il ne doit y avoir ni poche d'air ni
        néoprène lâche. Si vous pouvez glisser un doigt entre votre peau et la
        combinaison dans le bas du dos, elle est trop lâche. Si respirer est
        difficile ou les mouvements sévèrement restreints, prenez une taille
        au-dessus.
    - q: Les combinaisons chères vous gardent-elles plus au chaud ?
      a: >-
        Un prix plus élevé signifie souvent un meilleur néoprène (à base de
        calcaire plutôt que de pétrole), une meilleure construction des coutures
        (GBS plutôt que collées uniquement) et une meilleure flexibilité. Ces
        facteurs affectent directement la chaleur et la longévité, mais
        seulement si la coupe est correcte.
