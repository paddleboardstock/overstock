- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Réparation du SUP gonflable : réparer les crevaisons, les fuites et les problèmes de valve'
  description: >-
    Guide de réparation DIY du SUP gonflable. Comment trouver une fuite lente,
    rapiécer une crevaison, remplacer une valve et réparer la délamination de
    la mousse de pont avec le kit de réparation fourni.
  definition: >-
    Réparer un SUP gonflable consiste à localiser les fuites d'air par un test
    à l'eau savonneuse, à nettoyer et poncer la zone endommagée, à appliquer la
    colle à PVC et la pièce de réparation, puis à laisser durcir sous pression.
  tldr: >-
    Trouvez les fuites avec de l'eau savonneuse. Nettoyez et poncez la zone
    autour de la crevaison avec du papier de verre. Appliquez la colle à PVC
    sur la pièce de réparation et la planche, attendez 5 minutes, pressez
    fermement et laissez durcir sous charge pendant 24 heures. Pour les fuites
    de valve, vérifiez d'abord le joint torique. Les petites crevaisons de
    moins de 1/4" sont des réparations DIY faciles.
  problem: >-
    Vous gonflez votre SUP et il a perdu de la pression au matin. Sans
    connaissances en réparation, vous faites face à un remplacement coûteux
    pour ce qui est probablement une simple crevaison.
  explanation: >-
    La plupart des SUP gonflables utilisent un noyau drop-stitch avec des
    couches extérieures en PVC. Une crevaison à travers le PVC extérieur crée
    une fuite lente. Réparation standard : nettoyer, poncer, appliquer de la
    colle compatible PVC et presser la pièce sous charge. Les fuites de valve
    sont plus fréquentes que les crevaisons des panneaux — le joint torique se
    dessèche ou des débris empêchent l'étanchéité.
  solution: >-
    Gonflez la planche au PSI max et écoutez le sifflement de l'air.
    Pulvérisez de l'eau savonneuse méthodiquement, surtout autour des coutures
    et de la valve. Marquez les zones qui bullent. Dégonflez, nettoyez à
    l'alcool, poncez avec du grain 80, appliquez la colle à PVC sur la pièce et
    la planche, attendez qu'elle devienne collante, pressez fermement et
    chargez pendant 24 heures.
  recommendation: >-
    Utilisez le kit de réparation Paddle Board Overstock fourni avec toutes les planches
    Paddle Board Overstock. Emportez toujours le kit de réparation en sortie. Pour les
    problèmes de valve, contactez le support Paddle Board Overstock. Pour les grandes
    déchirures ou les séparations de coutures, une réparation professionnelle
    est recommandée.
  faq:
    - q: Puis-je réparer une grande déchirure sur mon SUP gonflable ?
      a: >-
        Les déchirures de plus de 1\" peuvent nécessiter une réparation
        professionnelle ou une pièce sur les deux faces. Les séparations de
        coutures le long du flanc ne peuvent pas être réparées de manière
        fiable sur le terrain.
    - q: Combien de temps dure une pièce de réparation ?
      a: >-
        Une réparation correcte avec la bonne technique dure aussi longtemps
        que la planche. Une mauvaise adhérence due à un nettoyage insuffisant
        entraînera une défaillance future.
    - q: Puis-je réparer une valve qui fuit ?
      a: >-
        Souvent oui. Retirez le noyau de la valve, inspectez le joint torique,
        nettoyez-le ou remplacez-le, appliquez du lubrifiant silicone et
        réinstallez.
    - q: Et si je ne trouve pas la fuite ?
      a: >-
        Gonflez au PSI complet et immergez la planche par sections dans une
        baignoire ou une piscine. Les fuites trop petites pour être détectées
        peuvent être liées à la température.
