- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard vs Shortboard (la réponse honnête que personne ne vous donne)
  description: >-
    Les longboards attrapent plus de vagues ; les shortboards tournent plus
    fort. La vraie question est de savoir lequel correspond à votre niveau et à
    vos spots locaux. Comparaison honnête couvrant la stabilité, le nombre de
    vagues et le piège de la progression.
  definition: >-
    Les longboards (9 pieds et plus) privilégient la stabilité et la facilité à
    attraper les vagues ; les shortboards (5 à 7 pieds) privilégient la
    maniabilité et la performance sur les vagues raides. Le bon choix dépend de
    votre niveau et des types de vagues locaux.
  tldr: >-
    Les longboards (9 pieds et plus) sont stables, attrapent facilement les
    vagues et conviennent aux débutants et aux surfeurs contemplatifs. Les
    shortboards (5 à 7 pieds) sont réactifs, plus rapides sur la face de la
    vague et conviennent aux surfeurs avancés. Le bon choix dépend de votre
    niveau, du type de vague et de ce que vous aimez le plus dans le surf.
  problem: >-
    Vous voyez des vidéos de surfeurs enchaînant les virages serrés en
    shortboard et des longboarders glissant élégamment sur le nose — les deux
    semblent amusants. Vous n'avez le budget que pour un seul type de planche et
    devez savoir quel style correspond à vos objectifs et à vos spots locaux.
  explanation: >-
    Les longboards ont une plus grande surface, ce qui signifie qu'ils pagayent
    plus vite, attrapent les vagues plus tôt et offrent une plateforme stable
    pour marcher et faire des cross-steps. Ils excellent dans les petites vagues
    lentes où un shortboard coulerait. Les shortboards ont moins de volume et un
    rocker plus agressif, ce qui leur permet de s'enfoncer plus profondément
    dans la face de la vague, de générer de la vitesse dans les virages et de se
    faufiler dans les sections raides et creuses. Les shortboards exigent une
    pagaie puissante et un timing précis des vagues. Une idée reçue courante :
    les shortboards ne sont pas « meilleurs » — ce sont simplement des outils
    différents pour des conditions et des niveaux différents.
  solution: >-
    Si vous êtes débutant, roulez un longboard (ou un gonflable à grand volume)
    pendant au moins 6 mois. Si vous êtes intermédiaire et que vos vagues
    locales sont souvent petites et lentes, un longboard ou un hybride attrapera
    plus de vagues et sera plus amusant. Si vos vagues sont raides, creuses et
    rapides, un shortboard devient nécessaire pour vous placer dans le pocket.
    De nombreux surfeurs intermédiaires possèdent les deux et choisissent selon
    le jour.
  recommendation: >-
    Commencez avec l'Paddle Board Overstock Surfboard Pro comme plateforme de style
    longboard. Lorsque vous tournez et générez régulièrement de la vitesse,
    envisagez d'ajouter un hybride ou un shortboard pour les jours de vagues
    raides. La plupart des surfeurs qui adoptent un shortboard trop tôt finissent
    frustrés et attrapent moins de vagues.
  faq:
    - q: Un longboard est-il plus facile à rider qu'un shortboard ?
      a: >-
        Beaucoup plus facile. Les longboards attrapent les vagues plus tôt,
        pagayent plus vite et sont plus stables pendant le pop-up et le trim.
        Les shortboards exigent un timing précis, une pagaie plus puissante et
        une meilleure lecture des vagues.
    - q: Peut-on faire des virages sur un longboard ?
      a: >-
        Oui, mais le style est différent. Les virages en longboard sont plus
        amples, plus fluides et impliquent tout le corps. Le nose riding, les
        cutbacks et les hang-fives sont des manœuvres propres au longboard avec
        leur propre progression technique.
    - q: Quelle planche est la meilleure pour les petites vagues ?
      a: >-
        Les longboards et les hybrides performent mieux dans les petites vagues
        faibles car ils génèrent du glide et maintiennent la vitesse. Les
        shortboards ont besoin de vagues plus raides et plus puissantes pour
        performer.
    - q: Un shortboard est-il plus difficile à pagayer ?
      a: >-
        Nettement plus difficile. Le volume réduit signifie que la planche
        s'enfonce plus bas dans l'eau, créant plus de traînée. Pagayer un
        shortboard, c'est comme nager avec un parachute de traînée par rapport
        à un longboard.
