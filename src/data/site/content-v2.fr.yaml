- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Que porter pour surfer (ne débarquez pas en boardshorts quand il vous faut une 5/4)
  description: >-
    Arrêtez de deviner quoi porter. C'est la température de l'eau, pas celle de
    l'air, qui détermine votre tenue de surf. Guide complet de superposition, du
    rashguard tropical aux setups hivernaux intégraux 5/4/3mm.
  definition: >-
    La tenue de surf va des boardshorts et rashguards en eau chaude aux
    combinaisons intégrales 5/4/3mm avec chaussons et cagoule en eau froide. La
    température de l'eau, pas celle de l'air, détermine ce dont vous avez
    besoin.
  tldr: >-
    Ce que vous portez pour surfer dépend entièrement de la température de l'eau
    — pas de celle de l'air. Les rashguards et boardshorts fonctionnent
    au-dessus de 22°C, les shortys couvrent 18-22°C, les combinaisons intégrales
    3/2mm gèrent 14-18°C, et la 5/4/3mm avec chaussons est requise sous 14°C.
    Portez toujours une protection UV et envisagez un leash et un gilet de
    protection.
  problem: >-
    Vous arrivez à la plage sans savoir si un rashguard suffit ou s'il vous faut
    une combinaison intégrale. La température de l'air est chaude mais l'eau est
    froide, ou l'eau semble correcte mais le vent est glacial. Se tromper de
    tenue signifie une session gâchée.
  explanation: >-
    La tenue de surf remplit trois fonctions : l'isolation thermique, la
    protection UV et la prévention des abrasions. Les combinaisons en néoprène
    sont classées par épaisseur et couverture — les shortys (bras ou jambes
    courts) sont pour les journées limites, les combinaisons intégrales pour
    l'eau froide. Les rashguards protègent contre les irritations de la planche
    et le soleil mais n'apportent aucune valeur thermique. Les chaussons, gants
    et cagoules ne sont pas des accessoires mais un équipement essentiel pour le
    surf en eau froide sous 12°C.
  solution: >-
    Vérifiez la bouée locale ou le rapport de température de l'eau en direct
    avant de partir. Construisez un kit en vous basant sur vos conditions les
    plus froides typiques : rashguard et short pour l'été, combinaison intégrale
    3/2mm pour le printemps et l'automne, 5/4/3mm avec chaussons et cagoule pour
    l'hiver. Ajoutez toujours un leash et envisagez un gilet de flottabilité
    pour la sécurité.
  recommendation: >-
    Investissez d'abord dans une bonne combinaison intégrale 3/2mm — elle couvre
    la plus large gamme de conditions. Ajoutez une 5/4/3mm et des chaussons si
    vous comptez surfer tout l'hiver. La combinaison Paddle Board Overstock Wetsuit Pro avec
    doublure thermique couvre efficacement les deux plages de température.
  faq:
    - q: Puis-je surfer en simples boardshorts ?
      a: >-
        Oui, dans une eau tropicale au-dessus de 24°C. Vous voudrez peut-être un
        rashguard pour éviter les irritations de la poitrine et des bras dues à
        la pagaie. De la cire ou un pad d'adhérence sur la planche aide à
        compenser l'absence de grip de la combinaison.
    - q: Ai-je besoin de chaussons de surf ?
      a: >-
        Si la température de l'eau descend sous 14°C, les chaussons évitent
        l'engourdissement et protègent vos pieds des rochers et des coupures de
        récif. Ils ajoutent aussi de l'adhérence sur la planche. La plupart des
        surfeurs des climats nordiques utilisent des chaussons de novembre à
        mars.
    - q: Qu'est-ce qu'un shorty ?
      a: >-
        Un shorty est une combinaison à bras courts ou à jambes courtes (ou les
        deux) conçue pour une eau entre 18°C et 22°C. Il apporte plus de chaleur
        qu'un rashguard mais moins de couverture qu'une combinaison intégrale.
    - q: Dois-je porter un gilet de sauvetage en surfant ?
      a: >-
        Pas de gilets de sauvetage traditionnels, mais un gilet de protection ou
        une aide à la flottabilité peut aider dans des conditions difficiles ou
        si vous êtes un mauvais nageur. Les gilets Paddle Board Overstock sont conçus pour le
        SUP et le kayak mais peuvent apporter une confiance de flottabilité
        supplémentaire aux débutants en surf.
