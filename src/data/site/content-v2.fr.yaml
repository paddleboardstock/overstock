- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Entretien du SUP gonflable : faites durer votre planche des années'
  description: >-
    Un bon entretien du SUP gonflable prolonge considérablement la durée de vie
    de la planche. Nettoyage, séchage, soin de la valve, protection UV et
    conseils de stockage saisonnier pour les paddle boards à drop-stitch.
  definition: >-
    L'entretien d'un SUP gonflable consiste à nettoyer la planche après usage,
    à bien la sécher, à inspecter la valve, à la protéger des UV et à la
    stocker correctement pour éviter la délamination, la moisissure, la
    dégradation des matériaux et les fuites d'air.
  tldr: >-
    Rincez votre planche à l'eau douce après chaque session en eau salée.
    Séchez-la complètement avant de la dégonfler et de la ranger. Vérifiez la
    valve pour détecter les débris et lubrifiez le joint torique chaque année.
    Rangez la planche gonflée (à la moitié du PSI) dans un endroit frais et
    sombre. Évitez une exposition prolongée aux UV qui dégrade le PVC.
    Réparez immédiatement les petites crevaisons avec le kit de réparation
    fourni.
  problem: >-
    Après une saison, votre SUP gonflable développe des fuites lentes, la
    mousse de pont se décolle sur les bords et le PVC semble plus rigide.
    Négliger l'entretien de base provoque un vieillissement prématuré
    entièrement évitable.
  explanation: >-
    Le PVC se dégrade sous l'effet des rayons UV. Les cristaux de sel de l'eau
    de mer s'infiltrent dans les coutures et les valves, provoquant des
    micro-fuites. L'humidité emprisonnée à l'intérieur favorise la croissance
    de moisissures qui attaquent les fils du drop-stitch. Les joints toriques
    des valves se dessèchent et perdent leur étanchéité. La saleté et le sable
    s'incrustent dans l'adhésif de la mousse de pont, provoquant le soulèvement
    des bords.
  solution: >-
    Après chaque session : rincez la planche, les ailerons et la pompe à l'eau
    douce. Essuyez la mousse de pont. Ouvrez la valve pour évacuer l'eau
    emprisonnée. Séchez la planche à l'ombre avant de la dégonfler. Chaque
    mois : inspectez la valve et appliquez du lubrifiant silicone sur le joint
    torique. Chaque saison : lavez avec de l'eau savonneuse douce et vérifiez
    qu'il n'y a pas de trous.
  recommendation: >-
    Suivez le guide d'entretien Paddle Board Overstock fourni avec votre planche. Utilisez
    immédiatement le kit de réparation sur toute crevaison. Rangez la planche
    dans son sac, dans un espace à température contrôlée, à l'abri du soleil
    direct.
  faq:
    - q: Puis-je laisser mon SUP gonflable gonflé toute la saison ?
      a: >-
        Oui, mais rangez-le à l'abri du soleil direct et à la moitié du PSI max
        (8-10 PSI) pour réduire la tension sur les coutures. Gonflez
        complètement juste avant utilisation.
    - q: Comment nettoyer la moisissure sur mon SUP ?
      a: >-
        Mélangez un savon doux avec de l'eau tiède et frottez avec une brosse
        souple. Pour les moisissures tenaces, utilisez une solution de vinaigre
        blanc dilué (1:4). Évitez l'eau de Javel.
    - q: Faut-il lubrifier la valve ?
      a: >-
        Oui, chaque année. Retirez le noyau de la valve, appliquez de la
        graisse silicone sur le joint torique, puis réinstallez. Cela évite les
        fuites d'air.
    - q: Comment ranger mon SUP pour l'hiver ?
      a: >-
        Nettoyez et séchez soigneusement. Dégonflez complètement, roulez sans
        serrer (évitez les plis marqués) et rangez dans un endroit frais,
        sombre et sec. Évitez les températures de gel.
