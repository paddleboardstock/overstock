- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'Guide des lanières SUP : lanières droites ou en spirale'
  description: >-
    Guide complet des lanières SUP — droites ou en spirale, cheville ou
    mollet, options à dégagement rapide, et comment choisir la lanière
    adaptée à vos conditions de pagaie.
  definition: >-
    Une lanière SUP est un cordon qui relie le pagayeur à la planche afin
    d'éviter toute séparation. Les principaux types sont les lanières droites
    (pour le surf et les rivières) et les lanières en spirale (pour les eaux
    calmes).
  tldr: >-
    Les lanières en spirale conviennent le mieux aux eaux calmes et au
    paddling fitness — elles restent hors de la planche et hors de l'eau. Les
    lanières droites sont destinées au surf SUP et aux rivières — elles
    offrent plus de liberté et ne s'accrochent pas. La fixation au mollet est
    préférée à celle de la cheville pour le confort. Les lanières à
    dégagement rapide sont indispensables en rivière pour éviter tout
    piégeage.
  problem: >-
    Vous avez acheté une lanière avec votre SUP, mais vous n'êtes pas sûr
    qu'elle correspond à votre style de pagaie. Une lanière inadaptée
    traînera, s'accrochera ou lâchera au pire moment.
  explanation: >-
    Les lanières droites sont de simples cordons en nylon ou en polyuréthane
    qui remorquent derrière la planche. Elles fonctionnent bien en surf car
    elles ne s'accrochent pas aux ailerons. Les lanières en spirale sont des
    cordons hélicoïdaux qui se contractent hors tension — elles restent
    enroulées sur le pont en pagayant et se déploient lors d'une chute. Elles
    maintiennent la lanière hors de l'eau en conditions calmes, réduisant la
    traînée.
  solution: >-
    Choisissez une lanière en spirale pour les eaux calmes, le fitness et
    l'excursion en SUP. La traînée réduite aide à maintenir la vitesse et
    évite que la lanière ne s'accroche aux objets submergés. Choisissez une
    lanière droite pour le surf SUP et la pagaie en rivière. La conception
    droite s'accroche moins facilement aux ailerons ou aux obstacles.
  recommendation: >-
    Les packs SUP Paddle Board Overstock incluent le type de lanière adapté à
    l'utilisation prévue de la planche. La lanière en spirale du pack SUP
    Explorer 11 est excellente pour le paddling polyvalent.
  faq:
    - q: La lanière doit-elle se fixer à la cheville ou au mollet ?
      a: >-
        La fixation au mollet est préférée pour le SUP — elle maintient la
        lanière hors de l'eau pendant la pagaie et réduit le risque de
        trébuchement à la marche.
    - q: Quelle longueur de lanière SUP choisir ?
      a: >-
        8-10' pour les eaux calmes, 6-8' pour le surf. Les lanières plus
        courtes réduisent la traînée mais limitent la liberté de mouvement
        sur la planche.
    - q: Faut-il une lanière à dégagement rapide pour les rivières ?
      a: >-
        Oui — le SUP en rivière exige une lanière ou une ceinture à
        dégagement rapide qui peut être détachée instantanément pour éviter
        tout piégeage dans les branchages.
    - q: Puis-je utiliser une lanière de surf pour le SUP ?
      a: >-
        Les lanières de surf sont plus courtes et plus fines. Elles
        conviennent au surf SUP mais ne sont pas idéales pour les eaux
        calmes, où une lanière en spirale plus longue est préférable.
