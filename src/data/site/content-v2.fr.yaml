- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Les règles d'étiquette du surf (comment ne pas être celui que tout le monde évite)
  description: >-
    La zone de départ a des règles que personne n'écrit. Apprenez la priorité,
    pourquoi le snake vous vaudra des cris, comment vous excuser et les erreurs
    de débutant qui agacent chaque surfeur local.
  definition: >-
    L'étiquette du surf est un code de conduite non écrit qui prévient les
    collisions et permet un partage équitable des vagues. La règle fondamentale
    : le surfeur le plus proche du pic de la vague qui déferle a la priorité.
  tldr: >-
    Le surfeur le plus proche du pic de la vague qui déferle a la priorité. Ne
    dropez pas sur quelqu'un, ne snakez pas (contourner un surfeur pour prendre
    sa vague) et excusez-vous toujours en cas d'erreur. Contournez largement la
    zone de départ en pagayant, tenez bien votre planche et restez convivial —
    le respect attire le respect.
  problem: >-
    Vous pagayez vers une zone de départ bondée et sentez immédiatement la
    tension. Les surfeurs vous lancent des regards en coin, quelqu'un vous crie
    dessus et vous ne savez pas ce que vous avez fait de travers. Le côté social
    du surf semble plus intimidant que les vagues elles-mêmes.
  explanation: >-
    L'étiquette du surf existe pour prévenir les collisions et partager
    équitablement les vagues. La règle fondamentale est la priorité : le
    surfeur le plus proche du pic (là où la vague déferle en premier) a la
    priorité. Quiconque pagaye vers la même vague depuis plus loin à l'intérieur
    doit se retirer. Le snake — contourner un autre surfeur pour voler la
    priorité — est considéré comme la pire des offenses. Au-delà de la priorité,
    la zone de départ impose des attentes concernant le bruit (limitez les cris
    au minimum), le contrôle de la planche (ne la laissez jamais s'approcher des
    autres) et la convivialité (un simple signe de tête suffit largement).
  solution: >-
    Observez la zone de départ pendant 10 minutes avant de pagayer. Repérez qui
    attrape le plus de vagues — ce sont les surfeurs à respecter et à éviter.
    Restez à l'intérieur (zone d'écume blanche) si vous apprenez. Contournez
    largement la zone de départ en pagayant, ne la traversez pas. Quand vous
    attrapez une vague, regardez des deux côtés avant de vous relever et
    assurez-vous que personne n'est plus proche du pic.
  recommendation: >-
    Passez vos premières sessions dans un spot adapté aux débutants avec des
    foules dispersées. Apprenez à lire la priorité avant de tenter une zone de
    départ fréquentée. Si vous dropez sur quelqu'un, excusez-vous immédiatement
    et pagayez vers lui — la plupart des surfeurs respectent une erreur honnête.
  faq:
    - q: Qu'est-ce que droper ?
      a: >-
        Droper signifie pagayer et rider une vague dont un autre surfeur a déjà
        la priorité. C'est dangereux et manquer de respect. Le surfeur le plus
        proche du pic possède la vague ; tous les autres doivent se retirer.
    - q: Qu'est-ce que le snake ?
      a: >-
        Le snake consiste à contourner un surfeur déjà en position pour une
        vague afin de se retrouver plus proche du pic. C'est considéré comme une
        faute d'étiquette extrême qui peut mener à la confrontation.
    - q: Les débutants peuvent-ils surfer sur des spots bondés ?
      a: >-
        Oui, mais restez dans la zone d'écume blanche, loin du pic. Ne pagayez
        pas vers la zone de décollage principale tant que vous ne savez pas
        attraper les vagues régulièrement et contrôler votre direction.
        Naviguer dans une zone de départ fréquentée demande de l'expérience
        pour le faire en toute sécurité.
    - q: Comment m'excuser dans l'eau ?
      a: >-
        Un simple geste de la main, un sourire et un « my bad » ou « désolé »
        suffisent. Reconnaissez l'erreur et éloignez-vous en pagayant. Les
        surfeurs pardonnent généralement les erreurs honnêtes, surtout si vous
        êtes clairement en apprentissage.
    - q: Que faire si quelqu'un drope sur moi ?
      a: >-
        S'il s'agit d'un drop-in clair, criez « wave » ou « hey » pour l'alerter.
        S'il attrape la vague par accident et s'excuse, laissez tomber. Si
        quelqu'un drope sur vous à répétition, pagayez vers lui et expliquez
        poliment la priorité. Évitez les confrontations.
