- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: Combinaison 3 mm vs 5 mm (ce qui fonctionne vraiment pour le surf en eau froide)
  description: >-
    Le choix entre une combinaison 3 mm et 5 mm dépend de la température de
    l'eau, pas de celle de l'air. Tableau des températures, comparaison de la
    flexibilité et quelle épaisseur vous garde au chaud sans entraver votre
    pagaie.
  definition: >-
    Une combinaison 3 mm convient aux eaux de 14 à 20 °C avec une bonne
    flexibilité. Une combinaison 5 mm couvre 8 à 14 °C avec un maximum de
    chaleur mais une mobilité réduite. Le choix est un compromis direct entre
    chaleur et amplitude de mouvement.
  tldr: >-
    Les combinaisons 3 mm sont faites pour les eaux de 14 à 20 °C et offrent une
    flexibilité maximale. Les combinaisons 5 mm sont pour 8 à 14 °C et
    privilégient la chaleur. Choisissez en fonction de la température de l'eau
    locale, pas de celle de l'air. Si vous surfez toutes les saisons, possédez
    les deux. Si vous ne pouvez en acheter qu'une, une 4/3 mm offre le meilleur
    compromis.
  problem: >-
    Vous avez besoin d'une combinaison mais hésitez entre une 3 mm et une 5 mm.
    Une 3 mm risque de ne pas être assez chaude en hiver, et une 5 mm trop
    épaisse et restrictive pour les jours plus doux. Une mauvaise supposition
    signifie soit geler tout l'hiver, soit transpirer tout l'automne.
  explanation: >-
    L'épaisseur du néoprène est directement proportionnelle à la chaleur et
    inversement proportionnelle à la flexibilité. Une combinaison 3 mm (souvent
    3/2 mm avec des manches plus fines) offre une bonne mobilité pour pagayer et
    surfer dans des conditions douces. Une combinaison 5 mm utilise du néoprène
    plus épais sur le torse et souvent des panneaux plus fins sur les bras et
    les jambes (5/4/3 mm) pour conserver une certaine flexibilité. La différence
    de chaleur couvre environ 6 à 8 °C de plage. Différences clés : les
    combinaisons 5 mm utilisent plus de néoprène, pèsent environ 40 % de plus,
    mettent plus de temps à sécher et demandent plus d'efforts pour les enlever.
    Les néoprènes super-élastiques modernes réduisent l'écart de flexibilité,
    mais une 5 mm restreint toujours nettement les mouvements.
  solution: >-
    Déterminez votre température mensuelle moyenne de l'eau la plus froide à
    l'aide des données des bouées locales. Si elle est supérieure à 16 °C,
    achetez une 3/2 mm. Si elle est entre 12 et 16 °C, achetez une 4/3 mm. Si
    elle est inférieure à 12 °C, achetez une 5/4/3 mm. Pour surfer toute l'année
    avec une seule combinaison, une 4/3 mm de qualité avec doublure thermique,
    plus une cagoule, des bottillons et des gants séparés, couvre la plus large
    plage.
  recommendation: >-
    L'Paddle Board Overstock Wetsuit Pro en 5/4/3 mm gère 8 à 16 °C avec une doublure
    thermique qui compense le manque de chaleur d'une vraie 5 mm. Si vous surfez
    surtout dans des conditions douces (16 à 20 °C), la 3/2 mm Paddle Board Overstock Wetsuit
    Pro offre une meilleure flexibilité et un meilleur confort.
  faq:
    - q: Puis-je porter une 3 mm dans de l'eau à 10 °C ?
      a: >-
        Uniquement pour des sessions très courtes (20 à 30 minutes) et avec un
        rashguard thermique en dessous. Vous aurez froid pendant la majeure
        partie de la session. Une 5 mm ou 5/4/3 mm est fortement recommandée
        pour de l'eau à 10 °C.
    - q: Une combinaison 5 mm est-elle trop chaude pour l'été ?
      a: >-
        Si la température estivale de l'eau dépasse 18 °C, une 5 mm provoquera
        une surchauffe. Vous pouvez rincer la combinaison à l'eau fraîche, mais
        vous serez plus à l'aise dans une 3/2 mm ou un shorty pendant les mois
        d'été.
    - q: Une combinaison 5 mm limite-t-elle la pagaie ?
      a: >-
        Oui, nettement. Le néoprène plus épais au niveau des épaules demande
        plus d'effort à chaque coup de pagaie. Une 5/4/3 mm avec des manches
        plus fines aide, mais vous vous fatiguerez quand même plus vite que dans
        une 3 mm.
    - q: Quelle est la meilleure combinaison pour surfer toute l'année ?
      a: >-
        Une 4/3 mm intégrale avec zip sur la poitrine et doublure thermique
        couvre 12 à 18 °C, soit toute l'année dans de nombreux climats
        tempérés. Ajoutez des bottillons pour l'hiver et vous pouvez surfer
        entre 10 et 18 °C avec une seule combinaison.
