- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Réparation de combinaison : réparez déchirures, coutures et fermetures éclair vous-même'
  description: >-
    Guide de réparation DIY de combinaison pour les déchirures de néoprène, les
    coutures décousues, les fermetures éclair coincées et les genouillères
    fendues. Instructions pas à pas avec de la colle néoprène.
  definition: >-
    La réparation d'une combinaison consiste à nettoyer et poncer la zone
    endommagée, appliquer de la colle néoprène puis laisser durcir sous
    pression pour rétablir l'étanchéité et la souplesse.
  tldr: >-
    Petites déchirures de moins de 1" : appliquez la colle néoprène sur les deux
    faces, attendez 10-15 minutes jusqu'à ce qu'elle soit collante, pressez
    fermement, puis laissez durcir sous poids pendant 12 heures. Les déchirures
    plus grandes nécessitent une pièce en néoprène. Problèmes de fermeture
    éclair : lubrifiez d'abord, puis vérifiez les tissus coincés.
  problem: >-
    Votre combinaison présente une petite déchirure, une couture qui se défait
    ou une fermeture éclair qui accroche. Sans réparation DIY, vous déboursez
    150 $ ou plus pour un remplacement alors que la réparation coûte 5 $.
  explanation: >-
    La colle néoprène agit en ramollissant la surface du néoprène, créant une
    liaison chimique à mesure que le solvant s'évapore. La colle doit être
    appliquée sur les deux surfaces et devenir collante avant l'assemblage.
    Pour les déchirures, les bords doivent s'aligner précisément. Les problèmes
    de fermeture éclair viennent souvent de la corrosion du sel ou d'un tissu
    pris dans les dents.
  solution: >-
    Pour les déchirures : nettoyez à l'alcool, poncez légèrement, appliquez une
    fine couche de colle sur les deux bords, attendez qu'elle soit collante,
    pressez parfaitement, appliquez un poids puis laissez durcir 12-24 heures.
    Pour les pièces : découpez une pièce 1" plus grande que la déchirure,
    enduisez les deux surfaces, puis serrez. Pour la fermeture éclair : rincez,
    appliquez de la cire pour fermeture éclair et manœuvrez doucement.
  recommendation: >-
    Gardez un kit de réparation de combinaison Paddle Board Overstock dans votre sac de
    matériel. Pour les grosses réparations ou les défauts de couture aux points
    critiques, une réparation professionnelle est recommandée.
  faq:
    - q: Puis-je utiliser de la super glue sur une combinaison ?
      a: >-
        Non — la super glue sèche en devenant dure et cassante. Utilisez
        uniquement de la colle néoprène ou de l'aquaseal pour réparer une
        combinaison.
    - q: Combien de temps dure une réparation à la colle néoprène ?
      a: >-
        Une réparation bien faite est souvent plus résistante que le néoprène
        d'origine et dure toute la vie restante de la combinaison.
    - q: Puis-je réparer une fermeture éclair complètement séparée ?
      a: >-
        Si le ruban s'est décollé du néoprène, recollez-le avec une colle de
        contact. Si les dents sont endommagées, faites remplacer la fermeture
        éclair par un professionnel.
    - q: Comment réparer une combinaison qui fuit au niveau d'une couture ?
      a: >-
        Appliquez un fin cordon d'aquaseal le long de l'intérieur de la couture
        qui fuit et laissez durcir pendant 24 heures.
