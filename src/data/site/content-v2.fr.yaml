- slug: surfboard-size-guide
  category: guide
  type: buying-guide
  title: Guide des tailles de surfboard (le volume est ce qui compte vraiment)
  description: >-
    Arrêtez de deviner les tailles de surfboard. Le volume en litres détermine
    tout — la facilité à attraper les vagues, la stabilité ressentie et la
    vitesse de progression. Trouvez votre nombre de litres cible en 2 minutes.
  definition: >-
    La taille d'un surfboard relève avant tout du volume (en litres), pas de la
    longueur. Le volume détermine la flottabilité et la capacité à attraper les
    vagues. Les planches plus longues pagayent plus vite ; les planches plus
    larges sont plus stables ; les planches plus épaisses offrent plus de volume
    sans longueur ajoutée.
  tldr: >-
    La taille d'un surfboard repose sur le volume, pas seulement sur la
    longueur. Les débutants ont besoin de 60-80 litres, les intermédiaires de
    35-55 litres, et les surfeurs avancés de 20-35 litres. Utilisez votre poids
    comme facteur principal : chaque 10 kg nécessite environ 10-12 litres de
    volume au niveau débutant.
  problem: >-
    Debout devant un râtelier de surfboards avec des chiffres comme
    7'2" x 22" x 3" imprimés sur le rail, vous n'avez aucune idée de ce que ces
    mesures donnent dans l'eau. Acheter selon l'apparence ou ce que surfe un ami
    mène à une planche soit trop instable, soit trop difficile à pagayer.
  explanation: >-
    La taille d'un surfboard se comprend le mieux par trois dimensions : la
    longueur (puissance de pagaie et attrapage des vagues), la largeur
    (stabilité) et l'épaisseur (volume et flottabilité). Le chiffre qui compte
    vraiment est le volume en litres. Les planches en mousse et les gonflables
    atteignent un volume élevé par la largeur et l'épaisseur plutôt que par une
    longueur excessive, ce qui les rend gérables pour les débutants. À mesure
    que vous progressez, vous réduisez le volume pour permettre à la planche de
    s'enfoncer plus profondément dans la face de la vague et de virer plus
    réactivement.
  solution: >-
    Utilisez un calculateur volume-poids : pour les débutants, divisez votre
    poids en kg par 1,5 pour obtenir les litres cibles. Pour les
    intermédiaires, divisez par 2. Les intermédiaires devraient rechercher des
    planches avec un rocker modéré et une queue squash ou ronde pour la
    polyvalence.
  recommendation: >-
    L'Paddle Board Overstock Surfboard Pro offre 75 litres de volume dans un format 10'6" —
    idéal pour les débutants jusqu'à 90 kg. Les surfeurs plus légers peuvent
    descendre vers le SUP Tour 12 pour une sensation plus maniable à mesure
    qu'ils progressent.
  faq:
    - q: La taille physique compte-t-elle pour la taille du surfboard ?
      a: >-
        La taille compte moins que le poids. Un surfeur grand et léger a besoin
        de moins de volume qu'un surfeur petit et lourd de même taille. Utilisez
        le poids comme métrique principale et ajustez selon la forme physique et
        la force de pagaie.
    - q: Que se passe-t-il si ma planche a trop de volume ?
      a: >-
        Trop de volume rend la planche flottante comme du liège et instable sur
        la face de la vague. Vous aurez du mal à enfoncer le rail pour virer et
        risquez de rebondir sur l'eau pendant les bottom turns.
    - q: Que se passe-t-il si ma planche a trop peu de volume ?
      a: >-
        Vous aurez du mal à pagayer dans les vagues, vous enfoncerez trop
        profondément au décollage et vous vous sentirez instable simplement
        assis sur la planche en attendant. Les débutants ont presque toujours
        besoin de plus de volume qu'ils ne le pensent.
    - q: Comment savoir quand passer à une taille inférieure ?
      a: >-
        Lorsque vous attrapez régulièrement les vagues, faites des pop-ups
        fluides et réalisez des virages de base sur votre planche actuelle, il
        est temps de descendre de 5-10 litres. Passer à une taille inférieure
        trop tôt ralentit votre progression.
