- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'Hydratation et Protection Solaire en SUP : Rester en Sécurité sur l''Eau'
  description: >-
    Stratégies essentielles d'hydratation et de protection solaire pour les
    pagayeurs de SUP. La déshydratation et les coups de soleil sont les
    problèmes de SUP les plus courants — comment les prévenir pendant les
    longues sessions.
  definition: >-
    L'hydratation en SUP consiste à maintenir l'équilibre hydrique pendant la
    pagaie grâce à des apports réguliers en eau. La protection solaire comprend
    l'application de crème solaire, le port de vêtements protecteurs et le
    choix des horaires pour éviter les pics d'UV.
  tldr: >-
    Buvez 500 ml d'eau par heure de pagaie. Emportez plus que vous ne pensez en
    avoir besoin — une poche à eau de 2 L ou plusieurs bouteilles. Appliquez
    une crème solaire SPF 50+ résistante à l'eau avant de partir et renouvelez
    toutes les 2 heures. Portez un chapeau, des lunettes de soleil avec cordon
    et des vêtements avec indice UPF. Évitez de pagayer entre 11 h et 15 h
    lorsque les UV sont les plus intenses.
  problem: >-
    Vous profitez d'une excellente session de SUP, mais après une heure vous
    avez mal à la tête, la bouche sèche et la peau qui brûle. La déshydratation
    et les coups de soleil s'installent insidieusement parce que l'eau vous
    maintient au frais.
  explanation: >-
    La réflexion sur l'eau intensifie l'exposition aux UV jusqu'à 40 %.
    L'effet rafraîchissant de l'eau et de la brise masque les coups de soleil
    jusqu'à ce qu'il soit trop tard. La transpiration liée à la pagaie
    augmente les pertes hydriques, et il n'y a souvent aucun moyen de remplir
    d'eau en pleine eau. La déshydratation altère l'équilibre et la prise de
    décision, augmentant le risque d'accident.
  solution: >-
    Attachez une bouteille d'eau ou une poche à eau au système d'élastiques de
    la planche. Buvez toutes les 15 minutes, que vous ayez soif ou non.
    Appliquez une crème solaire SPF 50+ 30 minutes avant la mise à l'eau.
    Portez un chapeau à larges bords, des lunettes de soleil polarisées avec
    cordon et un rash guard UPF 50+. Renouvelez la crème solaire toutes les 2
    heures.
  recommendation: >-
    Utilisez une poche à eau attachée aux anneaux en D avant de votre Paddle Board Overstock
    SUP. Portez un rash guard UPF 50+ sous votre VFI. Utilisez une crème
    solaire waterproof qui tient sous la transpiration et dans l'eau.
  faq:
    - q: Quelle quantité d'eau dois-je emporter en sortie SUP ?
      a: >-
        Au minimum 1 litre par heure. Pour une session de 2 heures, emportez 2
        litres. Davantage par temps chaud. Une poche à eau est la meilleure
        option.
    - q: Quel type de crème solaire est le meilleur pour le SUP ?
      a: >-
        Une crème large spectre, résistante à l'eau et à SPF 50+. Les crèmes
        minérales (oxyde de zinc, dioxyde de titane) sont respectueuses des
        récifs et tiennent plus longtemps.
    - q: L'eau reflète-t-elle vraiment les UV ?
      a: >-
        Oui — l'eau reflète jusqu'à 40 % du rayonnement UV, ce qui signifie que
        vous recevez des UV d'en haut et d'en bas. Cela augmente
        considérablement le risque de coups de soleil.
    - q: Puis-je attraper un coup de soleil à travers un rash guard ?
      a: >-
        Les rash guards standard n'offrent qu'une protection UV minimale
        (environ UPF 10-20). Recherchez des vêtements classés UPF 50+ pour une
        protection complète.
