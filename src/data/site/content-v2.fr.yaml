- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'Guide des tailles de SUP : longueur, largeur et volume expliqués'
  description: >-
    Trouvez la bonne taille de SUP selon votre poids, votre niveau de
    compétence et votre style de pagaie. La longueur détermine le maintien du
    cap, la largeur détermine la stabilité et le volume détermine la capacité
    de charge.
  definition: >-
    La taille d'un SUP se définit par la longueur (vitesse et glisse), la
    largeur (stabilité primaire), l'épaisseur (stabilité secondaire et volume)
    et le volume en litres (capacité de charge totale).
  tldr: >-
    SUP polyvalents : 10'6"-11'6" x 32"-34" x 6" (220-280L). Touring : 12'-14' x
    30"-32" (280-350L). Surf : 8'-10' x 30"-32" (140-220L). Les débutants ont
    besoin d'une largeur supérieure à 32" et d'un volume dépassant leur poids
    corporel de 60 à 80 L. Votre poids en kg plus 60 L est le volume minimum
    cible pour la stabilité.
  problem: >-
    Chaque marque de SUP liste ses planches en pieds, pouces et litres, mais
    sans savoir comment ces mesures se traduisent dans la pratique, vous
    risquez d'acheter une planche instable, lente, ou incapable de supporter
    votre poids.
  explanation: >-
    La longueur détermine la vitesse de pagaie et le maintien du cap en ligne
    droite. Les planches plus longues (12'+ ) glissent entre les coups de pagaie
    et tiennent leur ligne. Les planches plus courtes (moins de 10') virent
    facilement mais exigent des changements de côté plus fréquents. La largeur
    détermine la stabilité primaire — la stabilité debout. Une planche de 30"
    semble instable aux débutants ; une planche de 34" semble aussi stable
    qu'un quai. L'épaisseur détermine le volume — une planche plus épaisse
    flotte plus haut mais capte plus de vent. Le volume en litres est la
    meilleure mesure : la planche chargée (vous plus votre équipement) devrait
    s'enfoncer de 2 à 4 pouces au repos.
  solution: >-
    Faites correspondre les dimensions de votre planche à trois facteurs : votre
    poids (détermine le volume minimum), votre activité principale (détermine
    la longueur) et votre niveau de compétence (détermine la largeur). Pour les
    débutants, multipliez le poids en kg par 2.2 pour obtenir les litres
    minimum. Pour les intermédiaires, multipliez par 1.8. Pour les avancés,
    multipliez par 1.4.
  recommendation: >-
    L'Paddle Board Overstock SUP Explorer 11, en 11' x 33" x 6" avec 260L, convient à la
    plupart des pagayeurs jusqu'à 100 kg pour une pagaie polyvalente. Passez au
    SUP Tour 12, en 12' x 31", pour une meilleure vitesse et une meilleure
    glisse en randonnée.
  faq:
    - q: Quelle taille de SUP me faut-il pour mon poids ?
      a: >-
        Pour les pagayeurs de moins de 70 kg : 10-11' x 32" (220-260L). Pour
        70-90 kg : 11-12' x 33" (260-300L). Pour 90-110 kg : 11-12' x 34"
        (300-350L). Pour plus de 110 kg : 12' x 34-36" (350L+).
    - q: Un SUP plus long est-il plus rapide ?
      a: >-
        Oui. Les planches plus longues ont un meilleur rapport
        longueur-largeur, ce qui réduit la traînée. Un SUP de randonnée de 14'
        est nettement plus rapide qu'un SUP polyvalent de 11' à effort de pagaie
        égal.
    - q: Quelle largeur de SUP est stable pour les débutants ?
      a: >-
        33-34 pouces est la zone idéale pour les débutants jusqu'à 90 kg. En
        dessous de 32", un bon équilibre est nécessaire. Au-dessus de 34", la
        planche est très stable mais plus lente et plus difficile à pagayer par
        vent.
    - q: Puis-je utiliser une planche polyvalente pour la randonnée ?
      a: >-
        Oui, pour les courtes randonnées de moins de 10 km. Sur de plus longues
        distances, une planche de randonnée dédiée maintient mieux le cap et
        couvre la distance plus efficacement.
