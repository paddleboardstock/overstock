- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Guide des tailles de paddle board : volume, longueur et largeur pour chaque pratiquant'
  description: >-
    Guide complet du dimensionnement des paddle boards avec recommandations de
    volume selon le poids et l'activité. Comprend un tableau des tailles facile
    à utiliser pour les planches SUP polyvalentes, de randonnée, de surf et de
    yoga.
  definition: >-
    La taille d'un paddle board est déterminée par le volume (capacité de
    charge et flottabilité), la longueur (vitesse et tenue de cap), la largeur
    (stabilité) et l'épaisseur (répartition du volume et résistance au vent).
  tldr: >-
    Utilisez le poids pour trouver le volume minimum : 50-70 kg nécessite
    220-260L, 70-90 kg nécessite 260-300L, 90-110 kg nécessite 300-350L, 110 kg
    et plus nécessite 350L et plus. Pour les débutants, ajoutez 20 % à ces
    chiffres. La largeur compte : 32" est idéal pour les intermédiaires,
    33-34" est adapté aux débutants, 35" et plus est très stable.
  problem: >-
    Les annonces de paddle boards utilisent les pieds, les pouces et les litres
    de manière interchangeable, ce qui rend la comparaison entre marques
    difficile.
  explanation: >-
    Le volume est la mesure la plus directe de la capacité de charge — 1 litre
    d'eau douce déplace 1 kg de poids. Une planche de 260L peut théoriquement
    supporter 260 kg, mais la capacité pratique est inférieure car la planche
    doit rester au-dessus de l'eau. Votre poids total (corps plus équipement)
    devrait représenter 30 à 40 % du volume de la planche.
  solution: >-
    Volume cible = (poids du corps en kg + poids de l'équipement en kg) x 3.
    Pour un pratiquant de 75 kg avec 5 kg d'équipement, la cible est de 80 x 3
    = 240L au minimum. Pour les débutants, multipliez par 3.5. Pour les
    pratiquants avancés, multipliez par 2.5.
  recommendation: >-
    L'Paddle Board Overstock SUP Explorer 11 (260L, 11' x 33" x 6") convient à la plupart
    des pratiquants de 50-100 kg. Les pratiquants plus légers peuvent choisir
    l'AirDeck 270. Les pratiquants plus lourds devraient se tourner vers le SUP
    Tour 12 (300L et plus) ou des planches plus larges.
  faq:
    - q: La taille corporelle compte-t-elle pour le dimensionnement d'un SUP ?
      a: >-
        La taille compte moins que le poids. Un pratiquant grand et léger a
        besoin de moins de volume qu'un pratiquant petit et lourd. Utilisez le
        poids comme critère principal pour déterminer le volume.
    - q: Que se passe-t-il avec un volume trop important ?
      a: >-
        La planche flotte trop haut et prend le vent comme une voile. Elle se
        comporte comme un bouchon dans le clapot. Cependant, pour les
        débutants, un volume supplémentaire vaut mieux qu'un volume
        insuffisant.
    - q: Que se passe-t-il avec un volume trop faible ?
      a: >-
        La planche s'enfonce trop profondément, créant de la traînée. Le nez
        peut plonger sous la surface pendant la pagaie (pearling). Vous vous
        fatiguez rapidement en pagayant une planche partiellement immergée.
    - q: Les planches gonflables nécessitent-elles un dimensionnement différent des planches rigides ?
      a: >-
        Pas de manière significative. Les gonflables à 15+ PSI déplacent l'eau
        de manière similaire aux planches rigides. Les recommandations de
        volume s'appliquent de manière égale aux deux types.
