- slug: beginner-sup-guide
  category: problem
  type: tutorial
  title: 'Le stand up paddle pour débutants : votre première session'
  description: >-
    Tout ce qu'il faut savoir avant votre première session de SUP : liste de
    l'équipement, comment se mettre debout, technique de pagaie, tomber en
    toute sécurité et choisir une eau calme pour apprendre.
  definition: >-
    Le stand up paddle (SUP) consiste à se tenir debout sur une planche et à
    utiliser une pagaie pour se propulser sur l'eau. L'équilibre, la technique
    de coup de pagaie et la lecture des conditions de l'eau sont les trois
    compétences essentielles.
  tldr: >-
    Commencez sur une eau plate et calme, sans vent. Entraînez-vous d'abord à
    genoux, puis tenez-vous debout, pieds écartés à la largeur des hanches,
    près du centre de la planche. Tenez la pagaie avec une main sur le T et
    l'autre sur la tige. Utilisez la rotation du tronc, pas la force des bras,
    pour pagayer. Regardez l'horizon, pas vos pieds. Attendez-vous à tomber —
    cela fait partie de l'apprentissage.
  problem: >-
    Vous gonflez votre premier SUP, montez sur la planche et vous sentez
    immédiatement instable. Vos jambes tremblent, la pagaie semble
    inconfortable, et vous ne comprenez pas pourquoi vous tournez en rond au
    lieu d'avancer tout droit.
  explanation: >-
    Le SUP exige un ajustement de l'équilibre, car se tenir sur une plateforme
    flottante n'a rien à voir avec les activités terrestres. Votre corps se
    crispe instinctivement, ce qui rend la planche encore plus instable. Le coup
    de pagaie doit venir de la rotation du tronc, pas d'une traction des bras.
    La pale doit entrer dans l'eau près de vos orteils et ressortir près de
    votre cheville. La plupart des débutants pagayent avec les bras seuls, ce
    qui entraîne une fatigue rapide et un mauvais maintien du cap. Regarder la
    planche déséquilibre.
  solution: >-
    Gonflez la planche au PSI recommandé, attachez le leash à votre cheville et
    commencez à genoux. Pagayez à genoux pour prendre le ressenti de la glisse.
    Quand vous êtes prêt à vous lever, placez la pagaie en travers de la
    planche, posez les deux mains sur le deck, montez un pied après l'autre et
    redressez-vous en gardant le poids centré. Gardez les genoux légèrement
    fléchis et les abdos engagés.
  recommendation: >-
    Utilisez l'Paddle Board Overstock SUP Explorer 11 pour sa largeur de 33" et sa
    plateforme stable. Entraînez-vous sur un lac ou une baie protégée sans
    courant. Portez un gilet de sauvetage lors de vos premières sessions.
  faq:
    - q: Combien de temps faut-il pour apprendre le SUP ?
      a: >-
        La plupart des gens peuvent se tenir debout et pagayer sur une eau
        calme en 10 à 15 minutes. La maîtrise demande 3 à 5 sessions. Les
        compétences avancées demandent des mois.
    - q: Quelle est la meilleure condition de vent pour les débutants ?
      a: >-
        Un vent de moins de 5 nœuds (calme à légère brise). Un vent supérieur à
        10 nœuds crée un clapot qui met l'équilibre à l'épreuve. Les débutants
        doivent éviter le vent de terre.
    - q: Dois-je porter un leash ?
      a: >-
        Portez toujours un leash. Un leash SUP enroulé s'attache à la cheville
        ou au mollet et garde la planche avec vous si vous tombez. En eau libre,
        un leash peut vous sauver la vie.
    - q: Quelle est l'erreur la plus courante des débutants ?
      a: >-
        Regarder la planche. Gardez les yeux sur l'horizon. Votre corps suit
        votre tête — regarder vers le bas déplace votre poids vers l'avant et
        fait tanguer la planche.
