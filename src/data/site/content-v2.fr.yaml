- slug: ocean-conditions-explained
  category: guide
  type: technical
  title: Les conditions océaniques expliquées (lisez la prévision de surf comme un pro)
  description: >-
    Hauteur de houle, période, direction du vent, marée — décodez n'importe
    quelle prévision de surf en 60 secondes. Ce que les chiffres signifient
    réellement pour votre spot local et quand rester sur la plage.
  definition: >-
    Les conditions océaniques sont déterminées par trois facteurs : la houle
    (hauteur, période, direction), le vent (le vent de terre donne une houle
    propre, le vent de mer une surface hachée) et la marée (qui change la
    profondeur de l'eau au-dessus des bancs de sable et des récifs).
  tldr: >-
    Trois facteurs déterminent la qualité du surf : la houle (taille, période,
    direction), le vent (le vent de terre est propre, le vent de mer rend la
    surface irrégulière) et la marée (qui pousse ou retire l'eau au-dessus des
    bancs de sable). Utilisez la période de la houle pour juger de la puissance
    — une période plus longue signifie des vagues plus puissantes. Consultez une
    prévision de surf combinant ces trois facteurs avant chaque session.
  problem: >-
    Les prévisions de surf affichent des chiffres déroutants : 3 pieds à 12
    secondes depuis 290°, léger vent de terre. Vous ignorez ce que cela signifie
    pour la plage où vous comptez surfer. Sans décoder la prévision, vous partez
    vers une plage plate ou vous pagayez dans des conditions dangereuses.
  explanation: >-
    La houle se mesure par sa hauteur (hauteur de face en pieds), sa période
    (secondes entre les vagues) et sa direction (d'où vient la houle). Les
    houles à longue période (12 secondes et plus) transportent plus d'énergie et
    produisent des vagues plus propres et plus puissantes. Qualité du vent : le
    vent de terre (qui souffle de la terre vers la mer) tient la face de la
    vague, créant des vagues lisses et propres ; le vent de mer (de la mer vers
    la terre) hachote la surface. Les vents côtiers sont acceptables mais pas
    idéaux. La marée affecte la forme des vagues selon le spot — les beach
    breaks donnent souvent leur plein potentiel à mi-marée, les reef breaks à
    des niveaux de marée spécifiques selon la profondeur du récif.
  solution: >-
    Utilisez un site ou une application de prévision de surf et apprenez à lire
    trois paramètres pour votre spot local. Recoupez la direction de la houle
    avec l'orientation de la plage — une plage exposée à l'ouest a besoin d'une
    houle d'ouest. Vérifiez la prévision du vent pour l'heure à laquelle vous
    comptez surfer, pas le bulletin du matin. Apprenez la préférence de marée de
    votre spot en l'observant à différents niveaux de marée.
  recommendation: >-
    Passez un mois à consigner les conditions et la qualité des vagues sur votre
    plage locale. Vous découvrirez des schémas : quelles directions de houle
    fonctionnent, quelles marées donnent la meilleure forme et quels vents
    gâchent la surface. Le guide des conditions océaniques s'associe au guide
    des bases de la sécurité du surf pour une culture océanique complète.
  faq:
    - q: Quelle est une bonne période de houle pour surfer ?
      a: >-
        8 à 10 secondes produisent des vagues faibles et désorganisées, adaptées
        aux débutants. 10 à 13 secondes est la zone idéale pour la plupart des
        spots — une bonne puissance sans être dangereux. 14 secondes et plus
        produisent des houles puissantes et concentrées, adaptées aux surfeurs
        avancés.
    - q: Quel est le meilleur vent pour surfer ?
      a: >-
        Un léger vent de terre (5 à 10 nœuds) produit les faces de vague les
        plus propres. Les conditions glassy (vent nul) sont idéales mais rares.
        Le vent de mer rend les vagues irrégulières et plus difficiles à rider.
        Un vent de terre fort peut rendre les décollages dangereux en maintenant
        trop longtemps la lèvre de la vague.
    - q: Comment la marée affecte-t-elle les vagues ?
      a: >-
        La marée change la profondeur au-dessus des bancs de sable et des
        récifs. À marée basse, les dangers peuvent être exposés et les vagues
        plus raides ou qui ferment (close out). À marée haute, les vagues
        peuvent s'amollir ou devenir grasses et lentes. La plupart des beach
        breaks donnent leur plein potentiel 2 à 3 heures avant ou après la marée
        haute ou basse.
    - q: Puis-je surfer par vent de mer ?
      a: >-
        Oui, mais la qualité sera moindre. Les faces de vague hachées rendent
        les virages plus difficiles et la pagaie moins efficace. Les débutants
        préfèrent souvent le vent de mer car les vagues sont plus douces et
        moins puissantes, ce qui laisse plus de temps pour se relever.
