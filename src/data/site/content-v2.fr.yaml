- slug: winter-paddle-boarding
  category: guide
  type: safety
  title: 'SUP en Hiver : Équipement, Sécurité et Technique pour l''Eau Froide'
  description: >-
    Le SUP hivernal exige un équipement et une préparation spécifiques.
    Épaisseur de la combinaison, sécurité en eau froide, choix de la planche et
    ajustements de technique pour la pagaie par temps froid.
  definition: >-
    Le paddle en hiver consiste à pratiquer le SUP dans des eaux à moins de
    15 °C, ce qui exige une protection thermique (combinaison ou drysuit), des
    protocoles de sécurité en eau froide et un équipement adapté au froid.
  tldr: >-
    Des eaux sous 15 °C exigent une combinaison : 5/4/3 mm pour 8-14 °C, 4/3 mm
    pour 12-18 °C. Ajoutez bottillons, gants et cagoule sous 10 °C. Gonflez la
    planche au PSI maximal — l'air froid réduit la pression. Portez des couleurs
    vives pour être visible dans une faible luminosité. Ne pagayez jamais seul.
    Emportez un téléphone dans un étui étanche.
  problem: >-
    Vous souhaitez pratiquer le SUP toute l'année, mais la saison hivernale
    présente des défis — eau froide, journées plus courtes, besoin d'un
    équipement d'hiver. Sans préparation adéquate, les sessions d'hiver sont
    froides, brèves et potentiellement dangereuses.
  explanation: >-
    L'eau froide conduit la chaleur 25 fois plus vite que l'air froid. Une
    chute dans une eau à 8 °C provoque un choc thermique immédiat et un
    refroidissement musculaire rapide. La priorité du corps est la survie, pas
    la pagaie. Le paddle hivernal exige une protection thermique qui préserve
    la mobilité — un équilibre entre chaleur et amplitude de mouvement.
  solution: >-
    Liste de contrôle de l'équipement : combinaison 5/4/3 mm avec zip poitrine,
    bottillons de 5 mm, gants de 3 mm, cagoule en néoprène, VFI (offre une
    isolation thermique supplémentaire), téléphone dans un étui étanche,
    sifflet. Technique : pagayez plus près de la rive, prévenez quelqu'un de
    votre itinéraire, vérifiez soigneusement la météo. Récupération après :
    préparez des vêtements secs et des boissons chaudes.
  recommendation: >-
    La combinaison Paddle Board Overstock Wetsuit Pro 5/4/3 mm avec doublure thermique est
    idéale pour le SUP hivernal. Ajoutez les bottillons Paddle Board Overstock de 5 mm et
    les gants de 3 mm. Portez le gilet Life Vest Pro pour une chaleur et une
    sécurité supplémentaires au niveau du tronc.
  faq:
    - q: Puis-je utiliser un SUP par températures glaciales ?
      a: >-
        Oui, mais évitez la formation de glace sur la planche. La glace peut
        endommager le PVC. Ne pagayez pas si de la glace se forme à la surface
        de l'eau.
    - q: Ai-je besoin d'une planche spéciale pour l'hiver ?
      a: >-
        Non, votre SUP gonflable habituel fonctionne très bien. L'air froid
        réduit le PSI — gonflez à la pression maximale. La planche semblera
        légèrement plus rigide.
    - q: Est-il sûr de pagayer seul en SUP en hiver ?
      a: >-
        Non — pagayez toujours à deux en eau froide. L'hypothermie peut
        s'installer en quelques minutes après une chute.
    - q: Comment me réchauffer en cours de session ?
      a: >-
        Adoptez une approche en couches — cagoule en néoprène, bottillons et
        gants peuvent être retirés si vous avez chaud. Gardez un thermos de
        boisson chaude à terre.
