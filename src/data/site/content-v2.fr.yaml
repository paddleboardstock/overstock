- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Conditions de vent pour le SUP : comment le vent affecte votre pagayage'
  description: >-
    Comment la vitesse et la direction du vent affectent le pagayage en SUP.
    Comprendre le vent offshore par rapport au vent onshore, lire les
    prévisions de vent, les techniques de pagayage par vent et savoir quand
    rester à terre.
  definition: >-
    Les conditions de vent définissent la sécurité en SUP. Le vent offshore
    (de la terre vers la mer) vous pousse au large. Le vent onshore (de la mer
    vers la terre) vous pousse vers le rivage. Le vent latéral fait dévier la
    planche.
  tldr: >-
    Vitesse de vent maximale sûre pour les débutants : 10 nœuds. Intermédiaires
    : 15 nœuds. Avancés : 20 nœuds. Le vent offshore est le plus dangereux.
    Pagayez d'abord contre le vent. Par vent latéral, pagayez légèrement au
    vent de votre destination. Agenouillez-vous par vent fort pour réduire
    votre surface exposée.
  problem: >-
    Vous pagayez dans des conditions calmes, mais 30 minutes plus tard le vent
    s'est levé et vous avez du mal à revenir. Le vent est le facteur de
    sécurité SUP le plus sous-estimé.
  explanation: >-
    Le vent affecte le SUP plus que tout autre embarcation à pagaie car vous
    êtes debout, créant un effet de voile. Un vent de 10 nœuds crée beaucoup
    plus de traînée sur un pagayeur debout que sur un kayakiste assis. Le vent
    offshore vous éloigne de la sécurité. Le vent latéral fait dévier la proue.
  solution: >-
    Vérifiez la vitesse et la direction du vent avant de pagayer. Utilisez
    l'échelle de Beaufort : Force 3 (7-10 nœuds) pour les débutants, Force 4
    (11-16) pour les intermédiaires. Pagayez d'abord contre le vent. Si vous
    êtes pris par un vent offshore, pagayez à 45 degrés par rapport au vent.
    Agenouillez-vous par vent fort.
  recommendation: >-
    Utilisez une application de prévisions de vent (Windy, Windfinder) avant
    chaque sortie. La planche Paddle Board Overstock SUP Tour 12 tient mieux le cap par vent
    que les planches plus larges. Par conditions venteuses, utilisez des coups
    de pagaie plus courts et une cadence plus élevée.
  faq:
    - q: Quelle direction de vent est la plus sûre pour le SUP ?
      a: >-
        Le vent onshore (qui souffle vers la terre) est le plus sûr — il vous
        pousse vers le rivage. Le vent offshore est le plus dangereux.
    - q: Comment pagayer par vent latéral ?
      a: >-
        Pagayez davantage du côté au vent pour compenser la dérive. Orientez la
        planche au vent de votre destination. Une dérive centrale plus profonde
        aide.
    - q: Puis-je pagayer par vent de 20 nœuds ?
      a: >-
        Seulement si vous êtes expérimenté et dans des eaux protégées. Les
        débutants ne devraient pas pagayer au-delà de 10 nœuds.
    - q: Comment les rafales de vent affectent-elles le SUP ?
      a: >-
        Les rafales provoquent des déséquilibres soudains. Par conditions
        rafaleuses, abaissez votre centre de gravité et préparez-vous aux
        changements soudains.
