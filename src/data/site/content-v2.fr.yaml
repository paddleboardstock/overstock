    - q: Puis-je voyager avec cette planche ?
      a: >-
        Oui. Elle se dégonfle et se range dans un sac de transport format sac à
        dos (environ 90 x 40 x 30 cm). Elle tient dans la plupart des
        compartiments à bagages en cabine ou peut être enregistrée comme bagage
        ordinaire. Le PVC de qualité militaire résiste aux manipulations
