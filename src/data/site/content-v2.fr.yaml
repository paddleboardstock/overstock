- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'Fitness en SUP : un entraînement complet du corps sur paddle board'
  description: >-
    Le SUP offre un entraînement complet du corps alliant endurance
    cardiovasculaire, stabilité du tronc et force. Comment structurer des
    séances de fitness en SUP, les meilleurs exercices et le suivi des progrès.
  definition: >-
    Le fitness en SUP utilise la plateforme instable d'un paddle board pour
    solliciter les muscles stabilisateurs du tronc, les muscles des jambes et
    le haut du corps à travers le pagayage, l'équilibre et des exercices
    réalisés sur la planche.
  tldr: >-
    Le SUP brûle 400 à 700 calories par heure. Une séance d'une heure en SUP
    sollicite le tronc, les jambes, le dos, les épaules et les bras. Le
    pagayage par intervalles (sprints + récupération) maximise le cardio. Les
    postures de yoga sur la planche développent équilibre et souplesse. Ajoutez
    des mouvements de renforcement spécifiques au SUP comme les squats et les
    fentes sur la planche.
  problem: >-
    Les séances de gym sont devenues ennuyeuses et vous voulez une activité en
    extérieur qui développe la condition physique tout en restant amusante. Le
    SUP combine l'aventure avec un véritable entraînement complet du corps.
  explanation: >-
    Le pagayage sollicite le grand dorsal, les deltoïdes, les trapèzes et les
    muscles du tronc pour la rotation. Se tenir debout sur une plateforme
    instable oblige les muscles stabilisateurs des chevilles, des genoux et des
    hanches à travailler en continu. Les exigences cardiovasculaires d'un
    pagayage soutenu à intensité modérée procurent un véritable entraînement
    aérobie.
  solution: >-
    Structurez vos séances : 5 min d'échauffement en pagayant, 20 min de
    pagayage à régime constant et allure modérée, 15 min de pagayage par
    intervalles (30 s de sprint, 60 s tranquille), 10 min d'exercices sur la
    planche (squats, fentes, pompes), 5 min d'étirements de récupération.
  recommendation: >-
    Utilisez le SUP Explorer 11 Paddle Board Overstock pour le pagayage fitness. Sa
    plateforme stable vous permet de vous concentrer sur la technique et
    l'intensité. Portez le Life Vest Pro pour la sécurité pendant les séances à
    haute intensité.
  faq:
    - q: Combien de calories le SUP brûle-t-il ?
      a: >-
        400 à 700 calories par heure selon l'intensité, le vent et le courant.
        Le pagayage par intervalles augmente la dépense calorique.
    - q: Le SUP est-il bon pour perdre du poids ?
      a: >-
        Oui, combiné à une alimentation adaptée. La sollicitation du corps
        entier et le faible impact en font une activité durable pour un
        exercice régulier.
    - q: Puis-je faire de la musculation sur un SUP ?
      a: >-
        Oui — des squats, fentes, pompes et planches sur la planche ajoutent un
        défi d'équilibre aux mouvements de renforcement.
    - q: Quels muscles le SUP fait-il travailler ?
      a: >-
        Primaires : tronc (obliques, transverse), dos (grand dorsal, trapèzes),
        épaules (deltoïdes), bras (biceps, triceps). Secondaires : jambes
        (quadriceps, ischio-jambiers, mollets).
