- slug: life-jacket-buying-guide
  category: guide
  type: buying-guide
  title: 'Guide d''achat du gilet de sauvetage : types, coupe et caractéristiques expliqués'
  description: >-
    Guide d'achat complet du gilet de sauvetage pour les sports nautiques.
    Types de VFI (de I à V), gonflables ou en mousse, test d'ajustement et
    recommandations spécifiques pour le SUP, le kayak, la navigation et la
    pêche.
  definition: >-
    Un gilet de sauvetage ou VFI est un dispositif de flottabilité conçu pour
    maintenir la tête d'une personne hors de l'eau. Les types sont réglementés
    par les garde-côtes américains en fonction de la flottabilité et de l'usage
    prévu.
  tldr: >-
    Cinq types de VFI : Type I (hauturier, 22+ lb), Type II (près des côtes),
    Type III (aide à la flottabilité, le plus courant), Type IV (à lancer),
    Type V (usage spécial). Les gilets gonflables offrent du confort mais
    exigent l'entretien de la cartouche de CO2. Les gilets en mousse sont sans
    entretien mais plus volumineux.
  problem: >-
    Les gilets de sauvetage sont classés par types et par flottabilité, mais
    les magasins n'expliquent pas toujours quel type convient à votre
    activité.
  explanation: >-
    Le Type I offre la flottabilité maximale et retourne le porteur inconscient
    sur le dos. Le Type II ne retourne pas tous les porteurs sur le dos. Le
    Type III permet la liberté de mouvement nécessaire aux sports actifs. Le
    Type V inclut les ceintures gonflables pour le SUP. Les VFI gonflables
    offrent 33-37 lb de flottabilité et sont compacts une fois dégonflés.
  solution: >-
    Pour le SUP : ceinture gonflable de Type V. Pour le kayak : Type III en
    mousse avec larges découpes au niveau des bras. Pour la navigation en RIB :
    Type III en mousse ou gonflable avec 22+ lb de flottabilité. Pour les
    enfants : Type II ou III en mousse avec sangle entrejambe.
  recommendation: >-
    La veste Paddle Board Overstock Life Vest Pro (Type V gonflable, 33 lb) pour le SUP et
    le kayak. La veste Paddle Board Overstock Life Vest Classic (Type III en mousse, 16.5
    lb) pour la navigation en RIB et l'usage marin général.
  faq:
    - q: De quel type de VFI ai-je besoin pour le SUP ?
      a: >-
        De nombreuses juridictions acceptent le Type III ou le Type V pour le
        SUP. Les ceintures gonflables sont populaires. Vérifiez les
        réglementations locales.
    - q: Les VFI gonflables nécessitent-ils un entretien ?
      a: >-
        Oui — vérifiez la cartouche de CO2 chaque année, remplacez le
        déclencheur tous les 2-3 ans et rincez après chaque usage en eau salée.
    - q: Puis-je porter un VFI en mousse pour le SUP ?
      a: >-
        Oui, mais choisissez un modèle avec de larges découpes au niveau des
        bras. Les gilets en mousse sont plus volumineux mais ne nécessitent
        aucun entretien.
    - q: Quel VFI convient le mieux à un enfant ?
      a: >-
        Un gilet en mousse Type II ou III approuvé USCG avec collier, sangle
        entrejambe et couleurs vives. N'utilisez jamais de VFI gonflables pour
        les enfants.
