- slug: weather-planning-water-sports
  category: guide
  type: safety
  title: 'Planification météo pour les sports nautiques : lire les prévisions comme un pro'
  description: >-
    Comment lire les prévisions météo marines pour le SUP, le surf et la
    navigation. Comprendre les fronts, les systèmes de pression, les régimes
    de vent et les alertes météo pour planifier des sorties sûres.
  definition: >-
    La planification météo consiste à interpréter les prévisions marines —
    vitesse et direction du vent, hauteur et période de la houle,
    précipitations, visibilité et alertes météo sévères.
  tldr: >-
    Consultez trois prévisions avant chaque sortie : vent, houle et météo.
    Meilleures conditions : vent offshore léger, houle modérée, pression haute
    ou en hausse. À éviter : orages, vent offshore fort, brouillard et pression
    chutant rapidement.
  problem: >-
    Vous roulez vers la côte sur la base d'une prévision à 3 jours qui promettait
    de bonnes conditions, pour trouver du vent à 25 nœuds et de la pluie. La
    météo marine est difficile à prévoir.
  explanation: >-
    La haute pression apporte un temps stable et des vents légers. La basse
    pression apporte du vent et des tempêtes. Le gradient de pression détermine
    la vitesse du vent. Les fronts froids apportent des changements soudains de
    vent. Des effets locaux comme les brises de mer peuvent contredire la
    prévision générale.
  solution: >-
    Utilisez plusieurs sources : Windy.com, NOAA, caméras de surf locales.
    Vérifiez 24 heures à l'avance et revérifiez le matin même. Recherchez des
    prévisions cohérentes entre les modèles. Apprenez les microclimats locaux.
  recommendation: >-
    Ajoutez Windy.com à vos favoris pour vos spots locaux. Emportez un
    téléphone dans un étui étanche. Pour la navigation, emportez une radio VHF
    pour les bulletins météo. En cas de doute, restez à terre.
  faq:
    - q: Quelles conditions météo dois-je éviter pour le SUP ?
      a: >-
        Les orages (foudre), le brouillard (visibilité nulle), le vent offshore
        de plus de 10 nœuds, les vents de plus de 20 nœuds et la pression en
        baisse.
    - q: Quelle est la précision des prévisions marines ?
      a: >-
        Les prévisions à 3 jours sont précises à environ 80 %. Les prévisions
        de la veille sont précises à plus de 90 % pour le vent.
    - q: Quelle est une bonne tendance barométrique pour les sports nautiques ?
      a: >-
        Une pression en hausse ou stable indique une amélioration des
        conditions. Une pression en baisse (1+ mb/heure) indique l'arrivée d'une
        tempête.
    - q: Puis-je faire du SUP dans le brouillard ?
      a: >-
        Non recommandé. Si vous êtes surpris par le brouillard, utilisez une
        boussole ou un GPS, sifflez toutes les 30 secondes et restez près de la
        côte.
