origin:
  tagline: 'Vårt opphav'
  heading: "Bygget på vannet,<br />\n<span class=\"text-sky-600\">drevet av formål</span>"
  paragraphs:
    - 'Aquafarer startet i et kystverksted med én båt og en sta overbevisning: marine produkter bør konstrueres som om de betyr noe — for det gjør de.'
    - 'Våre gründere, to båtkonstruktører, så en bransje der hjørner ble kuttet, materialer ble nedgradert og sikkerhet ble behandlet som et avkryssingspunkt. De bygde det første Aquafarer-skroget ikke for profitt, men for å bevise at rimelig marint utstyr også kan være genuint pålitelig.'
    - 'Det første skroget er fortsatt i drift i dag. Det prinsippet har aldri endret seg.'
    - 'Vi er ikke den største produsenten. Vi lager ikke de billigste produktene. Men hvert skrog som forlater verkstedet vårt, går gjennom de samme hendene som startet selskapet — og møter samme standard som det første skroget satte.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Aquafarers kystverksted'

philosophy:
  tagline: 'Vår filosofi'
  heading: 'Forankret i havet'
  description: 'Havet er ikke arbeidsplassen vår. Det er læreren vår. Hvert designvalg begynner med å forstå hvordan vann oppfører seg, hvordan forholdene endrer seg og hvordan utstyret må reagere.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respekter vannet'
      description: 'Vann er uforutsigbart. Produktene våre er konstruert for de verste forholdene, ikke de beste. Hvis et skrog takler en kraftig motstrøm, takler det også en innsjø. Hvis en redningsvest fungerer offshore, er den overdimensjonert for en elv — og det er bevisst.'
    - emoji: "\U0001F527"
      title: 'Bygget for å vare, ikke byttes ut'
      description: 'Det mest bærekraftige produktet er det som ikke trenger å byttes ut. Marin PVC, Hypalon og drop-stitch-konstruksjon er valgt for levetid. Vi sender fortsatt reservedeler til skrog vi bygde for et tiår siden.'
    - emoji: "\U0001F3C6"
      title: 'Tilgjengelig gjennom design'
      description: 'Vannsport bør ikke være en luksus. Vi konstruerer produkter som leverer profesjonell ytelse til en pris som gir mening for familier, guider og små operatører — ikke bare kommersielle flåter.'

design:
  tagline: 'Designfilosofi'
  heading: "Konstruert for ytterkanten<br />\n<span class=\"text-sky-600\">av forholdene</span>"
  paragraphs:
    - 'Hvert Aquafarer-produkt begynner med ett spørsmål: <em>hva er de verste forholdene det vil møte?</em> Vi designer fra kanten og innover, ikke fra midten og utover.'
    - 'Drop-stitch-kjernene våre er godkjent for 15 PSI — ikke fordi 12 PSI ikke strekker til for en innsjø, men fordi et 15 PSI-brett håndterer plutselig sjøgang uten å bøye seg. Hypalon-rørene våre er spesifisert for kommersiell UV-motstand — ikke fordi hver kunde padler i tropene, men fordi UV-nedbrytning er hovedårsaken til for tidlige svikt.'
    - 'Vi designer ikke etter en pris. Vi designer til et bruddpunkt — og bygger deretter godt over det.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Aquafarers design og ingeniørfag'
  stats:
    - value: '15'
      label: 'Kjernens PSI-<br />rating'
    - value: '1,500+'
      label: 'UV-timer<br />testet'
    - value: '10 år'
      label: 'skrogets<br />levetid'
