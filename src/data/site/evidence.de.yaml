badge: Proof & Quality
heading: Beweise
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Auslaufbestand, Einzelhandels-QC
    product: Jedes Überbestandsbrett, erneut überprüft
    industry: Qualitätskontrolle
    challenge: Überbestand- und Auslaufbretter stammen aus Überproduktion, daher fragen Käufer zu Recht, ob ein rabattiertes Brett die gleichen Kontrollen wie ein vollpreisiges besteht.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: 99,3 % fehlerfreie Rate bei ausgehenden Lieferungen über die letzten 12 Monate – derselbe Standard gilt für Auslauf- und Einzelhandelsbestände.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Fehlerfreie Rate
        value: 99.3%
      - label: Drucktestabdeckung
        value: 100%
      - label: Haltungsdauer
        value: 24-48h
  - id: pressure-test-regime
    client: Der 24-48-Stunden-Druckhalt
    product: Jede Kammer, 1,25-facher Nenndruck
    industry: Produkttests
    challenge: Ein SUP-Brett steht oder fällt mit seinem drop-stitch-Kern und den Nähten, und eine schnelle Aufblasprüfung am Ende der Linie reicht nicht aus, um langsame Lecks oder schwache Verschweißungen zu erkennen.
    solution: Jedes Brett wird auf 1,25-fachen Nenndruck aufgeblasen und 24-48 Stunden gehalten, wobei der Druckabfall unter 5 % bleiben muss. Ventile, D-Ringe, Nähte und Auftrieb werden mit null Toleranz für Sicherheitsmängel überprüft.
    result: 100 % der Produktion besteht dieses Prüfschema vor dem Verpacken – keine Stichproben, keine Ausnahmen.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - 1,25-facher Druck
      - Keine Sicherheitsmängel
    outcome_metrics:
      - label: Testdruck
        value: 1.25x
      - label: Maximaler Druckabfall
        value: <5 %
      - label: Getestete Einheiten
        value: 100%
  - id: warranty-claims-support
    client: Eine Garantie, die beantwortet
    product: 2-jährige Abdeckung für SUP-Bretter & Zubehör
    industry: After-Sales
    challenge: Der Kauf von Auslaufware direkt ab Werk wirft eine berechtigte Frage auf — wenn Monate später etwas schiefgeht, wer kümmert sich dann darum?
    solution: Jedes Board wird mit einer 2-Jahres-Garantie geliefert, die SUP Boards, drop-stitch Nähte, Inflationsventile und Zubehör abdeckt. Reklamationen gehen direkt an unser Team — senden Sie Fotos oder ein kurzes Video, und wir kümmern uns darum.
    result: Garantiereklamationen werden von demselben Team geprüft und bearbeitet, das auch die Produktion inspiziert — direkt, ohne Umwege über Zwischenhändler.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - 2-Jahres-Garantie
      - Direkter Support
      - Zubehör abgedeckt
    outcome_metrics:
      - label: Garantie
        value: 2 Jahre
      - label: Abdeckung
        value: Board + Zubehör
      - label: Support
        value: Direktes Team
