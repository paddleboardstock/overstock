business_model:
  tagline: Ons bedrijfsmodel
  heading: Overstock-inventaris, rechtstreeks van de fabriek
  paragraphs:
    - Paddle Board Overstock verkoopt gloednieuwe opblaasbare SUP-boards tegen overstock- en uitverkoopprijzen — tot 60% korting op de gebruikelijke winkelprijs. We betrekken overtollige en surplus voorraad in grote hoeveelheden en geven de besparingen door aan peddelaars en kleine retailers.
    - 'Naast retailverkoop bedienen we kleine retailers met mixed-model groothandel: bestel 5–20 boards, mix verschillende modellen in één zending en betaal het groothandelsniveau voor de totale hoeveelheid. Elke bestelling wordt rechtstreeks vanuit Weihai, China verzonden.'
sourcing:
  tagline: Waar onze overstockvoorraad vandaan komt
  heading: Gemengde sourcing, één kwaliteitsstandaard
  paragraphs:
    - 'Onze voorraad komt uit twee bronnen: overtollige productiepartijen van onze eigen productieactiviteiten in Weihai en geselecteerde surplusvoorraad afkomstig van andere productiepartners die wij auditen en direct mee samenwerken.'
    - Elk board dat we verkopen is nieuw en ongebruikt. Overstock verwijst naar de prijs — nooit naar de staat.
manufacturing:
  tagline: Onze productieachtergrond
  heading: Sinds 2012 gebouwd in Weihai
  paragraphs:
    - We hebben opblaasbare SUP-boards geproduceerd in Weihai, Shandong sinds 2012. Onze productiefaciliteit van 12.000 m² levert 15.000 opblaasbare units per jaar met een team van 200–300 werknemers en 14+ R&D-ingenieurs.
    - 'Een ontwerpprincipe is sinds het eerste board niet veranderd: we ontwerpen tot een faalpunt en bouwen vervolgens ver daarboven.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock fabrieksgebouw in Weihai
  stats:
    - value: '2012'
      label: Productie sinds
    - value: 12.000 m²
      label: Productiefaciliteit
    - value: 15,000
      label: Eenheden per jaar
    - value: 14+
      label: R&D-ingenieurs
inspection:
  tagline: Hoe we elk SUP-board inspecteren
  heading: Elk board getest, niet steekproefsgewijs
  paragraphs:
    - Elk SUP-board wordt voor verkoop 100% onder druk getest bij 1,25x de nominale druk gedurende 24–48 uur. Boards die falen, worden nooit verzonden.
    - 99,3% van de boards slaagt de eindinspectie in één keer. Het overige deel wordt gerepareerd of apart gezet — nooit als korting in een bestelling opgenomen.
why_prices_lower:
  tagline: Waarom onze prijzen lager zijn
  heading: Overstock-economie, geen bezuinigingen
  paragraphs:
    - 'Onze prijzen zijn om structurele redenen lager: we verkopen overstock- en surplusvoorraad rechtstreeks vanuit Weihai, zonder detailhandelsopslag, geen distributeurslagen en geen showroomkosten.'
    - De boards zelf zijn van volwaardige productiekwaliteit — dezelfde drop-stitch-kernen, hetzelfde maritieme PVC, dezelfde tests als volprijs retail.
shipping_network:
  tagline: Ons internationaal verzendnetwerk
  heading: Express lucht- of geconsolideerd zeevervoer
  paragraphs:
    - Bestellingen worden verzonden vanuit Weihai, China. Express luchtvracht vervoert monsters en bestellingen van 1–3 boards; geconsolideerd zeevervoer bedient 5–20 board groothandelsbestellingen naar 50+ landen.
    - Elke offerte bevat een geschatte transittijd naar uw bestemming, plus de commerciële factuur en paklijst die nodig zijn voor douanevrijgave.
  cards:
    - title: Luchtvracht Express
      description: Voor monsters en 1–3 bestellingen van een bord — snelle levering aan uw deur, prijs per bestemming.
    - title: Geconsolideerde Zeevervoer
      description: Voor 5–20 bord-groothandelsbestellingen — kosteneffectief vervoer naar grote havens, prijs per bestemming.
warranty_support:
  tagline: Garantie & Klantenservice
  heading: Een 2-Jarige SUP Garantie op elk bord
  paragraphs:
    - Elk bord wordt verzonden met de 2-Jarige SUP Garantie. Als er binnen de garantieperiode een gedekte defect verschijnt, neem dan contact op met ons ondersteuningsteam en wij zullen het oplossen.
    - Ondersteuning wordt afgehandeld door hetzelfde team dat uw bestelling beheert. Neem altijd contact met ons op via het contactformulier of door te antwoorden op uw orderbevestiging.
