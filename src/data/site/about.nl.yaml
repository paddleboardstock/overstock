origin:
  tagline: 'Onze oorsprong'
  heading: "Gebouwd op het water,<br />\n<span class=\"text-sky-600\">gedreven door doel</span>"
  paragraphs:
    - 'Aquafarer begon in een kustwerkplaats met één boot en een koppige overtuiging: marineproducten moeten worden ontworpen alsof ze ertoe doen — want dat doen ze.'
    - 'Onze oprichters, twee scheepsarchitecten, zagen een branche waar werd bezuinigd op alles, materialen werden gedegradeerd en veiligheid werd behandeld als een vinkje op een lijstje. Ze bouwden de eerste Aquafarer-romp niet voor winst, maar om te bewijzen dat betaalbare marine-uitrusting ook echt betrouwbaar kan zijn.'
    - 'Die eerste romp is vandaag nog in dienst. Dat principe is nooit veranderd.'
    - 'We zijn niet de grootste fabrikant. We maken niet de goedkoopste producten. Maar elke romp die onze werkplaats verlaat, gaat door dezelfde handen die het bedrijf begonnen — en voldoet aan dezelfde norm die die eerste romp stelde.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Kustwerkplaats van Aquafarer'

philosophy:
  tagline: 'Onze filosofie'
  heading: 'Geworteld in de oceaan'
  description: 'De oceaan is niet onze werkplek. Hij is onze leermeester. Elk ontwerpbesluit begint met begrip van hoe water zich gedraagt, hoe omstandigheden veranderen en hoe uitrusting moet reageren.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respect voor het water'
      description: 'Water is onvoorspelbaar. Onze producten zijn ontworpen voor de slechtste omstandigheden, niet de beste. Als een romp een sterke terugloopstroom aankan, kan hij ook een meer aan. Als een zwemvest werkt op open zee, is hij voor een rivier over-ontworpen — en dat is bewust.'
    - emoji: "\U0001F527"
      title: 'Gemaakt om lang mee te gaan, niet om te vervangen'
      description: 'Het meest duurzame product is het product dat niet vervangen hoeft te worden. Marinegrade PVC, Hypalon en drop-stitchconstructie zijn gekozen voor levensduur. We sturen nog steeds reserveonderdelen voor rompen die we tien jaar geleden bouwden.'
    - emoji: "\U0001F3C6"
      title: 'Toegankelijk van ontwerp'
      description: 'Watersport hoeft geen luxe te zijn. Wij ontwerpen producten die professionele prestaties leveren tegen een prijs die logisch is voor gezinnen, gidsen en kleine aanbieders — niet alleen voor commerciële vloten.'

design:
  tagline: 'Ontwerpfilosofie'
  heading: "Ontworpen voor de rand<br />\n<span class=\"text-sky-600\">van omstandigheden</span>"
  paragraphs:
    - 'Elk Aquafarer-product begint met één vraag: <em>wat is de ergste omstandigheid waarmee dit geconfronteerd wordt?</em> Wij ontwerpen vanuit de rand naar binnen, niet vanuit het centrum naar buiten.'
    - 'Onze drop-stitch-kernen zijn goedgekeurd voor 15 PSI — niet omdat 12 PSI onvoldoende is voor een meer, maar omdat een 15 PSI-board een plotselinge golf opvangt zonder door te buigen. Onze Hypalon-buizen zijn gespecificeerd voor UV-bestendigheid op commercieel niveau — niet omdat elke klant in de tropen peddelt, maar omdat UV-degradatie oorzaak nr. 1 van voortijdige defecten is.'
    - 'Wij ontwerpen niet naar een prijs. Wij ontwerpen naar een faalpunt — en bouwen vervolgens ruim daarboven.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Ontwerp en engineering van Aquafarer'
  stats:
    - value: '15'
      label: 'PSI-rating<br />van de kern'
    - value: '1,500+'
      label: 'UV-testuren'
    - value: '10 jr'
      label: 'levensduur<br />van de romp'
