badge: Proof & Results
heading: Dokaz
description: Pravi studiji slučaja, sertifikati, testni podaci i fotografije instalacija koje prikazuju našu proizvodnu sposobnost i kvalitet proizvoda.
case_studies:
  - id: retail-private-label
    client: Evropski prodavac na otvorenom
    product: Linija privatne robne marke SUP
    industry: Maloprodaja
    challenge: Evropski trgovac na otvorenom trebao je privatnu SUP liniju sa jedinstvenim grafikonima na daskama, ekološki prihvatljivim PVC i ambalažom spremnom za maloprodaju — sve isporučeno u roku od 60 dana.
    solution: Razvijeni prilagođeni digitalni štamparški fajlovi, pribavljeni REACH-uskladeni PVC, i smanjen broj uzoraka sa 3 runde na 1 tako što je tim za dizajn smešten u našoj fabrici u Qingdaou.
    result: 55 dana od potpisanog PO do FOB. 2.400 jedinica raspoređenih na 4 SKU-a. Ponovljena narudžbina poslata pre nego što je stigao prvi kontejner.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Maloprodaja
      - SUP
    outcome_metrics:
      - label: Vreme isporuke
        value: 55 dana
      - label: Jedinice
        value: 2,400
      - label: SKU-ovi
        value: '4'
  - id: startup-drop-stitch-kayak
    client: Američki startup za vodene sportove
    product: Drop-Stitch Kajak
    industry: Startup / Maloprodaja
    challenge: Američki startap za vodene sportove je imao potrebu za visokoperformansnim drop-stitch kajakom sa prilagođenim oblikom trupa, pakovanjem sa zajedničkim brendom i BSCI sertifikatom za maloprodajnu prodaju.
    solution: Prilagođen postojeći kalup za kajak drop-stitch sa modifikovanim rocker profilom, razvijen zajednički brendirani dizajn ambalaže i obezbeđena kompletna dokumentacija za BSCI reviziju.
    result: Uspešno navedeno u 3 glavna američka lanca za opremu na otvorenom. 5.000+ jedinica u prvoj godini sa stopom prodatosti od 98%.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Kajak
      - BSCI
    outcome_metrics:
      - label: Maloprodajni lanci
        value: '3'
      - label: Jedinice prve godine
        value: 5,000+
      - label: Prodaja do krajnjeg kupca
        value: 98%
  - id: australian-rib-distributor
    client: Australijski distributer
    product: CE-Certifikovan RIB Raspon
    industry: Mornarica / Vlada
    challenge: Australijski distributer zahteva CE-sertifikovan RIB asortiman sa prilagođenim bojama cevi, Hypalon opcijom nadogradnje i usklađenost sa Australijskim standardom AS 1799.
    solution: Proizvedeni pre-production uzorci sa 4 varijante boja cevi, dobavljeni CSM Hypalon od japanskog dobavljača, i koordinisano testiranje u skladu sa AS 1799 od strane treće strane.
    result: 3-model RIB asortiman lansiran na tržištu AU/NZ. Praćen pobedom na vladinom tenderu za 12 patrolnih RIBs.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Vlada
    outcome_metrics:
      - label: Lansirani modeli
        value: '3'
      - label: Ugovor za patrolni brod
        value: 12 jedinica
      - label: Usklađenost
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Karakibska grupa luksuznih odmarališta
    product: Flota odmarališta — RIBs, SUP, Kajaci
    industry: Ugostiteljstvo / Turizam
    challenge: Grupa od 5 odmarališta je trebala jedinstvenu flotu opreme za iznajmljivanje vodenih sportova — RIB tendera, SUPs i kajaci — sa konzistentnim brendingom, materijalima otpornim na UV za tropsko sunce i planom zamene u trajanju od 5 godina.
    solution: Dizajniran prilagođeni paket flote od 3 modela sa UV-stabilizovanim PVC, grafikom palube sa brendom odmarališta i faznim rasporedom isporuke. Obezbeđena obuka osoblja i poseban komplet rezervnih delova po odmaralištu.
    result: Isporučeno 180 jedinica u 5 odmarališta. Ponovna narudžbina za 2 nova objekta. Smanjenje cene po jedinici za 40% u odnosu na prethodne dobavljače.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kajak
      - RIB
      - Ugostiteljstvo
    outcome_metrics:
      - label: Isporučene jedinice
        value: 180
      - label: Odmarališta
        value: '5'
      - label: Smanjenje troškova
        value: 40%
  - id: southeast-asia-search-rescue
    client: Jugoistočna Azijska Pomorska Agencija
    product: Patrolna i spasilačka RIB flota
    industry: Vlada / Pomorska bezbednost
    challenge: Vladina pomorska agencija je zahtevala 20 patrolnih i spasilačkih RIBs sa vatrootpornim Hypalon materijalom, samopraznećim podovima, integrisanim nosačima VHF/radio konzole i usklađenošću sa SOLAS standardima za spasilačke brodove iz Poglavlja III.
    solution: Proizvedeno 20 RIBs sa CSM Hypalon tubama, trupovima od aluminijuma pomorskog kvaliteta, izdržljivim vučnim okovima i prethodno instaliranim paketima navigacionih svetala. Fabrika-inspektorski tim je prisustvovao probnim plovidbama. Pružena kompletna dokumentacija SOLAS.
    result: Ugovor realizovan za 4 meseca. Flota raspoređena za patrolu granica, potragu i spasavanje, i reagovanje u slučaju katastrofa u 3 regionalne baze.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Vlada
      - SOLAS
    outcome_metrics:
      - label: Patrolni RIBs
        value: '20'
      - label: Isporuka
        value: 4 meseca
      - label: Baze
        value: '3'
  - id: european-dtc-ecommerce
    client: Evropski DTC brend vodenih sportova
    product: Brendirani SUP + pribor linija
    industry: E-trgovina / Maloprodaja
    challenge: Brzorastućem brendu DTC vodenih sportova potreban SUP je kompletan paket (daska, pumpa, veslo, povodac, torba) sa vrhunskom ambalažom dizajniranom za ispunjavanje e-trgovine - direktno potrošaču preko DHL/FedEx bez oštećenja.
    solution: Razvio je ko-brendiranu liniju proizvoda sa prilagođenim oblikovanjem jezgra EPS-a, drop-stitch vlasničkom tehnologijom za viši pritisak i valovitim kutijama sa dvostrukim zidom spremnim za maloprodaju sa umetanjem. Integrisana autentičnost i registracija garancije zasnovana na QR kodu.
    result: 3-model SUP linija lansiran u 75 dana. 15,000+ jedinica u prvih 12 meseci. 4.8★ prosečna ocena na 2,000+ mišljenja. 0.3% stopa štete u tranzitu.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - Elektronska trgovina
    outcome_metrics:
      - label: Kategorije
        value: '3'
      - label: Jedinice
        value: 15,000+
      - label: Prosečna ocena
        value: 4.8★
      - label: Stopa štete
        value: 0.3%
certifications:
  - name: CE
    body: Evropska unija
    desc: Proizvodi nose CE sertifikaciju prema važećim direktivama EU - rekreativni brodovi po EN ISO 6185, lični uređaji za plutanje po EN ISO 12402, gde je to primjenjivo.
  - name: ISO 9001
    body: / SGS BSI
    desc: Sistem menadžmenta kvalitetom sertifikovan za projektovanje, proizvodnju i distribuciju plovila na naduvavanje.
  - name: BSCI
    body: amfori
    desc: Sertifikacija socijalne usklađenosti koja pokazuje etičku proizvodnju, fer rad i bezbednost na radnom mestu.
  - name: REACH
    body: Evropska agencija za hemikalije
    desc: Svi materijali su u skladu sa REACH propisima za hemijsku bezbednost. Dokumentacija koja se isporučuje sa svakom pošiljkom.
  - name: RoHS
    body: Evropska unija
    desc: Ograničenje usklađenosti opasnih materija u svim elektronskim i električnim komponentama.
  - name: AS 1799
    body: Standardi Australija
    desc: Australijski standard za čamce na naduvavanje — testiran i sertifikovan za komercijalnu upotrebu u vodama AU / NZ.
