business_model:
  tagline: Il nostro modello di business
  heading: Scorte in eccesso, vendute direttamente in fabbrica
  paragraphs:
    - Paddle Board Overstock Vende tavole gonfiabili nuove SUP di zecca a prezzi di eccesso e di liquidazione — fino al 60% di sconto tipico al dettaglio. Procuriamo surplus e scorte in eccesso in volume, poi trasferiamo i risparmi ai pagaiatori e ai piccoli rivenditori.
    - "Oltre alle vendite al dettaglio, serviamo piccoli rivenditori con modelli misti all'ingrosso: ordiniamo 5–20 tagliere, misceliamo qualsiasi modello in un'unica spedizione e pagiamo il livello all'ingrosso per la quantità totale. Ogni ordine viene spedito direttamente da Weihai, Cina."
sourcing:
  tagline: Da dove proviene il nostro inventario in eccesso
  heading: Fonti miste, uno standard di qualità
  paragraphs:
    - 'Il nostro inventario proviene da due fonti: lotti di produzione in eccesso provenienti dalle nostre stesse operazioni di produzione Weihai e scorte in eccesso selezionato proveniente da altri partner di produzione con cui controlliamo e con cui collaboriamo direttamente.'
    - Ogni tavola che vendiamo è nuova di zecca e inutilizzata. L'eccesso di stock si riferisce al prezzo — mai alla condizione.
manufacturing:
  tagline: Il nostro background nel settore manifatturiero
  heading: Costruita a Weihai dal 2012
  paragraphs:
    - Produciamo tavole gonfiabili SUP a Weihai, Shandong dal 2012. Il nostro stabilimento produttivo di 12.000 m² produce 15.000 unità gonfiabili all'anno con un team di 200–300 lavoratori e 14+ ingegneri R&S.
    - 'Un principio di progettazione non è cambiato dalla prima scheda: progettiamo fino a un punto di guasto, poi costruiamo ben al di sopra.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock Edificio industriale a Weihai
  stats:
    - value: '2012'
      label: Produzione da allora
    - value: 12.000 mq
      label: Stabilimento produttivo
    - value: 15,000
      label: Unità per anno
    - value: 14+
      label: Ingegneri R&S
inspection:
  tagline: Come ispezioniamo ogni SUP tavola
  heading: Ogni scheda testata, non campionata
  paragraphs:
    - Ogni SUP scheda è sottoposta al 100% a pressione testata a 1,25 volte la pressione nominale per 24–48 ore prima di essere approvata per la vendita. Le schede che non si guastano non vengono mai spedite.
    - Il 99,3% dei consigli supera l'ispezione finale al primo tentativo. La frazione rimanente viene riparata o messa da parte — mai scontata in un ordine.
why_prices_lower:
  tagline: Perché i nostri prezzi sono più bassi
  heading: Economia del sovrappeso, non risparmi
  paragraphs:
    - 'I nostri prezzi sono più bassi per ragioni strutturali: vendiamo scorte in eccesso e inventario in eccesso direttamente da Weihai, senza ricarichi al dettaglio, senza strati di distributore e senza costi in showroom.'
    - Le schede stesse sono di qualità di produzione completa — drop-stitch stessi nuclei, stessi di qualità marinaPVC, stessi test del prezzo pieno al dettaglio.
shipping_network:
  tagline: La nostra rete internazionale di spedizioni
  heading: Trasporto aereo espresso o trasporto marittimo consolidato
  paragraphs:
    - Gli ordini vengono spediti da Weihai, Cina. Il trasporto aereo espresso trasporta campioni e 1–3 ordini a bordo; il trasporto marittimo consolidato serve 5–20 ordini all'ingrosso a bordo verso 50+ paesi.
    - Ogni preventivo include una stima di transito per la destinazione, oltre alla fattura commerciale e alla lista di imballaggio necessarie per lo sgombero doganale.
  cards:
    - title: Trasporto Aereo Espresso
      description: Per campioni e ordini da 1 a 3 schede — consegna rapida a domicilio, prezzo su destinazione.
    - title: Trasporto Marittimo Consolidato
      description: Per ordini all'ingrosso da 5 a 20 schede — spedizione economica verso principali porti, prezzo su destinazione.
warranty_support:
  tagline: Garanzia e Assistenza Clienti
  heading: Garanzia di 2 anni SUP su ogni scheda
  paragraphs:
    - Ogni scheda viene spedita con la Garanzia di 2 anni SUP. Se si manifesta un difetto coperto dalla garanzia durante il periodo di validità, contatta il nostro team di supporto e provvederemo a risolvere il problema.
    - L'assistenza è gestita dallo stesso team che gestisce il tuo ordine. Contattaci in qualsiasi momento attraverso il modulo di contatto o rispondendo alla conferma del tuo ordine.
