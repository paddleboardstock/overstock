origin:
  tagline: 'La nostra origine'
  heading: "Costruiti sull'acqua,<br />\n<span class=\"text-sky-600\">spinti da uno scopo</span>"
  paragraphs:
    - 'Paddle Board Overstock è nata in un''officina costiera con una barca e una convinzione ostinata: i prodotti nautici devono essere progettati come se contassero — perché contano.'
    - 'I nostri fondatori, due architetti navali, hanno visto un''industria in cui si tagliavano gli angoli, i materiali venivano declassati e la sicurezza era trattata come una casella da spuntare. Hanno costruito il primo scafo Paddle Board Overstock non per profitto, ma per dimostrare che un''attrezzatura marina accessibile poteva essere davvero affidabile.'
    - 'Quel primo scafo è ancora in servizio oggi. Quel principio non è mai cambiato.'
    - 'Non siamo il produttore più grande. Non facciamo i prodotti più economici. Ma ogni scafo che lascia la nostra officina passa tra le stesse mani che hanno fondato l''azienda — e soddisfa lo stesso standard stabilito dal primo scafo.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: 'Officina costiera Paddle Board Overstock'

philosophy:
  tagline: 'La nostra filosofia'
  heading: 'Radicati nell''oceano'
  description: 'L''oceano non è il nostro luogo di lavoro. È il nostro maestro. Ogni decisione di progettazione inizia dalla comprensione di come si comporta l''acqua, di come cambiano le condizioni e di come l''attrezzatura deve rispondere.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Rispetta l''Acqua'
      description: 'L''acqua è imprevedibile. I nostri prodotti sono progettati per le condizioni peggiori, non per le migliori. Se uno scafo può gestire una risacca, gestirà anche un lago. Se un giubbotto di salvataggio funziona al largo, è sovradimensionato per un fiume — e questo è intenzionale.'
    - emoji: "\U0001F527"
      title: 'Costruito per durare, non per essere sostituito'
      description: 'Il prodotto più sostenibile è quello che non deve essere sostituito. PVC di qualità marina, Hypalon e costruzione drop-stitch sono scelti per la longevità. Spediamo ancora ricambi per scafi costruiti dieci anni fa.'
    - emoji: "\U0001F3C6"
      title: 'Accessibile per progettazione'
      description: 'Gli sport acquatici non dovrebbero essere un lusso. Progettiamo prodotti con prestazioni di livello professionale a un prezzo accessibile per famiglie, guide e piccoli operatori — non solo per flotte commerciali.'

design:
  tagline: 'Filosofia di design'
  heading: "Progettati per l'estremo<br />\n<span class=\"text-sky-600\">delle condizioni</span>"
  paragraphs:
    - 'Ogni prodotto Paddle Board Overstock parte da una domanda: <em>qual è la condizione peggiore che dovrà affrontare?</em> Progettiamo dal limite verso l''interno, non dal centro verso l''esterno.'
    - 'I nostri nuclei drop-stitch sono classificati per 15 PSI — non perché 12 PSI non bastino per un lago, ma perché una tavola a 15 PSI affronta un''onda improvvisa senza flettersi. I nostri tubi in Hypalon sono specificati per una resistenza ai raggi UV di grado commerciale — non perché ogni cliente pagai ai tropici, ma perché il degrado da UV è la causa n. 1 di guasti prematuri.'
    - 'Non progettiamo in base al prezzo. Progettiamo in base al punto di rottura — poi costruiamo ben al di sopra.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: 'Design e ingegneria Paddle Board Overstock'
  stats:
    - value: '15'
      label: 'Classifica PSI<br />del nucleo'
    - value: '1,500+'
      label: 'Ore UV<br />testate'
    - value: '10yr'
      label: 'Durata<br />dello scafo'