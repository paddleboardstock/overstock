cases:
  - id: beginner
    title: Remo para Iniciantes
    desc: Pranchas infláveis SUP estáveis para remadores de primeira viagem.
    scenario: Uma família visitando um lago no fim de semana quer experimentar stand-up paddle. Eles precisam de equipamentos estáveis, fáceis de lançar, com orientações claras de segurança.
    solution: O SUP Explorer 11 oferece estabilidade de corpo largo para iniciantes. O Life Vest Classic garante flutuação certificada CE. O Oars & Pump Set infla a prancha em menos de 10 minutos.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Passeios e Exploração
    desc: Pranchas infláveis SUP de longa distância para lagos, rios e viagens costeiras.
    scenario: Um entusiasta do ar livre planeja uma viagem de remo de uma semana e precisa de uma prancha que compacte, infle no acampamento e mantenha trajetória reta em águas abertas.
    solution: O Ocean Voyager Series desliza eficientemente com um formato de passeio e mantém o curso contra vento e ondas. Sua construção drop-stitch infla até 15 PSI para rigidez similar a uma prancha rígida.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga e Fitness
    desc: Plataformas extra-largas e estáveis para yoga, fitness e relaxamento.
    scenario: Um praticante de yoga quer um estúdio flutuante para sessões matinais em águas calmas, com espaço suficiente no deck para realizar todas as posturas.
    solution: O Flowing Lotus Series possui um deck completo e uma largura adequada para posturas sem tremores. Também funciona como plataforma estável para treinos leves de fitness.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Recreação Familiar
    desc: Pacotes completos SUP para dias de lago no fim de semana e férias.
    scenario: Uma família de quatro pessoas quer pranchas estáveis para passeios de fim de semana no lago e férias na praia — equipamentos que cabem no carro e inflarem em minutos.
    solution: O Tropical Breeze Series é uma prancha versátil e estável que toda a família pode compartilhar, enquanto o Medusa Glow Series é mais leve e curto para crianças. Ambos cabem em mochilas para fácil transporte.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
