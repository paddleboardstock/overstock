cases:
  - id: beginner
    title: 'Esportes Aquáticos para Iniciantes'
    desc: 'Pranchas de SUP e caiaques estáveis para primeiras experiências.'
    scenario: >-
      'Uma família que visita um lago no fim de semana quer experimentar stand-up paddle. Precisa de equipamentos estáveis e fáceis de lançar com orientações claras de segurança.'
    solution: >-
      'O SUP Explorer 11 oferece estabilidade de corpo largo para iniciantes. O Life Vest Classic garante flutuação certificada CE. A bomba de dupla ação infla as duas pranchas em menos de 10 minutos.'
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 'Exploração ao Ar Livre'
    desc: 'Caiaques e botes portáteis para rios, lagos e viagens costeiras.'
    scenario: >-
      'Um entusiasta de atividades ao ar livre planeja uma viagem de uma semana em um rio e precisa de um barco que se compacte, seja inflado no acampamento e enfrente correntes variadas.'
    solution: >-
      'O Kayak Lite cabe em uma mochila e infla em menos de 4 minutos. Sua construção drop-stitch enfrenta lagos, rios calmos e remadas costeiras.'
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: 'Operações Profissionais'
    desc: 'RIBs de grau comercial para operadores de turismo e resposta a emergências.'
    scenario: >-
      'Um operador de turismo costeiro precisa de uma frota de barcos duráveis para viagens diárias em condições marítimas variadas e que atendam às regulamentações comerciais de segurança.'
    solution: >-
      'O RIB 330 e o RIB 450 Patrol usam cascos de fibra de vidro em V profundo com flutuadores de Hypalon para durabilidade em qualquer clima. Várias unidades podem ser implantadas com desempenho consistente.'
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: 'Recreação em Família'
    desc: 'Botes espaçosos para passeios de um dia, pesca e esportes aquáticos.'
    scenario: >-
      'Uma família de quatro pessoas quer um barco estável para saídas de fim de semana no lago, pescarias e rebocar uma boia para as crianças.'
    solution: >-
      'O AirDeck 360 acomoda até cinco pessoas com um piso de ar reforçado. Ele é inflado no local de lançamento, cabe no carro e enfrenta tanto lagos calmos quanto águas costeiras protegidas.'
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
