origin:
  tagline: Mūsu izcelsme
  heading: |-
    Uzcelts uz ūdens,<br />
    <span class="text-sky-600">Vadīts ar mērķi</span>
  paragraphs:
    - 'Paddle Board Overstock Sāku piekrastes darbnīcā ar vienu laivu un spītīgu pārliecību: jūras produkti jāprojektē tā, it kā tie būtu svarīgi — jo tie ir svarīgi.'
    - Mūsu dibinātāji, divi kuģu arhitekti, redzēja nozari, kurā tika taupīti uz stūriem, materiāli pazemināti, un drošība tika uzskatīta par atzīmi. Viņi uzbūvēja pirmo Paddle Board Overstock korpusu ne peļņas nolūkā, bet lai pierādītu, ka pieejams jūras aprīkojums var būt arī patiesi uzticams.
    - Pirmais korpuss joprojām ir dienestā. Šis princips nekad nav mainījies.
    - Mēs neesam lielākais ražotājs. Mēs neražojam lētākos produktus. Bet katrs korpuss, kas iziet no mūsu darbnīcas, nonāk tajās pašās rokās, kas dibināja uzņēmumu — un atbilst tam pašam standartam, ko pirmais korpusa komplekts.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock Piekrastes darbnīca
philosophy:
  tagline: Mūsu filozofija
  heading: Sakņots okeānā
  description: Okeāns nav mūsu darba vieta. Tas ir mūsu skolotājs. Katrs dizaina lēmums sākas ar izpratni par to, kā uzvedas ūdens, kā mainās apstākļi un kā aprīkojumam jāreaģē.
  cards:
    - emoji: 🌊
      title: Cieni ūdeni
      description: Ūdens ir neprognozējams. Mūsu produkti ir izstrādāti sliktākajiem apstākļiem, nevis labākajiem. Ja korpuss spēj izturēt straumi, tas tiks galā arī ar ezeru. Ja glābšanas veste darbojas jūrā, tā ir pārbūvēta upei — un tas ir apzināti.
    - emoji: 🔧
      title: Būvēts, lai kalpotu, nevis aizstātu
      description: Visilgtspējīgākais produkts ir tas, kuru nav nepieciešams mainīt. Jūras līmeņa PVC, Hypalon, un drop-stitch konstrukcija tiek izvēlētas ilgmūžībai. Mēs joprojām piegādājam rezerves daļas korpusiem, ko būvējām pirms desmit gadiem.
    - emoji: 🏆
      title: Pieejams pēc dizaina
      description: Ūdens sportam nevajadzētu būt luksusam. Mēs izstrādājam produktus, kas nodrošina profesionālas klases veiktspēju par cenu, kas ir saprātīga ģimenēm, gidiem un mazajiem operatoriem — ne tikai komerciālajiem autoparkiem.
design:
  tagline: Dizaina filozofija
  heading: |-
    Inženierēts malai<br />
    <span class="text-sky-600">nosacījumu</span>
  paragraphs:
    - Katrs Paddle Board Overstock produkts sākas ar vienu jautājumu:<em>Kāds ir sliktākais stāvoklis, ar ko viņš saskarsies?</em>Mēs projektējam no malas uz iekšu, nevis no centra uz āru.
    - 'Mūsu drop-stitch kodoli ir paredzēti 15 PSI — ne tāpēc, ka 12 PSI nav pietiekami ezeram, bet tāpēc, ka 15 PSI dēlis iztur pēkšņu viļņošanos bez liekšanās. Mūsu Hypalon caurules ir paredzētas komerciālas klases UV pretestībai — nevis tāpēc, ka katrs klients airē tropu reģionos, bet tāpēc, ka UV degradācija ir #1 priekšlaicīgas bojāšanās cēlonis.'
    - Mēs neprojektējam atbilstoši cenu līmenim. Mēs projektējam līdz kļūmes punktam — un tad būvējam krietni virs tā.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock Dizains un inženierija
  stats:
    - value: '15'
      label: PSI Kodols<br />Reitings
    - value: 1,500+
      label: UV Darba laiks<br />Testēts
    - value: 10yr
      label: vāks<br />kalpošanas ilgums
