- slug: rcd-design-categories-wave-height-wind-force
  category: guide
  type: technical-reference
  title: RCD Design Categories A/B/C/D — Wave Height and Wind Force Differences Explained
  description: Clear explanation of RCD design categories for RIB boats, including maximum wind force (Beaufort scale) and significant wave height for each category.
  definition: 'RCD design categories classify recreational craft by the maximum wind force and significant wave height they are designed to withstand — Category A (Ocean), B (Offshore), C (Inshore), D (Sheltered waters).'
  tldr: Design Category C (Inshore, Beaufort 6, waves 2 m) covers most recreational RIBs. Category A (Ocean, Beaufort 8+, waves 4 m+) requires the most rigorous structural verification and typically needs Notified Body involvement.
  problem: RIB buyers and manufacturers often do not understand what design categories mean in practical terms. A boat rated Category D cannot safely operate in Category C conditions, and misrepresentation of design category can have serious safety and legal consequences.
  explanation: 'The RCD defines four design categories: Category A — designed for extended voyages where wind force may exceed Beaufort 8 (40+ knots) and significant wave height may exceed 4 m. Category B — designed for offshore voyages with wind force up to Beaufort 8 (up to 40 knots) and waves up to 4 m. Category C — designed for coastal/inshore voyages with wind force up to Beaufort 6 (up to 27 knots) and waves up to 2 m. Category D — designed for sheltered waters with wind force up to Beaufort 4 (up to 16 knots) and waves up to 0.3 m. Most recreational RIBs are Category C. Commercial, rescue, and patrol RIBs may require Category A or B. The design category must be stated on the builder plate and in the Declaration of Conformity.'
  solution: 'When specifying a RIB, match the design category to your actual operating conditions plus a safety margin. If your RIB will operate in coastal waters with potential for rough conditions, specify Category C minimum. For professional use in exposed waters, specify Category B or A. Ensure your manufacturer can provide the structural and stability evidence required for the target category.'
  recommendation: 'Specify your intended operating conditions when requesting a RIB quotation — Aquafarer will advise on the appropriate design category and compliance path.'
  faq:
    - q: Can a Category C RIB be used in Category B conditions?
      a: 'No. A Category C RIB is designed and certified for conditions up to Beaufort 6 and 2 m waves. Operating it in Category B conditions (up to Beaufort 8, 4 m waves) exceeds its design limits and voids compliance. For offshore use, specify a Category B RIB.'
    - q: Does a higher design category mean a better boat?
      a: 'Not necessarily. Design category reflects intended operating conditions, not overall quality. A well-built Category C RIB may be more suitable for resort or rental use than an over-specified Category A boat that is heavier, more expensive, and harder to handle in calm conditions.'
    - q: How is the design category determined for a specific RIB model?
      a: 'The manufacturer determines the design category based on stability and buoyancy calculations, structural analysis, and compliance with applicable harmonised standards. The Notified Body verifies the assessment for higher categories (A/B). The category is stated on the builder plate and in the DoC.'
