- slug: china-shipyard-rcd-certification-process
  category: guide
  type: compliance-guide
  title: China Shipyard RCD Certification Process — Step-by-Step for RIB Exporters
  description: Detailed walkthrough of the RCD certification process for Chinese RIB boat manufacturers exporting to the EU, including conformity module selection and Notified Body engagement.
  definition: 'The RCD certification process for Chinese shipyards involves selecting the correct conformity assessment module, engaging a Notified Body where required, compiling technical documentation, and affixing CE marking before placing the product on the EU market.'
  tldr: Chinese RIB manufacturers must follow a defined RCD compliance path — from design category classification and module selection through technical documentation, verification testing, and CE marking — with Notified Body involvement for higher design categories.
  problem: Many Chinese RIB manufacturers do not know which conformity assessment module applies to their products, when a Notified Body is required, or how to structure the compliance process. This leads to either over-spending on unnecessary third-party assessments or, more dangerously, shipping non-compliant products to the EU.
  explanation: 'The RCD provides several conformity assessment modules depending on design category and boat type. For Design Category C and D boats (most recreational RIBs), Module A (internal production control) may suffice — the manufacturer self-certifies. For Design Category A and B, or boats with specific risk profiles, Module B+C or B+D requires Notified Body involvement. The process involves: (1) Classify your product and select the conformity module; (2) Compile the technical file per Annex I Essential Safety Requirements; (3) Conduct verification testing; (4) If Module B+C/D, engage a Notified Body for EC type-examination and production control; (5) Draw up the EU Declaration of Conformity; (6) Affix CE marking.'
  solution: 'Start by classifying your RIB model by design category (A/B/C/D) based on intended sea conditions and maximum wind force. This determines the conformity module. For most recreational RIBs in Category C, Module A is sufficient. For commercial or professional RIBs in Category A/B, budget for Notified Body involvement (TUV Rheinland, SGS, or RINA) and allow 60-90 days for the assessment process.'
  recommendation: 'Contact Aquafarer for guidance on the appropriate conformity module for your RIB project and target EU market.'
  faq:
    - q: Which conformity assessment module should I use for recreational RIBs?
      a: 'Most recreational RIBs in Design Category C (wind up to Beaufort 6, waves up to 2 m) use Module A — internal production control, where the manufacturer self-certifies. For Design Category A or B boats, Module B+C or B+D with a Notified Body is typically required.'
    - q: How much does RCD certification cost for a Chinese shipyard?
      a: 'Costs depend on the conformity module. Module A (self-certification) has no Notified Body fees but requires internal engineering and testing capability. Module B+C/D with a Notified Body typically costs 8,000-25,000 EUR depending on the number of models and complexity of the assessment.'
    - q: How long does RCD certification take?
      a: 'Module A can be completed internally within 30-60 days if technical documentation is ready. Module B+C/D with a Notified Body typically takes 60-120 days including type examination, documentation review, and production verification.'
    - q: Can a trading company handle RCD certification?
      a: 'The manufacturer defined on the Declaration of Conformity must be the entity that designed and built the product. A trading company can act as the authorized representative in the EU but cannot be the manufacturer for RCD purposes unless it takes design responsibility.'
