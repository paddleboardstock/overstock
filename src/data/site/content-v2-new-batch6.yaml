- slug: rcd-hin-hull-identification-number-specification
  category: guide
  type: technical-reference
  title: EU RCD Hull Identification Number (HIN) Specification and Marking Requirements
  description: Complete guide to HIN/CIN requirements under RCD 2013/53/EU, including format, placement, and the Manufacturer Identification Code (MIC) application process.
  definition: 'The Hull Identification Number (HIN) is a unique 14-character code permanently marked on each recreational craft, encoding the manufacturer code, model year, production year, and serial number per EN ISO 10087 and RCD requirements.'
  tldr: Every RIB boat placed on the EU market must carry a 14-character HIN permanently marked on the starboard side of the transom, plus a hidden Craft Identification Number (CIN) per EN ISO 10087.
  problem: Chinese RIB manufacturers often do not register a Manufacturer Identification Code (MIC) with the EU, do not follow the correct HIN format, or fail to mark the HIN permanently enough to survive the life of the boat. This creates compliance failures and traceability gaps.
  explanation: 'The HIN format per EN ISO 10087 is: XX-XXXXXX-X-YY-XX where XX is the MIC (Manufacturer Identification Code), XXXXXX is the serial number, X is the model year, YY is the production year, and XX is the production month. The HIN must be permanently marked (engraved, stamped, or molded) on the starboard side of the transom, visible from outside the boat. A secondary hidden CIN must also be placed in a concealed location for anti-theft purposes. Chinese manufacturers must register their MIC with an EU member state before placing boats on the market.'
  solution: 'Register your MIC with the US Coast Guard (for US market) or directly with an EU member state maritime authority. Implement a HIN assignment protocol in your production system that generates unique serial numbers per hull. Ensure the marking method (laser engraving, stamping, or molding) produces a permanent, legible mark that will survive the life of the boat. Include HIN in your per-hull traceability records.'
  recommendation: 'Aquafarer assigns a unique HIN to every RIB boat produced, linked to its Hull Record for full traceability.'
  faq:
    - q: How do I register a Manufacturer Identification Code (MIC)?
      a: 'For the EU market, apply to the maritime authority of an EU member state (e.g., the UK MCA, German BSH, or Italian RINA). For the US market, apply to the US Coast Guard. The application typically requires proof of manufacturing capability and business registration.'
    - q: What is the difference between HIN and CIN?
      a: 'The HIN (Hull Identification Number) is the primary 14-character code visible on the transom. The CIN (Craft Identification Number) is a secondary hidden identification mark placed in a concealed location for anti-theft and traceability purposes per EN ISO 10087.'
    - q: Can I use the same serial number for different boat models?
      a: 'No. Each HIN must be unique across all boats you produce. The serial number component must be different for each hull, regardless of model. Implement a sequential or structured numbering system to avoid duplicates.'
