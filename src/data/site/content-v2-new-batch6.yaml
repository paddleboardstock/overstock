- slug: rcd-technical-file-compilation-requirements
  category: guide
  type: compliance-guide
  title: RCD Technical File — Detailed Compilation Requirements for RIB Manufacturers
  description: Step-by-step guide to compiling the RCD technical file for RIB boats, including document structure, required evidence, and change management protocols.
  definition: 'The RCD technical file is the complete documentation package demonstrating that a recreational craft meets all applicable Essential Safety Requirements of RCD 2013/53/EU Annex I.'
  tldr: The RCD technical file must cover product identification, applicable legislation, risk assessment, design evidence, stability/buoyancy data, materials, systems safety, quality/traceability, conformity assessment, and change control — all linked to specific models and configurations.
  problem: Chinese RIB manufacturers often compile technical files that are incomplete, use outdated standards references, or do not link evidence to specific hull numbers. Port authorities and Notified Bodies frequently reject such files, causing shipment delays and compliance failures.
  explanation: 'A complete RCD technical file for a RIB boat includes 14 document groups: (1) Document Control — version management, revision history; (2) Product Identification — model coding, HIN protocol, configuration definitions; (3) Legislation and Standards — applicable directives and harmonised standards with version dates; (4) Risk Assessment — hazard identification, risk matrix, mitigation measures; (5) Design Documentation — GA drawings, structural calculations; (6) Stability and Buoyancy — calculations, test results; (7) Materials — specifications, certificates, test results; (8) Systems Safety — fuel, electrical, steering, fire; (9) Quality and Traceability — QC procedures, batch tracking, HIN records; (10) Conformity Assessment — module selection, Notified Body reports; (11) Market Delivery — DoC, builder plate, owner manual; (12) Change Control — design change triggers, re-assessment protocol; (13) Product Photos — completed boat documentation; (14) Individual Hull Records — per-boat traceability linking to the master file.'
  solution: 'Start with a template technical file structure that covers all 14 document groups. Populate each group systematically, starting with the most critical (risk assessment, stability/buoyancy, materials). Implement a change control process that triggers re-assessment when any of 10 categories of changes occur (hull modification, tube material change, engine rating change, design category change, etc.). Maintain a document control log tracking revisions.'
  recommendation: 'Request an RCD Technical File Structure Template from Aquafarer to jumpstart your compliance documentation process.'
  faq:
    - q: How detailed must the risk assessment be?
      a: 'The risk assessment must identify all foreseeable hazards for the intended use of the RIB, assess the severity and probability of each hazard, and document the mitigation measures. It should cover normal operation, foreseeable misuse, and emergency situations. A risk matrix with severity/probability ratings is standard practice.'
    - q: What triggers a technical file revision?
      a: 'Ten categories of changes require technical file review: hull form modification, tube material or construction change, engine rating change, design category change, structural reinforcement modification, electrical system change, fuel system change, stability-affecting modifications, material substitution, and new applicable standards or regulations.'
    - q: Can the technical file be in Chinese?
      a: 'The technical file maintained by the manufacturer can be in any language. However, documents that must be provided to EU authorities or the Notified Body (DoC, builder plate data, owner manual) must be in the official language of the relevant EU member state.'
