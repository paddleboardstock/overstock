- slug: rib-boat-export-eu-technical-documents
  category: guide
  type: compliance-guide
  title: RIB Boat Export to EU — Complete Technical Document Checklist
  description: Comprehensive guide to the technical documents required for RIB boat export to the European Union under the Recreational Craft Directive 2013/53/EU.
  definition: 'Exporting RIB boats to the EU requires a documented compliance path under RCD 2013/53/EU, including a Master Technical File, Declarations of Conformity, builder plates, owner manuals, and per-hull traceability records.'
  tldr: EU-bound RIB boats need model-specific technical documentation covering design category, stability/buoyancy calculations, risk assessment, material traceability, and conformity assessment — not just a generic CE certificate.
  problem: Chinese RIB manufacturers often believe that obtaining a single CE certificate is sufficient for EU export. In reality, RCD 2013/53/EU requires a comprehensive technical documentation package that is model-specific, configuration-specific, and maintained for 10+ years. Missing or incomplete documentation can result in customs rejection, market withdrawal, or liability exposure.
  explanation: 'The RCD requires the manufacturer to compile a technical file demonstrating compliance with Essential Safety Requirements. This includes: general arrangement drawings, stability and buoyancy calculations, risk assessment, material specifications, test records, and production traceability. Each hull must be individually identifiable via a Hull Identification Number (HIN) linked to its production records. The documentation structure follows a two-tier system: the Master Technical File (per model family) and individual Hull Records (per boat produced). A Customer Compliance Pack accompanies each boat delivered to the EU.'
  solution: 'Prepare your RIB documentation in three phases: (1) Governance foundation — establish document control, model coding, and compliance responsibility; (2) Main model documentation — compile the Master Technical File for your primary RIB models with all required engineering evidence; (3) Production traceability — implement HIN-level records linking each hull to its technical file, material batches, and test results.'
  recommendation: 'Request a model-specific EU Compliance Checklist from Aquafarer to understand exactly which documents apply to your RIB configuration and target market.'
  faq:
    - q: What is the minimum documentation required for RIB export to the EU?
      a: 'At minimum: a model-specific EU Declaration of Conformity, builder plate per EN ISO 14945, owner manual per EN ISO 10240, and the underlying technical file with stability/buoyancy evidence. These must be specific to the model and configuration being shipped.'
    - q: Is one CE certificate enough for all my RIB models?
      a: 'No. CE marking under RCD is per model, per design category, per configuration. Different hull lengths, tube materials, engine ratings, or design categories each require their own compliance assessment and documentation.'
    - q: How long must technical files be retained?
      a: 'Per RCD 2013/53/EU, the manufacturer must retain the technical file for at least 10 years from the last date the product was placed on the EU market.'
    - q: Who is responsible for RCD compliance — the manufacturer or the EU importer?
      a: 'The manufacturer (or authorized representative in the EU) is responsible for ensuring compliance and drawing up the Declaration of Conformity. The importer has separate obligations including verifying compliance documentation exists, keeping a copy of the DoC, and ensuring the product bears the CE mark.'
