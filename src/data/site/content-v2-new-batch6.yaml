- slug: rib-boat-builder-plate-eu-declaration-of-conformity
  category: guide
  type: compliance-guide
  title: RIB Boat Builder Plate and EU Declaration of Conformity — Content and Requirements
  description: What must appear on the builder plate and in the EU Declaration of Conformity for RIB boats, including mandatory fields, signing requirements, and common mistakes.
  definition: "The builder plate (per EN ISO 14945) permanently displays key safety information on the craft. The EU Declaration of Conformity (DoC) is the manufacturer's formal statement that the product meets all applicable EU directive requirements."
  tldr: The builder plate must show maximum persons, engine power, load, design category, and manufacturer details. The DoC must list applicable directives, standards, conformity module, and be signed by the manufacturer or authorized representative.
  problem: Many Chinese RIB manufacturers use generic builder plates that do not match the specific model being shipped, or issue blanket DoCs that cover multiple models with different specifications. Both practices violate RCD requirements and can result in market withdrawal.
  explanation: "The builder plate per EN ISO 14945 must display: (1) Manufacturer name and address; (2) Boat model designation; (3) Maximum number of persons; (4) Maximum engine power in kW; (5) Maximum load in kg; (6) Design category (A/B/C/D); (7) CE marking. The plate must be permanently affixed, corrosion-resistant, and remain legible for the life of the craft. The EU Declaration of Conformity must include: (1) Name and address of the manufacturer; (2) Description of the product; (3) Applicable EU directives (RCD 2013/53/EU, etc.); (4) Harmonised standards applied; (5) Conformity assessment module used; (6) Notified Body details (if applicable); (7) Reference to technical file; (8) Statement of conformity; (9) Place, date, name, and signature of the responsible person."
  solution: "Create model-specific builder plates with the exact specifications for each RIB model and configuration. Use laser-engraved or stamped metal plates that will survive marine exposure. For the DoC, use a template that forces per-model, per-configuration documentation. Never issue a DoC that covers multiple models with different design categories or engine ratings."
  recommendation: 'Aquafarer provides model-specific builder plates and Declarations of Conformity with every RIB shipped to the EU.'
  faq:
    - q: Can I use the same builder plate for different RIB models?
      a: 'No. The builder plate must reflect the specific model, design category, maximum persons, maximum engine power, and maximum load of the individual boat it is attached to. Different models require different plates.'
    - q: Who must sign the EU Declaration of Conformity?
      a: 'The DoC must be signed by the manufacturer or their authorized representative established within the EU. The signatory takes legal responsibility for the conformity of the product.'
    - q: What happens if the DoC is incorrect or incomplete?
      a: 'An incorrect or incomplete DoC means the product is not compliant with the RCD, even if the boat itself meets all technical requirements. This can result in customs rejection, market withdrawal orders from national authorities, and product liability exposure.'
