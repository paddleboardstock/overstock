- slug: rcd-notified-body-selection-china-export
  category: guide
  type: compliance-guide
  title: How to Select a Notified Body for RCD Certification as a Chinese RIB Exporter
  description: Practical guidance on choosing the right EU Notified Body for RCD conformity assessment, including comparison of major bodies and module-specific requirements.
  definition: 'A Notified Body is an organization designated by an EU member state to assess conformity of products before they are placed on the market, required under RCD Modules B+C and B+D for higher design categories.'
  tldr: Not all Notified Bodies are equal — choose one with RIB/inflatable watercraft expertise, EU-wide recognition, and practical experience with Chinese manufacturers.
  problem: Chinese RIB exporters often select Notified Bodies based on price alone, leading to poor communication, extended timelines, and assessments that do not adequately cover RIB-specific requirements. Some Notified Bodies lack experience with inflatable watercraft and may issue assessments that EU importers or port authorities question.
  explanation: 'Under RCD 2013/53/EU, a Notified Body is required for conformity assessment Modules B+C (EC type-examination + internal production control plus supervision) and B+D (EC type-examination + production quality assurance). Major Notified Bodies active in the recreational craft sector include TUV Rheinland, SGS, RINA, Bureau Veritas, and DNV. Key selection criteria: (1) Scope — must be notified for RCD; (2) Expertise — experience with inflatable watercraft specifically; (3) Communication — English-speaking assessors familiar with Chinese manufacturing; (4) Recognition — widely accepted by EU importers and port authorities; (5) Cost — typical fees range 8,000-25,000 EUR per model family.'
  solution: 'Prioritize Notified Bodies with demonstrated inflatable watercraft expertise. TUV Rheinland and SGS are the most widely recognized for RIB certification from Chinese factories. Request references from similar Chinese manufacturers. Budget for the initial type examination plus annual surveillance if using Module B+D. Ensure the Notified Body understands the difference between RIB-specific standards (EN ISO 6185-3/4) and general boat standards.'
  recommendation: 'Aquafarer works with TUV Rheinland for RCD conformity assessment. Contact us to learn about our compliance process and Notified Body engagement.'
  faq:
    - q: Is a Notified Body always required for RCD compliance?
      a: 'No. For Design Category C and D boats (most recreational RIBs), Module A allows manufacturer self-certification without a Notified Body. A Notified Body is required for Module B+C or B+D, typically used for Design Category A and B boats.'
    - q: What is the difference between Module B+C and Module B+D?
      a: 'Module B+C combines EC type-examination (one-time review of the design and technical file) with internal production control plus periodic supervision. Module B+D adds production quality assurance — the Notified Body audits your production quality system. B+D provides stronger compliance evidence but costs more and requires annual audits.'
    - q: Can I switch Notified Bodies after initial certification?
      a: 'Yes, but the new Notified Body will need to review the existing technical file and may require additional verification. It is generally better to maintain continuity with the same Notified Body unless there is a compelling reason to switch.'
