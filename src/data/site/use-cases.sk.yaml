cases:
  - id: beginner
    title: Začiatočnícke pádlovanie
    desc: Stabilné nafukovacie SUP dosky pre začiatočníkov.
    scenario: Rodina, ktorá cez víkend navštívi jazero, chce vyskúšať paddleboarding. Potrebujú stabilné, ľahko spúšťateľné vybavenie s jasnými bezpečnostnými pokynmi.
    solution: SUP Explorer 11 poskytuje širokú stabilitu tela pre začiatočníkov. Life Vest Classic zabezpečuje CE-certifikovanú plavnosť. Oars & Pump Set nafúkne dosku za menej než 10 minút.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Turistika a objavovanie
    desc: Nafukovacie SUP dosky na dlhé vzdialenosti pre jazerá, rieky a pobrežné výlety.
    scenario: Nadšenec do outdoorových aktivít plánuje týždňový výlet na pádlovanie a potrebuje dosku, ktorá sa dá zložiť, nafúkať v kempe a drží smer na otvorenej vode.
    solution: Ocean Voyager Series kĺže efektívne s turistickým profilom a drží kurz vo vetre a vlnách. Jeho drop-stitch konštrukcia sa nafúkne na 15 PSI pre tvrdosť dosky.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Jóga a fitness
    desc: Extra široké, stabilné platformy pre jogu, fitness a relaxáciu.
    scenario: Cvičiaci jogy chce plávajúce štúdio na ranné lekcie na pokojnej vode, s dostatkom priestoru na palube pre všetky pozície.
    solution: Flowing Lotus Series má celoplošnú podložku na palube a široký trup pre stabilné pózy bez kolísania. Slúži aj ako stabilná platforma pre ľahké fitness cvičenia.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Rodinná rekreácia
    desc: Kompletné balíčky SUP pre víkendové dni na jazere a prázdniny.
    scenario: Štvorčlenná rodina chce stabilné dosky na víkendové výlety k jazeru a plážové prázdniny — vybavenie, ktoré sa zmestí do auta a nafúkne sa za pár minút.
    solution: Tropical Breeze Series je stabilná všestranná doska, ktorú môže používať celá rodina, zatiaľ čo Medusa Glow Series je ľahšia a kratšia pre deti. Obe sa dajú zložiť do batohu pre jednoduché cestovanie.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
