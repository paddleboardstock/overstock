cases:
  - id: beginner
    title: Začiatočnícke vodné športy
    desc: SUP Stabilné dosky a kajaky pre začiatočníkov.
    scenario: Rodina, ktorá cez víkend navštívi jazero, chce vyskúšať paddleboarding. Potrebujú stabilné, ľahko spúšťateľné vybavenie s jasnými bezpečnostnými pokynmi.
    solution: SUP Explorer 11 poskytuje širokotrupovú stabilitu pre začiatočníkov. Life Vest Classic zaručuje CE-certifikovanú plávanie. Dual-Action Pump nafukuje obe dosky za menej ako 10 minút.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dvojčinné čerpadlo
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Objavovanie prírody
    desc: Prenosné kajaky a člny na rieky, jazerá a pobrežné výlety.
    scenario: Nadšenec prírody plánuje týždňový výlet po rieke a potrebuje loď, ktorá zvládne malé balenie, nafukuje sa v tábore a zvládne rôzne prúdy.
    solution: Kayak Lite sa zmestí do batohu a nafúkne za menej ako 4 minúty. Jeho drop-stitch konštrukcia zvláda jazerá, pomalé rieky a pobrežné pádlovanie.
    products:
      - Nafukovací kajak Lite
      - Karbonové pádlo
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: Profesionálne operácie
    desc: Komerčná kvalita RIBs pre cestovné kancelárie a záchranné situácie.
    scenario: Pobrežný cestovný operátor potrebuje flotilu odolných lodí, ktoré denne jazdia v rôznych morských podmienkach a spĺňajú komerčné bezpečnostné predpisy.
    solution: RIB 330 RIB a 450 Patrol používajú laminátové hlboké V trupy s Hypalon rúrami pre odolnosť za každého počasia. Viaceré jednotky môžu byť nasadené s konzistentným výkonom.
    products:
      - RIB 330
      - RIB 450. hliadka
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: Rodinná rekreácia
    desc: Priestranné člny na jednodňové výlety, rybolov a vodné športy.
    scenario: Štvorčlenná rodina chce stabilnú loď na víkendové výlety po jazere, rybárske výlety a ťahanie trubice pre deti.
    solution: Model AirDeck 360 má kapacitu až piatich miest s vystuženou podlahou na palube. Nafukuje sa na štartovacom mieste, skladuje v aute a zvláda pokojné jazerá aj chránené pobrežné vody.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dvojčinné čerpadlo
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
