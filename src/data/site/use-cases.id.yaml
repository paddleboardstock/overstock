cases:
  - id: beginner
    title: Olahraga Air untuk Pemula
    desc: Papan SUP dan kayak yang stabil untuk pengguna pemula.
    scenario: Sebuah keluarga yang mengunjungi danau selama akhir pekan ingin mencoba paddle board. Mereka membutuhkan peralatan yang stabil, mudah diluncurkan, dengan panduan keselamatan yang jelas.
    solution: SUP Explorer 11 menyediakan stabilitas bodi lebar untuk pemula. Life Vest Classic memastikan pelampung bersertifikat CE. Dual-Action Pump mengisi kedua papan dalam waktu kurang dari 10 menit.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Eksplorasi Luar Ruangan
    desc: Kayak portabel dan perahu kecil untuk sungai, danau, dan perjalanan pesisir.
    scenario: Seorang penggemar aktivitas luar ruangan merencanakan perjalanan sungai selama seminggu dan membutuhkan perahu yang bisa dikemas kecil, mengembang di perkemahan, dan dapat menangani arus yang bervariasi.
    solution: Kayak Lite dapat dikemas ke dalam ransel dan mengembang dalam waktu kurang dari 4 menit. drop-stitch strukturnya dapat digunakan di danau, sungai yang lambat, dan padel pesisir.
    products:
      - Inflatable Kayak Lite
      - Dayung Karbon
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: Operasi Profesional
    desc: RIBs kelas komersial untuk operator tur dan tanggap darurat.
    scenario: Seorang operator tur pesisir membutuhkan armada perahu yang kuat yang menjalankan perjalanan harian di kondisi laut yang berbeda dan memenuhi peraturan keselamatan komersial.
    solution: RIB 330 dan RIB 450 Patrol menggunakan lambung fiberglass deep-V dengan tabung Hypalon untuk ketahanan di segala cuaca. Beberapa unit dapat dikerahkan dengan kinerja yang konsisten.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: Rekreasi Keluarga
    desc: Perahu kecil yang luas untuk perjalanan sehari, memancing, dan olahraga air.
    scenario: Sebuah keluarga berempat ingin perahu yang stabil untuk berkunjung ke danau akhir pekan, perjalanan memancing, dan menarik ban untuk anak-anak.
    solution: AirDeck 360 menampung hingga lima orang dengan lantai dek udara yang diperkuat. Perahu ini mengembang di lokasi peluncuran, disimpan di mobil, dan dapat digunakan di danau tenang maupun perairan pesisir yang terlindung.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
