cases:
  - id: beginner
    title: Paddling untuk Pemula
    desc: Papan SUP tiup yang stabil untuk pendayung pemula.
    scenario: Sebuah keluarga yang mengunjungi danau selama akhir pekan ingin mencoba paddle board. Mereka membutuhkan peralatan yang stabil, mudah diluncurkan, dengan panduan keselamatan yang jelas.
    solution: SUP Explorer 11 memberikan stabilitas tubuh lebar bagi pemula. Life Vest Classic memastikan daya apung bersertifikat CE. Oars & Pump Set mengembangkan papan dalam waktu kurang dari 10 menit.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Tur & Eksplorasi
    desc: Papan SUP tiup jarak jauh untuk danau, sungai, dan perjalanan pesisir.
    scenario: Seorang penggemar kegiatan luar ruangan merencanakan perjalanan paddling seminggu dan membutuhkan papan yang mudah dikemas, bisa ditiup di perkemahan, dan melaju lurus di air terbuka.
    solution: Ocean Voyager Series meluncur dengan efisien dengan desain tur dan mempertahankan arah dalam angin dan gelombang. Konstruksi drop-stitch dapat ditiup hingga 15 PSI untuk kekakuan papan keras.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga & Kebugaran
    desc: Platform ekstra lebar dan stabil untuk yoga, kebugaran, dan relaksasi.
    scenario: Seorang praktisi yoga ingin studio terapung untuk sesi pagi di air tenang, dengan ruang dek yang cukup untuk melakukan setiap pose.
    solution: Flowing Lotus Series menampilkan pad dek sepanjang papan dan balok lebar untuk pose tanpa goyangan. Ini juga berfungsi sebagai platform stabil untuk olahraga ringan.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Rekreasi Keluarga
    desc: Paket SUP lengkap untuk hari-hari danau di akhir pekan dan liburan.
    scenario: Keluarga berempat ingin papan yang stabil untuk perjalanan akhir pekan ke danau dan liburan pantai — perlengkapan yang bisa dimasukkan ke dalam mobil dan ditiup dalam beberapa menit.
    solution: Tropical Breeze Series adalah papan serba stabil yang bisa digunakan seluruh keluarga, sedangkan Medusa Glow Series lebih ringan dan lebih pendek untuk anak-anak. Keduanya bisa dimasukkan ke dalam ransel untuk perjalanan mudah.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
