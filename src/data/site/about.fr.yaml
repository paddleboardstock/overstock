business_model:
  tagline: Notre modèle économique
  heading: Inventaire excédentaire, vendu directement à l’usine
  paragraphs:
    - Paddle Board Overstock Vend des planches gonflables SUP neuves à des prix de surstock et de liquidation — jusqu’à 60 % de réduction dans le commerce de détail typique. Nous nous procurons en volume en surplus et en excédent, puis répercutons les économies aux pagayeurs et aux petits détaillants.
    - 'Parallèlement aux ventes au détail, nous servons les petits détaillants avec des modèles mixtes en gros : commandez 5 à 20 plateaux, mélangez tous les modèles en une seule livraison, et payons le niveau de gros pour la quantité totale. Chaque commande est expédiée directement depuis Weihai, en Chine.'
sourcing:
  tagline: D’où vient notre surstock
  heading: Sources mixtes, une norme de qualité unique
  paragraphs:
    - 'Notre inventaire provient de deux sources : des lots de production excédentaires provenant de nos propres opérations de fabrication à Weihai, et des stocks excédentaires sélectionnés provenant d’autres partenaires de production que nous auditons et avec lesquels nous travaillons directement.'
    - Chaque planche que nous vendons est neuve et inutilisée. Le surstock fait référence au prix — jamais à l’état.
manufacturing:
  tagline: Notre parcours dans la fabrication
  heading: Construit à Weihai depuis 2012
  paragraphs:
    - Nous fabriquons SUP des planches gonflables à Weihai, Shandong depuis 2012. Notre usine de production de 12 000 m² produit 15 000 unités gonflables par an avec une équipe de 200 à 300 ouvriers et 14+ ingénieurs R&D.
    - 'Un principe de conception n’a pas changé depuis la première carte : nous concevons jusqu’à un point de défaillance, puis construisons bien au-dessus.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock Bâtiment d’usine à Weihai
  stats:
    - value: '2012'
      label: Fabrication depuis
    - value: 12 000 m²
      label: Installation de production
    - value: 15,000
      label: Unités par an
    - value: 14+
      label: Ingénieurs R&D
inspection:
  tagline: Comment nous inspectons chaque SUP planche
  heading: Chaque planche testée, pas échantillonnée
  paragraphs:
    - Chaque SUP carte est testée à 100 % à 100 % de pression à 1,25 fois sa pression nominale pendant 24 à 48 heures avant d’être approuvée pour la vente. Les cartes qui tombent en panne ne sont jamais expédiées.
    - 99,3 % des conseils passent l’inspection finale du premier coup. La fraction restante est réparée ou mise de côté — jamais réduite à une commande.
why_prices_lower:
  tagline: Pourquoi nos prix sont plus bas
  heading: L’économie du surstock, pas les économies de coin de la main
  paragraphs:
    - 'Nos prix sont plus bas pour des raisons structurelles : nous vendons le surstock et le surplus directement de Weihai, sans marge de détail, sans stratagème de distributeur, et sans frais de showroom.'
    - Les cartes elles-mêmes sont de qualité de production complète — mêmes drop-stitch cœurs, même qualité PVCmarine, mêmes tests que le prix plein au détail.
shipping_network:
  tagline: Notre réseau international de transport maritime
  heading: Transport aérien express ou fret maritime consolidé
  paragraphs:
    - Les commandes sont expédiées depuis Weihai, Chine. Le fret aérien express transporte des échantillons et 1 à 3 commandes de bord ; le fret maritime consolidé sert 5 à 20 commandes de gros à bord vers 50+ pays.
    - Chaque devis inclut une estimation de transit pour votre destination, ainsi que la facture commerciale et la liste de conditionnement requises pour le dédouanement.
  cards:
    - title: Fret Express Aérien
      description: Pour les échantillons et les commandes de 1 à 3 planches — livraison rapide à votre porte, prix selon la destination.
    - title: Fret Maritime Consolidé
      description: Pour les commandes en gros de 5 à 20 planches — expédition économique vers les principaux ports, prix selon la destination.
warranty_support:
  tagline: Garantie et Assistance Client
  heading: Une garantie de 2 ans SUP sur chaque planche
  paragraphs:
    - Chaque planche est livrée avec la garantie de 2 ans SUP. Si un défaut couvert apparaît pendant la période de garantie, contactez notre équipe d'assistance et nous résoudrons le problème.
    - L'assistance est gérée par la même équipe qui s'occupe de votre commande. Contactez-nous à tout moment via le formulaire de contact ou en répondant à votre confirmation de commande.
