origin:
  tagline: 'Notre origine'
  heading: "Construits sur l'eau,<br />\n<span class=\"text-sky-600\">animés par un but</span>"
  paragraphs:
    - 'Aquafarer a démarré dans un atelier côtier avec un bateau et une conviction inébranlable : les produits marins doivent être conçus comme s''ils comptaient — parce qu''ils comptent.'
    - 'Nos fondateurs, deux architectes navals, ont vu une industrie où l''on rognait sur les finitions, où les matériaux étaient déclassés et où la sécurité n''était qu''une case à cocher. Ils ont construit la première coque Aquafarer non pas pour le profit, mais pour prouver qu''un équipement marin abordable pouvait aussi être réellement fiable.'
    - 'Cette première coque est encore en service aujourd''hui. Ce principe n''a jamais changé.'
    - 'Nous ne sommes pas le plus grand fabricant. Nous ne fabriquons pas les produits les moins chers. Mais chaque coque qui quitte notre atelier passe entre les mêmes mains qui ont fondé l''entreprise — et répond à la même norme fixée par la première coque.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Atelier côtier Aquafarer'

philosophy:
  tagline: 'Notre philosophie'
  heading: 'Enracinés dans l''océan'
  description: 'L''océan n''est pas notre lieu de travail. C''est notre maître. Chaque décision de conception commence par comprendre comment l''eau se comporte, comment les conditions changent et comment l''équipement doit réagir.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respecter l''eau'
      description: 'L''eau est imprévisible. Nos produits sont conçus pour les pires conditions, pas les meilleures. Si une coque peut résister à un courant de retour, elle tiendra sur un lac. Si un gilet de sauvetage fonctionne au large, il est surdimensionné pour une rivière — et c''est voulu.'
    - emoji: "\U0001F527"
      title: 'Conçu pour durer, pas pour être remplacé'
      description: 'Le produit le plus durable est celui qui n''a pas besoin d''être remplacé. Le PVC de qualité marine, l''Hypalon et la construction drop-stitch sont choisis pour leur longévité. Nous expédions encore des pièces détachées pour des coques construites il y a dix ans.'
    - emoji: "\U0001F3C6"
      title: 'Accessible par conception'
      description: 'Les sports nautiques ne devraient pas être un luxe. Nous concevons des produits offrant des performances de niveau professionnel à un prix raisonnable pour les familles, les guides et les petits opérateurs — pas seulement pour les flottes commerciales.'

design:
  tagline: 'Philosophie de conception'
  heading: "Conçus pour l'extrême<br />\n<span class=\"text-sky-600\">des conditions</span>"
  paragraphs:
    - 'Chaque produit Aquafarer commence par une question : <em>quelle est la pire condition à laquelle il sera confronté ?</em> Nous concevons de l''extrême vers l''intérieur, pas du centre vers l''extérieur.'
    - 'Nos noyaux drop-stitch sont conçus pour 15 PSI — non pas parce que 12 PSI ne suffirait pas pour un lac, mais parce qu''une planche à 15 PSI encaisse une mer soudainement agitée sans fléchir. Nos tubes en Hypalon sont spécifiés pour une résistance aux UV de qualité commerciale — non pas parce que chaque client pagaie sous les tropiques, mais parce que la dégradation par les UV est la cause n°1 de défaillance prématurée.'
    - 'Nous ne concevons pas en fonction d''un prix. Nous concevons en fonction d''un point de rupture — puis nous construisons bien au-dessus.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Conception et ingénierie Aquafarer'
  stats:
    - value: '15'
      label: 'Cote PSI<br />du noyau'
    - value: '1,500+'
      label: 'Heures UV<br />testées'
    - value: '10yr'
      label: 'Durée de vie<br />de la coque'