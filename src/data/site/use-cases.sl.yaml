cases:
  - id: beginner
    title: Začetni vodni športi
    desc: Stabilne SUP deske in kajaki za začetnike.
    scenario: Družina, ki obišče jezero čez vikend, želi poskusiti supanje. Potrebovali bodo stabilno, enostavno za postavitev opremo z jasnimi varnostnimi navodili.
    solution: SUP Explorer 11 nudi široko telesno stabilnost za začetnike. Rešilni jopič Classic zagotavlja CE-certificirano plovnost. Dvostopenjska tlačilka napihne obe deski v manj kot 10 minutah.
    products:
      - SUP Explorer 11
      - Rešilni jopič Classic
      - Dvostopenjska tlačilka
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Zunanji raziskovanja
    desc: Prenosni kajaki in čolni za rečne, jezerske in obalne izlete.
    scenario: Zunanji navdušenec načrtuje teden dni trajajoč rečni izlet in potrebuje čoln, ki se enostavno spakira, napihne na kampu in obvladuje različne tokove.
    solution: Kajak Lite se spravi v nahrbtnik in se napihne v manj kot 4 minutah. Njegova drop-stitch konstrukcija obvladuje jezera, počasne reke in obalno veslanje.
    products:
      - Napihljivi Kajak Lite
      - Ogljikovo veslo
      - Rešilni jopič Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: Profesionalno delovanje
    desc: Trgovinski RIBs za turistične operaterje in nujne intervencije.
    scenario: Obalni turistični operater potrebuje floto vzdržljivih čolnov, ki izvajajo dnevne izlete v različnih morskih pogojih in izpolnjujejo varnostne predpise za komercialno uporabo.
    solution: RIB 330 in RIB 450 Patrol imata steklenoplastični trup v obliki V z Hypalon tubami za vzdržljivost v vseh vremenskih pogojih. Več enot se lahko uporablja z dosledno zmogljivostjo.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Rešilni jopič Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: Družinska rekreacija
    desc: Prostorni čolni za dnevne izlete, ribolov in vodne športe.
    scenario: Družina štirih oseb želi stabilen čoln za vikend izlete na jezero, ribolov in vlečenje tubusa za otroke.
    solution: AirDeck 360 sprejme do pet oseb z ojačanim zračnim dnom. Napihne se na mestu izstrelitve, se shrani v avto in obvladuje tako mirna jezera kot zaščitene obalne vode.
    products:
      - AirDeck 360
      - Rešilni jopič Classic
      - Dvostopenjska tlačilka
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
