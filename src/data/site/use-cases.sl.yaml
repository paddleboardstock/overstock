cases:
  - id: beginner
    title: Začetniško veslanje
    desc: Stabilne napihljive SUP deske za prve veslače.
    scenario: Družina, ki obišče jezero čez vikend, želi poskusiti supanje. Potrebovali bodo stabilno, enostavno za postavitev opremo z jasnimi varnostnimi navodili.
    solution: SUP Explorer 11 zagotavlja stabilnost širokega trupa za začetnike. Life Vest Classic zagotavlja plovnost s certifikatom CE. Oars & Pump Set napihne desko v manj kot 10 minutah.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Potovanja in raziskovanje
    desc: Napihljive SUP deske za dolge razdalje za jezera, reke in obalne izlete.
    scenario: Ljubitelj narave načrtuje tedenski veslaški izlet in potrebuje desko, ki se enostavno spakira, napihne v kampu in drži smer na odprti vodi.
    solution: Ocean Voyager Series učinkovito drsi z obliko za potovanja in ohranja smer pri vetru in valu. Njegova drop-stitch konstrukcija se napihne na 15 PSI za trdnost trde deske.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Joga in fitnes
    desc: Izredno široke, stabilne platforme za jogo, fitnes in sprostitev.
    scenario: Praktik joge želi plavajoči studio za jutranje vadbe na mirni vodi, z dovolj prostora na krovu za vsak položaj.
    solution: Flowing Lotus Series ima podlogo za celotno dolžino krova in širok gred za položaje brez nihanja. Uporablja se tudi kot stabilna platforma za lahke fitnes vaje.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Družinska rekreacija
    desc: Popolni SUP paketi za vikende na jezeru in počitnice.
    scenario: Družina štirih želi stabilne deske za vikend izlete na jezero in počitnice na plaži — opremo, ki se spakira v avto in napihne v nekaj minutah.
    solution: Tropical Breeze Series je stabilna univerzalna deska, ki jo lahko uporablja celotna družina, medtem ko je Medusa Glow Series lažja in krajša za otroke. Obe se spakirata v nahrbtnike za enostavno potovanje.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
