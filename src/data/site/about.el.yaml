origin:
  tagline: 'Η καταγωγή μας'
  heading: "Χτισμένο στο νερό,<br />\n<span class=\"text-sky-600\">κινούμενο από σκοπό</span>"
  paragraphs:
    - 'Η Paddle Board Overstock ξεκίνησε σε ένα παραθαλάσσιο εργαστήριο με ένα σκάφος και μια πεισματική πεποίθηση: τα ναυτικά προϊόντα πρέπει να σχεδιάζονται σαν να έχουν σημασία — γιατί έχουν.'
    - 'Οι ιδρυτές μας, δύο ναυπηγοί, είδαν έναν κλάδο όπου κόβονταν γωνίες, υποβαθμίζονταν τα υλικά και η ασφάλεια αντιμετωπιζόταν ως τυπική διαδικασία. Έκαναν το πρώτο σκάφος Paddle Board Overstock όχι για κέρδος, αλλά για να αποδείξουν ότι προσιτός ναυτικός εξοπλισμός μπορεί να είναι πραγματικά αξιόπιστος.'
    - 'Εκείνο το πρώτο σκάφος παραμένει σε υπηρεσία ακόμα και σήμερα. Αυτή η αρχή δεν άλλαξε ποτέ.'
    - 'Δεν είμαστε ο μεγαλύτερος κατασκευαστής. Δεν φτιάχνουμε τα φθηνότερα προϊόντα. Αλλά κάθε σκάφος που φεύγει από το εργαστήριό μας περνά από τα ίδια χέρια που ξεκίνησαν την εταιρεία — και ανταποκρίνεται στο ίδιο πρότυπο που έθεσε το πρώτο σκάφος.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: 'Παραθαλάσσιο εργαστήριο της Paddle Board Overstock'

philosophy:
  tagline: 'Η φιλοσοφία μας'
  heading: 'Ριζωμένοι στον ωκεανό'
  description: 'Ωκεανός δεν είναι ο χώρος εργασίας μας. Είναι ο δάσκαλός μας. Κάθε σχεδιαστική απόφαση ξεκινά με την κατανόηση του πώς συμπεριφέρεται το νερό, πώς αλλάζουν οι συνθήκες και πώς πρέπει να ανταποκρίνεται ο εξοπλισμός.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Σεβασμός στο νερό'
      description: 'Το νερό είναι απρόβλεπτο. Τα προϊόντα μας σχεδιάζονται για τις χειρότερες συνθήκες, όχι για τις καλύτερες. Αν ένα σκάφος αντέξει ένα ισχυρό ρεύμα, θα αντέξει και μια λίμνη. Αν ένα σωσίβιο λειτουργεί σε ανοιχτή θάλασσα, είναι υπερσχεδιασμένο για έναν ποταμό — και αυτό είναι σκόπιμο.'
    - emoji: "\U0001F527"
      title: 'Χτισμένο για να αντέχει, όχι για να αντικαθίσταται'
      description: 'Το πιο βιώσιμο προϊόν είναι αυτό που δεν χρειάζεται αντικατάσταση. Το ναυτικού τύπου PVC, το Hypalon και η κατασκευή drop-stitch επιλέγονται για μακροζωία. Ακόμα στέλνουμε ανταλλακτικά για σκάφη που φτιάξαμε πριν μια δεκαετία.'
    - emoji: "\U0001F3C6"
      title: 'Προσιτό εκ σχεδιασμού'
      description: 'Οι θαλάσσιες δραστηριότητες δεν πρέπει να είναι πολυτέλεια. Σχεδιάζουμε προϊόντα που προσφέρουν επαγγελματικές επιδόσεις σε τιμή που έχει νόημα για οικογένειες, οδηγούς και μικρούς φορείς — όχι μόνο για εμπορικούς στόλους.'

design:
  tagline: 'Φιλοσοφία σχεδιασμού'
  heading: "Σχεδιασμένο για το όριο<br />\n<span class=\"text-sky-600\">των συνθηκών</span>"
  paragraphs:
    - 'Κάθε προϊόν Paddle Board Overstock ξεκινά με μία ερώτηση: <em>ποιες είναι οι χειρότερες συνθήκες που θα αντιμετωπίσει;</em> Σχεδιάζουμε από το όριο προς τα μέσα, όχι από το κέντρο προς τα έξω.'
    - 'Οι πυρήνες drop-stitch είναι πιστοποιημένοι για 15 PSI — όχι επειδή τα 12 PSI δεν αρκούν για μια λίμνη, αλλά επειδή μια σανίδα 15 PSI αντιμετωπίζει απρόσμενη ταραχώδη θάλασσα χωρίς κάμψη. Οι σωλήνες Hypalon προσδιορίζονται για εμπορική αντοχή σε UV — όχι επειδή κάθε πελάτης κωπηλατεί στις τροπικές ζώνες, αλλά επειδή η υποβάθμιση UV είναι η νούμερο ένα αιτία πρόωρων βλαβών.'
    - 'Δεν σχεδιάζουμε βάσει τιμής. Σχεδιάζουμε βάσει σημείου αστοχίας — και μετά χτίζουμε πολύ πάνω από αυτό.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: 'Σχεδιασμός και μηχανική της Paddle Board Overstock'
  stats:
    - value: '15'
      label: 'Αντοχή πυρήνα<br />σε PSI'
    - value: '1,500+'
      label: 'Ώρες δοκιμών<br />UV'
    - value: '10 έτη'
      label: 'διάρκεια ζωής<br />σκάφους'
