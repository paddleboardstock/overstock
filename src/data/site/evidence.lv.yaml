badge: Proof & Results
heading: Pierādījumi
description: Reāli gadījumu pētījumi, sertifikāti, testu dati un izvietojuma fotogrāfijas, kas demonstrē mūsu ražošanas spējas un produktu kvalitāti.
case_studies:
  - id: retail-private-label
    client: Eiropas āra mazumtirgotājs
    product: Privātās preču zīmes SUP līnija
    industry: Mazumtirdzniecība
    challenge: Eiropas āra mazumtirgotājam bija nepieciešama privātās preču zīmes SUP līnija ar unikālām dēļu grafikām, videi draudzīgiem PVC un mazumtirdzniecībai gatavu iepakojumu — viss piegādāts 60 dienu laikā.
    solution: Izstrādāti pielāgoti digitālie drukas faili, iegūti REACH-saskanīgi PVC materiāli, un paraugtehnikas testēšana samazināta no 3 kārtām līdz 1, izvietojot dizaina komandu mūsu Čingdao rūpnīcā.
    result: 55 dienas no parakstītā pasūtījuma līdz FOB. 2 400 vienības 4 SKU. Atkārtots pasūtījums veikts pirms pirmā konteineru ierašanās.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Mazumtirdzniecība
      - SUP
    outcome_metrics:
      - label: Izgatavošanas laiks
        value: 55 dienas
      - label: Vienības
        value: 2,400
      - label: SKU
        value: '4'
  - id: startup-drop-stitch-kayak
    client: ASV ūdenssporta startaps
    product: Drop-Stitch Kayak
    industry: Startaps / Mazumtirdzniecība
    challenge: ASV ūdenssporta startapam bija nepieciešams augstas veiktspējas drop-stitch kajaks ar pielāgotu korpusa formu, kopzīmola iepakojumu un BSCI sertifikāciju mazumtirdzniecībai.
    solution: Pielāgota esošā drop-stitch kajaka forma ar modificētu rocker profilu, izstrādāta kopzīmola iepakojuma māksla un nodrošināta pilna BSCI audita dokumentācija.
    result: Veiksmīgi ierakstīts 3 lielākajos ASV āra ķēžu veikalos. 5 000+ vienības pirmajā gadā ar 98% pārdošanas ātrumu.
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
    tags:
      - OEM
      - Kajaks
      - BSCI
    outcome_metrics:
      - label: Mazumtirdzniecības ķēdes
        value: '3'
      - label: Pirmā gada vienības
        value: 5,000+
      - label: Pārdošanas apjoms
        value: 98%
  - id: australian-rib-distributor
    client: Austrālijas izplatītājs
    product: CE-sertificēta RIB līnija
    industry: Jūras / Valsts sektors
    challenge: Austrālijas izplatītājam bija nepieciešama CE-sertificēta RIB līnija ar pielāgotām cauruļu krāsām, Hypalon uzlabojumu iespēju un atbilstību Austrālijas standartam AS 1799.
    solution: Izgatavoti pirms ražošanas paraugi ar 4 cauruļu krāsu variantiem, iegūti CSM Hypalon no Japānas piegādātāja un koordinēti trešās puses AS 1799 atbilstības testi.
    result: 3 modeļu RIB klāsts tika laists klajā Austrālijas/Jaunzēlandes tirgū. Tam sekoja valdības konkursa uzvara 12 patrulēšanas RIBslokomotīvēm.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Pārvalde
    outcome_metrics:
      - label: Izlaistie modeļi
        value: '3'
      - label: Patrulku laivas līgums
        value: 12 vienības
      - label: Atbilstība
        value: KĀ 1799
  - id: caribbean-resort-fleet
    client: Karību luksusa kūrortu grupa
    product: Kūrorta flote — RIBs, SUP, Kajaki
    industry: Viesmīlība / Tūrisms
    challenge: Piecu kūrortu grupai bija nepieciešams vienots īres ūdenssporta aprīkojuma flote — RIB tenderi, SUPs, un kajaki — ar konsekventu zīmolu, UVizturīgiem materiāliem tropiskajai saulei un piecu gadu nomaiņas plāns.
    solution: Izstrādāja pielāgotu 3 modeļu flotes paketi ar UVstabilizētuPVC, kūrorta zīmola terases grafiku un pakāpenisku piegādes grafiku. Nodrošināta personāla apmācība un īpašs rezerves daļu komplekts katram kūrortam.
    result: 180 vienības piegādātas 5 kūrortos. Atkārtots pasūtījums 2 jauniem īpašumiem. 40% samazinājums vienības izmaksās salīdzinājumā ar iepriekšējiem piegādātājiem.
    image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kajaks
      - RIB
      - Viesmīlība
    outcome_metrics:
      - label: Piegādātās vienības
        value: 180
      - label: Kūrorti
        value: '5'
      - label: Izmaksu samazināšana
        value: 40%
  - id: southeast-asia-search-rescue
    client: Dienvidaustrumāzijas Jūras aģentūra
    product: Patrulēšanas un glābšanas RIB flote
    industry: Valdība / Jūras drošība
    challenge: Valsts jūras aģentūra prasīja 20 patrulēšanas un glābšanas darbus RIBs ar ugunsizturīgu Hypalon audumu, pašizsūknēšanas grīdām, integrētiem VHF/radio konsoles stiprinājumiem un atbilstību SOLAS III nodaļas glābšanas laivu standartiem.
    solution: Ražoti 20 RIBs ar CSM Hypalon caurulēm, jūras klases alumīnija korpusiem, smagās vilkšanas acīm un iepriekš uzstādītām navigācijas gaismas paketēm. Rūpnīcas inspekcijas komanda bija lieciniece jūras izmēģinājumiem. SOLAS Pilns dokumentācijas komplekts tika nodrošināts.
    result: Līgums tika piegādāts 4 mēnešu laikā. Flote tika izvietota robežapsardzei, meklēšanai un glābšanai, kā arī katastrofu reaģēšanai trīs reģionālajās bāzēs.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Pārvalde
      - SOLAS
    outcome_metrics:
      - label: Patruļa RIBs
        value: '20'
      - label: Piegāde
        value: 4 mēneši
      - label: Bāzes
        value: '3'
  - id: european-dtc-ecommerce
    client: Eiropas DTC ūdenssporta zīmols
    product: Zīmola SUP + aksesuāru līnija
    industry: E-komercija / Mazumtirdzniecība
    challenge: Ātri augošam DTC ūdenssporta zīmolam bija nepieciešama pilna SUP pakete (dēlis, sūknis, airis, pavadiņa, soma) ar premium iepakojumu, kas paredzēts e-komercijas izpildei — tieši patērētājam caur DHL/FedEx bez bojājumiem.
    solution: Izstrādāta kopzīmola produktu līnija ar pielāgotu EPS serdes formēšanu, patentētu drop-stitch tehnoloģiju augstākam spiedienam un mazumtirdzniecībai gatavām dubultās sienas gofrētām kastēm ar ievietošanas spilventiņiem. Integrēta QR koda autentiskuma un garantijas reģistrācija.
    result: 3 modeļu SUP līnija uzsākta 75 dienās. 15 000+ vienību pirmajos 12 mēnešos. Vidējais vērtējums 4.8★ pēc 2 000+ atsauksmēm. 0.3% bojājumu līmenis transportēšanas laikā.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-komercija
    outcome_metrics:
      - label: Modeļi
        value: '3'
      - label: Vienības
        value: 15,000+
      - label: Vid. vērtējums
        value: 4.8★
      - label: Bojājumu līmenis
        value: 0.3%
certifications:
  - name: CE
    body: Eiropas Savienība
    desc: Produkti nes CE sertifikāciju saskaņā ar piemērojamiem ES direktīviem — atpūtas laivas saskaņā ar EN ISO 6185, personīgās peldlīdzekļi saskaņā ar EN ISO 12402, ja piemērojams.
  - name: ISO 9001
    body: SGS / BSI
    desc: Kvalitātes vadības sistēma sertificēta uzpūšamo ūdens transportlīdzekļu projektēšanai, ražošanai un izplatīšanai.
  - name: BSCI
    body: amfori
    desc: Sociālās atbilstības sertifikācija, kas demonstrē ētisku ražošanu, godīgu darbu un darba drošību.
  - name: REACH
    body: Eiropas Ķīmisko vielu aģentūra
    desc: Visi materiāli atbilst REACH regulējumiem ķīmiskās drošības jomā. Dokumentācija tiek piegādāta katrā sūtījumā.
  - name: RoHS
    body: Eiropas Savienība
    desc: Bīstamu vielu ierobežojumu atbilstība visiem elektroniskajiem un elektroierīču komponentiem.
  - name: KĀ 1799
    body: Standardi Austrālija
    desc: Austrālijas standarts uzpūšamajām laivām — pārbaudīts un sertificēts komerciālai izmantošanai AU/NZ ūdeņos.
