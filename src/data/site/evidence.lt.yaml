badge: Proof & Results
heading: Įrodymai
description: Tikri atvejai, sertifikatai, bandymų duomenys ir diegimo nuotraukos, kurios demonstruoja mūsų gamybos gebėjimus ir produktų kokybę.
case_studies:
  - id: retail-private-label
    client: Europos lauko prekių mažmenininkas
    product: Privataus prekių ženklo SUP linija
    industry: Mažmeninė prekyba
    challenge: Europos lauko prekių mažmenininkui reikėjo privataus prekių ženklo SUP linijos su unikalia denio grafika, ekologiška PVC ir mažmeninės prekybos paruoštais pakavimais — visa tai pristatyta per 60 dienų.
    solution: Sukurtos individualios skaitmeninės spaudos bylos, surasti REACH-atitinkantys PVC, ir sumažintas mėginių tikrinimo ciklas nuo 3 iki 1, talpinant dizaino komandą mūsų Qingdao gamykloje.
    result: 55 dienos nuo pasirašyto užsakymo iki FOB. 2 400 vienetų per 4 SKU. Pakartotinis užsakymas pateiktas dar prieš pirmo konteinerio atvykimą.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Mažmeninė prekyba
      - SUP
    outcome_metrics:
      - label: Vykdymo laikas
        value: 55 dienos
      - label: Vienetai
        value: 2,400
      - label: SKU
        value: '4'
  - id: startup-drop-stitch-kayak
    client: JAV vandens sporto startuolis
    product: Drop-Stitch baidarė
    industry: Startuolis / Mažmeninė prekyba
    challenge: JAV vandens sporto startuoliui reikėjo aukštos kokybės drop-stitch baidarės su individualia korpuso forma, bendrai ženklinamu pakavimu ir BSCI sertifikatu mažmeninei prekybai.
    solution: Adaptuotas esamas drop-stitch baidarės pelėsis su pakeistu rocker profiliu, sukurta bendrai ženklinamo pakavimo grafika, pateikta visa BSCI auditavimo dokumentacija.
    result: Sėkmingai įtraukta į 3 pagrindines JAV lauko prekių parduotuvių tinklus. Pirmaisiais metais − 5 000+ vienetų su 98 % pardavimo rodikliu.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Baidarė
      - BSCI
    outcome_metrics:
      - label: Mažmeninės prekybos tinklai
        value: '3'
      - label: Pirmų metų vienetai
        value: 5,000+
      - label: Pardavimas
        value: 98%
  - id: australian-rib-distributor
    client: Australijos platintojas
    product: CE-Sertifikuota RIB asortimento linija
    industry: Jūrų / vyriausybinės įstaigos
    challenge: Australijos platintojas reikalavo CE-sertifikuotos RIB asortimento linijos su individualiomis vamzdžių spalvomis, Hypalon galimybe atnaujinti ir atitikti Australijos standartą AS 1799.
    solution: Pagaminti prieš gamybiniai pavyzdžiai su 4 vamzdžių spalvų variantais, surasti CSM Hypalon iš Japonijos tiekėjo, bei koordinuotas trečiosios šalies AS 1799 atitikties testavimas.
    result: 3 modelio RIB asortimentas pristatytas AU/NZ rinkoje. Po to laimėtas vyriausybinis konkursas dėl 12 patrulinių RIBs.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Vyriausybė
    outcome_metrics:
      - label: Paleisti modeliai
        value: '3'
      - label: Patrulinių laivų sutartis
        value: 12 vienetų
      - label: Atitiktis
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Karibų prabangūs kurortų grupė
    product: Kurortų flotilė — RIBs, SUP, baidarės
    industry: Viešbučių sektorius / Turizmas
    challenge: 5 kurortų grupė reikėjo vieningos nuomojamos vandens sporto įrangos flotilės — RIB konkursai, SUPs, ir baidarės — su nuoseklia prekių ženklo išvaizda, saulės poveikiui atspariais medžiagų sprendimais tropiniame klimate ir 5 metų pakeitimo planu.
    solution: Sukurta speciali 3 modelių flotilės paketo koncepcija su UV-stabilizuotais PVC, kurorto prekių ženklo denio grafikai ir etapiniu tiekimo grafiku. Užtikrinta darbuotojų mokymai ir kiekvienam kurortui skirtas atsarginių dalių komplektas.
    result: Pristatytas 180 vienetų per 5 kurortus. Pakartotinis užsakymas 2 naujoms savybėms. 40% vieneto kainos sumažėjimas lyginant su ankstesniais tiekėjais.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Baidarė
      - RIB
      - Viešbučių sektorius
    outcome_metrics:
      - label: Pristatytų vienetų skaičius
        value: 180
      - label: Kurortai
        value: '5'
      - label: Kainos mažinimas
        value: 40%
  - id: southeast-asia-search-rescue
    client: Pietryčių Azijos jūrų agentūra
    product: Patrulinių ir gelbėjimo RIB flotilė
    industry: Vyriausybė / Jūrų saugumas
    challenge: Vyriausybinė jūrų agentūra reikėjo 20 patrulinių ir gelbėjimo RIBs su ugniai atspariomis Hypalon medžiagomis, savaime nusausinančiomis grindimis, integruotais VHF/radijo konsolės kronšteinais ir atitinkančios SOLAS III skyrių gelbėjimo laivų standartus.
    solution: Pagaminta 20 RIBs su CSM Hypalon vamzdžių, jūrinio aliuminio korpusais, sunkiųjų tempimo kilpų ir iš anksto įrengtų navigacijos šviesų paketais. Fabriko patikros komanda stebėjo jūrų bandymus. Pateiktas pilnas SOLAS dokumentacijos paketas.
    result: Sutartis įvykdyta per 4 mėnesius. Flotilė dislokuota pasienio patruliavimui, paieškos ir gelbėjimo bei katastrofų valdymo užduotims per 3 regionines bazes.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Vyriausybė
      - SOLAS
    outcome_metrics:
      - label: Patrulinės RIBs
        value: '20'
      - label: Tiekimas
        value: 4 mėnesiai
      - label: Bazės
        value: '3'
  - id: european-dtc-ecommerce
    client: Europos DTC vandens sporto prekės ženklas
    product: Prekinis SUP + aksesuarų asortimentas
    industry: E-komercija / Mažmeninė prekyba
    challenge: Greitai augantis DTC vandens sporto prekės ženklas reikėjo visapusiškos SUP komplekto (lentos, siurblio, irklas, pavadėlis, krepšys) su aukštos klasės pakuote, sukurtos e-komercijos įvykdymui — tiesiogiai vartotojui per DHL/FedEx be pažeidimų.
    solution: Sukurtas bendro prekės ženklo produktų asortimentas su individualiai formuotu EPS branduoliu, patentuota drop-stitch technologija didesniam slėgiui ir mažmeninei prekybai paruoštomis dvigubų sienelių gofruotomis dėžėmis su įdėklu. Integruota QR kodo pagrindu veikianti autentiškumo ir garantijos registracija.
    result: 3 modelių SUP asortimentas pristatytas per 75 dienas. Pirmieji 12 mėnesių — 15 000 + vienetų. 4,8★ vidutinė įvertinimo reitingas iš 2 000 + atsiliepimų. 0,3% pažeidimo procentas per gabenimą.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-komercija
    outcome_metrics:
      - label: Modeliai
        value: '3'
      - label: Vienetai
        value: 15,000+
      - label: Vidutinė įvertinimo reitingas
        value: 4.8★
      - label: Pažeidimo procentas
        value: 0.3%
certifications:
  - name: CE
    body: Europos Sąjunga
    desc: Produktai turi CE sertifikaciją pagal galiojančius ES direktyvas — laisvalaikio laivai pagal EN ISO 6185, asmeniniai gelbėjimosi įtaisai pagal EN ISO 12402, kur taikoma.
  - name: ISO 9001
    body: SGS / BSI
    desc: Kokybės vadybos sistema sertifikuota pripučiamų vandens transporto priemonių projektavimui, gamybai ir platinimui.
  - name: BSCI
    body: amfori
    desc: Socialinės atitikties sertifikacija, patvirtinanti etišką gamybą, sąžiningą darbo jėgos naudojimą ir darbo vietos saugumą.
  - name: REACH
    body: Europos chemikalų agentūra
    desc: Visos medžiagos atitinka REACH cheminio saugumo taisykles. Dokumentacija teikiama su kiekvienu siuntimu.
  - name: RoHS
    body: Europos Sąjunga
    desc: Pavojingų medžiagų apribojimo laikymasis visuose elektroniniuose ir elektros komponentuose.
  - name: AS 1799
    body: Standards Australia
    desc: Australijos standartas pripučiamiems valtims — išbandyta ir sertifikuota komerciniam naudojimui AU/NZ vandenyse.
