  title: Sörf Görgü Kuralları (Herkesin Kaçındığı Kişi Olmamak Yolları)
  description: Kadronun kuralları var ve kimse onları yazmıyor. Yol hakkını, neden snake'in size azarlanacağını, nasıl özür dileyeceğinizi ve her yerel sörfçüyü rahatsız eden yeni başlayan hatalarını öğrenin.
  definition: 'Sörf görgü kuralları, çarpışmaları önleyen ve dalgaları adil şekilde paylaşan yazılı olmayan bir davranış kurallarıdır. Temel kural: kırılan dalganın zirvesine en yakın olan sörfçünün geçiş hakkı vardır.'
  tldr: Dalganın zirvesine en yakın olan sörfçünün yol hakkı vardır. Birinin yanına düşme, birinin etrafında kürek çekme (dalgasını almak için kürek çekme) ve hata yaparsan her zaman özür dile. Dizinin etrafında geniş kürek çek, tahtasına tutun ve dostça olun — saygı saygıyı kazandırır.
  problem: Kalabalık bir dizide kürek çekiyorsun ve hemen gerginliği hissediyorsun. Sörfçüler yandan bakıyor, biri sana bağırıyor ve neyi yanlış yaptığını bilmiyorsun. Sörfün sosyal tarafı, dalgalardan daha ürkütücü geliyor.
  explanation: 'Dalga görgü kuralları, çarpışmaları önlemek ve dalgaları adil şekilde paylaşmak için vardır. Temel kural geçiş hakkıdır: zirveye en yakın olan sörfçü (dalganın ilk kırdığı yer) önceliğe sahiptir. Aynı dalgaya daha içeriden kürek çekenler geri çekilmelidir. Sürünmek — başka bir sörfçünün etrafında kürek çekip önceliği çalmak — en kötü suç olarak kabul edilir. Önceliğin ötesinde, dizinin gürültü (bağırmayı minimuma endirmek), tahta kontrolü (tahtanı başkalarına yaklaştırma) ve samimiyet (basit bir baş sallaması çok işe yarar) gibi beklentilere sahiptir.'
  solution: Sırayı 10 dakika boyunca izleyin, sonra kürek çekin. En çok dalgayı kim yakaladığını belirleyin — saygı duymanız ve kaçınmanız gereken sörfçüler bunlardır. Öğreniyorsanız iç tarafta (beyaz su bölgesi) kalın. Sıranın etrafında geniş kürek çekin, içinden değil. Dalga yakalarsanız, yukarı çıkmadan önce iki yöne bakın ve kimsenin daha derin olmadığından emin olun.
  recommendation: İlk birkaç seansınızı yayılmış kalabalıklarla başlayanlar için uygun bir molada geçirin. Yoğun bir sıraya girmeden önce önceliği okumayı öğrenin. Birine uğrarsanız, hemen özür diledin ve kürek çekin — çoğu sörfçü dürüst bir hataya saygı duyar.
  faq:
    - q: Ne oluyor orada?
      a: Denize inmek, başka bir sörfçünün zaten öncelik verdiği bir dalgaya kürek çekmek ve binmek demektir. Bu tehlikeli ve saygısızdır. Zirveye en yakın sörfçü dalgaya sahiptir; başkası ise dayanmak zorunda.
    - q: Yılan nedir?
      a: Snaking, zaten dalga pozisyonunda olan başka bir sörfçünün etrafında kürek çekmek, böylece zirveye daha yakın bir yere ulaşmaktır. Bu son derece kötü bir görgü kuralları olarak kabul edilir ve çatışmaya yol açabilir.
    - q: Yeni başlayanlar kalabalık molalarda sörf yapabilir mi?
      a: Evet, ama zirveden uzak, beyaz su bölgesinde kalın. Ana kalkış alanına kürek çekmeyin, ta ki sürekli dalgaları yakalayamadan ve yönünüzü kontrol edebilene kadar. Kalabalık sıralar güvenli bir şekilde navigasyon için deneyim gerektirir.
    - q: Suda nasıl özür dileyebilirim?
      a: Basit bir el sallama, gülümseme ve "benim hatam" ya da "özür dilerim" demek işe yarar. Hatayı kabul et ve kişiden uzaklaş. Sörfçüler genellikle dürüst hataları affeder, özellikle de açıkça öğreniyorsan.
    - q: Biri bana uğrarsa ne yapmalıyım?
      a: Eğer açık bir drop-in'se, onları uyarmak için "el salla" veya "hey" diye bağırın. Eğer yanlışlıkla yakalarsa ve özür dilerlerse, bırakın gitsin. Biri tekrar tekrar gelirse, kürek çekin ve önceliği kibarca açıklayın. Çatışmalardan kaçının.
