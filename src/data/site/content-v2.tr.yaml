  title: 'Soğuk Su Güvenliği: Soğuk Koşullarda Kürek Çekmek ve Sörf Yapmak'
  description: Soğuk su SUPgüvenliği, sörf ve kano için kullanılır. Hipotermi tanıma, uygun ekipman, soğuk şok müdahalesi ve soğuk suya batma için acil durum prosedürleri.
  definition: Soğuk su güvenliği, soğuk şok tepkisi, yüzme arızası, hipotermi ve bu sonuçları önlemek için ekipman ve teknikleri anlamayı içerir.
  tldr: 15C'nin altında suda dalış kıyafeti gerekir. 10C'nin altında ise bot, eldiven ve kapüşon gerekir. Soğuk şoku istemsiz nefes nefese kalmaya neden olur. Yüzme başarısızlığı, 10°C'nin altında 3-5 dakika içinde suda gerçekleşir. Hipotermi belirtileri arasında titreme, kafa karışıklığı ve koordinasyon kaybı bulunur.
  problem: Güneşli bir günde suyun 8C olduğunu bilmeden kürek çekiyorsun. Içine düşüyorsun, istemsizce nefes kesiliyorsun ve dakikalar içinde uzuvların uyuştuğunu hissediyorsun. Soğuk su, diğer tüm okyanus tehlikelerinden daha hızlı öldürür.
  explanation: "Soğuk suya batmanın dört aşaması vardır: soğuk şok (0-2 dakika) — nefes nefese, hiperventilasyon. Yüzme başarısızlığı (3-15 dakika) — kaslar soğur, koordinasyon bozulur. Hipotermi (15-45 dakika) — çekirdek sıcaklığı 35°C'nin altına düşer ve kafa karışıklığı ile kalp durmasına neden olur. Kurtarma sonrası çöküş — soğuk kan tekrar çekirdeğe döner."
  solution: "Su sıcaklığını kontrol et. Sıcaklığa uygun bir dalış giyin. 15°C'nin altında tek başına kürek çekme. Düdük ve telefon taşı. Düşerseniz: nefes almayı kontrol edin, tahtayı hızlıca yeniden takın. Çok soğuyorsanız, yardım için sinyal verin."
  recommendation: Paddle Board Overstock Wetsuit Pro 5/4/3mm su için minimum 8-14C. Paddle Board Overstock 5mm botlar ve 3mm eldivenler ekleyin. Ekstra termal koruma için Life Vest Pro giyin.
  faq:
    - q: 10°C suda ne kadar hayatta kalabilirim?
      a: Soğuk şok 1-2 dakika sürer. Yüzme ve termal koruma olmadan hayatta kalma süresi 30-60 dakikadır.
    - q: Hipoterminin ilk belirtileri nelerdir?
      a: Kontrol edilemeyen titreme, kafa karışıklığı, kötü koordinasyon, bulanık konuşma. Hareketi durdur ve hemen ısın.
    - q: Soğuk su seansından sonra nasıl ısınabilirim?
      a: Islak kıyafetleri çıkarın, kurulayın, şapka ve eldiven dahil sıcak katmanlar giyin. Sıcak alkolsüz içecekler için.
    - q: Yazın hipotermi olabilir miyim?
      a: Evet — 15C'nin altında olan su, yazın bile birçok yerde bulunur. Su, havadan 25 kat daha hızlı ısı iletir.
