  title: 'Paddle Board Boyut Rehberi: Her Sürücü İçin Hacm, Uzunluk ve Genişlik'
  description: Ağırlık ve aktiviteye göre hacim önerileriyle tam bir paddle board ölçüsü. Genel alan, tur, sörf ve yoga tahtaları için kullanımı kolay bir boyut tablosu SUP içerir.
  definition: Paddle board boyutu hacim (ağırlık kapasitesi ve yüzerlik), uzunluk (hız ve izleme), genişlik (stabilite) ve kalınlık (hacim dağılımı ve rüzgar direnci) ile belirlenir.
  tldr: 'Minimum hacim bulmak için ağırlık kullanın: 50-70 kg 220-260L gerektirir, 70-90 kg 260-300L ister, 90-110 kg 300-350L ister, 110+ kg için 350+L gerekir. Yeni başlayanlar için bu rakamlara %20 ekleyin. Genişlik önemlidir: 32" orta seviye, 33-34" yeni başlayanlar için uygun, 35"+ ise çok stabil.'
  problem: Paddle board boyut listelerinde feet, inç ve litre birbirinin yerine kullanılır, bu da markalar arasında karşılaştırmayı zorlaştırır.
  explanation: Hacim, ağırlık kapasitesinin en doğrudan ölçütüdür — 1 litre tatlı su 1 kg ağırlığı yer değiştirir. 260L'lik bir tahta teorik olarak 260 kg taşıyabilir, ancak pratik kapasite daha düşüktür çünkü tahta suyun üzerinde durmalıdır. Toplam ağırlığınız (gövde ve dişli) tahtanın hacminin %30-40'ı olmalıdır.
  solution: Hedef hacmi = (vücut ağırlığı kg cinsinden + dişli ağırlığı kg cinsinden) x 3. 5 kg ekipmanlı 75 kg ağırlığındaki bir kürekçi için hedef = 80 x 3 = minimum 240L. Yeni başlayanlar için 3.5 ile çarp. İleri seviyede için 2.5 ile çarp.
  recommendation: Paddle Board Overstock SUP Explorer 11 (260L, 11' x 33" x 6") çoğu sürücüye 50-100 kg ağırlığında uygundur. Daha hafif sürücüler 270 ölçüsüne kadar ölçü alabilir AirDeck . Daha ağır sürücüler SUP ise Tour 12 (300L+) veya daha geniş tahtalara bakmalıdır.
  faq:
    - q: Boy ölçü açısından önemli SUP mi?
      a: Boy ağırlıktan daha az önemli. Uzun boylu, hafif bir sürücü, kısa ve ağır bir sürücüye göre daha az hacim gerektirir. Ağırlık hacim belirleyici olarak kullanın.
    - q: Çok fazla ses durumunda ne olur?
      a: Tahta çok yüksekte duruyor, rüzgarı yelken gibi yakalıyor. Kesimde kork gibi hissettiriyor. Ancak yeni başlayanlar için fazladan hacim çok az değil.
    - q: Çok az ses seviyesiyle ne olur?
      a: Tahta çok derin oturur ve sürtünme oluşur. Burun kürek çekerken (inci) suyun altına düşebilir. Kısmen suya batmış bir tahtayı kürek çekmekten hızlı yorulursunuz.
    - q: Şişme tahtaların ölçüleri sert tahtalardan farklı mı olur?
      a: Önemli değil. 15 derecelik şişme tabaklar,+ PSI sert tahtalar gibi suyu yer değiştirir. Hacim önerileri her iki tip için de eşit şekilde geçerlidir.
