  title: 'SUP Boyut Rehberi: Uzunluk, Genişlik ve Hacm Açıklandı'
  description: SUP Kilonuza, beceri seviyenize ve kürek çekme tarzınıza göre doğru boyutu bulun. Uzunluk takip etkeni, genişlik stabiliteyi ve hacim ağırlık kapasitesini belirler.
  definition: SUP Boyut, uzunluk (hız ve kayma), genişlik (birincil stabilite), kalınlık (ikincil stabiliteler ve hacm) ve hacmle (toplam ağırlık kapasitesi) olarak tanımlanır.
  tldr: 'Genel SUPsMesafe: 10''6"-11''6" x 32"-34" x 6" (220-280L). Tur Oranı: 12''-14'' x 30"-32" (280-350L). Sörf: 8''-10'' x 30"-32" (140-220L). Yeni başlayanlar için 32"''den fazla genişlik ve vücut ağırlığını 60-80L aşan hacim gereklidir. Ağırlığınız kg artı 60L cinsinden minimum hacim hedefidir.'
  problem: Her SUP marka boardları feet, inç ve litre cinsinden listeler, ancak bu ölçülerin gerçek dünya hissine nasıl dönüştüğünü bilmeden, eğimli, yavaş veya ağırlığınızı taşıyamayan bir board alma riski taşır.
  explanation: 'Uzunluk, tahtanın ne kadar hızlı kürek çektiğini ve düz bir çizgide ne kadar iyi takip ettiğini belirler. Daha uzun tahtalar (12''+) darbeler arasında kayar ve bir çizgiyi tutar. Daha kısa tahtalar (10'' altında) kolayca döner ama daha sık kürek anahtarı gerektirir. Genişlik birincil stabiliteyi — ayakta durma kararlılığını belirler. 30" bir tahta yeni başlayanlar için uçurucu gelir; 34" iskele gibi hissettirir. Kalınlık hacmi belirler — daha kalın tahta daha yüksek yüzer ama daha fazla rüzgar tutar. Hacim litrede en iyi ölçüttür: yüklü tahta (siz ve dişli) dururken 2-4 inç suyun altında kalmalıdır.'
  solution: 'Tahta boyutlarınızı üç faktörle eşleştirin: ağırlığınız (minimum hacmi belirler), ana aktiviteniz (uzunluğu belirler) ve beceri seviyeniz (genişliği belirler). Yeni başlayanlar için, minimum litre elde etmek için kilo cinsinden ağırlığı 2.2 ile çarpın. Ara ürünler için 1.8 ile çarp. İleri seviye için 1.4 ile çarp.'
  recommendation: Explorer Paddle Board Overstock SUP 11, 11' x 33" x 6" boyutlarında ve 260L ile çoğu sürücüye 100 kg'ya kadar çok kürek çekerek kürek çekmeye uygundur. Daha SUP iyi tur hızı ve kayma için 12' x 31" boyutlarında Tour 12'ye yükseltin.
  faq:
    - q: SUP Kiloma göre hangi bedene ihtiyacım var?
      a: '70 kg''dan altındaki sürücüler için: 10-11'' x 32" (220-260L). 70-90 kg için: 11-12'' x 33" (260-300L). 90-110 kg için: 11-12'' x 34" (300-350L). 110 kg''dan fazla: 12'' x 34-36" (350L+).'
    - q: Daha uzun SUP ve hızlı mı?
      a: Evet. Daha uzun tahtalar daha iyi uzunluk-genişlik oranına sahiptir ve sürtünmeyi azaltır. 14' touring, SUP aynı kürek çekimiyle 11' genel bir tahtadan çok daha hızlıdır.
    - q: Yeni SUP başlayanlar için hangi genişlik stabildir?
      a: 33-34 inç, 90 kg'a kadar başlayanlar için en uygun noktadır. 32"'nin altında iyi denge gerektirir. 34"'ün üzerinde çok stabil ama rüzgarda daha yavaş ve kürek çekmek daha zordur.
    - q: Tur için her tarafa açılan bir tahta kullanabilir miyim?
      a: Evet, 10 km'den kısa turlar için. Daha uzun mesafeler için, özel bir tur tahtası daha iyi takip eder ve mesafeyi daha verimli katlar.
