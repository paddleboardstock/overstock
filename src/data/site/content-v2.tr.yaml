  title: 'Can Yeleği Satın Alma Rehberi: Türleri, Uyumu ve Özellikleri Açıklandı'
  description: Su sporları için tam bir can yeleği satın alma rehberi.PFD Türler (I'den V'ye kadar), şişirme ve köpük arasındaki fark, uyum testi ve SUPözel öneriler, kano, tekne ve balıkçılık.
  definition: Bir can yeleği veya bir PFD kişinin başını suyun üstünde tutmak için tasarlanmış bir yüzme cihazıdır. Türler, ABD Sahil Güvenlik tarafından yüzdürme kuvveti ve kullanım amacına göre düzenlenir.
  tldr: 'Beş PFD tür: Tip I (açık denizde, 22+ lb), Tip II (kıyıya yakın), Tip III (yüzme yardımcısı, en yaygın olan), Tip IV (atılabilir), Tip V (özel kullanım). Şişme yelekler konforluk sunar ancak CO2 kartuş bakımı gerektirir. Köpük yelekler bakım gerektirmez ancak daha hacimlidir.'
  problem: Can yelekler tiplere ve yüzme derecelerine göre kategorize edilir, ancak mağazalar hangi tipin aktivitenize uygun olduğunu her zaman açıklamaz.
  explanation: Tip I en fazla kaldırma sağlar ve baygın olan kullanıcıyı yüzü yukarı çevirir. Tip II tüm kullanıcıları yüzü yukarı çevirmeyebilir. Tip III aktif sporlar için hareket özgürlüğü sağlar. Tip V şişirilebilir kemer paketleri SUPiçerir. Şişirilebilir PFD'ler 33-37 lb kaldırma sağlar ve söndürüldüğünde kompakt olur.
  solution: 'SUPŞöyle için: Tip V şişme kemer çantası. Kano için: Yüksek kol kesikli Tip III köpük. RIB Tekne için: Tip III köpük veya şişirilebilir, 22+ lb kaldırma gücüne sahip. Çocuklar için: Tip II veya III köpük, kasık kayışıyla.'
  recommendation: Paddle Board Overstock Can Yeleği Pro (şişirilebilir Tip V, 33 lb) SUP ve kayak.Paddle Board Overstock RIB Tekne ve genel deniz kullanımı için Can Yeleği Classic (köpük Tip III, 16,5 lb).
  faq:
    - q: Hangi PFD tür için ihtiyacım SUPvar?
      a: Birçok yargı yetkisi için Tip III veya Tip V SUPkabul eder. Şişme kemer paketleri popülerdir. Yerel yasaları kontrol edin.
    - q: Şişme PFD'ler bakım gerektirir mi?
      a: Evet — CO2 kartuşunu her yıl kontrol et, 2-3 yılda bir bobinini değiştir, tuzlu su kullandıktan sonra durulayın.
    - q: Köpük PFD takabilir SUPmiyim?
      a: Evet, ama yüksek kol kesikleri olan birini seçin. Köpük yelekler daha hacimlidir ama bakım gerektirmez.
    - q: PFD Bir çocuk için en iyisi nedir?
      a: USCG-onaylı Tip II veya III köpük yelek, yaka, kasık kayışı ve parlak renkler. Çocuklar için asla şişirilebilir PFD kullanmayın.
