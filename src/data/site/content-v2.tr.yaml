- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Su ve Güneş Koruma: Suda Güvende Kalın.'
  description: Kürekçiler için temel su içme ve güneş koruma SUP stratejileri. Susuz kalma ve güneş yanığı en yaygın SUP sorunlardır — uzun seanslarda her ikisini de nasıl önleyebiliriz.
  definition: SUP Hidrasyon, düzenli su alımıyla kürek çekerken sıvı dengesini korumaktır. Güneş koruması, SPF uygulaması, koruyucu giysiler ve zirveyi önlemek için zamanlama seanslarını içerirUV.
  tldr: Her saat kürek çekerken 500ml su için. İhtiyacınız olduğundan fazlasını getirin — 2L mesane veya birden fazla şişe. Kürek çekmeden önce suya dayanıklı SPF 50+ güneş kremi uygulayın ve her 2 saatte bir tekrar uygulayın. Şapka, askılı güneş gözlüğü ve UPF dereceli kıyafetler takın. En güçlü zamanlarda 11 sabah - 15:00 arası kürek çekmekten UV kaçının.
  problem: Harika SUP bir seans geçiriyorsunuz ama bir saat sonra baş ağrısı, ağız kuruluğu ve cildiniz yanıyor. Susuz kalma ve güneş yanığı yaklaşıyor çünkü su sizi serin tutuyor.
  explanation: Suya yansıma, UV maruziyeti %40'a kadar yoğunlaştırır. Su ve esintinin soğutucu etkisi, güneş yanığını çok geç olana kadar engeller. Kürek çekmekten kaynaklanan ter, sıvı kaybını artırır ve su üzerindeki suyu dolduracak yer genellikle yoktur. Susuz kalma dengeyi ve karar vermeyi bozar, kaza riskini artırır.
  solution: Tahtanın bungee sistemine bir su şişesi veya hidrasyon mesanesi takın. Susuz olun ya da susamayın her 15 dakikada bir için.+ Fırlatmadan 30 dakika önce SPF 50 güneş kremi uygulayın. Geniş kenarlı şapka, kayışlı polarize güneş gözlüğü ve UPF 50+ döküntü koruyucu takın. Her 2 saatte bir tekrar güneş kremi uygulayın.
  recommendation: Ön D-halkalarına bağlanmış bir su mesanesi Paddle Board Overstock SUPkullanın. Altına UPF 50+ döküntü koruyucu PFDtakın. Ter ve suda da kalan su geçirmez bir güneş kremi kullanın.
  faq:
    - q: SUP Bir geziye ne kadar su getirmeliyim?
      a: Saatte en az 1 litre. 2 saatlik seans için 2 litre getirin. Sıcak havada daha fazla. Hidrasyon mesanesi en iyi işe yarar.
    - q: Hangi tür güneş kremi için en SUPiyisi?
      a: Suya dayanıklı, SPF 50+ geniş spektrumlu. Mineral güneş kremleri (çinko oksit, titanyum dioksit) resif için güvenlidir ve daha uzun ömürlüdür.
    - q: Su gerçekten yansıyır UVmı?
      a: Evet — su radyasyonun %40'ına kadar UV yansıtır, yani UV yukarıdan ve aşağıdan alırsınız. Bu da yanık riskini önemli ölçüde artırır.
    - q: Döküntü koruyucusuyla güneş yanığı olabilir miyim?
      a: Standart döküntü koruyucuları minimum UV koruma sağlar (yaklaşık 10-20 UPF). Tam koruma için UPF 50+ dereceli kıyafetlere bakın.
