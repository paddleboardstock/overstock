  title: 'Şişme Tekne Bakımı: Yatırımınızı Koruyun'
  description: Yıllık şişme bot bakım kontrol listesi. Temizlik, UV koruma, dikiş denetimi, basınç yönetimi, motor bakımı ve tekneler için kışa PVC Hypalon hazırlanma.
  definition: Şişme tekne bakımı, temizlik, UV koruma, basınç yönetimi, dikiş ve valf denetimi, küf önleme ve doğru mevsim dışı depolama işlemlerini içerir.
  tldr: Her kullanımdan sonra tuzlu suda durulayın. Her UV 2-3 ayda bir koruyucu uygulayın. Her geziden önce şişlik basıncını kontrol edin. Dikişleri, vanaları ve eş kısmını aylık kontrol edin. Yumuşak sabunla temizleyin. Mevsim dışında soğuk, kuru bir yerde söndürülmüş şekilde saklayın.
  problem: Şişme botunuzu bir sezon kullandınız ve şimdi borular solmuş görünüyor, bir dikiş sızıyor ve kap kısmı süngerimsi hissettiriyor — hepsi rutin bakımla önlenebilir.
  explanation: UV Radyasyon polimer matrisini bozurur. Tuzlu su katlar halinde kristalleşir ve kumaşı aşındırır. Küf hapsolmuş nemde büyür. Yanlış basınç malzeme yorgunluğuna neden olur. Gövde (özellikle kontrplak) vida deliklerinden suyu emer.
  solution: 'Her kullanımdan sonra: taze suyla durulayın, kurutun, basıncı kontrol edin. Aylık: tüpleri UV koruyucu ile silin, dikişleri kontrol edin, valfi kontrol edin. Yıllık: derin temizlik, kap kısmını çürüme açısından kontrol edin, vanaları yağlayın, mikro sızıntı için test edin.'
  recommendation: Tekne tüplerinde 303 Aerospace Protectant kullanın Paddle Board Overstock . Valfleri çıkarın ve yıllık silikon yağ uygulayın. Taşıma çantasında kurutucu paketle birlikte saklayın.
  faq:
    - q: Şişme teknemi temizlemek için çamaşır suyu kullanabilir miyim?
      a: Hayır — çamaşır suyu kumaş kaplamasına zarar verir. Hafif sabun ve ılık su kullanın. Küf için seyreltilmiş beyaz sirke kullanın.
    - q: Koruyucu ile ne sıklıkla tedavi UV etmeliyim?
      a: Kullanım sezonunda her 2-3 ayda bir. Tropikal iklimlerde daha sık.
    - q: Teknemi kullanımlar arasında boşaltmam mı gerekiyor?
      a: Haftalık kullanılırsa olmaz. Şişirilmiş şekilde UV bir kapak ile bırakın. Aylık boşluklar için söndürün ve depolayın.
    - q: Transomu nasıl koruyabilirim?
      a: Cıvatalar aylık olarak kontrol edilsin. Açık ahşap kenarları her yıl deniz vernikiyle kapatın. Yumuşak noktalar oluşursa değiştirin.
