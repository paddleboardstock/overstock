  explanation: "Çoğu havayolu SUP sırt çantasını teslim edilen bagaj olarak kabul eder, ancak politikalar farklıdır. Önemli boyutlar: Paddle Board Overstock sırt çantası paketlendiğinde yaklaşık 90x40x30 cm'dir. Toplam ağırlık yaklaşık 15 kg — çoğu havayolu sınırları içinde. Bazı havayolları büyük bagaj ücreti alır. Mümkünse pompa ve kanatları taşımak için el bagajı yapın. Varmadan önce yerel su koşullarını, kalkış ücretlerini ve depolamayı araştırın."
