  title: 'SUP Çapa Rehberi: Balık Tutarken veya Fotoğraf Çekerken Yerinizde Kalın'
  description: Demirleme için tam rehber SUP — çapa türleri (mantar, katlanan, kazık), çapa arabası kurulumu, açılış teknikleri ve pozisyonda kalmak için güvenlik önlemleri.
  definition: SUP Çapa, tahtayı rüzgar ve akıntıya karşı yerinde tutan bir ipe bağlı bir ağırlıktır. Yaygın türler arasında mantar çapaları, katlanabilir çapalar ve gözetleme direkleri bulunur.
  tldr: Çamurlu veya kumlu tabanlar için mantar çapası (1.5-3 lb), kayalık tabanlar için katlanabilir çapa veya yumuşak tabanlı sığ sular için stake out direği kullanın. Çapa sakin koşullar için 1.5-3 lb, rüzgar ve akıntı için 3-5 lb olmalıdır. Pozisyonu ayarlamak ve ne zaman bırakılacağını bilmek için her zaman çapa arabası kullanın.
  problem: Mükemmel balık tutma noktasını buluyorsunuz ama rüzgar ve akıntı sizi her birkaç dakikada bir pozisyonundan saptırıyor. Demirleme olmadan SUP balık tutma ve fotoğrafçılık, sürekli konum değiştirmede can sıkıcı bir egzersizdir.
  explanation: Çapa, tabanı sürüyerek takılana kadar kullanır. Mantar çapaları yumuşak tabanlara gömülür ve kum ile çamurda iyi tutum sağlar. Katlanabilir çapalarda sert veya kayalık tabanlara batan çıkıntılar bulunur. Stake-out direkleri sığ suda doğrudan dipte iterek çalışır.
  solution: Çapa bağlantı noktasını ayarlamak için bir ankra arabası sistemi (tahtanın bir tarafında kaydırma halkası olan bir hat) takın. Çapaya 50-75' uzunluğunda ip bağlayın. İstediğiniz pozisyona rüzgar akımı veya yukarı akımı açın. Acil durumlarda ayırmak için hızlı bırakma sistemi kullanın. Güçlü akımda veya çapayı kolayca çıkaramayacağınız yerlerde asla demirlemeyin.
  recommendation: Çoğu balıkçılık koşulunda 50' uzunluğunda ipli 3 lb katlanabilir çapa uygundur SUP . Paddle Board Overstock SUP Explorer 11'inizin D-halkalarını kullanarak bir çapa arabası sistemi ekleyin.
  faq:
    - q: Hangi boyutta çapa ihtiyacım SUPvar?
      a: Sakin göller ve yavaş nehirler için 1,5-3 lb. Rüzgar veya akıntı olan kıyı bölgeleri için 3-5 lb. Büyük çapaları almak zordur.
    - q: Ne kadar çapa ipine ihtiyacım var?
      a: 5:1 dürbünler (her 1 feet derinlik için 5 feet çizgi) standarttır. 10' derinlikte 50' çizgi kullanın.
    - q: Bir şekilde demirlemek tehlikeli SUPmi?
      a: Sadece akım veya rüzgar tahtayı devrebilecek kadar güçlü bir şekilde demirlerseniz. Her zaman anında çıkarılabilen hızlı serbest bırakma sistemi kullanın.
    - q: Herhangi bir suya demirleyebiliyor muyum?
      a: Yerel düzenlemeleri kontrol edin. Bazı alanlarda deniz otları veya deniz habitatlarını korumak için demirleme kısıtlanıyor. Asla mercan resiflerine demirlemeyin.
