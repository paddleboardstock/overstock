- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Şişme SUP Tamir: Delikleri, Sızıntıları ve Valf Sorunlarını Düzeltin'
  description: Kendin yap şişme SUP tamir rehberi. Yavaş bir sızıntı nasıl bulunur, delik yamalanır, valf değiştirilir ve daşardaki tamir kitiyle güverte pedinin delaminasyonunu nasıl düzeltilir.
  definition: Şişme SUP tamir, hava sızıntılarının sabunlu su testi yoluyla tespit edilmesini, hasar görmüş bölgeyi temizlemeyi ve pürüze atılmasını, PVC yapıştırıcı ve yama uygulanmasını ve basınç altında kürlenmesini içerir.
  tldr: Sabunlu su sızıntılarını bulun. Delik çevresini zımpara kağıdıyla temizleyin ve pürüzle temizleyin. PVC Hem yama hem de kartona yapıştırıcı uygulayın, 5 dakika bekleyin, sıkıca basın ve 24 saat ağırlığı altında kürleyin. Valf sızıntıları için önce O-ring'i kontrol edin. 1/4" altındaki küçük delikler kolay kendin yap tamirlerdir.
  problem: SUP Şişirirsiniz ve sabaha kadar basınç kaybı olur. Tamir bilgisi olmadan, muhtemelen basit bir delik için pahalı bir değişim ile karşı karşıya kalırsınız.
  explanation: 'Çoğu şişirilebilir SUPs drop-stitch PVC modelde dış katmanlı çekirdek kullanılır. Dış delikte PVC yavaş bir sızıntı oluşur. Standart tamir: temizle, zımparalama, PVCuyumlu yapıştırıcı uygulama, ağırlık altında presleme yama. Valf sızıntıları panel deliklerinden daha yaygındır — O-ring kurur veya kalıntı sızdırmazlığı engeller.'
  solution: Tahtayı maksimuma kadar PSI şişirin ve tıslama sesi olup olmadığını dinleyin. Özellikle dikişlerin ve valfin etrafına sistematik olarak sabunlu su püskürtün. Köpükleyen noktaları işaretleyin. Söndürün, alkolle temizleyin, 80-grit ile zımparalayın, PVC yama ve tahtaya yapıştırıcı uygulayın, yapışkan olana kadar bekleyin, sıkıca bastırın, 24 saat ağırlık verin.
  recommendation: Paddle Board Overstock Tüm kartların yanında gelen tamir kitini kullanın Paddle Board Overstock . Yolculuklarda her zaman tamir kitini yanınızda bulundurun. Valf sorunları için destek ile iletişime Paddle Board Overstock geçin. Büyük yırtıklar veya dikiş ayrılmaları için profesyonel tamir önerilir.
  faq:
    - q: Şişme makinemdeki büyük bir yırtık onarabilir SUPmiyim?
      a: 1\"'in üzerindeki yırtıklar profesyonel tamir veya her iki tarafta da yama gerektirebilir. Ray boyunca dikiş ayrılmaları güvenilir şekilde sahada onarılamaz.
    - q: Bir tamir yaması ne kadar sürer?
      a: Doğru teknikle yapılan doğru bir onarım, kartın ömrü boyunca sürer. Yetersiz temizlikten kaynaklanan kötü yapışma ileride arızaya yol açar.
    - q: Bir su akıntısı olan bir vanayı tamir edebilir miyim?
      a: Çoğu zaman evet. Valf çekirdeğini çıkarın, O-ring'i inceleyin, temizleyin veya değiştirin, silikon yağlayıcı uygulayın ve tekrar takın.
    - q: Ya sızıntıyı bulamazsam?
      a: Dolguya PSI şişirin ve bölümleri sırayla küvet veya havuza batırın. Bulunamayacak kadar küçük sızıntılar sıcaklıkla ilgili olabilir.
