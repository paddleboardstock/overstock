- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Kendini Kurtarma: Derin Suda Tahta Nasıl Geri Dönebilirsin'
  description: Her SUP kürekçi kendini kurtarmayı ustalaştırmalıdır. Tahtanı derin suya yeniden monte etme, kıyıya çekme ve tasma düğümleriyle başa çıkmak için adım adım teknikler.
  definition: SUP Kendi kurtarma, düştükten sonra kürek tahtasını derin suya yeniden monte etme tekniğidir; tahtayı kurtarma, vücut yeniden monte etme ve kürek toplama gibi yöntemlerdir.
  tldr: 'Düştükten sonra: sakin kalın, küreği tutun, tahtaya doğru yüzün. Küreği tahtanın üzerine yerleştirin. Yunus tekmesi kullanarak göğsü tahtaya fırlatın. Bir bacağını yukarı kaldırın, sonra diğerini kaldırın. Önce diz çökün, sonra ayağa kalkın. Kas hafızası kazanana kadar sakin suda pratik yapın.'
  problem: SUP Derin suya düşüyorsun ve tekrar binemiyorsun. Tahta kaygan, yorgun oluyorsun ve panik başlıyor. Kendi kendini kurtarma tekniği bilinmeden, basit bir düşüş tehlikeli hale geliyor.
  explanation: 'Kendi kendine kurtarmanın üç aşaması vardır: iyileşme (boarda yüzmek ve kürek çekmek), yeniden binmek (tahtaya geri dönmek) ve devam (kürek çekmeye devam etmek). Temel teknik, küreği dengeleyici olarak kullanmak ve üst vücudu tahtaya doğru güçlü bacak tekmeleri ile itmektir.'
  solution: 'Aşama 1: tahtaya yüzmek. Küreği tutma veya geri almak. Aşama 2: Küreği tahtaya dik olarak yerleştirmek. Bacakları güçlü bir şekilde tekme atarak göğsü tahtanın ortasına çekin. Aşama 3: Göğüs gemiye bindiğinde, bacakları teker tek yukarı sallayın. 4. aşama: diz çök, nefes al, sonra yavaşça ayağa kalk.'
  recommendation: Kontrollü koşullarda kendi kurtarma hareketini yapabilene kadar pratik yapın. İyi Paddle Board Overstock SUP güverte çekişine sahip Explorer 11'i kullanın. Life Vest Pro ise zorlanırsanız ekstra yüzme sağlar.
  faq:
    - q: Yorgunsam nasıl tekrar binebilirim?
      a: Yüzmek için tahtanın yanında kalın. Bacaklarınız etkili tekme atmasa bile, kollarınızı kullanarak göğsü tahtaya çekin. Ayağa kalkmadan önce diz çökerek dinlenin.
    - q: Ya küreği kaybedersem?
      a: Tahtayı kıyıya kürek çekmek için kollarını kullanın. Başka bir kürekçiden yardım isteyin. Kaybedilen küreği hemen yenileyin.
    - q: Dalgalar halinde kendimi kurtarabilir miyim?
      a: Evet — tahtayı dalgalara dik konumlandır. Yeniden montajı dalgalar arasında zamanlayın. Tasma tahtayı yakında tutar.
    - q: Tasma düğümüyle nasıl başa çıkarım?
      a: Sakin olun, sırt üstü yüzün, tasmayı yavaşça çözün. Tasma yüzgeçlerin etrafına dolanmışsa, sudayken yüzgeçleri çıkarmanız gerekebilir.
