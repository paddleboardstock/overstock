- slug: surfing-safety-tips
  category: problem
  type: safety
  title: "Sörf Güvenliği: Yeni başlayan kazaların %90'ına Neden Olan 7 Hata"
  description: Çoğu sörf kazası önlenebilir. Yeni başlayanların yaptığı 7 kritik güvenlik hatasını, kürek çekmeden önce akıntıları nasıl tespit edeceğinizi ve hayat kurtaran ekipman kontrollerini öğrenin.
  definition: Sörf güvenliği, rip akıntılarını (denize doğru akan su kanallarını) anlamak, asla yalnız sörf yapmamak, her seans öncesi ekipmanı kontrol etmek ve koşulları beceri seviyenize göre ayarlamak demektir. Çoğu kaza temel bilgiyle önlenebilir.
  tldr: Kürek çekmeden önce sörf koşullarını ve hava durumunu kontrol edin. Dalga akıntılarını tanımlamayı öğrenin — dalgalar arasında sakin, karanlık kanallar gibi görünürler. Asla yalnız sörf yapmayın, her zaman plajda ısınmayın ve her seanstan önce tasma ve tahtanızı hasar olup olmadığını kontrol edin.
  problem: Okyanus davetkar görünüyor ama acemilerin göremeyeceği tehlikeleri saklıyor. Akıntılar sizi kıyıdan uzaklaştırır, sığ kum barları her gün değişir ve tasmanız en kötü anda kopabilir. Temel güvenlik bilgisi olmadan, eğlenceli bir oturum acil duruma dönüşür.
  explanation: Rip akıntıları, dalga kurtarma operasyonlarının başlıca nedenidir. Dalgalar tarafından kıyıya itilen suyun bir kanaldan geri akmasıyla oluşurlar. Yırtılmalar sizi suyun altına çekmez — sizi dışarı çeker. Anahtar nokta, sakin kalıp yarıktan çıkana kadar sahile paralel yüzmek, ardından kırıcı dalgalarla geri dönmektir. Yırtılmanın ötesinde, sörfçüler diğer sörfçülerle veya kendi tahtalarıyla çarpışma, soğuk suda hipotermi ve ısınmadan kürek çekmekten kaynaklanan kas krampları ile karşılaşırlar.
  solution: 'Suya girmeden önce plajda 10 dakika kalın: dalga düzenini izleyin, yırtıkların nerede oluştuğunu belirleyin ve güvenli bir giriş noktası seçin. Omuzlarınızı, sırtınızı ve bacaklarınızı esnetleyin. Tasma takınızı kontrol edin ve tahtanın rayında keskin çizikler olmadığından emin olun. Açık bir çıkış planıyla kürek çekin ve işaret noktalarına göre konumunuza dikkat edin.'
  recommendation: İlk seansınızdan önce bir sörf güvenliği kursu alın veya okyanus güvenliği temel rehberini okuyun. Bir düdük taşıyın ve bir arkadaşınızla sörf yapın. Koşullardan emin değilseniz, dışarı çıkmayın — dalgalar yarın hâlâ orada olacak.
  faq:
    - q: Bir rip akımına takılarsam ne yapmalıyım?
      a: Sakin kalın, enerjinizi koruyun ve akıntıya karşı koymayın. Sahile paralel yüzerek (kıyı boyunca yırtıldıktan çıkın), sonra dalgaları kullanarak tekrar içeri girin. Gerekirse bir kolunuzu kaldırarak yardım sinyali verin.
    - q: Rip akımını nasıl fark edebilirim?
      a: Kırılan dalgalar arasında daha sakin ve daha koyu su kanalı arayın. Köpük veya kalıntı denize doğru hareket eder ya da dalga çizgisinde bir boşluk da bir yırtılmayı gösterir. Karışmış kumdan kaynaklanan renk değiştirmiş su başka bir işarettir.
    - q: Yalnız sörf yapmak güvenli mi?
      a: En az bir kişiyle sörf yapmak her zaman daha güvenlidir. Yalnız sörf yapmak zorundaysanız, sakin bir mola seçin, kıyıdaki birine nereye gittiğinizi söyleyin ve sınırlarınız içinde kalın. Su geçirmez bir çantada bir telefon taşıyın.
    - q: Tahtamın birine çarpmasını nasıl engellerim?
      a: Dalgalar arasında tahtanızı asla bırakmayın — her zaman bir elinizi üzerinde tutun. Eğer bayılırsanız, başınızı kapatın ve top gibi kıvrılın. İlk yılınız için olduğu gibi yumuşak tavanlı veya şişme bir tahta Paddle Board Overstock seçin, böylece sakatlık riskini en aza indirin.
    - q: Ne zaman sörf yapmamalıyım?
      a: Dalgalar yetenek seviyenizin üzerindeyse, rip akımı uyarısı varsa, yıldırım varsa, aşırı yorgunsanız ya da alkol tükettiyseniz sörf yapmayın. Sınırlarınızı bilin ve okyanusa saygı gösterin.
