  title: Sörf için ne giymeliler (5/4 ihtiyacın olduğunda board shorts'la görünme)
  description: Ne giyeceğinizi tahmin etmeyi bırakın. Su sıcaklığı, hava sıcaklığı değil, sörf kıyafetinizi belirler. Tropikal döküntü koruyucularından tam kış 5/4/3mm kurulumlarına kadar tam katmanlı kullanım rehberi.
  definition: Sörf kıyafetleri, sıcak suda board şort ve rash guard'lardan soğuk suda botlu ve kapüşonlu tam 5/4/3mm wetsuit'e kadar çeşitlilik gösterir. Hava sıcaklığı değil, su sıcaklığı neye ihtiyacınız olduğunu belirler.
  tldr: Sörf yaparken ne giyeceğiniz tamamen su sıcaklığına bağlıdır — hava sıcaklığına değil. Döküntü koruyucuları ve board shortlar 22°C'nin üzerinde çalışır, yaylı takımlar 18-22°C'yi kaplar, tam 3/2mm takım elbiseler 14-18°C arasında dayanır ve botlarla birlikte 5/4/3mm 14°C'nin altında gereklidir. Her zaman UV koruma giyin ve tasma ile darbe yeleği düşünün.
  problem: Plaja vardığınızda bir döküntü korumasının yeterli olup olmadığını ya da tam bir dalış kıyafeti mi gerekip gerekmediğini bilmiyorsunuz. Hava sıcaklığı ama su soğuk, ya da su iyi hissettiriyor ama rüzgar dondurucu. Yanlış giyinmek seansın mahvolmasına sebep olur.
  explanation: "Sörf kıyafetleri üç amaç için hizmet eder: ısı yalıtımı, UV koruma ve aşınma önleyici. Neopren wetsuitler kalınlık ve kapsayıcılığa göre derecelendirilir — yaylı takımlar (kısa kollar veya bacaklar) sınırda günler için, tam takımlar ise soğuk su içindir. Döküntü koruyucuları tahta dökülmesine ve güneşe karşı koruyur ancak termal değer sunmaz. Botlar, eldivenler ve kapüşonlar aksesuar değildir, 12°C'nin altında soğuk suda sörf için vazgeçilmez ekipmandır."
  solution: 'Dışarı çıkmadan önce yerel şamandıra veya canlı su sıcaklığı raporunu kontrol edin. En soğuk tipik durumunuza göre bir kit oluşturun: yaz için rash guard ve şort, ilkbahar ve sonbahar için 3/2mm tam takım, kış için bot ve kapüşonlu 5/4/3mm. Her zaman bir tasma ekleyin ve güvenlik için yüzdürme yeleği düşünün.'
  recommendation: Önce iyi bir 3/2mm tam kostüm almaya yatırım yapın — en geniş koşullar yelpazesini kapsar. Kışın sörf yapmayı planlıyorsanız 5/4/3mm bir zırhı ve botlar ekleyin. Paddle Board Overstock Termal kaplamalı Wetsuit Pro, her iki sıcaklık aralığını etkili şekilde kapatıyor.
  faq:
    - q: Sadece board şortlarıyla sörf yapabilir miyim?
      a: Evet, 24°C'nin üzerindeki tropikal suda. Göğüs ve kol sürtünmesini önlemek için döküntü koruyucu kullanmak isteyebilirsiniz. Tahta üzerindeki mum veya çekiş pedi, takımın tutuşunuzun eksikliğini telafi etmeye yardımcı olur.
    - q: Surf botlarına ihtiyacım var mı?
      a: Su sıcaklığı 14°C'nin altına düşerse, botlar uyuşmayı önler ve ayaklarınızı kayalardan ve resif kesiklerinden korur. Ayrıca tahtada tutuş sağlar. Kuzey iklimlerindeki çoğu sörfçü Kasım'dan Mart'a kadar bot kullanır.
    - q: Bahar takımı nedir?
      a: Bahar tulumu, 18°C ile 22°C arasındaki suya uygun kısa kol veya kısa bacaklı bir wetsuit'tir (veya her ikisi). Rash guard'dan daha fazla sıcaklık sunar ancak tam takımdan daha az örtü sağlar.
    - q: Sörf yaparken can yeleği giymeli miyim?
      a: Geleneksel can yeleği değil, ama darbe yeleği veya yüzme yardımcısı zorlu koşullarda veya zayıf bir yüzücüyseniz yardımcı olabilir.Paddle Board Overstock Can yelekler kano için tasarlanmıştır SUP ama sörf yeni başlayanlar için ekstra yüzme güveni sağlayabilir.
