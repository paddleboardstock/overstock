  title: Yeni başlayanlar için en iyi su sporları ekipmanı (akıllıca harca, üzgün olmayın)
  description: 'Bütçenizi büyüyeceğiniz ekipmana harcamayın. Akıllı başlangıç kiti dağılımı: tahta, dalış kıyafeti, kürek, güvenlik ekipmanı — nerede harcama yapılacağı, nerede tasarruf edileceği ve gerçekten ne kalıcı.'
  definition: Yeni başlayan su sporları ekipmanları şişme tahta (SUPveya surf), 3/2mm wetsuit, tasma ve pompa ile başlar. Çekirdek ekipmanlar orta seviye kalitede olmalı; güvenlik ürünleri asla ucuz olmamalıdır.
  tldr: Önce SUP şişme veya sörf tahtasıyla başlayın, 3/2mm tam dölgiysi (veya sıcak su için yaylı tulum), tasma, pompa ve kendinden emin bir yüzücü değilseniz can yeleği kullanın. Temel ürünlerde kaliteli ürün (tahta, dalış kıyafeti) alın ve aksesuarlarda tasarruf edin. Bir sezon içinde arızalanacak devasa ucuz, markasız ekipmanlardan kaçının.
  problem: Sörf SUPveya kano yapmak isterseniz de, gerekli ekipmanların listesi uzun ve pahalıdır. Büyüyebileceğiniz şeyler için fazla para ödemek istemezsiniz, fakat ucuz ekipman deneyimi mahveder ve tehlikeli olabilir.
  explanation: 'Su sporları ekipmanları üç seviyeye ayrılır: temel ekipmanlar (tahta, dalış kıyafeti, kürek), güvenlik malzemeleri (tasma, can yeleği, pompa) ve aksesuarlar (çanta, tamir seti, değiştirme cübbesi). Yeni başlayanlar, yüksek hacimli şişme bir tahtaya yatırım yapmalı; çünkü hem sörf tahtası hem platform olarak hem de seyahat SUP için paket olarak hazırlanır ve yüksek ikinci el satış değerine sahiptir. Dalış kıyafetleri GBS dikişli orta seviyede olmalı — bütçe kıyafetleri suyu aylar içinde suyla ayıklayıp delaminasyondan ayrılır. Ucuz kürekler kırılır; ucuz pompalar şişirme sırasında yarı yolda arızalanır. Güvenlik ürünleri asla pazarlık edilmemelidir.'
  solution: 'Yeni başlayanlar için bütçe dağılımı: pompa ve çantalı şişme tahta için $400-700, 3/2mm wetsuit için $200-350, bir paddle için $50-100, tasma için $30-50, can yeleği için $40-70. Tam bir kit için toplamda yaklaşık $800-1200. Önce tahta ve wetsuit alın, sporu sevdiğinizi doğruldukça aksesuarlar ekleyin.'
  recommendation: Paddle Board Overstock SUP Explorer 11, SUP pompa ve çanta dahil 600 doların altında sörf eğitimi ve örtü eğitimi alıyor. Paddle Board Overstock Wetsuit Pro ve çift odalı pompa ile eşleştirerek yıllarca dayanacak tam bir başlangıç kiti elde edin. SUP Açık suda yapmayı planlıyorsanız bir can yeleği ekleyin.
  faq:
    - q: Sörf tahtası kullanabilir SUPmiyim?
      a: Rahat değil. Sörf tahtaları yatarak kürek çekmek için tasarlanmıştır ve daha az hacim ve stabiliteye sahiptir. Şişme SUP bir tahta yeni SUP başlayanlar için kullanılabilir, bu da onu ilk tahta yatırımı olarak daha iyi yapar.
    - q: Yeni başlayan biri hangi dalış kıyafetini almalıdır?
      a: 3/2mm tam bir takım elbise, göğüs fermuarı ve GBS dikişleri var. İlkbahar, sonbahar ve ılıman kış koşullarını kapsar. Arka fermuarlı giriş takımlarından kaçının — daha fazla su çekerler ve çıkarması daha zordur.
    - q: Can yeleğine ihtiyacım var SUPmı?
      a: Özellikle açık suda, rüzgarlı koşullarda veya güçlü bir yüzücü değilseniz şiddetle tavsiye edilir. Birçok yerde yasal olarak SUPs kıyıdan yüzme mesafesinden fazla can yeleği giyilmesini zorunlu kılmaktadır.
    - q: Başlangıç seviyesindeki bir kürek için ne kadar harcamalıyım?
      a: İlk yıl için 50-100 dolarlık alüminyum veya fiberglas kürek yeterlidir. Karbon fiber kürekler daha hafiftir ancak 150-300 dolar tutar ve tercih ettiğiniz uzunluk ve sertliği öğrendiğinizde en iyi satın alınır.
