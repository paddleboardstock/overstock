  type: technical
  title: 'Su Sporları İçin Gelgitleri Anlamak: Pratik Bir Rehber'
  description: Gelgitlerin SUPnasıl etkili, sörf ve kano koşulları. Gelgit haritalarını okumak, bahar ve neap gelgitlerini anlamak ve güvenlik için gelgit hareketlerine göre seansınızı planlamak.
  definition: Gelgitler, ay ve güneşin çekimsel çekimi nedeniyle deniz seviyelerinin günlük yükselip alçalmasıdır. Gelgit aralığı, konum ve ay döngüsüne göre değişir.
  tldr: Çoğu yerde günde iki yüksek ve iki alçak gelgit olur. İlkbahar gelgitleri (dolun/yeni ay) daha geniş aralıklara ve daha güçlü akıntılara sahiptir. Neap gelgitleri (çeyrek ay) daha küçük aralıklara sahiptir. Gelgit su derinliğini, dalga şeklini ve akım gücünü etkiler. SUPÖnce akıntıya karşı kürek çekin, böylece geri dönmenize yardımcı olur.
  problem: Yerel dalganıza vardığınızda neredeyse hiç dalga yok, çıkış gelgitinden kaynaklanan tehlikeli dalgalar veya çok sığ su var. Gelgitleri anlamadan, tehlikeli koşullarda yolculukları boşa harcıyorsunuz veya kürek çekiyorsunuz.
  explanation: Gelgitler ayın yerçekiminden kaynaklanır. İlkbahar gelgitleri (dolunay ve yeni ay) en yüksek ve en düşük seviyeleri sağlar. Neap gelgitleri (çeyrek ay) minimum aralık sağlar. Gelgit akımları orta gelgitte en hızlı, yüksek ve düşük seviyelerde gevşektir. Gelgit aralığı 0,3m (Akdeniz) ile 16m (Bay of Fundy) arasında değişir.
  solution: 'Her seanstan önce gelgit tablosunu kontrol edin. Sörf için: sahil molaları genellikle yüksek gelgitin her iki yanında 2-3 saat en iyi şekilde çalışır. SUPÖrneğin: ilk yarıda akıntıya karşı kürek çekin, böylece akıntı destekleri geri döner. Balık tutma için: gelen gelgit balıkları düzlüklere iter.'
  recommendation: NOAA gelgit tahminlerini veya yerel gelgit uygulamasını kullanın. Yerel dalganızın gelgit tercihini bir ay boyunca koşulları kaydederek öğrenin.
  faq:
    - q: Bahar gelgiti nedir?
      a: İlkbahar gelgitleri dolunay ve yeni ay dönemlerinde gerçekleşir, daha yüksek gelgitler ve daha güçlü akıntılar oluşturur. Ayda iki kez gerçekleşir.
    - q: Neap Tide nedir?
      a: Neap gelgitleri çeyrek aylarda gerçekleşir. Gelgit aralığı daha küçüktür ve akıntılar daha zayıftır — yeni başlayanlar için iyidir.
    - q: Alçak gelgitler için tehlikeli SUPmi?
      a: Alçak gelgit kayaları ve resifleri ortaya çıkarabilir. Ayrıca dalga enerjisini daha dik kum barlarında yoğunlaştırır.
    - q: Gelgitler rip akımlarını nasıl etkiler?
      a: Çıkış gelgitleri (ebb dalgası) rip akıntılarını güçlendirir. Gelen gelgitler (sel) yırtılma gücünü azaltır.
