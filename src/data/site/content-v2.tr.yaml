- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm Wetsuit: Çoğu yeni başlayan soğuk suda yanlış yapan şeyler'
  description: Seans ortasında donmayı veya sahilde aşırı ısınmayı bırakın. 3mm ile 5mm wetsuitler arasındaki gerçek fark — sıcaklık tablosu, esneklik takasları ve soğuk su sörfünde gerçekten neyin işe yaradığı.
  definition: Dalış kıyafeti, vücut ısısının yalıtım için ısıttığı ince bir su tabakasını cilde hapseden neopren bir giysidir. Kalınlık (3mm, 5mm), takımın kaldırabileceği sıcaklık aralığını belirler — kalın daha sıcak ama daha az esnektir.
  tldr: Dalış kıyafeti kalınlığı doğrudan sıcaklık ve esnekliği belirler. 16°C'nin üzerindeki suda 3mm, 8°C ile 16°C arasındaki suda 5mm kullanın. Kalın takımlar hareketi kısıtlar ama sizi daha uzun süre sıcak tutar — her zaman marka yerine forma öncelik verin.
  problem: Bir online mağaza açarsınız ya da bir sörf dükkanına girersiniz ve 3/2, 4/3, 5/4 ve 5mm tam takım elbise etiketli wetsuitler görürsünüz. Rakamlar çok bir şey ifade etmez, ta ki yanlış kalınlığın ya seans ortasında donma ya da sahilde aşırı ısınıp terlemesi anlamına geldiğini fark edene kadar.
  explanation: Dalış kıyafetleri cildiniz ile neopren arasında ince bir su tabakası tutarak çalışır; vücudunuz o suyu ısıtır ve yalıtım oluşturur. Kalın neopren daha fazla suyu tutar ama esneklik ve yüzerlik kısıtlamasını engeller. 3mm (genellikle 3/2 ölçüsünde ince kollarla) hafif koşullara uygundurken, 5mm (5/4/3 veya tam 5mm) soğuk suya uygundur. Göğüs fermuarı girişleri, arka fermuardan daha iyi kapatar ve kızarmayı azaltır. Dikiş yapısı — yapıştırılmış ve kör dikişli (GBS) — sızdıran takım elbise ile sıcak olan arasındaki farktır.
  solution: Yerel su sıcaklığınıza 5°C hata payı ile kalınlığı eşleştirin. Tılıman iklimler için 3/2mm alın. Soğuk su için 5/4/3mm alın. Çizme, eldiven ve kapüşon ekleyin, böylece menzilinizi 5°C daha aşağıya doğru uzatın. Satın almadan önce takım elbise giyin veya cömert iade politikası olan bir marka seçin.
  recommendation: Paddle Board Overstock 5/4/3mm Wetsuit Pro, çoğu soğuk su sörfçüsü için idealdir; GBS dikişleri ve termal astarı sunar. 20°C'nin üzerindeki sıcak sularda sörf yaparsanız, göğüs fermuarlı 3/2mm daha iyi seçimdir.
  faq:
    - q: 5mm dölgiysi hangi su sıcaklığında gerekir?
      a: 8°C ile 14°C arasındaki su sıcaklıkları 5mm takım elbise gerektirir. 8°C'nin altında ise 6/5/4mm kapüşonlu bir takım elbise gerekir. 14°C ile 18°C arasında 4/3mm çoğu kişi için iyi olur.
    - q: Kışın 3mm wetsuit giyebilir miyim?
      a: Sadece suyun 16°C'nin üzerinde olduğu ılıman kış iklimlerinde. Gerçek kış sörfü için 5mm veya 5/4/3mm gereklidir. Botlar, eldivenler ve kapüşon, kalın gövdeye ihtiyaç duymadan eşdeğer sıcaklık sağlar.
    - q: Bir dalış kıyafeti ne kadar dar olmalı?
      a: Sıkı ama kısıtlayıcı değil. Hava cepleri veya gevşek neopren olmamalı. Parmağınızı cildiniz ile alt sırt takımı arasına kaydırabiliyorsanız, çok gevşek olur. Nefes almak zorluysa veya hareket kısıtlıysa, bedeninizi kullanabilirsiniz.
    - q: Pahalı dalış kıyafetleri sizi daha sıcak tutar mı?
      a: Daha yüksek fiyat genellikle daha iyi neopren (kireçtaşı bazlı petrol vs. petrol), daha iyi dikiş yapısı (GBS ve sadece yapıştırılmış yerde) ve daha iyi esneklik anlamına gelir. Bu faktörler doğrudan sıcaklık ve dayanıklılığı etkiler, ancak sadece uyum doğru olursa.
