- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard vs Shortboard (Kimsenin Vermediği Dürüst Cevap)
  description: Uzun tahtalar daha fazla dalga yakalar; kısa tahtalar daha sert döner. Asıl soru, hangisinin yeteneğinize ve yerel kırılmalara uyduğudur. Dürüst bir karşılaştırma, stabilite, dalga sayısı ve ilerleme tuzağı kapsıyor.
  definition: Uzun tahtalar (9ft+) stabilite ve dalga yakalama kolaylığına öncelik verir; kısa tahtalar (5-7ft) dik dalgalarda manevra kabiliyeti ve performansa öncelik verir. Doğru seçim, beceri seviyenize ve yerel dalga türlerinize bağlıdır.
  tldr: Longboardlar (9ft+) stabildir, dalgaları kolayca yakalar ve yeni başlayanlar ile seyir odaklı sörfçüler için uygundur. Kısa tahtalar (5-7ft) duyarlıdır, dalga yüzeyinde daha hızlı ve ileri düzey sörfçülere uygundur. Doğru seçim, beceri seviyenize, dalga tipinize ve sörfte en çok neyi sevdiğinize bağlıdır.
  problem: Kısa tahta üzerinde keskin dönüşler yaptığı ve burun boyunca zarifçe süzülen uzun sörfçülerin videolarını görüyorsunuz — ikisi de eğlenceli görünüyor. Sadece bir tahta türü için bütçeniz var ve hangi stilin hedeflerinize ve yerel kırmalara uyduğunu bilmeniz gerekiyor.
  explanation: 'Longboardların yüzey alanı daha fazladır, bu da daha hızlı kürek çekmeleri, dalgaları daha erken yakalamaları ve yürümek ile çapraz adımlar için sağlam bir platform sağladıkları anlamına gelir. Kısa tahtaların batacağı küçük, yavaş dalgalarda üstün olurlar. Kısa tahtalar daha az hacim ve daha agresif bir sallantıya sahiptir; bu da dalga yüzeyine daha derin inmelerine, dönüşlerde hız yaratmasına ve dik, boş bölümlere sığmalarına olanak tanır. Kısa tahtalar güçlü kürek çekme ve hassas dalga zamanlaması gerektirir. Yaygın bir yanlış anlama: kısa tahtalar "daha iyi" değildir — sadece farklı koşullar ve beceri seviyeleri için farklı araçlardır.'
  solution: Yeni başlayan biriyseniz, en az 6 ay boyunca longboard (veya yüksek hacimli şişme) sürebilirsiniz. Orta seviye sörfçüyseniz ve yerel dalgalarınız genellikle küçük ve yavaşsa, longboard veya hibrit daha fazla dalga yakalayacak ve daha eğlenceli olacaktır. Dalgalarınız dik, boş ve hızlıysa, kısa tahta cebine sığması için gereklidir. Birçok orta seviye sörfçü her ikisini de koruyor ve güne göre seçim yapar.
  recommendation: Paddle Board Overstock Longboard tarzı platformunuz olarak Surfboard Pro ile başlayın. Sürekli dönüş yapıp hız üretiyorsanız, dik dalga günleri için hibrit veya kısa tahta eklemeyi düşünün. Çok erken kısa boarda çalışmaya çalışan çoğu sörfçü hayal kırıklığına uğrar ve daha az dalga sürer.
  faq:
    - q: Longboard, kısa tahtaya göre sürmek daha mı kolay?
      a: Çok daha kolay. Longboardlar dalgaları daha erken yakalar, daha hızlı kürek çeker ve pop-up ile trim sırasında daha stabildir. Kısa tahtalar hassas zamanlama, daha güçlü kürek çekme ve daha iyi dalga değerlendirmesi gerektirir.
    - q: Longboard'da dönüşler yapabilir misin?
      a: Evet, ama tarzı farklı. Longboard dönüşleri daha geniş, daha akıcı ve tüm vücudu kapsar. Burun sürüşü, cutbacks ve hang-five, kendi yetenek gelişimi olan longboard'a özgü manevralardır.
    - q: Küçük dalgalar için hangi kart daha iyi?
      a: Uzun tahtalar ve hibritler küçük, zayıf dalgalarda daha iyi performans gösterir çünkü kayma üretir ve momentumu korurlar. Kısa tahtalar performans göstermek için daha dik ve güçlü dalgalara ihtiyaç duyar.
    - q: Kısa tahta kürek çekmek daha mı zor?
      a: Oldukça zor. Daha düşük hacim, tahtanın suda daha alçak durması ve daha fazla sürtünme yaratması anlamına gelir. Kısa tahta kürek çekmek, uzun tahtaya göre drag paraşütle yüzmek gibidir.
