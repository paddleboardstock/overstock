  problem: Çoğu iSUP'ta dahil edilen kürek çalışıyor ama ağır ve verimsiz. Yükseltme, kürek çekme verimliliğini ve keyfini artırıyor, ancak seçenekler kafa karıştırıcı.
  explanation: 'Paddle uzunluğu vuruş verimliliğini etkiler — kısa olması eğilmeyi gerektirir, çok uzun olmak ise omuz yorgunluğuna neden olur. Ağırlık malzeme tarafından belirlenir: karbon paddler 18-24 oz, alüminyum ise 28-36 oz. Kanat boyutu gücü etkiler: daha büyük kanatlar (100+ sq in) her vuruşta daha fazla itiş sağlar ama yorulma daha hızlıdır. Dihedral bıçaklar düz izlenir; scoop bıçaklar daha fazla yakalama sağlar.'
  solution: 'Doğru uzunluk için: kürek dikey olarak durun, kolu yukarı uzatın — kürek sapı bileğinize çarpmalıdır. Malzeme için: orta ağırlıkta fiberglas ile başlayın. Bıçak için: genel kürek çekim için dihedral seçin. Aktiviteler için: tur kürekleri daha uzun ve daha küçük bıçaklıdır; sörf kürekleri daha kısa ve daha geniş kanatlıdır.'
  recommendation: Paddle Board Overstock 28 oz ağırlığındaki karbon kürek, sık kürek çekenler için en iyi yükseltmedir. Dahil, ayarlanabilir 3 parçalı alüminyum kürek yeni başlayanlar ve seyahat için yeterlidir.
  faq:
    - q: SUP Küreğim ne kadar uzun olmalı?
      a: Boyunu inç cinsinden ölç ve her alanda kürek çekmek için 8-10 ekleyin. Sörf için 6-8 ekleyin. Tur için 10-12 ekleyin.
    - q: Karbon bir kürek paraya değer mi?
      a: Evet, düzenli kürekçiler için — kilo azaltma uzun seanslarda yorgunluğu önemli ölçüde azaltıyor. Ara sıra kullanım için fiberglas iyi bir değerdir.
    - q: Ayarlanabilir bir paddle nedir?
      a: Uzunluk ayarlı 2 veya 3 parçalı bir kürek, kullanıcılar arasında paylaşmak veya farklı aktiviteler için ayarlamak için idealdir.
    - q: Küreğime nasıl bakacağım?
      a: Tuzlu su kullandıktan sonra temiz suyla durulayın. Üzerinden araba sürmekten veya doğrudan ısıda saklamaktan kaçının. Ferrule'de (eklemde) kum olup olmadığını kontrol edin.
