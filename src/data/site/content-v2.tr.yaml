    - q: Uçuşlar sırasında hasarı nasıl önlerim?
      a: Tahtayı gevşekçe çantaya yerleştirin. Yüzgeçleri ve sert nesneleri giysilere sarılmış şekilde ortaya yerleştirin. Çantayı kırılgan olarak etiketleyin.
