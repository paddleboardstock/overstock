origin:
  tagline: 'Náš původ'
  heading: "Postaveno na vodě,<br />\n<span class=\"text-sky-600\">vedeno posláním</span>"
  paragraphs:
    - 'Aquafarer začala v pobřežní dílně s jednou lodí a tvrdošíjným přesvědčením: námořní produkty by měly být konstruovány, jako by na nich záleželo — protože záleží.'
    - 'Naši zakladatelé, dva námořní architekti, viděli obor, ve kterém se šetří na úkor kvality, materiály se degradují a bezpečnost se řeší jen jako zaškrtávací políčko. První trup Aquafarer nepostavili pro zisk, ale aby dokázali, že dostupné námořní vybavení může být skutečně spolehlivé.'
    - 'Ten první trup je v provozu dodnes. A tento princip se nikdy nezměnil.'
    - 'Nejsme největším výrobcem. Nevyrábíme nejlevnější produkty. Ale každý trup, který opustí naši dílnu, prochází stejnýma rukama, které společnost založily — a splňuje stejný standard, který stanovil první trup.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Pobřežní dílna Aquafarer'

philosophy:
  tagline: 'Naše filozofie'
  heading: 'Zakořeněni v oceánu'
  description: 'Oceán není naše pracoviště. Je náš učitel. Každé designové rozhodnutí začíná pochopením toho, jak se voda chová, jak se podmínky mění a jak musí vybavení reagovat.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respekt k vodě'
      description: 'Voda je nevypočitatelná. Naše produkty konstruujeme pro nejhorší podmínky, ne pro ty nejlepší. Pokud trup zvládne silný přílivový proud, zvládne i jezero. Pokud záchranná vesta funguje na širém moři, je pro řeku předimenzovaná — a to je záměr.'
    - emoji: "\U0001F527"
      title: 'Postaveno, aby vydrželo, ne aby se vyměňovalo'
      description: 'Nejudržitelnější produkt je ten, který není potřeba vyměňovat. Námořní PVC, Hypalon a drop-stitch konstrukci volíme pro jejich dlouhou životnost. Dodnes expedujeme náhradní díly k trupům, které jsme vyrobili před deseti lety.'
    - emoji: "\U0001F3C6"
      title: 'Dostupné díky designu'
      description: 'Vodní sporty by neměly být luxusem. Konstruujeme produkty, které nabízejí profesionální výkon za cenu, která dává smysl pro rodiny, průvodce a malé provozovatele — ne jen pro komerční flotily.'

design:
  tagline: 'Designová filozofie'
  heading: "Konstruováno pro hranici<br />\n<span class=\"text-sky-600\">podmínek</span>"
  paragraphs:
    - 'Každý produkt Aquafarer začíná jednou otázkou: <em>jaká je nejhorší podmínka, které bude muset čelit?</em> Navrhujeme od okraje do středu, ne od středu ven.'
    - 'Naše drop-stitch jádra jsou dimenzována na 15 PSI — ne protože by 12 PSI nestačilo na jezero, ale protože prkno na 15 PSI zvládne náhlé vlnobití bez prohýbání. Naše Hypalon trubky jsou specifikovány pro komerční odolnost vůči UV záření — ne proto, že by každý zákazník pádloval v tropech, ale protože UV degradace je nejčastější příčinou předčasného selhání.'
    - 'Nenavrhuujeme na cenovku. Navrhujeme k bodu selhání — a stavíme výrazně nad něj.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Design a inženýrství Aquafarer'
  stats:
    - value: '15'
      label: 'PSI jádro<br />dimenzování'
    - value: '1 500+'
      label: 'UV hodin<br />testováno'
    - value: '10 let'
      label: 'životnost<br />trupu'
