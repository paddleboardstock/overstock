cards:
  - badge: PVC
    title: Marine-Grade PVC Layer
    description: Maramihang patong na laminated na PVC na tela na sumusukat para sa mga marine na kapaligiran. Sinubok para sa UV, paglaban sa gasgas, at butas.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch Core
    description: Libu-libong panloob na sinulid ang nag-uugnay sa itaas at ibabang mga patong, na lumilikha ng matigas, mataas na presyon na istruktura sa 12–15 PSI.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - badge: RR
    title: Pinalakas na Rail Edge
    description: Dobleng patong na fusion-welded na rail na nagbibigay proteksyon laban sa gasgas sa pantalan, paglapag sa dalampasigan, at mga talim na bahagi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
