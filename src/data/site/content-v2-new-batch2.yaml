- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Paddle Board Size Guide: Volume, Length, and Width for Every Rider'
  description: 'Complete paddle board sizing with volume recommendations by weight and activity. Includes an easy-to-use size chart for all-around, touring, surfing, and yoga SUP boards.'
  definition: 'Paddle board size is determined by volume (weight capacity and float), length (speed and tracking), width (stability), and thickness (volume distribution and wind resistance).'
  tldr: 'Use weight to find minimum volume: 50-70 kg needs 220-260L, 70-90 kg needs 260-300L, 90-110 kg needs 300-350L, 110+ kg needs 350+L. For beginners, add 20% to these numbers. Width matters: 32" is intermediate, 33-34" is beginner-friendly, 35"+ is very stable.'
  problem: 'Paddle board size listings use feet, inches, and liters interchangeably, making it difficult to compare across brands.'
  explanation: "Volume is the most direct metric for weight capacity — 1 liter of freshwater displaces 1 kg of weight. A board with 260L can theoretically support 260 kg, but practical capacity is lower because the board needs to sit above the water. Your total weight (body plus gear) should be 30-40% of the board's volume."
  solution: 'Target volume = (body weight in kg + gear weight in kg) x 3. For a 75 kg paddler with 5 kg gear, target = 80 x 3 = 240L minimum. For beginners, multiply by 3.5. For advanced, multiply by 2.5.'
  recommendation: 'The Paddle Board Overstock SUP Explorer 11 (260L, 11'' x 33" x 6") suits most riders 50-100 kg. Lighter riders can size to the AirDeck 270. Heavier riders should look at the SUP Tour 12 (300L+) or wider boards.'
  faq:
    - q: Does height matter for SUP sizing?
      a: Height matters less than weight. A tall lightweight rider needs less volume than a short heavy rider. Use weight as your primary volume determinant.
    - q: What happens with too much volume?
      a: The board sits too high, catching wind like a sail. It feels corky in chop. However, for beginners, extra volume is better than too little.
    - q: What happens with too little volume?
      a: The board sits too deep, creating drag. The nose may submerge during paddling (pearling). You tire quickly from paddling a partially submerged board.
    - q: Do inflatable boards need different sizing than hard boards?
      a: Not significantly. Inflatables at 15+ PSI displace water similarly to hard boards. Volume recommendations apply equally to both types.
