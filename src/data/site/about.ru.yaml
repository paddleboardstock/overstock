origin:
  tagline: 'Наше происхождение'
  heading: "Создано на воде,<br />\n<span class=\"text-sky-600\">движимое целью</span>"
  paragraphs:
    - 'Paddle Board Overstock начался в прибрежной мастерской с одной лодки и упрямого убеждения: морские продукты должны создаваться так, будто они имеют значение — потому что так и есть.'
    - 'Наши основатели, два судостроителя, видели отрасль, где экономили на всём, использовали дешёвые материалы и относились к безопасности как к формальности. Они построили первый корпус Paddle Board Overstock не ради прибыли, а чтобы доказать: доступное морское снаряжение может быть по-настоящему надёжным.'
    - 'Тот первый корпус до сих пор в строю. Этот принцип никогда не менялся.'
    - 'Мы не самый крупный производитель. Мы не делаем самых дешёвых продуктов. Но каждый корпус, покидающий нашу мастерскую, проходит через те же руки, что основали компанию, — и соответствует тому же стандарту, который задал первый корпус.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: 'Прибрежная мастерская Paddle Board Overstock'

philosophy:
  tagline: 'Наша философия'
  heading: 'Укоренённые в океане'
  description: 'Океан — не наше рабочее место. Он наш учитель. Каждое проектное решение начинается с понимания того, как ведёт себя вода, как меняются условия и как должно реагировать снаряжение.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Уважение к воде'
      description: 'Вода непредсказуема. Наши продукты созданы для худших условий, а не для лучших. Если корпус выдерживает риповое течение, он выдержит и озеро. Если спасательный жилет работает в открытом море, для реки он избыточно надёжен — и это сделано намеренно.'
    - emoji: "\U0001F527"
      title: 'Создано, чтобы служить, а не заменяться'
      description: 'Самый экологичный продукт — тот, который не нужно заменять. Морской ПВХ, гипалон и конструкция drop-stitch выбраны ради долговечности. Мы до сих пор поставляем запчасти для корпусов, построенных десять лет назад.'
    - emoji: "\U0001F3C6"
      title: 'Доступность по замыслу'
      description: 'Водный спорт не должен быть роскошью. Мы создаём продукты с профессиональными характеристиками по цене, разумной для семей, гидов и небольших операторов — а не только для коммерческих флотов.'

design:
  tagline: 'Философия дизайна'
  heading: "Создано на пределе<br />\n<span class=\"text-sky-600\">условий</span>"
  paragraphs:
    - 'Каждый продукт Paddle Board Overstock начинается с одного вопроса: <em>с какими худшими условиями он столкнётся?</em> Мы проектируем от края к центру, а не от центра к краю.'
    - 'Наши drop-stitch-сердечники рассчитаны на 15 PSI — не потому, что 12 PSI недостаточно для озера, а потому, что доска на 15 PSI выдерживает внезапную рябь без прогиба. Наши трубы из гипалона рассчитаны на коммерческую УФ-стойкость — не потому, что каждый клиент плавает в тропиках, а потому, что УФ-деградация — причина №1 преждевременных отказов.'
    - 'Мы не проектируем под цену. Мы проектируем до предела прочности — а затем строим с большим запасом.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: 'Дизайн и инженерия Paddle Board Overstock'
  stats:
    - value: '15'
      label: 'PSI-рейтинг<br />сердечника'
    - value: '1,500+'
      label: 'УФ-часов<br />испытаний'
    - value: '10 лет'
      label: 'срок службы<br />корпуса'
