business_model:
  tagline: Наша бизнес-модель
  heading: Запасы запасов, продаётся напрямую с завода
  paragraphs:
    - Paddle Board Overstock продаёт совершенно новые SUP надувные доски по избытку и ценам при распродаже — до 60% от обычной розничной скидки. Мы закупаем излишки и избыточные запасы в объёме, а затем передаём сэкономленные данные гребцам и мелким ритейлерам.
    - 'Помимо розничных продаж, мы обслуживаем мелких ритейлеров с оптовыми товарами смешанной модели: заказываем 5–20 досок, смешиваем любые модели в одной партии и оплачиваем оптовый уровень за общий объём. Каждый заказ отправляется напрямую из Вэйхая, Китай.'
sourcing:
  tagline: Откуда берётся наш избыток запасов
  heading: Смешанные источники — один стандарт качества
  paragraphs:
    - 'Наши запасы поступают из двух источников: излишковы производственные партии из собственных производственных предприятий Weihai и выбранные избыточные запасы, полученные от других производственных партнёров, с которыми мы проводим аудит и работаем напрямую.'
    - Каждая плата, которую мы продаём, совершенно новая и не использована. Избыток относится к цене, но никогда не к состоянию.
manufacturing:
  tagline: Наш опыт в производстве
  heading: Строится в Вэйхае с 2012 года
  paragraphs:
    - SUP С 2012 года мы производим надувные плиты в Вэйхае, провинция Шаньдун. Наш производственный комплекс площадью 12 000 м² ежегодно выпускает 15 000 надувных блоков с командой из 200–300 работников и 14+ инженеров по НИОКР.
    - 'Один принцип проектирования не изменился с момента первой платы: мы проектируем до точки отказа, а затем строим значительно выше неё.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock здание завода в Вэйхае
  stats:
    - value: '2012'
      label: Производство с тех пор
    - value: 12 000 м²
      label: Производственный объект
    - value: 15,000
      label: Единиц в год
    - value: 14+
      label: Инженеры по исследованиям и разработкам
inspection:
  tagline: Как мы проверяем каждую SUP доску
  heading: Каждая плата протестирована, а не сэмплирована
  paragraphs:
    - Каждая SUP плата проходит 100% испытания под давлением в 1,25 раза выше номинального давления в течение 24–48 часов до одобрения на продажу. Платы, которые выходят из строя, никогда не отправляются.
    - 99,3% плат проходят финальную проверку с первого раза. Оставшаяся часть ремонтируется или откладывается в сторону — никогда не списывается в заказ.
why_prices_lower:
  tagline: Почему наши цены ниже
  heading: Экономика избытка запасов, а не экономия на углах
  paragraphs:
    - 'Наши цены ниже по структурным причинам: мы продаём избыток и излишки товаров напрямую у Weihai, без розничных наценок, без дистрибьюторских слоев и без затрат на выставочный зал.'
    - Сами платы выполнены на уровне полного производства — те drop-stitch же сердечники, те же морские PVCиспытания, такие же, как и в розничной цене.
shipping_network:
  tagline: Наша международная судоходная сеть
  heading: Экспресс-авиаперевозки или объединённые морские перевозки
  paragraphs:
    - Заказы поступают из Вэйхая, Китай. Экспрессные авиаперевозки перевозят образцы и 1–3 заказа на борт; Consolidated Sea Freight обслуживает 5–20 оптовых заказов на борт в 50+ стран.
    - В каждой смете есть оценка транзита для вашего пункта назначения, а также коммерческий счет и список упаковки, необходимые для таможенного оформления.
  cards:
    - title: Экспресс авиационная доставка
      description: Для образцов и заказов от 1 до 3 плат — быстрая доставка до вашей двери, стоимость указывается для каждого пункта назначения.
    - title: Сборная морская доставка
      description: Для оптовых заказов от 5 до 20 плат — экономичная доставка в крупные порты, стоимость указывается для каждого пункта назначения.
warranty_support:
  tagline: Гарантия и поддержка клиентов
  heading: 2-летняя гарантия SUP на каждую плату
  paragraphs:
    - Каждая плата отправляется с 2-летней гарантией SUP. Если в течение гарантийного срока появится покрытый дефект, свяжитесь с нашей службой поддержки, и мы решим проблему.
    - Поддержка осуществляется той же командой, которая обрабатывает ваш заказ. Свяжитесь с нами в любое время через контактную форму или ответив на подтверждение вашего заказа.
