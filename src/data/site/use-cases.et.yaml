cases:
  - id: beginner
    title: Algajate sõudmine
    desc: Stabiilsed täispuhutavad SUP lauad esmakordselt sõudjatele.
    scenario: Pere, kes külastab nädalavahetuseks järve, soovib proovida aerulauda. Nad vajavad stabiilset, hõlpsasti käivitatavat varustust koos selgete ohutusjuhistega.
    solution: SUP Explorer 11 tagab algajatele laia kerega stabiilsuse. Life Vest Classic kindlustab CE-sertifitseeritud ujuvuse. Oars & Pump Set täidab lauad alla 10 minutiga.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Ringreisid ja avastamine
    desc: Pika vahemaa täispuhutavad SUP lauad järvedeks, jõgedeks ja rannikureisideks.
    scenario: Välitegevusi harrastav inimene plaanib nädalase sõudmisreisi ja vajab lauda, mis pakitakse väikeseks, täidab lõkkekoha juures ja liigub sirgelt avavees.
    solution: Ocean Voyager Series libiseb tõhusalt turismikujulise kontuuriga ja hoiab kursi tuule ja lainetuse korral. Selle drop-stitch konstruktsioon täitub kuni 15 PSI peale, et tagada kõva lauakõvadus.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Jooga ja fitness
    desc: Erakordselt laiad, stabiilsed platvormid jooga, fitnessi ja lõõgastumise jaoks.
    scenario: Jooga harrastaja soovib ujuvat stuudiot hommikusteks sessioonideks rahulikul vees, piisavalt tekipinda igaks joogapoosiks.
    solution: Flowing Lotus Series omab täispikkust tekipadjandit ja laia laeva, mis tagab kõigutuskindlad poosid. Samuti toimib see stabiilse platvormina kergeks treeninguks.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Pere meelelahutus
    desc: Täielikud SUP paketid nädalavahetuse järvepäevadeks ja puhkusteks.
    scenario: Neljaliikmeline pere soovib stabiilseid laudu nädalavahetuse järvekäikudeks ja rannapuhkusteks — varustus, mis mahub autosse ja täitub minutitega.
    solution: Tropical Breeze Series on stabiilne mitmekülgne lau, mida kogu pere saab jagada, samas kui Medusa Glow Series on kergem ja lühem lastele. Mõlemad mahuvad hõlpsasti koolikotti reisimiseks.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
