cases:
  - id: beginner
    title: Algajate veespordivarustus
    desc: Stabiilsed SUP lauad ja kajakid esmakordsetele kasutajatele.
    scenario: Pere, kes külastab nädalavahetuseks järve, soovib proovida aerulauda. Nad vajavad stabiilset, hõlpsasti käivitatavat varustust koos selgete ohutusjuhistega.
    solution: SUP Explorer 11 tagab algajatele laia kere stabiilsuse. Life Vest Classic tagab CE-sertifikaadiga ujuvuse. Dual-Action Pump täidab mõlemad lauad vähem kui 10 minutiga.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Väliseiklused
    desc: Kaasaskantavad kajakid ja paadid jõgedele, järvedele ja rannikuretkele.
    scenario: Välispordi entusiast plaanib nädalapikkust jõeekskursiooni ja vajab paati, mis mahub väikesesse kotti, täitub laagris ja talub erinevaid voolusid.
    solution: Kayak Lite mahub seljakotti ja täitub vähem kui 4 minutiga. Selle drop-stitch ehitus talub järvi, aeglasi jõesid ja rannikutel sõitmist.
    products:
      - Täidetav Kayak Lite
      - Süsinikpõhine aer
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: Professionaalsed tegevused
    desc: Kommerts-klass RIBs turismiettevõtjatele ja hädaolukorra reageerimiseks.
    scenario: Rannikul turismiettevõtja vajab vastupidavate paatide laeva, mis sõidab iga päev erinevates mereoludes ja vastab kommerts-ohutusnõuetele.
    solution: RIB 330 ja RIB 450 Patrol kasutavad klaaskiust sügav-V tüüpi põhja Hypalon torudega, et tagada ilmastikukindlus. Mitut üksust saab kasutada ühtse jõudlusega.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: Pere meelelahutus
    desc: Ruumikad paadid päevaretkedeks, kalastamiseks ja veespordi tarbeks.
    scenario: Neljaliikmeline pere soovib stabiilset paati nädalavahetuse järveretkedeks, kalastamiseks ja laste toru vedamiseks.
    solution: AirDeck 360 mahutab kuni viis inimest, sellel on tugevdusõhupõrand. See täitub stardipaigas, mahub autosse ja talub nii rahulikke järvi kui ka kaitstud rannikumere.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
