cases:
  - id: beginner
    title: Начинающий в паддлинге
    desc: Стабильные надувные SUP доски для начинающих гребцов.
    scenario: Семья, приезжающая на озеро на выходные, хочет попробовать паддлбординг. Им нужно стабильное оборудование, которое легко запускать, с понятными инструкциями по безопасности.
    solution: SUP Explorer 11 обеспечивает широкую устойчивость для новичков. Life Vest Classic гарантирует плавучесть с сертификацией CE. Oars & Pump Set надувает доску менее чем за 10 минут.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Туризм и исследование
    desc: Длинные надувные SUP доски для озер, рек и прибрежных путешествий.
    scenario: Любитель активного отдыха планирует недельное путешествие на доске и ему нужна доска, которая компактно складывается, надувается на стоянке и держит курс на открытой воде.
    solution: Ocean Voyager Series скользит эффективно благодаря туринговой форме и удерживает курс при ветре и волнении. Конструкция drop-stitch надувается до 15 PSI для жесткости, как у твердой доски.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Йога и фитнес
    desc: Очень широкие, устойчивые платформы для йоги, фитнеса и отдыха.
    scenario: Практикующий йогу хочет плавающую студию для утренних занятий на спокойной воде, с достаточной площадью палубы для выполнения всех асан.
    solution: Flowing Lotus Series оснащена полноразмерным настилом и широкой балкой для устойчивых поз. Она также служит стабильной платформой для легких фитнес-тренировок.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Семейный отдых
    desc: Полные SUP комплекты для выходных на озере и отпусков.
    scenario: Семья из четырех человек хочет стабильные доски для выходных на озере и пляжного отдыха — снаряжение, которое помещается в машину и надувается за несколько минут.
    solution: Tropical Breeze Series — это устойчивая универсальная доска, которой может пользоваться вся семья, а Medusa Glow Series легче и короче — для детей. Обе доски помещаются в рюкзаки для удобных поездок.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
