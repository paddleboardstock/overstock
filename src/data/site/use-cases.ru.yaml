cases:
  - id: beginner
    title: 'Водные виды спорта для новичков'
    desc: 'Стабильные SUP-борды и каяки для первых выходов.'
    scenario: >-
      'Семья, приезжающая на озеро на выходные, хочет попробовать сап-сёрфинг. Им нужно стабильное снаряжение, которое легко спустить на воду, с понятными инструкциями по безопасности.'
    solution: >-
      'SUP Explorer 11 обеспечивает широкую стабильную платформу для новичков. Life Vest Classic гарантирует спасательный эффект с сертификатом CE. Насос двойного действия надувает оба борда менее чем за 10 минут.'
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 'Исследования на природе'
    desc: 'Портативные каяки и лодки для рек, озёр и прибрежных походов.'
    scenario: >-
      'Любитель активного отдыха планирует недельный сплав по реке и нуждается в лодке, которая компактно упаковывается, надувается в лагере и справляется с переменным течением.'
    solution: >-
      'Kayak Lite помещается в рюкзак и надувается менее чем за 4 минуты. Конструкция drop-stitch справляется с озёрами, спокойными реками и прибрежной греблей.'
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: 'Профессиональная эксплуатация'
    desc: 'Коммерческие RIB для туроператоров и аварийных служб.'
    scenario: >-
      'Прибрежному туроператору нужен флот прочных лодок для ежедневных выходов при меняющихся морских условиях с соблюдением коммерческих норм безопасности.'
    solution: >-
      'RIB 330 и RIB 450 Patrol оснащены стеклопластиковыми корпусами с глубокой V-образной формой и баллонами Hypalon для долговечности в любую погоду. Можно разворачивать несколько единиц со стабильными характеристиками.'
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: 'Семейный отдых'
    desc: 'Просторные лодки для однодневных поездок, рыбалки и водных развлечений.'
    scenario: >-
      'Семья из четырёх человек хочет стабильную лодку для выездов на озеро по выходным, рыбалки и катания детей на буксируемом круге.'
    solution: >-
      'AirDeck 360 вмещает до пяти человек и имеет усиленный надувной пол. Он надувается на месте спуска, помещается в машину и подходит как для спокойных озёр, так и для защищённых прибрежных вод.'
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
