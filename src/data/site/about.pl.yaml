origin:
  tagline: 'Nasze początki'
  heading: "Zbudowane na wodzie,<br />\n<span class=\"text-sky-600\">napędzane celem</span>"
  paragraphs:
    - 'Aquafarer zaczęło się w nadmorskim warsztacie od jednej łodzi i upartego przekonania: produkty marine powinny być projektowane tak, jakby miały znaczenie — bo mają.'
    - 'Nasi założyciele, dwaj architekci okrętowi, widzieli branżę, w której oszczędzano na wszystkim, pogarszano materiały i traktowano bezpieczeństwo jak formalność. Zbudowali pierwszy kadłub Aquafarer nie dla zysku, lecz po to, by udowodnić, że przystępne cenowo wyposażenie marine może być naprawdę niezawodne.'
    - 'Ten pierwszy kadłub służy do dziś. Ta zasada nigdy się nie zmieniła.'
    - 'Nie jesteśmy największym producentem. Nie tworzymy najtańszych produktów. Ale każdy kadłub, który opuszcza nasz warsztat, przechodzi przez te same ręce, które założyły firmę — i spełnia ten sam standard, który wyznaczył pierwszy kadłub.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Nadmorski warsztat Aquafarer'

philosophy:
  tagline: 'Nasza filozofia'
  heading: 'Zakorzenieni w oceanie'
  description: 'Ocean nie jest naszym miejscem pracy. Jest naszym nauczycielem. Każda decyzja projektowa zaczyna się od zrozumienia, jak zachowuje się woda, jak zmieniają się warunki i jak musi reagować sprzęt.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Szacunek dla wody'
      description: 'Woda jest nieprzewidywalna. Nasze produkty są projektowane na najgorsze warunki, nie na najlepsze. Jeśli kadłub radzi sobie z silnym prądem, poradzi sobie też z jeziorem. Jeśli kamizelka ratunkowa działa na pełnym morzu, dla rzeki jest zaprojektowana z zapasem — i to celowo.'
    - emoji: "\U0001F527"
      title: 'Zbudowane, by przetrwać, nie by wymieniać'
      description: 'Najbardziej zrównoważony produkt to taki, którego nie trzeba wymieniać. Morski PVC, Hypalon i konstrukcja drop-stitch są wybierane ze względu na trwałość. Nadal wysyłamy części zamienne do kadłubów, które zbudowaliśmy dekadę temu.'
    - emoji: "\U0001F3C6"
      title: 'Dostępne z założenia'
      description: 'Sporty wodne nie powinny być luksusem. Projektujemy produkty o profesjonalnych osiągach w cenie, która ma sens dla rodzin, przewodników i małych operatorów — nie tylko dla flot komercyjnych.'

design:
  tagline: 'Filozofia projektowania'
  heading: "Zaprojektowane na krawędzi<br />\n<span class=\"text-sky-600\">warunków</span>"
  paragraphs:
    - 'Każdy produkt Aquafarer zaczyna się od jednego pytania: <em>jakie najgorsze warunki będzie musiał znosić?</em> Projektujemy od krawędzi do środka, a nie od środka na zewnątrz.'
    - 'Nasze rdzenie drop-stitch mają rating 15 PSI — nie dlatego, że 12 PSI to za mało na jezioro, lecz dlatego, że deska 15 PSI znosi nagłą falę bez uginania. Nasze komory Hypalon mają komercyjną odporność na UV — nie dlatego, że każdy klient pływa w tropikach, lecz dlatego, że degradacja UV to przyczyna nr 1 przedwczesnych awarii.'
    - 'Nie projektujemy pod cenę. Projektujemy do granicy awarii — a potem budujemy z dużym zapasem ponad nią.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Projektowanie i inżynieria Aquafarer'
  stats:
    - value: '15'
      label: 'rating rdzenia<br />PSI'
    - value: '1,500+'
      label: 'godzin testów<br />UV'
    - value: '10 lat'
      label: 'żywotność<br />kadłuba'
