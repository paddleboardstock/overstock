business_model:
  tagline: Nasz model biznesowy
  heading: Zapasy nadmiarowe, sprzedawane bezpośrednio z fabryki
  paragraphs:
    - Paddle Board Overstock Sprzedaje zupełnie nowe SUP nadmuchiwane deski po cenach nadwyżkowych i wyprzedażowych — nawet do 60% poniżej standardowej sprzedaży detalicznej. Pozyskujemy nadwyżki i zapasy w dużej ilości, a następnie przekazujemy oszczędności kajakarzom i małym detalistom detalicznym.
    - 'Oprócz sprzedaży detalicznej obsługujemy małych detalistów hurtowo modeli mieszanych: zamawiamy 5–20 desek, mieszamy dowolne modele w jednej dostawie i płacimy hurtową warstwę za całkowitą ilość. Każde zamówienie wysyłane jest bezpośrednio z Weihai w Chinach.'
sourcing:
  tagline: Skąd pochodzą nasze zapasy nadwyżkowe
  heading: Mieszane źródła, jeden standard jakości
  paragraphs:
    - 'Nasze zapasy pochodzą z dwóch źródeł: nadwyżek partii produkcyjnych z naszych własnych zakładów Weihai oraz wybranych nadwyżkowych zapasów pozyskanych od innych partnerów produkcyjnych, z którymi audytujemy i współpracujemy bezpośrednio.'
    - Każda deska, którą sprzedajemy, jest zupełnie nowa i nieużywana. Nadmiar oznacza cenę — nigdy stan.
manufacturing:
  tagline: Nasze doświadczenie w produkcji
  heading: Budowany w Weihai od 2012 roku
  paragraphs:
    - Od SUP 2012 roku produkujemy nadmuchiwane deski w Weihai, Shandong. Nasz zakład produkcyjny o powierzchni 12 000 m² wytwarza rocznie 15 000 nadmuchiwanych jednostek rocznie, pracując zespołem 200–300 pracowników i 14+ inżynierów badawczo-rozwojowych.
    - 'Jedna zasada projektowania nie zmieniła się od czasu pierwszej płyty: projektujemy do punktu awarii, a potem budujemy go znacznie powyżej.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock Budynek fabryki w Weihai
  stats:
    - value: '2012'
      label: Produkcja od tego czasu
    - value: 12 000 m²
      label: Zakład produkcyjny
    - value: 15,000
      label: Jednostki na rok
    - value: 14+
      label: Inżynierowie ds. badań i rozwoju
inspection:
  tagline: Jak sprawdzamy SUP każdą tablicę
  heading: Każda deska była testowana, nie próbkowana
  paragraphs:
    - Każda SUP deska jest w 100% testowana na ciśnienie 1,25 razy normy przez 24–48 godzin przed zatwierdzeniem sprzedaży. Deski, które nie są uszkodzone, nigdy nie są wysyłane.
    - 99,3% rad przechodzi ostateczną inspekcję za pierwszym razem. Pozostała część jest naprawiana lub odkładana na bok — nigdy nie jest wliczana do zamówienia.
why_prices_lower:
  tagline: Dlaczego nasze ceny są niższe
  heading: Ekonomia nadmiaru, a nie cięcia na skróty
  paragraphs:
    - 'Nasze ceny są niższe ze względów strukturalnych: sprzedajemy nadwyżki i zapasy bezpośrednio z Weihai, bez naliczek detalicznych, bez nakładek dystrybutorów i bez kosztów w salonie.'
    - Same płyty są w pełni produkcyjne — te same drop-stitch rdzenie, ta sama jakość morskaPVC, te same testy co w pełnej cenie detalicznej.
shipping_network:
  tagline: Nasza Międzynarodowa Sieć Żeglugowa
  heading: Ekspresowe lotnictwo lub skonsolidowany transport morski
  paragraphs:
    - Zamówienia wysyłane są z Weihai w Chinach. Express air cargo przewozi próbki oraz zamówienia na 1–3 pokłady; Consolidated Sea Freight obsługuje zamówienia hurtowe na 5–20 pokładów do 50+ krajów.
    - Każda wycena zawiera szacunkowy koszt transportu docelowego oraz fakturę komercyjną i listę pakowania wymaganą do odprawy celnej.
  cards:
    - title: Ekspresowy Transport Lotniczy
      description: Dla próbek i zamówień na 1–3 deski — szybka dostawa pod wskazany adres, koszt podawany według miejsca docelowego.
    - title: Skonsolidowany Transport Morski
      description: Dla zamówień hurtowych na 5–20 desek — ekonomiczna wysyłka do głównych portów, koszt podawany według miejsca docelowego.
warranty_support:
  tagline: Gwarancja i Obsługa Klienta
  heading: 2-letnia SUP gwarancja na każdą deskę
  paragraphs:
    - Każda deska wysyłana jest z 2-letnią SUP gwarancją. Jeśli w okresie gwarancyjnym pojawi się objęta nią wada, skontaktuj się z naszym zespołem wsparcia, a my to naprawimy.
    - Wsparcie jest obsługiwane przez ten sam zespół, który zarządza Twoim zamówieniem. Skontaktuj się z nami w dowolnym momencie za pomocą formularza kontaktowego lub odpowiadając na potwierdzenie zamówienia.
