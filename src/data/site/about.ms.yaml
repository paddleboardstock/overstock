origin:
  tagline: Asal Usul Kami
  heading: |-
    Dibina di atas air,<br />
    <span class="text-sky-600">didorong oleh tujuan</span>
  paragraphs:
    - 'Paddle Board Overstock bermula di sebuah bengkel tepi pantai dengan sebuah bot dan satu kepercayaan yang degil: produk marin harus direkayasa seolah-olah ia penting — kerana ia memang penting.'
    - Pengasas kami, dua arkitek laut, melihat sebuah industri di mana potongan jalan diambil, bahan diturunkan kualitinya, dan keselamatan dianggap sebagai satu kotak centang. Mereka membina kapal Paddle Board Overstock pertama bukan untuk keuntungan, tetapi untuk membuktikan bahawa peralatan marin yang berpatutan juga boleh dipercayai dengan tulen.
    - Hull pertama itu masih berkhidmat hingga hari ini. Prinsip itu tidak pernah berubah.
    - Kami bukan pengeluar terbesar. Kami tidak menghasilkan produk yang paling murah. Tetapi setiap hull yang keluar dari bengkel kami melalui tangan yang sama yang memulakan syarikat ini — dan memenuhi standard yang sama yang ditetapkan oleh hull pertama.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock bengkel pesisir
philosophy:
  tagline: Falsafah Kami
  heading: Bercambah di lautan
  description: Laut bukan tempat kerja kita. Ia adalah guru kita. Setiap keputusan reka bentuk bermula dengan memahami bagaimana air bertindak, bagaimana keadaan berubah, dan bagaimana peralatan mesti bertindak balas.
  cards:
    - emoji: 🌊
      title: Hormati Air
      description: Air adalah tidak dapat diramalkan. Produk kami direka untuk keadaan terburuk, bukan yang terbaik. Jika satu badan kapal boleh menahan arus deras, ia akan menahan tasik. Jika jaket keselamatan berfungsi di luar pesisir, ia direka berlebihan untuk sungai — dan itu adalah sengaja.
    - emoji: 🔧
      title: Dibina untuk Tahan Lama, Bukan untuk Diganti
      description: Produk yang paling lestari adalah yang tidak perlu diganti. Pembinaan gred marin PVC, Hypalon, dan drop-stitch dipilih untuk ketahanan. Kami masih menghantar alat ganti untuk kapal yang kami bina sepuluh tahun lalu.
    - emoji: 🏆
      title: Boleh Diakses Mengikut Reka Bentuk
      description: Sukan air tidak sepatutnya menjadi kemewahan. Kami merancang produk yang memberikan prestasi setanding profesional pada harga yang masuk akal untuk keluarga, pemandu, dan operator kecil — bukan hanya untuk armada komersial.
design:
  tagline: Falsafah Rekabentuk
  heading: |-
    Direka untuk tepi<br />
    <span class="text-sky-600">keadaan</span>
  paragraphs:
    - Setiap produk Paddle Board Overstock bermula dengan satu soalan:<em>apakah keadaan terburuk yang akan dihadapi ini?</em>Kami mereka bentuk dari tepi ke dalam, bukan dari pusat ke luar.
    - Teras drop-stitch kami dinilai untuk 15 PSI — bukan kerana 12 PSI tidak mencukupi untuk sebuah tasik, tetapi kerana papan 15 PSI boleh mengendalikan gelombang tiba-tiba tanpa melentur. Tiub Hypalon kami ditentukan untuk rintangan UV gred komersial — bukan kerana setiap pelanggan mengayuh di kawasan tropika, tetapi kerana penguraian UV adalah punca utama kegagalan pramatang.
    - Kami tidak mereka bentuk mengikut harga. Kami mereka bentuk mengikut titik kegagalan — kemudian membina jauh melebihi itu.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock reka bentuk dan kejuruteraan
  stats:
    - value: '15'
      label: PSI teras<br />penilaian
    - value: 1,500+
      label: UV jam<br />dijalankan ujian
    - value: 10yr
      label: lambung<br />jangka hayat
