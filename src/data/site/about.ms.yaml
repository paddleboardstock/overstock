business_model:
  tagline: Model Perniagaan Kami
  heading: Inventori berlebihan, dijual terus dari kilang
  paragraphs:
    - Paddle Board Overstock menjual papan inflasi SUP baharu pada harga stok berlebihan dan pelepasan — sehingga 60% diskaun dari harga runcit biasa. Kami memperoleh lebihan dan inventori surplus secara pukal, kemudian menyerahkan penjimatan tersebut kepada pengayuh dan peruncit kecil.
    - 'Selain jualan runcit, kami juga melayani peruncit kecil dengan borong model campuran: pesan 5–20 papan, campur mana-mana model dalam satu penghantaran, dan bayar tahap borong untuk jumlah keseluruhan. Setiap pesanan dihantar terus dari Weihai, China.'
sourcing:
  tagline: Daripada Mana Inventori Berlebihan Kami Datang
  heading: Sumber campuran, satu standard kualiti
  paragraphs:
    - 'Inventori kami datang daripada dua sumber: batch pengeluaran surplus dari operasi pembuatan Weihai kami sendiri, dan inventori lebihan yang dipilih dari rakan pengeluaran lain yang kami audit dan bekerjasama secara langsung.'
    - Setiap papan yang kami jual adalah baharu dan tidak digunakan. Berlebihan merujuk kepada harga — bukan keadaannya.
manufacturing:
  tagline: Latar Belakang Pembuatan Kami
  heading: Dibina di Weihai sejak 2012
  paragraphs:
    - Kami telah menghasilkan papan inflasi SUP di Weihai, Shandong sejak 2012. Kemudahan pengeluaran 12,000 m² kami menghasilkan 15,000 unit inflasi setiap tahun dengan pasukan 200–300 pekerja dan 14+ jurutera R&D.
    - 'Satu prinsip reka bentuk tidak berubah sejak papan pertama: kami mereka bentuk hingga titik kegagalan, kemudian membina jauh melebihi itu.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Bangunan kilang Paddle Board Overstock di Weihai
  stats:
    - value: '2012'
      label: Membuat sejak
    - value: 12,000 m²
      label: Kemudahan pengeluaran
    - value: 15,000
      label: Unit setahun
    - value: 14+
      label: Jurutera R&D
inspection:
  tagline: Bagaimana Kami Memeriksa Setiap Papan SUP
  heading: Setiap papan diuji, bukan sampel
  paragraphs:
    - Setiap papan SUP diuji tekanan 100% pada 1.25x tekanan yang dinilai selama 24–48 jam sebelum diluluskan untuk dijual. Papan yang gagal tidak pernah dihantar.
    - 99.3% papan lulus pemeriksaan akhir pada percubaan pertama. Bahagian selebihnya diperbaiki atau disimpan — tidak pernah didiskaunkan dalam pesanan.
why_prices_lower:
  tagline: Mengapa Harga Kami Lebih Rendah
  heading: Ekonomi stok berlebihan, bukan potongan sudut
  paragraphs:
    - 'Harga kami lebih rendah atas sebab struktur: kami menjual inventori berlebihan dan lebihan terus dari Weihai, tanpa markup runcit, tanpa lapisan pengedar, dan tanpa kos bilik pameran.'
    - Papan itu sendiri adalah kualiti pengeluaran penuh — teras drop-stitch yang sama, PVC gred marin yang sama, ujian yang sama seperti harga runcit penuh.
shipping_network:
  tagline: Rangkaian Penghantaran Antarabangsa Kami
  heading: Penghantaran udara ekspres atau kargo laut terkumpul
  paragraphs:
    - Pesanan dihantar dari Weihai, China. Penghantaran udara ekspres membawa sampel dan pesanan 1–3 papan; kargo laut terkumpul melayani pesanan borong 5–20 papan ke 50+ negara.
    - Setiap sebut harga termasuk anggaran transit ke destinasi anda, serta invois komersial dan senarai pembungkusan yang diperlukan untuk pelepasan kastam.
  cards:
    - title: Penghantaran Udara Ekspres
      description: Untuk sampel dan pesanan 1–3 papan — penghantaran pantas ke pintu anda, dinyatakan mengikut destinasi.
    - title: Penghantaran Laut Konsolidasi
      description: Untuk pesanan borong 5–20 papan — penghantaran berkesan dari segi kos ke pelabuhan utama, dinyatakan mengikut destinasi.
warranty_support:
  tagline: Jaminan & Sokongan Pelanggan
  heading: Jaminan SUP 2-Tahun pada setiap papan
  paragraphs:
    - Setiap papan dihantar dengan Jaminan SUP 2-Tahun. Jika terdapat kecacatan yang dilindungi dalam tempoh jaminan, hubungi pasukan sokongan kami dan kami akan memperbaikinya.
    - Sokongan dikendalikan oleh pasukan yang sama yang menguruskan pesanan anda. Hubungi kami bila-bila masa melalui borang hubungan atau dengan membalas pengesahan pesanan anda.
