cards:
  - badge: PVC
    title: Морски клас PVC слой
    description: Многослоеста ламинирана PVC тъкан, предназначена за морски условия. Тествана за UV, износване и устойчивост на пробиване.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch ядро
    description: Хиляди вътрешни нишки свързват горните и долните слоеве, създавайки твърда структура под високо налягане при 12–15 PSI.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Подсилен ръб на релсата
    description: Двуслоен заварен релсов ръб, който защитава от надрасквания по кея, кацания на плажа и странични удари.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
