cards:
  - badge: PVC
    title: Marine-Grade PVC Layer
    description: Multi-layer laminated PVC fabric rated for marine environments. Tested for UV, abrasion, and puncture resistance.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch Core
    description: Thousands of internal threads connect top and bottom layers, creating a rigid, high-pressure structure at 12–15 PSI.
