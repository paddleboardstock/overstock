  - badge: RR
    title: Reinforced Rail Edge
    description: Double-layered fusion-welded rail protects against dock scrapes, beach landings, and side impacts.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
