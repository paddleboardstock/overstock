cards:
  - badge: PVC
    title: Jūras klases PVC slānis
    description: Daudzkārt laminēts PVC audums, paredzēts lietošanai jūras vidēs. Pārbaudīts uz UV, nodilumu un caurduršanas izturību.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch kodols
    description: Tūkstošiem iekšējo diegu savieno augšējo un apakšējo slāni, radot stingru, augsta spiediena struktūru 12–15 PSI.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - badge: RR
    title: Pastiprināta dzelzceļa mala
    description: Divslāņu kausētā metinātā mala aizsargā pret piestātnes skrāpējumiem, krasta nolaišanos un sānu triecieniem.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
