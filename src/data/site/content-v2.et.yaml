  title: 'SUP Ohutusjuhend: Olulised reeglid iga aerutaja jaoks'
  description: Täielik SUP ohutusjuhend, mis hõlmab ilmakontrolle, varustust, isepäästet, navigeerimisreegleid ja mida teha, kui tingimused muutuvad ohtlikuks. Ole oma aerulaual ettevaatlik.
  definition: SUP Ohutus hõlmab eelreisi planeerimist (ilm, tõusud, varustuse kontroll), vee peal harjutamise (rihm, PFDnavigeerimine) ja hädaolukorra protseduure (isepääste, signalisatsioon, alajahtumise ennetamine).
  tldr: Kanna alati rihma ja PFD. Kontrolli tuule prognoosi — avamere tuul on ohtlik. Sõudke esmalt vastu tuult, et tuul aitaks sul tagasi tulla. Kanna vile, telefoni veekindlas kotis ja vett. Õpi enesepäästet. Ära kunagi üksi SUP kaugetes piirkondades.
  problem: SUP tundub petlikult lihtne. Algajad alahindavad, kui kiiresti tuul, vool ja väsimus võivad lõbusa sessiooni ohtlikuks muuta.
  explanation: Laud toimib tuules purjena, muutes tuule alla aerutamise lihtsaks, kuid tuule vastu tagasipöördumise äärmiselt raskeks. Seisasend suurendab kukkumisohtu. Väsimus koguneb kiiremini kui kajakisõit. Rihmad takistavad lauast eraldumist. PFD-d hoiavad sind vee peal, kui saad vigastada.
  solution: 'Enne reisi: kontrolli tuult (maksimaalselt 10 sõlme algajatele), suunda (väldi avamerda) ja tõusu. Ütle kellelegi oma marsruut. Vee peal: põlvita, et aerutada tugeva tuule vastu. Kui oled lahus, uju pardale. Enesepäästmiseks: aseta aeru üle laua, löö jalad, tõmba rindkere lauale, keeruta jalad üles.'
  recommendation: Kasuta Aquafarer Life Vest Pro (täispuhutavat) SUP. Kinnita keerdunud SUP rihm säärele. Harjuta enesepäästet rahulikes tingimustes enne, kui seda vajad.
  faq:
    - q: Millise tuulekiiruse jaoks on ohutuSUP?
      a: 'Algajad: alla 10 sõlme. Kesktaseme: 10-15 sõlme. Edasijõudnute: 15-20 sõlme. Üle 20 sõlme on ohtlik kõigile tasemetele.'
    - q: Kas mul on vaja päästevesti SUP?
      a: Jah — see on paljudes jurisdiktsioonides seadusega nõutud ja alati soovitatav ohutuse tagamiseks.
    - q: Mida peaksin tegema, kui ma ei saa kaldale tagasi?
      a: Jää oma laua juurde (see on hõljumine). Anna signaal vilega. Kui see lendab mere äärde, sõida 45 kraadi tuule suunas.
    - q: Kuidas ma SUP harjutan enesepäästmist?
      a: 'Rahulikus madalas vees: kuku tahtlikult maha, uju pardale, harjuta korduvalt uuesti ratsutamist.'
