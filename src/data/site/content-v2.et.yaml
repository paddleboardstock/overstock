  title: 'Täispuhutava SUP hooldus: hoia oma laud aastaid kestmas'
  description: Õige täispuhutava SUP hooldus pikendab laua eluiga märkimisväärselt. Puhastamine, kuivatamine, ventiilide hooldus, UV kaitse ja hooajalised hoiustamisnõuanded drop-stitch aerulaudadele.
  definition: Täispuhutava SUP hooldus hõlmab puhastamist pärast kasutamist, korralikku kuivatamist, ventiilide kontrolli, UV kaitset ja õiget hoiustamist, et vältida delaminaati, hallitust, materjalide lagunemist ja õhulekkeid.
  tldr: Loputa laud värske veega pärast iga soolase vee seanssi. Kuivata täielikult enne tühjendamist ja hoiustamist. Kontrolli ventiili mustuse suhtes ja määri O-rõngast igal aastal. Hoia täispuhutuna (poole PSIvõrra) jahedas, pimedas kohas. Väldi UV pikaajalist kokkupuudet, mis PVChalveneb. Paranda väikesed auked kohe kaasasoleva remondikomplektiga.
  problem: Pärast hooaega tekivad täispuhutavale SUP aeglased lekked, terrassipadjad kooruvad servadest ja PVC tundub jäigem. Põhihoolduse eiramine põhjustab enneaegset vananemist, mida on võimalik täielikult vältida.
  explanation: PVC laguneb UV kiirguse all. Merevee soolakristallid töötavad õmblustesse ja ventiilidesse, põhjustades mikrolekkeid. Niiskus, mis on kinni jäänud, soodustab hallituse kasvu, mis drop-stitch ründab keerme. Ventiilide O-rõngad kuivavad ja kaotavad tihendi. Muld ja liiv lihvib terrassipadja liimiks, põhjustades servatõusu.
  solution: 'Pärast iga seanssi: loputa laud, uimed ja pumba värske veega. Pühi terrassipadja. Ava ventiil, et tühjendada kinni jäänud vesi. Kuivata laud varjus enne tühjendamist. Kuus: kontrolli ventiili ja kanna silikoonmäärdeainet O-rõngale. Hooajaliselt: pese õrna seebi ja veega, kontrolli torkeid.'
  recommendation: Järgi oma Aquafarer lauaga kaasas olevat hooldusjuhendit. Kasuta remondikomplekti kohe rehvi korral. Hoia lauda kotis temperatuurikontrollitud kohas, eemal otsesest päikesevalgusest.
  faq:
    - q: Kas ma võin oma täispuhutava SUP kogu hooaja täispuhutuna jätta?
      a: Jah, aga hoia seda otsese päikesevalguse eest ja poole maksimaalse PSI temperatuuriga (8-10PSI), et vähendada õmblustele tekkivat koormust. Täida täielikult vahetult enne kasutamist.
    - q: Kuidas ma puhastan hallitust SUPoma ?
      a: Sega õrn seep sooja veega ja hõõru pehme pintsliga. Kangekaelse hallituse korral kasuta lahjendatud valge äädika lahust (1:4). Väldi pleegitusvahendit.
    - q: Kas ma pean ventiili määrima?
      a: Jah, aastas. Eemalda klapisüdamik, kanna silikoonmääret O-rõngale ja paigalda uuesti. See takistab õhulekkeid.
    - q: Kuidas ma saan oma SUP talveks hoiustada?
      a: Puhasta ja kuivata korralikult. Tühjenda täielikult, rulli lõdvalt (väldi tihedaid kortse) ja hoia jahedas, pimedas ja kuivas kohas. Väldi külmumistemperatuure.
