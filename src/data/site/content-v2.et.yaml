- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard vs shortboard (aus vastus, mida keegi sulle ei anna)
  description: Longboardid püüavad rohkem laineid; lühilauad keeravad tugevamalt. Tegelik küsimus on, milline neist sobib sinu oskustega ja kohalike murdetega. Aus võrdlus stabiilsuse, lainete arvu ja edenemislõksu kohta.
  definition: Longboardid (9ft+) eelistavad stabiilsust ja lainete püüdmise lihtsust; lühilauad (5–7ft) eelistavad manööverdusvõimet ja sooritust järskudel lainetel. Õige valik sõltub sinu oskustasemest ja kohalikest lainetüüpidest.
  tldr: Longboardid (9ft+) on stabiilsed, püüavad laineid kergesti ning sobivad algajatele ja kruiisisõbralikele surfajatele. Lühikesed lauad (5–7ft) on reageerivad, kiiremad lainepinnal ja sobivad edasijõudnutele surfajatele. Õige valik sõltub sinu oskustasemest, lainetüübist ja sellest, mis sulle surfamise juures kõige rohkem meeldib.
  problem: Näed videoid, kus surfarid teevad lühilaudadel teravaid pöördeid ja longboarderid libisevad graatsiliselt mööda nina — mõlemad näevad lõbusad välja. Sul on eelarve ainult ühe lauatüübi jaoks ja pead teadma, milline stiil sobib sinu eesmärkide ja kohalike murdetega.
  explanation: 'Longboardidel on suurem pindala, mis tähendab, et nad sõudavad kiiremini, püüavad laineid varem ja pakuvad stabiilset platvormi kõndimiseks ja ristastumiseks. Nad paistavad silma väikestes, aeglastes lainetes, kus shortboard vajuks. Lühilaudadel on väiksem maht ja agressiivsem rocker, mis võimaldab neil sügavamale lainepinnale vajuda, kurvides kiirust tekitada ja sobituda järskudesse, õõnsatesse osadesse. Lühikesed lauad nõuavad tugevat aerutamist ja täpset lainete ajastust. Levinud eksiarvamus: lühikesed lauad ei ole "paremad" — need on lihtsalt erinevad tööriistad erinevate tingimuste ja oskustasemete jaoks.'
  solution: Kui oled algaja, sõida vähemalt 6 kuud longboardiga (või suure mahuga täispuhutavaga). Kui oled kesktasemel ja sinu kohalikud lained on sageli väikesed ja aeglased, püüab longboard või hübriid rohkem laineid ja on lõbusam. Kui su lained on järsud, õõnsad ja kiired, muutub shortboard vajalikuks, et taskusse mahtuda. Paljud kesktaseme surfajad hooldavad mõlemat ja valivad vastavalt päevale.
  recommendation: Alusta Aquafarer Surfboard Pro'st kui oma longboard-stiilis platvormist. Kui pöörad järjepidevalt ja saavutad kiirust, kaalu hübriidi või shortboardi lisamist järskude lainete päevadeks. Enamik surfareid, kes proovivad liiga vara lühikese lauaga sõita, on pettunud ja sõidavad vähem laineid.
  faq:
    - q: Kas longboardiga on lihtsam sõita kui shortboardiga?
      a: Palju lihtsam. Longboardid püüavad laineid varem, sõudavad kiiremini ja on stabiilsemad pop-up'ide ja trim'ide ajal. Lühikesed lauad nõuavad täpset ajastust, tugevamat aerutamist ja paremat lainehinnangut.
    - q: Kas longboardil saab pöördeid teha?
      a: Jah, kuigi stiil on erinev. Longboardi pöörded on laiemad, sujuvamad ja hõlmavad kogu keha. Nina sõit, cutbackid ja hang-five'id on longboardile spetsiifilised manöövrid, millel on oma oskuste areng ise.
    - q: Milline plaat sobib paremini väikeste lainete jaoks?
      a: Longboardid ja hübriidid toimivad paremini väikestes, nõrkades lainetes, sest nad tekitavad libisemist ja säilitavad hoogu. Lühikesed lauad vajavad toimimiseks järsemaid ja võimsamaid laineid.
    - q: Kas lühilaud on raskem aerutada?
      a: Oluliselt raskem. Väiksem maht tähendab, et laud istub vees madalamal, tekitades suuremat takistust. Lühilauaga aerutamine on nagu ujumine drag-langevarjuga võrreldes pika lauaga aerutamisega.
