  title: 'SUP koos oma koeraga: täielik juhend'
  description: Aerulauasõit koos oma koeraga — ettevalmistus, ohutus, treeningsammud, varustuse soovitused ja näpunäited lõbusaks kogemuseks mõlemale.
  definition: SUP Koeraga tähendab koerakaaslase treenimist tasakaalu hoidmiseks aerulaual, varustamist PFDkoeraga ja turvalist koos aerutamist.
  tldr: Alusta laia ja SUP stabiilse (34 tolli+) vestiga. Hangi oma koerale korralikult sobiv päästevest käepidemega. Alusta lauda esmalt maal, siis madalas vees. Alusta lühikeste sessioonide ja positiivse tugevdamisega. Kanna alati koerale vett. Jälgi stressi või väsimuse märke.
  problem: Sinu koer armastab vett, kuid sa ei tea, kuidas talle SUP ohutut vett tutvustada. Ilma korraliku koolituseta võib koer paanikasse sattuda, maha hüpata või lauda kriimustada.
  explanation: 'Koertel on loomulik ujumisoskus, kuid nad peavad õppima, et laud on ohutu platvorm. Võti on järkjärguline desensibiliseerimine: viia laud kindlale pinnasele, premeeri rahulikku käitumist, liigu siis madalasse vette ja lõpuks sügavamasse vette.'
  solution: 'Alusta maalt: lase koeral nuusutada ja kõnni laual (murul). Premeeri rahulikku käitumist. Järgmisena: aseta laud väga madalasse vette, toeta seda, lase koeral sellel seista. Preemia. Järgmine: sa lähed pardale madalas vees, lase koeral liituda. Lõpuks: aeruta aeglaselt rahulikus vees.'
  recommendation: Kasuta Aquafarer SUP Explorer 11 selle 33-tollise stabiilse platvormi jaoks. Lisa koer PFD (päästevest). Võta kaasa värske vesi ja kauss. Alusta 10-minutiliste sessioonidega ja ehita juurde.
  faq:
    - q: Millist SUP suurust ma oma koerale vajan?
      a: 33–34" laiune laud tagab stabiilsuse keskmistele kuni suurtele koertele. Väikesed koerad (alla 10 kg) saavad hakkama 32\" +laudadel.
    - q: Kas mu koer vajab päästevesti?
      a: Jah — isegi tugevad ujujad vajavad hädaolukordades lihtsaks kättesaamiseks PFD koera, kellel on käepide.
    - q: Kuidas ma kaitsen lauda küüniste eest?
      a: Hoia koeraküüned lõigatud. Kasuta terrassi kaitset või rätikut. Koerad tavaliselt kohandavad ja lõpetavad kratsimise, kui nad on mugavad.
    - q: Kas iga koer suudab SUPõppida?
      a: Enamik koeri suudab õppida kannatlikkusega. Ärevad koerad võivad võtta kauem aega. Ära kunagi sunni kartlikku koera lauale — see tekitab negatiivseid seoseid.
