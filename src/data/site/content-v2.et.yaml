- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Enesepäästmine: Kuidas sügavas vees oma lauale tagasi saada'
  description: Iga SUP aerutaja peaks valdama enesepäästmist. Samm-sammult tehnikad, kuidas laud sügavas vees uuesti paigaldada, kaldale vedada ja rihma sõlmedega toime tulla.
  definition: SUP Enesepääste on tehnika, kus aerulauda uuesti sügavas vees pärast kukkumist kinnitatakse, sealhulgas laua taastamine, keha uuesti paigaldamine ja aeru tagasitoomine.
  tldr: 'Pärast kukkumist: jää rahulikuks, hoia aerust kinni, uju laua juurde. Aseta aeru üle laua. Kasuta delfiinilööki, et lükata rindkere lauale. Tõsta üks jalg üles, siis teine. Põlvita esmalt, siis seisa. Harjuta rahulikus vees, kuni lihasmälu tekib.'
  problem: Kukud SUP sügavasse vette ja ei saa enam peale. Laud on libe, oled väsinud ja paanika tekib. Ilma enesepääste tehnikat teadmata muutub lihtne kukkumine ohtlikuks.
  explanation: 'Enesepääste koosneb kolmest etapist: taastumine (ujumine lauale ja aerutamine), uuesti ratsumine (tagasi lauale saamine) ja jätkamine (aerutamise jätkamine). Võtmetehnika on kasutada aeru stabilisaatorina ja kasutada võimsaid jalalööke, et lükata ülakeha lauale.'
  solution: '1. etapp: uju laua juurde. Hoia aeru kinni või võta see välja. 2. etapp: aseta aeru üle laua risti. Löö jalgu jõuliselt, tõmmates rindkere laua keskele. 3. etapp: kui rind on pardal, tõsta jalad ükshaaval üles. 4. etapp: põlvita, hinga sügavalt, siis seisa järk-järgult.'
  recommendation: Harjuta enesepäästet kontrollitud tingimustes, kuni suudad seda teha ilma mõtlemata. Aquafarer SUP Kasuta Explorer 11, millel on hea haarduvus tekipinnal. Life Vest Pro pakub lisahõljumist, kui sul on raskusi.
  faq:
    - q: Kuidas ma saan uuesti tööle, kui olen väsinud?
      a: Püsi laua kõrval hõljumiseks. Kasuta käsi, et tõmmata rind laua peale, isegi kui jalad ei suuda tõhusalt lüüa. Puhka põlvitades enne püsti tõusmist.
    - q: Mis siis, kui ma kaotan aeru?
      a: Kasuta käsi, et aerutada laud kaldale. Küsi teiselt aerutajalt abi. Vaheta kaotatud aeru kohe välja.
    - q: Kas ma saan end lainetena päästa?
      a: Jah — aseta laud lainetega risti. Ajasta uuesti paigaldamine lainete vahel. Rihm hoiab lauda lähedal.
    - q: Kuidas ma saan toime tulla rihma sasipuntraga?
      a: Jää rahulikuks, hõlju selili, haruta rihm aeglaselt lahti. Kui rihm on uimede ümber mähitud, võib olla vaja uimed vees eemaldada.
