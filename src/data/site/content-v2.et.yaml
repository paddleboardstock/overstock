  definition: Aquafarer Aerude ja pumba komplekt sisaldab kõrgsurvega kahekambrilist pumpa rõhumõõturiga ning alumiiniumist aerude komplekti tugevdatud labadega täispuhutavate paatide jaoks.
  tldr: Aquafarer Pump ja aeru komplekt on teie täispuhutava veesõiduki jaoks hädavajalikud tarvikud. Kahekambriline pump täidab lauad ja paadid tõhusalt. Alumiiniumist aerud on kerged, kuid tugevad. Hind umbes 79 dollarit. Oluline igale SUP täispuhutava või paadiomaniku jaoks.
  problem: Paadi või SUP paadi täispuhumine ühekambrilise pumbaga võtab igaviku aega ning paljudel soodsatel pumpadel on ebatäpsed rõhumõõtjad, mis põhjustavad alatäitumist.
  explanation: Kahekambriline pump kasutab mõlemat silindrit allapoole suunatud löögis, et saavutada suur maht esialgsel täitmisel, ning lülitub ühe kõrgsurve silindri vastu lõplikuks täitmiseks 15–18 PSIkraadini. Integreeritud rõhunäidik võimaldab täpset täitmise jälgimist. Aerudel on tugevdatud labad ja reguleeritavad ferrullid.
  solution: Kasuta suure mahuga režiimi algseks täitmiseks (mõlemad kambrid) ja lülitu ühekambrirežiimile lõplikuks kõrgsurve täitmiseks. Aerud kogunevad sekunditega ja lagunevad hoiustamiseks.
  recommendation: Oluline lisavarustus igale Aquafarer laua- ja paadiomanikule. Pump vähendab oluliselt täitmisaega võrreldes eelarvega ühekambriliste pumpadega.
  faq:
    - q: Kui palju kiirem on kahekambriline pump?
      a: Umbes kaks korda kiiremini kui ühekambriline pump. A SUP täitub 2–3 minutiga, mitte 5–8 minutiga.
    - q: Kas rõhunäidik on täpne?
      a: Jah, näidik on kalibreeritud ja loeb täpselt ühe sekundi PSI raadiuses tüüpilise töövahemiku ulatuses.
    - q: Kas aerud on sarjas AirDeck kasutatavad?
      a: Jah, aerud sisaldavad reguleeritavaid aerulukusid, mis AirDeck sobivad nii RIB seeriapaatidega.
    - q: Millisest materjalist aerud on tehtud?
      a: Lennukikvaliteediga alumiiniumvõllid tugevdatud polüpropüleenist labadega. Nende kaal on umbes 1,5 kg paari kohta.
