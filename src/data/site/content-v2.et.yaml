  title: Surfilaua suuruse juhend (maht on see, mis tegelikult loeb)
  description: Lõpeta surfilaud suuruste arvamine. Maht liitrites määrab kõik — kui kergesti sa laineid püüad, kui stabiilsena tunned ja kui kiiresti liigud. Leia oma sihtliitrid kahe minutiga.
  definition: Surfilaua suurus sõltub peamiselt mahust (liitritest), mitte pikkusest. Maht määrab hõljumise ja lainete püüdmise võime. Pikemad lauad sõudavad kiiremini; laiemad lauad on stabiilsemad; paksemad lauad pakuvad suuremat mahtu ilma lisapikkuseta.
  tldr: 'Surfilaua suurus sõltub mahust, mitte ainult pikkusest. Algajad vajavad 60–80 liitrit, kesktasemel 35–55 liitrit ja edasijõudnud surfajad 20–35 liitrit. Kasuta oma kaalu peamise tegurina: iga 10 kg algajal vajab umbes 10–12 liitrit mahtu.'
  problem: Seistes surfilaudade riiuli ees, millel on numbrid nagu 7'2" x 22" x 3", ei kujuta ette, kuidas need mõõdud vees tunduvad. Ostmine välimuse või sõbra sõidu järgi viib laua kas liiga ebastabiilse või liiga raske aerutamiseni.
  explanation: 'Surfilaua suurust saab kõige paremini mõista kolme mõõtme kaudu: pikkus (aerujõud ja lainete püüdmine), laius (stabiilsus) ja paksus (maht ja hõljumine). Tegelik number loeb ruumala liitrites. Vahtlauad ja täispuhutavad lauad saavutavad suure mahu laiuse ja paksuse kaudu, mitte liigse pikkuse kaudu, muutes need algajatele hallatavaks. Kui sa arened, vähendad helitugevust, et laud saaks sügavamale lainepinnale vajuda ja pöörata reageerivamalt.'
  solution: 'Kasuta mahu ja kaalu kalkulaatorit: algajatele jaga kaal kilogrammides 1,5-ga, et saada sihtliitreid. Kesktaseme puhul jaga 2-ga. Kesktaseme puhul peaksid otsima laudu, millel on mõõdukas rocker ja squash või ümmargune saba, et saada mitmekülgsust.'
  recommendation: Aquafarer Surfboard Pro pakub 75 liitrit mahtu 10'6" suuruses pakendis — ideaalne algajatele kuni 90 kg. Kergemad sõitjad saavad SUP Tour 12 suuruse väiksemaks saada, et saada manööverdusvõimelisem tunne.
  faq:
    - q: Kas kõrgus on surfilaua suuruse jaoks oluline?
      a: Pikkus on vähem oluline kui kaal. Pikk ja kerge surfar vajab vähem mahtu kui sama pikkusega lühike, raske surfar. Kasuta kaalu peamise mõõdikuna ja kohanda vormi ning aerutamise jõudu.
    - q: Mis juhtub, kui mu plaadil on liiga suur maht?
      a: Liiga suur maht muudab laua lainepinnal korgiliseks ja ebastabiilseks. Kurvidel on raske rööbast alla suruda ja võid alumiste pöörete ajal vee pealt põrkuda.
    - q: Mis juhtub, kui mu plaadil on liiga vähe helitugevust?
      a: Sul on raske lainetesse aerutada, stardil liiga sügavale vajuda ja tunned end ebastabiilsena, kui lihtsalt laual istudes ootad. Algajad vajavad peaaegu alati rohkem helitugevust, kui arvavad.
    - q: Kuidas ma tean, millal suurust vähendada?
      a: Kui suudad järjepidevalt laineid püüda, sujuvalt üles tõusta ja praegusel laual lihtsaid pöördeid teha, on aeg vähendada 5–10 liitrit kaalu. Liiga varajane suuruse vähendamine aeglustab edenemist.
