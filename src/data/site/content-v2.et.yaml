  title: 'Paddle Board suuruse juhend: maht, pikkus ja laius iga sõitja kohta'
  description: Täielik aerulaud koos mahu soovitustega kaalu ja aktiivsuse järgi. Sisaldab lihtsasti kasutatavat suurustabelit mitmekülgsete, matka-, surfi- ja SUP joogalaudade jaoks.
  definition: Aerulauda suurus määratakse mahu (kaalumaht ja ujuv), pikkuse (kiirus ja jälgimine), laiuse (stabiilsus) ja paksuse (mahu jaotus ja tuuletakistus) järgi.
  tldr: 'Kasuta kaalu, et leida minimaalne maht: 50-70 kg vajab 220-260L, 70-90 kg 260-300L, 90-110 kg 300-350L, 110+ kg 350+L. Algajatele lisa neile numbritele 20%. Laius on oluline: 32" on keskmine, 33-34" algajasõbralik, 35"+ väga stabiilne.'
  problem: Aerulaudade suuruste kuulutustes kasutatakse jalgu, tolli ja liitreid vaheldumisi, mis teeb brändide võrdlemise keeruliseks.
  explanation: Maht on kõige otsesem mõõdik kandevõimele — 1 liiter magevett asendab 1 kg kaalu. 260L laud suudab teoreetiliselt kanda 260 kg, kuid praktiline mahutavus on väiksem, sest laud peab seisma vee kohal. Sinu kogukaal (kere pluss varustus) peaks olema 30–40% laua mahust.
  solution: Sihtmärk = (kehakaal kg-s, + käigu kaal kg-s) x 3. 75 kg kaaluva aerutaja puhul 5 kg varustusega, sihtmärk = 80 x 3 = 240L miinimum. Algajatele korruta 3,5-ga. Edasijõudnute puhul korruta 2,5-ga.
  recommendation: Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") sobib enamikule 50–100 kg kaaluvatele sõitjatele. Kergemad ratturid võivad mõõtu AirDeck võtta kuni 270 kg. Raskemad sõitjad peaksid vaatama SUP Tour 12 (300L+) või laiemat lauda.
  faq:
    - q: Kas kõrgus on suuruse määramisel oluline SUP ?
      a: Pikkus on vähem oluline kui kaal. Pikk ja kerge rattur vajab vähem mahtu kui lühike ja raske sõitja. Kasuta kaalu peamise mahumäärajana.
    - q: Mis juhtub liiga suure helitugevusega?
      a: Laud istub liiga kõrgel, püüdes tuult nagu puri. Lõikes tundub see korgiline. Kuid algajatele on lisamaht parem kui liiga vähe.
    - q: Mis juhtub liiga väikese helitugevusega?
      a: Laud istub liiga sügaval, tekitades takistust. Nina võib aerutamise ajal (pärlitamise) ajal vee alla vajuda. Sa väsid kiiresti, kui sõuded osaliselt vee all oleva laua aerutamisest.
    - q: Kas täispuhutavad lauad vajavad erineva suurusega kui kõvad lauad?
      a: Mitte oluliselt. Täispuhutavad 15 kraadi juures+ PSI tõrjuvad vett sarnaselt kõvadele laudadele. Mahusoovitused kehtivad võrdselt mõlema tüübi kohta.
