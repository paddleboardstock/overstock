  title: 'Täispuhutava paadi hooldus: Säilita oma investeering'
  description: Aastane täispuhutavate paatide hoolduse kontrollnimekiri. Puhastus, UV kaitse, õmbluste kontroll, rõhujuhtimine, mootori hooldus ja talveks ettevalmistamine PVC Hypalon paatidele.
  definition: Täispuhutava paadi hooldus hõlmab puhastamist, UV kaitset, rõhu juhtimist, õmbluste ja ventiilide kontrolli, hallituse ennetamist ning korralikku hooajavälist hoiustamist.
  tldr: Loputa pärast iga kasutuskorda soolases vees. Kanna UV kaitseainet iga 2–3 kuu tagant. Kontrolli enne iga väljasõitu inflatsioonirõhku. Kontrolli iga kuu õmblusi, ventiile ja ahtrit. Puhasta õrna seebiga. Hoia tühjendatuna jahedas ja kuivas kohas hooajaväliselt.
  problem: Sa kasutasid oma täispuhutavat paati terve hooaja ja nüüd näevad torud kulunud välja, õmblus valutab ja ahtri tundub käsnjas — kõik on võimalik vältida rutiinse hooldusega.
  explanation: UV Kiirgus lagundab polümeermaatriksit. Soolane vesi kristalliseerub voltides ja kulutab kangast. Hallitus kasvab kinni jäänud niiskuses. Vale rõhk põhjustab materjali väsimust. Ahtris (eriti vineer) imab vett kruviavade kaudu.
  solution: 'Pärast iga kasutuskorda: loputa värske veega, kuivata, kontrolli rõhku. Iga kuu: puhasta torud UV kaitsevahendiga, kontrolli õmblusi, tagasilööklappi. Aastas: süvapuhastus, ülekanne mädaniku suhtes, määri ventiile, testi mikrolekkeid.'
  recommendation: Kasuta 303 Aerospace Protectant Aquafarer paaditorudel. Eemalda ventiilid ja kanna igal aastal silikoonmääret. Hoia kandmiskotis koos kuivatusvahendi pakiga.
  faq:
    - q: Kas ma saan pleegitajat kasutada oma täispuhutava paadi puhastamiseks?
      a: Ei — pleegitaja kahjustab kangakatet. Kasuta õrna seepi ja sooja vett. Hallituse vastu kasuta lahjendatud valget äädikat.
    - q: Kui tihti peaksin UV protectantiga ravima?
      a: Iga 2–3 kuu tagant kasutushooajal. Sagedamini troopilises kliimas.
    - q: Kas ma pean oma paadi kasutamise vahel tühjaks laskma?
      a: Mitte siis, kui seda kasutatakse iganädalaselt. Jäta täispuhutud ja UV kattega peal. Igakuiste vahede puhul tühjenda ja hoiusta.
    - q: Kuidas ma saan tagaosa hooldada?
      a: Kontrolli polte kord kuus. Tihenda paljastatud puiduservad igal aastal merelakiga. Vaheta välja, kui tekivad pehmed kohad.
