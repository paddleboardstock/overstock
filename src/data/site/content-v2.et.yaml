  title: 'Seistes aerulauasõit algajatele: sinu esimene sessioon'
  description: 'Kõik, mida pead enne esimest SUP sessiooni teadma: varustuse kontrollnimekiri, kuidas püsti tõusta, aerutamistehnika, ohutu kukkumine ja rahuliku vee valimine õppimiseks.'
  definition: Seistes aerulauasõit SUP() tähendab laual seismist ja aeruga, et end vee peal edasi lükata. Tasakaal, aerutõmbe tehnika ja veeolude lugemine on kolm põhioskust.
  tldr: Alusta tasasel, rahulikust veest ilma tuuleta. Harjuta esmalt põlvitamist, siis seisa jalad puusalaiuse kaugusel laua keskosa lähedal. Hoia aeru ühe käega peal ja teine varrel. Kasuta aerutamiseks torso pöörlemist, mitte käejõudu. Vaata horisondi, mitte jalgu. Oota kukkumist — see on osa õppimisest.
  problem: Sa täidad oma esimeseSUP, astud lauale ja tunned end kohe ebastabiilsena. Su jalad värisevad, aerutamine tundub kohmakas ja sa ei suuda aru saada, miks sa teed ringe, mitte sirgeid jooni.
  explanation: SUP Vaja on tasakaalu kohandamist, sest hõljuval platvormil seismine erineb kõigist maapealsetest tegevustest. Sinu keha pingestub instinktiivselt, mis muudab laua ebastabiilsemaks. Labalöök peaks tulema kere pööramisest, mitte kätega tõmbamisest. Tera peaks vette sisenema varvaste lähedal ja väljuma pahkluu lähedal. Enamik algajaid sõuab ainult kätega, mis põhjustab kiiret väsimust ja halba jälgimist. Laua vaatamine rikub tasakaalu.
  solution: Täida laud soovitatud PSItäpsusega, kinnita rihm pahkluu külge ja hakka põlvitama. Aeruta põlvitades, et saada tunnet libisemisest. Kui oled valmis püsti tõusma, aseta aer üle laua, pane mõlemad käed tekile, astu üks jalg korraga üles ja tõuse, hoides raskust keskel. Hoia põlved kergelt kõverdatud ja kere kaasatud.
  recommendation: Kasuta Aquafarer SUP Explorer 11 selle 33-tollise laiuse ja stabiilse platvormi jaoks. Harjuta järvel või kaitstud lahel ilma vooluta. Kanna esimestel sessioonidel päästevesti.
  faq:
    - q: Kui kaua võtab SUPõppimine aega?
      a: Enamik inimesi suudab rahulikus vees seista ja aerutada 10–15 minutiga. Valdamine võtab 3–5 seanssi. Edasijõudnud oskused võtavad kuid.
    - q: Milline on parim tuuleolu algajatele?
      a: Tuul alla 5 sõlme (rahulik kuni kerge tuulega). Tuul üle 10 sõlme tekitab tasakaalu ja tasakaalu proovilepanekut. Algajad peaksid vältima avamere tuult.
    - q: Kas ma peaksin rihma kandma?
      a: Kanna alati rihma. Keerdunud SUP rihm kinnitub su pahkluu või sääre külge ja hoiab lauda kaasas, kui kukud. Avavees võib rihm päästa su elu.
    - q: Mis on kõige levinum algajate viga?
      a: Vaadates alla lauale. Hoia silmad horisondil. Su keha järgib pead — alla vaadates nihutad raskust ettepoole ja paneb laua kõikuma.
