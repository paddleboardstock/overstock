- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: 3mm vs 5mm märgkostüüm (mis tegelikult töötab külma vee surfamisel)
  description: 3mm vs 5mm kalipso otsus sõltub vee temperatuurist, mitte õhutemperatuurist. Temperatuuritabel, paindlikkuse võrdlus ja see, milline paksus hoiab sind soojas ilma aeru piiramata.
  definition: 3mm märgkostüüm sobib vee temperatuuril 14–20°C hea painduvusega. 5mm ülikond katab 8–14°C maksimaalse soojusega, kuid piiratud liikuvusega. Valik on otsene kompromiss soojuse ja liikumisulatuse vahel.
  tldr: 3mm kalipsod sobivad vee jaoks 14–20°C ja pakuvad maksimaalset paindlikkust. 5mm ülikonnad sobivad 8–14°C jaoks ja eelistavad soojust. Vali vastavalt oma kohalikule veetemperatuurile, mitte õhutemperatuurile. Kui surfad aastaaegade vahel, osta mõlemat. Kui saad osta ainult ühe, pakub 4/3mm parim vahepealne lahendus.
  problem: Sul on vaja kalipsot, aga ei suuda otsustada, kas 3mm ja 5mm vahel. 3mm võib talvel olla liiga soe ja 5mm võib olla liiga paks ja piirav soojematel päevadel. Valesti arvamine tähendab kas talve jooksul külmumist või sügisel higistamist.
  explanation: 'Neopreeni paksus korreleerub otseselt soojusega ja vastupidiselt painduvusega. 3 mm ülikond (tihti 3/2 mm õhemate kätega) tagab hea liikuvuse aerutamiseks ja surfamiseks leebemates tingimustes. 5 mm ülikond kasutab torsol paksemat neopreeni ja sageli õhemaid paneele käte ja jalgade peal (5/4/3 mm), et säilitada paindlikkust. Soojuse erinevus on umbes 6–8°C. Peamised erinevused: 5mm ülikonnad kasutavad rohkem neopreenist materjali, kaaluvad umbes 40 protsenti rohkem, kuivavad kauem ja vajavad rohkem pingutust eemaldamiseks. Kaasaegsed supervenitavad neopreenid vähendavad painduvuslõhet, kuid 5mm piirab liikumist siiski märgatavalt.'
  solution: Määra oma kõige külmem kuune keskmine veetemperatuur kohalike poide andmete põhjal. Kui temperatuur on üle 16°C, osta 3/2 mm. Kui temperatuur jääb vahemikku 12–16°C, osta 4/3 mm. Kui temperatuur on alla 12°C, osta 5/4/3mm. Aastaringseks surfamiseks ühe ülikonnaga katab kvaliteetne 4/3 mm termovooder koos eraldi kapuutsi, saabaste ja kinnastega.
  recommendation: 5 Aquafarer /4/3mm Wetsuit Pro suudab 8-16°C pealtnäha koos soojusvoodriga, mis kompenseerib tõelise 5mm soojusvahet. Kui surfad peamiselt leebetes tingimustes (16-20°C), pakub 3/2mm Aquafarer Wetsuit Pro paremat paindlikkust ja mugavust.
  faq:
    - q: Kas ma võin kanda 3 mm 10°C vees?
      a: Ainult väga lühikesteks sessioonideks (20–30 minutit) ja all on termiline lööbekaitse. Enamiku sessioonist on külm. 5 mm või 5/4/3 mm on 10°C vee puhul tungivalt soovitatav.
    - q: Kas 5mm kalips on suveks liiga soe?
      a: Kui suvine veetemperatuur ületab 18°C, põhjustab 5 mm ülikond ülekuumenemist. Ülikonda saab loputada jaheda veega, kuid suvekuudel on mugavam 3/2 mm või kevadülikonnas.
    - q: Kas 5mm märgkostüüm piirab aerutamist?
      a: Jah, märgatavalt. Paksem neopreen õlgadel nõuab iga aerutõmbe kohta rohkem pingutust. 5/4/3mm ülikond õhemate kätega aitab, kuid väsid ikkagi kiiremini kui 3mm ülikonnas.
    - q: Milline on parim kalipso aastaringseks surfamiseks?
      a: 4/3 mm täiskostüüm rinnalukuga ja termilise voodriga katab 12–18°C, mis on paljudes parasvöötmes aastaringne. Lisa talveks saapad ja saad ühe ülikonnaga surfata 10–18°C.
