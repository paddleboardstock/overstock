- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Suuruse juhend: Pikkus, laius ja maht selgitatud'
  description: SUP Leia õige suurus vastavalt oma kaalule, oskustasemele ja aerutamisstiilile. Pikkus määrab jälgimise, laius stabiilsuse ja maht kaaluvõime.
  definition: SUP Suurus määratakse pikkuse (kiirus ja liuglemise), laiuse (esmase stabiilsuse), paksuse (sekundaarse stabiilsuse ja ruumala) ning ruumala järgi liitrites (kogukaalu kandevõime).
  tldr: 'ÜldmõõtSUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Matka: 12''-14'' x 30"-32" (280-350L). Surfamine: 8''-10'' x 30"-32" (140-220L). Algajad vajavad laiust üle 32" ja mahu, mis ületab kehakaalu 60-80L. Sinu kaal kg pluss 60L on minimaalne maht, mis tagab stabiilsuse.'
  problem: Iga SUP bränd loetleb lauad jalgade, tollide ja liitrite kaupa, kuid kui sa ei tea, kuidas need mõõdud päriselu tunnetuses tõlgenduvad, riskid osta laua, mis on kallutav, aeglane või ei suuda su kaalu kanda.
  explanation: 'Pikkus määrab, kui kiiresti laud aerutab ja kui hästi see sirgjoonel liigub. Pikemad lauad (12''+) libisevad löökide vahel ja hoiavad joont. Lühemad lauad (alla 10'') pöörlevad kergesti, kuid vajavad sagedasemaid aeruvahetusi. Laius määrab esmase stabiilsuse — seismise stabiilsuse. 30" laud tundub algajatele kallakäik; 34" tundub nagu dokk. Paksus määrab mahu — paksem laud hõljub kõrgemal, kuid püüab rohkem tuult. Maht liitrites on parim mõõdik: koormatud laud (sina pluss hammasratas) peaks paigalolekus olema 2–4 tolli vee all.'
  solution: 'Võrdle oma laua mõõtmeid kolme teguriga: kaal (määrab minimaalse mahu), põhitegevus (määrab pikkuse) ja oskustaseme (määrab laiuse). Algajatele korruta kaal kilogrammides 2,2-ga, et saada minimaalne liitrite arv. Vahepealsete puhul korruta 1,8-ga. Edasijõudnute puhul korruta 1,4-ga.'
  recommendation: Aquafarer SUP Explorer 11 mõõtmetega 11' x 33" x 6" ja 260L sobib enamikule sõitjatele kuni 100 kg mitmekülgseks aerutamiseks. Uuenda SUP Tour 12-le mõõtmetega 12' x 31" parema matkakiiruse ja liuglemise jaoks.
  faq:
    - q: Millist SUP suurust ma oma kaalule vajan?
      a: 'Alla 70 kg sõitjatele: 10-11'' x 32" (220-260L). 70-90 kg jaoks: 11-12'' x 33" (260-300L). 90-110 kg jaoks: 11-12'' x 34" (300-350L). Üle 110 kg puhul: 12'' x 34-36" (350L+).'
    - q: Kas see on SUP pikem ja kiirem?
      a: Jah. Pikematel laudadel on parem pikkuse ja laiuse suhe, mis vähendab õhutakistust. 14-jalane touring SUP on sama aerutamispingutuse juures märgatavalt kiirem kui 11-jalane mitmekülgne laud.
    - q: Milline SUP laius on algajatele stabiilne?
      a: 33-34 tolli on algajatele kuni 90 kg kaaluv ideaalne koht. Alla 32" nõuab head tasakaalu. Üle 34" on väga stabiilne, kuid aeglasem ja tuules raskem aerutada.
    - q: Kas ma saan kasutada kõikehõlmavat lauda matkamiseks?
      a: Jah, lühikestel alla 10 km matkadel. Pikematel vahemaadel on spetsiaalne turismilaud paremini jälgi ja katab distantsi tõhusamalt.
