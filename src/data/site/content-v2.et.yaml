  type: buying-guide
  title: 'SUP Aerujuhend: Vali oma stiilile sobiv aer'
  description: Täielik juhend SUP labade kohta — pikkus, materjalid (alumiinium, klaaskiud, süsinik), labade kujud ja kuidas aeruvalikud mõjutavad sinu aerutamiskogemust.
  definition: SUP Labi koosneb varrast (alumiinium, klaaskiud või süsinik) ja labast (dihedraal, scoop või lame). Pikkus peaks olema 8–10 tolli kõrgem kui sinu kõrgus üldiseks aerutamiseks.
  tldr: 'Aeru pikkus: 8-10" kõrgem kui sinu kõrgus igaks kasutamiseks, 6-8" surfamiseks, 10-12" matkamiseks. Materjalid: alumiinium (odav, raske), klaaskiud (keskmine, hea painduvus), süsinik (kerge, jäik, kallis). Labade kuju: dihedraalne (stabiilne roomik), scoop (elektriline), lame (mitmekülgne). Reguleeritavad labad sobivad algajatele suurepäraselt.'
  problem: Enamiku iSUP-ide kaasas olev aerutamine töötab, kuid on raske ja ebaefektiivne. Uuendamine parandab aerutamise efektiivsust ja naudingut, kuid valikud on segased.
  explanation: 'Labade pikkus mõjutab löögi efektiivsust — liiga lühike nõuab kummardumist, liiga pikk õlaga väsimist. Materjal määrab kaalu: süsinikust labade kaalud on 18–24 untsi, alumiiniumi puhul 28–36 untsi. Labade suurus mõjutab jõudu: suuremad labad (100+ ruuttolli) annavad iga tõmbe kohta rohkem tõukejõudu, kuid väsivad kiiremini. Dihedraalne labad liiguvad sirgelt; õhulabad annavad rohkem haardumist.'
  solution: 'Õige pikkuse jaoks: seisa aeruga vertikaalselt, siruta käsi üles — aerukäepide peaks randmeid puudutama. Materjali jaoks: alusta klaaskiust keskmise raskusega uuendusena. Tera jaoks: vali dihedral üldiseks aerutamiseks. Tegevuste jaoks: matkaaerud on pikemad ja väiksemate labadega; laineaerud on lühemad ja laiemad.'
  recommendation: 28 Aquafarer untsi süsinikaeruga aer on parim uuendus sagedastele aerutajatele. Kaasas olev reguleeritav kolmeosaline alumiiniumaer sobib algajatele ja reisireisidele.
  faq:
    - q: Kui pikk peaks olema minu SUP aeru?
      a: Mõõda oma pikkust tollides ja lisa 8-10 mitmekülgseks aerutamiseks. Surfamiseks lisa 6-8. Matkamiseks lisa 10-12.
    - q: Kas süsinikkiust labida on raha väärt?
      a: Jah, tavalistele aerutajatele — kaalulangus vähendab väsimust märkimisväärselt pikkade sessioonide jooksul. Juhuslikuks kasutamiseks on klaaskiud hea hinna ja kvaliteedi suhe.
    - q: Mis on reguleeritav aer?
      a: 2- või 3-osaline aeru, millel on pikkuse reguleerimine, ideaalne kasutajate vahel jagamiseks või erinevate tegevuste jaoks reguleerimiseks.
    - q: Kuidas ma oma aeru eest hoolitsen?
      a: Pärast soolase vee kasutamist loputa värske veega. Väldi selle ületamist või otseses soojuses hoidmist. Kontrolli ferrule'i (liite) liiva.
