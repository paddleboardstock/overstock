  title: Ookeani ohutuse alused (mida iga surfaja peaks teadma enne aerutamist)
  description: Lõpeta ookeani kohtlemine nagu basseini. Õpi lugema laineid, märkama vooluvoolu 10 sekundiga, mõistma tõusu ja mõõna ning teadma, millal tingimused on sinu oskuste jaoks liiga ohtlikud.
  definition: Ookeaniohutus tähendab arusaamist, kuidas lained murduvad, kuidas voolud moodustuvad, kuidas loodete mõju tingimustele ja kuidas lugeda lainete prognoosi. Ookeanil on ennustatavad mustrid — nende õppimine hoiab sind turvaliselt.
  tldr: 'Ookeani ohutus algab vaatlemisest: uuri lainemustrit viis minutit enne sisenemist. Tuvasta voolud, otsides rahulikke, tumedaid kanaleid, kus vaht liigub merel. Tunne oma ujumispiire, ära kunagi pööra ookeanile selga ja hoia alati maamärki, et jälgida oma triivi mööda randa.'
  problem: Ookean näeb liivast rahulik välja, kuid kui oled vees, lükkavad lained sind ümber, hoovused viivad sind mööda randa ja sa kaotad arusaama, kus on ohutu väljapääs. Ilma ookeani toimimise mõistmata tundub iga sessioon kaootiline.
  explanation: Lained tekivad tuuleenergiast, mis liigub üle ookeani pinna, organiseerituna laineteks, mis murduvad, kui jõuavad madalasse vette. Merepõhja kuju ja suurus määravad, kuidas lainete murdumine – järsud murded tekitavad õõnsaid laineid, õrnad nõlvad tekitavad rulluvaid laineid. Voolud tekivad siis, kui lainete poolt kaldale surutud vesi leiab tee tagasi välja. Tõusud muudavad liivavallide sügavust, muutes lainete kvaliteeti ning paljastades või varjates ohte nagu kivid ja riffid. Nende jõudude mõistmine võimaldab teil tingimusi ennustada enne aerutamist.
  solution: Enne vette minekut seisa kõrgel kohal ja jälgi 5–10 minutit. Tuvasta vähemalt kaks rebendkanalit, et teada, mida vältida. Pane tähele, kus lained murduvad ja kus mitte. Vali fikseeritud maamärk, näiteks päästetorn või eriline hoone, ja kontrolli seda iga paari minuti tagant, et jälgida oma triivi. Kui liigud maamärgist rohkem kui 50 meetrit, sõudke tagasi, kuni energiat veel on.
  recommendation: Loe ookeanitingimuste juhendit, et süvendada oma arusaamist tõusudest, lainetest ja tuulest. Harjuta tuvastusharjutusi järgmisel rannakülastusel — osuta lõhedele, lainetüüpidele ja tõusuetappidele. Kui plaanid regulaarselt surfata, kaalu sertifitseeritud surfiohutuse kursust.
  faq:
    - q: Mis on kõige turvalisem koht vette sisenemiseks?
      a: Vetelpäästjate patrullitud rand õrnade, lainetega. Sisene kohta, kus lained on kõige väiksemad, ja väldi kohti, kus on nähtavad rebimisvoolud, kivid või kai. Kui sa pole kindel, küsi vetelpäästjalt.
    - q: Kuidas mõjutavad tõusud surfamise ohutust?
      a: Madalvee ajal võib kivid ja riffid paljastada, tekkida madalad liivavallid ning tekitada järsemaid ja tugevamaid laineid. Kõrge tõus tekitab sageli pehmemaid laineid, kuid võib suruda prahti kaldale. Keskvee on algajatele üldiselt kõige turvalisem.
    - q: Mida peaksin tegema, kui jään tugeva voolu kätte?
      a: Ära paanitse. Uju paralleelselt kaldaga, et voolust väljuda, seejärel kasuta laineid, et tagasi randa jõuda. Kui sa ei suuda edusamme teha, hõlju selili ja anna abi märku, tõstes ühe käe.
    - q: Kuidas ma tean, kas lained on minu jaoks liiga suured?
      a: 'Kui tunned end närvilisena juba lainete vaatamisel, on see liiga suur. Turvaline reegel: lained ei tohiks esimesed 10 sessiooni jooksul olla kõrgemad kui sinu rinnakõrgus. Jälgi teisi sarnase võimega surfajaid — kui neil on raskusi, istu seekord välja.'
