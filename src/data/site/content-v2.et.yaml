  title: 'SUPTuuleolud: Kuidas tuul mõjutab su aeru'
  description: Kuidas tuule kiirus ja suund SUP mõjutavad aerutamist. Avamere ja maismaa tuule mõistmine, tuuleprognooside lugemine, tuule aerutamistehnikad ning millal kaldal püsida.
  definition: Tuuleolud SUP määravad ohutuse. Avamere tuul (maa-mere) lükkab sind eemale. Maismaa tuul (merest maale) lükkab sind kaldale. Külgtuul paneb laua pöörama.
  tldr: 'Maksimaalne ohutu tuul algajatele: 10 sõlme. Keskmine: 15 sõlme. Edasijõudnut: 20 sõlme. Avamere tuul on kõige ohtlikum. Sõudke esmalt vastu tuult. Külgtuules sõudke veidi sihtkohast ülespoole. Põlvita tugevas tuules, et vähendada profiili.'
  problem: Sa sõuded välja rahulikes tingimustes, kuid 30 minuti pärast on tuul tugevnenud ja sul on raske tagasi tulla. Tuul on kõige alahinnatum SUP ohutustegur.
  explanation: Tuul mõjutab SUP rohkem kui ükski teine aerutaja, sest sa seisad, tekitades purjeefekti. 10-sõlme tuul tekitab seisvale aerutajale palju suuremat takistust kui istuv kajakisõitja. Avamere tuul lükkab sind ohutusest eemale. Külgtuul paneb nina pöörama.
  solution: 'Kontrolli enne aerutamist tuule kiirust ja suunda. Kasuta Beauforti skaalat: algajatele Force 3 (7-10 sõlme), vahepealsetele Force 4 (11-16). Sõudke esmalt vastu tuult. Kui jääd avameretuule kätte, sõudke 45 kraadi tuule vastu. Põlvita tugeva tuule käes.'
  recommendation: Kasuta enne iga sessiooni tuuleprognoosi rakendust (Windy, Windfinder). Aquafarer SUP Tour 12 on tuules paremini kui laiemad lauad. Tuulistes tingimustes kasuta lühemaid aerutõmme ja kõrgemat rütmi.
  faq:
    - q: Millise tuule suuna jaoks on kõige SUPturvalisem?
      a: Maismaa tuul (mis puhub maismaale) on kõige ohutum — see lükkab sind tagasi. Kõige ohtlikum on avamere tuul (avamere tuul ise).
    - q: Kuidas ma sõudin külgtuules?
      a: Sõudke rohkem tuule poole, et triivi vastu seista. Suunake laud sihtkoha poole tuule poole. Sügavam keskuim aitab kaasa.
    - q: Kas ma saan aerutada 20 sõlme tuules?
      a: Ainult kui sul on kogemusi kaitstud vetes. Algajad ei tohiks aerutada üle 10 sõlme.
    - q: Kuidas tuuleiilid SUPmõjutavad?
      a: Puhangud põhjustavad äkilisi tasakaaluprobleeme. Tuulelistes tingimustes langeta oma asendit ja ole valmis ootamatuteks muutusteks.
