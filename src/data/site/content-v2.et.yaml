- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Kalipso hooldus: Muuda oma neopreen kestvaks kaks korda kauem'
  description: Õige kalipsohooldus pikendab eluiga ühelt hooajalt +3-le. Neopreenist kalipsude loputamise, kuivatamise, hoiustamise ja parandamise nipid. Väldi levinud vigu, mis rikuvad kalipsod enneaegselt.
  definition: Kalipso hooldus hõlmab pärast iga kasutuskorda värske veega loputamist, otsese päikesevalguse eest kuivatamist, lamedalt või laia riidepuu külge riputamist ning perioodilist puhastamist, et eemaldada soola, bakterid ja lõhnad.
  tldr: Loputa märgkostüüm seest ja väljast kohe pärast iga seanssi värske veega. Kuivata varjus laia plastist riidepuu peal tagurpidi. Hoia kas lamedalt või voldituna jahedas, kuivas kohas. Ära jäta märgkostüüme otsese päikese, kuuma auto või kuivati kätte. Kasuta märgülikonna šampooni iga 5–10 seansi järel.
  problem: Pärast ühte hooaega haiseb su kalips, neopreen on kaotanud elastsuse, õmblused kooruvad ja tõmblukud kleepuvad — kõik on võimalik korraliku hooldusega vältida.
  explanation: Soolakristallid kinnituvad neopreeni sisse ja kulutavad materjali. Bakterid paljunevad niisketes sisemustes, tekitades lõhnu ja lagundades neopreeni.UV Lagundab nailonkatte. Kuumus üle 50°C põhjustab delaminatsiooni. Vale kuivamine moonutab neopreeni ja koormab õmblusi.
  solution: 'Pärast iga seanssi: loputa korralikult seest ja väljast, pööra tagurpidi, riputa laia plastikust riidepuu varjus. Kui kuivad, keera paremale ja hoia lamedalt. Iga 5–10 seansi järel: pese märgkostüümi šampooniga. Kuus: määri tõmblukku lukuga vahaga.'
  recommendation: Kasuta Aquafarer märgkostüümi šampooni puhastamiseks ja Aquafarer tõmbluku vaha hoolduseks. Hoia laia Aquafarer riidepuu peal võrkkotis.
  faq:
    - q: Kas ma võin oma kalipsu pesumasinasse panna?
      a: Ei soovitata — masinpesu kahjustab neopreeni. Kui vaja, kasuta õrna tsüklit, külma vett ja võrkkotti.
    - q: Kuidas ma saan lõhna oma kalipsust välja?
      a: Leota jahedas vees märgšampooni või valge äädikaga 30 minutit. Loputa korralikult.
    - q: Kuidas peaksin oma kalipsu kuivatama?
      a: Tagurpidi varjus laial, polsterdatud plastriidepuul. Väldi otsest päikesevalgust ja metallist riidepuusid.
    - q: Kas ma saan parandada rebenenud kalipsot?
      a: Väikesed rebendid alla 1\" saab parandada neopreentsementi ja plaastriga. Suuremad rebendid võivad vajada professionaalset remonti.
