  title: Surfilaudade tüübid selgitatud (milline neist sobib sulle?)
  description: Shortboard, longboard, fish, hübriid, vahtlaud — kas oled juba segaduses? Siin on iga surfilaua tüüp, mis on jaotatud selle järgi, kellele see mõeldud on, milliseid laineid see vajab ja millise peaksid esmalt ostma.
  definition: Peamised surfilauad on longboardid (9ft+, stabiilne, lihtne), shortboardid (5–7ft, reageeriv, edasijõudnud), vaht-/täispuhutavad lauad (suur maht, algajatele ohutu) ja hübriidid (7–9ft, mitmekülgne keskpunkt). Igaüks sobib erinevatele oskustasemetele ja laineoludele.
  tldr: Neli peamist surfilaua tüüpi on lühikesed lauad (jõudlus, madal maht), longboardid (stabiilsed, cruisy), vahtlauad/täispuhutavad lauad (algajasõbralikud, mahukas) ja hübriidid või funboardid (keskmise pikkusega mitmekülgsus). Iga laud sobib erineva oskustaseme ja surfamisstiiliga. Vali laud vastavalt sellele, kus oled oma õppimiskõveras ja millist sõitu sulle kõige rohkem meeldib.
  problem: 'Surfilaudade nimed on segased: mini-mal, egg, fish, gun, hybrid, retro twin — nimekiri jätkub. Sa tahad teada, milline lauatüüp sobib sinu oskustasemega ja kohalike lainetega, ilma et ostaksid viit erinevat lauda, et seda välja selgitada.'
  explanation: Longboardid on 9 jalga ja kõrgemad, paksud, ümarate ninaga — nad püüavad laineid varakult ja sõudavad vaevata. Lühikesed lauad on 5–7 jalga pikad, terava ninaga ja agressiivse kiiklauaga — nõuavad tugevat aerutamist ja täpset tehnikat, kuid pakuvad maksimaalset sooritust. Vaht- ja täispuhutavad lauad jäljendavad pikalaudade kuju suure mahuga pakendites, kuid on pehmemad ja ohutumad. Hübriidid (funboardid, munad) on 7–9 jala kõrgused ja ühendavad aerumise kerguse pööramisvõimega. Kalalauad on lühikesed ja laiad, neil on saba, mis on mõeldud väiksematele lainetele.
  solution: Tuvasta oma kohalik lainetüüp — aeglased rannamurded sobivad nii longboardidele kui hübriididele; järsemad korallrahud või point break'id sobivad lühikeste laudadega. Sobita laud lainega, mitte sellega, mis näeb lahe välja. Algajad peaksid vaikimisi valima pika laua kuju, millel on suur maht, ja seejärel avastama lühemaid vorme, kui oskused arenevad.
  recommendation: Enamiku surfajate jaoks on hübriid- või funboard umbes 7'6" kuni 8'6" parim ühe laua noolekott. Aquafarer Surfboard Pro 10'6" pikkune on pikem, kuid pakub longboardi stabiilsust ja kaasaskantavust nagu täispuhutav laud. Kasuta seda esimesel aastal oma põhilauana.
  faq:
    - q: Milline on kõige lihtsam surfilaud, millega sõita?
      a: Pikk laud (9 +jalga) või suure mahuga täispuhutav nagu Aquafarer Surfboard Pro. Need lauad püüavad lained varakult kinni ja pakuvad stabiilset platvormi pop-up'ide ja kaalu nihutamise õppimiseks.
    - q: Millal peaksin vahetama longboardi lühilaua vastu?
      a: Pärast seda, kui suudad järjepidevalt rohelisi laineid püüda, teha põhjapöördeid ja trimmida lainepinda oma longboardil. Switchi kiirustamine on kõige levinum viga — oota, et veedad longboardil 6–12 kuud.
    - q: Milleks on kalasurfilaud?
      a: Kalalauad on mõeldud väikeste, pehmete lainete jaoks. Nende lühike pikkus ja lai kontuur tekitavad kiirust seal, kus tüüpiline lühilaud seiskub. Need on suurepärane teine laud kesktasemel surfajatele.
    - q: Kas täispuhutavad surfilauad on head?
      a: Kaasaegsed täispuhutavad drop-stitch konstruktsiooniga mudelid konkureerivad jäikuse ja jõudluse poolest vahtlaudadega. Need sobivad ideaalselt algajatele ja reisijatele, sest mahutavad seljakotti ja on peaaegu purunematud.
