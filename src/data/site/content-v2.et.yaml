  title: 'SUP Ankrujuhend: Püsi paigal kalapüügi või fotograafia ajal'
  description: Täielik juhend SUP ankruks — ankrutüübid (seen, voltimine, vaik), ankrukäru paigaldus, paigaldustehnikad ja ohutuskaalutlused positsioonil püsimiseks.
  definition: SUP Ankur on raskus, mis on kinnitatud köiele, mis hoiab lauda tuule ja voolu vastu paigal. Levinumad tüübid on seeneankrud, kokkupandavad ankrud ja spit-out postid.
  tldr: Kasuta seeneankrut (1,5-3 naela) mudase või liivase põhja jaoks, kokkupandavat ankrut kiviste põhjade jaoks või madala vee pehmete põhjade puhul spit-out-posti. Ankur peaks olema 1,5-3 naela rahulike tingimuste jaoks, 3-5 naela tuule ja voolu jaoks. Alati kasuta ankrukäru, et asendit reguleerida ja teada, millal lahti lasta.
  problem: Leiad ideaalse kalapüügikoha, kuid tuul ja vool viivad sind iga paari minuti tagant positsioonist kõrvale. Ilma ankruta SUP on kalapüük ja fotograafia pidevas ümberpaigutamises frustreerivad.
  explanation: Ankur töötab nii, et see lohiseb põhja peal, kuni see kinni jääb. Seeneankrud tungivad pehmetesse põhjadesse ja tagavad hea hoidvuse liiva ja muda sees. Kokkupandavatel ankrutel on fännid, mis kaevuvad kõvadesse või kivistesse põhjadesse. Varrasted töötavad madalas vees, surudes otse põhja.
  solution: Paigalda ankrukäru süsteem (liin, mille ühel küljel on liugrõngas), et reguleerida ankrukinnituskohta. Kinnita ankrule 50–75 jalga köit. Paigalda soovitud asendist üles- või ülesvoolu. Kasuta kiire vabastussüsteemi hädaolukordades lahtiühendamiseks. Ära kunagi ankru tugevas voolus või kohtades, kus ankrut pole lihtne kätte saada.
  recommendation: 3 naela kokkupandav ankur 50 jalga köiega sobib enamikes SUP kalapüügitingimustes. Lisa oma Aquafarer Explorer 11 D-rõngastega ankrukärusüsteem SUP .
  faq:
    - q: Mis suuruses ankrut mul vaja SUPon?
      a: 1,5–3 naela rahulike järvede ja aeglaste jõgede jaoks. 3–5 naela rannikualadele, kus on tuul või hoovus. Ülegabariidilised ankrud on raskesti kättesaadavad.
    - q: Kui palju ankruliini mul vaja on?
      a: 5:1 sihik (5 jalga nööri iga 1 jala sügavuse kohta) on standardne. 10' sügavuses vees kasuta 50' liini.
    - q: Kas ankurdamine on ohtlik SUP?
      a: Ainult siis, kui ankrud voolu või tuulega, mis on piisavalt tugev, et laud ümber pöörata. Kasuta alati kiiret vabastussüsteemi, mida saab koheselt lahti ühendada.
    - q: Kas ma võin ankrusse panna?
      a: Kontrolli kohalikke regulatsioone. Mõnes piirkonnas piiratakse ankrutamist, et kaitsta mererohtu või mereelupaiku. Ära kunagi ankru korallrahudel.
