  title: Parim veespordivarustus algajatele (kuluta targalt, ära kahetse)
  description: 'Ära raiska oma eelarvet varustusele, millest sa välja kasvad. Nutika stardikomplekti jaotus: laud, kalips, aer, turvavarustus — kuhu kulutada, kuhu säästa ja mis tegelikult kestab.'
  definition: Algajate veespordivarustus algab täispuhutava lauaga (SUPvõi surfiga), 3/2 mm märgkostüümiga, rihmaga ja pumbaga. Põhivarustus peaks olema keskmise kvaliteediga; ohutusvarustus ei tohiks kunagi odav olla.
  tldr: SUP Alusta täispuhutava või surfilauaga, 3/2 mm täismärgkostüümiga (või vedrusülikonnaga sooja vee jaoks), rihmaga, pumbaga ja päästevestiga, kui sa pole enesekindel ujuja. Osta kvaliteetseid põhitooteid (laud, kalipso) ja säästa aksessuaaride pealt. Väldi väga odavat brändita varustust, mis hooaja jooksul katki läheb.
  problem: Tahad hakata surfama SUPvõi kajakisõitu, kuid vajalike varustuse nimekiri on pikk ja kallis. Sa ei taha üle maksta asjade eest, mis võivad välja kasvada, aga odav varustus rikub kogemuse ja võib olla ohtlik.
  explanation: 'Veespordivarustus jaguneb kolmeks tasemeks: põhivarustus (laud, kalips, aer), ohutustarbed (rihm, päästevest, pump) ja tarvikud (kott, remondikomplekt, rüüdemantel). Algajad peaksid investeerima suure mahuga täispuhutavasse lauda, sest see täidab nii surfilauda kui SUP platvormi, sobib reisimiseks ja omab kõrget järelturuväärtust. Kalipso ülikonnad peaksid olema keskmise klassi GBS-õmblustega — soodsad ülikonnad loputavad vett ja lagunevad kuude jooksul. Odavad abad murduvad; odavad pumbad ebaõnnestuvad poole peal infleerimisel. Ohutusesemeid ei tohiks kunagi kaubelda.'
  solution: 'Algajale eelarve jaotus: 400-700 dollarit täispuhutava laua eest koos pumba ja kotiga, 200-350 dollarit 3/2 mm kalipsu eest, 50-100 dollarit aeru, 30-50 dollarit rihma eest, 40-70 dollarit päästevesti eest. Kokku umbes 800-1200 dollarit täiskomplekti eest. Osta esmalt laud ja kalipso ning lisa aksessuaarid, kui kinnitad, et naudid spordiala.'
  recommendation: Aquafarer SUP Explorer 11 katab SUP ja surfiõppe alla $600 koos pumba ja kotiga. Kombineeri see Aquafarer wetsuit Pro ja kahekambrilise pumbaga, et saada täielik algajate komplekt, mis kestab aastaid. Kui plaanid avavees, lisa päästevesti SUP .
  faq:
    - q: Kas ma saan kasutada surfilauaSUP?
      a: Mitte mugavalt. Surfilauad on mõeldud lamades aerutamiseks ning neil on vähem mahtu ja stabiilsust. SUP Täispuhutavat lauda saab kasutada algajale SUP surfamiseks, mis teeb sellest parema esimese laua investeeringu.
    - q: Millist kalipsot peaks algaja ostma?
      a: 3/2 mm täiskostüüm rinna lukuga ja GBS õmblustega. See katab kevadel, sügisel ja leebetel talvetingimustel. Väldi tagumise lukuga sisenemisülikondi — need loputavad rohkem vett ja on raskem ära võtta.
    - q: Kas mul on vaja päästevesti SUP?
      a: See on väga soovitatav, eriti avavees, tuulistes tingimustes või kui sa ei ole tugev ujuja. Paljudes kohtades nõutakse seaduslikult päästevesti seljas SUPs ujumiskaugusest kaldast.
    - q: Kui palju peaksin algajale mõeldud aeru peale kulutama?
      a: Esimeseks aastaks piisab $50-100 alumiiniumist või klaaskiust labidast. Süsinikkiust abad on kergemad, kuid maksavad $150-300 ning neid on kõige parem osta, kui tead oma eelistatud pikkust ja jäikust.
