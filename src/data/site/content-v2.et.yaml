- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Vedeliku tarbimine ja päikesekaitse: Ole vees ettevaatlik'
  description: Olulised vedeliku tarbimise ja päikesekaitse strateegiad SUP aerutajatele. Dehüdratsioon ja päikesepõletus on kõige levinumad SUP probleemid — kuidas mõlemat vältida pikkade sessioonide ajal.
  definition: SUP Hüdreerimine tähendab vedeliku tasakaalu hoidmist aerutamise ajal regulaarse vee tarbimise kaudu. Päikesekaitse hõlmab SPF-i pealekandmist, kaitseriietust ja ajastustreeninguid, et vältida UVtippu.
  tldr: Joo 500 ml vett tunnis aerutades. Võta kaasa rohkem, kui arvad, et vajad — 2-liitrine põis või mitu pudelit. Kanna enne aerutamist veekindlat SPF 50+ päikesekaitsekreemi ja kanna seda iga kahe tunni järel uuesti. Kanna mütsi, paeltega päikeseprille ja UPF-klassiga riideid. Väldi aerutamist kell 11–15, kui UV see on kõige tugevam.
  problem: Sul on suurepärane SUP sessioon, aga pärast tunni möödumist on peavalu, suu kuiv ja nahk põleb. Dehüdratsioon ja päikesepõletus hiilivad ligi, sest vesi hoiab sind jahedana.
  explanation: Vee peegeldumine intensiivistab UV kokkupuudet kuni 40%. Vee ja tuule jahutav toime varjab päikesepõletust kuni on liiga hilja. Higi aerutamisest suurendab vedeliku kadu ning sageli pole vett täitmiseks kohta. Dehüdratsioon kahjustab tasakaalu ja otsuste tegemist, suurendades õnnetuste riski.
  solution: Kinnita veepudel või vedelikatsioonipõis laua benji-süsteemile. Joo iga 15 minuti järel, olenemata sellest, kas oled janune või mitte. Kanna SPF 50+ päikesekaitsekreemi 30 minutit enne käivitamist. Kanna laia äärega mütsi, polariseeritud päikeseprille rihmaga ja UPF 50+ lööbekaitset. Kanna päikesekaitsekreemi iga 2 tunni järel.
  recommendation: Kasuta vedeliku põit, mis on kinnitatud oma esirõngaste külge Aquafarer SUP. Kanna UPF 50+ lööbekaitset PFDoma . Kasuta veekindlat päikesekaitsekreemi, mis jääb peale higi ja vee ajal.
  faq:
    - q: Kui palju vett peaksin SUP reisile kaasa võtma?
      a: Vähemalt 1 liiter tunnis. 2-tunnise seansi jaoks võta kaasa 2 liitrit. Kuuma ilmaga rohkem. Kõige paremini sobib vedelikuga põis.
    - q: Millise päikesekaitsekreemi jaoks on kõige paremSUP?
      a: Veekindel, SPF 50+ laia spektriga. Mineraalsed päikesekaitsekreemid (tsinkoksiid, titaandioksiid) on rahudele ohutud ja kestavad kauem.
    - q: Kas vesi peegeldub UVtõesti?
      a: Jah — vesi peegeldab kuni 40% UV kiirgusest, mis tähendab, et UV kiirgus tuleb nii ülevalt kui altpoolt. See suurendab põletusriski märkimisväärselt.
    - q: Kas ma võin saada päikesepõletuse läbi löövekaitse?
      a: Tavalised lööbekaitsed pakuvad UV minimaalset kaitset (umbes UPF 10-20). Otsi UPF 50+ reitinguga riideid, et saada täielik kaitse.
