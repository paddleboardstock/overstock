  title: 'Külma vee ohutus: aerutamine ja surfamine külmades tingimustes'
  description: Külma vee ohutus SUPsurfamiseks ja kajakisõiduks. Hüpotermia tuvastamine, sobiv varustus, külma šoki reageerimine ja hädaolukorra protseduurid külma vee sukeldumiseks.
  definition: Külma vee ohutus hõlmab külma šoki reaktsiooni, ujumisrikke, alajahtumise ning seadmete ja tehnikate mõistmist, mis aitavad neid tagajärgi ennetada.
  tldr: Vesi alla 15°C nõuab märgkostüümi. Alla 10°C nõuab saapaid, kindaid ja kapuutsi. Külma šokk põhjustab tahtmatut õhku ahmimist. Ujumisebaõnnestumine tekib 3–5 minuti jooksul vees, mis on alla 10°C. Alajahtumise sümptomiteks on värisemine, segadus ja koordinatsiooni kaotus.
  problem: Sa sõuded päikeselisel päeval välja, teadmata, et vesi on 8°C. Sa kukud, ahmivad tahtmatult õhku ja tunned, kuidas jäsemed mõne minutiga tuimaks lähevad. Külm vesi tapab kiiremini kui ükski teine ookeanioht.
  explanation: 'Külma vee sukeldumisel on neli etappi: külm šokk (0-2 min) — ahmimine, hüperventilatsioon. Ujumisebaõnnestumine (3-15 min) — lihased jahtuvad, koordinatsioon ebaõnnestub. Hüpotermia (15-45 min) — kehatemperatuur langeb alla 35°C, põhjustades segadust ja südameseiskumist. Pärast päästekriisi — külm veri naaseb tuuma.'
  solution: 'Kontrolli vee temperatuuri. Kanna temperatuurile sobivat kalipsot. Ära kunagi sõuda üksi alla 15°C vees. Kanna vile ja telefon. Kui kukud: kontrolli hingamist, paigalda laud kiiresti uuesti. Kui külm on liiga külm, anna abimärguanne.'
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm on vee jaoks minimaalne 8-14C. Lisa Aquafarer 5mm saapad ja 3mm kindad. Kanna Life Vest Pro lisasoojuskaitseks.
  faq:
    - q: Kui kaua ma suudan 10°C vees ellu jääda?
      a: Külmšokk kestab 1–2 minutit. Ilma ujuvuse ja termilise kaitseta on ellujäämisaeg 30–60 minutit.
    - q: Millised on hüpotermia esimesed tunnused?
      a: Kontrollimatu värisemine, segadus, halb koordinatsioon, segane kõne. Lõpeta tegevus ja soojenda kohe.
    - q: Kuidas soojendada pärast külma vee sessiooni?
      a: Eemalda märjad riided, kuivata, pane selga soojad kihid, sealhulgas müts ja kindad. Joo sooje alkoholivabu jooke.
    - q: Kas ma võin suvel alajahtuda?
      a: Jah — vesi alla 15°C esineb paljudes kohtades isegi suvel. Vesi juhib soojust 25 korda kiiremini kui õhk.
