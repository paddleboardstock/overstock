  title: 'Veespordi jaoks loodete mõistmine: praktiline juhend'
  description: Kuidas looded SUPmõjutavad, surfamise ja kajakisõidu tingimusi. Loodetabelite lugemine, kevadiste ja lähimõõnade mõistmine ning treeningu planeerimine loodeliikumiste järgi ohutuse tagamiseks.
  definition: Looded on merepinna igapäevane tõus ja langus, mida põhjustab kuu ja päikese gravitatsiooniline tõmme. Loodete vahemik varieerub sõltuvalt asukohast ja kuu tsüklist.
  tldr: 'Enamikes kohtades on päevas kaks kõrget ja kaks madalat loodet. Kevadised tõusud (täiskuu/noorkuu) on suurema ulatusega ja tugevama hoovusega. Neap loodetel (veerandkuu) on väiksemad vahemikud. Loode mõjutab vee sügavust, lainete kuju ja voolu tugevust. SUPNäiteks : sõudke esmalt voolu vastu, et aidata tagasi pöörduda.'
  problem: Jõuad oma kohalikku murdepunkti ja leiad vaevu lainet, ohtlikke tõusutõusu rebeid või liiga madalat vett. Ilma loodete mõistmata raiskad reise või sõuded ohtlikes tingimustes.
  explanation: Tõusud on põhjustatud kuu gravitatsioonist. Kevadised tõusud (täis- ja noorkuu) annavad kõrgeimad ja madalaimad madalpunktid. Neap-loodeed (veerandkuu) annavad minimaalse ulatuse. Loodevoolud on kiireimad keskvee ajal, aeglasemad kõrgel ja madalal ajal. Loodete vahemik varieerub 0,3 m (Vahemere) kuni 16 m (Bay of Fundy).
  solution: 'Vaata iga sessiooni eel loodetabelit. Surfamiseks: rannapausid sobivad sageli kõige paremini 2–3 tundi mõlemal pool kõrget veeta. SUPNäiteks aeruta voolu vastu esimest poolt, et voolu abistavad tagasi tulla. Kalapüügiks: tõusev tõus surub kalad tasastele.'
  recommendation: Kasuta NOAA loodeprognoose või kohalikku looderakendust. Uuri oma kohaliku murdmise eelistust, logides tingimusi kuu aja jooksul.
  faq:
    - q: Mis on kevadine tõus?
      a: Kevadised tõusud esinevad täis- ja noorkuu ajal, põhjustades kõrgemaid tõusu ja tugevamaid hoovusi. Need esinevad kaks korda kuus.
    - q: Mis on neap tide?
      a: Neap mõõnad esinevad veerandkuu ajal. Loodete vahemik on väiksem ja voolud nõrgemad — hea algajatele.
    - q: Kas madalveed on SUPohtlikud?
      a: Madal veetase võib paljastada kive ja riffe. Samuti koondab see laineenergia järsematele liivavaldadele.
    - q: Kuidas mõjutavad tõusud rebenemisvoolusid?
      a: Väljuvad tõusud (mõõnad) tugevdavad rebenemisvoolusid. Sissetulevad tõusud (üleujutus) vähendavad rebenemisjõudu.
