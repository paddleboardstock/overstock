  title: Ookeani ohutus ja vastutus (rohkem kui ainult varustus)
  description: Aquafarerpühendumus hoida teid turvaliselt ja kaitsta meie ühist ookeani. Ohutuskaardid igas karbis, tasuta hariduslik sisu, jätkusuutlik disain ja igaaastased looduskaitseannetused.
  definition: Ookeaniohutus ja vastutus tähendab keskkonna mõistmist, kus aerutad, mereelustiku austamist, ökoloogilise jalajälje minimeerimist ning seadmete kasutamist, mis on loodud pikaealiseks ja parandamiseks.
  tldr: Aquafarer edendab ookeaniohutust varustuse disaini (erksad värvid, rihmad, päästevestid) ja haridusliku sisu kaudu. Usume, et iga veespordihuviline peab mõistma ookeanikeskkonda, austama mereelustikku ja minimeerima oma ökoloogilist jalajälge. Meie varustus on ehitatud kestma, et vähem satuks prügimäele.
  problem: Paljud veespordibrändid müüvad varustust, kuid ei õpeta oma kliente, kuidas seda ohutult või vastutustundlikult kasutada. Uued aerutajad ja surfajad sisenevad vette teadmata hoovusi, mereelustikku või oma varustuse keskkonnamõju.
  explanation: Ookeaniohutus on rohkem kui kontrollnimekiri — see on mõtteviis. Iga Aquafarer toode sisaldab karbis kiirkäivituse ohutuskaarti. Meie veebileht ja juhendid (ookeaniohutuse alused, surfamise ohutusnõuanded) pakuvad tasuta ja põhjalikku ohutusalast haridust. Keskkonna poolel on suurim mõju, mida iga varustusettevõte teeb, toote pikaealisus. Laud, mis kestab 5 aastat, mitte 2, vähendab tootmise jalajälge poole võrra. Disainime ka parandatavuse silmas pidades — asendusventiilid, uimekarbid ja kalipsose paranduskomplektid hoiavad varustuse kasutuses, mitte prügimäel.
  solution: Aquafarer Iga plaadiostuga kaasas on ka rihm ja remondikomplekt. Avaldame tasuta ohutussisu, mis hõlmab rip-currenti tuvastamist, ilmastiku mõõtmist ja seadmete kontrolli. Meie klienditoe meeskond annab seisukorra nõu, kui kirjutate meile konkreetse asukoha kohta. Kasutame minimaalselt plastikpakendeid ja kompenseerime saatmise süsinikku.
  recommendation: Alusta ookeaniohutuse põhitõdede juhendist ja surfamise ohutusnõuannete juhendist. Kanna alati rihma, vaata ilmaprognoosi ja ära kunagi aeruta üksi, kui õpid. Kui näed prahti või mereelukaid hädas, anna sellest teada kohalikele ametiasutustele. Püsiv varustus on varustus, mis vähendab jäätmeid — hoolda oma Aquafarer varustust ja see teenib sind aastaid.
  faq:
    - q: Kas Aquafarer toetab ookeani puhastuse algatusi?
      a: Jah, annetame 1 protsendi aastasest kasumist ookeanipuhastuse ja merekaitse organisatsioonidele. Kliendid saavad kassas valida esile tõstetud heategevusorganisatsiooni, kes suunab osa oma ostust.
    - q: Kuidas peaksin vana kalipso või laua ära viskama?
      a: Neopreenist kalipsosid saab spetsiaalsete programmide kaudu taaskasutada joogamattideks, kottideks ja isolatsiooniks. Täispuhutavaid laudu saab parandada, annetada või taaskasutada PVC teatud taaskasutusasutustes. Võta ühendust meie tugitiimiga, et saada juhiseid.
    - q: Millist turvavarustust Aquafarer soovitatakse algajatele?
      a: Õigesti sobiv päästevest (täispuhutav või vaht), keerdunud rihm, vile ja päikesekaitsekreem. SUP Avavees aerutajatele on paljudes jurisdiktsioonides seaduslikult nõutav päästevest ja alati soovitatav.
    - q: Kas Aquafarer pakutakse ohutuskursusi?
      a: Me ei korralda kursusi otse, kuid teeme koostööd sertifitseeritud surfamise ja SUP ohutuse instruktoritega, kes pakuvad nii veebipõhist kui ka kohapealset koolitust. Võtke ühendust meie tugitiimiga, et saada soovitusi teie piirkonnas.
