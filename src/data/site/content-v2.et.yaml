- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Surfietiketi reeglid (Kuidas mitte olla see, keda kõik vältivad)
  description: Rivistusel on reeglid ja keegi ei kirjuta neid üles. Õpi eesõigust, miks snake võib sind karistada, kuidas vabandada ja algajate vigu, mis ärritavad iga kohalikku surfarit.
  definition: 'Surfietikett on kirjutamata käitumiskoodeks, mis takistab kokkupõrkeid ja jagab laineid õiglaselt. Põhireegel: surfajal, kes on murduva laine tipu lähedal, omab eesõigust.'
  tldr: Surfaril, kes on murduva laine tipu lähedal, on eesõigus. Ära hüppa kellegi peale, ära madu (sõuda kellegi ümber, et tema lainet võtta) ja vabanda alati, kui teed vea. Sõudke laialt ümber rivi, hoia oma lauda ja ole sõbralik — austus teenib austuse.
  problem: Sa sõuded rahvarohkesse rivisse ja tunned kohe pinget. Surfarid vaatavad sind küljepealt, keegi karjub sulle ja sa ei tea, mida sa valesti tegid. Surfamise sotsiaalne pool tundub hirmutavam kui lained ise.
  explanation: 'Surfietikett on olemas, et vältida kokkupõrkeid ja jagada laineid õiglaselt. Põhireegel on eesõigus: surfaja on tipu lähedal (kus laine esimesena murdub), kellel on eelisõigus. Igaüks, kes sõudab sama laine poole seestpoolt, peab välja tõmbuma. Snake — teise surfaja ümber aerutamine, et varastada prioriteet — on halvim rikkumine. Lisaks prioriteedile on koosseisul ootused müra (karjumine minimaalne), laua kontrolli (ära lase oma laual teiste lähedale minna) ja sõbralikkusele (lihtne noogutus aitab palju).'
  solution: Jälgi rivistust 10 minutit enne aerutamist. Tuvasta, kes püüab kõige rohkem laineid — need on surfajad, keda tuleb austada ja vältida. Kui õpid, jää siseküljele (valge vee tsoon). Aeruta laialt ümber rivi, mitte läbi selle. Kui saad laine, vaata mõlemas suunas enne tõusmist ja veendu, et keegi pole sügavamal.
  recommendation: Veeda esimesed paar sessiooni algajasõbralikul pausil, kus on laiali hajutatud rahvahulk. Õpi lugema prioriteete enne, kui proovid tihedat rivistust. Kui sa kellegi juurde satud, vabanda kohe ja sõudke üle — enamik surfajaid austab ausat viga.
  faq:
    - q: Mis on sinna sattumine?
      a: Sisse kukkumine tähendab aerutamist ja laineharjal sõitmist, millel teine surfaja juba prioriteediks on. See on ohtlik ja lugupidamatu. Lainete omanik on tipu lähedal; igaüks teine peab selle ära hoidma.
    - q: Mis on madumine?
      a: Looklemine tähendab aerutamist teise surfari ümber, kes on juba lainepositsioonil, nii et jõuad tipule lähemale. Seda peetakse äärmiselt halvaks etiketiks ja see võib viia konfliktideni.
    - q: Kas algajad võivad surfata rahvarohketes pausides?
      a: Jah, aga püsi valgevee tsoonis, eemal tipust. Ära aeruta peamisse stardialasse enne, kui suudad järjepidevalt laineid püüda ja suunda kontrollida. Rahvarohked järjekorrad nõuavad kogemust, et ohutult orienteeruda.
    - q: Kuidas ma peaksin vees vabandama?
      a: Lihtne lainetus, naeratus ja "minu viga" või "vabandust" töötavad. Tunnista viga ja sõudke inimesest eemale. Surfarid on üldiselt ausate vigade suhtes andestavad, eriti kui õpid selgelt.
    - q: Mida peaksin tegema, kui keegi mulle külla tuleb?
      a: Kui see on selge sisseastumine, hüüa "lehvita" või "hei", et neid hoiatada. Kui nad kogemata tabavad ja vabandavad, lase sel minna. Kui keegi korduvalt sisse astub, sõudke üle ja selgitage viisakalt prioriteeti. Vältige kokkupõrkeid.
