  title: Mida kanda surfamiseks (ära ilmu lauapükstes, kui vajad 5/4)
  description: Lõpeta arvamine, mida selga panna. Vee temperatuur, mitte õhutemperatuur, määrab su surfiriietuse. Täielik kihistamise juhend alates troopilistest lööbekaitsetest kuni täis talviste 5/4/3mm komplektideni.
  definition: Surfiriietus ulatub soojas vees lauapükstest ja rash guardidest kuni täis 5/4/3 mm kalipsodeni, saabaste ja kapuutsideni külmas vees. Vee temperatuur, mitte õhutemperatuur, määrab, mida vajad.
  tldr: See, mida sa surfades kannad, sõltub täielikult vee temperatuurist — mitte õhutemperatuurist. Rash guardid ja lauapüksid töötavad üle 22°C, kevadised ülikonnad katavad 18-22°C, täiskomplektsed 3/2mm ülikonnad 14-18°C ja 5/4/3mm saabastega on nõutav alla 14°C. Kanna UV alati kaitset ja kaalu rihma ning löögivesti.
  problem: Jõuad randa ja ei tea, kas löövikaitsest piisab või vajad täiskostüümi. Õhutemperatuur on soe, aga vesi on külm, või vesi tundub okei, aga tuul on jäine. Valesti riietumine tähendab rikutud sessiooni.
  explanation: 'Surfuriietel on kolm eesmärki: soojusisolatsioon, UV kaitse ja kulumise ennetamine. Neopreenist kalipsod hinnatakse paksuse ja katvuse järgi — kevadised ülikonnad (lühikesed käed või jalad) on piiripealseteks päevadeks, täiskostüümid külma vee jaoks. Rash guardid kaitsevad laua lööbe ja päikese eest, kuid ei paku termilist väärtust. Saapad, kindad ja kapuutsid ei ole aksessuaarid, vaid hädavajalikud varustus külmas veesurfamises alla 12°C.'
  solution: 'Enne väljasõitu vaata kohalikku poi või elusvee temperatuuri aruannet. Koosta komplekt vastavalt oma kõige külmematele tüüpilistele tingimustele: rash guard ja lühikesed püksid suveks, 3/2mm täisülikond kevadeks ja sügiseks, 5/4/3mm koos saabaste ja kapuutsiga talveks. Lisa alati rihm ja kaalu ujuvvestit ohutuse huvides.'
  recommendation: Investeeri esmalt heasse 3/2 mm täisülikonda — see katab kõige laiema tingimuste valiku. Kui plaanid talvel surfata, lisa 5/4/3mm ülikond ja saapad. Aquafarer Wetsuit Pro koos soojusvoodriga ühendab mõlemad temperatuurivahemikud tõhusalt.
  faq:
    - q: Kas ma võin surfata ainult laualühikestes pükstes?
      a: Jah, troopilises vees üle 24°C. Võid soovida rash guard'i, et vältida rindkere ja käe hõõrdumist aerutamisel. Vaha või veoalus laual aitab kompenseerida ülikonna haardepuudust.
    - q: Kas mul on surfisaapaid vaja?
      a: Kui vee temperatuur langeb alla 14°C, takistavad saapad tuimust ja kaitsevad jalgu kivide ja korallrahude lõigete eest. Need lisavad ka haarduvust lauale. Enamik põhjamaise kliima surfajaid kasutab saapaid novembrist märtsini.
    - q: Mis on kevadülikond?
      a: Kevadülikond on lühikese käega või lühikese säärega märgkostüüm (või mõlemad), mis on mõeldud vee jaoks 18°C kuni 22°C. See pakub rohkem soojust kui rash guard, kuid vähem katvust kui täiskostüüm.
    - q: Kas peaksin surfamise ajal kandma päästevesti?
      a: Mitte traditsioonilised päästevestid, kuid löögivest või ujumisabivahend võib aidata karmides tingimustes või nõrga ujujaga.Aquafarer Päästevestid on mõeldud SUP kajakisõiduks, kuid pakuvad surfamise algajatele lisakindlust ujumiseks.
