  title: 'Giid SUP : vali õige laud pikamaa aerutamiseks'
  description: Touring SUPs on pikemad, kitsamad ja mõeldud kiiruseks ning liuglemiseks. Kuidas valida turismilaud, oluline varustus pikkade aerutamiste jaoks ja tehnika distantsi tõhusaks läbimiseks.
  definition: Touring SUP on pikk (12–14'), kitsas (30–32') laud, mis on loodud tõhusaks aerutamiseks üle distantsi. Omaduste hulka kuuluvad nina, mis lõikab läbi vee, pikem veeliin liuglemiseks ning sageli ka bengee-kaubasüsteem.
  tldr: 'Touring SUPs eelistab kiirust ja jälgimist stabiilsuse asemel. Minimaalselt 12'' pikkus efektiivsuse huvides, 30–32" laius libisemise ja stabiilsuse tasakaalustamiseks. Peamised omadused: ninanina, sirge kontuur, mitme uimede seadistus. Oluline varustus: PFDrihm, vesi, telefon ja bengee süsteem varustuse jaoks. Tehnika keskendub pikkadele, sujuvatele löökidele koos kere pöörlemisega.'
  problem: Pika vahemaa sõidul mitmekülgse lauaga aerutamine jätab sind väsinuks. Lai nina püüab lõike, laud ei liigu sirgelt ja sa kulutad rohkem energiat roolimisele kui liuglemisele. Sul on vaja lauda, mis on mõeldud distantsiks.
  explanation: Touring SUPs kasutab vee ninaosa (nina, mis hajutab vee laiali, mitte ei sõida selle kohal, vähendades oluliselt takistust. Pikem veejoon suurendab kere kiirust. Kitsam laius vähendab takistust, kuid nõuab paremat tasakaalu. Touring-laudadel on pikemad uimed suunastabiilsuse tagamiseks. Täispuhutavad turismilauad vajavad jäikuse PSI säilitamiseks ja energiaraiskamise vältimiseks kõrgemat (18–20) uimed.
  solution: 'Vali vähemalt 12 jalga pikk turismilaud ninaga. Laius: 30" kogenud aerutajatele, 31-32" vahepealsetele aerutajatele. Otsi keskuimega kasti koos külghambadega stabiilsuse tagamiseks. Täida maksimaalse PSIvõimsuseni. Varustada bungee cargo PFDkinnitusega, vile ja telefoniga veekindlas korpuses.'
  recommendation: Aquafarer SUP Tour 12 mõõtmetega 12' x 31" x 6" on ideaalne turismi täispuhutav seade. Selle töömahuga nina lõikab tõhusalt ja bungee süsteem hoiab varustust päevareisideks. Kombineeri Aquafarer süsinikaeruga tõhusaks pikamaasõiduks.
  faq:
    - q: Kas ma saan kasutada kõikehõlmavat lauda matkamiseks?
      a: Lühikestel sõitudel alla 5 km jah. Pikematel distantsidel väsitavad laiem nina ja lühem veejoon kiiremini.
    - q: Millise pikkusega matka SUP mul vaja on?
      a: 12' on turismiefektiivsuse miinimum. 12'6" on hea vahepealne pikkus. 14' on võidusõiduks ja edasijõudnute turismijooksuks.
    - q: Kas täispuhutav reisimine SUPs toimib sama hästi kui kõvad lauad?
      a: Tänapäevased drop-stitch täispuhutavad seadmed PSI kõrgel tasemel toimivad sarnaselt kõvadele laudadele matkamiseks. Kerge painduvus võib tegelikult olla mugavam lõikes.
    - q: Milline aerutamine on parim matkamiseks?
      a: Kerge süsinik- või klaaskiust aeru, millel on suurem tera (100–110 ruuttolli) võimsuse tagamiseks. Reguleeritav aer võimaldab vahetada matka ja surfamise vahel.
