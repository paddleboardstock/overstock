  title: 'Täispuhutav SUP remont: Paranda torvendeid, lekkeid ja klapiprobleeme'
  description: SUP Isetehtud täispuhutava remondijuhend. Kuidas leida aeglane lekkekoht, parandada torvend, vahetada ventiil ja parandada terrassipadja delaminatsioone kaasasoleva remondikomplektiga.
  definition: Täispuhutava SUP remont hõlmab õhulekete leidmist seebiveega testimise kaudu, kahjustatud piirkonna puhastamist ja karedaks muutmist, PVC liimi ja plaastri pealekandmist ning surve all kõvenemist.
  tldr: Leia lekked seebiveega. Puhasta ja kareda torke ümbrus liivapaberiga. Kanna PVC liimi nii plaastri kui plaadile, oota 5 minutit, vajuta tugevalt ja kõvene raskuse all 24 tundi. Klapilekete korral kontrolli esmalt O-rõngast. Väikesed torvendid alla 1/4" on lihtsad isetehtud parandamiseks.
  problem: Sa täidad selle SUP ja hommikuks on rõhk kadunud. Ilma remonditeadmiseta seisad silmitsi kalli asendusega, mis tõenäoliselt on lihtne torvend.
  explanation: 'Enamik täispuhutavaid SUPs kasutab drop-stitch südamikku, millel PVC on välimised kihid. Läbilõige PVC välisküljel tekitab aeglase lekke. Tavaline parandus: puhastamine, lihvimine, liimi PVCpealekandmine, surve plaastri surumine raskuse all. Klapi lekked on tavalisemad kui paneeli läbimurded — O-rõngas kuivab või praht takistab tihendamist.'
  solution: Täida laud PSI maksimaalselt ja kuula susinat. Pihusta seebivett süsteemselt, eriti õmbluste ja ventiili ümber. Märgi mullitavad kohad. Tühjenda, puhasta alkoholiga, lihvi 80-karedusega, kanna PVC liimi plaastri ja laua peale, oota, kuni see on kleepuv, vajuta kindlalt, kaalu 24 tundi.
  recommendation: Kasuta Aquafarer kõigi laudadega kaasas olevat remondikomplekti Aquafarer . Alati kanna remondikomplekti kaasas reisidel. Klapiprobleemide korral pöördu Aquafarer toe poole. Suurte rebendite või õmbluste eraldumise korral soovitatakse professionaalset parandamist.
  faq:
    - q: Kas ma saan parandada oma täispuhutava suure SUPrebendi?
      a: Rebendid üle 1\" võivad vajada professionaalset parandust või plaastrit mõlemale küljele. Rööbaste õmblusvahed ei ole usaldusväärselt välitingimustes parandatavad.
    - q: Kui kaua remondiplaaster kestab?
      a: Õige remont õige tehnikaga kestab plaadi eluiga. Halb nakkuvus ebapiisava puhastuse tõttu põhjustab tulevasi rikkeid.
    - q: Kas ma saan lekkivat ventiili parandada?
      a: Sageli jah. Eemalda klapisüdamik, kontrolli O-rõngas, puhasta või vaheta see, kanna silikoonmäärdeainet ja paigalda uuesti.
    - q: Mis siis, kui ma ei leia leket?
      a: Täida täis PSI ja kasta sektsioonid järjestikku vanni või basseini. Liiga väikesed lekked võivad olla seotud temperatuuriga.
