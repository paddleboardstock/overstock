  title: 'Täispuhutav SUP hoiustamine: õige viis oma iSUPi hoiustamiseks'
  description: Õige täispuhutav SUP hoiustamine hoiab ära ladestumise, UV kahjustuste, hallituse ja klappide lekke. Talvine hoiustamine, pikaajaline hoiustamine ja igapäevased hoiustamisnõuanded drop-stitch laudadele.
  definition: Täispuhutav SUP hoiustamine tähendab, et laud hoitakse puhtas, kuivas ja temperatuurikontrollitud keskkonnas, UVeemal äärmuslikest temperatuuridest ja füüsilistest kahjustustest.
  tldr: Hoia jahedas, pimedas kohas, alla 30°C, eemal otsesest päikesevalgusest. Lühiajaliselt (1–2 nädalat) hoia osaliselt täispuhutud temperatuuril 8–10 PSIkraadi. Pikaajaliseks hoiustamiseks tühjenda täielikult, rulli lõdvalt ja pane hoiukotti. Ära kunagi hoia märjana. Hoia eemale närilistest ja teravatest esemetest.
  problem: Tühjendad SUP selle ja paned selle kuuma garaaži või niiske keldrisse. Kolm kuud hiljem PVC on see kollane, terrassipadjad kooruvad ja ventiil lekib. Vale hoiustamine põhjustab rohkem kahju kui tavakasutus.
  explanation: Kuumus üle 50°C põhjustab PVC plastifikaatorite liikumise, muutes materjali jäigaks ja rabedaks.UV Kiirgus lagundab polümeerisidemeid. Sees kinni jäänud niiskus tekitab hallitust. Külm alla nulli muudab PVC hapraks. Tiheda voltimise survepunktid tekitavad püsivaid volte.
  solution: 'Lühiajaline hoiustamine: loputa, kuivata, täida 10 PSIkraadini ja hoia maapinnast eemal varjulises kohas. Pikaajaline hoiustamine: puhasta põhjalikult, kuivata täielikult, tühjenda täielikult, rulli terrassipadjaga väljapoole, pane kotti, hoia jahedas kuivas kapis. Hoia eemale kemikaalidest ja kahjuritest.'
  recommendation: Kasuta Aquafarer kandekotti hoiustamiseks — see UV blokeerib ja takistab kriimustusi. Hoia kliimakontrolliga ruumis. Lisa koti sisse kuivatuskott niiskete keskkondade jaoks.
  faq:
    - q: Kas ma saan oma SUP täispuhutud seadmeid garaažis hoida?
      a: Ainult siis, kui garaaž jääb alla 30°C ja pole otsest päikesevalgust. Enamik garaaže ületab suvel 40°C.
    - q: Kas peaksin oma kotis SUP hoidma?
      a: Jah, kott kaitseb tolmu UVja füüsilise kahjustuse eest. Veendu, et laud on enne kotistamist täiesti kuiv.
    - q: Kas külmutamine võib kahjustada täispuhutavat SUPseadet?
      a: Jah. Alla nulli, PVC muutub rabedaks ja võib lahtirullimisel või täispuhumisel praguneda. Hoia alati üle 5°C.
    - q: Kuidas ma peaksin oma SUP hoiustamiseks rullima?
      a: Rulli nii, et tekipadja on väljapoole suunatud, et kaitsta põhjaPVC. Väldi tihedaid volte. Vaheta voltimisasendit iga kord.
