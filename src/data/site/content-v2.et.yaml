- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Kalipso remont: paranda ise rebendid, õmblused ja tõmblukud'
  description: DIY kalipso remondijuhend neopreenist rebendite, õmbluste eraldumise, luku kinnistumise ja lõhestatud põlvekaitsmete jaoks. Samm-sammult juhised neopreentsementi kasutades.
  definition: Kalipso remont hõlmab kahjustatud ala puhastamist ja karedaks muutmist, neopreentsementi pealekandmist ning surve all kõvenemist, et taastada veekindel terviklikkus ja paindlikkus.
  tldr: 'Väikesed rebendid alla 1" suurused: kanna mõlemale küljele neopreentsementi, oota 10–15 minutit, kuni muutub kleepuvaks, suru kindlalt, kõvene raskuse all 12 tundi. Suuremate rebendite puhul on vaja neopreenist plaastrit. Tõmbluku probleemid: määri esmalt määrdeainet, siis kontrolli kangakinnisusi.'
  problem: Sinu kalipsul on väike rebend, õmblus eraldub või lukk jääb kinni. Ilma isetehtud remondita maksad asenduse eest 150+ dollarit, kuigi parandamine maksab 5 dollarit.
  explanation: Neopreentsement toimib, pehmendades neopreenist pinda, luues keemilise sideme, kui lahusti aurustub. Tsement tuleb kanda mõlemale pinnale ja muutuda kleepuvaks enne ühendamist. Rebendite puhul peavad servad täpselt joonduma. Tõmbluku probleemid on sageli soolakorrosioon või kangas, mis jääb hammaste vahele kinni.
  solution: 'Pisarate puhul: puhasta alkoholiga, lihvi õrnalt, kanna õhuke tsementkiht mõlemale servale, oota, kuni kleepuv on, suru täiuslikult kokku, rakenda raskust, kõvene 12–24 tundi. Plaastrite puhul: lõika 1" suurem plaaster kui rebend, kanna mõlemale tsement, klamber. Luku jaoks: loputa, kanna lukuga vaha, tööta õrnalt.'
  recommendation: Hoia Aquafarer kalipso remondikomplekti varustuskotis. Suurte remonditööde või kriitiliste õmbluste rikete korral soovitatakse professionaalset parandamist.
  faq:
    - q: Kas ma võin kasutada superliimi kalipsul?
      a: Ei — superliim kuivab kõvaks ja rabedaks. Kasuta kalipsu remondiks ainult neopreentsementi või akvatiivi.
    - q: Kui kaua kestab neopreentsementi parandus?
      a: Korralikult tehtud remont on sageli tugevam kui originaalne neopreen ja kestab ülikonna ülejäänud eluea lõpuni.
    - q: Kas ma saan parandada luku, mis on täielikult lahti tulnud?
      a: Kui rada on neopreenist eraldunud, liimi uuesti kontakttsementiga. Kui hambad on kahjustatud, vaheta lukk professionaalselt.
    - q: Kuidas parandada kalipsot, mis lekib õmbluse juures?
      a: Kanna lekkiva õmbluse siseküljele õhuke Aquaseali helm ja lase 24 tundi kuivada.
