- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm märgkostüüm: Mida enamik algajaid külmas vees valesti teevad'
  description: Lõpeta sessiooni keskel külmumine või rannas ülekuumenemine. Tõeline erinevus 3mm ja 5mm kalipsode vahel — temperatuuritabel, paindlikkuse kompromissid ja see, mis tegelikult töötab külma vee surfamisel.
  definition: Kalipso on neopreenist rõivas, mis hoiab naha vastu õhukese veekihi, mida kehasoojus soojustamiseks soojendab. Paksus (3mm, 5mm) määrab, millise temperatuurivahemiku ülikond suudab taluda — paksem on soojem, kuid vähem paindlik.
  tldr: Kalipsu paksus määrab otseselt soojuse ja paindlikkuse. Kasuta 3mm vee jaoks üle 16°C ja 5mm vee puhul vahemikus 8°C kuni 16°C. Paksemad ülikonnad piiravad liikumist, kuid hoiavad kauem soojas — alati eelistab sobivust brändile.
  problem: Avad veebipoe või astud surfipoodi ja näed märgkostüüme, millel on silt 3/2, 4/3, 5/4 ja 5mm täisülikonnad. Numbrid ei tähenda palju, kuni mõistad, et vale paksus tähendab kas sessiooni keskel külmumist või rannas ülekuumenemist ja higistamist.
  explanation: Kalipso töötab nii, et naha ja neopreeni vahele jääb õhuke veekiht; keha soojendab seda vett, luues isolatsiooni. Paksem neopreen püüab rohkem vett kinni, kuid piirab paindlikkust ja ujuvust. 3mm ülikond (tihti 3/2 õhemate kätega) sobib leebetele tingimustele, samas kui 5mm (5/4/3 või täispikk 5mm) sobib külma vee jaoks. Rinnalukuga sisenemiskostüümid sulguvad paremini kui tagumine luku ja vähendavad punetamist. Õmblus — liimitud ja pimeõmblustega (GBS) — on vahe lekkiva ülikonna ja sooja vahel.
  solution: Võrdle paksus oma kohaliku veetemperatuuriga, kasutades 5°C veamarginaali. Parasvöötme kliima jaoks osta 3/2 mm. Külma vee jaoks osta 5/4/3 mm. Lisa saapad, kindad ja kapuuts, et pikendada sõiduulatust veel 5°C võrra allapoole. Proovi enne ostmist ülikondi või vali bränd, millel on helde tagastuspoliitika.
  recommendation: 5 Aquafarer /4/3 mm Wetsuit Pro sobib ideaalselt enamikule külma vee surfajatele, pakkudes GBS-õmblusi ja termilist voodrit. Kui surfad soojas vees üle 20°C, on 3/2 mm rinnalukuga parem valik.
  faq:
    - q: Milline veetemperatuur nõuab 5 mm kalipsot?
      a: Veetemperatuurid vahemikus 8°C kuni 14°C nõuavad 5mm ülikonda. Alla 8°C on vaja 6/5/4 mm kapuutsiga ülikonda. 14°C ja 18°C vahel sobib 4/3mm enamiku inimeste jaoks hästi.
    - q: Kas ma võin talvel kanda 3mm kalipsot?
      a: Ainult leebtes talvekliimades, kus vesi püsib üle 16°C. Päris talviseks surfamiseks on vaja 5 mm või 5/4/3 mm. Saapad, kindad ja kapuuts lisavad samaväärset soojust, ilma et oleks vaja paksemat torsot.
    - q: Kui kitsas peaks kalipso olema?
      a: Tihe, kuid mitte piirav. Õhutaskuid ega lahtist neopreeni ei tohiks olla. Kui saad sõrme naha ja ülikonna alaselja vahele libistada, on see liiga lõtv. Kui hingamine on raske või liikumine on tugevalt piiratud, suurenda suurust.
    - q: Kas kallid kalipsod hoiavad sind soojemana?
      a: Kõrgem hind tähendab sageli paremat neopreeni (lubjakivipõhine võrreldes naftaga), paremat õmbluskonstruktsiooni (GBS vs ainult liimitud) ja paremat painduvust. Need tegurid mõjutavad otseselt soojust ja vastupidavust, kuid ainult siis, kui sobivus on õige.
