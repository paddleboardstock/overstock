- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hidratacija i zaštita od sunca: Ostanite bezbedni na vodi'
  description: Esencijalne strategije hidratacije i zaštite od sunca za SUP veslače. Dehidracija i opekotine od sunca su SUP najčešći problemi - kako sprečiti oboje tokom dugih sesija.
  definition: SUP Hidratacija znači održavanje ravnoteže tečnosti tokom veslanja kroz redovni unos vode. Zaštita od sunca uključuje primenu SPF-a, zaštitnu odeću i vremenske sesije kako bi se izbegao vrhunacUV.
  tldr: Pijte 500ml vode na sat veslanja. Ponesite više nego što mislite da vam je potrebno - 2L bešike ili više boca. Nanesite+ vodootpornu kremu za sunčanje SPF 50 pre veslanja i ponovo nanesite svaka 2 sata. Nosite šešir, sunčane naočare sa kaišem i odeću sa ocenom UPF. Izbegavajte veslanje od 11 do 15 časova kada UV je najjači.
  problem: Imate SUP sjajnu sesiju, ali nakon sat vremena imate glavobolju, suva usta, a koža gori. Dehidracija i opekotine od sunca prikradaju vam se jer vas voda hladi.
  explanation: Refleksija od vode pojačava UV izloženost do 40%. Efekat hlađenja vode i povetarca maskira opekotine od sunca dok ne bude prekasno. Znoj od veslanja povećava gubitak tečnosti, a često nema gde da se napuni voda na vodi. Dehidracija narušava ravnotežu i donošenje odluka, povećavajući rizik od nesreća.
  solution: Pričvrstite bocu vode ili hidratacijsku bešiku na bungee sistem ploče. Pijte svakih 15 minuta bez obzira da li ste žedni ili ne. Nanesite+ SPF 50 kremu za sunčanje 30 minuta pre lansiranja. Nosite šešir sa širokim obodom, polarizovane sunčane naočare sa kaišem i+ UPF 50 štitnik od osipa. Ponovo nanesite kremu za sunčanje svakih 2 sata.
  recommendation: Koristite hidratacijsku bešiku vezanu za prednje D-prstenove Aquafarer SUPvašeg. Nosite+ UPF 50 štitnik od osipa ispod vašeg PFD. Koristite vodootpornu kremu za sunčanje koja ostaje u znoju i vodi.
  faq:
    - q: Koliko vode treba da ponesem na SUP putovanje?
      a: Minimalno 1 litar na sat. Za 2-satnu sesiju donesite 2 litre. Više u vrućem vremenu. Hidrataciona bešika najbolje funkcioniše.
    - q: Koja vrsta kreme za sunčanje je najbolje zaSUP?
      a: Vodootporan, SPF 50+ širokog spektra. Mineralne kreme za sunčanje (cink oksid, titanijum dioksid) su sigurne za grebene i traju duže.
    - q: Da li voda zaista odražavaUV?
      a: Da - voda reflektuje do 40% UV radijacije, što znači da dobijate UV odozgo i odozdo. Ovo značajno povećava rizik od opekotina.
    - q: Mogu li se opekotine od sunca kroz osip?
      a: Standardni štitnici od osipa pružaju UV minimalnu zaštitu (oko UPF 10-20). Potražite+ UPF 50 ocenjenu odeću za potpunu zaštitu.
