- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Šta da obučem za surfovanje (ne pojavljuju se u šorts-u kada vam je potreban 5/4)
  description: Prestanite da pogađate šta da obučete. Temperatura vode, a ne temperatura vazduha, određuje vašu odeću za surfovanje. Kompletan vodič za slojeve od tropskih štitnika od osipa do punih zimskih postavki 5/4/3mm.
  definition: Odjeća za surfovanje kreće se od kratkih hlača i štitnika od osipa u toploj vodi do punih 5/4 / 3mm ronilačkih odela sa čizmama i kapuljačama u hladnoj vodi. Temperatura vode, a ne temperatura vazduha, određuje šta vam je potrebno.
  tldr: Ono što nosite za surfovanje u potpunosti zavisi od temperature vode - a ne od temperature vazduha. Štitnici od osipa i kratke hlače rade iznad 22 ° C, opružna odela pokrivaju 18-22 ° C, puna 3/2 mm odela drže 14-18 ° C, a 5/4 / 3 mm sa čizmama je potrebno ispod 14 ° C. Uvek nosite UV zaštitu i razmislite o povodcu i prsluku od udara.
  problem: Stižete na plažu i nemate pojma da li je dovoljan osip ili vam je potrebno potpuno ronilačko odelo. Temperatura vazduha je topla, ali voda je hladna, ili se voda oseća u redu, ali vetar se smrzava. Pogrešno oblačenje znači uništenu sesiju.
  explanation: 'Odjeća za surfovanje služi u tri svrhe: toplotna izolacija UV , zaštita i sprečavanje abrazije. Neoprenska odela su ocenjena po debljini i pokrivenosti - prolećna odela (kratke ruke ili noge) su za granične dane, puna odela za hladnu vodu. Štitnici od osipa štite od osipa i sunca, ali ne nude toplotnu vrednost. Čizme, rukavice i kapuljače nisu dodaci, već neophodna oprema za surfovanje u hladnoj vodi ispod 12 ° C.'
  solution: 'Proverite lokalnu bovu ili izveštaj o temperaturi žive vode pre nego što krenete. Napravite komplet zasnovan na vašem najhladnijem tipičnom stanju: osip štitnik i kratke hlače za leto, 3/2mm puno odelo za proleće i jesen, 5/4/3mm sa čizmama i kapuljačom za zimu. Uvek dodajte povodac i razmislite o plutajućem prsluku za bezbednost.'
  recommendation: Prvo investirajte u dobro 3/2mm puno odelo - pokriva najširi spektar uslova. Dodajte 5/4/3mm odelo i čizme ako planirate da surfujete tokom zime. Aquafarer Ronilačko odelo Pro sa termalnom oblogom efikasno premošćuje oba temperaturna opsega.
  faq:
    - q: Mogu li surfovati samo u kratkim hlačama?
      a: Da, u tropskim vodama iznad 24 ° C. Možda ćete želeti štitnik od osipa kako biste sprečili trljanje grudi i ruku od veslanja. Vosak ili vučna podloga na dasci pomaže da se nadoknadi nedostatak prianjanja odela.
    - q: Da li su mi potrebne čizme za surfovanje?
      a: Ako temperatura vode padne ispod 14 ° C, čizme sprečavaju ukočenost i štite stopala od kamenja i posekotina grebena. Oni takođe dodaju vuču na dasci. Većina surfera u severnim klimatskim uslovima koristi čizme od novembra do marta.
    - q: Šta je prolećno odelo?
      a: Prolećno odelo je odelo sa kratkim rukama ili kratkim nogama (ili oboje) dizajnirano za vodu između 18 ° C i 22 ° C. Nudi više topline od štitnika od osipa, ali manje pokrivenosti od punog odela.
    - q: Da li treba da nosim prsluk za spašavanje dok surfujem?
      a: Ne tradicionalni prsluci za spašavanje, ali udarni prsluk ili pomoć za plutanje mogu pomoći u teškim uslovima ili ako ste slab plivač.Aquafarer Prsluci za spašavanje su SUP dizajnirani za i kajak, ali mogu pružiti dodatno poverenje u flotaciju za početnike surfa.
