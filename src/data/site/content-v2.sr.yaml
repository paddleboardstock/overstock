- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard vs Shortboard (Iskren odgovor niko vam ne daje)
  description: Longboards hvataju više talasa; kratke ploče postaju teže. Pravo pitanje je koji odgovara vašoj veštini i lokalnim pauzama. Iskreno poređenje koje pokriva stabilnost, broj talasa i zamku progresije.
  definition: Longboards (KSNUMKSft+) daje prioritet stabilnosti i lakoću hvatanja talasa; Kratke ploče (KSNUMKS-KSNUMKSft) daju prioritet upravljivosti i performanse na strmim talasima. Pravi izbor zavisi od vašeg nivoa veštine i lokalnih tipova talasa.
  tldr: Longboards (9ft+) su stabilni, lako hvataju talase i odgovaraju početnicima i surferima orijentisanim na krstarenje. Kratke daske (5-7ft) reaguju, brže na talasu i odgovaraju naprednim surferima. Pravi izbor zavisi od vašeg nivoa veštine, tipa talasa i onoga što najviše uživate u surfovanju.
  problem: Vidite video snimke surfera koji rade oštre zavoje na shortboardima i longboardera koji graciozno klize duž nosa - oba izgledaju zabavno. Imate budžet samo za jednu vrstu daske i morate znati koji stil odgovara vašim ciljevima i lokalnim pauzama.
  explanation: 'Longboardi imaju veću površinu, što znači da veslaju brže, hvataju talase ranije i pružaju stabilnu platformu za hodanje i unakrsno koračanje. Oni se ističu u malim, sporim talasima gde bi tabla potonula. Kratke ploče imaju manji volumen i agresivniji rocker, što im omogućava da potonu dublje u talasno lice, generišu brzinu kroz krivine i uklapaju se u strme, šuplje delove. Kratke ploče zahtevaju snažno veslanje i precizno vreme talasa. Uobičajena zabluda: kratke ploče nisu "bolje" - to su jednostavno različiti alati za različite uslove i nivoe veština.'
  solution: Ako ste početnik, vozite longboard (ili veliki volumen na naduvavanje) najmanje 6 meseci. Ako ste srednji i vaši lokalni talasi su često mali i spori, longboard ili hibrid će uhvatiti više talasa i biti zabavniji. Ako su vaši talasi su strmi, šuplji, i brzo, kratka tabla postaje neophodno da stane u džep. Mnogi srednji surferi održavaju i biraju na osnovu dana.
  recommendation: Počnite sa Aquafarer Surfboard Pro kao platformom u stilu longboard-a. Kada se dosledno okrećete i generišete brzinu, razmislite o dodavanju hibrida ili kratke daske za strme talasne dane. Većina surfera koji pokušavaju da prerano skrate tablu završe frustrirani i voze manje talasa.
  faq:
    - q: Da li je longboard lakše voziti nego shortboard?
      a: Mnogo lakše. Longboards uhvatiti talase ranije, veslo brže, i stabilniji su tokom pop-up i trim. Kratke table zahtevaju precizan tajming, jače veslanje, i bolju talas presudu.
    - q: Da li možete da uradite skretanja na longboardu?
      a: Da, iako je stil drugačiji. Longboard skretanja su širi, glatkiji, i uključuju celo telo. Nose jahanje, cutbacks, i visi-petice su longboard-specifični manevri sa sopstvenim napredovanjem veština.
    - q: Koja ploča je bolja za male talase?
      a: Longboards i hibridi bolje obavljaju u malim, slabim talasima jer generišu klizanje i održavaju zamah. Shortboards treba strmije, snažnije talase za obavljanje.
    - q: Da li je tabla teže veslati?
      a: Znatno teže. Niža zapremina znači da odbor sedi niže u vodi, stvarajući više otpora. Veslanje na tabli je kao plivanje sa padobranom za povlačenje u poređenju sa veslanjem na longboardu.
