  definition: Aquafarer i iRocker su oba brenda na naduvavanje srednjeg tržišta SUP . iRocker (Tahe Outdoors) nudi širok asortiman proizvoda;Aquafarer fokusira se na manje modela sa vrhunskim materijalima.
