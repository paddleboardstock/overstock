- slug: types-of-surfboards-explained
  category: guide
  type: technical
  title: Objašnjene vrste dasaka za surfovanje (koji je pravi za vas?)
  description: Shortboard, longboard, riba, hibrid, pena — još ste zbunjeni? Ovde je svaki tip daske za surfovanje raščlanjen po tome za koga je, koji talasi su mu potrebni, i koji treba prvo kupiti.
  definition: Glavni tipovi daske za surfovanje su daske (9ft+, stabilan, lako), kratke daske (5-7ft, odzivan, napredni), pena / naduvavanje (veliki volumen, početnik-siguran) i hibridi (7-9ft, svestran sredina tačka). Svaki odgovara različitim nivoima veština i uslovima talasa.
  tldr: Četiri glavne vrste daske za surfovanje su kratke daske (performanse, mala zapremina), longboards (stabilna, krstarenje), pena / naduvavanje (početnik-prijateljski, veliki volumen), i hibridi ili funboards (srednje dužine svestranost). Svaki tip odgovara različitom nivou veštine i stil surfovanja. Izaberite svoju ploču na osnovu toga gde se nalazite u krivoj učenja i kakvu vožnju najviše uživate.
  problem: 'Imena daske za surfovanje su zbunjujuća: mini-mal, jaje, riba, pištolj, hibrid, retro blizanac — lista se nastavlja. Želite da znate koji tip daske odgovara vašem nivou veštine i lokalnim talasima bez kupovine pet različitih dasaka da biste to shvatili.'
  explanation: Longboards su 9 stopa i više, debeli, sa zaobljenim nosom - oni hvataju talase rano i veslaju bez napora. Shortboards su 5-7 metara sa šiljastim nosom i agresivnim rocker - oni zahtevaju snažno veslanje i preciznu tehniku, ali nude maksimalne performanse. Pena i naduvavanje daske oponašaju Longboard oblike u velikim paketima, ali su mekši i sigurniji. Hibridi (funboards, jaja) sede između 7 i 9 metara i mešaju veslo lakoću sa sposobnošću okretanja. Riblje ploče su kratke i široke sa lastinim repom, izgrađen za manje talase.
  solution: Identifikujte svoj lokalni tip talasa - spore pauze na plaži odgovaraju longboardima i hibridima; strmiji greben ili tačka pauze rade sa kratkim daskama. Uporedite ploču sa talasom, a ne sa onim što izgleda kul. Početnici bi trebalo da podrazumevaju oblik longboarda sa velikom jačinom zvuka, a zatim istražuju kraće oblike kako se njihova veština razvija.
  recommendation: Za većinu surfera, hibrid ili funboard oko 7'6 "do 8'6" je najbolji tobolac sa jednom pločom. Aquafarer Surfboard Pro na 10'6 "je duži, ali nudi stabilnost longboard sa prenosivošću na naduvavanje. Koristite ga kao primarni odbor za prvu godinu.
  faq:
    - q: Koja je najlakša daska za surfovanje za vožnju?
      a: Longboard (9ft+) ili veliki volumen na naduvavanje kao Aquafarer što je Surfboard Pro. Ove ploče uhvatiti talase rano i pružaju stabilnu platformu za učenje pop-up prozora i težine pomeranje.
    - q: Kada treba da pređem sa longboarda na shortboard?
      a: Nakon što možete dosledno da uhvatite zelene talase, napravite donje zavoje i podrežite duž talasa na vašem longboardu. Žurba prekidača je najčešća greška - očekujte da ćete provesti 6-12 meseci na longboardu.
    - q: Za šta je riblja daska za surfovanje?
      a: Riblje ploče su dizajnirane za male, kašaste talase. Njihova kratka dužina i širok obris generišu brzinu na kojoj bi tipična tabla odugovlačila. Oni su odlična druga ploča za srednje surfere.
    - q: Da li su naduvavanje daske za surfovanje dobro?
      a: Moderni gumenjaci sa drop-stitch izgradnjom rivalske pene Longboards u krutosti i performansi. Oni su idealni za početnike i putnike, jer se pakuju u ranac i da su skoro neuništivi.
