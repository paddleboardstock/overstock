  title: 'Skladištenje na naduvavanje SUP : pravi način za čuvanje vašeg iSUP-a'
  description: Pravilno SUP naduvavanje skladištenje sprečava raslojavanje, UV oštećenja, buđ i curenje ventila. Zimsko skladištenje, dugoročno skladištenje i saveti za svakodnevno skladištenje drop-stitch ploča.
  definition: Skladištenje na naduvavanje SUP znači držanje ploče u čistom, suvom, temperaturno kontrolisanom okruženju daleko od UVekstremnih temperatura i fizičkih oštećenja.
  tldr: Čuvati na hladnom i tamnom mestu ispod 30 C daleko od direktne sunčeve svetlosti. Za kratkotrajno (1-2 nedelje), čuvati delimično naduvane na 8-10 PSI. Za dugotrajno skladištenje, potpuno ispuhati, lagano rolati i staviti u torbu za skladištenje. Nikada ne čuvati mokro. Držati dalje od glodara i oštrih predmeta.
  problem: Ispuhate svoj SUP i stavi ga u vrelu garažu ili vlažnom podrumu. Tri meseca kasnije, PVC je požuteo, paluba podloga se ljušti, a ventil curi. Nepravilno skladištenje izaziva više štete od redovne upotrebe.
  explanation: Toplota preko 50 C izaziva PVC plastifikatore da migriraju, čineći materijal krut i krt.UV Zračenje razbija polimerne veze. Vlaga zarobljena unutra stvara buđ. Hladno ispod smrzavanja čini PVC krta. Tačke pritiska od čvrstog savijanja stvaraju trajne nabore.
  solution: 'Kratkoročno skladištenje: isperite, osušite, naduvajte na 10 PSIi čuvajte sa zemlje u osenčenom prostoru. Dugotrajno skladištenje: temeljito očistite, potpuno osušite, potpuno ispuhate, kotrljajte sa palubom prema spolja, stavite u torbu, čuvajte u hladnom suvom ormaru. Držite dalje od hemikalija i štetočina.'
  recommendation: Koristite Aquafarer torbu za skladištenje - blokira UV i sprečava ogrebotine. Čuvati u klimatizovanoj prostoriji. Dodajte paket za sušenje unutar torbe za vlažna okruženja.
  faq:
    - q: Mogu li da skladištim SUP naduvane u garaži?
      a: Samo ako garaža ostane ispod 30 C i nema direktnu sunčevu svetlost. Većina garaža prelazi 40 C u leto.
    - q: Da li treba da čuvam SUP svoj u torbi?
      a: Da, torba štiti od prašine UVi fizičkih oštećenja. Uverite se da je ploča potpuno suva pre pakovanja.
    - q: Može li zamrzavanje oštetiti naduvavanjeSUP?
      a: Da. Ispod smrzavanja, PVC postaje krta i može da pukne kada se odmota ili naduva. Uvek čuvati iznad 5 C.
    - q: Kako da se kotrljam SUP za skladištenje?
      a: Roll sa palube pad okrenut prema spolja da zaštiti dnoPVC. Izbegavajte uske nabore. Zamenite položaj puta svaki put.
