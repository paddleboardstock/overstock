  title: 'Bezbednost surfovanja: 7 grešaka koje uzrokuju 90% početnika nesreća'
  description: Većina surf nesreća se može sprečiti. Saznajte 7 kritične bezbednosne greške početnici čine, kako uočiti rip struje pre veslanja, i provere opreme koje spašavaju živote.
  definition: Surf bezbednost znači razumevanje rip struje (kanali vode teče prema moru), nikada surfovanje sama, provera opreme pre svake sesije, i usklađivanje uslova sa vašim nivoom veštine. Većina nesreća se može sprečiti sa osnovnim znanjem.
  tldr: Proverite uslove za surfovanje i vreme pre nego što veslate. Naučite da identifikujete rip struje - izgledaju kao mirni, tamni kanali između talasa koji se lome. Nikada ne surfujte sami, uvek se zagrejte na plaži i pregledajte povodac i dasku na oštećenja pre svake sesije.
  problem: Okean izgleda primamljivo, ali skriva opasnosti koje početnici ne mogu da vide. Rip struje vas vuku na obalu, plitke peščane sprudove menjaju svakodnevno, a vaš povodac može puknuti u najgorem trenutku. Bez osnovnog znanja o bezbednosti, zabavna sesija se pretvara u hitan slučaj.
  explanation: Rip struje su vodeći uzrok spašavanja surfa. Oni nastaju kada voda gurnuta na obalu talasima teče nazad kroz kanal. Rips vas ne vuku ispod - oni vas izvlače. Ključ je da ostanete mirni i plivate paralelno sa plažom dok ne izađete iz rip, a zatim vozite razbijanje talasa nazad u. Osim rips, surferi se suočavaju sa sudarima sa drugim surferima ili sopstvenom daskom, hipotermija u hladnoj vodi, i grčevi u mišićima od veslanja bez zagrevanja.
  solution: 'Provedite 10 minuta na plaži pre ulaska u vodu: gledajte talas obrazac, identifikujte gde se formiraju rips i izaberite sigurnu ulaznu tačku. Protegnite ramena, leđa i noge. Proverite prilog za povodac i osigurajte da šina vašeg odbora nema oštre udubljenja. Veslajte sa jasnim izlaznim planom i pripazite na svoju poziciju u odnosu na orijentire.'
  recommendation: Pohađajte kurs za bezbednost surfanja ili pročitajte vodič za osnove bezbednosti okeana pre prve sesije. Nosite pištaljku i surfujte sa prijateljem. Ako niste sigurni u uslove, ne izlazite - talasi će i sutra biti tamo.
  faq:
    - q: Šta da radim ako me uhvati rip struja?
      a: Ostanite mirni, sačuvajte energiju i ne borite se protiv struje. Plivajte paralelno sa plažom (duž obale) dok ne izađete iz ripa, a zatim koristite talase da biste se vratili. Signal za pomoć ako je potrebno podizanjem jedne ruke.
    - q: Kako da uočite rip struju?
      a: Potražite kanal mirnije, tamnije vode između razbijanja talasa. Pena ili krhotine koje se kreću u more, ili jaz u talasnoj liniji, takođe ukazuje na rip. Obojena voda iz mešanog peska je još jedan znak.
    - q: Da li je bezbedno surfovati sam?
      a: Uvek je sigurnije surfovati sa najmanje još jednom osobom. Ako morate surfovati sami, izaberite blagu pauzu, recite nekome na obali gde idete, i ostanite u svojim granicama. Nosite telefon u vodootpornoj torbici.
    - q: Kako da sprečim da moja ploča ne udari nekoga?
      a: Nikada ne puštajte dasku između talasa - uvek držite jednu ruku na njoj. Ako izbrišete, pokrijte glavu i sklupčajte se u loptu. Izaberite dasku sa mekim krovom ili naduvavanjem kao Aquafarer za prvu godinu kako biste smanjili rizik od povreda.
    - q: Kada ne treba da idem na surfovanje?
      a: Ne surfujte ako su talasi iznad vašeg nivoa veštine, ako je na snazi upozorenje o rip struji, ako postoji munja, ako ste preterano umorni ili ako ste konzumirali alkohol. Znajte svoje granice i poštujte okean.
