- slug: beginner-sup-guide
  category: problem
  type: tutorial
  title: 'Stand Up Paddle boarding za početnike: Vaša prva sesija'
  description: 'Sve što treba da znate pre SUP prve sesije: kontrolna lista zupčanika, kako ustati, tehnika vesla, bezbedno padanje i izbor mirne vode za učenje.'
  definition: Stand up paddle boarding (SUP) podrazumeva stoji na tabli i koristi veslo da se pokrene preko vode. Ravnoteža, veslo hod tehnika, i čitanje uslovi vode su tri osnovne veštine.
  tldr: Počnite na ravnoj, mirnoj vodi bez vetra. Prvo vežbajte klečanje, a zatim stojite sa stopalima u širini kukova u blizini centra daske. Držite veslo jednom rukom na vrhu i jednom na osovini. Koristite rotaciju trupa, a ne snagu ruku, za veslanje. Pogledajte horizont, a ne stopala. Očekujte da ćete pasti - to je deo učenja.
  problem: Naduvate svoj prviSUP, zakoračite na tablu i odmah se osećate nestabilno. Noge vam se tresu, veslo se oseća neprijatno i ne možete da shvatite zašto idete u krug umesto u pravim linijama.
  explanation: SUP zahteva podešavanje ravnoteže, jer stoji na plutajućoj platformi se razlikuje od bilo koje aktivnosti na kopnu. Vaše telo instinktivno napeto, što čini odbor osećaju nestabilnije. Veslo hod treba da dođe od rotiranja torzo, ne povlačenjem rukama. Sečivo treba da uđe u vodu u blizini prstiju i izlaz u blizini skočnog zgloba. Većina početnika vesla samo sa rukama, što dovodi do brzog umora i lošeg praćenja. Gledajući dole na tabli baca ravnotežu.
  solution: Naduvajte ploču na preporučenoPSI, pričvrstite povodac na zglob i počnite da klečite. Veslo od klečanja da biste dobili osećaj za klizanje. Kada ste spremni da stojite, postavite veslo preko ploče, stavite obe ruke na palubu, pojačajte jednu nogu u isto vreme, i ustanite uz zadržavanje težine u centru. Držite kolena blago savijena i jezgro angažovano.
  recommendation: Koristite Aquafarer SUP Ekplorer 11 za svoju 33 "širine i stabilne platforme. Vežbajte na jezeru ili zaštićenom zalivu bez struje. Nosite prsluk za spašavanje za prvih nekoliko sesija.
  faq:
    - q: Koliko vremena je potrebno da se naučiSUP?
      a: Većina ljudi može stajati i veslati na mirnoj vodi u roku od 10-15 minuta. Stručnost traje 3-5 sesija. Napredne veštine traju mesecima.
    - q: Koji je najbolji uslov vetra za početnike?
      a: Vetar ispod 5 čvorova (miran do laganog povetarca). Vetar iznad 10 čvorova stvara kotlet koji izaziva ravnotežu. Početnici treba da izbegavaju offshore vetar.
    - q: Da li treba da nosim povodac?
      a: Uvek nosite povodac. Namotani SUP povodac se pričvršćuje na gležanj ili tele i drži ploču sa vama ako padnete. U otvorenim vodama, povodac vam može spasiti život.
    - q: Koja je najčešća greška početnika?
      a: Gledajući dole na tablu. Držite oči na horizontu. Vaše telo prati vašu glavu - gledajući dole pomera vašu težinu napred i čini da se daska ljulja.
