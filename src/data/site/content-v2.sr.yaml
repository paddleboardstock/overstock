  title: 'SUP Vodič za bezbednost: Osnovna pravila za svakog veslača'
  description: SUP Kompletan bezbednosni vodič koji pokriva vremenske provere, opremu, samospasavanje, pravila navigacije i šta da radite ako uslovi postanu opasni. Ostanite bezbedni na dasci za veslanje.
  definition: SUP Bezbednost obuhvata planiranje pre putovanja (vreme, plima i oseka, provera opreme), prakse na vodi (povodac, PFDnavigacija) i hitne procedure (samospašavanje, signalizacija, prevencija hipotermije).
  tldr: Uvek nosite povodac i PFD. Proverite prognozu vetra - vetar na moru je opasan. Prvo veslajte uz vjetar kako bi vam vetar pomogao da se vratite. Nosite pištaljku, telefon u vodootpornom kućištu i vodu. Naučite samospašavanje. Nikad SUP sam u udaljenim područjima.
  problem: SUP Izgleda varljivo jednostavno. Početnici potcenjuju koliko brzo vetar, struja i umor mogu pretvoriti zabavnu sesiju opasno.
  explanation: Odbor deluje kao jedro na vetru, čineći veslanje niz vetar lako, ali povratak protiv vetra izuzetno teško. Stojeći položaj povećava rizik od pada. Umor se akumulira brže od kajaka. Povodci sprečavaju odvajanje od odbora. PFD-ovi vas drže na površini ako ste povređeni.
  solution: 'Pre-putovanje: proverite vetar (mak 10 čvorova za početnike), pravac (izbegavajte offshore) i plimu. Recite nekome svoj put. Na vodi: kleknite da veslate u jak vetar. Ako se razdvoji, plivajte na brod. Za samospasavanje: postavite veslo preko ploče, udari noge, povuci grudni koš na dasku, ljuljaška noge gore.'
  recommendation: Koristite Aquafarer prsluk za spašavanje Pro (na naduvavanje) za SUP. Pričvrstite SUP namotani povodac na tele. Vežbajte samospašavanje u mirnim uslovima pre nego što vam zatreba.
  faq:
    - q: Koja brzina vetra je bezbedna zaSUP?
      a: 'Početnici: ispod 10 čvorova. Srednji: 10-15 čvorova. Napredni: 15-20 čvorova. Preko 20 čvorova je opasan za sve nivoe.'
    - q: Da li mi treba prsluk za spašavanjeSUP?
      a: Da - zakonski propisano u mnogim jurisdikcijama i uvek se preporučuje za bezbednost.
    - q: Šta da radim ako ne mogu da se vratim na obalu?
      a: Ostanite sa svojim odborom (to je flotacija). Signal sa zviždukom. Ako se duva offshore, vesla na 45 stepeni na vetar.
    - q: Kako da praktikujem SUP samospasavanje?
      a: 'U mirnoj plitkoj vodi: namerno pasti, plivati na brodu, vežbajte ponovo montiranje više puta.'
