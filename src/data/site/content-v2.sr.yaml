- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Vodič za sidro: Ostanite na mestu dok pecate ili fotografirate'
  description: Kompletan vodič za SUP sidrenje — vrste sidra (pečurke, preklopivanje, kolac), podešavanje kolica za sidro, tehnike raspoređivanja i bezbednosna razmatranja za ostanak u položaju.
  definition: SUP Sidro je težina pričvršćena za konopac koji drži ploču u položaju protiv vetra i struje. Uobičajeni tipovi uključuju sidra gljiva, sklopiva sidra i stubove za zaustavljanje.
  tldr: Koristite sidro gljiva (1.5-3 lb) za blatnjave ili peščane dna, sklapanje sidro za kamenita dna, ili stake-out stub za plitku vodu sa mekim dnom. Sidro treba da bude 1.5-3 lb za mirne uslove, 3-5 lb za vetar i struju. Uvek koristite sidro kolica za podešavanje položaja i znaju kada da se oslobodi.
  problem: Naći ćete savršeno mesto za ribolov, ali vetar i struja vas odnese sa pozicije svakih nekoliko minuta. Bez sidrenja, SUP ribolov i fotografija su frustrirajuće vežbe u stalnom repozicioniranju.
  explanation: Sidro radi povlačenjem preko dna dok se ne uhvati. Sidra gljiva zakopaju u meka dna i obezbeđuju dobro držanje u pesku i blatu. Sklopiva sidra imaju metilja koja kopaju u tvrdim ili kamenitim dnom. Stubovi za zasjede rade u plitkoj vodi tako što se direktno guraju u dno.
  solution: Instalirajte sidreni kolica sistem (linija sa kliznim prstenom na jednoj strani ploče) da podesite sidro pričvršćivanje tačku. Pričvrstite 50-75 'konopca na sidro. Rasporedite uz vetar ili up-struju željene pozicije. Koristite sistem za brzo otpuštanje da se odvoji u hitnim slučajevima. Nikada se ne usidrite u jakoj struji ili gde ne možete lako preuzeti sidro.
  recommendation: A 3 lb sklopivi sidro sa 50 'konopca radi za većinu SUP uslova ribolova. Dodajte sidro kolica sistem koristeći D-prstenove na Aquafarer SUP Ekplorer 11.
  faq:
    - q: Koja veličina sidro mi je potrebno zaSUP?
      a: 1.5-3 lb za mirna jezera i sporih reka. 3-5 lb za priobalna područja sa vetrom ili strujom. Prevelika sidra je teško preuzeti.
    - q: Koliko sidrena linija mi je potrebna?
      a: "A 5: 1 opseg (5 metara linije za svaki 1 metar dubine) je standardni. U 10 'vode, koristite 50 'linije."
    - q: Da li je sidrenje opasno na SUP?
      a: Samo ako se usidrite u struji ili vetru dovoljno jak da prevrne ploču. Uvek koristite sistem za brzo otpuštanje koji se može odmah odvojiti.
    - q: Mogu li se usidriti u bilo kojoj vodi?
      a: Proverite lokalne propise. Neke oblasti ograničavaju sidrenje radi zaštite morske trave ili morskih staništa. Nikada se ne sidrite na koralnim grebenima.
