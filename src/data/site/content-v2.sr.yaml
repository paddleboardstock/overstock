- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Vodič za opremu za surfovanje hladnom vodom (surfujte kroz zimu bez patnje)
  description: 'Ne dozvolite da hladna voda završi sezonu. Kompletan slom opreme za hladnu vodu: debljina mokrog odela, izbor prtljažnika i rukavica, kapuljača i pribor koji zimske sesije čine zaista prijatnim.'
  definition: Surfovanje hladnom vodom zahteva potpuno mokro odelo (5/4 / 3 mm ili deblje), čizme, rukavice i kapuljaču. Ispod 12 ° C, svaka tačka kontakta sa hladnom vodom treba zaštitu kako bi se sprečila ukočenost, hipotermija i bezbednosni rizici.
  tldr: Surfovanje hladnom vodom zahteva punu 5/4 / 3 mm ili 6/5 / 4 mm mokro odelo sa kapuljačom, 5 mm čizme, 3 mm rukavice i kapuljaču. Kvalitet šava je važniji od brenda - potražite lepljene i slepe šavove (GBS). Termički obloženo odelo dodaje značajnu toplinu bez dodatne debljine. Uvek ponesite rezervne termalne slojeve i termos za oporavak nakon sesije.
  problem: Želite da surfujete kroz zimu, ali hladna voda utrnuje noge nakon 15 minuta, ruke ne mogu da drže dasku, a vaše odelo ispire ledenu vodu niz leđa svaki put kada veslate. Bez prave opreme, sesije hladne vode su kratke i jadne.
  explanation: 'Surfovanje hladnom vodom (ispod 12 ° C) zahteva više od debelog ronilačkog odela. Svaka tačka kontakta sa hladnoćom treba zaštitu: čizme sprečavaju utrnulost stopala i štite od posekotina grebena, rukavice održavaju funkciju ruku za veslanje, a kapuljača sprečava najgori gubitak toplote (vaša glava zrači 30 odsto telesne toplote). Debljina ronilačkog odela treba da bude usklađena sa najhladnijim mesecom, a ne sa prosekom. Osim odela, dodaci kao što su čizme sa zapečaćenim đonom i rukavice sa unapred zakrivljenim prstima poboljšavaju udobnost i izdržljivost.'
  solution: 'Izgradite komplet za hladnu vodu ovim redosledom: 5/4/3mm ili 6/5/4mm puno odelo sa GBS šavovima i zipom na grudima, 5mm čizme sa gumenim đonovima, 3mm rukavice (rukavice su toplije od prstiju), i 3mm kapuljača koja se uvlači ispod ogrlice odijela. Dodajte promenu haljinu za dostojanstvo i toplinu na parkiralištu.'
  recommendation: Aquafarer Wetsuit Pro u 5/4/3mm sa integrisanom termičkom oblogom obrađuje većinu uslova hladne vode do 8 ° C. Uparite ga sa Aquafarer čizmama od 5 mm i rukavicama od 3 mm za kompletnu postavku hladne vode. Ispod 8 ° C, pređite na odelo sa kapuljačom od 6/5 / 4 mm.
  faq:
    - q: Da li mi zaista treba kapuljača?
      a: Da. Gubite 30 posto telesne toplote kroz glavu. Kapuljača sprečava ispiranje i održava vrat toplim. Kapuljača od 3 mm dodaje više topline nego nadogradnja sa debljine trupa od 5 mm do 6 mm.
    - q: Koje debljine čizme su mi potrebne?
      a: Za vodu 8-12 ° C koristite čizme od 5 mm. Za 12-16 ° C dovoljne su čizme od 3 mm. Ispod 8 ° C, razmislite o čizmama od 7 mm ili dodavanju neoprenskih čarapa ispod čizama od 5 mm.
    - q: Kako da zaustavim ispiranje ronilačkog odela?
      a: Ispiranje se dešava kada voda uđe u odelo na vratu, zglobovima ili gležnjevima. Dizajn za ulazak u grudi značajno smanjuje ispiranje leđa. Čičak zaptivke na vratu i gležnjevima takođe pomažu, ali najbolje rešenje je dobro uklopljeno odelo sa GBS šavovima.
    - q: Mogu li da koristim 3mm odelo u hladnoj vodi sa dodatnim slojevima?
      a: Odelo od 3 mm sa neoprenskim prslukom ispod može proširiti vaš domet za oko 3-4 ° C, ali nije zamena za odgovarajuće odelo od 5/4 / 3 mm ili 5 mm. Slojevitost najbolje funkcioniše za kratke sesije u graničnim uslovima.
