  title: 'Održavanje čamca na naduvavanje: Sačuvajte svoju investiciju'
  description: Godišnja kontrolna lista za održavanje čamaca na naduvavanje. Čišćenje, UV zaštita, inspekcija šavova, upravljanje pritiskom, nega motora i zimovanje za PVC Hypalon i čamce.
  definition: Održavanje čamac na naduvavanje obuhvata čišćenje, UV zaštitu, upravljanje pritiskom, inspekciju šavova i ventila, sprečavanje plijesni i pravilno skladištenje van sezone.
  tldr: Isperite nakon svake upotrebe u slanoj vodi. Nanesite UV zaštitu svakih 2-3 meseca. Proverite pritisak inflacije pre svakog izlaska. Pregledajte šavove, ventile i krmeno zrcalo mesečno. Očistite blagim sapunom. Čuvati ispuhano na hladnom i suvom mestu van sezone.
  problem: Koristili ste svoj čamac na naduvavanje za sezonu i sada cevi izgledaju izbledele, šav plače, a krmeno zrcalo se oseća sunđerastim - sve se može sprečiti rutinskim održavanjem.
  explanation: UV zračenje razgrađuje polimernu matricu. Slana voda kristalizuje u naborima i brusi tkaninu. Kalup raste u zarobljenoj vlazi. Neispravan pritisak uzrokuje zamor materijala. Krmeno (posebno šperploča) apsorbuje vodu kroz rupe za vijke.
  solution: 'Nakon svake upotrebe: isperite svežom vodom, osušite, proverite pritisak. Mesečno: obrišite cevi UV zaštitnim sredstvom, pregledajte šavove, nepovratni ventil. Godišnje: dubinsko čišćenje, pregledajte krmeno zrcalo za truljenje, podmažite ventile, testirajte mikro-curenje.'
  recommendation: Koristite 303 Aerospace Protectant na Aquafarer brodskim cevima. Uklonite ventile i nanesite silikonsku mast godišnje. Čuvati u torbi za nošenje sa pakovanjem za sušenje.
  faq:
    - q: Mogu li da koristim izbeljivač za čišćenje čamca na naduvavanje?
      a: Ne — izbeljivač oštećuje premaz tkanine. Koristite blagi sapun i toplu vodu. Za buđ koristite razblaženo belo sirće.
    - q: Koliko često treba da tretiram UV zaštitnim sredstvom?
      a: Svaka 2-3 meseca tokom sezone upotrebe. Češće u tropskim klimatskim uslovima.
    - q: Da li treba da ispuhnem svoj brod između upotrebe?
      a: Ne ako se koristi nedeljno. Ostavite naduvane sa UV poklopcem. Za mesečne praznine, ispuhati i čuvati.
    - q: Kako da održavam krmeno zrcalo?
      a: Proveravajte vijke mesečno. Godišnje zapečatite izložene ivice drveta morskim lakom. Zamenite ako se razviju meke tačke.
