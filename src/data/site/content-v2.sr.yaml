  tldr: 'SUPsSvestrano: 10''6 "-11''6" k 32 "-34" k 6" (220-280L). Touring: 12''-14'' k 30 "-32" (280-350L). Surf: 8''-10'' k 30 "-32" (140-220L). Početnicima je potrebna širina preko 32 "i zapremina koja prelazi telesnu težinu za 60-80L. Vaša težina u kg plus 60L je minimalni cilj zapremine za stabilnost.'
  problem: Svaki SUP brend navodi ploče u stopama, inčima i litrama, ali ne znajući kako se ova merenja prevode u stvarni svet, rizikujete kupovinu ploče koja je prevrnuta, spora ili ne može da podrži vašu težinu.
  explanation: 'Dužina određuje koliko brzo ploča vesla i koliko dobro prati u pravoj liniji. Duže ploče (12 ''+) klize između poteza i drže liniju. Kraće ploče (ispod 10 '') lako se okreću, ali zahtevaju češće prekidače vesla. Širina određuje primarnu stabilnost - stabilnost stajanja. 30 "odbor se oseća kao pristanište; 34" oseća se kao pristanište. Debljina određuje zapreminu - deblja ploča lebdi više, ali hvata više vetra. Zapremina u litrama je najbolja metrika: napunjena ploča (vi plus zupčanik) treba potopiti 2-4 inča u mirovanju.'
  solution: 'Uskladite dimenzije ploče sa tri faktora: vaša težina (određuje minimalnu zapreminu), vaša primarna aktivnost (određuje dužinu) i nivo veštine (određuje širinu). Za početnike, pomnožite težinu u kg sa 2,2 da biste dobili minimalne litre. Za srednje, pomnožite sa 1,8. Za napredne, pomnožite sa 1,4.'
  recommendation: Aquafarer SUP Ekplorer 11 na 11 'k 33" k 6" sa 260L odgovara većini vozača do 100 kg za svestrano veslanje. Nadogradnja na SUP Tour 12 na 12 'k 31" za bolju brzinu turneje i klizanje.
  faq:
    - q: SUP Koja veličina mi je potrebna za moju težinu?
      a: 'Za vozače ispod 70 kg: 10-11 ''k 32" (220-260L). Za 70-90 kg: 11-12 ''k 33" (260-300L). Za 90-110 kg: 11-12 ''k 34" (300-350L). Za preko 110 kg: 12 ''k 34-36" (350L+).'
    - q: Da li je duže SUP brže?
      a: Da. Duže ploče imaju bolji odnos dužine i širine, smanjujući otpor. 14 'Touring SUP je znatno brži od 11 'sve oko odbora u istom veslanju napora.
    - q: SUP Koja širina je stabilna za početnike?
      a: 33-34 inča je slatka tačka za početnike do 90 kg. Ispod 32 "zahteva dobru ravnotežu. Iznad 34" je veoma stabilan, ali sporiji i teže veslati na vetru.
    - q: Mogu li da koristim svestranu ploču za turneju?
      a: Da, za kratke ture ispod 10 km. Za veće razdaljine, namenski touring board prati bolje i pokriva rastojanje efikasnije.
