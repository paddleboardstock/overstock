- slug: yoga-sup-guide
  category: guide
  type: tutorial
  title: 'Joga na SUP: Kompletan vodič za Paddle Board Joga'
  description: SUP Joga kombinuje tradicionalne joga poze sa izazovom plutajuće platforme. Kako odabrati ploču za jogu, osnovne poze za početnike i savete za održavanje ravnoteže na vodi.
  definition: SUP Joga (paddle board joga) je praksa izvođenja joga asana na stand up paddle board, obično usidrena u mirnoj vodi. Nestabilna platforma angažuje mišiće stabilizatora jezgra više nego mat joge.
  tldr: 'Koristite široku ploču (34 "+) sa mekom, prianjajućom podlogom. Vežbajte u mirnoj, plitkoj vodi bez struje ili vetra. Usidrite ploču malim sidrom ili stubom. Počnite sa temeljnim pozama: pas prema dolje, ratnik II, poza drveta i savasana. Voda dodaje nestabilnost koja produbljuje angažman jezgra i poboljšava ravnotežu.'
  problem: Mat joga je postala rutina i želite da produbite svoju praksu. Nestabilnost vode dodaje izazov koji prisiljava na bolji angažman mišića, ali bez uputstava možete izabrati pogrešnu ploču ili se boriti sa prelazima poza.
  explanation: Vežbanje joge na SUP tabli transformiše svaku pozu. Plutajuća površina se stalno pomera, zahtevajući od mišića stabilizatora da rade neprekidno. Stojeće poze zahtevaju precizniju raspodelu težine. Voda pruža prirodan otpor za plutajuće poze. Ploče za SUP jogu trebaju maksimalnu širinu (34-36 "), EVA debelu meku podlogu, minimalnu klackalicu za ravnu platformu i više D-prstenova za sidrenje.
  solution: Izaberite ploču KSNUMKS "ili širu sa punom palubom. Naduvajte da biste bili PSI čvrsti za stabilnost. Usidrite ploču sa prednjeg D-prstena. Počnite sa sedećim i klečajućim pozama da biste se prilagodili platformi. Napredak u stojećim pozama fokusirajući se na spore prelaze.
  recommendation: Aquafarer SUP Ekplorer 11 sa svojim 33 "širine i punim dijamant-žleb palube podloga dobro radi za SUP jogu. Za posvećene joga prakse, širi odbor pruža veću udobnost. Uvek koristite povodac ili sidro kako bi se sprečilo da ploča pluta.
  faq:
    - q: Da li mi je potrebna posebna ploča za SUP jogu?
      a: Ne nužno, ali širina i kvalitet palube jastučića bitno. Ploče ispod 32 \ "su veoma izazovne za jogu. Debeli, jastučići paluba podloga čini klečanje pozira udobno.
    - q: Šta se dešava ako padnem tokom SUP joge?
      a: Pad je deo iskustva. Većina padova se dešava tokom prelaza između poza. Padni sa ploče, a ne na nju.
    - q: Mogu li da radim toplu jogu na SUP?
      a: SUP Joga na direktnoj sunčevoj svetlosti može biti veoma vruća. Vežbajte ujutru ili kasno popodne. Nosite SPF i donesite vodu.
    - q: Da li je SUP joga teža od mat joge?
      a: Da - nestabilna površina zahteva više ravnoteže i snage jezgra. Mnogi praktikanti smatraju da SUP joga poboljšava njihovu praksu na prostirkama izgradnjom dublje svesti o telu.
