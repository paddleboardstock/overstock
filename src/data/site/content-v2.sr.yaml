  title: 'SUP Naduvavanje Održavanje: Držite odbor u trajanju godinama'
  description: Pravilno održavanje na naduvavanje SUP dramatično produžava život odbora. Čišćenje, sušenje, nega ventila, UV zaštita, i sezonski saveti za skladištenje za drop-stitch veslanje.
  definition: SUP Naduvavanje održavanje podrazumeva čišćenje nakon upotrebe, pravilno sušenje, inspekciju ventila, UV zaštitu, i pravilno skladištenje kako bi se sprečilo raslojavanje, buđ, degradacija materijala, i curenje vazduha.
  tldr: Isperite ploču svežom vodom nakon svake sesije slane vode. Osušite potpuno pre ispuhivanja i skladištenja. Proverite ventil za ostatke i podmazati O-prsten godišnje. Čuvati naduvane (na polaPSI) na hladnom i tamnom mestu. Izbegavajte UV duže izlaganje koje degradiraPVC. Patch male punkcije odmah sa priloženim kompletom za popravku.
  problem: Nakon sezone, vaš naduvavanje SUP razvija sporo curenje, paluba jastučić ljušti na ivicama, a PVC oseća se tvrđi. Zanemarivanje osnovnog održavanja izaziva prerano starenje koje je u potpunosti sprečiti.
  explanation: PVC razgrađuje pod UV zračenjem. Kristali soli iz morske vode rade u šavovima i ventilima, uzrokujući mikro-curenja. Vlaga zarobljena unutra promoviše rast plesni koja napada drop-stitch teme. Ventil O-prstenovi isušuju i gube pečat. Prljavština i pesak melju u palubi pad lepak, uzrokujući ivica podizanje.
  solution: 'Posle svake sesije: isperite ploču, peraje i pumpajte svežom vodom. Obrišite palubu. Otvorite ventil za odvod zarobljene vode. Osušite ploču u hladu pre ispuhavanja. Mesečno: pregledajte ventil i nanesite silikonsko mazivo na O-prsten. Sezonski: operite blagim sapunom i vodom, proverite ubode.'
  recommendation: Pratite vodič za Aquafarer negu koji je priložen vašoj ploči. Koristite komplet za popravku odmah na bilo koji punkcija. Čuvajte ploču u torbi u području sa kontrolisanom temperaturom daleko od direktne sunčeve svetlosti.
  faq:
    - q: Mogu li da ostavim SUP naduvavanje naduvane tokom cele sezone?
      a: Da, ali čuvati van direktne sunčeve svetlosti i na pola mak PSI (8-10) PSIda se smanji stres na šavovima. Potpuno naduvati neposredno pre upotrebe.
    - q: Kako da očistim kalup sa mojimSUP?
      a: 'Pomešajte blagi sapun sa toplom vodom i pročistite mekom četkom. Za tvrdoglavu plijesan koristite razblaženi rastvor belog sirćeta (1: 4). Izbegavajte izbeljivač.'
    - q: Da li treba da podmažem ventil?
      a: Da, godišnje. Uklonite jezgro ventila, nanesite silikonsku mast na O-prsten i ponovo instalirajte. Ovo sprečava curenje vazduha.
    - q: Kako da čuvam SUP svoj za zimu?
      a: Očistite i osušite temeljno. Ispuhnite u potpunosti, lagano kotrljajte (izbegavajte uske nabore) i čuvajte na hladnom, tamnom i suvom mestu. Izbegavajte temperature smrzavanja.
