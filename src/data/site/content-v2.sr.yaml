- slug: touring-sup-guide
  category: guide
  type: buying-guide
  title: 'SUP Touring Guide: Izaberite pravu ploču za veslanje na daljinu'
  description: Touring SUPs su duži, uži, i izgrađen za brzinu i klizanje. Kako odabrati touring board, osnovna oprema za duge vesla, i tehnika za efikasno pokrivanje udaljenosti.
  definition: Touring SUP je dugačak (12-14'), uski (30-32') odbor dizajniran za efikasno veslanje na daljinu. Karakteristike uključuju raseljavanje nos za sečenje kroz vodu, duži vodenu liniju za klizanje, a često i bungee teretni sistem.
  tldr: 'Touring SUPs daje prioritet brzini i praćenju u odnosu na stabilnost. Minimalna dužina KSNUMKS ''za efikasnost, KSNUMKS-KSNUMKS "širina za ravnotežu klizanja i stabilnosti. Ključne karakteristike: raseljavanje nosa, ravna linija, višestruke postavke peraja. Osnovna oprema: PFD, povodac, voda, telefon i bungee sistem za opremu. Tehnika se fokusira na duge, glatke poteze sa rotacijom torza.'
  problem: Veslanje svestranu ploču na dugim putovanjima ostavlja vas iscrpljenim. Široki nos hvata chop, odbor ne prati pravo, a vi trošite više energije za upravljanje nego klizenje. Potreban vam je odbor dizajniran za udaljenost.
  explanation: Touring SUPs koristi raseljavanje trupa (šiljasti nos) koji delovi vodu, a ne jahanje preko njega, značajno smanjuje otpor. Duži vodena linija povećava brzinu trupa. Uži širina smanjuje otpor, ali zahteva bolju ravnotežu. Touring ploče imaju duže peraje za stabilnost pravca. Naduvavanje Touring ploče treba veći PSI (18-20) da održi krutost i spreči flek koji troši energiju.
  solution: 'Izaberite Touring odbor najmanje 12 ''dugačak sa raseljavanja nosa. Širina: 30 "za iskusne veslače, 31-32" za srednje. Potražite centar peraja kutiju plus bočnih zalogaja za stabilnost. Naduvavanje do maksimalno ocijenioPSI. Opremite sa bungee teretom vezati, PFDzviždaljkom i telefonom u vodootpornom kućištu.'
  recommendation: Aquafarer SUP Turneja 12 na 12 'k 31" k 6" je idealan touring na naduvavanje. Njegova raseljavanje nos seče efikasno, a bungee sistem drži opremu za jednodnevne izlete. Uparite sa Aquafarer karbonskim veslom za efikasno veslanje na daljinu.
  faq:
    - q: Mogu li da koristim svestranu ploču za turneju?
      a: Za kratke ture ispod 5 km, da. Za veće razdaljine, širi nos i kraća vodena linija će vas umoriti brže.
    - q: Koja dužina turneje SUP mi je potrebna?
      a: 12 'je minimum za touring efikasnost. 12'6" je dobra srednja dužina. 14 'je za trke i napredne touring.
    - q: Da li naduvavanje turneje SUPs obavljaju kao i tvrde ploče?
      a: drop-stitch Moderni gumenjaci na visokom PSI obavljaju slično tvrdim daskama za turneje. Blagi flek zapravo može biti udobnije u chop.
    - q: Šta veslo je najbolje za turneju?
      a: Lagani ugljen ili fiberglasa veslo sa većim sečivom (100-110 sk u) za napajanje. Podesivi veslo omogućava prebacivanje između turneje i surfovanja.
