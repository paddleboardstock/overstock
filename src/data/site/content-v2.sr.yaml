- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Samospašavanje: Kako se vratiti na tablu u dubokoj vodi'
  description: Svaki SUP veslač treba da savlada samospasavanje. Korak-po-korak tehnike za ponovno montiranje dasku u dubokoj vodi, vuče ga na obalu, i bavi se povodcem zapetljavanja.
  definition: SUP Samo-spašavanje je tehnika ponovnog montiranja dasku za veslanje u dubokoj vodi nakon pada, uključujući oporavak odbora, telo ponovno montiranje, i veslo pronalaženje.
  tldr: 'Nakon pada: ostanite mirni, držite veslo, plivajte do ploče. Postavite veslo preko ploče. Koristite delfin udarac za pogon grudnog koša na tabli. Sving jednu nogu gore, a zatim drugu. Kleknite prvi, a zatim stojte. Vežbajte u mirnoj vodi dok ne bude mišićna memorija.'
  problem: Padaš SUP sa svog u dubokoj vodi i ne možeš da se vratim. Daska je klizava, umorni ste i nastaje panika. Bez poznavanja tehnike samospašavanja, jednostavan pad postaje opasan.
  explanation: 'Samo-spašavanje ima tri faze: oporavak (plivati na dasku i veslati), ponovo montirati (vratiti se na tablu), i nastavak (nastaviti veslanje). Ključna tehnika je korišćenje veslo kao stabilizator i korišćenje snažnih nogu udaraca za pokretanje gornjeg dela tela na tabli.'
  solution: 'Faza 1: plivati do odbora. Držite veslo ili ga preuzeti. Faza 2: postavite veslo okomito preko ploče. Kick noge energično dok vuče grudni koš na centru odbora. Faza 3: kada je grudni koš na brodu, zamahnite noge jedan po jedan. Faza 4: kleknite, uhvatite dah, a zatim postepeno stojite.'
  recommendation: Vežbajte samo-spašavanje u kontrolisanim uslovima dok to ne možete učiniti bez razmišljanja. Koristite Aquafarer SUP Ekplorer 11 koji ima dobru vuču palube. Prsluk za spašavanje Pro obezbeđuje dodatnu flotaciju ako se borite.
  faq:
    - q: Kako da se vratim ako sam iscrpljen?
      a: Ostanite sa pločom za plutanje. Koristite ruke da povučete grudni koš na dasku, čak i ako noge ne mogu efikasno udariti. Odmorite se u klečećem položaju pre nego što stojite.
    - q: Šta ako izgubim veslo?
      a: Koristite ruke za veslanje dasku do obale. Pitajte drugog veslača za pomoć. Zamenite izgubljeno veslo odmah.
    - q: Mogu li se samospasiti u talasima?
      a: Da — postavite ploču okomito na talase. Tempirajte ponovno montiranje između talasa. Povodac drži ploču u blizini.
    - q: Kako da se nosim sa zapetljanim povodcem?
      a: Ostanite mirni, plutajte na leđima, polako raspetljajte povodac. Ako je povodac omotan oko peraja, možda ćete morati da uklonite peraje dok ste u vodi.
