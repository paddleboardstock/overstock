  title: 'Naduvavanje SUP Popravka: Fik punkcije, curenje, i ventil pitanja'
  description: Uradi sam naduvavanje SUP popravka vodič. Kako da pronađete sporo curenje, zakrpite punkciju, zamenite ventil, i popraviti palube pad raslojavanje pomoću priloženog kompleta za popravku.
  definition: Popravka na naduvavanje SUP podrazumeva lociranje curenja vazduha kroz testiranje sapunaste vode, čišćenje i grubo oštećeno područje, nanošenje PVC lepka i flastera i sušenje pod pritiskom.
  tldr: Pronađite curenje sapunicom. Očistite i grubo područje oko punkcije brusnim papirom. Nanesite PVC lepak i na flaster i na ploču, sačekajte 5 minuta, čvrsto pritisnite i očvrsnite pod težinom 24 sata. Za curenje ventila, prvo proverite O-prsten. Male punkcije ispod 1/4 "su jednostavne DII ispravke.
  problem: Naduvavate svoj SUP i do jutra je izgubio pritisak. Bez znanja o popravci, suočavate se sa skupom zamenom za ono što je verovatno jednostavna punkcija.
  explanation: 'Većina na naduvavanje SUPs koristi drop-stitch jezgro sa PVC spoljnim slojevima. Probijanje kroz spoljašnje PVC stvara sporo curenje. Standardna popravka: očistite, pesak, nanesite PVC-kompatibilan lepak, pritisnite flaster pod težinom. Curenje ventila je češće od probijanja panela - O-prsten se isušuje ili krhotine sprečavaju zaptivanje.'
  solution: Naduvajte ploču do maksimuma PSI i slušajte šištanje. Sistematski prskajte sapunastu vodu, posebno oko šavova i ventila. Označite mrlje od mjehurića. Ispuhati, očistiti alkoholom, peskom sa 80 grit, nanijeti PVC ljepilo na zakrpu i ploču, sačekati dok ne postane ljepljivo, čvrsto pritisnite, težina 24 sata.
  recommendation: Koristite Aquafarer komplet za popravku koji se Aquafarer isporučuje sa svim pločama. Uvek nosite komplet za popravku na putovanjima. Za pitanja ventila, kontaktirajte Aquafarer podršku. Za velike suze ili razdvajanja šavova, preporučuje se profesionalna popravka.
  faq:
    - q: Mogu li popraviti veliku suzu u mom naduvavanjeSUP?
      a: Suze preko 1 \ "može zahtevati profesionalnu popravku ili zakrpu na obe strane. Šav razdvajanja duž šine ne može pouzdano popraviti na terenu.
    - q: Koliko dugo traje popravka?
      a: Pravilna popravka sa pravilnom tehnikom traje životni vek ploče. Loša adhezija od neadekvatnog čišćenja dovodi do budućeg neuspeha.
    - q: Mogu li popraviti ventil koji curi?
      a: Često da. Uklonite jezgro ventila, pregledajte O-prsten, očistite ili zamenite, nanesite silikonsko mazivo i ponovo instalirajte.
    - q: Šta ako ne mogu da pronađem curenje?
      a: Naduvajte do pune PSI i potopite sekcije uzastopno u kadi ili bazenu. Curenje suviše malo da bi se pronašlo može biti povezano sa temperaturom.
