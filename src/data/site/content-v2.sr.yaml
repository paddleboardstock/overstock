  title: Bezbednost i odgovornost okeana (više od brzine)
  description: Aquafarerposvećenost da vas čuvamo i štitimo okean koji delimo. Sigurnosne kartice u svakoj kutiji, besplatni edukativni sadržaji, održivi dizajn i godišnje donacije za očuvanje.
  definition: Bezbednost i odgovornost okeana znači razumevanje okruženja u kojem veslate, poštovanje morskog života, minimiziranje vašeg ekološkog otiska i korišćenje opreme dizajnirane za dugovečnost i popravljivost.
  tldr: Aquafarer promoviše bezbednost okeana kroz dizajn opreme (svetle boje, povodci, prsluci za spašavanje) i edukativni sadržaj. Verujemo da svaki ljubitelj vodenih sportova ima odgovornost da razume okeansko okruženje, poštuje morski život i minimizira njihov ekološki otisak. Naša oprema je napravljena da traje tako da manje završava na deponijama.
  problem: Mnogi brendovi vodenih sportova prodaju opremu, ali ne edukuju svoje kupce o tome kako da ga koriste bezbedno ili odgovorno. Novi veslači i surferi ulaze u vodu bez razumevanja rip struje, morske divlje životinje, ili uticaj njihove opreme na životnu sredinu.
  explanation: Bezbednost okeana je više od kontrolne liste - to je način razmišljanja. Svaki Aquafarer proizvod sadrži sigurnosnu karticu za brzi početak u kutiji. Naša veb stranica i vodiči (osnove bezbednosti okeana, saveti za bezbednost surfovanja) pružaju besplatnu, detaljnu edukaciju o bezbednosti. Na strani zaštite životne sredine, najveći uticaj bilo koje kompanije za opremu je kroz dugovečnost proizvoda. Ploča koja traje 5 godina umesto 2 prepolovljuje proizvodni otisak. Takođe dizajniramo imajući na umu popravljivost - zamjenski ventili, kutije za peraje i kompleti za zakrpe za mokra odela drže opremu u upotrebi, a ne na deponijama.
  solution: Aquafarer uključuje povodac i komplet za popravku sa svakom kupovinom ploče. Objavljujemo besplatan sigurnosni sadržaj koji pokriva identifikaciju rip struje, čitanje vremena i proveru opreme. Naš tim za podršku klijentima pruža savete o stanju kada nam pošaljete e-poštu o određenoj lokaciji. Koristimo minimalnu plastičnu ambalažu i offset shipping ugljenika.
  recommendation: Počnite sa vodičem za osnove bezbednosti okeana i vodičem za savete za bezbednost surfovanja. Uvek nosite povodac, proverite prognozu i nikada ne veslajte sami ako učite. Ako vidite krhotine ili morske životinje u nevolji, prijavite to lokalnim vlastima. Oprema koja traje je oprema koja smanjuje otpad - održavajte Aquafarer svoju opremu i ona će vam služiti godinama.
  faq:
    - q: Aquafarer Da li podržava inicijative za čišćenje okeana?
      a: Da, doniramo 1 procenat godišnjeg profita organizacijama za čišćenje okeana i očuvanje mora. Kupci mogu da izaberu istaknutu dobrotvornu organizaciju na blagajni kako bi usmerili deo svoje kupovine.
    - q: Kako da odložim staro odelo ili ploču?
      a: Neoprenska odela mogu se reciklirati u joga prostirke, torbe i izolaciju kroz specijalizovane programe. Daske na naduvavanje mogu se popraviti, donirati ili PVC se mogu povratiti kroz određene objekte za reciklažu. Obratite se našem timu za podršku za uputstva.
