- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Pravila surfanja (kako ne biti osoba koju svi izbegavaju)
  description: Postava ima pravila i niko ih ne zapisuje. Saznajte pravo prolaza, zašto će vas vikao na vijuganje, kako se izviniti i početničke greške koje nerviraju svakog lokalnog surfera.
  definition: 'Surf etiketa je nepisani kodeks ponašanja koji sprečava sudare i deli talase pošteno. Osnovno pravilo: surfer najbliži vrhu talasa koji se lomi ima prednost.'
  tldr: Surfer najbliži vrhu talasa koji se lomi ima prednost. Ne padajte na nekoga, nemojte se zmije (veslati oko nekoga da biste uzeli njegov talas) i uvek se izvinjavajte ako napravite grešku. Veslajte široko oko postave, držite se daske i budite prijateljski raspoloženi — poštovanje zaslužuje poštovanje.
  problem: Veslate se do prepune postave i odmah osetite napetost. Surferi vas gledaju u stranu, neko viče na vas, a vi niste sigurni šta ste pogrešili. Društvena strana surfovanja oseća više zastrašujuće od samih talasa.
  explanation: 'Surf etiketa postoji da bi se sprečili sudari i podelili talasi pošteno. Osnovno pravilo je pravo prolaza: surfer najbliži vrhu (gde se talas prvi put razbije) ima prioritet. Svako ko vesla za isti talas iz dublje unutrašnjosti mora da se povuče. Snaking - veslanje oko drugog surfera da ukrade prioritet - smatra se najgorim prekršajem. Pored prioriteta, postava ima očekivanja o buci (nastavite da vičete na minimum), kontroli daske (nikada ne dozvolite da vaša daska ide blizu drugih) i ljubaznosti (jednostavno klimanje glavom ide dug put).'
  solution: Gledajte postavu 10 minuta pre nego što veslate. Identifikujte ko hvata najviše talasa - to su surferi koje treba poštovati i izbegavati. Ostanite unutra (zona bele vode) ako učite. Veslajte široko oko postave, a ne kroz nju. Kada uhvatite talas, pogledajte u oba smera pre nego što se pojavite i uverite se da niko nije dublji.
  recommendation: Provedite prvih nekoliko sesija na pauzi za početnike sa raširenim gužvama. Naučite da čitate prioritet pre nego što pokušate zauzetu postavu. Ako svratite na nekoga, odmah se izvinite i veslajte - većina surfera poštuje iskrenu grešku.
  faq:
    - q: Šta pada u?
      a: Padanje znači veslanje i jahanje talasa na kojem drugi surfer već ima prioritet. To je opasno i nepoštovanje. Surfer najbliži vrhu poseduje talas; svako drugi mora da se povuče.
    - q: Šta je vijugavo?
      a: Snaking je veslanje oko drugog surfera koji je već u poziciji za talas, tako da završite bliže vrhu. Smatra se izuzetno lošim bontonom i može dovesti do sukoba.
    - q: Mogu li početnici surfovati na prepunim pauzama?
      a: Da, ali ostanite u zoni bele vode daleko od vrha. Nemojte veslati u glavnom području poletanja dok ne možete dosledno uhvatiti talase i kontrolisati svoj pravac. Prepune postave zahtevaju iskustvo za bezbednu navigaciju.
    - q: Kako da se izvinim u vodi?
      a: Jednostavan talas, osmeh i "moja greška" ili "žao mi je" radi. Priznajte grešku i veslajte dalje od osobe. Surferi uglavnom opraštaju iskrene greške, pogotovo ako jasno učite.
    - q: Šta da radim ako neko padne na mene?
      a: Ako je to jasan drop-in, viknite "talas" ili "hej" da ih upozorite. Ako ga uhvate slučajno i izvinite se, pustite ga. Ako neko više puta padne, veslajte i ljubazno objasnite prioritet. Izbegavajte sukobe.
