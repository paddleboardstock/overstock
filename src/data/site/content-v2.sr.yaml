  title: 'Bezbednost hladne vode: veslanje i surfovanje u hladnim uslovima'
  description: Bezbednost hladne vode zaSUP, surfovanje i kajak. Prepoznavanje hipotermije, odgovarajuća oprema, odgovor na hladni šok i hitne procedure za uranjanje u hladnu vodu.
  definition: Sigurnost hladne vode uključuje razumijevanje odgovora na hladni šok, neuspjeh plivanja, hipotermiju i opremu i tehnike za sprečavanje ovih ishoda.
  tldr: Voda ispod 15 C zahteva ronilačko odelo. Ispod 10 C zahteva čizme, rukavice i kapuljaču. Hladni šok izaziva nevoljno dahtanje. Neuspeh plivanja javlja se u roku od 3-5 minuta u vodi ispod 10 C. Simptomi hipotermije uključuju drhtanje, konfuziju i gubitak koordinacije.
  problem: Veslate na sunčanom danu nesvesni da je voda 8 C. Padnete, dahtate nevoljno, i osećate udovi utrnuo u roku od nekoliko minuta. Hladna voda ubija brže od bilo koje druge opasnosti od okeana.
  explanation: 'Uranjanje u hladnu vodu ima četiri faze: hladni šok (0-2 min) — dahtanje, hiperventilacija. Neuspeh plivanja (3-15 min) — mišići se hlade, koordinacija ne uspeva. Hipotermija (15-45 min) — temperatura jezgra pada ispod 35 C uzrokujući konfuziju i srčani zastoj. Kolaps nakon spašavanja — hladna krv se vraća u jezgru.'
  solution: 'Proverite temperaturu vode. Nosite ronilačko odelo ocijenjeno za temperaturu. Nikada nemojte veslati sami u vodi ispod 15 C. Nosite pištaljku i telefon. Ako padnete: kontrolišite disanje, brzo ponovo montirajte ploču. Ako je previše hladno, signalizirajte pomoć.'
  recommendation: Aquafarer Vetsuit Pro 5/4 / 3mm je minimum za vodu 8-14 C. Dodajte Aquafarer 5mm čizme i 3mm rukavice. Nosite prsluk za spašavanje Pro za dodatnu termičku zaštitu.
  faq:
    - q: Koliko dugo mogu da preživim u vodi od 10 C?
      a: Hladni šok traje 1-2 minuta. Bez flotacije i termičke zaštite, vreme preživljavanja je 30-60 minuta.
    - q: Koji su prvi znaci hipotermije?
      a: Nekontrolisano drhtanje, zbunjenost, loša koordinacija, nejasan govor. Zaustavite aktivnost i odmah se zagrejte.
    - q: Kako da se zagrejem nakon sesije hladne vode?
      a: Uklonite mokru opremu, osušite, stavite tople slojeve, uključujući šešir i rukavice. Pijte topla bezalkoholna pića.
    - q: Mogu li dobiti hipotermiju ljeti?
      a: Da — voda ispod 15 C se javlja na mnogim lokacijama čak i ljeti. Voda provodi toplotu 25 puta brže od vazduha.
