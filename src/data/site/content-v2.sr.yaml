  title: 'Paddle Board Veličina Vodič: Zapremina, Dužina, i širina za svakog vozača'
  description: Kompletna veličina paddle board sa preporukama zapremine po težini i aktivnosti. Uključuje jednostavan za korišćenje tabelu veličine za sve-around, touring, surfovanje, i joga SUP ploče.
  definition: Veličina paddle board je određena zapreminom (kapacitet težine i plovak), dužina (brzina i praćenje), širina (stabilnost), i debljina (distribucija zapremine i otpor vetra).
  tldr: 'Koristite težinu da biste pronašli minimalnu zapreminu: 50-70 kg treba 220-260L, 70-90 kg treba 260-300L, 90-110 kg treba 300-350L, 110+ kg treba 350+L. Za početnike, dodajte 20% ovim brojevima. Širina je bitna: 32 "je srednji, 33-34" je početnik-prijateljski, 35"+ je veoma stabilan.'
  problem: Paddle board veličina listings koriste stopala, inča, i litara naizmenično, što otežava upoređivanje preko brendova.
  explanation: Zapremina je najdirektnija metrika za kapacitet težine — 1 litar slatke vode istiskuje 1 kg težine. Daska sa 260L teoretski može da podrži 260 kg, ali praktični kapacitet je manji jer daska treba da sedi iznad vode. Vaša ukupna težina (telo plus oprema) treba da bude 30-40% zapremine ploče.
  solution: Ciljna zapremina = (telesna težina u kg + težine zupčanika u kg) k 3. Za 75 kg veslač sa 5 kg brzine, meta = 80 k 3 = 240L minimum. Za početnike, pomnožite sa 3.5. Za napredne, pomnožite sa 2.5.
  recommendation: Aquafarer SUP Ekplorer 11 (260L, 11' k 33" k 6") odgovara većini vozača 50-100 kg. Lakši vozači mogu veličinu do AirDeck 270. Teži vozači treba da pogledate SUP Tour 12 (300L+) ili šire ploče.
  faq:
    - q: Da li visina bitno za SUP dimenzionisanje?
      a: Visina je bitna manje od težine. Visok lagani vozač treba manje zapremine od kratkog teškog vozača. Koristite težinu kao primarnu odrednicu zapremine.
    - q: Šta se dešava sa previše volumena?
      a: Ploča sedi previsoko, hvata vetar kao jedro. Oseća se plutasto u kotletu. Međutim, za početnike, dodatni volumen je bolji nego premalo.
    - q: Šta se dešava sa premalo volumena?
      a: Odbor sedi suviše duboko, stvarajući otpor. Nos može potopiti tokom veslanja (pearling). Brzo se umarate od veslanja delimično potopljene ploče.
    - q: Da li naduvavanje ploče treba drugačiju veličinu od tvrdih ploča?
      a: Ne značajno. Gumenjaci na 15+ PSI istiskuju vodu slično tvrdim pločama. Preporuke za volumen važe jednako za obe vrste.
