  title: 'Kako odabrati odijelo: objašnjenje uklapanja, debljine i karakteristika'
  description: Kompletan vodič za kupovinu odijela. Kako odabrati pravu debljinu za temperaturu vode, osigurati pravilno prianjanje, razumeti tipove šavova i odabrati funkcije na osnovu vaše aktivnosti.
  definition: 'Ronilačko odelo je neoprenska odeća koja obezbeđuje toplotnu izolaciju zarobljavanjem tankog sloja vode na koži. Ključni faktori selekcije: debljina, pristajanje, konstrukcija šava, ulazni sistem i tip neoprena.'
  tldr: 'Debljina podudaranja sa temperaturom vode: 3 / 2 mm za 14-20 C, 4 / 3 mm za 12-18 C, 5/4 / 3 mm za 8-14 C, 6/5 / 4 mm za ispod 8 C. Fit je najvažniji faktor. GBS šavovi su zlatni standard. Grudni zip smanjuje ispiranje. Krečnjak neopren je fleksibilniji od nafte na bazi nafte.'
  problem: Online tabele veličine odela su nepouzdane, preporuke za debljinu variraju u zavisnosti od brenda, a opisi karakteristika su zbunjujući.
  explanation: Brojevi debljine mokrog odela (3/2, 4/3, 5/4/3) odnose se na mm torza / ruku i nogu. Deblja odela su toplija, ali ograničavaju kretanje. Labavo odelo ispire toplu vodu. GBS šavovi su topli i fleksibilni; plosnati šavovi su manje topli. Ulazak u grudni koš je topliji od zadnjeg zipa. Krečnjak neopren je fleksibilniji u hladnoj vodi.
  solution: Izmerite grudi, struk, kukove i visinu. Uporedite sa tabelama veličina. Izaberite debljinu na osnovu najhladnije temperature vode. Izaberite GBS šavove za hladnu vodu. Preferirajte grudni zip ispod 15 C. Razmislite o termalnoj podlozi za dodatnu toplinu.
  recommendation: Aquafarer Vetsuit Pro u 3/2mm (14-20C) ili 5/4/3mm (8-16C) nudi GBS šavove, grudni zip i krečnjak neopren po konkurentnoj ceni.
  faq:
    - q: Koliko čvrsto treba da bude ronilačko odelo?
      a: Udoban bez vazdušnih džepova, ali ne i restriktivno. Prst ne bi trebalo da klizi lako u donjem delu leđa.
    - q: Koji je najtopliji tip odijela?
      a: 6/5 / 4mm odelo sa kapuljačom sa zapečaćenim šavovima i grudima-zip. Za ekstremne hladnoće, suvo odelo je superiorno.
    - q: Da li je skuplje odelo vredno toga?
      a: Viša cena kupuje bolji neopren, šavovi i karakteristike. Za redovnu upotrebu hladne vode, premija se isplati.
    - q: Mogu li da nosim ronilačko odelo za druge aktivnosti osim surfovanja?
      a: Da - ronilačka odela rade za SUPkajak, ronjenje, triatlon i plivanje u otvorenim vodama.
