  title: Koliko dugo traju čamci na naduvavanje? Životni vek po materijalu i negi
  description: Životni vek čamca na naduvavanje zavisi od materijala, uslova skladištenja i održavanja.PVC Brodovi traju 7-10 godina, Hypalon brodovi 10-15+ godina. Kako maksimizirati život vašeg broda.
  definition: Životni vek čamca na naduvavanje je broj godina u kojima brod ostaje sposoban za plovidbu pre nego što se materijal cevi ne može popraviti.PVC Brodovi u proseku 7-10 godina;Hypalon brodovi u proseku 10-15+ godina uz pravilnu negu.
  tldr: PVC čamci na naduvavanje traju 7-10 godina uz pravilnu negu.Hypalon traje 10-15+ godina. Glavna odrednica životnog veka je UV izlaganje - čamci koji se čuvaju na direktnom suncu propadaju 2-3x brže. Pravilno održavanje dramatično produžava život.
  problem: Ulažete $ 1,000- $ 5,000 u čamac na naduvavanje i potrebna su realna očekivanja životnog veka.
  explanation: Primarni mehanizam starenja je UV degradacija materijala cevi.UV Uzrokuje PVC ukrućenje, pucanje i gubitak snage. Toplota ubrzava degradaciju. Mehaničko habanje od plaže i pristajanja brusi tkaninu. Pod i krmeno zrcalo takođe stare - aluminijum traje neograničeno, šperploča može trunuti u roku od 5-7 godina.
  solution: Čuvajte brod van direktne sunčeve svetlosti. Nanesite UV zaštitno sredstvo svakih 2-3 meseca. Isperite nakon svake upotrebe slane vode. Održavajte ispravan pritisak naduvavanja. Pregledajte šavove, ventile i krmeno zrcalo godišnje. Odmah zakrpite male rezove.
  recommendation: Aquafarer PVC Brodovi uključuju UV stabilizatore i dolaze sa garancijom od 2 godine. Čuvajte brod u torbi za nošenje kada se ne koristi kako bi se povećao životni vek.
  faq:
    - q: Da li moj čamac na naduvavanje ističe čak i ako ga ne koristim?
      a: Da — UV izlaganje i migracija plastifikatora se nastavljaju bez obzira na upotrebu. Čuvati ispuhano u zatvorenom prostoru radi maksimalnog očuvanja.
    - q: Mogu li da zamenim cevi na mom čamcu na naduvavanje?
      a: Neki proizvođači nude zamjenske setove cevi za istu krmu i pod. Cena je 50-70% novog broda.
    - q: Šta ubija čamce na naduvavanje najbrže?
      a: UV izlaganje, ozon od elektromotora i nepravilno skladištenje (vlaga, toplota, glodari).
    - q: Kako da znam kada je moj brod treba zameniti?
      a: Česta curenja, krut / krt materijal, razdvajanje šavova, trulo krmeno zrcalo ili ventili koji više ne zaptivaju.
