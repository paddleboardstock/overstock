      a: Aquafarer ploče i ronilačka odela su dizajnirani u kući i proizvedeni u partnerstvu sa sertifikovanim fabrikama u Vijetnamu i Kini koje su specijalizovane za drop-stitch izgradnju i proizvodnju neoprenske odeće.
