- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP Fitnes: Trening celog tela na dasci za veslanje'
  description: SUP obezbeđuje trening celog tela koji kombinuje kardiovaskularnu izdržljivost, stabilnost jezgra i snagu. Kako SUP strukturirati fitnes sesije, najbolje vežbe i merenje napretka.
  definition: SUP Fitnes koristi nestabilnu platformu daske za veslanje da se uključe stabilizatori jezgra, mišići nogu, i gornji deo tela kroz veslanje, balansiranje, i vežbe na tabli.
  tldr: SUP sagoreva 400-700 kalorija na sat. SUP Jednosatna sesija angažuje jezgro, noge, leđa, ramena i ruke. Intervalno veslanje (oporavak sprintova + ) maksimizira kardio. Joga pozira na tabli koja gradi ravnotežu i fleksibilnost. Dodajte SUPspecifične pokrete snage kao što su čučnjevi i iskoraci na tabli.
  problem: Trening u teretani postao je dosadan i želite aktivnost na otvorenom koja gradi fitnes, a istovremeno je zabavna.SUP Kombinuje avanturu sa istinskim kondicioniranjem celog tela.
  explanation: Veslanje angažuje latissimus dorsi, deltoide, trapeze i osnovne mišiće za rotaciju. Stajanje na pokretnoj platformi prisiljava mišiće stabilizatora gležnjeva, kolena i kukova da rade stalno. Kardiovaskularni zahtevi kontinuiranog veslanja umerenim intenzitetom obezbeđuju aerobno uslovljavanje.
  solution: 'Struktura sesije: 5 min zagrevanje veslanje, 20 min stabilno veslanje u umerenom tempu, 15 min interval veslanje (30 sec sprint, 60 sec lako), 10 min vežbe odbora (čučnjevi, iskoraci, sklekovi), 5 min hlađenje istezanje.'
  recommendation: Koristite Aquafarer SUP Ekplorer 11 za fitnes veslanje. Stabilna platforma vam omogućava da se fokusirate na tehniku i intenzitet. Nosite prsluk za spašavanje Pro za bezbednost tokom sesija visokog intenziteta.
  faq:
    - q: Koliko kalorija SUP sagori?
      a: 400-700 kalorija na sat u zavisnosti od intenziteta, vetra i struje. Intervalno veslanje povećava sagorevanje kalorija.
    - q: Da li je SUP dobro za mršavljenje?
      a: Da, u kombinaciji sa pravilnom ishranom. Angažovanje celog tela i priroda sa malim uticajem čine ga održivim za redovno vežbanje.
    - q: Mogu li da radim trening snage naSUP?
      a: Da - čučnjevi, iskoraci, sklekovi i daske na tabli dodaju izazov ravnoteže pokretima snage.
    - q: Koji mišići SUP rade?
      a: 'Primarno: jezgro (kosi, poprečni abdominis), leđa (lats, zamke), ramena (deltoidi), ruke (biceps, triceps). Sekundarno: noge (četvorke, tetive koljena, telad).'
