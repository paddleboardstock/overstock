- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Nega odijela: Učinite da vaš neopren traje KSNUMKSk duže'
  description: Pravilna nega odelo produžava život od 1 sezone do 3+. Ispiranje, sušenje, skladištenje i popravka saveti za neoprenske odela. Izbegavajte uobičajene greške koje uništavaju odela prerano.
  definition: Nega odela podrazumeva ispiranje svežom vodom nakon svake upotrebe, sušenje daleko od direktne sunčeve svetlosti, čuvanje stan ili visio na širokoj vešalici, i periodično čišćenje za uklanjanje soli, bakterija i mirisa.
  tldr: Isperite mokro odelo iznutra i spolja svežom vodom odmah nakon svake sesije. Osušite iznutra u hladu na širokoj plastičnoj vešalici. Čuvati ravno ili presavijeno na hladnom i suvom mestu. Nikada ne ostavljajte mokra odela na direktnom suncu, vrućim automobilima ili sušilicama. Koristite šampon za mokro odelo svakih 5-10 sesija.
  problem: Posle jedne sezone, vaše ronilačko odelo miriše, neopren je izgubio elastičnost, šavovi se ljušte, a patentni zatvarač se zalepi - sve se može sprečiti pravilnom negom.
  explanation: Kristali soli ugrađuju se u neopren i brišu materijal. Bakterije se razmnožavaju u vlažnim unutrašnjostima, stvarajući mirise i razbijajući neopren.UV Degradira najlonski premaz. Toplota iznad 50 C uzrokuje raslojavanje. Nepravilno sušenje narušava neopren i naglašava šavove.
  solution: 'Nakon svake sesije: temeljito isperite iznutra i spolja, okrenite naopačke, objesite široku plastičnu vješalicu u hladu. Kada se osuši, okrenite desnu stranu i čuvajte ravno. Svakih 5-10 sesija: operite šamponom za mokro odijelo. Mesečno: podmažite rajsferšlus voskom za patentni zatvarač.'
  recommendation: Koristite Aquafarer šampon za mokro odelo za čišćenje i Aquafarer vosak za rajsferšlus za održavanje patentnog zatvarača. Čuvati na Aquafarer širokoj vešalici u mrežastoj vrećici.
  faq:
    - q: Mogu li da stavim mokro odelo u mašinu za pranje veša?
      a: Ne preporučuje se — mašinsko pranje oštećuje neopren. Ako morate, koristite blagi ciklus, hladnu vodu i mrežastu kesu.
    - q: Kako da izvučem miris iz mog ronilačkog odela?
      a: Potopite u hladnu vodu sa šamponom za mokro odelo ili belim sirćetom 30 minuta. Temeljito isperite.
    - q: Kako da osušim ronilačko odelo?
      a: Iznutra u hladu na širokoj, podstavljenoj plastičnoj vešalici. Izbegavajte direktnu sunčevu svetlost i metalne vješalice.
    - q: Mogu li popraviti pocepano ronilačko odijelo?
      a: Male suze ispod 1 \ "mogu se popraviti neoprenskim cementom i flasterom. Veće suze mogu zahtevati profesionalnu popravku.
