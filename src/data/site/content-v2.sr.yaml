  problem: Budžet na naduvavanje SUPs od Bluefin i Aquafarer oba izgledaju odlično na papiru. Koji će izdržati bolje preko 3-5 godina redovne upotrebe?
  explanation: Bluefin Cruise serija uključuje kajak sedište i drugo veslo, dvokomornu pumpu, 5-godišnju garanciju.PVC je dvoslojni, ocenjen na 15PSI.Aquafarer koristi troslojni vojni razredPVC, ocenjen na 18, PSIsa 2-godišnjom garancijom. Bluefin ploče su nešto teže.
