- slug: foam-board-vs-hard-surfboard
  category: comparison
  type: buying-guide
  title: 'Pena odbor protiv tvrde daske za surfovanje: koji sprečava početnike da odustanu'
  description: Pena vs hard daska za surfovanje odluka može napraviti ili slomiti svoju prvu godinu surfovanja. Pravi prednosti i mane, bezbednosne razlike, i jedan početnici treba da počnu sa (to nije tvrda tabla).
  definition: Penaste ploče koriste meko jezgro od pene sa izdržljivom kožom - stabilne su, sigurne i idealne za početnike. Tvrde ploče koriste PU ili epoksidnu penu sa fiberglasom - one su tvrđe, brže i osjetljivije, ali krhke.
  tldr: Pena ploče (uključujući naduvavanje) su sigurnije, stabilniji, i bolje za početnike. Hard ploče nude bolje performanse, ali zahtevaju veću veštinu i skloni su dings. Većina surfera treba da počne na penu ili naduvavanje i prelazak na hard daske nakon 6-12 meseci redovnog surfovanja.
  problem: Imate budžet za jednu ploču i treba da odlučite između meke pene odbora i tradicionalne tvrde epoksidne ili PU ploče. Pena ploče izgledaju previše osnovni, ali tvrde ploče ding lako i koštaju više. Pogrešan izbor znači izgubljen novac ili odbor koji koči svoj napredak.
  explanation: Pena ploče koriste jezgro pene visoke gustine (EPS ili slično) sa mekim spoljnim slojem. Oni dobro plutaju, apsorbuju udar, i teže manje od tvrdih ploča. Naduvavanje drop-stitch ploče su moderna varijanta sa sličnim prednostima stabilnosti. Hard ploče su napravljene od poliuretana (PU) ili epoksidne pene sa smolom i fiberglasa ljuske. Oni su tvrđi, brži, i više reaguju, ali teži više i da su krhki. Razlika u performansama je bitno kada se okrećete i generiše brzinu na talasu lica, ali je nebitno dok ne možete pouzdano uhvatiti talase.
  solution: Počnite sa penom ili naduvavanje odbora i provesti najmanje 6 meseci izgradnju veslanje snagu, talas čitanje, i pop-up doslednost. Prodaja pene odbor i kupiti hard odbor kada možete dosledno voziti neprekinute talase i osećaju ograničeni flek-a i težine pene odbora je. Izbegavajte iskušenje da kupi hard odbor prvo samo zato što izgleda kao "pravi" daska za surfovanje.
  recommendation: Aquafarer Surfboard Pro (na naduvavanjedrop-stitch) obavlja bolje od tipičnih pene odbora, a ostaje početnik-prijateljski. To se proteže fazu pene odbora duže, što znači da se više meseci od jednog odbora pre nego što treba da nadogradite na hard tabli.
  faq:
    - q: Da li je penaste ploče teže okrenuti?
      a: Da. Pena ploče imaju veći volumen i savijanje, što čini skretanja manje reaguje. Ovo je zapravo korisno za početnike jer sprečava preterano upravljanje i podstiče glatke, postepene promene težine.
    - q: Da li tvrde ploče ding lako?
      a: Da. Tvrda epoksidna ili PU ploča može ding od manjeg sudara, pao povodac, ili čak odmara na tvrdoj površini. Pena i naduvavanje ploče su gotovo neuništivi u poređenju.
    - q: Mogu li da naučim da surfujem na tvrdoj dasci?
      a: Možete, ali je teže i rizičnije. Tvrde ploče su klizave, manje stabilne i izazivaju više povreda pri udaru. Većina škola za surfovanje koristi penu ili daske na naduvavanje sa dobrim razlogom.
    - q: Koliko dugo traje ploča od pene?
      a: Kvalitetna ploča od pene traje 12-18 meseci uz redovnu upotrebu pre nego što koža počne da se ljušti. Daske na naduvavanje traju 3-5 godina, jer drop-stitch konstrukcija ne komprimira ili raslojava na način na koji to rade penaste kože.
