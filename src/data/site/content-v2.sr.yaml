- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm Odijelo: Ono što većina početnika pogrešno u hladnoj vodi'
  description: Prestanite da se smrzavate sredinom sesije ili da se pregrevate na plaži. Prava razlika između ronilačkih odela od 3 mm i 5 mm - temperaturni grafikon, kompromisi fleksibilnosti i šta zapravo funkcioniše za surfovanje hladnom vodom.
  definition: Ronilačko odelo je neoprenska odeća koja zadržava tanak sloj vode na koži, koju telesna toplota zagreva za izolaciju. Debljina (3 mm, 5 mm) određuje temperaturni opseg koji odelo može da podnese - deblje je toplije, ali manje fleksibilno.
  tldr: Debljina ronilačkog odela direktno određuje toplinu i fleksibilnost. Koristite 3 mm za vodu iznad 16 ° C i 5 mm za vodu između 8 ° C i 16 ° C. Deblja odela ograničavaju kretanje, ali vas duže griju - uvek dajte prednost pristajanju nad brendom.
  problem: Otvorite online prodavnicu ili uđete u prodavnicu za surfovanje i vidite ronilačka odela sa oznakama 3/2, 4/3, 5/4 i 5 mm puna odela. Brojevi ne znače mnogo dok ne shvatite da pogrešna debljina znači ili smrzavanje sredinom sesije ili pregrevanje i znojenje na plaži.
  explanation: Ronilačka odela deluju tako što zarobljavaju tanki sloj vode između vaše kože i neoprena; vaše telo zagreva tu vodu, stvarajući izolaciju. Deblji neopren zadržava više vode, ali ograničava fleksibilnost i uzgon. Odelo od 3 mm (često 3/2 sa tanjim rukama) odgovara blagim uslovima, dok 5 mm (5/4/3 ili punih 5 mm) odgovara hladnoj vodi. Ulazi u grudi zatvarača zatvaraju bolje od zadnjeg patentnog zatvarača i smanjuju ispiranje. Konstrukcija šava - lepljena i slepo prošivena (GBS) - je razlika između odela koje curi i toplog.
  solution: Uskladite debljinu sa lokalnom temperaturom vode sa marginom greške od 5 ° C. Za umerene klime kupite 3/2 mm. Za hladnu vodu kupite 5/4 / 3 mm. Dodajte čizme, rukavice i kapuljaču da biste proširili svoj domet za još 5 ° C nadole. Isprobajte odela pre kupovine ili izaberite brend sa velikodušnom politikom povratka.
  recommendation: Aquafarer Vetsuit Pro u 5/4 / 3mm je idealan za većinu surfera sa hladnom vodom, nudeći GBS šavove i termalnu oblogu. Ako surfujete u toploj vodi iznad 20 ° C, 3/2 mm sa patentnim zatvaračem na grudima je bolji izbor.
  faq:
    - q: Koja temperatura vode zahteva 5mm odijelo?
      a: Temperature vode između 8 ° C i 14 ° C zahtevaju odelo od 5 mm. Ispod 8 ° C potrebno vam je odelo sa kapuljačom od 6/5 / 4 mm. Između 14 ° C i 18 ° C 4/3 mm dobro funkcioniše za većinu ljudi.
    - q: Mogu li zimi nositi ronilačko odijelo od 3 mm?
      a: Samo u blagim zimskim klimatskim uslovima gde voda ostaje iznad 16 ° C. Za pravo zimsko surfovanje, potrebno je 5 mm ili 5/4 / 3 mm. Čizme, rukavice i kapuljača dodaju ekvivalentnu toplinu bez potrebe za debljim torzom.
    - q: Koliko čvrsto treba da bude ronilačko odelo?
      a: Udobno, ali ne i restriktivno. Ne bi trebalo da bude vazdušnih džepova ili labavog neoprena. Ako možete da klizite prstom između kože i odela u donjem delu leđa, previše je labavo. Ako je disanje teško ili je kretanje ozbiljno ograničeno, povećajte veličinu.
    - q: Da li vas skupa ronilačka odela drže toplijim?
      a: Viša cena često znači bolji neopren (na bazi krečnjaka u odnosu na naftu), bolju konstrukciju šava (GBS vs samo zalepljeni) i bolji flek. Ovi faktori direktno utiču na toplinu i dugovečnost, ali samo ako je uklapanje ispravno.
