- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Uslovi vetra zaSUP: Kako vetar utiče na veslo'
  description: Kako brzina i pravac vetra utiču SUP na veslanje. Razumevanje offshore vs onshore vetra, čitanje prognoze vetra, veslanje tehnike za vetar, i kada da ostanu na obali.
  definition: Uslovi vetra definišu SUP bezbednost. Offshore vetar (kopno na more) vas gura. Kopneni vetar (more na kopno) gura vas prema obali. Bočni vetar izaziva odbor da skrene.
  tldr: 'Maksimalni bezbedan vetar za početnike: 10 čvorova. Srednji: 15 čvorova. Napredni: 20 čvorova. Offshore vetar je najopasniji. Prvo veslajte uz vjetar. U bočnom vetru, veslajte blago uz vjetar od odredišta. Kleknite u jakom vetru da biste smanjili svoj profil.'
  problem: Veslate se u mirnim uslovima, ali 30 minuta kasnije vetar je pokupio i borite se da se vratite. Vetar je najviše potcenjen SUP faktor bezbednosti.
  explanation: Vetar utiče SUP više od bilo kog drugog vesla, jer stojite, stvarajući efekat jedra. Vetar KSNUMKS-čvor stvara mnogo više otpora na stojećem veslaču nego na sedećem kajakašu. Offshore vetar vas gura daleko od sigurnosti. Bočni vetar uzrokuje skretanje nosa.
  solution: 'Proverite brzinu vetra i pravac pre veslanja. Koristite Beaufort skalu: Sila 3 (7-10 čvorova) za početnike, Sila 4 (11-16) za medije. Veslo uz vjetar prvi. Ako uhvaćen u vjetar na moru, vesla na 45 stepeni na vetar. Kleknite u jakom vetru.'
  recommendation: Koristite aplikaciju za prognozu vetra (Vindi, Vindfinder) pre svake sesije. Aquafarer SUP Turneja 12 prati bolje na vetru od širih ploča. U vetrovitim uslovima, koristite kraće vesla poteze i veću kadencu.
  faq:
    - q: Koji pravac vetra je najsigurniji zaSUP?
      a: Vetar na kopnu (duva prema kopnu) je najsigurniji - gura vas nazad. Vetar na moru je najopasniji.
    - q: Kako da veslam u bočnom vetru?
      a: Veslajte više na strani vetra da se suprotstavi drift. Ugao ploču uz vetar vašeg odredišta. Dublji centar peraja pomaže.
    - q: Mogu li veslati u vetru od 20 čvorova?
      a: Samo ako su iskusni u zaštićenim vodama. Početnici ne bi trebalo da veslaju iznad 10 čvorova.
    - q: Kako udari vetra utiču SUP?
      a: Udari izazivaju iznenadne izazove ravnoteže. U naletima uslova, smanjite stav i budite spremni za nagle smene.
