- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP sa svojim psom: Kompletan kako-da vodič'
  description: Veslanje na dasci sa svojim psom - priprema, bezbednost, koraci obuke, preporuke za opremu i saveti za zabavno iskustvo za oboje.
  definition: SUP Sa psom podrazumeva obuku vašeg psećeg pratioca da uspostavi ravnotežu na dasci za veslanje, opremajući ih PFDpsom i veslajući bezbedno zajedno.
  tldr: Počnite sa širokim, stabilnim SUP (34 "). +Nabavite svom psu pravilno postavljen prsluk za spašavanje sa drškom. Prvo uvedite ploču na kopno, a zatim u plitku vodu. Počnite sa kratkim sesijama i pozitivnim pojačanjem. Uvek nosite vodu za svog psa. Pazite na znakove stresa ili umora.
  problem: Vaš pas voli vodu, ali niste sigurni kako da ih upoznate SUP sa bezbedno. Bez odgovarajuće obuke, pas može paničariti, skočiti ili ogrebati ploču.
  explanation: 'Psi imaju prirodnu sposobnost plivanja, ali moraju naučiti da je ploča sigurna platforma. Ključ je postepena desenzibilizacija: uvedite ploču na čvrsto tlo, nagradite mirno ponašanje, zatim pređite u plitku vodu i na kraju u dublju vodu.'
  solution: 'Počnite na kopnu: pustite psa da njuška i hoda po dasci (na travi). Nagradite mirno ponašanje. Sledeće: stavite ploču u vrlo plitku vodu, podržite je, pustite psa da stoji na njoj. Nagrada. Sledeće: ukrcate se na brod u plitkoj vodi, da se pas pridruži. Konačno: veslajte polako u mirnoj vodi.'
  recommendation: Koristite Aquafarer SUP Ekplorer 11 za svoju 33 "stabilnu platformu. Dodajte psa PFD (prsluk za spašavanje). Donesite svežu vodu i posudu. Počnite sa 10-minutnim sesijama i izgradite.
  faq:
    - q: SUP Koja veličina mi je potrebna za mog psa?
      a: Široka ploča KSNUMKS-KSNUMKS \ "pruža stabilnost za srednje i velike pse. Mali psi (ispod KSNUMKS kg) mogu upravljati na pločama KSNUMKS +\ ".
    - q: Da li je mom psu potreban prsluk za spašavanje?
      a: Da - čak i jakim plivačima je potreban pas PFD sa drškom za lako pronalaženje u hitnim slučajevima.
    - q: Kako da zaštitim ploču od kandži?
      a: Držite pseće nokte podrezane. Koristite zaštitnik ili peškir za palubu. Psi se obično prilagođavaju i prestaju da se grebu kada im bude udobno.
    - q: Može li bilo koji pas SUPnaučiti?
      a: Većina pasa može da uči sa strpljenjem. Anksioznim psima može trebati duže. Nikada ne prisiljavajte uplašenog psa na tablu - to stvara negativne asocijacije.
