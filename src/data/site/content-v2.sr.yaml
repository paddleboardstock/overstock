- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Popravka odijela: popravite suze, šavove i patentne zatvarače sami'
  description: Uradi sam vodič za popravku odela za neoprenske suze, razdvajanje šavova, zaglavljivanje patentnih zatvarača i podeljene jastučiće za kolena. Korak po korak uputstva korišćenja neoprenskog cementa.
  definition: Popravka odela podrazumeva čišćenje i grubo oštećeno područje, nanošenje neoprenskog cementa i sušenje pod pritiskom kako bi se vratio vodonepropusni integritet i fleksibilnost.
  tldr: 'Male suze ispod 1 ": nanesite neoprenski cement na obe strane, sačekajte 10-15 minuta dok ne postane lepljiv, čvrsto pritisnite, očvrsnite pod težinom 12 sati. Veće suze trebaju neoprensku zakrpu. Pitanja patentnog zatvarača: prvo podmazati, a zatim provjeriti ima li zaglavljenih tkanina.'
  problem: Vaš odelo ima malu suzu, šav razdvajanje, ili rajsferšlus koji se drži. Bez DII popravke, plaćate $150+ za zamenu kada je popravka košta $5.
  explanation: Neopren cement radi omekšavanjem neoprenske površine, stvarajući hemijsku vezu kao rastvarač isparava. Cement se mora naneti na obe površine i postati lepljiv pre spajanja. Za suze, ivice moraju precizno poravnati. Pitanja rajsferšlus su često soli korozije ili tkanine uhvaćene u zubima.
  solution: 'Za suze: očistite alkoholom, lagano peskajte, nanesite tanki sloj cementa na obe ivice, sačekajte dok ne postane lepljiv, savršeno pritisnite zajedno, nanesite težinu, očvrsnite 12-24 sata. Za flastere: izrežite flaster 1 "veći od suze, nanesite cement na oba, stegnite ga. Za patentni zatvarač: isperite, nanesite vosak za patentni zatvarač, lagano radite.'
  recommendation: Držite Aquafarer komplet za popravku odela u torbi za opremu. Za velike popravke ili kvarove šavova u kritičnim tačkama, preporučuje se profesionalna popravka.
  faq:
    - q: Mogu li koristiti super lepak na ronilačkom odijelu?
      a: Ne — super lepak se suši tvrdo i krhko. Koristite samo neoprenski cement ili akuaseal za popravke ronilačkih odela.
    - q: Koliko dugo traje popravka neoprenskog cementa?
      a: Pravilno obavljena popravka je često jača od originalnog neoprena i traje preostali život odela.
    - q: Mogu li popraviti patentni zatvarač koji se potpuno odvojio?
      a: Ako se staza odvojila od neoprena, ponovo zalepite kontaktnim cementom. Ako su zubi oštećeni, profesionalno zamenite patentni zatvarač.
    - q: Kako da popravim ronilačko odelo koje curi na šavu?
      a: Nanesite tanku perlu akuaseal-a duž unutrašnje strane šava koji curi i ostavite da se očvrsne 24 sata.
