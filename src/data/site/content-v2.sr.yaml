- slug: understanding-tides
  category: guide
  type: technical
  title: 'Razumevanje plime i oseke za vodene sportove: praktični vodič'
  description: Kako plima utiču SUPna uslove surfovanja i kajaka. Čitanje karata plime i oseke, razumevanje proleća vs plime i oseke i planiranje sesije oko plimnih pokreta radi sigurnosti.
  definition: Plima i oseka su dnevni porast i pad nivoa mora uzrokovan gravitacionim privlačenjem Meseca i Sunca. Plimni opseg varira u zavisnosti od lokacije i lunarnog ciklusa.
  tldr: 'Dve visoke i dve oseke dnevno na većini lokacija. Prolećne plime (pun / mladi mesec) imaju veće opsege i jače struje. Neap plima (četvrtina meseca) imaju manje opsege. Plima utiče na dubinu vode, oblik talasa i trenutnu snagu. Za SUP: prvo veslo protiv struje, tako da vam pomaže da se vratite.'
  problem: Stižete na lokalnu pauzu da biste pronašli jedva bilo kakav surf, opasne ripove od odlazeće plime ili vodu previše plitku. Bez razumevanja plime i oseke, gubite putovanja ili veslate u opasnim uslovima.
  explanation: Plime su uzrokovane gravitacijom Meseca. Prolećne plime (pun i mladi mesec) proizvode najviše uspone i najniže padove. Neap plima (četvrtina meseca) proizvode minimalan domet. Plimne struje su najbrže na sredini plime, zatišje na visokom i niskom. Plimni opseg varira od 0.3m (Mediteran) do 16m (Bai of Fundi).
  solution: 'Proverite grafikon plime pre svake sesije. Za surfovanje: plaža pauze često rade najbolje 2-3 sata sa obe strane plime. Za SUP: veslo protiv trenutne prve polovine tako da trenutna pomaže vratiti. Za ribolov: dolazni plima gura ribu na stanove.'
  recommendation: Koristite NOAA predviđanja plime ili lokalnu aplikaciju za plimu. Saznajte preferenciju plime vašeg lokalnog odmora tako što ćete prijaviti uslove tokom mesec dana.
  faq:
    - q: Šta je prolećna plima?
      a: Prolećne plime se javljaju tokom punog i mladog meseca, stvarajući veće plime i jače struje. Javljaju se dva puta mesečno.
    - q: Šta je plima?
      a: Neap plima se javljaju tokom četvrtina meseca. Opseg plime i oseke je manji, a struje su slabije - dobro za početnike.
    - q: Da li su oseke opasne zaSUP?
      a: Niska plima može izložiti stene i grebene. Takođe koncentriše energiju talasa na strmijim sprudovima.
    - q: Kako plima utiče na rip struje?
      a: Odlazni plima (oseka) ojačati rip struje. Dolazni plima (poplava) smanjuju rip snagu.
