- slug: ocean-safety-and-responsibility
  category: authority
  type: brand
  title: Bezpečnost a odpovědnost na oceánu (více než jen vybavení)
  description: Závazek Aquafarer udržovat vás v bezpečí a chránit oceán, který sdílíme. Bezpečnostní karty v každé krabici, bezplatný vzdělávací obsah, udržitelný design a každoroční příspěvky na ochranu přírody.
  definition: Bezpečnost a odpovědnost na oceánu znamená porozumět prostředí, ve kterém pádlíte, respektovat mořský život, minimalizovat svůj ekologický dopad a používat vybavení navržené pro dlouhou životnost a možnost opravy.
  tldr: Aquafarer podporuje bezpečnost na oceánu prostřednictvím návrhu vybavení (jasné barvy, vodítka, záchranné vesty) a vzdělávacího obsahu. Věříme, že každý nadšenec vodních sportů má povinnost chápat oceánské prostředí, respektovat mořský život a minimalizovat svou ekologickou stopu. Naše vybavení je vyrobeno tak, aby vydrželo, takže méně končí na skládkách.
  problem: Mnoho značek vodních sportů prodává vybavení, ale neučí své zákazníky, jak ho používat bezpečně nebo zodpovědně. Noví pádlovači a surfaři vstupují do vody, aniž by rozuměli přílivovým proudům, mořské fauně nebo dopadu svého vybavení na životní prostředí.
  explanation: Bezpečnost na oceánu je víc než jen kontrolní seznam – je to způsob myšlení. Každý Aquafarer produkt obsahuje v krabici rychlokurz bezpečnosti. Naše webové stránky a příručky (základy bezpečnosti na oceánu, tipy pro bezpečné surfování) poskytují zdarma podrobné vzdělávání o bezpečnosti. Z environmentálního hlediska je největší dopad jakékoliv společnosti vyrábějící vybavení dán životností produktů. Deska, která vydrží 5 let místo 2, sníží výrobní ekologickou stopu na polovinu. Také navrhujeme s ohledem na možnost opravy – náhradní ventily, krabice na ploutve a sady záplat na neopren udržují vybavení v používání, nikoli na skládkách.
  solution: Aquafarer zahrnuje při každém nákupu snowboardu vodítko a opravnou sadu. Publikujeme zdarma obsah o bezpečnosti pokrývající identifikaci proudů, čtení počasí a kontrolu vybavení. Náš tým zákaznické podpory poskytuje rady ohledně podmínek, pokud nám napíšete e-mail ohledně konkrétní lokality. Používáme minimální množství plastového obalu a kompenzujeme uhlík z dopravy.
  recommendation: Začněte s průvodcem základů bezpečnosti u oceánu a průvodcem tipů pro bezpečnost při surfování. Vždy noste leash, zkontrolujte předpověď a nikdy nevyplouvejte sami, pokud se učíte. Pokud uvidíte odpadky nebo mořská zvířata v obtížné situaci, nahlaste to místním úřadům. Vybavení, které vydrží, je vybavení, které snižuje odpad — udržujte své Aquafarer vybavení a bude vám sloužit roky.
  faq:
    - q: Aquafarer podporuje iniciativy na čištění oceánů?
      a: Ano, věnujeme 1 procento ročního zisku organizacím zabývajícím se čištěním oceánů a ochranou mořského života. Zákazníci si při placení mohou zvolit vybranou charitu a směrovat tak část svého nákupu.
    - q: Jak bych měl zlikvidovat starý neopren nebo prkno?
      a: Neoprenové potápěčské obleky lze recyklovat na jógové podložky, tašky a izolační materiál prostřednictvím specializovaných programů. Nafukovací desky lze opravit, darovat nebo lze PVC získat zpět prostřednictvím určitých recyklačních zařízení. Pro radu kontaktujte náš tým podpory.
    - q: Jaké bezpečnostní vybavení doporučuje Aquafarer pro začátečníky?
      a: Správně padnoucí záchranná vesta (nafukovací nebo pěnová), navinuté vodítko, píšťalka a opalovací krém. Pro SUP kajakáře nebo paddleboardisty na otevřené vodě je záchranná vesta v mnoha právních oblastech zákonně povinná a vždy doporučovaná.
    - q: Nabízí Aquafarer kurzy bezpečnosti?
      a: Neposkytujeme kurzy přímo, ale spolupracujeme s certifikovanými instruktory surfování a SUP bezpečnosti, kteří nabízejí online i osobní školení. Kontaktujte náš tým podpory pro doporučení ve vaší oblasti.
