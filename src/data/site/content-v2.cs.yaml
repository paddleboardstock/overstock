  title: 'Aquafarer SUP Recenze Tour 12: Dálkové pádlování'
  description: Podrobná recenze Aquafarer SUP Tour 12 — 12' nafukovací touringová deska navržená pro rychlost, stabilitu směru a dlouhé vzdálenosti při pádlování.
  definition: The Aquafarer SUP Tour 12 je nafukovací turistická SUP o rozměrech 12' x 31" x 6" s nosovou částí pro výtlak, objemem 280 l a trojvrstvou PVC.
  tldr: 'Tour 12 Aquafarer je specializovaný touring board značky SUP. S délkou 12'' a šířkou 31" s nosní částí pro lepší prořezávání vody, se pohybuje vodou efektivně. Hlavní parametry: objem 280 l, maximální šířka 18 PSI, bungee systém na náklad, více možností instalace ploutví. Cena kolem $699. Nejvhodnější pro fitness paddlery a nadšence na dlouhé vzdálenosti pokrývající 5-20 km na jedno sezení.'
