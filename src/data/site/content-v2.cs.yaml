- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Průvodce kotvením: Zůstaňte na místě při rybaření nebo fotografování'
  description: Kompletní průvodce kotvením SUP — typy kotev (houbová, skládací, kolíková), nastavení kladky kotvy, techniky nasazení a bezpečnostní aspekty pro udržení pozice.
  definition: Kotva SUP je závaží připevněné k lanu, které drží prkno na místě proti větru a proudu. Mezi běžné typy patří hřibové kotvy, skládací kotvy a tyče k zapíchnutí.
  tldr: Použijte houbový kotvu (0,7-1,4 kg) pro bahnité nebo písečné dno, skládací kotvu pro skalnaté dno nebo tyč kotvy pro mělkou vodu s měkkým dnem. Kotva by měla vážit 0,7-1,4 kg pro klidné podmínky, 1,4-2,3 kg pro vítr a proud. Vždy používejte kladkový systém kotvy k úpravě polohy a vězte, kdy kotvu uvolnit.
  problem: Najdete perfektní místo pro rybaření, ale vítr a proud vás každých pár minut strhávají z pozice. Bez zakotvení jsou SUP rybaření a fotografie frustrujícími cvičeními v neustálém přesouvání.
  explanation: Kotva funguje tak, že se táhne po dně, dokud se nezapíchne. Houbové kotvy se zahrabávají do měkkého dna a poskytují dobrou oporu v písku a blátě. Skládací kotvy mají ramena, která se zaryjí do tvrdého nebo skalnatého dna. Kolíkové tyče fungují v mělké vodě tak, že se přímo zavrtají do dna.
  solution: Nainstalujte systém kotvícího vozíku (lana s klouzacím kroužkem na jedné straně desky) pro nastavení místa připevnění kotvy. Připevněte 50–75 stop lana ke kotvě. Uveďte kotvu proti větru nebo proti proudu vašeho požadovaného místa. Použijte rychloupínací systém pro odpojení v nouzových situacích. Nikdy nekotvěte v silném proudu nebo tam, kde kotvu nelze snadno vytáhnout.
  recommendation: Skládací kotva o hmotnosti 3 libry s 50' lanem funguje pro většinu SUP rybářských podmínek. Přidejte systém kotvového vozíku pomocí D-kroužků na vašem Aquafarer SUP Explorer 11.
  faq:
    - q: Jakou velikost kotvy potřebuji pro SUP?
      a: 1,5-3 libry pro klidná jezera a pomalé řeky. 3-5 libry pro pobřežní oblasti s větrem nebo proudem. Příliš velké kotvy jsou obtížně vytažitelné.
    - q: Kolik kotevního lana potřebuji?
      a: Standardní je poměr 5:1 (5 stop lana na každou 1 stopu hloubky). V 10 stopách vody použijte 50 stop lana.
    - q: Je kotvení nebezpečné na SUP?
      a: Pouze pokud zakotvíte v proudu nebo větru dost silném na převrhnutí prkna. Vždy používejte systém rychlého uvolnění, který lze okamžitě odpojit.
    - q: Mohu zakotvit v jakékoli vodě?
      a: Zkontrolujte místní předpisy. Některé oblasti omezují kotvení kvůli ochraně mořské trávy nebo mořských stanovišť. Nikdy nekotevte na korálových útesech.
