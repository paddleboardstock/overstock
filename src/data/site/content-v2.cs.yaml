- slug: aquafarer-oars-pump-set-review
  category: product
  type: product
  title: 'Aquafarer Vesla a sada čerpadel: Recenze nezbytného příslušenství'
  description: Recenze Aquafarer vesel a sady čerpadla — včetně dvoukomorového vysokotlakého čerpadla a hliníkových vesel navržených pro nafukovací čluny a SUPs.
  definition: Sada Aquafarer vesel a pumpy zahrnuje vysokotlakou dvoukomorovou pumpu s manometrem a sadu hliníkových vesel s vyztuženými lopatkami pro nafukovací čluny.
  tldr: Sada pumpy a pádla Aquafarer poskytuje nezbytné příslušenství pro vaše nafukovací plavidlo. Dvoukonstrukční pumpa rychle nafukuje desky a lodě. Hliníková pádla jsou lehká, ale pevná. Cena kolem $79. Nezbytné pro každého majitele nafukovacího SUP nebo lodi.
  problem: Dutí SUP nebo lodě jednočlánkovou pumpou trvá věčnost a mnoho levných pump má nepřesné tlakoměry, které vedou k nedostatečnému nafouknutí.
  explanation: Dvoukomorové čerpadlo používá při zdvihu dolů oba válce pro vysoký objem při počátečním nafukování a přepíná na jeden vysokotlaký válec pro konečné nafouknutí na 15-18 PSI. Integrovaný tlakový manometr umožňuje přesné sledování nafukování. Pádla mají zesílené listy a nastavitelné objímky.
  solution: Použijte režim vysokého objemu pro počáteční nafouknutí (obě komory) a přepněte na režim jedné komory pro závěrečné vysokotlaké nafouknutí. Pádlá se sestavují během několika sekund a rozebírají pro uložení.
  recommendation: Nezbytný doplněk pro každého majitele desky a lodi Aquafarer. Pumpa výrazně snižuje čas nafukování ve srovnání s levnými jednokomorovými pumpami.
  faq:
    - q: O kolik je dvoukomorové čerpadlo rychlejší?
      a: Asi dvakrát rychlejší než jednoprostorové čerpadlo. SUP se nafoukne za 2-3 minuty oproti 5-8 minutám.
    - q: Je manometr přesný?
      a: Ano, měřidlo je kalibrováno a ukazuje přesně v rámci 1 PSI v typickém rozsahu provozu.
    - q: Lze pádla použít se sérií AirDeck?
      a: Ano, pádla zahrnují nastavitelné páky pádla kompatibilní s loděmi řad AirDeck a RIB.
    - q: Z jakého materiálu jsou vesla vyrobena?
      a: Hřídele z hliníku letecké kvality s výztužnými lopatkami z polypropylenu. Váží přibližně 1,5 kg na pár.
