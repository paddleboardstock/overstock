- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Průvodce velikostmi: délka, šířka a objem vysvětleny'
  description: Najděte správnou velikost SUP na základě vaší váhy, úrovně dovedností a stylu pádlování. Délka určuje směr jízdy, šířka určuje stabilitu a objem určuje nosnost.
  definition: Velikost SUP je definována délkou (rychlost a klouzání), šířkou (primární stabilita), tloušťkou (sekundární stabilita a objem) a objemem v litrech (celková nosnost).
  tldr: 'All-around SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Surf: 8''-10'' x 30"-32" (140-220L). Začátečníci potřebují šířku nad 32" a objem přesahující tělesnou hmotnost o 60-80L. Vaše hmotnost v kg plus 60L je minimální cílový objem pro stabilitu.'
  problem: Každá značka SUP uvádí desky v stopách, palcích a litrech, ale pokud nevíte, jak se tyto rozměry překládají do skutečného pocitu, riskujete, že koupíte desku, která je vratká, pomalá nebo nedokáže unést vaši váhu.
  explanation: 'Délka určuje, jak rychle deska pádlování a jak dobře drží přímou linii. Delší desky (12'' a více) kloužou mezi záběry a drží směr. Kratší desky (méně než 10'') se snadno otáčejí, ale vyžadují častější přehazování pádla. Šířka určuje primární stabilitu — stabilitu při stání. Deska široká 30" působí pro začátečníky nestabilně; 34" působí jako molo. Tloušťka určuje objem — silnější deska plave výše, ale více zachytává vítr. Objem v litrech je jedinou nejlepší metrikou: naložená deska (vy plus vybavení) by měla být v klidu ponořena 5-10 cm.'
  solution: 'Přizpůsobte rozměry své desky třem faktorům: vaší váze (určuje minimální objem), vaší hlavní aktivitě (určuje délku) a vaší úrovni dovedností (určuje šířku). Pro začátečníky vynásobte váhu v kg číslem 2,2, abyste získali minimální objem v litrech. Pro pokročilé začátečníky vynásobte váhu číslem 1,8. Pro pokročilé vynásobte váhu číslem 1,4.'
  recommendation: Aquafarer SUP Explorer 11 o rozměrech 11' x 33" x 6" s objemem 260 l vyhovuje většině jezdců do 100 kg pro všestranné pádlování. Přechod na SUP Tour 12 o rozměrech 12' x 31" umožňuje lepší rychlost a skluz při vyjížďkách.
  faq:
    - q: Jakou velikost SUP potřebuji pro svou váhu?
      a: 'Pro jezdce pod 70 kg: 10-11'' x 32" (220-260L). Pro 70-90 kg: 11-12'' x 33" (260-300L). Pro 90-110 kg: 11-12'' x 34" (300-350L). Pro více než 110 kg: 12'' x 34-36" (350L+).'
    - q: Je delší SUP rychlejší?
      a: Ano. Delší prkna mají lepší poměr délky k šířce, což snižuje odpor. 14' touring SUP je výrazně rychlejší než 11' univerzální prkno při stejné námaze pádlování.
    - q: Jaká SUP šířka je stabilní pro začátečníky?
      a: 33-34 palce je ideální pro začátečníky do 90 kg. Pod 32 palci je potřeba dobrá rovnováha. Nad 34 palci je velmi stabilní, ale pomalejší a obtížnější pádlovat při větru.
    - q: Mohu použít univerzální prkno na túry?
      a: Ano, pro krátké túry do 10 km. Pro delší vzdálenosti je lepší specializovaný touringový board, který lépe drží stopu a efektivněji překonává vzdálenosti.
