- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hydratace a ochrana před sluncem: Zůstaňte v bezpečí na vodě'
  description: Základní strategie hydratace a ochrany proti slunci pro SUP kajakáře. Dehydratace a spálení od slunce jsou nejčastější SUP problémy — jak předejít oběma během dlouhých sezení.
  definition: SUP hydratace znamená udržování rovnováhy tekutin během pádlování pravidelným příjmem vody. Ochrana před sluncem zahrnuje aplikaci SPF, ochranné oblečení a časování tréninků tak, aby se předešlo nejintenzivnějšímu UV.
  tldr: Pijte 500 ml vody za každou hodinu pádlování. Přineste více, než si myslíte, že budete potřebovat — 2l vak nebo více lahví. Před pádlováním naneste voděodolný opalovací krém SPF 50+ a každé 2 hodiny ho znovu aplikujte. Noste klobouk, sluneční brýle s páskem a oblečení s UPF. Vyhněte se pádlování mezi 11:00 a 15:00, kdy je UV nejsilnější.
  problem: Máte skvělou SUP seanci, ale po hodině máte bolest hlavy, suchou ústa a kůže vás pálí. Dehydratace a spálení sluncem se na vás vplíží, protože voda vás udržuje v chladu.
  explanation: Odraz od vody zvyšuje expozici UV až o 40 %. Chladivý účinek vody a vánku maskuje spálení sluncem, dokud není příliš pozdě. Pocení při pádlování zvyšuje ztrátu tekutin a často není k dispozici žádné místo, kde doplnit vodu na vodě. Dehydratace zhoršuje rovnováhu a schopnost rozhodování, což zvyšuje riziko nehod.
  solution: Připevněte láhev s vodou nebo hydratační vak k systému gumových pásků na desce. Pijte každých 15 minut, ať už máte žízeň, nebo ne. Naneste opalovací krém s SPF 50+ 30 minut před startem. Noste klobouk s širokou krempou, polarizační sluneční brýle se stahovacím páskem a rash guard s UPF 50+. Opalovací krém nanášejte každé 2 hodiny znovu.
  recommendation: Použijte hydratační vak připevněný k předním D-kroužkům vašeho Aquafarer SUP. Pod PFD noste ochranný oblek proti slunci UPF 50+. Použijte voděodolný opalovací krém, který vydrží při pocení a ve vodě.
  faq:
    - q: Kolik vody bych měl vzít na SUP výlet?
      a: Minimálně 1 litr za hodinu. Na 2hodinovou akci si vezměte 2 litry. Více při horkém počasí. Nejlépe funguje vak na vodu.
    - q: Jaký typ opalovacího krému je nejlepší pro SUP?
      a: Voděodolný, SPF 50+ široké spektrum. Minerální opalovací krémy (oxid zinečnatý, oxid titaničitý) jsou bezpečné pro korály a vydrží déle.
    - q: Opravdu se voda odráží UV?
      a: Ano — voda odráží až 40 % UV záření, což znamená, že dostáváte UV zhora i zdola. To významně zvyšuje riziko spálení.
    - q: Mohu se spálit na slunci přes rash guard?
      a: Standardní rash guardy poskytují minimální ochranu UV (asi UPF 10-20). Hledejte oblečení s hodnocením UPF 50+ pro úplnou ochranu.
