  solution: Nafoukněte na 18 PSI. Použijte střední ploutev pro klidnou vodu nebo přidejte boční ploutve pro stabilitu při bočním větru. Nos s vytlačením a délka 12' vynikají na otevřené vodě s vlnobitím.
  recommendation: Na $699, je SUP Tour 12 nejlepší cenově dostupná nafukovací turistická deska. Kupte ji, pokud pravidelně urazíte vzdálenosti. Spojte ji s Aquafarer karbonovou pádlem pro nejefektivnější sestavu.
  faq:
    - q: Je SUP Tour 12 dostatečně stabilní pro pokročilé začátečníky?
      a: Ano — šířka 31" je standardní pro touring. Začátečníci mohou považovat 31" za méně stabilní ve srovnání s všestrannými prkny o šířce 33–34".
    - q: Jak si Tour 12 poradí s vlnkami?
      a: Velmi dobře — nos s vytlačovacím tvarem prořízne malé až střední vlnky bez plácání charakteristického pro kýlovou trupu na vodorovný skluz.
    - q: Mohu použít Tour 12 na surfování?
      a: Nedoporučuje se — délka 12' a vystouplá špička způsobují pomalé otáčení. Pro jízdu na vlnách použijte SUP Explorer 11.
    - q: Jaká délka pádla funguje nejlépe?
      a: 8-10 palců nad hlavou. Delší pádlo poskytuje páku pro pádlování na dlouhé vzdálenosti.
