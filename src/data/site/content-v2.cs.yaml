- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Průvodce velikostí paddleboardu: objem, délka a šířka pro každého jezdce'
  description: Kompletní velikosti paddle boardů s doporučením objemu podle hmotnosti a aktivity. Zahrnuje snadno použitelnou velikostní tabulku pro univerzální, turistické, surfové a jógové SUP boardy.
  definition: Velikost paddle boardu je určena objemem (nosnost a plovatelnost), délkou (rychlost a směr), šířkou (stabilita) a tloušťkou (rozložení objemu a odolnost proti větru).
  tldr: 'Použijte hmotnost k určení minimálního objemu: 50-70 kg potřebuje 220-260 l, 70-90 kg potřebuje 260-300 l, 90-110 kg potřebuje 300-350 l, 110+ kg potřebuje 350+ l. Pro začátečníky přidejte k těmto číslům 20 %. Šířka je důležitá: 32" je pro středně pokročilé, 33-34" je vhodná pro začátečníky, 35"+ je velmi stabilní.'
  problem: Velikosti paddle boardů jsou uváděny v stopách, palcích a litrech zaměnitelně, což ztěžuje srovnávání mezi značkami.
  explanation: Objem je nejpřímější metrika pro nosnost — 1 litr sladké vody vytlačí 1 kg hmotnosti. Deska s objemem 260 loretoreticky unese 260 kg, ale praktická kapacita je nižší, protože deska musí ležet nad vodou. Vaše celková hmotnost (tělo plus vybavení) by měla být 30-40 % objemu desky.
  solution: Cílový objem = (hmotnost těla v kg + hmotnost vybavení v kg) x 3. Pro pádlování vážící 75 kg s 5 kg vybavením je cílová hodnota = 80 x 3 = min. 240 l. Pro začátečníky vynásobte 3,5. Pro pokročilé vynásobte 2,5.
  recommendation: Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") vyhovuje většině jezdců s hmotností 50-100 kg. Lehkější jezdci mohou zvolit velikost AirDeck 270. Těžší jezdci by měli zvážit SUP Tour 12 (300L+) nebo širší prkna.
  faq:
    - q: Záleží na výšce při velikosti SUP?
      a: Výška je méně důležitá než váha. Vysoký lehký jezdec potřebuje menší objem než nízký těžký jezdec. Používejte váhu jako hlavní ukazatel objemu.
    - q: Co se stane při příliš vysoké hlasitosti?
      a: Prkno sedí příliš vysoko, chytá vítr jako plachta. V drcích působí korkově. Pro začátečníky je však lepší mít více objemu než příliš málo.
    - q: Co se stane při příliš nízkém objemu?
      a: Prkno sedí příliš hluboko, což způsobuje odpor. Při pádlování se může potápět nos (pearling). Rychle se unavíte pádlováním částečně ponořeného prkna.
    - q: Potřebují nafukovací prkna jinou velikost než tvrdá prkna?
      a: Nepříliš výrazně. Nafukovací zařízení při 15+ PSI vytlačují vodu podobně jako tvrdé desky. Doporučení ohledně objemu platí stejně pro oba typy.
