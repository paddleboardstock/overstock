- slug: aquafarer-wetsuit-pro
  category: product
  type: product
  title: Aquafarer Wetsuit Pro (Prémiové teplo bez prémiové ceny)
  description: Potápěčský oblek do studené vody s tepelně podšívaným vápencovým neoprenem, švy GBS a vstupem přes zip na hrudi. K dispozici v tloušťkách 3/2 mm a 5/4/3 mm — prémiové vlastnosti za střední cenovou kategorii.
  definition: Aquafarer Wetsuit Pro je neoprenový oblek z vápencového neoprenu s tepelnou podšívkou, švy GBS a vstupem přes zip na hrudi. K dispozici ve verzi 3/2 mm (14-20°C) a 5/4/3 mm (8-16°C).
  tldr: Aquafarer Wetsuit Pro používá termálně podložený vápencový neopren s GBS švy pro teplo a flexibilitu. K dispozici ve verzích 3/2mm a 5/4/3mm, pokrývá teploty vody od 8°C do 20°C. Design s zipem na hrudi minimalizuje průnik vody a lepené a slepě šité švy zabraňují pronikání vody, aniž by omezovaly pružnost.
  problem: Potápěčské obleky do studené vody jsou buď příliš omezující, příliš drahé, nebo propouštějí studenou vodu po zádech. Chcete oblek, který vás udrží v teple během devadesátiminutové zimní lekce, aniž by při pádlování působil jako škrtící pás.
  explanation: Většina středně drahých neoprenů používá na bázi ropy vyráběný neopren, který je tuhý a při studené vodě ztrácí flexibilitu. Aquafarer Wetsuit Pro používá neopren na bázi vápence, který je přirozeně pružnější a má lepší izolační vlastnosti. Tepelná podšívka (mikroflís na vnitřní straně trupu) přidává teplo bez další tloušťky. Švy GBS (lepené a slepě prošité) jsou zlatým standardem — neopren je slepen a poté prošit bez propíchnutí dovnitř, což zabraňuje pronikání vody. Vstup na zip na hrudi využívá voděodolný zip YKK s těsnícím těsněním. Ochranné vložky na kolena a odolná vnější vrstva chrání před opotřebením při pádlování a sezení na deskách.
  solution: Vyberte si tloušťku podle teploty vody pomocí průvodce tloušťkou neoprenu. 3/2 mm pokrývá 14-20 °C s maximální flexibilitou. 5/4/3 mm pokrývá 8-16 °C s termo podšívkou pro extra teplo. Oba obsahují těsné manžety, límec bez kapání a kapsu na klíče.
  recommendation: Potápěčský neopren 5/4/3mm Aquafarer Wetsuit Pro v $329 je nejlepší hodnotou pro studenou vodu na trhu — porovnejte s $450+ od prémiových značek. 3/2mm v $279 pokrývá mírné podmínky. Přidejte Aquafarer boty a rukavice pro plnou ochranu ve studené vodě.
  faq:
    - q: Jak teplý je Aquafarer Wetsuit Pro?
      a: 5/4/3mm s tepelnou podšívkou udržuje pohodlí ve vodě o teplotě 8-14°C při sezeních až 90 minut. 3/2mm je pohodlná při 14-20°C. Přidání termálního rash guardu posune dolní hranici asi o 3°C.
    - q: Vypouští neopren voda?
      a: Design s horním zipem a švy GBS výrazně snižují proplachování. Obojek u krku používá hladký neoprenový límec s dvojitým lepeným uzávěrem. Nějaké proplachování je při wipeoutech nevyhnutelné, ale oblek se rychle vyprazdňuje.
    - q: Jak odolný je oblek?
      a: Vnější neopren má nylonové tkané zesílení na místech s vysokým opotřebením (kolena, sedák, ramena). Při správném opláchnutí a zavěšení k uschnutí očekávejte 2–3 sezóny pravidelného používání před tím, než dojde k znatelnému opotřebení.
    - q: Jaké velikosti jsou k dispozici?
      a: Aquafarer Wetsuit Pro je k dispozici ve velikostech od XS do XXL, včetně krátkých a vysokých variant. Použijte velikostní tabulku odpovídající hrudníku, pasu a výšce. Pokud se nacházíte mezi velikostmi, zvolte větší velikost pro vrstvení.
