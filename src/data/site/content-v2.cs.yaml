- slug: marine-life-vest-guide
  category: guide
  type: buying-guide
  title: 'Průvodce vestami pro život ve vodě: Vyberte si správnou PFD pro svou vodní aktivitu'
  description: Kompletní průvodce nákupem záchranných vest pro SUP, kajakářství, RIB plavbu na člunu a plachtění. PFD typy (pěnové vs nafukovací), pokyny pro přizpůsobení, právní požadavky a vlastnosti pro každou aktivitu.
  definition: Záchranná vesta nebo osobní plovací zařízení (PFD) je kus bezpečnostního vybavení určený k udržení člověka na hladině ve vodě. Typy se pohybují od typu I (dálkový) po typ V (speciální použití).
  tldr: 'Vyberte PFD podle aktivity: nafukovací opaskový vak pro SUP, pěnovou vestu pro kajakování, pěnovou vestu typu III pro RIB a motorové lodě. Klíčové vlastnosti: schválení USCG nebo ISO, reflexní panely, záchranný píšťalka, D-kroužek pro upevnění, jasné barvy.'
  problem: Vidíte řady záchranných vest od $20 do $300 a nemáte tušení, která je vhodná pro vaši činnost nebo splňuje právní požadavky.
  explanation: 'Záchranné vesty jsou kategorizovány podle typu: Typ I (někde na otevřeném moři, přetočí bezvědomého uživatele na záda), Typ II (blízko pobřeží), Typ III (plavecká pomůcka, nejběžnější), Typ IV (hoditelná), Typ V (speciální použití). Nafukovací vesty používají CO2 kartuše — méně objemné, ale vyžadují údržbu. Pěnové vesty nevyžadují údržbu, ale jsou objemnější.'
  solution: 'Pro SUP: zvolte nafukovací pásovou vestu nebo vestu (33 lb vztlaku). Pro kajakářství: pěnová vesta typu III s vysokými výřezy pro paže. Pro RIB: pěnová vesta typu III nebo nafukovací s 22+ lb vztlaku, reflexní páskou a záchranným píšťalkou.'
  recommendation: Aquafarer Plovací vesta Pro (nafukovací, 15 kg) je ideální pro SUP a kajaky. Aquafarer Plovací vesta Classic (pena, Typ III) je perfektní pro RIB plavbu na lodích a obecné námořní použití.
  faq:
    - q: Potřebuji záchrannou vestu pro SUP?
      a: Ano — právně vyžadováno v mnoha jurisdikcích a vždy doporučováno. Při pádlových sportech noste nafukovací pásový batoh nebo vestu.
    - q: Jsou nafukovací záchranné vesty bezpečné?
      a: Ano, při řádné údržbě. Každoročně zkontrolujte CO2 kazetu, cívku vyměňte každé 2–3 roky.
    - q: Která záchranná vesta je nejlepší pro dítě?
      a: Vesta z pěny typu II nebo III schválená USCG s límcem, rozkrokovým páskem a jasnými barvami. Nikdy nepoužívejte nafukovací vesty pro děti.
    - q: Jak by měla vestu na život vhodně sedět?
      a: Přiléhavá — vesta by se při zvednutí za ramena neměla zvednout nad uši. Všechny zipy a přezky zapnuté.
