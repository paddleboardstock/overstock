  title: 'Průvodce nákupem záchranné vesty: typy, velikosti a vysvětlení funkcí'
  description: Kompletní průvodce nákupem záchranných vest pro vodní sporty. PFD typy (od I do V), nafukovací vs. pěnové, testování vhodnosti a konkrétní doporučení pro SUP, kajakářství, plavbu lodí a rybaření.
  definition: Záchranná vesta nebo PFD je plovoucí zařízení navržené tak, aby udrželo hlavu osoby nad vodou. Typy jsou regulovány Pobřežní stráží USA podle vztlaku a zamýšleného použití.
  tldr: 'Pět PFD typů: Typ I (pobřežní, 22+ lb), Typ II (blízko pobřeží), Typ III (plovací pomoc, nejběžnější), Typ IV (házecí), Typ V (speciální použití). Nafukovací vesty nabízejí pohodlí, ale vyžadují údržbu CO2 kazety. Pěnové vesty jsou bezúdržbové, ale objemnější.'
  problem: Záchranné vesty jsou kategorizovány podle typů a výtlaku, ale obchody ne vždy vysvětlují, který typ vyhovuje vaší aktivitě.
  explanation: Typ I poskytuje největší vztlak a otočí bezvědomého nositele na záda. Typ II nemusí otočit všechny nositele na záda. Typ III umožňuje volnost pohybu při aktivních sportech. Typ V zahrnuje nafukovací pásové vaky pro SUP. Nafukovací PFDs poskytují vztlak 33-37 lb a jsou kompaktní, když jsou vyfouklé.
  solution: 'Pro SUP: Nafukovací opaskový vak typu V. Pro kajak: Pěna typu III s vysokými výřezy pro paže. Pro RIB plavbu: Pěna typu III nebo nafukovací s nosností 22+ lb. Pro děti: Pěna typu II nebo III s krokovým popruhem.'
  recommendation: Aquafarer Plovací vesta Pro (nafukovací typ V, 33 lb) pro SUP a kajak. Aquafarer Plovací vesta Classic (pěnová typ III, 16,5 lb) pro RIB plavbu a obecné námořní použití.
  faq:
    - q: Jaký typ PFD potřebuji pro SUP?
      a: Mnoho jurisdikcí akceptuje typ III nebo typ V pro SUP. Nafukovací pásové balíčky jsou populární. Zkontrolujte místní zákony.
    - q: Potřebují nafukovací PFDs údržbu?
      a: Ano — kontrolujte kartuši CO2 každý rok, návin vyměňte každé 2-3 roky, po použití v slané vodě opláchněte.
    - q: Mohu nosit pěnový PFD pro SUP?
      a: Ano, ale vyber jeden s vysokými vykrojenými rukávy. Pěnové vesty jsou objemnější, ale nevyžadují údržbu.
    - q: Jaký PFD je nejlepší pro dítě?
      a: USCG-schválená vesta z pěny typu II nebo III s límcem, krokovým páskem a jasnými barvami. Nikdy nepoužívejte nafukovací PFDs pro děti.
