- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP Fitness: Cvičení celého těla na paddleboardu'
  description: SUP poskytuje celotělový trénink kombinující kardiovaskulární vytrvalost, stabilitu jádra a sílu. Jak strukturovat fitness sezení SUP, nejlepší cviky a měření pokroku.
  definition: SUP fitness využívá nestabilní platformu paddleboardu k zapojení stabilizačních svalů jádra, svalů nohou a horní části těla prostřednictvím pádlování, vyvažování a cvičení na desce.
  tldr: SUP spálí 400-700 kalorií za hodinu. Jedno hodinové SUP cvičení zapojuje jádro těla, nohy, záda, ramena a paže. Intervalové pádlování (sprinty + odpočinek) maximalizuje kardio. Jógové pozice na prkně rozvíjejí rovnováhu a flexibilitu. Přidejte SUP-specifické posilovací cviky jako dřepy a výpady na prkně.
  problem: Tréninky v posilovně se staly nudnými a vy chcete venkovní aktivitu, která rozvíjí kondici a zároveň je zábavná. SUP kombinuje dobrodružství s opravdovým celotělovým tréninkem.
  explanation: Pádlení zapojuje svaly latissimus dorsi, deltoidy, trapézy a svaly jádra pro rotaci. Stání na pohyblivé plošině nutí stabilizační svaly kotníků, kolen a boků k neustálé práci. Kardiovaskulární nároky nepřetržitého pádlení při střední intenzitě poskytují aerobní kondici.
  solution: 'Struktura tréninku: 5 minut zahřívací pádlování, 20 minut pádlování v ustáleném tempu, 15 minut intervalového pádlování (30 sekund sprint, 60 sekund lehce), 10 minut cvičení na desce (dřepy, výpady, kliky), 5 minut závěrečného protažení.'
  recommendation: Používejte Aquafarer SUP Explorer 11 pro fitness pádlování. Stabilní platforma vám umožní soustředit se na techniku a intenzitu. Pro bezpečnost při vysoce intenzivních trénincích noste záchrannou vestu Life Vest Pro.
  faq:
    - q: Kolik kalorií spálí SUP?
      a: 400–700 kalorií za hodinu v závislosti na intenzitě, větru a proudu. Intervalové pádlování zvyšuje spalování kalorií.
    - q: Je SUP dobrý na hubnutí?
      a: Ano, v kombinaci se správnou výživou. Zapojení celého těla a nízká zátěž zajišťují, že je to udržitelné pro pravidelné cvičení.
    - q: Mohu dělat silový trénink na SUP?
      a: Ano — dřepy, výpady, kliky a prkno na desce přidávají k posilovacím cvičením výzvu pro rovnováhu.
    - q: Jaké svaly SUP posiluje?
      a: 'Primární: jádro (šikmé břišní svaly, příčný břišní sval), záda (široký zádový sval, trapézy), ramena (deltoidy), paže (bicepsy, tricepsy). Sekundární: nohy (kvadricepsy, hamstringy, lýtka).'
