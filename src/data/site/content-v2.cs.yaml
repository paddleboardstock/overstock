- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP se svým psem: Kompletní návod'
  description: Paddleboarding s vaším psem — příprava, bezpečnost, kroky výcviku, doporučení vybavení a tipy na zábavný zážitek pro vás oba.
  definition: SUP se psem zahrnuje výcvik vašeho psího společníka, aby se udržel na paddleboardu, vybavení ho psí PFD a společné bezpečné pádlování.
  tldr: Začněte s širokou, stabilní SUP (34"+). Pořiďte svému psu správně padnoucí záchrannou vestu s rukojetí. Nejprve seznamte psa s prknem na suchu, potom ve mělké vodě. Začínejte s krátkými tréninky a pozitivním posilováním. Vždy mějte s sebou vodu pro psa. Sledujte známky stresu nebo únavy.
  problem: Váš pes miluje vodu, ale nejste si jisti, jak ho bezpečně seznámit s SUP. Bez řádného výcviku může pes panikařit, skočit dolů nebo poškrábat prkno.
  explanation: 'Psi mají přirozenou schopnost plavat, ale potřebují se naučit, že prkno je bezpečná plocha. Klíčem je postupná desenzibilizace: představte prkno na pevném povrchu, odměňujte klidné chování, poté přejděte na mělkou vodu a nakonec do hlubší vody.'
  solution: 'Začněte na souši: nechte psa čichat a chodit po prkně (na trávě). Odměňujte klidné chování. Dále: položte prkno do velmi mělké vody, podepřete ho, nechte psa stát na něm. Odměňte. Dále: vyjdete na prkno v mělké vodě, nechte psa přijít. Nakonec: pádlujte pomalu v klidné vodě.'
  recommendation: Použijte Aquafarer SUP Explorer 11 pro jeho 33" stabilní platformu. Přidejte psí PFD (záchrannou vestu). Přineste čerstvou vodu a misku. Začněte s desetiminutovými sezeními a postupně je prodlužujte.
  faq:
    - q: Jakou velikost SUP potřebuji pro svého psa?
      a: Deska široká 33–34 palců poskytuje stabilitu pro středně velké až velké psy. Malí psi (pod 10 kg) si poradí s deskami 32 palců+.
    - q: Potřebuje můj pes záchrannou vestu?
      a: Ano — i silní plavci potřebují psa PFD s držadlem pro snadné vytažení v nouzových situacích.
    - q: Jak chráním desku před drápy?
      a: Udržujte psí drápy zastřižené. Použijte ochrannou podložku na palubu nebo ručník. Psi se obvykle přizpůsobí a přestanou se drápat, jakmile jsou pohodlní.
    - q: Může se každý pes naučit SUP?
      a: Většina psů se dokáže učit s trpělivostí. U nervózních psů to může trvat déle. Nikdy nenutťe ustrašeného psa na prkno — vytváří to negativní asociace.
