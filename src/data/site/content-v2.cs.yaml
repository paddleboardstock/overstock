- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: 3mm vs 5mm neoprenový oblek (co skutečně funguje při surfování v studené vodě)
  description: Rozhodnutí mezi 3mm a 5mm neoprenem závisí na teplotě vody, nikoli na teplotě vzduchu. Teplotní tabulka, srovnání pružnosti a která tloušťka vás udrží v teple, aniž by omezovala vaše pádlování.
  definition: 3mm neoprenový oblek je vhodný do vody o teplotě 14-20°C a poskytuje dobrou flexibilitu. 5mm oblek pokrývá 8-14°C s maximálním teplem, ale s omezenou pohyblivostí. Volba je přímým kompromisem mezi teplem a rozsahem pohybu.
  tldr: 3mm neopreny jsou určené do vody o teplotě 14-20°C a nabízejí maximální flexibilitu. 5mm neopreny jsou vhodné do vody o teplotě 8-14°C a kladou důraz na teplo. Vyberte si podle místní teploty vody, nikoli podle teploty vzduchu. Pokud surfujete v různých sezónách, mějte oba. Pokud si můžete koupit jen jeden, 4/3mm nabízí nejlepší kompromis.
  problem: Potřebujete neopren, ale nemůžete se rozhodnout mezi 3mm a 5mm. 3mm možná nebude v zimě dostatečně teplý a 5mm může být příliš tlustý a omezující na teplejší dny. Špatná volba znamená buď mrznout v zimě, nebo se potit na podzim.
  explanation: 'Tloušťka neoprenu přímo souvisí s teplem a nepřímo s pružností. Kombinéza 3 mm (často 3/2 mm s tenčími rukávy) poskytuje dobrou pohyblivost pro pádlování a surfování v mírných podmínkách. Kombinéza 5 mm používá silnější neopren na trupu a často tenčí panely na pažích a nohách (5/4/3 mm), aby se zachovala určitá pružnost. Rozdíl v teple je přibližně v rozmezí 6–8 °C. Klíčové rozdíly: kombinézy 5 mm používají více neoprenového materiálu, váží přibližně o 40 procent více, schnou déle a jejich sundání vyžaduje více úsilí. Moderní super-strečové neopreny snižují rozdíl v pružnosti, ale 5 mm stále znatelně omezuje pohyb.'
  solution: Určete svou nejchladnější průměrnou měsíční teplotu vody pomocí místních dat z bójí. Pokud je nad 16 °C, kupte si 3/2mm. Pokud je mezi 12–16 °C, kupte si 4/3mm. Pokud je pod 12 °C, kupte si 5/4/3mm. Pro celoroční surfování s jedním oblekem pokryje kvalitní 4/3mm s termo vložkou plus samostatná kapuce, boty a rukavice nejširší rozsah.
  recommendation: Aquafarer Wetsuit Pro v provedení 5/4/3mm zvládá 8-16°C díky tepelnému podšívce, která kompenzuje rozdíl v teple oproti skutečnému 5mm. Pokud surfujete převážně za mírných podmínek (16-20°C), 3/2mm Aquafarer Wetsuit Pro nabízí lepší pružnost a pohodlí.
  faq:
    - q: Mohu nosit 3mm v 10°C vodě?
      a: Pouze na velmi krátké sezení (20-30 minut) a s termálním ochranným tričkem pod ním. Během většiny sezení vám bude zima. Pro vodu o teplotě 10 °C se důrazně doporučuje 5mm nebo 5/4/3mm.
    - q: Je 5mm neopren příliš teplý na léto?
      a: Pokud teplota vody v létě překročí 18 °C, způsobí 5mm oblek přehřátí. Oblek můžete propláchnout studenou vodou, ale během letních měsíců se budete cítit pohodlněji v obleku 3/2mm nebo jarním obleku.
    - q: Omezí 5mm neoprenové oblečení pádlování?
      a: Ano, znatelně. Silnější neopren na ramenou vyžaduje při každém záběru více úsilí. Kombinéza 5/4/3 mm s tenčími rukávy pomáhá, ale i tak se unavíte rychleji než v 3mm kombinéze.
    - q: Jaký je nejlepší neoprenový oblek pro celoroční surfování?
      a: Plný oblek 4/3 mm s předním zipem a tepelnou podšívkou pokrývá teploty 12-18°C, což je po celý rok v mnoha mírných klimatických podmínkách. Přidejte boty na zimu a můžete surfovat při 10-18°C s jedním oblekem.
