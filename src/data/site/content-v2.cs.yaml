- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard vs Shortboard (Upřímná odpověď, kterou vám nikdo nedá)
  description: Longboardy chytají více vln; shortboardy zatáčejí ostřeji. Skutečná otázka je, který z nich odpovídá vašim dovednostem a místním vlnám. Upřímné srovnání pokrývající stabilitu, počet vln a past na pokrok.
  definition: Longboardy (9 stop +) upřednostňují stabilitu a snadné chytání vln; shortboardy (5–7 stop) upřednostňují manévrovatelnost a výkon na strmých vlnách. Správná volba závisí na vaší úrovni dovedností a typech místních vln.
  tldr: Longboardy (9 stop +) jsou stabilní, snadno chytají vlny a hodí se pro začátečníky a surfaře zaměřené na pohodovou jízdu. Shortboardy (5-7 stop) jsou citlivé, rychlejší na ploše vlny a hodí se pro pokročilé surfaře. Správná volba závisí na vaší úrovni dovedností, typu vlny a na tom, co na surfování nejvíce baví vás.
  problem: Vidíte videa surfařů, kteří na krátkých prknech dělají ostré zatáčky, a longboardisty, kteří se elegantně kloužou po špičce — oba vypadají zábavně. Máte rozpočet jen na jeden typ prkna a potřebujete vědět, který styl odpovídá vašim cílům a místním vlnám.
  explanation: 'Longboardy mají větší plochu, což znamená, že pádlování je rychlejší, umožňují chytit vlnu dříve a poskytují stabilní platformu pro chůzi a přechody. Vynikají v malých, pomalých vlnách, kde by shortboard klesl. Shortboardy mají menší objem a agresivnější rocker, což jim umožňuje pronikat hlouběji do stěny vlny, generovat rychlost při zatáčkách a vejít se do strmých, dutých úseků. Shortboardy vyžadují silné pádlování a přesné načasování vlny. Běžný omyl: shortboardy nejsou „lepší“ — jsou prostě odlišnými nástroji pro různé podmínky a úrovně dovedností.'
  solution: Pokud jste začátečník, jeďte na longboardu (nebo na nafukovacím prkně s velkým objemem) alespoň 6 měsíců. Pokud jste pokročilý a vaše místní vlny jsou často malé a pomalé, longboard nebo hybrid chytí více vln a bude více zábavný. Pokud jsou vaše vlny strmé, duté a rychlé, stává se nezbytným krátkýboard, aby se vešel do kapsy. Mnoho pokročilých surfařů má oba typy prken a vybírá podle toho, jaké jsou podmínky v daný den.
  recommendation: Začněte s Aquafarer Surfboard Pro jako svou platformou ve stylu longboardu. Když budete konzistentně zatáčet a získávat rychlost, zvažte přidání hybridu nebo shortboardu pro dny s prudkými vlnami. Většina surfařů, kteří se pokusí přejít na shortboard příliš brzy, končí frustrovaná a jezdí na méně vlnách.
  faq:
    - q: Je longboard snazší na jízdu než shortboard?
      a: Mnohem snazší. Longboardy chytají vlny dříve, pádlování je rychlejší a jsou stabilnější při vstávání a při jízdě. Shortboardy vyžadují přesné načasování, silnější pádlování a lepší odhad vln.
    - q: Umíš zatáčet na longboardu?
      a: Ano, i když je styl odlišný. Otočky na longboardu jsou širší, plynulejší a zapojují celé tělo. Jízda na nose, cutbacky a hang-five jsou manévry specifické pro longboard a mají vlastní postup v získávání dovedností.
    - q: Která deska je lepší pro malé vlny?
      a: Longboardy a hybridy fungují lépe v malých, slabých vlnách, protože generují skluz a udržují setrvačnost. Shortboardy potřebují strmější, silnější vlny, aby mohly podávat výkon.
    - q: Je krátký surfboard těžší na pádlování?
      a: Výrazně těžší. Nižší objem znamená, že prkno sedí v vodě níže, což vytváří větší odpor. Pádlování na krátkém prkně je jako plavat s brzdícím padákem ve srovnání s pádlováním na longboardu.
