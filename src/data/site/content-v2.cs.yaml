- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Nafukovací SUP úložiště: Správný způsob, jak skladovat váš iSUP'
  description: Správné skladování nafukovacích SUP brání delaminaci, UV poškození, plísni a únikům ventilů. Tipy pro zimní skladování, dlouhodobé skladování a každodenní skladování desek drop-stitch.
  definition: Nafukovací SUP úložiště znamená uchovávání prkna v čistém, suchém, teplotně kontrolovaném prostředí, mimo UV, extrémní teploty a fyzické poškození.
  tldr: Skladujte na chladném, tmavém místě pod 30 °C, mimo přímé sluneční světlo. Pro krátkodobé skladování (1-2 týdny) skladujte částečně nafouknuté při 8-10 PSI. Pro dlouhodobé skladování úplně vyfoukněte, volně srolujte a vložte do skladovacího vaku. Nikdy neskladujte mokré. Uchovávejte mimo dosah hlodavců a ostrých předmětů.
  problem: Vyfouknete svůj SUP a uložíte ho do horké garáže nebo vlhkého sklepa. O tři měsíce později je PVC zežloutlý, podložka paluby se loupe a ventil prosakuje. Nesprávné skladování způsobuje větší poškození než běžné používání.
  explanation: Teplo nad 50 °C způsobuje migraci PVC změkčovadel, což činí materiál tuhým a křehkým. UV záření rozkládá polymerní vazby. Zachycená vlhkost uvnitř vytváří plíseň. Mráz pod bodem mrazu způsobuje křehkost PVC. Tlaková místa z těsného skládání vytvářejí trvalé záhyby.
  solution: 'Krátkodobé uskladnění: opláchnout, vysušit, nafouknout na 10 PSI a uložit mimo zem ve stinné oblasti. Dlouhodobé uskladnění: důkladně vyčistit, úplně vysušit, zcela vyfouknout, srolovat s palubní podložkou směrem ven, umístit do vaku, uložit do chladné suché skříně. Uchovávejte mimo dosah chemikálií a škůdců.'
  recommendation: Používejte Aquafarer přepravní tašku pro skladování — blokuje UV a zabraňuje oděrkám. Skladujte v klimatizované místnosti. Do tašky vložte vysoušedlo pro vlhká prostředí.
  faq:
    - q: Mohu skladovat svůj SUP nafouknutý v garáži?
      a: Pouze pokud garáž zůstane pod 30 °C a nemá přímé slunce. Většina garáží v létě přesahuje 40 °C.
    - q: Měl bych své SUP uložit do tašky?
      a: Ano, taška chrání proti prachu, UV a fyzickému poškození. Ujistěte se, že deska je před vložením do tašky zcela suchá.
    - q: Může mráz poškodit nafukovací SUP?
      a: Ano. Pod bodem mrazu se PVC stává křehkým a může prasknout při rozvinutí nebo nafouknutí. Vždy skladujte nad 5 °C.
    - q: Jak bych měl svůj SUP rolovat pro skladování?
      a: Srolujte s batohovou podložkou směřující ven, aby byla chráněna spodní část PVC. Vyhněte se těsným záhybům. Při každém skládání měňte polohu přeložení.
