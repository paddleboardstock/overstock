- slug: how-to-choose-a-wetsuit
  category: guide
  type: buying-guide
  title: 'Jak vybrat neopren: vysvětlení velikosti, tloušťky a vlastností'
  description: Kompletní průvodce nákupem neoprenu. Jak zvolit správnou tloušťku podle teploty vody, zajistit správné padnutí, porozumět typům švů a vybrat funkce podle vaší aktivity.
  definition: 'Neoprenový oblek je oděv z neoprenu, který poskytuje tepelnou izolaci tím, že zachytává tenkou vrstvu vody u pokožky. Klíčové faktory při výběru: tloušťka, střih, konstrukce švů, systém vstupu a typ neoprenu.'
  tldr: 'Přizpůsobte tloušťku teplotě vody: 3/2 mm pro 14-20 °C, 4/3 mm pro 12-18 °C, 5/4/3 mm pro 8-14 °C, 6/5/4 mm pro teploty pod 8 °C. Nejdůležitější je padnutí. Švy GBS jsou zlatý standard. Zip na hrudi minimalizuje průnik vody. Neoprén z vápence je pružnější než na bázi ropy.'
  problem: Online tabulky velikostí neoprenů jsou nespolehlivé, doporučení ohledně tloušťky se liší podle značky a popisy vlastností jsou matoucí.
  explanation: Čísla udávající tloušťku neoprenu (3/2, 4/3, 5/4/3) se vztahují k mm na trupu/pažích a nohách. Silnější oblek je teplejší, ale omezuje pohyb. Volný oblek vyplavuje teplou vodu. Švy GBS jsou teplé a pružné; švy flatlock jsou méně teplé. Vstup na zip na hrudi je teplejší než na zádech. Neopren z vápencového kaučuku je v studené vodě flexibilnější.
  solution: Změřte hrudník, pas, boky a výšku. Porovnejte s tabulkami velikostí. Vyberte tloušťku podle nejchladnější teploty vody. Pro studenou vodu zvolte švy GBS. Preferujte zip na hrudi při teplotách pod 15 °C. Zvažte termo podšívku pro větší teplo.
  recommendation: Aquafarer Wetsuit Pro v 3/2 mm (14-20 °C) nebo 5/4/3 mm (8-16 °C) nabízí švy GBS, zapínání na hrudi a vápencový neopren za konkurenceschopnou cenu.
  faq:
    - q: Jak těsně by měl být neoprenový oblek?
      a: Přiléhavé bez vzduchových kapes, ale neomezující. Prst by neměl snadno klouzat po spodní části zad.
    - q: Jaký je nejteplejší typ neoprenu?
      a: Kapucňový oblek 6/5/4 mm s těsněnými švy a zipem na hrudi. Pro extrémní chlad je lepší suchý oblek.
    - q: Stojí dražší neopren za to?
      a: Vyšší cena znamená lepší neopren, švy a funkce. Pro běžné používání ve studené vodě stojí příplatek za to.
    - q: Mohu nosit neoprenový oblek i na jiné aktivity než surfování?
      a: Ano — neopreny fungují pro SUP, kajak, potápění, triatlon a plavání na otevřené vodě.
