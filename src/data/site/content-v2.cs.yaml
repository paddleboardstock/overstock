- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Péče o neopren: Udržte svůj neopren dvakrát déle'
  description: Správná péče o neoprenový oblek prodlužuje jeho životnost z 1 sezóny na 3+. Tipy na oplachování, sušení, skladování a opravu neoprenových obleků. Vyhněte se běžným chybám, které předčasně ničí oblek.
  definition: Péče o neopren zahrnuje oplachování sladkou vodou po každém použití, sušení mimo přímé slunce, skladování na rovném povrchu nebo zavěšené na širokém ramínku a periodické čištění k odstranění soli, bakterií a zápachu.
  tldr: Opláchněte svůj neopren zevnitř i zvenčí čerstvou vodou okamžitě po každé lekci. Sušte naruby ve stínu na širokém plastovém ramínku. Skladujte ploše nebo složené na chladném, suchém místě. Nikdy nenechávejte neopreny na přímém slunci, v horkých autech ani v sušičkách. Používejte šampon na neopreny každých 5-10 lekcí.
  problem: Po jedné sezóně váš neopren zapáchá, neopren ztratil pružnost, švy se olupují a zip se zasekává — vše lze předejít správnou péčí.
  explanation: Krystaly soli se zanořují do neoprenu a odírají materiál. Bakterie se množí ve vlhkých vnitřcích, vytvářejí zápach a rozkládají neopren. UV degraduje nylonové pokrytí. Teplo nad 50 °C způsobuje delaminaci. Nesprávné sušení deformuje neopren a namáhá švy.
  solution: 'Po každé relaci: důkladně opláchněte uvnitř i zvenku, obraťte naruby, zavěste na široký plastový věšák ve stínu. Jakmile uschne, obraťte zpět lícem ven a skladujte naplocho. Každých 5-10 relací: vyperte šamponem na neopren. Měsíčně: promažte zip voskem na zip.'
  recommendation: Použijte Aquafarer šampon na neopren pro čištění a Aquafarer vosk na zip pro údržbu zipu. Skladujte na Aquafarer širokém ramínku v síťové tašce.
  faq:
    - q: Mohu dát svůj neopren do pračky?
      a: Nedoporučuje se — praní v pračce poškozuje neopren. Pokud to musíte, použijte jemný cyklus, studenou vodu a síťovaný sáček.
    - q: Jak dostanu zápach z mého neoprenového obleku?
      a: Namočte do studené vody s šamponem na neopren nebo bílým octem na 30 minut. Důkladně opláchněte.
    - q: Jak bych měl sušit svůj neopren?
      a: Naruby ve stínu na širokém, polstrovaném plastovém ramínku. Vyhněte se přímému slunečnímu záření a kovovým ramínkům.
    - q: Mohu opravit roztržený neopren?
      a: Malé trhliny pod 1" lze opravit lepidlem na neopren a záplatou. Větší trhliny mohou vyžadovat profesionální opravu.
