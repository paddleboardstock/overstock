- slug: foam-board-vs-hard-surfboard
  category: comparison
  type: buying-guide
  title: 'Pěnová deska vs tvrdá surfařská prkna: Která zastaví začátečníky, aby přestali'
  description: Rozhodnutí mezi pěnovým a tvrdým surfem může ovlivnit úspěch vašeho prvního roku surfování. Skutečné výhody a nevýhody, rozdíly v bezpečnosti a ta, se kterou by měli začátečníci začít (není to tvrdý surf).
  definition: Pěnové prkna používají měkké pěnové jádro s odolnou povrchovou vrstvou — jsou stabilní, bezpečná a ideální pro začátečníky. Tvrdá prkna používají PU nebo epoxidovou pěnu s laminátem z vláken skla — jsou tužší, rychlejší a citlivější, ale křehká.
  tldr: Pěnové prkna (včetně nafukovacích) jsou bezpečnější, stabilnější a vhodnější pro začátečníky. Tvrdá prkna nabízejí lepší výkon, ale vyžadují vyšší dovednosti a jsou náchylná k poškození. Většina surfařů by měla začít na pěnovém nebo nafukovacím prkně a po 6–12 měsících pravidelného surfování přejít na tvrdá prkna.
  problem: Máte rozpočet na jednu desku a musíte se rozhodnout mezi měkkou pěnovou deskou a tradiční tvrdou deskou z epoxidu nebo PU. Pěnové desky se zdají příliš základní, ale tvrdé desky se snadno poškodí a stojí víc. Špatná volba znamená promarněné peníze nebo desku, která zpomalí váš pokrok.
  explanation: Pěnové prkna používají jádro z pěny s vysokou hustotou (EPS nebo podobné) s měkkou vnější vrstvou. Dobře plavou, absorbují nárazy a váží méně než tvrdá prkna. Nafukovací drop-stitch prkna jsou moderní variantou se stejnými výhodami co do stability. Tvrdá prkna jsou vyrobena z polyuretanové (PU) nebo epoxidové pěny s pryskyřičnou a sklolaminátovou skořepinou. Jsou tužší, rychlejší a citlivější, ale váží více a jsou křehká. Rozdíl ve výkonnosti je důležitý, jakmile se otáčíte a nabíráte rychlost na vlně, ale je nevýznamný, dokud nedokážete spolehlivě chytat vlny.
  solution: Začněte s pěnovým nebo nafukovacím prknem a stravte alespoň 6 měsíců budováním síly při pádlování, čtení vln a konzistence při vstávání. Prodejte pěnové prkno a kupte tvrdé prkno, jakmile budete schopni konzistentně jezdit na nerušených vlnách a pocítíte omezení pružnosti a váhy pěnového prkna. Vyhněte se pokušení koupit tvrdé prkno jako první jen proto, že vypadá jako „opravdové“ surfové prkno.
  recommendation: Aquafarer Surfboard Pro (nafukovací drop-stitch) podává lepší výkon než typické pěnové prkna a zároveň zůstává vhodný pro začátečníky. Prodlouží fázi s pěnovým prknem, což znamená, že z jednoho prkna získáte více měsíců, než budete potřebovat přejít na tvrdé krátké prkno.
  faq:
    - q: Jsou pěnové desky těžší na otáčení?
      a: Ano. Pěnové prkna mají větší objem a pružnost, což způsobuje méně citlivé zatáčení. To je vlastně pro začátečníky výhodné, protože to zabraňuje přetočení a podporuje plynulé, postupné přenášení váhy.
    - q: Dají se tvrdé desky snadno promáčknout?
      a: Ano. Tvrdá epoxidová nebo PU deska se může poškodit při menší srážce, upuštěném vodítku nebo dokonce při položení na tvrdý povrch. Pěnové a nafukovací desky jsou v porovnání téměř nezničitelné.
    - q: Mohu se naučit surfovat na tvrdém prkně?
      a: Můžete, ale je to těžší a rizikovější. Tvrdé prkna jsou kluzčí, méně stabilní a při nárazu způsobují více zranění. Většina surfařských škol používá pěnová nebo nafukovací prkna z dobrého důvodu.
    - q: Jak dlouho vydrží pěnová deska?
      a: Kvalitní pěnová deska vydrží při běžném používání 12-18 měsíců, než začne odlupovat povrch. Nafukovací desky vydrží 3-5 let, protože konstrukce drop-stitch se netlačí ani nedelaminuje tak, jako to dělají pěnové povrchy.
