- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Oprava neoprénu: Opravte roztržení, švy a zipy sami'
  description: Průvodce opravou neoprenových obleků kutilsky pro roztržení neoprenu, oddělení švů, zaseknuté zipy a rozdělené kolenní vložky. Krok za krokem s použitím lepidla na neopren.
  definition: Oprava neoprenového obleku zahrnuje čištění a zdrsnění poškozené oblasti, nanesení neoprénového lepidla a tvrdnutí pod tlakem za účelem obnovení vodotěsnosti a pružnosti.
  tldr: 'Malé trhliny pod 1": naneste na obě strany neoprenové lepidlo, počkejte 10–15 minut, dokud lepkavé, pevně přitlačte, nechte zatvrdnout pod zatížením 12 hodin. Větší trhliny vyžadují neoprenovou záplatu. Problémy se zipem: nejprve promažte, poté zkontrolujte, zda se tkanina nezasekla.'
  problem: Váš potápěčský oblek má malou trhlinu, rozdělující se šev nebo zasekávající se zip. Bez domácí opravy zaplatíte $150+ za náhradu, když oprava stojí $5.
  explanation: Neoprenové lepidlo funguje tak, že změkčuje povrch neoprenu a vytváří chemické spojení, když rozpouštědlo odpaří. Lepidlo musí být naneseno na oba povrchy a musí být lepivé, než se spojí. U trhlin musí být okraje přesně zarovnány. Problémy se zipem jsou často způsobeny korozí solí nebo zachycením tkaniny mezi zuby.
  solution: 'Pro trhliny: očistěte alkoholem, lehce obrousit, naneste tenkou vrstvu cementu na oba okraje, počkejte, až bude lepivý, pevně je přitiskněte k sobě, přiložte závaží, nechte vytvrdnout 12-24 hodin. Pro záplaty: vystřihněte záplatu o 1" větší než trhlina, naneste cement na oba díly, svorky. Pro zip: opláchněte, naneste vosk na zip, jemně pracujte.'
  recommendation: Mějte v tašce s vybavením Aquafarer sadu na opravu neoprenu. Pro větší opravy nebo selhání švů na kritických místech se doporučuje profesionální oprava.
  faq:
    - q: Mohu na neopren použít super lepidlo?
      a: Ne — superlepidlo tvrdne a je křehké. Pro opravy neoprenu používejte pouze neoprénové lepidlo nebo Aquaseal.
    - q: Jak dlouho vydrží oprava neoprénovým lepidlem?
      a: Správně provedená oprava je často silnější než původní neopren a vydrží po zbývající životnost obleku.
    - q: Mohu opravit zip, který se úplně rozešel?
      a: Pokud se pás oddělil od neoprenu, přilepte jej znovu kontaktním lepidlem. Pokud jsou zuby poškozené, nechte zip vyměnit odborně.
    - q: Jak opravit neoprén, který prosakuje švem?
      a: Naneste tenký proužek Aquasealu podél vnitřní strany prasklého švu a nechte vytvrdnout 24 hodin.
