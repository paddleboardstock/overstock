- slug: inflatable-sup-vs-hard-board
  category: comparison
  type: buying-guide
  title: 'Nafukovací SUP vs Pevná deska: Která je pro vás správná?'
  description: Srovnání nafukovacího a pevného SUP zahrnující přenosnost, výkon, odolnost, cenu a skladování. Skutečné rozdíly pro rekreační pádlaře, cestovatele a uživatele orientované na výkon.
  definition: Nafukovací SUP (iSUP) používá drop-stitch PVC konstrukci nafoukanou na 15–20 PSI. Pevný SUP používá konstrukci z epoxidu, sklolaminátu nebo uhlíku přes pěnové jádro.
  tldr: Nafukovací SUPs vyhrává v přenosnosti (vejde se do batohu), odolnosti (skáče místo aby se pořezal) a úložném prostoru (vejde se do skříně). Tvrdé desky vyhrávají výkonem (tužší, rychlejší, lepší klouzání). Zvolte iSUP, pokud cestujete, máte omezený prostor pro skladování nebo jste začátečník. Zvolte tvrdou desku, pokud je pro vás prioritou výkon.
  problem: Debata mezi nafukovacími a tvrdými SUP má silné zastánce na obou stranách. Bez porozumění skutečným rozdílům si můžete vybrat desku, která nesedí vašemu životnímu stylu.
  explanation: Tvrdé desky jsou lehčí, tužší a rychlejší. Pevná konstrukce přenáší energii pádlování přímo do pohybu vpřed. Vyžadují však nosiče na střechu pro transport a opatrné zacházení. Nafukovací se vejdou do batohů, přežijí leteckou přepravu a odrážejí se od kamenů. Moderní iSUPs o tloušťce 18-20 PSI jsou pozoruhodně tuhé, ale při intenzivním pádlování se mírně ohýbají.
  solution: Zvolte nafukovací desku, pokud máte nedostatek úložného prostoru, cestujete se svou deskou, jste začátečník nebo pádlíte v kamenitých oblastech. Zvolte tvrdou desku, pokud závodíte, podnikáte dlouhé výlety nebo upřednostňujete maximální výkon. Mnoho pádlů vlastní obojí.
  recommendation: Průzkumník Aquafarer SUP 11 je nejlepší volbou pro většinu paddlerů — nabízí 90 % výkonu pevného prkna s 10násobně větším pohodlím. Přidejte pevné prkno později, pokud vaše potřeby výkonu vzrostou.
  faq:
    - q: Jsou nafukovací SUPs stejně rychlé jako pevné desky?
      a: Tvrdé desky jsou o 5–10 % rychlejší. Pro rekreační kajakáře je rozdíl v rychlosti minimální. Pro závodníky jsou tvrdé desky nezbytné.
    - q: Funguje nafukovací SUPs dráha stejně dobře jako tvrdé desky?
      a: Srovnatelně s kvalitními ploutvemi. Širší profil většiny iSUPs vytváří mírně větší odpor, ale moderní návrhy to minimalizují.
    - q: Které se opravuje snadněji?
      a: Tvrdé desky lze opravit opravnými sadami z epoxidu. Nafukovací věci vyžadují sady na opravu PVC. Obě lze pro malé opravy opravit svépomocí.
    - q: Které je lepší na surfování?
      a: Tvrdé desky fungují lépe pro pokročilé surfování. Pro začátečníky až středně pokročilé surfování jsou vhodné nafukovací desky a jsou bezpečnější.
