- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Pravidla etikety při surfování (Jak nebýt člověk, kterému se každý vyhýbá)
  description: Fronta má pravidla a nikdo je nezapisuje. Naučte se pravidlo přednosti, proč vás křikem potrestají za „hadění se“ ve frontě, jak se omluvit a jaké začátečnické chyby rozčilují každého místního surfaře.
  definition: 'Etiketa surfování je nepsaný kodex chování, který zabraňuje kolizím a spravedlivě sdílí vlny. Základní pravidlo: surfař nejblíže k vrcholu lámající se vlny má přednost.'
  tldr: Surfař nejblíže vrcholu lámající se vlny má přednost. Nepřerušujte někoho, nesnažte se obejít někoho (přeplavat kolem něj, abyste vzali jeho vlnu) a vždy se omluvte, pokud uděláte chybu. Přeplavte široce kolem fronty, držte se své desky a buďte přátelští — respekt si zaslouží respekt.
  problem: Vydáte se na zaplněnou linii a okamžitě pocítíte napětí. Surfaři se na vás dívají z koutku oka, někdo na vás křičí a nejste si jisti, co jste udělali špatně. Sociální stránka surfování se zdá být děsivější než samotné vlny.
  explanation: 'Etiketa surfování existuje, aby se předešlo kolizím a sdílely se vlny spravedlivě. Základním pravidlem je přednost: surfař nejblíže k vrcholu vlny (kde vlna poprvé prolomí) má přednost. Každý, kdo pádlí na stejnou vlnu z vnitřnější strany, se musí stáhnout. Snaking – pádlování kolem jiného surfaře za účelem ukrást přednost – je považováno za nejhorší prohřešek. Kromě přednosti má lineup očekávání ohledně hluku (udržujte křik na minimu), kontroly prkna (nikdy nenechávejte své prkno blízko ostatních) a přátelskosti (jednoduché pokývnutí hodně znamená).'
  solution: Sledujte sestavu 10 minut, než vyrazíte na vodu. Určete, kdo chytá nejvíce vln — to jsou surfaři, kterých je třeba respektovat a vyhýbat se jim. Pokud se učíte, zůstaňte blízko u břehu (v oblasti bílé pěny). Přeplujte široce kolem sestavy, ne skrz ni. Když chytíte vlnu, rozhlédněte se na obě strany před vstáním a ujistěte se, že nikdo není hlouběji.
  recommendation: Strávte své první lekce na začátečnickém místě s rozptýlenými davy. Naučte se číst přednost, než se pustíte do rušného pořadí. Pokud někomu vrazíte do cesty, okamžitě se omluvte a dopádlujte pryč — většina surfařů respektuje poctivou chybu.
  faq:
    - q: Co se zastavuje?
      a: Vstoupit znamená pádlovat ke vlně a jezdit na ní, i když ji už má na starosti jiný surfař. Je to nebezpečné a neuctivé. Surfař nejblíže ke hřebeni vlny ji vlastní; kdokoli jiný musí ustoupit.
    - q: Co je to šplhání hadem?
      a: Snaking znamená pádlovat kolem jiného surfaře, který už je v pozici na vlnu, aby se nakonec dostal blíže k vrcholu. Je považováno za extrémně špatnou etiketu a může to vést ke konfliktu.
    - q: Mohou začátečníci surfovat na přeplněných vlnách?
      a: Ano, ale zůstaňte v oblasti bílých vod, daleko od vrcholu. Nepádlujte do hlavní oblasti startu, dokud nedokážete konzistentně chytat vlny a ovládat svůj směr. Přelidněné pořadí vyžaduje zkušenosti pro bezpečnou navigaci.
    - q: Jak se omluvím ve vodě?
      a: Jednoduché mávnutí, úsměv a "moje chyba" nebo "promiň" funguje. Uznáte chybu a odplouváte od osoby pryč. Surfaři jsou obecně shovívaví k upřímným chybám, zvlášť pokud je jasné, že se teprve učíte.
    - q: Co bych měl dělat, když mě někdo navštíví bez ohlášení?
      a: Pokud se jedná o jasné náhodné zapojení, zakřičte „vlna“ nebo „hej“, abyste je upozornili. Pokud ji náhodou chytí a omluví se, nechte to být. Pokud někdo opakovaně zasahuje, přeplujte k němu a zdvořile vysvětlete prioritu. Vyhýbejte se konfliktům.
