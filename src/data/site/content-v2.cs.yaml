- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Průvodce vybavením pro surfování ve studené vodě (surfujte přes zimu bez utrpení)
  description: 'Nenechte studenou vodu ukončit vaši sezónu. Kompletní rozpis vybavení pro studenou vodu: tloušťka neoprenu, výběr bot a rukavic, padnutí kukly a doplňky, které zimní sezony skutečně zpříjemní.'
  definition: Surfování v studené vodě vyžaduje plný neopren (5/4/3 mm nebo silnější), boty, rukavice a kuklu. Pod 12 °C je potřeba chránit každý bod styku s chladnou vodou, aby se předešlo necitlivosti, podchlazení a bezpečnostním rizikům.
  tldr: Surfování v studené vodě vyžaduje celou kapucňovou kombinézu 5/4/3mm nebo 6/5/4mm, 5mm boty, 3mm rukavice a kapuci. Kvalita švů je důležitější než značka — hledejte lepené a slepě šité (GBS) švy. Kombinéza s termo podšívkou poskytuje výrazné teplo bez další tloušťky. Vždy si vezměte náhradní termální vrstvy a termosku pro zotavení po sezení.
  problem: Chcete surfovat během zimy, ale studená voda vám po 15 minutách znecitliví nohy, ruce nemohou pevně držet prkno a váš oblek při každém pádlování spouští ledovou vodu po zádech. Bez správného vybavení jsou sezení ve studené vodě krátká a nepříjemná.
  explanation: 'Surfování ve studené vodě (pod 12 °C) vyžaduje víc než jen tlustý neopren. Každý kontakt s chladem potřebuje ochranu: boty zabraňují necitlivosti nohou a chrání proti pořezání o útesy, rukavice zachovávají funkci rukou při pádlování a kukla zabraňuje největší ztrátě tepla (hlava vyzařuje 30 procent tepla těla). Tloušťka neoprenu by měla odpovídat nejchladnějšímu měsíci, ne průměru. Kromě samotného obleku zlepšují komfort a odolnost doplňky jako botky s těsněnými podrážkami a rukavice s předem zahnutými prsty.'
  solution: 'Sestavte si sadu pro studenou vodu v tomto pořadí: oblek s celým potahem 5/4/3mm nebo 6/5/4mm s GBS švy a zipem na hrudi, boty 5mm s gumovou podrážkou, rukavice 3mm (palčáky jsou teplejší než prstové), a kuklu 3mm, která se zasune pod límec obleku. Přidejte župan pro důstojnost a teplo na parkovišti.'
  recommendation: Aquafarer Wetsuit Pro v tloušťce 5/4/3 mm s integrovanou termální podšívkou zvládne většinu podmínek studené vody až do 8°C. Kombinujte ji s 5mm Aquafarer botami a 3mm rukavicemi pro kompletní vybavení do studené vody. Pod 8°C přejděte na 6/5/4 mm neoprénový oblek s kapucí.
  faq:
    - q: Opravdu potřebuji kapuci?
      a: Ano. Přes hlavu ztrácíte 30 procent tělesného tepla. Kapuce zabraňuje prohánění a udržuje krk v teple. Kapuce o tloušťce 3 mm poskytuje více tepla než přechod z 5mm na 6mm tloušťku trupu.
    - q: Jakou tloušťku bot potřebuji?
      a: Pro vodu o teplotě 8-12 °C použijte boty o tloušťce 5 mm. Pro 12-16 °C postačí boty o tloušťce 3 mm. Pod 8 °C zvažte boty o tloušťce 7 mm nebo přidání neoprenových ponožek pod boty o tloušťce 5 mm.
    - q: Jak zabráním tomu, aby mi ve wetsuitu pronikal vzduch/voda?
      a: Proplachování nastává, když voda vstoupí do obleku u krku, zápěstí nebo kotníků. Konstrukce s horním zipem na hrudi výrazně snižuje zadní proplachování. Rychloupínací pásky na krku a kotnících také pomáhají, ale nejlepší řešení je dobře padnoucí oblek s GBS švy.
    - q: Mohu použít 3mm oblek ve studené vodě s dalšími vrstvami?
      a: Oblek o tloušťce 3 mm s neoprénovou vestou pod ním může zvýšit vaši odolnost o přibližně 3-4 °C, ale nenahrazuje správný oblek 5/4/3 mm nebo 5 mm. Vrstevnění funguje nejlépe při krátkých sezeních za hraničních podmínek.
