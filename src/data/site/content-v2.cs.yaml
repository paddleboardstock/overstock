- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Údržba nafukovací lodě: Chraňte svou investici'
  description: Roční kontrolní seznam údržby nafukovacího člunu. Čištění, UV ochrana, kontrola švů, správa tlaku, péče o motor a zimní příprava pro PVC a Hypalon čluny.
  definition: Údržba nafukovacího člunu zahrnuje čištění, UV ochranu, správu tlaku, kontrolu švů a ventilů, prevenci plísní a správné uskladnění mimo sezónu.
  tldr: Oplachujte po každém použití v mořské vodě. Aplikujte UV ochranný prostředek každé 2-3 měsíce. Před každým výletem zkontrolujte tlak nafouknutí. Měsíčně kontrolujte švy, ventily a přídavný trup. Čistěte jemným mýdlem. Mimo sezónu skladujte vyfouknuté na chladném a suchém místě.
  problem: Použil jste svůj nafukovací člun jednu sezónu a nyní vypadají trubice vybledle, šev prosakuje a záď je měkká — to vše lze předejít pravidelnou údržbou.
  explanation: UV záření degraduje polymerní matrici. Slaná voda krystalizuje ve záhybech a obrušuje tkaninu. Plíseň roste v zachycené vlhkosti. Nesprávný tlak způsobuje únavu materiálu. Přídě (zejména překližka) nasává vodu skrz šroubové díry.
  solution: 'Po každém použití: opláchněte čistou vodou, osušte, zkontrolujte tlak. Měsíčně: otřete trubky ochranným prostředkem UV, zkontrolujte spoje, zkontrolujte ventil. Ročně: důkladně vyčistěte, zkontrolujte záď na přítomnost hniloby, namažte ventily, otestujte na mikro netěsnosti.'
  recommendation: Použijte 303 Aerospace Protectant na trubice člunu Aquafarer. Každoročně odstraňte ventily a naneste silikonovou vazelínu. Skladujte v přepravní tašce s balíčkem sušidla.
  faq:
    - q: Mohu použít bělidlo k čištění mé nafukovací lodi?
      a: Ne — bělidlo poškozuje povrchovou úpravu látky. Použijte mírné mýdlo a teplou vodu. Na plíseň použijte ředěný bílý ocet.
    - q: Jak často bych měl používat ochranný přípravek UV?
      a: Každé 2-3 měsíce během období používání. Častěji v tropickém podnebí.
    - q: Musím mezi použitím vypustit vzduch z mé loďky?
      a: Ne, pokud se používá týdně. Nechat nafouknuté s krytem UV. Při měsíčních přestávkách vyfouknout a uložit.
    - q: Jak udržuji příďový panel?
      a: Kontrolujte šrouby měsíčně. Každoročně utěsněte odkryté hrany dřeva lodním lakem. Vyměňte, pokud se objeví měkká místa.
