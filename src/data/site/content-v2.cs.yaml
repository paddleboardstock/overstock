- slug: types-of-surfboards-explained
  category: guide
  type: technical
  title: Typy surfových prken vysvětleny (Které je pro vás to pravé?)
  description: Shortboard, longboard, fish, hybrid, pěna — jste už zmatení? Zde jsou všechny typy surfových prken rozděleny podle toho, pro koho jsou určeny, jaké vlny potřebují a které byste si měli koupit jako první.
  definition: Hlavní typy surfových prken jsou longboardy (9 stop, stabilní, snadné), shortboardy (5–7 stop, citlivé, pro pokročilé), pěnové/nafukovací (velký objem, bezpečné pro začátečníky) a hybridy (7–9 stop, všestranný střední typ). Každý je vhodný pro různé úrovně dovedností a podmínky vln.
  tldr: Čtyři hlavní typy surfových prken jsou krátká prkna (výkonnostní, nízký objem), dlouhá prkna (stabilní, pohodové), pěnová/nafukovací (vhodná pro začátečníky, vysoký objem) a hybridy nebo zábavná prkna (střední délka, univerzální). Každý typ vyhovuje jiné úrovni dovedností a stylu surfování. Vyberte si prkno podle toho, kde se nacházíte na své učební křivce, a jaký druh jízdy vás baví nejvíce.
  problem: 'Názvy surfařských prken jsou matoucí: mini-mal, egg, fish, gun, hybrid, retro twin — seznam pokračuje. Chcete vědět, který typ prkna odpovídá vaší úrovni dovedností a místním vlnám, aniž byste museli koupit pět různých prken, abyste to zjistili.'
  explanation: Longboardy mají délku od 9 stop výše, jsou tlusté a mají zaobřený nos — chytají vlny brzy a pádlování je snadné. Shortboardy mají 5–7 stop, špičatý nos a agresivní rocker — vyžadují silné pádlování a přesnou techniku, ale poskytují maximální výkon. Pěnové a nafukovací prkna napodobují tvary longboardů v baleních s vysokým objemem, jsou však měkčí a bezpečnější. Hybridy (funboardy, eggs) jsou dlouhé mezi 7 a 9 stopami a kombinují snadné pádlování s možností zatáčení. Fish prkna jsou krátká a široká se svahovým ocasem, určená pro menší vlny.
  solution: Určete typ vln ve vašem okolí — pomalé plážové vlny jsou vhodné pro longboardy a hybridy; strmější vlny na útesech nebo bodech jsou vhodné pro shortboardy. Přizpůsobte desku vlně, ne tomu, co vypadá cool. Začátečníci by měli začít s longboardem s vysokým objemem a postupně zkoumat kratší tvary, jak se jejich dovednosti rozvíjejí.
  recommendation: Pro většinu surfařů je hybrid nebo funboard kolem 7'6" až 8'6" nejlepší volbou jako jediná deska. Aquafarer Surfboard Pro o délce 10'6" je delší, ale nabízí stabilitu longboardu s přenosností nafukovací desky. Používejte ji jako svou hlavní desku během prvního roku.
  faq:
    - q: Jaký je nejsnazší surfovací prkno k jízdě?
      a: Longboard (9 stop +) nebo nafukovací prkno s vysokým objemem, jako je Aquafarer Surfboard Pro. Tato prkna zachytávají vlny brzy a poskytují stabilní platformu pro učení pop-upů a přesunu váhy.
    - q: Kdy bych měl přejít z longboardu na shortboard?
      a: Poté, co dokážete konzistentně chytat zelené vlny, dělat dolní oblouky a upravovat jízdu podél tváře vlny na vašem longboardu. Nejčastější chybou je uspěchat přechod — očekávejte, že na longboardu strávíte 6-12 měsíců.
    - q: Na co je surfovací prkno typu fish?
      a: Ryby jsou desky navržené pro malé, kašovité vlny. Jejich krátká délka a široký tvar vytvářejí rychlost tam, kde by typická krátká deska zpomalovala. Jsou skvělou druhou deskou pro pokročilé surfaře.
    - q: Jsou nafukovací surfy vůbec dobré?
      a: Moderní nafukovací prkna s konstrukcí drop-stitch soupeří s pěnovými longboardy v tuhosti a výkonu. Jsou ideální pro začátečníky a cestovatele, protože se vejdou do batohu a jsou téměř nezničitelná.
