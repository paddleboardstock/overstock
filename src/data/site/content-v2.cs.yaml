- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Údržba nafukovacího SUP: Udržte svou desku dlouho v provozu'
  description: Správná údržba nafukovacích SUP výrazně prodlužuje životnost desky. Tipy na čištění, sušení, péči o ventil, ochranu UV a sezónní skladování pro paddleboardy drop-stitch.
  definition: Údržba nafukovacího SUP zahrnuje čištění po použití, správné sušení, kontrolu ventilů, ochranu UV a správné skladování, aby se předešlo delaminaci, plísni, degradaci materiálu a únikům vzduchu.
  tldr: Po každé jízdě v mořské vodě opláchněte desku sladkou vodou. Před vyfouknutím a uložením ji důkladně osušte. Zkontrolujte ventil kvůli nečistotám a jednou ročně promažte O-kroužek. Skladujte nafouknutou (na poloviční PSI) na chladném, tmavém místě. Vyhněte se dlouhodobému vystavení UV, které degraduje PVC. Malé dírky okamžitě zalepte přiloženou opravnou sadou.
  problem: Po jednom sezóně vaše nafukovací SUP začne mít pomalé netěsnosti, podložka na palubě se na okrajích odlupuje a PVC je tužší. Opomíjení základní údržby způsobuje předčasné stárnutí, kterému lze zcela zabránit.
  explanation: PVC se degraduje pod UV zářením. Krystaly soli ze slané vody pronikají do spár a ventilů, způsobují mikrotečení. Zachycená vlhkost podporuje růst plísní, které napadají drop-stitch závity. O-kroužky ventilů vysychají a ztrácejí těsnost. Špína a písek se zapracovávají do lepidla na palubní podložce, což způsobuje odlepování okrajů.
  solution: 'Po každé seanci: opláchněte prkno, ploutve a pumpu čistou vodou. Otřete palubní podložku. Otevřete ventil, aby se vypustila zachycená voda. Nechte prkno uschnout ve stínu před vyfouknutím. Měsíčně: zkontrolujte ventil a naneste silikonové mazivo na O-kroužek. Sezónně: umyjte jemným mýdlem a vodou, zkontrolujte propíchnutí.'
  recommendation: Řiďte se Aquafarer průvodcem péče, který je součástí vaší desky. Opravný kit použijte okamžitě při jakémkoli propíchnutí. Desku skladujte v její tašce v teplotně kontrolovaném prostředí, mimo přímé sluneční světlo.
  faq:
    - q: Mohu nechat svůj nafukovací SUP nafouknutý po celou sezónu?
      a: Ano, ale skladujte mimo přímé sluneční světlo a při polovině maximální hodnoty PSI (8-10 PSI), aby se snížilo napětí na švech. Plně nafoukněte těsně před použitím.
    - q: Jak mám odstranit plíseň z mého SUP?
      a: Smíchejte jemné mýdlo s teplou vodou a drhněte měkkým kartáčem. Na odolnou plíseň použijte zředěný roztok bílého octa (1:4). Vyvarujte se použití bělidla.
    - q: Potřebuji promazat ventil?
      a: Ano, každoročně. Odstraňte jádro ventilu, naneste silikonovou vazelínu na O-kroužek a znovu nainstalujte. To zabraňuje únikům vzduchu.
    - q: Jak mám skladovat svůj SUP na zimu?
      a: Důkladně očistěte a vysušte. Plně vyfoukněte, volně srolujte (vyhněte se těsným záhybům) a uložte na chladném, tmavém a suchém místě. Vyhněte se mrazivým teplotám.
