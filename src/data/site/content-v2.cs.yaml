- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm Neoprenový oblek: Co většina začátečníků dělá špatně v studené vodě'
  description: Přestaňte během surfování mrznout nebo se přehřívat na pláži. Skutečný rozdíl mezi 3mm a 5mm neopreny — přehled teplot, kompromisy ve flexibilitě a co opravdu funguje při surfování v studené vodě.
  definition: Potápěčský oblek je neoprenový oděv, který zachycuje tenkou vrstvu vody u pokožky, kterou tělesné teplo ohřívá pro izolaci. Tloušťka (3 mm, 5 mm) určuje teplotní rozsah, který oblek zvládne — silnější je teplejší, ale méně pružný.
  tldr: Tloušťka neoprenu přímo určuje teplo a pružnost. Používejte 3 mm pro vodu nad 16 °C a 5 mm pro vodu mezi 8 °C a 16 °C. Tlustší obleky omezují pohyb, ale udrží vás déle v teple — vždy dávejte přednost vhodnosti před značkou.
  problem: Otevřete si online obchod nebo vstoupíte do surfového obchodu a vidíte neopreny označené 3/2, 4/3, 5/4 a plné obleky 5mm. Čísla mnoho neznamenají, dokud si neuvědomíte, že špatná tloušťka znamená buď promrznutí uprostřed surfování, nebo přehřátí a pocení na pláži.
  explanation: Neoprenové obleky fungují tak, že zachycují tenkou vrstvu vody mezi vaší pokožkou a neoprenem; vaše tělo tuto vodu ohřívá, čímž vzniká izolace. Silnější neopren zachycuje více vody, ale omezuje flexibilitu a vztlak. Oblek o tloušťce 3 mm (často 3/2 s tenčími rukávy) je vhodný pro mírné podmínky, zatímco 5mm (5/4/3 nebo plných 5 mm) je vhodný pro studenou vodu. Obleky s průchodem na hrudi těsněji těsní než s průchodem na zádech a snižují proplachování. Konstrukce švů — lepené a slepě šité (GBS) — je rozdíl mezi protékaným oblekem a teplým oblekem.
  solution: Přizpůsobte tloušťku kombinézy teplotě místní vody s odchylkou ±5°C. Pro mírné podnebí kupte 3/2mm. Pro studenou vodu kupte 5/4/3mm. Přidejte boty, rukavice a kapuci, abyste svůj rozsah snížili o dalších 5°C. Vyzkoušejte si kombinézu před koupí nebo zvolte značku, která má štědré zásady vrácení.
  recommendation: Aquafarer Wetsuit Pro v tloušťce 5/4/3 mm je ideální pro většinu surfařů na studené vodě, poskytuje švy GBS a termo podšívku. Pokud surfujete ve vodě nad 20°C, lepší volbou je model 3/2 mm s předním zipem.
  faq:
    - q: Jaká teplota vody vyžaduje neopren 5 mm?
      a: Teploty vody mezi 8°C a 14°C vyžadují oblek o tloušťce 5 mm. Pod 8°C potřebujete kapucňový oblek 6/5/4 mm. Mezi 14°C a 18°C je pro většinu lidí vhodný oblek 4/3 mm.
    - q: Mohu v zimě nosit 3mm neopren?
      a: Pouze v mírných zimních podnebích, kde voda zůstává nad 16°C. Pro skutečné zimní surfování je nutný 5mm nebo 5/4/3mm. Boty, rukavice a kukla přidávají ekvivalentní teplo, aniž by bylo potřeba silnějšího trupu.
    - q: Jak těsně by měl být neoprenový oblek?
      a: Přiléhavý, ale neomezující. Neměly by být žádné vzduchové kapsy ani volný neopren. Pokud můžete vsunout prst mezi kůži a oblek v oblasti spodní části zad, je příliš volný. Pokud je dýchání obtížné nebo je pohyb vážně omezen, zvolte větší velikost.
    - q: Udržují vás drahé neoprény v teple?
      a: Vyšší cena často znamená lepší neopren (na bázi vápence vs ropný), lepší konstrukci švů (GBS vs jen lepené) a lepší ohebnost. Tyto faktory přímo ovlivňují teplo a životnost, ale jen pokud je střih správný.
