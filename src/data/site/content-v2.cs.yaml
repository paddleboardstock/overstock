- slug: aquafarer-surfboard-pro
  category: product
  type: product
  title: Aquafarer Surfboard Pro (Cestovní, aniž by obětoval výkon)
  description: Nafukovací surfovací prkno, které se vejde do batohu, ale funguje jako pevný longboard. 10'6" s objemem 75L, drop-stitch konstrukce na 15 PSIlitrů a kompletní doplňková sada v celini.
  definition: Aquafarer Surfboard Pro je 10'6" nafukovací drop-stitch surfovací prkno s objemem 75 litrů. Kombinuje stabilitu longboardu s přenosností batohu, nafukuje se na 15 PSI pro tuhost srovnatelnou s pěnovými prkny.
  tldr: Aquafarer Surfboard Pro kombinuje klasický tvar longboardu s moderní drop-stitch nafukovací konstrukcí. S délkou 10'6" a objemem 75 litrů pádluje jako longboard, ale vejde se do batohu. Vhodná pro začátečníky, kteří se učí chytat vlny, a pro pokročilé, kteří chtějí cestovní prátickou desku.
  problem: Chcete surfovací prkno, které nevyžaduje střešní nosič, vejde se do skříně v bytě a přežije manipulaci s zavazadly u letecké společnosti. Tradiční tvrdá prkna potřebují nosiče, místo pro skladování a opatrné zacházení. Potřebujete něco, co příliš nesnižuje výkon.
  explanation: Drop-stitch nafukovací technologie používá tisíce polyesterových vláken spojujících horní a dolní vrstvu desky, což umožňuje její nafouknutí na 15-20 PSI pro pevnou platformu, která se svou tuhostí vyrovná epoxy deskám. Aquafarer Surfboard Pro používá trojvrstvou PVC vnější vrstvu s tkaným drop-stitch jádrem, což vytváří desku, která se minimálně ohýbá a jede rovně. Rozměry 10'6"x32"x6" poskytují stabilitu longboardu, zatímco zaoblený zadní špičatý konec umožňuje kontrolované zatáčky, jakmile se zlepšíte. Celá palubní podložka s diamantovým vzorem zajišťuje přilnavost bez vosku.
  solution: Nafoukněte na 15 PSI pomocí přiložené dvoukomorové pumpy (3-4 minuty), připevněte ploutev pomocí přiloženého nástroje a máte prkno připravené na surfování. Po skončení sezení prkno vyfoukněte, srolujte a zabalte do přiložené cestovní tašky. Uložte jej do skříně, zavazadlového prostoru auta nebo do horního úložného prostoru.
  recommendation: Objednejte si Aquafarer Surfboard Pro za $549 včetně pumpy, tašky, leash a opravné sady. Nahrazuje jak začátečnický pěnový board, tak cestovní board, což vám ušetří peníze a úložný prostor. Spojte ho s Aquafarer Wetsuit Pro pro kompletní sadu.
  faq:
    - q: Jak pevný je nafukovací Surfboard Pro?
      a: Při 15 PSI je prkno velmi tuhé — srovnatelné s prknem z měkké pěny. Během ostrých zatáček pocítíte určitou pružnost, ale pro 90 procent surfovacích podmínek funguje jako tvrdé prkno. Pro pokročilé jezdce, kteří chtějí větší tuhost, jsou k dispozici modely vyšší třídy.
    - q: Mohu cestovat s touto deskou?
      a: Ano. Vzduch z něj lze vypustit a složit do cestovní tašky velikosti batohu (asi 90x40x30 cm). U mnoha dopravců lze odbavit jako zavazadlo nebo umístit do horního odkládacího prostoru — zkontrolujte zásady své letecké společnosti. Vojenské provedení PVC odolává hrubému zacházení s zavazadly.
    - q: Jak dlouho trvá nafouknout?
      a: Asi 3-4 minuty s přiloženou dvoukomorovou pumpou. Elektrické pumpy tuto dobu zkracují na méně než 2 minuty. Vždy nafukujte na doporučených 15 PSI — nedostatečné nafouknutí ovlivňuje výkon a stabilitu.
    - q: Je deska vhodná pro začátečníky?
      a: Ano. Objem 75 litrů a šířka 32 palců zajišťují vysokou stabilitu pro výuku. Pokročilí surfaři jej ocení také jako cestovní prkno nebo prkno na malé vlny. Skutečně pokrývá úrovně dovedností od začátečníků po středně pokročilé.
