- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Co si obléct na surfování (Nechoďte v kraťasech, když potřebujete 5/4)
  description: Přestaňte hádat, co si obléct. Teplota vody, ne vzduchu, určuje vaše surfařské oblečení. Kompletní průvodce vrstvením od tropických rash guardů po zimní 5/4/3mm sety.
  definition: Surfové oblečení se pohybuje od kraťasů na surfování a ochraných triček do teplé vody až po plné 5/4/3mm neopreny s botami a kapucemi do studené vody. Teplota vody, nikoli teplota vzduchu, určuje, co potřebujete.
  tldr: To, co nosíte při surfování, závisí výhradně na teplotě vody — nikoli na teplotě vzduchu. Rashguardy a boardshorty fungují nad 22 °C, spring suity pokrývají 18–22 °C, celkové 3/2mm obleky zvládnou 14–18 °C a 5/4/3mm s botami je nutné pod 14 °C. Vždy noste UV ochranu a zvažte leash a ochrannou vestu.
  problem: Dorazíte na pláž a nemáte tušení, jestli je dostatečný pouze rash guard, nebo jestli potřebujete celý neopren. Teplota vzduchu je teplá, ale voda je studená, nebo voda je v pohodě, ale vítr je mrazivý. Špatné oblečení znamená zničenou seanci.
  explanation: 'Surfovací oděv slouží třem účelům: tepelná izolace, ochrana UV a prevence oděrek. Neoprenové obleky se hodnotí podle tloušťky a pokrytí — jarní obleky (s krátkými rukávy nebo nohavicemi) jsou pro okrajové dny, celé obleky pro studenou vodu. Rash gards chrání před oděrkami od prkna a sluncem, ale nemají žádnou tepelnou hodnotu. Boty, rukavice a kukly nejsou doplňky, ale základní výbava pro surfování ve studené vodě pod 12 °C.'
  solution: 'Před vyplutím si zkontrolujte místní bóji nebo aktuální teplotu vody. Sestavte si výbavu podle vašich nejchladnějších obvyklých podmínek: rash guard a šortky na léto, celou kombinézu 3/2 mm na jaro a podzim, 5/4/3 mm s botami a kapucí na zimu. Vždy přidejte leash a zvažte plovací vestu pro bezpečnost.'
  recommendation: Nejprve investujte do dobrého celého obleku 3/2 mm — pokrývá nejširší škálu podmínek. Přidejte oblek 5/4/3 mm a boty, pokud plánujete surfovat během zimy. Neoprén Aquafarer Wetsuit Pro s tepelnou podšívkou efektivně propojuje oba teplotní rozsahy.
  faq:
    - q: Mohu surfovat jen v kraťasech na surfování?
      a: Ano, v tropické vodě nad 24 °C. Můžete chtít nosit ochranný top proti odření hrudníku a paží při pádlování. Voskování nebo trakční podložka na prkně pomáhá kompenzovat nedostatek uchopení, který obvykle poskytuje neopren.
    - q: Potřebuji surfařské boty?
      a: Pokud teplota vody klesne pod 14 °C, boty zabraňují necitlivosti a chrání vaše nohy před kameny a řeznými ranami na korálovém útesu. Také poskytují lepší trakci na prkně. Většina surfařů v severních oblastech používá boty od listopadu do března.
    - q: Co je to jarní oblek?
      a: Jarní oblek je krátkorukávý nebo krátkonohý neoprenový oblek (nebo oba), určený pro vodu o teplotě mezi 18 °C a 22 °C. Nabízí více tepla než rash guard, ale méně krytí než celý oblek.
    - q: Měl bych při surfování nosit záchrannou vestu?
      a: Ne tradiční záchranné vesty, ale nárazová vesta nebo plovací pomůcka může pomoci v drsných podmínkách nebo pokud jste slabý plavec. Aquafarer záchranné vesty jsou navrženy pro SUP a kajakování, ale mohou poskytnout dodatečnou jistotu plavání pro začátečníky surfování.
