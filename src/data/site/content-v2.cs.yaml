  tldr: 'SUP Explorer 11 je vlajkovou všestrannou iSUP společnosti Aquafarer. S délkou 11'' a šířkou 33" poskytuje rovnováhu mezi stabilitou a výkonem pro jezdce vážící 50-100 kg. Hlavní specifikace: objem 260 l, maximální PSI 18, trojvrstvá PVC, diamantově vroubkovaná EVA palubní podložka. Cena kolem $599. Nejlepší pro rekreační pádlování, fitness, jógu a začátečnický surf.'
  problem: Chcete jednu SUP, která zvládne všechno — klidné pádlování na vodě, lehké výlety, jógu a surfování pro začátečníky — aniž byste potřebovali více prken.
  explanation: Průzkumník SUP 11 používá trojvrstvý vojenský PVC s vysokohustotním drop-stitch pro tuhost při 18 PSI. Plachetní trup nabízí dobrý všestranný výkon. Celoplošná EVA palubní podložka poskytuje úchop. Šest D-oken poskytuje upevňovací body. Americká skříňka na ploutve přijímá standardní ploutve. Celková hmotnost je 11,5 kg.
  solution: Nafoukněte na 15-18 PSI, připevněte přiloženou střední ploutev a máte všestrannou desku. Šířka 33" poskytuje vynikající stabilitu. Pro vybavení použijte systém bungee. Batoh usnadňuje přepravu a skladování.
  recommendation: U $599, je SUP Explorer 11 nejlepší všestranně použitelná nafukovací SUP ve své třídě. Kupte si ji pro jednu desku, která zvládne vše. Kombinujte s Aquafarer Wetsuit Pro a Life Vest Pro.
  faq:
    - q: Je SUP Explorer 11 vhodný pro začátečníky?
      a: Ano — šířka 33" a objem 260 l poskytují vynikající stabilitu. Začátečníci se budou cítit jistě při stání a pádlování.
    - q: Mohu surfovat s SUP Explorer 11?
      a: Ano, za podmínek pro začátečníky až středně pokročilé. Délka 11' vyžaduje širší, pomalejší vlny.
    - q: Kolik váhy dokáže SUP Explorer 11 unést?
      a: Maximální hmotnost jezdce je přibližně 100 kg pro optimální výkon. Celková nosnost je asi 120 kg.
    - q: Co je obsaženo v krabici?
      a: Deska, dvoukomorové čerpadlo, třídílné nastavitelné pádlo, batoh na kolečkách, navinuté vodítko, odnímatelná střední ploutev a sada na opravu.
