- slug: surfboard-size-guide
  category: guide
  type: buying-guide
  title: Průvodce velikostí surfového prkna (objem je to, na čem skutečně záleží)
  description: Přestaňte hádat velikosti surfových prken. Objem v litrech určuje vše — jak snadno chytáte vlny, jak stabilně se cítíte a jak rychle postupujete. Najděte svůj cílový objem v litrech za 2 minuty.
  definition: Velikost surfového prkna se týká především objemu (litry), nikoli délky. Objem určuje plovatelnost a schopnost chytat vlny. Delší prkna pádlování urychlují; širší prkna jsou stabilnější; tlustší prkna poskytují více objemu bez navýšení délky.
  tldr: 'Velikost surfového prkna závisí na objemu, nejen na délce. Začátečníci potřebují 60-80 litrů, mírně pokročilí 35-55 litrů a pokročilí surfaři 20-35 litrů. Použijte svou váhu jako hlavní faktor: každých 10 kg potřebuje přibližně 10-12 litrů objemu na úrovni začátečníka.'
  problem: Stojíte-li před regálem s surfovými prkny, na jejichž bocích jsou vytištěna čísla jako 7'2" x 22" x 3", nemáte tušení, jaké to tyto rozměry mají ve vodě. Kupování podle vzhledu nebo podle toho, na čem jezdí kamarád, vede k prknu, které je buď příliš nestabilní, nebo příliš těžké na pádlování.
  explanation: 'Velikost surfovací desky se nejlépe chápe prostřednictvím tří rozměrů: délky (síla pádlování a chytání vln), šířky (stabilita) a tloušťky (objem a plovatelnost). Skutečné číslo, které má význam, je objem v litrech. Desky z pěny a nafukovací desky dosahují vysokého objemu díky šířce a tloušťce spíše než nadměrné délce, což je pro začátečníky snadněji ovladatelné. S postupem se zmenšuje objem, aby deska mohla hluběji zapadat do vlny a reagovat rychleji při otáčení.'
  solution: 'Použijte kalkulačku objemu k hmotnosti: pro začátečníky vydělte svou hmotnost v kg číslem 1,5, abyste získali cílové litry. Pro pokročilé vydělte číslem 2. Pokročilí by měli hledat prkna s mírným rockerem a squash nebo kulatým ocasem pro univerzálnost.'
  recommendation: Surfboard Pro Aquafarer nabízí objem 75 litrů v balení 10'6" — ideální pro začátečníky do 90 kg. Lehčí jezdci mohou zvolit menší velikost SUP Tour 12 pro obratnější pocit, jak postupují.
  faq:
    - q: Záleží na výšce při výběru velikosti surfového prkna?
      a: Výška je méně důležitá než váha. Vysoký, lehký surfař potřebuje méně objemu než nízký, těžký surfař stejné výšky. Používejte váhu jako hlavní měřítko a upravte ji podle kondice a síly při pádlování.
    - q: Co se stane, pokud má moje deska příliš velký objem?
      a: Příliš velký objem způsobuje, že deska působí korkově a nestabilně na ploše vlny. Budete mít problém potopit hranu při zatáčkách a můžete se odrazit od vody při spodních zatáčkách.
    - q: Co se stane, pokud má moje deska příliš malý objem?
      a: Budete mít problémy pádlovat proti vlnám, při startu se ponoříte příliš hluboko a budete se cítit nestabilně jen když budete sedět na prkně a čekat. Začátečníci téměř vždy potřebují více objemu, než si myslí.
    - q: Jak poznám, kdy zmenšit velikost?
      a: Když dokážete konzistentně chytat vlny, plynule vstát a dělat základní oblouky na své současné prkně, je čas snížit objem o 5–10 litrů. Příliš brzké zmenšení zpomaluje váš pokrok.
