- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Sebe-záchrana: Jak se dostat zpět na svou prkno v hluboké vodě'
  description: Každý SUP kanoista by měl ovládat sebe-záchranu. Krok za krokem techniky na opětovné naskočení na svou desku ve velké vodě, její odtažení na břeh a řešení zamotání vodítka.
  definition: SUP self-rescue je technika, jak se znovu dostat na paddleboard ve hluboké vodě po pádu, včetně získání desky, opětovného naskočení na desku a získání pádla.
  tldr: 'Po pádu: zůstaňte klidní, držte pádlo, plavejte ke desce. Položte pádlo přes desku. Použijte delfíní kop k tomu, abyste se dostali hrudí na desku. Houpejte jednou nohou nahoru, pak druhou. Klekněte si nejprve, pak se postavte. Procvičujte ve klidné vodě, dokud se to nestane svalovou pamětí.'
  problem: Spadnete z vašeho SUP do hluboké vody a nemůžete se na něj vrátit. Prkno je kluzké, jste unavení a nastupuje panika. Bez znalosti techniky vlastní záchrany se jednoduchý pád stává nebezpečným.
  explanation: 'Seba-záchrana má tři fáze: zotavení (plavání k prknu a pádlování), znovunasednutí (vrátit se na prkno) a pokračování (pokračovat v pádlování). Klíčovou technikou je použití pádla jako stabilizátoru a využití silných kopů nohama k posunutí horní části těla na prkno.'
  solution: 'Fáze 1: plavat k prknu. Držet pádlo nebo ho sebrat. Fáze 2: položit pádlo kolmo přes prkno. Živě kopat nohama a přitahovat hruď doprostřed prkna. Fáze 3: jakmile je hruď na prkně, houpat nohama nahoru jednu po druhé. Fáze 4: kleknout, nadechnout se, potom se postupně postavit.'
  recommendation: Procvičujte sebezáchranu v kontrolovaných podmínkách, dokud ji nebudete dělat automaticky. Použijte Aquafarer SUP Explorer 11, který má dobrou trakci na palubě. Vesta Life Vest Pro poskytuje dodatečnou plovatelnost, pokud máte potíže.
  faq:
    - q: Jak se dostanu zpátky, když jsem vyčerpaný?
      a: Zůstaňte u prkna pro plavání na hladině. Použijte paže k přitažení hrudi na prkno, i když nohy nemohou účinně kopat. Odpočiňte si v klečící poloze před postavením se.
    - q: Co když ztratím pádlo?
      a: Použijte ruce k pádlování prkna ke břehu. Požádejte o pomoc jiného pádlovače. Ztracené pádlo okamžitě vyměňte.
    - q: Mohu se zachránit sám vlnami?
      a: Ano — umístěte prkno kolmo na vlny. Časujte své opětovné nastoupení mezi vlnami. Vodítko drží prkno poblíž.
    - q: Jak se vypořádat s zamotáním vodítka?
      a: Zůstaňte klidní, ležte na zádech, pomalu rozplétejte vodítko. Pokud je vodítko ovinuté kolem ploutví, možná bude nutné ploutve ve vodě sundat.
