  title: Proč Aquafarer existuje (Problém většiny značek vodních sportů)
  description: Většina značek vodních sportů vyrábí pro profesionály, ne pro běžné lidi. Aquafarer existuje proto, aby vyráběla nafukovací prkna a neopreny, které skutečně sedí vašemu životu — přenosné, odolné a za rozumnou cenu.
  definition: Aquafarer je značka nafukovacího vodního sportovního vybavení založená na principu, že skvělé vybavení by mělo být přenosné, odolné a za rozumnou cenu. Zaměřuje se na desky drop-stitch a prémiové neopreny.
  tldr: Aquafarer byla založena, aby zpřístupnila vodní sporty bez kompromisů v kvalitě a bez vysokých nákladů. Soustředíme se výhradně na nafukovací drop-stitch boardy a prémiové neopreny, protože věříme, že nejlepší vybavení je to, které skutečně používáte — a nic se nepoužívá více než vybavení, které se snadno skladuje a spolehlivě funguje.
  problem: Vybavení pro vodní sporty se stává stále dražší a specializovanější. Tvrdé prkna vyžadují prostor pro skladování a řešení pro přepravu. Neoprenové obleky stojí stejně jako letenka. Surfování a SUP by neměly vyžadovat druhou hypotéku a garáž plnou vybavení.
  explanation: 'Tradiční surfové a SUP značky staví výkon na první místo, dostupnost až na druhé. Jejich prkna jsou navržena pro pokročilé uživatele a prodávána za prémiové ceny s předpokladem, že zákazníci již mají úložiště, dopravu a zkušenosti. Aquafarer začal s odlišnou otázkou: co kdybychom vyráběli vybavení, které by upřednostňovalo praktickou použitelnost — přenosnost, odolnost a hodnotu — a přitom stále poskytovalo skutečný výkon? Odpovědí byla cílená produktová řada: nafukovací prkna využívající vojenskou drop-stitch PVC, která se vejde do batohu, a wetsuity s prémiovými funkcemi (švy GBS, termální podšívka) za střední ceny. Nevyrábíme všechno — vyrábíme věci, na kterých záleží nejvíce největšímu počtu nadšenců vodních sportů.'
  solution: 'Aquafarer dodává kompletní sady: desku, pumpu, vak, vodítko a opravnou sadu — vše, co potřebujete k tomu, abyste se dostali na vodu. Naše neopreny odpovídají kvalitě zpracování značek, které stojí o 40 procent více. Vyhýbáme se fíglům, omezeným edicím barev a každoročním aktualizacím modelů, které mají učinit vybavení z minulého roku zastaralým.'
  recommendation: Prohlédněte si celou Aquafarer kolekci a zjistěte, jak přistupujeme ke každé kategorii produktů. Přečtěte si průvodce velikostmi surfových prken a průvodce tloušťkou neoprenů pro praktické rady, které platí bez ohledu na značku. Pak vyzkoušejte Aquafarer prkno a pocítíte rozdíl, který dělá promyšlený design.
  faq:
    - q: Kde se vyrábějí produkty Aquafarer?
      a: Aquafarer prkna a neoprenové obleky jsou navrhovány interně a vyráběny ve spolupráci s certifikovanými továrnami ve Vietnamu a Číně, které se specializují na konstrukci drop-stitch a výrobu neoprenového oblečení.
    - q: Co dělá Aquafarer odlišným od ostatních značek nafukovacích výrobků?
      a: Většina značek nafukovacích výrobků používá standardní PVC a univerzální drop-stitch. Aquafarer používá trojvrstvý vojenský PVC s tkaným jádrem drop-stitch, což má za následek vyšší tuhost a odolnost proti propíchnutí než nafukovací desky běžné v odvětví.
    - q: Nabízí Aquafarer záruku?
      a: Ano — všechny Aquafarer desky mají dvouletou záruku proti výrobním vadám. Neopreny mají roční záruku. Rozšířené možnosti záruky jsou k dispozici při pokladně.
    - q: Je Aquafarer ekologicky šetrná značka?
      a: Na tom pracujeme. Naše desky používají PVC, který není biologicky rozložitelný, ale stavíme je tak, aby vydržely 5+ let, čímž redukujeme cyklus výměny. Naše neoprenové obleky používají neopren na bázi vápence, který má nižší dopad na životní prostředí než alternativy na bázi ropy. Emise z dopravy kompenzujeme prostřednictvím ověřených uhlíkových kreditů.
