- slug: cold-water-safety-guide
  category: guide
  type: safety
  title: 'Bezpečnost při studené vodě: Pádlování a surfování v chladných podmínkách'
  description: Bezpečnost při studené vodě pro SUP, surfování a kajak. Rozpoznání podchlazení, vhodné vybavení, reakce na šok z chladu a nouzové postupy při ponoření do studené vody.
  definition: Bezpečnost při studené vodě zahrnuje porozumění reakci na studený šok, selhání plavání, podchlazení a vybavení a techniky k prevenci těchto následků.
  tldr: Voda pod 15 °C vyžaduje neopren. Pod 10 °C jsou nutné boty, rukavice a kukla. Chladový šok způsobuje mimovolní lapání po dechu. Selhání při plavání nastává během 3–5 minut ve vodě pod 10 °C. Příznaky podchlazení zahrnují třes, zmatenost a ztrátu koordinace.
  problem: Vydáte se pádlovat za slunečného dne, aniž byste si uvědomovali, že voda má 8 °C. Spadnete do vody, neovladatelně se zachrčíte a během několika minut vám ztuhnou končetiny. Studená voda zabíjí rychleji než jakékoliv jiné nebezpečí oceánu.
  explanation: 'Ponoření do studené vody má čtyři fáze: šok z chladu (0-2 min) — lapání po dechu, hyperventilace. Selhání při plavání (3-15 min) — svaly se ochlazují, koordinace selhává. Podchlazení (15-45 min) — tělesná teplota klesá pod 35 °C, což způsobuje zmatení a srdeční zástavu. Kolaps po záchraně — studená krev se vrací do jádra těla.'
  solution: 'Zkontrolujte teplotu vody. Noste neopren vhodný pro danou teplotu. Nikdy nepádlovejte sami ve vodě pod 15 °C. Mějte u sebe píšťalku a telefon. Pokud spadnete do vody: kontrolujte dýchání, rychle se vraťte na prkno. Pokud je příliš zima, dejte najevo žádost o pomoc.'
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm je minimum pro vodu 8-14°C. Přidejte Aquafarer 5mm boty a 3mm rukavice. Noste záchrannou vestu Pro pro extra tepelnou ochranu.
  faq:
    - q: Jak dlouho mohu přežít ve vodě o teplotě 10 °C?
      a: Studený šok trvá 1-2 minuty. Bez plavací pomůcky a tepelné ochrany je doba přežití 30-60 minut.
    - q: Jaké jsou první příznaky podchlazení?
      a: Nepřekonatelné chvění, zmatenost, špatná koordinace, nesrozumitelná řeč. Okamžitě přerušte činnost a zahřejte se.
    - q: Jak se zahřát po koupeli ve studené vodě?
      a: Sundejte mokré oblečení, osušte se, oblékněte si teplé vrstvy včetně čepice a rukavic. Pijte teplé nealkoholické nápoje.
    - q: Mohu dostat podchlazení v létě?
      a: Ano — voda pod 15 °C se vyskytuje na mnoha místech i v létě. Voda vede teplo 25krát rychleji než vzduch.
