cases:
  - id: beginner
    title: Beginner Paddling
    desc: Stable inflatable SUP boards for first-time paddlers.
    scenario: >-
      A family visiting a lake for the weekend wants to try paddle boarding.
      They need stable, easy-to-launch equipment with clear safety guidance.
    solution: >-
      The SUP Explorer 11 provides wide-body stability for beginners. The Life
      Vest Classic ensures CE-certified flotation. The Oars & Pump Set inflates
      the board in under 10 minutes.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp

  - id: touring
    title: Touring & Exploration
    desc: Long-distance inflatable SUP boards for lakes, rivers, and coastal trips.
    scenario: >-
      An outdoor enthusiast plans a week-long paddling trip and needs a board
      that packs small, inflates at camp, and tracks straight on open water.
    solution: >-
      The Ocean Voyager Series glides efficiently with a touring outline and
      holds course in wind and chop. Its drop-stitch construction inflates to
      15 PSI for hard-board rigidity.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp

  - id: yoga
    title: SUP Yoga & Fitness
    desc: Extra-wide, stable platforms for yoga, fitness, and relaxation.
    scenario: >-
      A yoga practitioner wants a floating studio for morning sessions on calm
      water, with enough deck space to hold every pose.
    solution: >-
      The Flowing Lotus Series features a full-length deck pad and a wide beam
      for wobble-free poses. It doubles as a stable platform for light fitness
      workouts.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp

  - id: family-recreation
    title: Family Recreation
    desc: Complete SUP packages for weekend lake days and holidays.
    scenario: >-
      A family of four wants stable boards for weekend lake outings and beach
      holidays — gear that packs into the car and inflates in minutes.
    solution: >-
      The Tropical Breeze Series is a stable all-around board the whole family
      can share, while the Medusa Glow Series is lighter and shorter for kids.
      Both pack into backpacks for easy travel.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
