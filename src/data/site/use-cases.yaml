cases:
  - id: beginner
    title: Beginner Water Sports
    desc: Stable SUP boards and kayaks for first-time users.
    scenario: >-
      A family visiting a lake for the weekend wants to try paddle boarding.
      They need stable, easy-to-launch equipment with clear safety guidance.
    solution: >-
      The SUP Explorer 11 provides wide-body stability for beginners. The Life
      Vest Classic ensures CE-certified flotation. The Dual-Action Pump inflates
      both boards in under 10 minutes.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp

  - id: river-touring
    title: Outdoor Exploration
    desc: Portable kayaks and dinghies for rivers, lakes, and coastal trips.
    scenario: >-
      An outdoor enthusiast plans a week-long river trip and needs a boat that
      packs small, inflates at camp, and handles varying currents.
    solution: >-
      The Kayak Lite packs into a backpack and inflates in under 4 minutes. Its
      drop-stitch construction handles lakes, slow rivers, and coastal paddling.
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp

  - id: professional-operations
    title: Professional Operations
    desc: Commercial-grade RIBs for tour operators and emergency response.
    scenario: >-
      A coastal tour operator needs a fleet of durable boats that run daily
      trips in varying sea conditions and meet commercial safety regulations.
    solution: >-
      The RIB 330 and RIB 450 Patrol use fiberglass deep-V hulls with Hypalon
      tubes for all-weather durability. Multiple units can be deployed with
      consistent performance.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp

  - id: family-recreation
    title: Family Recreation
    desc: Spacious dinghies for day trips, fishing, and watersports.
    scenario: >-
      A family of four wants a stable boat for weekend lake outings, fishing
      trips, and towing a tube for the kids.
    solution: >-
      The AirDeck 360 seats up to five with a reinforced air deck floor. It
      inflates at the launch site, stores in the car, and handles both calm
      lakes and sheltered coastal waters.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
