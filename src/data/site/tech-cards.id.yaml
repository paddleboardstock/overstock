cards:
  - badge: PVC
    title: Lapisan PVC Kualitas Laut
    description: Kain laminasi multi-lapis PVC yang dinilai untuk lingkungan laut. Diuji untuk UV, ketahanan abrasi, dan tusukan.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch Inti
    description: Ribuan benang internal menghubungkan lapisan atas dan bawah, menciptakan struktur kaku dengan tekanan tinggi pada 12–15 PSI.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Tepi Rel Diperkuat
    description: Rel yang disambung ganda dan dilas melindungi dari goresan dermaga, pendaratan di pantai, dan benturan samping.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
