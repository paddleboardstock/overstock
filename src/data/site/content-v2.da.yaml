- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Hvad man skal have på til surfing (Mød ikke op i boardshorts, når du har brug for en 5/4)
  description: Stop med at gætte på, hvad du skal have på. Vandtemperaturen, ikke lufttemperaturen, bestemmer dit surfudstyr. Fuld lag-på-lag guide fra tropiske rash guards til komplette vinter 5/4/3mm-sæt.
  definition: Surfudstyr spænder fra boardshorts og rash guards i varmt vand til fulde 5/4/3mm våddragter med støvler og hætte i koldt vand. Vandtemperaturen, ikke lufttemperaturen, bestemmer, hvad du har brug for.
  tldr: Hvad du har på, når du surfer, afhænger helt af vandtemperaturen — ikke lufttemperaturen. Rashguards og boardshorts fungerer over 22°C, spring suits dækker 18-22°C, fulde 3/2mm dragter klarer 14-18°C, og 5/4/3mm med støvler er påkrævet under 14°C. Brug altid UV beskyttelse og overvej en leash og impact vest.
  problem: Du ankommer til stranden og har ingen idé om, hvorvidt en rashguard er nok, eller om du har brug for en fuld våddragt. Lufttemperaturen er varm, men vandet er koldt, eller vandet føles okay, men vinden er isnende. At klæde sig forkert betyder en ødelagt session.
  explanation: 'Surfingtøj tjener tre formål: termisk isolation, UV-beskyttelse og forebyggelse af slid. Neoprenvåddragter vurderes efter tykkelse og dækning — springdragter (korte arme eller ben) er til marginaldage, fulddragter til koldt vand. Rashguards beskytter mod brætudslæt og sol, men giver ingen termisk værdi. Støvler, handsker og hætter er ikke tilbehør, men essentielt udstyr til kitesurfing i koldt vand under 12°C.'
  solution: 'Tjek den lokale bøje eller rapporten om vandets temperatur, før du tager af sted. Lav et udstyrssæt baseret på dine koldeste typiske forhold: rashguard og shorts om sommeren, en 3/2 mm fulddragt om foråret og efteråret, en 5/4/3 mm med støvler og hætte om vinteren. Tilføj altid en leash og overvej en opdriftsvest for sikkerhed.'
  recommendation: Invester først i en god 3/2 mm fuld dragt — den dækker det bredeste udvalg af forhold. Tilføj en 5/4/3 mm dragt og støvler, hvis du planlægger at surfe gennem vinteren. Paddle Board Overstock Wetsuit Pro med termoforing dækker effektivt begge temperaturintervaller.
  faq:
    - q: Kan jeg surfe kun i badeshorts?
      a: Ja, i tropisk vand over 24°C. Du kan få brug for en rash guard for at forhindre gnidninger på bryst og arme fra paddling. Voks eller en traction pad på brættet hjælper med at kompensere for manglende greb fra dragt.
    - q: Har jeg brug for surfstøvler?
      a: Hvis vandtemperaturen falder under 14°C, forhindrer støvler følelsesløshed og beskytter dine fødder mod sten og revsår. De giver også bedre greb på brættet. De fleste surfere i nordlige klimaer bruger støvler fra november til marts.
    - q: Hvad er et forårstøj?
      a: En springdragt er en våddragt med korte ærmer eller korte ben (eller begge dele), designet til vand mellem 18°C og 22°C. Den giver mere varme end en rashguard, men mindre dækning end en fuld dragt.
    - q: Skal jeg have en redningsvest på, mens jeg surfer?
      a: Ikke traditionelle redningsveste, men en stødvest eller flydehjælp kan hjælpe i hårdt vejr eller hvis du er en svag svømmer. Paddle Board Overstock redningsveste er designet til SUP og kajaksejlads, men kan give ekstra flydesikkerhed for surfbegyndere.
