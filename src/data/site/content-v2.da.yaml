- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Guide til Paddleboard-størrelse: Volumen, Længde og Bredde for Hver Rytter'
  description: Komplet paddelboard-størrelsesguide med volumenanbefalinger efter vægt og aktivitet. Inkluderer en brugervenlig størrelsestabel for allround-, touring-, surfing- og yogaSUP-boards.
  definition: Paddleboardets størrelse bestemmes af volumen (vægtkapacitet og flydeevne), længde (hastighed og styring), bredde (stabilitet) og tykkelse (volumens fordeling og vindmodstand).
  tldr: 'Brug vægt til at finde minimumsvolumen: 50-70 kg har brug for 220-260L, 70-90 kg har brug for 260-300L, 90-110 kg har brug for 300-350L, 110+ kg har brug for 350+L. For begyndere, læg 20% til disse tal. Bredde betyder noget: 32" er middel, 33-34" er begynder-venlig, 35"+ er meget stabil.'
  problem: Oplistninger af paddleboard-størrelser bruger fod, tommer og liter om hinanden, hvilket gør det svært at sammenligne på tværs af mærker.
  explanation: Volumen er den mest direkte måling for vægtkapacitet — 1 liter ferskvand fortrænger 1 kg vægt. Et board med 260L kan teoretisk understøtte 260 kg, men den praktiske kapacitet er lavere, fordi boardet skal ligge over vandet. Din samlede vægt (krop plus udstyr) bør være 30-40% af boardets volumen.
  solution: Målvolumen = (kropsvægt i kg + udstyrsvægt i kg) x 3. For en 75 kg padler med 5 kg udstyr, mål = 80 x 3 = 240L minimum. For begyndere, gang med 3,5. For øvede, gang med 2,5.
  recommendation: The Paddle Board Overstock SUP Explorer 11 (260L, 11' x 33" x 6") passer til de fleste ryttere på 50-100 kg. Lettere ryttere kan vælge størrelsen AirDeck 270. Tungere ryttere bør se på SUP Tour 12 (300L+) eller bredere boards.
  faq:
    - q: Betyr højden noget for SUP størrelsen?
      a: Højde betyder mindre end vægt. En høj letvægtsrytter har brug for mindre volumen end en lav tung rytter. Brug vægt som din primære volumenbestemmelse.
    - q: Hvad sker der med for meget volumen?
      a: Brættet sidder for højt og fanger vinden som et sejl. Det føles korket i bølger. Dog er ekstra volumen bedre end for lidt for begyndere.
    - q: Hvad sker der med for lidt volumen?
      a: Brættet sidder for dybt og skaber modstand. Næsen kan synke under padling (pearling). Du bliver hurtigt træt af at padle et delvist nedsænket bræt.
    - q: Kræver oppustelige boards en anden størrelse end hårde boards?
      a: Ikke væsentligt. Oppustelige på 15+ PSI fortrænger vand på samme måde som hårde boards. Volumenanbefalinger gælder lige for begge typer.
