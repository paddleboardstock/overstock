- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP med din hund: En komplet trin-for-trin guide'
  description: Stand up paddleboarding med din hund — forberedelse, sikkerhed, træningstrin, udstyrsanbefalinger og tips til en sjov oplevelse for jer begge.
  definition: SUP med hund indebærer at træne din hundekammerat til at balancere på et paddleboard, udstyre dem med en hund PFD, og padle sikkert sammen.
  tldr: Start med en bred, stabil SUP (34"+). Få din hund en korrekt tilpasset redningsvest med håndtag. Introducer brættet på land først, derefter i lavt vand. Start med korte sessioner og positiv forstærkning. Medbring altid vand til din hund. Hold øje med tegn på stress eller træthed.
  problem: Din hund elsker vand, men du er usikker på, hvordan du sikkert introducerer dem til SUP. Uden korrekt træning kan en hund få panik, springe af eller ridse brættet.
  explanation: 'Hunde har en naturlig svømmeevne, men de skal lære, at brættet er en sikker platform. Nøglen er gradvis desensibilisering: introducér brættet på fast grund, beløn rolig adfærd, derefter flyt til lavt vand, og til sidst til dybere vand.'
  solution: 'Start på land: lad hunden snuse og gå på brættet (på græs). Beløn rolig adfærd. Næste: placer brættet i meget lavt vand, støt det, lad hunden stå på det. Beløn. Næste: du går på brættet i lavt vand, lad hunden slutte sig til. Endelig: padl langsomt i roligt vand.'
  recommendation: Brug Paddle Board Overstock SUP Explorer 11 for dens 33" stabile platform. Tilføj en hund PFD (redningsvest). Medbring frisk vand og en skål. Start med 10-minutters sessioner og byg op.
  faq:
    - q: Hvilken størrelse SUP har jeg brug for til min hund?
      a: Et 33-34" bredt bræt giver stabilitet for mellemstore til store hunde. Små hunde (under 10 kg) kan klare sig på brætter på 32"+.
    - q: Har min hund brug for en redningsvest?
      a: Ja — selv stærke svømmere har brug for en hund PFD med et håndtag for nem hentning i nødstilfælde.
    - q: Hvordan beskytter jeg brættet mod kløer?
      a: Hold hundens negle trimmet. Brug en dækkeservicet protector eller et håndklæde. Hunde tilpasser sig typisk og holder op med at klø, når de er komfortable.
    - q: Kan enhver hund lære SUP?
      a: De fleste hunde kan lære med tålmodighed. Engstelige hunde kan tage længere tid. Aldrig tving en frygtsom hund op på brættet — det skaber negative associationer.
