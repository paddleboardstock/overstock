- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Størrelsesguide: Længde, Bredde og Volumen Forklaret'
  description: Find den rigtige SUP størrelse baseret på din vægt, færdighedsniveau og padlingstil. Længde bestemmer kursstabilitet, bredde bestemmer stabilitet, og volumen bestemmer vægtkapacitet.
  definition: SUP størrelse defineres af længde (hastighed og glid), bredde (primær stabilitet), tykkelse (sekundær stabilitet og volumen) og volumen i liter (samlet vægtkapacitet).
  tldr: 'All-round SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Surf: 8''-10'' x 30"-32" (140-220L). Begyndere har brug for bredde over 32" og volumen, der overstiger kropsvægt med 60-80L. Din vægt i kg plus 60L er det minimumsvolumen, der kræves for stabilitet.'
  problem: Hvert SUP-mærke angiver boards i fod, tommer og liter, men uden at vide, hvordan disse målinger omsættes til den virkelige oplevelse, risikerer du at købe et board, der er ustabilt, langsomt eller ikke kan bære din vægt.
  explanation: 'Længde bestemmer, hvor hurtigt boardet padler, og hvor godt det følger en lige linje. Længere boards (12''+) glider mellem slagene og holder en linje. Kortere boards (under 10'') drejer let, men kræver hyppigere paddleskift. Bredde bestemmer primær stabilitet — stående stabilitet. Et 30" board føles vippet for begyndere; 34" føles som en dock. Tykkelse bestemmer volumen — et tykkere board flyder højere, men fanger mere vind. Volumen i liter er den enkelt bedste måleenhed: det belastede board (dig plus udstyr) bør nedsænke 5-10 cm i hvile.'
  solution: 'Match dine boarddimensioner til tre faktorer: din vægt (bestemmer minimum volumen), din primære aktivitet (bestemmer længde) og dit færdighedsniveau (bestemmer bredde). For begyndere skal du multiplicere vægten i kg med 2,2 for at få minimum liter. For øvede skal du multiplicere med 1,8. For avancerede skal du multiplicere med 1,4.'
  recommendation: Paddle Board Overstock SUP Explorer 11 på 11' x 33" x 6" med 260L passer til de fleste ryttere op til 100 kg til allround padling. Opgrader til SUP Tour 12 på 12' x 31" for bedre touringhastighed og glide.
  faq:
    - q: Hvilken SUP størrelse har jeg brug for i forhold til min vægt?
      a: 'For ryttere under 70 kg: 10-11'' x 32" (220-260L). For 70-90 kg: 11-12'' x 33" (260-300L). For 90-110 kg: 11-12'' x 34" (300-350L). For over 110 kg: 12'' x 34-36" (350L+).'
    - q: Er en længere SUP hurtigere?
      a: Ja. Længere brædder har et bedre længde-til-bredde-forhold, hvilket reducerer modstanden. En 14' touring SUP er markant hurtigere end et 11' allround-bræt ved samme pagajindsats.
    - q: Hvilken SUP bredde er stabil for begyndere?
      a: 33-34 tommer er det optimale for begyndere op til 90 kg. Under 32" kræver god balance. Over 34" er meget stabil, men langsommere og sværere at padle i vind.
    - q: Kan jeg bruge et alsidigt board til touring?
      a: Ja, for korte ture under 10 km. For længere distancer følger et dedikeret touring-board bedre og dækker afstand mere effektivt.
