- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hydrering og solbeskyttelse: Hold dig sikker på vandet'
  description: Væsentlige strategier for hydrering og solbeskyttelse for SUP padlere. Dehydrering og solskoldning er de mest almindelige SUP problemer — hvordan man forebygger begge under lange sessioner.
  definition: SUP hydrering betyder at opretholde væskebalancen under padling gennem regelmæssig vandindtagelse. Solbeskyttelse involverer påføring af SPF, beskyttende tøj og planlægning af sessioner for at undgå peak UV.
  tldr: Drik 500 ml vand per time, du padler. Medbring mere, end du tror, du har brug for — en 2L blærer eller flere flasker. Påfør vandafvisende SPF 50+ solcreme inden padling og genpåfør hver 2. time. Brug hat, solbriller med rem og tøj med UPF-klassificering. Undgå at padle mellem kl. 11 og 15, når UV er stærkest.
  problem: Du har en fantastisk SUP session, men efter en time har du hovedpine, tør mund, og din hud brænder. Dehydrering og solskoldning sniger sig ind på dig, fordi vandet holder dig kølig.
  explanation: Refleksion fra vandet intensiverer UV eksponering med op til 40%. Den kølende effekt af vand og brise skjuler solskoldning, indtil det er for sent. Sved fra padling øger væsketabet, og der er ofte ingen steder at genopfylde vand på vandet. Dehydrering svækker balance og beslutningstagning og øger risikoen for ulykker.
  solution: Fastgør en vandflaske eller en vandblære til boardets elastiksystem. Drik hver 15. minut, uanset om du er tørstig eller ej. Påfør SPF 50+ solcreme 30 minutter før opsendelse. Bær en bredskygget hat, polariserede solbriller med rem og UPF 50+ rashguard. Genpåfør solcreme hver 2. time.
  recommendation: Brug en vandblære strammet til frontens D-ringe på din Paddle Board Overstock SUP. Bær en UPF 50+ rashguard under din PFD. Brug en vandtæt solcreme, der bliver på i sved og vand.
  faq:
    - q: Hvor meget vand skal jeg tage med på en SUP-tur?
      a: Minimum 1 liter i timen. Til en 2-timers session, medbring 2 liter. Mere i varmt vejr. En vandblære fungerer bedst.
    - q: Hvilken type solcreme er bedst for SUP?
      a: Vandafvisende, SPF 50+ bredspektret. Mineralsolcremer (zinkoxid, titaniumdioxid) er sikre for koralrev og holder længere.
    - q: Reflekterer vandet virkelig UV?
      a: Ja — vand reflekterer op til 40% af UV strålingen, hvilket betyder, at du får UV både ovenfra og nedenfra. Dette øger risikoen for forbrænding betydeligt.
    - q: Kan jeg blive solbrændt gennem en rash guard?
      a: Standard rashguards giver minimal UV beskyttelse (omkring UPF 10-20). Kig efter tøj med UPF 50+ vurdering for fuld beskyttelse.
