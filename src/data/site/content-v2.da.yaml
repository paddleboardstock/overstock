  title: Paddle Board Overstock Wetsuit Pro (Premium varme uden den premium pris)
  description: Koldt vand våddragt med termoforet kalksten-neopren, GBS-sømme og bryst-zip indgang. Fås i 3/2mm og 5/4/3mm — premium funktioner til en mellemklasse pris.
