- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Oppustelig SUP Opbevaring: Den Rette Måde at Opbevare Din iSUP'
  description: Korrekt oppustelig SUP opbevaring forhindrer delaminering, UV skader, skimmel og ventil lækager. Vinteropbevaring, langtidsopbevaring og daglige opbevaringstips for drop-stitch boards.
  definition: Oppustelig SUP opbevaring betyder at opbevare brættet i et rent, tørt, temperaturkontrolleret miljø væk fra UV, ekstreme temperaturer og fysisk skade.
  tldr: Opbevares på et køligt, mørkt sted under 30°C væk fra direkte sollys. Til korttidsopbevaring (1-2 uger), opbevar delvist oppustet ved 8-10 PSI. Til langtidsopbevaring, tøm helt for luft, rul løst og læg i opbevaringsposen. Opbevar aldrig våd. Hold væk fra gnavere og skarpe genstande.
  problem: Du aflader din SUP og stuffer den ind i en varm garage eller en fugtig kælder. Tre måneder senere er PVC blevet gul, dækpuden skaller af, og ventilen lækker. Forkert opbevaring forårsager mere skade end almindelig brug.
  explanation: Varme over 50°C får PVC blødgørere til at migrere, hvilket gør materialet stift og skørt. UV stråling nedbryder polymerbindinger. Fugt fanget indeni skaber skimmelsvamp. Kulde under frysepunktet gør PVC skørt. Prespunkter fra tæt sammenfoldning skaber permanente folder.
  solution: 'Korttidsopbevaring: skyl, tør, pust op til 10 PSI, og opbevar over jorden i et skyggefuldt område. Langtidsopbevaring: rengør grundigt, tør helt, tøm helt for luft, rul med dækpuden udad, læg i taske, opbevar i et køligt tørt skab. Hold væk fra kemikalier og skadedyr.'
  recommendation: Brug Paddle Board Overstock-tasken til opbevaring — den blokerer UV og forhindrer ridser. Opbevar i et klimakontrolleret rum. Tilføj en pose med tørremiddel inde i tasken i fugtige omgivelser.
  faq:
    - q: Kan jeg opbevare min SUP oppustet i garagen?
      a: Kun hvis garagen forbliver under 30°C og ikke har direkte sollys. De fleste garager overstiger 40°C om sommeren.
    - q: Skal jeg opbevare min SUP i tasken?
      a: Ja, tasken beskytter mod støv, UV og fysisk skade. Sørg for, at tavlen er helt tør, inden den lægges i tasken.
    - q: Kan frost beskadige en oppustelig SUP?
      a: Ja. Under frysepunktet bliver PVC skrøbelig og kan revne, når det rulles ud eller pustes op. Opbevar altid over 5°C.
    - q: Hvordan skal jeg rulle min SUP til opbevaring?
      a: Rul med dækkets måtte vendt udad for at beskytte bunden PVC. Undgå stramme folder. Skift foldningsposition hver gang.
