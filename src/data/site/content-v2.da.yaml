- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Våddragtpleje: Få din neopren til at holde dobbelt så længe'
  description: Korrekt pleje af våddragter forlænger levetiden fra 1 sæson til 3+. Skylning, tørring, opbevaring og reparationsråd til neoprenvåddragter. Undgå almindelige fejl, der ødelægger våddragter for tidligt.
  definition: Pleje af våddragter indebærer at skylle med frisk vand efter hver brug, tørre væk fra direkte sollys, opbevare fladt eller hængt på en bred bøjle, og periodisk rengøring for at fjerne salt, bakterier og lugt.
  tldr: Skyl din våddragt indvendigt og udvendigt med ferskvand straks efter hver session. Tør indvendigt-udvendigt i skyggen på en bred plastikbøjle. Opbevar fladt eller foldet på et køligt, tørt sted. Lad aldrig våddragter ligge i direkte sol, varme biler eller tørretumblere. Brug våddragtshampoo hver 5.-10. session.
  problem: Efter en sæson lugter din våddragt, neoprenet har mistet elasticitet, syningerne skaller af, og lynlåsen hænger — alt sammen kan forebygges med korrekt pleje.
  explanation: Saltkrystaller sætter sig i neopren og slider materialet. Bakterier formerer sig i fugtige indvendige dele, hvilket producerer lugte og nedbryder neopren. UV nedbryder nylonbelægningen. Varme over 50°C forårsager delaminering. Forkert tørring forvrænger neopren og belaster sømmene.
  solution: 'Efter hver session: skyl grundigt indvendigt og udvendigt, vend vrangen ud, hæng på bred plastikbøjle i skyggen. Når den er tør, vend rigtigt og opbevar fladt. Hver 5-10 session: vask med våddragtshampoo. Månedligt: smør lynlåsen med lynlåsvoks.'
  recommendation: Brug Paddle Board Overstock Wetsuit Shampoo til rengøring og Paddle Board Overstock Zipper Wax til vedligeholdelse af lynlåsen. Opbevar på Paddle Board Overstock bred bøjle i netposen.
  faq:
    - q: Kan jeg putte min våddragt i vaskemaskinen?
      a: Ikke anbefalet — maskinvask skader neopren. Hvis du skal, brug skånsom vask, koldt vand og en vaskepose.
    - q: Hvordan får jeg lugten ud af min våddragt?
      a: Læg i koldt vand med våddragtshampoo eller hvid eddike i 30 minutter. Skyl grundigt.
    - q: Hvordan skal jeg tørre min våddragt?
      a: Vendt udenpå ind i skyggen på en bred, polstret plastikbøjle. Undgå direkte sollys og metalbøjler.
    - q: Kan jeg reparere en revnet våddragt?
      a: Små revner under 1" kan repareres med neoprenlim og en lap. Større revner kan kræve professionel reparation.
