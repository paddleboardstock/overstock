- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Våddragt Reparation: Reparer Rifter, Syninger og Lynlåse Selv'
  description: Gør-det-selv guide til reparation af våddragter for neoprenrivninger, sømdeling, lynlåsstop og delte knæpuder. Trin-for-trin instruktioner ved brug af neoprenlim.
  definition: Reparation af våddragt indebærer rengøring og ru overfladebehandling af det beskadigede område, påføring af neoprenlim og hærdning under tryk for at genoprette vandtæt integritet og fleksibilitet.
  tldr: 'Små revner under 1": påfør neoprenlim på begge sider, vent 10-15 minutter indtil klistret, tryk fast, hærd under vægt i 12 timer. Større revner kræver en neoprenlap. Lynlåseproblemer: smør først, og tjek derefter for stofklemninger.'
  problem: Din våddragt har en lille rift, en søm der går fra hinanden, eller en lynlås der hænger fast. Uden gør-det-selv-reparation betaler du $150+ for en erstatning, når reparationen koster $5.
  explanation: Neoprencement virker ved at blødgøre neoprens overflade og skabe en kemisk binding, når opløsningsmidlet fordamper. Cement skal påføres begge overflader og blive klistret, før de samles. Ved revner skal kanterne være præcist justeret. Lynlågsproblemer skyldes ofte saltkorrosion eller stof, der sidder fast i tænderne.
  solution: 'For tårer: rengør med alkohol, slib let, påfør et tyndt lag cement på begge kanter, vent indtil det er klistret, pres sammen perfekt, påfør vægt, hærd i 12-24 timer. For lapper: skær lappen 1" større end tåren, påfør cement på begge, klem. For lynlås: skyl, påfør lynlås voks, arbejd forsigtigt.'
  recommendation: Hold et Paddle Board Overstock våddragt reparationssæt i din udstyrs taske. Til store reparationer eller sømsvigt på kritiske punkter anbefales professionel reparation.
  faq:
    - q: Kan jeg bruge superlim på en våddragt?
      a: Nej — superlim tørrer hårdt og skrøbeligt. Brug kun neoprenlim eller aquaseal til reparation af våddragter.
    - q: Hvor længe varer en neopren-limreparation?
      a: En korrekt udført reparation er ofte stærkere end den oprindelige neopren og varer resten af dragtens levetid.
    - q: Kan jeg reparere en lynlås, der er gået helt fra hinanden?
      a: Hvis sporet er adskilt fra neopren, pålim igen med kontaktlim. Hvis tænderne er beskadigede, udskift lynlåsen professionelt.
    - q: Hvordan reparerer jeg en våddragt, der lækker ved sømmen?
      a: Påfør en tynd perle af aquaseal langs indersiden af den lækkende søm og lad den hærde i 24 timer.
