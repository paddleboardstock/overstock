- slug: cold-water-safety-guide
  category: guide
  type: safety
  title: 'Sikkerhed i koldt vand: Padling og surfing i kolde forhold'
  description: Sikkerhed ved koldt vand for SUP, surfing og kajak. Genkendelse af hypotermi, passende udstyr, reaktion på kuldeskock og nødprocedurer ved nedsænkning i koldt vand.
  definition: Sikkerhed i koldt vand involverer forståelse af kuldechockrespons, svømmefejl, hypotermi samt udstyret og teknikkerne til at forhindre disse konsekvenser.
  tldr: Vand under 15°C kræver en våddragt. Under 10°C kræver støvler, handsker og hætte. Kold chok forårsager ufrivillig gispen. Svimmesvigt opstår inden for 3-5 minutter i vand under 10°C. Symptomer på hypotermi inkluderer rysten, forvirring og tab af koordination.
  problem: Du padler ud på en solskinsdag uden at vide, at vandet er 8°C. Du falder i, gisper ufrivilligt og føler lemmer blive følelsesløse inden for få minutter. Koldt vand dræber hurtigere end nogen anden havfare.
  explanation: 'Nedsænkning i koldt vand har fire faser: kuldeshock (0-2 min) — gispende vejrtrækning, hyperventilation. Svømmefiasko (3-15 min) — musklerne bliver kolde, koordinationen svigter. Hypotermi (15-45 min) — kernetemperaturen falder under 35C hvilket forårsager forvirring og hjertestop. Kollaps efter redning — koldt blod vender tilbage til kernen.'
  solution: 'Tjek vandtemperaturen. Bær en våddragt, der er egnet til temperaturen. Paddel aldrig alene i vand under 15 °C. Medbring fløjte og telefon. Hvis du falder i: kontroller vejrtrækningen, kom hurtigt op på brættet igen. Hvis det er for koldt, signalér efter hjælp.'
  recommendation: Paddle Board Overstock Wetsuit Pro 5/4/3mm er minimum for vand 8-14C. Tilføj Paddle Board Overstock 5mm støvler og 3mm handsker. Bær Life Vest Pro for ekstra termisk beskyttelse.
  faq:
    - q: Hvor længe kan jeg overleve i 10°C vand?
      a: Kold chok varer 1-2 minutter. Uden opdrift og termisk beskyttelse er overlevelsestiden 30-60 minutter.
    - q: Hvad er de første tegn på hypotermi?
      a: Ukontrollerbare rystelser, forvirring, dårlig koordination, sløret tale. Stop aktiviteten og varm dig op med det samme.
    - q: Hvordan varmer jeg op efter en koldtvandssession?
      a: Tag det våde tøj af, tør dig, tag varme lag på, inklusiv hat og handsker. Drik varme alkoholfrie drikkevarer.
    - q: Kan jeg få hypotermi om sommeren?
      a: Ja — vand under 15°C forekommer mange steder selv om sommeren. Vand leder varme 25 gange hurtigere end luft.
