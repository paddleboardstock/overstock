- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3 mm vs 5 mm Våddragt: Hvad de fleste begyndere tager fejl af i koldt vand'
  description: Stop med at fryse midt i sessionen eller overophede på stranden. Den reelle forskel mellem 3 mm og 5 mm våddragter — temperaturdiagram, fleksibilitetskompromiser og hvad der faktisk virker til koldtvandssurfing.
  definition: En våddragt er et neoprenbeklædningsstykke, der fanger et tyndt lag vand mod huden, som kropsvarmen opvarmer til isolation. Tykkelsen (3 mm, 5 mm) bestemmer det temperaturområde, en dragt kan håndtere — tykkere er varmere, men mindre fleksibel.
  tldr: Tykkelsen på en våddragt bestemmer direkte varme og fleksibilitet. Brug 3 mm til vand over 16°C og 5 mm til vand mellem 8°C og 16°C. Tykkere dragter begrænser bevægelse, men holder dig varm længere — vælg altid pasform frem for mærke.
  problem: Du åbner en onlinebutik eller går ind i en surfbutik og ser våddragter mærket 3/2, 4/3, 5/4 og 5 mm fulde dragter. Tallene betyder ikke meget, før du indser, at den forkerte tykkelse enten betyder, at du fryser midt i sessionen eller overopheder og sveder på stranden.
  explanation: Våddragter fungerer ved at indfange et tyndt lag vand mellem din hud og neopren; din krop varmer det vand op og skaber isolering. Tykkere neopren indfanger mere vand, men begrænser fleksibilitet og opdrift. En 3 mm dragt (ofte 3/2 med tyndere arme) passer til milde forhold, mens 5 mm (5/4/3 eller fuld 5 mm) passer til koldt vand. Brystlynlåse slutter bedre end ryglynlåse og reducerer gennemstrømning. Sømme — limede og blindsyede (GBS) — er forskellen mellem en utæt dragt og en varm en.
  solution: Match tykkelsen til din lokale vandtemperatur med en fejlmargin på 5°C. Til tempererede klimaer køb en 3/2mm. Til koldt vand køb en 5/4/3mm. Tilføj støvler, handsker og en hætte for at udvide dit område med yderligere 5°C nedad. Prøv dragter på, før du køber, eller vælg et mærke med en generøs returpolitik.
  recommendation: Paddle Board Overstock Wetsuit Pro i 5/4/3 mm er ideel til de fleste koldtvands surfere og tilbyder GBS-sømme og termisk foring. Hvis du surfer i varmt vand over 20°C, er en 3/2 mm med brystlynlås det bedre valg.
  faq:
    - q: Hvilken vandtemperatur kræver en 5 mm våddragt?
      a: Vandtemperaturer mellem 8°C og 14°C kræver en 5mm dragt. Under 8°C har du brug for en 6/5/4mm hætte-dragt. Mellem 14°C og 18°C fungerer en 4/3mm godt for de fleste.
    - q: Kan jeg bære en 3 mm våddragt om vinteren?
      a: Kun i milde vinterklimaer, hvor vandet holder sig over 16°C. Til rigtig vintersurfing er 5 mm eller 5/4/3 mm nødvendigt. Støvler, handsker og hætte giver tilsvarende varme uden at skulle have tykkere torso.
    - q: Hvor stram skal en våddragt være?
      a: Tæt, men ikke strammende. Der bør ikke være luftlommer eller løst neopren. Hvis du kan føre en finger mellem huden og dragten i lænden, er den for løs. Hvis det er svært at trække vejret, eller bevægelsen er stærkt begrænset, skal du vælge en større størrelse.
    - q: Holder dyre våddragter dig varmere?
      a: Højere pris betyder ofte bedre neopren (kalkbaseret vs petroleum), bedre sømkonstruktion (GBS vs kun limet) og bedre fleksibilitet. Disse faktorer påvirker direkte varme og holdbarhed, men kun hvis pasformen er korrekt.
