- slug: how-to-choose-a-wetsuit
  category: guide
  type: buying-guide
  title: 'Sådan vælger du en våddragt: Pasform, tykkelse og funktioner forklaret'
  description: Komplet guide til køb af våddragt. Hvordan man vælger den rigtige tykkelse til vandtemperaturen, sikrer korrekt pasform, forstår sømtyper og vælger funktioner baseret på din aktivitet.
  definition: 'En våddragt er et neoprenbeklædningsstykke, der giver varmeisolering ved at indfange et tyndt lag vand mod huden. Vigtige udvælgelsesfaktorer: tykkelse, pasform, sømkonstruktion, indgangssystem og neoprentype.'
  tldr: 'Match tykkelse til vandtemperatur: 3/2 mm for 14-20°C, 4/3 mm for 12-18°C, 5/4/3 mm for 8-14°C, 6/5/4 mm for under 8°C. Pasformen er den vigtigste faktor. GBS-sømme er gulstandarden. Bryst-lynlås minimerer skylning. Kalksten-neopren er mere fleksibel end petroleum-baseret.'
  problem: Online størrelsesdiagrammer for våddragter er upålidelige, anbefalinger for tykkelse varierer efter mærke, og beskrivelsen af funktioner er forvirrende.
  explanation: Våddragtstykkelsesnumre (3/2, 4/3, 5/4/3) refererer til mm på torso/arme og ben. Tykkere dragter er varmere, men begrænser bevægelse. En løs dragt skyller varmt vand ud. GBS-sømme er varme og fleksible; flatlock-sømme er mindre varme. Bryst-zip indgang er varmere end ryg-zip. Limestone neopren er mere fleksibel i koldt vand.
  solution: Mål bryst, talje, hofter og højde. Sammenlign med størrelsesdiagrammer. Vælg tykkelse baseret på den koldeste vandtemperatur. Vælg GBS-sømme til koldt vand. Foretræk bryst-zip under 15°C. Overvej termisk foring for ekstra varme.
  recommendation: Paddle Board Overstock Wetsuit Pro i 3/2mm (14-20C) eller 5/4/3mm (8-16C) tilbyder GBS-sømme, bryst- lynlås og kalkstensneopren til en konkurrencedygtig pris.
  faq:
    - q: Hvor stram skal en våddragt være?
      a: Tæt uden luftlommer, men ikke stram. En finger bør ikke glide let ved lænden.
    - q: Hvilken type våddragt er varmest?
      a: En 6/5/4mm heldragt med hætte, tætsluttende sømme og bryst-lynlås. Til ekstrem kulde er en tørdragt overlegen.
    - q: Er en dyrere våddragt det værd?
      a: Højere pris køber bedre neopren, sømme og funktioner. Til almindelig koldtvandsbrug er merprisen det værd.
    - q: Kan jeg bære en våddragt til andre aktiviteter end surfing?
      a: Ja — våddragter fungerer til SUP, kajakroning, dykning, triatlon og svømning i åbent vand.
