- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Selvredning: Hvordan man kommer tilbage på sit bræt i dybt vand'
  description: Hver SUP padler bør mestre selvredning. Trin-for-trin teknikker til at komme på dit board igen i dybt vand, trække det til kysten og håndtere snorefloker.
  definition: SUP selv-redning er teknikken til at komme tilbage på dit paddleboard i dybt vand efter at være faldet af, inklusive genfinding af boardet, genmontering af kroppen og tilbagehentning af pagajen.
  tldr: 'Efter at være faldet: forbliv rolig, hold fast i pagajen, svøm hen til brættet. Placer pagajen tværs over brættet. Brug et delfin-spark for at få brystet op på brættet. Sving det ene ben op, derefter det andet. Sæt dig først på knæ, derefter stå op. Øv i roligt vand, indtil det er muskelhukommelse.'
  problem: Du falder af din SUP i dybt vand og kan ikke komme op igen. Brættet er glat, du er træt, og panik sætter ind. Uden at kende selvredningsteknikken bliver et simpelt fald farligt.
  explanation: 'Selvredning har tre faser: genopretning (svøm til brættet og padl), genmontering (kom tilbage på brættet) og fortsættelse (genoptag padlingen). Den vigtigste teknik er at bruge pagajen som stabilisator og bruge kraftige ben spark til at fremdrive overkroppen op på brættet.'
  solution: 'Trin 1: svøm til brættet. Hold fast i pagajen eller hent den. Trin 2: placer pagajen på tværs af brættet. Spark benene kraftigt, mens du trækker brystet op på midten af brættet. Trin 3: når brystet er på brættet, sving benene op én ad gangen. Trin 4: knæl, få vejret, og rejs dig derefter gradvist op.'
  recommendation: Øv dig i selvredning under kontrollerede forhold, indtil du kan gøre det uden at tænke. Brug Paddle Board Overstock SUP Explorer 11, som har godt greb på dækket. Life Vest Pro giver ekstra opdrift, hvis du har svært ved det.
  faq:
    - q: Hvordan kommer jeg tilbage på, hvis jeg er udmattet?
      a: Bliv på brættet for at flyde. Brug dine arme til at trække brystet op på brættet, selvom benene ikke kan sparke effektivt. Hvil i knælende stilling, før du rejser dig.
    - q: Hvad hvis jeg mister pagajen?
      a: Brug armene til at padle brættet i land. Spørg en anden padler om hjælp. Erstat straks den mistede pagaj.
    - q: Kan jeg redde mig selv i bølger?
      a: Ja — placer brættet vinkelret på bølgerne. Tim dit genpåstigning mellem bølgerne. Snoren holder brættet i nærheden.
    - q: Hvordan håndterer jeg en snor, der er filtret sammen?
      a: Forbliv rolig, flyd på ryggen, og løs snoren langsomt. Hvis snoren er viklet omkring finnerne, kan det være nødvendigt at fjerne finnerne, mens du er i vandet.
