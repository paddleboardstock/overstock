- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: 3mm vs 5mm Våddragt (Hvad Virkelig Virker i Koldtvandssurfing)
  description: Valget mellem en 3mm og 5mm våddragt afhænger af vandtemperaturen, ikke lufttemperaturen. Temperaturdiagram, sammenligning af fleksibilitet, og hvilken tykkelse der holder dig varm uden at begrænse din padling.
  definition: En 3mm våddragt passer til vand på 14-20°C med god fleksibilitet. En 5mm dragt dækker 8-14°C med maksimal varme, men reduceret bevægelighed. Valget er en direkte afvejning mellem varme og bevægelsesfrihed.
  tldr: 3 mm våddragter er til vand på 14-20°C og tilbyder maksimal fleksibilitet. 5 mm dragter er til 8-14°C og prioriterer varme. Vælg baseret på din lokale vandtemperatur, ikke lufttemperaturen. Hvis du surfer på tværs af sæsoner, bør du eje begge. Hvis du kun kan købe én, giver en 4/3 mm den bedste mellemvej.
  problem: Du har brug for en våddragt, men kan ikke beslutte dig mellem en 3 mm og en 5 mm. En 3 mm er måske ikke varm nok om vinteren, og en 5 mm kan være for tyk og begrænsende på varmere dage. At gætte forkert betyder enten at fryse igennem vinteren eller svede igennem efteråret.
  explanation: 'Neoprentykkelse korrelerer direkte med varme og omvendt med fleksibilitet. En 3 mm dragt (ofte 3/2 mm med tyndere arme) giver god bevægelighed til padling og surfing i milde forhold. En 5 mm dragt bruger tykkere neopren på torsoen og ofte tyndere paneler på arme og ben (5/4/3 mm) for at opretholde lidt fleksibilitet. Temperaturforskellen er cirka 6-8°C. Væsentlige forskelle: 5 mm dragter bruger mere neoprenmateriale, vejer omkring 40 procent mere, tager længere tid at tørre og kræver mere indsats at tage af. Moderne super-stretch neopren lukker fleksibilitetskløften, men 5 mm begrænser stadig bevægelsen mærkbart.'
  solution: Bestem din koldeste gennemsnitlige månedlige vandtemperatur ved hjælp af lokale bøjemålinger. Hvis den er over 16°C, køb en 3/2mm. Hvis den er mellem 12-16°C, køb en 4/3mm. Hvis den er under 12°C, køb en 5/4/3mm. Til surfing hele året med én dragt dækker en kvalitets 4/3mm med termisk foring plus en separat hætte, støvler og handsker det største temperaturinterval.
  recommendation: Paddle Board Overstock Wetsuit Pro i 5/4/3 mm håndterer 8-16°C med termisk foring for at kompensere for varmegabet i en ægte 5 mm. Hvis du primært surfer i milde forhold (16-20°C), tilbyder 3/2 mm Paddle Board Overstock Wetsuit Pro bedre fleksibilitet og komfort.
  faq:
    - q: Kan jeg bære en 3 mm i 10°C vand?
      a: Kun til meget korte sessioner (20-30 minutter) og med en termisk rashguard under. Du vil være kold det meste af sessionen. En 5 mm eller 5/4/3 mm anbefales stærkt til 10°C vand.
    - q: Er en 5 mm våddragt for varm om sommeren?
      a: Hvis sommerens vandtemperatur overstiger 18°C, vil en dragt på 5 mm forårsage overophedning. Du kan skylle dragten med koldt vand, men du vil have det mere behageligt i en 3/2 mm eller spring-dragt i sommermånederne.
    - q: Begrænser en 5 mm våddragt padling?
      a: Ja, mærkbart. Den tykkere neopren ved skuldrene kræver mere indsats pr. paddeltag. En 5/4/3 mm dragt med tyndere ærmer hjælper, men du vil stadig blive træt hurtigere end i en 3 mm dragt.
    - q: Hvad er den bedste våddragt til surfing hele året?
      a: En 4/3mm fulddragt med brystlynlås og termisk foring dækker 12-18°C, hvilket er året rundt i mange tempererede klimaer. Tilføj støvler til vinteren, og du kan surfe 10-18°C med én dragt.
