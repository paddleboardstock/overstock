cards:
  - badge: 'PVC'
    title: 'Στρώμα ναυτικού PVC'
    description: 'Πολυστρωματικό πλαστικοποιημένο ύφασμα PVC σχεδιασμένο για ναυτικά περιβάλλοντα. Δοκιμασμένο κατά UV, τριβής και διάτρησης.'
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
  - badge: 'DS'
    title: 'Πυρήνας drop-stitch'
    description: 'Χιλιάδες εσωτερικά νήματα συνδέουν το ανώτερο και κατώτερο στρώμα, δημιουργώντας άκαμπτη κατασκευή υψηλής πίεσης στα 12-15 PSI.'
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
  - badge: 'RR'
    title: 'Ενισχυμένο χείλος'
    description: 'Το διπλής στρώσης θερμοκολλημένο χείλος προστατεύει από τριβές με αποβάθρα, προσαράξεις σε παραλία και πλευρικές κρούσεις.'
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
