badges:
  - icon: ✔
    title: CE Certificat
    desc: Testat independent conform standardelor de siguranță UE — TÜV Rheinland.
    variant: cert
  - icon: ⚙
    title: ISO 9001:2015
    desc: Sistemul de management al calității certificat de SGS din 2022.
    variant: cert
  - icon: ✦
    title: Testat conform Standardului
    desc: Fiecare unitate este testată la presiune de 1,25x PSI nominal pentru 24-48 de ore.
    variant: standard
  - icon: ☆
    title: Garanție de 5 ani pentru barcă
    desc: Garanție limitată de 5 ani pentru materialul tubului, cusături și corp; 2 ani pentru SUP și accesorii. 99,3% fără defecte (AQL 2,5/ISO 2859).
    variant: warranty
  - icon: ⚖
    title: REACH & RoHS
    desc: Toate materialele respectă reglementările chimice și de mediu ale UE.
    variant: material
  - icon: ★
    title: BSCI Certificat
    desc: Auditul de conformitate socială verificat pentru producție etică.
    variant: cert
