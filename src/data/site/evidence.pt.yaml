badge: Proof & Quality
heading: Evidência
description: Histórias de qualidade real, dados de teste e fotos de fábrica que mostram como cada prancha em liquidação é enviada com qualidade de nível de varejo.
case_studies:
  - id: clearance-quality-check
    client: Estoque em Liquidação, Controle de Qualidade de Nível de Varejo
    product: Cada Prancha em Excesso, Reinspecionada
    industry: Controle de Qualidade
    challenge: As pranchas de excesso e liquidação vêm de lotes de produção excedentes, portanto os compradores têm razão em perguntar se uma prancha com desconto passa pelos mesmos testes que uma vendida a preço cheio.
    solution: Cada prancha em liquidação retorna à linha de Controle de Qualidade. Cada câmara é testada sob pressão com uma manutenção de 24-48h a 1,25x a pressão nominal, cada remessa enviada é inspecionada quanto a defeitos e os acessórios são verificados quanto à completude antes da embalagem.
    result: Taxa de 99,3% livre de defeitos nas remessas enviadas nos últimos 12 meses — o mesmo padrão se aplica ao estoque em liquidação e ao estoque de varejo.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Teste de pressão
      - Livre de Defeitos
      - Controle de Qualidade da Liquidação
    outcome_metrics:
      - label: Taxa Livre de Defeitos
        value: 99.3%
      - label: Cobertura do Teste de Pressão
        value: 100%
      - label: Duração da Manutenção
        value: 24-48h
  - id: pressure-test-regime
    client: A Manutenção de Pressão de 24-48 Horas
    product: Cada Câmara, 1,25x Pressão Nominal
    industry: Testes do Produto
    challenge: Uma prancha SUP vive ou morre pelo seu núcleo e costuras drop-stitch, e uma verificação rápida de inflação no final da linha não é suficiente para detectar vazamentos lentos ou soldas fracas.
    solution: Cada prancha é inflada a 1,25x sua pressão nominal e mantida por 24-48 horas, com queda de pressão exigida abaixo de 5%. Válvulas, anéis em D, costuras e flutuabilidade são verificados com tolerância zero para defeitos de segurança.
    result: 100% da produção passa por este regime antes da embalagem — sem atalhos de amostragem, sem exceções.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - 1,25x Pressão
      - Zero Defeitos de Segurança
    outcome_metrics:
      - label: Pressão de Teste
        value: 1.25x
      - label: Queda Máxima de Pressão
        value: <5%
      - label: Unidades Testadas
        value: 100%
  - id: warranty-claims-support
    client: Uma Garantia que Responde
    product: Cobertura de 2 Anos em Pranchas e Acessórios SUP
    industry: Pós-Venda
    challenge: Comprar produtos em liquidação direto da fábrica levanta uma questão justa — se algo der errado meses depois, quem irá resolver?
    solution: Todo prancha é enviada com uma garantia de 2 anos cobrindo pranchas SUP, costuras drop-stitch, válvulas de inflação e acessórios. Reivindicações vão diretamente para nossa equipe — envie fotos ou um vídeo curto e cuidaremos do resto.
    result: As reivindicações de garantia são revisadas e resolvidas pela mesma equipe que inspeciona a produção — de forma direta, sem intermediários.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - Garantia de 2 Anos
      - Suporte Direto
      - Acessórios Cobertos
    outcome_metrics:
      - label: Garantia
        value: 2 anos
      - label: Cobertura
        value: Prancha + Acessórios
      - label: Suporte
        value: Equipe Direta
