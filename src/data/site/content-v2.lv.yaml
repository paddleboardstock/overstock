  title: 'Piepūšamā SUP apkope: Saglabājiet dēli kalpojošu gadiem'
  description: Pareiza piepūšamo ierīču SUP apkope būtiski pagarina dēļa kalpošanas laiku. Tīrīšana, žāvēšana, vārstu kopšana, UV aizsardzība un sezonāli uzglabāšanas padomi drop-stitch airu dēļiem.
  definition: Piepūšamo priekšmetu SUP apkope ietver tīrīšanu pēc lietošanas, pareizu žāvēšanu, vārstu pārbaudi, UV aizsardzību un pareizu uzglabāšanu, lai novērstu delamināciju, pelējumu, materiālu bojāšanos un gaisa noplūdes.
  tldr: Pēc katras sālsūdens sesijas noskalojiet dēli ar svaigu ūdeni. Pilnībā nosusini pirms iztukšošanas un uzglabāšanas. Pārbaudi vārstu, vai nav netīrumu, un ik gadu ieeļļo O-gredzenu. Uzglabā piepūstu (pusiPSI) vēsā, tumšā vietā. Izvairies no ilgstošas UV iedarbības, kas bojājasPVC. Nekavējoties aizlāpē nelielus caurumus ar komplektā iekļauto remonta komplektu.
  problem: Pēc sezonas jūsu piepūšamā ierīce SUP sāk lēni noplūst, terases malas lobās, un tā PVC kļūst stingrāka. Pamata apkopes ignorēšana izraisa priekšlaicīgu novecošanos, ko var pilnībā novērst.
  explanation: PVC bojājas UV starojuma ietekmē. Sāls kristāli no jūras ūdens ieplūst šuvēs un vārstos, izraisot mikronoplūdes. Mitrums, kas iesprostots iekšpusē, veicina pelējuma veidošanos, kas uzbrūk drop-stitch vītnēm. Vārstu O-gredzeni izžūst un zaudē blīvējumu. Netīrumi un smiltis iegrimst klāja līmē, izraisot malas pacelšanos.
  solution: 'Pēc katras sesijas: noskalo dēli, spuras un sūkni ar svaigu ūdeni. Noslauki klāja paliktni. Atver vārstu, lai novadītu iesprostoto ūdeni. Izžāvē dēli ēnā pirms izlaišanas. Reizi mēnesī: pārbaudi vārstu un uzklāj silikona smērvielu uz O-gredzena. Sezonāli: mazgā ar maigu ziepju un ūdens masu, pārbaudi, vai nav caurumu.'
  recommendation: Ievērojiet Paddle Board Overstock kopšanas rokasgrāmatu, kas iekļauta jūsu dēlī. Izmantojiet remonta komplektu nekavējoties, ja ir caurums. Glabājiet dēli tā somā temperatūras kontrolētā vietā, prom no tiešiem saules stariem.
  faq:
    - q: Vai es varu atstāt savu SUP piepūšamo visu sezonu piepūšamu?
      a: Jā, bet glabājiet ārpus tiešiem saules stariem un maksimāli uz pusi PSI (8-10), PSIlai samazinātu slodzi uz šuvēm. Pilnībā piepūš tieši pirms lietošanas.
    - q: Kā es varu notīrīt pelējumu no sava SUP?
      a: Sajauciet maigas ziepes ar siltu ūdeni un berzējiet ar mīkstu otu. Pret noturīgu pelējumu izmantojiet atšķaidītu baltā etiķa šķīdumu (1:4). Izvairieties no balinātāja.
    - q: Vai man vajag ieeļļot vārstu?
      a: Jā, reizi gadā. Noņemiet vārsta kodolu, uzklājiet silikona smērvielu uz O-gredzena un uzstādiet atpakaļ. Tas novērš gaisa noplūdes.
    - q: Kā es varu uzglabāt savu SUP zāli ziemai?
      a: Rūpīgi iztīriet un žāvējiet. Pilnībā iztukšojiet, sarullējiet vaļīgi (izvairieties no ciešām krokām) un glabājiet vēsā, tumšā, sausā vietā. Izvairieties no sasalšanas temperatūrām.
