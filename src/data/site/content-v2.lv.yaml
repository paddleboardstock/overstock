  title: 'Airēšanas dēļa izmēru ceļvedis: tilpums, garums un platums katram braucējam'
  description: Pilns airēšanas dēļa izmērs ar tilpuma ieteikumiem pēc svara un aktivitātes. Ietver viegli lietojamu izmēru tabulu vispusīgām, tūres, sērfošanas un jogas SUP dēļiem.
  definition: Paddle dēļa izmēru nosaka tilpums (svara ietilpība un peldošais virziens), garums (ātrums un izsekošana), platums (stabilitāte) un biezums (tilpuma sadalījums un vēja pretestība).
  tldr: 'Izmantojiet svaru, lai noteiktu minimālo tilpumu: 50-70 kg vajag 220-260L, 70-90 kg 260-300L, 90-110 kg 300-350L, 110+ kg+350L. Iesācējiem pievienojiet 20% šiem skaitļiem. Platums ir svarīgs: 32" ir vidējs, 33-34" piemērots iesācējiem, 35"+ ļoti stabils.'
  problem: SUP dēļu izmēru aprakstos kājas, collas un litri tiek izmantoti kā sinonīmi, kas apgrūtina salīdzināšanu starp zīmoliem.
  explanation: Tilpums ir vistiešākais svara kapacitātes rādītājs — 1 litrs saldūdens izspiež 1 kg svara. Dēlis ar 260L teorētiski var izturēt 260 kg, bet praktiskā kapacitāte ir mazāka, jo dēlim jāatrodas virs ūdens. Tavs kopējais svars (korpuss plus aprīkojums) būtu jābūt 30-40% no dēļa tilpuma.
  solution: Mērķa tilpums = (ķermeņa svars kg + pārnesumā, svars kg) x 3. 75 kg airētājam ar 5 kg pārnesumu mērķis = 80 x 3 = minimums 240L. Iesācējiem reizinot ar 3,5. Pieredzējušiem reiziniet ar 2,5.
  recommendation: Paddle Board Overstock SUP Explorer 11 (260L, 11' x 33" x 6") der lielākajai daļai braucēju, kas sver 50-100 kg. Vieglāki braucēji var izvēlēties AirDeck 270 svaru. Smagākiem braucējiem vajadzētu apsvērt SUP Tour 12 (300L+) vai platākus dēļus.
  faq:
    - q: Vai augumam ir nozīme SUP izmēram?
      a: Augums ir mazāk svarīgs nekā svars. Augstam, vieglam braucējam vajag mazāku tilpumu nekā īsam, smagam braucējam. Izmanto svaru kā galveno tilpuma noteicošo faktoru.
    - q: Kas notiek ar pārāk lielu skaļumu?
      a: Dēlis sēž pārāk augstu, ķerot vēju kā bura. Tas šķiet kā skapis. Tomēr iesācējiem labāk ir vairāk apjoma nekā pārāk maz.
    - q: Kas notiek ar pārāk mazu skaļumu?
      a: Dēlis sēž pārāk dziļi, radot pretestību. Deguns var iegrimt airēšanas laikā (pērļu apdarē). Tu ātri nogursti no daļēji iegremdēta dēļa airēšanas.
    - q: Vai piepūšamajiem dēļiem nepieciešams atšķirīgs izmērs nekā cietajiem dēļiem?
      a: Ne būtiski. Piepūšamās plāksnes pie 15+ PSI izspiež ūdeni līdzīgi kā cietie dēļi. Tilpuma ieteikumi attiecas vienādi uz abiem veidiem.
