  title: 'Piepūšamā SUP krātuve: pareizais veids, kā glabāt savu iSUP'
  description: Pareiza piepūšamā SUP uzglabāšana novērš delamināciju, UV bojājumus, pelējumu un vārstu noplūdes. Ziemas uzglabāšana, ilgtermiņa uzglabāšana un ikdienas uzglabāšanas padomi drop-stitch dēļiem.
  definition: Piepūšamā SUP uzglabāšana nozīmē plates uzturēšanu tīrā, sausā, temperatūras kontrolētā vidē, prom no UVekstrēmām temperatūrām un fiziskiem bojājumiem.
  tldr: Uzglabājiet vēsā, tumšā vietā zem 30°C, prom no tiešiem saules stariem. Īstermiņā (1-2 nedēļas) glabājiet daļēji piepūstu pie 8-10PSI°C. Ilgtermiņa uzglabāšanai pilnībā iztukšojiet, sarullējiet vaļīgi un ielieciet uzglabāšanas maisiņā. Nekad neuzglabājiet mitru. Turieties tālāk no grauzējiem un asiem priekšmetiem.
  problem: Tu iztukšo savu un SUP ieliec karstā garāžā vai mitrā pagrabā. Pēc trim mēnešiem tas PVC ir dzeltējis, terases spilventiņš lobās, un vārsts noplūst. Nepareiza uzglabāšana nodara vairāk bojājumu nekā parasta lietošana.
  explanation: Karstums virs 50°C liek PVC plastificētājiem migrēt, padarot materiālu cietu un trauslu.UV Starojums sašķeļ polimēru saites. Mitrums, kas iesprostots iekšpusē, rada pelējumu. Auksts zem nulles padara PVC trauslu. Spiediena punkti ciešā locīšanā rada pastāvīgas krokas.
  solution: 'Īstermiņa uzglabāšana: noskalo, izžāvē, uzpūš līdz 10 grādiem PSIun glabā ēnainā vietā. Ilgtermiņa uzglabāšana: rūpīgi iztīri, pilnībā nosusini, pilnībā iztukšo, izrullē terases paliktni uz āru, ieliec maisā, glabā vēsā, sausā skapī. Izvairies no ķimikālijām un kaitēkļiem.'
  recommendation: Izmantojiet Paddle Board Overstock pārnēsāšanas somu glabāšanai — tā bloķē UV un novērš skrāpējumus. Glabājiet klimatkontrolētā telpā. Pievienojiet mitruma noņēmēju maisiņā mitrai videi.
  faq:
    - q: Vai es varu glabāt savu SUP piepūsto makšķeri garāžā?
      a: Tikai tad, ja garāža ir zem 30°C un nav tiešu saules gaismu. Lielākā daļa garāžu vasarā pārsniedz 40°C.
    - q: Vai man vajadzētu glabāt savu SUP somā?
      a: Jā, maisiņš pasargā no putekļiem, UV, un fiziskiem bojājumiem. Pārliecinieties, ka dēlis ir pilnībā sauss pirms iepakošanas.
    - q: Vai sasalšana var sabojāt piepūšamo ierīciSUP?
      a: Jā. Zem nulles, PVC kļūst trausls un var plaisāt, kad to izrullē vai uzpūš. Vienmēr glabā virs 5°C.
    - q: Kā man to rullēt SUP glabāšanai?
      a: Rullējiet ar klāja spilventiņu vērstu uz āru, lai aizsargātu apakšuPVC. Izvairieties no ciešām krokām. Katru reizi mainiet locīšanas pozīciju.
