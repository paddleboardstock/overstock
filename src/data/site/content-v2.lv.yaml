  title: Ko vilkt sērfošanai (neierodies boardšortos, kad vajag 5/4)
  description: Pārstāj minēt, ko vilkt mugurā. Tavu sērfošanas apģērbu nosaka ūdens temperatūra, nevis gaisa temperatūra. Pilnīgs slāņošanas ceļvedis no tropiskajiem aizsargiem līdz pilniem ziemas 5/4/3mm komplektiem.
  definition: Sērfošanas apģērbs svārstās no dēļu šortiem un aizsargkrekliem siltā ūdenī līdz pilniem 5/4/3 mm hidrotērpiem ar zābakiem un kapucēm aukstā ūdenī. Ūdens temperatūra, nevis gaisa temperatūra, nosaka, kas tev nepieciešams.
  tldr: Tas, ko jūs valkājat sērfojot, pilnībā atkarīgs no ūdens temperatūras — nevis gaisa temperatūras. Aizsargi pret sautējumais un dēļu šorti darbojas virs 22°C, atsperu tērpi sedz 18-22°C, pilni 3/2mm tērpi iztur 14-18°C, un zem 14°C nepieciešami 5/4/3mm ar zābakiem. Vienmēr valkājiet UV aizsardzību un apsveriet iespēju izmantot pavadu un triecienvesti.
  problem: Tu ierodies pludmalē un nezini, vai pietiek ar izsitumu kreklu vai vajag pilnu neoprēna tērpu. Gaisa temperatūra ir silta, bet ūdens auksts, vai arī ūdens šķiet ok, bet vējš ir ledains. Nepareiza ģērbšanās nozīmē sabojātu sesiju.
  explanation: 'Sērfošanas apģērbs kalpo trim mērķiem: siltumizolācijai, UV aizsardzībai un nodiluma novēršanai. Neoprēna hidrotērpi tiek vērtēti pēc biezuma un pārklājuma — atsperes tērpi (īsas rokas vai kājas) ir paredzēti uz robežas dienām, pilni tērpi aukstam ūdenim. Aizsargi pret izsitumiem un sauli aizsargā pret dēļu izsitumiem un sauli, bet nesniedz termisko vērtību. Zābaki, cimdi un kapuces nav aksesuāri, bet būtisks aprīkojums aukstā ūdenī sērfošanai zem 12°C.'
  solution: 'Pirms došanās ceļā pārbaudiet vietējo boju vai ūdens temperatūras ziņojumu. Izveidojiet komplektu, balstoties uz aukstāko tipisko stāvokli: vasarai aizsargkrēms un šorti, pavasarim un rudenim 3/2 mm pilns uzvalks, ziemai 5/4/3 mm ar zābakiem un kapuci. Vienmēr pievienojiet pavadu un apsveriet peldvesti drošībai.'
  recommendation: Vispirms ieguldi labā 3/2 mm pilnā tērpā — tas aptver visplašāko apstākļu spektru. Ja plāno sērfot ziemā, pievieno 5/4/3 mm tērpu un zābakus. Paddle Board Overstock Neoprēna tērps Pro ar termo oderi efektīvi apvieno abus temperatūras diapazonus.
  faq:
    - q: Vai es varu sērfot tikai ar borta šortiem?
      a: Jā, tropiskajā ūdenī virs 24°C. Iespējams, vēlēsies aizsargkrēmu pret skrējieniem, lai novērstu krūšu un roku berzi no airēšanas. Vasks vai vilkmes spilventiņš uz dēļa palīdz kompensēt tērpa satvēriena trūkumu.
    - q: Vai man vajag sērfošanas zābakus?
      a: Ja ūdens temperatūra nokrītas zem 14°C, zābaki novērš nejutīgumu un aizsargā kājas no akmeņiem un rifu griezumiem. Tie arī uzlabo saķeri uz dēļa. Lielākā daļa sērfotāju ziemeļu klimatos zābakus lieto no novembra līdz martam.
    - q: Kas ir pavasara kostīms?
      a: Pavasara tērps ir īsroku vai īso kāju hidrotērps (vai abi), kas paredzēts ūdenim no 18°C līdz 22°C. Tas nodrošina vairāk siltuma nekā aizsargkrēms pret izsitumiem, bet mazāku pārklājumu nekā pilns kostīms.
    - q: Vai man vajadzētu valkāt glābšanas vesti, sērfojot?
      a: Nevis tradicionālās glābšanas vestes, bet triecienveste vai peldlīdzeklis var palīdzēt grūtos apstākļos vai, ja esat vājš peldētājs.Paddle Board Overstock Glābšanas vestes ir paredzētas SUP laivošanai, bet var sniegt papildu pārliecību peldēšanai sērfošanas iesācējiem.
