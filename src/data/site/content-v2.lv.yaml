- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Vēja apstākļiSUP: Kā vējš ietekmē jūsu airi'
  description: Kā vēja ātrums un virziens ietekmē SUP airēšanu. Izpratne par vēju no krasta pret krastu, vēja prognožu lasīšana, airēšanas tehnikas vēja noteikšanai un kad palikt krastā.
  definition: SUP Vēja apstākļi nosaka drošību. Vējš no krasta (no zemes uz jūru) tevi atgrūž. Vējš no krasta (no jūras uz zemi) tevi virza uz krastu. Sānu vējš liek dēlim slīdēt.
  tldr: 'Maksimālais drošais vējš iesācējiem: 10 mezgli. Vidējs: 15 mezgli. Uzlabots: 20 mezgli. Jūras vējš ir visbīstamākais. Vispirms airē pret vēju. Sānu vējā airē nedaudz pretvēja virzienā no galamērķa. Noliecies ceļos stiprā vējā, lai samazinātu profilu.'
  problem: Tu airē mierīgos apstākļos, bet pēc 30 minūtēm vējš ir pastiprinājies un tev ir grūti atgriezties. Vējš ir visvairāk nenovērtētais SUP drošības faktors.
  explanation: Vējš ietekmē SUP vairāk nekā jebkurš cits airēšanas kuģis, jo tu stāvi, radot buras efektu. 10 mezglu vējš rada daudz lielāku pretestību stāvošam airētājam nekā sēdošam kajakistam. Jūras vējš tevi attālina no drošības. Sānu vējš liek degunam pagriezties.
  solution: 'Pārbaudiet vēja ātrumu un virzienu pirms airēšanas. Izmantojiet Boforta skalu: 3. spēks (7-10 mezgli) iesācējiem, 4. spēks (11-16) vidējam līmenim. Vispirms airējiet pret vēju. Ja tiek noķerts vējā, airējiet 45 grādu leņķī pret vēju. Ceļos stiprā vējā.'
  recommendation: Pirms katras sesijas izmanto vēja prognozes lietotni (Windy, Windfinder). Paddle Board Overstock SUP Tour 12 labāk seko vēja apstākļos nekā platāki dēļi. Vējainos apstākļos izmanto īsākus airēšanas sitienus un augstāku kadenci.
  faq:
    - q: Kāds vēja virziens ir visdrošākaisSUP?
      a: Sauszemes vējš (kas pūš uz sauszemi) ir visdrošākais — tas tevi atgrūž atpakaļ. Jūras vējš ir visbīstamākais.
    - q: Kā airēt sānu vēja apstākļos?
      a: Airē vairāk pa vēja pusi, lai pretotos dreifam. Novieto dēli pret vēju no galamērķa. Dziļāka centrālā spura palīdz.
    - q: Vai es varu airēt 20 mezglu vēja apstākļos?
      a: Tikai tad, ja ir pieredze aizsargātos ūdeņos. Iesācējiem nevajadzētu airēt virs 10 mezgliem.
    - q: Kā ietekmē vēja brāzmasSUP?
      a: Vēja brāzmas rada pēkšņas līdzsvara problēmas. Brāzmainos apstākļos nolaidiet stāju un esiet gatavi pēkšņām izmaiņām.
