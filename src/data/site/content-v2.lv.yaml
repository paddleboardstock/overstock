- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hidratācija un saules aizsardzība: Esi drošībā uz ūdens'
  description: Būtiskas hidratācijas un saules aizsardzības stratēģijas SUP airētājiem. Dehidratācija un saules apdegumi ir visbiežāk sastopamās SUP problēmas — kā novērst abas ilgstošu treniņu laikā.
  definition: SUP Hidratācija nozīmē šķidruma līdzsvara uzturēšanu airēšanas laikā, regulāri uzņemot ūdeni. Saules aizsardzība ietver SPF uzklāšanu, aizsargapģērbu un laika noteikšanas sesijas, lai izvairītos no maksimālās UVslodzes.
  tldr: Dzeriet 500 ml ūdens stundā airējot. Paņemiet līdzi vairāk, nekā domājat, ka nepieciešams — 2 litru urīnpūsli vai vairākas pudeles. Pirms airēšanas uzklājiet ūdensizturīgu SPF 50+ saules aizsargkrēmu un uzklājiet to ik pēc 2 stundām. Uzvelciet cepuri, saulesbrilles ar siksnu un UPF sertificētu apģērbu. Izvairieties airēt no 11:00 līdz 15:00, kad UV ir visstiprākais.
  problem: Tev ir lieliska SUP sesija, bet pēc stundas tev sāp galva, ir sausa mute un āda dedzina. Dehidratācija un saules apdegumi nemanāmi uznāk, jo ūdens tevi dzesē.
  explanation: Atstarošanās no ūdens pastiprina UV iedarbību līdz pat 40%. Ūdens un vēja dzesējošā iedarbība maskē saules apdegumus līdz brīdim, kad ir par vēlu. Sviedri no airēšanas palielina šķidruma zudumu, un bieži vien nav kur uzpildīt ūdeni uz ūdens. Dehidratācija traucē līdzsvaru un lēmumu pieņemšanu, palielinot negadījumu risku.
  solution: Pievieno ūdens pudeli vai hidratācijas pūslīti dēļa gumijas sistēmai. Dzer ik pēc 15 minūtēm, neatkarīgi no tā, vai esi izslāpis vai nē. Uzklāj SPF 50+ saules aizsargkrēmu 30 minūtes pirms palaišanas. Uzvelc platmali cepuri, polarizētas saulesbrilles ar siksnu un UPF 50+ aizsargkrēmu. Uzklāj sauļošanās krēmu ik pēc 2 stundām.
  recommendation: Izmantojiet hidratācijas urīnpūsli, kas piestiprināts pie priekšējiem D-gredzeniem Paddle Board Overstock SUP. Uzvelciet UPF 50+ izsitumu kreklu zem PFD. Lietojiet ūdensizturīgu saules aizsargkrēmu, kas turas sviedros un ūdenī.
  faq:
    - q: Cik daudz ūdens jāņem SUP līdzi ceļojumā?
      a: Minimums 1 litrs stundā. Divu stundu sesijai ņemiet līdzi 2 litrus. Vairāk karstā laikā. Vislabāk der hidratācijas pūslis.
    - q: Kāds saules aizsargkrēma veids ir vispiemērotākaisSUP?
      a: Ūdensizturīgs, SPF 50+ plaša spektra. Minerālie saules aizsargkrēmi (cinka oksīds, titāna dioksīds) ir droši rifiem un kalpo ilgāk.
    - q: Vai ūdens tiešām UVatstarojas?
      a: Jā — ūdens atstaro līdz pat 40% UV radiācijas, kas nozīmē, ka to saņem UV no augšas un apakšas. Tas ievērojami palielina apdegumu risku.
    - q: Vai es varu apdegt saulē ar rash guard?
      a: Standarta aizsargi pret izsitumiem nodrošina minimālu UV aizsardzību (apmēram UPF 10-20). Meklējiet+ UPF 50 sertificētu apģērbu pilnīgai aizsardzībai.
