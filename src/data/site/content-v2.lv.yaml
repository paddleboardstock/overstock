  title: 'SUP ar savu suni: pilnīgs pamācību ceļvedis'
  description: Airēšana ar dēli kopā ar suni — sagatavošanās, drošība, apmācības soļi, aprīkojuma ieteikumi un padomi jautrai pieredzei jums abiem.
  definition: SUP Ar suni tiek apmācīts jūsu suņu draugs noturēt līdzsvaru uz airēšanas dēļa, aprīkot viņu ar suni PFDun droši airēt kopā.
  tldr: Sāciet ar platu, stabilu SUP (34"). +Iegādājieties sunim pareizi pielāgotu glābšanas vesti ar rokturi. Dēli ieviesiet vispirms uz sauszemes, pēc tam seklā ūdenī. Sāciet ar īsām sesijām un pozitīvu pastiprinājumu. Vienmēr nēsājiet sunim līdzi ūdeni. Uzmanieties no stresa vai noguruma pazīmēm.
  problem: Jūsu suns mīl ūdeni, bet jūs neesat pārliecināts, kā droši viņu iepazīstināt ar ūdeni SUP . Bez pienācīgas apmācības suns var panikot, nolekt vai skrāpēt dēli.
  explanation: 'Suņiem ir dabiska peldēšanas spēja, bet viņiem jāiemācās, ka dēlis ir droša platforma. Galvenais ir pakāpeniska desensibilizācija: novietojiet dēli uz cietas zemes, apbalvojiet mierīgu uzvedību, tad pārvietojieties uz seklu ūdeni un visbeidzot uz dziļāku ūdeni.'
  solution: 'Sāciet uz sauszemes: ļaujiet sunim ostīt un staigāt pa dēli (pa zāli). Apbalvojiet mierīgu uzvedību. Tālāk: novietojiet dēli ļoti seklā ūdenī, atbalstiet to, ļaujiet sunim uz tā stāvēt. Apbalvojiet. Tālāk: jūs kāpjat uz klāja seklā ūdenī, aiciniet suni pievienoties. Visbeidzot: lēnām airējiet mierīgā ūdenī.'
  recommendation: Izmantojiet Paddle Board Overstock SUP Explorer 11 kā tā 33" stabilo platformu. Pievienojiet suni PFD (glābšanas vesti). Paņemiet līdzi svaigu ūdeni un bļodu. Sāciet ar 10 minūšu sesijām un pakāpeniski palieliniet.
  faq:
    - q: Kādu izmēru SUP man vajag savam sunim?
      a: 33-34 collu plats dēlis nodrošina stabilitāti vidēja un liela izmēra suņiem. Mazie suņi (zem 10 kg) var tikt galā ar dēļiem 32 collu platumā+.
    - q: Vai manam sunim vajag glābšanas vesti?
      a: Jā — pat spēcīgiem peldētājiem ārkārtas situācijās ir nepieciešams suns PFD ar rokturi, lai viņu viegli atnestu.
    - q: Kā es varu aizsargāt dēli no nagiem?
      a: Turiet suņu nagus apgrieztus. Izmantojiet terases aizsargu vai dvieli. Suņi parasti pielāgojas un pārstāj kasīt, kad jūtas ērti.
    - q: Vai jebkurš suns var iemācītiesSUP?
      a: Lielākā daļa suņu var mācīties ar pacietību. Trauksmaini suņi var prasīt ilgāku laiku. Nekad nelieciet bailīgu suni uz dēļa — tas rada negatīvas asociācijas.
