  title: 'Neoprēna tērpu kopšana: Padari neoprēnu izturīgu divreiz ilgāk'
  description: Pareiza neoprēna tērpa kopšana pagarina kalpošanas laiku no 1 līdz 3 +sezonām. Padomi neoprēna hidrotērpu skalošanai, žāvēšanai, uzglabāšanai un remontam. Izvairieties no biežāk izmantotām kļūdām, kas priekšlaicīgi bojā neoprēna tērpus.
  definition: Neoprēna tērpa kopšana ietver skalošanu ar svaigu ūdeni pēc katras lietošanas reizes, žāvēšanu prom no tiešiem saules stariem, glabāšanu plakanu vai pakārtu uz plata pakaramā un periodisku tīrīšanu, lai noņemtu sāli, baktērijas un smakas.
  tldr: Pēc katras sesijas izskalojiet neoprēna tērpu gan iekšpusē, gan ārpusē ar svaigu ūdeni. Žāvējiet ārpusē ēnā uz plata plastmasas pakaramā. Glabājiet plakanu vai salocītu vēsā, sausā vietā. Nekad neatstājiet neoprēna tērpus tiešā saulē, karstās automašīnās vai žāvētājos. Lietojiet hidrotērpa šampūnu ik pēc 5–10 sesijām.
  problem: Pēc vienas sezonas jūsu neoprēna tērps smaržo, neoprēns ir zaudējis elastību, šuves lobās, un rāvējslēdzēja nūjiņas — to visu var novērst ar pienācīgu kopšanu.
  explanation: Sāls kristāli iesūcas neoprēnā un noberž materiālu. Baktērijas vairojas mitrā iekšpusē, radot smakas un noārdot neoprēnu.UV Bojā neilona pārklājumu. Siltums virs 50°C izraisa delamināciju. Nepareiza žāvēšana kropļo neoprēnu un noslogo šuves.
  solution: 'Pēc katras sesijas: rūpīgi noskalo iekšpusi un ārpusi, apgriez otrādi, pakar uz plata plastmasas pakaramā ēnā. Kad nožuvis, apgriez pa labi un glabā plakani. Ik pēc 5-10 reizēm: mazgā ar hidrotērpa šampūnu. Reizi mēnesī: ieeļļo rāvējslēdzēju ar rāvējslēdzēja vasku.'
  recommendation: Paddle Board Overstock Tīrīšanai izmanto hidrotērpa šampūnu un Paddle Board Overstock rāvējslēdzēja vasku rāvējslēdzēja uzturēšanai. Glabā uz Paddle Board Overstock plata pakaramā sieta maisiņā.
  faq:
    - q: Vai es varu ielikt savu neoprēna tērpu veļas mašīnā?
      a: Nav ieteicams — veļas mazgāšana bojā neoprēnu. Ja nepieciešams, izmantojiet maigu ciklu, aukstu ūdeni un sieta maisiņu.
    - q: Kā es varu izvadīt smaku no sava neoprēna tērpa?
      a: Iemērciet vēsā ūdenī ar hidrotērpa šampūnu vai baltu etiķi 30 minūtes. Rūpīgi noskalojiet.
    - q: Kā man vajadzētu izžāvēt savu neoprēna tērpu?
      a: Iekšpusē ārā ēnā uz plata, polsterēta plastmasas pakaramā. Izvairieties no tiešiem saules stariem un metāla pakaramiem.
    - q: Vai es varu salabot saplēstu hidrotērpu?
      a: Nelielus plīsumus zem 1\" var salabot ar neoprēna cementu un plāksteri. Lielākiem plīsumiem var būt nepieciešams profesionāls remonts.
