- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Pašglābšana: Kā atgriezties uz dēļa dziļā ūdenī'
  description: Katram SUP airētājam jāapgūst pašizglābšanās. Soli pa solim tehnikas, kā atkal uzlikt dēli dziļā ūdenī, vilkt to uz krastu un tikt galā ar pavadas sapinumiem.
  definition: SUP Pašizglābšanās ir tehnika, kurā pēc nokrišanas no dēļa atkal tiek piestiprināts dziļā ūdenī, ieskaitot dēļa atgūšanu, virsbūves atkārtotu uzkāpšanu un airu atgūšanu.
  tldr: 'Pēc kritiena: saglabājiet mieru, turiet airi, peldiet līdz dēlim. Novietojiet airi pāri dēlim. Izmantojiet delfīna spērienu, lai ar krūtīm uzspiestu dēli. Šūpojiet vienu kāju augšup, tad otru. Vispirms nometieties ceļos, tad piecelieties. Praktizējiet mierīgā ūdenī, līdz tas kļūst par muskuļu atmiņu.'
  problem: Tu SUP nokrīti dziļā ūdenī un vairs nevari uzkāpt. Dēlis ir slidens, tu esi noguris, un sākas panika. Nezinot pašglābšanās tehniku, vienkāršs kritiens kļūst bīstams.
  explanation: 'Pašizglābšanās ir trīs posmi: atgūšanās (peldēšana līdz dēļam un airēšanai), atkārtota uzkāpšana (atgriešanās uz dēļa) un turpināšana (airēšana atsāk). Galvenā tehnika ir izmantot airi kā stabilizatoru un spēcīgus kāju spērienus, lai paceltu augšējo ķermeņa daļu uz dēļa.'
  solution: '1. posms: peld līdz dēlim. Turpini turēt vai atvelc to. 2. posms: novieto airi perpendikulāri pāri dēlim. Spēcīgi sit kājas, velkot krūtis uz dēļa centru. 3. posms: kad krūtis ir uz dēļa, šūpo kājas pa vienai uz augšu. 4. posms: ceļos, elpo, tad pakāpeniski pieceļas.'
  recommendation: Praktizē pašglābšanos kontrolētos apstākļos, līdz vari to izdarīt bez domāšanas. Izmanto Paddle Board Overstock SUP Explorer 11, kam ir laba saķere uz klāja. Life Vest Pro nodrošina papildu peldspēju, ja ir grūtības.
  faq:
    - q: Kā es varu atkal uzkāpt, ja esmu izsmelts?
      a: Paliec pie dēļa, lai peldētu. Izmanto rokas, lai pievilktu krūtis pie dēļa, pat ja kājas nevar efektīvi spārdīt. Atpūties ceļos pirms piecelšanās.
    - q: Kas notiks, ja es pazaudēšu lāpstiņu?
      a: Izmantojiet rokas, lai airētu dēli līdz krastam. Lūdziet palīdzību citam airētājam. Nekavējoties nomainiet pazudušo airi.
    - q: Vai es varu glābt sevi viļņos?
      a: Jā — novieto dēli perpendikulāri viļņiem. Laicīgi uzstādi starp viļņiem. Pavada tur dēli tuvumā.
    - q: Kā tikt galā ar pavadas sapīšanos?
      a: Paliec mierīgs, peldi uz muguras, lēnām atbrīvo pavadu. Ja pavada ir apvīta ap spurām, ūdenī var nākties tās noņemt.
