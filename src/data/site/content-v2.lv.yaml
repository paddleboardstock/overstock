  title: 'Piepūšamo laivu apkope: saglabājiet savu ieguldījumu'
  description: Gada piepūšamo laivu apkopes kontrolsaraksts. Tīrīšana, UV aizsardzība, šuvju pārbaude, spiediena vadība, dzinēja apkope un ziemassvētku sagatavošana PVC Hypalon laivām.
  definition: Piepūšamo laivu apkope ietver tīrīšanu, UV aizsardzību, spiediena pārvaldību, šuvju un vārstu pārbaudi, pelējuma novēršanu un pareizu uzglabāšanu ārpus sezonas.
  tldr: Pēc katras lietošanas sālsūdenī noskalojiet. UV Aizsarglīdzekli uzklājiet ik pēc 2-3 mēnešiem. Pārbaudiet piepūšanas spiedienu pirms katras iziešanas. Katru mēnesi pārbaudiet šuves, vārstus un pakaļgalu. Tīriet ar maigu ziepju līdzekli. Uzglabājiet iztukšotu vēsā, sausā vietā ārpus sezonas.
  problem: Jūs izmantojāt savu piepūšamo laivu sezonu, un tagad caurules izskatās izbalējušas, šuve tek un pakaļgals šķiet mīksts — to visu var novērst ar regulāru apkopi.
  explanation: UV Starojums bojā polimēra matricu. Sālsūdens kristalizējas krokās un berzē audumu. Pelējums aug iesprostotā mitrumā. Nepareiza spiediena dēļ materiāla nogurums. Aizmugure (īpaši saplāksnis) uzsūc ūdeni caur skrūvju caurumiem.
  solution: 'Pēc katras lietošanas: noskalo ar svaigu ūdeni, nosusini, pārbaudi spiedienu. Mēnesī: noslauki caurules ar UV aizsarglīdzekli, pārbaudi šuves, pārbaudi vārstu. Katru gadu: dziļi tīru, pārbaudi pakaļgala daļu, vai nav puves, ieeļļo vārstus, pārbaudi mikronoplūdes.'
  recommendation: Izmanto 303 Aerospace Protectant uz Paddle Board Overstock laivu caurulēm. Noņem vārstus un ik gadu uzklāj silikona smērvielu. Glabā somā kopā ar mitruma nosūcēju.
  faq:
    - q: Vai es varu izmantot balinātāju, lai notīrītu savu piepūšamo laivu?
      a: Nē — balinātājs bojā auduma pārklājumu. Izmantojiet maigas ziepes un siltu ūdeni. Pelējuma gadījumā izmantojiet atšķaidītu balto etiķi.
    - q: Cik bieži man vajadzētu ārstēt ar UV aizsarglīdzekli?
      a: Lietošanas sezonā ik pēc 2-3 mēnešiem. Tropu klimatos biežāk.
    - q: Vai man vajag izlaist laivu starp lietošanas reizēm?
      a: Nē, ja lieto katru nedēļu. Atstāj uzpūstu un ar UV pārsegu. Mēneša pārtraukumiem iztukšo ūdeni un uzglabā.
    - q: Kā es uzturu pakaļgalu?
      a: Katru mēnesi pārbaudiet skrūves. Katru gadu aizlīmējiet atklātās koka malas ar jūras laku. Ja parādās mīkstas vietas, nomainiet.
