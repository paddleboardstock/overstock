- slug: foam-board-vs-hard-surfboard
  category: comparison
  type: buying-guide
  title: 'Putuplasta dēlis pret cieto sērfa dēli: kurš no tiem attur iesācējus no atteikšanās'
  description: Izvēle starp putu un cieto sērfa dēli var izšķirt vai izjaukt tavu pirmo sērfošanas gadu. Ir īsti plusi un mīnusi, drošības atšķirības, un tas, ar ko iesācējiem vajadzētu sākt (tas nav cietais dēlis).
  definition: Putu dēļi izmanto mīkstu putu kodolu ar izturīgu apvalku — tie ir stabili, droši un ideāli piemēroti iesācējiem. Cietie dēļi izmanto PU vai epoksīda putas ar stiklašķiedru — tie ir stingrāki, ātrāki un atsaucīgāki, bet trausli.
  tldr: Putu dēļi (tostarp piepūšamie) ir drošāki, stabilāki un labāki iesācējiem. Cietie dēļi nodrošina labāku veiktspēju, bet prasa augstākas prasmes un ir pakļauti skrāpējumiem. Lielākajai daļai sērfotāju vajadzētu sākt ar putu vai piepūšamajiem dēļiem un pēc 6–12 mēnešiem regulāras sērfošanas pāriet uz cietajiem dēļiem.
  problem: Tev ir budžets vienai platei un jāizvēlas starp mīkstu putuplasta dēli un tradicionālu cieto epoksīdu vai PU dēli. Putuplasta dēļi šķiet pārāk vienkārši, bet cietie dēļi viegli skrāpējas un maksā dārgāk. Nepareiza izvēle nozīmē izšķērdētu naudu vai dēli, kas kavē tavu progresu.
  explanation: Putu dēļi izmanto augstas blīvuma putu kodolu (EPS vai līdzīgu) ar mīkstu ārējo slāni. Tie labi peld, absorbē triecienus un sver mazāk nekā cietie dēļi. Piepūšamie drop-stitch dēļi ir mūsdienīga versija ar līdzīgām stabilitātes priekšrocībām. Cietie dēļi ir izgatavoti no poliuretāna (PU) vai epoksīda putām ar sveķu un stiklašķiedras apvalku. Tie ir stingrāki, ātrāki un atsaucīgāki, bet smagāki un trausli. Veiktspējas atšķirība ir svarīga, kad tu pagriezies un radi ātrumu viļņa virsmā, bet tā nav būtiska, kamēr nevari uzticami noķert viļņus.
  solution: Sāc ar putu vai piepūšamo dēli un vismaz 6 mēnešus trenē airēšanas spēku, viļņu nolasīšanu un pop-up vienmērību. Pārdod putuplasta dēli un nopērc cieto dēli, kad vari konsekventi braukt pa nepārtrauktiem viļņiem un justies ierobežots putuplasta dēļa elastības un svara dēļa dēļ. Izvairies no kārdinājuma vispirms nopirkt cieto dēli tikai tāpēc, ka tas izskatās kā "īsts" sērfa dēlis.
  recommendation: Paddle Board Overstock Surfboard Pro (piepūšamaisdrop-stitch) darbojas labāk nekā parastie putu dēļi, vienlaikus saglabājot draudzīgumu iesācējiem. Tas pagarina putuplasta dēļa fāzi, kas nozīmē, ka ar vienu dēli var izturēt vairākus mēnešus, pirms jāpāriet uz cietu īso dēli.
  faq:
    - q: Vai putu plāksnes ir grūtāk pagriezt?
      a: Jā. Putu dēļiem ir lielāks apjoms un elastība, kas padara pagriezienus mazāk atsaucīgus. Tas patiesībā ir izdevīgi iesācējiem, jo novērš pārstūrēšanu un veicina vienmērīgu, pakāpenisku svara maiņu.
    - q: Vai cietie dēļi viegli skrāpējas?
      a: Jā. Ciets epoksīds vai PU dēlis var saskrāpēties no nelielas sadursmes, nokritušas pavadas vai pat no atbalstīšanās uz cietas virsmas. Putu un piepūšamie dēļi ir gandrīz neiznīcināmi salīdzinājumā.
    - q: Vai es varu iemācīties sērfot uz cietā dēļa?
      a: Tu vari, bet tas ir grūtāk un riskantāk. Cietie dēļi ir slidenāki, mazāk stabili un rada vairāk traumu trieciena brīdī. Lielākā daļa sērfošanas skolu izmanto putas vai piepūšamos dēļus pamatota iemesla dēļ.
    - q: Cik ilgi kalpo putuplasta plāksne?
      a: Kvalitatīva putu plāksne ar regulāru lietošanu kalpo 12–18 mēnešus, pirms āda sāk lobīties. Piepūšamās plāksnes kalpo 3–5 gadus, jo drop-stitch konstrukcija nesaspiež un neatdalās tā, kā to dara putu ādas.
