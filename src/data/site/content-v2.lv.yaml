  title: 'SUP Izmēru ceļvedis: garums, platums un tilpums izskaidroti'
  description: Atrodi pareizo SUP izmēru, balstoties uz savu svaru, prasmju līmeni un airēšanas stilu. Garums nosaka izsekošanu, platums nosaka stabilitāti, bet tilpums nosaka svara kapacitāti.
  definition: SUP Izmērs tiek definēts pēc garuma (ātrums un slīdēšana), platuma (primārā stabilitāte), biezuma (sekundārā stabilitāte un tilpums) un tilpuma litros (kopējā svara ietilpība).
  tldr: 'DaudzpusībaSUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Tūrisms: 12''-14'' x 30"-32" (280-350L). Sērfošana: 8''-10'' x 30"-32" (140-220L). Iesācējiem nepieciešams platums virs 32" un tilpums, kas pārsniedz ķermeņa svaru par 60-80L. Minimālais stabilitātes mērķis ir svars kilogramos plus 60L.'
  problem: Katrs SUP zīmols norāda dēļus pēdās, collās un litros, bet, nezinot, kā šie izmēri ietekmē reālo sajūtu, pastāv risks iegādāties dēli, kas ir šķībs, lēns vai nespēj noturēt tavu svaru.
  explanation: 'Garums nosaka, cik ātri dēlis airē un cik labi tas seko taisnā līnijā. Garāki dēļi (12+'') slīd starp sitieniem un notur līniju. Īsāki dēļi (zem 10'') viegli griežas, bet prasa biežākus airu slēdžus. Platums nosaka primāro stabilitāti — stāvēšanas stabilitāti. 30" dēlis iesācējiem šķiet viegls; 34" – kā piestātne. Biezums nosaka tilpumu — biezāks dēlis peld augstāk, bet labāk uztver vēju. Tilpums litros ir labākais rādītājs: noslogotais dēlis (tu un aprīkojums) miera stāvoklī jāiegremdē 2-4 collas.'
  solution: 'Pielāgojiet sava dēļa izmērus trim faktoriem: jūsu svaram (nosaka minimālo tilpumu), galvenajai aktivitātei (nosaka garumu) un prasmju līmenim (nosaka platumu). Iesācējiem reizinājiet svaru kilogramos ar 2,2, lai iegūtu minimālo litru daudzumu. Vidējam līmenim reiziniet ar 1,8. Augstākiem līmeņiem reiziniet ar 1,4.'
  recommendation: Paddle Board Overstock SUP Explorer 11 ar izmēriem 11' x 33" x 6" un 260L ir piemērots lielākajai daļai braucēju līdz 100 kg vispusīgai airēšanai. Pārejiet uz SUP Tour 12' x 31" labākam tūrisma ātrumam un slīdēšanai.
  faq:
    - q: Kādu SUP izmēru man vajag manam svaram?
      a: 'Jātniekiem līdz 70 kg: 10-11'' x 32" (220-260L). Ar 70-90 kg: 11-12'' x 33" (260-300L). Ar 90-110 kg: 11-12'' x 34" (300-350L). Ar svaru virs 110 kg: 12'' x 34-36" (+350L).'
    - q: Vai garāks ir SUP ātrāks?
      a: Jā. Garākiem dēļiem ir labāka garuma un platuma attiecība, kas samazina pretestību. 14' touring ir SUP ievērojami ātrāks nekā 11' universālais dēlis ar tādu pašu airēšanas spēku.
    - q: Kāds SUP platums ir stabils iesācējiem?
      a: 33–34 collas ir ideālais ideālais variants iesācējiem līdz 90 kg. Zem 32" nepieciešama laba līdzsvara sajūta. Virs 34" ir ļoti stabila, bet lēnāka un grūtāk airējama vējā.
    - q: Vai es varu izmantot universālu dēli ekskursijām?
      a: Jā, īsām ekskursijām zem 10 km. Garākiem attālumiem speciāls tūrisma dēlis labāk seko un efektīvāk pārvar attālumus.
