- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Sērfošanas etiķetes noteikumi (Kā nebūt tam cilvēkam, no kura visi izvairās)
  description: Rindā ir noteikumi, un neviens tos nepieraksta. Iemācies priekšrocību, kāpēc čūskas var novest pie kliegšanas, kā atvainoties un iesācēju kļūdas, kas kaitina katru vietējo sērfotāju.
  definition: 'Sērfošanas etiķete ir nerakstīts uzvedības kodekss, kas novērš sadursmes un godīgi dalās viļņos. Pamatnoteikums: sērfotājam, kurš atrodas vistuvāk lūztošā viļņa virsotnei, ir priekšroka.'
  tldr: Sērfotājam, kurš ir vistuvāk lūztošās viļņa virsotnei, ir priekšroka. Nekrīti pie kāda, neairē apkārt kādam, lai paņemtu viņa vilni), un vienmēr atvainojies, ja pieļauj kļūdu. Airē plaši ap rindu, turi dēli un esi draudzīgs — cieņa pelna cieņu.
  problem: Tu airē uz pilnu rindu un uzreiz jūti spriedzi. Sērfotāji skatās uz tevi no sāniem, kāds uzkliedz, un tu neesi pārliecināts, ko esi izdarījis nepareizi. Sērfošanas sociālā puse šķiet biedējošāka nekā paši viļņi.
  explanation: 'Sērfošanas etiķete pastāv, lai novērstu sadursmes un godīgi dalītos viļņos. Pamatnoteikums ir priekšroka: prioritāte ir sērfotājam, kurš ir vistuvāk virsotnei (kur vilnis pirmo reizi lūzt). Ikviens, kas airē uz to pašu vilni no iekšpuses, ir spiests izstāties. Līkumošana — airēšana ap citu sērfotāju, lai nozagtu prioritāti — tiek uzskatīta par sliktāko pārkāpumu. Papildus prioritātei rindā ir gaidas attiecībā uz troksni (minimālu kliegšanu), dēļa kontroli (nekad nelaižiet dēli tuvu citiem) un draudzīgumu (vienkāršs mājiens ļoti palīdz).'
  solution: Vēro līniju 10 minūtes pirms airēšanas. Noskaidro, kurš ķer visvairāk viļņu — tie ir sērfotāji, kurus vajadzētu cienīt un no kuriem izvairīties. Ja mācies, paliec iekšpusē (baltā ūdens zonā). Airē plaši ap līniju, nevis cauri tai. Kad noķer vilni, paskaties abās pusēs pirms izniršanas un pārliecinies, ka neviens nav dziļāk.
  recommendation: Pirmās dažas nodarbības pavadi iesācējiem draudzīgā pārtraukumā ar izkliedētu pūli. Iemācies lasīt prioritātes, pirms mēģini veidot pārpildītu rindu. Ja tomēr iegriezies pie kāda, uzreiz atvainojies un airē — lielākā daļa sērfotāju cienī godīgu kļūdu.
  faq:
    - q: Kas ir dropping in?
      a: Ielidošana nozīmē airēt un braukt uz viļņa, uz kura jau ir prioritāte citam sērfotājam. Tas ir bīstami un necieņpilni. Viļņa īpašnieks ir tas, kurš ir vistuvāk virsotnei; jebkurš cits ir spiests to izdarīt.
    - q: Kas ir līkums?
      a: Slanking ir airēšana ap citu sērfotāju, kurš jau ir pozīcijā vilnim, lai tu nonāktu tuvāk virsotnei. Tas tiek uzskatīts par ārkārtīgi sliktu etiķeti un var novest pie konfliktiem.
    - q: Vai iesācēji var sērfot pārpildītos viļņos?
      a: Jā, bet palieciet baltā ūdens zonā, prom no virsotnes. Neairējiet galvenajā pacelšanās zonā, kamēr nevarat konsekventi noķert viļņus un kontrolēt virzienu. Pārpildītas rindas prasa pieredzi, lai droši orientētos.
    - q: Kā atvainoties ūdenī?
      a: Vienkāršs vilnis, smaids un "mana vaina" vai "atvainojos" darbojas. Atzīsti kļūdu un airē prom no cilvēka. Sērfotāji parasti ir piedodoši godīgām kļūdām, īpaši, ja acīmredzami mācies.
    - q: Ko man darīt, ja kāds pēkšņi iegriežas pie manis?
      a: Ja tas ir skaidrs pēkšņs ienācējs, sauciet "pamājiet" vai "hei", lai viņus brīdinātu. Ja viņi to pamana nejauši un atvainojas, ļaujiet tam notikt. Ja kāds atkārtoti iekrīt, piebrauciet un pieklājīgi paskaidrojiet prioritātes. Izvairieties no konfliktiem.
