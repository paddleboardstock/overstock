  title: 'Stāvus airēšanas dēlis iesācējiem: Jūsu pirmais treniņš'
  description: 'Viss, kas jāzina pirms pirmās SUP nodarbības: ekipējuma kontrolsaraksts, kā piecelties, airēšanas tehnika, droša krišana un mierīga ūdens izvēle mācībām.'
  definition: Stāvus airēšana ar dēli (SUP) ietver stāvēšanu uz dēļa un airēšanas izmantošanu, lai pārvietotos pāri ūdenim. Līdzsvars, airēšanas tehnika un ūdens apstākļu nolasīšana ir trīs galvenās prasmes.
  tldr: Sāc uz līdzena, mierīga ūdens bez vēja. Vispirms trenē ceļos, tad stāvi ar kājām gurnu platumā netālu no dēļa centra. Turiet airi ar vienu roku virsū un otru uz kāta. Airēšanai izmantojiet torsu rotāciju, nevis roku spēku. Skatieties uz horizontu, nevis uz kājām. Sagaidiet kritienu — tas ir mācīšanās daļa.
  problem: Tu uzpūš pirmo SUPpirkstu, uzkāp uz dēļa un uzreiz jūties nestabils. Kājas trīc, airis šķiet neveikls, un tu nevari saprast, kāpēc brauc pa apli, nevis taisnām līnijām.
  explanation: SUP Nepieciešama līdzsvara regulēšana, jo stāvēšana uz peldošas platformas atšķiras no jebkuras sauszemes aktivitātes. Ķermenis instinktīvi saspringst, kas padara dēli nestabilāku. Lāpstiņas sitiens jāveic, rotējot torsu, nevis velkot ar rokām. Lāpstiņa jāieiet ūdenī pie pirkstiem un jāiziet pie potītes. Lielākā daļa iesācēju airē tikai ar rokām, kas noved pie straujas noguruma un sliktas izsekošanas. Skatīšanās uz dēli izjauc līdzsvaru.
  solution: Piepūš dēli līdz ieteiktajam PSIlīmenim, piesien pavadu pie potītes un sāc ceļoties ceļos. Airē no ceļos, lai sajustu slīdēšanu. Kad esi gatavs stāvēt, novieto airi pāri dēlim, abas rokas uz klāja, soli pa vienai kājai un celies, saglabājot svaru centrā. Turiet ceļus nedaudz saliektus un kodolu iesaistītu.
  recommendation: Izmanto Paddle Board Overstock SUP Explorer 11 tā 33" platuma un stabilās platformas dēļ. Trenējies uz ezera vai aizsargātas līča bez straumes. Pirmajās dažās sesijās valkā glābšanas vesti.
  faq:
    - q: Cik ilgs laiks nepieciešams, lai iemācītosSUP?
      a: Lielākā daļa cilvēku var stāvēt un airēt mierīgā ūdenī 10-15 minūšu laikā. Prasmes apgūšana aizņem 3-5 sesijas. Padziļinātas prasmes prasa mēnešus.
    - q: Kāds ir labākais vēja stāvoklis iesācējiem?
      a: Vējš zem 5 mezgliem (no mierīga līdz vieglam vējam). Vējš virs 10 mezgliem rada viļņus, kas izaicina līdzsvaru. Iesācējiem vajadzētu izvairīties no jūras vēja.
    - q: Vai man vajadzētu valkāt pavadu?
      a: Vienmēr valkājiet pavadu. Saritināta SUP pavada piestiprinās pie potītes vai ikriem un tur dēli līdzi, ja nokrītat. Atklātā ūdenī pavada var glābt jūsu dzīvību.
    - q: Kāda ir visbiežākā iesācēja kļūda?
      a: Skatoties uz dēli. Skaties uz horizontu. Tavs ķermenis seko galvai — skatīšanās uz leju pārvieto svaru uz priekšu un liek dēlim šūpoties.
