  title: 'SUP Enkura gids: Palieciet vietā, makšķerējot vai fotografējot'
  description: Pilnīgs SUP enkura uzstādīšanas ceļvedis — enkuru veidi (sēnes, salokāms, mietiņš), enkura ratiņu uzstādīšana, izvietošanas tehnikas un drošības apsvērumi, lai paliktu pozīcijā.
  definition: SUP Enkurs ir svars, kas piestiprināts pie virves un notur dēli pozīcijā pret vēju un straumi. Izplatītākie veidi ir sēņu enkuri, salokāmi enkuri un novērošanas stabi.
  tldr: Izmantojiet sēņu enkuru (1,5-3 lb) dubļainām vai smilšainām dibena vietām, salokāmu enkuru akmeņainiem dibeniem vai novērošanas stabu seklā ūdenī ar mīkstu dibenu. Enkuram jābūt 1,5-3 lb mierīgiem apstākļiem, 3-5lb vējam un straumei. Vienmēr izmantojiet enkura ratiņus, lai pielāgotu pozīciju un zinātu, kad atlaist.
  problem: Tu atrodi ideālu makšķerēšanas vietu, bet vējš un straume ik pēc dažām minūtēm novirza tevi no pozīcijas. Bez enkurošanās SUP makšķerēšana un fotografēšana ir nomācoši vingrinājumi pastāvīgai pārvietošanai.
  explanation: Enkurs darbojas, velkot pa dibenu, līdz tas aizķeras. Sēņu enkuri iegrimst mīkstā apakšā un nodrošina labu noturību smiltīs un dubļos. Salokāmajiem enkuriem ir spuras, kas iegriežas cietā vai akmeņainā dibenā. Novērošanas stabi darbojas seklā ūdenī, spiežot tieši dibenā.
  solution: Uzstādiet enkura ratiņu sistēmu (virvi ar slīdošu gredzenu vienā dēļa pusē), lai pielāgotu enkura stiprinājuma punktu. Piesieniet 50-75 pēdu virvi pie enkura. Izvietojiet pret vēju vai pret strāvu no vēlamās pozīcijas. Izmantojiet ātrās atbrīvošanas sistēmu, lai ārkārtas situācijās atvienotos. Nekad neenkurojiet stiprā straumē vai vietās, kur enkuru nav viegli atgūt.
  recommendation: 3 mārciņu salokāms enkurs ar 50 pēdu virvi der lielākajai daļai SUP makšķerēšanas apstākļu. Pievienojiet enkura ratiņu sistēmu, izmantojot D gredzenus uz sava Paddle Board Overstock SUP Explorer 11.
  faq:
    - q: Kāda izmēra enkuru man vajagSUP?
      a: 1,5–3 mārciņas mierīgiem ezeriem un lēnām upēm. 3–5 mārciņas piekrastes zonās ar vēju vai straumi. Pārmērīgi lielus enkurus ir grūti izcelt.
    - q: Cik daudz enkura auklas man vajag?
      a: 5:1 tēmēklis (5 pēdas auklas uz katru 1 pēdu dziļuma) ir standarts. 10 pēdu dziļumā izmanto 50 pēdu auklu.
    - q: Vai enkurošana ir bīstama ?SUP
      a: Tikai tad, ja enkurojies straumē vai vējā tik stipri, ka dēlis apgāzīsies. Vienmēr izmanto ātrās atbrīvošanas sistēmu, ko var uzreiz atvienot.
    - q: Vai es varu noenkuroties jebkurā ūdenī?
      a: Pārbaudiet vietējos noteikumus. Dažās vietās enkurošanās ir ierobežota, lai aizsargātu jūraszāles vai jūras dzīvotnes. Nekad neenkurojieties uz koraļļu rifiem.
