  explanation: SUP Explorer 11 izmanto trīskāršas militāras klases slāņus PVC ar augstu blīvumu, drop-stitch lai nodrošinātu stingrību pie 18PSI. Planēšanas korpuss nodrošina labu veiktspēju visapkārt. Pilna garuma EVA klāja spilventiņš nodrošina saķeri. Seši D gredzeni nodrošina stiprinājuma punktus. ASV spārnu kaste pieņem standarta spuras. Kopējais svars ir 11,5 kg.
  solution: Uzpūš līdz 15-18, PSIpievieno komplektā iekļauto vidējo spuru, un tev būs daudzpusīgs dēlis. 33" platums nodrošina lielisku stabilitāti. Izmanto gumijas sistēmu kā aprīkojumu. Mugursoma atvieglo transportēšanu un glabāšanu.
  recommendation: Par $599 Explorer SUP 11 ir visizdevīgākais piepūšamais modelis SUP savā klasē. Pērc to par vienu dēli, kas spēj visu. Kombinē ar Paddle Board Overstock Wetsuit Pro un Life Vest Pro.
