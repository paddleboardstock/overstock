- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Neoprēna tērpa remonts: Labojiet plīsumus, šuves un rāvējslēdzējus pašam'
  description: Pašdarināts neoprēna tērpa remonta ceļvedis neoprēna plīsumiem, šuvju atdalīšanai, rāvējslēdzēja iestrēgumiem un sadalītiem ceļgalu sargiem. Soli pa solim instrukcijas, izmantojot neoprēna cementu.
  definition: Neoprēna tērpa remonts ietver bojātās vietas tīrīšanu un raupjumu, neoprēna cementa uzklāšanu un sacietēšanu zem spiediena, lai atjaunotu ūdensnecaurlaidību un elastību.
  tldr: 'Mazie plīsumi zem 1": uzklājiet neoprēna cementu abās pusēs, gaidiet 10-15 minūtes, līdz kļūst lipīgi, spiediet stingri, sacietējiet zem svara 12 stundas. Lielākiem plīsumiem nepieciešams neoprēna plāksteris. Rāvējslēdzēja problēmas: vispirms ieeļļojiet, tad pārbaudiet, vai nav auduma iesprūžu.'
  problem: Jūsu hidrotērpam ir neliels plīsums, šuve, kas atdalās, vai rāvējslēdzējs, kas pielīp. Bez paštaisītas remonta jūs maksājat 150 USD+ par nomaiņu, kad remonts maksā 5 USD.
  explanation: Neoprēna cements darbojas, mīkstinot neoprēna virsmu, radot ķīmisku saiti, kad šķīdinātājs iztvaiko. Cementu jāuzklāj uz abām virsmām, lai tas kļūtu lipīgs pirms savienošanas. Plīsumu gadījumā malas jāizlīdzina precīzi. Rāvējslēdzēja problēmas bieži ir sāls korozija vai audums, kas iestrēdzis zobos.
  solution: 'Plīsumiem: nomazgā ar spirtu, viegli noslīpē, uzklāj plānu cementa kārtu uz abām malām, gaidi, līdz kļūst lipīga, perfekti saspied kopā, uzklāj svaru, sacietē 12-24 stundas. Plāksteriem: nogriez plāksteri 1" lielāku par plīsumu, uzklāj cementu abām, sprauž. Rāvējslēdzējam: noskalo, uzklāj rāvējslēdzēja vasku, strādā saudzīgi.'
  recommendation: Turiet Paddle Board Overstock neoprēna tērpa remonta komplektu savā ekipējuma somā. Lieliem remontiem vai šuvju bojājumiem kritiskos punktos ieteicams profesionāls remonts.
  faq:
    - q: Vai es varu izmantot superlīmi uz neoprēna tērpa?
      a: Nē — superlīme žūst cieta un trausla. Neoprēna tērpa remontam izmanto tikai neoprēna cementu vai aquaseal.
    - q: Cik ilgi ilgst neoprēna cementa remonts?
      a: Pareizi veikts remonts bieži ir izturīgāks par oriģinālo neoprēnu un kalpo visu tērpa atlikušo mūžu.
    - q: Vai es varu salabot rāvējslēdzēju, kas ir pilnībā atdalījies?
      a: Ja sliede ir atdalījusies no neoprēna, pielīmējiet ar kontaktlīmi. Ja zobi ir bojāti, profesionāli nomainiet rāvējslēdzēju.
    - q: Kā salabot neoprēna tērpa noplūdi šuvē?
      a: Uzklājiet plānu Aquaseal kārtiņu gar noplūdes iekšpusi un ļaujiet sacietēt 24 stundas.
