      a: Jā. 75 litru tilpums un 32 collu platums padara to ļoti stabilu mācībām. Pieredzējuši sērfotāji to novērtēs arī kā ceļojumu vai mazo viļņu dēli. Tas patiešām aptver iesācēju un vidēja līmeņa prasmes.
