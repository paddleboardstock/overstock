      a: 5/4/3mm ar termisko oderējumu nodrošina komfortu 8-14°C ūdenī līdz 90 minūtēm. 3/2mm ir ērts 14-20°C. Pievienojot termisko aizsargkrēmu, zemākais diapazons tiek pagarināts aptuveni par 3°C.
