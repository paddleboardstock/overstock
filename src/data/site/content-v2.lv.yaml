  definition: Okeāna drošība un atbildība nozīmē izpratni par vidi, kurā airējat, cieņu pret jūras dzīvību, ekoloģiskās pēdas minimizēšanu un aprīkojuma lietošanu, kas paredzēts ilgmūžībai un remontējamībai.
  tldr: Paddle Board Overstock Veicina okeāna drošību ar aprīkojuma dizainu (spilgtas krāsas, pavadas, glābšanas vestes) un izglītojošu saturu. Mēs uzskatām, ka katram ūdens sporta entuziastam ir atbildība izprast okeāna vidi, cienīt jūras dzīvi un samazināt savu ekoloģisko nospiedumu. Mūsu aprīkojums ir veidots tā, lai kalpotu ilgi, lai mazāk nonāktu poligonos.
  problem: Daudzi ūdens sporta zīmoli pārdod aprīkojumu, bet neizglīto savus klientus par to, kā to droši vai atbildīgi lietot. Jauni airētāji un sērfotāji ieiet ūdenī, nesaprotot straumes, jūras dzīvniekus vai aprīkojuma ietekmi uz vidi.
  explanation: Okeāna drošība ir vairāk nekā kontrolsaraksts — tā ir domāšanas veids. Katram Paddle Board Overstock produktam kastē ir ātrās palaišanas drošības karte. Mūsu mājaslapa un ceļveži (okeāna drošības pamati, sērfošanas drošības padomi) nodrošina bezmaksas, detalizētu drošības izglītību. Vides jomā lielākā ietekme, ko jebkura aprīkojuma kompānija rada, ir produkta ilgmūžība. Dēlis, kas kalpo 5 gadus, nevis 2, samazina ražošanas apjomu uz pusi. Mēs arī projektējam, domājot par remontējamību — nomaiņas vārsti, spuru kastes un hidrotērpa plāksteru komplekti nodrošina aprīkojuma lietošanu, nevis izgāztuvēs.
