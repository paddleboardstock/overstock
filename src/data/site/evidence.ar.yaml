badge: Proof & Quality
heading: دليل
description: قصص ذات جودة حقيقية، وبيانات اختبار، وصور للمصنع تُظهر كيف يتم شحن كل لوحة تصفية بجودة تجزئة.
case_studies:
  - id: clearance-quality-check
    client: مخزون التخفيضات، فحص الجودة لمستوى البيع بالتجزئة
    product: تم إعادة فحص كل لوحة فائضة
    industry: مراقبة الجودة
    challenge: تأتي الألواح فائضة المخزون والتصفية من دفعات الإنتاج الزائدة، لذا يسأل المشترون بحق ما إذا كان اللوح المخفض يمر بنفس الاختبارات مثل اللوح بسعره الكامل.
    solution: يعود كل مجلس تصفية إلى خط مراقبة الجودة. يتم اختبار كل غرفة بالضغط مع الاحتفاظ بالضغط لمدة 24-48 ساعة عند 1.25 ضعف الضغط المقنن، يتم فحص كل شحنة صادرة للكشف عن العيوب، ويتم التحقق من ملحقات المعدات للتأكد من اكتمالها قبل التعبئة.
    result: معدل خالٍ من العيوب بنسبة 99.3٪ في الشحنات الصادرة خلال الإثني عشر شهرًا الماضية — نفس المعيار ينطبق على المخزون المخصص للتخليص والتجزئة.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - اختبار الضغط
      - خالي من العيوب
      - موافقة مراقبة الجودة
    outcome_metrics:
      - label: معدل الخلو من العيوب
        value: 99.3%
      - label: تغطية اختبار الضغط
        value: 100%
      - label: مدة الانتظار
        value: 24-48h
  - id: pressure-test-regime
    client: الاحتفاظ بالضغط لمدة 24-48 ساعة
    product: كل غرفة، ضغط مقيم 1.25x
    industry: اختبار المنتج
    challenge: لوح SUP يعيش أو يموت بناءً على نواته drop-stitch وخياطاته، وفحص التضخم السريع في نهاية الخط لا يكفي لاكتشاف التسريبات البطيئة أو اللحامات الضعيفة.
    solution: يتم نفخ كل لوح إلى 1.25 ضعف ضغطه المصنف ويُحفظ لمدة 24-48 ساعة، مع ضرورة بقاء انخفاض الضغط تحت 5%. يتم فحص الصمامات، وحلقات D، والخياطة، والطفو مع عدم التسامح مع أي عيوب تتعلق بالسلامة.
    result: 100٪ من الإنتاج يمر بهذا النظام قبل التعبئة — لا اختصارات في أخذ العينات، ولا استثناءات.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - ضغط 1.25x
      - صفر عيوب في السلامة
    outcome_metrics:
      - label: ضغط الاختبار
        value: 1.25x
      - label: أقصى هبوط في الضغط
        value: <5%
      - label: الوحدات المختبرة
        value: 100%
  - id: warranty-claims-support
    client: ضمان يُجيب
    product: تغطية لمدة سنتين على لوحات SUP وإكسسواراتها
    industry: خدمات ما بعد البيع
    challenge: شراء المنتجات المخفضة مباشرة من المصنع يثير سؤالاً عادلاً — إذا حدث خطأ بعد عدة أشهر، من يتعامل معه؟
    solution: كل لوحة تأتي مع ضمان لمدة سنتين يغطي لوحات SUP، وخيوط drop-stitch، وصمامات النفخ، والاكسسوارات. تتم معالجة المطالبات مباشرة من قبل فريقنا — أرسل الصور أو مقطع فيديو قصير وسنتولى الأمور من هناك.
    result: يتم مراجعة مطالبات الضمان وحلها من قبل نفس الفريق الذي يفحص الإنتاج — مباشرة، دون أي طرف وسيط.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - ضمان لمدة سنتين
      - دعم مباشر
      - تغطية الاكسسوارات
    outcome_metrics:
      - label: ضمان
        value: سنتان
      - label: التغطية
        value: لوحة + الاكسسوارات
      - label: الدعم
        value: الفريق المباشر
