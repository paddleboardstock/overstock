badge: Proof & Quality
heading: Bewijs
description: Echte kwaliteitsverhalen, testgegevens en fabrieksfoto's die laten zien hoe elk uitverkoopbord wordt verzonden met kwaliteit gelijk aan die van de detailhandel.
case_studies:
  - id: clearance-quality-check
    client: Uitverkoopvoorraad, Retail-kwaliteit QC
    product: Elk Overstock-bord, opnieuw geïnspecteerd
    industry: Kwaliteitscontrole
    challenge: Overstock- en uitverkoopborden komen uit overtollige productieruns, dus kopers vragen terecht of een afgeprijsd bord dezelfde controles doorstaat als een bord tegen volle prijs.
    solution: Elke vrijgavebord gaat opnieuw de QC-lijn in. Elke kamer wordt drukgetest met een 24-48 uur durende pauze bij 1,25x de nominale druk, elke uitgaande zending wordt geïnspecteerd op defecten, en accessoires worden gecontroleerd op volledigheid voordat ze worden verpakt.
    result: 99,3% defectvrije voorraad bij uitgaande zendingen gedurende de afgelopen 12 maanden — dezelfde standaard geldt voor clearance- en winkelvoorraad.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Druk testen
      - Geen defecten
      - Douane QC
    outcome_metrics:
      - label: Defectvrije Tarief
        value: 99.3%
      - label: Druktestdekking
        value: 100%
      - label: Houdduur
        value: 24-48h
  - id: pressure-test-regime
    client: De 24-48-Uur Drukvasthouding
    product: Elke Kamer, 1,25x Beoordeelde Druk
    industry: Producttesten
    challenge: Een SUP-board leeft of sterft bij zijn drop-stitch kern en naden, en een snelle inflatiecontrole aan het einde van de lijn is niet genoeg om langzame lekken of zwakke lassen te detecteren.
    solution: Elke plank wordt opgeblazen tot 1,25 keer de opgegeven druk en gedurende 24-48 uur vastgehouden, waarbij het drukverlies onder 5% moet blijven. Kleppen, D-ringen, naden en drijfvermogen worden gecontroleerd met nul tolerantie voor veiligheidsgebreken.
    result: 100% van de productie doorloopt dit regime voordat het wordt verpakt — geen steekproefafkorting, geen uitzonderingen.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - 1,25x Druk
      - Nul veiligheidsdefecten
    outcome_metrics:
      - label: Testdruk
        value: 1.25x
      - label: Maximale drukval
        value: <5%
      - label: Geteste eenheden
        value: 100%
  - id: warranty-claims-support
    client: Een garantie die antwoorden geeft
    product: 2 jaar garantie op SUP borden en accessoires
    industry: Service na verkoop
    challenge: Het direct kopen van uitverkoop bij de fabriek roept een eerlijke vraag op — als er maanden later iets misgaat, wie handelt dit af?
    solution: Elke plank wordt geleverd met een garantie van 2 jaar die SUP planken, drop-stitch naden, inflatieventielen en accessoires dekt. Claims gaan direct naar ons team — stuur foto’s of een korte video en wij regelen de rest.
    result: Garanties worden beoordeeld en afgehandeld door hetzelfde team dat de productie inspecteert — direct, zonder tussenpersonen.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - 2-jarig garantie
      - Directe ondersteuning
      - Accessoires gedekt
    outcome_metrics:
      - label: Garantie
        value: 2 jaar
      - label: Dekking
        value: Plank + Accessoires
      - label: Ondersteuning
        value: Direct team
