origin:
  tagline: 'Vårt ursprung'
  heading: "Byggt på vattnet,<br />\n<span class=\"text-sky-600\">drivet av syfte</span>"
  paragraphs:
    - 'Paddle Board Overstock började i en kustverkstad med en båt och en orubblig övertygelse: marina produkter bör konstrueras som om de spelar roll — för det gör de.'
    - 'Våra grundare, två båtkonstruktörer, såg en bransch där hörn skars av, material nedgraderades och säkerhet behandlades som en bock i en ruta. De byggde det första Paddle Board Overstock-skrovet inte för vinst, utan för att bevisa att prisvärd marin utrustning också kan vara pålitlig på riktigt.'
    - 'Det första skrovet är fortfarande i bruk idag. Den principen har aldrig förändrats.'
    - 'Vi är inte den största tillverkaren. Vi gör inte de billigaste produkterna. Men varje skrov som lämnar vår verkstad går genom samma händer som grundade företaget — och möter samma standard som det första skrovet satte.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: 'Paddle Board Overstocks kustverkstad'

philosophy:
  tagline: 'Vår filosofi'
  heading: 'Förankrade i havet'
  description: 'Havet är inte vår arbetsplats. Det är vår lärare. Varje designbeslut börjar med att förstå hur vatten beter sig, hur förhållanden förändras och hur utrustning måste reagera.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respektera vattnet'
      description: 'Vatten är oförutsägbart. Våra produkter är konstruerade för de sämsta förhållandena, inte de bästa. Om ett skrov klarar en kraftig motström klarar det också en sjö. Om en flytväst fungerar offshore är den överdimensionerad för en flod — och det är avsiktligt.'
    - emoji: "\U0001F527"
      title: 'Byggt för att hålla, inte bytas ut'
      description: 'Den mest hållbara produkten är den som inte behöver bytas ut. Marin PVC, Hypalon och drop-stitch-konstruktion väljs för livslängd. Vi skickar fortfarande reservdelar till skrov vi byggde för ett decennium sedan.'
    - emoji: "\U0001F3C6"
      title: 'Tillgängligt genom design'
      description: 'Vattensport borde inte vara en lyx. Vi konstruerar produkter som levererar professionell prestanda till ett pris som är rimligt för familjer, guider och mindre arrangörer — inte bara kommersiella flottor.'

design:
  tagline: 'Designfilosofi'
  heading: "Konstruerat för ytterkanten<br />\n<span class=\"text-sky-600\">av förhållanden</span>"
  paragraphs:
    - 'Varje Paddle Board Overstock-produkt börjar med en fråga: <em>vad är det värsta den kommer att möta?</em> Vi designar från kanten inåt, inte från mitten och ut.'
    - 'Våra drop-stitch-kärnor är godkända för 15 PSI — inte för att 12 PSI är otillräckligt för en sjö, utan för att en 15 PSI-bräda hanterar en plötslig dyning utan att flexa. Våra Hypalon-rör är specificerade för kommersiell UV-resistens — inte för att varje kund paddlar i tropikerna, utan för att UV-nedbrytning är den främsta orsaken till för tidiga haverier.'
    - 'Vi designar inte efter ett pris. Vi designar till ett brottmått — och bygger sedan väl över det.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: 'Paddle Board Overstocks design och ingenjörskonst'
  stats:
    - value: '15'
      label: 'Kärnans PSI-<br />klassning'
    - value: '1,500+'
      label: 'UV-timmar<br />testade'
    - value: '10 år'
      label: 'skrovets<br />livslängd'
