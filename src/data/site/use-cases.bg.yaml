cases:
  - id: beginner
    title: Начинаещи във водните спортове
    desc: Стабилни SUP дъски и каяци за начинаещи.
    scenario: Семейство, което посещава езеро за уикенда, иска да опита гребане на дъска. Те се нуждаят от стабилно оборудване, лесно за пускане на вода, с ясни указания за безопасност.
    solution: SUP Explorer 11 осигурява стабилност на широко тяло за начинаещи. Life Vest Classic гарантира CE-сертифицирана плаваемост. Dual-Action Pump надува и двете дъски за по-малко от 10 минути.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Приключения на открито
    desc: Преносими каяци и лодки за реки, езера и крайбрежни пътувания.
    scenario: Любител на приключения на открито планира седмично пътуване по река и се нуждае от лодка, която се събира малка, надува се в лагера и се справя с различни течения.
    solution: Kayak Lite се побира в раница и се надува за по-малко от 4 минути. Неговата drop-stitch конструкция се справя с езера, бавни реки и крайбрежно гребане.
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: Професионални операции
    desc: Търговско оборудване RIBs за туроператори и аварийни дейности.
    scenario: Крайбрежен туроператор се нуждае от флот от здрави лодки, които извършват ежедневни пътувания при различни морски условия и отговарят на търговските изисквания за безопасност.
    solution: RIB 330 и RIB 450 Patrol използват фибростъклени корпуси с дълбоко V-образно дъно и Hypalon тръби за издръжливост във всякакво време. Множество единици могат да се използват с постоянна производителност.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: Семейни развлечения
    desc: Просторни лодки за дневни излети, риболов и водни спортове.
    scenario: Семейство от четирима души иска стабилна лодка за уикенд излети на езеро, риболов и теглене на тюб за децата.
    solution: AirDeck 360 побира до петима с усилен въздушен под. Тя се надува на мястото на стартиране, съхранява се в колата и се справя както с спокойни езера, така и със защитени крайбрежни води.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
