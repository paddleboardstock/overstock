cases:
  - id: beginner
    title: Начинаещи в гребането
    desc: Стабилни надуваеми SUP бордове за начинаещи гребци.
    scenario: Семейство, което посещава езеро за уикенда, иска да опита гребане на дъска. Те се нуждаят от стабилно оборудване, лесно за пускане на вода, с ясни указания за безопасност.
    solution: SUP Explorer 11 осигурява стабилност с широк корпус за начинаещи. Life Vest Classic гарантира CE-сертифицирано плаване. Oars & Pump Set надува дъската за по-малко от 10 минути.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Обиколки и изследвания
    desc: Надуваеми SUP бордове за дълги разстояния за езера, реки и крайбрежни пътувания.
    scenario: Любител на природата планира седмична разходка с гребло и се нуждае от борд, който се сгъва малко, надува се на лагера и се движи право във водата.
    solution: Ocean Voyager Series се плъзга ефективно с туристическа форма и държи курса при вятър и вълни. Неговата drop-stitch конструкция се надува до 15 PSI за твърдост на дъската.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Йога и фитнес
    desc: Допълнително широки, стабилни платформи за йога, фитнес и релаксация.
    scenario: Йога практикуващ иска плаващо студио за утринни сесии на спокойна вода, с достатъчно място за всяка поза.
    solution: Flowing Lotus Series включва пълен под на палубата и широк бим за безтрептящи пози. Тя също така служи като стабилна платформа за леки фитнес упражнения.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Семейни развлечения
    desc: Комплектни SUP пакети за уикенд на езерото и почивки.
    scenario: Семейство от четирима иска стабилни бордове за уикенд разходки на езерото и плажни почивки — екипировка, която се събира в колата и се надува за минути.
    solution: Tropical Breeze Series е стабилна универсална дъска, която цялото семейство може да използва, докато Medusa Glow Series е по-лека и по-къса за деца. И двете се събират в раници за лесно пътуване.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
