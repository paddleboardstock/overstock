cases:
  - id: beginner
    title: กีฬาทางน้ำสำหรับผู้เริ่มต้น
    desc: บอร์ดและคายัคที่มีความมั่นคงสำหรับผู้ใช้งานครั้งแรก
    scenario: ครอบครัวที่ไปเที่ยวทะเลสาบในสุดสัปดาห์ต้องการลองพายบอร์ด พวกเขาต้องการอุปกรณ์ที่มั่นคง ใช้งานง่าย พร้อมคำแนะนำด้านความปลอดภัยที่ชัดเจน
    solution: Explorer 11 ให้ความมั่นคงของตัวบอร์ดกว้างสำหรับผู้เริ่มต้น ชุดชูชีพ Life Vest Classic รับประกันการลอยตัวที่ได้รับการรับรอง Dual-Action Pump เติมลมบอร์ดทั้งสองในเวลาไม่ถึง 10 นาที
    products:
      - Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: การสำรวจกลางแจ้ง
    desc: คายัคและเรือเล็กแบบพกพาสำหรับแม่น้ำ ทะเลสาบ และชายฝั่ง
    scenario: นักผจญภัยกลางแจ้งวางแผนเดินทางแม่น้ำหนึ่งสัปดาห์และต้องการเรือที่พับเก็บได้ เติมลมที่แคมป์ และทนต่อกระแสน้ำที่แตกต่างกัน
    solution: Kayak Lite พกใส่กระเป๋าเป้และเติมลมในเวลาไม่ถึง 4 นาที โครงสร้างของมันรองรับการพายในทะเลสาบ แม่น้ำสายช้า และชายฝั่ง
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: การปฏิบัติการแบบมืออาชีพ
    desc: อุปกรณ์ระดับเชิงพาณิชย์สำหรับผู้ดำเนินทัวร์และการตอบสนองฉุกเฉิน
    scenario: ผู้ดำเนินการทัวร์ชายฝั่งต้องการเรือแข็งแรงสำหรับการเดินเรือรายวันในสภาพทะเลที่หลากหลาย และเป็นไปตามข้อกำหนดด้านความปลอดภัยเชิงพาณิชย์
    solution: 330 และ 450 Patrol ใช้ตัวเรือไฟเบอร์กลาสดีพ-V พร้อมท่อสำหรับความทนทานทุกสภาพอากาศ หน่วยหลายลำสามารถใช้งานพร้อมกันได้ด้วยประสิทธิภาพที่สม่ำเสมอ
    products:
      - '330'
      - 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: กิจกรรมครอบครัว
    desc: เรือเล็กกว้างสำหรับทริปวันเดียว การตกปลา และกีฬาทางน้ำ
    scenario: ครอบครัวสี่คนต้องการเรือมั่นคงสำหรับไปเที่ยวทะเลสาบในวันหยุดสุดสัปดาห์ ทริปตกปลา และลากท่อยางสำหรับเด็ก
    solution: 360 รองรับผู้โดยสารได้สูงสุดห้าคน มีพื้นบอร์ดเสริมความแข็งแรง สามารถเติมลมที่จุดปล่อยเก็บในรถ และรองรับทั้งทะเลสาบสงบและน้ำชายฝั่งที่ปลอดภัย
    products:
      - '360'
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
