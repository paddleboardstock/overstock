cases:
  - id: beginner
    title: พายเริ่มต้น
    desc: บอร์ดเป่าลมที่มั่นคง SUP สำหรับผู้เริ่มพายครั้งแรก
    scenario: ครอบครัวที่ไปเที่ยวทะเลสาบในสุดสัปดาห์ต้องการลองพายบอร์ด พวกเขาต้องการอุปกรณ์ที่มั่นคง ใช้งานง่าย พร้อมคำแนะนำด้านความปลอดภัยที่ชัดเจน
    solution: SUP Explorer 11 มอบความมั่นคงของลำตัวกว้างสำหรับผู้เริ่มต้น Life Vest Classic รับรองการลอยตัวตามมาตรฐาน CE Oars & Pump Set เติมลมบอร์ดภายในเวลาไม่ถึง 10 นาที
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: ท่องเที่ยว & สำรวจ
    desc: บอร์ดเป่าลมระยะไกล SUP สำหรับทะเลสาบ แม่น้ำ และการเดินทางตามชายฝั่ง
    scenario: นักผจญภัยกลางแจ้งวางแผนการเดินทางพายเรือเป็นเวลาหนึ่งสัปดาห์และต้องการบอร์ดที่พับเก็บได้ง่าย เติมลมที่แคมป์ และแล่นตรงในน้ำเปิด
    solution: Ocean Voyager Series ลื่นไหลอย่างมีประสิทธิภาพด้วยโครงร่างท่องเที่ยวและรักษาทิศทางแม้มีลมและคลื่น โครงสร้าง drop-stitch เติมลมได้ถึง 15 PSI เพื่อความแข็งแรงแบบบอร์ดแข็ง
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP โยคะ & ฟิตเนส
    desc: แพลตฟอร์มกว้างเป็นพิเศษและมั่นคงสำหรับโยคะ ฟิตเนส และการผ่อนคลาย
    scenario: ผู้ฝึกโยคะต้องการสตูดิโอลอยน้ำสำหรับการฝึกช่วงเช้าในน้ำสงบ โดยมีพื้นที่บนดาดฟ้าเพียงพอสำหรับทุกท่า
    solution: Flowing Lotus Series มีแผ่นรองดาดฟ้ายาวเต็มและลำตัวกว้างสำหรับท่าที่ไม่สั่นไหว อีกทั้งยังเป็นแพลตฟอร์มมั่นคงสำหรับการออกกำลังกายเบา ๆ
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: กิจกรรมครอบครัว
    desc: ชุด SUP ครบชุดสำหรับวันพักผ่อนที่ทะเลสาบและวันหยุด
    scenario: ครอบครัวสี่คนต้องการบอร์ดมั่นคงสำหรับวันพักผ่อนที่ทะเลสาบและวันหยุดที่ชายหาด — อุปกรณ์ที่พับเก็บใส่รถและเติมลมในไม่กี่นาที
    solution: Tropical Breeze Series เป็นบอร์ดรอบด้านที่มั่นคงที่ครอบครัวสามารถใช้งานร่วมกันได้ ในขณะที่ Medusa Glow Series น้ำหนักเบาและสั้นกว่าสำหรับเด็ก ทั้งสองพับเก็บใส่กระเป๋าเป้สำหรับการเดินทางที่สะดวก
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
