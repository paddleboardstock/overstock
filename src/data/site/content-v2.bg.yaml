  title: 'Надуваемо SUP съхранение: Правилният начин да съхранявате вашия iSUP'
  description: Правилното надуваемо SUP съхранение предотвратява деламинация, UV повреди, мухъл и течове на клапани. Съвети за зимно съхранение, дългосрочно съхранение и ежедневно съхранение drop-stitch на платки.
  definition: Надуваемото SUP съхранение означава поддържане на дъската в чиста, суха и контролирана температура, далеч от UVекстремни температури и физически повреди.
  tldr: Съхранявайте на хладно, тъмно място под 30°C, далеч от пряка слънчева светлина. За краткосрочен период (1-2 седмици) съхранявайте частично надуто при 8-10 PSIградуса. За дългосрочно съхранение надувайте напълно, навивайте се свободно и сложете в торбата за съхранение. Никога не съхранявайте мокро. Дръжте далеч от гризачи и остри предмети.
  problem: Спускате SUP се и го натъпквате в горещ гараж или влажно мазе. Три месеца по-късно PVC пожълтява, подложката на терасата се лющи и вентилът тече. Неправилното съхранение причинява повече щети от обикновената употреба.
  explanation: Топлината над 50°C кара PVC пластификаторите да мигрират и правят материала твърд и крехък.UV Радиацията разгражда полимерните връзки. Влагата, задържана вътре, създава мухъл. Студът под нулата PVC прави крехък. Точките на натиск от плътно сгъване създават постоянни гънки.
  solution: 'Краткосрочно съхранение: изплакнете, изсушете, надуйте до 10 PSIградуса и съхранявайте на засенчено място. Дългосрочно съхранение: почиствайте старателно, изсушавайте напълно, издухвайте напълно, навивайте с подложката навън, поставете в торба и съхранявайте в хладен сух шкаф. Дръжте далеч от химикали и вредители.'
  recommendation: Използвайте Aquafarer чантата за съхранение — тя блокира UV и предотвратява надраскване. Съхранявайте в климатизирана стая. Добавете десикантен пакет вътре в чантата за влажни условия.
  faq:
    - q: Мога ли да съхранявам надутата SUP си в гаража?
      a: Само ако гаражът е под 30°C и няма пряка слънчева светлина. Повечето гаражи надвишават 40°C през лятото.
    - q: Трябва ли да го SUP съхранявам в чантата?
      a: Да, торбичката предпазва от прах UVи физически повреди. Уверете се, че дъската е напълно суха преди опаковане.
    - q: Може ли замръзването да повреди SUPнадуваема машина?
      a: Да. Температурата под нулата PVC става чуплива и може да се напука при разгъване или надуване. Винаги съхранявайте над 5°C.
    - q: Как да навивам SUP моя за съхранение?
      a: Търкаляйте с подложката на палубата, обърната навън, за да защитите PVCдъното. Избягвайте стегнати гънки. Редувайте позицията на сгъване всеки път.
