  title: 'Ветрови условия SUPза: Как вятърът влияе на греблото ви'
  description: Как скоростта и посоката на вятъра влияят SUP на гребането. Разбиране на офшорния и наземния вятър, четене на прогнози за вятъра, техники за гребане при вятъра и кога да се остане на сушата.
  definition: Ветровите условия SUP определят безопасността. Вятърът от морето (от суша към море) ви отблъсква настрани. Вятърът от сушата (от море към суша) ви тласка към брега. Страничен вятър кара дъската да се извива.
  tldr: 'Максимален безопасен вятър за начинаещи: 10 възела. Средно ниво: 15 възела. Напреднал: 20 възела. Крайбрежният вятър е най-опасен. Първо гребе срещу вятъра. При страничен вятър гребе леко срещу вятъра от дестинацията. Коленичи при силен вятър, за да намалиш профила си.'
  problem: Гребеш при спокойни условия, но 30 минути по-късно вятърът се усили и ти е трудно да се върнеш. Вятърът е най-недооцененият SUP фактор за безопасност.
  explanation: Вятърът SUP влияе повече от всяко друго гребно плавателно средство, защото стоите прави, създавайки ефект на платно. Вятърът от 10 възела създава много повече съпротивление при стоящ гребец в сравнение със седнал каякар. Вятърът в открито море ви отблъсква от безопасността. Страничният вятър кара носа да се извива.
  solution: 'Проверете скоростта и посоката на вятъра преди да гребете. Използвайте скалата на Бофорт: Сила 3 (7-10 възела) за начинаещи, Сила 4 (11-16) за междинни скорости. Първо гребете срещу вятъра. Ако ви хване офшорен вятър, гребете под ъгъл 45 градуса спрямо вятъра. Коленичете при силен вятър.'
  recommendation: Използвайте приложение за прогноза на вятъра (Windy, Windfinder) преди всяка сесия. Aquafarer SUP Tour 12 се справя по-добре с вятър от по-широките дъски. При ветровити условия използвайте по-къси гребни движения и по-висок каданс.
  faq:
    - q: За коя посока на вятъра е SUPнай-безопасна?
      a: Наземният вятър (духа към сушата) е най-безопасен — той те отблъсква назад. Вятърът в открито море е най-опасен.
    - q: Как да греба при страничен вятър?
      a: Греби повече от страната на нагоре по вятъра, за да противодействаш на дрейфа. Наклони дъската срещу вятъра от дестинацията си. По-дълбок централен плавник помага.
    - q: Мога ли да греба при вятър от 20 възела?
      a: Само ако имате опит в защитени води. Начинаещите не трябва да гребат с над 10 възела.
    - q: Как влияят поривите на SUPвятъра?
      a: Поривите предизвикват внезапни затруднения с баланса. При поривни пориви спуснете стойката си и бъдете готови за внезапни смени.
