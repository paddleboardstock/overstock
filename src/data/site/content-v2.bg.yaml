  title: 'SUP Екскурзовод: Изберете правилната дъска за гребане на дълги разстояния'
  description: SUPs Турингите са по-дълги, по-тесни и създадени за скорост и плъзгане. Как да изберете туристическа дъска, необходима екипировка за дълги гребли и техника за ефективно покриване на разстояние.
  definition: Туринг SUP е дълга (12-14'), тясна (30-32') дъска, предназначена за ефективно гребане на разстояние. Характеристиките включват нос с изместване за прорязване на вода, по-дълга водна линия за плъзгане и често система за багаж с бънджи.
  tldr: 'SUPs Турингът поставя приоритет върху скоростта и проследяването пред стабилността. Минимум 12'' дължина за ефективност, 30-32" ширина за баланс между плъзгане и стабилност. Ключови характеристики: изместен нос, прав контур, множество перки. Основно оборудване: PFDкаишка, вода, телефон и бънджи система за екипировка. Техниката се фокусира върху дълги, плавни движения с въртене на торса.'
  problem: Гребането с универсална дъска по време на дълго пътуване те оставя изтощен. Широкият нос хваща чоп, дъската не се движи направо, а вие изразходвате повече енергия за управление, отколкото за плъзгане. Трябва ви дъска, проектирана за разстояние.
  explanation: Туринг SUPs бордовете използват корпус с изместване (заострен нос), който разделя водата, вместо да минава по нея, което значително намалява съпротивлението. По-дългата водна линия увеличава скоростта на корпуса. По-тясната ширина намалява съпротивлението, но изисква по-добър баланс. Туристическите дъски имат по-дълги перки за стабилност в посоката. Надуваемите туристически дъски се нуждаят от PSI по-висока (18-20), за да се поддържа твърдостта и да се предотврати огъване, което губи енергия.
  solution: 'Изберете туристическа дъска с дължина поне 12 фута с нос с изместване. Ширина: 30" за опитни гребци, 31-32" за междинни. Търсете централна кутия за перки плюс странични захапки за стабилност. Надувайте до максимална стойностPSI. Оборудвайте се с бънджи карго привързване, PFDсвирка и телефон във водоустойчив калъф.'
  recommendation: Aquafarer SUP Tour 12 с размери 12' x 31" x 6" е идеален надуваем двигател за туринг. Носът му с изместване прави ефективно рязане, а бънджи системата държи оборудването за еднодневни екскурзии. Комбинирайте се с Aquafarer карбоновата лопатка за ефективно гребане на дълги разстояния.
  faq:
    - q: Мога ли да използвам универсална дъска за туринг?
      a: За кратки обиколки под 5 км – да. За по-дълги разстояния по-широкият нос и по-късата водна линия ще ви уморят по-бързо.
    - q: Каква дължина на туринг SUP ми е необходима?
      a: 12' е минимумът за ефективност в туринг. 12'6" е добра междинна дължина. 14' е за състезания и напреднал туринг.
    - q: Представят ли се надуваемите SUPs турнета толкова добре, колкото твърдите дъски?
      a: Съвременните drop-stitch надуваеми на високи PSI позиции се представят подобно на твърдите дъски за туринг. Лекото огъване всъщност може да е по-удобно при чоп.
    - q: Кое гребло е най-подходящо за туринг?
      a: Леко гребло от въглерод или фибростъкло с по-голямо острие (100-110 кв. инча) за мощност. Регулируемото гребло позволява превключване между туринг и сърф.
