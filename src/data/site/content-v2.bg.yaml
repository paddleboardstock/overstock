  title: Ръководство за сърф в студена вода (Сърфиране през зимата без страдания)
  description: 'Не позволявайте студената вода да сложи край на сезона ви. Пълна разбивка на екипировката за студена вода: дебелина на неопреновия костюм, избор на ботуши и ръкавици, пасване на качулката и аксесоарите, които правят зимните сесии наистина приятни.'
  definition: Сърфирането в студена вода изисква пълен неопренов костюм (5/4/3 мм или по-дебел), ботуши, ръкавици и качулка. Под 12°C всяка точка на контакт със студена вода се нуждае от защита, за да се предотврати изтръпване, хипотермия и рискове за безопасността.
  tldr: Сърфирането в студена вода изисква пълен неопренов костюм с качулка 5/4/3мм или 6/5/4мм, ботуши 5мм, ръкавици 3 мм и качулка. Качеството на шевовете е по-важно от марката — търсете залепени и сляпо шевени (GBS) шевове. Костюмът с термална подплата добавя значителна топлина без допълнителна дебелина. Винаги носете резервни термопластове и термос за възстановяване след сесията.
  problem: Искаш да сърфираш през зимата, но студената вода изтръпва краката ти след 15 минути, ръцете ти не могат да хванат дъската, а костюмът ти изпуска ледена вода по гърба всеки път, когато гребеш. Без правилната екипировка, сесиите в студена вода са кратки и мъчителни.
  explanation: 'Сърфирането в студена вода (под 12°C) изисква повече от просто дебел неопренов костюм. Всяка точка на контакт със студа се нуждае от защита: ботушите предотвратяват изтръпване на краката и предпазват от порязвания от риф, ръкавиците поддържат функцията на ръцете при гребане, а качулката предотвратява най-голямата загуба на топлина (главата ви излъчва 30 процента от телесната топлина). Дебелината на неопреновия костюм трябва да се съответства на най-студения месец, а не със средната. Освен костюма, аксесоари като ботуши с запечатани подметки и ръкавици с предварително извити пръсти подобряват комфорта и издръжливостта.'
  solution: 'Сглобете комплект за студена вода в следния ред: 5/4/3mm или 6/5/4mm пълен костюм с GBS шевове и цип на гърдите, 5мм ботуши с гумени подметки, 3 мм ръкавици (ръкавиците са по-топли от пръстите) и 3 мм качулка, която се прибира под яката на костюма. Добавете халат за преобличане за достойнство и топлина на паркинга.'
  recommendation: Aquafarer Неопрен Про в 5/4/3мм с интегрирана термична подплата поддържа повечето студени водни условия до 8°C. Комбинирайте го с Aquafarer 5 мм ботуши и 3 мм ръкавици за пълна студена вода. Под 8°C преминете към 6/5/4 мм костюм с качулка.
  faq:
    - q: Наистина ли ми трябва качулка?
      a: Да. Губиш 30 процента от телесната си топлина през главата. Качулката предотвратява изпламването и поддържа врата топъл. 3 мм качулка добавя повече топлина от увеличаването на дебелината на торса от 5 мм на 6 мм.
    - q: Каква дебелина ботуши ми трябват?
      a: За вода при 8-12°C използвайте ботуши с диаметър 5 мм. За 12-16 °C са достатъчни ботуши с диаметър 3 мм. Под 8 °C обмисли ботуши с диаметър 7 мм или добавяне на неопренови чорапи под ботуши с диаметър 5 мм.
    - q: Как да спра мокрия ми костюм да се изпуска?
      a: Промиването се случва, когато вода навлезе в костюма по врата, китките или глезените. Дизайнът с цип за вход на гърдите значително намалява изплакването на гърба. Велкро уплътненията на врата и глезените също помагат, но най-доброто решение е добре прилепнал костюм с GBS шевове.
    - q: Мога ли да използвам костюм 3 мм в студена вода с допълнителни слоеве?
      a: Костюм 3 мм с неопренов елек отдолу може да увеличи обхвата ви с около 3-4°C, но не е заместител на подходящ костюм 5/4/3 мм или 5 мм. Пластовете работят най-добре за кратки сесии при гранични условия.
