  title: 'SUP Ръководство за размери: Обяснение на дължина, ширина и обем'
  description: Намерете правилния SUP размер според теглото си, нивото на умения и стила на гребане. Дължината определя проследяването, ширината определя стабилността, а обемът определя капацитета на тежестта.
  definition: SUP Размерът се определя от дължината (скорост и плъзгане), ширината (първичната стабилност), дебелината (вторична стабилност и обем) и обема в литри (общ капацитет на теглото).
  tldr: 'Общо SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Туринг: 12''-14'' x 30"-32" (280-350L). Surf: 8''-10'' x 30"-32" (140-220L). Начинаещите се нуждаят от ширина над 32" и обем над телесното тегло с 60-80L. Теглото ви в kg плюс 60L е минималната цел за стабилност.'
  problem: Всяка SUP марка изброява дъските в футове, инчове и литри, но без да знаете как тези измервания се отразяват на усещането в реалния свят, рискувате да купите дъска, която е наклонена, бавна или не може да издържи теглото ви.
  explanation: 'Дължината определя колко бързо гребе дъската и колко добре се движи по права линия. По-дългите дъски (12''+) се плъзгат между движенията и държат линия. По-късите дъски (под 10'') се завъртат лесно, но изискват по-чести превключвания на греблата. Ширината определя основната стабилност — стабилност в изправено положение. 30" дъска се усеща като на върха на начинаещи; 34" се усеща като док. Дебелината определя обема — по-дебелата дъска плава по-високо, но улавя повече вятър. Обемът в литри е най-добрият показател: натоварената дъска (ти плюс екипировката) трябва да потъва с 2-4 инча в покой.'
  solution: 'Сравнете размерите на дъската с три фактора: теглото ви (определя минималния обем), основната ви дейност (определя дължината) и нивото на умения (определя ширината). За начинаещи умножете теглото в кг по 2.2, за да получите минимални литри. За междинни умножете по 1.8. За напреднали умножете по 1.4.'
  recommendation: Aquafarer SUP Explorer 11 с размери 11' x 33" x 6" и 260L подхожда на повечето колоездачи до 100 кг за общо гребане. Ъпгрейднете до SUP Tour 12 с 12' x 31" за по-добра туристическа скорост и плъзгане.
  faq:
    - q: Какъв SUP размер ми трябва за теглото ми?
      a: 'За колоездачи под 70 кг: 10-11'' x 32" (220-260L). За 70-90 кг: 11-12'' x 33" (260-300L). За 90-110 кг: 11-12'' x 34" (300-350L). За над 110 кг: 12'' x 34-36" (350L+).'
    - q: По-дълъг ли SUP е по-бърз?
      a: Да. По-дългите дъски имат по-добро съотношение дължина към ширина, което намалява съпротивлението. 14' туринг SUP е значително по-бърз от 11' универсален борд при същото усилие при гребане.
    - q: Каква SUP ширина е стабилна за начинаещи?
      a: 33-34 инча е идеалната среда за начинаещи до 90 кг. Под 32" изисква добър баланс. Над 34" е много стабилно, но по-бавно и по-трудно се гребе на вятър.
    - q: Мога ли да използвам универсална дъска за туринг?
      a: Да, за кратки обиколки под 10 км. За по-дълги разстояния специализирана туристическа дъска проследява по-добре и покрива разстоянието по-ефективно.
