  title: 'Ремонт на неопренови костюми: Оправете разкъсванията, шевовете и циповете сами'
  description: Ръководство за ремонт на неопренови костюми за неопреново разкъсване, разделяне на шевове, заклещване на ципове и разцепени наколенки. Стъпка по стъпка инструкции с използване на неопренов цимент.
  definition: Ремонтът на неопренови костюми включва почистване и груба обработка на повредената зона, нанасяне на неопренов цимент и втвърдяване под налягане за възстановяване на водонепроницаемостта и гъвкавостта.
  tldr: 'Малки разкъсвания под 1 инч: нанесете неопренов цимент и от двете страни, изчакайте 10-15 минути, докато стане лепкава, натиснете здраво, втвърдете под тежест 12 часа. По-големите разкъсвания изискват неопренов пластир. Проблеми с ципа: първо смазване, после проверяване на заклещване в плата.'
  problem: Неопреновият ви костюм има малка скъсване, шев, който се разделя, или цип, който залепва. Без ремонт сам плащате $+150 за подмяна, когато ремонтът струва $5.
  explanation: Неопреновият цимент работи чрез омекотяване на неопреновата повърхност, създавайки химическа връзка при изпаряване на разтворителя. Циментът трябва да се нанася и на двете повърхности и да стане лепкав преди свързване. За разкъсвания краищата трябва да се подравняват прецизно. Проблемите с ципа често са свързани със солна корозия или заклещена тъкан в зъбите.
  solution: 'За разкъсвания: почистете с алкохол, леко шлайфате, нанесете тънък слой цимент и по двата ръба, изчакайте да стане лепкава, притиснете перфектно, приложите тежест, втвърдете 12-24 часа. За пластирите: изрежете петно с 1" по-голямо от разкъсването, поставете цимент и на двата, защипете. За цип: изплакнете, нанесете восък за цип, работете внимателно.'
  recommendation: Дръжте Aquafarer комплект за ремонт на неопренови костюми в чантата си. При големи ремонти или повреди на шевовете в критични моменти се препоръчва професионален ремонт.
  faq:
    - q: Мога ли да използвам супер лепило върху неопренов костюм?
      a: Не — супер лепилото изсъхва твърдо и чупливо. Използвайте само неопренов цимент или aquaseal за ремонт на неопренови костюми.
    - q: Колко дълго трае ремонтът на неопренов цимент?
      a: Правилно извършеният ремонт често е по-здрав от оригиналния неопрен и издържа през целия живот на костюма.
    - q: Мога ли да поправя цип, който е напълно отделен?
      a: Ако релсата се е отделила от неопрен, залепете отново с контактен цимент. Ако зъбите са повредени, сменете ципа професионално.
    - q: Как да оправя неопренов костюм, който тече по шева?
      a: Нанесете тънка капка аквасил по вътрешната страна на течащия шев и оставете да втвърди 24 часа.
