  title: 'SUP Ръководство за помпа: Ръчни срещу електрически помпи'
  description: Пълно ръководство за SUP помпи — ръчни двукамерни, еднокамерни и електрически помпи. Как да изберете най-добрата помпа според вашите нужди, съвети за поддръжка и техники за надуване.
  definition: SUP Помпата е устройство, използвано за надуване на надуваеми гребни дъски до необходимото налягане (обикновено 15-20PSI). Видовете включват ръчни еднокамерни, ръчни двукамерни и електрически помпи.
  tldr: Двукамерните ръчни помпи са стандарт за качествени iSUP-и — те се надуват два пъти по-бързо от еднокамерните. Електрическите помпи се надуват без усилие, но изискват батерия и се надуват по-бавно близо до PSIмаксимума. Ръчните помпи са по-надеждни и не изискват батерии. Изберете двукамерни ръчни за надеждност и електрически за удобство.
  problem: Надуването SUP отнема твърде много време или изисква твърде много усилия. Нискокачествената помпа прави надуването досадно, което обезкуражава спонтанните сесии на гребане.
  explanation: Еднокамерните помпи движат въздуха само при движение надолу — за да се надуе . SUPДвукамерните помпи използват и двете камери за голям обем при първоначално надуване (пълнене на платката) и преминават към една камера с високо налягане за крайно налягане. Това намалява времето за напомпване до 3-5 минути. Електрическите помпи използват 12V мощност и се надуват автоматично, но значително забавят при повишаване на налягането.
  solution: За повечето потребители включената двукамерна помпа осигурява най-добрия баланс между скорост, надеждност и нулева зависимост от батериите. Ако SUP често използвате или имате физически ограничения, обмислете електрическа помпа. Винаги носете ръчна помпа като резерв, дори и основно да използвате електрическа помпа.
  recommendation: Aquafarer Двукамерната помпа, включена във всички платки, е отлична — надува се до 15 PSI за по-малко от 4 минути. Дръжте клапана смазан и проверявайте манометъра годишно.
  faq:
    - q: Кое е по-бързо – ръчно или електрическо?
      a: Ръчните двукамерни помпи (3-5 минути) често са по-бързи от електрическите (5-10 минути), защото електрическите помпи значително забавят при високо налягане.
    - q: Мога ли да използвам помпа за автомобилни гумиSUP?
      a: Не — гумените помпи се движат с малък обем при много високо налягане.SUP Помпите се нуждаят от голям обем при средно налягане.
    - q: Как да разбера кога помпата ми има нужда от поддръжка?
      a: Ако изпомпването се усеща по-трудно от обикновено, налягането застой преди да достигне PSIмаксимума , или манометърът показва неравномерно, проверете О-пръстените и връзките на клапаните.
    - q: Повреждат ли електрическите помпи платката?
      a: Не, ако имат автоматично изключване при зададеното налягане. Непрекъснатото изпомпване над PSI максимума може да повреди drop-stitch резбите.
