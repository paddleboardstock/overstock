  title: 'Безопасност в студена вода: гребане и сърфиране при студени условия'
  description: Безопасност при студена вода SUPпри сърфинг и каякинг. Разпознаване на хипотермия, подходящо оборудване, реакция на студен шок и аварийни процедури за потапяне в студена вода.
  definition: Безопасността в студена вода включва разбиране на реакцията на студен шок, провал при плуване, хипотермия и оборудването и техниките за предотвратяване на тези резултати.
  tldr: Вода под 15°C изисква неопренов костюм. При по-ниско 10°C са необходими ботуши, ръкавици и качулка. Студеният шок причинява неволно задъхване. Неуспехът при плуване настъпва в рамките на 3-5 минути във вода под 10°C. Симптомите на хипотермия включват треперене, объркване и загуба на координация.
  problem: Гребеш в слънчев ден, без да знаеш, че водата е 8°C. Падаш във водата, въздъхваш неволно и усещаш как крайниците ти изтръпват за минути. Студената вода убива по-бързо от всяка друга морска опасност.
  explanation: 'Потапянето в студена вода има четири етапа: студен шок (0-2 мин) — задъхване, хипервентилация. Провал при плуване (3-15 мин) — мускулите се охлаждат, координацията се проваля. Хипотермия (15-45 мин) — основната температура пада под 35°C, причинява объркване и сърдечен арест. Срив след спасителната операция — студената кръв се връща в ядрото.'
  solution: 'Проверявайте температурата на водата. Носете неопренов костюм, подходящ за температурата. Никога не гребете сами във вода под 15°C. Носете свирка и телефон. Ако паднете: контролирайте дишането, бързо се качете отново на дъската. Ако е твърде студено, дайте сигнал за помощ.'
  recommendation: Aquafarer Неопринният костюм Pro 5/4/3 мм е минимумът за вода 8-14C. Добавете Aquafarer 5 мм ботуши и 3 мм ръкавици. Носете Life Vest Pro за допълнителна топлинна защита.
  faq:
    - q: Колко дълго мога да оцелея във вода с 10°C?
      a: Студеният шок продължава 1-2 минути. Без плаване и термична защита, времето за оцеляване е 30-60 минути.
    - q: Кои са първите признаци на хипотермия?
      a: Неконтролируемо треперене, объркване, лоша координация, неясна реч. Спри дейността и се загрявай веднага.
    - q: Как да се стопля след студена вода?
      a: Махнете мокрите дрехи, подсушете я, облечете топли слоеве, включително шапка и ръкавици. Пийте топли безалкохолни напитки.
    - q: Може ли да получа хипотермия през лятото?
      a: Да — водата под 15°C се среща на много места дори през лятото. Водата провежда топлина 25 пъти по-бързо от въздуха.
