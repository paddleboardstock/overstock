  title: 'SUP Поддръжка на надуваеми устройства: Поддържайте дъската си дълготрайна години'
  description: Правилната поддръжка на надуваеми съдове SUP значително удължава живота на дъските. Почистване, сушене, грижа за клапаните, UV защита и сезонни съвети за съхранение на drop-stitch дъски за греба.
  definition: Поддръжката на надуваеми SUP машини включва почистване след употреба, правилно сушене, инспекция на клапаните, UV защита и правилно съхранение за предотвратяване на деламинация, мухъл, разграждане на материала и течове на въздух.
  tldr: Изплаквайте дъската с прясна вода след всяка сесия със солена вода. Изсушете напълно преди да спукате и съхранявате. Проверявайте клапана за замърсявания и смазвайте О-пръстена ежегодно. Съхранявайте надупен (на PSIполовина) на хладно, тъмно място. Избягвайте UV продължително излагане, което се влошаваPVC. Залепете малките пробиви веднага с включения комплект за ремонт.
  problem: След един сезон надуваемият ви SUP апарат започва бавни течове, подложката на терасата се лющи по краищата и PVC се усеща по-твърда. Пренебрегването на основната поддръжка води до преждевременно стареене, което е напълно предотвратимо.
  explanation: PVC Разлага се под UV въздействието на радиация. Солните кристали от морската вода проникват в шевове и клапани, причинявайки микро-течове. Влагата, задържана вътре, стимулира растежа на мухъл, който drop-stitch атакува резбите. О-пръстените на клапаните изсъхват и губят уплътнението си. Мръсотията и пясъкът се смилат в лепилото на подложката, причинявайки повдигане на ръба.
  solution: 'След всяка сесия: изплакнете дъската, ребрата и помпете с прясна вода. Избършете подложката на палубата. Отворете клапана, за да източите задържаната вода. Изсушете дъската на сянка преди да се изпуснете. Месечно: инспектирайте клапана и нанасяйте силиконов лубрикант върху О-пръстена. Сезонно: измивайте с мек сапун и вода, проверявайте за пробиви.'
  recommendation: Следвайте Aquafarer ръководството за грижа, включено в дъската. Използвайте комплекта за ремонт веднага при всяка спукана рана. Съхранявайте дъската в чантата ѝ в зоната с контролирана температура, далеч от пряка слънчева светлина.
  faq:
    - q: Мога ли да оставя надуваемия си SUP автомобил надуван през целия сезон?
      a: Да, но съхранявайте далеч от пряка слънчева светлина и на половин максимум PSI (8-10PSI), за да намалите напрежението върху шевовете. Надувайте напълно точно преди употреба.
    - q: Как да почистя мухъла от SUPмоята ?
      a: Смесете мек сапун с топла вода и изтъркайте с мека четка. За упорита плесен използвайте разреден разтвор на бял оцет (1:4). Избягвайте белина.
    - q: Трябва ли да смазвам клапана?
      a: Да, годишно. Премахнете сърцевината на клапана, нанесете силиконова грес върху О-пръстена и го монтирайте отново. Това предотвратява изтичането на въздух.
    - q: Как да я SUP съхранявам за зимата?
      a: Почистете и подсушете старателно. Спуснете напълно, навийте свободно (избягвайте плътни гънки) и съхранявайте на хладно, тъмно и сухо място. Избягвайте замръзване.
