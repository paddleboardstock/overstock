  title: 'Поддръжка на надуваема лодка: Запазете инвестицията си'
  description: Годишен контролен списък за поддръжка на надуваеми лодки. Почистване, UV защита, инспекция на шевовете, управление на налягането, грижа за двигателя и зимна подготовка за PVC Hypalon лодки.
  definition: Поддръжката на надуваеми лодки включва почистване, UV защита, управление на налягането, инспекция на шевове и клапани, предотвратяване на мухъл и правилно съхранение извън сезона.
  tldr: Изплаквайте след всяка употреба в солена вода. Нанасяйте UV протектив на всеки 2-3 месеца. Проверявайте налягането на инфлацията преди всяко излизане. Проверявайте шевовете, клапаните и транцата всеки месец. Почиствайте с мек сапун. Съхранявайте спуснат на хладно и сухо място извън сезона.
  problem: Използвахте надуваемата си лодка цял сезон и сега тръбите изглеждат избледнели, шевът тече, а транцето изглежда гъбесто — всичко това може да се предотврати с рутинна поддръжка.
  explanation: UV Радиацията разгражда полимерната матрица. Солената вода кристализира на гънки и изтърква тъканта. Мухълът расте в задържана влага. Неправилното налягане причинява умора на материала. Транецът (особено шперплатът) абсорбира вода през винтови отвори.
  solution: 'След всяка употреба: изплакнете с прясна вода, подсушете, проверете налягането. Месечно: избърсвайте тръбите с UV протектор, инспектирайте шевовете, обръщайте клапана. Годишно: дълбоко почистване, инспектирайте транца за гниене, смазвате клапаните, тествайте за микро-течове.'
  recommendation: Използвайте 303 Aerospace Protectant върху Aquafarer лодкови тръби. Сваляйте клапаните и нанасяйте силиконова грес ежегодно. Съхранявайте в чантата за носене с пакет за изсушаване.
  faq:
    - q: Мога ли да използвам белина, за да почистя надуваемата си лодка?
      a: Не — белината уврежда покритието на плата. Използвайте мек сапун и топла вода. За мухъл използвайте разреден бял оцет.
    - q: Колко често трябва да лекувам с UV протектант?
      a: На всеки 2-3 месеца през сезона на употреба. По-често в тропически климат.
    - q: Трябва ли да спускам лодката си между употребите?
      a: Не, ако се използва седмично. Оставете надуто с UV капак. За месечни празнини спускайте и съхранявайте.
    - q: Как да поддържам транца?
      a: Проверявайте болтовете всеки месец. Запечатвайте откритите дървени ръбове с морски лак ежегодно. Сменяйте, ако се появят меки места.
