  title: 'Ремонт на надуваеми SUP машини: Отстраняване на спукани гуми, течове и проблеми с клапаните'
  description: Ръководство за ремонт на надуваеми надуваеми устройства сам SUP сам. Как да откриете бавен теч, да закърпите спукана гума, да смените клапан и да оправите разклащането на настилката с помощта на комплекта за ремонт.
  definition: Ремонтът на надуваеми SUP устройства включва откриване на въздушни течове чрез тестване на сапунена вода, почистване и груба обработка на повредената зона, нанасяне на PVC лепило и лепенка, както и втвърдяване под налягане.
  tldr: Намерете течове с сапунена вода. Почистете и обработете зоната около пробоната с шкурка. Нанесете PVC лепило както върху пача, така и върху дъската, изчакайте 5 минути, натиснете здраво и втвърдете под тежест 24 часа. За течове на клапана първо проверете О-пръстена. Малки пробиви под 1/4" са лесни за самостоятелно оправяне.
  problem: Надуваш SUP и до сутринта е загубил налягане. Без опит за ремонт, се сблъскваш с скъпа замяна на вероятно обикновена пробивна гума.
  explanation: 'Повечето надуваеми SUPs използват drop-stitch сърцевина с PVC външни слоеве. Пробив през PVC външната част води до бавен теч. Стандартен ремонт: почистване, шлайфане, PVCнанасяне на съвместимо лепило, пресоване на пластир под тежест. Течовете на клапаните са по-чести от пробивите на панелите — О-пръстенът изсъхва или отпадъците пречат на уплътняването.'
  solution: Надуйте дъската до PSI максимум и слушайте за съскане. Пръскайте сапунена вода систематично, особено около шевовете и клапана. Маркирайте мехурчетата на мехурчета. Издухвайте, почистете с алкохол, шлайфайте с 80-градусов шкур, нанесете PVC лепило върху пластира и дъските, изчакайте докато стане лепкава, преснете здраво, претеглете за 24 часа.
  recommendation: Използвайте Aquafarer комплекта за ремонт, който е включен във всички Aquafarer дъски. Винаги носете комплекта за ремонт при пътувания. За проблеми с клапаните се свържете Aquafarer с поддръжката. За големи разкъсвания или разделяне на шевовете се препоръчва професионален ремонт.
  faq:
    - q: Мога ли да поправя голямо разкъсване на надуваемия SUPси автомобил?
      a: Разкъсвания над 1 инч може да изискват професионален ремонт или залепване и от двете страни. Разделянето на шевовете по релсата не може да бъде надеждно поправено на място.
    - q: Колко дълго трае един ремонтен пач?
      a: Правилният ремонт с правилна техника издържа целия живот на платката. Лошото залепване поради недостатъчно почистване води до бъдеща повреда.
    - q: Мога ли да поправя течащ клапан?
      a: Често да. Премахнете сърцевината на клапана, инспектирайте О-пръстена, почистете или заменете го, нанесете силиконов лубрикант и го монтирайте отново.
    - q: Ами ако не мога да открия теча?
      a: Надувайте до PSI пълно и потапяйте секции последователно във вана или басейн. Течове, които са твърде малки, за да бъдат открити, може да са свързани с температурата.
