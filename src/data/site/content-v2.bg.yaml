  title: 'Ръководство за размери на дъската за греба: обем, дължина и ширина за всеки ездач'
  description: Пълни размери на дъска с препоръки за обем според тегло и активност. Включва лесна за използване таблица с размери за универсални, туристически, сърфирани и SUP йога дъски.
  definition: Размерът на дъската се определя от обема (капацитет и поплавък), дължината (скорост и проследяване), ширината (стабилност) и дебелината (разпределение на обема и устойчивост на вятъра).
  tldr: 'Използвайте тегло, за да намерите минимален обем: 50-70 кг са нужни 220-260L, 70-90 kg изискват 260-300L, 90-110 kg изискват 300-350L, 110+ kg изискват 350+L. За начинаещи добавете 20% към тези числа. Ширината има значение: 32" е средно ниво, 33-34" е подходящо за начинаещи, 35+" е много стабилно.'
  problem: Обявите с размери на дъска използват футове, инчове и литри взаимозаменяемо, което затруднява сравняването между марки.
  explanation: Обемът е най-пряката метрика за товароносимост — 1 литър прясна вода измества 1 кг тежест. Дъска с 260L теоретично може да издържи 260 кг, но практичният капацитет е по-нисък, защото дъската трябва да стои над водата. Общото ти тегло (тяло плюс оборудване) трябва да е 30-40% от обема на дъската.
  solution: Целевият обем = (тегло на тялото в кг + тегло на колесника в кг) x 3. За гребец с тегло 75 кг с 5 кг екипировка, целта = 80 x 3 = минимум 240L. За начинаещи умножете по 3.5. За напреднали умножете по 2.5.
  recommendation: Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") подхожда на повечето състезатели с тегло 50-100 кг. По-леките ездачи могат да изберат размер до AirDeck 270. По-тежките ездачи трябва да разгледат SUP Tour 12 (300L+) или по-широки платформи.
  faq:
    - q: Има ли значение височината за SUP оразмеряването?
      a: Височината има по-малко значение от теглото. Високият и лек ездач се нуждае от по-малко обем от нисък тежък ездач. Използвайте теглото като основен фактор за обема.
    - q: Какво се случва с прекалено много звук?
      a: Дъската стои твърде високо, улавяйки вятъра като платно. Усеща се коркови при разкъсване. Въпреки това, за начинаещи допълнителният обем е по-добре от твърде малкото.
    - q: Какво се случва с твърде малко обем?
      a: Дъската стои твърде дълбоко, създавайки съпротивление. Носът може да се потопи по време на гребане (перли). Бързо се уморяваш от гребане на частично потопена дъска.
    - q: Трябва ли надуваемите дъски да имат различен размер от твърдите?
      a: Не значително. Надуваемите на 15 см+ PSI изместват водата подобно на твърдите дъски. Препоръките за обем важат еднакво и за двата типа.
