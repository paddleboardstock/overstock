  title: 'Разбиране на приливите при водни спортове: Практическо ръководство'
  description: Как приливите влияят SUPна условията при сърфиране и каяк. Четене на приливни карти, разбиране на пролетните и неасните приливи и планиране на сесията си според приливните движения за безопасност.
  definition: Приливите са ежедневното покачване и спад на морското равнище, причинено от гравитационното привличане на Луната и Слънцето. Приливният обхват варира според местоположението и лунния цикъл.
  tldr: 'Две високи и две ниски приливи дневно на повечето места. Пролетните приливи (пълно/новолуние) имат по-големи диапазони и по-силни течения. Приливите на Нисоса (четвърт луна) имат по-малки диапазони. Приливът влияе на дълбочината на водата, формата на вълната и силата на течението. За SUP: първо гребе срещу течението, за да ти помогне да се върнеш.'
  problem: Пристигате на местния си прилив и намирате почти никакви вълни, опасни вълни от отлив или твърде плитка вода. Без да разбирате приливите, губите пътувания или гребате при опасни условия.
  explanation: Приливите се причиняват от гравитацията на Луната. Пролетните приливи (пълнолуние и новолуние) дават най-високи върхове и най-ниски низи. Приливите (четвърт луна) произвеждат минимален обхват. Приливните течения са най-бързи в средата на прилива, отпуснати при високи и ниски. Приливният диапазон варира от 0,3 м (средиземноморски) до 16 м (залив Фънди).
  solution: 'Проверявайте графиката на прилива преди всяка сесия. За сърф: плажните почивки често работят най-добре 2-3 часа от двете страни на прилива. За SUP: гребе срещу първата половина на течението, за да се върнат помощните за течение. За риболов: приливът избутва рибата на равнините.'
  recommendation: Използвайте NOAA прогнози за приливи или локално приложение за приливи. Научете предпочитанията на вашия местен прилив, като регистрирате условията в продължение на месец.
  faq:
    - q: Какво е пролетен прилив?
      a: Пролетните приливи се случват по време на пълнолуние и ново луние, причинявайки по-високи приливи и по-силни течения. Те се случват два пъти месечно.
    - q: Какво е прилив на неапс?
      a: Приливите на Високоса се случват по време на четвърт луна. Приливният диапазон е по-малък, а теченията са по-слаби — добре за начинаещи.
    - q: Опасни ли са отливите за SUP?
      a: Отливът може да изложи скали и рифове. Той също така концентрира енергията на вълните върху по-стръмни пясъчни коси.
    - q: Как приливите влияят на теченията на рипа?
      a: Изходящите приливи (отливи) засилват теченията на отливите. Входящите приливи (наводнения) намаляват силата на отлива.
