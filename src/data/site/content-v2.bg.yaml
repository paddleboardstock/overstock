  title: Какво да носите за сърфиране (Не се появявайте с борд шорти, когато ви трябва 5/4)
  description: Спри да гадаеш какво да облечеш. Температурата на водата, а не температурата на въздуха, определя твоето сърф облекло. Пълен наръчник за наслагване от тропически рашгардове до пълни зимни 5/4/3 мм конфигурации.
  definition: Сърф облеклото варира от борд шорти и рашгардове в топла вода до пълни 5/4/3 мм неопренови костюми с ботуши и качулки в студена вода. Температурата на водата, а не температурата на въздуха, определя какво ви трябва.
  tldr: Това, което носите при сърфиране, зависи изцяло от температурата на водата — не от температурата на въздуха. Рашгардите и борд шортите работят над 22°C, пружинните костюми покриват 18-22°C, пълните 3/2 мм са 14-18°C, а 5/4/3 мм с ботуши се изискват под 14°C. Винаги носете UV предпазни средства и обмислете каишка и ударен жилет.
  problem: Пристигаш на плажа и нямаш представа дали рашгардът е достатъчен или ти трябва пълен неопренов костюм. Температурата на въздуха е топла, но водата е студена, или водата е добре, но вятърът е леден. Неправилно обличането означава развалена сесия.
  explanation: 'Сърф облеклото служи за три функции: термална изолация, UV защита и предотвратяване на абразия. Неопреновите неопренови костюми се оценяват според дебелината и покритието — пружинните (къси ръце или крака) са за гранични дни, пълните костюми за студена вода. Рашгардовете предпазват от обрив от дъска и слънце, но не предлагат топлинна стойност. Ботушите, ръкавиците и качулките не са аксесоари, а задължително оборудване за сърфиране в студена вода под 12°C.'
  solution: 'Провери местния буй или доклад за температурата на живата вода преди да тръгнеш. Сглоби комплект според най-студеното ти типично състояние: рашгард и шорти за лятото, 3/2 мм пълен костюм за пролет и есен, 5/4/3 мм с ботуши и качулка за зимата. Винаги добавяй каишка и обмисли плавателен жилетка за безопасност.'
  recommendation: Инвестирайте първо в добър 3/2mm пълен костюм — той покрива най-широкия спектър от условия. Добавете костюм и ботуши с размери 5/4/3mm, ако планирате да карате сърфиране през зимата. Aquafarer Неопреният костюм Pro с термална подплата ефективно балансира и двата температурни диапазона.
  faq:
    - q: Мога ли да сърфирам само с борд шорти?
      a: Да, в тропическа вода над 24°C. Може да ти трябва rashguard, за да предотвратиш триене на гърдите и ръцете при гребане. Восък или тракционна подложка на дъската компенсират липсата на захват на костюма.
    - q: Трябват ли ми ботуши за сърф обувки?
      a: Ако температурата на водата падне под 14°C, ботушите предотвратяват изтръпване и предпазват краката ви от камъни и порязвания по риф. Те също така добавят сцепление на дъската. Повечето сърфисти в северните климатични региони използват ботуши от ноември до март.
    - q: Какво е пружинен костюм?
      a: Пружинният костюм е неопренов костюм с къси ръце или къси крака (или и двете), предназначен за вода между 18°C и 22°C. Той предлага повече топлина от рашгард, но по-малко покритие от пълния костюм.
    - q: Трябва ли да нося спасителна жилетка, докато сърфирам?
      a: Не са традиционни спасителни жилетки, но ударен жилетка или помощно средство за плаване може да помогне при трудни условия или ако сте слаб плувец.Aquafarer Спасителните жилетки са предназначени за SUP каяк, но могат да осигурят допълнителна увереност в плаване на начинаещи.
