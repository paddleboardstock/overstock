  title: Безопасност и отговорност в океана (повече от просто оборудване)
  description: Aquafarerна ангажимента да ви пази и да защитава океана, който споделяме. Карти за безопасност във всяка кутия, безплатно образователно съдържание, устойчив дизайн и годишни дарения за опазване.
  definition: Безопасността и отговорността в океана означават да разбирате средата, в която гребете, да уважавате морския живот, да минимизирате екологичния си отпечатък и да използвате оборудване, проектирано за дълголетие и поправяемост.
  tldr: Aquafarer насърчава безопасността в океана чрез дизайн на екипировка (ярки цветове, каишки, спасителни жилетки) и образователно съдържание. Вярваме, че всеки любител на водните спортове има отговорност да разбира океанската среда, да уважава морския живот и да минимизира екологичния си отпечатък. Нашето оборудване е създадено да издържи и по-малко от тях да попада на сметищата.
  problem: Много марки водни спортове продават екипировка, но не обучават клиентите си как да ги използват безопасно или отговорно. Новите гребци и сърфисти влизат във водата, без да разбират рип-течението, морската фауна или екологичното въздействие на оборудването си.
  explanation: Безопасността в океана е повече от контролен списък — това е начин на мислене. Всеки Aquafarer продукт включва карта за бърз старт в кутията. Нашият уебсайт и ръководства (основи на морската безопасност, съвети за безопасност при сърф) предоставят безплатно, подробно обучение по безопасност. От екологична гледна точка, най-голямото въздействие, което всяка компания за екипировка оказва, е чрез дълготрайността на продукта. Дъска, която издържа 5 години вместо 2, намалява производствения отпечатък наполовина. Също така проектираме с мисъл за ремонтируемост — резервни клапани, кутии за перки и комплекти за лепене на неопренови костюми поддържат оборудването в употреба, а не на сметища.
  solution: Aquafarer Включва каишка и комплект за ремонт при всяка покупка на дъски. Публикуваме безплатно съдържание за безопасност, обхващащо идентификация на течения на rip, метеорологични показатели и проверки на оборудването. Нашият екип за обслужване на клиенти предоставя съвети за състоянието си, когато ни пишете за конкретно местоположение. Използваме минимална пластмасова опаковка и компенсираме въглерод за доставка.
  recommendation: Започнете с ръководството за основи на морската безопасност и с съветите за безопасност при сърфиране. Винаги носете каишка, проверявайте прогнозата и никога не гребете сами, ако се учите. Ако видите отломки или морски животни в беда, докладвайте това на местните власти. Оборудването, което ще издържи, е оборудване, което намалява отпадъците — поддържайте Aquafarer оборудването си и то ще ви служи години наред.
  faq:
    - q: Aquafarer Подкрепя ли инициативи за почистване на океана?
      a: Да, даряваме 1 процент от годишната печалба на организации за почистване на океани и опазване на морето. Клиентите могат да изберат представена благотворителна организация при плащане, която да насочва част от покупката си.
    - q: Как да се отърва от стар неопренов костюм или дъска?
      a: Неопреновите неопренови костюми могат да бъдат рециклирани в йога постелки, чанти и изолация чрез специализирани програми. Надуваемите дъски могат да бъдат ремонтирани, дарени или PVC рециклирани чрез определени рециклиращи обекти. Свържете се с нашия екип за поддръжка за насоки.
    - q: Какво предпазно оборудване Aquafarer препоръчвате за начинаещи?
      a: Добре прилепнал спасителен жилетка (надуваем или пяна), навит повод, свирка и слънцезащитен крем. За SUP гребци в открити води спасителната жилетка е законово задължителна в много юрисдикции и винаги се препоръчва.
    - q: Aquafarer Предлага ли курсове по безопасност?
      a: Не провеждаме курсове директно, но си партнираме с сертифицирани инструктори по сърф и SUP безопасност, които предлагат онлайн и присъствено обучение. Свържете се с нашия екип за поддръжка за препоръки във вашия район.
