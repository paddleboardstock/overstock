  title: Правила за сърф етикет (Как да не бъдеш човекът, когото всички избягват)
  description: Съставът има правила и никой не ги записва. Научи предимството, защо snain-ът ще ти крещи, как да се извиниш и грешките на начинаещите, които дразнят всеки местен сърфист.
  definition: 'Етикетът на вълните е неписан кодекс на поведение, който предотвратява сблъсъци и споделя вълните справедливо. Основното правило: сърфистът, най-близо до върха на разбиващата се вълна, има предимство.'
  tldr: Сърфистът, който е най-близо до върха на разбиващата се вълна, има предимство. Не се хвърляй при някого, не греби около някого, за да хванеш вълната му) и винаги се извинявай, ако направиш грешка. Греби широко около линията, дръж дъската си и бъди приятелски настроен — уважението печели уважение.
  problem: Гребеш до претъпкана редица и веднага усещаш напрежение. Сърфистите те гледат настрани, някой ти крещи и не си сигурен какво си направил грешно. Социалната страна на сърфирането е по-плашеща от самите вълни.
  explanation: 'Етикетът при сърф съществува, за да предотвратява сблъсъци и да споделя вълните справедливо. Основното правило е предимство: сърфистът, който е най-близо до върха (където вълната първо се разбива), има приоритет. Всеки, който гребе към същата вълна от по-навътре, трябва да се оттегли навън. Извиването — гребането около друг сърфист, за да откраднете приоритет — се счита за най-лошото нарушение. Освен приоритета, съставът има очаквания за шум (викане до минимум), контрол на дъската (никога не пускай дъската си да се доближава до други) и дружелюбност (просто кимване е достатъчно).'
  solution: Наблюдавайте подредбата 10 минути преди да отплавате. Идентифицирайте кой хваща най-много вълни — това са сърфистите, които трябва да уважавате и избягвате. Останете вътре (зоната на бели води), ако се учите. Гребете широко около линията, а не през нея. Когато хванете вълна, погледнете и в двете посоки преди да изскочите и се уверете, че никой не е по-дълбок.
  recommendation: Прекарайте първите си няколко сесии на почивка, подходяща за начинаещи, сред разпръснати тълпи. Научете се да четете приоритет, преди да опитате натоварена линия. Ако все пак се появите при някого, извинете се веднага и се отплавайте — повечето сърфисти уважават честната грешка.
  faq:
    - q: Какво означава да се появите?
      a: Да се спуснеш означава да гребеш и да яздеш вълна, на която друг сърфист вече има приоритет. Това е опасно и неуважително. Сърфистът, най-близо до върха, притежава вълната; всеки друг трябва да спре вълната.
    - q: Какво е снейкинг?
      a: Снейкингът означава да гребеш около друг сърфист, който вече е в позиция за вълна, така че да се озовеш по-близо до върха. Това се счита за изключително лош етикет и може да доведе до конфронтация.
    - q: Могат ли начинаещи да карат сърф при претъпкани почивки?
      a: Да, но останете в зоната на белите води, далеч от върха. Не гребете в основната зона за излитане, докато не можете постоянно да хващате вълни и да контролирате посоката си. Претъпканите линии изискват опит за безопасно навигиране.
    - q: Как да се извиня във водата?
      a: Просто махане, усмивка и "моя грешка" или "съжалявам" работят. Признай грешката и греби далеч от човека. Сърфистите обикновено прощават честните грешки, особено ако очевидно се учиш.
    - q: Какво да направя, ако някой се появи при мен?
      a: Ако е ясно да се появява, извикайте "махайте" или "хей", за да ги предупредите. Ако го хванат случайно и се извинят, оставете го. Ако някой се появява многократно, приближете се и учтиво обяснете приоритета. Избягвайте конфронтации.
