  title: 'SUP Ръководство за котва: Останете на място по време на риболов или фотография'
  description: Пълно ръководство за SUP котвене — типове котви (гъби, сгъваеми, колчета), настройка на котвената количка, техники за разполагане и съображения за безопасност при запазване на позиция.
  definition: SUP Котвата е тежест, прикрепена към въже, която държи дъската в позиция срещу вятър и течение. Често срещани видове са гъбовидни котви, сгъваеми котви и стълбове за наблюдение.
  tldr: Използвайте гъбовидна котва (1.5-3 lb) за кални или пясъчни дъна, сгъваема котва за скалисти дъна или стълб за наблюдение за плитки води с меки дъна. Котвата трябва да тежи 1.5-3 lb за спокойни условия, 3-5 lb за вятър и течение. Винаги използвайте котвена количка, за да коригирате позицията и да знаете кога да пуснете.
  problem: Намираш перфектното място за риболов, но вятърът и течението те отклоняват от позицията си на всеки няколко минути. Без котва, SUP риболовът и фотографията са разочароващи упражнения при постоянно пренареждане.
  explanation: Котвата работи, като се влачи по дъното, докато се закачи. Котвите гъби се забиват в меки дъна и осигуряват добро задържане в пясък и кал. Сгъваемите котви имат флукове, които се забиват в твърди или каменисти дъна. Стълбовете за наблюдение работят в плитка вода, като се вбиват директно в дъното.
  solution: Инсталирайте система с котвена количка (въже с плъзгащ се пръстен от едната страна на дъската), за да регулирате точката на закрепване на котвата. Прикрепете въже с дължина 50-75 фута към котвата. Разполагайте срещу вятъра или нагоре от желаната от вас позиция. Използвайте система за бързо освобождаване при спешни случаи. Никога не закотвяйте при силен ток или там, където не можете лесно да извадите котвата.
  recommendation: Сгъваема котва от 3 lb с 50 фута въже върши работа за повечето SUP условия за риболов. Добавете котвена количка с D-пръстени на вашия Aquafarer SUP Explorer 11.
  faq:
    - q: Какъв размер котва ми трябваSUP?
      a: 1.5-3 lb за спокойни езера и бавни реки. 3-5 lb за крайбрежни райони с вятър или течение. Прекалено големи котви са трудни за извличане.
    - q: Колко анкерно въже ми трябва?
      a: Стандартен е оптика 5:1 (5 фута въжета на всеки 1 фут дълбочина). На 10 фута вода използвай 50 фута въже.
    - q: Опасно ли е закрепването на SUP?
      a: Само ако се закотвиш на течение или вятър е достатъчно силен, за да обърне дъската. Винаги използвай система за бързо освобождаване, която може да се отдели мигновено.
    - q: Мога ли да се закотвя във вода?
      a: Проверете местните регулации. В някои райони се ограничава котвенето, за да се защитят морските треви или морските местообитания. Никога не се закотвяйте на коралови рифове.
