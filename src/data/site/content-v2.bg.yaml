  title: 'Aquafarer SUP Тур 12: Преглед на гребане на дълги разстояния'
  description: Задълбочен преглед на Aquafarer SUP Tour 12 — 12-футова надуваема туристическа дъска, проектирана за скорост, проследяване и гребане на дълги разстояния.
  definition: Aquafarer SUP Tour 12 е надуваем туринг с размери 12' x 31" x 6 SUP " с нос с работен обем, обем 280L и троен PVCслой.
  tldr: 'SUP Tour 12 е Aquafarerспециализираната туристическа дъска на Touring. С дължина 12 фута и ширина 31" с нос с изместен капацитет, тя ефективно прорязва водата. Ключови характеристики: 280L обем, PSI 18 Max, бънджи товарна система, множество плавници. Цена около $699. Най-добро за фитнес гребци и любители на дълги разстояния, изминаващи 5-20 км на сесия.'
  problem: Покриваш сериозна дистанция SUP с твоята универсална дъска, а широкият нос на универсалната дъска създава съпротивление и не се движи направо.
  explanation: Носът с изместване разделя водата, вместо да минава над нея, намалявайки съпротивлението на носовите вълни. По-дългата 12-футова водна линия увеличава скоростта на корпуса. С ширина 31" балансира ефективността със стабилността. Специфични за туристическите характеристики включват множество кутии с перки и багажна палуба с бънджи.
  solution: Надуйте до 18PSI. Използвайте централната перка за плоска вода или добавете странични захапки за стабилност при страничен вятър. Носът с изместване и дължината 12 фута са отлични при открити води с chop.
  recommendation: На цена от 699 долара, SUP Tour 12 е най-добрата надуваема туристическа дъска. Купете я, ако редовно изминавате разстояние. Комбинирайте с Aquafarer карбоновата лопатка за най-ефективната конфигурация.
  faq:
    - q: SUP Достатъчно стабилен ли е Tour 12 за междинно ниво?
      a: Да — ширината 31" е стандартна за туринг. Начинаещите може да намерят 31" tippi в сравнение с 33-34" универсални дъски.
    - q: Как Tour 12 се справя с chop chop?
      a: Много добре — носът с водоизместване преминава през малък до умерен отрез без удряне на планиращ корпус.
    - q: Мога ли да използвам Tour 12 за сърфиране?
      a: Не се препоръчва — дължината 12 фута и обемът на носа правят завоя бавно. Използвайте SUP Explorer 11 за каране на вълни.
    - q: Коя дължина на греблото работи най-добре?
      a: 8-10" над главата ви. По-дългата гребло осигурява лост за гребане на разстояние.
