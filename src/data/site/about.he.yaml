origin:
  tagline: המוצא שלנו
  heading: |-
    נעשה על המים,<br />
    <span class="text-sky-600">מונע על ידי מטרה</span>
  paragraphs:
    - 'Paddle Board Overstock התחיל בסדנה על חוף הים עם סירה אחת ואמונה עקשנית: מוצרים ימיים צריכים להיות מהונדסים כאילו הם חשובים — כי הם אכן חשובים.'
    - המייסדים שלנו, שני אדריכלים ימיים, ראו תעשייה שבה קיצצו פינות, הורידו את איכות החומרים, ובטיחות נחשבה לסימון תיבה. הם בנו את הגוף הראשון של Paddle Board Overstock לא למטרת רווח, אלא כדי להוכיח שציוד ימי בר השגה יכול להיות גם אמין באמת.
    - הספינה הראשונה ההיא עדיין בשירות היום. העיקרון הזה מעולם לא השתנה.
    - אנחנו לא היצרן הגדול ביותר. אנחנו לא מייצרים את המוצרים הזולים ביותר. אבל כל גוף סירה שעוזב את הסדנה שלנו עובר דרך אותם ידיים שהקימו את החברה — ועומד באותו הסטנדרט שהציב גוף הסירה הראשון.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock סדנה חופית
philosophy:
  tagline: הפילוסופיה שלנו
  heading: שורש באוקיינוס
  description: האוקיינוס הוא לא מקום העבודה שלנו. הוא המורה שלנו. כל החלטת עיצוב מתחילה בהבנה כיצד המים מתנהגים, כיצד התנאים משתנים, וכיצד הציוד חייב להגיב.
  cards:
    - emoji: 🌊
      title: כבד את המים
      description: המִים אינם צפויים. המוצרים שלנו מותאמים לתנאים הקשים ביותר, לא לטובים ביותר. אם גוף כלי יכול להתמודד עם זרם חזק, הוא יוכל להתמודד עם אגם. אם חגורת הצלה עובדת בים הפתוח, היא מבוצעת יתר על המידה עבור נהר — וזה נועד כך במכוון.
    - emoji: 🔧
      title: בנוי להחזיק מעמד, לא להחליף
      description: המוצר המזוהה ביותר עם קיימות הוא זה שאינו צריך החלפה. בנייה בדרגת ימית של PVC, Hypalon, ו-drop-stitch נבחרת לאורך חיים. אנו עדיין שולחים חלקי חילוף לגופים שבנינו לפני עשור.
    - emoji: 🏆
      title: נגיש בעיצוב
      description: ספורט ימי לא צריך להיות מותרות. אנחנו מייצרים מוצרים שמספקים ביצועים ברמה מקצועית במחיר שמובן ומותאם למשפחות, מדריכים ומפעילים קטנים — ולא רק לצי מסחרי.
design:
  tagline: פילוסופיית עיצוב
  heading: |-
    מפותח עבור הקצה<br />
    <span class="text-sky-600">של תנאים</span>
  paragraphs:
    - כל מוצר Paddle Board Overstock מתחיל עם שאלה אחת:<em>מהו המצב הגרוע ביותר שזה עשוי להתמודד איתו?</em>אנחנו מעצבים מהקצה כלפי פנימה, לא מהמרכז כלפי חוץ.
    - הליבות שלנו drop-stitch מדורגות ל-15 PSI — לא כי 12 PSI אינם מספיקים לאגם, אלא כי לוח של 15 PSI מתמודד עם גלים פתאומיים מבלי להתעוות. הצינורות שלנו Hypalon מוגדרים לעמידות ב-UV בדרגת מסחרית — לא כי כל לקוח משוט בחופים טרופיים, אלא כי הידרדרות UV היא הגורם מספר 1 לכשל מוקדם.
    - אנחנו לא מעצבים לפי נקודת מחיר. אנחנו מעצבים לפי נקודת כשל — ואז בונים הרבה מעליה.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock עיצוב והנדסה
  stats:
    - value: '15'
      label: PSI ליבה<br />דירוג
    - value: 1,500+
      label: UV שעות<br />נבדק
    - value: 10yr
      label: קדמת הספינה<br />תוחלת חיים
