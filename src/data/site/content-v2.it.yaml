- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'Idratazione e protezione solare in SUP: restare al sicuro sull''acqua'
  description: >-
    Strategie essenziali di idratazione e protezione solare per i pagaiatori di
    SUP. Disidratazione e scottature sono i problemi più comuni nello SUP — come
    prevenirli entrambi durante le sessioni lunghe.
  definition: >-
    L'idratazione nello SUP significa mantenere l'equilibrio dei fluidi durante
    la pagaiata attraverso un'assunzione regolare di acqua. La protezione solare
    prevede l'applicazione di SPF, indumenti protettivi e la programmazione
    delle sessioni per evitare il picco dei raggi UV.
  tldr: >-
    Bevi 500ml di acqua per ogni ora di pagaiata. Portane più di quanto pensi ti
    serva — una sacca idrica da 2L o più bottiglie. Applica una protezione
    solare resistente all'acqua SPF 50+ prima di pagaiare e riapplicala ogni 2
    ore. Indossa un cappello, occhiali da sole con laccio e indumenti con
    protezione UPF. Evita di pagaiare dalle 11:00 alle 15:00 quando i raggi UV
    sono più forti.
  problem: >-
    Stai vivendo una fantastica sessione di SUP, ma dopo un'ora hai mal di
    testa, la bocca secca e la pelle che brucia. Disidratazione e scottature
    colpiscono di soppiatto perché l'acqua ti tiene al fresco.
  explanation: >-
    Il riflesso dell'acqua intensifica l'esposizione ai raggi UV fino al 40%.
    L'effetto rinfrescante di acqua e brezza maschera la scottatura finché non
    è troppo tardi. Il sudore della pagaiata aumenta la perdita di fluidi e in
    acqua spesso non c'è modo di riempire la borraccia. La disidratazione
    compromette equilibrio e capacità decisionale, aumentando il rischio di
    incidenti.
  solution: >-
    Fissa una borraccia o una sacca idrica al sistema di bungee della tavola.
    Bevi ogni 15 minuti, che tu abbia sete o no. Applica la protezione SPF 50+
    30 minuti prima del lancio. Indossa un cappello a tesa larga, occhiali da
    sole polarizzati con laccio e una rash guard UPF 50+. Riapplica la
    protezione solare ogni 2 ore.
  recommendation: >-
    Usa una sacca idrica fissata agli anelli a D anteriori del tuo Aquafarer
    SUP. Indossa una rash guard UPF 50+ sotto il PFD. Usa una protezione solare
    impermeabile che resiste a sudore e acqua.
  faq:
    - q: 'Quanta acqua devo portare in una gita in SUP?'
      a: >-
        Almeno 1 litro all'ora. Per una sessione di 2 ore, porta 2 litri. Di più
        con il caldo. Una sacca idrica è la soluzione migliore.
    - q: 'Quale tipo di protezione solare è migliore per il SUP?'
      a: >-
        Resistente all'acqua, SPF 50+ a spettro ampio. Le protezioni minerali
        (ossido di zinco, biossido di titanio) sono sicure per le barriere
        coralline e durano più a lungo.
    - q: 'L''acqua riflette davvero i raggi UV?'
      a: >-
        Sì — l'acqua riflette fino al 40% delle radiazioni UV, il che significa
        che ricevi UV sia dall'alto che dal basso. Questo aumenta notevolmente
        il rischio di scottature.
    - q: 'Posso scottarmi attraverso una rash guard?'
      a: >-
        Le rash guard standard offrono una protezione UV minima (circa UPF
        10-20). Cerca indumenti con protezione UPF 50+ per una protezione
        completa.
