- slug: understanding-tides
  category: guide
  type: technical
  title: 'Capire le maree per gli sport acquatici: una guida pratica'
  description: >-
    Come le maree influenzano le condizioni di SUP, surf e kayak. Leggere le
    tabelle di marea, capire la differenza tra maree di sizigia e di
    quadratura e pianificare la sessione in base ai movimenti di marea per
    sicurezza.
  definition: >-
    Le maree sono l'innalzamento e l'abbassamento quotidiani del livello del
    mare causati dall'attrazione gravitazionale di luna e sole. L'escursione di
    marea varia in base al luogo e al ciclo lunare.
  tldr: >-
    Due alte e due basse maree al giorno nella maggior parte dei luoghi. Le
    maree di sizigia (luna piena/nuova) hanno escursioni maggiori e correnti più
    forti. Le maree di quadratura (quarti di luna) hanno escursioni minori. La
    marea influisce sulla profondità dell'acqua, sulla forma delle onde e sulla
    forza della corrente. Per il SUP: pagaia prima controcorrente, così la
    corrente ti aiuta al ritorno.
  problem: >-
    Arrivi al tuo spot locale e trovi pochissime onde, pericolose correnti di
    risacca dovute alla marea calante o acqua troppo bassa. Senza capire le
    maree, sprechi uscite o esci a pagaiare in condizioni pericolose.
  explanation: >-
    Le maree sono causate dalla gravità della luna. Le maree di sizigia (luna
    piena e luna nuova) producono le alte più alte e le basse più basse. Le
    maree di quadratura (quarti di luna) producono un'escursione minima. Le
    correnti di marea sono più veloci a metà marea e quasi nulle alle alte e
    alle basse maree. L'escursione di marea varia da 0,3 m (Mediterraneo) a 16 m
    (Baia di Fundy).
  solution: >-
    Controlla la tabella di marea prima di ogni sessione. Per il surf: gli spot
    su fondo sabbioso funzionano spesso al meglio 2-3 ore su entrambi i lati
    dell'alta marea. Per il SUP: pagaia controcorrente nella prima metà, così la
    corrente ti aiuta al ritorno. Per la pesca: la marea montante spinge i pesci
    sulle bassure.
  recommendation: >-
    Usa le previsioni di marea NOAA o un'app di marea locale. Impara la marea
    preferita del tuo spot registrando le condizioni per un mese.
  faq:
    - q: Cos'è una marea di sizigia?
      a: >-
        Le maree di sizigia si verificano in corrispondenza della luna piena e
        della luna nuova e producono alte maree più alte e correnti più forti.
        Si verificano due volte al mese.
    - q: Cos'è una marea di quadratura?
      a: >-
        Le maree di quadratura si verificano ai quarti di luna. L'escursione di
        marea è minore e le correnti più deboli — adatte ai principianti.
    - q: Le basse maree sono pericolose per il SUP?
      a: >-
        La bassa marea può esporre rocce e barriere coralline. Concentra inoltre
        l'energia delle onde su banchi di sabbia più ripidi.
    - q: Come influiscono le maree sulle correnti di risacca?
      a: >-
        La marea calante (reflusso) rafforza le correnti di risacca. La marea
        montante (flusso) ne riduce la forza.
