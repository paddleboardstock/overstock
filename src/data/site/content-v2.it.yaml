- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Manutenzione del SUP Gonfiabile: Fai durare la Tua Tavola per Anni'
  description: >-
    Una corretta manutenzione del SUP gonfiabile prolunga notevolmente la vita
    della tavola. Pulizia, asciugatura, cura della valvola, protezione UV e
    consigli per lo stoccaggio stagionale delle tavole drop-stitch.
  definition: >-
    La manutenzione del SUP gonfiabile comprende la pulizia dopo l''uso,
    l''asciugatura corretta, l''ispezione della valvola, la protezione UV e uno
    stoccaggio adeguato per prevenire delaminazione, muffa, degrado dei
    materiali e perdite d''aria.
  tldr: >-
    Risciacqua la tavola con acqua dolce dopo ogni uscita in acqua salata.
    Asciugala completamente prima di sgonfiarla e riporla. Controlla che la
    valvola non abbia detriti e lubrifica l''O-ring ogni anno. Riponila gonfia
    (a metà PSI) in un luogo fresco e buio. Evita l''esposizione prolungata ai
    raggi UV, che degradano il PVC. Ripara subito le piccole forature con il
    kit di riparazione incluso.
  problem: >-
    Dopo una stagione, il tuo SUP gonfiabile sviluppa piccole perdite, il deck
    pad si scolla ai bordi e il PVC sembra più rigido. Trascurare la
    manutenzione di base causa un invecchiamento prematuro del tutto evitabile.
  explanation: >-
    Il PVC si degrada sotto la radiazione UV. I cristalli di sale dell''acqua
    di mare penetrano nelle cuciture e nelle valvole, causando micro-perdite.
    L''umidità intrappolata favorisce la crescita di muffa che attacca i
    filamenti del drop-stitch. Le O-ring delle valvole si seccano e perdono la
    tenuta. Sporcizia e sabbia si insinuano nell''adesivo del deck pad,
    causando il sollevamento dei bordi.
  solution: >-
    Dopo ogni uscita: risciacqua tavola, derive e pompa con acqua dolce.
    Asciuga il deck pad. Apri la valvola per far defluire l''acqua
    intrappolata. Asciuga la tavola all''ombra prima di sgonfiarla.
    Mensilmente: ispeziona la valvola e applica lubrificante al silicone
    sull''O-ring. Stagionalmente: lava con sapone neutro e acqua e controlla la
    presenza di forature.
  recommendation: >-
    Segui la guida alla cura Aquafarer inclusa con la tua tavola. Usa subito il
    kit di riparazione su qualsiasi foratura. Riponi la tavola nella sua sacca
    in un ambiente a temperatura controllata, lontana dalla luce solare
    diretta.
  faq:
    - q: Posso lasciare il mio SUP gonfiabile gonfio per tutta la stagione?
      a: >-
        Sì, ma riponilo lontano dalla luce solare diretta e a metà del PSI
        massimo (8-10 PSI) per ridurre lo stress sulle cuciture. Gonfialo
        completamente appena prima dell''uso.
    - q: Come rimuovo la muffa dal mio SUP?
      a: >-
        Mescola sapone neutro con acqua tiepida e strofina con una spazzola
        morbida. Per la muffa ostinata, usa una soluzione diluita di aceto
        bianco (1:4). Evita la candeggina.
    - q: Devo lubrificare la valvola?
      a: >-
        Sì, ogni anno. Rimuovi il nucleo della valvola, applica grasso al
        silicone sull''O-ring e rimonta. Questo previene le perdite d''aria.
    - q: Come conservo il mio SUP per l'inverno?
      a: >-
        Pulisci e asciuga accuratamente. Sgonfia completamente, arrotola senza
        stringere (evita pieghe marcate) e conserva in un luogo fresco, buio e
        asciutto. Evita temperature sotto lo zero.
