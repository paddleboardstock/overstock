- slug: sup-safety-guide
  category: guide
  type: safety
  title: 'Guida alla sicurezza SUP: regole essenziali per chi pagaia'
  description: >-
    Guida completa alla sicurezza SUP che copre il controllo del meteo,
    l'attrezzatura, l'auto-soccorso, le regole di navigazione e cosa fare se le
    condizioni diventano pericolose. Rimani al sicuro sul tuo paddle board.
  definition: >-
    La sicurezza SUP comprende la pianificazione prima dell'uscita (meteo,
    maree, controllo dell'attrezzatura), le pratiche in acqua (leash, PFD,
    navigazione) e le procedure di emergenza (auto-soccorso, segnalazione,
    prevenzione dell'ipotermia).
  tldr: >-
    Indossa sempre il leash e un giubbotto di salvataggio (PFD). Controlla le
    previsioni del vento — il vento offshore è pericoloso. Pagaia prima
    controvento, così il vento ti aiuta a tornare. Porta un fischietto, un
    telefono in custodia impermeabile e acqua. Impara l'auto-soccorso. Non fare
    mai SUP da solo in zone remote.
  problem: >-
    Il SUP sembra ingannevolmente semplice. I principianti sottovalutano quanto
    velocemente vento, corrente e stanchezza possano rendere pericolosa una
    sessione divertente.
  explanation: >-
    In presenza di vento la tavola agisce come una vela: pagaiare a favore di
    vento è facile, ma il ritorno controvento è estremamente difficile. La
    posizione eretta aumenta il rischio di caduta. La stanchezza si accumula più
    in fretta che nel kayak. I leash impediscono di separarsi dalla tavola. I
    giubbotti di salvataggio (PFD) ti tengono a galla in caso di infortunio.
  solution: >-
    Prima dell'uscita: controlla il vento (max 10 nodi per i principianti), la
    direzione (evita il vento offshore) e la marea. Comunica a qualcuno il tuo
    itinerario. In acqua: inginocchiati per pagaiare contro vento forte. Se ti
    separi dalla tavola, nuota fino a essa. Per l'auto-soccorso: appoggia la
    pagaia trasversalmente sulla tavola, scalcia con le gambe, porta il petto
    sulla tavola e ruota le gambe verso l'alto.
  recommendation: >-
    Usa il giubbotto Aquafarer Life Vest Pro (gonfiabile) per il SUP. Fissa il
    leash SUP a spirale al polpaccio. Esercitati con l'auto-soccorso in
    condizioni calme prima che ti serva davvero.
  faq:
    - q: Quale velocità del vento è sicura per il SUP?
      a: >-
        Principianti: sotto i 10 nodi. Intermedi: 10-15 nodi. Avanzati: 15-20
        nodi. Oltre i 20 nodi è pericoloso per tutti i livelli.
    - q: Mi serve il giubbotto di salvataggio per il SUP?
      a: >-
        Sì — è obbligatorio per legge in molte giurisdizioni ed è sempre
        consigliato per sicurezza.
    - q: Cosa devo fare se non riesco a tornare a riva?
      a: >-
        Resta con la tua tavola (è il tuo galleggiante). Segnala con il
        fischietto. Se vieni spinto al largo, pagaia a 45 gradi rispetto al
        vento.
    - q: Come mi alleno all'auto-soccorso in SUP?
      a: >-
        In acqua calma e bassa: fatti cadere di proposito, nuota fino alla
        tavola ed esercitati a risalire più volte.
