- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Stoccaggio del SUP Gonfiabile: il Modo Giusto per Riporre il Tuo iSUP'
  description: >-
    Un corretto stoccaggio del SUP gonfiabile previene delaminazione, danni UV,
    muffa e perdite dalle valvole. Consigli per lo stoccaggio invernale, a
    lungo termine e quotidiano delle tavole drop-stitch.
  definition: >-
    Lo stoccaggio del SUP gonfiabile significa tenere la tavola in un ambiente
    pulito, asciutto e a temperatura controllata, lontano da raggi UV,
    temperature estreme e danni fisici.
  tldr: >-
    Riponi in un luogo fresco e buio sotto i 30C, lontano dalla luce solare
    diretta. Per il breve termine (1-2 settimane), conservala parzialmente
    gonfia a 8-10 PSI. Per lo stoccaggio a lungo termine, sgonfia
    completamente, arrotola senza stringere e mettila nella sacca di trasporto.
    Non riporla mai bagnata. Tienila lontana da roditori e oggetti appuntiti.
  problem: >-
    Sgonfi il tuo SUP e lo infili in un garage caldo o in una cantina umida.
    Tre mesi dopo, il PVC è ingiallito, il deck pad si sta scollando e la
    valvola perde. Uno stoccaggio errato causa più danni dell''uso regolare.
  explanation: >-
    Il calore sopra i 50C provoca la migrazione dei plastificanti del PVC,
    rendendo il materiale rigido e fragile. La radiazione UV rompe i legami
    polimerici. L''umidità intrappolata crea muffa. Il freddo sotto lo zero
    rende il PVC fragile. I punti di pressione dovuti a piegature strette
    creano pieghe permanenti.
  solution: >-
    Stoccaggio a breve termine: risciacqua, asciuga, gonfia a 10 PSI e riponila
    sollevata da terra in una zona ombreggiata. Stoccaggio a lungo termine:
    pulisci accuratamente, asciuga completamente, sgonfia del tutto, arrotola
    con il deck pad verso l''esterno, mettila nella sacca e conservala in un
    armadio fresco e asciutto. Tienila lontana da sostanze chimiche e parassiti.
  recommendation: >-
    Usa la sacca di trasporto Aquafarer per lo stoccaggio: blocca i raggi UV e
    previene gli sfregamenti. Riponi in una stanza a clima controllato.
    Aggiungi una bustina di essiccante dentro la sacca per gli ambienti umidi.
  faq:
    - q: Posso riporre il mio SUP gonfio nel garage?
      a: >-
        Solo se il garage resta sotto i 30C e senza luce solare diretta. La
        maggior parte dei garage supera i 40C in estate.
    - q: Devo riporre il mio SUP nella sacca?
      a: >-
        Sì, la sacca protegge da polvere, raggi UV e danni fisici. Assicurati
        che la tavola sia completamente asciutta prima di insaccarla.
    - q: Il gelo può danneggiare un SUP gonfiabile?
      a: >-
        Sì. Sotto lo zero, il PVC diventa fragile e può rompersi quando la
        tavola viene srotolata o gonfiata. Conserva sempre sopra i 5C.
    - q: Come devo arrotolare il mio SUP per lo stoccaggio?
      a: >-
        Arrotola con il deck pad rivolto verso l''esterno per proteggere il PVC
        inferiore. Evita pieghe strette. Alterna ogni volta la posizione delle
        pieghe.
