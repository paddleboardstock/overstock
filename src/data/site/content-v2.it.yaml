- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP Fitness: allenamento full-body su paddle board'
  description: >-
    Lo SUP offre un allenamento full-body che combina resistenza
    cardiovascolare, stabilità del core e forza. Come strutturare le sessioni
    di fitness SUP, i migliori esercizi e la misurazione dei progressi.
  definition: >-
    Il fitness SUP usa la piattaforma instabile di una paddle board per
    coinvolgere i muscoli stabilizzatori del core, i muscoli delle gambe e la
    parte superiore del corpo attraverso la pagaiata, l'equilibrio e gli
    esercizi in tavola.
  tldr: >-
    Lo SUP brucia 400-700 calorie all'ora. Una sessione SUP di un'ora coinvolge
    core, gambe, schiena, spalle e braccia. La pagaiata a intervalli (sprint +
    recupero) massimizza il cardio. Le posizioni yoga in tavola sviluppano
    equilibrio e flessibilità. Aggiungi esercizi di forza specifici per lo SUP
    come squat e affondi in tavola.
  problem: >-
    Gli allenamenti in palestra sono diventati noiosi e vuoi un'attività
    all'aperto che costruisca fitness divertendoti. Lo SUP combina avventura con
    un vero condizionamento full-body.
  explanation: >-
    La pagaiata coinvolge il grande dorsale, i deltoidi, il trapezio e i muscoli
    del core per la rotazione. Stare in piedi su una piattaforma in movimento
    costringe i muscoli stabilizzatori di caviglie, ginocchia e fianchi a
    lavorare costantemente. Le richieste cardiovascolari della pagaiata continua
    a intensità moderata forniscono condizionamento aerobico.
  solution: >-
    Struttura le sessioni: 5 min di riscaldamento pagaiando, 20 min di pagaiata
    a ritmo costante moderato, 15 min di pagaiata a intervalli (30 sec di
    sprint, 60 sec facili), 10 min di esercizi in tavola (squat, affondi,
    flessioni), 5 min di defaticamento con stretching.
  recommendation: >-
    Usa l'Aquafarer SUP Explorer 11 per il fitness in pagaiata. La piattaforma
    stabile ti permette di concentrarti su tecnica e intensità. Indossa il Life
    Vest Pro per la sicurezza durante le sessioni ad alta intensità.
  faq:
    - q: Quante calorie brucia lo SUP?
      a: >-
        400-700 calorie all'ora a seconda di intensità, vento e corrente. La
        pagaiata a intervalli aumenta il consumo di calorie.
    - q: Lo SUP è adatto per perdere peso?
      a: >-
        Sì, combinato con una corretta alimentazione. Il coinvolgimento full-body
        e la natura a basso impatto lo rendono sostenibile per l'esercizio
        regolare.
    - q: Posso fare allenamento di forza su un SUP?
      a: >-
        Sì — squat, affondi, flessioni e plank in tavola aggiungono la sfida
        dell'equilibrio agli esercizi di forza.
    - q: Quali muscoli lavora lo SUP?
      a: >-
        Principali: core (obliqui, trasverso dell'addome), schiena (dorsali,
        trapezi), spalle (deltoidi), braccia (bicipiti, tricipiti). Secondari:
        gambe (quadricipiti, ischiocrurali, polpacci).
