- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Regole di etichetta del surf (come non diventare la persona che tutti evitano)
  description: >-
    Il lineup ha delle regole e nessuno le scrive. Impara il diritto di
    precedenza, perché fare snake ti farà urlare addosso, come scusarti e gli
    errori da principiante che infastidiscono ogni surfista locale.
  definition: >-
    L'etichetta del surf è un codice di condotta non scritto che previene le
    collisioni e ripartisce le onde in modo equo. La regola fondamentale: il
    surfista più vicino al picco dell'onda che si rompe ha il diritto di
    precedenza.
  tldr: >-
    Il surfista più vicino al picco dell'onda che frange ha il diritto di
    precedenza. Non fare drop in su qualcuno, non fare snake (pagaiare intorno
    a qualcuno per prendere la sua onda) e scusati sempre se sbagli. Pagai in
    largo attorno al lineup, tieni il controllo della tavola e sii cordiale — il
    rispetto genera rispetto.
  problem: >-
    Pagai verso un lineup affollato e senti subito la tensione. I surfisti ti
    guardano di traverso, qualcuno ti urla contro e non hai idea di cosa abbia
    fatto di sbagliato. Il lato sociale del surf sembra più intimidatorio delle
    onde stesse.
  explanation: >-
    L'etichetta del surf esiste per prevenire le collisioni e ripartire le onde
    in modo equo. La regola fondamentale è il diritto di precedenza: il
    surfista più vicino al picco (dove l'onda si rompe per prima) ha la
    priorità. Chiunque pagai verso la stessa onda stando più dentro deve
    tirarsi fuori. Lo snaking — pagaiare intorno a un altro surfista per rubare
    la priorità — è considerato l'infrazione più grave. Oltre alla precedenza,
    il lineup ha aspettative su rumore (riduci al minimo le urla), controllo
    della tavola (non avvicinare mai la tavola agli altri) e cordialità (un
    semplice cenno del capo basta e avanza).
  solution: >-
    Osserva il lineup per 10 minuti prima di entrare in acqua. Individua chi
    prende più onde — sono i surfisti da rispettare ed evitare. Resta
    all'interno (zona dell'acqua bianca) se stai imparando. Pagai in largo
    attorno al lineup, non attraverso. Quando prendi un'onda, guarda da
    entrambi i lati prima di alzarti e assicurati che nessuno sia più dentro.
  recommendation: >-
    Trascorri le prime sessioni in un break adatto ai principianti con poca
    gente. Impara a leggere la precedenza prima di affrontare un lineup
    affollato. Se fai drop in su qualcuno, scusati subito e pagai verso di lui
    — la maggior parte dei surfisti rispetta un errore onesto.
  faq:
    - q: Cosa significa fare drop in?
      a: >-
        Fare drop in significa pagaiare verso e cavalcare un'onda su cui un
        altro surfista ha già la precedenza. È pericoloso e irrispettoso. Il
        surfista più vicino al picco possiede l'onda; chiunque altro deve
        tirarsi fuori.
    - q: Cos'è lo snaking?
      a: >-
        Lo snaking consiste nel pagaiare intorno a un altro surfista già in
        posizione per un'onda, in modo da ritrovarti più vicino al picco. È
        considerato un comportamento estremamente scorretto e può portare a
        scontri.
    - q: I principianti possono fare surf in un break affollato?
      a: >-
        Sì, ma resta nella zona dell'acqua bianca, lontano dal picco. Non
        pagaiare verso la zona principale di takeoff finché non riesci a prendere
        le onde con costanza e a controllare la direzione. I lineup affollati
        richiedono esperienza per essere affrontati in sicurezza.
    - q: Come ci si scusa in acqua?
      a: >-
        Basta un gesto della mano, un sorriso e un "colpa mia" o un "scusa".
        Riconosci l'errore e pagai lontano dalla persona. I surfisti in generale
        perdonano gli errori onesti, soprattutto se è evidente che stai
        imparando.
    - q: Cosa devo fare se qualcuno fa drop in su di me?
      a: >-
        Se è un drop in chiaro, urla "onda" o "hey" per avvisarlo. Se l'ha
        presa per sbaglio e si scusa, lascia perdere. Se qualcuno continua a
        fare drop in, pagai vicino e spiega con educazione il diritto di
        precedenza. Evita i confronti.
