    15-18 PSI. Il manometro integrato consente un monitoraggio preciso del
    gonfiaggio. Le pagaie presentano pale rinforzate e giunti regolabili.
  solution: >-
    Usa la modalità ad alto volume per il gonfiaggio iniziale (entrambe le
    camere) e passa alla modalità a camera singola per il gonfiaggio finale ad
    alta pressione. Le pagaie si montano in pochi secondi e si smontano per lo
    stoccaggio.
  recommendation: >-
    Accessorio essenziale per ogni proprietario di tavole e gommoni Aquafarer.
    La pompa riduce significativamente i tempi di gonfiaggio rispetto alle
    pompe economiche a camera singola.
  faq:
    - q: Quanto è più veloce la pompa a doppia camera?
      a: >-
        Circa il doppio rispetto a una pompa a camera singola. Un SUP si gonfia
        in 2-3 minuti invece di 5-8 minuti.
    - q: Il manometro è preciso?
      a: >-
        Sì, il manometro è calibrato e legge con precisione entro 1 PSI
