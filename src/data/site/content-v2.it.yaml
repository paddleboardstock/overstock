- slug: sup-navigation-guide
  category: guide
  type: safety
  title: 'Navigazione in SUP: restare sulla rotta e orientarsi'
  description: >-
    Abilità di navigazione di base per i pagaiatori di SUP — leggere le carte
    nautiche, usare i punti di riferimento, comprendere i sistemi di boe e usare
    GPS e bussola per una pagaiata sicura.
  definition: >-
    La navigazione in SUP prevede l'uso di punti di riferimento, carte
    nautiche, GPS e la consapevolezza di vento e corrente per percorrere in
    sicurezza il tragitto e tornare al punto di partenza.
  tldr: >-
    Scegli sempre un punto di riferimento all'orizzonte quando pagai dritto.
    Controllalo ogni pochi minuti per correggere la deriva. Usa le app GPS sul
    telefono in custodia impermeabile. Impara le basi della navigazione con la
    bussola. Comprendi i sistemi di boe laterali (red-right-returning, rossa a
    destra al rientro). Comunica il tuo piano di navigazione a qualcuno sulla
    riva.
  problem: >-
    Pagai verso il largo in acque aperte e quando ti giri, la costa ha un
    aspetto completamente diverso. Senza abilità di navigazione puoi
    disorientarti e pagaiare nella direzione sbagliata.
  explanation: >-
    La navigazione in SUP si basa su riferimenti visivi perché sei vicino
    all'acqua. Scegli un punto di riferimento caratteristico (edificio, albero,
    scogliera) dietro il punto di lancio. Usalo come rilevamento all'indietro
    per tornare. Vento e corrente ti spingeranno fuori rotta — correggi
    continuamente. Per i tragitti più lunghi, usa un'app GPS o un orologio.
    Tieni presente che la costa vista dall'acqua appare diversa rispetto a
    quando la guardi da terra.
  solution: >-
    Prima del lancio: individua 2-3 punti di riferimento a distanze diverse
    dietro il punto di partenza. Usa un'app GPS (Google Maps, Gaia GPS) in
    modalità aereo per risparmiare la batteria. Conosci la direzione di vento e
    marea — pagaia prima contro vento / contro corrente. Per le traversate in
    acque aperte, usa un rilevamento con la bussola.
  recommendation: >-
    Tieni un telefono in custodia impermeabile come backup GPS. Esercitati
    nella navigazione con punti di riferimento in acque note prima di
    avventurarti in nuovi luoghi. Il Life Vest Pro ha una tasca adatta al
    telefono.
  faq:
    - q: 'Quali punti di riferimento sono migliori per la navigazione in SUP?'
      a: >-
        Elementi caratteristici e permanenti come serbatoi d'acqua, edifici
        alti, alberi particolari o scogliere prominenti. Evita barche o
        bandiere che si muovono.
    - q: 'Come navigo nella nebbia?'
      a: >-
        Non uscire a pagaiare nella nebbia. Se vieni sorpreso dalla nebbia, usa
        GPS o bussola per orientarti. Suona un fischietto ogni 30 secondi. Resta
        vicino alla riva.
    - q: 'Mi serve una carta nautica per il SUP?'
      a: >-
        Per la pagaiata costiera, una carta semplice aiuta a individuare
        pericoli, profondità e canali di navigazione. Molte app forniscono
        queste informazioni.
    - q: 'Come navigo tra le barche?'
      a: >-
        Resta in acque basse lontano dai canali. Indossa colori vivaci.
        Attraversa i canali velocemente e con un angolo di 90 gradi. Stabilisci
        un contatto visivo con i conduttori delle barche.
