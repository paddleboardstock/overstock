- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: 'Muta 3mm vs 5mm: l''errore più comune dei principianti in acqua fredda'
  description: >-
    Smetti di congelare a metà sessione o di surriscaldarti in spiaggia. La vera
    differenza tra mute da 3mm e 5mm — tabella delle temperature, compromessi
    sulla flessibilità e ciò che funziona davvero per il surf in acqua fredda.
  definition: >-
    Una muta è un indumento in neoprene che intrappola un sottile strato
    d'acqua contro la pelle, riscaldato dal calore corporeo per l'isolamento. Lo
    spessore (3mm, 5mm) determina l'intervallo di temperature che la muta può
    gestire: più è spessa, più è calda ma meno flessibile.
  tldr: >-
    Lo spessore della muta determina direttamente calore e flessibilità. Usa una
    3mm per acque sopra i 16°C e una 5mm per acque tra 8°C e 16°C. Le mute più
    spesse limitano i movimenti ma ti tengono caldo più a lungo: dai sempre
    priorità alla vestibilità, non al marchio.
  problem: >-
    Apri un negozio online o entri in un surf shop e vedi mute etichettate 3/2,
    4/3, 5/4 e tute complete da 5mm. I numeri non significano molto finché non
    ti rendi conto che lo spessore sbagliato significa congelare a metà sessione
    o surriscaldarti e sudare in spiaggia.
  explanation: >-
    Le mute funzionano intrappolando un sottile strato d'acqua tra la pelle e il
    neoprene; il tuo corpo riscalda quell'acqua, creando isolamento. Il
    neoprene più spesso intrappola più acqua ma limita flessibilità e
    galleggiamento. Una muta da 3mm (spesso 3/2 con braccia più sottili) si
    adatta a condizioni miti, mentre una da 5mm (5/4/3 o intera 5mm) è per
    l'acqua fredda. Le chiusure con zip sul petto sigillano meglio di quelle
    sulla schiena e riducono i ricambi d'acqua (flushing). La costruzione delle
    cuciture — incollate e a punto cieco (GBS) — fa la differenza tra una muta
    che perde e una che tiene caldo.
  solution: >-
    Abbina lo spessore alla temperatura dell'acqua locale con un margine di
    errore di 5°C. Per climi temperati compra una 3/2mm. Per l'acqua fredda
    compra una 5/4/3mm. Aggiungi stivali, guanti e cappuccio per estendere il
    range di altri 5°C verso il basso. Prova le mute prima di comprarle o scegli
    un marchio con una politica di reso generosa.
  recommendation: >-
    La Aquafarer Wetsuit Pro in 5/4/3mm è ideale per la maggior parte dei
    surfisti di acqua fredda, con cuciture GBS e fodera termica. Se fai surf in
    acque calde sopra i 20°C, una 3/2mm con zip sul petto è la scelta migliore.
  faq:
    - q: Quale temperatura dell'acqua richiede una muta da 5mm?
      a: >-
        Temperature dell'acqua tra 8°C e 14°C richiedono una muta da 5mm. Sotto
        gli 8°C ti serve una tuta con cappuccio 6/5/4mm. Tra 14°C e 18°C una
        4/3mm funziona bene per la maggior parte delle persone.
    - q: Posso indossare una muta da 3mm in inverno?
      a: >-
        Solo in climi invernali miti in cui l'acqua rimane sopra i 16°C. Per un
        vero surf invernale è necessaria una 5mm o 5/4/3mm. Stivali, guanti e
        cappuccio aggiungono lo stesso calore senza bisogno di un torso più
        spesso.
    - q: Quanto deve essere aderente una muta?
      a: >-
        Vestibilità comoda ma non costrittiva. Non devono esserci tasche d'aria
        né neoprene allentato. Se riesci a far scorrere un dito tra la pelle e
        la muta nella parte bassa della schiena, è troppo larga. Se respirare è
        difficile o i movimenti sono gravemente limitati, sali di taglia.
    - q: Le mute costose tengono più caldo?
      a: >-
        Un prezzo più alto spesso significa neoprene migliore (a base di calcare
        invece che di petrolio), cuciture migliori (GBS invece che solo
        incollate) e una migliore flessibilità. Questi fattori influiscono
        direttamente su calore e durata, ma solo se la vestibilità è corretta.
