- slug: how-to-choose-a-wetsuit
  category: guide
  type: buying-guide
  title: 'Come scegliere una muta: vestibilità, spessore e caratteristiche'
  description: >-
    Guida completa all'acquisto di una muta. Come scegliere lo spessore giusto
    per la temperatura dell'acqua, garantire la corretta vestibilità, capire i
    tipi di cuciture e scegliere le caratteristiche in base alla tua attività.
  definition: >-
    La muta è un indumento in neoprene che fornisce isolamento termico
    intrappolando un sottile strato d'acqua contro la pelle. Fattori chiave di
    scelta: spessore, vestibilità, tipo di cucitura, sistema di apertura e tipo
    di neoprene.
  tldr: >-
    Abbina lo spessore alla temperatura dell'acqua: 3/2 mm per 14-20°C, 4/3 mm
    per 12-18°C, 5/4/3 mm per 8-14°C, 6/5/4 mm al di sotto di 8°C. La
    vestibilità è il fattore più importante. Le cuciture GBS sono lo standard di
    riferimento. La cerniera frontale minimizza il flushing (ricambio d'acqua).
    Il neoprene al calcare è più flessibile di quello a base di petrolio.
  problem: >-
    Le tabelle delle taglie online sono inaffidabili, i consigli sullo spessore
    variano da marca a marca e le descrizioni delle caratteristiche sono
    confuse.
  explanation: >-
    I numeri di spessore della muta (3/2, 4/3, 5/4/3) indicano i mm di
    busto/braccia e gambe. Le mute più spesse sono più calde ma limitano i
    movimenti. Una muta larga lascia fuoriuscire l'acqua calda (flushing). Le
    cuciture GBS sono calde e flessibili; quelle flatlock sono meno calde.
    L'apertura con cerniera frontale è più calda di quella posteriore. Il
    neoprene al calcare è più flessibile in acqua fredda.
  solution: >-
    Misura petto, vita, fianchi e altezza. Confronta con le tabelle delle
    taglie. Scegli lo spessore in base alla temperatura dell'acqua più fredda.
    Per l'acqua fredda opta per cuciture GBS. Sotto i 15°C preferisci la
    cerniera frontale. Considera una fodera termica per un calore extra.
  recommendation: >-
    La muta Aquafarer Wetsuit Pro in 3/2 mm (14-20°C) o 5/4/3 mm (8-16°C) offre
    cuciture GBS, cerniera frontale e neoprene al calcare a un prezzo
    competitivo.
  faq:
    - q: Quanto deve essere aderente una muta?
      a: >-
        Aderente, senza sacche d'aria ma non costrittiva. Un dito non deve
        scorrere facilmente nella zona lombare.
    - q: Qual è il tipo di muta più caldo?
      a: >-
        Una muta da 6/5/4 mm con cappuccio, cuciture sigillate e cerniera
        frontale. Per il freddo estremo, una muta stagna (dry suit) è superiore.
    - q: Vale la pena comprare una muta più cara?
      a: >-
        Un prezzo più alto compra un neoprene, cuciture e caratteristiche
        migliori. Per un uso regolare in acqua fredda, il sovrapprezzo vale la
        pena.
    - q: Posso usare la muta per attività diverse dal surf?
      a: >-
        Sì — la muta funziona per SUP, kayak, immersioni, triathlon e nuoto in
        acque libere.
