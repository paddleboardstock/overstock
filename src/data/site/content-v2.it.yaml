- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'Guida alla pagaia SUP: scegli la pagaia giusta per il tuo stile'
  description: >-
    Guida completa alle pagaie SUP — lunghezza, materiali (alluminio, fibra di
    vetro, carbonio), forme della pala e come la scelta della pagaia influisce
    sulla tua esperienza di pagaiata.
  definition: >-
    Una pagaia SUP è composta da un'asta (alluminio, fibra di vetro o carbonio)
    e una pala (dihedrale, a cucchiaio o piatta). La lunghezza dovrebbe essere
    8-10" sopra la tua altezza per la pagaiata generale.
  tldr: >-
    Lunghezza pagaia: 8-10" sopra la tua altezza per uso generale, 6-8" per il
    surf, 10-12" per il touring. Materiali: alluminio (economico, pesante),
    fibra di vetro (fascia media, buona flessibilità), carbonio (leggero,
    rigido, costoso). Forma della pala: dihedrale (traiettoria stabile), a
    cucchiaio (potenza), piatta (versatile). Le pagaie regolabili sono ottime
    per i principianti.
  problem: >-
    La pagaia inclusa con la maggior parte degli iSUP funziona ma è pesante e
    inefficiente. L'upgrade migliora l'efficienza e il piacere della pagaiata,
    ma le opzioni sono confuse.
  explanation: >-
    La lunghezza della pagaia influenza l'efficienza della pagaiata — troppo
    corta richiede di piegarsi, troppo lunga causa affaticamento delle spalle.
    Il materiale determina il peso: le pagaie in carbonio pesano 18-24 oz
    contro le 28-36 oz dell'alluminio. La dimensione della pala influenza la
    potenza: pale più grandi (100+ sq in) forniscono più propulsione per
    pagaiata ma affaticano più in fretta. Le pale dihedrali mantengono la
    traiettoria dritta; le pale a cucchiaio offrono più presa.
  solution: >-
    Per la lunghezza corretta: stai con la pagaia verticale, alza il braccio —
    il manico della pagaia dovrebbe raggiungere il polso. Per il materiale:
    inizia con la fibra di vetro come upgrade di peso intermedio. Per la pala:
    scegli la dihedrale per la pagaiata generale. Per le attività: le pagaie da
    touring sono più lunghe con pale più piccole; le pagaie da surf sono più
    corte con pale più larghe.
  recommendation: >-
    La pagaia in carbonio Aquafarer da 28 oz è il miglior upgrade per chi
    pagaià di frequente. La pagaia regolabile in alluminio a 3 pezzi inclusa è
    adeguata per principianti e viaggi.
  faq:
    - q: Quanto deve essere lunga la mia pagaia SUP?
      a: >-
        Misura la tua altezza in pollici e aggiungi 8-10 per la pagaiata
        generale. Per il surf, aggiungi 6-8. Per il touring, aggiungi 10-12.
    - q: Vale la pena spendere per una pagaia in carbonio?
      a: >-
        Sì per chi pagaià regolarmente — la riduzione di peso diminuisce
        significativamente l'affaticamento nelle sessioni lunghe. Per un uso
        occasionale, la fibra di vetro è un buon rapporto qualità-prezzo.
    - q: Cos'è una pagaia regolabile?
      a: >-
        Una pagaia in 2 o 3 pezzi con regolazione della lunghezza, ideale per
        essere condivisa tra diversi utilizzatori o regolata per diverse
        attività.
    - q: Come mi prendo cura della mia pagaia?
      a: >-
        Risciacqua con acqua dolce dopo l'uso in acqua salata. Evita di
        passarci sopra con il veicolo o di riporla al caldo diretto. Controlla
        la presenza di sabbia nel giunto.
