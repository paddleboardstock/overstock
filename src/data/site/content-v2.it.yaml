- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Manutenzione dei Gommoni: Proteggi il Tuo Investimento'
  description: >-
    Checklist annuale di manutenzione del gommone. Pulizia, protezione UV,
    ispezione delle cuciture, gestione della pressione, cura del motore e
    rimessaggio invernale per gommoni in PVC e Hypalon.
  definition: >-
    La manutenzione di un gommone comprende pulizia, protezione UV, gestione
    della pressione, ispezione di cuciture e valvole, prevenzione della muffa e
    un corretto rimessaggio fuori stagione.
  tldr: >-
    Risciacqua dopo ogni utilizzo in acqua salata. Applica un protettivo UV ogni
    2-3 mesi. Controlla la pressione di gonfiaggio prima di ogni uscita.
    Ispeziona cuciture, valvole e specchia di poppa ogni mese. Pulisci con un
    sapone delicato. Fuori stagione, conserva l'imbarcazione sgonfia in un luogo
    fresco e asciutto.
  problem: >-
    Hai usato il tuo gommone per una stagione e ora i tubolari sono sbiaditi, una
    cucitura trasuda e la specchia di poppa è spugnosa — tutto evitabile con una
    manutenzione ordinaria.
  explanation: >-
    Le radiazioni UV degradano la matrice polimerica. Il sale cristallizza nelle
    pieghe e abrade il tessuto. La muffa cresce nell'umidità intrappolata. Una
    pressione errata causa affaticamento del materiale. La specchia di poppa
    (soprattutto quella in compensato) assorbe acqua attraverso i fori delle
    viti.
  solution: >-
    Dopo ogni utilizzo: risciacqua con acqua dolce, asciuga e controlla la
    pressione. Ogni mese: passa un protettivo UV sui tubolari, ispeziona le
    cuciture e controlla le valvole. Ogni anno: pulizia profonda, controllo
    della specchia di poppa per marciume, lubrificazione delle valvole e
    verifica di micro-perdite.
  recommendation: >-
    Usa il protettivo 303 Aerospace Protectant sui tubolari dei gommoni
    Aquafarer. Ogni anno rimuovi le valvole e applica grasso al silicone.
    Conserva l'imbarcazione nella borsa di trasporto con una bustina di gel di
    silice.
  faq:
    - q: 'Posso usare la candeggina per pulire il mio gommone?'
      a: >-
        No — la candeggina danneggia il rivestimento del tessuto. Usa un sapone
        delicato e acqua tiepida. Per la muffa, usa aceto bianco diluito.
    - q: 'Con quale frequenza devo applicare il protettivo UV?'
      a: >-
        Ogni 2-3 mesi durante la stagione d'uso. Più frequentemente nei climi
        tropicali.
    - q: 'Devo sgonfiare il mio gommone tra un utilizzo e l''altro?'
      a: >-
        No, se lo usi settimanalmente. Lascialo gonfio con una copertura anti-UV
        sopra. Per pause mensili, sgonfialo e riponilo.
    - q: 'Come mantengo la specchia di poppa?'
      a: >-
        Controlla i bulloni ogni mese. Sigilla ogni anno i bordi esposti del
        legno con vernice nautica. Sostituiscila se compaiono zone ammorbidite.
