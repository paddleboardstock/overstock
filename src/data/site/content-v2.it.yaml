- slug: sup-launch-techniques
  category: guide
  type: tutorial
  title: 'Tecniche di lancio in SUP: come iniziare bene la tua sessione di pagaiata'
  description: >-
    Corrette tecniche di lancio in SUP per diversi tipi di riva — spiagge
    sabbiose, coste rocciose, pontili e argini fluviali. Evita l'inciampo goffo
    e inizia ogni sessione senza intoppi.
  definition: >-
    La tecnica di lancio in SUP è il metodo per passare dalla riva all'acqua
    mantenendo equilibrio e controllo della tavola. Diversi tipi di riva
    richiedono approcci diversi.
  tldr: >-
    Spiaggia sabbiosa: posiziona la tavola al bordo dell'acqua, sali e pagaia
    via. Costa rocciosa: porta la tavola a piedi attraverso l'acqua bassa prima
    di salirci. Pontile: siediti sulla tavola dal pontile e usa la pagaia per
    spingerti via. Argine del fiume: lancia in direzione della corrente con un
    angolo. Aggancia sempre il leash prima di entrare in acqua.
  problem: >-
    Gonfi la tavola e cammini fino al bordo dell'acqua, poi ti rendi conto che
    non hai idea di come salirci senza fare brutta figura o cadere subito.
  explanation: >-
    La tecnica di lancio varia in base al tipo di riva. Sulle spiagge sabbiose,
    l'approccio più semplice è posizionare la tavola parallela alla riva in
    acqua alta fino alla caviglia, salirci e pagaiare dritto verso il largo.
    Sulle coste rocciose, devi portare la tavola fino all'acqua alta fino al
    ginocchio prima di salirci per non danneggiarla. Dai pontili, siediti sulla
    tavola mentre sei ancora sul pontile e poi spingiti via.
  solution: >-
    Lancio sulla sabbia: posiziona la tavola perpendicolare alla riva, sali con
    un piede, spingi con l'altro, inginocchiati e poi alzati. Lancio sulle
    rocce: porta la tavola in acqua alta fino al ginocchio e sali da dietro.
    Lancio dal pontile: posiziona la tavola parallela al pontile, siediti sulla
    tavola dal pontile e spingiti via delicatamente.
  recommendation: >-
    Esercitati prima nei lanci in condizioni calme. La piattaforma larga
    dell'Aquafarer SUP Explorer 11 rende il lancio più facile. Aggancia sempre
    il leash prima di salire sulla tavola.
  faq:
    - q: 'Come faccio il lancio tra le onde?'
      a: >-
        Aspetta una pausa tra le serie di onde. Posiziona la tavola in acqua
        alta fino alla caviglia, sali in fretta e pagaia con energia per
        superare la zona di frangente prima della serie successiva.
    - q: 'Posso lanciarmi da qualsiasi spiaggia?'
      a: >-
        Controlla i punti di accesso e le normative locali. Alcune spiagge hanno
        aree di lancio designate. Evita le aree di lancio frequentate da
        nuotatori.
    - q: 'Come atterro?'
      a: >-
        Avvicinati perpendicolarmente alla riva. Scendi dalla tavola in acqua
        bassa appena le pinne toccano il fondo. Trasporta la tavola sopra la
        linea dell'acqua.
    - q: 'E se c''è un frangente di riva forte?'
      a: >-
        Scegli il momento del lancio tra un'onda e l'altra. Tieni saldamente la
        tavola di traverso rispetto alle onde. Se il frangente è troppo forte,
        cerca un punto di lancio diverso.
