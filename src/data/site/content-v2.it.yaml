- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard vs shortboard (la risposta onesta che nessuno ti dà)
  description: >-
    I longboard prendono più onde; gli shortboard virano con più decisione. La
    vera domanda è quale corrisponde al tuo livello e ai tuoi break locali.
    Confronto onesto su stabilità, numero di onde e la trappola della
    progressione.
  definition: >-
    I longboard (9ft+) privilegiano stabilità e facilità nel prendere le onde;
    gli shortboard (5-7ft) privilegiano manovrabilità e prestazioni sulle onde
    ripide. La scelta giusta dipende dal tuo livello di abilità e dai tipi di
    onde locali.
  tldr: >-
    I longboard (9ft+) sono stabili, prendono le onde facilmente e sono adatti
    a principianti e surfisti orientati alla crociera. Gli shortboard (5-7ft)
    sono reattivi, più veloci sulla faccia dell'onda e adatti ai surfisti
    avanzati. La scelta giusta dipende dal tuo livello di abilità, dal tipo di
    onda e da cosa ti piace di più del surf.
  problem: >-
    Vedi video di surfisti che fanno virate decise sugli shortboard e di
    longboarder che planano con eleganza sul muso — entrambi sembrano
    divertenti. Hai il budget per un solo tipo di tavola e devi sapere quale
    stile corrisponde ai tuoi obiettivi e ai tuoi break locali.
  explanation: >-
    I longboard hanno più superficie, il che significa che pagaiano più
    velocemente, prendono le onde prima e offrono una piattaforma stabile per
    camminate e cross-step. Eccellono nelle onde piccole e lente dove uno
    shortboard affonderebbe. Gli shortboard hanno meno volume e un rocker più
    aggressivo, il che permette di affondare più in profondità nella faccia
    dell'onda, generare velocità attraverso le virate e inserirsi nelle sezioni
    ripide e cave. Gli shortboard richiedono una pagaiata forte e un tempismo
    preciso sulle onde. Un'idea sbagliata comune: gli shortboard non sono
    "migliori" — sono semplicemente strumenti diversi per condizioni e livelli
    di abilità diversi.
  solution: >-
    Se sei un principiante, cavalca un longboard (o un gonfiabile ad alto
    volume) per almeno 6 mesi. Se sei intermedio e le onde locali sono spesso
    piccole e lente, un longboard o un ibrido prenderà più onde e sarà più
    divertente. Se le tue onde sono ripide, cave e veloci, uno shortboard
    diventa necessario per inserirsi nel pocket. Molti surfisti intermedi
    possiedono entrambi e scelgono in base alla giornata.
  recommendation: >-
    Inizia con la Aquafarer Surfboard Pro come piattaforma in stile longboard.
    Quando riesci a fare virate e a generare velocità con costanza, considera
    di aggiungere un ibrido o uno shortboard per le giornate con onde ripide.
    La maggior parte dei surfisti che prova lo shortboard troppo presto finisce
    frustrata e cavalca meno onde.
  faq:
    - q: Un longboard è più facile da cavalcare di uno shortboard?
      a: >-
        Molto più facile. I longboard prendono le onde prima, pagaiano più
        velocemente e sono più stabili durante i pop-up e il trim. Gli
        shortboard richiedono tempismo preciso, pagaiata più forte e migliore
        lettura delle onde.
    - q: Si possono fare virate con un longboard?
      a: >-
        Sì, anche se lo stile è diverso. Le virate del longboard sono più
        ampie, più fluide e coinvolgono tutto il corpo. Il nose riding, i
        cutback e gli hang-five sono manovre specifiche del longboard con la
        propria progressione di abilità.
    - q: Quale tavola è migliore per onde piccole?
      a: >-
        I longboard e gli ibridi rendono meglio nelle onde piccole e deboli
        perché generano planata e mantengono lo slancio. Gli shortboard hanno
        bisogno di onde più ripide e potenti per rendere al meglio.
    - q: Uno shortboard è più difficile da pagaiare?
      a: >-
        Significativamente più difficile. Il volume inferiore significa che la
        tavola sta più bassa in acqua, creando più resistenza. Pagaiare uno
        shortboard è come nuotare con un paracadute di trascinamento rispetto
        a pagaiare un longboard.
