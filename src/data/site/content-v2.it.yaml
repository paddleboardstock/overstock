  problem: >-
    I normali giubbotti salvagente in schiuma sono ingombranti e limitano il
    movimento della pagaiata, soprattutto in SUP dove serve piena mobilità di
    braccia e busto.
  explanation: >-
    Il Life Vest Pro utilizza un sistema di gonfiaggio a CO2 che resta compatto
    da sgonfio e offre 33 lb di galleggiabilità da gonfio. Il design a basso
    profilo poggia piatto sul torace, consentendo pagaiate senza limitazioni.
    Il gonfiaggio automatico di riserva si attiva all'immersione, mentre la
    cordicella di sgancio manuale garantisce un gonfiaggio immediato. La
    sottogamba integrata impedisce al giubbotto di risalire in acqua.
  solution: >-
    Indossalo sgonfio durante la pagaiata normale: è comodo e discreto. In caso
    di emergenza, tira la cordicella per un gonfiaggio immediato o affidati
    alla riserva automatica se cadi in acqua. La galleggiabilità di 33 lb offre
    un galleggiamento superiore anche in condizioni mosse.
  recommendation: >-
    A 129 $, il Life Vest Pro è il miglior giubbotto di salvataggio gonfiabile
    per SUP e kayak. Combina il comfort durante l'uso attivo con un
    galleggiamento affidabile quando serve.
  faq:
    - q: Ogni quanto devo sostituire la cartuccia CO2?
      a: >-
        Sostituiscila dopo ogni gonfiaggio, oppure ogni anno se la cartuccia non
        è stata usata. Controlla la finestrella indicatrice prima di ogni
        utilizzo.
    - q: L'attivazione automatica è affidabile?
      a: >-
        Sì — l'attivazione idrostatica è testata per attivarsi all'immersione in
        2-4 secondi. La riserva manuale offre ridondanza.
    - q: Come mantengo il Life Vest Pro?
      a: >-
        Risciacqualo con acqua dolce dopo l'uso in acqua salata. Controlla la
        cartuccia ogni anno. Sostituisci la capsula ogni 2-3 anni. Conservalo in
        un luogo asciutto.
