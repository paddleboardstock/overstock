- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'Autosoccorso in SUP: come risalire sulla tavola in acque profonde'
  description: >-
    Ogni appassionato di SUP dovrebbe padroneggiare l'autosoccorso. Tecniche
    passo dopo passo per risalire sulla tavola in acque profonde, trascinarla
    fino a riva e gestire i grovigli del leash.
  definition: >-
    L'autosoccorso in SUP è la tecnica per risalire sulla tavola da paddle in
    acque profonde dopo una caduta, incluse il recupero della tavola, la
    risalita del corpo e il recupero della pagaia.
  tldr: >-
    Dopo la caduta: mantieni la calma, non mollare la pagaia, nuota verso la
    tavola. Appoggia la pagaia di traverso sulla tavola. Usa una pedalata a
    delfino per spingere il petto sulla tavola. Solleva una gamba, poi l'altra.
    Prima in ginocchio, poi in piedi. Allenati in acque calme finché non
    diventa un gesto automatico.
  problem: >-
    Cadi dal tuo SUP in acque profonde e non riesci a risalire. La tavola è
    scivolosa, sei stanco e subentra il panico. Senza conoscere la tecnica di
    autosoccorso, una semplice caduta diventa pericolosa.
  explanation: >-
    L'autosoccorso ha tre fasi: recupero (nuotare fino alla tavola e alla
    pagaia), risalita (tornare sulla tavola) e prosecuzione (riprendere a
    pagaiare). La tecnica chiave consiste nell'usare la pagaia come
    stabilizzatore e nel dare potenti pedalate per spingere la parte superiore
    del corpo sulla tavola.
  solution: >-
    Fase 1: nuota fino alla tavola. Mantieni la presa sulla pagaia o recuperala.
    Fase 2: appoggia la pagaia perpendicolarmente di traverso sulla tavola.
    Pedala vigorosamente con le gambe mentre porti il petto al centro della
    tavola. Fase 3: una volta che il petto è sulla tavola, solleva le gambe una
    alla volta. Fase 4: inginocchiati, riprendi fiato, poi alzati gradualmente.
  recommendation: >-
    Esercitati nell'autosoccorso in condizioni controllate finché non riesci a
    farlo in modo automatico. Usa l'Aquafarer SUP Explorer 11, che ha una buona
    aderenza del deck. Il Life Vest Pro fornisce galleggiamento aggiuntivo se
    fatichi.
  faq:
    - q: 'Come risalgo se sono esausto?'
      a: >-
        Resta vicino alla tavola per il galleggiamento. Usa le braccia per
        portare il petto sulla tavola, anche se le gambe non riescono a pedalare
        efficacemente. Riposa in posizione inginocchiata prima di alzarti.
    - q: 'E se perdo la pagaia?'
      a: >-
        Usa le braccia per spingere la tavola verso riva. Chiedi aiuto a un
        altro pagaiatore. Sostituisci subito la pagaia persa.
    - q: 'Posso effettuare l''autosoccorso tra le onde?'
      a: >-
        Sì — posiziona la tavola perpendicolare alle onde. Scegli il momento
        per risalire tra un'onda e l'altra. Il leash tiene la tavola vicina.
    - q: 'Come gestisco un groviglio del leash?'
      a: >-
        Mantieni la calma, mettiti a galleggiare sulla schiena e sbroglia il
        leash lentamente. Se il leash è attorcigliato attorno alle pinne,
        potrebbe essere necessario rimuoverle stando in acqua.
