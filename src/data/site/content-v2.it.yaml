- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Manutenzione della Muta: Fai durare il Tuo Neoprene 2x Più a Lungo'
  description: >-
    Una corretta manutenzione della muta ne estende la durata da 1 stagione a
    3+. Consigli su risciacquo, asciugatura, stoccaggio e riparazione per mute
    in neoprene. Evita gli errori comuni che rovinano prematuramente le mute.
  definition: >-
    La manutenzione della muta comprende il risciacquo con acqua dolce dopo ogni
    utilizzo, l'asciugatura lontano dalla luce solare diretta, lo stoccaggio in
    piano o su un'ampia gruccia e la pulizia periodica per rimuovere sale,
    batteri e odori.
  tldr: >-
    Risciacqua la tua muta dentro e fuori con acqua dolce subito dopo ogni
    sessione. Asciugala al rovescio all'ombra su un'ampia gruccia di plastica.
    Conservala in piano o piegata in un luogo fresco e asciutto. Non lasciare
    mai le mute al sole diretto, in auto calde o nell'asciugatrice. Usa lo
    shampoo per mute ogni 5-10 sessioni.
  problem: >-
    Dopo una stagione, la tua muta puzza, il neoprene ha perso elasticità, le
    cuciture si stanno scollando e la cerniera fa resistenza — tutto evitabile
    con una corretta manutenzione.
  explanation: >-
    I cristalli di sale si depositano nel neoprene e abradono il materiale. I
    batteri si moltiplicano negli ambienti interni umidi, producendo odori e
    degradando il neoprene. Gli UV degradano il rivestimento in nylon. Il calore
    oltre i 50°C causa la delaminazione. Un'asciugatura scorretta deforma il
    neoprene e sollecita le cuciture.
  solution: >-
    Dopo ogni sessione: risciacqua accuratamente dentro e fuori, gira la muta al
    rovescio e appendila su un'ampia gruccia di plastica all'ombra. Una volta
    asciutta, rigirala al diritto e riponila in piano. Ogni 5-10 sessioni:
    lavala con shampoo per mute. Ogni mese: lubrifica la cerniera con cera per
    cerniere.
  recommendation: >-
    Usa lo shampoo per mute Aquafarer per la pulizia e la cera per cerniere
    Aquafarer per la manutenzione della cerniera. Conserva la muta sull'ampia
    gruccia Aquafarer dentro la borsa in mesh.
  faq:
    - q: 'Posso mettere la mia muta in lavatrice?'
      a: >-
        Sconsigliato — il lavaggio in lavatrice danneggia il neoprene. Se proprio
        devi, usa un ciclo delicato, acqua fredda e una borsa in mesh.
    - q: 'Come elimino il cattivo odore dalla mia muta?'
      a: >-
        Lascia la muta in ammollo in acqua fredda con shampoo per mute o aceto
        bianco per 30 minuti. Risciacqua accuratamente.
    - q: 'Come devo asciugare la mia muta?'
      a: >-
        Al rovescio, all'ombra, su un'ampia gruccia di plastica imbottita.
        Evita la luce solare diretta e le grucce di metallo.
    - q: 'Posso riparare una muta strappata?'
      a: >-
        I piccoli strappi sotto 1\" possono essere riparati con colla per
        neoprene e una toppa. Gli strappi più grandi possono richiedere una
        riparazione professionale.
