- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Riparazione della muta: aggiusta tu stesso strappi, cuciture e cerniere'
  description: >-
    Guida fai-da-te alla riparazione della muta per strappi nel neoprene,
    cuciture che si aprono, cerniere bloccate e ginocchiere spaccate. Istruzioni
    passo passo con cemento per neoprene.
  definition: >-
    La riparazione di una muta consiste nel pulire e smerigliare la zona
    danneggiata, applicare il cemento per neoprene e lasciare polimerizzare
    sotto pressione per ripristinare l'integrità stagna e la flessibilità.
  tldr: >-
    Strappi piccoli sotto 1 pollice (2,5 cm): applica il cemento per neoprene su
    entrambi i lati, attendi 10-15 minuti finché non diventa appiccicoso, premi
    con forza e lascia polimerizzare 12 ore sotto peso. Gli strappi più grandi
    richiedono una toppa in neoprene. Problemi di cerniera: lubrificala prima,
    poi controlla che il tessuto non si sia incastrato.
  problem: >-
    La tua muta ha un piccolo strappo, una cucitura che si sta aprendo o una
    cerniera che fa attrito. Senza riparazione fai-da-te paghi 150$+ per una
    muta nuova quando la riparazione costa 5$.
  explanation: >-
    Il cemento per neoprene agisce ammorbidendo la superficie del neoprene e
    creando un legame chimico mentre il solvente evapora. Il cemento va applicato
    su entrambe le superfici e deve diventare appiccicoso prima di unirle. Per
    gli strappi i bordi devono combaciare con precisione. I problemi di cerniera
    sono spesso dovuti a corrosione da sale o tessuto incastrato tra i denti.
  solution: >-
    Per gli strappi: pulisci con alcol, carteggia leggermente, applica un
    sottile strato di cemento su entrambi i bordi, attendi che diventi
    appiccicoso, premi perfettamente insieme, applica un peso e lascia
    polimerizzare 12-24 ore. Per le toppe: taglia una toppa più grande di 1
    pollice (2,5 cm) rispetto allo strappo, applica il cemento su entrambe e
    blocca con morsetti. Per la cerniera: risciacqua, applica cera per cerniere
    e muovila delicatamente.
  recommendation: >-
    Tieni un kit di riparazione per mute Aquafarer nella tua sacca da mare. Per
    riparazioni importanti o per rotture delle cuciture in punti critici, è
    consigliata una riparazione professionale.
  faq:
    - q: Posso usare la super colla su una muta?
      a: >-
        No — la super colla secca e diventa dura e fragile. Usa solo cemento per
        neoprene o aquaseal per le riparazioni della muta.
    - q: Quanto dura una riparazione con cemento per neoprene?
      a: >-
        Una riparazione fatta bene è spesso più resistente del neoprene originale
        e dura per il resto della vita della muta.
    - q: Posso riparare una cerniera completamente separata?
      a: >-
        Se il binario si è staccato dal neoprene, riincolla con colla a contatto.
        Se i denti sono danneggiati, fai sostituire la cerniera da un
        professionista.
    - q: Come sistemo una muta che perde lungo la cucitura?
      a: >-
        Applica un sottile cordone di aquaseal lungo l'interno della cucitura che
        perde e lascia polimerizzare per 24 ore.
