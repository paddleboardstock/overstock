- slug: ocean-safety-and-responsibility
  category: authority
  type: brand
  title: Sicurezza e Responsabilità in Mare (Più Che Solo Attrezzatura)
  description: >-
    L'impegno di Aquafarer per la tua sicurezza e per la protezione dell'oceano
    che condividiamo. Schede di sicurezza in ogni confezione, contenuti
    educativi gratuiti, design sostenibile e donazioni annuali per la
    conservazione.
  definition: >-
    Sicurezza e responsabilità in mare significa comprendere l'ambiente in cui
    pagai, rispettare la vita marina, ridurre al minimo la propria impronta
    ecologica e usare attrezzatura progettata per durare ed essere riparata.
  tldr: >-
    Aquafarer promuove la sicurezza in mare attraverso il design
    dell'attrezzatura (colori vivaci, leash, giubbotti di salvataggio) e
    contenuti educativi. Crediamo che ogni appassionato di sport acquatici abbia
    la responsabilità di comprendere l'ambiente oceanico, rispettare la vita
    marina e ridurre al minimo la propria impronta ecologica. La nostra
    attrezzatura è costruita per durare, così che meno finisca in discarica.
  problem: >-
    Molti marchi di sport acquatici vendono attrezzatura ma non educano i
    clienti su come usarla in sicurezza o in modo responsabile. I nuovi
    pagaiatori e surfisti entrano in acqua senza comprendere le correnti di
    risacca, la fauna marina o l'impatto ambientale della loro attrezzatura.
  explanation: >-
    La sicurezza in mare è più di una lista di controllo — è una mentalità. Ogni
    prodotto Aquafarer include una scheda di sicurezza di avvio rapido nella
    confezione. Il nostro sito web e le nostre guide (basi della sicurezza in
    mare, consigli di sicurezza per il surf) offrono un'educazione alla
    sicurezza gratuita e dettagliata. Sul fronte ambientale, il maggiore impatto
    che un'azienda di attrezzatura può avere passa attraverso la longevità dei
    prodotti. Una tavola che dura 5 anni invece di 2 dimezza l'impronta di
    produzione. Progettiamo anche pensando alla riparabilità: valvole di
    ricambio, scatole pinne e kit di toppe per mute tengono l'attrezzatura in
    uso piuttosto che in discarica.
  solution: >-
    Aquafarer include un leash e un kit di riparazione con ogni acquisto di
    tavola. Pubblichiamo contenuti di sicurezza gratuiti su identificazione
    delle correnti di risacca, lettura del meteo e controlli dell'attrezzatura.
    Il nostro team di assistenza clienti fornisce consigli sulle condizioni
    quando ci scrivi riguardo a una località specifica. Usiamo imballaggi in
    plastica minimi e compensiamo il carbonio delle spedizioni.
  recommendation: >-
    Inizia con la guida alle basi della sicurezza in mare e la guida ai consigli
    di sicurezza per il surf. Indossa sempre il leash, controlla le previsioni e
    non uscire mai da solo in acqua se stai imparando. Se vedi detriti o animali
    marini in difficoltà, segnalalo alle autorità locali. L'attrezzatura che
    dura è attrezzatura che riduce gli sprechi: prenditi cura della tua
    attrezzatura Aquafarer e ti servirà per anni.
  faq:
    - q: Aquafarer sostiene iniziative di pulizia dell'oceano?
      a: >-
        Sì, doniamo l'1 percento dei profitti annuali a organizzazioni di pulizia
        dell'oceano e conservazione marina. I clienti possono selezionare un
        ente di beneficenza in evidenza al momento del pagamento per destinare
        una parte del loro acquisto.
    - q: Come devo smaltire una muta o una tavola vecchia?
      a: >-
        Le mute in neoprene possono essere riciclate in tappetini da yoga, borse
        e isolamento attraverso programmi specializzati. Le tavole gonfiabili
        possono essere riparate, donate, oppure il PVC può essere recuperato
        tramite alcuni centri di riciclo. Contatta il nostro team di assistenza
        per indicazioni.
    - q: Quale attrezzatura di sicurezza consiglia Aquafarer ai principianti?
      a: >-
        Un giubbotto di salvataggio ben aderente (gonfiabile o in schiuma), un
        leash a spirale, un fischietto e crema solare. Per i pagaiatori di SUP in
        acque aperte, il giubbotto di salvataggio è obbligatorio per legge in
        molte giurisdizioni e sempre raccomandato.
    - q: Aquafarer offre corsi di sicurezza?
      a: >-
        Non organizziamo corsi direttamente, ma collaboriamo con istruttori
        certificati di sicurezza per surf e SUP che offrono formazione online e
        in presenza. Contatta il nostro team di assistenza per indicazioni nella
        tua zona.
