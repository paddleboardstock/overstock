- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Riparazione del SUP Gonfiabile: Ripara Forature, Perdite e Problemi alla Valvola'
  description: >-
    Guida fai-da-te alla riparazione del SUP gonfiabile. Come trovare una
    perdita lenta, applicare una toppa su una foratura, sostituire una valvola
    e risolvere la delaminazione del deck pad con il kit di riparazione
    incluso.
  definition: >-
    La riparazione di un SUP gonfiabile consiste nel localizzare le perdite
    d''aria con il test dell''acqua saponata, nel pulire e smerigliare la zona
    danneggiata, nell''applicare adesivo PVC e toppa e nel lasciare
    polimerizzare sotto pressione.
  tldr: >-
    Trova le perdite con l''acqua saponata. Pulisci e smeriglia la zona intorno
    alla foratura con carta vetrata. Applica la colla per PVC sia sulla toppa
    sia sulla tavola, attendi 5 minuti, premi con decisione e lascia
    polimerizzare sotto peso per 24 ore. Per le perdite dalla valvola, controlla
    prima l''O-ring. Le forature piccole sotto 1/4" sono facili da riparare in
    fai-da-te.
  problem: >-
    Gonfi il tuo SUP e al mattino ha perso pressione. Senza conoscenze di
    riparazione, rischi una costosa sostituzione per ciò che probabilmente è
    una semplice foratura.
  explanation: >-
    La maggior parte dei SUP gonfiabili usa un nucleo drop-stitch con strati
    esterni in PVC. Una foratura attraverso il PVC esterno crea una perdita
    lenta. Riparazione standard: pulisci, smeriglia, applica adesivo
    compatibile con il PVC, premi la toppa sotto peso. Le perdite dalle valvole
    sono più comuni delle forature sui pannelli: l''O-ring si secca o i detriti
    ne impediscono la tenuta.
  solution: >-
    Gonfia la tavola al PSI massimo e ascolta se sibila. Spruzza acqua saponata
    in modo sistematico, soprattutto intorno alle cuciture e alla valvola.
    Segna i punti dove si formano bolle. Sgonfia, pulisci con alcol, smeriglia
    con grana 80, applica la colla per PVC su toppa e tavola, attendi che
    diventi appiccicosa, premi con decisione e lascia sotto peso per 24 ore.
  recommendation: >-
    Usa il kit di riparazione Aquafarer incluso con tutte le tavole Aquafarer.
    Porta sempre con te il kit di riparazione nei viaggi. Per i problemi alla
    valvola, contatta l''assistenza Aquafarer. Per tagli grandi o separazioni
    delle cuciture, è consigliata una riparazione professionale.
  faq:
    - q: Posso riparare un taglio grande nel mio SUP gonfiabile?
      a: >-
        I tagli oltre 1\" possono richiedere una riparazione professionale o
        una toppa su entrambi i lati. Le separazioni delle cuciture lungo il
        bordo non possono essere riparate in modo affidabile sul campo.
    - q: Quanto dura una toppa riparativa?
      a: >-
        Una riparazione eseguita correttamente con la tecnica giusta dura
        quanto la vita della tavola. Una scarsa adesione dovuta a una pulizia
        inadeguata porta a guasti futuri.
    - q: Posso riparare una valvola che perde?
      a: >-
        Spesso sì. Rimuovi il nucleo della valvola, ispeziona l''O-ring,
        puliscilo o sostituiscilo, applica lubrificante al silicone e rimonta.
    - q: Cosa succede se non riesco a trovare la perdita?
      a: >-
        Gonfia al PSI pieno e immergi in vasca da bagno o in piscina sezioni
        successive della tavola. Le perdite troppo piccole per essere trovate
        possono essere legate alla temperatura.
