- slug: surfboard-size-guide
  category: guide
  type: buying-guide
  title: Guida alle misure delle tavole da surf (è il volume ciò che conta davvero)
  description: >-
    Smetti di tirare a indovinare con le misure delle tavole. Il volume in
    litri determina tutto: con quanta facilità prendi le onde, quanto ti senti
    stabile e quanto velocemente progredisci. Trova i tuoi litri ideali in 2
    minuti.
  definition: >-
    La misura di una tavola da surf riguarda soprattutto il volume (litri), non
    la lunghezza. Il volume determina galleggiamento e capacità di prendere le
    onde. Le tavole più lunghe pagaiano più velocemente; quelle più larghe sono
    più stabili; quelle più spesse offrono più volume senza lunghezza
    aggiuntiva.
  tldr: >-
    La misura della tavola riguarda il volume, non solo la lunghezza. I
    principianti hanno bisogno di 60-80 litri, i livelli intermedi di 35-55
    litri e i surfisti avanzati di 20-35 litri. Usa il peso come fattore
    principale: ogni 10 kg servono circa 10-12 litri di volume a livello
    principiante.
  problem: >-
    Davanti a uno scaffale di tavole con numeri come 7'2" x 22" x 3" stampati
    sul rail, non hai idea di come si sentano quelle misure in acqua. Comprare
    in base all'aspetto o a ciò che usa un amico porta a una tavola troppo
    instabile o troppo difficile da pagaiare.
  explanation: >-
    La misura di una tavola da surf si capisce meglio attraverso tre dimensioni:
    lunghezza (potenza di pagaiata e presa d'onda), larghezza (stabilità) e
    spessore (volume e galleggiamento). Il numero che conta davvero è il volume
    in litri. Le tavole in schiuma e quelle gonfiabili raggiungono un volume
    elevato grazie a larghezza e spessore invece che a una lunghezza eccessiva,
    rendendole gestibili per i principianti. Man mano che migliori, riduci il
    volume per permettere alla tavola di affondare più in profondità nella
    parete dell'onda e di virare con più reattività.
  solution: >-
    Usa un calcolatore volume-peso: per i principianti, dividi il tuo peso in kg
    per 1.5 per ottenere i litri ideali. Per il livello intermedio, dividi per
    2. I livelli intermedi dovrebbero cercare tavole con rocker moderato e coda
    a squash o arrotondata per ottenere versatilità.
  recommendation: >-
    La Aquafarer Surfboard Pro offre 75 litri di volume in un formato da 10'6"
    — ideale per principianti fino a 90 kg. I rider più leggeri possono scendere
    alla SUP Tour 12 per una sensazione più manovrabile man mano che
    progrediscono.
  faq:
    - q: L'altezza conta per la misura della tavola?
      a: >-
        L'altezza conta meno del peso. Un surfista alto e leggero ha bisogno di
        meno volume di uno basso e pesante della stessa altezza. Usa il peso
        come parametro principale e regola in base a forma fisica e forza di
        pagaiata.
    - q: Cosa succede se la mia tavola ha troppo volume?
      a: >-
        Troppo volume rende la tavola galleggiante e instabile sulla parete
        dell'onda. Farai fatica a far affondare il rail per le virate e potresti
        rimbalzare sull'acqua durante i bottom turn.
    - q: Cosa succede se la mia tavola ha troppo poco volume?
      a: >-
        Farai fatica a pagaiare dentro le onde, affonderai troppo durante il
        takeoff e ti sentirai instabile anche solo seduto sulla tavola ad
        aspettare. I principianti hanno quasi sempre bisogno di più volume di
        quanto pensino.
    - q: Come faccio a sapere quando scendere di volume?
      a: >-
        Quando riesci a prendere le onde con costanza, a completare il pop-up
        con scioltezza e a fare virate di base sulla tua tavola attuale, è il
        momento di scendere di 5-10 litri. Scendere troppo presto rallenta i
        tuoi progressi.
