- slug: touring-sup-guide
  category: guide
  type: buying-guide
  title: 'Guida al SUP Touring: Scegli la Tavola Giusta per la Pagaiata su Lunghe Distanze'
  description: >-
    I SUP touring sono più lunghi, più stretti e progettati per velocità e
    planata. Come scegliere una tavola touring, attrezzatura essenziale per
    pagaiate lunghe e tecnica per coprire le distanze in modo efficiente.
  definition: >-
    Un SUP touring è una tavola lunga (12-14') e stretta (30-32') progettata per
    una pagaiata efficiente sulle distanze. Le caratteristiche includono una
    punta a dislocamento per tagliare l'acqua, una linea di galleggiamento più
    lunga per la planata e spesso un sistema di carico a elastico.
  tldr: >-
    I SUP touring privilegiano velocità e mantenimento della rotta rispetto alla
    stabilità. Lunghezza minima di 12' per l'efficienza, larghezza di 30-32" per
    un equilibrio tra planata e stabilità. Caratteristiche chiave: punta a
    dislocamento, profilo dritto, più configurazioni di pinne. Attrezzatura
    essenziale: PFD, leash, acqua, telefono e sistema a elastico per
    l'attrezzatura. La tecnica si concentra su pagaiate lunghe e fluide con
    rotazione del busto.
  problem: >-
    Pagaiare con una tavola tuttofare in un viaggio su lunghe distanze ti lascia
    esausto. La punta larga prende le onde corte, la tavola non mantiene la
    rotta e spendi più energia a correggere la direzione che a planare. Ti serve
    una tavola progettata per le distanze.
  explanation: >-
    I SUP touring usano una carena a dislocamento (punta appuntita) che divide
    l'acqua invece di cavalcarvi sopra, riducendo significativamente la
    resistenza. La linea di galleggiamento più lunga aumenta la velocità della
    carena. La larghezza ridotta diminuisce la resistenza ma richiede un
    migliore equilibrio. Le tavole touring hanno pinne più lunghe per la
    stabilità direzionale. Le tavole touring gonfiabili richiedono un PSI più
    alto (18-20) per mantenere la rigidità ed evitare la flessione che spreca
    energia.
  solution: >-
    Scegli una tavola touring di almeno 12' con punta a dislocamento. Larghezza:
    30" per i pagaiatori esperti, 31-32" per gli intermedi. Cerca una scatola
    pinna centrale più pinne laterali per la stabilità. Gonfia al PSI massimo
    indicato. Equipaggia con corde a elastico per il carico, PFD, fischietto e
    telefono in custodia impermeabile.
  recommendation: >-
    L'Aquafarer SUP Tour 12, da 12' x 31" x 6", è un gonfiabile touring ideale.
    La sua punta a dislocamento taglia efficacemente le onde corte e il sistema
    a elastico tiene l'attrezzatura per le gite di un giorno. Abbinala alla
    pagaia in carbonio Aquafarer per una pagaiata efficiente su lunghe distanze.
  faq:
    - q: Posso usare una tavola tuttofare per il touring?
      a: >-
        Per tour brevi sotto i 5 km, sì. Per distanze più lunghe, la punta più
        larga e la linea di galleggiamento più corta ti stancheranno più in
        fretta.
    - q: Che lunghezza di SUP touring mi serve?
      a: >-
        12' è il minimo per l'efficienza touring. 12'6" è una buona lunghezza
        intermedia. 14' è per le gare e il touring avanzato.
    - q: I SUP touring gonfiabili si comportano bene come le tavole rigide?
      a: >-
        I gonfiabili drop-stitch moderni ad alto PSI si comportano in modo simile
        alle tavole rigide per il touring. La leggera flessione può anzi essere
        più confortevole con le onde corte.
    - q: Quale pagaia è migliore per il touring?
      a: >-
        Una pagaia leggera in carbonio o fibra di vetro con una pala più grande
        (100-110 pollici quadrati) per la potenza. Una pagaia regolabile
        permette di passare tra touring e surf.
