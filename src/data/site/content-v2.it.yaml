- slug: marine-life-vest-guide
  category: guide
  type: buying-guide
  title: 'Guida ai Gilet di Salvataggio Nautici: Scegli il PFD Giusto per la Tua Attività Acquatica'
  description: >-
    Guida completa all'acquisto del gilet di salvataggio per SUP, kayak,
    gommoni RIB e vela. Tipi di PFD (a schiuma vs gonfiabili), linee guida sulla
    vestibilità, requisiti legali e caratteristiche per ogni attività.
  definition: >-
    Un gilet di salvataggio o dispositivo di galleggiamento personale (PFD) è un
    equipaggiamento di sicurezza progettato per mantenere una persona a galla in
    acqua. I tipi vanno dal Tipo I (altomare) al Tipo V (uso speciale).
  tldr: >-
    Scegli il PFD in base all'attività: cintura gonfiabile per il SUP, gilet a
    schiuma per il kayak, schiuma di Tipo III per RIB e imbarcazioni a motore.
    Caratteristiche chiave: approvazione USCG o ISO, pannelli riflettenti,
    fischietto di soccorso, anello a D per il leash, colori vivaci.
  problem: >-
    Vedi file di gilet di salvataggio che vanno da $20 a $300 e non hai idea di
    quale sia adatto alla tua attività o conforme ai requisiti legali.
  explanation: >-
    I gilet di salvataggio sono classificati per tipo: Tipo I (altomare, gira il
    nuotatore privo di sensi a faccia in su), Tipo II (vicino alla costa), Tipo
    III (ausilio al galleggiamento, il più comune), Tipo IV (lanciabile), Tipo V
    (uso speciale). I gilet gonfiabili usano cartucce di CO2 — meno ingombranti
    ma richiedono manutenzione. I gilet a schiuma non richiedono manutenzione ma
    sono più ingombranti.
  solution: >-
    Per il SUP: scegli una cintura o un gilet gonfiabile (33 lb di
    galleggiamento). Per il kayak: schiuma di Tipo III con ampi ritagli sotto le
    braccia. Per i RIB: schiuma di Tipo III o gonfiabile con almeno 22 lb di
    galleggiamento, nastro riflettente e fischietto di soccorso.
  recommendation: >-
    L'Aquafarer Life Vest Pro (gonfiabile, 33 lb) è ideale per SUP e kayak.
    L'Aquafarer Life Vest Classic (a schiuma, Tipo III) è perfetto per i gommoni
    RIB e l'uso nautico in generale.
  faq:
    - q: 'Mi serve un gilet di salvataggio per il SUP?'
      a: >-
        Sì — obbligatorio per legge in molte giurisdizioni e sempre consigliato.
        Indossa una cintura o un gilet gonfiabile per gli sport a pagaia.
    - q: 'I gilet di salvataggio gonfiabili sono sicuri?'
      a: >-
        Sì, con una corretta manutenzione. Controlla la cartuccia di CO2 ogni
        anno e sostituisci la capsula ogni 2-3 anni.
    - q: 'Quale gilet di salvataggio è migliore per un bambino?'
      a: >-
        Un gilet a schiuma di Tipo II o III approvato USCG con collare,
        sottogamba e colori vivaci. Non usare mai gilet gonfiabili per i
        bambini.
    - q: 'Come deve calzare un gilet di salvataggio?'
      a: >-
        Aderente — il gilet non deve sollevarsi sopra le orecchie quando viene
        tirato su dalle spalle. Tutte le cerniere e le fibbie allacciate.
