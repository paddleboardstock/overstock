- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Cosa indossare per fare surf (non presentarti in pantaloncini quando ti serve una 5/4)
  description: >-
    Smetti di tirare a indovinare cosa indossare. È la temperatura dell'acqua,
    non quella dell'aria, a determinare il tuo abbigliamento da surf. Guida
    completa a strati, dai rash guard tropicali alle configurazioni invernali
    complete 5/4/3mm.
  definition: >-
    L'abbigliamento da surf spazia da pantaloncini e rash guard in acqua calda a
    mute complete 5/4/3mm con stivali e cappuccio in acqua fredda. È la
    temperatura dell'acqua, non quella dell'aria, a determinare ciò di cui hai
    bisogno.
  tldr: >-
    Ciò che indossi per il surf dipende interamente dalla temperatura
    dell'acqua, non da quella dell'aria. Rash guard e pantaloncini vanno bene
    sopra i 22°C, le mute primaverili coprono 18-22°C, le mute complete 3/2mm
    gestiscono 14-18°C e sotto i 14°C servono 5/4/3mm con stivali. Indossa
    sempre protezione UV e valuta un leash e un giubbotto anti-impatto.
  problem: >-
    Arrivi in spiaggia e non hai idea se un rash guard basta o se ti serve una
    muta completa. L'aria è calda ma l'acqua è fredda, oppure l'acqua sembra ok
    ma il vento gela. Vestirsi male significa una sessione rovinata.
  explanation: >-
    L'abbigliamento da surf serve a tre scopi: isolamento termico, protezione UV
    e prevenzione delle abrasioni. Le mute in neoprene sono classificate per
    spessore e copertura — le mute primaverili (maniche o gambe corte) sono per
    i giorni al limite, le mute complete per l'acqua fredda. I rash guard
    proteggono dallo sfregamento della tavola e dal sole ma non hanno valore
    termico. Stivali, guanti e cappuccio non sono accessori ma equipaggiamento
    essenziale per il surf in acque fredde sotto i 12°C.
  solution: >-
    Controlla la boa locale o il bollettino live della temperatura dell'acqua
    prima di uscire. Costruisci un kit in base alla tua condizione fredda
    tipica: rash guard e shorts per l'estate, una muta completa 3/2mm per
    primavera e autunno, una 5/4/3mm con stivali e cappuccio per l'inverno.
    Aggiungi sempre un leash e valuta un giubbotto di galleggiamento per la
    sicurezza.
  recommendation: >-
    Investi prima in una buona muta completa 3/2mm: copre la gamma più ampia di
    condizioni. Aggiungi una muta 5/4/3mm e stivali se pensi di fare surf per
    tutto l'inverno. La Aquafarer Wetsuit Pro con fodera termica copre
    efficacemente entrambi gli intervalli di temperatura.
  faq:
    - q: Posso fare surf solo con i pantaloncini?
      a: >-
        Sì, in acque tropicali sopra i 24°C. Potresti volere un rash guard per
        prevenire lo sfregamento di petto e braccia causato dalla pagaiata. La
        cera o un traction pad sulla tavola aiutano a compensare la mancanza di
        presa della muta.
    - q: Servono stivali da surf?
      a: >-
        Se la temperatura dell'acqua scende sotto i 14°C, gli stivali prevengono
        l'intorpidimento e proteggono i piedi da rocce e tagli della barriera
        corallina. Aggiungono anche aderenza sulla tavola. La maggior parte dei
        surfisti nei climi settentrionali usa gli stivali da novembre a marzo.
    - q: Cos'è una muta primaverile (spring suit)?
      a: >-
        Una spring suit è una muta a maniche o gambe corte (o entrambe)
        progettata per acque tra 18°C e 22°C. Offre più calore di un rash guard
        ma meno copertura di una muta completa.
    - q: Dovrei indossare un giubbotto salvagente mentre faccio surf?
      a: >-
        Non i tradizionali salvagenti, ma un giubbotto anti-impatto o un ausilio
        di galleggiamento può aiutare in condizioni difficili o se sei un
        nuotatore debole. I giubbotti Aquafarer sono progettati per SUP e kayak
        ma possono dare maggiore fiducia di galleggiamento ai principianti del
        surf.
