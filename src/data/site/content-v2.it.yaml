- slug: life-jacket-buying-guide
  category: guide
  type: buying-guide
  title: 'Guida all''acquisto del salvagente: tipi, vestibilità e caratteristiche'
  description: >-
    Guida completa all'acquisto del giubbotto di salvataggio per gli sport
    acquatici. Tipi di PFD (dal I al V), gonfiabili vs foam, prova della
    vestibilità e consigli specifici per SUP, kayak, uscite in barca e pesca.
  definition: >-
    Un giubbotto di salvataggio o PFD è un dispositivo di galleggiamento
    progettato per tenere la testa di una persona fuori dall'acqua. I tipi sono
    regolamentati dalla Guardia Costiera statunitense (USCG) in base alla
    galleggiabilità e all'uso previsto.
  tldr: >-
    Cinque tipi di PFD: Tipo I (offshore, 22+ libbre), Tipo II (vicino alla
    costa), Tipo III (aiuto al galleggiamento, il più comune), Tipo IV
    (lanciabile), Tipo V (uso speciale). I giubbotti gonfiabili sono comodi ma
    richiedono la manutenzione della bomboletta CO2. I giubbotti in foam non
    richiedono manutenzione ma sono più ingombranti.
  problem: >-
    I giubbotti di salvataggio sono classificati per tipi e capacità di
    galleggiamento, ma i negozi non sempre spiegano quale tipo si adatta alla
    tua attività.
  explanation: >-
    Il Tipo I offre la massima galleggiabilità e gira chi lo indossa privo di
    sensi a faccia in su. Il Tipo II potrebbe non girare a faccia in su tutti
    gli utilizzatori. Il Tipo III consente libertà di movimento per gli sport
    attivi. Il Tipo V include le cinture gonfiabili per il SUP. I PFD gonfiabili
    offrono 33-37 libbre di galleggiabilità e sono compatti da sgonfi.
  solution: >-
    Per il SUP: cintura gonfiabile Tipo V. Per il kayak: Tipo III in foam con
    aperture ampie per le braccia. Per la navigazione in RIB: Tipo III in foam o
    gonfiabile con galleggiabilità da 22+ libbre. Per i bambini: Tipo II o III
    in foam con cinghia tra le gambe.
  recommendation: >-
    Aquafarer Life Vest Pro (Tipo V gonfiabile, 33 libbre) per SUP e kayak.
    Aquafarer Life Vest Classic (Tipo III in foam, 16.5 libbre) per la
    navigazione in RIB e l'uso nautico generale.
  faq:
    - q: Quale tipo di PFD mi serve per il SUP?
      a: >-
        Molte giurisdizioni accettano il Tipo III o il Tipo V per il SUP. Le
        cinture gonfiabili sono molto diffuse. Controlla le leggi locali.
    - q: I PFD gonfiabili richiedono manutenzione?
      a: >-
        Sì — controlla la bomboletta CO2 ogni anno, sostituisci la bobina ogni
        2-3 anni e risciacqua dopo l'uso in acqua salata.
    - q: Posso indossare un PFD in foam per il SUP?
      a: >-
        Sì, ma scegline uno con aperture ampie per le braccia. I giubbotti in
        foam sono più ingombranti ma non richiedono manutenzione.
    - q: Quale PFD è il migliore per un bambino?
      a: >-
        Un giubbotto in foam di Tipo II o III approvato USCG con collare,
        cinghia tra le gambe e colori vivaci. Non usare mai PFD gonfiabili per i
        bambini.
