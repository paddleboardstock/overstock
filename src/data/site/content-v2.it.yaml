- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP con il tuo cane: guida completa passo dopo passo'
  description: >-
    Il paddle boarding con il tuo cane — preparazione, sicurezza, fasi di
    addestramento, consigli sull'attrezzatura e suggerimenti per un'esperienza
    divertente per entrambi.
  definition: >-
    Lo SUP con il cane prevede di addestrare il tuo amico a quattro zampe a
    mantenersi in equilibrio su una tavola da paddle, dotarlo di un PFD per cani
    e pagaiare in sicurezza insieme.
  tldr: >-
    Inizia con uno SUP largo e stabile (34"+). Procura al tuo cane un giubbotto
    di salvataggio ben aderente con maniglia. Introduci la tavola prima a terra,
    poi in acque basse. Inizia con sessioni brevi e rinforzo positivo. Porta
    sempre acqua per il tuo cane. Osserva i segnali di stress o affaticamento.
  problem: >-
    Il tuo cane ama l'acqua, ma non sei sicuro di come farlo salire sullo SUP in
    sicurezza. Senza un addestramento adeguato, il cane può andare nel panico,
    saltare giù o graffiare la tavola.
  explanation: >-
    I cani sanno nuotare naturalmente, ma devono imparare che la tavola è una
    piattaforma sicura. La chiave è la desensibilizzazione graduale: presenta
    la tavola su un terreno solido, premia il comportamento calmo, poi passa
    all'acqua bassa e infine all'acqua più profonda.
  solution: >-
    Inizia a terra: lascia che il cane annusi e cammini sulla tavola
    (sull'erba). Premia il comportamento calmo. Poi: metti la tavola in acqua
    molto bassa, tienila ferma e lascia che il cane ci salga in piedi. Premialo.
    Poi: sali tu sulla tavola in acque basse e fai salire il cane. Infine:
    pagaia lentamente in acque calme.
  recommendation: >-
    Usa l'Aquafarer SUP Explorer 11 per la sua piattaforma stabile da 33".
    Aggiungi un PFD per cani (giubbotto di salvataggio). Porta acqua fresca e
    una ciotola. Inizia con sessioni da 10 minuti e aumenta gradualmente.
  faq:
    - q: 'Che misura di SUP mi serve per il mio cane?'
      a: >-
        Una tavola larga 33-34" offre stabilità per cani di taglia media e
        grande. I cani piccoli (sotto i 10 kg) possono cavarsela su tavole da
        32"+.
    - q: 'Il mio cane ha bisogno di un giubbotto di salvataggio?'
      a: >-
        Sì — anche i cani che nuotano bene hanno bisogno di un PFD con maniglia
        per un recupero facile in caso di emergenza.
    - q: 'Come proteggo la tavola dagli artigli?'
      a: >-
        Tieni le unghie del cane corte. Usa un protettore per deck pad o un
        asciugamano. In genere i cani si abituano e smettono di graffiare una
        volta a loro agio.
    - q: 'Qualsiasi cane può imparare il SUP?'
      a: >-
        La maggior parte dei cani può imparare con pazienza. I cani ansiosi
        potrebbero richiedere più tempo. Non forzare mai un cane spaventato
        sulla tavola — crea associazioni negative.
