- slug: sup-pump-guide
  category: guide
  type: buying-guide
  title: 'Guida alla pompa SUP: pompe manuali vs elettriche'
  description: >-
    Guida completa alle pompe SUP — manuali a doppia camera, a camera singola ed
    elettriche. Come scegliere la pompa migliore per le tue esigenze, consigli
    di manutenzione e tecniche di gonfiaggio.
  definition: >-
    Una pompa SUP è un dispositivo usato per gonfiare le tavole gonfiabili fino
    alla pressione richiesta (tipicamente 15-20 PSI). I tipi includono pompe
    manuali a camera singola, manuali a doppia camera ed elettriche.
  tldr: >-
    Le pompe manuali a doppia camera sono lo standard per gli iSUP di qualità —
    gonfiano il doppio più velocemente di quelle a camera singola. Le pompe
    elettriche gonfiano senza sforzo ma richiedono alimentazione a batteria e
    gonfiano più lentamente vicino al PSI massimo. Le pompe manuali sono più
    affidabili e non richiedono batterie. Scegli la doppia camera manuale per
    l'affidabilità, quella elettrica per la comodità.
  problem: >-
    Gonfiare il tuo SUP richiede troppo tempo o troppo sforzo. Una pompa di
    bassa qualità rende il gonfiaggio un'operazione faticosa che scoraggia le
    sessioni di pagaiata spontanee.
  explanation: >-
    Le pompe a camera singola spostano aria solo nella corsa di discesa — servono
    10-15 minuti per gonfiare un SUP. Le pompe a doppia camera usano entrambe le
    camere per un alto volume nel gonfiaggio iniziale (riempiendo la tavola) e
    passano a un'unica camera ad alta pressione per la pressione finale. Questo
    riduce il tempo di gonfiaggio a 3-5 minuti. Le pompe elettriche usano
    alimentazione a 12V e gonfiano automaticamente ma rallentano sensibilmente
    all'aumentare della pressione.
  solution: >-
    Per la maggior parte degli utenti, la pompa a doppia camera inclusa offre il
    miglior equilibrio tra velocità, affidabilità e zero dipendenza dalle
    batterie. Se pratichi SUP di frequente o hai limitazioni fisiche, considera
    una pompa elettrica. Porta sempre una pompa manuale di riserva anche se usi
    principalmente quella elettrica.
  recommendation: >-
    La pompa a doppia camera Aquafarer inclusa con tutte le tavole è eccellente
    — gonfia a 15 PSI in meno di 4 minuti. Mantieni lubrificata la valvola e
    controlla il manometro una volta all'anno.
  faq:
    - q: Qual è più veloce, manuale o elettrica?
      a: >-
        Le pompe manuali a doppia camera (3-5 minuti) sono spesso più veloci di
        quelle elettriche (5-10 minuti) perché le pompe elettriche rallentano
        notevolmente ad alta pressione.
    - q: Posso usare una pompa per pneumatici dell'auto per il mio SUP?
      a: >-
        No — le pompe per pneumatici spostano poco volume ad altissima
        pressione. Le pompe SUP necessitano di alto volume a pressione media.
    - q: Come capisco quando la mia pompa ha bisogno di manutenzione?
      a: >-
        Se pompare richiede più sforzo del solito, la pressione si stabilizza
        prima di raggiungere il PSI massimo, o il manometro segna valori
        incoerenti, controlla le guarnizioni O-ring e i raccordi della valvola.
    - q: Le pompe elettriche danneggiano la tavola?
      a: >-
        No, se hanno lo spegnimento automatico alla pressione impostata. Il
        pompaggio continuo oltre il PSI massimo può danneggiare i fili drop-stitch.
