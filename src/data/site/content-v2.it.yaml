- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: Muta 3mm vs muta 5mm (cosa funziona davvero nel surf in acque fredde)
  description: >-
    La scelta tra muta 3mm e 5mm dipende dalla temperatura dell'acqua, non
    dell'aria. Tabella delle temperature, confronto di flessibilità e quale
    spessore ti tiene al caldo senza limitare la pagaiata.
  definition: >-
    Una muta da 3mm è adatta ad acqua a 14-20°C con buona flessibilità. Una
    muta da 5mm copre 8-14°C con il massimo calore ma mobilità ridotta. La
    scelta è un compromesso diretto tra calore e libertà di movimento.
  tldr: >-
    Le mute da 3mm sono per acqua a 14-20°C e offrono la massima flessibilità.
    Le mute da 5mm sono per 8-14°C e privilegiano il calore. Scegli in base
    alla temperatura dell'acqua locale, non dell'aria. Se fai surf in tutte le
    stagioni, possedile entrambe. Se puoi comprarne solo una, una 4/3mm offre
    il miglior compromesso.
  problem: >-
    Ti serve una muta ma non riesci a decidere tra una 3mm e una 5mm. Una 3mm
    potrebbe non essere abbastanza calda in inverno, e una 5mm potrebbe essere
    troppo spessa e restrittiva per le giornate più calde. Sbagliare la scelta
    significa o congelare tutto l'inverno o sudare tutto l'autunno.
  explanation: >-
    Lo spessore del neoprene è direttamente correlato al calore e inversamente
    correlato alla flessibilità. Una muta da 3mm (spesso 3/2mm con maniche più
    sottili) offre buona mobilità per pagaiare e surfare in condizioni miti. Una
    muta da 5mm usa neoprene più spesso sul busto e spesso pannelli più sottili
    su braccia e gambe (5/4/3mm) per mantenere una certa flessibilità. La
    differenza di calore è di circa 6-8°C di intervallo. Differenze chiave: le
    mute da 5mm usano più materiale neoprenico, pesano circa il 40 percento in
    più, impiegano più tempo ad asciugarsi e richiedono più sforzo per essere
    tolte. I neopreni super-stretch moderni stanno riducendo il divario di
    flessibilità, ma la 5mm limita comunque sensibilmente i movimenti.
  solution: >-
    Determina la tua temperatura media mensile più fredda dell'acqua usando i
    dati delle boe locali. Se è sopra i 16°C, compra una 3/2mm. Se è tra
    12-16°C, compra una 4/3mm. Se è sotto i 12°C, compra una 5/4/3mm. Per il
    surf tutto l'anno con una sola muta, una 4/3mm di qualità con fodera
    termica più cappuccio, scarpe e guanti separati copre la gamma più ampia.
  recommendation: >-
    La muta Aquafarer Wetsuit Pro in 5/4/3mm gestisce 8-16°C con fodera termica
    che compensa il divario di calore rispetto a una vera 5mm. Se fai surf
    soprattutto in condizioni miti (16-20°C), la muta Aquafarer Wetsuit Pro in
    3/2mm offre migliore flessibilità e comfort.
  faq:
    - q: Posso indossare una 3mm in acqua a 10°C?
      a: >-
        Solo per sessioni molto brevi (20-30 minuti) e con una rash guard
        termica sotto. Avrai freddo per la maggior parte della sessione. Una
        5mm o 5/4/3mm è fortemente consigliata per acqua a 10°C.
    - q: Una muta da 5mm è troppo calda per l'estate?
      a: >-
        Se la temperatura dell'acqua estiva supera i 18°C, una muta da 5mm
        causerà surriscaldamento. Puoi sciacquare la muta con acqua fresca, ma
        starai più comodo con una 3/2mm o una muta corta durante i mesi estivi.
    - q: Una muta da 5mm limita la pagaiata?
      a: >-
        Sì, sensibilmente. Il neoprene più spesso sulle spalle richiede più
        sforzo a ogni bracciata. Una 5/4/3mm con braccia più sottili aiuta, ma
        ti stancherai comunque più in fretta che con una 3mm.
    - q: Qual è la migliore muta per il surf tutto l'anno?
      a: >-
        Una muta intera 4/3mm con zip sul petto e fodera termica copre
        12-18°C, che è tutto l'anno in molti climi temperati. Aggiungi scarpe
        per l'inverno e puoi surfare a 10-18°C con una sola muta.
