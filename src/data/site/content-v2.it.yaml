- slug: types-of-surfboards-explained
  category: guide
  type: technical
  title: 'I tipi di tavole da surf spiegati (quale è quello giusto per te?)'
  description: >-
    Shortboard, longboard, fish, hybrid, schiuma — già confuso? Ecco ogni tipo
    di tavola da surf spiegato: a chi è destinato, quali onde richiede e quale
    dovresti comprare per prima.
  definition: >-
    I principali tipi di tavole sono longboard (da 9 piedi in su, stabili,
    facili), shortboard (5-7 piedi, reattive, avanzate), schiuma/gonfiabili
    (volume elevato, sicure per principianti) e hybrid (7-9 piedi, versatile
    punto intermedio). Ogni tipo si adatta a diversi livelli di abilità e
    condizioni delle onde.
  tldr: >-
    I quattro principali tipi di tavole da surf sono shortboard (performance,
    basso volume), longboard (stabili, rilassate), schiuma/gonfiabili (adatte
    ai principianti, volume elevato) e hybrid o funboard (versatilità a media
    lunghezza). Ogni tipo si adatta a un livello di abilità e a uno stile di
    surf diversi. Scegli la tavola in base a dove ti trovi nella curva di
    apprendimento e al tipo di cavalcata che ti piace di più.
  problem: >-
    I nomi delle tavole sono confusionari: mini-mal, egg, fish, gun, hybrid,
    retro twin — e la lista continua. Vuoi sapere quale tipo di tavola
    corrisponde al tuo livello di abilità e alle onde locali senza comprare
    cinque tavole diverse per scoprirlo.
  explanation: >-
    Le longboard misurano 9 piedi e oltre, sono spesse e con punta arrotondata:
    prendono le onde presto e pagaiando senza sforzo. Le shortboard misurano
    5-7 piedi con punta appuntita e rocker aggressivo: richiedono pagaiata
    potente e tecnica precisa ma offrono le massime prestazioni. Le tavole in
    schiuma e gonfiabili imitano le forme delle longboard in formato ad alto
    volume ma sono più morbide e sicure. Le hybrid (funboard, egg) si collocano
    tra 7 e 9 piedi e uniscono facilità di pagaiata e capacità di virata. Le
    fish sono corte e larghe con coda a coda di rondine, costruite per onde
    piccole.
  solution: >-
    Identifica il tipo di onde locali: i beach break lenti si adattano a
    longboard e hybrid; i reef o point break più ripidi funzionano con le
    shortboard. Abbina la tavola all'onda, non a ciò che sembra figo. I
    principianti dovrebbero puntare a una forma longboard ad alto volume, poi
    esplorare forme più corte man mano che l'abilità cresce.
  recommendation: >-
    Per la maggior parte dei surfisti, una hybrid o funboard tra 7'6" e 8'6" è
    la migliore quiver di una sola tavola. La Aquafarer Surfboard Pro a 10'6" è
    più lunga ma offre la stabilità di una longboard con la portabilità di una
    gonfiabile. Usala come tavola principale per il primo anno.
  faq:
    - q: Qual è la tavola più facile da cavalcare?
      a: >-
        Una longboard (da 9 piedi in su) o una gonfiabile ad alto volume come la
        Aquafarer Surfboard Pro. Queste tavole prendono le onde presto e
        offrono una piattaforma stabile per imparare il pop-up e lo spostamento
        del peso.
    - q: Quando dovrei passare dalla longboard alla shortboard?
      a: >-
        Dopo essere riuscito a prendere con costanza onde verdi non ancora
        infrante, a fare bottom turn e a planare lungo la parete dell'onda sulla
        tua longboard. Affrettare il passaggio è l'errore più comune: prevedi di
        trascorrere 6-12 mesi su una longboard.
    - q: A cosa serve una fish?
      a: >-
        Le fish sono progettate per onde piccole e molli. La loro lunghezza
        ridotta e la sagoma larga generano velocità dove una tipica shortboard
        si fermerebbe. Sono un'ottima seconda tavola per surfisti intermedi.
    - q: Le tavole gonfiabili sono valide?
      a: >-
        Le gonfiabili moderne con costruzione drop-stitch rivaleggiano con le
        longboard in schiuma per rigidità e prestazioni. Sono ideali per
        principianti e viaggiatori perché si comprimono in uno zaino e sono
        quasi indistruttibili.
