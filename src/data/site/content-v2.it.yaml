- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'Guida al leash SUP: leash dritto vs a spirale'
  description: >-
    Guida completa ai leash SUP — dritto vs a spirale, attacco alla caviglia o
    al polpaccio, opzioni con sgancio rapido e come scegliere il leash giusto
    per le tue condizioni di pagaiata.
  definition: >-
    Il leash SUP è un cordino che collega il pagaiatore alla tavola, evitando
    che si separino. I tipi includono i leash dritti (per il surf e i fiumi) e
    i leash a spirale (per acque calme).
  tldr: >-
    I leash a spirale sono i migliori per acque calme e paddling fitness — si
    tengono lontani dalla tavola e fuori dall'acqua. I leash dritti sono per il
    SUP surf e i fiumi — offrono più libertà e non si impigliano. L'attacco al
    polpaccio è preferito rispetto alla caviglia per il comfort. I leash con
    sgancio rapido sono importanti per la pagaiata in fiume per evitare
    l'impigliamento.
  problem: >-
    Hai comprato un leash con il tuo SUP ma non sei sicuro che sia il tipo
    giusto per il tuo stile di pagaiata. Il leash sbagliato trascina, si
    impiglia o cede proprio quando ne hai più bisogno.
  explanation: >-
    I leash dritti sono semplici cordini in nylon o poliuretano che seguono la
    tavola. Funzionano bene in surf perché non si impigliano nelle pinne. I
    leash a spirale sono cordini arrotolati che si contraggono quando non sono
    in tensione — restano avvolti sul deck mentre pagai e si estendono quando
    cadi. Mantengono il leash fuori dall'acqua in condizioni calme, riducendo la
    resistenza.
  solution: >-
    Scegli un leash a spirale per acque calme, fitness e touring SUP. La
    ridotta resistenza aiuta a mantenere la velocità e impedisce al leash di
    agganciarsi a oggetti sott'acqua. Scegli un leash dritto per SUP surf e
    pagaiata in fiume. Il design dritto ha meno probabilità di impigliarsi in
    pinne o ostacoli.
  recommendation: >-
    I pacchetti Aquafarer SUP includono il tipo di leash adatto all'uso previsto
    della tavola. Il leash a spirale nel pacchetto SUP Explorer 11 è eccellente
    per la pagaiata polivalente.
  faq:
    - q: Il leash deve essere attaccato alla caviglia o al polpaccio?
      a: >-
        L'attacco al polpaccio è preferito per il SUP — mantiene il leash fuori
        dall'acqua durante la pagaiata e riduce il rischio di inciampo quando si
        cammina.
    - q: Quanto deve essere lungo un leash SUP?
      a: >-
        8-10' per acque calme, 6-8' per il surf. I leash più corti riducono la
        resistenza ma limitano la libertà di movimento sulla tavola.
    - q: Serve un leash con sgancio rapido per i fiumi?
      a: >-
        Sì — il SUP in fiume richiede un leash o una cintura con sgancio rapido
        che possa essere staccata immediatamente per evitare di rimanere
        intrappolati negli strainer.
    - q: Posso usare un leash da surf per il SUP?
      a: >-
        I leash da surf sono più corti e sottili. Funzionano per il SUP surf ma
        non sono ideali per la pagaiata in acque calme, dove è meglio un leash
        a spirale più lungo.
