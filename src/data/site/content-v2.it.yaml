- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Guida all'attrezzatura per il surf in acqua fredda (fai surf in inverno senza soffrire)
  description: >-
    Non lasciare che l'acqua fredda ponga fine alla tua stagione. Guida completa
    all'attrezzatura invernale: spessore della muta, scelta di stivali e
    guanti, vestibilità del cappuccio e gli accessori che rendono le sessioni
    invernali davvero piacevoli.
  definition: >-
    Il surf in acqua fredda richiede una muta completa (5/4/3mm o più spessa),
    stivali, guanti e cappuccio. Sotto i 12°C, ogni punto di contatto con
    l'acqua fredda deve essere protetto per prevenire intorpidimento, ipotermia
    e rischi per la sicurezza.
  tldr: >-
    Il surf in acqua fredda richiede una muta completa con cappuccio 5/4/3mm o
    6/5/4mm, stivali da 5mm, guanti da 3mm e un cappuccio. La qualità delle
    cuciture conta più del marchio: cerca cuciture incollate e a punto cieco
    (GBS). Una muta con fodera termica aggiunge calore significativo senza
    spessore extra. Porta sempre strati termici di ricambio e un thermos per il
    recupero post-sessione.
  problem: >-
    Vuoi fare surf per tutto l'inverno ma l'acqua fredda ti intorpidisce i piedi
    dopo 15 minuti, le mani non riescono ad afferrare la tavola e la muta lascia
    entrare acqua gelida sulla schiena a ogni pagaiata. Senza l'attrezzatura
    giusta, le sessioni in acqua fredda sono brevi e miserabili.
  explanation: >-
    Il surf in acqua fredda (sotto i 12°C) richiede più di una semplice muta
    spessa. Ogni punto di contatto con il freddo va protetto: gli stivali
    prevengono l'intorpidimento dei piedi e proteggono dai tagli della barriera
    corallina, i guanti mantengono la funzionalità delle mani per la pagaiata e
    il cappuccio previene la perdita di calore più grave (la testa disperde il
    30 percento del calore corporeo). Lo spessore della muta va scelto in base
    al mese più freddo, non alla media. Oltre alla muta, accessori come
    stivaletti con suola sigillata e guanti con dita pre-curvate migliorano
    comfort e durata.
  solution: >-
    Costruisci un kit per l'acqua fredda in quest'ordine: muta completa 5/4/3mm
    o 6/5/4mm con cuciture GBS e zip sul petto, stivali da 5mm con suola in
    gomma, guanti da 3mm (i guanti a muffola sono più caldi di quelli con le
    dita) e un cappuccio da 3mm che si infila sotto il collare della muta.
    Aggiungi un accappatoio da cambiare per dignità e calore nel parcheggio.
  recommendation: >-
    La Aquafarer Wetsuit Pro in 5/4/3mm con fodera termica integrata gestisce la
    maggior parte delle condizioni di acqua fredda fino a 8°C. Abbinala a
    stivali Aquafarer da 5mm e guanti da 3mm per un setup completo da acqua
    fredda. Sotto gli 8°C, passa a una tuta con cappuccio 6/5/4mm.
  faq:
    - q: Mi serve davvero un cappuccio?
      a: >-
        Sì. Perdi il 30 percento del calore corporeo attraverso la testa. Un
        cappuccio previene l'ingresso dell'acqua e tiene caldo il collo. Un
        cappuccio da 3mm aggiunge più calore che passare da 5mm a 6mm di
        spessore sul torso.
    - q: Che spessore di stivali mi serve?
      a: >-
        Per acque tra 8 e 12°C usa stivali da 5mm. Per 12-16°C bastano quelli da
        3mm. Sotto gli 8°C, considera stivali da 7mm o calzini in neoprene sotto
        stivali da 5mm.
    - q: Come impedisco alla muta di far entrare l'acqua?
      a: >-
        L'ingresso dell'acqua (flushing) avviene quando questa entra dalla nuca,
        dai polsi o dalle caviglie. Una chiusura con zip sul petto riduce
        significativamente l'ingresso dalla schiena. Anche le chiusure in
        velcro su collo e caviglie aiutano, ma la soluzione migliore è una muta
        ben vestita con cuciture GBS.
    - q: Posso usare una muta da 3mm in acqua fredda con strati extra?
      a: >-
        Una muta da 3mm con un sottoveste in neoprene sotto può estendere il tuo
        range di circa 3-4°C, ma non sostituisce una vera muta 5/4/3mm o 5mm.
        L'uso di strati funziona meglio per sessioni brevi in condizioni al
        limite.
