- slug: how-long-inflatable-boats-last
  category: guide
  type: technical
  title: 'Quanto Durano i Gommoni? Durata per Materiale e Manutenzione'
  description: >-
    La durata di un gommone dipende dal materiale, dalle condizioni di
    stoccaggio e dalla manutenzione. I gommoni in PVC durano 7-10 anni, quelli
    in Hypalon 10-15+ anni. Come massimizzare la vita della tua imbarcazione.
  definition: >-
    La durata di un gommone è il numero di anni in cui l'imbarcazione rimane
    idonea alla navigazione prima che il materiale del tubolare si degradi oltre
    ogni possibilità di riparazione. I gommoni in PVC durano in media 7-10 anni;
    quelli in Hypalon 10-15+ anni con una corretta manutenzione.
  tldr: >-
    Con una corretta manutenzione, i gommoni in PVC durano 7-10 anni. L'Hypalon
    dura 10-15+ anni. Il principale fattore che determina la durata è
    l'esposizione ai raggi UV — le imbarcazioni lasciate al sole diretto si
    deteriorano 2-3 volte più velocemente. Una manutenzione adeguata prolunga
    notevolmente la vita del gommone.
  problem: >-
    Stai investendo $1.000-$5.000 in un gommone e hai bisogno di aspettative
    realistiche sulla durata.
  explanation: >-
    Il principale meccanismo di invecchiamento è la degradazione del materiale
    del tubolare causata dai raggi UV. Gli UV fanno indurire, crepare e perdere
    resistenza al PVC. Il calore accelera la degradazione. L'usura meccanica
    dovuta a spiaggiamenti e ormeggi abrade il tessuto. Anche il pavimento e la
    specchia di poppa invecchiano — l'alluminio dura praticamente all'infinito,
    il compensato può marcire entro 5-7 anni.
  solution: >-
    Conserva l'imbarcazione lontano dalla luce solare diretta. Applica un
    protettivo UV ogni 2-3 mesi. Risciacqua dopo ogni utilizzo in acqua salata.
    Mantieni la corretta pressione di gonfiaggio. Ispeziona cuciture, valvole e
    specchia di poppa ogni anno. Ripara subito i piccoli tagli.
  recommendation: >-
    I gommoni Aquafarer in PVC includono stabilizzatori UV e sono coperti da una
    garanzia di 2 anni. Conserva l'imbarcazione nella sua borsa di trasporto
    quando non la usi per massimizzarne la durata.
  faq:
    - q: 'Il mio gommone si degrada anche se non lo uso?'
      a: >-
        Sì — l'esposizione ai raggi UV e la migrazione dei plastificanti
        proseguono indipendentemente dall'uso. Per una conservazione ottimale,
        riponilo sgonfio al chiuso.
    - q: 'Posso sostituire i tubolari del mio gommone?'
      a: >-
        Alcuni produttori offrono set di tubolari di ricambio per la stessa
        specchia di poppa e lo stesso pavimento. Il costo è pari al 50-70% di
        un'imbarcazione nuova.
    - q: 'Cosa rovina più rapidamente un gommone?'
      a: >-
        L'esposizione ai raggi UV, l'ozono prodotto dai motori elettrici e uno
        stoccaggio inadeguato (umidità, calore, roditori).
    - q: 'Come capisco quando devo sostituire la mia imbarcazione?'
      a: >-
        Perdite frequenti, materiale rigido o fragile, separazione delle
        cuciture, specchia di poppa marcia o valvole che non tengono più.
