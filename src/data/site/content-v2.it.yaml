- slug: weather-planning-water-sports
  category: guide
  type: safety
  title: 'Pianificare il meteo per gli sport acquatici: leggi le previsioni come un professionista'
  description: >-
    Come leggere le previsioni meteo marine per SUP, surf e navigazione. Capire
    fronti, sistemi di pressione, regimi di vento e allerte meteo per pianificare
    sessioni sicure.
  definition: >-
    Pianificare il meteo significa interpretare le previsioni marine — velocità
    e direzione del vento, altezza e periodo del moto ondoso, precipitazioni,
    visibilità e allerte meteo gravi.
  tldr: >-
    Controlla tre previsioni prima di ogni sessione: vento, moto ondoso e meteo.
    Condizioni migliori: vento offshore leggero, onda moderata, pressione alta o
    in aumento. Da evitare: temporali, vento offshore forte, nebbia e pressione
    in rapida caduta.
  problem: >-
    Arrivi in macchina sulla costa basandoti su una previsione a 3 giorni che
    prometteva buone condizioni, per poi trovare vento a 25 nodi e pioggia. Il
    meteo marino è difficile da prevedere.
  explanation: >-
    L'alta pressione porta tempo stabile e venti deboli. La bassa pressione
    porta vento e tempeste. Il gradiente di pressione determina la velocità del
    vento. I fronti freddi portano cambi improvvisi del vento. Effetti locali
    come la brezza di mare possono prevalere sulle previsioni generali.
  solution: >-
    Usa più fonti: Windy.com, NOAA, webcam locali degli spot. Controlla con 24
    ore di anticipo e ricontrolla la mattina stessa. Cerca previsioni coerenti
    tra i modelli. Impara i microclimi locali.
  recommendation: >-
    Salva Windy.com nei preferiti per i tuoi spot locali. Porta con te un
    telefono in custodia impermeabile. Per la navigazione, porta una radio VHF
    per i bollettini meteo. In caso di dubbio, resta a terra.
  faq:
    - q: Quale meteo devo evitare per il SUP?
      a: >-
        Temporali (fulmini), nebbia (visibilità zero), vento offshore sopra i 10
        nodi, venti oltre i 20 nodi, pressione in calo.
    - q: Quanto sono accurate le previsioni marine?
      a: >-
        Le previsioni a 3 giorni sono accurate circa all'80%. Le previsioni del
        giorno prima sono accurate oltre il 90% per il vento.
    - q: Qual è un buon andamento barometrico per gli sport acquatici?
      a: >-
        Pressione in aumento o stabile indica condizioni in miglioramento. Una
        pressione in calo (1+ mb/ora) indica l'avvicinarsi di una tempesta.
    - q: Posso fare SUP con la nebbia?
      a: >-
        Non è consigliato. Se vieni colto dalla nebbia, usa una bussola o il
        GPS, suona il fischietto ogni 30 secondi e resta vicino a riva.
