- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Guida alle Dimensioni della Paddle Board: Volume, Lunghezza e Larghezza per Ogni Rider'
  description: >-
    Dimensionamento completo della paddle board con consigli sul volume in base
    a peso e attività. Include una tabella dimensioni di facile uso per tavole
    all-around, touring, surf e yoga.
  definition: >-
    Le dimensioni della paddle board sono determinate dal volume (portata e
    galleggiamento), dalla lunghezza (velocità e tenuta di rotta), dalla
    larghezza (stabilità) e dallo spessore (distribuzione del volume e
    resistenza al vento).
  tldr: >-
    Usa il peso per trovare il volume minimo: 50-70 kg richiede 220-260L, 70-90
    kg richiede 260-300L, 90-110 kg richiede 300-350L, 110+ kg richiede 350+L.
    Per i principianti, aggiungi il 20% a questi numeri. La larghezza conta:
    32" è intermedia, 33-34" è indicata per i principianti, 35"+ è molto
    stabile.
  problem: >-
    Gli annunci di paddle board usano piedi, pollici e litri in modo
    intercambiabile, rendendo difficile confrontare tra marchi diversi.
  explanation: >-
    Il volume è la metrica più diretta per la portata: 1 litro di acqua dolce
    sposta 1 kg di peso. Una tavola da 260L può teoricamente sostenere 260 kg,
    ma la capacità pratica è inferiore perché la tavola deve stare sopra la
    linea dell''acqua. Il tuo peso totale (corpo più attrezzatura) dovrebbe
    essere il 30-40% del volume della tavola.
  solution: >-
    Volume obiettivo = (peso corporeo in kg + peso dell''attrezzatura in kg) x
    3. Per un pagaiatore di 75 kg con 5 kg di attrezzatura, l''obiettivo = 80 x
    3 = 240L minimo. Per i principianti, moltiplica per 3.5. Per i più esperti,
    moltiplica per 2.5.
  recommendation: >-
    La Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") è adatta alla maggior
    parte dei rider di 50-100 kg. I rider più leggeri possono valutare
    l''AirDeck 270. I rider più pesanti dovrebbero guardare alla SUP Tour 12
    (300L+) o a tavole più larghe.
  faq:
    - q: L'altezza conta per il dimensionamento del SUP?
      a: >-
        L''altezza conta meno del peso. Un rider alto e leggero ha bisogno di
        meno volume di uno basso e pesante. Usa il peso come determinante
        principale del volume.
    - q: Cosa succede con troppo volume?
      a: >-
        La tavola galleggia troppo alta, prendendo il vento come una vela.
        Sembra galleggiante come il sughero nella maretta. Tuttavia, per i
        principianti, un volume extra è meglio che troppo poco.
    - q: Cosa succede con troppo poco volume?
      a: >-
        La tavola affonda troppo, creando resistenza. La prua può immergersi
        durante la pagaiata (pearling). Ti stanchi in fretta pagaiando una
        tavola parzialmente immersa.
    - q: Le tavole gonfiabili richiedono un dimensionamento diverso dalle tavole rigide?
      a: >-
        Non in modo significativo. I gonfiabili a 15+ PSI spostano l''acqua in
        modo simile alle tavole rigide. I consigli sul volume valgono
        ugualmente per entrambi i tipi.
