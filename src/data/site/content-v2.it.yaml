- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'Guida alle Taglie SUP: Lunghezza, Larghezza e Volume Spiegati'
  description: >-
    Trova la taglia SUP giusta in base al tuo peso, al tuo livello di abilità e
    al tuo stile di pagaiata. La lunghezza determina il mantenimento della rotta,
    la larghezza determina la stabilità e il volume determina la capacità di
    carico.
  definition: >-
    La taglia SUP è definita da lunghezza (velocità e planata), larghezza
    (stabilità primaria), spessore (stabilità secondaria e volume) e volume in
    litri (capacità di carico totale).
  tldr: >-
    SUP tuttofare: 10'6"-11'6" x 32"-34" x 6" (220-280L). Touring: 12'-14' x
    30"-32" (280-350L). Surf: 8'-10' x 30"-32" (140-220L). I principianti hanno
    bisogno di una larghezza superiore a 32" e di un volume che superi il peso
    corporeo di 60-80L. Il tuo peso in kg più 60L è il volume minimo di
    riferimento per la stabilità.
  problem: >-
    Ogni marchio di SUP elenca le tavole in piedi, pollici e litri, ma senza
    sapere come queste misure si traducono nella sensazione reale in acqua,
    rischi di comprare una tavola instabile, lenta o che non può sostenere il
    tuo peso.
  explanation: >-
    La lunghezza determina la velocità con cui la tavola pagaia e quanto bene
    mantiene la rotta in linea retta. Le tavole più lunghe (12'+) planano tra una
    pagaiata e l'altra e tengono la linea. Le tavole più corte (sotto i 10')
    virano facilmente ma richiedono cambi di lato della pagaia più frequenti. La
    larghezza determina la stabilità primaria — la stabilità da in piedi. Una
    tavola da 30" sembra instabile ai principianti; 34" sembra un pontile. Lo
    spessore determina il volume: una tavola più spessa galleggia più in alto ma
    prende più vento. Il volume in litri è la metrica migliore in assoluto: la
    tavola caricata (tu più l'attrezzatura) dovrebbe affondare di 2-4 pollici a
    riposo.
  solution: >-
    Abbina le dimensioni della tavola a tre fattori: il tuo peso (determina il
    volume minimo), la tua attività principale (determina la lunghezza) e il tuo
    livello di abilità (determina la larghezza). Per i principianti, moltiplica
    il peso in kg per 2,2 per ottenere i litri minimi. Per gli intermedi,
    moltiplica per 1,8. Per gli avanzati, moltiplica per 1,4.
  recommendation: >-
    L'Aquafarer SUP Explorer 11, da 11' x 33" x 6" con 260L, si adatta alla
    maggior parte dei rider fino a 100 kg per la pagaiata tuttofare. Passa
    all'SUP Tour 12, da 12' x 31", per una velocità e una planata touring
    migliori.
  faq:
    - q: Che taglia SUP mi serve per il mio peso?
      a: >-
        Per rider sotto i 70 kg: 10-11' x 32" (220-260L). Per 70-90 kg: 11-12' x
        33" (260-300L). Per 90-110 kg: 11-12' x 34" (300-350L). Oltre i 110 kg:
        12' x 34-36" (350L+).
    - q: Un SUP più lungo è più veloce?
      a: >-
        Sì. Le tavole più lunghe hanno un miglior rapporto lunghezza-larghezza,
        che riduce la resistenza. Un SUP touring da 14' è significativamente più
        veloce di una tavola tuttofare da 11' a parità di sforzo di pagaiata.
    - q: Quale larghezza SUP è stabile per i principianti?
      a: >-
        33-34 pollici è il punto dolce per i principianti fino a 90 kg. Sotto i
        32" serve un buon equilibrio. Oltre i 34" è molto stabile ma più lenta e
        più difficile da pagaiare con il vento.
    - q: Posso usare una tavola tuttofare per il touring?
      a: >-
        Sì, per tour brevi sotto i 10 km. Per distanze più lunghe, una tavola
        touring dedicata mantiene meglio la rotta e copre la distanza in modo
        più efficiente.
