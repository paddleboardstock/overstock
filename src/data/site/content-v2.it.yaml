- slug: cold-water-safety-guide
  category: guide
  type: safety
  title: 'Sicurezza in acqua fredda: pagaiare e fare surf in condizioni fredde'
  description: >-
    Sicurezza in acqua fredda per SUP, surf e kayak. Riconoscere l'ipotermia,
    l'attrezzatura adeguata, la risposta da shock termico e le procedure di
    emergenza per l'immersione in acqua fredda.
  definition: >-
    La sicurezza in acqua fredda richiede di comprendere la risposta da shock
    termico, il cedimento del nuoto, l'ipotermia e le attrezzature e le tecniche
    per prevenire questi esiti.
  tldr: >-
    Acqua sotto i 15°C: serve la muta. Sotto i 10°C servono scarpe, guanti e
    cappuccio. Lo shock termico provoca un'inalazione involontaria (gasping). Il
    cedimento del nuoto avviene entro 3-5 minuti in acqua sotto i 10°C. I
    sintomi dell'ipotermia includono brividi, confusione e perdita di
    coordinazione.
  problem: >-
    Esci a pagaiare in una giornata di sole senza sapere che l'acqua è a 8°C.
    Cadi in acqua, inspiri involontariamente e senti gli arti intorpidirsi nel
    giro di minuti. L'acqua fredda uccide più in fretta di qualsiasi altro
    pericolo oceanico.
  explanation: >-
    L'immersione in acqua fredda ha quattro fasi: shock termico (0-2 min) —
    inalazione improvvisa, iperventilazione. Cedimento del nuoto (3-15 min) — i
    muscoli si raffreddano, la coordinazione viene meno. Ipotermia (15-45 min) —
    la temperatura interna scende sotto i 35°C causando confusione e arresto
    cardiaco. Collasso post-soccorso — il sangue freddo ritorna al centro del
    corpo.
  solution: >-
    Controlla la temperatura dell'acqua. Indossa una muta adatta alla
    temperatura. Non pagaiare mai da solo in acqua sotto i 15°C. Porta
    fischietto e telefono. Se cadi in acqua: controlla la respirazione e risali
    subito sulla tavola. Se hai troppo freddo, segnala per chiedere aiuto.
  recommendation: >-
    La muta Aquafarer Wetsuit Pro 5/4/3 mm è il minimo per acqua a 8-14°C.
    Aggiungi scarpe Aquafarer da 5 mm e guanti da 3 mm. Indossa il Life Vest Pro
    per una protezione termica extra.
  faq:
    - q: Quanto tempo posso sopravvivere in acqua a 10°C?
      a: >-
        Lo shock termico dura 1-2 minuti. Senza galleggiamento e protezione
        termica, il tempo di sopravvivenza è di 30-60 minuti.
    - q: Quali sono i primi segni di ipotermia?
      a: >-
        Brividi incontrollabili, confusione, scarsa coordinazione, linguaggio
        confuso. Interrompi l'attività e riscaldati subito.
    - q: Come mi riscaldo dopo una sessione in acqua fredda?
      a: >-
        Togli l'attrezzatura bagnata, asciugati e indossa indumenti caldi a
        strati, compresi cappello e guanti. Bevi bevande calde analcoliche.
    - q: Posso prendere l'ipotermia in estate?
      a: >-
        Sì — in molti luoghi l'acqua è sotto i 15°C anche in estate. L'acqua
        conduce il calore 25 volte più velocemente dell'aria.
