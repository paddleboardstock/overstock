- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'Guida all''ancora SUP: resta in posizione mentre peschi o fotografi'
  description: >-
    Guida completa all'ancoraggio SUP — tipi di ancora (a fungo, pieghevole, a
    picchetto), configurazione del trolley dell'ancora, tecniche di discesa e
    considerazioni di sicurezza per restare in posizione.
  definition: >-
    Un'ancora per SUP è un peso fissato a una corda che tiene la tavola in
    posizione contro vento e corrente. I tipi comuni includono ancore a fungo,
    ancore pieghevoli e aste a picchetto.
  tldr: >-
    Usa un'ancora a fungo (1.5-3 lb) per fondali fangosi o sabbiosi, un'ancora
    pieghevole per fondali rocciosi o un'asta a picchetto per acque basse con
    fondali morbidi. L'ancora dovrebbe essere da 1.5-3 lb per condizioni calme,
    3-5 lb per vento e corrente. Usa sempre un trolley per l'ancora per regolare
    la posizione e sappi quando mollare.
  problem: >-
    Trovi il punto di pesca perfetto ma vento e corrente ti spostano dalla
    posizione ogni pochi minuti. Senza ancoraggio, la pesca e la fotografia in
    SUP sono esercizi frustranti di riposizionamento continuo.
  explanation: >-
    Un'ancora funziona trascinando sul fondo finché non fa presa. Le ancore a
    fungo si interrano nei fondali morbidi e offrono una buona tenuta in sabbia
    e fango. Le ancore pieghevoli hanno marre che si infiggono nei fondali duri
    o rocciosi. Le aste a picchetto funzionano in acque basse spingendosi
    direttamente nel fondale.
  solution: >-
    Installa un sistema di trolley per l'ancora (una cima con un anello
    scorrevole su un lato della tavola) per regolare il punto di attacco
    dell'ancora. Fissa 50-75' di cima all'ancora. Cala l'ancora sopravvento o
    controcorrente rispetto alla posizione desiderata. Usa un sistema a sgancio
    rapido per separarti in caso di emergenza. Non ancorare mai in corrente
    forte o dove non puoi recuperare facilmente l'ancora.
  recommendation: >-
    Un'ancora pieghevole da 3 lb con 50' di cima funziona per la maggior parte
    delle condizioni di pesca in SUP. Aggiungi un sistema di trolley usando gli
    anelli a D del tuo Aquafarer SUP Explorer 11.
  faq:
    - q: Di che dimensione di ancora ho bisogno per il SUP?
      a: >-
        1.5-3 lb per laghi calmi e fiumi lenti. 3-5 lb per aree costiere con
        vento o corrente. Le ancore sovradimensionate sono difficili da
        recuperare.
    - q: Quanta cima per l'ancora mi serve?
      a: >-
        Un scandaglio 5:1 (5 piedi di cima per ogni piede di profondità) è lo
        standard. In 10' di acqua, usa 50' di cima.
    - q: Ancorarsi su un SUP è pericoloso?
      a: >-
        Solo se ti ancori in corrente o vento abbastanza forti da capovolgere
        la tavola. Usa sempre un sistema a sgancio rapido che possa essere
        disinserito all'istante.
    - q: Posso ancorarmi in qualsiasi acqua?
      a: >-
        Controlla le normative locali. Alcune aree limitano l'ancoraggio per
        proteggere le praterie di posidonia o gli habitat marini. Non ancorare
        mai sulle barriere coralline.
