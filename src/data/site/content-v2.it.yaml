- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Condizioni di vento per il SUP: come il vento influisce sulla tua pagaiata'
  description: >-
    Come la velocità e la direzione del vento influiscono sulla pagaiata in SUP.
    Capire la differenza tra vento offshore e onshore, leggere le previsioni del
    vento, tecniche di pagaiata con il vento e quando restare a terra.
  definition: >-
    Le condizioni di vento determinano la sicurezza del SUP. Il vento offshore
    (da terra verso il mare) ti spinge al largo. Il vento onshore (dal mare
    verso terra) ti spinge verso riva. Il vento laterale provoca l'imbardata
    (yaw) della tavola.
  tldr: >-
    Vento massimo sicuro per i principianti: 10 nodi. Intermedio: 15 nodi.
    Avanzato: 20 nodi. Il vento offshore è il più pericoloso. Pagaia prima
    controvento. Con vento laterale, pagaia leggermente sopravento rispetto alla
    destinazione. Con vento forte inginocchiati per ridurre la superficie
    esposta.
  problem: >-
    Esci a pagaiare in condizioni calme, ma 30 minuti dopo il vento è aumentato
    e fatichi a tornare. Il vento è il fattore di sicurezza del SUP più
    sottovalutato.
  explanation: >-
    Il vento influisce sul SUP più che su qualsiasi altra imbarcazione a pagaia
    perché stai in piedi e crei un effetto vela. Un vento di 10 nodi crea molta
    più resistenza su un pagaiatore in piedi che su un canoista seduto. Il vento
    offshore ti allontana dalla sicurezza. Il vento laterale fa imbardare la
    prua.
  solution: >-
    Controlla velocità e direzione del vento prima di pagaiare. Usa la scala
    Beaufort: forza 3 (7-10 nodi) per i principianti, forza 4 (11-16) per gli
    intermedi. Pagaia prima controvento. Se vieni sorpreso dal vento offshore,
    pagaia a 45 gradi rispetto al vento. Con vento forte inginocchiati.
  recommendation: >-
    Usa un'app di previsione del vento (Windy, Windfinder) prima di ogni
    sessione. L'Aquafarer SUP Tour 12 tiene meglio la rotta col vento rispetto
    alle tavole più larghe. In condizioni ventose, usa pagaiate più corte e una
    cadenza più alta.
  faq:
    - q: Quale direzione del vento è la più sicura per il SUP?
      a: >-
        Il vento onshore (che spira verso terra) è il più sicuro — ti riporta
        indietro. Il vento offshore è il più pericoloso.
    - q: Come pagaio con il vento laterale?
      a: >-
        Pagaia di più sul lato sopravento per compensare la deriva. Orienta la
        tavola leggermente sopravento rispetto alla destinazione. Una pinna
        centrale più profonda aiuta.
    - q: Posso pagaiare con un vento di 20 nodi?
      a: >-
        Solo se sei esperto e ti trovi in acque riparate. I principianti non
        dovrebbero pagaiare sopra i 10 nodi.
    - q: Come influiscono le raffiche di vento sul SUP?
      a: >-
        Le raffiche causano improvvisi problemi di equilibrio. In condizioni
        rafficate, abbassa il baricentro e preparati a spostamenti improvvisi.
