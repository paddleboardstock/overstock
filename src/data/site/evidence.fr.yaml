badge: Preuves et résultats
heading: Preuves
description: Études de cas réelles, certifications, données de test et photos de déploiement qui démontrent notre capacité de fabrication et la qualité de nos produits.

case_studies:
  - id: retail-private-label
    client: Détaillant européen de sports outdoor
    product: Gamme de SUP en marque de distributeur
    industry: Commerce de détail
    challenge: Un détaillant européen de sports outdoor avait besoin d'une gamme de SUP en marque de distributeur avec des graphismes de pont exclusifs, du PVC écologique et un emballage prêt pour le commerce de détail, le tout livré en 60 jours.
    solution: Nous avons développé les fichiers d'impression numérique personnalisés, sourcé du PVC conforme à la norme REACH et réduit les essais de 3 à 1 série en installant l'équipe de conception dans notre usine de Qingdao.
    result: 55 jours entre la commande signée et le FOB. 2,400 unités réparties sur 4 références. Commande renouvelée avant l'arrivée du premier conteneur.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags: [OEM, Commerce de détail, SUP]
    outcome_metrics:
      - label: Délai de livraison
        value: 55 jours
      - label: Unités
        value: 2,400
      - label: Références
        value: '4'

  - id: startup-drop-stitch-kayak
    client: Start-up américaine de sports nautiques
    product: Kayak drop-stitch
    industry: Start-up / Commerce de détail
    challenge: Une start-up américaine de sports nautiques avait besoin d'un kayak drop-stitch haute performance avec une forme de coque personnalisée, un emballage en co-branding et la certification BSCI pour une commercialisation en magasin.
    solution: Nous avons adapté un moule de kayak drop-stitch existant avec un profil de rocker modifié, développé les visuels de l'emballage en co-branding et fourni l'intégralité de la documentation d'audit BSCI.
    result: Référencé avec succès dans 3 grandes chaînes américaines d'outdoor. Plus de 5,000 unités la première année avec un taux d'écoulement de 98%.
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
    tags: [OEM, Kayak, BSCI]
    outcome_metrics:
      - label: Chaînes de distribution
        value: '3'
      - label: Unités la première année
        value: 5,000+
      - label: Taux d'écoulement
        value: 98%

  - id: australian-rib-distributor
    client: Distributeur australien
    product: Gamme de RIB certifiés CE
    industry: Nautisme / Secteur public
    challenge: Un distributeur australien avait besoin d'une gamme de RIB certifiés CE avec des couleurs de boudins personnalisées, une option Hypalon et la conformité à la norme australienne AS 1799.
    solution: Nous avons produit des échantillons de préproduction en 4 variantes de couleur de boudins, sourcé l'Hypalon CSM auprès d'un fournisseur japonais et coordonné les tests de conformité AS 1799 effectués par un organisme tiers.
    result: Gamme de 3 modèles de RIB lancée sur le marché AU/NZ. Suivie d'une victoire à un appel d'offres gouvernemental pour 12 RIB de patrouille.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
    tags: [OEM, RIB, Hypalon, Secteur public]
    outcome_metrics:
      - label: Modèles lancés
        value: '3'
      - label: Contrat de bateaux de patrouille
        value: 12 unités
      - label: Conformité
        value: AS 1799

  - id: caribbean-resort-fleet
    client: Groupe de complexes hôteliers de luxe des Caraïbes
    product: Flotte pour complexe hôtelier — RIB, SUP et kayaks
    industry: Hôtellerie / Tourisme
    challenge: Un groupe de 5 complexes hôteliers avait besoin d'une flotte unifiée d'équipements nautiques de location — annexes RIB, SUP et kayaks — avec une image de marque cohérente, des matériaux résistants aux UV pour le soleil tropical et un plan de renouvellement sur 5 ans.
    solution: Nous avons conçu un pack de flotte personnalisé de 3 modèles avec du PVC stabilisé aux UV, des graphismes de pont aux couleurs du complexe et un calendrier de livraison par phases. Formation du personnel et kit de pièces détachées dédié fournis pour chaque complexe.
    result: 180 unités livrées dans 5 complexes hôteliers. Commande renouvelée pour 2 nouveaux établissements. Réduction de 40% du coût unitaire par rapport aux fournisseurs précédents.
    image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    tags: [OEM, SUP, Kayak, RIB, Hôtellerie]
    outcome_metrics:
      - label: Unités livrées
        value: 180
      - label: Complexes hôteliers
        value: '5'
      - label: Réduction des coûts
        value: 40%

  - id: southeast-asia-search-rescue
    client: Agence maritime d'Asie du Sud-Est
    product: Flotte de RIB de patrouille et de sauvetage
    industry: Secteur public / Sécurité maritime
    challenge: Une agence maritime gouvernementale avait besoin de 20 RIB de patrouille et de sauvetage avec des boudins en Hypalon ignifuge, des planchers autovideurs, des supports intégrés de console VHF/radio et la conformité aux normes d'embarcation de sauvetage du chapitre III de la convention SOLAS.
    solution: Fabrication de 20 RIB avec boudins en Hypalon CSM, coques en aluminium de qualité marine, anneaux de remorquage renforcés et feux de navigation préinstallés. L'équipe d'inspection de l'usine a assisté aux essais en mer. Dossier documentaire SOLAS complet fourni.
    result: Contrat livré en 4 mois. Flotte déployée pour la patrouille frontalière, la recherche et le sauvetage et l'intervention en cas de catastrophe sur 3 bases régionales.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
    tags: [OEM, RIB, Hypalon, Secteur public, SOLAS]
    outcome_metrics:
      - label: RIB de patrouille
        value: '20'
      - label: Livraison
        value: 4 mois
      - label: Bases
        value: '3'

  - id: european-dtc-ecommerce
    client: Marque européenne de sports nautiques DTC
    product: Gamme de SUP de marque + accessoires
    industry: E-commerce / Commerce de détail
    challenge: Une marque DTC de sports nautiques en forte croissance avait besoin d'un pack SUP complet (planche, pompe, pagaie, leash, sac) avec un emballage premium conçu pour l'exécution des commandes e-commerce, en livraison directe au consommateur via DHL/FedEx sans dommage.
    solution: Nous avons développé une gamme en co-branding avec un façonnage personnalisé du noyau en EPS, une technologie drop-stitch propriétaire pour une pression plus élevée et des cartons ondulés à double cannelure prêts pour la vente avec inserts de protection. Enregistrement de l'authenticité et de la garantie par code QR intégré.
    result: Gamme de 3 modèles de SUP lancée en 75 jours. Plus de 15,000 unités en 12 mois. Note moyenne de 4.8★ sur plus de 2,000 avis. Taux de dommages en transit de 0.3%.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags: [OEM, SUP, DTC, E-commerce]
    outcome_metrics:
      - label: Modèles
        value: '3'
      - label: Unités
        value: 15,000+
      - label: Note moyenne
        value: 4.8★
      - label: Taux de dommages
        value: 0.3%

certifications:
  - name: CE
    body: Union européenne
    desc: 64 modèles certifiés CE conformément aux directives applicables de l'UE pour les embarcations de plaisance et les dispositifs de flottabilité individuels.
  - name: ISO 9001
    body: SGS / BSI
    desc: Système de management de la qualité certifié pour la conception, la fabrication et la distribution d'embarcations gonflables.
  - name: BSCI
    body: amfori
    desc: Certification de conformité sociale attestant d'une fabrication éthique, de conditions de travail équitables et d'une sécurité sur le lieu de travail.
  - name: REACH
    body: Agence européenne des produits chimiques
    desc: Tous les matériaux sont conformes au règlement REACH sur la sécurité chimique. Documentation fournie avec chaque expédition.
  - name: RoHS
    body: Union européenne
    desc: Conformité à la restriction des substances dangereuses sur l'ensemble des composants électroniques et électriques.
  - name: AS 1799
    body: Standards Australia
    desc: Norme australienne pour les bateaux gonflables, testée et certifiée pour un usage commercial dans les eaux AU/NZ.

