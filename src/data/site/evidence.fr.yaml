badge: Proof & Quality
heading: Preuves
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Stock en liquidation, Contrôle qualité de niveau détail
    product: Chaque planche en surstock, réinspektée
    industry: Contrôle de qualité
    challenge: Les planches en surstock et en liquidation proviennent de séries de production excédentaires, donc les acheteurs se demandent à juste titre si une planche en promotion passe les mêmes contrôles qu'une planche à plein tarif.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: Taux de défaut de 99,3 % sur les expéditions sortantes au cours des 12 derniers mois — la même norme s'applique au stock en liquidation et au stock de détail.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Taux sans défaut
        value: 99.3%
      - label: Couverture du test de pression
        value: 100%
      - label: Durée du maintien
        value: 24-48h
  - id: pressure-test-regime
    client: Maintien de pression de 24-48 heures
    product: Chaque chambre, 1,25 fois la pression nominale
    industry: Test produit
    challenge: Une planche SUP vit ou meurt selon son noyau drop-stitch et ses coutures, et un simple contrôle d'inflation à la fin de la ligne n'est pas suffisant pour détecter les fuites lentes ou les soudures faibles.
    solution: Chaque planche est gonflée à 1,25 fois sa pression nominale et maintenue pendant 24 à 48 heures, avec une chute de pression devant rester en dessous de 5 %. Les valves, les anneaux en D, les coutures et la flottabilité sont vérifiés sans tolérance pour les défauts de sécurité.
    result: 100 % de la production passe par ce régime avant emballage — pas de raccourci sur échantillonnage, aucune exception.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - Pression de 1,25x
      - Aucun défaut de sécurité
    outcome_metrics:
      - label: Pression d'essai
        value: 1.25x
      - label: Chute de pression maximale
        value: <5 %
      - label: Unités testées
        value: 100%
  - id: warranty-claims-support
    client: Une garantie qui répond
    product: Couverture de 2 ans sur les planches et accessoires SUP
    industry: Service après-vente
    challenge: Acheter des articles en liquidation directement à l'usine soulève une question légitime — si quelque chose tourne mal plusieurs mois plus tard, qui s'en occupe ?
    solution: Chaque planche est livrée avec une garantie de 2 ans couvrant les planches SUP, les coutures drop-stitch, les valves d'inflation et les accessoires. Les réclamations sont envoyées directement à notre équipe — envoyez des photos ou une courte vidéo et nous nous en occupons.
    result: Les demandes de garantie sont examinées et traitées par la même équipe qui inspecte la production — pas de détour par un distributeur.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - Garantie de 2 ans
      - Support direct
      - Accessoires couverts
    outcome_metrics:
      - label: Garantie
        value: 2 ans
      - label: Couverture
        value: Planche + Accessoires
      - label: Support
        value: Équipe directe
