cases:
  - id: beginner
    title: Početničko veslanje
    desc: Stabilne naduvane SUP daske za početnike u veslanju.
    scenario: Porodica koja vikendom posećuje jezero želi da proba paddle boarding. Potrebna im je stabilna, lako upotrebljiva oprema sa jasnim uputstvima za bezbednost.
    solution: SUP Explorer 11 pruža stabilnost širokog tela za početnike. Life Vest Classic obezbeđuje CE-sertifikovano plovljenje. Oars & Pump Set naduvava dasku za manje od 10 minuta.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Turizam i istraživanje
    desc: Duge naduvavajuće SUP daske za jezera, reke i obalska putovanja.
    scenario: Ljubitelj boravka u prirodi planira nedeljno veslačko putovanje i treba mu daska koja se lako pakuje, naduvava na kampu i ide pravo po otvorenoj vodi.
    solution: Ocean Voyager Series klizi efikasno uz turoing obris i drži kurs pri vetru i talasanju. Njegova drop-stitch konstrukcija se naduvava do 15 PSI za čvrstoću tvrdih dasaka.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Joga i Fitness
    desc: Ekstra široke, stabilne platforme za jogu, fitnes i opuštanje.
    scenario: Praktičar joge želi plutajući studio za jutarnje sesije na mirnoj vodi, sa dovoljno prostora na palubi da izvede svaki položaj.
    solution: Flowing Lotus Series ima dasku pune dužine i širok gred za stabilne poze bez ljuljanja. Takođe služi kao stabilna platforma za lagane fitnes vežbe.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Porodična rekreacija
    desc: Kompletni SUP paketi za vikend na jezeru i praznike.
    scenario: Porodica od četiri člana želi stabilne daske za vikend izlete na jezero i odmore na plaži — opremu koja staje u automobil i napumpava se za nekoliko minuta.
    solution: Tropical Breeze Series je stabilna univerzalna daska koju cela porodica može koristiti, dok je Medusa Glow Series lakša i kraća za decu. Oba se mogu spakovati u rančeve za lako putovanje.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
