cases:
  - id: beginner
    title: Početnički vodeni sportovi
    desc: Stabilne SUP daske i kajaci za korisnike po prvi put.
    scenario: Porodica koja vikendom posećuje jezero želi da proba paddle boarding. Potrebna im je stabilna, lako upotrebljiva oprema sa jasnim uputstvima za bezbednost.
    solution: SUP Explorer 11 pruža stabilnost širokog tela za početnike. Life Vest Classic obezbeđuje CE-sertifikovanu plutajuću zaštitu. Dual-Action Pump naduvava obe daske za manje od 10 minuta.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Istraživanje na otvorenom
    desc: Prenosivi kajaci i čamci za reke, jezera i obalne izlete.
    scenario: Ljubitelj prirode planira nedeljno putovanje rekom i treba mu čamac koji je kompaktan za pakovanje, naduvava se na kampu i podnosi različite struje.
    solution: Kajak Inflatable Lite može se spakovati u ranac i naduva za manje od 4 minuta. Njegova drop-stitch konstrukcija se nosi sa jezerima, mirnim rekama i obalnim veslanjem.
    products:
      - Inflatable Kajak Lite
      - Karbon veslo
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: Profesionalne operacije
    desc: Komercijalni RIBs za turističke operatere i hitne intervencije.
    scenario: Obalni turistički operator treba flotu izdržljivih čamaca koja svakodnevno vozi izlete u različitim uslovima mora i ispunjava komercijalne bezbednosne propise.
    solution: RIB 330 i RIB 450 Patrol koriste stakloplastične deep-V trupe sa Hypalon tubama za izdržljivost u svim vremenskim uslovima. Više jedinica može se koristiti sa konzistentnim performansama.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: Porodična rekreacija
    desc: Prostrani čamci za jednodnevne izlete, pecanje i vodene sportove.
    scenario: Porodica od četiri člana želi stabilan čamac za vikend izlete na jezeru, pecanje i vuču tube za decu.
    solution: AirDeck 360 sedi do petoro ljudi sa ojačanim zračnim palubnim dnom. Naduva se na mestu lansiranja, skladišti u automobilu i podnosi kako mirna jezera, tako i zaštićena obalna područja.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
