origin:
  tagline: Naš izvor
  heading: |-
    Zgrajen na vodi,<br />
    <span class="text-sky-600">Gnana z namenom</span>
  paragraphs:
    - 'Paddle Board Overstock Začelo se je v obalni delavnici z enim čolnom in trmasto prepričanjem: morski izdelki morajo biti zasnovani tako, kot da so pomembni — ker so pomembni.'
    - Naša ustanovitelja, dva ladijska arhitekta, sta videla industrijo, kjer so varčevali, materiale zniževali in varnost obravnavali kot kljukico. Prvi trup sta zgradila Paddle Board Overstock ne za dobiček, ampak da dokažeta, da je cenovno dostopna pomorska oprema lahko tudi resnično zanesljiva.
    - Ta prvi trup je še danes v uporabi. To načelo se ni nikoli spremenilo.
    - Nismo največji proizvajalec. Ne izdelujemo najcenejših izdelkov. A vsak trup, ki zapusti našo delavnico, gre skozi iste roke, ki so ustanovile podjetje — in izpolnjuje enake standarde kot prvi komplet trupa.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock Obalna delavnica
philosophy:
  tagline: Naša filozofija
  heading: Ukoreninjena v oceanu
  description: Ocean ni naše delovno okolje. Je naš učitelj. Vsaka oblikovalska odločitev se začne z razumevanjem, kako se voda obnaša, kako se pogoji spreminjajo in kako se mora zobniki odzvati.
  cards:
    - emoji: 🌊
      title: Spoštuj vodo
      description: Voda je nepredvidljiva. Naši izdelki so zasnovani za najslabše pogoje, ne za najboljše. Če trup prenese plimo, bo prenesel tudi jezero. Če rešilni jopič deluje na morju, je za reko preveč zasnovan — in to je namerno.
    - emoji: 🔧
      title: Zgrajena, da traja, ne da nadomesti
      description: Najbolj trajnosten izdelek je tisti, ki ga ni treba zamenjati. Pomorski , PVCHypalon, in drop-stitch gradbeni izdelki so izbrani zaradi dolgotrajnosti. Še vedno pošiljamo rezervne dele za trupe, ki smo jih izdelali pred desetletjem.
    - emoji: 🏆
      title: Dostopno po zasnovi
      description: Vodni športi ne bi smeli biti luksuz. Razvijamo izdelke, ki zagotavljajo profesionalno zmogljivost po ceni, ki je smiselna za družine, vodiče in male operaterje — ne le za komercialne flote.
design:
  tagline: Oblikovalska filozofija
  heading: |-
    Zasnovano za rob<br />
    <span class="text-sky-600">pogojev</span>
  paragraphs:
    - Paddle Board Overstock Vsak izdelek se začne z enim vprašanjem:<em>Kakšno je najslabše stanje, s katerim se bo to soočilo?</em>Oblikujemo od roba navznoter, ne od središča navzven.
    - 'drop-stitch Naša jedra so ocenjena za 15 PSI — ne zato PSI , ker 12 ni dovolj za jezero, ampak ker PSI deska 15 prenese nenaden sunek brez upogibanja. Hypalon Naše cevi so prilagojene UV komercialni odpornosti — ne zato, ker bi vsak kupec veslal v tropskih krajih, ampak ker UV je degradacija #1 vzrok za prezgodnjo odpoved.'
    - Ne načrtujemo po določeni ceni. Načrtujemo do točke odpovedi — nato pa gradimo precej nad njo.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock Oblikovanje in inženiring
