business_model:
  tagline: Ang Aming Modelo ng Negosyo
  heading: Overstock inventory, ibinenta nang direkta sa pabrika
  paragraphs:
    - Paddle Board Overstock Nagbebenta kami ng mga bagong inflatable SUP board sa presyo ng overstock at clearance — hanggang 60% diskwento sa karaniwang retail. Kumukuha kami ng surplus at sobrang imbentaryo sa dami, pagkatapos ay ipinapasa ang pagtitipid sa mga paddler at maliliit na retailer.
    - 'Kasabay ng retail sales, nagseserbisyo kami sa maliliit na retailer gamit ang mixed-model wholesale: umorder ng 5–20 boards, ihalo ang anumang modelo sa isang shipment, at bayaran ang wholesale tier para sa kabuuang dami. Bawat order ay direktang ipinapadala mula sa Weihai, China.'
sourcing:
  tagline: Saan Nanggaling ang Aming Overstock Inventory
  heading: Pinaghalong pinagmulan, isang pamantayan ng kalidad
  paragraphs:
    - 'Ang aming imbentaryo ay nagmumula sa dalawang pinagmumulan: mga surplus na batch ng produksyon mula sa aming sariling mga operasyon sa pagmamanupaktura sa Weihai, at piling sobrang imbentaryo na nagmula sa iba pang mga kasosyo sa produksyon na aming ina-audit at direktang katrabaho.'
    - Bawat board na binebenta namin ay bago at hindi pa nagagamit. Ang overstock ay tumutukoy sa presyo — hindi sa kondisyon.
manufacturing:
  tagline: Ang aming Background sa Pagmamanupaktura
  heading: Itinayo sa Weihai mula pa noong 2012
  paragraphs:
    - Gumagawa kami ng inflatable SUP boards sa Weihai, Shandong mula pa noong 2012. Ang aming 12,000 m² na pasilidad ng produksyon ay gumagawa ng 15,000 inflatable units kada taon na may 200–300 manggagawa at 14+ R&D engineers.
    - 'Isang prinsipyo ng disenyo ang hindi nagbago mula noong unang board: nagdidisenyo kami hanggang sa punto ng pagkabigo, tapos itinatayo nang mas mataas dito.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock gusali ng pabrika sa Weihai
  stats:
    - value: '2012'
      label: Pagmamanupaktura mula pa
    - value: 12,000 m²
      label: Pasilidad ng produksyon
    - value: 15,000
      label: Mga Yunit kada taon
    - value: 14+
      label: Inhinyero ng R&D
inspection:
  tagline: Paano Namin Iniinspeksyon ang Bawat SUP Board
  heading: Bawat board ay sinubukan, hindi na-sample
  paragraphs:
    - Bawat SUP board ay 100% pressure-tested sa 1.25x ng rated pressure nito sa loob ng 24–48 oras bago maaprubahan para ibenta. Ang mga board na pumalya ay hindi kailanman ipinapadala.
    - 99.3% ng mga board ay pumasa sa huling inspeksyon sa unang pagkakataon. Ang natitirang bahagi ay inaayos o itinatabi — hindi kailanman isinama sa isang order.
why_prices_lower:
  tagline: Bakit Mas Mababa ang Aming Presyo
  heading: Sobrang ekonomiya ng stock, hindi pagtitipid
  paragraphs:
    - 'Mas mababa ang aming mga presyo dahil sa mga estruktural na dahilan: nagbebenta kami ng overstock at surplus inventory direkta mula sa Weihai, walang retail markups, walang distributor layers, at walang gastos sa showroom.'
    - Ang mga board mismo ay full-production quality — parehong drop-stitch core, parehong marine-gradePVC, parehong testing tulad ng full-price retail.
shipping_network:
  tagline: Ang Aming Pandaigdigang Network ng Pagpapadala
  heading: Express na panghimpapawid o pinagsamang kargamento sa dagat
  paragraphs:
    - Ang mga order ay ipinapadala mula Weihai, China. Ang express air freight ay nagdadala ng mga sample at 1–3 board orders; Ang pinagsamang sea freight ay nagsisilbi sa 5–20 board wholesale orders sa 50+ bansa.
    - Bawat quote ay may kasamang transit estimate para sa iyong destinasyon, pati na rin ang commercial invoice at packing list na kinakailangan para sa customs clearance.
  cards:
    - title: Express Air Freight
      description: Para sa mga sample at 1–3 board na order — mabilis na paghahatid sa iyong pintuan, tinatayang halaga bawat destinasyon.
    - title: Consolidated Sea Freight
      description: Para sa 5–20 board na wholesale order — abot-kayang pagpapadala sa mga pangunahing pantalan, tinatayang halaga bawat destinasyon.
warranty_support:
  tagline: Warranty & Suporta sa Customer
  heading: 2-Taong SUP Warranty sa bawat board
  paragraphs:
    - Bawat board ay ipinapadala kasama ng 2-Taong SUP Warranty. Kung lumitaw ang isang sakop na depekto sa loob ng panahon ng warranty, makipag-ugnayan sa aming support team at aayusin namin ito.
    - Ang suporta ay hinahandle ng parehong team na namamahala sa iyong order. Maari mo kaming maabot anumang oras sa pamamagitan ng contact form o sa pagsagot sa iyong order confirmation.
