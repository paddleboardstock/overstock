origin:
  tagline: Ang Aming Pinagmulan
  heading: |-
    Itinayo sa tubig,<br />
    <span class="text-sky-600">pinapagana ng layunin</span>
  paragraphs:
    - 'Nagsimula ang Aquafarer sa isang pambaybayin na pagawaan na may isang bangka at matibay na paniniwala: ang mga produktong pangkaragatan ay dapat likhain na parang mahalaga — dahil talaga namang mahalaga ito.'
    - Ang aming mga tagapagtatag, dalawang arkitekto ng barko, ay nakakita ng isang industriya kung saan pinapamaliit ang kalidad, pinabababa ang lebel ng materyales, at itinuturing ang kaligtasan bilang isang tseklist lamang. Binuo nila ang unang Aquafarer na katawan ng barko hindi para sa kita, kundi upang patunayan na ang abot-kayang gamit sa dagat ay maaari ring maging tunay na maaasahan.
    - Ang unang katawan ng barko ay ginagamit pa rin hanggang ngayon. Ang prinsipyong iyon ay hindi nagbago.
    - Hindi kami ang pinakamalaking tagagawa. Hindi kami gumagawa ng pinakamurang produkto. Ngunit bawat hull na lumalabas sa aming workshop ay dumadaan sa parehong mga kamay na nagpasimula ng kumpanya — at naaabot ang parehong pamantayan na itinakda ng unang hull.
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: Aquafarer baybaying-pangawaan
philosophy:
  tagline: Aming Pilosopiya
  heading: Nakatugat sa karagatan
  description: Ang karagatan ay hindi aming lugar ng trabaho. Ito ay aming guro. Bawat desisyon sa disenyo ay nagsisimula sa pag-unawa kung paano kumikilos ang tubig, kung paano nagbabago ang mga kondisyon, at kung paano dapat tumugon ang kagamitan.
  cards:
    - emoji: 🌊
      title: Igalang ang Tubig
      description: Ang tubig ay hindi mahulaan. Ang aming mga produkto ay idinisenyo para sa pinakamasamang kondisyon, hindi sa pinakamabuti. Kung ang isang katawan-bangka ay kayang tiisin ang isang riptide, kakayanin din nito ang isang lawa. Kung ang isang life vest ay gumagana sa bukas na dagat, ito ay sobra sa disenyo para sa isang ilog — at ito ay sadyang ginawa.
    - emoji: 🔧
      title: Gawa Para Magtagal, Hindi Para Palitan
      description: Ang pinaka-sustainable na produkto ay yaong hindi kailangang palitan. Ang konstruksyon na gawa sa marine-grade PVC, Hypalon, at drop-stitch ay pinipili para sa tibay. Nagpapadala pa rin kami ng mga ekstrang bahagi para sa mga katawan ng barko na ginawa namin isang dekada na ang nakalipas.
    - emoji: 🏆
      title: Maaaring Maabot sa Disenyo
      description: Hindi dapat maging luho ang mga palarong pantubig. Gumagawa kami ng mga produkto na nagbibigay ng propesyonal na antas ng pagganap sa presyong makatuwiran para sa mga pamilya, gabay, at maliliit na operator — hindi lamang para sa mga komersyal na fleet.
design:
  tagline: Pilosopiya sa Disenyo
  heading: |-
    Idinisenyo para sa hangganan<br />
    <span class="text-sky-600">ng mga kondisyon</span>
  paragraphs:
    - Bawat Aquafarer na produkto ay nagsisimula sa isang tanong:<em>ano ang pinakamalalang kondisyon na haharapin nito?</em>Dinidisenyo namin mula sa gilid patungo sa loob, hindi mula sa gitna palabas.
    - 'Ang aming drop-stitch cores ay may rating na 15 PSI — hindi dahil ang 12 PSI ay hindi sapat para sa isang lawa, kundi dahil ang 15 PSI na board ay kayang harapin ang biglaang alon nang hindi nababaluktot. Ang aming Hypalon tubes ay tinukoy para sa commercial-grade na UV resistance — hindi dahil bawat customer ay nagpa-paddle sa tropiko, kundi dahil ang UV degradation ang #1 na sanhi ng maagang pagkasira.'
    - Hindi kami nagdidisenyo base sa presyo. Nagdidisenyo kami ayon sa punto ng pagkasira — pagkatapos ay nagtatayo nang higit pa rito.
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: Aquafarer disenyo at inhinyeriya
  stats:
    - value: '15'
      label: PSI pangunahing bahagi<br />antas
    - value: 1,500+
      label: UV na oras<br />nasubukan
    - value: 10yr
      label: korpuso<br />haba ng buhay
