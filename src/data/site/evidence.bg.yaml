badge: Proof & Results
heading: Доказателства
description: Реални казуси, сертификати, тестови данни и снимки на внедряване, които демонстрират нашите производствени възможности и качество на продуктите.
case_studies:
  - id: retail-private-label
    client: Европейски търговец на открито
    product: Линия със собствена марка SUP
    industry: Търговия на дребно
    challenge: Европейският търговец на открито се нуждаеше от линия със собствена марка SUP с уникални графики на палубата, екологично чисти PVC и готова за търговия на дребно опаковка — всичко доставено за 60 дни.
    solution: Разработихме персонализирани цифрови печатни файлове, осигурихме REACH-съвместими PVC материали и намалихме броя на пробите от 3 на 1 чрез съвместно позициониране на дизайнерския екип в нашата фабрика в Циндао.
    result: 55 дни от подписване на поръчка до FOB. 2 400 единици разпределени в 4 SKU. Повторна поръчка направена преди пристигането на първия контейнер.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Търговия на дребно
      - SUP
    outcome_metrics:
      - label: Срок на изпълнение
        value: 55 дни
      - label: Брой единици
        value: 2,400
      - label: SKU
        value: '4'
  - id: startup-drop-stitch-kayak
    client: Американски стартъп за водни спортове
    product: Drop-Stitch Каяк
    industry: Стартъп / Търговия на дребно
    challenge: Американският стартъп за водни спортове се нуждаеше от високоефективен drop-stitch каяк с персонализирана форма на корпуса, съвместно брандирана опаковка и BSCI сертификация за търговия на дребно.
    solution: Адаптирахме съществуващ калъп за drop-stitch каяк с модифициран профил на задна част, разработихме артистичен дизайн за съвместно брандирана опаковка и предоставихме пълна документиция за одит BSCI.
    result: Успешно включен в 3 големи американски вериги за туризъм на открито. 5 000 + единици през първата година с 98% реализация.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Каяк
      - BSCI
    outcome_metrics:
      - label: Верига магазини на дребно
        value: '3'
      - label: Единици през първата година
        value: 5,000+
      - label: Продажби
        value: 98%
  - id: australian-rib-distributor
    client: Австралийски дистрибутор
    product: CE-Сертифицирано RIB Обхват
    industry: Морски / Правителствен сектор
    challenge: Австралийският дистрибутор се нуждаеше от CE-сертифициран RIB обхват с персонализирани цветове на тръбите, опция за надстройка Hypalon и съответствие с австралийски стандарт AS 1799.
    solution: Произведохме предсерийни проби с 4 варианта на цветовете на тръбите, осигурихме CSM Hypalon от японски доставчик и координирахме тестове за съответствие с AS 1799 от трета страна.
    result: 3-моделен RIB диапазон бе пуснат на пазара в AU/NZ. Последва спечелен държавен търг за 12 патрулни RIBs.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Правителство
    outcome_metrics:
      - label: Лансирани модели
        value: '3'
      - label: Договор за патрулен катер
        value: 12 единици
      - label: Съответствие
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Карибска луксозна курортна група
    product: Флот на курорта — RIBs, SUP, каяци
    industry: Хотелиерство / Туризъм
    challenge: Група от 5 курорта се нуждаеше от унифициран флот под наем за водни спортове — RIB търгове, SUPs и каяци — с консистентна идентичност, материали, устойчиви на UV за тропическото слънце, и 5-годишен план за подмяна.
    solution: Проектиран специален пакет от 3 модела за флота с UV-стабилизирани PVC, графики по палубата с бранда на курорта и фазово разпределяне на доставките. Осигурено обучение на персонала и комплект за резервни части за всеки курорт.
    result: Доставени 180 единици в 5 курорта. Повторна поръчка за 2 нови имота. Намаление от 40% на разходите на единица спрямо предишни доставчици.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Каяк
      - RIB
      - Хотелиерство
    outcome_metrics:
      - label: Доставени единици
        value: 180
      - label: Курорти
        value: '5'
      - label: Намаление на разходите
        value: 40%
  - id: southeast-asia-search-rescue
    client: Югоизточноазиатска морска агенция
    product: Флот за патрул и спасителни RIB
    industry: Правителство / Морска сигурност
    challenge: Правителствена морска агенция се нуждаеше от 20 патрулни и спасителни RIBs с огнеустойчива Hypalon материя, самопочистващи се подове, интегрирани стойки за VHF/радиоконсоли и съответствие със стандартите за спасителни катери на SOLAS Глава III.
    solution: Произведени 20 RIBs с CSM Hypalon тръби, корпуси от морско качество алуминий, здрави очи за теглене и предварително инсталирани комплекти навигационни светлини. Заводският инспекционен екип наблюдаваше морските изпитания. Осигурен е пълен комплект документация SOLAS.
    result: Договорът бе изпълнен за 4 месеца. Флотът е разположен за граничен патрул, търсене и спасяване и реагиране при бедствия в 3 регионални бази.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Правителство
      - SOLAS
    outcome_metrics:
      - label: Патрулен RIBs
        value: '20'
      - label: Доставка
        value: 4 месеца
      - label: Бази
        value: '3'
  - id: european-dtc-ecommerce
    client: Европейска марка DTC за водни спортове
    product: SUP + Брандирана линия аксесоари
    industry: Електронна търговия / Търговия на дребно
    challenge: Бързо развиваща се марка DTC за водни спортове се нуждаеше от пълен SUP пакет (дъска, помпа, гребло, повод, чанта) с премиум опаковки, предназначени за изпълнение на електронна търговия — директно за потребителя чрез DHL/FedEx без щети.
    solution: Разработи съвместна продуктова линия с персонализирано EPS ядро, патентована drop-stitch технология за по-високо налягане и готови за търговия двустенни гофрирани кутии с вградени подплънки. Интегрирана автентичност и гаранция, базирана на QR-код.
    result: Серията 3 модела SUP беше пусната за 75 дни. 15 000+ единици за първите 12 месеца. Среден рейтинг 4.8★ при 2 000+ ревюта. 0.3% степен на повреди при транспортиране.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - Електронна търговия
    outcome_metrics:
      - label: Модели
        value: '3'
      - label: Брой единици
        value: 15,000+
      - label: Среден рейтинг
        value: 4.8★
      - label: Степен на щети
        value: 0.3%
certifications:
  - name: CE
    body: Европейски съюз
    desc: Продуктите CE имат сертификация съгласно приложимите директиви на ЕС — развлекателни съдове по ISO EN 6185, лични плавателни устройства по EN ISO 12402, където е приложимо.
  - name: ISO 9001
    body: SGS / BSI
    desc: Система за управление на качеството, сертифицирана за проектиране, производство и разпространение на надуваеми водни съдове.
  - name: BSCI
    body: amfori
    desc: Сертификация за социално съответствие, демонстрираща етично производство, справедлив труд и безопасност на работното място.
  - name: REACH
    body: Европейска агенция за химикали
    desc: Всички материали отговарят REACH на регулациите за химическа безопасност. Документация се предоставя при всяка пратка.
  - name: RoHS
    body: Европейски съюз
    desc: Ограничаване на спазването на опасните вещества във всички електронни и електрически компоненти.
  - name: AS 1799
    body: Стандарти Австралия
    desc: Австралийски стандарт за надуваеми лодки — тестван и сертифициран за търговска употреба във водите на Австралия/Нова Зеландия.
