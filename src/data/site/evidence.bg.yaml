badge: Proof & Quality
heading: Доказателства
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Разпродажба на стоки, Контрол на качеството за търговския обект
    product: Всеки свръхналичен борд, повторно инспектиран
    industry: Контрол на качеството
    challenge: Бордове за излишъци и разпродажби идват от излишък на производствени серии, затова купувачите справедливо се питат дали борд с намалена цена преминава същите проверки като такъв на пълна цена.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: Процент на дефектни продукти от 0,7% върху изходящите пратки през последните 12 месеца — същият стандарт се прилага за стоките за освобождаване и за търговските наличности.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Процент без дефекти
        value: 99.3%
      - label: Покритие на теста за налягане
        value: 100%
      - label: Продължителност на задържане
        value: 24-48h
  - id: pressure-test-regime
    client: Притискане с държане за 24-48 часа
    product: Всяка камера, 1,25x номинално налягане
    industry: Тестване на продукт
    challenge: Дъска SUP живее или загива заради своя drop-stitch ядро и шевове, а бързата проверка на надуването в края на линията не е достатъчна, за да се открият бавни течове или слаби заварки.
    solution: Всеки борд се надува до 1,25 пъти номиналното му налягане и се задържа за 24-48 часа, като спадът на налягането трябва да остане под 5%. Вентили, D-пръстени, шевове и плавучест се проверяват с нулева толерантност към дефекти, свързани с безопасността.
    result: 100% от продукцията преминава през този режим преди опаковане — няма пробни извадки, няма изключения.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - 1,25x Налягане
      - Нула дефекти по безопасността
    outcome_metrics:
      - label: Тестово налягане
        value: 1.25x
      - label: Максимален спад на налягането
        value: <5%
      - label: Тествани единици
        value: 100%
  - id: warranty-claims-support
    client: Гаранция, която отговаря
    product: 2-годишно покритие на SUP дъски и аксесоари
    industry: Следпродажбено обслужване
    challenge: Покупката на стоки с намаление директно от фабриката повдига справедлив въпрос — ако нещо се обърка месеци по-късно, кой ще се занимава с това?
    solution: Всяка дъска се доставя с 2-годишна гаранция, която покрива SUP дъски, drop-stitch шевове, клапани за надуване и аксесоари. Жалбите се изпращат директно на нашия екип — изпратете снимки или кратко видео и ние ще се погрижим за всичко останало.
    result: Жалбите по гаранцията се разглеждат и разрешават от същия екип, който инспектира производството — без разкарване от дистрибутор на дистрибутор.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - 2 години гаранция
      - Пряка поддръжка
      - Покрити аксесоари
    outcome_metrics:
      - label: Гаранция
        value: 2 години
      - label: Покритие
        value: Аксесоари за дъска +
      - label: поддръжка
        value: Пряк екип
