cases:
  - id: beginner
    title: Početno veslanje
    desc: Stabilne napuhavajuće SUP daske za one koji veslaju prvi put.
    scenario: Obitelj koja vikendom posjećuje jezero želi isprobati paddle boarding. Trebaju stabilnu, lako pokretnu opremu s jasnim uputama za sigurnost.
    solution: SUP Explorer 11 pruža stabilnost širokog tijela za početnike. Life Vest Classic osigurava CE-certificiranu plutajuću sigurnost. Oars & Pump Set napuhava dasku za manje od 10 minuta.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Turizam i istraživanje
    desc: Napuhavajuće SUP daske dugog dometa za jezera, rijeke i obalne izlete.
    scenario: Ljubitelj prirode planira tjedni veslački izlet i treba dasku koja se lako spakira, napuhava u kampu i drži pravac na otvorenoj vodi.
    solution: Ocean Voyager Series klizi učinkovito s turizmom oblikom i održava kurs u vjetru i valovima. Njegova drop-stitch konstrukcija napuhuje se do 15 PSI za čvrstoću tvrde daske.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga i fitness
    desc: Ekstra široke, stabilne platforme za jogu, fitness i opuštanje.
    scenario: Praktikant joge želi plutajući studio za jutarnje seanse na mirnoj vodi, s dovoljno prostora na palubi za svaku pozu.
    solution: Flowing Lotus Series ima podlogu preko cijele duljine palube i širok gred za stabilne poze bez poskakivanja. Također služi kao stabilna platforma za lagane fitness vježbe.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Obiteljska rekreacija
    desc: Kompletni SUP paketi za vikende na jezeru i praznike.
    scenario: Obitelj od četiri člana želi stabilne daske za vikend izlete na jezero i odmore na plaži — opremu koja stane u automobil i napuhava se za nekoliko minuta.
    solution: Tropical Breeze Series je stabilna višenamjenska daska koju može koristiti cijela obitelj, dok je Medusa Glow Series lakša i kraća za djecu. Obje stane u ruksak za jednostavan transport.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
