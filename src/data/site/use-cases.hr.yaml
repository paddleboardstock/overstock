cases:
  - id: beginner
    title: Sportske aktivnosti na vodi za početnike
    desc: Stabilne SUP daske i kajaci za korisnike koji prvi put koriste opremu.
    scenario: Obitelj koja vikendom posjećuje jezero želi isprobati paddle boarding. Trebaju stabilnu, lako pokretnu opremu s jasnim uputama za sigurnost.
    solution: SUP Explorer 11 pruža stabilnost širokog tijela za početnike. Life Vest Classic osigurava plovnost certificiranu prema CE. Dual-Action Pump napuhuje obje daske za manje od 10 minuta.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Izleti u prirodu
    desc: Prijenosni kajaci i mali čamci za rijeke, jezera i obalne izlete.
    scenario: Ljubitelj prirode planira tjedni izlet rijekom i treba čamac koji se lako spakira, napuhava u kampu i podnosi različite struje.
    solution: Kajak Lite stane u ruksak i napuhava se za manje od 4 minute. Njegova drop-stitch konstrukcija podnosi jezera, spore rijeke i obalsko veslanje.
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: Profesionalne operacije
    desc: Komercijalna RIBs za turističke operatore i hitne službe.
    scenario: Operator obalnog turizma treba flotu izdržljivih čamaca koji svakodnevno voze izlete u različitim uvjetima mora i ispunjavaju komercijalne sigurnosne propise.
    solution: RIB 330 i RIB 450 Patrol koriste duboke V trupa od stakloplastike s Hypalon tubama za izdržljivost u svim vremenskim uvjetima. Više jedinica može se koristiti uz dosljedne performanse.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: Obiteljska rekreacija
    desc: Prostrani mali čamci za jednodnevne izlete, ribolov i sportove na vodi.
    scenario: Obitelj od četiri osobe želi stabilan čamac za vikend izlete na jezeru, ribolovne izlete i vučenje cijevi za djecu.
    solution: AirDeck 360 sjedi do pet osoba s ojačanim zračnim podom. Napuhava se na mjestu lansiranja, sprema u automobil i podnosi mirna jezera i zaštićena obalna područja.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
