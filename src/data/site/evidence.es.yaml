badge: Pruebas y resultados
heading: Evidencias
description: Casos prácticos reales, certificaciones, datos de prueba y fotos de despliegue que demuestran nuestra capacidad de fabricación y la calidad de nuestros productos.

case_studies:
  - id: retail-private-label
    client: Minorista europeo de outdoor
    product: Línea de SUP de marca propia
    industry: Comercio minorista
    challenge: Un minorista europeo de outdoor necesitaba una línea de SUP de marca propia con gráficos exclusivos de cubierta, PVC ecológico y embalaje listo para el punto de venta, todo entregado en 60 días.
    solution: Desarrollamos los archivos de impresión digital personalizados, conseguimos PVC conforme con REACH y redujimos el muestreo de 3 rondas a 1 al ubicar al equipo de diseño en nuestra fábrica de Qingdao.
    result: 55 días desde la orden de compra firmada hasta el FOB. 2,400 unidades en 4 SKUs. Pedido repetido antes de la llegada del primer contenedor.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags: [OEM, Minorista, SUP]
    outcome_metrics:
      - label: Plazo de entrega
        value: 55 días
      - label: Unidades
        value: 2,400
      - label: SKUs
        value: '4'

  - id: startup-drop-stitch-kayak
    client: Startup estadounidense de deportes acuáticos
    product: Kayak drop-stitch
    industry: Startup / Comercio minorista
    challenge: Una startup estadounidense de deportes acuáticos necesitaba un kayak drop-stitch de alto rendimiento con forma de casco personalizada, embalaje de marca compartida y certificación BSCI para su comercialización en tiendas.
    solution: Adaptamos un molde de kayak drop-stitch existente con un perfil de rocker modificado, desarrollamos el diseño del embalaje de marca compartida y proporcionamos la documentación completa de la auditoría BSCI.
    result: Incluido con éxito en 3 grandes cadenas de outdoor de EE. UU. Más de 5,000 unidades en el primer año con una tasa de venta del 98%.
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
    tags: [OEM, Kayak, BSCI]
    outcome_metrics:
      - label: Cadenas minoristas
        value: '3'
      - label: Unidades en el primer año
        value: 5,000+
      - label: Tasa de venta
        value: 98%

  - id: australian-rib-distributor
    client: Distribuidor australiano
    product: Gama de RIB con certificación CE
    industry: Náutica / Sector público
    challenge: Un distribuidor australiano necesitaba una gama de RIB con certificación CE, colores de tubo personalizados, opción de mejora a Hypalon y cumplimiento de la norma australiana AS 1799.
    solution: Producimos muestras de preproducción en 4 variantes de color de tubo, conseguimos Hypalon CSM de un proveedor japonés y coordinamos las pruebas de conformidad AS 1799 con un organismo externo.
    result: Gama de 3 modelos de RIB lanzada en el mercado AU/NZ. Seguida de la adjudicación de un contrato gubernamental para 12 RIB de patrulla.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
    tags: [OEM, RIB, Hypalon, Sector público]
    outcome_metrics:
      - label: Modelos lanzados
        value: '3'
      - label: Contrato de embarcaciones de patrulla
        value: 12 unidades
      - label: Cumplimiento
        value: AS 1799

  - id: caribbean-resort-fleet
    client: Grupo de resorts de lujo del Caribe
    product: Flota para resort — RIB, SUP y kayaks
    industry: Hostelería / Turismo
    challenge: Un grupo con 5 resorts necesitaba una flota unificada de equipos náuticos de alquiler — embarcaciones auxiliares RIB, SUP y kayaks — con una imagen de marca coherente, materiales resistentes a los rayos UV para el sol tropical y un plan de renovación a 5 años.
    solution: Diseñamos un paquete de flota personalizado de 3 modelos con PVC estabilizado contra rayos UV, gráficos de cubierta con la marca del resort y un calendario de entrega por fases. Incluimos formación del personal y un kit de repuestos específico para cada resort.
    result: 180 unidades entregadas en 5 resorts. Pedido repetido para 2 nuevas propiedades. Reducción del 40% en el coste por unidad frente a proveedores anteriores.
    image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    tags: [OEM, SUP, Kayak, RIB, Hostelería]
    outcome_metrics:
      - label: Unidades entregadas
        value: 180
      - label: Resorts
        value: '5'
      - label: Reducción de costes
        value: 40%

  - id: southeast-asia-search-rescue
    client: Agencia marítima del Sudeste Asiático
    product: Flota de RIB de patrulla y rescate
    industry: Sector público / Seguridad marítima
    challenge: Una agencia marítima gubernamental necesitaba 20 RIB de patrulla y rescate con lona Hypalon ignífuga, suelos autovaciables, soportes integrados para consola VHF/radio y cumplimiento de las normas de embarcación de rescate del capítulo III del SOLAS.
    solution: Fabricamos 20 RIB con tubos de Hypalon CSM, cascos de aluminio de grado marino, argollas de remolque reforzadas y paquetes de luces de navegación preinstalados. El equipo de inspección de fábrica presenció las pruebas de mar. Se proporcionó el paquete documental completo del SOLAS.
    result: Contrato entregado en 4 meses. Flota desplegada para patrullaje fronterizo, búsqueda y rescate y respuesta ante desastres en 3 bases regionales.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
    tags: [OEM, RIB, Hypalon, Sector público, SOLAS]
    outcome_metrics:
      - label: RIB de patrulla
        value: '20'
      - label: Entrega
        value: 4 meses
      - label: Bases
        value: '3'

  - id: european-dtc-ecommerce
    client: Marca europea de deportes acuáticos DTC
    product: Línea de SUP de marca + accesorios
    industry: E-commerce / Comercio minorista
    challenge: Una marca DTC de deportes acuáticos en rápido crecimiento necesitaba un paquete SUP completo (tabla, bomba, pala, leash, bolsa) con embalaje premium diseñado para la logística del e-commerce, con entrega directa al consumidor por DHL/FedEx sin daños.
    solution: Desarrollamos una línea de productos de marca compartida con moldeado personalizado del núcleo de EPS, tecnología drop-stitch propia para una mayor presión y cajas de cartón corrugado de doble pared listas para el punto de venta con insertos acolchados. Integramos el registro de autenticidad y garantía mediante código QR.
    result: Línea de 3 modelos de SUP lanzada en 75 días. Más de 15,000 unidades en los primeros 12 meses. Valoración media de 4.8★ en más de 2,000 reseñas. Tasa de daños en tránsito del 0.3%.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags: [OEM, SUP, DTC, E-commerce]
    outcome_metrics:
      - label: Modelos
        value: '3'
      - label: Unidades
        value: 15,000+
      - label: Valoración media
        value: 4.8★
      - label: Tasa de daños
        value: 0.3%

certifications:
  - name: CE
    body: Unión Europea
    desc: 64 modelos con certificación CE de conformidad con las directivas aplicables de la UE para embarcaciones de recreo y dispositivos de flotación personales.
  - name: ISO 9001
    body: SGS / BSI
    desc: Sistema de gestión de calidad certificado para el diseño, la fabricación y la distribución de embarcaciones inflables.
  - name: BSCI
    body: amfori
    desc: Certificación de cumplimiento social que acredita una fabricación ética, condiciones laborales justas y seguridad en el lugar de trabajo.
  - name: REACH
    body: Agencia Europea de Sustancias y Mezclas Químicas
    desc: Todos los materiales cumplen el reglamento REACH sobre seguridad química. La documentación se incluye con cada envío.
  - name: RoHS
    body: Unión Europea
    desc: Cumplimiento de la restricción de sustancias peligrosas en todos los componentes electrónicos y eléctricos.
  - name: AS 1799
    body: Standards Australia
    desc: Norma australiana para embarcaciones inflables, probada y certificada para uso comercial en aguas de AU/NZ.

