badge: Proof & Quality
heading: Evidencia
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Stock de Liquidación, Control de Calidad de Nivel Minorista
    product: Cada Tabla de Overstock, Reinspeccionada
    industry: Control de Calidad
    challenge: Las tablas de sobrestock y liquidación provienen de producciones excedentes, por lo que los compradores preguntan con razón si una tabla con descuento pasa las mismas comprobaciones que una a precio completo.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: Tasa de defectos del 99.3% en los envíos salientes durante los últimos 12 meses — el mismo estándar se aplica a las existencias de liquidación y minorista.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Tasa libre de defectos
        value: 99.3%
      - label: Cobertura de la Prueba de Presión
        value: 100%
      - label: Duración de la Retención
        value: 24-48h
  - id: pressure-test-regime
    client: La Retención de Presión de 24-48 Horas
    product: Cada Cámara, 1.25x Presión Nominal
    industry: Pruebas de Producto
    challenge: Una tabla SUP vive o muere por su núcleo drop-stitch y sus costuras, y una revisión rápida de inflación al final de la línea no es suficiente para detectar fugas lentas o soldaduras débiles.
    solution: Cada tabla se infla a 1.25 veces su presión nominal y se mantiene durante 24-48 horas, con la caída de presión requerida para mantenerse por debajo del 5%. Las válvulas, anillos en D, costuras y flotabilidad se revisan sin tolerancia a defectos de seguridad.
    result: El 100% de la producción pasa por este régimen antes del embalaje — sin atajos de muestreo, sin excepciones.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - 1.25x Presión
      - Cero Defectos de Seguridad
    outcome_metrics:
      - label: Presión de Prueba
        value: 1.25x
      - label: Caída Máxima de Presión
        value: <5%
      - label: Unidades Probadas
        value: 100%
  - id: warranty-claims-support
    client: Una Garantía que Responde
    product: Cobertura de 2 Años en Tablas y Accesorios SUP
    industry: Postventa
    challenge: "Comprar productos en liquidación directamente de la fábrica plantea una pregunta justa: si algo sale mal meses después, ¿quién se hace cargo?"
    solution: "Cada tabla se envía con una garantía de 2 años que cubre tablas SUP, costuras drop-stitch, válvulas de inflación y accesorios. Las reclamaciones se envían directamente a nuestro equipo: envía fotos o un video corto y nosotros nos encargamos del resto."
    result: Las reclamaciones de garantía son revisadas y resueltas por el mismo equipo que inspecciona la producción, sin intermediarios de distribuidores.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - Garantía de 2 Años
      - Soporte Directo
      - Accesorios Cubiertos
    outcome_metrics:
      - label: Garantía
        value: 2 años
      - label: Cobertura
        value: Tablas + Accesorios
      - label: Soporte
        value: Equipo Directo
