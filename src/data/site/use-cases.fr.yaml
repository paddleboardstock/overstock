cases:
  - id: beginner
    title: 'Sports nautiques pour débutants'
    desc: 'Des planches de SUP et des kayaks stables pour les premiers pas.'
    scenario: >-
      Une famille qui passe le week-end au bord d'un lac souhaite essayer le
      paddle. Elle a besoin d'un équipement stable, facile à mettre à l'eau,
      avec des consignes de sécurité claires.
    solution: >-
      La SUP Explorer 11 offre une stabilité à large plateforme pour les
      débutants. Le gilet Life Vest Classic assure une flottabilité certifiée
      CE. La pompe à double action gonfle les deux planches en moins de
      10 minutes.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp

  - id: river-touring
    title: 'Exploration en plein air'
    desc: 'Des kayaks et annexes portables pour les rivières, les lacs et les sorties côtières.'
    scenario: >-
      Un passionné de plein air prépare une expédition d'une semaine en rivière
      et cherche un bateau qui se plie en petit volume, se gonfle au camp et
      tient face à des courants variés.
    solution: >-
      Le Kayak Lite se range dans un sac à dos et se gonfle en moins de
      4 minutes. Sa construction drop-stitch maîtrise les lacs, les rivières
      calmes et la navigation côtière.
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp

  - id: professional-operations
    title: 'Opérations professionnelles'
    desc: 'Des RIB de qualité commerciale pour les opérateurs touristiques et les interventions d''urgence.'
    scenario: >-
      Un opérateur touristique côtier a besoin d'une flotte de bateaux robustes
      assurant des sorties quotidiennes dans des conditions de mer variées et
      conformes aux réglementations de sécurité commerciale.
    solution: >-
      Les RIB 330 et RIB 450 Patrol utilisent des coques en fibre de verre à V
      profond et des flotteurs en Hypalon pour une durabilité par tous les
      temps. Plusieurs unités peuvent être déployées avec des performances
      constantes.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp

  - id: family-recreation
    title: 'Loisirs en famille'
    desc: 'Des annexes spacieuses pour les sorties à la journée, la pêche et les sports nautiques.'
    scenario: >-
      Une famille de quatre personnes cherche un bateau stable pour les
      week-ends au lac, les sorties pêche et le remorquage d'une bouée pour les
      enfants.
    solution: >-
      L'AirDeck 360 accueille jusqu'à cinq personnes grâce à son plancher à
      coussin d'air renforcé. Il se gonfle sur la rive, se range dans la voiture
      et convient aussi bien aux lacs calmes qu'aux eaux côtières abritées.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp