cases:
  - id: beginner
    title: Pagaie pour débutants
    desc: Planches gonflables stables SUP pour les pagayeurs débutants.
    scenario: Une famille visitant un lac pour le week-end veut essayer le paddle. Ils ont besoin d'équipements stables, faciles à mettre à l'eau avec des consignes de sécurité claires.
    solution: Le SUP Explorer 11 offre une stabilité à corps large pour les débutants. Le Life Vest Classic assure une flottabilité certifiée CE. Le Oars & Pump Set gonfle la planche en moins de 10 minutes.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Tourisme et Exploration
    desc: Planches gonflables SUP de longue distance pour lacs, rivières et côtes.
    scenario: Un passionné de plein air prévoit un séjour d'une semaine en paddle et a besoin d'une planche qui se plie facilement, se gonfle au camp et garde le cap sur l'eau libre.
    solution: Le Ocean Voyager Series glisse efficacement grâce à sa forme de tourisme et maintient le cap malgré le vent et la houle. Sa construction drop-stitch gonfle jusqu'à 15 PSI pour une rigidité comparable à une planche rigide.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga et Fitness
    desc: Plateformes extra-larges et stables pour le yoga, le fitness et la détente.
    scenario: Un pratiquant de yoga veut un studio flottant pour les séances matinales sur eau calme, avec suffisamment d'espace sur le pont pour chaque posture.
    solution: Le Flowing Lotus Series dispose d'un tapis de pont sur toute la longueur et d'une large largeur pour des postures sans oscillation. Il sert également de plateforme stable pour des séances légères de fitness.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Récréation familiale
    desc: Packages complets SUP pour les journées lacustres et les vacances.
    scenario: Une famille de quatre personnes veut des planches stables pour les sorties de week-end au lac et les vacances à la plage — du matériel qui se range facilement dans la voiture et se gonfle en quelques minutes.
    solution: Le Tropical Breeze Series est une planche polyvalente stable que toute la famille peut partager, tandis que le Medusa Glow Series est plus légère et plus courte pour les enfants. Les deux se rangent dans des sacs à dos pour un transport facile.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
