  title: 'دليل شراء سترة النجاة: أنواعه، القياس، والميزات المفسرة'
  description: دليل كامل لشراء سترات النجاة للرياضات المائية. PFD الأنواع (من I إلى V)، التضخم مقابل الرغوة، اختبار الملاءمة، والتوصيات المحددة لـ SUP، والتجديف، وركوب القوارب، وصيد الأسماك.
  definition: سترة النجاة أو PFD هي جهاز طفو مصمم لإبقاء رأس الشخص فوق الماء. يتم تنظيم الأنواع بواسطة خفر السواحل الأمريكي بناءً على الطفو والاستخدام المقصود.
  tldr: 'خمسة أنواع PFD: النوع الأول (خارج الساحل، 22+ رطل)، النوع الثاني (قريب من الساحل)، النوع الثالث (سُلَّم تعويم، الأكثر شيوعًا)، النوع الرابع (قابل للرمي)، النوع الخامس (استخدام خاص). توفر السترات القابلة للنفخ راحة لكنها تتطلب صيانة خرطوشة CO2. السترات الرغوية لا تحتاج إلى صيانة لكنها أكثر ضخامًة.'
  problem: سترات الحياة تُصنَّف حسب الأنواع وتصنيفات الطفو، لكن المتاجر لا توضح دائمًا أي نوع يناسب نشاطك.
  explanation: النوع الأول يوفر أكبر قدر من الطفو ويضع المرتدي غير الواعي على وجهه للأعلى. النوع الثاني قد لا يضع جميع المرتدين على وجههم للأعلى. النوع الثالث يسمح بحرية الحركة للرياضات النشطة. النوع الخامس يشمل أحزمة قابلة للنفخ لـ SUP. PFDs القابلة للنفخ توفر طفوًا قدره 33-37 رطل وتكون مضغوطة عند تفريغها من الهواء.
  solution: 'لـ SUP: حقيبة حزام قابلة للنفخ من النوع V. للتجديف: رغوة من النوع III مع فتحات عالية للذراعين. لـ RIB التجديف بالقارب: رغوة من النوع III أو قابلة للنفخ بطفو 22+ رطل. للأطفال: رغوة من النوع II أو III مع حزام بين الأرجل.'
  recommendation: Aquafarer سترة النجاة برو (قابلة للنفخ النوع V، 33 رطل) لـ SUP وكاياك. Aquafarer سترة النجاة كلاسيك (رغوة النوع III، 16.5 رطل) لـ RIB القوارب والاستخدام البحري العام.
  faq:
    - q: ما نوع PFD الذي أحتاجه لـ SUP؟
      a: تقبل العديد من الولايات القضائية النوع الثالث أو النوع الخامس لـ SUP. حزم الأحزمة القابلة للنفخ شائعة. تحقق من القوانين المحلية.
    - q: هل تحتاج PFDs القابلة للنفخ إلى صيانة؟
      a: نعم — تحقق من خرطوشة ثاني أكسيد الكربون سنويًا، استبدل الملف كل سنتين إلى ثلاث سنوات، اشطفه بعد الاستخدام في مياه البحر.
    - q: هل يمكنني ارتداء رغوة PFD لـ SUP؟
      a: نعم، ولكن اختر واحدًا ذو قصات أذرع عالية. السترات الرغوية أكثر حجمًا لكنها لا تتطلب أي صيانة.
    - q: ما هو PFD الأفضل للطفل؟
      a: سترة من النوع الثاني أو الثالث معتمدة من USCG مع طوق وحزام بين الفخذين وألوان زاهية. لا تستخدم أبداً PFDs القابلة للنفخ للأطفال.
