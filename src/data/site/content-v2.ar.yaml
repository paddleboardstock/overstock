  title: شرح أحوال المحيط (اقرأ توقعات الأمواج مثل المحترفين)
  description: ارتفاع الموج، الفترة، اتجاه الرياح، المد والجزر — فك رموز أي توقع للأمواج في 60 ثانية. ماذا تعني الأرقام فعليًا لموقعك المحلي ومتى يجب البقاء على الشاطئ.
  definition: 'يتم تحديد ظروف المحيط بواسطة ثلاثة عوامل: الأمواج (الارتفاع، الفترة، الاتجاه)، الرياح (الرياح البعيدة عن الشاطئ تكون هادئة، والرياح باتجاه الشاطئ تكون متقلبة)، والمدّ (يغير عمق الماء فوق الحواجز الرملية والشعاب المرجانية).'
  tldr: 'ثلاثة عوامل تحدد جودة ركوب الأمواج: الموج المتدفق (الحجم، الفترة، الاتجاه)، الرياح (الرياح من الشاطئ نظيفة، من اليابسة متقطعة)، والمد والجزر (يدفع الماء إلى الداخل أو الخارج فوق حواجز الرمال). استخدم فترة الموج لتقدير القوة — الفترة الطويلة تعني أمواج أكثر قوة. تحقق من توقع ركوب الأمواج الذي يجمع بين هذه الثلاثة قبل كل جلسة.'
  problem: 'تظهر توقعات الأمواج أرقامًا مربكة: 3 أقدام عند 12 ثانية من 290°، ورياح خفيفة من الخارج. أنت لا تعرف ما يعنيه ذلك للشاطئ الذي تخطط للتزلج عليه. بدون تفسير التوقعات، إما أن تقود سيارتك إلى شاطئ هادئ أو تجدف في ظروف خطيرة.'
  explanation: 'يتم قياس الأمواج عبر الارتفاع (ارتفاع الوجه بالأقدام)، والفترة (الثواني بين كل موجة)، والاتجاه (من أين تأتي الأمواج). الأمواج ذات الفترات الطويلة (12 ثانية أو أكثر) تحمل طاقة أكبر وتنتج موجات أنظف وأكثر قوة. جودة الرياح: الرياح الخارجية (التي تهب من الأرض نحو البحر) تدعم وجه الموجة، مما يخلق موجات ناعمة ونظيفة؛ الرياح الداخلية (من البحر نحو الأرض) تقوم بتمزيق السطح. الرياح الجانبية مقبولة لكنها ليست مثالية. المد والجزر يؤثران على شكل الموج حسب نقطة الانكسار — غالبًا ما تعمل انكسارات الشاطئ بشكل أفضل عند منتصف المد، وانكسارات الشعاب عند مستويات محددة من المد اعتمادًا على عمق الشعاب.'
  solution: استخدم موقع ويب أو تطبيق لتوقع الأمواج وتعلم كيفية قراءة ثلاثة معايير لكسر الأمواج المحلي. قارن اتجاه الأمواج مع اتجاه الشاطئ — الشاطئ الذي يواجه الغرب يحتاج إلى موج غربي. تحقق من توقعات الرياح للوقت الذي تخطط فيه للتزلج على الأمواج، وليس تقرير الصباح. تعرف على تفضيل المد لجسر الأمواج الخاص بك عن طريق مراقبته عند مستويات مد مختلفة.
  recommendation: 'اقضِ شهرًا في تسجيل الأحوال وجودة الأمواج على شاطئك المحلي. ستكتشف الأنماط: أي اتجاهات الأمواج تعمل، أي المد والجزر ينتج أفضل شكل، وأي الرياح تدمر السطح. يرافق دليل حالة المحيط دليل أساسيات سلامة ركوب الأمواج لتكوين أساس شامل لمحو الأمية البحرية.'
  faq:
    - q: ما هي فترة الموج الجيدة للركمجة؟
      a: 8-10 ثوانٍ تنتج أمواجًا ضعيفة وغير منظمة مناسبة للمبتدئين. 10-13 ثانية هي النقطة المثالية لمعظم النقاط — طاقة جيدة بدون أن تكون خطيرة. 14+ ثانية تنتج أمواجًا قوية ومركزة مناسبة للمتزلجين المتقدمين.
    - q: ما هو أفضل رياح لممارسة ركوب الأمواج؟
      a: تنتج الرياح البحرية الخفيفة (5-10 عقود) أفضل وجوه الأمواج نظافة. الظروف الزجاجية (انعدام الرياح) مثالية لكنها نادرة. الرياح الآتية من اليابسة تجعل الأمواج وعرّة وأكثر صعوبة في الركوب. الرياح البحرية القوية يمكن أن تجعل الإقلاع خطيرًا عن طريق إبقاء شفة الموجة مرتفعة لفترة طويلة.
    - q: كيف تؤثر المد والجزر على الأمواج؟
      a: تغير المد والجزر العمق فوق البارات الرملية والشعاب المرجانية. يمكن أن يكشف المد المنخفض عن المخاطر ويجعل الأمواج أكثر انحدارًا أو تغلق. قد يخفف المد العالي الأمواج أو يجعلها سميكة وبطيئة. تعمل معظم الشواطئ التي تنكسر فيها الأمواج بشكل أفضل قبل أو بعد ساعتين إلى ثلاث ساعات من المد العالي أو المنخفض.
    - q: هل يمكنني ركوب الأمواج في الرياح القريبة من الشاطئ؟
      a: نعم، لكن الجودة ستكون أقل. وجوه الأمواج المتقطعة تجعل الانعطافات أصعب والكدح بالمجداف أقل كفاءة. غالبًا ما يفضل المبتدئون الرياح القادمة من الشاطئ لأن الأمواج فيها ألين وأقل قوة، مما يمنح وقتًا أطول للوقوف.
