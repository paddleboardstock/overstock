  title: 'SUP دليل المقاسات: الشرح عن الطول والعرض والحجم'
  description: اعثر على الحجم المناسب لـ SUP بناءً على وزنك ومستوى مهارتك وأسلوب تجديفك. الطول يحدد القدرة على التتبع، العرض يحدد الاستقرار، والحجم يحدد سعة الوزن.
  definition: يتم تحديد حجم SUP بواسطة الطول (السرعة والانزلاق)، العرض (الثبات الأساسي)، السُمك (الثبات الثانوي والحجم)، والحجم باللترات (السعة الإجمالية للوزن).
  tldr: 'شامل SUPs: 10''6"-11''6" × 32"-34" × 6" (220-280 لتر). للرحلات: 12''-14'' × 30"-32" (280-350 لتر). للأمواج: 8''-10'' × 30"-32" (140-220 لتر). يحتاج المبتدئون إلى عرض يزيد عن 32" وحجم يتجاوز وزن الجسم بمقدار 60-80 لتر. وزنك بالكيلوغرام زائد 60 لتر هو الحد الأدنى للحجم المستهدف للثبات.'
  problem: كل علامة تجارية SUP تسرد الألواح بالأقدام والبوصات واللترات، ولكن بدون معرفة كيف تترجم هذه القياسات إلى الإحساس في العالم الحقيقي، فإنك تخاطر بشراء لوح غير مستقر أو بطيء أو لا يمكنه دعم وزنك.
  explanation: 'الطول يحدد مدى سرعة تجديف اللوح ومدى استقراره في خط مستقيم. الألواح الأطول (12 قدمًا) تنزلق بين الضربات وتحافظ على المسار. الألواح الأقصر (أقل من 10 أقدام) تدور بسهولة ولكنها تتطلب تبديل المجداف بشكل متكرر. العرض يحدد الثبات الأساسي — ثبات الوقوف. لوح بعرض 30 بوصة يبدو مهتزًا للمبتدئين؛ وعرض 34 بوصة يبدو مثل الرصيف. السماكة تحدد الحجم — اللوح الأثخن يطفو أعلى لكنه يصطاد المزيد من الرياح. الحجم بالليترات هو المقياس الأفضل: يجب أن يغمر اللوح المحمَّل (أنت زائد المعدات) بمقدار 2-4 بوصات عند الراحة.'
  solution: 'طابق أبعاد لوحك مع ثلاثة عوامل: وزنك (يحدد الحد الأدنى للحجم)، نشاطك الرئيسي (يحدد الطول)، ومستوى مهارتك (يحدد العرض). للمبتدئين، اضرب وزنك بالكيلوغرام في 2.2 للحصول على الحد الأدنى باللترات. للمتوسطين، اضرب في 1.8. للمحترفين، اضرب في 1.4.'
  recommendation: يُناسب Aquafarer SUP Explorer 11 بحجم 11' × 33" × 6" وسعة 260 لتر معظم راكبي الألواح حتى 100 كجم لجميع أنواع التجديف. قم بالترقية إلى SUP Tour 12 بحجم 12' × 31" للحصول على سرعة تجوال أفضل وانزلاق أكثر.
  faq:
    - q: ما الحجم SUP الذي أحتاجه لوزني؟
      a: 'لراكبي أقل من 70 كغ: 10-11 قدم × 32 بوصة (220-260 لتر). للركاب من 70-90 كغ: 11-12 قدم × 33 بوصة (260-300 لتر). للركاب من 90-110 كغ: 11-12 قدم × 34 بوصة (300-350 لتر). للركاب أكثر من 110 كغ: 12 قدم × 34-36 بوصة (أكثر من 350 لتر).'
    - q: هل SUP الأطول أسرع؟
      a: نعم. الألواح الأطول لها نسبة طول إلى عرض أفضل، مما يقلل الاحتكاك. لوح جولات بطول 14 قدمًا SUP أسرع بشكل ملحوظ من لوح متعدد الاستخدامات بطول 11 قدمًا بنفس جهد التجديف.
    - q: ما هو عرض SUP المستقر للمبتدئين؟
      a: 33-34 بوصة هو النطاق المثالي للمبتدئين حتى 90 كجم. أقل من 32 بوصة يحتاج إلى توازن جيد. أكثر من 34 بوصة مستقر جدًا ولكنه أبطأ وأصعب في التجديف في الرياح.
    - q: هل يمكنني استخدام لوح شامل للجولات؟
      a: نعم، للجولات القصيرة تحت 10 كم. للمسافات الأطول، لوح جولات مخصص يتتبع بشكل أفضل ويغطي المسافة بكفاءة أكبر.
