  title: 'فهم المد للجزر للرياضات المائية: دليل عملي'
  description: كيف تؤثر المد والجزر على SUP وظروف ركوب الأمواج والتجديف بالكاياك. قراءة جداول المد والجزر، وفهم المد والجزر الربيعي مقابل المد والجزر المنخفض، وتخطيط جلستك حول تحركات المد والجزر من أجل السلامة.
  definition: المد والجزر هما ارتفاع وانخفاض مستويات سطح البحر يوميًا بسبب جاذبية القمر والشمس. يختلف مدى المد والجزر حسب الموقع والدورة القمرية.
  tldr: 'مدّين وموّحين يوميًا في معظم الأماكن. للمدود الربيعية (القمر الكامل/الجديد) نطاقات أكبر وتيارات أقوى. للمدود النيبية (ربع القمر) نطاقات أصغر. يؤثر المدّ على عمق الماء، وشكل الأمواج، وقوة التيار. بالنسبة لـSUP: جدف ضد التيار أولًا حتى يساعدك على العودة.'
  problem: تصل إلى شاطئك المحلي لتجد أن الأمواج نادرة، أو توجد تيارات خطيرة ناجمة عن المد الخارج، أو أن المياه ضحلة جدًا. بدون فهم للمد والجزر، تهدر رحلاتك أو تتجدف في ظروف خطرة.
  explanation: تحدث المد والجزر بسبب جاذبية القمر. المد والجزر الربيعي (القمر الكامل والقمر الجديد) ينتج أعلى المد والجزر وأدنى الجزر. المد والجزر المربع (ربع القمر) ينتج نطاقًا أدنى. تكون التيارات البحرية أسرع عند منتصف المد والجزر، وهادئة عند المد والجزر العالي والمنخفض. يختلف مدى المد والجزر من 0.3 متر (البحر الأبيض المتوسط) إلى 16 مترًا (خليج فندي).
  solution: 'تحقق من جدول المد والجزر قبل كل جلسة. بالنسبة لركوب الأمواج: غالبًا ما تعمل الانكسارات الشاطئية بشكل أفضل قبل ساعتين إلى ثلاث ساعات أو بعد ارتفاع المد مباشرة. بالنسبة لـ SUP: تجديف ضد التيار في النصف الأول بحيث يساعدك التيار في العودة. بالنسبة للصيد: المد القادم يدفع الأسماك نحو الأرصفة الرملية.'
  recommendation: استخدم توقعات المد من NOAA أو تطبيق المد المحلي. تعرّف على تفضيل المد لمكانك المحلي عن طريق تسجيل الظروف على مدار شهر.
  faq:
    - q: ما هو مد الربيع؟
      a: تحدث المدود الربيعية خلال القمر الكامل والقمر الجديد، مما ينتج عنه ارتفاع المد العالي وزيادة قوة التيارات. وتحدث مرتين في الشهر.
    - q: ما هو المد الجزر المنخفض؟
      a: تحدث المد والجزر المنخفضان خلال أرباع القمر. يكون نطاق المد أقل، والتيارات أضعف — وهذا جيد للمبتدئين.
    - q: هل الجزر خطير على SUP؟
      a: المد المنخفض يمكن أن يكشف الصخور والشعاب المرجانية. كما أنه يركز طاقة الأمواج على مصاطب الرمل الأكثر انحدارًا.
    - q: كيف تؤثر الجزر والمد على التيارات القوية؟
      a: المد والجزر الخارج (الجزر) يقوي التيارات الجارفة. المد الداخل (الفيض) يقلل من قوة التيار الجارف.
