  title: 'دليل حجم لوح التجديف: الحجم والطول والعرض لكل راكب'
  description: حجم لوح التجديف الكامل مع توصيات الحجم حسب الوزن والنشاط. يشمل جدول حجم سهل الاستخدام لجميع الألواح متعددة الأغراض، والجولات، وركوب الأمواج، واليوغا SUP.
  definition: يتم تحديد حجم لوح التجديف بواسطة الحجم (قدرة التحمل والطفو)، الطول (السرعة والتتبع)، العرض (الثبات)، والسمك (توزيع الحجم ومقاومة الرياح).
  tldr: 'استخدم الوزن لإيجاد الحد الأدنى للحجم: 50-70 كغ يحتاج إلى 220-260 لتر، 70-90 كغ يحتاج إلى 260-300 لتر، 90-110 كغ يحتاج إلى 300-350 لتر، 110 كغ يحتاج إلى 350 لتر. للمبتدئين، أضف 20٪ إلى هذه الأرقام. العرض مهم: 32" متوسط، 33-34" مناسب للمبتدئين، 35" مستقر جدًا.'
  problem: تستخدم قوائم أحجام ألواح التجديف القدمين والبوصات واللترات بشكل متبادل، مما يجعل من الصعب المقارنة بين الماركات.
  explanation: الحجم هو المقياس الأكثر مباشرة لسعة الوزن — 1 لتر من المياه العذبة يزيح 1 كجم من الوزن. يمكن للوحة ذات سعة 260 لتر أن تدعم نظريًا 260 كجم، لكن السعة العملية أقل لأن اللوحة تحتاج إلى البقاء فوق الماء. يجب أن يكون وزنك الإجمالي (الجسم بالإضافة إلى المعدات) 30-40٪ من حجم اللوحة.
  solution: الحجم المستهدف = (وزن الجسم بالكيلوغرام + وزن المعدات بالكيلوغرام) × 3. بالنسبة لمجدف وزنه 75 كجم ومعدات بوزن 5 كجم، الهدف = 80 × 3 = 240 لتر كحد أدنى. للمبتدئين، اضرب في 3.5. للمحترفين، اضرب في 2.5.
  recommendation: يلائم مستكشف Aquafarer SUP 11 (260 لتر، 11 قدم × 33 بوصة × 6 بوصة) معظم الركاب الذين تتراوح أوزانهم بين 50-100 كجم. يمكن للركاب الأخف حجمهم أن يختاروا AirDeck 270. يجب على الركاب الأثقل النظر في SUP تور 12 (300 لتر+) أو الألواح الأوسع.
  faq:
    - q: هل الطول مهم لتحديد مقاس SUP؟
      a: الطول أقل أهمية من الوزن. يحتاج الراكب الطويل ذو الوزن الخفيف إلى حجم أقل من الراكب القصير الثقيل. استخدم الوزن كمحدد أساسي للحجم.
    - q: ماذا يحدث مع زيادة الحجم؟
      a: لوح التزلج يجلس مرتفعًا جدًا، ممسكًا بالرياح مثل الشراع. يبدو مطاطيًا في الأمواج الصغيرة. ومع ذلك، للمبتدئين، الحجم الزائد أفضل من الحجم القليل.
    - q: ماذا يحدث عند انخفاض الحجم جدًا؟
      a: تجلس اللوحة عميقًا جدًا، مما يخلق مقاومة. قد يغمر الأنف أثناء التجديف (التغطيس). تشعر بالتعب بسرعة عند التجديف بلوحة مغمورة جزئيًا.
    - q: هل تحتاج الألواح القابلة للنفخ إلى مقاسات مختلفة عن الألواح الصلبة؟
      a: ليس بشكل كبير. الألعاب القابلة للنفخ عند 15+ PSI تحل محل الماء بطريقة مشابهة للألواح الصلبة. تنطبق توصيات الحجم على كلا النوعين بالتساوي.
