  title: 'SUP دليل المرساة: البقاء في مكانك أثناء الصيد أو التصوير'
  description: الدليل الكامل لـ SUP التثبيت — أنواع المراسي (فطرية، قابلة للطي، وتربط بالأوتاد)، إعداد عقلة المرسى، تقنيات النشر، واعتبارات السلامة للبقاء في المكان.
  definition: المرساة SUP هي وزن مرتبط بحبل يثبت اللوح في مكانه ضد الرياح والتيار. الأنواع الشائعة تشمل مراسي الفطر، المراسي القابلة للطي، والأعمدة المثبتة.
  tldr: استخدم مرساة على شكل فطر (1.5-3 رطل) للقيعان الطينية أو الرملية، ومرساة قابلة للطي للقيعان الصخرية، أو عمود تثبيت للمياه الضحلة ذات القيعان الطرية. يجب أن تكون المرساة 1.5-3 رطل للظروف الهادئة، و3-5 رطل للرياح والتيارات. استخدم دائمًا مسار المرساة لضبط الموقع ومعرفة متى يتم التحرر.
  problem: تجد موقع الصيد المثالي لكن الرياح والتيار يبعدانك عن موقعك كل بضع دقائق. بدون تثبيت المرساة، SUP الصيد والتصوير هي تمارين محبطة في إعادة التموضع باستمرار.
  explanation: يعمل المرساة عن طريق الجر عبر القاع حتى تثبت. المراسي الفطرية تغرس في القاع الطري وتوفر تثبيتًا جيدًا في الرمل والطين. المراسي القابلة للطي تحتوي على شفرات تحفر في القيعان الصلبة أو الصخرية. أعمدة التثبيت تعمل في المياه الضحلة عن طريق دفعها مباشرة في القاع.
  solution: قم بتركيب نظام عربة مرساة (خط به حلقة منزلقة على جانب واحد من اللوح) لتعديل نقطة تثبيت المرساة. قم بربط 50-75 قدمًا من الحبل بالمرساة. ضعها مواجهة للرياح أو عكس التيار بالنسبة لموقعك المرغوب. استخدم نظام إطلاق سريع للفصل في حالات الطوارئ. لا تثبت المرساة أبدًا في تيار قوي أو في مكان لا يمكنك سحب المرساة منه بسهولة.
  recommendation: مرساة قابلة للطي بوزن 3 أرطال مع 50 قدم من الحبل تناسب معظم ظروف الصيد SUP. أضف نظام ترام المرساة باستخدام خواتم D على Aquafarer SUP Explorer 11 الخاص بك.
  faq:
    - q: ما حجم المرساة التي أحتاجها لـ SUP؟
      a: 1.5-3 رطل للبحيرات الهادئة والأنهار البطيئة. 3-5 رطل للمناطق الساحلية ذات الرياح أو التيار. المراسي الكبيرة الحجم صعبة الاسترجاع.
    - q: كم خط المرساة الذي أحتاجه؟
      a: نطاق 5:1 (5 أقدام من الحبل مقابل قدم واحدة من العمق) هو المعيار. في ماء بعمق 10 أقدام، استخدم 50 قدمًا من الحبل.
    - q: هل الإرساء خطير على SUP؟
      a: فقط إذا ربّيت المرساة في التيار أو الريح القوية بما يكفي لقلب اللوح. استخدم دائمًا نظام إطلاق سريع يمكن فصله على الفور.
    - q: هل يمكنني الرسو في أي ماء؟
      a: تحقق من اللوائح المحلية. بعض المناطق تقيّد الرسو للحفاظ على الأعشاب البحرية أو المواطن البحرية. لا ترس على شعاب مرجانية مطلقًا.
