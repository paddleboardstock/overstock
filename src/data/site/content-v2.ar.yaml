  title: ماذا ترتدي للتزلج على الأمواج (لا ترتدي شورتات ركوب الأمواج عندما تحتاج إلى بدلة ٥/٤)
  description: توقف عن التخمين فيما ترتديه. درجة حرارة الماء هي التي تحدد ملابس ركوب الأمواج، لا درجة حرارة الهواء. دليل كامل للطبقات من قمصان الحماية الاستوائية إلى تجهيزات الشتاء الكاملة 5/4/3 ملم.
  definition: تتراوح ملابس ركوب الأمواج من شورتات اللوح وملابس الحماية من الاحتكاك في المياه الدافئة إلى بدلات الغطس الكاملة بسماكة 5/4/3 ملم مع الأحذية والقبعات في المياه الباردة. درجة حرارة الماء، وليس درجة حرارة الهواء، هي التي تحدد ما تحتاجه.
  tldr: ما ترتديه عند ركوب الأمواج يعتمد بالكامل على درجة حرارة الماء — وليس درجة حرارة الهواء. حراس الطفح والسراويل القصيرة تناسب درجات حرارة أعلى من 22°م، والبدلات الربيعية تغطي 18-22°م، والبدلات الكاملة بسماكة 3/2 مم تناسب 14-18°م، وبدلات بسماكة 5/4/3 مم مع أحذية مطلوبة عند درجات حرارة أقل من 14°م. ارتد دائمًا حماية UV وفكر في استخدام حبل وصديري تأثير.
  problem: تصل إلى الشاطئ وليس لديك أي فكرة عما إذا كان ارتداء قميص واقٍ من الطفح الجلدي كافياً أم أنك بحاجة إلى بذلة غطس كاملة. درجة حرارة الهواء دافئة لكن الماء بارد، أو أن الماء يبدو جيداً لكن الرياح باردة جداً. ارتداء الملابس بشكل خاطئ يعني جلسة مخربة.
  explanation: 'ملابس ركوب الأمواج لها ثلاثة أغراض: العزل الحراري، وحماية UV، ومنع الاحتكاك. تصنف بدلات الغوص المصنوعة من النيوبرين حسب السماكة والتغطية — البدلات الربيعية (ذات الأكمام أو الأرجل القصيرة) للأيام المعتدلة، والبدلات الكاملة للمياه الباردة. تحمي السترات الواقية من الطفح الناتج عن اللوح والشمس لكنها لا توفر أي قيمة حرارية. الأحذية والقفازات والقبعات ليست إكسسوارات بل معدات أساسية لركوب الأمواج في المياه الباردة أقل من 12°C.'
  solution: 'تحقق من الطوف المحلي أو تقرير درجة حرارة الماء الحية قبل الخروج. قم بإعداد مجموعة استنادًا إلى أبرد حالة نموذجية بالنسبة لك: قميص واقٍ وسراويل قصيرة للصيف، بدلة كاملة بسماكة 3/2 مم للربيع والخريف، وبدلة بسماكة 5/4/3 مم مع أحذية وقفازات للرأس للشتاء. أضف دائمًا حبل ربط وفكر في سترة عائمة للسلامة.'
  recommendation: استثمر أولاً في بدلة كاملة جيدة بسماكة 3/2 مم — فهي تغطي أوسع نطاق من الظروف. أضف بدلة بسماكة 5/4/3 مم وأحذية إذا كنت تخطط للركوب على الأمواج خلال الشتاء. بدلة الغطس Aquafarer برو مع البطانة الحرارية تغطي كلا نطاقي درجات الحرارة بشكل فعال.
  faq:
    - q: هل يمكنني ركوب الأمواج وأنا أرتدي شورت فقط؟
      a: نعم، في المياه الاستوائية التي تزيد حرارتها عن 24 درجة مئوية. قد ترغب في ارتداء واقٍ من الاحتكاك لمنع تهيج الصدر والذراعين من التجديف. يساعد الشمع أو لوحة الجر على اللوح في تعويض نقص قبضة البدلة.
    - q: هل أحتاج إلى أحذية ركوب الأمواج؟
      a: إذا انخفضت درجة حرارة الماء عن 14 درجة مئوية، تمنع الأحذية التنميل وتحمي قدميك من الصخور والجروح الناتجة عن الشعاب. كما أنها تضيف قوة التماسك على اللوح. يستخدم معظم راكبي الأمواج في المناخات الشمالية الأحذية من نوفمبر حتى مارس.
    - q: ما هو بدلة الربيع؟
      a: بدلة الربيع هي بدلة غطس ذات أكمام قصيرة أو أرجل قصيرة (أو كلاهما) مصممة للمياه التي تتراوح درجة حرارتها بين 18°م و 22°م. توفر دفئًا أكثر من قميص الحماية من الاحتكاك لكنها تغطي أقل من البدلة الكاملة.
    - q: هل يجب أن أرتدي سترة نجاة أثناء ركوب الأمواج؟
      a: ليست سترات النجاة التقليدية، ولكن سترة الصدمات أو وسيلة الطفو يمكن أن تساعد في الظروف العاصفة أو إذا كنت سباحًا ضعيفًا. Aquafarer سترات النجاة مصممة لـ SUP والتجديف بالكاياك ولكن يمكن أن توفر ثقة إضافية في الطفو للمبتدئين في ركوب الأمواج.
