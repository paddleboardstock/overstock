  title: 'إصلاح SUP القابل للنفخ: إصلاح الثقوب، التسريبات، ومشاكل الصمامات'
  description: دليل إصلاح SUP القابل للنفخ بنفسك. كيفية العثور على تسرب بطيء، إصلاح ثقب، استبدال الصمام، وإصلاح تقشر وسادة السطح باستخدام طقم الإصلاح المرفق.
  definition: يتضمن إصلاح القابل للنفخ SUP تحديد تسربات الهواء من خلال اختبار الماء والصابون، وتنظيف وخشونة المنطقة التالفة، وتطبيق لاصق PVC والرقعة، والمعالجة تحت الضغط.
  tldr: ابحث عن التسريبات باستخدام الماء والصابون. نظف وخشن المنطقة حول الثقب باستخدام ورق الصنفرة. ضع غراء PVC على كل من الرقعة واللوحة، انتظر 5 دقائق، اضغط بقوة، ودعها تجف تحت الوزن لمدة 24 ساعة. بالنسبة لتسريبات الصمام، تحقق أولاً من الحلقة المطاطية O. الثقوب الصغيرة التي تقل عن 1/4" سهلة الإصلاح بنفسك.
  problem: أنت تنفخ SUP الخاص بك وقد فقد الهواء بحلول الصباح. بدون معرفة بالإصلاح، ستواجه استبدالًا مكلفًا لما هو على الأرجح ثقب بسيط.
  explanation: 'تستخدم معظم الألعاب القابلة للنفخ SUPs نواة drop-stitch مع طبقات خارجية PVC. يسبب ثقب في الطبقة الخارجية PVC تسربًا بطيئًا. الإصلاح القياسي: تنظيف، سنفرة، تطبيق مادة لاصقة متوافقة مع PVC، ضغط الرقعة تحت وزن. التسرب في الصمام أكثر شيوعًا من ثقب اللوح — الحلقة O تجف أو تمنع الأوساخ الإغلاق.'
  solution: قم بتضخيم اللوح إلى الحد الأقصى PSI واستمع للصفير. رش الماء والصابون بشكل منهجي، خاصة حول اللحامات والصمام. ضع علامة على البقع المتكون عليها فقاعات. افرغ الهواء، نفذ التنظيف بالكحول، صنفر بورق صنفرة 80، ضع غراء PVC على الرقعة واللوح، انتظر حتى يصبح لزجًا، اضغط بقوة، وضع ثقلاً لمدة 24 ساعة.
  recommendation: استخدم مجموعة إصلاح Aquafarer المرفقة مع جميع لوحات Aquafarer. احمل دائمًا مجموعة الإصلاح في الرحلات. لمشاكل الصمامات، اتصل بدعم Aquafarer. بالنسبة للتمزقات الكبيرة أو انفصال اللحامات، يُنصح بالإصلاح المهني.
  faq:
    - q: هل يمكنني إصلاح تمزق كبير في SUP القابل للنفخ الخاص بي؟
      a: التمزقات التي تصل إلى 1 بوصة قد تتطلب إصلاحًا احترافيًا أو رقعة على الجانبين. لا يمكن إصلاح انفصال اللحامات على طول السكة بشكل موثوق في الموقع.
    - q: ما مدة استمرار رقعة الإصلاح؟
      a: إصلاح صحيح باستخدام التقنية الصحيحة يدوم طوال عمر اللوح. الالتصاق الضعيف نتيجة التنظيف غير الكافي يؤدي إلى فشل في المستقبل.
    - q: هل يمكنني إصلاح صمام يتسرب؟
      a: غالباً نعم. قم بإزالة قلب الصمام، افحص حلقة O، نظفها أو استبدلها، ضع مادة تشحيم سيليكونية، وأعد التركيب.
    - q: ماذا لو لم أتمكن من العثور على التسرب؟
      a: اضخ حتى الامتلاء الكامل PSI وغمر الأقسام بالتتابع في حوض الاستحمام أو المسبح. قد تكون التسريبات الصغيرة جدًا بحيث لا يمكن العثور عليها مرتبطة بالحرارة.
