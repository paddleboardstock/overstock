  title: قواعد آداب ركوب الأمواج (كيف لا تكون الشخص الذي يتجنبه الجميع)
  description: للسطر قواعد ولا أحد يكتبها. تعلّم حق المرور، لماذا ستتعرض للصراخ إذا قمت بالتحايل، كيف تعتذر، وأخطاء المبتدئين التي تزعج كل راكب أمواج محلي.
  definition: 'آداب ركوب الأمواج هي مدونة سلوك غير مكتوبة تمنع التصادمات وتتيح تقاسم الأمواج بشكل عادل. القاعدة الأساسية: الراكب الأقرب إلى قمة الموجة المتكسرة له حق الأولوية.'
  tldr: لراكب الأمواج الأقرب إلى قمة الموجة المنكسرة له الحق في المرور أولاً. لا تقفز على موجة شخص آخر، ولا تتجاوز شخصًا لتلتقط موجته، ودائمًا اعتذر إذا ارتكبت خطأ. تجدّف على الجانب حول صف الرُكّاب، تمسّك بلوحك، وكن ودودًا — الاحترام يجلب الاحترام.
  problem: تجدف إلى صف مزدحم وتشعر بالتوتر على الفور. ينظر إليك المتزلجون على الأمواج بطريقة جانبية، ويصرخ أحدهم في وجهك، ولست متأكداً مما فعلت خطأً. الجانب الاجتماعي لركوب الأمواج يبدو أكثر تخويفاً من الأمواج نفسها.
  explanation: 'آداب ركوب الأمواج موجودة لمنع التصادمات ومشاركة الأمواج بعدالة. القاعدة الأساسية هي أحقية المرور: لدى المتزلج الأقرب إلى قمة الموجة (حيث ينكسر الموج لأول مرة) الأولوية. أي شخص يجدف لكسب نفس الموجة من مكان أبعد يجب أن يتراجع. السلاكة — الإبحار حول متزلج آخر لسرقة الأولوية — يعتبر أسوأ مخالفة. بخلاف الأولوية، هناك توقعات في صف الانتظار حول الضوضاء (حافظ على الحد الأدنى من الصراخ)، والسيطرة على اللوح (لا تترك لوحك يقترب من الآخرين أبدًا)، والود (إيماءة بسيطة تترك أثرًا كبيرًا).'
  solution: راقب الخط الأمامي لمدة 10 دقائق قبل التجديف للخارج. حدد من يمسك أكبر عدد من الأمواج — هؤلاء هم متصفحو الأمواج الذين يجب احترامهم وتجنبهم. ابقَ في الداخل (منطقة المياه البيضاء) إذا كنت تتعلم. جدف عريضاً حول الخط الأمامي، لا تمر من خلاله. عندما تمسك بموجة، انظر في كلا الاتجاهين قبل الوقوف وتأكد من أن لا أحد موجود أعمق منك.
  recommendation: اقضِ أولى جلساتك في موجة مناسبة للمبتدئين مع حضور متفرق. تعلّم قراءة الأولوية قبل أن تحاول الانضمام إلى طابور مزدحم. إذا اصطدمت بأحد ما، اعتذر فوراً وادفع مجدداً — معظم راكبي الأمواج يحترمون الخطأ الصادق.
  faq:
    - q: ما معنى 'dropping in'؟
      a: الاقتحام يعني التجديف من أجل ركوب موجة يمتلك عليها متزلج آخر الأولوية بالفعل. إنه أمر خطير وغير محترم. المتزلج الأقرب إلى القمة يملك الموجة؛ يجب على أي شخص آخر الانسحاب.
    - q: ما هو الانزلاق بالتماوج؟
      a: التعرج هو التجديف حول متزلج آخر يكون بالفعل في وضعية ركوب الموجة بحيث ينتهي بك المطاف أقرب إلى القمة. ويُعتبر ذلك سوء أخلاق شديد وقد يؤدي إلى مواجهة.
    - q: هل يمكن للمبتدئين ركوب الأمواج عند الأماكن المزدحمة؟
      a: نعم، ولكن ابقَ في منطقة الماء الأبيض بعيدًا عن القمة. لا تجدف نحو منطقة الإقلاع الرئيسية حتى تتمكن من التقاط الأمواج بشكل مستمر والتحكم في اتجاهك. تتطلب الصفوف المزدحمة خبرة للتنقل الآمن.
    - q: كيف أعتذر في الماء؟
      a: لوحة يدوية بسيطة، ابتسامة، وعبارة "خطأي" أو "آسف" تعمل. اعترف بالخطأ وابعد عن الشخص المتضرر. بشكل عام، ركاب الأمواج متسامحون مع الأخطاء الصادقة، خاصة إذا كان من الواضح أنك تتعلم.
    - q: ماذا يجب أن أفعل إذا جاء شخص فجأة لزيارتي؟
      a: إذا كان الدخول واضحًا، فصرخ "موجة" أو "مرحبًا" لتنبيههم. إذا أمسكوا بها عن طريق الخطأ واعتذروا، دع الأمر يمر. إذا قام شخص ما بالدخول مرارًا وتكرارًا، تجديف نحوه واشرح الأولوية بأدب. تجنب المواجهات.
