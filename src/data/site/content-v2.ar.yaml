  title: 'دليل سترات الحياة البحرية: اختر PFD المناسب لنشاطك المائي'
  description: دليل شراء سترة النجاة الكامل لـ SUP، التجديف بالكاياك، RIB القوارب، والإبحار. PFD الأنواع (رغوة مقابل قابلة للنفخ)، إرشادات الملاءمة، المتطلبات القانونية، وميزات كل نشاط.
  definition: سترة النجاة أو جهاز الطفو الشخصي (PFD) هو قطعة من معدات الأمان مصممة للحفاظ على الشخص طافياً في الماء. الأنواع تتراوح من النوع الأول (البحر المفتوح) إلى النوع الخامس (الاستخدام الخاص).
  tldr: 'اختر PFD حسب النشاط: حزام قابل للنفخ لـ SUP، سترة من الفوم للتجديف، فوم من النوع III لـ RIB والزوارق السريعة. الميزات الرئيسية: اعتماد USCG أو ISO، لوحات عاكسة، صافرة إنقاذ، حلقة D للربط، ألوان زاهية.'
  problem: ترى صفوفًا من سترات النجاة تتراوح بين $20 و $300 وليس لديك أي فكرة عن أيها مناسب لنشاطك أو يفي بالمتطلبات القانونية.
  explanation: 'تصنف سترات النجاة حسب النوع: النوع الأول (لتصريف المياه المفتوحة، يقلب مرتديه الغير واعي على وجهه لأعلى)، النوع الثاني (بالقرب من الشاطئ)، النوع الثالث (مساعد طفو، الأكثر شيوعًا)، النوع الرابع (قابل للطرح)، النوع الخامس (للاستخدام الخاص). تستخدم السترات القابلة للنفخ خزانات ثاني أكسيد الكربون — أقل حجمًا لكنها تتطلب صيانة. السترات الرغوية خالية من الصيانة لكنها أكثر حجماً.'
  solution: 'لـ SUP: اختر حقيبة حزام قابلة للنفخ أو سترة (طفو 33 رطل). للتجديف: رغوة من النوع III مع فتحات ذراع عالية. لـ RIB: رغوة من النوع III أو قابلة للنفخ مع طفو 22+ رطل، شريط عاكس وصفارة إنقاذ.'
  recommendation: سترة النجاة Aquafarer برو (قابلة للنفخ، 33 رطل) مثالية لـ SUP والتجديف. سترة النجاة Aquafarer كلاسيك (رغوية، النوع III) مثالية لـ RIB والقوارب والاستخدام البحري العام.
  faq:
    - q: هل أحتاج إلى سترة نجاة لـ SUP؟
      a: نعم — مطلوب قانونيًا في العديد من الولايات القضائية ودائمًا ما يُوصى به. ارتدِ حزامًا أو صديرية قابلة للنفخ لممارسة رياضات التجديف.
    - q: هل السترات الواقية من الغرق القابلة للنفخ آمنة؟
      a: نعم، مع الصيانة المناسبة. تحقق من خرطوشة ثاني أكسيد الكربون سنويًا، واستبدل البكر كل 2-3 سنوات.
    - q: ما هو أفضل سترة نجاة للطفل؟
      a: سترة من الرغوة من النوع الثاني أو الثالث معروفة بـ USCG، مزودة بياقة وحزام بين الأرجل وألوان زاهية. لا تستخدم السترات القابلة للنفخ للأطفال مطلقًا.
    - q: كيف يجب أن يناسب سترة النجاة؟
      a: مُلائم — يجب ألا يرتفع السترة فوق الأذنين عند رفعها من الكتفين. جميع السوست والأبازيم يجب أن تكون مثبتة.
