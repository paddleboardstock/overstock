  title: 'إصلاح بدلة الغوص: أصلح التمزقات، والخياطات، والسحابات بنفسك'
  description: دليل إصلاح بدلة الغوص بنفسك لتمزقات النيوبرين، انفصال الخياطة، انغلاق السوستة، وانقسام وسادات الركبة. تعليمات خطوة بخطوة باستخدام صمغ النيوبرين.
  definition: يتضمن إصلاح بدلة الغوص تنظيف المنطقة التالفة وخشونتها، وتطبيق الأسمنت النيوبريني، والمعالجة تحت الضغط لاستعادة السلامة ضد تسرب الماء والمرونة.
  tldr: 'تمزقات صغيرة أقل من 1: ضع لاصق النيوبرين على كلا الجانبين، وانتظر 10-15 دقيقة حتى يصبح لاصقًا، اضغط بقوة، واتركه يتماسك تحت وزن لمدة 12 ساعة. التمزقات الأكبر تحتاج رقعة من النيوبرين. مشاكل السحّاب: قم بتشحيمه أولاً، ثم تحقق من انسدادات القماش.'
  problem: بدلتك المبللة بها تمزق صغير، أو فاصل في الخياطة، أو سحاب يعلق. بدون تصليح بنفسك، ستدفع $150+ للحصول على بديل بينما تكلفة الإصلاح تبلغ $5.
  explanation: يعمل صمغ النيوبرين عن طريق تليين سطح النيوبرين، مما يخلق رابطة كيميائية عند تبخر المذيب. يجب تطبيق الصمغ على كلا السطحين ويجب أن يصبح لاصقاً قبل الدمج. بالنسبة للتمزقات، يجب محاذاة الحواف بدقة. غالباً ما تكون مشاكل السوستة بسبب تآكل الملح أو احتجاز القماش في الأسنان.
  solution: 'للتقطعات: نظف بالكحول، صنفر بلطف، ضع طبقة رقيقة من الأسمنت على الحافتين، انتظر حتى تصبح لزجة، اضغط معًا بشكل مثالي، ضع وزنًا، دعها تتماسك 12-24 ساعة. للبُقع: قص البقعة بحجم 1 بوصة أكبر من التمزق، ضع الأسمنت على كلاهما، ثبّت بمشبك. للسحاب: اشطف، ضع شمع السحاب، تعامل بلطف.'
  recommendation: احتفظ بمجموعة إصلاح بدلة الغوص Aquafarer في حقيبة معدّاتك. للإصلاحات الكبيرة أو تلف اللحامات في النقاط الحرجة، يُنصح بالإصلاح المهني.
  faq:
    - q: هل يمكنني استخدام الغراء الفائق على بدلة الغوص؟
      a: لا — الصمغ الفائق يجف صلباً وهشاً. استخدم فقط لاصق النيوبرين أو أكواسيل لإصلاح بدلات الغطس.
    - q: كم تستمر إصلاحات الأسمنت المصنوع من النيوبرين؟
      a: الإصلاح الذي يتم بشكل صحيح يكون في كثير من الأحيان أقوى من النيوبرين الأصلي ويستمر طوال العمر المتبقي للبدلة.
    - q: هل يمكنني إصلاح سحاب انفصل بالكامل؟
      a: إذا انفصل المسار عن النيوبرين، أعد لصقه باستخدام لاصق التلامس. إذا كانت الأسنان تالفة، استبدل السحّاب بشكل احترافي.
    - q: كيف أصلح بدلة غطس تتسرب عند الحياكة؟
      a: ضع خطًا رفيعًا من مادة أكواسيل على طول الجزء الداخلي من الفاصل المتسرب ودعها تجف لمدة 24 ساعة.
