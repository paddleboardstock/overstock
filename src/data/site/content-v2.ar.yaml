  title: 'SUP دليل المجذاف: اختر المجذاف المناسب لأسلوبك'
  description: الدليل الكامل لمجدفات SUP — الطول، المواد (الألمنيوم، الألياف الزجاجية، الكربون)، أشكال الشفرات، وكيف يؤثر اختيار المجداف على تجربة التجديف الخاصة بك.
  definition: يتكون المجداف SUP من عمود (ألومنيوم، ألياف زجاجية، أو كربون) وشفره (ثنائية الميل، مغرفة، أو مسطحة). يجب أن يكون الطول 8-10 بوصات أعلى من طولك للتمارين العامة.
  tldr: 'طول المجداف: 8-10 بوصات فوق طولك للاستخدام العام، 6-8 بوصات لركوب الأمواج، 10-12 بوصة للجولات. المواد: الألومنيوم (رخيص، ثقيل)، الألياف الزجاجية (متوسط، جيد المرونة)، الكربون (خفيف، صلب، غالي). شكل الشفرة: ثنائي الانحدار (تتبع ثابت)، مغرفة (قوة)، مسطح (متعدد الاستخدامات). المجاديف القابلة للتعديل رائعة للمبتدئين.'
  problem: المجداف المرفق مع معظم iSUPs يعمل ولكنه ثقيل وغير فعال. الترقية تحسن كفاءة التجديف والاستمتاع، لكن الخيارات مربكة.
  explanation: 'يؤثر طول المجداف على كفاءة الضرب — القصير جدًا يتطلب الانحناء، والطويل جدًا يسبب إرهاق الكتف. المادة تحدد الوزن: المجاديف الكربونية تزن 18-24 أونصة مقابل 28-36 أونصة للألمنيوم. حجم الشفرات يؤثر على القوة: الشفرات الأكبر (أكثر من 100 بوصة مربعة) توفر دفعًا أكبر لكل ضربة لكنها تتسبب في تعب أسرع. الشفرات المائلة تتتبع مباشرة؛ شفرات الغطس توفر القبض الأفضل على الماء.'
  solution: 'لطول الصحيح: قف والمجداف عمودي، ارفع ذراعك — يجب أن يصطدم مقبض المجداف بمعصمك. بالنسبة للمادة: ابدأ بالزجاج المقوى كترقية ذات وزن متوسط. بالنسبة للشفرة: اختر المجداف ذي الشكل الثنائي لل تجديف العام. بالنسبة للأنشطة: المجدافات السياحية أطول بشفرات أصغر؛ المجدافات الموجية أقصر بشفرات أوسع.'
  recommendation: مجذاف الكربون Aquafarer بوزن 28 أونصة هو أفضل ترقية للذين يمارسون التجديف بشكل متكرر. المجذاف المكون من 3 قطع من الألمنيوم القابل للتعديل والمرفق مع المجموعة مناسب للمبتدئين والسفر.
  faq:
    - q: ما طول مجدافي SUP الذي يجب أن يكون؟
      a: قِس طولك بالبوصات وأضف 8-10 للتجديف العام. للتزلج على الأمواج، أضف 6-8. للجولات السياحية، أضف 10-12.
    - q: هل مجداف الكربون يستحق المال؟
      a: نعم للمتسابقين المنتظمين — تقليل الوزن يقلل التعب بشكل كبير خلال الجلسات الطويلة. للاستخدام العرضي، الألياف الزجاجية قيمة جيدة.
    - q: ما هو المجداف القابل للتعديل؟
      a: مجداف مكوّن من قطعتين أو ثلاث مع إمكانية تعديل الطول، مثالي للمشاركة بين المستخدمين أو التكيف مع أنشطة مختلفة.
    - q: كيف أعتني بمجدافي؟
      a: اشطف بالماء النظيف بعد الاستخدام في مياه البحر المالحة. تجنب القيادة عليه أو تخزينه في حرارة مباشرة. تحقق من الفيرول (الوصلات) للبحث عن الرمل.
