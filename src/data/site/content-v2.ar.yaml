  title: 'SUP اللياقة البدنية: تمرين كامل للجسم على لوح التجديف'
  description: SUP يقدم تمرينًا كاملاً للجسم يجمع بين القدرة على التحمل القلبي الوعائي، واستقرار العضلات الأساسية، والقوة. كيفية هيكلة جلسات اللياقة البدنية SUP، أفضل التمارين، وقياس التقدم.
  definition: SUP اللياقة البدنية تستخدم منصة غير مستقرة من لوح التجديف لتفعيل عضلات التثبيت الأساسية، وعضلات الساقين، والجزء العلوي من الجسم من خلال التجديف، والموازنة، والتمارين على اللوح.
  tldr: SUP يحرق 400-700 سعرة حرارية في الساعة. جلسة SUP لمدة ساعة تشترك فيها عضلات البطن، والساقين، والظهر، والكتفين، والذراعين. قد يؤدي التجديف بالتناوب (سباقات قصيرة + التعافي) إلى تعزيز اللياقة القلبية القصوى. أوضاع اليوغا على اللوح تبني التوازن والمرونة. أضف حركات تقوية محددة لـ SUP مثل القرفصاء والاندفاعات على اللوح.
  problem: أصبح التمرين في الصالة الرياضية مملًا وتريد نشاطًا خارجيًا يبني اللياقة البدنية ويكون ممتعًا في الوقت نفسه. SUP يجمع بين المغامرة والتدريب الكامل لجسمك.
  explanation: التجديف يشرك عضلات الظهر العريضة، والعضلات الدالية، والعضلات شبه المنحرفة، وعضلات الجسم الأساسية للدوران. الوقوف على منصة متحركة يجبر عضلات التثبيت في الكاحلين والركبتين والوركين على العمل باستمرار. المتطلبات القلبية الوعائية للتجديف المستمر بشدة معتدلة توفر تهيئة هوائية.
  solution: 'هيكل الجلسات: 5 دقائق تجديف إحماء، 20 دقيقة تجديف ثابت بوتيرة معتدلة، 15 دقيقة تجديف متقطع (30 ثانية سباق، 60 ثانية بسهولة)، 10 دقائق تمارين على اللوح (قرفصاء، اندفاع، تمارين ضغط)، 5 دقائق تبريد وتمدد.'
  recommendation: استخدم Aquafarer SUP Explorer 11 للتجديف الرياضي. تتيح المنصة المستقرة لك التركيز على التقنية والشدة. ارتدِ سترة النجاة Pro لسلامتك خلال الجلسات عالية الشدة.
  faq:
    - q: كم عدد السعرات الحرارية التي يحرقها SUP؟
      a: ٤٠٠-٧٠٠ سعرة حرارية في الساعة حسب الشدة والرياح والتيار. زيادة التجديف المتقطع تزيد من حرق السعرات الحرارية.
    - q: هل SUP جيد لفقدان الوزن؟
      a: نعم، جنبًا إلى جنب مع التغذية المناسبة. إن مشاركة كل أنحاء الجسم وطبيعتها منخفضة التأثير تجعلها مستدامة لممارسة التمارين بانتظام.
    - q: هل يمكنني القيام بتدريب القوة على SUP؟
      a: نعم — القرفصاء، والاندفاع، وتمارين الضغط، وتمارين البلانك على اللوح تضيف تحديًا للتوازن إلى حركات القوة.
    - q: ما هي العضلات التي يعمل عليها SUP؟
      a: 'أساسي: عضلات الجذع (العضلات المائلة، العضلات البطنية العرضية)، الظهر (العضلات الظهرية، المتراجعة)، الأكتاف (العضلات الدالية)، الذراعين (العضلات ذات الرأسين، العضلات ثلاثية الرؤوس). ثانوي: الأرجل (العضلات الأمامية للفخذ، أوتار الركبة، الساقين).'
