business_model:
  tagline: Нашият бизнес модел
  heading: Излишък на запаси, продаван директно фабрично
  paragraphs:
    - Paddle Board Overstock Продава чисто нови надуваеми SUP дъски на излишни цени и цени при разпродажба — до 60% от типичната отстъпка на дребно. Набавяме излишък и излишък в големи количества, след което прехвърляме спестяванията на гребци и малки търговци.
    - 'Освен продажбите на дребно, обслужваме малки търговци на дребно с смесени модели на едро: поръчваме 5–20 платки, смесваме всички модели в една пратка и плащаме на едро за общото количество. Всяка поръчка се изпраща директно от Вейхай, Китай.'
sourcing:
  tagline: Откъде идва нашият излишък от запаси
  heading: Смесено снабдяване, един стандарт за качество
  paragraphs:
    - 'Нашият инвентар идва от два източника: излишни производствени партиди от нашите собствени производствени операции във Weihai и избрани излишни запаси, доставени от други производствени партньори, които одитваме и работим директно.'
    - Всяка дъска, която продаваме, е чисто нова и неизползвана. Излишък се отнася до цената — никога до състоянието.
manufacturing:
  tagline: Нашият производствен опит
  heading: Построено във Вейхай от 2012 г.
  paragraphs:
    - От 2012 г. произвеждаме надуваеми SUP дъски в Уейхай, Шандонг. Нашето производствено съоръжение от 12 000 m² произвежда 15 000 надуваеми единици годишно с екип от 200–300 работници и 14+ инженери по научноизследователска и развойна дейност.
    - 'Един принцип на дизайна не се е променил от първата платка: проектираме до точка на повреда, след което строим значително над нея.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock Фабрична сграда във Вейхай
  stats:
    - value: '2012'
      label: Производство след
    - value: 12 000 м²
      label: Производствено съоръжение
    - value: 15,000
      label: Единици на година
    - value: 14+
      label: Инженери по научноизследователска и развойна дейност
inspection:
  tagline: Как инспектираме всяка SUP дъска
  heading: Всяка дъска е тествана, не е семплирана
  paragraphs:
    - Всяка SUP платка е 100% тествана под налягане при 1.25 пъти по-високо от номиналното налягане за 24–48 часа, преди да бъде одобрена за продажба. Платките, които се провалят, никога не се изпращат.
    - 99,3% от платките преминават финална инспекция от първия път. Останалата част се ремонтира или отделя — никога не се отчита в поръчка.
why_prices_lower:
  tagline: Защо цените ни са по-ниски
  heading: Икономика на излишъка, не спестяване на ъглите
  paragraphs:
    - 'Цените ни са по-ниски по структурни причини: продаваме излишък и излишък директно от Weihai, без надценки на дребно, без дистрибуторски слоеве и без разходи за шоурум.'
    - Самите платки са с пълно производствено качество — същите drop-stitch ядра, същото PVCморско качество, същите тестове като при пълна цена на дребно.
shipping_network:
  tagline: Нашата международна корабна мрежа
  heading: Експресен въздушен или консолидиран морски товар
  paragraphs:
    - Поръчките се изпращат от Уейхай, Китай. Експресният въздушен товар превозва мостри и 1–3 бордови поръчки; консолидирани морски товари обслужват 5–20 поръчки на едро за 50+ държави.
    - Всяка оферта включва транзитна оценка за вашата дестинация, плюс търговска фактура и списък за опаковане, необходими за митнически одобрение.
  cards:
    - title: Експресен въздушен транспорт
      description: За мостри и поръчки от 1–3 платки — бърза доставка до вашата врата, цената се определя според дестинацията.
    - title: Обединен морски транспорт
      description: За едри поръчки от 5–20 платки — икономична доставка до основни пристанища, цената се определя според дестинацията.
warranty_support:
  tagline: Гаранция и обслужване на клиенти
  heading: 2-годишна SUP гаранция за всяка платка
  paragraphs:
    - Всяка платка се доставя с 2-годишна SUP гаранция. Ако се появи дефект, покрит от гаранцията, в рамките на гаранционния период, свържете се с нашия екип за поддръжка и ние ще го поправим.
    - Поддръжката се осъществява от същия екип, който управлява вашата поръчка. Свържете се с нас по всяко време чрез контактната форма или като отговорите на потвърждението на поръчката си.
