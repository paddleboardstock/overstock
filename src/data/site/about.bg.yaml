origin:
  tagline: Нашият произход
  heading: |-
    Построена върху водата,<br />
    <span class="text-sky-600">Воден от цел</span>
  paragraphs:
    - 'Paddle Board Overstock Започнах в крайбрежна работилница с една лодка и упорита вяра: морските продукти трябва да се проектират така, сякаш имат значение — защото наистина имат значение.'
    - Нашите основатели, двама корабни архитекти, виждаха индустрия, в която се правят компромиси, материалите се понижават, а безопасността се третира като отметка. Те построиха първия Paddle Board Overstock корпус не за печалба, а за да докажат, че достъпното морско оборудване може да бъде и наистина надеждно.
    - Първият корпус все още е в експлоатация днес. Този принцип никога не се е променил.
    - Ние не сме най-големият производител. Не произвеждаме най-евтините продукти. Но всеки корпус, който напуска нашата работилница, преминава през същите ръце, които са основали компанията — и отговаря на същия стандарт, който е поставен първият корпус.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock Крайбрежна работилница
philosophy:
  tagline: Нашата философия
  heading: Вкоренени в океана
  description: Океанът не е нашето работно място. Той е нашият учител. Всяко дизайнерско решение започва с разбирането как се държи водата, как се променят условията и как трябва да реагира оборудването.
  cards:
    - emoji: 🌊
      title: Уважавай водата
      description: Водата е непредсказуема. Нашите продукти са проектирани за най-лошите условия, а не за най-добрите. Ако корпусът може да понесе прилив, ще понесе и езеро. Ако спасителният жилетка работи в морето, той е прекалено проектиран за река — и това е умишлено.
    - emoji: 🔧
      title: Създадено да издържи, а не да замени
      description: Най-устойчивият продукт е този, който не се нуждае от подмяна. Морският клас PVCHypalon, , и drop-stitch конструкцията се избират заради дълготрайността. Все още изпращаме резервни части за корпуси, които построихме преди десетилетие.
    - emoji: 🏆
      title: Достъпно чрез дизайн
      description: Водните спортове не трябва да са лукс. Ние създаваме продукти, които осигуряват професионално качество на цена, която е разумна за семейства, водачи и малки оператори — не само за търговски автопаркове.
design:
  tagline: Философия на дизайна
  heading: |-
    Проектиран за ръба<br />
    <span class="text-sky-600">на условия</span>
  paragraphs:
    - Всеки Paddle Board Overstock продукт започва с един въпрос:<em>Кое е най-тежкото състояние, с което ще се сблъска?</em>Проектираме от ръба навътре, а не от центъра навън.
    - 'Нашите drop-stitch керни са оценени за 15 PSI — не защото 12 PSI не е достатъчно за езеро, а защото дъска 15 PSI се справя с внезапно рязане без да се огъва. Нашите Hypalon тръби са предназначени за UV търговска устойчивост — не защото всеки клиент гребе в тропиците, а защото UV деградацията е #1 причина за преждевременна повреда.'
    - Ние не проектираме според ценова точка. Проектираме до точка на провал — след това строим много над нея.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock Проектиране и инженеринг
  stats:
    - value: '15'
      label: PSI Ядро<br />Оценка
    - value: 1,500+
      label: UV Работно време<br />тествано
    - value: 10yr
      label: кора на кораба<br />продължителност на живота
