origin:
  tagline: 'A nossa origem'
  heading: "Construído sobre a água,<br />\n<span class=\"text-sky-600\">movido pelo propósito</span>"
  paragraphs:
    - 'A Aquafarer começou numa oficina costeira com um barco e uma convicção teimosa: os produtos marinhos devem ser projetados como se importassem — porque importam.'
    - 'Os nossos fundadores, dois arquitetos navais, viram uma indústria onde se cortavam custos, se degradavam materiais e a segurança era tratada como uma simples formalidade. Construíram o primeiro casco da Aquafarer não por lucro, mas para provar que equipamento marinho acessível também pode ser genuinamente fiável.'
    - 'Aquele primeiro casco ainda está em serviço hoje. Esse princípio nunca mudou.'
    - 'Não somos o maior fabricante. Não fazemos os produtos mais baratos. Mas cada casco que sai da nossa oficina passa pelas mesmas mãos que fundaram a empresa — e cumpre o mesmo padrão que o primeiro casco estabeleceu.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Oficina costeira da Aquafarer'

philosophy:
  tagline: 'A nossa filosofia'
  heading: 'Enraizados no oceano'
  description: 'O oceano não é o nosso local de trabalho. É o nosso professor. Cada decisão de design começa por compreender como a água se comporta, como as condições mudam e como o equipamento deve responder.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respeitar a água'
      description: 'A água é imprevisível. Os nossos produtos são projetados para as piores condições, não para as melhores. Se um casco aguenta uma corrente de retorno, aguenta um lago. Se um colete salva-vidas funciona offshore, está sobreprojetado para um rio — e isso é intencional.'
    - emoji: "\U0001F527"
      title: 'Construído para durar, não para substituir'
      description: 'O produto mais sustentável é aquele que não precisa de substituição. O PVC de grau marinho, o Hypalon e a construção drop-stitch são escolhidos pela longevidade. Ainda enviamos peças sobressalentes para cascos que construímos há uma década.'
    - emoji: "\U0001F3C6"
      title: 'Acessível por design'
      description: 'Os desportos aquáticos não deviam ser um luxo. Projetamos produtos que entregam desempenho de nível profissional a um preço que faz sentido para famílias, guias e pequenos operadores — não apenas para frotas comerciais.'

design:
  tagline: 'Filosofia de design'
  heading: "Projetado para o limite<br />\n<span class=\"text-sky-600\">das condições</span>"
  paragraphs:
    - 'Cada produto Aquafarer começa com uma pergunta: <em>qual é a pior condição que vai enfrentar?</em> Projetamos do limite para dentro, não do centro para fora.'
    - 'Os nossos núcleos drop-stitch são classificados para 15 PSI — não porque 12 PSI seja insuficiente para um lago, mas porque uma prancha de 15 PSI enfrenta um chop repentino sem flexionar. Os nossos tubos Hypalon são especificados para resistência UV de grau comercial — não porque todos os clientes remem nos trópicos, mas porque a degradação UV é a causa n.º 1 de falhas prematuras.'
    - 'Não projetamos para um preço. Projetamos para um ponto de falha — e depois construímos bem acima dele.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Design e engenharia da Aquafarer'
  stats:
    - value: '15'
      label: 'classificação<br />PSI do núcleo'
    - value: '1,500+'
      label: 'horas de teste<br />UV'
    - value: '10 anos'
      label: 'tempo de vida<br />do casco'
