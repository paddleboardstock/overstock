business_model:
  tagline: Nosso Modelo de Negócios
  heading: Estoque excedente, vendido direto da fábrica
  paragraphs:
    - Paddle Board Overstock vende pranchas infláveis SUP novinhas a preços de estoque excedente e liquidação — até 60% de desconto sobre o varejo típico. Nós adquirimos estoques excedentes e sobressalentes em volume e repassamos a economia para remadores e pequenos varejistas.
    - 'Além das vendas no varejo, atendemos pequenos varejistas com atacado de modelo misto: peça de 5 a 20 pranchas, misture qualquer modelo em um único envio e pague a faixa de atacado pela quantidade total. Cada pedido é enviado diretamente de Weihai, China.'
sourcing:
  tagline: De Onde Vem Nosso Estoque Excedente
  heading: Fontes mistas, um padrão de qualidade
  paragraphs:
    - 'Nosso estoque vem de duas fontes: lotes de produção excedentes de nossas próprias operações de fabricação em Weihai e inventário excedente selecionado de outros parceiros de produção que auditamos e com os quais trabalhamos diretamente.'
    - Cada prancha que vendemos é nova e nunca usada. Excedente se refere ao preço — nunca à condição.
manufacturing:
  tagline: Nosso Histórico de Fabricação
  heading: Construído em Weihai desde 2012
  paragraphs:
    - Fabricamos pranchas infláveis SUP em Weihai, Shandong, desde 2012. Nossa instalação de produção de 12.000 m² produz 15.000 unidades infláveis por ano com uma equipe de 200–300 trabalhadores e 14+ engenheiros de P&D.
    - 'Um princípio de design não mudou desde a primeira prancha: projetamos até um ponto de falha e, então, construímos bem acima dele.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock prédio da fábrica em Weihai
  stats:
    - value: '2012'
      label: Fabricação desde
    - value: 12.000 m²
      label: Instalação de produção
    - value: 15,000
      label: Unidades por ano
    - value: 14+
      label: Engenheiros de P&D
inspection:
  tagline: Como Inspecionamos Cada Prancha SUP
  heading: Cada prancha testada, não amostrada
  paragraphs:
    - Cada prancha SUP passa por teste de pressão 100% a 1,25x a pressão nominal por 24–48 horas antes de ser aprovada para venda. Pranchas que falham nunca são enviadas.
    - 99,3% das pranchas passam na inspeção final na primeira vez. A fração restante é reparada ou separada — nunca descontada em um pedido.
why_prices_lower:
  tagline: Por Que Nossos Preços São Menores
  heading: Economia de excedente, não economia em qualidade
  paragraphs:
    - 'Nossos preços são mais baixos por razões estruturais: vendemos estoques excedentes e sobressalentes diretamente de Weihai, sem markup de varejo, sem camadas de distribuidores e sem custos de showroom.'
    - As próprias pranchas são de qualidade de produção completa — mesmos núcleos drop-stitch, mesmo material marítimo PVC, mesmos testes de varejo a preço cheio.
shipping_network:
  tagline: Nossa Rede Internacional de Envio
  heading: Frete expresso aéreo ou marítimo consolidado
  paragraphs:
    - Os pedidos são enviados de Weihai, China. O frete aéreo expresso transporta amostras e pedidos de 1 a 3 pranchas; o frete marítimo consolidado atende pedidos de atacado de 5 a 20 pranchas para 50+ países.
    - Cada cotação inclui uma estimativa de trânsito para seu destino, além da fatura comercial e da lista de embalagem necessárias para o desembaraço aduaneiro.
  cards:
    - title: Frete Aéreo Expresso
      description: Para amostras e pedidos de 1 a 3 placas — entrega rápida na sua porta, cotação por destino.
    - title: Frete Marítimo Consolidado
      description: Para pedidos de atacado de 5 a 20 placas — envio econômico para portos principais, cotação por destino.
warranty_support:
  tagline: Garantia e Suporte ao Cliente
  heading: Uma Garantia de 2 Anos SUP em cada placa
  paragraphs:
    - Cada placa é enviada com a Garantia de 2 Anos SUP. Se um defeito coberto aparecer durante o período de garantia, entre em contato com nossa equipe de suporte e nós resolveremos.
    - O suporte é realizado pela mesma equipe que gerencia seu pedido. Fale conosco a qualquer momento através do formulário de contato ou respondendo à confirmação do seu pedido.
