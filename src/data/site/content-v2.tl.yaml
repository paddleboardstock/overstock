- slug: understanding-tides
  category: guide
  type: technical
  title: 'Pag-unawa sa Tides para sa Water Sports: Isang Praktikal na Gabay'
  description: Paano naaapektuhan ng mga alon SUPang kondisyon ng surfing, at kayaking. Pagbabasa ng mga tide chart, pag-unawa sa spring vs neap tides, at pagpaplano ng iyong sesyon batay sa galaw ng tidal para sa kaligtasan.
  definition: Ang mga alon ay ang araw-araw na pagtaas at pagbaba ng antas ng dagat na dulot ng grabidad ng buwan at araw. Nagkakaiba-iba ang saklaw ng pagtaas ng tubig depende sa lokasyon at siklo ng buwan.
  tldr: 'Dalawang high tide at dalawang low tide araw-araw sa karamihan ng mga lugar. Ang spring tides (full/new moon) ay may mas malalaking saklaw at mas malalakas na agos. Ang neap tides (quarter moon) ay may mas maliit na saklaw. Nakakaapekto ang tide sa lalim ng tubig, hugis ng alon, at lakas ng agos. Para saSUP: mag-paddle muna laban sa agos para makatulong sa pagbabalik.'
  problem: Pagdating mo sa lokal na bakasyon, halos walang alon, delikadong alon mula sa palabas na alon, o mababaw na tubig. Kung hindi mo naiintindihan ang mga alon, nasasayang ang biyahe o nag-paddle ka sa mapanganib na kondisyon.
  explanation: Ang mga alon ay sanhi ng grabidad ng buwan. Ang mga pagtaas ng tubig sa tagsibol (buong buwan at bagong buwan) ay nagdudulot ng pinakamataas at pinakamababang temperatura. Ang mga Neap tides (quarter moon) ay nagdudulot ng minimal na saklaw. Ang mga agos ng tubig ay pinakamabilis sa gitna ng tubig, mahina sa mataas at mababa. Ang saklaw ng pagtaas ng tubig ay nag-iiba mula 0.3m (Mediterranean) hanggang 16m (Bay of Fundy).
  solution: 'Suriin ang tide chart bago ang bawat session. Para sa surfing: ang beach breaks ay kadalasang pinakamainam sa 2-3 oras sa magkabilang gilid ng high tide. Para saSUP: mag-paddle laban sa agos sa unang bahagi para makatulong ang agos na bumalik. Para sa pangingisda: ang pagpasok ng tubig ay nagtutulak ng isda sa patag na lugar.'
  recommendation: Gamitin ang NOAA tide predictions o lokal na tide app. Alamin ang tide preference ng iyong lokal na break sa pamamagitan ng pag-log ng mga kondisyon sa loob ng isang buwan.
  faq:
    - q: Ano ang spring tide?
      a: Ang mga spring tide ay nangyayari tuwing full at new moon, na nagdudulot ng mas mataas na high tide at mas malalakas na agos. Nangyayari ito dalawang beses sa isang buwan.
    - q: Ano ang neap tide?
      a: Ang neap tides ay nangyayari sa quarter moons. Mas maliit ang saklaw ng tidal, at mahina ang agos — maganda para sa mga baguhan.
    - q: Delikado ba ang low tides para saSUP?
      a: Ang mababang tubig ay maaaring maglantad ng mga bato at mga bahura. Pinipunin din nito ang enerhiya ng alon sa mas matarik na mga buhangin.
    - q: Paano naaapektuhan ng mga alon ang rip currents?
      a: Ang mga palabas na alon (ebb) ay nagpapalakas ng rip currents. Ang mga papasok na alon (baha) ay nagpapababa ng lakas ng rip.
