- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Anchor Guide: Manatili sa lugar habang nangingisda o kumukuha ng litrato'
  description: Kumpletong gabay sa SUP pag-angkla — uri ng angkla (kabute, pagtiklop, stake), setup ng anchor trolley, mga teknik sa pag-deploy, at mga konsiderasyon sa kaligtasan para manatili sa posisyon.
  definition: Ang SUP angkla ay isang pabigat na nakakabit sa lubid na humahawak sa tabla laban sa hangin at agos. Karaniwang uri ay ang mushroom anchors, folding anchors, at stake-out poles.
  tldr: Gumamit ng mushroom anchor (1.5-3 lb) para sa maputik o mabuhanging ilalim, folding anchor para sa mabatong ilalim, o stake-out pole para sa mababaw na tubig na may malambot na ilalim. Ang anchor ay dapat 1.5-3 lb para sa kalmadong kondisyon, 3-5 lb para sa hangin at kuryente. Laging gumamit ng anchor trolley para ayusin ang posisyon at malaman kung kailan dapat bitawan.
  problem: Makakahanap ka ng perpektong lugar para mangisda ngunit ang hangin at agos ay nagpapalihis sa iyo ng posisyon bawat ilang minuto. Kung walang angkla, SUP ang pangingisda at potograpiya ay nakakainis na ehersisyo sa patuloy na pag-reposition.
  explanation: Ang angkla ay gumagana sa pamamagitan ng paghila sa ilalim hanggang sa mahuli ito. Ang mga mushroom anchor ay nakabaon sa malambot na ilalim at nagbibigay ng magandang kapit sa buhangin at putik. Ang mga folding anchor ay may mga fluke na humuhukay sa matigas o mabatong ilalim. Ang mga stake-out pole ay gumagana sa mababaw na tubig sa pamamagitan ng pagtulak nang direkta sa ilalim.
  solution: Mag-install ng anchor trolley system (isang linya na may sliding ring sa isang gilid ng board) upang ayusin ang punto ng pagkakabit ng anchor. Ikabit ang 50-75' na lubid sa anchor. I-deploy pataas ng hangin o up-current ng nais mong posisyon. Gumamit ng quick-release system para tanggalin sa mga emergency. Huwag kailanman mag-angkla sa malakas na kuryente o kung saan hindi mo madaling makuha ang anchor.
  recommendation: Ang 3 lb folding anchor na may 50' na lubid ay epektibo para sa karamihan ng SUP kondisyon ng pangingisda. Magdagdag ng anchor trolley system gamit ang D-rings sa iyong Paddle Board Overstock SUP Explorer 11.
  faq:
    - q: Anong laki ng anchor ang kailangan koSUP?
      a: 1.5-3 lb para sa mga kalmadong lawa at mabagal na ilog. 3-5 lb para sa mga baybaying lugar na may hangin o agos. Mahirap kunin ang mga sobrang laki ng angkla.
    - q: Gaano karaming anchor line ang kailangan ko?
      a: Ang 5:1 scope (5 talampakan ng linya para sa bawat 1 talampakan ng lalim) ay karaniwan. Sa 10' na tubig, gumamit ng 50' na linya.
    - q: Delikado ba ang pag-angkla sa SUPisang ?
      a: Kung mag-aangkla ka sa kuryente o hangin na sapat ang lakas para matumba ang board. Laging gumamit ng quick-release system na maaaring tanggalin agad.
    - q: Pwede ba akong mag-angkla sa kahit anong tubig?
      a: Suriin ang lokal na regulasyon. May ilang lugar na nililimitahan ang pag-angkla upang maprotektahan ang seagrass o mga tirahan sa dagat. Huwag kailanman mag-angkla sa mga coral reef.
