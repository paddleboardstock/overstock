- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Pag-aayos ng Inflatable SUP : Ayusin ang mga butas, tagas, at problema sa balbula'
  description: Gabay sa DIY para SUP sa pag-aayos ng inflatable. Paano hanapin ang mabagal na tagas, ayusin ang butas, palitan ang balbula, at ayusin ang delamination ng deck pad gamit ang kasamang repair kit.
  definition: Ang SUP inflatable repair ay kinabibilangan ng pagtukoy ng mga tagas ng hangin sa pamamagitan ng pagsusuri gamit ang sabon na tubig, paglilinis at pag-rough ng nasirang bahagi, paglalagay PVC ng pandikit at patch, at pagpapatuyo sa ilalim ng presyon.
  tldr: Hanapin ang mga tagas gamit ang sabon na tubig. Linisin at gasgasan ang paligid ng butas gamit ang liha ng papel. Maglagay PVC ng pandikit sa patch at board, maghintay ng 5 minuto, pindutin nang mahigpit, at i-cure nang hindi mabigat ng 24 na oras. Para sa tagas ng balbula, suriin muna ang O-ring. Ang maliliit na butas sa ilalim ng 1/4" ay madaling ayusin ng DIY.
  problem: Kapag pinalobo mo ito SUP , bumababa na ang pressure pagdating ng umaga. Kung walang kaalaman sa pagkukumpuni, haharap ka sa magastos na kapalit ng simpleng butas lang.
  explanation: 'Karamihan sa mga inflatable SUPs ay gumagamit ng drop-stitch core na may PVC panlabas na mga layer. Ang butas sa labas ay PVC nagdudulot ng mabagal na tagas. Standard na pagkukumpuni: linisin, lihahan, paglalagay PVCng -compatible adhesive, pindutin ang patch sa ilalim ng bigat. Mas karaniwan ang tagas ng balbula kaysa sa mga butas sa panel — natutuyo ang O-ring o pumipigil ang debris sa pagselyo.'
  solution: Palakihin ang board sa pinakamataas na antas PSI at pakinggan ang hissing. Mag-spray ng sabon na tubig nang sistematiko, lalo na sa paligid ng tahi at balbula. Markahan ang mga bumubula na bahagi. I-deflate, linisin gamit ang alkohol, liha gamit ang 80-grit, lagyan PVC ng pandikit ang patch at board, hintayin hanggang malagkit, pindutin nang mahigpit, bigat ng 24 na oras.
  recommendation: Gamitin ang Paddle Board Overstock repair kit na kasama sa lahat ng Paddle Board Overstock board. Laging dalhin ang repair kit kapag naglalakbay. Para sa mga isyu sa balbula, makipag-ugnayan sa Paddle Board Overstock support. Para sa malalaking punit o seam separations, inirerekomenda ang propesyonal na pagkukumpuni.
  faq:
    - q: Pwede ko bang ayusin ang malaking punit sa inflatable koSUP?
      a: Ang mga punit na higit sa 1 pulgada ay maaaring mangailangan ng propesyonal na pagkukumpuni o patch sa magkabilang panig. Ang mga seam separation sa kahabaan ng riles ay hindi maaasahang maaasahan sa field-repair.
    - q: Gaano katagal tumatagal ang isang repair patch?
      a: Ang tamang pagkukumpuni gamit ang tamang teknik ay tumatagal habang buhay ng board. Ang mahinang pagdikit dahil sa hindi sapat na paglilinis ay nagdudulot ng pagkasira sa hinaharap.
    - q: Pwede ko bang ayusin ang tumutulo na balbula?
      a: Madalas oo. Tanggalin ang valve core, inspeksyunin ang O-ring, linisin o palitan ito, lagyan ng silicone lubricant, at i-install muli.
    - q: Paano kung hindi ko makita ang tagas?
      a: I-inflate hanggang buo PSI at ilubog ang mga bahagi nang sunud-sunod sa bathtub o pool. Ang mga tagas na masyadong maliit para makita ay maaaring may kinalaman sa temperatura.
