  solution: Itago ang ZB-MT350 sa iyong board bag o boat storage compartment. Ang compact na disenyo (4 pulgada na sarado) ay kasya sa kahit anong bulsa. Ang kasamang nylon sheath ay nananatiling madaling ma-access.
