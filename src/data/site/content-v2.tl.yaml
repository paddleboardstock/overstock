- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Gabay sa Sukat: Ipinaliwanag ang Haba, Lapad, at Dami'
  description: Hanapin ang tamang SUP sukat base sa iyong timbang, antas ng kasanayan, at istilo ng pagpaddle. Ang haba ang nagtatakda ng tracking, ang lapad ang tumutukoy sa katatagan, at ang dami ay nagtatakda ng kapasidad ng timbang.
  definition: SUP Ang laki ay tinutukoy ng haba (bilis at glide), lapad (pangunahing katatagan), kapal (pangalawang katatagan at volume), at volume sa litro (kabuuang kapasidad ng timbang).
  tldr: 'All-around: SUPs10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Surf: 8''-10'' x 30"-32" (140-220L). Ang mga baguhan ay nangangailangan ng lapad na higit sa 32" at volume na lampas sa body weight ng 60-80L. Ang iyong timbang sa kg plus 60L ang minimum na target na volume para sa katatagan.'
  problem: Bawat SUP brand ay naglilista ng mga board sa feet, inches, at liters, pero kung hindi mo alam kung paano naaapektuhan ang mga sukat na ito sa totoong pakiramdam, nanganganib kang bumili ng board na mabagal ang ulo, mabagal, o hindi kayang suportahan ang iyong timbang.
  explanation: 'Ang haba ang nagtatakda kung gaano kabilis mag-paddle ang board at kung gaano ito kaganda sa tuwid na linya. Ang mas mahahabang board (12''+) ay dumudulas sa pagitan ng mga stroke at humahawak ng linya. Ang mas maiikling board (mas mababa sa 10'') ay madaling umikot ngunit nangangailangan ng mas madalas na pagpapalit ng paddle. Ang lapad ang nagtatakda ng pangunahing katatagan — ang standing stability. Ang 30" board ay parang tippy para sa mga baguhan; ang 34" ay parang pantalan. Ang kapal ang nagtatakda ng volume — ang mas makapal na board ay lumulutang nang mas mataas ngunit mas malakas ang hangin. Ang volume sa litro ang pinakamainam na sukatan: ang loaded board (ikaw kasama ang gear) ay dapat lumubog ng 2-4 pulgada kapag nakahinga.'
  solution: 'I-match ang sukat ng board sa tatlong salik: timbang (tumutukoy sa minimum volume), pangunahing aktibidad (tumutukoy sa haba), at antas ng kasanayan (tumutukoy sa lapad). Para sa mga baguhan, imultiply ang timbang sa kg ng 2.2 para makuha ang minimum na litro. Para sa intermediates, imultiply ng 1.8. Para sa advanced, imultiply ng 1.4.'
  recommendation: Ang Paddle Board Overstock SUP Explorer 11 na may sukat na 11' x 33" x 6" na may 260L ay angkop sa karamihan ng mga rider na umaabot hanggang 100 kg para sa all-around paddling. I-upgrade sa SUP Tour 12 na may sukat na 12' x 31" para sa mas mabilis na touring speed at glide.
  faq:
    - q: Anong SUP sukat ang kailangan ko para sa aking timbang?
      a: 'Para sa mga rider na mas mababa sa 70 kg: 10-11'' x 32" (220-260L). Para sa 70-90 kg: 11-12'' x 33" (260-300L). Para sa 90-110 kg: 11-12'' x 34" (300-350L). Para sa higit sa 110 kg: 12'' x 34-36" (350L+).'
    - q: Mas mabilis ba ang mas mahaba SUP ?
      a: Oo. Ang mas mahahabang board ay may mas magandang ratio ng haba sa lapad kaya nababawasan ang drag. Ang 14' touring SUP ay mas mabilis nang malaki kaysa sa 11' all-around board sa parehong paddling effort.
    - q: Anong SUP lapad ang matatag para sa mga baguhan?
      a: Ang 33-34" ang tamang balanse para sa mga baguhan hanggang 90 kg. Ang mas mababa sa 32" ay nangangailangan ng magandang balanse. Ang lampas 34" ay napaka-stable pero mas mabagal at mahirap mag-paddle kapag may hangin.
    - q: Pwede ba akong gumamit ng all-around board para sa touring?
      a: Oo, para sa maiikling tour na mas mababa sa 10 km. Para sa mas mahahabang distansya, mas maganda ang ruta at mas epektibo ang pagtawid ng touring board.
