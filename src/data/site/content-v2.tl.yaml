- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'SUP Gabay sa Paddle: Pumili ng Tamang Paddle para sa Iyong Estilo'
  description: Kumpletong gabay sa SUP mga paddle — haba, materyales (aluminum, fiberglass, carbon), hugis ng talim, at kung paano nakakaapekto ang pagpili ng paddle sa iyong karanasan sa pagpaddle.
  definition: Ang SUP paddle ay binubuo ng shaft (aluminum, fiberglass, o carbon) at isang talim (dihedral, scoop, o flat). Ang haba ay dapat 8-10" mas mataas sa taas mo para sa pangkalahatang pagpaddle.
  tldr: 'Haba ng paddle: 8-10" sa taas mo para sa all-around na gamit, 6-8" para sa surfing, 10-12" para sa touring. Mga materyales: aluminum (mura, mabigat), fiberglass (mid-range, magandang flex), carbon (magaan, matigas, mahal). Hugis ng blade: dihedral (stable tracking), scoop (power), flat (versatile). Ang adjustable paddles ay maganda para sa mga baguhan.'
  problem: Ang kasamang paddle sa karamihan ng iSUP ay gumagana pero mabigat at hindi epektibo. Ang pag-upgrade ay nagpapabuti ng efficiency at kasiyahan sa paddling, pero nakakalito ang mga opsyon.
  explanation: 'Ang haba ng paddle ay nakakaapekto sa efficiency ng stroke — kapag masyadong maikli, kailangang yumuko, kapag masyadong mahaba ay nagdudulot ng pagkapagod sa balikat. Ang materyal ang nagtatakda ng bigat: ang carbon paddles ay 18-24 oz kumpara sa 28-36 oz para sa aluminum. Ang laki ng talim ay nakakaapekto sa lakas: ang mas malalaking talim (100+ sq in) ay nagbibigay ng mas mataas na propulsion kada stroke ngunit mas mabilis magdulot ng pagkapagod. Dihedral blades ay tuwid ang track; ang scoop blades ay nagbibigay ng mas maraming catch.'
  solution: 'Para sa tamang haba: tumayo na may paddle nang patayo, itaas ang braso — dapat tumama ang hawakan ng paddle sa iyong pulso. Para sa materyal: magsimula sa fiberglass bilang mid-weight upgrade. Para sa blade: piliin ang dihedral para sa pangkalahatang paddling. Para sa mga aktibidad: mas mahaba ang touring paddles na may mas maliit na blades; mas maikli ang surf paddles na may mas malapad na blades.'
  recommendation: Ang Paddle Board Overstock carbon paddle na may bigat na 28 oz ang pinakamahusay na upgrade para sa mga madalas magpaddle. Ang kasamang adjustable na 3-pirasong aluminum paddle ay sapat para sa mga baguhan at paglalakbay.
  faq:
    - q: Gaano katagal dapat ang paddle ko SUP ?
      a: Sukatin ang taas sa inches at idagdag ang 8-10 para sa all-around paddling. Para sa surfing, magdagdag ng 6-8. Para sa touring, magdagdag ng 10-12.
    - q: Sulit ba ang carbon paddle sa halaga?
      a: Oo para sa mga regular na paddler — ang pagbawas ng timbang ay malaki ang nababawasan ng pagkapagod sa mahabang session. Para sa paminsang paggamit, sulit ang fiberglass.
    - q: Ano ang adjustable paddle?
      a: Isang 2 o 3-pirasong paddle na may adjustment ng haba, perpekto para sa pagbabahagi ng mga gumagamit o pag-aayos para sa iba't ibang aktibidad.
    - q: Paano ko aalagaan ang aking paddle?
      a: Banlawan gamit ang sariwang tubig pagkatapos gumamit ng maalat na tubig. Iwasan ang pag-ikot sa ibabaw nito o itago sa direktang init. Suriin ang ferrule (joint) para sa buhangin.
