- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hydration at Proteksyon sa Araw: Manatiling Ligtas sa Tubig'
  description: Mahalagang mga estratehiya sa hydration at proteksyon sa araw para sa mga SUP paddler. Ang dehydration at sunburn ang mga pinakakaraniwang SUP problema — paano ito maiiwasan sa mahabang sesyon.
  definition: Ang SUP hydration ay nangangahulugang pagpapanatili ng balanse ng likido habang naglalayag sa pamamagitan ng regular na pag-inom ng tubig. Ang proteksyon laban sa araw ay kinabibilangan ng paglalagay ng SPF, proteksiyon na damit, at mga sesyon ng timing upang maiwasan ang peakUV.
  tldr: Uminom ng 500ml ng tubig kada oras ng pagpaddle. Magdala ng higit pa sa inaasahan mong kailangan — isang 2L bladder o maraming bote. Maglagay ng water-resistant SPF 50+ sunscreen bago mag-paddle at mag-reapply tuwing 2 oras. Magsuot ng sumbrero, salaming pang-araw na may strap, at mga damit na UPF-rated. Iwasan ang pag-paddle mula 11 AM hanggang 3 PM UV kapag pinakamalakas.
  problem: Maganda ang session mo SUP , pero pagkatapos ng isang oras, sumasakit ang ulo mo, tuyot ang bibig, at nasusunog ang balat mo. Dahan-dahang dumarating ang dehydration at sunburn dahil pinapanatili kang malamig ng tubig.
  explanation: Ang pag-reflect mula sa tubig ay nagpapalakas ng UV exposure ng hanggang 40%. Ang malamig na epekto ng tubig at simoy ng hangin ay nagtatakip sa sunburn hanggang huli na. Ang pawis mula sa paglalayag ay nagpapataas ng pagkawala ng likido, at madalas ay walang lugar para mapuno muli ang tubig sa tubig. Ang dehydration ay nakakasira sa balanse at paggawa ng desisyon, na nagpapataas ng panganib ng aksidente.
  solution: Ikabit ang bote ng tubig o hydration bladder sa bungee system ng board. Uminom tuwing 15 minuto kahit uhaw ka o hindi. Maglagay ng SPF 50+ sunscreen 30 minuto bago ilunsad. Magsuot ng malapad na sombrero, polarized na salaming pang-araw na may strap, at UPF 50+ rash guard. Muling maglagay ng sunscreen bawat 2 oras.
  recommendation: Gumamit ng hydration bladder na nakakabit sa harapang D-rings ng iyong Paddle Board Overstock SUP. Magsuot ng UPF 50+ rash guard sa ilalim ng iyong PFD. Gumamit ng waterproof sunscreen na nananatili sa pawis at tubig.
  faq:
    - q: Gaano karaming tubig ang dapat kong dalhin sa SUP isang biyahe?
      a: Hindi bababa sa 1 litro kada oras. Para sa 2-oras na session, magdala ng 2 litro. Mas marami kapag mainit ang panahon. Mas epektibo ang hydration bladder.
    - q: Anong uri ng sunscreen ang pinakamainam para ditoSUP?
      a: Water-resistant, SPF 50+ broad-spectrum. Ang mga mineral sunscreen (zinc oxide, titanium dioxide) ay ligtas sa reef at mas tumatagal.
    - q: Talaga bang sumasalamin ang tubigUV?
      a: Oo — ang tubig ay nagre-reflect ng hanggang 40% ng UV radiation, ibig sabihin ay mula UV sa itaas at ibaba. Malaki ang itinataas nito sa panganib ng paso.
    - q: Pwede ba akong masunog gamit ang rash guard?
      a: Ang karaniwang rash guard ay nagbibigay ng minimal na UV proteksyon (mga UPF 10-20). Maghanap ng+ UPF 50 rated na damit para sa buong proteksyon.
