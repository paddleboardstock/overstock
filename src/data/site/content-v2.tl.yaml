- slug: surfboard-size-guide
  category: guide
  type: buying-guide
  title: Gabay sa Sukat ng Surfboard (Dami ang Talagang Mahalaga)
  description: Itigil mo na ang paghula sa laki ng surfboard. Ang dami sa litro ang nagtatakda ng lahat — kung gaano kadaling makahuli ng alon, kung gaano ka katatag, at gaano kabilis ang iyong progreso. Hanapin ang target mong litro sa loob ng 2 minuto.
  definition: Ang sukat ng surfboard ay pangunahing nakatuon sa dami (litro), hindi sa haba. Ang dami ang nagtatakda ng kakayahan sa paglutang at paghuli ng alon. Mas mabilis mag-paddle ang mas mahahabang board; mas matatag ang mas malapad na board; ang mas makakapal na board ay nagbibigay ng mas maraming volume nang walang dagdag na haba.
  tldr: 'Ang sukat ng surfboard ay tungkol sa volume, hindi lang sa haba. Ang mga baguhan ay nangangailangan ng 60-80 litro, intermediate 35-55 litro, at advanced surfers 20-35 litro. Gamitin ang iyong timbang bilang pangunahing salik: bawat 10 kg ay nangangailangan ng humigit-kumulang 10-12 litro ng volume sa beginner level.'
  problem: Kapag nakatayo ka sa harap ng rack ng surfboards na may mga numerong 7'2" x 22" x 3" sa rail, wala kang ideya kung ano ang pakiramdam ng mga sukat na iyon sa tubig. Ang pagbili base sa itsura o kung ano ang sinasakyan ng kaibigan ay nagreresulta sa board na masyadong hindi matatag o masyadong mahirap sagwan.
  explanation: 'Ang laki ng surfboard ay pinakamainam na nauunawaan sa tatlong dimensyon: haba (lakas ng paddle at paghuli ng alon), lapad (katatagan), at kapal (volume at float). Ang tunay na numero na mahalaga ay ang dami sa litro. Ang foam boards at inflatables ay nakakamit ng mataas na volume sa pamamagitan ng lapad at kapal sa halip na sobrang haba, kaya mas madali para sa mga baguhan. Habang gumaganda ang iyong pag-unlad, binabawasan mo ang volume upang payagan ang board na lumubog nang mas malalim sa mukha ng alon at mas mabilis na umikot.'
  solution: 'Gumamit ng volume-to-weight calculator: para sa mga baguhan, hatiin ang timbang sa kg sa 1.5 para makuha ang target na litro. Para sa intermediate, hatiin sa 2. Ang mga intermediate ay dapat maghanap ng mga board na may katamtamang rocker at squash o round tail para sa versatility.'
  recommendation: Paddle Board Overstock Nag-aalok ang Surfboard Pro ng 75 litro ng volume sa isang 10'6" na pakete — perpekto para sa mga baguhan hanggang 90 kg. Ang mga magagaan na rider ay maaaring mag-size down hanggang SUP sa Tour 12 para sa mas magaan na pakiramdam habang sila ay sumusulong.
  faq:
    - q: Mahalaga ba ang taas para sa laki ng surfboard?
      a: Mas mahalaga ang taas kaysa timbang. Ang isang matangkad at magaan na surfer ay nangangailangan ng mas kaunting volume kaysa sa isang maikling surfer na may parehong taas. Gamitin ang timbang bilang pangunahing sukatan at i-adjust para sa fitness at lakas ng paddle.
    - q: Ano ang mangyayari kung masyadong malakas ang volume ng board ko?
      a: Kapag sobrang dami ng volume, parang corky at hindi matatag ang board sa wave face. Mahihirapan kang ilubog ang rail sa mga liko at maaaring tumalbog sa tubig tuwing bottom turns.
    - q: Ano ang mangyayari kung kulang ang volume ng board ko?
      a: Mahihirapan kang mag-paddle sa mga alon, lumulubog nang masyadong malalim sa takeoff, at mararamdaman mong hindi matatag habang nakaupo lang sa board at naghihintay. Halos palaging kailangan ng mga baguhan ng mas maraming volume kaysa sa iniisip nila.
    - q: Paano ko malalaman kung kailan dapat magbawas ng sukat?
      a: Kapag kaya mo nang sunod-sunod na mahuli ang mga alon, mag-pop up nang maayos, at makagawa ng basic na liko sa iyong kasalukuyang board, panahon na para mag-drop ng 5-10 litro. Ang pagbaba ng sukat nang masyadong maaga ay nagpapabagal sa iyong progreso.
