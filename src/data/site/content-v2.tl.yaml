  solution: Perpekto bilang yacht tender kung saan limitado ang espasyo sa deck. Perpekto para sa mga car camper na nais ng bangkang pangisda sa lawa. Maaaring sagwan o patakbuhin na may hanggang 6 hp.
  recommendation: Sa halagang $549, ang AirDeck 270 ay para sa mga minimalist na nangangailangan ng portable na bangka paminsan-minsan. Para sa mas regular na paggamit, subukan ang AirDeck 360 o RIB 330.
