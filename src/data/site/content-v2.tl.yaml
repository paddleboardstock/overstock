- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Gabay sa Sukat ng Paddle Board: Volume, Haba, at Lapad para sa Bawat Rider'
  description: Kumpletong sukat ng paddle board na may mga rekomendasyon sa dami ayon sa timbang at aktibidad. Kasama ang madaling gamitin na size chart para sa all-around, touring, surfing, at yoga SUP boards.
  definition: Ang laki ng paddle board ay tinutukoy ng dami (kapasidad ng timbang at float), haba (bilis at tracking), lapad (katatagan), at kapal (distribusyon ng volume at resistensya ng hangin).
  tldr: 'Gamitin ang bigat para makahanap ng minimum na volume: 50-70 kg ay nangangailangan ng 220-260L, 70-90 kg kailangan ng 260-300L, 90-110 kg kailangan ng 300-350L, 110+ kg kailangan ng 350L+. Para sa mga baguhan, dagdagan ng 20% ang mga numerong ito. Mahalaga ang lapad: 32" ay intermediate, 33-34" ay beginner-friendly, 35"+ ay napaka-stable.'
  problem: Ang mga listahan ng sukat ng paddle board ay gumagamit ng mga talampakan, pulgada, at litro nang palitan, kaya mahirap ikumpara sa iba't ibang brand.
  explanation: Ang volume ang pinaka-direktang sukatan para sa kapasidad ng timbang — 1 litro ng freshwater ang nag-aalis ng 1 kg ng timbang. Ang isang board na may 260L ay teoretikal na kayang suportahan ang 260 kg, ngunit mas mababa ang praktikal na kapasidad dahil kailangang nakaupo ang board sa ibabaw ng tubig. Ang kabuuang timbang mo (katawan kasama ang gear) ay dapat 30-40% ng volume ng board.
  solution: Target volume = (timbang ng katawan sa kg + gear weight sa kg) x 3. Para sa 75 kg paddler na may 5 kg na gear, target = 80 x 3 = 240L minimum. Para sa mga baguhan, imultiply sa 3.5. Para sa advanced, imultiply ng 2.5.
  recommendation: Ang Paddle Board Overstock SUP Explorer 11 (260L, 11' x 33" x 6") ay bagay sa karamihan ng rider na 50-100 kg. Ang mga magagaan na rider ay maaaring mag-size hanggang AirDeck 270. Ang mas mabibigat na rider ay dapat tingnan ang SUP Tour 12 (300L+) o mas malapad na board.
  faq:
    - q: Mahalaga ba ang taas para sa SUP sukat?
      a: Mas mahalaga ang taas kaysa timbang. Ang matangkad at magaan na rider ay nangangailangan ng mas kaunting volume kaysa sa maikling mabigat na rider. Gamitin ang timbang bilang pangunahing batayan ng volume.
    - q: Ano ang nangyayari kapag sobra ang volume?
      a: Masyadong mataas ang board, parang layag na humahawak ng hangin. Parang corky ang pakiramdam kapag chop. Pero para sa mga baguhan, mas mainam ang dagdag na volume kaysa kulang.
    - q: Ano ang nangyayari kapag kulang ang volume?
      a: Masyadong malalim ang board, kaya nagdudulot ng drag. Maaaring lumubog ang ilong habang nag-paddle (pearling). Mabilis kang mapagod sa pag-paddle ng bahagyang nakalubog na board.
    - q: Kailangan ba ng ibang sukat ang inflatable boards kumpara sa hard boards?
      a: Hindi naman malaki. Ang inflatables sa 15 ay+ PSI nag-aalis ng tubig na parang hard boards. Ang mga rekomendasyon sa dami ay pantay na naaangkop sa parehong uri.
