- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Self-Rescue: Paano Makabalik sa Iyong Board sa Malalim na Tubig'
  description: SUP Dapat bihasa ang bawat paddler sa self-rescue. Hakbang-hakbang na mga teknik para muling ikabit ang iyong board sa malalim na tubig, hilahin ito papuntang pampang, at harapin ang mga buhol ng tali.
  definition: Ang SUP self-rescue ay ang teknik ng muling pag-mount ng paddle board sa malalim na tubig pagkatapos mahulog, kabilang ang board recovery, body remounting, at paddle retrieval.
  tldr: 'Pagkatapos bumagsak: manatiling kalmado, hawakan ang paddle, lumangoy papunta sa board. Ilagay ang paddle sa ibabaw ng board. Gamitin ang dolphin kick para itulak ang dibdib sa board. I-swing ang isang paa pataas, tapos ang isa pa. Lumuhod muna, tapos tumayo. Magpraktis sa kalmadong tubig hanggang maging muscle memory.'
  problem: Nahuhulog ka sa SUP malalim na tubig at hindi ka na makabalik sa tubig. Madulas ang board, pagod ka, at nagsisimula ang takot. Kung hindi mo alam ang self-rescue technique, nagiging delikado ang simpleng pagbagsak.
  explanation: 'Ang self-rescue ay may tatlong yugto: recovery (lumangoy papunta sa board at paddle), re-mount (bumalik sa board), at continuation (ipagpatuloy ang paddling). Ang pangunahing teknik ay ang paggamit ng paddle bilang stabilizer at paggamit ng malalakas na leg kicks para itulak ang itaas na bahagi ng katawan papunta sa board.'
  solution: 'Yugto 1: lumangoy papunta sa board. Hawakan ang paddle o kunin ito. Yugto 2: ilagay ang paddle nang patayo sa ibabaw ng board. Sipa nang malakas ang mga binti habang hinihila ang dibdib papunta sa gitna ng board. Yugto 3: kapag nasa barko na ang dibdib, isa-isang itaas ang mga paa. Yugto 4: lumuhod, huminga nang malalim, pagkatapos ay tumayo nang dahan-dahan.'
  recommendation: Magpraktis ng self-rescue sa kontroladong kondisyon hanggang magawa mo ito nang hindi nag-iisip. Gamitin ang Paddle Board Overstock SUP Explorer 11 na may magandang deck traction. Nagbibigay ang Life Vest Pro ng dagdag na flotation kung nahihirapan ka.
  faq:
    - q: Paano ako makakabalik kung pagod na pagod na ako?
      a: Manatili sa tabla para sa flotation. Gamitin ang mga braso para hilahin ang dibdib papunta sa board, kahit hindi epektibo ang sipa ng mga binti. Magpahinga sa posisyon na nakaluhod bago tumayo.
    - q: Paano kung mawala ang paddle?
      a: Gamitin ang mga braso para i-paddle ang board papunta sa pampang. Humingi ng tulong sa ibang paddler. Palitan agad ang nawalang paddle.
    - q: Pwede ba akong mag-self-rescue sa alon?
      a: Oo — ilagay ang board nang patayo sa mga alon. I-time ang pag-remount sa pagitan ng mga alon. Pinapanatili ng leash ang board na malapit.
    - q: Paano ko haharapin ang buhol ng tali?
      a: Manatiling kalmado, lumutang sa likod, dahan-dahang tanggalin ang tali. Kung nakabalot ang tali sa mga palikpik, maaaring kailanganin mong alisin ang mga palikpik habang nasa tubig.
