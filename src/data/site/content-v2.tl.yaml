- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Mga Patakaran sa Etiketa sa Surf (Paano Hindi Maging Taong Iniiwasan ng Lahat)
  description: May mga patakaran ang lineup at walang sinuman ang sumusulat nito. Alamin ang tamang daan, kung bakit ang pag-snak ay magpapasigaw sa iyo, paano humingi ng paumanhin, at ang mga pagkakamali ng baguhan na nakakainis sa bawat lokal na surfer.
  definition: 'Ang surf etiquette ay isang hindi nakasulat na code of conduct na pumipigil sa banggaan at patas na nagbabahagi ng mga alon. Ang pangunahing patakaran: ang surfer na pinakamalapit sa tuktok ng bumabagsak na alon ay may karapatan sa daan.'
  tldr: Ang surfer na pinakamalapit sa tuktok ng bumabagsak na alon ang may karapatan sa daan. Huwag sumugod sa iba, huwag mag-snake (mag-paddle sa paligid ng iba para kunin ang kanilang alon), at laging humingi ng paumanhin kung magkamali ka. Mag-paddle nang malapad sa paligid ng lineup, hawakan ang iyong board, at maging palakaibigan — ang respeto ay nakakakuha ng respeto.
  problem: Nag-paddle ka papunta sa isang masikip na lineup at agad mong nararamdaman ang tensyon. Tinitingnan ka ng mga surfer nang pahilis, may sumisigaw sa iyo, at hindi ka sigurado kung ano ang nagawa mong mali. Mas nakakatakot ang sosyal na bahagi ng surfing kaysa sa mismong mga alon.
  explanation: 'Ang surf etiquette ay umiiral upang maiwasan ang banggaan at patas na hatiin ang mga alon. Ang pangunahing tuntunin ay right of way: ang surfer na pinakamalapit sa tuktok (kung saan unang bumabali ang alon) ang may prayoridad. Sinumang nag-paddle para sa parehong alon mula sa loob ay kailangang umatras. Ang pag-snaking — pag-paddle sa paligid ng ibang surfer para agawin ang prayoridad — ay itinuturing na pinakamasamang paglabag. Higit pa sa prayoridad, may mga inaasahan ang lineup tungkol sa ingay (panatilihing minimal ang pagsigaw), kontrol sa board (huwag hayaang lumapit ang board sa iba), at pagiging palakaibigan (isang simpleng pag-iling ay malaking tulong na).'
  solution: Panoorin ang lineup ng 10 minuto bago mag-paddle palabas. Tukuyin kung sino ang pinakamaraming alon — sila ang mga surfer na dapat igalang at iwasan. Manatili sa loob (white water zone) kung natututo ka. Mag-paddle nang malapad sa paligid ng lineup, huwag dumaan dito. Kapag nakahuli ka ng alon, tumingin sa magkabilang direksyon bago umakyat at siguraduhing walang mas malalim.
  recommendation: Gugulin ang iyong unang ilang sesyon sa isang break-friendly para sa mga baguhan na may magkakalat na mga tao. Matutong basahin ang prayoridad bago subukan ang isang abalang lineup. Kung dumaan ka sa isang tao, agad na humingi ng paumanhin at mag-paddle papunta — karamihan sa mga surfer ay nirerespeto ang isang tapat na pagkakamali.
  faq:
    - q: Ano ang ibig sabihin ng drop-in?
      a: Ang pag-drop in ay nangangahulugang pag-paddle at pagsakay sa alon na prayoridad na ng ibang surfer. Delikado at bastos ito. Ang surfer na pinakamalapit sa tuktok ang may-ari ng alon; ang iba pa ang kailangang humawak.
    - q: Ano ang snaking?
      a: Ang pag-snaking ay ang pag-paddle sa paligid ng isa pang surfer na nasa posisyon na para sa alon para mapalapit ka sa tuktok. Itinuturing itong napakasamang etiketa at maaaring magdulot ng pagtatalo.
    - q: Pwede bang mag-surf ang mga baguhan sa masikip na break?
      a: Oo, pero manatili sa white water zone na malayo sa tuktok. Huwag mag-paddle papunta sa main takeoff area hangga't hindi mo pa rin mahuli ang mga alon at makontrol ang direksyon mo. Ang masikip na lineup ay nangangailangan ng karanasan para ligtas na mag-navigate.
    - q: Paano ako magso-sorry sa tubig?
      a: Isang simpleng kaway, ngiti, at "sorry" o "sorry" ay epektibo. Aminin ang pagkakamali at lumayo sa tao. Karaniwang nagpapatawad ang mga surfer sa tapat na pagkakamali, lalo na kung malinaw na natututo ka.
    - q: Ano ang dapat kong gawin kung may dumaan sa akin?
      a: Kung malinaw ang drop-in, sumigaw ng "wave" o "hey" para alertuhan sila. Kung aksidenteng mahuli nila at humingi ng paumanhin, hayaan mo na. Kung paulit-ulit na dumalo, lumapit ka at magalang na ipaliwanag ang prayoridad. Iwasan ang mga pagtatalo.
