- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Pagpapanatili ng Inflatable na Bangka: Pangalagaan ang Iyong Puhunan'
  description: Taunang checklist para sa pagpapanatili ng inflatable boat. Paglilinis, UV proteksyon, inspeksyon ng tahi, pamamahala ng presyon, pangangalaga ng makina, at winterization para sa PVC mga Hypalon bangka.
  definition: Kasama sa maintenance ng inflatable boat ang paglilinis, UV proteksyon, pressure management, seam at valve inspection, pag-iwas sa amag, at tamang pag-iimbak sa off-season.
  tldr: Banlawan pagkatapos ng bawat paggamit sa maalat na tubig. Maglagay ng UV protectant tuwing 2-3 buwan. Suriin ang inflation pressure bago ang bawat paglabas. Suriin ang mga tahi, balbula, at transom buwan-buwan. Linisin gamit ang banayad na sabon. Itago ang deflated sa malamig at tuyong lugar sa off-season.
  problem: Ginamit mo ang inflatable boat mo ng isang season at ngayon ay mukhang kupas na ang mga tubo, may seam na pumutok, at ang transom ay parang spongy — lahat ay maiiwasan sa regular na maintenance.
  explanation: UV Sinisira ng radiation ang polymer matrix. Ang maalat na tubig ay nagkikristal sa mga tiklop at nag-aalis ng tela. Lumalaki ang amag sa nakakulong na kahalumigmigan. Ang maling presyon ay nagdudulot ng pagkapagod ng materyal. Ang transom (lalo na ang plywood) ay sumisipsip ng tubig sa pamamagitan ng mga butas ng turnilyo.
  solution: 'Pagkatapos ng bawat paggamit: banlawan gamit ang malinis na tubig, patuyuin, suriin ang presyon. Buwan-buwan: punasan ang mga tubo gamit UV ang protectant, inspeksyunin ang mga tahi, suriin ang balbula. Taun-taon: malalim na paglilinis, inspeksyon ng transom para sa bulok, pagpapadulas ng mga balbula, pagsusuri para sa micro-leaks.'
  recommendation: Gamitin ang 303 Aerospace Protectant sa Paddle Board Overstock mga tubo ng bangka. Tanggalin ang mga balbula at maglagay ng silicone grease taun-taon. Itago sa carry bag kasama ang desiccant pack.
  faq:
    - q: Pwede ko bang gamitin ang bleach para linisin ang inflatable boat ko?
      a: Hindi — sinisira ng bleach ang fabric coating. Gumamit ng banayad na sabon at maligamgam na tubig. Para sa amag, gumamit ng diluted white vinegar.
    - q: Gaano kadalas dapat akong gamutin gamit ang UV protectant?
      a: Tuwing 2-3 buwan sa panahon ng paggamit. Mas madalas sa mga tropikal na klima.
    - q: Kailangan ko bang i-deflate ang bangka sa pagitan ng paggamit?
      a: Hindi kung ginagamit lingguhan. Iwanang inflated na may UV takip. Para sa buwanang puwang, i-deflate at itago.
    - q: Paano ko mapapanatili ang transom?
      a: Suriin ang mga bolt buwan-buwan. I-seal ang mga nakalantad na gilid ng kahoy gamit ang marine varnish taun-taon. Palitan kung may malalambot na bahagi.
