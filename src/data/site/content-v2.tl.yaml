- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'SUP Gabay sa Lisi: Tuwid kumpara sa Paikot na Tali Ipinaliwanag'
  description: Kumpletong gabay sa SUP mga tali — tuwid kumpara sa coiled, bukung-bukong laban sa binti, mga opsyon sa mabilisang pagbitaw, at kung paano pumili ng tamang tali para sa iyong kondisyon sa pagpaddle.
  definition: Ang SUP tali ay isang lubid na nakakabit sa paddler sa board, upang maiwasan ang paghihiwalay. Kabilang dito ang tuwid na tali (para sa surfing at ilog) at paikot-ikot na tali (para sa patag na tubig).
  tldr: Ang coiled leashes ay pinakamainam para sa patag na tubig at fitness paddling — hindi ito nakalagay sa board at labas ng tubig. Ang straight leashes ay para sa SUP surfing at rivers — nagbibigay ito ng mas malayang kalayaan at hindi naispit. Mas gusto ang calf attachment kaysa sa bukung-bukong para sa ginhawa. Mahalaga ang quick-release leashes para sa river paddling upang maiwasan ang pagkakakulong.
  problem: Bumili ka ng leash kasama mo SUP pero hindi ka sigurado kung ito ba ang tamang uri para sa istilo ng paddle mo. Ang maling leash ay maaaring mag-drag, stuck, o masira kapag pinaka-kailangan mo ito.
  explanation: Ang straight leashes ay simpleng nylon o polyurethane cords na sumusunod sa likod ng board. Epektibo ito sa surf dahil hindi sila nahuhuli sa fins. Ang coiled leashes ay spiral cords na kumikilos kapag hindi naka-tension — nananatili itong nakaikot sa deck kapag nag-paddle at umaabot kapag nahulog ka. Pinapanatili nitong hindi tumatama ang leash sa tubig sa patag na kondisyon, kaya nababawasan ang drag.
  solution: Pumili ng coiled leash para sa patag na tubig, fitness, at SUPtouring. Ang nabawasang drag ay tumutulong mapanatili ang bilis at pinipigilan ang leash na mahuli sa mga bagay sa ilalim ng tubig. Pumili ng tuwid na leash para sa SUP surfing at river paddling. Ang tuwid na disenyo ay hindi madaling maipit sa mga palikpik o hadlang.
  recommendation: kasama sa Paddle Board Overstock SUP mga package ang angkop na uri ng leash para sa layunin ng board. Ang coiled leash sa SUP Explorer 11 package ay mahusay para sa all-around paddling.
  faq:
    - q: Dapat bang ikabit ang tali sa aking bukung-bukong o binti?
      a: Mas mainam ang pagkakabit ng binti SUP para sa — pinipigilan nitong mapasok ang tali sa tubig habang nagpapaddle at nababawasan ang panganib na matisod kapag naglalakad.
    - q: Gaano katagal dapat ang SUP tali?
      a: 8-10' para sa patag na tubig, 6-8' para sa surf. Mas maiikling tali ay nagpapababa ng drag ngunit nililimitahan ang kalayaan sa paggalaw sa board.
    - q: Kailangan ko ba ng quick-release leash para sa mga ilog?
      a: Oo — SUP ang river ay nangangailangan ng quick-release leash o belt na maaaring tanggalin agad upang maiwasan ang pagkakakulong sa mga strainer.
    - q: Pwede ba akong gumamit ng surf leash para saSUP?
      a: Mas maikli at manipis ang mga surf leash. Epektibo ito para sa SUP surfing ngunit hindi ideal para sa flat water paddling kung saan mas mainam ang mas mahaba at paikot na leash.
