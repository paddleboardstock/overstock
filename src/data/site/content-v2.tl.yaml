  description: Review ng Paddle Board Overstock AirDeck 270 — isang 9' compact inflatable boat na may air deck floor. Perpekto para sa solo paddling, yacht tendering, at recreational na gamit gamit ang maliliit na outboard motor.
  definition: Ang Paddle Board Overstock AirDeck 270 ay isang 9' (270 cm) inflatable boat na may air deck floor, na may rating na hanggang 6 hp na outboard engines. Isang compact, ultra-portable na watercraft para sa 1-2 tao.
