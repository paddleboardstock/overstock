- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm Wetsuit: Ano ang Madalas na Nagkakamali ang mga Baguhan sa Malamig na Tubig'
  description: Itigil ang pagyeyelo sa gitna ng session o ang sobrang init sa tabing-dagat. Ang tunay na pagkakaiba ng 3mm at 5mm na wetsuit — temperature chart, mga kapalit sa flexibility, at kung ano talaga ang epektibo para sa cold-water surfing.
  definition: Ang wetsuit ay isang neoprene na kasuotan na nakakapit ng manipis na patong ng tubig laban sa balat, na pinapainit ng init ng katawan para sa insulasyon. Ang kapal (3mm, 5mm) ang tumutukoy sa saklaw ng temperatura na kayang hawakan ng isang suit — mas makapal ay mas mainit ngunit hindi gaanong flexible.
  tldr: Ang kapal ng wetsuit ay direktang tumutukoy sa init at kakayahang umangkop. Gamitin ang 3mm para sa tubig na higit sa 16°C at 5mm para sa tubig sa pagitan ng 8°C at 16°C. Ang mas makakapal na suit ay naglilimita sa galaw ngunit pinananatili kang mainit nang mas matagal — laging unahin ang fit kaysa brand.
  problem: Magbubukas ka ng online store o pumasok sa surf shop at makikita ang wetsuit na may label na 3/2, 4/3, 5/4, at 5mm full suits. Hindi gaanong mahalaga ang mga numero hangga't hindi mo napagtanto na ang maling kapal ay nangangahulugang nagyeyelo sa kalagitnaan ng session o sobrang init at pagpapawis sa tabing-dagat.
  explanation: Ang wetsuit ay gumagana sa pamamagitan ng pagkulong ng manipis na patong ng tubig sa pagitan ng iyong balat at neoprene; pinapainit ng iyong katawan ang tubig na iyon, na lumilikha ng insulation. Ang mas makapal na neoprene ay nakakakulong ng mas maraming tubig ngunit nililimitahan ang kakayahan at buoyancy. Ang 3mm suit (madalas 3/2 na may mas manipis na braso) ay angkop sa banayad na kondisyon, habang ang 5mm (5/4/3 o buong 5mm) ay angkop sa malamig na tubig. Mas mahusay ang pag-seal ng chest zip entries kaysa sa back zip at binabawasan ang flushing. Ang seam construction — glued at blind-stitched (GBS) — ang pagkakaiba ng leaky suit at mainit na suit.
  solution: I-match ang kapal sa lokal na temperatura ng tubig na may 5°C margin of error. Para sa temperate climate, bumili ng 3/2mm. Para sa malamig na tubig, bumili ng 5/4/3mm. Magdagdag ng boots, gloves, at hood para mapalawak pa ang range ng 5°C pababa. Subukan ang suit bago bumili o pumili ng brand na may maluwag na return policy.
  recommendation: Ang Paddle Board Overstock Wetsuit Pro na 5/4/3mm ay perpekto para sa karamihan ng mga surfer sa malamig na tubig, na nag-aalok ng GBS seams at thermal lining. Kung nagsu-surf ka sa mainit na tubig na lampas 20°C, mas mainam ang 3/2mm na may chest zip.
  faq:
    - q: Anong temperatura ng tubig ang nangangailangan ng 5mm wetsuit?
      a: Ang temperatura ng tubig na nasa pagitan ng 8°C at 14°C ay nangangailangan ng 5mm na suit. Sa ilalim ng 8°C, kailangan mo ng 6/5/4mm na hooded suit. Sa pagitan ng 14°C at 18°C, ang 4/3mm ay angkop para sa karamihan.
    - q: Pwede ba akong magsuot ng 3mm wetsuit tuwing taglamig?
      a: Sa banayad na klima ng taglamig kung saan ang tubig ay nananatiling higit sa 16°C. Para sa tunay na winter surfing, kinakailangan ang 5mm o 5/4/3mm. Ang boots, gloves, at hood ay nagbibigay ng pantay na init nang hindi nangangailangan ng mas makapal na katawan.
    - q: Gaano dapat higpit ang wetsuit?
      a: Masikip pero hindi mahigpit. Walang air pockets o maluwag na neoprene. Kung pwede mong ipasok ang daliri sa pagitan ng balat mo at ng suit sa ibabang likod, masyadong maluwag ito. Kung mahirap huminga o sobrang limitado ang galaw, mag-size up.
    - q: Pinapainit ka ba ng mamahaling wetsuit?
      a: Mas mataas na presyo ay kadalasang nangangahulugan ng mas magandang neoprene (limestone-based kumpara sa petrolyo), mas maayos na seam construction (GBS kumpara sa glued lang), at mas magandang flex. Direktang nakakaapekto ang mga salik na ito sa init at tagal ng buhay pero kung tama ang fit.
