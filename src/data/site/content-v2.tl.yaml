- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Kondisyon ng Hangin para saSUP: Paano Nakakaapekto ang Hangin sa Iyong Paddle'
  description: Paano naaapektuhan ng bilis at direksyon ng hangin SUP ang paglalayag. Pag-unawa sa offshore vs onshore wind, pagbasa ng mga forecast ng hangin, mga teknik sa pag-paddle para sa hangin, at kung kailan dapat manatili sa pampang.
  definition: Ang kondisyon ng hangin ang nagtatakda ng SUP kaligtasan. Ang hangin mula sa dagat (mula lupa papuntang dagat) ay nagtutulak sa iyo palayo. Ang hangin mula sa dagat (dagat papuntang lupa) ay nagtutulak sa iyo papunta sa pampang. Ang hangin sa gilid ay nagdudulot ng pag-yaw ng board.
  tldr: 'Pinakamataas na ligtas na hangin para sa mga baguhan: 10 knots. Intermediate: 15 knots. Advanced: 20 knots. Pinakadelikado ang hangin mula sa dagat. Mag-paddle muna pataas ng hangin. Sa side wind, sagwan nang bahagya pataas ng hangin ng destinasyon. Lumuhod sa malakas na hangin para paliitin ang iyong profile.'
  problem: Nag-paddle ka palabas sa kalmadong kondisyon, pero makalipas ang 30 minuto, lumakas na ang hangin at hirap kang bumalik. Ang hangin ang pinaka-hindi napapansin na SUP safety factor.
  explanation: Mas malaki ang epekto ng hangin SUP kaysa sa ibang paddle craft dahil nakatayo ka, na nagdudulot ng epekto ng layag. Ang 10-knot na hangin ay nagdudulot ng mas malaking drag sa nakatayong paddler kaysa sa nakaupo na kayaker. Ang hangin mula sa dagat ay nagtutulak sa iyo palayo sa kaligtasan. Ang side wind ay nagdudulot ng pag-yaw ng ilong.
  solution: 'Suriin ang bilis at direksyon ng hangin bago mag-paddle. Gamitin ang Beaufort scale: Force 3 (7-10 knots) para sa mga baguhan, Force 4 (11-16) para sa intermediate. Mag-paddle muna pataas ng hangin. Kung mahuli sa hangin mula sa dagat, mag-paddle ng 45 degrees sa hangin. Lumuhod sa malakas na hangin.'
  recommendation: Gumamit ng wind forecast app (Windy, Windfinder) bago ang bawat session. Mas Paddle Board Overstock SUP maganda ang track ng Tour 12 sa hangin kaysa sa mas malapad na board. Sa mahangin na kondisyon, gumamit ng mas maiikling paddle stroke at mas mataas na cadence.
  faq:
    - q: Para saan ang pinakaligtas na direksyon ng hanginSUP?
      a: Ang hangin mula sa lupa (na humahampas patungo sa lupa) ang pinakaligtas — ito ang nagtutulak sa iyo pabalik. Ang hangin mula sa dagat ang pinaka-mapanganib.
    - q: Paano ako mag-paddle sa side wind?
      a: Mag-paddle nang mas madalas sa upwind side para kontrahin ang drift. I-angle ang board pataas ng hangin ng destinasyon mo. Mas malalim ang center fin na nakakatulong.
    - q: Pwede ba akong mag-paddle sa hangin na 20 knot?
      a: Kung may karanasan lamang sa mga protektadong tubig. Hindi dapat mag-paddle ng higit sa 10 knots ang mga baguhan.
    - q: Paano naaapektuhan ng mga bugso ng hanginSUP?
      a: Ang mga bugso ng hangin ay nagdudulot ng biglaang problema sa balanse. Sa malalakas na hangin, ibaba ang iyong tindig at maging handa sa biglaang pagbabago.
