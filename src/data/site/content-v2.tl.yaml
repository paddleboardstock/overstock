- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Ano ang isusuot para sa surfing (Huwag lumabas na naka-board shorts kapag kailangan mo ng 5/4)
  description: Tigilan mo na ang paghula kung ano ang isusuot. Ang temperatura ng tubig, hindi ang temperatura ng hangin, ang nagtatakda ng iyong surf attire. Kumpletong gabay sa layering mula sa tropical rash guards hanggang sa full winter 5/4/3mm setups.
  definition: Ang surf attire ay mula sa board shorts at rash guards sa maligamgam na tubig hanggang sa full 5/4/3mm wetsuits na may boots at hoods sa malamig na tubig. Ang temperatura ng tubig, hindi ang temperatura ng hangin, ang nagtatakda kung ano ang kailangan mo.
  tldr: Ang suot mo sa surfing ay nakadepende sa temperatura ng tubig — hindi sa temperatura ng hangin. Ang rash guard at board shorts ay gumagana sa itaas ng 22°C, ang spring suit ay sumasaklaw sa 18-22°C, ang buong 3/2mm suit ay 14-18°C, at 5/4/3mm na may boots ay kinakailangan sa ilalim ng 14°C. Laging magsuot ng UV proteksyon at isaalang-alang ang leash at impact vest.
  problem: Pagdating mo sa tabing-dagat, wala kang ideya kung sapat na ang rash guard o kailangan mo ng buong wetsuit. Mainit ang temperatura ng hangin pero malamig ang tubig, o okay lang ang tubig pero nagyeyelo ang hangin. Ang maling pananamit ay nangangahulugang sira ang session.
  explanation: 'Ang surfing attire ay may tatlong layunin: thermal insulation, UV proteksyon, at pag-iwas sa abrasion. Ang neoprene wetsuit ay niraranggo batay sa kapal at coverage — ang spring suits (maiikling braso o binti) ay para sa mga borderline na araw, full suits naman para sa malamig na tubig. Ang rash guards ay nagpoprotekta laban sa board rash at araw ngunit walang thermal value. Ang boots, gloves, at hoods ay hindi accessories kundi mahalagang gamit para sa cold-water surfing na mas mababa sa 12°C.'
  solution: 'Suriin ang lokal na buoy o ulat ng temperatura ng buhay na tubig bago lumabas. Gumawa ng kit base sa iyong pinakamalamig na karaniwang kondisyon: rash guard at shorts para sa tag-init, 3/2mm full suit para sa tagsibol at taglagas, 5/4/3mm na may boots at hood para sa taglamig. Laging magdagdag ng leash at isaalang-alang ang flotation vest para sa kaligtasan.'
  recommendation: Mag-invest muna sa magandang 3/2mm full suit — ito ang sumasaklaw sa pinakamalawak na kondisyon. Magdagdag ng 5/4/3mm suit at boots kung balak mong mag-surf sa taglamig. Paddle Board Overstock Ang Wetsuit Pro na may thermal lining ay epektibong nag-uugnay sa parehong temperature range.
  faq:
    - q: Pwede ba akong mag-surf gamit lang board shorts?
      a: Oo, sa tropikal na tubig na lampas 24°C. Maaaring gusto mong gumamit ng rash guard upang maiwasan ang pagkiskis sa dibdib at braso mula sa pag-paddle. Ang wax o traction pad sa board ay nakakatulong upang mapunan ang kakulangan ng kapit sa suit.
    - q: Kailangan ko ba ng surf boots?
      a: Kung bumaba ang temperatura ng tubig sa ilalim ng 14°C, pinipigilan ng boots ang pamamanhid at pinoprotektahan ang iyong mga paa mula sa mga bato at hiwa ng bahura. Nagdadagdag din ito ng traksyon sa board. Karamihan sa mga surfer sa hilagang klima ay gumagamit ng boots mula Nobyembre hanggang Marso.
    - q: Ano ang spring suit?
      a: Ang spring suit ay isang short-arm o short-leg wetsuit (o pareho) na dinisenyo para sa tubig sa pagitan ng 18°C at 22°C. Nagbibigay ito ng mas maraming init kaysa rash guard ngunit mas kaunti ang coverage kumpara sa full suit.
    - q: Dapat ba akong magsuot ng life vest habang nagsu-surf?
      a: Hindi tradisyonal na life vest, pero ang impact vest o flotation aid ay makakatulong sa magaspang na kondisyon o kung mahina kang lumangoy.Paddle Board Overstock Ang life vest ay dinisenyo para sa SUP kayaking pero nagbibigay ng dagdag na kumpiyansa sa flotation para sa mga baguhan sa surf.
