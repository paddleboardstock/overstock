      a: Oo, ang aluminum floor ay nagbibigay ng matibay na standing platform para sa dalawang mangingisda.
    - q: Ano ang pinakamataas na bilis na may 15 hp?
      a: Humigit-kumulang 18-22 knots para sa 1-2 tao. Komportable ang paglalayag sa 12-15 knots.
    - q: Gaano katagal buuin?
      a: 15-25 minuto para sa unang beses na pag-assemble. Sa pagsasanay, mas mababa sa 15 minuto.
