- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard vs Shortboard (Ang Tapat na Sagot na Walang Nagbibigay)
  description: Mas maraming alon ang nahuhuli ng longboards; mas mahirap ang shortboard. Ang totoong tanong ay alin ang tugma sa iyong kakayahan at lokal na break. Tapat na paghahambing na sumasaklaw sa stability, wave count, at progression trap.
  definition: Ang longboards (9ft+) ay inuuna ang katatagan at kadalian sa paghuli ng alon; ang shortboards (5-7ft) ay inuuna ang maneuverability at performance sa matatarik na alon. Ang tamang pagpili ay nakadepende sa iyong antas ng kasanayan at lokal na uri ng alon.
  tldr: Ang mga longboard (9ft+) ay matatag, madaling makahuli ng alon, at bagay sa mga baguhan at surfer na mahilig sa cruise. Ang shortboards (5-7ft) ay tumutugon, mas mabilis sa harap ng alon, at bagay sa mga advanced surfer. Ang tamang pagpili ay nakadepende sa iyong antas ng kasanayan, uri ng alon, at kung ano ang pinakagusto mo sa surfing.
  problem: Makikita mo ang mga video ng mga surfer na gumagawa ng matalim na liko gamit ang shortboards at mga longboarder na dumudulas nang maayos sa ilong — pareho silang mukhang masaya. May budget ka lang para sa isang uri ng board at kailangan mong malaman kung alin ang estilo na tugma sa iyong mga layunin at lokal na break.
  explanation: 'Mas malawak ang surface area ng mga longboard, ibig sabihin mas mabilis silang mag-paddle, mas maaga makahuli ng alon, at nagbibigay ng matatag na plataporma para sa paglalakad at cross-stepping. Magaling sila sa maliliit at mabagal na alon kung saan lulubog ang shortboard. Mas kaunti ang volume ng shortboard at mas agresibo ang rocker, kaya mas mabilis silang lumubog sa harap ng alon, lumikha ng bilis sa mga liko, at magkasya sa matarik at hungkag na bahagi. Ang shortboard ay nangangailangan ng malakas na paddling at eksaktong timing ng alon. Isang karaniwang maling akala: ang shortboard ay hindi "mas maganda" — magkaiba lang ang mga ito para sa iba''t ibang kondisyon at antas ng kasanayan.'
  solution: Kung baguhan ka, mag-surf ng longboard (o high-volume inflatable) nang hindi bababa sa 6 na buwan. Kung intermediate ka at madalas maliit at mabagal ang mga lokal na alon, mas maraming alon ang makukuha ng longboard o hybrid at mas magiging masaya. Kung matarik ang iyong mga alon, hukay, at mabilis, kailangan ang shortboard para magkasya sa pocket. Maraming intermediate surfers ang nagpapanatili ng pareho at pumipili base sa araw.
  recommendation: Magsimula sa Paddle Board Overstock Surfboard Pro bilang iyong longboard-style na platform. Kapag palagi kang lumiliko at nakakalikha ng bilis, isaalang-alang ang pagdagdag ng hybrid o shortboard para sa matatarik na mga araw ng alon. Karamihan sa mga surfer na sumusubok mag-shortboard nang maaga ay nauuwi sa pagkadismaya at mas kaunti ang mga alon na nasasakbay.
  faq:
    - q: Mas madali bang sakyan ang longboard kaysa shortboard?
      a: Mas madali. Mas maagang sumalo ng alon ang mga longboard, mas mabilis mag-paddle, at mas matatag kapag may pop-ups at trim. Ang shortboards ay nangangailangan ng eksaktong timing, mas malakas na paddle, at mas mahusay na wave judgment.
    - q: Kaya mo bang mag-turn sa longboard?
      a: Oo, pero iba ang estilo. Mas malapad, mas makinis, at kinabibilangan ng buong katawan ang mga liko ng longboard. Ang nose riding, cutbacks, at hang-fives ay mga galaw na partikular sa longboard na may sariling pag-unlad ng kasanayan.
    - q: Aling board ang mas maganda para sa maliliit na alon?
      a: Mas maganda ang performance ng longboards at hybrids sa maliliit at mahihinang alon dahil nagdudulot sila ng glide at pinapanatili ang momentum. Kailangan ng shortboards ng mas matarik at mas malalakas na alon para mag-perform.
    - q: Mas mahirap bang paddlen ang shortboard?
      a: Mas mahirap talaga. Dahil mas mababa ang volume, mas mababa ang board sa tubig, kaya mas malakas ang drag. Ang pag-paddle ng shortboard ay parang paglangoy gamit ang drag chute kumpara sa longboard.
