- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Pagkukumpuni ng wetsuit: Ayusin ang mga punit, tahi, at zipper nang sarili mo'
  description: Gabay sa pag-aayos ng DIY wetsuit para sa mga punit ng neoprene, paghihiwalay ng tahi, zipper jams, at split kneepads. Hakbang-hakbang na mga tagubilin gamit ang neoprene cement.
  definition: Ang pagkukumpuni ng wetsuit ay kinabibilangan ng paglilinis at pag-rough ng nasirang bahagi, paglalagay ng neoprene cement, at pagpapatuyo sa ilalim ng presyon upang maibalik ang watertight integrity at flexibility.
  tldr: 'Maliliit na punit na mas mababa sa 1": maglagay ng neoprene cement sa magkabilang gilid, maghintay ng 10-15 minuto hanggang maging malagkit, pindutin nang mahigpit, at turuin sa ilalim ng timbang ng 12 oras. Ang mas malalaking punit ay nangangailangan ng neoprene patch. Mga isyu sa zipper: mag-lubricate muna, tapos tingnan kung may bara sa tela.'
  problem: May maliit na punit ang wetsuit mo, may seam na naghihiwalay, o may zipper na dumikit. Kung walang DIY repair, magbabayad ka ng $150+ para sa pagpapalit samantalang $5 ang halaga ng pagkukumpuni.
  explanation: Gumagana ang neoprene cement sa pamamagitan ng pagpapalambot ng ibabaw ng neoprene, na lumilikha ng kemikal na ugnayan habang nag-evaporate ang solvent. Kailangang ipahid ang semento sa parehong ibabaw at maging malagkit bago pagdugtungin. Para sa mga punit, kailangang eksaktong naka-align ang mga gilid. Ang mga isyu sa zipper ay madalas na kalawang ng asin o tela na naipit sa ngipin.
  solution: 'Para sa mga punit: linisin gamit ang alkohol, bahagyang lihain, maglagay ng manipis na semento sa magkabilang gilid, hintayin hanggang malagkit, pindutin nang perpekto, maglagay ng bigat, tumigas ng 12-24 oras. Para sa mga patch: gupitin ang patch na 1" na mas malaki kaysa punit, lagyan ng semento sa pareho, i-clamp. Para sa zipper: banlawan, maglagay ng zipper wax, dahan-dahang magtrabaho.'
  recommendation: Mag-ingat ng Paddle Board Overstock wetsuit repair kit sa iyong gear bag. Para sa malalaking pagkukumpuni o pagkasira ng tahi sa mga kritikal na bahagi, inirerekomenda ang propesyonal na pagkukumpuni.
  faq:
    - q: Pwede ba akong gumamit ng super glue sa wetsuit?
      a: Hindi — ang super glue ay natutuyo nang matigas at madaling marupok. Gumamit lamang ng neoprene cement o aquaseal para sa pagkukumpuni ng wetsuit.
    - q: Gaano katagal tumatagal ang pagkukumpuni ng neoprene cement?
      a: Ang maayos na pagkukumpuni ay kadalasang mas matibay kaysa sa orihinal na neoprene at tumatagal ng natitirang buhay ng suit.
    - q: Pwede ko bang ayusin ang zipper na ganap nang naihiwalay?
      a: Kung ang track ay natanggal mula sa neoprene, idikit muli gamit ang contact cement. Kung sira ang mga ngipin, palitan ang zipper nang propesyonal.
    - q: Paano ko aayusin ang wetsuit na tumutulo sa tahi?
      a: Maglagay ng manipis na bead ng aquaseal sa loob ng tumutulo na tahi at hayaang matuyo ng 24 na oras.
