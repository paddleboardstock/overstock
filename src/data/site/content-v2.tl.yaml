    - q: Ano ang pinakamataas na bilis gamit ang 6 hp na makina?
      a: Tinatayang 10-12 knots sa isang tao, 7-9 knots sa dalawa.
    - q: Angkop ba ang AirDeck 270 para sa pangingisda?
