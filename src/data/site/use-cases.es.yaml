cases:
  - id: beginner
    title: 'Deportes acuáticos para principiantes'
    desc: 'Tablas de SUP estables y kayaks para quienes se inician.'
    scenario: >-
      Una familia que visita un lago durante el fin de semana quiere probar el
      paddle surf. Necesita equipos estables y fáciles de poner en el agua, con
      indicaciones de seguridad claras.
    solution: >-
      La SUP Explorer 11 ofrece estabilidad de gran anchura para principiantes.
      El Life Vest Classic garantiza flotación certificada CE. La bomba de doble
      acción hincha ambas tablas en menos de 10 minutos.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp

  - id: river-touring
    title: 'Exploración al aire libre'
    desc: 'Kayaks y botes neumáticos portátiles para ríos, lagos y salidas costeras.'
    scenario: >-
      Un entusiasta de la naturaleza planea una expedición fluvial de una semana
      y necesita una embarcación que ocupe poco espacio, se infle en el
      campamento y se adapte a corrientes variables.
    solution: >-
      El Kayak Lite cabe en una mochila y se infla en menos de 4 minutos. Su
      construcción drop-stitch domina lagos, ríos de corriente lenta y travesías
      costeras.
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp

  - id: professional-operations
    title: 'Operaciones profesionales'
    desc: 'RIBs de grado comercial para operadores turísticos y respuesta de emergencia.'
    scenario: >-
      Un operador turístico costero necesita una flota de embarcaciones
      duraderas que realice salidas diarias en distintas condiciones del mar y
      cumpla la normativa comercial de seguridad.
    solution: >-
      Las RIB 330 y RIB 450 Patrol usan cascos de fibra de vidrio con V profundo
      y tubos de Hypalon para una resistencia total a la intemperie. Varias
      unidades pueden desplegarse con un rendimiento constante.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp

  - id: family-recreation
    title: 'Recreación familiar'
    desc: 'Botes neumáticos espaciosos para excursiones de un día, pesca y deportes acuáticos.'
    scenario: >-
      Una familia de cuatro quiere un barco estable para salidas de fin de
      semana en el lago, jornadas de pesca y remolcar una boya para los niños.
    solution: >-
      La AirDeck 360 tiene capacidad para hasta cinco personas gracias a su
      suelo de aire reforzado. Se infla en la orilla, se guarda en el coche y se
      desenvuelve bien tanto en lagos tranquilos como en aguas costeras
      protegidas.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp