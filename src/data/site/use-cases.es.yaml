cases:
  - id: beginner
    title: Remo para principiantes
    desc: Tablas inflables estables SUP para palistas principiantes.
    scenario: Una familia que visita un lago durante el fin de semana quiere probar el paddleboarding. Necesitan equipo estable, fácil de lanzar y con instrucciones de seguridad claras.
    solution: El SUP Explorer 11 proporciona estabilidad de cuerpo ancho para principiantes. El Life Vest Classic garantiza flotación certificada CE. El Oars & Pump Set infla la tabla en menos de 10 minutos.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Turismo y Exploración
    desc: Tablas inflables de larga distancia SUP para lagos, ríos y viajes costeros.
    scenario: Un entusiasta del aire libre planea un viaje de remo de una semana y necesita una tabla que se empaquete pequeña, se infle en el campamento y mantenga la dirección en aguas abiertas.
    solution: El Ocean Voyager Series se desliza eficientemente con un contorno de touring y mantiene el rumbo en viento y oleaje. Su construcción drop-stitch se infla a 15 PSI para una rigidez de tabla dura.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga y Fitness
    desc: Plataformas extragrandes y estables para yoga, ejercicio y relajación.
    scenario: Un practicante de yoga quiere un estudio flotante para sesiones matutinas sobre agua tranquila, con suficiente espacio en la cubierta para realizar cada postura.
    solution: El Flowing Lotus Series cuenta con una almohadilla de cubierta de longitud completa y una viga ancha para posturas sin tambaleo. También funciona como una plataforma estable para entrenamientos ligeros de fitness.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Recreación Familiar
    desc: Paquetes completos SUP para los días de lago de fin de semana y días festivos.
    scenario: 'Una familia de cuatro quiere tablas estables para salidas de fin de semana al lago y vacaciones en la playa: equipo que se pueda guardar en el coche y que se inflen en minutos.'
    solution: El Tropical Breeze Series es una tabla estable y versátil que toda la familia puede compartir, mientras que el Medusa Glow Series es más ligera y corta para niños. Ambas se pueden empacar en mochilas para facilitar el viaje.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
