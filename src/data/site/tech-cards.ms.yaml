cards:
  - badge: PVC
    title: Lapisan Gred Marin PVC
    description: Kain PVC berlapis pelbagai lapisan yang dinilai untuk persekitaran marin. Diuji bagi UV, rintangan haus, dan tusukan.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: DS
    title: Teras Drop-Stitch
    description: Ribuan benang dalaman menghubungkan lapisan atas dan bawah, mencipta struktur teguh bertekanan tinggi pada 12–15 PSI.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - badge: RR
    title: Tepi Rel Diperkuat
    description: Rel fusion-lapisan berganda melindungi daripada calar dermaga, pendaratan di pantai, dan hentakan sisi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
