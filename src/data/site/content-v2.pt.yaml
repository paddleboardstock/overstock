- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Manutenção de Infláveis SUP: Mantenha Sua Prancha Durando por Anos'
  description: A manutenção adequada de infláveis SUP amplia significativamente a vida útil da prancha. Dicas de limpeza, secagem, cuidado com a válvula, proteção UV e armazenamento sazonal para pranchas de stand up paddle drop-stitch.
  definition: A manutenção de infláveis SUP envolve limpeza após o uso, secagem adequada, inspeção das válvulas, proteção UV e armazenamento correto para prevenir delaminação, mofo, degradação do material e vazamentos de ar.
  tldr: Enxágue sua prancha com água doce após cada sessão em água salgada. Seque completamente antes de desinflar e guardar. Verifique a válvula quanto a detritos e lubrifique o anel de vedação anualmente. Armazene inflada (metade PSI) em um local fresco e escuro. Evite exposição prolongada a UV, que degrada PVC. Repare pequenos furos imediatamente com o kit de reparo incluído.
  problem: Após uma temporada, seu SUP inflável desenvolve vazamentos lentos, o tapete do convés descasca nas bordas e o PVC fica mais rígido. Negligenciar a manutenção básica causa envelhecimento prematuro que é totalmente evitável.
  explanation: PVC se degrada sob radiação UV. Cristais de sal da água do mar penetram em fissuras e válvulas, causando microvazamentos. A umidade aprisionada promove o crescimento de mofo que ataca os fios de drop-stitch. Anéis de vedação das válvulas ressecam e perdem sua selagem. Sujeira e areia entram no adesivo do acolchoamento do convés, causando descolamento nas bordas.
  solution: 'Após cada sessão: enxágue a prancha, as quilhas e a bomba com água limpa. Limpe o deck pad. Abra a válvula para drenar a água retida. Seque a prancha à sombra antes de desinflar. Mensalmente: inspecione a válvula e aplique lubrificante de silicone no anel de vedação. Sazonalmente: lave com água e sabão neutro, verifique se há furos.'
  recommendation: Siga o guia de cuidados Aquafarer incluído com sua prancha. Use o kit de reparo imediatamente em qualquer perfuração. Armazene a prancha em sua bolsa em uma área com temperatura controlada, longe da luz solar direta.
  faq:
    - q: Posso deixar meu inflável SUP inflado durante toda a temporada?
      a: Sim, mas guarde fora da luz solar direta e em metade do máximo PSI (8-10 PSI) para reduzir o estresse nas costuras. Infle totalmente apenas antes do uso.
    - q: Como eu limpo mofo do meu SUP?
      a: Misture sabão neutro com água morna e esfregue com uma escova macia. Para mofo resistente, use solução de vinagre branco diluído (1:4). Evite alvejante.
    - q: Preciso lubrificar a válvula?
      a: Sim, anualmente. Remova o núcleo da válvula, aplique graxa de silicone no anel de vedação e reinstale. Isso previne vazamentos de ar.
    - q: Como eu guardo meu SUP para o inverno?
      a: Limpe e seque completamente. Desinfle totalmente, enrole frouxamente (evite dobras apertadas) e armazene em local fresco, escuro e seco. Evite temperaturas de congelamento.
