- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Regras de Etiqueta no Surf (Como Não Ser a Pessoa Que Todos Evitam)
  description: A programação tem regras e ninguém as escreve. Aprenda sobre a prioridade na onda, por que cortar a vez vai fazer com que você leve bronca, como se desculpar e os erros de iniciante que irritam todo surfista local.
  definition: 'Etiqueta no surfe é um código de conduta não escrito que previne colisões e compartilha as ondas de forma justa. A regra principal: o surfista mais próximo do pico da onda tem a preferência.'
  tldr: O surfista mais próximo do topo da onda que está quebrando tem a prioridade. Não entre na onda de outra pessoa, não faça manobras para furar a vez de alguém (paddle ao redor de alguém para pegar a onda), e sempre peça desculpas se cometer um erro. Remar com cuidado ao redor da fila, segurar sua prancha e ser amigável — respeito gera respeito.
  problem: Você rema até uma área cheia de surfistas e imediatamente sente tensão. Os surfistas olham para você de lado, alguém grita com você, e você não tem certeza do que fez de errado. O lado social do surfe parece mais intimidante do que as próprias ondas.
  explanation: "A etiqueta do surfe existe para prevenir colisões e compartilhar as ondas de forma justa. A regra fundamental é a prioridade: o surfista mais próximo do pico (onde a onda quebra primeiro) tem prioridade. Quem estiver remando para a mesma onda de uma posição mais interna deve recuar. 'Snaking' — remar ao redor de outro surfista para roubar a prioridade — é considerado a pior infração. Além da prioridade, o lineup tem expectativas sobre barulho (mantenha os gritos ao mínimo), controle da prancha (nunca deixe sua prancha perto de outros) e amizade (um simples aceno já significa muito)."
  solution: Observe a linha por 10 minutos antes de entrar na água. Identifique quem está pegando mais ondas — esses são os surfistas a respeitar e evitar. Fique na parte interna (zona de espuma) se você estiver aprendendo. Remar por fora da linha, não através dela. Quando você pegar uma onda, olhe para os dois lados antes de se levantar e certifique-se de que ninguém está mais fundo.
  recommendation: Passe suas primeiras sessões em um pico amigável para iniciantes, com multidões espaçadas. Aprenda a ler a prioridade antes de tentar uma fila cheia. Se você entrar na onda de alguém, peça desculpas imediatamente e reme para longe — a maioria dos surfistas respeita um erro honesto.
  faq:
    - q: O que está aparecendo?
      a: Dropping in significa remar para e pegar uma onda que outro surfista já possui prioridade. É perigoso e desrespeitoso. O surfista mais próximo do pico é o dono da onda; qualquer outra pessoa deve sair.
    - q: O que é snaking?
      a: Snaking é remar ao redor de outro surfista que já está na posição para uma onda, de modo que você acabe mais próximo ao pico. É considerado uma etiqueta extremamente ruim e pode levar a confrontos.
    - q: Iniciantes podem surfar em ondas lotadas?
      a: Sim, mas fique na zona de água branca, longe do pico. Não reme para a área principal de saída até que você possa pegar ondas de forma consistente e controlar sua direção. Enfileiramentos lotados exigem experiência para serem navegados com segurança.
    - q: Como eu peço desculpas na água?
      a: Um simples aceno, sorriso e "foi mal" ou "desculpa" funciona. Reconheça o erro e rememore para longe da pessoa. Os surfistas geralmente perdoam erros honestos, especialmente se você estiver claramente aprendendo.
    - q: O que devo fazer se alguém aparecer de repente para me visitar?
      a: Se for uma entrada clara, grite "onda" ou "ei" para alertá-los. Se eles pegarem por acidente e pedirem desculpas, deixe para lá. Se alguém entrar repetidamente, reme até eles e explique educadamente a prioridade. Evite confrontos.
