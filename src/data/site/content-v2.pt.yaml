- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Auto-Resgate: Como Voltar para sua Prancha em Águas Profundas'
  description: Todo SUP remador deve dominar o auto-resgate. Técnicas passo a passo para remontar sua prancha em águas profundas, rebocá-la até a margem e lidar com nós na leash.
  definition: SUP auto-resgate é a técnica de voltar a subir no seu stand-up paddle em águas profundas após cair, incluindo recuperação da prancha, recolocação do corpo e recuperação do remo.
  tldr: 'Após cair: mantenha a calma, segure o remo, nade até a prancha. Coloque o remo atravessado sobre a prancha. Use um chute de golfinho para impulsionar o peito sobre a prancha. Levante uma perna, depois a outra. Ajoelhe primeiro, depois fique em pé. Pratique em água calma até que se torne memória muscular.'
  problem: Você cai do seu SUP em águas profundas e não consegue voltar. A prancha está escorregadia, você está cansado e entra em pânico. Sem conhecer a técnica de auto-resgate, uma queda simples se torna perigosa.
  explanation: 'O auto-resgate tem três etapas: recuperação (nadar até a prancha e remar), remontagem (voltar para a prancha) e continuação (retomar a remada). A técnica chave é usar o remo como estabilizador e usar chutes poderosos das pernas para impulsionar a parte superior do corpo sobre a prancha.'
  solution: 'Etapa 1: nade até a prancha. Segure o remo ou recupere-o. Etapa 2: coloque o remo perpendicularmente sobre a prancha. Chute vigorosamente com as pernas enquanto puxa o peito para o centro da prancha. Etapa 3: uma vez que o peito esteja sobre a prancha, balance as pernas para cima uma de cada vez. Etapa 4: ajoelhe-se, recupere o fôlego, depois levante-se gradualmente.'
  recommendation: Pratique o auto-resgate em condições controladas até conseguir fazer isso sem pensar. Use o Aquafarer SUP Explorer 11, que tem boa tração no convés. O Life Vest Pro oferece flutuação extra caso você tenha dificuldades.
  faq:
    - q: Como faço para voltar se estou exausto?
      a: Fique com a prancha para flutuação. Use os braços para puxar o peito sobre a prancha, mesmo que as pernas não consigam chutar efetivamente. Descanse na posição de joelhos antes de ficar em pé.
    - q: E se eu perder o remo?
      a: Use os braços para remar a prancha até a margem. Peça ajuda a outro remador. Substitua o remo perdido imediatamente.
    - q: Posso me resgatar sozinho em ondas?
      a: Sim — posicione a prancha perpendicular às ondas. Marque o tempo para remontar entre as ondas. O leash mantém a prancha por perto.
    - q: Como eu lido com um emaranhado de coleira?
      a: Mantenha a calma, flutue de costas, desembarace a corda lentamente. Se a corda estiver enrolada nas nadadeiras, você pode precisar remover as nadadeiras enquanto estiver na água.
