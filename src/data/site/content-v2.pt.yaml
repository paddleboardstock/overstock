- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP Fitness: Treino de Corpo Inteiro em uma Prancha de Stand Up Paddle'
  description: SUP oferece um treino de corpo inteiro combinando resistência cardiovascular, estabilidade do core e força. Como estruturar sessões de fitness SUP, melhores exercícios e como medir o progresso.
  definition: SUP fitness usa a plataforma instável de um stand-up paddle para engajar os estabilizadores do core, os músculos das pernas e a parte superior do corpo através de remadas, equilíbrio e exercícios na prancha.
  tldr: SUP queima 400-700 calorias por hora. Uma sessão de SUP de uma hora envolve core, pernas, costas, ombros e braços. Paddling intervalado (sprints + recuperação) maximiza o cardio. Posições de yoga na prancha desenvolvem equilíbrio e flexibilidade. Adicione movimentos de força específicos de SUP como agachamentos e avanços na prancha.
  problem: Os treinos na academia se tornaram entediantes e você quer uma atividade ao ar livre que desenvolva o condicionamento físico enquanto é divertida. SUP combina aventura com um verdadeiro condicionamento físico de corpo inteiro.
  explanation: Remar envolve o latíssimo do dorso, deltoides, trapézio e os músculos do core para a rotação. Ficar de pé em uma plataforma em movimento força os músculos estabilizadores dos tornozelos, joelhos e quadris a trabalhar constantemente. As demandas cardiovasculares do remo contínuo em intensidade moderada fornecem condicionamento aeróbico.
  solution: 'Estruture as sessões: 5 min de remada de aquecimento, 20 min de remada em estado constante em ritmo moderado, 15 min de remada intervalada (30 seg de sprint, 60 seg fácil), 10 min de exercícios na prancha (agachamentos, avanços, flexões), 5 min de alongamento para desaquecimento.'
  recommendation: Use o Aquafarer SUP Explorer 11 para remar fitness. A plataforma estável permite que você se concentre na técnica e na intensidade. Use o Colete Salva-Vidas Pro para segurança durante sessões de alta intensidade.
  faq:
    - q: Quantas calorias SUP queima?
      a: 400-700 calorias por hora dependendo da intensidade, do vento e da corrente. Remar em intervalos aumenta a queima de calorias.
    - q: SUP é bom para perda de peso?
      a: Sim, combinado com uma nutrição adequada. O envolvimento de todo o corpo e a natureza de baixo impacto tornam-no sustentável para exercícios regulares.
    - q: Posso fazer treino de força em um SUP?
      a: Sim — agachamentos, avanços, flexões e pranchas na prancha adicionam desafio de equilíbrio aos exercícios de força.
    - q: Quais músculos SUP trabalha?
      a: 'Primário: core (oblíquos, transverso do abdômen), costas (dorsais, trapézio), ombros (deltóides), braços (bíceps, tríceps). Secundário: pernas (quadríceps, isquiotibiais, panturrilhas).'
