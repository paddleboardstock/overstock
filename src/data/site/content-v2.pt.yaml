- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hidratação e Proteção Solar: Mantenha-se Seguro na Água'
  description: Estratégias essenciais de hidratação e proteção solar para remadores de SUP. Desidratação e queimaduras solares são os problemas mais comuns de SUP — como prevenir ambos durante longas sessões.
  definition: SUP hidratação significa manter o equilíbrio de fluidos durante o remo através da ingestão regular de água. Proteção solar envolve aplicação de FPS, roupas de proteção e programação das sessões para evitar o pico de UV.
  tldr: Beba 500ml de água por hora de remo. Traga mais do que você acha que precisa — uma bolsa de água de 2L ou várias garrafas. Aplique protetor solar à prova d'água FPS 50+ antes de remar e reaplique a cada 2 horas. Use chapéu, óculos de sol com cordão e roupas com classificação UPF. Evite remar das 11h às 15h, quando UV está mais forte.
  problem: Você está tendo uma ótima sessão de SUP, mas depois de uma hora você sente dor de cabeça, boca seca e sua pele está queimando. A desidratação e a queimadura de sol aparecem de repente porque a água mantém você fresco.
  explanation: O reflexo na água intensifica a exposição a UV em até 40%. O efeito refrescante da água e da brisa mascara a queimadura solar até que seja tarde demais. O suor causado pelo remo aumenta a perda de líquidos, e muitas vezes não há onde reabastecer água na água. A desidratação prejudica o equilíbrio e a tomada de decisões, aumentando o risco de acidentes.
  solution: Prenda uma garrafa de água ou bolsa de hidratação ao sistema de elástico do prancha. Beba a cada 15 minutos, esteja com sede ou não. Aplique protetor solar FPS 50+ 30 minutos antes de entrar na água. Use um chapéu de aba larga, óculos de sol polarizados com tiras e uma camiseta de proteção UPF 50+. Reaplique o protetor solar a cada 2 horas.
  recommendation: Use uma bolsa de hidratação presa aos D-rings frontais do seu Aquafarer SUP. Use uma camiseta de proteção solar UPF 50+ sob o seu PFD. Use um protetor solar à prova d'água que permaneça na pele com suor e água.
  faq:
    - q: Quanto de água eu devo levar em uma viagem SUP?
      a: Mínimo de 1 litro por hora. Para uma sessão de 2 horas, leve 2 litros. Mais em clima quente. Um reservatório de hidratação funciona melhor.
    - q: Qual tipo de protetor solar é melhor para SUP?
      a: Resistente à água, FPS 50+ de amplo espectro. Protetores solares minerais (óxido de zinco, dióxido de titânio) são seguros para recifes e duram mais.
    - q: A água realmente reflete UV?
      a: Sim — a água reflete até 40% da radiação UV, o que significa que você recebe UV de cima e de baixo. Isso aumenta significativamente o risco de queimaduras.
    - q: Posso me queimar de sol usando uma camiseta de proteção UV?
      a: Rash guards padrão oferecem proteção mínima UV (cerca de UPF 10-20). Procure roupas com classificação UPF 50+ para proteção total.
