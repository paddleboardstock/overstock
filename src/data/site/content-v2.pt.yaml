- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: Wetsuit 3mm vs 5mm (O que Realmente Funciona no Surfe em Água Fria)
  description: A decisão entre roupa de neoprene de 3mm ou 5mm depende da temperatura da água, não da temperatura do ar. Gráfico de temperatura, comparação de flexibilidade e qual espessura mantém você aquecido sem restringir seu remo.
  definition: Uma roupa de neoprene de 3 mm é adequada para água de 14-20°C com boa flexibilidade. Uma roupa de 5 mm cobre 8-14°C com máximo aquecimento, mas mobilidade reduzida. A escolha é um compromisso direto entre aquecimento e amplitude de movimento.
  tldr: Fatos de neoprene de 3mm são para água entre 14-20°C e oferecem máxima flexibilidade. Fatos de 5mm são para 8-14°C e priorizam o aquecimento. Escolha com base na temperatura da água local, não na temperatura do ar. Se você surfa em várias estações, tenha ambos. Se você só puder comprar um, um 4/3mm oferece o melhor meio-termo.
  problem: Você precisa de uma roupa de mergulho, mas não consegue decidir entre uma de 3mm e uma de 5mm. Uma de 3mm pode não ser quente o suficiente no inverno, e uma de 5mm pode ser muito grossa e restritiva para dias mais quentes. Errar no palpite significa ou congelar durante o inverno ou suar durante o outono.
  explanation: 'A espessura do neoprene está diretamente relacionada ao calor e inversamente relacionada à flexibilidade. Uma roupa de 3 mm (frequentemente 3/2 mm com braços mais finos) oferece boa mobilidade para remar e surfar em condições amenas. Uma roupa de 5 mm usa neoprene mais grosso no tronco e frequentemente painéis mais finos nos braços e pernas (5/4/3 mm) para manter certa flexibilidade. A diferença de calor é de cerca de 6-8°C. Principais diferenças: roupas de 5 mm usam mais material de neoprene, pesam aproximadamente 40% a mais, demoram mais para secar e exigem mais esforço para tirar. Os neoprenes super-stretch modernos estão diminuindo a diferença de flexibilidade, mas 5 mm ainda restringe o movimento de forma notável.'
  solution: Determine a temperatura média da água mais fria do seu mês usando dados locais de boias. Se estiver acima de 16°C, compre uma 3/2mm. Se estiver entre 12-16°C, compre uma 4/3mm. Se estiver abaixo de 12°C, compre uma 5/4/3mm. Para surfar durante o ano todo com apenas uma roupa, uma 4/3mm de qualidade com forro térmico, além de um capuz, botas e luvas separados, cobre a maior variedade de temperaturas.
  recommendation: O Aquafarer Wetsuit Pro em 5/4/3mm lida com 8-16°C com forro térmico para compensar a diferença de calor de um verdadeiro 5mm. Se você surfa principalmente em condições amenas (16-20°C), o Aquafarer Wetsuit Pro 3/2mm oferece melhor flexibilidade e conforto.
  faq:
    - q: Posso usar uma roupa de 3mm em água a 10°C?
      a: Somente para sessões muito curtas (20-30 minutos) e com uma camiseta térmica por baixo. Você ficará com frio durante a maior parte da sessão. Uma roupa de 5mm ou 5/4/3mm é fortemente recomendada para água a 10°C.
    - q: Uma roupa de mergulho de 5mm é quente demais para o verão?
      a: Se a temperatura da água no verão exceder 18°C, uma roupa de 5mm causará superaquecimento. Você pode enxaguar a roupa com água fria, mas ficará mais confortável com uma roupa de 3/2mm ou roupa de primavera durante os meses de verão.
    - q: Uma roupa de mergulho de 5mm restringe a remada?
      a: Sim, perceptivelmente. O neoprene mais grosso nos ombros exige mais esforço a cada remada. Um traje 5/4/3mm com braços mais finos ajuda, mas você ainda se cansará mais rápido do que em um traje 3mm.
    - q: Qual é a melhor roupa de mergulho para surfe durante o ano todo?
      a: Um traje completo 4/3mm com zíper frontal e forro térmico cobre 12-18°C, o que é o ano todo em muitos climas temperados. Adicione botas para o inverno e você pode surfar em 10-18°C com um traje.
