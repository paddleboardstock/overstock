- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Guia de Tamanhos: Comprimento, Largura e Volume Explicados'
  description: Encontre o tamanho SUP certo com base no seu peso, nível de habilidade e estilo de remada. O comprimento determina a capacidade de seguir em linha reta, a largura determina a estabilidade e o volume determina a capacidade de peso.
  definition: O tamanho de SUP é definido pelo comprimento (velocidade e deslize), largura (estabilidade primária), espessura (estabilidade secundária e volume) e volume em litros (capacidade total de peso).
  tldr: 'All-around SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Surf: 8''-10'' x 30"-32" (140-220L). Iniciantes precisam de largura acima de 32" e volume superior ao peso corporal em 60-80L. Seu peso em kg mais 60L é o volume mínimo recomendado para estabilidade.'
  problem: Cada marca SUP lista pranchas em pés, polegadas e litros, mas sem saber como essas medidas se traduzem para a sensação no mundo real, você corre o risco de comprar uma prancha que é instável, lenta ou que não suporta seu peso.
  explanation: 'O comprimento determina quão rápido a prancha rema e quão bem ela mantém uma linha reta. Pranchas mais longas (12''+) deslizam entre as remadas e mantêm a linha. Pranchas mais curtas (menos de 10'') viram com facilidade, mas exigem trocas de remo mais frequentes. A largura determina a estabilidade primária — estabilidade em pé. Uma prancha de 30" parece instável para iniciantes; 34" se sente como um cais. A espessura determina o volume — uma prancha mais grossa flutua mais alto, mas pega mais vento. O volume em litros é a melhor métrica: a prancha carregada (você mais os equipamentos) deve submergir de 5 a 10 cm em repouso.'
  solution: 'Combine as dimensões da sua prancha com três fatores: seu peso (determina o volume mínimo), sua atividade principal (determina o comprimento) e seu nível de habilidade (determina a largura). Para iniciantes, multiplique o peso em kg por 2,2 para obter os litros mínimos. Para intermediários, multiplique por 1,8. Para avançados, multiplique por 1,4.'
  recommendation: O Aquafarer SUP Explorer 11 com 11' x 33'' x 6'' e 260L é adequado para a maioria dos remadores de até 100 kg para remadas gerais. Faça upgrade para o SUP Tour 12 com 12' x 31'' para melhor velocidade e deslizamento em passeios.
  faq:
    - q: Qual tamanho SUP eu preciso para o meu peso?
      a: 'Para ciclistas com menos de 70 kg: 10-11'' x 32" (220-260L). Para 70-90 kg: 11-12'' x 33" (260-300L). Para 90-110 kg: 11-12'' x 34" (300-350L). Para mais de 110 kg: 12'' x 34-36" (350L+).'
    - q: Um SUP mais longo é mais rápido?
      a: Sim. Pranchas mais longas têm uma melhor proporção de comprimento para largura, reduzindo a resistência. Uma prancha de turismo de 14' SUP é significativamente mais rápida do que uma prancha de 11' para uso geral com o mesmo esforço de remada.
    - q: Qual SUP largura é estável para iniciantes?
      a: 33-34 polegadas é o ponto ideal para iniciantes de até 90 kg. Abaixo de 32" requer bom equilíbrio. Acima de 34" é muito estável, mas mais lenta e mais difícil de remar com vento.
    - q: Posso usar uma prancha versátil para passeios?
      a: Sim, para passeios curtos abaixo de 10 km. Para distâncias maiores, uma prancha de turismo dedicada tem melhor rastreamento e cobre a distância de forma mais eficiente.
