  title: Tipos de Pranchas de Surf Explicados (Qual é a Certa para Você?)
  description: Shortboard, longboard, fish, hybrid, espuma — já está confuso? Aqui está cada tipo de prancha de surf explicado por quem ela é indicada, quais ondas ela precisa e qual você deve comprar primeiro.
  definition: Os principais tipos de prancha de surf são longboards (9 pés, estáveis, fáceis), shortboards (5-7 pés, responsivas, avançadas), de espuma/infláveis (alto volume, seguras para iniciantes) e híbridas (7-9 pés, versáteis, intermediárias). Cada uma se adapta a diferentes níveis de habilidade e condições das ondas.
  tldr: Os quatro principais tipos de pranchas de surf são shortboards (desempenho, baixo volume), longboards (estáveis, suaves), de espuma/infláveis (amigáveis para iniciantes, alto volume) e híbridas ou funboards (versatilidade de comprimento médio). Cada tipo se adequa a um nível de habilidade e estilo de surf diferentes. Escolha sua prancha com base em onde você está na sua curva de aprendizado e no tipo de surfe que você mais gosta.
  problem: 'Os nomes das pranchas de surf são confusos: mini-mal, egg, fish, gun, hybrid, retro twin — a lista continua. Você quer saber qual tipo de prancha combina com seu nível de habilidade e as ondas locais sem precisar comprar cinco pranchas diferentes para descobrir.'
  explanation: Os longboards têm 9 pés ou mais, são grossos, com nariz arredondado — pegam ondas cedo e remam sem esforço. Os shortboards têm 5 a 7 pés, com nariz pontudo e rocker agressivo — exigem remada forte e técnica precisa, mas oferecem desempenho máximo. Pranchas de espuma e infláveis imitam os formatos dos longboards em modelos de alto volume, mas são mais macias e seguras. As híbridas (funboards, eggs) ficam entre 7 e 9 pés e combinam facilidade de remada com capacidade de manobra. As fish boards são curtas e largas, com rabeta em formato de andorinha, feitas para ondas menores.
  solution: Identifique seu tipo de onda local — praias com ondas mais lentas combinam com longboards e híbridos; recifes ou point breaks mais inclinados funcionam com shortboards. Combine a prancha com a onda, não com o que parece legal. Iniciantes devem optar por um formato de longboard com alto volume, depois explorar formatos mais curtos à medida que sua habilidade se desenvolve.
  recommendation: Para a maioria dos surfistas, uma prancha híbrida ou funboard de cerca de 7'6" a 8'6" é o conjunto de pranchas único ideal. A Aquafarer Surfboard Pro de 10'6" é mais longa, mas oferece a estabilidade de uma longboard com a portabilidade de uma inflável. Use-a como sua prancha principal no primeiro ano.
  faq:
    - q: Qual é a prancha de surf mais fácil de surfar?
      a: Um longboard (9 pés+) ou um inflável de alto volume como o Aquafarer Surfboard Pro. Essas pranchas pegam ondas cedo e fornecem uma plataforma estável para aprender pop-ups e deslocamento de peso.
    - q: Quando devo trocar de um longboard para um shortboard?
      a: Depois que você conseguir pegar ondas verdes de forma consistente, fazer curvas de base e cortar ao longo da face da onda no seu longboard. Apressar a troca é o erro mais comum — espere passar de 6 a 12 meses em um longboard.
    - q: Para que serve uma prancha de surf fish?
      a: Pranchas de peixe são projetadas para ondas pequenas e moles. Seu comprimento curto e contorno largo geram velocidade onde uma shortboard típica pararia. Elas são uma ótima segunda prancha para surfistas intermediários.
    - q: Pranchas de surf infláveis são boas?
      a: Infláveis modernos com construção drop-stitch competem com longboards de espuma em rigidez e desempenho. Eles são ideais para iniciantes e viajantes porque podem ser embalados em uma mochila e são quase indestrutíveis.
