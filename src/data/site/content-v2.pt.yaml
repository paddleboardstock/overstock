- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Guia de âncora: Fique no lugar enquanto pesca ou fotografa'
  description: Guia completo para ancoragem SUP — tipos de âncoras (cogumelo, dobrável, estaca), configuração de roldana de âncora, técnicas de implantação e considerações de segurança para permanecer na posição.
  definition: Uma âncora SUP é um peso preso a uma corda que mantém a prancha na posição contra o vento e a corrente. Tipos comuns incluem âncoras de cogumelo, âncoras dobráveis e estacas de amarração.
  tldr: Use uma âncora tipo cogumelo (1,5-3 lb) para fundos lamacentos ou arenosos, uma âncora dobrável para fundos rochosos, ou uma estaca para águas rasas com fundos macios. A âncora deve ter 1,5-3 lb em condições calmas, 3-5 lb para vento e corrente. Sempre use um trilho de âncora para ajustar a posição e saiba quando liberar.
  problem: Você encontra o local de pesca perfeito, mas o vento e a corrente desviam você da posição a cada poucos minutos. Sem ancorar, SUP pescar e fotografar são exercícios frustrantes de reposicionamento constante.
  explanation: Uma âncora funciona arrastando-se pelo fundo até prender. Âncoras tipo cogumelo enterram-se em fundos macios e fornecem boa retenção em areia e lama. Âncoras dobráveis têm braços que se enterram em fundos duros ou rochosos. Estacas de fundeio funcionam em águas rasas ao serem empurradas diretamente para o fundo.
  solution: Instale um sistema de carrinho de âncora (uma linha com um anel deslizante em um lado da prancha) para ajustar o ponto de fixação da âncora. Prenda 15 a 23 metros de corda à âncora. Lance a favor do vento ou contra a corrente da posição desejada. Use um sistema de liberação rápida para desengatar em emergências. Nunca ancora em correnteza forte ou onde você não possa recuperar a âncora facilmente.
  recommendation: Uma âncora dobrável de 3 lb com 50' de corda funciona para a maioria das condições de pesca SUP. Adicione um sistema de roldanas para âncoras usando os anéis em D do seu Aquafarer SUP Explorer 11.
  faq:
    - q: De que tamanho de âncora eu preciso para SUP?
      a: 1,5-3 lb para lagos calmos e rios lentos. 3-5 lb para áreas costeiras com vento ou corrente. Âncoras grandes demais são difíceis de recuperar.
    - q: Quanto de cabo de âncora eu preciso?
      a: Um alcance de 5:1 (5 pés de linha para cada 1 pé de profundidade) é padrão. Em 10 pés de água, use 50 pés de linha.
    - q: Ancorar é perigoso em um SUP?
      a: Apenas se você ancorar em correntes ou ventos fortes o suficiente para virar a prancha. Sempre use um sistema de liberação rápida que possa ser desprendido instantaneamente.
    - q: Posso ancorar em qualquer água?
      a: Verifique as regulamentações locais. Algumas áreas restringem a ancoragem para proteger ervas marinhas ou habitats marinhos. Nunca ancore em recifes de coral.
