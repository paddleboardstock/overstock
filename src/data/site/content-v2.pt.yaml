  title: O Que Vestir para Surfar (Não Apareça de Bermuda de Praia Quando Você Precisa de uma 5/4)
  description: Pare de adivinhar o que vestir. A temperatura da água, e não a do ar, determina sua roupa de surf. Guia completo de camadas, desde rash guards tropicais até conjuntos completos de inverno 5/4/3mm.
  definition: A roupa de surf varia de bermudas de surf e camisetas de neoprene em água quente a wetsuits inteiros de 5/4/3mm com botas e capuzes em água fria. A temperatura da água, e não a do ar, determina o que você precisa.
  tldr: O que você veste para surfar depende inteiramente da temperatura da água — não da temperatura do ar. Camisetas de lycra e bermudas de surf funcionam acima de 22°C, wetsuits de primavera cobrem 18-22°C, wetsuits completos 3/2mm lidam com 14-18°C, e 5/4/3mm com botas são necessários abaixo de 14°C. Sempre use proteção UV e considere uma leash e um colete salva-vidas.
  problem: Você chega à praia e não faz ideia se um rash guard é suficiente ou se precisa de um traje de mergulho completo. A temperatura do ar está quente, mas a água está fria, ou a água parece estar boa, mas o vento está congelante. Vestir-se errado significa uma sessão arruinada.
  explanation: 'O traje de surf serve a três propósitos: isolamento térmico, proteção UV e prevenção de abrasão. Os trajes de mergulho de neoprene são classificados por espessura e cobertura — os trajes de primavera (braços ou pernas curtos) são para dias intermediários, enquanto os trajes completos são para água fria. Camisas de proteção contra atrito protegem contra assaduras da prancha e sol, mas não oferecem valor térmico. Botas, luvas e toucas não são acessórios, mas equipamentos essenciais para surfar em água fria abaixo de 12°C.'
  solution: 'Verifique a boia local ou o relatório de temperatura da água ao vivo antes de sair. Monte um kit com base na sua condição típica mais fria: camisa de lycra e shorts para o verão, uma roupa completa 3/2mm para primavera e outono, uma 5/4/3mm com botas e capuz para o inverno. Sempre adicione uma leash e considere um colete salva-vidas para segurança.'
  recommendation: Invista primeiro em uma boa roupa de mergulho completa 3/2mm — ela cobre a maior variedade de condições. Adicione uma roupa 5/4/3mm e botas se você planeja surfar durante o inverno. A Aquafarer Wetsuit Pro com forro térmico cobre efetivamente ambas as faixas de temperatura.
  faq:
    - q: Posso surfar apenas de bermuda de praia?
      a: Sim, em águas tropicais acima de 24°C. Você pode querer uma lycra para prevenir assaduras no peito e nos braços devido à remada. Cera ou uma almofada de tração na prancha ajuda a compensar a falta de aderência do traje.
    - q: Eu preciso de botas de surf?
      a: Se a temperatura da água cair abaixo de 14°C, botas evitam a dormência e protegem seus pés de cortes em pedras e recifes. Elas também aumentam a tração na prancha. A maioria dos surfistas em climas frios usa botas de novembro a março.
    - q: O que é um terno de primavera?
      a: Um traje de primavera é uma roupa de neoprene de braços curtos ou pernas curtas (ou ambos) projetada para águas entre 18°C e 22°C. Ele oferece mais calor do que uma camisa de proteção contra assaduras, mas menos cobertura do que um traje completo.
    - q: Devo usar um colete salva-vidas enquanto surfo?
      a: Não coletes salva-vidas tradicionais, mas um colete de impacto ou auxílio à flutuação pode ajudar em condições difíceis ou se você for um nadador fraco. Aquafarer coletes salva-vidas são projetados para SUP e caiaque, mas podem fornecer confiança extra de flutuação para iniciantes no surfe.
