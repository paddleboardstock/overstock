- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP com Seu Cão: Um Guia Completo de Como Fazer'
  description: Stand up paddle com seu cachorro — preparação, segurança, passos de treinamento, recomendações de equipamentos e dicas para uma experiência divertida para ambos.
  definition: SUP com cachorro envolve treinar seu companheiro canino para equilibrar-se em uma prancha de stand up paddle, equipá-lo com um PFD para cães e remar com segurança juntos.
  tldr: Comece com uma SUP larga e estável (34"+). Consiga para o seu cachorro um colete salva-vidas bem ajustado com uma alça. Apresente a prancha primeiro em terra, depois em água rasa. Comece com sessões curtas e reforço positivo. Sempre leve água para o seu cachorro. Observe sinais de estresse ou cansaço.
  problem: Seu cachorro adora água, mas você não tem certeza de como apresentá-lo ao SUP com segurança. Sem o treinamento adequado, um cachorro pode entrar em pânico, pular ou arranhar a prancha.
  explanation: 'Cães têm habilidade natural para nadar, mas precisam aprender que a prancha é uma plataforma segura. A chave é a dessensibilização gradual: apresente a prancha em terreno firme, recompense o comportamento calmo, depois passe para água rasa e, finalmente, para água mais profunda.'
  solution: 'Comece na terra: deixe o cachorro cheirar e caminhar sobre a prancha (na grama). Recompense o comportamento calmo. Em seguida: coloque a prancha em água bem rasa, apoie-a, deixe o cachorro ficar em cima. Recompense. Depois: você sobe na prancha em água rasa, faça o cachorro se juntar. Finalmente: reme devagar em água calma.'
  recommendation: Use o Aquafarer SUP Explorer 11 por sua plataforma estável de 33". Adicione um PFD para o cão (colete salva-vidas). Traga água fresca e uma tigela. Comece com sessões de 10 minutos e aumente gradualmente.
  faq:
    - q: Qual tamanho de SUP eu preciso para o meu cachorro?
      a: Uma prancha de 33-34" de largura oferece estabilidade para cães médios a grandes. Cães pequenos (menos de 10 kg) podem se virar em pranchas de 32"+.
    - q: Meu cachorro precisa de um colete salva-vidas?
      a: Sim — mesmo nadadores fortes precisam de um cachorro PFD com alça para fácil recuperação em emergências.
    - q: Como eu protejo a placa das garras?
      a: Mantenha as unhas do cachorro aparadas. Use um protetor de tapete ou toalha. Os cães geralmente se ajustam e param de arranhar uma vez que estão confortáveis.
    - q: Qualquer cachorro pode aprender SUP?
      a: A maioria dos cães pode aprender com paciência. Cães ansiosos podem demorar mais. Nunca force um cão assustado a subir na prancha — isso cria associações negativas.
