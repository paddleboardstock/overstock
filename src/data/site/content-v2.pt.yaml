    - q: Quão mais rápida é a bomba de câmara dupla?
      a: Cerca de duas vezes mais rápido do que uma bomba de câmara única. Um SUP infla em 2-3 minutos contra 5-8 minutos.
    - q: O manômetro está preciso?
      a: Sim, o medidor está calibrado e lê com precisão dentro de 1 PSI ao longo da faixa típica de operação.
    - q: Os remos podem ser usados com a série AirDeck?
      a: Sim, os remos incluem cadeados ajustáveis compatíveis com barcos das séries AirDeck e RIB.
    - q: De que material são feitos os remos?
      a: Eixos de alumínio de grau aeronáutico com lâminas de polipropileno reforçado. Eles pesam aproximadamente 1,5 kg por par.
