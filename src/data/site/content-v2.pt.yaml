- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Manutenção de Barcos Infláveis: Preserve Seu Investimento'
  description: Lista de verificação anual de manutenção de barcos infláveis. Limpeza, proteção UV, inspeção das costuras, gerenciamento de pressão, cuidados com o motor e preparação para o inverno para barcos PVC e Hypalon.
  definition: A manutenção de barcos infláveis compreende limpeza, proteção UV, gerenciamento de pressão, inspeção de costuras e válvulas, prevenção de mofo e armazenamento adequado fora da temporada.
  tldr: Enxágue após cada uso em água salgada. Aplique UV protetor a cada 2-3 meses. Verifique a pressão de inflação antes de cada passeio. Inspecione costuras, válvulas e popa mensalmente. Limpe com sabão suave. Armazene desinflado em um local fresco e seco fora da temporada.
  problem: Você usou seu barco inflável por uma temporada e agora os tubos parecem desbotados, uma costura está vazando e o espelho de popa está esponjoso — tudo isso pode ser evitado com manutenção de rotina.
  explanation: UV a radiação degrada a matriz polimérica. A água salgada cristaliza nas dobras e desgasta o tecido. O mofo cresce na umidade aprisionada. Pressão incorreta causa fadiga no material. A popa (especialmente o compensado) absorve água através dos furos dos parafusos.
  solution: 'Após cada uso: enxágue com água limpa, seque, verifique a pressão. Mensalmente: limpe os tubos com protetor UV, inspecione as costuras, verifique a válvula. Anualmente: limpeza profunda, inspecione o convés para apodrecimento, lubrifique as válvulas, teste por microvazamentos.'
  recommendation: Use o Protetor Aeroespacial 303 nas boias do barco Aquafarer. Remova as válvulas e aplique graxa de silicone anualmente. Armazene na bolsa de transporte com um pacote dessecante.
  faq:
    - q: Posso usar água sanitária para limpar meu barco inflável?
      a: Não — a água sanitária danifica o revestimento do tecido. Use sabonete suave e água morna. Para mofo, use vinagre branco diluído.
    - q: Com que frequência devo aplicar o protetor UV?
      a: A cada 2-3 meses durante a temporada de uso. Mais frequentemente em climas tropicais.
    - q: Preciso desinflar meu barco entre os usos?
      a: Não se usado semanalmente. Deixe inflado com uma capa UV. Para intervalos mensais, esvazie e guarde.
    - q: Como faço para manter a popa?
      a: Verifique os parafusos mensalmente. Selle as bordas da madeira exposta com verniz marítimo anualmente. Substitua se surgirem pontos moles.
