- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'SUP Guia de Coleiras: Coleiras Retas vs Enroladas Explicadas'
  description: Guia completo sobre SUP guias — retas vs enroladas, tornozelo vs panturrilha, opções de liberação rápida e como escolher a guia certa para suas condições de remada.
  definition: Uma coleira SUP é uma corda que prende o remador à prancha, evitando a separação. Os tipos incluem coleiras retas (para surfe e rios) e coleiras enroladas (para águas calmas).
  tldr: Coleiras enroladas são melhores para águas planas e remo de condicionamento físico — elas permanecem fora da prancha e da água. Coleiras retas são para surfe SUP e rios — elas proporcionam mais liberdade e não enroscam. A fixação na panturrilha é preferida à do tornozelo por conforto. Coleiras de liberação rápida são importantes para remar em rios para prevenir aprisionamentos.
  problem: Você comprou uma coleira com seu SUP, mas não tem certeza se é o tipo certo para o seu estilo de remo. A coleira errada vai arrastar, prender ou falhar quando você mais precisar.
  explanation: Coleiras retas são cordas simples de náilon ou poliuretano que ficam atrás da prancha. Elas funcionam bem no surfe porque não enroscam nas quilhas. Coleiras em espiral são cordas em espiral que se contraem quando não estão sob tensão — elas permanecem enroladas no deck enquanto você rema e se estendem quando você cai. Elas mantêm a coleira fora da água em condições de mar calmo, reduzindo o arrasto.
  solution: Escolha coleira enrolada para água calma, condicionamento físico e passeios SUP. O arrasto reduzido ajuda a manter a velocidade e previne que a coleira prenda em objetos submersos. Escolha coleira reta para surf SUP e remadas em rios. O design reto tem menos chances de enroscar em nadadeiras ou obstáculos.
  recommendation: Aquafarer SUP pacotes incluem o tipo de leash apropriado para o uso pretendido da prancha. O leash enrolado no pacote SUP Explorer 11 é excelente para remar de forma geral.
  faq:
    - q: A coleira deve ser presa ao meu tornozelo ou à panturrilha?
      a: A fixação na panturrilha é preferida para SUP — ela mantém a coleira fora da água ao remar e reduz o risco de tropeço ao caminhar.
    - q: Qual deve ser o comprimento de uma coleira SUP?
      a: 8-10' para água plana, 6-8' para surf. Leashes mais curtos reduzem o arrasto, mas limitam a liberdade de movimento na prancha.
    - q: Eu preciso de uma guia de liberação rápida para rios?
      a: Sim — rio SUP requer uma guia ou cinto de liberação rápida que possa ser destacada instantaneamente para evitar aprisionamento em peneiras.
    - q: Posso usar uma coleira de surf para SUP?
      a: As cordas de segurança para surf são mais curtas e finas. Elas funcionam para SUP surf, mas não são ideais para remar em águas calmas, onde uma corda enrolada mais longa é melhor.
