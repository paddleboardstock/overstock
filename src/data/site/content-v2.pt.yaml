  title: Guia de Tamanhos de Prancha de Surfe (O Volume é o que Realmente Importa)
  description: Pare de adivinhar os tamanhos das pranchas de surf. O volume em litros determina tudo — com que facilidade você pega ondas, quão estável você se sente e quão rápido você progride. Encontre seus litros alvo em 2 minutos.
  definition: O tamanho da prancha de surf é principalmente sobre volume (litros), não comprimento. O volume determina a flutuabilidade e a capacidade de pegar ondas. Pranchas mais longas remam mais rápido; pranchas mais largas são mais estáveis; pranchas mais grossas oferecem mais volume sem aumentar o comprimento.
  tldr: 'O tamanho da prancha de surf está mais relacionado ao volume, não apenas ao comprimento. Iniciantes precisam de 60-80 litros, intermediários 35-55 litros e surfistas avançados 20-35 litros. Use seu peso como o fator principal: a cada 10 kg são necessários aproximadamente 10-12 litros de volume no nível iniciante.'
  problem: De pé em frente a um suporte de pranchas de surf com números como 7'2" x 22" x 3" impressos no rail, você não faz ideia de como essas medidas se sentem na água. Comprar baseado na aparência ou no que um amigo surfa leva a uma prancha que é ou instável demais ou difícil demais de remar.
  explanation: 'O tamanho de uma prancha de surf é melhor compreendido por meio de três dimensões: comprimento (poder de remada e captura da onda), largura (estabilidade) e espessura (volume e flutuação). O número real que importa é o volume em litros. Pranchas de espuma e infláveis alcançam alto volume por meio da largura e da espessura, em vez de comprimento excessivo, tornando-as manejáveis para iniciantes. Conforme você melhora, reduz o volume para permitir que a prancha afunde mais na face da onda e faça curvas com mais responsividade.'
  solution: 'Use um calculador de volume-peso: para iniciantes, divida seu peso em kg por 1,5 para obter os litros alvo. Para intermediários, divida por 2. Intermediários devem procurar pranchas com rocker moderado e cauda squash ou redonda para versatilidade.'
  recommendation: O Aquafarer Surfboard Pro oferece 75 litros de volume em um pacote de 10'6" — ideal para iniciantes de até 90 kg. Cavaleiros mais leves podem escolher o SUP Tour 12 para uma sensação mais manobrável à medida que progridem.
  faq:
    - q: A altura importa para o tamanho da prancha de surf?
      a: A altura importa menos que o peso. Um surfista alto e leve precisa de menos volume do que um surfista baixo e pesado da mesma altura. Use o peso como seu principal parâmetro e ajuste de acordo com a forma física e a força de remada.
    - q: O que acontece se minha placa tiver volume demais?
      a: Volume excessivo faz a prancha parecer esponjosa e instável na face da onda. Você terá dificuldade em afundar a borda para curvas e pode quicar na água durante as curvas de base.
    - q: O que acontece se minha placa tiver pouco volume?
      a: Você terá dificuldade para remar contra as ondas, afundará muito na hora da decolagem e se sentirá instável apenas sentado na prancha esperando. Iniciantes quase sempre precisam de mais volume do que pensam.
    - q: Como eu sei quando devo escolher um tamanho menor?
      a: Quando você consegue pegar ondas consistentemente, levantar-se suavemente e fazer curvas básicas na sua prancha atual, é hora de reduzir 5-10 litros. Diminuir o tamanho muito cedo atrasa seu progresso.
