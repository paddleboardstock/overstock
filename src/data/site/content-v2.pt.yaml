- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Cuidados com a Roupa de Mergulho: Faça seu Neoprene Durar 2x Mais'
  description: O cuidado adequado com a roupa de mergulho prolonga sua vida de 1 temporada para 3+. Dicas de enxágue, secagem, armazenamento e reparo para roupas de neoprene. Evite erros comuns que destroem as roupas de mergulho prematuramente.
  definition: O cuidado com a roupa de mergulho envolve enxaguar com água doce após cada uso, secar longe da luz solar direta, armazenar plana ou pendurada em um cabide largo, e limpeza periódica para remover sal, bactérias e odores.
  tldr: Enxágue sua roupa de neoprene por dentro e por fora com água fresca imediatamente após cada sessão. Seque virando do avesso à sombra em um cabide largo de plástico. Armazene plana ou dobrada em um local fresco e seco. Nunca deixe roupas de neoprene ao sol direto, em carros quentes ou em secadoras. Use shampoo para roupa de neoprene a cada 5-10 sessões.
  problem: Após uma temporada, sua roupa de mergulho cheira mal, o neoprene perdeu a elasticidade, as costuras estão descascando e o zíper fica preso — tudo isso pode ser evitado com os cuidados adequados.
  explanation: Cristais de sal se incorporam no neoprene e desgastam o material. Bactérias se multiplicam em interiores úmidos, produzindo odores e degradando o neoprene. UV degrada o revestimento de náilon. Calor acima de 50°C causa delaminação. Secagem inadequada distorce o neoprene e tensiona as costuras.
  solution: 'Após cada sessão: enxágue bem por dentro e por fora, vire do avesso, pendure em um cabide largo de plástico à sombra. Uma vez seco, vire para o lado certo e guarde plano. A cada 5-10 sessões: lave com shampoo para roupas de neoprene. Mensalmente: lubrifique o zíper com cera para zíper.'
  recommendation: Use Aquafarer Shampoo para Mergulho para limpeza e Aquafarer Cera para Zíper para manutenção do zíper. Guarde no Aquafarer cabide largo na bolsa de malha.
  faq:
    - q: Posso colocar minha roupa de mergulho na máquina de lavar?
      a: Não é recomendado — lavar na máquina danifica o neoprene. Se for necessário, use ciclo delicado, água fria e uma bolsa de malha.
    - q: Como eu tiro o cheiro do meu traje de neoprene?
      a: Deixe de molho em água fria com shampoo para roupa de neoprene ou vinagre branco por 30 minutos. Enxágue bem.
    - q: Como devo secar minha roupa de mergulho?
      a: Do avesso na sombra em um cabide largo e acolchoado de plástico. Evite luz solar direta e cabides de metal.
    - q: Posso consertar uma roupa de mergulho rasgada?
      a: Pequenos rasgos com menos de 2,5 cm podem ser reparados com cimento de neoprene e um remendo. Rasgos maiores podem exigir reparo profissional.
