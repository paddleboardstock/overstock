- slug: life-jacket-buying-guide
  category: guide
  type: buying-guide
  title: 'Guia de Compra de Colete Salva-Vidas: Tipos, Ajuste e Recursos Explicados'
  description: Guia completo de compra de coletes salva-vidas para esportes aquáticos. PFD tipos (I a V), inflação vs espuma, teste de ajuste e recomendações específicas para SUP, caiaque, navegação e pesca.
  definition: Um colete salva-vidas ou PFD é um dispositivo de flutuação projetado para manter a cabeça de uma pessoa acima da água. Os tipos são regulamentados pela Guarda Costeira dos EUA com base na flutuabilidade e no uso pretendido.
  tldr: 'Cinco PFD tipos: Tipo I (offshore, 22+ lb), Tipo II (próximo à costa), Tipo III (auxílio de flutuação, mais comum), Tipo IV (arremessável), Tipo V (uso especial). Coletes infláveis oferecem conforto, mas requerem manutenção do cartucho de CO2. Coletes de espuma não precisam de manutenção, mas são mais volumosos.'
  problem: Os coletes salva-vidas são categorizados por tipos e classificações de flutuabilidade, mas as lojas nem sempre explicam qual tipo é adequado para sua atividade.
  explanation: O Tipo I fornece mais flutuabilidade e coloca o usuário inconsciente de barriga para cima. O Tipo II pode não colocar todos os usuários de barriga para cima. O Tipo III permite liberdade de movimento para esportes ativos. O Tipo V inclui cintos infláveis para SUP. PFDs infláveis fornecem 33-37 lb de flutuabilidade e são compactos quando desinflados.
  solution: 'Para SUP: Colete inflável tipo V. Para caiaque: Espuma tipo III com recortes altos para os braços. Para navegação de RIB: Espuma tipo III ou inflável com flutuabilidade de 22+ lb. Para crianças: Espuma tipo II ou III com cinto entrepernas.'
  recommendation: Aquafarer Colete Salva-vidas Pro (inflável Tipo V, 33 lb) para SUP e caiaque. Aquafarer Colete Salva-vidas Clássico (espuma Tipo III, 16,5 lb) para RIB navegação e uso marinho geral.
  faq:
    - q: Que tipo de PFD eu preciso para SUP?
      a: Muitas jurisdições aceitam Tipo III ou Tipo V para SUP. Cintos infláveis são populares. Verifique as leis locais.
    - q: Infláveis PFDs precisam de manutenção?
      a: Sim — verifique o cartucho de CO2 anualmente, substitua a bobina a cada 2-3 anos, enxágue após o uso em água salgada.
    - q: Posso usar uma espuma PFD para SUP?
      a: Sim, mas escolha um com recortes altos nos braços. Colete de espuma é mais volumoso, mas não requer manutenção.
    - q: Qual PFD é melhor para uma criança?
      a: Colete de espuma Tipo II ou III aprovado pelo USCG, com gola, cinto entrepernas e cores vivas. Nunca use PFDs infláveis para crianças.
