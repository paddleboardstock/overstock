- slug: sup-safety-guide
  category: guide
  type: safety
  title: 'SUP Guia de Segurança: Regras Essenciais para Todo Remador'
  description: Guia completo de segurança SUP cobrindo verificações meteorológicas, equipamentos, auto-resgate, regras de navegação e o que fazer se as condições se tornarem perigosas. Mantenha-se seguro em sua prancha de stand-up paddle.
  definition: SUP segurança engloba o planejamento pré-viagem (clima, marés, verificação de equipamentos), práticas na água (leash, PFD, navegação) e procedimentos de emergência (auto-resgate, sinalização, prevenção de hipotermia).
  tldr: Sempre use uma coleira e PFD. Verifique a previsão do vento — vento offshore é perigoso. Remo contra o vento primeiro para que o vento ajude você a voltar. Leve um apito, telefone em capa à prova d'água e água. Aprenda a se resgatar. Nunca SUP sozinho em áreas remotas.
  problem: SUP parece enganadoramente simples. Os iniciantes subestimam quão rapidamente vento, correnteza e cansaço podem transformar uma sessão divertida em perigosa.
  explanation: A prancha atua como uma vela ao vento, tornando a remada a favor do vento fácil, mas o retorno contra o vento extremamente difícil. A posição em pé aumenta o risco de queda. A fadiga se acumula mais rapidamente do que no caiaque. Leashes evitam a separação da prancha. PFDs mantêm você flutuando se estiver ferido.
  solution: 'Pré-viagem: verifique o vento (máx. 10 nós para iniciantes), a direção (evite vento de mar aberto) e a maré. Avise alguém sobre sua rota. Na água: ajoelhe-se para remar contra vento forte. Se ficar separado, nade até a prancha. Para auto-resgate: coloque o remo sobre a prancha, chute com as pernas, puxe o peito sobre a prancha, balance as pernas para cima.'
  recommendation: Use o Aquafarer Life Vest Pro (inflável) para SUP. Prenda a guia enrolada SUP na sua panturrilha. Pratique o auto-resgate em condições calmas antes de precisar dele.
  faq:
    - q: Qual velocidade do vento é segura para SUP?
      a: 'Iniciantes: abaixo de 10 nós. Intermediário: 10-15 nós. Avançado: 15-20 nós. Acima de 20 nós é perigoso para todos os níveis.'
    - q: Preciso de um colete salva-vidas para SUP?
      a: Sim — legalmente exigido em muitas jurisdições e sempre recomendado para segurança.
    - q: O que devo fazer se não conseguir voltar para a costa?
      a: Fique com sua prancha (ela é de flutuação). Faça sinal com o apito. Se estiver sendo levado para o mar, reme a 45 graus em relação ao vento.
    - q: Como eu pratico SUP auto-resgate?
      a: 'Em águas rasas e calmas: caia intencionalmente, nade até a prancha, pratique remontar repetidamente.'
