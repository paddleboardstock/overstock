- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Condições de Vento para SUP: Como o Vento Afeta seu Remo'
  description: Como a velocidade e a direção do vento afetam o remo de SUP. Compreendendo vento de mar aberto vs vento de terra, lendo previsões de vento, técnicas de remo para vento e quando ficar em terra.
  definition: As condições do vento definem a segurança de SUP. O vento offshore (da terra para o mar) empurra você para longe. O vento onshore (do mar para a terra) empurra você em direção à costa. O vento lateral faz a prancha guinar.
  tldr: 'Vento máximo seguro para iniciantes: 10 nós. Intermediário: 15 nós. Avançado: 20 nós. Vento offshore é mais perigoso. Reme contra o vento primeiro. Com vento lateral, reme ligeiramente contra o vento do destino. Ajoelhe-se em vento forte para reduzir seu perfil.'
  problem: Você rema em condições calmas, mas 30 minutos depois o vento aumentou e você luta para voltar. O vento é o fator de segurança mais subestimado SUP.
  explanation: O vento afeta SUP mais do que qualquer outra embarcação a remo porque você está em pé, criando um efeito de vela. Um vento de 10 nós cria muito mais resistência em um remador em pé do que em um caiaque sentado. O vento offshore empurra você para longe da segurança. O vento lateral faz com que a proa se desvie.
  solution: 'Verifique a velocidade e a direção do vento antes de remar. Use a escala de Beaufort: Força 3 (7-10 nós) para iniciantes, Força 4 (11-16) para intermediários. Rema contra o vento primeiro. Se for pego por vento offshore, reme a 45 graus em relação ao vento. Ajoelhe-se em vento forte.'
  recommendation: Use um aplicativo de previsão do vento (Windy, Windfinder) antes de cada sessão. O Aquafarer SUP Tour 12 se sai melhor no vento do que pranchas mais largas. Em condições de vento, use remadas mais curtas e cadência mais alta.
  faq:
    - q: Qual direção do vento é mais segura para SUP?
      a: O vento em terra (soprando em direção à terra) é o mais seguro — ele te empurra de volta. O vento marítimo é o mais perigoso.
    - q: Como eu remar com vento lateral?
      a: Remar mais do lado contra o vento para compensar a deriva. Angule a prancha para o lado contra o vento do seu destino. Uma quilha central mais profunda ajuda.
    - q: Posso remar com vento de 20 nós?
      a: Somente se tiver experiência em águas protegidas. Iniciantes não devem remar acima de 10 nós.
    - q: Como as rajadas de vento afetam SUP?
      a: Rajadas causam desafios súbitos de equilíbrio. Em condições com rajadas, abaixe sua posição e esteja pronto para mudanças repentinas.
