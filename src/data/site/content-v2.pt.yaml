- slug: ocean-conditions-explained
  category: guide
  type: technical
  title: Condições do Oceano Explicadas (Leia a Previsão de Ondas como um Profissional)
  description: Altura da ondulação, período, direção do vento, maré — decifre qualquer previsão de surf em 60 segundos. O que os números realmente significam para seu point local e quando ficar na praia.
  definition: 'As condições do oceano são determinadas por três fatores: ondulação (altura, período, direção), vento (offshore é limpo, onshore é agitado) e maré (altera a profundidade da água sobre bancos de areia e recifes).'
  tldr: 'Três fatores determinam a qualidade do surfe: ondulação (tamanho, período, direção), vento (offshore é limpo, onshore é ondulado) e maré (empurra a água para dentro ou para fora sobre os bancos de areia). Use o período da ondulação para julgar a força — período mais longo significa ondas mais fortes. Confira a previsão de surfe combinando esses três fatores antes de cada sessão.'
  problem: 'As previsões de surf mostram números confusos: 3 pés a cada 12 segundos vindos de 290°, vento fraco offshore. Você não sabe o que isso significa para a praia onde planeja surfar. Sem decodificar a previsão, você ou dirige até uma praia sem ondas ou rema em condições perigosas.'
  explanation: 'O swell é medido pela altura (altura da face em pés), período (segundos entre as ondas) e direção (de onde o swell vem). Swells de período mais longo (12 segundos ou mais) carregam mais energia e produzem ondas mais limpas e poderosas. Qualidade do vento: vento offshore (soprando da terra para o mar) mantém a face da onda erguida, criando ondas suaves e limpas; vento onshore (do mar para a terra) agita a superfície. Ventos laterais são aceitáveis, mas não ideais. A maré afeta o formato da onda dependendo do ponto de quebra — beach breaks muitas vezes funcionam melhor na maré média, reef breaks em níveis específicos de maré dependendo da profundidade do recife.'
  solution: Use um site ou aplicativo de previsão de surf e aprenda a ler três parâmetros para o seu pico local. Faça a referência cruzada da direção do swell com a orientação da praia — uma praia voltada para o oeste precisa de swell de oeste. Verifique a previsão do vento para o horário em que você planeja surfar, não o boletim da manhã. Aprenda a preferência de maré para o seu pico específico observando-o em diferentes níveis de maré.
  recommendation: 'Passe um mês registrando as condições e a qualidade das ondas na sua praia local. Você descobrirá padrões: quais direções de swell funcionam, quais marés produzem a melhor forma e quais ventos estragam a superfície. O guia de condições do oceano acompanha o guia básico de segurança no surfe para uma base completa de literacia oceânica.'
  faq:
    - q: Qual é um bom período de ondulação para surfar?
      a: 8-10 segundos produzem ondas fracas e desorganizadas, adequadas para iniciantes. 10-13 segundos é o ponto ideal para a maioria das ondas — boa potência sem ser perigosa. 14+ segundos produzem ondulações poderosas e focadas, adequadas para surfistas avançados.
    - q: Qual é o melhor vento para surfar?
      a: Vento leve offshore (5-10 nós) produz as faces de onda mais limpas. Condições de vidro (vento zero) são ideais, mas raras. Vento onshore deixa as ondas onduladas e mais difíceis de surfar. Vento forte offshore pode tornar as entradas perigosas ao segurar a crista da onda por muito tempo.
    - q: Como a maré afeta as ondas?
      a: A maré altera a profundidade sobre bancos de areia e recifes. A maré baixa pode expor perigos e tornar as ondas mais íngremes ou fechadas. A maré alta pode suavizar as ondas ou torná-las grossas e lentas. A maioria das praias funciona melhor 2-3 horas antes ou depois da maré alta ou baixa.
    - q: Posso surfar com vento onshore?
      a: Sim, mas a qualidade será menor. Ondas com faces irregulares tornam as viradas mais difíceis e a remada menos eficiente. Iniciantes frequentemente preferem vento em direção à praia porque as ondas são mais suaves e menos potentes, dando mais tempo para se levantar.
