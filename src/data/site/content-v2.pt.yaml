- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Armazenamento Inflável SUP: A Maneira Certa de Guardar Seu iSUP'
  description: O armazenamento adequado de infláveis SUP previne delaminação, UV danos, mofo e vazamentos de válvula. Dicas de armazenamento de inverno, armazenamento de longo prazo e armazenamento diário para pranchas drop-stitch.
  definition: O armazenamento inflável SUP significa manter a prancha em um ambiente limpo, seco e com temperatura controlada, longe de UV, temperaturas extremas e danos físicos.
  tldr: Armazene em um local fresco e escuro, abaixo de 30°C, longe da luz solar direta. Para armazenamento de curto prazo (1-2 semanas), guarde parcialmente inflado a 8-10 PSI. Para armazenamento de longo prazo, desinfle completamente, enrole frouxamente e coloque na bolsa de armazenamento. Nunca armazene úmido. Mantenha longe de roedores e objetos cortantes.
  problem: Você esvazia seu SUP e o coloca em uma garagem quente ou porão úmido. Três meses depois, o PVC está amarelado, o tapete do deck está descascando e a válvula vaza. Armazenamento inadequado causa mais danos do que o uso regular.
  explanation: Calor acima de 50°C faz com que PVC plastificantes migrem, tornando o material rígido e quebradiço. Radiação UV quebra as ligações do polímero. Umidade retida no interior cria mofo. Frio abaixo de zero torna PVC quebradiço. Pontos de pressão devido a dobras apertadas criam vincos permanentes.
  solution: 'Armazenamento de curto prazo: enxágue, seque, infle até 10 PSI e armazene fora do chão em uma área sombreada. Armazenamento de longo prazo: limpe completamente, seque totalmente, esvazie completamente, enrole com o tapete do convés voltado para fora, coloque na bolsa, armazene em um armário fresco e seco. Mantenha afastado de produtos químicos e pragas.'
  recommendation: Use a bolsa de transporte Aquafarer para armazenamento — ela bloqueia UV e evita arranhões. Armazene em um ambiente com controle de clima. Adicione um pacote dessecante dentro da bolsa em ambientes úmidos.
  faq:
    - q: Posso guardar meu SUP inflado na garagem?
      a: Somente se a garagem permanecer abaixo de 30°C e não tiver luz solar direta. A maioria das garagens ultrapassa 40°C no verão.
    - q: Devo guardar meu SUP na bolsa?
      a: Sim, a bolsa protege contra poeira, UV e danos físicos. Certifique-se de que a placa esteja completamente seca antes de colocá-la na bolsa.
    - q: O congelamento pode danificar um SUP inflável?
      a: Sim. Abaixo de zero, PVC fica quebradiço e pode rachar quando desenrolado ou inflado. Sempre armazene acima de 5°C.
    - q: Como devo enrolar meu SUP para armazenamento?
      a: Enrole com a parte do deck voltada para fora para proteger a parte inferior PVC. Evite vinco apertado. Alterne a posição da dobra a cada vez.
