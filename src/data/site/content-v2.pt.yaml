- slug: marine-life-vest-guide
  category: guide
  type: buying-guide
  title: 'Guia de Colete de Vida Marinha: Escolha o PFD certo para sua atividade aquática'
  description: Guia completo de compra de coletes salva-vidas para SUP, caiaque, RIB navegação e vela. PFD tipos (espuma vs inflável), diretrizes de ajuste, exigências legais e características para cada atividade.
  definition: Um colete salva-vidas ou dispositivo de flutuação pessoal (PFD) é um equipamento de segurança projetado para manter uma pessoa flutuando na água. Os tipos variam do Tipo I (offshore) ao Tipo V (uso especial).
  tldr: 'Escolha PFD por atividade: cinto inflável para SUP, colete de espuma para caiaque, espuma Tipo III para RIB e lanchas. Principais características: aprovação USCG ou ISO, painéis reflexivos, apito de resgate, argola em D para cinto de segurança, cores vivas.'
  problem: Você vê filas de coletes salva-vidas variando de $20 a $300 e não tem ideia de qual é apropriado para sua atividade ou cumpre os requisitos legais.
  explanation: 'Coletes salva-vidas são categorizados por tipo: Tipo I (alta-mar, vira a pessoa inconsciente de barriga para cima), Tipo II (perto da costa), Tipo III (auxílio à flutuação, mais comum), Tipo IV (arremessável), Tipo V (uso especial). Coletes infláveis usam cartuchos de CO2 — menos volumosos, mas exigem manutenção. Coletes de espuma não precisam de manutenção, mas são mais volumosos.'
  solution: 'Para SUP: escolha um colete ou cinto inflável (flutuabilidade de 33 lb). Para caiaque: espuma Tipo III com grandes cortes nos braços. Para RIB: espuma Tipo III ou inflável com flutuabilidade de 22+ lb, fita refletora e apito de resgate.'
  recommendation: O Colete Salva-vidas Pro Aquafarer (inflável, 33 lb) é ideal para SUP e caiaque. O Colete Salva-vidas Clássico Aquafarer (espuma, Tipo III) é perfeito para RIB navegação e uso marinho geral.
  faq:
    - q: Preciso de um colete salva-vidas para SUP?
      a: Sim — legalmente exigido em muitas jurisdições e sempre recomendado. Use um cinto inflável ou colete para esportes com remos.
    - q: Coletes salva-vidas infláveis são seguros?
      a: Sim, com a manutenção adequada. Verifique o cartucho de CO2 anualmente, substitua a bobina a cada 2-3 anos.
    - q: Qual colete salva-vidas é melhor para uma criança?
      a: Um colete de espuma Tipo II ou III aprovado pelo USCG, com gola, alça entre as pernas e cores vivas. Nunca use coletes infláveis para crianças.
    - q: Como um colete salva-vidas deve servir?
      a: Ajustado — o colete não deve subir acima das orelhas quando levantado pelos ombros. Todos os zíperes e fivelas devem estar fechados.
