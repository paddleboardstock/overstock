- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Guia de Tamanhos de Stand Up Paddle: Volume, Comprimento e Largura para Cada Remador'
  description: Dimensionamento completo de pranchas de stand-up paddle com recomendações de volume por peso e atividade. Inclui um gráfico de tamanhos fácil de usar para pranchas all-around, touring, surf e ioga SUP.
  definition: O tamanho da prancha de stand-up paddle é determinado pelo volume (capacidade de peso e flutuação), comprimento (velocidade e capacidade de manter a direção), largura (estabilidade) e espessura (distribuição do volume e resistência ao vento).
  tldr: 'Use o peso para encontrar o volume mínimo: 50-70 kg precisa de 220-260L, 70-90 kg precisa de 260-300L, 90-110 kg precisa de 300-350L, 110+ kg precisa de 350+L. Para iniciantes, adicione 20% a esses números. A largura importa: 32" é intermediário, 33-34" é amigável para iniciantes, 35"+ é muito estável.'
  problem: As listas de tamanhos de stand up paddle usam pés, polegadas e litros de forma intercambiável, tornando difícil comparar entre marcas.
  explanation: O volume é a métrica mais direta para a capacidade de peso — 1 litro de água doce desloca 1 kg de peso. Uma prancha com 260L pode teoricamente suportar 260 kg, mas a capacidade prática é menor porque a prancha precisa ficar acima da água. Seu peso total (corpo mais equipamento) deve ser 30-40% do volume da prancha.
  solution: Volume alvo = (peso corporal em kg + peso do equipamento em kg) x 3. Para um remador de 75 kg com 5 kg de equipamento, alvo = 80 x 3 = 240L mínimo. Para iniciantes, multiplique por 3,5. Para avançados, multiplique por 2,5.
  recommendation: O Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") é adequado para a maioria dos praticantes com 50-100 kg. Praticantes mais leves podem escolher o tamanho AirDeck 270. Praticantes mais pesados devem considerar o SUP Tour 12 (300L+) ou pranchas mais largas.
  faq:
    - q: A altura importa para o tamanho de SUP?
      a: A altura importa menos do que o peso. Um ciclista alto e leve precisa de menos volume do que um ciclista baixo e pesado. Use o peso como seu determinante principal de volume.
    - q: O que acontece com volume demais?
      a: A prancha fica muito alta, pegando vento como uma vela. Parece esponjosa nas ondas pequenas. No entanto, para iniciantes, volume extra é melhor do que pouco.
    - q: O que acontece com volume muito baixo?
      a: A prancha fica muito enterrada, criando arrasto. O nariz pode submergir durante a remada (pearling). Você se cansa rapidamente ao remar uma prancha parcialmente submersa.
    - q: Pranchas infláveis precisam de tamanhos diferentes em comparação com pranchas rígidas?
      a: Não significativamente. Infláveis a 15+ PSI deslocam água de forma semelhante às pranchas rígidas. As recomendações de volume se aplicam igualmente a ambos os tipos.
