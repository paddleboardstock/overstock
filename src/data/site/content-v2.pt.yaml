- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Reparo de Infláveis SUP: Conserte Furos, Vazamentos e Problemas na Válvula'
  description: Guia de reparo de SUP inflável faça você mesmo. Como encontrar um vazamento lento, remendar um furo, substituir uma válvula e consertar a descolagem do pad do deck usando o kit de reparo incluído.
  definition: O reparo de infláveis SUP envolve localizar vazamentos de ar através de testes com água e sabão, limpar e ásperar a área danificada, aplicar adesivo e remendo PVC e curar sob pressão.
  tldr: Encontre vazamentos com água com sabão. Limpe e torne áspera a área ao redor do furo com lixa. Aplique cola PVC tanto no remendo quanto na prancha, espere 5 minutos, pressione firmemente e deixe curar sob peso por 24 horas. Para vazamentos na válvula, verifique primeiro o anel de vedação. Pequenos furos menores que 1/4" são reparos fáceis de fazer você mesmo.
  problem: Você infla seu SUP e ele perdeu pressão pela manhã. Sem conhecimento de reparo, você enfrenta uma substituição cara para o que provavelmente é um simples furo.
  explanation: 'A maioria dos infláveis SUPs usa um núcleo drop-stitch com camadas externas PVC. Um furo através da camada externa PVC cria um vazamento lento. Reparo padrão: limpar, lixar, aplicar adesivo compatível com PVC, pressionar o remendo sob peso. Vazamentos na válvula são mais comuns do que furos no painel — o anel de vedação resseca ou detritos impedem a vedação.'
  solution: Inflar a prancha ao máximo PSI e ouvir o chiado. Pulverize água com sabão sistematicamente, especialmente ao redor das costuras e da válvula. Marque os pontos onde houver bolhas. Desinflar, limpar com álcool, lixar com lixa 80, aplicar cola PVC no remendo e na prancha, esperar até ficar pegajoso, pressionar firmemente, pesar por 24 horas.
  recommendation: Use o kit de reparo Aquafarer incluído com todas as placas Aquafarer. Sempre leve o kit de reparo em viagens. Para problemas com a válvula, entre em contato com o suporte Aquafarer. Para grandes rasgos ou separações de costura, recomenda-se reparo profissional.
  faq:
    - q: Posso reparar um grande rasgo no meu inflável SUP?
      a: Rasgos de mais de 2,5 cm podem exigir reparo profissional ou um remendo em ambos os lados. A separação das costuras ao longo do trilho não pode ser reparada de forma confiável no campo.
    - q: Quanto tempo dura um adesivo de reparo?
      a: Um reparo adequado com técnica correta dura a vida útil da prancha. A adesão ruim devido à limpeza inadequada leva à falha futura.
    - q: Posso consertar uma válvula que está vazando?
      a: Frequentemente sim. Remova o núcleo da válvula, inspecione o anel de vedação, limpe ou substitua-o, aplique lubrificante de silicone e reinstale.
    - q: E se eu não conseguir encontrar o vazamento?
      a: Infle completamente PSI e submerja as seções sequencialmente em uma banheira ou piscina. Vazamentos pequenos demais para encontrar podem estar relacionados à temperatura.
