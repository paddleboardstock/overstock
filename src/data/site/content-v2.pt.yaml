- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Reparo de Mergulho: Conserte Rasgos, Costuras e Zíperes Você Mesmo'
  description: Guia de reparo de roupa de mergulho DIY para rasgos de neoprene, separação de costuras, travamento de zíper e joelheiras rasgadas. Instruções passo a passo usando cola de neoprene.
  definition: O reparo de uma roupa de mergulho envolve limpar e ásperar a área danificada, aplicar cola de neoprene e curar sob pressão para restaurar a estanqueidade e a flexibilidade.
  tldr: 'Pequenos rasgos abaixo de 1": aplique cimento de neoprene em ambos os lados, espere 10-15 minutos até ficar pegajoso, pressione firmemente, cure sob peso por 12 horas. Rasgos maiores precisam de um remendo de neoprene. Problemas com o zíper: lubrifique primeiro, depois verifique se há tecidos presos.'
  problem: Sua roupa de mergulho tem um pequeno rasgo, uma costura se separando ou um zíper que emperra. Sem o reparo faça você mesmo, você paga $150+ por uma substituição quando o conserto custa $5.
  explanation: O cimento de neoprene funciona amolecendo a superfície do neoprene, criando uma ligação química à medida que o solvente evapora. O cimento deve ser aplicado em ambas as superfícies e ficar pegajoso antes da união. Para rasgos, as bordas devem se alinhar precisamente. Problemas com zíper geralmente são corrosão por sal ou tecido preso nos dentes.
  solution: 'Para rasgos: limpe com álcool, lixe levemente, aplique uma camada fina de cimento em ambas as bordas, espere até ficar pegajoso, pressione perfeitamente, aplique peso, cure por 12-24 horas. Para remendos: corte o remendo 2,5 cm maior que o rasgo, aplique cimento em ambos, prenda com grampo. Para zíper: enxágue, aplique cera para zíper, trabalhe suavemente.'
  recommendation: Mantenha um Aquafarer kit de reparo de roupa de mergulho na sua bolsa de equipamento. Para reparos grandes ou falhas nas costuras em pontos críticos, é recomendado o reparo profissional.
  faq:
    - q: Posso usar supercola em uma roupa de mergulho?
      a: Não — a supercola seca dura e quebradiça. Use apenas cola de neoprene ou aquaseal para reparos em wetsuits.
    - q: Quanto tempo dura um reparo com cola de neoprene?
      a: Um reparo feito corretamente é frequentemente mais forte do que o neoprene original e dura o restante da vida útil da roupa.
    - q: Posso consertar um zíper que se separou completamente?
      a: Se a faixa se separou do neoprene, recoloque com adesivo de contato. Se os dentes estiverem danificados, substitua o zíper profissionalmente.
    - q: Como eu conserto uma roupa de mergulho que está vazando na costura?
      a: Aplique um cordão fino de aquaseal ao longo do interior da costura com vazamento e deixe curar por 24 horas.
