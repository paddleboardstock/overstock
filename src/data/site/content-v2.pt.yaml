- slug: winter-paddle-boarding
  category: guide
  type: safety
  title: 'Stand Up Paddle no Inverno: Equipamento, Segurança e Técnica para Água Fria'
  description: O inverno SUP requer equipamentos e preparação especializados. Espessura da roupa de neoprene, segurança em águas frias, considerações sobre a prancha e ajustes de técnica para remadas em clima frio.
  definition: O stand up paddle no inverno é SUP em temperaturas de água abaixo de 15°C, exigindo proteção térmica (roupa de mergulho ou roupa seca), protocolos de segurança em água fria e equipamentos adaptados para condições frias.
  tldr: "Água abaixo de 15°C requer uma roupa de mergulho: 5/4/3mm para 8-14°C, 4/3mm para 12-18°C. Adicione botas, luvas e capuz abaixo de 10°C. Infle as pranchas ao máximo PSI — ar frio reduz a pressão. Use cores vivas para visibilidade em pouca luz. Nunca reme sozinho. Leve um telefone em uma capa à prova d'água."
  problem: Você quer SUP durante o ano todo, mas as condições de inverno apresentam desafios — água fria, dias mais curtos, necessidade de equipamentos de inverno. Sem a preparação adequada, as sessões de inverno são frias, curtas e potencialmente perigosas.
  explanation: A água fria conduz calor 25 vezes mais rápido do que o ar frio. Uma queda em água a 8°C causa choque frio imediato e resfriamento rápido dos músculos. A primeira prioridade do corpo é sobreviver, não remar. Remar no inverno requer proteção térmica que mantenha a mobilidade — um equilíbrio entre calor e amplitude de movimento.
  solution: 'Lista de equipamentos: roupa de mergulho 5/4/3mm com zíper no peito, botas de 5mm, luvas de 3mm, capuz de neoprene, PFD (fornece isolamento térmico extra), telefone em capa impermeável, apito. Técnica: remar mais próximo da costa, avisar alguém sobre sua rota, verificar o clima cuidadosamente. Aquecimento após: ter roupas secas e bebidas quentes prontas.'
  recommendation: O Aquafarer Wetsuit Pro 5/4/3mm com forro térmico é ideal para SUP no inverno. Adicione botas de 5mm Aquafarer e luvas de 3mm. Use o Colete Salva-Vidas Pro para mais aquecimento do núcleo e segurança.
  faq:
    - q: Posso usar um SUP em temperaturas de congelamento?
      a: Sim, mas evite a formação de gelo na prancha. O gelo pode danificar PVC. Não pratique remada se o gelo estiver formando na superfície da água.
    - q: Eu preciso de uma prancha especial para o inverno?
      a: Não, seu SUP inflável regular funciona bem. O ar frio reduz PSI — infle até a pressão máxima. A prancha ficará um pouco mais rígida.
    - q: É seguro SUP sozinho no inverno?
      a: Não — sempre reme com um parceiro em água fria. A hipotermia pode começar em poucos minutos após uma queda.
    - q: Como faço para me aquecer no meio da sessão?
      a: Use uma abordagem em camadas — capuz de neoprene, botas e luvas podem ser removidos se você ficar com calor. Mantenha um termômetro de bebida quente à beira-mar.
