- slug: understanding-tides
  category: guide
  type: technical
  title: 'Entendendo as Marés para Esportes Aquáticos: Um Guia Prático'
  description: Como as marés afetam SUP, as condições para surfe e caiaque. Ler tabelas de marés, entender as marés de sizígia e de quadratura e planejar sua sessão em torno dos movimentos das marés para segurança.
  definition: As marés são a elevação e a queda diárias dos níveis do mar causadas pela atração gravitacional da lua e do sol. A amplitude da maré varia de acordo com o local e o ciclo lunar.
  tldr: 'Duas marés altas e duas marés baixas diariamente na maioria dos locais. Marés de sizígia (lua cheia/lua nova) têm amplitudes maiores e correntes mais fortes. Marés de quadratura (lua quarto) têm amplitudes menores. A maré afeta a profundidade da água, a forma das ondas e a intensidade das correntes. Para SUP: reme contra a corrente primeiro para que ela ajude você a voltar.'
  problem: Você chega à sua praia local para encontrar quase nada de ondas, correntes perigosas da maré saindo ou água muito rasa. Sem entender as marés, você perde viagens ou rema em condições perigosas.
  explanation: As marés são causadas pela gravidade da lua. Marés de sizígia (lua cheia e nova) produzem as maiores altas e as menores baixas. Marés de quadratura (lua crescente e minguante) produzem uma variação mínima. As correntes de maré são mais rápidas na metade da maré, e calmas na maré alta e baixa. A amplitude das marés varia de 0,3 m (Mediterrâneo) a 16 m (Baía de Fundy).
  solution: 'Verifique a tabela das marés antes de cada sessão. Para surfe: beach breaks geralmente funcionam melhor 2-3 horas antes ou depois da maré alta. Para SUP: reme contra a corrente na primeira metade para que a corrente ajude na volta. Para pesca: a maré entrando empurra os peixes para as áreas rasas.'
  recommendation: Use as previsões de maré da NOAA ou um aplicativo de maré local. Aprenda a preferência de maré do seu pico local registrando as condições ao longo de um mês.
  faq:
    - q: O que é uma maré de sizígia?
      a: As marés de sizígia ocorrem durante as luas cheia e nova, produzindo marés altas mais altas e correntes mais fortes. Elas ocorrem duas vezes por mês.
    - q: O que é uma maré morta?
      a: As marés mortas ocorrem durante as luas quartos. A amplitude da maré é menor, e as correntes são mais fracas — bom para iniciantes.
    - q: As marés baixas são perigosas para SUP?
      a: A maré baixa pode expor rochas e recifes. Ela também concentra a energia das ondas em bancos de areia mais íngremes.
    - q: Como as marés afetam as correntes de retorno?
      a: As marés de saída (vazante) fortalecem as correntes de retorno. As marés de entrada (enchente) reduzem a força das correntes de retorno.
