- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: 'Wetsuit de 3mm vs 5mm: O que a maioria dos iniciantes erra em água fria'
  description: Pare de travar no meio da sessão ou superaquecer na praia. A verdadeira diferença entre wetsuits de 3mm e 5mm — gráfico de temperatura, trocas de flexibilidade e o que realmente funciona para o surfe em águas frias.
  definition: Uma roupa de mergulho é uma vestimenta de neoprene que retém uma fina camada de água contra a pele, que o calor do corpo aquece para isolamento. A espessura (3mm, 5mm) determina a faixa de temperatura que a roupa pode suportar — quanto mais grossa, mais quente, mas menos flexível.
  tldr: A espessura da roupa de mergulho determina diretamente o calor e a flexibilidade. Use 3mm para água acima de 16°C e 5mm para água entre 8°C e 16°C. Roupas mais grossas restringem o movimento, mas mantêm você aquecido por mais tempo — sempre priorize o ajuste em vez da marca.
  problem: Você abre uma loja online ou entra em uma loja de surf e vê roupas de neoprene rotuladas como 3/2, 4/3, 5/4 e roupas inteiras de 5mm. Os números não significam muito até você perceber que a espessura errada significa ou congelar no meio da sessão ou superaquecer e suar na praia.
  explanation: Roupas de neoprene funcionam prendendo uma fina camada de água entre sua pele e o neoprene; seu corpo aquece essa água, criando isolamento. Neoprene mais grosso prende mais água, mas restringe a flexibilidade e a flutuabilidade. Um traje de 3mm (geralmente 3/2 com braços mais finos) é adequado para condições amenas, enquanto 5mm (5/4/3 ou totalmente 5mm) é adequado para água fria. Entradas com zíper no peito vedam melhor do que as de trás e reduzem a entrada de água. A construção das costuras — coladas e costuradas cegamente (GBS) — é a diferença entre um traje que vaza e um traje aquecido.
  solution: Combine a espessura com a temperatura da água local com uma margem de erro de 5°C. Para climas temperados, compre uma de 3/2mm. Para água fria, compre uma de 5/4/3mm. Adicione botas, luvas e um capuz para estender seu alcance em mais 5°C para baixo. Experimente os trajes antes de comprar ou escolha uma marca com uma política de devolução generosa.
  recommendation: O Aquafarer Wetsuit Pro em 5/4/3mm é ideal para a maioria dos surfistas em águas frias, oferecendo costuras GBS e forro térmico. Se você surfar em águas quentes acima de 20°C, um 3/2mm com zíper no peito é a melhor escolha.
  faq:
    - q: Qual temperatura da água requer uma roupa de neoprene de 5mm?
      a: Temperaturas da água entre 8°C e 14°C exigem uma roupa de 5mm. Abaixo de 8°C, você precisa de uma roupa com capuz de 6/5/4mm. Entre 14°C e 18°C, uma roupa de 4/3mm funciona bem para a maioria das pessoas.
    - q: Posso usar uma roupa de neoprene de 3mm no inverno?
      a: Apenas em climas de inverno ameno onde a água se mantém acima de 16°C. Para surfe em inverno de verdade, 5mm ou 5/4/3mm é necessário. Botas, luvas e capuz adicionam calor equivalente sem precisar de um torso mais grosso.
    - q: Quão apertado deve ser um traje de mergulho?
      a: Ajustado, mas não restritivo. Não deve haver bolsas de ar nem neoprene folgado. Se você conseguir deslizar um dedo entre a sua pele e o traje na parte inferior das costas, está muito folgado. Se a respiração estiver difícil ou os movimentos estiverem severamente restringidos, escolha um tamanho maior.
    - q: Fatos de mergulho caros te mantêm mais aquecido?
      a: Um preço mais alto geralmente significa neoprene de melhor qualidade (à base de calcário vs petróleo), construção de costura melhor (GBS vs apenas colada) e maior flexibilidade. Esses fatores afetam diretamente o calor e a durabilidade, mas somente se o ajuste estiver correto.
