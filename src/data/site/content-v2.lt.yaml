    - q: Kaip Tour 12 susitvarko su chop'u?
      a: Labai gerai — poslinkio nosis perskrodžia nedidelį ar vidutinį bangavimą, nesukeldama obliuojančio korpuso pliaukštelėjimo.
    - q: Ar galiu naudoti Tour 12 banglenčių sportui?
      a: Nerekomenduojama – 12 pėdų ilgis ir poslinkis leidžia lėtai suktis. Naudok SUP Explorer 11 bangų važiavimui.
    - q: Koks irklų ilgis jums tinka geriausiai?
      a: 8-10\" virš galvos. Ilgesnis irklas suteikia svertą tolimam irklavimui.
