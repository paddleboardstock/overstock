  explanation: Išstūmimo nosis praskiria vandenį, o ne plaukia per jį, sumažindama priekinės bangos pasipriešinimą. Ilgesnė 12 pėdų vandens linija padidina korpuso greitį. 31" pločio plotis subalansuoja efektyvumą su stabilumu. Turizmo specifinės savybės apima kelias pelekų dėžes ir bungee krovinių denį.
  solution: Pripūskite iki 18PSI. Naudokite centrinį peleką ramiam vandeniui arba pridėkite šoninius kandimus šoniniam vėjui stabilumui. Poslinkio nosis ir 12 pėdų ilgis puikiai tinka atviram vandeniui su bangavimu.
