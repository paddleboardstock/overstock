  title: Banglenčių tipai paaiškinti (Kuri jums tinkamiausia?)
  description: Trumpa lenta, ilga lenta, žuvis, hibridas, putų lenta – jau supainiojote? Čia rasite kiekvieną banglentės tipą, suskirstytą pagal tai, kam jos skirtos, kokių bangų reikia ir kurią turėtumėte įsigyti pirmiausia.
  definition: Pagrindiniai banglenčių tipai yra longboardai (9 pėdos+, stabilios, lengvos), trumposios lentos (5–7 pėdų, reaguojančios, pažangios), putplasčio/pripučiamos lentos (didelis tūris, saugios pradedantiesiems) ir hibridinės (7–9 pėdos, universalus vidurio taškas). Kiekviena atitinka skirtingus įgūdžių lygius ir bangų sąlygas.
  tldr: Keturi pagrindiniai banglenčių tipai yra trumposios lentos (našumo, mažo tūrio), ilgosios lentos (stabilios, ramios), putų/pripučiamos (draugiškos pradedantiesiems, didelio tūrio) ir hibridinės arba funboard'ai (vidutinio ilgio universalumas). Kiekvienas tipas tinka skirtingam įgūdžių lygiui ir banglenčių stiliui. Rinkitės lentą pagal mokymosi kreivės etapą ir kokį važiavimą mėgstate labiausiai.
  problem: 'Banglentės pavadinimai painūs: mini-mal, kiaušinis, žuvis, šautuvas, hibridas, retro dvynys – sąrašas tęsiasi. Norite sužinoti, kokio tipo lenta atitinka jūsų įgūdžių lygį ir vietines bangas, neperkant penkių skirtingų lentų, kad suprastumėte.'
  explanation: Longboardai yra 9 pėdų ir storesni, su apvaliu nosimi – jie anksti pagauna bangas ir lengvai irkluoja. Shortboard'ai yra 5–7 pėdų ilgio su smailiu nosimi ir agresyviu sūpuokliu – jie reikalauja stipraus irklavimo ir tikslios technikos, bet suteikia maksimalų našumą. Putplasčio ir pripučiamos lentos imituoja longboardų formas didelio tūrio pakuotėse, tačiau yra minkštesnės ir saugesnės. Hibridai (funboardai, kiaušiniai) yra 7–9 pėdų ilgio ir derina irklų lengvumą su sukimo gebėjimu. Žvejybos lentos yra trumpos ir plačios su swallowtail, skirtos mažesnėms bangoms.
  solution: Nustatykite savo vietinį bangų tipą – lėti paplūdimio bangos tinka longboardams ir hibridams; statesni rifų ar taškų lūžiai tinka trumposioms lentoms. Lentą derinkite prie bangos, o ne prie to, kas atrodo įspūdingai. Pradedantieji turėtų rinktis longboard formą su dideliu tūriu, o vėliau, tobulėjant, tyrinėti trumpesnes formas.
  recommendation: Daugumai banglentininkų hibridinė arba funboard, apie 7'6"–8'6" ilgio, yra geriausias vienos lentos dėklas. Aquafarer Surfboard Pro, kurio ilgis 10'6", yra ilgesnis, bet suteikia ilgos lentos stabilumą ir pripučiamos lentos nešiojamumą. Pirmus metus naudokite ją kaip pagrindinę lentą.
  faq:
    - q: Kokia yra lengviausia banglentė važiuoti?
      a: Longboard (9 pėdų+) arba didelės talpos pripučiama lenta, pavyzdžiui Aquafarer , Surfboard Pro. Šios lentos anksti pagauna bangas ir suteikia stabilią platformą mokytis pop-up judesių bei svorio perkėlimo.
    - q: Kada turėčiau pereiti nuo longboard prie shortboard?
      a: Kai galėsite nuolat pagauti žalias bangas, atlikti apatinius posūkius ir apipjaustyti bangos paviršių savo longboard'e. Skubėjimas su perjungimu yra dažniausia klaida – tikėkitės praleisti 6–12 mėnesių ant longboard'o.
    - q: Kam skirtas žuvies banglentė?
      a: Žvejybos lentos skirtos mažoms, minkštoms bangoms. Jų trumpas ilgis ir platus kontūras suteikia greitį ten, kur įprasta trumpoji lenta užstrigtų. Tai puiki antra lenta vidutinio lygio banglentininkams.
    - q: Ar pripučiamos banglentės yra geros?
      a: Šiuolaikinės pripučiamos drop-stitch lentos su konstrukcija prilygsta putplasčio ilgosioms lentoms standumu ir našumu. Jos idealiai tinka pradedantiesiems ir keliautojams, nes telpa į kuprinę ir yra beveik nesunaikinamos.
