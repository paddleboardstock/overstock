  title: 'Pripučiamų įrenginių SUP remontas: Pataisykite pradūrimus, nuotėkius ir vožtuvų problemas'
  description: Pasidaryk pats pripučiamų įrenginių SUP remonto vadovas. Kaip rasti lėtą nuotėkį, užlopyti prakiurimą, pakeisti vožtuvą ir pataisyti terasos kilimėlio delaminaciją naudojant komplekte pateiktą remonto rinkinį.
  definition: Pripučiamų daiktų SUP taisymas apima oro nuotėkio lokalizavimą muiluotu vandeniu, testavimą, pažeistos vietos valymą ir šiurkštumą, PVC klijų ir lopų uždėjimą bei kietinimą esant slėgiui.
  tldr: Raskite nuotėkius su muiluotu vandeniu. Nuvalykite ir šiurkščiai nuvalykite vietą aplink pradūrimą švitriniu popieriumi. PVC Klijuokite klijus tiek ant lopo, tiek ant plokštės, palaukite 5 minutes, stipriai prispauskite ir kietinkite po svoriu 24 valandas. Dėl vožtuvų nuotėkio pirmiausia patikrinkite O-žiedą. Maži pradurimai žemiau 1/4" yra lengvai pataisomi patys.
  problem: Jūs pripučiate ir SUP ryte jis praranda slėgį. Be remonto žinių, susiduriate su brangiu pakaitalu, kuris greičiausiai yra paprastas pradūrimas.
  explanation: 'Dauguma pripučiamų įrenginių SUPs turi drop-stitch šerdį su PVC išoriniais sluoksniais. Pradūrimas per išorę PVC sukuria lėtą pratekėjimą. Standartinis remontas: valymas, PVCšlifavimas, klijų užtepimas, suderinamų klijų užklijavimas, lopų prispaudimas po svoriu. Vožtuvų pratekėjimai yra dažnesni nei panelių pradurimai – O formos žiedas išdžiūsta arba šiukšlės neleidžia sandarinti.'
  solution: Pripūsk lentą iki maksimumo PSI ir stebėk, ar nėra šnypštimo. Sistemingai purkšk muiluotą vandenį, ypač aplink siūles ir vožtuvą. Pažymėk burbuliuojančias vietas. Išpūsk, nuvalyk alkoholiu, nušlifuok 80 grūdėtumu, PVC klijais užtepk lopą ir lentą, palauk, kol taps lipnus, stipriai prispausk, sverk 24 valandas.
  recommendation: Naudokite Aquafarer remonto rinkinį, kuris pridedamas prie visų Aquafarer lentų. Kelionės metu visada nešiokitės remonto rinkinį. Dėl vožtuvų problemų kreipkitės į Aquafarer palaikymą. Dideliems plyšimams ar siūlių atskyrimams rekomenduojama profesionaliai taisyti.
  faq:
    - q: Ar galiu pataisyti didelę plyšį savo pripučiamame įrenginyjeSUP?
      a: Plyšimai virš 1 colio gali reikalauti profesionalaus remonto arba užtaisymo abiejose pusėse. Siūlių atskyrimai palei bėgį negali būti patikimai suremontuoti lauke.
    - q: Kiek laiko trunka taisymo pleistras?
      a: Tinkamas remontas su tinkama technika tarnauja visą plokštės tarnavimo laiką. Prastas sukibimas dėl nepakankamo valymo lemia ateities gedimus.
    - q: Ar galiu pataisyti pratekėjusį vožtuvą?
      a: Dažnai taip. Išimkite vožtuvo šerdį, apžiūrėkite O žiedą, išvalykite arba pakeiskite jį, užtepkite silikono tepalo ir vėl sumontuokite.
    - q: O jei nerasiu nuotėkio?
      a: Pripūskite iki galo PSI ir panardinkite dalis paeiliui vonioje ar baseine. Per maži nuotėkiai gali būti susiję su temperatūra.
