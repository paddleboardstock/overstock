  recommendation: Universaliam irklavimui Aquafarer SUP Explorer 11 siūlo šiek tiek geresnę konstrukciją. Kalbant apie žvejybos ypatybes, iRoker Nautical serija siūlo daugiau tvirtinimo galimybių. Spalvų įvairovei rinkitės iRocker.
