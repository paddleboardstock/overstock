  title: 'Irklentės dydžio gidas: tūris, ilgis ir plotis kiekvienam dviratininkui'
  description: Pilnas irklentės dydis su tūrio rekomendacijomis pagal svorį ir aktyvumą. Pridedama lengvai naudojama dydžių lentelė visoms komandoms, turijoms, banglenčių sportui ir jogos SUP lentoms.
  definition: Irklentės dydis nustatomas pagal tūrį (svorio talpa ir plūdę), ilgį (greitį ir sekimą), plotį (stabilumą) ir storį (tūrio pasiskirstymą ir pasipriešinimą vėjui).
  tldr: 'Naudokite svorį minimaliam tūriui nustatyti: 50-70 kg reikia 220-260 l, 70-90 kg 260-300 l, 90-110 kg 300-350 l, 110+ kg 350+l. Pradedantiesiems pridėkite 20 % prie šių skaičių. Plotis svarbus: 32 coliai yra vidutiniai, 33-34 coliai tinkami pradedantiesiems, 35 coliai+ labai stabilūs.'
  problem: Irklentės dydžių sąrašuose kojos, coliai ir litrai naudojami pakaitomis, todėl sunku palyginti tarp skirtingų prekės ženklų.
  explanation: Tūris yra tiesiausias svorio talpos rodiklis – 1 litras gėlo vandens išstumia 1 kg svorio. Lenta su 260 l teoriškai gali atlaikyti 260 kg, bet praktinė talpa mažesnė, nes lenta turi būti virš vandens. Jūsų bendras svoris (kūnas plius įranga) turėtų sudaryti 30–40 % lentos tūrio.
  solution: Tikslinis tūris = (kūno svoris kg + pavara, svoris kg) x 3. 75 kg irkluotojui su 5 kg pavara taikinys = 80 x 3 = mažiausiai 240 l. Pradedantiesiems dauginkite iš 3,5. Pažengusiems dauginkite iš 2,5.
  recommendation: Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") tinka daugumai sportininkų, sveriančių 50–100 kg. Lengvesni dviratininkai gali rinktis AirDeck 270 dydį. Sunkesni vairuotojai turėtų rinktis SUP Tour 12 (300L+) arba platesnes lentas.
  faq:
    - q: Ar ūgis svarbus SUP dydžiui?
      a: Ūgis mažiau svarbus nei svoris. Aukštam lengvam dviratininkui reikia mažiau apimties nei žemam sunkiam dviratininkui. Svorį naudokite kaip pagrindinį tūrio veiksnį.
    - q: Kas nutinka, kai garsumas per didelis?
      a: Lenta stovi per aukštai, gaudydama vėją kaip burė. Banguojant ji jaučiasi kaip kamštelė. Tačiau pradedantiesiems didesnis tūris geriau nei per mažas.
    - q: Kas nutinka, kai garsumas per mažas?
      a: Lenta sėdi per giliai, sukeldama pasipriešinimą. Nosis gali panirti irkluojant (perlų gamyba). Greitai pavargsti irkluodamas dalinai panardintą lentą.
    - q: Ar pripučiamoms lentoms reikia kitokio dydžio nei kietosioms lentoms?
      a: Nereikšmingai. Pripučiami 15 colių vienetai+ PSI išstumia vandenį panašiai kaip kietos lentos. Tūrio rekomendacijos taikomos abiem tipams.
