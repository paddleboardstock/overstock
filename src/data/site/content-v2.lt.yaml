  title: 'SUP Fizinis pasirengimas: viso kūno treniruotė ant irklentės'
  description: SUP Suteikia viso kūno treniruotę, derinančią širdies ir kraujagyslių ištvermę, pagrindinių raumenų stabilumą ir jėgą. Kaip struktūruoti SUP treniruotes, geriausius pratimus ir pažangos matavimą.
  definition: SUP Fitnesas naudoja nestabilią irklavimo lentos platformą, kad aktyvuotų pagrindinius stabilizatorius, kojų raumenis ir viršutinę kūno dalį per irklavimą, balansavimą ir lentos pratimus.
  tldr: SUP Sudegina 400–700 kalorijų per valandą. Vienos valandos SUP treniruotė įtraukia pilvo raumenis, kojas, nugarą, pečius ir rankas. Intervalinis irklavimas (sprintai + , atsigavimas) maksimaliai padidina kardio. Jogos pozos ant lentos stiprina pusiausvyrą ir lankstumą. Pridėkite SUPspecifinius jėgos judesius, tokius kaip pritūpimai ir įtūpstai ant lentos.
  problem: Sporto salės treniruotės tapo nuobodžios, o jūs norite lauko veiklos, kuri stiprina fizinę formą ir tuo pačiu yra smagi.SUP Sujungia nuotykius su tikru viso kūno pasirengimu.
  explanation: Irklavimas įtraukia platųjį nugaros raumenį, deltinius raumenis, trapeciją ir pagrindinius raumenis rotacijai. Stovint ant judančios platformos nuolat dirba kulkšnių, kelių ir klubų stabilizuojantys raumenys. Vidutinio intensyvumo nuolatinio irklavimo širdies ir kraujagyslių poreikiai suteikia aerobinį pasirengimą.
  solution: 'Struktūros sesijos: 5 min apšilimo irklavimas, 20 min pastovus irklavimas vidutiniu tempu, 15 min intervalinis irklavimas (30 sek. sprintas, 60 sek. lengvas), 10 min lentos pratimai (pritūpimai, įtūpstai, atsispaudimai), 5 min tempimas atvėsinimui.'
  recommendation: Naudokite Aquafarer SUP Explorer 11 fitneso irklavimui. Stabili platforma leidžia susitelkti į techniką ir intensyvumą. Dėvėkite Life Vest Pro dėl saugumo intensyvių treniruočių metu.
  faq:
    - q: Kiek kalorijų SUP sudegina?
      a: 400–700 kalorijų per valandą, priklausomai nuo intensyvumo, vėjo ir srovės. Intervalinis irklavimas didina kalorijų sudegimą.
    - q: Ar tai SUP naudinga svorio metimui?
      a: Taip, kartu su tinkama mityba. Viso kūno įsitraukimas ir mažo poveikio pobūdis leidžia reguliariai sportuoti.
    - q: Ar galiu daryti jėgos treniruotes ant SUP?
      a: Taip — pritūpimai, įtūpstai, atsispaudimai ir lentos pratimai ant lentos prideda pusiausvyros iššūkių jėgos pratimams.
    - q: Kokie raumenys SUP veikia?
      a: 'Pagrindiniai: pagrindiniai raumenys (įstrižiniai, skersiniai pilvo raumenys), nugara (nugaros raumenys, trapezonai), pečiai (deltiniai raumenys), rankos (bicepsai, tricepsai). Antriniai: kojos (keturgalviai, šlaunies raumenys, blauzdos).'
