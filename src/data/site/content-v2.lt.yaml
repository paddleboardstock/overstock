      a: Aquafarer Specializuojasi pripučiamose drop-stitch lentose ir šalto vandens hidrokostiumuose, siūlydama vidutines kainas su aukščiausios klasės funkcijomis, tokiomis kaip karinės klasės termo PVCpamušalai ir išsamūs priedų rinkiniai. Klientų atsiliepimai pabrėžia patvarumą ir kainos ir kokybės santykį.
