  type: tutorial
  title: 'Hidrokostiumo priežiūra: Padarykite savo neopreno efektą 2 kartus ilgesnį'
  description: Tinkama neopreno kostiumų priežiūra prailgina jo tarnavimo laiką nuo 1 iki 3 sezonų+. Neopreno hidrokostiumų skalavimo, džiovinimo, laikymo ir remonto patarimai. Venkite dažnų klaidų, kurios per anksti sugadina hidrokostiumus.
  definition: Nardymo kostiumo priežiūra apima skalavimą šviežiu vandeniu po kiekvieno naudojimo, džiovinimą nuo tiesioginių saulės spindulių, laikymą plokščią arba pakabintą ant plačios pakabos ir periodinį valymą, kad pašalintų druską, bakterijas ir kvapus.
  tldr: Po kiekvienos sesijos išplaukite nardymo kostiumą viduje ir išorėje šviežiu vandeniu. Džiovinkite viduje ir išorėje pavėsyje ant plačios plastikinės pakabos. Laikykite plokščiai arba sulankstytus vėsioje, sausoje vietoje. Niekada nepalikite hidrokostiumų tiesioginėje saulėje, karštuose automobiliuose ar džiovyklėse. Naudokite hidrokostiumo šampūną kas 5–10 seansų.
  problem: Po vieno sezono jūsų nardymo kostiumas pradeda kvepėti – neoprenas prarado elastingumą, siūlės lupasi, o užtrauktukai – visa tai galima išvengti tinkamai prižiūrint.
  explanation: Druskos kristalai įsigeria į neopreną ir trina medžiagą. Bakterijos dauginasi drėgnose patalpose, skleidžia kvapus ir skaido neopreną.UV Nyksta nailoninė danga. Virš 50°C temperatūra sukelia delaminaciją. Netinkamas džiovinimas iškraipo neopreną ir įtempia siūles.
  solution: 'Po kiekvienos sesijos: gerai išskalaukite viduje ir išorėje, apverskite iš vidaus į išorę, pakabinkite ant plačios plastikinės pakabos pavėsyje. Kai išdžius, apverskite dešine puse ir laikykite plokščiai. Kas 5–10 seansų: plaukite hidrokostiumo šampūnu. Kas mėnesį: sutepkite užtrauktuką užtrauktuko vašku.'
  recommendation: Valymui naudokite Aquafarer hidrokostiumo šampūną ir Aquafarer užtrauktuko vašką užtrauktuko priežiūrai. Laikykite ant Aquafarer plačios pakabos tinkliniame maišelyje.
  faq:
    - q: Ar galiu įdėti savo nardymo kostiumą į skalbimo mašiną?
      a: Nerekomenduojama — skalbimo mašinoje pažeidžia neopreną. Jei būtina, naudokite švelnų ciklą, šaltą vandenį ir tinklinį maišelį.
    - q: Kaip pašalinti kvapą iš savo nardymo kostiumo?
      a: Mirkykite šaltame vandenyje su hidrokostiumo šampūnu arba baltuoju actu 30 minučių. Gerai nuplaukite.
    - q: Kaip turėčiau išdžiovinti savo nardymo kostiumą?
      a: Išvirkščiai pavėsyje ant plačios, paminkštintos plastikinės pakabos. Venkite tiesioginių saulės spindulių ir metalinių pakabų.
    - q: Ar galiu pataisyti suplėšytą hidrokostiumą?
      a: Mažus plyšius, mažesnius nei 1\" storio, galima pataisyti neopreno cementu ir pleistru. Didesniems plyšimams gali prireikti profesionalaus remonto.
