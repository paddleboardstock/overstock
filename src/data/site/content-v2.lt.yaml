  title: 'Pripučiamų valčių priežiūra: išsaugokite savo investicijas'
  description: Metinis pripučiamų valčių priežiūros kontrolinis sąrašas. Valymas, UV apsauga, siūlių patikra, slėgio valdymas, variklio priežiūra ir žiemojimo paruošimas PVC Hypalon laivams.
  definition: Pripučiamų valčių priežiūra apima valymą, UV apsaugą, slėgio valdymą, siūlių ir vožtuvų patikrą, pelėsio prevenciją ir tinkamą laikymą ne sezono metu.
  tldr: Po kiekvieno naudojimo sūriame vandenyje skalaukite. Kas UV 2–3 mėnesius tepkite apsaugą. Prieš kiekvieną išėjimą patikrinkite pripūtimo slėgį. Kas mėnesį tikrinkite siūles, vožtuvus ir galinę dalį. Valykite švelniu muilu. Laikykite išpūstą vėsioje ir sausoje vietoje ne sezono metu.
  problem: Jūs naudojote pripučiamą valtį vieną sezoną, o dabar vamzdžiai atrodo išblukę, siūlė teka, o užpakalinė dalis jaučiasi kempinėta – visa tai galima išvengti reguliaria priežiūra.
  explanation: UV Spinduliuotė ardo polimero matricą. Sūrus vanduo kristalizuojasi klostėse ir trina audinį. Pelėsis auga įstrigusioje drėgmėje. Netinkamas slėgis sukelia medžiagos nuovargį. Užpakalinė dalis (ypač fanera) sugeria vandenį per varžtų skylutes.
  solution: 'Po kiekvieno naudojimo: nuplaukite šviežiu vandeniu, nusausinkite, patikrinkite slėgį. Kas mėnesį: valykite vamzdelius UV apsauginiu įrankiu, apžiūrėkite siūles, patikrinkite vožtuvą. Kasmet: gilus valymas, tikrinkite užpakalinę dalį dėl puvimo, tepkite vožtuvus, patikrinkite, ar nėra mikronuotėkių.'
  recommendation: Naudokite 303 aerospace Protectant ant Aquafarer valties vamzdžių. Nuimkite vožtuvus ir kasmet užtepkite silikoninį tepalą. Laikykite nešiojimo krepšyje su džiovyklių paketu.
  faq:
    - q: Ar galiu naudoti baliklį savo pripučiamai valčiai valyti?
      a: Ne — baliklis pažeidžia audinio dangą. Naudokite švelnų muilą ir šiltą vandenį. Pelėsiui gydyti naudokite praskiestą baltąjį actą.
    - q: Kaip dažnai turėčiau gydyti UV apsaugine priemone?
      a: Kas 2–3 mėnesius naudojimo sezono metu. Dažniau tropiniuose klimatuose.
    - q: Ar reikia išleisti valtį tarp naudojimų?
      a: Ne, jei naudoji kas savaitę. Palik pripūstą su UV uždėtu dangteliu. Mėnesio tarpams – išpilk ir laikyk.
    - q: Kaip prižiūrėti transomą?
      a: Kas mėnesį tikrinkite varžtus. Kasmet užsandarinkite atvirus medžio kraštus jūriniu laku. Jei atsiranda minkštų vietų, keiskite.
