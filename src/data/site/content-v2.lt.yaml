- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hidratacija ir apsauga nuo saulės: būkite saugūs vandenyje'
  description: Būtinos hidratacijos ir saulės apsaugos strategijos SUP irkluotojams. Dehidratacija ir saulės nudegimai yra dažniausios SUP problemos – kaip išvengti abiejų per ilgus seansus.
  definition: SUP Hidratacija reiškia skysčių balanso palaikymą irkluojant reguliariai geriant vandenį. Apsauga nuo saulės apima SPF naudojimą, apsauginius drabužius ir laiko matavimo sesijas, kad būtų išvengta pikoUV.
  tldr: Gerkite 500 ml vandens per valandą irklavimo. Pasiimkite daugiau, nei manote, kad reikia – 2 litrų šlapimo pūslę arba kelis butelius. Prieš irklavimą užtepkite vandeniui atsparų SPF 50+ kremą nuo saulės ir tepkite kas 2 valandas. Dėvėkite kepurę, akinius nuo saulės su dirželiais ir UPF reitingo drabužius. Venkite irklavimo nuo 11 val. iki 15 val., kai UV stipriausia.
  problem: Jūs turite puikią SUP sesiją, bet po valandos jaučiate galvos skausmą, burnos džiūvimą ir odą deginančią. Dehidratacija ir saulės nudegimai užklumpa netikėtai, nes vanduo jus vėsina.
  explanation: Atspindys nuo vandens sustiprina UV poveikį iki 40%. Vandens ir vėjo vėsinantis poveikis maskuoja saulės nudegimus iki per vėlu. Prakaitas irkluojant didina skysčių netekimą, o dažnai nėra kur papildyti vandens ant vandens. Dehidratacija trikdo pusiausvyrą ir sprendimų priėmimą, didindama nelaimingų atsitikimų riziką.
  solution: Prie lentos bungee sistemos pritvirtinkite vandens butelį arba hidratacijos pūslę. Gerkite kas 15 minučių, nesvarbu, ar jaučiate troškulį, ar ne. Tepkite SPF 50+ kremą nuo saulės 30 minučių prieš paleidimą. Dėvėkite plačiabrylę kepurę, poliarizuotus akinius su dirželiu ir UPF 50 apsauginį+ marškinėlį nuo trinties. Pakartotinai tepkite apsauginį kremą nuo saulės kas 2 valandas.
  recommendation: Naudokite hidratacijos pūslę, pritvirtintą prie priekinių D formos žiedų Aquafarer SUP. Po+ savo . dėvėkite UPF 50 apsauginį marškinėlį nuo trinties. PFDNaudokite vandeniui atsparų apsauginį kremą nuo saulės, kuris laikosi prakaito ir vandens metu.
  faq:
    - q: Kiek vandens turėčiau pasiimti SUP kelionės metu?
      a: Mažiausiai 1 litras per valandą. 2 valandų sesijai pasiimkite 2 litrus. Daugiau karštu oru. Geriausia naudoti hidratacijos pūslę.
    - q: Koks kremas nuo saulės yra geriausiasSUP?
      a: Atsparūs vandeniui, SPF 50+ plataus spektro. Mineraliniai kremai nuo saulės (cinko oksidas, titano dioksidas) yra saugūs rifams ir išlieka ilgiau.
    - q: Ar vanduo tikrai atspindi UVšviesą?
      a: Taip — vanduo atspindi iki 40% UV radiacijos, tai reiškia, kad ją gaunate UV iš viršaus ir apačios. Tai žymiai padidina nudegimų riziką.
    - q: Ar galiu nudegti saulėje dėvėdamas marškinėlius nuo trinties marškinėlių?
      a: Standartiniai apsauginiai marškinėliai nuo trinties suteikia minimalų UV apsaugą (apie UPF 10-20). Ieškokite UPF 50+ reitingo drabužių, jei norite pilnos apsaugos.
