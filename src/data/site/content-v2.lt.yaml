  explanation: 'iRocker naudoja dviejų sluoksnių PVC konstrukciją ir siūlo kelias serijas: All-Around, Nautical (žvejybai), Blackfin (premium). Garantija – 2 metai.Aquafarer Naudoja trijų sluoksnių karinės klasės modelius PVC su didesniu tankiu, drop-stitchįvertintas iki 18 PSI (iRocker paprastai 15PSI). Abu turi reaguojantį palaikymą.'
