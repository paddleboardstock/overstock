- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Savęs gelbėjimas: kaip vėl užlipti ant lentos gilioje vandenyje'
  description: Kiekvienas SUP irkluotojas turėtų įvaldyti savęs gelbėjimą. Žingsnis po žingsnio – kaip vėl užtvirtinti lentą giliame vandenyje, nutempti ją į krantą ir spręsti pavadėlio susipainiojimus.
  definition: SUP Savęs gelbėjimas – tai technika, kai po nukritimo vėl pritvirtinama irklentė į gilų vandenį, įskaitant lentos atkūrimą, kūno užlipimą ir irklų ištraukimą.
  tldr: 'Po kritimo: išlikite ramūs, laikykite irklą, plaukite prie lentos. Padėkite irklą per lentą. Naudokite delfino spyrį, kad krūtinė atsitrenktų į lentą. Pakelkite vieną koją, tada kitą. Pirmiausia klūpėkite, tada atsistokite. Praktikuokite ramioje vandenyje, kol tai taps raumenų atmintimi.'
  problem: Giliai vandenyje nukrenti ir SUP negali vėl užlipti. Lenta slidi, esi pavargęs, ir apima panika. Nežinant savęs gelbėjimo technikos, paprastas kritimas tampa pavojingas.
  explanation: 'Savarankiškas gelbėjimasis turi tris etapus: atsigavimą (plaukimas iki lentos ir irklavimo), vėl užlipimas ant lentos (grįžimas ant lentos) ir tęsimas (tęsinys irklavimas). Pagrindinė technika – naudoti irklą kaip stabilizatorių ir galingus kojų spyrimus, kad viršutinė kūno dalis būtų stumiama ant lentos.'
  solution: '1 etapas: plaukti iki lentos. Laikyti irklą arba jį atnešti. 2 etapas: padėti irklą statmenai per lentą. Stipriai spardyti kojas, traukiant krūtinę į lentos centrą. 3 etapas: kai krūtinė jau ant lentos, po vieną pakelkite kojas. 4 etapas: klūpėkite, atgaukite kvapą, tada pamažu atsistokite.'
  recommendation: Praktikuokite savarankišką gelbėjimąsi kontroliuojamomis sąlygomis, kol galėsite tai padaryti be apmąstymų. Naudokite Aquafarer SUP Explorer 11, kuris turi gerą sukibimą ant denio. Life Vest Pro suteikia papildomą plūduriavimą, jei sunku.
  faq:
    - q: Kaip vėl pradėti vartoti, jei esu išsekęs?
      a: Laikykis prie lentos, kad išlaikytum plūduriavimą. Naudok rankas, kad pritrauktum krūtinę ant lentos, net jei kojos negali efektyviai spardytis. Ilsėkis klūpėdamas prieš atsistodamas.
    - q: O jei prarasiu mentelę?
      a: Naudokite rankas, kad irkluotumėte lentą į krantą. Paprašykite kito irkluotojo pagalbos. Nedelsiant pakeiskite pamestą irklą.
    - q: Ar galiu išsigelbėti bangomis?
      a: Taip — lentą statmenai bangoms. Laiku vėl užlipkite tarp bangų. Pavadėlis laiko lentą šalia.
    - q: Kaip susitvarkyti su pavadėlio susipainiojimu?
      a: Išlikite ramūs, plūduriuokite ant nugaros, lėtai išpainiokite pavadėlį. Jei pavadėlis apvyniotas aplink pelekus, vandenyje gali tekti juos nusiimti.
