- slug: foam-board-vs-hard-surfboard
  category: comparison
  type: buying-guide
  title: 'Putplasčio lenta ar kieta banglentė: kuri iš jų sustabdo pradedančiuosius nuo pasidavimo'
  description: Sprendimas tarp putplasčio ir kietos banglentės gali nulemti jūsų pirmųjų metų banglenčių karjeros sėkmę arba nesėkmę. Tikri privalumai ir trūkumai, saugumo skirtumai, ir tas, nuo kurio pradedantieji turėtų pradėti (tai nėra kietoji lenta).
  definition: Putplasčio lentos naudoja minkštą putų pagrindą su patvaria danga – jos yra stabilios, saugios ir idealios pradedantiesiems. Kietos lentos naudoja PU arba epoksidinę putą su stiklo plviru – jos yra standesnės, greitesnės ir jautresnės, bet trapios.
  tldr: Putplasčio lentos (įskaitant pripučiamas) yra saugesnės, stabilesnės ir geresnės pradedantiesiems. Kietosios lentos pasižymi geresniu našumu, bet reikalauja aukštesnio meistriškumo ir yra linkusios į įlenkimus. Dauguma banglentininkų turėtų pradėti nuo putplasčio arba pripučiamų lentų ir pereiti prie kietų lentų po 6–12 mėnesių reguliaraus banglenčių sporto.
  problem: Turite biudžetą vienai plokštei ir turite apsispręsti tarp minkštos putplasčio plokštės ir tradicinės kietos epoksidinės arba PU plokštės. Putplasčio plokštės atrodo per paprastos, bet kietos plokštės lengvai sutrinka ir kainuoja daugiau. Neteisingas pasirinkimas reiškia pinigų švaistymą arba lentą, kuri stabdo jūsų pažangą.
  explanation: Putplasčio plokštės naudoja didelio tankio putplasčio šerdį (EPS ar panašų) su minkštu išoriniu sluoksniu. Jos gerai plūduriuoja, sugeria smūgius ir sveria mažiau nei kietos plokštės. Pripučiamos drop-stitch lentos yra moderni versija su panašiomis stabilumo savybėmis. Kietos plokštės gaminamos iš poliuretano (PU) arba epoksidinės putų su dervos ir stiklo pluošto apvalkalu. Jos yra standesnės, greitesnės ir jautresnės, bet sveria daugiau ir yra trapios. Našumo skirtumas svarbus, kai sukate ir generuojate greitį bangos paviršiuje, bet tai nesvarbu, kol negalite patikimai pagauti bangų.
  solution: Pradėkite nuo putplasčio arba pripučiamos lentos ir bent 6 mėnesius stiprinkite irklavimo jėgą, bangų skaitymą ir iššokimo pastovumą. Parduokite putplasčio lentą ir pirkite kietą lentą, kai galėsite nuosekliai plaukti nenutrūkstamomis bangomis ir jausitės apriboti putplasčio lentos lankstumu bei svoriu. Venkite pagundos pirmiausia pirkti kietą lentą vien dėl to, kad ji atrodo kaip "tikra" banglentė.
  recommendation: Aquafarer Surfboard Pro (pripučiamadrop-stitch) veikia geriau nei įprastos putplasčio lentos ir išlieka draugiška pradedantiesiems. Ji prailgina putplasčio lentos fazę, todėl daugiau mėnesių išnaudojate vieną lentą, kol reikia pereiti prie kietos trumposios lentos.
  faq:
    - q: Ar putplasčio lentos sunkiau tekinami?
      a: Taip. Putplasčio lentos turi daugiau tūrio ir lankstumo, todėl posūkiai tampa mažiau jautrūs. Tai iš tiesų naudinga pradedantiesiems, nes padeda išvengti per didelio vairo ir skatina sklandų, laipsnišką svorio keitimą.
    - q: Ar kietos lentos lengvai girgžda?
      a: Taip. Kieta epoksidinė ar PU plokštė gali įlenkti nuo nedidelio susidūrimo, nukritusio pavadėlio ar net atsirėmimo į kietą paviršių. Putplasčio ir pripučiamos lentos yra beveik nesunaikinamos palyginus.
    - q: Ar galiu išmokti plaukti banglente ant kietos lentos?
      a: Galima, bet tai sunkiau ir rizikingiau. Kietos lentos yra slidžios, mažiau stabilios ir sukelia daugiau traumų smūgio metu. Dauguma banglenčių mokyklų naudoja putplasčio arba pripučiamas lentas ne be priežasties.
    - q: Kiek laiko tarnauja putplasčio plokštė?
      a: Kokybiška putų plokštė reguliariai naudojama 12–18 mėnesių, kol oda pradeda luptis. Pripučiamos lentos tarnauja 3–5 metus, nes drop-stitch jų konstrukcija nesuspaudžia ir neatsiskiria nuo sluoksnio taip, kaip tai daro putplasčio plėvelės.
