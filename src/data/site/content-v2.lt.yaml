  title: 'SUP Inkarų gidas: Likite vietoje žvejojant ar fotografuojant'
  description: Išsamus SUP inkaravimo vadovas — inkarų tipai (grybai, sulankstomi, kuoliukai), inkarų vežimėlio paruošimas, išskleidimo technikos ir saugumo aspektai, norint išlikti vietoje.
  definition: SUP Inkaras yra svoris, pritvirtintas prie virvės, kuris laiko lentą vietoje prieš vėją ir srovę. Dažniausi tipai yra grybo formos inkarai, sulankstomi inkarai ir stebėjimo stulpai.
  tldr: Naudok grybo formos inkarą (1,5–3 svarų) purvinam ar smėlingam dugnui, sulankstomą inkarą uolėtiems dugnams arba stebėjimo stulpą sekliems vandenims su minkštu dugnu. Inkaras turėtų sverti 1,5–3 svarus ramiomis sąlygomis, 3–5 svarus vėjui ir srovei. Visada naudok inkarinį vežimėlį, kad reguliuotum padėtį ir žinotum, kada atleisti.
  problem: Randi tobulą žvejybos vietą, bet vėjas ir srovė kas kelias minutes nukreipia tave nuo pozicijos. Be inkaravimo, SUP žvejyba ir fotografija yra varginančios nuolatinės pozicijos keitimo užduotys.
  explanation: Inkaras veikia vilkdamas dugną, kol užkliūna. Grybiniai inkarai įsikasa į minkštą dugną ir gerai laikosi smėlyje bei dumble. Sulankstomi inkarai turi uodegas, kurios įsirėžia į kietą ar akmenuotą dugną. Stebėjimo stulpai veikia seklioje vandenyje, stumdami tiesiai į dugną.
  solution: Įrenkite inkarinę troleibuso sistemą (virvę su slankiojančiu žiedu vienoje lentos pusėje), kad reguliuotumėte tvirtinimo tašką. Pririškite 50–75 pėdų virvės prie inkaravimo. Išskleiskite ją prieš vėją arba prieš srovę nuo norimos vietos. Naudokite greito atleidimo sistemą avarinėms situacijoms atjungti. Niekada neinkaruokite stiprioje srovėje arba ten, kur negalite lengvai atgauti inkarą.
  recommendation: 3 svarų sulankstomas inkaras su 50 pėdų virve tinka daugumai SUP žvejybos sąlygų. Pridėkite inkarų vežimėlio sistemą naudodami D formos žiedus ant savo Aquafarer SUP Explorer 11.
  faq:
    - q: Kokio dydžio inkarą man reikiaSUP?
      a: 1,5–3 svarai ramiems ežerams ir lėtoms upėms. 3–5 svarai pakrantės zonoms su vėju ar srove. Per didelius inkarus sunku ištraukti.
    - q: Kiek inkarinės virvės man reikia?
      a: 5:1 taikiklis (5 pėdos valo kiekvienam 1 pėdai gylio) yra standartas. 10 pėdų vandenyje naudokite 50 pėdų valo.
    - q: Ar inkaravimas pavojingas SUP?
      a: Tik jei inkaruosi srovėje ar vėjyje, kuris gali apvirsti lentą. Visada naudok greito atleidimo sistemą, kurią galima akimirksniu atjungti.
    - q: Ar galiu inkaruotis bet kuriame vandenyje?
      a: Patikrinkite vietinius reglamentus. Kai kuriose vietovėse inkaravimas ribojamas, siekiant apsaugoti jūržoles ar jūrines buveines. Niekada neinkaruokite ant koralinių rifų.
