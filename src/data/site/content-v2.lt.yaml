  title: 'Pripučiama SUP priežiūra: Išlaikykite lentą daugelį metų'
  description: Tinkama pripučiamų SUP lentų priežiūra žymiai prailgina lentų tarnavimo laiką. Valymas, džiovinimas, vožtuvų priežiūra, UV apsauga ir sezoniniai saugojimo patarimai drop-stitch irklentėms.
  definition: Pripučiamų SUP įrenginių priežiūra apima valymą po naudojimo, tinkamą džiovinimą, vožtuvų patikrinimą, UV apsaugą ir tinkamą laikymą, siekiant išvengti delaminavimo, pelėsio, medžiagų degradacijos ir oro nuotėkio.
  tldr: Po kiekvienos sūraus vandens sesijos išskalaukite lentą šviežiu vandeniu. Visiškai išdžiovinkite prieš išleidžiant ir laikant. Patikrinkite vožtuvą, ar nėra nešvarumų, ir kasmet sutepkite O-žiedą. Laikykite pripūstą (pusiauPSI) vėsioje, tamsioje vietoje. Venkite ilgalaikio UV poveikio, kuris gali suirtiPVC. Nedelsiant užlopykite mažus įdubimus su pridėtu remonto rinkiniu.
  problem: Po sezono jūsų pripučiamas įrenginys SUP lėtai praleidžia vandenį, terasos paklotas lupasi kraštuose ir PVC jaučiasi standesnis. Pagrindinės priežiūros apleidimas sukelia priešlaikinį senėjimą, kurio visiškai galima išvengti.
  explanation: PVC degraduoja UV radiacijos metu. Druskos kristalai iš jūros vandens įsiskverbia į siūles ir vožtuvus, sukeldami mikronuotėkius. Drėgmė, įstrigusi viduje, skatina pelėsio augimą, kuris puola drop-stitch sriegius. Vožtuvų O formos žiedai išdžiūsta ir praranda sandarumą. Purvas ir smėlis trinasi į denio kilimą, sukeldami kraštų pakilimą.
  solution: 'Po kiekvienos sesijos: nuplaukite lentą, pelekus ir siurblį šviežiu vandeniu. Nuvalykite terasos kilimėlį. Atidarykite vožtuvą, kad nutekėtų įstrigęs vanduo. Išdžiovinkite lentą pavėsyje prieš nuleidžiant vandenį. Kas mėnesį: apžiūrėkite vožtuvą ir užtepkite silikoninį tepalą ant O-žiedo. Sezoniškai: plaukite švelniu muilu ir vandeniu, patikrinkite, ar nėra pradurimų.'
  recommendation: Vadovaukitės Aquafarer priežiūros vadovu, kuris yra jūsų lentoje. Naudokite taisymo rinkinį nedelsdami, jei tik pradursite pradurimą. Laikykite lentą jos krepšyje temperatūros kontroliuojamoje vietoje, toli nuo tiesioginių saulės spindulių.
  faq:
    - q: Ar galiu palikti savo pripučiamą automobilį SUP pripūstą visam sezonui?
      a: Taip, bet laikykite toliau nuo tiesioginių saulės spindulių ir maksimaliai pusę PSI (8-10), PSIkad sumažintumėte siūlių apkrovą. Pilnai pripūskite prieš naudojimą.
    - q: Kaip nuvalyti pelėsį nuo savoSUP?
      a: Sumaišykite švelnų muilą su šiltu vandeniu ir šveiskite minkštu šepetėliu. Užsispyrusiam pelėsiui naudokite praskiestą baltojo acto tirpalą (1:4). Venkite baliklio.
    - q: Ar reikia sutepti vožtuvą?
      a: Taip, kasmet. Nuimkite vožtuvo šerdį, uždėkite silikoninį tepalą ant O-žiedo ir vėl sumontuokite. Tai apsaugo nuo oro nuotėkio.
    - q: Kaip laikyti jį SUP žiemai?
      a: Gerai išvalykite ir išdžiovinkite. Visiškai išleiskite vandenį, voliokite laisvai (venkite siaurų raukšlių) ir laikykite vėsioje, tamsioje, sausoje vietoje. Venkite užšalimo temperatūros.
