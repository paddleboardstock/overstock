- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard prieš shortboard (Sąžiningas atsakymas, kurio niekas neduoda)
  description: Longboardai pagauna daugiau bangų; shortboardai sukasi stipriau. Tikrasis klausimas – kuris atitinka tavo įgūdžius ir vietinius lūžius. Sąžiningas palyginimas, apimantis stabilumą, bangų skaičių ir progresijos spąstus.
  definition: Longboardai (9 pėdos+) prioritetą teikia stabilumui ir bangų gaudymo lengvumui; trumpieji bortai (5–7 pėdos) prioritetą teikia manevringumui ir našumui stačiose bangose. Tinkamas pasirinkimas priklauso nuo jūsų įgūdžių lygio ir vietinių bangų tipų.
  tldr: Longboardai (9 pėdos+) yra stabilūs, lengvai pagauna bangas ir tinka pradedantiesiems bei kruizo mėgėjams. Trumpieji bortai (5–7 pėdos) yra jautrūs, greitesni bangos paviršiuje ir tinka pažengusiems banglentininkams. Tinkamas pasirinkimas priklauso nuo jūsų įgūdžių lygio, bangų tipo ir to, kas jums labiausiai patinka banglenčių sporte.
  problem: Matote vaizdo įrašus, kuriuose banglentininkai staigiai sukasi su trumpomis lentomis, o ilgųjų lentų sportininkai grakščiai slysta nosimi – abu atrodo smagūs. Biudžetą turite tik vienam lentų tipui ir turite žinoti, kuris stilius atitinka jūsų tikslus ir vietinius lūžius.
  explanation: 'Longboardai turi didesnį paviršiaus plotą, tai reiškia, kad jie irkluoja greičiau, anksčiau pagauna bangas ir suteikia stabilią platformą vaikščiojimui bei kryžminiams žingsniams. Jie puikiai tinka mažoms, lėtoms bangoms, kur trumpoji lenta nuskęstų. Trumposios lentos turi mažesnį tūrį ir agresyvesnį sūpynę, leidžiančią joms giliau įsiskverbti į bangos paviršių, generuoti greitį posūkiuose ir tilpti į stačias, tuščiavidures atkarpas. Trumposios lentos reikalauja stipraus irklavimo ir tikslaus bangų laiko parinkimo. Dažna klaidinga nuomonė: trumposios lentos nėra "geresnės" – jos tiesiog skirtingi įrankiai skirtingoms sąlygoms ir įgūdžių lygiams.'
  solution: Jei esate pradedantysis, važinėkite longboardu (arba didelio tūrio pripučiama banglente) bent 6 mėnesius. Jei esate vidutinio lygio ir vietinės bangos dažnai mažos ir lėtos, longboardas arba hibridas pagaus daugiau bangų ir bus smagiau. Jei jūsų bangos yra statios, tuščiavidurės ir greitos, trumpoji lenta tampa būtina, kad tilptumėte į kišenę. Daugelis vidutinio lygio banglentininkų laikosi abiejų ir renkasi pagal dieną.
  recommendation: Pradėkite nuo Aquafarer Surfboard Pro kaip savo longboardo tipo platformos. Kai nuolat sukate ir generuojate greitį, apsvarstykite galimybę pridėti hibridinę arba trumpąją lentą stačių bangų dienoms. Dauguma banglentininkų, kurie per anksti bando trumpąją lentą, nusivilia ir važiuoja mažiau bangų.
  faq:
    - q: Ar longboard yra lengviau važiuoti nei shortboard?
      a: Žymiai lengviau. Longboard'ai anksčiau pagauna bangas, irkluoja greičiau ir yra stabilesni pop-up ir trim'o metu. Shortboard'ai reikalauja tikslaus laiko parinkimo, stipresnio irklavimo ir geresnio bangų sprendimo.
    - q: Ar galima atlikti posūkius ant longboard'o?
      a: Taip, nors stilius kitoks. Longboard posūkiai yra platesni, sklandesni ir apima visą kūną. Nosies važiavimas, cutback ir hang-five yra longboard specifiniai manevrai su savo įgūdžių progresu.
    - q: Kuri lenta geresnė mažoms bangoms?
      a: Longbordai ir hibridai geriau veikia mažose, silpnose bangose, nes jie sukuria slydimą ir išlaiko pagreitį. Trumpiesiems banglentėms reikia statesnių ir galingesnių bangų.
    - q: Ar shortboard sunkiau irkluoti?
      a: Žymiai sunkiau. Mažesnis tūris reiškia, kad lenta sėdi žemiau vandenyje, sukuriant didesnį pasipriešinimą. Irklavimas trumpąja lenta yra kaip plaukimas su stabdymo parašiutu, palyginti su irklavimu su ilga lenta.
