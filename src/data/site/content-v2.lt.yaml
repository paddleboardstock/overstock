  description: Išsamus siurblių gidas SUP — rankiniai dviejų kamerų, vienos kameros ir elektriniai siurbliai. Kaip išsirinkti geriausią siurblį pagal savo poreikius, priežiūros patarimai ir pripūtimo metodai.
  definition: SUP Siurblys yra įrenginys, naudojamas pripūsti pripučiamas irklentes iki reikiamo slėgio (dažniausiai 15–20PSI). Tipai apima rankinius vienos kameros, rankinius dviejų kamerų ir elektrinius siurblius.
  tldr: Dviejų kamerų rankiniai siurbliai yra standartas kokybiškiems iSUP — jie pripučiami dvigubai greičiau nei vienos kameros. Elektriniai siurbliai pripučiasi be pastangų, tačiau reikalauja baterijos energijos ir prie maksimumo pripučiami lėčiauPSI. Rankiniai siurbliai yra patikimesni ir nereikalauja baterijų. Rinkitės dviejų kamerų mechaninį dėl patikimumo, elektrinį dėl patogumo.
  problem: Pripūtimas SUP užtrunka per ilgai arba reikalauja per daug pastangų. Prastos kokybės pompa daro pripūtimą varginančiu darbu, kuris atgraso nuo spontaniškų irklavimo sesijų.
  explanation: Vienos kameros siurbliai orą perkelia tik žemyn eigos eigoje — jiems pripučia per 10–15 minučiųSUP. Dviejų kamerų siurbliai naudoja abi kameras dideliam tūriui pradinio pripūtimo metu (užpildant plokštę) ir pereina prie vienos aukšto slėgio kameros galutiniam slėgiui. Tai sumažina pripūtimo laiką iki 3–5 minučių. Elektriniai siurbliai naudoja 12V galią ir automatiškai pripučiasi, tačiau žymiai sulėtėja didėjant slėgiui.
  solution: Daugumai vartotojų komplekte esantis dviejų kamerų siurblys užtikrina geriausią greičio, patikimumo ir nulinės priklausomybės nuo baterijų balansą. Jei SUP dažnai naudojate arba turite fizinių apribojimų, apsvarstykite elektrinį siurblį. Visada turėkite rankinį siurblį kaip atsarginį variantą, net jei daugiausia naudojate elektrinį siurblį.
  recommendation: Aquafarer Dviejų kamerų siurblys, komplektuojamas su visomis plokštėmis, yra puikus – jis išsipučia iki 15 per PSI mažiau nei 4 minutes. Laikykite vožtuvą suteptą ir kasmet tikrinkite slėgio matuoklį.
  faq:
    - q: Kuris greitesnis – mechaninis ar elektrinis?
      a: Rankiniai dviejų kamerų siurbliai (3–5 minutės) dažnai būna greitesni nei elektriniai (5–10 minučių), nes elektriniai siurbliai žymiai sulėtėja esant aukštam slėgiui.
    - q: Ar galiu naudoti automobilio padangų siurblį savo SUPreikmėms?
      a: Ne — padangų siurbliai juda mažais kiekiais esant labai dideliam slėgiui.SUP Siurbliai reikalauja didelio tūrio esant vidutiniam slėgiui.
    - q: Kaip sužinoti, kada mano pompai reikia priežiūros?
      a: Jei pumpavimas atrodo sunkesnis nei įprastai, slėgis pasiekia plokščią lygį prieš pasiekiant maksimumą PSIarba matuoklis rodo nenuosekliai, patikrinkite O-žiedus ir vožtuvų jungtis.
    - q: Ar elektriniai siurbliai pažeidžia plokštę?
      a: Ne, jei jie turi automatinį išjungimą nustatytu slėgiu. Nuolatinis pumpavimas virš maksimalaus PSI gali drop-stitch pažeisti sriegius.
