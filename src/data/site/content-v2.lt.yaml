  title: '3 mm prieš 5 mm hidrokostiumą: ką dauguma pradedančiųjų supranta neteisingai šaltame vandenyje'
  description: Nustokite užšalti sesijos viduryje ar perkaisti paplūdimyje. Tikrasis skirtumas tarp 3 mm ir 5 mm hidrokostiumų – temperatūros lentelė, lankstumo kompromisai ir tai, kas iš tikrųjų tinka šalto vandens banglenčių sportui.
  definition: Neopreno kostiumas yra neopreno drabužis, kuris sulaiko ploną vandens sluoksnį prie odos, kurį kūno šiluma sušildo izoliacijai. Storis (3 mm, 5 mm) lemia temperatūros diapazoną, kurį kostiumas gali atlaikyti – storesnis yra šiltesnis, bet mažiau lankstus.
  tldr: Neopreninio kostiumo storis tiesiogiai lemia šilumą ir lankstumą. Naudokite 3 mm vandenį virš 16°C ir 5 mm vandeniui tarp 8°C ir 16 °C. Storesni kostiumai riboja judėjimą, bet ilgiau išlaiko šilumą – visada prioritetą teikite prigludimui, o ne prekės ženklui.
  problem: Atidarote internetinę parduotuvę arba užeinate į banglenčių parduotuvę ir matote hidrokostiumus, pažymėtus 3/2, 4/3, 5/4 ir 5 mm pilnais kostiumais. Skaičiai daug nereiškia, kol nesuprantate, kad netinkamas storis reiškia arba užšalimą sesijos viduryje, arba perkaitimą ir prakaitavimą paplūdimyje.
  explanation: Hidrokostiumai veikia sulaikydami ploną vandens sluoksnį tarp odos ir neopreno; jūsų kūnas šildo tą vandenį, sukurdamas izoliaciją. Storesnis neoprenas sulaiko daugiau vandens, bet riboja lankstumą ir plūdrumą. 3 mm kostiumas (dažnai 3/2 su plonesnėmis rankovėmis) tinka švelnioms sąlygoms, o 5 mm (5/4/3 arba pilnas 5 mm) – šaltam vandeniui. Krūtinės užtrauktuko užtrauktukai geriau sandarina nei nugaros užtrauktukas ir sumažina paraudimą. Siūlės konstrukcija – klijuota ir aklai siūta (GBS) – yra skirtumas tarp pratekančio kostiumo ir šilto.
  solution: Suderinkite storį su vietine vandens temperatūra su 5°C paklaida. Vidutinio klimato zonoms pirkite 3/2 mm. Šaltam vandeniui pirkite 5/4/3 mm. Pridėkite batus, pirštines ir gobtuvą, kad sumažintumėte savo diapazoną dar 5°C. Prieš pirkdami išbandykite kostiumus arba pasirinkite prekės ženklą su dosnia grąžinimo politika.
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm dydžio yra idealus daugumai šalto vandens banglentininkų, siūlantis GBS siūles ir termo pamušalą. Jei banglentinėjate šiltame vandenyje virš 20°C, geresnis pasirinkimas yra 3/2mm su krūtinės užtrauktuku.
  faq:
    - q: Kokia vandens temperatūra reikalauja 5 mm hidrokostiumo?
      a: Vandens temperatūra tarp 8°C ir 14°C reikalauja 5 mm kostiumo. Žemiau 8°C reikia 6/5/4 mm gobtuvo kostiumo. Tarp 14°C ir 18°C 4/3 mm tinka daugumai žmonių.
    - q: Ar žiemą galiu dėvėti 3 mm hidrokostiumą?
      a: Tik švelniuose žiemos klimatuose, kur vanduo laikosi virš 16°C. Tikram žiemos banglenčių sportui reikia 5 mm arba 5/4/3 mm. Batai, pirštinės ir gobtuvas suteikia tiek pat šilumos, bet nereikia storesnio liemens.
    - q: Kiek aptemptas turėtų būti hidrokostiumas?
      a: Tvirtai, bet ne varžančiai. Neturėtų būti oro kišenių ar laisvo neopreno. Jei galite įkišti pirštą tarp odos ir kostiumo apatinėje nugaros dalyje, jis per laisvas. Jei kvėpuoti sunku arba judesiai labai riboti, rinkitės didesnį dydį.
    - q: Ar brangūs hidrokostiumai palaiko šilumą?
      a: Didesnė kaina dažnai reiškia geresnį neopreno (kalkakmenio pagrindu pagamintas prieš naftos), geresnę siūlių konstrukciją (GBS prieš tik klijuotą) ir geresnį lankstumą. Šie veiksniai tiesiogiai veikia šilumą ir ilgaamžiškumą, bet tik jei prigludimas yra tinkamas.
