  title: Ką dėvėti banglenčių sportui (neik su boardo šortais, kai reikia 5/4)
  description: Nustok spėlioti, ką apsirengti. Vandens temperatūra, o ne oro temperatūra lemia tavo banglenčių aprangą. Išsamus sluoksniavimo gidas nuo tropinių marškinėlių nuo trinties iki pilnų žiemos 5/4/3 mm komplektų.
  definition: Banglenčių apranga svyruoja nuo šortų ir marškinėlių šiltame vandenyje iki pilnų 5/4/3 mm hidrokostiumų su batais ir gobtuvais šaltame vandenyje. Vandens temperatūra, o ne oro temperatūra, lemia, ko jums reikia.
  tldr: Ką dėvite banglenčių sporte, visiškai priklauso nuo vandens temperatūros – ne nuo oro temperatūros. Apsauginiai marškinėliai nuo trinties ir šortai tinka virš 22°C, spyruokliniai kostiumai – 18–22°C, pilni 3/2 mm kostiumai – 14–18 °C, o 5/4/3 mm su batais – žemiau 14 °C. Visada dėvėkite UV apsaugą ir apsvarstykite galimybę dėvėti pavadėlį bei smūginę liemenę.
  problem: Atvyksti į paplūdimį ir nežinai, ar pakanka apsauginio marškinėlių nuo trinties, ar reikia pilno hidrokostiumo. Oro temperatūra šilta, bet vanduo šaltas, arba vanduo jaučiasi gerai, bet vėjas šaltas. Netinkama apranga reiškia sugadintą sesiją.
  explanation: 'Banglenčių apranga turi tris paskirtis: šiluminę izoliaciją, UV apsaugą ir trinties prevenciją. Neopreno hidrokostiumai vertinami pagal storį ir padengimą – spyruokliniai kostiumai (trumpi rankos ar kojos) skirti ribinėms dienoms, pilni – šaltam vandeniui. Apsauginiai nuo trinties apsaugo nuo banglenčių bėrimų ir saulės, bet neturi šiluminės vertės. Batai, pirštinės ir gobtuvai nėra aksesuarai, o būtina įranga šalto vandens banglenčių sportui žemiau 12°C.'
  solution: 'Prieš išvykdami patikrinkite vietinį plūdurą arba gyvo vandens temperatūros ataskaitą. Pasidarykite rinkinį pagal šalčiausią įprastą būklę: vasarai – apsauginiai marškinėliai nuo trinties ir šortai, pavasariui ir rudeniui – 3/2 mm pilnas kostiumas, žiemai – 5/4/3 mm su batais ir gobtuvu. Visada pridėkite pavadėlį ir apsvarstykite plūduriuojančią liemenę dėl saugumo.'
  recommendation: Pirmiausia investuokite į gerą 3/2 mm pilną kostiumą – jis tinka plačiausioms sąlygoms. Jei planuojate banglentinėti žiemą, pridėkite 5/4/3 mm kostiumą ir batus. Aquafarer Hidrokostiumas Pro su termo pamušalu efektyviai sujungia abu temperatūrų diapazonus.
  faq:
    - q: Ar galiu plaukti banglente tik su šortais?
      a: Taip, tropiniame vandenyje virš 24°C. Galbūt norėsite dėvėti apsauginius marškinėlius nuo trinties krūtinės ir rankų. Vaškas arba traukos pagalvėlė ant lentos padeda kompensuoti trūkstamą kostiumo sukibimą.
    - q: Ar man reikia banglenčių batų?
      a: Jei vandens temperatūra nukrenta žemiau 14°C, batai apsaugo nuo nutirpimo ir apsaugo pėdas nuo akmenų bei rifų įpjovų. Jie taip pat pagerina sukibimą su lenta. Dauguma banglentininkų šiauriniuose klimatuose batus nešioja nuo lapkričio iki kovo.
    - q: Kas yra pavasarinis kostiumas?
      a: Spyruoklinis kostiumas yra trumpų arba trumpų kojų hidrokostiumas (arba abu), skirtas vandeniui tarp 18°C ir 22°C. Jis suteikia daugiau šilumos nei apsauginis marškinėlis nuo trinties, bet mažiau dengia nei pilnas kostiumas.
    - q: Ar turėčiau dėvėti gelbėjimosi liemenę banglenčių sporte?
      a: Ne tradicinės gelbėjimosi liemenės, bet smūgio liemenė ar plūduriavimo priemonė gali padėti sudėtingomis sąlygomis arba jei esate silpnas plaukikas.Aquafarer Gelbėjimosi liemenės skirtos SUP baidarių sportui, tačiau jos gali suteikti papildomo pasitikėjimo plūduriuoti pradedantiesiems.
