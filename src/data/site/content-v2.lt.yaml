  title: 'SUP Saugumo vadovas: Esminės taisyklės kiekvienam irkluotojui'
  description: Išsamus SUP saugumo vadovas, apimantis oro patikrinimus, įrangą, savigelbėjimą, navigacijos taisykles ir ką daryti, jei sąlygos tampa pavojingos. Būkite saugūs ant savo irklentės.
  definition: SUP Saugumas apima išankstinį kelionės planavimą (oras, potvyniai, įrangos patikra), vandens naudojimo praktikas (pavadėlis, PFDnavigacija) ir avarines procedūras (savarankiškas gelbėjimasis, signalizacija, hipotermijos prevencija).
  tldr: Visada dėvėkite pavadėlį ir PFD. Patikrinkite vėjo prognozę — vėjas nuo kranto yra pavojingas. Pirmiausia irkluokite prieš vėją, kad vėjas padėtų grįžti. Nešiokitės švilpuką, telefoną į vandeniui atsparų dėklą ir vandenį. Išmokite savarankiško gelbėjimosi. Niekada SUP nebūkite vieni atokiose vietovėse.
  problem: SUP Atrodo apgaulingai paprasta. Pradedantieji neįvertina, kaip greitai vėjas, srovė ir nuovargis gali paversti smagią treniruotę pavojinga.
  explanation: Lenta veikia kaip burė vėjyje, todėl plaukimas pavėjui lengvas, bet grįžimas prieš vėją yra itin sudėtingas. Stovint kyla kritimo rizika. Nuovargis kaupiasi greičiau nei baidarių plaukimas. Pavadėliai neleidžia atsiskirti nuo lentos. PFD padeda išlikti paviršiuje, jei susižeidžiate.
  solution: 'Prieš kelionę: patikrinkite vėją (pradedantiesiems maksimaliai 10 mazgų), kryptį (venkite nuo jūros) ir potvynį. Pasakykite kam nors maršrutą. Ant vandens: atsiklaupkite irkluoti prieš stiprų vėją. Jei išsiskiriate, plaukti iki lentos. Savigelbėjimui: padėkite irklą per lentą, spirkite kojomis, traukite krūtinę ant lentos, pakelkite kojas.'
  recommendation: Naudok Aquafarer Life Vest Pro (pripučiamą) SUP. Prisegk susuktą SUP pavadėlį prie blauzdos. Praktikuok savarankišką gelbėjimąsi ramiomis sąlygomis, kol to prireikia.
  faq:
    - q: Koks vėjo greitis yra saugusSUP?
      a: 'Pradedantiesiems: greitis iki 10 mazgų. Vidutinis: 10–15 mazgų. Pažengusiam: 15–20 mazgų. Virš 20 mazgų pavojinga visiems lygiams.'
    - q: Ar man reikia gelbėjimosi liemenėsSUP?
      a: Taip — tai teisiškai privaloma daugelyje jurisdikcijų ir visada rekomenduojama dėl saugumo.
    - q: Ką daryti, jei negaliu grįžti į krantą?
      a: Laikykis savo lentos (tai plūduriavimas). Signalizuok švilpuku. Jei tave pučia nuo kranto, irkluok 45 laipsnių kampu vėjui.
    - q: Kaip praktikuoti SUP savęs gelbėjimą?
      a: 'Ramioje seklioje vandenyje: tyčia nukristi, plaukti iki lentos, kartoti pakartotinį užlipimą.'
