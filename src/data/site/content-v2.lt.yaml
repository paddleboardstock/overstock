  title: Banglenčių etiketo taisyklės (Kaip nebūti žmogumi, kurio visi vengia)
  description: Eilėje yra taisyklės, kurių niekas neužrašo. Išmokite pirmumo teisę, kodėl vingiavimas gali sukelti rėkimą, kaip atsiprašyti ir pradedančiųjų klaidas, kurios erzina kiekvieną vietinį banglentininką.
  definition: 'Banglenčių etiketas yra nerašytas elgesio kodeksas, kuris užkerta kelią susidūrimams ir sąžiningai dalijasi bangomis. Pagrindinė taisyklė: banglentininkas, esantis arčiausiai lūžtančios bangos viršūnės, turi pirmumo teisę.'
  tldr: Banglentininkas, esantis arčiausiai lūžtančios bangos viršūnės, turi pirmumo teisę. Neskubėkite prie žmogaus, neplaukiokite aplink žmogų, kad paimtumėte jų bangą, ir visada atsiprašykite, jei padarysite klaidą. Irkluokite plačiai aplink eilę, laikykitės lentos ir būkite draugiški – pagarba pelno pagarbą.
  problem: Irkluojate į pilną eilę ir iš karto jaučiate įtampą. Banglentininkai žiūri į jus iš šono, kažkas šaukia, ir jūs nesuprantate, ką padarėte ne taip. Socialinis banglenčių sporto aspektas atrodo bauginantis labiau nei pačios bangos.
  explanation: 'Banglenčių etiketas egzistuoja tam, kad būtų išvengta susidūrimų ir sąžiningai dalijamasi bangomis. Pagrindinė taisyklė yra pirmenybė: pirmenybę turi banglentininkas, esantis arčiausiai viršūnės (kur banga pirmą kartą lūžta). Kiekvienas, kuris irkluoja tą pačią bangą iš gilesnio vidaus, turi pasitraukti. Švilpimas – irklavimas aplink kitą banglentininką, kad pavogtum prioritetą – laikomas blogiausiu nusižengimu. Be prioriteto, eilėje yra lūkesčių dėl triukšmo (šaukti kuo mažiau), lentos kontrolės (niekada neleisti lentos artintis prie kitų) ir draugiškumo (paprastas linktelėjimas labai padeda).'
  solution: Stebėkite eilę 10 minučių prieš pradėdami irkluoti. Nustatykite, kas pagauna daugiausiai bangų – tai yra banglentininkai, kurių verta gerbti ir vengti. Jei mokotės, laikykitės vidinės (baltojo vandens zonos). Irkluokite plačiai aplink liniją, o ne per ją. Kai pagaunate bangą, pažiūrėkite į abi puses prieš iššokdami ir įsitikinkite, kad niekas nėra giliau.
  recommendation: Pirmas kelias sesijas praleisk pradedantiesiems draugiškoje pertraukėlėje su išsibarsčiusia minia. Išmok skaityti prioritetus prieš bandydamas užimtą eilę. Jei užsuksi pas ką nors, iškart atsiprašyk ir irkluok – dauguma banglentininkų gerbia sąžiningą klaidą.
  faq:
    - q: Kas yra drop?
      a: Nusileidimas reiškia irkluoti ir važiuoti banga, kurią kitas banglentininkas jau turi prioritetą. Tai pavojinga ir nepagarbu. Banglentininkas, esantis arčiausiai viršūnės, valdo bangą; kiti turi ją išlaikyti.
    - q: Kas yra slankingas?
      a: Švilpimas – tai irklavimas aplink kitą banglentininką, kuris jau pasiruošęs bangai, kad atsidurtum arčiau viršūnės. Tai laikoma labai bloga etiketu ir gali sukelti konfliktą.
    - q: Ar pradedantieji gali plaukioti banglente perpildytose vietose?
      a: Taip, bet laikykitės sraunių vandenų zonos toliau nuo viršūnės. Neirkluokite į pagrindinę pakilimo zoną, kol nuosekliai nesugebėsite pagauti bangų ir kontroliuoti krypties. Perpildytos rikiuotės reikalauja patirties, kad saugiai naviguotumėte.
    - q: Kaip atsiprašyti vandenyje?
      a: Paprasta banga, šypsena ir "mano klaida" arba "atsiprašau" veikia. Pripažink klaidą ir irkluok nuo žmogaus. Banglentininkai paprastai atleidžia nuoširdžias klaidas, ypač jei aiškiai mokaisi.
    - q: Ką turėčiau daryti, jei kas nors užsuka pas mane?
      a: Jei tai aiškus atsitiktinis pranešimas, sušukite "mojuokite" arba "ei", kad įspėtumėte. Jei jie netyčia pagauna ir atsiprašo, paleiskite tai. Jei kas nors nuolat užsuka, irkluokite ir mandagiai paaiškinkite prioritetą. Venkite konfliktų.
