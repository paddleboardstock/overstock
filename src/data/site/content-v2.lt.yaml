  title: Šalto vandens banglenčių įrangos gidas (Banglenčių sportas per žiemą be kančių)
  description: 'Neleiskite, kad šaltas vanduo užbaigtų jūsų sezoną. Išsamus šalto vandens įrangos suskirstymas: neopreno kostiumo storis, batų ir pirštinių pasirinkimas, kapoto pritaikymas ir aksesuarai, dėl kurių žiemos sesijos iš tiesų yra malonios.'
  definition: Šalto vandens banglenčių sportui reikalingas pilnas hidrokostiumas (5/4/3 mm ar storesnis), batai, pirštinės ir gobtuvas. Žemiau 12°C kiekvienas kontaktas su šaltu vandeniu turi būti apsaugotas, kad būtų išvengta tirpimo, hipotermijos ir saugumo rizikos.
  tldr: Šaltame vandenyje banglenčių sportui reikia pilno 5/4/3 mm arba 6/5/4 mm gobtuvo hidrokostiumo, 5 mm batų, 3 mm pirštinių ir gobtuvo. Siūlių kokybė svarbesnė už prekės ženklą – ieškokite klijuotų ir aklai siūtų (GBS) siūlių. Terminis pamušalas suteikia daug šilumos be papildomo storio. Visada pasiimkite atsarginių terminių sluoksnių ir termosą po treniruotės atsigavimui.
  problem: Nori plaukioti banglente per žiemą, bet šaltas vanduo po 15 minučių nutirpina kojas, rankos nebegali sugriebti lentos, o kostiumas kiekvieną kartą irkluojant nuplauna šaltą vandenį per nugarą. Be tinkamos įrangos šalto vandens treniruotės būna trumpos ir varginančios.
  explanation: 'Šalto vandens banglenčių sportas (žemiau 12°C) reikalauja daugiau nei tik storos hidrokostiumo aprangos. Kiekvienas kontaktas su šalčiu reikalauja apsaugos: batai apsaugo nuo pėdų nutirpimo ir nuo rifų įpjovimų, pirštinės palaiko rankų funkciją irklavimui, o gobtuvas apsaugo nuo didžiausio šilumos praradimo (galva spinduliuoja 30 procentų kūno šilumos). Hidrokostiumo storis turėtų būti pritaikytas šalčiausią mėnesį, o ne vidutiniam. Be kostiumo, aksesuarai, tokie kaip batai su sandariais padais ir pirštinės su iš anksto išlenktais pirštais, pagerina komfortą ir patvarumą.'
  solution: 'Pasigaminkite šalto vandens rinkinį šia tvarka: 5/4/3 mm arba 6/5/4 mm pilnas kostiumas su GBS siūlėmis ir krūtinės užtrauktuku, 5 mm batai su guminiais padais, 3 mm pirštinės (pirštinės šiltesnės nei pirštinės) ir 3 mm gobtuvas, kuris užkišamas po kostiumo apykakle. Pridėkite persirengimo chalatą orumui ir šilumai automobilių stovėjimo aikštelėje.'
  recommendation: Aquafarer Wetsuit Pro 5/4/3 mm su integruotu termo pamušalu atlaiko daugumą šalto vandens sąlygų iki 8°C. Derinkite jį su 5 mm Aquafarer batais ir 3 mm pirštinėmis, kad užtikrintumėte pilną šalto vandens įrangą. Žemiau 8°C rinkitės 6/5/4 mm gobtuvą.
  faq:
    - q: Ar tikrai man reikia gobtuvo?
      a: Taip. Prarandate 30 procentų kūno šilumos per galvą. Gobtuvas apsaugo nuo paraudimo ir palaiko kaklą šiltą. 3 mm gobtuvas suteikia daugiau šilumos nei storis nuo 5 mm iki 6 mm liemens storio.
    - q: Kokio storio batai man reikalingi?
      a: Vandeniui 8–12°C naudokite 5 mm batus. 12–16 °C atveju pakanka 3 mm batų. Žemiau 8 °C apsvarstykite galimybę dėvėti 7 mm batus arba pridėti neopreno kojines po 5 mm batais.
    - q: Kaip sustabdyti nardymo kostiumo praplovimą?
      a: Išplovimas įvyksta, kai vanduo patenka į kostiumą ties kaklu, riešais ar kulkšnimis. Krūtinės užtrauktuko dizainas žymiai sumažina nugaros nuplovimą. Velcro sandarikliai ant kaklo ir kulkšnių taip pat padeda, tačiau geriausias sprendimas – gerai prigludęs kostiumas su GBS siūlėmis.
    - q: Ar galiu naudoti 3 mm kostiumą šaltame vandenyje su papildomais sluoksniais?
      a: 3 mm kostiumas su neopreno liemene po apačia gali padidinti diapazoną maždaug 3–4°C, bet tai nėra pakaitalas tikram 5/4/3 mm ar 5 mm kostiumui. Sluoksniavimas geriausiai tinka trumpoms sesijoms ribinėse sąlygose.
