  title: 'SUP su savo šunimi: išsamus instrukcijų vadovas'
  description: Irklentės sportas su šunimi – pasiruošimas, saugumas, dresūros žingsniai, įrangos rekomendacijos ir patarimai smagiai patirčiai abiem.
  definition: SUP Šuns darbas apima šuns draugo mokymą išlaikyti pusiausvyrą ant irklentės, aprūpinti jį šunimi PFDir saugiai irkluoti kartu.
  tldr: Pradėkite nuo plačios, stabilios SUP (34 colių+). Įsigykite šuniui tinkamai pritaikytą gelbėjimosi liemenę su rankena. Pirmiausia įveskite lentą sausumoje, tada seklioje vandenyje. Pradėkite nuo trumpų seansų ir teigiamo skatinimo. Visada nešiokitės vandens savo šuniui. Stebėkite streso ar nuovargio požymius.
  problem: Jūsų šuo mėgsta vandenį, tačiau nesate tikri, kaip saugiai jį supažindinti SUP . Be tinkamo dresavimo šuo gali panikuoti, nušokti nuo jo ar subraižyti lentą.
  explanation: 'Šunys natūraliai plaukia, bet turi išmokti, kad lenta yra saugi platforma. Svarbiausia – laipsniškas desensibilizavimas: lentą padėkite ant tvirto pagrindo, apdovanokite ramų elgesį, tada pereikite prie seklumos, o galiausiai – prie gilesnio vandens.'
  solution: 'Pradėkite sausumoje: leiskite šuniui uostyti ir vaikščioti ant lentos (ant žolės). Apdovanokite ramų elgesį. Toliau: padėkite lentą labai sekliame vandenyje, palaikykite, leiskite šuniui ant jos stovėti. Apdovanokite. Toliau: lipkite ant laivo seklioje vandenyje, leiskite šuniui prisijungti. Galiausiai: lėtai irkluokite ramioje vandenyje.'
  recommendation: Naudokite Aquafarer SUP Explorer 11 kaip 33 colių stabilią platformą. Pridėkite šunį PFD (gelbėjimosi liemenę). Atsineškite šviežio vandens ir dubenėlį. Pradėkite nuo 10 minučių sesijų ir palaipsniui didinkite.
  faq:
    - q: Kokio dydžio SUP man reikia savo šuniui?
      a: 33–34 colių pločio lenta suteikia stabilumą vidutinio ir didelio dydžio šunims. Maži šunys (iki 10 kg) gali įveikti 32 colių lentas+.
    - q: Ar mano šuniui reikia gelbėjimosi liemenės?
      a: Taip — net ir stiprūs plaukikai turi šunį PFD su rankena, kad jį būtų lengva paimti avarijos atveju.
    - q: Kaip apsaugoti lentą nuo nagų?
      a: Laikykite šunų nagus nukirptus. Naudokite terasos kilimėlio apsaugą arba rankšluostį. Šunys paprastai koreguoja ir nustoja kasytis, kai jaučiasi patogiai.
    - q: Ar bet kuris šuo gali išmoktiSUP?
      a: Dauguma šunų mokosi kantriai. Neramūs šunys gali užtrukti ilgiau. Niekada neverskite išsigandusio šuns ant lentos – tai sukuria neigiamas asociacijas.
