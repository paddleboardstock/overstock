  title: 'Stovimas irklentės sportas pradedantiesiems: jūsų pirmoji treniruotė'
  description: 'Viskas, ką reikia žinoti prieš pirmąją SUP treniruotę: įrangos kontrolinis sąrašas, kaip atsistoti, irklavimo technika, saugus kritimas ir ramaus vandens pasirinkimas mokymuisi.'
  definition: Stovint irklentėje (SUP) reikia stovėti ant lentos ir naudoti irklą, kad stumtumeisi per vandenį. Pusiausvyra, irklavimo technika ir vandens sąlygų skaitymas yra trys pagrindiniai įgūdžiai.
  tldr: Pradėkite ant lygio, ramaus vandens be vėjo. Pirmiausia praktikuokite klūpėjimą, tada stovėkite kojomis klubų plotyje netoli lentos centro. Laikykite irklą viena ranka viršuje, kita – ant koto. Irklavimui naudokite liemens sukimąsi, o ne rankų jėgą. Žiūrėkite į horizontą, o ne į kojas. Tikėkitės kritimo – tai mokymosi dalis.
  problem: Pirmą kartą pripuči, SUPžengi ant lentos ir iškart jautiesi nestabilus. Kojos dreba, irklas jaučiasi nepatogiai, ir nesupranti, kodėl sukiesi ratu, o ne tiesiomis linijomis.
  explanation: SUP Reikia balanso reguliavimo, nes stovėjimas ant plūduriuojančios platformos skiriasi nuo bet kokios sausumos veiklos. Kūnas instinktyviai įsitempia, todėl lenta tampa nestabilesnė. Irklo judesys turėtų būti atliekamas sukant liemenį, o ne traukiant rankomis. Ašmenys turėtų įeiti į vandenį prie pirštų ir išeiti prie čiurnos. Dauguma pradedančiųjų irkluoja tik rankomis, todėl greitai pavargsta ir seka be pėdsakų. Žiūrint žemyn į lentą, prarandama pusiausvyra.
  solution: Pripūsk lentą pagal rekomenduojamą PSIlygį, pritvirtink pavadėlį prie kulkšnies ir pradėk klūpėti. Irkluok nuo klūpėjimo, kad pajustum slydimą. Kai būsi pasiruošęs stovėti, padėk irklą per lentą, abi rankas padėk ant žemės, žingsnis po žingsnio aukštyn ir kilk aukštyn, išlaikydamas svorį centre. Laikyk kelius šiek tiek sulenktus ir liemenį įtemptą.
  recommendation: Naudok Aquafarer SUP Explorer 11 dėl 33 colių pločio ir stabilios platformos. Praktikuokis ežere ar apsaugotoje įlankoje be srovės. Pirmoms sesijoms dėvėk gelbėjimosi liemenę.
  faq:
    - q: Kiek laiko užtrunka išmoktiSUP?
      a: Dauguma žmonių gali stovėti ir irkluoti ramioje vandenyje per 10–15 minučių. Įgūdis užtrunka 3–5 treniruotes. Pažengę įgūdžiai užtrunka mėnesius.
    - q: Kokia yra geriausia vėjo sąlyga pradedantiesiems?
      a: Vėjas mažesnis nei 5 mazgai (ramus arba lengvas vėjelis). Vėjas virš 10 mazgų sukuria bangavimą, kuris kelia iššūkį pusiausvyrai. Pradedantieji turėtų vengti jūrinio vėjo.
    - q: Ar turėčiau nešioti pavadėlį?
      a: Visada dėvėkite pavadėlį. Susuktas SUP pavadėlis tvirtinamas prie kulkšnies ar blauzdos ir laiko lentą su savimi, jei nukrisite. Atvirame vandenyje pavadėlis gali išgelbėti gyvybę.
    - q: Kokia dažniausia pradedančiųjų klaida?
      a: Žiūrint žemyn į lentą. Laikyk akis į horizontą. Tavo kūnas seka galvą – žiūrėjimas žemyn perkelia svorį į priekį ir priverčia lentą svyruoti.
