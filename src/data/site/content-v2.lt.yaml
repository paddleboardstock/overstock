  title: 'Joga ant lentosSUP: išsamus jogos su irklente vadovas'
  description: SUP Joga derina tradicines jogos pozas su iššūkiu plaukiojančioje platformoje. Kaip pasirinkti lentą jogai, pagrindinės pozos pradedantiesiems ir patarimai, kaip išlaikyti pusiausvyrą vandenyje.
  definition: SUP Joga (irklentės joga) yra praktika, kai jogos asanos atliekamos ant stovimos irklentės, dažniausiai pritvirtintos ramioje vandenyje. Nestabili platforma labiau įtraukia pagrindinius stabilizatorius nei kilimėlio joga.
  tldr: 'Naudokite platų lentą (34 colių+) su minkšta, gerai sukibusia terasos kilimėliu. Praktikuokite ramioje, seklioje vandenyje be srovės ar vėjo. Pritvirtinkite lentą mažu inkaru arba kuoliuku. Pradėkite nuo pagrindinių pozų: žemyn nukreiptas šuo, karys II, medžio poza ir savasana. Vanduo prideda nestabilumo, kuris gilina pilvo raumenų įsitraukimą ir gerina pusiausvyrą.'
  problem: Joga ant kilimėlio tapo rutina, todėl norite gilinti savo praktiką. Vandens nestabilumas kelia iššūkį, kuris verčia geriau įsitraukti raumenis, tačiau be pagalbos galite pasirinkti netinkamą lentą arba susidurti su sunkumais keičiant pozas.
  explanation: Jogos praktika ant SUP lentos keičia kiekvieną pozą. Plūduriuojantis paviršius nuolat juda, todėl stabilizatoriai turi nuolat dirbti. Stovimos pozos reikalauja tikslesnio svorio paskirstymo. Vanduo natūraliai pasipriešina plūduriuojančioms pozoms. SUP Jogos lentoms reikia maksimalaus pločio (34–36"), storos minkštos EVA terasos pagalvėlės, minimalaus sūpynės pagrindo plokščiai platformai ir kelių D formos žiedų tvirtinimui.
  solution: Pasirinkite lentą, kuri yra 34" ar platesnė, su pilnu denio padu. Pripūskite iki kietumo PSI stabilumui. Pririškite lentą prie priekinio D formos žiedo. Pradėkite nuo sėdimų ir klūpančių pozų, kad priprastumėte prie platformos. Pereikite prie stovimos pozos, sutelkiant dėmesį į lėtus perėjimus.
  recommendation: Aquafarer SUP Explorer 11 su 33 colių pločiu ir pilnu deimantiniu grioveliu puikiai tinka SUP jogai. Specialiai jogos praktikai platesnė lenta suteikia daugiau komforto. Visada naudokite pavadėlį arba inkarą, kad lenta neslystų.
  faq:
    - q: Ar man reikia specialios lentos SUP jogai?
      a: Nebūtinai, bet plotis ir terasos kilimėlio kokybė yra svarbūs. Lentos iki 32\" yra labai sudėtingos jogai. Storas, paminkštintas terasos kilimėlis daro klūpėjimo pozas patogias.
    - q: Kas nutinka, jei pargriūnu SUP jogos metu?
      a: Kritimas yra patirties dalis. Dauguma kritimų įvyksta pereinant tarp pozų. Nukrisk nuo lentos, o ne ant jos.
    - q: Ar galiu daryti karštą jogą ant SUPjogos?
      a: SUP Joga tiesioginėje saulės šviesoje gali būti labai karšta. Praktikuokite ryte arba vėlai popiet. Naudokite SPF ir atsineškite vandens.
    - q: Ar SUP joga sunkesnė už kilimėlio jogą?
      a: Taip — nestabili danga reikalauja daugiau pusiausvyros ir pilvo jėgos. Daugelis praktikų pastebi, kad SUP joga pagerina jų kilimėlio praktiką, ugdydama gilesnį kūno suvokimą.
