  title: 'Hidrokostiumo taisymas: Patys taisykite plyšius, siūles ir užtrauktukus'
  description: Pasidaryk pats nardymo kostiumo remonto vadovas neopreno plyšimams, siūlių atskyrimui, užtrauktuko užstrigimams ir praskeltoms kelių apsaugoms. Žingsnis po žingsnio instrukcijos naudojant neopreno cementą.
  definition: Hidrokostiumo remontas apima pažeistos vietos valymą ir šiurkštų apdorojimą, neopreno cemento užtepimą ir kietinimą esant slėgiui, siekiant atkurti vandeniui nepralaidumą ir lankstumą.
  tldr: 'Maži plyšimai iki 1 colio: užtepkite neopreno cemento abiejose pusėse, palaukite 10–15 minučių, kol taps lipnus, stipriai spauskite, kietinkite po svoriu 12 valandų. Didesniems plyšimams reikia neopreno pleistro. Užtrauktuko problemos: pirmiausia sutepkite, tada patikrinkite, ar nėra audinio užstrigimų.'
  problem: Jūsų nardymo kostiumas turi nedidelį plyšimą, siūlę, kuri atsiskiria, arba užtrauktuką, kuris stringa. Be savarankiško remonto, už pakeitimą mokate 150 USD+, kai remontas kainuoja 5 USD.
  explanation: Neopreno cementas veikia suminkštindamas neopreno paviršių, sukurdamas cheminį ryšį, kai tirpiklis išgaruoja. Cementas turi būti tepamas ant abiejų paviršių ir prieš sujungimą tampa lipnus. Plyšimams kraštai turi būti tiksliai suderinti. Užtrauktuko problemos dažnai kyla dėl druskos korozijos arba audinio, įstrigusio dantyse.
  solution: 'Plyšimams: nuvalykite alkoholiu, lengvai nušlifuokite, užtepkite ploną cemento sluoksnį ant abiejų kraštų, palaukite, kol taps lipnus, suspauskite tobulai, uždėkite svorį, kietinkite 12–24 valandas. Lopams: nukirpkite 1" didesnį nei plyšimas, užtepkite cemento ant abiejų, spauskite. Užtrauktukui: skalaukite, užtepkite užtrauktuko vaško, dirbkite švelniai.'
  recommendation: Turėkite Aquafarer nardymo kostiumo remonto rinkinį savo įrangos krepšyje. Dideliems remontams ar siūlių trūkumams kritinėse vietose rekomenduojama profesionaliai taisyti.
  faq:
    - q: Ar galiu naudoti superklijus ant nardymo kostiumo?
      a: Ne – superklijai džiūsta kietai ir trapiai. Hidrokostiumo remontui naudokite tik neopreno cementą arba Aquaseal.
    - q: Kiek laiko trunka neopreno cemento remontas?
      a: Tinkamai atliktas remontas dažnai yra stipresnis už originalų neopreno modelį ir tarnauja visą kostiumo tarnavimo laiką.
    - q: Ar galiu pataisyti visiškai atsiskyrusį užtrauktuką?
      a: Jei bėgelis atsiskyrė nuo neopreno, klijuokite kontaktiniu kliju. Jei pažeisti dantys, profesionaliai pakeiskite užtrauktuką.
    - q: Kaip sutvarkyti hidrokostiumo pratekėjimą ties siūle?
      a: Užtepkite ploną Aquaseal sluoksnį palei pratekėjusios siūlės vidų ir leiskite džiūti 24 valandas.
