  title: 'Potvynių supratimas vandens sporte: praktinis vadovas'
  description: Kaip potvyniai veikia SUPbanglenčių ir baidarių sąlygas. Potvynių žemėlapių skaitymas, pavasario ir neap potvynių supratimas bei treniruočių planavimas pagal potvynių judėjimą saugumo sumetimais.
  definition: Potvyniai – tai kasdienis jūros lygio kilimas ir kritimas, kurį sukelia mėnulio ir saulės gravitacinis traukimas. Potvynių diapazonas priklauso nuo vietovės ir mėnulio ciklo.
  tldr: 'Daugumoje vietų kasdien būna du aukšti ir du žemi potvyniai. Pavasario potvyniai (pilnatis/naujas mėnulis) turi didesnius potvynius ir stipresnes sroves. Neap potvyniai (ketvirtis mėnulio) turi mažesnius svyravimus. Potvynis veikia vandens gylį, bangų formą ir srovės stiprumą. Prieš: SUPpirmiausia irkluokite prieš srovę, kad būtų lengviau grįžti.'
  problem: Atvykę prie vietinio bangavimo, randate beveik be bangų, pavojingus potvynius ar per seklų vandenį. Nesuprasdami potvynių, švaistote keliones arba irkluojate pavojingomis sąlygomis.
  explanation: Potvynius sukelia mėnulio gravitacija. Pavasario potvyniai (pilnas ir naujas mėnulis) duoda aukščiausias aukščiausias ir žemiausias žemumas. Neap potvyniai (ketvirtis mėnulio) sukelia minimalų svyravimą. Potvynio srovės yra greičiausios viduriniame potvynio metu, silpnesnės – aukštame ir žemame lygyje. Potvynio diapazonas svyruoja nuo 0,3 m (Viduržemio jūra) iki 16 m (Fundy įlanka).
  solution: 'Prieš kiekvieną treniruotę patikrinkite potvynių lentelę. Banglenčių sportui: paplūdimio bangos dažnai geriausiai veikia 2–3 valandas prieš ir po aukšto potvynio. SUPPirmoje pusėje irkluokite prieš srovę, kad srovė sugrįžtų. Žvejybai: atoslūgis stumia žuvis į lygumas.'
  recommendation: Naudokite NOAA potvynių prognozes arba vietinę potvynių programėlę. Sužinokite savo vietinio potvynio bangų pageidavimus, fiksuodami sąlygas per mėnesį.
  faq:
    - q: Kas yra pavasario potvynis?
      a: Pavasario potvyniai vyksta pilnaties ir naujo mėnulio metu, sukeldami aukštesnius potvynius ir stipresnes sroves. Jie pasitaiko du kartus per mėnesį.
    - q: Kas yra neap tide?
      a: Neap potvyniai pasitaiko ketvirčio mėnulio metu. Potvynių diapazonas yra mažesnis, o srovės silpnesnės – tai naudinga pradedantiesiems.
    - q: Ar žemi potvyniai yra pavojingiSUP?
      a: Atoslūgis gali atidengti uolas ir rifus. Taip pat bangų energija koncentruojasi statesnėse smėlio juostose.
    - q: Kaip potvyniai veikia sroves?
      a: Išeinantys potvyniai (atoslūgis) stiprina atslūgimo sroves. Įplaukiančios potvyniai (potvyniai) sumažina srovės stiprumą.
