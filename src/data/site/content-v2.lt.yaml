  category: guide
  type: buying-guide
  title: 'Jūrinių gyvųjų liemenių gidas: Pasirinkite tinkamą PFD savo vandens veiklai'
  description: Išsamus gelbėjimosi liemenių pirkimo gidas SUPbaidarėms, RIB plaukimui valtimi ir buriavimui.PFD Tipai (putplastis prieš pripučiamą), pritaikymo gairės, teisiniai reikalavimai ir kiekvienos veiklos ypatybės.
  definition: Gelbėjimosi liemenė arba asmeninis plūdrumo įrenginys (PFD) yra saugos įranga, skirta žmogui išlaikyti plūduriuojantį vandenyje. Tipai svyruoja nuo I tipo (jūroje) iki V tipo (specialus naudojimas).
  tldr: 'Pasirinkite PFD pagal veiklą: pripučiamas diržo krepšysSUP, putų liemenė baidarėms, III tipo putplastis RIB ir motorinės valtys. Pagrindinės savybės: USCG ISO arba patvirtinimas, atspindinčios plokštės, gelbėjimo švilpukas, D formos žiedas pririšimui, ryškios spalvos.'
  problem: Matote eiles gelbėjimosi liemenių, kurių kaina svyruoja nuo 20 iki 300 dolerių, ir neturite supratimo, kuri iš jų tinkama jūsų veiklai ar atitinka teisės reikalavimus.
  explanation: 'Gelbėjimosi liemenės skirstomos pagal tipus: I tipo (jūroje, apverčia be sąmonės nešiojantį veidu į viršų), II tipo (prie kranto), III tipo (dažniausia plūduriavimo priemonė), IV tipo (metama), V tipo (specialus naudojimas). Pripučiamos liemenės naudoja CO2 kapsules – mažiau gremėzdiškos, bet reikalauja priežiūros. Putplasčio liemenės yra nereikalaujančios priežiūros, bet masyvesnės.'
  solution: 'Prieš: SUPrinkitės pripučiamą diržo kuprinę arba liemenę (33 lb plūdrumas). Baidarėms: III tipo putplastis su aukštomis išpjovomis ant rankos. Prieš: RIBIII tipo putplastis arba pripučiamas su 22+ lb plūdrumu, atspindinčia juosta ir gelbėjimo švilpuku.'
  recommendation: Aquafarer Life Vest Pro (pripučiama, 33 lb) idealiai tinka SUP plaukimui baidarėmis. Aquafarer Life Vest Classic (putplasčio, III tipo) puikiai tinka RIB plaukioti valtimi ir bendram naudojimui jūroje.
  faq:
    - q: Ar man reikia gelbėjimosi liemenėsSUP?
      a: Taip — tai teisiškai privaloma daugelyje jurisdikcijų ir visada rekomenduojama. Dėvėkite pripučiamą diržo krepšį arba liemenę irklavimo sportui.
    - q: Ar pripučiamos gelbėjimosi liemenės yra saugios?
      a: Taip, su tinkama priežiūra. Kasmet tikrinkite CO2 kasetę, bobiną keiskite kas 2–3 metus.
    - q: Kokia gelbėjimosi liemenė geriausia vaikui?
      a: USCGPatvirtinta II arba III tipo putplasčio liemenė su apykakle, dirželiu kirkšnyje ir ryškiomis spalvomis. Niekada nenaudokite pripučiamų liemenių vaikams.
    - q: Kaip turėtų tikti gelbėjimosi liemenė?
      a: Tvirtai — liemenė neturėtų kilti virš ausų, kai pakeliama už pečių. Visi užtrauktukai ir sagtelės užsegti.
