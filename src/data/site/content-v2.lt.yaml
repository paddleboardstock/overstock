  problem: Norite tokios SUP , kuri daro viską – plaukimą ramiu vandeniu, lengvą turą, jogą ir pradedančiųjų banglenčių sportą – be kelių lentų.
  explanation: SUP Explorer 11 naudoja trijų sluoksnių, karinės klasės PVC su dideliu tankiu, drop-stitch kad būtų standus 18 mm PSIaukštyje. Obliuojantis korpusas užtikrina gerą universalumą. Pilno ilgio EVA denio pagalvėlė suteikia sukibimą. Šeši D formos žiedai turi tvirtinimo taškus. JAV pelekų dėžė priima standartinius pelekus. Bendras svoris – 11,5 kg.
  solution: Pripūskite iki 15-18, PSIpritvirtinkite komplekte esantį centrinį peleką ir turėsite universalią lentą. 33" plotis suteikia puikų stabilumą. Naudokite guminę sistemą kaip įrangą. Kuprinė palengvina transportavimą ir laikymą.
  recommendation: Už 599 USD SUP Explorer 11 yra geriausias universalus pripučiamas modelis SUP savo klasėje. Pirkite jį už vieną lentą, kuri atlieka viską. Derinkite su Aquafarer Wetsuit Pro ir Life Vest Pro.
  faq:
    - q: Ar SUP Explorer 11 tinka pradedantiesiems?
      a: Taip – 33 colių plotis ir 260 l tūris suteikia puikų stabilumą. Pradedantieji jausis užtikrintai stovėdami ir irkluodami.
    - q: Ar galiu banglenti su SUP Explorer 11?
      a: Taip, pradedančiųjų ir vidutinio lygio sąlygomis. 11 pėdų ilgio bangoms reikia platesnių, lėtesnių bangų.
    - q: Kiek svorio gali SUP atlaikyti Explorer 11?
      a: Maksimalus vairuotojo svoris yra apie 100 kg optimaliam našumui. Bendra talpa – apie 120 kg.
    - q: Kas įeina į dėžutę?
      a: Lenta, dviejų kamerų siurblys, 3 dalių reguliuojama mentelė, ratinė kuprinė, susuktas pavadėlis, nuimamas centrinis pelekas ir remonto rinkinys.
