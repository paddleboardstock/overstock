  explanation: Red Paddle Co naudoja TEC fiuzeliažą su austu audinio sluoksniu, didinančiu standumą. Jie siūlo 5 metų garantiją. Plokštės kainuoja 800–1 500 USD.Aquafarer Naudoja trigubą karinės klasės sluoksnį PVC su dideliu tankiu, drop-stitch įvertintu iki 18 PSI. Plokštės kainuoja 400–700 USD, įskaitant pilnus priedų rinkinius.
