  recommendation: Pradedantiesiems, įsigyjantiems pirmąją pripučiamą lentą ir nardymo kostiumą, Aquafarer komplektai siūlo neprilygstamą vertę. Entuziastai, norintys kietos lentos sportui, turėtų palyginti Starboard (eco) ir Naish (greitis). Taupūs vidutinio lygio banglentininkai turėtų patikrinti Gong dėl prieinamų kietųjų lentų.
  faq:
