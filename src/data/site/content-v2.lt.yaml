  title: 'Pripučiama SUP saugykla: tinkamas būdas laikyti savo iSUP'
  description: Tinkamas pripučiamas SUP laikymas apsaugo nuo delaminavimo, UV pažeidimų, pelėsio ir vožtuvų nuotėkio. Žiemos laikymas, ilgalaikis laikymas ir kasdienis laikymas drop-stitch lentoms.
  definition: Pripučiama SUP laikysena reiškia, kad lenta laikoma švarioje, sausoje, temperatūrai kontroliuojamoje aplinkoje, apsaugotoje nuo UVekstremalių temperatūrų ir fizinių pažeidimų.
  tldr: Laikykite vėsioje, tamsioje vietoje, žemiau 30°C, toli nuo tiesioginių saulės spindulių. Trumpam laikui (1–2 savaites) laikykite dalinai pripūstą 8–10 °C temperatūrojePSI. Ilgalaikiam laikymui visiškai išpūkite, laisvai suvyniokite ir dėkite į laikymo maišelį. Niekada nelaikykite šlapio. Venkite graužikų ir aštrių daiktų.
  problem: Išleidžiate vandenį SUP ir dedate į karštą garažą arba drėgną rūsį. Po trijų mėnesių jis PVC pagelto, terasos padanga lupasi, o vožtuvas praleidžia vandenį. Netinkamas laikymas sukelia daugiau žalos nei įprastas naudojimas.
  explanation: Karštis virš 50°C sukelia PVC plastifikatorių migraciją, todėl medžiaga tampa standi ir trapi.UV Radiacija ardo polimerinius ryšius. Drėgmė, įstrigusi viduje, sukelia pelėsį. Šaltis žemiau nulio daro PVC ją trapią. Spaudimo taškai dėl sandaraus lankstymo sukuria nuolatines raukšles.
  solution: 'Trumpalaikis laikymas: nuplauti, išdžiovinti, pripūsti iki 10 laipsnių PSIir laikyti pavėsyje nuo žemės. Ilgalaikis laikymas: kruopščiai išvalykite, visiškai išdžiovinkite, visiškai išpūkite, išvoliokite terasos kilimėlį į išorę, įdėkite į maišą, laikykite vėsioje sausoje spintoje. Venkite cheminių medžiagų ir kenkėjų.'
  recommendation: Naudokite Aquafarer nešiojimo krepšį laikymui – jis blokuoja UV ir apsaugo nuo įbrėžimų. Laikykite klimato kontroliuojamoje patalpoje. Įdėkite į maišelį drėgmės surinkimo paketą, kad būtų drėgna aplinka.
  faq:
    - q: Ar galiu laikyti SUP pripūstą automobilį garaže?
      a: Tik jei garažas laikosi žemiau 30°C ir neturi tiesioginių saulės spindulių. Dauguma garažų vasarą viršija 40°C.
    - q: Ar turėčiau laikyti jį SUP maišelyje?
      a: Taip, maišelis apsaugo nuo dulkių, UV, ir fizinių pažeidimų. Prieš dedant į maišelį įsitikinkite, kad lenta visiškai sausa.
    - q: Ar užšalimas gali pakenkti pripučiamam daiktuiSUP?
      a: Taip. Temperatūra žemiau nulio, PVC tampa trapi ir gali įtrūkti, kai išvyniojama ar pripučiama. Visada laikykite virš 5C.
    - q: Kaip turėčiau jį susukti SUP sandėliavimui?
      a: Sukti su terasos pagalvėle nukreipta į išorę, kad apsaugotumėte dugnąPVC. Venkite siaurų raukšlių. Kiekvieną kartą keiskite sulenkimo padėtį.
