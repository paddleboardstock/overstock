  type: buying-guide
  title: 'SUP Gidas: Pasirinkite tinkamą lentą ilgų distancijų irklavimui'
  description: Touring yra SUPs ilgesnės, siauresnės ir pritaikytos greičiui bei slydimui. Kaip pasirinkti turizmo lentą, būtina įranga ilgiems irklams ir technika, kaip efektyviai įveikti atstumą.
  definition: Touring SUP yra ilga (12–14 pėdų), siaura (30–32 pėdų) lenta, skirta efektyviam irklavimui dideliais atstumais. Savybės apima poslinkio nosį vandeniui pjauti, ilgesnę vandens liniją slydimui ir dažnai bungee krovinio sistemą.
  tldr: 'Kelionėse SUPs prioritetas teikiamas greičiui ir sekimui, o ne stabilumui. Minimalus ilgis – 12 pėdų efektyvumui, 30–32 colių plotis – slydimo ir stabilumo balansui. Pagrindinės savybės: nosis su išstūmimu, tiesus kontūras, kelių pelekų išdėstymas. Būtina įranga: PFDpavadėlis, vanduo, telefonas ir gumos sistema įrangai. Technika orientuota į ilgus, sklandžius judesius su liemens sukimu.'
  problem: Irklavimas universalia lenta ilgo nuotolio kelionėje palieka jus išsekusį. Plati nosis pagauna bangavimą, lenta nejuda tiesiai, o daugiau energijos sunaudojate vairavimui nei sklendimui. Jums reikia lentos, pritaikytos atstumui.
  explanation: Turizmo SUPs lentos naudoja poslinkio korpusą (smailią nosį), kuri praleidžia vandenį, o ne plaukia per jį, žymiai sumažindama pasipriešinimą. Ilgesnė vandens linija padidina korpuso greitį. Siauresnis plotis sumažina pasipriešinimą, bet reikalauja geresnio balanso. Turizmo lentos turi ilgesnius pelekus krypties stabilumui. Pripučiamos turizmo lentos reikalauja didesnio PSI (18-20), kad išlaikytų standumą ir išvengtų lankstumo, kuris švaisto energiją.
  solution: 'Rinkitės turistinę lentą, kuri būtų bent 12 pėdų ilgio su poslinkio nosimi. Plotis: 30 colių patyrusiems irkluotojams, 31–32 colių vidutinio ilgio. Ieškokite centrinės pelekų dėžės ir šoninių dantų stabilumui. Pripūskite iki maksimalaus įvertinimoPSI. Įrenkite guminį krovinio tvirtinimo diržą, PFDšvilpuką ir telefoną vandeniui atspariame dėkle.'
  recommendation: Aquafarer SUP Tour 12, kurio matmenys 12' x 31" x 6", yra idealus pripučiamas turistiniam laivui. Jo poslinkio nosis efektyviai pjauna bangas, o bungee sistema laiko įrangą dienos išvykoms. Derinkite su Aquafarer anglies pluošto irklu efektyviam ilgų distancijų irklavimui.
  faq:
    - q: Ar galiu naudoti universalią lentą turams?
      a: Trumpiems turams, trumpesniems nei 5 km, taip. Ilgesniems atstumams platesnė nosis ir trumpesnė vandens linija greičiau pavargina.
    - q: Kokio ilgio turo man SUP reikia?
      a: 12' yra minimalus atstumas turizmo efektyvumui. 12'6" yra geras vidutinio ilgio atstumas. 14' skirtas lenktynėms ir pažengusiems turizmo sportams.
    - q: Ar pripučiamos turizmo mašinos SUPs veikia taip pat gerai kaip kietos lentos?
      a: Šiuolaikinės drop-stitch pripučiamos lentos aukštu lygiu PSI veikia panašiai kaip kietos lentos kelionėms. Šiek tiek lankstumas iš tikrųjų gali būti patogesnis kapojant.
    - q: Kuris irklas geriausias kelionėms?
      a: Lengvas anglies arba stiklo pluošto irklas su didesne mente (100–110 kv. colių) galiai. Reguliuojamas irklas leidžia perjungti tarp kelionių ir banglenčių sporto.
