  title: 'Žvejybos SUP gidas: Stovėjimo irklentės žvejybos įranga'
  description: SUP Žvejyba sujungia baidarės slaptumą su irklavimo lentos judrumu. Išsamus žvejybos pasirinkimo vadovas, įrengimas SUPsu meškerių laikikliais ir įranga, bei technikos patarimai.
  definition: Žvejyba SUP yra stovintis irklavimo lenta, pritaikyta žvejybai, paprastai platesnė ir stabilesnė nei standartinės lentos, su tvirtinimo galimybėmis meškerių laikikliams, šaldytuvo laikymui ir žuvų ieškikliui.
  tldr: 'Rinkitės SUP bent 11 pėdų ilgio ir 34 colių pločio laivą žvejybos stabilumui. Ieškokite guminių krovinių sistemų, D formos žiedų aušintuvui tvirtinti ir kelių tvirtinimo taškų. Būtina įranga: meškerės laikiklis, dėžė arba aušintuvas įrangai, inkarų sistema pozicijai išlaikyti ir PFD.SUP Žvejyba ypač tinka sekliose lygumose, mangrovėse ir ramiuose vidaus vandenyse, kur valtys negali plaukti.'
  problem: Baidarių žvejybai reikia daug įrangos ir transportavimo rūpesčių. Žvejyba nuo kranto riboja jūsų prieigą. Jums reikia slaptos, nešiojamos žvejybos platformos, leidžiančios pasiekti seklias vandenis ir žvejoti tyliai, be baidarės svorio.
  explanation: 'SUP Žvejyba sujungia irklavimo aparato slaptumą su metimo pranašumu – stovimu aukščiu. Iš stovimos pozicijos matote giliau į vandenį ir metate su geresniu svertu. Pripučiami daiktai suteikia nešiojamumą. Plati platforma (34 colių+) užtikrina stabilumą. Pagrindinės modifikacijos: pieno dėžės PVC įrengimas su meškerių laikikliais, aušintuvo diržo pridėjimas ir inkarinio vežimėlio sistemos naudojimas vėjo valdymui.'
  solution: Pradėkite nuo plačios, stabilios SUP (mažiausiai 11' x 34"). Pridėkite narvo sistemą, pritvirtintą guminėmis virvėmis per D formos žiedus. Ant dėžės įrenkite lygiai pritvirtintus meškerių laikiklius. Naudokite pavadėlį ant kiekvienos lazdos. Pasiimkite mažą inkarą (1,5–3 lb) su 50 pėdų virvės. Nešiokite PFD ir nešiokitės telefoną vandeniui atspariame dėkle.
  recommendation: Aquafarer SUP Explorer 11, 33" pločio, tinka lengvesniems žvejams. Didžiausiam stabilumui apsvarstykite platesnę specialiai žvejybai skirtą lentą. Pridėkite Aquafarer Life Vest Pro dėl saugumo ir komforto ilgų žvejybos sesijų metu.
  faq:
    - q: SUP Ar žvejyba yra saugi?
      a: Taip, laikantis atsargumo priemonių. Visada dėvėkite PFD, naudokite pavadėlį ir tikrinkite orų prognozes. Venkite vėjo nuo jūros.SUP Žvejyba yra saugiausia apsaugotuose vandenyse.
    - q: Ar galiu stovėti ir mesti meškerę žvejybojeSUP?
      a: Taip, tai yra pagrindinis privalumas. 34 colių+ pločio lenta suteikia pakankamą stabilumą stovintiems metimams. Dauguma žvejų mano, kad stovintys metimai yra tikslesni nei iš baidarės.
    - q: Kaip pervežti žvejybos įrangą SUPant ?
      a: Naudokite pieno dėžę, pritvirtintą prie terasos su PVC meškerių laikikliais. Pridėkite mažą šaldytuvą, pritvirtintą priekyje. Naudokite vandeniui atsparius sausus maišus įrangai.
    - q: Ar galiu žvejoti SUP sūriame vandenyje?
      a: Taip, bet po naudojimo sūriame vandenyje visą įrangą nuplaukite šviežiu vandeniu. Druska koroduoja pelekų varžtus, D formos žiedus ir pripučiamus vožtuvus.
