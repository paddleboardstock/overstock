  title: 'Vėjo sąlygosSUP: Kaip vėjas veikia jūsų irklą'
  description: Kaip vėjo greitis ir kryptis veikia SUP irklavimą. Supratimas apie vėją jūroje ir krante, vėjo prognozių skaitymas, irklavimo technikos dėl vėjo ir kada likti krante.
  definition: Vėjo sąlygos lemia SUP saugumą. Vėjo vėjas nuo kranto (nuo žemės iki jūros) stumia tave tolyn. Vėjas nuo kranto (nuo jūros iki žemės) stumia tave link kranto. Šoninis vėjas sukelia lentos posvyrį.
  tldr: 'Didžiausias saugus vėjas pradedantiesiems: 10 mazgų. Vidutinis: 15 mazgų. Pažengęs: 20 mazgų. Jūrinis vėjas yra labai pavojingas. Pirmiausia irkluokite prieš vėją. Šoniniame vėjyje irkluokite šiek tiek prieš vėją nuo tikslo. Atsiklaupkite stipriame vėjyje, kad sumažintumėte profilį.'
  problem: Irkluojate ramiomis sąlygomis, bet po 30 minučių vėjas sustiprėja ir jums sunku grįžti. Vėjas yra labiausiai neįvertintas SUP saugumo veiksnys.
  explanation: Vėjas veikia SUP labiau nei bet kuris kitas irklavimo laivas, nes stovite, sukurdami burės efektą. 10 mazgų vėjas stovinčiam irklininkui sukelia daug didesnį pasipriešinimą nei sėdint baidarininkui. Jūros vėjas stumia jus nuo saugumo. Šoninis vėjas sukelia nosies posūkį.
  solution: 'Prieš irkluodami patikrinkite vėjo greitį ir kryptį. Naudokite Beauforto skalę: 3 jėga (7–10 mazgų) pradedantiesiems, 4 jėga (11–16) vidutinėms. Pirmiausia irkluokite prieš vėją. Jei pagaunate vėjas, irkluokite 45 laipsnių kampu prieš vėją. Klaupkitės stipriame vėjyje.'
  recommendation: Prieš kiekvieną treniruotę naudokite vėjo prognozavimo programėlę (Windy, Windfinder). Aquafarer SUP Tour 12 geriau seka vėjyje nei platesnės lentos. Vėjuotomis sąlygomis naudokite trumpesnius irklavimo mostus ir didesnį dažnį.
  faq:
    - q: Kokia vėjo kryptis yra saugiausiaSUP?
      a: Sausumos vėjas (pučiantis link kranto) yra saugiausias – jis stumia jus atgal. Jūrinis vėjas yra pavojingiausias.
    - q: Kaip irkluoti šoniniame vėjyje?
      a: Irkluokite daugiau vėjo pusėje, kad išvengtumėte dreifo. Lentą pasukite prieš vėją nuo tikslo. Gilesnis centrinis pelekas padeda.
    - q: Ar galiu irkluoti esant 20 mazgų vėjui?
      a: Tik jei turi patirties apsaugotuose vandenyse. Pradedantieji neturėtų irkluoti virš 10 mazgų greičio.
    - q: Kaip veikia vėjo gūsiaiSUP?
      a: Gūsiai sukelia staigius pusiausvyros iššūkius. Esant gūsingoms sąlygoms, nuleiskite stovėseną ir būkite pasiruošę staigiems pokyčiams.
