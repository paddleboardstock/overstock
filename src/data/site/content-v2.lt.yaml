  title: 'Šaltojo vandens saugumas: irklavimas ir banglenčių sportas šaltomis sąlygomis'
  description: Šalto vandens saugumas SUPbanglenčių sportui ir baidarių sportui. Hipotermijos atpažinimas, tinkama įranga, reakcija į šalčio šoką ir avarinės procedūros panardinimui šaltame vandenyje.
  definition: Šalto vandens saugumas apima supratimą apie šalčio smūgio reakciją, plaukimo sutrikimus, hipotermiją bei įrangą ir technikas, padedančias išvengti šių pasekmių.
  tldr: Vandenyje žemiau 15C reikia hidrokostiumo. Žemiau 10C reikia batų, pirštinių ir gobtuvo. Šaltas šokas sukelia nevalingą dusulį. Plaukimo nesėkmė vandenyje žemiau 10C įvyksta per 3–5 minutes. Hipotermijos simptomai apima drebulį, sumišimą ir koordinacijos praradimą.
  problem: Išplauki saulėtą dieną, nežinodamas, kad vanduo yra 8°C. Įkrenti į vandenį, nevalingai įkvepi ir per kelias minutes pajunti, kaip galūnės nutirpsta. Šaltas vanduo žudo greičiau nei bet kuris kitas vandenyno pavojus.
  explanation: 'Panardinimas į šaltą vandenį turi keturis etapus: šaltas šokas (0–2 min) – dusulys, hiperventiliacija. Plaukimo nesėkmė (3–15 min) – raumenys atvėsta, koordinacija prastėja. Hipotermija (15–45 min) – kūno temperatūra nukrenta žemiau 35°C, sukeldama sumišimą ir širdies sustojimą. Po gelbėjimo – šaltas kraujas grįžta į branduolį.'
  solution: 'Patikrinkite vandens temperatūrą. Dėvėkite hidrokostiumą, pritaikytą temperatūrai. Niekada neirkluokite vienas vandenyje žemiau 15°C. Nešiokitės švilpuką ir telefoną. Jei įkrentate: kontroliuokite kvėpavimą, greitai vėl uždėkite lentą. Jei per šalta – kvieskite pagalbą.'
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm yra minimalus vandens 8-14C dydis. Pridėkite Aquafarer 5mm batus ir 3mm pirštines. Dėvėkite Life Vest Pro papildomai šiluminei apsaugai.
  faq:
    - q: Kiek ilgai galiu išgyventi 10C vandenyje?
      a: Šaltasis šokas trunka 1–2 minutes. Be plūduriavimo ir šiluminės apsaugos išgyvenamumas yra 30–60 minučių.
    - q: Kokie yra pirmieji hipotermijos požymiai?
      a: Nekontroliuojamas drebulys, sumišimas, prasta koordinacija, nerišlus kalbėjimas. Nutraukite veiklą ir nedelsdami apšilkite.
    - q: Kaip sušilti po šalto vandens seanso?
      a: Nusiimkite šlapią aprangą, nusausinkite, apsivilkite šiltus sluoksnius, įskaitant kepurę ir pirštines. Gerkite šiltus nealkoholinius gėrimus.
    - q: Ar galiu gauti hipotermiją vasarą?
      a: Taip — vanduo žemiau 15°C daugelyje vietų pasitaiko net vasarą. Vanduo šilumą praleidžia 25 kartus greičiau nei oras.
