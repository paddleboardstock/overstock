  title: 'Žiemos irklentės: įranga, saugumas ir technika šaltame vandenyje'
  description: Žiemą SUP reikia specialios įrangos ir pasiruošimo. Hidrokostiumo storis, šalto vandens saugumas, lentos reikalavimai ir technikos koregavimas irkluojant šaltu oru.
  definition: Žiemos irklentės sportas vyksta SUP esant vandens temperatūrai žemiau 15°C, todėl reikalinga šiluminė apsauga (hidrokostiumas arba sausas kostiumas), saugumo protokolai šaltame vandenyje ir įranga, pritaikyta šaltoms sąlygoms.
  tldr: 'Vandeniui žemiau 15°C reikia hidrokostiumo: 5/4/3 mm 8-14°C, 4/3 mm 12-18°C. Pridėkite batus, pirštines ir gobtuvą žemiau 10°C. Pripūskite lentas iki maksimumo PSI – šaltas oras sumažina slėgį. Dėvėkite ryškias spalvas, kad matomumas prastame apšvietime. Niekada neirkluokite vienas. Nešiokitės telefoną vandeniui atspariame dėkle.'
  problem: Norite žaisti SUP visus metus, tačiau žiemos sąlygos kelia iššūkių – šaltas vanduo, trumpesnės dienos, žieminės aprangos reikalavimai. Be tinkamo pasiruošimo žiemos sesijos yra šaltos, trumpos ir potencialiai pavojingos.
  explanation: Šaltas vanduo šilumą perduoda 25 kartus greičiau nei šaltas oras. Kritimas į 8C vandenį sukelia staigų šalčio šoką ir greitą raumenų atvėsimą. Kūno pirmoji užduotis yra išgyvenimas, o ne irklavimas. Žiemos irklavimui reikalinga šiluminė apsauga, kuri palaiko judrumą – pusiausvyrą tarp šilumos ir judesių amplitudės.
  solution: 'Įrangos kontrolinis sąrašas: 5/4/3 mm hidrokostiumas su krūtinės užtrauktuku, 5 mm batai, 3 mm pirštinės, neopreno gaubtas PFD (suteikia papildomą šiluminę izoliaciją), telefonas neperšlampamame dėkle, švilpukas. Technika: irkluokite arčiau kranto, nurodykite maršrutą, atidžiai patikrinkite orą. Apšilimas po to: turėkite paruoštus sausus drabužius ir šiltus gėrimus.'
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm su termo pamušalu yra idealus žiemaiSUP. Pridėkite Aquafarer 5 mm batus ir 3 mm pirštines. Dėvėkite Life Vest Pro dėl papildomo kūno šilumos ir saugumo.
  faq:
    - q: Ar galiu naudoti A SUP užšalimo temperatūroje?
      a: Taip, bet venkite ledo susidarymo ant lentos. Ledas gali PVCpažeisti. Neirkluokite, jei ant vandens paviršiaus susidaro ledas.
    - q: Ar man reikia specialios lentos žiemai?
      a: Ne, jūsų įprastas pripučiamas SUP įrenginys veikia gerai. Šaltas oras sumažina PSI — pripučiamas iki maksimalaus slėgio. Lenta jausis šiek tiek standesnė.
    - q: Ar saugu žiemą SUP būti vienam?
      a: Ne – visada irkluokite su draugu šaltame vandenyje. Hipotermija gali prasidėti per kelias minutes po kritimo.
    - q: Kaip apšilti treniruotės metu?
      a: Dėvėkite sluoksniuotą stilių – neopreno gobtuvą, batus ir pirštines galima nusiimti, jei sušilsite. Laikykite termosą su šiltu gėrimu krante.
