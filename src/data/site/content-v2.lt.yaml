  tldr: Aquafarer buvo įkurta tam, kad vandens sportas būtų prieinamas neaukojant kokybės ir neišleidžiant daug pinigų. Mes orientuojamės tik į pripučiamas drop-stitch lentas ir aukštos kokybės hidrokostiumus, nes tikime, kad geriausia įranga yra ta, kurią iš tikrųjų naudojate – ir niekas nėra naudojama labiau nei lengvai laikoma ir patikima įranga.
  problem: Vandens sporto įranga tapo vis brangesnė ir labiau specializuota. Kietosios lentos reikalauja saugojimo vietos ir transportavimo sprendimų. Hidrokostiumai kainuoja tiek pat, kiek skrydis. Banglenčių sportas neturėtų SUP reikalauti antros hipotekos ir garažo pilnos įrangos.
  explanation: 'Tradiciniai banglenčių sportai ir SUP prekių ženklai pirmiausia orientuoti į našumą, o tik po to – prieinamumą. Jų lentos skirtos pažengusiems vartotojams ir parduodamos už aukštas kainas, tikintis, kad pirkėjai jau turi sandėliavimą, transportavimą ir patirtį.Aquafarer Pradėjome nuo kito klausimo: o kas, jei kurtume įrangą, kuri prioritetą teiktų realaus naudojimo patogumui – nešiojimuisi, ilgaamžiškumui ir vertei – tuo pačiu užtikrinant tikrą našumą? Atsakymas buvo sutelkta produktų linija: pripučiamos lentos su karinės klasės lentomis drop-stitch PVC , kurios telpa į kuprinę, ir hidrokostiumai su aukščiausios klasės funkcijomis (GBS siūlės, terminis pamušalas) už vidutinę kainą. Mes negaminame visko – gaminame tai, kas svarbiausia daugumai vandens sporto entuziastų.'
  solution: 'Aquafarer Laivo pilni rinkiniai: lenta, siurblys, kuprinė, pavadėlis ir remonto rinkinys – viskas, ko reikia plaukimui vandenyje. Mūsų hidrokostiumai atitinka prekės ženklų gamybos kokybę ir kainuoja 40 procentų daugiau. Vengiame triukų, riboto leidimo spalvų ir kasmetinių modelių atnaujinimų, skirtų padaryti praėjusių metų įrangą pasenusią.'
  recommendation: Peržiūrėkite visą Aquafarer kolekciją, kad pamatytumėte, kaip mes žiūrime į kiekvieną produktų kategoriją. Perskaitykite banglenčių dydžių vadovą ir nardymo kostiumo storio gaires, kad gautumėte praktiškų patarimų, galiojančių nepriklausomai nuo prekės ženklo. Tada išbandykite Aquafarer lentą ir pajuskite, kokį skirtumą daro sąmoningas dizainas.
  faq:
    - q: Kur Aquafarer gaminami produktai?
      a: Aquafarer lentos ir hidrokostiumai yra kuriami viduje ir gaminami bendradarbiaujant su sertifikuotomis gamyklomis Vietname ir Kinijoje, kurios specializuojasi drop-stitch statybos ir neopreno drabužių gamyboje.
    - q: Kuo skiriasi nuo Aquafarer kitų pripučiamų prekių ženklų?
      a: Dauguma pripučiamų prekių ženklų naudoja standartines PVC ir universalias drop-stitch.Aquafarer naudoja trijų sluoksnių karinės klasės korpusą PVC su austu drop-stitch šerdimi, todėl pasižymi didesniu standumu ir atsparumu pradūrimui nei pramonės standartų pripučiamos plokštės.
    - q: Ar Aquafarer siūlo garantiją?
      a: Taip — visos Aquafarer plokštės turi 2 metų garantiją nuo gamybos defektų. Hidrokostiumai turi 1 metų garantiją. Pratęstos garantijos galimybės prieinamos atsiskaitymo metu.
    - q: Aquafarer Ar tai ekologiškas prekės ženklas?
      a: Mes dirbame šiuo tikslu. Mūsų plokštės naudoja PVC nesintetinį produktą, kuris nėra biologiškai skaidus, bet gaminamas taip, kad tarnautų 5+ metus, taip sumažindami keitimo ciklą. Mūsų hidrokostiumai pagaminti iš kalkakmenio pagrindo neopreno, kuris turi mažesnį poveikį aplinkai nei naftos pagrindu pagamintos alternatyvos. Mes kompensuojame siuntimo emisijas patvirtintomis anglies kreditais.
