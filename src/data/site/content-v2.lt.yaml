  title: Vandenynų sauga ir atsakomybė (daugiau nei tik įranga)
  description: Aquafarerįsipareigojimą saugoti jus ir saugoti vandenyną, kurį dalijamės. Saugumo kortelės kiekvienoje dėžutėje, nemokamas edukacinis turinys, tvarus dizainas ir metinės gamtosaugos aukos.
  definition: Vandenynų sauga ir atsakomybė reiškia supratimą apie aplinką, kurioje plaukiate, gerbiant jūrų gyvūniją, mažinant ekologinį pėdsaką ir naudojant įrangą, skirtą ilgaamžiškumui bei remontui.
  tldr: Aquafarer Skatina jūrų saugumą per įrangos dizainą (ryškios spalvos, pavadėliai, gelbėjimosi liemenės) ir edukacinį turinį. Tikime, kad kiekvienas vandens sporto entuziastas turi atsakomybę suprasti vandenyno aplinką, gerbti jūrų gyvybę ir mažinti savo ekologinį pėdsaką. Mūsų įranga sukurta taip, kad tarnautų ilgai, todėl mažiau atsiduria sąvartynuose.
  problem: Daugelis vandens sporto prekių ženklų parduoda įrangą, tačiau nemoko savo klientų, kaip ją saugiai ar atsakingai naudoti. Nauji irkluotojai ir banglentininkai įžengia į vandenį nesuprasdami srovių, jūrų laukinės gamtos ar savo įrangos poveikio aplinkai.
  explanation: Vandenynų sauga yra daugiau nei kontrolinis sąrašas – tai mąstysena. Kiekvienas Aquafarer produktas dėžutėje turi greito paleidimo saugos kortelę. Mūsų svetainė ir vadovai (vandenynų saugumo pagrindai, banglenčių saugumo patarimai) suteikia nemokamą, išsamų saugumo švietimą. Aplinkosaugos srityje didžiausias bet kurios įrangos įmonės poveikis yra produkto ilgaamžiškumas. Lenta, kuri tarnauja 5 metus, o ne 2, sumažina gamybos apimtį perpus. Mes taip pat projektuojame atsižvelgdami į taisomumą – keičiami vožtuvai, pelekų dėžutės ir hidrokostiumo lopų rinkiniai palaiko įrangą naudojančią, o ne sąvartynuose.
  solution: Aquafarer Kiekvienam lentos pirkimui pridedamas pavadėlis ir remonto rinkinys. Mes skelbiame nemokamą saugumo turinį, apimantį srovių identifikavimą, orų prognozes ir įrangos patikras. Mūsų klientų aptarnavimo komanda pateikia būklės patarimus, kai siunčiate el. laišką dėl konkrečios vietos. Naudojame minimalų plastikinį pakuotę ir kompensuojame siuntimo anglies kiekį.
  recommendation: Pradėkite nuo vandenyno saugumo pagrindų vadovo ir banglenčių saugumo patarimų vadovo. Visada dėvėkite pavadėlį, pasitikrinkite orų prognozę ir niekada neirkuokite vieni, jei mokotės. Jei matote šiukšlių ar jūrų gyvūnų bėdoje, praneškite apie tai vietos valdžios institucijoms. Ilgaamžė įranga yra ta, kuri mažina atliekas – prižiūrėkite savo Aquafarer įrangą ir ji tarnaus daugelį metų.
  faq:
    - q: Aquafarer Ar palaiko vandenynų valymo iniciatyvas?
      a: Taip, mes skiriame 1 procentą metinių pajamų vandenynų valymo ir jūrų apsaugos organizacijoms. Klientai gali pasirinkti išskirtinę labdaros organizaciją atsiskaitymo metu, kad nukreiptų dalį savo pirkinių.
    - q: Kaip turėčiau atsikratyti seno nardymo kostiumo ar lentos?
      a: Neopreno hidrokostiumus galima perdirbti į jogos kilimėlius, krepšius ir izoliaciją per specializuotas programas. Pripučiamos lentos gali būti taisomos, paaukotos arba PVC atgautos tam tikrose perdirbimo įmonėse. Susisiekite su mūsų pagalbos komanda dėl patarimų.
    - q: Kokią saugos įrangą Aquafarer rekomenduoja pradedantiesiems?
      a: Tinkamai pripučiama gelbėjimosi liemenė (pripučiama arba putplasčio), susuktas pavadėlis, švilpukas ir apsauginis kremas nuo saulės. SUP Irkluotojams atvirame vandenyje daugelyje jurisdikcijų privaloma ir visada rekomenduojama gelbėjimosi liemenė.
    - q: Ar Aquafarer siūlo saugumo kursus?
      a: Mes tiesiogiai neorganizuojame kursų, tačiau bendradarbiaujame su sertifikuotais banglenčių ir SUP saugumo instruktoriais, kurie siūlo internetinius ir gyvus mokymus. Dėl rekomendacijų kreipkitės į mūsų pagalbos komandą savo regione.
