  title: 'SUP Irklavimo vadovas: Pasirinkite tinkamą irklą pagal savo stilių'
  description: Išsamus SUP irklų gidas – ilgis, medžiagos (aliuminis, stiklo pluoštas, anglis), mentelių formos ir kaip irklų pasirinkimas veikia jūsų irklavimo patirtį.
  definition: SUP Irklas susideda iš veleno (aliuminio, stiklo pluošto arba anglies) ir mentelės (dihedralio, kaušelio arba plokščio). Ilgis turėtų būti 8–10 colių virš jūsų aukščio bendram irklavimui.
  tldr: 'Irklų ilgis: 8-10" virš jūsų aukščio universaliam naudojimui, 6-8" bangoms, 10-12" turui. Medžiagos: aliuminis (pigus, sunkus), stiklo pluoštas (vidutinė klasė, geras lankstumas), anglis (lengvas, standus, brangus). Peilio forma: dihedrinis (stabilus sekimas), įsiurbimas (galingas), plokščias (universalus). Reguliuojamos irklės puikiai tinka pradedantiesiems.'
  problem: Dauguma iSUP komplekte esantis irklas veikia, bet yra sunkus ir neefektyvus. Atnaujinimas pagerina irklavimo efektyvumą ir malonumą, tačiau pasirinkimai yra painūs.
  explanation: 'Irklų ilgis veikia smūgio efektyvumą – per trumpas reikalauja lenkimosi, per ilgas – pečių nuovargį. Svorį lemia medžiaga: anglies mentelės sveria 18–24 uncijas, o aliuminis – 28–36 uncijas. Mentės dydis turi įtakos galiai: didesnės mentės (100+ kv. colių) suteikia daugiau traukos per judesį, bet greičiau pavargsta. Dihedrinės mentės juda tiesiai; įsiurbimo mentės suteikia daugiau sukibimo.'
  solution: 'Tinkamam ilgiui: stovėkite su irklu vertikaliai, ištieskite ranką į viršų — irklo rankena turėtų pataikyti į riešą. Dėl medžiagos: pradėkite nuo stiklo pluošto kaip vidutinio svorio patobulinimo. Ašmenims: rinkitės dihedral bendram irklavimui. Veikloms: turizmo irklės yra ilgesnės su mažesniais ašmenimis; banglenčių irklės trumpesnės su platesnėmis mentėmis.'
  recommendation: 28 Aquafarer uncijų anglies irklas yra geriausias atnaujinimas dažniems irkluotojams. Komplekte esantis reguliuojamas trijų dalių aliuminio irklas tinka pradedantiesiems ir kelionėms.
  faq:
    - q: Kokio ilgio turėtų būti mano SUP irklas?
      a: Išmatuok ūgį coliais ir pridėk 8-10 plaukimui iš visų pusių. Banglenčių sportui pridėk 6-8. Kelionėms pridėk 10-12.
    - q: Ar anglies irklas vertas pinigų?
      a: Taip, įprastiems irkluotojams – svorio sumažėjimas žymiai sumažina nuovargį ilgų treniruočių metu. Retam naudojimui stiklo pluoštas yra gera vertė.
    - q: Kas yra reguliuojama mentelė?
      a: 2 arba 3 dalių mentelė su ilgio reguliavimu, ideali dalintis tarp vartotojų arba reguliuoti pagal skirtingas veiklas.
    - q: Kaip prižiūrėti savo irklą?
      a: Po naudojimo sūriame vandenyje skalaukite šviežiu vandeniu. Venkite važiuoti per jį ar laikyti jį tiesioginėje šilumoje. Patikrinkite žiedą (jungtį) dėl smėlio.
