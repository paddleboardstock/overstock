  title: 'SUP Dydžio gidas: Ilgis, plotis ir tūris paaiškinti'
  description: Raskite tinkamą SUP dydį pagal savo svorį, įgūdžių lygį ir irklavimo stilių. Ilgis lemia sekimą, plotis – stabilumą, o tūris – svorio talpą.
  definition: SUP dydis apibrėžiamas pagal ilgį (greitį ir slydimą), plotį (pirminį stabilumą), storį (antrinį stabilumą ir tūrį) ir tūrį litrais (bendrą svorio talpą).
  tldr: 'VisapusiškumasSUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Kelionės: 12''-14'' x 30"-32" (280-350L). Bangos: 8''-10'' x 30"-32" (140-220L). Pradedantiesiems reikia pločio virš 32" ir tūrio, viršijančio kūno svorį 60-80L. Jūsų svoris kilogramais plius 60L yra minimalus tūrio tikslas stabilumui.'
  problem: Kiekvienas SUP prekės ženklas nurodo lentas pėdomis, coliais ir litrais, tačiau nežinodami, kaip šie matmenys atitinka realų pojūtį, rizikuojate pirkti lentą, kuri yra pasvirusi, lėta arba neišlaiko jūsų svorio.
  explanation: 'Ilgis lemia, kaip greitai lenta irkluoja ir kaip gerai ji juda tiesia linija. Ilgesnės lentos (12+'') slysta tarp smūgių ir išlaiko trajektoriją. Trumpesnės lentos (mažesnės nei 10'') lengvai sukasi, bet reikalauja dažnesnių irklų jungiklių. Plotis lemia pagrindinį stabilumą – stabilumą stovint. 30" lenta pradedantiesiems atrodo tarsi paviršutiniška; 34" – kaip prieplauka. Storis lemia tūrį – storesnė lenta plaukioja aukščiau, bet gaudo daugiau vėjo. Tūris litrais yra vienintelis geriausias rodiklis: pakrauta lenta (jūs ir įranga) ramybės būsenoje turi panirti 2–4 colius.'
  solution: 'Suderinkite savo lentos matmenis su trimis veiksniais: svoriu (lemia minimalų tūrį), pagrindine veikla (nustato ilgį) ir įgūdžių lygiu (nustato plotį). Pradedantiesiems svorį kilogramais dauginkite iš 2,2, kad gautumėte minimalų litrų kiekį. Tarpiniams – dauginkite iš 1,8. Pažengusiems – dauginkite iš 1,4.'
  recommendation: Aquafarer SUP Explorer 11, kurio matmenys 11' x 33" x 6" ir 260L, tinka daugumai dviratininkų iki 100 kg visapusiškam irklavimui. Atnaujinkite SUP į Tour 12' x 31" dėl geresnio turizmo greičio ir slydimo.
  faq:
    - q: Kokio SUP dydžio man reikia pagal mano svorį?
      a: 'Raiteliams iki 70 kg: 10-11'' x 32" (220-260L). 70-90 kg: 11-12'' x 33" (260-300L). 90-110 kg: 11-12'' x 34" (300-350L). Daugiau nei 110 kg: 12'' x 34-36" (350L+).'
    - q: Ar ilgesnis yra SUP greitesnis?
      a: Taip. Ilgesnės lentos turi geresnį ilgio ir pločio santykį, mažindamas pasipriešinimą. 14 pėdų touring SUP lenta yra žymiai greitesnė nei 11 pėdų universali lenta su tokiu pačiu irklavimo pajėgumu.
    - q: Koks SUP plotis yra stabilus pradedantiesiems?
      a: 33–34 coliai yra idealus pasirinkimas pradedantiesiems iki 90 kg. Žemiau 32 colių reikia gero balanso. Virš 34 colių yra labai stabilu, bet lėtesnis ir sunkiau irkluoti vėjyje.
    - q: Ar galiu naudoti universalią lentą turams?
      a: Taip, trumpiems turams iki 10 km. Ilgesniems atstumams specializuota turizmo lenta geriau seka ir efektyviau įveikia atstumą.
