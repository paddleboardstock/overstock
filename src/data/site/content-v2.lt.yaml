  title: 'Kelionės su pripučiamu daiktu: SUPišsamus gidas'
  description: Išsamus kelionės su pripučiamu daiktu vadovas SUP – aviakompanijų taisyklės, pakuotės patarimai, kelionės vietos pasirinkimas ir skrydžio metu apsauga.
  definition: SUP Kelionė reiškia pripučiamos irklentės transportavimą kaip registruotą bagažą ar transporto priemonės krovinį, įskaitant lentos pakavimą, apsaugą ir surinkimą kelionės vietoje.
  tldr: Pripučiami daiktai yra geriausia kelionė. SUPSupakuokite lentą į kuprinę, registruokite kaip didelį bagažą (dauguma oro linijų leidžia iki 32 kg). Apvyniokite pelekus ir pumpuokite atskirai. Atvykite anksčiau į registraciją. Ištirkite vietines sąlygas ir vandens prieinamumą savo kelionės vietoje. Rinkitės vietas su ramiu vandeniu ir patogiais pakilimo taškais.
  problem: Norite irkluoti naujose vietose, bet kietos lentos transportavimas yra neįmanomas. Net pripučiamos lentos turi oro linijų apribojimus, kurie gali sukelti problemų be tinkamo pasiruošimo.
  explanation: 'Dauguma oro linijų priima SUP kuprines kaip registruotą bagažą, tačiau taisyklės skiriasi. Pagrindiniai matmenys: Aquafarer kuprinė supakuota apie 90x40x30 cm. Svoris yra apie 15 kg – daugumoje oro linijų ribų. Kai kurios oro linijos taiko didelio dydžio bagažo mokesčius. Jei įmanoma, laikykite rankinį siurblį ir peleklus. Prieš atvykdami pasidomėkite vietinėmis vandens sąlygomis, paleidimo mokesčiais ir sandėliavimu.'
  solution: 'Pakuokite lentą laisvai, kad nesusidarytų raukšlių. Siurblį ir pelekus apvyniokite atskirai. Atvykite anksčiau registracijai ir būkite draugiški su agentais. Ištirkite kelionės tikslą: patikrinkite vėjo kryptį, vandens prieigos taškus ir vietinius SUP reikalavimus. Atvykę pripūskite lentą iki galo, kad patikrintumėte, ar nėra transporto pažeidimų.'
  recommendation: Aquafarer SUP Explorer 11 su pridėta kuprine yra puikus kelionės palydovas. Jis išgyveno šimtus skrydžių. Derinkite su Life Vest Classic kelionams, kur reikalingi PFD.
  faq:
    - q: Ar oro linijos ima papildomą mokestį už SUP bagažą?
      a: Daugelis juos laiko standartiniu registruotu bagažu, jei sveria mažiau nei 23–32 kg. Kai kurios ima didelius mokesčius. Patikrinkite savo oro linijų sporto įrangos politiką.
    - q: Ar galiu pasiimti rankinį bagažą SUP ?
      a: Ne, kuprinė viršija rankinio bagažo dydžio ribas. Visada ją patikrinkite. Nešiokite pompą ir mažus priedus rankiniame bagaže.
    - q: Kaip išvengti pažeidimų skrydžių metu?
      a: Lentą laisvai sudėkite į krepšį. Padėkite pelekus ir kietus daiktus centre, suvyniotus į drabužius. Pažymėkite maišelį kaip trapų.
    - q: Kokios yra geriausios SUP kelionių kryptys?
      a: 'Ramus vanduo: Tahoe ežeras, Baja Kalifornija. Pakrantė: Maui, Algarvė, Kornvalis. Vidinė dalis: Kanados ežerai, Italijos ežerai.'
