  title: Banglentės dydžio vadovas (svarbiausia yra tūris)
  description: Nustokite spėlioti banglenčių dydžius. Tūris litrais lemia viską – kaip lengvai pagaunate bangas, kaip stabiliai jaučiatės ir kaip greitai progresuojate. Per 2 minutes raskite tikslinį litrą.
  definition: Banglentės dydis daugiausia priklauso nuo tūrio (litrų), o ne ilgio. Tūris lemia plūduriavimo ir bangų gaudymo gebėjimą. Ilgesnės lentos irkluoja greičiau; platesnės lentos yra stabilesnės; storesnės lentos suteikia daugiau tūrio be papildomo ilgio.
  tldr: Banglentės dydis priklauso nuo tūrio, o ne tik ilgio. Pradedantiesiems reikia 60–80 litrų, tarpiniams – 35–55 litrų, o pažengusiems – 20–35 litrų. Pagrindinis veiksnys – svoris – kiekvieniems 10 kg reikia maždaug 10–12 litrų tūrio.
  problem: Stovint priešais banglenčių lentyną su skaičiais kaip 7'2" x 22" x 3" ant bėgelio, net neįsivaizduoji, kaip tie matmenys jaučiasi vandenyje. Pirkti pagal išvaizdą ar tai, ką važiuoja draugas, lemia, kad lenta yra arba per nestabili, arba per kieta irkluoti.
  explanation: 'Banglentės dydį geriausia suprasti trimis matmenimis: ilgiu (irklų galia ir bangos gaudymo galia), pločiu (stabilumu) ir storiu (tūriu ir plūde). Tikrasis svarbus skaičius yra tūris litrais. Putplasčio lentos ir pripučiamos lentos pasiekia didelį tūrį per plotį ir storį, o ne per didelį ilgį, todėl pradedantiesiems jas galima lengvai valdyti. Tobulėjant, sumažinate tūrį, kad lenta galėtų giliau įsiskverbti į bangos paviršių ir greičiau pasisukti.'
  solution: 'Naudokite tūrio ir svorio skaičiuoklę: pradedantiesiems svorį padalykite kilogramais iš 1,5, kad gautumėte tikslinį litrą. Vidutiniam – dalinkite iš 2. Vidutinio dydžio lentos turėtų rinktis lentas su vidutiniu rocker ir skvošu arba apvalia uodega, kad būtų universalesnės.'
  recommendation: Aquafarer Surfboard Pro siūlo 75 litrus tūrio 10'6" korpuse – idealu pradedantiesiems iki 90 kg. Lengvesni vairuotojai gali rinktis SUP Tour 12, kad jaustųsi manevringiau važiuojant.
  faq:
    - q: Ar aukštis svarbus banglentės dydžiui?
      a: Ūgis svarbesnis už svorį. Aukštas, lengvas banglentininkas turi mažiau apimties nei žemas, sunkus banglentininkas tokio pat ūgio. Naudokite svorį kaip pagrindinį matą ir koreguokite pagal fizinę formą bei irklavimo jėgą.
    - q: Kas nutinka, jei mano plokštė turi per didelį garsumą?
      a: Per didelis tūris verčia lentą bangos paviršiuje jaustis šiurkščiai ir nestabiliai. Posūkiuose bus sunku nuskandinti bortą ir gali atšokti nuo vandens apatiniuose posūkiuose.
    - q: Kas nutinka, jei mano plokštė turi per mažą tūrį?
      a: Tau bus sunku irkluoti į bangas, per daug grimzti pakilimo metu ir jaustis nestabiliai tiesiog sėdint ant lentos laukiant. Pradedantiesiems beveik visada reikia daugiau tūrio, nei jie mano.
    - q: Kaip žinoti, kada rinktis mažesnį dydį?
      a: Kai galite nuolat gaudyti bangas, sklandžiai iššokti ir atlikti paprastus posūkius ant esamos lentos, metas numesti 5–10 litrų. Per anksti sumažinus dydį, progresas sulėtėja.
