  title: 'Pripučiama SUP ar kieta lenta: kuri jums tinkamiausia?'
  description: Pripučiamas ir kietas SUP palyginimas, apimantis nešiojamumą, našumą, patvarumą, kainą ir daiktalaikį. Tikri skirtumai mėgėjams, keliautojams ir sportiniams naudotojams.
  definition: Pripučiamas SUP (iSUP) naudoja konstrukciją, drop-stitch PVC pripūstą iki 15–20 PSIlaipsnių. Kietas naudoja SUP epoksidą, stiklo pluoštą arba anglies konstrukciją ant putplasčio šerdies.
  tldr: Pripučiamos SUPs lentos laimi dėl mobilumo (kuprinės į kuprinę), patvarumo (atšoka vietoje įbrėžimų) ir laikymo (telpa spintoje). Kietos lentos laimi pagal našumą (standesnės, greitesnės, geresnis slydimas). Rinkitės iSUP, jei keliaujate, turite ribotą vietą arba esate pradedantysis. Rinkitės kietą lentą, jei prioritetas yra našumas.
  problem: Diskusija tarp pripučiamų ir kietų daiktų SUP turi stiprių šalininkų abiejose pusėse. Nesuprasdami tikrųjų skirtumų, galite pasirinkti lentą, kuri netinka jūsų gyvenimo būdui.
  explanation: Kietosios lentos yra lengvesnės, standesnės ir greitesnės. Standi konstrukcija tiesiogiai perduoda irklavimo energiją judėjimui į priekį. Tačiau transportavimui ir atsargiam valdymui reikia stogo bagažinių. Pripučiami daiktai susideda į kuprines, atlaiko oro keliones ir atšoka nuo uolų. Šiuolaikiniai iSUP 18–20 laipsnių yra PSI stebėtinai standūs, bet šiek tiek lankstosi irkluojant stipriai.
  solution: Rinkitės pripučiamą lentą, jei neturite vietos daiktams, keliaujate su lenta, esate pradedantysis arba irkluokite akmenuotose vietose. Rinkitės kietą lentą, jei lenktyniaujate, keliaujate ilgus atstumus arba prioritetą teikiate maksimaliam našumui. Daugelis irkluotojų turi abu.
  recommendation: Aquafarer SUP Explorer 11 yra geriausias pasirinkimas daugumai irkluotojų – jis suteikia 90 % kietos lentos našumo su 10 kartų didesniu patogumu. Kietą lentą pridėkite vėliau, jei jūsų našumo poreikiai augs.
  faq:
    - q: Ar pripučiamos SUPs lentos yra tokios pat greitos kaip kietos lentos?
      a: Kietosios lentos yra 5–10 % greitesnės. Rekreaciniams irkluotojams greičio skirtumas yra minimalus. Lenktynininkams būtinos kietos lentos.
    - q: Ar pripučiamos SUPs trasos yra tokios pat kaip kietos lentos?
      a: Panašiai kaip kokybiški pelekai. Daugumos iSUP platesnis profilis sukuria šiek tiek didesnį pasipriešinimą, tačiau šiuolaikiniai dizainai tai sumažina.
    - q: Kurį lengviau pataisyti?
      a: Kietas lentas galima užlopyti epoksidiniais taisymo rinkiniais. Pripučiamoms plokštėms reikalingi PVC lopų rinkiniai. Abu galima atlikti savarankiškai smulkiems remontams.
    - q: Kuris geresnis banglenčių sportui?
      a: Kietos lentos geriau tinka pažengusiam banglenčių sportui. Pradedančiams ir vidutinio lygio banglenčių sportui pripučiamos lentos veikia gerai ir yra saugesnės.
