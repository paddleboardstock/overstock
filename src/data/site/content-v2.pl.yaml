- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Przewodnik po kotwicy: Pozostań na miejscu podczas wędkowania lub fotografowania'
  description: Kompletny przewodnik po kotwiczeniu SUP — typy kotwic (grzybowa, składana, kołek), konfiguracja wózka kotwicznego, techniki rozstawiania i kwestie bezpieczeństwa związane z utrzymywaniem pozycji.
  definition: Kotwica SUP to ciężar przymocowany do liny, który utrzymuje deskę w pozycji względem wiatru i prądu. Do powszechnie używanych typów należą kotwice grzybkowe, składane i paliki do mocowania.
  tldr: Użyj kotwicy w kształcie grzyba (1,5-3 lb) na mulistym lub piaszczystym dnie, kotwicy składanej na skalistym dnie lub palika kotwicznego na płytkiej wodzie z miękkim dnem. Kotwica powinna ważyć 1,5-3 lb w warunkach spokojnej pogody, 3-5 lb przy wietrze i prądzie. Zawsze używaj wózka kotwicznego, aby dostosować pozycję i wiedzieć, kiedy zwolnić kotwicę.
  problem: Znajdujesz idealne miejsce do wędkowania, ale wiatr i prąd co kilka minut zbaczają Cię z pozycji. Bez kotwicy, SUP wędkowanie i fotografia są frustrującymi ćwiczeniami w ciągłym przemieszczaniu się.
  explanation: Kotwica działa poprzez przeciąganie po dnie, aż się zahaczy. Kotwice grzybkowe wbijają się w miękkie dno i dobrze trzymają w piasku i mule. Składane kotwice mają ramiona, które wbijają się w twarde lub skaliste dno. Słupy kotwiczące działają w płytkiej wodzie poprzez bezpośrednie wciśnięcie w dno.
  solution: Zainstaluj system wózka do kotwicy (linę z przesuwającym się pierścieniem po jednej stronie deski), aby dostosować punkt mocowania kotwicy. Przymocuj 50-75 stóp liny do kotwicy. Rozwiń w górę wiatru lub prądu od wybranej pozycji. Użyj systemu szybkiego zwalniania, aby odłączyć w sytuacjach awaryjnych. Nigdy nie kotwicz w silnym prądzie ani tam, gdzie nie możesz łatwo odzyskać kotwicy.
  recommendation: Składany kotwica o wadze 3 lb z 50' liny sprawdza się w większości warunków wędkarskich SUP. Dodaj system wózka kotwicznego, używając pierścieni D na swoim Aquafarer SUP Explorer 11.
  faq:
    - q: Jakiego rozmiaru kotwicy potrzebuję do SUP?
      a: 1,5-3 lb dla spokojnych jezior i wolno płynących rzek. 3-5 lb dla obszarów przybrzeżnych z wiatrem lub prądem. Za duże kotwice są trudne do wyciągnięcia.
    - q: Ile liny kotwicznej potrzebuję?
      a: Standardowy jest stosunek 5:1 (5 stóp liny na 1 stopę głębokości). W 10 stopach wody użyj 50 stóp liny.
    - q: Czy kotwiczenie jest niebezpieczne na SUP?
      a: Tylko jeśli zakotwiczysz przy prądzie lub wietrze na tyle silnym, aby wywrócić deskę. Zawsze używaj systemu szybkiego zwalniania, który można natychmiast odłączyć.
    - q: Czy mogę zakotwiczyć w dowolnej wodzie?
      a: Sprawdź lokalne przepisy. Niektóre obszary ograniczają kotwiczenie w celu ochrony trawy morskiej lub środowisk morskich. Nigdy nie kotwicz na rafach koralowych.
