- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Przewodnik po rozmiarach: wyjaśnienie długości, szerokości i objętości'
  description: Znajdź odpowiedni rozmiar SUP w oparciu o swoją wagę, poziom umiejętności i styl wiosłowania. Długość określa tor jazdy, szerokość stabilność, a objętość pojemność wagową.
  definition: Rozmiar SUP określany jest przez długość (prędkość i ślizg), szerokość (stabilność podstawową), grubość (stabilność wtórną i objętość) oraz objętość w litrach (całkowita nośność).
  tldr: 'Uniwersalna SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Turystyka: 12''-14'' x 30"-32" (280-350L). Surfing: 8''-10'' x 30"-32" (140-220L). Początkujący potrzebują szerokości powyżej 32" i objętości przewyższającej masę ciała o 60-80L. Twoja waga w kg plus 60L to minimalny cel objętości dla stabilności.'
  problem: Każda marka SUP podaje wymiary desek w stopach, calach i litrach, ale nie znając, jak te wymiary przekładają się na odczucia w rzeczywistości, ryzykujesz zakup deski, która jest chybotliwa, wolna lub nie może utrzymać Twojej wagi.
  explanation: 'Długość determinuje, jak szybko wiosłuje deska i jak dobrze utrzymuje prostą linię. Dłuższe deski (12''+) suną między zamachami wiosła i utrzymują kierunek. Krótsze deski (poniżej 10'') skręcają łatwo, ale wymagają częstszej zmiany rąk przy wiosłowaniu. Szerokość determinuje podstawową stabilność — stabilność przy staniu. Deska o szerokości 30" wydaje się chwiejna dla początkujących; 34" jest jak pomost. Grubość determinuje objętość — grubsza deska unosi się wyżej, ale bardziej łapie wiatr. Objętość w litrach jest najlepszym pojedynczym wskaźnikiem: załadowana deska (ty wraz z wyposażeniem) powinna zanurzać się na 5-10 cm w stanie spoczynku.'
  solution: 'Dopasuj wymiary deski do trzech czynników: twojej wagi (określa minimalną objętość), głównej aktywności (określa długość) i poziomu umiejętności (określa szerokość). Dla początkujących, pomnóż wagę w kg przez 2,2, aby uzyskać minimalną ilość litrów. Dla średniozaawansowanych, pomnóż przez 1,8. Dla zaawansowanych, pomnóż przez 1,4.'
  recommendation: Aquafarer SUP Explorer 11 o wymiarach 11' x 33" x 6" z pojemnością 260L odpowiada większości wioślarzy do 100 kg do uniwersalnego wiosłowania. Ulepsz do SUP Tour 12 o wymiarach 12' x 31" dla lepszej prędkości turystycznej i poślizgu.
  faq:
    - q: Jaki rozmiar SUP potrzebuję do mojej wagi?
      a: 'Dla jeźdźców poniżej 70 kg: 10-11'' x 32" (220-260L). Dla 70-90 kg: 11-12'' x 33" (260-300L). Dla 90-110 kg: 11-12'' x 34" (300-350L). Dla powyżej 110 kg: 12'' x 34-36" (350L+).'
    - q: Czy dłuższy SUP jest szybszy?
      a: Tak. Dłuższe deski mają lepszy stosunek długości do szerokości, co zmniejsza opór. 14' deska turystyczna SUP jest znacznie szybsza niż 11' deska uniwersalna przy tym samym wysiłku wiosłowania.
    - q: Jaka SUP szerokość jest stabilna dla początkujących?
      a: 33-34 cale to idealny zakres dla początkujących do 90 kg. Poniżej 32 cale wymaga dobrej równowagi. Powyżej 34 cale jest bardzo stabilne, ale wolniejsze i trudniejsze do wiosłowania przy wietrze.
    - q: Czy mogę używać uniwersalnej deski do turystyki?
      a: Tak, na krótkie wycieczki poniżej 10 km. Na większe odległości dedykowana deska turystyczna lepiej utrzymuje tor jazdy i pokonuje dystans bardziej efektywnie.
