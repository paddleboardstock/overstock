  title: 'Konserwacja łodzi nadmuchiwanej: Chroń swoją inwestycję'
  description: Roczna lista kontrolna konserwacji pontonu. Czyszczenie, ochrona UV, kontrola szwów, zarządzanie ciśnieniem, pielęgnacja silnika i przygotowanie do zimy dla łodzi PVC i Hypalon.
  definition: Konserwacja łodzi pneumatycznej obejmuje czyszczenie, UV ochronę, zarządzanie ciśnieniem, kontrolę szwów i zaworów, zapobieganie pleśni oraz odpowiednie przechowywanie poza sezonem.
  tldr: Spłukuj po każdym użyciu w wodzie słonej. Nakładaj UV środek ochronny co 2-3 miesiące. Sprawdzaj ciśnienie wdmuchiwania przed każdą wyprawą. Kontroluj szwy, zawory i pawęż co miesiąc. Czyść łagodnym mydłem. Przechowuj po spuszczeniu powietrza w chłodnym, suchym miejscu poza sezonem.
  problem: Używałeś swojej dmuchanej łodzi przez jeden sezon, a teraz rury wyglądają na wyblakłe, szew przecieka, a pawęż jest miękka — wszystko to można było zapobiec dzięki rutynowej konserwacji.
  explanation: UV promieniowanie degraduje matrycę polimerową. Woda morska krystalizuje się w zakładkach i ściera tkaninę. Pleśń rozwija się w uwięzionej wilgoci. Nieprawidłowe ciśnienie powoduje zmęczenie materiału. Pawęż (szczególnie sklejka) wchłania wodę przez otwory po śrubach.
  solution: 'Po każdym użyciu: spłukać świeżą wodą, osuszyć, sprawdzić ciśnienie. Co miesiąc: przetrzeć rury środkiem ochronnym UV, sprawdzić szwy, skontrolować zawór. Co roku: dokładnie wyczyścić, sprawdzić gnijący tylny panel, nasmarować zawory, przetestować pod kątem mikro-przecieków.'
  recommendation: Używaj 303 Aerospace Protectant na rurach łodzi Aquafarer. Co roku zdejmuj zawory i nakładaj smar silikonowy. Przechowuj w torbie transportowej z saszetką osuszającą.
  faq:
    - q: Czy mogę użyć wybielacza do czyszczenia mojego dmuchanego łodzi?
      a: Nie — wybielacz niszczy powłokę tkaniny. Używaj łagodnego mydła i ciepłej wody. Na pleśń używaj rozcieńczonego białego octu.
    - q: Jak często powinienem stosować środek ochronny UV?
      a: Co 2-3 miesiące w trakcie sezonu użytkowania. Częściej w klimatach tropikalnych.
    - q: Czy muszę spuszczać powietrze z łodzi między użyciami?
      a: Nie jeśli używane co tydzień. Pozostawić napompowane z założonym pokrowcem UV. Na miesięczne przerwy spuszczać powietrze i przechowywać.
    - q: Jak utrzymać nadstawkę?
      a: Sprawdzaj śruby co miesiąc. Uszczelniaj odsłonięte krawędzie drewna corocznie lakierem jachtowym. Wymień, jeśli pojawią się miękkie miejsca.
