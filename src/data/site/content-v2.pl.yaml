- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Samoratunek: Jak wrócić na deskę w głębokiej wodzie'
  description: Każdy SUP wioślarz powinien opanować samoratownictwo. Krok po kroku techniki wsiadania na deskę w głębokiej wodzie, holowania jej do brzegu i radzenia sobie z plątaniną smyczy.
  definition: SUP samo ratowanie to technika ponownego wsiadania na deskę sup w głębokiej wodzie po upadku, obejmująca odzyskanie deski, ponowne wsiadanie ciała i odzyskiwanie wiosła.
  tldr: 'Po upadku: zachowaj spokój, trzymaj wiosło, dopłyń do deski. Połóż wiosło w poprzek deski. Użyj kopnięcia delfinem, aby unieść klatkę piersiową na deskę. Unieś najpierw jedną nogę, potem drugą. Najpierw uklęknij, potem wstań. Ćwicz na spokojnej wodzie, aż stanie się to pamięcią mięśniową.'
  problem: Spadasz z SUP do głębokiej wody i nie możesz się na nią wspiąć z powrotem. Deska jest śliska, jesteś zmęczony, a panika się pojawia. Nie znając techniki samoratownia, zwykły upadek staje się niebezpieczny.
  explanation: 'Samoratownictwo ma trzy etapy: odzyskanie (wpłynięcie na deskę i wiosłowanie), ponowne wejście na deskę (powrót na deskę) oraz kontynuacja (wznowienie wiosłowania). Kluczową techniką jest użycie wiosła jako stabilizatora oraz mocne kopnięcia nogami do napędzania górnej części ciała na deskę.'
  solution: 'Etap 1: płyń do deski. Trzymaj wiosło lub je odbierz. Etap 2: umieść wiosło prostopadle na desce. Kopać nogami energicznie, jednocześnie podciągając klatkę piersiową na środek deski. Etap 3: gdy klatka piersiowa znajdzie się na desce, unoś nogi jedna po drugiej. Etap 4: uklęknij, złap oddech, a następnie stopniowo wstań.'
  recommendation: Ćwicz samoratowanie w kontrolowanych warunkach, aż będziesz w stanie robić to bez zastanowienia. Używaj Aquafarer SUP Explorer 11, który ma dobrą przyczepność na pokładzie. Kamizelka ratunkowa Pro zapewnia dodatkową wyporność, jeśli masz trudności.
  faq:
    - q: Jak wrócić, jeśli jestem wyczerpany?
      a: Pozostań przy desce dla wyporności. Użyj rąk, aby przyciągnąć klatkę piersiową na deskę, nawet jeśli nogi nie mogą skutecznie kopać. Odpocznij w pozycji klęczącej przed wstaniem.
    - q: A co jeśli zgubię wiosło?
      a: Użyj ramion, aby wiosłować deskę do brzegu. Poproś innego wioślarza o pomoc. Natychmiast wymień zgubione wiosło.
    - q: Czy mogę samodzielnie ratować się na falach?
      a: Tak — ustaw deskę prostopadle do fal. Czasuj ponowne wejście na deskę między falami. Smycz trzyma deskę w pobliżu.
    - q: Jak radzić sobie z plątaniną smyczy?
      a: Pozostań spokojny, unosząc się na plecach, powoli rozplątuj smycz. Jeśli smycz jest owinięta wokół płetw, może być konieczne zdjęcie płetw w wodzie.
