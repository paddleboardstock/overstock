- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: 'Pianka 3mm kontra 5mm: Co najczęściej popełniają początkujący w zimnej wodzie'
  description: Przestań marznąć w trakcie sesji lub przegrzewać się na plaży. Prawdziwa różnica między piankami 3mm a 5mm — wykres temperatur, kompromisy w elastyczności i co naprawdę działa przy surfowaniu w zimnej wodzie.
  definition: Pianka jest odzieżą z neoprenu, która zatrzymuje cienką warstwę wody przy skórze, którą ciepło ciała ogrzewa w celu izolacji. Grubość (3 mm, 5 mm) określa zakres temperatur, jakie pianka może wytrzymać — im grubsza, tym cieplejsza, ale mniej elastyczna.
  tldr: Grubość pianki bezpośrednio określa ciepło i elastyczność. Używaj 3 mm w wodzie powyżej 16°C i 5 mm w wodzie między 8°C a 16°C. Grubsze pianki ograniczają ruchy, ale dłużej utrzymują ciepło — zawsze priorytetem powinna być dopasowanie, a nie marka.
  problem: Otwierasz sklep internetowy lub wchodzisz do sklepu z akcesoriami do surfingu i widzisz pianki oznaczone jako 3/2, 4/3, 5/4 oraz pełne pianki 5 mm. Te liczby nie mówią wiele, dopóki nie zdasz sobie sprawy, że niewłaściwa grubość oznacza albo marznięcie w połowie sesji, albo przegrzewanie się i pocenie na plaży.
  explanation: Pianki działają, zatrzymując cienką warstwę wody między skórą a neoprenem; twoje ciało ogrzewa tę wodę, tworząc izolację. Grubszy neopren zatrzymuje więcej wody, ale ogranicza elastyczność i wyporność. Kombinezon 3 mm (często 3/2 z cieńszymi rękawami) nadaje się do łagodnych warunków, podczas gdy 5 mm (5/4/3 lub pełne 5 mm) nadaje się do zimnej wody. Wejścia na klatkę piersiową uszczelniają lepiej niż na plecach i zmniejszają przepływ wody. Konstrukcja szwów — klejone i ślepo szyte (GBS) — decyduje o różnicy między przeciekającym kombinezonem a ciepłym.
  solution: Dopasuj grubość do lokalnej temperatury wody z marginesem błędu 5°C. Dla klimatu umiarkowanego kup 3/2 mm. Dla zimnej wody kup 5/4/3 mm. Dodaj buty, rękawice i kaptur, aby zwiększyć zakres o kolejne 5°C w dół. Przymierz kombinezon przed zakupem lub wybierz markę z hojną polityką zwrotów.
  recommendation: Aquafarer Wetsuit Pro w rozmiarze 5/4/3 mm jest idealny dla większości surferów w zimnej wodzie, oferując szwy GBS i podszewkę termiczną. Jeśli surfujesz w ciepłej wodzie powyżej 20°C, lepszym wyborem jest model 3/2 mm z zamkiem na klatce piersiowej.
  faq:
    - q: Jakiej temperatury wody wymaga pianka 5 mm?
      a: Temperatury wody między 8°C a 14°C wymagają pianki o grubości 5 mm. Poniżej 8°C potrzebna jest pianka z kapturem o grubości 6/5/4 mm. Między 14°C a 18°C dla większości osób dobrze sprawdza się pianka 4/3 mm.
    - q: Czy mogę nosić piankę 3 mm zimą?
      a: Tylko w łagodnych zimowych klimatach, gdzie woda utrzymuje temperaturę powyżej 16°C. Do prawdziwego zimowego surfingu potrzebna jest pianka 5 mm lub 5/4/3 mm. Buty, rękawice i kaptur dodają równoważne ciepło, bez potrzeby grubszego tułowia.
    - q: Jak ciasny powinien być kombinezon nurkowy?
      a: Przylegający, ale nie ograniczający ruchów. Nie powinno być żadnych kieszeni powietrznych ani luźnego neoprenu. Jeśli możesz wsunąć palec między skórę a kombinezon w dolnej części pleców, jest zbyt luźny. Jeśli oddychanie jest utrudnione lub ruchy są poważnie ograniczone, wybierz większy rozmiar.
    - q: Czy drogie pianki utrzymują cieplej?
      a: Wyższa cena często oznacza lepszy neopren (na bazie wapienia vs na bazie ropy naftowej), lepszą konstrukcję szwów (GBS vs tylko klejone) i lepszą elastyczność. Czynniki te mają bezpośredni wpływ na ciepło i trwałość, ale tylko jeśli dopasowanie jest prawidłowe.
