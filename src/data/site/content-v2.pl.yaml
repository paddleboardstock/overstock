- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Nawodnienie i ochrona przed słońcem: Zadbaj o bezpieczeństwo na wodzie'
  description: Podstawowe strategie nawodnienia i ochrony przeciwsłonecznej dla wioślarzy SUP. Odwodnienie i oparzenia słoneczne są najczęstszymi problemami SUP — jak zapobiegać obu podczas długich sesji.
  definition: SUP nawodnienie oznacza utrzymywanie równowagi płynów podczas wiosłowania poprzez regularne spożywanie wody. Ochrona przeciwsłoneczna obejmuje stosowanie filtrów SPF, ochronną odzież i planowanie sesji tak, aby unikać szczytowego UV.
  tldr: Pij 500 ml wody na każdą godzinę wiosłowania. Zabierz więcej niż myślisz, że potrzebujesz — bukłak 2 l lub kilka butelek. Nałóż wodoodporny krem z filtrem SPF 50+ przed wiosłowaniem i ponawiaj aplikację co 2 godziny. Noś kapelusz, okulary przeciwsłoneczne na pasku i odzież z filtrem UPF. Unikaj wiosłowania między 11:00 a 15:00, gdy UV jest najsilniejsze.
  problem: Masz wspaniałą sesję SUP, ale po godzinie zaczyna Cię boleć głowa, masz sucho w ustach i skóra Cię pali. Odwodnienie i poparzenie słoneczne podkradają się do Ciebie, ponieważ woda utrzymuje Cię w chłodzie.
  explanation: Odbicie od wody zwiększa narażenie na UV nawet o 40%. Chłodzący efekt wody i wiatru maskuje poparzenia słoneczne, dopóki nie jest za późno. Pot po wiosłowaniu zwiększa utratę płynów, a często nie ma miejsca, aby uzupełnić wodę na wodzie. Odwodnienie upośledza równowagę i podejmowanie decyzji, zwiększając ryzyko wypadków.
  solution: Przymocuj butelkę wody lub bukłak na wodę do systemu bungee deski. Pij co 15 minut, niezależnie od tego, czy jesteś spragniony, czy nie. Na 30 minut przed wyruszeniem na wodę nałóż krem z filtrem SPF 50+. Noś kapelusz z szerokim rondem, polaryzowane okulary przeciwsłoneczne z paskiem oraz koszulkę ochronną UPF 50+. Ponownie nakładaj krem przeciwsłoneczny co 2 godziny.
  recommendation: Użyj bukłaka na wodę przypiętego do przednich pierścieni D w twoim Aquafarer SUP. Noś koszulkę ochronną UPF 50+ pod swoim PFD. Używaj wodoodpornego kremu przeciwsłonecznego, który utrzymuje się pomimo potu i wody.
  faq:
    - q: Ile wody powinienem zabrać na SUP wyprawę?
      a: Minimum 1 litr na godzinę. Na 2-godzinną sesję weź 2 litry. Więcej w gorącej pogodzie. Najlepiej sprawdza się bukłak na wodę.
    - q: Jaki rodzaj kremu z filtrem jest najlepszy dla SUP?
      a: Wodoodporny, SPF 50+ o szerokim spektrum. Mineralne filtry przeciwsłoneczne (tlenek cynku, dwutlenek tytanu) są bezpieczne dla raf i działają dłużej.
    - q: Czy woda naprawdę odbija UV?
      a: Tak — woda odbija do 40% promieniowania UV, co oznacza, że otrzymujesz UV z góry i z dołu. To znacznie zwiększa ryzyko oparzeń.
    - q: Czy mogę dostać oparzenia słonecznego przez rash guard?
      a: Standardowe rash guardy zapewniają minimalną ochronę UV (około UPF 10-20). Szukaj odzieży oznaczonej UPF 50+ dla pełnej ochrony.
