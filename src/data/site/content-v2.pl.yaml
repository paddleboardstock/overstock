- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Naprawa pianki: Napraw samodzielnie rozdarcia, szwy i zamki'
  description: Przewodnik DIY dotyczący naprawy pianki neoprenowej w przypadku rozdarć, rozdzielenia szwów, zacinania suwaka i rozprutych nakolanników. Instrukcje krok po kroku z użyciem kleju do neoprenu.
  definition: Naprawa pianki polega na oczyszczeniu i zmatowieniu uszkodzonego obszaru, nałożeniu kleju neoprenowego oraz utwardzeniu pod ciśnieniem w celu przywrócenia wodoszczelności i elastyczności.
  tldr: 'Małe rozdarcia poniżej 1": nałożyć klej neoprenowy na obie strony, odczekać 10-15 minut aż stanie się lepkie, mocno docisnąć, utwardzać pod obciążeniem przez 12 godzin. Większe rozdarcia wymagają łaty z neoprenu. Problemy z zamkiem: najpierw nasmarować, a następnie sprawdzić zagniecenia materiału.'
  problem: Twój kombinezon ma małą dziurę, rozchodzący się szew lub zamek, który zacina się. Bez naprawy samodzielnej płacisz $150+ za wymianę, gdy naprawa kosztuje $5.
  explanation: Cement neoprenowy działa poprzez zmiękczanie powierzchni neoprenu, tworząc wiązanie chemiczne w miarę odparowywania rozpuszczalnika. Cement należy nanieść na obie powierzchnie i pozwolić mu stać się klejącym, zanim je połączy się. W przypadku rozdarć brzegi muszą być dokładnie wyrównane. Problemy z zamkiem często wynikają z korozji solnej lub tkaniny zaklinowanej w zębach.
  solution: 'Na rozdarcia: oczyść alkoholem, lekko przeszlifuj, nałóż cienką warstwę cementu na oba brzegi, poczekaj aż stanie się lepki, dokładnie dociśnij, nałóż ciężar, utwardzaj 12-24 godziny. Na łatki: wytnij łatkę o 1 cal większą niż rozdarcie, nałóż cement na oba, zaciskaj. Na zamek: spłucz, nałóż wosk do zamka, pracuj delikatnie.'
  recommendation: Trzymaj w torbie sprzętowej Aquafarer zestaw do naprawy pianki. W przypadku dużych napraw lub uszkodzeń szwów w newralgicznych miejscach zaleca się profesjonalną naprawę.
  faq:
    - q: Czy mogę użyć super glue na piance do nurkowania?
      a: Nie — super glue schnie twardo i krucho. Do napraw pianki używaj tylko cementu neoprenowego lub Aquasealu.
    - q: Jak długo utrzymuje się naprawa cementem neoprenowym?
      a: Prawidłowo wykonana naprawa jest często mocniejsza niż oryginalny neopren i wytrzymuje pozostałą część życia kombinezonu.
    - q: Czy mogę naprawić suwak, który całkowicie się rozdzielił?
      a: Jeśli pas oddzielił się od neoprenu, ponownie przyklej go klejem kontaktowym. Jeśli zęby są uszkodzone, wymień suwak profesjonalnie.
    - q: Jak naprawić piankę do nurkowania przeciekającą w szwie?
      a: Nałóż cienką warstwę aquaseal wzdłuż wewnętrznej strony przeciekającego szwu i pozostaw do utwardzenia na 24 godziny.
