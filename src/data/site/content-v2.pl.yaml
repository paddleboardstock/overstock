  title: 'Przewodnik po rozmiarach deski SUP: objętość, długość i szerokość dla każdego użytkownika'
  description: Kompletne rozmiary desek typu paddle board z zaleceniami objętości w zależności od wagi i aktywności. Zawiera łatwą w użyciu tabelę rozmiarów dla desek uniwersalnych, turystycznych, do surfowania i do jogi SUP.
  definition: Rozmiar deski SUP jest określany przez objętość (nośność i pływalność), długość (prędkość i tor jazdy), szerokość (stabilność) oraz grubość (rozkład objętości i odporność na wiatr).
  tldr: 'Użyj wagi, aby znaleźć minimalną objętość: 50-70 kg wymaga 220-260L, 70-90 kg wymaga 260-300L, 90-110 kg wymaga 300-350L, powyżej 110 kg wymaga 350L. Dla początkujących dodaj 20% do tych liczb. Szerokość ma znaczenie: 32" to poziom średniozaawansowany, 33-34" jest przyjazne dla początkujących, 35" jest bardzo stabilne.'
  problem: Wykazy rozmiarów desek typu paddle board używają stóp, cali i litrów zamiennie, co utrudnia porównywanie między markami.
  explanation: Objętość jest najprostszą miarą nośności — 1 litr słodkiej wody wypiera 1 kg ciężaru. Deska o pojemności 260 l teoretycznie może utrzymać 260 kg, ale praktyczna nośność jest niższa, ponieważ deska musi unosić się nad wodą. Całkowita waga (ciało plus sprzęt) powinna stanowić 30-40% objętości deski.
  solution: Docelowa objętość = (masa ciała w kg + masa sprzętu w kg) x 3. Dla kajakarza ważącego 75 kg z 5 kg sprzętu, cel = 80 x 3 = minimum 240L. Dla początkujących, pomnóż przez 3,5. Dla zaawansowanych, pomnóż przez 2,5.
  recommendation: Explorer 11 (260L, 11' x 33" x 6") Aquafarer SUP pasuje do większości jeźdźców ważących 50-100 kg. Lżejsi jeźdźcy mogą dobrać rozmiar AirDeck 270. Ciężsi jeźdźcy powinni rozważyć Tour 12 (300L+) SUP lub szersze deski.
  faq:
    - q: Czy wzrost ma znaczenie przy dobieraniu rozmiaru SUP?
      a: Wzrost ma mniejsze znaczenie niż waga. Wysoki lekki jeździec potrzebuje mniejszej objętości niż niski ciężki jeździec. Do określania objętości należy używać wagi jako głównego wyznacznika.
    - q: Co się dzieje przy zbyt dużej głośności?
      a: Deska siedzi zbyt wysoko, łapiąc wiatr jak żagiel. W chopie jest sprężysta jak korek. Jednak dla początkujących dodatkowa objętość jest lepsza niż za mała.
    - q: Co się dzieje przy zbyt małej głośności?
      a: Deska osadza się zbyt głęboko, powodując opór. Nosek może zanurzać się podczas wiosłowania (pearling). Szybko się męczysz, wiosłując częściowo zanurzoną deską.
    - q: Czy dmuchane deski wymagają innych rozmiarów niż twarde deski?
      a: Nieznacznie. Dmuchane deski przy 15+ PSI wypierają wodę podobnie jak twarde deski. Zalecenia dotyczące objętości mają zastosowanie w równym stopniu do obu typów.
