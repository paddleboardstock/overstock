- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Pielęgnacja pianki: spraw, aby Twój neopren trwał 2 razy dłużej'
  description: Odpowiednia pielęgnacja pianki przedłuża jej żywotność z 1 sezonu do 3+. Porady dotyczące płukania, suszenia, przechowywania i napraw piankowych kombinezonów. Unikaj typowych błędów, które niszczą pianki przedwcześnie.
  definition: Pielęgnacja pianki obejmuje płukanie świeżą wodą po każdym użyciu, suszenie z dala od bezpośredniego światła słonecznego, przechowywanie na płasko lub zawieszenie na szerokim wieszaku oraz okresowe czyszczenie w celu usunięcia soli, bakterii i zapachów.
  tldr: Spłucz piankę od środka i z zewnątrz świeżą wodą bezpośrednio po każdej sesji. Susz na lewej stronie w cieniu na szerokim plastikowym wieszaku. Przechowuj płasko lub złożoną w chłodnym, suchym miejscu. Nigdy nie zostawiaj pianek na bezpośrednim słońcu, w gorących samochodach ani w suszarkach. Używaj szamponu do pianek co 5-10 sesji.
  problem: Po jednym sezonie Twój kombinezon kąpielowy pachnie, neopren stracił elastyczność, szwy odchodzą, a zamek się zacina — wszystko to można było zapobiec przy odpowiedniej pielęgnacji.
  explanation: Kryształy soli osadzają się w neoprenie i ścierają materiał. Bakterie namnażają się w wilgotnym wnętrzu, wydzielając zapachy i rozkładając neopren. UV degraduje powłokę nylonową. Ciepło powyżej 50°C powoduje delaminację. Niewłaściwe suszenie odkształca neopren i obciąża szwy.
  solution: 'Po każdej sesji: dokładnie spłukać wewnątrz i na zewnątrz, odwrócić na lewą stronę, powiesić na szerokim plastikowym wieszaku w cieniu. Po wyschnięciu odwrócić na prawą stronę i przechowywać płasko. Co 5-10 sesji: prać szamponem do pianki. Co miesiąc: nasmarować zamek woskiem do zamków.'
  recommendation: Użyj Aquafarer szamponu do pianki do czyszczenia i Aquafarer wosku do zamka do konserwacji zamka. Przechowuj na Aquafarer szerokim wieszaku w siatkowej torbie.
  faq:
    - q: Czy mogę włożyć mój kombinezon do pralki?
      a: Nie zaleca się — pranie w pralce niszczy neopren. Jeśli musisz, używaj delikatnego cyklu, zimnej wody i woreczka siatkowego.
    - q: Jak pozbyć się zapachu z pianki do nurkowania?
      a: Namocz w chłodnej wodzie z szamponem do pianki lub białym octem przez 30 minut. Dokładnie spłucz.
    - q: Jak powinienem suszyć mój piankę?
      a: Na lewą stronę w cieniu na szerokim, wyściełanym plastikowym wieszaku. Unikać bezpośredniego światła słonecznego i metalowych wieszaków.
    - q: Czy mogę naprawić podartą piankę?
      a: Małe rozdarcia poniżej 1" można naprawić za pomocą kleju neoprenowego i łatki. Większe rozdarcia mogą wymagać profesjonalnej naprawy.
