- slug: ocean-safety-and-responsibility
  category: authority
  type: brand
  title: Bezpieczeństwo i odpowiedzialność na oceanie (więcej niż tylko sprzęt)
  description: Zaangażowanie Aquafarer w zapewnienie Ci bezpieczeństwa i ochronę oceanu, który dzielimy. Karty bezpieczeństwa w każdym pudełku, bezpłatne materiały edukacyjne, zrównoważony design i coroczne darowizny na rzecz ochrony środowiska.
  definition: Bezpieczeństwo i odpowiedzialność na oceanie oznacza rozumienie środowiska, w którym pływasz na desce, szanowanie życia morskiego, minimalizowanie swojego śladu ekologicznego oraz korzystanie ze sprzętu zaprojektowanego z myślą o trwałości i możliwości naprawy.
  tldr: Aquafarer promuje bezpieczeństwo na oceanie poprzez projektowanie sprzętu (jasne kolory, linki zabezpieczające, kamizelki ratunkowe) oraz treści edukacyjne. Wierzymy, że każdy entuzjasta sportów wodnych ma obowiązek rozumieć środowisko oceaniczne, szanować życie morskie i minimalizować swój ekologiczny ślad. Nasz sprzęt jest zaprojektowany tak, aby wytrzymał długo, dzięki czemu mniej trafia na wysypiska śmieci.
  problem: Wiele marek związanych ze sportami wodnymi sprzedaje sprzęt, ale nie edukuje swoich klientów, jak korzystać z niego bezpiecznie i odpowiedzialnie. Nowi kajakarze i surferzy wchodzą do wody, nie rozumiejąc prądów wstecznych, morskiej fauny ani wpływu ich sprzętu na środowisko.
  explanation: Bezpieczeństwo na oceanie to coś więcej niż lista kontrolna — to sposób myślenia. Każdy produkt Aquafarer zawiera w pudełku szybki przewodnik bezpieczeństwa. Nasza strona internetowa i przewodniki (podstawy bezpieczeństwa na oceanie, wskazówki dotyczące bezpieczeństwa podczas surfingu) oferują bezpłatną, szczegółową edukację w zakresie bezpieczeństwa. Z punktu widzenia środowiska, największy wpływ, jaki może mieć firma produkująca sprzęt, wynika z trwałości produktów. Deska, która służy 5 lat zamiast 2, zmniejsza ślad produkcyjny o połowę. Projektujemy też z myślą o możliwości naprawy — wymienne zawory, uchwyty na płetwy i zestawy naprawcze do pianki pozwalają używać sprzętu, zamiast trafiać na wysypiska.
  solution: Aquafarer zawiera smycz i zestaw naprawczy przy każdym zakupie deski. Publikujemy bezpłatne treści dotyczące bezpieczeństwa, obejmujące identyfikację prądów wstecznych, odczytywanie pogody i kontrolę sprzętu. Nasz zespół obsługi klienta udziela porad dotyczących warunków, gdy wyślesz do nas e-mail o konkretnym miejscu. Używamy minimalnej ilości plastiku w opakowaniach i kompensujemy emisję dwutlenku węgla z transportu.
  recommendation: Zacznij od przewodnika po podstawach bezpieczeństwa na oceanie i przewodnika po wskazówkach dotyczących bezpieczeństwa podczas surfingu. Zawsze noś smycz, sprawdzaj prognozę i nigdy nie wchodź do wody sam, jeśli się uczysz. Jeśli zobaczysz odpady lub morskie zwierzęta w potrzebie, zgłoś to lokalnym władzom. Sprzęt, który jest trwały, to sprzęt, który zmniejsza ilość odpadów — dbaj o swój Aquafarer sprzęt, a posłuży ci przez lata.
  faq:
    - q: Czy Aquafarer wspiera inicjatywy oczyszczania oceanów?
      a: Tak, przekazujemy 1 procent rocznych zysków na organizacje zajmujące się oczyszczaniem oceanów i ochroną życia morskiego. Klienci mogą wybrać wybraną organizację charytatywną przy kasie, aby przekierować część swojego zakupu.
    - q: Jak powinienem pozbyć się starego pianki lub deski?
      a: Pianki neoprenowe mogą być przetwarzane na maty do jogi, torby i izolację poprzez specjalistyczne programy. Deski dmuchane można naprawiać, przekazywać lub PVC mogą być odzyskane w niektórych zakładach recyklingu. Skontaktuj się z naszym zespołem wsparcia w celu uzyskania wskazówek.
    - q: Jakiego sprzętu ochronnego Aquafarer zaleca dla początkujących?
      a: Odpowiednio dopasowana kamizelka ratunkowa (dmuchana lub piankowa), zwinięta linka, gwizdek i krem do opalania. Dla SUP kajakarzy na otwartej wodzie kamizelka ratunkowa jest prawnie wymagana w wielu jurysdykcjach i zawsze zalecana.
    - q: Czy Aquafarer oferuje kursy bezpieczeństwa?
      a: Nie prowadzimy kursów bezpośrednio, ale współpracujemy z certyfikowanymi instruktorami surfingu i SUP bezpieczeństwa, którzy oferują szkolenia online i stacjonarne. Skontaktuj się z naszym zespołem wsparcia, aby uzyskać informacje o rekomendacjach w Twojej okolicy.
