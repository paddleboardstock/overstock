- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Co ubrać do surfowania (Nie przychodź w krótkich spodenkach, gdy potrzebujesz pianki 5/4)
  description: Przestań zgadywać, co założyć. To temperatura wody, a nie powietrza, determinuje Twój strój do surfowania. Kompletny przewodnik po warstwach, od tropikalnych rash guardów po pełne zimowe kombinezony 5/4/3mm.
  definition: Stroje do surfowania obejmują szorty i koszulki ochronne w ciepłej wodzie oraz pełne pianki 5/4/3mm z butami i kapturami w zimnej wodzie. To temperatura wody, a nie powietrza, decyduje o tym, czego potrzebujesz.
  tldr: To, co nosisz podczas surfowania, zależy całkowicie od temperatury wody — a nie powietrza. Rashguardy i szorty do surfingu sprawdzą się w temperaturach powyżej 22°C, pianki wiosenne w 18-22°C, pełne pianki 3/2 mm w 14-18°C, a pianki 5/4/3 mm z butami są wymagane poniżej 14°C. Zawsze noś ochronę UV i rozważ użycie smyczy oraz kamizelki ochronnej.
  problem: Przybywasz na plażę i nie masz pojęcia, czy wystarczy ci rash guard, czy potrzebny będzie pełny kombinezon. Temperatura powietrza jest ciepła, ale woda jest zimna, albo woda wydaje się w porządku, ale wiatr jest lodowaty. Niewłaściwe ubranie oznacza zepsutą sesję.
  explanation: 'Strój do surfingu pełni trzy funkcje: izolację termiczną, ochronę UV oraz zapobieganie otarciom. Kombinezony neoprenowe są klasyfikowane według grubości i zakresu pokrycia — kombinezony typu spring (krótkie rękawy lub nogawki) przeznaczone są na dni z graniczną temperaturą, a pełne kombinezony na zimną wodę. Rash guardy chronią przed otarciami od deski i słońcem, ale nie mają wartości termicznej. Buty, rękawice i kaptury to nie dodatki, lecz niezbędny sprzęt do surfingu w zimnej wodzie poniżej 12°C.'
  solution: 'Sprawdź lokalną bojkę lub bieżący raport temperatury wody przed wyruszeniem. Przygotuj zestaw w zależności od najzimniejszych typowych warunków: rashguard i szorty na lato, piankę całkowitą 3/2 mm na wiosnę i jesień, piankę 5/4/3 mm z butami i kapturem na zimę. Zawsze dodaj leash i rozważ kamizelkę wypornościową dla bezpieczeństwa.'
  recommendation: Zainwestuj najpierw w dobry pełen kombinezon 3/2 mm — pokrywa on najszerszy zakres warunków. Dodaj kombinezon 5/4/3 mm i buty, jeśli planujesz surfować zimą. Aquafarer Wetsuit Pro z termiczną podszewką skutecznie łączy oba zakresy temperatur.
  faq:
    - q: Czy mogę surfować tylko w kąpielówkach?
      a: Tak, w wodzie tropikalnej powyżej 24°C. Możesz chcieć użyć koszulki ochronnej, aby zapobiec obtarciom na klatce piersiowej i ramionach od wiosłowania. Wosk lub nakładka antypoślizgowa na desce pomaga zrekompensować brak przyczepności kombinezonu.
    - q: Czy potrzebuję butów do surfowania?
      a: Jeśli temperatura wody spadnie poniżej 14°C, buty chronią przed drętwieniem i zabezpieczają stopy przed skaleczeniami od skał i rafy. Dodatkowo zwiększają przyczepność na desce. Większość surferów w północnych klimatach korzysta z butów od listopada do marca.
    - q: Co to jest garnitur wiosenny?
      a: Kombinezon wiosenny to pianka z krótkimi rękawami lub krótkimi nogawkami (lub oboma) przeznaczona do wody o temperaturze między 18°C a 22°C. Zapewnia więcej ciepła niż koszulka do surfingu, ale mniej ochrony niż pełny kombinezon.
    - q: Czy powinienem nosić kamizelkę ratunkową podczas surfowania?
      a: Nie tradycyjne kamizelki ratunkowe, ale kamizelka ochronna lub pomoc w utrzymaniu się na wodzie może pomóc w trudnych warunkach lub jeśli jesteś słabym pływakiem. Aquafarer kamizelki ratunkowe są przeznaczone do SUP i kajakarstwa, ale mogą zapewnić dodatkowe poczucie bezpieczeństwa przy nauce surfingu.
