cases:
  - id: beginner
    title: Anfänger Paddeln
    desc: Stabile aufblasbare SUP Boards für Erstpaddler.
    scenario: Eine Familie, die ein Wochenende an einem See verbringt, möchte Stand-Up-Paddling ausprobieren. Sie benötigen stabiles, leicht zu startendes Equipment mit klaren Sicherheitsanweisungen.
    solution: Das SUP Explorer 11 bietet Anfängern Stabilität für breite Körper. Das Life Vest Classic stellt CE-zertifizierte Auftriebssicherheit sicher. Das Oars & Pump Set bläst das Board in weniger als 10 Minuten auf.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Touring & Erkundung
    desc: Langstrecken-aufblasbare SUP Boards für Seen, Flüsse und Küstenausflüge.
    scenario: Ein Outdoor-Enthusiast plant eine einwöchige Paddeltour und benötigt ein Board, das klein zu packen ist, am Lager aufblasbar ist und geradeaus in offenem Wasser gleitet.
    solution: Das Ocean Voyager Series gleitet effizient mit einer Touring-Form und hält Kurs bei Wind und Wellen. Seine drop-stitch-Konstruktion bläst sich auf 15 PSI auf für harte Boardsteifigkeit.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga & Fitness
    desc: Extra breite, stabile Plattformen für Yoga, Fitness und Entspannung.
    scenario: Eine Yogapraktizierende möchte ein schwimmendes Studio für Morgensessions auf ruhigem Wasser, mit genügend Deckfläche, um jede Pose auszuführen.
    solution: Das Flowing Lotus Series verfügt über eine durchgehende Deckpad und einen breiten Rumpf für wackelfreie Posen. Es dient auch als stabile Plattform für leichte Fitnessübungen.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Familienfreizeit
    desc: Komplette SUP Pakete für Wochenendausflüge an den See und Urlaub.
    scenario: Eine vierköpfige Familie möchte stabile Boards für Wochenendausflüge an den See und Strandferien — Ausrüstung, die ins Auto passt und in wenigen Minuten aufgeblasen ist.
    solution: Das Tropical Breeze Series ist ein stabiles Allround-Board, das die ganze Familie teilen kann, während das Medusa Glow Series leichter und kürzer für Kinder ist. Beide lassen sich für einfache Reisen in Rucksäcke packen.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
