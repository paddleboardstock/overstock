cases:
  - id: beginner
    title: 'Wassersport für Einsteiger'
    desc: 'Stabile SUP-Boards und Kajaks für Erstnutzer.'
    scenario: >-
      Eine Familie, die am Wochenende einen See besucht, möchte Stand-up-Paddling
      ausprobieren. Sie braucht stabiles, leicht zu Wasser zu bringendes
      Equipment mit klaren Sicherheitshinweisen.
    solution: >-
      Das SUP Explorer 11 bietet Einsteigern eine breite, stabile Plattform. Die
      Life Vest Classic sorgt für CE-zertifizierten Auftrieb. Die
      Dual-Action-Pumpe füllt beide Boards in unter 10 Minuten auf.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp

  - id: river-touring
    title: 'Outdoor-Erkundung'
    desc: 'Tragbare Kajaks und Dinghys für Flüsse, Seen und Küstentouren.'
    scenario: >-
      Ein Outdoor-Enthusiast plant eine einwöchige Flusstour und braucht ein
      Boot, das sich klein verpacken lässt, am Camp aufblasbar ist und
      unterschiedliche Strömungen meistert.
    solution: >-
      Das Kayak Lite passt in einen Rucksack und ist in unter 4 Minuten
      einsatzbereit. Seine Drop-Stitch-Konstruktion meistert Seen, langsam
      fließende Flüsse und Küstenpaddeln.
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp

  - id: professional-operations
    title: 'Professioneller Einsatz'
    desc: 'Kommerzielle RIBs für Touranbieter und Notfallrettung.'
    scenario: >-
      Ein Küsten-Touranbieter braucht eine Flotte langlebiger Boote für den
      täglichen Einsatz bei wechselnden Seebedingungen – und die Erfüllung
      kommerzieller Sicherheitsvorschriften.
    solution: >-
      Die RIB 330 und RIB 450 Patrol verfügen über Rümpfe aus Glasfaser mit
      tiefem V und Hypalon-Schläuchen für Robustheit bei jedem Wetter. Mehrere
      Einheiten lassen sich mit konstant gleichbleibender Leistung einsetzen.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp

  - id: family-recreation
    title: 'Familienausflüge'
    desc: 'Geräumige Dinghys für Tagesausflüge, Angeln und Wassersport.'
    scenario: >-
      Eine vierköpfige Familie sucht ein stabiles Boot für Wochenendausflüge auf
      dem See, Angeltrips und das Ziehen einer Tube für die Kinder.
    solution: >-
      Die AirDeck 360 bietet mit verstärktem Air-Deck-Boden Platz für bis zu
      fünf Personen. Sie wird am Startpunkt aufgeblasen, passt ins Auto und
      meistert sowohl ruhige Seen als auch geschützte Küstengewässer.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp