  title: 'Οδηγός Μεγέθους Σανίδας Κωπηλασίας: Όγκος, Μήκος και Πλάτος για Κάθε Αναβάτη'
  description: Πλήρης καθορισμός μεγέθους για σανίδες paddle με προτάσεις όγκου ανά βάρος και δραστηριότητα. Περιλαμβάνει ένα εύκολο στη χρήση πίνακα μεγεθών για σανίδες γενικής χρήσης, για περιηγήσεις, για σέρφινγκ και για γιόγκα SUP.
  definition: Το μέγεθος της σανίδας paddle καθορίζεται από τον όγκο (ικανότητα βάρους και πλευστότητα), το μήκος (ταχύτητα και κατεύθυνση), το πλάτος (σταθερότητα) και το πάχος (κατανομή όγκου και αντίσταση στον άνεμο).
  tldr: 'Χρησιμοποιήστε το βάρος για να βρείτε τον ελάχιστο όγκο: 50-70 κιλά χρειάζονται 220-260L, 70-90 κιλά χρειάζονται 260-300L, 90-110 κιλά χρειάζονται 300-350L, πάνω από 110 κιλά χρειάζονται 350L. Για αρχάριους, προσθέστε 20% σε αυτούς τους αριθμούς. Το πλάτος έχει σημασία: 32" είναι ενδιάμεσο, 33-34" είναι φιλικό για αρχάριους, 35" είναι πολύ σταθερό.'
  problem: Οι καταχωρίσεις μεγέθους για σανίδες paddle χρησιμοποιούν πόδια, ίντσες και λίτρα εναλλακτικά, καθιστώντας δύσκολη τη σύγκριση μεταξύ των εμπορικών σημάτων.
  explanation: Ο όγκος είναι η πιο άμεση μέτρηση για την ικανότητα βάρους — 1 λίτρο γλυκού νερού εκτοπίζει 1 κιλό βάρους. Μια σανίδα με 260 λίτρα μπορεί θεωρητικά να υποστηρίξει 260 κιλά, αλλά η πρακτική ικανότητα είναι χαμηλότερη επειδή η σανίδα πρέπει να κάθεται πάνω από το νερό. Το συνολικό σας βάρος (σώμα συν εξοπλισμός) θα πρέπει να είναι 30-40% του όγκου της σανίδας.
  solution: Στόχος όγκου = (σωματικό βάρος σε κιλά + βάρος εξοπλισμού σε κιλά) x 3. Για έναν κουπιέρη 75 κιλών με εξοπλισμό 5 κιλών, στόχος = 80 x 3 = 240L ελάχιστο. Για αρχάριους, πολλαπλασιάστε με 3,5. Για προχωρημένους, πολλαπλασιάστε με 2,5.
  recommendation: Το Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") ταιριάζει στους περισσότερους αναβάτες 50-100 κιλών. Οι ελαφρύτεροι αναβάτες μπορούν να επιλέξουν το AirDeck 270. Οι βαρύτεροι αναβάτες θα πρέπει να κοιτάξουν το SUP Tour 12 (300L+) ή σε πλατύτερα σανίδια.
  faq:
    - q: Έχει σημασία το ύψος για το μέγεθος SUP;
      a: Το ύψος έχει λιγότερη σημασία από το βάρος. Ένας ψηλός αναβάτης με χαμηλό βάρος χρειάζεται λιγότερο όγκο από έναν κοντό βαριό αναβάτη. Χρησιμοποιήστε το βάρος ως τον κύριο παράγοντα για τον καθορισμό του όγκου.
    - q: Τι συμβαίνει με υπερβολική ένταση;
      a: Η σανίδα κάθεται πολύ ψηλά, πιάνεται από τον άνεμο σαν πανί. Αισθάνεται φουσκωτή στα κύματα. Ωστόσο, για τους αρχάριους, ο επιπλέον όγκος είναι καλύτερος από το πολύ λίγο.
    - q: Τι συμβαίνει με πολύ μικρή ένταση;
      a: Η σανίδα κάθεται πολύ βαθιά, δημιουργώντας αντίσταση. Η μύτη μπορεί να βυθιστεί κατά την κωπηλασία (βουλίασμα). Κουράζεστε γρήγορα από το κουπί σε μια μερικώς βυθισμένη σανίδα.
    - q: Χρειάζονται οι φουσκωτές σανίδες διαφορετικό μέγεθος σε σχέση με τις σκληρές σανίδες;
      a: Όχι σημαντικά. Τα φουσκωτά στα 15+ PSI εκτοπίζουν νερό παρόμοια με τις σκληρές σανίδες. Οι συστάσεις για τον όγκο ισχύουν εξίσου και για τους δύο τύπους.
