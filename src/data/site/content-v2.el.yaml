- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Κανόνες Ευγένειας στο Σερφ (Πώς να Μην Είσαι το Άτομο που Όλοι Αποφεύγουν)
  description: Η σειρά έχει κανόνες και κανείς δεν τους γράφει. Μάθε ποιος έχει προτεραιότητα, γιατί το snaking θα σε κάνουν να φωνάξουν, πώς να ζητάς συγγνώμη και τα λάθη των αρχαρίων που εκνευρίζουν κάθε ντόπιο σέρφερ.
  definition: 'Η εθιμοτυπία του σερφ είναι ένας άγραφος κώδικας συμπεριφοράς που αποτρέπει τις συγκρούσεις και διαμοιράζει τα κύματα δίκαια. Ο βασικός κανόνας: ο σέρφερ που βρίσκεται πιο κοντά στην κορυφή του σπασμένου κύματος έχει προτεραιότητα.'
  tldr: Ο σερφίστας που βρίσκεται πιο κοντά στην κορυφή του σπασμένου κύματος έχει προτεραιότητα. Μην εισβάλλετε στο κύμα κάποιου, μην κάνετε snake (κουπί γύρω από κάποιον για να πάρετε το κύμα του) και πάντα ζητάτε συγγνώμη αν κάνετε λάθος. Κουπίστε πλατιά γύρω από τη σειρά, κρατήστε τη σανίδα σας και να είστε φιλικοί — ο σεβασμός κερδίζει σεβασμό.
  problem: Κωπηλατείς προς μια πολυσύχναστη σειρά και αμέσως αισθάνεσαι ένταση. Οι σερφιστές σε κοιτούν πλαγίως, κάποιος σου φωνάζει, και δεν είσαι σίγουρος τι έκανες λάθος. Η κοινωνική πλευρά του σερφ περισσότερο σε τρομοκρατεί από τα ίδια τα κύματα.
  explanation: 'Η εθιμοτυπία του surfing υπάρχει για να αποφεύγονται συγκρούσεις και να μοιράζονται τα κύματα δίκαια. Ο θεμελιώδης κανόνας είναι το δικαίωμα προτεραιότητας: ο σερφίστας που βρίσκεται πιο κοντά στην κορυφή (όπου το κύμα σκάει πρώτα) έχει προτεραιότητα. Οποιοσδήποτε κουβαλάει για το ίδιο κύμα από πιο μέσα πρέπει να απομακρυνθεί. Το snaking — το κωπηλασία γύρω από άλλον σερφίστα για να κλέψει την προτεραιότητα — θεωρείται η χειρότερη παράβαση. Πέρα από την προτεραιότητα, η σειρά αναμονής έχει προσδοκίες σχετικά με τον θόρυβο (κρατήστε τις φωνές στο ελάχιστο), τον έλεγχο της σανίδας (μην αφήνετε ποτέ τη σανίδα σας κοντά σε άλλους) και τη φιλικότητα (ένα απλό νεύμα έχει μεγάλη αξία).'
  solution: Παρακολουθήστε τη σειρά κύματος για 10 λεπτά πριν βγείτε με την σανίδα. Αναγνωρίστε ποιος πιάνει τα περισσότερα κύματα — αυτοί είναι οι surfers που πρέπει να σέβεστε και να αποφύγετε. Μείνετε προς το εσωτερικό (ζώνη λευκού νερού) αν μαθαίνετε. Κάντε γύρω από τη σειρά κύματος, όχι μέσα από αυτήν. Όταν πιάσετε ένα κύμα, κοιτάξτε και στις δύο κατευθύνσεις πριν σηκωθείτε και βεβαιωθείτε ότι κανείς δεν βρίσκεται πιο βαθιά.
  recommendation: Περάστε τις πρώτες σας συνεδρίες σε ένα σημείο φιλικό προς αρχάριους με αραιό πλήθος. Μάθετε να διαβάζετε τις προτεραιότητες πριν προσπαθήσετε σε μια πολυσύχναστη σειρά. Εάν πέσετε πάνω σε κάποιον, ζητήστε συγγνώμη αμέσως και κουπίστε μέχρι εκεί — οι περισσότεροι σερφάρουν σέβονται ένα ειλικρινές λάθος.
  faq:
    - q: Τι τσουλάει μέσα;
      a: Το «dropping in» σημαίνει να κωπηλατείς για να πιάσεις και να καβαλήσεις ένα κύμα που ήδη έχει προτεραιότητα ένας άλλος σέρφερ. Είναι επικίνδυνο και δείχνει ασέβεια. Ο σέρφερ που είναι πιο κοντά στην κορυφή κατέχει το κύμα· οποιοσδήποτε άλλος πρέπει να απομακρυνθεί.
    - q: Τι είναι το snaking;
      a: Το 'snaking' είναι η κωπηλασία γύρω από άλλον σερφέρ που ήδη βρίσκεται σε θέση για ένα κύμα, έτσι ώστε να καταλήξετε πιο κοντά στην κορυφή. Θεωρείται εξαιρετικά κακή συμπεριφορά και μπορεί να οδηγήσει σε αντιπαράθεση.
    - q: Μπορούν οι αρχάριοι να κάνουν σερφ σε πολυσύχναστα σημεία;
      a: Ναι, αλλά μείνε στη ζώνη του λευκού νερού μακριά από την κορυφή. Μην κουμαντάρεις μέχρι την κύρια περιοχή εκκίνησης μέχρι να μπορείς να πιάνεις κύματα και να ελέγχεις σταθερά την πορεία σου. Οι γραμμές με κόσμο απαιτούν εμπειρία για να κινηθείς με ασφάλεια.
    - q: Πώς ζητάω συγγνώμη στο νερό;
      a: Ένα απλό κύμα, ένα χαμόγελο και ένα «δική μου η λάθος» ή «συγγνώμη» αρκούν. Αναγνώρισε το λάθος και απομακρύνσου από το άτομο. Οι σέρφερ συνήθως συγχωρούν τις ειλικρινείς λάθη, ειδικά αν είναι προφανές ότι μαθαίνεις.
    - q: Τι πρέπει να κάνω αν κάποιος με επισκεφθεί απρόσκλητος;
      a: Αν είναι μια καθαρή εισβολή, φώναξε «κύμα» ή «γεια» για να τους ειδοποιήσεις. Αν το πιάσουν κατά λάθος και ζητήσουν συγγνώμη, άφησέ το. Αν κάποιος εισβάλλει επανειλημμένα, κωπηλάτησε μέχρι εκεί και εξήγησε ευγενικά την προτεραιότητα. Απόφυγε τις συγκρούσεις.
