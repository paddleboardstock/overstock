- slug: ocean-safety-and-responsibility
  category: authority
  type: brand
  title: Ασφάλεια και Ευθύνη στον Ωκεανό (Περισσότερο από Απλώς Εξοπλισμός)
  description: Η δέσμευση του Aquafarer να σας κρατάει ασφαλείς και να προστατεύει τον ωκεανό που μοιραζόμαστε. Κάρτες ασφαλείας σε κάθε κουτί, δωρεάν εκπαιδευτικό περιεχόμενο, βιώσιμος σχεδιασμός και ετήσιες δωρεές για την προστασία του περιβάλλοντος.
  definition: Η ασφάλεια και η υπευθυνότητα στον ωκεανό σημαίνει την κατανόηση του περιβάλλοντος στο οποίο κωπηλατείτε, τον σεβασμό στη θαλάσσια ζωή, τη μείωση του οικολογικού σας αποτυπώματος και τη χρήση εξοπλισμού σχεδιασμένου για μακροζωία και δυνατότητα επισκευής.
  tldr: Aquafarer προωθεί την ασφάλεια στους ωκεανούς μέσω του σχεδιασμού εξοπλισμού (ζωντανά χρώματα, λουριά, σωσίβια) και εκπαιδευτικού περιεχομένου. Πιστεύουμε ότι κάθε λάτρης των θαλάσσιων σπορ έχει την ευθύνη να κατανοεί το θαλάσσιο περιβάλλον, να σέβεται τη θαλάσσια ζωή και να μειώνει το οικολογικό του αποτύπωμα. Ο εξοπλισμός μας είναι κατασκευασμένος για να διαρκεί, ώστε να καταλήγει λιγότερος στα σκουπιδοτενεκέδες.
  problem: Πολλές μάρκες αθλημάτων νερού πωλούν εξοπλισμό αλλά δεν εκπαιδεύουν τους πελάτες τους στο πώς να τον χρησιμοποιούν με ασφάλεια ή υπεύθυνα. Οι νέοι κουπιεριστές και σέρφερ μπαίνουν στο νερό χωρίς να κατανοούν τα ρεύματα, την θαλάσσια άγρια ζωή ή τον περιβαλλοντικό αντίκτυπο του εξοπλισμού τους.
  explanation: Η ασφάλεια στον ωκεανό είναι περισσότερα από μια λίστα ελέγχου — είναι τρόπος σκέψης. Κάθε Aquafarer προϊόν περιλαμβάνει μια κάρτα γρήγορης εκκίνησης για την ασφάλεια μέσα στο κουτί. Ο ιστότοπός μας και οι οδηγοί μας (βασικά στοιχεία ασφάλειας στον ωκεανό, συμβουλές ασφάλειας για σερφ) παρέχουν δωρεάν, λεπτομερή εκπαίδευση ασφάλειας. Από την πλευρά του περιβάλλοντος, ο μεγαλύτερος αντίκτυπος που μπορεί να έχει οποιαδήποτε εταιρεία εξοπλισμού είναι μέσω της διάρκειας ζωής του προϊόντος. Μια σανίδα που διαρκεί 5 χρόνια αντί για 2 μειώνει στο μισό το αποτύπωμα της παραγωγής. Σχεδιάζουμε επίσης με γνώμονα την επισκευασιμότητα — βαλβίδες αντικατάστασης, κουτιά πτερυγίων και κιτ επιδιορθώσεων για wetsuit διατηρούν τον εξοπλισμό σε χρήση αντί να καταλήγει σε χωματερές.
  solution: Aquafarer περιλαμβάνει λουρί και κιτ επισκευής με κάθε αγορά σανίδας. Δημοσιεύουμε δωρεάν περιεχόμενο ασφαλείας που καλύπτει τον εντοπισμό ρευμάτων, την ανάγνωση του καιρού και τους ελέγχους εξοπλισμού. Η ομάδα υποστήριξης πελατών μας παρέχει συμβουλές σχετικά με τις συνθήκες όταν μας στέλνετε email για μια συγκεκριμένη τοποθεσία. Χρησιμοποιούμε ελάχιστη πλαστική συσκευασία και αντισταθμίζουμε τις εκπομπές άνθρακα από τη μεταφορά.
  recommendation: Ξεκινήστε με τον οδηγό βασικών κανόνων ασφάλειας στον ωκεανό και τον οδηγό συμβουλών ασφάλειας για σέρφινγκ. Φορέστε πάντα λουρί ασφαλείας, ελέγξτε την πρόγνωση και μην βγαίνετε ποτέ μόνοι σας αν μαθαίνετε. Εάν δείτε συντρίμμια ή θαλάσσια ζώα σε κίνδυνο, αναφέρετέ το στις τοπικές αρχές. Ο εξοπλισμός που διαρκεί είναι εξοπλισμός που μειώνει τα απόβλητα — συντηρήστε τον Aquafarer εξοπλισμό σας και θα σας εξυπηρετήσει για χρόνια.
  faq:
    - q: Υποστηρίζει το Aquafarer πρωτοβουλίες καθαρισμού των ωκεανών;
      a: Ναι, δωρίζουμε το 1 τοις εκατό των ετήσιων κερδών σε οργανισμούς καθαρισμού των ωκεανών και προστασίας της θαλάσσιας ζωής. Οι πελάτες μπορούν να επιλέξουν μια επιλεγμένη φιλανθρωπική οργάνωση κατά την ολοκλήρωση της αγοράς για να κατευθύνουν ένα μέρος της αγοράς τους.
    - q: Πώς πρέπει να απορρίψω μια παλιά στολή κατάδυσης ή σανίδα;
      a: Τα στολές κατάδυσης από νεοπρένιο μπορούν να ανακυκλωθούν σε στρώματα γιόγκα, τσάντες και μόνωση μέσω εξειδικευμένων προγραμμάτων. Τα φουσκωτά σανίδες μπορούν να επισκευαστούν, να δοθούν ή το PVC να ανακτηθεί μέσω ορισμένων εγκαταστάσεων ανακύκλωσης. Επικοινωνήστε με την ομάδα υποστήριξής μας για καθοδήγηση.
    - q: Τι εξοπλισμό ασφαλείας προτείνει το Aquafarer για αρχάριους;
      a: Ένα σωστά εφαρμοστό σωσίβιο (φουσκωτό ή από αφρό), ένας τυλιγμένος ιμάντας ασφάλειας, ένας σφυρίχτρα και αντηλιακό. Για τους SUP κουπιώνες σε ανοικτά νερά, το σωσίβιο είναι νομικά υποχρεωτικό σε πολλές περιοχές και πάντα συνιστάται.
    - q: Προσφέρει το Aquafarer μαθήματα ασφάλειας;
      a: Δεν διοργανώνουμε μαθήματα απευθείας, αλλά συνεργαζόμαστε με πιστοποιημένους εκπαιδευτές σερφ και SUP ασφαλείας που προσφέρουν εκπαίδευση διαδικτυακά και δια ζώσης. Επικοινωνήστε με την ομάδα υποστήριξής μας για παραπομπές στην περιοχή σας.
