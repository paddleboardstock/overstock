  title: 'SUP Οδηγός Άγκυρας: Μείνε στη Θέση σου Κατά το Ψάρεμα ή τη Φωτογραφία'
  description: Ολοκληρωμένος οδηγός για την αγκύρωση SUP — τύποι άγκυρας (μανιτάρι, αναδιπλούμενη, πασσάλου), ρύθμιση τροχαλίας άγκυρας, τεχνικές ανάπτυξης και προφυλάξεις ασφαλείας για παραμονή στη θέση.
  definition: Ένας SUP άγκυρας είναι ένα βάρος που συνδέεται με ένα σχοινί και κρατάει την σανίδα στη θέση της ενάντια στον άνεμο και το ρεύμα. Συνήθεις τύποι περιλαμβάνουν τις μανιταρόμορφες αγκύρες, τις αναδιπλούμενες αγκύρες και τους πασσάλους στερέωσης.
  tldr: Χρησιμοποιήστε άγκυρα μανιταριού (0,7-1,4 κιλά) για βαλτώδεις ή αμμώδεις βυθούς, μια αναδιπλούμενη άγκυρα για βραχώδεις βυθούς, ή έναν πάσσαλο στερέωσης για ρηχά νερά με μαλακούς βυθούς. Η άγκυρα πρέπει να είναι 0,7-1,4 κιλά για ήρεμες συνθήκες, 1,4-2,3 κιλά για άνεμο και ρεύμα. Χρησιμοποιείτε πάντα ένα σύστημα τροχαλιών άγκυρας για να προσαρμόζετε τη θέση και να ξέρετε πότε να απελευθερώσετε.
  problem: Βρίσκεις το τέλειο σημείο για ψάρεμα, αλλά ο άνεμος και το ρεύμα σε παρασύρουν εκτός θέσης κάθε λίγα λεπτά. Χωρίς αγκυροβόληση, το SUP ψάρεμα και η φωτογραφία είναι απογοητευτικές ασκήσεις συνεχούς επανατοποθέτησης.
  explanation: Ένας άγκυρας λειτουργεί τραβώντας στο βυθό μέχρι να πιαστεί. Οι μανιταρόσχημες άγκυρες σκάβουν σε μαλακά βυθά και παρέχουν καλή συγκράτηση σε άμμο και λάσπη. Οι αναδιπλούμενες άγκυρες έχουν φτερά που σκάβουν σε σκληρούς ή βραχώδεις βυθούς. Οι πάσσαλοι λειτουργούν σε ρηχά νερά σπρώχνοντας άμεσα στο βυθό.
  solution: Εγκαταστήστε ένα σύστημα τροχαλίας αγκύρωσης (μια γραμμή με δακτύλιο ολισθήσεως στη μία πλευρά της σανίδας) για να προσαρμόσετε το σημείο σύνδεσης της άγκυρας. Συνδέστε 15-23 μέτρα σχοινί στην άγκυρα. Αναπτύξτε την κατά τον άνεμο ή κατά το ρεύμα της επιθυμητής θέσης σας. Χρησιμοποιήστε ένα σύστημα γρήγορης απελευθέρωσης για αποσύνδεση σε επείγουσες καταστάσεις. Μην αγκυροβολείτε ποτέ σε δυνατό ρεύμα ή εκεί όπου δεν μπορείτε εύκολα να ανασύρετε την άγκυρα.
  recommendation: Ένας αναδιπλούμενος άγκυρας 3 λιβρών με 50 πόδια σκοινί λειτουργεί για τις περισσότερες SUP συνθήκες ψαρέματος. Προσθέστε ένα σύστημα τροχαλίας άγκυρας χρησιμοποιώντας τα D-δακτυλίδια στο Aquafarer SUP Explorer 11 σας.
  faq:
    - q: Τι μέγεθος άγκυρας χρειάζομαι για SUP;
      a: 1,5-3 λίβρες για ήρεμες λίμνες και αργά ποτάμια. 3-5 λίβρες για παράκτιες περιοχές με άνεμο ή ρεύμα. Οι υπερμεγέθεις άγκυρες είναι δύσκολο να ανακτηθούν.
    - q: Πόσο σκοινί άγκυρας χρειάζομαι;
      a: Ένας δείκτης 5:1 (5 πόδια σχοινί για κάθε 1 πόδι βάθους) είναι στάνταρ. Σε 10 πόδια νερό, χρησιμοποιήστε 50 πόδια σχοινί.
    - q: Είναι επικίνδυνη η αγκυροβολία σε ένα SUP;
      a: Μόνο αν ρίξετε άγκυρα σε ρεύμα ή άνεμο αρκετά ισχυρό για να αναποδογυρίσει τη σανίδα. Χρησιμοποιείτε πάντα ένα σύστημα γρήγορης απελευθέρωσης που μπορεί να αποσυνδεθεί αμέσως.
    - q: Μπορώ να ρίξω άγκυρα σε οποιοδήποτε νερό;
      a: Ελέγξτε τους τοπικούς κανονισμούς. Ορισμένες περιοχές περιορίζουν την αγκυροβολία για την προστασία των θαλάσσιων φυτών ή των θαλάσσιων οικοτόπων. Ποτέ μην αγκυροβολείτε σε κοραλλιογενείς υφάλους.
