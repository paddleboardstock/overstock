  title: 'SUP Αυτο-διάσωση: Πώς να Επιστρέψετε στην Σανίδα Σας σε Βαθιά Νερά'
  description: Κάθε SUP κουπιέρ πρέπει να κυριαρχεί στην αυτοδιάσωση. Τεχνικές βήμα προς βήμα για να ξανανεβείτε στη σανίδα σας σε βαθιά νερά, να τη μεταφέρετε στην ακτή και να αντιμετωπίσετε μπλεξίματα του λουριού.
  definition: SUP η αυτοδιάσωση είναι η τεχνική επανατοποθέτησης στο σανίδι του κουπιού σε βαθιά νερά μετά από πτώση, συμπεριλαμβανομένης της ανάκτησης της σανίδας, της επαναφοράς του σώματος και της ανάκτησης του κουπιού.
  tldr: 'Μετά από πτώση: μείνετε ήρεμοι, κρατήστε το κουπί, κολυμπήστε μέχρι τη σανίδα. Τοποθετήστε το κουπί πάνω από τη σανίδα. Χρησιμοποιήστε ένα κτύπημα δελφινιού για να προωθήσετε το στήθος στη σανίδα. Σταυρώστε πρώτα το ένα πόδι, μετά το άλλο. Γονατίστε πρώτα, μετά σταθείτε. Εξασκηθείτε σε ήρεμα νερά μέχρι να γίνει μυϊκή μνήμη.'
  problem: Πέφτεις από την SUP σου σε βαθιά νερά και δεν μπορείς να επιστρέψεις επάνω. Η σανίδα είναι ολισθηρή, είσαι κουρασμένος και ξεσπάει πανικός. Χωρίς να γνωρίζεις τεχνική αυτοδιάσωσης, μια απλή πτώση γίνεται επικίνδυνη.
  explanation: 'Η αυτοδιάσωση έχει τρία στάδια: ανάκτηση (κολύμπι προς την σανίδα και κουπί), επανατοποθέτηση (επιστροφή στη σανίδα) και συνέχιση (συνέχιση του κουπιού). Η βασική τεχνική είναι η χρήση του κουπιού ως σταθεροποιητή και η χρήση δυνατών λακτισμάτων με τα πόδια για να ωθήσετε το πάνω μέρος του σώματος στη σανίδα.'
  solution: 'Στάδιο 1: κολυμπήστε προς τη σανίδα. Κρατήστε το κουπί ή πάρτε το πίσω. Στάδιο 2: τοποθετήστε το κουπί κάθετα κατά μήκος της σανίδας. Κλωτσήστε δυνατά με τα πόδια ενώ τραβάτε το στήθος σας στο κέντρο της σανίδας. Στάδιο 3: μόλις το στήθος είναι στη σανίδα, κουνήστε τα πόδια επάνω ένα-ένα. Στάδιο 4: γονατίστε, πάρτε ανάσα και μετά σηκωθείτε σταδιακά.'
  recommendation: Εξασκηθείτε στην αυτοδιάσωση σε ελεγχόμενες συνθήκες μέχρι να μπορείτε να το κάνετε χωρίς σκέψη. Χρησιμοποιήστε το Aquafarer SUP Explorer 11 που έχει καλή πρόσφυση στο κατάστρωμα. Το Life Vest Pro παρέχει επιπλέον πλευστότητα αν δυσκολεύεστε.
  faq:
    - q: Πώς μπορώ να επιστρέψω αν είμαι εξαντλημένος;
      a: Μείνετε στη σανίδα για πλευστότητα. Χρησιμοποιήστε τα χέρια σας για να τραβήξετε το στήθος πάνω στη σανίδα, ακόμη και αν τα πόδια δεν μπορούν να κλωτσήσουν αποτελεσματικά. Ξεκουραστείτε σε γονατιστή θέση πριν σηκωθείτε.
    - q: Τι θα γίνει αν χάσω το κουπί;
      a: Χρησιμοποιήστε τα χέρια για να κωπηλατήσετε την σανίδα μέχρι την ακτή. Ζητήστε βοήθεια από άλλον κωπηλάτη. Αντικαταστήστε άμεσα την χαμένη κουπαστή.
    - q: Μπορώ να αυτοδιασώσω σε κύματα;
      a: Ναι — τοποθέτησε την σανίδα κάθετα στα κύματα. Σύγχρονα για την επανατοποθέτηση ανάμεσα στα κύματα. Το λουρί κρατά τη σανίδα κοντά.
    - q: Πώς να αντιμετωπίσω ένα μπερδεμένο λουρί;
      a: Μείνετε ήρεμοι, επιπλέετε ανάσκελα, ξεμπλέξτε το λουράκι αργά. Αν το λουράκι έχει τυλιχτεί γύρω από τα πτερύγια, μπορεί να χρειαστεί να αφαιρέσετε τα πτερύγια ενώ βρίσκεστε στο νερό.
