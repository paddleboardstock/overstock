origin:
  tagline: Mūsų kilmė
  heading: |-
    Pastatytas ant vandens,<br />
    <span class="text-sky-600">vedama tikslo</span>
  paragraphs:
    - Paddle Board Overstock Pradėjau pakrantės dirbtuvėse su viena valtimi ir užsispyrusiu įsitikinimu, kad jūrų produktai turi būti kuriami taip, lyg jie būtų svarbūs – nes jie tokie ir yra.
    - Mūsų įkūrėjai, du laivų architektai, matė pramonę, kurioje taupoma, medžiagos prastėja, o saugumas laikomas tik formalumu. Jie pastatė pirmąjį Paddle Board Overstock korpusą ne pelno siekiančiai, o tam, kad įrodytų, jog prieinama jūrinė įranga gali būti tikrai patikima.
    - Tas pirmasis korpusas vis dar naudojamas šiandien. Šis principas niekada nepasikeitė.
    - Mes nesame didžiausias gamintojas. Mes negaminame pigiausių produktų. Tačiau kiekvienas korpusas, išeinantis iš mūsų dirbtuvių, pereina per tas pačias rankas, kurios pradėjo įmonę – ir atitinka tą patį standartą kaip pirmasis korpusas.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock Pakrantės dirbtuvės
philosophy:
  tagline: Mūsų filosofija
  heading: Įsišaknijęs vandenyne
  description: Vandenynas nėra mūsų darbo vieta. Jis yra mūsų mokytojas. Kiekvienas dizaino sprendimas prasideda nuo supratimo, kaip elgiasi vanduo, kaip keičiasi sąlygos ir kaip įranga turi reaguoti.
  cards:
    - emoji: 🌊
      title: Gerbk vandenį
      description: Vanduo yra nenuspėjamas. Mūsų produktai sukurti blogiausioms sąlygoms, o ne geriausioms. Jei korpusas gali atlaikyti potvynio srovę, jis susitvarkys ir su ežeru. Jei gelbėjimosi liemenė veikia jūroje, ji yra per daug sudėtinga upei – ir tai yra tyčinis sprendimas.
    - emoji: 🔧
      title: Sukurta ilgaamžiškumui, o ne pakeitimui
      description: Tvariausias produktas yra tas, kurio nereikia keisti. Jūrų klasės PVC, Hypalon, ir drop-stitch konstrukcija pasirenkami dėl ilgaamžiškumo. Mes vis dar tiekiame atsargines dalis korpusams, kuriuos pagaminome prieš dešimtmetį.
    - emoji: 🏆
      title: Prieinama pagal dizainą
      description: Vandens sportas neturėtų būti prabanga. Mes kuriame produktus, kurie užtikrina profesionalų našumą už kainą, tinkamą šeimoms, gidams ir mažiems operatoriams – ne tik komerciniams parkams.
design:
  tagline: Dizaino filosofija
  heading: |-
    Sukurta kraštui<br />
    <span class="text-sky-600">Sąlygų</span>
  paragraphs:
    - Kiekvienas Paddle Board Overstock produktas prasideda nuo vieno klausimo:<em>Kokia blogiausia būklė, su kuria jis gali susidurti?</em>Mes projektuojame nuo krašto į vidų, o ne iš centro į išorę.
    - Mūsų drop-stitch branduoliai įvertinti 15 – PSI ne todėl, kad 12 PSI būtų per mažai ežerui, o todėl, kad 15 PSI lenta atlaiko staigų svyravimą be lankstumo. Mūsų Hypalon vamzdžiai pritaikyti komercinio lygio UV atsparumui – ne todėl, kad kiekvienas klientas irkluoja tropikuose, o todėl, kad UV degradacija yra pagrindinė ankstyvo gedimo priežastis.
    - Mes neprojektuojame pagal tam tikrą kainą. Mes projektuojame iki nesėkmės ribos – o tada statome gerokai virš jos.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock Dizainas ir inžinerija
  stats:
    - value: '15'
      label: PSI Branduolys<br />Reitingas
    - value: 1,500+
      label: UV Darbo laikas<br />Išbandyta
    - value: 10yr
      label: korpusas<br />gyvenimo trukmė
