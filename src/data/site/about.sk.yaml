origin:
  tagline: Náš pôvod
  heading: |-
    Postavené na vode,<br />
    <span class="text-sky-600">hnaný cieľom</span>
  paragraphs:
    - 'Aquafarer začal v pobrežnej dielni s jednou loďou a tvrdohlavou vierou: morské produkty by mali byť navrhované tak, ako keby záležalo na nich — pretože záleží.'
    - Naši zakladatelia, dvaja lodní konštruktéri, videli odvetvie, kde sa šetrilo, materiály sa degradovali a bezpečnosť sa brala len ako položka na zozname. Postavili prvý trup Aquafarer nie pre zisk, ale aby dokázali, že cenovo dostupné námorné vybavenie môže byť aj skutočne spoľahlivé.
    - Tá prvá trupa je stále v službe aj dnes. Ten princíp sa nikdy nezmenil.
    - Nie sme najväčší výrobca. Nevyrábame najlacnejšie produkty. Ale každé trupu, ktorý opustí našu dielňu, prechádza rovnakými rukami, ktoré založili spoločnosť — a spĺňa rovnaký štandard, aký nastavil prvý trup.
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: Aquafarer pobrežná dielňa
philosophy:
  tagline: Naša filozofia
  heading: Zakotvený v oceáne
  description: Oceán nie je naše pracovisko. Je to náš učiteľ. Každé rozhodnutie o dizajne začína pochopením toho, ako sa voda správa, ako sa menia podmienky a ako musí vybavenie reagovať.
  cards:
    - emoji: 🌊
      title: Rešpektujte vodu
      description: Voda je nepredvídateľná. Naše produkty sú navrhnuté pre najhoršie podmienky, nie pre tie najlepšie. Ak trup vydrží prúd, zvládne aj jazero. Ak záchranná vesta funguje na otvorenom mori, je nadmerne navrhnutá pre rieku — a je to zámerné.
    - emoji: 🔧
      title: Postavené na dlhú životnosť, nie na výmenu
      description: Najudržateľnejším produktom je ten, ktorý nie je potrebné meniť. Pre dlhú životnosť sa vyberá konštrukcia z námorného PVC, Hypalon a drop-stitch. Stále dodávame náhradné diely na trup, ktorý sme postavili pred desiatimi rokmi.
    - emoji: 🏆
      title: Prístupné podľa dizajnu
      description: Vodné športy by nemali byť luxusom. Navrhujeme produkty, ktoré poskytujú profesionálnu úroveň výkonu za cenu, ktorá dáva zmysel pre rodiny, sprievodcov a malých prevádzkovateľov — nielen pre komerčné flotily.
design:
  tagline: Filozofia dizajnu
  heading: |-
    Navrhnuté pre okraj<br />
    <span class="text-sky-600">podmienok</span>
  paragraphs:
    - Každý Aquafarer produkt začína jednou otázkou:<em>Aký je najhorší stav, ktorému to bude čeliť?</em>Navrhujeme od okraja dovnútra, nie od stredu von.
    - Naše drop-stitch jadrá sú hodnotené na 15 PSI — nie preto, že 12 PSI je nedostatočných pre jazero, ale preto, že doska 15 PSI zvláda náhly rozruch bez ohybu. Naše Hypalon trubice sú špecifikované na odolnosť UV komerčnej kvality — nie preto, že každý zákazník pádlí v tropických oblastiach, ale preto, že degradácia UV je hlavnou príčinou predčasného zlyhania.
    - Nenavrhujeme podľa cenovej úrovne. Navrhujeme podľa bodu zlyhania — potom staváme dobre nad ním.
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: Aquafarer dizajn a inžinierstvo
  stats:
    - value: '15'
      label: PSI jadro<br />hodnotenie
    - value: 1,500+
      label: UV hodín<br />testované
    - value: 10yr
      label: trup<br />životnosť
