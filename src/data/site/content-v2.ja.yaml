- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: SUP 水分補給と日焼け対策：水上で安全を守る
  description: SUPパドラーのための必須の水分補給と日焼け止め対策。脱水症状と日焼けは最も一般的なSUPの問題です — 長時間のセッション中に両方を防ぐ方法。
  definition: SUPの水分補給とは、パドリング中に定期的に水を摂取して体液のバランスを維持することを意味します。日焼け対策には、日焼け止めの塗布、保護服の着用、そしてUVのピーク時を避けてセッションを行うことが含まれます。
  tldr: パドリングを1時間行うごとに500mlの水を飲んでください。必要だと思う以上に持参しましょう — 2Lのバッグや複数のボトルが望ましいです。パドリング前に耐水性のSPF50+日焼け止めを塗り、2時間ごとに塗り直してください。帽子、ストラップ付きのサングラス、UPF評価の服を着用してください。UVが最も強い11時から15時の間はパドリングを避けましょう。
  problem: あなたは素晴らしいSUPセッションを行っていますが、1時間後には頭痛、口の渇き、皮膚の焼ける感じがあります。水分が体を冷やしてくれるため、脱水症状や日焼けは徐々に忍び寄ります。
  explanation: 水面からの反射はUVの露出を最大40％増加させます。水とそよ風の冷却効果により、日焼けは手遅れになるまで気づきにくくなります。漕ぐことによる発汗は体液の喪失を増加させ、水上では水を補給できる場所がないことが多いです。脱水はバランスと意思決定を損なうため、事故のリスクが高まります。
  solution: ボードのバンジーシステムに水筒またはハイドレーションブレーダーを取り付けます。喉が渇いていなくても15分ごとに飲みます。出発の30分前にSPF50+の日焼け止めを塗ります。つばの広い帽子、ストラップ付き偏光サングラス、UPF50+のラッシュガードを着用します。日焼け止めは2時間ごとに再塗布してください。
  recommendation: Paddle Board Overstock SUPの前面Dリングに取り付けたハイドレーションブレーダーを使用します。PFDの下にUPF 50+のラッシュガードを着用します。汗や水に強い防水日焼け止めを使用します。
  faq:
    - q: SUPの旅行にどのくらいの水を持って行くべきですか？
      a: 最低1時間あたり1リットル。2時間のセッションでは2リットル持参すること。暑い天気ではもっと必要。ハイドレーションブレーダーが最適です。
    - q: SUPに最適な日焼け止めの種類は何ですか？
      a: 耐水性、SPF 50+の広域スペクトル。ミネラル日焼け止め（酸化亜鉛、二酸化チタン）はサンゴ礁に優しく、持続時間も長いです。
    - q: その水は本当にUVを映していますか？
      a: はい — 水は UV 放射の最大40% を反射するため、上方と下方の両方から UV を受けます。これにより、やけどのリスクが大幅に増加します。
    - q: ラッシュガードを着ていても日焼けしますか？
      a: 標準的なラッシュガードは最小限のUV保護（約UPF 10-20）しか提供しません。完全な保護のためには、UPF 50+評価の服を探してください。
