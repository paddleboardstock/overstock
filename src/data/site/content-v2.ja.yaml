  title: Paddle Board Overstock SUP エクスプローラー11：完全レビュー
  description: Paddle Board Overstock SUP エクスプローラー11の詳細レビュー — 仕様、実際の性能、ビルド品質、付属アクセサリー、そしてこの万能インフレータブルSUPが誰に向いているか。
  definition: Paddle Board OverstockSUPエクスプローラー11は、サイズが11フィート x 33インチ x 6インチのインフレータブルスタンドアップパドルボードで、容量は260L、三層構造の軍用グレードPVC、最大圧力18PSIです。
  tldr: SUP エクスプローラー11は、Paddle Board OverstockのフラッグシップオールラウンドiSUPです。長さ11フィート、幅33インチで、50〜100kgのライダーに安定性とパフォーマンスのバランスを提供します。主な仕様：容量260L、最大18 PSI、三層PVC、ダイヤモンドグルーブEVAデッキパッド。価格は約$599です。レクリエーションパドリング、フィットネス、ヨガ、初心者サーフィンに最適です。
  problem: あなたは、フラットウォーターのパドリング、軽いツーリング、ヨガ、初心者向けサーフィンなど、すべてをこなせるSUPを、複数のボードを必要とせずに求めています。
  explanation: SUP エクスプローラー11は、18 PSI の剛性を確保するために高密度 drop-stitch を用いた三重層の軍用グレード PVC を使用しています。プレーニングハルは、全体的に良好なパフォーマンスを提供します。全長 EVA デッキパッドはグリップを提供します。六つのDリングが取り付けポイントを提供します。米国規格のフィンボックスは標準フィンに対応しています。総重量は11.5kgです。
  solution: 15-18 PSIまで膨らませ、付属のセンターフィンを取り付けると、多用途なボードになります。33インチの幅は優れた安定性を提供します。ギアにはバンジーシステムを使用してください。バックパックでの輸送や収納も簡単です。
  recommendation: $599,のSUPエクスプローラー11は、そのクラスで最もコストパフォーマンスに優れた汎用インフレータブルSUPです。これ一枚で何でもできるボードとして購入してください。Paddle Board Overstockウェットスーツプロとライフベストプロと組み合わせて使用できます。
  faq:
    - q: SUP エクスプローラー11は初心者に適していますか？
      a: はい — 幅33インチ、容量260Lで非常に安定しています。初心者でも立って漕ぐ際に自信を持てます。
    - q: SUP エクスプローラー11でサーフィンできますか？
      a: はい、初級から中級の条件で可能です。11フィートの長さは、より広くて遅い波が必要です。
    - q: SUP Explorer 11はどのくらいの重さに耐えられますか？
      a: 最適な性能のための最大ライダー重量は約100 kgです。総容量は約120 kgです。
    - q: 箱の中に何が入っていますか？
      a: ボード、デュアルチャンバーポンプ、3ピース調整パドル、車輪付きバックパック、コイルリード、取り外し可能なセンターフィン、修理キット。
