- slug: cold-water-safety-guide
  category: guide
  type: safety
  title: 冷水での安全対策：冷たい環境でのパドリングとサーフィン
  description: SUP、サーフィン、カヤックのための冷水の安全性。低体温症の認識、適切な装備、コールドショックへの対応、冷水浸水時の緊急手順。
  definition: 冷水での安全性には、コールドショック反応、泳ぐことの失敗、低体温症、そしてこれらの結果を防ぐための装備や技術を理解することが含まれます。
  tldr: 水温が15℃以下の場合はウェットスーツが必要です。10℃以下の場合はブーツ、手袋、フードが必要です。寒冷ショックは無意識のあえぎを引き起こします。水温10℃以下では3～5分で泳ぐことができなくなります。低体温症の症状には、震え、混乱、協調運動の喪失が含まれます。
  problem: あなたは晴れた日にパドルをして出かけますが、水温が8℃であることに気づいていません。落ちると、思わず息をのんで、数分以内に手足の感覚がなくなります。冷たい水は他のどんな海の危険よりも早く命を奪います。
  explanation: 冷水浸漬には4つの段階があります：コールドショック（0〜2分） — 喘ぎ、過呼吸。泳げなくなる段階（3〜15分） — 筋肉が冷え、協調運動が失敗する。低体温症（15〜45分） — 体温が35℃以下に低下し、混乱や心停止を引き起こす。救助後の崩壊 — 冷たい血が中心部に戻る。
  solution: 水温を確認してください。水温に適したウェットスーツを着用してください。15℃以下の水で一人で漕ぐことは決してありません。ホイッスルと電話を携帯してください。落水した場合は、呼吸をコントロールし、素早くボードに戻ってください。あまりにも寒い場合は、助けを求めて合図してください。
  recommendation: Paddle Board Overstock ウェットスーツ Pro 5/4/3mm は水温 8-14℃ の最低限の装備です。Paddle Board Overstock 5mm ブーツと 3mm グローブを追加してください。追加の保温のためにライフベスト Pro を着用してください。
  faq:
    - q: 10℃の水でどのくらい生きられますか？
      a: コールドショックは1～2分続きます。浮力や保温がなければ、耐久時間は30～60分です。
    - q: 低体温症の最初の兆候は何ですか？
      a: 制御できない震え、混乱、協調運動の不良、ろれつの回らない話し方。すぐに活動を止めて温まってください。
    - q: 冷たい水のセッションの後、どうやって体を温めますか？
      a: 濡れた装備を取り除き、体を拭いて乾かし、帽子や手袋を含む暖かい服を着る。暖かいノンアルコール飲料を飲む。
    - q: 夏に低体温症になることはありますか？
      a: はい — 15°C以下の水は、夏でも多くの場所で見られます。水は空気よりも25倍速く熱を伝えます。
