- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP アンカーガイド: 釣りや写真撮影中にその場に留まる'
  description: SUP アンカリングの完全ガイド — アンカーの種類（マッシュルーム、折りたたみ式、杭）、アンカートローリーの設置、展開技術、位置を維持するための安全上の考慮事項。
  definition: SUPアンカーは、風や潮流に対してボードを所定の位置に保つためにロープに取り付けられた重りです。一般的な種類には、マッシュルームアンカー、折りたたみアンカー、および杭アンカーがあります。
  tldr: 泥や砂の底にはマッシュルームアンカー（1.5〜3ポンド）を使用し、岩の多い底には折りたたみアンカーを使用し、柔らかい底の浅い水域にはステークアウトポールを使用してください。アンカーの重さは、穏やかな条件では1.5〜3ポンド、風や潮流がある場合は3〜5ポンドとしてください。常にアンカートローリーを使用して位置を調整し、解放するタイミングを把握してください。
  problem: 完璧な釣りスポットを見つけたのに、風や潮流のせいで数分ごとに位置がずれてしまいます。アンカーを下ろさなければ、SUP 釣りと写真撮影は絶えず位置を変えることになるイライラする作業です。
  explanation: 錨は底を引きずりながら掛かることで機能します。マッシュルーム型の錨は柔らかい底に埋まり、砂や泥で良い保持力を提供します。折りたたみ式の錨は、硬いまたは岩の多い底に突き刺さる爪を持っています。打ち込み用の棒は、浅い水域で底に直接押し込むことで機能します。
  solution: アンカーの取り付けポイントを調整するために、アンカートロリーシステム（ボードの片側にスライディングリングが付いたロープ）を設置してください。アンカーに50〜75フィートのロープを取り付けます。希望する位置の風上または上流側に展開します。緊急時に取り外せるようにクイックリリースシステムを使用してください。強い流れの中やアンカーを簡単に回収できない場所でアンカーを降ろしてはいけません。
  recommendation: 3ポンドの折りたたみ式アンカーと50フィートのロープは、ほとんどのSUP釣りの状況で使用できます。Paddle Board OverstockSUPエクスプローラー11のDリングを使用してアンカートロリーシステムを追加してください。
  faq:
    - q: SUPにはどのサイズのアンカーが必要ですか？
      a: 穏やかな湖やゆっくり流れる川には1.5〜3ポンド。風や潮流のある沿岸地域には3〜5ポンド。大きすぎるアンカーは回収が困難です。
    - q: アンカー用のロープはどのくらい必要ですか？
      a: 標準は5:1のスコープ（深さ1フィートに対して5フィートのロープ）です。水深10フィートでは、50フィートのロープを使用してください。
    - q: SUPでの停泊は危険ですか？
      a: ボードを転覆させるほどの潮流や風がある場合にのみアンカーを下ろしてください。常に瞬時に取り外せるクイックリリースシステムを使用してください。
    - q: どの水域でも係留できますか？
      a: 現地の規制を確認してください。一部の地域では、海草や海洋生息地を保護するために停泊が制限されています。サンゴ礁には絶対に停泊しないでください。
