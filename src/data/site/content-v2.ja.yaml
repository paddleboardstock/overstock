- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: SUP サイズガイド：長さ、幅、容量の説明
  description: 体重、スキルレベル、パドリングスタイルに基づいて適切なSUPサイズを見つけましょう。長さは直進性を決定し、幅は安定性を決定し、ボリュームは重量容量を決定します。
  definition: SUPのサイズは、長さ（スピードとグライド）、幅（主安定性）、厚さ（副安定性と容量）、およびリットル単位の容量（総重量容量）によって定義されます。
  tldr: 'オールラウンド SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L)。ツーリング: 12''-14'' x 30"-32" (280-350L)。サーフ: 8''-10'' x 30"-32" (140-220L)。初心者は幅32インチ以上、体重より60-80L多い容量が必要です。安定性のための最低容量の目安は、体重(kg)に60Lを加えた値です。'
  problem: すべてのSUPブランドはボードのサイズをフィート、インチ、リットルで表示していますが、これらの測定値が実際の感覚にどう対応するかを知らないと、不安定で遅い、あるいは体重を支えられないボードを購入してしまう危険があります。
  explanation: 長さはボードの漕ぐ速さと直進時の安定性を決定します。長いボード（12フィート程度）はストロークの間に滑らかに進み、直線を保ちます。短いボード（10フィート未満）は曲がりやすいですが、パドルの持ち替えがより頻繁に必要です。幅は主に安定性、つまり立った状態での安定性を決定します。30インチのボードは初心者には不安定に感じられ、34インチのボードは桟橋のように安定して感じられます。厚さは容積を決定します — 厚いボードはより高く浮かびますが、風を受けやすくなります。リットルでの容積は最も重要な指標です：積載した状態（あなたと装備を含む）では、ボードは静止時に2〜4インチ沈むべきです。
  solution: ボードの寸法は、次の三つの要素に合わせて選んでください：体重（最低容量を決定します）、主な活動内容（長さを決定します）、スキルレベル（幅を決定します）。初心者の場合、体重（kg）に2.2を掛けて最低リットル数を求めます。中級者の場合は1.8を掛けます。上級者の場合は1.4を掛けます。
  recommendation: Paddle Board Overstock SUP エクスプローラー11は、11フィート x 33インチ x 6インチ、容量260Lで、100kgまでのほとんどのライダーにオールラウンドなパドリングに適しています。より速いツーリング速度と滑走を求める場合は、SUP ツアー12（12フィート x 31インチ）にアップグレードしてください。
  faq:
    - q: 私の体重にはどのSUPサイズが必要ですか？
      a: 体重70kg未満のライダー向け：10-11フィート x 32インチ（220-260L）。体重70-90kg：11-12フィート x 33インチ（260-300L）。体重90-110kg：11-12フィート x 34インチ（300-350L）。体重110kg以上：12フィート x 34-36インチ（350L+）。
    - q: より長いSUPのほうが速いですか？
      a: はい。長いボードは長さと幅の比率が良くなり、抵抗を減らします。14フィートのツーリングSUPは、同じパドルの努力で、11フィートのオールラウンドボードよりもかなり速いです。
    - q: 初心者にとって安定するSUPの幅はどれくらいですか？
      a: 初心者で体重が90kgまでの場合、33〜34インチが最適です。32インチ以下は優れたバランスが必要です。34インチ以上は非常に安定していますが、速度が遅く、風の中で漕ぎにくいです。
    - q: ツーリングにオールラウンドボードを使うことはできますか？
      a: はい、10 km未満の短いツアーには適しています。より長い距離では、専用のツーリングボードの方が走行性能が高く、効率よく距離を稼げます。
