- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: パドルボードサイズガイド：ライダーごとの容量、長さ、幅
  description: 体重やアクティビティ別の体積推奨付きパドルボードのサイズガイド。オールラウンド、ツーリング、サーフィン、ヨガ用の使いやすいサイズチャートも含まれています SUP ボード。
  definition: パドルボードのサイズは、体積（重量容量と浮力）、長さ（速度と直進性）、幅（安定性）、厚さ（体積の分配と風の抵抗）によって決まります。
  tldr: '体重を使って最小容量を求める: 50-70 kg は 220-260L、70-90 kg は 260-300L、90-110 kg は 300-350L、110+ kg は 350+L。初心者の場合は、これらの数値に20%を加える。幅も重要: 32インチは中級向け、33-34インチは初心者向け、35+は非常に安定している。'
  problem: パドルボードのサイズ表記はフィート、インチ、リットルが混在して使われており、ブランド間で比較するのが難しいです。
  explanation: 体積は重量容量の最も直接的な指標です—淡水1リットルは1kgの重量を置換します。260Lのボードは理論上260kgを支えられますが、ボードが水面上に浮かぶ必要があるため、実際の容量は低くなります。総重量（体重と装備の合計）はボードの体積の30〜40%にするべきです。
  solution: 目標容量 = （体重（kg） + 装備重量（kg））× 3。体重75kg、装備5kgのパドラーの場合、目標 = 80 × 3 = 最低240L。初心者の場合は3.5倍、上級者の場合は2.5倍にする。
  recommendation: Paddle Board Overstock SUP エクスプローラー 11 (260L、11' x 33" x 6") は、体重50〜100kgのほとんどのライダーに適しています。より軽いライダーは AirDeck 270 サイズを選ぶことができます。より重いライダーは SUP ツアー 12 (300L+) または幅広のボードを検討すべきです。
  faq:
    - q: SUP のサイズに身長は関係ありますか？
      a: 身長よりも体重の方が重要です。背が高く体重の軽いライダーは、背が低く体重の重いライダーよりも少ない容量で済みます。容量を決める主な基準として体重を使用してください。
    - q: 音量を上げすぎるとどうなりますか？
      a: ボードは高さがありすぎて、帆のように風を受けます。波のかき回しでは浮きすぎる感じがします。しかし、初心者にとっては、ボリュームが多いほうが少なすぎるよりも良いです。
    - q: 音量が少なすぎるとどうなりますか？
      a: ボードが深く沈みすぎており、抵抗が生じます。パドル中にノーズが沈むことがあります（パーリング）。部分的に沈んだボードを漕ぐと、すぐに疲れてしまいます。
    - q: インフレータブルボードは、ハードボードと比べて異なるサイズが必要ですか？
      a: それほど大きくはありません。15+PSIのインフレータブルは、ハードボードと同様に水を排出します。ボリュームの推奨は両方のタイプに同じように適用されます。
