- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: インフレータブルSUP修理：穴、漏れ、バルブの問題を修理する
  description: DIY膨張式SUP修理ガイド。付属の修理キットを使って、ゆっくり漏れる箇所を見つけ、穴を修理し、バルブを交換し、デッキパッドの剥離を修理する方法。
  definition: インフレータブルSUPの修理には、石鹸水テストによる空気漏れの特定、損傷箇所の清掃と荒仕上げ、PVC接着剤とパッチの塗布、圧力下での硬化が含まれます。
  tldr: 石けん水で漏れを探します。サンドペーパーで穴の周りの部分をきれいにし、ざらつかせます。パッチとボードの両方にPVC接着剤を塗り、5分待ち、しっかり押さえて、重しをして24時間硬化させます。バルブの漏れの場合は、まずOリングを確認してください。1/4インチ未満の小さな穴は簡単に自分で修理できます。
  problem: あなたはSUPに空気を入れますが、朝までに圧力が下がっています。修理の知識がない場合、単純な穴あきである可能性が高いのに、高額な交換に直面することになります。
  explanation: ほとんどのインフレータブルSUPsは、PVCの外層を持つdrop-stitchコアを使用しています。外層PVCに穴が開くと、ゆっくりとした漏れが発生します。標準的な修理方法：清掃、研磨、PVC対応の接着剤を塗布し、重しを置いてパッチを押さえる。パネルの穴よりもバルブの漏れの方が一般的です — Oリングが乾燥するか、ゴミがシールを妨げます。
  solution: ボードを最大まで膨らませてPSI、シューという音を聞きます。特に縫い目とバルブ周りに石鹸水を計画的にスプレーします。泡が出る箇所に印を付けます。空気を抜き、アルコールで清掃し、80番のサンドペーパーで研磨し、パッチとボードにPVC接着剤を塗り、粘着状になるまで待ち、しっかり押さえ、24時間重しを置きます。
  recommendation: すべてのPaddle Board Overstockボードに付属しているPaddle Board Overstock修理キットを使用してください。旅行時には必ず修理キットを持参してください。バルブの問題がある場合はPaddle Board Overstockサポートに連絡してください。大きな裂け目や縫い目の分離については、専門の修理をお勧めします。
  faq:
    - q: 私の大きなSUPの破れを修理できますか？
      a: 1インチの裂け目は、専門家による修理や両面のパッチが必要な場合があります。レールに沿った縫い目の分離は、現場で確実に修理することはできません。
    - q: 修理用パッチはどのくらい持ちますか？
      a: 適切な技術での正しい修理はボードの寿命まで持ちます。不十分な清掃による接着不良は将来的な故障につながります。
    - q: 漏れているバルブを修理できますか？
      a: 多くの場合、はい。バルブコアを取り外し、Oリングを点検し、清掃または交換し、シリコーン潤滑剤を塗布して再取り付けします。
    - q: もし漏れを見つけられなかったらどうしますか？
      a: 完全にPSIまで膨らませ、セクションごとに順番に浴槽またはプールに沈めます。見つけられないほど小さな漏れは温度に関連している場合があります。
