- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: インフレータブルSUPのメンテナンス：ボードを長持ちさせる方法
  description: 適切なインフレータブルSUPのメンテナンスは、ボードの寿命を大幅に延ばします。drop-stitchパドルボードの掃除、乾燥、バルブの手入れ、UVの保護、季節ごとの保管のヒント。
  definition: インフレータブルSUPのメンテナンスには、使用後の清掃、適切な乾燥、バルブの点検、UVの保護、そして剥離、カビ、素材の劣化、空気漏れを防ぐための正しい保管が含まれます。
  tldr: 毎回の海水での使用後はボードを真水で洗い流してください。空気を抜いて保管する前に完全に乾かしてください。バルブにゴミがないか確認し、Oリングに年1回潤滑剤を塗布してください。ボードは膨らませた状態（半分のPSIで）で涼しく暗い場所に保管してください。PVCを劣化させる長時間のUV露出は避けてください。小さな穴は付属の修理キットで直ちに修理してください。
  problem: シーズンの後、あなたの空気注入式SUPはゆっくりと漏れが生じ、デッキパッドの端が剥がれ、PVCは硬く感じます。基本的なメンテナンスを怠ると、防ぐことが完全に可能な早期の劣化を引き起こします。
  explanation: PVC は UV 放射線下で劣化します。海水の塩結晶が隙間やバルブに入り込み、微小な漏れを引き起こします。内部に閉じ込められた湿気が drop-stitch の糸を攻撃するカビの成長を促進します。バルブのOリングは乾燥して密封性を失います。汚れや砂がデッキパッドの接着剤に入り込み、端部の剥がれを引き起こします。
  solution: 各セッション後：ボード、フィン、ポンプを真水で洗い流します。デッキパッドを拭きます。バルブを開いて閉じ込められた水を排出します。空気を抜く前にボードを日陰で乾かします。月に一度：バルブを点検し、Oリングにシリコーン潤滑剤を塗布します。季節ごと：やさしい石鹸と水で洗い、穴がないか確認します。
  recommendation: ボードに付属のPaddle Board Overstockケアガイドに従ってください。パンクした場合は修理キットをすぐに使用してください。ボードは袋に入れ、直射日光の当たらない温度管理された場所に保管してください。
  faq:
    - q: 私の膨張式SUPをシーズン中ずっと膨らませたままにしておいてもいいですか？
      a: はい、ただしストレスを縫い目にかけないように、直射日光の当たらない場所に保管し、最大の半分のPSI（8-10PSI）で保管してください。使用直前に完全に膨らませてください。
    - q: 私はどのようにして私のSUPのカビを掃除すればいいですか？
      a: 柔らかい石けんをぬるま湯と混ぜ、柔らかいブラシでこすります。頑固なカビには、薄めた酢液（1:4）を使用してください。漂白剤は避けてください。
    - q: バルブに潤滑油をさす必要がありますか？
      a: はい、毎年です。バルブコアを取り外し、Oリングにシリコングリースを塗り、再取り付けしてください。これにより空気漏れを防ぎます。
    - q: 冬にSUPをどのように保存すればよいですか？
      a: きれいにして完全に乾かしてください。空気を完全に抜き、ゆるく巻き（きつい折り目は避ける）、涼しく暗く乾燥した場所に保管してください。凍結する温度は避けてください。
