  title: ツーリングSUPガイド：長距離パドリングに適したボードを選ぶ
  description: ツーリング用のSUPsはより長く、より細く、スピードと滑走のために作られています。ツーリングボードの選び方、長時間パドルするための必須ギア、効率的に距離を稼ぐためのテクニック。
  definition: ツーリング用のSUPは、長さ12〜14フィート、幅30〜32インチの細長いボードで、長距離の効率的なパドリングのために設計されています。特徴としては、水を切るための排水型ノーズ、滑走のための長い水線、そして多くの場合バンジー式カーゴシステムがあります。
  tldr: ツーリング用SUPsは、安定性よりもスピードと直進性を優先します。効率のために最小長は12フィート、滑走と安定性のバランスのために幅は30～32インチです。主な特徴：ディスプレイスメントノーズ、ストレートアウトライン、複数のフィンセッティング。必須装備：PFD、リーシュ、飲料水、電話、ギア用バンジーシステム。テクニックは、胴体の回転を伴う長く滑らかなストロークに重点を置きます。
  problem: 長距離の旅でオールラウンドのボードを漕ぐと、疲れ果ててしまいます。幅広のノーズは波を受け、ボードはまっすぐに進まず、滑るよりも方向を変えるのに多くのエネルギーを使ってしまいます。距離向けに設計されたボードが必要です。
  explanation: ツーリング用SUPsは、浮上して水の上を滑るのではなく、水を切る変位型のハル（先端が尖った形状）を使用しており、抵抗を大幅に減らします。水線の長さが長いため、ハルスピードが増加します。幅が狭いほど抵抗は減りますが、より良いバランスが必要です。ツーリングボードは、方向安定性のために長いフィンを特徴としています。インフレータブルのツーリングボードは、剛性を維持し、エネルギーを浪費するたわみを防ぐために、より高いPSI（18-20）が必要です。
  solution: 少なくとも12フィートの長さで、排水型ノーズのツーリングボードを選んでください。幅は、経験者には30インチ、中級者には31〜32インチ。安定性のためにセンターフィンボックスとサイドバイトを備えたものを探しましょう。最大許容圧PSIまで空気を入れてください。バンジー式荷物固定具、PFD、ホイッスル、防水ケース入りの電話を装備してください。
  recommendation: Paddle Board Overstock SUP ツアー 12 は、12フィート x 31インチ x 6インチの理想的なツーリング用インフレータブルです。変位型のノーズが波を効果的に切り裂き、バンジーシステムが日帰りのためのギアをしっかりと保持します。Paddle Board Overstock カーボンパドルと組み合わせることで、長距離パドリングを効率的に行えます。
  faq:
    - q: ツーリングにオールラウンドボードを使うことはできますか？
      a: 5 km未満の短いツアーであれば、はい。より長い距離では、広いノーズと短い水線があなたをより早く疲れさせます。
    - q: どの長さのツーリングSUPが必要ですか？
      a: 12フィートはツーリング効率の最小です。12フィート6インチは中級者向けの良い長さです。14フィートはレースや上級ツーリング用です。
    - q: インフレータブル・ツーリングSUPsは、ハードボードと同じくらい性能が良いですか？
      a: 近代のdrop-stitchインフレータブルは、高いPSIでのパフォーマンスがツーリング用のハードボードと同様です。わずかな柔軟性は、実際に荒れた水面ではより快適かもしれません。
    - q: ツーリングに最適なパドルはどれですか？
      a: パワー用にブレードが大きい（100〜110平方インチ）軽量のカーボンまたはファイバーグラスのパドル。調整可能なパドルは、ツーリングとサーフィンの切り替えが可能です。
