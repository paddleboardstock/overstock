- slug: life-jacket-buying-guide
  category: guide
  type: buying-guide
  title: ライフジャケット購入ガイド：種類、フィット感、機能の解説
  description: ウォータースポーツのためのライフジャケット購入ガイド完全版。PFDタイプ（IからVまで）、膨張式とフォーム式、フィットテスト、そしてSUP、カヤック、ボート、釣り用の具体的なおすすめ。
  definition: 救命胴衣またはPFDは、人の頭を水上に保つために設計された浮力装置です。種類は浮力と使用目的に基づき、米国沿岸警備隊によって規制されています。
  tldr: '5種類のPFD: タイプI（沖合用、22+ポンド）、タイプII（沿岸用）、タイプIII（浮力補助、最も一般的）、タイプIV（投げ渡し用）、タイプV（特殊用途用）。膨張式ベストは快適ですが、CO2カートリッジのメンテナンスが必要です。フォームベストはメンテナンス不要ですが、かさばります。'
  problem: ライフジャケットは種類と浮力の評価によって分類されていますが、店では必ずしもどの種類が自分の活動に適しているかを説明してくれるわけではありません。
  explanation: タイプIは最も浮力があり、意識を失った着用者を仰向けにします。タイプIIはすべての着用者を仰向けにできるわけではありません。タイプIIIはアクティブなスポーツのための自由な動きを可能にします。タイプVにはSUP用の膨張式ベルトパックが含まれます。膨張式PFDsは33〜37ポンドの浮力を提供し、空気が抜けた状態ではコンパクトです。
  solution: SUP用：タイプVの膨張式ベルトパック。カヤック用：腕のカットアウトが高いタイプIIIのフォーム。RIBのボート用：タイプIIIのフォームまたは22+ポンドの浮力を持つ膨張式。子供用：クロッチストラップ付きのタイプIIまたはIIIのフォーム。
  recommendation: Paddle Board Overstock ライフベスト プロ（膨張式 Type V、33 ポンド）SUP およびカヤック用。Paddle Board Overstock ライフベスト クラシック（フォーム式 Type III、16.5 ポンド）RIB のボート乗りおよび一般的な海洋使用向け。
  faq:
    - q: SUPにはどのPFDタイプが必要ですか？
      a: 多くの法域では、SUP に対してタイプ III またはタイプ V を認めています。インフレータブルベルトパックは人気があります。現地の法律を確認してください。
    - q: 膨張式のPFDsはメンテナンスが必要ですか？
      a: はい — CO2カートリッジは毎年点検し、ボビンは2〜3年ごとに交換し、塩水使用後は洗い流してください。
    - q: 私はSUPのためにフォームPFDを着用できますか？
      a: はい、でもアームカットが高いものを選んでください。フォームベストはかさばりますが、メンテナンスは不要です。
    - q: 子供にとってPFDは何が一番良いですか？
      a: USCG承認のタイプIIまたはIIIフォームベスト（襟付き、股ベルト付き、明るい色）。子供には決してインフレータブルPFDsを使用しないでください。
