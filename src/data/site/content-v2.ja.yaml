- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: SUP フィットネス：パドルボードで全身トレーニング
  description: SUPは心肺持久力、コアの安定性、筋力を組み合わせた全身運動を提供します。SUPのフィットネスセッションの構成方法、最適なエクササイズ、進捗の測定方法。
  definition: SUP フィットネスは、パドルボードの不安定なプラットフォームを使用して、パドリング、バランス、ボードベースの運動を通じて、コアの安定筋、脚の筋肉、上半身を鍛えます。
  tldr: SUPは1時間あたり400〜700カロリーを消費します。1時間のSUPセッションでは、コア、脚、背中、肩、腕を使います。インターバルパドリング（スプリント+回復）はカーディオを最大化します。ボード上でのヨガのポーズはバランスと柔軟性を高めます。ボード上でのスクワットやランジなどのSUP特有の筋力運動を追加してください。
  problem: ジムでのトレーニングは退屈になってきており、楽しみながらフィットネスを高められる屋外活動を探しています。SUPは、冒険と本格的な全身トレーニングを組み合わせています。
  explanation: パドリングは、広背筋、三角筋、僧帽筋、そして回旋のための体幹の筋肉を使います。動くプラットフォームの上に立つことは、足首、膝、股関節の安定筋を常に働かせます。中程度の強度での連続したパドリングによる心血管への負荷は、有酸素運動のコンディショニングを提供します。
  solution: 'セッションの構成: 5分のウォームアップパドリング、20分の中程度のペースでの定常パドリング、15分のインターバルパドリング（30秒スプリント、60秒イージー）、10分のボードエクササイズ（スクワット、ランジ、腕立て伏せ）、5分のクールダウンストレッチ。'
  recommendation: フィットネスパドリングにはPaddle Board Overstock SUP Explorer 11を使用してください。安定したプラットフォームにより、テクニックと強度に集中できます。高強度のセッション中の安全のためにLife Vest Proを着用してください。
  faq:
    - q: SUPは何カロリー消費しますか？
      a: 強度、風、潮流によって1時間あたり400〜700カロリー。インターバルパドリングはカロリー消費を増やします。
    - q: SUPは体重減少に良いですか？
      a: はい、適切な栄養と組み合わせると効果的です。全身を使うことと低負荷であることが、定期的な運動として持続可能にします。
    - q: SUPで筋力トレーニングをしてもいいですか？
      a: はい — スクワット、ランジ、腕立て伏せ、そしてボードでのプランクは、筋力トレーニングにバランスの挑戦を加えます。
    - q: SUPはどの筋肉を鍛えますか？
      a: 主要：コア（腹斜筋、腹横筋）、背中（広背筋、僧帽筋）、肩（三角筋）、腕（二頭筋、三頭筋）。副次：脚（大腿四頭筋、ハムストリング、ふくらはぎ）。
