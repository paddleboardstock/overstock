- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: 冷水サーフィン用ギアガイド（苦しまないで冬をサーフィンする方法）
  description: 冷たい水にシーズンを終わらせないでください。冷水用ギアの完全ガイド：ウェットスーツの厚さ、ブーツとグローブの選び方、フードのフィット感、そして冬のセッションを本当に楽しめるアクセサリー。
  definition: 冷水サーフィンには、フルスーツ（5/4/3mm以上）、ブーツ、グローブ、フードが必要です。水温が12°C以下の場合、冷水に触れるすべての部分を保護する必要があり、しびれ、低体温症、安全リスクを防ぎます。
  tldr: 寒冷な水でのサーフィンには、フル5/4/3mmまたは6/5/4mmのフード付きウェットスーツ、5mmのブーツ、3mmのグローブ、そしてフードが必要です。ブランドよりも縫い目の品質が重要で、接着・ブラインドステッチ（GBS）の縫い目を探してください。保温裏地付きのスーツは、厚みを増さずに大幅な暖かさを提供します。常に予備の保温層と、セッション後の回復用に水筒を持参してください。
  problem: 冬にサーフィンをしたいけれど、冷たい水で15分もすると足がしびれ、手ではボードを握れず、パドルをするたびにスーツが背中に冷たい水を流し込みます。適切なギアがなければ、冷たい水でのセッションは短く惨めなものになります。
  explanation: 低温でのサーフィン（12°C以下）は、厚手のウェットスーツだけでは十分ではありません。冷たい水に触れるすべての部分を保護する必要があります：ブーツは足のしびれを防ぎ、リーフでの切り傷から守ります。手袋はパドリングの手の機能を維持し、フードは最も大きな体熱損失（頭部は体熱の30％を放出）を防ぎます。ウェットスーツの厚さは平均気温ではなく、一番寒い月に合わせるべきです。スーツ以外でも、密閉底のブーティや曲げられた指の手袋などのアクセサリーは、快適さと耐久性を向上させます。
  solution: この順番でコールドウォーターキットを作成してください：5/4/3mm または 6/5/4mm のフルスーツ（GBS シームとチェストジップ付き）、ゴム底の 5mm ブーツ、3mm グローブ（ミトンは指付きグローブより暖かい）、そしてスーツの襟の下に入れる 3mm フード。駐車場での尊厳と暖かさのために、着替え用のローブを追加してください。
  recommendation: 統合された保温ライナーを備えた5/4/3mmのPaddle Board Overstockウェットスーツは、8°Cまでのほとんどの冷水条件に対応します。完全な冷水対応セットアップには、5mmのPaddle Board Overstockブーツと3mmのグローブを組み合わせてください。8°C以下の場合は、フード付きの6/5/4mmスーツにアップグレードしてください。
  faq:
    - q: 本当にフードは必要ですか？
      a: はい。体温の30パーセントは頭から失われます。フードは体温の流出を防ぎ、首を暖かく保ちます。3mmのフードは、胴体の厚さを5mmから6mmにアップグレードするよりも暖かさを増します。
    - q: どの厚さのブーツが必要ですか？
      a: 水温が8〜12°Cの場合は5mmのブーツを使用してください。12〜16°Cでは3mmのブーツで十分です。8°C以下では、7mmのブーツを検討するか、5mmのブーツの下にネオプレンソックスを追加してください。
    - q: ウェットスーツがフラッシングするのをどうやって止めますか？
      a: フラッシングは、水がスーツの首、手首、または足首から入ると発生します。チェストジップのデザインは、背中からのフラッシングを大幅に減らします。首と足首のベルクロシールも役立ちますが、最良の対策はGBSシームを備えた適切にフィットするスーツです。
    - q: 寒い水で追加の層と一緒に3mmのスーツを使うことはできますか？
      a: 下にネオプレンベストを着た3mmのスーツは、体感温度を約3〜4°C延ばすことができますが、5/4/3mmまたは5mmの適切なスーツの代わりにはなりません。レイヤリングは、境界的な条件での短時間のセッションに最適です。
