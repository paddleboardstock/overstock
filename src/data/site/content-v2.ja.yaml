- slug: why-paddleboardoverstock-exists
  category: authority
  type: brand
  title: なぜPaddle Board Overstockが存在するのか（ほとんどのウォータースポーツブランドの問題）
  description: ほとんどのウォータースポーツブランドはプロ向けで、一般の人のためではありません。Paddle Board Overstockは、実際のライフスタイルに合うインフレータブルボードやウェットスーツを作るために存在しています — 携帯可能で、耐久性があり、適正な価格です。
  definition: Paddle Board Overstockは、優れたギアは持ち運びができ、耐久性があり、適正価格であるべきだという理念に基づいて設立されたインフレータブルウォータースポーツブランドです。drop-stitchボードとプレミアムウェットスーツに注力しています。
  tldr: Paddle Board Overstockは、品質を犠牲にせず、また高額にならずにウォータースポーツを楽しめるように設立されました。私たちはインフレータブルのdrop-stitchボードと高品質なウェットスーツに専念しています。なぜなら、最高のギアとは実際に使うギアであり、簡単に収納でき、信頼性高く機能するギアほど使用されるものはないと信じているからです。
  problem: ウォータースポーツ用のギアはますます高価で専門的になっています。ハードボードは保管スペースや輸送の手段を必要とします。ウェットスーツは飛行機のチケットと同じくらいの費用がかかります。サーフィンやSUPに、二重抵当やギアでいっぱいのガレージが必要であってはいけません。
  explanation: 従来のサーフおよびSUPブランドは、まずパフォーマンスを重視し、次にアクセシビリティを考えています。彼らのボードは上級者向けに設計され、保管や輸送、経験をすでに持っていることを前提にプレミアム価格で販売されています。Paddle Board Overstockは異なる問いから始まりました：もし私たちが現実世界での使いやすさ—携帯性、耐久性、価値—を優先しつつ、真のパフォーマンスも提供するギアを作ったらどうなるでしょうか？その答えは、特化した製品ラインでした：バックパックに収納できる軍用グレードのdrop-stitchPVCを使用したインフレータブルボード、そして中価格帯で提供されるプレミアム機能（GBS縫い目、サーマルライニング）付きウェットスーツです。私たちはすべてを作るわけではありません――私たちは水上スポーツ愛好者の最大数にとって最も重要なものを作ります。
  solution: Paddle Board Overstock は完全なキットを出荷します：ボード、ポンプ、バッグ、リーシュ、修理キット — 水上に出るために必要なすべて。私たちのウェットスーツは、40％高い価格のブランドと同じ建設品質です。私たちは、昨年のギアを陳腐化させるために設計された仕掛け、限定色、年間モデル刷新を避けています。
  recommendation: 各製品カテゴリーに対する私たちのアプローチを見るには、Paddle Board Overstock のコレクション全体を閲覧してください。ブランドに関係なく役立つ実用的なアドバイスとして、サーフボードのサイズガイドやウェットスーツの厚さガイドをお読みください。その後、Paddle Board Overstock のボードを試して、意図的なデザインが生む違いを体感してください。
  faq:
    - q: Paddle Board Overstockの製品はどこで作られていますか？
      a: Paddle Board Overstock のボードとウェットスーツは社内でデザインされており、drop-stitch の構造とネオプレン製衣料の製造を専門とするベトナムおよび中国の認定工場と提携して製造されています。
    - q: Paddle Board Overstockは他のインフレータブルブランドと何が違うのですか？
      a: ほとんどのインフレータブルブランドは、標準のPVCと汎用のdrop-stitchを使用しています。Paddle Board Overstockは、織り込まれたdrop-stitchコアを持つ三重層の軍用グレードPVCを使用しており、業界標準のインフレータブルボードよりも高い剛性と耐パンク性を実現しています。
    - q: Paddle Board Overstockは保証を提供していますか？
      a: はい — すべてのPaddle Board Overstockボードには製造上の欠陥に対する2年間の保証が付いています。ウェットスーツには1年間の保証があります。延長保証オプションはレジで購入可能です。
    - q: Paddle Board Overstockは環境に優しいブランドですか？
      a: 私たちはそれに向けて取り組んでいます。私たちのボードは分解性ではないPVCを使用していますが、交換サイクルを減らすために5+年持つように作られています。私たちのウェットスーツは石灰石ベースのネオプレンを使用しており、石油ベースの代替品よりも環境への影響が少ないです。私たちは認証済みカーボンクレジットを通じて配送の排出量を相殺しています。
