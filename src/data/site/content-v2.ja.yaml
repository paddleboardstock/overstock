- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: インフレータブルボートのメンテナンス：投資を守る
  description: 年間インフレータブルボートのメンテナンスチェックリスト。清掃、UVの保護、縫い目の点検、圧力管理、エンジンの手入れ、PVCおよびHypalonボートの冬季準備。
  definition: ゴムボートのメンテナンスには、清掃、UVの保護、圧力管理、継ぎ目およびバルブの点検、カビ防止、適切なオフシーズンの保管が含まれます。
  tldr: 使用後は必ず海水で洗い流してください。2〜3か月ごとにUV保護剤を塗布してください。外出前には毎回膨張圧を確認してください。月に一度、縫い目、バルブ、トランサムを点検してください。中性洗剤で洗浄してください。オフシーズンは空気を抜いて涼しく乾燥した場所に保管してください。
  problem: あなたはインフレータブルボートを一シーズン使用しましたが、今ではチューブが色あせ、縫い目から水が滲み、トランサムがスポンジのように感じられます — すべては日常的なメンテナンスで防ぐことができます。
  explanation: UV 放射線はポリマーマトリックスを劣化させます。海水は折り目で結晶化し、布地を擦り減らします。湿気のこもった場所にはカビが生えます。不適切な圧力は素材の疲労を引き起こします。トランサム（特に合板）は、ネジ穴を通して水を吸収します。
  solution: '使用後は毎回: 真水で洗い、乾かし、圧力を確認します。毎月: チューブをUVプロテクタントで拭き、継ぎ目を点検し、バルブを確認します。毎年: 徹底的に清掃し、船尾板の腐敗を点検し、バルブに潤滑剤を塗布し、微小漏れをテストします。'
  recommendation: 303エアロスペースプロテクタントをPaddle Board Overstockボートチューブに使用してください。バルブを取り外し、毎年シリコングリースを塗布してください。乾燥剤入りのキャリーバッグに保管してください。
  faq:
    - q: 膨張式ボートを掃除するのに漂白剤を使ってもいいですか？
      a: いいえ — 漂白剤は生地のコーティングを傷めます。やさしい石鹸とぬるま湯を使ってください。カビの場合は、薄めた白酢を使用してください。
    - q: UVプロテクタントはどのくらいの頻度で使用すべきですか？
      a: 使用シーズン中は2～3か月ごと。熱帯気候ではより頻繁に。
    - q: 使用の間にボートの空気を抜く必要がありますか？
      a: 毎週使用する場合はそうではありません。UVカバーを付けたまま膨らませて置いてください。月単位の間隔の場合は、空気を抜いて保管してください。
    - q: トランサムはどのように維持しますか？
      a: ボルトは毎月点検してください。露出した木の端は毎年マリンバニッシュで保護してください。柔らかい部分ができた場合は交換してください。
