- slug: understanding-tides
  category: guide
  type: technical
  title: ウォータースポーツのための潮の理解：実践ガイド
  description: 潮の満ち引きがSUP、サーフィン、カヤックの状況にどのように影響するか。潮汐表の読み方、大潮と小潮の理解、安全のために潮の動きに合わせてセッションを計画する方法。
  definition: 潮は、月と太陽の引力によって引き起こされる海水位の日々の上昇と下降です。潮位差は場所や月の周期によって異なります。
  tldr: ほとんどの場所では、毎日二回の高潮と二回の低潮があります。大潮（満月/新月）は潮位の変化が大きく、潮流も強くなります。小潮（上弦/下弦の月）は潮位の変化が小さくなります。潮は水の深さ、波の形、潮流の強さに影響します。SUPの場合は、戻るときに助けになるように最初に潮に逆らって漕いでください。
  problem: 地元のブレイクに着くと、ほとんど波がなく、引き潮による危険なリップがあったり、水が浅すぎたりします。潮の流れを理解していなければ、無駄な遠征をしたり、危険な状況でパドリングしたりしてしまいます。
  explanation: 潮汐は月の重力によって引き起こされます。大潮（満月と新月）は最も高い高潮と最も低い干潮をもたらします。小潮（半月）は潮位の変化が最小です。潮流は中潮のときに最も速く、高潮と干潮のときには緩やかです。潮位の変化の範囲は、地中海で0.3m、ファンディ湾で16mまでさまざまです。
  solution: 毎回のセッションの前に潮の表を確認してください。サーフィンの場合：ビーチブレイクは満潮の前後2〜3時間が最も良く機能することが多いです。SUPの場合：前半は流れに逆らってパドルし、帰りは流れに助けてもらいます。釣りの場合：干満の上げ潮は魚をフラットに押し上げます。
  recommendation: NOAAの潮汐予測や地元の潮汐アプリを使用してください。1か月間条件を記録して、地元のブレイクの潮の好みを学びましょう。
  faq:
    - q: 大潮とは何ですか？
      a: 春の潮は、満月と新月の時に発生し、より高い満潮とより強い潮流を生じます。これらは月に二回発生します。
    - q: 小潮とは何ですか？
      a: 小潮は半月の時に起こります。潮の干満の差は小さく、潮流も弱いため、初心者に適しています。
    - q: 干潮はSUPにとって危険ですか？
      a: 干潮は岩や礁を露出させることがあります。また、波のエネルギーをより急な砂州に集中させます。
    - q: 潮の干満はリップカレントにどのように影響しますか？
      a: 干潮（退潮）は離岸流を強めます。満潮（干満潮の満ち）は離岸流の強さを弱めます。
