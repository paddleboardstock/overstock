- slug: sup-pump-guide
  category: guide
  type: buying-guide
  title: SUP ポンプガイド：手動ポンプと電動ポンプ
  description: SUPポンプの完全ガイド — 手動の二重室型、単一室型、電動ポンプ。ニーズに最適なポンプの選び方、メンテナンスのヒント、空気入れの方法。
  definition: SUPポンプは、インフレータブルパドルボードを所定の圧力（通常15〜20PSI）まで膨らませるために使用される装置です。種類には手動のシングルチャンバー、手動のデュアルチャンバー、電動ポンプがあります。
  tldr: 二重チャンバーマニュアルポンプは高品質なiSUPsの標準であり、シングルチャンバーの2倍の速さで空気を入れることができます。電動ポンプは労力なしで膨らませることができますが、バッテリーを必要とし、最大PSI付近では膨らませる速度が遅くなります。マニュアルポンプはより信頼性が高く、バッテリーを必要としません。信頼性を重視するなら二重チャンバーマニュアルを、便利さを重視するなら電動を選んでください。
  problem: あなたのSUPを膨らませるのに時間がかかりすぎるか、努力が多すぎます。低品質のポンプは膨張作業を面倒なものにし、気軽なパドリングのセッションを妨げます。
  explanation: シングルチャンバーポンプはダウンストローク時のみ空気を移動させます — SUP を膨らませるのに10〜15分かかります。デュアルチャンバーポンプは、初期膨張（ボードを満たす）で両方のチャンバーを使用し、最終的な圧力では高圧の単一チャンバーに切り替えます。これにより膨張時間は3〜5分に短縮されます。電動ポンプは12V電源を使用し自動で膨らませますが、圧力が上がると速度が大幅に遅くなります。
  solution: ほとんどのユーザーにとって、付属の二重チャンバーポンプは、速度、信頼性、およびバッテリーに依存しないことのバランスが最も優れています。もしあなたが頻繁にSUP使用する場合や身体的な制限がある場合は、電動ポンプを検討してください。主に電動ポンプを使用する場合でも、必ず手動ポンプをバックアップとして携帯してください。
  recommendation: すべてのボードに付属しているPaddle Board Overstock二重チャンバーポンプは優れており、4分以内に15PSIまで膨らませることができます。バルブに潤滑油を塗り、圧力計を毎年確認してください。
  faq:
    - q: 手動と電動、どちらのほうが速いですか？
      a: 手動の二重チャンバーポンプ（3～5分）は、電動ポンプ（5～10分）よりも速いことが多いです。なぜなら、電動ポンプは高圧になると著しく遅くなるからです。
    - q: 私のSUPに車のタイヤポンプを使えますか？
      a: いいえ — 空気入れは非常に高い圧力で低い容量を移動させます。SUPポンプは中程度の圧力で高い容量が必要です。
    - q: ポンプがメンテナンスを必要とするのはいつか、どうやってわかりますか？
      a: もしポンピングがいつもより難しいと感じる場合、圧力が最大 PSI に達する前に横ばいになったり、ゲージの表示が不安定な場合は、Oリングとバルブの接続を確認してください。
    - q: 電動ポンプはボードを傷つけますか？
      a: 設定圧で自動停止機能がある場合は問題ありません。最大 PSI を超えてポンプを連続運転すると drop-stitch のねじが損傷する可能性があります。
