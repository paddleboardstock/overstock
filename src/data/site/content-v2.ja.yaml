- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: ウェットスーツの修理：裂け目、縫い目、ジッパーを自分で直す
  description: ネオプレンの破れ、縫い目の分離、ジッパーの詰まり、膝パッドの裂けのためのDIYウェットスーツ修理ガイド。ネオプレンセメントを使用したステップバイステップの手順。
  definition: ウェットスーツの修理には、損傷部分の清掃と荒らし、ネオプレン接着剤の塗布、圧力下での硬化が含まれ、水密性と柔軟性を回復します。
  tldr: 1インチ未満の小さな裂け目：両面にネオプレン接着剤を塗り、10～15分間、ねばねばするまで待ちます。しっかり押さえ、重しの下で12時間硬化させます。より大きな裂け目にはネオプレンパッチが必要です。ジッパーの問題：まず潤滑し、その後布地の詰まりを確認します。
  problem: あなたのウェットスーツには小さな裂け目、ほつれた縫い目、または引っかかるジッパーがあります。DIYで修理しなければ、修理にかかる費用が$5であるのに、交換には$150+を支払うことになります。
  explanation: ネオプレン用接着剤は、ネオプレンの表面を柔らかくすることで作用し、溶剤が蒸発する際に化学結合を作ります。接着剤は両方の表面に塗り、接着前に粘着性が出るまで待つ必要があります。裂け目の場合は、縁を正確に合わせる必要があります。ジッパーの問題は、多くの場合、塩による腐食や歯に布地が挟まることが原因です。
  solution: '裂け目の場合: アルコールで清掃し、軽くサンドペーパーをかけ、両端に薄いセメント層を塗り、粘着性が出るまで待ってから、完璧に押し合わせ、重しを置き、12～24時間硬化させる。パッチの場合: 裂け目より1インチ大きくパッチを切り、両方にセメントを塗り、クランプする。ファスナーの場合: すすぎ、ファスナーワックスを塗り、優しく操作する。'
  recommendation: ギアバッグにPaddle Board Overstockのウェットスーツ修理キットを入れておきましょう。大きな修理や重要な箇所の縫い目の破損には、専門的な修理をおすすめします。
  faq:
    - q: ウェットスーツに瞬間接着剤を使えますか？
      a: いいえ — スーパーグルーは硬くてもろく乾きます。ウェットスーツの修理には、ネオプレン用接着剤かアクアシールだけを使用してください。
    - q: ネオプレン接着剤の修理はどのくらい持ちますか？
      a: 適切に行われた修理は、元のネオプレンよりも強くなることが多く、スーツの残りの寿命まで持ちます。
    - q: 完全に分離したジッパーを修理できますか？
      a: トラックがネオプレンから剥がれている場合は、接着セメントで再接着してください。歯が損傷している場合は、ファスナーを専門的に交換してください。
    - q: ウェットスーツの縫い目からの漏れはどう直せばいいですか？
      a: 漏れている継ぎ目の内側にアクアシールを薄く塗布し、24時間硬化させます。
