- slug: sup-self-rescue
  category: guide
  type: safety
  title: SUP 自己救助：深い水でボードに戻る方法
  description: すべてのSUPパドラーはセルフレスキューを習得するべきです。深い水でボードに再び乗る方法、岸まで引き寄せる方法、リーシュの絡まりの対処法をステップごとに解説します。
  definition: SUP セルフレスキューとは、パドルボードから落ちた後の深い水中での再乗艇の技術であり、ボードの回収、体の再乗艇、パドルの回収を含みます。
  tldr: 転倒後：落ち着いて、パドルを握ったまま、水上ボードに向かって泳ぎます。パドルをボードの上に置きます。ドルフィンキックで胸をボードに乗せます。片方の足を上げ、その後もう一方の足を上げます。まず膝をつき、次に立ち上がります。落ち着いた水で練習し、筋肉の記憶になるまで繰り返します。
  problem: あなたは深い水の中でSUPから落ち、戻ることができません。ボードは滑りやすく、あなたは疲れており、パニックが起こります。自己救助の技術を知らなければ、単純な転倒が危険なものになります。
  explanation: セルフレスキューには3つの段階があります：回復（ボードまで泳ぎ、パドルを使う）、再乗艇（ボードに戻る）、継続（パドリングを再開する）です。重要な技術は、パドルを安定装置として使い、強力な足のキックで上半身をボードに押し上げることです。
  solution: ステージ1：ボードまで泳ぎます。パドルを持ったままにするか、取り戻します。ステージ2：パドルをボードに対して垂直に置きます。胸をボードの中央に引き上げながら、足を力強く蹴ります。ステージ3：胸がボードに乗ったら、足を一度に1本ずつ振り上げます。ステージ4：ひざまずき、呼吸を整えた後、ゆっくり立ち上がります。
  recommendation: コントロールされた状況で自己救助の練習をして、考えずにできるようになるまで行ってください。デッキのグリップが良いPaddle Board Overstock SUP Explorer 11を使用してください。悩む場合は、Life Vest Proが追加の浮力を提供します。
  faq:
    - q: 疲れているときにどうやって戻ればいいですか？
      a: 浮くためにボードにとどまってください。脚がうまく蹴れなくても、腕を使って胸をボードに引き寄せてください。立ち上がる前にひざまずいた姿勢で休んでください。
    - q: もしパドルを失くしたらどうしよう？
      a: 腕を使ってボードを岸まで漕ぐ。他のパドラーに助けを求める。失ったパドルはすぐに取り替える。
    - q: 波の中で自力で脱出できますか？
      a: はい — ボードを波に対して垂直に配置します。波の間で再び乗るタイミングを計ります。リーシュがボードを近くに保ちます。
    - q: リードが絡まったとき、どう対処すればいいですか？
      a: 落ち着いて、仰向けに浮かび、リードをゆっくりほどいてください。リードがフィンに巻き付いている場合は、水中でフィンを外す必要があるかもしれません。
