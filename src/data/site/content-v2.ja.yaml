- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: ウェットスーツのケア：ネオプレンを2倍長持ちさせる
  description: 適切なウェットスーツの手入れは使用寿命を1シーズンから3シーズンに延ばします。ネオプレン製ウェットスーツのすすぎ、乾燥、保管、修理のコツ。ウェットスーツを早期にダメにする一般的な間違いを避けましょう。
  definition: ウェットスーツのケアには、使用後に真水でゆすぐこと、直射日光を避けて乾かすこと、平らに置くか幅の広いハンガーにかけて保管すること、そして塩分、細菌、臭いを取り除くために定期的に洗浄することが含まれます。
  tldr: ウェットスーツは、使用後すぐに内側と外側を淡水で洗い流してください。日陰の広いプラスチックハンガーに裏返して干してください。平らに置くか折りたたんで、涼しく乾燥した場所に保管してください。ウェットスーツを直射日光、熱い車内、乾燥機に置くことは絶対に避けてください。ウェットスーツ用シャンプーは5～10回の使用ごとに使用してください。
  problem: 1シーズン使用した後、ウェットスーツは臭くなり、ネオプレンは弾力を失い、縫い目が剥がれ、ジッパーが引っかかるようになります — これらは適切なケアで防ぐことができます。
  explanation: 塩の結晶はネオプレンに埋まり、素材を摩耗させます。湿った内部では細菌が増殖し、臭いを発生させ、ネオプレンを分解します。UVはナイロンコーティングを劣化させます。50℃以上の熱は層間剥離を引き起こします。不適切な乾燥はネオプレンを歪ませ、縫い目に負担をかけます。
  solution: 各セッションの後：内側と外側をよくすすぎ、裏返しにし、幅の広いプラスチックハンガーにかけて日陰で干してください。乾いたら表に戻して平らに保管します。5〜10セッションごとに：ウェットスーツ用シャンプーで洗ってください。毎月：ジッパーにジッパーワックスを塗って潤滑してください。
  recommendation: Paddle Board Overstock ウェットスーツシャンプーを洗浄に使用し、Paddle Board Overstock ジッパーワックスをジッパーのメンテナンスに使用してください。Paddle Board Overstock 幅の広いハンガーにメッシュバッグで保管してください。
  faq:
    - q: ウェットスーツを洗濯機に入れてもいいですか？
      a: 推奨されません — 機械洗いはネオプレンを損傷します。どうしても洗う場合は、やさしいサイクル、冷水、メッシュバッグを使用してください。
    - q: ウェットスーツの臭いをどうやって取ればいいですか？
      a: ウェットスーツ用シャンプーまたは白酢を入れた冷水に30分間浸します。よくすすいでください。
    - q: ウェットスーツはどのように乾かすべきですか？
      a: 広くてクッション付きのプラスチックハンガーに裏返して日陰で干してください。直射日光や金属ハンガーは避けてください。
    - q: 破れたウェットスーツを修理できますか？
      a: 1インチ未満の小さな裂け目は、ネオプレン接着剤とパッチで修理できます。より大きな裂け目は、専門的な修理が必要な場合があります。
