- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: インフレータブルSUPストレージ：iSUPを正しく収納する方法
  description: 適切なインフレータブルSUPの保管は、層剥離、UVの損傷、カビ、バルブの漏れを防ぎます。冬季保管、長期保管、日常保管のdrop-stitchボードのためのヒント。
  definition: インフレータブルSUPの保管とは、ボードをUV、極端な温度、物理的損傷から遠ざけて、清潔で乾燥した温度管理された環境で保管することを意味します。
  tldr: 直射日光を避け、30℃以下の涼しく暗い場所に保管してください。短期間（1～2週間）の場合は、8～10PSIで部分的に膨らませて保管してください。長期保管の場合は、完全に空気を抜き、ゆるく巻いて、保管袋に入れてください。濡れたまま保管しないでください。齧歯類や鋭利な物から遠ざけてください。
  problem: あなたはSUPの空気を抜き、暑いガレージや湿った地下室に押し込んで保管します。3か月後、PVCは黄色くなり、デッキパッドは剥がれ、バルブは漏れます。不適切な保管は通常の使用よりも多くの損傷を引き起こします。
  explanation: 50℃以上の熱はPVC可塑剤を移動させ、材料を硬く脆くします。UV放射線はポリマーの結合を分解します。内部に閉じ込められた湿気がカビを発生させます。氷点下の寒さはPVCを脆くします。きつく折りたたんだことによる圧力点は、永久的なしわを作ります。
  solution: '短期保管: すすぎ、乾燥、10 PSI まで膨らませ、地面から離れた日陰の場所に保管してください。長期保管: しっかり掃除し、完全に乾燥させ、空気を完全に抜き、デッキパッドが外側になるように巻き、袋に入れ、涼しく乾燥したクローゼットに保管してください。化学物質や害虫から遠ざけてください。'
  recommendation: Paddle Board Overstockキャリーバッグを収納に使用してください — UVを遮断し、擦り傷を防ぎます。気候管理された部屋に保管してください。湿度の高い環境では、バッグの中に乾燥剤を入れてください。
  faq:
    - q: 私のSUPをガレージに膨らませたまま保管できますか？
      a: ガレージが30℃以下で直接日光が当たらない場合に限ります。ほとんどのガレージは夏には40℃を超えます。
    - q: 私はSUPをバッグに入れるべきですか？
      a: はい、このバッグはほこり、UV、および物理的な損傷から保護します。ボードをバッグに入れる前に、完全に乾いていることを確認してください。
    - q: 冷凍は膨張式のSUPを損傷する可能性がありますか？
      a: はい。氷点下では、PVCはもろくなり、広げたり膨らませたりすると割れることがあります。常に5℃以上で保管してください。
    - q: 保管するためにSUPをどうやって巻くべきですか？
      a: 底面の保護のためにデッキパッドを外側にして巻きます PVC。きつい折り目は避けてください。毎回折る位置を変えてください。
