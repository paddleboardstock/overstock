  type: safety
  title: SUP ナビゲーション：航路を維持し、道を見つける
  description: SUPカヤック乗りのための基本的な航行スキル — チャートの読み方、ランドマークの使用、ブイシステムの理解、安全なパドリングのためのGPSとコンパスの使用。
  definition: SUPの航法には、目印、チャート、GPS、風や潮流の認識を用いて安全に移動し、出発点に戻ることが含まれます。
  tldr: まっすぐ漕ぐときは、常に地平線上の目印を選びましょう。数分ごとにそれを確認して、流されを修正します。防水ケースに入れたスマートフォンでGPSアプリを使用します。基本的なコンパスナビゲーションを学びましょう。横方向のブイシステム（赤は右、帰航時は右）を理解します。陸上の誰かにフロートプランを提出しましょう。
  problem: あなたは沖に漕ぎ出しますが、振り返ると海岸線がまったく違って見えます。航法のスキルがなければ、方向感覚を失い、間違った方向に漕いでしまうことがあります。
  explanation: SUPでのナビゲーションは、水の近くにいるため視覚的な参照に頼ります。出発地点の後ろにある特徴的なランドマーク（建物、木、崖など）を選びましょう。それを使って逆方位を取り、戻る際の目印にします。風や潮流によってコースがずれるため、常に修正してください。長距離の移動では、GPSアプリや腕時計を使用しましょう。水上から見た海岸線は陸から見たものとは異なることを理解しておいてください。
  solution: 出発前：出発地点の後ろにある2～3か所のランドマークを識別します。バッテリーを節約するために、GPSアプリ（Googleマップ、Gaia GPS）を機内モードで使用します。風と潮流の方向を把握し、まずは向かい風／向かい流れの方向にパドルします。沖の横断では、コンパスの方位を使用します。
  recommendation: GPSのバックアップ用に電話を防水ケースに入れておく。新しい場所に出かける前に、慣れた水域でランドマークを使ったナビゲーションを練習する。ライフベストプロには電話が入るポケットがある。
  faq:
    - q: SUP ナビゲーションに最適なランドマークは何ですか？
      a: 給水塔、高層ビル、ユニークな木、目立つ崖のような特徴的で永続的な特徴。動く船や旗は避けてください。
    - q: 霧の中でどうやって進むのですか？
      a: 霧の中ではパドルしないでください。霧に巻き込まれた場合は、GPSやコンパスを使って航行してください。30秒ごとにホイッスルを鳴らしてください。岸の近くにいてください。
    - q: SUPのために海図は必要ですか？
      a: 沿岸でのパドリングには、危険箇所、深さ、航路を特定するのに簡単な海図が役立ちます。多くのアプリがこの情報を提供しています。
    - q: 船の周りをどうやって移動しますか？
      a: 水路から離れて浅い水に留まってください。明るい色の服を着てください。水路は素早く、90度の角度で横断してください。ボートの運転手と目を合わせてください。
