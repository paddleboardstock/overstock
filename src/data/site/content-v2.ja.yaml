- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: SUP パドルガイド：自分のスタイルに合ったパドルの選び方
  description: SUPパドルの完全ガイド — 長さ、素材（アルミニウム、ファイバーグラス、カーボン）、ブレード形状、そしてパドルの選び方が漕ぐ体験にどのように影響するか。
  definition: SUP パドルは、シャフト（アルミニウム、ファイバーグラス、またはカーボン）とブレード（二面、スクープ、または平ら）で構成されています。長さは一般的なパドリングの場合、身長より8～10インチ長いものが適しています。
  tldr: パドルの長さ：オールラウンド用は身長より8〜10インチ長く、サーフ用は6〜8インチ長く、ツーリング用は10〜12インチ長く。素材：アルミ（安価で重い）、ファイバーグラス（中価格帯で適度なしなり）、カーボン（軽量で硬く、高価）。ブレードの形状：ダイヘドラル（安定した直進性）、スクープ（パワー重視）、フラット（多用途）。調節可能なパドルは初心者に最適です。
  problem: ほとんどのiSUPsに付属のパドルは使えますが、重くて効率が悪いです。アップグレードすると漕ぐ効率と楽しさが向上しますが、選択肢が混乱しています。
  explanation: パドルの長さはストロークの効率に影響します — 短すぎると前かがみになり、長すぎると肩が疲れます。素材は重さを決定します：カーボンパドルは18〜24オンス、アルミニウムは28〜36オンスです。ブレードのサイズはパワーに影響します：大きいブレード（100平方インチ以上）は一回のストロークでより多くの推進力を提供しますが、より早く疲れます。ダイヘドラルブレードはまっすぐ進み、スクープブレードはより多くのキャッチを提供します。
  solution: 正しい長さについて：パドルを垂直に立て、腕を上げる — パドルのハンドルが手首に当たるはずです。素材について：中重量のアップグレードとして最初にファイバーグラスを選びます。ブレードについて：一般的な漕ぎのために二面体（ダイヤヘドロン）を選びます。活動について：ツーリング用パドルはブレードが小さく長めで、サーフィン用パドルはブレードが広く短めです。
  recommendation: 28オンスのPaddle Board Overstockカーボンパドルは、頻繁に漕ぐ人にとって最高のアップグレードです。付属の調節可能な3ピースアルミパドルは、初心者や旅行用には十分です。
  faq:
    - q: SUPのパドルはどのくらいの長さにすべきですか？
      a: 身長をインチで測り、オールラウンドのパドリングには8～10インチを加えます。サーフィンには6～8インチを加えます。ツーリングには10～12インチを加えます。
    - q: カーボンパドルはお金の価値がありますか？
      a: 通常のパドラーにははい — 重量の軽減は長時間のセッションでの疲労を大幅に減らします。時々使う場合は、ファイバーグラスがコストパフォーマンスに優れています。
    - q: 調節可能なパドルとは何ですか？
      a: 長さ調節可能な2ピースまたは3ピースのパドルで、ユーザー間で共有したり、さまざまなアクティビティに合わせて調整したりするのに最適です。
    - q: パドルの手入れはどうすればいいですか？
      a: 塩水使用後は淡水で洗い流してください。上を走行したり、直射日光の下で保管したりしないでください。フェルール（接合部）に砂が入っていないか確認してください。
