- slug: surfing-safety-tips
  category: problem
  type: safety
  title: サーフィンの安全：初心者の事故の90％を引き起こす7つの間違い
  description: ほとんどのサーフィン事故は防ぐことができます。初心者が犯しやすい7つの重大な安全ミス、パドルを出す前にリップカレントを見分ける方法、命を救う装備のチェック方法を学びましょう。
  definition: サーフィンの安全とは、リップカレント（海へ流れる水の通路）を理解すること、一人でサーフィンをしないこと、各セッション前に装備を確認すること、そして自身の技術レベルに合った条件で行うことを意味します。ほとんどの事故は基本的な知識で防ぐことができます。
  tldr: パドルアウトする前に、サーフィンのコンディションと天気を確認してください。リップカレントの見分け方を学びましょう — それは、割れる波の間にある落ち着いた暗い水路のように見えます。決して一人でサーフィンせず、いつもビーチで準備運動を行い、毎回のセッション前にリーシュとボードに損傷がないか確認してください。
  problem: 海は魅力的に見えますが、初心者には見えない危険を隠しています。離岸流は沖へ引っ張り、浅い砂州は日ごとに変わり、リーシュは最悪のタイミングで切れることがあります。基本的な安全知識がなければ、楽しいセッションが緊急事態に変わります。
  explanation: 離岸流はサーフィン救助の主な原因です。波によって岸に押し寄せられた水が、水路を通って沖に流れ戻るときに形成されます。離岸流は人を水中に引き込むのではなく、沖に引っ張ります。重要なのは落ち着いて、離岸流から抜けるまで海岸と平行に泳ぎ、その後割れる波に乗って戻ることです。離岸流以外にも、サーファーは他のサーファーや自分のボードとの衝突、冷たい水での低体温症、ウォームアップせずにパドリングすることで起こる筋肉の痙攣などの危険に直面します。
  solution: 水に入る前にビーチで10分過ごしましょう：波のパターンを観察し、どこにリップができているかを確認し、安全な入り口を選んでください。肩、背中、脚をストレッチしましょう。リーシュの取り付けを確認し、ボードのレールに鋭い欠けがないことを確認してください。出口の計画を明確にしてパドルアウトし、ランドマークに対する自分の位置に注意を払いましょう。
  recommendation: 初めてのサーフィンの前に、サーフィンの安全コースを受講するか、海の安全基本ガイドを読みましょう。笛を持ち、友達と一緒にサーフィンをしてください。状況に自信がなければ、海に出ないでください — 波は明日もそこにあります。
  faq:
    - q: もし離岸流に巻き込まれたらどうすればいいですか？
      a: 落ち着いて、エネルギーを節約し、流れに逆らわないでください。浜辺に平行に（海岸線に沿って）泳ぎ、リップカレントから出たら、波を使って戻ってください。必要であれば、片腕を上げて助けを求めてください。
    - q: 離岸流をどうやって見分けますか？
      a: 砕ける波の間で、より穏やかで暗い水の流れを探してください。海へ向かって動く泡や漂流物、あるいは波のラインにできた隙間もリップの兆候です。かき混ぜられた砂で変色した水も別のサインです。
    - q: 一人でサーフィンするのは安全ですか？
      a: サーフィンをする際は、少なくとももう一人と一緒に行く方が常に安全です。もし一人でサーフィンをする場合は、穏やかなブレイクを選び、陸にいる誰かに行き先を伝え、自分の限界内で行動してください。電話は防水ケースに入れて持ち歩きましょう。
    - q: どうやって自分のボードが誰かに当たらないようにしますか？
      a: 波の間にボードを手放さないでください — いつも片手をボードに置いておきましょう。転んだ場合は、頭を守り、体を丸めてください。怪我のリスクを最小限にするため、最初の1年はPaddle Board Overstockのようなソフトトップまたはインフレータブルのボードを選びましょう。
    - q: いつサーフィンに行くべきでないですか？
      a: 波が自分の技術レベルを超えている場合、流れの警告が出ている場合、雷がある場合、過度に疲れている場合、またはアルコールを摂取している場合はサーフィンをしないでください。自分の限界を知り、海を尊重しましょう。
