- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: SUP リーシュガイド：ストレートリーシュとコイルドリーシュの違いを解説
  description: リードの完全なガイド SUP — ストレートかコイルか、足首かふくらはぎか、クイックリリースの選択肢、そして自分のパドリング環境に合ったリードの選び方。
  definition: SUP リーシュとは、パドラーをボードに接続し、分離を防ぐコードのことです。種類には、ストレートリーシュ（サーフィンや川用）や、コイルリーシュ（フラットウォーター用）があります。
  tldr: コイルリードは、穏やかな水面やフィットネスパドリングに最適です — ボードから離れて水につかないままでいられます。ストレートリードはSUPサーフィンや川で使用するもので、より自由が利き、引っかかりません。快適さのために足首よりもふくらはぎへの装着が好まれます。川でのパドリングでは、閉じ込めを防ぐためにクイックリリースリードが重要です。
  problem: あなたはSUPと一緒にリーシュを購入しましたが、自分のパドリングスタイルに合っているかどうかはわかりません。間違ったリーシュは、必要なときに引っかかったり、絡まったり、故障したりします。
  explanation: ストレートリーシュは、ボードの後ろに引きずられるシンプルなナイロンまたはポリウレタンのコードです。フィンに引っかかりにくいため、サーフィンでうまく機能します。コイルリーシュは、緊張していないときに収縮する螺旋状のコードです — パドル中はデッキ上で巻かれ、転倒すると伸びます。平らなコンディションではリーシュを水中から保ち、抵抗を減らします。
  solution: 平水、フィットネス、ツーリングにはコイルリードを選んでくださいSUP。抵抗が少ないため、速度を維持しやすく、水中の障害物に引っかかるのを防ぎます。SUPサーフィンや川でのパドリングにはストレートリードを選んでください。直線的なデザインは、フィンや障害物に引っかかりにくくなっています。
  recommendation: Paddle Board Overstock SUP パッケージには、ボードの使用目的に適したリーシュタイプが含まれています。SUP Explorer 11 パッケージのコイルリーシュは、あらゆるパドリングに最適です。
  faq:
    - q: リードは足首に付けるべきですか、それともふくらはぎに付けるべきですか？
      a: パドリング中にリードを水に入れず、歩くときのつまずきの危険を減らすため、SUP にはふくらはぎへの装着が推奨されます。
    - q: SUPのリードはどのくらいの長さにすべきですか？
      a: フラットウォーターでは8〜10フィート、サーフでは6〜8フィート。短いリーシュは抵抗を減らすが、ボード上での自由な動きを制限する。
    - q: 川に行くためにクイックリリースのリードは必要ですか？
      a: はい — 川SUPでは、ストレーナーに挟まれないように、すぐに取り外せるクイックリリース式のリーシュまたはベルトが必要です。
    - q: SUPにサーフリーシュを使うことはできますか？
      a: サーフ用リーシュは短くて細いです。SUP サーフィンには使えますが、長いコイル式リーシュの方が適しているフラットウォーターパドリングには理想的ではありません。
