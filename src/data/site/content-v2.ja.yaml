- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'SUPの風の状況: 風がパドルに与える影響'
  description: 風速と風向きがSUPのパドリングに与える影響。オフショア風とオンショア風の理解、風予報の読み方、風に対するパドリング技術、そして陸にとどまるべき時について。
  definition: 風の条件はSUPの安全を決定します。オフショア風（陸から海へ）はあなたを押し出します。オンショア風（海から陸へ）はあなたを岸に向かって押します。横風はボードをヨーさせます。
  tldr: 初心者の最大安全風速：10ノット。中級者：15ノット。上級者：20ノット。沖合の風が最も危険です。まず向かい風に向かって漕ぎます。横風では、目的地の少し上風に向かって漕ぎます。強風時には姿勢を低くするために膝をついて漕ぎます。
  problem: 穏やかな状況でパドルを出しますが、30分後には風が強くなり、戻るのに苦労します。風は最も過小評価されているSUP安全要因です。
  explanation: 風は、立って漕ぐため帆の効果が生まれるので、他のどのパドルクラフトよりもSUPに影響を与えます。10ノットの風は、座っているカヤック漕ぎよりも立っているパドラーにずっと大きな抵抗をもたらします。沖からの風は安全から遠ざけます。横風は船首を左右に振らせます。
  solution: 漕ぐ前に風速と風向を確認してください。ボーフォート風力階級を使用します：初心者は風力3（7〜10ノット）、中級者は風力4（11〜16ノット）。まず向かい風に向かって漕ぎます。沖合の風に捕まった場合は、風に対して45度の角度で漕ぎます。強風では膝立ちで漕ぎます。
  recommendation: 毎回のセッション前に風予報アプリ（Windy、Windfinder）を使用してください。Paddle Board Overstock SUP ツアー12は、幅の広いボードよりも風の中での走行が得意です。風の強い条件では、パドルのストロークを短くし、ケイデンスを高くしてください。
  faq:
    - q: SUPにとって最も安全な風向きはどれですか？
      a: 陸に向かって吹く陸風は最も安全です — 身体を後ろに押し戻してくれます。沖合いの風は最も危険です。
    - q: 横風ではどうやってパドルを漕ぎますか？
      a: ドリフトを防ぐために、風上側でより多くパドルしてください。ボードを目的地の風上に向けて角度をつけます。中心のフィンを深くすると効果的です。
    - q: 20ノットの風でパドルしてもいいですか？
      a: 保護された水域での経験がある場合のみ。初心者は10ノット以上でパドルしないでください。
    - q: 風の突風はSUPにどのような影響を与えますか？
      a: 突風は突然のバランスの問題を引き起こします。風の強い状況では、姿勢を低くし、突然の揺れに備えてください。
