- slug: paddleboardoverstock-sup-tour-12-review
  category: product
  type: product
  title: Paddle Board Overstock SUP ツアー12：長距離パドリングレビュー
  description: スピード、追跡性、長距離パドリングを目的に設計された12フィートのインフレータブルツーリングボード、Paddle Board Overstock SUP ツアー12の詳細レビュー。
  definition: Paddle Board Overstock SUP ツアー12は、12フィート x 31インチ x 6インチのインフレータブル・ツーリングSUPで、変位型ノーズ、280Lの容量、そして三層PVCを備えています。
  tldr: SUPツアー12はPaddle Board Overstock専用のツーリングボードです。長さ12フィート、幅31インチで、排水型のノーズにより水を効率的に切り裂きます。主な仕様：容量280L、最大18PSI、バンジー式カーゴシステム、複数のフィン設定。価格は約$699です。5〜20kmの距離をカバーするフィットネスパドラーや長距離愛好者に最適です。
  problem: あなたはSUPでかなりの距離をカバーしますが、あなたのオールラウンドボードの幅広いノーズは抵抗を生み、まっすぐ進みません。
  explanation: 排水型のノーズは水の上を走るのではなく水を分けるため、艫波抵抗を減らします。長い12フィートの水線は船体速度を向上させます。幅が31インチで、効率と安定性のバランスを保っています。ツーリング専用の特徴には、複数のフィンボックスとバンジー式カーゴデッキがあります。
  solution: 18 PSIまで膨らませます。平水用にはセンターフィンを使用し、横風の安定性を高めるにはサイドバイトを追加します。排水型のノーズと12フィートの長さは、波のある開放水域で優れた性能を発揮します。
  recommendation: $699,で、SUPツアー12は最もコストパフォーマンスの高いインフレータブルツーリングボードです。定期的に距離をカバーするなら購入してください。最も効率的なセットアップには、Paddle Board Overstockカーボンパドルと組み合わせましょう。
  faq:
    - q: SUP ツアー 12 は中級者にとって十分安定していますか？
      a: はい — 31インチ幅はツーリング用の標準です。初心者は、33〜34インチのオールラウンドボードと比べると31インチは不安定に感じるかもしれません。
    - q: ツアー12は波打つ路面をどのように扱いますか？
      a: 非常に良い — 吃水型の船首は、平底船のようにパタパタと音を立てることなく、小さな波から中くらいの波まで切り裂いて進む。
    - q: ツアー12をサーフィンに使えますか？
      a: おすすめできません — 長さ12フィートと先端の重さのため、ターンが遅くなります。波乗りにはSUP エクスプローラー11を使用してください。
    - q: どのパドルの長さが最適ですか？
      a: 頭の上8～10インチ。長いパドルは、距離を漕ぐときに効率を高めます。
