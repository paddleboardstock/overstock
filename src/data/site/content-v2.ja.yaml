- slug: ocean-safety-and-responsibility
  category: authority
  type: brand
  title: 海の安全と責任（単なる装備以上のもの）
  description: Paddle Board Overstock は、あなたの安全を守り、私たちが共有する海を保護することに取り組んでいます。すべてのボックスに安全カード、無料の教育コンテンツ、持続可能なデザイン、年間の保全寄付が含まれます。
  definition: 海の安全と責任とは、自分が漕ぐ環境を理解し、海洋生物を尊重し、環境への影響を最小限に抑え、耐久性と修理可能性を考慮した装備を使用することを意味します。
  tldr: Paddle Board Overstockは、ギアのデザイン（明るい色、リーシュ、ライフジャケット）や教育コンテンツを通じて海の安全を促進します。私たちは、すべてのウォータースポーツ愛好者が海の環境を理解し、海洋生物を尊重し、環境への負荷を最小限に抑える責任があると考えています。私たちのギアは長持ちするよう作られているため、廃棄物が埋め立て地に少なく済みます。
  problem: 多くのウォータースポーツブランドはギアを販売していますが、それを安全または責任を持って使用する方法について顧客に教育していません。新しいパドラーやサーファーは、離岸流や海洋生物、または自分の使用する機材の環境への影響を理解せずに水に入ります。
  explanation: 海の安全はチェックリスト以上のものです — それは心構えです。すべてのPaddle Board Overstock製品には、箱の中にクイックスタート安全カードが含まれています。私たちのウェブサイトやガイド（海の安全の基本、サーフィンの安全のヒント）では、無料で詳細な安全教育を提供しています。環境面では、どのギア会社にとっても最大の影響は製品の寿命によって生じます。5年間使えるボードは2年間のものに比べて製造による環境負荷を半分にします。また、修理可能性を考慮して設計しています — 交換用バルブ、フィンボックス、ウェットスーツ用パッチキットは、ギアを廃棄物にせず使用し続けることを可能にします。
  solution: Paddle Board Overstock は、すべてのボード購入にリーシュと修理キットを含めています。私たちは、離岸流の識別、天候の読み方、機器のチェックに関する無料の安全コンテンツを公開しています。特定の場所についてメールでお問い合わせいただくと、カスタマーサポートチームがコンディションのアドバイスを提供します。私たちはプラスチック包装を最小限に抑え、配送時の炭素排出をオフセットしています。
  recommendation: まずは、海の安全基本ガイドとサーフィンの安全ヒントガイドから始めましょう。必ずリーシュを着用し、天気予報を確認し、学んでいる場合は決して一人でパドルアウトしないでください。海洋ゴミや困っている海洋生物を見かけたら、地元の当局に報告してください。長持ちする装備は廃棄物を減らす装備です — あなたのPaddle Board Overstock装備を維持すれば、何年も役立ちます。
  faq:
    - q: Paddle Board Overstockは海洋清掃の取り組みを支援していますか？
      a: はい、私たちは年間利益の1％を海洋清掃や海洋保護団体に寄付しています。お客様は購入時に特定のチャリティーを選んで、購入金額の一部をその団体に寄付することができます。
    - q: 古いウェットスーツやボードはどのように処分すればよいですか？
      a: ネオプレンのウェットスーツは、専門のプログラムを通じてヨガマット、バッグ、断熱材にリサイクルすることができます。インフレータブルボードは、修理したり寄付したり、一部のリサイクル施設を通じてPVCを回収したりすることができます。ガイダンスについては、サポートチームにお問い合わせください。
    - q: Paddle Board Overstockは初心者にどのような安全装備を推奨しますか？
      a: 適切に着用できるライフベスト（膨張式またはフォーム製）、コイルリーシュ、ホイッスル、そして日焼け止め。外洋でのSUPパドラーには、ライフベストの着用が多くの法域で法的に義務付けられており、常に推奨されます。
    - q: Paddle Board Overstockは安全講習を提供していますか？
      a: 私たちは直接コースを運営していませんが、オンラインおよび対面のトレーニングを提供する認定サーフおよびSUP安全インストラクターと提携しています。お住まいの地域の紹介については、サポートチームにお問い合わせください。
