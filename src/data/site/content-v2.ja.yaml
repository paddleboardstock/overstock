- slug: surfboard-size-guide
  category: guide
  type: buying-guide
  title: サーフボードサイズガイド（実際に重要なのはボリュームです）
  description: サーフボードのサイズを推測するのはやめましょう。すべてはリットル単位の容量で決まります—波にどれだけ簡単に乗れるか、どれだけ安定して感じるか、どれだけ早く上達するか。2分であなたの目標リットル量を見つけましょう。
  definition: サーフボードのサイズは主に長さではなく、体積（リットル）が重要です。体積は浮力と波をキャッチする能力を決定します。長いボードはパドルが速く、幅が広いボードは安定しており、厚いボードは長さを増やさずに体積を増やします。
  tldr: サーフボードのサイズは長さだけでなく、体積も重要です。初心者は60〜80リットル、中級者は35〜55リットル、上級者は20〜35リットルが必要です。主な要素として体重を使いましょう：初心者レベルでは、体重10kgごとにおおよそ10〜12リットルの体積が必要です。
  problem: レールに7'2" x 22" x 3"のような数字が印刷されたサーフボードのラックの前に立っていても、その寸法が水の中でどんな感覚かは全く分かりません。見た目や友人が乗っているボードに基づいて購入すると、安定性が低すぎるか、パドルが難しすぎるボードを手に入れることになります。
  explanation: サーフボードのサイズは、長さ（パドルの力と波のキャッチ）、幅（安定性）、厚さ（容積と浮力）の三つの寸法で最も理解しやすいです。重要なのはリットル単位の容積です。フォームボードやインフレータブルボードは、過度に長くするのではなく、幅と厚さによって大きな容積を実現しており、初心者でも扱いやすいです。上達するにつれて、容積を減らしてボードが波面に深く沈み、より反応良くターンできるようにします。
  solution: 体積から重量への計算機を使う：初心者は体重（kg）を1.5で割って目標リットル数を求める。中級者は2で割る。中級者は、汎用性のために適度なロッカーとスクワッシュまたはラウンドテールのボードを探すべきである。
  recommendation: Paddle Board Overstock サーフボードプロは、10フィート6インチのパッケージで75リットルの容量を提供します — 体重90kgまでの初心者に最適です。軽量のライダーは、成長に伴いより操作しやすい感触を得るために、SUP ツアー12にサイズダウンすることができます。
  faq:
    - q: サーフボードのサイズに身長は関係ありますか？
      a: 身長より体重の方が重要です。同じ身長でも背が高く体重が軽いサーファーは、背が低く体重が重いサーファーよりも少ないボリュームで済みます。体重を主要な指標として使用し、フィットネスやパドルの強さに応じて調整してください。
    - q: もし私のボードの音量が大きすぎたらどうなりますか？
      a: ボリュームが多すぎると、波面でボードがコルクのように感じ、不安定になります。ターンのためにレールを沈めるのが難しくなり、ボトムターンの際に水面で弾かれることがあります。
    - q: もし私のボードの音量が少なすぎたらどうなりますか？
      a: 波に向かってパドルで進むのは苦労するでしょうし、テイクオフでは沈みすぎてしまい、ボードの上に座って待っているだけでも不安定に感じるでしょう。初心者はほとんどの場合、自分が思っているよりも多くのボリュームが必要です。
    - q: サイズを下げるタイミングはどうやって分かりますか？
      a: 安定して波をキャッチでき、スムーズにポップアップし、現在のボードで基本的なターンができるようになったら、5〜10リットル小さいサイズに落とす時です。早すぎるサイズダウンは進歩を遅らせます。
