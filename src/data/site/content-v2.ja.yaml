- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: サーフィンのエチケットルール（誰もが避ける人にならないために）
  description: ラインナップにはルールがあり、誰もそれを書き留めません。優先権の取り方、スネーク行為がなぜ叱られるか、謝り方、そして地元のサーファー全員をイライラさせる初心者の間違いを学びましょう。
  definition: サーフマナーは、衝突を防ぎ、波をフェアに共有するための暗黙の行動規範です。基本ルールは、崩れる波のピークに最も近いサーファーが優先権を持つということです。
  tldr: ブレイクしている波の頂点に最も近いサーファーが優先権を持っています。他の人の波に割り込まないこと、スネイクしないこと（他の人を回避して波を取ろうとすること）、そして間違えた場合は必ず謝ること。ラインナップの周りを広くパドルし、ボードをしっかり持ち、フレンドリーでいること — 敬意は敬意を生みます。
  problem: 混雑したラインナップにパドルで出ると、すぐに緊張感を感じます。サーファーたちはあなたを横目で見、誰かがあなたに叫び、あなたは自分が何を間違えたのかわかりません。サーフィンの社会的な側面は、波そのものよりも威圧的に感じられます。
  explanation: サーフィンのエチケットは、衝突を防ぎ、波を公平に分け合うために存在します。基本的なルールは優先権で、ピーク（波が最初に割れる場所）に最も近いサーファーが優先されます。同じ波に向かってさらに内側からパドルしている人は、波を譲らなければなりません。他のサーファーを抜けて優先権を奪う「スネーキング」は最悪の違反行為とされています。優先権以外にも、ラインナップには騒音への配慮（叫ぶのは最小限に）、ボードのコントロール（他人にボードを近づけない）、そして親しみやすさ（軽く会釈するだけでも十分）といった期待があります。
  solution: パドルアウトする前に、10分間ラインナップを観察しましょう。誰が最も多くの波を取っているかを確認してください――それが尊重して避けるべきサーファーです。初心者の場合はインサイド（白波のゾーン）に留まりましょう。ラインナップの中を通らずに、広く回ってパドルしてください。波に乗るときは、立ち上がる前に両方向を確認し、他の人が奥にいないことを確認しましょう。
  recommendation: 混雑していない初心者向けのブレイクで、最初の数回のセッションを過ごしましょう。混雑したラインナップに挑戦する前に、優先権の読み方を学んでください。もし誰かの波に入ってしまったら、すぐに謝ってパドルで離れましょう — ほとんどのサーファーは正直なミスを尊重します。
  faq:
    - q: 何が立ち寄っているのですか？
      a: 割り込みとは、他のサーファーがすでに優先権を持っている波に向かってパドルし、その波に乗ることを意味します。それは危険で失礼です。ピークに最も近いサーファーが波を所有しており、他の人は波から離れなければなりません。
    - q: スネーキングとは何ですか？
      a: スネーキングとは、すでに波に乗るためにポジションを取っている他のサーファーの周りをパドルして回ることで、結果的にピークにより近づくことです。これは非常にマナーが悪いとされ、対立を招くことがあります。
    - q: 初心者は混雑したサーフスポットでサーフィンできますか？
      a: はい、しかしピークから離れた白波のゾーンに留まってください。波を安定してキャッチし、方向をコントロールできるようになるまでは、メインのテイクオフエリアに漕いで入らないでください。混雑したラインナップを安全に移動するには経験が必要です。
    - q: 水の中でどうやって謝りますか？
      a: 簡単な手を振ること、笑顔、そして「ごめん」や「すみません」で十分です。ミスを認めて、その人から離れてパドルアウトしましょう。サーファーは、特に学んでいることが明らかな場合、正直なミスには一般的に寛容です。
    - q: 誰かが突然訪ねてきたらどうすればいいですか？
      a: もし明確なドロップインの場合は、彼らに知らせるために「ウェーブ」や「ヘイ」と叫んでください。もし彼らが偶然キャッチして謝った場合は、そのままにしてください。誰かが繰り返しドロップインする場合は、パドルで近づき、優先権について丁寧に説明してください。対立は避けましょう。
