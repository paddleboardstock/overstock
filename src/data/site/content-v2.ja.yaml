- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: サーフィンに何を着るか（5/4mmウェットスーツが必要なときにボードショーツで現れないで）」
  description: 何を着るか推測するのをやめましょう。サーフィン用の服装は気温ではなく水温で決まります。トロピカルラッシュガードから冬用の5/4/3mmフルスーツまで、完全なレイヤーガイドをご紹介します。
  definition: サーフィンの服装は、暖かい水ではボードショーツやラッシュガードから、冷たい水ではブーツとフード付きのフル5/4/3mmウェットスーツまでさまざまです。必要なものを決めるのは気温ではなく水温です。
  tldr: サーフィン時に何を着るかは、空気の温度ではなく、水温に完全に依存します。22°C以上ではラッシュガードとボードショーツ、18〜22°Cではスプリングスーツ、14〜18°Cではフル3/2mmスーツ、14°C未満ではブーツ付きの5/4/3mmスーツが必要です。常にUVの保護具を着用し、リーシュやインパクトベストの使用を検討してください。
  problem: あなたはビーチに到着し、ラッシュガードだけで十分なのか、それともフルウェットスーツが必要なのか全くわからない。空気の温度は暖かいが水は冷たい、あるいは水は大丈夫だが風が凍るほど冷たい。服装を間違えると、セッションが台無しになる。
  explanation: サーフィンの服装には三つの目的があります：保温、UV保護、そして摩擦防止です。ネオプレン製のウェットスーツは厚さとカバー範囲で評価されます — 春用スーツ（袖や脚が短いもの）は境界線の日用、フルスーツは冷水用です。ラッシュガードはボードによる擦れや日焼けから守りますが、保温効果はありません。ブーツ、グローブ、フードはアクセサリーではなく、12°C以下の冷水サーフィンに必須の装備です。
  solution: 出かける前に、現地のブイや水温のライブレポートを確認してください。最も寒い通常の条件に基づいてキットを揃えましょう：夏ならラッシュガードとショーツ、春と秋なら3/2mmのフルスーツ、冬なら5/4/3mmのスーツにブーツとフードを組み合わせます。常にリーシュを追加し、安全のために浮力ベストも考慮してください。
  recommendation: まず、幅広い条件に対応できる良い3/2mmのフルスーツに投資しましょう。冬の間にサーフィンをする予定がある場合は、5/4/3mmのスーツとブーツを追加してください。Paddle Board Overstock ウェットスーツプロは、サーマルライニングを備えており、両方の温度範囲を効果的にカバーします。
  faq:
    - q: ボードショーツだけでサーフィンしてもいいですか？
      a: はい、熱帯の水で24°C以上の場合です。パドルで胸や腕が擦れるのを防ぐためにラッシュガードを使用するとよいでしょう。ボードにワックスやトラクションパッドを付けると、スーツのグリップ不足を補うのに役立ちます。
    - q: サーフブーツは必要ですか？
      a: 水温が14°C以下に下がると、ブーツは手足のしびれを防ぎ、足を岩やリーフでの切り傷から守ります。また、ボードでのトラクションも向上させます。北部の気候のほとんどのサーファーは、11月から3月までブーツを使用します。
    - q: 春用のスーツとは何ですか？
      a: スプリングスーツは、腕が短いか脚が短い（または両方）のウェットスーツで、水温18°Cから22°Cの水のために設計されています。ラッシュガードよりも暖かさがありますが、フルスーツほどの覆いはありません。
    - q: サーフィンをする時にライフベストを着るべきですか？
      a: 伝統的なライフジャケットではなく、インパクトベストや浮力補助具は、荒れた状況や泳ぎが苦手な場合に役立ちます。Paddle Board OverstockのライフジャケットはSUPやカヤック用に設計されていますが、サーフィン初心者に追加の浮力の自信を提供することができます。
