cards:
  - badge: 'PVC'
    title: 'Seewasserfestes PVC-Material'
    description: 'Mehrschichtig laminierter PVC-Stoff, ausgelegt für marine Umgebungen. Geprüft auf UV-, Abriebs- und Durchstichfestigkeit.'
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
  - badge: 'DS'
    title: 'Drop-Stitch-Kern'
    description: 'Tausende interne Fäden verbinden obere und untere Lage und schaffen so eine steife Hochdruckstruktur bei 12–15 PSI.'
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
  - badge: 'RR'
    title: 'Verstärkte Kantenleiste'
    description: 'Doppellagige verschweißte Kantenleiste schützt vor Stegkratzern, Strandlandungen und Seitenaufprall.'
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
