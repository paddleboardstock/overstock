cases:
  - id: beginner
    title: 'Sporty wodne dla początkujących'
    desc: 'Stabilne deski SUP i kajaki dla osób bez doświadczenia.'
    scenario: >-
      'Rodzina spędzająca weekend nad jeziorem chce spróbować stand-up paddle. Potrzebuje stabilnego sprzętu łatwego do wypuszczenia na wodę z jasnymi wskazówkami bezpieczeństwa.'
    solution: >-
      'SUP Explorer 11 oferuje szeroką, stabilną platformę dla początkujących. Life Vest Classic zapewnia certyfikowaną wyporność CE. Pompa dwutłoczkowa napompuje obie deski w mniej niż 10 minut.'
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 'Odkrywanie na świeżym powietrzu'
    desc: 'Przenośne kajaki i łodzie na rzeki, jeziora i wyprawy przybrzeżne.'
    scenario: >-
      'Pasjonat outdooru planuje tygodniowy spływ rzeczny i potrzebuje łodzi, która pakuje się kompaktowo, nadmuchuje w obozie i radzi sobie ze zmiennym nurtem.'
    solution: >-
      'Kayak Lite mieści się w plecaku i nadmuchuje w mniej niż 4 minuty. Konstrukcja drop-stitch sprawdza się na jeziorach, spokojnych rzekach i przybrzeżnym wiosłowaniu.'
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: 'Operacje profesjonalne'
    desc: 'Komercyjne RIB dla operatorów wycieczek i służb ratunkowych.'
    scenario: >-
      'Przybrzeżny operator wycieczek potrzebuje floty trwałych łodzi do codziennych rejsów w zmiennych warunkach morskich, spełniających komercyjne przepisy bezpieczeństwa.'
    solution: >-
      'RIB 330 i RIB 450 Patrol mają kadłuby z włókna szklanego z głębokim V i pontony z Hypalonu na trwałość w każdą pogodę. Można wdrażać wiele jednostek ze stałymi osiągami.'
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: 'Rodzinna rekreacja'
    desc: 'Przestronne łodzie na jednodniowe wyprawy, wędkowanie i sporty wodne.'
    scenario: >-
      'Czteroosobowa rodzina chce stabilnej łodzi na weekendowe wyjazdy nad jezioro, wędkowanie i holowanie dmuchanego koła dla dzieci.'
    solution: >-
      'AirDeck 360 mieści do pięciu osób i ma wzmocnioną podłogę powietrzną. Nadmuchuje się przy miejscu startu, mieści w aucie i sprawdza się zarówno na spokojnych jeziorach, jak i w osłoniętych wodach przybrzeżnych.'
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
