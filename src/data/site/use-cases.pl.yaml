cases:
  - id: beginner
    title: Początkujące wiosłowanie
    desc: Stabilne dmuchane deski SUP dla osób wiosłujących po raz pierwszy.
    scenario: Rodzina odwiedzająca jezioro na weekend chce spróbować paddle boardingu. Potrzebują stabilnego, łatwego w spuszczeniu sprzętu z jasnymi wskazówkami bezpieczeństwa.
    solution: SUP Explorer 11 zapewnia szeroką stabilność dla początkujących. Life Vest Classic gwarantuje wyporność certyfikowaną CE. Oars & Pump Set napompowuje deskę w czasie poniżej 10 minut.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Turystyka i eksploracja
    desc: Długodystansowe dmuchane deski SUP na jeziora, rzeki i wycieczki przybrzeżne.
    scenario: Miłośnik przyrody planuje tygodniową wyprawę wiosłową i potrzebuje deski, która dobrze się spakuje, napompuje na kempingu i płynie prosto na otwartej wodzie.
    solution: Ocean Voyager Series płynie efektywnie dzięki turystycznemu kształtowi i utrzymuje kurs w wietrze i falowaniu. Jej konstrukcja drop-stitch napompowuje się do 15 PSI dla sztywności deski twardej.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Joga i fitness
    desc: Bardzo szerokie, stabilne platformy do jogi, fitnessu i relaksu.
    scenario: Praktykujący jogę chce pływającego studia na poranne sesje na spokojnej wodzie, z wystarczającą przestrzenią na wszystkie pozycje.
    solution: Flowing Lotus Series posiada pełnowymiarową matę na pokładzie i szeroki kadłub dla stabilnych pozycji bez chwiania. Może służyć również jako stabilna platforma do lekkich ćwiczeń fitness.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Rekreacja rodzinna
    desc: Kompletne pakiety SUP na weekendowe dni nad jeziorem i wakacje.
    scenario: Rodzina czteroosobowa chce stabilnych desek na weekendowe wypady nad jezioro i wakacje na plaży — sprzęt, który mieści się w samochodzie i napompowuje w kilka minut.
    solution: Tropical Breeze Series to stabilna deska all-around, którą cała rodzina może się dzielić, podczas gdy Medusa Glow Series jest lżejsza i krótsza dla dzieci. Obie mieszczą się w plecakach, co ułatwia podróżowanie.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
