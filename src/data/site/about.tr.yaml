business_model:
  tagline: İş Modelimiz
  heading: Fazla stok, doğrudan fabrikadan satılan
  paragraphs:
    - Paddle Board Overstock Yepyeni şişme SUP kartları aşırı stok ve indirim fiyatlarıyla satıyor — tipik perakendede %60'a kadar indirim. Fazla ve fazla stokları hacim olarak temin ediyoruz, ardından tasarrufları kürekçilere ve küçük perakendecilere aktarıyoruz.
    - "Perakende satışın yanı sıra, küçük perakendecilere karma model toptan satış hizmeti veriyoruz: 5–20 kart sipariş edin, herhangi bir modeli tek bir sevkiyatta karıştırın ve toplam miktar için toptan seviyeye ödeme yapın. Her sipariş doğrudan Weihai, Çin'den gönderilir."
sourcing:
  tagline: Stok Fazla Stokumuzun Nereden Geliyor
  heading: Karma kaynak, tek bir kalite standardı
  paragraphs:
    - 'Envanterimiz iki kaynaktan geliyor: kendi Weihai üretim operasyonlarımızdan gelen fazla üretim partileri ve doğrudan denetlediğimiz ve birlikte çalıştığımız diğer üretim ortaklarından seçilmiş fazla stok.'
    - Sattığımız her karton yepyeni ve kullanılmamış. Fazla stok fiyatı ifade eder — asla durumu değil.
manufacturing:
  tagline: Üretim Geçmişimiz
  heading: 2012'den beri Weihai'de inşa edilmektedir
  paragraphs:
    - SUP 2012'den beri Weihai, Shandong'da şişme kartlar üretiyoruz. 12.000 m²'lik üretim tesisimiz, 200–300 çalışan ve 14 Ar-Ge mühendisinden oluşan ekibimizle yılda 15.000 şişme ünite+ üretmektedir.
    - 'İlk tahtadan beri bir tasarım prensibi değişmedi: Bir arıza noktasına kadar tasarım yaparız, sonra onun çok üzerinde inşa ederiz.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock Weihai'deki fabrika binası
  stats:
    - value: '2012'
      label: Üretimden beri
    - value: 12.000 m²
      label: Üretim tesisi
    - value: 15,000
      label: Yılda birim
    - value: 14+
      label: Ar-Ge mühendisleri
inspection:
  tagline: Her Tahtayı Nasıl İndenetliyoruz SUP
  heading: Her kart test edildi, örneklenmedi
  paragraphs:
    - Her SUP karton, satışa onaylanmadan önce 24–48 saat boyunca nominal basıncının 1,25 katı ile %100 basınç testinden geçer. Başarısız olan kartlar asla gönderilmez.
    - Kurulların %99,3'ü ilk kez son denetimden geçer. Kalan kısmı tamir edilir veya ayrılır — asla siparişe dahil edilmez.
why_prices_lower:
  tagline: Fiyatlarımızın Neden Daha Düşük Olması
  heading: Aşırı stok ekonomisi, köşe kesintisi değil
  paragraphs:
    - "Fiyatlarımız yapısal nedenlerle daha düşük: fazla stok ve fazla stoku doğrudan Weihai'den satıyoruz, perakende fark artı yok, dağıtıcı katmanları yok ve showroom masrafları yok."
    - Kartların kendileri tam üretim kalitesinde — aynı drop-stitch çekirdekler, aynı deniz PVCkalitesi, tam fiyatlı perakendede aynı testler.
shipping_network:
  tagline: Uluslararası Denizcilik Ağımız
  heading: Ekspres hava veya konsolide deniz taşımacılığı
  paragraphs:
    - Siparişler Çin'in Weihai kentinden gönderilir. Ekspres hava yükü örnekler ve 1–3 board siparişi taşır; Consolidated Sea Freight ise 50 ülkeye 5–20 board toptan sipariş verir+.
    - Her teklif, varış noktanız için bir transit tahmini ve gümrük kontrolü için gereken ticari fatura ve paketleme listesini içerir.
  cards:
    - title: Hızlı Hava Kargo
      description: Numuneler ve 1–3 kart siparişleri için — kapınıza hızlı teslimat, varış yerine göre fiyatlandırılır.
    - title: Konsolide Deniz Taşımacılığı
      description: 5–20 adetlik toptan board siparişleri için — ana limanlara uygun maliyetli nakliye, varış noktasına göre fiyatlandırılır.
warranty_support:
  tagline: Garanti ve Müşteri Desteği
  heading: Her kart için 2 Yıllık SUP Garanti
  paragraphs:
    - Her kart, 2 Yıllık SUP Garanti ile birlikte gelir. Garanti süresi içinde kapsanan bir kusur ortaya çıkarsa, destek ekibimizle iletişime geçin ve biz bunu düzelteceğiz.
    - Destek, siparişinizi yöneten aynı ekip tarafından sağlanır. Bize iletişim formu aracılığıyla veya sipariş onayınıza yanıt vererek her zaman ulaşabilirsiniz.
