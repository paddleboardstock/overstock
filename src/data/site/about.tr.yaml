origin:
  tagline: Kökenimiz
  heading: |-
    Suyun üzerine inşa edilmiş,<br />
    <span class="text-sky-600">amaç odaklı</span>
  paragraphs:
    - 'Paddle Board Overstock, bir tekne ve inatçı bir inançla kıyıdaki bir atölyede başladı: deniz ürünleri, önemliymiş gibi tasarlanmalıdır — çünkü öyledir.'
    - Kurucularımız, iki deniz mimarı, köşelerin kesildiği, malzemelerin düşürüldüğü ve güvenliğin sadece bir onay kutusu olarak ele alındığı bir sektör gördü. İlk Paddle Board Overstock gövdeyi kâr amacı gütmeden inşa ettiler, amaçları uygun maliyetli deniz ekipmanının gerçekten güvenilir olabileceğini kanıtlamaktı.
    - O ilk gövde hâlâ bugün hizmette. O prensip hiç değişmedi.
    - Biz en büyük üretici değiliz. En ucuz ürünleri yapmıyoruz. Ama atölyemizden çıkan her gövde, şirketi başlatan aynı ellerden geçer — ve ilk gövdenin belirlediği aynı standardı karşılar.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock sahil atölyesi
philosophy:
  tagline: Felsefemiz
  heading: Okyanusta kök salmış
  description: Okyanus bizim iş yerimiz değildir. O bizim öğretmenimizdir. Her tasarım kararı, suyun nasıl davrandığını, koşulların nasıl değiştiğini ve ekipmanın nasıl tepki vermesi gerektiğini anlamakla başlar.
  cards:
    - emoji: 🌊
      title: Suya Saygı Göster
      description: Su öngörülemezdir. Ürünlerimiz en iyi koşullar için değil, en kötü koşullar için tasarlanmıştır. Bir gövde bir akıntıya dayanabiliyorsa, bir göle de dayanır. Bir can yeleği açık denizde çalışıyorsa, bir nehir için fazla mühendisliklidir — ve bu kasıtlıdır.
    - emoji: 🔧
      title: Değiştirmek İçin Değil, Dayanmak İçin Yapıldı
      description: En sürdürülebilir ürün, değiştirilmesine gerek kalmayan üründür. Dayanıklılık için deniz sınıfı PVC, Hypalon ve drop-stitch yapılar tercih edilir. On yıl önce inşa ettiğimiz gövdeler için hâlâ yedek parça gönderiyoruz.
    - emoji: 🏆
      title: Tasarım Gereği Erişilebilir
      description: Su sporları bir lüks olmamalıdır. Biz, sadece ticari filolar için değil, aileler, rehberler ve küçük işletmeler için anlamlı bir fiyatla profesyonel düzeyde performans sunan ürünler tasarlıyoruz.
design:
  tagline: Tasarım Felsefesi
  heading: |-
    Uca yönelik tasarlandı<br />
    <span class="text-sky-600">şartlar</span>
  paragraphs:
    - Her Paddle Board Overstock ürün bir soruyla başlar:<em>Bu bunun karşılaşacağı en kötü durum nedir?</em>Biz tasarımı merkezden dışa değil, kenardan içeriye doğru yaparız.
    - Çekirdeklerimiz 15 PSI için derecelendirilmiştir — çünkü 12 PSI bir göl için yetersiz olduğu için değil, 15 PSI bir plaka ani dalgalanmayı bükülmeden karşılayabilir. Tüplerimiz ticari sınıf UV direnç için belirtilmiştir — çünkü her müşteri tropiklerde kürek çektiği için değil, UV bozulması erken arızaların bir numaralı nedeni olduğu için.
    - Biz bir fiyat noktasına göre tasarım yapmayız. Bir arıza noktasına göre tasarım yaparız — sonra bunun çok üzerinde inşa ederiz.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock tasarım ve mühendislik
  stats:
    - value: '15'
      label: PSI çekirdek<br />derecelendirme
    - value: 1,500+
      label: UV saat<br />test edilmiş
    - value: 10yr
      label: gövde<br />ömür
