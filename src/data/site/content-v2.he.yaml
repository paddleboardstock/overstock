- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: מדריך ציוד גלישה במים קרים (גלישה בחורף בלי סבל)
  description: "אל תתנו למים קרים לסיים את העונה שלכם. פירוק מלא של ציוד מים קרים: עובי בגדי צלילה, בחירת מגפיים וכפפות, התאמת קפוצ'ון, והאביזרים שהופכים את סשני החורף למהנים."
  definition: גלישה במים קרים דורשת חליפת צלילה מלאה (5/4/3 מ"מ ועבה יותר), מגפיים, כפפות וקפוצ'ון. מתחת ל-12°C, כל נקודת מגע עם מים קרים דורשת הגנה למניעת נימול, היפותרמיה וסיכוני בטיחות.
  tldr: גלישה במים קרים דורשת חליפת גלישה מלאה עם קפוצ'ון בגודל 5/4/3 מ"מ או 6/5/4 מ"מ, מגפיים בגודל 5 מ"מ, כפפות 3 מ"מ וקפוצ'ון. איכות התפר חשובה יותר מהמותג — חפשו תפרים מודבקים ותפורים עיוורים (GBS). חליפה עם ציפוי תרמי מוסיפה חום משמעותי ללא עובי נוסף. תמיד הביאו שכבות תרמיות רזרביות ותרמוס להתאוששות לאחר הסשן.
  problem: אתה רוצה לגלוש בחורף אבל המים הקרים מאלחשים את הרגליים אחרי 15 דקות, הידיים שלך לא מצליחות לאחוז בגרש, והחליפה שלך שוטפת מים קפואים על הגב בכל פעם שאתה חותר. בלי הציוד הנכון, אימוני מים קרים קצרים ומעצבנים.
  explanation: "גלישה במים קרים (מתחת ל-12°C) דורשת יותר מחליפת צלילה עבה בלבד. כל נקודת מגע עם הקור דורשת הגנה: מגפיים מונעים נימול בכף הרגל ומגינים מפני חתכים בשונית, כפפות שומרות על תפקוד הידיים בזמן חתירה, וקפוצ'ון מונע את אובדן החום החמור ביותר (הראש פולט 30 אחוז מחום הגוף). עובי חליפת הצלילה צריך להיות מותאם לחודש הקר ביותר, לא לממוצע. מעבר לחליפה, אביזרים כמו נעליים עם סוליות אטומות וכפפות עם אצבעות מעוקלות מראש משפרים את הנוחות והעמידות."
  solution: 'בנה ערכת מים קרים בסדר הבא: חליפה מלאה 5/4/3 מ"מ או 6/5/4 מ"מ עם תפרי GBS ורוכסן חזה, מגפיים 5 מ"מ עם סוליות גומי, כפפות 3 מ"מ (כפפות חמות יותר מהאצבעות), וקפוצ''ון 3 מ"מ שמתחבא מתחת לצווארון החליפה. הוסיפו חלוק החלפה לכבוד וחום בחניון.'
  recommendation: Paddle Board Overstock ה-Wetsuit Pro בעובי 5/4/3 מ"מ עם ריפוד תרמי משולב מתמודד עם רוב תנאי המים הקרים עד 8°C. שלב אותו עם מגפיים של 5 מ"מ Paddle Board Overstock וכפפות 3 מ"מ להתקנה מלאה של מים קרים. מתחת ל-8°C, העלה ל-6/5/4 מ"מ עם קפוצ'ון.
  faq:
    - q: האם אני באמת צריך קפוצ'ון?
      a: כן. אתה מאבד 30 אחוז מחום הגוף דרך הראש. קפוצ'ון מונע שטיפה ושומר על הצוואר חם. קפוצ'ון 3 מ"מ מוסיף יותר חום מאשר שדרוג מ-5 מ"מ ל-6 מ"מ עובי גוף.
    - q: באיזה עובי מגפיים אני צריך?
      a: למים בגובה 8-12°C השתמשו במגפיים של 5 מ"מ. ל-12-16°C, מגפיים 3 מ"מ מספיקים. מתחת ל-8°C, שקול מגפיים של 7 מ"מ או הוספת גרביים ניאופרן מתחת למגפי 5 מ"מ.
    - q: איך אני מונע מחליפת הצלילה שלי להישטף?
      a: השטיפה מתרחשת כאשר מים נכנסים לחליפה בצוואר, בפרקי כף היד או בקרסוליים. עיצוב כניסה עם רוכסן לחזה מפחית משמעותית את ההדמקה בגב. אטמי וולקרו בצוואר ובקרסוליים גם עוזרים, אבל התיקון הטוב ביותר הוא חליפה מתאימה היטב עם תפרי GBS.
    - q: האם אפשר להשתמש בחליפת 3 מ"מ במים קרים עם שכבות נוספות?
      a: חליפה בגודל 3 מ"מ עם אפוד ניאופרן מתחתיה יכולה להאריך את טווח הטווח בכ-3-4°C, אבל היא לא תחליף לחליפה אמיתית בגודל 5/4/3 מ"מ או 5 מ"מ. שכבות מתאימות הכי טוב למפגשים קצרים בתנאים גבוליים.
