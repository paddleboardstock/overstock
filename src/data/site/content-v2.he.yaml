- slug: understanding-tides
  category: guide
  type: technical
  title: 'הבנת גאות לספורט מים: מדריך מעשי'
  description: איך הגאות SUPוהשפל משפיעות, על תנאי גלישה וקיאקים. קריאת טבלאות גאות, הבנת ההבדל בין גאות אביבית לגאות רגילה, ותכנון האימון שלך סביב תנועות גאות ושפל למען בטיחות.
  definition: הגאות היא העלייה והירידה היומית של מפלס הים הנגרמת על ידי המשיכה הכבידתית של הירח והשמש. טווח הגאות משתנה לפי מיקום ומחזור הירח.
  tldr: 'שני גאות גבוהה ושתי שפל ביום ברוב המקומות. גאות האביב (ירח מלא/חדש) בעלות טווחים גדולים יותר וזרמים חזקים יותר. גאות נאפ (רבע ירח) משפיעה על טווחי מים קטנים. הגאות משפיעה על עומק המים, צורת הגל ועוצמת הזרם. עבור SUP: חתור נגד הזרם קודם כדי שיעזור לך לחזור.'
  problem: אתה מגיע למפרץ המקומי שלך ומוצא כמעט ואין גלים, קרשים מסוכנים מהגאות היוצאת, או מים רדודים מדי. בלי להבין את הגאות, אתה מבזבז טיולים או חותר בתנאים מסוכנים.
  explanation: הגאות נגרמת על ידי כוח הכבידה של הירח. גאות האביב (ירח מלא וירח חדש) מייצרת שיאים גבוהים ושפלים נמוכים. גאות נאפ (רבע ירח) מייצרת טווח מינימלי. זרמי הגאות הם המהירים ביותר באמצע הגאות, רפויים בשעות הגבוהות והנמוכות. טווח הגאות משתנה בין 0.3 מטר (ים תיכוני) ל-16 מטר (מפרץ פונדי).
  solution: 'בדוק את טבלת הגאות לפני כל מפגש. לגלישה: הפסקות חוף בדרך כלל הכי טובות 2-3 שעות משני צידי הגאות. לSUP: חתור נגד החצי הראשון הנוכחי כדי שהסיוע הזרמי יחזור. לדיג: הגאות הנכנסת דוחפת דגים אל מישורים.'
  recommendation: השתמשו בתחזיות גאות של NOAA או באפליקציה מקומית לגאות. למדו את העדפת השבירת הגאות המקומית שלכם על ידי רישום תנאים לאורך חודש.
  faq:
    - q: מהי גאות אביבית?
      a: גאות האביב מתרחשת במהלך ירח מלא וירח חדש, ויוצרת גאות גבוהה יותר וזרמים חזקים יותר. הן מתרחשות פעמיים בחודש.
    - q: מהו גאות חדשה?
      a: גאות ניפ מתרחשת במהלך רבעי ירח. טווח הגאות קטן יותר, והזרמים חלשים יותר — טוב למתחילים.
    - q: האם גאות נמוכה מסוכנת SUPל?
      a: גאות נמוכה עלולה לחשוף סלעים ושוניות. היא גם מרוכזת אנרגיית גלים על חולות תלולים יותר.
    - q: איך הגאות משפיעים על זרמי הקריפה?
      a: גאות יוצאת (שפל) מחזקת זרמי קריעה. גאות נכנסת (שיטפון) מפחיתה את חוזק הקריעה.
