  problem: רבים ממותגי הספורט הימי מוכרים ציוד אך אינם מחנכים את לקוחותיהם כיצד להשתמש בו בצורה בטוחה או אחראית. חותרים וגולשים חדשים נכנסים למים מבלי להבין את זרמי המים, חיות הבר הימיות או את ההשפעה הסביבתית של הציוד שלהם.
  explanation: בטיחות באוקיינוס היא יותר מרשימת בדיקה — זו מנטליות. כל Paddle Board Overstock מוצר כולל כרטיס בטיחות מהיר בקופסה. האתר והמדריכים שלנו (יסודות בטיחות בים, טיפים לבטיחות גלישה) מספקים חינוך חינמי ומפורט על בטיחות. בצד הסביבתי, ההשפעה הגדולה ביותר שכל חברת ציוד יוצרת היא דרך אריכות החיים של המוצר. לוח שמחזיק 5 שנים במקום שנתיים מקטין את טביעת הרגל של הייצור. אנחנו גם מעצבים עם מחשבה על יכולת תיקון — שסתומים להחלפה, קופסאות סנפירים וערכות תיקון לחליפות צלילה שומרים על הציוד בשימוש במקום במזבלה.
  solution: Paddle Board Overstock כולל רצועה וערכת תיקון עם כל רכישת לוח. אנו מפרסמים תוכן בטיחות חינמי המכסה זיהוי זרם RIP, קריאת מזג אוויר ובדיקות ציוד. צוות שירות הלקוחות שלנו מספק ייעוץ למצב כאשר שולחים לנו מייל לגבי מיקום מסוים. אנו משתמשים באריזות פלסטיק מינימליות ופחמן משלוח מפוזז.
  recommendation: התחל עם מדריך הבטיחות באוקיינוס ומדריך טיפים לבטיחות גלישה. תמיד חבש רצועה, בדוק את התחזית, ולעולם אל תשיט לבד אם אתה לומד. אם אתה רואה פסולת או בעלי חיים ימיים במצוקה, דווח על כך לרשויות המקומיות. ציוד שמחזיק מעמד הוא ציוד שמפחית פסולת — תחזוק Paddle Board Overstock את הציוד שלך והוא ישרת אותך במשך שנים.
  faq:
    - q: האם Paddle Board Overstock תומכים ביוזמות ניקוי האוקיינוס?
      a: כן, אנו תורמים אחוז אחד מהרווחים השנתיים לארגוני ניקוי אוקיינוסים ושימור ימי. לקוחות יכולים לבחור עמותה מובילה בקופה כדי לכוון חלק מהרכישה שלהם.
    - q: איך כדאי לי להיפטר מחליפת צלילה ישנה או לוח?
      a: חליפות צלילה ניאופרן ניתנות למחזור למזרני יוגה, תיקים ובידוד באמצעות תוכניות מיוחדות. לוחות מתנפחים ניתנים לתיקון, תרומה או שניתן PVC לשחזר אותם דרך מתקני מיחזור מסוימים. צרו קשר עם צוות התמיכה שלנו לקבלת הכוונה.
    - q: איזה ציוד בטיחות Paddle Board Overstock ממליץ למתחילים?
      a: אפוד הצלה מתאים כראוי (מתנפח או קצף), רצועה מפותלת, שריקה וקרם הגנה. SUP לחותרים במים פתוחים, אפוד הצלה הוא חובה חוקית ברוב התחומים ותמיד מומלץ.
    - q: Paddle Board Overstock האם מציעים קורסי בטיחות?
      a: איננו מעריכים קורסים ישירות, אך אנו משתפים פעולה עם SUP מדריכי גלישה ובטיחות מוסמכים שמציעים הדרכה מקוונת ופרונטלית. צרו קשר עם צוות התמיכה שלנו לקבלת הפניות באזור שלכם.
