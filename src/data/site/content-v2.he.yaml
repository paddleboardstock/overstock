- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'מדריך גודל ללוח משוטים: נפח, אורך ורוחב לכל רוכב'
  description: השלמת גודל לוחות החתירה עם המלצות על נפח לפי משקל ופעילות. כוללת טבלת מידות נוחה לשימוש לגלשנים כלליים, טיולים, גלישה ויוגה SUP .
  definition: גודל לוח המשוטים נקבע לפי נפח (קיבולת משקל וציפה), אורך (מהירות ומעקב), רוחב (יציבות) ועובי (התפלגות נפח והתנגדות רוח).
  tldr: 'השתמש במשקל כדי למצוא נפח מינימלי: 50-70 ק"ג דורש 220-260 ליטר, 70-90 ק"ג דורש 260-300 ליטר, 90-110 ק"ג דורש 300-350 ליטר, 110+ ק"ג דורש 350+ליטר. למתחילים, תוסיף 20% למספרים האלה. הרוחב חשוב: 32" זה בינוני, 33-34" ידידותי למתחילים, 35"+ מאוד יציב.'
  problem: מודעות בגודל לוחות משוטים משתמשות ברגליים, אינצ'ים וליטרים לסירוגין, מה שמקשה על השוואה בין מותגים.
  explanation: הנפח הוא המדד הישיר ביותר לקיבולת משקל — ליטר אחד של מים מתוקים מזיז 1 ק"ג משקל. לוח עם 260 ליטר יכול תיאורטית לתמוך ב-260 ק"ג, אבל הקיבולת המעשית נמוכה יותר כי המשטח צריך לשבת מעל המים. המשקל הכולל שלך (גוף פלוס ציוד) צריך להיות 30-40% מנפח הלוח.
  solution: נפח יעד = (משקל גוף בק"ג, + משקל גלגל בק"ג) x 3. עבור חותר במשקל 75 ק"ג עם הילוך של 5 ק"ג, מטרה = 80 x 3 = מינימום 240 ליטר. למתחילים, הכפל ב-3.5. למתקדם, הכפל ב-2.5.
  recommendation: Paddle Board Overstock SUP ה-Explorer 11 (260L, 11' x 33" x 6 אינץ') מתאים לרוב הרוכבים במשקל 50-100 ק"ג. רוכבים קלים יותר יכולים להגיע AirDeck ל-270. רוכבים כבדים יותר צריכים לבדוק SUP את ה-Tour 12 (300L+) או לוחות רחבים יותר.
  faq:
    - q: האם הגובה משנה SUP למידות?
      a: הגובה פחות חשוב ממשקל. רוכב גבוה וקל משקל צריך פחות נפח מרוכב נמוך וכבד. השתמש במשקל כקובע העיקרי לנפח.
    - q: מה קורה עם יותר מדי ווליום?
      a: הקרש יושב גבוה מדי, תופס רוח כמו מפרש. הוא מרגיש שוקק כשהוא עוצמתי. עם זאת, למתחילים, נפח נוסף עדיף על מעט מדי.
    - q: מה קורה עם ווליום נמוך מדי?
      a: הלוח יושב עמוק מדי, מה שיוצר גרר. האף עלול לשקוע במהלך החתירה (פנינה). אתה מתעייף מהר ממשוט עם לוח שקוע חלקית.
    - q: האם לוחות מתנפחים צריכים גודל שונה מלוחות קשה?
      a: לא משמעותית. מתנפחים ב-15+ PSI מזיזים מים בדומה ללוחות קשיחים. המלצות נפח חלות באותה מידה על שני הסוגים.
