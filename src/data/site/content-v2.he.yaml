  title: 'תחזוקת סירות מתנפחות: שמור על ההשקעה שלך'
  description: רשימת בדיקה שנתית לתחזוקת סירות מתנפחות. ניקוי, UV הגנה, בדיקת תפרים, ניהול לחץ, טיפול במנועים, וחימום PVC Hypalon לחורף לסירות.
  definition: תחזוקת סירות מתנפחות כוללת ניקוי, UV הגנה, ניהול לחץ, בדיקת תפרים ושסתומים, מניעת עובש ואחסון נכון בעונה שמחוץ לעונה.
  tldr: שטוף אחרי כל שימוש במי מלח. מרח UV מגן כל 2-3 חודשים. בדוק את לחץ הנפיחה לפני כל יציאה. בדוק את התפרים, השסתומים והטרנסום מדי חודש. נקה עם סבון עדין. אחסן מנופח במקום קריר ויבש בתקופה מחוץ לעונה.
  problem: השתמשת בסירה המתנפחת שלך לעונה ועכשיו הצינורות נראים דהויים, תפר בוכה, והטרנסום מרגיש ספוגי — הכל ניתן למניעה עם תחזוקה שגרתית.
  explanation: UV הקרינה מפחיתה את מטריצת הפולימר. מי מלח מתגבשים בקפלים ושוחקים את הבד. עובש גדל בלחות כלואה. לחץ לא נכון גורם לעייפות חומר. הטרנסום (במיוחד דיקט) סופג מים דרך חורי בורגים.
  solution: 'אחרי כל שימוש: שטוף במים טריים, ייבוש, בדוק לחץ. חודשי: נגב צינורות עם UV מגן, בדוק תפרים, בדוק שסתום. פעם בשנה: ניקוי עמוק, בדיקת טרנסום לריקבון, שימון שסתומים, בדיקה לדליפות מיקרו.'
  recommendation: השתמש ב-303 Aerospace Protectant על Paddle Board Overstock צינורות הסירות. הסר שסתומים ומרח שומן סיליקון מדי שנה. אחסן בתיק הנשיאה עם חבילת ייבוש.
  faq:
    - q: האם אפשר להשתמש באקונומיקה כדי לנקות את הסירה המתנפחת שלי?
      a: לא — אקונומיקה פוגעת בציפוי הבד. השתמשו בסבון עדין ומים חמים. לעובש, השתמשו בחומץ לבן מדולל.
    - q: באיזו תדירות כדאי לטפל בחומר UV הגנה?
      a: כל 2-3 חודשים בעונת השימוש. בתדירות גבוהה יותר באקלים טרופי.
    - q: האם אני צריך לרוקן את הסירה שלי בין השימושים?
      a: לא אם משתמשים בהם שבועית. להשאיר מנופח עם UV כיסוי. להפסקות חודשיות, תנקן ותאחסן.
    - q: איך אני מתחזק את החלק האחורי?
      a: בדוק ברגים מדי חודש. אטום את קצוות העץ החשופים בלכה ימית מדי שנה. החלף אם מתפתחות נקודות רכות.
