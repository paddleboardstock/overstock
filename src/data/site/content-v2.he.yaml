      a: 400-700 קלוריות לשעה, תלוי בעוצמה, ברוח ובזרם. חתירה במרווחים מגבירה את שריפת הקלוריות.
    - q: האם SUP זה טוב לירידה במשקל?
      a: כן, בשילוב עם תזונה נכונה. ההשתתפות בכל הגוף וההשפעה הנמוכה הופכים את זה לבר קיימא לפעילות גופנית סדירה.
    - q: האם אפשר לעשות אימוני כוח על SUP?
      a: כן — סקוואטים, לאנג'ים, שכיבות סמיכה ופלאנקים על הלוח מוסיפים אתגר שיווי משקל לתנועות כוח.
    - q: אילו שרירים SUP באמת עובדים?
      a: 'ראשי: ליבה (אלכסוניים, בטן רוחבית), גב (לאט, טראפס), כתפיים (דלתואידים), זרועות (בייספס, טרייספס). משנית: רגליים (שרירים ארבע ראשיים, שרירים אחוריים, שוקיים).'
