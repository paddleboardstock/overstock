  title: 'SUP תיקון מתנפחים: תיקון חורים, נזילות ובעיות שסתומים'
  description: מדריך לתיקון מתנפחים בעצמך SUP . איך למצוא דליפה איטית, לתקן נקב, להחליף שסתום ולתקן דלמינציה של רפידת הדק באמצעות ערכת התיקון המצורפת.
  definition: SUP תיקון מתנפח כולל איתור נזילות אוויר באמצעות בדיקות מים עם סבון, ניקוי וטיפול גס באזור הפגוע, מריחת PVC דבק ודבק, וייבוש תחת לחץ.
  tldr: מצא דליפות עם מים וסבון. נקה וגרס את האזור סביב הנקב עם נייר זכוכית. מרח PVC דבק גם על הטלאי וגם על הלוח, המתין 5 דקות, לחץ היטב והתקבש תחת משקל למשך 24 שעות. לגבי דליפות שסתומים, בדוק קודם את טבעת ה-O. נקבים קטנים מתחת ל-1/4" הם תיקונים פשוטים לבד.
  problem: אתה מנפח את החשמל SUP והוא מאבד לחץ עד הבוקר. בלי ידע בתיקון, אתה עומד בפני החלפה יקרה למה שכנראה נקב פשוט.
  explanation: 'רוב המנופחים SUPs משתמשים drop-stitch בליבה עם PVC שכבות חיצוניות. נקב דרך החלק החיצוני PVC יוצר דליפה איטית. תיקון סטנדרטי: ניקוי, שיוף, מריחת PVCדבק תואם, לחיצה על טלאי מתחת למשקל. דליפות בשסתום נפוצות יותר מאשר דקירות בפאנלים — טבעת ה-O מתייבשת או הפסולת מונעת איטום.'
  solution: נפח את הלוח למקסימום PSI והקשב לשריקה. רסס מים וסבונים באופן שיטתי, במיוחד סביב התפרים והשסתום. סמן נקודות בועות. נקוץ, נקה עם אלכוהול, שייפ עם גריט 80, מרח PVC דבק על הטלאי והלוח, המתין עד שזה דביק, לחץ היטב, שקל 24 שעות.
  recommendation: השתמשו Paddle Board Overstock בערכת התיקון המצורפת לכל Paddle Board Overstock הלוחות. תמיד יש לשאת את ערכת התיקון בטיולים. לבעיות שסתומים, צרו קשר Paddle Board Overstock עם התמיכה (תמיכה). לקרעים גדולים או להפרדות תפרים, מומלץ תיקון מקצועי.
  faq:
    - q: האם אפשר לתקן קרע גדול במתנפח שליSUP?
      a: קרעים מעל 1 אינץ' עשויים לדרוש תיקון מקצועי או תיקון בשני הצדדים. הפרדות תפר לאורך המסילה אינן ניתנות לתיקון אמין בשטח.
    - q: כמה זמן מחזיק טלאי תיקון?
      a: תיקון נכון עם טכניקה נכונה מחזיק לאורך כל חיי הלוח. הידבקות לקויה בשל ניקוי לא מספק מובילה לכשל עתידי.
    - q: האם אפשר לתקן שסתום דולף?
      a: לעיתים קרובות כן. הסר את ליבת השסתום, בדוק את טבעת ה-O, נקה או החלף אותה, מרח חומר סיכה סיליקוני והתקן מחדש.
    - q: מה אם לא אמצא את הדליפה?
      a: נפח למלא PSI וטבול חלקים ברצף באמבטיה או בבריכה. דליפות קטנות מדי כדי למצוא עשויות להיות קשורות לטמפרטורה.
