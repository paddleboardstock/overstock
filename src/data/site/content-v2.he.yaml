- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: 'חליפת צלילה 3 מ"מ מול 5 מ"מ: מה שרוב המתחילים טועים בו במים קרים'
  description: תפסיקו לקפוא באמצע סשן או להתחמם יתר על החוף. ההבדל האמיתי בין חליפות צלילה של 3 מ"מ ל-5 מ"מ — טבלת טמפרטורה, פשרות גמישות, ומה באמת עובד לגלישה במים קרים.
  definition: חליפת צלילה היא בגד ניאופרן הלוכד שכבה דקה של מים על העור, שחום הגוף מחמם אותה לבידוד. העובי (3 מ"מ, 5 מ"מ) קובע את טווח הטמפרטורות שהחליפה יכולה להתמודד איתו — עבה יותר חם יותר אך פחות גמיש.
  tldr: עובי חליפת הצלילה קובע ישירות חום וגמישות. השתמש ב-3 מ"מ למים מעל 16°C ו-5 מ"מ למים בין 8°C ל-16°C. חליפות עבות יותר מגבילות את התנועה אך שומרות על חום לאורך זמן — תמיד תעדיפו התאמה על פני מותג.
  problem: אתה פותח חנות מקוונת או נכנס לחנות גלישה ורואה חליפות צלילה עם תוויות 3/2, 4/3, 5/4 ו-5 מ"מ חליפות מלאות. המספרים לא משמעותיים עד שאתה מבין שהעובי הלא נכון אומר או קיפאון באמצע סשן או להתחמם יתר על המידה ולהזיע על החוף.
  explanation: חליפות צלילה פועלות על ידי לכידת שכבת מים דקה בין העור לניאופרן; הגוף שלך מחמם את המים ויוצר בידוד. ניאופרן עבה יותר לוכד יותר מים אך מגביל גמישות וציפה. חליפה בקוטר 3 מ"מ (לעיתים 3/2 עם זרועות דקות יותר) מתאימה לתנאים נמוכים, בעוד 5 מ"מ (5/4/3 או 5 מ"מ מלא) מתאימה למים קרים. כנסי רוכסן לחזה אוטמים טוב יותר מאשר רוכסן אחורי ומפחיתים שטיפה. מבנה התפר — מודבק ותפור עיוור (GBS) — הוא ההבדל בין חליפה דולפת לחליפה חמה.
  solution: התאימו עובי לטמפרטורת המים המקומית שלכם עם טווח טעות של 5°C. לאקלים מתון קנו 3/2 מ"מ. למים קרים קנו 5/4/3 מ"מ. הוסיפו מגפיים, כפפות ומכסה כדי להרחיב את הטווח ב-5°C כלפי מטה. נסו חליפות לפני הקנייה או בחרו מותג עם מדיניות החזרה נדיבה.
  recommendation: Paddle Board Overstock ה-Wetsuit Pro בגודל 5/4/3 מ"מ אידיאלי לרוב הגולשים במים קרים, ומציע תפרי GBS וריפוד תרמי. אם אתם גולשים במים חמים מעל 20°C, 3/2 מ"מ עם רוכסן חזה הוא הבחירה הטובה יותר.
  faq:
    - q: איזה טמפרטורת מים דורשת חליפת צלילה של 5 מ"מ?
      a: טמפרטורות מים בין 8°C ל-14°C דורשות חליפה של 5 מ"מ. מתחת ל-8°C צריך חליפה עם קפוצ'ון של 6/5/4 מ"מ. בין 14°C ל-18°C חליפה 4/3 מ"מ עובדת טוב לרוב האנשים.
    - q: האם מותר לי ללבוש חליפת צלילה בעובי 3 מ"מ בחורף?
      a: רק באקלים חורפי מתון שבו המים נשארים מעל 16°C. לגלישה אמיתית בחורף, 5 מ"מ או 5/4/3 מ"מ נדרשים. מגפיים, כפפות וקפוצ'ון מוסיפים חום שווה ערך בלי צורך בגוף עבה יותר.
    - q: כמה צמוד צריך להיות חליפת צלילה?
      a: צמוד אך לא מגביל. לא אמורים להיות כיסי אוויר או ניאופרן רפוי. אם אפשר להחליק אצבע בין העור לחליפה בגב התחתון, היא רפויה מדי. אם הנשימה קשה או שהתנועה מוגבלת מאוד, קח מידה גדולה יותר.
    - q: האם חליפות צלילה יקרות שומרות עליך חם יותר?
      a: מחיר גבוה יותר לעיתים אומר ניאופרן טוב יותר (מבוסס אבן גיר לעומת נפט), מבנה תפרים טוב יותר (GBS לעומת מודבק בלבד), וגמישות טובה יותר. גורמים אלה משפיעים ישירות על חום ואריכות ימים, אבל רק אם ההתאמה נכונה.
