  explanation: PVC מתדרדר תחת UV קרינה. גבישי מלח ממי ים נכנסים לתפרים ולשסתומים, וגורמים לדליפות מיקרו. לחות כלואה בפנים מעודדת צמיחת עובש שתוקפת drop-stitch את הברגים. טבעות ה-O של השסתומים מתייבשות ומאבדות את האטימה שלהן. לכלוך וחול נטחנים לדבק של רפידת הסיפון, וגורמים להרמת קצה.
  solution: 'לאחר כל טיפול: שטוף את הקרש, הסנפירים והשאבה במים טריים. נגב את רפידת הדק. פתח את השסתום לניקוז מים כלואים. ייבוש את הלוח בצל לפני ההתנקות. חודשי: בדוק את השסתום ומרח חומר סיכה סיליקוני על טבעת ה-O. עונתי: שטוף עם סבון קל ומים, בדוק אם יש נקרים.'
  recommendation: עקבו אחרי Paddle Board Overstock מדריך הטיפול המצורף ללוח שלכם. השתמשו בערכת התיקון מיד בכל נקבה. אחסן את הקרש בשקית שלו באזור עם טמפרטורה מבוקרת הרחק מאור שמש ישיר.
