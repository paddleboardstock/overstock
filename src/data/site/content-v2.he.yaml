  title: 'בטיחות במים קרים: חתירה וגלישה בתנאים קרים'
  description: בטיחות במים קרים SUPלגלישה וקיאקים. זיהוי היפותרמיה, ציוד מתאים, תגובה לזעזוע קר, ונהלי חירום לטבילה במים קרים.
  definition: בטיחות במים קרים כוללת הבנה של תגובת הלם קר, כישלון בשחייה, היפותרמיה, והציוד והטכניקות למניעת תוצאות אלו.
  tldr: מים מתחת ל-15 מעלות דורשים חליפת צלילה. מתחת ל-10 מעלות דורשים מגפיים, כפפות וקפוצ'ון. הלם קר גורם לנשימות לא רצוניות. כשל בשחייה מתרחש תוך 3-5 דקות במים מתחת ל-10 מעלות צלזיוס. תסמיני היפותרמיה כוללים רעד, בלבול ואובדן קואורדינציה.
  problem: אתה חותר ביום שמשי מבלי לדעת שהמים הם 8 מעלות צלזיוס. אתה נופל פנימה, מתנשף בלי שליטה, ומרגיש את הגפיים מתקהים תוך דקות. מים קרים הורגים מהר יותר מכל סכנה ימית אחרת.
  explanation: 'טבילה במים קרים כוללת ארבעה שלבים: הלם קר (0-2 דקות) — נשימות כבדות, היפרוונטילציה. כשל בשחייה (3-15 דקות) — השרירים מתקררים, קואורדינציה נכשלת. היפותרמיה (15-45 דקות) — טמפרטורת הליבה יורדת מתחת ל-35 מעלות צלזיוס, מה שגורם לבלבול ודום לב. קריסה לאחר ההצלה — דם קר חוזר לליבה.'
  solution: 'בדוק את טמפרטורת המים. לבש חליפת צלילה שמותאמת לטמפרטורה. לעולם אל תחתור לבד במים מתחת ל-15 מעלות צלזיוס. תשאו שריקה וטלפון. אם תיפול: שלטו בנשימה, התקינו מחדש את הלוח במהירות. אם קר מדי, סמן לעזרה.'
  recommendation: Paddle Board Overstock ה-Wetsuit Pro 5/4/3mm הוא המינימום למים 8-14 מעלות צלזיוס. הוסף Paddle Board Overstock מגפיים של 5 מ"מ וכפפות 3 מ"מ. תלבש את Life Vest Pro להגנה תרמית נוספת.
  faq:
    - q: כמה זמן אוכל לשרוד במים של 10 מעלות?
      a: הלם קר נמשך 1-2 דקות. ללא ציפה והגנה תרמית, זמן ההישרדות הוא 30-60 דקות.
    - q: מהם הסימנים הראשונים להיפותרמיה?
      a: רעד בלתי נשלט, בלבול, קואורדינציה לקויה, דיבור מטושטש. הפסק פעילות והתחמם מיד.
    - q: איך מתחממים אחרי סשן מים קרים?
      a: הסירו את הציוד הרטוב, ייבשו, לבשו שכבות חמות כולל כובע וכפפות. שתו משקאות חמים ללא אלכוהול.
    - q: האם אפשר לקבל היפותרמיה בקיץ?
      a: כן — מים מתחת ל-15C קיימים במקומות רבים אפילו בקיץ. מים מוליכים חום פי 25 מהר יותר מאוויר.
