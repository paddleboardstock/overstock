  title: 'איך לבחור מתנפחSUP: מה באמת חשוב'
  description: לא כל המתנפחים SUPs שווים. איכות בנייה, PSI דירוג, drop-stitch צפיפות, PVC עובי ואביזרים כלולים — מה שמבדיל iSUP טוב מגרוע.
  definition: 'מתנפח SUP (iSUP) משתמש drop-stitch בבנייה: אלפי חוטי פוליאסטר המחברים בין השכבה העליונה והתחתונה, ומאפשרים התנפחות בלחץ גבוה שיוצרת פלטפורמה קשיחה.'
  tldr: 'מדדי איכות עיקריים: drop-stitch צפיפות (גבוהה יותר = קשיח), PVC עובי (שכבות משולשות ברמה צבאית היא הטובה ביותר), מקסימום PSI (+15 דרושים לקשיחות), בניית מסילה (מסילות למינציה מחזיקות מעמד יותר זמן), ואחריות (שנתיים סטנדרטיות). הימנעו מלוחות מתחת ל-400$ — הם משתמשים PVCבתפירה דקה, בצפיפות נמוכה, וירגישו כמו טרמפולינה.'
  problem: מודעות באמזון מראות שהן מתנפחות SUPs בין 250 ל-1,500 דולר עם תמונות זהות. בלי להבין את איכות הבנייה, ייתכן שתקנה לוח שמרגיש רך, מתרגל בצורה גרועה ומתפרק אחרי עונה אחת.
  explanation: 'Drop-stitch איכות הבנייה נמדדת לפי צפיפות התפרים לאינץ'' רבוע — לוחות פרימיום משתמשים ב-10,000+ תפרים למטר רבוע. צפיפות גבוהה יותר אומרת שהקרש שומר על צורה טובה יותר PSIב-High .PVC השכבות החיצוניות משתנות: לוחות תקציב משתמשים בשכבה אחת PVC (0.75 מ"מ); לוחות בינוניים משתמשים בשכבה כפולה (1.2 מ"מ); פרימיום משתמש בשלוש שכבות ברמת צבא (1.5 מ"מ+) עם תפרים מרותכים. הבנייה של מסילות חשובות — מסילות למינציה בהיתוך מדביקות לוחות חזקים יותר מפסילות מודבקות.'
  solution: 'קבע תקציב של לפחות $500 ל-iSUP איכותי שיחזיק מעמד 3-5 שנים. בדוק מקסימום PSI — לוחות מדורגים ל-15+ PSI מבצעים ביצועים טובים משמעותית. חפש drop-stitch מפרטי צפיפות. בדוק אביזרים כלולים: משאבה דו-תאית, ערכת תיקון ותיק גב מרופד מצביעים על מוצר רציני.'
  recommendation: Paddle Board Overstock SUP ה-Explorer 11 משתמש בשלוש שכבות ברמת צבא PVC בצפיפות drop-stitchגבוהה, מדורג עד 18PSI, עם משאבה דו-תאית ותיק גב גלגלי כלול. שילוב זה של איכות בנייה ואביזרים נדיר במחירו.
  faq:
