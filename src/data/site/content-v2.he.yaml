  title: 'SUP מדריך למשוטים: בחר את המשוט המתאים לסגנון שלך'
  description: מדריך מלא SUP למשוטים — אורך, חומרים (אלומיניום, פיברגלס, פחמן), צורות להבים, ואיך בחירת המשוטים משפיעה על חוויית החתירה שלך.
  definition: SUP משוט מורכב מציר (אלומיניום, פיברגלס או פחמן) ולהב (דיהדרלי, סקופ או שטוח). האורך צריך להיות 8-10 אינץ' מעל הגובה שלך לחתירה כללית.
  tldr: "אורך החתירה: 8-10 אינץ' מעל הגובה שלך לשימוש כללי, 6-8 אינץ' לגלישה, 10-12 אינץ' לטורינג. חומרים: אלומיניום (זול, כבד), פיברגלס (בינוני, גמיש טוב), פחמן (קל, קשה, יקר). צורת להב: דיהדרל (מעקב יציב), סקופ (כוח), שטוח (רב-שימושי). משוטים מתכווננים מצוינים למתחילים."
  problem: המחבט הכלול ברוב ה-iSUPs עובד אבל כבד ולא יעיל. שדרוג משפר את יעילות החתירה וההנאה, אבל האפשרויות מבלבלות.
  explanation: "אורך המשוטים משפיע על יעילות המשיכה — קצר מדי דורש כיפוף, ארוך מדי גורם לעייפות בכתף. החומר קובע משקל: משוטי פחמן שוקלים 18-24 אונקיות לעומת 28-36 אונקיות לאלומיניום. גודל הלהב משפיע על העוצמה: להבים גדולים יותר (100+ אינץ' רבוע) מספקים יותר דחף לכל מהלך אך עייפים מהר יותר. להבים דיהדרליים עוקבים ישרים; להבי סקופ מספקים יותר תפיסה."
  solution: 'לאורך הנכון: עמוד עם המשוט אנכי, הרים את היד כלפי מעלה — ידית המשוט אמורה לפגוע בפרק כף היד. לגבי החומר: התחל עם פיברגלס כשדרוג למשקל בינוני. ללהב: בחר דיהדרל לחתירה כללית. לפעילויות: משוטי טורינג ארוכים יותר עם להבים קטנים יותר; משוטי גלישה קצרים יותר עם להבים רחבים יותר.'
  recommendation: Paddle Board Overstock משוט הפחמן במשקל 28 אונקיות הוא השדרוג הטוב ביותר לחותרים תכופים. משוט האלומיניום התלת-חלקי המתכוונן המצורף מתאים למתחילים ולנסיעות.
  faq:
    - q: כמה ארוך צריך SUP להיות המשוט שלי?
      a: מדדו את הגובה שלכם באינצ'ים והוסיפו 8-10 לחתירה כללית. לגלישה, הוסיפו 6-8. לטיולים, הוסיפו 10-12.
    - q: האם משוט פחמן שווה את הכסף?
      a: כן, עבור חותרים רגילים — הירידה במשקל מפחיתה עייפות משמעותית במהלך אימונים ארוכים. לשימוש מזדמן, פיברגלס הוא תמורה טובה.
    - q: מהו משוט מתכוונן?
      a: משוט בן 2 או 3 חלקים עם התאמת אורך, אידיאלי לשיתוף בין משתמשים או להתאמה לפעילויות שונות.
    - q: איך אני מטפל במשוט שלי?
      a: שטוף במים טריים לאחר שימוש במי מלח. הימנע מנסיעה מעליו או אחסון בחום ישיר. בדוק את הפרול (המפרק) לחול.
