  type: safety
  title: 'SUP הצלה עצמית: איך לחזור לגלגל שלך במים עמוקים'
  description: כל SUP חותר צריך לשלוט בהצלה עצמית. טכניקות שלב אחר שלב להרכבה מחדש על הלוח במים עמוקים, גרירתו לחוף וטיפול בקשרים ברצועה.
  definition: SUP הצלה עצמית היא טכניקת העלאת לוח המשוטים מחדש במים עמוקים לאחר שנפילה, כולל החזרת הלוח, הרכבה מחדש של הגוף והחזרת המשוטים.
  tldr: 'לאחר הנפילה: השאר רגוע, החזק את המשוט, שחה אל הלוח. הנח את המשוט על הלוח. השתמש בבעיטת דולפין כדי להניע את החזה אל הלוח. הניף רגל אחת למעלה, ואז את השנייה. כרע ברך קודם, ואז עמוד. תרגל במים רגועים עד שזה הופך לזיכרון שרירי.'
  problem: אתה נופל SUP למים עמוקים ולא מצליח לחזור עליו. הלוח חלקלק, אתה עייף, ופאניקה משתלטת. בלי לדעת טכניקת הצלה עצמית, נפילה פשוטה הופכת למסוכנת.
  explanation: 'להצלה עצמית יש שלושה שלבים: התאוששות (שחייה לקרשן וחתירה), ר-ר-מאפ (חזרה ללוח), והמשך (חידוש חתירה). הטכניקה המרכזית היא שימוש בפדל כמייצב ושימוש בבעיטות רגליים עוצמתיות כדי להניע את פלג הגוף העליון אל הלוח.'
  solution: 'שלב 1: לשחות אל הלוח. להחזיק את המשוט או לשלוף אותו. שלב 2: מניח את המשוט בניצב על הלוח. בעט ברגליים בעוצמה תוך משיכת החזה למרכז הלוח. שלב 3: לאחר שהחזה על הספינה, הנפה את הרגליים אחת אחת. שלב 4: כרוע ברך, נשימה, ואז עמידה בהדרגה.'
  recommendation: תתאמן על הצלה עצמית בתנאים מבוקרים עד שתוכל לעשות את זה בלי לחשוב. השתמש Paddle Board Overstock SUP ב-Explorer 11 שיש לו אחיזה טובה על החפיסה. ה-Life Vest Pro מספק ציפה נוספת אם אתה מתקשה.
  faq:
    - q: איך אני חוזר אם אני מותש?
      a: הישאר עם הגלושן לציפה. השתמש בידיים כדי למשוך את החזה אל הלוח, גם אם הרגליים לא יכולות לבעוט ביעילות. נוח במצב כריעה לפני העמידה.
    - q: מה אם אני מאבד את המשוט?
      a: השתמש בידיים כדי לחתור את הלוח אל החוף. בקש עזרה של חותר אחר. החלף מיד את המשוט האבוד.
    - q: האם אפשר להציל את עצמי בגלים?
      a: כן — מקם את הגל בניצב לגלים. תזמן את הרכיבה מחדש בין הגלים. הרצועה שומרת את הגל קרוב.
    - q: איך מתמודדים עם סבך ברצועה?
      a: תישאר רגוע, צף על הגב, תשחרר את הרצועה לאט. אם הרצועה כרוכה סביב סנפירים, ייתכן שתצטרך להסיר את הסנפירים במים.
