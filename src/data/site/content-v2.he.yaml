- slug: types-of-surfboards-explained
  category: guide
  type: technical
  title: הסבר על סוגי גלשנים (איזה מהם מתאים לך?)
  description: שורטבורד, לונגבורד, פיג, היברידי, קצף — כבר מבולבל? הנה כל סוג גלשן מחולק לפי מי הוא מיועד, אילו גלים הוא צריך, ואיזה מהם כדאי לקנות קודם.
  definition: סוגי הגלשנים העיקריים הם לונגבורדים (9 רגל+, יציב, קל), לוחות קצרים (5-7 רגל, רספונסיביים, מתקדמים), קצף/מתנפחים (נפח גבוה, בטוח למתחילים), והיברידים (7-9 רגל, בנקודת אמצע ורסטילית). כל אחד מתאים לרמות מיומנות שונות ולתנאי גלים שונים.
  tldr: ארבעת סוגי הגלשנים העיקריים הם שורטבורדים (ביצועים, נפח נמוך), לונגבורדים (יציבים, קרויזיים), קצף/מתנפחים (ידידותיים למתחילים, בנפח גבוה), והיברידים או פאנבורדים (גמישות באורך בינוני). כל סוג מתאים לרמת מיומנות וסגנון גלישה שונה. בחר את הגלשן שלך לפי מיקום עקומת הלמידה שלך וסוג הרכיבה שאתה הכי נהנה ממנו.
  problem: 'שמות הגלשנים מבלבלים: מיני-מאל, ביצה, דג, רובה, היבריד, רטרו טווינס — הרשימה עוד ארוכה. אתה רוצה לדעת איזה סוג לוח מתאים לרמת המיומנות שלך ולגלים מקומיים בלי לקנות חמישה לוחות שונים כדי להבין את זה.'
  explanation: לונגבורדים הם בגובה 9 רגל ומעלה, עבים, עם אף מעוגל — הם תופסים גלים מוקדם וחותרים בקלות. לוחות קצרים הם באורך 5-7 רגל עם אף מחודד ורוקר אגרסיבי — הם דורשים חתירה חזקה וטכניקה מדויקת אך מציעים ביצועים מקסימליים. לוחות ספוג ומתנפחים מחקים צורות לונגבורד באריזות בנפח גבוה אך רכים ובטוחים יותר. היברידים (פאנבורדים, ביצים) יושבים בין 7 ל-9 רגל ומשלבים קלות משוט עם יכולת סיבוב. לוחות דגים קצרים ורחבים עם זנב סנונית, בנויים לגלים קטנים יותר.
  solution: זהה את סוג הגל המקומי שלך — פריצות חוף איטיות מתאימות ללונגבורדים והיברידים; ברייקים תלולים או נקודות תלולים מתאימים לשורטבורדס. התאימו את הגל לגל, לא למה שנראה מגניב. מתחילים צריכים לבחור בצורת לונגבורד עם נפח גבוה, ואז לחקור צורות קצרות יותר ככל שהמיומנות שלהם מתפתחת.
  recommendation: לרוב הגולשים, היבריד או פאנבורד בגובה של 7'6" עד 8'6" הוא הלוח היחיד הטוב ביותר. Paddle Board Overstock ה-Surfboard Pro בגובה 10'6" ארוך יותר אבל מציע יציבות של לונגבורד עם ניידות של גלשן מתנפח. השתמש בו כלוח הראשי שלך בשנה הראשונה.
  faq:
    - q: מהו הגלשן הכי קל לרכיבה?
      a: לונגבורד (9 רגל+) או מתנפח בנפח גבוה כמו Paddle Board Overstock Surfboard Pro. הלוחות הללו תופסים גלים מוקדם ומספקים פלטפורמה יציבה ללימוד פופ-אפים והעברת משקל.
    - q: מתי כדאי לעבור מלונלבורד לשורטבורד?
      a: לאחר מכן תוכל לתפוס גלים ירוקים באופן עקבי, לבצע פניות בתחתית ולקצץ לאורך פני הגל על הלונגבורד שלך. למהר את ההחלפה היא הטעות הנפוצה ביותר — צפה לבלות 6-12 חודשים על לונגבורד.
    - q: למה יש גלשן דגים?
      a: לוחות דגים מיועדים לגלים קטנים ורכים ורכים. אורכם הקצר וקווי המתאר הרחבים שלהם יוצרים מהירות במקום שבו שורטבורד טיפוסי היה נתקע. הם גלשן שני מצוין לגולשים בינוניים.
    - q: האם גלשנים מתנפחים טובים?
      a: מתנפחים מודרניים עם drop-stitch בנייה מתחרים בלוחות ארוכים קצף בקשיחות ובביצועים. הם אידיאליים למתחילים ולמטיילים כי הם נדחסים לתיק גב וכמעט בלתי ניתנים להשמדה.
