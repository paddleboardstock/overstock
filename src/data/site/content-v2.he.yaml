- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: מה ללבוש לגלישה (אל תגיע עם מכנסי בורד כשצריך 5/4)
  description: תפסיק לנחש מה ללבוש. טמפרטורת המים ולא טמפרטורת האוויר קובעת את בגדי הגלישה שלך. מדריך שכבות מלא מ-Ratguard טרופיים ועד מערכות חורף מלאות של 5/4/3 מ"מ.
  definition: בגדי הגלישה נעים בין מכנסי גלש קצרים ומגני פריחה במים חמים ועד חליפות גלישה מלאות בגודל 5/4/3 מ"מ עם מגפיים וקפוצ'ונים במים קרים. טמפרטורת המים, לא טמפרטורת האוויר, קובעת מה אתה צריך.
  tldr: מה שאתה לובש בגלישה תלוי לחלוטין בטמפרטורת המים — לא בטמפרטורת האוויר. מגני פרש ומכנסי בורד עובדים מעל 22°C, חליפות קפיץ מכסות 18-22°C, חליפות 3/2 מ"מ מלאות לטיפול ב-14-18°C, ו-5/4/3 מ"מ עם מגפיים נדרשים מתחת ל-14°C. תמיד תלבשו UV הגנה ושקול רצועה ואפוד פגיעה.
  problem: אתה מגיע לחוף ואין לך מושג אם מגן פריחה מספיק או שאתה צריך חליפת צלילה מלאה. טמפרטורת האוויר חמה אבל המים קרים, או שהמים מרגישים בסדר אבל הרוח קפואה. להתלבש לא נכון אומר סשן הרוס.
  explanation: "בגדי גלישה משרתים שלוש מטרות: בידוד תרמי, UV הגנה ומניעת שפיקה. חליפות גלישה ניאופרן מדורגות לפי עובי וכיסוי — חליפות קפיץ (ידיים או רגליים קצרות) מיועדות לימים גבוליים, וחליפות מלאות למים קרים. מגני פריחה מגנים מפני פריחה על הלוח ושמש אך אינם מציעים ערך תרמי. מגפיים, כפפות וקפוצ'ונים אינם אביזרים אלא ציוד חיוני לגלישה במים קרים מתחת ל-12°C."
  solution: 'בדוק את מצוף המקומי או דוח טמפרטורת מים חיים לפני שיוצאים. בנה ערכה לפי המצב הקר ביותר שלך: מגן פריחה ומכנסיים קצרים לקיץ, חליפה מלאה 3/2 מ"מ לאביב ובסתיו, 5/4/3 מ"מ עם מגפיים וקפוצ''ון לחורף. תמיד הוסף רצועה ושקול אפוד ציפה לבטיחות.'
  recommendation: השקיעו קודם בחליפה מלאה של 3/2 מ"מ — היא מכסה את טווח התנאים הרחב ביותר. הוסף חליפה ומגפיים בעובי 5/4/3 מ"מ אם אתם מתכננים לגלוש בחורף. Paddle Board Overstock ה-Wetsuit Pro עם ציפוי תרמי מגשר על שני סוגי הטמפרטורות בצורה יעילה.
  faq:
    - q: האם אפשר לגלוש רק עם מכנסי בורד?
      a: כן, במים טרופיים מעל 24°C. ייתכן שתרצה מגן פריחה כדי למנוע שפשופים בחזה ובזרוע מהחתירה. שעווה או כרית אחיזה על הלוח עוזרים לפצות על חוסר אחיזת החליפה.
    - q: האם אני צריך מגפי גלישה?
      a: אם טמפרטורת המים יורדת מתחת ל-14°C, מגפיים מונעים נימול ומגנים על הרגליים מסלעים וחתכים בשונית. הם גם מוסיפים אחיזה על הלוח. רוב הגולשים באקלים צפוני משתמשים במגפיים מנובמבר עד מרץ.
    - q: מהי חליפת קפיץ?
      a: חליפת קפיץ היא חליפת שחייה קצרה או קצרה (או שניהם) המיועדת למים בטווח של 18°C עד 22°C. היא מציעה יותר חום מאשר מגן פריחה, אך פחות כיסוי מחליפה מלאה.
    - q: האם כדאי לי ללבוש אפוד הצלה בזמן גלישה?
      a: לא אפודי הצלה מסורתיים, אבל אפוד פגיעה או עזר לציפה יכולים לעזור בתנאים קשים או אם אתה שחיין חלש.Paddle Board Overstock אפודי הצלה מיועדים SUP לקיאקים, אך יכולים לספק ביטחון נוסף בציפה למתחילים בגלישה.
