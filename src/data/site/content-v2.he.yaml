  title: 'SUP מדריך מידות: הסבר על אורך, רוחב ונפח'
  description: מצא SUP את הגודל הנכון בהתאם למשקל, רמת המיומנות וסגנון החתירה שלך. האורך קובע את המעקב, הרוחב קובע יציבות, והנפח קובע את קיבולת המשקל.
  definition: SUP הגודל מוגדר לפי אורך (מהירות והחלקה), רוחב (יציבות ראשונית), עובי (יציבות ונפח משניים), ונפח בליטר (קיבולת משקל כוללת).
  tldr: 'סיבוב SUPsכללי: 10''6"-11''6" x 32"-34" x 6" (220-280 ליטר). טיולים: 12''-14'' x 30"-32" (280-350 ליטר). גלישה: 8''-10'' x 30"-32" (140-220 ליטר). מתחילים צריכים רוחב מעל 32" ונפח שעולה על משקל הגוף ב-60-80 ליטר. המשקל שלך בק"ג ועוד 60 ליטר הוא היעד המינימלי ליציבות.'
  problem: כל SUP מותג מפרט את הלוחות בגודל, אינץ' וליטרים, אבל בלי לדעת איך המדידות האלה מתורגמות לתחושה אמיתית, אתה מסתכן בקניית לוח שמתהפך, איטי או לא יכול לתמוך במשקל שלך.
  explanation: "האורך קובע כמה מהר הלוח מתקדם וכמה טוב הוא עוקב בקו ישר. לוחות ארוכים יותר (12 רגל+) מחליקים בין תנועות ומחזיקים קו. לוחות קצרים יותר (מתחת ל-10 רגל) מסתובבים בקלות אך דורשים מתגי משוטים תכופים יותר. רוחב קובע יציבות ראשית — יציבות בעמידה. לוח בגודל 30 אינץ' מרגיש גמיש למתחילים; 34 אינץ' מרגיש כמו רציף. העובי קובע את הנפח — לוח עבה יותר מרחף גבוה יותר אך תופס יותר רוח. נפח בליטרים הוא המדד הטוב ביותר: הגלש הטעון (אתה ועוד ציוד) צריך לשקוע 2-4 אינץ' במנוחה."
  solution: 'התאם את מידות הלוח שלך לשלושה גורמים: המשקל שלך (שקובע את הנפח המינימלי), הפעילות העיקרית שלך (קובעת את האורך), ורמת המיומנות שלך (קובעת את הרוחב). למתחילים, כפל את המשקל ב-2.2 כדי לקבל מינימום ליטרים. לבינוני, כפל ב-1.8. למתקדם, כפול ב-1.4.'
  recommendation: Paddle Board Overstock SUP ה-Explorer 11 בגודל 11' x 33" x 6" עם 260 ליטר מתאים לרוב הרוכבים עד 100 ק"ג לחתירה כללית. שדרוג SUP ל-Tour 12 בגודל 12' x 31" לשיפור מהירות הטורינג והגלישה.
  faq:
    - q: איזה SUP מידה אני צריכה לפי המשקל שלי?
      a: 'לרוכבים מתחת ל-70 ק"ג: 10-11'' x 32" (220-260 ליטר). ל-70-90 ק"ג: 11-12'' x 33" (260-300 ליטר). ל-90-110 ק"ג: 11-12'' x 34" (300-350 ליטר). ליותר מ-110 ק"ג: 12'' x 34-36" (350 ליטר+).'
    - q: האם ארוך SUP יותר מהיר יותר?
      a: כן. ללוחות ארוכים יותר יש יחס אורך לרוחב טוב יותר, מה שמפחית גרר. טורינג של 14 רגל SUP מהיר משמעותית מלוח כללי של 11 רגל באותו מאמץ חתירה.
    - q: איזה SUP רוחב יציב למתחילים?
      a: 33-34 אינץ' הוא הנקודה המתוקה למתחילים עד 90 ק"ג. מתחת ל-32 אינץ' דורש איזון טוב. מעל 34 אינץ' יציב מאוד אבל איטי וקשה יותר לחתור ברוח.
    - q: האם אפשר להשתמש בלוח מסביב לסיבוב הופעות?
      a: כן, לסיורים קצרים מתחת ל-10 ק"מ. למרחקים ארוכים יותר, לוח טורינג ייעודי עוקב טוב יותר ומכסה מרחק בצורה יעילה יותר.
