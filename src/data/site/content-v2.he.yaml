- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP הידרציה והגנה מפני השמש: שמרו על עצמכם על המים'
  description: אסטרטגיות חיוניות להידרציה והגנה SUP מפני שמש לחותרים. התייבשות וכוויות שמש הן הבעיות הנפוצות SUP ביותר — כיצד למנוע את שניהם במהלך מפגשים ארוכים.
  definition: SUP הידרציה פירושה שמירה על איזון נוזלים במהלך החתירה באמצעות שתיית מים סדירה. הגנה מפני שמש כוללת שימוש ב-SPF, בגדים מגנים וזמני תזמון כדי להימנע משיאUV.
  tldr: שתו 500 מ"ל מים לשיט. הביאו יותר ממה שאתם חושבים שאתם צריכים — שלפוחית שתן של 2 ליטר או כמה בקבוקים. מרחו קרם הגנה עמיד למים SPF 50+ לפני החתירה ומרחו שוב כל שעתיים. לבשו כובע, משקפי שמש עם רצועה ובגדים עם דירוג UPF. הימנעו מחתירה בין 11 בבוקר ל-3 אחר הצהריים UV כשהמצב הכי חזק.
  problem: אתה עובר SUP סשן נהדר, אבל אחרי שעה יש לך כאב ראש, יובש בפה, והעור שלך בוער. התייבשות וכוויות שמש מתגנבות אליך כי המים שומרים עליך קריר.
  explanation: ההשתקפות מהמים מגבירה UV את החשיפה עד 40%. אפקט הקירור של המים והרוח מסתיר את כוויות השמש עד שמאוחר מדי. הזיעה מהחתירה מגדילה את אובדן הנוזלים, ולעיתים אין מקום למלא מים על המים. התייבשות פוגעת בשיווי המשקל ובקבלת ההחלטות, ומגבירה את הסיכון לתאונות.
  solution: חבר בקבוק מים או שלפוחית לחות למערכת הבונג'י של הלוח. שתה כל 15 דקות, בין אם אתה צמא ובין אם לא. מרח קרם הגנה SPF 50+ 30 דקות לפני השיגור. חבש כובע רחב שוליים, משקפי שמש מקוטבים עם רצועה,+ ומגן פריחה UPF 50. מרח מחדש קרם הגנה כל שעתיים.
  recommendation: השתמש בשלפוחית לחות הקשורה לטבעות ה-D הקדמיות של Paddle Board Overstock SUPה-. השתמש+ במגן פריחה UPF 50 מתחת PFDל. השתמש בקרם הגנה עמיד למים שנשאר על זיעה ומים.
  faq:
    - q: כמה מים כדאי להביא SUP לטיול?
      a: מינימום 1 ליטר לשעה. למפגש של שעתיים, תביא 2 ליטר. יותר במזג אוויר חם. שלפוחית שתן הידרציה עובדת הכי טוב.
    - q: איזה סוג קרם הגנה הכי מתאים SUPלך?
      a: עמיד למים, SPF 50+ בטווח רחב. קרמי הגנה מינרליים (תחמוצת אבץ, דו-תחמוצת טיטניום) בטוחים לשוניות ומחזיקים מעמד זמן רב יותר.
    - q: האם המים באמת משתקפיםUV?
      a: כן — מים משקפים עד 40% UV מהקרינה, כלומר אתה מקבל UV מלמעלה ומלמטה. זה מעלה משמעותית את סיכון השריפה.
    - q: האם אני יכול להיכוויות מהשמש דרך מגן ראש?
      a: מגני פריחה סטנדרטיים מספקים הגנה מינימלית UV (בערך UPF 10-20). חפשו בגדים בדירוג UPF 50+ להגנה מלאה.
