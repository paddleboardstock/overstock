  title: 'SUP מדריך עוגן: הישארו במקום בזמן דיג או צילום'
  description: מדריך מלא SUP לעיגון — סוגי עוגנים (פטריות, מתקפל, יתד), הגדרת עגלת עוגן, טכניקות פריסה ושיקולי בטיחות לשמירה על מיקום.
  definition: SUP עוגן הוא משקולת המחוברת לחבל שמחזיק את הלוח במקומו נגד רוח וזרם. סוגים נפוצים כוללים עוגני פטריה, עוגנים מתקפלים ועמודי מארב.
  tldr: השתמש בעוגן פטריות (1.5-3 פאונד) לתחתית בוצית או חולית, עוגן מתקפל לקרקעיות סלעיות, או מוט מארב למים רדודים עם תחתית רכה. העוגן צריך להיות במשקל 1.5-3 פאונד לתנאים רגועים, 3-5 פאונד לרוח וזרם. תמיד השתמש בעגלת עוגן כדי לכוון את המיקום ולדעת מתי לשחרר.
  problem: אתה מוצא את נקודת הדיג המושלמת, אבל הרוח והזרם מסיטים אותך מהמקום כל כמה דקות. בלי עיגון, SUP דיג וצילום הם תרגילים מתסכלים בשינויים מתמידים.
  explanation: עוגן פועל על ידי גרירת הקרקעית עד שהוא נתפס. עוגני פטריות קבורים בתחתית רכה ומספקים אחיזה טובה בחול ובבוץ. עוגנים מתקפלים כוללים פלוקים החודרים לתחתית קשה או סלעית. עמודי מארב פועלים במים רדודים על ידי דחיפה ישירה לקרקעית.
  solution: התקן מערכת עגלת עוגן (חבל עם טבעת הזזה בצד אחד של הלוח) כדי לכוון את נקודת החיבור לעוגן. חבר 50-75 רגל של חבל לעוגן. פרוס זרם נגד הרוח או זרם עולה מהמיקום הרצוי. השתמש במערכת שחרור מהיר כדי להתנתק במקרי חירום. לעולם אל תעגן בזרם חזק או במקום שבו אי אפשר להחזיר את העוגן בקלות.
  recommendation: עוגן מתקפל במשקל 3 פאונד עם 50 רגל של חבל מתאים לרוב SUP תנאי הדיג. הוסף מערכת עגלת עוגן באמצעות טבעות ה-D Paddle Board Overstock SUP ב-Explorer 11 שלך.
  faq:
    - q: לאיזה גודל עוגן אני צריךSUP?
      a: 1.5-3 פאונד לאגמים רגועים ונהרות איטיים. 3-5 פאונד לאזורים חופיים עם רוח או זרם. עוגנים גדולים קשה לשלוף.
    - q: כמה חוט עוגן אני צריך?
      a: כוונת 5:1 (5 רגל חוט לכל רגל עומק) היא סטנדרטית. בעומק של 10 רגל מים, יש להשתמש ב-50 רגל של חוט.
    - q: האם עיגון מסוכן על SUP?
      a: רק אם אתה עוגן בזרם או רוח חזקה מספיק כדי להפוך את הלוח. תמיד השתמש במערכת שחרור מהיר שניתן לנתק מיד.
    - q: האם אפשר לעגן במים כלשהי?
      a: בדוק תקנות מקומיות. יש אזורים שמגבילים עגינה כדי להגן על עשבי ים או בתי גידול ימיים. לעולם אל תעגנו על שוניות אלמוגים.
