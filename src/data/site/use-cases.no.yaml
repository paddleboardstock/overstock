cases:
  - id: beginner
    title: 'Vannsport for nybegynnere'
    desc: 'Stabile SUP-brett og kajakker for førstegangsbrukere.'
    scenario: >-
      'En familie som besøker en innsjø i helgen vil prøve stand up padling. De trenger stabilt utstyr som er lett å sjøsette, med tydelige sikkerhetsinstruksjoner.'
    solution: >-
      'SUP Explorer 11 gir bred stabilitet for nybegynnere. Life Vest Classic sikrer CE-sertifisert oppdrift. Dobbelvirkende pumpe blåser opp begge brettene på under 10 minutter.'
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 'Friluftsliv og utforskning'
    desc: 'Bærbare kajakker og båter for elver, innsjøer og kystturer.'
    scenario: >-
      'En friluftsentusiast planlegger en ukelang elvetur og trenger en båt som pakkes lite, blåses opp i leiren og håndterer varierende strøm.'
    solution: >-
      'Kayak Lite får plass i en ryggsekk og blåses opp på under 4 minutter. Drop-stitch-konstruksjonen håndterer innsjøer, rolige elver og kystpadling.'
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: 'Profesjonell drift'
    desc: 'Kommersielle RIB for turoperatører og nødrespons.'
    scenario: >-
      'En kystturoperatør trenger en flåte av holdbare båter for daglige turer i varierende sjøforhold, som oppfyller kommersielle sikkerhetsforskrifter.'
    solution: >-
      'RIB 330 og RIB 450 Patrol har skrog i glassfiber med dyp V og Hypalon-flyterør for holdbarhet i all slags vær. Flere enheter kan settes inn med jevn ytelse.'
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: 'Familierekreasjon'
    desc: 'Romslige gummibåter for dagsturer, fiske og vannsport.'
    scenario: >-
      'En familie på fire vil ha en stabil båt for helgeturer på innsjøen, fisketurer og å slepe en tube for barna.'
    solution: >-
      'AirDeck 360 tar opptil fem personer med forsterket luftdekk. Den blåses opp ved sjøsettingen, får plass i bilen og håndterer både rolige innsjøer og beskyttede kystfarvann.'
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
