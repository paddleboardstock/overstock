cases:
  - id: beginner
    title: Nybegynnerpadling
    desc: Stabile oppblåsbare SUP-brett for førstegangspadlere.
    scenario: En familie som besøker en innsjø i helgen ønsker å prøve paddleboarding. De trenger stabilt, lett utstyr å sette ut med klar sikkerhetsveiledning.
    solution: SUP Explorer 11 gir bredkroppsstabilitet for nybegynnere. Life Vest Classic sikrer CE-sertifisert oppdrift. Oars & Pump Set blåser opp brettet på under 10 minutter.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Turer og utforskning
    desc: Langdistanse oppblåsbare SUP-brett for innsjøer, elver og kystturer.
    scenario: En friluftsentusiast planlegger en ukelang padletur og trenger et brett som pakker lite, blåser opp på leirplassen og holder kursen på åpent vann.
    solution: Ocean Voyager Series glir effektivt med en turprofil og holder kursen i vind og bølger. Dets drop-stitch-konstruksjon blåses opp til 15 PSI for hardbrettstivhet.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga og trening
    desc: Ekstra brede, stabile plattformer for yoga, trening og avslapning.
    scenario: En yogautøver ønsker et flytende studio for morgenseanser på stille vann, med nok dekkområde til å holde hver posisjon.
    solution: Flowing Lotus Series har full lengde dekktape og bred bjelke for stødighet i posisjoner. Det kan også brukes som en stabil plattform for lett trening.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Familieferie
    desc: Komplette SUP-pakker for helgedager på innsjøen og ferie.
    scenario: En familie på fire ønsker stabile brett for helgeturer til innsjøen og strandferier — utstyr som kan pakkes i bilen og blåses opp på minutter.
    solution: Tropical Breeze Series er et stabilt allroundbrett hele familien kan dele, mens Medusa Glow Series er lettere og kortere for barn. Begge pakkes i ryggsekker for enkel transport.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
