  title: 'Weerplanning voor Watersport: Lees de Voorspelling als een Professional'
  description: Hoe maritieme weersvoorspellingen te lezen voor SUP, surfen en varen. Het begrijpen van fronten, druksystemen, windpatronen en weerswaarschuwingen om veilige sessies te plannen.
  definition: Weerplanning betekent het interpreteren van maritieme voorspellingen — windsnelheid en richting, deininghoogte en -periode, neerslag, zichtbaarheid en waarschuwingen voor slecht weer.
  tldr: 'Controleer voor elke sessie drie voorspellingen: wind, golfslag en weer. Beste omstandigheden: lichte offshore wind, matige golfslag, hoge of stijgende luchtdruk. Vermijd: onweersbuien, harde offshore wind, mist en snel dalende luchtdruk.'
  problem: Je rijdt naar de kust op basis van een weersvoorspelling voor 3 dagen die goede omstandigheden beloofde, alleen om 25 knopen wind en regen te vinden. Maritiem weer is moeilijk te voorspellen.
  explanation: Hoge druk brengt stabiel weer en lichte winden. Lage druk brengt wind en stormen. Het drukverschil bepaalt de windsnelheid. Koude fronten brengen plotselinge wendingen van de wind. Lokale effecten zoals zeebries kunnen de algemene voorspelling overrulen.
  solution: "Gebruik meerdere bronnen: Windy.com, NOAA, lokale surfcamera's. Bekijk de voorspellingen 24 uur van tevoren en controleer ze opnieuw op de ochtend zelf. Zoek naar consistente voorspellingen tussen modellen. Leer lokale microklimaten kennen."
  recommendation: Maak Windy.com als bladwijzer voor je lokale plekken. Draag een telefoon in een waterdichte hoes. Voor het varen, draag een VHF-radio voor weersuitzendingen. Bij twijfel, blijf aan wal.
  faq:
    - q: Welk weer moet ik vermijden voor SUP?
      a: Onweersbuien (bliksem), mist (nul zicht), offshorewind boven 10 knopen, winden boven 20 knopen, dalende druk.
    - q: Hoe nauwkeurig zijn maritieme voorspellingen?
      a: Voorspellingen voor 3 dagen zijn ongeveer 80% nauwkeurig. Voorspellingen voor de dag ervoor zijn 90% nauwkeurig voor wind.
    - q: Wat is een goede barometrische trend voor watersport?
      a: Stijgende of stabiele druk duidt op verbeterende omstandigheden. Daling van de druk (1+ mb/uur) duidt op een naderende storm.
    - q: Kan ik SUP in de mist?
      a: Niet aanbevolen. Als je in de mist terechtkomt, gebruik een kompas of GPS, blaas om de 30 seconden op een fluitje en blijf dicht bij de kust.
