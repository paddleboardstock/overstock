- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Ankerhandleiding: Blijf op je plaats tijdens het vissen of fotograferen'
  description: Complete gids voor SUP verankering — ankertypen (paddenstoel, vouw, haring), opstelling van het ankerblok, inzettechnieken en veiligheidsaspecten voor het op zijn plaats blijven.
  definition: Een SUP anker is een gewicht dat aan een touw is bevestigd en het bord op zijn plaats houdt tegen wind en stroom. Veelvoorkomende typen zijn paddenstoelenankers, vouwankers en paalankers.
  tldr: Gebruik een paddenstoelenanker (1,5-3 lb) voor modderige of zanderige bodems, een opklapbaar anker voor rotsachtige bodems, of een staak voor ondiep water met zachte bodems. Het anker moet 1,5-3 lb zijn bij rustige omstandigheden, 3-5 lb bij wind en stroom. Gebruik altijd een ankertrolley om de positie aan te passen en weet wanneer je moet lossen.
  problem: Je vindt de perfecte visplek maar wind en stroming drijven je elke paar minuten van positie. Zonder te ankeren, zijn SUP vissen en fotografie frustrerende oefeningen in constant herpositioneren.
  explanation: Een anker werkt door over de bodem te slepen totdat het vastgrijpt. Champignonankers begraven zich in zachte bodems en bieden goede houvast in zand en modder. Vouwankers hebben flenzen die in harde of rotsachtige bodems graven. Afspanpalen werken in ondiep water door rechtstreeks in de bodem te duwen.
  solution: Installeer een anker-trolleysysteem (een lijn met een glijdende ring aan één kant van het board) om het aanhechtingspunt van het anker aan te passen. Bevestig 15-23 meter touw aan het anker. Zet uit tegen de wind of stroom van de gewenste positie. Gebruik een snelontgrendelingssysteem om in noodgevallen los te koppelen. Anker nooit in sterke stroming of op plaatsen waar u het anker niet gemakkelijk kunt ophalen.
  recommendation: Een vouwanker van 3 lb met 50' touw werkt voor de meeste SUP visomstandigheden. Voeg een anker-trolley-systeem toe met behulp van de D-ringen op uw Aquafarer SUP Explorer 11.
  faq:
    - q: Welke maat anker heb ik nodig voor SUP?
      a: 1,5-3 lb voor rustige meren en trage rivieren. 3-5 lb voor kustgebieden met wind of stroom. Te grote ankers zijn moeilijk op te halen.
    - q: Hoeveel ankerlijn heb ik nodig?
      a: Een 5:1-schaal (5 voet lijn voor elke 1 voet diepte) is standaard. In 10 voet water, gebruik 50 voet lijn.
    - q: Is ankeren gevaarlijk op een SUP?
      a: Alleen als je ankert bij een stroming of wind die sterk genoeg is om het board te laten kapseizen. Gebruik altijd een snel-sluitsysteem dat direct losgemaakt kan worden.
    - q: Kan ik in elk water ankeren?
      a: Controleer de lokale regelgeving. In sommige gebieden is ankeren beperkt om zeegras of mariene habitats te beschermen. Anker nooit op koraalriffen.
