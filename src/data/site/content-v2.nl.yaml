  description: Beoordeling van de Aquafarer Life Vest Pro — een door USCG goedgekeurd opblaasbaar reddingsvest met 33 lb drijfvermogen. Ideaal voor SUP en kajakken waar bewegingsvrijheid belangrijk is.
