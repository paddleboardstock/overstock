- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Windomstandigheden voor SUP: Hoe wind je peddel beïnvloedt'
  description: Hoe windsnelheid en -richting SUP peddelen beïnvloeden. Het begrijpen van wind van zee versus wind vanaf de kust, het lezen van windvoorspellingen, peddeltechnieken voor wind en wanneer aan wal te blijven.
  definition: Windomstandigheden bepalen de veiligheid van SUP. Offshore wind (van land naar zee) duwt je weg. Onshore wind (van zee naar land) duwt je naar de kust. Zijwind veroorzaakt dat het board draait.
  tldr: 'Maximale veilige wind voor beginners: 10 knopen. Gemiddeld niveau: 15 knopen. Gevorderd: 20 knopen. Offshore wind is het gevaarlijkst. Peddel eerst tegen de wind in. Bij zijwind, peddel iets tegen de wind in richting de bestemming. Kniel bij harde wind om je profiel te verkleinen.'
  problem: Je peddelt uit bij rustige omstandigheden, maar 30 minuten later is de wind aangetrokken en heb je moeite om terug te keren. Wind is de meest onderschatte SUP veiligheidsfactor.
  explanation: Wind beïnvloedt SUP meer dan enig ander peddelvaartuig omdat je staat, waardoor een zeileffect ontstaat. Een wind van 10 knopen veroorzaakt veel meer weerstand op een staande peddelaar dan op een zittende kajakker. Wind uit zee duwt je weg van de veiligheid. Zijwind veroorzaakt dat de neus gaat zwiepen.
  solution: 'Controleer de windsnelheid en -richting voordat je gaat peddelen. Gebruik de Beaufortschaal: Kracht 3 (7-10 knopen) voor beginners, Kracht 4 (11-16) voor gevorderden. Peddel eerst tegen de wind in. Als je in een wind van zee wordt getroffen, peddel dan onder een hoek van 45 graden ten opzichte van de wind. Kniel bij harde wind.'
  recommendation: Gebruik voor elke sessie een windvoorspellingsapp (Windy, Windfinder). De Aquafarer SUP Tour 12 presteert beter in de wind dan bredere boards. Bij winderige omstandigheden, gebruik kortere peddelslagen en een hogere cadans.
  faq:
    - q: Welke windrichting is het veiligst voor SUP?
      a: Wind aan de kust (richting land waaiend) is het veiligst — het duwt je terug. Wind uit zee is het gevaarlijkst.
    - q: Hoe peddel ik bij zijwind?
      a: Peddel meer aan de loefzijde om afdrift tegen te gaan. Draai het board tegen de windrichting van je bestemming in. Een dieper centraal vin helpt.
    - q: Kan ik peddelen bij wind van 20 knopen?
      a: Alleen als men ervaring heeft in beschutte wateren. Beginners zouden niet boven 10 knopen moeten peddelen.
    - q: Hoe beïnvloeden windstoten SUP?
      a: Vlagen veroorzaken plotselinge balansproblemen. Bij winderige omstandigheden, verlaag je houding en wees voorbereid op plotselinge verschuivingen.
