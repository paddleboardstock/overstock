- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Opblaasbare SUP Onderhoud: Houd je board jarenlang mee'
  description: Correcte opblaasbare SUP onderhoud verlengt de levensduur van het board aanzienlijk. Reinigen, drogen, klepzorgen, UV bescherming en seizoensopslagtips voor drop-stitch paddleboards.
  definition: Onderhoud van opblaasbare SUP omvat schoonmaken na gebruik, goed drogen, inspectie van de klep, UV bescherming, en correct opbergen om delaminatie, schimmel, materiaalachteruitgang en luchtlekken te voorkomen.
  tldr: Spoel je board na elke sessie in zout water af met vers water. Droog volledig voordat je het leeg laat lopen en opbergt. Controleer het ventiel op vuil en smeer de O-ring jaarlijks. Bewaar opgeblazen (op half PSI) op een koele, donkere plaats. Vermijd langdurige UV-blootstelling die PVC aantast. Plak kleine gaatjes onmiddellijk met de bijgeleverde reparatieset.
  problem: Na een seizoen ontwikkelt uw opblaasbare SUP langzame lekken, laat het dekpad aan de randen los en voelt de PVC stijver aan. Het negeren van basisonderhoud veroorzaakt voortijdige veroudering die volledig te voorkomen is.
  explanation: PVC degradeert onder UV straling. Zoutkristallen uit zeewater werken in naden en kleppen, waardoor microlekkages ontstaan. Ingesloten vocht bevordert de groei van schimmel die drop-stitch draden aantast. Klepringen van de kleppen drogen uit en verliezen hun afdichting. Vuil en zand slijten in het dekpad-lijm, waardoor de randen omhoog komen.
  solution: 'Na elke sessie: spoel het board, de vinnen en de pomp af met schoon water. Veeg de deckpad schoon. Open het ventiel om vastgehouden water af te voeren. Laat het board in de schaduw drogen voordat je het laat leeglopen. Maandelijks: inspecteer het ventiel en breng siliconensmeermiddel aan op de O-ring. Seizoensgebonden: was met milde zeep en water, controleer op gaten.'
  recommendation: Volg de Aquafarer verzorgingsgids die bij uw board is geleverd. Gebruik het reparatiepakket onmiddellijk bij elk lek. Bewaar het board in de tas in een temperatuurgecontroleerde ruimte uit direct zonlicht.
  faq:
    - q: Kan ik mijn opblaasbare SUP het hele seizoen opgeblazen laten?
      a: Ja, maar bewaar uit direct zonlicht en bij de helft van de maximale PSI (8-10 PSI) om de spanning op de naden te verminderen. Volledig oppompen vlak voor gebruik.
    - q: Hoe maak ik schimmel van mijn SUP schoon?
      a: Meng milde zeep met warm water en schrob met een zachte borstel. Gebruik voor hardnekkige schimmel een verdunde oplossing van witte azijn (1:4). Vermijd bleekmiddel.
    - q: Moet ik het ventiel smeren?
      a: Ja, jaarlijks. Verwijder de ventielkern, breng siliconenvet aan op de O-ring en plaats hem opnieuw. Dit voorkomt luchtlekken.
    - q: Hoe bewaar ik mijn SUP voor de winter?
      a: Maak grondig schoon en droog. Laat volledig leeglopen, rol losjes op (vermijd scherpe vouwen) en bewaar op een koele, donkere, droge plaats. Vermijd vrieskou.
