  title: 'Wetsuitverzorging: Laat je neopreen 2x langer meegaan'
  description: Juiste verzorging van een wetsuit verlengt de levensduur van 1 seizoen tot 3+. Spoel-, droog-, opslag- en reparatietips voor neopreenwetsuits. Vermijd veelgemaakte fouten die wetsuits voortijdig beschadigen.
  definition: Het verzorgen van een wetsuit houdt in dat het na elk gebruik met schoon water wordt afgespoeld, uit direct zonlicht wordt gedroogd, plat of aan een brede hanger wordt opgeborgen, en periodiek wordt gereinigd om zout, bacteriën en geuren te verwijderen.
  tldr: Spoel je wetsuit binnen en buiten af met schoon water direct na elke sessie. Laat hem binnenstebuiten drogen in de schaduw op een brede plastic hanger. Bewaar plat of opgevouwen op een koele, droge plaats. Laat wetsuits nooit in direct zonlicht, hete auto's of drogers liggen. Gebruik elke 5-10 sessies wetsuitshampoo.
  problem: Na één seizoen ruikt je wetsuit, heeft neopreen zijn elasticiteit verloren, laten de naden los en kleeft de rits – dit alles is te voorkomen met goed onderhoud.
  explanation: Zoutkristallen dringen door in neopreen en slijten het materiaal af. Bacteriën vermenigvuldigen zich in vochtige binnenkant, waardoor geuren ontstaan en neopreen afbreekt. UV degradeert de nyloncoating. Hitte boven 50°C veroorzaakt delaminatie. Onjuist drogen vervormt neopreen en belast naden.
  solution: 'Na elke sessie: grondig spoelen van binnen en van buiten, binnenstebuiten keren, ophangen aan een brede plastic hanger in de schaduw. Zodra het droog is, weer rechtsom keren en plat opbergen. Elke 5-10 sessies: wassen met wetsuit shampoo. Maandelijks: rits invetten met ritswas.'
  recommendation: Gebruik Aquafarer Wetsuit Shampoo voor het reinigen en Aquafarer Ritswas voor het onderhouden van de rits. Bewaar op de Aquafarer brede hanger in de netzak.
  faq:
    - q: Kan ik mijn wetsuit in de wasmachine doen?
      a: Niet aanbevolen — machinaal wassen beschadigt neopreen. Als het echt moet, gebruik dan een fijnwasprogramma, koud water en een waszak.
    - q: Hoe krijg ik de geur uit mijn wetsuit?
      a: Week in koel water met wetsuitshampoo of witte azijn gedurende 30 minuten. Spoel grondig af.
    - q: Hoe moet ik mijn wetsuit drogen?
      a: Binnenstebuiten in de schaduw aan een brede, gewatteerde plastic hanger. Vermijd direct zonlicht en metalen hangers.
    - q: Kan ik een gescheurd wetsuit repareren?
      a: Kleine scheurtjes van minder dan 2,5 cm kunnen worden gerepareerd met neopreenlijm en een patch. Grotere scheuren kunnen professionele reparatie vereisen.
