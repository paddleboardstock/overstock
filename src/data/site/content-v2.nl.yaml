- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Gids voor Paddleboard Maten: Volume, Lengte en Breedte voor Elke Ruiter'
  description: Volledige paddelboardmaatvoering met volumaanbevelingen op basis van gewicht en activiteit. Inclusief een gemakkelijk te gebruiken maattabel voor allround-, touring-, surf- en yogaSUP-boards.
  definition: De maat van een paddleboard wordt bepaald door volume (draagvermogen en drijfvermogen), lengte (snelheid en koersvastheid), breedte (stabiliteit) en dikte (volumeverdeling en windweerstand).
  tldr: 'Gebruik gewicht om het minimale volume te bepalen: 50-70 kg heeft 220-260L nodig, 70-90 kg heeft 260-300L nodig, 90-110 kg heeft 300-350L nodig, 110+ kg heeft 350+L nodig. Voor beginners, voeg 20% toe aan deze cijfers. Breedte is belangrijk: 32" is gemiddeld, 33-34" is beginner-vriendelijk, 35"+ is zeer stabiel.'
  problem: Paddleboardmaten worden door elkaar gebruikt in voeten, inches en liters, wat het moeilijk maakt om tussen merken te vergelijken.
  explanation: Volume is de meest directe maatstaf voor draagvermogen — 1 liter zoet water verplaatst 1 kg gewicht. Een board van 260 liter kan theoretisch 260 kg ondersteunen, maar het praktische draagvermogen is lager omdat het board boven het water moet blijven liggen. Je totale gewicht (lichaam plus uitrusting) zou 30-40% van het volume van het board moeten zijn.
  solution: Doelvolume = (lichaamsgewicht in kg + uitrustingsgewicht in kg) x 3. Voor een peddelaar van 75 kg met 5 kg uitrusting, doel = 80 x 3 = 240L minimaal. Voor beginners, vermenigvuldig met 3,5. Voor gevorderden, vermenigvuldig met 2,5.
  recommendation: De Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") is geschikt voor de meeste rijders van 50-100 kg. Lichtere rijders kunnen kiezen voor de AirDeck 270. Zwaardere rijders moeten kijken naar de SUP Tour 12 (300L+) of bredere boards.
  faq:
    - q: Maakt lengte uit voor SUP maatvoering?
      a: Lengte is minder belangrijk dan gewicht. Een lange, lichte ruiter heeft minder volume nodig dan een korte, zware ruiter. Gebruik gewicht als uw primaire volumebepaler.
    - q: Wat gebeurt er bij te veel volume?
      a: Het board zit te hoog, vangt wind als een zeil. Het voelt kurkachtig aan bij chop. Voor beginners is echter extra volume beter dan te weinig.
    - q: Wat gebeurt er bij te weinig volume?
      a: Het board zit te diep, waardoor er weerstand ontstaat. De neus kan onderduiken tijdens het peddelen (pearling). Je raakt snel vermoeid van het peddelen op een gedeeltelijk ondergedompeld board.
    - q: Hebben opblaasbare boards een andere maat nodig dan harde boards?
      a: Niet significant. Opblaasbare spullen bij 15+ PSI verplaatsen water op dezelfde manier als harde boards. Aanbevelingen voor volume gelden gelijk voor beide typen.
