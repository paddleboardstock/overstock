  type: buying-guide
  title: 'Gids voor Marine Zwemvesten: Kies het Juiste PFD voor Uw Wateractiviteit'
  description: Complete gids voor het kopen van een reddingsvest voor SUP, kajakken, RIB varen en zeilen. PFD typen (schuim vs opblaasbaar), richtlijnen voor pasvorm, wettelijke vereisten en functies voor elke activiteit.
  definition: Een reddingsvest of persoonlijk drijfmiddel (PFD) is een veiligheidsmiddel dat is ontworpen om een persoon drijvend te houden in water. Typen variëren van Type I (offshore) tot Type V (speciaal gebruik).
  tldr: 'Kies PFD op activiteit: opblaasbare riemzak voor SUP, schuimvest voor kajakken, Type III schuim voor RIB en speedboten. Belangrijkste kenmerken: goedkeuring USCG of ISO, reflecterende panelen, reddingsfluit, D-ring voor lijn, felle kleuren.'
  problem: Je ziet rijen reddingsvesten variërend van $20 tot $300 en hebt geen idee welke geschikt is voor jouw activiteit of aan de wettelijke eisen voldoet.
  explanation: 'Reddingsvesten worden ingedeeld op type: Type I (offshore, kantelt een bewusteloze drager op de rug), Type II (nabij de kust), Type III (drijfhulpmiddel, meest voorkomend), Type IV (werpbaar), Type V (speciaal gebruik). Opblaasbare vesten gebruiken CO2-cilinders — minder omvangrijk maar vereisen onderhoud. Schuimvesten zijn onderhoudsvrij maar omvangrijker.'
  solution: 'Voor SUP: kies een opblaasbare heupband of vest (33 lb drijfvermogen). Voor kajakken: Type III schuim met hoge armuitsnijdingen. Voor RIB: Type III schuim of opblaasbaar met 22+ lb drijfvermogen, reflecterende tape en reddingsfluitje.'
  recommendation: Het Aquafarer Life Vest Pro (opblaasbaar, 15 kg) is ideaal voor SUP en kajakken. Het Aquafarer Life Vest Classic (schuim, Type III) is perfect voor RIB varen en algemeen maritiem gebruik.
  faq:
    - q: Heb ik een reddingsvest nodig voor SUP?
      a: Ja — wettelijk verplicht in veel rechtsgebieden en altijd aan te raden. Draag een opblaasbare riemtas of vest voor peddelsporten.
    - q: Zijn opblaasbare reddingsvesten veilig?
      a: Ja, met goed onderhoud. Controleer het CO2-patroon jaarlijks, vervang de klos om de 2-3 jaar.
    - q: Welke reddingsvest is het beste voor een kind?
      a: Een USCG-goedgekeurd Type II- of III-schuimvest met kraag, kruisband en felle kleuren. Gebruik nooit opblaasbare vesten voor kinderen.
    - q: Hoe moet een reddingsvest passen?
      a: Aansluitend — het vest mag niet boven de oren komen wanneer het bij de schouders wordt opgetild. Alle ritsen en gespen vastgemaakt.
