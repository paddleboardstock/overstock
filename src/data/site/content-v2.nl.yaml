- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Surfetiquetteregels (Hoe Niet de Persoon te Zijn Die Iedereen Vermijdt)
  description: De line-up heeft regels en niemand schrijft ze op. Leer wie voorrang heeft, waarom slalommen je een uitbrander kan opleveren, hoe je je excuses aanbiedt, en de beginnersfouten die elke lokale surfer irriteren.
  definition: 'Surfetiquette is een ongeschreven gedragsregel die botsingen voorkomt en golven eerlijk verdeelt. De kernregel: de surfer die het dichtst bij de piek van de brekende golf is, heeft voorrang.'
  tldr: De surfer die het dichtst bij de top van de brekende golf is, heeft voorrang. Droop niet in op iemand, val niet in (peddel om iemand heen om hun golf te nemen), en bied altijd je excuses aan als je een fout maakt. Peddel wijd om de line-up, houd je board vast en wees vriendelijk — respect levert respect op.
  problem: Je peddelt naar een drukke line-up en voelt meteen spanning. Surfers kijken je schuin aan, iemand roept naar je, en je weet niet zeker wat je verkeerd hebt gedaan. De sociale kant van surfen voelt intimiderender dan de golven zelf.
  explanation: "Surfetiquette bestaat om botsingen te voorkomen en golven eerlijk te delen. De fundamentele regel is voorrang: de surfer die het dichtst bij de piek is (waar de golf voor het eerst breekt) heeft voorrang. Iedereen die voor dezelfde golf peddelt vanaf verder naar binnen moet uitwijken. 'Snaken' — rond een andere surfer peddelen om de voorrang te stelen — wordt beschouwd als de ergste overtreding. Buiten de voorrang zijn er in de line-up verwachtingen over geluid (houd het roepen tot een minimum), boardcontrole (laat je board nooit dicht bij anderen komen) en vriendelijkheid (een simpele knik is al veel waard)."
  solution: Bekijk de lineup 10 minuten voordat je het water in gaat. Identificeer wie de meeste golven pakt — dat zijn de surfers die je moet respecteren en vermijden. Blijf aan de binnenkant (wittewaterzone) als je aan het leren bent. Peddel wijd rond de lineup, niet erdoorheen. Wanneer je een golf pakt, kijk dan beide kanten op voordat je omhoog komt en zorg dat er niemand dieper ligt.
  recommendation: Breng je eerste paar sessies door op een beginner-vriendelijke break met verspreide menigten. Leer prioriteit te lezen voordat je een drukke lineup probeert. Als je op iemand zou vallen, bied dan meteen je excuses aan en peddel weg — de meeste surfers respecteren een eerlijke fout.
  faq:
    - q: Wat komt binnen?
      a: Invallen betekent peddelen voor en een golf rijden waarop een andere surfer al voorrang heeft. Het is gevaarlijk en respectloos. De surfer die het dichtst bij de piek is, bezit de golf; iedereen die anders is, moet uitwijken.
    - q: Wat is snaken?
      a: Snaking is rondpeddelen om een andere surfer die al in positie voor een golf is, zodat je dichter bij de piek eindigt. Het wordt beschouwd als uiterst slechte etiquette en kan leiden tot confrontatie.
    - q: Kunnen beginners surfen bij drukke golven?
      a: Ja, maar blijf in de wittewaterzone weg van de piek. Peddel niet in het hoofdstartgebied totdat je consequent golven kunt pakken en je richting kunt beheersen. Drukke line-ups vereisen ervaring om veilig te navigeren.
    - q: Hoe bied ik mijn excuses aan in het water?
      a: Een eenvoudige zwaai, glimlach en 'mijn fout' of 'sorry' werkt. Erken de fout en peddel weg van de persoon. Surfers zijn over het algemeen vergevingsgezind bij oprechte fouten, vooral als je duidelijk aan het leren bent.
    - q: Wat moet ik doen als iemand onverwachts bij me binnenkomt?
      a: Als het een duidelijke drop-in is, roep dan "wave" of "hey" om hen te waarschuwen. Als ze het per ongeluk vangen en zich verontschuldigen, laat het dan gaan. Als iemand herhaaldelijk binnendringt, peddel dan naar hen toe en leg beleefd de prioriteit uit. Vermijd confrontaties.
