- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Opblaasbare SUP Reparatie: Plekken, Lekkages en Klepproblemen Repareren'
  description: Doe-het-zelf opblaasbare SUP reparatiehandleiding. Hoe een langzaam lek te vinden, een prikgat te plakken, een ventiel te vervangen en dekpaddelaminatie te repareren met het meegeleverde reparatiesetje.
  definition: Het repareren van opblaasbare SUP omvat het opsporen van luchtlekken door middel van testen met sopwater, het schoonmaken en opruwen van het beschadigde gebied, het aanbrengen van PVC lijm en patch, en het uitharden onder druk.
  tldr: Vind lekken met zeepwater. Maak het gebied rond het lek schoon en schuur het met schuurpapier. Breng PVC lijm aan op zowel de pleister als het board, wacht 5 minuten, druk stevig aan en laat 24 uur onder gewicht uitharden. Controleer bij lekkages van het ventiel eerst de O-ring. Kleine puncties onder 1/4" zijn gemakkelijke doe-het-zelf reparaties.
  problem: Je blaast je SUP op en 's ochtends is het leeggelopen. Zonder reparatiekennis sta je voor een dure vervanging van wat waarschijnlijk een simpele lekke plek is.
  explanation: 'De meeste opblaasbare SUPs gebruiken een drop-stitch-kern met PVC buitenlagen. Een lek door de buitenste PVC veroorzaakt een langzaam lek. Standaard reparatie: schoonmaken, schuren, PVC-compatibele lijm aanbrengen, patch onder gewicht drukken. Ventiellekken komen vaker voor dan paneellekken — de O-ring droogt uit of vuil verhindert afdichting.'
  solution: Pomp het board op tot maximaal PSI en luister naar sissende geluiden. Spuit systematisch zeepwater, vooral rond naden en het ventiel. Markeer plekken waar bellen ontstaan. Laat leeg, reinig met alcohol, schuur met 80-grit, breng PVC lijm aan op het plakstuk en het board, wacht tot het kleverig is, druk stevig aan, leg er 24 uur gewicht op.
  recommendation: Gebruik de Aquafarer reparatieset die bij alle Aquafarer borden wordt geleverd. Neem de reparatieset altijd mee op reizen. Neem bij klepproblemen contact op met Aquafarer ondersteuning. Bij grote scheuren of lasnaden wordt professionele reparatie aanbevolen.
  faq:
    - q: Kan ik een grote scheur in mijn opblaasbare SUP repareren?
      a: Scheuren van 1" kunnen professionele reparatie of een patch aan beide zijden vereisen. Naden die langs de rail losraken, kunnen niet betrouwbaar in het veld worden gerepareerd.
    - q: Hoe lang gaat een reparatiepleister mee?
      a: Een juiste reparatie met de correcte techniek duurt het hele leven van het board. Slechte hechting door onvoldoende reiniging leidt tot toekomstige falen.
    - q: Kan ik een lekkende klep repareren?
      a: Vaak wel. Verwijder de ventielkern, inspecteer de O-ring, maak deze schoon of vervang hem, breng siliconenvet aan en monteer hem opnieuw.
    - q: Wat als ik het lek niet kan vinden?
      a: Blase op tot volledig PSI en dompel de secties achtereenvolgens onder in een bad of zwembad. Lekkages die te klein zijn om te vinden kunnen temperatuurgerelateerd zijn.
