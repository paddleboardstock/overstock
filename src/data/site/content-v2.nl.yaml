  title: 'Tij begrijpen voor watersport: een praktische gids'
  description: Hoe getijden SUP, surfen en kajakken beïnvloeden. Het lezen van getijdentabellen, het begrijpen van spring- versus doodtij en het plannen van je sessie rond getijdenbewegingen voor veiligheid.
  definition: Getijden zijn de dagelijkse stijging en daling van de zeespiegel veroorzaakt door de zwaartekracht van de maan en de zon. Het getijdenverschil varieert per locatie en maancyclus.
  tldr: 'Dagelijks twee hoge en twee lage getijden op de meeste locaties. Springtij (volle/nieuwe maan) heeft grotere verschillen en sterkere stromingen. Doodtij (kwart maan) heeft kleinere verschillen. Getijden beïnvloeden de waterdiepte, golfform en stromingssterkte. Voor SUP: peddel eerst tegen de stroming in zodat het je helpt terug te keren.'
  problem: Je komt aan bij je lokale break om nauwelijks surf te vinden, gevaarlijke stromingen door het wegstromende tij, of water dat te ondiep is. Zonder het tij te begrijpen, verspil je trips of peddel je het water in onder gevaarlijke omstandigheden.
  explanation: Getijden worden veroorzaakt door de zwaartekracht van de maan. Springtij (volle en nieuwe maan) produceert de hoogste getijden en de laagste laagte. Doodtij (halvemaan) produceert minimale verschillen. Getijdestromen zijn het snelst halverwege het getij, en traag bij hoog- en laagwater. Het getijdenbereik varieert van 0,3 m (Middellandse Zee) tot 16 m (Baai van Fundy).
  solution: 'Bekijk de getijdenkalender voor elke sessie. Voor surfen: beachbreaks werken vaak het beste 2-3 uur voor of na hoogtij. Voor SUP: peddel de eerste helft tegen de stroom in zodat de stroom de terugweg helpt. Voor vissen: opkomend tij duwt vis naar de platen.'
  recommendation: Gebruik de getijdvoorspellingen van NOAA of een lokale getijden-app. Leer de getijdvoorkeur van je lokale surfspot door een maand lang de omstandigheden bij te houden.
  faq:
    - q: Wat is een springvloed?
      a: Springtij treedt op tijdens volle en nieuwe manen, waardoor hogere hoge getijden en sterkere stromingen ontstaan. Ze komen twee keer per maand voor.
    - q: Wat is een dodevloed?
      a: Doodtij komt voor tijdens de kwartmanen. Het getijdenverschil is kleiner en de stromingen zijn zwakker — goed voor beginners.
    - q: Zijn ebben gevaarlijk voor SUP?
      a: Ebbe kan rotsen en riffen blootleggen. Het concentreert ook de golfenergie op steilere zandbanken.
    - q: Hoe beïnvloeden getijden de ripstroom?
      a: Aftrekkende getijden (eb) versterken stromingsstromen. Inkomende getijden (vloed) verminderen de sterkte van stromingen.
