- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Maattabel: Lengte, Breedte en Volume Uitleg'
  description: Vind de juiste SUP maat op basis van je gewicht, vaardigheidsniveau en peddelstijl. Lengte bepaalt de koersvastheid, breedte bepaalt de stabiliteit en volume bepaalt het draagvermogen.
  definition: De grootte van SUP wordt bepaald door lengte (snelheid en glijvermogen), breedte (primaire stabiliteit), dikte (secundaire stabiliteit en volume), en volume in liters (totale draagcapaciteit).
  tldr: 'Allround SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Toeren: 12''-14'' x 30"-32" (280-350L). Surfen: 8''-10'' x 30"-32" (140-220L). Beginners hebben een breedte nodig van meer dan 32" en een volume dat 60-80L boven het lichaamsgewicht uitkomt. Je gewicht in kg plus 60L is het minimale volume als doel voor stabiliteit.'
  problem: Elk SUP merk vermeldt boards in voet, inches en liters, maar zonder te weten hoe deze afmetingen zich vertalen naar het gevoel in de praktijk, loop je het risico een board te kopen dat wiebelig, traag of niet geschikt voor je gewicht is.
  explanation: 'Lengte bepaalt hoe snel het board peddelt en hoe goed het in een rechte lijn blijft. Langere boards (12''+) glijden tussen slagen door en houden een lijn aan. Kortere boards (onder 10'') draaien gemakkelijk maar vereisen vaker dat je van peddel wisselt. Breedte bepaalt de primaire stabiliteit — staand evenwicht. Een board van 30" voelt wiebelig voor beginners; 34" voelt als een steiger. Dikte bepaalt het volume — een dikker board drijft hoger maar vangt meer wind. Volume in liters is de beste maatstaf: het beladen board (jij plus uitrusting) zou 5-10 cm moeten onderdompelen in rust.'
  solution: 'Pas de afmetingen van je board aan op drie factoren: je gewicht (bepaalt het minimale volume), je primaire activiteit (bepaalt de lengte) en je vaardigheidsniveau (bepaalt de breedte). Voor beginners vermenigvuldig je het gewicht in kg met 2,2 om het minimale aantal liters te krijgen. Voor gevorderden vermenigvuldig je met 1,8. Voor gevorderden met een hoog niveau vermenigvuldig je met 1,4.'
  recommendation: De Aquafarer SUP Explorer 11 van 11' x 33" x 6" met 260L is geschikt voor de meeste rijders tot 100 kg voor all-round peddelen. Upgrade naar de SUP Tour 12 van 12' x 31" voor betere toursnelheid en glijvermogen.
  faq:
    - q: Welke SUP-maat heb ik nodig voor mijn gewicht?
      a: 'Voor rijders onder 70 kg: 10-11'' x 32" (220-260L). Voor 70-90 kg: 11-12'' x 33" (260-300L). Voor 90-110 kg: 11-12'' x 34" (300-350L). Voor meer dan 110 kg: 12'' x 34-36" (350L+).'
    - q: Is een langere SUP sneller?
      a: Ja. Langere boards hebben een betere lengte-breedteverhouding, wat de weerstand vermindert. Een 14' touring SUP is aanzienlijk sneller dan een 11' allround board bij dezelfde peddelinspanning.
    - q: Welke SUP breedte is stabiel voor beginners?
      a: 33-34 inch is het ideale bereik voor beginners tot 90 kg. Onder 32 inch vereist goede balans. Boven 34 inch is zeer stabiel maar langzamer en moeilijker te peddelen bij wind.
    - q: Kan ik een allround board gebruiken voor toeren?
      a: Ja, voor korte tochten onder de 10 km. Voor langere afstanden volgt een speciale touringplank beter en legt deze afstanden efficiënter af.
