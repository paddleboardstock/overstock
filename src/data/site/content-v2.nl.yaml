- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hydratatie en zonbescherming: Blijf veilig op het water'
  description: Essentiële hydratatie- en zonnebeschermingsstrategieën voor SUP peddelaars. Uitdroging en zonnebrand zijn de meest voorkomende SUP problemen — hoe beide te voorkomen tijdens lange sessies.
  definition: SUP hydratatie betekent het behouden van de vochtbalans tijdens het peddelen door regelmatig water te drinken. Zonbescherming omvat het aanbrengen van SPF, beschermende kleding en het plannen van sessies om piek UV te vermijden.
  tldr: Drink 500 ml water per uur peddelen. Neem meer mee dan je denkt nodig te hebben — een 2L blaas of meerdere flessen. Breng waterbestendige SPF 50+ zonnebrandcrème aan voor het peddelen en breng elke 2 uur opnieuw aan. Draag een hoed, zonnebril met bandje en kleding met UPF-classificatie. Vermijd peddelen van 11.00-15.00 uur wanneer UV het sterkst is.
  problem: Je hebt een geweldige SUP sessie, maar na een uur krijg je hoofdpijn, een droge mond en brandt je huid. Uitdroging en zonnebrand sluipen erin omdat het water je koel houdt.
  explanation: Reflectie op het water versterkt de blootstelling aan UV met tot 40%. Het verkoelende effect van water en windmaskeert zonnebrand totdat het te laat is. Zweten door peddelen verhoogt het vochtverlies, en er is vaak geen plek om water bij te vullen op het water. Uitdroging beïnvloedt het evenwicht en het nemen van beslissingen, waardoor het risico op ongelukken toeneemt.
  solution: Bevestig een waterfles of hydratatieblaas aan het bungeesysteem van het board. Drink elke 15 minuten, of je dorst hebt of niet. Breng 30 minuten voor het starten SPF 50+ zonnebrandcrème aan. Draag een hoed met brede rand, gepolariseerde zonnebril met band en een UPF 50+ rashguard. Breng elke 2 uur opnieuw zonnebrandcrème aan.
  recommendation: Gebruik een hydratatiebladder die vastgemaakt is aan de voorste D-rozen van je Aquafarer SUP. Draag een UPF 50+ rashguard onder je PFD. Gebruik een waterbestendige zonnebrandcrème die blijft zitten bij zweet en water.
  faq:
    - q: Hoeveel water moet ik meenemen op een SUP-reis?
      a: Minimaal 1 liter per uur. Voor een sessie van 2 uur, breng 2 liter mee. Meer bij warm weer. Een hydratatieblaas werkt het beste.
    - q: Welk type zonnebrandcrème is het beste voor SUP?
      a: Waterbestendig, SPF 50+ breedspectrum. Minerale zonnebrandmiddelen (zinkoxide, titaniumdioxide) zijn veilig voor koraalriffen en gaan langer mee.
    - q: Weert het water echt UV?
      a: Ja — water weerkaatst tot 40% van de UV-straling, wat betekent dat je UV van boven en van beneden krijgt. Dit verhoogt het risico op verbranding aanzienlijk.
    - q: Kan ik verbrand raken door een rashguard heen?
      a: Standaard rashguards bieden minimale UV bescherming (ongeveer UPF 10-20). Zoek naar kleding met UPF 50+ voor volledige bescherming.
