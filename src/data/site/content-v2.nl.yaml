  title: 'Koudwaterveiligheid: Peddelen en Surfen in Koude Omstandigheden'
  description: Veiligheid in koud water voor SUP, surfen en kajakken. Herkenning van onderkoeling, geschikte uitrusting, reactie op koude schok en noodprocedures bij onderdompeling in koud water.
  definition: Veiligheid bij koud water omvat het begrijpen van de reactie op koude schok, zwembiologische uitputting, onderkoeling en de uitrusting en technieken om deze gevolgen te voorkomen.
  tldr: Water onder 15°C vereist een wetsuit. Onder 10°C zijn schoenen, handschoenen en een kap vereist. Koude schok veroorzaakt onwillekeurig happen naar adem. Zwemfalen treedt op binnen 3-5 minuten in water onder 10°C. Symptomen van onderkoeling zijn onder andere rillen, verwarring en verlies van coördinatie.
  problem: Je peddelt op een zonnige dag zonder te beseffen dat het water 8°C is. Je valt erin, slaakt onwillekeurig een hoest en voelt je ledematen binnen enkele minuten gevoelloos worden. Koud water doodt sneller dan enig ander gevaar in de oceaan.
  explanation: 'Onderdompeling in koud water heeft vier fasen: koude schok (0-2 min) — happen naar adem, hyperventilatie. Zwemfalen (3-15 min) — spieren koelen af, coördinatie faalt. Hypothermie (15-45 min) — kerntemperatuur daalt onder 35°C wat verwarring en hartstilstand veroorzaakt. Instorting na redding — koud bloed keert terug naar de kern.'
  solution: 'Controleer de watertemperatuur. Draag een wetsuit die geschikt is voor de temperatuur. Peddel nooit alleen in water onder 15°C. Draag een fluitje en telefoon bij je. Als je valt: controleer je ademhaling, klim snel weer op het board. Als het te koud is, roep om hulp.'
  recommendation: De Aquafarer Wetsuit Pro 5/4/3mm is het minimum voor water van 8-14°C. Voeg Aquafarer 5mm laarzen en 3mm handschoenen toe. Draag het Life Vest Pro voor extra thermische bescherming.
  faq:
    - q: Hoe lang kan ik overleven in 10°C water?
      a: Koude schok duurt 1-2 minuten. Zonder drijfvermogen en thermische bescherming is de overlevingstijd 30-60 minuten.
    - q: Wat zijn de eerste tekenen van onderkoeling?
      a: Oncontroleerbare rillingen, verwarring, slechte coördinatie, onverstaanbare spraak. Stop onmiddellijk met de activiteit en warm op.
    - q: Hoe warm ik op na een koude water sessie?
      a: Verwijder natte kleding, droog af, trek warme lagen aan, inclusief hoed en handschoenen. Drink warme, niet-alcoholische dranken.
    - q: Kan ik in de zomer onderkoeling krijgen?
      a: Ja — water onder 15°C komt op veel plaatsen zelfs in de zomer voor. Water geleidt warmte 25 keer sneller dan lucht.
