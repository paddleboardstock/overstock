- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'SUP Peddelgids: Kies de juiste peddel voor jouw stijl'
  description: Complete gids voor SUP peddels — lengte, materialen (aluminium, glasvezel, carbon), bladvormen, en hoe de keuze van de peddel je peddelervaring beïnvloedt.
  definition: Een SUP peddel bestaat uit een steel (aluminium, glasvezel of carbon) en een blad (dihedraal, schep of vlak). De lengte zou 8-10" boven je lengte moeten zijn voor algemeen peddelen.
  tldr: 'Paddlelengte: 8-10 inch boven je lengte voor algemeen gebruik, 6-8 inch voor surfen, 10-12 inch voor toeren. Materialen: aluminium (goedkoop, zwaar), glasvezel (middenklasse, goede flexibiliteit), carbon (licht, stijf, duur). Bladvorm: dihedral (stabiel spoor), scoop (kracht), vlak (veelzijdig). Verstelbare peddels zijn geweldig voor beginners.'
  problem: De meegeleverde peddel bij de meeste iSUPs werkt, maar is zwaar en inefficiënt. Upgraden verbetert de peddel efficiëntie en het plezier, maar de opties zijn verwarrend.
  explanation: 'De lengte van de peddel beïnvloedt de efficiëntie van de slag — te kort vereist voorover buigen, te lang veroorzaakt schoudervermoeidheid. Het materiaal bepaalt het gewicht: carbon peddels wegen 18-24 oz tegenover 28-36 oz voor aluminium. De grootte van het blad beïnvloedt de kracht: grotere bladen (100+ vierkante inch) zorgen voor meer voortstuwing per slag maar vermoeien sneller. Dihedrale bladen volgen een rechte lijn; schepbladen zorgen voor meer grip.'
  solution: 'Voor de juiste lengte: ga staan met de peddel verticaal, strek je arm omhoog — het peddelhandvat zou je pols moeten raken. Voor materiaal: begin met glasvezel als een upgrade van gemiddeld gewicht. Voor het blad: kies voor een dihedraal voor algemeen peddelen. Voor activiteiten: toerpeddels zijn langer met kleinere bladen; surfpeddels zijn korter met bredere bladen.'
  recommendation: Het Aquafarer carbon peddel van 28 oz is de beste upgrade voor frequente peddelaars. De meegeleverde verstelbare 3-delige aluminium peddel is geschikt voor beginners en reizen.
  faq:
    - q: Hoe lang moet mijn SUP peddel zijn?
      a: Meet je lengte in inches en voeg 8-10 toe voor allround peddelen. Voor surfen, voeg 6-8 toe. Voor toeren, voeg 10-12 toe.
    - q: Is een carbon peddel het geld waard?
      a: Ja, voor regelmatige peddelaars — het gewichtsverlies vermindert vermoeidheid aanzienlijk tijdens lange sessies. Voor incidenteel gebruik is glasvezel waar voor je geld.
    - q: Wat is een verstelbare peddel?
      a: Een 2- of 3-delige peddel met lengte-aanpassing, ideaal om te delen tussen gebruikers of aan te passen voor verschillende activiteiten.
    - q: Hoe verzorg ik mijn peddel?
      a: Spoel af met zoet water na gebruik in zout water. Vermijd eroverheen rijden of opslaan in directe hitte. Controleer de koppel (verbinding) op zand.
