- slug: sup-safety-guide
  category: guide
  type: safety
  title: 'SUP Veiligheidsgids: Essentiële regels voor elke peddelaar'
  description: Volledige SUP veiligheidsgids met informatie over weercontroles, uitrusting, zelfredding, navigatieregels en wat te doen als de omstandigheden gevaarlijk worden. Blijf veilig op je paddleboard.
  definition: SUP veiligheid omvat planning vóór de reis (weer, getijden, uitrustingscontroles), praktijken op het water (PFD, leiband, navigatie) en noodprocedures (zelfredding, signalering, preventie van onderkoeling).
  tldr: Draag altijd een riem en PFD. Controleer de windvoorspelling — offshore wind is gevaarlijk. Peddel eerst tegen de wind in zodat de wind je helpt terug te keren. Neem een fluitje mee, telefoon in een waterdichte hoes en water. Leer zelfredding. Nooit SUP alleen in afgelegen gebieden.
  problem: SUP lijkt deceptief eenvoudig. Beginners onderschatten hoe snel wind, stroming en vermoeidheid een leuke sessie gevaarlijk kunnen maken.
  explanation: Het board werkt als een zeil in de wind, waardoor peddelen met de wind mee gemakkelijk is, maar terugvaren tegen de wind extreem moeilijk. De staande positie verhoogt het valrisico. Vermoeidheid stapelt zich sneller op dan bij kajakken. Leashes voorkomen dat je van het board gescheiden raakt. PFDs houdt je drijvend als je gewond bent.
  solution: 'Voor de reis: controleer de wind (maximaal 10 knopen voor beginners), richting (vermijd offshore) en getij. Vertel iemand je route. Op het water: kniel om tegen sterke wind in te peddelen. Als je gescheiden raakt, zwem naar het board. Voor zelfredding: plaats het peddel over het board, trap met je benen, trek je borst op het board en zwaai je benen omhoog.'
  recommendation: Gebruik het Aquafarer Life Vest Pro (opblaasbaar) voor SUP. Bevestig de opgerolde SUP leiband aan je kuit. Oefen zelfredding onder kalme omstandigheden voordat je het nodig hebt.
  faq:
    - q: Welke windsnelheid is veilig voor SUP?
      a: 'Beginners: onder 10 knopen. Gemiddeld: 10-15 knopen. Gevorderd: 15-20 knopen. Meer dan 20 knopen is gevaarlijk voor alle niveaus.'
    - q: Heb ik een reddingsvest nodig voor SUP?
      a: Ja — wettelijk verplicht in veel rechtsgebieden en altijd aanbevolen voor de veiligheid.
    - q: Wat moet ik doen als ik niet terug naar de kust kan komen?
      a: Blijf bij je board (het is een drijfmiddel). Signaal met fluitje. Als je naar zee wordt geblazen, peddel onder een hoek van 45 graden tegen de wind in.
    - q: Hoe oefen ik SUP zelfredding?
      a: 'In rustig ondiep water: laat jezelf opzettelijk vallen, zwem naar het board, oefen herhaaldelijk opnieuw opstijgen.'
