- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP met je hond: een complete handleiding'
  description: Suppen met je hond — voorbereiding, veiligheid, trainingsstappen, aanbevelingen voor uitrusting, en tips voor een leuke ervaring voor jullie beiden.
  definition: SUP met een hond omvat het trainen van je hond om op een paddleboard te balanceren, ze uitrusten met een honden PFD, en samen veilig peddelen.
  tldr: Begin met een breed, stabiel SUP (34"+). Zorg dat je hond een goed passend zwemvest met handvat krijgt. Introduceer het board eerst op het land, daarna in ondiep water. Begin met korte sessies en positieve bekrachtiging. Neem altijd water mee voor je hond. Let op tekenen van stress of vermoeidheid.
  problem: Je hond houdt van water, maar je weet niet zeker hoe je hem veilig aan de SUP kunt introduceren. Zonder de juiste training kan een hond in paniek raken, eraf springen of het board krabben.
  explanation: 'Honden hebben van nature zwemvermogen, maar ze moeten leren dat het bord een veilig platform is. De sleutel is geleidelijke gewenning: introduceer het bord op vaste grond, beloon rustig gedrag, ga vervolgens naar ondiep water en uiteindelijk naar dieper water.'
  solution: 'Begin op het land: laat de hond snuffelen en over het board lopen (op gras). Beloon rustig gedrag. Vervolgens: plaats het board in zeer ondiep water, ondersteun het, laat de hond erop staan. Beloon. Vervolgens: ga zelf op het board in ondiep water, laat de hond erbij komen. Ten slotte: peddel langzaam in rustig water.'
  recommendation: Gebruik de Aquafarer SUP Explorer 11 voor zijn 33" stabiele platform. Voeg een honden-PFD (reddingsvest) toe. Breng vers water en een kom mee. Begin met sessies van 10 minuten en bouw dit op.
  faq:
    - q: Welke maat SUP heb ik nodig voor mijn hond?
      a: Een 33-34" brede plank biedt stabiliteit voor middelgrote tot grote honden. Kleine honden (onder 10 kg) kunnen uit de voeten op planken van 32"+.
    - q: Heeft mijn hond een reddingsvest nodig?
      a: Ja — zelfs sterke zwemmers hebben een hond PFD met een handvat nodig voor gemakkelijke terugvangst in noodgevallen.
    - q: Hoe bescherm ik het bord tegen klauwen?
      a: Houd de nagels van de hond getrimd. Gebruik een dekvloerbescherming of handdoek. Honden passen zich meestal aan en stoppen met krabben zodra ze zich op hun gemak voelen.
    - q: Kan elke hond SUP leren?
      a: De meeste honden kunnen met geduld leren. Angstige honden kunnen er langer over doen. Forceer een bange hond nooit op het bord — het creëert negatieve associaties.
