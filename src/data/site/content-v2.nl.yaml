- slug: how-to-choose-a-wetsuit
  category: guide
  type: buying-guide
  title: 'Hoe een wetsuit te kiezen: pasvorm, dikte en functies uitgelegd'
  description: Complete gids voor het kopen van een wetsuit. Hoe de juiste dikte te kiezen voor je watertemperatuur, zorgen voor een goede pasvorm, de soorten naden begrijpen en functies kiezen op basis van je activiteit.
  definition: 'Een wetsuit is een neopreen kledingstuk dat thermische isolatie biedt door een dunne laag water tegen de huid vast te houden. Belangrijke selectiecriteria: dikte, pasvorm, naadconstructie, instapsysteem en type neopreen.'
  tldr: 'Pas de dikte aan op de watertemperatuur: 3/2mm voor 14-20C, 4/3mm voor 12-18C, 5/4/3mm voor 8-14C, 6/5/4mm voor onder 8C. Pasvorm is de belangrijkste factor. GBS-naden zijn de gouden standaard. Chest-zip vermindert doorspoeling. Kalksteenneopreen is flexibeler dan op petroleum gebaseerd neopreen.'
  problem: Online maatvoeringstabellen voor wetsuits zijn onbetrouwbaar, aanbevelingen voor dikte verschillen per merk, en beschrijvingen van functionaliteiten zijn verwarrend.
  explanation: De wetsuit-diktematen (3/2, 4/3, 5/4/3) verwijzen naar mm van torso/armen en benen. Dikkere pakken zijn warmer maar beperken de beweging. Een los wetsuit spoelt warm water weg. GBS-naden zijn warm en flexibel; flatlock-naden zijn minder warm. Een chest-zip ingang is warmer dan een back-zip. Kalksteen-neopreen is flexibeler in koud water.
  solution: Meet borst, taille, heupen en lengte. Vergelijk met maattabellen. Kies dikte op basis van de laagste watertemperatuur. Kies GBS-naden voor koud water. Geef de voorkeur aan chest-zip onder 15°C. Overweeg thermische voering voor extra warmte.
  recommendation: Het Aquafarer Wetsuit Pro in 3/2mm (14-20C) of 5/4/3mm (8-16C) biedt GBS-naden, chest-zip en kalksteenneopreen tegen een concurrerende prijs.
  faq:
    - q: Hoe strak moet een wetsuit zitten?
      a: Aangenaam strak zonder luchtbellen maar niet beperkend. Een vinger zou niet gemakkelijk over de onderrug moeten glijden.
    - q: Wat is het warmste type wetsuit?
      a: Een 6/5/4mm pak met capuchon, afgedichte naden en rits op de borst. Voor extreme kou is een droogpak beter.
    - q: Is een duurdere wetsuit het waard?
      a: Een hogere prijs koopt beter neopreen, naden en functies. Voor regelmatig gebruik in koud water is de meerprijs het waard.
    - q: Kan ik een wetsuit dragen voor activiteiten anders dan surfen?
      a: Ja — wetsuits zijn geschikt voor SUP, kajakken, duiken, triatlon en zwemmen in open water.
