  tldr: 'De SUP Tour 12 is Aquafarerhet speciale toerboard van de Tour. Met een lengte van 32 voet en een breedte van 31" en een verplaatsingsneus snijdt het efficiënt door water. Belangrijke specificaties: 280L volume, maximaal 18, PSI bungee-laadsysteem, multi-vinnen opstelling. Ongeveer $699geprijsd. Het beste voor fitnesspeddelaars en langeafstandsliefhebbers die 5-20 km per sessie afleggen.'
  problem: Je legt serieuze afstanden af op je SUP en de brede neus van je allround board veroorzaakt weerstand en volgt geen rechte lijn.
  explanation: De verplaatsingsneus scheidt het water in plaats van eroverheen te rijden, waardoor de boeggolfweerstand wordt verminderd. De langere waterlijn van 12' verhoogt de rompsnelheid. Met een breedte van 31" combineert het efficiëntie met stabiliteit. Touring-specifieke kenmerken zijn onder andere meerdere vinboxen en een bungee laaddek.
  solution: Blazen tot 18 PSI. Gebruik de middenvin voor vlak water of voeg zijvinnen toe voor stabiliteit bij zijwind. De verplaatste neus en lengte van 12' zijn uitstekend op open water met chop.
  recommendation: Bij $699, is de SUP Tour 12 het opblaasbare touringboard met de beste waarde. Koop het als je regelmatig afstanden aflegt. Combineer het met de Aquafarer carbon peddel voor de meest efficiënte opstelling.
  faq:
    - q: Is de SUP Tour 12 stabiel genoeg voor gevorderden?
      a: Ja — 31" breedte is standaard voor touring. Beginners kunnen 31" wiebelig vinden vergeleken met 33-34" all-around boards.
    - q: Hoe gaat de Tour 12 om met chop?
      a: Heel goed — de verplaatsingsneus snijdt door kleine tot matige golfslag zonder het klappen van een glijdekrom hull.
    - q: Kan ik de Tour 12 gebruiken voor surfen?
      a: Niet aanbevolen — de lengte van 12' en de verdraaide neus maken het traag om te draaien. Gebruik de SUP Explorer 11 voor het rijden op golven.
    - q: Welke peddellengte werkt het beste?
      a: 8-10" boven je hoofd. Een langere peddel biedt hefboomwerking voor afstandspeddelen.
