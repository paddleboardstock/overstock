- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm versus 5mm wetsuit: wat de meeste beginners verkeerd doen in koud water'
  description: Stop met halverwege de sessie bevriezen of oververhit raken op het strand. Het echte verschil tussen 3mm- en 5mm-wetsuits — temperatuurkaart, flexibiliteitsafwegingen en wat daadwerkelijk werkt voor surfen in koud water.
  definition: Een wetsuit is een neopreen kledingstuk dat een dunne laag water tegen de huid vasthoudt, die door lichaamswarmte wordt opgewarmd voor isolatie. De dikte (3 mm, 5 mm) bepaalt het temperatuurbereik dat een pak aankan — dikker is warmer maar minder flexibel.
  tldr: De dikte van een wetsuit bepaalt direct de warmte en flexibiliteit. Gebruik 3 mm voor water boven 16°C en 5 mm voor water tussen 8°C en 16°C. Dichtere pakken beperken de beweging, maar houden je langer warm — geef altijd de voorkeur aan pasvorm boven merk.
  problem: Je opent een online winkel of loopt een surfwinkel binnen en ziet wetsuits gelabeld als 3/2, 4/3, 5/4 en 5 mm full suits. De nummers betekenen niet veel totdat je beseft dat de verkeerde dikte ofwel leidt tot bevriezen halverwege de sessie of oververhitting en zweten op het strand.
  explanation: Wetsuits werken door een dunne laag water tussen je huid en het neopreen vast te houden; je lichaam verwarmt dat water, waardoor isolatie ontstaat. Dikker neopreen houdt meer water vast maar beperkt de flexibiliteit en drijfvermogen. Een 3mm pak (vaak 3/2 met dunnere armen) is geschikt voor milde omstandigheden, terwijl 5mm (5/4/3 of volledig 5mm) geschikt is voor koud water. Borstrits-ingangen sluiten beter dan ritsen op de rug en verminderen het spoelen. De constructie van de naden — gelijmd en blind-gestikt (GBS) — is het verschil tussen een lek pak en een warm pak.
  solution: Pas de dikte aan op de lokale watertemperatuur met een foutmarge van 5°C. Voor gematigde klimaten koop een 3/2 mm. Voor koud water koop een 5/4/3 mm. Voeg laarzen, handschoenen en een capuchon toe om je bereik met nog eens 5°C naar beneden uit te breiden. Pas de pakken voordat je ze koopt of kies een merk met een ruim retourbeleid.
  recommendation: Het Aquafarer Wetsuit Pro in 5/4/3mm is ideaal voor de meeste surfers in koud water, en biedt GBS-naden en thermische voering. Als je surft in warm water boven 20°C, is een 3/2mm met borstrits de betere keuze.
  faq:
    - q: Bij welke watertemperatuur is een wetsuit van 5 mm nodig?
      a: Watertemperaturen tussen 8°C en 14°C vragen om een wetsuit van 5 mm. Bij temperaturen onder 8°C heb je een wetsuit met capuchon van 6/5/4 mm nodig. Tussen 14°C en 18°C werkt een 4/3 mm wetsuit voor de meeste mensen goed.
    - q: Kan ik een 3 mm wetsuit in de winter dragen?
      a: Alleen in milde winterklimaten waar het water boven de 16°C blijft. Voor echt winters surfen is 5mm of 5/4/3mm nodig. Laarzen, handschoenen en een capuchon bieden een equivalente warmte zonder dat een dikkere romp nodig is.
    - q: Hoe strak moet een wetsuit zitten?
      a: Aangenaam strak maar niet beperkend. Er mogen geen luchtbellen of los neopreen zijn. Als je een vinger tussen je huid en het pak bij de onderrug kunt schuiven, is het te los. Als ademen moeilijk is of beweging ernstig wordt beperkt, kies dan een grotere maat.
    - q: Houden dure wetsuits je warmer?
      a: Een hogere prijs betekent vaak beter neopreen (op kalksteenbasis versus op petroleumbasis), betere naadconstructie (GBS versus alleen gelijmd) en betere flexibiliteit. Deze factoren beïnvloeden direct warmte en duurzaamheid, maar alleen als de pasvorm correct is.
