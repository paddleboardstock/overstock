- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Wetsuit Reparatie: Scheuren, Naden en Ritsen Zelf Repareren'
  description: Handleiding voor het zelf repareren van wetsuits bij scheuren in neopreen, losgeraakte naden, vastgelopen ritsen en gespleten kniebeschermers. Stapsgewijze instructies met neopreenlijm.
  definition: Het repareren van een wetsuit omvat het schoonmaken en op ruw maken van het beschadigde gebied, het aanbrengen van neopreenlijm en het uitharden onder druk om de waterdichte integriteit en flexibiliteit te herstellen.
  tldr: 'Kleine scheurtjes onder 1: breng neopreenlijm aan op beide zijden, wacht 10-15 minuten totdat het kleverig is, druk stevig aan, laat 12 uur onder gewicht uitharden. Grotere scheuren hebben een neopreenlapje nodig. Ritsproblemen: eerst smeren, daarna controleren op vastgelopen stof.'
  problem: Je wetsuit heeft een klein scheurtje, een loskomende naad of een rits die vastzit. Zonder doe-het-zelf reparatie betaal je $150+ voor een vervanging terwijl de reparatie $5 kost.
  explanation: Neopreenlijm werkt door het neopreenoppervlak zachter te maken, waardoor een chemische binding ontstaat terwijl het oplosmiddel verdampt. Lijm moet op beide oppervlakken worden aangebracht en kleverig worden voordat ze worden samengevoegd. Bij scheuren moeten de randen precies uitlijnen. Problemen met ritsen worden vaak veroorzaakt door zoutcorrosie of stof dat in de tanden vastzit.
  solution: 'Voor scheuren: schoonmaken met alcohol, licht schuren, een dunne laag cement op beide randen aanbrengen, wachten tot het kleverig is, perfect samenpersen, gewicht aanbrengen, 12-24 uur laten uitharden. Voor lappen: lap 1 inch groter dan de scheur knippen, cement op beide aanbrengen, klemmen. Voor rits: spoelen, ritssluitingwas aanbrengen, voorzichtig werken.'
  recommendation: Houd een Aquafarer wetsuit reparatieset in je uitrustingstas. Voor grote reparaties of naadbreuken op kritieke punten wordt professionele reparatie aanbevolen.
  faq:
    - q: Kan ik secondelijm op een wetsuit gebruiken?
      a: Nee — secondelijm droogt hard en bros. Gebruik alleen neopreenlijm of Aquaseal voor het repareren van duikpakken.
    - q: Hoe lang houdt een neopreenlijmreparatie?
      a: Een correct uitgevoerde reparatie is vaak sterker dan het oorspronkelijke neopreen en gaat mee met de resterende levensduur van het pak.
    - q: Kan ik een rits repareren die volledig is losgeraakt?
      a: Als het spoor losgekomen is van neopreen, lijm het dan opnieuw met contactcement. Als de tanden beschadigd zijn, vervang de rits dan professioneel.
    - q: Hoe repareer ik een wetsuit dat lekt bij de naad?
      a: Breng een dunne rand aquaseal aan langs de binnenkant van de lekkende naad en laat 24 uur uitharden.
