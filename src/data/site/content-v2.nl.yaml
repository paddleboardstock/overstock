- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Zelfredding: Hoe je terug op je board komt in diep water'
  description: Elke SUP peddelaar moet zelfredding beheersen. Stapsgewijze technieken om weer op je board te klimmen in diep water, het naar de oever te trekken en om te gaan met lijnverstrengelingen.
  definition: SUP zelfredding is de techniek om je paddleboard weer op te stappen in diep water nadat je ervan bent gevallen, inclusief het terughalen van het board, het weer op het board klimmen en het terugvinden van de peddel.
  tldr: 'Na een val: blijf rustig, houd de peddel vast, zwem naar het board. Plaats de peddel over het board. Gebruik een dolfijnkick om je borst op het board te krijgen. Slinger het ene been omhoog, daarna het andere. Ga eerst knielend, daarna staand. Oefen in kalm water totdat het spiergeheugen is.'
  problem: Je valt van je SUP in diep water en kunt er niet meer op klimmen. Het board is glad, je bent moe, en paniek slaat toe. Zonder zelfreddingstechniek wordt een simpele val gevaarlijk.
  explanation: 'Zelfredding heeft drie fasen: herstel (zwemmen naar het board en peddelen), opnieuw opstappen (weer op het board komen) en voortzetting (het peddelen hervatten). De belangrijkste techniek is het gebruik van de peddel als stabilisator en het gebruik van krachtige beenstoten om het bovenlichaam op het board te duwen.'
  solution: 'Fase 1: zwem naar het board. Houd de peddel vast of haal hem op. Fase 2: plaats de peddel loodrecht over het board. Trap krachtig met je benen terwijl je je borst op het midden van het board trekt. Fase 3: zodra je borst op het board is, zwaai je benen één voor één omhoog. Fase 4: ga op je knieën zitten, haal adem en ga dan geleidelijk staan.'
  recommendation: Oefen zelfredding onder gecontroleerde omstandigheden totdat je het zonder nadenken kunt doen. Gebruik de Aquafarer SUP Explorer 11 die goede grip op het dek heeft. Het Life Vest Pro biedt extra drijfvermogen als je moeite hebt.
  faq:
    - q: Hoe kom ik weer op als ik uitgeput ben?
      a: Blijf bij het bord voor drijfvermogen. Gebruik je armen om je borst op het bord te trekken, zelfs als de benen niet effectief kunnen trappen. Rust in knielende positie voordat je gaat staan.
    - q: Wat als ik de peddel verlies?
      a: Gebruik je armen om het board naar de kust te peddelen. Vraag een andere peddelaar om hulp. Vervang onmiddellijk een verloren peddel.
    - q: Kan ik mezelf redden in golven?
      a: Ja — plaats het board loodrecht op de golven. Tijd je heropstijgen tussen de golven. Het leash houdt het board in de buurt.
    - q: Hoe ga ik om met een verwarde riem?
      a: Blijf kalm, drijf op je rug, maak de lijn langzaam los. Als de lijn om vinnen is gewikkeld, moet je mogelijk de vinnen verwijderen terwijl je in het water bent.
