  problem: Je hebt een draagbare boot nodig die klein opvouwt voor opslag op een jacht of transport met de auto. Booten met lattenbodem kosten tijd om in elkaar te zetten; oprolbare bodems missen stevigheid.
  explanation: Het luchtplatform blaast op tot een stijve platte platform zonder montage. Driedubbele laag PVC biedt duurzaamheid bij een gewicht van 35 kg. Drie onafhankelijke luchtkamers bieden redundantie. De spiegel is goedgekeurd voor 15 pk.
