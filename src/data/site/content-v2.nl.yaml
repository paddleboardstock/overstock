- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'SUP Leidinghondenriem Gids: Rechte vs. Opgerolde Riemen Uitleg'
  description: Volledige gids voor SUP lijnen — rechte versus opgerolde, enkel versus kuit, snel-ontgrendelingsopties, en hoe je de juiste riem kiest voor jouw peddelomstandigheden.
  definition: Een SUP lijn is een koord dat de peddelaar aan het board bevestigt, waardoor afscheiding wordt voorkomen. Typen omvatten rechte lijnen (voor surfen en rivieren) en opgerolde lijnen (voor vlak water).
  tldr: Gecoilde lijnen zijn het beste voor vlak water en fitnesspeddelen — ze blijven van het board af en uit het water. Rechte lijnen zijn voor SUP surfen en rivieren — ze bieden meer vrijheid en blijven niet haken. Kalfbevestiging wordt verkozen boven enkel voor comfort. Snellaadlijnen zijn belangrijk voor rivierenpeddelen om verstrikking te voorkomen.
  problem: Je hebt een riem gekocht met je SUP, maar je weet niet zeker of het het juiste type is voor je peddelstijl. De verkeerde riem zal trekken, haken of falen wanneer je hem het meest nodig hebt.
  explanation: Rechte leashes zijn simpele nylon- of polyurethaansnoeren die achter de plank meekomen. Ze werken goed bij surfen omdat ze niet blijven haken aan vinnen. Gevlochten leashes zijn spiraalsnoeren die samentrekken wanneer er geen spanning op staat — ze blijven opgerold op het dek tijdens het peddelen en rekken uit wanneer je valt. Ze houden de leash uit het water bij vlakke omstandigheden, wat de weerstand vermindert.
  solution: Kies een opgerolde lijn voor vlak water, fitness en toeren SUP. De verminderde weerstand helpt de snelheid te behouden en voorkomt dat de lijn blijft haken aan onderwaterobjecten. Kies een rechte lijn voor SUP surfen en rivierpeddelen. Het rechte ontwerp heeft minder kans om te haken aan vinnen of obstakels.
  recommendation: Aquafarer SUP pakketten bevatten het juiste type leash voor het beoogde gebruik van het board. De opgerolde leash in het SUP Explorer 11-pakket is uitstekend voor allround peddelen.
  faq:
    - q: Moet de riem aan mijn enkel of kuit worden bevestigd?
      a: Kalfbevestiging heeft de voorkeur voor SUP — het houdt de lijn uit het water tijdens het peddelen en vermindert het struikelgevaar bij het lopen.
    - q: Hoe lang moet een SUP riem zijn?
      a: 8-10' voor vlak water, 6-8' voor golven. Kortere leashes verminderen de weerstand maar beperken de bewegingsvrijheid op het board.
    - q: Heb ik een snelontgrendelingsriem nodig voor rivieren?
      a: Ja — rivier SUP vereist een snel los te maken riem of gordel die onmiddellijk kan worden losgemaakt om verstrikking in strainer te voorkomen.
    - q: Kan ik een surfriem gebruiken voor SUP?
      a: Surfleashes zijn korter en dunner. Ze werken voor SUP surfen, maar zijn niet ideaal voor vlakwaterpeddelen waarbij een langere opgerolde leash beter is.
