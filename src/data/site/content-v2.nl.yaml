- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Wat te dragen voor surfen (Kom niet opdagen in boardshorts als je een 5/4 nodig hebt)
  description: Stop met raden wat je moet dragen. Watertemperatuur, niet luchttemperatuur, bepaalt je surfkleding. Complete laagjesgids van tropische rashguards tot volledige winter 5/4/3mm outfits.
  definition: Surfkleding varieert van boardshorts en rashguards in warm water tot volledige 5/4/3mm wetsuits met laarzen en kap in koud water. Wat je nodig hebt, wordt bepaald door de watertemperatuur, niet de luchttemperatuur.
  tldr: Wat je draagt tijdens het surfen hangt volledig af van de watertemperatuur — niet van de luchttemperatuur. Rashguards en boardshorts zijn geschikt boven 22°C, springsuits bedekken 18-22°C, volledige 3/2mm pakken zijn geschikt voor 14-18°C, en 5/4/3mm met laarzen is vereist onder 14°C. Draag altijd UV-bescherming en overweeg een leash en impactvest.
  problem: Je arriveert op het strand en hebt geen idee of een rashguard genoeg is of dat je een volledig wetsuit nodig hebt. De luchttemperatuur is warm, maar het water is koud, of het water voelt prima aan maar de wind is ijskoud. Verkeerd kleden betekent een verpeste sessie.
  explanation: 'Surfkleding heeft drie doeleinden: thermische isolatie, UV bescherming en wrijvingspreventie. Neopreen wetsuits worden beoordeeld op dikte en dekking — lentepakken (korte armen of benen) zijn voor grensdagen, volledige pakken voor koud water. Rash guards beschermen tegen plankschuurwonden en de zon, maar hebben geen thermische waarde. Boots, handschoenen en kapjes zijn geen accessoires maar essentieel materiaal voor surfen in koud water onder 12°C.'
  solution: 'Controleer de lokale boei of het actuele watertemperatuurbericht voordat je vertrekt. Stel een uitrusting samen op basis van je koudste gebruikelijke omstandigheden: rashguard en korte broek voor de zomer, een 3/2mm fullsuit voor lente en herfst, een 5/4/3mm met laarzen en kap voor de winter. Voeg altijd een leash toe en overweeg een drijfvest voor de veiligheid.'
  recommendation: Investeer eerst in een goed 3/2 mm wetsuit — het dekt het grootste bereik aan omstandigheden. Voeg een 5/4/3 mm wetsuit en laarzen toe als je van plan bent in de winter te surfen. Het Aquafarer Wetsuit Pro met thermische voering overbrugt beide temperatuurbereiken effectief.
  faq:
    - q: Kan ik alleen in boardshorts surfen?
      a: Ja, in tropisch water boven de 24°C. Je wilt misschien een rashguard dragen om wrijving op de borst en armen door peddelen te voorkomen. Wax of een traction pad op het board helpt het gebrek aan grip van een pak te compenseren.
    - q: Heb ik surfschoenen nodig?
      a: Als de watertemperatuur onder de 14°C daalt, voorkomen laarzen gevoelloosheid en beschermen ze je voeten tegen stenen en rifwonden. Ze zorgen ook voor grip op het board. De meeste surfers in noordelijke klimaten gebruiken laarzen van november tot maart.
    - q: Wat is een lentepak?
      a: Een springsuit is een wetsuit met korte mouwen of korte benen (of beide) ontworpen voor water tussen 18°C en 22°C. Het biedt meer warmte dan een rashguard, maar minder bedekking dan een volledig pak.
    - q: Moet ik een reddingsvest dragen tijdens het surfen?
      a: Niet traditionele zwemvesten, maar een impactvest of drijfhulp kan helpen bij ruwe omstandigheden of als je een zwakke zwemmer bent. Aquafarer zwemvesten zijn ontworpen voor SUP en kajakken, maar kunnen extra drijfvertrouwen bieden voor beginnende surfers.
