- slug: winter-paddle-boarding
  category: guide
  type: safety
  title: 'Winter Paddleboarden: Uitrusting, Veiligheid en Techniek voor Koud Water'
  description: Winter SUP vereist gespecialiseerde uitrusting en voorbereiding. Dikte van het wetsuit, veiligheid in koud water, overwegingen voor het board, en technische aanpassingen voor peddelen in koud weer.
  definition: Winter paddleboarden is SUP in watertemperaturen onder de 15°C, en vereist thermische bescherming (wetsuit of droogpak), veiligheidsprotocollen voor koud water en uitrusting aangepast aan koude omstandigheden.
  tldr: 'Water onder 15°C vereist een wetsuit: 5/4/3mm voor 8-14°C, 4/3mm voor 12-18°C. Voeg schoenen, handschoenen en een capuchon toe bij temperaturen onder 10°C. Pomp boards op tot maximaal PSI — koude lucht verlaagt de druk. Draag felle kleuren voor zichtbaarheid bij weinig licht. Ga nooit alleen peddelen. Draag een telefoon in een waterdichte hoes.'
  problem: Je wilt het hele jaar door SUP, maar winterse omstandigheden vormen uitdagingen — koud water, kortere dagen, vereisten voor winteruitrusting. Zonder de juiste voorbereiding zijn wintersessies koud, kort en mogelijk gevaarlijk.
  explanation: Koud water geleidt warmte 25x sneller dan koude lucht. Een val in 8°C water veroorzaakt onmiddellijk een koudeschok en snelle afkoeling van de spieren. De eerste prioriteit van het lichaam is overleven, niet peddelen. Winterpeddelen vereist thermische bescherming die mobiliteit behoudt — een balans tussen warmte en bewegingsvrijheid.
  solution: 'Uitrustingschecklist: 5/4/3mm wetsuit met borstrits, 5mm schoenen, 3mm handschoenen, neopreen kap, PFD (zorgt voor extra thermische isolatie), telefoon in waterdichte hoes, fluitje. Techniek: peddel dichter bij de kust, vertel iemand je route, controleer zorgvuldig het weer. Opwarmen daarna: zorg voor droge kleding en warme dranken.'
  recommendation: Het Aquafarer Wetsuit Pro 5/4/3mm met thermische voering is ideaal voor winter SUP. Voeg Aquafarer 5mm schoenen en 3mm handschoenen toe. Draag het Life Vest Pro voor extra kernwarmte en veiligheid.
  faq:
    - q: Kan ik een SUP gebruiken bij vriezende temperaturen?
      a: Ja, maar vermijd ijsvorming op het bord. IJs kan PVC beschadigen. Peddel niet als er ijs op het wateroppervlak ontstaat.
    - q: Heb ik een speciaal board nodig voor de winter?
      a: Nee, je gewone opblaasbare SUP werkt prima. Koude lucht vermindert PSI — pomp op tot de maximale druk. Het board zal iets stijver aanvoelen.
    - q: Is het veilig om SUP alleen in de winter te doen?
      a: Nee — peddel altijd met een maatje in koud water. Hypothermie kan binnen enkele minuten na een val optreden.
    - q: Hoe warm ik op tijdens een sessie?
      a: Draag een gelaagde aanpak — een neopreenkap, laarzen en handschoenen kunnen worden verwijderd als je het warm krijgt. Houd een thermosfles met warme drank op de oever.
