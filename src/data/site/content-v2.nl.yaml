- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Onderhoud van Opblaasbare Boot: Behoud Uw Investering'
  description: Jaarlijkse onderhoudschecklist voor opblaasbare boten. Reiniging, UV bescherming, nadeninspectie, drukbeheer, motorzorg en winterklaar maken voor PVC en Hypalon boten.
  definition: Het onderhoud van een opblaasbare boot omvat schoonmaken, UV bescherming, drukbeheer, inspectie van naden en ventielen, schimmelpreventie en juiste opslag buiten het seizoen.
  tldr: Spoel na elk gebruik af met zout water. Breng elke 2-3 maanden UV beschermer aan. Controleer de opblaasdruk voor elke tocht. Controleer maandelijks de naden, ventielen en spiegel. Reinig met milde zeep. Bewaar in het laagseizoen leeggelopen op een koele, droge plaats.
  problem: Je hebt je opblaasbare boot een seizoen gebruikt en nu zien de buizen er vervaagd uit, lekt een naad en voelt de spiegel sponsachtig aan — allemaal te voorkomen met regelmatig onderhoud.
  explanation: UV straling degradeert de polymeermatrix. Zeewater kristalliseert in plooien en slijpt de stof af. Schimmel groeit in opgesloten vocht. Onjuiste druk veroorzaakt materiaalfatigue. De spiegel (vooral triplex) absorbeert water via schroefgaten.
  solution: 'Na elk gebruik: spoel af met vers water, droog, controleer de druk. Maandelijks: veeg de buizen af met UV beschermmiddel, inspecteer de naden, controleer het ventiel. Jaarlijks: diep reinigen, inspecteer de spiegel op rot, smeer de ventielen, test op micro-lekken.'
  recommendation: Gebruik 303 Aerospace Protectant op de bootbuizen van Aquafarer. Verwijder de ventielen en breng jaarlijks siliconenvet aan. Bewaar in de draagtas met een vochtvreter.
  faq:
    - q: Kan ik bleekmiddel gebruiken om mijn opblaasbare boot schoon te maken?
      a: Nee — bleekmiddel beschadigt de stofcoating. Gebruik milde zeep en warm water. Voor schimmel, gebruik verdunde witte azijn.
    - q: Hoe vaak moet ik behandelen met UV beschermmiddel?
      a: Elke 2-3 maanden tijdens het gebruiksseizoen. Frequenter in tropische klimaten.
    - q: Moet ik mijn boot tussen gebruik door leeg laten lopen?
      a: Niet als het wekelijks wordt gebruikt. Laat opgeblazen met een UV hoes erop. Voor maandelijkse onderbrekingen, laat leeglopen en bewaar.
    - q: Hoe onderhoud ik de spiegel?
      a: Controleer maandelijks de bouten. Seël blote houten randen jaarlijks met scheepsvernis. Vervang als er zachte plekken ontstaan.
