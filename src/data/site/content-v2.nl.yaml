- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP Fitness: Full Body Workout op een Paddleboard'
  description: SUP biedt een training voor het hele lichaam die cardiovasculaire uithoudingsvermogen, corestabiliteit en kracht combineert. Hoe SUP fitnesssessies te structureren, de beste oefeningen en het meten van vooruitgang.
  definition: SUP fitness gebruikt het instabiele platform van een paddleboard om de kernstabilisatoren, beenspieren en het bovenlichaam te activeren door te peddelen, balanceren en oefeningen op het board.
  tldr: SUP verbrandt 400-700 calorieën per uur. Een sessie van één uur SUP zet de kern, benen, rug, schouders en armen aan het werk. Interval peddelen (sprints + herstel) maximaliseert cardio. Yoga-houdingen op het board verbeteren balans en flexibiliteit. Voeg SUP-specifieke krachtbewegingen toe zoals squats en lunges op het board.
  problem: Sportschooltrainingen zijn saai geworden en je wilt een buitenactiviteit die je fit houdt en tegelijkertijd leuk is. SUP combineert avontuur met echte volledige lichaamstraining.
  explanation: Peddelen activeert de latissimus dorsi, deltoids, trapezius en kernspieren voor rotatie. Staan op een bewegend platform dwingt de stabiliserende spieren van enkels, knieën en heupen om constant te werken. De cardiovasculaire eisen van continu peddelen op matige intensiteit zorgen voor aerobe conditie.
  solution: 'Structuur van de sessies: 5 min warm-up peddelen, 20 min steady-state peddelen op een gematigd tempo, 15 min interval peddelen (30 sec sprint, 60 sec rustig), 10 min plank oefeningen (squats, lunges, push-ups), 5 min cool-down stretchen.'
  recommendation: Gebruik de Aquafarer SUP Explorer 11 voor fitnesspeddelen. Het stabiele platform stelt je in staat je te concentreren op techniek en intensiteit. Draag het Life Vest Pro voor veiligheid tijdens sessies met hoge intensiteit.
  faq:
    - q: Hoeveel calorieën verbrandt SUP?
      a: 400-700 calorieën per uur, afhankelijk van de intensiteit, wind en stroming. Interval peddelen verhoogt het aantal verbrande calorieën.
    - q: Is SUP goed voor gewichtsverlies?
      a: Ja, gecombineerd met de juiste voeding. De betrokkenheid van het hele lichaam en het lage-impact karakter maken het duurzaam voor regelmatige lichaamsbeweging.
    - q: Kan ik krachttraining doen op een SUP?
      a: Ja — squats, lunges, push-ups en planken op het bord voegen een balansuitdaging toe aan krachtbewegingen.
    - q: Welke spieren werkt SUP?
      a: 'Primair: kern (obliques, transversus abdominis), rug (lats, trapezius), schouders (deltoids), armen (biceps, triceps). Secundair: benen (quadriceps, hamstrings, kuiten).'
