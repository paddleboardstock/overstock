badge: Proof & Quality
heading: Bizonyíték
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Leértékelt készlet, kiskereskedelmi minőségű QC
    product: Minden túlkészlet tábla újraellenőrizve
    industry: Minőségellenőrzés
    challenge: A túlkészlet és leértékelt táblák a felesleges gyártási tételből származnak, ezért a vásárlók jogosan kérdezik, hogy a kedvezményes árú tábla ugyanazokat az ellenőrzéseket megfelel-e, mint a teljes árú.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: 99,3%-os hibamentességi arány a kimenő szállítmányoknál az elmúlt 12 hónapban — ugyanaz a szabvány vonatkozik a leértékelt és a kiskereskedelmi készletre is.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Hibamentes arány
        value: 99.3%
      - label: Nyomáspróba lefedettsége
        value: 100%
      - label: Tartási idő
        value: 24-48h
  - id: pressure-test-regime
    client: A 24-48 órás nyomás tartás
    product: Minden kamra, 1,25-szörös névleges nyomás
    industry: Termék tesztelés
    challenge: Egy SUP tábla élete a drop-stitch magjától és varrásaitól függ, és egy gyors felfújási ellenőrzés a vonal végén nem elég a lassú szivárgások vagy gyenge hegesztések felismerésére.
    solution: Minden tábla 1,25-szörös névleges nyomásra van felfújva és 24-48 órán át tartják, a nyomáscsökkenésnek 5% alatt kell maradnia. A szelepeket, D-gyűrűket, varrásokat és a felhajtóerőt nulla tűréssel ellenőrzik a biztonsági hibákra.
    result: A termelés 100%-a átesik ezen a folyamaton a csomagolás előtt — nincs mintaellenőrzés, nincs kivétel.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - 1,25-szörös nyomás
      - Zéró biztonsági hibák
    outcome_metrics:
      - label: Teszt nyomás
        value: 1.25x
      - label: Maximális nyomásesés
        value: <5%
      - label: Tesztelt egységek
        value: 100%
  - id: warranty-claims-support
    client: Garancia, ami valódi választ ad
    product: 2 éves garancia SUP táblákra & tartozékokra
    industry: Értékesítés utáni szerviz
    challenge: A gyári közvetlen leértékelt vásárlás felvet egy jogos kérdést — ha hónapokkal később valami probléma adódik, ki kezeli azt?
    solution: Minden deszka 2 éves jótállással érkezik, amely kiterjed a SUP deszkákra, drop-stitch varratokra, felfújható szelepekre és tartozékokra. A reklamációk közvetlenül a csapatunkhoz mennek — küldj fotókat vagy egy rövid videót, és mi elintézzük.
    result: A jótállási igényeket ugyanaz a csapat vizsgálja és oldja meg, amely a gyártást ellenőrzi — nincs forgalmazói kör.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - 2 éves jótállás
      - Közvetlen támogatás
      - Tartozékok fedezve
    outcome_metrics:
      - label: Garancia
        value: 2 év
      - label: Lefedettség
        value: Deszka + Tartozékok
      - label: Támogatás
        value: Közvetlen csapat
