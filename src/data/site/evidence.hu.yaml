badge: Proof & Results
heading: Bizonyíték
description: Valódi esettanulmányok, tanúsítványok, tesztadatok és telepítési fényképek, amelyek bemutatják a gyártási képességeinket és a termékminőséget.
case_studies:
  - id: retail-private-label
    client: Európai kültéri kiskereskedő
    product: Saját márkás SUP vonal
    industry: Kiskereskedelem
    challenge: Egy európai kültéri kiskereskedőnek szüksége volt egy saját márkás SUP vonalra, egyedi fedél grafikákkal, környezetbarát PVC és kiskereskedelmi kész csomagolással – mindez 60 napon belül szállítva.
    solution: Egyedi digitális nyomtatási fájlokat fejlesztettünk, REACH-kompatibilis PVC beszerzése, és a minták előállítását 3 kör helyett 1 körre tömörítettük úgy, hogy a tervező csapatot a csingdaui gyárunkban helyeztük el.
    result: 55 nap az aláírt megrendeléstől FOB-ig. 2,400 egység 4 SKU-ban. Ismételt rendelést adtak le, még mielőtt az első konténer megérkezett.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Kiskereskedelem
      - SUP
    outcome_metrics:
      - label: Vezetési idő
        value: 55 nap
      - label: Egységek
        value: 2,400
      - label: SKU-k
        value: '4'
  - id: startup-drop-stitch-kayak
    client: Amerikai vízi sport startup
    product: Drop-Stitch kajak
    industry: Startup / Kiskereskedelem
    challenge: Amerikai vízi sport startupnak szüksége volt egy nagy teljesítményű drop-stitch kajakra, egyedi testformával, közös márkázású csomagolással és BSCI tanúsítvánnyal a kiskereskedelmi értékesítéshez.
    solution: Hozzáigazítottuk a meglévő drop-stitch kajakformát módosított rocker profillal, kidolgoztuk a közös márkázású csomagolási grafikát, és teljes BSCI audit dokumentációt biztosítottunk.
    result: Sikeresen listázták 3 nagy amerikai kültéri láncban. 5,000 + egység az első évben, 98%-os eladási arány.
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
    tags:
      - OEM
      - Kajak
      - BSCI
    outcome_metrics:
      - label: Kiskereskedelmi láncok
        value: '3'
      - label: Első évi egységek
        value: 5,000+
      - label: Eladási arány
        value: 98%
  - id: australian-rib-distributor
    client: Ausztrál forgalmazó
    product: CE-tanúsított RIB termékskála
    industry: Tengerészet / Kormány
    challenge: Az ausztrál forgalmazónak szüksége volt egy CE-tanúsított RIB termékskálára, egyedi csőszínekkel, Hypalon frissítési lehetőséggel és az Ausztrál Standard AS 1799-nek való megfeleléssel.
    solution: Előgyártott mintákat készítettünk 4 csőváltozattal, CSM Hypalon-t szereztünk be japán szállítótól, és koordináltuk a harmadik fél AS 1799 megfelelőségi teszteket.
    result: 3-modelles RIB sorozatot indítottak az AU/NZ piacon. Ezt követte a kormányzati pályázat megnyerése 12 őrhajó RIBs számára.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Kormány
    outcome_metrics:
      - label: Bevezetett modellek
        value: '3'
      - label: Őrhajó szerződés
        value: 12 egység
      - label: Megfelelés
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Karib-tengeri Luxus Üdülőcsoport
    product: Üdülőflotta — RIBs, SUP, Kajakok
    industry: Vendéglátás / Turizmus
    challenge: Egy 5 üdülőhelyből álló csoport egységes flottát igényelt kölcsönözhető vízi sport felszerelésből — RIB tender, SUPs, és kajakok — egységes márkajelzéssel, a trópusi napfénynek ellenálló anyagokkal, valamint 5 éves csereütemtervvel.
    solution: Különleges 3-modelles flottacsomagot terveztünk UV-stabilizált PVC, üdülőhely márkázott fedélzeti grafikákkal és fokozatos szállítási ütemezéssel. Személyzeti képzést és minden üdülőhelyre külön pótalkatrész-készletet biztosítottunk.
    result: 180 egységet szállítottunk 5 üdülőhelyre. Ismételt rendelés 2 új létesítményhez. 40%-os csökkenés az egységenkénti költségben az előző beszállítókhoz képest.
    image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kajak
      - RIB
      - Vendéglátás
    outcome_metrics:
      - label: Szállított egységek
        value: 180
      - label: Üdülőhelyek
        value: '5'
      - label: Költségcsökkentés
        value: 40%
  - id: southeast-asia-search-rescue
    client: Délkelet-ázsiai Tengeri Ügynökség
    product: Őr- és Mentő RIB Flotta
    industry: Kormány / Tengeri Biztonság
    challenge: Egy kormányzati tengeri ügynökség 20 őr- és mentő RIBs-ot igényelt tűzálló Hypalon anyagból, önürítő padlókkal, integrált VHF/rádió konzolszereléssel, és SOLAS III. fejezet szerinti mentőhajó szabványoknak való megfeleléssel.
    solution: 20 RIBs-t gyártottunk CSM Hypalon csövekkel, tengeri minőségű alumínium hajótesttel, erős vontatófülekkel és előre telepített navigációs világítási csomagokkal. A gyári ellenőrző csapat jelen volt a tengeri próbákon. Teljes SOLAS dokumentációs csomagot biztosítottunk.
    result: A szerződést 4 hónap alatt teljesítettük. A flottát a határőrizet, keresés és mentés, valamint katasztrófavédelem céljából helyezték üzembe 3 regionális bázison.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Kormány
      - SOLAS
    outcome_metrics:
      - label: Őrhajó RIBs
        value: '20'
      - label: Szállítás
        value: 4 hónap
      - label: Bázisok
        value: '3'
  - id: european-dtc-ecommerce
    client: Európai DTC vízsportos márka
    product: Márkás SUP + kiegészítők
    industry: E-kereskedelem / Kiskereskedelem
    challenge: Egy gyorsan növekvő DTC vízsportos márka teljes SUP csomagra (deszka, pumpa, lapát, póráz, táska) szüksége volt prémium csomagolással, amely az e-kereskedelmi teljesítéshez volt tervezve — közvetlenül a fogyasztóhoz DHL/FedEx-en keresztül károsodás nélkül.
    solution: Fejlesztett ki egy közös márkájú termékvonalat egyedi EPS magformázással, nagyobb nyomáshoz szükséges saját drop-stitch technológiával, valamint kiskereskedelemre kész, dupla falú hullámos dobozokkal betétpárnázással. Integrált QR-kód alapú hitelesség és garanciális regisztráció.
    result: 3-modelles SUP sorozat 75 nap alatt indult. 15 000+ egység az első 12 hónapban. 4,8★ átlagos értékelés 2 000+ értékelésen. 0,3% kározási arány szállítás közben.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-kereskedelem
    outcome_metrics:
      - label: Modellek
        value: '3'
      - label: Egységek
        value: 15,000+
      - label: Átlagos besorolás
        value: 4.8★
      - label: Sebzési arány
        value: 0.3%
certifications:
  - name: CE
    body: Európai Unió
    desc: CE A termékek az alkalmazandó uniós irányelvek szerint tanúsítottak — szabadidős járművek az EN ISO 6185 szerint, személyes flotációs eszközök az EN ISO 12402 szerint, amennyiben alkalmazható.
  - name: ISO 9001
    body: SGS / BSI
    desc: Minőségirányítási rendszer, amely tanúsított a felfújható vízi járművek tervezéséhez, gyártásához és elosztásához.
  - name: BSCI
    body: amfori
    desc: Társadalmi megfelelőségi tanúsítvány, amely etikus gyártást, tisztességes munkát és munkahelyi biztonságot igazol.
  - name: REACH
    body: Európai Vegyipari Ügynökség
    desc: Minden anyag megfelel REACH a kémiai biztonsági előírásoknak. Minden szállítmányhoz dokumentációt biztosítunk.
  - name: RoHS
    body: Európai Unió
    desc: A veszélyes anyagok megfelelőségének korlátozása minden elektronikus és elektromos alkatrész esetében.
  - name: AS 1799
    body: Standards Australia
    desc: Ausztrál szabvány a felfújható csónakokra — tesztelt és tanúsított kereskedelmi használatra az AU/NZ vizeken.
