  title: 'Vzdrževanje napihljivih čolnov: Ohranite svojo naložbo'
  description: Letni seznam za vzdrževanje napihljivih čolnov. Čiščenje, UV zaščita, pregled spojev, upravljanje tlaka, nega motorja in PVC Hypalon priprava na zimo za čolne.
  definition: Vzdrževanje napihljivih čolnov vključuje čiščenje, UV zaščito, upravljanje tlaka, pregled spojev in ventilov, preprečevanje plesni ter ustrezno shranjevanje izven sezone.
  tldr: Po vsaki uporabi sperite v slani vodi. UV Zaščitno sredstvo nanesite vsakih 2-3 mesece. Pred vsakim izhodom preverite tlak napihnjevanja. Vsak mesec pregledujte spoje, ventile in krmo. Čistite z blagim milom. Shranjujte izpraznjene na hladnem in suhem mestu izven sezone.
  problem: Svojo napihljivo ladjo ste uporabljali eno sezono, zdaj pa so cevi videti zbledele, šiv se razpoka, krma pa je spužvasta — vse to je mogoče preprečiti z rednim vzdrževanjem.
  explanation: UV Sevanje razgrajuje polimerno matrico. Slana voda se kristalizira v gubah in obrablja tkanino. Plesen raste v ujeti vlagi. Nepravilni pritisk povzroča utrujenost materiala. Krma (zlasti vezana plošča) absorbira vodo skozi luknje za vijake.
  solution: 'Po vsaki uporabi: sperite s svežo vodo, posušite, preverite tlak. Mesečno: obrišite cevi s UV zaščitnim sredstvom, pregledajte spoje, zamenjajte ventil. Letno: temeljito očistite, pregledajte krmo za gnilobo, namažite ventile, testirajte na mikropuščanje.'
  recommendation: Uporabljajte 303 Aerospace Protectant na Paddle Board Overstock čolnarskih ceveh. Odstranite ventile in vsako leto nanesite silikonsko mast. Shranjujte v torbi za prenašanje skupaj s sušilnim paketom.
  faq:
    - q: Ali lahko uporabim belilo za čiščenje svojega napihljivega čolna?
      a: Ne — belilo poškoduje tkanino. Uporabite blago milo in toplo vodo. Za plesen uporabite razredčen beli kis.
    - q: Kako pogosto naj zdravim s UV protectantom?
      a: Vsakih 2-3 mesece med sezono uporabe. Pogosteje v tropskem podnebju.
    - q: Ali moram med uporabo izprazniti čoln?
      a: Ne, če se uporablja tedensko. Pustite napihnjene s UV prevleko. Za mesečne vrzeli izpraznite in shranite.
    - q: Kako vzdržujem krmo?
      a: Vijake mesečno preverjajte. Letno zatesnite izpostavljene robove lesa z morskim lakom. Zamenjajte, če se pojavijo mehka mesta.
