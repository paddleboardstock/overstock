- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Vzdrževanje napihljivih naprav: SUP Ohranjajte svojo desko obstojno več let'
  description: Pravilno vzdrževanje napihljivih desk SUP dramatično podaljša življenjsko dobo deske. Čiščenje, sušenje, nega ventilov, UV zaščita in sezonski nasveti za shranjevanje drop-stitch desk.
  definition: Vzdrževanje napihljivih naprav SUP vključuje čiščenje po uporabi, pravilno sušenje, pregled ventilov, UV zaščito in pravilno shranjevanje, da se prepreči delaminacija, plesni, propadanje materialov in puščanje zraka.
  tldr: Po vsaki seji s slano vodo desko sperite s svežo vodo. Popolnoma posušite, preden jo izpraznite in shranite. Ventil preverite za ostanke in O-obroč podmažite letno. Napihnjen (na polovici) shranjujte PSIna hladnem, temnem mestu. Izogibajte UV se dolgotrajni izpostavljenosti, ki se poslabša. PVCMajhne luknje takoj zakrpajte s priloženim kompletom za popravilo.
  problem: Po sezoni začne vaša napihljiva naprava SUP počasi puščati, podloga za teraso se na robovih lušči, občutek pa je trši PVC . Zanemarjanje osnovnega vzdrževanja povzroča prezgodnje staranje, ki ga je povsem mogoče preprečiti.
  explanation: PVC se razgradi pod UV vplivom sevanja. Solni kristali iz morske vode vdrejo v šive in ventile, kar povzroča mikro-puščanja. Vlaga, ujeta znotraj, spodbuja rast plesni, ki napada drop-stitch navoje. O-obročki ventilov se posušijo in izgubijo tesnilo. Umazanija in pesek se zbrusita v lepilo na plošči, kar povzroči dvigovanje robov.
  solution: 'Po vsaki seansi: sperite desko, rebra in črpalko s svežo vodo. Obrišite podlogo za teraso. Odprite ventil za odvajanje ujete vode. Sušite desko v senci pred izpraznjevanjem. Mesečno: pregledajte ventil in nanesite silikonsko mazivo na O-obroč. Sezonsko: operite z blagim milom in vodo, preverite morebitne preluknjave.'
  recommendation: Sledite Paddle Board Overstock navodilom za nego, ki je priložen vaši deski. Komplet za popravilo uporabite takoj ob vsaki predrtni luknji. Desko shranite v torbo na temperaturno nadzorovanem območju, stran od neposredne sončne svetlobe.
  faq:
    - q: Ali lahko svojo napihljivo pustim SUP napihnjeno celo sezono?
      a: Da, vendar shranjujte izven neposredne sončne svetlobe in največ na polovico PSI (8-10PSI), da zmanjšate obremenitev šivov. Popolnoma napihnite tik pred uporabo.
    - q: Kako naj očistim plesen s svojegaSUP?
      a: Zmešajte blago milo s toplo vodo in drgnite z mehko krtačo. Za trdovratno plesen uporabite razredčeno raztopino belega kisa (1:4). Izogibajte se belilu.
    - q: Ali moram podmazati ventil?
      a: Da, letno. Odstrani jedro ventila, nanesi silikonsko mast na O-obroč in ga ponovno namesti. To preprečuje puščanje zraka.
    - q: Kako naj ga shranim SUP za zimo?
      a: Temeljito očistite in posušite. Popolnoma izpraznite, rahlo zvijte (izogibajte se tesnim gubam) in shranjujte na hladnem, temnem in suhem mestu. Izogibajte se zmrzovalnim temperaturam.
