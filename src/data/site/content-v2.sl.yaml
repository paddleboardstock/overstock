  title: 'Vodnik za velikost deske: Volumen, dolžina in širina za vsakega kolesarja'
  description: Popolna velikost deske za veslanje s priporočili za volumen glede na težo in aktivnost. Vključuje enostavno za uporabo tabelo velikosti za vsestranske, turistične deske, surfanje in jogo SUP .
  definition: Velikost paddle deske je določena z volumnom (nosilnost in plavajoča zmogljivost), dolžino (hitrost in sledenje), širino (stabilnost) in debelino (porazdelitev volumna in upor vetra).
  tldr: 'Uporabite težo za določitev minimalnega volumna: 50-70 kg potrebuje 220-260L, 70-90 kg 260-300L, 90-110 kg 300-350L, 110+ kg 350L+. Za začetnike dodajte 20% k tem številkam. Širina je pomembna: 32" je vmesna, 33-34" je prijazna za začetnike, 35"+ je zelo stabilna.'
  problem: Seznami velikosti veslaških desk uporabljajo izmenično stopale, palce in litre, kar otežuje primerjavo med znamkami.
  explanation: Volumen je najbolj neposreden pokazatelj za nosilnost — 1 liter sladke vode izpodriva 1 kg teže. Deska s 260L lahko teoretično podpira 260 kg, vendar je praktična kapaciteta nižja, ker mora deska stati nad vodo. Vaša skupna teža (telo plus oprema) bi morala biti 30-40 % volumna deske.
  solution: Ciljni volumen = (telesna teža v kg, + teža opreme v kg) x 3. Za veslača s 5 kg opremo do 75 kg je cilj = 80 x 3 = minimalno 240L. Za začetnike pomnožite z 3,5. Za napredne pomnožite z 2,5.
  recommendation: Paddle Board Overstock SUP Explorer 11 (260L, 11' x 33" x 6") ustreza večini kolesarjev, težkih 50-100 kg. Lažji kolesarji lahko izberejo velikost AirDeck do 270. Težji kolesarji naj si ogledajo SUP Tour 12 (300L+) ali širše deske.
  faq:
    - q: Ali je višina pomembna za SUP velikost?
      a: Višina je manj pomembna kot teža. Visok in lahek kolesar potrebuje manj volumna kot nizek težji kolesar. Kot glavni dejavnik volumna uporabite težo.
    - q: Kaj se zgodi ob preveliki glasnosti?
      a: Deska sedi previsoko in lovi veter kot jadro. V valovitih valovih se zdi neenakomerna. Vendar pa je za začetnike večji volumen boljši kot premajhen.
    - q: Kaj se zgodi, če je glasnost premajhna?
      a: Deska sedi pregloboko, kar ustvarja upor. Nos se lahko potopi med veslanjem (pearling). Hitro se utrudite od veslanja po delno potopljeni deski.
    - q: Ali napihljive deske potrebujejo drugačne velikosti kot trde deske?
      a: Ne bistveno. Napihljive deske pri 15 stopinjah+ PSI izpodrivajo vodo podobno kot trde deske. Priporočila glede volumna veljajo enako za obe vrsti.
