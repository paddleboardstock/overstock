  title: 'Razumevanje plimovanja za vodne športe: praktičen vodič'
  description: Kako plime vplivajo SUPna razmere za deskanje in kajakaštvo. Branje plimnih diagramov, razumevanje spomladanskih in neap plimnih razmer ter načrtovanje treninga glede na gibanje plimovanja zaradi varnosti.
  definition: Plime so dnevni dvig in padec morske gladine, ki jih povzroča gravitacijski vpliv lune in sonca. Razpon plime se razlikuje glede na lokacijo in lunino obdobje.
  tldr: 'Dve visoki in dve nizki plimi dnevno na večini krajev. Spomladanske plime (polna/mlada luna) imajo večje razdalje in močnejše tokove. Plimovanja (četrt lune) imajo manjše razpone. Plima vpliva na globino vode, obliko valov in moč toka. Za SUP: najprej veslaj proti toku, da ti pomaga vrniti.'
  problem: Prispeš do lokalnega odliva in najdeš komaj kaj valov, nevarne valove zaradi odhajajoče plime ali preplitvo vodo. Brez razumevanja plimovanja zapravljaš izlete ali veslaš v nevarnih razmerah.
  explanation: Plimovanja so posledica lunine gravitacije. Pomladne plime (polna in mlada luna) prinašajo najvišje vrhove in najnižje vrednosti. Plimovanja (četrt lune) povzročajo minimalen doseg. Plimni tokovi so najhitrejši sredi plime, sproščeni pri visokih in nizkih temperaturah. Plimni razpon se giblje od 0,3 m (Sredozemlje) do 16 m (zaliv Fundy).
  solution: 'Pred vsako sejo preverite plimni diagram. Za surfanje: odmori na plaži pogosto trajajo najbolje 2-3 ure ob obe strani plime. Za SUPto: veslaj proti trenutni prvi polovici, da se tok vrne. Za ribolov: prihajajoča plima potisne ribe na ravnice.'
  recommendation: Uporabite NOAA napovedi plimovanja ali lokalno aplikacijo za plimo. Spoznajte preference glede plimovanja vašega lokalnega preloma tako, da beležite razmere skozi mesec dni.
  faq:
    - q: Kaj je pomladna plima?
      a: Spomladanske plime se pojavljajo med polno in mlado luno, kar povzroča višje plime in močnejše tokove. Pojavijo se dvakrat mesečno.
    - q: Kaj je neap tide?
      a: Neap plimovanje se pojavi med četrt lune. Plimni razpon je manjši, tokovi šibkejši — dobro za začetnike.
    - q: Ali so nizke plime nevarne zaSUP?
      a: Nizka plima lahko razkrije kamnine in grebene. Prav tako koncentrira energijo valov na strmejše peščene sipine.
    - q: Kako plime vplivajo na tokove ob odtrganju?
      a: Odhajajoče plime (plima) krepijo tokove ob obtoku. Prihajajoče plime (poplave) zmanjšujejo moč odtokov.
