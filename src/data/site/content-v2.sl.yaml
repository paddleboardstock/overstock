  title: 'Popravilo neoprenske obleke: Sami popravite raztrganine, šive in zadrge'
  description: Vodič za popravilo neoprenske obleke za raztrganine neoprena, ločevanje šivov, zadrge in razpokane ščitnike za kolena. Navodila korak za korakom z uporabo neoprenskega lepila.
  definition: Popravilo neoprenske obleke vključuje čiščenje in grobo obdelavo poškodovanega območja, nanašanje neoprenskega cementa ter strjevanje pod pritiskom, da se obnovi vodotesna celovitost in prožnost.
  tldr: 'Majhne raztrganine pod 1": nanesite neoprenski cement na obe strani, počakajte 10-15 minut, da postane lepljivo, močno pritisnite, pod težo se strdite 12 ur. Večje raztrganine potrebujejo neoprenski obliž. Težave z zadrgo: najprej namažite z mazivom, nato preverite, če so tkanine zagozdene.'
  problem: Vaša neoprenska obleka ima majhno raztrganino, razpoko ali zadrgo, ki se zatakne. Brez popravila sami plačate 150 $+ za zamenjavo, čeprav popravilo stane 5 $.
  explanation: Neopren cement deluje tako, da zmehča površino neoprena, kar ustvari kemično vez, ko topilo izhlapeva. Cement je treba nanesti na obe površini in postati lepljiv pred spajanjem. Pri raztrganinah morajo biti robovi natančno poravnani. Težave z zadrgo so pogosto korozija zaradi soli ali tkanina, ujeta v zobe.
  solution: 'Za raztrganine: očisti z alkoholom, rahlo pobrusi, nanesi tanek sloj cementa na oba roba, počakaj, da postane lepljivo, popolnoma stisni skupaj, nanesi težo, strdi 12-24 ur. Za obliže: odreži zaplato 1" večjo od raztrganine, nanesi cement na oba, sponko. Za zadrgo: speri, nanesi vosek za zadrgo, delaj nežno.'
  recommendation: Paddle Board Overstock V torbi za opremo imejte komplet za popravilo neoprenske obleke. Za večja popravila ali okvare šivov na kritičnih mestih je priporočljivo strokovno popravilo.
  faq:
    - q: Ali lahko uporabim super lepilo na neoprenski obleki?
      a: Ne — super lepilo se posuši trdo in krhko. Za popravila neoprenske obleke uporabljajte samo neopren cement ali aquaseal.
    - q: Kako dolgo traja popravilo neoprenskega cementa?
      a: Pravilno izvedeno popravilo je pogosto močnejše od originalnega neoprena in traja do konca življenjske dobe obleke.
    - q: Ali lahko popravim zadrgo, ki se je popolnoma ločila?
      a: Če se je tirnica ločila od neoprena, ponovno zalepite s kontaktnim lepilom. Če so zobje poškodovani, profesionalno zamenjajte zadrgo.
    - q: Kako popravim, da potapljaška obleka pušča na šivu?
      a: Nanesite tanek sloj aquaseala vzdolž notranjosti puščajočega šiva in pustite, da se strdi 24 ur.
