  title: 'SUP Napihljiva shramba: Pravi način shranjevanja vašega iSUP-a'
  description: Pravilno SUP napihljivo shranjevanje preprečuje delaminacijo, UV poškodbe, plesni in puščanje ventilov. Nasveti za zimsko shranjevanje, dolgoročno shranjevanje in dnevno shranjevanje drop-stitch desk.
  definition: SUP Napihljivo shranjevanje pomeni ohranjanje deske v čistim, suhem in temperaturno nadzorovanem okolju, stran od UVekstremnih temperatur in fizičnih poškodb.
  tldr: Shranjujte na hladnem, temnem mestu pod 30 °C, stran od neposredne sončne svetlobe. Za kratek čas (1-2 tedna) shranjujte delno napihnjenega na 8-10 °PSIC. Za dolgoročno shranjevanje popolnoma izpraznite, ohlapno zvite in položite v vrečko za shranjevanje. Nikoli ne shranjujte mokre. Držite se stran od glodavcev in ostrih predmetov.
  problem: Izprazniš jo in jo stlačiš SUP v vročo garažo ali vlažno klet. Tri mesece kasneje je PVC porumenela, podloga za teraso se lušči in ventil pušča. Nepravilno shranjevanje povzroči več škode kot običajna uporaba.
  explanation: Toplota nad 50 °C povzroči PVC migracijo plastifikatorjev, zaradi česar je material trd in krhek.UV Sevanje razgrajuje polimerne vezi. Vlaga, ujeta znotraj, ustvarja plesen. Mraz pod lediščem naredi PVC mehkek. Tlačne točke zaradi tesnega prepogibanja povzročijo trajne gube.
  solution: 'Kratkoročno shranjevanje: sperite, posušite, napihnite na 10 in PSIshranite nad tlemi na senčnem mestu. Dolgoročno shranjevanje: temeljito očistite, popolnoma posušite, popolnoma izpraznite, zvijte s podlogo za teraso navzven, položite v vrečko, shranite v hladno suho omaro. Izogibajte se kemikalijam in škodljivcem.'
  recommendation: Uporabljajte Paddle Board Overstock torbo za shranjevanje — blokira UV in preprečuje drgnjenje. Shranjujte v prostoru z nadzorovano klimo. V torbo dodajte izsuševalni paket za vlažna okolja.
  faq:
    - q: Ali lahko SUP svojo napihnjeno shranim v garaži?
      a: Samo če garaža ostane pod 30°C in nima neposredne sončne svetlobe. Večina garaž poleti preseže 40°C.
    - q: Naj jo shranim SUP v torbi?
      a: Da, vrečka ščiti pred prahom UVin fizičnimi poškodbami. Pred pakiranjem se prepričajte, da je deska popolnoma suha.
    - q: Ali lahko zmrzovanje poškoduje napihljivo napravoSUP?
      a: Da. Pod lediščem PVC postane krhek in se lahko razpoka, ko ga odviješ ali napihneš. Vedno shranjuj nad 5 °C.
    - q: Kako naj zvijem svojo SUP za shranjevanje?
      a: Valjajte tako, da je podloga obrnjena navzven, da zaščitite dnoPVC. Izogibajte se tesnim gubam. Vsakič izmenjujte položaj prepogibanja.
