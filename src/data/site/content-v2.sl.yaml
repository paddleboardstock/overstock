- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard proti shortboardu (Iskren odgovor, ki ti ga nihče ne da)
  description: Longboardi ujamejo več valov; shortboardi se zavijejo težje. Pravo vprašanje je, katera od teh se ujema z vašimi spretnostmi in lokalnimi prelomi. Iskrena primerjava, ki zajema stabilnost, število valov in napredovalno past.
  definition: Longboardi (9ft+) dajejo prednost stabilnosti in enostavnosti lovljenja valov; shortboardi (5-7ft) dajejo prednost okretnosti in zmogljivosti na strmih valovih. Prava izbira je odvisna od vaše spretnosti in lokalnih vrst valov.
  tldr: Longboardi (9 ft+) so stabilni, zlahka lovijo valove in so primerni za začetnike in surfarje, usmerjene v križarjenje. Shortboardi (5-7 ft) so odzivni, hitrejši na valovni strani in primerni za izkušene deskarje. Prava izbira je odvisna od vaše spretnosti, vrste valov in tega, kaj vam je pri surfanju najbolj všeč.
  problem: Vidite videe deskarjev, ki delajo ostre zavoje na shortboardih, in longboarderjev, ki elegantno drsijo po nosu deske — oba izgledata zabavno. Proračun imate le za eno vrsto deske in morate vedeti, kateri slog ustreza vašim ciljem in lokalnim prekinitvam.
  explanation: Longboardi imajo večjo površino, kar pomeni, da veslajo hitreje, ujamejo valove prej in nudijo stabilno platformo za hojo in cross-steping. Odlično se odrezajo na majhnih, počasnih valovih, kjer bi shortboard potonila. Shortboardi imajo manjši volumen in bolj agresiven rocker, kar jim omogoča, da se potopijo globlje v obraz valov, ustvarjajo hitrost skozi ovinke in se prilegajo strmim, votlim odsekom. Shortboardi zahtevajo močno veslanje in natančno časovno usklajevanje valov. Pogosta zmota je, da shortboardi niso "boljši" — so preprosto različna orodja za različne pogoje in ravni spretnosti.
  solution: Če ste začetnik, vozite longboard (ali napihljivo desko z velikim volumnom) vsaj 6 mesecev. Če ste srednje zahtevni in so vaši lokalni valovi pogosto majhni in počasni, bo longboard ali hibrid ujel več valov in bo bolj zabaven. Če so vaši valovi strmi, votli in hitri, je kratka deska nujna, da se prilega žepu. Veliko srednje izkušenih surferjev vzdržuje oboje in izbira glede na dan.
  recommendation: Začnite s Paddle Board Overstock Surfboard Pro kot svojo longboard platformo. Ko dosledno zavijate in ustvarjate hitrost, razmislite o dodajanju hibridne ali kratke deske za dni z močnimi valovi. Večina surferjev, ki poskušajo shortboard igrati prehitro, je na koncu frustrirana in vozi manj valov.
  faq:
    - q: Ali je longboard lažji za vožnjo kot shortboard?
      a: Veliko lažje. Longboardi ujamejo valove prej, veslajo hitreje in so bolj stabilni med skoki in trimom. Shortboardi zahtevajo natančno časovno usklajenost, močnejše veslanje in boljšo presojo valov.
    - q: Ali znaš delati obrate na longboardu?
      a: Da, čeprav je slog drugačen. Longboard zavoji so širši, gladki in vključujejo celotno telo. Nose ride, cutback in hang-fives so longboard specifični manevri z lastnim napredkom v spretnosti.
    - q: Katera deska je boljša za majhne valove?
      a: Longboardi in hibridi se bolje obnesejo v majhnih, šibkih valovih, ker ustvarjajo drsenje in ohranjajo zagon. Shortboardi potrebujejo strmejše in močnejše valove za zmogljivost.
    - q: Ali je kratka deska težja za veslanje?
      a: Občutno težje. Manjši volumen pomeni, da deska sedi nižje v vodi, kar ustvarja večji upor. Veslanje na kratki deski je kot plavanje z zavornim padalom v primerjavi s veslanjem na longboardu.
