- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Pravila bontona pri surfanju (Kako ne biti oseba, ki se ji vsi izogibajo)
  description: Postava ima pravila, ki jih nihče ne zapisuje. Naučite se prednosti poti, zakaj vas vijuganje spravi v kričanje, kako se opravičiti in začetniške napake, ki motijo vsakega lokalnega surferja.
  definition: 'Surferska etika je nepisan kodeks ravnanja, ki preprečuje trke in si valove deli pošteno. Osnovno pravilo: deskar, ki je najbližje vrhu valov, ima prednost.'
  tldr: Deskar, ki je najbližje vrhu valov, ki se lomi, ima prednost. Ne zavijajte na nekoga, ne veslajte (veslajte okoli nekoga, da vzamete njegov val) in se vedno opravičite, če naredite napako. Veslajte široko okoli vrste, držite se deske in bodite prijazni — spoštovanje prinaša spoštovanje.
  problem: Veslaš do polne vrste in takoj začutiš napetost. Surferji te gledajo postrani, nekdo ti kriči in nisi prepričan, kaj si naredil narobe. Družbeni vidik surfanja se zdi bolj zastrašujoč kot sami valovi.
  explanation: 'Bonton pri surfanju obstaja zato, da prepreči trke in pošteno deli valove. Temeljno pravilo je prednost: deskar najbližje vrhu (kjer se val prvič zlomi) ima prednost. Kdor vesla za isti val iz globlje notranjosti, mora odnehati. Sikanje — veslanje okoli drugega deskarja za krajo prednosti — velja za najslabši prekršek. Poleg prioritete ima postava pričakovanja glede hrupa (kričanje na minimum), nadzora deske (nikoli ne dovolite, da se deska približa drugim) in prijaznosti (preprost prikimavanje veliko pomeni).'
  solution: Opazuj postavo 10 minut, preden začneš veslati. Ugotovi, kdo lovi največ valov — to so deskarji, ki jih je treba spoštovati in se jim izogibati. Če se učiš, ostani znotraj (območje divjih voda). Veslaj široko okoli vrste, ne skozi njo. Ko ujameš val, poglej v obe smeri, preden skočiš gor, in preveri, da ni nikogar globlje.
  recommendation: Prvih nekaj treningov preživite na začetniškem odmoru, kjer je množica razpršena. Preden se lotite gneče v vrsti, se naučite brati prioritete. Če se zgodi, da koga napadete, se takoj opravičite in preveslajte — večina deskarjev spoštuje pošteno napako.
  faq:
    - q: Kaj je drop-in?
      a: Skočiti v vodo pomeni veslati za in jahati val, na katerem ima že drugi deskar prednost. To je nevarno in nespoštljivo. Deskar, ki je najbližje vrhu, je lastnik vala; kdorkoli drug se mora umakniti.
    - q: Kaj je vijuganje?
      a: Kakanje pomeni, da veslaš okoli drugega deskarja, ki je že v položaju za val, da se približaš vrhu. To velja za izjemno slabo vedenje in lahko vodi v spopad.
    - q: Ali lahko začetniki surfajo na gneči?
      a: Da, vendar ostanite v območju divje vode stran od vrha. Ne veslajte v glavno območje vzleta, dokler ne znate dosledno loviti valov in nadzorovati smer. Gneče v vrstah zahtevajo izkušnje za varno navigacijo.
    - q: Kako se opravičim v vodi?
      a: Preprosto mahanje, nasmeh in »moja napaka« ali »oprosti« deluje. Priznaj napako in veslaj stran od osebe. Surferji so na splošno prizanesljivi do iskrenih napak, še posebej, če se očitno učiš.
    - q: Kaj naj naredim, če me kdo obišči?
      a: Če gre za jasen drop-in, zakriči "pomahaj" ali "hej", da jih opozoriš. Če to opazijo po nesreči in se opravičijo, naj gre mimo. Če nekdo večkrat pride noter, priveslaj in vljudno razloži prednost. Izogibaj se spopadom.
