  title: 'SUP Vodič za veslanje: Izberite pravo veslo za svoj slog'
  description: Popoln vodič po SUP lopaticah — dolžina, materiali (aluminij, steklena vlakna, karbon), oblike lopatic in kako izbira vesla vpliva na vašo izkušnjo veslanja.
  definition: SUP Veslo je sestavljeno iz gredi (aluminij, steklena vlakna ali ogljik) in lopatice (dihedralna, zajemalna ali ravna). Dolžina naj bo 8-10" nad vašo višino za splošno veslanje.
  tldr: 'Dolžina vesla: 8-10" nad vašo višino za vsestransko uporabo, 6-8" za surf, 10-12" za touring. Materiali: aluminij (poceni, težki), steklena vlakna (srednji razred, dobra prožnost), karbon (lahek, trdo, drag). Oblika lopatic: dihedral (stabilno sledenje), scoop (moč), raven (vsestranski). Nastavljiva vesla so odlična za začetnike.'
  problem: Priloženo veslo pri večini iSUP-ov deluje, vendar je težko in neučinkovito. Nadgradnja izboljša učinkovitost in užitek pri veslanju, vendar so možnosti zmedene.
  explanation: 'Dolžina lopatic vpliva na učinkovitost hoda — prekratka zahteva upogibanje, predolga pa utrujenost ramen. Material določa težo: ogljikova lopatica tehtajo 18-24 oz, aluminijasta pa 28-36 oz. Velikost lopatic vpliva na moč: večja lopatica (100+ sq in) nudijo več pogona na gib, a hitreje se utrudijo. Dihedralne lopatice sledijo naravnost; lopatice z zajemalcem nudijo več oprijema.'
  solution: 'Za pravilno dolžino: stoj z veslom navpično, roko dvignjeno — ročaj vesla naj doseže tvoje zapestje. Za material: začni s steklenimi vlakni kot nadgradnjo srednje teže. Za rezilo: izberi dihedral za splošno veslanje. Za aktivnosti: touring vesla so daljša z manjšimi rezili; surf vesla so krajša z širšimi lopaticami.'
  recommendation: Karbonsko Paddle Board Overstock veslo s težo 28 oz je najboljša nadgradnja za pogoste veslače. Priloženo nastavljivo 3-delno aluminijasto veslo je primerno za začetnike in potovanja.
  faq:
    - q: Kako dolg SUP naj bo moj veslač?
      a: Višino izmerite v palcih in dodajte 8-10 za veslanje. Za surfanje dodajte 6-8. Za turo dodajte 10-12.
    - q: Ali je karbonsko veslo vredno svojega denarja?
      a: Da, za redne veslače — zmanjšanje teže znatno zmanjša utrujenost pri daljših treningih. Za občasno uporabo je steklena vlakna dobra vrednost.
    - q: Kaj je nastavljiva lopatica?
      a: Veslo z dvema ali tremi deli z nastavitvijo dolžine, idealno za deljenje med uporabniki ali prilagajanje za različne aktivnosti.
    - q: Kako naj skrbim za svojo lopatico?
      a: Po uporabi s slano vodo sperite s svežo vodo. Izogibajte se vožnji po njem ali shranjevanju na neposredni toploti. Preverite ferulo (spoj) za pesek.
