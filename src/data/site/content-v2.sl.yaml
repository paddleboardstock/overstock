- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Samoreševanje: Kako se vrniti na desko v globoki vodi'
  description: Vsak SUP veslač bi moral obvladati samoreševanje. Korak-po-koraku tehnike za ponovno namestitev deske v globoki vodi, vleko do obale in reševanje zapletov na povodcu.
  definition: SUP Samo-reševanje je tehnika ponovnega namestitve deske v globoki vodi po padcu, vključno z dvigom deske, ponovnim namestitvijo telesa in dvigom vesla.
  tldr: 'Po padcu: ostanite mirni, držite veslo, zaplavajte do deske. Postavite veslo čez desko. Uporabite delfinov brc, da potisnete prsni koš na desko. Zamahnite z eno nogo navzgor, nato z drugo. Najprej pokleknite, nato vstanite. Vadite v mirni vodi, dokler ne postane mišični spomin.'
  problem: Padeš SUP v globoko vodo in se ne moreš več povzročati nanj. Deska je spolzka, utrujena si in nastopi panika. Brez poznavanja tehnike samopomoči je preprost padec nevaren.
  explanation: 'Samoreševanje ima tri stopnje: okrevanje (plavanje do deske in veslanje), ponovno jahanje (vrnitev na desko) in nadaljevanje (nadaljevanje veslanja). Ključna tehnika je uporaba vesla kot stabilizatorja in močne brce z nogami za potisk zgornjega dela telesa na desko.'
  solution: '1. faza: zaplavaj do deske. Drži veslo ali jo prinesi nazaj. 2. faza: postavi veslo pravokotno čez desko. Močno brcni noge, medtem ko vlečeš prsni koš na sredino deske. 3. faza: ko je prsni koš na deski, zamahni z nogami eno za drugo. 4. faza: poklekni, zajemaj sapo, nato postopoma vstaneš.'
  recommendation: Vadite samoreševanje v nadzorovanih pogojih, dokler ne boste zmogli brez razmišljanja. Uporabite Paddle Board Overstock SUP Explorer 11, ki ima dober oprijem na palubi. Rešilni jopič Pro nudi dodatno plavanje, če imate težave.
  faq:
    - q: Kako naj se vrnem na noge, če sem izčrpan?
      a: Ostanite pri deski za plavanje. Uporabite roke, da povlečete prsni koš na desko, tudi če noge ne morejo učinkovito brcati. Pred vstajanjem počivajte v klečečem položaju.
    - q: Kaj pa, če paddle izgubim?
      a: Uporabite roke za veslanje deske do obale. Prosite drugega veslača za pomoč. Takoj zamenjajte izgubljeno veslo.
    - q: Ali se lahko rešujem v valovih?
      a: Da — postavite desko pravokotno na valove. Čas ponovnega zajahanja med valovi. Povodec drži desko blizu.
    - q: Kako naj se spopadem z zapletom na povodcu?
      a: Ostanite mirni, plavajte na hrbtu, počasi odpletajte povodec. Če je povodec ovit okoli plavuti, boste morda morali plavuti odstraniti med bivanjem v vodi.
