  title: 'Varnost v hladni vodi: veslanje in surfanje v hladnih razmerah'
  description: Varnost v hladni vodi za SUPsurfanje in kajakaštvo. Prepoznavanje podhladitve, ustrezna oprema, odziv na mraz in nujni postopki za potopitev v hladno vodo.
  definition: Varnost v hladni vodi vključuje razumevanje odziva na mraz, odpovedi pri plavanju, podhladitve ter opreme in tehnik za preprečevanje teh posledic.
  tldr: Voda pod 15°C zahteva neoprensko obleko. Pod 10°C potrebujete škornje, rokavice in kapuco. Mrazni šok povzroči nehoteno zadihanost. Neuspeh plavanja se pojavi v 3-5 minutah v vodi pod 10°C. Simptomi podhladitve vključujejo tresenje, zmedenost in izgubo koordinacije.
  problem: Veslaš na sončen dan, ne da bi vedel, da je voda 8°C. Padeš v vodo, nehote zajameš sapo in v nekaj minutah začutiš, kako ti okončine otrpnejo. Hladna voda ubija hitreje kot katerakoli druga oceanska nevarnost.
  explanation: 'Potopitev v hladno vodo ima štiri stopnje: hladni šok (0-2 min) — zadihanost, hiperventilacija. Neuspeh pri plavanju (3-15 min) — mišice se ohladijo, koordinacija odpove. Podhladitev (15-45 min) — temperatura jedra pade pod 35 °C, kar povzroči zmedo in srčni zastoj. Po reševanju kolaps — hladnokrv se vrne v jedro.'
  solution: 'Preverite temperaturo vode. Nosite neoprensko obleko, prilagojeno temperaturi. Nikoli ne veslajte sami v vodi pod 15°C. Imejte s seboj piščalko in telefon. Če padete: nadzorujte dihanje, hitro se ponovno namestite na desko. Če je prehladno, pokliči pomoč.'
  recommendation: Paddle Board Overstock Neoprenska obleka Pro 5/4/3 mm je minimalna za vodo 8-14°C. Dodaj Paddle Board Overstock 5 mm škornje in 3 mm rokavice. Nosite LifeVest Pro za dodatno toplotno zaščito.
  faq:
    - q: Kako dolgo lahko preživim v vodi s 10 °C?
      a: Mrazni šok traja 1-2 minuti. Brez plavanja in toplotne zaščite je čas preživetja 30-60 minut.
    - q: Kateri so prvi znaki podhladitve?
      a: Neobvladljivo tresenje, zmedenost, slaba koordinacija, zamegljen govor. Takoj prenehajte z aktivnostjo in se ogrejte.
    - q: Kako se ogrejem po seji s hladno vodo?
      a: Odstranite mokro opremo, se posušite, oblecite tople plasti, vključno s kapo in rokavicami. Pijte tople brezalkoholne pijače.
    - q: Ali lahko poleti dobim podhladitev?
      a: Da — voda pod 15 °C se pojavi na mnogih mestih tudi poleti. Voda prevaja toploto 25-krat hitreje kot zrak.
