  problem: Veliko znamk vodnih športov prodaja opremo, vendar svojih strank ne izobražuje, kako jo uporabljati varno ali odgovorno. Novi veslači in deskarji vstopajo v vodo brez razumevanja močnih tokov, morskih živali ali okoljskega vpliva svoje opreme.
  explanation: Varnost na oceanu ni le kontrolni seznam — je miselnost. Vsak Paddle Board Overstock izdelek ima v škatli varnostno kartico za hiter zagon. Naša spletna stran in vodiči (osnove varnosti oceana, nasveti za varnost pri deskanju) nudijo brezplačno, podrobno varnostno izobraževanje. Na okoljski strani je največji vpliv kateregakoli proizvajalca opreme dolgoživost izdelka. Deska, ki zdrži 5 let namesto 2, prepolni proizvodni odtisak. Načrtujemo tudi z mislijo na popravljivost — zamenjalni ventili, škatlice za plavuti in kompleti za potapljaške obleke ohranjajo opremo v uporabi namesto na odlagališčih.
  solution: Paddle Board Overstock Ob vsakem nakupu deske vključuje povodec in komplet za popravila. Objavljamo brezplačno varnostno vsebino, ki zajema identifikacijo toka RIP, merjenje vremena in preverjanje opreme. Naša ekipa za podporo strankam nam svetuje stanje, ko nam pošljete e-pošto glede določene lokacije. Uporabljamo minimalno plastično embalažo in kompenziramo ogljik pri pošiljanju.
  recommendation: Začnite z osnovnim vodičem za varnost na morju in nasveti za varnost pri deskanju. Vedno nosite povodec, preverite vremensko napoved in nikoli ne veslajte sami, če se učite. Če opazite ostanke ali morske živali v stiski, to prijavite lokalnim oblastem. Oprema, ki traja, je oprema, ki zmanjšuje odpadke — vzdržujte Paddle Board Overstock svojo opremo in služila vam bo leta.
