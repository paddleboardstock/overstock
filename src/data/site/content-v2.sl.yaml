  title: 'Kako izbrati neoprensko obleko: razložitev prileganja, debeline in lastnosti'
  description: Popoln vodnik po nakupu neoprenskih oblek. Kako izbrati pravo debelino glede na temperaturo vode, zagotoviti pravilno prileganje, razumeti vrste šivov in izbrati značilnosti glede na vašo dejavnost.
  definition: 'Neoprenska obleka je neoprensko oblačilo, ki zagotavlja toplotno izolacijo tako, da ujame tanek sloj vode ob kožo. Ključni dejavniki izbire: debelina, prileganje, konstrukcija šiva, vstopni sistem in vrsta neoprena.'
  tldr: 'Prilagodite debelino glede na temperaturo vode: 3/2 mm za 14-20 °C, 4/3 mm za 12-18 °C, 5/4/3 mm za 8-14 °C, 6/5/4 mm za pod 8 °C. Prileganje je najpomembnejši dejavnik. GBS šivi so zlati standard. Zadrga na prsih zmanjša splakovanje. Apnenčasti neopren je bolj prožen kot na osnovi nafte.'
  problem: Spletne tabele velikosti neoprenskih oblek so nezanesljive, priporočila za debelino se razlikujejo glede na znamko, opisi funkcij pa so zmedeni.
  explanation: Debeline debeline neoprenske obleke (3/2, 4/3, 5/4/3) se nanašajo na milimetre trupa/rok in nog. Debelejše obleke so toplejše, a omejujejo gibanje. Ohlapna obleka izplica toplo vodo. Šivi GBS so topli in prožni; šivi z ravnim zaklepom so manj topli. Vstop z zadrgo na prsih je toplejši kot z zadrgo na hrbtu. Apnenčasti neopren je bolj prožen v hladni vodi.
  solution: Izmerite prsi, pas, boke in višino. Primerjajte z velikostnimi tabelami. Izberite debelino glede na najnižjo temperaturo vode. Izberite GBS šive za hladno vodo. Raje zadrgo na prsih pod 15°C. Razmislite o termalni podlogi za dodatno toploto.
  recommendation: Paddle Board Overstock Neoprenska obleka Pro v 3/2 mm (14-20C) ali 5/4/3 mm (8-16C) ponuja GBS šive, prsni zadrgo in apnenčasti neopren po konkurenčni ceni.
  faq:
    - q: Kako tesna naj bo neoprenska obleka?
      a: Tesno, brez zračnih žepov, a ne omejujoče. Prst ne bi smel zlahka drseti po spodnjem delu hrbta.
    - q: Katera je najtoplejša vrsta neoprenske obleke?
      a: Obleka s kapuco velikosti 6/5/4 mm z zatesnjenimi šivi in zadrgo na prsih. Za ekstremno mraz je suha obleka boljša.
    - q: Ali se dražja neoprenska obleka splača?
      a: Višja cena prinese boljši neopren, šive in funkcije. Za redno uporabo v hladni vodi je premija vredna tega.
    - q: Ali lahko nosim neoprensko obleko za dejavnosti, ki niso surfanje?
      a: Da — neoprenske obleke so primerne za SUPkajakaštvo, potapljanje, triatlon in plavanje na odprti vodi.
