  title: 'Vodnik za morske rešilne jopiče: Izberite pravo PFD za vašo vodno dejavnost'
  description: Popoln vodnik za nakup rešilnih jopičev za SUPkajakaštvo RIB , čolnarjenje in jadranje.PFD Vrste (penasti vs napihljivi), smernice za prileganje, zakonske zahteve in značilnosti za vsako dejavnost.
  definition: Rešilni jopič ali osebna plavajoča naprava (PFD) je varnostna oprema, zasnovana tako, da osebo ohranja na vodi na vodi. Vrste segajo od tipa I (na morju) do tipa V (posebna uporaba).
  tldr: 'PFD Izberite po dejavnosti: napihljiv pas za SUPkajakaštvo, penasti jopič za kajakaštvo, tip III pena RIB za in motorne čolne. Ključne lastnosti: USCG ISO ali odobritev, odsevne plošče, reševalna piščalka, D-obroč za vrv, žive barve.'
  problem: Vidite vrste rešilnih jopičev od 20 do 300 dolarjev in nimate pojma, kateri je primeren za vašo dejavnost ali ustreza zakonskim zahtevam.
  explanation: 'Rešilni jopiči so razvrščeni po tipu: tip I (na morju, povzroči, da nosilec omedli z obrazom navzgor), tip II (blizu obale), tip III (plavajoči pripomoček, najpogostejši), tip IV (metanje), tip V (posebna uporaba). Napihljivi jopiči uporabljajo CO2 kartuše — manj okorni, a zahtevajo vzdrževanje. Penasti jopiči so brez vzdrževanja, a bolj okorni.'
  solution: 'SUPZa : izberite napihljiv pas ali telovnik (vzgon 33 lb). Za kajakanje: pena tipa III z visokimi izrezi za roke. ZaRIB: pena tipa III ali napihljiva z+ vzgonom 22 lb, odsevnim trakom in reševalno piščalko.'
  recommendation: Life Paddle Board Overstock Vest Pro (napihljiv, 33 lb) je idealen za SUP kajakaštvo. Life Paddle Board Overstock Vest Classic (pena, tip III) je popoln za RIB čolnarjenje in splošno pomorsko uporabo.
  faq:
    - q: Ali potrebujem rešilni jopič zaSUP?
      a: Da — zakonsko obvezno v mnogih jurisdikcijah in vedno priporočljivo. Nosite napihljiv pas ali telovnik za veslaške športe.
    - q: Ali so napihljivi rešilni jopiči varni?
      a: Da, ob ustreznem vzdrževanju. CO2 kartušo preverjaj letno, tuljavo zamenjaj vsakih 2-3 leta.
    - q: Kateri rešilni jopič je najboljši za otroka?
      a: Tip USCGII ali III penasti telovnik z ovratnikom, pasom za mednožje in živahnimi barvami. Nikoli ne uporabljajte napihljivih jopičev za otroke.
    - q: Kako naj se prilega rešilni jopič?
      a: Tesno — telovnik se ne sme dvigniti nad ušesa, ko ga dvignemo za ramena. Vse zadrge in zaponke so zapete.
