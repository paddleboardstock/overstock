  title: 'SUP Vodnik za sidro: Ostanite na mestu med ribolovom ali fotografiranjem'
  description: Popoln vodič po SUP sidranju — vrste sidrišč (gobe, zložljive, kolčke), nastavitev sidrnega vozička, tehnike postavljanja in varnostne premisleke za ohranjanje položaja.
  definition: SUP Sidro je utež, pritrjena na vrv, ki drži desko v položaju proti vetru in toku. Pogoste vrste vključujejo sidra v obliki gob, zložljiva sidra in palice za opazovanje.
  tldr: Uporabite sidro iz gob (1,5-3 lb) za blatno ali peščeno dno, zložljivo sidro za skalnata dna ali palico za opazovanje za plitvo vodo z mehkim dnom. Sidrišče naj tehta 1,5-3 lb za mirne razmere, 3-5 lb za veter in tok. Vedno uporabite sidrni voziček za prilagajanje položaja in vednost, kdaj spustiti vodo.
  problem: Najdeš popolno mesto za ribolov, a veter in tok te vsakih nekaj minut odmakneta od položaja. Brez sidrišča SUP sta ribolov in fotografiranje frustrirajoča vaja stalnega premikanja.
  explanation: Sidro deluje tako, da vleče po dnu, dokler se ne zatakne. Sidra gob se zakopljejo v mehka dna in zagotavljajo dobro oprijem v pesku in blatu. Zložljiva sidra imajo metuljke, ki se zarežejo v trda ali skalnata dna. Opazovalni drogovi delujejo v plitvi vodi, saj neposredno pritiskajo na dno.
  solution: Namestite sidrni voziček (vrv z drsnim obročem na eni strani deske) za nastavitev točke pritrditve sidra. Na sidro pritrdite 50-75' vrvi. Namestite proti vetru ali navzgor od želenega položaja. V nujnih primerih uporabite hitro sprostitveni sistem za odklop. Nikoli ne sidrite v močnem toku ali tam, kjer sidra ni mogoče enostavno izvleči.
  recommendation: Zložljivo sidro težke 3 lb z 50' vrvi deluje za večino SUP ribolovnih pogojev. Dodajte sistem sidrnega vozička z uporabo D-obročev na Paddle Board Overstock SUP vašem Explorer 11.
  faq:
    - q: Kakšno velikost sidra potrebujemSUP?
      a: 1,5-3 lb za mirna jezera in počasne reke. 3-5 lb za obalna območja z vetrom ali tokom. Prevelika sidra je težko dvigniti.
    - q: Koliko sidrne vrvi potrebujem?
      a: Merilnik 5:1 (5 čevljev vrvice za vsak 1 čevelj globine) je standarden. V 10' vode uporabite 50' vrvice.
    - q: Ali je sidranje nevarno naSUP?
      a: Samo če se pritrdite v tok ali veter, ki je dovolj močan, da prevrne desko. Vedno uporabljajte sistem za hitro sprostitev, ki ga je mogoče takoj odstraniti.
    - q: Ali lahko zasidram v katerikoli vodi?
      a: Preverite lokalne predpise. Nekatera območja omejujejo sidranje, da zaščitijo morsko travo ali morska življenjska okolja. Nikoli ne sidrite na koralnih grebenih.
