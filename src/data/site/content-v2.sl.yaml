  title: Vodič za velikost deske za surfanje (volumen je tisto, kar dejansko šteje)
  description: Nehajte ugibati velikosti desk za surfanje. Prostornina v litrih določa vse — kako zlahka lovite valove, kako stabilni se počutite in kako hitro napredujete. Ciljne litre poiščite v 2 minutah.
  definition: Velikost deske za surfanje je predvsem odvisna od volumna (litrov), ne od dolžine. Volumen določa sposobnost plavanja in lovljenja valov. Daljše deske veslajo hitreje; širše deske so bolj stabilne; debelejše deske nudijo več volumna brez dodatne dolžine.
  tldr: 'Velikost deske za surfanje je odvisna od volumna, ne le od dolžine. Začetniki potrebujejo 60-80 litrov, srednji 35-55 litrov, napredni deskarji pa 20-35 litrov. Kot glavni dejavnik uporabite svojo težo: na začetniško raven potrebujete približno 10-12 litrov prostornine.'
  problem: Ko stojiš pred stojalom desk, na katerih so natisnjene številke kot so 7'2" x 22" x 3" na ograji, nimaš pojma, kakšne so te mere v vodi. Nakup na podlagi videza ali vožnje prijatelja vodi do deske, ki je bodisi preveč nestabilna ali pretežka za veslanje.
  explanation: 'Velikost deske za surfanje je najbolje razumljiva skozi tri dimenzije: dolžino (moč vesla in ujemanje valov), širino (stabilnost) in debelino (volumen in plavajoča površina). Prava pomembna številka je volumen v litrih. Penaste deske in napihljive deske dosežejo velik volumen zaradi širine in debeline, ne pa prevelike dolžine, kar jih naredi obvladljive za začetnike. Ko napredujete, zmanjšate volumen, da deska lahko potone globlje v obraz vala in se bolj odzivno obrne.'
  solution: 'Uporabite kalkulator za volumen in težo: za začetnike razdelite težo v kg z 1,5, da dobite ciljne litre. Za srednje zahtevno stopnjo delite z 2. Vmesni naj iščejo deske z zmernim rockerjem in squash ali okroglo repno desko za vsestranskost.'
  recommendation: Paddle Board Overstock Surfboard Pro ponuja 75 litrov volumna v 10'6" paketu — idealno za začetnike do 90 kg. Lažji kolesarji lahko izberejo manjšo velikost na SUP Tour 12 za bolj manevrski občutek med napredovanjem.
  faq:
    - q: Ali je višina pomembna za velikost deske za surfanje?
      a: Višina je manj pomembna kot teža. Visok, lahek deskar potrebuje manj volumna kot nizek, težak deskar iste višine. Uporabite težo kot glavno merilo in prilagodite glede na telesno pripravljenost in moč vesla.
    - q: Kaj se zgodi, če ima moja plošča preveč glasnosti?
      a: Prevelik volumen povzroči, da se deska na valovni površini zdi nestabilna in nestabilna. Težko boš potopil tirnico v ovinkih in se lahko odbiješ od vode med spodnjimi zavoji.
    - q: Kaj se zgodi, če ima moja plošča premalo volumna?
      a: Težko boste veslali v valove, se boste pregloboko potopili ob vzletu in se počutili nestabilne, če boste samo sedeli na deski in čakali. Začetniki skoraj vedno potrebujejo več volumna, kot si mislijo.
    - q: Kako naj vem, kdaj naj vzamem manjšo velikost?
      a: Ko lahko dosledno lovite valove, gladko skačete in naredite osnovne zavoje na trenutni deski, je čas, da zmanjšate 5-10 litrov. Prezgodnja manjša velikost upočasni vaš napredek.
