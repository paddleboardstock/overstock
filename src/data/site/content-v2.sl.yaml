  title: 'Vodnik za nakup rešilnih jopičev: Razložitev vrst, prileganja in lastnosti'
  description: Popoln vodič za nakup rešilnih jopičev za vodne športe.PFD Vrste (I do V), napihovanje proti peni, testiranje prileganja in posebna priporočila za SUPkajakaštvo, čolnarjenje in ribolov.
  definition: Rešilni jopič ali PFD je plavalna naprava, zasnovana tako, da človeku drži glavo nad vodo. Vrste ureja ameriška obalna straža glede na plovnost in namen uporabe.
  tldr: 'Pet PFD vrst: Tip I (na morju, 22+ lb), Tip II (blizu obale), Tip III (pripomoček za plavanje, najpogostejši), Tip IV (metanje), Tip V (posebna uporaba). Napihljivi jopiči nudijo udobje, vendar zahtevajo vzdrževanje CO2 kartuše. Penasti jopiči so brez vzdrževanja, a bolj okorni.'
  problem: Rešilni jopiči so razvrščeni po vrstah in vzgonih, vendar trgovine ne pojasnjujejo vedno, katera vrsta ustreza vaši dejavnosti.
  explanation: Tip I zagotavlja največjo plovnost in onesposobi nezavestnega nosilca z obrazom navzgor. Tip II ne sme obrniti vseh nosilcev na obraz navzgor. Tip III omogoča svobodo gibanja pri aktivnih športih. Tip V vključuje napihljive pasove za SUP. Napihljivi PFD-ji nudijo vzgon med 33 in 37 lb in so kompaktni, ko so izpraznjeni.
  solution: 'ZaSUP: Napihljiv pas tipa V. Za kajakaško: pena tipa III z visokimi izrezi za roke. Za RIB čolnarjenje: pena tipa III ali napihljiva z+ vzgonom 22 lb. Za otroke: pena tipa II ali III z pasom za mednožje.'
  recommendation: Paddle Board Overstock Rešilni jopič Pro (napihljiv tip V, 33 lb) za SUP kajak in kajak.Paddle Board Overstock Rešilni jopič Classic (penasti tip III, 16,5 lb) za RIB plovbo in splošno pomorsko uporabo.
  faq:
    - q: PFD Katero vrsto potrebujemSUP?
      a: Veliko jurisdikcij sprejema tip III ali tip V za SUP. Napihljivi pasovi so priljubljeni. Preverite lokalne zakone.
    - q: Ali napihljivi PFD potrebujejo vzdrževanje?
      a: Da — vsako leto preverite CO2 kartušo, zamenjajte tuljavo vsakih 2-3 leta, po uporabi s slano vodo sperite.
    - q: Ali lahko nosim peno PFD zaSUP?
      a: Da, ampak izberite tistega z visokimi izrezi za roke. Penasti jopiči so bolj robustni, a ne zahtevajo vzdrževanja.
    - q: Kaj PFD je najboljše za otroka?
      a: USCG-odobren penasti jopič tipa II ali III z ovratnikom, pasom za mednožje in živahnimi barvami. Nikoli ne uporabljajte napihljivih PFD-jev za otroke.
