  title: 'SUP Vodič za povodec: Razlaga ravnih in zvitih povodcev'
  description: Popoln vodič po SUP povodcih — ravno proti zvitem, gleženj proti mečnemu položaju, možnosti hitrega sprostitve in kako izbrati pravi povodec za vaše veslanjske pogoje.
  definition: SUP Povodec je vrvica, ki veslača pritrdi na desko in prepreči ločevanje. Vrste vključujejo ravne povodce (za deskanje in reke) ter zvite povodce (za mirno vodo).
  tldr: Zviti povodci so najboljši za mirno vodo in fitnes veslanje — ostanejo izven deske in iz vode. Ravni povodci so namenjeni SUP deskanju in rekam — nudijo več svobode in se ne zataknejo. Za udobje je bolje pritrditi meč kot gleženj. Hitro sproščajoče povodce so pomembne za veslanje po reki, da preprečijo ujetje.
  problem: Kupil si povodec SUP , a nisi prepričan, ali je pravi za tvoj način veslanja. Napačen povodec se bo vlekel, zataknil ali odpovedal, ko ga najbolj potrebuješ.
  explanation: Ravne vrvice so preproste najlonske ali poliuretanske vrvi, ki se vlečejo za desko. Dobro delujejo v valovih, ker se ne zataknejo za plavuti. Zvite povodce so spiralne vrvi, ki se skrčijo, ko niso pod napetostjo — ostanejo zvite na palubi med veslanjem in se raztegnejo, ko padete. V ravnih pogojih držijo povodec izven vode, kar zmanjšuje upor.
  solution: Izberite zvito povodec za mirno vodo, fitnes in turneSUP. Zmanjšan upor pomaga ohranjati hitrost in preprečuje, da bi se povodec zataknil na podvodne predmete. Za SUP deskanje in veslanje po reki izberite ravno povodec. Raven dizajn se manj verjetno zatakne na plavuti ali ovire.
  recommendation: Paddle Board Overstock SUP Paketi vključujejo ustrezno vrsto povodca za namen deske. Zviti povodec v SUP embalaži Explorer 11 je odličen za vsestransko veslanje.
  faq:
    - q: Ali naj se povodec pritrdi na gleženj ali meča?
      a: Pritrditev za meča je zaželena SUP zaradi tega, da povodec ostane izven vode med veslanjem in zmanjša nevarnost spotikanja med hojo.
    - q: Kako dolg naj bo SUP povodec?
      a: 8-10' za mirno vodo, 6-8' za valove. Krajše povodce zmanjšujejo upor, a omejujejo svobodo gibanja deske.
    - q: Ali potrebujem povodec s hitro sprostitvijo za reke?
      a: Da — reka SUP zahteva hitro sproščajočo povodec ali pas, ki ga je mogoče takoj odklopiti, da prepreči ujemanje v cedilih.
    - q: Ali lahko uporabim surf povodec zaSUP?
      a: Surf povodci so krajši in tanjši. Primerni so za SUP deskanje, vendar niso idealni za veslanje na mirni vodi, kjer je daljši zviti povodec boljši.
