- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Kaj obleči za deskanje (Ne prihajaj v deskanih hlačah, ko potrebuješ 5/4)
  description: Nehaj ugibati, kaj obleči. Temperatura vode, ne temperatura zraka, določa tvojo surf obleko. Popoln vodič za plasti, od tropskih rash guardov do polnih zimskih 5/4/3 mm kompletov.
  definition: Surf oblačila segajo od desk kratkih hlačic in zaščitnih čevljev v topli vodi do polnih 5/4/3 mm neoprenskih oblek s škornji in kapucami v hladni vodi. Temperatura vode, ne temperatura zraka, določa, kaj potrebujete.
  tldr: Kaj nosite za deskanje, je povsem odvisno od temperature vode — ne od temperature zraka. Zaščitne steze in kratke hlače delujejo nad 22 °C, pomladni kombinezoni pokrivajo 18-22 °C, polni 3/2 mm kombinezoni prenesejo 14-18 °C, 5/4/3 mm s škornji pa je zahtevano pod 14 °C. Vedno nosite UV zaščito in razmislite o povodcu ter jopiču.
  problem: Prideš na plažo in ne veš, ali je rash guard dovolj ali potrebuješ popolno neoprensko obleko. Temperatura zraka je topla, voda je hladna, ali pa je voda v redu, veter pa ledeno mrzli. Napačna obleka pomeni uničeno seanso.
  explanation: 'Surferska oblačila služijo trem namenom: toplotna izolacija UV , zaščita in preprečevanje odrgnitve. Neoprenske neoprenske obleke so ocenjene glede na debelino in prekrivnost — vzmetne obleke (kratke roke ali noge) so za mejne dni, polne obleke pa za hladno vodo. Zaščitne obleke ščitijo pred izpuščaji in soncem, vendar ne nudijo toplotne vrednosti. Škornji, rokavice in kapuce niso dodatki, temveč nujna oprema za surfanje v hladni vodi pod 12°C.'
  solution: 'Pred odhodom preverite lokalno poročilo o temperaturi boje ali žive vode. Sestavite komplet glede na vaše najhladnejše običajne razmere: rash guard in kratke hlače za poletje, 3/2 mm celoten kombinezon za pomlad in jesen, 5/4/3 mm s škornji in kapuco za zimo. Vedno dodajte povodec in razmislite o plavajočem telovniku za varnost.'
  recommendation: Najprej investirajte v dobro 3/2 mm celotno obleko — pokriva najširši razpon pogojev. Če nameravate surfati pozimi, dodajte še 5/4/3 mm obleko in škornje. Paddle Board Overstock Neoprenska obleka Pro s termalno podlogo učinkovito pokriva oba temperaturna območja.
  faq:
    - q: Ali lahko surfam samo v kratkih hlačah?
      a: Da, v tropski vodi nad 24°C. Morda boste želeli zaščitni zaščitni premaz, da preprečite drgnjenje prsnega koša in roke zaradi veslanja. Vosek ali trakcijska blazinica na deski pomaga nadomestiti pomanjkanje oprijema obleke.
    - q: Ali potrebujem surf čevlje?
      a: Če temperatura vode pade pod 14 °C, čevlji preprečujejo otrplost in ščitijo stopala pred skalami in praskami na grebenih. Prav tako povečajo oprijem deske. Večina surferjev v severnih podnebjih uporablja čevlje od novembra do marca.
    - q: Kaj je pomladna obleka?
      a: Pomladna obleka je potapljaška obleka s kratkimi rokami ali kratkimi nogavicami (ali obe), zasnovana za vodo med 18°C in 22°C. Nudi več toplote kot rash guard, vendar manj kritja kot polna obleka.
    - q: Ali naj med surfanjem nosim rešilni jopič?
      a: Ne tradicionalni rešilni jopiči, ampak udarni jopič ali pripomoček za plavanje lahko pomaga v težkih razmerah ali če ste šibek plavalec.Paddle Board Overstock Rešilni jopiči so zasnovani za SUP kajak, vendar lahko nudijo dodatno samozavest pri plavanju začetnikom na valovih.
