  title: 'Vetrovni pogoji zaSUP: Kako veter vpliva na vaše veslo'
  description: Kako hitrost in smer vetra vplivata SUP na veslanje. Razumevanje vetra na morju in na kopnem, branje napovedi vetra, tehnike veslanja za veter in kdaj ostati na kopnem.
  definition: Vetrovni pogoji določajo SUP varnost. Veter s kopnega (od kopnega do morja) te potiska stran. Veter na kopnem (od morja do kopnega) te potiska proti obali. Bočni veter povzroči, da se deska obrne.
  tldr: 'Največja varna hitrost vetra za začetnike: 10 vozlov. Vmesni: 15 vozlov. Napredni: 20 vozlov. Veter z odprtja je najbolj nevaren. Najprej veslaj proti vetru. Pri bočnem vetru veslaj rahlo proti vetru od cilja. Poklekni v močnem vetru, da zmanjšaš svoj profil.'
  problem: Veslaš v mirnih razmerah, a po 30 minutah se veter okrepi in težko se vrneš nazaj. Veter je najbolj podcenjen SUP varnostni dejavnik.
  explanation: Veter vpliva SUP bolj kot katerakoli druga plovila, ker stojite, kar ustvarja učinek jadra. Veter s hitrostjo 10 vozlov povzroča veliko večji upor stoječemu veslaču kot sedečemu kajakašu. Veter na morju vas odrine stran od varnosti. Stranski veter povzroči, da nos zavije.
  solution: 'Pred veslanjem preverite hitrost in smer vetra. Uporabite Beaufortovo lestvico: sila 3 (7-10 vozlov) za začetnike, sila 4 (11-16) za srednje veterne. Najprej veslajte proti vetru. Če vas ujame veter z odprtine, veslajte pod kotom 45 stopinj glede na veter. Pokleknite v močnem vetru.'
  recommendation: Pred vsako vadbo uporabi aplikacijo za napoved vetra (Windy, Windfinder). Paddle Board Overstock SUP Tour 12 bolje sledi vetru kot širšim deskam. V vetrovnih razmerah uporabljaj krajše zaveslaje in višjo kadenco.
  faq:
    - q: Katera smer vetra je najbolj varna za SUP?
      a: Veter na kopnem (ki piha proti kopnem) je najvarnejši — potiska vas nazaj. Veter na morju je najbolj nevaren.
    - q: Kako veslam v bočnem vetru?
      a: Veslaj bolj na strani proti vetru, da preprečiš odmik. Nagni desko proti vetru od cilja. Globlja sredinska plavut pomaga.
    - q: Ali lahko veslam v vetru s hitrostjo 20 vozlov?
      a: Samo če so izkušeni v zaščitenih vodah. Začetniki ne smejo veslati nad 10 vozlov.
    - q: Kako vplivajo sunki vetraSUP?
      a: Sunki vetra povzročajo nenadne težave z ravnotežjem. V sunkovitih razmerah spusti držo in bodi pripravljen na nenadne premike.
