- slug: sup-navigation-guide
  category: guide
  type: safety
  title: 'SUP Navigacija: Ostati na poti in najti pot'
  description: Osnovne navigacijske veščine za SUP veslače — branje kart, uporaba orientacijskih točk, razumevanje sistemov plovcev ter uporaba GPS-a in kompasa za varno veslanje.
  definition: SUP Navigacija vključuje uporabo orientacijskih točk, zemljevidov, GPS-a ter zavedanja vetra in tokov za varno potovanje in vrnitev na izhodišče.
  tldr: Vedno izberite orientirno točko na obzorju, ko veslate naravnost. Vsakih nekaj minut jo preverite, da popravite odmik. Uporabljajte GPS aplikacije na telefonu v vodoodpornem ovitku. Naučite se osnov navigacije s kompasom. Razumite sisteme bočnih plovcev (rdeče-desno-vračanje). Predložite načrt plovca nekomu na obali.
  problem: Veslate po odprtem morju in ko se obrnete, je obala povsem drugačna. Brez navigacijskih veščin se lahko zmedete in veslate v napačno smer.
  explanation: Navigacija SUP temelji na vizualnih referencah, ker si blizu vode. Izberi prepoznavno znamenitost (stavbo, drevo, pečino) za izhodiščem. Uporabi jo kot povratno smer za povratek. Veter in tok te bosta potiskala s poti — stalno popravljaj. Za daljše poti uporabi GPS aplikacijo ali uro. Razumi, da obala izgleda drugače kot na kopnem.
  solution: 'Pred izstrelitvijo: identificirajte 2-3 orientirne točke na različnih razdaljah za izstrelitveno točko. Uporabite GPS aplikacijo (Google Maps, Gaia GPS) v letalskem načinu za varčevanje z baterijo. Poznajte smer vetra in plime — najprej veslajte proti vetru/navzgor. Za prečkanje odprte vode uporabite kompasni smer.'
  recommendation: Telefon imejte v vodoodpornem ovitku za GPS varnost. Preden se odpravite na nove lokacije, vadite orientacijo v znanih vodah. Rešilni jopič Pro ima žep, primeren za telefon.
  faq:
    - q: Kateri orientirni točki so najboljši za SUP navigacijo?
      a: Značilne, trajne značilnosti, kot so vodni stolpi, visoke stavbe, edinstvena drevesa ali izrazite pečine. Izogibajte se čolnom ali zastavam, ki se premikajo.
    - q: Kako se orientiram v megli?
      a: Ne veslajte v megli. Če ste ujeti v megli, uporabite GPS ali kompas za navigacijo. Vsakih 30 sekund zažvižgajte. Ostanite blizu obale.
    - q: Ali potrebujem morsko karto zaSUP?
      a: Za obalno veslanje preprosta karta pomaga prepoznati nevarnosti, globine in navigacijske poti. Številne aplikacije ponujajo te informacije.
    - q: Kako naj krmarim okoli čolnov?
      a: Ostanite v plitvi vodi, stran od kanalov. Nosite žive barve. Hitro prečkajte kanale pod kotom 90 stopinj. Vzpostavite očesni stik z upravljavci čolnov.
