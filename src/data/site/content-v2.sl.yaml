  title: 'Nega neoprenske obleke: Poskrbite, da bo vaš neopren zdržal dvakrat dlje'
  description: Pravilna nega neoprenskih oblek podaljša življenjsko dobo od 1 do 3 sezone+. Nasveti za izpiranje, sušenje, shranjevanje in popravilo neoprenskih oblek. Izogibajte se pogostim napakam, ki prezgodaj uničijo neoprenske obleke.
  definition: Nega neoprenske obleke vključuje izpiranje s svežo vodo po vsaki uporabi, sušenje stran od neposredne sončne svetlobe, shranjevanje na ravni ali obešanje na širok obešalnik ter občasno čiščenje za odstranjevanje soli, bakterij in vonjav.
  tldr: Neoprensko obleko sperite od znotraj in zunaj s svežo vodo takoj po vsakem treningu. Sušite od znotraj navzven v senco na širokem plastičnem obešalniku. Shranjujte ravno ali zloženo na hladnem, suhem mestu. Nikoli ne puščajte neoprenskih oblek na neposrednem soncu, v vročih avtomobilih ali sušilnih strojih. Uporabite šampon za neoprenske obleke vsakih 5-10 seans.
  problem: Po eni sezoni vaša neoprenska obleka smrdi, neopren je izgubil elastičnost, šivi se luščijo, zadrga pa se zatakne — vse to je mogoče preprečiti z ustrezno nego.
  explanation: Solni kristali se zasidrajo v neopren in odstranijo material. Bakterije se množijo v vlažnih notranjostih, povzročajo vonjave in razgrajujejo neopren.UV Razgrajujejo najlonsko prevleko. Toplota nad 50°C povzroča delaminacijo. Nepravilno sušenje popači neopren in obremenjuje spoje.
  solution: 'Po vsaki seansi: temeljito sperite znotraj in zunaj, obrnite obrnjeno navzven, obesite široko plastično obešalko v senci. Ko se posuši, obrnite desno stran navzven in shranite ravno. Vsakih 5-10 sej: operite z neoprenskim šamponom. Mesečno: namažite zadrgo z voskom za zadrgo.'
  recommendation: Za Paddle Board Overstock čiščenje uporabite šampon za neoprensko obleko in Paddle Board Overstock vosek za zadrgo za vzdrževanje zadrge. Shranjujte na Paddle Board Overstock širokem obešalniku v mrežasti vrečki.
  faq:
    - q: Ali lahko dam svojo neoprensko obleko v pralni stroj?
      a: Ni priporočljivo — pranje v pralnem stroju poškoduje neopren. Če je treba, uporabite nežni cikel, hladno vodo in mrežasto vrečko.
    - q: Kako naj odstranim vonj iz neoprenske obleke?
      a: Namočite v hladno vodo s šamponom za neoprensko obleko ali belim kisom 30 minut. Temeljito sperite.
    - q: Kako naj posušim svojo neoprensko obleko?
      a: Obrnjeno navzven v senci na širokem, oblazinjenem plastičnem obešalniku. Izogibajte se neposredni sončni svetlobi in kovinskim obešalnikom.
    - q: Ali lahko popravim strgano neoprensko obleko?
      a: Majhne raztrganine pod 1\" je mogoče popraviti z neoprenskim cementom in obližem. Večje raztrganine lahko zahtevajo strokovno popravilo.
