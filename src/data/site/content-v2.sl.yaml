  title: 'SUP Hidracija in zaščita pred soncem: Ostanite varni na vodi'
  description: Ključne strategije hidracije in zaščite pred soncem za SUP veslače. Dehidracija in sončne opekline sta SUP najpogostejši težavi — kako preprečiti oboje med dolgimi vožnjami.
  definition: SUP Hidracija pomeni ohranjanje ravnovesja tekočine med veslanjem z rednim vnosom vode. Zaščita pred soncem vključuje uporabo zaščitnega faktorja, zaščitna oblačila in časovno usklajevanje treningov, da se izognete vrhuncuUV.
  tldr: Pijte 500 ml vode na uro veslanja. Prinesite več, kot mislite, da potrebujete — 2L mehur ali več steklenic. Pred+ veslanjem nanesite vodoodporno kremo za sončenje SPF 50 in jo nanesite vsakih 2 uri. Nosite kapo, sončna očala s trakom in oblačila z UPF oceno. Izogibajte se veslanju med 11. in 15. uro, ko UV je najmočnejše.
  problem: Imaš SUP odlično seanso, a po eni uri te boli glava, suha usta in koža ti peče. Dehidracija in opekline od sonca te prikradeta, ker te voda hladi.
  explanation: Odboj od vode poveča UV izpostavljenost do 40 %. Hladilni učinek vode in vetra prikrije sončne opekline, dokler ni prepozno. Potenje pri veslanju poveča izgubo tekočine, pogosto pa ni možnosti za ponovno polnjenje vode v vodi. Dehidracija poslabša ravnotežje in odločanje ter poveča tveganje za nesreče.
  solution: Na bungee sistem deske pritrdite steklenico z vodo ali vlažilni mehur. Pijte vsakih 15 minut, ne glede na to, ali ste žejni ali ne.+ 30 minut pred začetkom nanesite kremo za sončenje s SPF 50. Nosite klobuk s širokim robom, polarizirana sončna očala s trakom in zaščitni zaščitni filter UPF 50+. Kremo za sončenje ponovno nanesite vsakih 2 uri.
  recommendation: Uporabite vlažilni mehur, pritrjen na sprednje D-obroče vašega Paddle Board Overstock SUPtelesa. Nosite UPF 50 zaščitni zaščitni premaz+ pod vašim . PFDUporabite vodoodporno kremo za sončenje, ki ostane na zaslonu in v znoju in vodi.
  faq:
    - q: Koliko vode naj vzamem s seboj na SUP potovanje?
      a: Minimalno 1 liter na uro. Za 2-urno seanso prinesi 2 litra. Več v vročem vremenu. Najbolje deluje hidracijski mehur.
    - q: Za katero vrsto kreme za sončenje je najboljšaSUP?
      a: Vodoodporni, SPF 50+ širokega spektra. Mineralne kreme za sončenje (cinkov oksid, titanov dioksid) so varne za grebene in zdržijo dlje.
    - q: Ali voda res odsevaUV?
      a: Da — voda odbija do 40 % UV sevanja, kar pomeni, da prihajate UV od zgoraj in spodaj. To znatno poveča tveganje za opekline.
    - q: Ali lahko dobim sončne opekline zaradi rash guarda?
      a: Standardni zaščitni ščitniki nudijo UV minimalno zaščito (približno UPF 10-20). Za+ popolno zaščito iščite oblačila z oceno UPF 50.
