  definition: SUP Velikost je določena z dolžino (hitrost in drsenje), širino (primarna stabilnost), debelino (sekundarna stabilnost in prostornina) ter prostornino v litrih (skupna nosilnost).
  tldr: 'SplošnoSUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Valovi: 8''-10'' x 30"-32" (140-220L). Začetniki potrebujejo širino nad 32" in prostornino, ki presega telesno težo za 60-80L. Vaša teža v kg plus 60L je minimalni cilj za stabilnost.'
  problem: Vsaka SUP znamka navaja deske v čevljih, palčih in litrih, vendar če ne veste, kako se te meritve prenesejo na občutek v resničnem svetu, tvegate, da kupite desko, ki je nagnjena, počasna ali ne podpira vaše teže.
  explanation: 'Dolžina določa, kako hitro deska vesla in kako dobro sledi v ravni liniji. Daljše deske (12''+) med udarci drsijo in držijo linijo. Krajše deske (pod 10'') se zlahka obračajo, vendar zahtevajo pogostejše menjave lopatic. Širina določa osnovno stabilnost — stabilnost v stoječem položaju. 30" deska se začetnikom zdi rahlo napeta; 34" se zdi kot pomol. Debelina določa prostornino — debelejša deska plava višje, a ujame več vetra. Volumen v litrih je najboljši pokazatelj: obremenjena deska (ti plus oprema) bi morala v mirovanju potopiti 2-4 palce.'
  solution: 'Prilagodite dimenzije deske trem dejavnikom: vaši teži (določa minimalni volumen), vaši glavni aktivnosti (določa dolžino) in ravni spretnosti (določa širino). Za začetnike pomnožite težo v kg z 2,2, da dobite najmanj litrov. Za vmesne pomnožite z 1,8. Za napredno pomnožite z 1,4.'
  recommendation: Paddle Board Overstock SUP Explorer 11 z dimenzijami 11' x 33" x 6" in 260L ustreza večini kolesarjev do 100 kg za veslanje. Nadgradnjo na SUP Tour 12 velikosti 12' x 31" za boljšo touring hitrost in drsenje.
  faq:
    - q: SUP Kakšno velikost potrebujem glede na svojo težo?
      a: 'Za kolesarje do 70 kg: 10-11'' x 32" (220-260L). Za 70-90 kg: 11-12'' x 33" (260-300L). Za 90-110 kg: 11-12'' x 34" (300-350L). Za več kot 110 kg: 12'' x 34-36" (350L+).'
    - q: Je daljši SUP hitrejši?
      a: Da. Daljše deske imajo boljše razmerje med dolžino in širino, kar zmanjšuje upor. 14' touring SUP deska je bistveno hitrejša od 11' vsestranske deske pri enakem veslanju.
    - q: SUP Kakšna širina je stabilna za začetnike?
      a: 33-34 palcev je idealna temperatura za začetnike do 90 kg. Pod 32" je potrebna dobra uravnoteženost. Nad 34" je zelo stabilno, a počasneje in težje veslati v vetru.
    - q: Ali lahko za turneje uporabim desko za vse naokoli?
      a: Da, za kratke ture pod 10 km. Za daljše razdalje namenska touring deska bolje sledi in bolj učinkovito pokriva razdaljo.
