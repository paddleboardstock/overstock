- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm proti 5mm neoprenski obleki: Kaj večina začetnikov zmoti v hladni vodi'
  description: Prenehajte zmrzovati sredi treninga ali se pregrevati na plaži. Prava razlika med 3 mm in 5 mm neoprenskimi oblekami — temperaturna tabela, kompromisi med prilagodljivostjo in kaj dejansko deluje za surfanje v hladni vodi.
  definition: Neoprenska obleka je neoprensko oblačilo, ki ujame tanko plast vode na koži, ki jo telesna toplota segreje za izolacijo. Debelina (3 mm, 5 mm) določa temperaturni razpon, ki ga obleka prenese — debelejše pomeni topleje, a manj prožno.
  tldr: Debelina neoprenske obleke neposredno določa toploto in gibčnost. Uporabite 3 mm za vodo nad 16°C in 5 mm za vodo med 8°C in 16°C. Debelejše obleke omejujejo gibanje, a vas grejejo dlje časa — vedno dajte prednost prileganju pred znamko.
  problem: Odpreš spletno trgovino ali vstopiš v surf trgovino in vidiš neoprenske obleke z oznakami 3/2, 4/3, 5/4 in 5 mm polne obleke. Številke ne pomenijo veliko, dokler ne ugotoviš, da napačna debelina pomeni bodisi zmrzovanje sredi seje ali pregrevanje in potenje na plaži.
  explanation: Neoprenske obleke delujejo tako, da ujamejo tanko plast vode med kožo in neoprenom; telo to vodo segreje in tako ustvari izolacijo. Debelejši neopren ujame več vode, a omeji prožnost in plovnost. 3 mm obleka (pogosto 3/2 z tanjšimi rokami) ustreza blagim razmeram, medtem ko 5 mm (5/4/3 ali polnih 5 mm) ustreza hladni vodi. Zadrga na prsih se bolje zatesni kot zadrga na hrbtu in zmanjša splakovanje. Izdelava šiva — zlepljena in slepo šivana (GBS) — je razlika med puščajočo obleko in toplo.
  solution: Debelino prilagodite lokalni temperaturi vode z napako 5 °C. Za zmerno podnebje kupite 3/2 mm. Za hladno vodo kupite 5/4/3 mm. Dodajte škornje, rokavice in kapuco, da podaljšate razpon za dodatnih 5 °C navzdol. Pred nakupom preizkusite obleke ali izberite znamko z radodarno politiko vračil.
  recommendation: Paddle Board Overstock Wetsuit Pro v 5/4/3mm je idealen za večino surferjev v hladni vodi, saj ponuja GBS šive in termalno podlogo. Če surfate v topli vodi nad 20°C, je 3/2mm z zadrgo na prsih boljša izbira.
  faq:
    - q: Za katero temperaturo vode je potrebna 5 mm neoprenska obleka?
      a: Temperature vode med 8°C in 14°C zahtevajo 5 mm obleko. Pod 8 °C potrebujete 6/5/4 mm obleko s kapuco. Med 14°C in 18°C 4/3 mm obleka dobro deluje za večino ljudi.
    - q: Ali lahko pozimi nosim 3 mm neoprensko obleko?
      a: Samo v blagih zimskih podnebjih, kjer voda ostane nad 16°C. Za pravo zimsko surfanje je potrebno 5 mm ali 5/4/3 mm. Škornji, rokavice in kapuca dodajo enako toploto brez potrebe po debelejšem trupu.
    - q: Kako tesna naj bo neoprenska obleka?
      a: Tesno, a ne omejujoče. Ne sme biti zračnih žepov ali ohlapnega neoprena. Če lahko prst potisneš med kožo in obleko na spodnjem delu hrbta, je preveč ohlapna. Če je dihanje težko ali je gibanje močno omejeno, vzemi večjo številko.
    - q: Ali drage neoprenske obleke ogrejejo vas?
      a: Višja cena pogosto pomeni boljši neopren (na osnovi apnenca namesto nafte), boljšo konstrukcijo šivov (GBS namesto samo lepilnih) in boljšo prožnost. Ti dejavniki neposredno vplivajo na toploto in dolgoživost, vendar le, če je prileganje pravilno.
