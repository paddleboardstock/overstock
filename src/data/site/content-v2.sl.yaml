  title: 'Popravilo napihljivih naprav: SUP Popravite predrte luknje, puščanja in težave z ventili'
  description: Vodič za popravilo napihljivih naprav sami SUP . Kako najti počasno puščanje, zakrpati predrtino, zamenjati ventil in popraviti delaminacijo plošče s priloženim kompletom za popravila.
  definition: Popravilo napihljivih naprav SUP vključuje odkrivanje zračnih puščanj s testiranjem z milnico, čiščenje in grobo obdelavo poškodovanega območja, nanašanje PVC lepila in obližev ter strjevanje pod pritiskom.
  tldr: Poiščite puščanja z milnico. Območje okoli preboda očistite in podrsnite s brusnim papirjem. Nanesite PVC lepilo tako na oplato kot na ploščo, počakajte 5 minut, močno pritisnite in utrjejte pod težo 24 ur. Za puščanje ventilov najprej preverite O-obroč. Majhne luknje pod 1/4" so enostavne za samostojno popravilo.
  problem: Če ga napihnete, SUP je do jutra tlak že izgubljen. Brez znanja o popravilu vas čaka draga zamenjava verjetno preproste predrte luknje.
  explanation: 'Večina napihljivih SUPs uporablja drop-stitch jedro z PVC zunanjimi plastmi. Preluknja skozi zunanjo PVC plast povzroči počasno puščanje. Standardno popravilo: očistite, brusite, nanesite PVClepilo združljivo z lepilom, pritisnite krpico pod težo. Puščanja ventilov so pogostejša kot preluknjanja panela — O-obroč se izsuši ali pa umazanija preprečuje tesnjenje.'
  solution: Napihnite ploščo do maksimuma PSI in poslušajte za šumenje. Sistematično pršite milnico, še posebej okoli šivov in ventila. Označite mehurčkaste dele. Izpraznjujte, očistite z alkoholom, brusite z granulacijo 80, nanesite PVC lepilo na krpo in ploščo, počakajte, da postane lepljivo, močno pritisnite, utežite 24 ur.
  recommendation: Uporabite Paddle Board Overstock komplet za popravila Paddle Board Overstock , ki je priložen vsem ploščam. Komplet za popravilo vedno nosite s seboj na potovanja. Za težave z ventili kontaktirajte Paddle Board Overstock podporo. Za večje raztrganine ali ločene šive je priporočljivo strokovno popravilo.
  faq:
    - q: Ali lahko popravim veliko raztrganino na svojem napihljivem SUPračunalniku?
      a: Raztrganine nad 1\" lahko zahtevajo strokovno popravilo ali obliž na obeh straneh. Ločevanje šivov vzdolž tirnice ni mogoče zanesljivo popraviti na terenu.
    - q: Kako dolgo traja popravilo?
      a: Pravilno popravilo s pravilno tehniko traja skozi celotno življenjsko dobo plošče. Slabo oprijemanje zaradi nezadostnega čiščenja vodi v prihodnje okvare.
    - q: Ali lahko popravim puščajoč ventil?
      a: Pogosto da. Odstrani jedro ventila, pregledaj O-obroč, ga očisti ali zamenjaj, nanesi silikonsko mazivo in ga ponovno namesti.
    - q: Kaj če ne najdem puščanja?
      a: Napihnite do polnosti PSI in potopite dele zaporedoma v kad ali bazen. Puščanja, ki so premajhna, da bi jih našli, so lahko povezana s temperaturo.
