- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Vodnik za opremo za surfanje na hladni vodi (Surfajte skozi zimo brez trpljenja)
  description: 'Ne dovolite, da mrzla voda konča vašo sezono. Popoln pregled opreme za hladno vodo: debelina neoprenske obleke, izbira čevljev in rokavic, prileganje kapuce ter dodatki, ki naredijo zimske treninge res prijetne.'
  definition: Surfanje v hladni vodi zahteva popolno neoprensko obleko (5/4/3 mm ali debelejšo), škornje, rokavice in kapuco. Pod 12°C je vsaka točka stika s hladno vodo zaščita, da se prepreči otrplost, podhladitev in varnostna tveganja.
  tldr: Surfanje v hladni vodi zahteva polno 5/4/3 mm ali 6/5/4 mm kapuco neoprensko obleko, 5 mm škornje, 3 mm rokavice in kapuco. Kakovost šivov je pomembnejša od znamke — iščite lepljene in slepo šivane (GBS) šive. Termo podloga obleka doda znatno toploto brez dodatne debeline. Vedno prinesite rezervne termalne plasti in termovko za okrevanje po treningu.
  problem: Želite surfati skozi zimo, a mrzla voda vam po 15 minutah omrtviči noge, roke ne morete prijeti deske, obleka pa vam ob vsakem veslanju splakne ledeno vodo po hrbtu. Brez prave opreme so vadbe v hladni vodi kratke in mučne.
  explanation: 'Surfanje v hladni vodi (pod 12°C) zahteva več kot le debelo neoprensko obleko. Vsaka točka stika s mrazom potrebuje zaščito: škornji preprečujejo otrplost stopal in ščitijo pred urezninami na grebenu, rokavice ohranjajo funkcijo rok za veslanje, kapuca pa preprečuje najhujšo izgubo toplote (vaša glava oddaja 30 odstotkov telesne toplote). Debelino neoprenske obleke je treba prilagoditi najhladnejšemu mesecu, ne povprečju. Poleg obleke dodatki, kot so čevlji s tesno zaprtimi podplati in rokavice s predhodno ukrivljenimi prsti, izboljšujejo udobje in vzdržljivost.'
  solution: 'Sestavite komplet za hladno vodo v tem vrstnem redu: 5/4/3 mm ali 6/5/4 mm celoten kostim z GBS šivi in zadrgo na prsih, 5 mm škornji z gumijastimi podplati, 3 mm rokavice (rokavice so toplejše kot prsti) in 3 mm kapuco, ki se zatakne pod ovratnik obleke. Dodajte oblačilo za previjanje za dostojanstvo in toploto na parkirišču.'
  recommendation: Paddle Board Overstock Neoprenska obleka Pro v velikosti 5/4/3 mm z integrirano termalno podlogo obvladuje večino hladnih vodnih razmer do 8°C. Kombinirajte jo z Paddle Board Overstock 5 mm škornji in 3 mm rokavicami za popolno hladno vodo. Pod 8 °C preidite na 6/5/4 mm obleko s kapuco.
  faq:
    - q: Ali res potrebujem kapuco?
      a: Da. Izgubiš 30 odstotkov telesne toplote skozi glavo. Kapuca preprečuje rdečenje in ohranja vrat topel. 3 mm kapuca doda več toplote kot nadgradnja debeline trupa s 5 mm na 6 mm.
    - q: Kakšne debeline čevljev potrebujem?
      a: Za vodo pri 8-12 °C uporabite 5 mm škornje. Za 12-16 °C zadostujejo 3 mm škornji. Pod 8 °C razmislite o 7 mm škornjih ali dodajanju neopren nogavic pod 5 mm škornje.
    - q: Kako preprečim, da bi se moja neoprenska obleka splaknila?
      a: Splakovanje nastane, ko voda vstopi v obleko pri vratu, zapestjih ali gležnjih. Zasnova z zadrgo na prsih znatno zmanjša rdečenje hrbta. Velcro tesnila na vratu in gležnjih prav tako pomagajo, a najboljša rešitev je dobro prilegajoča obleka z GBS šivi.
    - q: Ali lahko uporabim 3 mm obleko v hladni vodi z dodatnimi plastmi?
      a: 3 mm obleka z neoprenskim telovnikom spodaj lahko podaljša vaš razpon za približno 3-4 °C, vendar ni nadomestilo za pravo obleko 5/4/3 mm ali 5 mm. Plastenje je najboljše za krajše seanse v mejnih razmerah.
