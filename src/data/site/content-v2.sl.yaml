  category: guide
  type: safety
  title: 'Načrtovanje vremena za vodne športe: berite vremensko napoved kot profesionalec'
  description: Kako brati morske vremenske napovedi za SUPsurfanje in čolnarjenje. Razumevanje front, tlačnih sistemov, vzorcev vetra in vremenskih opozoril za načrtovanje varnih sej.
  definition: Načrtovanje vremena pomeni interpretacijo morskih napovedi — hitrost in smer vetra, višino in obdobje valov, padavine, vidljivost in opozorila pred hudim vremenom.
  tldr: 'Pred vsako sejo preverite tri napovedi: veter, valove in vremenske razmere. Najboljši pogoji: rahel veter na morju, zmerni valovi, visok ali naraščajoči tlak. Izogibajte se: nevihtam, močnemu morskemu vetru, megli in hitro padajočemu tlaku.'
  problem: Do obale se peljete na podlagi tridnevne vremenske napovedi, ki je obljubljala dobre razmere, a naletite na veter s hitrostjo 25 vozlov in dež. Morsko vreme je težko napovedati.
  explanation: Visok tlak prinaša stabilno vreme in rahel veter. Nizki tlak prinaša veter in nevihte. Gradient tlaka določa hitrost vetra. Hladne fronte prinašajo nenadne spremembe vetra. Lokalni učinki, kot so morski vetriči, lahko preglasijo splošno napoved.
  solution: 'Uporabite več virov: Windy.com, NOAA, lokalne surf kamere. Preverite 24 ur vnaprej in ponovno preverite zjutraj. Poiščite dosledne napovedi med različnimi modeli. Spoznajte lokalne mikroklime.'
  recommendation: Shranite Windy.com za lokalne lokacije. Telefon imejte s seboj v vodoodpornem ovitku. Za plovbo imejte VHF radio za vremenske prenose. Če ste v dvomih, ostanite na obali.
  faq:
    - q: Kakšnega vremena naj se izogibamSUP?
      a: Nevihte (strela), megla (ničelna vidljivost), veter na morju nad 10 vozlov, veter nad 20 vozlov, padajoči tlak.
    - q: Kako natančne so morske napovedi?
      a: 3-dnevne napovedi so približno 80 % natančne. Napovedi dan prej so 90 %+ natančne za veter.
    - q: Kakšen je dober barometrični trend za vodne športe?
      a: Naraščajoči ali stabilen tlak kaže na izboljšanje razmer. Padajoči tlak (1+ mb/uro) pomeni, da se bliža nevihta.
    - q: Ali lahko delam SUP v megli?
      a: Ni priporočljivo. Če ste ujeti v megli, uporabite kompas ali GPS, vsakih 30 sekund zažvižgajte in ostanite blizu obale.
