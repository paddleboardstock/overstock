  title: 'SUP Varnostni vodič: Osnovna pravila za vsakega veslača'
  description: Popoln SUP varnostni vodič, ki zajema vremenske preglede, opremo, samoreševanje, pravila navigacije in kaj storiti, če se razmere poslabšajo. Bodite varni na svoji veslaški deski.
  definition: SUP Varnost zajema načrtovanje pred plovbo (vreme, plima, pregled opreme), prakse na vodi (povodec, PFDnavigacija) in nujne postopke (samoreševanje, signalizacija, preprečevanje podhladitve).
  tldr: Vedno nosite povodec in PFD. Preverite napoved vetra — veter z odprtine je nevaren. Najprej veslajte proti vetru, da vam veter pomaga vrniti. Imejte piščalko, telefon v vodoodpornem ovitku in vodo. Naučite se samoreševanja. Nikoli ne bodite SUP sami na oddaljenih območjih.
  problem: SUP zdi se zavajajoče preprosto. Začetniki podcenjujejo, kako hitro lahko veter, tok in utrujenost spremenijo zabavno vadbo v nevarnost.
  explanation: Deska deluje kot jadro v vetru, kar olajša veslanje z vetrom, vračanje proti vetru pa je izjemno težko. Stoječi položaj povečuje tveganje za padec. Utrujenost se kopiči hitreje kot pri kajakaštvu. Povodci preprečujejo ločitev od deske. PFD vas držijo na površju, če ste poškodovani.
  solution: 'Pred izletom: preverite veter (največ 10 vozlov za začetnike), smer (izogibajte se morju) in plimo. Povejte nekomu svojo pot. Na vodi: pokleknite in veslajte proti močnemu vetru. Če ste ločeni, plavajte proti deski. Za samopomoč: postavite veslo čez desko, brcnite noge, potegnite prsni koš na desko, zamahnite z nogami navzgor.'
  recommendation: Uporabite Paddle Board Overstock LifeVest Pro (napihljiv) za SUP. Pritrdite SUP zvito povodec na meča. Vadite samoreševanje v mirnih razmerah, preden ga potrebujete.
  faq:
    - q: Za katero hitrost vetra je varnaSUP?
      a: 'Začetniki: pod 10 vozlov. Vmesni: 10-15 vozlov. Napredni: 15-20 vozlov. Nad 20 vozlov je nevarno za vse nivoje.'
    - q: Ali potrebujem rešilni jopič zaSUP?
      a: Da — zakonsko obvezno v mnogih jurisdikcijah in vedno priporočeno zaradi varnosti.
    - q: Kaj naj naredim, če se ne morem vrniti na obalo?
      a: Ostanite pri deski (to je plavanje). Signalizirajte s piščalko. Če vas piha na obalo, veslajte pod kotom 45 stopinj glede na veter.
    - q: Kako naj vadim SUP samoreševanje?
      a: 'V mirni plitvi vodi: namerno padite dol, zaplavajte do deske, vadite ponavljajoče ponovno jahanje.'
