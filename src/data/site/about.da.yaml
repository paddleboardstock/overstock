origin:
  tagline: 'Vores oprindelse'
  heading: "Bygget på vandet,<br />\n<span class=\"text-sky-600\">drevet af formål</span>"
  paragraphs:
    - 'Aquafarer begyndte i et kystværksted med én båd og en stædig overbevisning: marine produkter bør konstrueres, som om de betyder noget — for det gør de.'
    - 'Vores grundlæggere, to bådkonstruktører, så en branche, hvor der blev sparet på alt, materialer blev nedgraderet, og sikkerhed blev behandlet som et afkrydsningspunkt. De byggede det første Aquafarer-skrog ikke for profit, men for at bevise, at prisvenligt marint udstyr også kan være reelt pålideligt.'
    - 'Det første skrog er stadig i drift i dag. Det princip har aldrig ændret sig.'
    - 'Vi er ikke den største producent. Vi laver ikke de billigste produkter. Men hvert skrog, der forlader vores værksted, går gennem de samme hænder, der startede virksomheden — og lever op til den samme standard, som det første skrog satte.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Aquafarers kystværksted'

philosophy:
  tagline: 'Vores filosofi'
  heading: 'Forankret i havet'
  description: 'Havet er ikke vores arbejdsplads. Det er vores lærer. Hver designbeslutning begynder med at forstå, hvordan vandet opfører sig, hvordan betingelserne ændrer sig, og hvordan udstyret skal reagere.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respekt for vandet'
      description: 'Vand er uforudsigeligt. Vores produkter er konstrueret til de værste forhold, ikke de bedste. Hvis et skrog kan håndtere en kraftig modstrøm, kan det også håndtere en sø. Hvis en redningsvest virker offshore, er den overdimensioneret til en flod — og det er bevidst.'
    - emoji: "\U0001F527"
      title: 'Bygget til at holde, ikke til at udskiftes'
      description: 'Det mest bæredygtige produkt er det, der ikke behøver udskiftning. Marin PVC, Hypalon og drop-stitch-konstruktion er valgt for lang levetid. Vi sender stadig reservedele til skrog, vi byggede for et årti siden.'
    - emoji: "\U0001F3C6"
      title: 'Tilgængeligt gennem design'
      description: 'Vandsport bør ikke være en luksus. Vi konstruerer produkter, der leverer professionel ydeevne til en pris, der giver mening for familier, guider og små operatører — ikke kun kommercielle flåder.'

design:
  tagline: 'Designfilosofi'
  heading: "Konstrueret til grænsen<br />\n<span class=\"text-sky-600\">af forhold</span>"
  paragraphs:
    - 'Hvert Aquafarer-produkt begynder med ét spørgsmål: <em>hvad er den værste tilstand, det vil møde?</em> Vi designer fra kanten og indad, ikke fra midten og udad.'
    - 'Vores drop-stitch-kerner er godkendt til 15 PSI — ikke fordi 12 PSI er utilstrækkeligt til en sø, men fordi et 15 PSI-board håndterer pludselig søgang uden at bøje. Vores Hypalon-rør er specificeret til kommerciel UV-bestandighed — ikke fordi hver kunde padler i troperne, men fordi UV-nedbrydning er årsag nr. 1 til for tidlige fejl.'
    - 'Vi designer ikke efter en pris. Vi designer til et brudpunkt — og bygger derefter godt over det.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Aquafarers design og ingeniørarbejde'
  stats:
    - value: '15'
      label: 'Kernens<br />PSI-rating'
    - value: '1,500+'
      label: 'UV-timer<br />testet'
    - value: '10 år'
      label: 'skrog<br />levetid'
