cases:
  - id: beginner
    title: 初心者のパドリング
    desc: 初心者パドラー向けの安定した膨張式SUPボード。
    scenario: 週末に湖を訪れている家族がパドルボードに挑戦したいと考えています。彼らは、明確な安全ガイダンスを備えた、安定した簡単に起動できる機器を必要としています。
    solution: SUP Explorer 11は初心者向けのワイドボディの安定性を提供します。Life Vest ClassicはCE認定の浮力を保証します。Oars & Pump Setはボードを10分以内で膨らませます。
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: ツーリング＆探検
    desc: 湖、川、沿岸の旅行用の長距離用の膨張式SUPボード。
    scenario: アウトドア愛好者は、1週間のパドリング旅行を計画しており、小さく収納でき、キャンプで膨らませることができ、開けた水面でまっすぐ進むボードが必要です。
    solution: Ocean Voyager Seriesはツーリング用の輪郭で効率よく滑り、風や波の中でも進路を維持します。そのdrop-stitch構造は、ハードボードの剛性のために15PSIまで膨らみます。
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP ヨガ＆フィットネス
    desc: ヨガ、フィットネス、リラクゼーションのための、特に幅広で安定したプラットフォーム。
    scenario: ヨガの練習者は、穏やかな水上で朝のセッションを行うための浮かぶスタジオを望んでおり、すべてのポーズを行うのに十分なデッキスペースがあります。
    solution: Flowing Lotus Seriesは、全長のデッキパッドと揺れのないポーズのための広いビームを備えています。また、軽いフィットネスワークアウトのための安定したプラットフォームとしても使用できます。
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: 家族のレクリエーション
    desc: 週末の湖での一日や休日のための完全なSUPパッケージ。
    scenario: 4人家族は、週末の湖へのお出かけやビーチの休日に使える安定したボードを望んでいます──車に積めて数分で膨らませることができるギアです。
    solution: Tropical Breeze Seriesは家族全員で使える安定した万能ボードで、Medusa Glow Seriesは子供用に軽くて短めです。どちらも簡単に旅行できるようにバックパックに収納できます。
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
