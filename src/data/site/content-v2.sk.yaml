  title: 'Bezpečnosť v studenej vode: Pádlovanie a surfovanie v chladných podmienkach'
  description: Bezpečnosť v studenej vode pre SUPsurfovanie a kajakovanie. Rozpoznávanie podchladenia, vhodné vybavenie, reakciu na studený šok a núdzové postupy pre ponorenie do studenej vody.
  definition: Bezpečnosť v studenej vode zahŕňa pochopenie reakcie na studený šok, zlyhanie plávania, podchladenie a vybavenie a techniky na prevenciu týchto následkov.
  tldr: Voda pod 15 °C vyžaduje neoprén. Pod 10 °C vyžaduje topánky, rukavice a kapucňu. Studený šok spôsobuje nevedomé lapanie po dychu. Zlyhanie plávania nastáva do 3-5 minút vo vode pod 10 °C. Príznaky podchladenia zahŕňajú trasenie, zmätok a stratu koordinácie.
  problem: Vypluješ na slnečný deň, netušiac, že voda je 8°C. Spadneš do vody, nevedomky zalapáš po dychu a cítiš, ako ti končatiny do pár minút stŕpnu. Studená voda zabíja rýchlejšie než akékoľvek iné morské nebezpečenstvo.
  explanation: 'Ponorenie do studenej vody má štyri fázy: studený šok (0-2 min) — lapanie po dychu, hyperventilácia. Zlyhanie plávania (3-15 min) — svaly chladnú, koordinácia zlyháva. Podchladenie (15-45 min) — teplota jadra klesá pod 35 °C, čo spôsobuje zmätok a zástavu srdca. Po záchrane kolaps — studená krv sa vracia do jadra.'
  solution: 'Skontrolujte teplotu vody. Noste neoprén určený na danú teplotu. Nikdy nepádlujte sami vo vode pod 15 °C. Majte so sebou píšťalku a telefón. Ak spadnete do vody: kontrolujte dýchanie, rýchlo sa znovu nasadnite na dosku. Ak je príliš zima, dajte signál o pomoc.'
  recommendation: Paddle Board Overstock Wetsuit Pro 5/4/3 mm je minimálna teplota pre vodu 8-14 °C. Pridajte Paddle Board Overstock 5mm topánky a 3 mm rukavice. Noste Life Vest Pro pre extra tepelnú ochranu.
  faq:
    - q: Ako dlho dokážem prežiť vo vode s teplotou 10°C?
      a: Studený šok trvá 1-2 minúty. Bez plávania a tepelnej ochrany je čas prežitia 30-60 minút.
    - q: Aké sú prvé príznaky podchladenia?
      a: Nekontrolovateľné trasenie, zmätok, zlá koordinácia, nezrozumiteľná reč. Okamžite prestaňte s aktivitou a rozcvičte sa.
    - q: Ako sa zohriať po studenej vode?
      a: Odstráňte mokré oblečenie, osušte sa, oblečte si teplé vrstvy vrátane čiapky a rukavíc. Pite teplé nealkoholické nápoje.
    - q: Môžem dostať podchladenie v lete?
      a: Áno — voda pod 15 °C sa vyskytuje na mnohých miestach aj v lete. Voda vedie teplo 25-krát rýchlejšie ako vzduch.
