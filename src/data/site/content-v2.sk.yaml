  title: Návod na veľkosť surfových dosiek (objem je to, na čom skutočne záleží)
  description: Prestaňte hádať veľkosti surfových dosiek. Objem v litroch určuje všetko — ako ľahko chytáte vlny, ako stabilne sa cítite a ako rýchlo postupujete. Nájdite svoj cieľový počet litrov za 2 minúty.
  definition: Veľkosť surfovej dosky je primárne o objeme (litroch), nie o dĺžke. Objem určuje schopnosť plávania a chytania vĺn. Dlhšie dosky pádlujú rýchlejšie; širšie dosky sú stabilnejšie; hrubšie dosky ponúkajú väčší objem bez pridanej dĺžky.
  tldr: 'Veľkosť surfovej dosky je o objeme, nie len o dĺžke. Začiatočníci potrebujú 60-80 litrov, stredne pokročilí 35-55 litrov a pokročilí surfisti 20-35 litrov. Používajte svoju hmotnosť ako hlavný faktor: každých 10 kg potrebuje približne 10-12 litrov objemu na začiatočníckej úrovni.'
  problem: Keď stojíte pred stojanom surfových dosiek s číslami ako 7'2" x 22" x 3" vytlačenými na lište, netušíte, aké sú tie rozmery vo vode. Kúpa podľa vzhľadu alebo toho, čo jazdí kamarát, vedie k doske, ktorá je buď príliš nestabilná, alebo príliš ťažká na pádlovanie.
  explanation: 'Veľkosť surfovej dosky sa najlepšie chápe v troch rozmeroch: dĺžka (sila pádla a zachytenie vlny), šírka (stabilita) a hrúbka (objem a plavák). Skutočné číslo je objem v litroch. Penové dosky a nafukovacie dosky dosahujú vysoký objem vďaka šírke a hrúbke namiesto nadmernej dĺžky, čo ich robí zvládnuteľnými pre začiatočníkov. Ako sa zlepšujete, znižujete objem, aby doska mohla klesnúť hlbšie do čela vlny a otáčať sa citlivejšie.'
  solution: 'Použi kalkulačku objemu k hmotnosti: pre začiatočníkov vydeľ váhu v kg 1,5, aby si dosiahol cieľový objem litrov. Pre stredne pokročilých vydeľ dvoma. Stredne pokročilí by mali hľadať dosky so stredným rockerom a squash alebo round tail pre univerzálnosť.'
  recommendation: Paddle Board Overstock Surfboard Pro ponúka objem 75 litrov v balení s výškou 10'6" — ideálne pre začiatočníkov do 90 kg. Ľahší jazdci si môžu zvoliť menšiu veľkosť na SUP Tour 12 pre obratnejší pocit počas postupu.
  faq:
    - q: Záleží výška na veľkosti surfovej dosky?
      a: Výška je menej dôležitá ako váha. Vysoký, ľahký surfer potrebuje menší objem než nízky, ťažký surfer rovnakej výšky. Použite váhu ako hlavný ukazovateľ a upravte podľa kondície a sily pádla.
    - q: Čo sa stane, ak má moja doska príliš veľa hlasitosti?
      a: Príliš veľký objem spôsobuje, že doska pôsobí na vlnovej ploche ako korková a nestabilná. Počas zákrut budete mať problém zapustiť koľajnicu a pri spodných zákrutách sa môžete odraziť od vody.
    - q: Čo sa stane, ak má moja doska príliš nízku hlasitosť?
      a: Budeš mať problém pádlovať do vĺn, pri odraze sa príliš ponoríš a budeš sa cítiť nestabilne, keď len sedíš na doske. Začiatočníci takmer vždy potrebujú viac objemu, než si myslia.
    - q: Ako zistím, kedy si zobrať menšiu veľkosť?
      a: Keď dokážete pravidelne chytať vlny, hladko vyskakovať a robiť základné zákruty na aktuálnej doske, je čas znížiť objem o 5-10 litrov. Príliš skoré zníženie veľkosti spomaľuje váš postup.
