- slug: inflatable-sup-vs-hard-board
  category: comparison
  type: buying-guide
  title: 'Nafukovacie SUP vs tvrdé dosky: Čo je pre vás to pravé?'
  description: Porovnanie nafukovacích a tvrdých SUP zariadení zahŕňa prenosnosť, výkon, odolnosť, cenu a úložný priestor. Skutočné rozdiely pre rekreačných pádlárov, cestovateľov a používateľov orientovaných na výkon.
  definition: Nafukovací (SUPiSUP) používa drop-stitch PVC konštrukciu nafúknutú na 15-20 stupňovPSI. Tvrdý SUP používa epoxid, sklený alebo uhlíkový materiál na penovom jadre.
  tldr: Nafukovacie SUPs dosky vyhrávajú prenosnosť (batohy do batoho), odolnosť (odráža sa namiesto škrabancov) a úložný priestor (zmestí sa do skrine). Tvrdé dosky vyhrávajú na výkone (pevnejšie, rýchlejšie, lepšie kĺzanie). Vyber si iSUP, ak cestuješ, máš obmedzený úložný priestor alebo si začiatočník. Vyber si tvrdú dosku, ak je tvoj výkon prioritou.
  problem: Debata o nafukovacích vs. tvrdých SUP farbách má silných zástancov na oboch stranách. Bez pochopenia skutočných rozdielov si môžete vybrať dosku, ktorá nevyhovuje vášmu životnému štýlu.
  explanation: Tvrdé dosky sú ľahšie, tuhšie a rýchlejšie. Pevná konštrukcia prenáša energiu pádlovania priamo na pohyb vpred. Na prepravu a opatrné zaobchádzanie však potrebujú strešné nosiče. Nafukovacie dosky sa zmestia do batohov, prežijú leteckú dopravu a odrážajú sa od kameňov. Moderné iSUPy vo výške 18-20 PSI sú pozoruhodne tuhé, ale pri tvrdom pádlovaní sa mierne ohýbajú.
  solution: Vyber si nafukovaciu dosku, ak nemáš úložný priestor, cestuješ s doskou, si začiatočník alebo pádluješ v skalnatých oblastiach. Zvoľ tvrdú dosku, ak pretekáš, cestuješ na dlhé vzdialenosti alebo uprednostňuješ maximálny výkon. Mnohí pádlari vlastnia oboje.
  recommendation: Paddle Board Overstock SUP Explorer 11 je najlepšou voľbou pre väčšinu pádlujúcich — ponúka 90 % výkonu na tvrdej doske s 10-násobným pohodliom. Tvrdú dosku pridajte neskôr, ak sa vaše výkonové potreby zvýšia.
  faq:
    - q: Sú nafukovacie dosky SUPs také rýchle ako tvrdé dosky?
      a: Tvrdé dosky sú o 5-10 % rýchlejšie. Pre rekreačných kajakárov je rozdiel v rýchlosti minimálny. Pre pretekárov sú tvrdé dosky nevyhnutné.
    - q: Používajú nafukovacie SUPs dráhy aj tvrdé dosky?
      a: V porovnaní s kvalitnými plutvami. Širší profil väčšiny iSUPov vytvára mierne väčší odpor, ale moderné konštrukcie to minimalizujú.
    - q: Ktorý je jednoduchší na opravu?
      a: Tvrdé dosky sa dajú opraviť epoxidovými opravárenskými sadami. Nafukovacie dosky vyžadujú PVC opravné sady. Obe sú možné urobiť aj pri menších opravách.
    - q: Ktorý je lepší na surfovanie?
      a: Tvrdé dosky sú lepšie pri pokročilom surfovaní. Pre začiatočníkov až stredne pokročilých surfovaní fungujú nafukovacie dosky dobre a sú bezpečnejšie.
