- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm neoprén: Čo väčšina začiatočníkov robí chybu v studenej vode'
  description: Prestaňte mrznúť počas tréningu alebo sa prehrievať na pláži. Skutočný rozdiel medzi 3mm a 5mm neoprénmi je teplotný graf, kompromisy medzi flexibilitou a čo naozaj funguje pri surfovaní v studenej vode.
  definition: Neoprén je neoprnový odev, ktorý zachytáva tenkú vrstvu vody na koži, ktorú telesné teplo ohrieva na izoláciu. Hrúbka (3 mm, 5 mm) určuje teplotný rozsah, ktorý oblek zvládne — hrubší je teplejší, ale menej pružný.
  tldr: Hrúbka neoprénu priamo určuje teplo a flexibilitu. Použite 3 mm pre vodu nad 16 °C a 5 mm pre vodu medzi 8 °C a 16 °C. Hrubšie obleky obmedzujú pohyb, ale udržiavajú vás dlhšie v teple — vždy uprednostňujte strih pred značkou.
  problem: Otvoríte online obchod alebo vojdete do surfového obchodu a uvidíte neoprény označené 3/2, 4/3, 5/4 a 5mm plné obleky. Čísla veľa neznamenajú, kým si neuvedomíte, že nesprávna hrúbka znamená buď zamrznutie počas tréningu, alebo prehriatie a potenie na pláži.
  explanation: Neoprénové obleky fungujú tak, že medzi pokožkou a neoprnom zachytávajú tenkú vrstvu vody; vaše telo túto vodu ohrieva a vytvára izoláciu. Hrubší neoprén zachytáva viac vody, ale obmedzuje flexibilitu a vztlak. 3mm oblek (často 3/2 s tenšími rukami) vyhovuje miernym podmienkam, zatiaľ čo 5mm (5/4/3 alebo plné 5mm) je vhodný pre studenú vodu. Zips na hrudi tesní lepšie ako zadný zips a znižuje splachovanie. Konštrukcia švu — lepená a slepo šitá (GBS) — je rozdiel medzi netesným oblekom a teplým.
  solution: Prispôsobte hrúbku miestnej teplote vody s chybou 5 °C. Pre mierne podnebie kúpte 3/2 mm. Pre studenú vodu si kúpte 5/4/3 mm. Pridajte čižmy, rukavice a kapucňu, aby ste predĺžili rozsah o ďalších 5 °C nižšie. Pred kúpou si vyskúšajte obleky alebo si vyberte značku s veľkorysou možnosťou vrátenia.
  recommendation: Paddle Board Overstock Wetsuit Pro vo veľkosti 5/4/3mm je ideálny pre väčšinu surferov v studenej vode, ponúka GBS švy a termálnu podšívku. Ak surfujete v teplej vode nad 20°C, 3/2mm so zipsom na hrudi je lepšou voľbou.
  faq:
    - q: Aká teplota vody vyžaduje 5mm neoprén?
      a: Teploty vody medzi 8°C a 14°C si vyžadujú 5mm oblek. Pod 8°C potrebujete 6/5/4mm kapucňový oblek. Medzi 14°C a 18°C vyhovuje 4/3mm oblek väčšine ľudí.
    - q: Môžem nosiť 3mm neoprén v zime?
      a: Len v miernych zimných oblastiach, kde voda zostáva nad 16°C. Pre skutočné zimné surfovanie je potrebné 5 mm alebo 5/4/3 mm. Topánky, rukavice a kapucňa pridávajú ekvivalentné teplo bez potreby hrubšieho trupu.
    - q: Ako tesný by mal byť neoprén?
      a: Tesné, ale nie obmedzujúce. Nemali by tam byť žiadne vzduchové bubliny ani voľný neoprén. Ak dokážete prstom zasunúť medzi kožu a oblek na dolnej časti chrbta, je príliš voľný. Ak je dýchanie ťažké alebo je pohyb výrazne obmedzený, zvoľte väčšiu veľkosť.
    - q: Udržiavajú vás drahé neoprény teplejšie?
      a: Vyššia cena často znamená lepší neoprén (na báze vápenca namiesto ropy), lepšiu konštrukciu spojov (GBS oproti len lepeným) a lepšiu pružnosť. Tieto faktory priamo ovplyvňujú teplo a životnosť, ale len ak je správne prispôsobenie.
