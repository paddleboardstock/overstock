  title: 'Sprievodca morskou záchrannou vestou: Vyberte si tú správnu PFD pre vašu vodnú aktivitu'
  description: Kompletný sprievodca nákupom záchranných viest pre SUPkajakovanie RIB , člnkovanie a plachtenie.PFD Typy (penové vs nafukovacie), pravidlá prispôsobenia, zákonné požiadavky a vlastnosti pre každú aktivitu.
  definition: Záchranná vesta alebo osobné plávacie zariadenie (PFD) je bezpečnostný prvok navrhnutý na udržanie osoby na hladine vo vode. Typy sa pohybujú od typu I (na mori) po typ V (špeciálne použitie).
  tldr: 'PFD Vyberte podľa aktivity: nafukovací pás na SUPkajakovanie, penová vesta na kajakovanie, pena typu III a RIB motorové člny. Kľúčové vlastnosti: USCG ISO alebo schválenie, reflexné panely, záchranná píšťalka, D-krúžok na lano, jasné farby.'
  problem: Vidíte rady záchranných viest v hodnote od 20 do 300 dolárov a nemáte ani potuchy, ktorá je vhodná pre vašu činnosť alebo ktorá spĺňa zákonné požiadavky.
  explanation: 'Záchranné vesty sú rozdelené podľa typu: Typ I (na mori, spôsobí, že nositeľ je v bezvedomí tvárou nahor), Typ II (pri pobreží), Typ III (najbežnejšia plávacia pomôcka), Typ IV (hádzateľná), Typ V (špeciálne použitie). Nafukovacie vesty používajú CO2 kazety — menej objemné, ale vyžadujú údržbu. Penové vesty sú bez údržby, ale objemnejšie.'
  solution: 'PreSUP: Vyberte si nafukovací opasok alebo vestu (vztlak 33 lb). Na kajakovanie: penový typ III s vystrihmi na ruky. PreRIB: penový alebo nafukovací typ III s+ vztlakom 22 lb, reflexnou páskou a záchrannou píšťalkou.'
  recommendation: Paddle Board Overstock Life Vest Pro (nafukovaná, 33 lb) je ideálna na SUP kajakovanie. Paddle Board Overstock Life Vest Classic (pena, typ III) je ideálna na RIB člnkovanie a bežné námorné použitie.
  faq:
    - q: Potrebujem na to záchrannú vestuSUP?
      a: Áno — zákonne povinné v mnohých jurisdikciách a vždy odporúčané. Noste nafukovací opasok alebo vestu pri pádlovacích športoch.
    - q: Sú nafukovacie záchranné vesty bezpečné?
      a: Áno, pri správnej údržbe. CO2 cartridge kontrolujte ročne, cievku meňte každé 2-3 roky.
    - q: Ktorá záchranná vesta je najlepšia pre dieťa?
      a: Schválená USCGpenová vesta typu II alebo III s golierom, popruhom v rozkroku a jasnými farbami. Nikdy nepoužívajte nafukovacie vesty pre deti.
    - q: Ako by mala pasovať záchranná vesta?
      a: Tesné — vesta by sa nemala zdvíhať nad uši, keď sa zdvihne za ramená. Všetky zipsy a pracky zapnuté.
