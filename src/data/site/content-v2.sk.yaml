  title: Čo si obliecť na surfovanie (Neobjavujte sa v boardshortoch, keď potrebujete 5/4)
  description: Prestaň hádať, čo si obliecť. Teplota vody, nie teplota vzduchu, určuje tvoje surfové oblečenie. Kompletný sprievodca vrstvením od tropických rashguardov až po kompletné zimné 5/4/3mm modely.
  definition: Surfové oblečenie sa pohybuje od boardshortov a rash guardov v teplej vode až po plné 5/4/3mm neoprény s čižmami a kapucňou v studenej vode. Teplota vody, nie teplota vzduchu, určuje, čo potrebujete.
  tldr: To, čo si oblečiete pri surfovaní, závisí úplne od teploty vody — nie od teploty vzduchu. Rash guardy a šortky na dosky fungujú nad 22°C, pružinové obleky pokrývajú 18-22°C, plné 3/2mm obleky zvládajú 14-18°C a 5/4/3mm s topánkami je potrebné pod 14°C. Vždy noste UV ochranu a zvážte vodítko a nárazovú vestu.
  problem: Prídete na pláž a neviete, či vám stačí rash guard alebo či potrebujete celý neoprén. Teplota vzduchu je teplá, ale voda studená, alebo voda je v poriadku, ale vietor je mrazivý. Nesprávne oblečenie znamená pokazenú jazdu.
  explanation: 'Surfové oblečenie slúži trom účelom: tepelnej izolácii, UV ochrane a prevencii opotrebovania. Neoprénové obleky sa hodnotia podľa hrúbky a krytia — pružinové obleky (krátke ruky alebo nohy) sú určené na hraničné dni, plné obleky na studenú vodu. Ochranné chrániče chránia pred vyrážkou na doske a slnkom, ale neposkytujú žiadnu tepelnú hodnotu. Topánky, rukavice a kapucne nie sú doplnky, ale nevyhnutné vybavenie pre surfovanie v studenej vode pod 12°C.'
  solution: 'Pred vyrazením si skontrolujte miestnu správu o teplote bóje alebo živej vody. Zostavte si súpravu podľa vašich najchladnejších bežných podmienok: rashguard a šortky na leto, 3/2mm kompletný oblek na jar a jeseň, 5/4/3mm s topánkami a kapucňou na zimu. Vždy pridajte vodítko a zvážte plávaciu vestu pre bezpečnosť.'
  recommendation: Najskôr investujte do dobrého 3/2 mm plného obleku — pokryje najširší rozsah podmienok. Ak plánujete surfovať počas zimy, pridajte 5/4/3 mm oblek a topánky. Paddle Board Overstock Neoprén Pro s termoizolačnými mostíkmi efektívne zvláda obe teploty.
  faq:
    - q: Môžem surfovať len v boardshortoch?
      a: Áno, v tropickej vode nad 24°C. Možno budete chcieť rash guard, aby ste zabránili odieraniu hrudníka a rúk pri pádlovaní. Vosk alebo trakčná podložka na doske pomáha kompenzovať nedostatok priľnavosti obleku.
    - q: Potrebujem surfové topánky?
      a: Ak teplota vody klesne pod 14 °C, topánky zabraňujú necitlivosti a chránia vaše chodidlá pred kameňmi a rezmi na útesoch. Tiež zlepšujú trakciu na doske. Väčšina surferov v severných oblastiach používa topánky od novembra do marca.
    - q: Čo je to pružinový oblek?
      a: Pružinový oblek je neoprén s krátkymi rukami alebo krátkymi nohami (alebo obaja) navrhnutý pre vodu medzi 18°C a 22°C. Poskytuje viac tepla než rash guard, ale menší krytie než plný oblek.
    - q: Mám nosiť záchrannú vestu počas surfovania?
      a: Nie sú to tradičné záchranné vesty, ale nárazová vesta alebo plávacia pomôcka môže pomôcť v náročných podmienkach alebo ak ste slabý plavec.Paddle Board Overstock Záchranné vesty sú navrhnuté pre SUP kajakovanie, ale môžu poskytnúť väčšiu istotu pri plávaní pre začiatočníkov v surfovaní.
