  title: 'Starostlivosť o neoprén: Nechajte svoj neoprén vydržať 2x dlhšie'
  description: Správna starostlivosť o neoprén predlžuje životnosť od 1 do 3 sezóny+. Tipy na oplachovanie, sušenie, skladovanie a opravu neoprénových oblekov. Vyhnite sa bežným chybám, ktoré neoprén predčasne ničia.
  definition: Starostlivosť o neoprén zahŕňa oplachovanie čerstvou vodou po každom použití, sušenie mimo priameho slnečného svetla, skladovanie na plochom alebo zavesení na širokom vešiaku a pravidelné čistenie na odstránenie soli, baktérií a zápachu.
  tldr: Neoprén opláchnite zvnútra aj zvonku čerstvou vodou hneď po každom tréningu. Suchajte naruby vonku v tieni na širokom plastovom vešiaku. Skladujte ho naplocho alebo zložené na chladnom, suchom mieste. Nikdy nenechávajte neoprén na priamom slnku, v horúcich autách alebo sušičkách. Používajte šampón každých 5-10 sedení.
  problem: Po jednej sezóne váš neoprén zapácha, neoprén stratil pružnosť, švy sa olupujú a zips sa zachytáva — to všetko sa dá predísť správnou starostlivosťou.
  explanation: Soľné kryštály sa zachytávajú do neoprénu a odstraňujú materiál. Baktérie sa množia vo vlhkých vnútornostiach, vytvárajú zápachy a rozkladajú neoprén.UV Degraduje nylonový povlak. Teplota nad 50 °C spôsobuje delamináciu. Nesprávne sušenie deformuje neoprén a zaťažuje spoje.
  solution: 'Po každom sedení: dôkladne opláchnite zvnútra aj zvonku, otočte naruby, zaveste široký plastový vešiak v tieni. Keď zaschnete, otočte sa doprava von a skladujte naplocho. Každých 5-10 sedení: perte ho šampónom v neoprénoch. Mesačne: namažte zips voskom na zips.'
  recommendation: Na čistenie používajte Paddle Board Overstock šampón na neoprén a Paddle Board Overstock na údržbu zipsu vosk na zips. Skladujte na Paddle Board Overstock širokom vešiaku v sieťovacej taške.
  faq:
    - q: Môžem dať svoj neoprén do práčky?
      a: Neodporúča sa — pranie v práčke poškodzuje neoprén. Ak musíte, použite jemný cyklus, studenú vodu a sieťované vrecko.
    - q: Ako sa zbavím zápachu zo svojho neoprénu?
      a: Namočte do studenej vody so šampónom alebo bielym octom na 30 minút. Dôkladne opláchnite.
    - q: Ako by som mal sušiť svoj neoprén?
      a: Naruby von v tieni na širokom, polstrovanom plastovom vešiaku. Vyhnite sa priamemu slnečnému žiareniu a kovovým vešiakom.
    - q: Môžem opraviť roztrhnutý neoprén?
      a: Malé trhliny menšie ako 1\" sa dajú opraviť neoprenovým lepidlom a záplatou. Väčšie trhliny môžu vyžadovať profesionálnu opravu.
