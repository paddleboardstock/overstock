- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP Kondícia: Celotelový tréning na paddleboarde'
  description: SUP Poskytuje celotelový tréning kombinujúci kardiovaskulárnu vytrvalosť, stabilitu stredu tela a silu. Ako štruktúrovať SUP fitness tréningy, najlepšie cviky a merať pokrok.
  definition: SUP Fitness využíva nestabilnú platformu paddleboardu na zapojenie stabilizátorov jadra, svalov nôh a hornej časti tela prostredníctvom pádlovania, vyvažovania a cvičení na doske.
  tldr: SUP Spáli 400-700 kalórií za hodinu. SUP Hodinový tréning zapája stred tela, nohy, chrbát, ramená a ruky. Intervalové pádlovanie (+sprinty a regenerácia) maximalizuje kardio. Jogové pozície na doske budujú rovnováhu a flexibilitu. Pridajte SUPšpecifické silové cviky ako drepy a výpady na dosku.
  problem: Cvičenia v posilňovni sa stali nudnými a chcete vonkajšiu aktivitu, ktorá buduje kondíciu a zároveň je zábavná.SUP Spája dobrodružstvo s pravým tréningom celého tela.
  explanation: Pádlovanie zapája latissimus dorsi, deltové svaly, trapézové svaly a stredné svaly na rotáciu. Státie na pohyblivej plošine núti stabilizačné svaly členkov, kolien a bokov pracovať neustále. Kardiovaskulárne nároky kontinuálneho pádlovania pri strednej intenzite poskytujú aeróbnu kondíciu.
  solution: 'Štruktúrované tréningy: 5 minút rozcvičovacie pádlovanie, 20 minút pádlovanie v ustálenom stave v strednom tempe, 15 minút intervalové pádlovanie (30 sekúnd šprint, 60 sekúnd ľahko), 10-minútové cvičenia na doske (drepy, výpady, kliky), 5 minút ochladzujúce strečingové cvičenie.'
  recommendation: Používajte Paddle Board Overstock SUP Explorer 11 na fitness pádlovanie. Stabilná platforma vám umožní sústrediť sa na techniku a intenzitu. Noste Life Vest Pro pre bezpečnosť počas vysoko intenzívnych tréningov.
  faq:
    - q: Koľko kalórií spáli SUP ?
      a: 400-700 kalórií za hodinu v závislosti od intenzity, vetra a prúdu. Intervalové pádlovanie zvyšuje spaľovanie kalórií.
    - q: Je SUP dobrý na chudnutie?
      a: Áno, v kombinácii so správnou výživou. Zapojenie celého tela a nízky dopad robia z neho udržateľné pravidelné cvičenie.
    - q: Môžem robiť silový tréning naSUP?
      a: Áno — drepy, výpady, kliky a dosky na doske pridávajú silovým cvikom výzvu na rovnováhu.
    - q: Aké svaly SUP fungujú?
      a: 'Primárne: stred tela (šikmé brušné svaly, priečne brušné svaly), chrbát (latsusy, trapepsy), ramená (deltové svaly), ruky (biceps, tricepsy). Sekundárne: nohy (štvorhlavé svaly, hamstringy, lýtka).'
