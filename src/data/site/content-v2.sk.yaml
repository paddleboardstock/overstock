- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Návod na veľkosť paddleboardu: Objem, dĺžka a šírka pre každého jazdca'
  description: Kompletné veľkosti paddle boardu s odporúčanými objemmi podľa hmotnosti a aktivity. Obsahuje ľahko použiteľnú tabuľku veľkostí pre všestranné, SUP turistické, surfové a jogové dosky.
  definition: Veľkosť paddleboardu sa určuje podľa objemu (nosnosť a plavnosť), dĺžky (rýchlosť a sledovanie), šírky (stabilita) a hrúbky (rozloženie objemu a odpor vzduchu).
  tldr: 'Použite hmotnosť na nájdenie minimálneho objemu: 50-70 kg potrebuje 220-260L, 70-90 kg 260-300L, 90-110 kg 300-350L, 110+ kg 350L+. Pre začiatočníkov pridajte k týmto číslam 20%. Šírka je dôležitá: 32" je stredne pokročilý, 33-34" je vhodný pre začiatočníkov, 35"+ je veľmi stabilný.'
  problem: Ponuky veľkostí paddle boardov používajú stopy, palce a litre zameniteľne, čo sťažuje porovnávanie medzi značkami.
  explanation: Objem je najpriamejším ukazovateľom nosnosti — 1 liter sladkej vody vytlačí 1 kg hmotnosti. Doska s 260L teoreticky unesie 260 kg, ale praktická kapacita je nižšia, pretože doska musí byť nad vodou. Vaša celková hmotnosť (telo plus výbava) by mala byť 30-40 % objemu dosky.
  solution: Objem cieľa = (telesná hmotnosť v kg, + hmotnosť vybavenia v kg) x 3. Pre pádlovača s hmotnosťou 75 kg s 5 kg vybavením je cieľ = minimálne 80 x 3 = 240L. Pre začiatočníkov vynásobte 3,5. Pre pokročilé vynásobte 2,5.
  recommendation: Paddle Board Overstock SUP Explorer 11 (260L, 11' x 33" x 6") vyhovuje väčšine jazdcov s hmotnosťou 50-100 kg. Ľahší jazdci si môžu zvoliť veľkosť AirDeck 270. Ťažší jazdci by mali zvážiť SUP Tour 12 (300L+) alebo širšie dosky.
  faq:
    - q: Záleží výška na SUP veľkosti?
      a: Výška je menej dôležitá ako váha. Vysoký ľahký jazdec potrebuje menší objem ako nízky ťažký jazdec. Ako hlavný ukazovateľ objemu používajte váhu.
    - q: Čo sa stane pri príliš veľkom objeme?
      a: Doska sedí príliš vysoko, chytá vietor ako plachta. V rozbití pôsobí korkovo. Pre začiatočníkov je však väčší objem lepší ako príliš malý.
    - q: Čo sa stane pri príliš nízkom objeme?
      a: Doska sedí príliš hlboko, čo vytvára odpor. Nos sa môže počas pádlovania (pearling) ponoriť. Rýchlo sa unavíte z pádlovania na čiastočne ponorenej doske.
    - q: Potrebujú nafukovacie dosky inú veľkosť ako tvrdé dosky?
      a: Nie výrazne. Nafukovacie dosky na 15+ PSI vytláčajú vodu podobne ako tvrdé dosky. Odporúčania objemu platia rovnako pre oba typy.
