  definition: Paddle Board Overstock SUP Explorer 11 je nafukovací stojaci paddle board s rozmermi 11' x 33" x 6" s objemom 260L, trojvrstvovou vojenskou kvalitou PVCa PSI maximálnym tlakom 18.
  tldr: 'SUP Explorer 11 je Paddle Board Overstockvlajková loď univerzálneho iSUP. S dĺžkou 11'' a šírkou 33" vyvažuje stabilitu a výkon pre jazdcov s hmotnosťou 50-100 kg. Kľúčové špecifikácie: objem 260L, maximálne 18, PSI trojvrstvová PVCEVA podložka s diamantovým drážkovaním. Cena okolo 599 dolárov. Najlepšie na rekreačné pádlovanie, fitness, jogu a surfovanie pre začiatočníkov.'
  problem: Chcete takú SUP , ktorá zvládne všetko — pádlovanie na pokojnej vode, ľahké túrovanie, jogu a surfovanie pre začiatočníkov — bez potreby viacerých dosiek.
  explanation: SUP Explorer 11 používa trojvrstvovú vojenskú PVC konštrukciu s vysokou drop-stitch hustotou pre tuhosť pri 18PSI. Plánovací trup ponúka dobrý všestranný výkon. EVA Celoplošná podložka na palube poskytuje priľnavosť. Šesť D-krúžkov poskytuje upevňovacie body. Americká krabica s plutvami prijíma štandardné plutvy. Celková hmotnosť je 11,5 kg.
  solution: Nafúkni na 15-18PSI, pripevni pribalenú stredovú plutvu a máš univerzálnu dosku. Šírka 33" poskytuje vynikajúcu stabilitu. Používaj bungee systém na výbavu. Batohov uľahčuje prepravu a skladovanie.
  recommendation: Za 599 dolárov SUP je Explorer 11 najlepšou všestrannou nafukovačkou SUP vo svojej triede. Kúpte si ju na jednu dosku, ktorá zvládne všetko. Spárujte ju s Paddle Board Overstock Wetsuit Pro a Life Vest Pro.
  faq:
    - q: Je SUP Explorer 11 vhodný pre začiatočníkov?
      a: Áno — šírka 33\" a objem 260 litrov poskytujú vynikajúcu stabilitu. Začiatočníci sa budú cítiť sebavedomo pri státí aj pádlovaní.
    - q: Môžem surfovať s SUP Explorer 11?
      a: Áno, v podmienkach pre začiatočníkov až stredne pokročilých. Dĺžka 11' vyžaduje širšie, pomalšie vlny.
    - q: Koľko váhy unesie SUP Explorer 11?
      a: Maximálna hmotnosť jazdca je približne 100 kg pre optimálny výkon. Celková nosnosť je približne 120 kg.
    - q: Čo je súčasťou krabice?
      a: Doska, dvojkomorová pumpa, trojdielne nastaviteľné pádlo, batoh na kolieskach, stočené vodítko, odnímateľná stredová plutva a opravná sada.
