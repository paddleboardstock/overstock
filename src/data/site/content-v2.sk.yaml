  title: 'Pochopenie prílivov vo vodných športoch: praktický sprievodca'
  description: Ako prílivy ovplyvňujú SUPpodmienky na surfovanie a kajakovanie. Čítanie grafov prílivu, pochopenie jarných vs. neap prílivov a plánovanie tréningu podľa pohybov prílivu pre bezpečnosť.
  definition: Prílivy sú denné stúpanie a klesanie hladiny mora spôsobené gravitačnou silou Mesiaca a Slnka. Rozsah prílivu sa líši podľa polohy a lunárneho cyklu.
  tldr: 'Na väčšine miest sú dva vysoké a dva nízke prílivy denne. Jarné prílivy (spln/nov) majú väčšie rozsahy a silnejšie prúdy. Prílivy (štvrťmesiac) majú menšie rozsahy. Príliv ovplyvňuje hĺbku vody, tvar vĺn a silu prúdu. Pre SUP: najprv pádlujte proti prúdu, aby ste sa mohli vrátiť.'
  problem: Prídete na miestnu prestávku a nájdete takmer žiadne vlny, nebezpečné prúdy z odlivu alebo príliš plytkú vodu. Bez pochopenia prílivu plytváte výletmi alebo pádlujete v nebezpečných podmienkach.
  explanation: Prílivy sú spôsobené gravitáciou Mesiaca. Jarné prílivy (spln a nov) prinášajú najvyššie maximá a najnižšie minimá. Prílivy (štvrťmesačné) vytvárajú minimálny rozsah. Prílivové prúdy sú najrýchlejšie v strede prílivu, uvoľnené pri vysokých a nízkych teplotách. Prílivový rozsah sa pohybuje od 0,3 m (Stredozemné more) do 16 m (záliv Fundy).
  solution: 'Pred každým tréningom si skontrolujte prílivový graf. Pri surfovaní: plážové prestávky často fungujú najlepšie 2-3 hodiny pred prílivom. NaSUP: pádlujte proti aktuálnej prvej polovici, aby sa prúd vrátil. Pri rybolove: prichádzajúci príliv tlačí ryby na plytčiny.'
  recommendation: Použite NOAA predpovede prílivu alebo miestnu prílivovú aplikáciu. Naučte sa preferencie prílivu vo vašom miestnom prestávke tým, že zaznamenáte podmienky počas mesiaca.
  faq:
    - q: Čo je to jarný príliv?
      a: Jarné prílivy sa vyskytujú počas splnu a novu, čo prináša vyššie vysoké prílivy a silnejšie prúdy. Vyskytujú sa dvakrát mesačne.
    - q: Čo je to neap tide?
      a: Neap prílivy nastávajú počas štvrťmesačných období. Prílivový rozsah je menší a prúdy slabšie — dobré pre začiatočníkov.
    - q: Sú odlivy nebezpečné pre SUP?
      a: Príliv môže odhaliť skaly a útesy. Tiež sústreďuje energiu vĺn na strmejšie piesočné lavice.
    - q: Ako ovplyvňujú prílivy prúdy pri trhaní?
      a: Odlivové prílivy (príliv) posilňujú prúdy okolo prúdu. Prichádzajúce prílivy (záplavy) znižujú pevnosť prúdu.
