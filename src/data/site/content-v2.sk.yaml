- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Údržba nafukovacích prístrojov SUP : Udržujte svoju dosku dlhé roky'
  description: Správna údržba nafukovacích dosiek SUP výrazne predlžuje životnosť dosky. Tipy na čistenie, sušenie, starostlivosť o ventily, UV ochranu a sezónne skladovanie drop-stitch paddleboardov.
  definition: Údržba nafukovacích zariadení SUP zahŕňa čistenie po použití, správne sušenie, kontrolu ventilov UV , ochranu a správne skladovanie, aby sa zabránilo delaminácii, plesniam, degradácii materiálu a únikom vzduchu.
  tldr: Po každom sedení so slanou vodou opláchnite dosku čerstvou vodou. Pred vyfúkaním a uskladnením dosky úplne vysušte. Skontrolujte ventil na nečistoty a O-krúžok raz ročne namažte. Nafúknutý (na polovicu) skladujte PSIna chladnom, tmavom mieste. Vyhnite UV sa dlhodobému vystaveniu, ktoré degradujePVC. Malé prepichnutia okamžite opravte priloženou opravnou súpravou.
  problem: Po sezóne začne vaša nafukovacia plošina SUP pomaly presakovať, podložka na terase sa na okrajoch olupuje a pôsobí tvrdšie PVC . Zanedbávanie základnej údržby spôsobuje predčasné starnutie, ktorému sa dá úplne predísť.
  explanation: PVC degraduje sa pod UV vplyvom žiarenia. Soľné kryštály z morskej vody sa dostávajú do švov a ventilov, čím spôsobujú mikro-úniky. Vlhkosť zachytená vo vnútri podporuje rast plesní, ktorá napáda drop-stitch závity. Ventilové O-krúžky vysychajú a strácajú tesnenie. Špina a piesok sa prelínajú s lepidlom na palubných podložkách, čo spôsobuje zdvihnutie hrany.
  solution: 'Po každom sedení: opláchnite dosku, rebrá a čerpadlo čerstvou vodou. Utrite podložku na terase. Otvorte ventil na vypustenie zachytenej vody. Suchú dosku dajte do tieňa pred vyfúkaním. Mesačne: skontrolujte ventil a naneste silikónové lubrikant na O-krúžok. Sezónne: umyte jemným mydlom a vodou, skontrolujte prepichnutia.'
  recommendation: Riaďte Paddle Board Overstock sa návodom na starostlivosť, ktorý je priložený k doske. Opravnú súpravu použite okamžite pri každom defekte. Dosku skladujte v taške na mieste s kontrolovanou teplotou, mimo priameho slnečného svetla.
  faq:
    - q: Môžem nechať svoju nafukovaciu fľašu SUP nafúknutú počas celej sezóny?
      a: Áno, ale skladujte mimo priameho slnečného svetla a maximálne na polovicu PSI (8-10), PSIaby ste znížili napätie na švech. Úplne nafúknite tesne pred použitím.
    - q: Ako vyčistím pleseň zo svojhoSUP?
      a: Jemné mydlo zmiešajte s teplou vodou a drhnite mäkkou kefou. Na odolnú pleseň použite zriedený roztok bieleho octu (1:4). Vyhnite sa bielidlu.
    - q: Musím ventil namazať?
      a: Áno, ročne. Odstráňte jadro ventilu, naneste silikónový tuk na O-krúžok a znovu namontujte. Tým sa zabráni únikom vzduchu.
    - q: Ako mám skladovať svoje SUP na zimu?
      a: Dôkladne vyčistite a vysušte. Úplne vyfúknite, voľne rolujte (vyhnite sa tesným záhybom) a skladujte na chladnom, tmavom a suchom mieste. Vyhnite sa mrazu.
