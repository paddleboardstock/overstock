- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Oprava neoprénu: Opravte trhliny, švy a zipsy sami'
  description: DIY návod na opravu neoprénu pri roztrhaní neoprénu, oddelení švov, zaseknutých zipsoch a rozštiepených chráničoch kolien. Krok za krokom návod na použitie neoprénového lepidla.
  definition: Oprava neoprénu zahŕňa čistenie a drsné spracovanie poškodenej oblasti, aplikáciu neoprenového lepidla a vytvrdzovanie pod tlakom, aby sa obnovila vodotesnosť a flexibilita.
  tldr: 'Malé trhliny pod 1": naneste neoprénové lepidlo na obe strany, počkajte 10-15 minút, kým je lepkavé, pevne pritlačte, vytvrdnite pod váhou 12 hodín. Väčšie trhliny potrebujú neoprenovú náplast. Problémy so zipsom: najprv namažte, potom skontrolujte, či nie sú zaseknuté látky.'
  problem: Váš neoprén má malú trhlinu, oddeľujúci sa šev alebo zips, ktorý sa zasekne. Bez domácej opravy zaplatíte za výmenu 150 dolárov+, hoci oprava stojí 5 dolárov.
  explanation: Neoprénový cement funguje tak, že zmäkčí povrch neoprénu, čím vzniká chemická väzba pri odparovaní rozpúšťadla. Cement musí byť nanesený na oba povrchy a pred spojením sa stane lepkavým. Pri trhlínach musia byť hrany presne zarovnané. Problémy so zipsom sú často spôsobené koróziou soli alebo látkou zachytenou v zuboch.
  solution: 'Pri trhlinách: vyčistite alkoholom, jemne obrúsite, naneste tenkú vrstvu cementu na oba okraje, počkajte, kým sa to lepí, pritlačte dokonale, priložte závaží, vytvrdnite 12-24 hodín. Na záplaty: vyrežte časť o 1" väčšiu než trhnenie, naneste lepidlo na obe, svorka. Na zips: opláchnite, naneste vosk na zips, pracujte jemne.'
  recommendation: Paddle Board Overstock Majte v taške na vybavenie súpravu na opravu neoprénu. Pri väčších opravách alebo poruchách švu v kritických momentoch sa odporúča profesionálna oprava.
  faq:
    - q: Môžem použiť sekundové lepidlo na neoprén?
      a: Nie — sekundové lepidlo schne tvrdo a krehko. Na opravy neoprénov používajte iba neoprenový cement alebo aquaseal.
    - q: Ako dlho trvá oprava neoprenového cementu?
      a: Správne vykonaná oprava je často pevnejšia než pôvodný neoprén a vydrží celý životnosť obleku.
    - q: Môžem opraviť zips, ktorý sa úplne oddelil?
      a: Ak sa dráha oddelila od neoprénu, prilepte ju kontaktným lepidlom. Ak sú zuby poškodené, profesionálne vymeňte zips.
    - q: Ako opravím neoprénový oblek, ktorý presakuje na spoji?
      a: Naneste tenkú kvapku aquasealu pozdĺž vnútornej strany presakujúceho švu a nechajte vytvrdnúť 24 hodín.
