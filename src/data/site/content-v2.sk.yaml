- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Sprievodca vybavením na surfovanie na studenej vode (surfujte zimou bez utrpenia)
  description: 'Nedovoľte, aby studená voda ukončila vašu sezónu. Kompletný rozbor vybavenia do studenej vody: hrúbka neoprénu, výber topánok a rukavíc, strih kapucne a doplnky, ktoré robia zimné tréningy naozaj príjemnými.'
  definition: Surfovanie v studenej vode vyžaduje kompletný neoprén (5/4/3 mm alebo hrubší), topánky, rukavice a kapucňu. Pod 12°C je potrebné chrániť každé miesto kontaktu so studenou vodou, aby sa zabránilo necitlivosti, podchladeniu a bezpečnostným rizikám.
  tldr: Surfovanie v studenej vode vyžaduje plný 5/4/3mm alebo 6/5/4mm kapucňový neoprén, 5mm topánky, 3mm rukavice a kapucňu. Kvalita švu je dôležitejšia než značka — hľadajte lepené a slepo šité (GBS) švy. Termo podšitý oblek pridáva výrazné teplo bez dodatočnej hrúbky. Vždy si vezmite náhradné tepelné vrstvy a termosku na regeneráciu po tréningu.
  problem: Chcete surfovať celú zimu, ale studená voda vám po 15 minútach otupí nohy, ruky nedokážete uchopiť dosku a oblek vám zakaždým, keď pádlujete, spláchne ľadovú vodu po chrbte. Bez správneho vybavenia sú tréningy v studenej vode krátke a nepríjemné.
  explanation: 'Surfovanie v studenej vode (pod 12°C) vyžaduje viac než len hrubý neoprén. Každý kontakt s chladom potrebuje ochranu: topánky zabraňujú necitlivosti nôh a chránia pred rezmi o útes, rukavice udržiavajú funkciu ruky pri pádlovaní a kapucňa zabraňuje najhoršej strate tepla (vaša hlava vyžaruje 30 percent telesného tepla). Hrúbka neoprénu by mala byť prispôsobená najchladnejšiemu mesiacu, nie priemeru. Okrem obleku zvyšujú pohodlie a odolnosť doplnky ako topánky s uzavretou podrážkou a rukavice s predohnutými prstami.'
  solution: 'Postavte si sadu na studenú vodu v tomto poradí: 5/4/3mm alebo 6/5/4mm plný oblek s GBS švami a zipsom na hrudi, 5mm čižmy s gumovou podrážkou, 3mm rukavice (rukavice sú teplejšie ako prsty) a 3mm kapucňa, ktorá sa zastrčí pod golier obleku. Pridajte prezliekací plášť pre dôstojnosť a teplo na parkovisku.'
  recommendation: Paddle Board Overstock Neoprén Pro vo veľkosti 5/4/3mm s integrovanou termálnou podšívkou zvládne väčšinu chladných podmienok až do 8°C. Skombinujte ho s Paddle Board Overstock 5mm topánkami a 3mm rukavicami pre kompletné nastavenie v studenej vode. Pod 8°C prejdite na 6/5/4mm kapucňový oblek.
  faq:
    - q: Naozaj potrebujem kapucňu?
      a: Áno. Strácate 30 percent telesného tepla cez hlavu. Kapucňa zabraňuje splachovaniu a udržiava krk v teple. 3 mm kapucňa pridáva viac tepla než zvýšenie hrúbky trupu z 5 mm na 6 mm.
    - q: Aké hrubé topánky potrebujem?
      a: Na vodu 8-12°C použite 5mm topánky. Pre 12-16°C postačujú 3mm topánky. Pod 8°C zvážte 7mm topánky alebo pridanie neoprenových ponožiek pod 5mm topánky.
    - q: Ako zabránim tomu, aby sa mi neoprén spláchol?
      a: Splachovanie nastáva, keď voda prenikne do obleku pri krku, zápästiach alebo členkoch. Dizajn so zipsom na hrudi výrazne znižuje začervenanie chrbta. Suché zipsy na krku a členkoch tiež pomáhajú, ale najlepším riešením je dobre padnúci oblek so švami GBS.
    - q: Môžem použiť 3mm oblek v studenej vode s extra vrstvami?
      a: 3 mm oblek s neoprenovou vestou pod ním môže rozšíriť rozsah približne o 3-4 °C, ale nie je to náhrada za správny 5/4/3mm alebo 5mm oblek. Vrstvenie najlepšie funguje pri krátkych sedeniach v hraničných podmienkach.
