- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard vs shortboard (úprimná odpoveď, ktorú vám nikto nedá)
  description: Longboardy zachytávajú viac vĺn; shortboardy sa otáčajú tvrdšie. Skutočná otázka je, ktorý z nich zodpovedá tvojim schopnostiam a lokálnym breakom. Úprimné porovnanie o stabilite, počte vĺn a progresívnej pasci.
  definition: Longboardy (9ft+) uprednostňujú stabilitu a ľahkosť chytania vĺn; shortboardy (5-7ft) uprednostňujú manévrovateľnosť a výkon na strmých vlnách. Správna voľba závisí od vašej úrovne zručností a miestnych typov vĺn.
  tldr: Longboardy (9 stôp+) sú stabilné, ľahko chytajú vlny a vyhovujú začiatočníkom aj surferom orientovaným na plavbu. Shortboardy (5-7 stôp) sú citlivé, rýchlejšie na vlnách a vyhovujú pokročilým surferom. Správna voľba závisí od vašej úrovne zručností, typu vĺn a toho, čo máte na surfovaní najradšej.
  problem: Vidíte videá surferov, ktorí robia ostré zákruty na shortboardoch, a longboardistov, ktorí ladne kĺžu pozdĺž nosa — oboje vyzerá zábavne. Máte rozpočet len na jeden typ dosky a musíte vedieť, ktorý štýl zodpovedá vašim cieľom a miestnym prestávkam.
  explanation: 'Longboardy majú väčšiu plochu, čo znamená, že pádlujú rýchlejšie, chytajú vlny skôr a poskytujú stabilnú platformu na chôdzu a cross-step. Vynikajú v malých, pomalých vlnách, kde by shortboard klesal. Shortboardy majú menší objem a agresívnejší rocker, čo im umožňuje klesať hlbšie do vlny, generovať rýchlosť v zákrutách a zapadnúť do strmých, dutých úsekov. Shortboardy vyžadujú silné pádlovanie a presné načasovanie vĺn. Bežný omyl: shortboardy nie sú "lepšie" — sú to jednoducho rôzne nástroje pre rôzne podmienky a úrovne zručností.'
  solution: Ak ste začiatočník, jazdite na longboarde (alebo vysokoobjemovom nafukovacom doske) aspoň 6 mesiacov. Ak ste stredne pokročilí a vaše miestne vlny sú často malé a pomalé, longboard alebo hybrid zachytí viac vĺn a bude zábavnejší. Ak sú vaše vlny strmé, duté a rýchle, krátky board je nevyhnutný, aby ste sa zmestili do vrecka. Mnohí stredne pokročilí surfisti si udržiavajú oba a vyberajú podľa dňa.
  recommendation: Začnite so Paddle Board Overstock Surfboard Pro ako platformou v štýle longboardu. Keď pravidelne otáčate a generujete rýchlosť, zvážte pridanie hybridu alebo shortboardu na dni s prudkými vlnami. Väčšina surferov, ktorí sa snažia shortboard hrať príliš skoro, je frustrovaná a jazdí menej vĺn.
  faq:
    - q: Je longboard jednoduchší na jazdu ako shortboard?
      a: Oveľa jednoduchšie. Longboardy zachytávajú vlny skôr, pádlujú rýchlejšie a sú stabilnejšie počas pop-upov a trimov. Shortboardy vyžadujú presné načasovanie, silnejšie pádlovanie a lepší odhad vĺn.
    - q: Vieš robiť otočky na longboarde?
      a: Áno, hoci štýl je iný. Longboardové otočky sú širšie, plynulejšie a zahŕňajú celé telo. Nose riding, cutbacky a hang-fives sú longboardové špecifické manévre s vlastným pokrokom v zručnostiach.
    - q: Ktorá doska je lepšia na malé vlny?
      a: Longboardy a hybridy fungujú lepšie v malých, slabých vlnách, pretože generujú klz a udržiavajú hybnosť. Shortboardy potrebujú strmšie a silnejšie vlny, aby fungovali.
    - q: Je na shortboarde ťažšie pádlovať?
      a: Výrazne tvrdšie. Nižší objem znamená, že doska sedí nižšie vo vode, čo vytvára väčší odpor. Pádlovanie na shortboarde je ako plávanie s brzdným padákom v porovnaní s pádlovaním na longboarde.
