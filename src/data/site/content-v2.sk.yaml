- slug: types-of-surfboards-explained
  category: guide
  type: technical
  title: Vysvetlenie typov surfových dosiek (ktorá je pre vás tá pravá?)
  description: Shortboard, longboard, fish, hybrid, pena — už ste zmätení? Tu je každý typ surfboardu rozdelený podľa toho, pre koho je určený, aké vlny potrebuje a ktorý by ste si mali kúpiť ako prvý.
  definition: Hlavné typy surfových dosiek sú longboardy (9ft+, stabilné, ľahké), shortboardy (5-7ft, citlivé, pokročilé), penové/nafukovacie (vysoký objem, bezpečné pre začiatočníkov) a hybridy (7-9ft, všestranný stred). Každý vyhovuje rôznym úrovniam zručností a podmienkam vĺn.
  tldr: Štyri hlavné typy surfových dosiek sú shortboardy (výkonné, nízkoobjemové), longboardy (stabilné, cruisy), penové/nafukovacie (vhodné pre začiatočníkov, s vysokým objemom) a hybridné alebo funboardy (stredne dlhé univerzálne). Každý typ vyhovuje inej úrovni zručností a štýlu surfovania. Vyberte si dosku podľa toho, kde sa nachádzate vo svojej krivke učenia a aký typ jazdy vás najviac baví.
  problem: 'Názvy surfových dosiek sú mätúce: mini-mal, egg, fish, gun, hybrid, retro twin — zoznam pokračuje. Chcete vedieť, ktorý typ dosky zodpovedá vašej úrovni zručností a miestnym vlnám, bez toho, aby ste museli kupovať päť rôznych dosiek, aby ste to zistili.'
  explanation: Longboardy majú dĺžku 9 stôp a viac, hrubé, s zaobleným nosom — zachytávajú vlny skoro a pádlujú bez námahy. Shortboardy majú dĺžku 5-7 stôp, špicatý nos a agresívny rocker — vyžadujú silné pádlovanie a presnú techniku, ale ponúkajú maximálny výkon. Penové a nafukovacie dosky napodobňujú tvary longboardov vo veľkých objemových baleniach, ale sú mäkšie a bezpečnejšie. Hybridy (funboardy, vajcia) majú dĺžku medzi 7 a 9 stopami a kombinujú ľahkosť pádlovania s schopnosťou otáčania. Fish boardy sú krátke a široké s lastovičím chvostom, navrhnuté pre menšie vlny.
  solution: Identifikujte svoj miestny typ vlny — pomalé plážové breaky vyhovujú longboardom aj hybridom; strmšie reef alebo point breaky fungujú s shortboardmi. Prispôsobte dosku vlne, nie tomu, čo vyzerá cool. Začiatočníci by mali zvoliť longboardový tvar s vysokým objemom a potom skúmať kratšie tvary, ako sa ich zručnosti rozvíjajú.
  recommendation: Pre väčšinu surferov je najlepším single-board quiverom hybridný alebo zábavný board okolo 7'6" až 8'6". Paddle Board Overstock Surfboard Pro s výškou 10'6" je dlhší, ale ponúka stabilitu longboardu s prenosnosťou nafukovacieho dosky. Používajte ho ako svoju hlavnú dosku počas prvého roka.
  faq:
    - q: Ktorá surfová doska je najľahšia na jazdu?
      a: Longboard (9ft+) alebo vysokoobjemový nafukovací dosky ako Paddle Board Overstock Surfboard Pro. Tieto dosky zachytávajú vlny skoro a poskytujú stabilnú platformu na učenie sa pop-upov a presúvania váhy.
    - q: Kedy by som mal prejsť z longboardu na shortboard?
      a: Keď dokážete pravidelne chytať zelené vlny, robte spodné zákruty a trimujte pozdĺž vlny na longboarde. Najčastejšou chybou je uponáhľať sa na prechod — očakávajte, že na longboarde strávite 6-12 mesiacov.
    - q: Na čo slúži rybia surfová doska?
      a: Rybárske dosky sú navrhnuté pre malé, mäkké vlny. Ich krátka dĺžka a široký obrys vytvárajú rýchlosť tam, kde by typický shortboard zhasol. Sú skvelou druhou doskou pre stredne pokročilých surferov.
    - q: Sú nafukovacie surfové dosky vôbec dobré?
      a: Moderné nafukovacie dosky drop-stitch s konštrukciou sa vyrovnajú penovým longboardom v pevnosti a výkone. Sú ideálne pre začiatočníkov a cestovateľov, pretože sa zmestia do batohu a sú takmer nezničiteľné.
