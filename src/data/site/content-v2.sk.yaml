  problem: Nafukovanie SUP lode s jednokomorovým čerpadlom trvá večnosť a mnohé lacné čerpadlá majú nepresné tlakomery, ktoré vedú k podinflácii.
  explanation: Dvojkomorové čerpadlo využíva oba valce pri zdvihu nadol na vysoký objem pri počiatočnom nafukovaní a prepína na jeden vysokotlakový valec pre konečné nafúkanie na 15-18PSI. Integrovaný manometr umožňuje presné monitorovanie inflácie. Veslá majú zosilnené lopatky a nastaviteľné objímky.
  solution: Použite režim vysokého objemu na počiatočné nafukovanie (obe komory) a na finálne nafukovanie pod vysokým tlakom prepnite na režim s jednou komorou. Veslá sa skladajú za pár sekúnd a rozkladajú na uskladnenie.
