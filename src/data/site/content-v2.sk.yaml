    - q: Je tlakomer presný?
      a: Áno, manometer je kalibrovaný a ukazuje presne v PSI rámci 1 v rámci typického prevádzkového rozsahu.
    - q: Dajú sa veslá použiť so AirDeck sériou?
      a: Áno, veslá obsahujú nastaviteľné veslá kompatibilné so AirDeck RIB sériovými loďami.
    - q: Z akého materiálu sú veslá vyrobené?
      a: Hliníkové hřídele leteckej kvality s vystuženými polypropylénovou čepeľou. Vážia približne 1,5 kg na pár.
