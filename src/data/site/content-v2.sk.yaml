  type: tutorial
  title: 'Údržba nafukovacích člnov: Zachráňte si investíciu'
  description: Ročný kontrolný zoznam údržby nafukovacích člnov. Čistenie, UV ochrana, kontrola švov, riadenie tlaku, starostlivosť o motory a zimná PVC Hypalon príprava pre lode.
  definition: Údržba nafukovacích člnov zahŕňa čistenie, UV ochranu, riadenie tlaku, kontrolu švov a ventilov, prevenciu plesní a správne skladovanie mimo sezóny.
  tldr: Po každom použití opláchnite v slanej vode. Aplikujte UV ochranný prostriedok každé 2-3 mesiace. Pred každým vychodom kontrolujte tlak nafukovania. Kontrolujte spoje, ventily a záď mesačne. Čistite jemným mydlom. Skladujte vyfúknuté na chladnom a suchom mieste mimo sezóny.
  problem: Používali ste svoju nafukovaciu loď celú sezónu a teraz trubice vyzerajú vyblednuté, šev presakuje a záď pôsobí mäkko — to všetko sa dá predísť pravidelnou údržbou.
  explanation: UV Žiarenie degraduje polymérnu matricu. Slaná voda kryštalizuje v záhyboch a obrusuje tkaninu. Pleseň rastie v zachytenej vlhkosti. Nesprávny tlak spôsobuje únavu materiálu. Záď (najmä preglejka) absorbuje vodu cez otvory na skrutky.
  solution: 'Po každom použití: opláchnuť čerstvou vodou, osušiť, skontrolovať tlak. Mesačne: utrieť hadičky UV ochranným prostriedkom, skontrolovať spoje, vrátiť ventil. Ročne: dôkladné čistenie, kontrola záďa na hnilobu, mazanie ventilov, testovanie mikronetesností.'
  recommendation: Používajte 303 Aerospace Protectant na Paddle Board Overstock lodné rúry. Odstráňte ventily a každý rok naneste silikónový tuk. Skladujte ho v taške s vysúšacím balíčkom.
  faq:
    - q: Môžem použiť bielidlo na čistenie mojej nafukovacej lode?
      a: Nie — bielidlo poškodzuje povrch látky. Použite jemné mydlo a teplú vodu. Na plesne použite zriedený biely ocot.
    - q: Ako často by som mal ošetrovať UV ochranným prostriedkom?
      a: Každé 2-3 mesiace počas sezóny používania. Častejšie v tropickom podnebí.
    - q: Musím si medzi použitím vyfukovať loď?
      a: Nie, ak sa používa týždenne. Nechajte nafúknuté s UV krytom. Na mesačné medzery vyfúknite a uskladnite.
    - q: Ako udržiavať záď?
      a: Kontrolujte skrutky mesačne. Každoročne utesnite odkryté drevené okraje morským lakom. Vymeňte, ak sa objavia mäkké miesta.
