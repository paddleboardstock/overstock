  title: 'SUP Návod na kotvu: Zostaňte na mieste počas rybolovu alebo fotografovania'
  description: Kompletný návod na SUP ukotvenie — typy kotiev (hubovité, skladacie, kolík), nastavenie kotvového vozíka, techniky nasadenia a bezpečnostné opatrenia na udržanie pozície.
  definition: SUP Kotva je závažie pripevnené na lano, ktoré drží dosku v polohe proti vetru a prúdu. Bežné typy zahŕňajú hubové kotvy, skladacie kotvy a sledovacie tyče.
  tldr: Použite kotvu na huby (1,5-3 lb) na bahnité alebo piesočnaté dno, skladaciu kotvu na skalnaté dno alebo tyč na sledovanie pre plytkú vodu s mäkkým dnom. Kotva by mala vážiť 1,5-3 lb pre pokojné podmienky, 3-5 lb pre vietor a prúd. Vždy používajte kotviaci vozík na nastavenie polohy a vedieť, kedy pustiť.
  problem: Nájdete ideálne miesto na rybolov, ale vietor a prúd vás každých pár minút odklonia od pozície. Bez kotvenia SUP sú rybolov a fotografovanie frustrujúce cvičenia neustáleho presúvania polohy.
  explanation: Kotva funguje tak, že sa ťahá po dne, kým sa nezachytí. Hubové kotvy sa zaryjú do mäkkého dna a poskytujú dobré uchytenie v piesku a blate. Skladacie kotvy majú plutvy, ktoré sa zaryjú do tvrdého alebo skalnatého dna. Strážne tyče fungujú v plytkej vode tým, že tlačia priamo do dna.
  solution: Nainštalujte kotviaci vozík (lano s posuvným krúžkom na jednej strane dosky) na nastavenie miesta upevnenia kotvy. Pripevnite 50-75' lana na kotvu. Rozviňte proti vetru alebo proti požadovanej polohe. V núdzových situáciách použite rýchlouvoľňovací systém na odpojenie. Nikdy nekotvujte v silnom prúde alebo tam, kde nie je ľahké ukotvenie vytiahnuť.
  recommendation: 3 lb skladacia kotva s 50' lanom funguje na väčšinu SUP rybárskych podmienok. Pridajte kotviaci vozík pomocou D-krúžkov na Paddle Board Overstock SUP vašom Explorer 11.
  faq:
    - q: Akú veľkosť kotvy potrebujemSUP?
      a: 1,5-3 libry pre pokojné jazerá a pomalé rieky. 3-5 libier pre pobrežné oblasti s vetrom alebo prúdom. Nadrozmerné kotvy sa ťažko vyťahujú.
    - q: Koľko kotviaceho lana potrebujem?
      a: Štandardom je 5:1 ďalekohľad (5 stôp vlasca na každých 1 stopu hĺbky). Pri 10' vode použite 50' vlasca.
    - q: Je ukotvenie nebezpečné SUPna ?
      a: Len ak ukotvíte v prúde alebo vetre dostatočne silnom na prevrátenie dosky. Vždy používajte rýchlouvoľňovací systém, ktorý sa dá okamžite odpojiť.
    - q: Môžem ukotviť v akejkoľvek vode?
      a: Skontrolujte miestne predpisy. Niektoré oblasti obmedzujú kotvenie na ochranu morských tráv alebo morských biotopov. Nikdy nekotvejte na koralových útesoch.
