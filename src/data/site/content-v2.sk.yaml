      a: Vonkajší neoprén má nylonovú výstuž v oblastiach s vysokým opotrebením (kolená, sedadlo, ramená). Pri správnom opláchnutí a zavesení na sušenie očakávajte 2-3 sezóny pravidelného používania pred viditeľným opotrebením.
