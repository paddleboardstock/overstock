  title: 'SUP Nafukovacie úložné priestory: Správny spôsob, ako uskladniť váš iSUP'
  description: Správne SUP nafukovacie skladovanie zabraňuje delaminácii, UV poškodeniu, plesni a únikom ventilov. Tipy na zimné skladovanie, dlhodobé skladovanie a každodenné skladovanie drop-stitch dosiek.
  definition: SUP Nafukovacie skladovanie znamená udržiavať dosku v čistom, suchom prostredí s kontrolovanou teplotou, ďaleko od UVextrémnych teplôt a fyzického poškodenia.
  tldr: Skladujte na chladnom, tmavom mieste pod 30 °C, mimo priameho slnečného svetla. Na krátky čas (1-2 týždne) skladujte čiastočne nafúknuté na 8-10 °PSIC. Na dlhodobé skladovanie úplne vyfúknite, voľne zrolujte a vložte do úložného vrecka. Nikdy neskladujte mokré. Držte sa ďalej od hlodavcov a ostrých predmetov.
  problem: Vyfúknete ho SUP a natlačíte do horúcej garáže alebo vlhkého suterénu. O tri mesiace neskôr PVC zožltol, podlaha sa olupuje a ventil preteká. Nesprávne skladovanie spôsobuje viac škôd než bežné používanie.
  explanation: Teplota nad 50 °C spôsobuje PVC migráciu plastifikátorov, čím sa materiál stáva tuhým a krehkým.UV Žiarenie rozkladá polymérne väzby. Vlhkosť zachytená vo vnútri vytvára pleseň. Chlad pod bodom mrazu robí PVC materiál krehkým. Tlakové body z tesného skladania vytvárajú trvalé záhyby.
  solution: 'Krátkodobé skladovanie: opláchni, vysuš, nafúkni na 10 a PSIskladuj nad zemou v tienistom priestore. Dlhodobé skladovanie: dôkladne vyčisti, úplne vysuš, úplne vyfúkni, zroluj s podložkou von, vlož do tašky, uskladni v chladnej a suchej skrini. Vyhni sa chemikáliám a škodcom.'
  recommendation: Používajte Paddle Board Overstock tašku na uskladnenie — blokuje UV a zabraňuje odreninám. Skladujte ju v klimatizovanej miestnosti. Pre vlhké prostredie pridajte do tašky vysušovaciu tašku.
  faq:
    - q: Môžem skladovať SUP svoj nafúknutý v garáži?
      a: Len ak garáž zostane pod 30 °C a nemá priame slnečné lúče. Väčšina garáží v lete presahuje 40 °C.
    - q: Mám si ich uložiť SUP do tašky?
      a: Áno, vak chráni pred prachom UVa fyzickým poškodením. Uistite sa, že doska je pred balením úplne suchá.
    - q: Môže zmrazenie poškodiť nafukovaciu plošinuSUP?
      a: Áno. Pod bodom mrazu PVC sa stáva krehkým a môže prasknúť, keď sa rozvinie alebo nafúkne. Vždy skladujte nad 5 °C.
    - q: Ako by som si mal vyrolovať SUP na uskladnenie?
      a: Rolujte s podložkou otočenou von, aby ste chránili spodokPVC. Vyhnite sa tesným záhybom. Striedajte polohu prekladu pri každom prekladaní.
