  title: Ako dlho vydržia nafukovacie člny? Životnosť podľa materiálu a údržby
  description: Životnosť nafukovacích člnov závisí od materiálu, skladovacích podmienok a údržby.PVC Člny vydržia 7-10 rokov, Hypalon lode 10-15+ rokov. Ako maximalizovať životnosť vašej lode.
  definition: Životnosť nafukovacích člnov je počet rokov, počas ktorých loď zostáva schopná plavby, kým sa materiál trubice nerozpadne natoľko, že sa dá opraviť.PVC Lode majú priemerne 7-10 rokov;Hypalon lode v priemere 10-15+ rokov pri správnej starostlivosti.
  tldr: PVC Nafukovacie člny vydržia 7-10 rokov pri správnej starostlivosti.Hypalon Vydržia 10-15+ rokov. Hlavným faktorom ovplyvňujúcej životnosť UV je vystavenie — člny skladované na priamom slnku zlyhávajú 2-3x rýchlejšie. Správna údržba dramaticky predlžuje životnosť.
  problem: Investujete 1 000 až 5 000 dolárov do nafukovacieho člna a potrebujete realistické očakávania životnosti.
  explanation: Hlavným mechanizmom starnutia je UV degradácia materiálu trubice.UV Spôsobuje PVC stuhnutie, praskanie a stratu pevnosti. Teplo urýchľuje degradáciu. Mechanické opotrebenie spôsobené vyplavením a dokovaním obrusuje tkaninu. Podlaha a záď tiež starnú — hliník vydrží neobmedzene dlho, preglejka môže zhniť do 5-7 rokov.
  solution: Skladujte loď mimo priameho slnečného svetla. Aplikujte UV ochranný prostriedok každé 2-3 mesiace. Po každom použití slanej vody opláchnite. Udržiavajte správny tlak nafukovania. Kontrolujte spoje, ventily a záď ročne. Okamžite opravte malé rezy.
  recommendation: Paddle Board Overstock PVC Lode obsahujú UV stabilizátory a majú 2-ročnú záruku. Loď skladujte v prepravnej taške, keď sa nepoužíva, aby ste maximalizovali životnosť.
  faq:
    - q: Vyprší moja nafukovacia loď, aj keď ju nepoužívam?
      a: Áno — UV vystavenie a migrácia plastifikátorov pokračujú bez ohľadu na použitie. Skladujte vyfúknuté v interiéri pre maximálnu ochranu.
    - q: Môžem vymeniť duše na mojej nafukovacej lodi?
      a: Niektorí výrobcovia ponúkajú náhradné sady trubiek pre rovnaké zadné časti a podlahu. Cena je 50-70 % ceny novej lode.
    - q: Čo zabíja nafukovacie člny najrýchlejšie?
      a: UV vystavenie, ozón z elektrických motorov a nesprávne skladovanie (vlhkosť, teplo, hlodavce).
    - q: Ako zistím, kedy moja loď potrebuje výmenu?
      a: Časté netesnosti, tuhý/krehký materiál, oddelenie švu, zhnitý záď alebo ventily, ktoré už netesnia.
