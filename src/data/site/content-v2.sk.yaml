- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP With Your Dog: Kompletný návod, ako na to'
  description: Paddleboarding so psom — príprava, bezpečnosť, tréningové kroky, odporúčania na vybavenie a tipy pre zábavný zážitok pre vás oboch.
  definition: SUP So psom znamená naučiť vášho psa udržať rovnováhu na paddleboarde, vybaviť ho psom PFDa bezpečne spolu pádlovať.
  tldr: Začnite so širokou, stabilnou vestou SUP (34"). +Zabezpečte svojmu psovi správne padnúcu záchrannú vestu s rukoväťou. Najprv predstavte dosku na súši, potom v plytkej vode. Začnite krátkymi sedeniami a pozitívnym posilňovaním. Vždy noste so sebou vodu pre psa. Sledujte príznaky stresu alebo únavy.
  problem: Váš pes miluje vodu, ale nie ste si istí, ako ho bezpečne zoznámiť SUP . Bez správneho výcviku môže pes spanikáriť, vyskočiť alebo poškriabať dosku.
  explanation: 'Psy majú prirodzené schopnosti plávania, ale musia sa naučiť, že doska je bezpečná platforma. Kľúčom je postupná desenzibilizacia: predstavte dosku na pevnej zemi, odmeňte pokojné správanie, potom prejdite do plytkej vody a nakoniec do hlbšej vody.'
  solution: 'Začnite na súši: nechajte psa čuchať a chodiť po doske (po tráve). Odmeňte pokojné správanie. Ďalej: položte dosku do veľmi plytkej vody, podoprite ju, nechajte psa stáť na ňu. Odmeňujte. Ďalej: nastúpite na palubu v plytkej vode, nechajte psa pridať sa. Nakoniec: pomaly pádlujte v pokojnej vode.'
  recommendation: Použite Paddle Board Overstock SUP Explorer 11 ako jeho 33" stabilnú platformu. Pridajte psa PFD (záchrannú vestu). Prineste si čerstvú vodu a misku. Začnite 10-minútovými sedeniami a postupne postupne.
  faq:
    - q: Akú veľkosť SUP potrebujem pre svojho psa?
      a: Doska široká 33-34 palcov poskytuje stabilitu pre stredne veľké až veľké psy. Malé psy (pod 10 kg) zvládnu dosky s hmotnosťou 32".+
    - q: Potrebuje môj pes záchrannú vestu?
      a: Áno — aj silní plavci potrebujú psa PFD s rukoväťou na ľahké aportovanie v núdzových situáciách.
    - q: Ako ochrániť dosku pred pazúrmi?
      a: Udržujte psie pazúriky strihané. Používajte chránič alebo uterák na terasu. Psy si zvyčajne zvyknú a prestanú škrabať, keď sa cítia pohodlne.
    - q: Môže sa naučiť každý pesSUP?
      a: Väčšina psov sa môže učiť trpezlivosťou. Úzkostlivé psy môžu trvať dlhšie. Nikdy nenúťte bojazlivého psa na dosku – vytvára to negatívne asociácie.
