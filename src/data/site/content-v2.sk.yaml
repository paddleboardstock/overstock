- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Veľkostný sprievodca: Vysvetlenie dĺžky, šírky a objemu'
  description: Nájdite SUP správnu veľkosť podľa vašej váhy, úrovne zručností a štýlu pádlovania. Dĺžka určuje sledovanie, šírka stabilitu a objem určuje nosnosť.
  definition: SUP Veľkosť je definovaná dĺžkou (rýchlosť a kĺzanie), šírkou (primárna stabilita), hrúbkou (sekundárna stabilita a objem) a objemom v litroch (celková nosnosť).
  tldr: 'CelkovoSUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Surf: 8''-10'' x 30"-32" (140-220L). Začiatočníci potrebujú šírku nad 32" a objem prevyšujúci telesnú hmotnosť o 60-80L. Vaša hmotnosť v kg plus 60L je minimálny objemový cieľ pre stabilitu.'
  problem: SUP Každá značka uvádza dosky v stopách, palcoch a litroch, ale bez toho, aby ste vedeli, ako sa tieto rozmery premietajú do reálneho pocitu, riskujete, že si kúpite dosku, ktorá je naklonená, pomalá alebo neunesie vašu váhu.
  explanation: 'Dĺžka určuje, ako rýchlo sa doska páluje a ako dobre sleduje v priamke. Dlhšie dosky (12''+) kĺžu medzi zábermi a držia čiaru. Kratšie dosky (pod 10'') sa otáčajú ľahko, ale vyžadujú častejšie prepínanie pádlami. Šírka určuje základnú stabilitu — stabilitu v stoji. 30" doska sa začiatočníkom zdá mierne naklonená; 34" pôsobí ako mólo. Hrúbka určuje objem — hrubšia doska pláva vyššie, ale zachytáva viac vetra. Objem v litroch je najlepším ukazovateľom: naložená doska (vy plus vybavenie) by mala v pokoji ponoriť 2-4 palce.'
  solution: 'Prispôsobte rozmery dosky trom faktorom: vaša hmotnosť (určuje minimálny objem), vaša hlavná aktivita (určuje dĺžka) a úroveň zručností (určuje šírku). Pre začiatočníkov vynásobte váhu v kg 2,2, aby ste získali minimálny objem litrov. Pre stredne pokročilé vynásobte 1,8. Pre pokročilých vynásobte 1,4.'
  recommendation: Paddle Board Overstock SUP Explorer 11 s rozmermi 11' x 33" x 6" a objemom 260 litrov vyhovuje väčšine jazdcov až do 100 kg na všestranné pádlovanie. Upgrade na SUP Tour 12 s rozmermi 12' x 31" pre lepšiu rýchlosť a klz.
  faq:
    - q: SUP Akú veľkosť potrebujem vzhľadom na svoju váhu?
      a: 'Pre jazdcov do 70 kg: 10-11'' x 32" (220-260L). Pre 70-90 kg: 11-12'' x 33" (260-300L). Pre 90-110 kg: 11-12'' x 34" (300-350L). Pre viac ako 110 kg: 12'' x 34-36" (350L+).'
    - q: Je dlhšie SUP rýchlejšie?
      a: Áno. Dlhšie dosky majú lepší pomer dĺžky k šírke, čo znižuje odpor vzduchu. 14' touring SUP je pri rovnakom úsilí pádlovania výrazne rýchlejší ako 11' univerzálna doska.
    - q: SUP Aká šírka je stabilná pre začiatočníkov?
      a: 33-34 palcov je ideálne pre začiatočníkov do 90 kg. Pod 32" je potrebná dobrá rovnováha. Nad 34" je to veľmi stabilné, ale pomalšie a ťažšie pádlovať vo vetre.
    - q: Môžem použiť univerzálnu dosku na prehliadky?
      a: Áno, na krátke túry pod 10 km. Na dlhšie vzdialenosti lepšie sleduje špecializovaná turistická doska a efektívnejšie pokrýva vzdialenosti.
