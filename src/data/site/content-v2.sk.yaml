- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: 3mm vs 5mm neoprén (Čo vlastne funguje pri surfovaní v studenej vode)
  description: Rozhodnutie medzi 3 mm a 5 mm neoprénom závisí od teploty vody, nie od teploty vzduchu. Teplotná tabuľka, porovnanie flexibility a hrúbka vás udrží v teple bez obmedzenia pádla.
  definition: 3mm neoprén zvládne vodu do 14-20°C s dobrou flexibilitou. 5mm oblek pokrýva 8-14°C s maximálnym teplom, ale zníženou pohyblivosťou. Voľba je priamym kompromisom medzi teplom a rozsahom pohybu.
  tldr: 3mm neoprény sú určené na vodu 14-20°C a ponúkajú maximálnu flexibilitu. 5mm obleky sú na 8-14°C a uprednostňujú teplo. Vyberajte podľa miestnej teploty vody, nie podľa teploty vzduchu. Ak surfujete naprieč sezónami, vlastnite obe. Ak si môžete kúpiť len jeden, 4/3mm ponúka najlepší kompromis.
  problem: Potrebujete neoprén, ale neviete sa rozhodnúť medzi 3mm a 5mm. 3mm nemusí byť v zime dostatočne teplý a 5mm môže byť príliš hrubý a obmedzujúci na teplejšie dni. Nesprávne odhadnúť znamená buď zimu mrznúť, alebo sa potiť počas jesene.
  explanation: 'Hrúbka neoprénu priamo koreluje s teplom a nepriamo koreluje s flexibilitou. 3mm oblek (často 3/2mm s tenšími rukami) poskytuje dobrú mobilitu na pádlovanie a surfovanie v miernych podmienkach. 5mm oblek používa hrubší neoprén na trupe a často tenšie panely na rukách a nohách (5/4/3mm), aby si zachoval určitú flexibilitu. Teplotný rozdiel je približne 6-8°C. Kľúčové rozdiely: 5mm obleky používajú viac neoprénového materiálu, vážia približne o 40 percent viac, trvajú dlhšie na sušenie a vyžadujú viac námahy na vyzliekanie. Moderné super-stretch neoprenesy zmenšujú flexibilitu, ale 5mm stále výrazne obmedzuje pohyb.'
  solution: Zistite si najchladnejšiu priemernú mesačnú teplotu vody pomocou miestnych údajov o bóji. Ak je nad 16°C, kúpte 3/2 mm. Ak je medzi 12-16 °C, kúpte 4/3 mm. Ak je pod 12 °C, kúpte 5/4/3 mm. Na celoročné surfovanie s jedným oblekom pokrýva najširší rozsah kvalitný 4/3mm s termálnou podšívkou, samostatnou kapucňou, topánkami a rukavicami.
  recommendation: Paddle Board Overstock Wetsuit Pro vo veľkosti 5/4/3mm zvládne 8-16 °C s termálnou podšívkou, ktorá kompenzuje teplotný rozdiel skutočných 5 mm. Ak surfujete najmä v miernych podmienkach (16-20 °C), 3/2 mm Paddle Board Overstock Wetsuit Pro ponúka lepšiu flexibilitu a pohodlie.
  faq:
    - q: Môžem nosiť 3mm vo vode s teplotou 10°C?
      a: Len na veľmi krátke sedenia (20-30 minút) a s termálnym rashguardom pod ňou. Väčšinu tréningu vám bude zima. Odporúča sa 5mm alebo 5/4/3mm na 10°C vodu.
    - q: Je 5mm neoprén príliš teplý na leto?
      a: Ak letná teplota vody presiahne 18°C, 5mm oblek spôsobí prehrievanie. Oblek môžete prepláchnuť studenou vodou, ale počas letných mesiacov sa budete cítiť pohodlnejšie v 3/2mm alebo jarnom obleku.
    - q: Obmedzuje 5mm neoprén pádlovanie?
      a: Áno, citeľne. Hrubší neoprén na ramenách vyžaduje viac námahy na jeden záber. 5/4/3mm oblek s tenšími rukami pomáha, ale stále sa unavíte rýchlejšie ako v 3mm obleku.
    - q: Aký je najlepší neoprén na celoročné surfovanie?
      a: 4/3 mm kompletný oblek so zipsom na hrudi a termálnou podšívkou pokrýva 12-18°C, čo je v mnohých miernych klimatických oblastiach celoročne. Pridajte čižmy na zimu a môžete surfovať 10-18°C s jedným oblekom.
