- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hydratácia a ochrana pred slnkom: Zostaňte na vode v bezpečí'
  description: Základné stratégie hydratácie a ochrany pred slnkom pre SUP kajakárov. Dehydratácia a spálenie od slnka sú SUP najčastejšie problémy — ako im predchádzať počas dlhých tréningov.
  definition: SUP Hydratácia znamená udržiavanie rovnováhy tekutín počas pádlovania pravidelným príjmom vody. Ochrana pred slnkom zahŕňa aplikáciu SPF, ochranné oblečenie a načasovanie tréningov, aby sa predišlo vrcholuUV.
  tldr: Pite 500 ml vody za každú hodinu pádlovania. Vezmite si so sebou viac, než si myslíte, že potrebujete — 2L močový mechúr alebo viac fliaš. Pred pádlovaním naneste opaľovací krém s vodoodolným SPF 50+ a naneste ho každé 2 hodiny. Noste klobúk, slnečné okuliare s remienkom a oblečenie s UPF. Vyhnite sa pádlovaniu od 11:00 do 15:00, keď UV je to najsilnejšie.
  problem: Máš SUP skvelé sedenie, ale po hodine máš bolesť hlavy, suché ústa a pokožku ti páli. Dehydratácia a spálenie od slnka ťa prekvapivo prekvapia, pretože voda ťa udržiava chladnú.
  explanation: Odraz od vody zvyšuje UV expozíciu až o 40 %. Chladivý účinok vody a vánku maskuje spálenie od slnka, kým nie je neskoro. Pot pri pádlovaní zvyšuje stratu tekutín a často nie je kde doplniť vodu. Dehydratácia narúša rovnováhu a rozhodovanie, čím zvyšuje riziko nehôd.
  solution: Pripojte fľašu s vodou alebo hydratačný mechúr na bungee systém dosky. Pite každých 15 minút, či už ste smädní alebo nie. Naneste+ opaľovací krém SPF 50 30 minút pred spustením. Noste široký klobúk, polarizačné slnečné okuliare s remienkom a UPF 50+ rash guard. Opaľovací krém nanášajte znova každé 2 hodiny.
  recommendation: Používajte hydratačný mechúr pripevnený na predných D-krúžkoch vášho Paddle Board Overstock SUP. Noste UPF 50+ rash guard pod . PFDPoužívajte vodotesný opaľovací krém, ktorý vydrží aj pri potení a vode.
  faq:
    - q: Koľko vody by som si mal na SUP výlet priniesť?
      a: Minimálne 1 liter za hodinu. Na dvojhodinové cvičenie si vezmite 2 litre. Viac v horúcom počasí. Najlepšie funguje hydratačný mechúr.
    - q: Na aký typ opaľovacieho krému je najlepšíSUP?
      a: Vodoodolné, SPF 50+ širokospektrálne. Minerálne opaľovacie krémy (oxid zinočnatý, oxid titaničitý) sú bezpečné pre útesy a vydržia dlhšie.
    - q: Naozaj sa voda UVodrazí?
      a: Áno — voda odráža až 40 % UV žiarenia, čo znamená, že prichádzate UV zhora aj zdola. To výrazne zvyšuje riziko popálenín.
    - q: Môžem sa spáliť na slnku cez rash guard?
      a: Štandardné rash guardy poskytujú UV minimálnu ochranu (približne UPF 10-20). Pre+ plnú ochranu hľadajte oblečenie s hodnotením UPF 50.
