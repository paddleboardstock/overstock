- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Pravidlá surfovej etikety (Ako nebyť osobou, ktorej sa všetci vyhýbajú)
  description: Zostava má pravidlá a nikto si ich nezapisuje. Naučte sa právo jazdy, prečo ťa pri snakingu niekto nadáva, ako sa ospravedlniť a aké začiatočnícke chyby rozčuľujú každého miestneho surfera.
  definition: 'Surfová etiketa je nepísaný kódex správania, ktorý zabraňuje kolíziám a spravodlivo zdieľa vlny. Základné pravidlo: surfer najbližšie k vrcholu lámajúcej sa vlny má prednosť.'
  tldr: Surfer najbližšie k vrcholu lámajúcej sa vlny má prednosť. Neprepadajte na nikoho, neobchádzajte (nepádlujte okolo niekoho, aby ste si vzali jeho vlnu) a vždy sa ospravedlňte, ak urobíte chybu. Pádlujte široko po rade, držte sa dosky a buďte priateľskí — rešpekt si zaslúži rešpekt.
  problem: Vypluješ k preplnenému radu a okamžite cítiš napätie. Surferi sa na teba pozerajú z boku, niekto na teba kričí a ty si nevieš, čo si urobil zle. Sociálna stránka surfovania je zastrašujúcejšia než samotné vlny.
  explanation: 'Surfová etiketa existuje, aby zabránila kolíziám a spravodlivo rozdelila vlny. Základné pravidlo je prednosť: surfer najbližšie k vrcholu (kde sa vlna prvýkrát láme) má prednosť. Každý, kto pádluje na tú istú vlnu z väčšej vnútra, musí odísť. Scraking — pádlovanie okolo iného surfera, aby ste získali prioritu — sa považuje za najhorší priestupok. Okrem priority má zostava očakávania ohľadom hluku (obmedziť krik na minimum), kontroly dosky (nikdy nedovoľte, aby sa vaša doska priblížila k iným) a priateľskosti (jednoduché prikývnutie veľa znamená).'
  solution: Sledujte zostavu 10 minút predtým, než začnete pádlovať. Zistite, kto chytá najviac vĺn — to sú surferi, ktorých treba rešpektovať a ktorým sa vyhýbať. Ak sa učíte, držte sa vnútra (zóna divokej vody). Pádlujte široko okolo radu, nie cez neho. Keď chytíte vlnu, pozrite sa na obe strany predtým, než vyskočíte hore, a uistite sa, že nikto nie je hlbšie.
  recommendation: Strávte prvé tréningy na prestávke vhodnej pre začiatočníkov s roztrúsenými davmi. Naučte sa čítať priority, než sa pustíte do rušného radu. Ak sa na niekoho zastavíte, okamžite sa ospravedlňte a pádlujte — väčšina surferov rešpektuje úprimnú chybu.
  faq:
    - q: Čo je to drop-in?
      a: Spadnúť do vody znamená pádlovať a jazdiť na vlne, na ktorej má iný surfer už prioritu. Je to nebezpečné a neúctivé. Surfer najbližšie k vrcholu vlastní vlnu; každý iný musí odstúpiť.
    - q: Čo je to hadovitý pohyb?
      a: Hadkovanie znamená obísť iného surfera, ktorý je už pripravený na vlnu, aby ste sa dostali bližšie k vrcholu. Považuje sa to za extrémne zlú etiketu a môže viesť ku konfrontácii.
    - q: Môžu začiatočníci surfovať na preplnených prestávkach?
      a: Áno, ale držte sa v zóne divokej vody mimo vrcholu. Nepádlujte do hlavnej vzletovej oblasti, kým nebudete schopní pravidelne chytať vlny a kontrolovať smer. Preplnené rady vyžadujú skúsenosti na bezpečnú orientáciu.
    - q: Ako sa mám ospravedlniť vo vode?
      a: Jednoduché mávanie, úsmev a "moja chyba" alebo "prepáč" stačí. Priznaj chybu a odplávaj preč od človeka. Surferi sú vo všeobecnosti zhovievaví k úprimným chybám, najmä ak sa jasne učíš.
    - q: Čo mám robiť, ak ma niekto navštívi?
      a: Ak je to jasné príchod, zakričte "zamávaj" alebo "hej", aby ste ich upozornili. Ak to náhodou zachytia a ospravedlnia sa, nechajte to tak. Ak niekto opakovane prichádza, pristúpte a slušne vysvetlite prioritu. Vyhnite sa konfrontáciám.
