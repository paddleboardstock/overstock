  problem: Prekonávate veľkú vzdialenosť SUP na svojej doske a široký nos vašej dosky vytvára odpor vzduchu a nesleduje rovno.
  explanation: Výtlakový nos rozdeľuje vodu namiesto toho, aby po nej prechádzal, čím sa znižuje odpor predných vĺn. Dlhšia 12' vodná čiara zvyšuje rýchlosť trupu. So šírkou 31" vyvažuje efektivitu so stabilitou. Špecifické prvky pre touring zahŕňajú viacnásobné ploché boxy a bungee nákladnú palubu.
  solution: Nafúkni na 18PSI. Používaj stredovú plutvu na pokojných vodách alebo pridaj bočné zábery pre stabilitu bočného vetra. Výtlaková predná časť a dĺžka 12' vynikajú na otvorenej vode s vlnou.
  recommendation: Za 699 dolárov SUP je Tour 12 najvýhodnejšou nafukovacou turistickou doskou. Kúpte si ju, ak pravidelne prechádzate vzdialenosti. Spárujte ju s Paddle Board Overstock karbónovým pádlom pre najefektívnejšie vybavenie.
  faq:
    - q: Je SUP Tour 12 dostatočne stabilná pre stredne pokročilých?
      a: Áno — šírka 31\" je štandardná pre touring. Začiatočníci môžu nájsť 31\" tippy v porovnaní s 33-34\" univerzálnymi doskami.
    - q: Ako Tour 12 zvláda sekanie?
      a: Veľmi dobre — výtlakový nos prereže malé až stredné vlny bez toho, aby sa podarilo plieskať trupu.
    - q: Môžem použiť Tour 12 na surfovanie?
      a: Neodporúča sa — dĺžka 12' a výtlak nosa spôsobujú, že otáčanie je pomalé. Explorer SUP 11 používajte na jazdu na vlnách.
    - q: Aká dĺžka pádla funguje najlepšie?
      a: 8-10" nad hlavou. Dlhšie pádlo poskytuje páku na dlhé pádlo.
