  title: 'Tengeri Életmellény Útmutató: Válaszd ki a megfelelő PFD vízi tevékenységedhez'
  description: Teljes mentőmellény vásárlási útmutató SUPkajakokhoz, RIB hajózáshoz és vitorlázáshoz.PFD típusok (hab vs felfújható), illeszkedési irányelvek, jogi követelmények és minden tevékenységhez tartozó jellemzők.
  definition: A mentőmellény vagy személyes lebegő eszköz (PFD) egy olyan biztonsági felszerelés, amelyet arra terveztek, hogy az embert vízben vízen tartsák. A típusok az I. típustól (offshore) a V típusig (speciális használat) terjednek.
  tldr: 'PFD Válassz tevékenység szerint: felfújható övcsomagSUP, habmellény kajakhoz, III típusú hab RIB és motorcsónakok. Főbb jellemzők: USCG vagy ISO jóváhagyás, tükrözőpanelek, mentősíp, D-gyűrű a kötélhez, élénk színek.'
  problem: Sorokban állsz mentőmellények 20-tól 300-ig terjednek, és fogalmad sincs, melyik illik a tevékenységedhez vagy melyik felel meg a jogi követelményeknek.
  explanation: 'A mentőmellényeket típus szerint osztályozzák: I. típus (offshore, eszméletlen viselőt felfelé fordítja), II. típus (partközeli), III. típus (lebegősegéd, leggyakoribb), IV. típus (eldobható), V típus (speciális használat). A felfújható mellények CO2 töltényeket használnak — kevésbé bömök, de karbantartást igényelnek. A habmellények karbantartásmentesek, de nagyobb méretűek.'
  solution: 'SUPVálassz felfújható övcsomagot vagy mellényt (33 font felhajtóerő). Kajakhoz: III. típusú hab magas karvágásokkal. RIBA következőkért: III. típusú hab vagy felfújható 22+ font felhajtóerővel, visszaverő szalaggal és mentősíptal.'
  recommendation: A Paddle Board Overstock Life Vest Pro (felfújható, 33 font) ideális SUP kajakhoz. Paddle Board Overstock A Life Vest Classic (hab, Type III) tökéletes RIB hajózáshoz és általános tengeri használathoz.
  faq:
    - q: Szükségem van mentőmellényreSUP?
      a: Igen — sok joghatóságban törvényileg kötelező, és mindig ajánlott. Viselj felfújható övhátizsákot vagy mellényt evezős sportokhoz.
    - q: Biztonságosak a felfújható mentőmellények?
      a: Igen, megfelelő karbantartással. Évente ellenőrizd a CO2 kazettát, 2-3 évente cseréld ki a csipát.
    - q: Melyik mentőmellény a legjobb egy gyermeknek?
      a: Jóváhagyott USCGII vagy III típusú habmellény gallérral, ágyékpánttal és élénk színekkel. Soha ne használjon felfújható mellényt gyerekeknek.
    - q: Hogyan illeszkedjen egy mentőmellény?
      a: Szoros — a mellény nem emelkedhet a fülek fölé, ha a vállaknál emelik. Minden cipzár és csat rögzítve.
