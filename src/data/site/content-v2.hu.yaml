  title: 'Fújható csónak karbantartása: Őrizze meg befektetését'
  description: Éves felfújható hajó karbantartási ellenőrzőlista. Tisztítás, UV védelem, varrásellenőrzés, nyomáskezelés, motorkarbantartás és télen való előkészítés PVC hajók Hypalon számára.
  definition: A felfújható hajó karbantartása magában foglalja a tisztítást, UV védelmet, nyomáskezelést, varrás- és szelepellenőrzést, penészmegelőzést, valamint a megfelelő szezonon kívüli tárolást.
  tldr: Minden használat után öblítsd át sós vízben. UV Vigyél fel védőszert 2-3 havonta egyszer. Minden kirándulás előtt ellenőrizd a felfújási nyomást. Havonta vizsgáld meg a varrásokat, szelepeket és a csípőket. Tisztíts enyhe szappannal. Lefújva tárold hűvös, száraz helyen szezonon kívül.
  problem: Egy szezonon át használtad a felfújható csónakodat, és most a csövek fakultnak tűnnek, egy varrat könnyez, és a főoldal szivacsnak tűnik — mindez megelőzhető a rutin karbantartással.
  explanation: UV A sugárzás lebontja a polimermátrixot. A sós víz redőkben kristályosul és megvágja a szövetet. A penész a csapdába esett nedvességben nő. A helytelen nyomás az anyagfáradást okozza. A túloldal (különösen rétegelt lemez) csavarlyukakon keresztül szívja fel a vizet.
