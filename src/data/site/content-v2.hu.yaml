- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Mit vegyél fel szörfözéshez (Ne tűnj el board rövidnadrágban, ha 5/4-es méretre van szükséged)
  description: Ne találgasd, mit viselj. A víz hőmérséklete határozza meg, nem a levegő hőmérsékletét. Teljes rétegezési útmutató a trópusi kiütésvédőktől a teljes téli 5/4/3 mm-es felszerelésig.
  definition: A szörföltözetek között lehet a deszkarövidnadrágok és rash guard meleg vízben, egészen a teljes 5/4/3 mm-es wetsuit-ig, csizmával és kapucnival hideg vízben. A víz hőmérséklete, nem a levegő hőmérséklete határozza meg, mire van szükséged.
  tldr: A szörfözés közben a víz hőmérsékletétől függ – nem a levegő hőmérsékletétől. A kiütésvédők és a deszkaalsónadrátok 22°C felett használhatók, a rugós ruhák 18-22°C-ot fednek le, a teljes 3/2 mm-es ruha 14-18°C-ot bír, és 5/4/3mm csizmával 14°C alatt szükséges. Mindig UV viselj védőt, és fontold meg a pórázt és ütközőmellényt.
  problem: Megérkezel a partra, és fogalmad sincs, hogy elég-e a kiütésvédő, vagy teljes wetsuit kell-e. A levegő meleg, de a víz hideg, vagy a víz rendben van, de a szél fagyos. Ha rossz öltözködsz, tönkreteszi az edzést.
  explanation: 'A szörfölöztetés három célját szolgálja: hőszigetelés, UV védelem és koplódás megelőzése. A neoprén wetsuit vastagsága és takarása alapján értékelhető — a rugós ruhák (rövid karok vagy lábak) határértékű napokra, a teljes ruhák hideg vízhez. A kiütésvédők védik a deszka kiütését és a napsütést, de nem kínálnak hőhatást. A csizmák, kesztyűk és kapucniak nem kiegészítők, hanem alapvető felszerelések hidegvízi szörfözéshez 12°C alatt.'
  solution: 'Nézd meg a helyi bója vagy élő víz hőmérsékleti jelentést, mielőtt indulsz ki. Készíts egy készletet a leghidegebb tipikus állapotod alapján: kitörő védő és rövidnadrág nyáron, 3/2 mm-es teljes ruha tavasszal és ősszel, 5/4/3mm bakancsmal és kapucnival tére. Mindig tedd hozzá pórázt, és fontold meg a lebegő mellényt a biztonság érdekében.'
  recommendation: Először egy jó 3/2 mm-es teljes ruhába fektess be – az a legszélesebb feltételeket fedi le. Ha télen szörfözni tervezel, adj hozzá egy 5/4/3mm-es ruhát és bakancsot. A Paddle Board Overstock Wetsuit Pro hőburkolózással hatékonyan hidalja át mindkét hőmérséklet-tartományt.
  faq:
    - q: Szörfözhetek csak board shortban?
      a: Igen, trópusi vízben 24°C felett. Érdemes lehet egy kiütésvédőt, hogy megakadályozd a mellkasi és kar dörzsölését a evezés során. Viasz vagy egy tapadópárna a deszkán segít kompenzálni a ruha tapadás hiányát.
    - q: Szükségem van szörfcsizmára?
      a: Ha a víz hőmérséklete 14°C alá esik, a csizma megakadályozza a zsibbadást, és megvédi a lábadat a kövektől és zátonyoktól. Emellett tapadást is biztosítanak a deszkán. Az északi éghajlaton élő legtöbb szörfös novembertől márciusig használ bakancsot.
    - q: Mi az a tavaszi öltöny?
      a: A rugós ruha egy rövid karú vagy rövid szárú wetsuit (vagy mindkettő), amelyet 18°C és 22°C közötti vízre terveztek. Több meleget kínál, mint a rash guard, de kevesebb fedőt, mint egy teljes öltöny.
    - q: Szörfözés közben kellene felvennem?
      a: Nem hagyományos mentőmellények, de egy ütközőmellény vagy úszósegéd segíthet nehéz körülmények között vagy gyenge úszó esetén.Paddle Board Overstock A mentőmellényeket SUP kajakozásra tervezték, de extra lebegőbiszülést nyújthatnak a szörfözés kezdőknek.
