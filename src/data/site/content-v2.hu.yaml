- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP Fitnesz: Teljes testedzés egy lapozódeszkán'
  description: SUP Teljes testes edzést kínál, amely ötvözi a kardiovaszkuláris állóképességet, törzsstabilitást és az erőt. Hogyan SUP szervezzük a fitneszedéseket, a legjobb gyakorlatokat és a fejlődés mérését.
  definition: SUP A fitnesz egy lapozódeszka instabil platformját használja arra, hogy a törzsstabilizátorokat, lábizmokat és felsőtest mozgatása evezéssel, egyensúlyozással és deszkaalapú gyakorlatokkal foglalkozzon.
  tldr: SUP óránként 400-700 kalóriát éget el. Egy SUP egyórás edzés törzset, lábakat, hátat, vállakat és karokat dolgoztat. Az intervallum evezés (sprint + , regenerálódás) maximalizálja a kardiót. A jóga pózok a deszkán építik az egyensúlyt és a hajlékonyságot. SUPHozzátesznek hozzá -specifikus erőgyakorlatokat, mint a guggolás és a kitörés a táblán.
  problem: Az edzőterem edzések unalmassá váltak, és olyan szabadtéri tevékenységre van szükséged, ami közben szórakoztató is fittséget épít.SUP A kalandot és az igazi testszintű kondicionálást ötvözi.
  explanation: Az evezés a latissimus dorsi, a deltoidok, trapéziusz és törzsizmok mozgását indítja a forgatáshoz. Mozgó platformon állva folyamatosan dolgozni kényszeríti a boka, a térd és a csípő stabilizmát. A folyamatos evezés közepes intenzitású kardiovaszkuláris igényei aerob kondíciót biztosítanak.
  solution: 'Szerkezeti gyakorlatok: 5 perc bemelegítő evezés, 20 perc stabil evezés mérsékelt tempóban, 15 perc intervallum evezés (30 másodperc sprint, 60 másodperc könnyű), 10 perc deszka gyakorlatok (guggolás, kitörés, fekvőtámasz), 5 perc hűtési nyújtás.'
  recommendation: Az Paddle Board Overstock SUP Explorer 11-et használd fitneszevezéshez. Az stabil platform lehetővé teszi, hogy a technikára és az intenzitásra koncentrálj. Viseld a Life Vest Pro-t a biztonság érdekében a nagy intenzitású edzések során.
  faq:
    - q: Hány SUP kalóriát éget?
      a: 400-700 kalória óránként az intenzitástól, széltől és áramlattól függően. Az intervallum evezés növeli a kalóriaégetést.
    - q: SUP Jó a fogyáshoz?
      a: Igen, a megfelelő táplálkozással együtt. A teljes testhez való bekapcsolódás és alacsony terhelésű természet fenntarthatóvá teszi a rendszeres mozgást.
    - q: Tudok erőnléti edzést végezni aSUP?
      a: Igen — gugggolók, kitörések, fekvőtámaszok és deszka a táblán egyensúlyi kihívást jelentenek az erőmozdulatokhoz.
    - q: Milyen SUP izmok működnek?
      a: 'Első: törzs (ferde, kereszthasz), hát (lats, csapdák), vállak (deltoidok), karok (bicepsz, tricepsz). Szekszis: lábak (quads, comb, vádli).'
