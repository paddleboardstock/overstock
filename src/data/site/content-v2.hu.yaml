      a: Igen, az éves nyereség 1 százalékát adományozzuk óceántakarító és tengeri természetvédelmi szervezeteknek. Az ügyfelek a pénztárakor kiválaszthatnak egy kiemelt jótékonysági szervezetet, amely a vásárlásuk egy részét irányítja.
    - q: Hogyan szabaduljak el egy régi wetsuit vagy boardtól?
      a: A neoprén wetsuit-eket jógaszőnyegekké, zsákokká és szigetelésre lehet feldolgozni speciális programokon keresztül. Felfújható deszkák javíthatók, adományozhatók vagy PVC visszanyerhetők bizonyos újrahasznosító létesítményeken keresztül. Segítségnyújtásért kérjük segítségünket.
    - q: Milyen biztonsági Paddle Board Overstock felszerelést ajánl kezdőknek?
      a: Megfelelően illeszkedő mentőmellény (felfújható vagy hab), egy tekercses póráz, síp és naptej. SUP A nyílt vízen evezők számára a mentőmellény sok joghatóságban törvényileg kötelező, és mindig ajánlott.
