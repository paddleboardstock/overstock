- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Hidegvízi szörfözés felszerelés útmutató (Szörfözz télen át szenvedés nélkül)
  description: 'Ne hagyd, hogy hideg víz véget vet a szezonodnak. Teljes hidegvíz felszerelés részletezése: wetsuit vastagsága, bakancs és kesztyű választéka, kapucni, valamint azok a kiegészítők, amelyek igazán élvezetessé teszik a téli alkalmakat.'
  definition: A hidegvízi szörfözéshez teljes wetsuit (5/4/3 mm vagy vastagabb), bakancs, kesztyű és kapucni. 12°C alatt minden hideg vízzel érintkező pont védelemre szorul, hogy elkerüljék a zsibbadást, a hipotermia és a biztonsági kockázatokat.
  tldr: A hidegvízi szörfözéshez teljes 5/4/3mm vagy 6/5/4mm kapucnis wetsuit szükséges, 5mm-es csizmát, 3mm-es kesztyűt és kapucnit. A varrás minősége fontosabb, mint a márka — keress ragasztott és vakvarrásozott (GBS) varrásokat. A termikus bevonatú öltöny jelentős melegséget ad extra vastagság nélkül. Mindig vigyél magaddal tartalék termikus rétegeket és termoszt a kezelés utáni felépüléshez.
  problem: Télen akarsz szörfözni, de a hideg víz 15 perc után elzsibbasztja a lábad, a kezed nem tudják megfogni a deszkát, és a ruhád minden evezéskor végighúzza a fagyos vizet a hátadra. Megfelelő felszerelés nélkül a hidegvízes edzések rövidek és nyomorúak.
  explanation: 'A hidegvízi szörfözés (12°C alatt) többet igényel, mint egy vastag wetsuit esetében. Minden hidegvel érintkező pont védelmet igényel: a csizma megakadályozza a lábzibbadást és véd a zátonyvágásoktól, a kesztyű megőrzi a kéz funkcióját evezéshez, a kapucni pedig megakadályozza a legrosszabb hőveszteséget (a fejed a testhő 30%-át sugározza). A wetsuit vastagságát a leghidegebb hónaphoz kell igazítani, nem az átlaghoz. A ruhán túl olyan kiegészítők, mint a lezárt talpú csizmák és előre ívelt ujjú kesztyűk javítják a kényelmet és a tartósságot.'
  solution: 'Építs egy hidegvíz-készletet ebben a sorrendben: 5/4/3mm vagy 6/5/4mm teljes öltöny GBS varrásokkal és mellkascipzárral, 5 mm-es bakancs gumitalpkal, 3mm-es kesztyű (a kesztyűk melegebbek, mint az ujjak), és egy 3mm-es kapucni, ami a ruha gallérja alá búj. A parkolóban cserélőköntöst adj hozzá méltóságért és melegségért.'
  recommendation: A Paddle Board Overstock 5/4/3 mm-es Wetsuit Pro beépített termikus béléssel képes a legtöbb hidegvízi körülményeket 8°C-ig kezelni. Párosítsd 5 Paddle Board Overstock mm-es csizmával és 3 mm-es kesztyűvel a teljes hidegvíz beállításért. 8°C alatt lépj fel 6/5/4 mm-es kapucnis öltönyre.
  faq:
    - q: Tényleg szükségem van kapucnira?
      a: Igen. A fejedben a testhő 30 százalékát veszíted el. A kapucnis megakadályozza a kipirulást és melegen tartja a nyakadat. A 3 mm-es kapucni több meleget ad, mint ha 5 mm-ről 6 mm-re lépnél a törzs vastagsága.
    - q: Milyen vastagságú csizmára van szükségem?
      a: Vízhez 8-12°C-os csizmáknál használj 5mm-es bakancsot. 12-16°C-nál 3mm-es bakancs elegendő. 8°C alatt fontold meg 7mm-es csizmát, vagy neoprén zoknit vegyél 5mm-es bakancs alá.
    - q: Hogyan állítsam meg, hogy a wetsuit kipiruljon?
      a: Az öblítés akkor történik, amikor víz jut be a nyakba, csuklón vagy bokába a ruhába. A mellkas-zipzáros bejárati kialakítás jelentősen csökkenti a hát kiöblülését. A nyak és boka tépőzáras zárolásai szintén segítenek, de a legjobb megoldás egy jól illeszkedő öltöny GBS varrattal.
    - q: Használhatok egy 3 mm-es ruhát hideg vízben extra rétegekkel?
      a: Egy 3 mm-es öltözet neoprén mellényrel körülbelül 3-4°C-val növelheti a hatótávolságot, de nem helyettesíti a megfelelő 5/4/3mm vagy 5 mm-es ruhát. A rétegezés rövid alkalmakra a határvonalas körülmények között működik a legjobban.
