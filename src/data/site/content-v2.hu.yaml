    - q: Milyen gyakran érdemes kezelni UV Protectant-tal?
      a: A használati időszakban 2-3 havonta alkalmazzák. Trópusi éghajlatokon gyakrabban fordulnak elő.
    - q: Le kell eresztenem a hajómat használatok között?
