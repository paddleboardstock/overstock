  title: 'SUP Horgonyvezető: Maradj helyben horgászat vagy fotózás közben'
  description: Teljes útmutató SUP a rögzítéshez — horgonytípusok (gomba, összecsukható, karó), horgonykocsi beállítása, kinyitási technikák és biztonsági szempontok a helyben tartáshoz.
  definition: A SUP horgony egy kötélre rögzített súly, amely a deszkát a szél és áramlat ellen tartja helyén. Gyakori típusok közé tartoznak a gombahorgonyok, összecsukható horgonyok és a kilátó rudak.
  tldr: Használjon gombahorgongot (1,5-3 font) sáros vagy homokos fejekhez, összecsukható horgongot sziklás fejekhez, vagy megfigyelő rúdot sekély vízhez, puha aljú vízhez. A horgonynak 1,5-3 font kell legyen nyugodt körülmények között, 3-5 font szél és áramlat esetén. Mindig használj horgonykocsit a pozíció beállításához és a kiengedéshez.
  problem: Megtalálod a tökéletes horgászhelyet, de a szél és az áramlat néhány percenként eltérít a pozíciótól. Horgonyzás nélkül a SUP horgászat és a fényképezés frusztráló gyakorlat a folyamatos helyváltás során.
  explanation: A horgony úgy működik, hogy áthúzza az alját, amíg el nem akad. A gombahorgonyok puha aljába fúródnak, és jó tartást biztosítanak a homokban és a sárban. A hajtogatható horgonyoknál olyan fölgyek vannak, amelyek kemény vagy sziklás aljába ásnak. A kilátó rudak sekély vízben is működnek, közvetlenül a fenékbe nyomva.
  solution: Szerelj egy horgonykocsirendszert (egy kötélt, amelynek egyik oldalán csúszógyűrű van), hogy igazítsd a rögzítési pontot. Csatolj 50-75 láb kötelet a horgonyhoz. Vezess irányba a kívánt pozícióban a szél felé vagy felfelé áramlatot. Vészhelyzetekben használj gyorskioldó rendszert a leválasztáshoz. Soha ne horgonyozz erős áramlatban vagy olyan helyen, ahol a horgonyt nem lehet könnyen kihúzni.
  recommendation: Egy 3 fontos összecsukható horgony, 50 láb kötéllel a legtöbb SUP horgászathoz megfelel. Adj hozzá egy horgonykocsi rendszert az Explorer Paddle Board Overstock SUP 11-ed D-gyűrűivel.
  faq:
    - q: Milyen méretű horgonyra van SUPszükségem?
      a: 1,5-3 font nyugodt tavakhoz és lassú folyókhoz. 3-5 font a tengerparti területeken, ahol szél vagy áramlat van. A túlméretezett horgonyokat nehéz kihozni.
    - q: Mennyi horgonykötélre van szükségem?
      a: Az 5:1-es távcső (5 láb zsinór minden 1 láb mélységre) alapértelmezett. 10' vízben használj 50' zsinórt.
    - q: Veszélyes a rögzítés egy SUP?
      a: Csak akkor, ha áramot vagy szélet rögzítesz, ami elég erős ahhoz, hogy felboruljon a deszka. Mindig használj gyorskioldó rendszert, amit azonnal le lehet venni.
    - q: Tudok bármilyen vízben horgonyozni?
      a: Ellenőrizze a helyi szabályozásokat. Néhány területen korlátozzák a horgonyzást a tengeri fű vagy tengeri élőhelyek védelme érdekében. Soha ne horgonyozz korallzátonyokon.
