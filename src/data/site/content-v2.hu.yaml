  title: 'SUP Méret útmutató: Hosszúság, szélesség és térfogat magyarázata'
  description: Találd meg a megfelelő SUP méretet a súlyod, a tudásszinted és az evezési stílusod alapján. A hossz határozza meg a nyomkövetést, a szélesség a stabilitást, a térfogat pedig a súlykapacitást.
  definition: SUP A méretet a hossz (sebesség és csúszás), szélesség (elsődleges stabilitás), vastagság (másodlagos stabilitás és térfogat), valamint literben terjedő térfogat (teljes tömegkapacitás) határozza meg.
  tldr: 'ÖsszesítettSUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Túra: 12''-14'' x 30"-32" (280-350L). Szörfös: 8''-10'' x 30"-32" (140-220L). A kezdőknek szélességre van szükségük 32 hüvelyen, és a testsúly 60-80L-rel meghaladó térfogatra. A súlyod kg-ban plusz 60L-ben a minimális volumencél a stabilitás érdekében.'
  problem: Minden SUP márka láb-, hüvelyk és liter méretben sorolja fel a deszkákat, de ha nem tudnád, hogyan fordítják vissza ezek a méretek a valós hangulatra, kockáztatod, hogy olyan deszkát veszel, ami borcsó, lassú vagy nem bírja a súlyodat.
  explanation: 'A hossz határozza meg, milyen gyorsan eveződik a deszka és mennyire jól követi egyenes vonalat. A hosszabb deszkák (12''+) csúsznak a mozdulatok között és tartanak egy vonalat. A rövidebb deszkák (10'' alatt) könnyen fordulnak, de gyakoribb lapátkapcsolót igényelnek. A szélesség határozza meg az elsődleges stabilitást — az állóállást. Egy 30" deszka kezdőknek borúsnak tűnik; a 34" olyan, mint egy dokk. A vastagság határozza meg a térfogatot — a vastagabb deszka magasabban úszik, de több szelet fog. A térfogat literben a legjobb mérőszám: a megterhelt deszka (te plusz fogaskerék) nyugodtságban 2-4 hüvelyk mélyen merül el.'
  solution: 'Párosítsd az asztal méretét három tényezővel: a súlyoddal (a minimum térfogatot határozza meg), a fő tevékenységeddel (a hosszt határozza meg), és a tudásszintdel (a szélességet). Kezdőknek szorozd meg a súlyt kg-ban 2,2-vel, hogy a minimális litert kapd. A köztes ételeknél szorozd 1,8-kal. Halasabb példánynál szorozd 1,4-re.'
  recommendation: Az Paddle Board Overstock SUP Explorer 11 11' x 33" x 6" méretű, 260 literes méretű, a legtöbb versenyzőnek megfelel akár 100 kg-ig is az összetett evezéshez. Frissíts SUP Tour 12-re 12' x 31" méretben, hogy jobb túrasebességet és siklást kapjon.
  faq:
    - q: Milyen SUP méretre van szükségem a súlyomhoz?
      a: '70 kg alatti versenyzőknek: 10-11'' x 32" (220-260L). 70-90 kg esetén: 11-12'' x 33" (260-300L). 90-110 kg magasnak: 11-12'' x 34" (300-350L). 110 kg felett: 12'' x 34-36" (350L+).'
    - q: SUP Hosszabb, gyorsabb?
      a: Igen. A hosszabb deszkák jobb a hossz-szélesség aránya, így csökken a légellenállás. Egy 14' túra SUP jelentősen gyorsabb, mint egy 11' összetett deszka ugyanazzal az evezési erőfeszítéssel.
    - q: Milyen SUP szélesség stabil kezdőknek?
      a: 33-34 hüvelyk a legjobb pont kezdőknek 90 kg-ig. 32" alatt jó egyensúly szükséges. 34" felett nagyon stabil, de lassabb és nehezebb evezni szélben.
    - q: Használhatok egy mindenoldalú deszkát túrázáshoz?
      a: Igen, rövid, 10 km alatti túrákhoz. Hosszabb távoknál egy dedikált túra a túra jobban pályázik és hatékonyabban fedik meg a távolságot.
