  title: 'Lapáttábla méret útmutató: térfogat, hossz és szélesség minden versenyzőnél'
  description: Teljes méretezés a súly és aktivitás szerinti mennyiségajánlásokkal. Tartalmaz egy könnyen használható mérettáblázatot az összetett, túra, szörfözés és jóga SUP deszkákhoz.
  definition: Az eveződeszka méretét a térfogat (tömegkapacitás és lebegő), hossz (sebesség és nyomkövetés), szélesség (stabilitás) és vastagság (térfogateloszlás és szélellenállás) határozza meg.
  tldr: 'A súlyt használjuk a minimális térfogat meghatározására: 50-70 kg 220-260 litert, 70-90 kg 260-300 litert, 90-110 kg 300-350 litert, 110+ kg 350+litert. Kezdőknek adj hozzá 20%-ot ezekhez a számokhoz. A szélesség számít: 32" középkategóriás, 33-34" kezdőbarát, 35"+ nagyon stabil.'
  problem: Az eveződeszka méretlistáknál felcserélve használják a lábakat, hüvelykeket és litereket, ami megnehezíti a márkák összehasonlítását.
  explanation: A térfogat a legközvetlenebb mérőszám a teherbírással — 1 liter édesvíz 1 kg súlyt vált ki. Egy 260 literes deka elméletileg elbírja a 260 kg-ot, de a gyakorlati kapacitás alacsonyabb, mert a deszka a víz felett kell ülnie. A teljes súlyod (test plusz fogaskerék) a deszka térfogatának 30-40%-a kell, hogy legyen.
  solution: Cél térfogat = (testsúly kg-ban, + fogaskerék súlya kg-ban) x 3. Egy 75 kg-os evezős 5 kg-os felszereléssel célpont = 80 x 3 = minimum 240 liter. Kezdőknek szorozni 3,5-tel. Haladóknál szorozza meg 2,5-tel.
  recommendation: Paddle Board Overstock SUP Az Explorer 11 (260L, 11' x 33" x 6") a legtöbb 50-100 kg-os motorosnak megfelel. A könnyebb versenyzők méretet AirDeck is a 270-eshez igazíthatnak. A nehezebb versenyzőknek érdemes a SUP Tour 12-t (300L+) vagy szélesebb deszkákat választani.
  faq:
    - q: Számít a magasság a SUP méret szempontjából?
      a: A magasság kevésbé számít, mint a súly. Egy magas, könnyű, könnyebb lovasnak kevesebb volumenre van szüksége, mint egy alacsony, nehézebb lovasnak. A súlyt használd elsődleges volumenmeghatározóként.
    - q: Mi történik túl nagy volumennel?
      a: A deszka túl magasan ül, és úgy kapja a szeletet, mint egy vitorla. Vágásban korkás érzés. Kezdőknek azonban a plusz volumen jobb, mint túl kevés.
    - q: Mi történik túl kevés hangerővel?
      a: A deszka túl mélyen ül, ami ellenállást okoz. Az orr evezés közben elmerülhet (gyöngyszemelés). Gyorsan elfáradsz, ha részben víz alatt lévő deszkát evezsz.
    - q: A felfújható deszkáknak más méretre van szüksége, mint a keménytábláknak?
      a: Nem jelentősen. A 15 fokos felfújható gépek+ PSI hasonlóan kiszorítják a vizet, mint a keménydeszkák. A térfogat ajánlások mindkét típusra egyformán érvényesek.
