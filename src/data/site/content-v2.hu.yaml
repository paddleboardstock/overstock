- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm wetsuit: Mi hibázik a legtöbb kezdő hideg vízben'
  description: Ne fagyj meg a játék közepén vagy a tengerparton való túlmelegedést. A valódi különbség a 3 mm-es és 5 mm-es wetsuit között — hőmérséklet-táblázat, rugalmassági kompromisszumok, és mi működik valójában a hidegvízi szörfözéshez.
  definition: A wetsuit egy neoprén ruhadarab, amely vékony vízréteget zár a bőrön, amelyet a testhő melegít szigetelésként. A vastagság (3mm, 5mm) határozza meg, milyen hőmérsékleti tartományt bír a ruha — a vastag melegebb, de kevésbé hajlékony.
  tldr: A nevvárruhák vastagsága közvetlenül határozza meg a melegséget és a rugalmasságot. Használj 3 mm-et 16°C feletti vízhez, 5 mm-et pedig 8°C és 16°C közötti vízhez. A vastagabb öltönyök korlátozzák a mozgást, de tovább tartanak melegen — mindig a szabást a márkával előtérbe helyezzük.
  problem: Nyitsz egy online boltot vagy belépsz egy szörfboltba, és látod, hogy 3/2, 4/3, 5/4 és 5mm teljes öltönyként szerepelnek. A számok nem sokat jelentenek, amíg rá nem jössz, hogy a rossz vastagság vagy a játék közepén fagy, vagy túlmelegszik és izzadsz a tengerparton.
  explanation: A wetsuits úgy működik, hogy egy vékony vízréteget zár a bőröd és a neoprén között; a tested melegíti ezt a vizet, így szigetelést hoz. A vastagabb neoprén több vizet fog, de korlátozza a rugalmasságot és a felhajtóképességet. Egy 3mm-es öltözet (gyakran 3/2 vékonyabb karokkal) enyhe körülményekhez ill, míg az 5mm-es (5/4/3 vagy teljes 5mm) hideg vízhez illeszkedik. A mellkaszáros bejáratok jobban záródnak, mint a hátsó cipzár, és csökkentik a kipirulást. A varrás szerkezet — ragasztott és vakvarrás (GBS) — a különbség a szivárgó és a meleg öltöny között.
  solution: Igazítsd a vastagságot a helyi vízhőmérsékletedhez 5°C-os hibahatárral. Mérsékelt éghajlathoz vegyél 3/2 mm-est. Hideg vízhez vegyél 5/4/3 mm-est. Adj hozzá csizmát, kesztyűt és kapucnit, hogy további 5°C-kal növeld a hatótávolságodat lefelé. Próbáld ki öltönyt vásárlás előtt, vagy válassz olyan márkát, amelynek bőséges visszaküldési politikája.
  recommendation: A Paddle Board Overstock 5/4/3 mm-es Wetsuit Pro ideális a legtöbb hidegvízi szörfösnek, GBS varrásokat és termikus bélést kínál. Ha meleg vízben szörfözöl 20°C felett, a mellkaszárral ellátott 3/2 mm jobb választás.
  faq:
    - q: Milyen vízhőmérsékletre van szükség 5 mm-es wetsuitre?
      a: A vízhőmérséklet 8°C és 14°C között 5 mm-es öltönyt igényel. 8°C alatt 6/5/4 mm-es kapucnis ruha kell. 14°C és 18°C között a 4/3 mm jól működik a legtöbb embernek.
    - q: Viselhetek 3 mm-es wetsuit télen?
      a: Csak enyhe téli éghajlaton, ahol a víz 16°C felett marad. Igazi téli szörfözéshez 5 mm vagy 5/4/3 mm szükséges. A csizmák, kesztyű és a kapucni megfelelő melegséget adnak anélkül, hogy vastagabb törzset kellene igényelnének.
    - q: Mennyire szűknek kell lennie egy wetsuitnek?
      a: Szoros, de nem korlátozó. Nem lehet légzsebek vagy laza neoprén. Ha az ujjat a bőröd és a deréknél lévő ruhák közé csúsztathatod, az túl laza. Ha nehéz a légzés, vagy a mozgás erősen korlátozott, méretet növeld.
    - q: A drága wetruhák melegebbé tesznek?
      a: A magasabb ár gyakran jobb neoprén (mészkőalapú kőolajhoz képest), jobb varrásszerkezetet (GBS vagy csak ragasztott), valamint jobb hajlékonyságot. Ezek a tényezők közvetlenül befolyásolják a meleget és az élettartamot, de csak akkor, ha a megfelelő illeszkedés.
