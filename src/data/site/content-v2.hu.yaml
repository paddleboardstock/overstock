- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard vs shortboard (az őszinte válasz, amit senki sem ad)
  description: A longdeszkák több hullámot kapnak; a shortdeckek keményebben fordulnak. Az igazi kérdés az, melyik illik a képességeidhez és a helyi breakekhez. Őszinte összehasonlítás, amely a stabilitást, a hullámszámot és a fejlődési csapdát foglalja magában.
  definition: A longboardok (9 láb) +a stabilitást és a hullámfogást helyezik előtérbe; a shortdeck (5-7 láb) a manőverezhetőséget és a teljesítményt helyezi előtérbe meredek hullámoknál. A helyes választás a tudásszintedtől és a helyi hullámtípusoktól függ.
  tldr: A longboardok (9 láb+) stabilak, könnyen fogják a hullámokat, és alkalmasak kezdőknek és a hullámzásra orientált szörfösöknek. A shortboardok (5-7 láb) gyorsabbak, gyorsabbak a hullámfalon, és jól állnak a haladó szörfösöknek. A megfelelő választás a tudásszintedtől, hullámtípusodtól és attól függ, mit szeretsz a legjobban a szörfözésben.
  problem: Láthatsz videókat, ahol szörfösök éles kanyarokat végeznek shortboardokon, és longboardosok kecsesen siklanak az orruk mentén — mindkettő szórakoztatónak tűnik. Csak egy deszkatípusra van költségvetésed, és tudnod kell, melyik stílus illik a céljaidhoz és a helyi szünetekhez.
  explanation: 'A longdeszkák nagyobb felülettel rendelkeznek, ami azt jelenti, hogy gyorsabban eveznek, korábban fogják el a hullámokat, és stabil alapot biztosítanak a sétákhoz és keresztlépésekhez. Kiválóak a kis, lassú hullámokban, ahol egy shortboard elsüllyedne. A shortboardok kevesebb térfogatúak, és agresszívebb a rocker, így mélyebbre süllyedhetnek a hullámfalba, sebességet termelnek a kanyarokban, és meredek, üreges szakaszokba illeszkednek. A shortdeckekhez erős evezés és precíz hullámidő mérés szükséges. Egy gyakori tévhit: a shortdeckek nem "jobbak" — egyszerűen különböző eszközök, különböző körülményekhez és tudásszintekhez.'
  solution: Ha kezdő vagy, legalább 6 hónapig üssz longboardot (vagy nagy volumenű felfújható deszkát). Ha középszintű vagy, és a helyi hullámok gyakran kicsik és lassúak, egy longboard vagy hibrid több hullámot fog, és szórakoztatóbb lesz. Ha a hullámaid meredekek, üregesek és gyorsak, szükség lesz egy shortboardra, hogy beleférjen a zsebbe. Sok középhaladó szörfös mindkettőt tartja meg, és a nap alapján választ.
  recommendation: Kezdd a Paddle Board Overstock Surfboard Pro-val, mint a longboard stílusú platformot. Ha következetesen kanyarodsz és sebességet generálsz, fontold meg hibrid vagy shortboard hozzáadását meredek hullámok napjaira. A legtöbb szörfös, aki túl korán próbál shortboardozni, frusztrált lesz, és kevesebb hullámot utaz.
  faq:
    - q: Könnyebb a longboardot vezetni, mint a shortboardot?
      a: Sokkal könnyebb. A longboardok korábban kapják el a hullámokat, gyorsabban eveznek, és stabilabbak a felpattanó és trim-ek során. A shortboardokhoz pontos időzítés, erősebb evezés és jobb hullámítélet szükséges.
    - q: Lehet hosszú deszkán fordulni?
      a: Igen, bár a stílus más. A longboard kanyarok szélesebbek, simábbak, és az egész testet lekötik. Az orr lovaglás, a visszavágások és a hang-five-ok a longboard-specifikus manőverek, amelyek saját képességfejlődéssel rendelkeznek.
    - q: Melyik lap a jobb kis hullámokhoz?
      a: A longdeszkák és a hibridek jobban teljesítenek kis, gyenge hullámokban, mert siklást generálnak és megőrzik a lendületet. A shortboardoknak meredekebb, erősebb hullámokra van szükségük a teljesítményhez.
    - q: Nehezebb egy shortboard evezni?
      a: Jelentősen nehezebb. Az alacsonyabb térfogat azt jelenti, hogy a deszka alacsonyabban ül a vízben, ami nagyobb ellenállást okoz. A shortboard evezése olyan, mintha egy drag cute-val úsznék, mint egy hosszú deszkával evezni.
