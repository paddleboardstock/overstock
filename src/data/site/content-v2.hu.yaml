- slug: surfboard-size-guide
  category: guide
  type: buying-guide
  title: Szörfdeszka méret útmutató (a térfogat a lényeg)
  description: Ne találgasd a szörfdeszka méreteket. A térfogat literben mindent meghatároz — milyen könnyen fogod el a hullámokat, milyen stabilnak érzed magad, és milyen gyorsan haladsz előre. Találd meg a céllitereid 2 perc alatt.
  definition: A szörfdeszka mérete elsősorban a térfogatra (literre) vonatkozik, nem a hosszra. A térfogat határozza meg a lebegő és hullámfogási képességet. A hosszabb deszkák gyorsabban eveznek; a szélesebb deszkák stabilabbak; a vastagabb deszkák nagyobb térfogatot kínálnak hossz nélkül.
  tldr: 'A szörfdeszka mérete a térfogatról szól, nem csak a hosszról. A kezdőknek 60-80 literre, a középkategóriáknak 35-55 literre, a haladó szörföseknek pedig 20-35 literre van szüksége. A súlyodat használd elsődleges tényezőként: minden 10 kg-nál körülbelül 10-12 liter térfogatra van szüksége kezdő szinten.'
  problem: Egy szörfdeszkák állva állsz, amelyen például 7'2" x 22" x 3" számok vannak nyomtatva, fogalmad sincs, milyen érzés ezek a méretek a vízben. Ha a kinézet vagy a barátod által lovagoló alapján vásárolsz, az a deszkát vagy túl instabil, vagy túl nehéz evezni.
  explanation: 'A szörfdeszka mérete három dimenzión keresztül érthető: hossz (evező és hullámfogás), szélesség (stabilitás) és vastagság (térfogat és lebegés). A valódi számító szám a térfogat literekben. A habdeszkák és felfújható deszkák a szélesség és vastagság révén nagy volument érnek el, nem pedig túl hosszú hosszúságon, így kezdők számára kezelhetőek lesznek. Ahogy fejlődsz, csökkented a térfogatot, hogy a deszka mélyebbre süllyedjen a hullámfalba és érzékenyebben forduljon.'
  solution: 'Use a volume-to-weight calculator: for beginners, divide your weight in kg by 1.5 to get target liters. For intermediate, divide by 2. Intermediates should look for boards with moderate rocker and a squash or round tail for versatility.'
  recommendation: The Paddle Board Overstock Surfboard Pro offers 75 liters of volume in a 10'6" package — ideal for beginners up to 90 kg. Lighter riders can size down to the SUP Tour 12 for a more maneuverable feel as they progress.
  faq:
    - q: Does height matter for surfboard size?
      a: Height matters less than weight. A tall, light surfer needs less volume than a short, heavy surfer of the same height. Use weight as your primary metric and adjust for fitness and paddle strength.
    - q: What happens if my board has too much volume?
      a: Too much volume makes the board feel corky and unstable on the wave face. You will struggle to sink the rail for turns and may bounce off the water during bottom turns.
    - q: What happens if my board has too little volume?
      a: You will struggle to paddle into waves, sink too deep on the takeoff, and feel unstable just sitting on the board waiting. Beginners almost always need more volume than they think.
    - q: How do I know when to size down?
      a: When you can consistently catch waves, pop up smoothly, and make basic turns on your current board, it is time to drop 5-10 liters. Sizing down too early slows your progress.
