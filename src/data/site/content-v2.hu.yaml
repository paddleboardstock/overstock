- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Fújható SUP tárolás: a megfelelő módja az iSUP tárolásának'
  description: Megfelelő felfújható SUP tárolás megakadályozza a delaminációt, UV károsodást, penészt és szelepszivárgást. Téli tárolás, hosszú távú tárolás és napi tárolási tippek a drop-stitch deszkákhoz.
  definition: A felfújható SUP tárolás azt jelenti, hogy a deszka tiszta, száraz, hőmérséklet-szabályozott környezetben tartja távol UVa szélsőséges hőmérsékletektől és a fizikai sérülésektől.
  tldr: Hűvös, sötét helyen, 30°C alatti helyen, távol a közvetlen napfénytől. Rövid távon (1-2 hét) részben felfújva 8-10 fokon PSItárold. Hosszú távú tároláshoz teljesen leengedd, lazán guríts, és tedd a tárolózsákba. Soha ne tárold nedvesen. Kerüld a rágcsálókat és az éles tárgyakat.
  problem: Leszívod a SUP készüléket, és egy forró garázsba vagy nedves pincébe tömöd. Három hónappal később sárga lett PVC , a teraszpárna lehámlik, és a szelep szivárog. A helytelen tárolás nagyobb kárt okoz, mint a normál használat.
  explanation: 50°C feletti hő miatt PVC a plaszítók elvándorolnak, ami merevvé és törékenysé teszi az anyagot.UV A sugárzás lebontja a polimer kötéseket. A bennük rekedt nedvesség penészt okoz. Fagypont alatti hideg törékenyné PVC teszi a gesztiget. A szoros hajtogatás nyomáspontjai tartós ráncokat hoznak létre.
  solution: 'Rövid távú tárolás: öblítsd le, szárítsd meg, felfújd 10 PSIfokig, és tárold a föld felett árnyékos helyen. Hosszú távú tárolás: alaposan tisztíts, teljesen száríts, teljesen leereszted, tekerd a teraszpárnával kifelé, tedd be zacskóba, tárold hűvös száraz szekrényben. Kerüld a vegyszereket és a kártevőket.'
  recommendation: A Paddle Board Overstock hordótáskát használd tárolásra — az UV blokkolja és megakadályozza a karsolást. Tárold egy klímaellenes helyiségben. Adj hozzá egy szárító csomagot a táskába a párás környezethez.
  faq:
    - q: Tárolhatom a SUP felfújt gépet a garázsban?
      a: Csak akkor, ha a garázs 30°C alatt marad, és nincs közvetlen napfény. A legtöbb garázs nyáron meghaladja a 40°C-ot.
    - q: Tároljam SUP a táskában?
      a: Igen, a zsák megvédi a UVportól és a fizikai sérülésektől. Győződj meg róla, hogy a deszka teljesen száraz legyen a zsákolás előtt.
    - q: Kárt okozhat a fagyasztás egy felfújható SUPgépnek?
      a: Igen. Fagypont alatt törékeny PVC lesz, és megrepedhet, ha feltekered vagy felfújjuk. Mindig 5°C felett tárolj.
    - q: Hogyan tegyem fel a SUP tárolóhoz?
      a: Úgy gurulj úgy, hogy a fedélzet párnát kifelé nézve, hogy megvédd az aljátPVC. Kerüld a szoros ráncosokat. Minden alkalommal váltogasd a hajtogatási pozíciót.
