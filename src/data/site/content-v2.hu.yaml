- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Önmentés: Hogyan kerülj vissza a tábládra mélyvízben'
  description: Minden SUP evezőnek el kell tanulnia az önmentést. Lépésről lépésre végzett technikák a deszkát mély vízbe való visszaszerelésére, a partra vontatására, és a póráz gusabzainak kezelésére.
  definition: SUP Az önmentés az a technika, amellyel a lapátboardot mély vízben vissza kell szerelni, miután leesik, beleértve a deszka visszaszerzését, a test visszahelyezését és az evező visszaszerzését.
  tldr: 'Zuhanás után: maradj nyugodt, tartsd meg a lapát, ússz a deszkához. Helyezd az evezőt a deszkára. Használj delfinrúgást, hogy a mellkasod a deszkára tolj. Lendíts fel az egyik lábat, aztán a másikat. Először térdelj le, aztán állj fel. Gyakorolj nyugodt vízben, amíg el nem jön az izommemória.'
  problem: SUP Leesel a mély vízben, és nem tudsz visszaszállni. A deszka csúszós, fáradt vagy, és pánik tör be. Az önmentési technika ismerése nélkül egy egyszerű esés veszélyessé válik.
  explanation: 'Az önmentésnek három szakasza van: a felépülés (úszás a deszka és evezés), vissza kell szállni (vissza a deszkára jutni), és folytatás (folytatni az evezést). A kulcstechnika az evező stabilizátorként való használata, és erős lábrúgásokkal, hogy a felsőtest a deszkára tolja.'
  solution: '1. szakasz: ússz a deszkához. Tartsd meg az evezőt vagy vedd vissza. 2. szakasz: tedd az evezőt merőlegesen a deszkára. Rúgd erőteljesen a lábaidat, miközben a mellkasot a deszka közepére húzod. 3. szakasz: amint a mellkasod a deszkán van, egyenként lendítsd fel a lábakat. 4. szakasz: térdelj, levegőhöz jutni, majd fokozatosan állj fel.'
  recommendation: Gyakorold az önmentést kontrollált körülmények között, amíg gondolkodás nélkül meg nem tudod csinálni. Használd az Paddle Board Overstock SUP Explorer 11-et, ami jó tapadást nyújt a fedélzeten. A Life Vest Pro extra lebegést ad, ha nehézségeid vannak.
  faq:
    - q: Hogyan juthatok vissza, ha kimerült vagyok?
      a: Maradj a deszkával a lebegéshez. Használd a karjaidat, hogy a mellkasot a deszkára húzd, még akkor is, ha a lábad nem tudnak hatékonyan rúgni. Pihenj térdelő helyzetben, mielőtt felállsz.
    - q: Mi van, ha elveszítem az evezőt?
      a: Használj karokat, hogy evezd a deszkát a partra. Kérj segítséget egy másik evezőt. Azonnal cseréld ki az elveszett lapát.
    - q: Hullámokban tudok önmentést csinálni?
      a: Igen — helyezd a deszkát merőlegesen a hullámokra. Időzítsd az újraszerelést hullámok között. A póráz közel tartja a deszkát.
    - q: Hogyan kezelem a póráz-összetűzést?
      a: Maradj nyugodt, lebegj a hátadon, lassan oldd ki a pórázt. Ha a póráz a uszonyokra van tekerve, vízben lehet, hogy el kell távolítanod az uszonyokat.
