  title: 'Wetsuit ápolás: Tedd a neoprén kétszer tovább tartani'
  description: A megfelelő wetsuit gondozás 1 évszakról 3-ra +hosszabbítja az élettartamot. Neoprén wetsuit öblítése, szárítása, tárolás és javítási tippek. Kerüld el a gyakori hibákat, amelyek idő előtt tönkreteszik a wetsuiteket.
  definition: A neszkondús ruhák ápolása minden használat után friss vízzel öblítést, közvetlen napfénytől való szárítást, laposan vagy széles függőre akasztva tárolást, valamint időszakos tisztítást jelenti a só, baktériumok és szagok eltávolítására.
  tldr: Minden kezelés után öblítsd be a wetsuit-et belülről és kívül friss vízzel. Szárítsd ki belülről az árnyékban egy széles műanyag vállfán. Tárold laposan vagy hajtogatva hűvös, száraz helyen. Soha ne hagyd a wetsuit-et közvetlen napfény, forró autók vagy szárítók előtt. Használj wetsuit sampont minden 5-10 alkalommal.
  problem: Egy szezon után a wetsuit szagát érzet, a neoprén elvesztette a rugalmasságot, a varrások lehámlnak, és a cipzár is megáll — mind megelőzhető megfelelő gondossággal.
  explanation: A sókristályok beágyaszkodnak a neoprénbe, és megbobzzák az anyagot. A baktériumok szaporodnak a nedves belső térben, szagokat termelnek és lebontják a neoprént.UV Lebontja a nejlon bevonatot. Az 50°C feletti hő lebontást okoz. A helytelen szárítás torzítja a neoprent és megterheli a varrásokat.
  solution: 'Minden alkalom után: öblítsd alaposan belülről és kívülről, fordítsd kifelé a fejt, és függess széles, műanyag függesztőre árnyékban. Ha megszáradt, fordíts jobbra kifelé, és tárold síkkal. Minden 5-10 alkalommal: mosd meg wetsuit samponnal. Havonta kend meg a cipzárt szipot zipzár viasztal.'
  recommendation: Paddle Board Overstock Használj Wetsuit sampont tisztításhoz, és Paddle Board Overstock cipzár viaszot a cipzár karbantartásához. Paddle Board Overstock Tartsd a széles vállfán a hálózsákban.
  faq:
    - q: Be tudom tenni a wetsuitemet a mosógépbe?
      a: Nem ajánlott — a mosás károsítja a neoprént. Ha muszáj, használj kegyes ciklust, hideg vizet és hálózsákot.
    - q: Hogyan szabadítsam ki a szagot a nefrányruhámból?
      a: Áztasd hűvös vízben wetsuit samponnal vagy fehér ecettel 30 percig. Öblítsd alaposan le.
    - q: Hogyan szárítsam meg a wetsuitomat?
      a: Fordítsd ki az árnyékban egy széles, párnázott műanyag vállfán. Kerüld a közvetlen napsütést és a fém vállfákat.
    - q: Javíthatok egy szakadt wetsuit-t?
      a: Az 1\" alatti kis szakadások neoprén cementtel és folttal javíthatók. A nagyobb szakadások szakemberrel javításra szorulhatnak.
