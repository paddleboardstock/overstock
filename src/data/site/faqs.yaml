faqs:
  - q: Does Paddle Board Overstock provide OEM/ODM services for inflatable water sports equipment?
    a: >-
      Yes. Weihai Dongjilian Co., Ltd. (New Mexico, USA), the brand company operating the
      Paddle Board Overstock Qingdao Manufacturing Hub, offers full-scale
      OEM and ODM customization — from 3D blueprints and drop-stitch material
      selection to bulk production for global brands. We handle private labeling,
      custom packaging, and compliance documentation for BSCI, CE, and other certifications
  - q: What certifications does Paddle Board Overstock hold for inflatable boat manufacturing?
    a: >-
      Paddle Board Overstock's factory is ISO 9001 certified and 64 of our
      product models are CE certified. We also hold BSCI social compliance certification
      required by major European and North American retailers. REACH and RoHS
      compliance available on request.
  - q: What is the minimum order quantity (MOQ) for OEM inflatable paddle boards?
    a: >-
      MOQ starts at 5–10 units for standard OEM paddle board models. Custom molds
      and private-label projects require a minimum of 200 units depending on
      complexity. We offer flexible MOQ structures for trial orders and new brand
      launches.
  - q: Which materials does Paddle Board Overstock use for inflatable boat and SUP production?
    a: >-
      We use marine-grade PVC (0.9 mm—1.2 mm) with double-layer drop-stitch
      core for SUPs, and reinforced PVC or Hypalon for RIB and dinghy tubes.
      Materials are sourced from reputable suppliers and tested for tensile
      strength, UV resistance, and low-temperature flexibility before production.
  - q: Can Paddle Board Overstock handle large-volume wholesale orders for international buyers?
    a: >-
      Yes. Our 12,000 m² factory produces 15,000 boats annually with a
      dedicated team of 200-300 skilled workers. We ship to 50+ countries and
      manage logistics including FOB Qingdao, CIF major ports, and door-to-door
      delivery through our freight partners.
  - q: What is the lead time for OEM inflatable kayak and SUP production?
    a: >-
      Standard OEM production lead time is 30—45 days from sample approval.
      Custom mold projects typically take 60—90 days including 3D prototyping,
      mold fabrication, and sample validation. Rush orders available for
      established partners with confirmed material stock.
  - q: Does Paddle Board Overstock supply military-grade drop-stitch material for paddle boards?
    a: >-
      Yes. Our drop-stitch core uses military-spec PVC fabric with tensile
      strength exceeding 2000 N/5cm. The double-layer lamination process
      achieves air-holding retention at 15 PSI with less than 2% pressure loss
      over 24 hours — exceeding ISO 6185 requirements for air-holding integrity.
  - q: How does Paddle Board Overstock ensure the air-tightness and UV resistance of its inflatables?
    a: >-
      Every inflatable tube undergoes a 24-48-hour pressure-hold test at 1.25x
      rated PSI before shipment. UV resistance is validated via 1000-hour
      accelerated weathering (ASTM G154) with less than 10% tensile strength
      degradation. Our PVC compound includes UV stabilizers and anti-oxidant
      additives for long-term outdoor durability.
  - q: Can Paddle Board Overstock help with packaging design and private-label branding?
    a: >-
      Yes. We offer turnkey private-label packaging: custom-designed retail
      boxes, hang tags, instruction manuals, and shipping cartons with your
      brand artwork. Our in-house design team can develop full-brand visual
      identity for new market entrants — from logo application to unboxing
      experience.
  - q: Does Paddle Board Overstock accept factory audits from international buyers?
    a: >-
      Absolutely. We welcome on-site and third-party factory audits including
      BSCI, SMETA, and customer-specific social compliance inspections. Our
      12,000 m² facility is audit-ready with documented QC processes, material
      traceability, and worker health & safety records. Virtual factory tours
      available for initial qualification.
  - q: What is the drop-stitch technology used in Paddle Board Overstock SUP boards?
    a: >-
      Drop-stitch is a fabric construction where thousands of polyester threads
      connect the top and bottom PVC layers. When inflated to 12—15 PSI, these
      threads pull the panels to a fixed distance, creating a rigid, flat
      platform. Paddle Board Overstock uses fusion-laminated drop-stitch — where threads are
      thermally bonded into the PVC — for superior delamination resistance vs.
      traditional glue-bonded cores.
  - q: Is SUP hard to learn?
    a: >-
      Not at all. Most beginners stand up and paddle within their first session.
      Our All-Around SUP series features extra-wide stable platforms designed
      specifically for first-time paddlers. Start on calm water and you will be
      cruising in minutes.
  - q: Can I use it in the ocean?
    a: >-
      Yes. Paddle Board Overstock SUP boards are built for ocean, lake, and river use. Our
      Touring series handles coastal chop, and all boards use marine-grade PVC
      that resists saltwater corrosion. Rinse with fresh water after ocean use.
  - q: How long does it take to inflate?
    a: >-
      With the included dual-action pump, most boards inflate to 12—15 PSI in
      under 5 minutes. Our electric pump option cuts that to under 2 minutes.
      Deflation and packing take about 3 minutes.
  - q: Can I travel with an inflatable SUP?
    a: >-
      Absolutely. Every Paddle Board Overstock board packs into a backpack-sized carrying
      case designed for travel. At just 18-22 lbs packed, it fits in most airline
      checked-baggage allowances — check your carrier's size and weight limits before travel.
  - q: What is the weight limit?
    a: >-
      Our All-Around SUPs support up to 220 lbs. The Touring and Yoga series
      support up to 250 lbs. For tandem use or heavier loads, our Kayak and
      Dinghy products offer higher capacity options.
  - q: What comes in the box?
    a: >-
      Every Paddle Board Overstock SUP includes the board, a travel backpack, dual-action
      hand pump, removable fin, coil leash, and repair kit. Some models also
      include a carbon paddle upgrade option.
  - q: Do you offer bundle deals?
    a: >-
      Yes. We offer curated bundles like the Explorer Starter Pack and Family
      Fun Pack that save you up to $198 compared to buying items separately.
      Browse all bundles at the Bundle Deals page.
