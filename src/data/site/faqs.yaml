faqs:
  - q: What is the drop-stitch technology used in Paddle Board Overstock SUP boards?
    a: >-
      Drop-stitch is a fabric construction where thousands of polyester threads
      connect the top and bottom PVC layers. When inflated to 12—15 PSI, these
      threads pull the panels to a fixed distance, creating a rigid, flat
      platform. Paddle Board Overstock uses fusion-laminated drop-stitch — where threads are
      thermally bonded into the PVC — for superior delamination resistance vs.
      traditional glue-bonded cores.
  - q: How strong is the drop-stitch material in Paddle Board Overstock SUP boards?
    a: >-
      Very strong. Our drop-stitch core uses military-spec PVC fabric with tensile
      strength exceeding 2000 N/5cm. The double-layer lamination process
      achieves air-holding retention at 15 PSI with less than 2% pressure loss
      over 24 hours.
  - q: Which materials does Paddle Board Overstock use in its inflatable SUP boards?
    a: >-
      We use marine-grade PVC (0.9 mm—1.2 mm) with a double-layer drop-stitch
      core. Materials are sourced from reputable suppliers and tested for tensile
      strength, UV resistance, and low-temperature flexibility before production.
  - q: How does Paddle Board Overstock ensure the air-tightness and UV resistance of its SUP boards?
    a: >-
      Every board undergoes a 24-48-hour pressure-hold test at 1.25x
      rated PSI before shipment. UV resistance is validated via 1000-hour
      accelerated weathering testing with less than 10% tensile strength
      degradation. Our PVC compound includes UV stabilizers and anti-oxidant
      additives for long-term outdoor durability.
  - q: Is SUP hard to learn?
    a: >-
      Not at all. Most beginners stand up and paddle within their first session.
      Our All-Around SUP series features extra-wide stable platforms designed
      specifically for first-time paddlers. Start on calm water and you will be
      cruising in minutes.
  - q: Can I use it in the ocean?
    a: >-
      Yes. Paddle Board Overstock SUP boards are built for ocean, lake, and river use. Our
      Touring series handles coastal chop, and all boards use marine-grade PVC
      that resists saltwater corrosion. Rinse with fresh water after ocean use.
  - q: How long does it take to inflate?
    a: >-
      With the included dual-action pump, most boards inflate to 12—15 PSI in
      under 5 minutes. Our electric pump option cuts that to under 2 minutes.
      Deflation and packing take about 3 minutes.
  - q: Can I travel with an inflatable SUP?
    a: >-
      Absolutely. Every Paddle Board Overstock board packs into a backpack-sized carrying
      case designed for travel. At just 18-22 lbs packed, it fits in most airline
      checked-baggage allowances — check your carrier's size and weight limits before travel.
  - q: What is the weight limit?
    a: >-
      Our All-Around SUPs support up to 220 lbs. The Touring and Yoga series
      support up to 250 lbs. Check each product page for the exact rider
      capacity of your board.
  - q: What comes in the box?
    a: >-
      Every Paddle Board Overstock SUP includes the board, a travel backpack, dual-action
      hand pump, removable fin, coil leash, and repair kit. Some models also
      include a carbon paddle upgrade option.
  - q: Do you offer bundle deals?
    a: >-
      Yes. We offer curated bundles like the Explorer Starter Pack and Family
      Fun Pack that save you up to $198 compared to buying items separately.
      See our Products page for current bundle offers.
