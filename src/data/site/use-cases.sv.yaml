cases:
  - id: beginner
    title: Nybörjarpaddling
    desc: Stabila uppblåsbara SUP-brädor för nybörjare i paddling.
    scenario: En familj som besöker en sjö för helgen vill prova på stand up-paddling. De behöver stabil utrustning som är lätt att sjösätta och tydlig säkerhetsvägledning.
    solution: SUP Explorer 11 ger bredkroppsstabilitet för nybörjare. Life Vest Classic säkerställer CE-certifierad flytförmåga. Oars & Pump Set blåser upp brädan på under 10 minuter.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Resor och utforskning
    desc: Långdistans uppblåsbara SUP-brädor för sjöar, floder och kustområden.
    scenario: En friluftsälskare planerar en veckolång paddlingstur och behöver en bräda som packas liten, blåses upp på lägret och går rakt på öppet vatten.
    solution: Ocean Voyager Series glider effektivt med en touringprofil och håller kurs i vind och vågor. Dess drop-stitch-konstruktion fylls till 15 PSI för hårdbräderigitet.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga & Fitness
    desc: Extra-breda, stabila plattformar för yoga, träning och avkoppling.
    scenario: En yogautövare vill ha en flytande studio för morgonsessioner på lugnt vatten, med tillräckligt med däckutrymme för att kunna hålla varje position.
    solution: Flowing Lotus Series har en hel längd däckdyna och en bred skrovbredd för stabila positioner utan vackling. Den fungerar också som en stabil plattform för lätta träningsövningar.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Familjeunderhållning
    desc: Kompletta SUP paket för helgdagar vid sjön och semestrar.
    scenario: En familj på fyra vill ha stabila brädor för helgutflykter till sjön och strandsemestrar — utrustning som får plats i bilen och fylls på några minuter.
    solution: Tropical Breeze Series är en stabil allroundbräda som hela familjen kan dela på, medan Medusa Glow Series är lättare och kortare för barn. Båda får plats i ryggsäckar för enkel resning.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
