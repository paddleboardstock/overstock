cases:
  - id: beginner
    title: 'Vattensport för nybörjare'
    desc: 'Stabila SUP-brädor och kajaker för förstagångsanvändare.'
    scenario: >-
      'En familj som besöker en sjö över helgen vill prova ståpaddling. De behöver stabil, lättsjösatt utrustning med tydliga säkerhetsanvisningar.'
    solution: >-
      'SUP Explorer 11 ger bred stabilitet för nybörjare. Life Vest Classic säkerställer CE-certifierad flytförmåga. Dubbelverkande pumpen blåser upp båda brädorna på under 10 minuter.'
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 'Friluftsliv och utforskning'
    desc: 'Bärbara kajaker och båtar för älvar, sjöar och kustturer.'
    scenario: >-
      'En friluftsentusiast planerar en veckolång älvfärd och behöver en båt som packas liten, blåses upp vid lägret och hanterar varierande strömmar.'
    solution: >-
      'Kayak Lite ryms i en ryggsäck och blåses upp på under 4 minuter. Dess drop-stitch-konstruktion hanterar sjöar, lugna älvar och kustpaddling.'
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: 'Professionell drift'
    desc: 'Kommersiella RIB för turoperatörer och räddningstjänst.'
    scenario: >-
      'En kustturoperatör behöver en flotta hållbara båtar för dagliga turer i varierande sjöförhållanden som uppfyller kommersiella säkerhetsföreskrifter.'
    solution: >-
      'RIB 330 och RIB 450 Patrol har glasfiberskrov med djup V och Hypalon-tuber för hållbarhet i alla väder. Flera enheter kan sättas in med konsekvent prestanda.'
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: 'Familjerekreation'
    desc: 'Rymliga båtar för dagsturer, fiske och vattensport.'
    scenario: >-
      'En familj på fyra vill ha en stabil båt för helgturer på sjön, fiskeutflykter och att bogsera en tube för barnen.'
    solution: >-
      'AirDeck 360 tar upp till fem personer med ett förstärkt luftdäck. Den blåses upp vid sjösättningen, ryms i bilen och hanterar både lugna sjöar och skyddade kustvatten.'
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
