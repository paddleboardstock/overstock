origin:
  tagline: Asal Usul Kami
  heading: |-
    Dibangun di atas air,<br />
    <span class="text-sky-600">didorong oleh tujuan</span>
  paragraphs:
    - 'Aquafarer dimulai di sebuah bengkel di pesisir dengan satu perahu dan keyakinan yang keras kepala: produk laut harus dirancang seolah-olah mereka penting — karena memang begitu.'
    - Para pendiri kami, dua arsitek kapal, melihat sebuah industri di mana pemotongan dilakukan, bahan diturunkan kualitasnya, dan keselamatan dianggap sebagai kotak centang. Mereka membangun lambung Aquafarer pertama bukan untuk keuntungan, tetapi untuk membuktikan bahwa peralatan laut yang terjangkau juga bisa benar-benar dapat diandalkan.
    - Lambung pertama itu masih digunakan hingga hari ini. Prinsip itu tidak pernah berubah.
    - Kami bukan produsen terbesar. Kami tidak membuat produk termurah. Tetapi setiap lambung yang keluar dari bengkel kami melewati tangan yang sama yang memulai perusahaan — dan memenuhi standar yang sama yang ditetapkan oleh lambung pertama.
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: Aquafarer lokakarya pesisir
philosophy:
  tagline: Filosofi Kami
  heading: Berasal dari laut
  description: Samudra bukanlah tempat kerja kita. Samudra adalah guru kita. Setiap keputusan desain dimulai dengan memahami bagaimana air berperilaku, bagaimana kondisi berubah, dan bagaimana peralatan harus merespons.
  cards:
    - emoji: 🌊
      title: Hormati Air
      description: Air itu tidak dapat diprediksi. Produk kami dirancang untuk kondisi terburuk, bukan yang terbaik. Jika lambung kapal dapat menangani arus deras, itu akan mampu menangani danau. Jika jaket pelampung berfungsi di lepas pantai, itu terlalu dirancang untuk sungai — dan itu memang disengaja.
    - emoji: 🔧
      title: Dibuat untuk Tahan Lama, Bukan untuk Diganti
      description: Produk yang paling berkelanjutan adalah yang tidak perlu diganti. Konstruksi PVC, Hypalon, dan drop-stitch kelas laut dipilih untuk daya tahan. Kami masih mengirimkan suku cadang untuk lambung yang kami buat sepuluh tahun yang lalu.
    - emoji: 🏆
      title: Dapat Diakses Berdasarkan Desain
      description: Olahraga air seharusnya bukan kemewahan. Kami merancang produk yang memberikan kinerja tingkat profesional dengan harga yang masuk akal bagi keluarga, pemandu, dan operator kecil — bukan hanya armada komersial.
design:
  tagline: Filosofi Desain
  heading: |-
    Dirancang untuk tepi<br />
    <span class="text-sky-600">dari kondisi</span>
  paragraphs:
    - Setiap produk Aquafarer dimulai dengan satu pertanyaan:<em>apa kondisi terburuk yang akan dihadapi ini?</em>Kami merancang dari tepi ke dalam, bukan dari pusat ke luar.
    - Inti drop-stitch kami diukur untuk 15 PSI — bukan karena 12 PSI tidak cukup untuk sebuah danau, tetapi karena papan 15 PSI menangani gelombang tiba-tiba tanpa melengkung. Tabung Hypalon kami ditentukan untuk ketahanan UV kelas komersial — bukan karena setiap pelanggan mendayung di tropis, tetapi karena degradasi UV adalah penyebab utama kegagalan prematur.
    - Kami tidak merancang berdasarkan titik harga. Kami merancang berdasarkan titik kegagalan — lalu membangunnya jauh di atasnya.
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: Aquafarer desain dan rekayasa
  stats:
    - value: '15'
      label: PSI inti<br />peringkat
    - value: 1,500+
      label: UV jam<br />teruji
