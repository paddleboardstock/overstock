business_model:
  tagline: Model Bisnis Kami
  heading: Stok berlebih, dijual langsung ke pabrik
  paragraphs:
    - Paddle Board Overstock menjual papan tiup baru SUP dengan harga stok berlebih dan diskon — hingga 60% dari ritel biasa. Kami mengambil stok surplus dan kelebihan dalam volume, lalu meneruskan penghematan tersebut kepada para pendayung dan pengecer kecil.
    - 'Selain penjualan eceran, kami melayani pengecer kecil dengan grosir model campuran: pesan 5–20 papan, campur model apa saja dalam satu pengiriman, dan bayar tingkat grosir untuk jumlah total. Setiap pesanan dikirim langsung dari Weihai, China.'
sourcing:
  tagline: Dari Mana Stok Berlebih Kami Berasal
  heading: Sumber campuran, satu standar kualitas
  paragraphs:
    - 'Inventaris kami berasal dari dua sumber: batch produksi surplus dari operasi manufaktur kami sendiri di Weihai, dan inventaris berlebih terpilih yang berasal dari mitra produksi lain yang kami audit dan ajak bekerja sama langsung.'
    - Setiap papan yang kami jual adalah baru dan belum terpakai. Overstock merujuk pada harga — bukan kondisinya.
manufacturing:
  tagline: Latar Belakang Manufaktur Kami
  heading: Dibangun di Weihai sejak 2012
  paragraphs:
    - Kami telah memproduksi papan tiup SUP di Weihai, Shandong sejak tahun 2012. Fasilitas produksi kami seluas 12.000 m² menghasilkan 15.000 unit tiup per tahun dengan tim berjumlah 200–300 pekerja dan 14+ insinyur R&D.
    - 'Satu prinsip desain tidak berubah sejak papan pertama: kami merancang sampai titik kegagalan, lalu membangun jauh di atasnya.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock gedung pabrik di Weihai
  stats:
    - value: '2012'
      label: Manufaktur sejak
    - value: 12.000 m²
      label: Fasilitas produksi
    - value: 15,000
      label: Unit per tahun
    - value: 14+
      label: Insinyur R&D
inspection:
  tagline: Bagaimana Kami Memeriksa Setiap SUP Papan
  heading: Setiap papan diuji, bukan diambil sampelnya
  paragraphs:
    - Setiap SUP papan diuji tekanan 100% pada tekanan 1,25x dari tekanan yang dinilai selama 24–48 jam sebelum disetujui untuk dijual. Papan yang gagal tidak akan pernah dikirim.
    - 99,3% dewan lolos inspeksi akhir pada percobaan pertama. Sisa bagian diperbaiki atau disisihkan — tidak pernah didiskon dalam pesanan.
why_prices_lower:
  tagline: Mengapa harga kami lebih rendah
  heading: Ekonomi overstock, bukan pemotongan
  paragraphs:
    - 'Harga kami lebih rendah karena alasan struktural: kami menjual stok berlebih dan stok surplus langsung dari Weihai, tanpa markup ritel, tanpa lapisan distributor, dan tanpa biaya showroom.'
    - Papan-papan itu sendiri memiliki kualitas produksi penuh — inti yang sama drop-stitch , kelas kelautan yang samaPVC, pengujian yang sama seperti harga ritel penuh.
shipping_network:
  tagline: Jaringan Pengiriman Internasional Kami
  heading: Angkutan udara ekspres atau laut konsolidasi
  paragraphs:
    - Pesanan dikirim dari Weihai, Tiongkok. Pengiriman udara ekspres membawa sampel dan 1–3 pesanan papan; Pengiriman laut konsolidasi melayani 5–20 pesanan grosir papan ke 50+ negara.
    - Setiap penawaran mencakup estimasi transit untuk tujuan Anda, serta faktur komersial dan daftar pengemasan yang diperlukan untuk proses bea cukai.
  cards:
    - title: Ekspres Pengiriman Udara
      description: Untuk sampel dan pesanan 1–3 papan — pengiriman cepat ke pintu Anda, harga bervariasi sesuai tujuan.
    - title: Pengiriman Laut Konsolidasi
      description: Untuk pesanan grosir 5–20 papan — pengiriman hemat biaya ke pelabuhan utama, harga bervariasi sesuai tujuan.
warranty_support:
  tagline: Garansi & Dukungan Pelanggan
  heading: Garansi SUP 2 Tahun untuk setiap papan
  paragraphs:
    - Setiap papan dikirim dengan Garansi SUP 2 Tahun. Jika terjadi cacat yang tercakup dalam periode garansi, hubungi tim dukungan kami dan kami akan memperbaikinya.
    - Dukungan ditangani oleh tim yang sama yang mengelola pesanan Anda. Hubungi kami kapan saja melalui formulir kontak atau dengan membalas konfirmasi pesanan Anda.
