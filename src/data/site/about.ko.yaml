origin:
  tagline: 우리의 기원
  heading: |-
    물 위에 지어진,<br />
    <span class="text-sky-600">목적에 의해 움직이는</span>
  paragraphs:
    - 'Aquafarer는 한 척의 배와 한 가지 고집스러운 믿음을 가지고 해안가 작업장에서 시작했습니다: 해양 제품은 중요하게 여겨져야 하므로 중요하게 설계되어야 한다 — 왜냐하면 그것은 실제로 중요하기 때문입니다.'
    - 우리의 설립자 두 명의 해양 건축가는 모서리를 자르고, 재료를 저급화하며, 안전을 단순한 체크박스로 취급하는 산업을 보았습니다. 그들은 이익을 위해서가 아니라, 저렴한 해양 장비도 진정으로 신뢰할 수 있음을 증명하기 위해 첫 번째 Aquafarer 선체를 만들었습니다.
    - 그 첫 번째 선체는 오늘날에도 여전히 운용 중입니다. 그 원칙은 결코 변하지 않았습니다.
    - 우리는 가장 큰 제조업체가 아닙니다. 우리는 가장 저렴한 제품을 만들지도 않습니다. 하지만 우리 작업장을 떠나는 모든 선체는 회사를 시작한 그 손을 거치며—그리고 최초 선체가 세운 동일한 기준을 충족합니다.
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: Aquafarer 해안 작업장
philosophy:
  tagline: 우리의 철학
  heading: 바다에 뿌리를 둔
  description: 바다는 우리의 작업장이 아니다. 바다는 우리의 스승이다. 모든 디자인 결정은 물이 어떻게 움직이는지, 조건이 어떻게 변하는지, 장비가 어떻게 반응해야 하는지를 이해하는 것에서 시작된다.
  cards:
    - emoji: 🌊
      title: 물을 존중하세요
      description: 물은 예측할 수 없습니다. 우리의 제품은 최상의 조건이 아닌 최악의 조건을 위해 설계되었습니다. 선체가 급류를 견딜 수 있다면 호수에서도 견딜 수 있습니다. 구명조끼가 연안에서 작동한다면, 그것은 강에서는 과도하게 설계된 것이며 — 이것은 의도적인 것입니다.
    - emoji: 🔧
      title: 교체가 아니라 오래 사용하도록 제작됨
      description: 가장 지속 가능한 제품은 교체할 필요가 없는 제품입니다. 장수명을 위해 해양 등급 PVC, Hypalon, drop-stitch 구조가 선택됩니다. 우리는 10년 전에 제작한 선체용 예비 부품도 여전히 배송합니다.
    - emoji: 🏆
      title: 설계상 접근 가능
      description: 수상 스포츠는 사치품이 되어서는 안 됩니다. 우리는 가족, 가이드, 소규모 운영자가 합리적인 가격에 전문 수준의 성능을 제공하는 제품을 설계하며, 단지 상업용 함대만을 위한 것이 아닙니다.
design:
  tagline: 디자인 철학
  heading: |-
    엣지를 위해 설계됨<br />
    <span class="text-sky-600">조건의</span>
  paragraphs:
    - 모든 Aquafarer 제품은 한 가지 질문에서 시작됩니다:<em>이것이 직면할 최악의 상황은 무엇인가요?</em>우리는 중심에서 바깥으로가 아니라, 가장자리에서 안으로 설계합니다.
    - 우리의 drop-stitch 코어는 15 PSI로 평가됩니다 — 12 PSI가 호수에 충분하지 않아서가 아니라, 15 PSI 보드는 갑작스러운 파도에도 휘어지지 않기 때문입니다. 우리의 Hypalon 튜브는 상업용 등급의 UV 저항을 위해 지정됩니다 — 모든 고객이 열대 지방에서 노를 젓기 때문이 아니라, UV 열화가 조기 손상의 1위 원인이기 때문입니다.
    - 우리는 가격 기준으로 설계하지 않습니다. 우리는 실패 기준으로 설계한 다음, 그보다 훨씬 높게 구축합니다.
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: Aquafarer 디자인 및 엔지니어링
  stats:
    - value: '15'
      label: PSI 코어<br />평가
    - value: 1,500+
      label: UV 시간<br />테스트됨
    - value: 10yr
      label: 선체<br />수명
