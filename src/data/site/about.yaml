origin:
  tagline: 'Our Origin'
  heading: "Built on the water,<br />\n<span class=\"text-sky-600\">driven by purpose</span>"
  paragraphs:
    - 'Aquafarer started in a coastal workshop with one boat and a stubborn belief: marine products should be engineered like they matter — because they do.'
    - 'Our founders, two naval architects, saw an industry where corners were cut, materials were downgraded, and safety was treated as a checkbox. They built the first Aquafarer hull not for profit, but to prove that affordable marine gear could also be genuinely reliable.'
    - 'That first hull is still in service today. That principle never changed.'
    - 'We are not the biggest manufacturer. We do not make the cheapest products. But every hull that leaves our workshop passes through the same hands that started the company — and meets the same standard that first hull set.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Aquafarer coastal workshop'

philosophy:
  tagline: 'Our Philosophy'
  heading: 'Rooted in the ocean'
  description: 'The ocean is not our workplace. It is our teacher. Every design decision starts with understanding how water behaves, how conditions change, and how gear must respond.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respect the Water'
      description: 'Water is unpredictable. Our products are engineered for the worst conditions, not the best. If a hull can handle a riptide, it will handle a lake. If a life vest works offshore, it is over-engineered for a river — and that is intentional.'
    - emoji: "\U0001F527"
      title: 'Built to Last, Not to Replace'
      description: 'The most sustainable product is the one that does not need replacing. Marine-grade PVC, Hypalon, and drop-stitch construction are chosen for longevity. We still ship spare parts for hulls we built a decade ago.'
    - emoji: "\U0001F3C6"
      title: 'Accessible by Design'
      description: 'Water sports should not be a luxury. We engineer products that deliver professional-grade performance at a price that makes sense for families, guides, and small operators — not just commercial fleets.'

design:
  tagline: 'Design Philosophy'
  heading: "Engineered for the edge<br />\n<span class=\"text-sky-600\">of conditions</span>"
  paragraphs:
    - 'Every Aquafarer product starts with one question: <em>what is the worst condition this will face?</em> We design from the edge inward, not from the center outward.'
    - 'Our drop-stitch cores are rated for 15 PSI — not because 12 PSI is insufficient for a lake, but because a 15 PSI board handles a sudden chop without flexing. Our Hypalon tubes are specified for commercial-grade UV resistance — not because every customer paddles in the tropics, but because UV degradation is the #1 cause of premature failure.'
    - 'We do not design to a price point. We design to a failure point — then build well above it.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Aquafarer design and engineering'
  stats:
    - value: '15'
      label: 'PSI core<br />rating'
    - value: '1,500+'
      label: 'UV hours<br />tested'
    - value: '10yr'
      label: 'hull<br />lifespan'
