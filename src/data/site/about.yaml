business_model:
  tagline: 'Our Business Model'
  heading: 'Overstock inventory, sold factory-direct'
  paragraphs:
    - 'Paddle Board Overstock sells brand-new inflatable SUP boards at overstock and clearance prices — up to 60% off typical retail. We source surplus and excess inventory in volume, then pass the savings on to paddlers and small retailers.'
    - 'Alongside retail sales we serve small retailers with mixed-model wholesale: order 5–20 boards, mix any models in one shipment, and pay the wholesale tier for the total quantity. Every order ships direct from Weihai, China.'

sourcing:
  tagline: 'Where Our Overstock Inventory Comes From'
  heading: 'Mixed sourcing, one quality standard'
  paragraphs:
    - 'Our inventory comes from two sources: surplus production batches from our own Weihai manufacturing operations, and selected excess inventory sourced from other production partners we audit and work with directly.'
    - 'Every board we sell is brand-new and unused. Overstock refers to the price — never the condition.'

manufacturing:
  tagline: 'Our Manufacturing Background'
  heading: 'Built in Weihai since 2012'
  paragraphs:
    - 'We have manufactured inflatable SUP boards in Weihai, Shandong since 2012. Our 12,000 m² production facility turns out 15,000 inflatable units per year with a team of 200–300 workers and 14+ R&D engineers.'
    - 'One design principle has not changed since the first board: we design to a failure point, then build well above it.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: 'Paddle Board Overstock factory building in Weihai'
  stats:
    - value: '2012'
      label: 'Manufacturing since'
    - value: '12,000 m²'
      label: 'Production facility'
    - value: '15,000'
      label: 'Units per year'
    - value: '14+'
      label: 'R&D engineers'

inspection:
  tagline: 'How We Inspect Every SUP Board'
  heading: 'Every board tested, not sampled'
  paragraphs:
    - 'Every SUP board is 100% pressure-tested at 1.25x its rated pressure for 24–48 hours before it is approved for sale. Boards that fail never ship.'
    - '99.3% of boards pass final inspection the first time. The remaining fraction is repaired or set aside — never discounted into an order.'

why_prices_lower:
  tagline: 'Why Our Prices Are Lower'
  heading: 'Overstock economics, not cut corners'
  paragraphs:
    - 'Our prices are lower for structural reasons: we sell overstock and surplus inventory direct from Weihai, with no retail markups, no distributor layers, and no showroom costs.'
    - 'The boards themselves are full-production quality — same drop-stitch cores, same marine-grade PVC, same testing as full-price retail.'

shipping_network:
  tagline: 'Our International Shipping Network'
  heading: 'Express air or consolidated sea freight'
  paragraphs:
    - 'Orders ship from Weihai, China. Express air freight carries samples and 1–3 board orders; consolidated sea freight serves 5–20 board wholesale orders to 50+ countries.'
    - 'Every quote includes a transit estimate for your destination, plus the commercial invoice and packing list required for customs clearance.'
  cards:
    - title: 'Express Air Freight'
      description: 'For samples and 1–3 board orders — fast delivery to your door, quoted per destination.'
    - title: 'Consolidated Sea Freight'
      description: 'For 5–20 board wholesale orders — cost-effective shipping to major ports, quoted per destination.'

warranty_support:
  tagline: 'Warranty & Customer Support'
  heading: 'A 2-Year SUP Warranty on every board'
  paragraphs:
    - 'Every board ships with the 2-Year SUP Warranty. If a covered defect appears within the warranty period, contact our support team and we will make it right.'
    - 'Support is handled by the same team that manages your order. Reach us any time through the contact form or by replying to your order confirmation.'
