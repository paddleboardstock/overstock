cards:
  - badge: 'PVC'
    title: 'Couche PVC qualité marine'
    description: 'Étoffe PVC laminée multicouche conçue pour les environnements marins. Testée contre les UV, l’abrasion et la perforation.'
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: 'DS'
    title: 'Noyau drop-stitch'
    description: 'Des milliers de fils internes relient les couches supérieure et inférieure, créant une structure rigide à haute pression de 12 à 15 PSI.'
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - badge: 'RR'
    title: 'Lisse de rail renforcée'
    description: 'Lisse soudée en double couche qui protège des frottements de ponton, des échouages sur plage et des impacts latéraux.'
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
