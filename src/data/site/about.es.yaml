business_model:
  tagline: Nuestro Modelo de Negocio
  heading: Inventario excedente, vendido directamente desde la fábrica
  paragraphs:
    - Paddle Board Overstock vende tableros inflables nuevos SUP a precios de excedente y liquidación, con descuentos de hasta el 60% respecto al precio minorista habitual. Obtenemos inventario sobrante y excedente en volumen, luego trasladamos los ahorros a los practicantes de paddle y pequeños minoristas.
    - 'Junto con las ventas al por menor, atendemos a pequeños minoristas con un modelo mixto de venta al por mayor: pedido de 5 a 20 tableros, mezclando cualquier modelo en un solo envío, y pagando el nivel mayorista por la cantidad total. Cada pedido se envía directamente desde Weihai, China.'
sourcing:
  tagline: De Dónde Proviene Nuestro Inventario Excedente
  heading: Abastecimiento mixto, un estándar de calidad
  paragraphs:
    - 'Nuestro inventario proviene de dos fuentes: lotes de producción excedente de nuestras propias operaciones de fabricación en Weihai y inventario excedente seleccionado de otros socios de producción que auditamos y con los que trabajamos directamente.'
    - Cada tablero que vendemos es completamente nuevo y sin usar. Excedente se refiere al precio, nunca a la condición.
manufacturing:
  tagline: Nuestro Antecedente en Manufactura
  heading: Fabricado en Weihai desde 2012
  paragraphs:
    - Hemos fabricado tableros inflables SUP en Weihai, Shandong desde 2012. Nuestra planta de producción de 12,000 m² produce 15,000 unidades inflables por año con un equipo de 200–300 trabajadores y 14+ ingenieros de I+D.
    - 'Un principio de diseño que no ha cambiado desde el primer tablero: diseñamos hasta un punto de falla y luego construimos muy por encima de él.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock edificio de fábrica en Weihai
  stats:
    - value: '2012'
      label: Fabricación desde
    - value: 12.000 m²
      label: Planta de producción
    - value: 15,000
      label: Unidades por año
    - value: 14+
      label: Ingenieros de I+D
inspection:
  tagline: Cómo Inspeccionamos Cada Tablero SUP
  heading: Cada tablero probado, no muestreado
  paragraphs:
    - Cada tablero SUP se prueba al 100% con presión a 1,25 veces su presión nominal durante 24–48 horas antes de aprobarlo para la venta. Los tableros que fallan nunca se envían.
    - El 99.3% de los tableros pasa la inspección final a la primera. La fracción restante se repara o se aparta, nunca se descuenta para un pedido.
why_prices_lower:
  tagline: Por Qué Nuestros Precios Son Más Bajos
  heading: Economía de inventario excedente, no recortes en calidad
  paragraphs:
    - 'Nuestros precios son más bajos por razones estructurales: vendemos inventario excedente y sobrante directamente desde Weihai, sin sobreprecios minoristas, sin capas de distribuidores y sin costos de sala de exhibición.'
    - 'Los tableros mismos son de calidad de producción completa: los mismos núcleos drop-stitch, el mismo PVC de grado marino y las mismas pruebas que los tableros minoristas de precio completo.'
shipping_network:
  tagline: Nuestra Red Internacional de Envíos
  heading: Envío expreso aéreo o flete marítimo consolidado
  paragraphs:
    - Los pedidos se envían desde Weihai, China. El flete aéreo exprés transporta muestras y pedidos de 1–3 tableros; el flete marítimo consolidado atiende pedidos al por mayor de 5–20 tableros a 50+ países.
    - Cada cotización incluye una estimación de tránsito para su destino, además de la factura comercial y la lista de empaque requerida para el despacho de aduanas.
  cards:
    - title: Transporte Aéreo Exprés
      description: Para muestras y pedidos de 1 a 3 tableros — entrega rápida a su puerta, cotizada por destino.
    - title: Transporte Marítimo Consolidado
      description: Para pedidos mayoristas de 5 a 20 tableros — envío rentable a los principales puertos, cotizado por destino.
warranty_support:
  tagline: Garantía y Atención al Cliente
  heading: Garantía de 2 años SUP en cada tablero
  paragraphs:
    - Cada tablero se envía con la Garantía de 2 años SUP. Si aparece un defecto cubierto dentro del período de garantía, comuníquese con nuestro equipo de soporte y lo solucionaremos.
    - El soporte es gestionado por el mismo equipo que maneja su pedido. Contáctenos en cualquier momento a través del formulario de contacto o respondiendo a la confirmación de su pedido.
