origin:
  tagline: 'Nuestro origen'
  heading: "Construidos sobre el agua,<br />\n<span class=\"text-sky-600\">impulsados por un propósito</span>"
  paragraphs:
    - 'Aquafarer comenzó en un taller costero con un barco y una convicción inquebrantable: los productos marinos deben diseñarse como si importaran — porque importan.'
    - 'Nuestros fundadores, dos ingenieros navales, vieron una industria donde se recortaban gastos, se degradaban los materiales y la seguridad se trataba como una casilla más. Construyeron el primer casco de Aquafarer no por beneficio, sino para demostrar que el equipo marino asequible también podía ser genuinamente fiable.'
    - 'Ese primer casco sigue en servicio hoy. Ese principio nunca cambió.'
    - 'No somos el mayor fabricante. No hacemos los productos más baratos. Pero cada casco que sale de nuestro taller pasa por las mismas manos que fundaron la empresa — y cumple el mismo estándar que marcó el primer casco.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Taller costero de Aquafarer'

philosophy:
  tagline: 'Nuestra filosofía'
  heading: 'Enraizados en el océano'
  description: 'El océano no es nuestro lugar de trabajo. Es nuestro maestro. Cada decisión de diseño comienza por comprender cómo se comporta el agua, cómo cambian las condiciones y cómo debe responder el equipo.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respeto por el agua'
      description: 'El agua es impredecible. Nuestros productos están diseñados para las peores condiciones, no para las mejores. Si un casco puede soportar una corriente de resaca, soportará un lago. Si un chaleco salvavidas funciona en alta mar, está sobrediseñado para un río — y eso es intencionado.'
    - emoji: "\U0001F527"
      title: 'Hecho para durar, no para reemplazar'
      description: 'El producto más sostenible es el que no necesita ser reemplazado. El PVC de grado marino, el Hypalon y la construcción drop-stitch se eligen por su durabilidad. Todavía enviamos repuestos para cascos que construimos hace una década.'
    - emoji: "\U0001F3C6"
      title: 'Accesibles por diseño'
      description: 'Los deportes acuáticos no deberían ser un lujo. Diseñamos productos que ofrecen un rendimiento de nivel profesional a un precio razonable para familias, guías y pequeños operadores — no solo para flotas comerciales.'

design:
  tagline: 'Filosofía de diseño'
  heading: "Ingeniería para el límite<br />\n<span class=\"text-sky-600\">de las condiciones</span>"
  paragraphs:
    - 'Cada producto de Aquafarer comienza con una pregunta: <em>¿cuál es la peor condición a la que se enfrentará?</em> Diseñamos desde el límite hacia adentro, no desde el centro hacia afuera.'
    - 'Nuestros núcleos drop-stitch están clasificados para 15 PSI — no porque 12 PSI sean insuficientes para un lago, sino porque una tabla de 15 PSI soporta una marejada repentina sin flexionarse. Nuestros tubos de Hypalon están especificados para resistencia UV de grado comercial — no porque todos los clientes remen en los trópicos, sino porque la degradación UV es la causa número uno de fallos prematuros.'
    - 'No diseñamos para un precio. Diseñamos para un punto de fallo — y construimos muy por encima de él.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Diseño e ingeniería de Aquafarer'
  stats:
    - value: '15'
      label: 'núcleo PSI<br />clasificación'
    - value: '1,500+'
      label: 'horas UV<br />probadas'
    - value: '10yr'
      label: 'vida útil<br />del casco'