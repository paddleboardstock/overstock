cards:
  - badge: 'PVC'
    title: 'Strato in PVC di grado marino'
    description: 'Tessuto in PVC laminato multistrato progettato per ambienti marini. Testato contro UV, abrasione e perforazione.'
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: 'DS'
    title: 'Nucleo drop-stitch'
    description: 'Migliaia di fili interni collegano gli strati superiore e inferiore, creando una struttura rigida ad alta pressione a 12-15 PSI.'
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - badge: 'RR'
    title: 'Bordo del tubo rinforzato'
    description: 'Il bordo saldato a doppio strato protegge dagli attriti contro il molo, dagli spiaggiamenti e dagli urti laterali.'
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
