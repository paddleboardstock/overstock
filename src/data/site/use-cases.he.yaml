cases:
  - id: beginner
    title: ספורט מים למתחילים
    desc: לוחות קיאקים יציבים למשתמשים בפעם הראשונה.
    scenario: משפחה שמבקרת באגם בסוף השבוע רוצה לנסות חווית פדלים על לוח. הם זקוקים לציוד יציב וקל להשקה עם הדרכה ברורה לבטיחות.
    solution: SUP Explorer 11 מספק יציבות גוף רחבה למתחילים. אפודת ההצלה הקלאסית Life Vest Classic מבטיחה ציפה מוסמכת CE. המשאבה בעלת הפעולה הכפולה Dual-Action Pump מנפחת את שני הלוחות בפחות מ-10 דקות.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: חקר חוץ
    desc: קיאקים ודינגי ניידים לנהרות, אגמים וטיולים חופיים.
    scenario: חובב שטח מתכנן טיול נהר של שבוע וזקוק לסירה שתקפל לגודל קטן, תנפח במחנה ותתמודד עם זרמים שונים.
    solution: Kayak Lite מתקפל לתוך תיק גב ומנפח בפחות מ-4 דקות. הבנייה שלו drop-stitch מתאימה לאגמים, נהרות איטיים ולשייט חופי.
    products:
      - קיאק מתנפח Kayak Lite
      - משוט פחמן
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: פעולות מקצועיות
    desc: ציוד מסחרי RIBs למפעילי טיולים ולתגובה חירומית.
    scenario: מפעיל טיולים לאורך החוף זקוק לצי סירות עמידות שמבצעות סיורים יומיים בתנאי ים משתנים ועומדות בתקנות בטיחות מסחריות.
    solution: RIB 330 ו-RIB 450 Patrol משתמשים בתאורה מעמיקה מזכוכית-סיבי עם צינורות Hypalon לעמידות בכל מזג אוויר. ניתן לפרוס מספר יחידות עם ביצועים עקביים.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: בידור משפחתי
    desc: דינגי מרווחים לטיולי יום, דיג וספורט מים.
    scenario: משפחה בת ארבעה מבקשת סירה יציבה לסופי שבוע באגם, טיולי דיג וגרירת צינור לילדים.
    solution: AirDeck 360 מכיל עד חמישה עם רצפת דק אוויר מחוזקת. הוא מנופח באתר ההשקה, ניתן לאחסון ברכב ומתמודד עם אגמים רגועים ומים חופיים מוגנים.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
