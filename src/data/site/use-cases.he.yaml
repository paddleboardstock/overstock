cases:
  - id: beginner
    title: תחילת גלישה באתרים מתנפחים
    desc: קרשי מתנפחים יציבים SUP למתרגלי חתירה בפעם הראשונה.
    scenario: משפחה שמבקרת באגם בסוף השבוע רוצה לנסות חווית פדלים על לוח. הם זקוקים לציוד יציב וקל להשקה עם הדרכה ברורה לבטיחות.
    solution: SUP Explorer 11 מספק יציבות רחבה למתחילים. Life Vest Classic מבטיח ציפה מוסמכת לפי CE. Oars & Pump Set מנפח את הלוח בזמן פחות מ-10 דקות.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: סיורים וחקר
    desc: לוחות מתנפחים לטווח ארוך לנהרות, אגמים וטיולים לאורך החוף.
    scenario: חובב טבע שמתכנן טיול גלישה של שבוע צריך לוח שניתן לארוז קטן, לנפח במחנה ולנוע בקו ישר במים פתוחים.
    solution: Ocean Voyager Series מחליק ביעילות עם קווי סיור ושומר על המסלול ברוח וגלים. המבנה של drop-stitch מנפח עד 15 PSI לנוקשות לוח קשה.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP יוגה וכושר
    desc: פלטפורמות רחבות ויציבות ליוגה, כושר והרפיה.
    scenario: מיישם יוגה רוצה סטודיו צף למפגשי בוקר במים שקטים, עם מספיק מקום על הדק לכל תנוחה.
    solution: Flowing Lotus Series כולל כרית דק באורך מלא וקורה רחבה לתנוחות יציבות ללא רעד. הוא גם משמש כפלטפורמה יציבה לאימוני כושר קלים.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: בידור משפחתי
    desc: חבילות SUP מלאות לימים באגמים וחופשות.
    scenario: משפחה בת ארבעה מחפשת לוחות יציבים לטיולים בסופי שבוע באגמים וחופשות חוף — ציוד שניתן לארוז ברכב ולנפח תוך דקות.
    solution: Tropical Breeze Series הוא לוח יציב למגוון שימושים שכל המשפחה יכולה לחלוק, בעוד Medusa Glow Series קל וקצר יותר לילדים. שניהם נארזים בתרמילי גב לניידות קלה.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
