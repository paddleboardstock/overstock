cases:
  - id: beginner
    title: Yeni Başlayanlar için Kürek Çekme
    desc: İlk kez kürek çekenler için kararlı şişme SUP tahtalar.
    scenario: Hafta sonu göle giden bir aile paddle board yapmayı denemek istiyor. Stabil, kolay başlatılabilir ekipman ve net güvenlik yönergelerine ihtiyaçları var.
    solution: SUP Explorer 11, yeni başlayanlar için geniş gövde stabilitesi sağlar. Life Vest Classic, CE sertifikalı yüzebilirlik sağlar. Oars & Pump Set, tahtayı 10 dakikadan kısa sürede şişirir.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Gezi & Keşif
    desc: Göller, nehirler ve sahil gezileri için uzun mesafeli şişme SUP tahtalar.
    scenario: Bir açık hava meraklısı, hafta süren bir kürek gezisi planlıyor ve küçük paketlenen, kamp alanında şişirilen ve açık suda düz giden bir tahta ihtiyacı var.
    solution: Ocean Voyager Series, gezi tasarımı ile verimli bir şekilde kayar ve rüzgar ve dalgalarda rotasını korur. drop-stitch yapısı 15 PSI basınca kadar şişerek sert tahta rijitliği sağlar.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga & Fitness
    desc: Yoga, fitness ve dinlenme için ekstra geniş, kararlı platformlar.
    scenario: Bir yoga uygulayıcısı, sakin suda sabah seansları için bir yüzen stüdyo istiyor ve her pozisyonu yapmak için yeterli güverte alanına ihtiyaç duyuyor.
    solution: Flowing Lotus Series, tam boy güverte pedi ve sallanmayan pozlar için geniş bir genişlik sunar. Aynı zamanda hafif fitness egzersizleri için stabil bir platform olarak da kullanılır.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Aile Eğlencesi
    desc: Hafta sonu göl günleri ve tatiller için komple SUP paketleri.
    scenario: Dört kişilik bir aile, hafta sonu göl gezileri ve plaj tatilleri için kararlı tahtalar istiyor — arabaya sığan ve dakikalar içinde şişirilen ekipman.
    solution: Tropical Breeze Series, tüm ailenin paylaşabileceği kararlı bir çok amaçlı tahtadır, Medusa Glow Series ise çocuklar için daha hafif ve kısadır. Her ikisi de kolay taşınması için sırt çantalarına sığar.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
