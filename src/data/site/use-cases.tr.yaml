cases:
  - id: beginner
    title: Yeni Başlayanlar İçin Su Sporları
    desc: İlk kez kullananlar için stabil SUP tahtalar ve kano.
    scenario: Hafta sonu göle giden bir aile paddle board yapmayı denemek istiyor. Stabil, kolay başlatılabilir ekipman ve net güvenlik yönergelerine ihtiyaçları var.
    solution: SUP Explorer 11, yeni başlayanlar için geniş gövde stabilitesi sağlar. Life Vest Classic CE sertifikalı yüzdürmeyi garanti eder. Dual-Action Pompa, her iki tahtayı da 10 dakikadan kısa sürede şişirir.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pompa
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Açık Hava Keşfi
    desc: Nehirler, göller ve kıyı gezileri için taşınabilir kanolar ve botlar.
    scenario: Bir açık hava meraklısı, bir haftalık nehir gezisi planlıyor ve küçük paketlenebilen, kamp alanında şişirilebilen ve farklı akıntıları kaldırabilen bir bota ihtiyaç duyuyor.
    solution: Kayak Lite, bir sırt çantasına sığar ve 4 dakikadan kısa sürede şişer. drop-stitch yapısı göller, yavaş nehirler ve kıyı kürekleri için uygundur.
    products:
      - Şişme Kayak Lite
      - Karbon Kürek
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: Profesyonel Operasyonlar
    desc: Turlar ve acil durum müdahalesi için ticari sınıf RIBs.
    scenario: Bir kıyı tur operatörü, farklı deniz koşullarında günlük geziler düzenleyen ve ticari güvenlik kurallarına uyan dayanıklı bot filosuna ihtiyaç duyuyor.
    solution: RIB 330 ve RIB 450 Patrol, her türlü hava koşulunda dayanıklılık için fiberglas derin-V gövde ve Hypalon tüpler kullanır. Birden fazla birim tutarlı performans ile konuşlandırılabilir.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: Aile Eğlencesi
    desc: Günlük geziler, balıkçılık ve su sporları için geniş botlar.
    scenario: Dört kişilik bir aile, hafta sonu göl gezileri, balık turları ve çocuklar için bir tüp çekmek için stabil bir bot istiyor.
    solution: AirDeck 360, güçlendirilmiş hava güvertesi ile beş kişiye kadar oturma kapasitesi sunar. Başlatma alanında şişirilir, arabada saklanır ve hem sakin göllerde hem de korunaklı kıyı sularında kullanılabilir.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pompa
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
