origin:
  tagline: '私たちの原点'
  heading: "水上に築き、<br />\n<span class=\"text-sky-600\">目的に駆動されて</span>"
  paragraphs:
    - 'Aquafarer は、一艘のボートと一つの頑固な信念とともに沿岸の作業場から始まりました：海洋製品は、その存在意義があるかのように設計されるべきだ — 実際にそうだからです。'
    - '二人の造船技師である創業者は、手抜きが常態化し、素材がダウングレードされ、安全がチェックボックスのように扱われる業界を目にしました。彼らが最初の Aquafarer の船体を造ったのは利益のためではなく、手頃な海洋ギアも本物の信頼性を持てることを証明するためでした。'
    - 'その最初の船体は今日も現役です。その原則は決して変わりませんでした。'
    - '当社は最大のメーカーではありません。最も安い製品を作っているわけでもありません。しかし、作業場を出ていくすべての船体は、会社を立ち上げた同じ手を通り — 最初の船体が定めた同じ基準を満たしています。'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Aquafarer の沿岸作業場'

philosophy:
  tagline: '私たちの哲学'
  heading: '海に根ざして'
  description: '海は私たちの職場ではありません。私たちの先生です。すべての設計判断は、水がどのように振る舞うか、状況がどのように変化するか、ギアがどう応答すべきかを理解することから始まります。'
  cards:
    - emoji: "\U0001F30A"
      title: '水を敬う'
      description: '水は予測できません。当社の製品は最良の条件ではなく、最悪の条件のために設計されています。船体が離岸流に耐えられれば、湖にも耐えられます。ライフジャケットが沖合で機能するなら、川には過剰な性能です — それは意図的なものです。'
    - emoji: "\U0001F527"
      title: '交換のためではなく、長持ちのために造る'
      description: '最も持続可能な製品は、交換を必要としない製品です。マリングレード PVC、ハイパロン、ドロップステッチ構造は長寿命のために選ばれています。10 年前に造った船体のスペアパーツも今も出荷しています。'
    - emoji: "\U0001F3C6"
      title: '設計で手に入りやすく'
      description: 'ウォータースポーツは贅沢であるべきではありません。プロフェッショナルグレードの性能を、家族、ガイド、小規模事業者に理にかなった価格で提供する製品を設計しています — 商業フリートだけではありません。'

design:
  tagline: '設計哲学'
  heading: "条件の限界に<br />\n<span class=\"text-sky-600\">耐えるよう設計</span>"
  paragraphs:
    - 'すべての Aquafarer 製品は一つの質問から始まります：<em>これが直面する最悪の条件は何か？</em> 当社は中心から外側へではなく、限界から内側へ向かって設計します。'
    - '当社のドロップステッチコアは 15 PSI に定格されています — 湖に 12 PSI では不十分だからではなく、15 PSI のボードは突然の風波でもたわまずに対応できるからです。ハイパロンチューブは商業グレードの耐 UV 性仕様です — すべての顧客が熱帯でパドルするからではなく、UV 劣化が早期故障の最大の原因だからです。'
    - '当社は価格帯に合わせて設計しません。故障点に合わせて設計し — その後、それをはるかに上回るように造ります。'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Aquafarer のデザイン・エンジニアリング'
  stats:
    - value: '15'
      label: 'PSI コア<br />定格'
    - value: '1,500+'
      label: 'UV テスト<br />時間'
    - value: '10 年'
      label: '船体の<br />寿命'
