- slug: ocean-safety-and-responsibility
  category: authority
  type: brand
  title: Sigurnost i odgovornost na oceanu (više od same opreme)
  description: Aquafarerpredanosti da vas zaštitimo i zaštitimo ocean koji dijelimo. Sigurnosne kartice u svakoj kutiji, besplatni edukativni sadržaji, održivi dizajn i godišnje donacije za očuvanje.
  definition: Sigurnost i odgovornost na moru znače razumijevanje okoliša u kojem veslate, poštivanje morskog života, minimiziranje svog ekološkog otiska i korištenje opreme dizajnirane za dugovječnost i mogućnost popravka.
  tldr: Aquafarer Promiče sigurnost na oceanu kroz dizajn opreme (jarke boje, povodci, prsluci za spašavanje) i edukativni sadržaj. Vjerujemo da svaki zaljubljenik u vodene sportove ima odgovornost razumjeti oceansko okruženje, poštovati morski život i smanjiti svoj ekološki otisak. Naša oprema je izrađena da traje, tako da manje njih završi na odlagalištima.
  problem: Mnogi brendovi vodenih sportova prodaju opremu, ali ne educiraju svoje kupce kako je koristiti sigurno ili odgovorno. Novi veslači i surferi ulaze u vodu bez razumijevanja strujnih struja, morskih životinja ili utjecaja svoje opreme na okoliš.
  explanation: Sigurnost na oceanu je više od kontrolnog popisa — to je način razmišljanja. Svaki Aquafarer proizvod uključuje sigurnosnu karticu za brzi početak u kutiji. Naša web stranica i vodiči (osnove sigurnosti na oceanu, savjeti za sigurnost pri surfanju) pružaju besplatnu, detaljnu edukaciju o sigurnosti. S ekološke strane, najveći utjecaj koji bilo koja tvrtka za opremu ima je dugovječnost proizvoda. Daska koja traje 5 godina umjesto 2 prepolovljuje proizvodni otisak. Također dizajniramo s namjerom popravka — zamjenski ventili, kutije za peraje i setovi za zakrpe za ronilačka odijela održavaju opremu u upotrebi, a ne na odlagalištima.
  solution: Aquafarer Uz svaku kupnju daske dolazi povodac i komplet za popravak. Objavljujemo besplatan sigurnosni sadržaj koji pokriva identifikaciju RIP struje, očitavanje vremenskih uvjeta i provjere opreme. Naš tim za korisničku podršku pruža savjete o stanju kada nam pošaljete e-mail o određenoj lokaciji. Koristimo minimalnu plastičnu ambalažu i kompenzirani karbon za transport.
  recommendation: Započnite s vodičem za osnove sigurnosti na moru i vodičem za savjete za sigurnost na vodi. Uvijek nosite povodac, provjerite vremensku prognozu i nikada ne veslajte sami ako učite. Ako vidite otpad ili morske životinje u nevolji, prijavite to lokalnim vlastima. Oprema koja traje je ona koja smanjuje otpad — održavajte Aquafarer svoju opremu i služit će vam godinama.
  faq:
    - q: Aquafarer Podržava li inicijative za čišćenje oceana?
      a: Da, doniramo 1 posto godišnje dobiti organizacijama za čišćenje oceana i očuvanje mora. Kupci mogu odabrati odabranu humanitarnu organizaciju na blagajni koja će usmjeriti dio njihove kupnje.
    - q: Kako da se riješim starog ronilačkog odijela ili daske?
      a: Neoprenska odijela za neopren mogu se reciklirati u joga prostirke, torbe i izolaciju kroz specijalizirane programe. Napuhavajuće daske mogu se popraviti, donirati ili PVC preuzeti kroz određene reciklažne objekte. Kontaktirajte naš tim za podršku za savjete.
    - q: Koju sigurnosnu opremu preporučuje Aquafarer početnicima?
      a: Pravilno pristajući prsluk za spašavanje (napuhujući ili pjenasti prsluk), namotani povodac, zviždaljka i krema za sunčanje. Za SUP veslače u otvorenoj vodi, prsluk za spašavanje je zakonski obavezan u mnogim jurisdikcijama i uvijek se preporučuje.
    - q: Aquafarer Nudi li tečajeve sigurnosti?
      a: Ne vodimo tečajeve izravno, već surađujemo s SUP certificiranim instruktorima surfanja i sigurnosti koji nude online i osobne treninge. Kontaktirajte naš tim za podršku za preporuke u vašem području.
