- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Pravila bontona surfanja (Kako ne biti osoba koju svi izbjegavaju)
  description: Postava ima pravila i nitko ih ne zapisuje. Naučite prednost prolaza, zašto će vas vikati na viku, kako se ispričati i početničke greške koje živciraju svakog lokalnog surfera.
  definition: 'Bonton surfanja je nepisani kodeks ponašanja koji sprječava sudare i pravedno dijeli valove. Osnovno pravilo: surfer najbliži vrhu vala koji se lomi ima prednost.'
  tldr: Surfer najbliži vrhu vala koji se lomi ima prednost. Nemojte se ubacivati na nekoga, nemojte se provlačiti (veslati oko nekoga da biste uzeli njegov val) i uvijek se ispričajte ako pogriješite. Veslajte široko po liniji, držite se daske i budite prijateljski nastrojeni — poštovanje donosi poštovanje.
  problem: Veslaš prema prepunom redu i odmah osjetiš napetost. Surferi te gledaju sa strane, netko ti viče, a ti nisi siguran što si pogriješio. Društvena strana surfanja djeluje zastrašujuće od samih valova.
  explanation: 'Bonton na surfanju postoji da spriječi sudare i pravedno dijeli valove. Osnovno pravilo je prednost: surfer najbliži vrhu (gdje val prvi put puca) ima prednost. Svatko tko pliva na isti val iz dublje unutrašnjosti mora se povući. Zmija — zaobilaženje drugog surfera radi preuzimanja prioriteta — smatra se najgorim prekršajem. Osim prioriteta, postava ima očekivanja o buci (smanjite vikanje), kontroli daske (nikad ne dopustite dasku blizu drugih) i prijateljstvu (jednostavan kimanje glavom puno znači).'
  solution: Pratite liniju 10 minuta prije nego što veslate. Identificirajte tko hvata najviše valova — to su surferi koje treba poštovati i izbjegavati. Držite se unutarnje strane (zona bijele vode) ako učite. Veslajte široko oko linije, ne kroz nju. Kad uhvatite val, pogledajte na obje strane prije nego što se pojavite i provjerite da nitko nije dublje.
  recommendation: Prvih nekoliko sesija provedite na odmoru prilagođenom početnicima s raštrkanim mnoštvom. Naučite čitati prioritete prije nego što pokušate zauzet lineup. Ako svratite nekome, odmah se ispričajte i preplivajte — većina surfera poštuje iskrenu pogrešku.
  faq:
    - q: Što je drop-in?
      a: Spuštanje znači veslati i jahati val na kojem drugi surfer već ima prioritet. To je opasno i nepoštovanje. Surfer najbliži vrhu posjeduje val; svatko drugi mora skrenuti.
    - q: Što je zmija?
      a: Snaking znači veslati oko drugog surfera koji je već u poziciji za val kako biste završili bliže vrhu. Smatra se izuzetno lošim bontonom i može dovesti do sukoba.
    - q: Mogu li početnici surfati na prepunim plažama?
      a: Da, ali ostanite u zoni bijele vode dalje od vrha. Nemojte veslati u glavno područje polijetanja dok ne možete dosljedno hvatati valove i kontrolirati smjer. Pretrpane linije zahtijevaju iskustvo za sigurnu navigaciju.
    - q: Kako se ispričati u vodi?
      a: Jednostavno mahanje, osmijeh i "moja greška" ili "oprosti" funkcioniraju. Priznaj pogrešku i veslaj dalje od osobe. Surferi su općenito popustljivi prema iskrenim pogreškama, osobito ako očito učiš.
    - q: Što da radim ako mi netko navrati?
      a: Ako je to jasan drop-in, viknite "mahni" ili "hej" da ih upozorite. Ako slučajno uhvate i ispričaju se, pustite to. Ako netko više puta svrati, priđite i pristojno objasnite prioritet. Izbjegavajte sukobe.
