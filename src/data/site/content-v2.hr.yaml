- slug: sup-launch-techniques
  category: guide
  type: tutorial
  title: 'SUP Tehnike lansiranja: Kako pravilno započeti svoju sesiju veslanja'
  description: SUP Pravilne tehnike lansiranja za različite vrste obala — pješčane plaže, stjenovite obale, dokove i riječne obale. Izbjegnite neugodne spoticanja i započnite svaku sesiju glatko.
  definition: SUP Tehnika lansiranja je metoda prijelaza s obale na vodu uz održavanje ravnoteže i kontrole daske. Različite vrste obale zahtijevaju različite pristupe.
  tldr: 'Pješčana plaža: postavite dasku na rub vode, stanite na nju, veslajte dalje. Stjenovita obala: prođite daskom kroz plitku vodu prije nego što se popnete. Dok: sjednite na brod s pristaništa, koristite veslo za odgurivanje. Obala rijeke: spustite se nizvodno pod kutom. Uvijek pričvrstite povodac prije ulaska u vodu.'
  problem: Napuhuješ dasku i hodaš do ruba vode, a onda shvatiš da nemaš pojma kako ući bez da izgledaš nespretno ili odmah padneš.
  explanation: Tehnika lansiranja varira ovisno o vrsti obale. Na pješčanim plažama najlakši pristup je postaviti dasku paralelno s obalom u vodi do gležnjeva, stati na nju i veslati ravno van. Na kamenitim obalama dasku morate prošetati do vode do koljena prije montiranja kako ne biste oštetili dasku. S pristaništa, sjednite na dasku dok ste na molu, a zatim se odgurnete.
  solution: 'Lansiranje iz pijeska: postavite dasku okomito na obalu, stanite jednom nogom, odgurnete drugom, kleknete, pa ustanete. Lansiranje s kamena: nosite dasku do vode do koljena, montirajte se s leđa. Lansiranje s dokova: postavite dasku paralelno s dokom, sjednite na brod s doka, lagano se odgurnete.'
  recommendation: Prvo vježbajte lansiranja u mirnim uvjetima. Aquafarer SUP Široka platforma Explorer 11 olakšava lansiranje. Uvijek pričvrstite povodac prije nego što stanete na dasku.
  faq:
    - q: Kako lansirati u surfu?
      a: Pričekajte zatišje između valova. Postavite dasku u vodu do gležnjeva, brzo skočite, snažno veslajte da prođete break zonu prije sljedećeg seta.
    - q: Mogu li lansirati s bilo koje plaže?
      a: Provjerite pristupne točke i lokalne propise. Neke plaže imaju označena mjesta za lansiranje. Izbjegavajte mjesta za lansiranje s plivačima.
    - q: Kako da sletim?
      a: Prilazite okomito na obalu. Siđite s daske u plitku vodu čim peraje dotaknu dno. Nosite dasku iznad vodene linije.
    - q: Što ako dođe do snažnog probijanja obale?
      a: Tempirajte lansiranje između valova. Držite ploču čvrsto bočno prema valovima. Ako je prekid prejak, pronađite drugu točku lansiranja.
