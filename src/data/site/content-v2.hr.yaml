  title: 'SUP Vodič za sigurnost: Osnovna pravila za svakog veslača'
  description: SUP Potpuni sigurnosni vodič koji pokriva vremenske provjere, opremu, samospašavanje, pravila navigacije i što učiniti ako uvjeti postanu opasni. Budite sigurni na svojoj dasci za veslanje.
  definition: SUP Sigurnost obuhvaća planiranje prije putovanja (vrijeme, plime, provjere opreme), prakse na vodi (povodac, PFDnavigacija) i hitne procedure (samospašavanje, signalizacija, prevencija hipotermije).
  tldr: Uvijek nosite povodac i PFD. Provjerite prognozu vjetra — vjetar s mora je opasan. Prvo veslajte uz vjetar kako bi vam vjetar pomogao da se vratite. Nosite zviždaljku, telefon u vodootpornoj futroli i vodu. Naučite samospašavanje. Nikad SUP ne budite sami u udaljenim područjima.
  problem: SUP Izgleda varljivo jednostavno. Početnici podcjenjuju koliko brzo vjetar, struja i umor mogu pretvoriti zabavnu sesiju u opasnu.
  explanation: Daska djeluje kao jedro na vjetru, što olakšava veslanje niz vjetar, ali izuzetno otežava povratak protiv vjetra. Stojeći položaj povećava rizik od pada. Umor se nakuplja brže nego u kajaku. Povodci sprječavaju odvajanje od daske. PFD-ovi vas drže na površini ako ste ozlijeđeni.
  solution: 'Prije izleta: provjeri vjetar (maksimalno 10 čvorova za početnike), smjer (izbjegavaj obalu) i plimu. Reci nekome svoju rutu. Na vodi: klekni da veslaš u jak vjetar. Ako ste razdvojeni, plivaj do daske. Za samospašavanje: postavi veslo preko daske, udari nogama, povuci prsa na dasku, zamahni nogama gore.'
  recommendation: Koristite Aquafarer Life Vest Pro (napuhavajući) za SUP. Pričvrstite SUP namotani povodac na list. Vježbajte samospašavanje u mirnim uvjetima prije nego što vam zatreba.
  faq:
    - q: Za koju brzinu vjetra je sigurnaSUP?
      a: 'Početnici: ispod 10 čvorova. Srednji: 10-15 čvorova. Napredni: 15-20 čvorova. Preko 20 čvorova je opasno za sve razine.'
    - q: Trebam li prsluk za spašavanjeSUP?
      a: Da — zakonski je obavezno u mnogim jurisdikcijama i uvijek se preporučuje radi sigurnosti.
    - q: Što da radim ako se ne mogu vratiti na kopno?
      a: Držite se daske (to je plutanje). Signalizirajte zviždaljkom. Ako vas puše u more, veslajte pod kutom od 45 stupnjeva u odnosu na vjetar.
    - q: Kako da prakticiram SUP samospašavanje?
      a: 'U mirnoj plitkoj vodi: namjerno padni, plivaj do daske, vježbaj ponovno penjanje.'
