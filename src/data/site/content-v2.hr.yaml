- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hidratacija i zaštita od sunca: Budite sigurni na vodi'
  description: Osnovne strategije hidratacije i zaštite od sunca za SUP veslače. Dehidracija i opekline od sunca najčešći SUP su problemi — kako spriječiti oba tijekom dugih treninga.
  definition: SUP Hidratacija znači održavanje ravnoteže tekućine tijekom veslanja redovitim unosom vode. Zaštita od sunca uključuje nanošenje SPF-a, zaštitnu odjeću i mjerenje vremena kako bi se izbjegao vrhunacUV.
  tldr: Pijte 500 ml vode po satu plivanja. Ponesite više nego što mislite da vam treba — 2L mjehur ili više boca. Prije+ veslanja nanesite vodootpornu kremu za sunčanje SPF 50 i nanesite je svaka 2 sata. Nosite kapu, sunčane naočale s remenom i odjeću s UPF ocjenom. Izbjegavajte veslanje od 11 do 15 sati kada UV je najjače.
  problem: Imaš SUP sjajnu sesiju, ali nakon sat vremena imaš glavobolju, suha usta i kožu koja ti gori. Dehidracija i opekline od sunca te iznenade jer te voda hladi.
  explanation: Refleksija od vode pojačava UV izloženost do 40%. Hlađenje vode i povjetarca prikriva opekline od sunca dok ne bude prekasno. Znoj od veslanja povećava gubitak tekućine, a često nema mjesta za dopunu vode u vodi. Dehidracija narušava ravnotežu i donošenje odluka, povećavajući rizik od nezgoda.
  solution: Pričvrstite bocu vode ili mjehur za hidrataciju na bungee sustav daske. Pijte svakih 15 minuta, bez obzira jeste li žedni ili ne. Nanesite kremu sa SPF 50+ 30 minuta prije lansiranja. Nosite šešir širokog oboda, polarizirane sunčane naočale s remenom i UPF+ 50 zaštitu od odbrane. Ponovno nanesite kremu za sunčanje svaka 2 sata.
  recommendation: Koristite hidratacijski mjehur pričvršćen na prednje D-prstenove na vašem dijelu Aquafarer SUP. Nosite UPF 50+ rash guard ispod . PFDKoristite vodootpornu kremu za sunčanje koja ostaje na površini i znoju i vodi.
  faq:
    - q: Koliko vode trebam ponijeti na SUP putovanje?
      a: Minimalno 1 litar na sat. Za dvosatnu sesiju ponesite 2 litre. Više u vrućem vremenu. Najbolje je imati mjehur za hidrataciju.
    - q: Za koju vrstu kreme za sunčanje je najboljaSUP?
      a: Vodootporni, SPF 50+ širokog spektra. Mineralne kreme za sunčanje (cinkov oksid, titanijev dioksid) su sigurne za grebene i traju dulje.
    - q: Reflektira li se voda doistaUV?
      a: Da — voda reflektira do 40% UV zračenja, što znači da dolazite UV odozgo i odozdo. To značajno povećava rizik od opeklina.
    - q: Mogu li dobiti opekline na suncu kroz rash guard?
      a: Standardni rash štitnici pružaju UV minimalnu zaštitu (otprilike UPF 10-20). Tražite+ odjeću s UPF 50 oznakom za potpunu zaštitu.
