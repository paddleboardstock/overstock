  title: 'Razumijevanje plime i oseke za vodene sportove: praktični vodič'
  description: Kako plime utječu na SUPuvjete surfanja i kajakaštva. Čitanje dijagrama plime i oseke, razumijevanje proljetnih naspram neap plima i planiranje sesije oko kretanja plime radi sigurnosti.
  definition: Plime su dnevni porast i pad razine mora uzrokovan gravitacijskom silom Mjeseca i Sunca. Raspon plime varira ovisno o lokaciji i lunarnom ciklusu.
  tldr: 'Dvije plime i dvije niske plime dnevno na većini lokacija. Proljetne plime (puni/mladi mjesec) imaju veće raspone i jače struje. Plime (četvrt mjeseca) imaju manje raspone. Plima utječe na dubinu vode, oblik vala i jačinu struje. Za SUP: prvo veslaj protiv struje kako bi ti pomogla da se vratiš.'
  problem: Stižete na lokalni odmor i zateknete gotovo nikakve valove, opasne valove od odlazećeg plime ili vodu preplitku. Bez razumijevanja plime, gubite izlete ili veslate u opasnim uvjetima.
  explanation: Plime su uzrokovane gravitacijom Mjeseca. Proljetne plime (puni i mladi mjesec) donose najviše najviše i najniže vrijednosti. Plime (četvrt mjeseca) stvaraju minimalni raspon. Plimne struje su najbrže u sredini plime, slabije pri visokim i niskim temperaturama. Raspon plime varira od 0,3 m (Mediteran) do 16 m (Bay of Fundy).
  solution: 'Provjerite plimni dijagram prije svake sesije. Za surfanje: pauze na plaži često najbolje traju 2-3 sata prije plime. Za SUPsljedeće: veslajte protiv trenutne prve polovice kako bi se struja vratila. Za ribolov: dolazeća plima gura ribu na ravnicu.'
  recommendation: Koristite NOAA-ine prognoze plime ili lokalnu aplikaciju za plimu. Saznajte preferencije plime na svom lokalnom odmoru tako da bilježite uvjete tijekom mjesec dana.
  faq:
    - q: Što je proljetna plima?
      a: Proljetne plime javljaju se tijekom punog i mladog mjeseca, donoseći više plime i jače struje. Javljaju se dva puta mjesečno.
    - q: Što je neap plima?
      a: Plima se događa tijekom četvrt mjeseca. Raspon plime je manji, a struje slabije — dobro za početnike.
    - q: Jesu li oseke opasne za SUP?
      a: Niska plima može izložiti stijene i grebene. Također koncentrira energiju valova na strmijim pješčanim sprudovima.
    - q: Kako plime utječu na struje ripanja?
      a: Odlazne plime (oseka) pojačavaju struje oko strujenja. Dolazne plime (poplave) smanjuju čvrstoću oseka.
