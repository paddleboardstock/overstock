- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP S vašim psom: Potpuni vodič za to'
  description: Vožnja na dasci s vašim psom — priprema, sigurnost, koraci treninga, preporuke opreme i savjeti za zabavno iskustvo za oboje.
  definition: SUP S psom uključuje treniranje vašeg psa da balansira na dasci za veslanje, opremanje psa PFDi sigurno zajedničko veslanje.
  tldr: Počnite sa širokim, stabilnim prslukom SUP (34"). +Nabavite psu pravilno prilagođeni prsluk za spašavanje s drškom. Prvo uvedite dasku na kopno, zatim u plitku vodu. Počnite s kratkim sesijama i pozitivnim poticanjem. Uvijek nosite vodu za psa. Pratite znakove stresa ili umora.
  problem: Vaš pas voli vodu, ali niste sigurni kako ga sigurno upoznati s njom SUP . Bez pravilnog treninga, pas može paničariti, skočiti ili ogrebati dasku.
  explanation: 'Psi imaju prirodnu sposobnost plivanja, ali moraju naučiti da je daska sigurna platforma. Ključ je postupna desenzitizacija: uvedite dasku na čvrstu zemlju, nagradite mirno ponašanje, zatim prijeđite u plitku vodu, a na kraju u dublju vodu.'
  solution: 'Počnite na kopnu: pustite psa da njuši i hoda po dasci (po travi). Nagrađujte mirno ponašanje. Sljedeće: stavite dasku u vrlo plitku vodu, podržite je, pustite psa da stoji na njoj. Nagradite. Sljedeće: uđete u plitku vodu, pustite psa da se pridruži. Na kraju: polako veslajte u mirnoj vodi.'
  recommendation: Koristite Aquafarer SUP Explorer 11 za njegovu stabilnu platformu od 33". Dodajte psa PFD (prsluk za spašavanje). Ponesite svježu vodu i zdjelicu. Počnite s 10-minutnim sesijama i postupno povećavajte.
  faq:
    - q: Koju SUP veličinu trebam za svog psa?
      a: Daska širine 33-34 inča pruža stabilnost za srednje do velike pse. Mali psi (ispod 10 kg) mogu se nositi na daskama od 32 inča+.
    - q: Treba li mom psu prsluk za spašavanje?
      a: Da — čak i snažni plivači trebaju psa PFD s ručkom za lakše donošenje u hitnim slučajevima.
    - q: Kako zaštititi ploču od kandži?
      a: Držite pseće nokte podrezanima. Koristite zaštitu za podlogu ili ručnik. Psi obično prilagode i prestanu grebati kad se osjećaju ugodno.
    - q: Može li svaki pas SUPnaučiti?
      a: Većina pasa može učiti s strpljenjem. Anksiozni psi mogu potrajati duže. Nikada ne forsirajte uplašenog psa na dasku — to stvara negativne asocijacije.
