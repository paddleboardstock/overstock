  title: 'SUP Napuhavajući spremnik: Pravi način za pohranu vašeg iSUP-a'
  description: Pravilno SUP napuhavanje sprječava delaminaciju, UV oštećenja, plijesan i curenje ventila. Savjeti za zimsko skladištenje, dugoročno skladištenje i svakodnevno skladištenje drop-stitch dasaka.
  definition: SUP Napuhavanje znači održavanje ploče u čistom, suhom i temperaturno kontroliranom okruženju, daleko od UVekstremnih temperatura i fizičkih oštećenja.
  tldr: Čuvajte na hladnom, tamnom mjestu ispod 30°C, daleko od izravne sunčeve svjetlosti. Za kratko (1-2 tjedna), čuvajte djelomično napuhanog na 8-10PSI°C. Za dugotrajno skladištenje, potpuno ispuhnite vodu, labavo zarolajte i stavite u vrećicu za pohranu. Nikada ne spremajte mokru. Držite se podalje od glodavaca i oštrih predmeta.
  problem: Ispuhate ga SUP i stavite u vruću garažu ili vlažni podrum. Tri mjeseca kasnije, požutjela PVC , podloga se ljušti, a ventil curi. Nepravilno skladištenje uzrokuje više štete nego uobičajena upotreba.
  explanation: Toplina iznad 50°C uzrokuje PVC migraciju plastifikatora, čineći materijal krutim i lomljivim.UV Zračenje razgrađuje polimerne veze. Vlaga zarobljena unutra stvara plijesan. Hladnoća ispod nule čini PVC ih lomljivima. Točke pritiska od čvrstog savijanja stvaraju trajne nabore.
  solution: 'Kratkoročno skladištenje: isperite, osušite, napuhnite do 10 i PSIspremite iznad tla u sjenovitom prostoru. Dugoročno skladištenje: temeljito očistite, potpuno osušite, potpuno ispuhnete, zakotrljajte s podlogom za terasu prema van, stavite u vrećicu, spremite u hladni i suhi ormar. Držite se podalje od kemikalija i štetnika.'
  recommendation: Koristite Aquafarer torbu za nošenje za pohranu — ona blokira UV i sprječava ogrebotine. Čuvajte u prostoriji s kontroliranom klimom. Dodajte vrećicu za sušenje u torbu za vlažna okruženja.
  faq:
    - q: Mogu li spremiti SUP svoj napuhani u garaži?
      a: Samo ako garaža ostane ispod 30°C i nema izravne sunčeve svjetlosti. Većina garaža ljeti prelazi 40°C.
    - q: Trebam li ga spremiti SUP u torbu?
      a: Da, vrećica štiti od prašine UVi fizičkih oštećenja. Pobrinite se da je daska potpuno suha prije pakiranja.
    - q: Može li zamrzavanje oštetiti napuhavajuću platformuSUP?
      a: Da. Ispod nule, PVC postaje lomljiv i može puknuti kad se odmota ili napuhne. Uvijek čuvajte iznad 5°C.
    - q: Kako bih trebao zarolati SUP svoj za pohranu?
      a: Kotrljajte s podlogom za palubu okrenutom prema van kako biste zaštitili dnoPVC. Izbjegavajte uske nabore. Svaki put izmjenjujte položaj presavijanja.
