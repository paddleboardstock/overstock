    - q: Je li prsluk udoban za dugotrajno nošenje?
      a: Paneli od pjene su oblikovani kako bi se smanjila zapremina. Mrežasta drenaža i podesivo pristajanje poboljšavaju udobnost tijekom duljeg nošenja.
    - q: Mogu li djeca koristiti ovaj prsluk?
      a: Nije za malu djecu. Ovaj prsluk je namijenjen odraslima i mladima težim od 40 kg.Aquafarer Preporučuje PFD specifične za djecu za mlađe korisnike.
