  title: 'Njega ronilačkog odijela: Neka vaš neopren traje 2 puta duže'
  description: Pravilna njega ronilačkih odijela produžuje vijek trajanja od 1 do 3 sezone+. Savjeti za ispiranje, sušenje, skladištenje i popravak neoprenskih odijela. Izbjegavajte uobičajene pogreške koje prerano uništavaju ronilačka odijela.
  definition: Njega ronilačkog odijela uključuje ispiranje svježom vodom nakon svake upotrebe, sušenje od izravnog sunčevog svjetla, spremanje ravnog ili obješenog na širokom vješalici te povremeno čišćenje radi uklanjanja soli, bakterija i neugodnih mirisa.
  tldr: Isperite ronilačko odijelo iznutra i izvana svježom vodom odmah nakon svake sesije. Osušite ga iznutra prema van u hladu na širokom plastičnom vješalici. Čuvajte ga ravno ili složeno na hladnom, suhom mjestu. Nikada ne ostavljajte ronilačka odijela na izravnom suncu, u vrućim automobilima ili sušilicama. Koristite šampon za ronilačko odijelo svakih 5-10 tretmana.
  problem: Nakon jedne sezone, vaše ronilačko odijelo zamiriše, neopren je izgubio elastičnost, šavovi se ljušte, a patentni zatvarači se lijepe — sve se može spriječiti pravilnom njegom.
  explanation: Kristali soli se utapaju u neopren i određuju materijal. Bakterije se množe u vlažnim unutrašnjostima, stvarajući neugodne mirise i razgrađujući neopren.UV Degradira najlonski premaz. Toplina iznad 50°C uzrokuje delaminaciju. Nepravilno sušenje iskrivljuje neopren i opterećuje spojeve.
  solution: 'Nakon svake sesije: temeljito isperite iznutra i izvana, okrenite naopako-van, objesite široku plastičnu vješalicu u hladu. Kad se osuši, okrenite desno prema van i spremite ravno. Svakih 5-10 sesija: operite šamponom za ronilačko odijelo. Mjesečno: podmazite patentni zatvarač voskom za patentni zatvarač.'
  recommendation: Koristite Aquafarer šampon za ronilačko odijelo za čišćenje i Aquafarer vosak za patentne zatvarače za održavanje patentnih zatvarača. Čuvajte na Aquafarer širokom vješalici u mrežastoj vrećici.
  faq:
    - q: Mogu li staviti svoj ronilački odijelo u perilicu rublja?
      a: Ne preporučuje se — pranje u perilici oštećuje neopren. Ako morate, koristite gentle cycle, hladnu vodu i mrežastu vrećicu.
    - q: Kako da uklonim miris iz svog ronilačkog odijela?
      a: Namočite u hladnoj vodi s šamponom za ronilačko odijelo ili bijelim octom 30 minuta. Temeljito isperite.
    - q: Kako bih trebao osušiti svoje neoprensko odijelo?
      a: Naopako, u hladu, na širokom, podstavljenom plastičnom vješalici. Izbjegavajte izravno sunce i metalne vješalice.
    - q: Mogu li popraviti poderano ronilačko odijelo?
      a: Male poderotine ispod 1\" mogu se popraviti neoprenskim cementom i flasterom. Veće poderotine mogu zahtijevati profesionalni popravak.
