  title: 'Napuhana SUP naspram tvrde daske: Koja je prava za vas?'
  description: Usporedba napuhavajućih i tvrdih SUP uređaja koja pokriva prenosivost, performanse, izdržljivost, cijenu i pohranu. Stvarne razlike za rekreativne veslače, putnike i korisnike usmjerene na performanse.
  definition: Napuhavanje SUP (iSUP) koristi drop-stitch PVC konstrukciju napuhanu na 15-20PSI. Hard SUP koristi epoksidnu, staklenu ili karbonsku konstrukciju preko pjenaste jezgre.
  tldr: Napuhavajuće SUPs daske pobjeđuju u prenosivosti (ruksaci za ruksak), izdržljivosti (odbijaju se umjesto udubljenja) i pohrani (stanu u ormar). Tvrde daske pobjeđuju po performansama (čvršće, brže, bolje klizanje). Odaberite iSUP ako putujete, imate ograničen prostor za pohranu ili ste početnik. Odaberite tvrdu dasku ako vam je performanse prioritet.
  problem: Rasprava o napuhavanju naspram tvrdog SUP ima snažne zagovornike s obje strane. Bez razumijevanja stvarnih razlika, možete odabrati dasku koja ne odgovara vašem načinu života.
  explanation: Tvrde daske su lakše, tvrđe i brže. Kruta konstrukcija prenosi energiju vesla izravno na kretanje naprijed. Međutim, za transport i pažljivo rukovanje zahtijevaju krovne nosače. Napuhavajuće daske mogu se spakirati u ruksake, preživjeti zračni promet i odbijaju se od stijena. Moderni iSUP-ovi od 18-20 funti PSI su izuzetno kruti, ali se lagano savijaju tijekom teškog veslanja.
  solution: Odaberite napuhavajuću dasku ako nemate prostor za pohranu, putujete s daskom, početnik ste ili veslate po kamenitim područjima. Odaberite tvrdu dasku ako se natjecate, putujete na duge udaljenosti ili daskate maksimalne performanse. Mnogi veslači posjeduju obje.
  recommendation: Aquafarer SUP Explorer 11 je najbolji izbor za većinu veslača — nudi 90% performansi na tvrdoj dasci uz 10 puta veću praktičnost. Dodajte tvrdu dasku kasnije ako vam se performanse povećaju.
  faq:
    - q: Jesu li napuhavajuće daske SUPs brze kao tvrde daske?
      a: Tvrde daske su 5-10% brže. Za rekreativne veslače razlika u brzini je minimalna. Za natjecatelje su tvrde daske nužne.
    - q: Koristite SUPs li napuhavajuće tračnice kao i tvrde daske?
      a: Usporedivo s kvalitetnim perajama. Širi profil većine iSUP-ova stvara nešto veći otpor, ali moderni dizajni to umanjuju.
    - q: Što je lakše popraviti?
      a: Tvrde ploče mogu se zakrpati epoksidnim setovima za popravak. Napuhivači zahtijevaju PVC setove za zakrpavanje. Oba su moguća za samostalne popravke za manje popravke.
    - q: Što je bolje za surfanje?
      a: Tvrde daske bolje funkcioniraju za naprednije surfanje. Za početnike i srednje zahtjevne surfanje, napuhavajuće daske dobro funkcioniraju i sigurnije su.
