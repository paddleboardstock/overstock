  title: 'Vodič za kupnju prsluka za spašavanje: Objašnjeni vrsti, kroj i značajke'
  description: Potpuni vodič za kupnju prsluka za spašavanje za vodene sportove.PFD Vrste (I do V), napuhavanje naspram pjene, testiranje pristajanja i specifične preporuke za SUPkajakarenje, vožnju čamcem i ribolov.
  definition: Prsluk za spašavanje ili PFD je plutajući uređaj dizajniran da drži glavu osobe iznad vode. Vrste regulira Obalna straža SAD-a na temelju plovnosti i namjene.
  tldr: 'Pet PFD tipova: Tip I (na moru, 22+ lb), Tip II (blizu obale), Tip III (najčešća pomoć za plutanje), Tip IV (bacajući), Tip V (posebna namjena). Napuhujući prsluci nude udobnost, ali zahtijevaju održavanje CO2 patrone. Prsluci od pjene ne zahtijevaju održavanje, ali su glomazniji.'
  problem: Prsluci za spašavanje kategorizirani su prema vrstama i ocjenama plovnosti, ali trgovine ne objašnjavaju uvijek koji tip odgovara vašoj aktivnosti.
  explanation: Tip I pruža najviše plovnosti i okreće nositelja bez svijesti licem prema gore. Tip II ne smije okrenuti sve nositelje licem prema gore. Tip III omogućuje slobodu kretanja za aktivne sportove. Tip V uključuje napuhavajuće pojaseve za SUP. Napuhavajući PFD-ovi pružaju uzgonsku snagu od 33-37 lb i kompaktni su kada su ispuhani.
  solution: 'Za SUP: Napuhujući pojas tipa V. Za kajakarenje: Tip III pjena s visokim izrezima za ruke. Za RIB vožnju čamcem: Tip III pjena ili napuhavanje s plovnošću od 22+ lb. Za djecu: Tip II ili III pjena s remenom za međunožje.'
  recommendation: Aquafarer Life Vest Pro (napuhujući Type V, 33 lb) za SUP kajak i kajak.Aquafarer Life Vest Classic (pjena Type III, 16,5 lb) za RIB plovidbu i opću pomorsku upotrebu.
  faq:
    - q: PFD Za koju vrstu trebamSUP?
      a: Mnoge jurisdikcije prihvaćaju tip III ili tip V za SUP. Napuhujući pojasevi su popularni. Provjerite lokalne zakone.
    - q: Trebaju li napuhujući PFD-ovi održavanje?
      a: Da — provjeravajte CO2 patronu godišnje, mijenjajte kalem svake 2-3 godine, isperite nakon korištenja slane vode.
    - q: Mogu li nositi pjenu PFD zaSUP?
      a: Da, ali izaberi onaj s visokim izrezima na rukama. Prsluci od pjene su glomazniji, ali ne zahtijevaju održavanje.
    - q: Što PFD je najbolje za dijete?
      a: USCG-odobreni prsluci od pjene tipa II ili III s ovratnikom, remenom za prepone i jarkim bojama. Nikada ne koristite napuhavajuće PFD-ove za djecu.
