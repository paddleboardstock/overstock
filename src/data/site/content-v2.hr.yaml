  title: 'Vodič za veličinu daske za veslanje: Volumen, duljina i širina za svakog vozača'
  description: Kompletna veličina daske za veslanje s preporučenim volumenom prema težini i aktivnosti. Uključuje jednostavnu tablicu veličina za više, turistike, surfanje i joga SUP daske.
  definition: Veličina daske za veslanje određuje se volumenom (nosivost težine i plovnost), duljinom (brzina i praćenje), širinom (stabilnost) i debljinom (raspodjela volumena i otpor zraka).
  tldr: 'Koristite težinu za minimalni volumen: 50-70 kg treba 220-260L, 70-90 kg treba 260-300L, 90-110 kg treba 300-350L, 110+ kg treba 350L+. Za početnike, dodajte 20% na ove brojke. Širina je važna: 32" je srednja, 33-34" je prilagođena početnicima, 35"+ je vrlo stabilna.'
  problem: Popisi veličina dasaka za veslanje koriste stope, inče i litre naizmjenično, što otežava usporedbu među markama.
  explanation: Volumen je najizravniji pokazatelj nosivosti — 1 litra slatke vode istisne 1 kg težine. Daska s 260L teoretski može podnijeti 260 kg, ali praktični kapacitet je manji jer daska mora stajati iznad vode. Vaša ukupna težina (tijelo plus oprema) trebala bi biti 30-40% volumena daske.
  solution: Volumen cilja = (tjelesna težina u kg + , težina opreme u kg) x 3. Za veslača od 75 kg s opremom od 5 kg, cilj = minimalno 80 x 3 = 240L. Za početnike, pomnožite s 3,5. Za napredne, pomnožite s 2,5.
  recommendation: Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") odgovara većini vozača od 50-100 kg. Lakši vozači mogu odabrati veličinu AirDeck do 270. Teži vozači trebali bi razmotriti SUP Tour 12 (300L+) ili šire daske.
  faq:
    - q: Je li visina bitna za SUP veličinu?
      a: Visina je manje važna od težine. Visoki lagani vozač treba manje volumena nego niski, teži jahač. Koristi težinu kao primarni faktor volumena.
    - q: Što se događa s prevelikom količinom?
      a: Daska sjedi previsoko, hvata vjetar kao jedro. Osjeća se ljepljivo u valovitom položaju. Međutim, za početnike je veći volumen bolji nego premali.
    - q: Što se događa s premalim volumenom?
      a: Daska sjedi preduboko, stvarajući otpor. Nos se može potopiti tijekom veslanja (pearling). Brzo se umaraš od veslanja po djelomično potopljenoj dasci.
    - q: Trebaju li napuhavajuće daske drugačije veličine od tvrdih dasaka?
      a: Ne značajno. Napuhivači na 15 stupnjeva+ PSI istiskuju vodu slično kao tvrde daske. Preporuke za volumen jednako vrijede za obje vrste.
