  title: 'Održavanje napuhanih čamaca: sačuvajte svoju investiciju'
  description: Godišnji popis održavanja napuhavajućih čamaca. Čišćenje, UV zaštita, inspekcija šavova, upravljanje tlakom, održavanje motora i priprema PVC Hypalon za zimu za brodove.
  definition: Održavanje napuhavajućih čamaca uključuje čišćenje, UV zaštitu, upravljanje tlakom, inspekciju spojeva i ventila, sprječavanje plijesni i pravilno skladištenje izvan sezone.
  tldr: Isperite nakon svake upotrebe u slanoj vodi. Nanesite UV zaštitni gel svakih 2-3 mjeseca. Prije svakog izlaska provjerite tlak napuhavanja. Mjesečno pregledajte spojeve, ventile i krmu. Čistite blagim sapunom. Spremajte ispuhane na hladno i suho mjesto izvan sezone.
  problem: Koristili ste svoj napuhani čamac cijelu sezonu, a sada cijevi izgledaju izblijedjelo, šav curi, a krma djeluje spužvasto — sve to se može spriječiti redovitim održavanjem.
  explanation: UV Zračenje razgrađuje polimernu matricu. Slana voda kristalizira u naborima i brusi tkaninu. Plijesan raste u zarobljenoj vlazi. Neispravan tlak uzrokuje zamor materijala. Krma (posebno šperploča) upija vodu kroz rupe za vijke.
  solution: 'Nakon svake upotrebe: isperi svježom vodom, osuši, provjeri tlak. Mjesečno: obriši cijevi UV zaštitom, pregleda spojeve, vrati ventil. Godišnje: dubinsko čišćenje, pregled krme truljenja, podmazivanje ventila, testiranje na mikrocurenja.'
  recommendation: Koristite 303 Aerospace Protectant na Aquafarer cijevima za čamce. Uklonite ventile i nanesite silikonsku mast jednom godišnje. Čuvajte je u torbi za nošenje s ruksakom za sušenje.
  faq:
    - q: Mogu li koristiti izbjeljivač za čišćenje svog napuhavajućeg čamca?
      a: Ne — izbjeljivač oštećuje tkaninu. Koristite blagi sapun i toplu vodu. Za plijesan koristite razrijeđeni bijeli ocat.
    - q: Koliko često bih trebao tretirati UV zaštitnim sredstvom?
      a: Svaka 2-3 mjeseca tijekom sezone korištenja. Češće u tropskim klimama.
    - q: Trebam li ispuhati čamac između korištenja?
      a: Ne ako se koristi tjedno. Ostavite napuhan s UV poklopcem. Za mjesečne praznine, ispuhnite i spremite.
    - q: Kako održavam krmu?
      a: Provjeravajte vijke mjesečno. Jednom godišnje zapečatite izložene drvene rubove morskim lakom. Zamijenite ako se pojave mekana mjesta.
