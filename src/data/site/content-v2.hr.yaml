  definition: SUP Veličina se definira duljinom (brzina i klizanje), širinom (primarna stabilnost), debljinom (sekundarna stabilnost i volumen) i volumenom u litrama (ukupni nosivost).
  tldr: 'SUPsSveukupno: 10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Valovi: 8''-10'' x 30"-32" (140-220L). Početnici trebaju širinu veću od 32" i volumen koji premašuje tjelesnu težinu za 60-80L. Vaša težina u kg plus 60L je minimalni cilj za stabilnost.'
  problem: Svaki SUP brend navodi daske u stopama, inčima i litrama, ali ako ne znate kako se te mjere prenose na stvarni dojam, riskirate da kupite dasku koja je nagnuta, spora ili ne može podnijeti vašu težinu.
  explanation: 'Duljina određuje koliko brzo daska vesla i koliko dobro prati u ravnoj liniji. Duže daske (12''+) klize između zaveslaja i drže liniju. Kraće daske (ispod 10'') lako se okreću, ali zahtijevaju češće prebacivanje paddle-a. Širina određuje osnovnu stabilnost — stabilnost u stajanju. Daska od 30" početnicima djeluje lagano; 34" djeluje kao dock. Debljina određuje volumen — deblja daska lebdi više, ali hvata više vjetra. Volumen u litrama je najbolji pokazatelj: opterećena daska (ti plus oprema) treba potopiti 2-4 inča u mirovanju.'
  solution: 'Uskladite dimenzije daske s tri faktora: vaša težina (određuje minimalni volumen), vaša primarna aktivnost (određuje duljina) i razina vještine (određuje širinu). Za početnike, pomnožite težinu u kg s 2,2 da dobijete minimalni broj litara. Za srednje teže, pomnožite s 1,8. Za napredne, pomnožite s 1,4.'
  recommendation: Aquafarer SUP Explorer 11 dimenzija 11' x 33" x 6" s 260L odgovara većini vozača do 100 kg za veslanje. Nadogradite na SUP Tour 12 dimenzija 12' x 31" za bolju touring brzinu i klizanje.
  faq:
    - q: SUP Koju veličinu trebam za svoju težinu?
      a: 'Za vozače ispod 70 kg: 10-11'' x 32" (220-260L). Za 70-90 kg: 11-12'' x 33" (260-300L). Za 90-110 kg: 11-12'' x 34" (300-350L). Za više od 110 kg: 12'' x 34-36" (350L+).'
    - q: Je li duži SUP brži?
      a: Da. Duže daske imaju bolji omjer duljine i širine, što smanjuje otpor. 14' touring SUP je znatno brži od 11' univerzalne daske pri istom naporu veslanja.
    - q: SUP Koja širina je stabilna za početnike?
      a: 33-34 inča je idealna za početnike do 90 kg. Ispod 32" potrebna je dobra ravnoteža. Iznad 34" je vrlo stabilno, ali sporije i teže veslati na vjetru.
    - q: Mogu li koristiti univerzalnu dasku za turneje?
      a: Da, za kratke ture ispod 10 km. Za duže udaljenosti, posebna turistička daska bolje prati i učinkovitije pokriva udaljenost.
