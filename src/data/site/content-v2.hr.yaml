  title: 'Popravak ronilačkog odijela: Popravite poderotine, šavove i patentne zatvarače sami'
  description: DIY vodič za popravak neoprenskog odijela za poderotine neoprena, razdvajanje šavova, zatvaranja patentnih zatvarača i podijeljene štitnike za koljena. Upute korak po korak koristeći neopren ljepilo.
  definition: Popravak ronilačkog odijela uključuje čišćenje i grubljenje oštećenog područja, nanošenje neopren cementa i očvršćavanje pod pritiskom kako bi se vratila vodonepropusnost i fleksibilnost.
  tldr: 'Male poderotine ispod 1": nanesite neopren cement na obje strane, pričekajte 10-15 minuta dok ne postane ljepljivo, čvrsto pritisnite i stvrdnjavajte pod težinom 12 sati. Veće poderotine zahtijevaju neopren flaster. Problemi s patentnim zatvaračem: prvo podmažite, pa provjerite ima li začepljenja tkanine.'
  problem: Tvoje ronilačko odijelo ima malu poderotinu, šav koji se odvaja ili patentni zatvarač koji se zalijepi. Bez samostalnog popravka plaćaš 150 dolara+ za zamjenu, a popravak košta 5 dolara.
  explanation: Neoprenski cement djeluje tako da omekša površinu neoprena, stvarajući kemijsku vezu dok otapalo isparava. Cement se mora nanijeti na obje površine i postati ljepljiv prije spajanja. Za poderotine, rubovi moraju biti precizno poravnati. Problemi sa patentnim zatvaračima često su korozija od soli ili tkanina zaglavljena u zubima.
  solution: 'Za poderotine: očisti alkoholom, lagano izbrusi, nanesi tanak sloj cementa na oba ruba, pričekaj dok ne postane ljepljivo, savršeno pritisnu, primijeni težinu, stvrdni 12-24 sata. Za zakrpe: izreži dio 1" veći od kidanja, nanesi cement na oba, stegni. Za patentni zatvarač: isperi, nanesi vosak za patentni zatvarač, radi nježno.'
  recommendation: Aquafarer Držite komplet za popravak ronilačkog odijela u torbi za opremu. Za veće popravke ili kvarove šavova na kritičnim mjestima preporučuje se profesionalni popravak.
  faq:
    - q: Mogu li koristiti super ljepilo na ronilačkom odijelu?
      a: Ne — super ljepilo se suši tvrdo i lomljivo. Za popravke neoprenskih odijela koristite samo neopren cement ili aquaseal.
    - q: Koliko dugo traje popravak neopren cementa?
      a: Pravilno izveden popravak često je jači od originalnog neoprena i traje cijeli vijek trajanja odijela.
    - q: Mogu li popraviti patentni zatvarač koji se potpuno odvojio?
      a: Ako se staza odvojila od neoprena, ponovno zalijepite kontaktnim ljepilom. Ako su zubi oštećeni, profesionalno zamijenite patentni zatvarač.
    - q: Kako da popravim curenje u odijelu za ronilačko odijelo na spoju?
      a: Nanesite tanku kapljicu aquaseala duž unutrašnjosti propuštajućeg spoja i ostavite da se suši 24 sata.
