- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Što odjenuti za surfanje (nemojte dolaziti u kratkim hlačama kad vam treba 5/4)
  description: Prestani nagađati što obući. Temperatura vode, a ne temperatura zraka, određuje tvoju surf odjeću. Potpuni vodič za slojevito nošenje od tropskih rash guardova do punih zimskih 5/4/3mm setova.
  definition: Odjeća za surfanje varira od kratkih hlačica i rash guarda u toploj vodi do punih 5/4/3mm ronilačkih odijela s čizmama i kapuljačama u hladnoj vodi. Temperatura vode, a ne zraka, određuje što vam treba.
  tldr: Ono što nosite na surfanju u potpunosti ovisi o temperaturi vode — a ne o temperaturi zraka. Rash štitnici i kratke hlače rade iznad 22°C, opružna odijela pokrivaju 18-22°C, puna 3/2 mm odijela mogu podnijeti 14-18°C, a 5/4/3 mm s čizmama je potrebno ispod 14°C. Uvijek nosite UV zaštitu i razmislite o povodcu i prsluku za udar.
  problem: Stigneš na plažu i nemaš pojma je li rashguard dovoljan ili ti treba cijelo ronilačko odijelo. Temperatura zraka je topla, ali voda hladna, ili voda je u redu, ali vjetar je leden. Pogrešno odijevanje znači uništenu sesiju.
  explanation: 'Odjeća za surfanje ima tri svrhe: toplinsku izolaciju UV , zaštitu i sprječavanje habanja. Neopren ronilačka odijela ocjenjuju se prema debljini i pokrivenosti — opružna odijela (kratke ruke ili noge) namijenjena su danima na granici, a kompletna odijela za hladnu vodu. Rash guardovi štite od osipa na dasci i sunca, ali ne nude toplinsku vrijednost. Čizme, rukavice i kapuljače nisu dodaci, već osnovna oprema za surfanje u hladnoj vodi ispod 12°C.'
  solution: 'Prije izlaska provjerite lokalni izvještaj o temperaturi plutača ili žive vode. Sastavite komplet prema najhladnijim tipičnim uvjetima: rash guard i kratke hlače za ljeto, 3/2mm kompletno odijelo za proljeće i jesen, 5/4/3mm s čizmama i kapuljačom za zimu. Uvijek dodajte povodac i razmislite o prsluku za pplutanje radi sigurnosti.'
  recommendation: Prvo uložite u dobar 3/2mm kompletan odijelo — pokriva najširi raspon uvjeta. Dodajte 5/4/3mm odijelo i čizme ako planirate surfati zimu. Aquafarer Ronsko odijelo Pro s termalnim mostovima učinkovito pokriva oba temperaturna raspona.
  faq:
    - q: Mogu li surfati samo u daskama?
      a: Da, u tropskoj vodi iznad 24°C. Možda će ti trebati rash guard kako bi spriječio trljanje prsa i ruku od veslanja. Vosak ili trakcioni jastučić na dasci pomažu nadoknaditi nedostatak prianjanja odijela.
    - q: Trebam li surf čizme?
      a: Ako temperatura vode padne ispod 14°C, čizme sprječavaju utrnulost i štite stopala od stijena i posjekotina na grebenu. Također povećavaju prianjanje na dasci. Većina surfera u sjevernim krajevima koristi čizme od studenog do ožujka.
    - q: Što je opružno odijelo?
      a: Spring suit je odijelo s kratkim ili kratkim nogama (ili oboje) dizajnirano za vodu između 18°C i 22°C. Pruža više topline od rash guarda, ali manje pokriva od punog odijela.
    - q: Trebam li nositi prsluk za spašavanje dok surfam?
      a: Nisu to tradicionalni prsluci za spašavanje, ali prsluk ili pomoć za plutanje mogu pomoći u teškim uvjetima ili ako ste slab plivač.Aquafarer Prsluci za spašavanje su dizajnirani za SUP kajakarenje, ali mogu pružiti dodatnu sigurnost u plutanju početnicima u surfanju.
