  title: 'SUP Vodič za veslanje: Odaberite pravo veslo za svoj stil'
  description: Potpuni vodič za SUP vesla — duljina, materijali (aluminij, staklena vlakna, karbon), oblici lopatica i kako izbor lopatica utječe na vaše iskustvo veslanja.
  definition: SUP Veslo se sastoji od osovine (aluminij, stakloplastika ili karbon) i lopatice (dihedralna, lopatica ili ravna). Duljina bi trebala biti 8-10" iznad vaše visine za opće veslanje.
  tldr: 'Duljina vesla: 8-10" iznad vaše visine za višenamjensku upotrebu, 6-8" za surfanje, 10-12" za touring. Materijali: aluminij (jeftin, težak), stakloplastika (srednji raspon, dobar fleksibilan), karbon (lagan, krut, skup). Oblik lista: dihedral (stabilno praćenje), scoop (snaga), ravan (svestran). Podesive lopatice su odlične za početnike.'
  problem: Priložena lopatica s većinom iSUP-ova radi, ali je teška i neučinkovita. Nadogradnja poboljšava učinkovitost i užitak u veslanju, ali opcije su zbunjujuće.
  explanation: 'Duljina lopatica utječe na učinkovitost hoda — prekratko zahtijeva savijanje, predugo uzrokuje zamor ramena. Materijal određuje težinu: karbonske lopatice su 18-24 oz naspram 28-36 oz za aluminij. Veličina lopatica utječe na snagu: veće lopatice (100+ sq in) pružaju više pogona po zaveslaju, ali brže se umaraju. Dihedralne lopatice prate ravno; lopatice s lopaticama pružaju veći zahvat.'
  solution: 'Za ispravnu duljinu: stani s veslom okomito, ruka podignuta — drška reketa treba dodirivati zapešće. Za materijal: počni s fiberglasom kao nadogradnjom srednje težine. Za lopaticu: izaberi dihedral za opće veslanje. Za aktivnosti: touring vesla su duža s manjim lopaticama; surf vesla su kraća s širim lopaticama.'
  recommendation: Aquafarer Karbonska lopatica od 28 oz najbolja je nadogradnja za česte veslače. Priložena podesiva aluminijska lopatica od 3 dijela dovoljna je za početnike i putovanja.
  faq:
    - q: Koliko bi SUP moja lopatica trebala trajati?
      a: Mjeri visinu u inčima i dodaj 8-10 za sveukupno veslanje. Za surfanje dodaj 6-8. Za touring 10-12.
    - q: Je li karbonska lopatica vrijedna novca?
      a: Da, za redovite veslače — smanjenje težine značajno smanjuje umor tijekom dugih treninga. Za povremenu upotrebu, staklena vlakna su dobra vrijednost.
    - q: Što je podesiva lopatica?
      a: Veslo od 2 ili 3 dijela s prilagodbom duljine, idealno za dijeljenje između korisnika ili prilagodbu za različite aktivnosti.
    - q: Kako da se brinem o svom veslu?
      a: Isperite svježom vodom nakon korištenja slane vode. Izbjegavajte vožnju po njoj ili skladištenje na izravnoj toplini. Provjerite spoj (ferrula) na pijesak.
