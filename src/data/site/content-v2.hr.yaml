- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm ronilačko odijelo: Što većina početnika pogriješi u hladnoj vodi'
  description: Prestanite se smrzavati usred treninga ili pregrijavati na plaži. Prava razlika između ronilačkih odijela od 3 mm i 5 mm — temperaturna tablica, kompromisi u fleksibilnosti i što zapravo funkcionira za surfanje na hladnoj vodi.
  definition: Neoprensko odijelo je neoprenski odjevni predmet koji zadržava tanak sloj vode na koži, koju tjelesna toplina zagrijava radi izolacije. Debljina (3 mm, 5 mm) određuje temperaturni raspon koji odijelo može podnijeti — deblje je toplije, ali manje fleksibilno.
  tldr: Debljina ronilačkog odijela izravno određuje toplinu i fleksibilnost. Koristite 3 mm za vodu iznad 16°C i 5 mm za vodu između 8°C i 16°C. Deblja odijela ograničavaju pokretljivost, ali vas dulje griju — uvijek dajte prednost pristajanju nad brendom.
  problem: Otvorite online trgovinu ili uđete u surf shop i vidite ronilačka odijela označena 3/2, 4/3, 5/4 i 5mm full suit. Brojevi ne znače puno dok ne shvatite da pogrešna debljina znači ili smrzavanje usred sesije ili pregrijavanje i znojenje na plaži.
  explanation: Neoprenska odijela djeluju tako da zarobljavaju tanak sloj vode između vaše kože i neoprena; vaše tijelo zagrijava tu vodu, stvarajući izolaciju. Deblji neopren zadržava više vode, ali ograničava fleksibilnost i plovnost. 3 mm odijelo (često 3/2 s tanjim rukama) odgovara blažim uvjetima, dok 5 mm (5/4/3 ili punih 5 mm) odgovara hladnoj vodi. Zatvarači na prsima bolje zatvaraju od zatvarača na leđima i smanjuju ispiranje. Konstrukcija šava — lijepljenje i slijepi šav (GBS) — razlika je između propuštajućeg i toplog odijela.
  solution: Uskladite debljinu s lokalnom temperaturom vode s marginom pogreške od 5°C. Za umjerene klime kupite 3/2 mm. Za hladnu vodu kupite 5/4/3 mm. Dodajte čizme, rukavice i kapuljaču kako biste proširili raspon za još 5°C prema dolje. Isprobajte odijela prije kupnje ili odaberite marku s velikodušnom politikom povrata.
  recommendation: Aquafarer Wetsuit Pro u 5/4/3mm idealan je za većinu surfera u hladnoj vodi, nudi GBS šavove i termalnu podstavu. Ako surfate u toploj vodi iznad 20°C, 3/2mm s patentnim zatvaračem na prsima je bolji izbor.
  faq:
    - q: Koja temperatura vode zahtijeva ronilačko odijelo od 5 mm?
      a: Temperature vode između 8°C i 14°C zahtijevaju odijelo od 5 mm. Ispod 8 °C treba vam odijelo s kapuljačom od 6/5/4 mm. Između 14°C i 18°C dobro funkcionira 4/3 mm za većinu ljudi.
    - q: Mogu li nositi ronilačko odijelo od 3 mm zimi?
      a: Samo u blagim zimskim klimama gdje voda ostaje iznad 16°C. Za pravo zimsko surfanje potrebno je 5 mm ili 5/4/3 mm. Čizme, rukavice i kapuljača dodaju ekvivalentnu toplinu bez potrebe za debljim trupom.
    - q: Koliko bi neoprensko odijelo trebalo biti usko?
      a: Tijesno, ali ne ograničavajuće. Ne bi smjelo biti zračnih džepova niti labavog neoprena. Ako možete prstom provući prst između kože i odijela na donjem dijelu leđa, prelabavo je. Ako je disanje teško ili je pokret jako ograničen, uzmite veću veličinu.
    - q: Drže li vas skupa ronilačka odijela toplijim?
      a: Viša cijena često znači bolji neopren (na bazi vapnenca naspram nafte), bolju konstrukciju šavova (GBS naspram samo zalijepljenih) i bolju fleksibilnost. Ovi čimbenici izravno utječu na toplinu i dugovječnost, ali samo ako je pravilno pristajanje.
