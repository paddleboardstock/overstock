- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Održavanje napuhavajućih SUP dasaka: Održavajte dasku dugotrajnom godinama'
  description: Pravilno održavanje napuhanih SUP dasaka značajno produžuje vijek trajanja daske. Čišćenje, sušenje, briga o ventilima, UV zaštita i sezonsko skladištenje drop-stitch paddle boardova.
  definition: Održavanje napuhavanja SUP uključuje čišćenje nakon upotrebe, pravilno sušenje, pregled ventila UV , zaštitu i pravilno skladištenje kako bi se spriječila delaminacija, plijesan, degradacija materijala i curenje zraka.
  tldr: Nakon svake sesije sa slanom vodom isperite ploču svježom vodom. Potpuno osušite prije ispuhavanja i skladištenja. Provjerite ventil na nečistoće i podmazite O-prsten jednom godine. Čuvajte napuhanog (na polaPSI) na hladnom, tamnom mjestu. Izbjegavajte UV dugotrajno izlaganje koje pogoršava stanjePVC. Odmah zakrpajte male rupe priloženim kompletom za popravak.
  problem: Nakon jedne sezone, vaš napuhivač SUP počinje polako curiti, podloga za terasu se ljušti na rubovima, a podloga je čvršća PVC . Zanemarivanje osnovnog održavanja uzrokuje prerano starenje koje se u potpunosti može spriječiti.
  explanation: PVC UV propadaju pod utjecajem zračenja. Kristali soli iz morske vode ulaze u spojeve i ventile, uzrokujući mikro-curenja. Vlaga zarobljena unutra potiče rast plijesni koja drop-stitch napada navoje. O-prstenovi ventila se suše i gube brtvu. Prljavština i pijesak se trljaju o ljepilo podloge palube, uzrokujući podizanje rubova.
  solution: 'Nakon svake sesije: isperite dasku, rebra i pumpu svježom vodom. Obrišite podlogu za terasu. Otvorite ventil za ispuštanje zarobljene vode. Osušite dasku u hladu prije ispuhavanja. Mjesečno: pregledajte ventil i nanesite silikonski lubrikant na O-prsten. Sezonski: operite blagim sapunom i vodom, provjerite ima li probušenosti.'
  recommendation: Slijedite Aquafarer vodič za njegu koji dolazi uz vašu dasku. Odmah upotrijebite komplet za popravak pri svakoj probušenoj gumi. Dasku spremite u vrećicu na mjestu s kontroliranom temperaturom, daleko od izravnog sunčevog svjetla.
  faq:
    - q: Mogu li ostaviti svoj napuhani SUP napuhan cijelu sezonu?
      a: Da, ali čuvajte izvan izravnog sunca i na pola maksimalno PSI (8-10PSI) kako biste smanjili opterećenje na šavovima. Potpuno napuhujte neposredno prije upotrebe.
    - q: Kako da očistim plijesan sa svojeSUP?
      a: Pomiješajte blagi sapun s toplom vodom i trljajte mekanom četkom. Za tvrdokornu plijesan koristite razrijeđenu otopinu bijelog octa (1:4). Izbjegavajte izbjeljivač.
    - q: Trebam li podmazati ventil?
      a: Da, godišnje. Ukloni jezgru ventila, nanesi silikonsku mast na O-prsten i ponovno postavi. To sprječava curenje zraka.
    - q: Kako da ga spremim SUP za zimu?
      a: Temeljito očisti i osuši. Potpuno ispuhni, valjaj labavo (izbjegavaj uske nabore) i čuvaj na hladnom, tamnom i suhom mjestu. Izbjegavaj temperaturu smrzavanja.
