  title: 'Sigurnost u hladnoj vodi: Veslanje i surfanje u hladnim uvjetima'
  description: Sigurnost u hladnoj vodi za SUPsurfanje i kajakarenje. Prepoznavanje hipotermije, odgovarajuća oprema, odgovor na hladni šok i hitne procedure za uranjanje u hladnu vodu.
  definition: Sigurnost u hladnoj vodi uključuje razumijevanje odgovora na hladni šok, kvara plivanja, hipotermije te opreme i tehnika za sprječavanje tih posljedica.
  tldr: Voda ispod 15°C zahtijeva ronilačko odijelo. Ispod 10°C potrebne su čizme, rukavice i kapuljača. Hladni šok uzrokuje nevoljno hvatanje zraka. Neuspjeh u plivanju događa se unutar 3-5 minuta u vodi ispod 10°C. Simptomi hipotermije uključuju drhtanje, zbunjenost i gubitak koordinacije.
  problem: Veslaš na sunčan dan nesvjestan da je voda 8°C. Upadneš u vodu, nehotice uzdahneš i osjetiš kako ti udovi utrnu u roku od nekoliko minuta. Hladna voda ubija brže od bilo koje druge opasnosti na oceanu.
  explanation: 'Uranjanje u hladnu vodu ima četiri faze: hladni šok (0-2 minute) — hvatanje zraka, hiperventilacija. Neuspjeh plivanja (3-15 min) — mišići se hlade, koordinacija otkazuje. Hipotermija (15-45 minuta) — temperatura trupa pada ispod 35°C što uzrokuje zbunjenost i srčani zastoj. Nakon spašavanja kolaps — hladna krv se vraća u središte.'
  solution: 'Provjerite temperaturu vode. Nosite ronilačko odijelo prilagođeno toj temperaturi. Nikada ne veslajte sami u vodi ispod 15°C. Nosite zviždaljku i telefon. Ako padnete: kontrolirajte disanje, brzo se vratite na dasku. Ako je prehladno, dajte znak za pomoć.'
  recommendation: Aquafarer Ronilačko odijelo Pro 5/4/3mm je minimum za vodu 8-14°C. Dodajte Aquafarer čizme od 5mm i rukavice od 3mm. Nosite Life Vest Pro za dodatnu toplinsku zaštitu.
  faq:
    - q: Koliko dugo mogu preživjeti u vodi od 10°C?
      a: Hladni šok traje 1-2 minute. Bez plutanja i toplinske zaštite, vrijeme preživljavanja je 30-60 minuta.
    - q: Koji su prvi znakovi hipotermije?
      a: Nekontrolirano drhtanje, zbunjenost, loša koordinacija, nejasan govor. Odmah zaustavite aktivnost i zagrijte se.
    - q: Kako se zagrijati nakon hladne vode?
      a: Skinite mokru opremu, osušite se, obucite tople slojeve uključujući kapu i rukavice. Pijte topla bezalkoholna pića.
    - q: Mogu li dobiti hipotermiju ljeti?
      a: Da — voda ispod 15°C pojavljuje se na mnogim mjestima čak i ljeti. Voda provodi toplinu 25 puta brže od zraka.
