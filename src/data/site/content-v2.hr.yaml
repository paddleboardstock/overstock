  type: tutorial
  title: 'SUP Vodič za sidrenje: Ostanite na mjestu tijekom ribolova ili fotografiranja'
  description: Potpuni vodič za SUP sidrenje — vrste sidra (gljivasta, preklopna, kolčić), postavka kolica za sidro, tehnike postavljanja i sigurnosni savjeti za ostajanje na mjestu.
  definition: SUP Sidro je uteg pričvršćen na uže koji drži dasku u položaju protiv vjetra i struje. Uobičajene vrste uključuju sidra u obliku gljiva, sklopiva sidra i stupove za promatranje.
  tldr: Koristite sidro za gljive (1,5-3 lb) za blatno ili pješčano dno, sklopivo sidro za kamenita dna, ili stake-out štap za plitke vode s mekanim dnom. Sidro treba biti 1,5-3 lb za mirne uvjete, 3-5 lb za vjetar i struju. Uvijek koristite kolica za sidro za podešavanje položaja i znati kada otpustiti.
  problem: Pronađete savršeno mjesto za ribolov, ali vjetar i struja vas svakih nekoliko minuta odnesu s pozicije. Bez sidrenja, SUP ribolov i fotografiranje su frustrirajuće vježbe stalnog premještanja.
  explanation: Sidro radi tako da vuče po dnu dok se ne zakači. Sidra za gljive zabijaju se u meka dna i pružaju dobar oslonac u pijesku i blatu. Preklopna sidra imaju peraje koje se zabijaju u tvrda ili kamenita dna. Stupovi za praćenje rade u plitkoj vodi tako da izravno guraju u dno.
  solution: Instalirajte sustav kolica za sidra (uže s kliznim prstenom na jednoj strani daske) za podešavanje točke pričvršćivanja sidra. Pričvrstite 50-75' užeta na sidro. Postavite užad uz vjetar ili uzlaznu struju željene pozicije. Koristite sustav za brzo otpuštanje za odvajanje u hitnim slučajevima. Nikada ne sidrite u jakoj struji ili tamo gdje ne možete lako izvući sidro.
  recommendation: Sklopivi sidro od 3 lb s 50' užeta odgovara za većinu SUP ribolovnih uvjeta. Dodajte sustav sidrišta pomoću D-prstenova na vašem Aquafarer SUP Explorer 11.
  faq:
    - q: Koju veličinu sidra trebam zaSUP?
      a: 1,5-3 lb za mirna jezera i spore rijeke. 3-5 lb za obalna područja s vjetrom ili strujom. Prevelika sidra je teško izvući.
    - q: Koliko sidrenog konopca mi treba?
      a: Teleskop 5:1 (5 stopa linije za svakih 1 stopu dubine) je standard. Na 10' dubine koristi 50' linije.
    - q: Je li sidrenje opasno SUPna ?
      a: Samo ako se učvrstite u struji ili vjetru dovoljno jakom da prevrne ploču. Uvijek koristite sustav za brzo otpuštanje koji se može odmah odvojiti.
    - q: Mogu li se usidriti u bilo kojoj vodi?
      a: Provjerite lokalne propise. Neka područja ograničavaju sidrenje radi zaštite morske trave ili morskih staništa. Nikada ne sidrite na koraljnim grebenima.
