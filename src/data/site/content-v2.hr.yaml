  title: Aquafarer Surfboard Pro (Pogodan za putovanja bez žrtvovanja performansi)
  description: Napuhujuća daska za surfanje koja se može spakirati u ruksak, ali se ponaša kao kruta longboard. 10'6" s volumenom od 75L, drop-stitch konstrukcija na 15 PSIi komplet dodataka uključen.
  definition: Aquafarer Surfboard Pro je drop-stitch napuhavajuća daska za surfanje visoka 10'6" s volumenom od 75 litara. Kombinira stabilnost longboarda s prenosivošću s ruksakom, napuhujući se do 15 za PSI čvrstoću usporedivu s pjenastim daskama.
  tldr: Aquafarer Surfboard Pro kombinira klasični oblik longboarda s drop-stitch modernom konstrukcijom na napuhavanje. Sa 10'6" i volumenom od 75 litara, vesla je poput longboarda, ali se može spakirati u ruksak. Prikladan je za početnike koji uče hvatati valove i srednje napredne osobe koje žele dasku pogodnu za putovanja.
  problem: Želite dasku za surfanje koja ne zahtijeva krovni nosač, stane u ormar u stanu i može izdržati rukovanje prtljagom u avionu. Tradicionalne tvrde daske trebaju nosače, prostor za pohranu i pažljivo rukovanje. Trebate nešto što ne kompromitira previše performanse.
  explanation: Drop-stitch Tehnologija napuhavanja koristi tisuće poliesterskih niti koje povezuju gornji i donji sloj daske, omogućujući njezino napuhavanje do 15-20 PSI za krutu platformu koja se po čvrstoći mjeri s epoksidnim daskama. Aquafarer Surfboard Pro koristi troslojnu PVC vanjsku oplatu s drop-stitch tkanom jezgrom, što daje dasku koja se minimalno savija i prati ravno. Dimenzije 10'6"x32"x6" pružaju stabilnost longboarda, dok zaobljeni pin tail omogućuje kontrolirane zavoje kad napredujete. Full-diamond-groove podloga za dasku osigurava prianjanje bez voska.
  solution: Napuhajte na 15 s PSI priloženom dvokomornom pumpom (3-4 minute), pričvrstite peraju priloženim alatom i imate dasku spremnu za surfanje. Kad sesija završi, ispuhnite dasku, kotrljajte se i spakirajte u priloženu torbu. Spremite je u ormar, prtljažnik automobila ili gornji pretinac za glavu.
  recommendation: Naručite Aquafarer Surfboard Pro za 549 dolara uključujući pumpu, torbu, povodac i komplet za popravak. Zamjenjuje i početničku pjenastu dasku i putnu dasku, štedeći vam novac i prostor za pohranu. Uparite je s Aquafarer Wetsuit Pro za kompletan komplet.
  faq:
    - q: Koliko je čvrst napuhujući Surfboard Pro?
      a: Na 15 godina PSI daska je vrlo kruta — usporediva s mekanom pjenastom daskom. Osjetit ćete određenu fleksibilnost tijekom oštrih zavoja, ali u 90 posto uvjeta surfanja radi kao tvrda daska. Dostupni su i skuplji modeli za napredne vozače koji žele veću krutost.
