  title: 'Popravak napuhavanja SUP : Popravak probušenih guma, curenja i problema s ventilima'
  description: Vodič za popravak napuhavanja DIY SUP . Kako pronaći sporo curenje, zakrpati probušenu gumu, zamijeniti ventil i popraviti delaminaciju podloge terase koristeći priloženi komplet za popravak.
  definition: Popravak napuhavanja SUP uključuje pronalaženje curenja zraka testiranjem sapunicom, čišćenje i grubljenje oštećenog područja, nanošenje PVC ljepila i zakrpe te stvrdnjavanje pod pritiskom.
  tldr: Pronađi curenja sapunicom. Očisti i grubo očisti područje oko uboda brusnim papirom. Nanesi PVC ljepilo na zakrpu i na ploču, pričekaj 5 minuta, čvrsto pritisni i stvrdni pod težinom 24 sata. Za curenje ventila prvo provjeri O-prsten. Mala probijanja ispod 1/4" su jednostavna samostalna rješenja.
  problem: Napuhujete svoj SUP i do jutra je izgubio tlak. Bez znanja o popravku, suočavate se s skupom zamjenom za ono što je vjerojatno jednostavna probušena guma.
  explanation: 'Većina napuhavajućih SUPs koristi drop-stitch jezgru s PVC vanjskim slojevima. Probijanje vanjskog PVC dijela stvara sporo curenje. Standardni popravak: očistiti, brusiti, nanijeti PVCljepilo kompatibilno s opterećenjem, pritisnuti zakrpu pod težinom. Propuštanja ventila su češća od probijanja panela — O-prsten se osuši ili nečistoće sprječavaju brtvljenje.'
  solution: Napuhajte ploču do maksimuma PSI i slušajte šištanje. Sustavno prskajte sapunicu, posebno oko spojeva i ventila. Označite mjehurićaste točke. Ispuhnite dasku, očistite alkoholom, brusite granulacijom 80, nanesite PVC ljepilo na zakrpu i dasku, pričekajte dok ne postane ljepljivo, pritisnite čvrsto, težina 24 sata.
  recommendation: Koristite Aquafarer komplet za popravak Aquafarer koji dolazi sa svim pločama. Uvijek nosite komplet za popravak na putovanjima. Za probleme s ventilima kontaktirajte Aquafarer podršku. Za velike poderotine ili odvajanja spojeva preporučuje se profesionalni popravak.
  faq:
    - q: Mogu li popraviti veliku pukotinu na svom napuhavačuSUP?
      a: Pukotine veće od 1\" mogu zahtijevati profesionalni popravak ili zakrpu s obje strane. Razdvajanja šavova duž tračnice ne mogu se pouzdano popraviti na terenu.
    - q: Koliko dugo traje popravna zakrpa?
      a: Pravilan popravak s ispravnom tehnikom traje cijeli vijek trajanja ploče. Loše prianjanje zbog nedovoljnog čišćenja dovodi do budućeg kvara.
    - q: Mogu li popraviti curenje ventila?
      a: Često da. Ukloni jezgru ventila, pregledaj O-prsten, očisti ili zamijeni, nanesi silikonski lubrikant i ponovno postavi.
    - q: Što ako ne mogu pronaći curenje?
      a: Napuhajte do kraja i uronite PSI dijelove sekvencijalno u kadi ili bazenu. Curenja koja su premala da bi se otkrila mogu biti povezana s temperaturom.
