  title: 'Uvjeti vjetra zaSUP: Kako vjetar utječe na vaše veslo'
  description: Kako brzina i smjer vjetra utječu na SUP veslanje. Razumijevanje vjetra s mora naspram kopna, čitanje prognoza vjetra, tehnike veslanja za vjetar i kada ostati na kopnu.
  definition: Uvjeti vjetra definiraju SUP sigurnost. Vjetar s mora (kopno prema moru) te gura dalje. Vjetar s kopna (s mora na kopno) gura te prema obali. Bočni vjetar uzrokuje da daska okreće.
  tldr: 'Maksimalni siguran vjetar za početnike: 10 čvorova. Srednji vjetar: 15 čvorova. Napredni: 20 čvorova. Vjetar s mora je najopasniji. Prvo veslaj uz vjetar. U bočnom vjetru, veslaj malo uz vjetar od odredišta. Klekni na jakom vjetru da smanjiš profil.'
  problem: Veslaš u mirnim uvjetima, ali 30 minuta kasnije vjetar se pojačao i teško se vraćaš. Vjetar je najpodcjenjeniji SUP sigurnosni faktor.
  explanation: Vjetar utječe SUP više nego na bilo koje drugo plovilo jer stojite, stvarajući efekt jedara. Vjetar od 10 čvorova stvara znatno veći otpor na veslaču u stojećem položaju nego na kajakašu koji sjedi. Vjetar s mora vas udaljava od sigurnosti. Bočni vjetar uzrokuje da nos okreće.
  solution: 'Provjerite brzinu i smjer vjetra prije veslanja. Koristite Beaufortovu ljestvicu: Sila 3 (7-10 čvorova) za početnike, sila 4 (11-16) za srednje brzine. Prvo veslajte uz vjetar. Ako vas uhvati vjetar s mora, veslajte pod kutom od 45 stupnjeva u odnosu na vjetar. Kleknite na jak vjetar.'
  recommendation: Koristi aplikaciju za prognozu vjetra (Windy, Windfinder) prije svake sesije. Aquafarer SUP Tour 12 bolje prati na vjetru nego na širim daskama. U vjetrovitim uvjetima koristi kraće zaveslaje i višu kadenciju.
  faq:
    - q: Koji smjer vjetra je najsigurniji za toSUP?
      a: Kopneni vjetar (koji puše prema kopnu) je najsigurniji — gura vas unatrag. Vjetroelektrani s mora su najopasniji.
    - q: Kako veslati na bočni vjetar?
      a: Veslaj više na strani uz vjetar kako bi spriječio drift. Nagnite dasku prema vjetru od odredišta. Dublja središnja peraja pomaže.
    - q: Mogu li veslati na vjetru od 20 čvorova?
      a: Samo ako su iskusne u zaštićenim vodama. Početnici ne bi smjeli veslati brzinom iznad 10 čvorova.
    - q: Kako udari vjetra utječuSUP?
      a: Udari vjetra stvaraju nagle probleme s ravnotežom. U naletima vjetra, spustite stav i budite spremni na nagle promjene.
