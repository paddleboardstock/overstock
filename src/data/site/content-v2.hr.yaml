  title: Zašto Aquafarer postoji (problem većine brendova vodenih sportova)
  description: Većina brendova vodenih sportova gradi za profesionalce, a ne za stvarne ljude.Aquafarer Postoji da bi proizvodila napuhavajuće daske i ronilačka odijela koja zaista odgovaraju vašem životu — prenosiva, izdržljiva i po pristupačnoj cijeni.
  definition: Aquafarer je brend napuhavajućih vodenih sportova osnovan na principu da izvrsna oprema treba biti prenosiva, izdržljiva i pošteno cijenjena. Fokusirajte se na drop-stitch daske i premium ronilačka odijela.
  tldr: Aquafarer osnovan je kako bi vodeni sportovi bili dostupni bez žrtvovanja kvalitete ili velikih troškova. Fokusiramo se isključivo na drop-stitch napuhavajuće daske i premium ronilačka odijela jer vjerujemo da je najbolja oprema ona koju zapravo koristite — a ništa se ne koristi više od opreme koja se lako sprema i pouzdano radi.
  problem: Oprema za vodene sportove postala je sve skuplja i specijaliziranija. Tvrde daske zahtijevaju prostor za skladištenje i prijevozna rješenja. Ronilačka odijela koštaju koliko i let. Surfanje ne SUP bi trebalo zahtijevati drugu hipoteku i garažu punu opreme.
  explanation: 'Tradicionalni surf i SUP brendovi grade prvenstveno za performanse, a tek onda za pristupačnost. Njihove daske dizajnirane su za napredne korisnike i prodaju se po premium cijenama uz pretpostavku da kupci već imaju prostor za pohranu, prijevoz i iskustvo.Aquafarer Počeli smo s drugačijim pitanjem: što ako bismo izradili opremu koja daje prednost upotrebljivosti u stvarnom svijetu — prenosivosti, izdržljivosti i vrijednosti — a da pritom pruži stvarne performanse? Odgovor je bio usmjerena linija proizvoda: napuhavajuće daske od vojne kvalitete drop-stitch PVC koje se mogu spakirati u ruksak, te ronilačka odijela s vrhunskim značajkama (GBS šavovi, termalna podstava) po srednjim cijenama. Ne izrađujemo sve — pravimo ono što je najvažnije za najveći broj ljubitelja vodenih sportova.'
  solution: 'Aquafarer Kompletni kompleti broda: Board, Pump, Torba, Povodac i Komplet za popravak — sve što vam treba za ulazak na vodu. Naša ronilačka odijela odgovaraju kvaliteti izrade marki koje koštaju 40 posto više. Izbjegavamo trikove, limitirane serije boja i godišnje osvježenje modela kako bi prošlogodišnja oprema postala zastarjela.'
  recommendation: Pregledajte Aquafarer cijelu kolekciju da vidite kako pristupamo svakoj kategoriji proizvoda. Pročitajte vodič za veličinu daske za surfanje i vodič za debljinu ronilačkog odijela za praktične savjete koji vrijede bez obzira na brend. Zatim isprobajte Aquafarer dasku i osjetite razliku koju namjerni dizajn donosi.
  faq:
    - q: Gdje Aquafarer se proizvodi proizvode?
      a: Aquafarer daske i ronilačka odijela dizajniraju se interno i proizvode u partnerstvu s certificiranim tvornicama u Vijetnamu i Kini koje su specijalizirane za drop-stitch konstrukciju i proizvodnju neopren odjeće.
    - q: Što ih razlikuje Aquafarer od drugih brendova napuhivača?
      a: Većina marki napuhavanja koristi PVC standardne i opće namjenedrop-stitch.Aquafarer koristi troslojnu vojnu opremu s PVC drop-stitch tkanom jezgrom, što rezultira većom krutošću i otpornošću na probijanje u odnosu na industrijske standardne napuhavajuće daske.
    - q: Aquafarer Nudi li jamstvo?
      a: Da — Aquafarer sve ploče dolaze s dvogodišnjim jamstvom protiv proizvodnih nedostataka. Ronilačka odijela nose jednogodišnje jamstvo. Opcije produženog jamstva dostupne su pri naplati.
    - q: Je Aquafarer li ekološki prihvatljiv brend?
      a: Radimo na tome. Naše ploče koriste PVC to što nije biorazgradivo, ali ih izrađujemo da traju 5+ godina, smanjujući ciklus zamjene. Naša ronilačka odijela koriste neopren na bazi vapnenca, koji ima manji utjecaj na okoliš od alternativa na bazi nafte. Emisije iz transporta nadoknađujemo provjerenim ugljičnim kreditima.
