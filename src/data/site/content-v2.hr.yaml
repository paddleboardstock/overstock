  solution: Napuhajte na 15-18PSI, pričvrstite priloženu središnju peraju i imate svestranu dasku. Širina od 33" pruža izvrsnu stabilnost. Koristite bungee sustav za opremu. Ruksak olakšava transport i skladištenje.
  recommendation: Za 599 dolara, SUP Explorer 11 je najbolja univerzalna napuhavajuća ploča SUP u svojoj klasi. Kupite je za jednu dasku koja može sve. Uparite je s Aquafarer Wetsuit Pro i Life Vet Pro.
  faq:
    - q: Je SUP li Explorer 11 prikladan za početnike?
      a: Da — širina od 33 inča i volumen od 260 L pružaju izvrsnu stabilnost. Početnici će se osjećati samouvjereno stojeći i veslajući.
    - q: Mogu li surfati s SUP Explorer 11?
      a: Da, u početničkim do srednjim uvjetima. Duljina 11' zahtijeva šire, sporije valove.
    - q: Koliko težine SUP Explorer 11 može podnijeti?
      a: Maksimalna težina vozača je približno 100 kg za optimalne performanse. Ukupni kapacitet je oko 120 kg.
    - q: Što je uključeno u kutiju?
      a: Daska, pumpa s dvije komore, podesiva lopatica s tri dijela, ruksak na kotačima, uvijeni povodac, uklonjiva središnja peraja i komplet za popravak.
