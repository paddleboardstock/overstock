  title: 'Kako odabrati ronilačko odijelo: objašnjenje pristajanja, debljine i značajki'
  description: Potpuni vodič za kupnju ronilačkog odijela. Kako odabrati pravu debljinu za temperaturu vode, osigurati pravilno pristajanje, razumjeti vrste šavova i odabrati značajke prema vašoj aktivnosti.
  definition: 'Neoprensko odijelo je neoprenski odjevni predmet koji pruža toplinsku izolaciju zarobljavanjem tankog sloja vode uz kožu. Ključni čimbenici odabira: debljina, kroj, konstrukcija šavova, ulazni sustav i vrsta neoprena.'
  tldr: 'Prilagodite debljinu prema temperaturi vode: 3/2 mm za 14-20°C, 4/3 mm za 12-18°C, 5/4/3 mm za 8-14°C, 6/5/4 mm za ispod 8°C. Krojenje je najvažniji faktor. GBS šavovi su zlatni standard. Prsni zatvarač smanjuje ispiranje. Vapnenački neopren je fleksibilniji od onih na bazi nafte.'
  problem: Online tablice veličina ronilačkih odijela su nepouzdane, preporuke za debljinu razlikuju se ovisno o marki, a opisi značajki su zbunjujući.
  explanation: Brojevi debljine ronilačkih odijela (3/2, 4/3, 5/4/3) odnose se na milimetre trupa/ruku i nogu. Deblja odijela su toplija, ali ograničavaju pokretljivost. Labava odijela ispire toplu vodu. GBS šavovi su topli i fleksibilni; šavovi s ravnim zatvaračem su manje topli. Ulaz na prsni zatvarač je topliji od zatvarača na leđima. Vapnenački neopren je fleksibilniji u hladnoj vodi.
  solution: Izmjerite prsa, struk, bokove i visinu. Usporedite s tablicama veličina. Odaberite debljinu prema najnižoj temperaturi vode. Odaberite GBS šavove za hladnu vodu. Preferirajte prsni zatvarač ispod 15°C. Razmislite o termalnoj podstavi za dodatnu toplinu.
  recommendation: Aquafarer Ronilačko odijelo Pro u 3/2mm (14-20C) ili 5/4/3mm (8-16C) nudi GBS šavove, prsni zatvarač i vapnenački neopren po konkurentnoj cijeni.
  faq:
    - q: Koliko bi neoprensko odijelo trebalo biti usko?
      a: Čvrsto bez zračnih džepova, ali ne ograničavajuće. Prst ne bi smio lako kliziti na donjem dijelu leđa.
    - q: Koji je najtopliji tip neoprenskog odijela?
      a: Odijelo s kapuljačom dimenzija 6/5/4 mm s zatvorenim šavovima i zatvaračem na prsima. Za ekstremnu hladnoću, suho odijelo je bolje.
    - q: Isplati li se skuplje ronilačko odijelo?
      a: Viša cijena donosi bolji neopren, šavove i značajke. Za redovitu upotrebu u hladnoj vodi, premija se isplati.
    - q: Mogu li nositi ronilačko odijelo za aktivnosti osim surfanja?
      a: Da — ronilačka odijela su dobra za SUPkajakarenje, ronjenje, triatlon i plivanje na otvorenoj vodi.
