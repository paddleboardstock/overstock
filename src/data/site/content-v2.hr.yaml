- slug: sup-pump-guide
  category: guide
  type: buying-guide
  title: 'SUP Vodič za pumpu: Ručne vs električne pumpe'
  description: Potpuni vodič za SUP pumpe — ručne dvokomorne, jednokomorne i električne pumpe. Kako odabrati najbolju pumpu za vaše potrebe, savjeti za održavanje i tehnike napuhavanja.
  definition: SUP Pumpa je uređaj koji se koristi za napuhavanje napuhavajućih dasaka za veslanje do potrebnog tlaka (obično 15-20PSI). Vrste uključuju ručne jednokomorne, ručne dvokomorne i električne pumpe.
  tldr: Dvokomorne ručne pumpe standard su za kvalitetne iSUP-ove — napuhuju se dvostruko brže od jednokomornih. Električne pumpe se napuhuju bez napora, ali zahtijevaju baterijsku energiju i pune se sporije blizu maksimumaPSI. Ručne pumpe su pouzdanije i ne zahtijevaju baterije. Odaberite dvokomorne ručne pumpe radi pouzdanosti, električne radi praktičnosti.
  problem: Napuhavanje SUP traje predugo ili zahtijeva previše truda. Pumpa loše kvalitete čini napuhavanje napornim i obeshrabruje spontano veslanje.
  explanation: Jednokomorne pumpe pomiču zrak samo pri silaznom hodu — potrebno im je 10-15 minuta za napuhavanje . SUPDvokomorne pumpe koriste obje komore za veliki volumen pri početnom napuhavanju (punjenje ploče) i prelaze na jednu visokotlačnu komoru za konačni tlak. To smanjuje vrijeme napuhivanja na 3-5 minuta. Električne pumpe koriste 12V snagu i automatski se napuhuju, ali se znatno usporavaju kako tlak raste.
  solution: Za većinu korisnika, priložena pumpa s dvije komore pruža najbolji omjer brzine, pouzdanosti i nulte ovisnosti o baterijama. Ako SUP često ili imate fizička ograničenja, razmislite o električnoj pumpi. Uvijek nosite ručnu pumpu kao rezervu, čak i ako prvenstveno koristite električnu pumpu.
  recommendation: Aquafarer Dvokomorna pumpa koja dolazi uz sve ploče je izvrsna — napuhuje se na 15 stupnjeva PSI za manje od 4 minute. Održavajte ventil podmazanim i provjeravajte manometar jednom godišnje.
  faq:
    - q: Što je brže, ručno ili električno?
      a: Ručne pumpe s dvije komore (3-5 minuta) često su brže od električnih (5-10 minuta) jer električne pumpe znatno usporavaju pri visokim tlakovima.
    - q: Mogu li koristiti pumpu za gume u autu za SUPsvoje?
      a: Ne — pumpe za gume se kreću malim volumenom pri vrlo visokom tlaku.SUP Pumpe trebaju veliki volumen pri srednjem tlaku.
    - q: Kako mogu znati kada moja pumpa treba održavanje?
      a: Ako pumpanje djeluje teže nego inače, tlak stagnira prije nego što dosegne maksimum PSIili mjerač pokazuje nekonzistentno, provjerite O-prstenove i spojeve ventila.
    - q: Oštećuju li električne pumpe ploču?
      a: Ne ako imaju automatsko isključivanje na postavljenom tlaku. Kontinuirano pumpanje preko maksimuma PSI može oštetiti drop-stitch navoje.
