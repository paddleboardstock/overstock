- slug: longboard-vs-shortboard
  category: comparison
  type: buying-guide
  title: Longboard vs Shortboard (Iskren odgovor koji vam nitko ne daje)
  description: Longboardovi hvataju više valova; shortboardovi postaju tvrđi. Pravo pitanje je koji odgovara tvojoj vještini i lokalnim probojima. Iskrena usporedba koja pokriva stabilnost, broj valova i zamku progresije.
  definition: Longboardovi (9ft+) daju prednost stabilnosti i lakoći hvatanja valova; shortboardovi (5-7ft) daju prednost upravljivosti i performansama na strmim valovima. Pravi izbor ovisi o vašoj razini vještine i lokalnim vrstama valova.
  tldr: Longboardovi (9ft+) su stabilni, lako hvataju valove i odgovaraju početnicima i surferima orijentiranim na krstarenje. Shortboardi (5-7ft) su responzivni, brži na valovima i odgovaraju iskusnim surferima. Pravi izbor ovisi o vašoj razini vještine, tipu valova i onome što najviše volite kod surfanja.
  problem: Vidite videozapise surfera koji rade oštre zavoje na shortboardima i longboardera koji graciozno klize uz nos daske — oba izgledaju zabavno. Imate budžet samo za jednu vrstu daske i trebate znati koji stil odgovara vašim ciljevima i lokalnim breakovima.
  explanation: 'Longboardovi imaju veću površinu, što znači da veslaju brže, hvataju valove ranije i pružaju stabilnu platformu za hodanje i cross-step. Izvrsni su u malim, sporim valovima gdje bi shortboard potonuo. Shortboardovi imaju manji volumen i agresivniji rocker, što im omogućuje dublje tonjenje u val, stvaranje brzine kroz zavoje i uklapanje u strme, šuplje dijelove. Shortboardovi zahtijevaju snažno veslanje i precizno tempiranje valova. Česta zabluda: shortboardi nisu "bolji" — oni su jednostavno različiti alati za različite uvjete i razine vještine.'
  solution: Ako ste početnik, vozite longboard (ili napuhivač velikog volumena) najmanje 6 mjeseci. Ako ste srednje zahtjevni i vaši lokalni valovi su često mali i spori, longboard ili hibrid hvata više valova i bit će zabavniji. Ako su vaši valovi strmi, šuplji i brzi, shortboard postaje nužan da stane u džep. Mnogi srednje iskusni surferi održavaju oba i biraju prema danu.
  recommendation: Počnite s Aquafarer Surfboard Pro kao platformom za longboard. Kada stalno okrećete i stvarate brzinu, razmislite o dodavanju hibridne ili shortboarda za dane s jakim valovima. Većina surfera koji pokušaju shortboard prerano na kraju se frustriraju i voze manje valova.
  faq:
    - q: Je li longboard lakši za vožnju nego shortboard?
      a: Mnogo lakše. Longboardovi hvataju valove ranije, brže veslaju i stabilniji su tijekom pop-upova i trimova. Shortboardovi zahtijevaju precizno tempiranje, jače veslanje i bolju procjenu valova.
    - q: Možeš li raditi okrete na longboardu?
      a: Da, iako je stil drugačiji. Longboard okreti su širi, glađi i uključuju cijelo tijelo. Nose riding, cutbackovi i hang-fives su manevri specifični za longboard s vlastitim napretkom vještina.
    - q: Koja je daska bolja za male valove?
      a: Longboardovi i hibridi bolje funkcioniraju u malim, slabim valovima jer stvaraju klizanje i održavaju momentum. Shortboardovi trebaju strmije i snažnije valove za performanse.
    - q: Je li kratka daska teža za veslanje?
      a: Znatno teže. Manji volumen znači da daska sjedi niže u vodi, stvarajući veći otpor. Veslanje na kratkoj dasci je kao plivanje s drag padobranom u usporedbi s veslanjem na longboardu.
