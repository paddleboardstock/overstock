  title: 'SUP Vodič za povodac: Objašnjenje ravnih naspram spiralnih povodaca'
  description: Potpuni vodič za SUP povodce — ravne naspram spiralnih, gležanj naspram lista, opcije brzog otpuštanja i kako odabrati pravi povodac za vaše uvjete za veslanje.
  definition: SUP Povodac je uže koje veže veslača za dasku, sprječavajući odvajanje. Vrste uključuju ravne povodce (za surfanje i rijeke) i namotane povodce (za mirnu vodu).
  tldr: Uvijene uzice najbolje su za mirnu vodu i veslanje u kondiciji — ostaju izvan daske i izvan vode. Ravne uzice su za SUP surfanje i rijeke — pružaju više slobode i ne zapinju. Za udobnost se preferira pričvršćivanje za list umjesto gležnja. Brzi povodci su važni za veslanje po rijeci kako bi se spriječilo zarobljavanje.
  problem: Kupili ste povodac sa svojim, SUP ali niste sigurni je li pravi tip za vaš stil veslanja. Pogrešan povodac će se vući, zapinjati ili otkazati kad vam je najpotrebniji.
  explanation: Ravni povodci su jednostavne najlonske ili poliuretanske užadi koje se vuku iza daske. Dobro funkcioniraju u valovima jer se ne zakače za peraje. Spiralni povodci su spiralne užadi koje se skupljaju kad nisu pod napetošću — ostaju namotane na palubi dok veslate i produžuju se kad padnete. Drže povodac izvan vode u ravnim uvjetima, smanjujući otpor.
  solution: Odaberite spiralni povodac za mirnu vodu, fitness i touringSUP. Smanjeni otpor pomaže održavanju brzine i sprječava da se povodac zakači za podvodne predmete. Odaberite ravni povodac za SUP surfanje i veslanje po rijeci. Ravni dizajn manje se može zakačiti za peraje ili prepreke.
  recommendation: Aquafarer SUP Paketi uključuju odgovarajuću vrstu povodca za namjenu daske. Namotani povodac u SUP Explorer 11 paketu izvrstan je za sveukupno veslanje.
  faq:
    - q: Treba li se povodac pričvrstiti na gležanj ili list?
      a: Poželjno je SUP pričvršćenje za list — drži povodac izvan vode tijekom veslanja i smanjuje opasnost od spoticanja pri hodanju.
    - q: Koliko dugo bi trebao biti SUP povodac?
      a: 8-10' za mirnu vodu, 6-8' za valove. Kraći povodci smanjuju otpor, ali ograničavaju slobodu kretanja daske.
    - q: Trebam li povodac s brzim otpuštanjem za rijeke?
      a: Da — rijeka SUP zahtijeva povodac ili pojas s brzim otpuštanjem koji se može odmah odvojiti kako bi se spriječilo zarobljavanje u cjediljkama.
    - q: Mogu li koristiti surf povodac zaSUP?
      a: Surf povodci su kraći i tanji. Funkcioniraju za SUP surfanje, ali nisu idealni za veslanje na mirnoj vodi gdje je duži namotani povodac bolji.
