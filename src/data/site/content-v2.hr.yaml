- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP Kondicija: Trening cijelog tijela na dasci za veslanje'
  description: SUP Pruža trening cijelog tijela koji kombinira kardiovaskularnu izdržljivost, stabilnost trupa i snagu. Kako strukturirati SUP fitness treninge, najbolje vježbe i mjerenje napretka.
  definition: SUP Fitness koristi nestabilnu platformu daske za veslanje kako bi aktivirao stabilizatore jezgre, mišiće nogu i gornji dio tijela kroz veslanje, balansiranje i vježbe na dasci.
  tldr: SUP Sagorijeva 400-700 kalorija na sat. SUP Jednosatna sesija uključuje trup, noge, leđa, ramena i ruke. Intervalno veslanje (+sprint oporavak) maksimizira kardio. Joga položaji na dasci grade ravnotežu i fleksibilnost. Dodajte SUPspecifične vježbe snage poput čučnjeva i iskoraka na dasci.
  problem: Treninzi u teretani postali su dosadni i želite aktivnost na otvorenom koja gradi kondiciju, a istovremeno je zabavna.SUP Kombinira avanturu s pravom kondicijom cijelog tijela.
  explanation: Veslanje aktivira latissimus dorsi, deltoide, trapezne mišiće i core mišiće za rotaciju. Stajanje na pokretnoj platformi prisiljava stabilizacijske mišiće gležnjeva, koljena i kukova da stalno rade. Kardiovaskularni zahtjevi kontinuiranog veslanja umjerene intenzivnosti pružaju aerobnu kondiciju.
  solution: 'Strukturirane vježbe: 5 minuta zagrijavanja u veslanju, 20 minuta stabilnog veslanja umjerenim tempom, 15 minuta intervalnog veslanja (30 sekundi sprint, 60 sekundi lagano), 10 minuta vježbi na dasci (čučnjevi, iskoraci, sklekovi), 5 minuta hlađenja istezanja.'
  recommendation: Koristite Aquafarer SUP Explorer 11 za fitness veslanje. Stabilna platforma omogućuje vam da se usredotočite na tehniku i intenzitet. Nosite Life Vest Pro radi sigurnosti tijekom treninga visokog intenziteta.
  faq:
    - q: Koliko SUP kalorija troši?
      a: 400-700 kalorija na sat, ovisno o intenzitetu, vjetru i struji. Intervalno veslanje povećava sagorijevanje kalorija.
    - q: SUP Je li dobar za mršavljenje?
      a: Da, u kombinaciji s pravilnom prehranom. Angažman cijelog tijela i niski intenzitet čine ga održivim za redovito vježbanje.
    - q: Mogu li raditi trening snage SUPna ?
      a: Da — čučnjevi, iskoraci, sklekovi i plankovi na dasci dodaju izazov za ravnotežu vježbama snage.
    - q: Koji mišići SUP rade?
      a: 'Primarno: core (kosi trbušni mišići, poprečni trbušni mišići), leđa (lats, trapepsi), ramena (deltoidi), ruke (bicepsi, tricepsi). Sekundarno: noge (kvadricepsi, zadnja loža, listovi).'
