- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Samospašavanje: Kako se vratiti na dasku u dubokoj vodi'
  description: Svaki SUP veslač trebao bi savladati samospašavanje. Korak-po-korak tehnike za ponovno montiranje daske u dubokoj vodi, vuču do obale i rješavanje zapetljanja na povodcu.
  definition: SUP Samospašavanje je tehnika ponovnog montiranja daske za veslanje u dubokoj vodi nakon pada, uključujući oporavak daske, ponovno montiranje tijela i podizanje vesla.
  tldr: 'Nakon pada: ostanite mirni, držite veslo, plivajte do daske. Postavite veslo preko daske. Koristite dolphin kick da pogurate prsa na dasku. Podignite jednu nogu, pa drugu. Prvo kleknite, pa stanite. Vježbajte u mirnoj vodi dok ne postane mišićna memorija.'
  problem: Padnete SUP u duboku vodu i ne možete se vratiti na njega. Daska je skliska, umorni ste i nastaje panika. Bez poznavanja tehnike samospašavanja, običan pad postaje opasan.
  explanation: 'Samospašavanje ima tri faze: oporavak (plivanje do daske i veslanje), ponovno jahanje (povratak na dasku) i nastavak (nastavak veslanja). Ključna tehnika je korištenje vesla kao stabilizatora i snažni udarci nogama za guranje gornjeg dijela tijela na dasku.'
  solution: 'Faza 1: plivati do daske. Držati veslo ili je donijeti. Faza 2: postaviti veslo okomito preko daske. Snažno udarati nogama dok povlačite prsa na središte daske. Faza 3: kad je prsa na dasci, zamahnite nogama jednu po jednu. Faza 4: kleknite, uhvatite dah, zatim se polako ustanite.'
  recommendation: Vježbaj samospašavanje u kontroliranim uvjetima dok to ne možeš raditi bez razmišljanja. Koristi Aquafarer SUP Explorer 11 koji ima dobar grip na palubi. Life Vest Pro pruža dodatnu plutajuću stabilnost ako ti je teško.
  faq:
    - q: Kako da se vratim na njega ako sam iscrpljen?
      a: Ostanite uz dasku radi plutanja. Koristite ruke za povlačenje prsa na dasku, čak i ako noge ne mogu učinkovito udarati. Odmarajte u klečećem položaju prije nego što ustanete na dasku.
    - q: Što ako izgubim palicu?
      a: Koristi ruke za veslanje daske do obale. Zatraži pomoć drugog veslača. Odmah zamijeni izgubljeno veslo.
    - q: Mogu li se spasiti u valovima?
      a: Da — postavite dasku okomito na valove. Tempirajte ponovno montiranje između valova. Povodac drži dasku blizu.
    - q: Kako da se nosim s zapetljanjem povodca?
      a: Ostanite smireni, plutajte na leđima, polako odmotavajte povodac. Ako je povodac omotan oko peraja, možda ćete morati skinuti peraje dok ste u vodi.
