    - q: Koliko traje napuhovanje?
      a: Oko 3-4 minute s priloženom dvokomornom pumpom. Električne pumpe smanjuju to na manje od 2 minute. Uvijek napuhujte na preporučenih 15 — PSI premalo napuhavanje utječe na performanse i stabilnost.
    - q: Je li daska prikladna za početnike?
      a: Da. Volumen od 75 litara i širina od 32 inča čine je vrlo stabilnom za učenje. Iskusni surferi također će je cijeniti kao dasku za putovanja ili male valove. Zaista obuhvaća početničke i srednje razine vještine.
