- slug: touring-sup-guide
  category: guide
  type: buying-guide
  title: 'SUP Turistički vodič: Odaberite pravu dasku za veslanje na duge staze'
  description: Touring SUPs daske su duže, uži i građene za brzinu i klizanje. Kako odabrati touring dasku, osnovna oprema za duga vesla i tehnika za učinkovito prelazak udaljenosti.
  definition: Touring SUP je duga (12-14'), uska (30-32') daska dizajnirana za učinkovito veslanje na velike udaljenosti. Značajke uključuju pomaknuti nos za rezanje kroz vodu, dužu vodenu liniju za klizanje i često bungee teretni sustav.
  tldr: 'Touring SUPs daje prednost brzini i praćenju nad stabilnošću. Minimalna duljina od 12 stopa radi učinkovitosti, širina 30-32" za ravnotežu klizanja i stabilnosti. Ključne značajke: pomaknuti nos, ravni obris, više peraja. Osnovna oprema: PFDpovodac, voda, telefon i bungee sustav za opremu. Tehnika se fokusira na duge, glatke pokrete s rotacijom trupa.'
  problem: Veslanje na dasci za sve strane na dugim udaljenostima ostavlja vas iscrpljenim. Široki nos hvata chop, daska ne prati ravno, a više energije trošite na upravljanje nego na klizanje. Trebate dasku dizajniranu za udaljenost.
  explanation: Touring SUPs koristi trup s istiskom (šiljasti nos) koji razdvaja vodu umjesto da prelazi preko nje, značajno smanjujući otpor. Duža vodena linija povećava brzinu trupa. Uža širina smanjuje otpor, ali zahtijeva bolju ravnotežu. Touring daske imaju duže peraje radi stabilnosti u smjeru. Napuhavajuće touring daske trebaju više (PSI18-20) kako bi se održala krutost i spriječilo savijanje koje troši energiju.
  solution: 'Odaberite touring dasku dugu barem 12'' s prednjim dijelom za pomak. Širina: 30" za iskusne veslače, 31-32" za srednje karoserije. Tražite središnji kutiju s perajama i bočne ugrize radi stabilnosti. Napuhujte do maksimalne ocjenePSI. Opremite se bungee privezivačem za PFDprtljagu, zviždaljkom i mobitelom u vodootpornom futrolu.'
  recommendation: Aquafarer SUP Tour 12 dimenzija 12' x 31" x 6" idealan je napuhivač za touring. Njegov prednji dio s potiskom učinkovito reže valove, a bungee sustav drži opremu za jednodnevne izlete. Uparite ih s Aquafarer karbonskim veslom za učinkovito veslanje na velike udaljenosti.
  faq:
    - q: Mogu li koristiti univerzalnu dasku za turneje?
      a: Za kratke ture ispod 5 km, da. Za duže udaljenosti, širi nos i kraća vodena linija brže će vas umoriti.
    - q: Koliko dugo mi je potrebno putovanje SUP ?
      a: 12' je minimum za touring učinkovitost. 12'6" je dobra srednja duljina. 14' je za utrke i napredni touring.
    - q: Rade li napuhavajuće turneje SUPs jednako dobre kao i tvrde daske?
      a: Moderni drop-stitch napuhavajući daske na visokim temperaturama PSI rade slično kao tvrde daske za turneje. Blagi savijanje zapravo može biti ugodnije u chopu.
    - q: Koje je veslo najbolje za turneje?
      a: Lagano veslo od karbona ili stakloplastike s većom lopaticom (100-110 sq in) za snagu. Podesivo veslo omogućuje prebacivanje između touringa i surfanja.
