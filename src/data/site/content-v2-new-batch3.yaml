- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Wind Conditions for SUP: How Wind Affects Your Paddle'
  description: 'How wind speed and direction affect SUP paddling. Understanding offshore vs onshore wind, reading wind forecasts, paddling techniques for wind, and when to stay on shore.'
  definition: 'Wind conditions define SUP safety. Offshore wind (land to sea) pushes you away. Onshore wind (sea to land) pushes you toward shore. Side wind causes the board to yaw.'
  tldr: 'Maximum safe wind for beginners: 10 knots. Intermediate: 15 knots. Advanced: 20 knots. Offshore wind is most dangerous. Paddle upwind first. In side wind, paddle slightly upwind of destination. Kneel in strong wind to reduce your profile.'
  problem: 'You paddle out in calm conditions, but 30 minutes later the wind has picked up and you struggle to return. Wind is the most underestimated SUP safety factor.'
  explanation: 'Wind affects SUP more than any other paddle craft because you stand, creating a sail effect. A 10-knot wind creates much more drag on a standing paddler than a seated kayaker. Offshore wind pushes you away from safety. Side wind causes the nose to yaw.'
  solution: 'Check wind speed and direction before paddling. Use the Beaufort scale: Force 3 (7-10 knots) for beginners, Force 4 (11-16) for intermediates. Paddle upwind first. If caught in offshore wind, paddle at 45 degrees to the wind. Kneel in strong wind.'
  recommendation: 'Use a wind forecast app (Windy, Windfinder) before every session. The Paddle Board Overstock SUP Tour 12 tracks better in wind than wider boards. In windy conditions, use shorter paddle strokes and higher cadence.'
  faq:
    - q: What wind direction is safest for SUP?
      a: Onshore wind (blowing toward land) is safest — it pushes you back. Offshore wind is most dangerous.
    - q: How do I paddle in side wind?
      a: Paddle more on the upwind side to counter drift. Angle the board upwind of your destination. A deeper center fin helps.
    - q: Can I paddle in 20 knot wind?
      a: Only if experienced in protected waters. Beginners should not paddle above 10 knots.
    - q: How do wind gusts affect SUP?
      a: Gusts cause sudden balance challenges. In gusty conditions, lower your stance and be ready for sudden shifts.
