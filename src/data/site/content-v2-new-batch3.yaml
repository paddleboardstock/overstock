- slug: weather-planning-water-sports
  category: guide
  type: safety
  title: 'Weather Planning for Water Sports: Read the Forecast Like a Pro'
  description: 'How to read marine weather forecasts for SUP, surfing, and boating. Understanding fronts, pressure systems, wind patterns, and weather warnings to plan safe sessions.'
  definition: 'Weather planning means interpreting marine forecasts — wind speed and direction, swell height and period, precipitation, visibility, and severe weather warnings.'
  tldr: 'Check three forecasts before every session: wind, swell, and weather. Best conditions: light offshore wind, moderate swell, high or rising pressure. Avoid: thunderstorms, strong offshore wind, fog, and rapidly falling pressure.'
  problem: 'You drive to the coast based on a 3-day forecast that promised good conditions, only to find 25-knot wind and rain. Marine weather is difficult to predict.'
  explanation: 'High pressure brings stable weather and light winds. Low pressure brings wind and storms. The pressure gradient determines wind speed. Cold fronts bring sudden wind shifts. Local effects like sea breezes can override the general forecast.'
  solution: 'Use multiple sources: Windy.com, NOAA, local surf cameras. Check 24 hours ahead and re-check the morning of. Look for consistent forecasts across models. Learn local microclimates.'
  recommendation: 'Bookmark Windy.com for your local spots. Carry a phone in a waterproof case. For boating, carry a VHF radio for weather broadcasts. When in doubt, stay on shore.'
  faq:
    - q: What weather should I avoid for SUP?
      a: Thunderstorms (lightning), fog (zero visibility), offshore wind over 10 knots, winds over 20 knots, falling pressure.
    - q: How accurate are marine forecasts?
      a: 3-day forecasts are about 80% accurate. Day-before forecasts are 90%+ accurate for wind.
    - q: What is a good barometric trend for water sports?
      a: Rising or stable pressure indicates improving conditions. Falling pressure (1+ mb/hour) indicates a storm approaching.
    - q: Can I SUP in fog?
      a: Not recommended. If caught in fog, use a compass or GPS, sound a whistle every 30 seconds, and stay near shore.
