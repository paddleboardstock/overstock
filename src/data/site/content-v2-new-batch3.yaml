- slug: cold-water-safety-guide
  category: guide
  type: safety
  title: 'Cold Water Safety: Paddling and Surfing in Cold Conditions'
  description: 'Cold water safety for SUP, surfing, and kayaking. Hypothermia recognition, appropriate gear, cold shock response, and emergency procedures for cold-water immersion.'
  definition: 'Cold water safety involves understanding cold shock response, swimming failure, hypothermia, and the gear and techniques to prevent these outcomes.'
  tldr: 'Water below 15C requires a wetsuit. Below 10C requires boots, gloves, and hood. Cold shock causes involuntary gasping. Swim failure occurs within 3-5 minutes in water below 10C. Hypothermia symptoms include shivering, confusion, and loss of coordination.'
  problem: 'You paddle out on a sunny day unaware the water is 8C. You fall in, gasp involuntarily, and feel limbs go numb within minutes. Cold water kills faster than any other ocean hazard.'
  explanation: 'Cold water immersion has four stages: cold shock (0-2 min) — gasping, hyperventilation. Swimming failure (3-15 min) — muscles cool, coordination fails. Hypothermia (15-45 min) — core temperature drops below 35C causing confusion and cardiac arrest. Post-rescue collapse — cold blood returns to core.'
  solution: 'Check water temperature. Wear a wetsuit rated for the temperature. Never paddle alone in water below 15C. Carry whistle and phone. If you fall in: control breathing, remount board quickly. If too cold, signal for help.'
  recommendation: 'The Paddle Board Overstock Wetsuit Pro 5/4/3mm is the minimum for water 8-14C. Add Paddle Board Overstock 5mm boots and 3mm gloves. Wear the Life Vest Pro for extra thermal protection.'
  faq:
    - q: How long can I survive in 10C water?
      a: Cold shock lasts 1-2 minutes. Without flotation and thermal protection, survival time is 30-60 minutes.
    - q: What are the first signs of hypothermia?
      a: Uncontrollable shivering, confusion, poor coordination, slurred speech. Stop activity and warm up immediately.
    - q: How do I warm up after a cold water session?
      a: Remove wet gear, dry off, put on warm layers including hat and gloves. Drink warm non-alcoholic beverages.
    - q: Can I get hypothermia in summer?
      a: Yes — water below 15C occurs in many locations even in summer. Water conducts heat 25x faster than air.
