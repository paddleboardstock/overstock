cards:
  - badge: PVC
    title: ชั้นเกรดทางทะเล PVC
    description: ผ้าชนิดหลายชั้นแบบลามิเนต PVC ที่ออกแบบสำหรับสภาพแวดล้อมทางทะเล ทดสอบการทนต่อ UV การเสียดสี และการเจาะ
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: DS
    title: แกน Drop-Stitch
    description: เส้นด้ายภายในหลายพันเส้นเชื่อมต่อระหว่างชั้นบนและล่าง สร้างโครงสร้างแข็งแรงรองรับความดันสูงที่ 12–15 PSI
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - badge: RR
    title: ขอบรางเสริม
    description: รางเชื่อมแบบสองชั้นป้องกันการขีดข่วนจากท่าเรือ การขึ้นลงที่ชายหาด และแรงกระแทกด้านข้าง
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
