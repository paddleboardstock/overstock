cases:
  - id: beginner
    title: Ūdens sporta iesācējiem
    desc: Stabili SUP dēļi un kajaki pirmo reizi lietotājiem.
    scenario: Ģimene, kas apmeklē ezeru brīvdienās, vēlas izmēģināt stāvēšanu uz dēļa. Viņiem nepieciešama stabila, viegli uzsākama aprīkojuma ar skaidrām drošības instrukcijām.
    solution: SUP Explorer 11 nodrošina plašu stabilitāti iesācējiem. Life Vest Classic nodrošina CE sertificētu peldošību. Dual-Action Pump piepūš abus dēļus mazāk nekā 10 minūtēs.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Āra izpēte
    desc: Portatīvie kajaki un laivas upju, ezeru un piekrastes braucieniem.
    scenario: Āra entuziasts plāno nedēļas garu upes braucienu un nepieciešama laiva, kas kompakti iesaiņojama, piepūšama kempingā un piemērota dažādiem straumes apstākļiem.
    solution: Kajaks Lite ietilpst mugursomā un piepūšas mazāk nekā 4 minūtēs. Tā drop-stitch konstrukcija piemērota ezeriem, lēnām upēm un piekrastes airēšanai.
    products:
      - Piepūšamais Kajaks Lite
      - Oglekļa airis
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: Profesionālas operācijas
    desc: Komercklases RIBs tūrisma operatoriem un ārkārtas reaģēšanai.
    scenario: Piekrastes tūrisma operators nepieciešama izturīgu laivu flotē, kas veic ikdienas braucienus dažādos jūras apstākļos un atbilst komerciālajiem drošības noteikumiem.
    solution: RIB 330 un RIB 450 Patrol izmanto stikla šķiedras deep-V korpusus ar Hypalon caurulēm visu laikapstākļu izturībai. Vairāki vienības var tikt izmantotas ar līdzīgu veiktspēju.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: Ģimenes atpūta
    desc: Plašas laivas dienas braucieniem, makšķerēšanai un ūdens sportam.
    scenario: Četru cilvēku ģimene vēlas stabilu laivu nedēļas nogales ezeru izbraucieniem, makšķerēšanas braucieniem un bērnu riepai vilkšanai.
    solution: AirDeck 360 uzņem līdz pieciem pasažieriem ar pastiprinātu gaisa grīdu. Tā piepūšas uzsākšanas vietā, ietilpst mašīnā un piemērota gan mierīgiem ezeriem, gan aizsargātajām piekrastes ūdenstilpēm.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
