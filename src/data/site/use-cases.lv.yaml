cases:
  - id: beginner
    title: Sākuma airēšana
    desc: Stabili piepūšamie SUP dēļi pirmo reizi airētājiem.
    scenario: Ģimene, kas apmeklē ezeru brīvdienās, vēlas izmēģināt stāvēšanu uz dēļa. Viņiem nepieciešama stabila, viegli uzsākama aprīkojuma ar skaidrām drošības instrukcijām.
    solution: SUP Explorer 11 nodrošina platu stabilitāti ķermenim iesācējiem. Life Vest Classic garantē CE sertificētu peldspēju. Oars & Pump Set piepūš dēli mazāk nekā 10 minūtēs.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Ekskursijas un izpēte
    desc: Ilgstošiem attālumiem paredzētie piepūšamie SUP dēļi ezeriem, upēm un piekrastes ceļojumiem.
    scenario: Āra entuziasts plāno nedēļas ilguma airēšanas braucienu un viņam nepieciešams dēlis, kas samazināsies nelielā lielumā, piepūsies nometnē un tieši sekos ūdenī.
    solution: Ocean Voyager Series efektiīvi slīd ar tūrisma formu un saglabā kursu vēja un viļņu laikā. Tās drop-stitch konstrukcija piepūšas līdz 15 PSI cietam dēļa stingrumam.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Joga un fitnesa nodarbības
    desc: Īpaši platas, stabilas platformas jogai, fitnesam un relaksācijai.
    scenario: Jogas pratējs vēlas peldstudio rīta nodarbībām mierīgā ūdenī, ar pietiekami daudz vietas visām pozām.
    solution: Flowing Lotus Series ir aprīkots ar pilna garuma klāja spilventiņu un platu platību, lai pozas būtu stabilas. Tas kalpo arī kā stabila platforma vieglām fitnesa nodarbībām.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Ģimenes atpūta
    desc: Pilnas SUP paketes nedēļas nogales ezeru dienām un brīvdienām.
    scenario: Četru cilvēku ģimene vēlas stabilus dēļus nedēļas nogales ezeru izbraucieniem un pludmales brīvdienām — aprīkojums, kas ietilpst bagāžniekā un piepūšas minūšu laikā.
    solution: Tropical Breeze Series ir stabils vispusīgs dēlis, ko var izmantot visa ģimene, kamēr Medusa Glow Series ir vieglāks un īsāks bērniem. Abi ietilpst mugursomās ērtai ceļošanai.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
