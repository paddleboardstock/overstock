origin:
  tagline: 'Unsere Herkunft'
  heading: "Auf dem Wasser gebaut,<br />\n<span class=\"text-sky-600\">getrieben vom Zweck</span>"
  paragraphs:
    - 'Aquafarer begann in einer Küstenwerkstatt mit einem Boot und einer hartnäckigen Überzeugung: maritime Produkte sollten so konstruiert sein, als würden sie zählen — denn das tun sie.'
    - 'Unsere Gründer, zwei Schiffbauingenieure, sahen eine Branche, in der Abstriche gemacht, Materialien verschlechtert und Sicherheit wie ein Häkchen auf einer Checkliste behandelt wurden. Sie bauten den ersten Aquafarer-Rumpf nicht aus Profitgier, sondern um zu beweisen, dass erschwingliche Schiffsausrüstung wirklich zuverlässig sein kann.'
    - 'Dieser erste Rumpf ist noch heute im Einsatz. Dieses Prinzip hat sich nie geändert.'
    - 'Wir sind nicht der größte Hersteller. Wir machen nicht die billigsten Produkte. Aber jeder Rumpf, der unsere Werkstatt verlässt, geht durch dieselben Hände, die das Unternehmen gegründet haben — und erfüllt denselben Standard, den der erste Rumpf gesetzt hat.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'Aquafarer Küstenwerkstatt'

philosophy:
  tagline: 'Unsere Philosophie'
  heading: 'Verwurzelt im Ozean'
  description: 'Der Ozean ist nicht unser Arbeitsplatz. Er ist unser Lehrer. Jede Designentscheidung beginnt mit dem Verständnis dafür, wie sich Wasser verhält, wie sich die Bedingungen ändern und wie die Ausrüstung reagieren muss.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Respekt für das Wasser'
      description: 'Wasser ist unberechenbar. Unsere Produkte sind für die schlechtesten Bedingungen konstruiert, nicht für die besten. Wenn ein Rumpf eine reißende Strömung bewältigt, bewältigt er auch einen See. Wenn eine Schwimmweste auf hoher See funktioniert, ist sie für einen Fluss überkonstruiert — und das ist beabsichtigt.'
    - emoji: "\U0001F527"
      title: 'Gebaut, um zu halten, nicht zu ersetzen'
      description: 'Das nachhaltigste Produkt ist das, das nicht ersetzt werden muss. PVC in Marinequalität, Hypalon und Drop-Stitch-Konstruktion werden wegen ihrer Langlebigkeit gewählt. Wir liefern bis heute Ersatzteile für Rümpfe, die wir vor einem Jahrzehnt gebaut haben.'
    - emoji: "\U0001F3C6"
      title: 'Zugänglichkeit durch Design'
      description: 'Wassersport sollte kein Luxus sein. Wir entwickeln Produkte, die professionelle Leistung zu einem Preis bieten, der für Familien, Guides und kleine Anbieter sinnvoll ist — nicht nur für kommerzielle Flotten.'

design:
  tagline: 'Designphilosophie'
  heading: "Entwickelt für die Grenze<br />\n<span class=\"text-sky-600\">der Bedingungen</span>"
  paragraphs:
    - 'Jedes Aquafarer-Produkt beginnt mit einer Frage: <em>Was ist die schlimmste Bedingung, der es ausgesetzt sein wird?</em> Wir konstruieren von der Grenze nach innen, nicht von der Mitte nach außen.'
    - 'Unsere Drop-Stitch-Kerne sind für 15 PSI ausgelegt — nicht weil 12 PSI für einen See unzureichend wären, sondern weil ein 15-PSI-Board plötzlichen Wellengang ohne Verformung wegsteckt. Unsere Hypalon-Schläuche sind für UV-Beständigkeit in kommerzieller Qualität spezifiziert — nicht weil jeder Kunde in den Tropen paddelt, sondern weil UV-Abbau die häufigste Ursache für vorzeitigen Verschleiß ist.'
    - 'Wir entwickeln nicht für einen Preis. Wir entwickeln für einen Versagenspunkt — und bauen deutlich darüber.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'Aquafarer Design und Technik'
  stats:
    - value: '15'
      label: 'PSI-Kern<br />belastbarkeit'
    - value: '1,500+'
      label: 'UV-Stunden<br />getestet'
    - value: '10yr'
      label: 'Rumpf-<br />lebensdauer'