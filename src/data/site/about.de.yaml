business_model:
  tagline: Unser Geschäftsmodell
  heading: Überbestandslager, direkt ab Werk verkauft
  paragraphs:
    - Paddle Board Overstock verkauft brandneue aufblasbare SUP-Boards zu Überbestands- und Räumungspreisen — bis zu 60 % Rabatt auf den normalen Verkaufspreis. Wir beziehen Überschüsse und überflüssige Lagerbestände in größeren Mengen und geben die Einsparungen an Paddler und kleine Einzelhändler weiter.
    - 'Neben dem Einzelhandel bedienen wir kleine Einzelhändler mit einem Mischmodell im Großhandel: Bestellen Sie 5–20 Boards, mischen Sie beliebige Modelle in einer Lieferung und zahlen Sie den Großhandelspreis für die Gesamtmenge. Jede Bestellung wird direkt aus Weihai, China, versendet.'
sourcing:
  tagline: Woher Unser Überbestandslager Stammt
  heading: Gemischte Beschaffung, ein Qualitätsstandard
  paragraphs:
    - 'Unser Lagerbestand stammt aus zwei Quellen: Überschussproduktionen aus unseren eigenen Produktionsbetrieben in Weihai und ausgewählte Überschussbestände anderer Produktionspartner, die wir prüfen und direkt mit denen zusammenarbeiten.'
    - Jedes Board, das wir verkaufen, ist brandneu und unbenutzt. Überbestand bezieht sich auf den Preis — niemals auf den Zustand.
manufacturing:
  tagline: Unser Produktionshintergrund
  heading: Seit 2012 in Weihai gefertigt
  paragraphs:
    - Wir stellen aufblasbare SUP-Boards seit 2012 in Weihai, Shandong, her. Unsere Produktionsstätte mit 12.000 m² fertigt jährlich 15.000 aufblasbare Einheiten mit einem Team von 200–300 Arbeitern und 14+ F&E-Ingenieuren.
    - 'Ein Designprinzip hat sich seit dem ersten Board nicht geändert: Wir entwerfen bis zum Versagenspunkt und bauen dann weit darüber hinaus.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock Fabrikgebäude in Weihai
  stats:
    - value: '2012'
      label: Produktion seit
    - value: 12.000 m²
      label: Produktionsanlage
    - value: 15,000
      label: Einheiten pro Jahr
    - value: 14+
      label: F&E-Ingenieure
inspection:
  tagline: Wie Wir Jedes SUP-Board Prüfen
  heading: Jedes Board getestet, nicht stichprobenartig
  paragraphs:
    - Jedes SUP-Board wird zu 100 % Druck-getestet bei 1,25-fachem Nennwert über 24–48 Stunden, bevor es zum Verkauf freigegeben wird. Boards, die den Test nicht bestehen, werden niemals versandt.
    - 99,3 % der Boards bestehen die Endkontrolle beim ersten Mal. Der verbleibende Anteil wird repariert oder beiseitegelegt — niemals zu einem reduzierten Preis in eine Bestellung aufgenommen.
why_prices_lower:
  tagline: Warum Unsere Preise Niedriger Sind
  heading: Überbestand-Ökonomie, keine Abstriche
  paragraphs:
    - 'Unsere Preise sind aus strukturellen Gründen niedriger: Wir verkaufen Überbestands- und Überschusslager direkt aus Weihai, ohne Einzelhandelsaufschläge, keine Zwischenhändler und keine Ausstellungsraumkosten.'
    - Die Boards selbst haben volle Produktionsqualität — gleiche drop-stitch-Kerne, gleiche Marine-Grade-PVC, gleiche Tests wie beim regulären Einzelhandel.
shipping_network:
  tagline: Unser Internationales Versandnetzwerk
  heading: Express Luftfracht oder konsolidierte Seefracht
  paragraphs:
    - Bestellungen werden aus Weihai, China, versendet. Express-Luftfracht transportiert Muster und 1–3 Board-Bestellungen; konsolidierte Seefracht bedient 5–20 Board-Großhandelsbestellungen in 50+ Länder.
    - Jedes Angebot enthält eine Transitabschätzung für Ihr Ziel, sowie die Handelsrechnung und Packliste, die für die Zollabfertigung erforderlich sind.
  cards:
    - title: Express-Luftfracht
      description: Für Muster und 1–3 Brettbestellungen — schnelle Lieferung bis zu Ihrer Tür, Preisangabe pro Zielort.
    - title: Konsolidierte Seefracht
      description: Für 5–20 Brett-Großbestellungen — kostengünstiger Versand zu großen Häfen, Preisangabe pro Zielort.
warranty_support:
  tagline: Garantie & Kundensupport
  heading: Eine 2-Jahres-SUP-Garantie auf jedes Brett
  paragraphs:
    - Jedes Brett wird mit der 2-Jahres-SUP-Garantie geliefert. Wenn innerhalb des Garantiezeitraums ein abgedeckter Mangel auftritt, kontaktieren Sie unser Support-Team und wir werden das Problem lösen.
    - Der Support wird von demselben Team bearbeitet, das Ihre Bestellung verwaltet. Sie können uns jederzeit über das Kontaktformular oder durch Antwort auf Ihre Bestellbestätigung erreichen.
