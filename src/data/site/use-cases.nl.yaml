cases:
  - id: beginner
    title: Beginner Paddelen
    desc: Stabiele opblaasbare SUP-boards voor beginnende peddelaars.
    scenario: Een gezin dat een meer bezoekt voor het weekend wil paddleboarden uitproberen. Ze hebben stabiel, gemakkelijk te lanceren materiaal nodig met duidelijke veiligheidsinstructies.
    solution: De SUP Explorer 11 biedt brede stabiliteit voor beginners. De Life Vest Classic zorgt voor CE-gecertificeerde drijfkracht. De Oars & Pump Set blaast het board binnen 10 minuten op.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Touren & Verkenning
    desc: Opblaasbare SUP-boards voor lange afstanden op meren, rivieren en kustroutes.
    scenario: Een buitenliefhebber plant een weeklange peddeltocht en heeft een board nodig dat klein op te bergen is, op te blazen bij het kamp en rechtuit vaart op open water.
    solution: De Ocean Voyager Series glijdt efficiënt met een touring-ontwerp en houdt koers bij wind en golfslag. De drop-stitch-constructie blaast op tot 15 PSI voor hardboard-stijfheid.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga & Fitness
    desc: Extra brede, stabiele platforms voor yoga, fitness en ontspanning.
    scenario: Een yogabeoefenaar wil een drijvende studio voor ochtendsessies op kalm water, met genoeg dekruimte voor elke houding.
    solution: De Flowing Lotus Series heeft een dekmat over de hele lengte en een brede balk voor trillingsvrije houdingen. Het dient ook als stabiel platform voor lichte fitnessoefeningen.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Gezinsrecreatie
    desc: Complete SUP-pakketten voor weekenddagen aan het meer en vakanties.
    scenario: Een gezin van vier wil stabiele boards voor weekenduitjes aan het meer en strandvakanties — materiaal dat gemakkelijk in de auto past en in enkele minuten op te blazen is.
    solution: De Tropical Breeze Series is een stabiel allround board dat het hele gezin kan gebruiken, terwijl de Medusa Glow Series lichter en korter is voor kinderen. Beide passen in rugzakken voor gemakkelijke verplaatsing.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
