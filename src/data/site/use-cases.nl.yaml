cases:
  - id: beginner
    title: 'Watersport voor beginners'
    desc: 'Stabiele SUP-boards en kajaks voor eerste gebruik.'
    scenario: >-
      'Een gezin dat in het weekend een meer bezoekt, wil stand-up paddlen proberen. Ze hebben stabiele, makkelijk te water te laten uitrusting nodig met duidelijke veiligheidsinstructies.'
    solution: >-
      'De SUP Explorer 11 biedt brede stabiliteit voor beginners. De Life Vest Classic garandeert CE-gecertificeerd drijfvermogen. De dubbelwerkende pomp blaast beide boards in minder dan 10 minuten op.'
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 'Outdoor exploratie'
    desc: 'Draagbare kajaks en boten voor rivieren, meren en kusttochten.'
    scenario: >-
      'Een outdoorliefhebber plant een weeklange riviertocht en heeft een boot nodig die klein inpakt, op het kamp wordt opgeblazen en wisselende stromingen aankan.'
    solution: >-
      'De Kayak Lite past in een rugzak en is in minder dan 4 minuten opgeblazen. De drop-stitch constructie is geschikt voor meren, trage rivieren en kustpeddelen.'
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: 'Professionele inzet'
    desc: 'Commerciële RIBs voor touroperatoren en noodhulp.'
    scenario: >-
      'Een kusttouroperator heeft een vloot duurzame boten nodig voor dagelijkse tochten onder wisselende zeegang, conform de commerciële veiligheidsregelgeving.'
    solution: >-
      'De RIB 330 en RIB 450 Patrol hebben fiberglass diepe-V rompen met Hypalon tubes voor duurzaamheid bij elk weer. Meerdere units zijn inzetbaar met consistent prestatieniveau.'
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: 'Gezinsrecreatie'
    desc: 'Ruime boten voor dagtochten, vissen en watersport.'
    scenario: >-
      'Een gezin van vier wil een stabiele boot voor weekenduitjes op het meer, visexcursies en het slepen van een tube voor de kinderen.'
    solution: >-
      'De AirDeck 360 biedt plaats aan maximaal vijf personen met een versterkte luchtvloer. Hij wordt bij de traileramp opgeblazen, past in de auto en is geschikt voor rustige meren en beschutte kustwateren.'
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
