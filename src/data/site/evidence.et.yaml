badge: Proof & Results
heading: Tõendid
description: Tõelised juhtumiuuringud, sertifikaadid, testandmed ja paigaldusfotod, mis tõestavad meie tootmisvõimekust ja tootekvaliteeti.
case_studies:
  - id: retail-private-label
    client: Euroopa vabaõhukaubandus
    product: Privaatmärgise SUP seeria
    industry: Jaemüük
    challenge: Euroopa vabaõhukaubandus vajab privaatmärgise SUP seeriat unikaalsete dekkide graafikute, keskkonnasõbralike PVC ja jaemüügivalmis pakenditega – kõik tarniti 60 päevaga.
    solution: Arendati kohandatud digitaalse trükifailid, hangiti REACH-standardile vastavad PVC ja vähendati prototüüpimise etappe 3-st ühele, koondades disainimeeskonna meie Qingdao tehasesse.
    result: 55 päeva allkirjastatud PO-st FOB. 2400 ühikut 4 SKU kohta. Kordustellimus esitati enne esimese konteineri saabumist.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Jaemüük
      - SUP
    outcome_metrics:
      - label: Täitmisaeg
        value: 55 päeva
      - label: Ühikud
        value: 2,400
      - label: SKU-d
        value: '4'
  - id: startup-drop-stitch-kayak
    client: USA veespordi idufirma
    product: Drop-Stitch Kajak
    industry: Idufirma / Jaemüük
    challenge: USA veespordi idufirma vajas kõrge jõudlusega drop-stitch kajakit kohandatud kerekujuga, kaubamärgiga pakendiga ja BSCI sertifikaadiga jaemüügiks.
    solution: Kohandati olemasolevat drop-stitch kajakimormi muudetud rocker-profiiliga, arendati kaubamärgiga pakendi kujundus ja esitati täielik BSCI auditi dokumentatsioon.
    result: Edukas noteerimine 3 suuremas USA vabaõhusahtlis. 5000 + ühikut esimesel aastal 98% müügistatistilisusega.
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
    tags:
      - OEM
      - Kajak
      - BSCI
    outcome_metrics:
      - label: Jaemüügi kettid
        value: '3'
      - label: Esimese aasta ühikud
        value: 5,000+
      - label: Müügitõhusus
        value: 98%
  - id: australian-rib-distributor
    client: Austraalia hulgimüüja
    product: CE-sertifitseeritud RIB valik
    industry: Merendus / Valitsus
    challenge: Austraalia hulgimüüja nõudis CE-sertifitseeritud RIB valikut kohandatud toruvärvide, Hypalon täiendamise võimaluse ja Austraalia standardile AS 1799 vastavuse.
    solution: Tooteti eeltootmisprototüübid 4 toruvärvi variandiga, hangiti CSM Hypalon Jaapani tarnijalt ja korraldati kolmanda osapoole AS 1799 vastavuse testimine.
    result: 3-mudeliline RIB valik lansseeritud AU/NZ turul. Järgnes riigi hanketööde võit 12 patrull RIBs jaoks.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Valitsus
    outcome_metrics:
      - label: Lansseeritud mudelid
        value: '3'
      - label: Patrullpaadi leping
        value: 12 ühikut
      - label: Vastavus
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Kariibi luksuskuurortide grupp
    product: Kuurordi laevastik — RIBs, SUP, Kajakid
    industry: Hôtellindus / Turism
    challenge: 5-kuurordi grupp vajas ühtset rendi veespordi varustuse laevastikku — RIB pakkumised, SUPs ja kajakid — järjepideva brändimise, troopilise päikese vastu kindlate materjalide ja 5-aastase asendusplaaniga.
    solution: Kujundati kohandatud 3-mudeliline laevastiku pakett koos UV-stabiliseeritud PVC, kuurortibrändi tekigraafikute ja etappide kaupa tarneplaaniga. Tagati töötajatele koolitus ja igale kuurordile pühendatud varuosade komplekt.
    result: 180 ühikut tarnitud 5 kuurordile. Jätkupidu 2 uue vara jaoks. Ühiku maksumuse vähenemine 40% võrreldes varasemate tarnijatega.
    image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kajak
      - RIB
      - Hôtellindus
    outcome_metrics:
      - label: Tarnitud ühikud
        value: 180
      - label: Kuurordid
        value: '5'
      - label: Kulukärbe
        value: 40%
  - id: southeast-asia-search-rescue
    client: Kagu-Aasia merendusagentuur
    product: Patrull- ja pääste RIB laevastik
    industry: Valitsus / Mereturvalisus
    challenge: Valitsuse merendusagentuur vajas 20 patrull- ja pääste RIBs tulekindlate Hypalon kangaste, isetühjenevate põrandate, integreeritud VHF-/raadiokonsooli kinnituste ning SOLAS III peatüki päästepaadistandarditele vastavusega.
    solution: Valmistati 20 RIBs CSM Hypalon torudega, merenduse alumiiniumkerega, raskekaalu tõmbe-kinnitustega ja tehases eelpaigaldatud navigatsioonituled paketiga. Tehase inspekteerimismeeskond jälgis meresõidukatseid. Tarniti täielik SOLAS dokumentatsioonipakett.
    result: Leping täidetud 4 kuuga. Laevastik kasutusele piirivalve, otsingu- ja päästetööde ning katastroofideks reageerimise jaoks 3 regionaalses baas.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Valitsus
      - SOLAS
    outcome_metrics:
      - label: Patrull RIBs
        value: '20'
      - label: Tarne
        value: 4 kuud
      - label: Baasid
        value: '3'
  - id: european-dtc-ecommerce
    client: Euroopa DTC veespordi bränd
    product: Bränditud SUP + tarvikuliin
    industry: E-kaubandus / jaemüük
    challenge: Kiirelt kasvav DTC veespordi bränd vajas täielikku SUP paketti (laud, pump, aer, rihm, kott) koos luksusliku pakendiga, mis on mõeldud e-kaubanduse tarneks — otse tarbijale DHL/FedEx kaudu kahjustusteta.
    solution: Arendati välja ühisbränditud tooteliin kohandatud EPS tuuma vormimisega, omandis drop-stitch tehnoloogiaga kõrgema rõhu jaoks ning jaemüügiks valmis topeltseintega lainepappkarpidega, kus on polsterdus sisestatud. Integreeritud QR-koodipõhine autentsuse ja garantii registreerimine.
    result: 3-mudeline SUP liin lansseeriti 75 päevaga. Esimesel 12 kuul 15 000+ ühikut. 4,8★ keskmine hinnang 2 000+ arvustuse põhjal. Transpordikahjustuse määr 0,3%.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-kaubandus
    outcome_metrics:
      - label: Mudelite arv
        value: '3'
      - label: Ühikud
        value: 15,000+
      - label: Keskmine hinnang
        value: 4.8★
      - label: Kahjustuse määr
        value: 0.3%
certifications:
  - name: CE
    body: Euroopa Liit
    desc: Tooted kannavad CE sertifikaati vastavalt kehtivatele ELi direktiividele — vabaajaveesõidukid vastavalt EN ISO 6185, isiklikud päästevahendid vastavalt EN ISO 12402, kus kohaldatav.
  - name: ISO 9001
    body: SGS / BSI
    desc: Kvaliteedijuhtimissüsteem sertifitseeritud täispuhutavate veesõidukite disaini, tootmise ja jaotuse jaoks.
  - name: BSCI
    body: amfori
    desc: Sotsiaalse vastavuse sertifikaat, mis tõendab eetilist tootmist, õiglast tööjõudu ja tööohutust.
  - name: REACH
    body: Euroopa Kemikaaliamet
    desc: Kõik materjalid vastavad REACH kehtestatud kemikaaliohutuse eeskirjadele. Dokumentatsioon esitatakse iga saadetisega.
  - name: RoHS
    body: Euroopa Liit
    desc: Ohtlike ainete piirangu vastavus kõigi elektrooniliste ja elektriliste komponentide puhul.
  - name: AS 1799
    body: Standards Australia
    desc: Australiastandard täispuhutavate paatide jaoks — testitud ja sertifitseeritud kaubanduslikuks kasutamiseks AU/NZ vetes.
