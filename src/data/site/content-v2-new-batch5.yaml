- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP with Your Dog: A Complete How-To Guide'
  description: 'Paddle boarding with your dog — prep, safety, training steps, gear recommendations, and tips for a fun experience for both of you.'
  definition: 'SUP with dog involves training your canine companion to balance on a paddle board, equipping them with a dog PFD, and paddling safely together.'
  tldr: 'Start with a wide, stable SUP (34"+). Get your dog a properly fitted life vest with a handle. Introduce the board on land first, then in shallow water. Start with short sessions and positive reinforcement. Always carry water for your dog. Watch for signs of stress or fatigue.'
  problem: 'Your dog loves water but you are unsure how to introduce them to the SUP safely. Without proper training, a dog can panic, jump off, or scratch the board.'
  explanation: 'Dogs have natural swimming ability but need to learn the board is a safe platform. The key is gradual desensitization: introduce the board on solid ground, reward calm behavior, then move to shallow water, and finally to deeper water.'
  solution: 'Start on land: let dog sniff and walk on the board (on grass). Reward calm behavior. Next: place board in very shallow water, support it, let dog stand on it. Reward. Next: you get on board in shallow water, have dog join. Finally: paddle slowly in calm water.'
  recommendation: 'Use the Paddle Board Overstock SUP Explorer 11 for its 33" stable platform. Add a dog PFD (life vest). Bring fresh water and a bowl. Start with 10-minute sessions and build up.'
  faq:
    - q: What size SUP do I need for my dog?
      a: A 33-34\" wide board provides stability for medium to large dogs. Small dogs (under 10 kg) can manage on boards 32\"+.
    - q: Does my dog need a life vest?
      a: Yes — even strong swimmers need a dog PFD with a handle for easy retrieval in emergencies.
    - q: How do I protect the board from claws?
      a: Keep dog nails trimmed. Use a deck pad protector or towel. Dogs typically adjust and stop scratching once comfortable.
    - q: Can any dog learn SUP?
      a: Most dogs can learn with patience. Anxious dogs may take longer. Never force a fearful dog onto the board — it creates negative associations.
