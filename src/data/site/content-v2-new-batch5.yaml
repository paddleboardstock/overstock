- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Self-Rescue: How to Get Back on Your Board in Deep Water'
  description: 'Every SUP paddler should master self-rescue. Step-by-step techniques for remounting your board in deep water, towing it to shore, and dealing with leash tangles.'
  definition: 'SUP self-rescue is the technique of re-mounting your paddle board in deep water after falling off, including board recovery, body re-mounting, and paddle retrieval.'
  tldr: 'After falling: stay calm, keep hold of the paddle, swim to the board. Place paddle across the board. Use a dolphin kick to propel chest onto the board. Swing one leg up, then the other. Kneel first, then stand. Practice in calm water until it is muscle memory.'
  problem: 'You fall off your SUP in deep water and cannot get back on. The board is slippery, you are tired, and panic sets in. Without knowing self-rescue technique, a simple fall becomes dangerous.'
  explanation: 'Self-rescue has three stages: recovery (swim to board and paddle), re-mount (get back on the board), and continuation (resume paddling). The key technique is using the paddle as a stabilizer and using powerful leg kicks to propel the upper body onto the board.'
  solution: 'Stage 1: swim to the board. Keep hold of paddle or retrieve it. Stage 2: place paddle perpendicular across the board. Kick legs vigorously while pulling chest onto the board center. Stage 3: once chest is on board, swing legs up one at a time. Stage 4: kneel, catch breath, then stand gradually.'
  recommendation: 'Practice self-rescue in controlled conditions until you can do it without thinking. Use the Paddle Board Overstock SUP Explorer 11 which has good deck traction. The Life Vest Pro provides extra flotation if you struggle.'
  faq:
    - q: How do I get back on if I am exhausted?
      a: Stay with the board for flotation. Use your arms to pull chest onto board, even if legs cannot kick effectively. Rest in kneeling position before standing.
    - q: What if I lose the paddle?
      a: Use arms to paddle the board to shore. Ask another paddler for assistance. Replace lost paddle immediately.
    - q: Can I self-rescue in waves?
      a: Yes — position the board perpendicular to waves. Time your re-mount between waves. The leash keeps the board nearby.
    - q: How do I deal with a leash tangle?
      a: Stay calm, float on your back, untangle the leash slowly. If the leash is wrapped around fins, you may need to remove fins while in water.
