- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'SUP Paddle Guide: Choose the Right Paddle for Your Style'
  description: 'Complete guide to SUP paddles — length, materials (aluminum, fiberglass, carbon), blade shapes, and how paddle choice affects your paddling experience.'
  definition: 'A SUP paddle consists of a shaft (aluminum, fiberglass, or carbon) and a blade (dihedral, scoop, or flat). Length should be 8-10" above your height for general paddling.'
  tldr: 'Paddle length: 8-10" above your height for all-around use, 6-8" for surf, 10-12" for touring. Materials: aluminum (cheap, heavy), fiberglass (mid-range, good flex), carbon (light, stiff, expensive). Blade shape: dihedral (stable tracking), scoop (power), flat (versatile). Adjustable paddles are great for beginners.'
  problem: 'The included paddle with most iSUPs works but is heavy and inefficient. Upgrading improves paddling efficiency and enjoyment, but the options are confusing.'
  explanation: 'Paddle length affects stroke efficiency — too short requires bending over, too long causes shoulder fatigue. Material determines weight: carbon paddles are 18-24 oz versus 28-36 oz for aluminum. Blade size affects power: larger blades (100+ sq in) provide more propulsion per stroke but fatigue faster. Dihedral blades track straight; scoop blades provide more catch.'
  solution: 'For the correct length: stand with paddle vertical, reach arm up — the paddle handle should hit your wrist. For material: start with fiberglass as a mid-weight upgrade. For blade: choose dihedral for general paddling. For activities: touring paddles are longer with smaller blades; surf paddles are shorter with wider blades.'
  recommendation: 'The Paddle Board Overstock carbon paddle at 28 oz is the best upgrade for frequent paddlers. The included adjustable 3-piece aluminum paddle is adequate for beginners and travel.'
  faq:
    - q: How long should my SUP paddle be?
      a: Measure your height in inches and add 8-10 for all-around paddling. For surfing, add 6-8. For touring, add 10-12.
    - q: Is a carbon paddle worth the money?
      a: Yes for regular paddlers — the weight reduction reduces fatigue significantly over long sessions. For occasional use, fiberglass is good value.
    - q: What is an adjustable paddle?
      a: A 2 or 3-piece paddle with length adjustment, ideal for sharing between users or adjusting for different activities.
    - q: How do I care for my paddle?
      a: Rinse with fresh water after saltwater use. Avoid driving over it or storing in direct heat. Check the ferrule (joint) for sand.
