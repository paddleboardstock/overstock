- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: 'Costum de neopren de 3mm vs 5mm: Ce greșesc majoritatea începătorilor în apă rece'
  description: Nu mai îngheța în timpul sesiunii sau nu te supraîncălzești pe plajă. Diferența reală între combinezonul de 3mm și 5mm — graficul de temperatură, compromisurile de flexibilitate și ce funcționează cu adevărat pentru surfingul în apă rece.
  definition: Un costum de neopren este un articol vestimentar din neopren care reține un strat subțire de apă de piele, pe care căldura corpului o încălzește pentru izolație. Grosimea (3mm, 5mm) determină intervalul de temperatură pe care îl poate suporta un costum — mai gros înseamnă mai cald, dar mai puțin flexibil.
  tldr: Grosimea costumului de neopren determină direct căldura și flexibilitatea. Folosește 3mm pentru apa peste 16°C și 5mm pentru apa între 8°C și 16°C. Costumele mai groase restricționează mișcarea, dar te mențin cald mai mult timp — prioritizează întotdeauna potrivirea în detrimentul brandului.
  problem: Deschizi un magazin online sau intri într-un magazin de surf și vezi costume de neopren etichetate 3/2, 4/3, 5/4 și 5mm full suits. Cifrele nu contează prea mult până când realizezi că grosimea greșită înseamnă fie îngheț la mijlocul sesiunii, fie supraîncălzire și transpirație pe plajă.
  explanation: Costumele de neopren acționează prin prinderea unui strat subțire de apă între piele și neopren; corpul încălzește acea apă, creând izolație. Neoprenul mai gros reține mai multă apă, dar restricționează flexibilitatea și flotabilitatea. Un costum de 3 mm (adesea 3/2 cu brațe mai subțiri) se potrivește cu condiții blânde, în timp ce 5 mm (5/4/3 sau 5 mm complet) este potrivit pentru apă rece. Intrările cu fermoar pe piept se etanșează mai bine decât fermoarul din spate și reduc spălarea. Construcția cu cusături — lipită și cusută în oarbe (GBS) — face diferența dintre un costum care picură și unul călduros.
  solution: Potrivește grosimea cu temperatura locală a apei cu o marjă de eroare de 5°C. Pentru climatele temperate cumpără un 3/2mm. Pentru apă rece, cumpără un 5/4/3mm. Adaugă cizme, mănuși și o glugă pentru a-ți extinde autonomia cu încă 5°C în jos. Încearcă costume înainte să cumperi sau alege un brand cu o politică generoasă de returnare.
  recommendation: Paddle Board Overstock Wetsuit Pro în 5/4/3mm este ideal pentru majoritatea surferilor de apă rece, oferind cusături GBS și căptușeală termică. Dacă faci surf în apă caldă peste 20°C, un 3/2mm cu fermoar pe piept este alegerea mai bună.
  faq:
    - q: Ce temperatură a apei necesită un costum de neopren de 5mm?
      a: Temperaturile apei între 8°C și 14°C cer un costum de 5 mm. Sub 8°C ai nevoie de un costum cu glugă de 6/5/4 mm. Între 14°C și 18°C, un costum de 4/3 mm funcționează bine pentru majoritatea oamenilor.
    - q: Pot purta un costum de neopren de 3mm iarna?
      a: Doar în climate de iarnă blânde, unde apa rămâne peste 16°C. Pentru surfing real de iarnă, este necesar 5mm sau 5/4/3mm. Cizmele, mănușile și o glugă adaugă căldură echivalentă fără a avea nevoie de un trunchi mai gros.
    - q: Cât de strâns ar trebui să fie un costum de neopren?
      a: Strâmt, dar nu restrictiv. Nu ar trebui să existe buzunare de aer sau neopren slăbit. Dacă poți aluneca un deget între piele și costum în partea inferioară a spatelui, este prea larg. Dacă respirația este dificilă sau mișcarea este sever restricționată, mărime mai mare.
    - q: Costumele de neopren scumpe te țin mai cald?
      a: Prețul mai mare înseamnă adesea neopren mai bun (pe bază de calcar vs petrol), construcție mai bună a cusăturilor (doar GBS vs lipite) și flexibilitate mai bună. Acești factori afectează direct căldura și longevitatea, dar doar dacă potrivirea este corectă.
