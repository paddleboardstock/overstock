      a: Da, vâslele includ vâsle reglabile compatibile cu AirDeck RIB și cu bărci în serie.
    - q: Din ce material sunt făcute vâslele?
      a: Arbori din aluminiu de calitate aeronautică cu pale din polipropilenă întărită. Cântăresc aproximativ 1,5 kg pe pereche.
