  title: 'SUP Ghid de mărime: Explicate lungimea, lățimea și volumul'
  description: Găsește SUP mărimea potrivită în funcție de greutatea, nivelul tău de abilitate și stilul de vâslit. Lungimea determină urmărirea, lățimea determină stabilitatea, iar volumul determină capacitatea de greutate.
  definition: SUP Dimensiunea este definită de lungime (viteză și alunecare), lățime (stabilitate primară), grosimea (stabilitatea secundară și volumul) și volumul în litri (capacitatea totală de greutate).
  tldr: 'TotalSUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Turism: 12''-14'' x 30"-32" (280-350L). Valuri: 8''-10'' x 30"-32" (140-220L). Începătorii au nevoie de o lățime peste 32" și un volum care depășește greutatea corporală cu 60-80L. Greutatea ta în kg plus 60L este ținta minimă de volum pentru stabilitate.'
  problem: Fiecare SUP marcă listează plăcile în picioare, inci și litri, dar fără să știi cum se traduc aceste măsurători în senzația reală, riști să cumperi o placă care este înclinată, lentă sau care nu poate susține greutatea ta.
  explanation: 'Lungimea determină cât de repede vâslește placa și cât de bine merge în linie dreaptă. Plăcile mai lungi (12''+) alunecă între lovituri și mențin linia. Plăcile mai scurte (sub 10'') se învârt ușor, dar necesită schimbări de palete mai frecvente. Lățimea determină stabilitatea principală — stabilitatea în picioare. O placă de 30" pare înclinată pentru începători; 34" se simte ca un dock. Grosimea determină volumul — o placă mai groasă plutește mai sus, dar prinde mai mult vânt. Volumul în litri este cel mai bun indicator: placa încărcată (tu plus echipamentul) ar trebui să se scufunde cu 2-4 inch în repaus.'
  solution: 'Potrivește dimensiunile plăcii tale la trei factori: greutatea ta (determină volumul minim), activitatea principală (determină lungimea) și nivelul de abilitate (determină lățimea). Pentru începători, înmulțește greutatea în kg cu 2,2 pentru a obține litri minimi. Pentru intermediari, înmulțește cu 1,8. Pentru avansat, înmulțește cu 1,4.'
  recommendation: Paddle Board Overstock SUP Explorer 11 de 11' x 33" x 6" cu 260L se potrivește majorității cicliștilor de până la 100 kg pentru vâslit complet. Upgradează la SUP Tour 12 de 12' x 31" pentru viteză și alunecare mai bune.
  faq:
    - q: Ce SUP mărime am nevoie pentru greutatea mea?
      a: 'Pentru cicliștii sub 70 kg: 10-11'' x 32" (220-260L). Pentru 70-90 kg: 11-12'' x 33" (260-300L). Pentru 90-110 kg: 11-12'' x 34" (300-350L). Pentru peste 110 kg: 12'' x 34-36" (350L+).'
    - q: Este mai SUP lung mai rapid?
      a: Da. Plăcile mai lungi au un raport lungime-lățime mai bun, reducând rezistența la înaintare. O placă de 14' touring SUP este semnificativ mai rapidă decât una de 11' all-around la același efort de vâslit.
    - q: Ce SUP lățime este stabilă pentru începători?
      a: 33-34 inch este zona optimă pentru începători până la 90 kg. Sub 32" necesită un echilibru bun. Peste 34" este foarte stabil, dar mai lent și mai greu de vâslit în vânt.
    - q: Pot folosi o placă versatilă pentru tururi?
      a: Da, pentru tururi scurte sub 10 km. Pentru distanțe mai lungi, o placă dedicată pentru turism urmărește mai bine și acoperă distanțele mai eficient.
