- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hidratare și protecție solară: Fii în siguranță pe apă'
  description: Strategii esențiale de hidratare și protecție solară pentru SUP vâslași. Deshidratarea și arsurile solare sunt cele mai SUP frecvente probleme — cum să le previi pe ambele în timpul sesiunilor lungi.
  definition: SUP Hidratarea înseamnă menținerea echilibrului fluidelor în timpul vâslitului prin consumul regulat de apă. Protecția solară implică aplicarea SPF, îmbrăcăminte de protecție și sesiuni de cronometrare pentru a evita UVvârfurile maxime.
  tldr: Bea 500 ml de apă pe oră de vâslit. Adu mai mult decât crezi că ai nevoie — o vezică de 2L sau mai multe sticle. Aplică cremă solară SPF 50 rezistentă+ la apă înainte de a vâsli și reaplică la fiecare 2 ore. Poartă o pălărie, ochelari de soare cu curea și haine cu rating UPF. Evită vâslitul între 11:00 și 15:00, când UV este cel mai puternic.
  problem: Ai o SUP ședință grozavă, dar după o oră ai dureri de cap, gură uscată și pielea arde. Deshidratarea și arsurile solare te surprind pentru că apa te menține răcoros.
  explanation: Reflexia de pe apă UV intensifică expunerea cu până la 40%. Efectul răcoritor al apei și al brizei maschează arsurile solare până când este prea târziu. Transpirația de la vâslit crește pierderea de lichide, iar adesea nu există un loc unde să reumpli apa pe apă. Deshidratarea afectează echilibrul și luarea deciziilor, crescând riscul de accidente.
  solution: Atașează o sticlă de apă sau o vezică de hidratare la sistemul elastic al plăcii. Bea la fiecare 15 minute, fie că îți este sete sau nu. Aplică+ cremă solară SPF 50 cu 30 de minute înainte de lansare. Poartă o pălărie cu boruri late, ochelari de soare polarizați cu curea și protecție anti-erupție UPF 50+. Reaplică crema de protecție solară la fiecare 2 ore.
  recommendation: Folosește o vezică de hidratare prinsă pe inelele D frontale Paddle Board Overstock SUPale tale. Poartă o+ protecție anti-erupție UPF 50 sub PFD. Folosește o cremă de protecție solară impermeabilă care rămâne aplicată în transpirație și apă.
  faq:
    - q: Câtă apă ar trebui să iau într-o SUP călătorie?
      a: Minim 1 litru pe oră. Pentru o ședință de 2 ore, adu 2 litri. Mai mult în vreme caldă. O vezică de hidratare funcționează cel mai bine.
    - q: Ce tip de cremă de protecție solară este cea mai SUPpotrivită?
      a: Rezistente la apă, SPF+ 50 cu spectru larg. Cremele minerale de protecție solară (oxid de zinc, dioxid de titan) sunt sigure pentru recif și durează mai mult.
    - q: Reflectă apa cu adevăratUV?
      a: Da — apa reflectă până la 40% UV din radiații, ceea ce înseamnă că o primești UV de sus și de jos. Acest lucru crește semnificativ riscul de arsuri.
    - q: Pot să mă ard la soare prin un rashguard?
      a: Protecțiile standard oferă protecție minimă UV (aproximativ UPF 10-20). Caută haine cu rating UPF 50+ pentru protecție completă.
