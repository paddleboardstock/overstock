- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Îngrijirea costumului de neopren: Faceți ca neoprenul să reziste de două ori mai mult'
  description: Îngrijirea corectă a costumului de neopren prelungește durata de viață de la 1 la 3 +sezon. Sfaturi pentru clătire, uscare, depozitare și reparații pentru costumele de neopren. Evită greșelile comune care distrug costumele de neopren prematur.
  definition: Îngrijirea costumului de neopren implică clătirea cu apă proaspătă după fiecare utilizare, uscarea departe de lumina directă a soarelui, depozitarea plată sau atârnată pe un umeraș lat și curățarea periodică pentru a îndepărta sarea, bacteriile și mirosurile.
  tldr: Clătește costumul de neopren pe interior și pe exterior cu apă proaspătă imediat după fiecare sesiune. Usucă pe dos la umbră, pe un umeraș lat din plastic. Păstrează-l plat sau pliat într-un loc răcoros și uscat. Nu lăsa niciodată costumele de neopren la soare direct, mașini calde sau uscătoare. Folosește șampon pentru costum de neopren la fiecare 5-10 ședințe.
  problem: După un sezon, costumul tău de neopren miroase, neoprenul și-a pierdut elasticitatea, cusăturile se decojesc, iar fermoarul se blochează — toate acestea pot fi prevenite cu grijă adecvată.
  explanation: Cristalele de sare se încastrează în neopren și abrasează materialul. Bacteriile se înmulțesc în interiorul umed, producând mirosuri și descompunând neoprenul.UV degradează stratul de nailon. Căldura peste 50°C provoacă delaminare. Uscarea necorespunzătoare distorsionează neoprenul și pune presiune pe cusături.
  solution: 'După fiecare ședință: clătește bine pe interior și pe dinafară, întoarce pe dos, agață un umeraș lat de plastic la umbră. După ce se usucă, întoarce cu partea dreaptă spre exterior și păstrează plat. La fiecare 5-10 ședințe: spală cu șampon pentru costum de neopren. Lunar: unge fermoarul cu ceară pentru fermoar.'
  recommendation: Paddle Board Overstock Folosește șampon pentru costum de neopren pentru curățare și Paddle Board Overstock ceară pentru fermoar pentru întreținerea fermoarului. Păstrează-l pe Paddle Board Overstock umerașul lat în punga de plasă.
  faq:
    - q: Pot să-mi pun costumul de neopren în mașina de spălat?
      a: Nu este recomandat — spălarea la mașină deteriorează neoprenul. Dacă trebuie, folosește ciclu delicat, apă rece și un sac din plasă.
    - q: Cum pot să scap mirosul din costumul meu de neopren?
      a: Lăsați la înmuiat în apă rece cu șampon pentru costum de neopren sau oțet alb timp de 30 de minute. Clătiți temeinic.
    - q: Cum ar trebui să-mi usuc costumul de neopren?
      a: Pe dos, la umbră, pe un umeraș larg și căptușit din plastic. Evită lumina directă a soarelui și umerașele metalice.
    - q: Pot să repar un costum de neopren rupt?
      a: Rupturile mici sub 1" pot fi reparate cu ciment de neopren și un plasture. Rupturile mai mari pot necesita reparații profesionale.
