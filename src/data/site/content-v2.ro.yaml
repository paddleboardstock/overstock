- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Auto-salvare: Cum să te urci din nou pe placă în ape adânci'
  description: Fiecare SUP vâslaș ar trebui să stăpânească auto-salvare. Tehnici pas cu pas pentru a te urca din nou pe placă în ape adânci, pentru a o tracta până la mal și pentru a rezolva încâlcăturile cu lesa.
  definition: SUP Auto-salvarea este tehnica de a remonta placa de paddle în apă adâncă după ce ai căzut, inclusiv recuperarea plăcii, remontarea corpului și recuperarea cu vâsla.
  tldr: 'După cădere: rămâi calm, ține paleta, înoată până la placă. Așază paleta peste placă. Folosește o lovitură de delfin pentru a propulsa pieptul pe placă. Ridică un picior, apoi celălalt. Îngenunchează mai întâi, apoi ridică-te. Exersează în apă calmă până devine memorie musculară.'
  problem: Cazi SUP de pe apă adâncă și nu te poți urca înapoi. Placa este alunecoasă, ești obosit și panica se instalează. Fără să cunoști tehnica de auto-salvare, o simplă cădere devine periculoasă.
  explanation: 'Auto-salvarea are trei etape: recuperare (înot până la placă și vâslit), re-urcare (revenirea pe placă) și continuare (reluarea vâslitului). Tehnica cheie este folosirea paletei ca stabilizator și lovituri puternice cu picioarele pentru a propulsa partea superioară a corpului pe placă.'
  solution: 'Etapa 1: înoată până la placă. Ține paleta în mână sau recupereaz-o. Etapa 2: plasează paleta perpendicular pe placă. Lovește picioarele cu putere în timp ce tragi pieptul de centrul plăcii. Etapa 3: odată ce pieptul este pe bord, ridică picioarele pe rând. Etapa 4: îngenunchezi, trage respirația, apoi ridică-te treptat.'
  recommendation: Exersează auto-salvarea în condiții controlate până când poți face asta fără să gândești. Folosește Paddle Board Overstock SUP Explorer 11, care are tracțiune bună pe punte. Life Vest Pro oferă plutire suplimentară dacă ai dificultăți.
  faq:
    - q: Cum pot să mă întorc dacă sunt epuizat?
      a: Rămâi cu placa pentru a pluti. Folosește brațele pentru a trage pieptul pe placă, chiar dacă picioarele nu pot lovi eficient. Odihnește-te în poziție de genunchi înainte de a te ridica.
    - q: Ce se întâmplă dacă pierd paleta?
      a: Folosește brațele pentru a vâsli placa până la țărm. Cere ajutorul altui vâslător. Înlocuiește imediat vâsla pierdută.
    - q: Pot să mă salvez singur în valuri?
      a: Da — poziționează placa perpendicular pe valuri. Cronometrează re-urcarea între valuri. Lesa ține placa aproape.
    - q: Cum mă descurc cu o încurcătură în lesă?
      a: Rămâi calm, plutește pe spate, descurcă lesa încet. Dacă lesa este înfășurată în jurul înotătoarelor, s-ar putea să fie nevoie să le scoți în apă.
