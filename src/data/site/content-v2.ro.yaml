- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Ghid de mărime pentru paddle board: Volum, lungime și lățime pentru fiecare rider'
  description: Mărime completă pentru paddle board, cu recomandări de volum după greutate și activitate. Include un tabel de mărimi ușor de folosit pentru plăci all-around, touring, surfing și SUP yoga.
  definition: Dimensiunea plăcii de vâsle este determinată de volum (capacitate de greutate și plutire), lungime (viteză și urmărire), lățime (stabilitate) și grosime (distribuția volumului și rezistența la vânt).
  tldr: 'Folosește greutatea pentru a găsi volumul minim: 50-70 kg necesită 220-260L, 70-90 kg necesită 260-300L, 90-110 kg necesită 300-350L, 110+ kg necesită 350L+. Pentru începători, adaugă 20% la aceste cifre. Lățimea contează: 32" este intermediar, 33-34" este prietenos pentru începători, 35"+ este foarte stabil.'
  problem: Listele de mărimi ale plăcilor de paddle folosesc picioare, inci și litri interschimbabil, ceea ce face dificilă compararea între branduri.
  explanation: Volumul este cel mai direct indicator al capacității de greutate — 1 litru de apă dulce deplasează 1 kg de greutate. O placă cu 260L poate susține teoretic 260 kg, dar capacitatea practică este mai mică pentru că placa trebuie să stea deasupra apei. Greutatea totală (corp plus echipament) ar trebui să fie 30-40% din volumul plăcii.
  solution: Volumul țintă = (greutatea corporală în kg + , greutatea angrenajului în kg) x 3. Pentru un vâslaș de 75 kg cu echipament de 5 kg, ținta = 80 x 3 = minim 240L. Pentru începători, înmulțește cu 3,5. Pentru avansat, înmulțește cu 2,5.
  recommendation: Paddle Board Overstock SUP Explorer 11 (260L, 11' x 33" x 6") se potrivește majorității riderilor de 50-100 kg. Riderii mai ușori pot ajunge la AirDeck 270. Riderii mai grei ar trebui să se uite la SUP Tour 12 (300L+) sau plăci mai late.
  faq:
    - q: Contează înălțimea pentru SUP mărime?
      a: Înălțimea contează mai puțin decât greutatea. Un călăreț înalt și ușor are nevoie de mai puțin volum decât unul scund, greu. Folosește greutatea ca principal factor de volum.
    - q: Ce se întâmplă cu volumul prea mare?
      a: Placa stă prea sus, prinzând vântul ca o velă. Se simte ca un val de plut. Totuși, pentru începători, volumul suplimentar este mai bine decât prea puțin.
    - q: Ce se întâmplă când volumul este prea mic?
      a: Placa stă prea adânc, creând rezistență la înaintare. Nose se poate scufunda în timpul vâslării (pearling). Obosești rapid dacă vâslești o placă parțial scufundată.
    - q: Plăcile gonflabile au nevoie de dimensiuni diferite față de plăcile dure?
      a: Nu semnificativ. Gonflabilele la 15+ PSI deplasează apa similar cu plăcile dure. Recomandările de volum se aplică în mod egal ambelor tipuri.
