- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Ce să porți pentru surfing (Nu te prezinta în pantaloni scurți de placă când ai nevoie de un 5/4)
  description: Nu mai ghici ce să porți. Temperatura apei, nu temperatura aerului, determină ținuta ta de surf. Ghid complet de stratificare, de la rashguard-uri tropicale până la aranjamente de iarnă 5/4/3mm.
  definition: Ținuta de surf variază de la pantaloni scurți de plajă și protecții anti-erupție în apă caldă până la costume complete de neopren de 5/4/3 mm cu cizme și glugi în apă rece. Temperatura apei, nu temperatura aerului, determină ce ai nevoie.
  tldr: Ce porți la surfing depinde în totalitate de temperatura apei — nu de temperatura aerului. Rashguard-urile și pantalonii scurți de surf funcționează peste 22°C, combinezonele de arc acoperă 18-22°C, combinezonele complete de 3/2mm rezistă la 14-18°C, iar 5/4/3mm cu cizme sunt necesare sub 14°C. Poartă UV întotdeauna protecție și ia în considerare o lesă și o vestă de impact.
  problem: Ajungi la plajă și nu ai nicio idee dacă un rashguard este suficient sau dacă ai nevoie de un costum de neopren complet. Temperatura aerului este caldă, dar apa este rece, sau apa pare ok, dar vântul este înghețat. Îmbrăcămintea greșită înseamnă o ședință ruinată.
  explanation: 'Echipamentul de surfing are trei scopuri: izolație termică, UV protecție și prevenirea abraziunii. Costumele de neopren din neopren sunt evaluate după grosime și acoperire — combinezonul de primăvară (brațe sau picioare scurte) este pentru zile la limită, combinezonul complet pentru apă rece. Rezistențele protejează împotriva iritării plăcilor și a soarelui, dar nu oferă valoare termică. Cizmele, mănușile și glugile nu sunt accesorii, ci echipament esențial pentru surfingul în apă rece sub 12°C.'
  solution: 'Verifică raportul local de temperatură al geamandurilor sau al apei vii înainte de a pleca. Construiește un kit bazat pe cea mai friguloasă condiție tipică: protecție anti-erupție și pantaloni scurți pentru vară, un costum complet de 3/2mm pentru primăvară și toamnă, unul de 5/4/3mm cu cizme și glugă pentru iarnă. Adaugă întotdeauna o lesă și ia în considerare o vestă de plutire pentru siguranță.'
  recommendation: Investește mai întâi într-un costum complet bun de 3/2mm — acoperă cea mai largă gamă de condiții. Adaugă un costum de 5/4/3mm și bocanci dacă plănuiești să faci surfing pe timpul iernii. Paddle Board Overstock Wetsuit Pro cu căptușeală termică face eficient legătura între ambele intervale de temperatură.
  faq:
    - q: Pot să fac surf doar în pantaloni scurți de boarding?
      a: Da, în ape tropicale peste 24°C. Poate vrei un rashguard pentru a preveni iritarea pieptului și brațelor cauzată de vâslit. Ceara sau o pernă de tracțiune pe placă ajută la compensarea lipsei de aderență a costumului.
    - q: Am nevoie de bocanci de surf?
      a: Dacă temperatura apei scade sub 14°C, bocancii previn amorțeala și îți protejează picioarele de pietre și tăieturi de recif. De asemenea, adaugă aderență pe placă. Majoritatea surferilor din climatele nordice folosesc bocanci din noiembrie până în martie.
    - q: Ce este un costum de primăvară?
      a: Un costum de arc este un costum de neopren cu brațe scurte sau picioare scurte (sau ambele), conceput pentru apă între 18°C și 22°C. Oferă mai multă căldură decât un rash guard, dar mai puțină acoperire decât un costum complet.
    - q: Ar trebui să port o vestă de salvare în timp ce fac surf?
      a: Nu veste de salvare tradiționale, dar o vestă de impact sau un ajutor de plutire pot ajuta în condiții dificile sau dacă ești un înotător slab.Paddle Board Overstock Vestele de salvare sunt concepute pentru SUP caiac, dar pot oferi încredere suplimentară în plutire pentru începătorii în surf.
