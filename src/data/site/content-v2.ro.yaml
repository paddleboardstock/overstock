- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Ghid pentru ancoră: Rămâi pe loc în timp ce pescuiești sau fotografiezi'
  description: Ghid complet pentru SUP ancorare — tipuri de ancore (ciupercă, pliere, țăruși), configurarea căruciorului ancorelor, tehnici de desfășurare și considerații de siguranță pentru menținerea poziției.
  definition: SUP O ancoră este o greutate atașată de o frânghie care ține placa în poziție împotriva vântului și curentului. Tipurile comune includ ancore tip ciupercă, ancore pliabile și stâlpi de fixare.
  tldr: Folosește o ancoră tip ciupercă (1,5-3 lb) pentru funduri noroioase sau nisipoase, o ancoră pliabilă pentru funduri stâncoase sau un stâlp de fixare pentru ape puțin adânci cu fund moale. Ancora ar trebui să cântărească 1,5-3 lb pentru condiții calme, 3-5 lb pentru vânt și curent. Folosește întotdeauna un cărucior de ancorare pentru a ajusta poziția și a ști când să eliberezi.
  problem: Găsești locul perfect de pescuit, dar vântul și curentul te deplasează la fiecare câteva minute. Fără ancorare, SUP pescuitul și fotografia sunt exerciții frustrante de repoziționare constantă.
  explanation: O ancoră funcționează prin tragerea pe fund până când se agață. Ancorele ciuperci se înfig în fundurile moi și oferă o bună fixare în nisip și noroi. Ancorele pliabile au flukes care se adâncesc în fundurile dure sau stâncoase. Stâlpii de fixare funcționează în apă puțin adâncă, împingând direct fundul.
  solution: Instalează un sistem de cărucior cu ancoră (o linie cu un inel glisant pe o parte a plăcii) pentru a ajusta punctul de prindere al ancorei. Atașează 50-75' de frânghie la ancoraj. Desfășoară poziția dorită sau în amont. Folosește un sistem de eliberare rapidă pentru a te desprinde în situații de urgență. Nu ancora niciodată în curent puternic sau unde nu poți recupera ușor ancora.
  recommendation: O ancoră pliabilă de 3 lb cu 50' de frânghie funcționează pentru majoritatea SUP condițiilor de pescuit. Adaugă un sistem de cărucior cu ancoră folosind inelele D de pe Paddle Board Overstock SUP Explorer 11.
  faq:
    - q: Ce mărime de ancoră am SUPnevoie?
      a: 1,5-3 lb pentru lacuri liniștite și râuri lente. 3-5 lb pentru zonele de coastă cu vânt sau curent. Ancorele supradimensionate sunt greu de recuperat.
    - q: Câtă linie de ancorare am nevoie?
      a: Un telescop 5:1 (5 picioare de fir pentru fiecare 1 picior adâncime) este standard. La 10' adâncime, folosește 50' de fir.
    - q: Este periculoasă ancorarea pe SUPun ?
      a: Doar dacă ancorezi în curent sau vânt suficient de puternic încât să răstoarne placa. Folosește întotdeauna un sistem de eliberare rapidă care poate fi detașat instantaneu.
    - q: Pot să ancorez în orice apă?
      a: Verifică reglementările locale. Unele zone restricționează ancorarea pentru a proteja iarba marină sau habitatele marine. Nu ancora niciodată pe recife de corali.
