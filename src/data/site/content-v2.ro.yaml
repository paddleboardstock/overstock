  type: buying-guide
  title: 'SUP Ghid pentru lesă: Lese drepte vs coiled explicate'
  description: Ghid complet despre SUP lese — drepte vs încolăcite, gleznă vs gambă, opțiuni de eliberare rapidă și cum să alegi lesa potrivită pentru condițiile tale de vâslit.
  definition: O SUP lesă este un șnur care atașează vâslașul de placă, prevenind separarea. Tipurile includ lesele drepte (pentru surfing și râuri) și lesele răsucite (pentru ape plate).
  tldr: Lesele încolăcite sunt cele mai bune pentru vâslit în apă plată și fitness — stau departe de placă și departe de apă. Lesele drepte sunt pentru SUP surfing și râuri — oferă mai multă libertate și nu se agăță. Atașarea gambei este preferată față de gleznă pentru confort. Lesele cu eliberare rapidă sunt importante pentru vâslitul pe râu pentru a preveni prinderea acestora.
  problem: Ai cumpărat o lesă cu SUP tine, dar nu ești sigur dacă este tipul potrivit pentru stilul tău de vâslit. Lesa greșită va trage, se va agăța sau va ceda când ai cea mai mare nevoie.
  explanation: Leash-urile drepte sunt simple cabluri din nailon sau poliuretan, care se întind în spatele plăcii. Funcționează bine în valuri pentru că nu se agață de aripioare. Leash-urile coiled sunt cabluri spiralate care se contractă când nu sunt sub tensiune — rămân încolăcite pe terasă când vâslești și se extind când cazi. Țin lesa departe de apă în condiții plate, reducând rezistența la înaintare.
  solution: Alege lesa spiralată pentru apă plată, fitness și SUPturism. Rezistența redusă ajută la menținerea vitezei și previne ca lesa să se agațe de obiecte subacvatice. Alege lesa dreaptă pentru SUP surfing și vâslit pe râu. Designul drept este mai puțin probabil să se agațe de înotătoare sau obstacole.
  recommendation: Paddle Board Overstock SUP Pachetele includ tipul de lesă adecvat pentru utilizarea intenționată a plăcii. Lesa spiralată din SUP pachetul Explorer 11 este excelentă pentru vâslit complet.
  faq:
    - q: Ar trebui ca lesa să se atașeze de gleznă sau de gambă?
      a: Atașarea pentru vițel este preferată SUP pentru — ține lesa departe de apă când vâslești și reduce riscul de împiedicare la mers.
    - q: Cât de SUP lungă ar trebui să fie o lesă?
      a: 8-10' pentru apă plată, 6-8' pentru valuri. Leșile mai scurte reduc rezistența la înaintare, dar limitează libertatea de mișcare pe placă.
    - q: Am nevoie de o lesă cu eliberare rapidă pentru râuri?
      a: Da — râul SUP necesită o lesă sau centură cu eliberare rapidă, care poate fi detașată instantaneu pentru a preveni prinderea în strecurătoare.
    - q: Pot folosi o lesă de surf pentru SUP?
      a: Lesele de surf sunt mai scurte și mai subțiri. Funcționează pentru SUP surfing, dar nu sunt ideale pentru vâslitul în apă plată, unde o lesă mai lungă și înfășurată este mai bună.
