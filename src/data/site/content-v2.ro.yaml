  title: 'SUP Depozitare gonflabilă: Modul corect de a-ți depozita iSUP-ul'
  description: Depozitarea gonflabilă adecvată SUP previne delaminarea, UV deteriorarea, mucegaiul și scurgerile supapelor. Sfaturi pentru depozitarea pe termen lung și depozitarea zilnică pentru drop-stitch scânduri.
  definition: Depozitarea gonflabilă SUP înseamnă menținerea plăcii într-un mediu curat, uscat și cu temperatură controlată, departe de UVtemperaturi extreme și daune fizice.
  tldr: Păstrează într-un loc răcoros și întunecat, sub 30°C, departe de lumina directă a soarelui. Pe termen scurt (1-2 săptămâni), păstrează parțial umflat la 8-10PSI. Pentru depozitare pe termen lung, dezumflă complet, rulează lejer și pune-o în punga de depozitare. Nu păstrați niciodată umed. Evitați rozătoarele și obiectele ascuțite.
  problem: Îl dezumfli SUP și îl bagi într-un garaj fierbinte sau într-un subsol umed. Trei luni mai târziu, PVC s-a îngălbenit, platforma de pe terasă se decojește și supapa scurge. Depozitarea necorespunzătoare cauzează mai multe daune decât utilizarea obișnuită.
  explanation: Căldura peste 50°C determină PVC migrația plastifiantelor, făcând materialul rigid și casant.UV Radiația descompune legăturile polimerice. Umiditatea prinsă în interior creează mucegai. Frigul sub zero devine PVC casant. Punctele de presiune cauzate de plierea strânsă creează cute permanente.
  solution: 'Depozitare pe termen scurt: clătește, usucă, umflă până la 10 PSIși depozitează de la sol într-o zonă umbrită. Depozitare pe termen lung: curăță temeinic, usucă complet, dezumflă complet, rulează cu placa de terasă spre exterior, pune-o în pungă, păstrează într-un dulap răcoros și uscat. Evită substanțele chimice și dăunătorii.'
  recommendation: Folosește Paddle Board Overstock geanta de transport pentru depozitare — UV blochează și previne zgârierea. Păstrează într-o cameră cu climatizare controlată. Adaugă un pachet deshidratant în interiorul pungii pentru medii umede.
  faq:
    - q: Pot să-mi SUP depozitez umflarea în garaj?
      a: Doar dacă garajul rămâne sub 30°C și nu are lumină directă la soare. Majoritatea garajelor depășesc 40°C vara.
    - q: Ar trebui să-l SUP depozitez în geantă?
      a: Da, punga protejează împotriva prafuluiUV, , și a daunelor fizice. Asigură-te că placa este complet uscată înainte de a o pune.
    - q: Poate înghețul să deterioreze un gonflabilSUP?
      a: Da. Sub zero, PVC devine casantă și se poate crăpa când este desfăcută sau umflată. Păstrează întotdeauna peste 5°C.
    - q: Cum ar trebui să mă SUP înrolez pentru depozitare?
      a: Rulează cu perna de puntă orientată spre exterior pentru a proteja partea de josPVC. Evită pliurile strânse. Alternează poziția pliului de fiecare dată.
