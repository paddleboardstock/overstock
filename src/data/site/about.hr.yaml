origin:
  tagline: Naše podrijetlo
  heading: |-
    Izgrađeno na vodi,<br />
    <span class="text-sky-600">vođen svrhom</span>
  paragraphs:
    - 'Aquafarer je započeo u obalnoj radionici s jednom barkom i tvrdoglavim uvjerenjem: morski proizvodi trebali bi biti dizajnirani kao da su važni — jer jesu.'
    - Naši osnivači, dva brodograditelja, vidjeli su industriju u kojoj su se radili kompromisi, materijali su se spustili u kvaliteti, a sigurnost se tretirala kao kvačica. Izgradili su prvi Aquafarer trup ne radi profita, nego da dokažu da pristupačna pomorska oprema također može biti istinski pouzdana.
    - Taj prvi trup je još uvijek u upotrebi danas. Taj princip se nikada nije promijenio.
    - Mi nismo najveći proizvođač. Ne proizvodimo najjeftinije proizvode. Ali svaki trup koji napusti našu radionicu prolazi kroz iste ruke koje su osnovale tvrtku — i zadovoljava isti standard koji je postavio prvi trup.
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: Aquafarer obalna radionica
philosophy:
  tagline: Naša filozofija
  heading: Ukorijenjeno u oceanu
  description: Ocean nije naše radno mjesto. On je naš učitelj. Svaka odluka o dizajnu započinje razumijevanjem kako se voda ponaša, kako se uvjeti mijenjaju i kako oprema mora reagirati.
  cards:
    - emoji: 🌊
      title: Poštujte vodu
      description: Voda je nepredvidiva. Naši proizvodi su dizajnirani za najgore uvjete, a ne za najbolje. Ako trup broda može izdržati jaku struju, podnijet će i jezero. Ako prsluk za spašavanje radi na otvorenom moru, prekomjerno je dizajniran za rijeku — i to je namjerno.
    - emoji: 🔧
      title: Izgrađeno da traje, a ne da se zamijeni
      description: Najodrživiji proizvod je onaj koji nije potrebno zamijeniti. Konstrukcija od PVC, Hypalon i drop-stitch za pomorsku upotrebu odabrana je zbog dugovječnosti. Još uvijek isporučujemo rezervne dijelove za trupove koje smo izgradili prije deset godina.
    - emoji: 🏆
      title: Pristupačno po dizajnu
      description: Vodeni sportovi ne bi trebali biti luksuz. Projektiramo proizvode koji pružaju profesionalnu razinu performansi po cijeni koja ima smisla za obitelji, vodiče i male operatore — a ne samo za komercijalne flote.
design:
  tagline: Filozofija dizajna
  heading: |-
    Dizajnirano za rub<br />
    <span class="text-sky-600">uvjeta</span>
  paragraphs:
    - Svaki Aquafarer proizvod počinje s jednim pitanjem:<em>koje je najgore stanje s kojim će se ovo suočiti?</em>Dizajniramo od ruba prema unutra, a ne od centra prema van.
    - Naši drop-stitch jezgre ocijenjene su za 15 PSI — ne zato što je 12 PSI nedovoljno za jezero, već zato što 15 PSI daska podnosi nagle valove bez savijanja. Naše Hypalon cijevi specificirane su za otpornost komercijalne kvalitete na UV — ne zato što svaki korisnik vesla u tropskim krajevima, već zato što je degradacija UV glavni uzrok prijevremenog kvara.
    - Ne dizajniramo prema cijeni. Dizajniramo prema točki sloma — zatim gradimo znatno iznad nje.
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: Aquafarer dizajn i inženjering
  stats:
    - value: '15'
      label: PSI jezgra<br />ocjena
    - value: 1,500+
      label: UV sati<br />testirano
    - value: 10yr
      label: trup<br />vijek trajanja
