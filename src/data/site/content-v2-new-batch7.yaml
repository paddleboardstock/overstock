- slug: rib-boat-ga-general-arrangement-core-parameters
  category: guide
  type: technical-reference
  title: RIB Rigid Inflatable Boat GA Drawing — Core Parameters to Mark on General Arrangement
  description: What parameters must appear on a RIB boat General Arrangement drawing for EU compliance and buyer specification, including hull data, tube data, capacities, and systems.
  definition: 'The General Arrangement (GA) drawing is the primary technical drawing showing the overall layout, key dimensions, and major equipment positions of a RIB boat, required in the RCD technical file and for buyer specification review.'
  tldr: A RIB GA drawing must show LOA, beam, tube diameter, deadrise angle, console/seat positions, fuel/electrical system locations, and capacity data — all with revision control and copyright notice.
  problem: Chinese RIB manufacturers often provide GA drawings that are incomplete (missing key parameters), use inconsistent units, or lack revision control. This creates specification confusion for buyers and compliance gaps for RCD technical files.
  explanation: 'A complete RIB GA drawing must include: Hull data (LOA, LWL, beam, draft, freeboard, deadrise angle at transom, hull material, displacement); Tube data (tube diameter, number of chambers, valve types, tube material and thickness, operating pressure); Capacities (maximum persons, maximum engine power in kW, maximum load in kg, fuel capacity); Layout (console position and type, seating positions, deck covering, grab rail positions, D-ring positions); Systems (fuel tank location and capacity, battery position, bilge pump, navigation lights, electrical panel); and Compliance data (design category, CE marking position, HIN location). The title block must include drawing status, copyright notice, revision letter, and date.'
  solution: 'Use a standardized GA template that covers all required parameters. Implement version control with revision letters (Rev-A initial, Rev-B first revision, etc.). Include a disclaimer stating the drawing is for specification and planning purposes, not manufacturing. Share GA PDFs freely as Tier 1 downloads; restrict DXF/DWG to qualified inquiries and STEP/IGES to project applications.'
  recommendation: 'Download Paddle Board Overstock RIB GA drawings from our Technical Drawings page for reference on how a complete GA should look.'
  faq:
    - q: What is the difference between a GA drawing and a manufacturing drawing?
      a: 'A GA drawing shows the overall layout and key dimensions for specification and planning. It does not include manufacturing details like laminate schedules, weld parameters, or tool paths. Manufacturing drawings are shared only under NDA with confirmed orders.'
    - q: Should I include the HIN on the GA drawing?
      a: 'The GA drawing should show the HIN location and format but not a specific HIN number (which is unique per hull). The model-specific GA is part of the Master Technical File; the HIN is assigned per individual hull during production.'
    - q: What file formats should GA drawings be provided in?
      a: 'PDF is the standard format for public distribution. DXF or DWG for planning-level 2D CAD integration (requires qualified inquiry). STEP or IGES for 3D model integration (requires project application).'
