- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Sukelluspukujen korjaus: Korjaa repeämät, saumat ja vetoketjut itse'
  description: Itse tehtävän märkäpuvun korjausopas neopreenin repeämiin, sauman irtoamiseen, vetoketjun jumittumiseen ja halkaistuihin polvisuojiin. Vaiheittaiset ohjeet neopreeniliiman käyttöön.
  definition: märkäpukujen korjaus sisältää vaurioituneen alueen puhdistamisen ja karhentamisen, neopreeniliiman levittämisen ja kovettamisen paineen alla vedenpitävyyden ja joustavuuden palauttamiseksi.
  tldr: 'Pienet repeämät alle 1: levitä neopreeniliimaa molemmille puolille, odota 10-15 minuuttia kunnes liima on tahmea, paina tiukasti, koveta painon alla 12 tuntia. Suuremmat repeämät tarvitsevat neopreenipalan. Vetoketjun ongelmat: voitele ensin, tarkista sitten kankaan tarttumiset.'
  problem: Sukelluspukussasi on pieni repeämä, sauma irtoamassa tai vetoketju jumissa. Ilman tee-se-itse -korjausta maksat $150+ korvaavasta, kun korjaus maksaa $5.
  explanation: Neopreeniliima toimii pehmittämällä neopreenipintaa, jolloin syntyy kemiallinen sidos liuottimen haihtuessa. Liimaa on levitettävä molemmille pinnoille ja sen on oltava tahmea ennen liittämistä. Repeämien kohdalla reunojen on oltava tarkasti kohdakkain. Vetoketjuongelmat johtuvat usein suolavaurioista tai kankaan tarttumisesta hampaisiin.
  solution: 'Reikiä varten: puhdista alkoholilla, hio kevyesti, levitä ohut kerros sementtiä molemmille reunoille, odota kunnes tahmea, paina yhteen täydellisesti, aseta paino, koveta 12-24 tuntia. Paikkoja varten: leikkaa paikka 1" isommaksi kuin repeämä, levitä sementtiä molemmille, purista kiinni. Vetoketjua varten: huuhtele, levitä vetoketjun vahaa, käsittele varovasti.'
  recommendation: Pidä Aquafarer-märkäpuvun korjaussarja varustelaukussasi. Suurien korjausten tai saumojen pettämisen kriittisissä kohdissa suositellaan ammattilaisen tekemää korjausta.
  faq:
    - q: Voinko käyttää superliimaa märkäpuvussa?
      a: Ei — pikaliima kovettuu kovaksi ja hauraaksi. Käytä märkäpukujen korjauksissa vain neopreeniliimaa tai Aquasealia.
    - q: Kuinka kauan neopreeniliimamassalla tehty korjaus kestää?
      a: Asianmukaisesti tehty korjaus on usein vahvempi kuin alkuperäinen neopreeni ja kestää puvun jäljellä olevan käyttöiän.
    - q: Voinko korjata vetoketjun, joka on täysin irronnut?
      a: Jos vetoketju on irronnut neopreenista, liimaa se uudelleen kontaktisementillä. Jos hampaat ovat vaurioituneita, vaihda vetoketju ammattilaisen toimesta.
    - q: Kuinka korjaan märkäpuvun sauman vuotamisen?
      a: Levitä ohut kerros aquasealia vuotavan sauman sisäpuolelle ja anna kuivua 24 tuntia.
