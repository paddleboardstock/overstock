- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Nesteytys ja auringonsuoja: Pysy turvassa veden äärellä'
  description: Tärkeät nesteytys- ja aurinkosuojastrategiat SUP melojille. Nestehukka ja auringonpolttama ovat yleisimpiä SUP ongelmia — kuinka estää molemmat pitkien harjoitusten aikana.
  definition: SUP nesteytys tarkoittaa nesteiden tasapainon ylläpitämistä melonnan aikana säännöllisellä veden nauttimisella. Aurinkosuojaus sisältää aurinkosuojavoiteen käytön, suojavaatetuksen ja melontaharjoitusten ajoittamisen niin, että vältytään huipputunteina auringolle altistumiselta UV.
  tldr: Juo 500 ml vettä tunnissa melontaa kohden. Ota mukaan enemmän kuin luulet tarvitsevan — 2 litran vesirakkoinen tai useita pulloja. Levitä vedenkestävä SPF 50+-aurinkovoide ennen melontaa ja uudelleenasenna se kahden tunnin välein. Käytä hattua, aurinkolaseja hihnalla ja UPF-luokiteltua vaatetusta. Vältä melomista klo 11–15, kun UV on vahvimmillaan.
  problem: Sinulla on loistava SUP-istunto, mutta tunnin jälkeen sinulla on päänsärky, kuiva suu ja ihosi palaa. Nestehukka ja auringonpolttama hiipivät yllesi, koska vesi viilentää sinua.
  explanation: Veden heijastus lisää UV altistusta jopa 40 %. Veden ja tuulen viilentävä vaikutus peittää auringonpolttaman, kunnes on liian myöhäistä. Melonnasta johtuva hikoilu lisää nestehukkaa, eikä vedessä ollessa usein ole paikkaa täyttää vettä. Nestehukka heikentää tasapainoa ja päätöksentekoa, mikä lisää onnettomuusriskiä.
  solution: Kiinnitä vesipullo tai nesteytysletku laudan kuminauhoihin. Juo joka 15. minuutti, olitpa janoinen tai et. Levitä SPF 50+ aurinkovoidetta 30 minuuttia ennen lähtöä. Käytä leveälieristä hattua, polarisoituja aurinkolaseja hihnalla ja UPF 50+ suojavaatetusta. Levitä aurinkovoidetta uudelleen kahden tunnin välein.
  recommendation: Käytä nestepussia, joka on kiinnitetty Aquafarer SUP eturenkaisiin. Käytä UPF 50+ -aurinkosuojavaatetusta PFD-alusenasi. Käytä veden- ja hikoilunkestävää aurinkovoidetta.
  faq:
    - q: Kuinka paljon vettä minun pitäisi ottaa mukaan SUP-matkalle?
      a: Vähintään 1 litra tunnissa. 2 tunnin sessiota varten tuo 2 litraa. Kuumalla säällä enemmän. Hydraatiopussi toimii parhaiten.
    - q: Minkä tyyppinen aurinkovoide on paras SUP:lle?
      a: Vedenkestävä, SPF 50+ laajakirjoinen. Mineraaliset aurinkosuojat (sinkkioksidi, titaandioksidi) ovat riutaturvallisia ja kestävät pidempään.
    - q: Heijastaako vesi todella UV?
      a: Kyllä — vesi heijastaa jopa 40 % UV-säteilystä, mikä tarkoittaa, että saat UV ylhäältä ja alhaalta. Tämä lisää palamisen riskiä merkittävästi.
    - q: Voinko saada auringonpolttaman ihottumapuvun läpi?
      a: Tavalliset suojapuserot tarjoavat minimaalisen UV suojan (noin UPF 10-20). Etsi UPF 50+ luokiteltuja vaatteita täydellistä suojaa varten.
