  description: Täydellinen katsaus Aquafarer RIB 330 — 10'10" jäykkä ilmatäytteinen vene (RIB) alumiinipohjalla ja lasikuitu-perällä. Suorituskyky, käsiteltävyys ja soveltuvuus kalastukseen.
