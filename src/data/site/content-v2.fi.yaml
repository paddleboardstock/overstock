- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3 mm vs 5 mm märkäpuku: Mitä useimmat aloittelijat ymmärtävät väärin kylmässä vedessä'
  description: Lopeta jäätyminen kesken session tai ylikuumeneminen rannalla. Todellinen ero 3 mm ja 5 mm märkäpuvujen välillä — lämpötilakaavio, joustavuuden kompromissit ja mikä todella toimii kylmän veden surffauksessa.
  definition: Wetsuit on neopreenivaatte, joka vangitsee ohuen vesikerroksen ihon vasten, jonka kehon lämpö lämmittää eristeeksi. Paksuus (3 mm, 5 mm) määrää lämpötila-alueen, jonka puku voi kestää — paksumpi on lämpimämpi mutta vähemmän joustava.
  tldr: Kostuuspuvun paksuus määrää suoraan lämmön ja joustavuuden. Käytä 3 mm paksuista vettä, jonka lämpötila on yli 16 °C, ja 5 mm paksuista vettä, jonka lämpötila on 8–16 °C. Paksummat puvut rajoittavat liikkuvuutta, mutta pitävät sinut lämpimänä pidempään — aseta aina istuvuus merkkiarvon edelle.
  problem: Avaat verkkokaupan tai astut surf-liikkeeseen ja näet märkäpuvut, joiden merkinnät ovat 3/2, 4/3, 5/4 ja 5 mm täysasuja. Numerot eivät sano paljoa, ennen kuin ymmärrät, että väärä paksuus tarkoittaa joko jäätymistä kesken session tai liiallista kuumenemista ja hikoilua rannalla.
  explanation: märkäpuvut toimivat siten, että ne vangitsevat ohut vesikerroksen ihosi ja neopreenin väliin; kehosi lämmittää tämän veden, luoden eristyksen. Paksumpi neopreeni vangitsee enemmän vettä mutta rajoittaa joustavuutta ja kelluvuutta. 3 mm puku (usein 3/2, ohuemmilla hihoilla) sopii leutoihin olosuhteisiin, kun taas 5 mm (5/4/3 tai täysi 5 mm) sopii kylmään veteen. Rintataskulla varustetut vetoketjuaukot tiivistävät paremmin kuin selän vetoketju ja vähentävät huuhtoutumista. Saumojen rakenne — liimattu ja piilopistettu (GBS) — on ero vuotavan puvun ja lämpimän puvun välillä.
  solution: Sovita pukujen paksuus paikalliseen veden lämpötilaan 5°C virhemarginaalilla. Kohtuulliseen ilmastoon osta 3/2 mm. Kylmälle vedelle osta 5/4/3 mm. Lisää kengät, käsineet ja hupullinen puku laajentaaksesi käyttöaluetta vielä 5°C alaspäin. Kokeile pukuja ennen ostamista tai valitse merkki, jolla on antelias palautusoikeus.
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm on ihanteellinen useimmille kylmän veden surffaajille, tarjoten GBS-saumat ja lämpimän vuoren. Jos surffaat lämpimässä vedessä yli 20°C, 3/2mm rintavetoketjullinen malli on parempi valinta.
  faq:
    - q: Minkä veden lämpötila vaatii 5 mm paksuisen märkäpuvun?
      a: Veden lämpötilat välillä 8°C ja 14°C vaativat 5 mm puku. Alle 8°C tarvitset 6/5/4 mm hupullisen puvun. Välillä 14°C ja 18°C 4/3 mm puku sopii useimmille ihmisille.
    - q: Voinko käyttää 3 mm paksua märkäpukua talvella?
      a: Vain leudossa talvi-ilmastossa, jossa veden lämpötila pysyy yli 16 °C. Todelliseen talvivalaukseen tarvitaan 5 mm tai 5/4/3 mm. Saappaat, hanskat ja huppu lisäävät vastaavaa lämpöä ilman, että tarvitsee paksumpaa vartaloa.
    - q: Kuinka tiukka märkäpuku pitäisi olla?
      a: Tiukka mutta ei rajoittava. Ei saisi olla ilmakuplia tai löysää neopreenia. Jos pystyt liu'uttamaan sormesi ihosi ja puvun väliin alaselässä, se on liian löysä. Jos hengittäminen on vaikeaa tai liikkuminen on huomattavasti rajoittunutta, valitse isompi koko.
    - q: Pidättävätkö kalliit märkäpuvut sinut lämpimämpänä?
      a: Korkeampi hinta tarkoittaa usein parempaa neopreenia (kalkkikivipohjaista vs öljypohjaista), parempaa saumojen rakennetta (GBS vs pelkästään liimattu) ja parempaa joustavuutta. Nämä tekijät vaikuttavat suoraan lämpöön ja kestävyyteen, mutta vain jos istuvuus on oikea.
