  problem: Tarvitset kannettavan veneen, joka pakkautuu pieneen tilaan jahdin säilytystä tai auton kuljetusta varten. Lankkulattialaiset veneet vievät aikaa koota; rullattavat lattiat eivät ole jäykkiä.
