- slug: touring-sup-guide
  category: guide
  type: buying-guide
  title: 'Touring-SUP-opas: Valitse oikea lauta pitkän matkan melontaan'
  description: Touring-laudat SUPs ovat pidempiä, kapeampia ja suunniteltu nopeutta ja liukua varten. Kuinka valita touring-lauta, olennaiset varusteet pitkille melontamatkoille ja tekniikka tehokkaaseen matkan kulkemiseen.
  definition: Matkailu SUP on pitkä (12-14'), kapea (30-32') lauta, joka on suunniteltu tehokkaaseen melontaan pitkillä matkoilla. Ominaisuuksiin kuuluu veden läpi leikkaava keulapala, pidempi vesilinja liukumista varten ja usein kuminauhakuormajärjestelmä.
  tldr: "Touring SUPs suosii nopeutta ja ohjattavuutta vakauden sijaan. Tehokkuuden vuoksi vähintään 12' pituus, 30-32 tuuman leveys liu'un ja vakauden tasapainoon. Tärkeimmät ominaisuudet: siirtopää, suora muoto, useita perhossäädön vaihtoehtoja. Olennaiset varusteet: PFD, naru, vesi, puhelin ja bungee-järjestelmä varusteille. Tekniikka keskittyy pitkiin, sujuviin vetoihin vartalon kierron kanssa."
  problem: Melominen all-around-laudalla pitkällä matkalla jättää sinut uupuneeksi. Leveä keula tarttuu aaltoihin, lauta ei kulje suoraan, ja käytät enemmän energiaa ohjaamiseen kuin liukumiseen. Tarvitset pitkän matkan varten suunnitellun laudan.
  explanation: Touring SUPs käyttää työntöpotkurirunkoa (kärkiosa terävä) joka jakaa veden sen sijaan, että kulkisi sen päällä, vähentäen merkittävästi vastusta. Pidempi vesilinja lisää rungon nopeutta. Kapeampi leveys vähentää vastusta mutta vaatii parempaa tasapainoa. Touring-laudoissa on pidemmät evät suunnan vakauden takaamiseksi. Täytettävät touring-laudat tarvitsevat korkeampaa PSI (18-20) säilyttääkseen jäykkyyden ja estääkseen taivutuksen, joka tuhlaa energiaa.
  solution: 'Valitse vähintään 12 jalkaa pitkä touring-lauta, jossa on iskutilavuus nokka. Leveys: 30" kokeneille melojille, 31-32" keskitasolle. Etsi keskievälaatikko ja sivupurennat vakauden vuoksi. Täytä PSItäysimääräisesti. Varusta bungee-lastin kiinnitysPFD, pilli ja puhelin vedenpitävissä kotelossa.'
  recommendation: Aquafarer SUP Tour 12, joka on kooltaan 12' x 31" x 6", on ihanteellinen retkikäyttöön tarkoitettu ilmatäytteinen kajakki. Sen siirrettävä keula leikkaa tehokkaasti aallokkoa, ja kuminauhajärjestelmä pitää varusteet mukana päivän retkillä. Yhdistä Aquafarer-hiilivartiseen melaan tehokasta pitkän matkan melontaa varten.
  faq:
    - q: Voinko käyttää monipuolista lautaa retkeilyyn?
      a: Lyhyemmillä, alle 5 km:n retkillä, kyllä. Pidemmillä matkoilla leveämpi keula ja lyhyempi vesilinja väsyttävät sinut nopeammin.
    - q: Minkä pituinen touring SUP minun tarvitsee?
      a: 12' on vähimmäispituus kiertämisen tehokkuudelle. 12'6" on hyvä keskitasoinen pituus. 14' on kilpailemiseen ja edistyneeseen kiertämiseen.
    - q: Suoriutuvatko ilmatäytteiset touring-SUPs yhtä hyvin kuin kovat laudat?
      a: Nykyaikaiset drop-stitch-ilmatäytteiset laitteet korkeilla PSI suoriutuvat kalastusretkillä samoin kuin kovat laudat. Hieman joustava rakenne voi itse asiassa olla mukavampaa aalloissa.
    - q: Mikä mela on paras retkeilyyn?
      a: Kevyt hiili- tai lasikuituairon isommalla lavalla (100-110 neliötuumaa) voimaa varten. Säädettävä mela mahdollistaa vaihtamisen retkeilyn ja surffauksen välillä.
