  title: 'SUP Ankkuriohje: Pysy paikoillasi kalastaessa tai valokuvattaessa'
  description: Täydellinen opas SUP-ankkurointiin — ankkurityypit (sieni, taitettava, paalu), ankkurikärryn asennus, käyttöönotto tekniikat ja turvallisuusseikat paikan päällä pysymiseksi.
  definition: Ankku SUP on köyteen kiinnitetty paino, joka pitää laudan paikallaan tuulta ja virtaa vastaan. Yleisiä tyyppejä ovat sieniankkurit, taitettavat ankkurit ja kiilattavat tolpat.
  tldr: Käytä sieniankkuria (1,5-3 lb) mutaisille tai hiekkapohjille, taittuvaa ankkuria kivikkoisille pohjille, tai kiinnitystankoa matalassa vedessä pehmeille pohjille. Ankkurin tulisi olla 1,5-3 lb tyynille olosuhteille, 3-5 lb tuulelle ja virtaukselle. Käytä aina ankkurivaunua asennon säätämiseen ja tiedä, milloin vapauttaa.
  problem: Löydät täydellisen kalastuspaikan, mutta tuuli ja virta vievät sinut pois paikalta muutaman minuutin välein. Ilman ankkurointia SUP kalastus ja valokuvaus ovat turhauttavia harjoituksia jatkuvassa uudelleen sijoittumisessa.
  explanation: Ankkuri toimii vetämällä pohjan poikki, kunnes se tarttuu. Sieniankkurit uppoavat pehmeisiin pohjiin ja tarjoavat hyvän pidon hiekassa ja mudassa. Taitettavat ankkurit hannoja, jotka kaivautuvat koviin tai kivikkoisiin pohjiin. Tuenokat toimivat matalassa vedessä työntämällä suoraan pohjaan.
  solution: Asenna ankkurikärryjärjestelmä (linja, jossa liukurenkaan toinen puoli laudassa) säätääksesi ankkurin kiinnityspistettä. Kiinnitä 50–75 jalkaa köyttä ankkuriin. Laita ankkuri ylävirtaan tai halutun paikkasi vastavirtaan. Käytä pikakiinnitysjärjestelmää irrottautumiseen hätätilanteissa. Älä koskaan ankkuroi voimakkaassa virrassa tai paikkaan, josta et voi helposti nostaa ankkuria.
  recommendation: 3 paunan taittuvalla ankkurilla ja 50 jalan köydellä pärjää useimmissa SUP kalastusolosuhteissa. Lisää ankkurivetojärjestelmä käyttämällä D-renkaita Aquafarer SUP Explorer 11:ssäsi.
  faq:
    - q: Minkä kokoinen ankkuri tarvitsen SUP varten?
      a: 1,5–3 lb rauhallisille järville ja hitaasti virtaaville joille. 3–5 lb rannikkoalueille, joissa on tuulta tai virtausta. Liian suuret ankkurit on vaikea nostaa ylös.
    - q: Kuinka paljon ankkuriköyttä tarvitsen?
      a: 5:1-suhteen kelaus (5 jalkaa siimaa jokaista 1 jalan syvyyttä kohti) on standardi. 10 jalan vedessä käytä 50 jalkaa siimaa.
    - q: Onko ankkuroituminen SUP:lla vaarallista?
      a: Vain jos ankkuroit virtaukseen tai tuuleen, joka on tarpeeksi voimakas kaatamaan laudan. Käytä aina nopeasti irrotettavaa järjestelmää, joka voidaan irrottaa heti.
    - q: Voinko ankkuroitua mihin tahansa veteen?
      a: Tarkista paikalliset säädökset. Joillakin alueilla ankkurointi on rajoitettu meriheinän tai merielinympäristöjen suojelemiseksi. Älä koskaan ankkuroi koralliriutoille.
