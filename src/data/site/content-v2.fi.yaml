  type: buying-guide
  title: Paras vesiliikuntavaruste aloittelijoille (Sijoita fiksusti, älä katumus mielessä)
  description: 'Älä tuhlaa budjettiasi varusteisiin, joiden käyttöikäsi on lyhyt. Fiksun aloituspakkauksen erittely: lauta, märkäpuku, mela, turvavarusteet — mihin kannattaa panostaa, mistä voi säästää ja mikä todella kestää.'
  definition: Aloittelijan vesilajivarusteet alkavat ilmatäytteisellä laudalla (SUP tai surffi), 3/2 mm märkäpuvulla, leashillä ja pumpulla. Perusvarusteiden tulisi olla keskitasoista laatua; turvallisuusvarusteiden ei pitäisi koskaan olla halpoja.
  tldr: Aloita ilmatäytettävällä SUP tai surffilaudalla, 3/2 mm:n täysmärkäpuvulla (tai kevätpuvulla lämpimissä vesissä), hihnalla, pumpulla ja pelastusliivillä, jos et ole varma uimari. Osta laatua ydintuotteisiin (lauta, märkäpuku) ja säästä lisävarusteissa. Vältä erittäin halpaa, merkitöntä varustetta, joka hajoaa yhden kauden aikana.
  problem: Haluat aloittaa surffauksen, SUP tai kajakin, mutta tarvittavien varusteiden lista on pitkä ja kallis. Et halua maksaa liikaa varusteista, joista saatat kasvaa ulos, mutta halvat varusteet pilaa kokemuksen ja voivat olla vaarallisia.
  explanation: 'Vesiliikuntavarusteet jaetaan kolmeen tasoon: perusvarusteet (lauta, märkäpuku, mela), turvallisuustarvikkeet (leash, pelastusliivi, pumppu) ja lisävarusteet (laukku, korjaussarja, vaihtoviitta). Aloittelijoiden tulisi panostaa suureen ilmatäytteiseen lautaan, koska se toimii sekä surffilaudana että SUP alustana, on helppo ottaa matkalle mukaan ja sillä on korkea jälleenmyyntiarvo. Märkäpukujen tulisi olla keskiluokkaa ja GBS-saumoin — halvat puvut vuotavat vettä ja irtoavat kerroksistaan muutamassa kuukaudessa. Halvat melat katkeavat; halvat pumput epäonnistuvat puolivälissä täyttöä. Turvallisuustarvikkeista ei saa tinkiä.'
  solution: 'Budjettijaottelu aloittelijalle: $400-700 ilmatäytteisestä laudasta pumpun ja laukun kanssa, $200-350 3/2 mm märkäpuvusta, $50-100 melasta, $30-50 hihnasta, $40-70 pelastusliivistä. Yhteensä noin $800-1200 täydestä varustuksesta. Osta ensin lauta ja märkäpuku, lisää varusteita kun varmistat, että pidät lajista.'
  recommendation: Aquafarer SUP Explorer 11 kattaa SUP ja surffauksen oppimisen alle $600, mukaan lukien pumppu ja laukku. Yhdistä se Aquafarer Wetsuit Pro -puvun ja kaksoisontelopumpun kanssa saadaksesi täydellisen aloituspaketin, joka kestää vuosia. Lisää pelastusliivi, jos aiot SUP avovedessä.
  faq:
    - q: Voinko käyttää surffilautaa SUP varten?
      a: Ei mukavasti. Laudat on suunniteltu soutamista varten maaten ja niissä on vähemmän tilavuutta ja vakautta. Ilmatäytteistä SUP-lautaa voidaan käyttää SUP ja aloittelijasurffaukseen, mikä tekee siitä paremman ensimmäisen lauta-investoinnin.
    - q: Minkä märkäpuvun aloittelijan pitäisi ostaa?
      a: 3/2 mm täysmärkäpuku rintavetoketjulla ja GBS-saumoilla. Se sopii kevään, syksyn ja leudon talven olosuhteisiin. Vältä selkävetoketjulla varustettuja pukuja — ne päästävät enemmän vettä ja niiden riisuminen on vaikeampaa.
    - q: Tarvitseeko minun pelastusliiviä SUP varten?
      a: Se on erittäin suositeltavaa, erityisesti avovedessä, tuulisissa olosuhteissa tai jos et ole vahva uimari. Monilla paikoilla lain mukaan pelastusliivi vaaditaan SUPs voimassa olevassa uimatontin etäisyydellä rannasta.
    - q: Kuinka paljon minun tulisi käyttää aloittelijan melaan?
      a: Ensimmäisen vuoden ajaksi riittää $50-100 alumiini- tai lasikuitumelat. Hiilikuitumelat ovat kevyempiä, mutta maksavat $150-300 ja ne on parasta ostaa, kun tiedät mieltymäsi pituuden ja jäykkyyden.
