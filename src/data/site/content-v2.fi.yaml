- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: 3 mm vs 5 mm märkäpuku (Mikä todellisuudessa toimii kylmässä vedessä surffauksessa)
  description: 3 mm:n ja 5 mm:n märkäpuvun valinta riippuu veden lämpötilasta, ei ilman lämpötilasta. Lämpötilataulukko, joustavuusvertailu ja mikä paksuus pitää sinut lämpimänä rajoittamatta melontaa.
  definition: 3 mm:n märkäpuku sopii veteen, jonka lämpötila on 14-20 °C, ja se tarjoaa hyvän joustavuuden. 5 mm:n puku soveltuu 8-14 °C:n vesiin, maksimaalisen lämmön tarjoamiseen, mutta liikkumisvapaus on rajoitetumpaa. Valinta on suora kompromissi lämmön ja liikealueen välillä.
  tldr: 3 mm:n märkäpuvut ovat tarkoitettu 14-20 °C veden lämpötiloihin ja tarjoavat maksimaalisen joustavuuden. 5 mm:n puvut ovat tarkoitettu 8-14 °C ja painottavat lämpöä. Valitse paikallisen veden lämpötilan mukaan, älä ilman lämpötilan mukaan. Jos surffaat eri vuodenaikoina, kannattaa omistaa molemmat. Jos voit ostaa vain yhden, 4/3 mm:n puku tarjoaa parhaan keskitien.
  problem: Tarvitset märkäpuvun, mutta et voi päättää 3 mm:n ja 5 mm:n välillä. 3 mm ei ehkä ole tarpeeksi lämmin talvella, ja 5 mm voi olla liian paksu ja rajoittava lämpimämpinä päivinä. Väärin arvaaminen tarkoittaa joko palelua talven läpi tai hikoilua syksyn aikana.
  explanation: 'Neopreenin paksuus korreloi suoraan lämmön kanssa ja kääntäen joustavuuden kanssa. 3 mm puku (usein 3/2 mm ohuemmilla hihoilla) tarjoaa hyvän liikkumavapauden melomiseen ja surfaamiseen leudoissa olosuhteissa. 5 mm puku käyttää paksumpaa neopreenia vartalossa ja usein ohuempia paneeleja käsissä ja jaloissa (5/4/3 mm) ylläpitääkseen jonkin verran joustavuutta. Lämmön ero on noin 6–8 °C. Tärkeimmät erot: 5 mm puvut käyttävät enemmän neopreenimateriaalia, painavat noin 40 prosenttia enemmän, kuivuvat hitaammin ja pukeminen sekä riisuminen vaativat enemmän vaivaa. Nykyaikaiset super-joustavat neopreenit kaventavat joustavuuseroa, mutta 5 mm rajoittaa silti liikkumista merkittävästi.'
  solution: Määritä kylmin kuukausittainen keskimääräinen vesilämpötilasi paikallisten poiju-tietojen avulla. Jos se on yli 16 °C, osta 3/2 mm. Jos se on välillä 12–16 °C, osta 4/3 mm. Jos se on alle 12 °C, osta 5/4/3 mm. Koko vuoden surfaamiseen yhdellä puvulla, laadukas 4/3 mm termovuorilla sekä erillinen huppu, saappaat ja hanskat kattavat laajimman lämpötila-alueen.
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm kestää 8-16°C lämpötiloja lämmittävästä vuorauksesta johtuen, joka korvaa aidon 5mm puutteen. Jos surffailet pääasiassa leudommissa olosuhteissa (16-20°C), 3/2mm Aquafarer Wetsuit Pro tarjoaa paremman joustavuuden ja mukavuuden.
  faq:
    - q: Voinko käyttää 3 mm paksua vedessä, joka on 10°C?
      a: Vain hyvin lyhyisiin sessioihin (20-30 minuuttia) ja lämpimän suojapuvun kanssa alla. Olet kylmissäsi suurimman osan sessiosta. 5 mm tai 5/4/3 mm suositellaan vahvasti 10°C veteen.
    - q: Onko 5 mm märkäpuku liian lämmin kesäksi?
      a: Jos kesäveden lämpötila ylittää 18 °C, 5 mm puku aiheuttaa ylikuumenemista. Voit huuhdella puvun viileällä vedellä, mutta olet mukavampaa 3/2 mm tai kevätpuvussa kesäkuukausina.
    - q: Rajoittaako 5 mm märkäpuku melomista?
      a: Kyllä, huomattavasti. Paksumpi neopreeni olkapäissä vaatii enemmän voimaa jokaista melauslyöntiä kohti. 5/4/3 mm puku ohuemmilla hihoilla auttaa, mutta väsyminen tulee silti nopeammin kuin 3 mm puvussa.
    - q: Mikä on paras märkäpuku ympäri vuoden surffaamiseen?
      a: 4/3 mm kokopuku rintavetoketjulla ja lämpövuorella kattaa 12–18°C, mikä on ympäri vuoden monissa lauhkeissa ilmastoissa. Lisää saappaat talveksi, ja voit surffata 10–18°C yhdellä puvulla.
