  title: Surffilaudan kokotaulukko (tilavuus on se, mikä oikeasti merkitsee)
  description: Lopeta surffilaudan kokojen arvaaminen. Tilavuus litroina ratkaisee kaiken — kuinka helposti saat aaltoja kiinni, kuinka vakaa olo sinulla on ja kuinka nopeasti edistyt. Löydä tavoitelitrat 2 minuutissa.
  definition: Surffilaudan koko liittyy ensisijaisesti tilavuuteen (litroina), ei pituuteen. Tilavuus määrittää kelluvuuden ja aaltokyvyn. Pidemmät laudat melaavat nopeammin; leveämmät laudat ovat vakaampia; paksummat laudat tarjoavat enemmän tilavuutta ilman lisättyä pituutta.
  tldr: 'Surffilaudan koko liittyy enemmän tilavuuteen kuin pelkkään pituuteen. Aloittelijat tarvitsevat 60-80 litraa, keskitasoiset 35-55 litraa ja edistyneet surffaajat 20-35 litraa. Käytä painoasi ensisijaisena tekijänä: jokaista 10 kg kohti tarvitaan noin 10-12 litraa tilavuutta aloittelijatasolla.'
  problem: Seistessäsi surflautahyllyn edessä, jossa raiteissa on numeroita kuten 7'2" x 22" x 3", sinulla ei ole aavistustakaan siitä, miltä nuo mitat tuntuvat vedessä. Ulkonäön tai ystävän lautavalintojen perusteella ostaminen johtaa lautaan, joka on joko liian epävakaa tai liian vaikea soutaa.
  explanation: 'Surffilaudan koko ymmärretään parhaiten kolmen ulottuvuuden kautta: pituus (melausteho ja aaltokiito), leveys (vakavuus) ja paksuus (tilavuus ja kelluvuus). Todellinen merkityksellinen luku on tilavuus litroina. Vaahdosta tehdyt laudat ja ilmatäytteiset laudat saavuttavat suuren tilavuuden leveyden ja paksuuden kautta, eivät liiallisen pituuden vuoksi, mikä tekee niistä hallittavia aloittelijoille. Kehityksesi myötä tilavuutta vähennetään, jotta lauta uppoaa syvemmälle aalton päälle ja kääntyy herkemmin.'
  solution: 'Käytä tilavuus-paino-laskuria: aloittelijoille jaa painosi kiloina 1,5:llä saadaksesi tavoitelitrat. Keskitasoisille jaa 2:lla. Keskitasoiset tulisi etsiä lautoja, joissa on keskiverto rocker ja squash- tai pyöreä perä monipuolisuutta varten.'
  recommendation: Aquafarer Surfboard Pro tarjoaa 75 litraa tilavuutta 10'6" paketissa — ihanteellinen aloittelijoille, joiden paino on enintään 90 kg. Keveämmät ajajat voivat valita pienemmän SUP Tour 12 -laudan saadakseen paremmin käsiteltävän tunteen edetessään.
  faq:
    - q: Onko pituudella merkitystä surffilaudan koon kannalta?
      a: Korkeus on vähemmän tärkeä kuin paino. Pitkä ja kevyt surffaaja tarvitsee vähemmän tilavuutta kuin lyhyt ja painava surffaaja, jolla on sama korkeus. Käytä painoa ensisijaisena mittarina ja säädä kunnon ja melausvoiman mukaan.
    - q: Mitä tapahtuu, jos laudallani on liikaa volyymia?
      a: Liian suuri tilavuus saa laudan tuntumaan korkkisen ja epävakaan aallon pinnalla. Sinulla on vaikeuksia upottaa laidan reuna käännöksissä ja saatat pomppia vedestä pohjakäännösten aikana.
    - q: Mitä tapahtuu, jos laudallani on liian vähän tilavuutta?
      a: Sinulla on vaikeuksia meloa aaltoihin, menet liian syvälle lähtötilanteessa ja tunnet olosi epävakaaksi istuessasi laudalla odottamassa. Aloittelijat tarvitsevat lähes aina enemmän tilavuutta kuin he luulevat.
    - q: Mistä tiedän, milloin minun pitäisi valita pienempi koko?
      a: Kun pystyt johdonmukaisesti tarttumaan aaltoihin, nousemaan sujuvasti ylös ja tekemään peruskäännöksiä nykyisellä laudallasi, on aika pudottaa 5–10 litraa. Liian varhainen koon pienentäminen hidastaa edistystäsi.
