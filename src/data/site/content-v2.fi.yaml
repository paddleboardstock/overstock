  title: 'Ilmatäytteisen SUP huolto: Pidä lautasi kestävänä vuosia'
  description: Oikea täytettävän SUP huolto pidentää laudan käyttöikää merkittävästi. Pesu, kuivaus, venttiilin hoito, UV suojaus ja kausivarastointivinkit drop-stitch melalautoihin.
  definition: Ilmatäytteisen SUP huolto sisältää käytön jälkeisen puhdistuksen, asianmukaisen kuivaamisen, venttiilin tarkastuksen, UV suojauksen ja oikean varastoinnin delaminaation, homeen, materiaalin heikkenemisen ja ilmavuotojen estämiseksi.
  tldr: Huuhtele lautasi makealla vedellä jokaisen suolaisen veden session jälkeen. Kuivaa täysin ennen tyhjentämistä ja säilytystä. Tarkista venttiili roskien varalta ja voitele O-renkaan vuosittain. Säilytä puhallettuna (puolilleen PSI) viileässä, pimeässä paikassa. Vältä pitkäaikaista UV-altistusta, joka heikentää PVC. Paikkaa pienet reiät välittömästi mukana tulevalla korjaussarjalla.
  problem: Yhden kauden jälkeen täytettäväsi SUP alkaa vuotaa hitaasti, kannen tyyny irtoaa reunoilta ja PVC tuntuu jäykemmältä. Perushuollon laiminlyönti aiheuttaa ennenaikaista vanhenemista, joka on täysin ehkäistävissä.
  explanation: PVC heikkenee UV-säteilylle altistuttaessa. Meriveden suolakiteet pääsevät saumoihin ja venttiileihin, aiheuttaen mikrovuohtumia. Sisälle jäänyt kosteus edistää homeen kasvua, joka hyökkää drop-stitch-kierteitä vastaan. Venttiilin O-renkaat kuivahtavat ja menettävät tiivistyksensä. Lika ja hiekka hioutuvat kantta kiinnittävään liimaan, aiheuttaen reunojen nousemista.
  solution: 'Jokaisen session jälkeen: huuhtele lauta, evät ja pumppu makealla vedellä. Pyyhi kantta. Avaa venttiili tyhjentääksesi jääneen veden. Kuivaa lauta varjossa ennen tyhjentämistä. Kuukausittain: tarkista venttiili ja levitä silikonipohjaista voidetta O-renkaaseen. Kausittain: pese miedolla saippualla ja vedellä, tarkista reiät.'
  recommendation: Noudata laudan mukana tullutta Aquafarer-hoito-ohjetta. Käytä korjaussarjaa välittömästi reiän sattuessa. Säilytä lautaa sen laukussa lämpötilasäädellyssä paikassa poissa suorasta auringonvalosta.
  faq:
    - q: Voinko jättää ilmatäytteisen SUP täytetyksi koko kaudeksi?
      a: Kyllä, mutta säilytä poissa suorasta auringonvalosta ja puoliteholla PSI (8-10 PSI) vähentääksesi saumoihin kohdistuvaa rasitusta. Täyteen inflatoi juuri ennen käyttöä.
    - q: Kuinka puhdistan homeen SUP:stani?
      a: Sekoita mietoa saippuaa lämpimään veteen ja hankaa pehmeällä harjalla. Sitkeän homeen kohdalla käytä laimennettua valkoviinietikkaratkaisua (1:4). Vältä valkaisuaineita.
    - q: Tarvitseeko minun voidella venttiiliä?
      a: Kyllä, vuosittain. Poista venttiilin sydän, levitä silikoniöljyä O-renkaaseen ja asenna takaisin. Tämä estää ilmavuodot.
    - q: Miten säilytän SUP talven yli?
      a: Puhdista ja kuivaa perusteellisesti. Tyhjennä kokonaan, rullaa löyhästi (vältä tiukkoja taitoksia) ja säilytä viileässä, pimeässä ja kuivassa paikassa. Vältä jäätymislämpötiloja.
