  description: Perusteellinen arviointi Aquafarer SUP Tour 12 — 12' ilmatäytteinen retkilaudaksi suunniteltu lauta, joka on tarkoitettu nopeuteen, suuntavakauteen ja pitkän matkan melontaan.
  definition: The Aquafarer SUP Tour 12 on 12' x 31" x 6" täytettävä retkeily SUP, jossa on syrjitetty keula, 280 litran tilavuus ja kolmen kerroksen PVC.
  tldr: 'The SUP Tour 12 on Aquafarer:n omistama retkeilylauta. Se on 12'' pitkä ja 31" leveä, ja siinä on nosteen kärki, joten se leikkaa vettä tehokkaasti. Tärkeimmät tiedot: 280 l tilavuus, 18 PSI maksimi, kuminauhakuljetusjärjestelmä, useita eväasetuksia. Hinta noin $699. Paras kuntoilulautailijoille ja etäisyyksien ystäville, jotka kulkevat 5–20 km per sessio.'
  problem: Kuljet pitkän matkan SUP:llasi, ja all-around-lautasi leveä nokka aiheuttaa vastusta eikä kulje suoraan.
  explanation: Työntömuotoinen keula halkaisee veden sen sijaan, että se kulkisi sen päällä, vähentäen keulavyöhykkeen vastusta. Pidempi 12' vesilinja lisää rungon nopeutta. 31" leveänä se tasapainottaa tehokkuuden ja vakauden. Retkeilyyn suunnitellut ominaisuudet sisältävät useita vinssikoteloita ja bungee-rahdin kannen.
  solution: Pumppaa 18 PSI. Käytä keskievää tyynellä vedellä tai lisää sivuhampaita sivutuulivakauteen. Työntymäkuono ja 12 jalan pituus loistavat avoimella vedellä aaltojen kanssa.
  recommendation: Kohdassa $699, SUP Tour 12 on paras hinta-laatusuhteen puhallettava touring-lauta. Osta se, jos kuljet säännöllisesti matkaa. Yhdistä Aquafarer hiilikuitumelomaan saadaksesi tehokkaimman kokoonpanon.
  faq:
    - q: Onko SUP Tour 12 tarpeeksi vakaa keskitasoisille?
      a: Kyllä — 31" leveys on standardi touring-laudoille. Aloittelijat voivat pitää 31" kapeampaa verrattuna 33–34" monipuolisiin lautoihin hoipertavana.
    - q: Miten Tour 12 käsittelee aaltoilua?
      a: Hyvin — siirtonokka leikkaa pienen ja keskisuuren aaltoliikkeen läpi ilman liukumähkän koputusta.
    - q: Voinko käyttää Tour 12:ta surffaukseen?
      a: Ei suositeltavaa — 12 jalan pituus ja kärkiosa tekevät siitä hitaan kääntymään. Käytä SUP Explorer 11 aaltoratsastukseen.
    - q: Mikä mela pituus toimii parhaiten?
      a: 8-10 tuumaa pään yläpuolella. Pidempi mela tarjoaa vipuvoimaa pidemmälle melontamatkalle.
