  title: Mitä pukea surffaukseen (Älä ilmesty laudshortseissa, kun tarvitset 5/4)
  description: Lopeta arvailu siitä, mitä pukea päälle. Veden lämpötila, ei ilman lämpötila, määrää surffivaatteesi. Täydellinen kerrosohje tropiikin rashguardeista täyteen talvi 5/4/3 mm varusteluun.
  definition: Surfausvaatteet vaihtelevat lämpimässä vedessä käytettävistä shortseista ja rash gardeista kylmässä vedessä käytettäviin täysiin 5/4/3mm märkäpuvun, saappaiden ja hupun kanssa. Tarpeesi määrittää veden lämpötila, ei ilman lämpötila.
  tldr: Mitä pukeutua surffatessa riippuu täysin veden lämpötilasta — ei ilman lämpötilasta. Rashguardit ja surffishortsit sopivat yli 22°C, kevyt märkäpuvut 18-22°C, täyden 3/2 mm märkäpuvun 14-18°C ja 5/4/3 mm märkäpuvun kengillä tarvitaan alle 14°C. Käytä aina UV-suojaa ja harkitse hihnaa ja iskuvaljaita.
  problem: Saavut rannalle etkä tiedä, riittääkö rash guard vai tarvitsetko täysipitkän märkäpuvun. Ilman lämpötila on lämmin, mutta vesi on kylmää, tai vesi tuntuu ok:ilta mutta tuuli on jäätävää. Väärin pukeutuminen tarkoittaa pilattua sessiota.
  explanation: 'Surfvaatteet palvelevat kolmea tarkoitusta: lämmöneristystä, UV-suojaa ja hankaumien ehkäisyä. Neopreeniset märkäpuvut arvioidaan paksuuden ja peittävyyden mukaan — kevätpuvut (lyhyet hihat tai lahkeet) ovat rajapäiville, kokopuvut kylmään veteen. Rash guardit suojaavat laudan hankaumilta ja auringolta, mutta eivät tarjoa lämmönarvoa. Saappaat, hanskat ja huput eivät ole asusteita vaan välttämätöntä varustusta alle 12°C kylmässä vedessä surffaamiseen.'
  solution: 'Tarkista paikallinen poiju tai reaaliaikainen veden lämpötilaraportti ennen lähtöä. Kokoa varusteet kylmimmän tyypillisen olosuhteen mukaan: rashguard ja shortsit kesälle, 3/2 mm kokopuku kevääksi ja syksyksi, 5/4/3 mm puku saappaiden ja hupun kanssa talveksi. Lisää aina laiska ja harkitse kelluntaliivin käyttöä turvallisuuden vuoksi.'
  recommendation: Sijoita ensin hyvään 3/2 mm:n täyshaalariin — se kattaa laajimman valikoiman olosuhteita. Lisää 5/4/3 mm:n haalari ja saappaat, jos suunnittelet surffaavasi talvella. Aquafarer Wetsuit Pro lämpövuorella yhdistää molemmat lämpötila-alueet tehokkaasti.
  faq:
    - q: Voinko surffata pelkissä lauta-shortseissa?
      a: Kyllä, trooppisessa vedessä yli 24°C. Saatat haluta suojapaidan estääksesi rinnan ja käsivarsien hankaamisen melonnasta. Vahan tai voimansidontapadun käyttäminen laudalla auttaa kompensoimaan puuttuvan puvun pidon.
    - q: Tarvitsenko surffitossuja?
      a: Jos veden lämpötila laskee alle 14 °C:n, saappaat estävät tunnottomuutta ja suojaavat jalkojasi kiviltä ja riutan haavoilta. Ne lisäävät myös pitoa laudassa. Suurin osa pohjoisen ilmaston surffareista käyttää saappaita marraskuusta maaliskuuhun.
    - q: Mikä on kevätpuku?
      a: Kevättakki on lyhythihainen tai -lahkeinen märkäpuku (tai molemmat), joka on suunniteltu veteen, jonka lämpötila on 18°C–22°C. Se tarjoaa enemmän lämpöä kuin hihaton paita, mutta vähemmän peittävyyttä kuin täysipitkä puku.
    - q: Pitäisikö minun käyttää pelastusliiviä surffatessani?
      a: Ei perinteisiä pelastusliivejä, mutta iskuliivi tai kelluntapete voi auttaa ankarissa olosuhteissa tai jos olet heikko uimari. Aquafarer pelastusliivejä on suunniteltu SUP ja kajakointia varten, mutta ne voivat tarjota lisäkelluntavarmuutta surffauksen aloittelijoille.
