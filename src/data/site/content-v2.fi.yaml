  title: 'Merielämäliivien opas: Valitse oikea PFD vesitoimintaasi varten'
  description: Täydellinen pelastusliivien osto-opas SUP:lle, melontaan, RIB-veneilyyn ja purjehdukseen. PFD-tyypit (vaahto vs täytettävä), istuvuusohjeet, lailliset vaatimukset ja ominaisuudet jokaiselle toiminnalle.
  definition: Pelastusliivi tai henkilökohtainen kelluntalaite (PFD) on turvallisuusväline, joka on suunniteltu pitämään henkilö veden pinnalla. Tyypit vaihtelevat tyypistä I (avomerelle) tyypiin V (erityiskäyttöön).
  tldr: 'Valitse PFD toiminnan mukaan: ilmatäytteinen vyölaukku SUP varten, vaahtoliivi melontaan, Type III vaahto RIB ja moottoriveneet varten. Tärkeimmät ominaisuudet: USCG tai ISO hyväksyntä, heijastavat paneelit, pelastushuilu, D-rengas kiinnitystä varten, kirkkaat värit.'
  problem: Näet riveittäin pelastusliivejä, joiden koko vaihtelee $20:sta $300:een, etkä ole varma, mikä sopii toimintaasi tai täyttää lakisääteiset vaatimukset.
  explanation: 'Pelastusliivit on luokiteltu tyypin mukaan: Tyyppi I (merenkäynti, kääntää tajuttoman käyttäjän kasvot ylöspäin), Tyyppi II (lähellä rannikkoa), Tyyppi III (kelluntatuki, yleisin), Tyyppi IV (heitettävä), Tyyppi V (erityiskäyttö). Ilmatäytteiset liivit käyttävät CO2-kapseleita — vähemmän tilaa vieviä mutta vaativat huoltoa. Vaahdosta tehdyt liivit eivät vaadi huoltoa mutta ovat tilavampia.'
  solution: 'Valitse SUP: täytettävä vyöpakki tai liivi (33 lb noste). Melontaan: Tyypin III vaahto, jossa korkeat käsiaukot. RIB: Tyypin III vaahto tai täytettävä, 22+ lb noste, heijasteteippi ja pelastusvihelin.'
  recommendation: Aquafarer Life Vest Pro (ilmatäytteinen, 15 kg) on ihanteellinen SUP ja kajakkimelontaan. Aquafarer Life Vest Classic (vaahtomuovi, Tyyppi III) on täydellinen RIB veneilyyn ja yleiseen merikäyttöön.
  faq:
    - q: Tarvitseeko minun pelastusliiviä SUP varten?
      a: Kyllä — monissa oikeudenkäyttöalueissa lakisääteinen ja aina suositeltava. Käytä ilmatäytteistä vyöpakettia tai liiviä melontalajeissa.
    - q: Ovatko ilmatäytteiset pelastusliivit turvallisia?
      a: Kyllä, oikeanlaisella huollolla. Tarkista CO2-kasetti vuosittain, vaihda lankarulla 2–3 vuoden välein.
    - q: Mikä pelastusliivi on paras lapselle?
      a: A USCG-hyväksytty Type II tai III vaahtoliivillä oleva liivi, jossa kaulus, haararemmi ja kirkkaat värit. Älä koskaan käytä lasten puhallettavia liivejä.
    - q: Miten pelastusliivin pitäisi istua?
      a: Tiukka — liivin ei tulisi nousta korvien yläpuolelle kun sitä nostetaan hartioista. Kaikki vetoketjut ja soljet kiinni.
