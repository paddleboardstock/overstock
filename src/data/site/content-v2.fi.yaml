  title: 'Tuuliolosuhteet kohteelle SUP: Kuinka tuuli vaikuttaa melontaan'
  description: Kuinka tuulen nopeus ja suunta vaikuttavat SUP melontaan. Ymmärtäminen avotuulen ja rannikon tuulen eroista, tuuliennusteiden lukeminen, melontatekniikat tuuleen ja milloin kannattaa pysyä rannalla.
  definition: Tuuliolosuhteet määrittävät SUP turvallisuuden. Merenpuoleinen tuuli (maasta merelle) työntää sinua poispäin. Mannenpuoleinen tuuli (mereltä maalle) työntää sinua kohti rantaa. Sivutuuli aiheuttaa laudan kääntymisen.
  tldr: 'Maksimi turvallinen tuuli aloittelijoille: 10 solmua. Keskitaso: 15 solmua. Edistynyt: 20 solmua. Avotuuli on vaarallisin. Melo ensin vastatuuleen. Sivutuulessa melo hieman kohdetta vastaanpäin. Polvistu kovassa tuulessa vähentääksesi profiiliasi.'
  problem: Meloit ulos tyynissä olosuhteissa, mutta 30 minuutin kuluttua tuuli on voimistunut ja sinun on vaikea palata takaisin. Tuuli on aliarvioituin SUP turvallisuustekijä.
  explanation: Tuuli vaikuttaa SUP:aan enemmän kuin mihinkään muuhun melontalaitteeseen, koska seisot, luoden purjeen kaltaisen vaikutuksen. 10 solmun tuuli luo paljon enemmän vastusta seisovalle melojalle kuin istuvalle kajakkimelojalle. Avomerituuli työntää sinut pois turvallisuudesta. Sivutuuli aiheuttaa keulan kääntymisen.
  solution: 'Tarkista tuulen nopeus ja suunta ennen melomista. Käytä Beaufortin asteikkoa: Voima 3 (7-10 solmua) aloittelijoille, Voima 4 (11-16) keskitasolle. Melo ensin myötätuuleen. Jos tulet kiinni avotuojaan, melomaan 45 asteen kulmassa tuuleen. Polvistu kovassa tuulessa.'
  recommendation: Käytä tuuliennustesovellusta (Windy, Windfinder) ennen jokaista harjoitusta. Aquafarer SUP Tour 12 kulkee tuulessa paremmin kuin leveämmät laudat. Tuulisissa olosuhteissa käytä lyhyempiä melan vetoja ja korkeampaa tahtia.
  faq:
    - q: Mikä tuulen suunta on turvallisin SUP:lle?
      a: Maanpuoleinen tuuli (puhaltaen kohti maata) on turvallisin — se työntää sinut takaisin. Merelle puhaltava tuuli on vaarallisin.
    - q: Kuinka soudan sivutuulessa?
      a: Meloo enemmän tuulipuolella harhautuman ehkäisemiseksi. Kuljeta lautaa tuulenpuolelle määränpääsi nähden. Syvempi keskijalka auttaa.
    - q: Voinko meloa 20 solmun tuulessa?
      a: Vain, jos kokemus on suojatuilla vesillä. Aloittelijoiden ei pitäisi meloa yli 10 solmun nopeudella.
    - q: Miten tuulenpuuskat vaikuttavat SUP?
      a: Puhurit aiheuttavat äkillisiä tasapainohaasteita. Tuulisissa olosuhteissa laske asentoasi ja ole valmis äkillisiin muutoksiin.
