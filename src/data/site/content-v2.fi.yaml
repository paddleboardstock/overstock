- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Märkäpuvun hoito: Tee neopreenistäsi 2 kertaa kestävämpi'
  description: Oikea märkäpuvun hoito pidentää sen käyttöikää yhdestä kaudesta kolmeen+. Neopreenimärkäpukujen huuhtelu, kuivaus, säilytys ja korjausvinkit. Vältä yleisiä virheitä, jotka tuhoavat märkäpuvut ennenaikaisesti.
  definition: märkäpukujen hoitoon kuuluu huuhtelu makealla vedellä jokaisen käytön jälkeen, kuivaaminen poissa suorasta auringonvalosta, tasaisena säilyttäminen tai leveälle henkareille ripustettuna sekä säännöllinen puhdistus suolan, bakteerien ja hajujen poistamiseksi.
  tldr: Huuhtele märkäpuku sisältä ja ulkoa raikkaalla vedellä heti jokaisen session jälkeen. Kuivaa sisäpuoli ulospäin varjossa leveällä muovihangalla. Säilytä tasaisena tai taiteltuna viileässä ja kuivassa paikassa. Älä koskaan jätä märkäpukuja suoraan auringonvaloon, kuumiin autoihin tai kuivausrumpuun. Käytä märkäpukushampoota 5-10 session välein.
  problem: Yhden kauden jälkeen märkäpukusi haisee, neopreeni on menettänyt elastisuutensa, saumat irtoavat ja vetoketju jämähtää — kaikki tämä on estettävissä asianmukaisella huollolla.
  explanation: Suolakiteet tarttuvat neopreeniin ja kuluttavat materiaalia. Bakteerit lisääntyvät kosteissa sisätiloissa, tuottavat hajuja ja hajottavat neopreeniä. UV hajottaa nailonipinnoitteen. Yli 50 °C:n lämpö aiheuttaa kerrosten irtoamista. Väärin tapahtuva kuivaus vääristää neopreeniä ja rasittaa saumoja.
  solution: 'Jokaisen käytön jälkeen: huuhtele huolellisesti sisältä ja ulkoa, käännä nurinpäin, ripusta leveälle muovihenkareille varjoon. Kun kuivunut, käännä oikeinpäin ja säilytä litteänä. Joka 5-10 käyttökerran jälkeen: pese märkäpuvushampoolla. Kuukausittain: voitele vetoketju vetoketjuvahalla.'
  recommendation: Käytä Aquafarer märkäpukushampoota puhdistukseen ja Aquafarer vetoketjavahaa vetoketjun huoltoon. Säilytä Aquafarer leveällä hengarilla verkkopussissa.
  faq:
    - q: Voinko laittaa märkäpuvun pesukoneeseen?
      a: Ei suositella — konepesu vahingoittaa neopreenia. Jos se on pakollista, käytä hellävaraista ohjelmaa, kylmää vettä ja verkkopussia.
    - q: Miten saan hajun pois märkäpuvustani?
      a: Liota viileässä vedessä märkäpukushampoolla tai valkoviinietikalla 30 minuuttia. Huuhtele huolellisesti.
    - q: Kuinka minun pitäisi kuivata märkäpukuni?
      a: Nurinkurisesti varjossa leveällä, pehmustetulla muovitelineellä. Vältä suoraa auringonvaloa ja metallisia henkareita.
    - q: Voinko korjata repaleisen wetsuitin?
      a: Pieniä alle 1 tuuman repeämiä voidaan korjata neopreenisementillä ja paikalla. Suuremmat repeämät saattavat vaatia ammattilaisen korjausta.
