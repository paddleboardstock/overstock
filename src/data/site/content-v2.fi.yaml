- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Surffaustavan säännöt (Kuinka olla se henkilö, jota kaikki välttelevät)
  description: Ajojärjestyksellä on sääntöjä, eikä kukaan kirjoita niitä ylös. Opettele väistämissäännöt, miksi liukuminen saa sinut huudettavaksi, kuinka pyytää anteeksi ja aloittelijan virheet, jotka ärsyttävät jokaista paikallista surffaajaa.
  definition: 'Surffietiketti on kirjoittamaton käyttäytymissääntö, joka estää törmäyksiä ja jakaa aallot oikeudenmukaisesti. Ydinperiaate: surffaajalla, joka on lähimpänä rikkoutuvan aallon huippua, on etuajo-oikeus.'
  tldr: Surffaaja, joka on lähimpänä murtuvan aallon huippua, on etuoikeutettu. Älä aja toisesta ohi, älä kierrä toisen surffaajan aaltosi ottamiseksi, ja pyydä aina anteeksi, jos teet virheen. Melot kaukaa linjan ympäri, pidä laudastasi kiinni ja ole ystävällinen — kunnioitus ansaitsee kunnioitusta.
  problem: Meloit kohti täyttä jonoa ja tunnet heti jännitteen. Surffarit katsovat sinua vinosti, joku huutaa sinulle, etkä ole varma, mitä teit väärin. Surffauksen sosiaalinen puoli tuntuu pelottavammalta kuin itse aallot.
  explanation: "Surffaajan etiketti on olemassa estämään törmäyksiä ja jakamaan aallot reilusti. Perussääntö on etuajo-oikeus: surffaajalla, joka on lähimpänä aallon harjaa (kohtaa, jossa aalto ensimmäisenä murtuu), on etuoikeus. Kuka tahansa, joka melan avulla yrittää päästä samalle aaltolle kauempaa sisäpuolelta, on vetäydyttävä. 'Snaking' — melominen toisen surffaajan ohi etuuden varastamiseksi — katsotaan pahimmaksi rikkomukseksi. Etuuden lisäksi rivi odottaa hiljaisuutta (huutaminen minimissä), laudan hallintaa (älä koskaan päästä lautaasi lähelle muita) ja ystävällisyyttä (yksinkertainen nyökkäys riittää pitkälle)."
  solution: Katso ruuhkaa 10 minuuttia ennen kuin lähdet aalloille. Tunnista, kuka nappaa eniten aaltoja — he ovat surffaajat, joita tulee kunnioittaa ja välttää. Pysy sisäpuolella (valkoisen veden alueella), jos olet oppimassa. Melo leveästi ruuhkan ympäri, älä sen läpi. Kun saat aaltoa, katso molempiin suuntiin ennen ponnistamista ylös ja varmista, ettei kukaan ole syvemmällä.
  recommendation: Vietä ensimmäiset muutamat sessiosi aloittelijaystävällisellä aallolla, jossa väenpaljous on harvempaa. Opettele lukemaan etuoikeusjärjestystä ennen kuin yrität suositussa jonossa. Jos kuitenkin hyppäät jonkun aalloille, pyydä heti anteeksi ja souta ohitse – useimmat surffaajat kunnioittavat rehellistä virhettä.
  faq:
    - q: Mitä kuuluu?
      a: Päälle ajaminen tarkoittaa aalloille melaamista ja niiden surffaamista, joista toinen surffaaja jo omistaa etuoikeuden. Se on vaarallista ja epäkunnioittavaa. Surffaaja, joka on lähimpänä aallon huippua, omistaa aallon; muiden täytyy väistyä.
    - q: Mitä on sneakailu?
      a: Snaking tarkoittaa sen toisen surffarin ohittamista, joka on jo aallon tavoitteluasennossa, jotta päätyisit lähemmäs aallon huippua. Sitä pidetään erittäin huonona käytöksenä ja se voi johtaa riitaan.
    - q: Voivatko aloittelijat surffata ruuhkaisilla aalloilla?
      a: Kyllä, mutta pysy valkoisen veden alueella poissa huipulta. Älä meloo päänousuerän alueelle ennen kuin pystyt johdonmukaisesti tarttumaan aaltoihin ja hallitsemaan suuntaasi. Ruuhkaiset jonot vaativat kokemusta turvalliseen liikkumiseen.
    - q: Kuinka pyydän anteeksi vedessä?
      a: Yksinkertainen vilkutus, hymy ja 'mun moka' tai 'anteeksi' toimii. Tunnusta virheesi ja liu'u pois henkilöltä. Surffarit yleensä antavat anteeksi rehelliset virheet, varsinkin jos selvästi olet oppimassa.
    - q: Mitä minun pitäisi tehdä, jos joku ilmestyy käymään luonani yllättäen?
      a: Jos se on selvä drop-in, huuda "wave" tai "hei" varoittaaksesi heitä. Jos he tarttuvat siihen vahingossa ja pyytävät anteeksi, anna asian olla. Jos joku toistuvasti tekee drop-inin, meloo paikalle ja selitä kohteliaasti vuoro-oikeus. Vältä konflikteja.
