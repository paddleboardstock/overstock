  title: 'Sääsuunnittelu vesilajeihin: Lue ennuste kuin ammattilainen'
  description: Kuinka lukea merisäätiedotuksia SUP varten, surffaukseen ja veneilyyn. Etujen, painearojen, tuulikuvioiden ja säähälytyksien ymmärtäminen turvallisten sessioiden suunnittelemiseksi.
  definition: Sään suunnittelu tarkoittaa meriennusteiden tulkitsemista — tuulen nopeus ja suunta, aaltojen korkeus ja jakso, sademäärä, näkyvyys ja voimakkaiden sääilmiöiden varoitukset.
  tldr: 'Tarkista kolme ennustetta ennen jokaista sessiota: tuuli, aaltoliike ja sää. Parhaat olosuhteet: kevyt maatuuli, kohtalainen aaltoliike, korkea tai nouseva ilmanpaine. Vältä: ukkosmyrskyt, voimakas maatuuli, sumu ja nopeasti laskeva ilmanpaine.'
  problem: Ajetko rannikolle kolmen päivän ennusteen perusteella, joka lupasi hyvät olosuhteet, vain huomaatkin 25 solmun tuulen ja sateen. Merisäätä on vaikea ennustaa.
  explanation: Korkea paine tuo vakaata säätä ja heikkoja tuulia. Matala paine tuo tuulta ja myrskyjä. Paine-ero määrää tuulen nopeuden. Kylmät rintamat tuovat äkillisiä tuulen muutoksia. Paikalliset ilmiöt, kuten merituulet, voivat syrjäyttää yleisen ennusteen.
  solution: 'Käytä useita lähteitä: Windy.com, NOAA, paikalliset surffikamerat. Tarkista 24 tuntia etukäteen ja tarkista uudelleen aamulla. Etsi ennusteiden johdonmukaisuutta eri malleissa. Opi paikalliset mikroilmastot.'
  recommendation: Lisää Windy.com kirjanmerkkeihin paikallisia paikkoja varten. Pidä puhelinta vedenpitävässä kotelossa. Veneillessä ota mukaan VHF-radio säätiedotuksia varten. Epävarmana pysy rannalla.
  faq:
    - q: Mitä säätä minun pitäisi välttää SUP varten?
      a: Ukkosmyrskyt (salamat), sumu (nolla näkyvyys), avoimen meren tuuli yli 10 solmua, tuulet yli 20 solmua, laskeva paine.
    - q: Kuinka tarkkoja meriennusteet ovat?
      a: Kolmen päivän ennusteet ovat noin 80 % tarkkoja. Päivää aiemmat ennusteet ovat 90 % tarkkoja tuulelle.
    - q: Mikä on hyvä barometrinen suuntaus vesilajeille?
      a: Nouseva tai tasainen paine osoittaa olojen paranevan. Laskeva paine (1+ mb/tunti) osoittaa myrskyn lähestyvän.
    - q: Voinko SUP sumussa?
      a: Ei suositella. Jos joudut sumuun, käytä kompassia tai GPS:ää, puhalla pilliä joka 30. sekunti ja pysy lähellä rantaa.
