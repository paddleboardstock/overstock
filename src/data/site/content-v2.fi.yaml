- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Ilmatäytteisen veneen huolto: Säilytä sijoituksesi arvo'
  description: Vuosittainen kumiveneen huoltolista. Puhdistus, UV suojaus, saumojen tarkistus, paineen hallinta, moottorin huolto ja talvisäilytys PVC ja Hypalon veneille.
  definition: Ilmatäytteisen veneen ylläpito koostuu puhdistuksesta, UV-suojauksesta, paineen hallinnasta, saumojen ja venttiilien tarkastuksesta, homeen ehkäisystä ja asianmukaisesta sesongin ulkopuolisesta säilytyksestä.
  tldr: Huuhtele joka käytön jälkeen suolavedessä. Levitä UV suoja-ainetta joka 2–3 kuukausi. Tarkista täyttöpaine ennen jokaista lähtöä. Tarkista saumat, venttiilit ja peräpeili kuukausittain. Puhdista miedolla saippualla. Säilytä tyhjänä viileässä ja kuivassa paikassa kauden ulkopuolella.
  problem: Käytit ilmatäytteistä venettäsi kauden ajan, ja nyt putket näyttävät haalistuneilta, sauma vuotaa ja perälauta tuntuu sientä olevan — kaikki nämä olisi voitu estää säännöllisellä huollolla.
  explanation: UV-säteily hajottaa polymeerimatriisin. Suolavesi kiteytyy taitteissa ja kuluttaa kangasta. Home kasvaa loukkuun jääneessä kosteudessa. Väärä paine aiheuttaa materiaalin väsymistä. Perälauta (erityisesti vaneri) imee vettä ruuvinreikien kautta.
  solution: 'Jokaisen käytön jälkeen: huuhtele puhtaalla vedellä, kuivaa, tarkista paine. Kuukausittain: pyyhi putket UV-suojalla, tarkista saumat, tarkista venttiili. Vuosittain: puhdista perusteellisesti, tarkista peräpeili lahovaurioiden varalta, voitele venttiilit, testaa mikrotihkut.'
  recommendation: Käytä 303 Aerospace Protectant -aineetta Aquafarer-veneputkiin. Poista venttiilit ja levitä silikonirasvaa vuosittain. Säilytä kantolaukussa desikanttipussin kanssa.
  faq:
    - q: Voinko käyttää valkaisuainetta täytettävän veneeni puhdistamiseen?
      a: Ei — valkaisuaine vahingoittaa kankaan pinnoitetta. Käytä mietoa saippuaa ja lämmintä vettä. Homeen poistamiseen käytä laimennettua valkoviinietikkaa.
    - q: Kuinka usein minun pitäisi käsitellä UV-suojalla?
      a: Joka 2–3 kuukausi käyttökauden aikana. Useammin trooppisissa ilmastoissa.
    - q: Täytyykö minun tyhjentää veneeni väliaikoina?
      a: Ei, jos käytetään viikoittain. Jätä täytettynä UV-päällyksen kanssa. Kuukausien välein tyhjennä ja säilytä.
    - q: Kuinka ylläpidän peräpeiliä?
      a: Tarkista pultit kuukausittain. Tiivistä paljaat puunpinnat merilakalla vuosittain. Vaihda, jos ilmenee pehmeitä kohtia.
