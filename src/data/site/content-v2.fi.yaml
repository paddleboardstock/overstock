  title: 'SUP-laudan kokotaulukko: tilavuus, pituus ja leveys jokaiselle ratsastajalle'
  description: Täydellinen laudansuosituskoko painon ja aktiviteetin mukaan. Sisältää helppokäyttöisen kokotaulukon all-around-, touring-, surffaus- ja jooga-laudoille SUP.
  definition: Melontalautakoon päättää tilavuus (painokapasiteetti ja kelluvuus), pituus (nopeus ja suuntavakaus), leveys (vakavuus) ja paksuus (tilavuuden jakautuminen ja tuulen vastustus).
  tldr: 'Käytä painoa löytääksesi vähimmäistilavuuden: 50-70 kg tarvitsee 220-260L, 70-90 kg tarvitsee 260-300L, 90-110 kg tarvitsee 300-350L, yli 110 kg tarvitsee 350L. Aloittelijoille lisää näihin lukuihin 20 %. Leveys on tärkeää: 32" on keskitasoa, 33-34" sopii aloittelijoille, 35" on erittäin vakaa.'
  problem: Lautailulautojen kokoluettelot käyttävät jalan, tuuman ja litran mittayksiköitä sekaisin, mikä tekee brändien vertailusta vaikeaa.
  explanation: Tilavuus on suorin mittari painokapasiteetille — 1 litra makeaa vettä syrjäyttää 1 kg painoa. Lautta, jonka tilavuus on 260 litraa, voi teoreettisesti tukea 260 kg, mutta käytännön kapasiteetti on pienempi, koska laudan tulee olla vedenpinnan yläpuolella. Kokonaispainosi (keho plus varusteet) tulisi olla 30-40 % laudan tilavuudesta.
  solution: Tavoitevolyymi = (kehon paino kilogrammoina + varusteen paino kilogrammoina) x 3. Esimerkiksi 75 kg:n melojalle, jonka varusteet painavat 5 kg, tavoite = 80 x 3 = vähintään 240 L. Aloittelijoille kerroin on 3,5. Kokeneemmille kerroin on 2,5.
  recommendation: Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") sopii useimmille 50-100 kg painaville kuljettajille. Kevyemmät kuljettajat voivat valita koon AirDeck 270. Raskaammat kuljettajat voivat harkita SUP Tour 12 (300L+) tai leveämpiä lautoja.
  faq:
    - q: Onko pituudella merkitystä SUP-koon valinnassa?
      a: Pituus merkitsee vähemmän kuin paino. Pitkä ja kevyt ratsastaja tarvitsee vähemmän tilavuutta kuin lyhyt ja painava ratsastaja. Käytä painoa ensisijaisena tilavuuden määrääjänä.
    - q: Mitä tapahtuu liiallisella äänenvoimakkuudella?
      a: Lauta istuu liian korkealla, tarttuen tuuleen kuin purje. Se tuntuu joustavalta chopissa. Kuitenkin aloittelijoille ylimääräinen tilavuus on parempi kuin liian vähän.
    - q: Mitä tapahtuu, jos volyymi on liian pieni?
      a: Lauta istuu liian syvällä, mikä aiheuttaa vastusta. Nokka saattaa vajota veden alle melonnan aikana (pearling). Väsyy nopeasti melatessa osittain veden alla olevalla laudalla.
    - q: Tarvitsevatko ilmatäytteiset laudat erilaisia kokoja kuin kovalaudat?
      a: Ei merkittävästi. Ilmatäytteiset 15+ PSI syrjäyttävät vettä samalla tavalla kuin kovat laudat. Tilavuussuositukset pätevät yhtä lailla molempiin tyyppeihin.
