- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Koko-opas: Pituus, Leveys ja Tilavuus Selitetty'
  description: Löydä oikea SUP-koko painosi, taitotasosi ja melontatyylisi perusteella. Pituus määrää suuntaavuuden, leveys määrää vakauden ja tilavuus määrää painokapasiteetin.
  definition: SUP koko määritellään pituuden (nopeus ja liuku), leveyden (ensisijainen vakaus), paksuuden (toissijainen vakaus ja tilavuus) ja litroissa mitatun tilavuuden (kokonaispainokapasiteetti) mukaan.
  tldr: 'Kaikkialla SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Retkeily: 12''-14'' x 30"-32" (280-350L). Surffaus: 8''-10'' x 30"-32" (140-220L). Aloittelijat tarvitsevat yli 32" leveyttä ja tilavuuden, joka ylittää kehon painon 60-80L:llä. Painosi kilogrammoina plus 60L on vähimmäistilavuustavoite vakaudelle.'
  problem: Jokainen SUP-brändi listaa laudat jaloissa, tuumissa ja litroissa, mutta jos et tiedä, miten nämä mittaukset kääntyvät todellisen maailman tunteeksi, riskinäsi on ostaa lauta, joka on horjahteleva, hidas tai ei pysty kantamaan painoasi.
  explanation: 'Pituus määrää, kuinka nopeasti lautaa melotaan ja kuinka hyvin se kulkee suorassa linjassa. Pidemmät laudat (12''+) liukuvat melontojen välillä ja pitävät linjan. Lyhyemmät laudat (alle 10'') kääntyvät helposti mutta vaativat melonnan vaihtamista useammin. Leveys määrää ensisijaisen vakauden — seisomavakauden. 30" lauta tuntuu aloittelijoista horjuvalta; 34" tuntuu laiturilta. Paksuus määrää tilavuuden — paksumpi lauta kelluu korkeammalla mutta ottaa enemmän tuulta. Litroissa mitattu tilavuus on paras yksittäinen mittari: kuormattu lauta (sinä plus varusteet) tulisi upota 2-4 tuumaa levossa.'
  solution: 'Sovita laudan mitat kolmeen tekijään: painoosi (määrittää vähimmäistilavuuden), pääasialliseen aktiviteettiisi (määrittää pituuden) ja taitotasoosi (määrittää leveyden). Aloittelijoille kerro paino kiloissa 2,2:lla saadaksesi vähimmäislitrat. Keskitasoisille kerro 1,8:lla. Kokeneille kerro 1,4:llä.'
  recommendation: Aquafarer SUP Explorer 11, jonka mitat ovat 11' x 33" x 6" ja vetoisuus 260L, sopii useimmille jopa 100 kg painaville melojille monipuoliseen melontaan. Päivitä SUP Tour 12:een, jonka mitat ovat 12' x 31", paremman retkivauhdin ja liukuvuuden saavuttamiseksi.
  faq:
    - q: Minkä SUP koon tarvitsen painoni mukaan?
      a: 'Alle 70 kg painaville ratsastajille: 10-11'' x 32" (220-260L). 70-90 kg: 11-12'' x 33" (260-300L). 90-110 kg: 11-12'' x 34" (300-350L). Yli 110 kg: 12'' x 34-36" (350L+).'
    - q: Onko pidempi SUP nopeampi?
      a: Kyllä. Pidemmillä laudoilla on parempi pituus-leveys-suhde, mikä vähentää vastusta. 14 jalan touring-SUP on merkittävästi nopeampi kuin 11 jalan monikäyttölauta samalla melontaponnistuksella.
    - q: Mikä SUP leveys on vakaa aloittelijoille?
      a: 33–34 tuumaa on optimaalinen aloittelijoille, joiden paino on enintään 90 kg. Alle 32 tuumaa vaatii hyvää tasapainoa. Yli 34 tuumaa on hyvin vakaa, mutta hitaampi ja vaikeampi soudettavaksi tuulessa.
    - q: Voinko käyttää monipuolista lautaa retkeilyyn?
      a: Kyllä, lyhyille retkille alle 10 km. Pidemmillä matkoilla erillinen touring-lauta seuraa paremmin ja kattaa matkaa tehokkaammin.
