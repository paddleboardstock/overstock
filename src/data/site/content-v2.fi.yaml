- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Kylmän veden surffivarusteopas (Surffaa talven läpi ilman kärsimystä)
  description: 'Älä anna kylmän veden päättää kauttasi. Täydellinen kylmän veden varusteiden erittely: märkäpuvun paksuus, saappaiden ja hanskojen valinta, hupun istuvuus sekä lisävarusteet, jotka tekevät talvikauden harjoituksista todella nautittavia.'
  definition: Kylmävesisurffaus vaatii täyspitkän märkäpuvun (5/4/3 mm tai paksumman), saappaat, hanskat ja hupun. Alle 12 °C:ssa kaikki kosketuspisteet kylmän veden kanssa tarvitsevat suojaa tunnottomuuden, hypotermian ja turvallisuusriskien estämiseksi.
  tldr: Kylmällä vedellä surffaaminen vaatii täyden 5/4/3 mm tai 6/5/4 mm huppupuvun, 5 mm saappaat, 3 mm hanskat ja hupun. Saumojen laatu on tärkeämpää kuin merkki — etsi liimattuja ja piilosaumattuja (GBS) saumoja. Lämpövuorattu puku lisää merkittävästi lämpöä ilman lisäpaksuutta. Ota aina mukaan varalämpökerroksia ja termos jälkiharjoittelun palautumista varten.
  problem: Haluat surffata talvella, mutta kylmä vesi tunnuttaa jalkasi 15 minuutin jälkeen, kätesi eivät pysty puristamaan lautaa, ja pukusi päästää jäätävää vettä alas selkääsi aina kun meloit. Ilman oikeita varusteita kylmän veden sessiot ovat lyhyitä ja kurjia.
  explanation: 'Kylmävesisurffaus (alle 12°C) vaatii enemmän kuin pelkän paksun märkäpuvun. Jokaista kosketuspintaa kylmään täytyy suojata: saappaat estävät jalkojen puutumista ja suojaavat riutaleikkauksilta, käsineet ylläpitävät käsien toimintaa soutamista varten, ja huppu estää pahimman lämmönhukan (pää säteilee 30 prosenttia kehon lämmöstä). Märkäpuvun paksuus tulisi valita kylmimmän kuukauden mukaan, ei keskiarvon. Puvun lisäksi lisävarusteet, kuten tiiviillä pohjalla varustetut saappaat ja etukäteen kaartuvilla sormilla olevat käsineet, parantavat mukavuutta ja kestävyyttä.'
  solution: 'Rakenna kylmän veden varustus tässä järjestyksessä: 5/4/3 mm tai 6/5/4 mm täyspuvun GBS-saumoilla ja rintavetoketjulla, 5 mm kengät kumipohjilla, 3 mm käsineet (lapaset ovat lämpimämpiä kuin sormikkaat) ja 3 mm huppu, joka voidaan laittaa puvun kauluksen alle. Lisää vaihtorobe arvokkuuden ja lämmön vuoksi parkkipaikalle.'
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm integroidulla lämpövuorella selviytyy useimmista kylmän veden olosuhteista jopa 8°C:een asti. Yhdistä se 5mm Aquafarer saappaisiin ja 3mm hanskoihin täydellisen kylmän veden varustuksen saamiseksi. Alle 8°C:n lämpötiloissa siirry 6/5/4mm huppupukuun.
  faq:
    - q: Tarvitsenko todella hupun?
      a: Kyllä. Menetät 30 prosenttia kehosi lämmöstä pään kautta. Huppu estää lämmön karkaamisen ja pitää kaulan lämpimänä. 3 mm:n huppu lisää enemmän lämpöä kuin siirtyminen 5 mm:stä 6 mm:n vartalon paksuuteen.
    - q: Minkä paksuiset saappaat tarvitsen?
      a: Vesille 8-12°C käytä 5 mm saappaita. 12-16°C riittävät 3 mm saappaat. Alle 8°C harkitse 7 mm saappaita tai lisää neopreenisukat 5 mm saappaiden alle.
    - q: Kuinka estän märkäpuvun huuhtoutumisen?
      a: Huuhteleminen tapahtuu, kun vettä pääsee puvun kauluksesta, ranteista tai nilkoista. Rintalukolla varustettu pukumalli vähentää selkään pääsevää huuhtelua merkittävästi. Kauluksen ja nilkkojen tarratiivisteet auttavat myös, mutta paras ratkaisu on hyvin istuva puku, jossa on GBS-saumat.
    - q: Voinko käyttää 3 mm pukuja kylmässä vedessä lisäkerrosten kanssa?
      a: 3 mm puku, jonka alla on neopreeniliivi, voi kasvattaa kantamaa noin 3–4 °C, mutta se ei korvaa kunnollista 5/4/3 mm tai 5 mm pukua. Kerrospukeutuminen toimii parhaiten lyhyillä sessioilla rajallisissa olosuhteissa.
