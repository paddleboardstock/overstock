  definition: Aquafarer SUP Explorer 11 on 11' x 33" x 6" kokoinen täytettävä seisomalauta, jonka tilavuus on 260 litraa, siinä on kolmikerroksinen sotilastason PVC ja enimmäispainearvo 18 PSI.
  tldr: 'SUP Explorer 11 on Aquafarer:n lippulaiva monipuolisessa iSUP. Pituudeltaan 11'' ja leveydeltään 33", se tasapainottaa vakautta ja suorituskykyä 50–100 kg:n painoisille käyttäjille. Tärkeimmät tekniset tiedot: 260 L tilavuus, 18 PSI maksimissaan, kolmikerroksinen PVC, timanttikuvioinen EVA kansialusta. Hinta noin $599. Paras harrastepaddlaukseen, kuntoiluun, joogaan ja aloittelijasurffaukseen.'
  problem: Haluat yhden SUP, joka tekee kaikkea — tyynenveden melonta, kevyt retkeily, jooga ja aloittelijasurffaus — ilman että tarvitset useita lauttoja.
  explanation: SUP Explorer 11 käyttää kolmen kerroksen sotilasluokan PVC materiaalia, jossa on tiheä drop-stitch jäykkyyttä varten 18 PSI. Liukuva runko tarjoaa hyvän suorituskyvyn kaikissa olosuhteissa. Kokopitkä EVA kansialusta tarjoaa pidon. Kuusi D-renkaita tarjoavat kiinnityspisteitä. Yhdysvaltalainen eväkotelo hyväksyy standardi-evät. Kokonaispaino on 11,5 kg.
  solution: Pumppaa 15-18 PSI paineeseen, kiinnitä mukana tuleva keskiraajja, ja sinulla on monipuolinen lauta. 33 tuuman leveys tarjoaa erinomaisen vakauden. Käytä bungee-järjestelmää varusteille. Reppu tekee kuljetuksesta ja säilytyksestä helppoa.
  recommendation: At $599, the SUP Explorer 11 on paras kaikilta osin arvoltaan kaikkein monipuolisin ilmatäytteinen SUP luokassaan. Osta se yhdelle laudalle, joka tekee kaiken. Yhdistä Aquafarer Wetsuit Pro- ja Life Vest Pro -varusteiden kanssa.
  faq:
    - q: Onko SUP Explorer 11 sopiva aloittelijoille?
      a: Kyllä — 33 tuuman leveys ja 260 litran tilavuus tarjoavat erinomaista vakautta. Aloittelijat tuntevat olonsa varmaksi seisten ja melottaessa.
    - q: Voinko selata SUP Explorer 11:llä?
      a: Kyllä, aloittelija- ja keskitaso-oloissa. 11 jalan pituus vaatii leveämpiä, hitaampia aaltoja.
    - q: Kuinka paljon painoa SUP Explorer 11 voi tukea?
      a: Kuskin maksimipaino on noin 100 kg optimaalisen suorituskyvyn saavuttamiseksi. Kokonaiskapasiteetti on noin 120 kg.
    - q: Mitä laatikko sisältää?
      a: Lauta, kaksikammioinen pumppu, kolmen osan säädettävä mela, pyörällinen reppu, kierretty hihna, irrotettava keskiperä, ja korjaussarja.
