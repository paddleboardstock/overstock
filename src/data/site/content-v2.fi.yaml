- slug: cold-water-safety-guide
  category: guide
  type: safety
  title: 'Kylmän veden turvallisuus: Melonta ja surffaaminen kylmissä olosuhteissa'
  description: Kylmän veden turvallisuus SUP:lle, surffaukselle ja kajakoinnille. Hypotermian tunnistaminen, sopiva varustus, kylmän veden sokkivaste ja hätätoimenpiteet kylmässä vedessä upotessa.
  definition: Kylmän veden turvallisuus sisältää kylmän shokin reaktion, uimataidon pettämisen, hypotermian sekä varusteet ja tekniikat näiden seurauksien ehkäisemiseksi.
  tldr: Vesi, jonka lämpötila on alle 15 °C, vaatii märkäpuvun. Alle 10 °C vaatii saappaat, käsineet ja hupun. Kylmäshokki aiheuttaa tahatonta haukkomista. Uimisen epäonnistuminen tapahtuu 3–5 minuutin sisällä vedessä, jonka lämpötila on alle 10 °C. Hypotermian oireita ovat tärinä, sekavuus ja koordinaation menetys.
  problem: Menevät melomaan aurinkoisena päivänä tietämättä, että veden lämpötila on 8 °C. Kaatuvat veteen, haukkuvat henkeä tahattomasti ja tuntevat raajojen menevän tunnottomiksi muutamassa minuutissa. Kylmä vesi tappaa nopeammin kuin mikään muu merivaara.
  explanation: 'Kylmäaltistus vedessä etenee neljässä vaiheessa: kylmähyökkäys (0-2 min) — hengenahdistus, liikahengitys. Uimiskyvyttömyys (3-15 min) — lihakset kylmenevät, koordinaatio pettää. hypotermia (15-45 min) — ydinlämpötila laskee alle 35 °C aiheuttaen sekavuutta ja sydämenpysähdyksen. Pelastuksen jälkeinen romahdus — kylmä veri palaa ytimeen.'
  solution: 'Tarkista veden lämpötila. Käytä lämpötilaan sopivaa märkäpukua. Älä koskaan melonut yksin vedessä, jonka lämpötila on alle 15 °C. Pidä mukana pilli ja puhelin. Jos putoat veteen: hallitse hengitystäsi, pala nopeasti laudalle. Jos on liian kylmä, lähetä hälytysmerkeillä apua.'
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm on vähimmäisvaatimus veden lämpötilassa 8–14 °C. Lisää Aquafarer 5 mm saappaat ja 3 mm käsineet. Käytä Life Vest Prota lisälämpösuojana.
  faq:
    - q: Kuinka kauan voin selviytyä 10 °C veden alla?
      a: Kylmäshokki kestää 1–2 minuuttia. Ilman kellunta- ja lämpösuojia selviytymisaika on 30–60 minuuttia.
    - q: Mitkä ovat hypotermian ensimmäiset merkit?
      a: Hallitsematon tärinä, sekavuus, huono koordinaatio, puheen kömpelyys. Lopeta toiminta ja lämmitä heti.
    - q: Kuinka lämmitän itseni kylmän veden jälkeen?
      a: Ota pois märät varusteet, kuivaa itsesi, pukeudu lämpimiin kerroksiin, mukaan lukien hattu ja hanskat. Juo lämpimiä alkoholittomia juomia.
    - q: Voinko saada hypotermian kesällä?
      a: Kyllä — alle 15 °C vettä esiintyy monilla paikoilla jopa kesällä. Vesi johtaa lämpöä 25 kertaa nopeammin kuin ilma.
