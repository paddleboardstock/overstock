  title: 'Ilmatäytteinen SUP Säilytys: Oikea tapa säilyttää iSUP'
  description: Oikea SUP ilmatäytteinen säilytys estää laminaatin irtoamisen, UV vauriot, homeen ja venttiilivuodot. Talvisäilytys, pitkäaikainen säilytys ja päivittäiset säilytysvinkit drop-stitch-laudoille.
  definition: Ilmatäytteinen SUP säilytys tarkoittaa, että lautaa säilytetään puhtaassa, kuivassa, lämpötilasäädellyssä ympäristössä, poissa UV:sta, äärilämpötiloista ja fyysisiltä vaurioilta.
  tldr: Säilytä viileässä, pimeässä paikassa alle 30°C, poissa suorasta auringonvalosta. Lyhytaikaista (1-2 viikkoa) säilytystä varten säilytä osittain täytettynä 8-10 PSI. Pitkäaikaista säilytystä varten tyhjennä kokonaan, rullaa löyhästi ja laita säilytyspussiin. Älä koskaan säilytä märkänä. Pidä poissa jyrsijöistä ja terävistä esineistä.
  problem: Tyhjennät SUP ja sullot sen kuumaan autotalliin tai kosteaan kellariin. Kolme kuukautta myöhemmin PVC on kellastunut, kansilevy kuoriutuu ja venttiili vuotaa. Väärä säilytys aiheuttaa enemmän vahinkoa kuin säännöllinen käyttö.
  explanation: Yli 50 °C:n lämpö aiheuttaa PVC-pehmitteiden siirtymistä, mikä tekee materiaalista jäykän ja hauraan. UV-säteily hajottaa polymeerien sidoksia. Sisälle jäänyt kosteus aiheuttaa homehtumista. Pakkasen alapuolella oleva kylmyys tekee PVC:stä hauraan. Kireästä taittamisesta aiheutuvat painaumapisteet luovat pysyviä taitteita.
  solution: 'Lyhytaikainen säilytys: huuhtele, kuivaa, täytä 10 PSI asti ja säilytä maanpinnan yläpuolella varjossa. Pitkäaikainen säilytys: puhdista huolellisesti, kuivaa täysin, tyhjennä kokonaan, rullaa kannen pehmuste ulospäin, laita pussiin, säilytä viileässä kuivassa kaapissa. Pidä poissa kemikaaleista ja tuholaisista.'
  recommendation: Käytä Aquafarer-kantolaukkua säilytykseen — se estää UV ja ehkäisee naarmuuntumista. Säilytä ilmastoidussa huoneessa. Lisää kantolaukun sisälle kosteudenimuri kosteisiin ympäristöihin.
  faq:
    - q: Voinko säilyttää SUP täytettynä autotallissa?
      a: Ainoastaan, jos autotalli pysyy alle 30 °C:ssa eikä siellä ole suoraa auringonvaloa. Useimmat autotallit ylittävät 40 °C:n kesällä.
    - q: Pitäisikö minun säilyttää SUP laukussa?
      a: Kyllä, laukku suojaa pölyltä, UV:lta ja fyysisiltä vaurioilta. Varmista, että levy on täysin kuiva ennen pakkaamista.
    - q: Voiko pakkasen aiheuttaa vaurioita täytettävälle SUP?
      a: Kyllä. Nollan alapuolella PVC kovettuu ja voi haljeta, kun sitä rullataan auki tai täytetään. Säilytä aina yli 5 °C lämpötilassa.
    - q: Kuinka minun pitäisi rullata SUP säilytystä varten?
      a: Kääri niin, että tasapohjalevy osoittaa ulospäin suojaten pohjan PVC. Vältä tiukkoja taitoksia. Vaihtele taitoskohtaa joka kerta.
