- slug: ocean-safety-and-responsibility
  category: authority
  type: brand
  title: Meren turvallisuus ja vastuu (enempää kuin pelkkää varustusta)
  description: Aquafarer:n sitoutuminen pitämään sinut turvassa ja suojelemaan yhteistä valtamerta. Turvallisuuskortit jokaisessa laatikossa, ilmainen opetusmateriaali, kestävä muotoilu ja vuosittaiset luonnonsuojelulahjoitukset.
  definition: Meren turvallisuus ja vastuullisuus tarkoittaa ympäristön ymmärtämistä, jossa melot, merielämän kunnioittamista, ekologisen jalanjäljen minimoimista ja välineiden käyttöä, jotka on suunniteltu kestämään ja korjattaviksi.
  tldr: Aquafarer edistää meren turvallisuutta varusteiden suunnittelun (kirkkaita värejä, valjaita, pelastusliivejä) ja opetusmateriaalin avulla. Uskomme, että jokaisella vesiurheilun harrastajalla on vastuu ymmärtää meren ympäristöä, kunnioittaa merielämää ja minimoida ekologinen jalanjälkensä. Varusteemme on suunniteltu kestämään, jotta vähemmän päätyisi kaatopaikoille.
  problem: Monet vesilajien tuotemerkit myyvät varusteita, mutta eivät opeta asiakkaitaan käyttämään niitä turvallisesti tai vastuullisesti. Uudet melontaa ja surffausta harrastavat ihmiset menevät veteen ymmärtämättä vaarallisia virtauksia, merieläimiä tai varusteidensa ympäristövaikutuksia.
  explanation: Meren turvallisuus on enemmän kuin tarkistuslista — se on ajattelutapa. Jokaisen Aquafarer tuotteen mukana tulee nopean aloituksen turvakortti. Verkkosivustomme ja oppaamme (meren turvallisuuden perusteet, surffauksen turvallisuusvinkit) tarjoavat ilmaista, yksityiskohtaista turvallisuuskoulutusta. Ympäristön kannalta suurin vaikutus, jonka mikä tahansa varusteyritys voi tehdä, tulee tuotteen käyttöiästä. Laudan, joka kestää 5 vuotta 2 vuoden sijaan, valmistuksen hiilijalanjälki puolittuu. Suunnittelemme myös korjattavuus mielessä — vaihtoventtiilit, evälaatikot ja märkäpukujen korjaussarjat pitävät varusteet käytössä sen sijaan, että ne päätyisivät kaatopaikalle.
  solution: Aquafarer sisältää talutushihnan ja korjaussarjan jokaisessa laudankaupassa. Julkaisemme ilmaista turvallisuussisältöä, joka käsittelee virtausten tunnistamista, sään lukemista ja välineiden tarkastuksia. Asiakastukitiimimme antaa kunto- ja olosuhdeneuvontaa, kun lähetät meille sähköpostia tietystä paikasta. Käytämme minimaalista muovipakkausta ja kompensoimme kuljetusten hiilidioksidipäästöt.
  recommendation: Aloita meren turvallisuuden perusoppaasta ja surffauksen turvallisuusvinkkiohjeesta. Käytä aina liinaa, tarkista sääennuste ja älä koskaan lähde yksin vesille, jos olet oppimassa. Jos näet jätettä tai hädässä olevia merieläimiä, ilmoita siitä paikallisille viranomaisille. Kestävä varuste on varuste, joka vähentää jätettä — huolla Aquafarer-varusteesi, niin se palvelee sinua vuosia.
  faq:
    - q: Tukeeko Aquafarer valtamerten siivousaloitteita?
      a: Kyllä, lahjoitamme 1 prosenttia vuotuisesta voitosta merien puhdistukseen ja merensuojelujärjestöille. Asiakkaat voivat valita ostoksensa yhteydessä esitetyistä hyväntekeväisyyskohteista ohjatakseen osan ostoksestaan valitulle järjestölle.
    - q: Miten minun pitäisi hävittää vanha märkäpuku tai surffilauta?
      a: Neopreenistä valmistetut märkäpuvut voidaan kierrättää jooga-alustoiksi, laukkuiksi ja eristeiksi erikoistuneiden ohjelmien kautta. Ilmatäytteiset laudat voidaan korjata, lahjoittaa tai PVC voidaan palauttaa tiettyjen kierrätyslaitosten kautta. Ota yhteyttä tukitiimiimme ohjeita varten.
    - q: Mitä suojavarusteita Aquafarer suosittelee aloittelijoille?
      a: Hyvin istuva pelastusliivi (ilmatäytteinen tai vaahtomuovia), kierretty hihna, pilli ja aurinkovoide. Avovedessä SUP melojille pelastusliivi on monissa lainkäyttöalueissa lain mukaan pakollinen ja sitä suositellaan aina.
    - q: Tarjoaako Aquafarer turvallisuuskursseja?
      a: Emme järjestä kursseja suoraan, mutta teemme yhteistyötä sertifioitujen surfi- ja SUP turvallisuusohjaajien kanssa, jotka tarjoavat verkkokoulutusta ja lähiopetusta. Ota yhteyttä tukitiimiimme saadaksesi suosituksia alueellasi.
