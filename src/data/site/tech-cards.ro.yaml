cards:
  - badge: PVC
    title: Strat de grad marin PVC
    description: Țesătură laminată multi-strat PVC, destinată mediilor marine. Testată pentru UV, rezistență la abraziune și perforare.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch Miez
    description: Mii de fire interne conectează straturile superioare și inferioare, creând o structură rigidă, la presiune mare, de 12–15 PSI.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - badge: RR
    title: Margine de șină întărită
    description: Șina dublu-strat sudată prin fuziune protejează împotriva zgârieturilor de pe doc, aterizărilor pe plajă și impacturilor laterale.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
