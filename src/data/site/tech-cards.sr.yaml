cards:
  - badge: PVC
    title: Marine-Grade PVC sloj
    description: Višeslojna laminirana PVC tkanina ocenjena za pomorska okruženja. Testirana na UV, otpornost na habanje i probijanje.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch Jezgro
    description: Hiljade unutrašnjih niti povezuju gornji i donji sloj, stvarajući čvrstu strukturu za visok pritisak na 12–15 PSI.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Ojačana ivica tračnice
    description: Dvostruko slojevita fuzionisana zavarenom tračnica štiti od ogrebotina na dokovima, prizemljenja na plaži i bočnih udaraca.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
