- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Inflatable SUP Repair: Fix Punctures, Leaks, and Valve Issues'
  description: 'DIY inflatable SUP repair guide. How to find a slow leak, patch a puncture, replace a valve, and fix deck pad delamination using the included repair kit.'
  definition: 'Inflatable SUP repair involves locating air leaks through soapy water testing, cleaning and roughing the damaged area, applying PVC adhesive and patch, and curing under pressure.'
  tldr: 'Find leaks with soapy water. Clean and rough the area around the puncture with sandpaper. Apply PVC glue to both the patch and board, wait 5 minutes, press firmly, and cure under weight for 24 hours. For valve leaks, check the O-ring first. Small punctures under 1/4" are easy DIY fixes.'
  problem: 'You inflate your SUP and it has lost pressure by morning. Without repair knowledge, you face an expensive replacement for what is likely a simple puncture.'
  explanation: 'Most inflatable SUPs use a drop-stitch core with PVC outer layers. A puncture through the outer PVC creates a slow leak. Standard repair: clean, sand, apply PVC-compatible adhesive, press patch under weight. Valve leaks are more common than panel punctures — the O-ring dries out or debris prevents sealing.'
  solution: 'Inflate the board to max PSI and listen for hissing. Spray soapy water systematically, especially around seams and the valve. Mark bubbling spots. Deflate, clean with alcohol, sand with 80-grit, apply PVC glue to patch and board, wait until tacky, press firmly, weight for 24 hours.'
  recommendation: 'Use the Aquafarer repair kit included with all Aquafarer boards. Always carry the repair kit on trips. For valve issues, contact Aquafarer support. For large tears or seam separations, professional repair is recommended.'
  faq:
    - q: Can I repair a large tear in my inflatable SUP?
      a: Tears over 1\" may require professional repair or a patch on both sides. Seam separations along the rail cannot be reliably field-repaired.
    - q: How long does a repair patch last?
      a: A proper repair with correct technique lasts the lifetime of the board. Poor adhesion from inadequate cleaning leads to future failure.
    - q: Can I repair a leaking valve?
      a: Often yes. Remove the valve core, inspect the O-ring, clean or replace it, apply silicone lubricant, and reinstall.
    - q: What if I cannot find the leak?
      a: Inflate to full PSI and submerge sections sequentially in a bathtub or pool. Leaks too small to find may be temperature-related.
