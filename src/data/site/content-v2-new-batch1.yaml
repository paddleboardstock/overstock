- slug: touring-sup-guide
  category: guide
  type: buying-guide
  title: 'Touring SUP Guide: Choose the Right Board for Long-Distance Paddling'
  description: 'Touring SUPs are longer, narrower, and built for speed and glide. How to choose a touring board, essential gear for long paddles, and technique for covering distance efficiently.'
  definition: "A touring SUP is a long (12-14'), narrow (30-32') board designed for efficient paddling over distance. Features include a displacement nose for cutting through water, a longer waterline for glide, and often a bungee cargo system."
  tldr: 'Touring SUPs prioritize speed and tracking over stability. Minimum 12'' length for efficiency, 30-32" width for a balance of glide and stability. Key features: displacement nose, straight outline, multiple fin setups. Essential gear: PFD, leash, water, phone, and bungee system for gear. Technique focuses on long, smooth strokes with torso rotation.'
  problem: Paddling an all-around board on a long-distance trip leaves you exhausted. The wide nose catches chop, the board does not track straight, and you spend more energy steering than gliding. You need a board designed for distance.
  explanation: 'Touring SUPs use a displacement hull (pointed nose) that parts the water rather than riding over it, reducing drag significantly. The longer waterline increases hull speed. Narrower width reduces drag but requires better balance. Touring boards feature longer fins for directional stability. Inflatable touring boards need higher PSI (18-20) to maintain rigidity and prevent flex that wastes energy.'
  solution: 'Choose a touring board at least 12'' long with a displacement nose. Width: 30" for experienced paddlers, 31-32" for intermediates. Look for a center fin box plus side bites for stability. Inflate to max rated PSI. Equip with bungee cargo tie-down, PFD, whistle, and phone in waterproof case.'
  recommendation: 'The Aquafarer SUP Tour 12 at 12'' x 31" x 6" is an ideal touring inflatable. Its displacement nose cuts chop effectively, and the bungee system holds gear for day trips. Pair with the Aquafarer carbon paddle for efficient long-distance paddling.'
  faq:
    - q: Can I use an all-around board for touring?
      a: For short tours under 5 km, yes. For longer distances, the wider nose and shorter waterline will tire you out faster.
    - q: What length touring SUP do I need?
      a: '12'' is the minimum for touring efficiency. 12''6" is a good intermediate length. 14'' is for racing and advanced touring.'
    - q: Do inflatable touring SUPs perform as well as hard boards?
      a: Modern drop-stitch inflatables at high PSI perform similarly to hard boards for touring. The slight flex can actually be more comfortable in chop.
    - q: What paddle is best for touring?
      a: A lightweight carbon or fiberglass paddle with a larger blade (100-110 sq in) for power. An adjustable paddle allows switching between touring and surfing.
