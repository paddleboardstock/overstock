badge: Proof & Quality
heading: Evidence
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Clearance Stock, Retail-Grade QC
    product: Every Overstock Board, Re-Inspected
    industry: Quality Control
    challenge: Overstock and clearance boards come from surplus production runs, so buyers rightly ask whether a discounted board passes the same checks as a full-price one.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: 99.3% defect-free rate on outgoing shipments over the trailing 12 months — the same standard applies to clearance and retail stock.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Defect-Free Rate
        value: 99.3%
      - label: Pressure Test Coverage
        value: 100%
      - label: Hold Duration
        value: 24-48h
  - id: pressure-test-regime
    client: The 24-48-Hour Pressure Hold
    product: Every Chamber, 1.25x Rated Pressure
    industry: Product Testing
    challenge: A SUP board lives or dies by its drop-stitch core and seams, and a quick inflation check at the end of the line is not enough to catch slow leaks or weak welds.
    solution: Every board is inflated to 1.25x its rated pressure and held for 24-48 hours, with pressure drop required to stay under 5%. Valves, D-rings, seams, and buoyancy are checked with zero tolerance for safety defects.
    result: 100% of production passes this regime before packing — no sampling shortcut, no exceptions.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - 1.25x Pressure
      - Zero Safety Defects
    outcome_metrics:
      - label: Test Pressure
        value: 1.25x
      - label: Max Pressure Drop
        value: <5%
      - label: Units Tested
        value: 100%
  - id: warranty-claims-support
    client: A Warranty That Answers
    product: 2-Year Coverage on SUP Boards & Accessories
    industry: After-Sales
    challenge: Buying clearance direct from the factory raises a fair question — if something goes wrong months later, who handles it?
    solution: Every board ships with a 2-year warranty covering SUP boards, drop-stitch seams, inflation valves, and accessories. Claims go straight to our team — send photos or a short video and we take it from there.
    result: Warranty claims are reviewed and resolved by the same team that inspects production — direct, with no middleman runaround.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - 2-Year Warranty
      - Direct Support
      - Accessories Covered
    outcome_metrics:
      - label: Warranty
        value: 2 years
      - label: Coverage
        value: Board + Accessories
      - label: Support
        value: Direct Team
