badge: Proof & Results
heading: Evidence
description: Real case studies, certifications, test data, and deployment photos that demonstrate our manufacturing capability and product quality.

case_studies:
  - id: retail-private-label
    client: European Outdoor Retailer
    product: Private-Label SUP Line
    industry: Retail
    challenge: European outdoor retailer needed a private-label SUP line with unique deck graphics, eco-friendly PVC, and retail-ready packaging — all delivered in 60 days.
    solution: Developed custom digital print files, sourced REACH-compliant PVC, and compressed sampling from 3 rounds to 1 by co-locating the design team at our Qingdao factory.
    result: 55 days from signed PO to FOB. 2,400 units across 4 SKUs. Repeat order placed before first container arrived.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags: [OEM, Retail, SUP]
    outcome_metrics:
      - label: Lead Time
        value: 55 days
      - label: Units
        value: 2,400
      - label: SKUs
        value: '4'

  - id: startup-drop-stitch-kayak
    client: US Watersports Startup
    product: Drop-Stitch Kayak
    industry: Startup / Retail
    challenge: US watersports startup needed a high-performance drop-stitch kayak with custom hull shape, co-branded packaging, and BSCI certification for retail placement.
    solution: Adapted existing drop-stitch kayak mould with modified rocker profile, developed co-branded packaging artwork, and provided full BSCI audit documentation.
    result: Successfully listed in 3 major US outdoor chains. 5,000+ units in first year with 98% sell-through rate.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags: [OEM, Kayak, BSCI]
    outcome_metrics:
      - label: Retail Chains
        value: '3'
      - label: First Year Units
        value: 5,000+
      - label: Sell-Through
        value: 98%

  - id: australian-rib-distributor
    client: Australian Distributor
    product: CE-Certified RIB Range
    industry: Marine / Government
    challenge: Australian distributor required a CE-certified RIB range with custom tube colours, Hypalon upgrade option, and compliance with Australian Standard AS 1799.
    solution: Produced pre-production samples with 4 tube colour variants, sourced CSM Hypalon from Japanese supplier, and coordinated third-party AS 1799 compliance testing.
    result: 3-model RIB range launched in AU/NZ market. Followed by government tender win for 12 patrol RIBs.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags: [OEM, RIB, Hypalon, Government]
    outcome_metrics:
      - label: Models Launched
        value: '3'
      - label: Patrol Boat Contract
        value: 12 units
      - label: Compliance
        value: AS 1799

  - id: caribbean-resort-fleet
    client: Caribbean Luxury Resort Group
    product: Resort Fleet — RIBs, SUP, Kayaks
    industry: Hospitality / Tourism
    challenge: A 5-resort group needed a unified fleet of rental watersports equipment — RIB tenders, SUPs, and kayaks — with consistent branding, UV-resistant materials for tropical sun, and a 5-year replacement plan.
    solution: Designed a custom 3-model fleet package with UV-stabilized PVC, resort-branded deck graphics, and a phased delivery schedule. Provided staff training and a dedicated spare parts kit per resort.
    result: 180 units delivered across 5 resorts. Repeat order for 2 new properties. 40% reduction in per-unit cost versus previous suppliers.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags: [OEM, SUP, Kayak, RIB, Hospitality]
    outcome_metrics:
      - label: Units Delivered
        value: 180
      - label: Resorts
        value: '5'
      - label: Cost Reduction
        value: 40%

  - id: southeast-asia-search-rescue
    client: Southeast Asian Maritime Agency
    product: Patrol & Rescue RIB Fleet
    industry: Government / Maritime Security
    challenge: A government maritime agency required 20 patrol and rescue RIBs with fire-resistant Hypalon fabric, self-bailing floors, integrated VHF/radio console mounts, and compliance with SOLAS Chapter III rescue boat standards.
    solution: Manufactured 20 RIBs with CSM Hypalon tubes, marine-grade aluminum hulls, heavy-duty towing eyes, and pre-installed navigation light packages. Factory inspection team witnessed sea trials. Full SOLAS documentation package provided.
    result: Contract delivered in 4 months. Fleet deployed for border patrol, search and rescue, and disaster response across 3 regional bases.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags: [OEM, RIB, Hypalon, Government, SOLAS]
    outcome_metrics:
      - label: Patrol RIBs
        value: '20'
      - label: Delivery
        value: 4 months
      - label: Bases
        value: '3'

  - id: european-dtc-ecommerce
    client: European DTC Watersports Brand
    product: Branded SUP + Accessory Line
    industry: E-commerce / Retail
    challenge: A fast-growing DTC watersports brand needed a complete SUP package (board, pump, paddle, leash, bag) with premium packaging designed for e-commerce fulfilment — direct-to-consumer via DHL/FedEx without damage.
    solution: Developed a co-branded product line with custom EPS core shaping, proprietary drop-stitch technology for higher pressure, and retail-ready double-wall corrugated boxes with insert padding. Integrated QR-code-based authenticity and warranty registration.
    result: 3-model SUP line launched in 75 days. 15,000+ units in first 12 months. 4.8★ average rating on 2,000+ reviews. 0.3% damage rate in transit.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags: [OEM, SUP, DTC, E-commerce]
    outcome_metrics:
      - label: Models
        value: '3'
      - label: Units
        value: 15,000+
      - label: Avg Rating
        value: 4.8★
      - label: Damage Rate
        value: 0.3%

certifications:
  - name: CE
    body: European Union
    desc: Products carry CE certification per applicable EU directives — recreational craft per EN ISO 6185, personal flotation devices per EN ISO 12402, where applicable.
  - name: ISO 9001
    body: SGS / BSI
    desc: Quality management system certified for design, manufacturing, and distribution of inflatable watercraft.
  - name: BSCI
    body: amfori
    desc: Social compliance certification demonstrating ethical manufacturing, fair labour, and workplace safety.
  - name: REACH
    body: European Chemicals Agency
    desc: All materials comply with REACH regulations for chemical safety. Documentation provided with every shipment.
  - name: RoHS
    body: European Union
    desc: Restriction of hazardous substances compliance across all electronic and electrical components.
  - name: AS 1799
    body: Standards Australia
    desc: Australian standard for inflatable boats — tested and certified for commercial use in AU/NZ waters.

test_results:
  - metric: Units Pressure Tested
    value: 100%
    detail: Every boat, every chamber, every batch
  - metric: Max Pressure Drop
    value: '<5%'
    detail: Over 24h at 1.25x rated pressure
  - metric: Major Defect Threshold
    value: AQL 2.5
    detail: Per ISO 2859 sampling standard
  - metric: Pressure Hold Duration
    value: 24-48h
    detail: Depending on product category
  - metric: Test Pressure Margin
    value: 1.25x
    detail: Safety margin on every chamber
  - metric: Safety Defect Tolerance
    value: 0%
    detail: Valves, D-rings, seams, buoyancy

