origin:
  tagline: Meie päritolu
  heading: |-
    Ehitatud vee peale,<br />
    <span class="text-sky-600">Eesmärgist juhitud</span>
  paragraphs:
    - 'Paddle Board Overstock Alustasin rannikutöökojas ühe paadi ja kangekaelse veendumusega: meretooteid tuleks insenerida nii, nagu need oleksid olulised — sest need on olulised.'
    - Meie asutajad, kaks laevaehituse arhitekti, nägid tööstust, kus nurki kärbiti, materjale alandati ja ohutust käsitleti kui linnukesi. Nad ehitasid esimese Paddle Board Overstock kere mitte kasumi eesmärgil, vaid selleks, et tõestada, et taskukohane merevarustus võib olla tõeliselt usaldusväärne.
    - See esimene kere on tänaseni kasutuses. See põhimõte ei muutunud kunagi.
    - Me ei ole suurim tootja. Me ei tooda kõige odavamaid tooteid. Kuid iga kere, mis meie töökojast lahkub, läbib samade käte, kes ettevõtte asutasid — ja vastab samale standardile, mille esimene kere kehtestas.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock Ranniku töötuba
philosophy:
  tagline: Meie filosoofia
  heading: Juurdunud ookeanis
  description: Ookean ei ole meie töökoht. See on meie õpetaja. Iga disainiotsus algab arusaamisest, kuidas vesi käitub, kuidas tingimused muutuvad ja kuidas varustus peab reageerima.
  cards:
    - emoji: 🌊
      title: Austa vett
      description: Vesi on ettearvamatu. Meie tooted on loodud kõige hullemate tingimuste jaoks, mitte parimate jaoks. Kui kere suudab tõusuvooluga toime tulla, siis suudab ta ka järvega hakkama saada. Kui päästevest töötab avameres, on see jõe jaoks üle ehitatud — ja see on tahtlik.
    - emoji: 🔧
      title: Ehitatud kestma, mitte asendama
      description: Kõige jätkusuutlikum toode on see, mida ei vaja välja vahetada. Mereväe PVCtasemel , Hypalon, ja drop-stitch konstruktsioon valitakse vastupidavuse tagamiseks. Me saadame endiselt varuosi keredele, mille ehitasime kümme aastat tagasi.
    - emoji: 🏆
      title: Ligipääsetav disaini järgi
      description: Veespordialad ei tohiks olla luksus. Me loome tooteid, mis pakuvad professionaalse taseme jõudlust hinnaga, mis sobib peredele, giididele ja väikestele operaatoritele — mitte ainult äriklientidele.
design:
  tagline: Disainifilosoofia
  heading: |-
    Disainitud serva jaoks<br />
    <span class="text-sky-600">tingimuste kohta</span>
  paragraphs:
    - Iga Paddle Board Overstock toode algab ühe küsimusega:<em>Mis on kõige hullem seisund, millega see silmitsi seisab?</em>Me disainime servast sissepoole, mitte keskelt väljapoole.
    - 'Meie drop-stitch südamikud on hinnatud PSI 15-le — mitte sellepärast, et 12 PSI poleks järve jaoks piisav, vaid sellepärast, et 15-tolline PSI laud suudab järsu lõikega hakkama saada ilma paindumata. Meie Hypalon torud on mõeldud kaubandusliku taseme UV vastupidavuseks — mitte sellepärast, et iga klient sõudaks troopikas, vaid sellepärast, et UV lagunemine on enneaegse rikke #1 põhjus.'
    - Me ei planeeri kindla hinnataseme järgi. Me projekteerime läbikukkumispunktini — siis ehitame sellest palju kõrgemale.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock Disain ja inseneriteadus
  stats:
    - value: '15'
      label: PSI Tuum<br />Hinnang
    - value: 1,500+
      label: UV Tunnid<br />testitud
    - value: 10yr
      label: crazy<br />eluea
