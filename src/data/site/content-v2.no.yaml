- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Selvredning: Hvordan komme seg tilbake på brettet i dypt vann'
  description: Hver SUP padler bør mestre selvredning. Trinn-for-trinn-teknikker for å komme tilbake på brettet i dypt vann, trekke det til land, og håndtere leash-floker.
  definition: SUP selvredning er teknikken for å komme seg opp på paddlebrettet ditt i dypt vann etter å ha falt av, inkludert å hente brettet, komme kroppen opp igjen og hente padlen.
  tldr: 'Etter å ha falt: hold deg rolig, hold fast i åren, svøm til brettet. Plasser åren på tvers over brettet. Bruk delfinspark for å skyve brystet opp på brettet. Sving ett ben opp, deretter det andre. Sett deg først på kne, så reis deg opp. Øv i stille vann til det blir muskelminne.'
  problem: Du faller av din SUP i dypt vann og kan ikke komme deg opp igjen. Brettet er glatt, du er sliten, og panikk setter inn. Uten kunnskap om selvredningsteknikk blir et enkelt fall farlig.
  explanation: 'Selvredning har tre stadier: gjenoppretting (svømme til brettet og padle), påstigning (komme tilbake på brettet) og fortsettelse (gjenoppta padlingen). Nøkkelteknikken er å bruke padlen som stabilisator og bruke kraftige benspark for å drive overkroppen opp på brettet.'
  solution: 'Trinn 1: svøm til brettet. Hold fast i åren eller hent den. Trinn 2: plasser åren på tvers over brettet. Spark kraftig med bena mens du drar brystet mot midten av brettet. Trinn 3: når brystet er på brettet, sving bena opp ett om gangen. Trinn 4: knel, ta et pust, og reis deg deretter gradvis.'
  recommendation: Øv på selvredning under kontrollerte forhold til du kan gjøre det uten å tenke. Bruk Aquafarer SUP Explorer 11 som har godt dekksgrep. Life Vest Pro gir ekstra flyteevne hvis du sliter.
  faq:
    - q: Hvordan kommer jeg meg tilbake på hvis jeg er utslitt?
      a: Hold deg til brettet for oppdrift. Bruk armene til å dra brystet opp på brettet, selv om beina ikke kan sparke effektivt. Hvile i knelende posisjon før du reiser deg.
    - q: Hva om jeg mister padlingen?
      a: Bruk armene til å padle brettet til land. Be en annen padler om hjelp. Bytt ut mistet padle umiddelbart.
    - q: Kan jeg redde meg selv i bølger?
      a: Ja — plasser brettet vinkelrett på bølgene. Tim gjenoppstigningen din mellom bølgene. Reimen holder brettet i nærheten.
    - q: Hvordan håndterer jeg en kobbelfloke?
      a: Hold deg rolig, flyt på ryggen, løs opp linen sakte. Hvis linen er viklet rundt føttene, kan det hende du må ta av deg føttene mens du er i vannet.
