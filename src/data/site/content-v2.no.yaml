- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Guide til størrelse på padlebrett: Volum, lengde og bredde for enhver rytter'
  description: Komplett padlebrettstørrelse med volumforslag etter vekt og aktivitet. Inkluderer en brukervennlig størrelsesoversikt for allround-, tur-, surf- og yogaSUP-brett.
  definition: Størrelsen på paddleboard bestemmes av volum (vektkapasitet og flyteevne), lengde (hastighet og sporingsstabilitet), bredde (stabilitet) og tykkelse (volumfordeling og vindmotstand).
  tldr: 'Bruk vekt for å finne minimum volum: 50-70 kg trenger 220-260L, 70-90 kg trenger 260-300L, 90-110 kg trenger 300-350L, 110+ kg trenger 350+L. For nybegynnere, legg til 20 % på disse tallene. Bredde er viktig: 32" er middels, 33-34" er nybegynnervennlig, 35"+ er veldig stabil.'
  problem: Oppføringer av paddleboard-størrelser bruker fot, tommer og liter om hverandre, noe som gjør det vanskelig å sammenligne på tvers av merker.
  explanation: Volum er den mest direkte målingen for vektkapasitet — 1 liter ferskvann fortrenger 1 kg vekt. En brett med 260L kan teoretisk støtte 260 kg, men praktisk kapasitet er lavere fordi bretten må sitte over vannet. Din totale vekt (kropp pluss utstyr) bør være 30-40 % av brettets volum.
  solution: Målvolum = (kroppsvekt i kg + utstyrsvekt i kg) x 3. For en padler på 75 kg med 5 kg utstyr, mål = 80 x 3 = 240L minimum. For nybegynnere, multipliser med 3,5. For avanserte, multipliser med 2,5.
  recommendation: The Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") passer for de fleste ryttere 50-100 kg. Lettvektige ryttere kan velge størrelsen AirDeck 270. Tyngre ryttere bør se på SUP Tour 12 (300L+) eller bredere brett.
  faq:
    - q: Spiller høyde noen rolle for SUP-størrelse?
      a: Høyde betyr mindre enn vekt. En høy lett rytter trenger mindre volum enn en lav tung rytter. Bruk vekt som din primære volumfaktor.
    - q: Hva skjer med for mye volum?
      a: Brettet sitter for høyt og fanger vinden som et seil. Det føles korkete i småbølger. For nybegynnere er imidlertid ekstra volum bedre enn for lite.
    - q: Hva skjer med for lite volum?
      a: Brettet sitter for dypt og skaper motstand. Neset kan gå under vann under padling (pearling). Du blir raskt sliten av å padle et delvis nedsenket brett.
    - q: Trenger oppblåsbare brett en annen størrelsestilpasning enn harde brett?
      a: Ikke betydelig. Oppblåsbare på 15+ PSI fortrenger vann på samme måte som harde brett. Volum anbefalinger gjelder like mye for begge typer.
