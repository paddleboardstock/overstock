- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3 mm vs 5 mm Våtdrakt: Hva de fleste nybegynnere gjør galt i kaldt vann'
  description: Slutt å fryse midt i økten eller å overopphetes på stranden. Den virkelige forskjellen mellom 3 mm og 5 mm våtdrakter — temperaturdiagram, fleksibilitetsavveininger, og hva som faktisk fungerer for surfing i kaldt vann.
  definition: En våtdrakt er et plagg i neopren som fanger et tynt lag vann mot huden, som kroppsvarmen varmer opp for isolasjon. Tykkelsen (3 mm, 5 mm) avgjør temperaturområdet en drakt kan takle — tykkere er varmere, men mindre fleksibel.
  tldr: Tykkelsen på våtdrakt bestemmer direkte varme og fleksibilitet. Bruk 3 mm for vann over 16 °C og 5 mm for vann mellom 8 °C og 16 °C. Tykkere drakter begrenser bevegelse, men holder deg varm lenger — velg alltid passform fremfor merke.
  problem: Du åpner en nettbutikk eller går inn i en surfebutikk og ser våtdrakter merket 3/2, 4/3, 5/4 og 5 mm hel drakter. Tallene betyr ikke så mye før du innser at feil tykkelse enten betyr at du fryser midt i økten eller blir overopphetet og svetter på stranden.
  explanation: Våtdrakter fungerer ved å fange et tynt lag med vann mellom huden din og neopren; kroppen din varmer opp dette vannet, og skaper isolasjon. Tykkere neopren fanger mer vann, men begrenser fleksibilitet og oppdrift. En 3 mm drakt (ofte 3/2 med tynnere armer) passer for milde forhold, mens 5 mm (5/4/3 eller full 5 mm) passer for kaldt vann. Brystglidelås gir bedre tetting enn ryggglidelås og reduserer skylleinntrenging. Søm-konstruksjon — limt og blindsydd (GBS) — er forskjellen mellom en lekk våtdrakt og en varm en.
  solution: Tilpass tykkelsen til din lokale vanntemperatur med en feilmargin på 5°C. For tempererte klimaer kjøp en 3/2 mm. For kaldt vann kjøp en 5/4/3 mm. Legg til støvler, hansker og hette for å utvide rekkevidden med ytterligere 5°C nedover. Prøv dresser før du kjøper, eller velg et merke med en generøs returpolicy.
  recommendation: Aquafarer Wetsuit Pro i 5/4/3 mm er ideell for de fleste surfere i kaldt vann, og tilbyr GBS-sømmer og termisk fôr. Hvis du surfer i varmt vann over 20°C, er en 3/2 mm med brystglidelås det bedre valget.
  faq:
    - q: Hvilken vanntemperatur krever en 5 mm våtdrakt?
      a: Vanntemperaturer mellom 8°C og 14°C krever en 5 mm drakt. Under 8°C trenger du en 6/5/4 mm hettejakke. Mellom 14°C og 18°C fungerer en 4/3 mm godt for de fleste.
    - q: Kan jeg bruke en 3 mm våtdrakt om vinteren?
      a: Bare i milde vinterklimaer hvor vannet holder seg over 16°C. For ekte vintersurfing er 5 mm eller 5/4/3 mm nødvendig. Støvler, hansker og hette gir tilsvarende varme uten behov for en tykkere overkropp.
    - q: Hvor stram bør en våtdrakt være?
      a: Tettsittende, men ikke restriktiv. Det bør ikke være noen luftlommer eller løs neopren. Hvis du kan skyve en finger mellom huden og drakten nederst på ryggen, er den for løs. Hvis det er vanskelig å puste eller bevegelsen er kraftig begrenset, bør du gå opp en størrelse.
    - q: Holder dyre våtdrakter deg varmere?
      a: Høyere pris betyr ofte bedre neopren (kalksteinsbasert vs petroleum), bedre sømkonstruksjon (GBS vs kun limt), og bedre fleksibilitet. Disse faktorene påvirker direkte varme og holdbarhet, men bare hvis passformen er korrekt.
