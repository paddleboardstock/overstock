- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hydrering og solbeskyttelse: Hold deg trygg på vannet'
  description: Viktige strategier for hydrering og solbeskyttelse for SUP padlere. Dehydrering og solbrenthet er de vanligste SUP problemene — hvordan forhindre begge under lange økter.
  definition: SUP hydrering betyr å opprettholde væskebalansen under padling gjennom regelmessig inntak av vann. Solbeskyttelse innebærer bruk av SPF, beskyttende klær og å tilpasse tidspunktene for økter for å unngå topp UV.
  tldr: Drikk 500 ml vann per time med padling. Ta med mer enn du tror du trenger — en 2L vannblære eller flere flasker. Påfør vannresistent SPF 50+-solkrem før padling og gjenta påføringen hver 2. time. Bruk hatt, solbriller med stropp og UPF-klassifisert klær. Unngå padling fra kl. 11 til 15 når UV er sterkest.
  problem: Du har en flott SUP-økt, men etter en time får du hodepine, tørr munn, og huden din brenner. Dehydrering og solbrenthet sniker seg på deg fordi vannet holder deg kjølig.
  explanation: Refleksjon fra vannet intensiverer UV eksponering med opptil 40 %. Den kjølende effekten av vann og bris maskerer solbrenthet til det er for sent. Svetting fra padling øker væsketap, og det er ofte ingen steder å fylle på vann på vannet. Dehydrering svekker balanse og beslutningstaking, noe som øker risikoen for ulykker.
  solution: Fest en vannflaske eller hydreringsekk til brettets strikkesystem. Drikk hver 15. minutt uansett om du er tørst eller ikke. Påfør solkrem med SPF 50+ 30 minutter før du starter. Bruk hatt med bred brem, polariserte solbriller med stropp, og UPF 50+ rash guard. Påfør solkrem på nytt hver 2. time.
  recommendation: Bruk en drikkeblære festet til front D-ringene på din Aquafarer SUP. Bruk en UPF 50+ solbeskyttende trøye under din PFD. Bruk en vanntett solkrem som holder seg på i svette og vann.
  faq:
    - q: Hvor mye vann bør jeg ta med på en SUP-tur?
      a: Minst 1 liter per time. For en 2-timers økt, ta med 2 liter. Mer i varmt vær. En drikkeblære fungerer best.
    - q: Hvilken type solkrem er best for SUP?
      a: Vannavstøtende, SPF 50+ bredspektret. Mineralsolfilter (sinkoksid, titandioksid) er trygge for korallrev og varer lenger.
    - q: Reflekterer vannet virkelig UV?
      a: Ja — vann reflekterer opptil 40 % av UV-strålingen, noe som betyr at du får UV både ovenfra og nedenfra. Dette øker risikoen for forbrenning betydelig.
    - q: Kan jeg bli solbrent gjennom en rash guard?
      a: Vanlige rashguards gir minimal UV-beskyttelse (omtrent UPF 10-20). Se etter klær med UPF 50+-vurdering for full beskyttelse.
