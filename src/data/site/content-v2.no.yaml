      a: Konstruksjonen i rustfritt stål er svært korrosjonsbestandig, men bør skylles etter eksponering for saltvann.
    - q: Hva er ventilkjerneverktøyet til?
      a: Den fjerner og installerer ventilkjernen som finnes i SUP og oppblåsbare båtventiler for rengjøring, smøring eller utskifting.
    - q: Kommer det med garanti?
      a: Ja, ZB-MT350 leveres med 1 års garanti mot produksjonsfeil.
    - q: Kan jeg ta dette med på et fly?
      a: Knivbladet kan begrense bruk i håndbagasje. Pakk det i innsjekket bagasje når du flyr.
