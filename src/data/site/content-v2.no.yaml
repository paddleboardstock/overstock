- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Våtdraktpleie: Få neoprenen til å vare dobbelt så lenge'
  description: Riktig stell av våtdrakt forlenger levetiden fra 1 sesong til 3+. Skylling, tørking, oppbevaring og reparasjonstips for neopren-våtdrakter. Unngå vanlige feil som ødelegger våtdrakter for tidlig.
  definition: Omsorg for våtdrakt innebærer å skylle med ferskvann etter hver bruk, tørke vekk fra direkte sollys, oppbevare flatt eller hengt på en bred hanger, og periodisk rengjøring for å fjerne salt, bakterier og lukt.
  tldr: Skyll drakten din innvendig og utvendig med ferskvann umiddelbart etter hver økt. Tørk den utvendig og innvendig i skyggen på en bred plastkleshenger. Oppbevar flat eller brettet på et kjølig, tørt sted. La aldri drakter ligge i direkte sollys, varme biler eller tørketromler. Bruk draktshampo hver 5-10. økt.
  problem: Etter en sesong lukter våtdrakten din, neoprenen har mistet elastisiteten, sømmene flasser, og glidelåsen henger — alt kan unngås med riktig pleie.
  explanation: Saltkrystaller setter seg fast i neopren og sliter på materialet. Bakterier formerer seg i fuktige innsider, produserer lukt og bryter ned neopren. UV nedbryter nylonbelegget. Varme over 50°C forårsaker delaminering. Utilstrekkelig tørking deformerer neopren og belaster sømmene.
  solution: 'Etter hver økt: skyll grundig inn- og utvendig, vend vrangen ut, heng på bred plastkleshenger i skyggen. Når den er tørr, vend rett vei og oppbevar flatt. Hver 5-10 økt: vask med våtdraktshampoo. Månedlig: smør glidelåsen med glidelåsvoks.'
  recommendation: Bruk Aquafarer draktshampo for rengjøring og Aquafarer glidelåsvoks for glidelåspes vedlikehold. Oppbevar på Aquafarer bredt hengeren i nettposen.
  faq:
    - q: Kan jeg legge våtdrakten min i vaskemaskinen?
      a: Ikke anbefalt — maskinvask skader neopren. Hvis du må, bruk skånsom vask, kaldt vann og en vaskepose.
    - q: Hvordan får jeg lukten ut av våtdrakten min?
      a: Bløtlegg i kaldt vann med våtdraktshampo eller hvitvinseddik i 30 minutter. Skyll grundig.
    - q: Hvordan bør jeg tørke våtdrakten min?
      a: Vendt utvendig i skyggen på en bred, polstret plastkleshenger. Unngå direkte sollys og metallhengere.
    - q: Kan jeg reparere en revnet våtdrakt?
      a: Små rifter under 1" kan repareres med neoprenlim og en lapp. Større rifter kan kreve profesjonell reparasjon.
