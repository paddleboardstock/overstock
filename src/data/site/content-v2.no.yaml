- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Oppblåsbar SUP-lagring: Den riktige måten å lagre din iSUP på'
  description: Riktig oppbevaring av oppblåsbare SUP forhindrer delaminering, UV skade, mugg og ventillekkasjer. Tips for vinteroppbevaring, langtidsoppbevaring og daglig oppbevaring av drop-stitch brett.
  definition: Oppblåsbar SUP-lagring betyr å oppbevare brettet i et rent, tørt miljø med kontrollert temperatur, bort fra UV, ekstreme temperaturer og fysisk skade.
  tldr: Oppbevares på et kjølig, mørkt sted under 30 °C, borte fra direkte sollys. For korttidslagring (1-2 uker), oppbevar delvis oppblåst ved 8-10 PSI. For langtidslagring, tøm helt for luft, rull løst og legg i oppbevaringsposen. Oppbevares aldri vått. Hold unna gnagere og skarpe gjenstander.
  problem: Du tømmer luften ut av SUP og putter det i en varm garasje eller fuktig kjeller. Tre måneder senere har PVC gulnet, dekkputen flasser, og ventilen lekker. Feil lagring forårsaker mer skade enn vanlig bruk.
  explanation: Varme over 50°C får PVC myknere til å migrere, noe som gjør materialet stivt og sprøtt. UV stråling bryter ned polymerbindinger. Fuktighet fanget inni skaper mugg. Kulde under frysepunktet gjør PVC sprøtt. Trykkpunkter fra tett sammenbretting skaper permanente bretter.
  solution: 'Korttidslagring: skyll, tørk, fyll til 10 PSI, og oppbevar hevet fra bakken i et skyggefullt område. Langtidslagring: rengjør grundig, tørk helt, tøm luft fullstendig, rull med dekkpad utover, legg i pose, oppbevar i en kjølig og tørr skap. Hold unna kjemikalier og skadedyr.'
  recommendation: Bruk Aquafarer-bæreposen til oppbevaring — den blokkerer UV og forhindrer riper. Oppbevar i et klimakontrollert rom. Legg en tørkepakke inni posen i fuktige omgivelser.
  faq:
    - q: Kan jeg oppbevare min SUP oppblåst i garasjen?
      a: Bare hvis garasjen holder seg under 30°C og ikke har direkte sollys. De fleste garasjer overstiger 40°C om sommeren.
    - q: Bør jeg oppbevare min SUP i vesken?
      a: Ja, vesken beskytter mot støv, UV, og fysisk skade. Sørg for at brettet er helt tørt før du legger det i vesken.
    - q: Kan frysing skade en oppblåsbar SUP?
      a: Ja. Under frysepunktet blir PVC sprøtt og kan sprekke når det rulles ut eller blåses opp. Oppbevares alltid over 5°C.
    - q: Hvordan bør jeg rulle min SUP for oppbevaring?
      a: Rull med dekkputen vendt utover for å beskytte bunnen PVC. Unngå stramme brett. Bytt brettposisjon hver gang.
