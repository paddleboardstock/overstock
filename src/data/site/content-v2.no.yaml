- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Vedlikehold av oppblåsbar båt: Bevar investeringen din'
  description: Årlig vedlikeholdssjekkliste for oppblåsbare båter. Rengjøring, UV beskyttelse, sømkontroll, trykkhåndtering, motorpleie og vinterklargjøring for PVC og Hypalon båter.
  definition: Vedlikehold av båt med luft består av rengjøring, UV beskyttelse, trykkhåndtering, inspeksjon av sømmer og ventiler, muggforebygging og riktig lagring utenom sesongen.
  tldr: Skyll etter hver bruk i saltvann. Påfør UV beskyttelse hver 2-3 måned. Sjekk oppblåsingstrykket før hver tur. Inspiser sømmer, ventiler og akterspeil månedlig. Rengjør med mild såpe. Oppbevar tømt for luft på et kjølig og tørt sted utenom sesongen.
  problem: Du brukte din oppblåsbare båt i en sesong, og nå ser tubene falmet ut, en søm siger, og transomet føles svampete — alt dette kunne vært forhindret med rutinemessig vedlikehold.
  explanation: UV stråling nedbryter polymermatrisen. Saltvann krystalliserer i folder og sliter på stoffet. Mugg vokser i fanget fuktighet. Feil trykk forårsaker materialutmattelse. Akterspeilet (spesielt kryssfiner) absorberer vann gjennom skruehull.
  solution: 'Etter hver bruk: skyll med ferskvann, tørk, sjekk trykket. Månedlig: tørk av rørene med UV beskyttelse, inspiser sømmer, sjekk ventil. Årlig: grundig rengjøring, inspiser akterspeilet for råte, smør ventiler, test for mikro-lekkasjer.'
  recommendation: Bruk 303 Aerospace Protectant på Aquafarer båtrør. Fjern ventiler og påfør silikonsmøremiddel årlig. Oppbevar i bæreposen med en tørkepakke.
  faq:
    - q: Kan jeg bruke blekemiddel for å rengjøre min oppblåsbare båt?
      a: Nei — blekemiddel skader stoffets belegg. Bruk mild såpe og varmt vann. For mugg, bruk fortynnet hvit eddik.
    - q: Hvor ofte bør jeg behandle med UV-beskyttelse?
      a: Hver 2-3 måned i løpet av bruksperioden. Hyppigere i tropiske klima.
    - q: Må jeg tømme båten for luft mellom bruk?
      a: Ikke hvis det brukes ukentlig. La det være oppblåst med et UV-trekk på. For månedlige pauser, tøm luften og oppbevar.
    - q: Hvordan vedlikeholder jeg transomet?
      a: Sjekk boltene månedlig. Forsegl eksponerte trekanter med marin lakk årlig. Bytt ut hvis det utvikler seg myke flekker.
