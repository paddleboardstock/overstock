- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Våtdraktreparasjon: Fiks rifter, sømmer og glidelåser selv'
  description: DIY-guide for våtdraktreparasjon for neoprenriv, sømskilting, glidelåsstopp og delte kneputer. Trinn-for-trinn-instruksjoner ved bruk av neoprenlim.
  definition: Reparasjon av våtdrakt innebærer rengjøring og rugging av det skadede området, påføring av neoprenlim og herding under trykk for å gjenopprette vanntett integritet og fleksibilitet.
  tldr: 'Små rifter under 1": påfør neoprenlim på begge sider, vent 10-15 minutter til det er klebrig, trykk fast, herd under vekt i 12 timer. Større rifter trenger en neoprenlapp. Glidelåsproblemer: smør først, sjekk deretter for stoffkiler.'
  problem: Våtdrakten din har en liten rift, en søm som skiller seg, eller en glidelås som sitter fast. Uten gjør-det-selv-reparasjon betaler du $150+ for en erstatning når reparasjonen koster $5.
  explanation: Neoprenlim fungerer ved å myke opp neoprenovertflaten, og skaper en kjemisk binding når løsemidlet fordamper. Limet må påføres begge overflater og bli klebrig før sammenføyning. For rifter må kantene tilpasses nøyaktig. Glidelåsproblemer skyldes ofte saltkorrosjon eller stoff som sitter fast i tennene.
  solution: 'For tårer: rengjør med alkohol, puss lett, påfør et tynt lag med sement på begge kanter, vent til det blir klebrig, press sammen perfekt, påfør vekt, herd i 12-24 timer. For lapper: klipp lappen 1" større enn tåren, påfør sement på begge, klem sammen. For glidelås: skyll, påfør glidelåsvoks, arbeid forsiktig.'
  recommendation: Ha et Aquafarer våtdrakt reparasjonssett i utstyrssekken din. For store reparasjoner eller sømskader på kritiske punkter, anbefales profesjonell reparasjon.
  faq:
    - q: Kan jeg bruke superlim på en våtdrakt?
      a: Nei — superlim tørker hardt og sprøtt. Bruk kun neoprenlim eller Aquaseal for reparasjon av våtdrakter.
    - q: Hvor lenge varer en neoprenlim-reparasjon?
      a: En skikkelig utført reparasjon er ofte sterkere enn den opprinnelige neoprenen og varer resten av draktenes levetid.
    - q: Kan jeg reparere en glidelås som har fullstendig delt seg?
      a: Hvis sporet har løsnet fra neopren, lim på nytt med kontaktlim. Hvis tennene er skadet, bytt glidelåsen profesjonelt.
    - q: Hvordan fikser jeg en våtdrakt som lekker ved sømmen?
      a: Påfør en tynn stripe med aquaseal langs innsiden av den lekkende sømmen og la den herde i 24 timer.
