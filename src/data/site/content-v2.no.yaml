- slug: how-to-choose-a-wetsuit
  category: guide
  type: buying-guide
  title: 'Hvordan velge en våtdrakt: Passform, tykkelse og funksjoner forklart'
  description: Fullstendig kjøpsguide for våtdrakt. Hvordan velge riktig tykkelse for vanntemperaturen, sikre riktig passform, forstå sømtyper, og velge funksjoner basert på aktiviteten din.
  definition: 'En våtdrakt er et plagg av neopren som gir termisk isolasjon ved å fange et tynt lag med vann mot huden. Viktige utvalgsfaktorer: tykkelse, passform, sømkonstruksjon, innstigningssystem og neoprentype.'
  tldr: 'Match tykkelse med vanntemperatur: 3/2 mm for 14-20°C, 4/3 mm for 12-18°C, 5/4/3 mm for 8-14°C, 6/5/4 mm for under 8°C. Passform er den viktigste faktoren. GBS-sømmer er gullstandarden. Bryst-glidelås reduserer gjennomstrømning. Kalkstein-neopren er mer fleksibel enn petroleumsbasert.'
  problem: Online størrelsesdiagrammer for våtdrakter er upålitelige, anbefalinger for tykkelse varierer mellom merker, og beskrivelsene av funksjoner er forvirrende.
  explanation: Våtdraktens tykkelsestall (3/2, 4/3, 5/4/3) refererer til mm på torso/armer og bein. Tykkere drakter er varmere, men begrenser bevegelse. En løs drakt skyller ut varmt vann. GBS-sømmer er varme og fleksible; flatlock-sømmer er mindre varme. Brystglidelåsingang er varmere enn ryggglidelås. Kalkstein-neopren er mer fleksibel i kaldt vann.
  solution: Mål bryst, midje, hofter og høyde. Sammenlign med størrelseskart. Velg tykkelse basert på den kaldeste vanntemperaturen. Velg GBS-sømmer for kaldt vann. Foretrekk brystglidelås under 15°C. Vurder termofôr for ekstra varme.
  recommendation: Aquafarer Wetsuit Pro i 3/2 mm (14-20°C) eller 5/4/3 mm (8-16°C) tilbyr GBS-sømmer, brystglidelås og kalkstensneopren til en konkurransedyktig pris.
  faq:
    - q: Hvor stram bør en våtdrakt være?
      a: Tettsittende uten luftlommer, men ikke begrensende. En finger bør ikke gli lett på korsryggen.
    - q: Hva er den varmeste typen våtdrakt?
      a: En 6/5/4mm hette-dress med forseglede sømmer og glidelås på brystet. For ekstrem kulde er en tørrdrakt overlegent.
    - q: Er en dyrere våtdrakt verdt det?
      a: Høyere pris gir bedre neopren, sømmer og funksjoner. For vanlig bruk i kaldt vann, er merprisen verdt det.
    - q: Kan jeg bruke en våtdrakt til andre aktiviteter enn surfing?
      a: Ja — våtdrakter fungerer for SUP, kajakkpadling, dykking, triatlon og svømming i åpent vann.
