- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: 3mm vs 5mm Våtdrakt (Hva som faktisk fungerer i kaldtvannssurfing)
  description: Valget mellom en 3 mm og 5 mm våtdrakt avhenger av vanntemperaturen, ikke lufttemperaturen. Temperaturkart, fleksibilitetssammenligning og hvilken tykkelse som holder deg varm uten å begrense padlingen din.
  definition: En 3 mm våtdrakt passer til vann på 14-20°C med god fleksibilitet. En 5 mm drakt dekker 8-14°C med maksimal varme, men redusert bevegelighet. Valget er en direkte avveining mellom varme og bevegelsesfrihet.
  tldr: 3 mm våtdrakter er for vann på 14-20°C og tilbyr maksimal fleksibilitet. 5 mm drakter er for 8-14°C og prioriterer varme. Velg basert på lokal vanntemperatur, ikke lufttemperatur. Hvis du surfer gjennom flere årstider, bør du eie begge. Hvis du bare kan kjøpe én, gir en 4/3 mm den beste mellomløsningen.
  problem: Du trenger en våtdrakt, men kan ikke bestemme deg mellom en på 3 mm og en på 5 mm. En på 3 mm kan være ikke varm nok om vinteren, og en på 5 mm kan være for tykk og begrensende på varmere dager. Å gjette feil betyr enten å fryse gjennom vinteren eller å svette gjennom høsten.
  explanation: 'Neoprentykkelse korrelerer direkte med varme og omvendt med fleksibilitet. En 3 mm drakt (ofte 3/2 mm med tynnere armer) gir god bevegelighet for padling og surfing i milde forhold. En 5 mm drakt bruker tykkere neopren på kroppen og ofte tynnere paneler på armer og ben (5/4/3 mm) for å opprettholde noe fleksibilitet. Temperaturforskjellen er omtrent 6-8°C. Viktige forskjeller: 5 mm drakter bruker mer neopren, veier omtrent 40 prosent mer, tar lengre tid å tørke, og krever mer innsats for å ta av. Moderne super-stretch neopren lukker fleksibilitetsgapet, men 5 mm begrenser fortsatt bevegelsen merkbart.'
  solution: Bestem din kaldeste månedlige gjennomsnittlige vanntemperatur ved hjelp av lokale bøye-data. Hvis den er over 16°C, kjøp en 3/2mm. Hvis den er mellom 12-16°C, kjøp en 4/3mm. Hvis den er under 12°C, kjøp en 5/4/3mm. For surfing året rundt med én drakt, dekker en kvalitets 4/3mm med termisk fôr pluss en separat hette, støvler og hansker det bredeste spekteret.
  recommendation: Aquafarer Wetsuit Pro i 5/4/3 mm håndterer 8-16°C med termofôr for å kompensere for varmegapet til en ekte 5 mm. Hvis du mest surfer i milde forhold (16-20°C), tilbyr 3/2 mm Aquafarer Wetsuit Pro bedre fleksibilitet og komfort.
  faq:
    - q: Kan jeg ha på meg en 3 mm i 10°C vann?
      a: Bare for veldig korte økter (20-30 minutter) og med en termisk rashguard under. Du vil fryse mesteparten av økten. En 5 mm eller 5/4/3 mm våtdrakt anbefales sterkt for 10°C vann.
    - q: Er en 5 mm våtdrakt for varm til sommeren?
      a: Hvis sommervannet overstiger 18°C, vil en 5 mm drakt føre til overoppheting. Du kan skylle drakten med kaldt vann, men du vil ha det mer komfortabelt i en 3/2 mm eller vårdrakt i sommermånedene.
    - q: Begrenser en 5 mm våtdrakt padlingen?
      a: Ja, merkbart. Den tykkere neoprenen på skuldrene krever mer innsats per padletak. En 5/4/3mm drakt med tynnere armer hjelper, men du vil fortsatt bli mer sliten enn i en 3mm drakt.
    - q: Hva er den beste våtdrakten for surfing hele året?
      a: En 4/3 mm fullt drakt med brystglidelås og termisk fôr dekker 12-18°C, som er året rundt i mange tempererte klima. Legg til støvler for vinteren, og du kan surfe i 10-18°C med én drakt.
