    - q: Hvilket merke har bedre garantistøtte?
      a: Begge tilbyr 2-års garantier. iRocker har en større brukerbase; Aquafarer tilbyr mer personlig støtte.
    - q: Hvilken er lettere å finne i butikker?
      a: iRocker har bredere detaljhandel distribusjon. Aquafarer selger hovedsakelig gjennom sin egen nettside.
