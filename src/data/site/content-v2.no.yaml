- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Hva du skal ha på deg for surfing (Ikke møt opp i boardshorts når du trenger en 5/4)
  description: Slutt å gjette hva du skal ha på deg. Det er vanntemperaturen, ikke lufttemperaturen, som bestemmer surfeklærne dine. Komplett lagvis guide fra tropiske rashguards til full vinter 5/4/3 mm-oppsett.
  definition: Surfeklær varierer fra boardshorts og rashguards i varmt vann til fulle 5/4/3mm våtdrakter med støvler og hetter i kaldt vann. Vanntemperaturen, ikke lufttemperaturen, bestemmer hva du trenger.
  tldr: Hva du har på deg når du surfer avhenger helt av vanntemperaturen — ikke lufttemperaturen. Rashguards og boardshorts fungerer over 22°C, våtdrakter for vår/sommer dekker 18-22°C, full 3/2mm drakt håndterer 14-18°C, og 5/4/3mm med støvler er nødvendig under 14°C. Bruk alltid UV beskyttelse og vurder en leash og impactvest.
  problem: Du kommer til stranden og har ingen idé om hvorvidt en rash guard er nok eller om du trenger en full våtdrakt. Lufttemperaturen er varm, men vannet er kaldt, eller vannet føles greit, men vinden er iskald. Å kle seg feil betyr en ødelagt økt.
  explanation: 'Surfingklær har tre formål: termisk isolasjon, UV-beskyttelse og forebygging av slitasje. Neoprenvåtdrakter vurderes etter tykkelse og dekning — vårdrakter (korte armer eller ben) er for dager med borderline temperatur, fulle drakter for kaldt vann. Rash guards beskytter mot brettutslett og solen, men gir ingen termisk verdi. Støvler, hansker og hetter er ikke tilbehør, men essensielt utstyr for surfing i kaldt vann under 12°C.'
  solution: 'Sjekk den lokale bøye- eller rapporten om vanntemperatur før du drar ut. Bygg et sett basert på dine kaldeste typiske forhold: rashguard og shorts for sommeren, en 3/2 mm heldrakt for vår og høst, en 5/4/3 mm med støvler og hette for vinteren. Legg alltid til en leash og vurder en flytevest for sikkerhet.'
  recommendation: Invester først i en god 3/2 mm heldrakt — den dekker det bredeste spekteret av forhold. Legg til en 5/4/3 mm drakt og støvler hvis du planlegger å surfe gjennom vinteren. Aquafarer Wetsuit Pro med termofôr dekker effektivt begge temperaturområdene.
  faq:
    - q: Kan jeg surfe kun i badeshorts?
      a: Ja, i tropisk vann over 24°C. Du kan ønske deg en rash guard for å forhindre gnaging på bryst og armer fra padling. Voks eller en traksjonspute på brettet hjelper med å kompensere for mangelen på grep fra drakten.
    - q: Trenger jeg surfestøvler?
      a: Hvis vanntemperaturen faller under 14°C, hindrer støvler nummenhet og beskytter føttene dine mot steiner og riftskader. De gir også bedre grep på brettet. De fleste surfere i nordlige klima bruker støvler fra november til mars.
    - q: Hva er en vårdrakt?
      a: En vårdrakt er en våtdrakt med korte armer eller korte ben (eller begge deler) designet for vann mellom 18°C og 22°C. Den gir mer varme enn en rashguard, men mindre dekning enn en full drakt.
    - q: Bør jeg ha på meg redningsvest mens jeg surfer?
      a: Ikke tradisjonelle redningsvester, men en støtvest eller flytehjelp kan hjelpe i røffe forhold eller hvis du er en svak svømmer. Aquafarer redningsvester er designet for SUP og kajakkpadling, men kan gi ekstra flytesikkerhet for nybegynnere i surfing.
