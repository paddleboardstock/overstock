origin:
  tagline: 'Alkuperämme'
  heading: "Rakennettu vedelle,<br />\n<span class=\"text-sky-600\">tarkoituksen ohjaamana</span>"
  paragraphs:
    - 'Paddle Board Overstock alkoi rannikkopajasta yhdellä veneellä ja itsepäisellä vakaumuksella: merituotteet on suunniteltava niin kuin niillä olisi väliä — sillä niillä on.'
    - 'Perustajamme, kaksi laivasuunnittelijaa, näkivät alan, jossa tingittiin kaikesta, heikennettiin materiaaleja ja kohdeltiin turvallisuutta rastia ruutuun -asenteella. He rakensivat ensimmäisen Paddle Board Overstock-rungan ei voittoa varten, vaan osoittaakseen, että edullinen merivaruste voi olla aidosti luotettava.'
    - 'Ensimmäinen runko on edelleen käytössä. Tämä periaate ei ole koskaan muuttunut.'
    - 'Emme ole suurin valmistaja. Emme tee halvimpia tuotteita. Mutta jokainen pajoistamme lähtevä runko käy samojen käsien läpi, jotka perustivat yrityksen — ja täyttää saman standardin, jonka ensimmäinen runko asetti.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: 'Paddle Board Overstockin rannikkopaja'

philosophy:
  tagline: 'Filosofiamme'
  heading: 'Juurtuneena valtamereen'
  description: 'Valtameri ei ole työpaikkamme. Se on opettajamme. Jokainen suunnittelupäätös alkaa ymmärryksestä siitä, miten vesi käyttäytyy, miten olosuhteet muuttuvat ja miten varusteen on reagoitava.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Kunnioita vettä'
      description: 'Vesi on arvaamatonta. Tuotteemme on suunniteltu huonoimpiin olosuhteisiin, ei parhaisiin. Jos runko kestää voimakkaan vastavirran, se kestää myös järven. Jos pelastusliivi toimii avomerellä, se on ylisuunniteltu joelle — ja se on tarkoituksellista.'
    - emoji: "\U0001F527"
      title: 'Rakennettu kestämään, ei korvattavaksi'
      description: 'Kestävin tuote on sellainen, jota ei tarvitse korvata. Merikäyttöön tarkoitettu PVC, Hypalon ja drop-stitch-rakenne on valittu pitkän käyttöiän takia. Toimitamme yhä varaosia runkoihin, jotka rakensimme kymmenen vuotta sitten.'
    - emoji: "\U0001F3C6"
      title: 'Saavutettavuus suunnittelusta'
      description: 'Vesiurheilun ei pidä olla ylellisyyttä. Suunnittelemme tuotteita, jotka tarjoavat ammattitasoisen suorituskyvyn hinnalla, joka on järkevä perheille, oppaille ja pienille toimijoille — eikä vain kaupallisille laivastoille.'

design:
  tagline: 'Suunnittelufilosofia'
  heading: "Suunniteltu olosuhteiden<br />\n<span class=\"text-sky-600\">rajalle</span>"
  paragraphs:
    - 'Jokainen Paddle Board Overstock-tuote alkaa yhdestä kysymyksestä: <em>mikä on pahin tilanne, johon se joutuu?</em> Suunnittelemme reunasta sisäänpäin, ei keskustasta ulospäin.'
    - 'Drop-stitch-ytimemme on luokiteltu 15 PSI:lle — ei siksi, että 12 PSI ei riitä järvellä, vaan siksi, että 15 PSI -lauta kestää äkillisen aallokon taipumatta. Hypalon-putkemme on määritelty kaupalliseen UV-kestävyyteen — ei siksi, että jokainen asiakas meloo troopeissa, vaan siksi, että UV-hajoaminen on ennenaikaisten vikojen ykkössyy.'
    - 'Emme suunnittele hintapisteen mukaan. Suunnittelemme murtumispisteeseen — ja rakennamme sitten selvästi sen yläpuolelle.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: 'Paddle Board Overstockin muotoilu ja suunnittelu'
  stats:
    - value: '15'
      label: 'ytimen<br />PSI-luokitus'
    - value: '1,500+'
      label: 'testattuja<br />UV-tunteja'
    - value: '10 v'
      label: 'rungon<br />käyttöikä'
