- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3 mm vs 5 mm våtdräkt: Vad de flesta nybörjare gör fel i kallt vatten'
  description: Sluta frysa mitt i sessionen eller överhettas på stranden. Den verkliga skillnaden mellan 3 mm och 5 mm våtdräkter — temperaturdiagram, flexibilitetstrade-offs och vad som faktiskt fungerar för surfing i kallt vatten.
  definition: En våtdräkt är ett plagg i neopren som fångar ett tunt lager vatten mot huden, vilket kroppsvärmen värmer för isolering. Tjocklek (3 mm, 5 mm) bestämmer temperatursområdet som dräkten kan hantera — tjockare är varmare men mindre flexibel.
  tldr: Våtdräktens tjocklek bestämmer direkt värme och flexibilitet. Använd 3 mm för vatten över 16°C och 5 mm för vatten mellan 8°C och 16°C. Tjockare dräkter begränsar rörelsefriheten men håller dig varm längre – prioritera alltid passform framför märke.
  problem: Du öppnar en nätbutik eller går in i en surfbutik och ser våtdräkter märkta 3/2, 4/3, 5/4 och 5 mm helkroppsdräkter. Siffrorna betyder inte så mycket förrän du inser att fel tjocklek antingen innebär att du fryser mitt i sessionen eller blir överhettad och svettas på stranden.
  explanation: Våtdräkter fungerar genom att fånga ett tunt lager vatten mellan din hud och neopren; din kropp värmer upp det vattnet och skapar isolering. Tjockare neopren fångar mer vatten men begränsar flexibiliteten och flytförmågan. En dräkt på 3 mm (ofta 3/2 med tunnare armar) passar milda förhållanden, medan 5 mm (5/4/3 eller full 5 mm) passar kallt vatten. Bröstdragkedja tätar bättre än ryggdragkedja och minskar sköljning. Söm konstruktion – limmad och blindsydd (GBS) – är skillnaden mellan en läckande dräkt och en varm dräkt.
  solution: Matcha tjockleken med din lokala vattentemperatur med en felmarginal på 5°C. För tempererade klimat, köp en 3/2 mm. För kallt vatten, köp en 5/4/3 mm. Lägg till stövlar, handskar och huva för att utöka ditt användningsområde ytterligare 5°C neråt. Prova dräkterna innan du köper eller välj ett märke med generös returpolicy.
  recommendation: Aquafarer Wetsuit Pro i 5/4/3 mm är idealisk för de flesta surfare i kallt vatten och erbjuder GBS-sömmar och termisk foder. Om du surfar i varmt vatten över 20°C är en 3/2 mm med bröstdragkedja det bättre valet.
  faq:
    - q: Vilken vattentemperatur kräver en 5 mm våtdräkt?
      a: Vattentemperaturer mellan 8°C och 14°C kräver en dräkt på 5 mm. Under 8°C behöver du en huvad dräkt på 6/5/4 mm. Mellan 14°C och 18°C fungerar en 4/3 mm-dräkt bra för de flesta.
    - q: Kan jag ha en 3 mm våtdräkt på vintern?
      a: Endast i områden med mild vinter där vattnet håller sig över 16°C. För riktig vintersurfing är 5 mm eller 5/4/3 mm nödvändigt. Bootar, handskar och huva ger motsvarande värme utan att behöva en tjockare överkropp.
    - q: Hur tajt ska en våtdräkt vara?
      a: Åtsittande men inte begränsande. Det ska inte finnas några luftfickor eller lös neopren. Om du kan föra in ett finger mellan din hud och dräkten vid nedre delen av ryggen är den för lös. Om det är svårt att andas eller rörelsen är kraftigt begränsad, välj en större storlek.
    - q: Håller dyra våtdräkter dig varmare?
      a: Högre pris betyder ofta bättre neopren (kalkbaserad vs petroleum), bättre sömkonstruktion (GBS vs endast limmad) och bättre flexibilitet. Dessa faktorer påverkar direkt värme och hållbarhet men bara om passformen är korrekt.
