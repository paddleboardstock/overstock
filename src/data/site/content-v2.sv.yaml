- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Storleksguide: Längd, Bredd och Volym Förklarade'
  description: Hitta rätt SUP-storlek baserat på din vikt, färdighetsnivå och paddlingstil. Längd bestämmer kursstabilitet, bredd bestämmer stabilitet och volym bestämmer viktkapacitet.
  definition: SUP storlek definieras av längd (hastighet och glid), bredd (primär stabilitet), tjocklek (sekundär stabilitet och volym) och volym i liter (total viktkapacitet).
  tldr: 'Allround SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Surf: 8''-10'' x 30"-32" (140-220L). Nybörjare behöver bredd över 32" och volym som överstiger kroppsvikten med 60-80L. Din vikt i kg plus 60L är det minsta volymmålet för stabilitet.'
  problem: Varje SUP-märke listar brädor i fot, tum och liter, men utan att veta hur dessa mått motsvarar känslan i verkligheten, riskerar du att köpa en bräda som tippar, är långsam eller inte kan bära din vikt.
  explanation: 'Längd bestämmer hur snabbt brädan paddlas och hur väl den håller en rak linje. Längre brädor (12''+) glider mellan paddeltagen och håller linjen. Kortare brädor (under 10'') svänger lätt men kräver oftare paddelbyten. Bredd bestämmer primär stabilitet — stående stabilitet. En 30" bräda känns ostadig för nybörjare; 34" känns som en brygga. Tjocklek bestämmer volym — en tjockare bräda flyter högre men fångar mer vind. Volym i liter är det bästa måttet: den lastade brädan (du plus utrustning) bör sjunka 5-10 cm i vila.'
  solution: 'Matcha dina brädans dimensioner med tre faktorer: din vikt (bestämmer minimalt volym), din huvudsakliga aktivitet (bestämmer längd) och din färdighetsnivå (bestämmer bredd). För nybörjare, multiplicera vikten i kg med 2,2 för att få minimala liter. För medelavancerade, multiplicera med 1,8. För avancerade, multiplicera med 1,4.'
  recommendation: The Aquafarer SUP Explorer 11 på 11' x 33" x 6" med 260L passar de flesta paddlare upp till 100 kg för allsidig paddling. Uppgradera till SUP Tour 12 på 12' x 31" för bättre turhastighet och glid.
  faq:
    - q: Vilken SUP-storlek behöver jag för min vikt?
      a: 'För ryttare under 70 kg: 10-11'' x 32" (220-260L). För 70-90 kg: 11-12'' x 33" (260-300L). För 90-110 kg: 11-12'' x 34" (300-350L). För över 110 kg: 12'' x 34-36" (350L+).'
    - q: Är en längre SUP snabbare?
      a: Ja. Längre brädor har ett bättre längd-till-bredd-förhållande, vilket minskar motståndet. En 14' touring SUP är avsevärt snabbare än en 11' allroundbräda vid samma paddlingsansträngning.
    - q: Vilken SUP-bredd är stabil för nybörjare?
      a: 33-34 tum är det optimala för nybörjare upp till 90 kg. Under 32" krävs god balans. Över 34" är mycket stabilt men långsammare och svårare att paddla i vind.
    - q: Kan jag använda en allroundbräda för touring?
      a: Ja, för korta turer under 10 km. För längre sträckor fungerar en dedikerad touringbräda bättre när det gäller spårning och att täcka avstånd mer effektivt.
