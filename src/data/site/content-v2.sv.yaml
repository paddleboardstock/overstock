- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Självräddning: Hur man kommer tillbaka på sin bräda i djupt vatten'
  description: Varje SUP paddlare bör behärska självräddning. Steg-för-steg-tekniker för att klättra upp på brädan i djupt vatten, bogsera den till stranden och hantera snoddtrassel.
  definition: SUP självräddning är tekniken att ta sig upp på din paddelbräda i djupt vatten efter att ha fallit av, inklusive återhämtning av brädan, att ta sig upp på kroppen igen och att hämta paddeln.
  tldr: 'Efter att ha fallit: håll dig lugn, håll i paddeln, simma till brädan. Placera paddeln tvärs över brädan. Använd en delfinspark för att skjuta bröstet upp på brädan. Svinga ena benet upp, sedan det andra. Sätt dig på knä först, sedan stå upp. Öva i lugnt vatten tills det blir muskelminne.'
  problem: Du faller av din SUP i djupt vatten och kan inte ta dig upp igen. Brädan är hal, du är trött och panik uppstår. Utan att känna till självräddningsteknik blir ett enkelt fall farligt.
  explanation: 'Självräddning har tre steg: återhämtning (simma till brädan och paddla), återuppstigning (komma tillbaka på brädan) och fortsättning (återuppta paddlingen). Den viktigaste tekniken är att använda paddeln som stabilisator och använda kraftfulla bensparkar för att driva överkroppen upp på brädan.'
  solution: 'Steg 1: simma till brädan. Håll i paddeln eller ta upp den. Steg 2: placera paddeln tvärs över brädan. Sparka med benen kraftigt medan du drar bröstet mot brädans centrum. Steg 3: när bröstet är på brädan, svinga upp benen en i taget. Steg 4: knä, ta ett andetag, sedan stå upp gradvis.'
  recommendation: Öva självräddning under kontrollerade förhållanden tills du kan göra det utan att tänka. Använd Aquafarer SUP Explorer 11 som har bra däckgrepp. Life Vest Pro ger extra flytkraft om du har svårt.
  faq:
    - q: Hur kommer jag tillbaka om jag är utmattad?
      a: Stanna vid brädan för flytkraft. Använd armarna för att dra bröstet på brädan, även om benen inte kan sparka effektivt. Vila i knästående position innan du ställer dig upp.
    - q: Vad händer om jag tappar paddeln?
      a: Använd armarna för att paddla brädan till stranden. Be en annan paddlare om hjälp. Byt ut den förlorade paddeln omedelbart.
    - q: Kan jag rädda mig själv i vågor?
      a: Ja — placera brädan vinkelrätt mot vågorna. Tajma ditt återpåstigande mellan vågorna. Kopplet håller brädan nära.
    - q: Hur hanterar jag en kopplet trassel?
      a: Håll dig lugn, flyt på ryggen, lossa kopplet långsamt. Om kopplet är lindat runt fenor kan du behöva ta av fenorna medan du är i vattnet.
