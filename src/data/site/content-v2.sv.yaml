    - q: Hur mycket vikt kan SUP Explorer 11 stödja?
      a: Maximal ryttervikt är ungefär 100 kg för optimal prestanda. Total kapacitet är cirka 120 kg.
    - q: Vad ingår i lådan?
      a: Bräda, dubbla kammarpump, 3-delad justerbar paddel, ryggsäck på hjul, hoprullat koppel, avtagbar mittfena och reparationssats.
