- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'SUP Koppelguide: Raka kontra spiralformade koppel förklarade'
  description: Komplett guide till SUP-koppel — raka vs spiralformade, ankeln vs vaden, alternativ med snabbkoppling och hur man väljer rätt koppel för dina paddlingsförhållanden.
  definition: Ett SUP koppel är ett snöre som fäster paddlaren vid brädan och förhindrar separation. Typer inkluderar raka kopplen (för surfing och floder) och spiralformade kopplen (för stilla vatten).
  tldr: Spolade koppel är bäst för stilla vatten och träningspaddling — de håller sig borta från brädan och vattnet. Raka koppel är för SUP surfing och floder — de ger mer frihet och fastnar inte. Kalvfäste föredras framför ankel för komfort. Koppel med snabbfrigöring är viktiga för flodpaddling för att förhindra fastklämning.
  problem: Du köpte ett koppel med din SUP men är inte säker på om det är rätt typ för din paddlingsstil. Fel koppel kommer att släpa, haka fast eller gå sönder när du behöver det som mest.
  explanation: Raka koppel är enkla snören av nylon eller polyuretan som följer efter brädan. De fungerar bra i surf eftersom de inte fastnar på fenor. Spiralformade koppel är spiralformade snören som drar ihop sig när de inte är under spänning — de håller sig hoprullade på brädan när du paddlar och sträcker ut sig när du faller. De håller kopplet ur vattnet i lugna förhållanden, vilket minskar motståndet.
  solution: Välj spirallina för stilla vatten, träning och turåkning SUP. Den reducerade dragkraften hjälper till att hålla farten och förhindrar att linan fastnar på föremål under vattnet. Välj rak lina för SUP surfing och paddling i floder. Den raka designen fastnar mindre på fenor eller hinder.
  recommendation: Aquafarer SUP-paket inkluderar rätt typ av koppel för brädans avsedda användning. Det spiralformade kopplet i SUP Explorer 11-paketet är utmärkt för allsidig paddling.
  faq:
    - q: Bör kopplet fästas vid min ankel eller vad?
      a: Kalvfäste föredras för SUP — det håller kopplet borta från vattnet när man paddlar och minskar snubbelrisken när man går.
    - q: Hur lång ska ett SUP koppel vara?
      a: 8-10' för platt vatten, 6-8' för vågor. Kortare kopplingslinor minskar motstånd men begränsar rörelsefriheten på brädan.
    - q: Behöver jag ett snabbkopplingskoppel för floder?
      a: Ja — floden SUP kräver en snabbkopplingskoppel eller bälte som kan lossas omedelbart för att förhindra fastklämning i silningsanordningar.
    - q: Kan jag använda ett surfkoppel för SUP?
      a: Surf-leashar är kortare och tunnare. De fungerar för SUP-surfing men är inte idealiska för paddling på stilla vatten där en längre spiral-leash är bättre.
