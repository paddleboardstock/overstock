- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Uppblåsbar SUP-förvaring: Rätt sätt att förvara din iSUP'
  description: Korrekt förvaring av uppblåsbara SUP förhindrar delaminering, UV-skador, mögel och ventil-läckor. Tips för vinterförvaring, långtidsförvaring och daglig förvaring av drop-stitch-brädor.
  definition: Uppblåsbart SUP-förvaring innebär att brädan förvaras i en ren, torr miljö med kontrollerad temperatur borta från UV, extrema temperaturer och fysisk skada.
  tldr: Förvara på en sval, mörk plats under 30°C borta från direkt solljus. För korttidsförvaring (1-2 veckor), förvara delvis uppblåst vid 8-10 PSI. För långtidsförvaring, töm helt på luft, rulla löst och lägg i förvaringspåsen. Förvara aldrig blöt. Håll borta från gnagare och vassa föremål.
  problem: Du tömmer luften ur din SUP och stoppar den i ett varmt garage eller en fuktig källare. Tre månader senare har PVC blivit gul, däckplattan flagnar och ventilen läcker. Felaktig förvaring orsakar mer skada än regelbunden användning.
  explanation: Värme över 50°C får PVC-mjukgörare att migrera, vilket gör materialet stelt och sprött. UV-strålning bryter ner polymerbindningar. Fukt som fastnat inuti skapar mögel. Kyla under fryspunkten gör PVC sprött. Tryckpunkter från tätt vikta veck skapar permanenta veck.
  solution: 'Korttidsförvaring: skölj, torka, pumpa upp till 10 PSI och förvara ovan jord i ett skuggigt område. Långtidsförvaring: rengör noggrant, torka helt, töm helt på luft, rulla med däckmatta utåt, placera i påse, förvara i ett svalt och torrt skåp. Håll borta från kemikalier och skadedjur.'
  recommendation: Använd Aquafarer-bärväskan för förvaring — den blockerar UV och förhindrar repor. Förvara i ett klimatkontrollerat rum. Lägg en torkmedelspåse i väskan i fuktiga miljöer.
  faq:
    - q: Kan jag förvara min SUP uppblåst i garaget?
      a: Endast om garaget håller sig under 30°C och inte har direkt solljus. De flesta garage överstiger 40°C på sommaren.
    - q: Ska jag förvara min SUP i väskan?
      a: Ja, påsen skyddar mot damm, UV, och fysiska skador. Se till att brädan är helt torr innan den läggs i påsen.
    - q: Kan frysning skada en uppblåsbar SUP?
      a: Ja. Under fryspunkten blir PVC sprött och kan spricka när det rullas ut eller fylls med luft. Förvara alltid över 5°C.
    - q: Hur ska jag rulla min SUP för förvaring?
      a: Rulla med däckplattan vänd utåt för att skydda botten PVC. Undvik skarpa veck. Växla vikposition varje gång.
