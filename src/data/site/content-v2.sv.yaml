    - q: Är västen bekväm för långvarigt bruk?
      a: Skumpanelerna är formade för att minska bulk. Meshdräneringen och den justerbara passformen förbättrar komforten vid längre användning.
    - q: Kan barn använda den här västen?
      a: Inte för små barn. Denna väst är avsedd för vuxna och ungdomar över 40 kg. Aquafarer rekommenderar barnsäkra PFDs för yngre användare.
