- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Vad man ska ha på sig för surfing (Kom inte i badeshorts när du behöver en 5/4)
  description: Sluta gissa vad du ska ha på dig. Vattentemperaturen, inte lufttemperaturen, avgör din surfutrustning. Komplett lager-på-lager-guide från tropiska rash guards till fulla vinteruppsättningar 5/4/3mm.
  definition: Surfkläder varierar från boardshorts och rashguards i varmt vatten till fulla 5/4/3mm våtdräkter med stövlar och huvor i kallt vatten. Vattentemperaturen, inte lufttemperaturen, avgör vad du behöver.
  tldr: Vad du har på dig när du surfar beror helt på vattentemperaturen — inte lufttemperaturen. Rashguards och boardshorts fungerar vid över 22°C, springsuits täcker 18-22°C, fulla 3/2mm-dräkter klarar 14-18°C, och 5/4/3mm med stövlar krävs under 14°C. Använd alltid UV-skydd och överväg koppel och impact-vest.
  problem: Du anländer till stranden och har ingen aning om en rash guard räcker eller om du behöver en full våtdräkt. Lufttemperaturen är varm men vattnet är kallt, eller vattnet känns okej men vinden är iskall. Fel klädsel innebär en förstörd session.
  explanation: 'Surfingkläder har tre syften: termisk isolering, UV-skydd och slitageskydd. Neoprenvåtdräkter klassificeras efter tjocklek och täckning — vårdräkter (kort ärm eller ben) är för dagar på gränsen, fulla dräkter för kallt vatten. Rash guards skyddar mot brädeskavsår och sol men ger inget termiskt värde. Stövlar, handskar och huvor är inte tillbehör utan nödvändig utrustning för surfning i kallt vatten under 12°C.'
  solution: 'Kontrollera den lokala bojen eller rapporten om vattentemperatur innan du ger dig ut. Bygg ett kit baserat på dina kallaste vanliga förhållanden: rashguard och shorts för sommaren, en 3/2 mm heldräkt för våren och hösten, en 5/4/3 mm med stövlar och huva för vintern. Lägg alltid till ett leash och överväg en flytväst för säkerheten.'
  recommendation: Investera först i en bra 3/2 mm helvåtdräkt — den täcker det bredaste spektrumet av förhållanden. Lägg till en 5/4/3 mm dräkt och stövlar om du planerar att surfa under vintern. Aquafarer Wetsuit Pro med termiskt foder täcker båda temperaturområdena effektivt.
  faq:
    - q: Kan jag surfa bara i baddräktshorts?
      a: Ja, i tropiskt vatten över 24°C. Du kan vilja ha en rashguard för att förhindra skavsår på bröst och armar från paddling. Vax eller en greppdyna på brädan hjälper till att kompensera bristen på grepp från dräkten.
    - q: Behöver jag surfskor?
      a: Om vattentemperaturen sjunker under 14°C förhindrar stövlar domningar och skyddar dina fötter från stenar och revsår. De ger också bättre grepp på brädan. De flesta surfare i norra klimat använder stövlar från november till mars.
    - q: Vad är en vårdräkt?
      a: En vårdräkt är en våtdräkt med korta ärmar eller korta ben (eller båda) som är designad för vatten mellan 18°C och 22°C. Den erbjuder mer värme än en rashguard men mindre täckning än en hel dräkt.
    - q: Ska jag bära en flytväst när jag surfar?
      a: Inte traditionella flytvästar, men en stötdämpande väst eller flythjälpmedel kan hjälpa i tuffa förhållanden eller om du är en svag simmare. Aquafarer flytvästar är utformade för SUP och kajakpaddling men kan ge extra flytförmåga för surfnybörjare.
