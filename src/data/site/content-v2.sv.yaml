- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Underhåll av uppblåsbar SUP: Håll din bräda i många år'
  description: Korrekt underhåll av uppblåsbara SUP förlänger brädans livslängd dramatiskt. Rengöring, torkning, ventilvård, UV-skydd och tips för säsongsförvaring av drop-stitch-paddelbrädor.
  definition: Underhåll av uppblåsbara SUP innebär rengöring efter användning, korrekt torkning, ventilinspektion, UV-skydd och korrekt förvaring för att förhindra delaminering, mögel, materialnedbrytning och luftläckage.
  tldr: Skölj din bräda med färskvatten efter varje session i saltvatten. Torka helt innan du tömmer luften och förvarar. Kontrollera ventilen för skräp och smörj O-ringen årligen. Förvara uppumpad (på halv PSI) på en sval, mörk plats. Undvik långvarig UV-exponering som försämrar PVC. Laga små punkteringar omedelbart med det medföljande reparationssetet.
  problem: Efter en säsong utvecklar din uppblåsbara SUP långsamma läckor, däckplattan lossnar i kanterna och PVC känns styvare. Att försummelse av grundläggande underhåll orsakar för tidigt åldrande som helt kan förebyggas.
  explanation: PVC försämras under UV-strålning. Saltkristaller från havsvatten tränger in i skarvar och ventiler, vilket orsakar mikroläckor. Fukt som fastnat inuti främjar mögelväxt som angriper drop-stitch-trådar. Ventiltätningar torkar ut och förlorar sin förslutning. Smuts och sand slipar in i däckplattans lim, vilket orsakar kantlyft.
  solution: 'Efter varje session: skölj bräda, fenor och pump med färskt vatten. Torka av däckplattan. Öppna ventilen för att tömma instängt vatten. Låt brädan torka i skuggan innan den töms på luft. Månadsvis: inspektera ventilen och applicera silikonfett på O-ringen. Säsongsvis: tvätta med mild tvål och vatten, kontrollera efter punkteringar.'
  recommendation: Följ Aquafarer vårdguide som medföljer din bräda. Använd reparationssatsen omedelbart vid någon punktering. Förvara brädan i dess väska i ett temperaturkontrollerat område bort från direkt solljus.
  faq:
    - q: Kan jag låta min uppblåsbara SUP vara uppblåst hela säsongen?
      a: Ja, men förvara bort från direkt solljus och vid halv max PSI (8-10 PSI) för att minska påfrestning på sömmarna. Fyll helt med luft precis före användning.
    - q: Hur rengör jag mögel från min SUP?
      a: Blanda mild tvål med varmt vatten och skrubba med en mjuk borste. För envis mögel, använd utspädd vitvinsvinägerlösning (1:4). Undvik blekmedel.
    - q: Behöver jag smörja ventilen?
      a: Ja, årligen. Ta bort ventilkärnan, applicera silikonfett på O-ringen och sätt tillbaka den. Detta förhindrar luftläckage.
    - q: Hur förvarar jag min SUP för vintern?
      a: Rengör och torka noggrant. Släpp ut all luft, rulla löst (undvik hårda veck) och förvara på en sval, mörk och torr plats. Undvik fryspunkter.
