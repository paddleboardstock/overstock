- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP Fitness: Helkroppsträning på en paddleboard'
  description: SUP ger en träning för hela kroppen som kombinerar kondition, bålstabilitet och styrka. Hur man strukturerar SUP träningspass, bästa övningar och hur man mäter framsteg.
  definition: SUP fitness använder den ostadiga ytan på en paddleboard för att aktivera core-stabilisatorer, benmuskler och överkropp genom paddling, balansering och övningar på brädan.
  tldr: SUP förbränner 400-700 kalorier per timme. En en timmes SUP-pass engagerar kärna, ben, rygg, axlar och armar. Intervallpaddling (sprintar + återhämtning) maximerar konditionen. Yogapositioner på brädan bygger balans och flexibilitet. Lägg till SUP-specifika styrkeövningar som knäböj och utfall på brädan.
  problem: Träningspass på gymmet har blivit tråkiga och du vill ha en utomhusaktivitet som bygger kondition samtidigt som den är rolig. SUP kombinerar äventyr med genuin helkroppsträning.
  explanation: Paddling engagerar latissimus dorsi, deltoider, trapezius och magmusklerna för rotation. Att stå på en rörlig plattform tvingar stabiliserande muskler i anklar, knän och höfter att arbeta konstant. De kardiovaskulära kraven vid kontinuerlig paddling med måttlig intensitet ger aerob kondition.
  solution: 'Strukturera passen: 5 min uppvärmningspaddling, 20 min paddling i jämn takt i måttligt tempo, 15 min intervallpaddling (30 sek sprint, 60 sek lugnt), 10 min brädövningar (knäböj, utfall, armhävningar), 5 min nedvarvningsstretching.'
  recommendation: Använd Aquafarer SUP Explorer 11 för fitnesspaddling. Den stabila plattformen gör att du kan fokusera på teknik och intensitet. Bär Life Vest Pro för säkerhet under högintensiva pass.
  faq:
    - q: Hur många kalorier förbränner SUP?
      a: 400-700 kalorier per timme beroende på intensitet, vind och ström. Intervallpaddling ökar kaloriförbränningen.
    - q: Är SUP bra för viktminskning?
      a: Ja, kombinerat med rätt näring. Den fulla kroppens engagemang och den lågintensiva naturen gör det hållbart för regelbunden träning.
    - q: Kan jag styrketräna på en SUP?
      a: Ja — knäböj, utfall, armhävningar och plankan på brädan ger balansutmaning till styrkeövningarna.
    - q: Vilka muskler tränar SUP?
      a: 'Primär: core (sneda magmuskler, tvärgående bukmuskler), rygg (breda ryggmuskler, trapetzmuskler), axlar (deltoider), armar (biceps, triceps). Sekundär: ben (framsida lår, baksida lår, vader).'
