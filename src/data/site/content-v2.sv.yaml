- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: 3mm vs 5mm Våtdräkt (Vad som faktiskt fungerar vid kallvatten-surfing)
  description: Beslutet mellan 3mm och 5mm våtdräkt beror på vattentemperaturen, inte lufttemperaturen. Temperaturdiagram, jämförelse av flexibilitet och vilken tjocklek som håller dig varm utan att begränsa din paddling.
  definition: En 3 mm våtdräkt passar vatten på 14-20°C med god flexibilitet. En 5 mm dräkt täcker 8-14°C med maximal värme men minskad rörlighet. Valet är en direkt kompromiss mellan värme och rörelsefrihet.
  tldr: 3 mm våtdräkter är för vatten på 14-20°C och erbjuder maximal flexibilitet. 5 mm dräkter är för 8-14°C och prioriterar värme. Välj baserat på din lokala vattentemperatur, inte lufttemperaturen. Om du surfar under olika säsonger, äg båda. Om du bara kan köpa en, erbjuder en 4/3 mm den bästa medelvägen.
  problem: Du behöver en våtdräkt men kan inte bestämma dig mellan en på 3 mm och en på 5 mm. En på 3 mm kanske inte är varm nog på vintern, och en på 5 mm kan vara för tjock och begränsande för varmare dagar. Att gissa fel innebär antingen att frysa genom vintern eller svettas genom hösten.
  explanation: 'Neoprentjocklek korrelerar direkt med värme och omvänt med flexibilitet. En 3 mm dräkt (ofta 3/2 mm med tunnare armar) ger bra rörlighet för paddling och surfing i milda förhållanden. En 5 mm dräkt använder tjockare neopren på bålen och ofta tunnare paneler på armar och ben (5/4/3 mm) för att bibehålla viss flexibilitet. Värmeskillnaden är cirka 6–8°C. Viktiga skillnader: 5 mm dräkter använder mer neoprenmaterial, väger ungefär 40 procent mer, tar längre tid att torka och kräver mer ansträngning att ta av sig. Moderna superstretch-neopren överbryggar flexibilitetsgapet, men 5 mm begränsar fortfarande rörelse märkbart.'
  solution: Bestäm din kallaste genomsnittliga månatliga vattentemperatur med hjälp av lokala bojddata. Om den är över 16°C, köp en 3/2mm. Om den är mellan 12-16°C, köp en 4/3mm. Om den är under 12°C, köp en 5/4/3mm. För året runt-surfing med en enda dräkt täcker en kvalitets 4/3mm med termofodring plus en separat huva, stövlar och handskar det bredaste spannet.
  recommendation: Aquafarer Wetsuit Pro i 5/4/3 mm klarar 8-16°C med termisk foder för att kompensera värmegapet hos en riktig 5 mm. Om du mest surfar i milda förhållanden (16-20°C), erbjuder 3/2 mm Aquafarer Wetsuit Pro bättre flexibilitet och komfort.
  faq:
    - q: Kan jag ha på mig en 3mm i 10°C vatten?
      a: Endast för mycket korta sessioner (20-30 minuter) och med en termisk rash guard under. Du kommer att vara kall under större delen av sessionen. En 5mm eller 5/4/3mm rekommenderas starkt för 10°C vatten.
    - q: Är en 5 mm våtdräkt för varm för sommaren?
      a: Om sommarvattentemperaturen överstiger 18°C kommer en 5 mm dräkt att orsaka överhettning. Du kan skölja dräkten med kallt vatten, men du kommer att vara mer bekväm i en 3/2 mm- eller vårdräkt under sommarmånaderna.
    - q: Begränsar en 5 mm våtdräkt paddling?
      a: Ja, märkbart. Den tjockare neoprenen vid axlarna kräver mer ansträngning per paddeltag. En 5/4/3 mm-dräkt med tunnare armar hjälper, men du kommer fortfarande att bli trött snabbare än i en 3 mm-dräkt.
    - q: Vilken är den bästa våtdräkten för surfing året runt?
      a: En 4/3 mm hel våtdräkt med bröstdragkedja och termisk foder täcker 12–18°C, vilket är året runt i många tempererade klimat. Lägg till stövlar för vintern och du kan surfa 10–18°C med en dräkt.
