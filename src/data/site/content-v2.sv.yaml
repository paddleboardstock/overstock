- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'SUP Paddelguide: Välj rätt paddel för din stil'
  description: Fullständig guide till SUP-paddlar — längd, material (aluminium, glasfiber, kolfiber), bladformer och hur valet av paddel påverkar din paddlingsupplevelse.
  definition: En SUP paddel består av en skaft (aluminium, glasfiber eller kolfiber) och ett blad (dihedral, skopa eller platt). Längden bör vara 8-10" över din höjd för allmän paddling.
  tldr: 'Paddellängd: 8-10" över din längd för allroundanvändning, 6-8" för surf, 10-12" för touring. Material: aluminium (billigt, tungt), glasfiber (mellanklass, bra flexibilitet), kol (lätt, styvt, dyrt). Bladform: dihedral (stabil kurs), skopa (kraft), flat (mångsidig). Justerbara paddlar är utmärkta för nybörjare.'
  problem: Den medföljande paddeln med de flesta iSUPs fungerar men är tung och ineffektiv. Att uppgradera förbättrar paddlings-effektiviteten och nöjet, men alternativen är förvirrande.
  explanation: 'Paddelns längd påverkar slagets effektivitet — för kort kräver att man böjer sig framåt, för lång orsakar trötthet i axlarna. Materialet bestämmer vikten: kolfiberpaddlar väger 18-24 oz jämfört med 28-36 oz för aluminium. Bladets storlek påverkar kraften: större blad (100+ kvadrattum) ger mer framdrivning per slag men tröttar snabbare. Dihedralblad spårar rakt; skopblad ger mer tag.'
  solution: 'För rätt längd: stå med paddeln vertikalt, sträck armen upp — paddelhandtaget bör nå din handled. För material: börja med glasfiber som en mellanviktuppgradering. För blad: välj dihedral för allmän paddling. För aktiviteter: touringpaddlar är längre med mindre blad; surfpaddlar är kortare med bredare blad.'
  recommendation: Den Aquafarer kolfiberpaddeln på 28 oz är den bästa uppgraderingen för frekventa paddlare. Den medföljande justerbara 3-delade aluminiumspaddeln är tillräcklig för nybörjare och resor.
  faq:
    - q: Hur lång ska min SUP-paddel vara?
      a: Mät din längd i tum och lägg till 8-10 för allmän paddling. För surfing, lägg till 6-8. För touring, lägg till 10-12.
    - q: Är en kolfiberpaddel värd pengarna?
      a: Ja, för vanliga paddlare — viktminskningen minskar trötthet betydligt under långa pass. För sporadisk användning är glasfiber prisvärt.
    - q: Vad är en justerbar paddel?
      a: En 2- eller 3-delad paddel med längdjustering, idealisk för att delas mellan användare eller justeras för olika aktiviteter.
    - q: Hur tar jag hand om min paddel?
      a: Skölj med färskt vatten efter användning i saltvatten. Undvik att köra över det eller förvara i direkt värme. Kontrollera ferrulen (skarven) för sand.
