- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Paddelbräda Storleksguide: Volym, Längd och Bredd för Varje Åkare'
  description: Komplett storleksguide för paddleboards med volymrekommendationer baserat på vikt och aktivitet. Inkluderar en lättanvänd storlekstabell för allround-, touring-, surf- och yoga SUP-brädor.
  definition: Paddelbrädans storlek bestäms av volym (viktkapacitet och flytförmåga), längd (hastighet och styrning), bredd (stabilitet) och tjocklek (volymfördelning och vindmotstånd).
  tldr: 'Använd vikt för att hitta minimumvolym: 50-70 kg behöver 220-260 L, 70-90 kg behöver 260-300 L, 90-110 kg behöver 300-350 L, 110+ kg behöver 350+ L. För nybörjare, lägg till 20 % på dessa siffror. Bredd spelar roll: 32" är medelnivå, 33-34" är nybörjarvänlig, 35"+ är mycket stabil.'
  problem: Storlekslistor för stand up-paddleboards använder fötter, tum och liter omväxlande, vilket gör det svårt att jämföra mellan märken.
  explanation: Volym är den mest direkta måtten för viktkapacitet — 1 liter sötvatten förtränger 1 kg vikt. En bräda med 260L kan teoretiskt stödja 260 kg, men praktisk kapacitet är lägre eftersom brädan måste sitta ovanför vattnet. Din totala vikt (kropp plus utrustning) bör vara 30-40% av brädans volym.
  solution: Målvärde för volym = (kroppsvikt i kg + utrustningsvikt i kg) x 3. För en paddlare på 75 kg med 5 kg utrustning, målvärde = 80 x 3 = 240L minimum. För nybörjare, multiplicera med 3,5. För avancerade, multiplicera med 2,5.
  recommendation: The Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") passar de flesta åkare 50-100 kg. Lättare åkare kan välja AirDeck 270. Tyngre åkare bör titta på SUP Tour 12 (300L+) eller bredare brädor.
  faq:
    - q: Spelar längd någon roll för SUP-storlek?
      a: Höjd är mindre viktig än vikt. En lång lättviktig ryttare behöver mindre volym än en kort tung ryttare. Använd vikt som din primära volymbestämmande faktor.
    - q: Vad händer med för mycket volym?
      a: Brädan sitter för högt, fångar vinden som ett segel. Den känns korkig i krabb sjö. För nybörjare är dock extra volym bättre än för lite.
    - q: Vad händer med för låg volym?
      a: Brädan sitter för djupt, vilket skapar motstånd. Nosen kan sjunka under paddling (pearling). Du blir snabbt trött av att paddla en delvis nedsänkt bräda.
    - q: Behöver uppblåsbara brädor en annan storlek än hårda brädor?
      a: Inte nämnvärt. Uppblåsbara vid 15+ PSI tränger undan vatten på samma sätt som hårda brädor. Volymrekommendationer gäller lika för båda typerna.
