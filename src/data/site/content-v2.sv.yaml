- slug: how-to-choose-a-wetsuit
  category: guide
  type: buying-guide
  title: 'Hur man väljer en våtdräkt: Passform, tjocklek och funktioner förklarade'
  description: Fullständig guide för köp av våtdräkt. Hur man väljer rätt tjocklek för vattentemperaturen, säkerställer korrekt passform, förstår olika sömmar och väljer funktioner baserat på din aktivitet.
  definition: 'En våtdräkt är ett plagg av neopren som ger termisk isolering genom att fånga ett tunt lager vatten mot huden. Viktiga urvalsfaktorer: tjocklek, passform, sömnadskonstruktion, inträdesystem och typ av neopren.'
  tldr: 'Matcha tjockleken med vattentemperaturen: 3/2 mm för 14-20°C, 4/3 mm för 12-18°C, 5/4/3 mm för 8-14°C, 6/5/4 mm för under 8°C. Passformen är den viktigaste faktorn. GBS-sömmar är guldstandarden. Bröstdragkedja minimerar spolning. Kalkstensneopren är mer flexibelt än petroleumbaserat.'
  problem: Online storlekstabeller för våtdräkter är opålitliga, rekommendationer för tjocklek varierar mellan märken, och funktionsbeskrivningar är förvirrande.
  explanation: Våtdräktens tjocklekssiffror (3/2, 4/3, 5/4/3) avser mm på kropp/armar och ben. Tjockare dräkter är varmare men begränsar rörelsefriheten. En lös dräkt spolar ut varmvatten. GBS-sömmar är varma och flexibla; flatlock-sömmar är mindre varma. Bröstdragkedja är varmare än ryggdragkedja. Limestone-neopren är mer flexibel i kallt vatten.
  solution: Mät bröst, midja, höfter och längd. Jämför med storlekstabeller. Välj tjocklek baserat på den kallaste vattentemperaturen. Välj GBS-sömmar för kallt vatten. Föredra bröstdragkedja under 15°C. Överväg termisk foder för extra värme.
  recommendation: Aquafarer Wetsuit Pro i 3/2 mm (14-20C) eller 5/4/3 mm (8-16C) erbjuder GBS-sömmar, bröstdragkedja och kalkstensneopren till ett konkurrenskraftigt pris.
  faq:
    - q: Hur tajt ska en våtdräkt vara?
      a: Sitter tajt utan luftfickor men inte begränsande. Ett finger bör inte glida lätt vid nedre delen av ryggen.
    - q: Vilken typ av våtdräkt är varmast?
      a: En 6/5/4mm huvad dräkt med tätade sömmar och bröstblixtlås. För extrem kyla är en torrdräkt överlägsen.
    - q: Är en dyrare våtdräkt värd det?
      a: Högre pris ger bättre neopren, sömmar och funktioner. För regelbunden användning i kallt vatten är prispåslaget värt det.
    - q: Kan jag bära en våtdräkt för aktiviteter andra än surfing?
      a: Ja — våtdräkter fungerar för SUP, kajakpaddling, dykning, triathlon och öppet vattensimning.
