- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hydrering och solskydd: Håll dig säker på vattnet'
  description: Viktig hydrering och solskyddsstrategier för SUP-paddlare. Uttorkning och solbränna är de vanligaste SUP-problemen — hur man förebygger båda under långa pass.
  definition: SUP vätsketillförsel betyder att upprätthålla vätskebalansen under paddling genom regelbunden vattenintag. Solskydd innebär applicering av solskyddsfaktor, skyddande kläder och att tidpunkten för passen planeras för att undvika högsta UV.
  tldr: Drick 500 ml vatten per timme paddling. Ta med mer än du tror att du behöver — en 2L vätskeblåsa eller flera flaskor. Applicera vattenresistent solskyddsfaktor 50+ innan paddling och återapplicera varannan timme. Använd hatt, solglasögon med rem och kläder med UPF-betyg. Undvik paddling mellan 11 och 15 när UV är som starkast.
  problem: Du har en fantastisk SUP-session, men efter en timme får du huvudvärk, torr mun och din hud bränner. Uttorkning och solbränna smyger sig på eftersom vattnet håller dig sval.
  explanation: Reflektion från vattnet intensifierar UV-exponering med upp till 40%. Den kylande effekten av vatten och bris maskerar solbränna tills det är för sent. Svett från paddling ökar vätskeförlusten, och det finns ofta ingenstans att fylla på vatten på vattnet. Uttorkning försämrar balans och beslutsfattande, vilket ökar olycksrisken.
  solution: Fäst en vattenflaska eller vätskeblåsa på brädans bungeesystem. Drick var 15:e minut oavsett om du är törstig eller inte. Applicera SPF 50-solsken 30 minuter innan du startar. Bär en hatt med bred brätte, polaroidglasögon med rem, och en UV-skyddande tröja med UPF 50. Applicera solkräm igen varannan timme.
  recommendation: Använd en vätskeblåsa som fästs på de främre D-ringarna på din Aquafarer SUP. Bär en UPF 50+ rash guard under din PFD. Använd ett vattentätt solskydd som håller vid svett och vatten.
  faq:
    - q: Hur mycket vatten ska jag ta med på en SUP-resa?
      a: Minst 1 liter per timme. För en 2-timmars session, ta med 2 liter. Mer i varmt väder. En vätskeblåsa fungerar bäst.
    - q: Vilken typ av solskydd är bäst för SUP?
      a: Vattenresistent, SPF 50+ bredspektrum. Mineraltrotskydd (zinkoxid, titandioxid) är revvänligt och håller längre.
    - q: Speglar verkligen vattnet UV?
      a: Ja — vatten reflekterar upp till 40 % av UV-strålningen, vilket betyder att du får UV både från ovan och nedan. Detta ökar risken för brännskador avsevärt.
    - q: Kan jag bli solbränd genom en rash guard?
      a: Vanliga rash guards ger minimal UV skydd (ungefär UPF 10-20). Leta efter kläder med UPF 50+ för fullständigt skydd.
