- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Ankarguide: Stanna på plats medan du fiskar eller fotograferar'
  description: Komplett guide till SUP-ankring — ankartyper (svamp, fällbar, påle), uppsättning av ankarskena, utplaceringsmetoder och säkerhetsaspekter för att hålla position.
  definition: En SUP ankare är en vikt fäst vid ett rep som håller brädan på plats mot vind och ström. Vanliga typer inkluderar svampankare, fällbara ankare och pålstakar.
  tldr: Använd ett svampankare (1,5-3 lb) för leriga eller sandiga bottnar, ett vikbart ankare för steniga bottnar, eller en stake-out-stång för grunt vatten med mjuk botten. Ankaret bör vara 1,5-3 lb för lugna förhållanden, 3-5 lb för vind och ström. Använd alltid en ankarturly för att justera positionen och veta när du ska släppa.
  problem: Du hittar den perfekta fiskeplatsen men vinden och strömmen för dig ur position var några minuter. Utan att ankra är SUP fiske och fotografering frustrerande övningar i ständig ompositionering.
  explanation: En ankare fungerar genom att dras över botten tills den fastnar. Svampankare gräver ner sig i mjuka bottnar och ger bra fäste i sand och lera. Fällbara ankare har flikar som gräver ner sig i hårda eller steniga bottnar. Pålar för utsättning fungerar i grunt vatten genom att tryckas direkt ner i botten.
  solution: Installera ett ankarskenesystem (en lina med en glidringsanordning på ena sidan av brädan) för att justera ankarets fästpunkt. Fäst 50-75 fot rep vid ankaret. Placera dig uppströms eller mot strömmen från din önskade position. Använd ett snabbkopplingssystem för att frigöra vid nödsituationer. Ankra aldrig i stark ström eller där du inte enkelt kan dra upp ankaret.
  recommendation: Ett 3 lb fällbart ankare med 50' rep fungerar för de flesta SUP fiskeförhållanden. Lägg till ett ankartåg-system med hjälp av D-ringarna på din Aquafarer SUP Explorer 11.
  faq:
    - q: Vilken storlek på ankare behöver jag för SUP?
      a: 1,5-3 lb för lugna sjöar och långsamma floder. 3-5 lb för kustområden med vind eller ström. Överdimensionerade ankare är svåra att återta.
    - q: Hur mycket ankarlina behöver jag?
      a: En 5:1-utväxling (5 fot lina för varje 1 fot djup) är standard. I 10 fot vatten, använd 50 fot lina.
    - q: Är förtöjning farligt på en SUP?
      a: Endast om du förtöjer i ström eller vind tillräckligt stark för att kapsejsa brädan. Använd alltid ett snabbkopplingssystem som kan frigöras omedelbart.
    - q: Kan jag ankra i vilket vatten som helst?
      a: Kontrollera lokala regler. Vissa områden begränsar förtöjning för att skydda sjögräs eller marina livsmiljöer. Förtöj aldrig på korallrev.
