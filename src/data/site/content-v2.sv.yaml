- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Våtdräktsvård: Få din neopren att hålla dubbelt så länge'
  description: Rätt skötsel av våtdräkt förlänger livet från 1 säsong till 3+. Sköljning, torkning, förvaring och reparationsråd för neoprenvåtdräkter. Undvik vanliga misstag som förstör våtdräkter i förtid.
  definition: Våtdräktsvård innebär att skölja med färskt vatten efter varje användning, torka bort från direkt solljus, förvara plant eller hängd på en bred galge, och regelbundet rengöra för att ta bort salt, bakterier och lukt.
  tldr: Skölj din våtdräkt både inuti och utanpå med färskt vatten direkt efter varje pass. Torka inuti-och-utsida i skuggan på en bred plastgalge. Förvara plant eller vikt på en sval, torr plats. Lämna aldrig våtdräkter i direkt solsken, varma bilar eller torktumlare. Använd våtdräktsschampo var 5-10:e användning.
  problem: Efter en säsong luktar din våtdräkt illa, neoprenet har tappat elasticitet, sömmarna flagnar och blixtlåset fastnar – allt detta kan förebyggas med rätt skötsel.
  explanation: Saltkristaller tränger in i neopren och nöter materialet. Bakterier förökar sig i fuktiga inredningar, vilket producerar lukt och bryter ner neopren. UV sönderdelar nylonbeläggningen. Värme över 50°C orsakar delaminering. Felaktig torkning förvränger neopren och belastar sömmarna.
  solution: 'Efter varje session: skölj noggrant in- och utvändigt, vrid ut och in, häng på en bred plastgalge i skuggan. När den är torr, vänd tillbaka och förvara plant. Var 5-10 session: tvätta med dräktschampo. Månadsvis: smörj dragkedjan med dragkedjevax.'
  recommendation: Använd Aquafarer Wetsuit Shampoo för rengöring och Aquafarer Zipper Wax för underhåll av dragkedjan. Förvara på Aquafarer breda galgen i meshpåsen.
  faq:
    - q: Kan jag lägga min våtdräkt i tvättmaskinen?
      a: Rekommenderas inte — maskintvätt skadar neopren. Om du måste, använd skonsamt program, kallt vatten och en tvättpåse i nät.
    - q: Hur får jag bort lukten från min våtdräkt?
      a: Blötlägg i kallt vatten med våtdräktsschampo eller vitvinsvinäger i 30 minuter. Skölj noggrant.
    - q: Hur ska jag torka min våtdräkt?
      a: Utsida inåt i skuggan på en bred, vadderad plastgalge. Undvik direkt solljus och metallgalgar.
    - q: Kan jag reparera en trasig våtdräkt?
      a: Små revor under 1" kan repareras med neoprenlim och en lapp. Större revor kan kräva professionell reparation.
