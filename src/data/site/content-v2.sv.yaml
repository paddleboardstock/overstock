- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Våtdräktsreparation: Fixa revor, sömmar och dragkedjor själv'
  description: Gör-det-själv-guide för reparation av våtdräkt för neoprenrevor, sömsönderfall, dragkedjehaverier och delade knäskydd. Steg-för-steg-instruktioner med neoprenlim.
  definition: Reparation av våtdräkt innebär att rengöra och rugga upp det skadade området, applicera neoprenlim och härda under tryck för att återställa vattentät integritet och flexibilitet.
  tldr: 'Små revor under 1": applicera neoprenlim på båda sidor, vänta 10–15 minuter tills det blir klibbigt, tryck fast ordentligt, härda under vikt i 12 timmar. Större revor behöver en neoprenlapp. Dragkedjeproblem: smörj först, kontrollera sedan om det finns tyg som fastnat.'
  problem: Din våtdräkt har ett litet hål, en söm som separerar eller en dragkedja som fastnar. Utan gör-det-själv-reparation betalar du $150+ för en ersättning när lagningen kostar $5.
  explanation: Neoprencement fungerar genom att mjuka upp ytan på neoprenet och skapa en kemisk bindning när lösningsmedlet avdunstar. Cement måste appliceras på båda ytorna och bli klibbig innan sammanfogning. Vid revor måste kanterna ligga exakt mot varandra. Problem med dragkedjan beror ofta på saltkorrosion eller tyg som fastnat i tänderna.
  solution: 'För tårar: rengör med alkohol, slipa lätt, applicera ett tunt lager cement på båda kanterna, vänta tills det blir klibbigt, tryck ihop perfekt, applicera vikt, härda i 12-24 timmar. För lappar: skär lappen 1" större än tåran, applicera cement på båda, kläm fast. För dragkedja: skölj, applicera dragkedjevax, arbeta försiktigt.'
  recommendation: Ha ett Aquafarer reparationskit för våtdräkt i din utrustningspåse. För större reparationer eller sömfel vid kritiska punkter rekommenderas professionell reparation.
  faq:
    - q: Kan jag använda superlim på en våtdräkt?
      a: Nej — superlim torkar hårt och sprött. Använd endast neoprenlim eller Aquaseal för reparationer av våtdräkter.
    - q: Hur länge håller en neoprenlim-reparation?
      a: En korrekt utförd reparation är ofta starkare än den ursprungliga neoprenen och varar under dräktens återstående livslängd.
    - q: Kan jag reparera en dragkedja som har helt separerat?
      a: Om dragkedjan har lossnat från neopren, limma igen med kontaktlim. Om tänderna är skadade, byt ut dragkedjan professionellt.
    - q: Hur fixar jag en våtdräkt som läcker vid sömmen?
      a: Applicera en tunn sträng av aquaseal längs insidan av den läckande sömmen och låt den härda i 24 timmar.
