cards:
  - badge: PVC
    title: Tengerészeti minőségű PVC réteg
    description: Többrétegű laminált PVC szövet, amely megfelel a tengeri környezet követelményeinek. Tesztelve UV, kopás- és átszúrás-állóság szempontjából.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch mag
    description: Több ezer belső szál köti össze a felső és alsó réteget, létrehozva egy merev, magas nyomású szerkezetet 12–15 PSI.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Megerősített élű sínszegély
    description: Kétrétegű, olvasztással hegesztett sín véd a dokkolási karcolások, a tengerparti leszállások és az oldalsó ütközések ellen.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
