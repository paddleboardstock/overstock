badge: Proof & Quality
heading: หลักฐาน
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: คลังสินค้าคลียร์แรนซ์, การควบคุมคุณภาพระดับร้านค้า
    product: ทุกบอร์ดสินค้าคงเหลือถูกตรวจสอบซ้ำ
    industry: การควบคุมคุณภาพ
    challenge: บอร์ดสินค้าคงเหลือและคลียร์แรนซ์มาจากการผลิตส่วนเกิน ดังนั้นผู้ซื้อจึงถามอย่างถูกต้องว่าบอร์ดราคาลดแล้วผ่านการตรวจสอบเหมือนบอร์ดราคาปกติหรือไม่
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: อัตราการชำรุด 99.3% ของการจัดส่งออกใน 12 เดือนที่ผ่านมา — มาตรฐานเดียวกันนี้ใช้กับสินค้าคลียร์แรนซ์และสต็อกขายปลีก
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: อัตราปราศจากข้อบกพร่อง
        value: 99.3%
      - label: ความครอบคลุมการทดสอบแรงดัน
        value: 100%
      - label: ระยะเวลาการถือครอง
        value: 24-48h
  - id: pressure-test-regime
    client: การถือแรงดัน 24-48 ชั่วโมง
    product: ทุกช่อง 1.25 เท่าของแรงดันที่ระบุ
    industry: การทดสอบผลิตภัณฑ์
    challenge: บอร์ด SUP จะดีหรือเสียชีวิตขึ้นอยู่กับแกนและรอยต่อ drop-stitch ของมัน และการตรวจสอบการพองตัวอย่างรวดเร็วตอนจบสายการผลิตไม่เพียงพอที่จะจับการรั่วช้าๆ หรือรอยเชื่อมอ่อน
    solution: บอร์ดทุกชิ้นถูกพองถึงแรงดัน 1.25 เท่าของแรงดันที่ระบุและถือค้างไว้ 24-48 ชั่วโมง โดยการลดแรงดันต้องไม่เกิน 5% วาล์ว, D-ring, รอยต่อ และแรงลอยตัวถูกตรวจสอบโดยไม่มีการยอมข้อบกพร่องด้านความปลอดภัย
    result: 100% ของการผลิตผ่านมาตรการนี้ก่อนบรรจุ — ไม่มีการสุ่มตัวอย่าง ไม่มีข้อยกเว้น
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - แรงดัน 1.25 เท่า
      - ศูนย์ข้อบกพร่องด้านความปลอดภัย
    outcome_metrics:
      - label: แรงดันทดสอบ
        value: 1.25x
      - label: การลดลงของความดันสูงสุด
        value: <5%
      - label: หน่วยที่ทดสอบ
        value: 100%
  - id: warranty-claims-support
    client: การรับประกันที่ตอบโจทย์
    product: การรับประกัน 2 ปีสำหรับบอร์ด SUP และอุปกรณ์เสริม
    industry: หลังการขาย
    challenge: การซื้อสินค้าล้างสต็อกตรงจากโรงงานทำให้เกิดคำถามที่สมเหตุสมผล — ถ้ามีปัญหาเกิดขึ้นหลังจากหลายเดือน ใครจะเป็นคนจัดการ?
    solution: กระดานทุกชิ้นมาพร้อมกับการรับประกัน 2 ปี ครอบคลุมกระดาน SUP รอยต่อ drop-stitch วาล์วเติมลม และอุปกรณ์เสริม การเคลมจะส่งตรงไปยังทีมของเรา — ส่งรูปถ่ายหรือวิดีโอสั้น ๆ แล้วเราจะดำเนินการต่อ
    result: คำร้องขอรับประกันจะได้รับการตรวจสอบและแก้ไขโดยทีมเดียวกันกับที่ตรวจสอบการผลิต — ไม่มีการโยนไปยังตัวแทนจำหน่าย
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - การรับประกัน 2 ปี
      - การสนับสนุนโดยตรง
      - ครอบคลุมอุปกรณ์เสริม
    outcome_metrics:
      - label: การรับประกัน
        value: 2 ปี
      - label: ความคุ้มครอง
        value: กระดาน + อุปกรณ์เสริม
      - label: สนับสนุน
        value: ทีมโดยตรง
