badge: Proof & Results
heading: หลักฐาน
description: กรณีศึกษาจริง ใบรับรอง ข้อมูลการทดสอบ และภาพถ่ายการนําไปใช้งานที่แสดงให้เห็นถึงศักยภาพการผลิตและคุณภาพของสินค้าของเรา
case_studies:
  - id: retail-private-label
    client: ผู้ค้าปลีกกลางแจ้งยุโรป
    product: สายผลิตภัณฑ์แบรนด์ส่วนตัวSUP
    industry: ค้าปลีก
    challenge: ผู้ค้าปลีกกลางแจ้งในยุโรปต้องการไลน์สินค้าแบรนด์ส่วนตัวSUPที่มีกราฟิกระเบียงที่เป็นเอกลักษณ์ บรรจุภัณฑ์เป็นมิตรกับสิ่งแวดล้อม PVCและพร้อมจําหน่าย — ทั้งหมดนี้จัดส่งภายใน 60 วัน
    solution: พัฒนาไฟล์พิมพ์ดิจิทัลแบบกําหนดเอง การREACHสุ่มตัวอย่างแบบ -compliant PVCและแบบบีบอัดจาก 3 รอบเป็น 1 รอบ โดยร่วมทีมออกแบบที่โรงงานชิงเต่าของเรา
    result: 55 วันจากวันที่ลงนามถึง FOB.2,400 หน่วยใน 4 SKU สั่งซื้อซ้ําก่อนที่ตู้คอนเทนเนอร์แรกจะมาถึง
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - ค้าปลีก
      - SUP
    outcome_metrics:
      - label: ระยะเวลาการผลิต
        value: 55 วัน
      - label: หน่วย
        value: 2,400
      - label: SKU
        value: '4'
  - id: startup-drop-stitch-kayak
    client: สตาร์ทอัพกีฬาทางน้ําในสหรัฐอเมริกา
    product: Drop-Stitch เรือคายัค
    industry: สตาร์ทอัพ / ค้าปลีก
    challenge: สตาร์ทอัพกีฬาทางน้ําของสหรัฐฯ ต้องการเรือคายัคสมรรถนะสูงdrop-stitchที่มีรูปทรงตัวเรือแบบสั่งทํา บรรจุภัณฑ์ร่วมแบรนด์ และBSCIการรับรองสําหรับการวางขายในร้านค้าปลีก
    solution: ปรับdrop-stitchแม่พิมพ์เรือคายัคที่มีอยู่ให้ปรับรูปทรงโยก พัฒนางานศิลปะบรรจุภัณฑ์ร่วมแบรนด์ และจัดทําBSCIเอกสารตรวจสอบอย่างครบถ้วน
    result: จดทะเบียนสําเร็จในเครือร้านค้ากลางแจ้งใหญ่ 3 แห่งในสหรัฐฯปีแรกขายได้ 5,000+ ยูนิต ด้วยอัตราขาย 98%
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
    tags:
      - OEM
      - เรือคายัค
      - BSCI
    outcome_metrics:
      - label: เครือข่ายค้าปลีก
        value: '3'
      - label: หน่วยปีแรก
        value: 5,000+
      - label: การขายผ่าน
        value: 98%
  - id: australian-rib-distributor
    client: ผู้จัดจําหน่ายในออสเตรเลีย
    product: CE- ผลิตภัณฑ์ที่ได้รับการรับรองRIB
    industry: ทางทะเล / รัฐบาล
    challenge: ผู้จัดจําหน่ายในออสเตรเลียต้องการCEชุดผลิตภัณฑ์ที่ได้รับการรับรอง - RIB พร้อมสีหลอดแบบกําหนดเอง Hypalon ตัวเลือกการอัปเกรด และเป็นไปตามมาตรฐานออสเตรเลีย AS 1799
    solution: ผลิตตัวอย่างก่อนการผลิตที่มีหลอดสี 4 แบบ จัดหาCSM Hypalon จากซัพพลายเออร์ญี่ปุ่น และประสานงานการทดสอบความสอดคล้องกับ AS 1799 ของบุคคลที่สาม
    result: เปิดตัวกลุ่ม 3 รุ่นRIBในตลาด AU/นิวซีแลนด์ตามมาด้วยการชนะการประมูลของรัฐบาลสําหรับรถลาดตระเวน 12 คันRIBs
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - รัฐบาล
    outcome_metrics:
      - label: รุ่นที่เปิดตัว
        value: '3'
      - label: สัญญาเรือลาดตระเวน
        value: 12 ยูนิต
      - label: การปฏิบัติตามข้อกําหนด
        value: AS 1799
  - id: caribbean-resort-fleet
    client: กลุ่มรีสอร์ทหรูแคริบเบียน
    product: กองเรือรีสอร์ต — RIBs, SUP, เรือคายัค
    industry: การบริการ / การท่องเที่ยว
    challenge: กลุ่มรีสอร์ท 5 แห่งต้องการกองอุปกรณ์กีฬาทางน้ําให้เช่าที่เป็นหนึ่งเดียว — ทั้ง RIB เรือเทนเดอร์ SUPs, , และคายัค — ที่มีแบรนด์ที่สอดคล้องกัน UVวัสดุที่ทนต่อแสงแดดเขตร้อน และแผนทดแทน 5 ปี
    solution: ออกแบบชุดเรือ 3 รุ่นที่ออกแบบเฉพาะ พร้อมUVกราฟิกดาดฟ้าที่มีการเสริมความมั่นคงและPVCตราสัญลักษณ์รีสอร์ท พร้อมตารางการจัดส่งแบบเป็นขั้นตอนจัดอบรมพนักงานและชุดอะไหล่เฉพาะสําหรับแต่ละรีสอร์ท
    result: ส่งมอบ 180 ยูนิตใน 5 รีสอร์ทสั่งซื้อซ้ําสําหรับอสังหาริมทรัพย์ใหม่ 2 แห่งลดต้นทุนต่อยูนิตลง 40% เมื่อเทียบกับซัพพลายเออร์เดิม
    image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - เรือคายัค
      - RIB
      - การต้อนรับ
    outcome_metrics:
      - label: จํานวนหน่วยที่ส่งมอบ
        value: 180
      - label: รีสอร์ท
        value: '5'
      - label: ลดต้นทุน
        value: 40%
  - id: southeast-asia-search-rescue
    client: สํานักงานทางทะเลแห่งเอเชียตะวันออกเฉียงใต้
    product: กองเรือลาดตระเวนและกู้ภัยRIB
    industry: รัฐบาล / ความมั่นคงทางทะเล
    challenge: หน่วยงานทางทะเลของรัฐบาลกําหนดให้มีการลาดตระเวนและกู้ภัยจํานวน 20 ลํา RIBs พร้อมHypalonผ้ากันไฟ พื้นรองรับการตักน้ําอัตโนมัติ ฐานติดตั้งคอนโซล VHF/วิทยุในตัว และปฏิบัติตามSOLASมาตรฐานเรือกู้ภัย Chapter III
    solution: ผลิต 20 ลํา RIBs พร้อมท่อ ตัวCSM Hypalon เรืออลูมิเนียมเกรดทางทะเล ตาลากจูงขนาดใหญ่ และชุดไฟนําทางที่ติดตั้งไว้ล่วงหน้าทีมตรวจสอบโรงงานได้เป็นพยานในการทดสอบทางทะเลSOLASมีเอกสารประกอบครบถ้วนให้
    result: สัญญาส่งมอบภายใน 4 เดือนกองเรือถูกส่งไปปฏิบัติหน้าที่ลาดตระเวนชายแดน ค้นหาและกู้ภัย และตอบสนองภัยพิบัติใน 3 ฐานภูมิภาค
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - รัฐบาล
      - SOLAS
    outcome_metrics:
      - label: ลาดตระเวนRIBs
        value: '20'
      - label: การจัดส่ง
        value: 4 เดือน
      - label: ฐาน
        value: '3'
  - id: european-dtc-ecommerce
    client: แบรนด์กีฬาน้ำแบบ DTC ของยุโรป
    product: สายอุปกรณ์เสริมที่มีแบรนด์ SUP +
    industry: อีคอมเมิร์ซ / ค้าปลีก
    challenge: แบรนด์กีฬาน้ำแบบ DTC ที่เติบโตอย่างรวดเร็วต้องการแพ็กเกจ SUP ครบชุด (บอร์ด, ปั๊ม, ไม้พาย, สายรัด, กระเป๋า) พร้อมบรรจุภัณฑ์พรีเมียมออกแบบมาสำหรับการจัดส่งอีคอมเมิร์ซ — ส่งตรงถึงผู้บริโภคผ่าน DHL/FedEx โดยไม่เสียหาย
    solution: พัฒนาสายผลิตภัณฑ์ร่วมแบรนด์พร้อมด้วยการขึ้นรูปแกน EPS แบบกำหนดเอง เทคโนโลยี drop-stitch เฉพาะสำหรับความดันสูง และกล่องลูกฟูกสองชั้นพร้อมแผ่นบุสำหรับค้าปลีก พร้อมผสานระบบตรวจสอบความถูกต้องและการลงทะเบียนการรับประกันผ่านรหัส QR
    result: เปิดตัวสายผลิตภัณฑ์ 3 รุ่น SUP ใน 75 วัน จำนวน 15,000+ หน่วยใน 12 เดือนแรก คะแนนเฉลี่ย 4.8★ จากรีวิว 2,000+ รายการ อัตราความเสียหายขณะขนส่ง 0.3%
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - อีคอมเมิร์ซ
    outcome_metrics:
      - label: รุ่นสินค้า
        value: '3'
      - label: หน่วย
        value: 15,000+
      - label: คะแนนเฉลี่ย
        value: 4.8★
      - label: อัตราความเสียหาย
        value: 0.3%
certifications:
  - name: CE
    body: สหภาพยุโรป
    desc: ผลิตภัณฑ์มีการรับรอง CE ตามคำสั่งของ EU ที่เกี่ยวข้อง — เรือเพื่อสันทนาการตาม EN ISO 6185, อุปกรณ์ช่วยลอยตัวส่วนบุคคลตาม EN ISO 12402 ตามความเหมาะสม
  - name: ISO 9001
    body: SGS / BSI
    desc: ระบบการจัดการคุณภาพที่ได้รับการรับรองสำหรับการออกแบบ การผลิต และการจัดจำหน่ายเรือเป่าลม
  - name: BSCI
    body: amfori
    desc: การรับรองความสอดคล้องด้านสังคมแสดงถึงการผลิตที่มีจริยธรรม การจ้างงานที่เป็นธรรม และความปลอดภัยในสถานที่ทำงาน
  - name: REACH
    body: European Chemicals Agency
    desc: วัสดุทั้งหมดเป็นไปตามข้อกำหนด REACH ด้านความปลอดภัยของสารเคมี เอกสารประกอบพร้อมส่งทุกครั้ง
  - name: RoHS
    body: สหภาพยุโรป
    desc: การปฏิบัติตามข้อจำกัดสารอันตรายในอุปกรณ์อิเล็กทรอนิกส์และไฟฟ้าทุกชิ้น
  - name: AS 1799
    body: Standards Australia
    desc: มาตรฐานออสเตรเลียสำหรับเรือเป่าลม — ผ่านการทดสอบและรับรองสำหรับการใช้งานเชิงพาณิชย์ในน้ำของ AU/NZ
