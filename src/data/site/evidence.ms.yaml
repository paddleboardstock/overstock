badge: Proof & Quality
heading: Bukti
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Stok Pelepasan, QC Setaraf Runcit
    product: Setiap Papan Lebihan, Diperiksa Semula
    industry: Kawalan Kualiti
    challenge: Papan lebihan dan pelepasan datang daripada pengeluaran lebihan, jadi pembeli wajar bertanya sama ada papan yang diskaun melalui pemeriksaan yang sama seperti papan harga penuh.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: Kadar bebas kecacatan 99.3% untuk penghantaran keluar dalam 12 bulan terkini — standard yang sama digunakan kepada stok pelepasan dan runcit.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Kadar Tanpa Cacat
        value: 99.3%
      - label: Liputan Ujian Tekanan
        value: 100%
      - label: Tempoh Penahanan
        value: 24-48h
  - id: pressure-test-regime
    client: Penahanan Tekanan 24-48 Jam
    product: Setiap Ruang, Tekanan 1.25x Berdaftar
    industry: Ujian Produk
    challenge: Sebuah papan SUP hidup atau mati bergantung pada inti dan jahitannya drop-stitch, dan pemeriksaan inflasi cepat di hujung barisan tidak cukup untuk mengesan kebocoran perlahan atau kimpalan lemah.
    solution: Setiap papan diisi ke 1.25x tekanan berdaftarnya dan ditahan selama 24-48 jam, dengan penurunan tekanan mesti kekal di bawah 5%. Injap, talipinggang D, jahitan, dan daya apung diperiksa tanpa toleransi untuk kecacatan keselamatan.
    result: 100% pengeluaran melalui rejim ini sebelum pembungkusan — tiada jalan pintas pengambilan sampel, tiada pengecualian.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - Tekanan 1.25x
      - Tiada Kecacatan Keselamatan
    outcome_metrics:
      - label: Tekanan Ujian
        value: 1.25x
      - label: Penurunan Tekanan Maksimum
        value: <5%
      - label: Unit Diuji
        value: 100%
  - id: warranty-claims-support
    client: Jaminan Yang Menjawab
    product: Liputan 2 Tahun pada Papan & Aksesori SUP
    industry: Selepas Jualan
    challenge: Membeli barangan jelas terus dari kilang menimbulkan soalan yang munasabah — jika sesuatu berlaku beberapa bulan kemudian, siapa yang mengendalikannya?
    solution: Setiap papan dihantar dengan jaminan 2 tahun yang merangkumi papan SUP, jahitan drop-stitch, injap inflasi, dan aksesori. Tuntutan dihantar terus ke pasukan kami — hantar foto atau video pendek dan kami akan uruskan dari situ.
    result: Tuntutan jaminan disemak dan diselesaikan oleh pasukan yang sama yang memeriksa pengeluaran — tiada putaran pengedar.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - Jaminan 2 Tahun
      - Sokongan Langsung
      - Aksesori Dilindungi
    outcome_metrics:
      - label: Jaminan
        value: 2 tahun
      - label: Liputan
        value: Papan + Aksesori
      - label: Sokongan
        value: Pasukan Langsung
