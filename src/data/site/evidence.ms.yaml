badge: Proof & Results
heading: Bukti
description: Kajian kes sebenar, sijil, data ujian, dan foto penyebaran yang menunjukkan kemampuan pembuatan dan kualiti produk kami.
case_studies:
  - id: retail-private-label
    client: Peruncit Luar Eropah
    product: Talian Label Peribadi SUP
    industry: Peruncitan
    challenge: Peruncit luar Eropah memerlukan talian SUP label peribadi dengan grafik dek unik, PVC mesra alam, dan pembungkusan sedia untuk peruncitan — semuanya disampaikan dalam 60 hari.
    solution: Membangunkan fail cetakan digital khusus, memperoleh PVC yang mematuhi REACH, dan memampatkan pengambilan sampel dari 3 pusingan ke 1 dengan menempatkan pasukan reka bentuk di kilang Qingdao kami.
    result: 55 hari dari PO yang ditandatangani hingga FOB. 2,400 unit merentasi 4 SKU. Pesanan ulangan dibuat sebelum kontena pertama tiba.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Peruncitan
      - SUP
    outcome_metrics:
      - label: Masa Pemimpin
        value: 55 hari
      - label: Unit
        value: 2,400
      - label: SKU
        value: '4'
  - id: startup-drop-stitch-kayak
    client: Startup Sukan Air AS
    product: Drop-Stitch Kayak
    industry: Startup / Peruncitan
    challenge: Startup sukan air AS memerlukan kayak drop-stitch berprestasi tinggi dengan bentuk lambung khusus, seni pembungkusan bersama jenama, dan sijil BSCI untuk penempatan peruncitan.
    solution: Menyesuaikan acuan kayak drop-stitch sedia ada dengan profil rocker yang diubah, membangunkan seni pembungkusan bersama jenama, dan menyediakan dokumentasi audit BSCI penuh.
    result: Berjaya disenaraikan dalam 3 rangkaian luar utama AS. 5,000 + unit pada tahun pertama dengan kadar jualan 98%.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Kayak
      - BSCI
    outcome_metrics:
      - label: Rangkaian Peruncitan
        value: '3'
      - label: Unit Tahun Pertama
        value: 5,000+
      - label: Jualan
        value: 98%
  - id: australian-rib-distributor
    client: Pengedar Australia
    product: Julat RIB Disahkan CE
    industry: Marin / Kerajaan
    challenge: Pengedar Australia memerlukan julat RIB disahkan CE dengan warna tiub khusus, pilihan naik taraf Hypalon, dan pematuhan dengan Standard Australia AS 1799.
    solution: Menghasilkan sampel pra-pembuatan dengan 4 variasi warna tiub, memperoleh Hypalon CSM daripada pembekal Jepun, dan menyelaras ujian pematuhan AS 1799 oleh pihak ketiga.
    result: 3-model RIB julat dilancarkan di pasaran AU/NZ. Diikuti dengan kemenangan tender kerajaan untuk 12 RIBs rondaan.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Kerajaan
    outcome_metrics:
      - label: Model Dilancarkan
        value: '3'
      - label: Kontrak Bot Rondaan
        value: 12 unit
      - label: Pematuhan
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Kumpulan Resort Mewah Caribbean
    product: Armada Resort — RIBs, SUP, Kayak
    industry: Hospitaliti / Pelancongan
    challenge: Sebuah kumpulan 5 resort memerlukan armada peralatan sukan air sewaan yang seragam — RIB tender, SUPs, dan kayak — dengan penjenamaan yang konsisten, bahan tahan UV untuk matahari tropika, dan pelan penggantian 5 tahun.
    solution: Reka paket armada 3-model khusus dengan UV-distabilkan PVC, grafik dek berjenama resort, dan jadual penghantaran berperingkat. Menyediakan latihan kakitangan dan kit alat ganti khusus bagi setiap resort.
    result: 180 unit dihantar merentasi 5 resort. Pesanan ulang untuk 2 hartanah baru. Pengurangan kos per unit sebanyak 40% berbanding pembekal sebelumnya.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kayak
      - RIB
      - Hospitaliti
    outcome_metrics:
      - label: Unit Dihantar
        value: 180
      - label: Resort
        value: '5'
      - label: Pengurangan Kos
        value: 40%
  - id: southeast-asia-search-rescue
    client: Agensi Maritim Asia Tenggara
    product: Armada RIB Rondaan & Penyelamatan
    industry: Kerajaan / Keselamatan Maritim
    challenge: Sebuah agensi maritim kerajaan memerlukan 20 RIBs rondaan dan penyelamatan dengan kain tahan api Hypalon, lantai self-bailing, konsol pemasangan VHF/radio bersepadu, dan pematuhan dengan standard bot penyelamat Bab III SOLAS.
    solution: Membuat 20 RIBs dengan tiub CSM Hypalon, badan aluminium gred marin, mata tunda berat, dan pakej lampu navigasi pra-pemasangan. Pasukan pemeriksaan kilang menyaksikan ujian laut. Pakej dokumentasi SOLAS penuh disediakan.
    result: Kontrak diserahkan dalam 4 bulan. Armada digerakkan untuk rondaan sempadan, pencarian dan penyelamatan, dan tindak balas bencana merentasi 3 pangkalan wilayah.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Kerajaan
      - SOLAS
    outcome_metrics:
      - label: Bot Rondaan RIBs
        value: '20'
      - label: Penghantaran
        value: 4 bulan
      - label: Pangkalan
        value: '3'
  - id: european-dtc-ecommerce
    client: Jenama Sukan Air DTC Eropah
    product: SUP + Barisan Aksesori Berjenama
    industry: E-dagang / Runcit
    challenge: Jenama sukan air DTC yang berkembang pesat memerlukan SUP pakej lengkap (papan, pam, dayung, tali, beg) dengan pembungkusan premium yang direka untuk pemenuhan e-dagang — terus kepada pengguna melalui DHL/FedEx tanpa kerosakan.
    solution: Membangunkan barisan produk berjenama bersama dengan pembentukan teras EPS tersuai, teknologi proprietari drop-stitch untuk tekanan lebih tinggi, dan kotak beralun dinding berkembar yang sedia untuk dijual dengan lapisan sisipan. Keaslian dan pendaftaran jaminan berasaskan kod QR yang terintegrasi.
    result: Barisan 3-model SUP dilancarkan dalam 75 hari. 15,000+ unit dalam 12 bulan pertama. Penilaian purata 4.8★ pada 2,000+ ulasan. 0.3% kadar kerosakan semasa transit.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-dagang
    outcome_metrics:
      - label: Model
        value: '3'
      - label: Unit
        value: 15,000+
      - label: Penarafan Purata
        value: 4.8★
      - label: kadar kerosakan
        value: 0.3%
certifications:
  - name: CE
    body: Kesatuan Eropah
    desc: Produk mempunyai CE pensijilan mengikut arahan EU yang berkenaan — bot rekreasi mengikut EN ISO 6185, peranti apungan peribadi mengikut EN ISO 12402, jika berkenaan.
  - name: ISO 9001
    body: SGS / BSI
    desc: Sistem pengurusan kualiti yang diperakui untuk reka bentuk, pembuatan, dan pengedaran kenderaan air boleh tiup.
  - name: BSCI
    body: amfori
    desc: Pensijilan pematuhan sosial yang menunjukkan pembuatan beretika, buruh adil, dan keselamatan tempat kerja.
  - name: REACH
    body: Agensi Kimia Eropah
    desc: Semua bahan mematuhi REACH peraturan keselamatan kimia. Dokumentasi disediakan dengan setiap penghantaran.
  - name: RoHS
    body: Kesatuan Eropah
    desc: Sekatan pematuhan bahan berbahaya merentasi semua komponen elektronik dan elektrik.
  - name: AS 1799
    body: Standards Australia
    desc: Standard Australia untuk bot tiup — diuji dan diperakui untuk kegunaan komersial di perairan AU/NZ.
