badges:
  - icon: ✔
    title: CE ได้รับการรับรอง
    desc: ผ่านการทดสอบอย่างอิสระตามมาตรฐานความปลอดภัยของสหภาพยุโรป — TÜV Rheinland.
    variant: cert
  - icon: ⚙
    title: ISO 9001:2015
    desc: ระบบการจัดการคุณภาพได้รับการรับรองโดย SGS ตั้งแต่ปี 2022.
    variant: cert
  - icon: ✦
    title: ผ่านการทดสอบตามมาตรฐาน
    desc: ทุกหน่วยทดสอบแรงดันที่ 1.25 เท่าของ PSI สำหรับ 24-48 ชั่วโมง.
    variant: standard
  - icon: ☆
    title: รับประกันเรือ 5 ปี
    desc: รับประกันจำกัด 5 ปีสำหรับผ้าท่อ รอยต่อ และลำเรือ; 2 ปี สำหรับ SUP และอุปกรณ์เสริม. ปราศจากข้อบกพร่อง 99.3% (AQL 2.5/ISO 2859).
    variant: warranty
  - icon: ⚖
    title: REACH & RoHS
    desc: วัสดุทั้งหมดเป็นไปตามข้อกำหนดด้านสารเคมีและสิ่งแวดล้อมของสหภาพยุโรป.
    variant: material
  - icon: ★
    title: BSCI ได้รับการรับรอง
    desc: การตรวจสอบความสอดคล้องทางสังคมได้รับการตรวจสอบเพื่อรับประกันการผลิตที่มีจริยธรรม.
    variant: cert
