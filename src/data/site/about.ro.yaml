origin:
  tagline: Originea noastră
  heading: |-
    Construit pe apă,<br />
    <span class="text-sky-600">Condusă de scop</span>
  paragraphs:
    - 'Paddle Board Overstock Am început într-un atelier de coastă cu o singură barcă și o convingere încăpățânată: produsele marine ar trebui proiectate ca și cum ar conta — pentru că contează.'
    - Fondatorii noștri, doi arhitecți navali, au văzut o industrie în care se tăiau colțuri, materialele erau retrogradate, iar siguranța era tratată ca o căsuță de bifat. Ei au construit prima Paddle Board Overstock carenă nu pentru profit, ci pentru a demonstra că echipamentele marine accesibile puteau fi cu adevărat fiabile.
    - Prima carenă este încă în serviciu astăzi. Acest principiu nu s-a schimbat niciodată.
    - Nu suntem cel mai mare producător. Nu facem cele mai ieftine produse. Dar fiecare carenă care părăsește atelierul nostru trece prin aceleași mâini care au început compania — și îndeplinește același standard stabilit de primul corp.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock Atelierul de coastă
philosophy:
  tagline: Filosofia noastră
  heading: Înrădăcinată în ocean
  description: Oceanul nu este locul nostru de muncă. Este profesorul nostru. Fiecare decizie de design începe cu înțelegerea modului în care se comportă apa, cum se schimbă condițiile și cum trebuie să răspundă echipamentele.
  cards:
    - emoji: 🌊
      title: Respectă Apa
      description: Apa este imprevizibilă. Produsele noastre sunt proiectate pentru cele mai rele condiții, nu cele mai bune. Dacă o carenă poate face față unui curent de reflux, va rezista unui lac. Dacă o vestă de salvare funcționează în larg, este supradimensionată pentru un râu — și asta este intenționat.
    - emoji: 🔧
      title: Construit să dureze, nu să fie înlocuit
      description: Cel mai sustenabil produs este cel care nu trebuie înlocuit. Cele de calitate PVCmarină , Hypalon, și drop-stitch construcția sunt alese pentru longevitate. Încă expediem piese de schimb pentru carene pe care le-am construit acum un deceniu.
    - emoji: 🏆
      title: Accesibil prin design
      description: Sporturile nautice nu ar trebui să fie un lux. Proiectăm produse care oferă performanță profesională la un preț care are sens pentru familii, ghizi și operatori mici — nu doar pentru flote comerciale.
design:
  tagline: Filosofia de design
  heading: |-
    Proiectat pentru muchie<br />
    <span class="text-sky-600">de condiții</span>
  paragraphs:
    - Fiecare Paddle Board Overstock produs începe cu o singură întrebare:<em>Care este cea mai gravă afecțiune cu care se va confrunta?</em>Proiectăm de la margine spre interior, nu de la centru spre exterior.
    - drop-stitch Nucleele noastre sunt evaluate pentru 15 PSI — nu pentru că 12 PSI nu ar fi suficient pentru un lac, ci pentru că o PSI placă 15 rezistă unei tăieturi bruște fără să se flexeze. Hypalon Tuburile noastre sunt specificate pentru UV rezistență de calitate comercială — nu pentru că toți clienții vâslesc în tropice, ci pentru că UV degradarea este cauza numărul 1 a defectării premature.
    - Nu proiectăm la un preț. Proiectăm până la un punct de eșec — apoi construim mult peste acesta.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock Proiectare și inginerie
  stats:
    - value: '15'
      label: PSI Nucleu<br />Clasament
    - value: 1,500+
      label: UV Programul<br />Testat
    - value: 10yr
      label: cocă<br />durata de viață
