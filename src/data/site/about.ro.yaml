business_model:
  tagline: Modelul nostru de afaceri
  heading: Stocuri excedentare, vândute direct în fabrică
  paragraphs:
    - Paddle Board Overstock Vinde plăci gonflabile SUP noi-nouțe la prețuri de stoc și de reducere — până la 60% reducere în retailul obișnuit. Procurăm stocuri excedentare și excedentare în volum, apoi transferăm economiile către vâslași și retaileri mici.
    - 'Pe lângă vânzările cu amănuntul, deservim retaileri mici cu modele mixte en-gros: comandăm 5–20 de plăci, amestecăm orice model într-o singură livrare și plătim nivelul en-gros pentru cantitatea totală. Fiecare comandă este expediată direct din Weihai, China.'
sourcing:
  tagline: De unde provine stocul nostru în exces
  heading: Surse mixte, un singur standard de calitate
  paragraphs:
    - 'Inventarul nostru provine din două surse: loturi de producție excedentare din propriile noastre operațiuni de producție din Weihai și stocuri suplimentare selectate, provenite de la alți parteneri de producție cu care audităm și cu care colaborăm direct.'
    - Fiecare placă pe care o vindem este nouă și nefolosită. Suprastocul se referă la preț — niciodată la condiție.
manufacturing:
  tagline: Experiența noastră în producție
  heading: Construit în Weihai din 2012
  paragraphs:
    - Fabricăm plăci gonflabile SUP în Weihai, Shandong din 2012. Facilitățile noastre de producție de 12.000 m² produc 15.000 de unități gonflabile pe an, cu o echipă de 200–300 de muncitori și 14+ ingineri de cercetare și dezvoltare.
    - 'Un principiu de proiectare nu s-a schimbat de la prima placă: proiectăm până la un punct de defectare, apoi construim mult peste acesta.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock Clădirea fabricii în Weihai
  stats:
    - value: '2012'
      label: Producție de atunci
    - value: 12.000 m²
      label: Facilități de producție
    - value: 15,000
      label: Unități per an
    - value: 14+
      label: Ingineri R&D
inspection:
  tagline: Cum inspectăm fiecare SUP scândură
  heading: Fiecare placă a fost testată, nu a fost eșantionată
  paragraphs:
    - Fiecare SUP placă este testată 100% la presiune la 1,25 ori presiunea nominală timp de 24–48 de ore înainte de a fi aprobată pentru vânzare. Plăcile care cedează nu sunt niciodată expediate.
    - 99,3% dintre consilii trec inspecția finală din prima. Fracțiunea rămasă este reparată sau pusă deoparte — niciodată redusă într-o comandă.
why_prices_lower:
  tagline: De ce prețurile noastre sunt mai mici
  heading: Economia suprastocurilor, nu tăierea colțurilor
  paragraphs:
    - 'Prețurile noastre sunt mai mici din motive structurale: vindem stocul excedentar și stocul excedentar direct de la Weihai, fără adaosuri de retail, fără straturi de distribuire și fără costuri la showroom.'
    - Plăcile în sine sunt de calitate de producție completă — drop-stitch aceleași miezuri, aceleași teste PVCde calitate marină, aceleași teste ca în retailul la preț întreg.
shipping_network:
  tagline: Rețeaua noastră internațională de transport
  heading: Transport aerian expres sau marfă maritimă consolidată
  paragraphs:
    - Comenzile sunt expediate din Weihai, China. Transportul expres de marfă aeriană transportă mostre și 1–3 comenzi de comandă; Transportul maritim consolidat deservește 5–20 de comenzi en-gros către 50+ de țări.
    - Fiecare ofertă include o estimare de tranzit pentru destinația dumneavoastră, plus factura comercială și lista de ambalare necesare pentru deferirea vamală.
  cards:
    - title: Transport Aerian Rapid
      description: Pentru mostre și comenzi de 1–3 plăci — livrare rapidă la ușa dumneavoastră, tarif pe destinație.
    - title: Transport Maritim Consolidat
      description: Pentru comenzi en-gros de 5–20 de plăci — transport economic către porturile principale, tarif pe destinație.
warranty_support:
  tagline: Garanție și Suport pentru Clienți
  heading: Garanție de 2 ani SUP pentru fiecare placă
  paragraphs:
    - Fiecare placă se livrează cu garanția de 2 ani SUP. Dacă apare un defect acoperit de garanție în perioada de garanție, contactați echipa noastră de suport și vom rezolva problema.
    - Suportul este gestionat de aceeași echipă care se ocupă de comanda dumneavoastră. Ne puteți contacta oricând prin formularul de contact sau răspunzând la confirmarea comenzii.
