business_model:
  tagline: Üzleti modellünk
  heading: Túlkészlet, közvetlenül gyárilag eladva
  paragraphs:
    - Paddle Board Overstock Új felfújható SUP deszkákat árul túlkészlet- és eladási áron – akár 60%-os kedvezmény a tipikus kiskereskedelemben. A többlet- és felesleges készletet mennyiségben szerzünk be, majd a megtakarítást továbbadjuk evezősöknek és kiskereskedőknek.
    - 'A kiskereskedelmi értékesítés mellett a kiskereskedőket vegyes nagykereskedelmi nagykereskedelemmel is kiszolgáljuk: rendelj 5–20 táblát, keverj bármilyen modellt egy szállítmányba, és fizessük ki a nagykereskedelmi szintet a teljes mennyiségért. Minden rendelés közvetlenül Weihaiból, Kínából érkezik.'
sourcing:
  tagline: Honnan származik a túlkészletünk
  heading: Vegyes forrás, egy minőségi szabvány
  paragraphs:
    - 'Készletünk két forrásból származik: a saját Weihai gyártóüzemünkből származó felesleges termelési tételekből, valamint a kiválasztott felesleges készletből, amelyet más gyártópartnerektől szerezünk, amelyeket közvetlenül auditálunk és akikkel dolgozunk együtt.'
    - Minden eladott deszka vadonatúj és használatlan. A túlkészlet az árat jelenti — nem az állapotot.
manufacturing:
  tagline: Gyártási hátterünk
  heading: 2012 óta Weihaiban épül
  paragraphs:
    - SUP 2012 óta gyártunk felfújható deszkákat Weihaiban, Shandongban. 12 000 m²-es gyártóüzemünk évente 15 000 felfújható egységet állít elő, 200–300 dolgozós és 14+ kutatás-fejlesztési mérnök csapattal.
    - 'Egy tervezési elv sem változott az első deszka óta: kudarcpontig tervezünk, majd jóval fölött építünk.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock Gyárépület Weihaiban
  stats:
    - value: '2012'
      label: Gyártás azóta
    - value: 12 000 m²
      label: Gyártóüzem
    - value: 15,000
      label: Egységek évente
    - value: 14+
      label: Kutatás-fejlesztési mérnökök
inspection:
  tagline: Hogyan vizsgáljuk meg minden SUP táblát
  heading: Minden deszkolatot teszteltek, nem mintáztak
  paragraphs:
    - Minden SUP deszka 100%-ban nyomásteszten van átvizsgálva, 1,25-szeres a névleges nyomásnak 24–48 órán át, mielőtt eladásra engedélyezik. A meghibásodott deszkák soha nem szállítottak.
    - A testületek 99,3%-a elsőre átmegy a végső ellenőrzésen. A fennmaradó részt megjavítják vagy félreteszik — soha nem disználják rendelésbe.
why_prices_lower:
  tagline: Miért alacsonyabbak az áraink
  heading: Túlkészletgazdaságtan, nem a sárokra húzás
  paragraphs:
    - 'Az áraink szerkezeti okokból alacsonyabbak: a túlkészletet és a felesleges készletet közvetlenül a Weihai-tól értékesítjük, kiskereskedelmi árfellépések nélkül, forgalmazó rétegek nélkül, és bemutatóköltségek nélkül.'
    - Maguk a lapok teljes gyártási minőségűek — drop-stitch ugyanazok a magok, ugyanazok a tengeri PVCminőségűek, ugyanazok a tesztek, mint a teljes árú kiskereskedelmi termékek.
shipping_network:
  tagline: Nemzetközi Szállítási Hálózatunk
  heading: Expressz légi vagy konszolidált tengeri áruszállítás
  paragraphs:
    - A megrendelések Weihaiból, Kínából szállítják. Expressz légi szállítás mintákat és 1–3 fedélzeti megrendelést szállít; a Consolidated Sea Freight 5–20 fedélzeti nagykereskedelmi megrendelést szolgál ki 50+ országnak.
    - Minden ajánlat tartalmazza a közlekedési becslést a célállomásra, valamint a kereskedelmi számlát és a vámellenőrzéshez szükséges csomagolási listát.
  cards:
    - title: Express Légi Szállítás
      description: Minták és 1–3 darabos rendelések esetén — gyors kiszállítás az ajtódhoz, az ár az adott célállomás szerint.
    - title: Konszolidált Tengeri Szállítás
      description: 5–20 darabos nagykereskedelmi rendelésekhez — költséghatékony szállítás a főbb kikötőkbe, az ár az adott célállomás szerint.
warranty_support:
  tagline: Garancia és Ügyféltámogatás
  heading: Minden táblára 2 éves SUP garancia
  paragraphs:
    - Minden tábla 2 éves SUP garanciával kerül kiszállításra. Ha a garanciális időszak alatt hibát fedez fel, lépjen kapcsolatba az ügyféltámogatásunkkal, és mi orvosoljuk a problémát.
    - Az ügyféltámogatást ugyanaz a csapat kezeli, amely az Ön rendelését is. Bármikor elérhet minket a kapcsolatfelvételi űrlapon keresztül, vagy a rendelés visszaigazolására válaszolva.
