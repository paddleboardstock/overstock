origin:
  tagline: Eredetünk
  heading: |-
    Vízre épülve,<br />
    <span class="text-sky-600">Cél vezérelte</span>
  paragraphs:
    - 'Paddle Board Overstock Egy part menti műhelyben kezdtem, egy hajóval és makacs hittel: a tengeri termékeket úgy kell megtervezni, mintha számítanának — mert valóban számítanak.'
    - Alapítóink, két hajóépítész, olyan iparágat láttak, ahol a sarkokat csökkentik, az anyagokat lealacsonyították, és a biztonságot csak egy kilátómezőként kezelték. Az első Paddle Board Overstock hajótestet nem nyereség céljából építették, hanem azért, hogy bizonyítsák, az megfizethető tengeri felszerelések valóban megbízhatóak is lehetnek.
    - Az első hajótest ma is szolgálatban van. Ez az elv soha nem változott.
    - Nem vagyunk a legnagyobb gyártó. Nem gyártjuk a legolcsóbb termékeket. De minden hajótest, amely elhagyja a műhelyünket, ugyanazon a kézen megy keresztül, akik a céget indították — és megfelel ugyanazoknak a szabványoknak, amelyeket az első hajótest állított fel.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock Coastal Workshop
philosophy:
  tagline: Filozófiánk
  heading: Az óceánban gyökerezik
  description: Az óceán nem a munkahelyünk. Ez a tanárunk. Minden tervezési döntés azzal kezdődik, hogy megértsük, hogyan viselkedik, hogyan változik a körülmények, és hogyan kell reagálnia a felszerelésnek.
  cards:
    - emoji: 🌊
      title: Tiszteld a vizet
      description: A víz kiszámíthatatlan. Termékeink a legrosszabb körülményekre vannak tervezve, nem a legjobbakra. Ha egy hajótest képes kezelni az árfolyamot, akkor egy tavat is kezel. Ha egy mentőmellény a tengeren működik, akkor túltervezett egy folyóhoz – és ez szándékos.
    - emoji: 🔧
      title: Tartósságra építették, nem pótolásra
      description: A legfenntarthatóbb termék az, amit nem kell cserélni. A tengerészeti PVCminőségű , Hypalon, és drop-stitch az építés a tartósság érdekében a választás. Még mindig szállítunk alkatrészeket a tíz évvel ezelőtt épített hajótestekhez.
    - emoji: 🏆
      title: Tervezéssel elérhető
      description: A vízi sportoknak nem szabadna luxusnak lenniük. Olyan termékeket tervezünk, amelyek professzionális teljesítményt nyújtanak olyan áron, amely a családok, idegenvezetők és kis üzemeltetők számára is megtisztult – nem csak a kereskedelmi flották számára.
design:
  tagline: Tervezési filozófia
  heading: |-
    A szélre készült<br />
    <span class="text-sky-600">a feltételek</span>
  paragraphs:
    - Minden Paddle Board Overstock termék egy kérdéssel kezdődik:<em>Mi a legrosszabb állapot, amibe ez néz majd?</em>A szélről befelé tervezünk, nem a középről kifelé.
    - 'drop-stitch A magjaink 15-re vannak PSI becsezve — nem azért, mert a 12 PSI nem elegendő egy tóhoz, hanem mert egy 15-ös PSI deszka hirtelen vágást kezel hajlás nélkül. Csövekünk Hypalon kereskedelmi szintű UV ellenállásra vannak szabva — nem azért, mert minden ügyfél a trópusi területeken evez, hanem mert UV a lebomlás a korai meghibásodás #1 oka.'
    - Nem egy árkategóriára tervezünk. Kudarcpontig tervezünk — majd jóval fölött építünk.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock Tervezés és mérnöki munka
  stats:
    - value: '15'
      label: PSI Mag<br />Értékelés
    - value: 1,500+
      label: UV Nyitvatartási idő<br />tesztelve
    - value: 10yr
      label: hullám<br />eletciklus
