cards:
  - badge: PVC
    title: Marine-Grade PVC sloj
    description: Višeslojna laminirana PVC tkanina ocijenjena za morske uvjete. Testirano na UV, otpornost na habanje i probijanje.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch Jezgra
    description: Tisuće unutarnjih niti povezuju gornje i donje slojeve, stvarajući čvrstu, visokotlačnu strukturu pri 12–15 PSI.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-drop-stitch.webp
  - badge: RR
    title: Ojačani rub tračnice
    description: Dvostruko slojevita, fuzijski zavarena tračnica štiti od ogrebotina na pristaništu, prizemljenja na plaži i bočnih udaraca.
    image: https://assets.aquafarer.com/images/aquafarer/tech/tech-hypalon-tubes.webp
