badge: Proof & Results
heading: Dokazi
description: Pravi studiji slučaja, certifikati, testni podaci i fotografije implementacije koji pokazuju našu sposobnost proizvodnje i kvalitetu proizvoda.
case_studies:
  - id: retail-private-label
    client: Europski prodavač na otvorenom
    product: Linija privatne robne marke SUP
    industry: Maloprodaja
    challenge: Europskom prodavaču na otvorenom bila je potrebna linija privatne robne marke SUP s jedinstvenim grafičkim dizajnom palube, ekološki prihvatljivim PVC i pakiranjem spremnim za maloprodaju — sve isporučeno u roku od 60 dana.
    solution: Razvili smo prilagođene digitalne datoteke za tisak, nabavili REACH-sukladne PVC i smanjili broj rundi uzoraka s 3 na 1 smještanjem dizajnerskog tima u našu tvornicu u Qingdau.
    result: 55 dana od potpisanog PO do FOB. 2.400 jedinica raspoređenih na 4 SKU. Ponovljena narudžba izvršena prije dolaska prvog kontejnera.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Maloprodaja
      - SUP
    outcome_metrics:
      - label: Vodeće Vrijeme
        value: 55 dana
      - label: Jedinice
        value: 2,400
      - label: SKU
        value: '4'
  - id: startup-drop-stitch-kayak
    client: Start-up američkih vodenih sportova
    product: Drop-Stitch Kajak
    industry: Start-up / Maloprodaja
    challenge: Američkom start-upu u vodenim sportovima bio je potreban visokoučinkovit drop-stitch kajak sa prilagođenim oblikom trupa, zajednički markiranim pakiranjem i BSCI certifikatom za maloprodaju.
    solution: Prilagodili smo postojeći kalup za drop-stitch kajak s modificiranim rocker profilom, razvili artwork za zajednički markirano pakiranje i pružili kompletnu BSCI dokumentaciju za reviziju.
    result: Uspješno uvršten u 3 glavna američka outdoor lanca. 5.000 + jedinica u prvoj godini s 98% prodaje.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Kajak
      - BSCI
    outcome_metrics:
      - label: Maloprodajni lanci
        value: '3'
      - label: Jedinice prve godine
        value: 5,000+
      - label: Prodaja
        value: 98%
  - id: australian-rib-distributor
    client: Australski distributer
    product: CE-Certificirani RIB asortiman
    industry: Marine / Vlada
    challenge: Australskom distributeru bio je potreban CE-certificirani RIB asortiman s prilagođenim bojama cijevi, opcijom nadogradnje Hypalon i sukladnošću s australskim standardom AS 1799.
    solution: Proizveli smo pred-proizvodne uzorke s 4 varijante boja cijevi, nabavili CSM Hypalon od japanskog dobavljača i koordinirali testiranje sukladnosti s AS 1799 treće strane.
    result: 3-modelni RIB raspon lansiran na tržištu AU/NZ. Slijedi pobjeda na državnom natječaju za 12 patrolnih RIBs.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Vlada
    outcome_metrics:
      - label: Lansirani modeli
        value: '3'
      - label: Ugovor za patrolni čamac
        value: 12 jedinica
      - label: Usklađenost
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Caribbean Luxury Resort Group
    product: Flota resorta — RIBs, SUP, kajaci
    industry: Ugostiteljstvo / turizam
    challenge: Grupa od 5 resorta trebala je jedinstvenu flotu opreme za vodene sportove koja se iznajmljuje — RIB natječaja, SUPs i kajaci — s dosljednim brendingom, materijalima otpornima na UV za tropsko sunce i planom zamjene od 5 godina.
    solution: Dizajniran je prilagođeni paket flote od 3 modela s UV stabiliziranim PVC, grafikom na palubi s brendom resorta i faznim rasporedom isporuke. Osigurana je obuka osoblja i namjenski komplet rezervnih dijelova po resortu.
    result: 180 jedinica isporučeno u 5 resorta. Ponovljena narudžba za 2 nova objekta. Smanjenje troška po jedinici za 40% u odnosu na prethodne dobavljače.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kajak
      - RIB
      - Ugostiteljstvo
    outcome_metrics:
      - label: Isporučene jedinice
        value: 180
      - label: Resorti
        value: '5'
      - label: Smanjenje troška
        value: 40%
  - id: southeast-asia-search-rescue
    client: Pomorska agencija jugoistočne Azije
    product: Patrolna i spasilačka flota RIB
    industry: Vlada / Pomorska sigurnost
    challenge: Pomorska agencija vlade trebala je 20 patrolnih i spasilačkih RIBs s vatrootpornom Hypalon tkaninom, samopražnjenim podovima, integriranim nosačima VHF/radio konzole i usklađenošću s SOLAS standardima za spasilačke brodove iz Poglavlja III.
    solution: Proizvedeno je 20 RIBs s CSM Hypalon tubama, trupovima od aluminija pogodne za more, čvrstom vučnom opremom i prethodno instaliranim paketima navigacijskih svjetala. Tim za inspekciju u tvornici prisustvovao je probnim vožnjama. Osiguran je kompletan paket SOLAS dokumentacije.
    result: Ugovor isporučen u roku od 4 mjeseca. Flota je raspoređena za graničnu patroli, potragu i spašavanje te reakciju u slučaju katastrofa na 3 regionalne baze.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Vlada
      - SOLAS
    outcome_metrics:
      - label: Patrolni RIBs
        value: '20'
      - label: Isporuka
        value: 4 mjeseca
      - label: Baze
        value: '3'
  - id: european-dtc-ecommerce
    client: Europski DTC brend vodnih sportova
    product: Brendirana SUP + linija dodataka
    industry: E-trgovina / Maloprodaja
    challenge: Brend vodnih sportova u brzom rastu trebao je kompletan SUP paket (daska, pumpa, veslo, uzica, torba) s premium ambalažom dizajniranom za ispunjenje e-trgovine — izravno potrošaču putem DHL/FedEx bez oštećenja.
    solution: Razvijena je linija proizvoda s ko-brendom s prilagođenim oblikovanjem EPS jezgre, vlasničkom drop-stitch tehnologijom za veći tlak i maloprodajno spremnim kutijama od dvostruko valovitog kartona s umetkom za jastučiće. Integrirana registracija autentičnosti i jamstva putem QR koda.
    result: Linija SUP od 3 modela lansirana je u 75 dana. 15.000+ jedinica u prvih 12 mjeseci. Prosječna ocjena 4.8★ na 2.000+ recenzija. 0,3% stopa oštećenja tijekom transporta.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-trgovina
    outcome_metrics:
      - label: Modeli
        value: '3'
      - label: Jedinice
        value: 15,000+
      - label: Prosječna ocjena
        value: 4.8★
      - label: Stopa oštećenja
        value: 0.3%
certifications:
  - name: CE
    body: Europska unija
    desc: Proizvodi imaju CE certifikat prema primjenjivim EU direktivama — rekreativna plovila prema EN ISO 6185, osobni spašavatelji prema EN ISO 12402, gdje je primjenjivo.
  - name: ISO 9001
    body: SGS / BSI
    desc: Sustav upravljanja kvalitetom certificiran za dizajn, proizvodnju i distribuciju napuhavajućih plovila.
  - name: BSCI
    body: amfori
    desc: Certifikat društvene usklađenosti koji pokazuje etičku proizvodnju, pošten rad i sigurnost na radnom mjestu.
  - name: REACH
    body: Europska agencija za kemikalije
    desc: Svi materijali su u skladu s REACH propisima za kemijsku sigurnost. Dokumentacija se prilaže uz svaku pošiljku.
  - name: RoHS
    body: Europska unija
    desc: Usklađenost s ograničenjem opasnih tvari za sve elektroničke i električne komponente.
  - name: AS 1799
    body: Standardi Australija
    desc: Australski standard za napuhavajuće čamce — testirano i certificirano za komercijalnu upotrebu u vodama AU/NZ.
