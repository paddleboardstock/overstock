badge: Proof & Quality
heading: Dovezi
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Stoc de lichidare, QC de calitate retail
    product: Fiecare placă excedentară, re-inspectată
    industry: Controlul calității
    challenge: Plăcile excedentare și de lichidare provin din serii de producție surplus, așa că cumpărătorii întreabă pe bună dreptate dacă o placă redusă trece aceleași verificări ca una la preț întreg.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: Rată de defecte de 0,7% pe expedierile de ieșire în ultimele 12 luni — același standard se aplică stocului de lichidare și celui de retail.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Rata fără defecte
        value: 99.3%
      - label: Acoperirea testului de presiune
        value: 100%
      - label: Durata retenției
        value: 24-48h
  - id: pressure-test-regime
    client: Retenția de presiune de 24-48 de ore
    product: Fiecare cameră, 1,25x presiune nominală
    industry: Testarea produsului
    challenge: O placă SUP trăiește sau moare în funcție de nucleul și cusăturile drop-stitch, iar un control rapid de umflare la sfârșitul liniei nu este suficient pentru a identifica scurgerile lente sau sudurile slabe.
    solution: Fiecare placă este umflată la 1,25x presiunea nominală și menținută timp de 24-48 de ore, cu scăderea presiunii limitată la sub 5%. Valvele, cercurile în D, cusăturile și plutirea sunt verificate fără toleranță pentru defecte de siguranță.
    result: 100% din producție trece prin acest regim înainte de ambalare — fără scurtături prin eșantionare, fără excepții.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - 1,25x Presiune
      - Zero defecte de siguranță
    outcome_metrics:
      - label: Presiune de test
        value: 1.25x
      - label: Căderea maximă a presiunii
        value: <5%
      - label: Unități testate
        value: 100%
  - id: warranty-claims-support
    client: O garanție care răspunde
    product: Acoperire de 2 ani pentru plăci și accesorii SUP
    industry: Servicii post-vânzare
    challenge: Cumpărarea de produse la lichidare direct de la fabrică ridică o întrebare legitimă — dacă ceva merge prost la câteva luni după, cine se ocupă de asta?
    solution: Fiecare placă este livrată cu o garanție de 2 ani care acoperă plăcile SUP, cusăturile drop-stitch, supapele de umflare și accesoriile. Reclamațiile sunt trimise direct echipei noastre — trimiteți fotografii sau un scurt videoclip și ne ocupăm noi de restul.
    result: Reclamațiile de garanție sunt evaluate și rezolvate de aceeași echipă care inspectează producția — fără întoarceri prin distribuitori.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - Garanție de 2 ani
      - Suport direct
      - Accesorii acoperite
    outcome_metrics:
      - label: Garanție
        value: 2 ani
      - label: Acoperire
        value: Placă + Accesorii
      - label: Sprijin
        value: Echipă directă
