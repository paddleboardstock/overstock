  - metric: Unități testate la presiune
    value: 100%
    detail: Fiecare barcă, fiecare cameră, fiecare lot
  - metric: Căderea maximă a presiunii
    value: <5%
    detail: Pe 24 de ore la presiunea nominală de 1,25x
  - metric: Pragul pentru defecte majore
    value: AQL 2.5
    detail: Conform ISO standardului de eșantionare 2859
  - metric: Durata menținerii presiunii
    value: 24-48h
    detail: În funcție de categoria produsului
  - metric: Mărja de testare a presiunii
    value: 1.25x
    detail: Mărja de siguranță pe fiecare cameră
  - metric: Toleranța defectelor de siguranță
    value: 0%
    detail: Supape, D-ineluri, cusături, flotabilitate
