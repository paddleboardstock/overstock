badge: Proof & Results
heading: Dovezi
description: Studii de caz reale, certificări, date de testare și fotografii de implementare care demonstrează capacitatea noastră de producție și calitatea produsului.
case_studies:
  - id: retail-private-label
    client: Retailer European de Produse Outdoor
    product: Linie Privat-Label SUP
    industry: Retail
    challenge: Un retailer european de produse outdoor avea nevoie de o linie privat-label SUP cu grafice unice pe punte, PVC ecologice și ambalaje pregătite pentru retail — toate livrate în 60 de zile.
    solution: Am dezvoltat fișiere digitale personalizate pentru imprimare, am achiziționat PVC conforme cu REACH și am comprimat mostrele de la 3 runde la 1 prin co-locarea echipei de design la fabrica noastră din Qingdao.
    result: 55 de zile de la PO semnat până la FOB. 2.400 de unități împărțite în 4 SKU-uri. Comandă repetată plasată înainte ca primul container să sosească.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Retail
      - SUP
    outcome_metrics:
      - label: Timp de livrare
        value: 55 de zile
      - label: Unități
        value: 2,400
      - label: SKU-uri
        value: '4'
  - id: startup-drop-stitch-kayak
    client: Startup American de Sporturi Nautice
    product: Drop-Stitch Caiac
    industry: Startup / Retail
    challenge: Startup-ul american de sporturi nautice avea nevoie de un caiac drop-stitch de înaltă performanță cu formă personalizată a carenei, ambalaje co-brandate și certificare BSCI pentru plasare în retail.
    solution: Am adaptat matrița existentă pentru caiac drop-stitch cu profil de rocker modificat, am dezvoltat grafica pentru ambalaje co-brandate și am furnizat documentația completă de audit BSCI.
    result: Listare cu succes în 3 lanțuri majore de retail outdoor din SUA. 5.000+ unități în primul an cu o rată de vânzare de 98%.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Caiac
      - BSCI
    outcome_metrics:
      - label: Lanțuri de Retail
        value: '3'
      - label: Unități în Primul An
        value: 5,000+
      - label: Rată de Vânzare
        value: 98%
  - id: australian-rib-distributor
    client: Distribuitor Australian
    product: Gamă RIB Certificată CE
    industry: Marine / Guvern
    challenge: Distribuitorul australian avea nevoie de o gamă RIB certificată CE cu culori de tub personalizate, opțiune de upgrade Hypalon și conformitate cu Standardul Australian AS 1799.
    solution: Am produs mostre pre-producție cu 4 variante de culoare a tuburilor, am achiziționat Hypalon CSM de la furnizor japonez și am coordonat testarea conformității cu AS 1799 de către terți.
    result: Gama de 3 modele RIB lansată pe piața AU/NZ. Urmată de câștigarea unei licitații guvernamentale pentru 12 ambarcațiuni de patrulare RIBs.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Guvern
    outcome_metrics:
      - label: Modele Lansate
        value: '3'
      - label: Contract Ambarcațiuni de Patrulare
        value: 12 unități
      - label: Conformitate
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Caribbean Luxury Resort Group
    product: Flotă Resort — RIBs, SUP, caiace
    industry: Ospitalitate / Turism
    challenge: Un grup de 5 resorturi avea nevoie de o flotă unificată de echipamente de sporturi nautice de închiriat — RIB licitații, SUPs și caiace — cu branding consistent, materiale rezistente la solar tropical și un plan de înlocuire pe 5 ani.
    solution: Am proiectat un pachet personalizat de flotă de 3 modele cu UV PVC stabilizate, grafice pe punte cu brandingul resortului și un program de livrare etapizat. S-a oferit instruire pentru personal și un kit dedicat de piese de schimb per resort.
    result: 180 de unități livrate în 5 resorturi. Comandă repetată pentru 2 noi proprietăți. Reducere de 40% a costului per unitate comparativ cu furnizorii anteriori.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Caiac
      - RIB
      - Ospitalitate
    outcome_metrics:
      - label: Unități Livrate
        value: 180
      - label: Resorturi
        value: '5'
      - label: Reducere de Cost
        value: 40%
  - id: southeast-asia-search-rescue
    client: Agenția Maritimă din Asia de Sud-Est
    product: Flotă de Patrulare și Salvare RIB
    industry: Guvern / Securitate Maritimă
    challenge: O agenție guvernamentală de maritime a necesitat 20 de ambarcațiuni de patrulare și salvare RIBs cu material textil rezistent la foc Hypalon, podele cu auto-evacuare a apei, suporturi integrate pentru consolă VHF/radio și conformitate cu standardele SOLAS Capitolul III pentru ambarcațiuni de salvare.
    solution: Au fost fabricate 20 de RIBs cu tuburi CSM Hypalon, carene din aluminiu de calitate marină, ochiuri de remorcare rezistente și pachete de lumini de navigație preinstalate. Echipa de inspecție a fabricii a asistat la teste pe mare. Pachet complet de documentație SOLAS furnizat.
    result: Contractul a fost livrat în 4 luni. Flota a fost desfășurată pentru patrularea frontierei, căutare și salvare, și intervenții în caz de dezastru în 3 baze regionale.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Guvern
      - SOLAS
    outcome_metrics:
      - label: Ambarcațiune de Patrulare RIBs
        value: '20'
      - label: Livrare
        value: 4 luni
      - label: Baze
        value: '3'
  - id: european-dtc-ecommerce
    client: Brandul European DTC Watersports
    product: SUP + Linie de accesorii de marcă
    industry: Comerț electronic / Retail
    challenge: Un brand DTC de sporturi nautice în creștere rapidă avea nevoie de un SUP pachet complet (placă, pompă, vâslă, lesă, geantă) cu ambalaje premium, concepute pentru satisfacerea comerțului electronic — direct către consumator prin DHL/FedEx, fără daune.
    solution: A dezvoltat o linie de produse co-branduite cu modelare personalizată a miezurilor EPS, drop-stitch tehnologie proprietară pentru presiune mai mare și cutii ondulate cu pereți dubli gata de vânzare cu inserție. Autenticitate integrată bazată pe cod QR și înregistrare garanție.
    result: Linia 3-model SUP lansată în 75 de zile. 15.000+ de unități în primele 12 luni. Evaluare medie de 4,8★ pe 2.000 de+ recenzii. Rată de daune de 0,3% în timpul transportului.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - Comerț electronic
    outcome_metrics:
      - label: Modele
        value: '3'
      - label: Unități
        value: 15,000+
      - label: Rating mediu
        value: 4.8★
      - label: Rata de daune
        value: 0.3%
certifications:
  - name: CE
    body: Uniunea Europeană
    desc: Produsele au CE certificare conform directivelor UE aplicabile — ambarcațiuni de recreere conform EN ISO 6185, dispozitive personale de plutire conform EN ISO 12402, acolo unde este cazul.
  - name: ISO 9001
    body: SGS / BSI
    desc: Sistem de management al calității certificat pentru proiectarea, fabricarea și distribuția ambarcațiunilor gonflabile.
  - name: BSCI
    body: amfori
    desc: Certificare de conformitate socială care demonstrează producția etică, munca echitabilă și siguranța la locul de muncă.
  - name: REACH
    body: Agenția Europeană pentru Substanțe Chimice
    desc: Toate materialele respectă REACH reglementările privind siguranța chimică. Documentația este furnizată la fiecare transport.
  - name: RoHS
    body: Uniunea Europeană
    desc: Restricționarea conformității cu substanțele periculoase la toate componentele electronice și electrice.
  - name: AS 1799
    body: Standards Australia
    desc: Standardul australian pentru bărcile gonflabile — testate și certificate pentru utilizare comercială în apele Au/Noua Zeelandă.
