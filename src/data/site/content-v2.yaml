- slug: winter-paddle-boarding
  category: guide
  type: safety
  title: 'Winter Paddle Boarding: Gear, Safety, and Technique for Cold Water'
  description: 'Winter SUP requires specialized gear and preparation. Wetsuit thickness, cold-water safety, board considerations, and technique adjustments for cold-weather paddling.'
  definition: 'Winter paddle boarding is SUP in water temperatures below 15C, requiring thermal protection (wetsuit or drysuit), cold-water safety protocols, and equipment adapted for cold conditions.'
  tldr: 'Water below 15C requires a wetsuit: 5/4/3mm for 8-14C, 4/3mm for 12-18C. Add boots, gloves, and a hood below 10C. Inflate boards to max PSI — cold air reduces pressure. Wear bright colors for visibility in low light. Never paddle alone. Carry a phone in a waterproof case.'
  problem: 'You want to SUP year-round but winter conditions present challenges — cold water, shorter days, winter gear requirements. Without proper preparation, winter sessions are cold, short, and potentially dangerous.'
  explanation: "Cold water conducts heat 25x faster than cold air. A fall into 8C water causes immediate cold shock and rapid muscle cooling. The body's first priority is survival, not paddling. Winter paddling requires thermal protection that maintains mobility — a balance between warmth and range of motion."
  solution: 'Gear checklist: 5/4/3mm wetsuit with chest zip, 5mm boots, 3mm gloves, neoprene hood, PFD (provides extra thermal insulation), phone in waterproof case, whistle. Technique: paddle closer to shore, tell someone your route, check weather carefully. Warm-up after: have dry clothes and warm drinks ready.'
  recommendation: 'The Aquafarer Wetsuit Pro 5/4/3mm with thermal lining is ideal for winter SUP. Add Aquafarer 5mm boots and 3mm gloves. Wear the Life Vest Pro for extra core warmth and safety.'
  faq:
    - q: Can I use a SUP in freezing temperatures?
      a: Yes, but avoid ice formation on the board. Ice can damage PVC. Do not paddle if ice is forming on the water surface.
    - q: Do I need a special board for winter?
      a: No, your regular inflatable SUP works fine. Cold air reduces PSI — inflate to max pressure. The board will feel slightly stiffer.
    - q: Is it safe to SUP alone in winter?
      a: No — always paddle with a buddy in cold water. Hypothermia can set in within minutes after a fall.
    - q: How do I warm up mid-session?
      a: Wear a layered approach — neoprene hood, boots, and gloves can be removed if you get warm. Keep a thermos of warm drink on shore.
