  title: 'Wetsuit Care: Make Your Neoprene Last 2x Longer'
  description: 'Proper wetsuit care extends life from 1 season to 3+. Rinsing, drying, storage, and repair tips for neoprene wetsuits. Avoid common mistakes that destroy wetsuits prematurely.'
  definition: 'Wetsuit care involves rinsing with fresh water after each use, drying away from direct sunlight, storing flat or hung on a wide hanger, and periodic cleaning to remove salt, bacteria, and odors.'
  tldr: 'Rinse your wetsuit inside and out with fresh water immediately after each session. Dry inside-out in the shade on a wide plastic hanger. Store flat or folded in a cool, dry place. Never leave wetsuits in direct sun, hot cars, or dryers. Use wetsuit shampoo every 5-10 sessions.'
  problem: 'After one season, your wetsuit smells, neoprene has lost elasticity, seams are peeling, and the zipper sticks — all preventable with proper care.'
  explanation: 'Salt crystals embed in neoprene and abrade the material. Bacteria multiply in damp interiors, producing odors and breaking down neoprene. UV degrades the nylon coating. Heat above 50C causes delamination. Improper drying distorts neoprene and stresses seams.'
  solution: 'After each session: rinse thoroughly inside and out, turn inside-out, hang on wide plastic hanger in shade. Once dry, turn right-side out and store flat. Every 5-10 sessions: wash with wetsuit shampoo. Monthly: lubricate zipper with zipper wax.'
  recommendation: 'Use Aquafarer Wetsuit Shampoo for cleaning and Aquafarer Zipper Wax for zipper maintenance. Store on the Aquafarer wide hanger in the mesh bag.'
  faq:
    - q: Can I put my wetsuit in the washing machine?
      a: Not recommended — machine washing damages neoprene. If you must, use gentle cycle, cold water, and a mesh bag.
    - q: How do I get the smell out of my wetsuit?
      a: Soak in cool water with wetsuit shampoo or white vinegar for 30 minutes. Rinse thoroughly.
    - q: How should I dry my wetsuit?
      a: Inside-out in the shade on a wide, padded plastic hanger. Avoid direct sunlight and metal hangers.
    - q: Can I repair a torn wetsuit?
      a: Small tears under 1\" can be repaired with neoprene cement and a patch. Larger tears may require professional repair.
