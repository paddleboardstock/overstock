- slug: surfboard-size-guide
  category: guide
  type: buying-guide
  title: Surfboard Size Guide (Volume Is What Actually Matters)
  description: Stop guessing surfboard sizes. Volume in liters determines everything — how easily you catch waves, how stable you feel, and how fast you progress. Find your target liters in 2 minutes.
  definition: Surfboard size is primarily about volume (liters), not length. Volume determines float and wave-catching ability. Longer boards paddle faster; wider boards are more stable; thicker boards offer more volume without added length.
  tldr: 'Surfboard size is about volume, not just length. Beginners need 60-80 liters, intermediates 35-55 liters, and advanced surfers 20-35 liters. Use your weight as the primary factor: every 10 kg needs roughly 10-12 liters of volume at the beginner level.'
  problem: Standing in front of a rack of surfboards with numbers like 7'2" x 22" x 3" printed on the rail, you have no idea what those measurements feel like in the water. Buying based on looks or what a friend rides leads to a board that is either too unstable or too hard to paddle.
  explanation: "A surfboard's size is best understood through three dimensions: length (paddle power and wave catch), width (stability), and thickness (volume and float). The real number that matters is volume in liters. Foam boards and inflatables achieve high volume through width and thickness rather than excessive length, making them manageable for beginners. As you improve, you reduce volume to allow the board to sink deeper into the wave face and turn more responsively."
  solution: 'Use a volume-to-weight calculator: for beginners, divide your weight in kg by 1.5 to get target liters. For intermediate, divide by 2. Intermediates should look for boards with moderate rocker and a squash or round tail for versatility.'
  recommendation: The Aquafarer Surfboard Pro offers 75 liters of volume in a 10'6" package — ideal for beginners up to 90 kg. Lighter riders can size down to the SUP Tour 12 for a more maneuverable feel as they progress.
  faq:
    - q: Does height matter for surfboard size?
      a: Height matters less than weight. A tall, light surfer needs less volume than a short, heavy surfer of the same height. Use weight as your primary metric and adjust for fitness and paddle strength.
    - q: What happens if my board has too much volume?
      a: Too much volume makes the board feel corky and unstable on the wave face. You will struggle to sink the rail for turns and may bounce off the water during bottom turns.
    - q: What happens if my board has too little volume?
      a: You will struggle to paddle into waves, sink too deep on the takeoff, and feel unstable just sitting on the board waiting. Beginners almost always need more volume than they think.
    - q: How do I know when to size down?
      a: When you can consistently catch waves, pop up smoothly, and make basic turns on your current board, it is time to drop 5-10 liters. Sizing down too early slows your progress.
