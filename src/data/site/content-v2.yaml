- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Anchor Guide: Stay in Place While Fishing or Photography'
  description: 'Complete guide to SUP anchoring — anchor types (mushroom, folding, stake), anchor trolley setup, deployment techniques, and safety considerations for staying in position.'
  definition: 'A SUP anchor is a weight attached to a rope that holds the board in position against wind and current. Common types include mushroom anchors, folding anchors, and stake-out poles.'
  tldr: 'Use a mushroom anchor (1.5-3 lb) for muddy or sandy bottoms, a folding anchor for rocky bottoms, or a stake-out pole for shallow water with soft bottoms. The anchor should be 1.5-3 lb for calm conditions, 3-5 lb for wind and current. Always use an anchor trolley to adjust position and know when to release.'
  problem: 'You find the perfect fishing spot but wind and current drift you off position every few minutes. Without anchoring, SUP fishing and photography are frustrating exercises in constant repositioning.'
  explanation: 'An anchor works by dragging across the bottom until it catches. Mushroom anchors bury into soft bottoms and provide good holding in sand and mud. Folding anchors have flukes that dig into hard or rocky bottoms. Stake-out poles work in shallow water by pushing into the bottom directly.'
  solution: "Install an anchor trolley system (a line with a sliding ring on one side of the board) to adjust the anchor attachment point. Attach 50-75' of rope to the anchor. Deploy upwind or up-current of your desired position. Use a quick-release system to detach in emergencies. Never anchor in strong current or where you cannot easily retrieve the anchor."
  recommendation: "A 3 lb folding anchor with 50' of rope works for most SUP fishing conditions. Add an anchor trolley system using the D-rings on your Aquafarer SUP Explorer 11."
  faq:
    - q: What size anchor do I need for SUP?
      a: 1.5-3 lb for calm lakes and slow rivers. 3-5 lb for coastal areas with wind or current. Oversized anchors are difficult to retrieve.
    - q: How much anchor line do I need?
      a: "A 5:1 scope (5 feet of line for every 1 foot of depth) is standard. In 10' of water, use 50' of line."
    - q: Is anchoring dangerous on a SUP?
      a: Only if you anchor in current or wind strong enough to capsize the board. Always use a quick-release system that can be detached instantly.
    - q: Can I anchor in any water?
      a: Check local regulations. Some areas restrict anchoring to protect seagrass or marine habitats. Never anchor on coral reefs.
