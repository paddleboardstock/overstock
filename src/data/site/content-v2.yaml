- slug: marine-life-vest-guide
  category: guide
  type: buying-guide
  title: 'Marine Life Vest Guide: Choose the Right PFD for Your Water Activity'
  description: 'Complete life vest buying guide for SUP, kayaking, RIB boating, and sailing. PFD types (foam vs inflatable), fit guidelines, legal requirements, and features for each activity.'
  definition: 'A life vest or personal flotation device (PFD) is a piece of safety equipment designed to keep a person afloat in water. Types range from Type I (offshore) to Type V (special use).'
  tldr: 'Choose PFD by activity: inflatable belt pack for SUP, foam vest for kayaking, Type III foam for RIB and powerboats. Key features: USCG or ISO approval, reflective panels, rescue whistle, D-ring for tether, bright colors.'
  problem: 'You see rows of life vests ranging from $20 to $300 and have no idea which is appropriate for your activity or meets legal requirements.'
  explanation: 'Life vests are categorized by type: Type I (offshore, turns unconscious wearer face-up), Type II (near-shore), Type III (flotation aid, most common), Type IV (throwable), Type V (special use). Inflatable vests use CO2 cartridges — less bulky but require maintenance. Foam vests are maintenance-free but bulkier.'
  solution: 'For SUP: choose an inflatable belt pack or vest (33 lb buoyancy). For kayaking: Type III foam with high arm cutouts. For RIB: Type III foam or inflatable with 22+ lb buoyancy, reflective tape, and rescue whistle.'
  recommendation: 'The Aquafarer Life Vest Pro (inflatable, 33 lb) is ideal for SUP and kayaking. The Aquafarer Life Vest Classic (foam, Type III) is perfect for RIB boating and general marine use.'
  faq:
    - q: Do I need a life vest for SUP?
      a: Yes — legally required in many jurisdictions and always recommended. Wear an inflatable belt pack or vest for paddle sports.
    - q: Are inflatable life vests safe?
      a: Yes, with proper maintenance. Check the CO2 cartridge annually, replace the bobbin every 2-3 years.
    - q: What life vest is best for a child?
      a: A USCG-approved Type II or III foam vest with collar, crotch strap, and bright colors. Never use inflatable vests for children.
    - q: How should a life vest fit?
      a: Snug — the vest should not lift above the ears when lifted by the shoulders. All zippers and buckles fastened.
