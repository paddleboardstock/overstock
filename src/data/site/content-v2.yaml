- slug: sup-navigation-guide
  category: guide
  type: safety
  title: 'SUP Navigation: Staying on Course and Finding Your Way'
  description: 'Basic navigation skills for SUP paddlers — reading charts, using landmarks, understanding buoy systems, and using GPS and compass for safe paddling.'
  definition: 'SUP navigation involves using landmarks, charts, GPS, and awareness of wind and current to travel safely and return to your starting point.'
  tldr: 'Always pick a landmark on the horizon when paddling straight. Check it every few minutes to correct drift. Use GPS apps on your phone in waterproof case. Learn basic compass navigation. Understand lateral buoy systems (red-right-returning). File a float plan with someone on shore.'
  problem: 'You paddle out on open water and when you turn around, the shoreline looks completely different. Without navigation skills, you can become disoriented and paddle in the wrong direction.'
  explanation: 'Navigation on SUP relies on visual references because you are close to the water. Pick a distinctive landmark (building, tree, cliff) behind your launch point. Use it as a back-bearing to return. Wind and current will push you off course — correct continuously. For longer trips, use a GPS app or watch. Understand that the shoreline looks different from the water than from land.'
  solution: 'Before launching: identify 2-3 landmarks at different distances behind your launch point. Use a GPS app (Google Maps, Gaia GPS) in airplane mode to save battery. Know the wind and tide direction — paddle upwind/up-current first. For open water crossings, use a compass bearing.'
  recommendation: 'Keep a phone in a waterproof case for GPS backup. Practice landmark navigation in familiar waters before venturing to new locations. The Life Vest Pro has a pocket suitable for a phone.'
  faq:
    - q: What landmarks are best for SUP navigation?
      a: Distinctive, permanent features like water towers, tall buildings, unique trees, or prominent cliffs. Avoid boats or flags that move.
    - q: How do I navigate in fog?
      a: Do not paddle out in fog. If caught in fog, use a GPS or compass to navigate. Sound a whistle every 30 seconds. Stay near shore.
    - q: Do I need a marine chart for SUP?
      a: For coastal paddling, a simple chart helps identify hazards, depths, and navigation channels. Many apps provide this information.
    - q: How do I navigate around boats?
      a: Stay in shallow water away from channels. Wear bright colors. Cross channels quickly and at a 90-degree angle. Make eye contact with boat operators.
