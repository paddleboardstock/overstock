- slug: surfing-safety-tips
  category: problem
  type: safety
  title: 'Surfing Safety: The 7 Mistakes That Cause 90% of Beginner Accidents'
  description: Most surf accidents are preventable. Learn the 7 critical safety mistakes beginners make, how to spot rip currents before paddling out, and the equipment checks that save lives.
  definition: Surf safety means understanding rip currents (channels of water flowing seaward), never surfing alone, checking equipment before each session, and matching conditions to your skill level. Most accidents are preventable with basic knowledge.
  tldr: Check surf conditions and weather before paddling out. Learn to identify rip currents — they look like calm, dark channels between breaking waves. Never surf alone, always warm up on the beach, and inspect your leash and board for damage before every session.
  problem: The ocean looks inviting but hides dangers that beginners cannot see. Rip currents pull you offshore, shallow sandbars change daily, and your leash can snap at the worst moment. Without basic safety knowledge, a fun session turns into an emergency.
  explanation: Rip currents are the leading cause of surf rescues. They form when water pushed ashore by waves flows back out through a channel. Rips do not pull you under — they pull you out. The key is to stay calm and swim parallel to the beach until you exit the rip, then ride breaking waves back in. Beyond rips, surfers face collisions with other surfers or their own board, hypothermia in cold water, and muscle cramps from paddling without warming up.
  solution: 'Spend 10 minutes on the beach before entering the water: watch the wave pattern, identify where rips are forming, and pick a safe entry point. Stretch your shoulders, back, and legs. Check your leash attachment and ensure the rail of your board has no sharp dings. Paddle out with a clear exit plan and keep an eye on your position relative to landmarks.'
  recommendation: Take a surf safety course or read through the ocean safety basics guide before your first session. Carry a whistle and surf with a buddy. If you are unsure about conditions, do not go out — the waves will still be there tomorrow.
  faq:
    - q: What should I do if I get caught in a rip current?
      a: Stay calm, conserve energy, and do not fight the current. Swim parallel to the beach (along the shoreline) until you are out of the rip, then use the waves to get back in. Signal for help if needed by raising one arm.
    - q: How do I spot a rip current?
      a: Look for a channel of calmer, darker water between breaking waves. Foam or debris moving out to sea, or a gap in the wave line, also indicates a rip. Discolored water from stirred sand is another sign.
    - q: Is it safe to surf alone?
      a: It is always safer to surf with at least one other person. If you must surf alone, choose a mellow break, tell someone on shore where you are going, and stay within your limits. Carry a phone in a waterproof pouch.
    - q: How do I keep my board from hitting someone?
      a: Never let go of your board between waves — always keep one hand on it. If you wipe out, cover your head and curl into a ball. Choose a soft-top or inflatable board like Aquafarer for your first year to minimize injury risk.
    - q: When should I not go surfing?
      a: Do not surf if the waves are above your skill level, if a rip current warning is in effect, if there is lightning, if you are overly tired, or if you have consumed alcohol. Know your limits and respect the ocean.
