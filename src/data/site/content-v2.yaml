- slug: understanding-tides
  category: guide
  type: technical
  title: 'Understanding Tides for Water Sports: A Practical Guide'
  description: 'How tides affect SUP, surfing, and kayaking conditions. Reading tide charts, understanding spring vs neap tides, and planning your session around tidal movements for safety.'
  definition: 'Tides are the daily rise and fall of sea levels caused by the gravitational pull of the moon and sun. Tidal range varies by location and lunar cycle.'
  tldr: 'Two high and two low tides daily in most locations. Spring tides (full/new moon) have larger ranges and stronger currents. Neap tides (quarter moon) have smaller ranges. Tide affects water depth, wave shape, and current strength. For SUP: paddle against current first so it helps you return.'
  problem: 'You arrive at your local break to find barely any surf, dangerous rips from outgoing tide, or water too shallow. Without understanding tides, you waste trips or paddle out in dangerous conditions.'
  explanation: "Tides are caused by the moon's gravity. Spring tides (full and new moon) produce highest highs and lowest lows. Neap tides (quarter moon) produce minimal range. Tidal currents are fastest at mid-tide, slack at high and low. Tidal range varies from 0.3m (Mediterranean) to 16m (Bay of Fundy)."
  solution: 'Check the tide chart before every session. For surfing: beach breaks often work best 2-3 hours either side of high tide. For SUP: paddle against the current first half so current assists return. For fishing: incoming tide pushes fish onto flats.'
  recommendation: "Use NOAA tide predictions or a local tide app. Learn your local break's tide preference by logging conditions over a month."
  faq:
    - q: What is a spring tide?
      a: Spring tides occur during full and new moons, producing higher high tides and stronger currents. They occur twice monthly.
    - q: What is a neap tide?
      a: Neap tides occur during quarter moons. The tidal range is smaller, and currents are weaker — good for beginners.
    - q: Are low tides dangerous for SUP?
      a: Low tide can expose rocks and reefs. It also concentrates wave energy on steeper sandbars.
    - q: How do tides affect rip currents?
      a: Outgoing tides (ebb) strengthen rip currents. Incoming tides (flood) reduce rip strength.
