- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: What to Wear for Surfing (Don't Show Up in Board Shorts When You Need a 5/4)
  description: Stop guessing what to wear. Water temperature not air temperature determines your surf attire. Complete layering guide from tropical rash guards to full winter 5/4/3mm setups.
  definition: Surf attire ranges from board shorts and rash guards in warm water to full 5/4/3mm wetsuits with boots and hoods in cold water. Water temperature, not air temperature, determines what you need.
  tldr: What you wear surfing depends entirely on water temperature — not air temperature. Rash guards and board shorts work above 22°C, spring suits cover 18-22°C, full 3/2mm suits handle 14-18°C, and 5/4/3mm with boots is required below 14°C. Always wear UV protection and consider a leash and impact vest.
  problem: You arrive at the beach and have no idea whether a rash guard is enough or if you need a full wetsuit. Air temperature is warm but the water is cold, or the water feels okay but the wind is freezing. Dressing wrong means a ruined session.
  explanation: 'Surfing attire serves three purposes: thermal insulation, UV protection, and abrasion prevention. Neoprene wetsuits are rated by thickness and coverage — spring suits (short arms or legs) are for borderline days, full suits for cold water. Rash guards protect against board rash and sun but offer no thermal value. Boots, gloves, and hoods are not accessories but essential gear for cold-water surfing below 12°C.'
  solution: 'Check the local buoy or live water temperature report before heading out. Build a kit based on your coldest typical condition: rash guard and shorts for summer, a 3/2mm full suit for spring and autumn, a 5/4/3mm with boots and hood for winter. Always add a leash and consider a flotation vest for safety.'
  recommendation: Invest in a good 3/2mm full suit first — it covers the widest range of conditions. Add a 5/4/3mm suit and boots if you plan to surf through winter. The Aquafarer Wetsuit Pro with thermal lining bridges both temperature ranges effectively.
  faq:
    - q: Can I surf in just board shorts?
      a: Yes, in tropical water above 24°C. You may want a rash guard to prevent chest and arm chafing from paddling. Wax or a traction pad on the board helps compensate for the lack of suit grip.
    - q: Do I need surf boots?
      a: If water temperature drops below 14°C, boots prevent numbness and protect your feet from rocks and reef cuts. They also add traction on the board. Most surfers in northern climates use boots from November through March.
    - q: What is a spring suit?
      a: A spring suit is a short-arm or short-leg wetsuit (or both) designed for water between 18°C and 22°C. It offers more warmth than a rash guard but less coverage than a full suit.
    - q: Should I wear a life vest while surfing?
      a: Not traditional life vests, but an impact vest or flotation aid can help in rough conditions or if you are a weak swimmer. Aquafarer life vests are designed for SUP and kayaking but can provide extra flotation confidence for surf beginners.
