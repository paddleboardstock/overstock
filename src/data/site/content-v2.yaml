- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Surf Etiquette Rules (How to Not Be the Person Everyone Avoids)
  description: The lineup has rules and nobody writes them down. Learn right of way, why snaking will get you yelled at, how to apologize, and the beginner mistakes that annoy every local surfer.
  definition: 'Surf etiquette is an unwritten code of conduct that prevents collisions and shares waves fairly. The core rule: the surfer closest to the peak of the breaking wave has right of way.'
  tldr: The surfer closest to the peak of the breaking wave has right of way. Do not drop in on someone, do not snake (paddle around someone to take their wave), and always apologize if you make a mistake. Paddle wide around the lineup, hold onto your board, and be friendly — respect earns respect.
  problem: You paddle out to a crowded lineup and immediately sense tension. Surfers look at you sideways, someone yells at you, and you are not sure what you did wrong. The social side of surfing feels more intimidating than the waves themselves.
  explanation: 'Surf etiquette exists to prevent collisions and share waves fairly. The fundamental rule is right of way: the surfer closest to the peak (where the wave first breaks) has priority. Anyone paddling for the same wave from further inside must pull out. Snaking — paddling around another surfer to steal priority — is considered the worst offense. Beyond priority, the lineup has expectations about noise (keep shouting to a minimum), board control (never let your board go near others), and friendliness (a simple nod goes a long way).'
  solution: Watch the lineup for 10 minutes before paddling out. Identify who is catching the most waves — those are the surfers to respect and avoid. Stay to the inside (white water zone) if you are learning. Paddle wide around the lineup, not through it. When you do catch a wave, look both ways before popping up and make sure nobody is deeper.
  recommendation: Spend your first few sessions at a beginner-friendly break with spread-out crowds. Learn to read priority before you attempt a busy lineup. If you do drop in on someone, apologize immediately and paddle over — most surfers respect an honest mistake.
  faq:
    - q: What is dropping in?
      a: Dropping in means paddling for and riding a wave that another surfer already has priority on. It is dangerous and disrespectful. The surfer closest to the peak owns the wave; anyone else must pull off.
    - q: What is snaking?
      a: Snaking is paddling around another surfer who is already in position for a wave so that you end up closer to the peak. It is considered extremely poor etiquette and can lead to confrontation.
    - q: Can beginners surf at crowded breaks?
      a: Yes, but stay in the white water zone away from the peak. Do not paddle into the main takeoff area until you can consistently catch waves and control your direction. Crowded lineups require experience to navigate safely.
    - q: How do I apologize in the water?
      a: A simple wave, smile, and "my bad" or "sorry" works. Acknowledge the mistake and paddle away from the person. Surfers are generally forgiving of honest errors, especially if you are clearly learning.
    - q: What should I do if someone drops in on me?
      a: If it is a clear drop-in, shout "wave" or "hey" to alert them. If they catch it by accident and apologize, let it go. If someone repeatedly drops in, paddle over and politely explain priority. Avoid confrontations.
