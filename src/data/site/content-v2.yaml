- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Wetsuit Repair: Fix Tears, Seams, and Zippers Yourself'
  description: 'DIY wetsuit repair guide for neoprene tears, seam separation, zipper jams, and split kneepads. Step-by-step instructions using neoprene cement.'
  definition: 'Wetsuit repair involves cleaning and roughing the damaged area, applying neoprene cement, and curing under pressure to restore watertight integrity and flexibility.'
  tldr: 'Small tears under 1": apply neoprene cement to both sides, wait 10-15 minutes until tacky, press firmly, cure under weight for 12 hours. Larger tears need a neoprene patch. Zipper issues: lubricate first, then check for fabric jams.'
  problem: 'Your wetsuit has a small tear, a seam separating, or a zipper that sticks. Without DIY repair, you pay $150+ for a replacement when the fix costs $5.'
  explanation: 'Neoprene cement works by softening the neoprene surface, creating a chemical bond as the solvent evaporates. Cement must be applied to both surfaces and become tacky before joining. For tears, edges must align precisely. Zipper issues are often salt corrosion or fabric caught in teeth.'
  solution: 'For tears: clean with alcohol, lightly sand, apply thin cement layer to both edges, wait until tacky, press together perfectly, apply weight, cure 12-24 hours. For patches: cut patch 1" larger than tear, apply cement to both, clamp. For zipper: rinse, apply zipper wax, work gently.'
  recommendation: 'Keep an Aquafarer wetsuit repair kit in your gear bag. For large repairs or seam failures at critical points, professional repair is recommended.'
  faq:
    - q: Can I use super glue on a wetsuit?
      a: No — super glue dries hard and brittle. Use only neoprene cement or aquaseal for wetsuit repairs.
    - q: How long does a neoprene cement repair last?
      a: A properly done repair is often stronger than the original neoprene and lasts the remaining life of the suit.
    - q: Can I repair a zipper that has fully separated?
      a: If the track has separated from neoprene, reglue with contact cement. If teeth are damaged, replace the zipper professionally.
    - q: How do I fix a wetsuit leaking at the seam?
      a: Apply a thin bead of aquaseal along the inside of the leaking seam and let cure for 24 hours.
