- slug: sup-launch-techniques
  category: guide
  type: tutorial
  title: 'SUP Launch Techniques: How to Start Your Paddle Session Right'
  description: 'Proper SUP launch techniques for different shore types — sandy beaches, rocky shores, docks, and river banks. Avoid the awkward stumble and start every session smoothly.'
  definition: 'SUP launch technique is the method of transitioning from shore to water while maintaining balance and board control. Different shore types require different approaches.'
  tldr: "Sandy beach: place board at water's edge, step on, paddle away. Rocky shore: walk board through shallow water before mounting. Dock: sit on board from dock, use paddle to push off. River bank: launch downstream at an angle. Always attach leash before entering water."
  problem: "You inflate your board and walk to the water's edge, then realize you have no idea how to get on without looking clumsy or falling immediately."
  explanation: 'Launch technique varies by shore type. On sandy beaches, the easiest approach is to place the board parallel to shore in ankle-deep water, step on, and paddle straight out. On rocky shores, you need to walk the board out to knee-deep water before mounting to avoid damaging the board. From docks, sit on the board while on the dock, then push off.'
  solution: 'Sand launch: place board perpendicular to shore, step on with one foot, push off with the other, kneel, then stand. Rock launch: carry board to knee-deep water, mount from behind. Dock launch: place board parallel to dock, sit on board from dock, push off gently.'
  recommendation: "Practice launches in calm conditions first. The Aquafarer SUP Explorer 11's wide platform makes launching easier. Always attach the leash before stepping on the board."
  faq:
    - q: How do I launch in surf?
      a: Wait for a lull between wave sets. Place board in ankle-deep water, jump on quickly, paddle hard to get past the break zone before the next set.
    - q: Can I launch from any beach?
      a: Check access points and local regulations. Some beaches have designated launch areas. Avoid launch areas with swimmers.
    - q: How do I land?
      a: Approach perpendicular to shore. Step off the board into shallow water as soon as the fins touch bottom. Carry the board above the waterline.
    - q: What if there is a strong shore break?
      a: Time your launch between waves. Hold the board firmly sideways to the waves. If the break is too strong, find a different launch point.
