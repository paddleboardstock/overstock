- slug: sup-safety-guide
  category: guide
  type: safety
  title: 'SUP Safety Guide: Essential Rules for Every Paddler'
  description: 'Complete SUP safety guide covering weather checks, equipment, self-rescue, navigation rules, and what to do if conditions turn dangerous. Stay safe on your paddle board.'
  definition: 'SUP safety encompasses pre-trip planning (weather, tides, equipment checks), on-water practices (leash, PFD, navigation), and emergency procedures (self-rescue, signaling, hypothermia prevention).'
  tldr: 'Always wear a leash and PFD. Check wind forecast — offshore wind is dangerous. Paddle upwind first so the wind helps you return. Carry a whistle, phone in waterproof case, and water. Learn self-rescue. Never SUP alone in remote areas.'
  problem: 'SUP appears deceptively simple. Beginners underestimate how quickly wind, current, and fatigue can turn a fun session dangerous.'
  explanation: 'The board acts as a sail in wind, making downwind paddling easy but return against wind extremely difficult. The standing position increases fall risk. Fatigue accumulates faster than kayaking. Leashes prevent separation from the board. PFDs keep you afloat if injured.'
  solution: 'Pre-trip: check wind (max 10 knots for beginners), direction (avoid offshore), and tide. Tell someone your route. On water: kneel to paddle into strong wind. If separated, swim to board. For self-rescue: place paddle across board, kick legs, pull chest onto board, swing legs up.'
  recommendation: 'Use the Aquafarer Life Vest Pro (inflatable) for SUP. Attach the coiled SUP leash to your calf. Practice self-rescue in calm conditions before you need it.'
  faq:
    - q: What wind speed is safe for SUP?
      a: 'Beginners: under 10 knots. Intermediate: 10-15 knots. Advanced: 15-20 knots. Over 20 knots is dangerous for all levels.'
    - q: Do I need a life vest for SUP?
      a: Yes — legally required in many jurisdictions and always recommended for safety.
    - q: What should I do if I cannot get back to shore?
      a: Stay with your board (it is flotation). Signal with whistle. If being blown offshore, paddle at 45 degrees to the wind.
    - q: How do I practice SUP self-rescue?
      a: 'In calm shallow water: intentionally fall off, swim to board, practice re-mounting repeatedly.'
