- slug: life-jacket-buying-guide
  category: guide
  type: buying-guide
  title: 'Life Jacket Buying Guide: Types, Fit, and Features Explained'
  description: 'Complete life jacket buying guide for water sports. PFD types (I through V), inflation vs foam, fit testing, and specific recommendations for SUP, kayaking, boating, and fishing.'
  definition: "A life jacket or PFD is a flotation device designed to keep a person's head above water. Types are regulated by US Coast Guard based on buoyancy and intended use."
  tldr: 'Five PFD types: Type I (offshore, 22+ lb), Type II (near-shore), Type III (flotation aid, most common), Type IV (throwable), Type V (special use). Inflatable vests offer comfort but require CO2 cartridge maintenance. Foam vests are maintenance-free but bulkier.'
  problem: 'Life jackets are categorized by types and buoyancy ratings, but stores do not always explain which type suits your activity.'
  explanation: 'Type I provides most buoyancy and turns unconscious wearer face-up. Type II may not turn all wearers face-up. Type III allows freedom of movement for active sports. Type V includes inflatable belt packs for SUP. Inflatable PFDs provide 33-37 lb buoyancy and are compact when deflated.'
  solution: 'For SUP: Type V inflatable belt pack. For kayaking: Type III foam with high arm cutouts. For RIB boating: Type III foam or inflatable with 22+ lb buoyancy. For children: Type II or III foam with crotch strap.'
  recommendation: 'Aquafarer Life Vest Pro (inflatable Type V, 33 lb) for SUP and kayak. Aquafarer Life Vest Classic (foam Type III, 16.5 lb) for RIB boating and general marine use.'
  faq:
    - q: What PFD type do I need for SUP?
      a: Many jurisdictions accept Type III or Type V for SUP. Inflatable belt packs are popular. Check local laws.
    - q: Do inflatable PFDs need maintenance?
      a: Yes — check CO2 cartridge annually, replace bobbin every 2-3 years, rinse after saltwater use.
    - q: Can I wear a foam PFD for SUP?
      a: Yes, but choose one with high arm cutouts. Foam vests are bulkier but require no maintenance.
    - q: What PFD is best for a child?
      a: USCG-approved Type II or III foam vest with collar, crotch strap, and bright colors. Never use inflatable PFDs for children.
