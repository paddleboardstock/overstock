- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: 3mm vs 5mm Wetsuit (What Actually Works in Cold Water Surfing)
  description: The 3mm vs 5mm wetsuit decision depends on water temperature not air temperature. Temperature chart, flexibility comparison, and which thickness keeps you warm without restricting your paddle.
  definition: A 3mm wetsuit suits water 14-20°C with good flexibility. A 5mm suit covers 8-14°C with maximum warmth but reduced mobility. The choice is a direct tradeoff between warmth and range of motion.
  tldr: 3mm wetsuits are for water 14-20°C and offer maximum flexibility. 5mm suits are for 8-14°C and prioritize warmth. Choose based on your local water temperature, not air temperature. If you surf across seasons, own both. If you can only buy one, a 4/3mm offers the best middle ground.
  problem: You need a wetsuit but cannot decide between a 3mm and a 5mm. A 3mm might not be warm enough in winter, and a 5mm might be too thick and restrictive for warmer days. Guessing wrong means either freezing through winter or sweating through autumn.
  explanation: 'Neoprene thickness directly correlates to warmth and inversely correlates to flexibility. A 3mm suit (often 3/2mm with thinner arms) provides good mobility for paddling and surfing in mild conditions. A 5mm suit uses thicker neoprene on the torso and often thinner panels on the arms and legs (5/4/3mm) to maintain some flexibility. The warmth difference is about 6-8°C range. Key differences: 5mm suits use more neoprene material, weigh roughly 40 percent more, take longer to dry, and require more effort to take off. Modern super-stretch neoprenes are closing the flexibility gap, but 5mm still restricts movement noticeably.'
  solution: Determine your coldest monthly average water temperature using local buoy data. If it is above 16°C, buy a 3/2mm. If it is between 12-16°C, buy a 4/3mm. If it is below 12°C, buy a 5/4/3mm. For year-round surfing with a single suit, a quality 4/3mm with thermal lining plus a separate hood, boots, and gloves covers the widest range.
  recommendation: The Aquafarer Wetsuit Pro in 5/4/3mm handles 8-16°C with thermal lining to offset the warmth gap of a true 5mm. If you mostly surf in mild conditions (16-20°C), the 3/2mm Aquafarer Wetsuit Pro offers better flexibility and comfort.
  faq:
    - q: Can I wear a 3mm in 10°C water?
      a: Only for very short sessions (20-30 minutes) and with a thermal rash guard underneath. You will be cold for most of the session. A 5mm or 5/4/3mm is strongly recommended for 10°C water.
    - q: Is a 5mm wetsuit too warm for summer?
      a: If summer water temperature exceeds 18°C, a 5mm suit will cause overheating. You can flush the suit with cool water, but you will be more comfortable in a 3/2mm or spring suit during summer months.
    - q: Does a 5mm wetsuit restrict paddling?
      a: Yes, noticeably. The thicker neoprene at the shoulders requires more effort per paddle stroke. A 5/4/3mm suit with thinner arms helps, but you will still fatigue faster than in a 3mm suit.
    - q: What is the best wetsuit for year-round surfing?
      a: A 4/3mm full suit with chest zip and thermal lining covers 12-18°C, which is year-round in many temperate climates. Add boots for winter and you can surf 10-18°C with one suit.
