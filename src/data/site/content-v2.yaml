- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm Wetsuit: What Most Beginners Get Wrong in Cold Water'
  description: Stop freezing mid-session or overheating on the beach. The real difference between 3mm and 5mm wetsuits — temperature chart, flexibility tradeoffs, and what actually works for cold-water surfing.
  definition: A wetsuit is a neoprene garment that traps a thin layer of water against the skin, which body heat warms for insulation. Thickness (3mm, 5mm) determines the temperature range a suit can handle — thicker is warmer but less flexible.
  tldr: Wetsuit thickness directly determines warmth and flexibility. Use 3mm for water above 16°C and 5mm for water between 8°C and 16°C. Thicker suits restrict movement but keep you warm longer — always prioritize fit over brand.
  problem: You open an online store or walk into a surf shop and see wetsuits labeled 3/2, 4/3, 5/4, and 5mm full suits. The numbers do not mean much until you realize that the wrong thickness means either freezing mid-session or overheating and sweating on the beach.
  explanation: Wetsuits work by trapping a thin layer of water between your skin and the neoprene; your body warms that water, creating insulation. Thicker neoprene traps more water but restricts flexibility and buoyancy. A 3mm suit (often 3/2 with thinner arms) suits mild conditions, while 5mm (5/4/3 or full 5mm) suits cold water. Chest zip entries seal better than back zip and reduce flushing. Seam construction — glued and blind-stitched (GBS) — is the difference between a leaky suit and a warm one.
  solution: Match thickness to your local water temperature with a 5°C margin of error. For temperate climates buy a 3/2mm. For cold water buy a 5/4/3mm. Add boots, gloves, and a hood to extend your range by another 5°C downward. Try suits on before buying or choose a brand with a generous return policy.
  recommendation: The Aquafarer Wetsuit Pro in 5/4/3mm is ideal for most cold-water surfers, offering GBS seams and thermal lining. If you surf in warm water above 20°C, a 3/2mm with chest zip is the better choice.
  faq:
    - q: What water temperature requires a 5mm wetsuit?
      a: Water temperatures between 8°C and 14°C call for a 5mm suit. Below 8°C you need a 6/5/4mm hooded suit. Between 14°C and 18°C a 4/3mm works well for most people.
    - q: Can I wear a 3mm wetsuit in winter?
      a: Only in mild winter climates where water stays above 16°C. For real winter surfing, 5mm or 5/4/3mm is necessary. Boots, gloves, and a hood add equivalent warmth without needing a thicker torso.
    - q: How tight should a wetsuit be?
      a: Snug but not restrictive. There should be no air pockets or loose neoprene. If you can slide a finger between your skin and the suit at the lower back, it is too loose. If breathing is difficult or movement is severely restricted, size up.
    - q: Do expensive wetsuits keep you warmer?
      a: Higher price often means better neoprene (limestone-based vs petroleum), better seam construction (GBS vs glued only), and better flex. These factors directly affect warmth and longevity but only if the fit is correct.
