- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Size Guide: Length, Width, and Volume Explained'
  description: 'Find the right SUP size based on your weight, skill level, and paddling style. Length determines tracking, width determines stability, and volume determines weight capacity.'
  definition: 'SUP size is defined by length (speed and glide), width (primary stability), thickness (secondary stability and volume), and volume in liters (total weight capacity).'
  tldr: 'All-around SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Surf: 8''-10'' x 30"-32" (140-220L). Beginners need width over 32" and volume exceeding body weight by 60-80L. Your weight in kg plus 60L is the minimum volume target for stability.'
  problem: Every SUP brand lists boards in feet, inches, and liters, but without knowing how these measurements translate to real-world feel, you risk buying a board that is tippy, slow, or cannot support your weight.
  explanation: 'Length determines how fast the board paddles and how well it tracks in a straight line. Longer boards (12''+) glide between strokes and hold a line. Shorter boards (under 10'') turn easily but require more frequent paddle switches. Width determines primary stability — standing stability. A 30" board feels tippy to beginners; 34" feels like a dock. Thickness determines volume — a thicker board floats higher but catches more wind. Volume in liters is the single best metric: the loaded board (you plus gear) should submerge 2-4 inches at rest.'
  solution: 'Match your board dimensions to three factors: your weight (determines minimum volume), your primary activity (determines length), and your skill level (determines width). For beginners, multiply weight in kg by 2.2 to get minimum liters. For intermediates, multiply by 1.8. For advanced, multiply by 1.4.'
  recommendation: 'The Aquafarer SUP Explorer 11 at 11'' x 33" x 6" with 260L suits most riders up to 100 kg for all-around paddling. Upgrade to the SUP Tour 12 at 12'' x 31" for better touring speed and glide.'
  faq:
    - q: What SUP size do I need for my weight?
      a: 'For riders under 70 kg: 10-11'' x 32" (220-260L). For 70-90 kg: 11-12'' x 33" (260-300L). For 90-110 kg: 11-12'' x 34" (300-350L). For over 110 kg: 12'' x 34-36" (350L+).'
    - q: Is a longer SUP faster?
      a: Yes. Longer boards have a better length-to-width ratio, reducing drag. A 14' touring SUP is significantly faster than an 11' all-around board at the same paddling effort.
    - q: What SUP width is stable for beginners?
      a: '33-34 inches is the sweet spot for beginners up to 90 kg. Below 32" requires good balance. Above 34" is very stable but slower and harder to paddle in wind.'
    - q: Can I use an all-around board for touring?
      a: Yes, for short tours under 10 km. For longer distances, a dedicated touring board tracks better and covers distance more efficiently.
