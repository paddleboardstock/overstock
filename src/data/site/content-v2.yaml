- slug: sup-travel-guide
  category: guide
  type: tutorial
  title: 'Traveling with an Inflatable SUP: Complete Guide'
  description: 'Complete guide to traveling with an inflatable SUP — airline regulations, packing tips, destination selection, and protecting your board during transit.'
  definition: 'SUP travel means transporting an inflatable paddle board as checked baggage or vehicle cargo, including packing, protecting, and assembling the board at your destination.'
  tldr: 'Inflatables are the ultimate travel SUP. Pack the board in its backpack, check it as oversized luggage (most airlines allow up to 32 kg). Wrap fins and pump separately. Arrive early for check-in. Research local conditions and water access at your destination. Choose destinations with calm water and easy launch points.'
  problem: 'You want to paddle in new locations but transporting a hard board is impossible. Even inflatable boards have airline restrictions that can cause problems without proper preparation.'
  explanation: 'Most airlines accept SUP backpacks as checked baggage, but policies vary. Key dimensions: the Aquafarer backpack is about 90x40x30 cm when packed. Weight is around 15 kg total — within most airline limits. Some airlines charge oversized baggage fees. Carry-on the pump and fins if possible. Research local water conditions, launch fees, and storage before arriving.'
  solution: 'Pack the board loosely to avoid creases. Wrap the pump and fins separately. Arrive early for check-in and be friendly with agents. Research your destination: check wind patterns, water access points, and local SUP regulations. Inflate the board fully when you arrive to check for transit damage.'
  recommendation: 'The Aquafarer SUP Explorer 11 in its included backpack is the perfect travel companion. It has survived hundreds of flights. Pair with the Life Vest Classic for destinations where PFDs are required.'
  faq:
    - q: Do airlines charge extra for SUP bags?
      a: Many treat them as standard checked baggage if under 23-32 kg. Some charge oversized fees. Check your airline's sporting equipment policy.
    - q: Can I take a SUP as carry-on?
      a: No, the backpack exceeds carry-on size limits. Always check it. Carry the pump and small accessories in your carry-on.
    - q: How do I prevent damage during flights?
      a: Pack the board loosely in the bag. Place fins and hard objects in the center wrapped in clothing. Label the bag as fragile.
    - q: What are the best SUP travel destinations?
      a: 'Flat-water: Lake Tahoe, Baja California. Coastal: Maui, Algarve, Cornwall. Inland: Canadian lakes, Italian lakes.'
