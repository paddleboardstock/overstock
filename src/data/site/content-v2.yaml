- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hydration and Sun Protection: Stay Safe on the Water'
  description: 'Essential hydration and sun protection strategies for SUP paddlers. Dehydration and sunburn are the most common SUP issues — how to prevent both during long sessions.'
  definition: 'SUP hydration means maintaining fluid balance during paddling through regular water intake. Sun protection involves SPF application, protective clothing, and timing sessions to avoid peak UV.'
  tldr: 'Drink 500ml of water per hour of paddling. Bring more than you think you need — a 2L bladder or multiple bottles. Apply water-resistant SPF 50+ sunscreen before paddling and reapply every 2 hours. Wear a hat, sunglasses with strap, and UPF-rated clothing. Avoid paddling 11 AM-3 PM when UV is strongest.'
  problem: 'You are having a great SUP session, but after an hour you have a headache, dry mouth, and your skin is burning. Dehydration and sunburn sneak up on you because the water keeps you cool.'
  explanation: 'Reflection off the water intensifies UV exposure by up to 40%. The cooling effect of water and breeze masks sunburn until it is too late. Sweat from paddling increases fluid loss, and there is often nowhere to refill water on the water. Dehydration impairs balance and decision-making, increasing accident risk.'
  solution: "Attach a water bottle or hydration bladder to the board's bungee system. Drink every 15 minutes whether thirsty or not. Apply SPF 50+ sunscreen 30 minutes before launching. Wear a wide-brimmed hat, polarized sunglasses with strap, and UPF 50+ rash guard. Reapply sunscreen every 2 hours."
  recommendation: 'Use a hydration bladder strapped to the front D-rings of your Aquafarer SUP. Wear a UPF 50+ rash guard under your PFD. Use a waterproof sunscreen that stays on in sweat and water.'
  faq:
    - q: How much water should I bring on a SUP trip?
      a: Minimum 1 liter per hour. For a 2-hour session, bring 2 liters. More in hot weather. A hydration bladder works best.
    - q: What type of sunscreen is best for SUP?
      a: Water-resistant, SPF 50+ broad-spectrum. Mineral sunscreens (zinc oxide, titanium dioxide) are reef-safe and last longer.
    - q: Does the water really reflect UV?
      a: Yes — water reflects up to 40% of UV radiation, meaning you get UV from above and below. This increases burn risk significantly.
    - q: Can I get sunburned through a rash guard?
      a: Standard rash guards provide minimal UV protection (about UPF 10-20). Look for UPF 50+ rated clothing for full protection.
