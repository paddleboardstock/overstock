- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'SUP Leash Guide: Straight vs Coiled Leashes Explained'
  description: 'Complete guide to SUP leashes — straight vs coiled, ankle vs calf, quick-release options, and how to choose the right leash for your paddling conditions.'
  definition: 'A SUP leash is a cord that attaches the paddler to the board, preventing separation. Types include straight leashes (for surfing and rivers) and coiled leashes (for flat water).'
  tldr: 'Coiled leashes are best for flat water and fitness paddling — they stay off the board and out of the water. Straight leashes are for SUP surfing and rivers — they provide more freedom and do not snag. Calf attachment is preferred to ankle for comfort. Quick-release leashes are important for river paddling to prevent entrapment.'
  problem: 'You bought a leash with your SUP but are not sure if it is the right type for your paddling style. The wrong leash will drag, snag, or fail when you need it most.'
  explanation: 'Straight leashes are simple nylon or polyurethane cords that trail behind the board. They work well in surf because they do not snag on fins. Coiled leashes are spiral cords that contract when not under tension — they stay coiled on the deck when paddling and extend when you fall. They keep the leash out of the water in flat conditions, reducing drag.'
  solution: 'Choose coiled leash for flat water, fitness, and touring SUP. The reduced drag helps maintain speed and prevents the leash from catching on underwater objects. Choose straight leash for SUP surfing and river paddling. The straight design is less likely to snag on fins or obstacles.'
  recommendation: "Aquafarer SUP packages include the appropriate leash type for the board's intended use. The coiled leash in the SUP Explorer 11 package is excellent for all-around paddling."
  faq:
    - q: Should the leash attach to my ankle or calf?
      a: Calf attachment is preferred for SUP — it keeps the leash out of the water when paddling and reduces tripping hazard when walking.
    - q: How long should a SUP leash be?
      a: 8-10' for flat water, 6-8' for surf. Shorter leashes reduce drag but limit freedom of movement on the board.
    - q: Do I need a quick-release leash for rivers?
      a: Yes — river SUP requires a quick-release leash or belt that can be detached instantly to prevent entrapment in strainers.
    - q: Can I use a surf leash for SUP?
      a: Surf leashes are shorter and thinner. They work for SUP surfing but are not ideal for flat water paddling where a longer coiled leash is better.
