- slug: ocean-conditions-explained
  category: guide
  type: technical
  title: Ocean Conditions Explained (Read the Surf Forecast Like a Pro)
  description: Swell height, period, wind direction, tide — decode any surf forecast in 60 seconds. What the numbers actually mean for your local break and when to stay on the beach.
  definition: 'Ocean conditions are determined by three factors: swell (height, period, direction), wind (offshore is clean, onshore is choppy), and tide (changes water depth over sandbars and reefs).'
  tldr: 'Three factors determine surf quality: swell (size, period, direction), wind (offshore is clean, onshore is bumpy), and tide (pushes water in or out over sandbars). Use swell period to judge power — longer period means more powerful waves. Check a surf forecast combining these three before every session.'
  problem: 'Surf forecasts show confusing numbers: 3ft at 12 seconds from 290°, light offshore wind. You do not know what that means for the beach you plan to surf at. Without decoding the forecast, you either drive to a flat beach or paddle out in dangerous conditions.'
  explanation: 'Swell is measured by height (face height in feet), period (seconds between waves), and direction (where the swell is coming from). Longer period swells (12+ seconds) carry more energy and produce cleaner, more powerful waves. Wind quality: offshore wind (blowing from land to sea) holds the wave face up, creating smooth, clean waves; onshore wind (sea to land) chops up the surface. Side-shore winds are acceptable but not ideal. Tide affects wave shape depending on the break — beach breaks often work best at mid-tide, reef breaks at specific tide levels depending on the reef depth.'
  solution: Use a surf forecast website or app and learn to read three parameters for your local break. Cross-reference the swell direction with the beach orientation — a west-facing beach needs a west swell. Check the wind forecast for the time you plan to surf, not the morning report. Learn the tide preference for your specific break by watching it at different tide levels.
  recommendation: 'Spend one month logging conditions and wave quality at your local beach. You will discover patterns: which swell directions work, which tides produce the best shape, and which winds ruin the surface. The ocean conditions guide pairs with the surf safety basics guide for a complete ocean literacy foundation.'
  faq:
    - q: What is a good swell period for surfing?
      a: 8-10 seconds produces weak, disorganized waves suited to beginners. 10-13 seconds is the sweet spot for most breaks — good power without being dangerous. 14+ seconds produces powerful, focused swells suited to advanced surfers.
    - q: What is the best wind for surfing?
      a: Light offshore wind (5-10 knots) produces the cleanest wave faces. Glassy conditions (zero wind) are ideal but rare. Onshore wind makes waves bumpy and harder to ride. Strong offshore wind can make takeoffs dangerous by holding the wave lip up too long.
    - q: How does tide affect waves?
      a: Tide changes the depth over sandbars and reefs. Low tide can expose hazards and make waves steeper or close out. High tide may soften waves or make them fat and slow. Most beach breaks work best 2-3 hours either side of high or low tide.
    - q: Can I surf in onshore wind?
      a: Yes, but the quality will be lower. Choppy wave faces make turns harder and paddling less efficient. Beginners often prefer onshore wind because the waves are softer and less powerful, giving more time to pop up.
