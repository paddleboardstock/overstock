origin:
  tagline: Naše poreklo
  heading: |-
    Izgrađen na vodi,<br />
    <span class="text-sky-600">vođen svrhom</span>
  paragraphs:
    - 'Paddle Board Overstock Počeo je u primorskoj radionici sa jednim brodom i tvrdoglavim uverenjem: morski proizvodi treba da budu projektovani kao da su važni - zato što jesu.'
    - Naši osnivači, dva pomorska arhitekta, videli su industriju u kojoj su uglovi isečeni, materijali su degradirani, a bezbednost je tretirana kao polje za potvrdu. Izgradili su Paddle Board Overstock prvi trup ne zbog profita, već da bi dokazali da pristupačna pomorska oprema takođe može biti istinski pouzdana.
    - Taj prvi trup je i danas u upotrebi. Taj princip se nikada nije promenio.
    - Mi nismo najveći proizvođač. Mi ne pravimo najjeftinije proizvode. Ali svaki trup koji napušta našu radionicu prolazi kroz iste ruke koje su pokrenule kompaniju — i zadovoljava isti standard koji je prvi trup postavljen.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/tech-meeting-small.webp
  image_alt: Paddle Board Overstock Primorska radionica
philosophy:
  tagline: Naša filozofija
  heading: Ukorenjen u okeanu
  description: Okean nije naše radno mesto. To je naš učitelj. Svaka odluka o dizajnu počinje sa razumevanjem kako se voda ponaša, kako se uslovi menjaju i kako oprema mora da reaguje.
  cards:
    - emoji: 🌊
      title: Poštujte vodu
      description: Voda je nepredvidiva. Naši proizvodi su projektovani za najgore uslove, a ne za najbolje. Ako trup može da podnese plimu, on će se nositi sa jezerom. Ako prsluk za spašavanje radi na moru, on je preterano projektovan za reku - i to je namerno.
    - emoji: 🔧
      title: Napravljen da traje, a ne da zameni
      description: Najodrživiji proizvod je onaj koji ne treba zamenu. Morski razred PVCHypalon, , i drop-stitch konstrukcija su izabrani za dugovečnost. Još uvek isporučujemo rezervne delove za trupove koje smo izgradili pre deset godina.
    - emoji: 🏆
      title: Dostupno po dizajnu
      description: Vodeni sportovi ne bi trebalo da budu luksuz. Mi projektujemo proizvode koji pružaju profesionalne performanse po ceni koja ima smisla za porodice, vodiče i male operatere - ne samo za komercijalne flote.
design:
  tagline: Filozofija dizajna
  heading: |-
    Projektovan za ivicu<br />
    <span class="text-sky-600">uslova</span>
  paragraphs:
    - Svaki Paddle Board Overstock proizvod počinje sa jednim pitanjem:<em>Koji je najgori uslov sa kojim će se suočiti?</em>Dizajniramo od ivice prema unutra, a ne od centra prema spolja.
    - 'drop-stitch Naša jezgra su ocenjena za 15 PSI - ne zato što je 12 PSI nedovoljno za jezero, već zato što PSI 15 daska rukuje naglim sečenjem bez savijanja. Naše Hypalon cevi su specificirane za otpor komercijalnog razreda UV - ne zato što svaki kupac vesla u tropima, već zato što UV je degradacija # 1 uzrok preranog neuspeha.'
    - Mi ne dizajniramo po ceni. Dizajniramo do tačke kvara - a zatim gradimo znatno iznad nje.
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/paddleboardoverstock-hero-design-concept.webp
  image_alt: Paddle Board Overstock Projektovanje i inženjering
