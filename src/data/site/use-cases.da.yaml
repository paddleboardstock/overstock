cases:
  - id: beginner
    title: 'Vandsport for begyndere'
    desc: 'Stabile SUP-brætter og kajakker til førstegangsbrugere.'
    scenario: >-
      'En familie, der besøger en sø i weekenden, vil prøve stand up paddle. De har brug for stabilt udstyr, der er let at søsætte, med tydelige sikkerhedsanvisninger.'
    solution: >-
      'SUP Explorer 11 giver bred stabilitet for begyndere. Life Vest Classic sikrer CE-certificeret opdrift. Dobbeltpumpen puster begge brætter op på under 10 minutter.'
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 'Friluftsliv og udforskning'
    desc: 'Bærbare kajakker og både til floder, søer og kystture.'
    scenario: >-
      'En friluftsentusiast planlægger en ugelang flodrejse og har brug for en båd, der pakkes småt, pustes op i lejren og håndterer skiftende strøm.'
    solution: >-
      'Kayak Lite passer i en rygsæk og pustes op på under 4 minutter. Drop-stitch-konstruktionen håndterer søer, rolige floder og kystpadling.'
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: 'Professionel drift'
    desc: 'Kommerciale RIB til turoperatører og nødhjælp.'
    scenario: >-
      'En kystturoperatør har brug for en flåde af holdbare både til daglige ture i skiftende søforhold, der opfylder kommercielle sikkerhedsregler.'
    solution: >-
      'RIB 330 og RIB 450 Patrol har glasfiberskrog med dyb V og Hypalon-slinger til holdbarhed i alt vejr. Flere enheder kan indsættes med ensartet præstation.'
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: 'Familie rekreation'
    desc: 'Rummelige både til dagture, fiskeri og vandsport.'
    scenario: >-
      'En familie på fire vil have en stabil båd til weekender på søen, fisketure og bugsering af en tube til børnene.'
    solution: >-
      'AirDeck 360 rummer op til fem personer med et forstærket luftdæk. Den pustes op ved søsættelsen, passer i bilen og håndterer både rolige søer og beskyttede kystvande.'
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
