cases:
  - id: beginner
    title: Begynder Padling
    desc: Stabile oppustelige SUP boards til førstegangs padlere.
    scenario: En familie, der besøger en sø i weekenden, ønsker at prøve paddleboarding. De har brug for stabilt, let at sætte i vandet udstyr med tydelig sikkerhedsguide.
    solution: Den SUP Explorer 11 giver bred-body stabilitet for begyndere. Den Life Vest Classic sikrer CE-certificeret flydeevne. Den Oars & Pump Set oppustes på under 10 minutter.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Tur & Udforskning
    desc: Langdistance oppustelige SUP boards til søer, floder og kystture.
    scenario: En friluftsentusiast planlægger en ugelang padletur og har brug for et board, der pakker kompakt, oppustes på lejr, og går lige på åbent vand.
    solution: Den Ocean Voyager Series glider effektivt med en touring-form og holder kurs i vind og bølger. Dens drop-stitch konstruktion oppustes til 15 PSI for hård-planer stivhed.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga & Fitness
    desc: Ekstra brede, stabile platforme til yoga, fitness og afslapning.
    scenario: En yogapraktiker ønsker et flydende studie til morgen-sessioner på stille vand, med nok dækplads til at udføre alle stillinger.
    solution: Den Flowing Lotus Series har en fuldlængde dækpad og en bred bund for wobble-frie stillinger. Den fungerer også som en stabil platform til lette fitnessøvelser.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Familie Rekreation
    desc: Komplette SUP pakker til weekenddage ved søen og ferier.
    scenario: En familie på fire ønsker stabile boards til weekendture ved søen og strandferier — udstyr, der kan pakkes i bilen og oppustes på få minutter.
    solution: Den Tropical Breeze Series er et stabilt allround-board, som hele familien kan dele, mens den Medusa Glow Series er lettere og kortere til børn. Begge kan pakkes i rygsække for nem rejse.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
