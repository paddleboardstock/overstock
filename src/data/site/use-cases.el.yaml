cases:
  - id: beginner
    title: 'Θαλάσσια σπορ για αρχάριους'
    desc: 'Σταθερά SUP και καγιάκ για πρώτη χρήση.'
    scenario: >-
      'Μια οικογένεια που επισκέπτεται μια λίμνη το Σαββατοκύριακο θέλει να δοκιμάσει stand up paddle. Χρειάζεται σταθερό εξοπλισμό εύκολης καθέλκυσης με σαφείς οδηγίες ασφαλείας.'
    solution: >-
      'Το SUP Explorer 11 προσφέρει ευρεία σταθερότητα για αρχάριους. Το Life Vest Classic εξασφαλίζει πιστοποιημένη CE πλευστότητα. Η αντλία διπλής δράσης φουσκώνει και τις δύο σανίδες σε λιγότερο από 10 λεπτά.'
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 'Εξερεύνηση στη φύση'
    desc: 'Φορητά καγιάκ και βάρκες για ποτάμια, λίμνες και παράκτιες εκδρομές.'
    scenario: >-
      'Ένας λάτρης της φύσης σχεδιάζει ταξίδι μιας εβδομάδας σε ποτάμι και χρειάζεται μια βάρκα που συσκευάζεται μικρή, φουσκώνει στο κάμπινγκ και ανταποκρίνεται σε μεταβαλλόμενα ρεύματα.'
    solution: >-
      'Το Kayak Lite χωράει σε σακίδιο και φουσκώνει σε λιγότερο από 4 λεπτά. Η κατασκευή drop-stitch αντιμετωπίζει λίμνες, αργά ποτάμια και παράκτια κωπηλασία.'
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: 'Επαγγελματικές λειτουργίες'
    desc: 'Εμπορικής κλάσης RIB για οργανωτές ξεναγήσεων και ομάδες έκτακτης ανάγκης.'
    scenario: >-
      'Ένας παράκτιος οργανωτής ξεναγήσεων χρειάζεται στόλο ανθεκτικών σκαφών για καθημερινές διαδρομές σε μεταβαλλόμενες θαλάσσιες συνθήκες, σύμφωνα με τους εμπορικούς κανονισμούς ασφαλείας.'
    solution: >-
      'Τα RIB 330 και RIB 450 Patrol διαθέτουν γάστρες fiberglass με βαθύ V και σωλήνες Hypalon για αντοχή σε όλες τις συνθήκες. Πολλές μονάδες μπορούν να αναπτυχθούν με σταθερές επιδόσεις.'
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: 'Οικογενειακή αναψυχή'
    desc: 'Ευρύχωρες βάρκες για ημερήσιες εκδρομές, ψάρεμα και θαλάσσια σπορ.'
    scenario: >-
      'Μια οικογένεια τεσσάρων θέλει μια σταθερή βάρκα για σαββατοκύριακα στη λίμνη, για ψάρεμα και για ρυμούλκηση σωλήνα για τα παιδιά.'
    solution: >-
      'Το AirDeck 360 χωράει έως πέντε άτομα με ενισχυμένο αεροδάπεδο. Φουσκώνει στο σημείο καθέλκυσης, χωράει στο αυτοκίνητο και αντιμετωπίζει τόσο ήρεμες λίμνες όσο και προστατευμένα παράκτια ύδατα.'
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
