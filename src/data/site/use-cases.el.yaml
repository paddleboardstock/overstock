cases:
  - id: beginner
    title: Αρχική Κωπηλασία
    desc: Σταθερές φουσκωτές σανίδες SUP για αρχάριους κωπηλάτες.
    scenario: Μια οικογένεια που επισκέπτεται μια λίμνη για το Σαββατοκύριακο θέλει να δοκιμάσει την κωπηλασία με σανίδα. Χρειάζονται σταθερό, εύκολο στην εκτόξευση εξοπλισμό με σαφείς οδηγίες ασφάλειας.
    solution: Το SUP Explorer 11 παρέχει σταθερότητα ευρείας κατηγορίας για αρχάριους. Το Life Vest Classic εξασφαλίζει ευρωπαϊκή πιστοποίηση CE για πλεύση. Το Oars & Pump Set φουσκώνει τη σανίδα σε λιγότερο από 10 λεπτά.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Ξεναγήσεις & Εξερευνήσεις
    desc: Φουσκωτές σανίδες SUP μεγάλων αποστάσεων για λίμνες, ποτάμια και παραθαλάσσιες εκδρομές.
    scenario: Ένας λάτρης της υπαίθρου σχεδιάζει μια εβδομαδιαία εκδρομή κωπηλασίας και χρειάζεται μια σανίδα που να συσκευάζεται μικρή, να φουσκώνει στο κάμπινγκ και να διατηρεί τη πορεία ευθεία σε ανοιχτό νερό.
    solution: Το Ocean Voyager Series γλιστράει αποτελεσματικά με περίγραμμα για περιοδεία και διατηρεί την πορεία σε άνεμο και κυματισμό. Η drop-stitch κατασκευή του φουσκώνει μέχρι 15 PSI για σκληρότητα της σανίδας.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Γιόγκα & Fitness
    desc: Εξαιρετικά φαρδιά, σταθερά πλατφόρμες για γιόγκα, fitness και χαλάρωση.
    scenario: Ένας ασκούμενος γιόγκα θέλει ένα πλωτό στούντιο για πρωινές συνεδρίες σε ήρεμο νερό, με αρκετό χώρο στην πλατφόρμα για κάθε στάση.
    solution: Η Flowing Lotus Series διαθέτει ολοκάθαρη επιφάνεια κατά μήκος της επιφάνειας και ευρύ πλάτος για στάσεις χωρίς κλίσεις. Διπλασιάζεται ως σταθερή βάση για ελαφριά προπόνηση.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Οικογενειακή Αναψυχή
    desc: Πλήρη πακέτα SUP για ημερήσιες εκδρομές στη λίμνη και διακοπές.
    scenario: Μια οικογένεια τεσσάρων ατόμων θέλει σταθερές σανίδες για εκδρομές στη λίμνη τα Σαββατοκύριακα και διακοπές στην παραλία — εξοπλισμό που χωράει στο αυτοκίνητο και φουσκώνει σε λίγα λεπτά.
    solution: Το Tropical Breeze Series είναι μια σταθερή σανίδα για όλους που μπορεί να χρησιμοποιηθεί από όλη την οικογένεια, ενώ το Medusa Glow Series είναι ελαφρύτερη και μικρότερη για παιδιά. Και οι δύο μπαίνουν σε σακίδια για εύκολη μεταφορά.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
