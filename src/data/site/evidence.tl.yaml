badge: Proof & Results
heading: Ebidensya
description: Mga totoong case study, sertipikasyon, test data, at mga larawan ng deployment na nagpapakita ng aming kakayahan sa paggawa at kalidad ng produkto.
case_studies:
  - id: retail-private-label
    client: European Outdoor Retailer
    product: Linya ng Pribadong Label SUP
    industry: Retail
    challenge: Kailangan ng European outdoor retailer ng private-label SUP na linya na may natatanging deck graphics, eco-friendlyPVC, at retail-ready na packaging — lahat ay naihatid sa loob ng 60 araw.
    solution: Nag-develop ng custom digital print files, sourced REACH-compliantPVC, at compressed sampling mula 3 rounds hanggang 1 sa pamamagitan ng pag-co-locate ng design team sa aming Qingdao factory.
    result: 55 araw mula sa signed PO hanggang FOB. 2,400 units sa 4 SKUs. Uulitin ang order bago dumating ang unang container.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Retail
      - SUP
    outcome_metrics:
      - label: Oras ng paghahanda
        value: 55 araw
      - label: Mga Yunit
        value: 2,400
      - label: Mga SKU
        value: '4'
  - id: startup-drop-stitch-kayak
    client: US Watersports Startup
    product: Drop-Stitch Kayak
    industry: Startup / Retail
    challenge: Kailangan ng US watersports startup ng high-performance drop-stitch kayak na may custom hull shape, co-branded packaging, at BSCI sertipikasyon para sa retail placement.
    solution: Inangkop ang umiiral na drop-stitch kayak mould na may binagong rocker profile, binuo ang co-branded packaging artwork, at nagbigay ng kumpletong BSCI audit documentation.
    result: Matagumpay na nakalista sa 3 pangunahing outdoor chain sa US. 5,000+ units sa unang taon na may 98% sell-through rate.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Kayak
      - BSCI
    outcome_metrics:
      - label: Mga Retail Chain
        value: '3'
      - label: Mga Yunit ng Unang Taon
        value: 5,000+
      - label: pagbebenta nang sapat
        value: 98%
  - id: australian-rib-distributor
    client: Australian Distributor
    product: CE-Sertipikadong RIB Hanay
    industry: Marine / Pamahalaan
    challenge: Kinakailangan ng distributor sa Australia ang CE-certified RIB na hanay na may custom na kulay ng tubo, Hypalon opsyon sa pag-upgrade, at pagsunod sa Australian Standard AS 1799.
    solution: Gumawa ng mga pre-production sample na may 4 na tube na kulay variant, CSM Hypalon mula sa Japanese supplier, at pinagsama-sama ang third-party AS 1799 compliance testing.
    result: Inilunsad ang 3-model RIB na saklaw sa merkado ng AU/NZ. Sinundan ng pagkapanalo sa government tender para sa 12 patrol RIBs.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Gobyerno
    outcome_metrics:
      - label: Mga Modelong Inilunsad
        value: '3'
      - label: Kontrata sa Patrol Boat
        value: 12 yunit
      - label: Pagsunod sa Batas
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Caribbean Luxury Resort Group
    product: Fleet ng Resort — RIBs, SUP, Kayaks
    industry: Hospitality / Turismo
    challenge: Isang 5-resort na grupo ang nangangailangan ng pinag-isang fleet ng mga rental na kagamitan sa watersports — RIB tenders, SUPs, at kayaks — na may pare-parehong branding, materyales na UV-resistant para sa tropikal na araw, at plano ng pagpapalit sa loob ng 5 taon.
    solution: Dinisenyo ang isang custom na 3-model na package ng fleet na may UV-stabilized PVC, resort-branded na deck graphics, at phased delivery schedule. Nagbigay ng pagsasanay sa staff at dedikadong spare parts kit para sa bawat resort.
    result: 180 yunit na naipadala sa 5 resorts. Paulit-ulit na order para sa 2 bagong properties. 40% pagbabawas sa per-unit na gastos kumpara sa mga naunang supplier.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kayak
      - RIB
      - Hospitality
    outcome_metrics:
      - label: Yunit na Naipadala
        value: 180
      - label: Mga Resort
        value: '5'
      - label: Pagbaba ng Gastos
        value: 40%
  - id: southeast-asia-search-rescue
    client: Southeast Asian Maritime Agency
    product: Fleet ng Patrol & Rescue RIB
    industry: Gobiyerno / Seguridad sa Maritima
    challenge: Kailangan ng isang government maritime agency ng 20 patrol at rescue RIBs na may fire-resistant Hypalon na tela, self-bailing na sahig, integrated na VHF/radio console mounts, at pagsunod sa SOLAS Chapter III rescue boat standards.
    solution: Ginawa ang 20 RIBs na may CSM Hypalon na mga tubo, hull na gawa sa marine-grade na aluminyo, heavy-duty towing eyes, at pre-installed na navigation light packages. Sinaksihan ng factory inspection team ang sea trials. Buong SOLAS na package ng dokumentasyon ang ibinigay.
    result: Naipadala ang kontrata sa loob ng 4 buwan. Na-deploy ang fleet para sa border patrol, search and rescue, at disaster response sa 3 regional na base.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Gobyerno
      - SOLAS
    outcome_metrics:
      - label: Patrol RIBs
        value: '20'
      - label: Pagde-deliver
        value: 4 na buwan
      - label: Mga Base
        value: '3'
  - id: european-dtc-ecommerce
    client: European DTC Watersports Brand
    product: SUP + Linya ng Branded na Aksesorya
    industry: E-commerce / Retail
    challenge: Isang mabilis na lumalagong tatak ng DTC watersports ang nangangailangan ng kumpletong SUP pakete (board, pump, paddle, leash, bag) na may premium na packaging na idinisenyo para sa e-commerce fulfilment — direktang papunta sa consumer sa pamamagitan ng DHL/FedEx nang walang pinsala.
    solution: Nakabuo ng co-branded na linya ng produkto na may custom EPS core shaping, proprietary drop-stitch na teknolohiya para sa mas mataas na presyon, at retail-ready na double-wall corrugated boxes na may insert padding. Pinagsamang QR-code-based na authenticity at warranty registration.
    result: 3-model SUP line inilunsad sa loob ng 75 araw. 15,000+ yunit sa unang 12 buwan. 4.8★ average rating sa 2,000+ review. 0.3% damage rate habang nasa biyahe.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-commerce
    outcome_metrics:
      - label: Mga Modelo
        value: '3'
      - label: Mga Yunit
        value: 15,000+
      - label: Karaniwang Rating
        value: 4.8★
      - label: Rate ng Pinsala
        value: 0.3%
certifications:
  - name: CE
    body: European Union
    desc: Ang mga produkto ay may CE sertipikasyon ayon sa mga naaangkop na direktiba ng EU — mga recreational craft ayon sa EN ISO 6185, personal flotation devices ayon sa EN ISO 12402, kung naaangkop.
  - name: ISO 9001
    body: SGS / BSI
    desc: Sistema ng pamamahala ng kalidad na sertipikado para sa disenyo, paggawa, at pamamahagi ng inflatable watercraft.
  - name: BSCI
    body: amfori
    desc: Sertipikasyon sa social compliance na nagpapakita ng etikal na paggawa, patas na paggawa, at kaligtasan sa lugar ng trabaho.
  - name: REACH
    body: European Chemicals Agency
    desc: Lahat ng materyales ay sumusunod REACH sa mga regulasyon para sa kaligtasan ng kemikal. May dokumentasyon na ibinibigay sa bawat padala.
  - name: RoHS
    body: European Union
    desc: Paghihigpit ng pagsunod sa mga mapanganib na sangkap sa lahat ng elektronik at elektrikal na bahagi.
  - name: AS 1799
    body: Standards Australia
    desc: Pamantayan ng Australia para sa inflatable boats — sinubukan at sertipikado para sa komersyal na paggamit sa mga tubig ng AU/NZ.
test_results:
  - metric: Mga Yunit na Sinubukan sa Presyon
    value: 100%
    detail: Bawat bangka, bawat silid, bawat batch
  - metric: Pinakamataas na Pagbaba ng Presyon
    value: <5%
    detail: Mahigit 24 oras sa 1.25x rated pressure
  - metric: Pangunahing Threshold ng Depekto
    value: AQL 2.5
    detail: Ayon sa ISO 2859 pamantayan sa sampling
  - metric: Tagal ng Paghawak ng Presyon
    value: 24-48h
    detail: Depende sa kategorya ng produkto
  - metric: Margin ng Pagsubok sa Presyon
    value: 1.25x
    detail: Margin ng kaligtasan sa bawat silid
  - metric: Toleransiya sa Depekto para sa Kaligtasan
    value: 0%
    detail: Mga balbula, D-ring, tahi, buoyancy
