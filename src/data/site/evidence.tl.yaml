badge: Proof & Quality
heading: Ebidensya
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: Stock ng Clearance, QC na Klase ng Retail
    product: Bawat Overstock Board, Muling Suriin
    industry: Kontrol ng Kalidad
    challenge: Ang mga overstock at clearance board ay nagmumula sa mga surplus na produksyon, kaya tama lang na itanong ng mga bumibili kung pumapasa sa parehong pagsusuri ang isang board sa diskwento tulad ng isang full-price na board.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: 99.3% na defect-free rate sa mga palabas na padala sa nakaraang 12 buwan — pareho ang pamantayan na ito sa clearance at retail stock.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Rate na Walang Depekto
        value: 99.3%
      - label: Coverage ng Pressure Test
        value: 100%
      - label: Tagal ng Paghawak
        value: 24-48h
  - id: pressure-test-regime
    client: Ang 24-48-Oras na Pressure Hold
    product: Bawat Chamber, 1.25x Rated Pressure
    industry: Pagsusuri ng Produkto
    challenge: Ang isang SUP board ay nabubuhay o namamatay dahil sa drop-stitch core at seams nito, at ang mabilis na inflation check sa dulo ng linya ay hindi sapat upang makita ang mabagal na tagas o mahihina na weld.
    solution: Ang bawat board ay ini-inflate sa 1.25x ng rated pressure nito at hinahawakan ng 24-48 oras, na ang pagbaba ng presyon ay kinakailangang manatili sa ilalim ng 5%. Sinusuri ang mga valve, D-ring, seams, at buoyancy na walang tolerance para sa mga safety defect.
    result: 100% ng produksyon ay pumapasa sa prosesong ito bago i-pack — walang sampling shortcut, walang exceptions.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - 1.25x Presyon
      - Zero Safety Defects
    outcome_metrics:
      - label: Test Pressure
        value: 1.25x
      - label: Pinakamataas na Pagbaba ng Presyon
        value: <5%
      - label: Units Tested
        value: 100%
  - id: warranty-claims-support
    client: Isang Warranty na Sumasagot
    product: 2-Taong Coverage sa SUP Boards at Accessories
    industry: After-Sales
    challenge: Ang pagbili ng clearance direkta mula sa pabrika ay nagbubukas ng makatarungang tanong — kung may mali na mangyari ilang buwan pagkatapos, sino ang bahala?
    solution: Bawat board ay may kasamang 2-taong warranty na sumasaklaw sa SUP boards, drop-stitch seams, inflation valves, at accessories. Ang mga claim ay direktang ipinapadala sa aming team — magpadala lang ng mga larawan o maikling video at kami na ang bahala mula doon.
    result: Ang mga warranty claim ay nire-review at nire-resolve ng parehong team na nagsisiyasat sa produksyon — walang middleman na paikot-ikot.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - 2-Taong Warranty
      - Direktang Suporta
      - Saklaw ang mga Accessories
    outcome_metrics:
      - label: Garantiya
        value: 2 taon
      - label: Saklaw
        value: Board + Accessories
      - label: Suporta
        value: Direktang Team
