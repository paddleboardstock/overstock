- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Pembaikan Boleh Tiup SUP : Baiki Tusukan, Kebocoran, dan Masalah Injap'
  description: Panduan pembaikan tiup DIY SUP . Cara mencari kebocoran perlahan, menampal lubang bocor, menggantikan injap, dan membaiki delaminasi pad dek menggunakan kit pembaikan yang disertakan.
  definition: Pembaikan boleh tiup SUP melibatkan pengesanan kebocoran udara melalui ujian air sabun, pembersihan dan penghalusan kasar kawasan yang rosak, penggunaan PVC pelekat dan tampalan, serta pengerasan di bawah tekanan.
  tldr: Cari kebocoran dengan air sabun. Bersihkan dan kasarkan kawasan sekitar tusukan dengan kertas pasir. PVC Sapukan gam pada tampalan dan papan, tunggu 5 minit, tekan dengan kuat, dan keringkan di bawah berat selama 24 jam. Untuk kebocoran injap, periksa cincin O terlebih dahulu. Lubang kecil di bawah 1/4" adalah pembaikan DIY yang mudah.
  problem: Anda mengembang SUP dan tekanan sudah hilang menjelang pagi. Tanpa pengetahuan pembaikan, anda akan menghadapi penggantian mahal untuk apa yang mungkin hanya bocor biasa.
  explanation: 'Kebanyakan kembung SUPs menggunakan drop-stitch teras dengan PVC lapisan luar. Lubang di bahagian luar PVC menyebabkan kebocoran perlahan. Pembaikan standard: bersihkan, gosok, sapukan PVCpelekat yang serasi, tekan tampalan di bawah berat. Kebocoran injap lebih biasa daripada lubang panel — cincin O akan kering atau serpihan menghalang penutupan.'
  solution: Tiup papan ke maksimum PSI dan dengar bunyi desisan. Sembur air sabun secara sistematik, terutamanya di sekitar jahitan dan injap. Tandakan tempat yang berbuih. Kempis, bersihkan dengan alkohol, amplas dengan grit 80, PVC sapukan gam pada tampalan dan papan, tunggu sehingga melekit, tekan dengan kuat, berat selama 24 jam.
  recommendation: Gunakan Aquafarer kit pembaikan yang disertakan bersama semua Aquafarer papan. Sentiasa bawa kit pembaikan semasa perjalanan. Untuk masalah injap, hubungi Aquafarer sokongan. Untuk koyakan besar atau pemisahan jahitan, pembaikan profesional disyorkan.
  faq:
    - q: Bolehkah saya membaiki koyakan besar pada kereta kembung sayaSUP?
      a: Koyakan melebihi 1\" mungkin memerlukan pembaikan profesional atau tampalan di kedua-dua belah. Pemisahan sambungan sepanjang rel tidak boleh dibaiki secara lapangan dengan boleh dipercayai.
    - q: Berapa lama patch pembaikan bertahan?
      a: Pembaikan yang betul dengan teknik yang betul akan bertahan sepanjang hayat papan. Lekatan yang lemah akibat pembersihan yang tidak mencukupi boleh menyebabkan kegagalan pada masa hadapan.
    - q: Bolehkah saya membaiki injap yang bocor?
      a: Selalunya ya. Tanggalkan teras injap, periksa O-ring, bersihkan atau gantikan, sapu pelincir silikon, dan pasang semula.
    - q: Bagaimana jika saya tidak dapat mencari kebocoran itu?
      a: Tiup sehingga penuh PSI dan rendam bahagian secara berurutan dalam tab mandi atau kolam. Kebocoran yang terlalu kecil untuk dikesan mungkin berkaitan dengan suhu.
