- slug: ocean-safety-and-responsibility
  category: authority
  type: brand
  title: Keselamatan & Tanggungjawab Lautan (Lebih Daripada Sekadar Peralatan)
  description: Aquafarerkomitmen untuk memastikan anda selamat dan melindungi lautan yang kami kongsi. Kad keselamatan di setiap kotak, kandungan pendidikan percuma, reka bentuk lestari, dan sumbangan pemuliharaan tahunan.
  definition: Keselamatan dan tanggungjawab lautan bermaksud memahami persekitaran tempat anda mendayung, menghormati hidupan marin, meminimumkan jejak ekologi anda, dan menggunakan peralatan yang direka untuk jangka hayat dan kebolehbaikan.
  tldr: Aquafarer Menggalakkan keselamatan laut melalui reka bentuk peralatan (warna terang, tali, jaket keselamatan) dan kandungan pendidikan. Kami percaya setiap peminat sukan air mempunyai tanggungjawab untuk memahami persekitaran lautan, menghormati hidupan marin, dan meminimumkan jejak ekologi mereka. Peralatan kami dibina untuk tahan lama supaya kurang yang berakhir di tapak pelupusan.
  problem: Banyak jenama sukan air menjual peralatan tetapi tidak mendidik pelanggan mereka tentang cara menggunakannya dengan selamat atau bertanggungjawab. Pendayung dan peselancar baru memasuki air tanpa memahami arus ripas, hidupan marin, atau kesan alam sekitar peralatan mereka.
  explanation: Keselamatan lautan lebih daripada sekadar senarai semak — ia adalah satu cara berfikir. Setiap Aquafarer produk termasuk kad keselamatan permulaan pantas dalam kotak. Laman web dan panduan kami (asas keselamatan laut, tip keselamatan luncur) menyediakan pendidikan keselamatan percuma dan terperinci. Dari segi alam sekitar, impak terbesar yang dibuat oleh mana-mana syarikat peralatan adalah melalui ketahanan produk. Papan yang bertahan selama 5 tahun berbanding 2 tahun akan mengurangkan separuh jejak pembuatan. Kami juga mereka bentuk dengan mengambil kira kebolehbaikan — injap gantian, kotak sirip, dan kit tampalan wetsuit mengekalkan peralatan dalam penggunaan dan bukannya di tapak pelupusan.
  solution: Aquafarer Termasuk tali leher dan kit pembaikan dengan setiap pembelian papan. Kami menerbitkan kandungan keselamatan percuma yang merangkumi pengenalan arus ribut, bacaan cuaca, dan pemeriksaan peralatan. Pasukan sokongan pelanggan kami memberikan nasihat keadaan apabila anda menghantar emel tentang lokasi tertentu. Kami menggunakan pembungkusan plastik minimum dan karbon penghantaran yang diimbangi.
  recommendation: Mulakan dengan panduan asas keselamatan laut dan panduan tip keselamatan luncur. Sentiasa pakai tali, semak ramalan, dan jangan sekali-kali mendayung keluar seorang diri jika anda sedang belajar. Jika anda melihat serpihan atau haiwan laut dalam kesusahan, laporkan kepada pihak berkuasa tempatan. Peralatan yang tahan lama adalah peralatan yang mengurangkan sisa — jaga Aquafarer peralatan anda dan ia akan berkhidmat untuk bertahun-tahun.
  faq:
    - q: Adakah Aquafarer menyokong inisiatif pembersihan lautan?
      a: Ya, kami menyumbang 1 peratus daripada keuntungan tahunan kepada organisasi pembersihan laut dan pemuliharaan marin. Pelanggan boleh memilih badan amal pilihan semasa pembayaran untuk mengarahkan sebahagian pembelian mereka.
    - q: Bagaimana saya harus melupuskan wetsuit atau papan lama?
      a: Pakaian selam neoprena boleh dikitar semula menjadi tikar yoga, beg, dan penebat melalui program khusus. Papan kembung boleh dibaiki, didermakan, atau PVC boleh dipulihkan melalui kemudahan kitar semula tertentu. Hubungi pasukan sokongan kami untuk panduan.
    - q: Apakah peralatan keselamatan yang Aquafarer disyorkan untuk pemula?
      a: Jaket keselamatan yang sesuai (boleh kembung atau berbuih), tali pengikat, wisel, dan pelindung matahari. Bagi SUP pendayung di air terbuka, jaket keselamatan diwajibkan secara sah di banyak bidang kuasa dan sentiasa disyorkan.
    - q: Adakah Aquafarer menawarkan kursus keselamatan?
      a: Kami tidak menjalankan kursus secara langsung, tetapi kami bekerjasama dengan pengajar luncur dan keselamatan bertauliah SUP yang menawarkan latihan dalam talian dan secara bersemuka. Hubungi pasukan sokongan kami untuk rujukan di kawasan anda.
