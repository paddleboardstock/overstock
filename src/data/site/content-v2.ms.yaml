  title: 'SUP Panduan Keselamatan: Peraturan Penting untuk Setiap Pendayung'
  description: SUP Panduan keselamatan lengkap merangkumi pemeriksaan cuaca, peralatan, penyelamatan kendiri, peraturan navigasi, dan apa yang perlu dilakukan jika keadaan menjadi berbahaya. Jaga keselamatan di papan dayung anda.
  definition: SUP Keselamatan merangkumi perancangan pra-perjalanan (cuaca, pasang surut, pemeriksaan peralatan), amalan di atas air (tali leher, PFDnavigasi), dan prosedur kecemasan (penyelamatan kendiri, isyarat, pencegahan hipotermia).
  tldr: Sentiasa pakai tali leher dan PFD. Semak ramalan angin — angin luar pesisir berbahaya. Dayung ke arah angin dahulu supaya angin membantu anda kembali. Bawa wisel, telefon dalam sarung kalis air, dan air. Belajar menyelamatkan diri. Jangan SUP sekali-kali bersendirian di kawasan terpencil.
  problem: SUP Kelihatan kelihatan mudah tetapi menipu. Pemula meremehkan betapa cepatnya angin, arus, dan keletihan boleh menjadikan sesi yang menyeronokkan berbahaya.
  explanation: Papan bertindak sebagai layar apabila angin bertiup, menjadikan mendayung ke arah angin mudah tetapi kembali melawan angin sangat sukar. Posisi berdiri meningkatkan risiko jatuh. Keletihan terkumpul lebih cepat daripada berkayak. Tali leher menghalang pemisahan dari papan. PFD memastikan anda terapung jika cedera.
  solution: 'Sebelum perjalanan: periksa angin (maksimum 10 knot untuk pemula), arah (elak di luar pantai), dan pasang surut. Beritahu seseorang laluan anda. Di atas air: berlutut untuk mendayung melawan angin kencang. Jika terpisah, berenang ke papan papan. Untuk menyelamatkan diri: letakkan dayung merentasi papan, tendang kaki, tarik dada ke papan, hayun kaki ke atas.'
  recommendation: Gunakan Aquafarer Life Vest Pro (boleh tiup) untuk SUP. Pasang tali yang berguling SUP pada betis anda. Berlatih penyelamatan diri dalam keadaan tenang sebelum anda memerlukannya.
  faq:
    - q: Kelajuan angin apa yang selamatSUP?
      a: 'Pemula: di bawah 10 knot. Sederhana: 10-15 knot. Lanjutan: 15-20 knot. Melebihi 20 knot adalah berbahaya untuk semua tahap.'
    - q: Adakah saya perlukan jaket keselamatan untukSUP?
      a: Ya — diwajibkan secara undang-undang di banyak bidang kuasa dan sentiasa disyorkan demi keselamatan.
    - q: Apa yang patut saya lakukan jika saya tidak dapat kembali ke darat?
      a: Kekal dengan papan anda (ia adalah flotasi). Isyarat dengan wisel. Jika ditiup ke luar pantai, kayuh pada 45 darjah mengikut angin.
    - q: Bagaimana saya boleh mengamalkan SUP penyelamatan diri?
      a: 'Di air cetek yang tenang: sengaja jatuh, berenang ke papan papan, berlatih naik semula berulang kali.'
