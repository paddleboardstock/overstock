  title: 'Perancangan Cuaca untuk Sukan Air: Baca Ramalan Cuaca Seperti Profesional'
  description: Cara membaca ramalan cuaca marin untuk SUP, luncur, dan berperahu kapal. Memahami hadapan, sistem tekanan, corak angin, dan amaran cuaca untuk merancang sesi yang selamat.
  definition: Perancangan cuaca bermaksud mentafsir ramalan marin — kelajuan dan arah angin, ketinggian dan tempoh ombak, hujan, penglihatan, dan amaran cuaca buruk.
  tldr: 'Semak tiga ramalan sebelum setiap sesi: angin, ombak, dan cuaca. Keadaan terbaik: angin ringan dari luar pesisir, ombak sederhana, tekanan tinggi atau meningkat. Elakkan: ribut petir, angin kuat luar pesisir, kabus, dan tekanan yang menurun dengan pantas.'
  problem: Anda memandu ke pantai berdasarkan ramalan 3 hari yang menjanjikan keadaan baik, hanya untuk mendapati angin dan hujan 25 knot. Cuaca marin sukar diramalkan.
  explanation: Tekanan tinggi membawa cuaca stabil dan angin ringan. Tekanan rendah membawa angin dan ribut. Kecerunan tekanan menentukan kelajuan angin. Front sejuk membawa perubahan angin secara tiba-tiba. Kesan tempatan seperti angin laut boleh mengatasi ramalan umum.
  solution: 'Gunakan pelbagai sumber: Windy.com, NOAA, kamera luncur tempatan. Periksa 24 jam lebih awal dan periksa semula pada pagi hari. Cari ramalan yang konsisten merentasi model. Pelajari mikroklimat tempatan.'
  recommendation: Penanda Windy.com untuk tempat tempatan anda. Bawa telefon dalam sarung kalis air. Untuk berperahu, bawa radio VHF untuk siaran cuaca. Jika ragu-ragu, kekal di darat.
  faq:
    - q: Cuaca apa yang patut saya SUPelakkan?
      a: Ribut petir (kilat), kabus (penglihatan sifar), angin luar pesisir melebihi 10 knot, angin melebihi 20 knot, tekanan menurun.
    - q: Sejauh manakah ketepatan ramalan marin?
      a: Ramalan 3 hari adalah kira-kira 80% tepat. Ramalan hari sebelum adalah 90%+ tepat untuk angin.
    - q: Apakah trend barometrik yang baik untuk sukan air?
      a: Tekanan yang meningkat atau stabil menunjukkan keadaan yang semakin baik. Tekanan menurun (1+ mb/jam) menunjukkan ribut yang semakin hampir.
    - q: Bolehkah saya SUP dalam kabus?
      a: Tidak disyorkan. Jika terperangkap dalam kabus, gunakan kompas atau GPS, bunyikan wisel setiap 30 saat, dan kekal dekat dengan pantai.
