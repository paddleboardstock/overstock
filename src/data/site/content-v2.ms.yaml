  title: 'Keadaan Angin untukSUP: Bagaimana Angin Mempengaruhi Dayung Anda'
  description: Bagaimana kelajuan dan arah angin mempengaruhi SUP aktiviti mendayung. Memahami angin luar pantai vs angin darat, membaca ramalan angin, teknik mendayung untuk angin, dan bila untuk kekal di darat.
  definition: Keadaan angin menentukan SUP keselamatan. Angin luar pesisir (dari darat ke laut) menolak anda menjauh. Angin darat (laut ke darat) menolak anda ke arah pantai. Angin sisi menyebabkan papan menghunus.
  tldr: 'Angin selamat maksimum untuk pemula: 10 knot. Pertengahan: 15 knot. Lanjutan: 20 knot. Angin luar pesisir adalah paling berbahaya. Dayung ke arah angin dahulu. Dalam angin sisi, kayuh sedikit ke arah arah destinasi. Berlutut dalam angin kencang untuk mengurangkan profil anda.'
  problem: Anda mendayung keluar dalam keadaan tenang, tetapi 30 minit kemudian angin bertiup kencang dan anda sukar untuk kembali. Angin adalah faktor keselamatan yang paling dipandang rendah SUP .
  explanation: Angin memberi kesan SUP lebih besar daripada mana-mana bot dayung lain kerana anda berdiri, menghasilkan kesan layar. Angin 10 knot menghasilkan lebih banyak seretan pada pendayung yang berdiri berbanding pengayuh yang duduk. Angin luar pantai menolak anda jauh dari keselamatan. Angin sisi menyebabkan hidung berputar.
  solution: 'Periksa kelajuan dan arah angin sebelum mendayung. Gunakan skala Beaufort: Kekuatan 3 (7-10 knot) untuk pemula, Kekuatan 4 (11-16) untuk pertengahan. Dayung ke arah angin dahulu. Jika terkena angin luar pesisir, dayung pada sudut 45 darjah berbanding angin. Berlutut dalam angin kencang.'
  recommendation: Gunakan aplikasi ramalan angin (Windy, Windfinder) sebelum setiap sesi. Aquafarer SUP Tour 12 lebih baik dalam trek angin berbanding papan yang lebih lebar. Dalam keadaan berangin, gunakan kayuhan dayung yang lebih pendek dan kadens yang lebih tinggi.
  faq:
    - q: Arah angin mana yang paling selamatSUP?
      a: Angin darat (bertiup ke darat) adalah paling selamat — ia menolak anda ke belakang. Angin luar pesisir paling berbahaya.
    - q: Bagaimana saya boleh mendayung dalam angin sisi?
      a: Dayung lebih ke arah arah angin untuk melawan hanyutan. Arahkan papan ke arah arah angin destinasi anda. Sirip tengah yang lebih dalam membantu.
    - q: Bolehkah saya mendayung dalam angin 20 knot?
      a: Hanya jika berpengalaman di perairan terlindung. Pemula tidak sepatutnya mendayung melebihi 10 knot.
    - q: Bagaimana hembusan angin memberi kesanSUP?
      a: Hembusan angin menyebabkan cabaran keseimbangan secara tiba-tiba. Dalam keadaan angin kencang, turunkan posisi anda dan bersedia untuk perubahan mendadak.
