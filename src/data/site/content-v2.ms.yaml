- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Apa yang perlu dipakai untuk meluncur (jangan muncul dalam seluar pendek papan apabila anda perlukan 5/4)
  description: Berhenti meneka apa yang patut dipakai. Suhu air, bukan suhu udara, menentukan pakaian luncur anda. Panduan lengkap berlapis dari pelindung ruam tropika hingga set musim sejuk penuh 5/4/3mm.
  definition: Pakaian luncur ombak merangkumi seluar pendek papan dan pelindung ruam di air suam hingga wetsuit penuh 5/4/3mm dengan but dan tudung dalam air sejuk. Suhu air, bukan suhu udara, menentukan apa yang anda perlukan.
  tldr: Apa yang anda pakai semasa meluncur bergantung sepenuhnya pada suhu air — bukan suhu udara. Pelindung ruam dan seluar pendek papan boleh digunakan di atas 22°C, pakaian spring meliputi 18-22°C, sut penuh 3/2mm mengendalikan 14-18°C, dan 5/4/3mm dengan but diperlukan di bawah 14°C. Sentiasa pakai UV perlindungan dan pertimbangkan tali leher serta rompi impak.
  problem: Anda tiba di pantai dan tidak tahu sama ada pelindung ruam sudah mencukupi atau anda perlukan wetsuit penuh. Suhu udara hangat tetapi airnya sejuk, atau air terasa baik tetapi angin membeku. Berpakaian dengan cara yang salah bermakna sesi akan rosak.
  explanation: 'Pakaian berselancar mempunyai tiga tujuan: penebatan haba, perlindungan UV, dan pencegahan calar. Pakaian renang neoprena dinilai berdasarkan ketebalan dan liputan — pakaian musim bunga (lengan atau kaki pendek) sesuai untuk hari-hari sederhana, pakaian penuh untuk air sejuk. Pelindung ruam melindungi daripada ruam papan dan cahaya matahari tetapi tidak memberikan nilai haba. But, sarung tangan, dan tudung bukan aksesori tetapi peralatan penting untuk berselancar di air sejuk di bawah 12°C.'
  solution: 'Periksa pelampung tempatan atau laporan suhu air secara langsung sebelum keluar. Sediakan set berdasarkan keadaan paling sejuk yang biasa anda hadapi: baju pelindung dan seluar pendek untuk musim panas, sut penuh 3/2mm untuk musim bunga dan musim luruh, 5/4/3mm dengan but dan penutup kepala untuk musim sejuk. Sentiasa tambah tali pengikat dan pertimbangkan jaket pelampung untuk keselamatan.'
  recommendation: Melabur dalam sut penuh 3/2mm yang baik terlebih dahulu — ia meliputi julat keadaan yang paling luas. Tambah sut 5/4/3mm dan but jika anda merancang untuk berselancar pada musim sejuk. Wetsuit Pro Aquafarer dengan lapisan termal menyatukan kedua-dua julat suhu dengan berkesan.
  faq:
    - q: Bolehkah saya berselancar hanya dengan seluar papan?
      a: Ya, dalam air tropika lebih daripada 24°C. Anda mungkin ingin memakai pelindung ruam untuk mengelakkan geseran pada dada dan lengan akibat mengayuh. Lilin atau pad cengkaman pada papan membantu mengimbangi kekurangan cengkaman sut.
    - q: Adakah saya memerlukan but selancar?
      a: Jika suhu air turun di bawah 14°C, but mencegah kebas dan melindungi kaki anda daripada batu dan luka terumbu. Ia juga menambah cengkaman pada papan. Kebanyakan peselancar di iklim utara menggunakan but dari November hingga Mac.
    - q: Apakah itu sut musim bunga?
      a: Sebuah sut musim bunga ialah wetsuit lengan pendek atau kaki pendek (atau kedua-duanya) yang direka untuk air antara 18°C dan 22°C. Ia memberikan lebih kehangatan daripada pelindung ruam tetapi kurang liputan daripada sut penuh.
    - q: Adakah saya patut memakai jaket keselamatan semasa berselancar?
      a: Bukan jaket keselamatan tradisional, tetapi jaket impak atau alat apungan boleh membantu dalam keadaan kasar atau jika anda seorang perenang lemah. Aquafarer jaket keselamatan direka untuk SUP dan berkayak tetapi boleh memberikan keyakinan apungan tambahan untuk pemula berselancar.
