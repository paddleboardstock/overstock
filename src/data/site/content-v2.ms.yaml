- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hidrasi dan Perlindungan Matahari: Kekal Selamat di atas Air'
  description: Strategi penting untuk penghidratan dan perlindungan matahari untuk SUP para pendayung. Dehidrasi dan kulit terbakar matahari adalah isu paling biasa SUP — bagaimana untuk mengelakkan kedua-duanya semasa sesi yang panjang.
  definition: SUP Hidrasi bermaksud mengekalkan keseimbangan cecair semasa mendayung melalui pengambilan air secara berkala. Perlindungan matahari melibatkan penggunaan SPF, pakaian pelindung, dan sesi penentuan masa untuk mengelakkan puncakUV.
  tldr: Minum 500ml air setiap jam mendayung. Bawa lebih daripada yang anda sangka diperlukan — pundi kencing 2L atau beberapa botol. Sapukan+ pelindung matahari kalis air SPF 50 sebelum mendayung dan sapukan semula setiap 2 jam. Pakai topi, cermin mata hitam dengan tali, dan pakaian yang disahkan UPF. Elakkan mendayung dari 11 pagi hingga 3 petang apabila UV paling kuat.
  problem: Anda sedang menjalani sesi yang hebat SUP , tetapi selepas sejam anda mengalami sakit kepala, mulut kering, dan kulit anda terasa terbakar. Dehidrasi dan kulit terbakar matahari datang secara tiba-tiba kerana air mengekalkan anda sejuk.
  explanation: Pantulan dari air meningkatkan UV pendedahan sehingga 40%. Kesan penyejukan air dan angin sepoi-sepoi menutup kulit terbakar matahari sehingga terlambat. Peluh akibat mendayung meningkatkan kehilangan cecair, dan sering tiada tempat untuk mengisi semula air. Dehidrasi mengganggu keseimbangan dan pembuatan keputusan, meningkatkan risiko kemalangan.
  solution: Pasang botol air atau pundi penghidratan pada sistem bungee papan. Minum setiap 15 minit sama ada dahaga atau tidak. Sapukan+ pelindung matahari SPF 50 30 minit sebelum pelancaran. Pakai topi bertepi lebar, cermin mata hitam berpolarisasi dengan tali, dan+ pelindung ruam UPF 50. Sapukan semula pelindung matahari setiap 2 jam.
  recommendation: Gunakan pundi penghidratan yang diikat pada cincin D hadapan Aquafarer SUPanda. Pakai+ pelindung ruam UPF 50 di bawah PFD. Gunakan pelindung matahari kalis air yang kekal dalam peluh dan air.
  faq:
    - q: Berapa banyak air yang perlu saya bawa semasa SUP perjalanan?
      a: Minimum 1 liter sejam. Untuk sesi 2 jam, bawa 2 liter. Lebih banyak dalam cuaca panas. Pundi hidrasi paling sesuai.
    - q: Jenis pelindung matahari apa yang paling sesuaiSUP?
      a: Tahan air,+ SPF 50 spektrum luas. Pelindung matahari mineral (zink oksida, titanium dioksida) selamat untuk terumbu dan tahan lebih lama.
    - q: Adakah air benar-benar memantulUV?
      a: Ya — air memantulkan sehingga 40% UV radiasi, bermakna anda mendapat UV dari atas dan bawah. Ini meningkatkan risiko melecur dengan ketara.
    - q: Bolehkah saya terbakar matahari melalui pelindung ruam?
      a: Pelindung ruam standard memberikan perlindungan minimum UV (sekitar UPF 10-20). Cari pakaian yang dinilai UPF 50+ untuk perlindungan penuh.
