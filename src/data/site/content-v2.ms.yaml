- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'SUP Menyelamatkan Diri: Cara Kembali ke Papan Anda di Air Dalam'
  description: Setiap SUP pendayung harus menguasai penyelamatan kendiri. Teknik langkah demi langkah untuk memasang semula papan anda di air dalam, menariknya ke pantai, dan menangani kekusutan tali leher.
  definition: SUP Menyelamatkan diri adalah teknik memasang semula papan dayung anda di air dalam selepas terjatuh, termasuk pemulihan papan, pemasangan semula badan, dan pengambilan dayung.
  tldr: 'Selepas jatuh: kekal tenang, pegang dayung, berenang ke papan. Letakkan dayung merentasi papan. Gunakan tendangan lumba-lumba untuk menolak dada ke papan. Ayunkan satu kaki ke atas, kemudian kaki yang satu lagi. Berlutut dahulu, kemudian berdiri. Berlatih di air tenang sehingga ia menjadi ingatan otot.'
  problem: Anda jatuh dari SUP air dalam dan tidak dapat naik semula. Papan itu licin, anda letih, dan panik mula timbul. Tanpa mengetahui teknik menyelamatkan diri, jatuh mudah menjadi berbahaya.
  explanation: 'Penyelamatan kendiri mempunyai tiga peringkat: pemulihan (berenang ke papan dan mendayung), naik semula (kembali ke papan), dan meneruskan (meneruskan dayung). Teknik utama adalah menggunakan dayung sebagai penstabil dan menggunakan tendangan kaki yang kuat untuk menolak badan atas ke papan.'
  solution: 'Tahap 1: berenang ke papan. Pegang dayung atau ambil semula. Tahap 2: letakkan dayung secara tegak lurus di atas papan. Tendang kaki dengan kuat sambil menarik dada ke tengah papan. Tahap 3: setelah dada berada di atas papan, ayunkan kaki satu demi satu. Tahap 4: berlutut, tarik nafas, kemudian berdiri secara beransur-ansur.'
  recommendation: Berlatih menyelamatkan diri dalam keadaan terkawal sehingga anda boleh melakukannya tanpa berfikir. Gunakan Aquafarer SUP Explorer 11 yang mempunyai cengkaman dek yang baik. Life Vest Pro memberikan flotasi tambahan jika anda menghadapi kesukaran.
  faq:
    - q: Bagaimana saya boleh kembali jika saya sangat letih?
      a: Kekal bersama papan untuk flotasi. Gunakan tangan anda untuk menarik dada ke papan, walaupun kaki tidak dapat menendang dengan berkesan. Rehatlah dalam posisi berlutut sebelum berdiri.
    - q: Bagaimana jika saya kehilangan paddle?
      a: Gunakan tangan untuk mengayuh papan ke pantai. Minta bantuan pendayung lain. Gantikan dayung yang hilang segera.
    - q: Bolehkah saya menyelamatkan diri secara gelombang?
      a: Ya — letakkan papan secara tegak lurus dengan ombak. Tetapkan masa pemasangan semula antara gelombang. Tali leher memastikan papan kekal berdekatan.
    - q: Bagaimana saya boleh mengatasi kekusutan tali leher?
      a: Kekal tenang, terapung di belakang, buka tali perlahan-lahan. Jika tali dibalut di sekitar sirip, anda mungkin perlu menanggalkan sirip semasa berada di dalam air.
