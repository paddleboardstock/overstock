- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'SUP Panduan Paddle: Pilih Dayung yang Sesuai dengan Gaya Anda'
  description: Panduan lengkap untuk SUP dayung — panjang, bahan (aluminium, gentian kaca, karbon), bentuk bilah, dan bagaimana pemilihan dayung mempengaruhi pengalaman mendayung anda.
  definition: SUP Dayung terdiri daripada batang (aluminium, gentian kaca, atau karbon) dan bilah (dihedral, scoop, atau rata). Panjang harus 8-10" di atas ketinggian anda untuk mendayung secara umum.
  tldr: 'Panjang dayung: 8-10" di atas ketinggian anda untuk kegunaan serba boleh, 6-8" untuk luncur, 10-12" untuk pelancongan. Bahan: aluminium (murah, berat), gentian kaca (pertengahan, lentur baik), karbon (ringan, keras, mahal). Bentuk bilah: dihedral (penjejakan stabil), scoop (kuasa), rata (serba boleh). Dayung boleh laras sangat sesuai untuk pemula.'
  problem: Paddle yang disertakan dengan kebanyakan iSUP berfungsi tetapi berat dan tidak cekap. Menaik taraf meningkatkan kecekapan dan keseronokan mendayung, tetapi pilihannya mengelirukan.
  explanation: 'Panjang dayung mempengaruhi kecekapan kayuhan — terlalu pendek memerlukan tunduk, terlalu panjang menyebabkan keletihan bahu. Bahan menentukan berat: dayung karbon adalah 18-24 oz berbanding 28-36 oz untuk aluminium. Saiz bilah mempengaruhi kuasa: bilah yang lebih besar (100+ inci persegi) memberikan lebih banyak pendorongan setiap kayuhan tetapi keletihan lebih cepat. Bilah dihedral bergerak lurus; bilah scoop memberikan lebih banyak tangkapan.'
  solution: 'Untuk panjang yang betul: berdiri dengan dayung menegak, capai lengan ke atas — pemegang dayung harus mengenai pergelangan tangan anda. Untuk bahan: mulakan dengan gentian kaca sebagai peningkatan berat sederhana. Untuk bilah: pilih dihedral untuk mendayung secara umum. Untuk aktiviti: dayung touring lebih panjang dengan bilah yang lebih kecil; dayung luncur lebih pendek dengan bilah yang lebih lebar.'
  recommendation: Dayung Aquafarer karbon seberat 28 oz adalah peningkatan terbaik untuk pendayung kerap. Dayung aluminium boleh laras 3 bahagian yang disertakan sesuai untuk pemula dan pelancongan.
  faq:
    - q: Berapa panjang dayung saya sepatutnya SUP ?
      a: Ukur ketinggian anda dalam inci dan tambah 8-10 untuk mendayung secara keseluruhan. Untuk meluncur ombak, tambah 6-8. Untuk touring, tambah 10-12.
    - q: Adakah paddle karbon berbaloi dengan wang?
      a: Ya untuk pendayung biasa — pengurangan berat badan mengurangkan keletihan dengan ketara dalam sesi yang panjang. Untuk kegunaan sekali-sekala, gentian kaca adalah nilai yang baik.
    - q: Apakah itu paddle boleh laras?
      a: Paddle 2 atau 3 bahagian dengan pelarasan panjang, sesuai untuk dikongsi antara pengguna atau dilaraskan mengikut aktiviti yang berbeza.
    - q: Bagaimana saya menjaga paddle saya?
      a: Bilas dengan air segar selepas penggunaan air masin. Elakkan memandu di atasnya atau menyimpan dalam haba langsung. Periksa ferrule (sambungan) untuk pasir.
