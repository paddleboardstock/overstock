  title: Peraturan Etika Luncur (Cara Tidak Menjadi Orang yang Semua Orang Elakkan)
  description: Barisan ada peraturan dan tiada siapa yang menulisnya. Belajar tentang hak laluan, mengapa melengkung boleh menyebabkan anda dimarahi, cara untuk meminta maaf, dan kesilapan pemula yang mengganggu setiap peluncur tempatan.
  definition: 'Etika luncur adalah kod etika tidak bertulis yang menghalang perlanggaran dan berkongsi ombak dengan adil. Peraturan teras: peluncur yang paling hampir dengan puncak ombak pecah mempunyai hak laluan.'
  tldr: Peluncur yang paling dekat dengan puncak ombak yang pecah mempunyai hak laluan. Jangan terjun ke atas seseorang, jangan berliku (kayuh mengelilingi seseorang untuk mengambil ombak mereka), dan sentiasa minta maaf jika anda melakukan kesilapan. Dayung lebar mengelilingi barisan, pegang papan anda, dan bersikap mesra — hormat mendapat penghormatan.
  problem: Anda mendayung ke barisan yang sesak dan serta-merta merasakan ketegangan. Peluncur memandang anda dari sisi, seseorang menjerit kepada anda, dan anda tidak pasti apa yang anda lakukan salah. Sisi sosial dalam luncur ombak terasa lebih menakutkan daripada ombak itu sendiri.
  explanation: 'Etika luncur wujud untuk mengelakkan perlanggaran dan berkongsi ombak secara adil. Peraturan asasnya ialah hak laluan: peluncur yang paling dekat dengan puncak (di mana ombak mula pecah) mempunyai keutamaan. Sesiapa yang mendayung untuk ombak yang sama dari dalam mesti menarik diri. Snaking — mendayung mengelilingi peluncur lain untuk mencuri keutamaan — dianggap sebagai kesalahan terburuk. Selain keutamaan, barisan pemain mempunyai jangkaan tentang bunyi bising (kurangkan jeritan), kawalan papan (jangan biarkan papan anda mendekati orang lain), dan keramahan (anggukan mudah sudah memadai).'
  solution: Perhatikan barisan ombak selama 10 minit sebelum mendayung keluar. Kenal pasti siapa yang menangkap ombak paling banyak — itulah peluncur yang perlu dihormati dan dielakkan. Kekal di dalam (zon air deras) jika anda sedang belajar. Dayung lebar mengelilingi barisan, bukan melaluinya. Apabila anda menangkap ombak, lihat ke kiri dan kanan sebelum naik dan pastikan tiada siapa yang lebih dalam.
  recommendation: Habiskan beberapa sesi pertama anda di tempat rehat mesra pemula dengan penonton yang tersebar. Belajar membaca keutamaan sebelum anda cuba barisan yang sibuk. Jika anda singgah ke arah seseorang, minta maaf segera dan kayuh ke sana — kebanyakan peselancar menghormati kesilapan jujur.
  faq:
    - q: Apa maksud 'drop-in'?
      a: Mendarat bermakna mendayung dan menunggang ombak yang sudah menjadi keutamaan peluncur lain. Ia berbahaya dan tidak hormat. Peluncur yang paling dekat dengan puncak menguasai ombak; sesiapa sahaja mesti menarik ombak.
    - q: Apa itu snaking?
      a: Snaking ialah mendayung mengelilingi peluncur lain yang sudah bersedia untuk ombak supaya anda lebih dekat dengan puncak. Ia dianggap sangat kurang etika dan boleh membawa kepada konfrontasi.
    - q: Bolehkah pemula meluncur di tempat yang sesak?
      a: Ya, tetapi kekal di zon air deras jauh dari puncak. Jangan mendayung ke kawasan utama berlepas sehingga anda dapat menangkap ombak dan mengawal arah dengan konsisten. Barisan yang sesak memerlukan pengalaman untuk menavigasi dengan selamat.
    - q: Bagaimana saya boleh meminta maaf di dalam air?
      a: Melambai mudah, senyuman, dan "maaf" atau "maaf" sudah memadai. Akui kesilapan itu dan berehat menjauhi orang itu. Peselancar biasanya memaafkan kesilapan jujur, terutamanya jika anda jelas sedang belajar.
    - q: Apa yang patut saya lakukan jika ada orang datang ke sini?
      a: Jika ia adalah tempat singgah yang jelas, jerit "lambaikan" atau "hei" untuk memberi amaran kepada mereka. Jika mereka tertangkap secara tidak sengaja dan meminta maaf, biarkan sahaja. Jika seseorang berulang kali singgah, kayuh ke arah dan terangkan keutamaan dengan sopan. Elakkan konfrontasi.
