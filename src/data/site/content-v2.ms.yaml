- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: 'Pembaikan Wetsuit: Baiki koyakan, jahitan, dan zip sendiri'
  description: Panduan pembaikan wetsuit DIY untuk koyakan neoprena, pemisahan jahitan, zip tersangkut, dan pelindung lutut yang terbelah. Arahan langkah demi langkah menggunakan simen neoprena.
  definition: Pembaikan wetsuit melibatkan pembersihan dan kasar kawasan yang rosak, penggunaan simen neoprena, dan pengerasan di bawah tekanan untuk memulihkan integriti dan fleksibiliti kalis air.
  tldr: 'Koyakan kecil di bawah 1": sapukan simen neoprena pada kedua-dua belah, tunggu 10-15 minit sehingga melekit, tekan dengan kuat, keringkan di bawah berat selama 12 jam. Koyakan yang lebih besar memerlukan tampalan neoprena. Masalah zip: pelincir dahulu, kemudian periksa jika ada kain tersangkut.'
  problem: Wetsuit anda ada koyakan kecil, jahitan terpisah, atau zip yang melekat. Tanpa pembaikan DIY, anda bayar $150+ untuk penggantian sedangkan kos pembaikan $5.
  explanation: Simen neoprena berfungsi dengan melembutkan permukaan neoprena, mewujudkan ikatan kimia apabila pelarut menguap. Simen mesti disapu pada kedua-dua permukaan dan menjadi melekit sebelum disambungkan. Untuk koyak, tepi mesti sejajar dengan tepat. Masalah zip sering disebabkan oleh kakisan garam atau fabrik yang tersangkut pada gigi.
  solution: 'Untuk koyak: bersihkan dengan alkohol, amplas ringan, sapu lapisan simen nipis pada kedua-dua tepi, tunggu sehingga melekat, tekan dengan sempurna, sapukan berat, keringkan 12-24 jam. Untuk tampalan: potong tampalan 1" lebih besar daripada koyakan, sapu simen pada kedua-duanya, clamp. Untuk zip: bilas, sapukan lilin zip, kerja perlahan.'
  recommendation: Simpan Aquafarer kit pembaikan wetsuit dalam beg peralatan anda. Untuk pembaikan besar atau kegagalan jahitan di titik kritikal, pembaikan profesional adalah disyorkan.
  faq:
    - q: Bolehkah saya menggunakan gam super pada wetsuit?
      a: Tidak — gam super kering keras dan rapuh. Gunakan hanya simen neoprena atau aquaseal untuk pembaikan wetsuit.
    - q: Berapa lama pembaikan simen neoprena bertahan?
      a: Pembaikan yang dilakukan dengan betul selalunya lebih kuat daripada neoprena asal dan bertahan sepanjang baki hayat sut.
    - q: Bolehkah saya membaiki zip yang telah terpisah sepenuhnya?
      a: Jika trek telah terpisah daripada neoprena, gam semula dengan simen sentuh. Jika gigi rosak, gantikan zip secara profesional.
    - q: Bagaimana saya boleh membaiki wetsuit yang bocor di jahitan?
      a: Sapukan titisan nipis aquaseal di bahagian dalam jahitan yang bocor dan biarkan mengeras selama 24 jam.
