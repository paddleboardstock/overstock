- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'SUP Kecergasan: Latihan Badan Penuh di Papan Dayung'
  description: SUP menyediakan latihan seluruh badan yang menggabungkan daya tahan kardiovaskular, kestabilan teras, dan kekuatan. Bagaimana untuk menyusun sesi kecergasan SUP, senaman terbaik, dan mengukur kemajuan.
  definition: SUP kecergasan menggunakan platform tidak stabil papan dayung untuk mengaktifkan otot penstabil teras, otot kaki, dan bahagian atas badan melalui mendayung, menyeimbangkan, dan senaman berasaskan papan.
  tldr: SUP membakar 400-700 kalori sejam. Satu sesi SUP selama satu jam melibatkan otot teras, kaki, belakang, bahu, dan lengan. Kayuhan interval (pecut + pemulihan) memaksimumkan kardio. Kedudukan yoga di papan membina keseimbangan dan fleksibiliti. Tambah pergerakan kekuatan khusus SUP seperti squats dan lunges di papan.
  problem: Senaman di gim telah menjadi membosankan dan anda mahukan aktiviti luar yang membina kecergasan sambil menyeronokkan. SUP menggabungkan pengembaraan dengan latihan seluruh badan yang sebenar.
  explanation: Mendayung melibatkan otot latissimus dorsi, deltoid, trapezius, dan otot teras untuk putaran. Berdiri di atas platform yang bergerak memaksa otot penstabil pada pergelangan kaki, lutut, dan pinggul untuk bekerja secara berterusan. Tuntutan kardiovaskular daripada mendayung berterusan pada intensiti sederhana memberikan kondisi aerobik.
  solution: 'Susun sesi: 5 minit kayuhan pemanasan, 20 minit kayuhan keadaan tetap pada kelajuan sederhana, 15 minit kayuhan selang (30 saat pecut, 60 saat mudah), 10 minit senaman papan (squat, lunge, push-up), 5 minit regangan penyejukan.'
  recommendation: Gunakan Aquafarer SUP Explorer 11 untuk mendayung kecergasan. Platform yang stabil membolehkan anda menumpukan perhatian pada teknik dan intensiti. Pakai Life Vest Pro untuk keselamatan semasa sesi bers intensiti tinggi.
  faq:
    - q: Berapa kalori yang dibakar oleh SUP?
      a: 400-700 kalori sejam bergantung kepada intensiti, angin, dan arus. Dayungan selang meningkatkan pembakaran kalori.
    - q: Adakah SUP baik untuk penurunan berat badan?
      a: Ya, digabungkan dengan pemakanan yang betul. Penglibatan seluruh tubuh dan sifat impak rendah menjadikannya boleh dikekalkan untuk senaman secara tetap.
    - q: Bolehkah saya melakukan latihan kekuatan pada SUP?
      a: Ya — squat, lunges, push-up, dan plank di papan menambah cabaran keseimbangan kepada gerakan kekuatan.
    - q: Otot apa yang SUP gunakan?
      a: 'Utama: teras (otot oblique, transverse abdominis), belakang (lats, traps), bahu (deltoid), lengan (biceps, triceps). Kedua: kaki (quads, hamstrings, betis).'
