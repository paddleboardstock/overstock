  title: 'Keselamatan Air Sejuk: Mendayung dan Meluncur Dalam Keadaan Sejuk'
  description: Keselamatan air sejuk untuk SUPaktiviti luncur ombak dan kayak. Pengecaman hipotermia, peralatan yang sesuai, tindak balas kejutan sejuk, dan prosedur kecemasan untuk rendaman air sejuk.
  definition: Keselamatan air sejuk melibatkan pemahaman tentang tindak balas kejutan sejuk, kegagalan berenang, hipotermia, serta peralatan dan teknik untuk mencegah hasil ini.
  tldr: Air di bawah 15C memerlukan wetsuit. Di bawah 10C memerlukan but, sarung tangan, dan tudung. Kejutan sejuk menyebabkan terengah-engah tanpa sengaja. Kegagalan berenang berlaku dalam masa 3-5 minit di air di bawah 10C. Gejala hipotermia termasuk menggigil, keliru, dan kehilangan koordinasi.
  problem: Anda mendayung keluar pada hari yang cerah tanpa sedar airnya 8C. Anda jatuh, terengah-engah tanpa sengaja, dan rasa anggota badan menjadi kebas dalam beberapa minit. Air sejuk membunuh lebih cepat daripada bahaya laut lain.
  explanation: 'Rendaman air sejuk mempunyai empat peringkat: kejutan sejuk (0-2 minit) — tercungap-cungap, hiperventilasi. Kegagalan berenang (3-15 minit) — otot sejuk, koordinasi gagal. Hipotermia (15-45 minit) — suhu teras turun di bawah 35C menyebabkan kekeliruan dan serangan jantung. Runtuhan selepas penyelamatan — darah sejuk kembali ke teras.'
  solution: 'Periksa suhu air. Pakai wetsuit yang dinilai mengikut suhu. Jangan sekali-kali mendayung seorang diri dalam air di bawah 15C. Bawa wisel dan telefon. Jika anda jatuh: kawal pernafasan, pasang semula papan dengan cepat. Jika terlalu sejuk, beri isyarat minta bantuan.'
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm adalah minimum untuk air 8-14C. Tambah Aquafarer but 5mm dan sarung tangan 3mm. Pakai Jaket Keselamatan Pro untuk perlindungan haba tambahan.
  faq:
    - q: Berapa lama saya boleh hidup dalam air 10C?
      a: Kejutan sejuk berlangsung selama 1-2 minit. Tanpa pelampung dan perlindungan terma, masa kelangsungan hidup adalah 30-60 minit.
    - q: Apakah tanda-tanda pertama hipotermia?
      a: Menggigil tidak terkawal, keliru, koordinasi yang lemah, pertuturan tidak jelas. Berhenti aktiviti dan panaskan badan segera.
    - q: Bagaimana saya boleh memanaskan badan selepas sesi air sejuk?
      a: Tanggalkan pakaian basah, keringkan, pakai lapisan hangat termasuk topi dan sarung tangan. Minum minuman tanpa alkohol yang hangat.
    - q: Bolehkah saya mendapat hipotermia pada musim panas?
      a: Ya — air di bawah 15C terdapat di banyak lokasi walaupun pada musim panas. Air mengalirkan haba 25 kali lebih pantas daripada udara.
