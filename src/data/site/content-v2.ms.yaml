  title: 'Panduan Pembelian Jaket Keselamatan: Jenis, Padanan, dan Ciri-ciri Diterangkan'
  description: Panduan lengkap pembelian jaket keselamatan untuk sukan air.PFD jenis (I hingga V), inflasi vs buih, ujian kesesuaian, dan cadangan khusus untuk SUPkayak, berperahu, dan memancing.
  definition: Jaket keselamatan PFD atau ialah alat pelampung yang direka untuk memastikan kepala seseorang kekal di atas air. Jenis-jenis ini dikawal selia oleh Pengawal Pantai AS berdasarkan daya apungan dan tujuan penggunaan.
  tldr: 'Lima PFD jenis: Jenis I (luar pesisir, 22+ lb), Jenis II (dekat pantai), Jenis III (bantuan apungan paling biasa), Jenis IV (boleh dilempar), Jenis V (kegunaan khas). Vest kembung menawarkan keselesaan tetapi memerlukan penyelenggaraan kartrij CO2. Vest buih bebas penyelenggaraan tetapi lebih besar.'
  problem: Jaket keselamatan dikategorikan mengikut jenis dan penarafan daya apungan, tetapi kedai tidak selalu menerangkan jenis yang sesuai dengan aktiviti anda.
  explanation: Jenis I memberikan paling banyak daya apungan dan membuatkan pemakai yang tidak sedarkan diri menghadap ke atas. Jenis II tidak boleh memusingkan semua pemakai menghadap ke atas. Jenis III membenarkan kebebasan bergerak untuk sukan aktif. Jenis V termasuk pek tali pinggang kembung untuk SUP. PFD boleh tiup memberikan daya apungan 33-37 lb dan padat apabila kempis.
  solution: 'Untuk SUP: Pek tali pinggang tiup Jenis V. Untuk berkayak: Buih Jenis III dengan potongan lengan tinggi. Untuk RIB berperahu: Buih Jenis III atau boleh tiup dengan+ daya apungan 22 lb. Untuk kanak-kanak: Buih Jenis II atau III dengan tali kelangkang.'
  recommendation: Aquafarer Jaket Keselamatan Pro (jenis V boleh tiup, 33 lb) untuk SUP dan kayak.Aquafarer Jaket Keselamatan Klasik (buih Jenis III, 16.5 lb) untuk RIB kegunaan bot dan marin am.
  faq:
    - q: Jenis apa PFD yang saya perlukanSUP?
      a: Banyak bidang kuasa menerima Jenis III atau Jenis V untuk SUP. Pek tali pinggang kembung adalah popular. Semak undang-undang tempatan.
    - q: Adakah PFD boleh tiup memerlukan penyelenggaraan?
      a: Ya — periksa kartrij CO2 setiap tahun, tukar bobbin setiap 2-3 tahun, bilas selepas guna air masin.
    - q: Bolehkah saya memakai buih PFD selama SUP?
      a: Ya, tetapi pilih yang mempunyai potongan lengan yang tinggi. Vest busa lebih besar tetapi tidak memerlukan penyelenggaraan.
    - q: Apa PFD yang terbaik untuk seorang kanak-kanak?
      a: USCG-Vest buih Type II atau III yang diluluskan dengan kolar, tali kelangkang, dan warna terang. Jangan sekali-kali menggunakan PFD tiup untuk kanak-kanak.
