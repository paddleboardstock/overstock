  title: 'Penyelenggaraan Bot Tiup: Kekalkan Pelaburan Anda'
  description: Senarai semak penyelenggaraan bot tiup tahunan. Pembersihan, UV perlindungan, pemeriksaan jahitan, pengurusan tekanan, penjagaan enjin, dan persiapan musim sejuk untuk PVC Hypalon bot dan bot.
  definition: Penyelenggaraan bot kembung merangkumi pembersihan, UV perlindungan, pengurusan tekanan, pemeriksaan jahitan dan injap, pencegahan kulat, dan penyimpanan yang betul pada musim luar musim.
  tldr: Bilas selepas setiap penggunaan dalam air masin. Sapukan UV pelindung setiap 2-3 bulan. Periksa tekanan inflasi sebelum setiap keluar. Periksa jahitan, injap, dan transom setiap bulan. Bersihkan dengan sabun lembut. Simpan dalam keadaan kempis di tempat sejuk dan kering pada musim luar.
  problem: Anda menggunakan bot tiup anda untuk satu musim dan kini tiub kelihatan pudar, jahitan berair, dan transom terasa lembik — semua ini boleh dielakkan dengan penyelenggaraan rutin.
  explanation: UV Radiasi merosakkan matriks polimer. Air masin mengkristal dalam lipatan dan mengikis fabrik. Kulat tumbuh dalam kelembapan yang terperangkap. Tekanan yang salah menyebabkan keletihan bahan. Transom (terutamanya papan lapis) menyerap air melalui lubang skru.
  solution: 'Selepas setiap penggunaan: bilas dengan air segar, keringkan, periksa tekanan. Bulanan: lap tiub dengan UV bahan pelindung, periksa jahitan, injap semak. Setiap tahun: bersihkan secara mendalam, periksa transom untuk reput, pelincir injap, uji kebocoran mikro.'
  recommendation: Gunakan 303 Aerospace Protectant pada Aquafarer tiub bot. Tanggalkan injap dan sapukan gris silikon setiap tahun. Simpan dalam beg bawa bersama pek desikan.
  faq:
    - q: Bolehkah saya menggunakan peluntur untuk membersihkan bot tiup saya?
      a: Tidak — peluntur merosakkan lapisan fabrik. Gunakan sabun lembut dan air suam. Untuk kulat, gunakan cuka putih yang dicairkan.
    - q: Berapa kerap saya perlu merawat dengan UV pelindung?
      a: Setiap 2-3 bulan semasa musim penggunaan. Lebih kerap di iklim tropika.
    - q: Adakah saya perlu mengempiskan bot saya antara penggunaan?
      a: Tidak jika digunakan setiap minggu. Biarkan dalam keadaan kembung dengan UV penutup. Untuk jurang bulanan, kempiskan dan simpan.
    - q: Bagaimana saya menjaga transom?
      a: Periksa bolt setiap bulan. Tutup tepi kayu yang terdedah dengan varnis marin setiap tahun. Ganti jika terdapat kawasan lembut.
