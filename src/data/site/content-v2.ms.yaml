  title: 'SUP Panduan Saiz: Penjelasan Panjang, Lebar, dan Isipadu'
  description: Cari saiz yang tepat SUP berdasarkan berat, tahap kemahiran, dan gaya mendayung anda. Panjang menentukan penjejakan, lebar menentukan kestabilan, dan isipadu menentukan kapasiti berat.
  definition: SUP Saiz ditakrifkan oleh panjang (kelajuan dan gelincir), lebar (kestabilan utama), ketebalan (kestabilan sekunder dan isipadu), dan isipadu dalam liter (kapasiti berat keseluruhan).
  tldr: 'SUPsSerba boleh: 10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Surf: 8''-10'' x 30"-32" (140-220L). Pemula memerlukan lebar melebihi 32" dan isipadu melebihi berat badan sebanyak 60-80L. Berat anda dalam kg ditambah 60L adalah sasaran isipadu minimum untuk kestabilan.'
  problem: Setiap SUP jenama menyenaraikan papan dalam kaki, inci, dan liter, tetapi tanpa mengetahui bagaimana ukuran ini diterjemahkan kepada rasa dunia sebenar, anda berisiko membeli papan yang mudah tipis, perlahan, atau tidak dapat menyokong berat badan anda.
  explanation: 'Panjang menentukan seberapa laju papan berdayung dan sejauh mana ia bergerak dalam garis lurus. Papan yang lebih panjang (12''+) meluncur antara kayuhan dan menahan garisan. Papan yang lebih pendek (di bawah 10'') mudah berpusing tetapi memerlukan pertukaran dayung yang lebih kerap. Lebar menentukan kestabilan utama — kestabilan berdiri. Papan 30" terasa tippy bagi pemula; 34" terasa seperti dok. Ketebalan menentukan isipadu — papan yang lebih tebal terapung lebih tinggi tetapi menangkap lebih banyak angin. Isipadu dalam liter adalah metrik terbaik: papan yang dimuatkan (anda ditambah gear) harus tenggelam 2-4 inci ketika berehat.'
  solution: 'Padankan dimensi papan anda dengan tiga faktor: berat anda (menentukan isipadu minimum), aktiviti utama (menentukan panjang), dan tahap kemahiran anda (menentukan lebar). Untuk pemula, darabkan berat dalam kg dengan 2.2 untuk mendapatkan liter minimum. Untuk pertengahan, darabkan dengan 1.8. Untuk tahap lanjutan, darabkan dengan 1.4.'
  recommendation: Aquafarer SUP Explorer 11 pada ukuran 11' x 33" x 6" dengan 260L sesuai untuk kebanyakan penunggang sehingga 100 kg untuk mendayung secara menyeluruh. Naik taraf ke SUP Tour 12 pada saiz 12' x 31" untuk kelajuan touring dan gelongsor yang lebih baik.
  faq:
    - q: Saiz apa SUP yang saya perlukan untuk berat badan saya?
      a: 'Untuk penunggang di bawah 70 kg: 10-11'' x 32" (220-260L). Untuk 70-90 kg: 11-12'' x 33" (260-300L). Untuk 90-110 kg: 11-12'' x 34" (300-350L). Untuk lebih 110 kg: 12'' x 34-36" (350L+).'
    - q: Adakah yang lebih panjang SUP lebih laju?
      a: Ya. Papan yang lebih panjang mempunyai nisbah panjang kepada lebar yang lebih baik, mengurangkan rintangan udara. Papan touring 14' SUP jauh lebih pantas daripada papan 11' all-around pada usaha mendayung yang sama.
    - q: Lebar apa SUP yang stabil untuk pemula?
      a: 33-34 inci adalah titik manis untuk pemula sehingga 90 kg. Di bawah 32" memerlukan keseimbangan yang baik. Di atas 34" sangat stabil tetapi lebih perlahan dan sukar untuk dikayuh ketika angin.
    - q: Bolehkah saya menggunakan papan serba boleh untuk jelajah?
      a: Ya, untuk lawatan pendek di bawah 10 km. Untuk jarak yang lebih jauh, papan pelancongan khusus lebih baik dan menempuh jarak dengan lebih cekap.
