- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm vs 5mm Wetsuit: Kesalahan Kebanyakan Pemula di Air Sejuk'
  description: Berhenti membeku di tengah sesi atau terlalu panas di pantai. Perbezaan sebenar antara wetsuit 3mm dan 5mm — carta suhu, kompromi fleksibiliti, dan apa yang sebenarnya berkesan untuk berselancar di air sejuk.
  definition: Wetsuit adalah pakaian neoprena yang menahan lapisan nipis air di kulit, yang dipanaskan oleh badan untuk penebat. Ketebalan (3mm, 5mm) menentukan julat suhu yang boleh ditahan — lebih tebal lebih panas tetapi kurang fleksibel.
  tldr: Ketebalan wetsuit secara langsung menentukan kehangatan dan fleksibiliti. Gunakan 3mm untuk air lebih daripada 16°C dan 5mm untuk air antara 8°C hingga 16°C. Wetsuit lebih tebal menghadkan pergerakan tetapi mengekalkan kehangatan lebih lama — sentiasa utamakan kesesuaian berbanding jenama.
  problem: Anda membuka kedai dalam talian atau masuk ke kedai luncur dan melihat wetsuit berlabel 3/2, 4/3, 5/4, dan 5mm full suit. Angka-angka itu tidak bermakna sehingga anda sedar bahawa ketebalan yang salah bermakna sama ada kesejukan semasa sesi atau terlalu panas dan berpeluh di pantai.
  explanation: Pakaian selam berfungsi dengan memerangkap lapisan nipis air antara kulit anda dan neoprena; badan anda memanaskan air itu, menghasilkan penebat. Neoprena yang lebih tebal memerangkap lebih banyak air tetapi mengehadkan fleksibiliti dan daya apungan. Sut 3mm (selalunya 3/2mm dengan lengan yang lebih nipis) sesuai untuk keadaan ringan, manakala 5mm (5/4/3 atau 5mm penuh) sesuai untuk air sejuk. Kemasukan zip dada lebih rapat daripada zip belakang dan mengurangkan kemerahan. Pembinaan jahitan — dilekatkan dan dijahit buta (GBS) — adalah perbezaan antara sut bocor dan sut hangat.
  solution: Padankan ketebalan dengan suhu air tempatan anda dengan margin ralat 5°C. Untuk iklim sederhana, beli 3/2mm. Untuk air sejuk, beli 5/4/3mm. Tambah but, sarung tangan, dan tudung untuk memanjangkan julat anda lagi 5°C ke bawah. Cuba pakai sut sebelum membeli atau pilih jenama dengan polisi pemulangan yang murah hati.
  recommendation: Aquafarer Wetsuit Pro dalam 5/4/3mm sesuai untuk kebanyakan peluncur air sejuk, menawarkan jahitan GBS dan lapisan terma. Jika anda meluncur di air suam melebihi 20°C, 3/2mm dengan zip dada adalah pilihan yang lebih baik.
  faq:
    - q: Suhu air berapa yang memerlukan wetsuit 5mm?
      a: Suhu air antara 8°C dan 14°C memerlukan sut 5mm. Di bawah 8°C anda memerlukan sut bertudung 6/5/4mm. Antara 14°C dan 18°C, 4/3mm sesuai untuk kebanyakan orang.
    - q: Bolehkah saya memakai wetsuit 3mm pada musim sejuk?
      a: Hanya dalam iklim musim sejuk sederhana di mana air kekal melebihi 16°C. Untuk luncur ombak musim sejuk sebenar, 5mm atau 5/4/3mm diperlukan. But, sarung tangan, dan tudung menambah kehangatan setara tanpa memerlukan badan yang lebih tebal.
    - q: Seberapa ketat sepatutnya wetsuit?
      a: Ketat tetapi tidak membataskan. Tiada poket udara atau neoprena longgar. Jika anda boleh menyelitkan jari antara kulit dan sut di bahagian bawah belakang, ia terlalu longgar. Jika sukar bernafas atau pergerakan sangat terhad, tingkatkan saiz.
    - q: Adakah wetsuit mahal boleh buat anda lebih hangat?
      a: Harga yang lebih tinggi selalunya bermakna neoprena yang lebih baik (berasaskan batu kapur berbanding petroleum), pembinaan jahitan yang lebih baik (GBS berbanding gam sahaja), dan kelenturan yang lebih baik. Faktor-faktor ini secara langsung mempengaruhi kehangatan dan ketahanan tetapi hanya jika kesesuaiannya betul.
