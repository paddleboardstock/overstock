  title: 'Panduan Saiz Papan Dayung: Isipadu, Panjang, dan Lebar untuk Setiap Penunggang'
  description: Saiz papan dayung lengkap dengan cadangan isipadu mengikut berat dan aktiviti. Termasuk carta saiz yang mudah digunakan untuk papan serba boleh, pelancongan, luncur ombak, dan yoga SUP .
  definition: Saiz papan dayung ditentukan oleh isipadu (kapasiti berat dan pelampung), panjang (kelajuan dan penjejakan), lebar (kestabilan), dan ketebalan (pengagihan isipadu dan rintangan angin).
  tldr: 'Gunakan berat untuk mencari isipadu minimum: 50-70 kg memerlukan 220-260L, 70-90 kg memerlukan 260-300L, 90-110 kg memerlukan 300-350L, 110+ kg memerlukan 350L+. Untuk pemula, tambah 20% pada nombor ini. Lebar penting: 32" adalah sederhana, 33-34" mesra pemula, 35"+ sangat stabil.'
  problem: Senarai saiz papan dayung menggunakan kaki, inci, dan liter secara bergantian, menjadikannya sukar untuk dibandingkan antara jenama.
  explanation: Isipadu adalah metrik paling langsung untuk kapasiti berat — 1 liter air tawar menggantikan 1 kg berat. Papan dengan 260L secara teori boleh menyokong 260 kg, tetapi kapasiti praktikal lebih rendah kerana papan perlu berada di atas air. Jumlah berat anda (badan ditambah peralatan) sepatutnya 30-40% daripada isipadu papan.
  solution: Isipadu sasaran = (berat badan dalam kg + berat gear dalam kg) x 3. Untuk pendayung 75 kg dengan gear 5 kg, sasaran = 80 x 3 = minimum 240L. Untuk pemula, darabkan dengan 3.5. Untuk tahap lanjutan, darabkan dengan 2.5.
  recommendation: Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") sesuai untuk kebanyakan penunggang 50-100 kg. Penunggang ringan boleh mencapai saiz AirDeck 270. Penunggang yang lebih berat harus mempertimbangkan SUP papan Tour 12 (300L+) atau papan yang lebih lebar.
  faq:
    - q: Adakah ketinggian penting untuk SUP saiz?
      a: Ketinggian kurang penting berbanding berat. Penunggang tinggi dan ringan memerlukan isipadu yang kurang berbanding penunggang berat yang pendek. Gunakan berat sebagai penentu utama isipadu anda.
    - q: Apa yang berlaku jika terlalu banyak volum?
      a: Papan itu terlalu tinggi, menangkap angin seperti layar. Ia terasa seperti gabus apabila dipotong. Namun, bagi pemula, jumlah tambahan lebih baik daripada terlalu sedikit.
    - q: Apa yang berlaku jika volum terlalu sedikit?
      a: Papan itu terlalu dalam, menyebabkan rintangan udara. Hidung mungkin tenggelam semasa mendayung (pearling). Anda cepat letih kerana mendayung papan yang separa tenggelam.
    - q: Adakah papan kembung memerlukan saiz berbeza daripada papan keras?
      a: Tidak signifikan. Inflatable pada 15+ PSI mengalihkan air sama seperti papan keras. Cadangan isipadu terpakai sama rata untuk kedua-dua jenis.
