- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Panduan Sauh: Kekal di tempat semasa memancing atau mengambil gambar'
  description: Panduan lengkap untuk SUP berlabuh — jenis sauh (cendawan, lipat, tiang), susunan troli sauh, teknik penempatan, dan pertimbangan keselamatan untuk kekal di posisi.
  definition: SUP Sauh ialah pemberat yang diikat pada tali yang menahan papan di kedudukan melawan angin dan arus. Jenis biasa termasuk sauh cendawan, sauh lipat, dan tiang pengintai.
  tldr: Gunakan sauh cendawan (1.5-3 lb) untuk dasar berlumpur atau berpasir, sauh lipat untuk dasar berbatu, atau tiang pengintip untuk air cetek dengan dasar lembut. Sauh harus 1.5-3 lb untuk keadaan tenang, 3-5 lb untuk angin dan arus. Sentiasa gunakan troli sauh untuk melaraskan kedudukan dan tahu bila perlu dilepaskan.
  problem: Anda akan menemui tempat memancing yang sempurna tetapi angin dan arus mengalihkan anda dari posisi setiap beberapa minit. Tanpa berlabuh, SUP memancing dan fotografi adalah latihan yang mengecewakan apabila sentiasa mengubah posisi.
  explanation: Sauh berfungsi dengan menyeret melintasi dasar sehingga ia tersangkut. Sauh cendawan tertanam ke dasar yang lembut dan memberikan penahanan yang baik dalam pasir dan lumpur. Sauh lipat mempunyai fluke yang mencengkam dasar keras atau berbatu. Tiang pengintip berfungsi di air cetek dengan menolak terus ke dasar.
  solution: Pasang sistem troli sauh (tali dengan cincin gelangsar di satu sisi papan) untuk melaraskan titik pemasangan sauh. Pasang tali setebal 50-75' pada sauh. Pasang tali berlawanan arah angin atau arus ke arah kedudukan yang anda inginkan. Gunakan sistem pelepasan pantas untuk melepaskan semasa kecemasan. Jangan sekali-kali berlabuh dalam arus kuat atau di tempat yang sukar untuk menarik sauh dengan mudah.
  recommendation: Sauh lipat seberat 3 lb dengan tali 50' sesuai untuk kebanyakan SUP keadaan memancing. Tambah sistem troli sauh menggunakan cincin D pada Aquafarer SUP Explorer 11 anda.
  faq:
    - q: Saiz sauh apa yang saya perlukanSUP?
      a: 1.5-3 lb untuk tasik tenang dan sungai yang perlahan. 3-5 lb untuk kawasan pesisir dengan angin atau arus. Sauh bersaiz besar sukar untuk diambil semula.
    - q: Berapa banyak tali sauh yang saya perlukan?
      a: Skop 5:1 (5 kaki tali untuk setiap 1 kaki kedalaman) adalah standard. Dalam 10' air, gunakan 50' tali.
    - q: Adakah penambat berbahaya pada SUP?
      a: Hanya jika anda berlabuh pada arus atau angin yang cukup kuat untuk menyebabkan papan terbalik. Sentiasa gunakan sistem pelepasan pantas yang boleh ditanggalkan serta-merta.
    - q: Bolehkah saya berlabuh di mana-mana air?
      a: Semak peraturan tempatan. Sesetengah kawasan mengehadkan penjangkaan untuk melindungi rumput laut atau habitat marin. Jangan sekali-kali berlabuh di terumbu karang.
