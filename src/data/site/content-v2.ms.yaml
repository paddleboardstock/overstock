  title: 'Memahami Pasang Surut untuk Sukan Air: Panduan Praktikal'
  description: Bagaimana pasang surut mempengaruhi SUPkeadaan luncur ombak dan berkayak. Membaca carta pasang surut, memahami pasang surut musim bunga vs neap, dan merancang sesi anda berdasarkan pergerakan pasang surut demi keselamatan.
  definition: Pasang surut adalah kenaikan dan penurunan paras laut harian yang disebabkan oleh tarikan graviti bulan dan matahari. Julat pasang surut berbeza mengikut lokasi dan kitaran bulan.
  tldr: 'Dua pasang surut tinggi dan dua pasang rendah setiap hari di kebanyakan lokasi. Pasang surut musim bunga (bulan penuh/baru) mempunyai julat yang lebih luas dan arus yang lebih kuat. Pasang surut neap (bulan suku bulan) mempunyai julat yang lebih kecil. Pasang surut mempengaruhi kedalaman air, bentuk ombak, dan kekuatan arus. Untuk SUP: mendayung melawan arus dahulu supaya ia membantu anda kembali.'
  problem: Anda tiba di tempat rehat tempatan dan mendapati hampir tiada ombak, ombak berbahaya akibat air pasang keluar, atau air terlalu cetek. Tanpa memahami pasang surut, anda membazirkan perjalanan atau mendayung dalam keadaan berbahaya.
  explanation: Pasang surut disebabkan oleh graviti bulan. Pasang surut musim bunga (bulan penuh dan bulan baru) menghasilkan suhu tertinggi dan terendah rendah. Pasang surut neap (suku bulan) menghasilkan julat yang minimum. Arus pasang surut paling laju pada pertengahan pasang, longgar pada tinggi dan rendah. Julat pasang surut berbeza dari 0.3m (Mediterranean) hingga 16m (Teluk Fundy).
  solution: 'Semak carta pasang surut sebelum setiap sesi. Untuk meluncur: rehat pantai selalunya paling sesuai 2-3 jam di kedua-dua sisi air pasang. Untuk SUP: dayung melawan arus separuh pertama supaya arus membantu kembali. Untuk memancing: air pasang masuk menolak ikan ke kawasan rata.'
  recommendation: Gunakan ramalan pasang surut NOAA atau aplikasi pasang surut tempatan. Ketahui pilihan pasang surut pecah tempatan anda dengan merekodkan keadaan selama sebulan.
  faq:
    - q: Apakah itu pasang surut musim bunga?
      a: Pasang surut musim bunga berlaku semasa bulan purnama dan bulan baru, menghasilkan air pasang tinggi yang lebih tinggi dan arus yang lebih kuat. Ia berlaku dua kali sebulan.
    - q: Apakah itu neap tide?
      a: Pasang surut neap berlaku semasa suku bulan. Julat pasang surut lebih kecil, dan arus lebih lemah — sesuai untuk pemula.
    - q: Adakah air surut berbahaya untukSUP?
      a: Air surut boleh mendedahkan batu dan terumbu. Ia juga menumpukan tenaga ombak pada bar pasir yang lebih curam.
    - q: Bagaimana pasang surut mempengaruhi arus rip?
      a: Air pasang keluar (surut) menguatkan arus rip. Air pasang masuk (banjir) mengurangkan kekuatan rip.
