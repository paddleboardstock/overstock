cases:
  - id: beginner
    title: 'رياضات مائية للمبتدئين'
    desc: 'ألواح SUP وزوارق كاياك ثابتة لتجربة أولى.'
    scenario: >-
      'عائلة تزور بحيرة في عطلة نهاية الأسبوع وتريد تجربة التجديف بالوقوف. تحتاج إلى معدات ثابتة وسهلة الإطلاق مع إرشادات سلامة واضحة.'
    solution: >-
      'يوفر SUP Explorer 11 ثباتًا بجسم عريض للمبتدئين. يضمن Life Vest Classic طفوًا معتمدًا بشهادة CE. تنفخ مضخة الحركة المزدوجة كلا اللوحين في أقل من 10 دقائق.'
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 'استكشاف في الهواء الطلق'
    desc: 'زوارق كاياك وقوارب محمولة للأنهار والبحيرات والرحلات الساحلية.'
    scenario: >-
      'يخطط أحد هواة الأنشطة الخارجية لرحلة نهرية تستغرق أسبوعًا ويحتاج إلى قارب يُحزم صغيرًا وينفخ في المخيم ويتعامل مع تيارات متغيرة.'
    solution: >-
      'يُحزم Kayak Lite في حقيبة ظهر وينفخ في أقل من 4 دقائق. تتعامل بنيته من نوع drop-stitch مع البحيرات والأنهار البطيئة والتجديف الساحلي.'
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: 'عمليات احترافية'
    desc: 'قوارب RIB بدرجة تجارية لمشغلي الجولات وفرق الاستجابة للطوارئ.'
    scenario: >-
      'يحتاج مشغل جولات ساحلية إلى أسطول من القوارب المتينة لرحلات يومية في ظروف بحرية متغيرة وبما يلبي لوائح السلامة التجارية.'
    solution: >-
      'يستخدم RIB 330 وRIB 450 Patrol هياكل من ألياف الزجاج على شكل V عميق مع عوامات Hypalon لمتانة في جميع الأجواء. يمكن نشر وحدات متعددة بأداء ثابت.'
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: 'أنشطة عائلية'
    desc: 'قوارب واسعة لرحلات يومية وصيد السمك والرياضات المائية.'
    scenario: >-
      'عائلة من أربعة أفراد تريد قاربًا ثابتًا لرحلات نهاية الأسبوع في البحيرة ولممارسة صيد السمك وسحب أنبوب مرح للأطفال.'
    solution: >-
      'يتسع AirDeck 360 لخمسة أشخاص بأرضية هوائية معززة. يُنفخ عند نقطة الانطلاق ويُخزن في السيارة ويتعامل مع البحيرات الهادئة والمياه الساحلية المحمية.'
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
