cases:
  - id: beginner
    title: التجديف للمبتدئين
    desc: ألواح قابلة للنفخ مستقرة SUP للمبتدئين في التجديف.
    scenario: عائلة تزور بحيرة لعطلة نهاية الأسبوع ترغب في تجربة ركوب اللوح المجداف. يحتاجون إلى معدات مستقرة وسهلة الإطلاق مع إرشادات أمان واضحة.
    solution: يوفر SUP Explorer 11 استقرارًا واسع الجسم للمبتدئين. يضمن Life Vest Classic الطفو المعتمد CE. يقوم Oars & Pump Set بنفخ اللوح في أقل من 10 دقائق.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: التجوال والاستكشاف
    desc: ألواح قابلة للنفخ للمسافات الطويلة SUP للبحيرات والأنهار والرحلات الساحلية.
    scenario: يمتلك عشاق الهواء الطلق خطة لرحلة تجديف تستمر أسبوعاً ويحتاجون إلى لوح يعبأ صغيراً، وينتفخ في المخيم، ويسير مستقيماً على الماء المفتوح.
    solution: ينزلق Ocean Voyager Series بكفاءة مع تصميم جولات ويحافظ على مساره في الرياح والأمواج الصغيرة. بنيته drop-stitch تُنفخ حتى 15 PSI لجعل اللوح صلبًا.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP اليوغا واللياقة
    desc: منصات واسعة ومستمرة للاستقرار لليوغا واللياقة والاسترخاء.
    scenario: يريد ممارس اليوغا استوديو عائم لجلسات الصباح على المياه الهادئة، مع مساحة كافية على السطح لأداء كل الوضعيات.
    solution: يتميز Flowing Lotus Series بسجادة بطول اللوح بالكامل وعرض واسع للتمارين دون اهتزاز. كما يمكن استخدامه كمنصة مستقرة للتمارين الخفيفة.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: الترفيه العائلي
    desc: حزم SUP كاملة لأيام البحيرة وعطلات نهاية الأسبوع.
    scenario: تريد عائلة مكونة من أربعة أفراد ألواحاً مستقرة لنزهات البحيرة وعطلات الشاطئ — معدات يمكن وضعها في السيارة وتنفخ خلال دقائق.
    solution: يعتبر Tropical Breeze Series لوحًا مستقرًا لجميع الاستخدامات يمكن للعائلة بأكملها استخدامه، بينما Medusa Glow Series أخف وأقصر للأطفال. كلاهما يمكن وضعه في حقائب الظهر للسفر بسهولة.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
