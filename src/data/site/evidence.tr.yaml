badge: Proof & Results
heading: Kanıt
description: Üretim kapasitemizi ve ürün kalitemizi gösteren gerçek vaka çalışmaları, sertifikalar, test verileri ve dağıtım fotoğrafları.
case_studies:
  - id: retail-private-label
    client: Avrupa Açık Hava Perakendecisi
    product: Özel Marka SUP Serisi
    industry: Perakende
    challenge: Avrupa açık hava perakendecisi, benzersiz zemin grafikleri, çevre dostu PVC ve satışa hazır ambalaj ile 60 gün içinde teslim edilecek özel marka SUP serisine ihtiyaç duydu.
    solution: Özel dijital baskı dosyaları geliştirdik, REACH-uyumlu PVC tedarik ettik ve tasarım ekibini Qingdao fabrikamızda konumlandırarak numune sürecini 3 turdan 1’e düşürdük.
    result: İmzalı PO’dan FOB kadar 55 gün. 4 SKU üzerinden 2.400 birim. İlk konteyner gelmeden önce tekrar sipariş verildi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - Perakende
      - SUP
    outcome_metrics:
      - label: Teslim Süresi
        value: 55 gün
      - label: Birimler
        value: 2,400
      - label: SKU’lar
        value: '4'
  - id: startup-drop-stitch-kayak
    client: ABD Su Sporları Girişimi
    product: Drop-Stitch Kano
    industry: Girişim / Perakende
    challenge: ABD su sporları girişimi, özel gövde şekline sahip yüksek performanslı drop-stitch kano, ortak markalı ambalaj ve perakende yerleştirme için BSCI sertifikasına ihtiyaç duydu.
    solution: Mevcut drop-stitch kano kalıbını modifiye edilmiş rocker profili ile uyarladık, ortak markalı ambalaj tasarımını geliştirdik ve tam BSCI denetim belgelerini sağladık.
    result: ABD’deki 3 büyük açık hava zincirinde başarıyla listelendi. İlk yıl 5.000+ birim, %98 satma oranı.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
    tags:
      - OEM
      - Kano
      - BSCI
    outcome_metrics:
      - label: Perakende Zincirleri
        value: '3'
      - label: İlk Yıl Birimleri
        value: 5,000+
      - label: Satış Oranı
        value: 98%
  - id: australian-rib-distributor
    client: Avustralya Distribütörü
    product: CE-Sertifikalı RIB Serisi
    industry: Deniz / Hükümet
    challenge: Avustralya distribütörü, özel tüp renkleri, Hypalon yükseltme seçeneği ve Avustralya Standardı AS 1799 ile uyumlu CE-sertifikalı RIB serisine ihtiyaç duydu.
    solution: 4 tüp renk varyantıyla üretim öncesi numuneler üretildi, Japon tedarikçiden CSM Hypalon tedarik edildi ve üçüncü taraf AS 1799 uyumluluk testleri koordine edildi.
    result: 3 model RIB serisi AU/NZ pazarında piyasaya sürüldü. Bunu 12 devriye RIBs için hükümet ihale kazanımı izledi.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Hükümet
    outcome_metrics:
      - label: Piyasaya Sürülen Modeller
        value: '3'
      - label: Devriye Botu Sözleşmesi
        value: 12 birim
      - label: Uyumluluk
        value: AS 1799
  - id: caribbean-resort-fleet
    client: Karayip Lüks Tatil Köyü Grubu
    product: Tatil Köyü Filosu — RIBs, SUP, Kano
    industry: Konaklama / Turizm
    challenge: 5 tatil köyünden oluşan bir grup, tutarlı marka ile birleştirilmiş kiralık su sporları ekipmanı filosuna — RIB ihaleler, SUPs ve kanolar — ihtiyaç duyuyordu, tropikal güneşe dayanıklı UV malzemeler ve 5 yıllık yenileme planı ile.
    solution: UV-stabilize PVC, tatil köyü markalı güverte grafikleri ve aşamalı teslimat programı ile özel 3 model filoları paketi tasarlandı. Personel eğitimi ve her tatil köyü için özel yedek parça kiti sağlandı.
    result: 5 tatil köyü arasında toplam 180 birim teslim edildi. 2 yeni mülk için tekrar sipariş alındı. Önceki tedarikçilere göre birim başına maliyette %40 azalma sağlandı.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - Kano
      - RIB
      - Konaklama
    outcome_metrics:
      - label: Teslim Edilen Birimler
        value: 180
      - label: Tatil Köyleri
        value: '5'
      - label: Maliyet Azaltımı
        value: 40%
  - id: southeast-asia-search-rescue
    client: Güneydoğu Asya Denizcilik Ajansı
    product: Devriye & Kurtarma RIB Filos
    industry: Hükümet / Deniz Güvenliği
    challenge: Bir hükümet denizcilik ajansı, yangına dayanıklı Hypalon kumaş, kendi kendini boşaltan zeminler, entegre VHF/radyo konsol montajları ve SOLAS Bölüm III kurtarma botu standartlarına uygun 20 devriye ve kurtarma RIBs talep etti.
    solution: 20 RIBs, CSM Hypalon tüpler, deniz sınıfı alüminyum gövdeler, ağır hizmet çekme gözleri ve önceden takılmış navigasyon ışığı paketleri ile üretildi. Fabrika denetim ekibi deniz denemelerine tanık oldu. Tam SOLAS dokümantasyon paketi sağlandı.
    result: Sözleşme 4 ayda teslim edildi. Filolar, 3 bölgesel üs arasında sınır devriyesi, arama ve kurtarma ve afet müdahalesi için konuşlandırıldı.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - Hükümet
      - SOLAS
    outcome_metrics:
      - label: Devriye RIBs
        value: '20'
      - label: Teslimat
        value: 4 ay
      - label: Üsler
        value: '3'
  - id: european-dtc-ecommerce
    client: Avrupa DTC Su Sporları Markası
    product: Markalı SUP + Aksesuar Serisi
    industry: E-ticaret / Perakende
    challenge: Hızla büyüyen bir DTC su sporları markası, e-ticaret teslimatına uygun premium ambalajlı eksiksiz bir SUP paketi (board, pompa, kürek, tasm, çanta) ihtiyacı duyuyordu — DHL/FedEx ile tüketiciye doğrudan hasarsız teslimat.
    solution: Özel EPS çekirdek şekillendirmesi, yüksek basınç için özel drop-stitch teknolojisi ve iç destek süngeri ile perakende hazır çift katlı oluklu kutulardan oluşan ortak markalı bir ürün serisi geliştirildi. QR kod tabanlı orijinallik ve garanti kaydı entegre edildi.
    result: 3 model SUP serisi 75 gün içinde piyasaya sürüldü. İlk 12 ayda 15.000+ adet satıldı. 2.000+ yorumda ortalama 4.8★ puan alındı. Taşıma sırasında hasar oranı %0,3.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - E-ticaret
    outcome_metrics:
      - label: Modeller
        value: '3'
      - label: Birimler
        value: 15,000+
      - label: Ortalama Puan
        value: 4.8★
      - label: Hasar Oranı
        value: 0.3%
certifications:
  - name: CE
    body: Avrupa Birliği
    desc: Ürünler, yürürlükteki AB direktiflerine göre CE sertifikasına sahiptir — EN ISO 6185 standardına göre rekreasyonel araçlar, gerekli durumlarda EN ISO 12402 standardına göre kişisel can yelekleri.
  - name: ISO 9001
    body: SGS / BSI
    desc: Şişme su araçlarının tasarım, üretim ve dağıtımı için kalite yönetim sistemi sertifikalıdır.
  - name: BSCI
    body: amfori
    desc: Etik üretim, adil iş gücü ve iş yeri güvenliğini gösteren sosyal uyum sertifikası.
  - name: REACH
    body: Avrupa Kimya Ajansı
    desc: Tüm malzemeler, kimyasal güvenlik için REACH düzenlemelerine uygundur. Belgeler her sevkiyatla birlikte sağlanır.
  - name: RoHS
    body: Avrupa Birliği
    desc: Tüm elektronik ve elektrikli bileşenlerde tehlikeli maddeler kısıtlaması uyumluluğu.
  - name: AS 1799
    body: Standartları Avustralya
    desc: Şişme botlar için Avustralya standardı — AU/NZ sularında ticari kullanım için test edilmiş ve sertifikalandırılmıştır.
