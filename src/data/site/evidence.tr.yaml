badge: Proof & Quality
heading: Kanıt
description: Real quality stories, test data, and factory photos that show how every clearance board ships at retail-grade quality.
case_studies:
  - id: clearance-quality-check
    client: İndirimli Stok, Perakende Kalite Kontrolü
    product: Her Aşırı Stok Kurulu, Yeniden Denetlendi
    industry: Kalite Kontrol
    challenge: Stok fazlası ve indirimli kartlar, artan üretim serilerinden gelir, bu yüzden alıcılar, indirimli bir kartın tam fiyatlı bir kart ile aynı kontrollerden geçip geçmediğini haklı olarak sorar.
    solution: Every clearance board re-enters the QC line. Each chamber is pressure-tested with a 24-48h hold at 1.25x rated pressure, every outgoing shipment is inspected for defects, and accessories are checked for completeness before packing.
    result: Son 12 ayda gönderilen mallarda %99,3 hata oranı bulunmamaktadır — aynı standart, gümrükleme ve perakende stok için de geçerlidir.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - Pressure Testing
      - Defect-Free
      - Clearance QC
    outcome_metrics:
      - label: Hatasız Oran
        value: 99.3%
      - label: Basınç Testi Kapsamı
        value: 100%
      - label: Tutma Süresi
        value: 24-48h
  - id: pressure-test-regime
    client: 24-48 Saatlik Basınç Tutma
    product: Her Komora, 1.25x Ölçülmüş Basınç
    industry: Ürün Testi
    challenge: Bir SUP tahtası, drop-stitch çekirdeği ve dikişleri tarafından yaşar ya da ölür ve hattın sonunda yapılan hızlı bir şişirme kontrolü, yavaş sızıntıları veya zayıf kaynakları yakalamak için yeterli değildir.
    solution: Her tahta, nominal basıncının 1,25 katına şişirilir ve 24-48 saat boyunca tutulur, basınç düşüşünün %5'in altında kalması gerekir. Valfler, D halkaları, dikişler ve yüzdürme özelliği, güvenlik kusurları için sıfır tolerans ile kontrol edilir.
    result: Üretimin %100'ü paketlemeden önce bu rejimden geçer — numune alma kısayolu yok, istisna yok.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-sup-manufacturing.webp
    tags:
      - Drop-Stitch
      - 1,25x Basınç
      - Sıfır Güvenlik Hatası
    outcome_metrics:
      - label: Test Basıncı
        value: 1.25x
      - label: Maksimum Basınç Düşüşü
        value: <%5
      - label: Test Edilen Birimler
        value: 100%
  - id: warranty-claims-support
    client: Cevap Veren Bir Garanti
    product: SUP Kartları ve Aksesuarları için 2 Yıllık Garanti
    industry: Satış Sonrası
    challenge: Fabrikadan doğrudan tasfiye ürünü satın almak haklı bir soru doğuruyor — birkaç ay sonra bir şey ters giderse, bunu kim halleder?
    solution: Her panoya, SUP panolar, drop-stitch dikişler, şişirme vanaları ve aksesuarları kapsayan 2 yıl garanti ile gönderilir. Talepler doğrudan ekibimize iletilir — fotoğraf veya kısa bir video gönderin ve biz süreci başlatırız.
    result: Garanti talepleri, üretimi denetleyen aynı ekip tarafından incelenir ve çözülür — dağıtıcıdan yönlendirme yok.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/hero/factory-gate.webp
    tags:
      - 2 Yıl Garanti
      - Doğrudan Destek
      - Aksesuarlar Kapsanır
    outcome_metrics:
      - label: Garanti
        value: 2 yıl
      - label: Kapsam
        value: Kart + Aksesuarları
      - label: Destek
        value: Doğrudan Ekip
