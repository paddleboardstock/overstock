badge: Proof & Results
heading: 증거
description: 제조 능력과 제품 품질을 입증하는 실제 사례 연구, 인증서, 테스트 데이터 및 배포 사진.
case_studies:
  - id: retail-private-label
    client: 유럽 아웃도어 소매업체
    product: 자사 브랜드 SUP 라인
    industry: 소매
    challenge: 유럽 아웃도어 소매업체는 고유한 데크 그래픽, 친환경 PVC, 소매 준비 포장을 갖춘 자사 브랜드 SUP 라인이 필요했으며 60일 내에 모든 것을 제공했습니다.
    solution: 맞춤형 디지털 인쇄 파일 개발, REACH 준수 PVC 소싱, 디자인 팀을 칭다오 공장에 함께 배치하여 샘플링을 3회에서 1회로 압축했습니다.
    result: 서명된 구매 주문에서 FOB까지 55일. 4개의 SKU에 걸쳐 2,400개 유닛. 첫 컨테이너 도착 전에 재주문이 이루어졌습니다.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - 소매
      - SUP
    outcome_metrics:
      - label: 리드 타임
        value: 55일
      - label: 유닛
        value: 2,400
      - label: SKU
        value: '4'
  - id: startup-drop-stitch-kayak
    client: 미국 수상 스포츠 스타트업
    product: Drop-Stitch 카약
    industry: 스타트업 / 소매
    challenge: 미국 수상 스포츠 스타트업은 소매 판매를 위해 맞춤형 선체 형상, 공동 브랜드 포장, BSCI 인증을 갖춘 고성능 drop-stitch 카약이 필요했습니다.
    solution: 기존 drop-stitch 카약 몰드를 수정된 로커 프로파일로 적용하고, 공동 브랜드 포장 아트워크를 개발하며, 전체 BSCI 감사 문서를 제공했습니다.
    result: 미국의 3대 아웃도어 체인에 성공적으로 등록됨. 첫 해 5,000+ 유닛, 판매율 98%.
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
    tags:
      - OEM
      - 카약
      - BSCI
    outcome_metrics:
      - label: 소매 체인
        value: '3'
      - label: 첫 해 유닛
        value: 5,000+
      - label: 판매율
        value: 98%
  - id: australian-rib-distributor
    client: 호주 유통업체
    product: CE 인증 RIB 라인
    industry: 해양 / 정부
    challenge: 호주 유통업체는 맞춤형 튜브 색상, Hypalon 업그레이드 옵션, 호주 표준 AS 1799 준수를 갖춘 CE 인증 RIB 라인이 필요했습니다.
    solution: 4가지 튜브 색상 변형의 사전 생산 샘플 제작, 일본 공급업체에서 CSM Hypalon 소싱, 제3자 AS 1799 준수 테스트를 조율함.
    result: 3-모델 RIB 범위가 AU/NZ 시장에 출시되었습니다. 이어서 12대 순찰 RIBs에 대한 정부 입찰 수주가 이어졌습니다.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - 정부
    outcome_metrics:
      - label: 출시된 모델
        value: '3'
      - label: 순찰선 계약
        value: 12개
      - label: 준수
        value: AS 1799
  - id: caribbean-resort-fleet
    client: 카리브해 럭셔리 리조트 그룹
    product: 리조트 함대 — RIBs, SUP, 카약
    industry: 환대 / 관광
    challenge: 5개의 리조트 그룹은 통일된 렌탈 수상 스포츠 장비 — RIB 텐더, SUPs, 카약 — 를 필요로 했으며, 일관된 브랜드, 열대 햇빛에 강한 UV 소재, 5년 교체 계획이 포함되어야 했습니다.
    solution: PVC가 UV로 안정화된 맞춤형 3모델 함대 패키지를 설계하고, 리조트 브랜드 데크 그래픽과 단계별 배송 일정을 포함했습니다. 직원 교육과 리조트별 전용 예비 부품 키트도 제공했습니다.
    result: 5개 리조트에 180대 배송 완료. 2개의 신규 시설에 대한 재주문. 이전 공급업체 대비 단가 40% 절감.
    image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - 카약
      - RIB
      - 환대
    outcome_metrics:
      - label: 배송된 단위
        value: 180
      - label: 리조트
        value: '5'
      - label: 비용 절감
        value: 40%
  - id: southeast-asia-search-rescue
    client: 동남아시아 해양 기관
    product: 순찰 및 구조 RIB 함대
    industry: 정부 / 해상 보안
    challenge: 한 정부 해양 기관은 화재 방지 Hypalon 원단, 자체 배수 바닥, 통합 VHF/라디오 콘솔 장착, SOLAS 제3장 구조정 기준 준수를 갖춘 20척의 순찰 및 구조 RIBs를 요구했습니다.
    solution: 20개의 RIBs를 CSM Hypalon 튜브, 해양 등급 알루미늄 선체, 강력한 견인용 아이, 그리고 사전 설치된 항법등 패키지와 함께 제조했습니다. 공장 검사 팀이 해상 시운전을 참관했습니다. 전체 SOLAS 문서 패키지가 제공됩니다.
    result: 계약은 4개월 만에 전달되었습니다. 함대는 3개의 지역 기지에서 국경 순찰, 수색 및 구조, 재난 대응을 위해 배치되었습니다.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - 정부
      - SOLAS
    outcome_metrics:
      - label: 순찰 RIBs
        value: '20'
      - label: 배송
        value: 4개월
      - label: 기지
        value: '3'
  - id: european-dtc-ecommerce
    client: 유럽 DTC 수상 스포츠 브랜드
    product: 브랜드 SUP + 액세서리 라인
    industry: 전자상거래 / 소매
    challenge: 빠르게 성장하는 DTC 수상 스포츠 브랜드는 전자상거래 배송에 적합하게 설계된 프리미엄 포장으로 구성된 SUP 패키지(보드, 펌프, 패들, 리쉬, 가방)가 필요했습니다 — DHL/FedEx를 통한 직접 소비자 배송 시 손상 없이.
    solution: 커스텀 EPS 코어 성형, 더 높은 압력을 위한 독점 drop-stitch 기술, 삽입 패딩이 포함된 소매용 이중벽 골판지 상자를 적용한 공동 브랜드 제품 라인을 개발했습니다. QR코드 기반 정품 인증 및 보증 등록을 통합했습니다.
    result: 3 모델 SUP 라인이 75일 만에 출시되었습니다. 첫 12개월 동안 15,000+ 유닛 판매. 2,000+ 리뷰 기준 평균 평점 4.8★. 운송 중 손상률 0.3%.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - 전자상거래
    outcome_metrics:
      - label: 모델
        value: '3'
      - label: 유닛
        value: 15,000+
      - label: 평균 평점
        value: 4.8★
      - label: 손상률
        value: 0.3%
certifications:
  - name: CE
    body: 유럽 연합
    desc: 제품은 관련 EU 지침에 따라 CE 인증을 받았습니다 — 레크리에이션용 선박은 EN ISO 6185, 개인 구명 장치는 EN ISO 12402 기준, 적용 가능한 경우.
  - name: ISO 9001
    body: SGS / BSI
    desc: 팽창식 수상 장비의 설계, 제조, 유통을 위한 품질 관리 시스템 인증.
  - name: BSCI
    body: amfori
    desc: 사회적 준수 인증으로 윤리적 제조, 공정 노동, 작업장 안전 증명.
  - name: REACH
    body: 유럽 화학청
    desc: 모든 재료는 화학 안전을 위한 REACH 규정을 준수합니다. 모든 배송 시 문서 제공.
  - name: RoHS
    body: 유럽 연합
    desc: 모든 전자 및 전기 부품의 유해물질 제한 준수.
  - name: AS 1799
    body: 호주 규격
    desc: 팽창식 보트에 대한 호주 기준 — AU/NZ 수역에서 상업적 사용을 위해 테스트 및 인증.
test_results:
  - metric: 유닛 압력 테스트
    value: 100%
    detail: 모든 보트, 모든 챔버, 모든 배치
  - metric: 최대 압력 하락
    value: <5%
    detail: 정격 압력의 1.25배에서 24시간 동안
  - metric: 주요 결함 기준
    value: AQL 2.5
    detail: ISO 2859 샘플링 기준에 따라
  - metric: 압력 유지 기간
    value: 24-48h
    detail: 제품 카테고리에 따라 다름
  - metric: 시험 압력 여유
    value: 1.25x
    detail: 각 챔버의 안전 여유
  - metric: 안전 결함 허용치
    value: 0%
    detail: 밸브, D링, 솔기, 부력
