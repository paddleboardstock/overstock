cards:
  - badge: PVC
    title: Jūrų kokybės PVC sluoksnis
    description: Daugiasluoksnė laminuota PVC medžiaga, skirta jūriniams aplinkos sąlygoms. Išbandyta dėl UV, atsparumo trinčiai ir pradurimui.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch Branduolys
    description: Tūkstančiai vidinių siūlų jungia viršutinį ir apatinį sluoksnius, sukurdami standžią, aukšto slėgio struktūrą esant 12–15 PSI.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - badge: RR
    title: Sustiprinta geležinkelio kraštinė
    description: Dviejų sluoksnių sujungtas suvirintas geležinkelis apsaugo nuo prieplaukos subraižymų, paplūdimio nusileidimų ir šoninių smūgių.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
