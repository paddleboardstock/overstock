- slug: sup-launch-techniques
  category: guide
  type: tutorial
  title: 'Técnicas de Botadura en SUP: Cómo Empezar tu Sesión Correctamente'
  description: >-
    Técnicas de botadura de SUP adecuadas para distintos tipos de orilla:
    playas de arena, costas rocosas, pantalanes y orillas de río. Evita el
    tropiezo torpe y empieza cada sesión con fluidez.
  definition: >-
    La técnica de botadura en SUP es el método para pasar de la orilla al agua
    manteniendo el equilibrio y el control de la tabla. Cada tipo de orilla
    requiere un enfoque distinto.
  tldr: >-
    Playa de arena: coloca la tabla en el borde del agua, súbete y rema. Costa
    rocosa: lleva la tabla a pie por aguas poco profundas antes de montarte.
    Pantalán: siéntate en la tabla desde el pantalán y usa el remo para
    despegar. Orilla de río: bota río abajo en ángulo. Sujeta siempre la correa
    (leash) antes de entrar al agua.
  problem: >-
    Inflas la tabla y caminas hasta el borde del agua, y entonces te das cuenta
    de que no tienes ni idea de cómo subirte sin parecer torpe o caerte al
    instante.
  explanation: >-
    La técnica de botadura varía según el tipo de orilla. En las playas de
    arena, el enfoque más sencillo es colocar la tabla paralela a la orilla en
    agua hasta los tobillos, subirte y remar directamente hacia fuera. En las
    costas rocosas, hay que llevar la tabla a pie hasta aguas hasta la rodilla
    antes de montarte para no dañarla. Desde los pantalanes, siéntate en la
    tabla mientras estás en el pantalán y luego empújate hacia fuera.
  solution: >-
    Botadura en arena: coloca la tabla perpendicular a la orilla, súbete con un
    pie, empújate con el otro, arrodíllate y luego ponte de pie. Botadura en
    roca: lleva la tabla a aguas hasta la rodilla y móntate por detrás.
    Botadura de pantalán: coloca la tabla paralela al pantalán, siéntate en
    ella desde el pantalán y empújate con suavidad.
  recommendation: >-
    Practica primero las botaduras en condiciones tranquilas. La plataforma
    ancha del Paddle Board Overstock SUP Explorer 11 facilita la botadura. Sujeta siempre la
    correa (leash) antes de subirte a la tabla.
  faq:
    - q: ¿Cómo hago la botadura en el surf?
      a: >-
        Espera una pausa entre series de olas. Coloca la tabla en agua hasta
        los tobillos, súbete rápido y rema con fuerza para cruzar la zona de
        rompiente antes de la siguiente serie.
    - q: ¿Puedo botar desde cualquier playa?
      a: >-
        Comprueba los puntos de acceso y la normativa local. Algunas playas
        tienen zonas de botadura designadas. Evita botar donde haya bañistas.
    - q: ¿Cómo desembarco?
      a: >-
        Acércate perpendicular a la orilla. Bájate de la tabla en aguas poco
        profundas en cuanto las quillas toquen el fondo. Lleva la tabla por
        encima de la línea de agua.
    - q: ¿Y si hay un rompiente fuerte en la orilla?
      a: >-
        Cronometra la botadura entre olas. Sujeta la tabla firmemente de lado
        frente a las olas. Si el rompiente es demasiado fuerte, busca otro punto
        de botadura.
