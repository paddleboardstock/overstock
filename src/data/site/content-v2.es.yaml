- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Qué Ponerse para el Surf (No Vayas en Bañador cuando Necesitas un 5/4)
  description: >-
    Deja de adivinar qué ponerte. La temperatura del agua, no la del aire,
    determina tu equipación de surf. Guía completa de capas, desde rash guards
    tropicales hasta equipos completos de invierno de 5/4/3mm.
  definition: >-
    La equipación de surf va desde bañadores y rash guards en agua cálida hasta
    trajes completos de 5/4/3mm con botas y capucha en agua fría. La temperatura
    del agua, no la del aire, determina lo que necesitas.
  tldr: >-
    Lo que llevas para surfear depende por completo de la temperatura del agua —
    no de la del aire. Los rash guards y bañadores funcionan por encima de 22°C,
    los trajes de primavera cubren 18-22°C, los trajes completos de 3/2mm
    soportan 14-18°C, y se requiere un 5/4/3mm con botas por debajo de 14°C.
    Lleva siempre protección UV y considera un leash y un chaleco de impacto.
  problem: >-
    Llegas a la playa sin tener ni idea de si un rash guard es suficiente o si
    necesitas un traje completo. La temperatura del aire es cálida pero el agua
    está fría, o el agua se siente bien pero el viento es gélido. Vestirse mal
    significa una sesión arruinada.
  explanation: >-
    La indumentaria de surf cumple tres funciones: aislamiento térmico,
    protección UV y prevención de rozaduras. Los trajes de neopreno se clasifican
    por grosor y cobertura — los trajes de primavera (mangas o piernas cortas)
    son para días dudosos y los trajes completos para agua fría. Los rash guards
    protegen contra el rash de tabla y el sol, pero no aportan valor térmico.
    Las botas, los guantes y la capucha no son accesorios, sino equipo esencial
    para el surf en aguas frías por debajo de 12°C.
  solution: >-
    Consulta la boya local o el informe de temperatura del agua en directo antes
    de salir. Prepara un kit basado en tu condición típica más fría: rash guard y
    bañador para el verano, un traje completo de 3/2mm para primavera y otoño, y
    un 5/4/3mm con botas y capucha para el invierno. Añade siempre un leash y
    considera un chaleco de flotación por seguridad.
  recommendation: >-
    Invierte primero en un buen traje completo de 3/2mm — cubre el rango más
    amplio de condiciones. Añade un traje de 5/4/3mm y botas si piensas surfear
    durante todo el invierno. El Paddle Board Overstock Wetsuit Pro con forro térmico cubre
    ambos rangos de temperatura de forma eficaz.
  faq:
    - q: ¿Puedo surfear solo con bañador?
      a: >-
        Sí, en agua tropical por encima de 24°C. Puede que quieras un rash guard
        para evitar rozaduras en el pecho y los brazos al remar. La cera o una
        almohadilla de tracción en la tabla ayudan a compensar la falta de agarre
        del traje.
    - q: ¿Necesito botas de surf?
      a: >-
        Si la temperatura del agua baja de los 14°C, las botas evitan la
        entumecimiento y protegen tus pies de rocas y cortes en el arrecife.
        También añaden tracción sobre la tabla. La mayoría de los surfistas en
        climas del norte usan botas de noviembre a marzo.
    - q: ¿Qué es un traje de primavera?
      a: >-
        Un traje de primavera es un neopreno de manga corta o pierna corta (o
        ambas) diseñado para agua entre 18°C y 22°C. Aporta más calor que un
        rash guard pero menos cobertura que un traje completo.
    - q: ¿Debería llevar un chaleco salvavidas mientras surfeo?
      a: >-
        No los chalecos salvavidas tradicionales, pero un chaleco de impacto o
        una ayuda de flotación pueden ayudar en condiciones difíciles o si eres
        un nadador débil. Los chalecos salvavidas de Paddle Board Overstock están diseñados
        para SUP y kayak, pero pueden aportar mayor confianza de flotación a los
        principiantes de surf.
