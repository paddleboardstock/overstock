- slug: cold-water-surfing-gear-guide
  category: guide
  type: buying-guide
  title: Guía de Equipo para Surf en Aguas Frías (Surfea Todo el Invierno sin Sufrir)
  description: >-
    No dejes que el agua fría acabe con tu temporada. Desglose completo del
    equipo para aguas frías: grosor del neopreno, elección de botas y guantes,
    ajuste de la capucha y los accesorios que hacen que las sesiones de invierno
    sean de verdad agradables.
  definition: >-
    El surf en aguas frías requiere un traje completo (5/4/3mm o más grueso),
    botas, guantes y capucha. Por debajo de 12°C, cada punto de contacto con el
    agua fría necesita protección para evitar entumecimiento, hipotermia y
    riesgos de seguridad.
  tldr: >-
    El surf en aguas frías requiere un traje completo con capucha de 5/4/3mm o
    6/5/4mm, botas de 5mm, guantes de 3mm y capucha. La calidad de las costuras
    importa más que la marca — busca costuras pegadas y cosidas a ciegas (GBS).
    Un traje con forro térmico aporta un calor significativo sin grosor extra.
    Lleva siempre capas térmicas de repuesto y un termo para recuperarte después
    de la sesión.
  problem: >-
    Quieres surfear durante todo el invierno, pero el agua fría te entumece los
    pies a los 15 minutos, tus manos no pueden agarrar la tabla y tu traje
    deja entrar agua helada por la espalda cada vez que remas. Sin el equipo
    adecuado, las sesiones en aguas frías son cortas y miserables.
  explanation: >-
    El surf en aguas frías (por debajo de 12°C) exige más que un traje de
    neopreno grueso. Cada punto de contacto con el frío necesita protección: las
    botas evitan el entumecimiento de los pies y protegen contra los cortes del
    arrecife, los guantes mantienen la función de las manos para remar y la
    capucha evita la mayor pérdida de calor (tu cabeza irradia el 30 por ciento
    del calor corporal). El grosor del neopreno debe ajustarse al mes más frío,
    no a la media. Más allá del traje, accesorios como escarpines con suela
    sellada y guantes con dedos precurvados mejoran la comodidad y la
    durabilidad.
  solution: >-
    Monta un kit para aguas frías en este orden: traje completo de 5/4/3mm o
    6/5/4mm con costuras GBS y cremallera en el pecho, botas de 5mm con suelas
    de goma, guantes de 3mm (las manoplas abrigan más que los guantes con dedos)
    y una capucha de 3mm que se meta bajo el cuello del traje. Añade un albornoz
    cambiador para mantener la dignidad y el calor en el aparcamiento.
  recommendation: >-
    El Paddle Board Overstock Wetsuit Pro en 5/4/3mm con forro térmico integrado soporta la
    mayoría de las condiciones de aguas frías hasta 8°C. Combínalo con botas de
    5mm y guantes de 3mm de Paddle Board Overstock para un equipo completo de aguas frías.
    Por debajo de 8°C, sube a un traje con capucha de 6/5/4mm.
  faq:
    - q: ¿De verdad necesito una capucha?
      a: >-
        Sí. Pierdes el 30 por ciento del calor corporal por la cabeza. La
        capucha evita la entrada de agua y mantiene el cuello abrigado. Una
        capucha de 3mm aporta más calor que pasar de 5mm a 6mm de grosor en el
        torso.
    - q: ¿Qué grosor de botas necesito?
      a: >-
        Para agua de 8-12°C usa botas de 5mm. Para 12-16°C, las de 3mm son
        suficientes. Por debajo de 8°C, considera botas de 7mm o añadir calcetines
        de neopreno bajo las de 5mm.
    - q: ¿Cómo evito que el agua entre en mi traje?
      a: >-
        La entrada de agua ocurre cuando el agua penetra en el traje por el
        cuello, las muñecas o los tobillos. Un cierre de cremallera en el pecho
        reduce significativamente la entrada de agua por la espalda. Los sellos
        de velcro en el cuello y los tobillos también ayudan, pero la mejor
        solución es un traje bien ajustado con costuras GBS.
    - q: ¿Puedo usar un traje de 3mm en aguas frías con capas extra?
      a: >-
        Un traje de 3mm con un chaleco de neopreno debajo puede ampliar tu rango
        unos 3-4°C, pero no sustituye a un traje adecuado de 5/4/3mm o 5mm. Las
        capas funcionan mejor para sesiones cortas en condiciones límite.
