- slug: how-to-choose-a-wetsuit
  category: guide
  type: buying-guide
  title: 'Cómo elegir un traje de neopreno: ajuste, grosor y características explicadas'
  description: >-
    Guía completa de compra de trajes de neopreno. Cómo elegir el grosor adecuado para la
    temperatura del agua, lograr un ajuste correcto, comprender los tipos de costuras y
    elegir las características según tu actividad.
  definition: >-
    Un traje de neopreno es una prenda de neopreno que proporciona aislamiento térmico al
    atrapar una fina capa de agua contra la piel. Factores clave de selección: grosor,
    ajuste, construcción de las costuras, sistema de entrada y tipo de neopreno.
  tldr: >-
    Ajusta el grosor a la temperatura del agua: 3/2 mm para 14-20 °C, 4/3 mm para 12-18 °C,
    5/4/3 mm para 8-14 °C, 6/5/4 mm para menos de 8 °C. El ajuste es el factor más
    importante. Las costuras GBS son el estándar de oro. La cremallera en el pecho minimiza
    la entrada de agua. El neopreno de piedra caliza es más flexible que el de origen
    petroquímico.
  problem: >-
    Las tablas de tallas de trajes de neopreno en línea no son fiables, las recomendaciones
    de grosor varían según la marca y las descripciones de las características resultan
    confusas.
  explanation: >-
    Los números de grosor del traje de neopreno (3/2, 4/3, 5/4/3) se refieren a los mm del
    torso/brazos y de las piernas. Los trajes más gruesos abrigan más, pero restringen el
    movimiento. Un traje holgado deja escapar el agua caliente. Las costuras GBS son cálidas
    y flexibles; las costuras planas (flatlock) abrigan menos. La entrada con cremallera en
    el pecho es más cálida que la cremallera en la espalda. El neopreno de piedra caliza es
    más flexible en agua fría.
  solution: >-
    Mide pecho, cintura, cadera y altura. Compáralos con las tablas de tallas. Selecciona el
    grosor según la temperatura más fría del agua. Elige costuras GBS para agua fría.
    Prefiere la cremallera en el pecho por debajo de 15 °C. Considera un forro térmico para
    más calor.
  recommendation: >-
    El Paddle Board Overstock Wetsuit Pro en 3/2 mm (14-20 °C) o 5/4/3 mm (8-16 °C) ofrece costuras GBS,
    cremallera en el pecho y neopreno de piedra caliza a un precio competitivo.
  faq:
    - q: ¿Qué tan ajustado debe quedar un traje de neopreno?
      a: >-
        Ajustado, sin bolsas de aire, pero sin restringir el movimiento. Un dedo no debe
        deslizarse con facilidad en la zona lumbar.
    - q: ¿Cuál es el tipo de traje de neopreno más abrigado?
      a: >-
        Un traje con capucha de 6/5/4 mm con costuras selladas y cremallera en el pecho.
        Para frío extremo, un traje seco (dry suit) es superior.
    - q: ¿Vale la pena un traje de neopreno más caro?
      a: >-
        Un precio más alto compra mejor neopreno, costuras y características. Para un uso
        habitual en agua fría, la diferencia de precio merece la pena.
    - q: ¿Puedo usar un traje de neopreno para actividades que no sean surf?
      a: >-
        Sí: los trajes de neopreno funcionan para SUP, kayak, buceo, triatlón y natación en
        aguas abiertas.
