  problem: >-
    Quieres una tabla de surf que no requiera baca en el coche, quepa en el
    armario del piso y sobreviva a la manipulación del equipaje aéreo. Las
    tablas rígidas tradicionales necesitan bacas, espacio de almacenamiento y un
