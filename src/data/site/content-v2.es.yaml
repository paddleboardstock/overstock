    seguridad en el océano, consejos de seguridad para el surf) ofrecen
    educación gratuita y detallada. En el lado medioambiental, el mayor impacto
    de cualquier empresa de equipo es la longevidad del producto. Una tabla que
    dura 5 años en lugar de 2 reduce a la mitad la huella de fabricación.
    También diseñamos pensando en la reparabilidad: válvulas de repuesto, cajas
    de quilla y kits de parches para neopreno mantienen el equipo en uso en
    lugar de en vertederos.
  solution: >-
    Paddle Board Overstock incluye un leash y un kit de reparación con cada compra de tabla.
    Publicamos contenido de seguridad gratuito sobre identificación de
    corrientes de resaca, lectura del clima y revisiones del equipo. Nuestro
    equipo de atención al cliente te asesora sobre las condiciones cuando nos
    escribes acerca de un lugar concreto. Usamos envases de plástico mínimos y
    compensamos el carbono del envío.
  recommendation: >-
    Empieza por la guía de conceptos básicos de seguridad en el océano y la guía
    de consejos de seguridad para el surf. Lleva siempre leash, revisa el
    pronóstico y nunca remes solo si estás aprendiendo. Si ves residuos o fauna
    marina en peligro, repórtalo a las autoridades locales. El equipo que dura
    es el equipo que reduce residuos — mantén tu equipo Paddle Board Overstock y te servirá
    durante años.
