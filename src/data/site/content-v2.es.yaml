- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'Hidratación y Protección Solar en SUP: Mantente Seguro en el Agua'
  description: >-
    Estrategias esenciales de hidratación y protección solar para practicantes
    de SUP. La deshidratación y las quemaduras solares son los problemas más
    comunes del SUP: cómo prevenir ambos durante sesiones largas.
  definition: >-
    La hidratación en el SUP consiste en mantener el equilibrio de líquidos
    durante el paddling mediante una ingesta regular de agua. La protección
    solar incluye la aplicación de protector solar, ropa de protección y la
    programación de las sesiones para evitar las horas de máxima radiación UV.
  tldr: >-
    Bebe 500 ml de agua por cada hora de paddling. Lleva más agua de la que
    crees necesitar: una bolsa de hidratación de 2L o varias botellas. Aplica
    protector solar SPF 50+ resistente al agua antes de remar y renueva la
    aplicación cada 2 horas. Lleva sombrero, gafas de sol con cordón y ropa con
    protección UPF. Evita remar entre las 11:00 y las 15:00, cuando la
    radiación UV es más fuerte.
  problem: >-
    Estás disfrutando de una gran sesión de SUP, pero después de una hora
    tienes dolor de cabeza, sequedad bucal y la piel quemada. La deshidratación
    y las quemaduras solares aparecen sin avisar porque el agua te mantiene
    fresco.
  explanation: >-
    El reflejo del agua intensifica la exposición a la radiación UV hasta en un
    40%. El efecto refrescante del agua y de la brisa enmascara la quemadura
    solar hasta que es demasiado tarde. El sudor del paddling aumenta la pérdida
    de líquidos y a menudo no hay dónde rellenar el agua en el mar. La
    deshidratación perjudica el equilibrio y la toma de decisiones, lo que
    aumenta el riesgo de accidentes.
  solution: >-
    Fija una botella o una bolsa de hidratación al sistema de elásticos de la
    tabla. Bebe cada 15 minutos, tengas sed o no. Aplica protector solar SPF 50+
    30 minutos antes de la botadura. Lleva un sombrero de ala ancha, gafas de
    sol polarizadas con cordón y una camiseta de protección UPF 50+. Renueva el
    protector solar cada 2 horas.
  recommendation: >-
    Usa una bolsa de hidratación sujeta a los anillos en D delanteros de tu SUP
    Paddle Board Overstock. Lleva una camiseta de protección UPF 50+ debajo del chaleco
    salvavidas. Usa un protector solar impermeable que resista el sudor y el
    agua.
  faq:
    - q: ¿Cuánta agua debo llevar en una salida de SUP?
      a: >-
        Mínimo 1 litro por hora. Para una sesión de 2 horas, lleva 2 litros.
        Más en climas calurosos. Una bolsa de hidratación es la mejor opción.
    - q: ¿Qué tipo de protector solar es mejor para el SUP?
      a: >-
        Resistente al agua, de amplio espectro y SPF 50+. Los protectores
        minerales (óxido de zinc, dióxido de titanio) son seguros para los
        arrecifes y duran más.
    - q: ¿El agua refleja de verdad la radiación UV?
      a: >-
        Sí: el agua refleja hasta el 40% de la radiación UV, lo que significa
        que recibes UV por arriba y por abajo. Esto aumenta considerablemente el
        riesgo de quemaduras.
    - q: ¿Puedo quemarme con una camiseta de protección solar?
      a: >-
        Las camisetas estándar ofrecen una protección UV mínima (unos UPF
        10-20). Busca ropa con UPF 50+ para una protección completa.
