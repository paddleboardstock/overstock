    tiene mejores propiedades aislantes. El forro térmico (microfelpa en el
    torso interior) añade calor sin grosor extra. Las costuras GBS (pegadas y
    cosidas a ciegas) son el estándar de oro — el neopreno se pega y luego se
    cose sin perforar hasta el interior, impidiendo la entrada de agua. La
    entrada con cremallera en el pecho usa una cremallera YKK impermeable con
    junta sellada. Las rodilleras y la piel exterior resistente evitan el
    desgaste al remar y al sentarse sobre la tabla.
  solution: >-
    Selecciona el grosor según la temperatura del agua siguiendo la guía de
    grosores de neopreno. El 3/2mm cubre 14-20°C con máxima flexibilidad. El
    5/4/3mm cubre 8-16°C con forro térmico para más calor. Ambos incluyen
    puños sellados, cuello sin goteo y bolsillo para llaves.
  recommendation: >-
