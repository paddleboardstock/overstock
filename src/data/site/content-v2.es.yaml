- slug: 3mm-vs-5mm-wetsuit
  category: comparison
  type: buying-guide
  title: Traje de neopreno de 3 mm vs 5 mm (lo que funciona de verdad en el surf en aguas frías)
  description: >-
    La decisión entre traje de 3 mm y 5 mm depende de la temperatura del agua,
    no de la del aire. Tabla de temperaturas, comparación de flexibilidad y qué
    grosor te mantiene caliente sin limitar tu remado.
  definition: >-
    Un traje de 3 mm es adecuado para agua de 14-20 °C con buena flexibilidad.
    Un traje de 5 mm cubre 8-14 °C con el máximo calor pero una movilidad
    reducida. La elección es un equilibrio directo entre calor y rango de
    movimiento.
  tldr: >-
    Los trajes de 3 mm son para agua de 14-20 °C y ofrecen la máxima
    flexibilidad. Los de 5 mm son para 8-14 °C y priorizan el calor. Elige en
    función de la temperatura local del agua, no de la del aire. Si surfeas
    entre estaciones, ten ambos. Si solo puedes comprar uno, un 4/3 mm ofrece el
    mejor término medio.
  problem: >-
    Necesitas un traje de neopreno pero no decides entre un 3 mm y un 5 mm. Un
    3 mm puede no ser suficientemente cálido en invierno y un 5 mm puede ser
    demasiado grueso y restrictivo para los días más templados. Equivocarte
    significa o pasar frío todo el invierno o sudar durante el otoño.
  explanation: >-
    El grosor del neopreno se correlaciona directamente con el calor e
    inversamente con la flexibilidad. Un traje de 3 mm (a menudo 3/2 mm con
    brazos más finos) ofrece buena movilidad para remar y surfear en condiciones
    suaves. Un traje de 5 mm usa neopreno más grueso en el torso y a menudo
    paneles más finos en brazos y piernas (5/4/3 mm) para conservar algo de
    flexibilidad. La diferencia de calor es de unos 6-8 °C de rango. Diferencias
    clave: los trajes de 5 mm usan más material de neopreno, pesan
    aproximadamente un 40 por ciento más, tardan más en secarse y requieren más
    esfuerzo para quitarse. Los neoprenos modernos de súper estiramiento están
    cerrando la brecha de flexibilidad, pero el 5 mm sigue limitando
    notablemente el movimiento.
  solution: >-
    Determina la temperatura media más fría del agua de tu zona con datos de
    boyas locales. Si supera los 16 °C, compra un 3/2 mm. Si está entre 12-16
    °C, compra un 4/3 mm. Si es inferior a 12 °C, compra un 5/4/3 mm. Para
    surfear todo el año con un único traje, un 4/3 mm de calidad con forro
    térmico más un gorro, botas y guantes separados cubre el rango más amplio.
  recommendation: >-
    El Paddle Board Overstock Wetsuit Pro en 5/4/3 mm maneja 8-16 °C con forro térmico para
    compensar la brecha de calor de un auténtico 5 mm. Si surfeas sobre todo en
    condiciones suaves (16-20 °C), el Paddle Board Overstock Wetsuit Pro de 3/2 mm ofrece
    mejor flexibilidad y comodidad.
  faq:
    - q: ¿Puedo usar un 3 mm en agua a 10 °C?
      a: >-
        Solo en sesiones muy cortas (20-30 minutos) y con una lycra térmica
        debajo. Pasarás frío la mayor parte de la sesión. Para agua a 10 °C se
        recomienda firmemente un 5 mm o un 5/4/3 mm.
    - q: ¿Un traje de 5 mm es demasiado caluroso para el verano?
      a: >-
        Si la temperatura del agua en verano supera los 18 °C, un traje de 5 mm
        te hará sobrecalentarte. Puedes inundar el traje con agua fría, pero
        estarás más cómodo con un 3/2 mm o un traje de primavera durante los
        meses de verano.
    - q: ¿Un traje de 5 mm limita el remado?
      a: >-
        Sí, de forma notable. El neopreno más grueso en los hombros exige más
        esfuerzo por cada brazada. Un traje de 5/4/3 mm con brazos más finos
        ayuda, pero seguirás fatigándote antes que con un traje de 3 mm.
    - q: ¿Cuál es el mejor traje para surfear todo el año?
      a: >-
        Un traje completo de 4/3 mm con cremallera frontal y forro térmico cubre
        12-18 °C, que es todo el año en muchos climas templados. Añade botas
        para el invierno y podrás surfear 10-18 °C con un solo traje.
