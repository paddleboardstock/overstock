- slug: ocean-conditions-explained
  category: guide
  type: technical
  title: Condiciones del océano explicadas (lee el pronóstico de surf como un profesional)
  description: >-
    Altura de la marejada, período, dirección del viento, marea — descifra
    cualquier pronóstico de surf en 60 segundos. Qué significan realmente los
    números para tu pico local y cuándo quedarte en la playa.
  definition: >-
    Las condiciones del océano las determinan tres factores: la marejada
    (altura, período, dirección), el viento (offshore es limpio, onshore es
    picado) y la marea (cambia la profundidad del agua sobre los bancos de arena
    y los arrecifes).
  tldr: >-
    Tres factores determinan la calidad del surf: la marejada (tamaño, período,
    dirección), el viento (offshore es limpio, onshore es agitado) y la marea
    (empuja el agua hacia dentro o hacia fuera sobre los bancos de arena). Usa
    el período de la marejada para juzgar la potencia — un período más largo
    significa olas más potentes. Consulta un pronóstico de surf que combine
    estos tres factores antes de cada sesión.
  problem: >-
    Los pronósticos de surf muestran números confusos: 3 pies a 12 segundos
    desde 290°, viento offshore ligero. No sabes qué significa para la playa
    donde planeas surfear. Sin descifrar el pronóstico, o conduces hasta una
    playa plana o remas hacia fuera en condiciones peligrosas.
  explanation: >-
    La marejada se mide por su altura (altura de cara en pies), su período
    (segundos entre olas) y su dirección (de dónde procede). Las marejadas de
    período largo (12+ segundos) transportan más energía y producen olas más
    limpias y potentes. Calidad del viento: el viento offshore (que sopla de
    tierra a mar) mantiene erguida la cara de la ola y crea olas suaves y
    limpias; el viento onshore (de mar a tierra) pica la superficie. Los vientos
    de costado son aceptables pero no ideales. La marea afecta a la forma de la
    ola según el pico — las playas de fondo de arena suelen funcionar mejor en
    marea media y los fondos de arrecife en niveles de marea concretos según la
    profundidad del arrecife.
  solution: >-
    Usa un sitio web o una aplicación de pronóstico de surf y aprende a leer
    tres parámetros para tu pico local. Cruza la dirección de la marejada con la
    orientación de la playa — una playa que mira al oeste necesita una marejada
    del oeste. Consulta el pronóstico del viento para la hora en que planeas
    surfear, no el parte de la mañana. Aprende la preferencia de marea de tu
    pico concreto observándolo a distintos niveles de marea.
  recommendation: >-
    Dedica un mes a registrar las condiciones y la calidad de las olas en tu
    playa local. Descubrirás patrones: qué direcciones de marejada funcionan,
    qué mareas producen la mejor forma y qué vientos arruinan la superficie. La
    guía de condiciones del océano se combina con la guía de conceptos básicos
    de seguridad en el surf para una base completa de alfabetización oceánica.
  faq:
    - q: ¿Cuál es un buen período de marejada para surfear?
      a: >-
        8-10 segundos produce olas débiles y desorganizadas, adecuadas para
        principiantes. 10-13 segundos es el punto dulce para la mayoría de los
        picos — buena potencia sin ser peligrosa. 14+ segundos produce
        marejadas potentes y concentradas, adecuadas para surfistas avanzados.
    - q: ¿Cuál es el mejor viento para surfear?
      a: >-
        El viento offshore ligero (5-10 nudos) produce las caras de ola más
        limpias. Las condiciones de cristal (viento cero) son ideales pero poco
        frecuentes. El viento onshore hace que las olas estén picadas y sean más
        difíciles de surfear. Un viento offshore fuerte puede hacer peligrosos
        los despegues al mantener el labio de la ola erguido demasiado tiempo.
    - q: ¿Cómo afecta la marea a las olas?
      a: >-
        La marea cambia la profundidad sobre los bancos de arena y los
        arrecifes. La marea baja puede exponer peligros y hacer las olas más
        empinadas o que cierren. La marea alta puede suavizar las olas o
        hacerlas gordas y lentas. La mayoría de los picos de playa funcionan
        mejor 2-3 horas a cada lado de la marea alta o baja.
    - q: ¿Puedo surfear con viento onshore?
      a: >-
        Sí, pero la calidad será inferior. Las caras de ola picadas dificultan
        los giros y hacen menos eficiente el remado. A los principiantes suele
        gustarles el viento onshore porque las olas son más suaves y menos
        potentes, lo que da más tiempo para ponerse de pie.
