    - q: ¿Cómo debo deshacerme de un neopreno o una tabla viejos?
      a: >-
        Los neoprenos pueden reciclarse en esterillas de yoga, bolsas y
        aislantes mediante programas especializados. Las tablas hinchables
        pueden repararse o donarse, o el PVC puede recuperarse a través de
