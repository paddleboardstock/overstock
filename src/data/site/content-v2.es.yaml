- slug: weather-planning-water-sports
  category: guide
  type: safety
  title: 'Planificación meteorológica para deportes acuáticos: lee el pronóstico como un profesional'
  description: >-
    Cómo leer los pronósticos meteorológicos marinos para SUP, surf y navegación. Comprender
    los frentes, los sistemas de presión, los patrones de viento y los avisos
    meteorológicos para planificar sesiones seguras.
  definition: >-
    La planificación meteorológica consiste en interpretar los pronósticos marinos:
    velocidad y dirección del viento, altura y período del oleaje, precipitación,
    visibilidad y avisos meteorológicos de fenómenos severos.
  tldr: >-
    Consulta tres pronósticos antes de cada sesión: viento, oleaje y tiempo. Mejores
    condiciones: viento de tierra ligero, oleaje moderado y presión alta o en ascenso.
    Evita: tormentas, viento de tierra fuerte, niebla y presión en caída rápida.
  problem: >-
    Conduces hasta la costa basándote en un pronóstico de 3 días que prometía buenas
    condiciones y te encuentras con viento de 25 nudos y lluvia. El tiempo marino es difícil
    de predecir.
  explanation: >-
    La presión alta trae tiempo estable y vientos ligeros. La presión baja trae viento y
    tormentas. El gradiente de presión determina la velocidad del viento. Los frentes fríos
    traen cambios bruscos de viento. Los efectos locales como las brisas marinas pueden
    imponerse al pronóstico general.
  solution: >-
    Usa varias fuentes: Windy.com, NOAA y cámaras de surf locales. Consulta el pronóstico
    con 24 horas de antelación y vuelve a revisarlo esa misma mañana. Busca pronósticos
    consistentes entre los distintos modelos. Aprende los microclimas locales.
  recommendation: >-
    Guarda Windy.com en marcadores para tus spots locales. Lleva el móvil en una funda
    impermeable. Para navegar, lleva una radio VHF para las transmisiones meteorológicas.
    En caso de duda, quédate en la orilla.
  faq:
    - q: ¿Qué tiempo debo evitar para el SUP?
      a: >-
        Tormentas (rayos), niebla (visibilidad nula), viento de tierra superior a 10 nudos,
        vientos superiores a 20 nudos y presión en descenso.
    - q: ¿Qué precisión tienen los pronósticos marinos?
      a: >-
        Los pronósticos de 3 días tienen una precisión de alrededor del 80 %. Los
        pronósticos del día anterior son precisos al 90 % o más en cuanto al viento.
    - q: ¿Cuál es una buena tendencia barométrica para los deportes acuáticos?
      a: >-
        La presión estable o en ascenso indica que las condiciones mejoran. Una presión en
        descenso (1+ mb/hora) indica que se acerca una tormenta.
    - q: ¿Puedo hacer SUP con niebla?
      a: >-
        No se recomienda. Si te sorprende la niebla, usa una brújula o un GPS, suena el
        silbato cada 30 segundos y mantente cerca de la orilla.
