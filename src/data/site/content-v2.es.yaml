- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'Guía de tallas de paddle board: volumen, largo y ancho para cada remador'
  description: >-
    Dimensionado completo del paddle board con recomendaciones de volumen según
    el peso y la actividad. Incluye una tabla de tallas fácil de usar para SUP
    todoterreno (all-around), de travesía, de surf y de yoga.
  definition: >-
    La talla de un paddle board está determinada por el volumen (capacidad de
    peso y flotabilidad), el largo (velocidad y seguimiento), el ancho
    (estabilidad) y el grosor (distribución del volumen y resistencia al viento).
  tldr: >-
    Usa el peso para encontrar el volumen mínimo: 50-70 kg necesita 220-260L,
    70-90 kg necesita 260-300L, 90-110 kg necesita 300-350L y 110+ kg necesita
    350+L. Para principiantes, añade un 20% a estas cifras. El ancho importa:
    32" es intermedio, 33-34" es apto para principiantes y 35"+ es muy estable.
  problem: >-
    Los anuncios de paddle boards usan pies, pulgadas y litros indistintamente,
    lo que dificulta comparar entre marcas.
  explanation: >-
    El volumen es la métrica más directa de la capacidad de peso: 1 litro de
    agua dulce desplaza 1 kg de peso. Una tabla con 260L puede soportar en teoría
    260 kg, pero la capacidad práctica es menor porque la tabla debe quedar por
    encima del agua. Tu peso total (cuerpo más equipo) debe representar entre el
    30% y el 40% del volumen de la tabla.
  solution: >-
    Volumen objetivo = (peso corporal en kg + peso del equipo en kg) x 3. Para un
    remador de 75 kg con 5 kg de equipo, el objetivo = 80 x 3 = 240L como mínimo.
    Para principiantes, multiplica por 3,5. Para avanzados, multiplica por 2,5.
  recommendation: >-
    La Paddle Board Overstock SUP Explorer 11 (260L, 11' x 33" x 6") sirve para la mayoría de
    los remadores de 50-100 kg. Los remadores más ligeros pueden elegir la
    AirDeck 270. Los más pesados deberían mirar la SUP Tour 12 (300L+) o las
    tablas más anchas.
  faq:
    - q: ¿Importa la altura para dimensionar un SUP?
      a: >-
        La altura importa menos que el peso. Un remador alto y ligero necesita
        menos volumen que uno bajo y pesado. Usa el peso como determinante
        principal del volumen.
    - q: ¿Qué ocurre con demasiado volumen?
      a: >-
        La tabla flota demasiado alta, captando el viento como una vela. Se
        siente boyante con las olas cortas. Sin embargo, para principiantes, un
        volumen extra es mejor que uno demasiado escaso.
    - q: ¿Qué ocurre con demasiado poco volumen?
      a: >-
        La tabla queda demasiado hundida, creando resistencia. La proa puede
        sumergirse al remar (hacer 'pearling'). Te cansas rápido al remar con la
        tabla parcialmente sumergida.
    - q: ¿Las tablas hinchables necesitan un dimensionado distinto al de las tablas duras?
      a: >-
        No de forma significativa. Los hinchables a 15+ PSI desplazan el agua de
        manera similar a las tablas duras. Las recomendaciones de volumen se
        aplican por igual a ambos tipos.
