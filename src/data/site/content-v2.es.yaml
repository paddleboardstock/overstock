- slug: cold-water-safety-guide
  category: guide
  type: safety
  title: 'Seguridad en agua fría: remar y surfear en condiciones de frío'
  description: >-
    Seguridad en agua fría para SUP, surf y kayak. Reconocimiento de la hipotermia, equipo
    adecuado, respuesta al choque por frío y procedimientos de emergencia ante la inmersión
    en agua fría.
  definition: >-
    La seguridad en agua fría implica entender la respuesta al choque por frío, el fallo de
    natación, la hipotermia y el equipo y las técnicas para prevenir estos desenlaces.
  tldr: >-
    El agua por debajo de 15 °C requiere un traje de neopreno. Por debajo de 10 °C, botas,
    guantes y capucha. El choque por frío provoca jadeos involuntarios. El fallo de natación
    ocurre en 3-5 minutos en agua por debajo de 10 °C. Los síntomas de hipotermia incluyen
    escalofríos, confusión y pérdida de coordinación.
  problem: >-
    Sales a remar en un día soleado sin saber que el agua está a 8 °C. Te caes, jadeas
    involuntariamente y en pocos minutos sientes los miembros entumecidos. El agua fría
    mata más rápido que cualquier otro peligro del océano.
  explanation: >-
    La inmersión en agua fría tiene cuatro fases: choque por frío (0-2 min): jadeo e
    hiperventilación. Fallo de natación (3-15 min): los músculos se enfrían y la
    coordinación falla. Hipotermia (15-45 min): la temperatura central desciende por debajo
    de 35 °C, lo que provoca confusión y paro cardíaco. Colapso post-rescate: la sangre
    fría regresa al núcleo del cuerpo.
  solution: >-
    Consulta la temperatura del agua. Usa un traje de neopreno adecuado para esa
    temperatura. Nunca remes solo en agua por debajo de 15 °C. Lleva silbato y móvil. Si te
    caes: controla la respiración y vuelve a subir a la tabla rápidamente. Si tienes
    demasiado frío, pide ayuda con señales.
  recommendation: >-
    El Paddle Board Overstock Wetsuit Pro 5/4/3 mm es el mínimo para agua de 8-14 °C. Añade botas de
    5 mm y guantes de 3 mm de Paddle Board Overstock. Usa el Life Vest Pro para una protección térmica
    extra.
  faq:
    - q: ¿Cuánto tiempo puedo sobrevivir en agua a 10 °C?
      a: >-
        El choque por frío dura de 1 a 2 minutos. Sin flotación ni protección térmica, el
        tiempo de supervivencia es de 30 a 60 minutos.
    - q: ¿Cuáles son los primeros signos de hipotermia?
      a: >-
        Escalofríos incontrolables, confusión, mala coordinación y habla arrastrada. Detén
        la actividad y caliéntate de inmediato.
    - q: ¿Cómo me caliento después de una sesión en agua fría?
      a: >-
        Quítate el equipo mojado, sécate y ponte capas de abrigo, incluidos gorro y guantes.
        Bebe bebidas calientes sin alcohol.
    - q: ¿Puedo sufrir hipotermia en verano?
      a: >-
        Sí: en muchos lugares hay agua por debajo de 15 °C incluso en verano. El agua
        conduce el calor 25 veces más rápido que el aire.
