- slug: understanding-tides
  category: guide
  type: technical
  title: 'Comprender las mareas para deportes acuáticos: una guía práctica'
  description: >-
    Cómo afectan las mareas a las condiciones del SUP, el surf y el kayak. Leer tablas de
    mareas, entender las mareas vivas frente a las muertas y planificar tu sesión en torno
    a los movimientos de las mareas por seguridad.
  definition: >-
    Las mareas son la subida y bajada diaria del nivel del mar causada por la atracción
    gravitatoria de la luna y el sol. El rango de marea varía según la ubicación y el ciclo
    lunar.
  tldr: >-
    En la mayoría de las ubicaciones hay dos pleamares y dos bajamares al día. Las mareas
    vivas (luna llena/nueva) tienen rangos mayores y corrientes más fuertes. Las mareas
    muertas (cuarto creciente/menguante) tienen rangos menores. La marea afecta la
    profundidad del agua, la forma de las olas y la fuerza de la corriente. Para SUP: rema
    primero contra la corriente para que te ayude a volver.
  problem: >-
    Llegas a tu spot habitual y apenas hay olas, hay corrientes de resaca peligrosas por la
    marea bajante o el agua está demasiado poco profunda. Sin comprender las mareas,
    desperdicias salidas o remas en condiciones peligrosas.
  explanation: >-
    Las mareas están causadas por la gravedad de la luna. Las mareas vivas (luna llena y
    nueva) producen las pleamares más altas y las bajamares más bajas. Las mareas muertas
    (cuarto de luna) producen un rango mínimo. Las corrientes de marea son más rápidas a
    media marea y casi nulas en pleamar y bajamar. El rango de marea varía de 0,3 m
    (Mediterráneo) a 16 m (bahía de Fundy).
  solution: >-
    Consulta la tabla de mareas antes de cada sesión. Para surf: las rompientes de playa
    suelen funcionar mejor 2-3 horas antes o después de la pleamar. Para SUP: rema contra la
    corriente la primera mitad para que esta te ayude a volver. Para pesca: la marea
    entrante empuja a los peces hacia los bajíos.
  recommendation: >-
    Usa las predicciones de mareas de la NOAA o una aplicación local de mareas. Aprende la
    preferencia de marea de tu rompiente local registrando las condiciones durante un mes.
  faq:
    - q: ¿Qué es una marea viva?
      a: >-
        Las mareas vivas ocurren durante la luna llena y la luna nueva y producen
        pleamares más altas y corrientes más fuertes. Ocurren dos veces al mes.
    - q: ¿Qué es una marea muerta?
      a: >-
        Las mareas muertas ocurren durante los cuartos de luna. El rango de marea es menor
        y las corrientes son más débiles: buenas para principiantes.
    - q: ¿Son peligrosas las bajamares para el SUP?
      a: >-
        La bajamar puede dejar al descubierto rocas y arrecifes. También concentra la
        energía de las olas en barras de arena más pronunciadas.
    - q: ¿Cómo afectan las mareas a las corrientes de resaca?
      a: >-
        La marea bajante (reflujo) fortalece las corrientes de resaca. La marea entrante
        (flujo) reduce su fuerza.
