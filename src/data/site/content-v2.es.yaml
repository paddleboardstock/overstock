    - q: ¿Puedo usar el asiento de kayak de Bluefin para pescar?
      a: >-
        Sí, la conversión a kayak es popular para la pesca. Sentarse proporciona
        estabilidad para lanzar.
    - q: ¿Qué tabla es más ligera?
