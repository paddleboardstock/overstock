- slug: surfboard-size-guide
  category: guide
  type: buying-guide
  title: Guía de Tallas de Tabla de Surf (El Volumen es lo que de Verdad Importa)
  description: >-
    Deja de adivinar las tallas de las tablas de surf. El volumen en litros lo
    determina todo — lo fácil que coges olas, lo estable que te sientes y lo
    rápido que progresas. Encuentra tus litros objetivo en 2 minutos.
  definition: >-
    La talla de una tabla de surf se refiere principalmente al volumen (litros),
    no a la longitud. El volumen determina la flotación y la capacidad de coger
    olas. Las tablas más largas reman más rápido; las más anchas son más
    estables; las más gruesas ofrecen más volumen sin añadir longitud.
  tldr: >-
    La talla de la tabla de surf se basa en el volumen, no solo en la longitud.
    Los principiantes necesitan 60-80 litros, los intermedios 35-55 litros y los
    surfistas avanzados 20-35 litros. Usa tu peso como factor principal: cada 10
    kg necesita aproximadamente 10-12 litros de volumen a nivel de principiante.
  problem: >-
    Frente a un estante de tablas con números como 7'2" x 22" x 3" impresos en
    el canto, no tienes ni idea de cómo se sienten esas medidas en el agua.
    Comprar por el aspecto o por lo que usa un amigo te lleva a una tabla que es
    o demasiado inestable o demasiado difícil de remar.
  explanation: >-
    La talla de una tabla de surf se entiende mejor a través de tres dimensiones:
    longitud (potencia de remada y capacidad de coger olas), anchura (estabilidad)
    y grosor (volumen y flotación). El número que de verdad importa es el
    volumen en litros. Las tablas de espuma y las hinchables consiguen un alto
    volumen mediante la anchura y el grosor en lugar de una longitud excesiva,
    lo que las hace manejables para principiantes. A medida que mejoras,
    reduces el volumen para que la tabla se hunda más en la cara de la ola y
    gire con mayor capacidad de respuesta.
  solution: >-
    Usa una calculadora de volumen-peso: para principiantes, divide tu peso en
    kg entre 1.5 para obtener los litros objetivo. Para nivel intermedio,
    divide entre 2. Los intermedios deberían buscar tablas con un rocker
    moderado y una cola squash o redonda para mayor versatilidad.
  recommendation: >-
    La Paddle Board Overstock Surfboard Pro ofrece 75 litros de volumen en un paquete de
    10'6" — ideal para principiantes de hasta 90 kg. Los surfistas más ligeros
    pueden bajar a la SUP Tour 12 para una sensación más maniobrable a medida
    que progresan.
  faq:
    - q: ¿Importa la estatura para la talla de la tabla?
      a: >-
        La estatura importa menos que el peso. Un surfista alto y ligero necesita
        menos volumen que un surfista bajo y pesado de la misma estatura. Usa el
        peso como métrica principal y ajusta según tu forma física y fuerza de
        remada.
    - q: ¿Qué pasa si mi tabla tiene demasiado volumen?
      a: >-
        Demasiado volumen hace que la tabla se sienta boyante y inestable sobre
        la cara de la ola. Te costará hundir el canto para girar y podrías botar
        sobre el agua durante los bottom turns.
    - q: ¿Qué pasa si mi tabla tiene demasiado poco volumen?
      a: >-
        Te costará remar para entrar en las olas, te hundirás demasiado en la
        salida y te sentirás inestable incluso sentado en la tabla esperando.
        Los principiantes casi siempre necesitan más volumen del que creen.
    - q: ¿Cómo sé cuándo bajar de talla?
      a: >-
        Cuando consigas coger olas con constancia, hacer el pop-up con fluidez y
        girar básico en tu tabla actual, es el momento de bajar 5-10 litros.
        Bajar de talla demasiado pronto frena tu progreso.
