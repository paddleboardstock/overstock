- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'Guía del Ancla para SUP: Mantente en Tu Sitio al Pescar o Fotografiar'
  description: >-
    Guía completa del anclaje en SUP: tipos de ancla (seta, plegable, estaca),
    montaje del carril de ancla o trolley, técnicas de fondeo y consideraciones
    de seguridad para mantenerte en posición.
  definition: >-
    Un ancla de SUP es un peso sujeto a una cuerda que mantiene la tabla en
    posición contra el viento y la corriente. Los tipos comunes incluyen
    anclas de seta, anclas plegables y estacas de fondeo.
  tldr: >-
    Usa un ancla de seta (0,7-1,4 kg) para fondos fangosos o arenosos, un ancla
    plegable para fondos rocosos o una estaca de fondeo para aguas poco
    profundas con fondos blandos. El ancla debe pesar 0,7-1,4 kg para
    condiciones tranquilas y 1,4-2,3 kg para viento y corriente. Usa siempre
    un carril de ancla o trolley para ajustar la posición y sabe cuándo
    soltar.
  problem: >-
    Encuentras el lugar de pesca perfecto, pero el viento y la corriente te
    desvían de la posición cada pocos minutos. Sin anclaje, pescar y
    fotografiar desde un SUP se convierten en un ejercicio frustrante de
    reposicionamiento constante.
  explanation: >-
    Un ancla funciona arrastrándose por el fondo hasta que se engancha. Las
    anclas de seta se entierran en fondos blandos y ofrecen buena sujeción en
    arena y fango. Las anclas plegables tienen uñas que se clavan en fondos
    duros o rocosos. Las estacas de fondeo funcionan en aguas poco profundas
    hincándose directamente en el fondo.
  solution: >-
    Instala un sistema de carril de ancla o trolley (una línea con un anillo
    deslizante en un lado de la tabla) para ajustar el punto de sujeción del
    ancla. Sujeta 15-23 m de cuerda al ancla. Fondea contra el viento o contra
    la corriente de tu posición deseada. Usa un sistema de liberación rápida
    para desengancharte en emergencias. Nunca fondées en corriente fuerte ni
    donde no puedas recuperar el ancla fácilmente.
  recommendation: >-
    Un ancla plegable de 1,4 kg con 15 m de cuerda funciona para la mayoría de
    las condiciones de pesca con SUP. Añade un sistema de carril de ancla o
    trolley usando los anillos en D de tu Paddle Board Overstock SUP Explorer 11.
  faq:
    - q: ¿Qué tamaño de ancla necesito para el SUP?
      a: >-
        0,7-1,4 kg para lagos tranquilos y ríos lentos. 1,4-2,3 kg para zonas
        costeras con viento o corriente. Los anclas sobredimensionadas son
        difíciles de recuperar.
    - q: ¿Cuánta cuerda de ancla necesito?
      a: >-
        Se recomienda un alcance de 5:1 (5 pies de cuerda por cada 1 pie de
        profundidad). En 10' de agua, usa 50' de cuerda.
    - q: ¿Es peligroso anclar en un SUP?
      a: >-
        Solo si fondeas en corriente o viento lo bastante fuertes como para
        volcar la tabla. Usa siempre un sistema de liberación rápida que pueda
        desengancharse al instante.
    - q: ¿Puedo anclar en cualquier agua?
      a: >-
        Consulta las normativas locales. Algunas zonas restringen el anclaje
        para proteger los lechos de fanerógamas marinas o los hábitats marinos.
        Nunca ancles en arrecifes de coral.
