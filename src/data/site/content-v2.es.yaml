- slug: sup-fitness-workout
  category: guide
  type: tutorial
  title: 'Fitness con SUP: Entrenamiento de Cuerpo Completo en una Tabla de Paddle Board'
  description: >-
    El SUP proporciona un entrenamiento de cuerpo completo que combina
    resistencia cardiovascular, estabilidad del core y fuerza. Cómo estructurar
    sesiones de fitness con SUP, mejores ejercicios y medición del progreso.
  definition: >-
    El fitness con SUP utiliza la plataforma inestable de una tabla de paddle
    para ejercitar los estabilizadores del core, los músculos de las piernas y
    la parte superior del cuerpo mediante el remado, el equilibrio y ejercicios
    sobre la tabla.
  tldr: >-
    El SUP quema 400-700 calorías por hora. Una sesión de SUP de una hora
    ejercita el core, las piernas, la espalda, los hombros y los brazos. El
    remado por intervalos (esprints + recuperación) maximiza el cardio. Las
    posturas de yoga en la tabla desarrollan equilibrio y flexibilidad. Añade
    ejercicios de fuerza específicos del SUP como sentadillas y zancadas sobre
    la tabla.
  problem: >-
    Los entrenamientos de gimnasio se han vuelto aburridos y quieres una
    actividad al aire libre que mejore tu forma física mientras te diviertes.
    El SUP combina la aventura con un acondicionamiento real de cuerpo
    completo.
  explanation: >-
    Remar ejercita el dorsal ancho, los deltoides, el trapecio y los músculos
    del core para la rotación. Estar de pie sobre una plataforma en movimiento
    obliga a los músculos estabilizadores de los tobillos, las rodillas y las
    caderas a trabajar constantemente. Las exigencias cardiovasculares del
    remado continuo a intensidad moderada proporcionan un acondicionamiento
    aeróbico.
  solution: >-
    Estructura las sesiones: 5 min de remado de calentamiento, 20 min de remado
    constante a ritmo moderado, 15 min de remado por intervalos (30 seg de
    esprint, 60 seg suave), 10 min de ejercicios sobre la tabla (sentadillas,
    zancadas, flexiones), 5 min de estiramientos de enfriamiento.
  recommendation: >-
    Usa el Paddle Board Overstock SUP Explorer 11 para el remado de fitness. La plataforma
    estable te permite concentrarte en la técnica y la intensidad. Lleva el
    Life Vest Pro para mayor seguridad durante las sesiones de alta intensidad.
  faq:
    - q: ¿Cuántas calorías quema el SUP?
      a: >-
        400-700 calorías por hora dependiendo de la intensidad, el viento y la
        corriente. El remado por intervalos aumenta la quema de calorías.
    - q: ¿Es el SUP bueno para perder peso?
      a: >-
        Sí, combinado con una nutrición adecuada. El ejercicio de cuerpo
        completo y su naturaleza de bajo impacto lo hacen sostenible para el
        ejercicio regular.
    - q: ¿Puedo hacer entrenamiento de fuerza en un SUP?
      a: >-
        Sí: sentadillas, zancadas, flexiones y planchas sobre la tabla añaden
        un reto de equilibrio a los ejercicios de fuerza.
    - q: ¿Qué músculos trabaja el SUP?
      a: >-
        Principales: core (oblicuos, transverso del abdomen), espalda (dorsales,
        trapecio), hombros (deltoides), brazos (bíceps, tríceps). Secundarios:
        piernas (cuádriceps, isquiotibiales, gemelos).
