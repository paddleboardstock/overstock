- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'Guía de correas para SUP: correas rectas vs. en espiral explicadas'
  description: >-
    Guía completa de correas para SUP: rectas vs. en espiral, tobillo vs.
    pantorrilla, opciones con liberación rápida y cómo elegir la correa
    adecuada para tus condiciones de remada.
  definition: >-
    Una correa de SUP es un cordón que une al remero con la tabla, evitando
    que se separen. Los tipos incluyen correas rectas (para surf y ríos) y
    correas en espiral (para aguas tranquilas).
  tldr: >-
    Las correas en espiral son las mejores para aguas tranquilas y remada de
    fitness: se mantienen fuera de la tabla y del agua. Las correas rectas son
    para el surf en SUP y ríos: ofrecen más libertad y no se enganchan. La
    sujeción en la pantorrilla se prefiere a la del tobillo por comodidad. Las
    correas con liberación rápida son importantes para remar en ríos y evitar
    quedar atrapado.
  problem: >-
    Compraste una correa con tu SUP, pero no estás seguro de si es el tipo
    adecuado para tu estilo de remada. Una correa incorrecta se arrastrará,
    se enganchará o fallará cuando más la necesites.
  explanation: >-
    Las correas rectas son cordones simples de nailon o poliuretano que van
    detrás de la tabla. Funcionan bien en el surf porque no se enganchan en
    las aletas. Las correas en espiral son cordones enrollados que se contraen
    cuando no están bajo tensión: permanecen enrolladas sobre la cubierta al
    remar y se extienden cuando te caes. Mantienen la correa fuera del agua en
    condiciones de aguas tranquilas, reduciendo la resistencia.
  solution: >-
    Elige una correa en espiral para aguas tranquilas, fitness y SUP de travesía.
    La menor resistencia ayuda a mantener la velocidad y evita que la correa se
    enganche en objetos sumergidos. Elige una correa recta para el surf en SUP y
    la remada en ríos. El diseño recto tiene menos probabilidades de engancharse
    en aletas u obstáculos.
  recommendation: >-
    Los paquetes de SUP de Paddle Board Overstock incluyen el tipo de correa adecuado para
    el uso previsto de la tabla. La correa en espiral del paquete SUP Explorer 11
    es excelente para una remada polivalente.
  faq:
    - q: ¿Debe la correa sujetarse al tobillo o a la pantorrilla?
      a: >-
        Se prefiere la sujeción en la pantorrilla para SUP: mantiene la correa
        fuera del agua al remar y reduce el riesgo de tropezar al caminar.
    - q: ¿Qué longitud debe tener una correa de SUP?
      a: >-
        8-10 pies para aguas tranquilas, 6-8 pies para surf. Las correas más
        cortas reducen la resistencia, pero limitan la libertad de movimiento
        sobre la tabla.
    - q: ¿Necesito una correa con liberación rápida para los ríos?
      a: >-
        Sí: el SUP de río requiere una correa o cinturón con liberación rápida
        que pueda desprenderse al instante para evitar quedar atrapado en
        obstáculos como ramas.
    - q: ¿Puedo usar una correa de surf para SUP?
      a: >-
        Las correas de surf son más cortas y delgadas. Funcionan para el surf en
        SUP, pero no son ideales para remar en aguas tranquilas, donde es mejor
        una correa en espiral más larga.
