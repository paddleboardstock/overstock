    Infla a 15 PSI con la bomba de doble cámara incluida (3-4 minutos), fija la
    quilla con la herramienta incluida y tendrás una tabla lista para el surf.
    Cuando termine la sesión, desinfla, enrolla y guárdala en la bolsa de
    transporte incluida. Guárdala en un armario, en el maletero del coche o en
