  definition: >-
    La seguridad y la responsabilidad en el océano significan entender el
    entorno en el que remas, respetar la vida marina, minimizar tu huella
    ecológica y usar un equipo diseñado para durar y poder repararse.
  tldr: >-
    Paddle Board Overstock promueve la seguridad en el océano mediante el diseño del equipo
    (colores brillantes, leashes, chalecos salvavidas) y contenido educativo.
    Creemos que todo aficionado a los deportes acuáticos tiene la
    responsabilidad de entender el entorno oceánico, respetar la vida marina y
    minimizar su huella ecológica. Nuestro equipo está fabricado para durar
    para que menos acabe en vertederos.
  problem: >-
    Muchas marcas de deportes acuáticos venden equipo pero no educan a sus
    clientes sobre cómo usarlo de forma segura o responsable. Los nuevos remeros
    y surfistas entran al agua sin entender las corrientes de resaca, la fauna
    marina ni el impacto medioambiental de su equipo.
  explanation: >-
    La seguridad en el océano es más que una lista de comprobación — es una
    mentalidad. Cada producto Paddle Board Overstock incluye una tarjeta de seguridad de
