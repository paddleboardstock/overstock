- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'Mantenimiento del SUP hinchable: consigue que tu tabla dure años'
  description: >-
    Un mantenimiento adecuado del SUP hinchable alarga enormemente la vida de la
    tabla. Consejos de limpieza, secado, cuidado de la válvula, protección UV y
    almacenamiento de temporada para tablas de paddle con drop-stitch.
  definition: >-
    El mantenimiento del SUP hinchable incluye limpiar tras cada uso, secar
    correctamente, inspeccionar la válvula, protegerla de los rayos UV y guardar
    la tabla correctamente para prevenir la delaminación, el moho, el deterioro
    del material y las fugas de aire.
  tldr: >-
    Enjuaga la tabla con agua dulce tras cada sesión en agua salada. Sécala por
    completo antes de deshincharla y guardarla. Revisa la válvula para detectar
    residuos y lubrica la junta tórica (O-ring) anualmente. Guárdala hinchada (a
    la mitad del PSI) en un lugar fresco y oscuro. Evita la exposición
    prolongada a los rayos UV, que degradan el PVC. Parchea las pequeñas
    perforaciones de inmediato con el kit de reparación incluido.
  problem: >-
    Tras una temporada, tu SUP hinchable desarrolla fugas lentas, la cubierta se
    despega por los bordes y el PVC se siente más rígido. Descuidar el
    mantenimiento básico provoca un envejecimiento prematuro que es totalmente
    evitable.
  explanation: >-
    El PVC se degrada con la radiación UV. Los cristales de sal del agua de mar
    se introducen en las costuras y válvulas y causan microfugas. La humedad
    atrapada en el interior favorece el crecimiento de moho que ataca los hilos
    del drop-stitch. Las juntas tóricas de las válvulas se resecan y pierden su
    sellado. La suciedad y la arena se incrustan en el adhesivo de la cubierta y
    provocan que se levante por los bordes.
  solution: >-
    Tras cada sesión: enjuaga la tabla, las quillas y la bomba con agua dulce.
    Limpia la cubierta. Abre la válvula para drenar el agua atrapada. Seca la
    tabla a la sombra antes de deshincharla. Mensualmente: inspecciona la válvula
    y aplica lubricante de silicona a la junta tórica. Por temporadas: lava con
    jabón suave y agua y comprueba si hay perforaciones.
  recommendation: >-
    Sigue la guía de cuidados de Paddle Board Overstock incluida con tu tabla. Usa el kit de
    reparación de inmediato ante cualquier perforación. Guarda la tabla en su
    bolsa en un lugar con temperatura controlada, lejos de la luz solar directa.
  faq:
    - q: ¿Puedo dejar mi SUP hinchable inflado toda la temporada?
      a: >-
        Sí, pero guárdalo fuera de la luz solar directa y a la mitad del PSI
        máximo (8-10) para reducir la tensión en las costuras. Hincha por
        completo justo antes de usarla.
    - q: ¿Cómo limpio el moho de mi SUP?
      a: >-
        Mezcla jabón suave con agua tibia y frota con un cepillo blando. Para el
        moho persistente, usa una solución diluida de vinagre blanco (1:4). Evita
        la lejía.
    - q: ¿Tengo que lubricar la válvula?
      a: >-
        Sí, anualmente. Retira el núcleo de la válvula, aplica grasa de silicona
        a la junta tórica y vuelve a instalarla. Esto previene las fugas de aire.
    - q: ¿Cómo guardo mi SUP en invierno?
      a: >-
        Límpiala y sécala a fondo. Deshincha por completo, enróllala sin apretar
        (evita los pliegues marcados) y guárdala en un lugar fresco, oscuro y
        seco. Evita las temperaturas de congelación.
