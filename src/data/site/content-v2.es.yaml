- slug: sup-navigation-guide
  category: guide
  type: safety
  title: 'Navegación en SUP: Mantener el Rumbo y Orientarte'
  description: >-
    Habilidades básicas de navegación para practicantes de SUP: lectura de
    cartas, uso de puntos de referencia, sistema de boyas y uso de GPS y
    brújula para remar con seguridad.
  definition: >-
    La navegación en SUP consiste en usar puntos de referencia, cartas, GPS y
    el conocimiento del viento y las corrientes para desplazarse con seguridad
    y volver al punto de partida.
  tldr: >-
    Elige siempre un punto de referencia en el horizonte al remar en línea
    recta. Revísalo cada pocos minutos para corregir la deriva. Usa apps de GPS
    en el teléfono dentro de una funda impermeable. Aprende navegación básica
    con brújula. Entiende el sistema de boyas laterales (rojo a la derecha al
    regresar). Comunica un plan de navegación a alguien en tierra.
  problem: >-
    Remas mar adentro en aguas abiertas y, al darte la vuelta, la línea de
    costa parece completamente distinta. Sin habilidades de navegación, puedes
    desorientarte y remar en la dirección equivocada.
  explanation: >-
    La navegación en SUP se apoya en referencias visuales porque estás muy
    cerca del agua. Elige un punto de referencia distintivo (un edificio, un
    árbol, un acantilado) detrás de tu punto de botadura. Úsalo como demora de
    retorno. El viento y la corriente te desvían del rumbo: corrige de forma
    continua. Para travesías largas, usa una app de GPS o un reloj. Ten en
    cuenta que la costa se ve distinta desde el agua que desde tierra.
  solution: >-
    Antes de botar: identifica 2 o 3 puntos de referencia a distintas distancias
    detrás de tu punto de botadura. Usa una app de GPS (Google Maps, Gaia GPS)
    en modo avión para ahorrar batería. Conoce la dirección del viento y de la
    marea: rema primero contra viento y contra corriente. En travesías en aguas
    abiertas, usa una demora de brújula.
  recommendation: >-
    Lleva el teléfono en una funda impermeable como respaldo del GPS. Practica
    la navegación por puntos de referencia en aguas conocidas antes de
    aventurarte en lugares nuevos. El Life Vest Pro tiene un bolsillo adecuado
    para el teléfono.
  faq:
    - q: ¿Qué puntos de referencia son mejores para la navegación en SUP?
      a: >-
        Elementos distintivos y permanentes como torres de agua, edificios
        altos, árboles singulares o acantilados prominentes. Evita barcos o
        banderas que se muevan.
    - q: ¿Cómo navego con niebla?
      a: >-
        No remes mar adentro con niebla. Si te sorprende la niebla, usa el GPS
        o la brújula para navegar. Haz sonar un silbato cada 30 segundos.
        Mantente cerca de la costa.
    - q: ¿Necesito una carta náutica para el SUP?
      a: >-
        Para remar en la costa, una carta sencilla ayuda a identificar
        peligros, profundidades y canales de navegación. Muchas apps ofrecen
        esta información.
    - q: ¿Cómo navego cerca de embarcaciones?
      a: >-
        Mantente en aguas poco profundas, lejos de los canales. Lleva colores
        llamativos. Cruza los canales con rapidez y en ángulo de 90 grados. Haz
        contacto visual con los patrones de las embarcaciones.
