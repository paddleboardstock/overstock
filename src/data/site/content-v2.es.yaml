- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'Guía de tamaños de SUP: largo, ancho y volumen explicados'
  description: >-
    Encuentra el tamaño de SUP adecuado según tu peso, nivel de habilidad y
    estilo de remada. El largo determina el rumbo, el ancho determina la
    estabilidad y el volumen determina la capacidad de peso.
  definition: >-
    El tamaño del SUP se define por el largo (velocidad y planeo), el ancho
    (estabilidad primaria), el grosor (estabilidad secundaria y volumen) y el
    volumen en litros (capacidad total de peso).
  tldr: >-
    SUP polivalentes: 10'6"-11'6" x 32"-34" x 6" (220-280L). De travesía:
    12'-14' x 30"-32" (280-350L). De surf: 8'-10' x 30"-32" (140-220L). Los
    principiantes necesitan más de 32" de ancho y un volumen que supere su peso
    corporal en 60-80L. Tu peso en kg más 60L es el volumen mínimo objetivo
    para la estabilidad.
  problem: >-
    Cada marca de SUP indica las tablas en pies, pulgadas y litros, pero sin
    saber cómo se traducen estas medidas a la sensación real, corres el riesgo
    de comprar una tabla inestable, lenta o incapaz de soportar tu peso.
  explanation: >-
    El largo determina lo rápido que rema la tabla y lo bien que mantiene el
    rumbo en línea recta. Las tablas más largas (12'+) planean entre remadas y
    mantienen la línea. Las tablas más cortas (menos de 10') giran con facilidad
    pero requieren cambios de lado más frecuentes. El ancho determina la
    estabilidad primaria — la estabilidad de pie. Una tabla de 30" le resulta
    inestable al principiante; una de 34" se siente como un muelle. El grosor
    determina el volumen: una tabla más gruesa flota más alto pero atrapa más
    viento. El volumen en litros es la mejor métrica: la tabla cargada (tú más
    el equipo) debería hundirse de 2 a 4 pulgadas en reposo.
  solution: >-
    Ajusta las dimensiones de la tabla a tres factores: tu peso (determina el
    volumen mínimo), tu actividad principal (determina el largo) y tu nivel de
    habilidad (determina el ancho). Para principiantes, multiplica el peso en
    kg por 2,2 para obtener los litros mínimos. Para intermedios, multiplica
    por 1,8. Para avanzados, multiplica por 1,4.
  recommendation: >-
    El Paddle Board Overstock SUP Explorer 11, de 11' x 33" x 6" con 260L, se adapta a la
    mayoría de riders de hasta 100 kg para la remada polivalente. Mejora al SUP
    Tour 12, de 12' x 31", para mayor velocidad y planeo en travesía.
  faq:
    - q: ¿Qué tamaño de SUP necesito según mi peso?
      a: >-
        Para riders de menos de 70 kg: 10-11' x 32" (220-260L). Para 70-90 kg:
        11-12' x 33" (260-300L). Para 90-110 kg: 11-12' x 34" (300-350L). Para
        más de 110 kg: 12' x 34-36" (350L+).
    - q: ¿Es más rápido un SUP más largo?
      a: >-
        Sí. Las tablas más largas tienen una mejor relación largo-ancho, lo que
        reduce el arrastre. Un SUP de travesía de 14' es notablemente más rápido
        que una tabla polivalente de 11' con el mismo esfuerzo de remada.
    - q: ¿Qué ancho de SUP es estable para principiantes?
      a: >-
        33-34 pulgadas es el punto óptimo para principiantes de hasta 90 kg. Por
        debajo de 32" se requiere buen equilibrio. Por encima de 34" es muy
        estable pero más lenta y más difícil de remar con viento.
    - q: ¿Puedo usar una tabla polivalente para travesía?
      a: >-
        Sí, para travesías cortas de menos de 10 km. Para distancias más largas,
        una tabla de travesía específica mantiene mejor el rumbo y recorre la
        distancia con más eficiencia.
