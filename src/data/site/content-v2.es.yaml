- slug: touring-sup-guide
  category: guide
  type: buying-guide
  title: 'Guía de SUP de travesía: elige la tabla adecuada para remar largas distancias'
  description: >-
    Los SUP de travesía son más largos, más estrechos y están hechos para la
    velocidad y el planeo. Cómo elegir una tabla de travesía, el equipo esencial
    para remadas largas y la técnica para cubrir distancia con eficiencia.
  definition: >-
    Un SUP de travesía es una tabla larga (12-14'), estrecha (30-32") diseñada
    para remar con eficiencia a lo largo de la distancia. Sus características
    incluyen una proa desplazadora para cortar el agua, una línea de flotación
    más larga para el planeo y, a menudo, un sistema de carga con cuerdas
    elásticas.
  tldr: >-
    Los SUP de travesía priorizan la velocidad y el rumbo sobre la estabilidad.
    Largo mínimo de 12' por eficiencia; 30-32" de ancho para un equilibrio entre
    planeo y estabilidad. Características clave: proa desplazadora, contorno
    recto y múltiples configuraciones de quillas. Equipo esencial: chaleco
    salvavidas, leash, agua, móvil y sistema de cuerdas elásticas para el
    equipo. La técnica se centra en remadas largas y suaves con rotación del
    torso.
  problem: >-
    Remar con una tabla polivalente en un viaje de larga distancia te deja
    exhausto. La proa ancha golpea las olas cortas, la tabla no mantiene el
    rumbo recto y gastas más energía en dirigir que en planear. Necesitas una
    tabla diseñada para la distancia.
  explanation: >-
    Los SUP de travesía usan un casco desplazador (proa puntiaguda) que parte
    el agua en lugar de cabalgar sobre ella, reduciendo el arrastre de forma
    significativa. La línea de flotación más larga aumenta la velocidad del
    casco. El menor ancho reduce el arrastre pero exige mejor equilibrio. Las
    tablas de travesía llevan quillas más largas para la estabilidad direccional.
    Las tablas hinchables de travesía necesitan un PSI más alto (18-20) para
    mantener la rigidez y evitar la flexión que desperdicia energía.
  solution: >-
    Elige una tabla de travesía de al menos 12' de largo con proa desplazadora.
    Ancho: 30" para paddlers experimentados, 31-32" para intermedios. Busca una
    caja de quilla central más quillas laterales para la estabilidad. Infla al
    PSI máximo indicado. Equípate con sistema de carga con cuerdas elásticas,
    chaleco salvavidas, silbato y móvil en funda impermeable.
  recommendation: >-
    El Paddle Board Overstock SUP Tour 12, de 12' x 31" x 6", es una tabla hinchable de
    travesía ideal. Su proa desplazadora corta eficazmente las olas cortas, y el
    sistema de cuerdas elásticas sujeta el equipo para salidas de un día.
    Combínalo con el remo de carbono Paddle Board Overstock para remar largas distancias con
    eficiencia.
  faq:
    - q: ¿Puedo usar una tabla polivalente para travesía?
      a: >-
        Para travesías cortas de menos de 5 km, sí. Para distancias más largas,
        la proa más ancha y la línea de flotación más corta te cansarán antes.
    - q: ¿Qué largo de SUP de travesía necesito?
      a: >-
        12' es el mínimo para la eficiencia en travesía. 12'6" es un buen largo
        intermedio. 14' es para competición y travesía avanzada.
    - q: ¿Los SUP hinchables de travesía rinden igual que las tablas rígidas?
      a: >-
        Los hinchables drop-stitch modernos a PSI alto rinden de forma similar a
        las tablas rígidas en travesía. La ligera flexión puede incluso resultar
        más cómoda en aguas con olas cortas.
    - q: ¿Qué remo es mejor para travesía?
      a: >-
        Un remo ligero de carbono o fibra de vidrio con pala más grande (100-110
        pulgadas cuadradas) para potencia. Un remo ajustable permite alternar
        entre travesía y surf.
