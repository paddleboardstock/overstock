- slug: sup-safety-guide
  category: guide
  type: safety
  title: 'Guía de seguridad para SUP: reglas esenciales para cada palista'
  description: >-
    Guía completa de seguridad para SUP que cubre las revisiones meteorológicas, el equipo,
    el autorrescate, las reglas de navegación y qué hacer si las condiciones se vuelven
    peligrosas. Mantente seguro en tu tabla de SUP.
  definition: >-
    La seguridad en el SUP abarca la planificación previa a la salida (clima, mareas,
    revisión del equipo), las prácticas en el agua (leash, chaleco salvavidas, navegación)
    y los procedimientos de emergencia (autorrescate, señalización, prevención de
    hipotermia).
  tldr: >-
    Lleva siempre el leash y el chaleco salvavidas. Consulta el pronóstico del viento: el
    viento de tierra es peligroso. Rema primero contra el viento para que el viento te
    ayude a volver. Lleva un silbato, el móvil en una funda impermeable y agua. Aprende el
    autorrescate. Nunca practiques SUP solo en zonas remotas.
  problem: >-
    El SUP parece engañosamente sencillo. Los principiantes subestiman la rapidez con la
    que el viento, la corriente y el cansancio pueden convertir una sesión divertida en una
    situación peligrosa.
  explanation: >-
    La tabla actúa como una vela con el viento, lo que hace fácil remar a favor de él, pero
    extremadamente difícil volver contra él. La posición de pie aumenta el riesgo de caídas.
    El cansancio se acumula más rápido que en kayak. Los leashes evitan que te separes de la
    tabla. Los chalecos salvavidas te mantienen a flote si te lesiones.
  solution: >-
    Antes de salir: consulta el viento (máximo 10 nudos para principiantes), la dirección
    (evita el viento de tierra) y la marea. Avisa a alguien de tu ruta. En el agua: ponte de
    rodillas para remar contra un viento fuerte. Si te separas de la tabla, nada hacia ella.
    Para el autorrescate: coloca el remo a través de la tabla, patea con las piernas, sube
    el pecho sobre la tabla y gira las piernas para subir.
  recommendation: >-
    Usa el chaleco salvavidas Paddle Board Overstock Life Vest Pro (hinchable) para SUP. Sujeta el leash
    de SUP en espiral a tu pantorrilla. Practica el autorrescate en condiciones tranquilas
    antes de necesitarlo.
  faq:
    - q: ¿Qué velocidad de viento es segura para el SUP?
      a: >-
        Principiantes: menos de 10 nudos. Intermedios: 10-15 nudos. Avanzados: 15-20 nudos.
        Más de 20 nudos es peligroso para todos los niveles.
    - q: ¿Necesito un chaleco salvavidas para el SUP?
      a: >-
        Sí: es obligatorio por ley en muchas jurisdicciones y siempre se recomienda por
        seguridad.
    - q: ¿Qué debo hacer si no puedo volver a la orilla?
      a: >-
        Quédate con tu tabla (es flotación). Haz señales con el silbato. Si te arrastra el
        viento mar adentro, rema en un ángulo de 45 grados respecto al viento.
    - q: ¿Cómo practico el autorrescate en SUP?
      a: >-
        En aguas tranquilas y poco profundas: caete al agua a propósito, nada hasta la tabla
        y practica la remontada repetidamente.
