- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'Guía de Palas de SUP: Elige la Pala Correcta para tu Estilo'
  description: >-
    Guía completa de palas de SUP: longitud, materiales (aluminio, fibra de
    vidrio, carbono), formas de pala y cómo la elección de la pala afecta tu
    experiencia de remado.
  definition: >-
    Una pala de SUP consta de un vástago (aluminio, fibra de vidrio o carbono)
    y una hoja (diedro, cuchara o plana). La longitud debe ser 8-10" por encima
    de tu altura para el remado general.
  tldr: >-
    Longitud de la pala: 8-10" por encima de tu altura para uso general, 6-8"
    para surf, 10-12" para travesías. Materiales: aluminio (barato, pesado),
    fibra de vidrio (gama media, buena flexión), carbono (ligera, rígida,
    cara). Forma de la hoja: diedro (deriva estable), cuchara (potencia),
    plana (versátil). Las palas ajustables son ideales para principiantes.
  problem: >-
    La pala incluida con la mayoría de los iSUPs funciona, pero es pesada e
    ineficiente. Mejorarla aumenta la eficiencia y el disfrute del remado, pero
    las opciones resultan confusas.
  explanation: >-
    La longitud de la pala afecta la eficiencia de la brazada: demasiado corta
    obliga a inclinarte, demasiado larga causa fatiga en los hombros. El
    material determina el peso: las palas de carbono pesan 510-680 g frente a
    los 790-1020 g del aluminio. El tamaño de la hoja afecta la potencia: las
    hojas más grandes (650+ cm²) proporcionan más propulsión por brazada, pero
    fatigan antes. Las hojas en diedro mantienen la línea; las hojas en cuchara
    ofrecen mejor agarre.
  solution: >-
    Para la longitud correcta: quédate de pie con la pala vertical y estira el
    brazo hacia arriba; el mango debe llegar a tu muñeca. Para el material:
    empieza con fibra de vidrio como mejora de peso medio. Para la hoja: elige
    diedro para el remado general. Para actividades: las palas de travesía son
    más largas con hojas más pequeñas; las palas de surf son más cortas con
    hojas más anchas.
  recommendation: >-
    La pala de carbono de Paddle Board Overstock (680 g) es la mejor mejora para los remadores
    habituales. La pala de aluminio ajustable de 3 piezas incluida es adecuada
    para principiantes y para viajar.
  faq:
    - q: ¿Cuánto debe medir mi pala de SUP?
      a: >-
        Mide tu altura en pulgadas y añade 8-10 para el remado general. Para
        surf, añade 6-8. Para travesías, añade 10-12.
    - q: ¿Merece la pena una pala de carbono?
      a: >-
        Sí para remadores habituales: la reducción de peso disminuye
        significativamente la fatiga en sesiones largas. Para uso ocasional, la
        fibra de vidrio ofrece una buena relación calidad-precio.
    - q: ¿Qué es una pala ajustable?
      a: >-
        Una pala de 2 o 3 piezas con ajuste de longitud, ideal para compartir
        entre usuarios o para ajustarla según la actividad.
    - q: ¿Cómo cuido mi pala?
      a: >-
        Aclárala con agua dulce después de usarla en agua salada. Evita pasar por
        encima de ella con el coche o guardarla con calor directo. Revisa que la
        virola (unión) no tenga arena.
