- slug: inflatable-boat-maintenance
  category: guide
  type: tutorial
  title: 'Mantenimiento de barcos hinchables: protege tu inversión'
  description: >-
    Lista de comprobación anual de mantenimiento de barcos hinchables. Limpieza,
    protección UV, inspección de costuras, gestión de la presión, cuidado del
    motor e invernaje para barcos de PVC y Hypalon.
  definition: >-
    El mantenimiento de un barco hinchable comprende la limpieza, la protección
    UV, la gestión de la presión, la inspección de costuras y válvulas, la
    prevención del moho y un almacenamiento adecuado fuera de temporada.
  tldr: >-
    Aclara el barco después de cada uso en agua salada. Aplica protector UV cada
    2-3 meses. Comprueba la presión de inflado antes de cada salida. Inspecciona
    las costuras, las válvulas y el espejo de popa mensualmente. Limpia con
    jabón suave. Fuera de temporada, guárdalo desinflado en un lugar fresco y
    seco.
  problem: >-
    Usaste tu barco hinchable durante una temporada y ahora los tubos parecen
    descoloridos, una costura transpira y el espejo de popa se siente esponjoso:
    todo esto se puede prevenir con un mantenimiento rutinario.
  explanation: >-
    La radiación UV degrada la matriz polimérica. La sal cristaliza en los
    pliegues y desgasta la lona. El moho crece en la humedad atrapada. Una
    presión incorrecta provoca fatiga del material. El espejo de popa
    (especialmente el de madera contrachapada) absorbe agua a través de los
    agujeros de los tornillos.
  solution: >-
    Después de cada uso: aclara con agua dulce, seca y comprueba la presión.
    Mensualmente: limpia los tubos con protector UV, inspecciona las costuras y
    revisa la válvula. Anualmente: limpieza profunda, inspección del espejo de
    popa en busca de podredumbre, lubricación de las válvulas y prueba de
    micro-fugas.
  recommendation: >-
    Usa el protector 303 Aerospace Protectant en los tubos de los barcos de
    Paddle Board Overstock. Retira las válvulas y aplica grasa de silicona anualmente.
    Guárdalo en la bolsa de transporte con un paquete desecante.
  faq:
    - q: ¿Puedo usar lejía para limpiar mi barco hinchable?
      a: >-
        No: la lejía daña el recubrimiento de la lona. Usa jabón suave y agua
        tibia. Para el moho, usa vinagre blanco diluido.
    - q: ¿Con qué frecuencia debo aplicar el protector UV?
      a: >-
        Cada 2-3 meses durante la temporada de uso. Con mayor frecuencia en
        climas tropicales.
    - q: ¿Necesito desinflar mi barco entre usos?
      a: >-
        No si lo usas semanalmente. Déjalo inflado con una funda protectora UV.
        Si van a pasar un mes o más, desinfla y guárdalo.
    - q: ¿Cómo mantengo el espejo de popa?
      a: >-
        Revisa los tornillos mensualmente. Sella los bordes de madera expuestos
        con barniz marino anualmente. Sustitúyelo si aparecen zonas blandas.
