- slug: life-jacket-buying-guide
  category: guide
  type: buying-guide
  title: 'Guía de compra de chalecos salvavidas: tipos, ajuste y características explicados'
  description: >-
    Guía completa de compra de chalecos salvavidas para deportes acuáticos. Tipos de PFD
    (del I al V), hinchable frente a espuma, pruebas de ajuste y recomendaciones específicas
    para SUP, kayak, navegación y pesca.
  definition: >-
    Un chaleco salvavidas o PFD es un dispositivo de flotación diseñado para mantener la
    cabeza de una persona fuera del agua. Los tipos están regulados por la Guardia Costera
    de EE. UU. en función de la flotabilidad y el uso previsto.
  tldr: >-
    Cinco tipos de PFD: Tipo I (alta mar, más de 22 lb), Tipo II (cerca de la costa), Tipo
    III (ayuda a la flotación, el más común), Tipo IV (lanzable), Tipo V (uso especial).
    Los chalecos hinchables ofrecen comodidad, pero requieren el mantenimiento del
    cartucho de CO2. Los chalecos de espuma no requieren mantenimiento, pero son más
    voluminosos.
  problem: >-
    Los chalecos salvavidas se clasifican por tipos y niveles de flotabilidad, pero las
    tiendas no siempre explican qué tipo se adapta a tu actividad.
  explanation: >-
    El Tipo I ofrece la mayor flotabilidad y pone boca arriba al usuario inconsciente. El
    Tipo II puede no poner boca arriba a todos los usuarios. El Tipo III permite libertad de
    movimiento para deportes activos. El Tipo V incluye bolsas hinchables de cinturón para
    SUP. Los PFD hinchables ofrecen 33-37 lb de flotabilidad y son compactos desinflados.
  solution: >-
    Para SUP: cinturón hinchable Tipo V. Para kayak: espuma Tipo III con amplios recortes
    para los brazos. Para navegación en RIB: espuma Tipo III o hinchable con más de 22 lb
    de flotabilidad. Para niños: espuma Tipo II o III con correa entrepiernas.
  recommendation: >-
    Chaleco salvavidas Paddle Board Overstock Life Vest Pro (hinchable Tipo V, 33 lb) para SUP y kayak.
    Paddle Board Overstock Life Vest Classic (espuma Tipo III, 16.5 lb) para navegación en RIB y uso
    marino general.
  faq:
    - q: ¿Qué tipo de PFD necesito para el SUP?
      a: >-
        Muchas jurisdicciones aceptan el Tipo III o el Tipo V para SUP. Las bolsas
        hinchables de cinturón son populares. Consulta las leyes locales.
    - q: ¿Los PFD hinchables necesitan mantenimiento?
      a: >-
        Sí: revisa el cartucho de CO2 anualmente, sustituye la bobina cada 2-3 años y
        enjuágalo después de usarlo en agua salada.
    - q: ¿Puedo usar un PFD de espuma para SUP?
      a: >-
        Sí, pero elige uno con amplios recortes para los brazos. Los chalecos de espuma son
        más voluminosos, pero no requieren mantenimiento.
    - q: ¿Qué PFD es el mejor para un niño?
      a: >-
        Un chaleco de espuma Tipo II o III aprobado por la USCG con collar, correa
        entrepiernas y colores brillantes. Nunca uses PFD hinchables para niños.
