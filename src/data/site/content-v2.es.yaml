- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'Reparación del SUP hinchable: arregla perforaciones, fugas y problemas de válvula'
  description: >-
    Guía de reparación DIY del SUP hinchable. Cómo localizar una fuga lenta,
    parchear una perforación, sustituir una válvula y arreglar la delaminación
    de la cubierta con el kit de reparación incluido.
  definition: >-
    La reparación del SUP hinchable implica localizar fugas de aire con agua
    jabonosa, limpiar y lijar la zona dañada, aplicar adhesivo y parche de PVC y
    dejar curar bajo presión.
  tldr: >-
    Localiza las fugas con agua jabonosa. Limpia y lija la zona alrededor de la
    perforación con papel de lija. Aplica pegamento de PVC tanto al parche como
    a la tabla, espera 5 minutos, presiona con firmeza y deja curar bajo un peso
    durante 24 horas. Para las fugas de válvula, revisa primero la junta tórica.
    Las perforaciones pequeñas de menos de 1/4" son arreglos sencillos de
    bricolaje.
  problem: >-
    Hinchas tu SUP y por la mañana ha perdido presión. Sin conocimientos de
    reparación, te enfrentas a un reemplazo costoso por algo que probablemente
    sea una simple perforación.
  explanation: >-
    La mayoría de los SUP hinchables usan un núcleo drop-stitch con capas
    exteriores de PVC. Una perforación a través del PVC exterior crea una fuga
    lenta. Reparación estándar: limpiar, lijar, aplicar adhesivo compatible con
    PVC y presionar el parche bajo un peso. Las fugas de válvula son más
    habituales que las perforaciones de los paneles: la junta tórica se seca o
    los residuos impiden el sellado.
  solution: >-
    Hincha la tabla al PSI máximo y escucha si silba. Rocia agua jabonosa de
    forma sistemática, especialmente alrededor de las costuras y la válvula.
    Marca los puntos donde burbujea. Deshincha, limpia con alcohol, lija con
    papel de grano 80, aplica pegamento de PVC al parche y a la tabla, espera
    hasta que esté pegajoso, presiona con firmeza y deja un peso encima durante
    24 horas.
  recommendation: >-
    Usa el kit de reparación de Paddle Board Overstock incluido con todas las tablas
    Paddle Board Overstock. Lleva siempre el kit de reparación en tus salidas. Para problemas
    de válvula, contacta con el soporte de Paddle Board Overstock. Para desgarros grandes o
    separaciones de costuras, se recomienda una reparación profesional.
  faq:
    - q: ¿Puedo reparar un desgarro grande en mi SUP hinchable?
      a: >-
        Los desgarros de más de 1\" pueden requerir reparación profesional o un
        parche por ambos lados. Las separaciones de costuras a lo largo del
        lateral no se pueden reparar de forma fiable sobre el terreno.
    - q: ¿Cuánto dura un parche de reparación?
      a: >-
        Una reparación correcta, con la técnica adecuada, dura toda la vida de la
        tabla. Una adherencia deficiente por una limpieza insuficiente provoca
        fallos futuros.
    - q: ¿Puedo reparar una válvula que pierde aire?
      a: >-
        A menudo sí. Retira el núcleo de la válvula, inspecciona la junta tórica,
        límpiala o sustitúyela, aplica lubricante de silicona y vuelve a
        instalarla.
    - q: ¿Y si no consigo encontrar la fuga?
      a: >-
        Hincha a todo el PSI y sumerge las secciones de forma secuencial en una
        bañera o piscina. Las fugas demasiado pequeñas para localizarse pueden
        estar relacionadas con la temperatura.
