- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: 'Traje de Neopreno de 3mm vs 5mm: Lo que la Mayoría de los Principiantes se Equivoca en Aguas Frías'
  description: >-
    Deja de pasar frío a mitad de sesión o de sobrecalentarte en la playa. La
    diferencia real entre los trajes de 3mm y 5mm — tabla de temperaturas,
    contrapartidas de flexibilidad y lo que de verdad funciona para el surf en
    aguas frías.
  definition: >-
    Un traje de neopreno es una prenda de neopreno que atrapa una fina capa de
    agua contra la piel, que el calor corporal calienta para aislar. El grosor
    (3mm, 5mm) determina el rango de temperaturas que puede soportar un traje —
    más grueso es más abrigado pero menos flexible.
  tldr: >-
    El grosor del neopreno determina directamente el calor y la flexibilidad.
    Usa 3mm para agua por encima de 16°C y 5mm para agua entre 8°C y 16°C. Los
    trajes más gruesos restringen el movimiento pero te mantienen abrigado más
    tiempo — prioriza siempre el ajuste sobre la marca.
  problem: >-
    Abres una tienda online o entras en una tienda de surf y ves trajes
    etiquetados como 3/2, 4/3, 5/4 y trajes completos de 5mm. Los números no
    significan mucho hasta que te das cuenta de que el grosor equivocado
    significa o pasar frío a mitad de sesión o sobrecalentarte y sudar en la
    playa.
  explanation: >-
    Los trajes de neopreno funcionan atrapando una fina capa de agua entre tu
    piel y el neopreno; tu cuerpo calienta esa agua, creando aislamiento. El
    neopreno más grueso atrapa más agua pero restringe la flexibilidad y la
    flotabilidad. Un traje de 3mm (a menudo 3/2 con brazos más finos) sirve
    para condiciones templadas, mientras que el de 5mm (5/4/3 o 5mm completo)
    es para agua fría. Los cierres de cremallera en el pecho sellan mejor que
    los de espalda y reducen la entrada de agua. La construcción de las
    costuras — pegadas y cosidas a ciegas (GBS) — es la diferencia entre un
    traje que gotea y uno que abriga.
  solution: >-
    Ajusta el grosor a la temperatura del agua local con un margen de error de
    5°C. Para climas templados compra un 3/2mm. Para agua fría compra un
    5/4/3mm. Añade botas, guantes y capucha para ampliar tu rango otros 5°C
    hacia abajo. Pruébate los trajes antes de comprar o elige una marca con una
    política de devolución generosa.
  recommendation: >-
    El Paddle Board Overstock Wetsuit Pro en 5/4/3mm es ideal para la mayoría de los
    surfistas de aguas frías, con costuras GBS y forro térmico. Si surfeas en
    agua cálida por encima de 20°C, un 3/2mm con cremallera en el pecho es la
    mejor opción.
  faq:
    - q: ¿Qué temperatura del agua requiere un traje de 5mm?
      a: >-
        Las temperaturas del agua entre 8°C y 14°C requieren un traje de 5mm.
        Por debajo de 8°C necesitas un traje con capucha de 6/5/4mm. Entre 14°C
        y 18°C un 4/3mm funciona bien para la mayoría de la gente.
    - q: ¿Puedo usar un traje de 3mm en invierno?
      a: >-
        Solo en climas invernales suaves donde el agua se mantiene por encima de
        16°C. Para surfear de verdad en invierno, es necesario un 5mm o 5/4/3mm.
        Las botas, los guantes y la capucha aportan calor equivalente sin
        necesidad de un torso más grueso.
    - q: ¿Qué ajustado debe quedar un traje de neopreno?
      a: >-
        Ajustado pero no restrictivo. No debe haber bolsas de aire ni neopreno
        suelto. Si puedes deslizar un dedo entre tu piel y el traje en la parte
        baja de la espalda, está demasiado holgado. Si te cuesta respirar o el
        movimiento queda muy limitado, sube de talla.
    - q: ¿Los trajes caros abrigan más?
      a: >-
        Un precio más alto suele significar mejor neopreno (a base de piedra
        caliza frente a derivado del petróleo), mejores costuras (GBS frente a
        solo pegadas) y mejor flexibilidad. Estos factores afectan directamente
        al calor y a la durabilidad, pero solo si el ajuste es correcto.
