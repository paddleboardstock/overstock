- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'Condiciones de viento para SUP: cómo afecta el viento a tu remada'
  description: >-
    Cómo afectan la velocidad y la dirección del viento a la práctica del SUP. Comprender
    el viento de tierra frente al viento de mar, leer los pronósticos de viento, las
    técnicas de remada con viento y cuándo quedarse en la orilla.
  definition: >-
    Las condiciones de viento definen la seguridad en el SUP. El viento de tierra (de la
    tierra al mar) te aleja. El viento de mar (del mar a la tierra) te empuja hacia la
    orilla. El viento lateral hace que la proa se desvíe.
  tldr: >-
    Viento máximo seguro para principiantes: 10 nudos. Intermedios: 15 nudos. Avanzados: 20
    nudos. El viento de tierra es el más peligroso. Rema primero contra el viento. Con
    viento lateral, rema ligeramente a barlovento del destino. Arrodíllate con viento
    fuerte para reducir tu perfil.
  problem: >-
    Sales a remar en condiciones tranquilas, pero 30 minutos después el viento ha aumentado
    y te cuesta volver. El viento es el factor de seguridad del SUP más subestimado.
  explanation: >-
    El viento afecta al SUP más que a cualquier otra embarcación de remo porque vas de pie,
    lo que crea un efecto vela. Un viento de 10 nudos crea mucha más resistencia en un
    palista de pie que en uno sentado en kayak. El viento de tierra te aleja de la
    seguridad. El viento lateral hace que la proa se desvíe.
  solution: >-
    Consulta la velocidad y la dirección del viento antes de remar. Usa la escala de
    Beaufort: fuerza 3 (7-10 nudos) para principiantes y fuerza 4 (11-16) para
    intermedios. Rema primero contra el viento. Si te pilla el viento de tierra, rema en un
    ángulo de 45 grados respecto al viento. Arrodíllate con viento fuerte.
  recommendation: >-
    Usa una aplicación de pronóstico del viento (Windy, Windfinder) antes de cada sesión.
    La Paddle Board Overstock SUP Tour 12 mantiene mejor el rumbo con viento que las tablas más anchas.
    En condiciones de viento, usa remadas más cortas y una mayor cadencia.
  faq:
    - q: ¿Qué dirección de viento es la más segura para el SUP?
      a: >-
        El viento de mar (que sopla hacia la tierra) es el más seguro: te empuja de vuelta.
        El viento de tierra es el más peligroso.
    - q: ¿Cómo remo con viento lateral?
      a: >-
        Rema más en el lado de barlovento para contrarrestar la deriva. Orienta la tabla a
        barlovento de tu destino. Una aleta central más profunda ayuda.
    - q: ¿Puedo remar con viento de 20 nudos?
      a: >-
        Solo si tienes experiencia y te encuentras en aguas protegidas. Los principiantes
        no deberían remar con más de 10 nudos.
    - q: ¿Cómo afectan las ráfagas de viento al SUP?
      a: >-
        Las ráfagas provocan desafíos repentinos de equilibrio. En condiciones de rachas,
        baja tu postura y prepárate para cambios bruscos.
