  faq:
    - q: ¿La garantía de 5 años de Bluefin es mejor que la de 2 años de Paddle Board Overstock?
      a: >-
        Sí, sobre el papel. La garantía de Bluefin refleja confianza en su
        calidad de construcción. Ambas marcas honran sus garantías.
    - q: ¿Qué marca tiene mejor atención al cliente?
      a: >-
        Bluefin tiene un sólido soporte en Europa. Paddle Board Overstock tiene un soporte
