- slug: yoga-sup-guide
  category: guide
  type: tutorial
  title: 'Yoga en SUP: la guía completa de yoga sobre paddle board'
  description: >-
    El yoga en SUP combina posturas de yoga tradicionales con el desafío de una
    plataforma flotante. Cómo elegir una tabla para yoga, posturas esenciales
    para principiantes y consejos para mantener el equilibrio sobre el agua.
  definition: >-
    El yoga en SUP (yoga sobre paddle board) es la práctica de realizar asanas
    de yoga sobre una tabla de stand up paddle, normalmente anclada en aguas en
    calma. La plataforma inestable ejercita más los músculos estabilizadores del
    core que el yoga sobre esterilla.
  tldr: >-
    Usa una tabla ancha (34"+) con una cubierta blanda y adherente. Practica en
    aguas tranquilas y poco profundas, sin corriente ni viento. Ancla la tabla
    con un ancla pequeña o un poste clavado. Empieza con posturas base: perro
    boca abajo, guerrero II, postura del árbol y savasana. El agua añade
    inestabilidad, lo que profundiza el trabajo del core y mejora el equilibrio.
  problem: >-
    El yoga de esterilla se ha vuelto rutinario y quieres profundizar tu
    práctica. La inestabilidad del agua añade un desafío que obliga a un mejor
    trabajo muscular, pero sin orientación podrías elegir una tabla equivocada o
    tener dificultades en las transiciones entre posturas.
  explanation: >-
    Practicar yoga sobre una tabla de SUP transforma cada postura. La superficie
    flotante se desplaza constantemente, lo que obliga a los músculos
    estabilizadores a trabajar de forma continua. Las posturas de pie requieren
    una distribución del peso más precisa. El agua ofrece resistencia natural
    para las posturas flotantes. Las tablas de SUP para yoga necesitan la anchura
    máxima (34-36"), una cubierta de EVA gruesa y blanda, poco rocker para lograr
    una plataforma plana y varios D-rings para el anclaje.
  solution: >-
    Elige una tabla de 34" o más de ancho con cubierta completa. Hincha a un PSI
    firme para lograr estabilidad. Ancla la tabla por el D-ring frontal. Empieza
    con posturas sentadas y de rodillas para aclimatarte a la plataforma.
    Progresa hacia posturas de pie centrándote en transiciones lentas.
  recommendation: >-
    La Paddle Board Overstock SUP Explorer 11, con sus 33" de ancho y su cubierta completa de
    ranuras en rombo, funciona bien para yoga en SUP. Para una práctica dedicada
    al yoga, una tabla más ancha ofrece mayor comodidad. Usa siempre un leash o
    un ancla para evitar que la tabla se desplace.
  faq:
    - q: ¿Necesito una tabla especial para hacer yoga en SUP?
      a: >-
        No necesariamente, pero el ancho y la calidad de la cubierta importan.
        Las tablas de menos de 32\" resultan muy difíciles para el yoga. Una
        cubierta gruesa y acolchada hace cómodas las posturas de rodillas.
    - q: ¿Qué ocurre si me caigo durante el yoga en SUP?
      a: >-
        Caerse forma parte de la experiencia. La mayoría de las caídas ocurren
        durante las transiciones entre posturas. Cae lejos de la tabla, no sobre
        ella.
    - q: ¿Puedo hacer hot yoga en un SUP?
      a: >-
        El yoga en SUP bajo el sol directo puede ser muy caluroso. Practica por
        la mañana o a última hora de la tarde. Usa protección solar y lleva agua.
    - q: ¿Es más difícil el yoga en SUP que el de esterilla?
      a: >-
        Sí — la superficie inestable exige más equilibrio y fuerza del core.
        Muchos practicantes descubren que el yoga en SUP mejora su práctica de
        esterilla al desarrollar un mayor conocimiento corporal.
