- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'Auto-Rescate en SUP: Cómo Volver a Subir a tu Tabla en Agua Profunda'
  description: >-
    Todo practicante de SUP debería dominar el auto-rescate. Técnicas paso a
    paso para volver a subir a tu tabla en aguas profundas, remolcarla hasta la
    orilla y resolver enredos de la correa (leash).
  definition: >-
    El auto-rescate en SUP es la técnica de volver a subir a tu tabla de paddle
    en aguas profundas tras una caída. Incluye la recuperación de la tabla, la
    re-suba del cuerpo y la recuperación del remo.
  tldr: >-
    Tras la caída: mantén la calma, no sueltes el remo y nada hasta la tabla.
    Coloca el remo atravesado sobre la tabla. Usa una patada de delfín para
    impulsar el pecho sobre la tabla. Sube una pierna y luego la otra.
    Arrodíllate primero y después ponte de pie. Practica en aguas tranquilas
    hasta que sea un movimiento automático.
  problem: >-
    Te caes del SUP en aguas profundas y no puedes volver a subir. La tabla es
    resbaladiza, estás cansado y el pánico se apodera de ti. Sin conocer la
    técnica de auto-rescate, una caída simple se vuelve peligrosa.
  explanation: >-
    El auto-rescate tiene tres fases: recuperación (nadar hasta la tabla y el
    remo), re-suba (volver a subir a la tabla) y continuación (retomar el
    paddling). La técnica clave consiste en usar el remo como estabilizador y
    batir las piernas con fuerza para impulsar la parte superior del cuerpo
    sobre la tabla.
  solution: >-
    Fase 1: nada hasta la tabla. Sujeta el remo o recupéralo. Fase 2: coloca el
    remo perpendicular sobre la tabla. Bate las piernas con energía mientras
    subes el pecho hacia el centro de la tabla. Fase 3: una vez con el pecho
    sobre la tabla, sube las piernas de una en una. Fase 4: arrodíllate,
    recupera el aliento y ponte de pie de forma gradual.
  recommendation: >-
    Practica el auto-rescate en condiciones controladas hasta poder hacerlo sin
    pensar. Usa el Paddle Board Overstock SUP Explorer 11, que tiene un buen agarre en la
    cubierta. El Life Vest Pro aporta flotabilidad adicional si te cuesta
    volver a subir.
  faq:
    - q: ¿Cómo vuelvo a subir si estoy agotado?
      a: >-
        Quédate con la tabla para mantenerte a flote. Usa los brazos para subir
        el pecho sobre la tabla, aunque las piernas no puedan batir con
        eficacia. Descansa en posición de rodillas antes de ponerte de pie.
    - q: ¿Y si pierdo el remo?
      a: >-
        Usa los brazos para remar la tabla hasta la orilla. Pide ayuda a otro
        practicante. Sustituye el remo perdido de inmediato.
    - q: ¿Puedo hacer el auto-rescate con olas?
      a: >-
        Sí: coloca la tabla perpendicular a las olas. Cronometra la re-suba
        entre olas. La correa (leash) mantiene la tabla cerca.
    - q: ¿Cómo resuelvo un enredo de la correa (leash)?
      a: >-
        Mantén la calma, flota de espaldas y desenreda la correa lentamente. Si
        la correa envuelve las quillas, quizá debas desmontarlas mientras estás
        en el agua.
