- slug: wetsuit-care-guide
  category: guide
  type: tutorial
  title: 'Cuidado del traje de neopreno: haz que tu neopreno dure el doble'
  description: >-
    Un cuidado adecuado del traje de neopreno alarga su vida útil de 1 temporada
    a 3 o más. Consejos de aclarado, secado, almacenamiento y reparación para
    trajes de neopreno. Evita los errores comunes que destruyen los trajes
    prematuramente.
  definition: >-
    El cuidado del traje de neopreno consiste en aclararlo con agua dulce
    después de cada uso, secarlo lejos de la luz solar directa, guardarlo plano
    o colgado en una percha ancha y limpiarlo periódicamente para eliminar sal,
    bacterias y olores.
  tldr: >-
    Aclara tu traje por dentro y por fuera con agua dulce inmediatamente después
    de cada sesión. Sécalo del revés a la sombra en una percha de plástico
    ancha. Guárdalo plano o doblado en un lugar fresco y seco. Nunca dejes los
    trajes al sol directo, en coches calientes ni en secadoras. Usa champú para
    trajes cada 5-10 sesiones.
  problem: >-
    Después de una temporada, tu traje huele, el neopreno ha perdido
    elasticidad, las costuras se despegan y la cremallera se atasca: todo se
    puede prevenir con los cuidados adecuados.
  explanation: >-
    Los cristales de sal se incrustan en el neopreno y desgastan el material.
    Las bacterias se multiplican en los interiores húmedos, producen olores y
    descomponen el neopreno. Los UV degradan el recubrimiento de nailon. El
    calor por encima de 50C provoca la delaminación. Un secado inadecuado
    deforma el neopreno y tensa las costuras.
  solution: >-
    Después de cada sesión: aclara a fondo por dentro y por fuera, dale la
    vuelta y cuélgalo en una percha de plástico ancha a la sombra. Una vez seco,
    ponlo del derecho y guárdalo plano. Cada 5-10 sesiones: lávalo con champú
    para trajes. Mensualmente: lubrica la cremallera con cera para cremalleras.
  recommendation: >-
    Usa el champú para trajes Paddle Board Overstock Wetsuit Shampoo para la limpieza y la
    cera para cremalleras Paddle Board Overstock Zipper Wax para el mantenimiento de la
    cremallera. Guárdalo en la percha ancha de Paddle Board Overstock dentro de la bolsa de
    malla.
  faq:
    - q: ¿Puedo meter mi traje de neopreno en la lavadora?
      a: >-
        No se recomienda: el lavado a máquina daña el neopreno. Si es
        imprescindible, usa un ciclo suave, agua fría y una bolsa de malla.
    - q: ¿Cómo elimino el olor de mi traje?
      a: >-
        Déjalo en remojo en agua fría con champú para trajes o vinagre blanco
        durante 30 minutos. Acláralo a fondo.
    - q: ¿Cómo debo secar mi traje?
      a: >-
        Del revés, a la sombra, en una percha de plástico ancha y acolchada.
        Evita la luz solar directa y las perchas metálicas.
    - q: ¿Puedo reparar un traje rasgado?
      a: >-
        Los desgarros pequeños de menos de 1\" se pueden reparar con cemento de
        neopreno y un parche. Los desgarros más grandes pueden requerir una
        reparación profesional.
