- slug: inflatable-sup-storage
  category: guide
  type: tutorial
  title: 'Almacenamiento del SUP hinchable: la forma correcta de guardar tu iSUP'
  description: >-
    Un almacenamiento correcto del SUP hinchable previene la delaminación, los
    daños por UV, el moho y las fugas de válvula. Consejos de almacenamiento
    invernal, de larga duración y diario para tablas drop-stitch.
  definition: >-
    El almacenamiento del SUP hinchable consiste en mantener la tabla en un
    entorno limpio, seco y con temperatura controlada, alejada de los rayos UV,
    las temperaturas extremas y los daños físicos.
  tldr: >-
    Guárdala en un lugar fresco y oscuro por debajo de 30C y lejos de la luz
    solar directa. Para períodos cortos (1-2 semanas), guárdala parcialmente
    hinchada a 8-10 PSI. Para el almacenamiento de larga duración, deshincha por
    completo, enróllala sin apretar y colócala en la bolsa de almacenamiento.
    Nunca la guardes mojada. Mantenla alejada de roedores y objetos punzantes.
  problem: >-
    Deshinchas tu SUP y la guardas en un garaje caluroso o un sótano húmedo.
    Tres meses después, el PVC se ha amarilleado, la cubierta se está despegando
    y la válvula pierde aire. Un almacenamiento incorrecto causa más daños que
    el uso regular.
  explanation: >-
    El calor por encima de 50C hace que los plastificantes del PVC migren, lo
    que vuelve el material rígido y quebradizo. La radiación UV descompone los
    enlaces del polímero. La humedad atrapada en el interior crea moho. El frío
    por debajo del punto de congelación vuelve el PVC quebradizo. Los puntos de
    presión de un plegado apretado crean pliegues permanentes.
  solution: >-
    Almacenamiento a corto plazo: enjuaga, seca, hincha a 10 PSI y guárdala
    elevada del suelo en una zona con sombra. Almacenamiento a largo plazo:
    limpia a fondo, seca por completo, deshincha del todo, enróllala con la
    cubierta hacia fuera, colócala en la bolsa y guárdala en un armario fresco y
    seco. Mantenla alejada de productos químicos y plagas.
  recommendation: >-
    Usa la bolsa de transporte de Paddle Board Overstock para guardarla: bloquea los rayos UV
    y evita rozaduras. Guárdala en una habitación con clima controlado. Añade un
    sobre desecante en el interior de la bolsa en entornos húmedos.
  faq:
    - q: ¿Puedo guardar mi SUP hinchado en el garaje?
      a: >-
        Solo si el garaje se mantiene por debajo de 30C y sin luz solar directa.
        La mayoría de los garajes superan los 40C en verano.
    - q: ¿Debo guardar mi SUP en la bolsa?
      a: >-
        Sí, la bolsa protege contra el polvo, los rayos UV y los daños físicos.
        Asegúrate de que la tabla esté completamente seca antes de meterla en la
        bolsa.
    - q: ¿Puede la congelación dañar un SUP hinchable?
      a: >-
        Sí. Por debajo del punto de congelación, el PVC se vuelve quebradizo y
        puede agrietarse al desenrollarlo o hincharlo. Guárdala siempre por
        encima de 5C.
    - q: ¿Cómo debo enrollar mi SUP para guardarla?
      a: >-
        Enróllala con la cubierta hacia fuera para proteger el PVC inferior.
        Evita los pliegues marcados. Alterna la posición del doblez en cada
        ocasión.
