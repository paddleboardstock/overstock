- slug: winter-paddle-boarding
  category: guide
  type: safety
  title: 'Paddle Surf de Invierno: Equipo, Seguridad y Técnica para Agua Fría'
  description: >-
    El paddle surf de invierno requiere un equipo especializado y preparación.
    Grosor del traje de neopreno, seguridad en agua fría, consideraciones sobre
    la tabla y ajustes de técnica para remar en climas fríos.
  definition: >-
    El paddle surf de invierno consiste en practicar SUP en aguas con
    temperaturas inferiores a 15 °C, lo que exige protección térmica (traje de
    neopreno o traje seco), protocolos de seguridad en agua fría y un equipo
    adaptado a las condiciones frías.
  tldr: >-
    El agua por debajo de 15 °C requiere traje de neopreno: de 5/4/3 mm para
    8-14 °C, de 4/3 mm para 12-18 °C. Añade botas, guantes y capucha por debajo
    de 10 °C. Infla la tabla a la PSI máxima: el aire frío reduce la presión.
    Lleva colores llamativos para la visibilidad con poca luz. Nunca remes
    solo. Lleva el teléfono en una funda impermeable.
  problem: >-
    Quieres hacer SUP durante todo el año, pero las condiciones invernales
    plantean desafíos: agua fría, días más cortos y la necesidad de equipo de
    invierno. Sin una preparación adecuada, las sesiones invernales resultan
    frías, cortas y potencialmente peligrosas.
  explanation: >-
    El agua fría conduce el calor 25 veces más rápido que el aire frío. Una
    caída en agua a 8 °C provoca un choque térmico inmediato y un enfriamiento
    muscular rápido. La primera prioridad del cuerpo es la supervivencia, no
    remar. El paddling de invierno exige una protección térmica que conserve la
    movilidad: un equilibrio entre calor y amplitud de movimiento.
  solution: >-
    Lista de equipo: traje de neopreno de 5/4/3 mm con cremallera pectoral,
    botas de 5 mm, guantes de 3 mm, capucha de neopreno, chaleco salvavidas
    (aporta aislamiento térmico adicional), teléfono en funda impermeable y
    silbato. Técnica: rema más cerca de la orilla, comunica tu ruta a alguien y
    revisa bien el tiempo. Calentamiento posterior: ten a mano ropa seca y
    bebidas calientes.
  recommendation: >-
    El traje Paddle Board Overstock Wetsuit Pro 5/4/3 mm con forro térmico es ideal para el
    SUP invernal. Añade las botas de 5 mm y los guantes de 3 mm de Paddle Board Overstock.
    Usa el Life Vest Pro para mayor calor en el torso y seguridad.
  faq:
    - q: ¿Puedo usar un SUP en temperaturas bajo cero?
      a: >-
        Sí, pero evita la formación de hielo en la tabla. El hielo puede dañar
        el PVC. No remes si se está formando hielo en la superficie del agua.
    - q: ¿Necesito una tabla especial para el invierno?
      a: >-
        No, tu SUP hinchable normal funciona perfectamente. El aire frío reduce
        la PSI: infla a la presión máxima. La tabla se sentirá ligeramente más
        rígida.
    - q: ¿Es seguro hacer SUP en solitario en invierno?
      a: >-
        No: rema siempre con un compañero en agua fría. La hipotermia puede
        aparecer a los pocos minutos de una caída.
    - q: ¿Cómo me entro en calor a mitad de sesión?
      a: >-
        Usa un sistema por capas: la capucha, las botas y los guantes de
        neopreno se pueden quitar si te calientas. Deja un termo con bebida
        caliente en la orilla.
