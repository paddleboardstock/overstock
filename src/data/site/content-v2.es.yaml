- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: Reglas de etiqueta del surf (cómo no ser la persona que todos evitan)
  description: >-
    El lineup tiene reglas y nadie las escribe. Aprende el derecho de paso, por
    qué hacer snake te valdrá un grito, cómo disculparte y los errores de
    principiante que molestan a todos los surfistas locales.
  definition: >-
    La etiqueta del surf es un código de conducta no escrito que evita
    colisiones y reparte las olas de forma justa. La regla principal: el
    surfista más cercano al pico de la ola al romper tiene el derecho de paso.
  tldr: >-
    El surfista más cercano al pico de la ola al romper tiene el derecho de
    paso. No hagas drop in sobre nadie, no hagas snake (remar rodeando a otro
    surfista para robarle la ola) y disculpate siempre si cometes un error.
    Rema rodeando el lineup por fuera, sujeta bien tu tabla y sé amable — el
    respeto genera respeto.
  problem: >-
    Remas hacia un lineup concurrido y de inmediato sientes la tensión. Los
    surfistas te miran de reojo, alguien te grita y no sabes qué hiciste mal. El
    lado social del surf resulta más intimidante que las propias olas.
  explanation: >-
    La etiqueta del surf existe para evitar colisiones y repartir las olas de
    forma justa. La regla fundamental es el derecho de paso: el surfista más
    cercano al pico (donde rompe la ola por primera vez) tiene prioridad.
    Cualquiera que reme hacia la misma ola desde más adentro debe retirarse.
    Hacer snake — remar rodeando a otro surfista para robar la prioridad — se
    considera la peor ofensa. Más allá de la prioridad, el lineup tiene
    expectativas sobre el ruido (reduce los gritos al mínimo), el control de la
    tabla (nunca dejes que tu tabla se acerque a otros) y la amabilidad (un
    simple gesto de asentimiento vale mucho).
  solution: >-
    Observa el lineup durante 10 minutos antes de remar hacia fuera. Identifica
    quién atrapa más olas — esos son los surfistas a respetar y a evitar.
    Quédate en la zona interior (zona de espuma blanca) si estás aprendiendo.
    Rema rodeando el lineup por fuera, no a través de él. Cuando atrapes una
    ola, mira hacia ambos lados antes de ponerte de pie y asegúrate de que nadie
    esté más adentro.
  recommendation: >-
    Dedica tus primeras sesiones a un pico apto para principiantes con poca
    gente. Aprende a leer la prioridad antes de intentar un lineup concurrido.
    Si le bajas la ola a alguien, disculpate de inmediato y rema hacia él — la
    mayoría de los surfistas respetan un error honesto.
  faq:
    - q: ¿Qué es hacer drop in?
      a: >-
        Hacer drop in significa remar hacia una ola y surfearla cuando otro
        surfista ya tiene prioridad sobre ella. Es peligroso y falta de respeto.
        El surfista más cercano al pico es dueño de la ola; cualquier otro debe
        salirse.
    - q: ¿Qué es hacer snake?
      a: >-
        Hacer snake es remar rodeando a otro surfista que ya está en posición
        para coger una ola para quedarte más cerca del pico. Se considera un
        fallo de etiqueta gravísimo y puede llevar a confrontaciones.
    - q: ¿Pueden surfear los principiantes en picos concurridos?
      a: >-
        Sí, pero quédate en la zona de espuma blanca, lejos del pico. No remes
        hacia la zona principal de despegue hasta que seas capaz de atrapar olas
        de forma constante y controlar tu dirección. Los lineups concurridos
        requieren experiencia para navegarse con seguridad.
    - q: ¿Cómo me disculpo dentro del agua?
      a: >-
        Basta con un gesto, una sonrisa y un «perdona» o «fue mi culpa».
        Reconoce el error y rema alejándote de la persona. Los surfistas suelen
        perdonar los errores honestos, especialmente si eres claramente un
        aprendiz.
    - q: ¿Qué debo hacer si alguien me baja una ola?
      a: >-
        Si es un drop in evidente, grita «¡ola!» o «¡eh!» para avisarles. Si la
        cogen por accidente y se disculpan, déjalo pasar. Si alguien te baja
        olas repetidamente, rema hacia él y explícale con cortesía la prioridad.
        Evita las confrontaciones.
