  faq:
    - q: ¿Cuánto más rápida es la bomba de doble cámara?
      a: >-
        Aproximadamente el doble de rápida que una bomba de una sola cámara. Un
        SUP se infla en 2-3 minutos frente a los 5-8 minutos.
    - q: ¿Es preciso el manómetro?
      a: >-
        Sí, el manómetro está calibrado y ofrece lecturas precisas con un margen
        de 1 PSI en todo el rango de funcionamiento habitual.
    - q: ¿Se pueden usar los remos con la serie AirDeck?
