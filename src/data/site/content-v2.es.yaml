    permite un control preciso del inflado. Los remos cuentan con palas
    reforzadas y virolas ajustables.
  solution: >-
    Usa el modo de alto volumen para el inflado inicial (ambas cámaras) y cambia
    al modo de cámara única para el inflado final de alta presión. Los remos se
