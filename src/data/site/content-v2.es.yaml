- slug: sup-with-dog
  category: guide
  type: tutorial
  title: 'SUP con tu Perro: Guía Completa Paso a Paso'
  description: >-
    Paddle surf con tu perro: preparación, seguridad, pasos de adiestramiento,
    recomendaciones de equipo y consejos para una experiencia divertida para
    ambos.
  definition: >-
    El SUP con perro consiste en adiestrar a tu compañero canino para que se
    equilibre sobre una tabla de paddle, equiparlo con un chaleco salvavidas
    canino y remar juntos con seguridad.
  tldr: >-
    Empieza con una tabla de SUP ancha y estable (34"+). Consigue a tu perro un
    chaleco salvavidas bien ajustado con asa. Presenta la tabla primero en
    tierra y luego en aguas poco profundas. Empieza con sesiones cortas y
    refuerzo positivo. Lleva siempre agua para tu perro. Vigila las señales de
    estrés o fatiga.
  problem: >-
    A tu perro le encanta el agua, pero no sabes cómo presentarle el SUP con
    seguridad. Sin un adiestramiento adecuado, el perro puede entrar en pánico,
    saltar de la tabla o arañarla.
  explanation: >-
    Los perros tienen una capacidad natural para nadar, pero necesitan aprender
    que la tabla es una plataforma segura. La clave es una desensibilización
    gradual: presenta la tabla sobre terreno firme, premia el comportamiento
    tranquilo, después pasa a aguas poco profundas y por último a aguas más
    profundas.
  solution: >-
    Empieza en tierra: deja que el perro huela la tabla y camine sobre ella
    (sobre hierba). Premia el comportamiento tranquilo. Después: coloca la
    tabla en aguas muy poco profundas, sujétala y deja que el perro se suba.
    Premia. A continuación: súbete tú en aguas poco profundas y deja que el
    perro se una. Por último: rema despacio en aguas tranquilas.
  recommendation: >-
    Usa el Paddle Board Overstock SUP Explorer 11 por su plataforma estable de 33". Añade un
    chaleco salvavidas canino. Lleva agua fresca y un cuenco. Empieza con
    sesiones de 10 minutos y ve aumentando la duración.
  faq:
    - q: ¿Qué tamaño de SUP necesito para mi perro?
      a: >-
        Una tabla ancha de 33-34\" proporciona estabilidad para perros medianos
        y grandes. Los perros pequeños (menos de 10 kg) pueden manejarse en
        tablas de 32\" en adelante.
    - q: ¿Mi perro necesita chaleco salvavidas?
      a: >-
        Sí: incluso los buenos nadadores necesitan un chaleco canino con asa
        para rescatarlos con facilidad en emergencias.
    - q: ¿Cómo protejo la tabla de las garras?
      a: >-
        Mantén recortadas las uñas del perro. Usa un protector de cubierta o
        una toalla. Los perros normalmente se adaptan y dejan de arañar una vez
        que están cómodos.
    - q: ¿Cualquier perro puede aprender a hacer SUP?
      a: >-
        La mayoría de los perros aprenden con paciencia. Los perros ansiosos
        pueden tardar más. Nunca fuerces a un perro asustado a subirse a la
        tabla: crea asociaciones negativas.
