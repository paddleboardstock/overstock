  description: >-
    Todo lo que necesitas saber antes de tu primera sesión de SUP: lista de
    equipo, cómo ponerse de pie, técnica de remada, cómo caerse con seguridad y
    cómo elegir agua en calma para aprender.
  definition: >-
    El stand up paddle (SUP) consiste en ponerse de pie sobre una tabla y usar
    un remo para desplazarse por el agua. El equilibrio, la técnica de la remada
    y la lectura de las condiciones del agua son las tres habilidades clave.
  tldr: >-
    Empieza en agua plana y en calma, sin viento. Practica primero de rodillas y
    luego ponte de pie con los pies a la anchura de las caderas cerca del centro
    de la tabla. Sujeta el remo con una mano en la empuñadura y la otra en el
    asta. Usa la rotación del torso, no la fuerza de los brazos, para remar.
    Mira al horizonte, no a tus pies. Espera caerte — forma parte del
    aprendizaje.
  problem: >-
    Inflas tu primer SUP, subes a la tabla y de inmediato te sientes inestable.
    Te tiemblan las piernas, el remo te resulta incómodo y no entiendes por qué
    vas en círculos en lugar de en línea recta.
  explanation: >-
    El SUP exige adaptar tu equilibrio porque estar de pie sobre una plataforma
    flotante es distinto a cualquier actividad en tierra. Tu cuerpo se tensa de
    forma instintiva, lo que hace que la tabla se sienta aún más inestable. La
    remada debe salir de la rotación del torso, no de tirar con los brazos. La
    pala debe entrar en el agua cerca de los dedos de los pies y salir cerca del
    tobillo. La mayoría de los principiantes reman solo con los brazos, lo que
    provoca fatiga rápida y mal rumbo. Mirar hacia abajo a la tabla
    desestabiliza tu equilibrio.
  solution: >-
    Infla la tabla al PSI recomendado, fija el leash al tobillo y empieza de
    rodillas. Rema de rodillas para sentir el planeo. Cuando estés listo para
    ponerte de pie, coloca el remo sobre la tabla, apoya las dos manos en la
    cubierta, sube un pie cada vez y levántate manteniendo el peso centrado.
    Mantén las rodillas ligeramente flexionadas y el core activado.
  recommendation: >-
    Usa el Paddle Board Overstock SUP Explorer 11 por sus 33" de ancho y su plataforma
    estable. Practica en un lago o una bahía protegida sin corriente. Lleva
    chaleco salvavidas en tus primeras sesiones.
  faq:
    - q: ¿Cuánto se tarda en aprender SUP?
      a: >-
        La mayoría de la gente puede ponerse de pie y remar en agua en calma en
        10-15 minutos. La soltura llega en 3-5 sesiones. Las habilidades
        avanzadas llevan meses.
    - q: ¿Cuál es la mejor condición de viento para principiantes?
      a: >-
        Viento de menos de 5 nudos (calma o brisa ligera). El viento por encima
        de 10 nudos crea olas cortas que desafían el equilibrio. Los
        principiantes deben evitar el viento de tierra.
    - q: ¿Debo llevar leash?
      a: >-
        Lleva siempre leash. Un leash de SUP en espiral se fija al tobillo o a
        la pantorrilla y mantiene la tabla contigo si te caes. En aguas
        abiertas, un leash puede salvarte la vida.
    - q: ¿Cuál es el error más común de los principiantes?
      a: >-
        Mirar hacia abajo a la tabla. Mantén la vista en el horizonte. Tu cuerpo
        sigue a tu cabeza — mirar hacia abajo desplaza tu peso hacia delante y
        hace que la tabla se tambalee.
