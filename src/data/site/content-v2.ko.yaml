- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: '패들보드 크기 가이드: 모든 라이더의 부피, 길이, 너비'
  description: 무게와 활동에 따른 볼륨 추천과 함께 완전한 패들보드 사이즈 측정. 올라운드, 투어링, 서핑, 요가 보드를 위한 사용하기 쉬운 사이즈 차트도 포함되어 SUP 있습니다.
  definition: 패들보드 크기는 부피(무게 용량과 부표), 길이(속도 및 추적), 너비(안정성), 두께(부피 분포 및 풍저항)에 의해 결정됩니다.
  tldr: '최소 부피를 찾으려면 무게를 기준으로 합니다: 50-70kg은 220-260L, 70-90kg은 260-300L, 90-110kg은 300-350L, 110kg은+ 350L이 필요합니다+. 초보자는 이 숫자에 20%를 더하세요. 폭이 중요합니다: 32인치는 중급, 33-34인치는 초보자 친화적, 35인치+는 매우 안정적입니다.'
  problem: 패들보드 크기 목록은 피트, 인치, 리터를 혼용하여 브랜드 간 비교가 어렵습니다.
  explanation: 부피는 무게 용량을 가장 직접적으로 측정하는 지표입니다 — 1리터의 담수는 1kg의 무게를 배기합니다. 260L 보드는 이론상 260kg을 견딜 수 있지만, 보드가 물 위에 있어야 하므로 실제로는 용량이 낮습니다. 전체 무게(몸체와 장비)는 보드 부피의 30-40%가 되어야 합니다.
  solution: 목표 부피 = (체중 kg + 장비 무게 kg x 3). 75kg 패들러와 5kg 기어의 경우, 목표 = 80 x 3 = 최소 240L 초보자는 3.5를 곱합니다. 고급 선수는 2.5를 곱합니다.
  recommendation: Aquafarer SUP 익스플로러 11(260L, 11피트 x 33인치 x 6인치)은 대부분의 50-100kg 라이더에게 적합합니다. 가벼운 라이더는 270까지 사이즈를 맞출 수 AirDeck 있습니다. 무거운 라이더는 SUP Tour 12(300L+) 또는 더 넓은 보드를 고려하는 것이 좋습니다.
  faq:
    - q: 사이즈에 높이가 중요한 SUP 가요?
      a: 키는 체중보다 덜 중요합니다. 키 크고 가벼운 라이더는 키 작고 무거운 라이더보다 부피가 적습니다. 체중을 주요 볼륨 결정 기준으로 사용하세요.
    - q: 볼륨이 너무 많으면 어떻게 되나요?
      a: 보드가 너무 높게 위치해 바람을 돛처럼 받아요. 파도에서는 코르키한 느낌이 듭니다. 하지만 초보자에게는 볼륨이 적은 것보다 더 많은 부피가 더 낫습니다.
    - q: 볼륨이 너무 적으면 어떻게 될까요?
      a: 보드가 너무 깊게 앉아 저항이 생깁니다. 노즈가 패들링(펄링) 중에 잠길 수 있습니다. 부분적으로 잠긴 보드를 노 젓다 금방 피로해집니다.
    - q: 팽창식 보드는 하드 보드와 사이즈가 다를까요?
      a: 크게 다르지는 않습니다. 15 인플레이터블은+ PSI 하드보드와 비슷하게 물을 배열합니다. 부피 권장은 두 유형 모두에 동일하게 적용됩니다.
