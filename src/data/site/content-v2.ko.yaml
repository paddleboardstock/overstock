  recommendation: 129달러의 라이프 베스트 프로는 카약과 카약에 가장 적합한 인플레이터블입니다 PFD SUP . 활동 중 편안함과 필요할 때 신뢰할 수 있는 부력 기능을 결합한 제품입니다.
  faq:
    - q: CO2 카트리지는 얼마나 자주 교체해야 하나요?
