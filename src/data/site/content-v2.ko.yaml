- slug: understanding-tides
  category: guide
  type: technical
  title: '수상 스포츠를 위한 조수 이해: 실용 가이드'
  description: 조수가 서SUP핑, 카약 조건에 미치는 영향. 조수 차트 읽기, 봄조수와 신조 조수 이해, 그리고 안전을 위해 조수 움직임에 맞춰 세션 계획을 세우는 것.
  definition: 조수는 달과 태양의 중력에 의해 일일 오르내리는 해수면의 상승과 하강입니다. 조수 간격은 위치와 달의 주기에 따라 다릅니다.
  tldr: '대부분의 지역에서 매일 두 번의 만조와 두 번의 간조가 있습니다. 만조(보름달/그믤달)는 범위가 더 넓고 조류가 강합니다. 신조(분위달)는 범위가 더 작습니다. 조수는 수심, 파도형, 조류의 세기에 영향을 줍니다. 예를 들어SUP: 먼저 조류를 거슬러 노를 젓어 돌아오는 데 도움이 됩니다.'
  problem: 지역 브레이크에 도착하면 거의 파도가 없고, 썰물로 인한 위험한 절벽이 흐르거나 물이 너무 얕습니다. 조수를 이해하지 못하면 여행을 헛되이 하거나 위험한 조건에서 노를 저어 나갑니다.
  explanation: 조수는 달의 중력에 의해 발생합니다. 봄조(보름달과 초승달)는 최고 조와 최저 조수를 만듭니다. 신조(4분의 달)는 범위가 최소합니다. 조류 흐름은 중조 때 가장 빠르고, 만조와 썰물 때는 느슨합니다. 조수 범위는 0.3m(지중해)에서 16m(펀디 만)까지 다양합니다.
  solution: '매 세션 전에 조수 차트를 확인하세요. 서핑의 경우: 해변 휴식은 만조 전반에 2-3시간 정도 가장 잘 맞습니다. 조류 전반부SUP를 반대로 노를 저어 조류 보조를 되찾으세요. 낚시의 경우: 밀려오는 조수가 물고기를 평지로 밀어냅니다.'
  recommendation: NOAA 조수 예측이나 지역 조수 앱을 사용하세요. 한 달간 기록해 지역 브레이크의 조수 선호도를 확인하세요.
  faq:
    - q: 조수가 무엇인가요?
      a: 춘조는 보름달과 초승달 사이에 발생하며, 만조와 강한 조류를 만듭니다. 이 조수는 한 달에 두 번 발생합니다.
    - q: 네프타이드란 무엇인가요?
      a: 신조는 1/4월 동안 발생합니다. 조수 간격이 더 작고 조류도 약해 초보자에게 적합합니다.
    - q: 썰물이 위험한SUP가요?
      a: 간조 시에는 암석과 산호초가 노출될 수 있습니다. 또한 파도 에너지를 더 가파른 모래톱에 집중시킵니다.
    - q: 조수가 이안류에 어떤 영향을 미치나요?
      a: 썰물(썰물)은 이안류를 강화합니다. 들어오는 조수(홍수)는 이안류의 강도를 감소시킵니다.
