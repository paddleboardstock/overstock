- slug: wetsuit-repair-guide
  category: problem
  type: tutorial
  title: '수트 수리: 찢어진 부분, 솔기, 지퍼를 직접 고치세요'
  description: 네오프렌 찢어짐, 솔기 분리, 지퍼 끼기, 그리고 갈라진 무릎 보호대를 위한 DIY 웻수트 수리 가이드. 네오프렌 시멘트를 사용한 단계별 지침.
  definition: 웻수트 수리는 손상된 부위를 청소하고 거칠게 처리하며, 네오프렌 시멘트 도포, 압력 하에 경화하여 방수성과 유연성을 회복하는 과정을 포함합니다.
  tldr: '1인치 미만의 작은 찢어짐: 양쪽에 네오프렌 시멘트를 바르고, 끈적이 될 때까지 10-15분 기다린 후 단단히 눌러서 무게 아래에서 12시간 경화하세요. 큰 찢어짐은 네오프렌 패치가 필요합니다. 지퍼 문제: 먼저 윤활제를 바른 후 천이 걸렸는지 확인하세요.'
  problem: 웻수트에 작은 찢어짐, 솔기가 분리되거나 지퍼가 달라붙는 경우가 있습니다. 직접 수리하지 않으면 교체에 150달러를 내야 하+는데, 수리비는 5달러입니다.
  explanation: 네오프렌 시멘트는 네오프렌 표면을 부드럽게 만들어 용매가 증발하면서 화학 결합을 형성합니다. 시멘트는 두 표면 모두에 적용되어야 하며, 접합 전에 끈적거려야 합니다. 찢어진 경우에는 가장자리가 정확히 정렬되어야 합니다. 지퍼 문제는 종종 염분 부식이나 천이 이빨에 걸린 경우입니다.
  solution: '파열은 알코올로 닦고, 가볍게 사포질한 뒤 양쪽 가장자리에 얇은 시멘트 층을 발라, 끈적일 때까지 기다렸다가 완벽하게 눌러서 무게를 발라, 12-24시간 경화. 패치 작업: 찢어진 부분보다 1인치 크게 잘라서 시멘트를 바르고 클램프로 고정하세요. 지퍼: 세척, 지퍼 왁스를 바르고 부드럽게 작업하세요.'
  recommendation: Aquafarer 장비 가방에 웻수트 수리 키트를 꼭 넣어두세요. 큰 수리나 중요한 지점의 솔기 파손은 전문가의 수리를 권장합니다.
  faq:
    - q: 웻수트에 순간접착제를 사용할 수 있나요?
      a: 아니요 — 순간접착제는 단단하고 부서지기 쉽습니다. 웻수트 수리에는 네오프렌 시멘트나 아쿠아실만 사용하세요.
    - q: 네오프렌 시멘트 수리는 얼마나 오래 지속되나요?
      a: 적절히 수리된 경우는 원래 네오프렌보다 더 강력하며 수트의 남은 수명까지 지속됩니다.
    - q: 완전히 분리된 지퍼를 수리할 수 있나요?
      a: 트랙이 네오프렌에서 분리되었다면 접촉 시멘트로 다시 접착하세요. 치아가 손상되면 전문가에게 지퍼를 교체하세요.
    - q: 이음새가 새는 웻수트를 어떻게 고치나요?
      a: 새는 이음새 안쪽에 얇은 아쿠아실 구슬을 발라주고 24시간 경화시킵니다.
