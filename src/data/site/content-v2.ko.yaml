  title: '해양 생명 조끼 가이드: PFD 수중 활동에 맞는 적절한 조끼 선택'
  description: SUP카약, 보트 타기, 요트 등 구명조끼 구매 가이드 완전 RIB .PFD 종류(폼 vs 인플레이터블), 착용 가이드라인, 법적 요건, 각 활동별 특징.
  definition: 구명조끼 또는 개인 부력 장치(PFD)는 사람이 물에 떠 있도록 설계된 안전 장비입니다. 유형은 Type I(해상용)부터 Type V(특수 용도)까지 다양합니다.
  tldr: 'PFD 활동별로 선택: 카약용 팽창식 벨트 SUP팩, 카약용 폼 조끼, 타입 III 폼, RIB 파워보트용 폼. 주요 특징: USCG ISO 승인 또는 반사 패널, 구조 호루라기, D-링(줄), 밝은 색상.'
  problem: 20달러에서 300달러까지 다양한 구명조끼들이 줄지어 서 있는 것을 보면서도, 어떤 것이 자신의 활동에 적합한지, 법적 요건을 충족하는지 전혀 알 수 없습니다.
  explanation: '구명조끼는 유형별로 분류됩니다: Type I(해상, 의식을 잃은 착용자를 얼굴 위로 돌리기), Type II(근해), Type III(부력 보조기, 가장 일반), Type IV(투척형), Type V(특수 용도). 팽창식 조끼는 CO2 카트리지를 사용하며, 부피가 적지만 유지보수가 필요합니다. 폼 조끼는 유지보수가 필요하지 않지만 부피가 더 큽니다.'
  solution: '용도: SUP부력 33파운드의 팽창식 벨트팩 또는 조끼를 선택하세요. 카약의 경우: 높은 팔 컷아웃이 있는 타입 III 폼. 용도RIB: 타입 III 폼 또는 22+파운드 부력, 반사 테이프, 구조 호루라기가 있는 팽창식 제품.'
  recommendation: Aquafarer 라이프 베스트 프로(인플레이터블, 33파운드)는 SUP 카약과 카약에 이상적입니다. Aquafarer 라이프 베스트 클래식(폼, 타입 III)은 RIB 보트 타기와 일반 해양 사용에 완벽합니다.
  faq:
    - q: 구명조끼가 필요한SUP가요?
      a: 네 — 많은 관할구역에서 법적으로 의무이며 항상 권장됩니다. 패들 스포츠 시에는 팽창식 벨트팩이나 조끼를 착용하세요.
    - q: 팽창식 구명조끼는 안전한가요?
      a: 네, 적절한 유지보수가 필요합니다. CO2 카트리지는 매년 점검하고, 보빈은 2-3년마다 교체하세요.
    - q: 아이에게 가장 적합한 구명조끼는 무엇인가요?
      a: USCG칼라, 크로치 스트랩, 밝은 색상이 있는 승인된 Type II 또는 III 폼 조끼입니다. 어린이용 팽창 조끼는 절대 사용하지 마세요.
    - q: 구명조끼는 어떻게 맞아야 할까요?
      a: 딱 맞아요 — 어깨를 들어 올렸을 때 조끼가 귀 위로 올라가면 안 됩니다. 모든 지퍼와 버클을 잠가야 합니다.
