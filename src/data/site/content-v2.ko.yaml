  category: guide
  type: tutorial
  title: '팽창식 보트 유지보수: 투자를 지키세요'
  description: 연간 고무보트 유지보수 체크리스트. 청소, UV 보호, 이음 점검, 압력 관리, 엔진 관리, 겨울철 관리 등이 포함됩니다 PVC Hypalon .
  definition: 팽창식 보트 유지보수는 청소, UV 보호, 압력 관리, 이음새 및 밸브 점검, 곰팡이 방지, 그리고 적절한 비수기 보관을 포함합니다.
  tldr: 소금물에 사용할 때마다 헹구세요. UV 보호제는 2-3개월마다 바르세요. 외출 전 팽창 압력을 확인하세요. 매달 이음새, 밸브, 트랜섬을 점검하세요. 순한 비누로 청소하세요. 비수기에는 공기가 빠진 상태로 서늘하고 건조한 곳에 보관하세요.
  problem: 한 시즌 동안 팽창식 보트를 사용했는데 튜브가 바래 보이고, 이음새가 새고, 선미가 스펀지 같아 — 이 모든 것은 정기적인 유지보수로 예방할 수 있습니다.
  explanation: UV 방사선은 폴리머 매트릭스를 분해합니다. 염수는 접힌 부분에서 결정화되어 천을 마모시킵니다. 곰팡이가 갇힌 습기 속에서 자랍니다. 잘못된 압력은 재료 피로를 유발합니다. 트랜섬(특히 합판)은 나사 구멍을 통해 물을 흡수합니다.
  solution: '사용 후: 신선한 물로 세척하고, 말린 뒤, 압력 확인. 월간: 보호제로 튜브를 닦 UV 고, 이음새를 점검하고, 체크 밸브를 점검합니다. 매년 한 번: 깊은 청소, 트랜섬 부패 점검, 밸브 윤활, 미세 누출 검사.'
  recommendation: 보트 튜브에는 303 에어로스페이스 프로텍티트를 사용하세요 Aquafarer . 밸브를 제거하고 실리콘 그리스를 매년 바르세요. 건조제 팩과 함께 휴대 가방에 보관하세요.
  faq:
    - q: 표백제로 고무보트를 청소할 수 있나요?
      a: 아니요 — 표백제는 원단 코팅을 손상시킵니다. 순한 비누와 따뜻한 물을 사용하세요. 곰팡이는 희석한 백식초를 사용하세요.
    - q: 보호제를 얼마나 자주 치료해야 UV 하나요?
      a: 사용 시즌 동안 2-3개월마다 복용합니다. 열대 기후에서는 더 자주 사용됩니다.
    - q: 보트를 사용할 때마다 공기를 빼야 하나요?
      a: 매주 사용하면 그렇지 않습니다. 커버를 씌운 채 부풀린 상태로 두 UV 세요. 매달 빈틈을 놓을 때는 공기를 빼고 보관하세요.
    - q: 트랜섬은 어떻게 유지하나요?
      a: 볼트는 매달 점검하세요. 노출된 나무 모서리는 매년 해양 바니시로 밀봉하세요. 부드러운 부분이 생기면 교체하세요.
