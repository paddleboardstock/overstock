  type: safety
  title: 'SUP 셀프 레스큐: 딥 워터에서 다시 보드에 오르는 방법'
  description: 모든 SUP 패들러는 자가 구조를 마스터해야 합니다. 깊은 물에서 보드를 다시 장착하고, 해안으로 끌고, 목줄 엉킴 처리하는 단계별 기술입니다.
  definition: SUP 셀프 구조는 깊은 물에서 빠진 후 패들 보드를 다시 장착하는 기법으로, 보드 회수, 몸체 재장착, 패들 회수 등을 포함합니다.
  tldr: '넘어진 후: 침착하게 노를 잡고 보드 쪽으로 헤엄쳐 가세요. 노를 보드 위에 놓으세요. 돌고래 킥으로 가슴을 보드 위로 밀어내세요. 한쪽 다리를 위로 흔들고, 그다음 다른 쪽 다리도 올립니다. 먼저 무릎을 꿇고, 그 다음에 서세요. 잔잔한 물에서 근육 기억이 될 때까지 연습하세요.'
  problem: SUP 깊은 물에서 떨어져 다시 올라갈 수 없습니다. 보드는 미끄럽고, 피곤하며, 공황 상태가 밀려옵니다. 자가 구조 기술을 모르면 단순한 낙하가 위험해집니다.
  explanation: '자가 구조는 세 단계로 나뉩니다: 회복(보드 쪽으로 수영하고 노를 젓기), 다시 탑승(보드에 다시 올라타기), 그리고 계속(노 젓기 재개). 핵심 기술은 노를 안정기로 사용하고 강력한 다리 차기를 사용해 상체를 보드 위로 밀어붙이는 것입니다.'
  solution: '1단계: 보드까지 헤엄쳐 가세요. 패들을 잡거나 회수하세요. 2단계: 패들을 보드 위에 수직으로 놓으세요. 다리를 힘차게 차면서 가슴을 보드 중앙으로 당깁니다. 3단계: 가슴이 보드에 올라가면 다리를 하나씩 위로 흔듭니다. 4단계: 무릎을 꿇고 숨을 고르고 서서히 일어섭니다.'
  recommendation: 통제된 환경에서 자가구조를 연습해 생각 없이 할 수 있을 때까지 연습하세요. Aquafarer SUP 데크 접지력이 좋은 익스플로러 11을 사용하세요. 라이프 베스트 프로는 어려움을 겪을 때 추가 부력을 제공합니다.
  faq:
    - q: 지쳤을 때 어떻게 다시 시작할 수 있나요?
      a: 부력 조절을 위해 보드에 붙어 있으세요. 다리가 제대로 차지 못해도 팔로 가슴을 보드 위로 당기세요. 일어서기 전에 무릎을 꿇은 자세로 쉬세요.
    - q: 패들을 잃어버리면 어쩌지?
      a: 팔을 사용해 보드를 해안까지 젓으세요. 다른 패들러에게 도움을 요청하세요. 잃어버린 패들을 즉시 교체하세요.
    - q: 파도처럼 스스로 구조할 수 있나요?
      a: 네 — 보드를 파도에 수직으로 배치하세요. 파도 사이에 다시 타는 타이밍을 맞추세요. 목줄이 보드를 가까이 두는 역할을 합니다.
    - q: 목줄 엉킴을 어떻게 해결하나요?
      a: 침착하게 등을 대고 떠서 천천히 목줄을 풀어주세요. 목줄이 지느러미에 감겨 있다면, 물속에서 지느러미를 벗어야 할 수도 있습니다.
