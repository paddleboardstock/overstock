  title: '인플레이터블 여행 SUP: 완전 가이드'
  description: 인플레이터블 여행 완전 가이드 SUP — 항공사 규정, 포장 팁, 목적지 선택, 이동 중 보드 보호.
  definition: SUP 여행이란 인플레이터블 패들 보드를 위탁 수하물이나 차량 화물로 운반하는 것을 의미하며, 목적지에서 보드를 포장하고 보호하며 조립하는 것을 포함합니다.
  tldr: 팽창식 버스는 최고의 여행입니다SUP. 보드를 배낭에 넣어 오버사이즈 수하물로 부치세요(대부분 항공사는 최대 32kg까지 허용). 핀과 펌프는 따로 감싸세요. 체크인을 위해 일찍 도착하세요. 목적지의 현지 상황과 수역 접근성을 조사하세요. 잔잔한 물과 쉬운 출발 지점이 있는 목적지를 선택하세요.
  problem: 새로운 장소에서 노를 젓고 싶지만 단단한 보드를 운반하는 것은 불가능합니다. 팽창식 보드조차도 항공사 제한이 있어 적절한 준비 없이 문제를 일으킬 수 있습니다.
  explanation: '대부분의 항공사는 SUP 배낭을 위탁 수하물로 받아들이지만, 정책은 다릅니다. 주요 크기: Aquafarer 배낭 크기는 포장 시 약 90x40x30cm입니다. 총 무게는 약 15kg이며, 대부분의 항공사 제한 내에 있습니다. 일부 항공사는 초과 수하물 요금을 부과하기도 합니다. 가능하면 펌프와 핀을 기내 반입하세요. 도착 전에 현지 수질 상태, 출항 요금, 보관 상황을 조사하세요.'
