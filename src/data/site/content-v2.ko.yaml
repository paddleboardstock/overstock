  title: '인플레이터블 SUP 유지보수: 보드를 수년간 오래 유지하세요'
  description: 적절한 팽창식 SUP 유지보수는 보드 수명을 크게 연장합니다. 패들보드의 청소, 건조, 밸브 관리, UV 보호 및 계절별 보관 팁 drop-stitch .
  definition: 팽창식 SUP 유지보수는 사용 후 청소, 적절한 건조, 밸브 점검, UV 보호 및 적절한 보관을 포함하여 박리, 곰팡이, 재료 열화, 공기 누출을 방지합니다.
  tldr: 매번 소금물 작업 후에는 보드를 신선한 물로 헹구세요. 공기를 빼고 보관하기 전에 완전히 말리세요. 밸브에 이물질이 있는지 점검하고 O-링에 매년 윤활을 하세요. 반쯤 부풀린 상태로 PSI서늘하고 어두운 곳에 보관하세요. 장시간 노출은 손상 UV 을 피하세요PVC. 작은 구멍은 포함된 수리 키트로 즉시 메우세요.
  problem: 한 시즌이 지나면 팽창식 공간이 SUP 천천히 누수하고, 데크 패드 가장자리가 벗겨지며, 더 PVC 뻣뻣하게 느껴집니다. 기본적인 유지보수를 소홀히 하면 완전히 예방할 수 있는 조기 노화가 발생합니다.
  explanation: PVC UV 방사선에 의해 분해됩니다. 바닷물에서 나온 염금 결정이 이음새와 밸브에 침투해 미세 누출을 일으킵니다. 내부에 갇힌 습기는 곰팡이 번식을 촉진하여 drop-stitch 나사산을 공격합니다. 밸브 O-링은 건조되어 밀봉이 풀립니다. 먼지와 모래가 데크 패드 접착제에 갈려 가장자리 들림을 일으킵니다.
  solution: '각 세션 후에는 보드, 핀, 펌프를 깨끗한 물로 헹구세요. 데크 패드를 닦아주세요. 밸브를 열어 갇힌 물을 빼내세요. 보드를 그늘에서 말린 후 공기를 빼세요. 월별로 밸브를 점검하고 O링에 실리콘 윤활제를 발라주세요. 계절에 따라: 순한 비누와 물로 세척하고 구멍이 뚫렸는지 확인하세요.'
  recommendation: Aquafarer 보드에 포함된 관리 가이드를 따르세요. 펑크 난 부분은 즉시 수리 키트를 사용하세요. 보드는 직사광선이 닿지 않는 온도 조절 구역에 가방에 보관하세요.
  faq:
    - q: 인플레이터블을 SUP 시즌 내내 팽창 상태로 둘 수 있나요?
      a: 네, 하지만 직사광선 피해를 피하고 최대 8-10 인치로 보관 PSI PSI해서 이음선에 가해지는 부담을 줄이세요. 사용 직전에 완전히 부풀려야 합니다.
    - q: 곰팡이를 어떻게 제거하나요SUP?
      a: 순한 비누를 따뜻한 물에 섞고 부드러운 붓으로 문지르세요. 고집 센 곰팡이에는 희석한 백식초 용액(1:4)을 사용하세요. 표백제는 피하세요.
    - q: 밸브에 윤활제를 발라야 하나요?
      a: 네, 매년 한 번씩요. 밸브 코어를 제거하고, O링에 실리콘 그리스를 바른 후 다시 설치하세요. 이렇게 하면 공기 누출을 방지할 수 있습니다.
    - q: SUP 겨울을 대비해 어떻게 보관하나요?
      a: 깨끗이 씻고 철저히 말리세요. 완전히 공기를 빼고, 느슨하게 말아서 (꽉 조인 주름 피함) 서늘하고 어두운 건조한 곳에 보관하세요. 얼음 온도는 피하세요.
