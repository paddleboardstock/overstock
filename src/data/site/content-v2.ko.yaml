- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP 사이즈 가이드: 길이, 너비, 부피 설명'
  description: SUP 체중, 실력, 패들링 스타일에 맞는 적절한 크기를 찾으세요. 길이는 트래킹을 결정하고, 너비는 안정성을, 부피는 무게 용량을 결정합니다.
  definition: SUP 크기는 길이(속도와 활공), 너비(1차 안정성), 두께(2차 안정성 및 부피), 그리고 부피(총 중량 용량)로 정의됩니다.
  tldr: '전면 SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). 투어링: 12''-14'' x 30"-32" (280-350L). 서핑: 8''-10'' x 30"-32" (140-220L). 초보자는 32" 이상의 폭과 체중보다 60-80L 이상 부피가 필요합니다. 무게 (kg에 60L)을 더한 것이 안정성을 위한 최소 부피 목표입니다.'
  problem: 모든 SUP 브랜드가 보드를 피트, 인치, 리터 단위로 표시하지만, 이 측정값이 실제 느낌에 어떻게 적용되는지 모르면 팁이 떨어지거나 느리거나 체중을 지탱하지 못하는 보드를 살 위험이 있습니다.
  explanation: '길이는 보드가 얼마나 빠르게 노를 젓는지, 그리고 직선에서 얼마나 잘 따라가는지를 결정합니다. 긴 보드(12피트)는 +스트로크 사이를 미끄러지듯 움직이며 라인을 유지합니다. 짧은 보드(10피트 미만)는 쉽게 돌지만 패들 스위치를 더 자주 사용해야 합니다. 너비는 주된 안정성, 즉 서 있는 안정성을 결정합니다. 30인치 보드는 초보자에게 기울어진 느낌이고; 34인치는 부두처럼 느껴집니다. 두께는 부피를 결정합니다 — 두꺼운 보드는 더 높이 떠 있지만 바람을 더 잘 잡습니다. 부피(리터 단위)가 가장 좋은 지표입니다: 적재된 보드(당신과 장비)는 정지 시 2-4인치 정도 잠겨야 합니다.'
  solution: '보드 크기를 세 가지 요소에 맞춰 맞추세요: 체중(최소 부피 결정), 주 활동 요소(길이 결정), 그리고 기술 수준(너비 결정). 초보자는 무게 kg에 2.2를 곱하면 최소 리터를 얻을 수 있습니다. 중급자에게는 1.8을 곱하세요. 고급 플레이어는 1.4를 곱합니다.'
  recommendation: 익 Aquafarer SUP 스플로러 11은 11피트 x 33인치 x 6인치, 260L 타이어로, 100kg까지 무게가 큰 대부분의 라이더에게 전천후 패들링에 적합합니다. SUP 투어링 속도와 활공을 위해 12피트 x 31인치의 투어 12로 업그레이드하세요.
  faq:
    - q: SUP 제 체중에 맞는 사이즈가 필요할까요?
      a: '70kg 미만 라이더: 10-11피트 x 32인치 (220-260L). 70-90 kg 기준: 11-12피트 x 33인치 (260-300L). 90-110kg 기준: 11-12피트 x 34인치 (300-350L). 110kg 초과: 12피트 x 34-36인치 (350L+).'
    - q: 더 긴 시간이 더 SUP 빠른가요?
      a: 네. 긴 보드는 길이와 너비 비율이 더 좋아서 항력을 줄입니다. 14피트 투어링은 SUP 같은 패들링 노력에서 11피트 전천 보드보다 훨씬 빠릅니다.
    - q: SUP 초보자에게 안정적인 폭은 어느 정도인가요?
      a: 33-34인치는 90kg 이하 초보자에게 적당한 범위입니다. 32인치 이하에서는 좋은 균형이 필요합니다. 34인치 이상은 매우 안정적이지만 느리고 바람에 패들링하기 어렵습니다.
    - q: 투어링에 올라운드 보드를 사용할 수 있나요?
      a: 네, 10km 미만의 짧은 투어에는 그렇습니다. 장거리 투어에는 전용 투어링 보드가 더 잘 추적하고 거리를 더 효율적으로 커버합니다.
