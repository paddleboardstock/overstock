- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP 수분 보충과 자외선 차단: 물 위에서 안전하게 지내세요'
  description: 패들러를 위한 필수 수분 섭취 및 자외선 보호 전략 SUP . 탈수와 햇볕에 탄생이 가장 흔한 SUP 문제이며, 장시간 운동 중 이를 예방하는 방법.
  definition: SUP 수분 보완은 패들링 중 규칙적인 물 섭취로 수분 균형을 유지하는 것을 의미합니다. 자외선 차단은 SPF 바르기, 보호복, 그리고 피크 피처를 피하기 위한 타이밍 세션을 포함UV합니다.
  tldr: 패들링 시간당 500ml의 물을 마시세요. 필요하다고 생각하는 것보다 더 많은 물은 2L 방광이나 여러 병을 챙기세요. 패들링 전에 방수 SPF 50+ 자외선 차단제를 발라주고, 2시간마다 다시 바르세요. 모자, 스트랩이 달린 선글라스, UPF 등급 의류를 착용하세요. 오전 11시부터 오후 3시까지는 가장 강한 시간대에 노를 젓지 마세요 UV .
  problem: 세션은 아주 좋지만 SUP , 한 시간 후에는 두통, 입 마름, 피부가 타는 듯한 느낌이 생깁니다. 물이 시원하게 해주기 때문에 탈수와 햇볕에 타는 증상이 몰래 찾아옵니다.
  explanation: 물에 반사되는 빛은 노출을 최대 UV 40%까지 강화시킵니다. 물과 바람의 냉각 효과가 햇볕에 타는 것을 가려주다가 너무 늦게 만듭니다. 노를 젓는 과정에서 땀이 나면 체액 손실이 증가하고, 물을 다시 채울 곳이 없는 경우가 많습니다. 탈수는 균형과 의사결정을 저해하여 사고 위험을 높입니다.
  solution: 보드의 번지 시스템에 물병이나 수분 주머니를 부착하세요. 목이 마르든 아니든 15분마다 물을 마시세요.+ 출발 30분 전에 SPF 50 자외선 차단제를 발라주세요. 챙이 넓은 모자, 스트랩이 달린 편광 선글라스, UPF 50+ 래시 가드를 착용하세요. 자외선 차단제는 2시간마다 다시 발라주세요.
  recommendation: 앞쪽 D링에 수분 공급용 블래더를 착용하세요 Aquafarer SUP. UPF 50+ 래시 가드를 착용하세요PFD. 땀과 물에도 잘 붙는 방수 자외선 차단제를 사용하세요.
  faq:
    - q: 여행 중에 물을 얼마나 가져가야 SUP 할까요?
      a: 최소 1시간당 1리터. 2시간 세션이라면 2리터를 가져가세요. 더운 날씨에는 더 많이 가져가세요. 수분 보충 방광이 가장 효과적입니다.
    - q: 어떤 종류의 자외선 차단제가 가장 좋SUP을까요?
      a: 방수, SPF 50+ 광범위 스펙트럼. 광물 자외선 차단제(산화아연, 이산화티타늄)는 산호초에 안전하며 더 오래 지속됩니다.
    - q: 물이 정말 반사되나요UV?
      a: 네 — 물은 방사선의 최대 40%를 반사하는데 UV , 이는 UV 위와 아래에서 모두 반사된다는 뜻입니다. 이로 인해 화상 위험이 크게 증가합니다.
    - q: 발진 방지 때문에 햇볕에 타도 되나요?
      a: 표준 래시 가드는 최소한 UV 의 보호만 제공합니다(약 UPF 10-20).+ 완전한 보호를 위해서는 UPF 50 등급 의류를 찾아보세요.
