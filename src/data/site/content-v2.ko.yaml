  title: 'Aquafarer ZB-MT350: 다목적 멀티툴 리뷰'
  description: Aquafarer ZB-MT350 멀티툴 리뷰 — 수상 스포츠 애호가들을 위한 견고한 올인원 도구입니다. 이동 중 수리와 조정에 완벽합니다.
