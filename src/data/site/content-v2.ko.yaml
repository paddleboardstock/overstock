- slug: wetsuit-thickness-guide
  category: problem
  type: buying-guide
  title: '3mm 웻수트 vs 5mm 웻수트: 대부분의 초보자가 찬물에서 실수하는 점들'
  description: 세션 중에 얼거나 해변에서 과열되는 것을 멈추세요. 3mm와 5mm 웻수트의 진짜 차이는 온도 차트, 유연성의 절충, 그리고 차가운 물 서핑에 실제로 효과적인 방법입니다.
  definition: 웻수트는 피부에 얇은 물층을 가두는 네오프렌 의류로, 체온이 이를 데워 단열을 돕습니다. 두께(3mm, 5mm)는 수트가 견딜 수 있는 온도 범위를 결정하며, 두꺼울수록 따뜻하지만 유연성은 떨어집니다.
  tldr: 웻수트 두께는 보온성과 유연성을 직접 결정합니다. 16°C 이상의 물에는 3mm, 8°C에서 16°C 사이의 물에는 5mm를 사용하세요. 두꺼운 수트는 움직임을 제한하지만 더 오래 따뜻하게 유지하세요 — 브랜드보다 항상 핏을 우선시하세요.
  problem: 온라인 매장을 열거나 서핑샵에 들어가면 3/2, 4/3, 5/4, 5mm 풀수트라고 적힌 웻수트를 볼 수 있습니다. 그 숫자들은 큰 의미가 없지만, 잘못된 두께가 있으면 세션 중 얼거나 해변에서 과열되고 땀을 흘리는 것을 의미합니다.
  explanation: 웻수트는 피부와 네오프렌 사이에 얇은 물층을 가두는 방식으로 작동합니다; 몸이 그 물을 데워 단열을 만듭니다. 두꺼운 네오프렌은 더 많은 물을 가두지만 유연성과 부력을 제한합니다. 3mm 수트(보통 3/2 길이, 더 가늘면 팔이 가늘어짐)는 온화한 환경에 적합하며, 5mm(5/4/3 또는 풀 5mm)는 차가운 물에 적합합니다. 가슴 지퍼 입구는 뒷지퍼보다 밀폐성이 더 좋고 플러싱을 줄입니다. 솔기 구조 — 접착 및 블라인드 스티치(GBS) — 는 누수 수트와 따뜻한 수트의 차이입니다.
  solution: 지역 수온에 맞춰 두께를 맞추고 오차 범위는 5°C로 설정하세요. 온대 기후라면 3/2mm 두께를 구매하세요. 찬물에는 5/4/3mm 두께를 구매하세요. 부츠, 장갑, 후드를 추가해 5°C 더 내려가세요. 구매 전에 수트를 입어보거나 넉넉한 반품 정책이 있는 브랜드를 선택하세요.
  recommendation: Aquafarer 5/4/3mm 사이즈의 웻수트 프로는 대부분의 차가운 물 서퍼에게 이상적이며, GBS 솔기와 보온 안감을 제공합니다. 20°C 이상의 따뜻한 물에서 서핑한다면, 가슴 지퍼가 달린 3/2mm 서핑이 더 나은 선택입니다.
  faq:
    - q: 5mm 웻수트가 필요한 수온은 어느 정도인가요?
      a: 8°C에서 14°C 사이의 수온은 5mm 슈트가 필요합니다. 8°C 이하에서는 6/5/4mm 후드 슈트가 필요합니다. 14°C에서 18°C 사이에서는 4/3mm 슈트가 대부분 사람들에게 잘 맞습니다.
    - q: 겨울에 3mm 웻수트를 입어도 되나요?
      a: 온화한 겨울 기후, 수위가 16°C 이상으로 유지되는 경우에만 해당됩니다. 진짜 겨울 서핑을 위해서는 5mm 또는 5/4/3mm가 필요합니다. 부츠, 장갑, 후드를 착용하면 몸통이 두꺼워지지 않고도 비슷한 보온성을 제공합니다.
    - q: 웻수트는 얼마나 꽉 끼는 게 좋을까요?
      a: 꽉 끼지만 답답하지 않아요. 공기 주머니나 느슨한 네오프렌은 없어야 해요. 허리 아래쪽에서 피부와 수트 사이에 손가락을 넣을 수 있다면 너무 헐렁한 거예요. 호흡이 어렵거나 움직임이 심하게 제한된다면 사이즈를 크게 올려주세요.
    - q: 비싼 웻수트가 더 따뜻하게 해줄까?
      a: 가격이 높으면 보통 네오프렌(석회암 기반 대 석유), 더 나은 솔기 구조(GBS 대신 접착제 소재), 그리고 더 나은 유연성을 의미합니다. 이 요소들은 보온과 내구성에 직접적인 영향을 미치지만, 착용감이 맞을 때만 가능합니다.
