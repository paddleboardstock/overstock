    - q: 두 곳 모두 낚시할 수 있나요?
      a: 네, 두 것 모두 낚시 구성이 있습니다. 카약은 더 많은 장비 수납 공간을 제공합니다.SUPs 캐스팅 시야도 더 좋습니다.
