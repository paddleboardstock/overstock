- slug: sup-navigation-guide
  category: guide
  type: safety
  title: 'SUP 내비게이션: 항로를 유지하고 길을 찾기'
  description: 패들러를 위한 기본 항법 SUP 기술 — 해도 읽기, 지형지물 사용, 부표 시스템 이해, 안전한 노 젓기 위한 GPS와 나침반 사용.
  definition: SUP 항법은 랜드마크, 해도, GPS, 바람과 조류를 인지하여 안전하게 이동하고 출발지로 돌아가는 것을 포함합니다.
  tldr: 노를 정확히 할 때는 항상 수평선에 있는 랜드마크를 선택하세요. 몇 분마다 점검하여 표류를 보정하세요. 방수 케이스에 있는 휴대폰 GPS 앱을 사용하세요. 기본 나침반 항법을 배우세요. 측면 부표 시스템(빨강-우측-복귀)을 이해하세요. 육지에 있는 사람과 플로트 플랜을 작성하세요.
  problem: 개방된 바다에서 노를 저어 나가면 돌아서면 해안선이 완전히 달라져 보입니다. 항해 기술이 없으면 방향을 잃고 잘못된 방향으로 노를 저을 수 있습니다.
  explanation: 항해는 물가에 SUP 가까워서 시각적 기준에 의존합니다. 출발 지점 뒤에 독특한 랜드마크(건물, 나무, 절벽)를 정하세요. 그것을 백 베어링으로 사용해 돌아오세요. 바람과 조류가 경로를 이탈시키며 계속 수정하세요. 장거리 여행은 GPS 앱이나 시계를 사용하세요. 해안선이 육지와 물에서 다르게 보인다는 점을 이해하세요.
  solution: '출발 전에: 출발 지점 뒤 거리 2-3개의 랜드마크를 식별하세요. 비행기 모드에서 GPS 앱(구글 지도, Gaia GPS)을 사용해 배터리를 절약하세요. 바람과 조수 방향을 알고 — 먼저 바람을 타고 올라가세요. 개방 수역 건널 때는 나침반 방위를 사용하세요.'
  recommendation: GPS 백업용으로 방수 케이스에 휴대폰을 보관하세요. 새로운 장소로 나가기 전에 익숙한 물역에서 지형물 탐색 연습을 하세요. 라이프 베스트 프로에는 휴대폰을 넣을 수 있는 주머니가 있습니다.
  faq:
    - q: SUP 내비게이션에 가장 좋은 랜드마크는 무엇인가요?
      a: 물탑, 높은 건물, 독특한 나무, 눈에 띄는 절벽 등 독특하고 영구적인 특징들. 움직이는 배나 깃발은 피하세요.
    - q: 안개 속에서 어떻게 길을 찾나요?
      a: 안개 속에서 노를 저어 나가지 마세요. 안개에 걸렸을 때는 GPS나 나침반을 사용해 항해하세요. 30초마다 휘파람을 불어야 합니다. 해안 근처에 머무르세요.
    - q: 해양 해도가 필요한SUP가요?
      a: 해안 노 젓기에는 간단한 차트가 위험 요소, 수심, 항로 경로를 식별하는 데 도움을 줍니다. 많은 앱에서 이 정보를 제공합니다.
    - q: 배를 어떻게 피해야 하나요?
      a: 수로에서 떨어진 얕은 물에 머무르세요. 밝은 색상을 입으세요. 수로를 빠르고 90도 각도로 건너세요. 보트 조작자와 눈을 마주치세요.
