  description: 패들에 대한 완전한 가이드 SUP — 길이, 재질(알루미늄, 유리섬유, 탄소), 블레이드 모양, 그리고 패들 선택이 패들링 경험에 미치는 영향.
  definition: SUP 패들은 샤프트(알루미늄, 유리섬유, 탄소)와 블레이드(다이헤드랄, 스쿱, 플랫)로 구성됩니다. 일반적인 패들링을 위해 길이는 키보다 8-10인치 높여야 합니다.
  tldr: '패들 길이: 전면 사용 시 키보다 8-10인치, 서핑 시 6-8인치, 투어링용 10-12인치. 재료: 알루미늄(저렴하고 무겁고), 유리섬유(중간 범위, 플렉스 좋음), 카본(가볍고 단단하며, 비쌉니다). 블레이드 형태: 다이헤드럴(안정적인 트래킹), 스쿱(파워), 평평(다용도). 조절 가능한 패들은 초보자에게 좋습니다.'
  problem: 대부분의 iSUP에 포함된 패들은 작동하지만 무겁고 비효율적입니다. 업그레이드를 하면 패들링 효율성과 즐거움이 향상되지만, 선택지가 혼란스러워집니다.
  explanation: '패들 길이는 스트로크 효율에 영향을 미칩니다 — 너무 짧으면 몸을 숙여야 하고, 너무 길면 어깨 피로가 발생합니다. 재질이 무게를 결정합니다: 탄소 패들은 18-24온스, 알루미늄은 28-36온스입니다. 블레이드 크기도 출력에 영향을 미칩니다: 더 큰 블레이드(100+ sq in)는 스트로크당 추진력이 더 크지만 피로가 더 빨라집니다. 다이헤드럴 블레이드는 직선으로 움직이며; 스쿱 블레이드는 더 많은 캐치를 제공합니다.'
  solution: '적절한 길이를 원한다면: 패들 수직으로 서 있고, 팔을 위로 뻗어 — 패들 손잡이가 손목에 닿을 것입니다. 소재는 중간 무게 업그레이드로 유리섬유로 시작하세요. 블레이드용으로는 일반 패들링에 다이헤드럴을 선택하세요. 활동용으로는: 투어링 패들에 더 작은 블레이드를 사용하며; 서핑 패들은 짧고 블레이드가 넓습니다.'
  recommendation: Aquafarer 28온스의 카본 패들은 자주 패들러를 즐기기에 최고의 업그레이드입니다. 포함된 조절 가능한 3피스 알루미늄 패들은 초보자와 여행용으로 적합합니다.
  faq:
    - q: SUP 패들 길이는 얼마나 되어야 하나요?
      a: 키를 인치로 재고, 전면 패들링을 위해 8-10을 추가하세요. 서핑은 6-8인치를 추가하세요. 투어링은 10-12인치를 추가하세요.
    - q: 카본 패들은 그만한 가치가 있을까요?
      a: 네, 일반 패들러에게는 무게 감소 효과가 긴 세션 동안 피로를 크게 줄여줍니다. 가끔 사용할 때는 유리섬유가 가성비가 좋습니다.
    - q: 조절 가능한 패들이란 무엇인가요?
      a: 길이 조절이 가능한 2개 또는 3개 부품 패들로, 사용자 간 공유나 다양한 활동에 맞게 조정하기에 이상적입니다.
    - q: 내 패들을 어떻게 관리하나요?
      a: 소금물 사용 후에는 신선한 물로 씻어내세요. 그 위를 차로 밟거나 직접적인 열에 보관하는 것은 피하세요. 페룰(조인트)에 모래가 있는지 확인하세요.
