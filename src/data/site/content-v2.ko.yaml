  title: '팽창식 SUP 수리: 구멍, 누수, 밸브 문제 수리'
  description: DIY 팽창식 SUP 수리 가이드. 포함된 수리 키트를 사용해 느린 누수를 찾고, 구멍을 수리하며, 밸브를 교체하고, 데크 패드 박리 문제를 해결하는 방법.
  definition: 인플레이터블 SUP 수리는 비눗물로 공기 누출을 찾아내고, 손상된 부위를 청소 및 거칠게 다듬으며, PVC 접착제와 패치를 붙이고 압력 하에서 경화하는 작업을 포함합니다.
  tldr: 비눗물로 누수를 찾아보세요. 구멍 부위 주변을 사포로 깨끗이 닦고 거칠게 다듬으세요. PVC 패치와 판재 모두에 접착제를 발라주고, 5분간 기다린 후 단단히 눌러서 24시간 동안 경화시키세요. 밸브 누수는 먼저 O-링을 확인하세요. 1/4인치 미만의 작은 구멍은 DIY 수리로 간단합니다.
  problem: 공기를 부풀렸 SUP 지만 아침이 되면 압력이 떨어집니다. 수리 지식이 없으면 단순한 펑크 때문에 비싼 교체 비용을 맞이하게 됩니다.
  explanation: '대부분의 인플레이터블은 SUPs drop-stitch 외곽층이 있는 코어를 사용합니다 PVC . 외부에 구멍이 뚫리면 PVC 천천히 누수가 발생합니다. 표준 수리: 청소, 샌딩, PVC호환 접착제 바르기, 무게 아래에 패치를 눌렀습니다. 밸브 누수는 패널 구멍보다 더 흔합니다 — O-링이 마르거나 이물질이 밀봉을 방해합니다.'
  solution: 보드를 최대치로 부풀리고 PSI 쉬익 소리를 들어보세요. 특히 이음새와 밸브 주변에 비눗물을 체계적으로 뿌리세요. 기포가 나는 부분을 표시하세요. 공기를 빼고, 알코올로 청소한 뒤, 80방 사포로 사포를 뿌린 후 PVC 접착제를 바르고 끈적거릴 때까지 기다렸다가 단단히 눌러서 24시간 동안 무게를 감추세요.
  recommendation: Aquafarer 모든 보드에 포함된 수리 키트를 사용 Aquafarer 하세요. 여행 중에는 항상 수리 키트를 가지고 다니세요. 밸브 문제는 지원팀에 연락 Aquafarer 하세요. 큰 찢어짐이나 이음새 분리는 전문가의 수리를 권장합니다.
  faq:
    - q: 내 팽창식 큰 찢어진 부분을 수리할 수 SUP있을까요?
      a: 1인치 이상의 찢어짐은 전문가의 수리나 양쪽 모두 패치가 필요할 수 있습니다. 레일을 따라 이음새 사이 부분은 현장에서 신뢰할 수 없이 수리할 수 없습니다.
    - q: 수리 패치는 얼마나 오래 지속되나요?
      a: 적절한 수리와 올바른 기술로 인해 보드 수명 동안 지속됩니다. 부적절한 청소로 인한 접착 부진은 향후 고장으로 이어집니다.
    - q: 누수 밸브를 수리할 수 있나요?
      a: 대부분 그렇습니다. 밸브 코어를 분리하고, O링을 점검한 뒤 청소하거나 교체한 뒤 실리콘 윤활제를 바른 후 다시 설치하세요.
    - q: 누수를 찾지 못하면 어떻게 하죠?
      a: 욕조나 수영장에서 차례로 구역을 가득 부풀리고 잠기세요 PSI . 찾기 어려운 작은 누수는 온도 문제일 수 있습니다.
