- slug: sup-leash-guide
  category: guide
  type: buying-guide
  title: 'SUP 목줄 가이드: 직선 목줄과 코일 목줄 설명'
  description: SUP 목줄 완전 가이드 — 직선 vs 코일, 발목 대 종아리, 빠른 릴리스 옵션, 그리고 패들링 환경에 맞는 목줄 선택 방법.
  definition: SUP 목줄은 패들러를 보드에 연결해 분리를 방지하는 끈입니다. 종류로는 서핑과 강을 위한 직선 목줄과 평면 수역용 코일 목줄이 있습니다.
  tldr: 코일 리쉬는 평탄한 물과 피트니스 패들링에 가장 적합하며, 보드에 닿거나 물 밖에 잘 닿지 않습니다. 직선 리쉬는 SUP 서핑과 강에 적합하며, 더 자유롭고 걸리지 않습니다. 편안함을 위해 발목보다 종아리 부착이 선호됩니다. 빠른 해제 리쉬는 강 패들링에서 갇히는 것을 방지하기 위해 중요합니다.
  problem: 목줄을 구입했 SUP 지만 본인의 패들링 스타일에 맞는 종류인지 확신이 없을 수도 있습니다. 잘못된 목줄은 가장 필요할 때 끌리거나 걸리거나 고장 날 수 있습니다.
  explanation: 직선 리쉬는 보드 뒤에 걸리는 단순한 나일론 또는 폴리우레탄 코드입니다. 이 끈은 지느러미에 걸리지 않아 서핑에서 잘 작동합니다. 코일 리드는 긴장이 없을 때 수축하는 나선형 코드로, 노를 젓을 때는 데크에 감겨 있고 넘어질 때 늘어납니다. 평지에서는 목줄을 물에 띄워 저항을 줄여줍니다.
  solution: 평면, 피트니스, 투어링에는 코일드 리쉬를 선택SUP하세요. 저항이 줄어들어 속도를 유지하고 수중 물체에 걸리는 것을 방지합니다. 서핑과 강 노 젓기에는 직선 리드를 선택 SUP 하세요. 직선 리드는 지느러미나 장애물에 걸릴 가능성이 적습니다.
  recommendation: Aquafarer SUP 패키지에는 보드의 용도에 맞는 적절한 리드 종류가 포함되어 있습니다. SUP 익스플로러 11 패키지의 코일드 리드는 전천후 패들링에 매우 적합합니다.
  faq:
    - q: 목줄을 발목에 걸어야 할까요, 아니면 종아리에 걸어야 할까요?
      a: 종아리 부착이 선호되는 이유는 SUP 노를 젓을 때 목줄이 물에 닿지 않게 하고 걸을 때 걸려 넘어질 위험을 줄여줍니다.
    - q: 목줄은 얼마나 길 SUP 어야 하나요?
      a: 평면 물에서는 8-10피트, 파도에서는 6-8피트 길이입니다. 짧은 줄은 저항을 줄이지만, 보드 위에서의 자유로운 움직임을 제한합니다.
    - q: 강에서 빠른 해제 목줄이 필요한가요?
      a: 네 — 강에서는 SUP 즉시 분리할 수 있는 빠른 해제 가능한 목줄이나 벨트가 필요하며, 이를 통해 체에 갇히지 않도록 합니다.
    - q: 서핑 리쉬를 써도 되나요SUP?
      a: 서핑용 리쉬는 더 짧고 얇습니다. SUP 서핑에는 효과적이지만, 긴 코일 리드가 더 나은 평면 노 젓기에는 적합하지 않습니다.
