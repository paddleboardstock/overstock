  tldr: SUP 시간당 400-700칼로리를 소모합니다. 1시간 SUP 세션은 코어, 다리, 등, 어깨, 팔을 모두 사용합니다. 인터벌 패들링(스프린트 + 회복)은 유산소 능력을 극대화합니다. 보드 위에서 요가 자세를 하면 균형과 유연성이 향상됩니다. SUP보드 위에서 스쿼트와 런지 같은 특정 근력 동작을 추가하세요.
  problem: 헬스장 운동은 지루해졌고, 재미있으면서도 체력을 키우는 야외 활동을 원할 것입니다.SUP 모험과 진정한 전신 단련을 결합하세요.
  explanation: 패들링은 배배근, 삼각근, 승모근, 코어 근육을 회전시키기 위해 활성화합니다. 움직이는 플랫폼 위에 서 있으면 발목, 무릎, 엉덩이의 안정근이 지속적으로 작동하게 됩니다. 중간 강도의 연속 패들링은 유산소 체력을 제공합니다.
