- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: 서핑할 때 입을 옷 (5/4 사이즈가 필요할 때 보드숏만 입고 나타나지 마세요)
  description: 무엇을 입어야 할지 추측하지 마세요. 서핑 복장은 기온이 아니라 수온입니다. 열대 발진 방지부터 겨울용 5/4/3mm 전체 세트까지 완전한 레이어링 가이드.
  definition: 서핑 복장은 따뜻한 물에서는 보드숏과 래쉬가드부터 차가운 물에서는 부츠와 후드를 입은 5/4/3mm 웻수트까지 다양합니다. 필요한 것은 공기 온도가 아니라 수온입니다.
  tldr: 서핑할 때 입는 옷은 공기 온도가 아니라 전적으로 수온에 따라 달라집니다. 래시 가드와 보드숏은 22°C 이상에서 잘 작동하고, 스프링 수트는 18-22°C, 3/2mm 풀 수트는 14-18°C, 부츠와 함께 14°C 이하에는 5/4/3mm가 필요합니다. 항상 UV 보호구를 착용하고 목줄과 임팩트 조끼를 고려하세요.
  problem: 해변에 도착했을 때 래쉬가드가 충분한 건지, 아니면 완전한 웻수트가 필요한지 전혀 알 수 없습니다. 기온은 따뜻하지만 물은 차갑고, 물은 괜찮지만 바람은 얼어붙을 정도입니다. 옷을 잘못 입으면 세션이 망가집니다.
  explanation: 서핑복은 단열, 보호, 마모 방지 세 가지 목적을 가지고 있습니다 UV . 네오프렌 웻수트는 두께와 커버리지로 평가되며, 스프링 수트(짧은 팔이나 다리)는 경계선에 적합하고, 풀 수트는 찬물에 적합합니다. 래시 가드는 보드 발진과 햇볕으로부터 보호하지만 열 효과는 없습니다. 부츠, 장갑, 후드는 액세서리가 아니라 12°C 이하의 찬물 서핑에 필수적인 장비입니다.
  solution: '출항 전에 지역 부표나 생수 온도 보고서를 확인하세요. 가장 추운 환경에 맞춘 키트를 만들어 주세요: 여름에는 발진방지와 반바지, 봄과 가을에는 3/2mm 풀수트, 겨울에는 부츠와 후드가 포함된 5/4/3mm 수트를 착용하세요. 항상 목줄을 추가하고 안전을 위해 부력 조끼를 고려하세요.'
  recommendation: 먼저 3/2mm 풀 수트를 구입하세요 — 가장 넓은 조건을 커버할 수 있습니다. 겨울에 서핑할 계획이라면 5/4/3mm 수트와 부츠를 추가하세요. Aquafarer 열 안감 브리지가 있는 웻수트 프로는 두 온도 범위 모두를 효과적으로 지원합니다.
  faq:
    - q: 보드숏만 입고 서핑해도 돼?
      a: 네, 24°C 이상의 열대 바다에서 가능합니다. 패들 때 가슴과 팔이 쓸리는 것을 막기 위해 래쉬가드를 사용하는 것이 좋습니다. 보드에 왁스나 트랙션 패드를 붙이면 슈트 그립이 부족한 부분을 보완할 수 있습니다.
    - q: 서핑 부츠가 필요할까요?
      a: 수온이 14°C 이하로 떨어지면 부츠는 저림을 예방하고 바위나 암초에 베인 발을 보호해 줍니다. 또한 보드에 접지력을 더해줍니다. 북부 기후의 대부분 서퍼들은 11월부터 3월까지 부츠를 신습니다.
    - q: 스프링슈트란 무엇인가요?
      a: 스프링 수트는 18°C에서 22°C 사이의 물에 맞게 설계된 짧은 팔 또는 짧은 다리 웻수트(또는 둘 다)입니다. 래쉬가드보다 더 보온하지만 풀 수트보다는 덮개가 적습니다.
    - q: 서핑할 때 구명조끼를 입어야 할까요?
      a: 전통적인 구명조끼는 아니지만, 충격 조끼나 부력 보조 장비가 거친 조건이나 수영이 약한 사람에게는 도움이 될 수 있습니다.Aquafarer 구명조끼는 카약용으로 설계 SUP 되었지만, 서핑 초보자에게 부력 자신감을 더해줄 수 있습니다.
