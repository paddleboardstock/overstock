  title: 'SUP 닻 가이드: 낚시나 사진 촬영 시 제자리에 머무르세요'
  description: SUP 앵커링 완전 가이드 — 앵커 종류(버섯, 폴딩, 스테이크), 앵커 트롤리 세팅, 배치 방법, 그리고 위치를 유지하기 위한 안전 사항.
  definition: SUP 앵커는 바람과 조류에 맞서 보드를 고정하는 로프에 달린 무게추입니다. 일반적인 유형으로는 버섯 앵커, 접이식 앵커, 그리고 스테이킹아웃 폴이 있습니다.
  tldr: 진흙이나 모래 바닥에는 버섯 앵커(1.5-3파운드), 바위 바닥에는 접이식 앵커, 부드러운 바닥이 있는 얕은 물에는 스테이킹 폴을 사용하세요. 잔잔한 상태에서는 앵커 무게가 1.5-3파운드, 바람과 조류에는 3-5파운드가 좋습니다. 항상 앵커 트롤리를 사용해 위치를 조정하고 언제 풀어야 하는지 확인하세요.
  problem: 완벽한 낚시터를 찾았지만 바람과 조류가 몇 분마다 위치를 벗어나게 만듭니다. 닻이 없으면 SUP 낚시와 사진 촬영은 끊임없이 위치를 바꾸는 답답한 작업입니다.
  explanation: 앵커는 바닥을 가로질러 끌면서 걸리는 방식으로 작동합니다. 버섯 앵커는 부드러운 바닥에 파묻혀 모래와 진흙 속에서도 잘 고정됩니다. 접이식 앵커는 단단하거나 바위가 많은 바닥을 파고드는 플루크(플루크)가 있습니다. 스테이킹아웃 폴은 얕은 물에서 바닥을 직접 밀어 넣어 작동합니다.
  solution: 앵커 부착 지점을 조정하기 위해 보드 한쪽에 슬라이딩 링이 달린 닻 트롤리 시스템을 설치하세요. 앵커에 50-75피트 길이의 로프를 연결하세요. 원하는 위치의 바람 위쪽이나 상류에서 배치하세요. 비상 상황에서는 빠른 해제 시스템을 사용해 분리하세요. 강한 조류나 앵커를 쉽게 회수할 수 없는 곳에서는 절대 닻을 고정하지 마세요.
  recommendation: 3파운드 접이식 닻에 50피트 길이의 닻이 대부분의 SUP 낚시 조건에서 적합합니다. Aquafarer SUP 익스플로러 11의 D-링을 이용해 앵커 트롤리 시스템을 추가하세요.
  faq:
    - q: 어떤 크기의 앵커가 필요SUP한가요?
      a: 잔잔한 호수와 느린 강에는 1.5-3파운드. 바람이나 조류가 있는 해안 지역에는 3-5파운드. 큰 닻은 회수하기 어렵습니다.
    - q: 얼마나 많은 앵커 라인이 필요할까요?
      a: 5:1 스코프(수심 1피트당 라인 5피트)가 표준입니다. 수심 10피트에서는 라인 50피트를 사용합니다.
    - q: 앵커링이 위험한가SUP요?
      a: 보드가 전복될 만큼 강한 바람에 고정하거나 고정해야 합니다. 즉시 분리할 수 있는 퀵 릴리즈 시스템을 항상 사용하세요.
    - q: 어떤 물에도 닻을 내릴 수 있나요?
      a: 지역 규정을 확인하세요. 일부 지역은 해초나 해양 서식지를 보호하기 위해 닻을 내리는 것을 제한합니다. 산호초에는 절대 닻을 내리지 마세요.
