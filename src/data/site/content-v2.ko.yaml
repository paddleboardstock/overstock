- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: 서핑 예절 규칙 (모두가 피하는 사람이 되지 않는 법)
  description: 라인업에는 규칙이 있고 아무도 그것을 적지 않습니다. 우선권, 왜 스네이킹이 혼나게 하는지, 사과하는 방법, 그리고 모든 지역 서퍼들이 짜증나게 하는 초보자 실수를 배우세요.
  definition: 서핑 예절은 충돌을 방지하고 파도를 공정하게 나누기 위한 불문율 행동 강령입니다. 핵심 규칙은 파도가 부서지는 정상에 가장 가까운 서퍼가 우선권을 가진다는 것입니다.
  tldr: 파도 꼭대기에 가장 가까운 서퍼가 우선 통행권을 가집니다. 누군가에게 들이닥치지 말고, 스네이크(파도를 피하며 파도를 빼앗으려고 노를 젓는 것)하지 말고, 실수하면 항상 사과하세요. 라인업 주위를 넓게 노 젓고, 보드를 꼭 잡고, 친근하게 대하세요 — 존중은 존중을 얻습니다.
  problem: 붐비는 줄에 노를 저어 나가자 즉시 긴장감을 느낀다. 서퍼들은 옆눈질을 하고, 누군가가 소리치며, 내가 뭘 잘못했는지 모르겠다. 서핑의 사회적 측면이 파도 자체보다 더 위압적으로 느껴진다.
  explanation: '서핑 예절은 충돌을 방지하고 파도를 공정하게 나누기 위해 존재합니다. 기본 규칙은 우선권입니다: 파도가 처음 부서지는 정상에 가장 가까운 서퍼가 우선권을 가집니다. 같은 파도를 향해 더 안쪽에서 노를 젓는 사람은 반드시 빠져나와야 합니다. 스네이킹 — 다른 서퍼를 피해 우선권을 빼앗는 행위 — 는 최악의 위반으로 간주됩니다. 우선순위 외에도 라인업은 소음(최소한으로 소리 지름), 보드 컨트롤(보드를 다른 사람 근처에 두지 말 것), 친근함(간단한 고개 끄덕임 하나가 큰 효과)에 대한 기대를 가지고 있습니다.'
  solution: 노를 젓기 전에 10분간 라인업을 지켜보세요. 누가 가장 많은 파도를 잡는지 파악하세요 — 그런 서퍼들을 존중하고 피해야 합니다. 배우는 중이라면 안쪽(급류 구역)에 머무르세요. 라인업을 통과하지 않고 넓게 노를 저으세요. 파도를 잡을 때는 양쪽을 살피고 나오는 사람이 더 깊지 않은지 확인하세요.
  recommendation: 처음 몇 세션은 초보자 친화적인 휴식 공간에서 흩어진 인파가 있는 곳에서 보내세요. 바쁜 줄을 시도하기 전에 우선순위를 읽는 법을 배우세요. 누군가를 찾아가면 즉시 사과하고 노를 저어 다가가세요 — 대부분의 서퍼들은 정직한 실수를 존중합니다.
  faq:
    - q: 무엇이 드롭 인가인가요?
      a: 드롭 인은 이미 다른 서퍼가 우선권을 가진 파도를 노 젓고 타는 것을 의미합니다. 이는 위험하고 무례합니다. 정상에 가장 가까운 서퍼가 파도를 소유합니다; 다른 사람은 파도를 빼야 합니다.
    - q: 스네이킹이란 무엇인가요?
      a: 스네이킹은 이미 파도 위치에 있는 다른 서퍼를 피해 노를 저어 정상에 더 가까이 다가가는 것입니다. 이는 매우 무례한 예절로 간주되어 충돌로 이어질 수 있습니다.
    - q: 초보자도 붐비는 난이도에서 서핑할 수 있나요?
      a: 네, 하지만 정상에서 멀리 떨어진 급류 구역에 머무르세요. 파도를 꾸준히 잡고 방향을 조절할 수 있을 때까지는 메인 이륙 구역으로 노를 저어서 들어가지 마세요. 복잡한 줄은 안전하게 항해하려면 경험이 필요합니다.
    - q: 물속에서 어떻게 사과하나요?
      a: 간단한 손 흔들기, 미소, 그리고 "내 실수" 또는 "미안해"라는 말이 도움이 됩니다. 실수를 인정하고 그 사람에게서 멀어지세요. 서퍼들은 특히 당신이 명확히 배우고 있다면 솔직한 실수에 대해 대체로 관대합니다.
    - q: 누군가 갑자기 찾아오면 어떻게 해야 하나요?
      a: 명확한 드롭인 경우에는 "손 흔들기"나 "헤이"라고 외쳐 경고하세요. 실수로 들키고 사과하면 그냥 넘어가세요. 누군가 반복해서 들이닥치면 노를 저어 다가가 정중하게 우선순위를 설명하세요. 충돌을 피하세요.
