  recommendation: Aquafarer SUP 포함된 배낭에 든 익스플로러 11은 완벽한 여행 동반자입니다. 수백 번의 비행을 견뎌냈습니다. PFD가 필요한 목적지에서는 라이프 베스트 클래식과 함께 착용하세요.
  faq:
    - q: 항공사에서 수하물에 대해 추가 요금을 받나요 SUP ?
      a: 많은 항공사가 23-32kg 미만이면 표준 위탁 수하물로 취급합니다. 일부는 초과 크기 요금을 부과하기도 합니다. 항공사의 스포츠 장비 정책을 확인하세요.
    - q: SUP 기내 반입 수하물로 가져가도 되나요?
      a: 아니요, 배낭은 기내 반입 반입 용량 제한을 초과합니다. 항상 부치세요. 펌프와 작은 액세서리는 기내 반입 수하물에 꼭 넣으세요.
    - q: 비행 중 손상을 어떻게 예방할 수 있나요?
      a: 보드를 가방에 느슨하게 넣으세요. 옷으로 감싼 지느러미와 단단한 물건을 중앙에 두세요. 가방에 '깨지기 쉬워'라고 표시하세요.
    - q: 최고의 SUP 여행지는 어디인가요?
      a: '평수: 바하칼리포니아 타호 호수. 해안: 마우이, 알가르브, 콘월. 내륙: 캐나다 호수, 이탈리아 호수.'
