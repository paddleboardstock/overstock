badge: Proof & Results
heading: ראיות
description: מחקרי מקרה אמיתיים, תעודות, נתוני מבחן ותמונות פריסה שמדגימות את יכולת הייצור שלנו ואיכות המוצר.
case_studies:
  - id: retail-private-label
    client: קמעונאי חוצות אירופי
    product: קו מותג פרטי SUP
    industry: קמעונאות
    challenge: קמעונאי חוצות אירופי נזקק לקו מותג פרטי SUP עם גרפיקות דק ייחודיות, PVC ידידותי לסביבה ואריזות מוכנות לקמעונאות — והכל נמסר תוך 60 יום.
    solution: פותחו קבצי הדפסה דיגיטליים מותאמים אישית, נרכשו PVC תואמים ל-REACH ונדחס התהליך הדגמתי מ-3 סבבים ל-1 על ידי מיקום צוות העיצוב במפעל שלנו בצינגדאו.
    result: 55 ימים מהזמנת רכש חתומה עד FOB. 2,400 יחידות ב-4 SKUs. נעשתה הזמנת חזרה לפני שהמיכל הראשון הגיע.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - קמעונאות
      - SUP
    outcome_metrics:
      - label: זמן אספקה
        value: 55 ימים
      - label: יחידות
        value: 2,400
      - label: SKUs
        value: '4'
  - id: startup-drop-stitch-kayak
    client: סטארטאפ ספורט ימי בארה"ב
    product: Drop-Stitch קאיאק
    industry: סטארטאפ / קמעונאות
    challenge: סטארטאפ ספורט ימי אמריקאי נזקק לקאיאק drop-stitch בעל ביצועים גבוהים עם צורת גוף מותאמת אישית, אריזות משותפות למותגים ותעודת BSCI למיקום בקמעונאות.
    solution: מותאם תבנית קאיאק קיימת drop-stitch עם פרופיל רוקר מותאם, פותחו גרפיקות האריזות המשותפות למותגים, והוגשה תיעוד ביקורת BSCI מלא.
    result: נרשם בהצלחה ב-3 רשתות חוצות מובילות בארה"ב. 5,000+ יחידות בשנה הראשונה עם שיעור מכירה של 98%.
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
    tags:
      - OEM
      - קאיאק
      - BSCI
    outcome_metrics:
      - label: רשתות קמעונאיות
        value: '3'
      - label: יחידות בשנה הראשונה
        value: 5,000+
      - label: שיעור מכירה
        value: 98%
  - id: australian-rib-distributor
    client: מפיץ אוסטרלי
    product: טווח RIB מוסמך CE
    industry: ימי / ממשלתי
    challenge: מפיץ אוסטרלי דרש טווח RIB מוסמך CE עם צבעי צינור מותאמים אישית, אפשרות שדרוג Hypalon ועמידה בתקני אוסטרליה AS 1799.
    solution: הופקו דגמי ייצור מוקדמים עם 4 וריאציות צבע צינור, נרכשו Hypalon CSM מספק יפני ותיאום בדיקות תאימות AS 1799 על ידי צד שלישי.
    result: טווח של 3 דגמים RIB הושק בשוק AU/NZ. לאחר מכן זכתה במכרז ממשלתי ל-12 סירות סיור RIBs.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - ממשל
    outcome_metrics:
      - label: דגמים שהושקו
        value: '3'
      - label: חוזה סירות סיור
        value: 12 יחידות
      - label: עמידה בתקנים
        value: AS 1799
  - id: caribbean-resort-fleet
    client: קבוצת נופש יוקרתית בקריביים
    product: צי אתרי נופש — RIBs, SUP, קיאקים
    industry: אירוח / תיירות
    challenge: קבוצת חמישה אתרי נופש נדרשה לצי מאוחד של ציוד ספורט ימי להשכרה — RIB מכרזים, SUPs, וקיאקים — עם מיתוג עקבי, חומרים עמידים לשמש הטרופית, ותכנית החלפה ל-5 שנים.
    solution: תוכנן חבילת צי של 3 דגמים מותאמים אישית עם UV-מייצב PVC, גרפיקות דק ממותגות לאתר הנופש, ולוח זמנים מסודר למסירה בשלבים. ניתנה הכשרת צוות וערכת חלקי חילוף ייעודית לכל אתר נופש.
    result: 180 יחידות נמסרו ב-5 אתרים. הזמנה חוזרת לשתי נכסים חדשים. הפחתה של 40% בעלות ליחידה לעומת ספקים קודמים.
    image: https://assets.aquafarer.com/images/aquafarer/hero/factory-gate.webp
    tags:
      - OEM
      - SUP
      - קאיאק
      - RIB
      - אירוח
    outcome_metrics:
      - label: יחידות מסופקות
        value: 180
      - label: אתרי נופש
        value: '5'
      - label: צמצום עלויות
        value: 40%
  - id: southeast-asia-search-rescue
    client: סוכנות ימית בדרום-מזרח אסיה
    product: צי סירות סיור והצלה RIB
    industry: ממשל / ביטחון ימי
    challenge: סוכנות ימית ממשלתית דרשה 20 סירות סיור והצלה RIBs עם בד עמיד לאש Hypalon, רצפות מתנקזות עצמית, מעמדי קונסולה משולבים ל-VHF/רדיו, ועמידה בתקני סירות הצלה פרק III SOLAS.
    solution: יוצרו 20 RIBs עם צינורות CSM Hypalon, גופי סירות מאלומיניום בדרגה ימית, עיני גרירה כבדות, וחבילות אורות ניווט מותקנות מראש. צוות בדיקה במפעל פיקח על ניסויי ים. ניתנה חבילת מסמכים מלאה SOLAS.
    result: החוזה נמסר תוך 4 חודשים. הצי הוצב לסיור גבולות, חיפוש והצלה, ותגובה לאסונות ב-3 בסיסים אזוריים.
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-600.webp
    tags:
      - OEM
      - RIB
      - Hypalon
      - ממשל
      - SOLAS
    outcome_metrics:
      - label: Patrol RIBs
        value: '20'
      - label: מסירה
        value: 4 חודשים
      - label: בסיסים
        value: '3'
  - id: european-dtc-ecommerce
    client: מותג ספורט מים אירופי ל-DTC
    product: SUP + קו אביזרים ממותג
    industry: מסחר אלקטרוני / קמעונאות
    challenge: מותג ספורט מים של DTC שגדל במהירות היה זקוק SUP לחבילה שלמה (לוח, משאבה, משוטים, רצועה, תיק) עם אריזה פרימיום המיועדת למימוש מסחר אלקטרוני — ישירות לצרכן דרך DHL/FedEx ללא נזק.
    solution: פיתח קו מוצרים ממותג משותף עם עיצוב ליבה מותאם אישית של EPS, טכנולוגיה קניינית drop-stitch ללחץ גבוה יותר, וקופסאות גלי דו-קירות מוכנות לקמעונאות עם ריפוד הכנסה. אותנטיות ורישום אחריות מבוססות קוד QR משולב.
    result: קו 3 דגמים SUP הושק תוך 75 ימים. 15,000+ יחידות ב-12 החודשים הראשונים. דירוג ממוצע של 4.8★ ב-2,000+ ביקורות. שיעור נזק של 0.3% בהובלה.
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-medusa-glow-1.webp
    tags:
      - OEM
      - SUP
      - DTC
      - מסחר אלקטרוני
    outcome_metrics:
      - label: דגמים
        value: '3'
      - label: יחידות
        value: 15,000+
      - label: דירוג ממוצע
        value: 4.8★
      - label: קצב נזק
        value: 0.3%
certifications:
  - name: CE
    body: האיחוד האירופי
    desc: מוצרים CE נושאים הסמכה לפי הנחיות האיחוד האירופי החלות — כלי שיט פנאי לפי EN ISO 6185, מכשירי ציפה אישיים לפי EN ISO 12402, כאשר רלוונטי.
  - name: ISO 9001
    body: SGS / BSI
    desc: מערכת ניהול איכות מוסמכת לתכנון, ייצור והפצה של כלי שיט מתנפחים.
  - name: BSCI
    body: amfori
    desc: הסמכת ציות חברתי המדגימה ייצור אתי, עבודה הוגנת ובטיחות במקום העבודה.
  - name: REACH
    body: הסוכנות האירופית לכימיקלים
    desc: כל החומרים עומדים REACH בתקנות לבטיחות כימית. תיעוד מסופק עם כל משלוח.
  - name: RoHS
    body: האיחוד האירופי
    desc: הגבלת עמידה בדרישות חומרים מסוכנים בכל הרכיבים האלקטרוניים והחשמליים.
  - name: AS 1799
    body: תקנים אוסטרליה
    desc: התקן האוסטרלי לסירות מתנפחות — נבדק ואושר לשימוש מסחרי במימי AU/ניו זילנד.
