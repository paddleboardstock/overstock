cases:
  - id: beginner
    title: Pradedančiųjų irklavimas
    desc: Stabilios pripučiamos SUP lentos pradedantiesiems irkluotojams.
    scenario: Šeima, savaitgalį atvykstanti prie ežero, nori išbandyti irklentę. Jiems reikia stabilios, lengvai paleidžiamos įrangos su aiškiomis saugos instrukcijomis.
    solution: SUP Explorer 11 suteikia plačią kūno stabilumą pradedantiesiems. Life Vest Classic užtikrina CE sertifikuotą plūdrumą. Oars & Pump Set pripučia lentą per mažiau nei 10 minučių.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Ekskursijos ir tyrinėjimas
    desc: Ilgos distancijos pripučiamos SUP lentos ežerams, upėms ir pakrančių kelionėms.
    scenario: Lauko entuziastas planuoja savaitės trukmės irklavimo kelionę ir jam reikia lentos, kuri susilanksto mažai, pripučiama stovykloje ir tiesiai laikosi atvirame vandenyje.
    solution: Ocean Voyager Series efektyviai slysta su turistine kontūre ir laikosi krypties vėjo bei bangų sąlygomis. Jos drop-stitch konstrukcija pripučiama iki 15 PSI suteikiant standumą lyg kieta lenta.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Jogos ir fitneso
    desc: Ypač plačios, stabilios platformos jogai, fitnesui ir atsipalaidavimui.
    scenario: Jogos praktikuotojas nori plaukiojančios studijos rytinėms sesijoms ramioje vandenyje, su pakankamai denio vietos visoms pozoms.
    solution: Flowing Lotus Series turi viso ilgio denio kilimėlį ir plačią briauną, kad pozos būtų stabilios. Ji taip pat tarnauja kaip stabili platforma lengvam fitneso treniruotėms.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Šeimos poilsis
    desc: Pilni SUP paketai savaitgalio ežerų dienoms ir atostogoms.
    scenario: Keturių asmenų šeima nori stabilias lentas savaitgalio ežerų išvykoms ir paplūdimio atostogoms — įrangą, kuri tilptų į automobilį ir pripučiama per kelias minutes.
    solution: Tropical Breeze Series yra stabili universalioji lenta, kuria gali naudotis visa šeima, o Medusa Glow Series yra lengvesnė ir trumpesnė vaikams. Abi telpa į kuprines patogiam kelionės nešimui.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
