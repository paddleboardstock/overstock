cases:
  - id: beginner
    title: Pradedančiųjų vandens sportas
    desc: Stabilūs SUP valtys ir baidarės pirmą kartą naudojantiems.
    scenario: Šeima, savaitgalį atvykstanti prie ežero, nori išbandyti irklentę. Jiems reikia stabilios, lengvai paleidžiamos įrangos su aiškiomis saugos instrukcijomis.
    solution: SUP Explorer 11 suteikia plataus kūno stabilumą pradedantiesiems. Life Vest Classic užtikrina CE sertifikuotą plūdrumą. Dual-Action Pump pripučia abi lentas per mažiau nei 10 minučių.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Lauko tyrinėjimai
    desc: Nešiojamos baidarės ir valtys upėms, ežerams ir pakrantės kelionėms.
    scenario: Lauko entuziastas planuoja savaitės kelionę upe ir jam reikia valties, kuri susipakuotų mažai vietos, būtų pripučiama stovykloje ir valdyta įvairių srovių.
    solution: Kayak Lite telpa į kuprinę ir pripučiama per mažiau nei 4 minutes. Jos drop-stitch konstrukcija tinka ežerams, lėtoms upėms ir pakrantės plaukimui.
    products:
      - Pripučiama Kayak Lite
      - Anglies irklas
      - Life Vest Classic
    image: https://assets.aquafarer.com/images/aquafarer/products/aquafarer-inflatable-boat.webp
  - id: professional-operations
    title: Profesionalios operacijos
    desc: Komercinės klasės RIBs turizmui ir avariniam reagavimui.
    scenario: Pakrantės turizmo operatorius reikia tvirtų valčių floto, kuri kasdien vykdytų keliones įvairiomis jūros sąlygomis ir atitiktų komercinius saugos reikalavimus.
    solution: RIB 330 ir RIB 450 Patrol naudoja stiklo pluošto giliavėžes korpusus su Hypalon vamzdžiais visų oro sąlygų patvarumui. Kelios vienetai gali būti naudojami nuosekliam veikimui.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.aquafarer.com/images/aquafarer/use-cases/aquafarer-professional-use-case.webp
  - id: family-recreation
    title: Šeimos poilsis
    desc: Erdvios valtys dienos išvykoms, žvejybai ir vandens sportui.
    scenario: Keturių asmenų šeima nori stabilios valties savaitgalio išvykoms ežere, žvejybai ir vaikų traukiamai plausteliui.
    solution: AirDeck 360 talpina iki penkių žmonių su sustiprinta oro denio grindimi. Ji pripučiama vietoje, laikoma automobilyje ir tinkama tiek ramiems ežerams, tiek uždariam pakrančių vandenims.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.aquafarer.com/images/aquafarer/products/rib/aquafarer-rib-330-boat.webp
