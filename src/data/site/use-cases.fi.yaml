cases:
  - id: beginner
    title: 'Vesiurheilua aloittelijoille'
    desc: 'Vakaat SUP-laudat ja kajakit ensikertalaisille.'
    scenario: >-
      'Perhe, joka viettää viikonlopun järven rannalla, haluaa kokeilla melontaa seisten. Tarvitaan vakaa, helposti vesille laskettava varustus selkeillä turvaohjeilla.'
    solution: >-
      'SUP Explorer 11 tarjoaa aloittelijoille leveän vakauden. Life Vest Classic varmistaa CE-sertifioinnin mukaisen kelluvuuden. Kaksitoiminen pumppu täyttää molemmat laudat alle 10 minuutissa.'
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 'Ulkoiluseikkailu'
    desc: 'Kannettavat kajakit ja veneet järvillä, joilla ja rannikkoretkillä.'
    scenario: >-
      'Ulkoilija suunnittelee viikon pituista jokiretkeä ja tarvitsee veneen, joka pakkautuu pieneen tilaan, täytetään leirissä ja kestää vaihtelevia virtoja.'
    solution: >-
      'Kayak Lite mahtuu selkäreppuun ja täyttyy alle 4 minuutissa. Drop-stitch-rakenne kestää järvet, hitaat joet ja rannikkomelonnan.'
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: 'Ammattimainen käyttö'
    desc: 'Kaupallisen luokan RIB-veneet retkiorganisaatioille ja hätäviranomaisille.'
    scenario: >-
      'Rannikkoretkioperaattori tarvitsee laivaston kestäviä veneitä päivittäisiin retkiin vaihtelevissa meriolosuhteissa ja kaupallisten turvallisuusmääräysten mukaisesti.'
    solution: >-
      'RIB 330 ja RIB 450 Patrol käyttävät syvä-V-lasikuiturunkoja ja Hypalon-ponttoneita kestävyyteen kaikissa sääoloissa. Useita yksiköitä voidaan ottaa käyttöön tasaisella suorituskyvyllä.'
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: 'Perheen virkistys'
    desc: 'Tilavat ponttonit päiväretkiin, kalastukseen ja vesiurheiluun.'
    scenario: >-
      'Nelikoinen perhe haluaa vakaan veneen viikonloppuretkille järvellä, kalastusretkiin ja lasten vesirengasvetoon.'
    solution: >-
      'AirDeck 360 vetää jopa viisi henkilöä vahvistetulla ilmapohjalla. Se täytetään vesillelaskupaikassa, mahtuu autoon ja sopii sekä tyyniin järviin että suojaisiin rannikkovesiin.'
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
