cases:
  - id: beginner
    title: Aloittelijan melonta
    desc: Vakaita ilmatäytteisiä SUP-lautoja ensikertalaisille melontaharrastajille.
    scenario: Perhe, joka vierailee järvellä viikonlopun ajan, haluaa kokeilla suppailua. He tarvitsevat vakaat, helposti vesille saatavat varusteet, joissa on selkeät turvallisuusohjeet.
    solution: SUP Explorer 11 tarjoaa leveän rungon vakauden aloittelijoille. Life Vest Classic varmistaa CE-sertifioidun kelluvuuden. Oars & Pump Set täyttää laudan alle 10 minuutissa.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Matkailu ja tutkiminen
    desc: Pitkän matkan täytettävät SUP-laudat järville, joille ja rannikkoretkille.
    scenario: Ulkoliikunnasta kiinnostunut henkilö suunnittelee viikon kestävä kanoottiretkeä ja tarvitsee laudan, joka pakkautuu pieneksi, täyttyy leirissä ja liukuu suoraan avoimella vedellä.
    solution: Ocean Voyager Series liukuu tehokkaasti touring-muodon ansiosta ja pysyy kurssissa tuulessa ja aalloissa. Sen drop-stitch-rakenne täyttyy 15 PSI:iin kovaa lautaa varten.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Jooga & Kuntoilu
    desc: Erittäin leveät, vakaat alustat joogaan, kuntoiluun ja rentoutumiseen.
    scenario: Joogaaja haluaa kelluvan studion aamuharjoituksia varten tyynellä vedellä, jossa on tarpeeksi kansitilaa jokaista asentoa varten.
    solution: Flowing Lotus Series sisältää täysimittaisen aluspehmusteen ja leveän rungon, joka mahdollistaa tärisemättömät asennot. Se toimii myös vakaana alustana kevyille kuntoiluharjoituksille.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Perheen virkistys
    desc: Täydelliset SUP pakettipaketit viikonlopun järvipäiville ja lomille.
    scenario: Neljän hengen perhe haluaa vakaita lautaita viikonloppujen järviretkiä ja rantalomia varten — varusteita, jotka mahtuvat autoon ja täyttyvät minuutissa.
    solution: Tropical Breeze Series on vakaa monipuolinen lauta, jota koko perhe voi käyttää, kun taas Medusa Glow Series on kevyempi ja lyhyempi lapsille. Molemmat mahtuvat reppuihin, joten ne ovat helppoja matkustaa mukana.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
