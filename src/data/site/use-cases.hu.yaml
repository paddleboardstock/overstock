cases:
  - id: beginner
    title: Kezdő vízi sportok
    desc: Stabil SUP deszkák és kajakok kezdő felhasználóknak.
    scenario: Egy család, aki hétvégére a tóhoz látogat, kipróbálná a paddle boardozást. Stabil, könnyen indítható felszerelésre van szükségük, világos biztonsági útmutatóval.
    solution: A SUP Explorer 11 széles testű stabilitást biztosít a kezdőknek. A Life Vest Classic CE-minősített úszóképességet nyújt. A Dual-Action Pump mindkét deszkát 10 percen belül felfújja.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Szabadtéri felfedezés
    desc: Hordozható kajakok és csónakok folyókhoz, tavakhoz és tengerparti túrákhoz.
    scenario: Egy szabadtéri rajongó egy hétig tartó folyótúrára készül, és olyan hajóra van szüksége, amely kis helyen fér el, a táborhelyen felfújható, és változó sodrásokat bír kezelni.
    solution: A Kayak Lite hátizsákba csomagolható és 4 percen belül felfújható. drop-stitch kialakítása tavakhoz, lassú folyókhoz és tengerparti evezéshez alkalmas.
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: Professzionális üzemeltetés
    desc: Kereskedelmi minőségű RIBs túraszervezőknek és vészhelyzeti szolgálatnak.
    scenario: Egy tengerparti túraszervező olyan hajóflottát keres, amely tartós, napi társasági utakat bír a változó tengerviszonyok között, és megfelel a kereskedelmi biztonsági előírásoknak.
    solution: A RIB 330 és RIB 450 Patrol üvegszálas deep-V hajótestekkel és Hypalon csövekkel biztosítja az időjárásállóságot. Több egység egyidejű használata is következetes teljesítményt nyújt.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: Családi szórakozás
    desc: Tágas csónakok egynapos kirándulásokhoz, horgászathoz és vízisportokhoz.
    scenario: Egy négytagú család stabil hajót szeretne hétvégi tókirándulásokhoz, horgásztúrákhoz, és a gyerekeknek csónak vontatásához.
    solution: A AirDeck 360 akár öt főt is befogad megerősített légpadlóval. A vízparton felfújható, az autóban tárolható, és alkalmas nyugodt tavakhoz, valamint védett tengerparti vizekhez.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
