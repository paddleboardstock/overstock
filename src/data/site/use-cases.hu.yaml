cases:
  - id: beginner
    title: Kezdő evezés
    desc: Stabil felfújható SUP deszkák kezdő evezősöknek.
    scenario: Egy család, aki hétvégére a tóhoz látogat, kipróbálná a paddle boardozást. Stabil, könnyen indítható felszerelésre van szükségük, világos biztonsági útmutatóval.
    solution: A SUP Explorer 11 szélestestű stabilitást biztosít a kezdőknek. A Life Vest Classic CE tanúsítvánnyal rendelkező felhajtóerőt biztosít. A Oars & Pump Set kevesebb mint 10 perc alatt fújja fel a deszkát.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Túrázás és felfedezés
    desc: Hosszú távú felfújható SUP deszkák tavakra, folyókra és part menti túrákra.
    scenario: Egy szabadtéri rajongó hét napos evezős túrát tervez, és szüksége van egy deszkára, ami kis helyen elfér, a táborhelyen felfújható, és nyílt vízen egyenesen halad.
    solution: A Ocean Voyager Series a túra kontúrjának köszönhetően hatékonyan siklik és tartja az irányt szélben és hullámzásban. drop-stitch kialakítása 15 PSI-ra fújható a kemény deszka merevségéhez.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Jóga és fitnesz
    desc: Extra széles, stabil felületek jógához, fitneszhez és pihenéshez.
    scenario: Egy jógagyakorló egy lebegő stúdiót szeretne reggeli gyakorlásokhoz nyugodt vízen, elegendő fedélzeti hellyel minden pózhoz.
    solution: A Flowing Lotus Series teljes hosszúságú fedélzeti párnát és széles szélességet kínál, hogy a pózok ne inogjanak. Emellett stabil platformként is funkcionál könnyű fitnesz edzésekhez.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Családi szórakozás
    desc: Teljes SUP csomagok hétvégi tóparti napokra és nyaralásokra.
    scenario: Egy négytagú család stabil deszkákat szeretne hétvégi tóparti kirándulásokhoz és strand nyaralásokhoz — felszerelést, ami befér az autóba és percek alatt felfújható.
    solution: A Tropical Breeze Series egy stabil, minden célra alkalmas deszka, amit az egész család használhat, míg a Medusa Glow Series könnyebb és rövidebb a gyerekeknek. Mindkettő hátizsákban csomagolható az egyszerű utazáshoz.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
