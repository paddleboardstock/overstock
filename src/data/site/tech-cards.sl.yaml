cards:
  - badge: PVC
    title: Marine-Grade PVC sloj
    description: Večplastna laminirana PVC tkanina, ocenjena za morske razmere. Testirano za UV, odpornost proti obrabi in preboju.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch jedro
    description: Tisoči notranjih niti povezujejo zgornje in spodnje plasti, kar ustvarja trdno strukturo, odporna na visok tlak pri 12–15 PSI.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - badge: RR
    title: Ojačan rob proge
    description: Dvoslojno zvarjena letev ščiti pred praskami ob pomolu, pristanki na plaži in bočnimi udarci.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
