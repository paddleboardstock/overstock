cases:
  - id: beginner
    title: Začátečníci v pádlování
    desc: Stabilní nafukovací SUP prkna pro prvopádlové.
    scenario: Rodina, která na víkend navštíví jezero, chce vyzkoušet paddleboarding. Potřebují stabilní, snadno spustitelné vybavení s jasným bezpečnostním vedením.
    solution: SUP Explorer 11 poskytuje stabilitu širokého těla pro začátečníky. Life Vest Classic zajišťuje CE-certifikovanou plovatelnost. Oars & Pump Set nafoukne prkno za méně než 10 minut.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Touring & Objevování
    desc: Nafukovací SUP prkna na dlouhé vzdálenosti pro jezera, řeky a pobřežní výlety.
    scenario: Nadšenec do outdoorových aktivit plánuje týdenní pádlování a potřebuje prkno, které se vejde malého velikosti, nafoukne se u tábořiště a drží stopu na otevřené vodě.
    solution: Ocean Voyager Series klouže efektivně s cestovní konturou a drží kurz ve větru a vlnách. Jeho drop-stitch konstrukce se nafoukne na 15 PSI pro pevnost desky.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Jóga & Fitness
    desc: Extra široké, stabilní plochy pro jógu, fitness a relaxaci.
    scenario: Cvičící jógu chce plovoucí studio pro ranní lekce na klidné vodě, s dostatkem prostoru na palubě pro všechny pozice.
    solution: Flowing Lotus Series disponuje plně dlouhou podložkou na palubu a širokým trupem pro stabilní pozice bez kolísání. Slouží také jako stabilní platforma pro lehká fitness cvičení.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Rodinná rekreace
    desc: Kompletní SUP balíčky pro víkendové výlety k jezeru a dovolené.
    scenario: Čtyřčlenná rodina chce stabilní prkna pro víkendové výlety k jezeru a plážové dovolené — vybavení, které se vejde do auta a nafoukne během několika minut.
    solution: Tropical Breeze Series je stabilní univerzální prkno, které může sdílet celá rodina, zatímco Medusa Glow Series je lehčí a kratší pro děti. Obě se dají zabalit do batohů pro snadné cestování.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
