cases:
  - id: beginner
    title: Bermula Dayung
    desc: Papan tiup stabil SUP untuk pendayung kali pertama.
    scenario: Satu keluarga yang mengunjungi tasik pada hujung minggu ingin mencuba paddle boarding. Mereka memerlukan peralatan yang stabil, mudah untuk dilancarkan dengan panduan keselamatan yang jelas.
    solution: SUP Explorer 11 memberikan kestabilan badan lebar untuk pemula. Life Vest Classic memastikan apungan bersijil CE. Oars & Pump Set meniup papan dalam masa kurang daripada 10 minit.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: Melancong & Penerokaan
    desc: Papan tiup jarak jauh SUP untuk tasik, sungai, dan perjalanan pesisir pantai.
    scenario: Seorang penggemar aktiviti luar merancang perjalanan mendayung seminggu dan memerlukan papan yang boleh disimpan kecil, ditiup di tapak perkhemahan, dan meluncur lurus di air terbuka.
    solution: Ocean Voyager Series meluncur dengan cekap dengan bentuk touring dan mengekalkan haluan dalam angin dan ombak. Konstruksinya drop-stitch boleh ditiup hingga 15 PSI untuk kekakuan papan keras.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP Yoga & Kecergasan
    desc: Platform ekstra lebar dan stabil untuk yoga, kecergasan, dan relaksasi.
    scenario: Seorang pengamal yoga mahukan studio terapung untuk sesi pagi di air tenang, dengan ruang dek yang cukup untuk semua pose.
    solution: Flowing Lotus Series mempunyai pad dek sepanjang dan lebar untuk pose tanpa goyah. Ia juga berfungsi sebagai platform stabil untuk senaman kecergasan ringan.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: Rekreasi Keluarga
    desc: Pakej lengkap SUP untuk hari tasik hujung minggu dan percutian.
    scenario: Satu keluarga empat orang mahu papan stabil untuk outing tasik hujung minggu dan percutian pantai — peralatan yang boleh dimuatkan ke dalam kereta dan ditiup dalam beberapa minit.
    solution: Tropical Breeze Series ialah papan serba guna yang stabil untuk dikongsi oleh seluruh keluarga, manakala Medusa Glow Series lebih ringan dan pendek untuk kanak-kanak. Kedua-duanya boleh dimasukkan ke dalam beg galas untuk perjalanan mudah.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
