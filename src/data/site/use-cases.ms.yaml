cases:
  - id: beginner
    title: Sukan Air untuk Pemula
    desc: Papan SUP yang stabil dan kayak untuk pengguna kali pertama.
    scenario: Satu keluarga yang mengunjungi tasik pada hujung minggu ingin mencuba paddle boarding. Mereka memerlukan peralatan yang stabil, mudah untuk dilancarkan dengan panduan keselamatan yang jelas.
    solution: SUP Explorer 11 menyediakan kestabilan badan lebar untuk pemula. Life Vest Classic memastikan daya apungan bersertifikat CE. Pam Dual-Action mengepam kedua-dua papan dalam masa kurang daripada 10 minit.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: Penerokaan Luar
    desc: Kayak dan bot kecil mudah alih untuk sungai, tasik, dan perjalanan pesisir pantai.
    scenario: Seorang peminat aktiviti luar merancang perjalanan sungai selama seminggu dan memerlukan bot yang mudah dibawa, boleh dipam di kem, dan menyesuaikan dengan arus yang berbeza.
    solution: Kayak Lite boleh dimasukkan ke dalam beg galas dan dipam dalam masa kurang daripada 4 minit. Konstruk drop-stitchnya sesuai untuk tasik, sungai perlahan, dan paddling di pesisir pantai.
    products:
      - Inflatable Kayak Lite
      - Dayung Karbon
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: Operasi Profesional
    desc: RIBs bersaiz komersial untuk operator lawatan dan respons kecemasan.
    scenario: Seorang operator lawatan pesisir pantai memerlukan armada bot yang tahan lasak untuk perjalanan harian dalam pelbagai keadaan laut dan mematuhi peraturan keselamatan komersial.
    solution: RIB 330 dan RIB 450 Patrol menggunakan hull fiberglass deep-V dengan tiub Hypalon untuk ketahanan dalam semua cuaca. Beberapa unit boleh digunakan dengan prestasi yang konsisten.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: Rekreasi Keluarga
    desc: Bot kecil yang luas untuk perjalanan harian, memancing dan sukan air.
    scenario: Satu keluarga empat orang mahu bot yang stabil untuk keluar tasik hujung minggu, perjalanan memancing, dan menarik tiub untuk anak-anak.
    solution: AirDeck 360 memuatkan sehingga lima orang dengan lantai dek udara yang diperkuat. Ia dipam di lokasi pelancaran, disimpan dalam kereta, dan sesuai untuk tasik yang tenang serta perairan pesisir yang terlindung.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
