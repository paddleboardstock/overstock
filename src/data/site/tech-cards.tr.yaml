cards:
  - badge: PVC
    title: Deniz Kalitesinde PVC Katman
    description: Deniz ortamları için derecelendirilmiş çok katmanlı lamine PVC kumaş. UV, aşınma ve delinme direnci için test edilmiştir.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-pvc-material.webp
  - badge: DS
    title: Drop-Stitch Çekirdek
    description: Binlerce iç tel, üst ve alt katmanları birbirine bağlayarak 12–15 PSI’te sert, yüksek basınçlı bir yapı oluşturur.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-drop-stitch.webp
  - badge: RR
    title: Takviye Edilmiş Borda Kenarı
    description: Çift katlı füzyon kaynağıyla güçlendirilmiş borda, iskele sürtünmelerine, sahil inişlerine ve yan çarpmalara karşı koruma sağlar.
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/tech/tech-hypalon-tubes.webp
