- slug: paddleboardoverstock-airdeck-360-review
  category: product
  type: product
  title: 'Paddle Board Overstock AirDeck 360: Compact Inflatable Boat Review'
  description: "Complete review of the Paddle Board Overstock AirDeck 360 — a 12' compact inflatable boat with air deck floor. Specifications, performance, portability, and who this versatile tender is for."
  definition: "The Paddle Board Overstock AirDeck 360 is a 12' (360 cm) inflatable boat with a drop-stitch air deck floor, rated for up to 15 hp outboard engines."
  tldr: "The AirDeck 360 is a versatile 12' inflatable boat with air deck construction. It packs small and handles up to 15 hp. Key specs: 360 cm length, 160 cm beam, 5-person capacity, 3 air chambers, drop-stitch air floor. Best for yacht tendering, family recreation, and fishing."
  problem: 'You need a portable boat that packs small for yacht storage or car transport. Slat-floor boats take time to assemble; roll-up floors lack rigidity.'
  explanation: 'The air deck inflates to form a rigid flat platform without assembly. Triple-layer PVC provides durability at 35 kg weight. Three independent air chambers provide redundancy. The transom is rated for 15 hp.'
  solution: 'Inflate tubes first, then air deck. The high-pressure air deck creates a rigid, comfortable floor. The boat rolls up for compact storage.'
  recommendation: 'At $849, the AirDeck 360 is the best compact inflatable boat for those who prioritize packability. Ideal as a yacht tender or family fun boat. For heavier use, consider the RIB 330 with aluminum floor.'
  faq:
    - q: How does the air deck compare to an aluminum floor?
      a: Air decks are more comfortable, lighter, and pack smaller. Aluminum floors provide a more rigid platform for planing at higher speeds.
    - q: Can I stand and fish on the AirDeck 360?
      a: Yes, the air deck provides a stable platform for standing. The 160 cm beam provides stability.
    - q: What size engine do I need?
      a: 6-10 hp provides good planing with 1-2 passengers. Up to 15 hp for maximum speed.
    - q: How long to inflate?
      a: Approximately 10-15 minutes with the included pump. An electric pump reduces time to 5 minutes.
