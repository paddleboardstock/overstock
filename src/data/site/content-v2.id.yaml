  title: 'Kondisi Angin untukSUP: Bagaimana Angin Memengaruhi Dayung Anda'
  description: Bagaimana kecepatan dan arah angin SUP memengaruhi dayung. Memahami angin lepas pantai vs darat, membaca prakiraan angin, teknik mendayung untuk angin, dan kapan harus tetap di darat.
  definition: Kondisi angin menentukan SUP keamanan. Angin lepas pantai (dari darat ke laut) mendorong Anda menjauh. Angin darat (dari laut ke darat) mendorong Anda ke arah pantai. Angin samping menyebabkan papan berputar.
  tldr: 'Angin aman maksimum untuk pemula: 10 knot. Sedang: 15 knot. Lanjutan: 20 knot. Angin lepas pantai paling berbahaya. Dayung melawan angin terlebih dahulu. Di angin samping, dayung sedikit ke arah arah tujuan. Berlutut di angin kencang untuk mengurangi profil Anda.'
  problem: Anda mendayung dalam kondisi tenang, tetapi 30 menit kemudian angin mulai bertiup dan Anda kesulitan untuk kembali. Angin adalah faktor keselamatan yang paling diremehkan SUP .
  explanation: Angin memengaruhi SUP lebih banyak daripada kapal dayung lain karena Anda berdiri, menciptakan efek layar. Angin 10 knot menciptakan hambatan jauh lebih besar pada pendayung berdiri dibandingkan dengan kayak yang duduk. Angin lepas pantai mendorong Anda menjauh dari keselamatan. Angin samping menyebabkan hidung layar mengayun.
  solution: 'Periksa kecepatan dan arah angin sebelum mendayung. Gunakan skala Beaufort: Kekuatan 3 (7-10 knot) untuk pemula, Kekuatan 4 (11-16) untuk tingkat menengah. Dayung melawan angin terlebih dahulu. Jika terkena angin lepas pantai, dayung pada sudut 45 derajat terhadap angin. Berlutut di bawah angin kencang.'
  recommendation: Gunakan aplikasi prakiraan angin (Windy, Windfinder) sebelum setiap sesi. Aquafarer SUP Tour 12 lebih baik di lintasan angin dibandingkan papan yang lebih lebar. Dalam kondisi berangin, gunakan gerakan dayung yang lebih pendek dan kadensi yang lebih tinggi.
  faq:
    - q: Arah angin mana yang paling amanSUP?
      a: Angin darat (bertiup ke daratan) adalah yang paling aman — angin itu mendorong Anda mundur. Angin lepas pantai adalah yang paling berbahaya.
    - q: Bagaimana cara mendayung di angin samping?
      a: Dayung lebih ke arah angin untuk melawan drift. Miringkan papan ke arah angin dari tujuan Anda. Sirip tengah yang lebih dalam membantu.
    - q: Bisakah saya mendayung dengan angin 20 knot?
      a: Hanya jika berpengalaman di perairan yang terlindungi. Pemula sebaiknya tidak mendayung di atas 10 knot.
    - q: Bagaimana pengaruh hembusan anginSUP?
      a: Hembusan angin menyebabkan tantangan keseimbangan mendadak. Dalam kondisi angin kencang, turunkan posisi tubuhmu dan bersiaplah untuk perubahan mendadak.
