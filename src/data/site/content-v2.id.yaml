- slug: what-to-wear-for-surfing
  category: problem
  type: safety
  title: Apa yang harus dipakai untuk berselancar (jangan muncul dengan celana board pendek saat Anda butuh 5/4)
  description: Berhenti menebak apa yang harus dipakai. Suhu air, bukan suhu udara, yang menentukan pakaian selancarmu. Panduan lengkap untuk berlapis mulai dari rash guard tropis hingga setup musim dingin penuh 5/4/3mm.
  definition: Pakaian selancar berkisar dari celana pendek papan dan pelindung ruam di air hangat hingga wetsuit penuh 5/4/3mm dengan sepatu bot dan tudung di air dingin. Suhu air, bukan suhu udara, yang menentukan apa yang Anda butuhkan.
  tldr: Apa yang Anda kenakan saat berselancar sepenuhnya bergantung pada suhu air — bukan suhu udara. Rash guard dan celana pendek papan bekerja di atas 22°C, baju pegas untuk 18-22°C, pakaian lengkap 3/2mm untuk 14-18°C, dan 5/4/3mm dengan sepatu bot diperlukan di bawah 14°C. Selalu kenakan UV pelindung dan pertimbangkan tali serta rompi impact.
  problem: Anda tiba di pantai dan tidak tahu apakah rash guard sudah cukup atau Anda perlu wetsuit lengkap. Suhu udara hangat tapi airnya dingin, atau airnya terasa baik tapi angin membeku. Berpakaian salah berarti sesi yang rusak.
  explanation: 'Pakaian selancar memiliki tiga fungsi: isolasi termal, UV perlindungan, dan pencegahan abrasi. Wetsuit neoprene dinilai berdasarkan ketebalan dan penutup — pakaian pegas (lengan atau kaki pendek) untuk hari borderline, pakaian lengkap untuk air dingin. Rash guard melindungi dari ruam papan dan sinar matahari tetapi tidak memberikan nilai termal. Sepatu bot, sarung tangan, dan tudung bukanlah aksesori tetapi perlengkapan penting untuk berselancar di air dingin di bawah 12°C.'
  solution: 'Periksa buoy lokal atau laporan suhu air hidup sebelum berangkat. Buat perlengkapan berdasarkan kondisi paling dingin Anda: rash guard dan celana pendek untuk musim panas, setelan lengkap 3/2mm untuk musim semi dan gugur, 5/4/3mm dengan sepatu bot dan tudung untuk musim dingin. Selalu tambahkan tali dan pertimbangkan rompi pelampung untuk keamanan.'
  recommendation: Investasikan dulu pada setelan lengkap 3/2mm yang bagus — ini mencakup berbagai kondisi terluas. Tambahkan setelan dan sepatu bot 5/4/3mm jika Anda berencana berselancar selama musim dingin. Aquafarer Wetsuit Pro dengan lapisan termal menjembatani kedua rentang suhu tersebut secara efektif.
  faq:
    - q: Bisakah saya berselancar hanya dengan celana board shorts?
      a: Ya, di air tropis di atas 24°C. Anda mungkin ingin menggunakan rash guard untuk mencegah lecet di dada dan lengan saat mendayung. Wax atau bantalan traksi pada papan membantu mengimbangi kurangnya cengkeraman di suit.
    - q: Apakah saya perlu sepatu surf?
      a: Jika suhu air turun di bawah 14°C, sepatu bot mencegah mati rasa dan melindungi kaki dari batu serta luka terumbu. Sepatu bot juga menambah traksi pada papan. Sebagian besar peselancar di iklim utara menggunakan sepatu bot dari November hingga Maret.
    - q: Apa itu baju pegas?
      a: Baju pegas adalah wetsuit lengan pendek atau kaki pendek (atau keduanya) yang dirancang untuk air antara 18°C dan 22°C. Baju ini menawarkan kehangatan lebih dibandingkan rash guard tetapi perlindungan lebih sedikit dibandingkan baju penuh.
    - q: Haruskah saya memakai rompi pelampung saat berselancar?
      a: Bukan pelampung tradisional, tapi rompi impact atau alat bantu pelampung bisa membantu di kondisi sulit atau jika Anda perenang lemah.Aquafarer Rompi pelampung dirancang untuk SUP kayak, tetapi dapat memberikan kepercayaan diri ekstra untuk mengapung bagi pemula selancar.
