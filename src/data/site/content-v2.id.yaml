  type: buying-guide
  title: 'Panduan Rompi Kehidupan Laut: Pilih yang Tepat PFD untuk Aktivitas Air Anda'
  description: Panduan lengkap membeli rompi pelampung untuk SUP, kayak, RIB berperahu, dan berlayar.PFD Jenis (busa vs tiup), pedoman kecocokan, persyaratan hukum, dan fitur untuk setiap aktivitas.
  definition: Rompi pelampung atau alat pelampung pribadi PFD() adalah perlengkapan keselamatan yang dirancang untuk menjaga seseorang tetap mengapung di air. Jenis-jenisnya berkisar dari Tipe I (lepas pantai) hingga Tipe V (penggunaan khusus).
  tldr: 'Pilih PFD berdasarkan aktivitas: paket sabuk tiup untukSUP, rompi busa untuk kayak, busa Tipe III untuk RIB dan perahu motor. Fitur utama: USCG atau ISO persetujuan, panel reflektif, peluit penyelamat, cincin D untuk tali pengikat, warna cerah.'
  problem: Anda melihat deretan rompi pelampung dengan harga antara $20 hingga $300 dan tidak tahu mana yang sesuai dengan aktivitas Anda atau memenuhi persyaratan hukum.
  explanation: 'Rompi pelampung dikategorikan berdasarkan jenis: Tipe I (lepas pantai, membuat pemakainya tidak sadar menghadap ke atas), Tipe II (dekat pantai), Tipe III (alat bantu pelampung, paling umum), Tipe IV (dapat dilempar), Tipe V (penggunaan khusus). Rompi tiup menggunakan kartrid CO2 — tidak terlalu besar tetapi memerlukan perawatan. Rompi busa bebas perawatan tetapi lebih besar.'
  solution: 'Untuk SUP: pilih tas sabuk tiup atau rompi (daya apung 33 lb). Untuk kayak: Busa Tipe III dengan potongan lengan tinggi. Untuk RIB: Busa Tipe III atau tiup dengan daya+ apung 22 lb, pita reflektif, dan peluit penyelamat.'
  recommendation: Aquafarer Life Vest Pro (tiup, 33 lb) sangat ideal untuk SUP dan berkayak. Aquafarer Life Vest Classic (busa, Tipe III) sangat cocok untuk RIB berperahu dan penggunaan laut secara umum.
  faq:
    - q: Apakah saya perlu rompi pelampung untuk SUPitu?
      a: Ya — diwajibkan secara hukum di banyak yurisdiksi dan selalu direkomendasikan. Kenakan tas sabuk tiup atau rompi untuk olahraga dayung.
    - q: Apakah rompi pelampung tiup aman?
      a: Ya, dengan perawatan yang tepat. Periksa cartridge CO2 setiap tahun, ganti bobbin setiap 2-3 tahun.
    - q: Rompi pelampung apa yang terbaik untuk anak?
      a: USCGRompi busa Type II atau III yang disetujui dengan kerah, tali selangkangan, dan warna cerah. Jangan pernah menggunakan rompi tiup untuk anak-anak.
    - q: Bagaimana seharusnya rompi pelampung pas?
      a: Pas — rompi tidak boleh terangkat di atas telinga saat diangkat oleh bahu. Semua resleting dan gesper terkancing.
