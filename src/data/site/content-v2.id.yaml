- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP Panduan Ukuran: Panjang, Lebar, dan Volume Dijelaskan'
  description: Temukan ukuran SUP yang tepat berdasarkan berat badan, tingkat keahlian, dan gaya mendayung Anda. Panjang menentukan arah, lebar menentukan kestabilan, dan volume menentukan kapasitas berat.
  definition: Ukuran SUP didefinisikan oleh panjang (kecepatan dan keluncuran), lebar (stabilitas utama), ketebalan (stabilitas sekunder dan volume), dan volume dalam liter (kapasitas berat total).
  tldr: 'All-around SUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L). Touring: 12''-14'' x 30"-32" (280-350L). Surf: 8''-10'' x 30"-32" (140-220L). Pemula membutuhkan lebar lebih dari 32" dan volume melebihi berat badan sebesar 60-80L. Berat badan Anda dalam kg ditambah 60L adalah target volume minimum untuk stabilitas.'
  problem: Setiap merek SUP mencantumkan papan dalam satuan kaki, inci, dan liter, tetapi tanpa mengetahui bagaimana ukuran-ukuran ini diterjemahkan ke dalam rasa di dunia nyata, Anda berisiko membeli papan yang mudah terguling, lambat, atau tidak dapat mendukung berat badan Anda.
  explanation: 'Panjang menentukan seberapa cepat papan berayun dan seberapa baik papan tersebut mengikuti garis lurus. Papan yang lebih panjang (12''+) meluncur di antara gerakan dan menahan garis. Papan yang lebih pendek (di bawah 10'') mudah berputar tetapi membutuhkan pergantian dayung yang lebih sering. Lebar menentukan stabilitas utama — stabilitas berdiri. Papan 30" terasa tippy bagi pemula; 34" terasa seperti dermaga. Ketebalan menentukan volume — papan yang lebih tebal mengapung lebih tinggi tetapi menangkap lebih banyak angin. Volume dalam liter adalah metrik terbaik: papan yang terisi (Anda plus perlengkapan) harus tenggelam 2-4 inci saat diam.'
  solution: 'Cocokkan dimensi papan Anda dengan tiga faktor: berat badan (menentukan volume minimum), aktivitas utama (menentukan panjang), dan tingkat keterampilan (menentukan lebar). Untuk pemula, kalikan berat dalam kg dengan 2,2 untuk mendapatkan liter minimum. Untuk tingkat menengah, kalikan dengan 1,8. Untuk tingkat lanjutan, kalikan dengan 1,4.'
  recommendation: Aquafarer SUP Explorer 11 dengan ukuran 11' x 33" x 6" dengan berat 260L cocok untuk sebagian besar pengendara hingga 100 kg untuk mendayung secara keseluruhan. Tingkatkan ke SUP Tour 12 dengan ukuran 12' x 31" untuk kecepatan touring dan meluncur yang lebih baik.
  faq:
    - q: Ukuran apa SUP yang saya butuhkan untuk berat badan saya?
      a: 'Untuk pengendara di bawah 70 kg: 10-11'' x 32" (220-260L). Untuk 70-90 kg: 11-12'' x 33" (260-300L). Untuk 90-110 kg: 11-12'' x 34" (300-350L). Untuk di atas 110 kg: 12'' x 34-36" (350L+).'
    - q: Apakah yang lebih panjang lebih SUP cepat?
      a: Ya. Papan yang lebih panjang memiliki rasio panjang terhadap lebar yang lebih baik, mengurangi hambatan. Papan touring 14' SUP jauh lebih cepat daripada papan all-around 11' dengan usaha mendayung yang sama.
    - q: Lebar berapa SUP yang stabil untuk pemula?
      a: 33-34 inci adalah titik optimal untuk pemula hingga 90 kg. Di bawah 32" membutuhkan keseimbangan yang baik. Di atas 34" sangat stabil tetapi lebih lambat dan sulit didayung saat angin.
    - q: Bisakah saya menggunakan papan all-around untuk touring?
      a: Ya, untuk tur pendek di bawah 10 km. Untuk jarak yang lebih jauh, papan tur khusus akan lebih baik dan menempuh jarak lebih efisien.
