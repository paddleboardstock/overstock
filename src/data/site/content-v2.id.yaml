- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'SUP Panduan Dayung: Pilih Dayung yang Tepat untuk Gaya Anda'
  description: Panduan lengkap untuk SUP dayung — panjang, bahan (aluminium, fiberglass, karbon), bentuk bilah, dan bagaimana pilihan dayung memengaruhi pengalaman mendayung Anda.
  definition: SUP Dayung terdiri dari poros (aluminium, fiberglass, atau karbon) dan bilah (dihedral, scoop, atau datar). Panjang harus 8-10" di atas tinggi badan Anda untuk mendayung secara umum.
  tldr: 'Panjang dayung: 8-10" di atas tinggi badan untuk penggunaan serba bisa, 6-8" untuk selancar, 10-12" untuk touring. Bahan: aluminium (murah, berat), fiberglass (kelas menengah, fleksibel bagus), karbon (ringan, kaku, mahal). Bentuk bilah: dihedral (pelacakan stabil), scoop (tenaga), datar (serbaguna). Dayung yang dapat disesuaikan sangat cocok untuk pemula.'
  problem: Dayung yang disertakan di sebagian besar iSUP berfungsi tapi berat dan tidak efisien. Upgrade meningkatkan efisiensi dan kesenangan mendayung, tapi opsinya membingungkan.
  explanation: 'Panjang dayung memengaruhi efisiensi pukulan — terlalu pendek membutuhkan ketekukan, terlalu panjang menyebabkan kelelahan bahu. Material menentukan berat: dayung karbon berukuran 18-24 oz dibandingkan 28-36 oz untuk aluminium. Ukuran bilah memengaruhi tenaga: bilah yang lebih besar (100+ inci persegi) memberikan dorongan lebih besar per gerakan tetapi kelelahan lebih cepat. Bilah dihedral lintasan lurus; bilah scoop memberikan tangkapan lebih baik.'
  solution: 'Untuk panjang yang tepat: berdiri dengan dayung vertikal, angkat lengan ke atas — gagang dayung harus mengenai pergelangan tangan Anda. Untuk bahan: mulai dengan fiberglass sebagai peningkatan berat sedang. Untuk bilah: pilih dihedral untuk mendayung umum. Untuk aktivitas: dayung touring lebih panjang dengan bilah yang lebih kecil; dayung selancar lebih pendek dengan bilah yang lebih lebar.'
  recommendation: Dayung Aquafarer karbon seberat 28 oz adalah peningkatan terbaik untuk pendayung yang sering berdayung. Dayung aluminium 3 bagian yang dapat disesuaikan yang disertakan cukup untuk pemula maupun saat bepergian.
  faq:
    - q: Berapa panjang SUP dayung saya sebaiknya?
      a: Ukur tinggi badan Anda dalam inci dan tambahkan 8-10 inci untuk mendayung secara menyeluruh. Untuk selancar, tambahkan 6-8. Untuk touring, tambahkan 10-12.
    - q: Apakah paddle karbon sepadan dengan uangnya?
      a: Ya, untuk pendayung reguler — pengurangan berat badan ini secara signifikan mengurangi kelelahan selama sesi panjang. Untuk penggunaan sesekali, fiberglass adalah nilai yang baik.
    - q: Apa itu paddle yang dapat disesuaikan?
      a: Dayung 2 atau 3 bagian dengan penyesuaian panjang, ideal untuk berbagi antar pengguna atau menyesuaikan dengan berbagai aktivitas.
    - q: Bagaimana cara merawat dayung saya?
      a: Bilas dengan air segar setelah menggunakan air garam. Hindari menabraknya atau menyimpan dalam panas langsung. Periksa ferrule (sambungan) untuk pasir.
