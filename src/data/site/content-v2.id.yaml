  title: 'Panduan Ukuran Paddle Board: Volume, Panjang, dan Lebar untuk Setiap Pengendara'
  description: Ukuran papan dayung lengkap dengan rekomendasi volume berdasarkan berat dan aktivitas. Termasuk tabel ukuran yang mudah digunakan untuk papan all-around, touring, surfing, dan yoga SUP .
  definition: Ukuran papan dayung ditentukan oleh volume (kapasitas berat dan pelampung), panjang (kecepatan dan pelacakan), lebar (stabilitas), dan ketebalan (distribusi volume dan tahan angin).
  tldr: 'Gunakan berat untuk menemukan volume minimum: 50-70 kg membutuhkan 220-260L, 70-90 kg membutuhkan 260-300L, 90-110 kg membutuhkan 300-350L, 110+ kg membutuhkan 350L+. Untuk pemula, tambahkan 20% ke angka ini. Lebar penting: 32" adalah tingkat menengah, 33-34" ramah untuk pemula, 35"+ sangat stabil.'
  problem: Daftar ukuran paddle board menggunakan kaki, inci, dan liter secara bergantian, sehingga sulit untuk membandingkan antar merek.
  explanation: Volume adalah metrik paling langsung untuk kapasitas berat — 1 liter air tawar menggantikan 1 kg berat. Papan dengan 260L secara teori dapat menopang 260 kg, tetapi kapasitas praktisnya lebih rendah karena papan harus berada di atas air. Total berat Anda (badan plus perlengkapan) harus 30-40% dari volume papan.
  solution: Volume target = (berat badan dalam kg + berat gigi dalam kg) x 3. Untuk pendayung 75 kg dengan perlengkapan 5 kg, target = 80 x 3 = minimal 240L. Untuk pemula, kalikan dengan 3,5. Untuk tingkat lanjut, kalikan dengan 2,5.
  recommendation: Aquafarer SUP Explorer 11 (260L, 11' x 33" x 6") cocok untuk sebagian besar pengendara 50-100 kg. Pengendara ringan bisa mencapai AirDeck ukuran 270 kg. Pengendara yang lebih berat sebaiknya mempertimbangkan SUP papan Tour 12 (300L+) atau yang lebih lebar.
  faq:
    - q: Apakah tinggi berpengaruh untuk SUP ukuran?
      a: Tinggi badan kurang penting daripada berat. Pengendara tinggi dan ringan membutuhkan volume yang lebih sedikit daripada pengendara pendek dan berat. Gunakan berat sebagai penentu volume utama Anda.
    - q: Apa yang terjadi jika volume terlalu banyak?
      a: Papan ini terlalu tinggi, terkena angin seperti layar. Rasanya seperti gabus saat ditembak. Namun, bagi pemula, volume ekstra lebih baik daripada terlalu sedikit.
    - q: Apa yang terjadi jika volume terlalu sedikit?
      a: Papan terlalu dalam, menciptakan hambatan. Hidung mungkin tenggelam saat mendayung (pearling). Anda cepat lelah setelah mendayung papan yang sebagian terendam air.
    - q: Apakah papan tiup membutuhkan ukuran berbeda dibandingkan papan keras?
      a: Tidak signifikan. Inflatable pada 15 tingkat+ PSI menggeser air mirip dengan papan keras. Rekomendasi volume berlaku sama untuk kedua jenis.
