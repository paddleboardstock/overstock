  title: 'Memahami Pasang Surut untuk Olahraga Air: Panduan Praktis'
  description: Bagaimana pasang surut SUPmemengaruhi kondisi berselancar, dan kayak. Membaca grafik pasang surut, memahami pasang surut musim semi vs neap, dan merencanakan sesi Anda berdasarkan pergerakan pasang surut demi keamanan.
  definition: Pasang surut adalah kenaikan dan turunnya permukaan laut setiap hari yang disebabkan oleh tarikan gravitasi bulan dan matahari. Rentang pasang surut bervariasi menurut lokasi dan siklus bulan.
  tldr: 'Dua pasang tinggi dan dua pasang rendah setiap hari di sebagian besar lokasi. Pasang surut musim semi (bulan purnama/bulan baru) memiliki jangkauan yang lebih besar dan arus yang lebih kuat. Pasang surut (bulan seperempat) memiliki jangkauan yang lebih kecil. Pasang surut memengaruhi kedalaman air, bentuk ombak, dan kekuatan arus. Untuk SUP: mendayung melawan arus terlebih dahulu agar membantu Anda kembali.'
  problem: Anda tiba di tempat terombak lokal dan mendapati hampir tidak ada ombak, ombak berbahaya dari pasang surut yang keluar, atau air yang terlalu dangkal. Tanpa memahami pasang surut, Anda membuang perjalanan atau mendayung dalam kondisi berbahaya.
  explanation: Pasang surut disebabkan oleh gravitasi bulan. Pasang surut musim semi (bulan purnama dan bulan baru) menghasilkan suhu tertinggi dan terendah terendah. Pasang surut (bulan seperempat) menghasilkan jangkauan minimal. Arus pasang surut paling cepat di tengah pasang, kendur di tinggi dan rendah. Rentang pasang surut bervariasi dari 0,3m (Mediterania) hingga 16m (Teluk Fundy).
  solution: 'Periksa grafik pasang surut sebelum setiap sesi. Untuk berselancar: istirahat pantai biasanya paling baik 2-3 jam di kedua sisi pasang tinggi. Untuk SUP: mendayung melawan arus di paruh pertama agar arus membantu kembali. Untuk memancing: pasang naik mendorong ikan ke dataran tinggi.'
  recommendation: Gunakan prediksi pasang surut NOAA atau aplikasi pasang lokal. Pelajari preferensi pasang surut lokal Anda dengan mencatat kondisi selama sebulan.
  faq:
    - q: Apa itu pasang surut musim semi?
      a: Pasang surut musim semi terjadi saat bulan purnama dan bulan baru, menghasilkan pasang tinggi yang lebih tinggi dan arus yang lebih kuat. Pasang surut terjadi dua kali sebulan.
    - q: Apa itu neap tide?
      a: Pasang surut Neap terjadi selama quarter moon. Rentang pasang surut lebih kecil, dan arus lebih lemah — baik untuk pemula.
    - q: Apakah air surut berbahaya untuk SUP?
      a: Air surut dapat mengekspos batu dan terumbu. Air surut juga memusatkan energi gelombang di pasir yang lebih curam.
    - q: Bagaimana pasang surut memengaruhi arus rip?
      a: Pasang keluar (surut) memperkuat arus rip. Air pasang masuk (banjir) mengurangi kekuatan rip.
