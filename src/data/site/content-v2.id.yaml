  title: 'Panduan Pembelian Jaket Keselamatan: Jenis, Ukuran, dan Fitur Dijelaskan'
  description: Panduan lengkap membeli jaket pelampung untuk olahraga air.PFD jenis (I sampai V), inflasi vs busa, pengujian kecocokan, dan rekomendasi khusus untuk SUPkayak, berperahu, dan memancing.
  definition: Jaket pelampung PFD adalah alat pelampung yang dirancang untuk menjaga kepala seseorang tetap di atas air. Jenis-jenis ini diatur oleh Penjaga Pantai AS berdasarkan daya apung dan tujuan penggunaan.
  tldr: 'Lima PFD jenis: Tipe I (lepas pantai, 22+ lb), Tipe II (dekat pantai), Tipe III (alat bantu pelampung, paling umum), Tipe IV (dapat dilempar), Tipe V (penggunaan khusus). Rompi tiup menawarkan kenyamanan tetapi memerlukan perawatan kartrid CO2. Rompi busa bebas perawatan tetapi lebih besar.'
  problem: Jaket pelampung dikategorikan berdasarkan jenis dan rating daya apung, tetapi toko tidak selalu menjelaskan tipe mana yang sesuai dengan aktivitas Anda.
  explanation: Tipe I memberikan daya apung paling banyak dan membuat pemakai yang tidak sadar menghadap ke atas. Tipe II tidak boleh membalikkan semua pemakai menghadap ke atas. Tipe III memungkinkan kebebasan bergerak untuk olahraga aktif. Tipe V mencakup paket sabuk tiup untuk SUP. PFD tiup memberikan daya apung 33-37 lb dan kompak saat kempes.
  solution: 'Untuk SUP: Paket sabuk tiup Tipe V. Untuk kayak: Busa Tipe III dengan potongan lengan tinggi. Untuk RIB berperahu: Busa Tipe III atau tiup dengan daya+ apung 22 lb. Untuk anak-anak: Busa Tipe II atau III dengan tali selangkangan.'
  recommendation: Aquafarer Rompi Pelampung Pro (tiup tipe V, 33 lb) untuk SUP dan kayak.Aquafarer Rompi Pelampung Classic (busa Tipe III, 16,5 lb) untuk RIB penggunaan berperahu dan kelautan umum.
  faq:
    - q: PFD Jenis apa yang saya butuhkanSUP?
      a: Banyak yurisdiksi menerima Tipe III atau Tipe V untuk SUP. Paket sabuk tiup sangat populer. Periksa hukum setempat.
    - q: Apakah PFD tiup perlu perawatan?
      a: Ya — periksa cartridge CO2 setiap tahun, ganti bobbin setiap 2-3 tahun, bilas setelah menggunakan air asin.
    - q: Bisakah saya memakai busa PFD selama SUP?
      a: Ya, tapi pilih yang memiliki potongan lengan tinggi. Rompi busa lebih besar tapi tidak memerlukan perawatan.
    - q: Apa PFD yang terbaik untuk anak?
      a: USCG-rompi busa Type II atau III yang disetujui dengan kerah, tali selangkangan, dan warna cerah. Jangan pernah menggunakan PFD tiup untuk anak-anak.
