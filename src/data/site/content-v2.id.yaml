  type: buying-guide
  title: 'SUP Panduan Tali: Penjelasan Tali Lurus vs Tali Tergulung'
  description: Panduan lengkap tentang SUP tali — lurus vs melengkung, pergelangan kaki vs betis, opsi pelepasan cepat, dan cara memilih tali yang tepat untuk kondisi mendayung Anda.
  definition: SUP Tali adalah tali yang mengikat pendayung ke papan, mencegah pemisahan. Jenisnya termasuk tali lurus (untuk berselancar dan sungai) dan tali melingkar (untuk air tenang).
  tldr: Tali pengikat paling baik untuk mendayung di air datar dan kebugaran — mereka tidak terlepas dari papan dan di luar air. Tali lurus digunakan untuk SUP berselancar dan sungai — memberikan lebih banyak kebebasan dan tidak tersangkut. Pemasangan betis lebih disukai daripada pergelangan kaki demi kenyamanan. Tali pelepas cepat penting untuk mendayung di sungai agar tidak terjebak.
  problem: Anda membeli tali dengan tali Anda SUP , tapi tidak yakin apakah itu jenis yang tepat untuk gaya mendayung Anda. Tali yang salah akan terseret, tersangkut, atau gagal saat Anda paling membutuhkannya.
  explanation: Tali lurus adalah tali nilon atau poliuretan sederhana yang menggantung di belakang papan. Mereka bekerja dengan baik saat berselancar karena tidak tersangkut pada sirip. Tali yang menggulung adalah tali spiral yang berkontraksi saat tidak berada di bawah tekanan — tali ini tetap melingkar di dek saat mendayung dan memanjang saat Anda jatuh. Mereka menjaga tali tetap di luar air dalam kondisi datar, mengurangi hambatan.
  solution: Pilih tali yang digulung untuk air datar, kebugaran, dan SUPtouring. Hambatan yang berkurang membantu menjaga kecepatan dan mencegah tali tersangkut pada objek bawah air. Pilih tali lurus untuk SUP berselancar dan mendayung di sungai. Desain lurus lebih kecil kemungkinan tersangkut pada sirip atau rintangan.
  recommendation: Aquafarer SUP Paket mencakup jenis tali yang sesuai untuk penggunaan papan yang dimaksudkan. Tali pengikat dalam SUP paket Explorer 11 sangat baik untuk mendayung secara menyeluruh.
  faq:
    - q: Haruskah tali terpasang di pergelangan kaki atau betis saya?
      a: Pemasangan anak sapi lebih disukai SUP — ini menjaga tali tetap di luar air saat mendayung dan mengurangi risiko tersandung saat berjalan.
    - q: Berapa panjang tali SUP sebaiknya?
      a: 8-10' untuk air tenang, 6-8' untuk selancar. Tali yang lebih pendek mengurangi hambatan tetapi membatasi kebebasan bergerak di papan.
    - q: Apakah saya perlu tali pelepas cepat untuk sungai?
      a: Ya — river SUP membutuhkan tali atau sabuk pelepas cepat yang bisa dilepas secara instan untuk mencegah terjebak pada saringan.
    - q: Bisakah saya menggunakan tali selancar untuk SUP?
      a: Tali selancar lebih pendek dan tipis. Cocok untuk SUP berselancar tapi tidak ideal untuk mendayung di air datar di mana tali yang lebih panjang dan menggulung lebih baik.
