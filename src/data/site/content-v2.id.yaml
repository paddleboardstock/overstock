  definition: Aquafarer RIB 330 adalah perahu tiup kaku berdiameter 10'10" (330 cm) dengan tabung tiup dan lantai aluminium V-hull kaku dengan transom fiberglass. Mampu menghasilkan tenaga hingga 15 hp.
