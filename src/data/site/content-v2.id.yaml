  title: 'Keamanan di Air Dingin: Mendayung dan Berselancar dalam Kondisi Dingin'
  description: Keamanan air dingin untuk SUPselancar, dan kayaking. Pengenalan hipotermia, perlengkapan yang sesuai, respons kejut dingin, dan prosedur darurat untuk perendaman air dingin.
  definition: Keselamatan air dingin melibatkan pemahaman tentang respons kejutan dingin, kegagalan berenang, hipotermia, serta peralatan dan teknik untuk mencegah hasil tersebut.
  tldr: Air di bawah 15C memerlukan wetsuit. Di bawah 10C diperlukan sepatu bot, sarung tangan, dan tudung. Sengatan dingin menyebabkan terengah-engah tanpa sengaja. Kegagalan berenang terjadi dalam waktu 3-5 menit di air di bawah 10C. Gejala hipotermia meliputi menggigil, bingung, dan kehilangan koordinasi.
  problem: Anda mendayung keluar di hari yang cerah tanpa menyadari suhu air 8C. Anda jatuh, terengah tanpa sadar, dan merasakan anggota tubuh mati rasa dalam hitungan menit. Air dingin membunuh lebih cepat daripada bahaya laut lainnya.
  explanation: 'Rendaman air dingin memiliki empat tahap: syok dingin (0-2 menit) — terengah-engah, hiperventilasi. Gagal berenang (3-15 menit) — otot dingin, koordinasi gagal. Hipotermia (15-45 menit) — suhu inti turun di bawah 35C menyebabkan kebingungan dan henti jantung. Runtuh pasca penyelamatan — darah dingin kembali ke inti.'
  solution: 'Periksa suhu air. Kenakan wetsuit yang sesuai dengan suhu. Jangan pernah mendayung sendirian di air di bawah 15C. Bawa peluit dan ponsel. Jika terjatuh: kendalikan pernapasan, pasang kembali papan dengan cepat. Jika terlalu dingin, beri sinyal minta bantuan.'
  recommendation: Aquafarer Wetsuit Pro 5/4/3mm adalah minimum untuk air 8-14C. Tambahkan Aquafarer sepatu bot 5mm dan sarung tangan 3mm. Kenakan Life Vest Pro untuk perlindungan termal ekstra.
  faq:
    - q: Berapa lama saya bisa bertahan di air 10C?
      a: Kejutan dingin berlangsung 1-2 menit. Tanpa pelampungan dan perlindungan termal, waktu bertahan hidup adalah 30-60 menit.
    - q: Apa tanda-tanda pertama hipotermia?
      a: Menggigil tak terkendali, bingung, koordinasi buruk, bicara cadel. Berhenti aktivitas dan segera pemanasan.
    - q: Bagaimana cara menghangatkan badan setelah sesi air dingin?
      a: Lepaskan perlengkapan basah, keringkan, kenakan lapisan hangat termasuk topi dan sarung tangan. Minum minuman non-alkohol hangat.
    - q: Apakah saya bisa mengalami hipotermia di musim panas?
      a: Ya — air di bawah 15C ditemukan di banyak lokasi bahkan di musim panas. Air menghantarkan panas 25 kali lebih cepat daripada udara.
