  title: 'Pemeliharaan Perahu Tiup: Jaga Investasi Anda'
  description: Daftar periksa perawatan perahu tiup tahunan. Pembersihan, UV perlindungan, inspeksi sambungan, manajemen tekanan, perawatan mesin, dan persiapan musim dingin untuk PVC Hypalon serta perahu.
  definition: Perawatan perahu tiup meliputi pembersihan, UV perlindungan, manajemen tekanan, inspeksi sambungan dan katup, pencegahan jamur, serta penyimpanan yang tepat di luar musim.
  tldr: Bilas setelah setiap kali menggunakan air asin. Oleskan UV pelindung setiap 2-3 bulan. Periksa tekanan angin sebelum setiap kali keluar. Periksa jahitan, katup, dan transom setiap bulan. Bersihkan dengan sabun ringan. Simpan dalam keadaan kempis di tempat yang sejuk dan kering saat musim sepi.
  problem: Anda menggunakan perahu tiup Anda selama satu musim dan sekarang tabungnya tampak memudar, sambungan air sobek, dan transomnya terasa lembek — semua itu bisa dicegah dengan perawatan rutin.
  explanation: UV radiasi menguraikan matriks polimer. Air asin mengkristal dalam lipatan dan menggores kain. Jamur tumbuh dalam kelembapan yang terperangkap. Tekanan yang salah menyebabkan kelelahan material. Transom (terutama trilek) menyerap air melalui lubang sekrup.
  solution: 'Setelah setiap penggunaan: bilas dengan air bersih, keringkan, periksa tekanan. Setiap bulan: lap tabung dengan UV pelindung, periksa sambungan, tutup cek. Setiap tahun: bersihkan secara mendalam, periksa transom untuk pembusukan, pelumasi katup, uji kebocoran mikro.'
  recommendation: Gunakan 303 Aerospace Protectant pada Aquafarer tabung kapal. Lepaskan katup dan oleskan gemuk silikon setiap tahun. Simpan di tas bawaan bersama paket desikan.
  faq:
    - q: Bisakah saya menggunakan pemutih untuk membersihkan perahu tiup saya?
      a: Tidak — pemutih merusak lapisan kain. Gunakan sabun ringan dan air hangat. Untuk jamur, gunakan cuka putih yang diencerkan.
    - q: Seberapa sering saya harus mengobati dengan UV pelindung?
      a: Setiap 2-3 bulan selama musim penggunaan. Lebih sering di iklim tropis.
    - q: Apakah saya perlu mengempiskan perahu saya di antara penggunaan?
      a: Tidak jika digunakan setiap minggu. Biarkan mengembang dengan UV penutup. Untuk celah bulanan, kempiskan dan simpan.
    - q: Bagaimana cara merawat transom?
      a: Periksa baut setiap bulan. Segel tepi kayu yang terbuka dengan pernis laut setiap tahun. Ganti jika ada titik lunak.
