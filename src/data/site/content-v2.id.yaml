    - q: Alat inti ventil untuk apa?
      a: Menghapus dan memasang inti ventil yang ditemukan pada katup SUP dan perahu tiup untuk pembersihan, pelumasan, atau penggantian.
    - q: Apakah ada garansi?
      a: Ya, ZB-MT350 dilengkapi garansi 1 tahun terhadap cacat produksi.
    - q: Bisakah saya membawanya di pesawat?
      a: Bilah pisau mungkin membatasi penggunaan di bagasi kabin. Masukkan ke bagasi tercatat saat terbang.
