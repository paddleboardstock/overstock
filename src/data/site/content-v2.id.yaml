- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'SUP Hidrasi dan Perlindungan Matahari: Tetap Aman di Air'
  description: Strategi hidrasi dan perlindungan matahari yang penting untuk SUP para pendayung. Dehidrasi dan terbakar matahari adalah masalah yang paling umum SUP — bagaimana mencegah keduanya selama sesi panjang.
  definition: SUP Hidrasi berarti menjaga keseimbangan cairan saat mendayung dengan asupan air secara teratur. Perlindungan dari sinar matahari melibatkan penggunaan SPF, pakaian pelindung, dan sesi waktu untuk menghindari puncakUV.
  tldr: Minum 500ml air per jam mendayung. Bawa lebih banyak dari yang Anda kira Anda butuhkan — kandung kemih 2L atau beberapa botol. Oleskan tabir surya SPF 50 tahan air+ sebelum mendayung dan aplikasikan ulang setiap 2 jam. Kenakan topi, kacamata hitam dengan tali, dan pakaian bersertifikat UPF. Hindari mendayung pukul 11 pagi sampai 3 sore saat UV waktu paling kuat.
  problem: Anda sedang menjalani sesi yang hebat SUP , tapi setelah satu jam Anda mengalami sakit kepala, mulut kering, dan kulit Anda terasa terbakar. Dehidrasi dan terbakar matahari datang karena air menjaga Anda tetap sejuk.
  explanation: Pantulan dari air memperkuat UV paparan hingga 40%. Efek pendinginan air dan angin menutupi kulit terbakar matahari hingga terlambat. Keringat dari mendayung meningkatkan kehilangan cairan, dan seringkali tidak ada tempat untuk mengisi ulang air di air. Dehidrasi mengganggu keseimbangan dan pengambilan keputusan, meningkatkan risiko kecelakaan.
  solution: Pasang botol air atau kantong hidrasi ke sistem bungee papan. Minum setiap 15 menit, baik haus maupun tidak. Oleskan+ tabir surya SPF 50 30 menit sebelum peluncuran. Kenakan topi bertepi lebar, kacamata hitam polarisasi dengan tali, dan+ pelindung ruam UPF 50. Oleskan tabir surya kembali setiap 2 jam.
  recommendation: Gunakan kandung kemih hidrasi yang diikat di D-ring depan Anda Aquafarer SUP. Kenakan+ pelindung ruam UPF 50 di bawah PFD. Gunakan tabir surya tahan air yang tetap terpakai di keringat dan air.
  faq:
    - q: Berapa banyak air yang harus saya bawa saat SUP perjalanan?
      a: Minimal 1 liter per jam. Untuk sesi 2 jam, bawa 2 liter. Lebih banyak saat cuaca panas. Kandung kemih hidrasi paling efektif.
    - q: Jenis tabir surya apa yang paling cocokSUP?
      a: Tahan air,+ SPF 50 spektrum luas. Tabir surya mineral (seng oksida, titanium dioksida) aman untuk terumbu dan bertahan lebih lama.
    - q: Apakah air benar-benar memantulUV?
      a: Ya — air memantulkan hingga 40% UV radiasi, artinya Anda mendapatkan UV dari atas dan bawah. Ini meningkatkan risiko terbakar secara signifikan.
    - q: Apakah saya bisa terbakar matahari dengan rash guard?
      a: Rash guard standar memberikan UV perlindungan minimal (sekitar UPF 10-20). Cari+ pakaian bersertifikat UPF 50 untuk perlindungan penuh.
