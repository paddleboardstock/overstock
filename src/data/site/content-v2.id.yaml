- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP Panduan Anchor: Tetap di tempat saat memancing atau fotografi'
  description: Panduan lengkap untuk SUP menambatkan — jenis jangkar (jamur, lipat, pasak), pengaturan troli jangkar, teknik penempatan, dan pertimbangan keselamatan untuk tetap di posisi.
  definition: SUP Jangkar adalah pemberat yang dipasang pada tali yang menahan papan agar tetap berada di posisi melawan angin dan arus. Jenis yang umum meliputi jangkar jamur, jangkar lipat, dan tiang pengintai.
  tldr: Gunakan jangkar jamur (1,5-3 lb) untuk dasar berlumpur atau berpasir, jangkar lipat untuk dasar berbatu, atau tiang pengawas untuk air dangkal dengan dasar lunak. Jangkar harus 1,5-3 lb untuk kondisi tenang, 3-5 lb untuk angin dan arus. Selalu gunakan troli jangkar untuk mengatur posisi dan tahu kapan harus melepaskan.
  problem: Anda menemukan tempat memancing yang sempurna tetapi angin dan arus membuat Anda tersesat setiap beberapa menit. Tanpa berlabuh, SUP memancing dan fotografi adalah latihan yang membuat frustrasi karena harus terus-menerus berpindah posisi.
  explanation: Jangkar bekerja dengan menyeret melintasi dasar hingga tersangkut. Jangkar jamur menembus dasar yang lunak dan memberikan cengkeraman yang baik di pasir dan lumpur. Jangkar lipat memiliki fluke yang menggali dasar keras atau berbatu. Tiang pengintaian bekerja di perairan dangkal dengan mendorong langsung ke dasar.
  solution: Pasang sistem troli jangkar (tali dengan cincin geser di salah satu sisi papan) untuk mengatur titik pemasangan jangkar. Pasang tali setebal 50-75' ke jangkar. Lepaskan arus melawan angin atau naik dari posisi yang Anda inginkan. Gunakan sistem pelepas cepat untuk melepaskan saat keadaan darurat. Jangan pernah menambatkan saat arus kuat atau saat Anda tidak mudah mengambil jangkar.
  recommendation: Jangkar lipat seberat 3 lb dengan tali 50' cocok untuk sebagian besar SUP kondisi memancing. Tambahkan sistem troli jangkar menggunakan cincin D pada Aquafarer SUP Explorer 11 Anda.
  faq:
    - q: Ukuran jangkar berapa yang saya butuhkanSUP?
      a: 1,5-3 lb untuk danau tenang dan sungai yang lambat. 3-5 lb untuk daerah pesisir dengan angin atau arus. Jangkar berukuran besar sulit diambil.
    - q: Berapa banyak tali jangkar yang saya butuhkan?
      a: Scope 5:1 (5 kaki tali untuk setiap 1 kaki kedalaman) adalah standar. Di 10' air, gunakan 50' line.
    - q: Apakah anchoring berbahaya pada SUP?
      a: Hanya jika Anda berlabuh di arus atau angin yang cukup kuat untuk membuat papan terbalik. Selalu gunakan sistem pelepas cepat yang bisa langsung dilepas.
    - q: Bisakah saya berlabuh di air mana pun?
      a: Periksa peraturan lokal. Beberapa area membatasi penjangkaran untuk melindungi lamun laut atau habitat laut. Jangan pernah berlabuh di terumbu karang.
