  category: guide
  type: safety
  title: 'Perencanaan Cuaca untuk Olahraga Air: Baca Prakiraan Cuaca Seperti Profesional'
  description: Cara membaca prakiraan cuaca laut untuk SUP, selancar, dan berperahu. Memahami front, sistem tekanan, pola angin, dan peringatan cuaca untuk merencanakan sesi yang aman.
  definition: Perencanaan cuaca berarti menafsirkan prakiraan laut — kecepatan dan arah angin, tinggi dan periode ombak, curah hujan, visibilitas, dan peringatan cuaca ekstrem.
  tldr: 'Periksa tiga prakiraan sebelum setiap sesi: angin, gelombang, dan cuaca. Kondisi terbaik: angin ringan di lepas pantai, gelombang sedang, tekanan tinggi atau naik. Hindari: badai petir, angin lepas pantai yang kuat, kabut, dan tekanan yang turun dengan cepat.'
  problem: Anda berkendara ke pantai berdasarkan prakiraan 3 hari yang menjanjikan kondisi baik, hanya untuk menemukan angin dan hujan 25 knot. Cuaca laut sulit diprediksi.
  explanation: Tekanan tinggi membawa cuaca stabil dan angin ringan. Tekanan rendah membawa angin dan badai. Gradien tekanan menentukan kecepatan angin. Front dingin membawa perubahan angin secara tiba-tiba. Efek lokal seperti angin laut dapat mengalahkan prakiraan umum.
  solution: 'Gunakan beberapa sumber: Windy.com, NOAA, kamera selancar lokal. Periksa 24 jam sebelumnya dan periksa ulang pada pagi hari berikutnya. Cari prakiraan yang konsisten di berbagai model. Pelajari mikroklimat lokal.'
  recommendation: Tandai Windy.com untuk tempat lokal Anda. Bawa ponsel dalam casing tahan air. Untuk berperahu, bawa radio VHF untuk siaran cuaca. Jika ragu, tetaplah di darat.
  faq:
    - q: Cuaca apa yang sebaiknya saya hindariSUP?
      a: Badai petir (petir), kabut (visibilitas nol), angin lepas pantai lebih dari 10 knot, angin lebih dari 20 knot, tekanan turun.
    - q: Seberapa akurat prakiraan kelautan?
      a: Prakiraan 3 hari sekitar 80% akurat. Prakiraan hari sebelumnya akurat 90%+ untuk angin.
    - q: Apa tren barometrik yang baik untuk olahraga air?
      a: Tekanan yang naik atau stabil menunjukkan kondisi yang membaik. Tekanan turun (1+ mb/jam) menandakan badai yang mendekat.
    - q: Bolehkah saya SUP dalam kabut?
      a: Tidak disarankan. Jika terjebak kabut, gunakan kompas atau GPS, bunyikan peluit setiap 30 detik, dan tetap dekat dengan pantai.
