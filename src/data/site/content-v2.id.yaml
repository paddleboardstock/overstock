  title: Aturan Etiket Selancar (Cara Tidak Menjadi Orang yang Dihindari Semua Orang)
  description: Lineup punya aturan dan tidak ada yang menuliskannya. Pelajari dengan cara yang tepat, mengapa memutar akan membuatmu dimarahi, cara meminta maaf, dan kesalahan pemula yang mengganggu setiap peselancar lokal.
  definition: 'Etika selancar adalah kode etik tidak tertulis yang mencegah tabrakan dan membagi ombak secara adil. Aturan inti: peselancar yang paling dekat dengan puncak ombak yang pecah memiliki hak jalan.'
  tldr: Peselancar yang paling dekat dengan puncak ombak yang pecah memiliki hak jalan. Jangan tiba-tiba mendekati seseorang, jangan melengkung (mendayung mengelilingi seseorang untuk mengambil ombaknya), dan selalu minta maaf jika Anda melakukan kesalahan. Dayung lebar di sekitar barisan, pegang papan Anda, dan bersikap ramah — rasa hormat mendapatkan rasa hormat.
  problem: Anda mendayung ke barisan yang penuh dan langsung merasakan ketegangan. Para peselancar menatap Anda dari samping, seseorang berteriak pada Anda, dan Anda tidak yakin apa yang salah dengan Anda. Sisi sosial dari berselancar terasa lebih menakutkan daripada ombaknya sendiri.
  explanation: 'Etika selancar ada untuk mencegah tabrakan dan membagi ombak secara adil. Aturan dasarnya adalah hak jalan: peselancar yang paling dekat dengan puncak (tempat ombak pertama kali pecah) memiliki prioritas. Siapa pun yang mendayung untuk ombak yang sama dari dalam harus mundur. Snaking — mendayung mengelilingi peselancar lain untuk merebut prioritas — dianggap sebagai pelanggaran terburuk. Selain prioritas, barisan memiliki ekspektasi tentang kebisingan (jaga teriakan seminimal mungkin), kontrol papan (jangan biarkan papan Anda mendekati orang lain), dan keramahan (anggukan sederhana sangat membantu).'
  solution: Perhatikan barisan selama 10 menit sebelum mendayung keluar. Identifikasi siapa yang menangkap ombak paling banyak — itulah peselancar yang harus dihormati dan dihindari. Tetaplah di dalam (zona air deras) jika Anda sedang belajar. Dayung lebar mengelilingi barisan, jangan melewatinya. Saat Anda menangkap ombak, lihat ke kiri sebelum naik dan pastikan tidak ada yang lebih dalam.
  recommendation: Habiskan beberapa sesi pertama Anda di tempat istirahat yang ramah pemula dengan kerumunan yang tersebar. Pelajari membaca prioritas sebelum mencoba lineup yang padat. Jika Anda tiba-tiba menemui seseorang, segera minta maaf dan mendayung ke sana — kebanyakan peselancar menghormati kesalahan yang jujur.
  faq:
    - q: Apa itu drop-in?
      a: Turun ke dalam berarti mendayung dan menunggangi ombak yang sudah menjadi prioritas peselancar lain. Ini berbahaya dan tidak sopan. Peselancar terdekat dengan puncak adalah penguasaan ombak; siapa pun yang lain harus menari.
    - q: Apa itu snaking?
      a: Snaking adalah mendayung mengelilingi peselancar lain yang sudah siap untuk meluncur sehingga Anda lebih dekat ke puncak. Ini dianggap sangat buruk sebagai etika dan bisa menimbulkan konfrontasi.
    - q: Apakah pemula bisa berselancar di tempat yang ramai?
      a: Ya, tapi tetaplah di zona air deras jauh dari puncak. Jangan mendayung ke area utama lepas landas sampai Anda bisa menangkap ombak secara konsisten dan mengendalikan arah. Barisan yang padat membutuhkan pengalaman untuk menavigasi dengan aman.
    - q: Bagaimana cara meminta maaf di air?
      a: Lambaian sederhana, senyuman, dan "maaf" atau "maaf" sudah cukup. Akui kesalahan dan dayung menjauh dari orang tersebut. Para peselancar umumnya memaafkan kesalahan jujur, terutama jika Anda jelas sedang belajar.
    - q: Apa yang harus saya lakukan jika ada orang yang tiba-tiba datang ke saya?
      a: Jika itu adalah drop-in yang jelas, teriakkan "lambaikan" atau "hey" untuk memberi tahu mereka. Jika mereka tidak sengaja menangkapnya dan meminta maaf, biarkan saja. Jika seseorang berulang kali mampir, mendayung dan jelaskan prioritas dengan sopan. Hindari konfrontasi.
