origin:
  tagline: 'أصلنا'
  heading: "بُني على الماء,<br />\n<span class=\"text-sky-600\">مدفوع بالهدف</span>"
  paragraphs:
    - 'بدأت Aquafarer في ورشة ساحلية بقارب واحد ومعتقد راسخ: يجب أن تُهندس المنتجات البحرية وكأنها مهمة — لأنها كذلك بالفعل.'
    - 'رأى مؤسسا الشركة، وهما مهندسان بحريان، صناعةً تُقتطع فيها الزوايا وتُخفَّض جودة المواد ويُتعامل مع السلامة كخيار شكلي. بنيا أول هيكل Aquafarer ليس بحثاً عن الربح، بل لإثبات أن المعدات البحرية المعقولة التكلفة يمكن أن تكون موثوقة حقاً.'
    - 'ذلك الهيكل الأول لا يزال في الخدمة حتى اليوم. وهذا المبدأ لم يتغير قط.'
    - 'لسنا أكبر مصنع. لا نصنع أرخص المنتجات. لكن كل هيكل يغادر ورشتنا يمر عبر الأيدي نفسها التي أسست الشركة — ويلبي المعيار نفسه الذي وضعه الهيكل الأول.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/tech-meeting-small.webp
  image_alt: 'ورشة Aquafarer الساحلية'

philosophy:
  tagline: 'فلسفتنا'
  heading: 'راسخون في المحيط'
  description: 'المحيط ليس مكان عملنا. إنه معلمنا. كل قرار تصميمي يبدأ بفهم كيف يتصرف الماء، وكيف تتغير الظروف، وكيف يجب أن تستجيب المعدات.'
  cards:
    - emoji: "\U0001F30A"
      title: 'احترام الماء'
      description: 'الماء لا يمكن التنبؤ به. تُهندس منتجاتنا لأقسى الظروف، لا لأفضلها. إذا استطاع الهيكل مواجهة تيار عكسي قوي، فسيواجه البحيرة بسهولة. إذا عملت سترة النجاة في عرض البحر، فهي مصممة بحد زائد للنهر — وهذا مقصود.'
    - emoji: "\U0001F527"
      title: 'مصمم ليدوم، لا ليُستبدل'
      description: 'المنتج الأكثر استدامة هو الذي لا يحتاج إلى استبدال. اختير PVC بدرجة بحرية وHypalon وبنية drop-stitch من أجل طول العمر. ما زلنا نشحن قطع الغيار لهياكل بنيناها قبل عقد من الزمن.'
    - emoji: "\U0001F3C6"
      title: 'الإتاحة بالتصميم'
      description: 'ينبغي ألا تكون الرياضات المائية رفاهية. نهندس منتجات تقدم أداءً بمستوى احترافي بسعر منطقي للعائلات والمرشدين والمشغلين الصغار — وليس للأساطيل التجارية فقط.'

design:
  tagline: 'فلسفة التصميم'
  heading: "مُهندس عند حافة<br />\n<span class=\"text-sky-600\">الظروف</span>"
  paragraphs:
    - 'يبدأ كل منتج من Aquafarer بسؤال واحد: <em>ما أقسى حالة سيواجهها؟</em> نصمم من الحافة إلى الداخل، لا من المركز إلى الخارج.'
    - 'أنويتنا drop-stitch معتمدة لضغط 15 PSI — ليس لأن 12 PSI غير كافية للبحيرة، بل لأن لوح 15 PSI يواجه الموج المفاجئ دون انحناء. أنابيب Hypalon لدينا مصممة لمقاومة UV بدرجة تجارية — ليس لأن كل عميل يتجدف في المناطق الاستوائية، بل لأن تدهور UV هو السبب الأول للفشل المبكر.'
    - 'نحن لا نصمم وفقاً لسعر. نصمم حتى نقطة الفشل — ثم نبني فوقها بمسافة آمنة.'
  image: https://assets.aquafarer.com/images/aquafarer/hero/aquafarer-hero-design-concept.webp
  image_alt: 'التصميم والهندسة في Aquafarer'
  stats:
    - value: '15'
      label: 'تصنيف النواة<br />PSI'
    - value: '1,500+'
      label: 'ساعات اختبار<br />UV'
    - value: '10 سنوات'
      label: 'عمر<br />الهيكل'
