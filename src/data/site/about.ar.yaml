business_model:
  tagline: نموذج أعمالنا
  heading: مخزون زائد، يباع مباشرة في المصنع
  paragraphs:
    - Paddle Board Overstock تبيع ألواح قابلة للنفخ جديدة SUP بأسعار فائضة وأسعار التخليص — حتى 60٪ خصم عادي. نحصل على المخزون الفائض والفائض بكميات كبيرة، ثم ننقل التوفير إلى المجدفين وتجار التجزئة الصغار.
    - 'إلى جانب المبيعات بالتجزئة، نقدم تجار التجزئة الصغار بنماذج مختلطة بالجملة: اطلب 5–20 لوحا، وامزج أي نماذج في شحنة واحدة، وادفع الطبقة بالجملة عن الكمية الإجمالية. كل طلب يشحن مباشرة من ويهاي، الصين.'
sourcing:
  tagline: من أين يأتي مخزوننا الزائد
  heading: مصادر مختلطة، معيار جودة واحد
  paragraphs:
    - 'مخزوننا يأتي من مصدرين: دفعات الإنتاج الفائضة من عمليات التصنيع الخاصة بنا في ويهاي، ومخزون فائض مختارة من شركاء إنتاج آخرين نراجع ونعمل معهم مباشرة.'
    - كل لوح نبيعه جديد تماما وغير مستخدم. المخزون الزائد يشير إلى السعر — وليس الحالة.
manufacturing:
  tagline: خلفيتنا في التصنيع
  heading: بنيت في ويهاي منذ 2012
  paragraphs:
    - لقد صنعنا ألواح قابلة للنفخ SUP في ويهاي، شاندونغ منذ عام 2012. تنتج منشأتنا الإنتاجية التي تبلغ مساحتها 12,000 متر مربع 15,000 وحدة قابلة للنفخ سنويا بفريق مكون من 200–300 عامل و14+ مهندس بحث وتطوير.
    - 'أحد مبادئ التصميم لم يتغير منذ اللوحة الأولى: نصمم حتى نقطة فشل، ثم نبني فوقها بكثير.'
  image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/factory/paddleboardoverstock-factory-building.webp
  image_alt: Paddle Board Overstock مبنى المصنع في ويهاي
  stats:
    - value: '2012'
      label: التصنيع منذ
    - value: 12000 متر مربع
      label: منشأة الإنتاج
    - value: 15,000
      label: وحدات في السنة
    - value: 14+
      label: مهندسو البحث والتطوير
inspection:
  tagline: كيف نفحص كل SUP لوحة
  heading: كل لوحة تم اختبارها، ولم يتم أخذ عينات منها
  paragraphs:
    - SUP كل لوحة تخضع لاختبار ضغط بنسبة 100٪ عند ضغط 1.25 ضعف ضغطها المصنف لمدة 24–48 ساعة قبل الموافقة على بيعها. الألواح التي تفشل لا تشحن أبدا.
    - 99.3٪ من اللوحات تجتاز الفحص النهائي في المرة الأولى. أما الجزء المتبقي فيتم إصلاحه أو تخصيصه — ولا يتم خصمه أبدا في أي طلب.
why_prices_lower:
  tagline: لماذا أسعارنا أقل
  heading: اقتصاديات المخزون الزائد، وليس الاختصار
  paragraphs:
    - 'أسعارنا أقل لأسباب هيكلية: نبيع المخزون الزائد والفائض مباشرة من ويهاي، دون هامش ربح للبيع بالتجزئة، ولا طبقات موزعة، ولا تكاليف صالات عرض.'
    - الألواح نفسها بجودة إنتاج كاملة — نفس drop-stitch النوى، نفس التخصص البحريPVC، نفس الاختبار مثل الألواح المتوفرة بسعر كامل.
shipping_network:
  tagline: شبكة الشحن الدولية لدينا
  heading: الشحن الجوي السريع أو الشحن البحري الموحد
  paragraphs:
    - ترسل الطلبات من ويهاي، الصين. الشحن الجوي السريع يحمل عينات و1–3 طلبات لوح؛ تخدم شركة الشحن البحري الموحدة طلبات جملة من 5 إلى 20 على متن الألواح إلى 50+ دولة.
    - كل عرض يتضمن تقديرا للعبور لوجهتك، بالإضافة إلى الفواتير التجارية وقائمة التعبئة المطلوبة للتخليص الجمركي.
  cards:
    - title: الشحن الجوي المعجل
      description: للعينات وطلب 1–3 ألواح — توصيل سريع إلى باب منزلك، التسعير حسب الوجهة.
    - title: الشحن البحري المجمع
      description: لطلبات الجملة من 5–20 لوح — شحن اقتصادي إلى الموانئ الرئيسية، التسعير حسب الوجهة.
warranty_support:
  tagline: الضمان ودعم العملاء
  heading: ضمان لمدة سنتين SUP على كل لوح
  paragraphs:
    - يتم شحن كل لوح مع ضمان لمدة سنتين SUP. إذا ظهرت أي عيوب مغطاة خلال فترة الضمان، اتصل بفريق الدعم لدينا وسنقوم بإصلاح الوضع.
    - يتم التعامل مع الدعم من قبل نفس الفريق الذي يدير طلبك. يمكنك التواصل معنا في أي وقت من خلال نموذج الاتصال أو بالرد على تأكيد طلبك.
