cases:
  - id: beginner
    title: 초보자 패들링
    desc: 초보자를 위한 안정적인 인플레이션 SUP 보드.
    scenario: 주말에 호수를 방문한 가족이 패들보딩을 시도하고 싶어 합니다. 그들은 안정적이고 쉽게 띄울 수 있는 장비와 명확한 안전 지침이 필요합니다.
    solution: SUP Explorer 11는 초보자를 위해 넓은 몸체 안정성을 제공합니다. Life Vest Classic는 CE 인증 부력을 보장합니다. Oars & Pump Set는 10분 이내에 보드를 부풀립니다.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Oars & Pump Set
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: touring
    title: 투어링 & 탐험
    desc: 호수, 강, 해안 여행을 위한 장거리 인플레이션 SUP 보드.
    scenario: 한 야외 활동가가 일주일간 패들링 여행을 계획하며, 작은 사이즈로 포장되며 캠프장에서 부풀 수 있고, 열린 물에서 직진을 유지하는 보드가 필요합니다.
    solution: Ocean Voyager Series는 투어링 윤곽으로 효율적으로 활주하며 바람과 파도에서도 코스를 유지합니다. drop-stitch 구조는 단단한 보드 강도를 위해 15 PSI까지 부풀 수 있습니다.
    products:
      - Ocean Voyager Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-ocean-voyager-1.webp
  - id: yoga
    title: SUP 요가 & 피트니스
    desc: 요가, 피트니스 및 휴식을 위한 초광폭 안정 플랫폼.
    scenario: 요가 수련자가 잔잔한 물 위에서 아침 세션을 위한 플로팅 스튜디오를 원하며, 모든 포즈를 취할 수 있는 충분한 데크 공간이 필요합니다.
    solution: Flowing Lotus Series는 전체 길이 데크 패드와 흔들림 없는 포즈를 위한 넓은 빔을 특징으로 합니다. 가벼운 피트니스 운동에도 안정적인 플랫폼으로 사용됩니다.
    products:
      - Flowing Lotus Series
      - Oars & Pump Set
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-flowing-lotus-1.webp
  - id: family-recreation
    title: 가족 레크리에이션
    desc: 주말 호수 여행과 휴일을 위한 완전한 SUP 패키지.
    scenario: 네 명 가족은 주말 호수 나들이와 해변 휴가를 위한 안정적인 보드를 원하며, 차에 실어 쉽사리 휴대하고 몇 분 만에 부풀 수 있는 장비를 필요로 합니다.
    solution: Tropical Breeze Series는 가족 모두가 사용할 수 있는 안정적인 올어라운드 보드이며, Medusa Glow Series은 어린이를 위해 더 가볍고 짧습니다. 둘 다 쉽게 여행할 수 있도록 배낭에 담아 포장할 수 있습니다.
    products:
      - Tropical Breeze Series
      - Medusa Glow Series
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-tropical-breeze-1.webp
