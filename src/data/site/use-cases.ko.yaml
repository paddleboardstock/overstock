cases:
  - id: beginner
    title: 초보자용 수상 스포츠
    desc: 처음 사용하는 사람들을 위한 안정적인 SUP 보드와 카약.
    scenario: 주말에 호수를 방문한 가족이 패들보딩을 시도하고 싶어 합니다. 그들은 안정적이고 쉽게 띄울 수 있는 장비와 명확한 안전 지침이 필요합니다.
    solution: SUP Explorer 11은 초보자를 위한 넓은 바디 안정성을 제공합니다. Life Vest Classic은 CE 인증 부력을 보장합니다. Dual-Action Pump는 두 보드를 10분 이내에 부풀립니다.
    products:
      - SUP Explorer 11
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/sup-series/sup-cheetah-surge-1.webp
  - id: river-touring
    title: 야외 탐험
    desc: 강, 호수, 해안 여행용 휴대용 카약과 딩기 배.
    scenario: 한 야외 활동 애호가는 일주일간 강 여행을 계획하며, 작게 포장되고 캠프장에서 부풀릴 수 있으며 다양한 조류를 견딜 수 있는 보트가 필요합니다.
    solution: Kayak Lite는 배낭에 들어가며 4분 이내에 부풀립니다. drop-stitch 구조는 호수, 느린 강, 해안 패들링을 견딥니다.
    products:
      - Inflatable Kayak Lite
      - Carbon Paddle
      - Life Vest Classic
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/paddleboardoverstock-inflatable-boat.webp
  - id: professional-operations
    title: 전문 운영
    desc: 투어 운영자 및 긴급 대응을 위한 상업용 등급 RIBs.
    scenario: 한 해안 투어 운영자는 다양한 해상 조건에서 매일 운행할 수 있으며 상업 안전 규정을 준수하는 내구성 있는 보트 함대를 필요로 합니다.
    solution: RIB 330 및 RIB 450 Patrol은 Hypalon 튜브가 장착된 유리섬유 딥-V 선체를 사용하여 모든 날씨에서 내구성을 제공합니다. 여러 단위를 배치해도 일관된 성능을 유지할 수 있습니다.
    products:
      - RIB 330
      - RIB 450 Patrol
      - Life Vest Pro
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/use-cases/paddleboardoverstock-professional-use-case.webp
  - id: family-recreation
    title: 가족 레크리에이션
    desc: 당일 여행, 낚시 및 수상 스포츠용 넓은 딩기 배.
    scenario: 네 가족이 주말 호수 나들이, 낚시 여행, 아이들을 위한 튜브 견인을 위한 안정적인 보트를 원합니다.
    solution: AirDeck 360은 최대 다섯 명이 앉을 수 있는 강화된 에어 데크 바닥을 갖추고 있습니다. 발사 지점에서 부풀리고, 차에 보관하며, 잔잔한 호수와 보호된 해안 수역 모두를 다룰 수 있습니다.
    products:
      - AirDeck 360
      - Life Vest Classic
      - Dual-Action Pump
    image: https://assets.paddleboardoverstock.com/images/paddleboardoverstock/products/rib/paddleboardoverstock-rib-330-boat.webp
