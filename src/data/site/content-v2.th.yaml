- slug: paddle-board-size-guide
  category: guide
  type: buying-guide
  title: 'คู่มือขนาดกระดานพาย: ปริมาตร ความยาว และความกว้างสําหรับนักขี่แต่ละคน'
  description: ขนาดกระดานพายครบชุดพร้อมคําแนะนําปริมาตรตามน้ําหนักและกิจกรรมมีตารางขนาดที่ใช้งานง่ายสําหรับกระดานอเนกประสงค์ กระดานทัวร์ กระดานโต้คลื่น และโยคะSUP
  definition: ขนาดกระดานพายถูกกําหนดโดยปริมาตร (น้ําหนัก ความจุและลอยตัว), ความยาว (ความเร็วและทิศทาง), ความกว้าง (ความมั่นคง), และความหนา (การกระจายปริมาตรและแรงต้านลม)
  tldr: 'ใช้น้ําหนักเพื่อหาปริมาตรขั้นต่ํา: 50-70 กก. ต้องการ 220-260 ลิตร, 70-90 กก. ต้องการ 260-300 ลิตร, 90-110 กก. ต้องการ 300-350 ลิตร, 110+ กก. ต้องการ 350+ลิตรสําหรับมือใหม่ ให้เพิ่ม 20% เข้าไปในตัวเลขเหล่านี้ความกว้างสําคัญ: 32" คือระดับกลาง, 33-34" เหมาะกับมือใหม่, 35"+ คือความมั่นคงมาก'
  problem: รายการขนาดกระดานพายใช้ฟุต นิ้ว และลิตรสลับกันได้ ทําให้เปรียบเทียบระหว่างแบรนด์ได้ยาก
  explanation: ปริมาตรเป็นตัวชี้วัดที่ตรงที่สุดสําหรับน้ําหนัก — น้ําจืด 1 ลิตรจะแทนที่น้ําหนัก 1 กิโลกรัมบอร์ดขนาด 260 ลิตรสามารถรับน้ําหนักได้ 260 กิโลกรัมในทางทฤษฎี แต่ความจุจริงจะต่ํากว่าเพราะบอร์ดต้องอยู่เหนือผิวน้ําน้ําหนักรวมของคุณ (ตัวถังและอุปกรณ์) ควรอยู่ที่ 30-40% ของปริมาตรบอร์ด
  solution: ปริมาตรเป้าหมาย = (น้ําหนักตัวเป็นกิโลกรัม + น้ําหนักเกียร์เป็นกิโลกรัม) x 3 สําหรับนักพายน้ําหนัก 75 กิโลกรัมที่ใช้เกียร์ 5 กิโลกรัม เป้าหมาย = 80 x 3 = ขั้นต่ํา 240L สําหรับมือใหม่ คูณด้วย 3.5 สําหรับผู้ฝึกขั้นสูง คูณด้วย 2.5
  recommendation: Paddle Board Overstock SUP Explorer 11 (260L, 11' x 33" x 6") เหมาะกับนักปั่นส่วนใหญ่ที่มีน้ําหนัก 50-100 กก.นักปั่นที่น้ําหนักเบาสามารถAirDeckเลือกขนาด 270 ได้นักปั่นที่น้ําหนักมากควรพิจารณาSUPบอร์ด Tour 12 (300L+) หรือบอร์ดที่กว้างกว่า
  faq:
    - q: ความสูงมีผลต่อSUPขนาดไหม?
      a: ความสูงไม่สําคัญเท่าน้ําหนักนักปั่นที่สูงและน้ําหนักเบาต้องการปริมาตรน้อยกว่านักปั่นตัวเตี้ยและหนักใช้น้ําหนักเป็นตัวกําหนดปริมาตรหลัก
    - q: ถ้ามีปริมาตรมากเกินไปจะเกิดอะไรขึ้น?
      a: บอร์ดสูงเกินไป รับลมเหมือนใบเรือรู้สึกเหมือนมีกลิ่นจุกไม้ก๊อกในคลื่นแต่สําหรับมือใหม่ ปริมาณที่เพิ่มขึ้นดีกว่ามีน้อยเกินไป
    - q: จะเกิดอะไรขึ้นถ้าปริมาตรน้อยเกินไป?
      a: บอร์ดจะอยู่ลึกเกินไป ทําให้เกิดแรงต้านหัวบอร์ดอาจจมลงน้ําขณะพาย (pearling)คุณจะเหนื่อยเร็วจากการพายบอร์ดที่จมน้ําบางส่วน
    - q: กระดานเป่าลมต้องใช้ขนาดที่ต่างจากกระดานแข็งหรือไม่?
      a: ไม่มากนักยางเป่าลมขนาด 15 จะ+ PSI แทนที่น้ําได้คล้ายกับบอร์ดแข็งคําแนะนําเรื่องปริมาตรใช้ได้กับทั้งสองประเภทเท่า ๆ กัน
