- slug: surf-etiquette-rules
  category: guide
  type: tutorial
  title: กฎมารยาทการเล่นเซิร์ฟ (วิธีไม่เป็นคนที่ทุกคนหลีกเลี่ยง)
  description: รายชื่อนักโต้คลื่นมีกฎและไม่มีใครจดไว้เรียนรู้สิทธิ์ในการเดิน ทําไมการสนาคิลถึงโดนดุ วิธีขอโทษ และความผิดพลาดของมือใหม่ที่ทําให้นักโต้คลื่นท้องถิ่นรําคาญ
  definition: 'มารยาทการโต้คลื่นเป็นรหัสจรรยาบรรณที่ไม่ได้เขียนไว้เพื่อป้องกันการชนกันและแบ่งคลื่นอย่างเป็นธรรมกฎหลัก: นักโต้คลื่นที่ใกล้จุดสูงสุดของคลื่นที่แตกมากที่สุดมีสิทธิ์นําก่อน'
  tldr: นักโต้คลื่นที่อยู่ใกล้จุดสูงสุดของคลื่นที่แตกมากที่สุดมีสิทธิ์นําหน้าอย่ากระโดดเข้าไปหาใคร อย่าพายอ้อม (พายรอบคนอื่นเพื่อจับคลื่นของเขา) และขอโทษเสมอหากคุณทําผิดพลาดพายรอบๆ แถว จับกระดานไว้ และเป็นมิตร — ความเคารพจะได้รับความเคารพ
  problem: คุณพายออกไปหาคนที่แน่นขนัดและรู้สึกถึงความตึงเครียดทันทีนักโต้คลื่นมองคุณด้วยสายตา มีคนตะโกนใส่คุณ และคุณไม่แน่ใจว่าคุณทําผิดตรงไหนด้านสังคมของการโต้คลื่นรู้สึกน่ากลัวกว่าคลื่นเองเสียอีก
  explanation: 'มารยาทในการโต้คลื่นมีไว้เพื่อป้องกันการชนกันและแบ่งคลื่นอย่างเป็นธรรมกฎพื้นฐานคือสิทธิ์ในการผ่าน: นักโต้คลื่นที่อยู่ใกล้จุดสูงสุด (ที่คลื่นแตกก่อน) จะได้รับสิทธิ์ก่อนใครก็ตามที่พายเรือไปหาคลื่นเดียวกันจากด้านในต้องถอนตัวการพายรอบๆ นักโต้คลื่นคนอื่นเพื่อแย่งสิทธิ์ ถือเป็นความผิดที่ร้ายแรงที่สุดนอกเหนือจากลําดับความสําคัญแล้ว รายชื่อผู้เล่นยังมีความคาดหวังเกี่ยวกับเสียงดัง (อย่าให้เสียงดังให้น้อยที่สุด), การควบคุมบอร์ด (อย่าให้บอร์ดของคุณไปใกล้คนอื่น), และความเป็นมิตร (แค่พยักหน้าก็ช่วยได้มาก)'
  solution: ดูรายชื่อผู้เล่นเป็นเวลา 10 นาทีก่อนพายออกไประบุว่าใครจับคลื่นได้มากที่สุด — นั่นคือผู้เล่นที่ควรเคารพและหลีกเลี่ยงอยู่ด้านใน (โซนน้ําขาว) ถ้าคุณกําลังเรียนรู้พายให้กว้างรอบแถว ไม่ใช่ผ่านไปเมื่อคุณจับคลื่นได้ ให้มองทั้งสองทางก่อนจะโผล่ขึ้นมา และตรวจสอบให้แน่ใจว่าไม่มีใครอยู่ลึกกว่านั้น
  recommendation: ใช้เวลาช่วงแรก ๆ ของคุณในจุดพักที่เหมาะสําหรับผู้เริ่มต้น โดยมีฝูงชนกระจายตัวเรียนรู้ที่จะอ่านลําดับความสําคัญก่อนจะลองเล่นในตารางที่แน่นถ้าคุณแวะไปหาใคร ให้ขอโทษทันทีและพายข้ามไป — นักโต้คลื่นส่วนใหญ่จะเคารพความผิดพลาดที่จริงใจ
  faq:
    - q: อะไรคือสิ่งที่จะดรอปเข้ามา?
      a: การลงไปในคลื่นหมายถึงการพายไปและเล่นคลื่นที่นักโต้คลื่นคนอื่นมีสิทธิ์อยู่แล้วมันอันตรายและไม่ให้เกียรตินักโต้คลื่นที่ใกล้ยอดคลื่นที่สุดจะเป็นเจ้าของคลื่น;คนอื่นต้องถอยออกไป
    - q: Snaking คืออะไร?
      a: การพายเรือแบบ snaking คือการพายรอบนักโต้คลื่นอีกคนที่อยู่ในตําแหน่งสําหรับคลื่นอยู่แล้ว เพื่อให้คุณเข้าใกล้ยอดคลื่นมากขึ้นถือเป็นมารยาทที่แย่มากและอาจนําไปสู่การเผชิญหน้ากันได้
    - q: ผู้เริ่มต้นสามารถโต้คลื่นในจุดคลื่นที่แออัดได้หรือไม่?
      a: ใช่ แต่ควรอยู่ในโซนน้ําเชี่ยวให้ห่างจากยอดเขาอย่าพายเรือเข้าสู่จุดขึ้นหลักจนกว่าคุณจะจับคลื่นได้อย่างต่อเนื่องและควบคุมทิศทางได้แถวเรือที่แออัดต้องใช้ประสบการณ์เพื่อเดินทางอย่างปลอดภัย
    - q: ฉันจะขอโทษในน้ําได้อย่างไร?
      a: แค่โบกมือ ยิ้ม แล้วพูดว่า "ขอโทษที" หรือ "ขอโทษ" ก็ใช้ได้ยอมรับความผิดพลาดและพายหนีจากคนนั้นนักโต้คลื่นโดยทั่วไปให้อภัยกับความผิดพลาดที่จริงใจ โดยเฉพาะถ้าคุณกําลังเรียนรู้อย่างชัดเจน
    - q: ถ้ามีคนแวะมาหาฉัน ฉันควรทําอย่างไรดี?
      a: ถ้าเป็นการแวะเข้ามาอย่างชัดเจน ให้ตะโกนว่า "โบกมือ" หรือ "เฮ้" เพื่อแจ้งเตือนถ้าเขาจับได้โดยไม่ตั้งใจและขอโทษ ให้ปล่อยไปถ้ามีคนแวะมาบ่อยๆ ให้พายเรือไปอธิบายลําดับความสําคัญอย่างสุภาพหลีกเลี่ยงการเผชิญหน้า
