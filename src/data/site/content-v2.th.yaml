- slug: sup-anchor-guide
  category: guide
  type: tutorial
  title: 'SUP คู่มือสมอเรือ: อยู่กับที่ขณะตกปลาหรือถ่ายภาพ'
  description: คู่มือครบถ้วนเกี่ยวกับการSUPยึดสมอ — ประเภทของสมอ (เห็ด, พับ, ไม้เสียบ), การตั้งค่ารถเข็นสมอ, เทคนิคการกางสมอ และข้อควรพิจารณาด้านความปลอดภัยเพื่อรักษาตําแหน่ง
  definition: SUP สมอคือน้ําหนักที่ติดกับเชือกเพื่อยึดกระดานให้อยู่ในตําแหน่งป้องกันลมและกระแสน้ําประเภทที่พบบ่อยได้แก่ สมอเห็ด สมอแบบพับได้ และเสาสําหรับเฝ้า
  tldr: ใช้สมอเห็ด (1.5-3 ปอนด์) สําหรับพื้นโคลนหรือทราย, สมอพับได้สําหรับพื้นหิน หรือใช้เสาสําหรับน้ําตื้นที่มีพื้นนุ่มสมอควรมีน้ําหนัก 1.5-3 ปอนด์สําหรับสภาพสงบ และ 3-5 ปอนด์สําหรับทิศทางลมและกระแสน้ําควรใช้รถเข็นสมอเสมอเพื่อปรับตําแหน่งและรู้ว่าเมื่อไหร่ควรปล่อย
  problem: คุณจะเจอจุดตกปลาที่สมบูรณ์แบบ แต่ลมและกระแสน้ําพัดคุณออกจากตําแหน่งทุก ๆ ไม่กี่นาทีถ้าไม่มีการทอดสมอ SUP การตกปลาและการถ่ายภาพก็เป็นกิจกรรมที่น่าหงุดหงิดและต้องเปลี่ยนตําแหน่งอยู่ตลอดเวลา
  explanation: สมอทํางานโดยลากไปตามพื้นจนติดสมอเห็ดจะฝังอยู่ในก้นที่นุ่มและให้การยึดเกาะที่ดีในทรายและโคลนสมอแบบพับได้มีฟลักที่ขุดเข้าไปในก้นแข็งหรือหินเสาเฝ้าทํางานในน้ําตื้นโดยดันลงไปในก้นน้ําโดยตรง
  solution: ติดตั้งระบบรถเข็นสมอ (เชือกที่มีวงแหวนเลื่อนด้านหนึ่งของบอร์ด) เพื่อปรับจุดยึดสมอผูกเชือกยาว 50-75 ฟุตกับสมอปล่อยเชือกขึ้นหรือขึ้นในตําแหน่งที่ต้องการใช้ระบบปลดเร็วเพื่อถอดออกในกรณีฉุกเฉินอย่ายึดสมอในสภาพกระแสน้ําแรงหรือในจุดที่ดึงสมอออกยาก
  recommendation: สมอพับได้ 3 ปอนด์พร้อมเชือกยาว 50 ฟุต เหมาะกับSUPสภาพการตกปลาส่วนใหญ่เพิ่มระบบรถเข็นสมอโดยใช้แหวน D บน Paddle Board Overstock SUP Explorer 11 ของคุณ
  faq:
    - q: ต้องใช้สมอขนาดเท่าไหร่SUP?
      a: 1.5-3 ปอนด์สําหรับทะเลสาบสงบและแม่น้ําที่ไหลช้า 3-5 ปอนด์สําหรับพื้นที่ชายฝั่งที่มีลมหรือกระแสน้ําสมอขนาดใหญ่กว่าปกติยากที่จะเก็บกลับมา
    - q: ต้องใช้สายยึดเท่าไหร่?
      a: กล้องส่องทางไกล 5:1 (สาย 5 ฟุตต่อทุก ๆ 1 ฟุต) เป็นมาตรฐานในน้ําลึก 10 ฟุต ให้ใช้สายยาว 50 ฟุต
    - q: การยึดเรือบนเรือ ? อันตรายหรือไม่SUP
      a: เฉพาะเมื่อคุณยึดในกระแสน้ําหรือลมแรงพอที่จะทําให้บอร์ดคว่ําควรใช้ระบบปลดเร็วที่สามารถถอดออกได้ทันทีเสมอ
    - q: ฉันสามารถทอดสมอในน้ําใดก็ได้ไหม?
      a: ตรวจสอบข้อบังคับท้องถิ่นบางพื้นที่จํากัดการทอดสมอเพื่อปกป้องหญ้าทะเลหรือแหล่งที่อยู่อาศัยทางทะเลห้ามทอดสมอบนแนวปะการังเด็ดขาด
