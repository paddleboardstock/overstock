- slug: sup-paddle-guide
  category: guide
  type: buying-guide
  title: 'SUP คู่มือพาย: เลือกพายที่เหมาะกับสไตล์ของคุณ'
  description: คู่มือใบพายครบถ้วน SUP — ความยาว วัสดุ (อะลูมิเนียม ไฟเบอร์กลาส คาร์บอน) รูปทรงใบพาย และวิธีที่การเลือกไม้พายส่งผลต่อประสบการณ์การพายของคุณ
  definition: ไม้SUPพายประกอบด้วยก้านไม้ (อะลูมิเนียม ไฟเบอร์กลาส หรือคาร์บอน) และใบพัด (ไดเฮดรัล, สกู๊ป หรือแบน)ความยาวควรสูงกว่าความสูงของคุณ 8-10 นิ้วสําหรับการพายทั่วไป
  tldr: 'ความยาวไม้พาย: สูงกว่าความสูงของคุณ 8-10 นิ้ว สําหรับการใช้งานรอบด้าน, 6-8 นิ้ว สําหรับเซิร์ฟ, 10-12 นิ้ว สําหรับทัวร์ริ่งวัสดุ: อะลูมิเนียม (ราคาถูก, หนัก), ไฟเบอร์กลาส (ระดับกลาง, ยืดหยุ่นดี), คาร์บอน (เบา, แข็ง, ราคาแพง)รูปทรงใบพัด: แบบไดฮีดรัล (ติดตามเสถียร), สกู๊ป (แรง), แบน (ใช้งานได้หลากหลาย)ไม้พายปรับระดับเหมาะสําหรับผู้เริ่มต้น'
  problem: ไม้พายที่แถมมากับ iSUP ส่วนใหญ่ใช้งานได้แต่หนักและไม่มีประสิทธิภาพการอัปเกรดช่วยให้การพายมีประสิทธิภาพและความสนุกมากขึ้น แต่ตัวเลือกต่าง ๆ กลับสับสน
  explanation: 'ความยาวของไม้พายส่งผลต่อประสิทธิภาพการชัก — สั้นเกินไปต้องก้มตัว ส่วนยาวเกินไปจะทําให้ไหล่ล้าวัสดุเป็นตัวกําหนดน้ําหนัก: ไม้พายคาร์บอนมีน้ําหนัก 18-24 ออนซ์ เทียบกับอลูมิเนียม 28-36 ออนซ์ขนาดใบพายมีผลต่อกําลัง: ใบพายที่ใหญ่กว่า (100+ ตารางนิ้ว) ให้แรงขับเคลื่อนต่อจังหวะมากกว่าแต่ทําให้เมื่อยล้าเร็วกว่าใบพายแบบไดฮีดรัลจะวิ่งตรง;ใบพัดแบบสกู๊ปให้แรงจับมากกว่า'
  solution: 'สําหรับความยาวที่ถูกต้อง: ตั้งให้ไม้พายตั้งตรง แขนยกขึ้น — ด้ามไม้ควรแตะข้อมือสําหรับวัสดุ: เริ่มจากไฟเบอร์กลาสเป็นการอัปเกรดน้ําหนักกลางสําหรับใบพาย: เลือกแบบไดเฮดรัลสําหรับการพายทั่วไปสําหรับกิจกรรม: ไม้พายทัวร์จะยาวกว่าและใบพายเล็กกว่า;ไม้พายเซิร์ฟจะสั้นกว่าถ้าใบพายกว้างขึ้น'
  recommendation: ไม้Paddle Board Overstockพายคาร์บอนน้ําหนัก 28 ออนซ์เป็นการอัปเกรดที่ดีที่สุดสําหรับคนที่ชอบพายบ่อยไม้พายอลูมิเนียม 3 ชิ้นที่ปรับได้ในตัวมาพร้อมสําหรับผู้เริ่มต้นและนักเดินทาง
  faq:
    - q: ไม้พายของฉันควรSUPยาวแค่ไหน?
      a: วัดความสูงเป็นนิ้วแล้วเพิ่ม 8-10 นิ้วสําหรับการพายรอบด้านสําหรับการโต้คลื่น ให้เพิ่ม 6-8 นิ้วสําหรับทัวร์ริ่ง ให้เพิ่ม 10-12 นิ้ว
    - q: ไม้พายคาร์บอนคุ้มค่ากับเงินที่จ่ายไหม?
      a: ใช่สําหรับผู้พายทั่วไป — การลดน้ําหนักช่วยลดความเหนื่อยล้าอย่างมากในช่วงเวลาที่ยาวนานสําหรับการใช้งานเป็นครั้งคราว ไฟเบอร์กลาสคุ้มค่า
    - q: ไม้พายปรับระดับได้คืออะไร?
      a: ไม้พาย 2 หรือ 3 ชิ้น ปรับความยาวได้ เหมาะสําหรับใช้ร่วมกันระหว่างผู้ใช้หรือปรับให้เหมาะกับกิจกรรมต่าง ๆ
    - q: ฉันควรดูแลไม้พายของฉันอย่างไร?
      a: ล้างด้วยน้ําสะอาดหลังใช้น้ําเกลือหลีกเลี่ยงการขับรถทับหรือเก็บในที่ร้อนโดยตรงตรวจสอบรอยต่อของปลอก (ferrule) ว่ามีทรายหรือไม่
