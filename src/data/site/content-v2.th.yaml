- slug: sup-hydration-sun-protection
  category: guide
  type: safety
  title: 'การSUPเติมความชุ่มชื้นและการป้องกันแสงแดด: ปลอดภัยบนผิวน้ํา'
  description: กลยุทธ์การดื่มน้ําและป้องกันแสงแดดที่จําเป็นสําหรับSUPนักพายภาวะขาดน้ําและผิวไหม้แดดเป็นปัญหาที่พบบ่อยที่สุด SUP — วิธีป้องกันทั้งสองอย่างในระหว่างการพายเป็นเวลานาน
  definition: SUP การเติมน้ําหมายถึงการรักษาสมดุลของของเหลวระหว่างการพายเรือผ่านการดื่มน้ําอย่างสม่ําเสมอการป้องกันแสงแดดประกอบด้วยการใช้ SPF เสื้อผ้าป้องกัน และการจับเวลาเพื่อป้องกันการมีแดดสูงสุดUV
  tldr: ดื่มน้ํา 500 มล. ต่อชั่วโมงของการพายเรือนําน้ํามากกว่าที่คิดว่าจําเป็น — กระเพาะปัสสาวะ 2 ลิตร หรือขวดน้ําหลายขวดทาครีมกันแดดกันแดดกันน้ํา SPF 50+ ก่อนพายเรือ และทาซ้ําทุก 2 ชั่วโมงสวมหมวก แว่นกันแดดพร้อมสายรัด และสวมเสื้อผ้าที่ผ่านการรับรอง UPF หลีกเลี่ยงการพายเรือในช่วง 11 โมงเช้าถึง 3 โมงเย็นเมื่อUVอากาศแรงที่สุด
  problem: คุณกําลังมีSUPเซสชั่นที่ดีมาก แต่หลังจากหนึ่งชั่วโมงคุณจะปวดหัว ปากแห้ง และผิวหนังร้อนการขาดน้ําและผิวไหม้แดดจะค่อย ๆ เกิดขึ้นเพราะน้ําช่วยให้คุณเย็น
  explanation: การสะท้อนจากน้ําทําให้การสัมผัสผิวรุนแรงขึ้นUVถึง 40%ผลเย็นของน้ําและลมช่วยปกปิดอาการผิวไหม้แดดจนสายเกินไปเหงื่อจากการพายเรือทําให้สูญเสียน้ํามากขึ้น และมักไม่มีที่เติมน้ําบนผิวน้ําการขาดน้ําทําให้สมดุลและการตัดสินใจแย่ลง เพิ่มความเสี่ยงต่ออุบัติเหตุ
  solution: ติดขวดน้ําหรือถุงน้ํากับระบบบันจี้ของบอร์ดดื่มทุก 15 นาที ไม่ว่าจะกระหายน้ําหรือไม่ทาครีมกันแดด SPF 50+ ก่อนออกตัว 30 นาทีสวมหมวกปีกกว้าง แว่นกันแดดโพลาไรซ์พร้อมสายรัด และที่+ป้องกันผื่น UPF 50 ทาครีมกันแดดซ้ําทุก 2 ชั่วโมง
  recommendation: ใช้ถุงน้ําที่รัดไว้ที่ห่วง D-ring ด้านหน้าของคุณสวมเสื้อกันPaddle Board OverstockSUPแดด UPF 50+ ใต้ถุงPFDใช้ครีมกันแดดกันน้ําที่ติดอยู่กับเหงื่อและน้ํา
  faq:
    - q: ควรนําน้ําไปเท่าไหร่SUPในทริป?
      a: อย่างน้อย 1 ลิตรต่อชั่วโมงสําหรับการใช้งาน 2 ชั่วโมง ให้นํา 2 ลิตรมากกว่านี้ในอากาศร้อนถุงน้ําดื่มน้ําจะเหมาะที่สุด
    - q: ครีมกันแดดแบบไหนเหมาะกับคุณSUPที่สุด?
      a: กันน้ํา SPF 50+ แบบกว้างครีมกันแดดแร่ธาตุ (ซิงค์ออกไซด์, ไทเทเนียมไดออกไซด์) ปลอดภัยสําหรับแนวปะการังและคงทนนานกว่า
    - q: น้ําสะท้อนแสงจริงหรือUV?
      a: ใช่ — น้ําสะท้อนรังสีได้ถึง 40% UV หมายความว่าคุณจะได้รับรังสีUVจากด้านบนและด้านล่างสิ่งนี้เพิ่มความเสี่ยงต่อการถูกไฟไหม้อย่างมาก
    - q: ฉันสามารถโดนแดดเผาผ่านที่ครอบผิวได้ไหม?
      a: ที่กันรัดผิวมาตรฐานให้UVการปกป้องน้อยที่สุด (ประมาณ UPF 10-20)มองหาเสื้อผ้าที่ได้รับการรับรอง UPF 50+ เพื่อการปกป้องเต็มที่
