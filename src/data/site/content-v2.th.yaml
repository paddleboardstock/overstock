  title: คู่มือขนาดกระดานโต้คลื่น (ปริมาตรคือสิ่งสําคัญจริงๆ)
  description: หยุดเดาขนาดกระดานโต้คลื่นได้แล้วปริมาตรเป็นลิตรกําหนดทุกอย่าง — ว่าคุณจะจับคลื่นได้ง่ายแค่ไหน รู้สึกมั่นคงแค่ไหน และความเร็วที่คุณจะก้าวหน้าค้นหาขนาดที่ต้องการได้ใน 2 นาที
  definition: ขนาดกระดานโต้คลื่นขึ้นอยู่กับปริมาตร (ลิตร) ไม่ใช่ความยาวปริมาตรกําหนดความสามารถในการลอยตัวและจับคลื่นกระดานที่ยาวกว่าจะพายได้เร็วกว่า;กระดานที่กว้างกว่าจะมั่นคงกว่า;กระดานที่หนากว่าจะให้ปริมาตรมากขึ้นโดยไม่เพิ่มความยาว
  tldr: 'ขนาดกระดานโต้คลื่นขึ้นอยู่กับปริมาตร ไม่ใช่แค่ความยาวผู้เริ่มต้นต้องการ 60-80 ลิตร ผู้มีสมาธิต้องการ 35-55 ลิตร และนักโต้คลื่นขั้นสูงต้องการ 20-35 ลิตรใช้น้ําหนักเป็นปัจจัยหลัก: ทุก ๆ 10 กิโลกรัมต้องการปริมาตรประมาณ 10-12 ลิตรในระดับผู้เริ่มต้น'
  problem: ยืนอยู่หน้าชั้นวางกระดานโต้คลื่นที่มีตัวเลขประมาณ 7'2" x 22" x 3" พิมพ์อยู่บนราง คุณไม่มีทางรู้เลยว่าตัวเลขเหล่านั้นรู้สึกอย่างไรในน้ําการซื้อจากรูปลักษณ์หรือสิ่งที่เพื่อนขี่ จะทําให้กระดานไม่มั่นคงหรือยากเกินไปที่จะพาย
  explanation: 'ขนาดของกระดานโต้คลื่นเข้าใจได้ดีที่สุดจากสามมิติ: ความยาว (พลังพายและการจับคลื่น), ความกว้าง (ความมั่นคง), และความหนา (ปริมาตรและลอยตัว)ตัวเลขที่สําคัญจริง ๆ คือปริมาตรเป็นลิตรโฟมบอร์ดและยางลมจะได้ปริมาตรสูงจากความกว้างและความหนา ไม่ใช่ความยาวที่มากเกินไป ทําให้มือใหม่จัดการได้ง่ายขึ้นเมื่อคุณพัฒนาฝีมือ คุณจะลดปริมาตรเพื่อให้กระดานจมลึกลงไปในผิวคลื่นและหมุนตัวได้รวดเร็วขึ้น'
  solution: 'ใช้เครื่องคํานวณปริมาตรต่อน้ําหนัก: สําหรับมือใหม่ ให้หารน้ําหนักเป็นกิโลกรัมด้วย 1.5 เพื่อให้ได้ลิตรที่ต้องการสําหรับระดับกลาง ให้หารด้วย 2 สําหรับระดับกลางควรมองหากระดานที่มีร็อกเกอร์ระดับปานกลางและหางสควอชหรือกลมเพื่อความหลากหลายในการใช้งาน'
  recommendation: Paddle Board Overstock Surfboard Pro มีความจุ 75 ลิตรในแพ็กเกจสูง 10'6" — เหมาะสําหรับผู้เริ่มต้นน้ําหนักไม่เกิน 90 กก.นักสเก็ตที่น้ําหนักเบาสามารถลดขนาดลงเหลือ SUP Tour 12 เพื่อความรู้สึกที่คล่องตัวมากขึ้นขณะเล่นต่อ
  faq:
    - q: ความสูงมีผลต่อขนาดเซิร์ฟบอร์ดหรือไม่?
      a: ความสูงไม่สําคัญเท่าน้ําหนักนักโต้คลื่นที่สูงและน้ําหนักเบาต้องการปริมาตรน้อยกว่านักโต้คลื่นตัวเตี้ยและหนักที่มีความสูงเท่ากันใช้น้ําหนักเป็นตัวชี้วัดหลักและปรับตามความฟิตและความแข็งแรงของไม้พาย
    - q: ถ้าบอร์ดของฉันมีปริมาตรมากเกินไปจะเกิดอะไรขึ้น?
      a: ปริมาตรมากเกินไปจะทําให้บอร์ดรู้สึกแข็งและไม่มั่นคงบนผิวคลื่นคุณจะลําบากในการจมรางในโค้ง และอาจกระเด็นออกจากน้ําตอนโค้งด้านล่าง
    - q: ถ้าบอร์ดของฉันมีปริมาตรน้อยเกินไปจะเกิดอะไรขึ้น?
      a: คุณจะลําบากกับการพายเข้าคลื่น จมลึกเกินไปตอนขึ้นบิน และรู้สึกไม่มั่นคงแค่นั่งรออยู่บนบอร์ดมือใหม่แทบจะต้องการปริมาณมากกว่าที่คิดเสมอ
    - q: ฉันจะรู้ได้อย่างไรว่าเมื่อไหร่ควรลดขนาดลง?
      a: เมื่อคุณจับคลื่นได้อย่างต่อเนื่อง โผล่ขึ้นอย่างนุ่มนวล และหมุนตัวพื้นฐานบนบอร์ดปัจจุบัน ก็ถึงเวลาที่จะลด 5-10 ลิตรการลดขนาดเร็วเกินไปจะทําให้ความก้าวหน้าช้าลง
