- slug: wind-conditions-sup
  category: guide
  type: technical
  title: 'สภาพลมสําหรับ SUP: ลมส่งผลต่อไม้พายของคุณอย่างไร'
  description: ความเร็วและทิศทางลมส่งผลต่อSUPการพายเรืออย่างไรทําความเข้าใจลมนอกชายฝั่งกับลมบนฝั่ง อ่านพยากรณ์ลม เทคนิคการพายเพื่อควบคุมลม และเมื่อใดควรอยู่บนฝั่ง
  definition: สภาพลมเป็นตัวกําหนดSUPความปลอดภัยลมจากฝั่ง (จากบกสู่ทะเล) จะผลักคุณออกไปลมจากฝั่ง (จากทะเลสู่บก) จะผลักคุณเข้าหาฝั่งลมด้านข้างทําให้กระดานหมุน
  tldr: 'ความเร็วลมสูงสุดที่ปลอดภัยสําหรับผู้เริ่มต้น: 10 น็อตระดับกลาง: 15 นอตขั้นสูง: 20 น็อตลมทะเลเป็นลมที่อันตรายที่สุดพายเรือทวนลมก่อนในสภาพลมข้าง ให้พายไปทางลมเล็กน้อยจากจุดหมายคุกเข่าในลมแรงเพื่อลดรูปทรงของคุณ'
  problem: คุณพายเรือออกไปในสภาพอากาศสงบ แต่ผ่านไป 30 นาที ลมก็แรงขึ้นและคุณพยายามกลับเรือลําบากลมเป็นปัจจัยความปลอดภัยที่ถูกประเมินต่ําที่สุดSUP
  explanation: ลมมีผลSUPมากกว่าเรือพายอื่น ๆ เพราะคุณยืนอยู่ ทําให้เกิดเอฟเฟกต์ใบเรือลม 10 นอตสร้างแรงต้านมากกว่าผู้พายเรือคายัคที่นั่งลมจากทะเลจะผลักคุณออกจากความปลอดภัยลมข้างทําให้จมูกเรือเอียง
  solution: 'ตรวจสอบความเร็วและทิศทางลมก่อนพายเรือใช้มาตรวัด Beaufort: ระดับ 3 (7-10 นอต) สําหรับผู้เริ่มต้น, ระดับ 4 (11-16) สําหรับระดับกลางพายทวนลมก่อนถ้าถูกลมแรง ให้พายที่มุม 45 องศากับลมคุกเข่าในลมแรง'
  recommendation: ใช้แอปพยากรณ์ลม (Windy, Windfinder) ก่อนแต่ละเซสชัน Paddle Board Overstock SUP Tour 12 สามารถพายได้ดีกว่าในลมมากกว่าบอร์ดที่กว้างในสภาพลมแรง ให้ใช้จังหวะพายสั้นและจังหวะพายที่สูงขึ้น
  faq:
    - q: ทิศทางลมแบบไหนปลอดภัยที่สุดSUP?
      a: ลมจากฝั่ง (พัดเข้าฝั่ง) ปลอดภัยที่สุด — มันจะผลักคุณกลับไปลมจากทะเลอันตรายที่สุด
    - q: ฉันจะพายเรือในลมข้างได้อย่างไร?
      a: พายไปทางลมขึ้นมากขึ้นเพื่อต้านการลอยตัวปรับมุมกระดานให้ไปทางลมเหนือจุดหมายครีบกลางที่ลึกกว่าจะช่วยได้
    - q: ฉันสามารถพายเรือในลมแรง 20 นอตได้ไหม?
      a: เฉพาะเมื่อมีประสบการณ์ในน่านน้ําที่ได้รับการปกป้องเท่านั้นผู้เริ่มต้นไม่ควรพายเกิน 10 นอต
    - q: ลมกระโชกส่งผลอย่างไรSUP?
      a: ลมแรงทําให้เกิดปัญหาการทรงตัวอย่างกะทันหันในสภาพอากาศลมแรง ให้ลดท่าทางลงและเตรียมพร้อมรับมือกับการเปลี่ยนแปลงอย่างกะทันหัน
