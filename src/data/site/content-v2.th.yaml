- slug: inflatable-sup-maintenance
  category: guide
  type: tutorial
  title: 'การบํารุงรักษาแบบเป่าลมSUP: ช่วยให้บอร์ดของคุณใช้งานได้นานหลายปี'
  description: การบํารุงรักษาแบบเป่าลมอย่างถูกต้องSUPช่วยยืดอายุการใช้งานของบอร์ดได้อย่างมากการทําความสะอาด การอบแห้ง การดูแลวาล์ว UV การป้องกัน และเคล็ดลับการเก็บรักษาตามฤดูกาลสําหรับdrop-stitchบอร์ดพาย
  definition: การบํารุงรักษาเป่าลมSUPประกอบด้วยการทําความสะอาดหลังใช้งาน การอบแห้งอย่างถูกต้อง การตรวจสอบวาล์ว UV การป้องกัน และการเก็บรักษาอย่างถูกต้องเพื่อป้องกันการลอกชั้น รา การเสื่อมสภาพของวัสดุ และการรั่วไหลของอากาศ
  tldr: ล้างบอร์ดของคุณด้วยน้ําสะอาดทุกครั้งหลังจากดื่มน้ําเกลือทุกครั้งเช็ดให้แห้งสนิทก่อนปล่อยลมและเก็บรักษาตรวจสอบวาล์วว่ามีเศษสิ่งสกปรกหรือไม่ และหล่อลื่นโอริงทุกปีเก็บที่เติมลม (ครึ่งPSIหนึ่ง) ในที่เย็นและมืดหลีกเลี่ยงการUVสัมผัสนาน ๆ ซึ่งอาจทําให้เสียคุณภาพPVCปะรอยรั่วเล็ก ๆ ทันทีด้วยชุดซ่อมที่แถมมา
  problem: หลังจากหนึ่งฤดูกาล เรือเป่าลมของคุณSUPจะเกิดการรั่วซึมช้า ๆ แผ่นรองพื้นจะลอกที่ขอบ และPVCรู้สึกแข็งขึ้นการละเลยการบํารุงรักษาพื้นฐานจะทําให้แก่ก่อนวัยซึ่งสามารถป้องกันได้ทั้งหมด
  explanation: เPVCสื่อมสภาพเมื่อUVได้รับรังสีผลึกเกลือจากน้ําทะเลจะซึมเข้าไปในรอยต่อและวาล์ว ทําให้เกิดรอยรั่วเล็ก ๆความชื้นที่ติดอยู่ข้างในจะส่งเสริมการเกิดเชื้อราที่ทําลายdrop-stitchเกลียวโอริงของวาล์วจะแห้งและสูญเสียการปิดผนึกสิ่งสกปรกและทรายจะบดลงบนกาวแผ่นพื้น ทําให้เกิดการยกขอบ
  solution: 'หลังแต่ละครั้ง: ล้างแผ่นไม้ ครีบ และปั๊มน้ําสะอาดเช็ดแผ่นรองดาดฟ้าเปิดวาล์วเพื่อระบายน้ําที่ติดอยู่เช็ดแผ่นไม้ในที่ร่มก่อนปล่อยลมทุกเดือน: ตรวจสอบวาล์วและทาน้ํามันหล่อลื่นซิลิโคนที่โอริงตามฤดูกาล: ล้างด้วยสบู่อ่อนและน้ํา ตรวจสอบรอยรั่ว'
  recommendation: ปฏิบัติตามPaddle Board Overstockคู่มือการดูแลที่แนบมากับบอร์ดของคุณใช้ชุดซ่อมทันทีเมื่อมีรอยรั่วเก็บบอร์ดไว้ในถุงในที่ควบคุมอุณหภูมิและห่างจากแสงแดดโดยตรง
  faq:
    - q: ฉันสามารถปล่อยของเป่าลมSUPไว้ตลอดฤดูกาลได้ไหม?
      a: ใช่ แต่ควรเก็บให้พ้นแสงแดดโดยตรงและเก็บที่ครึ่งหนึ่งของอุณหภูมิสูงสุด PSI (8-10 ครั้งPSI) เพื่อลดแรงกดบนรอยต่อเติมลมให้เต็มที่ก่อนใช้งาน
    - q: ฉันจะทําความสะอาดเชื้อราบนเครื่องของฉันSUPได้อย่างไร?
      a: ผสมสบู่อ่อนกับน้ําอุ่นแล้วขัดด้วยแปรงนุ่มสําหรับเชื้อราที่ฝังแน่น ให้ใช้น้ําส้มสายชูขาวเจือจาง (อัตราส่วน 1:4)หลีกเลี่ยงการใช้น้ํายาฟอกขาว
    - q: ฉันต้องหล่อลื่นวาล์วไหม?
      a: ใช่ ทุกปีถอดแกนวาล์วออก ทาจาระบีซิลิโคนที่โอริง แล้วติดตั้งกลับเข้าไปวิธีนี้ช่วยป้องกันการรั่วของอากาศ
    - q: ฉันจะเก็บรักษาSUPของฉันสําหรับฤดูหนาวได้อย่างไร?
      a: ทําความสะอาดและเช็ดให้แห้งอย่างทั่วถึงปล่อยลมออกให้หมด ม้วนให้หลวม (หลีกเลี่ยงรอยพับที่แน่น) และเก็บในที่เย็น มืด และแห้งหลีกเลี่ยงอุณหภูมิที่เย็นจัด
