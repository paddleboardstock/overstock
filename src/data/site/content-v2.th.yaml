- slug: sup-self-rescue
  category: guide
  type: safety
  title: 'การSUPช่วยเหลือตัวเอง: วิธีกลับขึ้นบอร์ดในน้ําลึก'
  description: นักSUPพายทุกคนควรเชี่ยวชาญการช่วยชีวิตตัวเองเทคนิคทีละขั้นตอนสําหรับการติดตั้งบอร์ดใหม่ในน้ําลึก ลากขึ้นฝั่ง และจัดการกับสายจูงพันกัน
  definition: การSUPช่วยตัวเองคือเทคนิคการติดตั้งกระดานพายกลับในน้ําลึกหลังจากตกจากพื้น รวมถึงการกู้คืนกระดาน การติดตั้งตัวเรือใหม่ และการดึงไม้พายกลับ
  tldr: 'หลังจากล้ม: ใจเย็น จับไม้พายไว้ แล้วว่ายไปที่กระดานวางไม้พายขวางกระดานใช้ท่าเตะโลมาเพื่อดันหน้าอกขึ้นบนกระดานแกว่งขาข้างหนึ่งขึ้น แล้วอีกข้างคุกเข่าก่อน แล้วค่อยยืนฝึกในน้ําสงบจนกลายเป็นความจําของกล้ามเนื้อ'
  problem: คุณตกลงไปSUPในน้ําลึกและไม่สามารถกลับขึ้นมาได้กระดานลื่น คุณเหนื่อย และเกิดความตื่นตระหนกถ้าไม่รู้เทคนิคการช่วยตัวเอง การตกง่าย ๆ ก็อันตราย
  explanation: 'การช่วยตัวเองมีสามขั้นตอน: การฟื้นฟู (ว่ายน้ําไปถึงบอร์ดและพาย), การกลับขึ้นบอร์ด (กลับขึ้นบอร์ด), และต่อเนื่อง (พายต่อ)เทคนิคสําคัญคือการใช้ไม้พายเป็นตัวช่วยเสถียรและใช้การเตะขาอย่างแรงเพื่อดันร่างกายส่วนบนขึ้นไปบนบอร์ด'
  solution: 'ขั้นตอนที่ 1: ว่ายน้ําไปที่กระดานจับไม้พายไว้หรือเก็บไม้พายขั้นตอนที่ 2: วางไม้พายตั้งฉากข้ามกระดานเตะขาอย่างแรงขณะดึงหน้าอกเข้าหากลางกระดานขั้นตอนที่ 3: เมื่อหน้าอกขึ้นบนกระดานแล้ว ให้แกว่งขาขึ้นทีละข้างขั้นตอนที่ 4: คุกเข่า หายใจเข้าลึก แล้วค่อย ๆ ยืนขึ้น'
  recommendation: ฝึกการช่วยชีวิตตัวเองในสภาพแวดล้อมที่ควบคุมได้จนกว่าคุณจะทําได้โดยไม่ต้องคิดใช้ Paddle Board Overstock SUP Explorer 11 ซึ่งมีการยึดเกาะบนดาดฟ้าที่ดี Life Vest Pro ให้การลอยตัวเพิ่มถ้าคุณมีปัญหา
  faq:
    - q: ถ้าฉันเหนื่อยมากแล้วจะกลับมาใช้ยาได้ยังไง?
      a: อยู่กับบอร์ดเพื่อลอยตัวใช้แขนดึงหน้าอกขึ้นบอร์ด แม้ว่าขาจะเตะไม่ดีก็ตามพักในท่าคุกเข่าก่อนยืน
    - q: ถ้าฉันทําไม้พายหายล่ะ?
      a: ใช้แขนพายบอร์ดขึ้นฝั่งขอความช่วยเหลือจากผู้พายคนอื่นเปลี่ยนไม้พายที่หายไปทันที
    - q: ฉันสามารถช่วยตัวเองเป็นระลอกได้ไหม?
      a: ใช่ — วางกระดานตั้งฉากกับคลื่นจับเวลาติดตั้งใหม่ระหว่างคลื่นสายจูงจะช่วยให้กระดานอยู่ใกล้ตัว
    - q: ฉันจะจัดการกับปัญหาสายจูงพันกันอย่างไรดี?
      a: ใจเย็น ๆ ลอยตัวบนหลัง ค่อย ๆ คลายสายจูงออกถ้าสายจูงพันรอบครีบ คุณอาจต้องถอดครีบออกขณะอยู่ในน้ํา
