    - life-vest-pro
    - life-vest-classic
  difficulty: beginner
- slug: understanding-tides
  category: guide
  type: technical
  title: 'ทําความเข้าใจเรื่องน้ําขึ้นน้ําลงสําหรับกีฬาทางน้ํา: คู่มือปฏิบัติ'
  description: ผลกระทบของน้ําขึ้นน้ําลง SUPการโต้คลื่น และสภาพการพายเรือคายัคอ่านแผนภูมิน้ําขึ้นน้ําลง เข้าใจฤดูใบไม้ผลิกับน้ําขึ้นน้ําลง และวางแผนเซสชันโดยอิงกับการเคลื่อนไหวของน้ําขึ้นน้ําลงเพื่อความปลอดภัย
  definition: น้ําขึ้นลงคือระดับน้ําทะเลที่สูงขึ้นและลดลงในแต่ละวันจากแรงโน้มถ่วงของดวงจันทร์และดวงอาทิตย์ช่วงน้ําขึ้นน้ําลงแตกต่างกันไปตามสถานที่และวัฏจักรของดวงจันทร์
  tldr: 'ในหลายพื้นที่จะมีน้ําขึ้นสองครั้งและน้ําลงสองครั้งต่อวันน้ําลงฤดูใบไม้ผลิ (เต็มดวง/คืนใหม่) มีช่วงน้ํากว้างกว่าและกระแสน้ําแรงขึ้นน้ําขึ้นน้ําลงใต้น้ํา (พระจันทร์เสี้ยว) มีช่วงน้ําที่สั้นกว่าน้ําขึ้นมีผลต่อความลึกของน้ํา รูปร่างคลื่น และความแรงของกระแสน้ําสําหรับSUP: พายเรือสวนกระแสน้ําก่อนเพื่อช่วยให้คุณกลับสู่ระดับน้ําลง'
  problem: เมื่อมาถึงจุดพักน้ําใกล้บ้าน คุณจะพบคลื่นน้อยมาก คลื่นอันตรายจากน้ําขึ้นลง หรือน้ําตื้นเกินไปถ้าไม่เข้าใจเรื่องน้ําลง คุณจะเสียเวลาหรือพายเรือในสภาพอันตราย
  explanation: น้ําขึ้นน้ําลงเกิดจากแรงโน้มถ่วงของดวงจันทร์น้ําขึ้นน้ําลงฤดูใบไม้ผลิ (เต็มดวงและคืนใหม่) จะสร้างช่วงน้ําขึ้นสูงสุดและต่ําสุดน้ําขึ้นน้ําลงใต้ท้องฟ้า (ช่วงหนึ่งในสี่ของพระจันทร์) ให้ระยะทางน้อยมากกระแสน้ําขึ้นน้ําลงเร็วที่สุดในช่วงกลางน้ําขึ้น และช้าในช่วงน้ําขึ้นและต่ําช่วงน้ําขึ้นน้ําลงแตกต่างกันตั้งแต่ 0.3 เมตร (เมดิเตอร์เรเนียน) ถึง 16 เมตร (อ่าวฟันดี้)
  solution: 'ตรวจสอบตารางน้ําขึ้นน้ําลงก่อนทุกครั้งที่เล่นเซิร์ฟสําหรับการโต้คลื่น: คลื่นชายหาดมักจะได้ผลดีที่สุด 2-3 ชั่วโมงก่อนน้ําขึ้นสูงสําหรับSUP: พายสวนกระแสน้ําครึ่งแรกเพื่อให้กระแสน้ํากลับมาสําหรับการตกปลา: น้ําขึ้นจะดันปลาให้ตกที่ราบ'
  recommendation: ใช้การพยากรณ์น้ําขึ้นน้ําลงของ NOAA หรือแอปน้ําขึ้นน้ําลงในพื้นที่เรียนรู้ความชอบน้ําขึ้นน้ําลงในพื้นที่ของคุณโดยการบันทึกสภาพตลอดหนึ่งเดือน
  faq:
    - q: น้ําขึ้นน้ําลงฤดูใบไม้ผลิคืออะไร?
      a: น้ําขึ้นน้ําลงฤดูใบไม้ผลิเกิดขึ้นในช่วงพระจันทร์เต็มดวงและพระจันทร์ใหม่ ทําให้น้ําขึ้นสูงขึ้นและกระแสน้ําแรงขึ้นน้ําขึ้นน้ําลงเกิดขึ้นเดือนละสองครั้ง
    - q: neap tide คืออะไร?
      a: น้ําขึ้นน้ําลงแบบนีปเกิดขึ้นในช่วงพระจันทร์เสี้ยวช่วงน้ําขึ้นน้ําลงมีขนาดเล็กกว่า และกระแสน้ําอ่อนกว่า — เหมาะสําหรับผู้เริ่มต้น
    - q: น้ําลงต่ําอันตรายต่อ SUP?
      a: น้ําลงต่ําสามารถเปิดเผยหินและแนวปะการังได้นอกจากนี้ยังรวมพลังงานคลื่นไว้บนสันทรายที่ชันกว่า
    - q: น้ําขึ้นน้ําลงมีผลต่อกระแสน้ําริ้วอย่างไร?
      a: น้ําขึ้นลง (น้ําลง) ช่วยเสริมความแข็งแรงให้กับกระแสน้ําเชี่ยวน้ําขึ้นน้ําลง (น้ําท่วม) จะลดความแรงของกระแสน้ําเชี่ยว
