- slug: inflatable-sup-repair
  category: problem
  type: tutorial
  title: 'ซ่อมยางเป่าลมSUP: แก้ไขปัญหาการรั่ว รอยรั่ว และวาล์ว'
  description: คู่มือซ่อมเครื่องเป่าลมแบบ DIY SUP วิธีหาจุดรั่วช้า ๆ ปะรอยรั่ว เปลี่ยนวาล์ว และแก้ไขการลอกชั้นของแผ่นรองดาดฟ้าโดยใช้ชุดซ่อมที่แถมมา
  definition: การซ่อมแบบเป่าลมSUPเกี่ยวข้องกับการหาจุดรั่วของอากาศผ่านการทดสอบน้ําสบู่ การทําความสะอาดและขัดบริเวณที่เสียหาย การติดPVCกาวและแผ่นแปะ และการอบแห้งภายใต้แรงดัน
  tldr: หาจุดรั่วด้วยน้ําสบู่ทําความสะอาดและขัดบริเวณรอบๆ รอยเจาะด้วยกระดาษทรายทาPVCกาวทั้งที่แผ่นปะและแผ่นไม้ รอ 5 นาที กดแน่น และบ่มภายใต้น้ําหนักเป็นเวลา 24 ชั่วโมงสําหรับการรั่วของวาล์ว ให้ตรวจสอบโอริงก่อนรูรั่วเล็กๆ ที่หนาไม่เกิน 1/4 นิ้วเป็นวิธีซ่อมด้วยตัวเองที่ง่าย
  problem: คุณเติมลมSUPและแรงดันก็ลดลงในตอนเช้าถ้าไม่มีความรู้เรื่องซ่อม คุณจะต้องเจอกับเครื่องทดแทนราคาแพงสําหรับความเสียหายที่น่าจะเป็นแค่การรั่วธรรมดา
  explanation: 'ยางเป่าลมส่วนใหญ่SUPsใช้drop-stitchแกนที่มีPVCชั้นนอกการเจาะผ่านชั้นนอกPVCจะทําให้เกิดการรั่วไหลช้า ๆการซ่อมแซมมาตรฐาน: ทําความสะอาด, ขัด, ทาPVCกาวที่เข้ากันได้, กดแผ่นปะภายใต้น้ําหนักการรั่วไหลของวาล์วพบได้บ่อยกว่าการเจาะแผง — โอริงจะแห้งหรือเศษสิ่งสกปรกขัดขวางการปิดสนิท'
  solution: เป่าลมบอร์ดให้เต็มที่PSIและฟังเสียงฟู่ฉีดน้ําสบู่อย่างสม่ําเสมอ โดยเฉพาะรอบรอยต่อและวาล์วทําเครื่องหมายจุดที่มีฟองเป่าลม ทําความสะอาดด้วยแอลกอฮอล์ ขัดด้วยผง 80 ทราย ทาPVCกาวที่แผ่นปะและบอร์ด รอจนเหนียว กดแน่น ถ่วงน้ําหนัก 24 ชั่วโมง
  recommendation: ใช้Paddle Board Overstockชุดซ่อมที่แถมมากับPaddle Board Overstockแผ่นไม้ทุกแผ่นพกชุดซ่อมติดตัวเสมอเมื่อเดินทางสําหรับปัญหาวาล์ว กรุณาติดต่อPaddle Board Overstockฝ่ายสนับสนุนสําหรับรอยขาดขนาดใหญ่หรือรอยต่อแยก แนะนําให้ซ่อมแซมโดยมืออาชีพ
  faq:
    - q: ฉันสามารถซ่อมรอยฉีกขาดขนาดใหญ่ในถุงยางเป่าลมของฉันSUPได้ไหม?
      a: รอยฉีกขาดเกิน 1 นิ้วอาจต้องซ่อมแซมโดยมืออาชีพหรือแปะทั้งสองด้านรอยแยกของรอยต่อตามรางไม่สามารถซ่อมแซมภาคสนามได้อย่างน่าเชื่อถือ
    - q: แพตช์ซ่อมแซมหนึ่งครั้งมีอายุนานแค่ไหน?
      a: การซ่อมแซมที่ถูกต้องด้วยเทคนิคที่ถูกต้องจะคงอยู่ตลอดอายุการใช้งานของแผ่นไม้การยึดเกาะที่ไม่ดีจากการทําความสะอาดที่ไม่เพียงพอจะนําไปสู่ความล้มเหลวในอนาคต
    - q: ฉันสามารถซ่อมวาล์วที่รั่วได้ไหม?
      a: บ่อยครั้งใช่ถอดแกนวาล์วออก ตรวจสอบโอริง ทําความสะอาดหรือเปลี่ยนใหม่ ทาน้ํามันหล่อลื่นซิลิโคน แล้วติดตั้งกลับเข้าไป
    - q: ถ้าฉันหาจุดรั่วไม่เจอล่ะ?
      a: เติมลมให้เต็มที่PSIและจุ่มส่วนต่าง ๆ ลงไปในอ่างอาบน้ําหรือสระตามลําดับรอยรั่วที่เล็กเกินกว่าจะหาเจออาจเกิดจากอุณหภูมิ
