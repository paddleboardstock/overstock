- slug: sup-size-guide
  category: guide
  type: buying-guide
  title: 'SUP คู่มือขนาด: อธิบายความยาว ความกว้าง และปริมาตร'
  description: หาSUPขนาดที่เหมาะสมตามน้ําหนัก ระดับทักษะ และสไตล์การพายของคุณความยาวกําหนดเส้นทาง ความกว้างกําหนดความมั่นคง และปริมาตรกําหนดความจุน้ําหนัก
  definition: SUP ขนาดถูกกําหนดโดยความยาว (ความเร็วและการลื่นไถล), ความกว้าง (เสถียรภาพขั้นต้น), ความหนา (เสถียรภาพรองและปริมาตร), และปริมาตรเป็นลิตร (ความจุน้ําหนักรวม)
  tldr: 'รอบด้านSUPs: 10''6"-11''6" x 32"-34" x 6" (220-280L)Touring: 12''-14'' x 30"-32" (280-350L)โต้คลื่น: 8''-10'' x 30"-32" (140-220L)ผู้เริ่มต้นต้องการความกว้างเกิน 32" และปริมาตรที่มากกว่าน้ําหนักตัว 60-80L น้ําหนักของคุณเป็นกิโลกรัมบวก 60L คือเป้าหมายปริมาตรขั้นต่ําสําหรับความมั่นคง'
  problem: ทุกSUPแบรนด์จะระบุบอร์ดเป็นฟุต นิ้ว และลิตร แต่ถ้าไม่รู้ว่าขนาดเหล่านี้สะท้อนความรู้สึกจริงอย่างไร คุณอาจเสี่ยงซื้อบอร์ดที่เอียง ช้า หรือไม่สามารถรับน้ําหนักได้
  explanation: 'ความยาวกําหนดความเร็วที่บอร์ดพายและความสามารถในการตีเป็นเส้นตรงได้ดีแค่ไหนบอร์ดที่ยาวกว่า (12 ฟุต+) จะลื่นระหว่างการพายและรักษาเส้นพายไว้ได้บอร์ดที่สั้นกว่า (ต่ํากว่า 10 ฟุต) หมุนได้ง่ายแต่ต้องสลับไม้พายบ่อยกว่าความกว้างเป็นตัวกําหนดความมั่นคงหลัก — ความมั่นคงเมื่อยืนบอร์ดขนาด 30 นิ้วรู้สึกเอียงสําหรับมือใหม่;34 นิ้วจะรู้สึกเหมือนท่าเรือความหนากําหนดปริมาตร — บอร์ดที่หนากว่าจะลอยสูงกว่าแต่รับลมได้มากกว่าปริมาตรเป็นลิตรเป็นตัวชี้วัดที่ดีที่สุด: บอร์ดที่บรรทุก (คุณบวกอุปกรณ์) ควรจมน้ํา 2-4 นิ้วขณะพัก'
  solution: 'จับคู่ขนาดบอร์ดของคุณกับสามปัจจัย: น้ําหนัก (กําหนดปริมาตรขั้นต่ํา), กิจกรรมหลัก (กําหนดความยาว), และระดับทักษะ (กําหนดความกว้าง)สําหรับมือใหม่ ให้คูณน้ําหนักเป็นกิโลกรัมด้วย 2.2 เพื่อให้ได้ลิตรขั้นต่ําสําหรับระดับกลาง คูณด้วย 1.8 สําหรับระดับสูง คูณด้วย 1.4'
  recommendation: Paddle Board Overstock SUP Explorer 11 ขนาด 11' x 33" x 6" ขนาด 260L เหมาะกับนักปั่นส่วนใหญ่น้ําหนักไม่เกิน 100 กก. สําหรับการพายรอบด้านอัปเกรดเป็น SUP Tour 12 ขนาด 12' x 31" เพื่อความเร็วและการลื่นไหลที่ดีกว่า
  faq:
    - q: ฉันSUPต้องการขนาดไหนสําหรับน้ําหนักของฉัน?
      a: 'สําหรับผู้ขี่น้ําหนักต่ํากว่า 70 กก.: 10-11'' x 32" (220-260L)สําหรับน้ําหนัก 70-90 กก.: 11-12'' x 33" (260-300L)สําหรับน้ําหนัก 90-110 กก.: 11-12'' x 34" (300-350L)สําหรับน้ําหนักเกิน 110 กก.: 12'' x 34-36" (350L+)'
    - q: ยาวกว่านั้นSUPเร็วกว่าหรือเปล่า?
      a: ใช่บอร์ดที่ยาวกว่ามีอัตราส่วนความยาวต่อความกว้างที่ดีกว่า ช่วยลดแรงต้านบอร์ดทัวร์ริ่ง 14 ฟุตเร็วSUPกว่าบอร์ดอเนกประสงค์ 11 ฟุตอย่างมีนัยสําคัญเมื่อใช้แรงพายเท่ากัน
    - q: ความSUPกว้างเท่าไหร่ที่มั่นคงสําหรับมือใหม่?
      a: 33-34 นิ้วเป็นจุดที่เหมาะสมสําหรับผู้เริ่มต้นที่น้ําหนักไม่เกิน 90 กก.ต่ํากว่า 32 นิ้วต้องการสมดุลที่ดีถ้าสูงกว่า 34 นิ้วจะมั่นคงมากแต่ช้ากว่าและพายยากกว่าในลม
    - q: สามารถใช้บอร์ดอเนกประสงค์สําหรับการทัวร์ได้ไหม?
      a: ใช่ สําหรับทัวร์ระยะสั้นไม่เกิน 10 กม.สําหรับระยะทางไกล บอร์ดทัวร์เฉพาะทางจะติดตามเส้นทางได้ดีและครอบคลุมระยะทางได้อย่างมีประสิทธิภาพมากขึ้น
