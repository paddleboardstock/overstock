name: Deploy Shop

# Clearance shop (shop/ subdir) — full deployment pipeline, driven only by
# Cloudflare API credentials stored as repo secrets (shared with the main
# site's deploy.yml — nothing is deployed from local machines).
#
# One domain serves everything: shop.paddleboardoverstock.com
#   - Cloudflare Pages  → Astro storefront (custom domain)
#   - Worker route /api/* → shop-api worker (zone route wins over Pages)
#
# Idempotent: safe to re-run. Creates D1 / Pages project / custom domain / DNS
# record when missing, seeds the catalog only when the products table is empty,
# and preserves admin-created data.
on:
  push:
    branches: [main]
    paths: ['shop/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop
    steps:
      # secrets cannot be used in `if`; probe them first and expose as step
      # output so runs without credentials skip Cloudflare steps gracefully.
      # NB: runs before checkout, so it must NOT inherit the job-level
      # working-directory (shop/ does not exist yet) — override it to the
      # workspace root.
      - name: Check for Cloudflare credentials
        id: guard
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping deploy. Add these repo secrets to enable it."
          fi

      - name: Fail fast on manual dispatch without credentials
        if: github.event_name == 'workflow_dispatch' && steps.guard.outputs.enabled != 'true'
        working-directory: .
        run: |
          echo "::error::Manual deploy requested but CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are not set."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: shop/package-lock.json

      - run: npm ci
      - name: Typecheck worker
        run: npm run check:worker
      - name: Check storefront
        run: npm run check
      - name: Build storefront
        # PUBLIC_API_BASE stays empty → storefront calls same-origin /api/*,
        # served by the shop-api worker route on the same hostname.
        run: npm run build

      # ---------------- D1 database ----------------
      - name: Ensure D1 database exists
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set +e
          npx wrangler d1 create paddleboardoverstock-shop-db > /tmp/d1-create.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ] && ! grep -qiE "already exist|code: 10004|already_exists" /tmp/d1-create.log; then
            cat /tmp/d1-create.log
            exit 1
          fi
          cat /tmp/d1-create.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Inject D1 database_id into wrangler.toml
        if: steps.guard.outputs.enabled == 'true'
        run: |
          D1_ID=$(npx wrangler d1 info paddleboardoverstock-shop-db --json | jq -r '.uuid')
          if [ -z "$D1_ID" ] || [ "$D1_ID" = "null" ]; then
            echo "::error::Could not resolve D1 UUID for paddleboardoverstock-shop-db"
            exit 1
          fi
          echo "D1_ID=$D1_ID" >> "$GITHUB_ENV"
          sed -i \
            -e "s/REPLACE_WITH_D1_DATABASE_ID/$D1_ID/g" \
            -e "s/REPLACE_WITH_PRODUCTION_D1_DATABASE_ID/$D1_ID/g" \
            -e "s/REPLACE_WITH_STAGING_D1_DATABASE_ID/$D1_ID/g" \
            -e "s/REPLACE_WITH_PRODUCTION_D1_DATABASE_NAME/paddleboardoverstock-shop-db/g" \
            -e "s/REPLACE_WITH_STAGING_D1_DATABASE_NAME/paddleboardoverstock-shop-db/g" \
            workers/shop-api/wrangler.toml
          echo "[d1] database_id=$D1_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations (remote)
        if: steps.guard.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply paddleboardoverstock-shop-db --remote --config workers/shop-api/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Seed catalog (first run only)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          node scripts/seed-stock.mjs
          COUNT=$(npx wrangler d1 execute paddleboardoverstock-shop-db --remote --config workers/shop-api/wrangler.toml \
            --command "SELECT COUNT(*) AS c FROM products" --json | jq -r '.[0].results[0].c')
          if [ "$COUNT" = "0" ]; then
            npx wrangler d1 execute paddleboardoverstock-shop-db --remote --config workers/shop-api/wrangler.toml --file seed-stock.sql
            echo "[d1] products table was empty, seeded 56 SKUs (active, retail price = EXW wholesale)"
          else
            echo "[d1] products table already has $COUNT rows; skipping seed (admin changes preserved)"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ---------------- worker secrets ----------------
      - name: Sync shop-api worker secrets
        if: steps.guard.outputs.enabled == 'true'
        run: |
          jq -n '{
            STRIPE_SECRET_KEY: env.STRIPE_SECRET_KEY,
            STRIPE_WEBHOOK_SECRET: env.STRIPE_WEBHOOK_SECRET,
            SHOP_ADMIN_TOKEN: env.SHOP_ADMIN_TOKEN,
            SHOP_SESSION_SECRET: env.SHOP_SESSION_SECRET
          } | with_entries(select(.value != null and .value != ""))' > /tmp/shop-secrets.json
          if [ "$(jq length /tmp/shop-secrets.json)" -gt 0 ]; then
            npx wrangler secret bulk /tmp/shop-secrets.json --config workers/shop-api/wrangler.toml --env production
          else
            echo "::notice::No shop secrets configured — checkout will 502 until STRIPE_* / SHOP_* repo secrets are added."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SHOP_ADMIN_TOKEN: ${{ secrets.SHOP_ADMIN_TOKEN }}
          SHOP_SESSION_SECRET: ${{ secrets.SHOP_SESSION_SECRET }}

      # ---------------- worker deploy ----------------
      - name: Deploy shop-api worker (production)
        if: steps.guard.outputs.enabled == 'true'
        run: npx wrangler deploy --config workers/shop-api/wrangler.toml --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ---------------- Pages storefront ----------------
      - name: Ensure Pages project exists
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set +e
          npx wrangler pages project create paddleboardoverstock-shop --production-branch main > /tmp/pages-create.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ] && ! grep -qiE "already exist|code: 10004|already_exists" /tmp/pages-create.log; then
            cat /tmp/pages-create.log
            exit 1
          fi
          cat /tmp/pages-create.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy storefront to Pages
        if: steps.guard.outputs.enabled == 'true'
        run: npx wrangler pages deploy dist --project-name paddleboardoverstock-shop --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ---------------- custom domain + DNS ----------------
      - name: Attach Pages custom domain
        if: steps.guard.outputs.enabled == 'true'
        run: |
          set +e
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/paddleboardoverstock-shop/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"shop.paddleboardoverstock.com"}' > /tmp/domain-attach.json
          set -e
          if ! jq -e '.success' /tmp/domain-attach.json > /dev/null; then
            # tolerate "domain already attached" (code 8000018 / 8000007 or any
            # 'already' in the error text)
            if grep -qiE "8000018|8000007|already" /tmp/domain-attach.json; then
              echo "[pages] custom domain already attached"
            else
              cat /tmp/domain-attach.json
              exit 1
            fi
          else
            echo "[pages] custom domain attached"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # NB: step-level `env` is NOT visible to the step's own `if`, so the
      # zone-id presence check happens inside the script, not in the condition.
      - name: Ensure DNS record (shop → Pages)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          if [ -z "$CF_ZONE_ID" ]; then
            echo "::notice::CLOUDFLARE_ZONE_ID not set — skipping DNS step. Add a CNAME shop → paddleboardoverstock-shop.pages.dev (proxied) manually."
            exit 0
          fi
          EXISTING=$(curl -sS "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records?name=shop.paddleboardoverstock.com" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || echo '{}')
          COUNT=$(echo "$EXISTING" | jq -r '.result | length')
          if [ "$COUNT" != "0" ]; then
            echo "[dns] shop record already exists ($(echo "$EXISTING" | jq -r '.result[0].type') → $(echo "$EXISTING" | jq -r '.result[0].content')); leaving untouched"
            exit 0
          fi
          # Failure here is almost always a token-scope issue (Zone DNS Edit
          # missing) — surface it as a warning instead of failing the deploy:
          # the storefront is already live on *.pages.dev, only the vanity
          # hostname is missing.
          RESP=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"shop","content":"paddleboardoverstock-shop.pages.dev","proxied":true}')
          if echo "$RESP" | jq -e '.success' > /dev/null 2>&1; then
            echo "[dns] created CNAME shop → paddleboardoverstock-shop.pages.dev (proxied)"
          else
            echo "::warning::Could not create the DNS record (API token may lack Zone DNS Edit)."
            echo "$RESP" | jq -c '{success, errors}' 2> /dev/null || echo "$RESP"
            echo "::warning::Create it manually: CNAME shop → paddleboardoverstock-shop.pages.dev (proxied)."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Deploy summary
        if: steps.guard.outputs.enabled == 'true'
        run: |
          echo "## Shop deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storefront: https://shop.paddleboardoverstock.com (Pages project \`paddleboardoverstock-shop\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://shop.paddleboardoverstock.com/api/* (worker \`paddleboardoverstock-shop-api\`, route takes precedence over Pages)" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: \`paddleboardoverstock-shop-db\` (${D1_ID})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stripe webhook to register: https://shop.paddleboardoverstock.com/api/stripe/webhook" >> "$GITHUB_STEP_SUMMARY"
